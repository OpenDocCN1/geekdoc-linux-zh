    ## 2.5.6 SRDF control operations


    This section describes typical control operations that can be performed by the
    Solutions Enabler `symrdf` command.


    Solutions Enabler SYMCLI SRDF commands perform the following basic control operations
    on SRDF devices:


    - Establish synchronizes an SRDF pair by initiating a data copy from the source
    (R1) side to the target (R2) side. This operation can be a full or incremental
    establishment. Changes on the R2 volumes are discarded by this process.

    - Restore resynchronizes a data copy from the target (R2) side to the source (R1)
    side. This operation can be a full or incremental restore. Changes on the R1 volumes
    are discarded by this process.

    - Split stops mirroring for the SRDF pair(s) in a device group and write-enables
    the R2 devices.

    - Swap exchanges the source (R1) and target (R2) designations on the source and
    target volumes.

    - Failover switches data processing from the source (R1) side to the target (R2)
    side. The source volumes (R1), if still available, are write-disabled.

    - Failback switches data processing from the target (R2) side to the source (R1)
    side. The target side volumes (R2), if still available, are write-disabled.


    ### 2.5.6.1 Establishing an SRDF pair


    Establishing an SRDF pair initiates remote mirroring—the copying of data from
    the source (R1) device to the target (R2) device. SRDF pairs come into existence
    in two ways:


    - At configuration time through the pairing of SRDF devices. This is a static
    pairing configuration discussed earlier.

    - Anytime during a dynamic pairing configuration in which SRDF pairs are created
    on demand.


    A full establishment (`symrdf establish-full`) is typically performed after the
    SRDF pair is initially configured and connected via the SRDF links. After the
    first full establishment, users can perform an incremental establishment, where
    the R1 device copies to the R2 device only the new data that was updated while
    the relationship was split or suspended.


    To initiate an establishment operation on all SRDF pairs in a device or composite
    group, all pairs must be in the split or suspended state. The `symrdf query` command
    is used to check the state of SRDF pairs in a device or composite group.


    When the establishment operation is initiated, the system write-disables the R2
    device to its host and merges the track tables. The merge creates a bitmap of
    the tracks that need to be copied to the target volumes discarding the changes
    on the target volumes. When the establishment operation is complete and the SRDF
    pairs are in the synchronized state, The R1 device and R2 device contain identical
    data, and continue to do so until interrupted by administrative command or unplanned
    disruption. Figure 25 depicts SRDF establish and restore operations:


    ### SRDF establish and restore control operations


    The establish operation may be initiated by any host connected to either Symmetrix
    system, provided that an appropriate device group has been built on that host.
    The following command initiates an incremental establish operation for all SRDF
    pairs in the device group named MyDevGrp:


    ```

    symrdf -g MyDevGrp establish -noprompt

    ```


    When read/write access to a target (R2) device is necessary, the SRDF pair can
    be split. When the split completes, the target host can access the R2 device for
    operations. The R2 device contains valid data and is available for business continuity
    tasks or restoring to the R1 device if there is a loss of data on that device.


    While an SRDF pair is in the split state, I/O to the R1 can still occur. These
    updates changes on each Symmetrix system are tracked through bitmaps and are reconciled
    when normal SRDF mirroring operations are resumed. To initiate a split, an SRDF
    pair must be already in one of the following states:


    - Synchronized

    - Suspended

    - R1 updated

    - SyncInProg (if the -symforce option is specified for the split – resulting in
    a set of R2 devices that are *not dependent-write consistent and are not usable*)


    The split operation may be initiated from either host. The following command initiates
    a split operation on all SRDF pairs in the device group named MyDevGrp:


    ```

    symrdf -g MyDevGrp split -noprompt

    ```


    The symrdf split command provides exactly the same functionality as the symrdf
    suspend and symrdf rw_enable R2 commands. Furthermore, the split and suspend operations
    have exactly the same characteristics as SRDF consistency groups. Therefore, when
    SRDF pairs are in a single device group, users can split the SRDF pairs in the
    device group as shown previously and have restartable copies on the R2 devices.
    If the application data spans multiple Symmetrix systems or multiple RA groups,
    include SRDF pairs in a consistency group to achieve the same results.


    ![](img/9d79d979aef40e6535a55c940991009e_75_0.png)


    ### 2.5.6.2 Splitting an SRDF pair


    ### 2.5.6.3 Restoring SRDF pair


    When the target (R2) data must be copied back to the source (R1) device, the SRDF
    restore command is used (see Figure 25 on page 74). When an SRDF pair is split,
    the R2 device contains valid data and is available for business continuity tasks
    (such as running a new application) or restoring data to the R1 device. Moreover,
    if the results of running a new application on the R2 device need to be preserved,
    moving the changed data and new application to the R1 device is another option.


    Users may perform a full or incremental restore. A full restore copies the entire
    contents of the R2 device to the R1 device. An incremental restore is much quicker
    because it copies only new data that was updated on the R2 device while the SRDF
    pair was split. Any tracks on the R1 device are replaced with the corresponding
    tracks on the R2 device.


    To initiate a restore, an SRDF pair must already be in the split state. The restore
    operation can be initiated from either host. The following incremental restore
    operation on all SRDF pairs in the device group named the device group MyDevGrp
    (add the --full option for a full restore).


    ```

    symrdf -g MyDevGrp restore -noprompt

    symrdf -g MyDevGrp restore -noprompt -full

    ```


    The restore operation is complete when the R1 and R2 devices contain identical
    data. The SRDF pair is then in a synchronized state and may be reestablished by
    initiating the following command:


    ```

    symrdf -g MyDevGrp establish -noprompt

    ```


    ### 2.5.7 Failover and failback operations


    Having a synchronized SRDF pair allows users to switch data processing operations
    from the source site to the target site if operations at the source site are disrupted
    or downtime becomes scheduled for maintenance. This switchover from source to
    target is called failover. When operations at the source site are back to normal,
    a failback operation is used to reestablish I/O communications between source
    and target, resynchronize the data between the sites, and resume normal operations
    on the R1 devices as shown in Figure 26, which illustrates the failover and failback
    operations.


    ![](img/9d79d979aef40e6535a55c940991009e_76_0.png)


    Figure 26 SRRD failover and failback control operations


    The failover and failback operations relocate the processing from the source site
    to the target site or vice versa. This may or may not imply movement of data.


    ### 2.5.7.1 Failover


    Scheduled maintenance or storage system problems can disrupt access to production
    data at the source site. In this case, a failover operation can be initiated from
    either host to make the R2 device read/write-enabled to its host. Before issuing
    the failover, all applications services on the R1 volumes must be stopped. This
    is because the failover operation makes the R1 volumes read-only. The following
    command initiates a failover on all SRDF pairs in the device group MyDevGrp:


    ```

    symrdf -g MyDevGrp failover -noprompt

    ```


    To initiate a failover, the SRDF pair must already be in one of the following
    states:


    - Synchronized

    - Suspended

    - R1 updated

    - Partitioned (when invoking this operation at the target site)


    The failover operation:


    - Suspends data traffic on the SRDF links

    - Write-disables the R1 devices

    - Write-enables the R2 devices


    ### 2.5.7.2 Fallback


    To resume normal operations on the R1 side, a failback (R1 device takeover) operation
    is initiated. This means read/write operations on the R2 device must be stopped,
    and read/write operations on the R1 device must be started. When the failback
    command is initiated, the R2 becomes read-only to its host, while the R1 becomes
    read/write-enabled to its host. The following command performs a failback operation
    on all SRDF pairs in the device group MyDevGrp:


    ```

    symrdf -g MyDevGrp failback -noprompt

    ```


    The SRDF pair must already be in one of the following states for the failback
    operation to succeed:


    - Failed over

    - Suspended and write-disabled at the source

    - Suspended and not ready at the source

    - R1 Updated

    - R1 UpdnProg


    The failback operation:


    - Write-enables the R1 devices.

    - Performs a track table merge to discard the changes on the R1s.

    - Transfers the changes to the R2s.

    - Resumes traffic on the SRDF links.

    - Write-disables the R2 volumes.

