    要理解校验是如何工作的，可以把磁盘上的每个数据块想象成一个非常大的整数（长度为 32,768 位），而 RAID 负责使用这些整数进行简单的数学运算——每个校验块可以被视为该条带中所有数据块之和的大型整数。图
    34  own了一个简单的示例。


    | 数据值 1 | 数据值 2 | 数据值 3 | 校验值 |

