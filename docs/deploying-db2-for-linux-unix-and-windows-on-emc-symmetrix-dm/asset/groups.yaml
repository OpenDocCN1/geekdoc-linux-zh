    <-h | -?>

    ```


    where:


    * Variable — Identifies the registry variable whose value is to be displayed,
    set, or removed.

    * Value — Identifies the value that is to be assigned to the registry variable
    specified. If no value is provided, but a registry variable is specified, the
    registry variable is deleted.

    * InstanceName — Identifies the instance profile with which the specified registry
