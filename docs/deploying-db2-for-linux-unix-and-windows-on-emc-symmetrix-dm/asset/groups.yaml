    \n# I\n\n# ID\n标识符（Identifier），用于识别程序、设备、控制器或系统的位序列或字符序列。\n\n# IML\n初始微程序加载（Initial\
    \ micro program loading）。\n\n# 索引标记 (index marker)\n表示道的物理起始和结束。\n\n# 索引点 (index\
    \ point)\n磁盘表面上确定道起始的参考点。\n\n# I/O 设备 (I/O device)\n可寻址的输入输出单元，例如磁盘设备。\n\n# K\n\
    \n# K\n千（Kilobyte），1024 字节。\n\n# L\n\n# 最少使用算法 (LRU)\n通过移除最少使用的数据来识别并释放缓存的算法。\n\
    \n# 逻辑卷 (logical volume)\n定义的存储设备。在 5200 中，可以将一个物理设备定义为一个或两个逻辑卷。\n\n# 长缺失 (long\
    \ miss)\n请求的数据不在缓存中，且正在获取过程中。\n\n# 链路冗余码 (LRC)\n记录中累积字节的异或（XOR）。\n\n# M\n- MB\n\
    兆字节（Megabyte），$10^6$ 字节。\n- 镜像 (mirroring)\nSymmetrix 在独立磁盘上维护指定卷的两个副本。写入期间会自动更新。如果一个磁盘设备故障，Symmetrix\
    \ 会使用另一个磁盘设备。\n- 镜像对 (mirrored pair)\n数据在两个设备上各记录一次的逻辑卷。\n\n# P\n- 物理 ID (physical\
    \ ID)\n  执行 E 操作的 Symmetrix 通道器的物理识别号。该值每安装一个自动增加一。该号在主机系统中必须是唯一的。它被称为 SCU_ID。\n\
    - 主道 (primary track)\n存储数据的原始道。另见“备用道 (alternate track)”。\n- 提升 (promotion)\n\
    将磁盘设备上的数据移动到缓存的过程。\n\n# R\n- 读命中 (read hit)\n读取操作的数据在缓存中。\n- 读缺失 (read miss)\n\
    读取操作的数据不在缓存中。\n- 记录零 (record zero)\n主地址后的第一个记录。\n\n# S\n- 清扫 (scrubbing)\n读取、检查纠错位并将纠正后的数据写回源设备的过程。\n\
    - SCSI 适配器 (SCSI adapter)\nSymmetry 子系统中提供磁盘通道器与磁盘设备之间物理接口的显卡。\n- 短缺失 (short miss)\n\
    请求的数据不在缓存中，但正在获取过程中。\n- SSID\n对于 3990 存储控制仿真，此值标识逻辑 DASD 的物理组件。SSID 在主机系统中必须是唯一的数字。它应该是偶数并从零开始。\n\
    - 阶段写入 (stage)\n将数据从磁盘设备写入到缓存的过程。\n- 存储控制单元 (storage control unit)\nSymmetrix\
    \ 子系统中负责连接 Symmetrix 到主机通道的组件。它执行通道命令并与磁盘通道器和缓存通信。另见“通道通道器”。\n- 字符串 (string)\n\
    共享同一个磁盘通道器的系列连接磁盘设备。\n\n# U\n- 单元地址 (unit address)\n  在 MVS 环境下，唯一定义通道路径上物理 I/O\
    \ 设备的十六进制值。另见“设备地址 (device address)”。\n\n"
