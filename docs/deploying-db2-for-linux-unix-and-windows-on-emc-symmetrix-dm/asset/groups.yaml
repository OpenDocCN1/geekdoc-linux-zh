    # 1.3 Server, instances, and databases


    DB2 9.5 for Linux, UNIX, and Windows sees the world as a hierarchy of objects.
    Workstations (or servers) on which DB2 has been installed occupy the highest level
    of this hierarchy. During the installation process, program files for a background
    process known as the DB2 Manager are physically copied to a specific location
    on the server and an instance of the DB2 Database Manager is created. (The default
    instance for a particular system is defined by the DB2INSTANCE environment variable
    and this is the instance used for most operations.)


    Instances occupy the second level in the hierarchy and are responsible for managing
    system resources and databases that fall under their control. Although only one
    instance is created initially, several instances can exist. Each instance behaves
    like a separate installation of DB2, even though all instances within a system
    share the same DB2 Manager program files (unless each instance is running a different
    version of DB2). And although multiple instances share the same binary code, each
    runs independently of the others and has its own environment, which can be modified
    by altering the contents of its associated configuration file.


    Every instance controls access to one or more databases; databases manage storage,
    modification, and retrieval of data. Like instances, databases work independently
    of each other. Each database has its own set of grantable authorities and privileges
    to govern how users interact with the data and database objects it controls. From
    a user''s perspective, a database is a collection of tables (preferably related
    in some way) that are used to store data. However, from a database administrator''s
    viewpoint, a DB2 9.5 database is much more; a database is an entity that is comprised
    of many physical and logical components. Some of these components help determine
    how data is organized, while others determine how and where data is physically
    stored. Figure 7 on page 30 shows the hierarchical relationship between systems,
    instances, and databases.'
