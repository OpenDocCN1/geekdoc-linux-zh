    ## 4.6 Shared nothing design on a shared everything array


    With careful planning, it is possible to implement a “shared nothing” design on
    a “shared everything” storage array. It is important to note that a “shared nothing”
    implementation on a Symmetrix DMX does not require the segregation of Symmetrix
    cache, the dedication of front-end host directors, or the isolation of back-end
    directors. Essentially, the shared nothing design is about the physical disks
    themselves.


    A successful partitioned database layout on a Symmetrix DMX storage array will
    ensure that no two containers for the same table space will reside on the same
    physical spindle. By adhering to this simple rule, contention that might otherwise
    occur during a full table scan can be avoided. Figure 43 illustrates a storage
    array where designated sets of disks within the array are dedicated to individual
    database partitions. (Each database partition in the diagram is depicted as “owning”
    eight physical disk spindles).


    ![](img/9d79d979aef40e6535a55c940991009e_138_0.png)


    Figure 43 Shared nothing configuration at the disk level


    Allocating disks for individual database partitions is easy. The challenge, of
    course, is to provide a sufficient number of disk heads to satisfy the throughput
    requirements for each database partition. Careful analysis must be performed before
    implementation to determine if the configuration chosen can deliver the required
    performance.


    Figure 44 on page 138 depicts a shared-nothing implementation on a Symmetrix DMX.
    Here, each column of disks represents a RAID 5 (3+1) group; each database partition
    is presented with eight disks that are comprised of two RAID 5 (3+1) groups. The
    unit of space allocation is approximately 270 GB raw, or 200 GB usable. Again,
    the challenge is to meet the performance requirements of the application when
    presenting a small number of disks to each partition.


    ## Considerations for Partitioned Databases


    ![](img/9d79d979aef40e6535a55c940991009e_139_0.png)


    Figure 44 Shared nothing configuration on Symmetrix DMX


    When more advanced features of the Symmetrix DMX, such as metavolumes, are used,
    the minimum partition unit of allocation is very large. It is not advisable to
    use this type of functionality when designing a shared-nothing configuration on
    Symmetrix DMX except for the very largest of partitioned database configurations.


    ## 4.7 Partitioned database-specific recommendations


    The following best practices, if adhered to, allow a partitioned database to be
    successfully deployed on Symmetrix DMX storage.


    ### 4.7.1 RAID recommendations


    Because RAID 5 provides an economical compromise between price and performance,
    it is an excellent choice for partitioned data warehouses – particularly 10 percent
    or less of the database activity is comprised of write operations. While RAID
    5 configurations do incur a moderate performance penalty with write operations,
    data warehouse activity is usually read-intensive and therefore is not affected
    by this penalty as high-write OLTP database might be. The additional space that
    can be provisioned from a RAID 5 configuration (compared to RAID 1) is a big economic
    incentive for large data warehouses.


    In a partitioned database environment, RAID 5 is recommended for all storage devices
    that will be used to house table space data. Active logs may also be placed on
    RAID 5 devices since the write rate to the logs in a data warehouse environment
    is typically very low.


    RAID 5+1 is the preferred configuration for Symmetrix DMX. Each RAID set (that
    is all disks in the set) must be owned by a single database partition (not shared
    with other partition of the database) unless the methods described in Section
    4.6 and 4.7 are implemented.


    ### 4.7.2 LUN sizes


    Ideally, RAID 5 hypervolumes/LUNs will be between 30 GB and 60 GB. More LUNs will
    allow a greater number of I/O requests to be queued from the host; however, hypervolumes
    will increase the time it takes to boot the server, which can be a concern for
    very large database sizes. Less hypervolumes reduce the amount of time required
    to boot the server, but may not allow for a more granular approach to allocating
    storage. (The actual number of LUNs that are presented to a server is based on
    the HBA configuration used.)


    ### 4.7.3 Temporary table spaces


    In a data warehouse environment, temporary table spaces can be the hardest hit
    table spaces in the database, in particular in terms of the number of requests
    requested. Ideally, temporary table spaces should be placed on RAID 1 LUNs to
    avoid the RAID 5 write penalty and isolate temporary table space data from regular
    table space data. In reality, the amount of space required by a temporary table
    space usually does not merit dedicating spindles for isolation purposes. For this
    reason, temporary table space data is often colocated with regular table space
    data. Because of this, it is recommended that temporary table spaces be spread
    across all spindles owned by the database. This way, the I/O burden of manipulating
    temporary data can be divided up as many spindles as possible.


    ### 4.7.4 Container stripping within a partition


    When LUNs are provisioned to the host from the same RAID set, each may be taken
    to not provide multiple containers from these LUNs for the same table space. The
    easiest way to manage and control this type of configuration is to create a non-striped
    logical volume that spans all the LUNs that come from the same RAID group. Only
    one table container should be provided by this logical volume.


    ## Considerations for Partitioned Databases


    ### 4.7.5 Logical volume manager


    Notwithstanding the directions outlined in the prior section, each LUN presented
    to the host should be made a logical volume and presented as such. This will prevent
    logical volume manager (LVM) striping, which is generally not a good thing for
    DB2.


    ## 4.8 Multiple partition groups sharing disks


    Earlier, we saw that in a partitioned database environment, you are not restricted
    to having every table and table space span all partitions in a database. DB2 supports
    partial declustering, which means that you can divide table spaces across a subset
    of database partitions. Users can determine which and how many database partitions
    their data is to be distributed through the use of partition groups.


    Figure 45 shows a layout where four partition groups own a portion of the physical
    disks that have been assigned to a database. Each partition group is spread across
    every disk but each disk can have partitions allocated to multiple groups. (A
    given table space is distributed across a single partition group.) This way, specific
    partitions will process a given read request and the parallel actions generated
    will not create contention with each other.


    ![](img/9d79d979aef40e6535a55c940991009e_141_0.png)


    Figure 45 Shared everything including disk — multiple partition groups


    With such a configuration, it could be argued that since only a subset of the
    database partitions can process any single table scan, the parallelism provided
    by DB2 is reduced. It could equally be argued that the disks themselves predetermine
    the level of I/O parallelism, and since each partition group can access every
    disk the maximum level of parallelism can be achieved.


    ## 4.9 Multiple partitioned databases sharing disks


    Another potential solution for laying out partitioned databases on shared arrays
    is to share spindles between partitioned databases, but not share spindles for
    the same database. This concept is based on the fact that databases have their
    peaks and troughs at different times and that even contention may occur between
    the different databases collocated on the same set of physical disks, contention
    cannot be attributable to a single query for a single database. Figure 46 shows
    how such a configuration would look.


    ![](img/9d79d979aef40e6535a55c940991009e_142_0.png)


    Figure 46 Shared everything including disk — multiple databases

