    - 创建、修改和删除缓冲池、表空间、表、视图、索引、别名、触发器、架构和用户定义数据类型（UDIs）。

    - 授予和撤销权限和许可。

    - 导出、导入或加载数据。

    - 重组表并收集表统计。

    - 备份和恢复数据库及表空间。

