    #  5.1 What happens when a DB2 9.5 database is created


    Regardless of how the process is initiated, whenever a new DB2 9.5 database is
    created, the following tasks are performed, in the order:


    +   1. All directories and subdirectories needed are created in the appropriate
    location.

    Information about every DB2 database is stored in a special hierarchical directory
    tree. Where this tree is actually created is determined by information provided
    with the CREATE DATABASE command — if no location is provided, this tree is created
    in the location specified by the dfpath DB2 Database Manager configuration parameter
    associated with the instance under which the database is being created. The root
    directory of this tree is assigned the name of the instance with which the database
    is associated. This directory will contain a subdirectory that corresponds to
    the partition''s node. If the database is a partitioned database, this directory
    will be named NODEXXXX, where XXXX is the unique number that has been assigned
    to the partition; if the database is unpartitioned database, this directory will
    be named NODE0000. The node-name directory, in


    Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetrix DMX'
- md: '

    turn, will contain one subdirectory for each database that has been created, with
    one subdirectory that includes the containers that are used to hold the database''s
    data.


    The name assigned to the subdirectory that holds the containers used to house
    the database''s data is the same as that specified for the database; the name
    assigned to the subdirectory that contains the base files for the database corresponds
    to the token that is assigned to the database during the creation process (the
    subdirectory for the first database will be named SQL00001, the subdirectory for
    the second database will be named SQL00002, and so on).


    Figure 10 illustrates how this directory hierarchy typically looks in a nonpartitioned
    database environment.


    ![](img/9d79d979aef40e6535a55c940991009e_38_0.png)


    Figure 10 Typical directory hierarchy tree for a nonpartitioned database


    # IMPORTANT


    Never attempt to modify this directory structure or any of the files stored in
    it. Such actions could destroy one or more databases or make them unusable.


    Files needed for management, monitoring, and database recovery are created.


    After the subdirectory that was assigned the name of the database''s token is
    created, the following files are created in it:


    - db2rhist.asc — This file contains historical information about backup operations,
    restore operations, table load operations, table reorganization operations, space
    allocations, and similar database changes (i.e., the recovery history file).

    - db2rhist.bak — This file is a backup copy of db2rhist.asc.

    - SQLBP.1 — This file contains buffer pool information.

    - SQLBP.2 — This file is a backup copy of SQLBP.1.

    - SQLDBCON — This file contains database configuration information.

    - SQLDBCNF — This file contains information that is used to ensure that the database
    is assigned to only one instance of the DB2 Manager.

    - SQLOGCTL.LFH — This file contains information about active transaction log files.
    Recovery operations use information stored in this file to determine how far back
    in the logs to begin the recovery process.

    - SQLOGMIR.LFH — This is a mirrored copy of SQLCTL.LFH.

    - SQLGSF.1 — This file contains storage path associated with automatic storage.

    - SQLGSF.2 — This file is a backup copy of SQLGSF.1.

    - SQLSPCS.1 — This file contains table space information.

    - SQLSPCS.2 — This file is a backup copy of SQLSPCS.1.

    - SQLTMPLK — This file contains information about temporary table spaces.


    Two subdirectories DB2EVENT and SQLLOGDIR are created; detailed event monitor
    files named S0000000.LOG, S0000001.LOG, and S0000002.LOG are created and stored
    in the SQLLOGDIR directory. These three files are used to store transaction records
    as SQL operations are performed over the database.


    A buffer pool is created for the database.


    During the database creation process, a buffer pool is created and assigned the
    name IBMDEFAULTBP. By default, on Linux and UNIX platforms, this buffer pool is
    1,000 KB(kilobyte) pages in size; on Windows platforms, this buffer pool is 250
    KB pages in size. The actual memory used by this buffer pool (and for any other
    buffer pools that may exist) is allocated when the first connection to the database
    is established and freed when all connections to the database have been terminated.


    Two regular table spaces and one temporary table space are created.


    Immediately after the buffer pool IBMDEFAULTBP is created, three table spaces
    are created and associated with this buffer pool. These three table spaces are
    as:


    - A regular table space named SYCSSPACE, which is used to store the system catalog
    tables and views associated with the database

    - A regular table space named USERS1, which is used to store all user-defined
    objects (such as tables, indices, and so on) along with user data


    # Introduction to DB2 9.5 for Linux, and Windows


    - A system temporary table named TEMPSPACE1, which is used as temporary storage
    area for operations such as sorting data, reorganizing tables, and creating indexes


    Unless otherwise specified, SYSCSPACE and USERSPACE1 are DMS FILE table spaces,
    and TEMSPACE1 is a SMS table space; characteristics of each of these tables can
    be provided as input to the CREATE DATABASE command or the Create Database Wizard.


    5. The system catalog tables and views are created.


    After the table SYSCSPACE is created, a special set of tables, known as the system
    catalog tables, constructed within that table. The DB2 Database Manager uses the
    system catalog tables to keep track of information such as object definitions,
    database object dependencies, database object privileges, column data types, table
    constraints, and object relationships. A set of system catalog views is created
    along with the system catalog tables, and these views are typically used when
    accessing data stored in the system catalog tables. The system catalog tables
    and views cannot be modified with SQL statements (however, their contents can
    be viewed). Instead, they are modified by the DB2 Manager whenever one of the
    following events occurs:


    - A database object (such as a table, view, or index) is created, altered, or
    dropped.

    - Authorizations or privileges are granted or revoked.

    - Statistical information is collected for a table.

    - Packages are bound to the database.


    In most cases, the complete characteristics of a database object are stored in
    one or more system catalog tables when the object is created. However, in some
    cases, as when triggers and constraints are defined, the actual DB2.5 SQL used
    to create the object is stored inside.


    6. The database is cataloged in the system and local database directory (a system
    or local database directory created first if it does not exist).


    DB2 uses a set of special files to keep track of where databases are stored and
    to provide access to those databases. The information stored in these files is
    used like the information stored in an office-building is used, and is referred
    to as directories. Whenever a database is created, these directories are updated
    with the database''s name and alias. If specified, a comment and code set are
    also stored in these directories.


    7. The database configuration file for the database is initialized.


    Some of the parameters in the database configuration file (such as code set, territory,
    and collation sequence) will be set using values that were specified as input
    for the CREATE DATABASE command or the Create Database Wizard, others are assigned
    system default values.


    8. Four schemas are created.


    Schemas are objects that are used to logically classify and group other objects
    in the database. Once the system catalog tables and views are created, the following
    schemas are created: SYSIBM, SYSCAT, SYSSTAT, and SYFSUN. A special user named
    SYSIBM is the owner of each.


    # Introduction to DB2 9.5 for Linux, UNIX, and Windows


    9. A set of utility programs is bound to the database.

    Some of the DB2 9 utilities available can work with a database, the packages needed
    to run those utilities must be created. Such packages are created by binding a
    set of predefined DB2 Database manager bind files to the database (the bind files
    used are stored in the database bind list db2bind.lst)


    10. Authorities and privileges are granted to the appropriate users.

    To connect and work with a particular database, a user must have the authorities
    and privileges needed to use that database. Therefore, unless otherwise specified,
    whenever a new database is created the following authorities and privileges are
    granted:


    - Database Administrator (DBADM) authority as well as CONNECT, CREATAB, BINDADD,
    CREATE_NOT_FENCED, IMPLICIT_SCHEMA, and LOAD privileges are granted to the user
    who created the database.

    - USE privilege on the table space USSPACE1 is granted to the group

    - CONNECT, CREATAB, BINDADD, and IMPLICIT_SCHEMA privileges are granted to the
    group PUBLIC.

    - SELECT privilege on each system catalog table is granted to the group PUBLIC.

    - EXECUTE privilege on all procedures found in the SYSIBM schema is granted to
    the group PUBLIC.

    - EXECUTE WITH GRANT privilege on all functions in the SYSFUN schema is granted
    to the group PUBLIC.

    - BIND and EXECUTE privileges for each successfully bound entity are granted to
    the group PUBLIC.


    11. Several autonomic features are enabled.

    To help management easy, whenever a new database is created, the following autonomic
    features are enabled:


    - Automatic Maintenance (database backups, table and index reorganization, data
    access optimization, and statistics profiling)

    - Self-Tuning Memory Manager (package cache, locking memory, sort memory, database
    shared memory, and buffer pool memory)

    - Utility throttling

    - The Health Monitor


    12. The Configuration Advisor is launched.

    The Configuration Advisor is a tool designed to help you tune performance and
    balance memory requirements for a database by suggesting what configuration parameters
    to modify based on information you provide about the database. In DB2 9, the Configuration
    Advisor is automatically invoked whenever you create a database, unless the default
    behavior is changed by assigning the value NO to the DB2_ENABLE_AUTONFIG_DEFAULT
    registry variable.

