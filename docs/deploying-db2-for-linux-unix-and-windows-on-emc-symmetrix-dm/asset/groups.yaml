    ## 2.5.6 SRDF 控制操作


    本节描述了通过 Solutions Enabler `symrdf` 命令可以执行的典型控制操作。


    Solutions Enabler SYMCLI SRDF 命令对 SRDF 设备执行以下基本控制操作：


    - Establish（建立）：通过从源端（R1）侧到目标端（R2）侧启动数据复制，建立同步的 SRDF 对。此操作可以是全量建立或增量建立。此过程会丢弃
    R2 卷上的更改。

    - Restore（恢复）：从目标端（R2）侧到源端（R1）侧重新同步数据复制过程。此操作可以是全量恢复或增量恢复。此过程会丢弃 R1 卷上的更改。

    - Split（拆分）：停止设备组中 SRDF 对的镜像，并启用 R2 设备的写入。

    - Swap（交换）：交换源卷和目标卷上的源端（R1）和目标（R2）标记。

    - Failover（故障转移）：将数据处理从源端（R1）侧切换到目标端（R2）侧。如果源卷（R1）仍然可用，则对其进行禁用写入。

    - Failback（回切）：将数据处理从目标端（R2）侧切换回源端（R1）侧。如果目标端卷（R2）仍然可用，则对其进行禁用写入。


    ### 2.5.6.1 建立 SRDF 对


    建立 SRDF 对会启动远程镜像——即从源端（R1）设备到目标端（R2）设备的数据复制过程。SRDF 对通过两种方式产生：


    - 在配置时，通过 SRDF 设备的配对进行建立。这是前文讨论的静态配对配置。

    - 在动态配对配置期间的任何时候，根据需要创建 SRDF 对。


    通常在 SRDF 对完成初始配置并通过 SRDF 链路连接后，会执行全量建立（`symrdf establish-full`）。在完成首次全量建立后，用户可以执行增量建立，此时
    R1 设备仅向 R2 设备复制在关系拆分（split）或挂起（suspended）期间更新的新数据。


    要在设备组或复合组中的所有 SRDF 对上启动建立操作，所有对必须处于拆分（split）或挂起（suspended）状态。使用 `symrdf query`
    命令检查设备组或复合组中 SRDF 对的状态。


    当建立操作启动时，系统会对其主机上的 R2 设备禁用写入并合并轨道表。合并过程会创建一个需要复制到目标卷的轨道位图，在此过程中会丢弃目标卷上的更改。当建立操作完成且
    SRDF 对处于同步（synchronized）状态时，R1 设备和 R2 设备包含相同的数据，并一直保持一致，直到被管理命令中断或意外故障。图 25 展示了
    SRDF 建立和恢复操作：


    ### SRDF 建立和恢复控制操作


    建立操作可以由连接到任一 Symmetrix 系统的主机启动，前提是该主机上已构建了适当的设备组。以下命令为名为 MyDevGrp 的设备组中的所有 SRDF
    对启动增量建立操作：


    ```

    symrdf -g MyDevGrp establish -noprompt

    ```


    当需要对目标（R2）设备进行读/写访问时，可以对该 SRDF 对进行拆分（split）。当拆分完成后，目标主机可以访问 R2 设备进行操作。R2 设备包含有效数据，并可用于业务连续性任务或在设备数据丢失时恢复到
    R1 设备。


    当 SRDF 对处于拆分（split）状态时，仍然发生指向 R1 的 I/O。每个 Symmetrix 更改通过位图跟踪，并在恢复 SRDF 镜像操作时进行协调。要启动拆分，SRDF
    对必须处于以下状态之一：


    - 同步（Synchronized）

    - 挂起（Suspended）

    - R1 已更新（R1 updated）

    - 同步中（SyncInProg）（拆分时指定了 -symforce 一组*非写入一致且不可用的*R2 设备）


    拆分（split）操作可以从任一主机启动。以下命令对名为 MyDevGrp 的设备组中的所有 SRDF 对启动拆分操作：


    ```

    symrdf -g MyDevGrp split -noprompt

    ```


    symrdf split 命令的功能与 `symrdf suspend` 和 `symrdf rw_enable R2` 命令相同。此外，拆分和挂起操作与
    SRDF 一致组具有相同的特性。因此，当 SRDF 对位于单个设备组时，用户可以拆分所示的设备组中的 SRDF 对，并在 R2 设备上拥有可重启的副本。如果应用程序跨越多个
    Symmetrix 系统或多个组，请将 SRDF 对包含在一致组中实现相同结果。


    ![](img/9d7997aef40e653555c941009e_75_0)


    ### 2.5.6.2 拆分 SRDF 对


    ### 2.5.6.3 恢复 SRDF 对


    当必须将目标（R2）数据复制回源（R1）设备时，使用 SRDF restore 命令（见第 74 页图 25）。当拆分分时，R2 设备包含有效数据，可用于业务连续性任务（如运行新应用程序）或恢复到
    R1 设备。此外，如果需要保留 R2 设备上运行应用程序的结果，将更改的数据和应用程序移动到 R1 设备是另一个选项。


    用户可以执行全量或增量恢复。全量恢复将 R2 设备的所有内容复制到 R1 设备。增量恢复快得多，因为它只复制 SRDF 对拆分期间 R2 设备上更新的新数据。R1
    设备上的任何轨道都由 R2 设备上相应的轨道替换。


    要启动恢复，SRDF 对必须已处于拆分（split）状态。恢复操作可以从任一主机启动。对名为 MyDevGrp 的设备组中的所有 SRDF 对执行以下增量恢复（全量恢复添加
    --full 选项）：


    ```

    symrdf -g MyDevGrp restore -noprompt

    symrdf -g MyDevGrp restore -noprompt -full

    ```


    当 R1 和 R2 设备包含相同数据时，恢复操作完成。此时 SRDF 对处于同步状态，可以通过以下命令重新建立：


    ```

    symrdf -g MyDevGrp establish -noprompt

    ```


    ### 2.5.7 故障转移和回切操作


    同步 SRDF 对允许用户在源站点操作中断或计划维护期间，将数据处理操作切换到目标站点。这种从源到目标的切换被称为故障转移（failover）。当源站点操作恢复正常时，使用回切（failback）操作重新建立源和目标之间的
    I/O 通信，同步站点之间的数据，并如图 26 所示恢复 R1 设备的正常操作。


    ![](img/9d7997aef40e653555c941009e_76_0)


    图 26 SR 故障转移和回切控制操作


    故障转移和回切操作将处理从源站点迁移到目标站点或反之。这可能也不意味着数据的移动。


    ### 2.5.7.1 故障转移


    计划维护或存储系统问题可能会中断源站点生产数据的访问。在这种情况下，可以从任一主机启动故障转移操作，使 R2 设备对其主机开启。在发布故障转移之前，必须停止
    R1 卷上的所有应用程序服务。这是因为故障转移操作会将 R1 卷变为只读。以下命令对 MyDevGrp 设备组中的所有 SRDF 对启动故障转移：


    ```

    symrdf -g MyDevGrp failover -noprompt

    ```


    要启动故障转移，SRDF 对必须已处于以下状态之一：


    - 同步（Synchronized）

    - 挂起（Suspended）

    - R1 已更新（R1 updated）

    - 分（Partitioned）（在目标站点调用此操作时）


    故障转移操作：


    - 挂起 SRDF 链路上的数据流量

    - 对 R1 设备禁用写入

    - 对 R2 设备启用写入


    ### 2.5.7.2 回切


    为了在 R1 侧恢复正常操作，将启动回切（R1 设备接管）操作。这意味着必须停止 R2 设备上的读/写操作，并启动 R1 设备上的读写写操作。当启动回切命令时，R2
    对其主机变为只读，而 R1 对其主机变为读写启用。以下命令对 MyDevGrp 设备组中的所有 SRDF 对执行回切操作：


    ```

    symrdf -g MyDevGrp failback -noprompt

    ```


    SRDF 对必须已处于以下状态之一，回切操作才能成功：


    - 故障转移（Failed over）

    - 源端挂起且禁用写入

    - 源端挂起且未就绪

    - R1 已更新（R1 Updated）

    - R1 更新中（R1 UpdnProg）


