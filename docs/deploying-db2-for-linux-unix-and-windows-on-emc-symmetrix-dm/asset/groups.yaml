    Snap 设备。在随后的激活中，目标虚拟设备将对主机可见。除非主机虚拟设备更改了数据，否则虚拟设备始终呈现激活时点源设备的冻结副本。当不再需要这些信息时，可以终止会话。


    TimeFinder/Snap 操作通过主机上的 `synsnap` 命令控制，用于创建、激活和恢复本节描述的 TimeFinder/Snap 操作。本节解释了如何通过
