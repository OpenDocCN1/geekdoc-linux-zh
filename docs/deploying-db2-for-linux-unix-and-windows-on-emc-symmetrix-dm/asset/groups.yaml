    # 4.1 Partitioned DB2 database environments


    As the name implies, a partitioned database is a database that spans two or more
    database partitions, allowing data to be distributed across each partition used.
    Sometimes a database node or node, a DB2 database partition contains its own data,
    indexes, configuration files, and transaction log files and is only a portion
    of a larger database. Data retrieval and update requests are decomposed automatically
    into sub-requests, and executed in parallel among all applicable database partitions.
    The fact that the database is split across multiple database partitions is transparent
    to users using SQL statements.


    In most partitioned database environments, each database partition resides on
    its own physical workstation (server), and has its own processor, memory, and
    disks. Because of this, the environment is referred to as a “shared-nothing” environment
    because memory and storage are not shared between partitions. Instead, database
    partitions are connected to each other by a communications facility known as the
    fast communications manager (FCM). Figure 39 illustrates a typical DB2 LUW partitioned
    environment.


    ![](img/9d79d979aef40e6535a55c940991009e_131_0.png)


    Figure 39 A typical DB2 LUW partitioned environment


    In a shared-nothing environment, it is easy to add more database partitions as
    needed. However, there may be practical limits on managing a high number of machines
    and instances. If maximum capacity is reached, each database partition can be
    moved to a server that contains multiple processors. With this change, data retrieval
    and update requests against the database can be distributed across multiple processors,
    as well as multiple servers.


    On machines like IBM pSeries and iSeries servers, database partitions can reside
    on individual logical partitions (also known as LPARs). A logical database partition
    differs from a physical one that it is not given control of the entire server.
    Although a partitioned server has shared resources, database partitions created
    on a partitioned server do not share all of those resources – processors are shared
    but disks and memory are not.'
