    ## 1.2 DB2’s comprehensive tool set


    With the exception of DB2 Everyplace, DB2 for i/OS, and DB2 for z/OS, each edition
    of DB2 comes with a comprehensive set of tools designed to assist in administering
    and managing DB2 instances, databases, and data objects. The majority of these
    tools have a graphical user interface (GUI); however, most of the tasks that can
    be performed with the GUI tools available also be performed by issuing equivalent
    DB2 commands from the operating system prompt, the DB2 Command Editor, or the
    DB2 Command Line Processor. Of this set, the tools are most often used:


    - The Control Center

    - The Command Editor

    - The Configuration Assistant

    - The Command Line Processor


    ### 1.2.1 The Control Center


    Of the DB2 GUI tools available, the Control Center is the most important and versatile.
    The Control Center presents a clear, concise view of an entire system and serves
    as the central point for managing DB2 systems and performing common administration
    tasks. With the Control Center, users:


    - Create and delete instances.

    - Create and delete (drop) DB2 databases.

    - Catalog and uncatalog databases.

    - Configure instances and databases.

    - Create, alter, and drop buffer pools, table spaces, tables, views, indexes,
    aliases, triggers, schemas, and user-defined data types (UDIs).

    - Grant and revoke authorities and privileges.

    - Export, import, or load data.

    - Reorganize tables and collect table statistics.

    - Back up and restore databases and table spaces.

    - Replicate data between systems.

    - Manage database connections.

    - Monitor resources and track event as they take place.

    - Analyze queries.

    - Schedule jobs to run unattended.


    The Control Center interface presents itself using one of three different views:


    - Basic. The basic view displays essential objects such as databases, tables,
    views, and stored procedures and limits the actions you can perform to those objects.
    This is the view you should use if you only want to perform core DB2 database
    operations.

    - Advanced. The advanced view displays all objects available in the Control Center
    and allows you to perform all actions available. This is the view you should use
    if you are working in an enterprise environment and/or if you want to connect
    to DB2 for i/OS or DB2 for z/OS.

    - Custom. The custom view gives you the ability to tailor the object tree and
    actions allowed to meet your specific needs.


    Figure 2 shows how the Control Center looks on a Windows XP server when the advanced
    view is used.


    Figure 2 The Control Center (advanced view)


    If you look closely at Figure 2, you will notice that the Control Center is comprised
    of the following elements:


    - A menu bar, which allows users to perform any of the Control Center functions
    available.

    - A toolbar, which can be used to launch the other DB2 GUI tools available. Figure
    3 on page 24 identifies the tools that can be invoked directly from the Control
    Center toolbar.


    DB2''s comprehensive tool set


    ## Introduction to DB2 9.5 for Linux, UNIX, and Windows


    Figure 3 The Control Center toolbar


    It is important to note that every tool that can be invoked from the Control Center
    toolbar can also be invoked from the Control Center''s menu bar.


    - An objects pane (located on the left-hand side of the Control Center), which
    contains a hierarchical representation of every object type that can be managed
    from the Control Center.

    - A contents pane (located on the upper right-hand side of the Control Center),
    which contains a list of existing objects that correspond to the object type selected
    in the objects pane. (For example, if the Tables object type was selected in the
    objects pane, a list of all tables available would be listed in the contents.)

    - An objects details pane (located on the lower right-hand side of the Control
    Center), which contains detailed information about the object selected in the
    object tree or contents pane.


    ### 1.2.2 The Command Editor


    The Command Editor is an interactive GUI application that is used to generate,
    execute, and manipulate SQL statements and DB2 commands; to work with the resulting
    output; and to view a graphical representation of the access plan for explained
    SQL statements. From the Command Editor, users can:


    - Execute SQL statements

    - View the results of the execution of SQL statements and DB2 commands and see
    the result set produced in response to a query.

    - Save the results of the execution of SQL statements and DB2 commands to an external
    file.

    - Create and save a sequence of SQL statements and DB2 commands that can be invoked
    by the Task Center. (A script file can then be scheduled to run at a specific
    time or frequency)

    - Use the SQL Assist tool to build complex queries.

    - Examine the execution plan and statistics associated with a SQL statement before
    (or after) it is executed.


    ## Introduction to DB2 9.5 for Linux, UNIX, and Windows


    Figure 4 shows how the Command Editor looks on a Windows XP server after a database
    connection has been established.


    Figure 4


    # The Command Editor


    As you can see in Figure 4 the Command Editor is comprised of three individual
    pages (which are accessed by tabs): the Commands page, the Query Results page,
    and the Access Plan page. Users can enter and execute an SQL statement or a DB2
    command, create and save a script, running an existing script, or schedule a task
    from the Commands page. Once a query has been executed, users can see the results,
    if any, or on the Query Results page. And on the Access Plan page, users can see
    the access plan for any explainable statement that was specified on the Commands
    page. (If more than one SQL statement is specified on the Commands page, an access
    plan will be created only for the first statement encountered.)

