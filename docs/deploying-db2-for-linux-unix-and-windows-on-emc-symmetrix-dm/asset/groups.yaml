    ## 1.6 A closer look at table spaces


    Earlier, we saw that table spaces are used to control where data is physically
    stored and to provide a layer of indirection between database objects (such as
    tables, indexes, and views) and one or more containers, such as directories, files
    or raw devices, in which the object''s data actually resides. Data is transferred
    to and from containers in 4 KB, 8 KB, 16 KB, or 32 KB blocks called *pages* and
    when a table space spans multiple containers, data is written in groups of pages
    called *extents*, in a round-robin fashion, to each container assigned to that
    table space. This helps balance data across all containers used. Figure 11 shows
    the relationship between pages, extents, and table containers.


    ![](img/9d79d979aef40e6535a55c940991009e_42_0.png)


    Figure 11 How data is written to table space containers


    > Note: When multiple containers are used to store a table space''s data, the
    maximum amount of data that each container can hold is determined by the smallest
    container. For example, if a table space uses one container that is 10 MB (megabytes)
    and a second container that is 12 MB in size, 2 MB of the second container will
    not be usable; the maximum amount of storage available to the table space will
    be 20 MB. Therefore, container sizes should be equal whenever possible.


    Two types of table spaces can exist: System Managed Space (SMS) table spaces and
    Database Managed Space (DMS) table spaces. With SMS table spaces, only directory
    containers can be used for storage, and the operating system''s file manager is
    responsible for controlling how that space is used. The SMS storage model consists
    of many files (each representing a table, index, or long data object) that reside
    within the file system—the user decides on the location of the files, the DB2
    Database Manager assigns the files and the file system is responsible for managing
    their growth. With DMS table spaces, only file and/or device containers can be
    used for storage, the DB2 Database Manager is responsible for controlling how
    the space is used. In DB2 9.5, the initial allocation of space for an object in
    a DMS table is two extents; the initial allocation of space for an object in an
    SMS table is one extent. Other differences between SMS and DMS table spaces can
    be seen in Table 1.


    ## Differences between SMS and DMS table spaces


    | SMS table spaces | DMS table spaces |

    |---|---|

    | Space is allocated and managed by the operating system''s file manager. | Space
    is allocated, if specified, and managed by the DB2 Database Manager. |

    | Only directory containers can be used for storage; file and device containers
    cannot be used. | File or device containers can be used as storage; directory
    containers cannot be used. |

    | No additional containers can be added to a table space (using the ALTERSPACE
    SQL statement) after it has been created. | Additional containers can be added
    to a table space after it has been created. When new containers are added, existing
    data can automatically be rebalanced across the new set of containers to retain
    optimal I/O efficiency. |

    | Space is allocated as is needed. | Space is preallocated. |

    | A container''s size cannot be changed once a table space has been created. |
    A container''s size can be increased or decreased after a table space has been
    created. |

    | Regular data and long data are stored in the same table space. | Regular data
    and long data can be split across multiple spaces (regular data can reside in
    one table space while long data resides in others). |

    | Table spaces are easier to create and manage. | Table access is slightly slower,
    so overall performance is better. |


    Both SMS and DMS table spaces are classified according to the type of data they
    are intended to store; three classifications: regular, long, and temporary. Regular
    data and index data reside in regular table spaces, where long fields and large
    object data reside in large table spaces — but only if DMS table spaces are used.
    The use of large table spaces is optional given that long data can reside in regular
    table spaces as well. Temporary table spaces are further classified as either
    system temporary or user temporary. System temporary spaces are used to store
    internal data generated when some types of operations are performed (for example,
    sorting data, reorganizing tables, creating indexes, and joining tables), whereas
    user temporary table spaces are used to store declared global temporary tables,
    which in are used to store application-specific data for a period of time.


    If a database is enabled for automatic storage, one other type of table space
    — an automatic storage table space — can exist. At first glance, automatic storage
    table spaces appear to be a third type of table space, they are really just an
    extension of SMS and DMS table spaces: regular and large table spaces are created
    as DMS table spaces with one or more file containers; system and user temporary
    table spaces are created as SMS table spaces with one or more directory containers.
    Unlike when SMS table spaces are defined, no container definitions are needed
    for automatic storage table spaces; the DB2 Database Manager assigns containers
    to automatic storage table spaces automatically.


    ## 1.6.1 Creating additional table spaces


    It was mentioned earlier that when a DB2 database is created, one buffer pool
    named IBMDEFAULT is created, and three table spaces are created and associated
    with this buffer pool as part of the database initialization process. These three
    table spaces are sufficient for small databases; however, large databases are
    usually composed of many different buffer pool and table space objects. Additional
    table spaces can be created by executing the CREATE TABLE SQL statement or by
    using the Table Space Wizard, which can be activated by selecting the appropriate
    action from the Table Spaces menu in the Control Center. Figure 12 shows the Control
    Center menu items that must be selected to activate the Table Space Wizard; Figure
    13 on page 44 shows how the first page of the Create Table Space Wizard might
    look like when it is activated.


    ![](img/9d79d979aef40e6535a55c940991009e_44_0.png)


    Figure 12 Invoking the Create Table Space Wizard from the Control Center


    ![](img/9d79d979aef40e6535a55c940991009e_45_0.png)


    Figure 13 The first page of the Create Table Space Wizard


    ## 1.6.2 Modifying existing table spaces


    Because SMS table spaces rely on the operating system for physical storage space
    management, they rarely need to be modified after they have been successfully
    created. DMS table spaces, on the other hand, have to be monitored closely to
    ensure the fixed-size preallocated file(s) or physical raw device(s) that they
    use for storage always have free space available to the database''s needs. When
    the amount of free space available to a DMS table space becomes dangerously low
    (typically less than 10 percent), you can add free space by increasing the size
    of one or more of its containers or by adding one or more containers to it. Existing
    table spaces can be resized, new containers can be made available over an existing
    table space, and an existing table space''s properties can be changed by executing
    the ALTER TABLESPACE SQL statement. Table spaces can also be altered using the
    Alter Table Space dialog box, which can be activated by selecting the appropriate
    action from the Table Spaces menu found in the Control Center.

    '
