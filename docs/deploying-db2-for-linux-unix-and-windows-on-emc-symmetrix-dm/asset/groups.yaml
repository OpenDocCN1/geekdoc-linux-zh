    # Deploying DB2 9.5 for Linux, UNIX, and Windows Databases on EMC Symmetrix DMX


    “What is the best way to deploy a DB2 9.5 for Linux, UNIX, and Windows (LUW) database
    on EMC Symmetrix DMX storage?” That is a question that is frequently asked by
    EMC customers who are considering migrating to IBM’s latest release of DB2. IBM
    has some basic guidelines for deploying DB2 LUW databases in SAN environments;
    however, when designing a database layout on a Symmetrix DMX, a strong understanding
    of the database’s requirements, coupled with knowledge about the host(s), and
    storage environment used is needed.


    This chapter is designed to provide recommendations for laying out DB2 LUW databases
    on EMC Symmetrix DMX arrays, and convey the basic set of guidelines IBM has for
    deploying DB2 LUW databases in a SAN environment. This chapter will also supply
    you with recommended settings for many of DB2 LUW’s storage-related environment
    registry variables and configuration parameters. Topics include:


    - 3.1 Designing for performance...... 96

    - 3.2 RAID 100

    - 3.3 Striping 104

    - 3.4 Layout considerations that affect DB2 database performance ...... 108

    - 3.5 Other layout considerations...... 111

    - 3.6 Recommendations for deploying DB2 9.5 databases on Symmetrix DMX ... 113

    - 3.7 Optimizing table space performance when storage containers reside on RAID
    devices 118

    - 3.8 Considerations for remote replication ...... 126


    ## 3.1 Designing for performance


    The principal goal for designing any layout on the Symmetrix DMX is to maximize
    the spread of I/O across the components of the array, thereby reducing or eliminating
    any potential bottlenecks in the system. Inside a Symmetrix DMX array, there are
    a number of areas to consider:


    - Front-end connectivity: This includes the number of connections from the Symmetrix
    DMX, and the Fibre communication infrastructure used (i.e., Point-to-Point, Fibre
    Channel Arbitrated Loop, or Fabric Connect via Fibre Channel switch).

    - Cache: All I/O requests pass through cache on the Symmetrix DMX. Therefore,
    I/O can be adversely affected if an insufficient amount of cache is available.

    - Back-end: This includes the number of back-end directors as well as the number
    and characteristics (i.e., speed and size) of the physical disk spindles used.
    Proper layout of the data is needed to ensure satisfactory performance.


    ### 3.1.1 Front-end connectivity


    The optimization of front-end connectivity requires understanding of the number
    and size of I/O requests (both reads and writes) that will be passed between the
    host(s) and the Symmetrix DMX. There are limitations to the amount of I/O that
    each front-end director port, front-end director processor, and front-end director
    board are capable of handling. Additionally, SAN fan-out counts, which is the
    number of hosts that are attached via a Fibre Channel switch to a single front-end
    port, need to be carefully managed.


    When optimizing front-end performance, a decision must be made regarding which
    of the following characteristics are most important:


    - Input/output operations per second (IOPS)

    - Throughput (MB/s)

    - A combination of IOPS and throughput


    In online transaction processing (OLTP) database applications, where I/Os are
    typically small and random, IOPS is the most important factor. In decision support
    systems (DSS), where transactions often perform large sequence or index scans,
    throughput is the more critical factor. In some database environments, a comparison
    of OLTP- and DSS-like I/Os is required. Optimizing performance for each type of
    environment often requires altering the DB table size used.


    On a Symmetrix DMX, the largest number of IOPS is achieved by using a small page
    size as 4 KB (4096 bytes). Thus, for OLTP applications, the typical page size
    used is 4 KB or 8 KB, the Symmetrix DMX provides higher IOPS, but lower throughput.
    The opposite is true for DSS applications, where larger page sizes (16 KB or 32
    KB) are typically used. When a 32 KB page size is used, the Symmetrix DMX provides
    higher throughput, but a lower number of IOPS.


    Each Fibre Channel connection to a Symmetrix DMX is capable of delivering a given
    amount of throughput, in MB/s. In practice, the throughput that is available per
    channel is significantly less than advertised (due to overhead) and is dependent
    upon I/O size. Thus, planning for total throughput to be approximately 70 percent
    of the maximum is a good practice and will ensure that bandwidth is available
    for connectivity between Symmetrix DMX and the host. Increasing the size of the
    I/O coming from the host decreases the number of IOPS that can be performed, but
    increases the overall throughput (MB/s) on the channel.


    ### 3.1.2 Cache


    Cache plays an important role in Symmetrix performance because of its intermediary
    role in the transfer of data between global hosts and physical storage. Symmetrix
    DMX systems are based on the principle that the working set of data at any given
    time is relatively small when compared to the total subsystem storage capacity.
    Therefore, if this working set of data resides in cache, there is a significant
    improvement in performance since reads and writes from memory are significantly
    faster than reads and writes from disk. The actual performance achieved is dependent
    upon the following principles:


    - Locality of reference. If a piece of information is used, there is a high probability
    that a piece of information nearby will be used thereafter.

    - Data re-use. If a piece of information is used, there is a high probability
    that it will be reused shortly thereafter.


    In Symmetrix DMX systems, channel directors and disk directors share global memory
    (cache)—channel directors attach to both CPUs and global memory while disk directors
    attach to global memory and physical disks. A special algorithm known as Tag Based
    Caching (TBC) divides global memory into groups of several hundred slots and 4
    bytes are used to represent each slot, which attributes contain information about
    the last time the system accessed the slot, whether it is write pending, etc.


    When a channel director receives a request from host, it checks the directory
    table for global memory to see if the requested data already resides in cache.
    If the requested data is found, the channel director transfers it to the host
    (through the channel interface) and updates the global directory table. If, however,
    the requested data is not found in global memory, the Symmetrix DMX uses a Recently
    Used (LRU) algorithm to determine which data is residing and is then discarded
    to make more room. Then, the disk director retrieves the requested data from disk
    stores it in global memory and sends a signal to the channel director know the
    data is ready. Finally, the channel director retrieves the data from cache and
    transfers it to the host. As this, because the requested data is not in global
    memory, the Symmetrix must search for the data on disk and then transfer it to
    cache, which adds seeks and latency to the read operation. Read performance can
    be improved through prefetching if the reads are sequential in nature; in this
    case, Enginuity detects sequential read activity and prepare data from cache before
    it is requested.


    When a channel director receives a write command, it attempts to store blocks
    into one or more cache slots. If slots are available, the incoming data is moved
    to the slots marked “write pending,” and an acknowledgement is sent back to the
    host. At some later point, the disk asynchronously destages data from cache. (Overall
    system disk activity, and availability of cache dictate when occurring.) If the
    cache slots are not available, the disk directors detach all writing pending data
    to disk immediately. (The Symmetrix system uses processors to manage sectors during
    this process.) As soon as a sufficient amount of global memory space becomes available,
    the channel director continues storing blocks directly into cache slots.

    '
