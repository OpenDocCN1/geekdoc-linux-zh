    +   - db2rhist.asc — This file contains historical information about backup operations,
    restore operations, table load operations, table reorganization operations, space
    allocations, and similar database changes (i.e., the recovery history file).

    - db2rhist.bak — This file is a backup copy of db2rhist.asc.

    - SQLBP.1 — This file contains buffer pool information.

    - SQLBP.2 — This file is a backup copy of SQLBP.1.

    - SQLDBCON — This file contains database configuration information.

    - SQLDBCNF — This file contains information that is used to ensure that the database
    is assigned to only one instance of the DB2 Manager.

    - SQLOGCTL.LFH — This file contains information about active transaction log files.
    Recovery operations use information stored in this file to determine how far back
