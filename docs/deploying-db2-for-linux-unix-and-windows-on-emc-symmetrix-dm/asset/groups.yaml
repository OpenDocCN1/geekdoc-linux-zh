  mdcn: "\n...已创建。此更改适用于 AIX、Linux、Solaris 和 Windows，但以下情况除外，默认行为继续保持为文件系统缓存（FILE\
    \ SYSTEM CACHING）：\n\n- AIX JFS2\n- Solaris-VxFS\n- Linux for System z\n- 所有 SMS\
    \ 临时表空间文件\n- SMS 永久表空间中的长字段 (LF) 数据和大对象 (LOB) 数据文件\n\n建议避免使用禁用文件系统缓存的挂载点选项，并使用\
    \ NO FILE SYSTEM CACHING 子句在表级禁用文件系统缓存。当把 `NO FILE SYSTEM CACHING` 标志应用于表时，DB2\
    \ 数据库管理器将在存在该特的文件系统上自动利用 CIO（直接 I/O）。这种行为可能有助于减少文件系统缓存的内存需求，为其他用户释放更多内存。\n\n注意：在\
    \ AIX JFS2 文件系统中，块大小为 4 KB，用于 CIO（通过不使用文件系统缓存实现）需要与文件系统块大小对齐。长字段 (LF) 和 LOB 数据访问可以按\
    \ 512 字节或 1024 字节对齐（这比默认的 4 KB 块大小小）。未对齐访问会导致 AIX JFS2 禁用表空间容器的 CIO。因此，建议客户使用默认的文件块大小，并将数据从表空间分离。将\
    \ LF 和 LOB 数据分离到单独的表空间，其优势在于（如果需要）可以对这些类型的数据使用文件系统缓存，因为 DB2 不在其缓冲池中缓存 LF 和 LOB\
    \ 数据。\n\n## 3.6.3 数据库布局的其他原则\n\n在 SAN 环境中部署 DB2 LUW 数据库时，适用于任何类型数据库的额外建议包括：\n\n\
    - 尽可能将活动日志和归档日志放在不同的磁盘柱道（spindles）上。这可以尽力减少在向归档写入的同时读取上一个活动日志时的磁盘竞争。\n- 如果你决定将数据库分区放在特定的磁盘柱道上，请考虑将索引数据与相应的表数据分离。从不同的物理设备处理表读取中的索引结果会更有效。这同时也减少了磁盘竞争和磁头移动。\n\
    - 如果你决定将数据库部分内容放在特定的柱道上，请尽可能将临时表空间与索引和表隔离。此外，让临时表空间分布在多个容器中。容器通常涉及长顺序写入和读取——这种对数据的顺序访问应与更具随机访问的对象类型隔离，以限制磁头移动并提高性能。\n\
    \n在做出任何影响数据库布局的建议之前，关键是要理解针对数据库的表空间及其他元素（日志、临时表空间等）执行的 I/O 类型（顺序或随机）、大小（页或区）以及数量（低、中、高）。如果对数据元素和预期的访问模式没有清晰的理解，在物理柱道上可能会出现严重的竞争问题，导致数据库性能低。。了解应用程序、数据元素和访问模式对于确保数据库环境的高性能至关重要。\n\
    \n## 3.7 当存储容器位于 RAID 设备上时优化表空间性能\n\n无论为 DB2 LUW 数据库环境如何配置存储，建议对每个使用 RAID 设备的表空间执行以下操作：\n\
    \n- 尽可能为每个表空间在跨越多个文件系统中定义多个容器。\n- 如果表空间跨越多个物理磁盘，使用 `DB2_PARALLEL_IO` 注册表变量启用并行\
    \ I/O。\n- 将表空间的区大小（extent size）设置为 RAID 条带大小（stripe size）或其倍数——如果使用了条带化（如果使用 RAID\
    \ 1，在大多数情况下默认区大小即可）。\n- 确保表空间的预取大小（prefetch size）为以下之一：\n  - 设置为 AUTOMATIC（自动）\n\
    \  - RAID 条带大小乘以使用的 RAID 设备数量（或该产品的倍数），且是表空间区大小的倍数。\n\n## 3.71 DB2_PARALLEL_IO\
    \ 注册表变量\n\n从表空间读取数据时，如果表空间跨越一个容器，DB2 将自动使用并行 I/O。然而，在某些情况下，为单容器表空间启用并行 I/O 也会有利。例如，如果容器创建在由多个物理磁盘组成的\
    \ RAID 设备上，如果恰当执行执行读取操作，性能可能会得到提高。这就是 `DB2_PARALLEL_IO` 注册表变量大显用场。\n\n`DB2_PARALLEL_IO`\
    \ 注册表变量用于强制 DB2 LUW 对只有一个容器的表空间，或容器位于多个物理磁盘上的表空间使用并行 I/O。分配给此注册表变量的值也会影响具有多个容器的表空间。如果未设置此注册表变量，则\
    \ I/O 并行程度等于表空间所使用的容器数量。相反，如果为此注册表变量赋值，则所使用的 I/O 并行程度为容器数量乘以 `DB2_PARALLEL_IO`\
    \ 注册表变量中存储的值。另一种理解是，表空间的性能等于预取大小除以表空间的区。\n\n例如，如果未设置 `DB2_PARALLEL_IO` 注册表变量且表空间使用四个容器包含一个预取请求，该请求将被拆分为四个（并行）。或者，如果表空间有两个容器且其预取大小是区大小的四倍，则每个预取请求将拆拆分为两个请求，每个请求包含两个区。此外，如果表空间容器位于单个专用磁盘上，如果恰当执行读取操作，性能可能会得到提高。这就是\
    \ `DB2_PARALLEL_IO` 注册表变量大显用场。\n"
