    ## 4.1 Partitioned DB2 database environments


    As the name implies, a partitioned database is a database that spans two or more
    database partitions, allowing data to be distributed across each partition used.
    Sometimes a database node or node, a DB2 database partition contains its own data,
    indexes, configuration files, and transaction log files and is only a portion
    of a larger database. Data retrieval and update requests are decomposed automatically
    into sub-requests, and executed in parallel among all applicable database partitions.
    The fact that the database is split across multiple database partitions is transparent
    to users using SQL statements.


    In most partitioned database environments, each database partition resides on
    its own physical workstation (server), and has its own processor, memory, and
    disks. Because of this, the environment is referred to as a “shared-nothing” environment
    because memory and storage are not shared between partitions. Instead, database
    partitions are connected to each other by a communications facility known as the
    communications manager. Figure 39 illustrates a typical LUW environment. (Note:
    The text ends here based on the provided source).

