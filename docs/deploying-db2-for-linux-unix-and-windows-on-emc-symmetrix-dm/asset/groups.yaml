    | RAID 6 | n 路 | n - 2 |


    表 10 各种 RAID 配置下的 DB2_PARALLEL_IO 设置


    ### 3.7.2 DB2_USE_PAGE_CONTAINER_TAG 变量


    在 DB LUW 7 及更早版本中，每当创建 DBMS 表时，每个容器的开头都会存储一个页标签（page tag）用于标识。剩余的页面则用于存储，并分组为区区大小（extent-size）的数据块。正如我们刚刚看到的，当使用
    RAID 设备进行表存储时，建议创建表空间的区大小等于或是 RAID 跨带（stripe）的倍数。然而，由于单页容器区无法与 RAID 跨带对齐，这通常会导致
    I/O 请求访问的物理磁盘多于优化值。为了消除这个问题，使用了 `DB2_STRIPED_CONTAINERS` 注册表变量来告诉 DB2 在每个表容器中使用一个完整的区区来存储标识标签。如果此变量设置为
    ON，则创建的每个表空间都会存储容器标签。


    从 DB LUW 8.1 版本开始，表空间容器标签存储在完整的区区中，且不再支持 `DB2_STRIPED_CONTAINERS` 注册表变量。然而，现在有一个新的变量
    `DB2_USE_PAGE_CONTAINER_TAG` 注册表变量，如果此变量设置为 ON，表空间容器标签将写入单个页面而不是整个区区。当使用 RAID
    1 以外的设备作为表空间存储容器时，不应启用此注册表变量。


    ### 3.7.3 NUM_IOSERVERS 数据库配置参数


    I/O 服务器（均已预取）代表数据库代理执行备份工具（Backup）和恢复工具（Restore）等程序的预取 I/O 和异步 I/O。`num_ioservers`
    数据库配置参数用于指定数据库在任何给定时间点可以同时运行的 I/O 服务器数量（I/O 服务器将等待直到其发起的 I/O 操作正在进行中）。非预取 I/O
    直接从数据库代理调度，因此不受 `num_ioservers` 数据库配置赋值值的限制。


    若要充分利用使用自动存储的数据库中的 I/O 设备，为此配置参数分配的较好值是 `AUTOMATIC`。


    如果您没有使用自动存储或无法识别 `AUTOMATIC` 值（如 DB2 早期版本所示），则该配置参数应分配一个比数据库所在的物理设备多一或两个数字。配置几个额外的
    I/O 服务器但不使用它们，比配置足够的数量要好，因为每个 I/O 服务器都带有极少的开销；任何未使用的 I/O 服务器将保持空闲状态。遗憾的是，Symmetric
    DMS 对 DB2 LUW 数据库而言并不透明，这个数字可能也是如此。


    呈现给主机的超卷（hypervolume）可能由一个或多个头磁盘阵列（HDA）提供，多个超卷可以由同一个 HDA 服务。了解存储的布局对于为 `num_ioservers`
    数据库配置参数分配意义值至关重要。


    ### 3.7.4 表大小（Table size extent）


    在第 1.6 节“深入观察表空间”中，我们提到以 4 KB、8 KB、16 KB 或 32 KB 块（称为页）在容器之间传输数据；当表空间跨越多个容器时，数据将以区（extents，即页组）的形式以轮询方式写入分配给该表空间的每个容器。因此，如果使用了多个容器，表空间的区大小本质上就是该表空间的跨带大小。表空间的区是在表空间创建过程中定义的，在不删除并重新创建表空间的情况下无法更改。因此，在表空间填充数据之前选择正确的大小至关重要。


    在决定使用的区大时，应考虑存储在表空间中的表的大小和类型。


    - 数据对象（data object）——存储常规列数据的地方。

    - 索引对象（index object）——存储表上定义的所有索引的地方。

    - 长字段对象（long field object）——如果表有一个或多个 LONG 列，这里是存储长字段数据的地方。

    -  LOB 对象（LOB objects）——如果表有一个或多个 LOB 列，则每个对象用于存储一个 LOB。


    当存储位于 RAID 设备上时优化表空间性能


