    # 3.4 Layout considerations that affect DB2 database performance


    How data is physically placed on disk spindles can potentially have a significant
    impact on DB2 LUW database performance. Placement factors that can affect database
    performance include:


    +   * Hypervolume selection on the physical spindles

    * The distribution of database files across the hypervolumes/spindles

    * Whether I/O data is stored contiguously on the hypervolumes/spindles used (minimize
    seek time)

    * The distribution of files across the physical spindles and back-end directors
    (to reduce component bottlenecks)


    # 3.4.1 Characteristics that affect disk performance


    There are a number of characteristics that can affect disk performance. Specifically,
    their characteristics are:


    +   * Actuator Positioning (Seek Time). This is the time it takes the actuating
    mechanism to move the heads from their present position to a new position. Seek
    time averages a few milliseconds and is dependent upon the drive type. For example,
    a 15,000 rpm drive has an average seek time of approximately 3.5 ms for reads
    and 4 ms for writes (The full disk seek time is 7.4 ms for reads and 7.9 ms for
    writes).

    * Rotational latency. This is the time it takes to correctly position the platter
    underneath the head so the desired data can be accessed. (The average rotational
    latency is one half of a revolution of the disk platter. In the case of a 15,000
    rpm drive, this is approximately 2 milliseconds. (Rotational speeds for spindles
    in the Symmetric DMX range from 7,200 rpm to15,000 rpm).

    * Interface speed. On a Symmetric, this is the time it takes data from the drive
    into the Symmetric cache. Delay caused by this is a very small value, on the order
    of a fraction of a millisecond. It is important to ensure that the transfer rate
    between the drive and cache is greater than the drive''s rate to deliver data.

    * Areal density. This is a measure of the number of bits of data that can be stored
    on a given surface area of the disk. The greater the density, the greater the
    amount of data that can be read from the platter as it passes under the head.

    * Drive capacity and algorithms. This is the amount of cache available on the
    drive, as well as the set of algorithms that are used to read and write data.
    Together, drive cache and the algorithms work to improve the transfer of data
    in and out of the drive and make parity calculations for RAID 5 implementations.


    To summarize, delay caused by the movement of the disk head across the platter
    surface is referred to seek time and the time associated with a data tracking
    to the required location under the disk head is referred to as rotational latency
    or delay. The cache capacity on the drive, disk algorithms used, interface speed,
    and areal density produce a disk transfer time. The time it takes to complete
    an I/O request (referred to as disk latency) is a combination of seek time, rotational
    latency, and transfer time.


    Since data transfer times are typically on the order of fractions of a millisecond,
    rotational latency and seek time are the primary sources of disk latency on a
    physical spindle. Even though rotational speeds of disk drives have increased
    from top speeds'
  - '[PAGE 110]


    of 7,200 rpm to 10,000 and 15,000, rotational delay stays on the order of a few
    milliseconds. Therefore, seek times continues to be the largest source of latency
    in disk assemblies when the entire disk is used.


    Transfer delays tend to be longer than the center of the platter; more data can
    be retrieved per second when it resides on the outer parts of the disk surface
    than when it is on the inner regions. Performance is significantly improved if
    data is stored on the outer parts of a disk. In fact, performance improvements
    of more than 50 percent can be realized on the outer cylinders of a physical spindle.
    Because of this difference, it may be good to place I/O data on the outer portions
    of a spindle when performance is critical, while placing I/O data on other objects
    such as database transaction logs on the outer edges of disk spindles has merit,
    performance differences are much smaller than in a stand-alone disk environment.
    Enterprise operating environment algorithms, particularly those that optimize
    I/O as the head scans across the disk, greatly reduce differences in hypervolume
    performance across the drive. Although this smoothing of disk latency may actually
    increase the delay of a physical I/O operation, overall performance characteristics
    of I/Os over hypervolumes across the face of the spindle will be more uniform.


    # 3.4.2 Hypervolume contention


    While disk movements and the use of cache, both on the physical disks and in disk
    arrays, have improved read and write performance, disk drives can still cause
    a performance bottleneck in DB2 LUW environments. Eliminating contention on the
    physical spindles is a key factor in ensuring maximum DB2 LUW database performance
    on Symmetrix DMX arrays.


    Contention usually occurs when I/O (read or write) to one or more hypervolumes
    on a physical spindle exceeds the I/O capacity of the disk. When this type of
    situation is encountered, contention can be eliminated by nondisruptively migrating
    one of the hypervolumes to another, lower utilized disk spindle. Such a migration
    could be performed at the host level using LVM mirroring, or at the array level
    using tools such as EMC Symmetrix Optimizer. (Other methods of reducing contention
    are to striping, either at the host level or at the array level using Symmetrix
    metamolutions.)


    Hypervolume contention problems can be located in a number of ways. DB2 LUW-specific
    data collection and analysis tools such as the database snapshot monitor, or as
    host-specific tools, can be used to identify areas of reduced I/O performance
    within a database. Manager can help identify performance bottlenecks in the Symmetrix
    DMX array. Establishing baselines of the system and performing proactive monitoring
    are essential to maintain across databases.


    Often, to improve database performance by eliminating spindle contention are conducted
    after a database has been deployed across a Symmetrix array. This is unfortunate;
    with a small amount of detailed planning, significant I/O contention can be minimized
    or eliminated in database deployments—the best method for reducing hypervolume
    contention is to carefully layout the data across all physical disk spindles.
    While detailed I/O patterns of a database environment are not always well known,
    particularly in the case of a new database implementation, careful consideration
    of a database on the back end of a Symmetrix array can save time and effort in
    trying to identify and eliminate I/O contention on the disk drives after the database
    has been constructed.


    ![](img/9d79d979aef40e6535a55c940991009e_110_0.png)'
