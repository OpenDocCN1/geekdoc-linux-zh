    ## 2.2 EMC Symmetrix DMX


    所有 Symmetrix 系统都提供高级数据复制能力、对大型机和开放系统的全面支持以及灵活的连接选项，包括光纤、FICON、ESCON、千兆以太网和 iSCSI。


    Symmetrix 存储系统之间的互操作性允许客户将存储解决方案从一代迁移到下一代，在需求扩大的同时保护其投资。


    Symmetrix DMX 增强缓存定向技术支持多个全局内存定向，允许配置包含数百 GB 全局内存的内容。请参阅相应的 EMC Symmetrix DMX
    产品指南获取有关全局内存设备类型和允许的最大内存量的信息。


    Symmetrix 板载数据完整性功能包括：


    -   连续的缓存和磁盘数据完整性检查以及错误检测/纠正

    -   故障隔离

    -   非中断性硬件和软件升级

    -   自动诊断和电话告警（phone-home）能力


    在软件层面，高级完整性功能确保信息始终受到保护并可用。通过选择 RAID 1（镜像）、RAID 1+0、高性能 RAID 5 (3+1 和 7+1) 以及
    RAID 6 保护，用户可以灵活选择最符合信息价值和性能要求的保护级别。Symmetrix DMX 是 EMC 提供的最新一代高端存储解决方案。


    从主机操作系统的角度来看，Symmetrix 系统表现为通过一个或多个 I/O 控制器连接的多个物理设备。主机操作系统使用物理设备名称对这些设备进行寻址。每个物理设备包含属性、供应商
    ID、产品 ID、修订级别和序列 ID。主机物理设备映射到 Symmetrix 设备。反之，Symmetrix 设备是物理磁盘部分称为“超卷”（hypervolume）的虚拟表示。


    ## 2.3 EMC Solutions Enabler 基础管理


    EMC Solutions Enabler 软件包件包含所有基础管理软件，为主机提供 SYMAP1 共享库和基础 Symmetrix 命令行界面 (SYMLCI)。Solutions
    Enabler (SYMLCI) 系列中的其他可选子组件允许用户扩展 Symmetrix 系统的功能。三个主要组件是：


    -   Solutions Enabler SYMLCI SRDF, SRDF/CG 和 SRDF/A

    -   Solutions Enabler SYMLCI TimeFinder/Mirror, TimeFinder/CG, TimeFinder/Snap,
    TimeFinder/Clone

    -   Solutions Enabler SYMLCI 存储资源管理 (SRM)


    这些组件将在后文中讨论。


    SYMLCI 位于主机上，用于监控和控制 Symmetrix 存储阵列的操作。SYMLCI 命令通过命令行或脚本调用称为“门控”（gatekeepers）的特殊设备。门控是从磁盘上划分出的微小设备，作为
    SYMLCI 命令的 SCSI 目标。SYMLCI 用于命令行或脚本中对设备和数据对象进行操作，它还监控存储环境的配置和状态。这些信息维护在主机数据库中。


