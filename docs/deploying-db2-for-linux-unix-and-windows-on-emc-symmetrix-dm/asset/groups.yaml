    ## 1.3 服务器、实例和数据库


    Linux、UNIX 和 Windows 版 DB2 9.5 将世界视为一个分层的对象结构。安装 DB2 的工作站（或服务器）占据了该层级结构的最高层。在安装过程中，名为
    DB2 管理器（DB2 Manager）的后台进程程序文件会被物理复制到服务器上的特定位置，并创建一个 DB2 数据库管理器实例。（特定系统的默认实例由环境变量
    DB2INSTANCE 定义，这是大多数操作所使用的实例。）


    实例占据层级结构的第二层，负责管理其控制范围内的系统资源和数据库。虽然最初只创建一个实例，但可以存在多个实例。每个实例的行为都像是一个独立的 DB2 安装程序，尽管系统内的所有实例都共享相同的
    DB2 管理器程序文件（除非每个实例运行不同版本的 DB2）。尽管多个实例共享相同的二进制代码，但每个实例都独立于其他实例运行，并拥有自己的环境，可以通过修改其关联配置的内容进行更改。


    每个实例控制对一个或多个数据库的访问；数据库负责数据的存储、修改和检索。与实例一样，数据库之间也是独立工作的。每个数据库都有自己的一套可授予权限和许可，用于管理用户如何与数据以及其控制的数据库对象交互。从用户的角度来看，数据库是用于存储数据的表集合（最好以某种方式相关联）。然而，从数据库管理员的角度来看，DB2
    9.5 数据库远不止于此；数据库是一个由许多物理和逻辑组件组成的实体。其中某些组件有助于确定数据的组织方式，而另一些组件则决定数据的存储位置。第 30 页的图
    7 显示了系统、实例和数据库之间的层次关系。


    # Linux、UNIX 和 Windows 版 DB2 9.5 介绍


    ![](img/9d79d979aef40e6535a55c940991009e_31_0.png)


    图 7 系统、实例和数据库之间的层次关系


    ### 1.3.1 DB2 管理服务器 (DAS) 实例


    随 DB2 提供的工具（如控制中心和配置助手）需要一个独立于且与工作站定义的其他实例并发运行的实例。出于因此，在 DB2 安装过程中还会创建一个名为 DB2
    管理服务器 (DAS) 实例的特殊实例。与其他实例不同，单个工作站上只能存在一个 DAS 实例（DB2 全局配置注册表 DB2ADMIN 包含了特定工作站定义的
    DAS 实例名称）。


    一旦创建，只要其所在的系统在线，DAS 实例就会一直作为后台进程持续运行；通常每次工作站启动时，DAS 实例都会自动启动。对于您希望远程管理的每个 DB2
    服务器，DAS 实例*必须*处于运行状态。由于其他原因，DAS 为远程客户端提供了与其他实例建立通信所需的信息。


    注意：要从远程客户端管理服务器，用户必须对使用的 DAS 实例具有系统管理员 (SYSADM) 权限，且数据库已在工作站上注册；此外，对于远程实例和数据库，用户必须拥有执行管理任务的权限和许可。


    除了能够远程管理 DB2 服务器外，DAS 实例还协助控制中心和配置助手：


    - 提供作业（任务）管理，包括调度和运行包含 DB2 命令和操作系统命令的用户自定义脚本/批处理文件。

    - 调度作业、查看已完成作业的结果，并对远程或本地执行的作业执行管理任务（通过使用任务中心）。

    - 通过 DB2 发现功能提供有关其他 DAS 实例、DB2 实例和数据库配置信息的方法。（配置助手和控制中心使用此类信息来简化和自动化客户端到 DB2 服务器的配置；如果该服务器的
    DAS 实例未运行，任一工具都无法“发现”该服务器，）


