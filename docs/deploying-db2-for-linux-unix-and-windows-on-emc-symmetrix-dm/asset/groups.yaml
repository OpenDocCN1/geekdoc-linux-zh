    by 60 seconds per minute, and finally, multiply by 1,000 milliseconds per second.)


    For example, if a drive is rated at 7,200 rpms, its rotational latency would be
    calculated as follows:


    ```

    (1 / 7200) * 60 * 1000 = 8.328 milliseconds

    ```


