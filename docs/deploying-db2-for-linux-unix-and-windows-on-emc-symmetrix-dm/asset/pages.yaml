    # 2.5.5 SRDF terminology


    This section describes various terms related to SRDF operations.


    # 2.5.5.1 Suspend and resume operations


    Practical uses of suspend and resume operations usually involve unplanned situations
    in which an immediate suspension of I/O between the R1 and R2 devices over the
    SRDF links is desired. In this way, data propagation problems can be stopped.
    When suspend is used with consistency groups, immediate backups are performed
    over the R2 without affecting I/O from the local host. I/O can then be resumed
    by the R1 and R2 and return to normal operation.


    # 2.5.5.2 Establish and split operations


    The establish and split operations are normally used in planned situations in
    which use of the R2 copy of the data is desired without interfering with normal
    write to the R1 device. Splitting a point-in-time copy of data allows access to
    the data on the R2 device for various business continuity tasks. The ease of splitting
    SRDF pairs to provide exact database copies makes it convenient to perform scheduled
    backup operations, reporting operations, or new application testing from the target
    Symmetrix data while processing continues on the source Symmetrix system.


    The R2 copy can also be used to test disaster recovery plans with manually intensive
    recovery drills, complex procedures, and application service interruptions. Upgrades
    to new versions can be tested or changes to actual code can be made without affecting
    the online production server. For example, modified server code can be run on
    the R2 copy of the database until the upgraded copy runs with no errors before
    upgrading the production server.


    In cases where absolute real-time copy of the production data is not essential,
    users may choose to split the SRDF pair periodically and use the R2 copy for queries
    and report generation. The SRDF pair can be re-established to provide incremental
    updating of the R2 device. The ability to refresh the R2 device provides the latest
    information for data processing and reporting.


    # 2.5.5.3 Failover and failback operations


    Practical uses of failover and failback operations usually involve the switch
    business operations from the production site to a remote site (failover) or the
    opposite (failback). Once failover occurs, normal operations continue using the
    remote (R2) copy of synchronized application data. Scheduled maintenance at the
    production site is one example of where failover to the R2 site might be needed.


    Testing of disaster recovery plans is the primary reason to temporarily fail over
    to a remote site. Traditional disaster recovery routines involve customized software
    and complex procedures. Offsite media must be electrically transmitted or physically
    shipped to the recovery site. Time-consuming restores and the application


    EMC Symmetrix Remote Data Facility'
