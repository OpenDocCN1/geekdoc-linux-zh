    # 3.6.2 Word about file system caching


    With operating systems, a typical read operation involves moving data from storage
    to the file system cache, and then copying the data from cache to the application
    buffer. Similarly, a write operation involves copying data from the application
    buffer to the file system cache, and then copying the data from cache to storage.
    Since the DB2 Database Manager manages its own data caching using pools, caching
    at the file system level is not needed if the size of the buffer pool is set appropriately.
    In some cases, caching at both the file system level and DB2 buffer causes performance
    degradation due to the CPU cycles incurred for double caching. Without this double
    caching, most file systems have a feature that disables the file cache. (On Linux
    and Unix, this is achieved by mounting the file system with the FILE_NO_BUFFERING
    flag. Some file systems such as JFS2 support enhanced, high-performing, Direct
    I/O known as Concurrent I/O or CIO).


    Prior to version 9.5 of DB2 LUW, use of file system caching was implied and could
    be disabled by specifying the NO FILE SYSTEM CACHING when creating a new table
    space, or by using the ALTER TABLESPACE statement to disable it. With Version
    9.5, the file system caching is disabled by default (NO FILE SYSTEM CACHING) when
    new table spaces'
