  md: '# 2.6.4.1 Ingenuity Consistency Assist


    The Ingenuity Consistency Assist (ECA) feature of the Symmetrix operating environment
    can be used to perform consistent split operations across multiple heterogeneous
    environments. This functionality requires a TimeFinder/GC license and uses the
    `consistent` option of the split command.


    Using ECA to consistently split BCV devices from the standards, a control host
    with no database or a database host with a dedicated channel to gatekeeper devices
    must be available. The dedicated channel cannot be used for serving other devices
    or to freeze I/O. For example, to split a device group, execute:


    ```

    smmir -g MyDevGrp split -consistent -noprompt

    ```


    Figure 29 illustrates an ECA split across three database hosts that access devices
    on a Symmetrix system.


    ![](img/9d79d979aef40e6535a55c940991009e_84_0.png)


    Figure 29


    Device groups or composite groups must be created on the controlling host for
    the target application to be consistently split. Device groups can be created
    to include all of the required devices for maintaining business continuity. For
    example, if a device group is defined that includes all of the devices accessed
    by Hosts A, B, and C (see Figure 29), all of the BCV pairs related to those hosts
    can be consistently split with a single command.


    However, if a device group is defined that includes only the devices accessed
    by Host A, then the BCV pairs related to Host A can be split without affecting
    the other hosts. The solid vertical line in Figure 29 represents the ECA holding
    of I/Os during an instant split process, creating a dependent-write consistent
    image in the BCVs.


    Figure 30 on page 84 illustrates the use of local consistent split with a database
    management system (DBMS).'
