  md: '# EMC Foundation Products


    process is complete. The background split continues to split the BCV pair until
    it is complete. When the -instant option is included or defaulted, SYMLCI returns
    immediately after the foreground split, allowing other operations while the BCV
    pair is splitting in the background.


    The following operation performs an instant split on all BCV pairs in MyDevGrp,
    and allows SYMLCI to return to the server process while the background split is
    in progress:


    ```

    summir -g MyDevGrp split -instant -noprompt

    ```


    The following symmir query example command checks the progress of a split on the
    composite group MyConGrp. The -bg option is used to query the status of the background
    split:


    ```

    summir -cg MyConGrp query -bg

    ```


    # 2.6.3 TimeFinder restore operations


    A BCV device can be used to fully or incrementally restore data on the standard
    volume. Like the full establish operation, a full restore copies the entire contents
    of the BCV devices to the standard devices. The devices upon which the restore
    operates may be defined in a device group, composite group, or device file. For
    example:


    ```

    summir -g MyDevGrp -full restore -noprompt

    summir -cg MyConGrp -full restore -noprompt

    summir -f MyFile -sid 109 restore -noprompt

    ```


    The incremental restore process accomplishes the same thing as the full restore
    process with a major time-saving exception. The BCV copies to the standard device
    only new data that was updated on the BCV device while the BCV pair was split.
    The data on the corresponding tracks of the BCV device also overwrites any changed
    tracks on the standard device. This maximizes the efficiency of the resynchronization
    process. This process is useful, for example, if after testing or validating an
    updated version of a database or a new application on the BCV device is complete,
    a user wants to migrate and utilize a copy of the tested data or application on
    the production standard device.


    > An incremental restore to a standard volume is only possible when the two volumes
    have an existing TimeFinder relationship


    # 2.6.4 TimeFinder consistent split


    TimeFinder consistent split allows you to split off a dependent-write consistent,
    restartable image of an application without interrupting online services. Consistent
    split helps to avoid inconsistencies and restart problems that can occur when
    splitting an application-related BCV without quiescing or halting the application.
    Consistent split is implemented using Ingenuity Consistency Assist (ECA) feature.
    This functionality requires a TimeFinder/CF license.


    Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetrix DMX'
