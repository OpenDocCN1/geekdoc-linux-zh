  md: '# 1.2.3 The Configuration Assistant


    The Configuration Assistant is an interactive GUI application that allows users
    to configure clients so they can access databases stored on remote DB2 servers.
    In order to access an instance or database on another server/system, that system
    must first be cataloged in the node directory of the client workstation, and information
    about the remote database must be cataloged in the database directory (also on
    the client workstation). The Configuration Assistant provides a way to quickly
    catalog nodes and databases without having to know the inherent complexities involved
    with performing these tasks. And because the Configuration Assistant maintains
    a list of databases to which applications can connect, it can act as a lightweight
    alternative to the Control Center in situations where the complete set of GUI
    tools has not been installed.


    From the Configuration Assistant, users can:


    +   * Catalog new databases.

    * Work with or uncatalog existing databases.

    * Bind applications.

    * Set DB2 environment/registry variables.

    * Configure the DB2 Database Manager instance.

    * Configure ODBC/CLI parameters.

    * Import and export configuration information.

    * Change passwords.

    * Test connections.


    Figure 5 on page 27 shows how the Configuration Assistant might look on a Windows
    XP server.'
