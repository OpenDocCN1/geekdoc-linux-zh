  md: '+   RAID 1+0 is a combination of mirrored disks (RAID 1) and striping (RAID
    0). In a Symmetrix DMX, a RAID 1+0 configuration is created by constructing a
    striped metavolume from two or more RAID pairs.


    To understand how parity works, it helps to think of each data block on a disk
    as though it were really big integer (32,768 bits long), and that RAID is responsible
    for performing simple math operations using these integers — each parity block
    can be thought of being the big integer that is the sum of all data blocks in
    the stripe. A simple example can be seen in Figure 34.


    | Data value 1 | Data value 2 | Data value 3 | Parity value |

    | --- | --- | --- | --- |

    | 3 | 7 | 2 | 12 |


    Figure 34 Simple example of parity in a RAID 5 3+1 configuration


    In the example shown in Figure 34, if one of the data disks in the RAID group
    fails, for instance the disk containing "Data Value 2", the data stored on that
    disk can be reconstructed again by performing a simple arithmetic operation that
    looks something like this:


    ```

    Data Value 2 = Parity Value - Data Value 1 - Data Value 3

    Data Value 2 = 12 - 3 - 2

    Data Value 2 = 7

    ```


    Most parity schemes use logical exclusive-OR (also known as X-OR) operations instead
    of addition and subtraction to calculate parity values, but the end result is
    the same. Using addition and subtraction on small numbers makes the process easier
    to illustrate.


    In a Symmetrix DMX, RAID 5 can be configured as either RAID 5 3+1 (75 percent
    usable) or RAID 5 7+1 (87.5 percent usable). In either case, data is striped across
    all disks in the RAID using a stripe that is four tracks wide and parity blocks
    are cycled among all of the disks in the RAID array. (Parity for the first stripe
    is stored on the first disk, parity for the second stripe is stored on the second
    disk, and so on).

    Figure 35 on page 102 illustrates how data and parity values are striped in a
    RAID 5 3+1 configuration.'
