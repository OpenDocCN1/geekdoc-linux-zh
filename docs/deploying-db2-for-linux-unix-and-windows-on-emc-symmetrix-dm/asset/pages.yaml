  md: '# DB2 9.5 for Linux, UNIX, and Windows Databases


    While reads can use cache as is required to satisfy host requests (assuming free
    cache slots are available), the Symmetrix DMX limits the number of write operations
    that can be sent to a single device. This "writing-pending limit" is designed
    to prevent an application with high write rates to a single volume from consuming
    all of available storage array cache at expense of read/or write operations to
    other values. If the device writing-pending limit is reached, all write pending
    data for that device must be destaged before any new write requests are processed.
    This forced destaging to disk limits writes to that particular volume to physical
    disk speeds, which in turn significantly reduces performance.


    In addition to the writing-pending limits there are limits imposed at the storage
    subsystem level. When these limits are reached, the DMX operates as "priority
    degrade" mode. In this mode, destaging writes to disk is the highest priority
    tasks for the disk adapters; the result is a decrease in performance of both reads
    and writes from the host.


    The number of cache boards can also have a minor effect on performance. Comparing
    Symmetrix DMX arrays that have the same amount of cache, increasing the number
    of boards (for example, four cache boards with 16 GB each or two cache boards
    with 32 GB each) has a small positive effect on the performance in DSS applications.
    This is because of the increased number of paths between front-end directors and
    cache, and has the effect of improving overall throughput. However, configuring
    additional boards is helpful only in high-throughput environments such as for
    OLT workloads, where IOPS are more critical than throughout, additional cache
    directors provide no performance benefits. This is because the processing power
    of CPUs on each board limits the number of IOPS per port or director.


    # 3.1.3 Back-end


    Advances in disk technologies have not kept up with technological advancements
    in other parts of the storage array, such as directors and bandwidth. Consequently,
    some bottlenecks in a Symmetrix DMX are directly attributable to disk drive limitations.
    To reduce or eliminate back-performance issues on the Symmetrix DMX, care should
    be taken to spread I/O over many back-end directors and physical spindles as possible
    (as opposed to allocating specific directors and spindles to individual applications).


    One of the most important things that can be done to ensure optimum back-performance
    is to handle the anticipated I/O load. Each physical disk is capable of performing
    a limited number of operations and all algorithms in the Symmetrix DMX Infinity
    operating environment will help reduce the number of reads and writes to disk,
    particularly to support random operations, which is still a limiting factor. If
    an insufficient number of physical disks are available to handle the I/O workload,
    performance will suffer. Therefore, the decision of how many disk spindles to
    use for a DB2 LU workload should be based on I/O performance requirements — not
    on anticipated storage capacity.


    Significant attention should also be given to balancing the I/O workload across
    all physical spindles. If available space I/O patterns are known in advance, contention
    can be minimized and performance can be improved by storing table sets that see
    a large amount of I/O on separate physical disks. However, because I/O patterns
    may change over time, balancing the I/O workload across all disks may still be
    the best solution). The Symmetrix Optimizer can also help reduce I/O contention
    between hypervolumes over a single physical spindle (Symmetrix Optimizer is an
    invaluable tool to help reduce contention


    Deploying DB2 for Linux, UNIX, and on EMC Symmetrix DMX'
