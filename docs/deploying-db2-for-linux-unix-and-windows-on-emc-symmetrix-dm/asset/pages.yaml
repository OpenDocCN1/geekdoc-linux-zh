    ```


    And finally, if you wanted to assign the value 8 to the DB2_PARALLEL_IO registry
    variable for all DB2 instances on a server, you could do so by executing a db2set
    command that looks something like this:


    ```

    db2set -g DB2_PARALLEL_IO=8

    ```


