- img_proc: true
  md: '# # Deploying DB2 for Linux, UNIXIX, and Windows on EMC Symmetrix DMX


    This EMC Engineering TechBook provides a high-level overview of DB2 for Linux,
    UNIXIX, and Windows (LUW) and a general description of EMC products and utilities
    that can be used to store and manage DB2 LUW databases. It also provides information
    on how to deploy a DB2 LUW database on an EMC Symmetrix DMX to achieve optimum
    performance. While much of the content presented focuses on single-partition databases,
    considerations for multipartition databases are also addressed.


    # Audience


    This TechBook is written primarily for IT professionals who have some experience
    working with DB2 9.5 for Linux, UNIX, and Windows (LUW), and are planning on deploying
    one or more DB2 LUW databases on a Symmetrix DMX. However, any individual who
    would like to learn the optimum way to deploy DB2 LUW databases on Symmetrix DMX
    storage systems will benefit from the information found in this book.


    Readers of this document are expected to be familiar with the following topics:


    +   - Symmetrix operating environments

    - DB2 for Linux, UNIX, and Windows operations and concepts


    As part of an effort to improve and enhance the performance and capabilities of
    its product line, EMC from time to time releases revisions of its hardware and
    software. Therefore, some functions described in this guide may not be supported
    by all revisions of that or hardware currently in use. For the most up-to-date
    information on products, refer to your product release notes.


