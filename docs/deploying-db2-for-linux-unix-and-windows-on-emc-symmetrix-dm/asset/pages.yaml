  md: 'One of the nice features of DB2 Enterprise Server Edition (ESE) for Linux,
    UNIX, and Windows is its scalability; with DB2 ESE a database administrator has
    the ability to create what is known as a multipartition (or partitioned) database.
    A multipartition database is a database that has been configured to distribute
    its data across two or more multipartition databases using a common component
    as the Database Partitioning Feature (DPF). (To take advantage of DPF with ESE,
    a user must own both a DB2 ESE license key and a DPF license key.) A database
    partition is essentially a small part of a much larger database that behaves as
    an independent database.


    As you might imagine, a multipartition database is more complex than a single-partition
    database. This chapter is designed to provide you with an overview of multipartition
