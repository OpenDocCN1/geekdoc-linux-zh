  md: 'physical disk spindles should workload requirements change.) When used, Symmetrix
    Optimizer seeks I/O contention on individual hypervolumes and nondisruptively
    moves the hypervolumes to a new location on another disk if a contention situation
    is found.


    Where data is placed on a disk can also have an impact on performance. Because
    of the rotational properties of disks, tracks on the outer parts of a disk perform
    better than tracks near the center. And while algorithms in the Symmetrix DMX
    Engine operating environment smooth out of this variation, increases in performance
    can be achieved by directing high I/O to the outer parts of a disk. There is minimum
    movement associated with disk movement between hypervolumes on a spindle. Disk
    movement across platters (seek time) is a large source of latency in I/O performance.
    Placing hypervolumes that receive higher I/O activity in proximity of each other
    may reduce disk head movement, thereby increasing disk performance.


    # 3.1.4 Other considerations


    Along with front-end connectivity, cache utilization, and the back-end configuration,
    there are some additional factors that can influence the choice of the layout
    to use for a given database configuration. These factors include:


    +   * Host bus adapters. A host bus adapter (HBA) is a circuit board and/or integrated
    circuit adapter that provides physical connectivity to a server and a storage
    device. (An HBA and its associated disk subsystems are sometimes referred to as
    a disk channel.) Because the HBA relieves the host microprocessor of both data
    storage and retrieval tasks, it can improve server performance. However, HBAs
    can become a bottleneck if an insufficient number of them are provisioned. When
    designing DB2 database systems, the amount of throughput required should be taken
    into consideration and a sufficient number of HBAs should be provisioned accordingly.


    +   * Host addressing limitations. On many host platforms, there is a limitation
    on the number of LUNs that can be addressed by a single HBA. For example, on AIX
    the maximum number of LUNs that can be presented is 512, while on other operating
    systems, the maximum number is 256. This limitation must be taken into account
    when designing a database storage infrastructure.'
