  md: "# 3.7 Optimizing table space performance when storage containers reside on\
    \ RAID devices\n\nRegardless of how storage has been configured for a DB2 LUW\
    \ database environment, it is recommended that you do the following for each table\
    \ space that uses a RAID device:\n\n+   - Whenever possible, define multiple containers\
    \ across multiple file systems for each table space.\n- Use the DB2_PARALLEL_IO\
    \ registry variable to enable parallel I/O if the table space spans multiple physical\
    \ disks.\n- Make the extent size of the table space equal to, or a multiple of,\
    \ the RAID stripe size – if striping is used (If RAID 1 is used, the default extent\
    \ size is appropriate in most cases.).\n- Ensure the prefetch size for the table\
    \ space is one of the following:\n  - Set to AUTOMATIC\n  - The RAID stripe size\
    \ multiplied by the number of RAID devices used (or a multiple of this product),\
    \ and a multiple of the extent size of the table space.\n\n# 3.71 The DB2_PARALLEL_IO\
    \ registry variable\n\nWhen reading from table spaces, DB2 will automatically\
    \ use parallel I/O if the table space spans more than one container. However,\
    \ there are situations when it would be beneficial to have parallel I/O enabled\
    \ for single container table spaces. For example, if the container is created\
    \ on a RAID device that consists of more than one physical disk, performance may\
    \ be improved if read operations are performed properly. That is where the DB2_PARALLEL_IO\
    \ registry variable comes in.\n\nThe DB2_PARALLEL_IO registry variable is used\
    \ to force DB2 LUW to use parallel I/O for table spaces that only have one container,\
    \ or for table spaces whose containers reside on more than one physical disk.\
    \ The value assigned to this registry variable can also affect table spaces that\
    \ have more than one container. If this registry variable is not set, the level\
    \ of I/O parallelism is equal to the number of containers used by the table space.\
    \ On the other hand, if this registry variable is assigned a value, the level\
    \ of I/O parallelism used is the number of containers multiplied by the value\
    \ stored in the DB2_PARALLEL_IO registry variable. Another way of this is, the\
    \ performance of the table space is equal to the prefetch size divided by the\
    \ extent of the table space.\n\nFor example, if the DB2_PARALLEL_IO registry variable\
    \ has not been set and a table space uses four containers contains a prefetch\
    \ request, that request will be broken into four (parallel). Or, if a table space\
    \ has two containers and its prefetch size is four times the extent size, every\
    \ prefetch request will be broken into two requests and each request will be two\
    \ extents. In addition, if the table space container resided on a single, dedicated\
    \ disk, setting the DB2_PARALLEL_IO registry variable could result in contention\
    \ on both disks since two prefetchers attempt to access both disks used at the\
    \ same time. On the other hand, if both table containers were striped across multiple\
    \ disks, setting the DB2_PARALLEL_IO registry variable could potentially allow\
    \ access to multiple disks at the same time."
