  md: 'In many environments, customers have achieved high-performance back-end layouts
    on the Symmetrix DMX by allocating all of the storage needed as four-way striped
    metavolves. This approach guarantees that any volume presented to the host will
    be striped, and it reduces the chance for contention on any given disk spindle.


    One approach that is gaining popularity in DB2 LUW environments is the combined
    use of both database-based and array-based stripping. Known as double stripe,
    this configuration utilizes striped metavolves in the Symmetrix array, which are
    presented to a host where they are striped again at the database level. Such a
    configuration provides many advantages in database environments where read access
    is small and highly random in nature; I/O patterns are pseudo-random, access to
    data is spread across a large quantity of physical spindles, thereby decreasing
    the probability of contention on any given disk.


    Another way of double stripping is by combining RAID 5 or RAID 6 protection with
    Symmetrix metavolves. A RAID 5 hypervolume stripes data across either four or
    eight physical disks using a stripe size of 128 KB (256 KB for DMX-3 and later).
    Symmetrix metavolves stripe two or more hyperavolves with a stripe size of 960
    KB. However, when using this approach to perform double stripping, it is important
    to ensure that data members do not end up on the same physical spindles. Otherwise,
    performance can be adversely affected.


    It is also important to note that while it is possible to triple stripe data by
    combining host-based striping, RAID 5 or RAID 6 protection, and Symmetrix metavolves,
    EMC does not recommend its use, since such a configuration increases data complexity,
    and testing has shown that it can actually be detrimental to performance.


    Data can also be striped by combining host-based striping with database-based
    and storage-based striping. However, such a combination is not recommended except
    for the very largest of database configurations — this level of stripping will
    interfere with the Symmetrix''s prefetch algorithms unless interaction with the
    storage involves very large table and/or index scans that result in sequential
    access patterns to all disks in the three-layered stripe configuration.'
