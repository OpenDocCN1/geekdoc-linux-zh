    # 3.7.7 Transfer rate


    Transfer rate refers to the time (in milliseconds) it takes to read one page into
    memory. This value is also used to determine the cost of I/O query optimization.
    For a database that was created using DB2 LU Version 9 or later, the default time
    to read one page into memory is 0.06 milliseconds. For a database that was migrated
    from a previous version of DB2 to Version 9 or later, the default is 0.18 milliseconds.


    If each table container is a physical disk, you can use the following formula
    to estimate the transfer cost in milliseconds per page:


    ```

    Transfer rate = (1 / Spec_rate) * 1000 / 1024000 * Page size

    ```


    (where Spec_rate represents the disk specification for the transfer rate, in MB
    per second, multiply by 1000 milliseconds per second, divide by 1,024,000 bytes
    per MB, and multiply by page size, in bytes.)


    For example, if the specification rate for a disk drive is 3 MB per second and
    a page size of 4K is used, the transfer rate can be calculated as:


    ```

    Transfer rate = (1 / 3) * 1000 / 1024000 * 4096

    = 13.3332 milliseconds per page

    ```


    If the table containers are not physical disks, but instead arrays of disks (such
    as RAID), then additional considerations must be taken into account when attempting
    to determine the appropriate transfer rate. If the array is relatively small you
    can multiply the disk specification transfer rate (Spec_rate) by the number of
    disks used, assuming that the bottleneck is at the disk level. However, if the
    number of disks in the array is large, the bottleneck may not be at the disk level,
    but at one of the other I/O subsystem components such as disk controllers, I/O
    busses, or the system bus. In this case, you cannot assume that the I/O throughput
    capability is the product of the disk specification transfer rate and the number
    of disks. Instead, you must measure the actual I/O rate in MB/s during a sequential
    scan and divide the result by the number of containers that make up the table
    space.'
