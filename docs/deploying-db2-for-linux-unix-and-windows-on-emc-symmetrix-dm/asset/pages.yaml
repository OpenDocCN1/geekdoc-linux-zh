    ![](img/9d79d979aef40e6535a55c940991009e_49_0.png)


    ![](img/9d79d979aef40e6535a55c940991009e_49_1.png)


    Figure 16 The transaction logging process


    Because multiple transactions may be working with a database at any point in time,
    a single log file may contain log records that belong to several different transactions.
    Therefore, to keep track of which log records belong to which transactions, every
    log record is assigned a special "transaction identifier" that ties it to the
    transaction that created it. By using transaction IDs, log records associated
    with a particular transaction can be written to one or more log files at any time,
    without impacting data consistency — eventually the execution of the COMMIT or
    ROLLBACK statement that terminates the transaction will be logged as well.


    Because log records are externally finalized and because changes made by a particular
    transaction are only externalized to the database when the transaction itself
    is successfully terminated, the ability to return a database to a consistent state
    after a failure occurs is guaranteed — when the database is restarted, log records
    are analyzed, and each record that has a corresponding COMMIT record is reapplied
    to the database; every record that does not have a corresponding COMMIT record
    is either ignored or backed out (which is why "before" and "after" information
    is recorded for all update operations.'
