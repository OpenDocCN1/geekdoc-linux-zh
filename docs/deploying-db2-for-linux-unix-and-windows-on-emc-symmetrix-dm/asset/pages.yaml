  md: '# Introduction to DB2 9.5 for Linux, UNIX, and Windows


    DB2 version 9.5 for Linux, UNIX, and Windows is IBM’s latest release of its open-systems
    hybrid database management system. In addition to the functionality introduced
    with DB2 version 9, version 9.5 delivers important new features and enhancements
    that address business needs, whether those needs are integrating business data
    from across your organization, reducing costs, creating business value, or providing
    a secure and resilient system for your company’s valuable information assets.


    This chapter is designed to introduce you to the various products that make up
    the core of the DB2 9.5 Family and to the more common set of tools available to
    assist in the administration and management of DB2 servers, instances, and database
    objects. This chapter is also designed to show you how to configure a server,
    an instance, or a database, to show what happens when a new database is created,
    and to provide you with an overview of how data for a database is physically stored.
    Topics include:


    +   * 1.1 The DB2 family...........................................................................................
