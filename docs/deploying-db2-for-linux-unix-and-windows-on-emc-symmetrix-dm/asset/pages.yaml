  md: '# 2.6.6.1 Clone copy sessions


    TimeFinder/Clone functionality is controlled via copy sessions, which pair the
    source and target devices. Sessions are maintained on the Symmetrix system and
    can be queried to verify the current state of the device pairs. A copy session
    must first be created to define and set up the TimeFinder/Clone devices. The session
    is then activated, enabling the target device to be accessed by its host. When
    the information is no longer needed, the session can be terminated. TimeFinder/Clone
    operations are controlled from the host using the symclone command to create,
    activate, and terminate the copy sessions.


    Figure 31 illustrates a copy session where the controlling host creates a TimeFinder/Clone
    copy of standard device DEV001 on target device DEV005, using the symclone command.


    ![](img/9d79d979aef40e6535a55c940991009e_87_0.png)


    +   1. symclone create

    2. symclone activate


    **Figure 31 Creating a copy session using the symclone command**


    The symclone command is used to enable cloning operations. The cloning operation
    happens in two phases: creation and activation. The creation phase builds bitmaps
    of the source and target that are used later during the activation or copy phase.
    The creation of a copy session pairing does not start copying of source volume
    to the target volume, unless the -precopy option is used.


    For example, to create clone sessions on all the standards and BCVs in the device
    group MyDevGrp, use the following command:


    ```

    symclone -g MyDevGrp create -noprompt

    ```


    The activation of the clone session enables the copying of the data. The data
    may start copying immediately if the -copy keyword is used. If the -copy keyword
    is not used, tracks are only copied when they are accessed from the target volume
    or when they are changed on the source volume.


    Activation of the clone session established in the previous create command can
    be accomplished using the following command.


    ```

    symclone -g MyDevGrp activate -noprompt

    ```'
