    # 3.5 Other layout considerations


    Aside from the layout considerations described in the previous sections, a few
    additional factors may be important to DBAs or storage administrators who want
    to optimize performance for DB2 LUW databases on Symmetrix DMX arrays. Some additional
    factors to take into account include:


    +   - Planning for disaster recovery using SRDF/S.

    - Planning for creating database copies using TimeFinder/Mirror, TimeFinder/Clone,
    or TimeFinder/Snap.


    # 3.5.1 Using synchronous SRDF


    There are two primary concerns that must be considered when synchronous SRDF (SRDF/S)
    will be used for database disaster recovery. The first is the inherent latency
    that is added for each write operation. This latency occurs because each write
    must be written to the cache on both the local and the remote Symmetrix DMX before
    an acknowledgement can be sent to the host.


    The second is centered around stripping. Each hypervolume configured in a Symmetrix
    is only allowed to send one I/O across the SRDF link at a time. Performance degradation
    results when multiple I/Os are written to a single hypervolume, whereas subsequent
    writes must wait for predecessors to complete. This performance degradation is
    seen primarily with transaction strip writes to the logs which are synchronous
    with the application thread. Striping at the host level for active logs can be
    particularly helpful in these situations; using host level striping for transactions,
    a stripe size of 32 KB is recommended (Host level stripping is not recommended
    for table containers because buffer pooling is performed asynchronously to the
    application thread.) It is also recommended that page contents align whenever
    possible - page results result in increased latency.


    It is prudent to organize database storage in such a wo to facilitate recovery.
    Array replication techniques copy volumes at the disk level (as well as the host),
    all storage containers used by a DB2 LUW database should be created on a set of
    disks dedicated to the database; sharing disks with other applications can cause
    unnecessary work for the array and may result in wasted space on the target volumes.
    (For UNIX, ensure that the containers are in a volume group that is dedicated
    to the database.)


    In addition to isolating database to its own dedicated logs, the active logs and
    any archived logs associated with the database should be stored in separate volumes.
    This division allows the database and its logs to be manipulated independently
    if a recovery operation becomes necessary.


    # 3.5.2 Using TimeFinder/Mirror


    Database replication is useful when DBAs wish to create backup images or copies
    of a database for other purposes. A common question when laying out a database
    on Symmetrix DMX is whether Business Continuity Volumes (BCVs) should share the
    same physical disks as the production data or whether the BCVs should be isolated
    on a separate set of physical disks. There are pros and cons to each solution;
    the optimal solution generally depends on the anticipated workload.'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'The primary benefit of spreading BCVs across all available physical spindles
    is the performance. By spreading I/Os across more spindles, there is a reduction
    of developing bottlenecks on the physical disks. Workloads that utilize BCVs,
    such as backups and reporting databases, may generate high I/O rates; spreading
    this workload across more physical spindles can significantly improve performance
    in these environments.


    The main drawback of spreading BCVs across all available spindles is that the
    resynchronization process may cause spindle contention. During a BCV resynchronization
    operation, data is read from the production hypervolumes and copied into cache
    from there it is destined to the BCV. When physical disks contain both production
    data and BCV data, the synchronization rates can be greatly reduced because of
    increased seek times due to the head having to read from one part of the disk
    and write to another. Another drawback is that BCV workloads on the same spindles
    can have a negative impact on the performance of other hypervolumes on the same
    spindles, again, because of increased seek times.


    The appropriate location for BCVs is dependent on user preference and anticipated
    workload. In general, it is recommended that BCVs share the same physical spindles
    as production hypervolumes. However, in cases where the BCV synchronization and
    utilization will negatively impact applications (for example, databases that must
    be available 24-by-7 and have high I/O requirements), it may be beneficial for
    BCVs to be stored on their own physical spindles.


    # 3.5.3 Using TimeFinder/Clone


    TimeFinder/Clone provides many of the benefits of full volume replication techniques
    such as TimeFinder/Mirror without taking a hardware mirror position. However,
    two performance considerations must be taken into account when using TimeFinder/Clone.
    The first is Copy On First Write (COFW), arises from the need for data to be copied
    from the source hypervolumes to the target hypervolumes as data is changed on
    the source hypervolumes. This penalty affects only writes to the source hypervolumes.
    The second potential penalty happens when TimeFinder/Clone target volumes are
    read and tracks that have not yet been copied to the target hypervolume have to
    be read from the source hypervolumes. This additional load on the source hypervolumes
    can negatively impact performance on heavily loaded systems. Both of these penalties
    can be largely eliminated through the use of precopy capacity of TimeFinder/Clone.


    # 3.5.4 Using TimeFinder/Snap


    TimeFinder/Snap provides many of the benefits of full volume replication techniques
    such as TimeFinder/Mirror or TimeFinder/Clone, but at greatly reduced source cost.
    However, two performance considerations must be taken into account when using
    TimeFinder/Snap. The first, Copy On First Write (COFW), arises from the need for
    data to be copied from the production hypervolumes to the "Save" area as data
    is changed. Fortunately, this penalty affects only writes to the source volumes.
    The second potential penalty happens when TimeFinder snapshots are accessed. Tracks
    that have not been copied to the "Save" area have to be read from the source volumes.
    This additional load on the source volumes can negatively impact performance on
    heavily loaded systems.


