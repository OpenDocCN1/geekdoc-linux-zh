  md: '# gatekeeper


    A small logical volume on a Symmetrix storage subsystem used to pass commands
    from a host to the Symmetrix storage subsystem. Gatekeeper devices are configured
    on standard Symmetrix disks.


    # GB


    Gigabyte, 10^9 bytes.


    # H


    # head and disk assembly


    A field replaceable unit in the Symmetrix subsystem containing the disk and actuator.


    # home address


    The first field on a CKD track that identifies the track and defines its operational
    status. The home address is written after the index point on each track. Also
    see "CKD."


    # hyper-volume extension


    The ability to define more than one logical volume on a single physical disk device
    making use of its full formatted capacity. These logical volumes are user-selectable
    in size. The minimum volume size is one cylinder and the maximum size depends
    on the disk device capacity and the emulation mode selected.


    # I


    # ID


    Identifier, a sequence of bits or characters that identifies a program, device,
    controller, or system.


    # IML


    Initial micro program loading.


    # index marker


    Indicates the physical beginning and end of a track.


    # index point


    The reference point on a disk surface that determines the start of a track.


    # I/O device


    An addressable input/output unit, such as a disk device.


    # K


