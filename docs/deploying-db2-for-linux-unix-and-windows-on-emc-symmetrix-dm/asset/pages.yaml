    # ### 1.3.1 The DB2 Administration Server (DAS) instance


    The tools that come with DB2, such as the Control Center and the Command Center,
    require a separate instance that operates independently of, yet concurrently with,
    other instances that have been defined for a particular workstation. For this
    reason, a special instance, known as the DB2 Administration Server (DAS) instance,
    is also created as part of the DB2 installation process. In contrast to other
    instances, only one DAS instance can exist on a single workstation (The DB2 global-level
    profile registry `DB2ADMINSERVER` contains the name of the DAS instance that has
    been defined for a particular workstation.)


    Once created, the DAS instance runs continuously as a background process whenever
    the system it resides on online; the DAS instance is usually started automatically
    each time the workstation it is booted. The DAS instance *must* be running on
    every DB2 server that you wish to administer remotely. Because, among other things,
    the DAS provides remote clients with the information needed to establish communications
    with other instances.


    **Note:** To administer a server from a remote client, a user must have System
    Administration (SYSADM) authority for the DAS instance used and database have
    been registered on a client workstation, furthermore, once a remote instance and
    database the user must hold the authorities and privileges to perform administrative
    tasks.'
  merge: -1
