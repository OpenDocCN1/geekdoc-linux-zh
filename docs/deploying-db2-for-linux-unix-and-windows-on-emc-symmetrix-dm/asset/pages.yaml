  md: '# Glossary


    # M


    +   **MB** Megabyte, $10^6$ bytes.


    +   **mirroring** The Symmetrix maintains two identical copies of a designated
    volume on separate disks. Each volume automatically updates during a write operation.
    If one disk device fails, Symmetrix automatically uses the other disk device.


    +   **mirrored pair** A logical volume with all data recorded twice, once on each
    of two different physical devices.


    # P


    +   **physical ID** Physical identification number of the Symmetrix director for
    EREP usage. This value automatically increments by one for each director installed
    in Symmetrix. This number must be unique in the mainframe system. It should be
    an even number. This number is referred to as the SCU_ID.


    +   **primary track** The original track on which data is stored. See also "alternate
    track."


    +   **promotion** The process of moving data from a track on the disk device to
    cache slot.


    # R


    +   **read hit** Data requested by the read operation is in cache.


    +   **read miss** Data requested by the read operation is not in cache.


    +   **record zero** The first record after the home address.


    # S


    +   **scrubbing** The process of reading, checking the error correction bits,
    and writing corrected data back to the source.


    +   **SCSI adapter** Card in the Symmetrix subsystem that provides the physical
    interface between the disk director and the disk devices.


    +   **short miss** Requested data is not in cache, but is in the process of being
    fetched.


    +   **SSID** For 3990 storage control emulations, this value identifies the physical
    components of a logical DASD. The SSID must be a unique number in the host system.
    It should be an even number and start at a zero boundary.


    +   **stage** The process of writing data from a disk device to cache.


    +   **storage control unit** The component in the Symmetrix subsystem that connects
    Symmetrix to the host channels. It performs channel commands and communicates
    with the disk directors and cache. See also "channel director."


    +   **string** A series of connected disk devices sharing the same disk director.


    # U


    +   **unit address** The hexadecimal value that uniquely defines a physical I/O
    device on a channel path in an MVS environment. See also "device address."'
