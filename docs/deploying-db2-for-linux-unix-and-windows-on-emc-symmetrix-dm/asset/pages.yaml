    # ### 1.8.3 Configuring databases


    As a DB2 Database Manager configuration file is created and initialized whenever
    a new instance is created, a database configuration file is created and initialized
    each time a new database is created. Each database configuration file is made
    up of approximately 105 different parameters, and just as DB2. Database Manager
    instance configuration parameters control the amount of system resources that
    will be allocated to a single DB2 Database Manager instance, many of the configuration
    file parameters control the amount of system resources that will be allocated
    to a database during normal operation.


    The contents of the database configuration file for a particular database can
    be displayed by executing the `GET DATABASE CONFIGURATION` command. The syntax
    for this command is:


    ```

    GET [DATABASE | DB] [CONFIGURATION | CONFIG | CFG]

    FOR [DatabaseAlias]

    <SHOW DETAIL>

    ```


    where:


    +   * DatabaseAlias — Identifies the alias assigned to the database that configuration
    information is to be displayed for.


    Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetrix DMX'
  merge: -1
  pgno: 57
- img_proc: true
  md: 'Thus, if you wanted to view the contents of the database named SAMPLE, you
    could do so by executing the GET DATABASE CONFIGURATION command that looks like
    this:


    The value assigned to a particular database configuration file parameter can be
    changed by executing the UPDATE DATABASE CONFIGURATION command. The syntax for
    this is:


    ```

    UPDATE [DATABASE | DB]

    [CONFIGURATION | CONFIG | CFG]

    FOR [DatabaseAlias]

    USING [[Parameter] [Value] |

    [Parameter] [Value] AUTOMATIC |

    [Parameter] AUTOMATIC |

    [Parameter] MANUAL, ...]]

    <IMMEDIATE | DEFERRED>

    ```


    where:


    +   * DatabaseAlias — identifies the alias assigned to the database for which
    configuration information is to be modified.

    * Parameter — identifies one or more database configuration parameters (by keyword)
    which values are to be modified. (In many cases, the keyword for the parameter
    is the same as the parameter name itself.)

    * Value — identifies the new value(s) that are to be assigned to the database
    configuration parameter(s) specified.


    Once again, if the AUTOMATIC keyword is specified as the value for a parameter,
    DB2 will automatically adjust the parameter value to reflect the current resource
    requirements. If a value is specified along with the AUTOMATIC keyword, the provided
    value may influence the automatic calculations performed.


    If the DEFERRED clause is specified with the UPDATE DATABASE CONFIGURATION command,
    changes made to the database configuration file will not take effect until all
    connections to the corresponding database have been terminated and a new connection
    is established. If the IMMEDIATE clause is specified, or if neither is specified,
    all changes made to the database configuration file will take effect immediately—provided
    the necessary resources are available. (Applications running against a database
    during the time database configuration changes will see the change next time they
    execute an SQL statement.)


    So if you wanted to configure a database named SAMPLE that any application connected
    to the database will wait up to 10,000 seconds to acquire a lock before rolling
    back the current transaction, you could do so by executing an UPDATE DATABASE
    CONFIGURATION command that looks like this:


    ```

    UPDATE DB CFG FOR sample USING LOCKTIMEOUT 10000

    ```


    You can view or alter the contents of a database configuration file by using the
    Database Configuration dialog box, which can be activated by selecting the Configure
    Parameters action from the Databases menu in the Control Center. Figure 21 on
