  md: '# 3.6 Recommendations for deploying DB2 5 databases on Symmetrix DMX


    So far, we have looked at some things to keep in mind when designing DB2 LUW database
    layout on a Symmetrix DMX and we have seen how some decisions can have a significant
    impact on how the database performs. But we still have not answered the question
    “What is the best way to deploy a DB2 5 for Linux, UNIX, and Windows (DB2 LUW)
    on EMC Symmetrix DMX storage?”


    When it comes to deploying a DB2 data warehouse in a SAN environment, IBM has
    a special configuration known as the “Balanced Warehouse” (formerly known as “BCU”).
    The Balanced Warehouse is a well-defined, tested, exercised, and stressed configuration
    that has been designed specifically around a data warehouse workload. The data
    warehouse design, the server configuration, LV settings, cabling, and storage
    configuration are specifically laid out according to very strict guidelines. However,
    the Balanced configuration is built around IBM hardware and software – it does
    not take features of the Symmetrix DMX into account. The Balanced Warehouse also
    does not address OLTP environments. The following recommendations, which are valid
    for both OLTP and DSS environments, were decided after reviewing the warehouse
    documentation and consulting with DB2 experts at IBM.


    Because of the gap between drive speed and CPU performance, IBM conservatively
    estimates that 20 spindles are needed to keep one CPU (or core) busy. This means
    that if your storage system consists of 14 GB, 15,000 rpm disk drives, approximately
    3 TB of storage is needed to dedicate to each CPU and unless you are deploying
    a large data warehouse, 50 percent or more of this will be “wasted” just to ensure
    that the database server does not become an I/O bottleneck. Most companies are
    not willing to do that.


    DB2’s buffer pool technology does an excellent job of keeping data and indexes
    that are accessed frequently in memory and one-time access data out; one-time
    data backup images and input files are not stored in buffer pools. As a result,
    DB2 buffer hits tend to be around 90 percent and higher data. Requests that do
    not result in a buffer hit require I/O from the storage subsystem. With the Symmetrix
    DMX, because of its extremely large caching capability (up to 25 GB), such I/O
    requests are frequently satisfied out of cache and do not require additional I/O.
    With the sophisticated LRU and advanced prefetch algorithms all available with
    the Enginity operating environment, cache hit rates of 90 percent have been measured
    for OLTP workloads and hit rates of 60 percent are common for data warehouse and
    DSS workloads. Thus, in a Symmetrix DMX cache behaves as an extension to DB2’s
    buffer pools.


    # 3.6.1 A typical storage layout


    Assuming 20 spindles are needed for each CPU to protect a database server from
    becoming I/O bound, what is the best way to utilize all these spindles? In order
    to answer this question, we must first consider the RAID protection scheme(s)
    that will be used to protect the data. According to DB2 experts at IBM, a good
    rule of thumb is to protect table space data (user data, indexes, etc.) with RAID
    5 technology and transaction logs, along with DB2 metadata using RAID 1 or RAID
    1+0 technology. Because two different RAID technologies are recommended, ideally,
    the 20 spindles should be divided into two groups, each of which will be protected
    by a different RAID technology'
  merge: -1
  pgno: 114
- img_proc: true
