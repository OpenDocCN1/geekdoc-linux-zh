  md: '# EMC Foundation Products


    ![](img/9d79d979aef40e6535a55c940991009e_85_0.png)


    Figure 30 ECA consistent split on a local Symmetrix system


    When a split command is issued with ECA from the production host, a consistent
    database image is created using the following sequence of events in Figure 30:


    +   1. The device group, device file, or composite group identifies the standard
    devices that hold the database.

    2. SYMAPI communicates to Symmetrix Enginuity to validate that all identified
    BCV pairs can split.

    3. SYMAPI communicates to Symmetrix Enginuity to open the ECA window (the time
    within Symmetrix Enginuity where the writes are deferred), the instant split is
    issued, and the writes are released by closing the window.

    4. ECA suspends writes to the standard devices that hold the database, the DBMS
    cannot write to the devices and subsequently waits for these devices to become
    available before resuming any further write activity: Read activity to the device
    is not affected unless attempting to read from a device with a write queued against
    it.

    5. SYMAPI sends an instant split request to all BCV pairs in the specified device
    group and waits for the Symmetrix to acknowledge that the foreground split has
    occurred. SYMAPI then communicates with Symmetrix Enginuity to resume the write
    or close the ECA window.

    6. The application resumes writing to the production devices. BCV devices now
    contain a restartable copy of the production data that is consistent until the
    time of the instant split. The production application is unaware of the split
    or suspend/resume operation. When the application on the secondary host is started
    by the BCVs, there is no record of a successful shutdown. Therefore, the secondary
    application instance views the BCV copy as a crashed instance and proceeds to
    perform the normal crash recovery sequence to restart.


    When performing a consistent split, it is a good practice to issue host-based
    commands that commit any data that has not been written to disk before the split.
    For example on UNIX systems, the sync command can be run. From a database perspective,
    a checkpoint or equivalent should be executed.


    Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetrix DMX'
