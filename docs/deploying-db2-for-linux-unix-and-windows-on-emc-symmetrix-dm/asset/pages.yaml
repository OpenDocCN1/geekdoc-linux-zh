    # 2.4 EMC Change Tracker


    The EMC Symmetrix Change Tracker software is also part of the Solutions Enabler
    SYMCLI management offering, Change Tracker commands are used to measure data on
    a Symmetrix volume or group of volumes. Change Tracker functionality is often
    used as a planning tool in the analysis and design of configurations that use
    the EMC SRDF and TimeFinder components to create copies of production data.


    The Change Tracker command `symchg` is used to monitor the amount of changes to
    a group of hypervolumes. The command timestamps and marks specific volumes for
    tracking and maintains a bitmap to record which tracks has changed on those volumes.
    The bitmap can be interrogated to gain an understanding of how the volume changes
    over time and to assess the locality of reference of applications.'
