  md: '# 1.1 The DB2 family


    DB2, an acronym for DATABASE 2, was born on MVS in 1983. In 1987, DB2 arrived
    on the personal computer (PC) as the Database Manager on OS/2/1 Extended Edition
    and a year later, it emerged as SQL/400 for IBM''s AS/400 server. In 1992, DB2
    had become a stand-alone product on OS/2 (it now had the name DB2/2) and in 1993,
    DB2 appeared on AIX. (This prompted another name change and DB2/2 became DB2 for
    Common Servers.) New editions of DB2 were introduced on HP-UX and Solaris in 1994,
    on Windows in 1995, and on Linux in 1999. (Along the way, the name changed again
    and DB2 for Common Servers became DB2 Universal Database or DB2 UDB.)


    DB2 9.5 is the latest release of IBM''s data management software for distributed
    systems (and with this release comes yet another change). Previous versions, DB2
    runs on a wide variety of platforms (AIX, HP-UX, Linux, Solaris, Windows, and
    z/OS), and several editions are available—each of which has been designed to meet
    a specific business need. These editions, with an extensive suite of add-ons that
    provide additional storage capability and advanced connectivity, are collectively
    known as the DB2 Family. The entities that make up the heart of the DB2 Family
    are:


    +   DB2 Everplace. DB2 Everplace is a small footprint (approximately 350 KB) relational
    database and a high performance data synchronization solution that allows enterprise
    applications and data to be extended to mobile devices like personal digital assistants
    (PDAs), handheld computers (HPCs), and smartphones. DB2 can be used as a local,
    stand-alone database that resides on a mobile device or to access information
    from remote servers when a connection is available. DB2 Everplace can also be
    embedded into mobile devices to increase their functionality.


    DB2 Everplace is available in two editions: DB2 Database and DB2 Everplace Enterprise
    Edition. DB2 Everplace Database Edition is designed to be used by Independent
    Software Vendors (ISVs) and embedded applications that work with DB2 Everplace
    data stored on a mobile device. DB2 Everplace Enterprise Edition is designed to
    be a complete datacenter DB2 server is powerful enough for managing the distribution
    and synchronization of data between mobile devices and back-end data stores, such
    as DB 9, Informix, Oracle, Sybase, and Microsoft SQL Server. (Synchronization
    is performed when a connection to the back-end data source is detected.)


    +   DB2 Express. DB2 Express Edition (or DB Express) is an entry-level data server
    that is designed to be used on microcomputers that have up to two CPUs (a dual-core
    processor is treated as a single CPU), up to 4 GB of memory, and is running a
    supported version of Linux, Solaris, or Windows. DB2 Express contains a rich feature
    set that will meet the needs of most deployments; for workloads and environments
    that require additional functionality, add-ons are available for an additional
    licensing fee.


    +   DB2 Express-C. DB2 Express-C is a no-charge, entry-level, data server that
    is designed to be used on microcomputers that have up to two CPUs, up to 4 GB
    of memory, and is running a supported version of Linux or Windows. DB2 Express-C
    is intended to be used for evaluation purposes and for the development/deployment
    of C++, Java, .NET, PHP, and Xquery applications. Essentially, DB2 Express-C is
    a subset of DB2 Express with one exception: where pureXL is available as an add-on
    for DB2 Express, it is included'
  merge: -1
  pgno: 19
