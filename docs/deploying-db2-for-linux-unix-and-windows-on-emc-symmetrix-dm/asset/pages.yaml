    operations on device pairs within a TimeFinder/Mirror environment. The TimeFinder/Clone
    command, symclone, creates a point-in-time copy of a source device on nonstandard
    device pairs (such as standard/standard, BCV/BCV). The TimeFinder/Snap command,
    symsnap, creates virtual device copy sessions between a source device and multiple
    virtual target devices. These virtual devices only pointers to changed data blocks
    from the source device, rather than a full copy of the data. Each product requires
    a specific license for monitoring and control operations.


    Configuring and controlling remote BCV pairs requires EMC SRDF business continuity
    software discussed previously. The configuration of TimeFinder with SRDF provides
    for multiple local and remote copies of production data.


    Figure 28 illustrates application usage for a TimeFinder/Mirror configuration
