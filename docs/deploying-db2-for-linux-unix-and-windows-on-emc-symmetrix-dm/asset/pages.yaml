  md: '# 4.3 Balancing data across partitions


    In a partitioned database environment, it is possible to define named subsets
    of one or more database partitions. Each subset you define is known as a database
    partition group. A database partition group can contain as few as one database
    partition, or it can span all of the database partitions in a database. Whenever
    a partitioned database is created, three database partition groups are created
    automatically. One is IBMCATGROUP and this is the database partition group that
    is used by the table space that contains the system catalogs (SYSCSPACE). Another
    is IBMDEFAULTGROUP and this is the database partition group used by default, for
    user-defined tables. The third, named IBMGROUP, is the partition group that is
    used by default for system temporary table spaces. (A user temporary table space
    can be created in a declared temporary table space: IBMDEFAULTGROUP or any user-created
    database partition group, but not in IBMTEMPGROUP.)


    When you want to create tables in a partitioned database, you should first create
    one or more database partition groups that will be used to control where table
    spaces will be stored (or you can elect to use the default database partition
    group: IBMDEFAULTGROUP). Once the appropriate partition groups have been defined,
    you then create the desired table spaces for each group. Each table space created
    is distributed across all of the database partitions identified in the database
    group used; each partition used will have its own set of table space containers
    and will "own" the data stored there. Finally, you create the desired table in
    the appropriate table spaces.


    When creating table spaces in a partitioned database, the partition group in which
    the table space determines which database partition(s) the table space will be
    physically created. A table space can only belong to one partition group, but
    a partition group can contain more than one table space. Figure 41 shows the one-to-many
    relationship between database partitions, partition groups, and table spaces.


    ![](img/9d79d979aef40e6535a55c940991009e_134_0.png)


    Figure 41 Database partitions, partition groups, and table spaces'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# Considerations for Partitioned Databases


    Once a table space has been created, there is no way to dynamically change the
    partition group it belongs to. If you want to change the partition group for which
    a table space has been created, you must drop the table space and re-create it
    using the new partition group.


    When data is stored in a table that has been spread across multiple database partitions,
    it is distributed using a hashing algorithm utilizes what is known as a partitioning
    key. A partitioning key is an ordered set of one or more columns in a data partition
    each table row belongs. A well-chosen partitioning key will result in an even
    distribution of data across partitions. On the other hand, a poorly chosen partitioning
    key will result in a skewed distribution of data and an imbalance in the workload
    on each used partition. Partitioning keys usually deliver well-balanced data distributions.
    There are many factors that influence the choice of partition key – the chief
    factor being that the columns in the partitioning key must also be in the primary
    key for the table. For this, a table’s partitioning key is often used as the partitioning
    since it has a high cardinality.


    If you are concerned that data has not even distributed across all database partitions
    available, there is a simple query you can use to measure data distribution. The
    syntax for this query is:


    ```

    SELECT DBARTITIONNUM(PartitionKey) AS partnum,

    COUNT(*) AS rowcount

    FROM [PartitionedTable]

    GROUP BY DBARTITIONNUM(PARTITIONKEYS)

    ORDER BY 1

    ```


    where:


    +   * PartitionKey — Identifies the set of columns that make up the partitioning
    key that is used to partition the table.

    * PartitionTable — Identifies, by name, the partitioned table.


    > Note: Table partitioning (also referred to as range partitioning) is a data
    organization scheme introduced in DB2.9 where table data is divided across multiple
    storage objects called partitions or ranges based on values in one or more columns.
    Each data partition is stored separately, and the storage objects can reside in
    different table spaces, in the same space, or a combination of the two. Table
    partitioning improves performance and eliminates the need to create a partitioned
    database using DB2. Table partitioning can also be used in conjunction with DPE.


    # 4.3.1 A word about broadcasting


    When data from a single table is spread across multiple partitions (and potentially
    across multiple servers), there can be some runtime performance challenges as
    data is joined from the various partitions and returned as a result to the user.
    The network activity resulting from data on one partition being joined with data
    on another is called broadcasting. And unfortunately, broadcasting can have a
    negative effect on database performance.


    When designing a partitioned database, it is recommended that you try to frequently
    joined columns of large tables in the same partition. This is controlled, in part,
    by the choice of the partitioning key used for both tables being joined.'
  merge: -1
