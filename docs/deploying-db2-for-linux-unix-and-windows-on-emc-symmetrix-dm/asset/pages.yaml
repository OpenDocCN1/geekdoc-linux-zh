  md: '# Deploying DB2 9.5 for Linux, UNIX, and Windows Databases on EMC Symmetrix
    DMX


    “What is the best way to deploy a DB2 9.5 for Linux, UNIX, and Windows (LUW) database
    on EMC Symmetrix DMX storage?” That is a question that is frequently asked by
    EMC customers who are considering migrating to IBM’s latest release of DB2. IBM
    has some basic guidelines for deploying DB2 LUW databases in SAN environments;
    however, when designing a database layout on a Symmetrix DMX, a strong understanding
    of the database’s requirements, coupled with knowledge about the host(s), and
    storage environment used is needed.


    This chapter is designed to provide recommendations for laying out DB2 LUW databases
    on EMC Symmetrix DMX arrays, and convey the basic set of guidelines IBM has for
    deploying DB2 LUW databases in a SAN environment. This chapter will also supply
    you with recommended settings for many of DB2 LUW’s storage-related environment
    registry variables and configuration parameters. Topics include:


    +   * 3.1 Designing for performance...... 96

    * 3.2 RAID 100

    * 3.3 Striping 104

    * 3.4 Layout considerations that affect DB2 database performance ...... 108

    * 3.5 Other layout considerations...... 111

    * 3.6 Recommendations for deploying DB2 9.5 databases on Symmetrix DMX ... 113

    * 3.7 Optimizing table space performance when storage containers reside on RAID
    devices 118

    * 3.8 Considerations for remote replication ...... 126'
