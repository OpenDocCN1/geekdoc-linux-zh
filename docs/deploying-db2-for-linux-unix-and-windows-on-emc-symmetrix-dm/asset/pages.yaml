    It is important to note that if the db2set command is executed without options,
    a list containing every registry variable that has been set for the current (default)
    instance, along with its value, will be returned.


    Thus, if you wanted to find out which registry variables have been set for each
    profile, you could do so by executing a db2set command that looks like this:


    ```

    db2set -all

    ```


    On the other hand, if you wanted to see the current value of the DB2_PARALLEL_IO
    registry variable for all DB2 instances, you could do so by executing a db2set
    command that looks something like this:


    ```

