    # 1.6.2 Modifying existing table spaces


    Because SMS table spaces rely on the operating system for physical storage space
    management, they rarely need to be modified after they have been successfully
    created. DMS table spaces, on the other hand, have to be monitored closely to
    ensure the fixed-size preallocated file(s) or physical raw device(s) that they
    use for storage always have enough free space available to the database''s needs.
    When the amount of free space available to a DMS table space becomes dangerously
    low (typically less than 10 percent), you can add free space by increasing the
    size of one or more of its containers or by adding one or more containers to it.
    Existing table spaces can be resized, new containers can be made available over
    an existing table space, and an existing table space''s properties can be changed
    by executing the ALTER TABLESPACE SQL statement.


