  pgno: 97
- img_proc: true
  md: '# 3.1.2 Cache


    bandwidth is available for connectivity between Symmetrix DMX and the host. Increasing
    the size of the I/O coming from the host decreases the number of IOPS that can
    be performed, but increases the overall throughput (MB/s) on the channel.


    Cache plays an important role in Symmetrix performance because of its intermediary
    role in the transfer of data between global hosts and physical storage. Symmetrix
    DMX systems are based on the principle that the working set of data at any given
    time is relatively small when compared to the total subsystem storage capacity.
    Therefore, if this working set of data resides in cache, there is a significant
    improvement in performance since reads and writes from memory are significantly
    faster than reads and writes from disk. The actual performance achieved is dependent
    upon the following principles:


    +   - Locality of reference. If a piece of information is used, there is a high
    probability that a piece of information nearby will be used thereafter.

    - Data re-use. If a piece of information is used, there is a high probability
    that it will be reused shortly thereafter.


    In Symmetrix DMX systems, channel directors and disk directors share global memory
    (cache)—channel directors attach to both CPUs and global memory while disk directors
    attach to global memory and physical disks. A special algorithm known as Tag Based
    Caching (TBC) divides global memory into groups of several hundred slots and 4
    bytes are used to represent each slot, which attributes contain information about
    the last time the system accessed the slot, whether it is write pending, etc.


    When a channel director receives a request from host, it checks the directory
    table for global memory to see if the requested data already resides in cache.
    If the requested data is found, the channel director transfers it to the host
    (through the channel interface) and updates the global directory table. If, however,
    the requested data is not found in global memory, the Symmetrix DMX uses a Recently
    Used (LRU) algorithm to determine which data is residing and is then discarded
    to make more room. Then, the disk director retrieves the requested data from disk
    stores it in global memory and sends a signal to the channel director know the
    data is ready. Finally, the channel director retrieves the data from cache and
    transfers it to the host. As this, because the requested data is not in global
    memory, the Symmetrix must search for the data on disk and then transfer it to
    cache, which adds seeks and latency to the read operation. Read performance can
    be improved through prefetching if the reads are sequential in nature; in this
    case, Enginuity detects sequential read activity and prepare data from cache before
    it is requested.


    When a channel director receives a write command, it attempts to store blocks
    into one or more cache slots. If slots are available, the incoming data is moved
    to the slots slots marked “write pending,” and an acknowledgement is sent back
    to the host. At some later point, the disk asynchronously destages data from cache.
    (Overall system disk activity, and availability of cache dictate when occurring.)
    If the cache slots are not available, the disk directors detach all writing pending
    data to disk immediately. (The Symmetrix system uses processors to manage sectors
    during this process.) As soon as a sufficient amount of global memory space becomes
    available, the channel director continues storing blocks directly into cache slots.'
