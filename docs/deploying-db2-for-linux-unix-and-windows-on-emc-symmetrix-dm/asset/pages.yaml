  md: '# 1.8 Configuring a DB2 9.5 database environment


    Earlier, we saw that a DB2 database environment contains a set of system objects
    that are used to control how resources are allocated for a server, an instance,
    or a database. Along with the comprehensive set of registry variables, DB2 uses
    an extensive array of configuration parameters to control how system resources
    are allocated and utilized by an instance and a database. Unfortunately, the default
    values provided for many of the registry variables and configuration parameters
    that make these system objects were produced with very simple systems in mind
    (The goal was for DB2 to run out of the box, on virtually any platform, not for
    DB2 to run optimally on the platform on which it installed.) Thus, even though
    the default values provided are sufficient to meet most needs, you can often improve
    overall system and application performance simply by changing the values of one
    or more registry variables and/or configuration parameters.


    # 1.8.1 Configuring servers


    During normal operation, the behavior of the DB2 Database Manager is controlled,
    in part, by a collection of variables that define the DB2 operating environment.
    Some of these values are operating system environment variables, and others are
    DB2-specific system-level variables known as environment or registry variables.
    Registry variables provide a way to centrally control the database environment.
    Three registry profiles are available, and each controls the database environment
    at a different level. The registry profiles are available as follows:


    +   * **The DB2 Global — Level Profile Registry.** All-machine-wide variable settings
    are kept in this registry; one global-level profile registry exists on each DB2
    workstation. If an environment variable is to be set for all instances, this profile
    registry is used.


    +   * **The DB2 Instance — Level Profile Registry.** The environment settings
    for a particular instance are kept in this registry; this is where the majority
    of the DB2 environment variables are. (Values defined in this profile registry
    override any corresponding settings in the global-level profile registry.)


    +   * **The DB2 Instance Node — Level Profile Registry.** This profile registry
    contains variable settings that are specific to a partition (node) in a multipartitioned
    database environment. (Values defined in this profile registry override any corresponding
    settings in the global-level and instance-level profile registries.)


    DB2 looks for environment variable values in the DB2 global-level profile registry
    first, then in the instance-level profile registry, and finally, in the DB2 instance
    node-level profile registry.(Additional values may be set in individual sessions,
    in which DB2 will see these values last.)


    A wide variety of registry variables are available, and they vary depending on
    the operating system being used. A complete listing can be found in Appendix B
    of the IBM DB2 Version 9.5, Tuning Database Performance documentation.


    So how do you determine which registry variables have been set? Or more importantly,
    how do you assign values to one or more variables? One way is by executing the
    db2set system command. The basic syntax for this command is:


    ```

    .db2set

    <Variable> = [Value]

