    logs usually follow. SRDF failover/fallback operations significantly reduce the
    recovery time by incrementally updating the specific tracks that have changed;
    this accomplishes in minutes what might take hours for a complete load from dumped
    database volumes.


    # 2.5.5.4 Update operation


    The update operation allows users to resynchronize the R1s after a failover while
    continuing to run application and database services on the R2s. This helps reduce
    the amount of time that the R1 side takes. The update operation is a subset of
    the failover/fallback functionality. Practical uses usually involve situations
    where the R1 becomes almost synchronized with the R2 data before a failback, while
    the R2 is still online to its host. The -until option, when used with update,
    specifies the target number of invalid tracks that are allowed to be out of sync
    before resynchronization to R completes.


    # 2.5.5.5 Concurrent SRDF


    Concurrent SRDF means having two target R2 devices configured as concurrent mirrors
    of one source R1 device. Using a Concurrent SRDF pair allows the creation of two
    copies of the same data at two remote locations. When the two R2 devices are split
    from their source R1 device, each target site copy of the application can be accessed
    independently.


    # 2.5.5.6 R1/R2 swap


    Swapping R1/R2 devices of an SRDF pair causes the source R1 device to become a
    target R2 device and vice versa. Swapping SRDF devices allows the R2 site to take
    over operations while retaining a remote mirror on the original site site. Swapping
    is especially useful after failing over an application from the R1 site to the
    R2 site. SRDF swapping is available with Ingenity version 5567 or higher.


    # 2.5.5.7 Data Mobility


    Data mobility is an SRDF configuration that restricts SRDF devices to operating
    only in adaptive copy mode. This is a lower-cost licensing option that is typically
    used for data migrations. It allows data to be transferred in adaptive copy mode
    from source to target, and is not designed as a solution for DR requirements unless
    used in combination with TimeFinder.


    # 2.5.5.8 Dynamic SRDF


    Dynamic SRDF allows the creation of SRDF pairs from non-SRDF devices while the
    Symmetrix system is in operation. Historically, source and target SRDF device
    pairing has been static and required assistance from EMC personnel. This feature
    provides greater flexibility in deciding where to copy protected data.


    RA groups can be created in a SRDF switched fabric environment. An RA group represents
    a logical connection between two Symmetrix systems. RA groups were limited to
    those static RA groups defined at configuration time. However, RA groups can now
    be created, modified, and deleted while the Symmetrix system is in operation.
    This provides greater flexibility in forming SRDF-pair-associated links.'
