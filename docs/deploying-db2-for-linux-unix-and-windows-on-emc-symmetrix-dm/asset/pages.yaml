    # 3.7.2 The DB2_USE_PAGE_CONTAINER_TAG variable


    With DB LW Version 7 earlier, whenever a DBMS table was created, a one-page tag
    was stored at the beginning of each container for identification purposes. The
    remaining pages were then available for storage and were grouped into extent-size
    blocks of data. And as we have just seen, when using RAID devices for table storage,
    it suggests that the table space be created with an extent size that is equal,
    or a multiple of, the RAID stripe. However, because of the one-page container
    extent would not line up with the RAID stripes, it often caused I/O requests to
    access more physical disks than optimal. To eliminate this problem, the DB2_STRIPED_CONTAINERS
    registry variable was used to tell DB2 to use a full extent to store the identification
    tag in each table container. If this variable was set to ON, every table space
    created would store container tags.


    Beginning with DB LW, Version 8.1 table space container tags are stored in full
    extents and the DB2_STRIPED_CONTAINERS registry variable is no longer available.
    However, a new variable, the DB2_USE_PAGE_CONTAINER_TAG registry variable exists
    in place and if this variable is set to ON, table space container tags will be
    written to a single page instead of a full extent. When anything other than RAID
    1 devices is used for table space storage containers, you should not enable this
    registry variable.


    # 3.7.3 The NUM_IOSERVERS database configuration parameter


    I/O servers, all prefetched, are used on behalf of database agents to perform
    prefetch I/O and asynchronous I/O for utilities like the Backup utility and the
    Restore utility. The num_ioser database configuration parameter is used to specify
    the number of I/O servers that can be in progress for a database at any given
    point in time (An I/O server waits until an I/O operation that initiated it is
    in progress.) Nonprefetch IOs are scheduled directly from database agents and
    as a result are not constrained by the value assigned to the num_ioser database
    configuration


    120 Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetrix DMX'
