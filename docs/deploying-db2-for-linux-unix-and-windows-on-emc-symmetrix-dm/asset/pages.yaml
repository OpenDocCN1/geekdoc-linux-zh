    Kilobyte, 1024 bytes.


    # L


    # least recently used algorithm (LRU)


    The algorithm used to identify and make available the cache space by removing
    the least recently used data.


    # logical volume


    A user-defined storage device. In the Model 5200, the user can define a physical
    disk device as one or two logical volumes.


    # long miss


    Requested data is not in cache and is not in the process of being fetched.


    # longitude redundancy code (LRC)


