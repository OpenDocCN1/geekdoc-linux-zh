  md: '# 3.2 RAID


    Redundant Array of Independent Disks (RAID) technology provides protection from
    disk failure (through redundancy), substantial improvement in performance (by
    distributing information across multiple drives to enable parallel access), and
    high availability (drives and hardware can be swapped when there is a failure,
    without system interruption). RAID can be implemented by the storage system or
    by the host; however, implementing RAID at the host level puts a I/O burden on
    the host and will typically lead to reduced performance as well as higher operating
    costs.


    There are many different levels in which RAID technology can be implemented (each
    of which have their own advantages and disadvantages). Two of the big differentiators
    between each level are the number of drives used in the array and how data is
    distributed among them; these differentiators have an impact on the array''s storage
    capacity and performance, as well as how data is protected. RAID 1, RAID 5, RAID
    6, and RAID 1+0 (via RAID 1 metavolumes) are the levels that are supported when
    a Symmetric DMX is used in Linux, UNIX, or Windows environment:


    +   - RAID 1 (or RAID 1) is simply disk mirroring. A RAID 1 configuration consists
    of two separate disks and every write to one disk results in a write to the other
    (i.e., the mirror). Intelligent algorithms in the Enquirer operating environment
    allow both copies of data to be read to satisfy requests that are not already
    in cache. If the disk fails, the mirror drive is used for recovery without any
    interruption. RAID 1 offers high availability and performance, but because it
    doubles the number of spindles used, it is much more costly than other RAID implementations.
    RAID 1 is the most common RAID type used on a Symmetric DMX.


    +   - RAID 5 (or RAID 5) provides protection by writing data in stripes across
    all disk spindles used in an array and calculating a parity value for each stripe,
    which is then stored with the data across all the drives in the array. Parity
    is nothing more than a redundancy check that ensures data is protected without
    having to use a set duplicate drives - if a block on the array goes the other
    disks contain enough data that the information in the failed disk can be recovered.
    Likewise, if any disk in the array fails, parity can be used in conjunction with
    the remaining drives to re-create the failed disk''s contents, thereby preventing
    data from being lost. RAID 5 offers good availability and performance, at a lower
    cost than RAID 1.


    +   - RAID 6 (or RAID 6) is an extension of RAID 5 with dual parity. It provides
    protection by writing data in stripes across all disk spindles used in an array
    and calculating two parity values for each stripe, which are stored with the data
    across all the drives in the array. The goal of dual parity is to improve fault
    tolerance; RAID 6 provides fault tolerance in the event two disk drives fail at
    the same time while RAID 5 can handle at most, the failure of one drive. This
    makes RAID 6 groups more practical, especially for high availability systems.
    The use of RAID 6 becomes increasingly important when their size lengthens the
    time needed to recover from the failure of a single drive (Single RAID levels
    are vulnerable to data loss until the failed drive is rebuilt: the larger the
    drive, the longer the rebuild will take.) With dual parity, time is available
    to rebuild the array with data at risk while the failed drive is being recovered.
    Performance-wise, RAID 6 is generally slightly worse than RAID 5 in terms of writes
    due to the added overhead of parity calculations, but may be slightly faster in
    reads due to the spreading of data over an additional disk.


    Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetric DMX'
  merge: -1
  pgno: 101
