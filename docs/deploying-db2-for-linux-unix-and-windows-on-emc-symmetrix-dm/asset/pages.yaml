  md: '# 3.7.5 Space prefetch size


    When only one or just a few consecutive pages are retrieved from DB2 LU database,
    data is transferred from storage to memory one page at a time. When a large amount
    of data is needed, DB2 retrieves one or more additional pages from disk in anticipation
    that they will also be needed. This behavior is known as prefetching and the prefetching
    of index and data pages into memory can help performance by reducing I/O wait
    time.


    Like the extent, a table''s prefetch size is defined during the table space creation
    process; unlike the extent, a table''s prefetch size can be changed after the
    table space has been populated. When it comes to deciding on the best prefetch
    size to use, the best and most convenient way to do is let the DB2 Database Manager
    make the decision. This is done by assigning the table space prefetch size configuration
    parameter AUTOMATIC, or by assigning the value AUTOMATIC to the db_prefetch_size
    parameter when creating a new table space. For example, to create a DBMS space
    named _TBSP that the DB2 Database Manager will be responsible for determining
    the optimum prefetch size to use, you need to execute a CREATE TABLESPACE statement
    that looks like this:


    ```

    CREATE TABLESPACE my_tsp

    MANAGED BY DATABASE

    USING FILE ''/home/my_tsp.dat'' EXTENSE 2M

    PREFETCHSIZE AUTOMATIC

    ```


    If a table is created in this manner, DB2 will determine the optimum prefetch
    size to use (and update that value periodically) by solving the following equation:


    +   * Prefetch size = Number of table space containers *

    * Number of physical disks per container *

    * Extent size


    The number of physical disks per container defaults to 1, unless a different value
    is specified through the DB2_PARALLEL_TO_registry variable.


    # 3.7.6 Overhead


    Overhead refers to I/O overhead as well as disk latency time, which includes the
    disk seek time (in number of milliseconds) and is used to determine the cost of
    I/O during query optimization. For a database that was created using DB2 version
    9 or later, the default I/O controller and disk seek and latency time is 7.5 milliseconds.
    For a database that was migrated from a previous version of DB2 to version 9 or
    later, the default is 12.67 milliseconds.


    The following formula can be used to help estimate the overhead cost:


    > Overhead = Average seek time in milliseconds

    * (0.5 * Rotational latency)


    where 0.5 represents an overhead of half rotation and rotational latency is calculated
    in milliseconds for each full rotation, as follows:


    ```

    (1 / RPM) * 60 * 1000

    ```


    (Here you divide by rotations per minute to get meters per rotation, multiply
    by 60 seconds per minute, and finally, multiply by 1,000 milliseconds per second.)


    For example, if a drive is rated at 7,200 rpms, its rotational latency would be
    calculated as follows:


    ```

    (1 / 7200) * 60 * 1000 = 8.328 milliseconds

    ```


    Optimizing table space performance when storage containers reside on RAID devices'
