  md: '# 3.3 Striping


    Although disk drive sizes and speeds have increased dramatically in recent years,
    disk technologies have not kept pace with changes to make host CPUs and memory.
    Thus, some of striping is critical for database deployments as it allows I/O requests
    to be distributed across multiple disk spindles, preventing or eliminating disk
    I/O bottlenecks. In most cases, striping can be accomplished at both the host
    level and at the storage array. And with DB2 LUW, striping can be accomplished
    at the database level by creating table containers or using automatic storage.
    Deciding on which form of striping to use depends largely on the specific nature
    and requirements of the database environment in which storage array will be.


    # 3.3.1 Host-based striping


    Host-based striping involves creating logical volumes within a volume group; logical
    volumes are created using the Logical Volume Manager, which is available on most
    open systems hosts. For example, in an HP-UX environment, a logical volume can
    be created by executing a command that looks something like this:


    ```

    lvcreate -i 4 -I 64KB -L 1024 -n stripevol activevg

    ```


    In this example, a striped volume called stripevol (named using the -n flag),
    is created on a volume group called activevg. This volume is 1 GB in size (-L
    1024), and uses a stripe size of 64 KB (-I 64KB), and is striped across four physical
    volumes (-i 4). The specifics of striping data at the host level are operating
    system dependent.


    Generally, the use of host-based striping is not recommended in DB2 LUW environments.
    The exception to this rule is when DB2 is used in a SRDF/S replication environment.
    In this case, a striped logical volume may be used to store active log files;
    this is to enhance performance due to the limit of having only one outstanding
    I/O per hypervolume on the link. Small stripe sizes (for example, 32 KB) are recommended
    for these types of logical volumes.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# 3.3.2 Storage array-based striping (Symmetrix metamolumes)


    An alternative to using host-based striping and database striping is to stripe
    at the Symmetrix DMX level. In addition to the striping that occurs with RAID
    5 and RAID 6, individual Symmetrix hypervolumes of the same RAID type (RAID 1,
    RAID 5, or RAID 6) may be combined together to form a virtualized device called
    a Symmetrix metamume. Metamolumes are created for many reasons, including:


    +   - To create devices that are greater than the largest hypervolume available
    in 5670 and 5671 Ingenuity operating environments, this is currently just under
    31 GB; this is 64 GB).

    - To reduce the number of volumes presented to a front-end director or host bus
    adapter (HBA). A metamolume is presented to an HBA as a single LUN even though
    it may consist of a large number of individual hypervolumes.

    - To increase performance of a LUN by spreading I/O across more physical spindles.


    Two types of metamolumes are supported: concatenated and stripeded. With both
    types, individual hypervolumes are selected and combined to form a single LUN
    that is presented to the host through the front-end director and HBA. Where they
    differ is how they process I/O. Writes to a concatenated metamolume begin at the
    meta-head and continue until the physical device is moving to the next physical
    device. On the other hand, writes to a striped metamolume are written across every
    physical device used simultaneously. Figure 36 on page 105 illustrates how a concatenated
    metamolume consisting of four hypervolumes might look; Figure 37 on page 106 illustrates
    a striped metamolume comprised of the same four hypervolumes.


    ![](img/9d79d979aef40e6535a55c940991009e_106_0.png)


    Figure 36 Concatenated metamolume'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Deploying DB2 9.5 for Linux, UNIX, and Windows Databases


    ![](img/9d79d979aef40e6535a55c940991009e_107_0.png)


    Figure 37 Striped metametrics


    It is possible to create metavolumes with up to 255 hypervolumes, although in
    practice metavolumes are usually created with 4 to 16 members. Currently, the
    only stripe size available for a metavol is 960 KB.


    In a data warehouse environment, metamolumes can be composed of RAID 5 or RAID
    6 hypervolumes, but it is recommended that the members be concatenated rather
    than striped. For OLTP environments striped metamolumes comprised of hypervolumes
    are protected using RAID 5 or RAID 6 are preferred over concatenated metamolumes.


    # 3.3.4 Database-based striping


    With DB2 LUW, database-based striping involves creating table spaces that span
    multiple storage containers. In Chapter 1 we see that table spaces are used to
    control where data is physically stored and to provide a layer of indirection
    between database objects (such as tables, indexes, and views) and one or more
    containers (i.e., directories, files, or raw devices) which the object''s data
    resides. Data is transferred to containers in 4 KB, 8 KB, 16 KB or 32 KB blocks
    (called pages) and when a table space spans multiple containers, data is written
    in groups of pages (called extents), in a round-robin fashion, each container
    used by that table space. Thus, data is striped across the containers; the stripe
    size used is one extent.


    # 3.3.4 Striping considerations


    When host-based striping is used, CPU cycles are required to manage the striping;
    this, in turn, affects performance. However the small impact on performance is
    offset by the fact that each device in a striped volume group maintains an I/O
    queue, potentially increasing performance over a Symmetrix metamol, which has
    only a single I/O queue on the host. However, in DB2 LUW environment, host-based
    striping is only recommended for storage transaction log files when synchronous
    SRDF is used, stripe sizes in the host can be tuned to smaller increments than
    is currently available with Symmetrix metam. It is important to note that adding
    more storage to an existing striped logical volume can require a significant amount
    of work - in some cases, the data must be backed up, and the logical volume must
    be reconfigured, and the data must be restored in order for a successful expansion.


    106 Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetrix DMX'
