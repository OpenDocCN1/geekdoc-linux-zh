    are commonly designated M1, M2, M3, and M4. An unprotected BCV can be the second,
    third, or fourth mirror position of the standard device. A host, however, logically
    views the Symmetrix M1/M2 mirrored devices as a single device.


    To assign a BCV as a mirror of a standard Symmetrix device, the socalled establish
    command is used. One method of establishing a BCV pair is to allow the standard/BCV
    device-pairing algorithm to arbitrarily create BCV pairs from multiple devices
    within a device group:


    ```

    symmir -g MyDevGrp establish -full -noprompt

    ```


    With this method, TimeFinder/Mirror first checks for any assignments (specifying
    a preferred BCV match from among multiple BCVs in a device group). TimeFinder/Mirror
    checks if there are any pairing relationships among the devices. If either of
    these conditions exists, TimeFinder/Mirror uses these assignments.


    # 2.6.2 TimeFinder split operations


    Splitting a BCV pair is a TimeFinder/Mirror action that detaches the BCV from
    its standard device and makes the BCV ready for host access. When splitting a
    BCV, the system must perform housekeeping tasks that may require a few milliseconds
    on a busy Symmetrix system. These tasks involve a series of steps that result
    in separation of the BCV from its paired standard:


    +   * I/O is suspended briefly to the standard device.

    * Write pending tracks for the standard device that have not yet been written
    out to the BCV are duplicated in cache to be written to the BCV.

    * The BCV is split from the standard device.

    * The BCV device status is changed to ready.


    # 2.6.2.1 Regular split


    A regular split is the type of split that has existed for TimeFinder/Mirror since
    its inception. With a regular split (before Engineering version 5568), I/O activity
    from the production hosts to a standard was not accepted until it was split from
    the BCV pair. Therefore, applications attempting to access a regular split would
    experience a short wait during a regular split. Once the split was complete, no
    further overhead was incurred.


    With Engineering version 5568, any split operation is an instant split. Regular
    split is still valid for earlier versions and for current applications that perform
    regular split operations. However, current applications that perform regular splits
    with Engineering version 5568 actually perform an instant split. It is no longer
    required because instant split mode has become the default behavior. It is beneficial
    to continue using the -instant flag with later Engineering versions, otherwise
    the default is to wait for the regular split to complete.


    # 2.6.2.2 Instant split


    An instant split shortens the wait period during a split by dividing the process
    into a foreground split and a background split. During an instant split, the system
    executes the foreground split almost instantaneously and returns a successful
    status to the host. This instantaneous execution allows minimal I/O disruptions
    to the production volumes. Furthermore, the BCVs are accessible to the hosts as
    soon as the foreground'
