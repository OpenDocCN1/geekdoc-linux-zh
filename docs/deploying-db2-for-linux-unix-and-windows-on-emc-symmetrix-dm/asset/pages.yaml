  md: '# 3.8 Considerations for remote replication


    From a DB2 LUW database perspective, Symmetrical synchronous replication involves
    the duplication of changes made to a database stored on one Symmetrix system to
    a second database stored on a different Symmetrix system, which often resides
    in a different physical location. Writes to table space containers and transaction
    log files are not completed until all changes have been transmitted to the secondary
    Symmetrix system and an acknowledgement has returned to the primary Symmetrix
    system. Therefore, the synchronous replication process will delay all writes to
    the primary Symmetrix system, which in turn will significantly impact performance,
    particularly when long distances separate the two Symmetrix systems used.


    # 3.8.1 Buffer pool I/O


    Normal writes performed by DB2 to externalize data in buffer pools (memory) to
    table space containers are usually initiated by I/O page cleaners, and for the
    most part, will be marginally affected by synchronous replication. The actual
    impact may be seen as a slight slowing down the buffer pool paging process. However,
    this is not necessarily true for writes that are performed because of "dirty page
    steals". Writes from buffer pool occur because dirty page steals are synchronous
    operations. Therefore, service times for applications affected by the steals will
    be extended when synchronous replication is used. The best way to avoid dirty
    page steals and the additional overhead involved is by increasing the frequency
    at which page cleaners are activated, by increasing the size of the buffer pools
    used, or by doing both.


    # 3.8.2 Transaction log file I/O


    Transaction log writes are usually initiated when a transaction is terminated,
    either by a COMMIT or a ROLLBACK SQL statement. After issuing a COMMIT or a ROLLBACK
    statement, an application will wait for a positive acknowledgement that all writes
    to log files are complete before continuing. (Any delay introduced to the log
    write process of remote replication will delay the transaction.) While this may
    be small—5 to 10 milliseconds—in a heavy weight environment it can affect overall
    throughput.


    Unfortunately, there is very little that can be done to avoid this. It is part
    of the cost of business continuity. In a highly competitive-intensive environment,
    the mincommit database parameter can be used to reduce the amount of log data
    that gets transferred (which, in turn, will reduce the bandwidth required). By
    default, the mincommit database parameter is assigned the value 1. This means
    that every time a transaction is committed, the contents of the log buffer are
    written to a transaction log file. If, however, the mincommit parameter is assigned
    a value greater than 1, the contents of the log buffer will be externalized to
    disk less frequently. In this case, the first transaction to commit will work
    for the remaining transactions to commit (mincommit–1), or a maximum of 1 second,
    whichever comes first, before continuing. Therefore, a transaction arrival rate
    of multiple commits per second can significantly reduce the number of log writes
    needed, as well improve throughput. In lower transaction rate applications, assigning
    the mincommit database configuration parameter a value greater than one can have
    a negative impact on transaction performance.'
