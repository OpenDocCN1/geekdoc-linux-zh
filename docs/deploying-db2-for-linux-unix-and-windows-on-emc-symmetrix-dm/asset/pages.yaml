  md: "# 4.6 Shared nothing design on a shared everything array\n\nWith careful planning,\
    \ it is possible to implement a “shared nothing” design on a “shared everything”\
    \ storage array. It is important to note that a “shared nothing” implementation\
    \ on a Symmetrix DMX does not require the segregation of Symmetrix cache, the\
    \ dedication of front-end host directors, or the isolation of back-end directors.\
    \ Essentially, the shared nothing design is about the physical disks themselves.\n\
    \nA successful partitioned database layout on a Symmetrix DMX storage array will\
    \ ensure that no two containers for the same table space will reside on the same\
    \ physical spindle. By adhering to this simple rule, contention that might otherwise\
    \ occur during a full table scan can be avoided. Figure 43 illustrates a storage\
    \ array where designated sets of disks within the array are dedicated to individual\
    \ database partitions. (Each database partition in the diagram is depicted as\
    \ “owning” eight physical disk spindles).\n\n![](img/9d79d979aef40e6535a55c940991009e_138_0.png)\n\
    \nFigure 43 Shared nothing configuration at the disk level\n\nAllocating disks\
    \ for individual database partitions is easy. The challenge, of course, is to\
    \ provide a sufficient number of disk heads to satisfy the throughput requirements\
    \ for each database partition. Careful analysis must be performed before implementation\
    \ to determine if the configuration chosen can deliver the required performance.\
    \ \n\nFigure 44 on page 138 depicts a shared-nothing implementation on a Symmetrix\
    \ DMX. Here, each column of disks represents a RAID 5 (3+1) group; each database\
    \ partition is presented with eight disks that are comprised of two RAID 5 (3+1)\
    \ groups. The unit of space allocation is approximately 270 GB raw, or 200 GB\
    \ usable. Again, the challenge is to meet the performance requirements of the\
    \ application when presenting a small number of disks to each partition."
