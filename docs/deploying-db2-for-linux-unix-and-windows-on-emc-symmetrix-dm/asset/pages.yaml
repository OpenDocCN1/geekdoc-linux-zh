  md: "# Glossary\n\nThis glossary contains terms related to disk storage subsystems.\
    \ Many of these terms are used in this book.\n\n# A\n\n+   - **actuator**\n  A\
    \ set of access arms and their attached read/write heads, which move as an independent\
    \ component within a head and disk assembly (HDA).\n- **adapter**\n  Card that\
    \ provides the physical interface between the director and disk devices (SCSI\
    \ adapter), director and parallel channels (Bus & Tag adapter), director and serial\
    \ adapter.\n- **alternate track**\n  A track designated to contain data in place\
    \ of a defective primary track. See also \"primary track.\"\n\n# C\n\n+   - **cache**\n\
    \  Random access electronic storage used to retain frequently used data for faster\
    \ access by the channel.\n- **cache slot**\n  Unit of cache equivalent to one\
    \ track.\n- **channel director**\n  The component in the Symmetrix subsystem that\
    \ interfaces between the host channels and data storage. It transfers data between\
    \ the channel and cache.\n- **CKD**\n  Count Key Data, a data recording format\
    \ employing self-defining record formats in which each record is represented by\
    \ a count area that identifies the record and its format, an optional key area\
    \ that may be used to identify the data area contents, and a data area that contains\
    \ the user data for the record. CKD can also refer to a set of channel commands\
    \ that are accepted by a device that employs the CKD recording format.\n- **controller\
    \ ID**\n  Controller identification number of the director the disks are channeled\
    \ to for E. There is only one controller ID for Symmetrix.\n\n# D\n\n+   - **DASD**\n\
    \  Direct access storage device, a device that provides nonvolatile storage of\
    \ computer data and random access to that data.\n- **data availability**\n  Access\
    \ to any and all user data by the application."
