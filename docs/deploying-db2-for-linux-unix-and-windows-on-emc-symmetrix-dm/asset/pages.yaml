  md: '# EMC Foundation Products


    # 2.8 EMC PowerPath


    EMC PowerPath is host-based software that works with networked systems to intelligently
    manage I/O paths. PowerPath manages multiple paths to a storage array. Supporting
    multiple paths enables recovery from path failure because PowerPath automatically
    detects path failures and redirects I/O to other available paths. PowerPath also
    uses sophisticated algorithms to provide dynamic load balancing for several kinds
    of management policies that the user can set. With the help of PowerPath, administrators
    are able to ensure that the paths have highly available access to storage and
    perform optimally at all.


    A key feature of path management in PowerPath is dynamic, multipath balancing.
    Without PowerPath, an administrator must statically load balance paths to devices
    to improve performance. Based on current usage, the administrator might configure
    three heavily used logical devices on one path, moderately used logical devices
    on a second path, and 20 lightly used logical devices on a third path. As I/O
    paths change, these statically configured paths may become unbalanced, causing
    performance to suffer. The administrator must then reconfigured the paths, and
    continue to reconfigure them for I/O traffic between the host and storage system
    in response to changes.


    Designed to use all paths concurrently, PowerPath distributes I/O requests to
    a logical device across all available paths, rather than requiring a single path
    to bear the entire I/O burden. PowerPath can distribute I/O for all logical devices
    over paths shared by those logical devices, so that all paths are evenly balanced.
    PowerPath balances I/O on a host-based basis, and maintains statistics on all
    I/O paths. For each request it selects the least-burden available path, depending
    on the load-balancing and failover policy in addition to improving I/O performance,
    dynamic load balancing reduces management time and downtime because administrators
    no longer need to manage paths across logical devices. With PowerPath, configurations
    of paths and policies for an individual device can be changed dynamically, taking
    effect immediately, without any disruption to the applications.


    PowerPath provides the following features and benefits:


    +   * Multiple paths, for higher availability and performance — PowerPath supports
    multiple paths between a logical device and a host bus adapter (HBA), a device
    through which a host can issue I/O requests. Having multiple paths enables the
    host to access a logical device even if a specific path is unavailable. Also,
    multiple paths can share the I/O workload to a logical device.

    * Dynamic multipath load balancing — Continuous I/O balancing, PowerPath improves
    the host''s ability to manage heavy I/O loads. PowerPath dynamically tunes paths
    for performance as workloads change, eliminating the need for repeated static
    reconfigurations.

    * Proactive I/O path testing and automatic path recovery — PowerPath periodically
    tests failed paths to determine if they are available. When a path is restored
    automatically PowerPath resumes using I/O to it. It also periodically tests available
    paths to ensure they are operational.

    * Automatic path failover — PowerPath automatically redirects data from a failed
    I/O path to an alternate path. This eliminates application downtime; failovers
    are transparent and non-disruptive to applications.


    Deploying DB2 for Linux, UNIX, and Windows on EMC Symmetricrix DMX'
  merge: -1
  pgno: 93
- img_proc: true
  md: '+   Enhanced high availability cluster support — PowerPath is particularly
    beneficial in cluster environments, as it can prevent interruptions to operations
    and costly downtime. PowerPath''s path failover capability avoids node failover,
    maintaining uninterrupted application support on the active node in the event
    of a path disconnect (as long as another path is available).


    +   Consistent split — PowerPath allows users to perform TimeFinder consistent
    splits by suspending device writes at the host level for a fraction of a second
    while the foreground split occurs. PowerPath software provides suspend-and-resume
    capability that avoids inconsistencies and restart problems that can occur if
    a database-related BCV is split without first quiescing the database.


    +   Consistency Groups — Consistency groups are a composite group of Symmetrix
    devices specially configured to act in unison to maintain the integrity of a database
