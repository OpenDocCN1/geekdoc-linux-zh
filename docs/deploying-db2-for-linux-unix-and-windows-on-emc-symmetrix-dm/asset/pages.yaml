  md: '# 1.7 A closer look at transaction logging


    A transaction (also known as a unit of work) is a sequence of one or more SQL
    operations grouped together as a single unit, usually within an application process.
    The initiation and termination of a single transaction defines points of data
    consistency within a database; either the effects of all operations performed
    within a transaction are applied to the database and made permanent (committed),
    or the effects of all operations performed are backed out (rolled back), and the
    database is returned to the state it was before the transaction was initiated.


    In most cases, transactions are initiated the first time an executable SQL statement
    is executed after a connection to a database has been made or immediately after
    a preexisting transaction has been terminated. Instances can be implicitly terminated
    using a feature known as “automatic commit” (in which case each executable SQL
    statement is treated as a single transaction, and any changes made by that statement
    are applied to the database if the statement executes successfully or discarded
    if the statement fails), or they can be explicitly terminated by the COMMIT or
    the ROLLBACK SQL statement.


    Transaction logging is a process that is used to keep track of changes made to
    a database by transactions, as they occur. Each update or delete operation performed,
    the page containing the record to be updated/deleted is retrieved from storage
    and copied to the appropriate buffer pool where it is modified by the update/delete
    operation. (If a new record is created by an insertion, that record is created
    directly in the appropriate buffer pool.) Once the record has been modified (or
    inserted), a record reflecting the modification/insertion is written to the log
    buffer, which is itself a designated storage area in memory. (The actual amount
    of memory for the log buffer is controlled by the logdatabase configuration parameter.)
    If an insert operation is performed, a record containing the new row is written
    to the log buffer; if a delete operation is performed, a record containing the
    row’s original values is written to the log buffer; and if an update operation
    is performed, the original value is overwritten with the row’s new values, is
    written to the log buffer. (If no replacement has occurred, an Exclusive OR operation
    is performed using the “before” and “after” rows and the results are written to
    the log buffer.) These kinds of records, along with records that indicate whether
    the transactions were responsible for making the changes committed or rolled back,
    make up the majority of the records stored in the log buffer.


    Whenever buffer I/O pages are cleared (I/O page cleaners are special agents responsible
    for writing modified pages at predetermined intervals), the log buffer becomes
    full, or a transaction is terminated (by being committed or rolled back), all
    records in the log buffer are written immediately to one or more log files. This
    is done to minimize the number of log records that might get lost in a system
    failure. As soon as log records associated with a particular transaction are externalized
    to one or more log files, the effects of the transaction are recorded in the database,
    such as executed against the appropriate table space. The modified pages remain
    in memory, where they can be quickly accessed if necessary—eventually, they will
    be overwritten as newer pages are retrieved from storage. The transaction logging
    process can be seen in Figure 16 on page 48.'
  merge: -1
  pgno: 48
