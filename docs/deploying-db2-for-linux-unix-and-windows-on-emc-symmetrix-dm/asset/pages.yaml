  md: 'To fully exploit the I/O devices in a database that is using automatic storage,
    a good value to assign to this configuration parameter is the value AUTOMATIC.


    If you are not using automatic storage or the value AUTOMATIC is not recognized
    (as is the case with earlier versions of DB2), this configuration parameter should
    be assigned a number that is one or two more than the physical devices on which
    the database resides. It is better to configure a few additional I/O servers and
    not use them, than to configure enough since there is a minimal amount of overhead
    associated with each one; any unused I/O servers will remain idle. Unfortunately,
    a Symmetric DMS is not obvious to a DB2 LUW database, this number may not be.


    Each hypervolume presented to the host may be served by one or more head/disk
    arrays (HDAs) and multiple hypervolumes can be served by the same HDA. Understanding
    how the storage is laid out is imperative to assigning a meaningful value to the
    num_losers database configuration parameter.


    # 3.7.4 Table size extent


    In Section 1.6,"A closer look at table spaces," we say that data is transferred
    to and from containers in4 KB, 8 KB, 16 KB or 32 KB blocks called and when a table
    space spans multiple containers, data is written in groups of pages called extents,
    in a round-robin fashion, to each container assigned to that table space. Thus
    the extent for a table space is essentially the stripe size for the table space
    if more one container is used. A table space''s extent is defined as part of the
    table space creation process, and cannot be changed without dropping and re-creating
    the table space. Therefore, it is important to choose the right size for a table
    space before it is populated with data.


    When deciding on an extent to use, the size and type of tables that will be stored
    in the table space should be taken into consideration. A table is made up of the
    following separate objects:


    +   * A data object—This is where the regular column data is stored.

    * An index object—This is where all indexes defined on the table are stored.

    * A long field object—If the table has one or more LONG columns, this is where
    long field data is stored.

    * Two LOB objects—If the table has one or more LOB columns, then each object is
    used to store the LOB data and the other object is used to store metadata that
    describes the LOB data.

    * A block map object—This is where metadata for multidimensional tables is stored.


    Each table object is stored separately, and each object allocates new extents
    as needed. Each DMS table is also paired with a metadata object called an extent
    map, which describes all of the extents in the table space that belong to the
    table object. For space maps is also allocated one extent at a time. Therefore,
    the initial allocation of space for an object in a DMS table space is two extents.
    (The initial allocation of space for an object in an SMS table space is one page.)


    So, if you have many small tables in a DMS table, you may have a relatively large
    amount of space allocated to store a relatively small amount of data. In such
    a case, you should specify a small size extent. On the other hand, if you have
    a very large table with a high growth rate, and are using a DMS table space, you
    should specify a large size extent. With a small size extent, you could have unnecessary
    overhead related to the frequent allocation of additional extents.


    Optimizing table space performance when storage containers reside on RAID devices'
