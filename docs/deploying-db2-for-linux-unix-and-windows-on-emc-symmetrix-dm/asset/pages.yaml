    by optimizing reads from both mirrors) were only available with mirrored (RAID
    1) volumes. However, with the 5670 release of the Eniguity Operating System and
    RAID 5 support made it available to features... While mirrored storage is still
    the recommended RAID configuration to use on Symmetrix DMX...


    The availability and performance requirements of the applications using Symmetrix
    DMX storage help determine the appropriate level of RAID to use. DB2 LUW databases
    can be deployed on RAID 1 protected disks, RAID 5 protected disks, RAID 6 protected
    disks, and RAID 1+0 protected disks, or a combination of these protections. Mission-critical
    databases are candidates for RAID 1 protected volumes while databases used for
    development, testing, QA, andor reporting are good candidates for RAID 5 or RAID
    6. The same is true for decision system support (DSS) databases. In many environments,
    performance requirements generally grow with the need to conduct rapid writes
    (Data warehouses are typically loaded during off-hours and reports are used within
    a given time window; reads, on the other hand, can happen any time the data warehouse
    is not loaded.) Since there is no penalty for RAID 5 or RAID 6 writes (there is
