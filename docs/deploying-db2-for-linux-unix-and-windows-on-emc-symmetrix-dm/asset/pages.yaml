  md: '# 2.6.5 TimeFinder/Mirror reverse split


    BCVs can be mirrored to guard against data loss through physical device failures.
    A reverse split is applicable for a BCV that is configured to have two local mirrors.
    It is generally used to recover from an unsuccessful restore operation. When data
    is restored from the BCV to the standard device, any writes that occur while the
    standard is being restored alter the original copy of data on the BCVs primary
    mirror. If the original copy of BCV data is needed again at a later time, it can
    be restored to the primary mirror from the BCVs secondary mirror using a reverse
    split. For example, whenever logical correction is introduced to a database during
    a recovery process (following a BCV restore), both the standard device and the
    primary BCV mirror are left with corrupted data. In this case, a reverse split
    can restore the original BCV data from a BCVs secondary mirror to its primary
    mirror.


    This is particularly useful when performing a restore and immediately restarting
    processing on the standard devices when the process may be restarted many times.


    > Note: Reverse split is not available when protected restore is used to return
    the data from the BCVs to the standards.


    # 2.6.6 TimeFinder/Clone operations


    TimeFinder/Clone operations using SYMCLI can create up to 16 copies from a source
    device onto target devices. Unlike TimeFinder/Mirror, TimeFinder/Clone does not
    require the traditional standard-to-BCV pairing. Instead, TimeFinder/Clone allows
    any combination of source and target devices. For example, a BCV can be used as
    the source device, while another BCV can be used as the target device. Any combination
    of source and target devices can be used. Additionally, TimeFinder/Clone does
    not use the traditional mirror positions the way TimeFinder/Mirror does. Because
    of this, TimeFinder/Clone is a useful option when more than three copies of a
    source device are desired.


    Normally, one of the three copies is used to protect the data against hardware
    failure.


    The source and target devices must be the same emulation type (FBA or CKD). The
    target device must be equal in size to the source device. Copies of stripped or
    concatenated volumes can also be created providing the source, and target volumetaus
    must be identical in configuration. Once activated, the target device can be instantly
    accessed by a target''s host, even before the data is fully copied to the target
    device.


    TimeFinder/Clone copies are appropriate in situations where multiple copies of
    production data is needed for testing, backups, or report generation. Clone copies
    can also be used to reduce disk contention and improve data access by assigning
    users to copies of data rather than accessing the one production copy. A single
    source device may maintain as many as 16 relationships that can be a combination
    of BCVs, clones and snaps.'
  merge: -1
