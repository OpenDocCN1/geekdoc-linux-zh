    Listing 1.21 shows a machine without load. The first line displays the PID of
    the process last started, load averages, and the current time. The next line shows
    the number of processes and how many are running at the moment. The third line
    contains the current CPU statistics and the last line of the header shows the
    amount of memory available and how much of it is actually used.


    The remaining lines are the currently running processes sorted by their CPU usage.
    Typing u followed by a valid username filters the output to processes owned or
    run by a specific user (Listing 1.22 and Listing 1.23 illustrate the process).


