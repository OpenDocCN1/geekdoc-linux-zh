    # 3.2 USERS AND GROUPS


    Regardless of the purpose of a system or even a network, the computers need to
    know who is allowed to do what, where, and sometimes when. An operating system
    differentiates between the people allowed to perform certain actions on it by
    the so-called User IDentification Number or UID for short. To ease the administration
    of a number of users with related rights, the concept of bundling them together
    as a group is used. To ease the interaction of the system with the computer’s
    administrator and users, both have names assigned to them. The following sections
    explain the concepts and related tasks to administer both users and groups.


    # 3.2.1 What Is a User?


    A user is to a *NIX system what an IP address is to a computer, just a number
    with some kind of meaning. To make sense for the user, the IP address can be mapped
    to a name like slashdot.org, which is easier to memorize than 66.35.250.150. Similarly,
    the user number is what the computer actually uses and the username is what the
    human in front of the machine uses to identify certain users, representing the
    same kind of number-to-name mapping.


    # 3.2.2 What Is the passwd File?


    To create the mapping of the user number to the user name, you store a file called
    passwd in the /etc directory. All programs are allowed to read this file, but
    only root is allowed to write to it. The structure of the file comes from the
    very first incarnations of *NIX systems. It used to contain the scrambled passwords
    as well. This arrangement proved to be too volatile after a while. Programs to
    “crack” the stored passwords in the passwd file started circulating in the network
    that would become the Internet one day, and to increase security, the scrambled
    passwords were stored in another file called shadow (see Section 3.2.3, “What
    Is the shadow File?”, for more'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'information). The structure of a user record in the /etc/passwd file is shown
    in Listing 3.24.


    # LISTING 3.24 A User Record in the passwd File


    ```

    root:x:0:0:root:/root:/bin/bash

    ```


    The delimiter is the colon ":", the first field is the username, the second field
    is where the scrambled password used to be, the third field is the user number,
    the fourth field is the number of the primary group, the fifth field contains
    the "real name" of the user, the sixth field is the home directory of the user,
    and the seventh field the default shell to be used for interactions with the system.
    If the user record describes not a real user but the user-context of a process,
    for example, lp, responsible for managing the print queues, then the field that
    stores the standard shell contains /usr/bin/false, /bin/false, or simply nothing.


    The term user-context refers to processes that are running in the context of a
    certain user number in the system, in the user space to be precise. A user has
    certain usage rights granted by the administrator regarding reading and writing
    from and to files and execution rights for certain programs. On a well-administered
    system, a user is never able to exceed the given rights, thus making the system
    secure.


    One question remains—why is there still a field where the scrambled password used
    to be stored? This is a question of continuity; removing the field would require
    the possible rewrite of almost every program inside the *NIX system. At the very
    least every program would have to be checked to see if it still made use of the
    file. The two "wasted" bytes in every user record are a small price to pay compared
    to the effort needed to test every part and every program in a whole system.


    # 3.2.3 What Is the shadow File?


    As already mentioned, the file named shadow in /etc stores the scrambled passwords
    used by the system. Only root has read permission on this file; no one else. Listing
    3.25 shows the permissions on passwd and shadow.


    # LISTING 3.25 Access Permissions of passwd and shadow


    ```

    root@unixhost# ls -l /etc/passwd

    -r--r--r-- 1 root sys 568 Jun 29 10:40 /etc/passwd

    root@unixhost# ls -l /etc/shadow

    -r-------- 1 root sys 332 Aug 2 15:38 /etc/shadow

    ```


    The structure of a user record in shadow is shown in Listing 3.26.'
