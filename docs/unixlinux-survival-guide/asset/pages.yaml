- pgno: 218
  md: '# LISTING 7.2 Calculating the md5 Sum


    ```

    #!/bin/sh


    FILEPATH=./.HO/file_trans

    RUNDATE=`date "+%Y_%m_%d"`

    THE_FILE=$FILEPATH/sums_$RUNDATE.md5

    THE_LIST=$FILEPATH/list_$RUNDATE.lst


    for i in etc bin sbin usr/local/bin

    do


    find ${i} -follow ! -type d | sort | xargs md5sum >> $THE_FILE

    ls -alLR ${i} >> $THE_LIST


    done

    ```


    You have to modify the $FILEPATH variable to fit your needs, and the $THE_FILE
    and $THE_LIST variables, too, if a different naming scheme is desired. Depending
    on the OS used, the command md5sum might be called md5 as well; you have to check
    the manpage to find out. The md5sum on Solaris creates the output shown in Listing
    7.3.


