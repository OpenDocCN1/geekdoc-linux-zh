    # 7.4.4.2 Configuring snort


    You need a configuration file to use snort in IDS mode. The file is usually stored
    in /etc/snort/snort.conf. If you should want to use a different configuration
    file, you could supply the file with the -c option. One setting in the configuration
    file points to the directory containing the IDS rules. The file supplied with
    the snort installation can be used as it is, with two small changes. First, you
    need to change the variable HOME_NET from any to the IP range your network is
    using. If the network uses the range from 192.168.0.1 to 192.168.0.254, for example,
    then you need to change the entry to 192.168.0.0/24. Second, you need to make
    sure that the variable RULE_PATH points to the right directory, the one the rules
    are stored in. These rules should be updated periodically from http://www.snort.org.
    Because the rules at snort.org are updated every hour, you should take the time
    to download them before running an important check. Now you can start the program
    with the command snort -c <path to configuration file>. The program will answer
    with some diagnostic messages. As long as there are no errors, the program runs
    IDS mode, scanning the network for packages. The key combination Ctrl-C terminates
    the program again. When the program terminates, it displays a message containing
    the number of packages seen and indicating if an alarm was triggered, as shown
    in Listing 7.35.


