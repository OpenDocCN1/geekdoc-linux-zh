  img_proc: true
- pgno: 65
  md: 'at is started with the time the execution should begin as the parameter. After
    pressing Enter, you are shown the secondary prompt; here you type the command
    to be executed. After pressing Enter again, you use the key combination Ctrl-D
    to terminate the session. at answers with the shell that will be used to execute
    the command and the job ID followed by the execution time.


    To list the pending jobs in the at queue, you use the command atq, as shown in
    Listing 2.24.


    # LISTING 2.24 Displaying the at Queue


    ```

    root@unixhost:> atq

    Rank  Execution Date   Owner    Job        Queue  Job Name

    1st   Jun 15, 2004 17:00 root     1087311600.a a      stdin

    2nd   Jun 15, 2004 20:17 root     108732345.a  a      stdin

    ```


    The preceding listing, taken from a Solaris system, shows that there are two pending
    jobs, one starting at 5:00 P.M. and one at 8:17 P.M. at interprets time in the
    following manner:


    +   1. If the time used as parameter is still in the future, the command will
    execute today at that time.

    +   2. If the time has already passed, the execution will start tomorrow at that
    time.


    Both jobs are in queue a, the default if the flavor of *NIX uses a queuing system
    for at jobs.


    Besides specifying a time and a date, at is able to use shortcuts like now, midnight,
    and noon as time. These can be combined with so-called increments, like noon tomorrow
    or now + 2 days; even combinations like 4pm tuesday or now + 2 months are possible.
    To make sure that a certain shortcut works on your system, it is always advisable
    to check the manpages.


    To remove a job, you can use the command atrm, as shown in Listing 2.25.


    # LISTING 2.25 Removal of a Scheduled Job from the Queue'
