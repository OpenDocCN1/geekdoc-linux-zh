  md: '+   Names instead of numbers for month and day. The first three letters of
    the name would be used, for example, sun for Sunday; ranges of names, like sun-wen,
    are not allowed, though.


    +   The use of environment settings. The V7 cron always executes commands within
    /bin/sh and sends e-mails to the owner of the crontab, if the called command returns
    something other than 0. Here the environment can be modified by using a name =
    value pair; for example, MAILTO = jdoe would send all resulting messages to the
    user jdoe on the system.


    # 2.4.2.2 The cron Background Process


    Depending on the build of cron, either you have no options to consider ("old"
    cron) or you can set one of the two options -s or -o ("new" cron). -s enables
    cron to deal with the DST switches. Programs intended to run every hour will execute
    as expected, but should the hour of execution "vanish" due to the switch, execution
    of the program will take place at the scheduled time plus one hour. The -o option
    mimics the behavior of the "old" cron. The fact that this choice exists in the
    first place is another example of the *NIX philosophy not to break existing programs
    or scripts. If the programs are able to handle the switch and from the Daylight
    Savings Time themselves, then the -o option enables them to continue to do so,
    instead of requiring the programmers to adapt all the scripts and programs to
    the new behavior of cron.


    # 2.5 SUMMARY


    This chapter discussed the topic of executable programs in *NIX, how and when
    a program or script is executed at all, and how to convey the needed interpreter
    to the operating system if one is needed to execute a script. It demonstrated
    the creation of shell and Perl scripts and how to maintain versions of those scripts.
    It talked about directory structures to store the scripts and accompanying files
    during the development process. It closed with a discussion about the two mechanisms
    provided by *NIX that allow the scheduling of scripts and programs to be executed
    at a later time and/or date.'
