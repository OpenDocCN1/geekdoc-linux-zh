    erikk@192.168.0.2''s password:

    base_netconns.log.04 100% |********************************| 2130

    00:00

    ```


    Neither the account details nor the transferred data could be intercepted during
    this transfer. The mode used that addresses erikk@192.168.0.2 looks like an email
    address and means the user erikk on the system at 192.168.0.2. The program'
