    # 2.4.2 The cron Mechanism


    Unlike at, cron is used to execute commands or scripts in a recurring manner.
    It is ideally suited for things that should happen, for example, every day at
    8:00 A.M. and 6:00 P.M. or once a week on a certain day.


    Every user is allowed to maintain his own crontab, provided the username is either
    listed in the file cron.allow or not listed in the file cron.deny. The location
    of these files, if they exist, is normally inside the /etc tree. If neither of
    these files exists, access to the cron mechanism can be configured on a systemwide
    basis, either only the superuser is allowed to use it or all users are allowed
    to use it. Check the manpages of your *NIX distribution if you need to find out.


    # 2.4.2.1 The crontab


    cron uses a file called crontab for human interaction. This means if you issue
    the command crontab -e, it opens the editor that the variable $EDITOR points to
    and allows you to modify this file. You should make sure $EDITOR is set to vi;
    otherwise, you will encounter the not too user friendly ex editor.


    The format of the crontab file is quite simple, but as always, a little documentation
    helps to remember.


    +   - Minute (0–59)

    +   - Hour (0–23)

    +   - Day of the month (1–31)

    +   - Month of the year (1–12)

    +   - Day of the week (0–6= Sunday)

    +   - The command to execute


    The # sign is used to give a line a "comment" status, which means cron will ignore
    the line. Using comments always makes configuration files more readable. All parameters
    can be used as follows to span a period: 8 - 18 in the hour section means do it
    from 8:00 A.M. to 6:00 P.M. If the command should execute every 15 minutes, a
    comma-separated list, for example, 0,15,30,45, will do the job. If the program
    should run every hour, the asterisk * is used. A template like the one shown in
    Listing 2.28 helps you concentrate on the job instead of memorizing the order
    of the entries.'
