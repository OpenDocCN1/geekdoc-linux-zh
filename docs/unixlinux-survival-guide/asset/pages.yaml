    # 2.3 PERL SCRIPTS


    Perl is short for "Practical Extraction and Reporting Language." It is included
    with most of the *NIX distributions nowadays. Some of them actually rely on the
    existence of Perl to tackle administrative tasks. Perl was originally created
    to provide a means to extract and format information found in larger text or log
    files in an efficient manner. Regardless of its origins, Perl started to evolve
    into a full-blown programming language; even object-oriented programming techniques
    are supported.


    One aspect that makes Perl unique is its simplicity; it allows you to build handy
    tools with unmatched ease. Perl feels different when compared to other scripting
    or even programming languages. Perl was created in a way that allows you to complete
    easy tasks in an easy way without preventing you from tackling more complicated
    jobs with it. The most important saying in Perl is this: if the program does its
    job, it is a good program. Using Perl requires only rudimentary experience in
    another programming language. If you worked your way through the shell-scripting
    example, you should be set. If you are a seasoned programmer and you are anxious
    to learn Perl, you will find many familiar functions in it.


