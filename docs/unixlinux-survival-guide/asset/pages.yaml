    Every occurrence of &frobozz; will be replaced by "FroBozz" (without the quotes).
    If the final decision regarding the name of the program is reached, you just need
    to change the string &frobozz; points to and do a make all, thus re-creating all
    documents with the proper name.


    # 6.2.1.1.4 Extracting Information


    The advantages of using XML regarding publications are obvious, but what else
    can be done if the data is structured? If you want to extract certain information
    from an XML file, the information you are interested in needs to be described
    in a transformation document (XSLT). Because this subject requires a very thorough
    discussion—a variety of books on the market cover only transformations—just a
    short example (see Listing 6.12) of how it could be done is offered.


    # LISTING 6.12 XSLT File to Extract Certain Information


    ```

    erikkk@unixhost> cat getcommands.xsl

    <xsl:stylesheet version="1.0"

    xmlns:xsl="http://www.w3.org/1999/XSL/Transform">

    <xsl:output method="text" />


    <xsl:strip-space elements="*" />


    <xsl:template match="/">

    <xsl:text>Tagged with command:

    </xsl:text>

