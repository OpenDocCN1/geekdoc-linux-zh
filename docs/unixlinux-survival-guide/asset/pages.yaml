  md: 'first error found by xmllint ripples through the remainder of the document,
    making the whole structure invalid. If you encounter an error like this, all following
    error messages should be disregarded. Take care of the first error. All other
    errors might be a result of the first one. Using the program this way disregards
    most of its capabilities; the program is extremely versatile. Its output usually
    displays the whole XML tree found in the document. You can suppress this default
    behavior by using the option --n oout; you are interested in error messages only.
    The options --post-valid and --xinclude instruct the program to postpone the validation
    until all external XML files are loaded and the complete tree is created in RAM.


    A valid question would be this, "Why was the validation not part of the maketest.sh
    script?" The answer is that there is more than one way to achieve the desired
    results. As usual, on *NIX the choice is yours. What should the script do if an
    error pops up while running xmllint? The script would have to deal with the error
    messages and take some predefined path of action. It would have to stop processing
    most of the time (but not always) because the error indicates the XML result tree
    is not valid for one reason or the other. There might be no reason to continue.
    A structural error inside an XML file needs human intervention. So instead of
    trying to intercept possible error messages, you could try a slightly different
    approach to solve the problem. Sometimes, in the past of *NIX (a really long time
    ago, computer-wise), people grew tired of writing scripts to initiate and monitor
    the build process and the messages returned by the compilers. They created the
    program make. The program is about the same age as lint; among other things, its
    main use is to manage the dependencies that require monitoring while compiling
    a program or a set of programs. Because xsltproc isn''t that different from a
    compiler, it actually comes pretty close to c1—for the programmers among the readers—so
    why not use it? It comes with the operating system anyway. Contrary to popular
    belief, understanding make is not that hard and complex. Its use is actually pretty
    straightforward and logical, if you do not try to achieve too much in one go.
    Listing 6.9 shows a makefile for the task at hand.


