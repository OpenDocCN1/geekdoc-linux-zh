    This approach is called preventive maintenance. The name stems from the fact that
    all problems that can possibly occur on a computer system usually start small.
    This means there are indicators that something is wrong, and it is your job to
    find out what. Using this technique, supported by the baseline data, enables you
    to react to problems before the users of the system notice anything (see also
    Section 3.3.6, "Customer Relations," later in the chapter).


    # 3.3.5 Security Patches


    No operating system is perfect. This revelation may be shocking, but there you
    go. The *NIX architecture usually prevents the worst surprises, but some threats
    still require the patching of the system. Your only line of defense is to make
    sure your systems are current.


    Make it a habit to check the relevant lists or vendor Web sites at least once
    a day. If there are two to four *NIX brands in production, the time required should
    be something in the line of 30 minutes. These 30 minutes are well spent compared
    to the effort to repair a system that has crashed because of a hardware error
    that could have been prevented if the necessary patches had been installed. The
    same holds true for a security breach that occurs after the manufacturer had released
    the specific patches.


    If there are patches to install, do not rush to install them without testing,
    though. If possible, test the patches on a system that will not interrupt the
    flow of work inside the company. Try to read all the documentation that accompanied
    the patches, especially the readme files; they usually contain the necessary information
    about possible side effects. Test the patches with all software packages that
    are installed on the production systems. If a patch does not work as expected
    on the test system or breaks a program you are relying on, no harm is done. One
    should contact the manufacturer of the software to try to find out if there is
    a patch or upgrade for the program in question. Most third-party software developers
    work in a close relationship with the manufacturer of the operating system, so
    they should be aware of any problems. The two parties usually consult before they
    release any new patches, but it does not hurt to ask.


    As already mentioned, you should use a test system to test the patches if possible.
    It is advisable to maintain such a system; see Section 6.1, "A System for Testing,"
    for more information on test systems. Using a test system is especially important
    if the software used on the productions systems was customized, altered in one
    way or the other, and does not completely resemble the binary on the installation
    media. The test system will be covered later in the book, but the vital information
    you need to know for now is this: the system does not have to be an exact'
