- pgno: 138
  md: 'environments “grew” in a more organic manner and were not scaled to fit the
    needs. Somewhere in the past, the decision was made to install the backup service
    on a machine that seemed to have room for that task. If this machine dies, it
    doesn’t just take the data, or whatever it used to do besides running the backup,
    with it, but the backup system is gone as well. You have no way to start a recovery
    session. As simple as the last statement sounds, many IT-related decisions remain
    pending because of daily stress and overworked administrators, with the inherent
    promise to “look into that, as soon as time permits.”


    If you are confronted with a situation like the one described, you should try
    to find a solution as soon as possible. A system capable of running a backup service
    for a couple of clients (a client in that respect is every machine, workstation,
    or server having data that needs to be backed up) in a satisfactory way needs
    to fulfill only four requirements:


    +   1. There should be a reliable backup device attached to it.

    +   2. The system needs a certain amount of memory and hard disk space.

    +   3. The used operating system should be stable and secure.

    +   4. The system should have more than one network interface.


    The backup system should not run additional services. These services would suffer
    when the system is busy running a recovery session. Configurations using a customized
    runlevel (see Chapter 5 for more on init states and runlevels) to run the backup
    software are not usable during normal operation hours without shutting down running
    services. The quote “you only need the backup software during the night” works
    as long as you do not have to recover a crashed system during daytime.


    The operating system to run the backup software on should be as stable and secure
    as possible. Because backups are usually performed via the network, the OS should
    be able to deal with more than one network interface and make use of the presence
    of more than one network interface.


    There is one exception to the rule. If you are using clustered systems—this means
    more than one system is clustered to the others and is not visible to the outside
    world as an individual system, but as a single system providing services to the
    network, the so-called virtual system—then running the backup server on it should
    not be a problem. You just have to make sure to be aware of the impact on the
    running services and that you have enough capacity to start the backup software
    during normal operation hours as well.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 4.2.8 Check the Backups!


    Test periodically whether it is possible to read in old backups. If the read/write
    head of a tape drive starts moving, it will be a gradual process, and it will
    take a long time before a noticeable change occurs. If the unit fails to read
    in an older tape, you should take precautions immediately. Compensating for a
    misaligned read/write head requires either great skill or money. If you desperately
    need to get back an older backup written with a misaligned head, brace yourself
    for the bill to be paid. It can be done, but the companies capable of doing it
    charge accordingly. If you have to try to misalign the head of a replacement unit
    just to get to the contents of the tape, the warranty of this device will be voided.


    Make it a habit to restore backups older than a month or even older to an empty
    directory on a periodic basis. If you encounter any errors, the unit should be
    replaced. If you followed the author’s advice and bought an external unit, test
    it as well. The capability to restore important information is at stake here.


    # 4.3 SUMMARY


    This chapter discussed strategies regarding backup and provided information that
    needs to be taken into account while creating a strategy for doing daily, weekly,
    and monthly backups. It talked about the necessity of storing copies of the backups
    off-site. It continued with tips and a script to create backups of files vital
    to the operation of the system. Some other tips included the creation of a duplicate
    boot disk and the necessary assessment of the existing backup hardware and infrastructure.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 5 Setting Up a System




    +   - Installation

    +   - How to Ready a System for Production

    +   - Booting a System


    The installation of a new system seems to be a simple, if not mundane task, according
    to the distributors of the operating system software, that is. It''s just something
    you have to do before using your shiny new hardware. There is some truth in that.
    It is possible to install the OS on a new system in a very short period of time;
    whether or not the system is fit for the tasks you bought it for is a different
    matter. If you intend to replace an existing system, then you already know the
    requirements regarding disk space and probably know what the software to be used
    needs. Issues regarding the scheme of hard disk partitions actually used should
    point you to the necessary changes in that respect, and you know the software
    and are aware of useful deviations from the current configuration. But things
    look very different if the system is to be used for new services. The lack of
    first-hand experiences needs to be accounted for. As for the hard disk requirements,
    you have to rely on the specs provided by the manufacturer. After the new system
    is installed, it is'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'far from ready to be released in the wild. Its state needs to be changed from
    “newly installed” to “ready for production.”


    # 5.1 INSTALLATION


    The new hardware is right in front of you, waiting to be of service—almost. Installing
    the operating system is job one. Contrary to the claims you might have heard from
    the manufacturer’s marketing department, this process needs proper planning! If
    you already have experience with the *NIX derivative you want to use, then you
    know what to look for. If not, you have to read the supplied documentation. Taking
    this time out of your busy schedule is something that you are expected to do.
    Even if you should know an earlier version of the OS, take at least the time to
    study the release notes; they should contain the changes with respect to earlier
    releases of the software. Because the actual process of installing a *NIX system
    differs from one brand to the other, this chapter just contains some remarks of
    a more general nature.


    # 5.1.1 Planning an Installation


    If you intend to install new (and thus unknown) hardware, even if it is some variation
    of something you already know, then you have to take a look in the documentation.
    If there is something you need to take care of before the actual installation,
    you can learn about it there. The system requirements are in the installation
    documentation. If you need to install additional software, for example, a database
    application, then you have to consult its documentation as well. Once you have
    gathered all the necessary information, then you are about to start the planning
    phase.


    There is a saying that planning replaces coincidence by misapprehension. If you
    have never heard it, then take a moment to reflect. If you never used the operating
    system before, then you should check the documentation—hardware and software—and
    install it the way it suggests there. Answer all questions asked by the installation
    program with the provided defaults, but do not connect the system to a network,
    yet. You could use a minimal setup consisting of another machine and a hub but
    no connection to the outside world, including your internal network, if necessary.
    If you should find anything unusual or something that needs to be investigated
    further, take notes and leave the system running after the installation completed
    without errors. Use another system to download the current patches for the newly
    installed machine. You need to read the documentation that comes with the patches
    and check for problems regarding the intended use of the new system. Then apply
    the patches by following the supplied instructions to the letter.'
  merge: -1
  img_proc: true
