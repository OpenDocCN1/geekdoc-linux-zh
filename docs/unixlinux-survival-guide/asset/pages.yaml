- pgno: 12
  md: '# Foreword


    This book is about the administration of *NIX systems. There is no real "right"
    or "wrong" approach in this respect. You usually have more than one way to achieve
    a certain goal.

    *NIX administration is a creative process.


    Sound too good to be true? One of the goals of this book is to prove that this
    sentence is true. If you view a *NIX-based system as a box of wonderful tools
    providing almost limitless possibilities to create solutions, the meaning of the
    sentence starts to make some sense. Add your own creativity into the mix, and
    you are getting even closer to the real meaning of that sentence.


    More often than not I have been astonished with how well structured and logical
    *NIX-based systems are. Not that I didn''t know about this before, but after 18
    years one takes a lot of things for granted and tends to forget what it is like
    the first time on a *NIX system, the countless things to investigate and explore.
    To make a long story short, while writing this book, I tried to see my favorite
    OS with the eyes of a beginner. I tried to forget experience and instinct and
    tried instead to make sense of manpages last viewed on Solaris 2.5.1 almost eight
    years ago. I did what I recommend in this book.


    I have been using pretty much everything that resembles a *NIX system during the
    last 18 years. One important thing I learned during these years was the fact that
    even seemingly different operating systems like Solaris and AIX have more in common
    than you might think. The book describes techniques that are common to almost
    all flavors of *NIX available, and most of them will work on BSD-based systems
    like OS X as well. There might be some slight differences like the location of
    a file, but the contents of that file are used for the same purpose on every system.'
  merge: -1
  img_proc: true
