- pgno: 167
  md: '```

    root@unixhost# ls -al admintrans

    total 3

    drwxrwx--- 2 root admintrans 512 Sep 20 10:10 .

    drwxr-xr-x 11 root other 512 Sep 20 10:07 ..

    -rw-rw-r-- 1 silvied admintrans 89 Sep 20 10:14 monthlytasks.txt

    ```


    Listing 5.21 creates a directory to be shared for the members of the admintrans
    group. The users silvied, marionb, and markusk have read and write permission
    in that directory. Every user is able to read, change, and delete the files created
    by another user; the command chmod g+w admintrans gave the rights to all members
    of the group. All rights of the other users were revoked via chmod o-r,o-x admintrans;
    only members of the group admintrans are able to use the directory and list the
    files in it.


    Is it possible to prevent the accidental removal of a file created by another
    user? There is already one directory on every *NIX system using that kind of protection,
    the /tmp directory. Listing 5.22 shows the permissions.


    # LISTING 5.22 The /tmp Directory


    ```

    root@unixhost# ls -ld /tmp

    drwxrwxrwt 6 root sys 381 Sep 20 11:13 /tmp

    ```


    The so-called sticky bit is used to prevent one user from removing a file created
    by another user. The set sticky bit is indicated by the letter t in the permissions.
    If a user has write permission in a directory, then that user is able to remove
    files, even if that user has no write permission on the file. If the sticky bit
    is set on the directory, then only the owner and root are able to remove a file.
    Setting the sticky bit is shown in Listing 5.23.


    # LISTING 5.23 Setting the Sticky Bit


    ```

    root@unixhost# chmod +t admintrans

    root@unixhost# ls -l

    total 10

    drwxrwx-T 2 root admintrans 512 Sep 20 13:31 admintrans

    drwxr-xr-x 5 chrisk admintrans 512 Aug 23 15:33 chrisk

    ...

    ```


    The reason that there is a capital letter T this time, is because on some *NIX
    variants there are no permissions set for others. The command chmod +t <directoryname>
    works.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# USING chmod WITH 1770


    The command chmod accepts two different types of parameters to indicate permissions
    for files or directories.


    Symbolic: chmod g+rwx <filename> indicates that the group has read, write, and
    execute permissions.


    Octal: chmod 770 <filename> indicates that the owner and the group have read,
    write, and execute permissions. All others have no rights at all.


    To get the same result using the symbolic notation, you would have to use the
    following command: chmod u=rwx,g=rwx,o= <filename>. The symbolic notation is usable
    if you want to remove or add the write permission of the group: g-w (remove),
    g+w (add). The symbolic notation is easier to read. The octal notation (base eight)
    is faster and works as follows:


    | user | group | others | Modus |

    |------|-------|--------|-------|

    | 0400 | 0040 | 0004 | read (r) |

    | 0200 | 0020 | 0002 | write (w) |

    | 0100 | 0010 | 0001 | execute (x) |

    | 0500 | 0050 | 0005 | read/execute (r-x) |

    | 0600 | 0060 | 0006 | read/write (rw-) |

    | 0700 | 0070 | 0007 | read/write/execute (rwx) |


    The addition of the values 4 = read, 2 = write, and 1 = execute equals 7 (read,
    write, execute). If you use the binary system to write the same values, everything
    becomes apparent.


    ```

    rwx

    4  0100  read

    2  0010  write

    1  0001  execute

    ```


    This means that 0110 binary equals rw- or 6. If you want to use the octal notation
    to manage permissions for a file or a directory, you simply have to add the desired
    permissions to come up with the right number, 755 for rwxr-xr-x.


    Although there does not seem be room to set the sticky bit, there actually is.
    A quick glance at the two previous examples shows that there are four'
  merge: -1
  img_proc: true
