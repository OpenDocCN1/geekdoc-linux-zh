    --------- 1 root other 0 Sep 23 11:54 .netrc

    root@unixhost> ls -l /etc/hosts.equiv

    --------- 1 root other 0 Sep 23 11:54 /etc/hosts.equiv

    ```


    Because of the fact that the files do not have any set permissions, only root
    is able to change these files. The file .netrc is in / on Solaris systems, the
    $HOME of root. Systems with a separate $HOME for root should use the command accordingly.
    GNU/Linux uses /root for example. If the system allows the login of users, then
