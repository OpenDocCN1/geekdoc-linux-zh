  md: '# A.6.3 Moving or Renaming a Data File


    If you have to move or rename a certain data file, you must follow the order of
    the steps shown in Listing A.22. If you need to do this on a very busy database,
    you should make sure to execute all commands quickly because all write operations
    will go into a temporary buffer during the move or the rename. The best way of
    doing this would be to either perform this action during off-hours or ask the
    users to suspend all database operations for the time needed. Failing to follow
    the steps as shown will almost certainly result in a corrupt database.


    # LISTING A.22 Moving or Renaming a Data File


    ```

    alter tablespace <tablespacename> offline normal;

    alter tablespace <tablespacename> rename datafile

    <oldlocation/oldname> to <newlocation/newname>;

    ---- rename/move datafile with OS commands

    alter tablespace <tablespacename> online;

    ```


    If you have never done this before, please use a database for testing to get a
    feeling for the results and the duration of this operation.


    # A.6.4 Forcing a Log Switch


    This entry is in this book because the author cannot seem to remember that a log
    switch is a system item and not a database item. Listing A.23 shows the command.


    # LISTING A.23 Forcing a Log Switch


    ```

    alter system switch logfile;

    ```


    This command obviously requires a database with ARCHIVELOG enabled. The command
    select * from v$log; enables you to display the current status before and after.'
