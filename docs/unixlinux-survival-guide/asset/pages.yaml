  md: '# 6.2.1.5 A Closing Remark Concerning DocBook and XML


    If you are under the impression that using DocBook is a good idea to ease the
    chore of writing documentation, you are right. As already mentioned, the subject
    fills a lot of books, with no end in sight. What was demonstrated here should
    enable you to start experimenting on your own. There is an extensive FAQ (Frequently
    Asked Questions) regarding DocBook at http://www.dpawson.co.uk/docbook/index.html.


    # 6.2.1.2 A Closing Remark Regarding Documentation


    How you create your documentation is up to you. Just make sure you do it and try
    to keep it current. It is a great time-saver to have access to the what, why,
    and when something was changed or done. Things implemented some time ago are especially
    easier to grasp if you are able to use your documentation as a fallback.


    # 6.2.2 Bag of Tricks


    This section is about hints and tips to help you to create your documentation
    even faster. The author hopes you will find something interesting in here, but
    always keep in mind that there is rarely an absolutely "wrong" or "right" way
    of doing things in *NIX.


    The first hint is something you could do right away: you can create a text file
    in the home directory and take notes of everything that seems worth jotting down.
    The author calls this my_bag_of_tricks.txt. To repeat a saying of the one of the
    author''s teachers that still holds true for everything regarding *NIX: "You don''t
    have to know everything by heart; just know where to look it up." To give you
    some ideas, the author''s directory contains files named oracle_oneliners.txt,
    perl_oneliners.txt, bash_tricks.txt, really_stupid_things_to_avoid.txt, etc.


