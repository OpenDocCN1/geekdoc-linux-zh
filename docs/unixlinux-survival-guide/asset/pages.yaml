  md: 'mit the TCP/IP Fingerprint to the creator of the program if the operating system
    is known. Further, the output indicates that the TCP/IP stack used is not as secure
    as the one scanned in Listing 7.18. This means the program estimates a chance
    to guess the sequence numbers of the TCP/IP stack. Whether you should send the
    TCP/IP Fingerprint to the creators of the program depends on many things. If the
    security policy of the company prohibits it, then there are no further questions
    about it. If you should find an illegal system on your own network using the same
    TCP/IP Fingerprint, then you would have the advantage of knowing what you are
    dealing with, provided someone submitted the Fingerprint in the first place. On
    the other hand, if a cracker manages to gain access to your network, then he would
    know how to identify another operating system. The world is just not black and
    white regarding security; it depends what the user of a program is up to.


    The functionality shown should enable system administrators to scan their networks
    for suspect open ports inside their networks. If you use a firewall on a system,
    then you should definitely use nmap to test the configuration and make sure it
    really works the way it should. Using the program in this way enables you to test
    different scenarios on the test system before applying the configuration to the
    production servers. The program is capable of a lot more things; you should invest
    the time to read the manpage. And one more time: this program should be used to
    scan your own machines only. Scanning the networks of other people this way could
    get you into trouble in no time.


    # 7.4 NETWORK SECURITY


    Depending on the services that are provided in the network, securing a whole network
    can be an extensive undertaking. The topic has filled various books, and even
    if you would find the time to read them all, you would still have questions left.
    Therefore, this section discusses programs and configurations to secure single
    machines, thus making the network as a whole safer.


    # 7.4.1 Why use ssh?


    A quick reminder helps to understand the implications. The Internet was not built
    for commercial use. Originally, most system administrators knew the other administrators
    of the connected machines, either personally, if the systems were located in the
    same geographical area, or by phone. Almost all systems connected to the Internet
    were trustworthy. If someone did something stupid or out of bad intent, then the
    community either brought him to reason, or the system was removed from the net.
    Does this sound too good to be true? Now let’s move forward to here and now. All
    people interested in the layout of the current Internet should have a'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'look at the Internet Mapping Project (http://research.lumeta.com/ches/map/).
    This site contains some very impressive diagrams or maps of the Internet.


    Who is Bill Cheswick? If you surf to the Internet Mapping Project, take a look
    at http://research.lumeta.com/ches/. Bill Cheswick is one of the people working
    on the Internet Mapping Project. He is, in the author''s opinion, one of THE security
    experts in this world. If you should have a chance to visit one of his lectures,
    do it. One of the author''s favorite quotes from him is this: “The best firewall
    for Windows is the shrink-wrap around the box.” He has a very humorous way of
    describing all things related to security and computer security. His book Firewalls
    and Internet Security: Repelling the Wily Hacker [Cheswick03] should be on the
    bookshelf of everyone concerned with security.


    A quick glance at the maps will show everyone how much the Internet has changed.
    Based on this heritage it becomes obvious that not all protocols were designed
    with security in mind. The more common examples are the Telnet and the FTP protocol.
    No one would have sniffed the traffic between two hosts for financial gains in
    the old days, but the times have changed. Both protocols mentioned transfer everything,
    including passwords and account names, as clear text over the network, enabling
    all people with malicious intent to read them at will, not a very promising idea.
    Because you have no way of knowing who is listening in, even inside your own networks,
    you need to make sure that if someone eavesdrops, that they will not see anything
    of importance or, better yet, not see anything at all. The protocols/programs
    FTP, Telnet, rsh, and rlogin should not be used any more.


    An almost perfect replacement for the programs and protocols mentioned is the
    ssh (secure shell) package. It consists of three programs, ssh, scp, and sftp.
    The program ssh replaces telnet, rlogin, and rsh. It operates more or less like
    the mentioned programs, but encrypts the connection. The program scp (secure copy)
    replaces the rcp (remote copy) command. The syntax is very similar, but the program
    encrypts the sent and received packages. The program sftp is not a complete replacement
    for the ftp command, but greatly surpasses the security of that command. The last
    program sshd is a daemon that enables other programs to connect to it.


    The ssh package is part of almost every *NIX distribution nowadays. If you should
    have a system connected to a network without that package installed, then you
    should check the manufacturer''s Web site for availability and how to install
    the software. You need to follow the installation instructions to the letter to
    ensure that the program works as intended. If you really have no way to install
    the software on a production system, then you need to be well aware of the inherent
    risk. You need to check the configuration of sshd on a new system for certain
    entries to make sure the system is a secure as possible. Listing 7.20 shows an
    example.


    ![](img/e121d664a879353483b8ef78e54b87ea_238_0.png)'
