- pgno: 220
  md: 'There is an important reason to use two lists here: a change in the permissions
    of a file would not be reflected in the md5 sum. The command chmod o+w /etc/hosts
    does not change the file but the permissions stored in the filesystem.


    The resulting files should not reside on the machine on which they were created;
    they should be put in a secure location. Writing them, together with the files
    from other machines if applicable, to a CD-R ensures that no one is able to modify
    the contents of the lists.


    This solution does not measure up to the available commercial or free programs,
    but is an inexpensive way to monitor important files and directories. You could
    use the script as a base to create your own custom solutions.


    Should you use your own solution or buy a product? There is no easy answer to
    this question. It heavily depends on the knowledge and capabilities of the system
    administrator, not to mention the time constraints. If a system administrator
    is interested in creating his own solutions, the available time is often a problem.
    If the time needed (a good rule of thumb is add 50% on top of your calculations)
    is available, then every *NIX system provides the tools to create the solutions.
    You should try, though, to find out if another system administrator or programmer
    is already working on or was already successful in solving a certain issue. If
    that is the case, then you should inspect the work in progress or existing solution
    if it solves or at least helps to solve the issue at hand. For system administrators
    without extensive programming knowledge using this approach comes with the added
    advantage that the found solution can also be used to gain experience by inspecting
    the program. "Constant learning" is not just a buzzword for system administrators,
    but a way of living.


    There is one drawback to this approach regarding security though; you should make
    a reasonable assessment of your knowledge and capabilities if it comes to the
    topic of security. If you have any doubt, using an already tested and possibly
    supported product is the only way to go. Whether this product is created by a
    consultant or bought from a manufacturer depends on the required functionality.
    One possible solution could be to work with a consultant to gain the required
    knowledge; this approach works for the commercial solution and the custom solution
    equally well, because it furthers the knowledge of the system administrator. This
    consulting should continue as long as necessary to ensure that the system administrator
    will be able to deal with the solution in the future. If the budget allows participation
    in training held by manufacturers or consultants, then you should make sure that
    training is tailored to be as good as possible to the needs at hand.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 7.2.3 Checking Files with aide


    The program aide was created as a replacement for the better known program tripwire,
    as the development of tripwire was forked into a commercial version and an open
    source product. The open source variant is still maintained, but the last up-to-date
    of the packages (at least as of April 2005) took place in March 2001. The goal
    of aide is quite ambitious; the program should become better and more versatile
    than tripwire.


    The basic approach behind both programs is the same as the one behind the script
    in Section 7.2.2, “A Simple File Checker”—creating the means to monitor files
    and directories regarding changes. The aide program is naturally more versatile
    than the script, but needs, under rare circumstances, to be compiled on the system
    it should be deployed on. This means the system administrator needs to know how
    to compile a program and deal with possible error messages. The program is a part
    of most GNU-Linux distributions and can be downloaded for Solaris at *http://www.sunfreeware.com*.


    After the program is installed successfully, you need to edit the file aide.conf
    to customize it for the job at hand. Listing 7.7 shows an example configuration
    for Solaris.


    # LISTING 7.7  Example aide.conf (Solaris)


    ```

    ```conf

    #AIDE conf


    @@define TOPDIR ./HO/aid


    @@ifndef TOPDIR

    @@define TOPDIR

    @@endif


    # location of db file

    #

    database=file:@@{TOPDIR}/aide.db


    # location of db file to write to

    database_out=file:@@{TOPDIR}/aide.db.new


    # Whether to gzip the output to database

    # gzip_dbout=no


    #verbose=5

    verbose=20

    ```

    ```'
