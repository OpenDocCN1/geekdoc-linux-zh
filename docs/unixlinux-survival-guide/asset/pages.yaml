    by default or even available on the installation media. If top is not to be part
    of the *NIX distribution, you can download it from the locations given in Appendix
    B.


    # 1.2.4.3 sar


    The sar command, available on many *NIX systems, spells out to "system activity
    reporter" and covers a huge amount of measurements, ranging from CPU statistics
    to I/O on hard disks and terminal lines among others. The number of probes recorded
    varies between the different flavors of *NIX. The Solaris variant knows 15 groups,
    while the OS X supplied version is limited to 4.


    The mode of operation is the same on all supported platforms—sar is either run
    if needed, without storing any data, or an entry in a crontab initiates the collection
    of the data and stores it somewhere in the /var hierarchy. The resulting data
    files will be recycled, if configured. On a Solaris system, the filenames consist
    of the string sa and the day of the month, e.g., sa05 for the fifth day of the
    month. This mode of rotation allows to access "historical" data up to 30 days.


    To calculate and display information about the CPU load, you can use the command
    in Listing 1.24.'
