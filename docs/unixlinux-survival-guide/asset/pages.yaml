- pgno: 288
  md: '# B

    Software Used in This Book

    and Where to Get It


    There are many ways to get hold of the open source software mentioned in this
    book. The most efficient way is to get the source, compile it, test it thoroughly,
    and deploy it. Sadly, this approach to deployment is normally out of the question
    for system administrators because of time constraints. So the other option, getting
    precompiled binaries, is the way to go. Fortunately, most of the distributors/manufacturers
    of your brand of *NIX have already created or are supporting repositories containing
    more or less everything that is needed. That the packages on these sites are usually
    tested is an added bonus. One word of caution, though: everyone needs to make
    sure to use the provided way of testing the integrity of the downloaded packages,
    often by using md5 checksums.


    There is one thing you should keep in mind—the packages found on the following
    sites are usually maintained on a voluntary basis. Most of the people involved
    there owe you nothing; you, on the other hand, owe them big time. Therefore, you
    should try to help them save bandwidth by using mirrors if available and be patient
    if the latest version of the package you want to install is not available yet.
    There might be a reason.


    # B.1 SOFTWARE FOR SOLARIS


    Open source software for Solaris comes in two ways. Sun supplies you with a solid
    foundation via their companion CD-ROM. Included is the installation media, and
    if you should miss something, you can always head to http://www.sunfreeware.com
    and get it from there. The packages originating from the CD-ROM will be installed
    in /opt/stw; the packages you download from http://www.sunfreeware.com will end
    up in /usr/local. The downside here is obvious: the packages in one directory
    tree have no way of knowing about the libraries in the other. To rectify this
    situation, you should simply make /usr/local a symbolic link to /opt/stw. This
    way, you get the best of both worlds: packages supplied on the CD-ROM have access
    to the ones'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'downloaded from http://www.sunfreeware.com, and replacing the supplied packages
    with newer versions from the Web site simply requires the installation of the
    newer version.


    # B.2 SOFTWARE FOR AIX


    Open source software for AIX can be found on http://www.bullfreeware.com— Bull''s
    Large Open Source Software Archive for AIX—and http://aixpdslib.seas.ucla.edu—the
    UCLA Public Domain Software Library for AIX. Installing the software is usually
    a question of deflating the archive and running smit in case of the usual .exe
    files (these files are the self-extracting archives).


    # B.3 SOFTWARE FOR HP-UX


    Open source software for HP-UX can be found at http://hpux.cs.utah.edu— The HP-UX
    Porting and Archive Center. This archive is mirrored all over the world, so you
    should use a mirror server closest to your location. Please make sure to use SAM
    to install the packages; otherwise, the system won’t be able to use them.


    # B.4 SOFTWARE FOR IRIX


    SGI® distributes open source software for IRIX® at http://freeware.sgi.com—SGI
    IRIX Freeware—so you get the packages directly from the mothership, where your
    hardware originated. The downloaded packages can be installed via swmgr.'
