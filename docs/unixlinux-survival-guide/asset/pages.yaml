- pgno: 184
  md: "# 6.2.1 Tools for Documentation\n\nThe smallest entity with regard to documentation\
    \ is a plain text file. As long as this file does not contain too much information,\
    \ applying a simple structure will be sufficient. This is not about XML here:\
    \ headlines, paragraphs, indentation, and enough room between the entries should\
    \ provide the means to structure the information. Creating such documents, using\
    \ any text editor capable of saving plain ASCII, is more or less what every system\
    \ administrator does while editing configuration files, anyway. You should use\
    \ the program you feel comfortable with. You just have to make sure to save the\
    \ files either in plain ASCII or at least a format readable by as many programs\
    \ as possible. If there is a well-formed directory tree thrown in the mix—a tree\
    \ structure, to be precise—everything starts falling into place.\n\nIn other words\
    \ you could make use of the operating system’s capability to create hierarchies\
    \ by nesting directories to create the structure for storing the documents. If\
    \ you want to create a structure to represent the array of servers, for example,\
    \ you can use the following approach. The top-level directory is named after the\
    \ network or branch of network that houses the servers, the next level contains\
    \ directories named after the servers and directories named after procedures to\
    \ be followed, schemes that need documenting, etc. Listing 6.1 shows a possible\
    \ structure.\n\n# LISTING 6.1 Directory Structure to Document Servers\n\n```\n\
    servers\n    policies\n        security\n            mail.txt\n            firewall.txt\n\
    \            access.txt\n            ...\n    common_files\n        hosts\n  \
    \      resolv.conf\n        nsswitch.conf\n        ...\n    mailserver\n     \
    \   hardware_description.txt\n        IP_config.txt\n        applied_patches.txt\n\
    \        ...\n    fileserver_org\n    fileserver_admin\n    ...\n```"
  merge: -1
  img_proc: true
- pgno: 185
  md: "You should modify the structure based on the existing setup and requirements\
    \ to be documented. If your naming scheme is consistent, doing things like, for\
    \ example, searching for a patch can be done the *NIX way, as shown in Listing\
    \ 6.2.\n\n# LISTING 6.2  Searching the Structure for Patch Information\n\n```\n\
    erikk@unixhost> find . -name applied_patches.txt -print\\\\\n    -exec grep 113483\
    \ {} \\\\\\;\n./mailserver/applied_patches.txt\nPatch: 113483-02 Obsoletes: Requires:\
    \ Incompatibles:\n    Packages: SUNW ypu\n./fileserver_org/applied_patches.txt\n\
    Patch: 113483-02 Obsoletes: Requires: Incompatibles:\n    Packages: SUNW ypu\n\
    ./fileserver_admin/applied_patches.txt\nPatch: 113483-02 Obsoletes: Requires:\
    \ Incompatibles:\n    Packages: SUNW ypu\n```\n\nThe example shows how to search\
    \ for a patch named 113483. The naming of the patches is dependent on the naming\
    \ scheme used by the manufacturer of the operating system used, of course. Solaris,\
    \ for example, provides the means to create a list of all installed packages and\
    \ patches with the command shown. To create a list for later use, you could write\
    \ the output to a file and store it in the corresponding folder of the hierarchy\
    \ like so: `showrev -a > applied_patches.txt`. Using the `-a` option, adds, among\
    \ other things pertaining to this system, the hostid to the beginning of the list.\
    \ To create a list just containing the patches, you could use the option `-p`.\
    \ HP-UX provides the command `swlist` and AIX provides the command `instfix` to\
    \ achieve similar results. Because GNU-Linux does not make use of patches in the\
    \ sense of the other mentioned systems, the command `rpm -q -a` could be used\
    \ to create a list of all installed packages and their respective version numbers.\n\
    \nAs you can see, you do have ways to create structured documentation without\
    \ using any kind of special software beyond the tools that already come with your\
    \ operating system. Most of the systems supply the administration with some GUI\
    \ to manage the installed packages and software, but using them if the machine\
    \ in question is down or malfunctioning could be difficult. The same holds true\
    \ for the documents stored in the created hierarchy. The documentation should\
    \ be stored in three places: in a secure location on the machine, on a machine\
    \ that is used to gather all created documentation, and as printouts in a secure\
    \ location. The list of the installed packages and patches will probably result\
    \ in an impressive pile of paper, but if you cannot access the files on a computer\
    \ for one reason or the other, having access to a pile of paper containing the\
    \ needed information is better than"
  merge: -1
