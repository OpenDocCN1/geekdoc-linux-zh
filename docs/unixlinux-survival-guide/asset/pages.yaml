- pgno: 172
  md: 'Naturally commercial products like PureLoad™ or others like it allow much finer
    grained tests, but one of the goals of this book is to help you use the tools
    at your disposal in the operating system. Besides, if you write a script, then
    you learn something about the system and know for sure what happens.


    # 5.3 BOOTING A SYSTEM


    The sequence a computer starts with is, independent of the used operating system,
    more or less the same on all platforms. The system receives power, and a ROM or
    PROM starts to execute the code stored within. What a program does next depends
    on the hardware.


    If it is an x86-based platform, the BIOS tries to find an executable program on
    whatever storage media is available. There is no further interaction with the
    user. Many other hardware platforms come with an intelligent, operating system–type
    program that allows the user to interact with the hardware without using an operating
    system. The PA-RISC architecture (something that evolved with extinction) allows
    a limited interaction with the found hardware before the operating system starts
    to run. One step further in the evolution is the Open Firmware system (http://playground.sun.com/1275/)
    found in systems by Sun Microsystems, Fujitsu Siemens, and Apple. The system is
    based on ANS Forth and allows, among other things, the definition of variables
    to ease the access to disks or network cards. This means an Open Firmware–based
    system is able to connect to another system on the network and load the operating
    system from that system instead of using the local harddisk. It is even possible
    to write programs for Open Firmware; there are hardware updates by Sun that get
    started from the Open Firmware prompt to ensure that there is no activity on the
    system during the upgrade. If you use a hardware architecture with similar capabilities,
    then you should make sure to understand the possibilities of such a system. The
    Open Firmware–based systems allow you to use the command probe-scsi-all to start
    the self-test of all connected SCSI devices and report the findings—a quick way
    to test the connected harddisks.


    If the computer starts to load the operating system, either automatically or by
    a command issued at the hardware prompt, then every *NIX system goes through stages,
    the so-called init states.


    # 5.3.1 The Init States


    The meaning of the different init states varies between the various *NIX derivates.
    There is a general distinction between init states used for administrative purposes
    and the so-called multi-user init states. The system used here as an example is
    a Solaris system, and the init states there are compared to the differences in
    HP-UX,'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'IRIX, and GNU-Linux. AIX is mentioned only in the runlevels that are actually
    used. BSD-based systems like OS X do not use runlevels and are therefore not part
    of this section.


    # 5.3.1.1 init 5


    S or s is the same on most *NIX systems. This so-called single-user mode is for
    maintenance only; all *NIX systems regard one of the multi-user modes as "normal."
    It is actually not really a maintenance mode at all, but a mode that is used if
    the file /etc/inittab is missing or corrupt. If this happens, booting ends at
    runlevel S.


    If the system goes "down" to runlevel S from one of the multi-user runlevels,
    mounted volumes stay mounted, but all processes belonging to other runlevels are
    killed. The only exceptions are remotely mounted filesystems. If they exist, the
    necessary processes to keep them mounted will continue to run.


    # 5.3.1.2 init 1


    Runlevel 1 is the "real" single user or maintenance mode. All local filesystems
    are mounted; logins, except on the console, are not allowed. This mode is used
    to, for example, install patches in Solaris. The same holds true for GNU-Linux,
    HP-UX, and IRIX. This runlevel is reserved on AIX.


    # 5.3.1.3 init 2


    Runlevel 2, sometimes described as "local multi-user mode," brings the system
    up to a usable state. Users are allowed to log into the system, but there is no
    graphical user interface. The same holds true for HP-UX, IRIX, and GNU-Linux.
    AIX uses this runlevel as its standard runlevel: all services are activated, and
    the graphical user interface is started.


    # 5.3.1.4 init 3


    Runlevel 3 is the extended multi-user mode. Resources are made available over
    the network (for example, in NFS shares) and the graphical user interface is started
    if the system is configured that way. This is the standard runlevel of a Solaris
    system; the same holds true for IRIX. HP-UX uses this runlevel in the same way
    with the exception of the graphical user interface, as GNU-Linux. AIX allows the
    use of this runlevel with a user-defined configuration, similar to init 4 in Solaris
    or IRIX; AIX allows the user-defined runlevels from init 3 to init 9.


    # 5.3.1.5 init 4


    Runlevel 4 is available, but not used in Solaris. It is available to be used with
    a user-defined configuration to fulfill special requirements regarding the running'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'processes as an alternative to init 3, as in IRIX. HP-UX uses this runlevel
    as standard runlevel including the graphical user interface.


    # 5.3.1.6 init 5


    Runlevel 5 is very dangerous for system administrators switching back and forth
    between Solaris and GNU-Linux. Switching to init 5 in Solaris takes the system
    down and removes power if supported by the hardware. GNU-Linux uses this runlevel
    as standard runlevel, similar to init 3 in Solaris and IRIX and init 4 in HP-UX,
    respectively. System administrators switching between Solaris and GNU-Linux should
    put a visible indication about the differences on the system’s housing.


    # 5.3.1.7 init 6


    Runlevel 6 is used to reboot the system; the same holds true for IRIX and GNU-Linux.


    ![](img/e121d664a879353483b8ef78e54b87ea_174_0.png)


    > There is a saying that you can determine the age of a system administrator by
    the commands he uses to reboot a system. The rule of thumb is this: the older
    the administrator the more likely you are to see the commands sync Enter sync
    Enter reboot Enter.


    > What does the command sync do? It is used to flush the buffers to the respective
    disks. Often the reply is like this: “But this is what the system does anyway,
    doesn’t it?” Right, if all goes according to plan.


    > The separate command should not be necessary anymore. But the author uses the
    word “should” deliberately, meaning “most of the time.” Using the eight characters
    and the Enter key twice might make the difference if the data is written to the
    disk or not. The author’s opinion is simple (regardless of age): the two syncs
    should be used, especially if the system feels strange. Losing data for the sake
    of ten pressed keys is not an option.


    # 5.3.1.8 init 0


    Runlevel 0 is used to halt the machine. If the hardware uses Open Firmware, its
    prompt will be shown. The same holds true for HP-UX and IRIX. This runlevel is
    reserved in AIX, and GNU-Linux simply halts the system if run on x86.


    # 5.3.2 init State Overview


    Table 5.4 gives an overview of the init states on different systems.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# TABLE 5.4 init State Overview


    | State | Solaris | AIX | HP-UX | IRIX | Linux |

    |---|---|---|---|---|---|

    | 0 | Firmware | Reserved | Firmware | Powerdown | halt |

    | 1 | Admin | Reserved | Admin | Admin | Admin |

    | 2 | Multi-User local | Multi-User NFS xdm | Multi-User local | Multi-User local
    | Multi-User local |

    | 3 | Multi-User NFS xdm | User defined NFS | Multi-User NFS | Multi-User NFS
    | Multi-User NFS |

    | 4 | Alternate Multi-User | User defined | Multi-User NFS xdm | Alternate Multi-User
    | Not used |

    | 5 | Shutdown and Power down | User defined | Not used | Firmware | Multi-User
    NFS xdm |

    | 6 | Reboot | User defined (up to 9) | Not used | Reboot | Reboot |


    # 5.4 SUMMARY


    This chapter discussed the installation of a system, including the planning phase
    and some of the necessary configurations. It continued with a discussion about
    the difference between an installed system and a system that is ready for production,
    followed by hints concerning what needs to be done and a description of a “burn-in.”
    The chapter closed with a refresher about the various init states and their use
    on different *NIX brands.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 6 The Test System and the “Secure” System


    # In This Chapter


    +   - A System for Testing

    +   - Documentation


    Before you apply patches and upgrades or deploy new software on the production
    systems, you need to test. The first part of this chapter discusses what a system
    to run these tests should look like. Another system that should be part of every
    system administrator’s tool chest is the so-called secure system. In this sense,
    a secure system is not a special system, but rather a concept that helps to deal
    with certain aspects of the daily workload. (How to secure a set of systems is
    discussed in Chapter 7) Another topic mentioned often in this book is documentation.
    *NIX already provides tools to tackle this touchy subject right out of the box.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# 6.1 A SYSTEM FOR TESTING


    It is not easy to find the right arguments for a test system, especially to "sell"
    it to someone not working in the system administration profession. The following
    section is an introduction to the ideas behind using a system for testing. Hopefully
    the case is persuasive enough to arm you with the right information to get it
    into your budget.


    # 6.1.1 Description of a Test System


    The test system should be exactly the same system as the production system, in
    a perfect world. If you manage to put an exact twin of the production system(s)
    into the budget to be used as a test bed, congratulations, and please proceed
    to Section 6.1.2 "A ''Secure'' System," because you are done here. All others,
    bear with the author. The system to run tests on should at least be able to mimic
    the behavior of the production system. This means it should have the same CPU,
    not necessarily the same amount of RAM. Testing software, upgrades, and patches
    intended for a Solaris box on a GNU-Linux system could be interesting, to say
    the least, but the quality of the findings will obviously lack substance. The
    test system should be able to run all the software deployed on the production
    system, not necessarily at the same speed, though. It should be possible to re-create
    scenarios that exist on the production systems or test scenarios intended to be
    deployed on the production system. If you want to deploy a customization of the
    application software bought at SAP, for example, you should test it for errors
    and stability on a system meant for testing only first. This is a prerequisite
    to deploy any customization on the system. In other words, the procedure is a
    requirement before deployment of the system in your company and still holds true
    if you need to apply further customizations while you are using the system for
    production. It is that simple: you have to have a test system. If you deploy first
    on the production system and test later, good luck calling support.


    This approach to testing is valid in all aspects regarding your systems, regardless
    of the software or operating system used. But here comes the upside common to
    all systems intended for testing only: they should be able to mimic the real system
    in a deterministic manner. Nothing else is required. The findings and results
    of the tests should mirror similar tests executed on the real system.


    The test system should not be used to run production services. Testing them, even
    public testing inside the company, is okay, but as soon as the service becomes
    mission critical, it has to be moved to a real server. Make sure there are no
    problems whatsoever. If the test system goes down in the most horrible way you
    can imagine, that is what it is there for. Its sole purpose is to find errors
    and problems without disrupting the flow of work inside the company. You should
    create a good'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'documentation about the findings and should try to solve the issues that surface
    during the tests. This approach enables all employees concerned with the project
    to deal with errors before the system goes into production. The test system should
    be reinstalled before every new test. Many problems during the deployment of something
    new stem from the fact that the system used for testing is not an exact duplicate
    of the production system, because of a newer release of some component or just
    a feature not to be found on the production systems.


    ![](img/e121d664a879353483b8ef78e54b87ea_178_0.png)


    > The system administrator’s workstation is not a test system. Regardless of how
    impressive the box on your, or your neighbor’s, desk may be, resist the temptation
    to use it for testing. Chances are that there is software on this machine that
    isn’t found on your production systems. Situations like the following happen all
    the time: an application produced an impressive crash, every time a certain command
    was issued. Doing the same on the test system produced no error; everything worked
    as expected. The development department worked overtime for a couple of days.
    No problems were found; everything worked as expected. After reinstalling the
    test system, development was able to reproduce the crash, too. There was a simple
    explanation: one of the developers installed the development suite on the test
    system to speed up the compilation of the software. The development environment
    contained a couple of libraries not found on the usual customer system. It was
    a simple, though common, case of oversight; the application had access to libraries
    built for a special purpose, ones not needed on any customer’s machine. Fixing
    the error took about two hours. If the test system would have been reinstalled
    in the first place, nothing would have happened. Quality Assurance (QA) would
    have spotted the error right away; the discovery would have caused a delay of
    two hours, instead of days. If you’re thinking, “But my system is clean, really!”,
    think again. Do a quick rundown of the software installed on your machine. All
    of it will be on the production desktops or servers as well, right?


    Most *NIX systems are used for a long time due to the inherent longevity of those
    systems. A certain hardware configuration might no longer be available, but the
    configuration might still in production use in the company, posing no problems
    whatsoever. The same goes for variants of the operating system used; they might
    not run on the newer versions of the hardware. “Never touch a running system”
    is a saying that originated from the mainframes of old (some of the readers might
    remember), but still holds true for well-groomed *NIX systems, as well. If you
    are planning to purchase a new system for production use, try to include one of
    its smaller brethren in the calculation. The differences between Solaris 8 and
    Solaris 9, for example, prohibit testing things for one platform on the other.
    The same sometimes goes even for minor releases of an operating system. There
    is a reason to change the version number from 2.5 to 2.5.1; the newer version
    differs from the old'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'one in stability and functionality. Newer does not necessarily translate to
    more stable, though. Your test system is the platform to find out.


    The hardware configuration of the test system heavily depends on the types of
    tests to be performed on it. If you need to be as flexible as possible, the differences
    should not be too big. If the production system uses eight network interfaces,
    the test system should have at least two. The network subsystem would behave differently
    if there were only one network interface card (NIC). The same holds true for the
    number of CPUs. There is no need for 256 CPUs like in the production system, but
    you should have more than one in the test system. *NIX acts differently when using
    more than one CPU; trying to recreate an error that might be related to the use
    of more than one CPU on a single CPU system is a futile exercise. If the test
    system lacks the capability or capacity to run a certain test, you should try
    to contact the manufacturer of the systems. Chances are there is a lab you could
    use to run this single test.


    Another advantage of the test system is the fact that you are able to run preliminary
    tests on it before setting up the new production system. Installing a 1024 CPU
    monster including an array of 100 hard disks simply takes longer than installing
    the little brother version of the system with four CPUs and four hard disks. Maybe
    you can even convince your supplier to give you the little brother as a loaner
    for some time, thus enabling you to see the advantages of using the new type of
    hardware before buying it.


    # 6.1.2 A “Secure” System


    The “secure” system, something every system administrator should have tucked away
    in a less frequented corner of the data center, should not be confused with the
    test system discussed in the previous section. The secure system is not supposed
    to be connected to the network on a permanent basis, nor should it run any services,
    at all. If you should follow these suggestions, the latter just won’t happen anyway.


    The secure system is primarily used for the following tasks:


    +   - Download of patches or upgrades

    +   - Part-time inspection of network traffic

    +   - Penetration tests against the test system

    +   - As experience with a system that differs from your daily chores


    To illustrate the idea behind the secure system, Table 6.1 shows some possible
    configurations.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# TABLE 6.1 Secure System Possible Configurations


    | Hardware | Operating System |

    |---|---|

    | DEC/Compaq or HP Alpha | Linux, BSD |

    | Apple Macintosh | Linux, BSD |

    | SPARC-Box | Linux, BSD |

    | Motorola 680x0 or 881x0 VME | BSD |


    It is probably obvious from this table what we’re talking about. The secure system
    uses an older piece of hardware, one either lingering in some dark corner of the
    data center or that is cheap to get, and involves putting some “alien” operating
    system (“alien” in the sense of not commonly installed on that platform) on it.
    OpenBSD (http://www.openbsd.org), FreeBSD (http://www.freebsd.org), NetBSD (http://www.netbsd.org),
    and many Linux distributions support older hardware. Creating your secure system
    is about creating a combination of CPU and operating system not to be found at
    the electronics store next door or down the street. This is not to say that these
    combinations are weird, but the chances are slim that the latest exploit making
    its rounds in the Internet and used by script-kiddies of all ages will be able
    to deal with one of theses combinations straight from the shelf (figuratively
    speaking).


    You just have to make sure that the operation system of choice is actively maintained
    at the moment and will be for the foreseeable future. One of the author’s favorites,
    a combination of Amiga hardware and OpenBSD, won’t be maintained at the moment,
    but that might change again, though. As long as the operating system stays current,
    it should be usable for the mentioned tasks. If you are not sure if you want to
    deal with a compiler, using one of the BSD variants seems to be the way to go.
    It might be necessary to compile a version of a program there as well, but the
    requirements to get the system to do just that are very manageable. It is not
    about compiling the latest software in early beta status, but rather about having
    access to tools like snort, ethereal, or tcpdump. If a standards-compliant Web
    browser is added as well, the system is ready to be used. If this system does
    not use hardware that is too exotic, upgrading the memory or the hard disks should
    be financially feasible as well.


    You should be able to perform short or even longer network scans with the software
    that came with the OS. Scanning the network if you suspect an intrusion should
    always be done using some kind of hardware and software combination not common
    in the actual network. You should never feel too secure, though. If the idea of
    penetration tests against the test system sounds strange to you, please keep in
    mind that not all security related patches can be applied to every'
