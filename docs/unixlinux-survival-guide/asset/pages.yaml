- pgno: 260
  md: '# 7.4.7 Firewalls


    In its most common understanding, a firewall is a piece of software running on
    a dedicated hardware, protecting your network against threats from the outside
    world by controlling and restricting access to it. This sentence opens up a number
    of questions. For example, what if the firewall guarding the network fails and
    sed quis custodiet ipsos custodes (who guards the guards)?


    Just one firewall for the network, leaving everything else unprotected, can’t
    be enough. Beyond creating layers of firewalls if needed, deploying protection
    on single machines seems to be the answer. It won’t be the “cure-all” secret ingredient,
    but hardens your systems against threats from both the inside and the outside.
    Breaking through the firewall is not the only way into the network; most companies
    supply their employees, or at least some of them, with laptops. Backing them up,
    let alone securing them, can be rather complicated. A virus written for that operating
    system cannot harm a *NIX system, but a Trojan or the latest incarnation of spyware
    poses a security risk to all unencrypted traffic inside the network.


    Testing every laptop before it enters the secured network can be done, but this
    is time consuming and error prone. Making sure all patches are deployed requires
    constant attention. The growing number of *NIX-based laptops eases the problem
    a little, but they need patching, too. The problem becomes even worse if one of
    your servers, trusted by every other system in the network, is compromised. The
    last line of defense should always be a firewall protecting the system itself,
    configured to allow only traffic supposed to reach the machine in a controlled
    fashion.


    # 7.4.7.1 Using a Firewall on Every System


    There is a reason to use a firewall on every system in the network. For example,
    scanning a freshly installed GNU/Linux system with nmap shows a result similar
    to the one shown in Listing 7.38.


    # LISTING 7.38 nmap Scan of a Newly Installed System


    ```

    root@unixhost:~> nmap 192.168.0.2


    Starting nmap V. 3.00 ( www.insecure.org/nmap/ )

    Interesting ports on linuxhost (192.168.0.2):

    (The 1596 ports scanned but not shown below are in state: closed)

    Port     State    Service

    22/tcp   open     ssh

    111/tcp  open     sunrpc

    ```'
