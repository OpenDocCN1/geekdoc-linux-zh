- pgno: 159
  md: "You need to make sure to monitor the growth of the log files, especially after\
    \ changing the configuration. The /var directory has to have enough room to store\
    \ the data and should have some space left. The files should be copied to another\
    \ location on the system or to a different system, depending on importance of\
    \ the files. Another option would be to store the files on tape or to write them\
    \ to a CD/DVD. You should always use the provided mechanisms to rotate the logs;\
    \ this means either a variant of logrotate (available for almost all *NIX systems)\
    \ or a supplied software like logadm on Solaris. Because logrotate is available\
    \ on Solaris, HP-UX, GNU-Linux, and AIX (see Appendix B), the author offers an\
    \ example regarding its configuration (see Listing 5.12). The log file to rotate\
    \ is /var/log/localmessages. The configurations are usually stored in /etc/logrotate.d,\
    \ the default setting of logrotate.\n\n# LISTING 5.12 Configuration for logrotate\
    \ to Rotate /var/log/localmessages\n\n```\n# rotates the logfiles created by local\
    \ facility\n/var/log/localmessages {\n    compress\n    daily\n    dateext\n \
    \   rotate 31\n    create 640 root root\n    postrotate\n        kill -HUP `cat\
    \ /etc/syslog.pid`\n    endscript\n}\n```\n\nThe configuration reads as follows:\
    \ compress—the old log file will be compressed; daily—the configuration is to\
    \ be executed on a daily basis; dateext—the names of the rotated log files will\
    \ be appended with the date; rotate 31—if a file is rotated 31 times, it will\
    \ be deleted; create 640 root root—a new file with the indicated owner and permissions\
    \ will be created; and the command(s) between postrotate and endscript will be\
    \ executed after the rotation. You have to make sure to find out how the respective\
    \ syslog daemon can be convinced to re-read the configuration. The command shown\
    \ should work on all systems that store the file syslog.pid in /etc. Some variants\
    \ of the program can be restarted with the command /etc/init.d/syslog reload or\
    \ something similar (the manpage usually contains the details)."
