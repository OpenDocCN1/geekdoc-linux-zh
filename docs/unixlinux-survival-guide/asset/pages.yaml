    command. Because the output could be potentially very long and could contain a
    lot data you are not interested in, you can filter the output to include just
    lines starting (-) with /. The chkrootkit program uses the same approach.


    Some recommend running chkrootkit periodically via the crontab. This could be
    a valid approach, as long as you are aware of the fact that a possible intruder
    could modify the chkrootkit program in such a way that it never reports anything
    or signals everything is fine, respectively. The same holds true for the needed
    system programs.'
