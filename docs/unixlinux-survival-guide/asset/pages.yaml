  md: '# 3.2.6 What Is the group File for?


    Listing 3.29 shows the structure of a group record in /etc/group.


    # LISTING 3.29 Structure of a Group Record


    ```

    staff::0:erikk,silvied,ralphm

    ```


    The first field contains the name of the group, the second field could store a
    ciphered password (normally unused), the third field contains the number of the
    group, and the fourth field the members of the group, separated by a comma.


    HP-UX uses another file to manage groups, /etc/login.group; AIX uses the additional
    file /etc/security/group. Administrators on those systems should not edit the
    group file with an editor, but use the programs smit (AIX) or SAM (HP-UX), respectively.


    # 3.2.7 How to Create a User


    Most of the time, the system administrator has the choice of how a user is created.
    Usually you have a GUI (Graphical User Interface) to maintain the user database
    or a program or script you can use via the command line. The drawback of the former
    is usually the fact that the GUI works only with one user record at a time, whereas
    the command-line program normally supports the use of a list of names to create
    the accounts accordingly. Another option would be the editing of passwd with an
    editor like vi, but this approach is a risky business. Some *NIX variants allow
    this type of editing with special binaries of vi, usually called vipw. Again,
    this is a very risky approach and not for the faint at heart. Use the provided
    scripts for that purpose—usually called useradd or mkuser in AIX—or the respective
    GUI application.


    # 3.2.8 How to Move a User


    Assume you have extended the capacity of the system’s hard disks and want to move
    certain users to the newly created filesystems. To perform this move successfully,
    you have to meet the following conditions. All permissions must be preserved,
    ownership, group, and access control lists (ACLs) if used. Some *NIX variants
    change the ownership and permissions based on the user account actually performing
    the move; this means the files and directories will end up with the UID and GID
    of the user-context launching the program that performs the movement. root is
    usually exempted from this restriction; it is applied only to a user-context with
    UID other than 0. If you have to administer more than one type of *NIX, you should
    always use the necessary options for the commands to ensure that the move does
    not change the ownership and the permissions on the moved files or directories.'
