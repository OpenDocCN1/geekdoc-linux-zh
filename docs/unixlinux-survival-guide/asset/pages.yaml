    The output in Listing 7.39 should give you some peace of mind while the system
    is unattended, and the amount of work to achieve this state was a couple of mouse
    clicks.


    Most *NIX flavors come with a firewall these days; why not use it? The ones in
    SuSE Linux and Apple''s OS X can be configured with a, more or less, friendly
    GUI. The supplied firewall of Solaris can be configured by GUI or command line.
    The command-line approach has some drawbacks, but allows a more precise approach
    to securing the system. For example, you have no way to limit ssh connections
    to certain network ranges using the SuSE GUI.


    The difference between an installed system and a system ready for production was
    discussed in Section 5.2, "How to Ready a System for Production." The differences
    between such systems are much bigger than most people realize. See Listing 7.40
