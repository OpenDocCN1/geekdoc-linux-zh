    # 3.1.6 Monitoring the CPU


    The load on the CPU or CPUs on an SMP system is a clear indicator of how taxed
    the machine is at the moment—or is it? The answer to that question is not as clear
    cut as you might like it to be, but recording this value at least gives you some
    idea about the load situation on the system.


