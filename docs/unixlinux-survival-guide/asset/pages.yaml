  md: 'would be a copy of the directories on a system not permanently connected to
    the network. If this system uses another processor architecture and a different
    kind of *NIX, then the commands would be even more secure. This system or the
    CD can be used to supply the commands to analysis scripts like chkrootkit or aide.


    # 5.1.5 ntp Setup


    The importance of a consistent time and date inside a network was already mentioned.
    The ntp protocol was created to gather this information and distribute it inside
    the network. If you want to keep things simple, then you just have to configure
    two machines inside the network either to get the time from a reliable time source
    inside your network or to connect to a reliable time source outside of your local
    area network (LAN). An internal time source could be a device that is either a
    reliable clock by itself, for example, an atomic clock, or a device receiving
    a time signal via the airwaves. The first solution could be expensive, though.
    Both solutions require some kind of device driver to access the current time and
    date. If you don’t want to deal with attaching hardware to one of your servers,
    the other solution would be getting the time from a time server. A list of time
    servers is available at http://www.ntp.org.


    # Common Rules Regarding the Use of Time Servers


    There are two types of time servers (actually, there are more, but for the sake
    of clarity the author assumes that there are two), primary time servers are called
    stratum 1, and secondary time servers called stratum 2. Some rules of thumb for
    using a stratum 1 server are as follows:


    +   1. Your internal server serves at least 100 other computers inside your network.

    +   2. Your internal server supplies the information to two to three other internal
    time servers as a failsafe measure (including routers equipped to function as
    time server).

    +   3. You provide ntp access as a service for other networks in your geographical
    region to minimize network traffic.


    These rules count on the fact that all users of the Internet try to save bandwidth;
    it is impossible, though, to enforce these rules. The fact that a significant
    number of stratum 1 servers that used to be available to the public have switched
    from unmonitored access to monitored access—this means to get data from the time
    host, you are supposed to register with the administrators'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'of that system—should give you a clear indication that misusing the services
    provided by others isn''t a good idea, after all. Those servers went to their
    knees due to the onslaught of requests. Granted, all administrators need precise
    timing for their networks, but do you really need the accuracy of a stratum 1
    server? The lag occurring from a stratum 1 to a stratum 2 server is almost nonexistent;
    you should have a very good reason to access a stratum 1 time-host. Exceptions
    from these rules are medical services, nuclear plants, or security services. You
    are the judge; decide if half a second, sometimes one second—this actually almost
    never happens, though—is really that crucial for the purpose of your network.


    Depending on the size of your network, you should try to fetch the time from two
    or even better three machines. The protocol uses the differences between the samples
    to calculate the actual time and thus compensates for the lag. If the gathered
    information originating from a time server deviates too much from the other samples,
    that information will be disregarded and checked again during the next cycle.
    Using three time hosts to get the data into your network provides added security.
    If two values differ, who is to decide? If there are three values, the majority
    vote wins. To set the internal clock of a system, you use the command ntpdate,
    as shown in Listing 5.2.


    # LISTING 5.2 Getting the Time


    ```

    root@unixhost:~ ntpdate server1 server2 server3

    ```


    This command tries to get the time from three servers and adjusts the internal
    clock accordingly. If you need to adjust the system time on a recurring basis,
    then the configuration file ntp.conf has to be changed (see Listing 5.3).


    # LISTING 5.3 ntp.conf


    ```

    ## servers

    ## check every 12^12 seconds

    ## max check 17^17 seconds

    server server1 minpoll 12 maxpoll 17

    server server2 minpoll 12 maxpoll 17

    server server3 minpoll 12 maxpoll 17

    ```


    These settings in ntp.conf activate the sampling of time every 12^12 seconds.
    If you want to share the gathered information with other systems in your network,'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'then the internal clock of the system needs to be in the configuration as well
    (see Listing 5.4).


    # LISTING 5.4 ntp.conf Internal Server


    ```

    ## servers

    ## check every 12*12 seconds

    ## max check 17*17 seconds

    server server1 minpoll 12 maxpoll 17

    server server2 minpoll 12 maxpoll 17

    server server3 minpoll 12 maxpoll 17


    # configure local clock to act as server

    server 127.127.1.0

    fudge 127.127.1.0 stratum 10

    ```


    The entry server 127.127.1.0 points at the internal clock of the system. 127.127.1.0
    represents the clock of the machine. A 13 instead of 1 would describe a Leitch
    CSD 5300 Master Clock Controller, depending on the type of *NIX, of course. The
    supplied reference implementations of ntp vary between the different *NIX flavors.
    Denoting your internal clock with a bad stratum level like 10 enables your other
    systems to use it in times of need, for example, if the external or internal time
    sources are not available. At least the time used inside the network stays consistent
    that way. The command to degrade the internal clock to stratum level 10 is fudge
    127.127.1.0 stratum 10.


    Now you are able to choose between three ways of providing the time service to
    your internal systems, or to mix and match as needed. One: you modify the ntp.conf
    on the systems to query your internal machine (see Listing 5.5). Two: configure
    the crontab on the machines to use ntpdate on a recurring basis (see Listing 5.6).
    Three: configure your time server to broadcast the fact that it is indeed a time-host.


    # LISTING 5.5 ntp.conf Internal System


    ```

    server ip.address.of.your.time-host

    ```


    # LISTING 5.6 crontab entry


    ```

    13 * * * ntpdate ip.address.of.your.time-host

    ```


    Using broadcasts seems to be the easiest solution, but there is a downside to
    that approach. The method is not that secure. If, for some reason—for example,
    a'
