    # 3.3.4 Checking the Baselines


    If the system in question is equipped with some of the scripts presented in the
    beginning of this chapter, then you should have a look on the graphs as well.
    If the log files are rotated before midnight, then the existing data should provide
    a good picture of how the system has behaved since then. If there are no specific
    spikes in the counters, all should be well. Here a couple of hints what to look
    for, though.


    If the machine should run an extensive backup after midnight or the database reorganization
    is started in this timeframe, heightened activity on the wait I/O counters is
    quite normal. If you should encounter a constant noise on these counters, then
    something needs to be done. You should try to find out why the system is complaining
    about nonresponsive hardware; the disks especially need to be checked.


    Another counter you should watch is the runq-sz (runqueue size). Continuous spikes
    in this graph indicate that processes are waiting to be executed. A certain number
    of waiting processes are normal. However, if there are bigger spikes, then you
    need to evaluate the reason for that reading. As long as you have enough resources
    available, you should check if the load on the system has increased by using the
    older graphs or datasets. If the increase is a trend over the last couple of days,
    then either new software was started, taxing the system considerably, or other'
