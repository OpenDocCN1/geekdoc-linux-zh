    The use of snort has a distinct advantage: if there is a warning about a new threat
    at the Internet Storm Center (http://isc.sans.org), then the warning sometimes
    contains a rule to be used with snort right away. If the rule is a quick fix to
    hold a new threat at bay, this means it was not tested in the usual way. The rule
    is usually accompanied by a warning about this fact, and the tested rule can be
    expected within the next couple of hours at http://www.snort.org.


    If you want to avoid the time-consuming search through the alert file, then using
    a program to do it for you would be helpful. There are plenty of programs you
