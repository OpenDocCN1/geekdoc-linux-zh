- pgno: 187
  md: 'SGML (Standard Generalized Markup Language), not a file format in the strict
    sense of the term, but more a kind of meta-language used to describe and structure
    the contents of a file. One SGML dialect everyone is already familiar with is
    HTML. HTML is actually a standardized description of a document, displayable by
    a Web browser or any other program that knows what to make of the description,
    used to display the contained data in human-readable form. HTML uses a set of
    defined entities, interpreted by the Web browser. The entity <body> signals the
    Web browser to consider everything that follows as contents of a page until the
    entity is closed by </body>. The information contained inside <body> can be further
    structured by using entities like <h1> or whatever else is defined. The prerequisite
    is that the program needs to know about the defined entities. You can deduce two
    facts by the information presented so far:


    +   1. Using an abstract way to structure information enables you to display that
    information in more than one way. For example, there are Web browsers for the
    seeing impaired that are able to read the information aloud, without the need
    to bother filtering out formatting information, like the used fonts for example.
    Data structured this way is displayable on a number of devices, enabling the devices
    to display the information within the restrictions the device imposes due to its
    capabilities.

    +   2. The strict division of data, structure, and format enables the processing
    of the information with a variety of programs. One example would be the creation
    of a (albeit simple) table of contents for a Web site, using the command egrep
    ''<h1>'' *.html. The fact that there is an agreement to enclose headlines on level
    one of the structure within the meta-tag <h1> allows this command to work.


    We all are in the middle of a transitional phase, right now. HTML will be replaced
    by XHTML eventually; the latter is simply the XML structure used to describe a
    Web site, displayable by programs conforming to the standard. (Don''t worry; it
    is really hard to differentiate between HTML and XHTML at the moment. Deploying
    your HTML skills still gets you a long way regarding XHTML.) Using this kind of
    abstraction allows you to structure information, but XML does not stop there.
    If you feel the need to create new entities to tag information relevant to a task
    at hand, you are free to do so. Whether or not undertaking this effort is worth
    the time spent needs to be evaluated on a case-by-case basis, though. The procedure
    isn''t overly complicated, but the new entity needs to be rooted in a solid context
    to be useful.


    Creating your own XML structure to be used for the documentation to be created
    requires the existence of a DTD (Document Type Definition), a set of rules describing
    which entities are required and which nesting scenarios are permitted.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Well, that is not entirely true; actually using a DTD is an option, but trying
    to structure information without a DTD makes it impossible to validate the XML
    files later. Thus, you have no way for you to find out if the document adheres
    to some kind of structure or not. Furthermore, you need to define transformation
    rules to present the data if you want to avoid straining your eyes while trying
    to make sense of all the words inside the <> signs. Doing so has its value, though.
    You exercise complete control over the structure and presentation of your data.
    The downside is the time needed for development and testing. On the other hand,
    why not try the *NIX approach and find out if someone else already solved the
    problem?


    A very common approach to standardize documentation within the IT sector is DocBook:
    a DTD and corresponding style sheets to present the information using HTML or
    PDF as format of choice. The DocBook DTD actually allows the creation of almost
    any type of publication, but its main use is in documentation. The Linux Documentation
    Project (http://www.tldp.org/), for example, uses DocBook to distribute its publications
    in .ps, .pdf, and .html. The same holds true for the documentation accompanying
    the Linux kernel, the GNOME project, the KDE project, Samba, and so forth. Some
    publishers have already switched to DocBook to create their books. How does this
    affect you as a *NIX system administrator? Quite simply, because a bigger part
    of the *NIX community has decided to use DocBook to cater to their documentation
    needs, a variety of programs and tools to help you to create and maintain your
    documentation have come into existence. Most of it is open source software, released
    under the GPL license. The other advantage of acquiring DocBook-related skills
    is obvious—because it is considered a quasi-standard, your knowledge can be put
    to good use in the foreseeable future.


    # 6.2.1.1 Installation


    DocBook is not an application to be installed, at least not a single application.
    It consists of a DTD, a couple of XSLT (Extensible Stylesheet Language Transformations)
    documents, and two libraries probably already installed on your system. The libraries
    are named libxm12 and libxslt. If these libraries should not be part of the *NIX
    distribution in use, you can simply download the version for the operating system
    from one of the Web sites in Appendix B. If you are using GNU/Linux as operating
    system, everything needed should be on the distribution CDs. You could simply
    install the necessary packages. If your brand of *NIX did not come with the necessary
    files, proceed as follows. The DocBook DTD is to be found on the DocBook.org Web
    site (http://www.docbook.org/sml/index.html). Download it and extract it to a
    directory. If you want to make DocBook available to all of the users on your system,
    create a directory like /usr/share/xml or /opt/share/xml, if neither of them already
    exists. Change into the directory, create another directory named docbookxml_<version>,
    replacing <version> with the current release, and extract the archive into it.
    The XSLT style sheets to transform the XML files into HTML and'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'PDF can be found on the SourceForge® Web site at http://sourceforge.net/project/showfiles.php?group_id=21935.
    Download the archive docbook-xsl and extract it within the xml1 directory. To
    create PDF files, the Formatting Objects Processor by apache.org and a Java Runtime
    Environment (JRE) 1.3 or better is needed as well. The FOP is to be found at http://xml.apache.org/fop/;
    download it and extract it in the xml1 directory. The script fop.sh needs the
    environment variable $JAVA_HOME to be set; it usually points to /usr/java on Solaris
    and /usr/lib/java/jre on GNU-Linux.


    Table 6.2 shows the packages needed to process DocBook files.


    # TABLE 6.2 Packages Needed to Process DocBook Files


    | Package | Description | Source |

    |---|---|---|

    | DocBook | DTDs, containing the defined structure | http://docbook.org/oasis/index.html
    |

    | DocBook XSL | Transformation style sheets (.xsl) | http://sourceforge.net/project/showfiles.php?group_id=21935
    |

    | libxml2 | Necessary libraries and the program xml lint, among others, to validate
    the documents | The library is either part of your *NIX distribution or can be
    downloaded from one of the Web sites in Appendix B. |

    | Libxslt | Necessary libraries and the program xsltproc, among others, to actually
    transform the files | The library, too, is either part of your *NIX distribution
    or can be downloaded from one of the Web sites in Appendix B. |

    | Fop | The Formatting Objects Processor, a Java class to transform .fo files
    to PDF | http://xml.apache.org/fop/ |


    # 6.2.1.1.2 Testing the Installation


    To make sure everything works as expected, running a quick test is advisable.
    DocBook knows two kinds of publications, Book and Article. Book is a book with
    a table of contents, chapters, index, and appendices. The chapters can contain
    sections, which can be nested, if needed. Article is more or less a single chapter
    with a table of contents and an index, if needed. This description is restricted
    to the bare necessities you need to be aware of; there is much more.


    You should create a directory to hold the files necessary to run the tests, a
    file named testarticle.xml, and a file named testbook.xml. The contents of the
    files are shown in Listing 6.4 and Listing 6.5.'
