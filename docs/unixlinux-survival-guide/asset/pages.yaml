    # A.4 THE VI EDITOR


    The vi editor is a powerful program, but it is rarely used to its full potential
    because of the lack of a user interface.


    # A.4.1 Cursor Movement


    If you need to move the cursor inside a file you opened previously with vi, then
    you could use the cursor keys. The downside here is as follows: the size of the
    largest document to be edited with vi is limited only by the available space in
    the /tmp directory. This means going from line 1 to line 4078 will take a considerable
    time if the movement is done by using the cursor keys.


    You could use the G command in vi’s command mode to speed things up a little.
    If you use 4078G in command mode, vi will jump to line 4078 from every'
