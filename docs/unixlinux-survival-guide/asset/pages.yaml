    It is rather complicated to create a common script for all platforms to extract
    this vital data, because of the inconsistent output on the various platforms.
    If one should have to administer more than one platform, the usual case nowadays,
    two approaches present themselves.


    +   You could create a script containing only the base functionality and add the
    code for the respective operating system on a case-by-case basis. The advantage
    would be code that is easier to read and understand; the downside of this approach
    is the fact that there are different versions of the script—to be maintained separately.


    +   The script tries to guess the operating system it is deployed on and calls
    the specific code. The advantage in this case would be having only one script
    to maintain; the downside is scripts that try to do too many things at a time
    tend to become unreadable and thus harder to maintain over time.


    However, there is also a “secret” option three—creating an object-oriented script
    that uses an abstraction to process the gathered data. That option is not only
    beyond the scope of this book, but also the design of such a script should always
    be tested via simple, streamlined scripts that do one thing right. You should
    always keep in mind that the KISS principle is the only way to go regarding system
    administration. Also, if you try to achieve results that could make the monitoring
    systems of the common software distributors obsolete, then the system you are
    responsible for is not the platform for the necessary experiments to achieve that
    goal.


