    You need to store the database, the executable, and the configuration file in
    a secure location. Doing so ensures that no one is able to change the information
    stored in the database and the configuration file and that no one is able to modify
    the program itself. One possible option is to store the files on a CD-R. If you
    store the files on a CD-R, then you should change the database path to point to
    the CD-ROM drive prior to writing the files to the media. It is a good idea to
    delete all traces of the program from the system after the files are copied to
    the secure location. If a break-in should occur, then the intruder would not know
    that there are monitored files on the system.


    You should experiment with the program to get a feeling of what is possible and
    how to achieve the desired goals before it is used in a production environment.
    Your final configuration should cover all files and directories that should not
    change at all. Keep in mind, though, every directory not monitored this way is
    in danger to be used as storage location for unwanted files. If the directory
    /var/spool/mail is not monitored, for example, then it could be used by a possible
    intruder to store programs that are able to compromise the system. This is not
    meant to scare you, but it is the job of every system administrator to protect
    the systems against possible threats, within reason.


    # 7.3 SYSTEM SECURITY


    The next unit that needs protection is the physical system itself. This includes
    the hardware and the software. It is quite amusing to read about security issues
    regarding *NIX that imply that a possible intruder has physical access to the
    system to be compromised. If strangers (this includes every person with no really
    good reason to even be in the vicinity of the computers) are allowed to access
    the'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'computers physically, then not even the most sophisticated monitoring software
    will be of any use at all. Physical access to every system that is connected to
    the network has to be governed by ironclad rules. The common use of laptops poses
    a problem that cannot be easily solved in that respect.


    # 7.3.1 Where to Store the Install Media


    If you allow physical access to the installation media and the system, then every
    system is hackable in a matter of minutes if the intruder knows what needs to
    be done to compromise the system. Because you need fast access to the installation
    media in case of a problem, you need to find a logical compromise regarding the
    location where the media should be stored. One option would be a sturdy closet,
    not located next to the systems, but some rooms away. The closet needs to be locked
    and not used for other purposes like storing files, if possible. The same holds
    true for the location the backups. If the storage location of the backups should
    be secure (and it definitely should be), then it could be used for the purpose;
    this is not an optimal solution, but a beginning. Every system administrator should
    possess a key to the location where the installation media is locked away and
    carry that key with him all the time. It does not help to fix a problem in the
    data center (ground-floor or basement) if the system administrator needs to get
    to his office (14th floor) to get the securely locked away keys to the closet
    to gain access to the installation media, while trying.


    To sum things up: the installation media should never be stored next to the system
    or, even worse, be stored in an envelope glued to the system. If an intruder should
    get physical access to the system, it will be compromised in a very short amount
    of time.


    # 7.3.2 How to Monitor Logins


    A mistyped password by a user during login is a quite normal event. If there are
    20 mistyped passwords for root originating from a terminal somewhere in the building,
    on the other hand, then you need to investigate what is going on. The same holds
    true for a failed login for a user if this happens more than three times. That
    user might have pressed Caps Lock without being aware of it, but this user will
    definitely call you and complain about a non-working login. If this call should
    not come in, then you need the documentation to find out where the workstation
    is located and have a closer look.


    If you want to monitor such events, though, then you are confronted with the fact
    that you need to stare at the log files or a console on a constant basis. The
    other way you could make sure you do not miss events like the ones described is
    the use of the syslog facility auth.notice, configured to write all login-related
    events to a file. Listing 7.11 shows the necessary entry in syslog.conf.'
  merge: -1
  img_proc: true
- pgno: 227
  md: "# LISTING 7.11 Entry in syslog.conf to Monitor Logins\n\n```\n...\nauth.info\t\
    \t\t/var/log/authlog\n...\n```\n\nThe file /var/log/authlog (and you are free\
    \ to choose any suitable name) will, depending on the number of logins per day,\
    \ grow very fast. You need to make sure to rotate the file periodically and store\
    \ the copies in a secure location if they are needed in a later investigation.\
    \ After adding this entry into the configuration file, you need to tell syslog\
    \ to re-read its configuration by sending the process the hang-up signal. You\
    \ need to create the file if it does not exist and try to test the functionality\
    \ by using a non-working login, as shown in Listing 7.12.\n\n# LISTING 7.12 Restarting\
    \ syslog and a Non-Working Login\n\n```\nroot@unixhost> ps -ef | grep [Ss]syslogd\n\
    root      350   1  0 14:56:05 ?        0:00 /usr/sbin/syslogd\nroot@unixhost>\
    \ kill -HUP 350\nroot@unixhost> exit\nerikk@unixhost> su - knapf\nPassword:\n\
    su: Sorry\nerikk@unixhost> su -\nPassword:\nCommodore 64 38512 Bytes Ready!\n\
    # tail -2 /var/log/authlog\nSep  1 11:46:03 unixhost su: [ID 810491 auth.crit]\
    \ 'su knapf' failed\nfor erikk on /dev/pts/2\nSep  1 11:46:16 unixhost su: [ID\
    \ 366847 auth.notice] 'su root'\nsucceeded\nfor erikk on /dev/pts/2\n```\n\nListing\
    \ 7.12 demonstrates a failed login by user erikk while switching to the user knapf.\
    \ If you would search for the string failed in the log file, then you would be\
    \ presented with all failed logins that occurred since the last rotation of the\
    \ log file, provided that log file was not tampered with, another reason to monitor\
    \ such files. The greeting string on the system was chosen deliberately; it is\
    \ of no concern to anyone what operating system is used on a machine. The fact\
    \ that the system administrators know is sufficient."
