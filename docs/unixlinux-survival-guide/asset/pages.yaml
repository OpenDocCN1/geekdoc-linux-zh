    The XSLT file shown, getcommands.xslt, is used to display the text enclosed in
    the <title> tags. If the following <para> block contains text tagged with <command>,
    it will be displayed, too. The result is an overview of the contents contained
    in the article. The instruction strip-space elements removes all additional whitespace.
    This means space, Tab, and CR characters. To create some kind of formatting, xsl:text
    is used to insert new line breaks. Because all nodes would be displayed by default,
    the display of the other contents inside <para> is suppressed using the select
    command after apply-templates.


    This is just a quick and dirty example to give you an idea what is possible; the
    real boundary here is your imagination. The result shown could be achieved in
    a number of ways. This was just one of them. If your intent is to dive deeper
    into XML/XSLT, beyond creating HTML and PDF files, you should be aware that there
