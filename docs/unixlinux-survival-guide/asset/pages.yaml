    # 3.3 DAILY TASKS


    The next sections describe actions that require constant care on a daily basis.


    # 3.3.1 Check the Uptime


    One thing to check every day is the output of the command uptime. uptime reports
    the current time, the time the machine has spent up and running, the number of
    users currently logged in, and the load average. The time up and running is of
    interest here; machines supposed to run 24/7 usually show an uptime spanning weeks
    or even years (the uptime that impressed the author the most was 4 years and 6
    months). A quick look at uptime tells you if the machine was rebooted, and if
    the reboot was not planned, an investigation of what happened is in order (see
    Section 3.3.2, "What syslog Tells You"). Most servers start up automatically after,
    for example, a loss of power, and uptime is the easiest way to check if anything
    happened. Listing 3.33 shows an example of uptime.


    # LISTING 3.33 The Output of uptime


    ```

    root@unixhost:> uptime

    ```'
