- pgno: 37
  md: 'postfix, on the other hand, needs additional software to perform the same function,
    e.g., isoqlog to be found at http://www.endernunix.org/isoqlog/. Because installing
    this additional software requires that you to know how to compile it, a description
    is beyond the scope of this chapter.


    # 1.2.7 Installed Software


    Given the fact that there are no real rules where to install additional software
    on a *NIX system, just recommendations like the one provided by the "Filesystem
    Hierarchy Standard Group" at http://www.pathname.com/fhs/, most third-party software
    developers adhere to this standard or a scheme devised by themselves. The latter
    schemes are normally based on the FHS standard in one way or another. In the proposed
    standard, additional packages are to be installed in two locations:


    +   - /opt

    +   - /usr/local


    As final step to gather information about a system not installed by yourself,
    you should browse through these locations for a while to get a better understanding
    of whether additional software has been installed and, if so, where. A potential
    caveat of this kind of custom install is the fact that additional configuration
    files might be hidden in these directories. If the programs installed in there
    should use these configuration files instead of the ones in /etc, being aware
    of this fact will save a lot of guesswork later. Using this approach is not wrong,
    but most system administrators are used to the fact that configuration files should
    reside in /etc. If the installed programs are compiled to ignore this directory
    and use their own hard-coded locations instead, you should put this information
    in the documentation accompanying the system. This is especially important if
    the programs in question usually do not exhibit this behavior or act differently
    on other systems that are part of the same network. For example, suppose program
    foo is installed on a variety of operating systems and reads the configuration
    files from /etc/foo.conf. If this program is installed as part of a package of
    programs to fulfill a certain need for the creator of the package, it might be
    the case that the creator of the package decided to make sure that another instance
    of the program would not interfere with its use in the package. Thus, the configuration
    for the program will reside in /opt/package-name/etc/foo.conf instead of /etc/foo.conf,
    a common case, given the versatility of many *NIX programs. If there is a necessary
    change of the configuration due to security reasons, the configuration in /etc
    will usually be changed according to the given information. If the configuration
    in /opt/package-name/etc/foo.conf should be changed as well, the system administrator
    should be aware of the fact that it exists in the first place, so he can act accordingly.


    The directory hierarchy will be discussed further in Chapter 5.'
  merge: -1
  img_proc: true
