- pgno: 22
  md: '# NAME


    ```

    passwd - password file

    ```


    # SYNOPSIS


    ```

    /etc/passwd

    ```


    # DESCRIPTION


    ```

    The file /etc/passwd is a local source of information about users'' accounts.
    The password file can be used in conjunc- ...

    ```


    The manpages are the most up-to-date reference concerning every system. Every
    update supplied by the *NIX distributor will update the manpages as well. This
    information is an invaluable source to understand the inner workings of the system.


    # 1.1.4 What Time Is It?


    A *NIX system needs to know about date and time. If this information is not set
    up correctly, some internal workings will suffer. The machine uses the internal
    clock to keep track of date and time. Older systems, in terms of hardware age,
    tend to lose or gain a few seconds at times, partly due to the fact that the batteries
    used in these systems are exhausted, for example. If this happens, other means
    of keeping the date and time current have to be used. Another component of date
    and time is the $TZ variable. It stores the time zone the system is in and should
    be consistent among all systems in the same geographical location.


    If you transfer a file from a system in Chicago to a system in Philadelphia without
    a correct $TZ value, the timestamp on the system in Philadelphia would differ
    from the one in Chicago by 60 minutes. This does not seem to be a big problem,
    but if a program bases the question to overwrite the file on the timestamp, problems
    could arise. If those systems have a correct $TZ, the right decision will be made.
    If not, you could lose valuable data. In this example, the system in Chicago should
    have $TZ set to CST or US/Central, and the one in Philadelphia either US/Eastern
    or EST.


    # 1.1.4.1 How to Set the $TZ


    The $TZ is set during install and can be changed for the user-context later with
    the help of the command tzselect. tzselect is used to get the valid $TZ value.
    It asks the user questions about the geographical location and outputs a string
    like US/Eastern suitable to be used. If the $TZ is not set on a system, make sure
    you understand why before setting it. The same goes for "wrong" $TZ settings;
    there could be a reason for them to be "wrong."'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/e121d664a879353483b8ef78e54b87ea_23_0.png)


    Why should you check first for a wrong $TZ? A couple of years ago, someone stopped
    the author a second before he could make a change to a seemingly "wrong" $TZ setting.
    As it turned out, the person originally installing the *NIX servers rolled out
    about 200 desktop machines configured with a false $TZ setting. So, instead of
    rectifying this on the individual machines, the decision was made to make up for
    the error by setting two of the servers to a different $TZ to compensate for the
    "lost" hour.


    Making the change the author was intending to make at the time would have confused
    a couple of tracking processes in the CMS (Content Management System), and thus
    six weekly magazines would have had to be checked by hand for missing content—for
    a print run about 90 minutes away! The correction took place during a rollout
    of upgrades to the desktop systems at a later date. Important here: ask first,
    understand the ramifications, calculate the risk, and then change!


    # 1.1.4.2 How to Set the Time


    There are two ways to set the time on a *NIX system, or on most computers for
    that matter. Option one, the preferable one, uses a so-called time-host to allow
    the systems to get the time on a regular basis. This means one or two computers
    on the network connect to some reliable source inside or outside the network,
    get the date and time, and provide this information as a service to the other
    systems. The advantage here is that all systems agree on the current time and
    date, and you have only one or two systems to maintain for that purpose.


    The "old" way of setting the time using one time-host is the rdate protocol with
    a resolution of 1 second. The preferred way of setting the time uses the ntp package,
    available for almost all *NIX flavors. The latter has a drawback, though. To avoid
    tampering, security tokens have to be generated and exchanged between the time-host
    and the clients. On the upside, ntp is able to get the time from more than one
    host and calculates the latency, thus resulting in a more precise timing.


    To find out what is used to set the time, check first for a file called /etc/ntp.conf.
    If it exists, chances are good ntp is used. Otherwise, scan the root crontab for
    entries containing rdate or ntpdate—the latter is a replacement for rdate. If
    neither exists and the system time seems to be off, read the earlier Note about
    checking first for a wrong $TZ again and proceed.


    Though setting the time and date manually should be only an interim solution,
    the command date can be used to do so, as shown in Listing 1.11.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# LISTING 1.11 Setting the Time Manually


    ```

    root@unixhost:~> date -s "15:40:00 02/09/04"

    Mon Feb 9 15:40:00 CET 2004

    root@unixhost:~> date

    Mon Feb 9 15:40:19 CET 2004

    root@unixhost:~>

    ```


    If a GNU-Linux system is used, some more work is involved to convince the hardware
    to actually store the time and not use it just for the session. The command hwclock
    is used to write the time and date to the system-clock.


    If you need to change the current time, make sure you do not "jump" too far ahead
    or back. There are programs that might react to jumps that are too "big," especially
    server processes, version control, or file services, such as netatalk and smbd;
    the former serves older Apple clients and the latter Windows clients. Background
    processes used to keep the time current in a network usually deploy a so-called
    slew mode. This means the change of time will happen gradually to avoid confusing
    programs relying on timestamps.


    # 1.2 PREPARATIONS


    If you inherited a system, you should try to get some overview of what was installed,
    where it was installed, and the current state of the configuration. You can use
    a couple of proven approaches to accomplish this.


    # 1.2.1 $HOME of root


    Assuming you are logged in as root, the first commands to use are cd followed
    by pwd to find out if the superuser has its own $HOME directory.


    ```

    root@unixhost:~> cd

    root@unixhost:~> pwd

    /root

    root@unixhost:~>

    ```


    The example shown is from a Linux host. root has its own home on Linux, but on
    Solaris the home of root is usually the / directory.


    There are a couple of reasons for the setting on Solaris. One of them, probably
    the most important, is that root needs access to his home directory when logging
    in. If something is wrong with the system, not being able to access the directory
    $HOME points to can lead to problems, even a non-working login.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'On the other hand, there should be a place owned by root to store confidential
    files. If needed, you should create a root home directory.


    To create a home for root on a system where root has none, you must take some
    precautions. Listing 1.12 illustrates the necessary steps.


    # LISTING 1.12 Creating a root $HOME


    ```

    root@unixhost:~> cd /

    root@unixhost:~> mkdir .HO

    root@unixhost:~> ls -ld .HO

    drwxr-xr-x  2 root  root       48 Feb  9 17:05 .HO

    root@unixhost:~> chmod -R g-r-x,o-r-x .HO is used. It revokes the read and execute
    permissions from the group, in that case root and the others, all valid logins
    not belonging to the group.

    root@unixhost:~> ls -ld .HO

    drwx------  2 root  root       48 Feb  9 17:05 .HO


    root@unixhost:~>

    ```


    This sequence of commands works like this: the first command, cd /, changes to
    the root of the filesystem. The next command, mkdir .HO, creates a directory that
    will be hidden from "normal" users. ls -ld .HO shows the permissions and tells
    us that all users have read and execute rights on the newly created directory.
    To rectify this, the command chmod -R g-r-x,o-r-x .HO is used. It revokes the
    read and execute permissions from the group, in that case root and the others,
    all valid logins not belonging to the group. The directory is not really "hidden",
    but won''t show up if the ls command is not used with the option -a, which translates
    to show even the "hidden" files starting with ". ".


    > *The $HOME of root needs to be accessible. Root’s $HOME (the location pointed
    to in the file /etc/passwd) must be on a volume that will be mounted during all
    init states. If the system starts and cannot access root’s $HOME, the boot process
    will hang forever. The same goes for changing the init state; there could be problems
    doing so if root’s $HOME is inaccessible.*


    # 1.2.2 More roots?


    Some systems have more than one superuser. At first glance, this does not seem
    to make sense, but sometimes creating more than one user with UID 0 is necessary.
    Imagine a data center, working in 24-hour shifts, 7 days a week. There should
    be more than one system administrator, obviously, but how can you differentiate
    who worked as superuser at what date and time?'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Clearly the documentation should shed some light on the question, but to check
    whether there is more than one superuser, you can use the chain of commands shown
    in Listing 1.13.


    # LISTING 1.13 Finding Users with UID 0


    ```

    root@unixhost:~> awk -F '':'' ''{if ($3==0) print $0}'' /etc/passwd

    root:x:0:1:Super-User::/sbin/sh

    ```


    If the output looks like the one shown, there is only one root. Listing 1.14 demonstrates
    another scenario.


    # LISTING 1.14 Finding Users with UID 0 (More Than One Superuser)


    ```

    root:x:0:1:Super-User::/sbin/sh

    ek_root:x:0:1:ek root account::/sbin/sh

    mw_root:x:0:1:mw root account::/sbin/sh

    fh_root:x:0:1:fh root account::/sbin/sh

    ```


    On the machine shown in this example, you see three people able to become superuser.
    All accounts should have different passwords, and if one of those people changes
    the user-context to superuser, a log entry will be generated.


    Needless to say, no one is supposed to use the root account other than the ones
    who match the initials in the example. Of course, how the multiple accounts are
    organized on the system you are working on depends on how the person who initially
    set up the system chose to differentiate between the system administrators.


    A setup like the one described requires all system administrators to be aware
    of two things when changing to superuser:


    +   - Never use the root account.

    +   - Always log in with a normal user account and use su to switch to superuser.


    There is a command called sudo available on most GNU-Linux and BSD systems. If
    needed, one can install it on Solaris and most other *NIX variants, as well, but
    typing sudo repeatedly when executing commands can be annoying.


    If these requirements are honored, all system administrators are able to see who
    worked as superuser and when.


    ![](img/e121d664a879353483b8ef78e54b87ea_26_0.png)


    > Solaris introduced the concept of roles a while ago; this concept is something
    completely different than the use of multiple superusers.'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'A role contains permissions to do certain things on a system. These permissions
    are defined to fit certain job descriptions. This does not necessarily mean a
    user with certain granted rights is able to administer the system as a whole.
    It is possible to create a role containing all administrative rights, but this
    approach does not reflect the multiple UID 0 user concept.


    If a system runs 24/7, one superuser should always be able to access the system
    and take care of possible issues. Common sense tells us we cannot possibly define
    user rights in a way that covers all possibilities. Some issues to be resolved
    require drastic measures, and you couldn’t anticipate all of them.


    # 1.2.3 How Many Volumes?


    Unlike other operating systems, *NIX always uses a tree-like structure for the
    connected hard disks and the filesystems stored on them. The tree starts on the
    / directory; everything else can be reached from there. It is possible to mount
    another filesystem "into" a directory to get more space; the actual contents of
    this directory will be hidden after the mount is complete, though.


    To get an overview of how many volumes are currently mounted on a system, you
    can use the command shown in Listing 1.15.


    # LISTING 1.15 Displaying the Mounted Volumes


    ```

    root@unixhost:~# df -h

    Filesystem           Size  Used Avail Use% Mounted on

    /dev/dsk/c0t3d0s0    1.5G  1.1G  403M  73% /

    /dev/dsk/c0t3d0s1    482M  311M  123M  72% /var

    swap                 546M   40K  546M   1% /var/run

    swap                 546M  312K  546M   1% /tmp

    /dev/dsk/c0t3d0s7    1.5G  864M  550M  62% /export/home

    ```


    The command df, easy to remember as Disk Free, run with the option -h for human
    readable shows how many volumes are there and how much space is available on them.
    The preceding example is from a small Solaris system. If the -h option is not
    available on your system, use -k instead. The resulting numbers will be in kilobytes
    instead of the default 512-byte blocks, which is even harder to grasp.


    # 1.2.4 What Is Going On?


    There are three commands to get an overview about what the system is doing right
    now. The commands are ps, top, and sar. Some of the commands will be covered in
    greater detail in Chapter 3.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 1.2.4.1 ps


    The ps command comes in handy if you have a need to determine whether a certain
    process is running on the system or how many instances of that process are active.
    The downside of ps is that few commands have more options; depending on incarnation
    of the command, you have between 20 and 50 single options, which can be combined
    to restrict the output or make it more talkative. The BSD version is used with
    the option uawx most of the time. To call the program with this option on Solaris,
    you should use /usr/ucb/ps to start the BSD version instead of using just ps.
    (The BSD binaries are still present on most Solaris machines; they are just hidden
    in /usr/ucb.) For example, to find the 10 processes using most of the CPU cycles,
    you can use the following commands, as shown in Listing 1.16.


    # LISTING 1.16 Running ps


    ```

    root@unixhost:/> /usr/ucb/ps uawx | head

    ekeller   472  0.4  7.211176 8760  ?   S 10:06:14  0:05   /usr/openwin/bin/Xsun

    root      632  0.2  0.7 1008  800 pts/5  0 10:17:54  0:00  /usr/ucb/ps uawx

    ekeller   565  0.2  3.9 7160 4768  ??  S 10:06:48  0:00  /usr/dt/bin/dtterm-s

    root      3   0.1  0.0  0    0   ?   S 10:05:34  0:00  fsflush

    root      473  0.1  1.6 2320 1896  ?   S 10:06:15  0:00  mibisa -p 32788

    root      1   0.0  0.3 1232  368  ?   S 10:05:34  0:00  /etc/init -

    ekeller   564  0.0  3.6 6920 4392  ??  S 10:06:48  0:00  /usr/dt/bin/dtterm-s

    root      0   0.0  0.0  0    0   ?   T 10:05:31  0:00  sched

    root      2   0.0  0.0  0    0   ?   S 10:05:34  0:00  pageout

    ```


    The output of the preceding example is truncated at around 80 characters for clarity.
    The options modify the output in the following manner: u displays the user-related
    information among other things and sorts the processes by CPU usage, a shows the
    processes of all users instead of those of the calling user only, w uses 132 columns
    to display the information instead of the width of your terminal window, and x
    shows processes that are not bound to a terminal. The last option is important
    because processes not connected to a terminal are using CPU cycles, too. The pipe
    | at the end of the command relays the output to the program head to limit the
    number of lines to ten, the default, so calling head with -10 is not necessary.
    If you want to find the "top ten" of your processes, this command is all you need.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'If you get an error message when using the option `uaux`, then the other variant
    of `ps` is installed. You have to use the option `-ef` instead to get a similar
    output, but this version does not allow the easy sorting of processes based on
    their CPU usage. Another use of `ps` is to determine how many processes of a certain
    program are running. This can be accomplished by chaining the output of `ps` to
    other commands at the users’ disposal. To find out how many processes sendmail
    has spawned, for example, one possible chain of commands could be as shown in
    Listing 1.17.


    # **LISTING 1.17**  Count of Running sendmail Processes


    ```

    root@unixhost:> /usr/ucb/ps uaux | grep sendmail | wc -l

    3

    ```


    It seems that there are three running sendmail processes. To verify that this
    result is correct, starting the command without relaying the output to `wc`, thus
    omitting the `| wc -l` part, displays the found number of lines for inspection
    (see Listing 1.18).


    # **LISTING 1.18**  Displaying Executing sendmail Processes


    ```

    root@unixhost:> /usr/ucb/ps uaux | grep sendmail

    root      740  0.1  0.6  992  696  pts/5    S 11:57:03  0:00 grep

    sendmail

    smsm      592  0.0  1.2 4352 1448  ?        S 10:07:08  0:00 /usr/lib/

    sendmail -Ac -q15m

    root      593  0.0  1.7 4384 2000  ?        S 10:07:08  0:00 /usr/lib/

    sendmail -bd -q15m

    ```


    This command line reveals there are actually *two* running sendmail processes.
    `grep` listed itself because the string `sendmail` is part of the command as well.
    To make use of the count, the line containing `grep` has to be eliminated from
    the list that is relayed to `wc`. There is more than one way to achieve this;
    option one, see Listing 1.19, is a commonly used choice.


    # **LISTING 1.19**  Suppressing the Display of Lines Containing grep


    ```

    root@unixhost:> /usr/ucb/ps uaux | grep sendmail | grep -v grep

    smsm      592  0.0  1.2 4352 1448  ?        S 10:07:08  0:00 /usr/lib/

    sendmail -Ac -q15m

    root      593  0.0  1.7 4384 2000  ?        S 10:07:08  0:00 /usr/lib/

    sendmail -bd -q15m

    ```'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Telling grep to ignore lines containing the word grep by using the option -v
    feeds the right information into wc, but another grep process is needed to do
    so. This third process, to get things right, won’t bring the machine to its knees,
    to be sure, but option two (see Listing 1.20) eliminates the need for the third
    process completely.


    # LISTING 1.20 Suppressing the Display of Lines Containing grep without a Second
    Process


    ```

    root@unixhost:/> /usr/ucb/ps uawx | grep [s]endmail

    smss p 592 0.0 1.2 4352 1448 ? S 10:07:08 0:00

    /usr/lib/

    sendmail -Ac -q15m

    root 593 0.0 1.7 4384 2000 ? S 10:07:08 0:00

    /usr/lib/

    sendmail -bd -q15m

    ```


    The square brackets around the s prevent grep from finding another line containing
    sendmail. How so? grep uses so-called "regular expressions" and the square brackets
    denote a choice, e.g., grep [Ss]endmail would find lines containing Sendmail and
    sendmail, but to find itself again, one would have to search for the square brackets
    as well.


    # 1.2.4.2 top


    The top command acts like running ps permanently while allowing the user to change
    parameters or apply filters to the output. top is usually available on all *NIX
    distributions. After you start top via the command line, the screen looks like
    Listing 1.21.


    # LISTING 1.21 top Default Display


    ```

    last pid: 1026; load averages: 0.12, 0.19, 0.13

    14:17:37

    67 processes: 65 sleeping, 1 running, 1 on cpu

    CPU: 97.4% idle, 1.8% user, 0.8% kernel, 0.0% iowait, 0.0% swap

    Memory: 128M real, 34M free, 60M swap in use, 542M swap free


    PID USERNAME LWP PRI NICE SIZE RES STATE TIME CPU COMMAND

    874 root 1 59 0 11M 8808K sleep 0:10 0.60% Xsun

    1025 erikk 1 59 0 2344K 1616K cpu 0:00 0.23% top

    958 erikk 5 59 0 8912K 7144K sleep 0:05 0.15% dtwm

    ```'
  merge: -1
