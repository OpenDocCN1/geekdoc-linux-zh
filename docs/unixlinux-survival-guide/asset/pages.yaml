- pgno: 45
  md: 'This book was written with emacs.

    If your time permits, try to experiment with as many editors as you like and choose
    the best candidate. Just make sure your choice is available on every system you
    administer, regardless of operational status. And if you should be bored at a
    *NIX-related conference, mention your editor of choice.


    Now, the file ToDo.txt will be put under version control, although it is not absolutely
    necessary. The file needs the contents shown in Listing 2.4 to enable versioning.


    # LISTING 2.4 Contents of ToDo.txt


    ```

    erikk@unixhost:~> head ToDo.txt

    $Id$

    - read in output of ''df -h'' and process it

    ```


    ToDo.txt is a simple text file, apart from the odd-looking first line. $Id$ is
    used for version control; when checked in, it will be replaced with the version
    number and some other information. Although this first line is not a necessity
    to make use of version control, it allows the user to recognize the fact that
    it was put under version control and displays the current version. The necessary
    steps to put the file under version control are shown in Listing 2.5.


    # LISTING 2.5 Putting ToDo.txt under Version Control


    ```

    erikk@unixhost:~> ci -l ToDo.txt

    RCS/ToDo.txt,v <-- ToDo.txt

    enter description, terminated with single ''.'' or end of file:

    NOTE: This is NOT the log message!

    >> start

    >> . initial revision: 1.1

    done

    erikk@unixhost:~> head ToDo.txt

    $Id: ToDo.txt,v 1.1 2004/06/29 09:44:31 erikk Exp erikk $

    - read in output of ''df -h'' and process it

    erikk@unixhost:~> ls -l RCS

    total 2

    -r--r--r-- 1 erikk staff 245 Jun 29 11:44 ToDo.txt,v

    ```


    The command ci -l ToDo.txt puts the file under version control. ci is a moniker
    for "check in." The option -l tells ci to "lock" the file and keep it where it'
  merge: -1
