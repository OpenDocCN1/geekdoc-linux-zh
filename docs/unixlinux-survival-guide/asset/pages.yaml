    # 7.4.4 Intrusion Detection


    Intrusion Detection Systems (IDS) are used to identify suspicious activities inside
    a network or to detect a break-in. These systems use a rule-matching algorithm
    to detect packages or patterns that lead to the conclusion that there could be
    a break-in, virus outbreak, or other unwanted activity going on. The word could
    in the last sentence is of importance; there are "legal" activities that are so
    close to the rules of a break-in or virus outbreak that they trigger an alarm
    in an IDS system (the packets sent between Outlook and Exchange, for example).


    This means that any IDS system is only as reliable as the rules it uses to detect
    activities inside the network. Keeping these rules current is a task that is often
    underestimated. It also heavily depends on the expectations you have regarding
    the use of an IDS system. If the system should not only monitor the network traffic
    of the *NIX systems, but should also monitor the network traffic of the existing
    Windows systems, then you have to make sure to run a very tight update cycle,
    more than twice a day sometimes. The people targeting Windows systems are very
    resourceful and distribute new malware often.


    There are two basic kinds of IDS systems: hardware-based and software-based. The
    hardware-based systems obviously run software, too. The distinction concerns the
    fact that hardware-based systems are delivered with customized hardware to improve
    the performance of the system. One of the common manufacturers of'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'hardware-based IDS systems is Cisco Systems. The software-based system does
    not imply that it should be installed on the file server, or any other system
    running additional services for that matter, but that the system is delivered
    as software only, and the customer needs to supply a machine suitable for the
    job. It does not matter what type of IDS is deployed; both types suffer from a
    common drawback—they might lose packages during phases of heightened network activity.
    If one or more of these lost packages contains the information that something
    is going on and would have triggered the alarm, then the best IDS system is worth
    next to nothing in that case. The only thing you can get out of this situation
    is a feeling of security. You should always have more than one system on this
    specific job, just to make sure that everything is monitored the way it should
    be. The log files created by the baselining scripts represent another aspect in
    this case (see Section 3.1, “What Is Baselining?”). These scripts should be monitored
    as well. If there are unusual spikes in the counters, then one should check the
    other systems as well.


    A description of how to install and implement a software-based IDS system and
    how to maintain the system is beyond the scope of this book. If you want to learn
    more about using IDS systems for permanent monitoring, you should have a look
    at the snort.org Web site at http://www.snort.org. This section discusses how
    to use an IDS system to run quick checks on certain parts of a network to make
    sure everything works as expected. If you want to set up a system to monitor a
    network or a segment of a network, then you have to have a dedicated system, fine-tuned
    for the task, using special hardware to achieve the best results.


    # 7.4.4.1 IDS with snort


    The program snort is available for almost all *NIX-based systems and comes with
    a GPL license. More information can be found on the Web site http://www.snort.org.
    A current version for your brand of *NIX should be available at the Web sites
    in Appendix B; the other way to get snort is to download the source and compile
    the program yourself.


    snort is not that different to tcpdump (see Section 7.4.3.2 “Monitoring Network
    Traffic with tcpdump”), actually. You could use snort as a replacement for tcpdump
    or snoop (see Section 7.4.3.1, “Monitoring Network Traffic with snoop”), but the
    interesting part of snort starts to shine as soon as the program starts in IDS
    mode. The program uses a set of rules to detect anomalies in the network when
    run in IDS mode and is able to notify you about its findings. Independent tests
    proved that snort is up to par with even the most expensive hardware-based IDS
    systems, provided it runs on a machine powerful enough to supply the program with
    the needed resources for the task. But snort’s requirements regarding the hardware
    are not that high to begin with.


    If you want to use snort as a sniffer, then all you have to do is to start the
    program with the options -dv, as shown in Listing 7.34.'
