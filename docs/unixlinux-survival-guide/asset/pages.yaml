- pgno: 210
  md: 'As shown in Listing 6.27, the recording is started by using the command `script
    <filename>`. If you are done recording, you use Ctrl-D (end of file) to stop the
    program and close the file it currently writes to. If you should want to append
    another session to an already existing file, you could use the `-a` option; the
    file will be overwritten otherwise.


    The resulting protocol of what happened is a good base for a script, by the way.


    # 6.3 SUMMARY


    This chapter discussed the necessity of a system to test new software, patches,
    and upgrades before they are applied to the system(s) in production use. It detailed
    the requirements regarding the test system and contained some pointer to be used
    as arguments why a test system should be available to the IT staff. The next topic
    was the use of the so-called “secure system,” a system using a different operating
    system, used exclusively for maintenance tasks related to the production systems.
    Again, the “secure system” is no answer to the threats originating from the outside
    of the company’s network, but is rather a simple approach to break a possibly
    existing monoculture of operating systems in a network. A monoculture enables
    a cracker attacking from the outside to compromise the systems on the inside of
    the network, because most systems in a monoculture are susceptible to the same
    threat. Because the operating system of the “secure system” is different, it might
    not be a potential victim of the same type of attack. The “secure system” is not
    supposed to be part of the network all the time and can thus be used to test the
    existing test systems or even systems in production.


    The chapter continued with a discussion about different approaches to ease the
    creation of documentation. It closed with a handful of tips concerning how programs
    that are already part of the *NIX system can be used to streamline the creation
    of content for the necessary documentation. It discussed the virtues of DocBook—a
    set of DTDs and XSLTs for creating books and articles—which can be used as part
    of the documentation. Further, it demonstrated the use of the RSS format to convey
    information to a number of recipients.'
  merge: -1
