    xmllint to perform this validation. If you should know how to program in C, you
    probably have an idea or two what xmllint actually does. If not, lint is a program
    to do syntax checks and more on .c files. It notifies the programmer about potential
    errors. xmllint performs similar checks on XML files, as shown in Listing 6.8.


