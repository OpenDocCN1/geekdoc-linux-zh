  img_proc: true
- pgno: 35
  md: 'A word of caution, though—this command needs to be run as root and could slow
    down the system considerably. If the system is under heavy load, the creation
    of the list should be scheduled during either a planned downtime or whenever the
    job affects the least number of users.


    Also, remember to move the resulting list into your private root $HOME as soon
    as possible. It contains sensitive information about the system.


    If the system in question should be used as a file server or some other setup
    with huge disk space, then creating a catalog of all files on the shared volumes
    simply does not make sense. To just create a list of the files on the important
    volumes, you can use the -xdev parameter to the find command (assuming all relevant
    directories are on the root volume), as shown in Listing 1.28.


    # LISTING 1.28 Creation of a List of One Hard Disk Only


    ```

    root@unixhost:> cd /

    root@unixhost:> find . -xdev > flist.txt

    ```


    This option tells find not to traverse mount points. If, for example, /usr/local
    is a mounted volume, then you need to repeat the command as shown in Listing 1.29.


    # LISTING 1.29 Adding Directories to the List


    ```

    root@unixhost:> find /usr/local -xdev >> flist.txt

    ```


    You must repeat this command for every mounted directory whose contents should
    be included in the list. Do not cd to the directory because you would lose the
    path that leads to the files.


    This list (stored somewhere only root has access to) enables the administrator
    to find even the most exotic files and directories. This list especially comes
    in handy if a certain program complains about not being able to locate a specific
    file. In that case, the list can be used to search for the file, as demonstrated
    in Listing 1.30.


    # LISTING 1.30 Searching the Location of a File


    ```

    root@unixhost:> grep Xdefs.h flist.txt

    ./usr/X11R6/include/X11/Xdefs.h

    root@unixhost:>

    ```


    This list can be used for other purposes as well. For example, it is used in Section
    7.2.2, "A Simple File Checker," to create a tool to check for changes in vital
    directories.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 1.2.6 Mail


    Knowing what happens on the system regarding mail is crucial these days. This
    does not imply that an administrator should spy on the users, but he should keep
    an eye on the amount of mail that goes through the machine. The most common mailers
    found on a *NIX system are sendmail and postfix. The former comes with a function
    to create a statistics file that can be read with the command mailstats, as shown
    in Listing 1.31.


    # LISTING 1.31 Output of the Command mailstats


    ```

    root@unixhost:~> mailstats

    Statistics from Wed Sep 17 16:03:39 2003

    M  msgsfr  bytes_from  msgs to  bytes_to  msgsrej  msgsdis  Mailer

    3  14      21K         13       27K        0        0        local

    ==============================================

    T  14      21K         13       27K        0        0

    C  3

    ```


    If you should get an error message while running mailstats, you have to enable
    the statistics gathering by issuing the command used in Listing 1.32.


    # LISTING 1.32 Activating the Gathering of Mail Statistics


    ```

    root@unixhost:~> touch /etc/mail/statistics

    ```


    Contrary to the sar mechanism, the mail stats are created on an ongoing basis.
    After 4 days, all you get is the combined data for these 4 days; you have no way
    to evaluate the data on a day-to-day basis.


    The program could be used with the option -p to rectify this situation (see Listing
    1.33). This option instructs the program to output the data in a format suitable
    for processing in scripts and to delete it afterwards. Because the statistical
    data will be deleted when displayed with the -p option, you have to gather the
    statistics in a file to allow later examination.


    # LISTING 1.33 Output for Further Processing


    ```

    root@unixhost:~> mailstats -p

    1063807419 1090320821

    3  17  24  16  30  0  0  local

    T  17  24  16  30  0  0

    C  6  0  0

    ```'
  merge: -1
