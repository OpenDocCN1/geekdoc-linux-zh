  md: "from London, England, to Los Angeles, California, were routed via Munich, Germany.\
    \ The U.K. branch office used to have the faster connection to the United States;\
    \ nevertheless, all Web and mail traffic was suddenly routed via the Munich branch\
    \ office. The router in London seemed to route everything via another route instead\
    \ of using its own, faster, connection. A check of the router revealed the reason\
    \ for this behavior—one user in the U.K. obviously had started an update of a\
    \ system there, using a machine in Los Angeles as source, and another user in\
    \ the U.K. had transferred a substantial amount of data to a system in Los Angeles.\
    \ All this took place inside the Frame Relay network of the company; the routers\
    \ had simply decided that the available speed for the route via Munich was faster\
    \ than the direct link and began to reroute all traffic over this “faster” connection—slowing\
    \ down the company network in Germany.\n\nThe current configuration of the routers\
    \ should have prevented that. A phone call to the U.K. office revealed the source\
    \ of the problem: someone had applied an update to the router’s software and had\
    \ forgotten to activate the routing rules again. That router had just created\
    \ its own rules based on the speed and availability of the network connections.\
    \ After the rules had been activated again, everything went back to normal. The\
    \ time to react and rectify the configuration error was too short in this case\
    \ to be noticed by the majority of the users, but the growth of retransmissions\
