- pgno: 14
  md: '# Preface


    As already mentioned in the foreword, *NIX has a strictly logical structure. Its
    paradigm is, "Better small programs doing one or two things right." *NIX started
    its life as a development environment; because of this heritage, you will always
    find one or two ways to achieve a certain goal. The system can be (almost) completely
    customized to fit your needs. Proofs for this approach are *NIX-based cell phones
    or VCRs. And note, just because I say almost completely does not mean that something
    cannot be done, but rather that the last bit might take more time and effort than
    it''s worth. If you wish to exchange the graphical user interface, you can do
    so without problems; the whole system is built that way. If you feel inclined
    to create a completely new GUI for *NIX, you can do so as well. The sheer number
    of window managers available proves this point. But working as system administrators
    forces different priorities on you. How could you administer a system or a lot
    of systems using the path of least resistance? What parts of the system are to
    be configured how? This book presents a step-by-step approach to various topics
    regarding systems administration. It starts with a couple of hints about how to
    find out what is going on when confronted with an already operational system,
    and it discusses questions regarding backup and the installation and configuration
    of a new system, how to ready the new system for production, and how to secure
    that system.


    Chapter 1, "Things to Check," contains hints as to what to look for on an "inherited"
    system, which configuration settings are important, and how to get a general overview
    about the system.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Chapter 2, “Working on *NIX,” starts with a short introduction about the creation
    of shell and Perl scripts and moves into how these scripts can be executed with
    the help of a basic *NIX service.


    Chapter 3, “Maintenance,” discusses recurring tasks on the systems and a description
    of the baselining technique. The continuous gathering of vital data to detect
    and predict problems before the users notice them is discussed, including hints
    on how to evaluate this data.


    Chapter 4, “Backup,” discusses various aspects of the topic and contains hints
    of what to look for.


    Chapter 5, “Setting Up a System,” discusses the installation of a new system and
    what is needed to ready the system for production use. It also contains a quick
    rundown of the boot process and how the init states are used on various brands
    of *NIX.


    Chapter 6, “The Test System and the ‘Secure’ System,” is about the benefits of
    having a system for tests available and includes arguments to get the system in
    the budget. It further explains the concept of the “secure system,” an approach
    used by many seasoned system administrators to increase security as well. The
    chapter closes with a discussion of how to document tools to ease the creation
    of the necessary documentation.


    Chapter 7, “Security,” discusses various aspects regarding IT security. You will
    find hints and tips regarding this hot topic.


    The book closes with Chapter 8, “That’s It (Almost),” my goodbye to you. Appendix
    A, “One-Liners,” contains useful commands (some longer than one line) to make
    the daily work easier.


    Appendix B, “Software Used in This Book and Where to Get It,” lists the Internet
    addresses where the software used in this book can be obtained.


    Appendix C, “Internet,” contains a list of useful Web sites.


    All examples are set up in a way that they can be used instantly on almost every
    system. Some examples can have side effects, though; you should not try them on
    a production system. It boils down to a simple concept—if there are more users
    working on a system, then all users (including you) can expect a certain courtesy
    from each other. Your job is to make sure that the systems can be used to their
    full potential. If something should not work, then it is your job to minimize
    the impact on the performance of the machine. What can be done to reach these
    goals is the subject of this book.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 1 Things to Check


    # In This Chapter


    +   - Environment Variables

    +   - Peparations


    Not all systems you have to administer are set up by you, the person responsible
    for the administration. Usually you inherit systems that were installed by another
    person, installed according to that person’s idea how things should be done. If
    the installation was documented accordingly, you could read the documentation,
    make sure to understand the whys of the installation, and be done. In theory,
    there is no “wrong” way to set up a *NIX box; there are just things to avoid—some
    at all costs.


    However, many systems are in constant flux, as the services run on those systems
    are changed or the advancements and updates of the operating system are installed.
    This chapter is a quick rundown of things that need to be checked first.


    By no means should you rush in and change everything according to some higher
    plan you made. Sometimes there is a reason for certain settings; however,'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'some settings have just been overlooked. It is your job to find out what should
    be changed and what will probably break if changes are committed to the system.
    Priority number one is to document. It may sound like a broken record, but there
    will be times when proper documentation really saves your day.


    # 1.1 ENVIRONMENT VARIABLES


    There are a lot of settings concerning the environment variables on a system,
    enough to give you a headache. However, because all programs use them, you should
    be aware of the consequences surrounding them.


    # 1.1.1 The $PATH Variable


    Every *NIX system uses the $PATH variable to find all the executables available
    to the currently logged-in user account. If the $PATH variable looks like the
    one shown in Listing 1.1, there could be trouble, depending on the flavor of operating
    system (OS).


    # LISTING 1.1 Displaying the Current $PATH


    ```

    $:-> echo $PATH

    /usr/local/bin:/usr/bin:/usr/X11R6/bin:/bin:/usr/lib/java/jre/bin:/opt

    /gnome/bin:.

    $:->

    ```


    The fact that programs in /usr/local/bin are called first, might be okay on a
    Linux system; however, the same thing on Solaris could create some confusion if
    you are not aware of it.


    For example, there are sometimes two tar programs on a Solaris system, and each
    behaves differently. One is in /usr/bin, and one is in /usr/local/bin. The latter
    knows how to use the gzip library to compress and uncompress the resulting archives.
    This means if you are switching between two Solaris systems, the command line
    tar xzf will work on the system with /usr/local/bin first in the $PATH.


    However, you will get an error message on the system that uses the tar in /usr/bin.
    This means that the tar command supplied by Solaris cannot open files created
    with the GNU version, the version installed in /usr/local/bin.


    > Always include the path. Most programmers create variables containing the program
    name, including the complete path, if they want to make sure the program they
    intended to use gets executed, for example, TAR=/usr/local/bin/tar. Then, if


    ![](img/e121d664a879353483b8ef78e54b87ea_17_0.png)'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'the tar program is needed, it is called with $TAR instead of tar. Relying on
    the operating system to call the "right" program is a risky approach, and it will
    go wrong eventually.


    That does not necessarily mean that you cannot have /usr/local/bin as first entry
    in your $PATH—you just need to be aware of the consequences. Changing the $PATH
    requires thorough testing and examination of the deployed scripts; they might
    rely on a certain order regarding the $PATH variable.


    However, the setting at the end of the sample variable is more disturbing. If
    you try to start a program, the current directory $PWD will be checked as well.
    Because all other components of the $PATH will be checked first, you are less
    likely to launch a program you didn’t intend to start, but nevertheless, the current
    directory shouldn’t be included in the array of paths that are searched for executables.
    Again, if you decide to change this setting, make sure there are no scripts or
    worse, users, relying on the current setting.


    # 1.1.2 The Prompt


    If you have to switch between systems on a regular basis, you should set your
    $PS1 variable to give you some hint about the user-context and machine you are
    on at the moment. Tailoring this variable to meet your individual needs is done
    best by using one of the files in the respective $HOME directory read by the shell
    during launch. Depending on the shell used, either .profile or one of the configuration
    files read by the respective shell could be used, e.g., .cshrc or .bashrc. Listing
    1.2 shows the entry.


    # LISTING 1.2 Universal Prompt


    ```

    PS1="$USER@`uname -n` "

    ```


    It is important to note that the characters around uname -n are so-called back
    ticks (`). A single quote ('') would not work. A command enclosed in back ticks
    is executed and the result replaces the command. The sequence in the listing works
    on almost every *NIX-based operating system.


    If you use the "GNU Bourne-again shell", bash for short, the sequences in Listing
    1.3 and Listing 1.4 would work as well.


    # LISTING 1.3 Alternate Sequence for bash


    ```

    PS1="\u@\h> "

    ```'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# LISTING 1.4 Sequence Including the Current Path


    ```

    PS1="\u@\h:\w $"

    ```


    These alternate sequences are less “talkative,” though.


    This simple configuration item allows the running shell to display the information.
    If times are getting hectic, a quick glance at the prompt and you know which host
    you are on and the user-name you are working as.


    # 1.1.3 The $MANPATH Variable


    If you use the command man at the command line, you expect it to magically find
    all information about the installed programs. However, this “magic” requires that
    the system is set up to work that way. man uses the $MANPATH variable to search
    for manpages. Every directory included in $MANPATH will be searched; every directory
    not included will be ignored, obviously. More often than not, $MANPATH contains
    only /usr/share/man. In that case, for example, all the information in /usr/local/share/man
    would not be processed because man would not know about it. To make matters worse,
    man -k is rarely used on Solaris systems, because nobody bothered to create the
    index to search in initially. Listing 1.5 shows the code to create an index on
    a Solaris system.


    # LISTING 1.5 Creating the Index on Solaris


    ```

    root@unixhost:~> echo $MANPATH

    /usr/dt/man:/usr/man:/usr/share/man:/opt/sfw/man:/usr/local/man

    root@unixhost:~> catman -w

    ```


    Make sure $MANPATH incorporates all directories containing manpages and execute
    catman -w. The -w option instructs the program to create the so-called windex
    database. This database contains the index to search within (the contents of)
    the manpages.


    Complicating matters further is the fact that there is no consistent location
    other than /usr/share/man and /usr/local/share/man where manpages are stored.
    There are different approaches, every one valid in its own right, but if you have
    different flavors of *NIX to administer, you want to make sure all directories
    containing manpages are searched accordingly. To illustrate the current situation,
    you can look at examples of how the $MANPATH might look like on GNU-Linux (Listing
    1.6), Solaris (Listing 1.7), and OS X (Listing 1.8), all *NIX-based systems.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# LISTING 1.6 $MANPATH on GNU-Linux


    ```

    /usr/local/man:/usr/share/man:/usr/X11R6/man:/opt/gnome2/man:/opt/gnome/man

    ```


    # LISTING 1.7 $MANPATH on Solaris


    ```

    /opt/sfw/man:/usr/man:/usr/local/man:/usr/dt/man:/usr/openwin/man:/usr/X/share/man

    ```


    # LISTING 1.8 $MANPATH on OS X


    ```

    /sw/share/man:/sw/man:/usr/share/man:/usr/X11R6/man

    ```


    That does not necessarily mean the settings shown in these listings are the way
    to go. You must adapt the settings to your systems. Some applications even store
    their manpages in the directory they were installed in.


    The order in $MANPATH is equally significant. The manpages are searched on a per
    directory basis in the order they appear in the variable. In the Solaris example,
    man would find the GNU variant of ls first. This variant is able to display the
    directory listings color-coded, provided the right parameters are used. These
    parameters would not work with the SUN version of the command, though.


    To find out about the situation on your system, use the command echo $MANPATH.
    If the output more or less resembles the examples shown earlier in this section,
    most of the available manpages should be searched and indexed. If time permits,
    take a look around on the machine and make sure there are no omissions. If the
    output is /usr/share/man, it might be a system that serves a certain purpose only
    and thus contains only a subset of the available software, or it might be that
    the person who ran the initial setup simply forgot to adjust the $MANPATH accordingly.


    ![](img/e121d664a879353483b8ef78e54b87ea_20_0.png)


    > Always install all manpages. Because hard disk space comes cheap these days,
    installing all available manpages, if possible, is advisable, provided, the *NIX
    in use allows to install the manpages separately. You might even find a program
    you weren’t aware of, possibly enabling you to do your job faster, easier, etc.


    You should take the time to run man intro on all systems; the "intro" manpage
    installs automatically on every system and contains useful information about it.
    An interesting way to search the installed manpages is the -k option of man. This
    option allows you to search inside the available manpages. You just supply the
    word you are searching for, as shown in Listing 1.9.'
  merge: -1
  img_proc: true
