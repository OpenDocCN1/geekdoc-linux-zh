- pgno: 122
  md: '# 4 Backup


    # In This Chapter


    +   - Backup Strategies

    +   - Tips Regarding Backup


    Let’s face it—hardware tends to fail eventually, and the types of failure can
    be mind-bogglingly complex. Accepting this fact is the first step toward a more
    secure system—secure in the sense of availability and not in the sense of computer
    security. The range of possible hardware accidents spans from a real hardware
    error to things like flooding, fires, and worse. This is not to imply that your
    building will collapse sooner or later, but it is the responsibility of a system
    administrator to be aware of the fact that it could happen. The data stored on
    the computers represents a substantial value to the company you are working for;
    at times, a loss of this data means the whole operation is out of business. A
    system administrator is supposed to take precautions, test them, implement them,
    and refine them on a recurring basis. This chapter deals with certain aspects
    regarding working with backups.'
  merge: -1
  img_proc: true
