    # 7.4.3 Monitoring Network Usage


    The third component to monitor is the network the systems are connected to. As
    already mentioned, monitoring a complete network is beyond the scope of this book;
    this section discusses the monitoring of single components, the systems connected
    to the network. To learn more about monitoring networks, you should use the Internet
    to investigate which topics are of interest, but there is no catch-all approach
    to monitoring networks due to the complexity of the task.


    All software packages discussed in this section can be used on a laptop without
    any problems, provided the laptop is equipped with a real operating system. This
    means preemptive multitasking is a must. The exercise to monitor network connections
    would be futile otherwise. This is not about monitoring a network on a permanent
    basis, but about providing the means to execute a monitoring session if needed.
    A laptop with GNU/Linux, Solaris x86, or some BSD variant or an Apple PowerBook
    running OS X can be transported to every spot in the network and used to start
    a quick monitoring session to identify a problem. The operating systems mentioned
    usually come with the software already installed or on the distribution media
    ready to install, so there is no need to download the software separately and
    install it. The “real” monitoring of a network or even a network segment requires
    a finely tuned system dedicated to the task.


    # 7.4.3.1 Monitoring Network Traffic with snoop (Solaris)


    The command snoop is part of the *NIX derivate Solaris. It is located at /usr/sbin/snoop
    and executable only for the superuser. The reason for that is based on the way
    the program operates; it switches the NIC to promiscuous mode. In this mode, the
    NIC “sees” every network package that passes, instead of only those meant for
    its own IP-address, thus enabling the user to snoop on other people’s data.


    There is another program with similar functionality ported to almost any *NIX
    flavor, including Solaris, called tcpdump, see Section 7.4.3.2, “Monitoring Network
    Traffic with tcpdump.” Which program you use depends on your requirements and
    the dominant operating system in use.


    Listing 7.25 illustrates the power of snoop; it shows how to snoop a dig request.'
