    The settings of choice should be documented accordingly. *NIX systems tend to
    run for a very long time, given the inherent stability. You are usually not able
    to remember the rationale behind a decision made 2 years ago, and the reasoning
    for that decision might have changed as well, taking into consideration new developments,
    for example. It is always preferable to have access to the documentation, as opposed
    to having to guess at why a certain setting was necessary at the time the decision
    was made to implement a certain feature.


    # 5.2.2 Configuring syslog.conf


    As already mentioned in Chapter 3, the files created by syslog are the first line
    of defense if you need to get an overview of the status of a given system. The
    default /etc/syslog.conf file contains only a very basic setup regarding the logs
    to be created, because of the varying needs of the different uses and types of
    systems in production. There are valid reasons for this default behavior. If a
    system would be configured to log almost everything that might be of interest,
    then that system would be able to fill up /var in no time at all, if that system
    were busy enough. The other reason is the fact that not all system administrators
    are willing to fine-tune the behavior of syslog. They believe if the default configuration
    instructs syslog to write too much information into the files, then they could
    miss important information in the created noise.


    What information is considered interesting for the use of a given system can be
    decided only by the administrator of that system. In case you are not sure what
    information to collect, enable the settings in question and instruct syslog to
    write the information into separate files. These files should be monitored for
    about a month, and the contained information should enable the system administrator
    to decide if the information is important enough to continue with the specific
    setting. To allow the differentiation of the various messages, syslog provides
    so-called facilities to sort the specific messages into categories (see Table
    5.1). These categories use levels to allow access to more granular information.
    The system is straightforward as one would expect in *NIX.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# TABLE 5.1 syslog Facilities


    | Facility | Description |

    |---|---|

    | user | This facility is used by user processes, more than often processes that
    do not fit into one of the other categories. |

    | kern | This facility is used by the kernel, the "brain" of the operating system.
    |

    | mail | This facility is used by all mail-related processes. |

    | daemon | Daemons are all processes running in the background, for example, powerd
    (monitors the power available to the system, provided the system''s hardware is
    able to supply the information) or vold (takes care of the volumes available to
    the system, including CD-ROMs). |

    | auth | Everything related to authentication, used, among others, by login, su,
    and ssh (if configured). |

    | lpr | Used by all programs related to print services; this includes fax programs,
    for example. |

    | news | Used only by NNTP (Network News Transfer Protocol). |

    | uucp | The UUCP (Unix-to-Unix Copy Protocol) is not in use anymore. It was used
    to copy files between systems on the precursor of the Internet. |

    | cron | Usually used by at or cron, this facility is not used on every *NIX system;
    please check the syslog or syslog.conf manpages. |

    | local0-7 | The facilities local0 to local7 are to be used by the administrator
    and certain programs. Please note that software like Legato NetWorker uses the
    local0 facility by default; the behavior can be configured, though. |

    | mark | Used internally by syslog, but can be used by the administrator as well.
    |

    | * | Not a real facility, but a shortcut for all facilities with the exception
    of mark. |


    As already mentioned, the facilities make use of so-called levels to differentiate
    between specific classes regarding the messages. The levels imply certain conditions
    and are used as follows: if you query a "lower" level, all "higher" levels are
    automatically included. Table 5.2 contains all available levels; it should make
    the system a little bit more obvious.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# TABLE 5.2 syslog Facility Levels


    | Level | Description |

    |-------|-------------|

    | emerg | The highest level a message can use; a message with this level is usually
    broadcasted to all users of the system. These are so-called panic-conditions.
    |

    | alert | This level is used for messages that require immediate attention, but
    are not as severe as emerg. A good analogy would be emerg = "The house is collapsing."
    and alert = "If no one does something about this, then the house will collapse."
    |

    | crit | Used for critical errors, like a failing hard disk. |

    | err | Used for all other error conditions not covered by the previous three
    levels. |

    | warning | Used for warnings of a more general nature. |

    | notice | Used for conditions that would not be considered as error, but need
    attention nevertheless. |

    | info | Informational messages. |

    | debug | Used to allow a program to communicate while it is debugged. |

    | none | A special case, this level can be used to suppress all messages of a
    given facility, for example, news.none instructs syslog to ignore all messages
    sent by the news facility. |


    The table should clear things up a bit. If you would activate auth.info in syslog.conf,
    for example, then all messages with auth.notice, auth.warning, auth.err, auth.crit,
    auth.alert, and auth.emerg would be included automatically. Telling syslog what
    you are interested in is just part of the configuration; you need to tell the
    program where to store the messages as well (see Table 5.3).


    # TABLE 5.3 Telling syslog Where to Store Messages


    | Target | Example |

    |--------|---------|

    | A filename instructs syslog to store the message in the given file. The file
    has to exist, though. The message would disappear otherwise. | /var/adm/messages
    |

    | The name of another system denoted by the @ sign. That system needs to be configured
    in a way that it is able to receive the sent messages. This approach allows you
    to | @companyloghost |'
  merge: -1
  img_proc: true
