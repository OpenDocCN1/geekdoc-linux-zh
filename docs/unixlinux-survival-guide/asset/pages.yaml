- pgno: 307
  md: "# KEY FEATURES\n\n+   - Provides a quick, easy-to-use reference for Unix/Linux\
    \ system administrators\n+   - Teaches what system administrators need to know\
    \ to avoid system breakdowns\n+   - Explains a variety of vital administrative\
    \ tasks, including programming small scripts, user administration, installing\
    \ and configuring systems, preparing a new system for production, setting up a\
    \ test system, backup, documentation, preventive maintenance techniques, and data\
    \ security\n\n# SYSTEM REQUIREMENTS\n\nUnix/Linux operating system; Perl version\
    \ 5.x or greater; Java Runtime Environment (JRE) 1.3 or newer for the DocBook\
    \ example.\n\n# CHARLES RIVER MEDIA\n\n10 Downer Avenue\nHingham, MA 02043\n(781)\
    \ 740-0400\n(781) 740-8818 FAX\ninfo@charlesriver.com\nwww.charlesriver.com\n\n\
    # The Reference That Every Unix SysAdmin Needs!\n\n# UNIX / LINUX SURVIVAL GUIDE\n\
    \n# Erik M. Keller\n\nAll Unix/Linux systems, regardless of manufacturer, have\
    \ inherent similarities for administrators. The Unix/Linux Survival Guide details\
    \ these similarities and teaches SysAdmins how to tackle jobs on all systems.\
    \ Mixing administrator knowledge and best practices, the book walks admins step-by-step\
    \ through installing, setting up, and configuring a new system. It also teaches\
    \ them how to administer systems they didn’t set up originally.\n\nIntended as\
    \ a quick and dirty reference for administrators to use in their daily work, the\
    \ book contains numerous hints on where to look and what to look for to get a\
    \ Unix/Linux system up to speed and running smoothly. Admins will also learn preventive\
    \ maintenance techniques to extract and evaluate baseline data and create a warning\
    \ system that allows them to react to problems before users even notice. Daily\
    \ task checklists are provided, and other key topics such as backup, security,\
    \ and documentation are covered in detail. This book provides the knowledge, skill\
    \ set, techniques, and approach of a NIX systems.\n\n# ON THE CD\n(see Appendix\
    \ D for more details)\n\n+   Scripts\n+   • Contains the administration scripts\
    \ from the book\n+   \n+   Figures\n+   • Includes all of the figures from the\
    \ book by chapter\n\n# ABOUT THE AUTHOR\n\nErik M. Keller (Munich, Germany) is\
    \ a freelance consultant and trainer. He has over 18 years of experience on Unix/Linux\
    \ as an administrator, consultant, DBA, trainer, and developer.\n\nShelving Level:\
    \ Unix / Linux / Networking Intermediate"
  merge: -1
  img_proc: true
