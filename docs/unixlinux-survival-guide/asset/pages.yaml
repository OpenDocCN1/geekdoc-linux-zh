  md: 'configuration error or even malicious intent—another time-host should appear
    on the internal network, broadcasting different values compared to the regular
    time servers, a situation that is really hard to debug arises. The file ntp.conf
    on the internal machines needs only one entry, broadcastclient. The file on the
    time server uses the entry broadcast your.ip.range.255. As already mentioned,
    this is not a solution, but a temporary fix, at best. If you want to use the broadcasts,
    you should deploy the authentication facilities of the protocol. ntp version 3
    requires you to transfer the generated keys to every system; version 4 is able
    to distribute the keys from a central location. You just have to keep an eye on
    the address range(s) you are distributing your keys to.


    The keys are stored in either /etc/ntp.keys or /etc/inet/ntp.keys. You have various
    encryption methods at your disposal. Type M means encryption using MD5. Listing
    5.7 presents an example.


    # LISTING 5.7 ntp.keys


    ```

    1 M coolpassphrase1

    5 M anothercoolphrase

    10 M evenbetterphrase

