    # 6.2.2.5 The script Command


    If you need to log all commands and responses to these commands into a file for
    documentation purposes or other uses, the command script is there to help. It
    copies everything that shows up in a terminal window to a file. This approach
    is especially handy if you want to run tests, want to try to get to know a new
    program (running in terminal, of course), or simply want to document what you
    were doing. Listing 6.27 demonstrates the use of the program.


