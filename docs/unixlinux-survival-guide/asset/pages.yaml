- pgno: 144
  md: 'You should re-run the installation a couple of times if necessary and try to
    gradually achieve the desired system state suitable for the intended use. The
    easiest approach is to install a lean system, just the bare essentials, and then
    check which features are missing. Continue with the installation of features until
    the requirements are met. This approach allows you to see how the system reacts
    when you modify it; sometimes features do not work as easily as advertised. Remember
    to add the patches for the newly installed features and functionality. If you
    should encounter errors while adding features and functionality or while patching
    them, check the manufacturer’s Web site for newer builds of the operating system.
    Sun, for example, periodically releases new builds of Solaris as ISO images. These
    files are supposed to be written to CDs or DVDs, thus supplying you with the latest
    installation media. If all problems are solved, or there were no problems at all,
    you need to write all necessary patches to whatever medium is to be used during
    the installation. Make sure to be aware of the ramifications regarding patches
    being dependent on other patches or installed packages: some patches cannot be
    installed before certain other patches or packages are installed first.


    Now you should find it possible, armed with the gained knowledge, to estimate
    the length of the installation process. If you need to install application software,
    then you need to include it in the tests, applying the same methods used for the
    installation tests of the operating system. Now add the estimates; the calculated
    time needed to do a full install, including all applications, gives you a solid
    estimate of how much time you would have to spend to do it again in case of a
    hardware failure or other problems.


    # 5.1.2 Partitioning the Disks


    Every *NIX system uses one or more hard disks to store the operating system and
    the created data. Partitioning these hard disks and the distribution of the parts
    the operating system consists of could have a significant influence on the performance
    and stability of a system.


    The root partition, /, is the base of the whole filesystem; everything else, all
    other connected hard disks and the respective partitions, is accessible from here.
    The root partition should contain all necessary programs and configuration files
    to start the system. Software required to repair a malfunctioning or defective
    system should be stored here as well.


    Recommendations concerning which parts of the system should not be located on
    the root partition but stored somewhere else—either on a different partition or
    another hard disk—are usually part of the installation process. Usually they differ
    between the various *NIX brands.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'memory-intensive operations. *NIX does not page the main memory without a reason,
    as opposed to other operating systems that start swapping if some part of the
    main memory is not used for a certain period of time; paging takes place as soon
    as the need arises. Locating the swap partition on another hard disk usually influences
    the speed of the system significantly in a positive way. The system will not slow
    down to a crawl if the swap partition is not on a dedicated disk or on a disk
    used for other purposes, but if it is possible to put it on a separate disk, you
    should do so.


    The filesystem /var is the next candidate. It is used to store all variable files
    like logs, mails, temporary files for printing, and the like. This directory should
    always be separated from the root partition. If a program should run wild and
    fill up the /var directory, then the system could be in trouble. If the same should
    happen on the partition containing the root file system, then you are in real
    trouble. However, the amount of hard disk space available to you on newer systems,
    seems to invalidate this argument, even a fast system should have problems filling
    up that much space. On the other hand, one big partition containing all of the
    system is harder to maintain and to monitor. So why take chances? A dedicated
    /var partition will show up in the baselining reports much faster, and its status
    is easier to spot (see Chapter 3 for more on baselining).


    More often than not the /usr and /usr/bin directories are stored on separate partitions
    as well. The advantage of this approach is that it is possible to mount these
    partitions as read-only. This prevents modifications or worse, manipulations,
    of the stored programs during runtime. The downside of this approach is that it
    is not possible to apply patches or upgrades without restarting the machine, thus
    interrupting the running services. There is no clear-cut answer to this problem;
    what to do depends heavily on the services provided by the system and the implied
    security needs. Depending on the exposure to the outside world or how sensitive
    the data stored on the system is, protecting the programs running on the machine
    might become a necessity.


    Many *NIX flavors separate additional software stored in /usr/local or /opt, as
    well. These directories are likely candidates because estimating their growth
    ratio is not that easy. If you have underestimated their size during the initial
    setup, you could still get a new hard disk, connect it to the system, and move
    their contents to it. Afterwards, you just mount the new partition into the old
    directory, and everything is back to normal. Just be aware of the fact that the
    contents of the directories the new partitions are mounted into are inaccessible
    until you unmount them again.


    Which devices, partitions on hard disks in this case, are mounted where is defined
    in the files /etc/fstab or /etc/vfstab. Some releases of AIX use /etc/filesystems
    as well. You have to check the manpages for the mount family of commands where
    the information is stored on a specific system.'
  merge: -1
  img_proc: true
