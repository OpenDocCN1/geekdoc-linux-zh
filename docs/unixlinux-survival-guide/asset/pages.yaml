    # MAINTENANCE CONTRACTS ARE IMPORTANT


    If possible at all, you should try to get a maintenance contract for all production
    systems with the manufacturer of that system. Most manufacturers of *NIX systems
    limit the information available to their customers if they do not have a maintenance
    contract. This is not an act of discrimination, but common sense. If the need
    arises to install a certain set of patches with known side effects, then the availability
    of support by the manufacturer is an absolute necessity. If needed, a trained
    technician can be present in case something goes wrong.


    The author’s experiences with that kind of support are really good. One case required
    the patching of a five-year-old Solaris system. While applying the patches, it
    became obvious that they triggered an error inside the used RAID controller. Applying
    the patches was paramount, though. To keep an old database application up and
    running, the application required an outdated release of the database system,
    not certified for the system’s patch level. The maintenance contract helped to
    solve the issue. A technician sent by the manufacturer changed a faulty controller
    over the weekend. Then the patches were applied, and the system was up and running
    on Monday again.


    This does not necessarily mean every system administrator will encounter things
    like the one described, but always remember Murphy (the pilot not the scientist):
    “If something can go wrong, it will, at the most inconvenient time.” Installed
    applications on *NIX systems become more and more interwoven with the rest of
    the system and other programs; make sure to get every support option available
    if the system is mission-critical.


    Your best bet is a maintenance window, a predefined time every week or day, if
    necessary, in which all involved persons expect a downtime of the systems. If
    you should not need the window, that’s even better. The superior architecture
    of a *NIX system allows you to apply most patches while the systems are doing
    their job, contrary to the “other” OS that requires you to reboot after every
    applied patch. Still, applying patches while other users are trying to work might
    put a noticeable strain on the performance of the system. Another advantage of
    the scheduled downtime is the fact that you are able to watch the system while
    nothing but the OS is running, thus allowing a valid assumption about the state
    of the system. If something shows up during that time, you are free to investigate
    and take precautions to keep the system'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'tems healthy; you are even able to switch to single-user mode without disrupting
    any user processes to take a closer look. Keep your users informed about changes
    to the systems; they rely on you to keep them up and running. That does not mean
    you should “swamp” your non-technical users with acronyms they do not understand,
    but do keep them informed in non-technical terms of what is going on.


    # 3.3.6 Customer Relations


    Avoid the “Thou shall not bother the “NIX guru” attitude. These people are your
    customers; gain their trust. Drop by now and then, ask them if everything is working
    as expected, and take notes if it does not. This information might point to an
    error condition that will not show up for some time. If you are positive that
    there is nothing to worry about (see Section 3.1.1, “Why Baselining?”, earlier
    in the chapter), try to help your customer anyway.


    We live in interesting times; all departments try to shield their budgets from
    cuts and work on deflecting them to some other place in the company. One of the
    reasons why the IT budget could come under fire is the fact that there are no
    “known” faces behind the department. IT enables the company to do its work, but
    if the company cannot do what it is supposed to do, they would not need an IT
    department in the first place. So, repeat with me: “The users are our customers;
    if we help them to do a good job, our budget is a little more secure.”


    This idea may seem to overdo it a little. It sounds like some kind of marketing
    stunt, actually. But truthfully, the users and the IT department are in a symbiotic
    relationship; they need each other.


    # 3.3.7 Management Relations


    The other side of the coin is the relation between the IT department and upper
    management. You need their trust, too. They are supposed to allow you to spend
    money on upgrades or new equipment. Make sure they understand that there is a
    valid business case behind your demands. Keep them informed about what is going
    on as well. You will have to change the perspective, though. Your users (see the
    preceding Section 3.3.6, “Customer Relations”) are interested in getting faster
    connections, more disk space, and faster workstations; upper management is interested
    in keeping the running costs as low as possible. If you need to convince them
    to increase your budget, you have to prove that business will run smoother and
    they will gain in the long run. Of course, gaining in the “short run” is even
    better. To argue along those lines, you should arm yourself with solid numbers
    (refer back to Section 3.1.1, “Why Baselining?”, earlier in the chapter).'
  merge: -1
