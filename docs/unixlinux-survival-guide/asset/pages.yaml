    In Listing 7.25 snoop was used to capture packages that had the IP address 192.168.0.5
    as either source or destination. The captured packages were saved to the file
    digtest.cap. The line with the number 2 shows the number of captured packages.
    The resulting file—especially its permissions—should give you a visual indication
    why captured files should be stored out of reach from other users. They are world-readable.
    You could use the command umask 0077, but storing the files in a secure location
    seems to be the best approach. The command issued on host 192.168.0.5 was dig
