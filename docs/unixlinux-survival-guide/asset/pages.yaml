  md: '# LISTING 3.26 A User Record in the shadow File


    ```

    root:uKE581KUSePq:6445::::::

    ```


    The structure is as follows: the first field contains the username, the second
    field the ciphered password, the third field the number of days since the password
    was last changed, the fourth field the number of days the password cannot be changed,
    the fifth field the number of days the password will be valid, the sixth field
    the number of days before the warning about a password becoming invalid is issued,
    the seventh field the number of days within which the account has to be used (it
    will be locked otherwise), the eighth field the expiration of the account as an
    absolute date, and the ninth field is reserved for further extensions.


    HP-UX introduced the shadow concept in Release 11.11 vi.6; this means in the Intel
    version. In your specific case, you should check your documentation to make sure
    all services are able to make use of the shadow file. Older HP-UX releases use
    the file /tcb/files/auth/r/root for the mentioned concept, and AIX stores the
    ciphered password in the file /etc/security/passwd.


    # 3.2.4 What Is a Skeleton File?


    The so-called skeleton directory contains files and directories that are used
    for all user accounts. Many *NIX systems use the directory /etc/skel for that
    purpose; it contains files like .profile, .login, and .cshrc, for example. These
    files will be copied in the $HOME directory of every new user, provided the program
    to create a new user makes use of the skeleton directory. Every system administrator
    should make use of this directory, store all files and directories in it that
    should be part of every home directory, and if necessary, create the missing files
    in accordance with the IT policy of the company. This way, all new users will
    find a consistent environment when logged into their respective accounts.


    As already mentioned, as system administrator, you are free to create new files
    and directories in /etc/skel. If the program used to create new users on the system
    supports an alternate path to be used as a skeleton directory, it is even possible
    for you to create different directories for different types of users. Listing
    3.27 shows an example for a "normal" user account.


