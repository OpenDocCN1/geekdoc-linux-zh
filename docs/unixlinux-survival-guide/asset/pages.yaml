    # A.3 THE sed STREAM EDITOR


    An often neglected tool on every *NIX system is the sed stream editor. Its capabilities
    are not that obvious and sometimes well hidden. The program is meant to process
    text files by using the file as a stream and to output the modified file to stdout
    again. The size of the file is more ore less irrelevant because the output can
    be sent to a file again. This means there are almost no restrictions regarding
    the size of the files the program can process.


    # A.3.1 Creating Blank Lines after Search Results


    If you should need to edit an XML file with an editor, then depending on the size
    and complexity, the process could be very cumbersome and error prone. Assume you
    want to edit a file structured in DocBook format (this means the hierarchy of
    sections consists of nested <sect1>, <sect2>, <sect3>, and <sect4> tags), and
    you want to ease the navigation inside the file by inserting a blank line above
    every <sect1> tag. You could use an XSLT stylesheet to create this kind of formatting,
    but the result does not justify the time needed to create the stylesheet. Listing
    A.9 demonstrates the use of sed to achieve the same result.


    # LISTING A.9 Insert a Blank Line Using sed


    ```

    ...

    but there will be times when proper documentation really

    saves your day.</para>

    <sect1 id="environment">

    <title>Environment</title>

