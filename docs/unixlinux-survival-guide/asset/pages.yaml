- pgno: 181
  md: 'system without breaking installed third-party applications. Hence, you have
    the need to be able to check for open ports on a system inside the network. If
    you know which ports are open, you can take precautions against mischief if necessary.
    Running an nmap penetration test against a production system is something you
    should avoid at all costs. As long as you are able to mimic the configuration
    of the production system on your test system, use the test system as target to
    see what happens.


    Why use the secure system in the first place? Sure, you could run the penetration
    tests from the workstation against the test system, but the secure system is not
    a permanent part of the network. Thus, its IP address will stand out of the usual
    traffic, enabling the department responsible for the network security to filter
    the penetration tests from the log files, therefore not causing an alarm. To filter
    the IP address from the log files is figurative for not considering it as a potential
    threat; no IP address should be filtered from log files under any circumstances.
    If an intruder notices that the system administrators run periodic tests against
    the systems originating from their workstation, he could spoof these IP addresses
    to cover his tracks. However, if the IP address of the secure system shows up
    in the log files and you are sure that the system was not connected to the network
    at that time, you have a clear indication that someone used the IP address to
    cover the attacks.


    Finally, if you are relatively new to *NIX, installing an operating system on
    that kind of hardware could be difficult, but there are literally hundreds, if
    not thousands, of walk-throughs and install documents to help with that undertaking.
    If you tackle this endeavor with an inquiring mind, you might learn a thing or
    two about the inner workings of *NIX-based systems, but try to make sure you don''t
    neglect your daily tasks while at it. If you can spare the time, you should have
    a closer look at the system. Dissecting another operating system that might use
    different approaches to tackle common tasks could spark ideas of how to solve
    a certain problem, well, differently. *NIX evolved this way; why shouldn''t everyone
    make use of this technique? But always keep in mind that you are using hardware
    that might not be replaceable. Make sure you don''t lose anything of importance,
    in case the system''s hard fails or the CPU goes up in smoke.


    A closing remark about the secure system: if you are a well-versed BSD administrator
    reading this book to learn something about *NIX, simply turn this section''s message
    around. Use the information in this book to create the “exotic” solution from
    your point of view, meaning you could use a *NIX-based system as your “secure”
    system. Maybe you might learn a thing or two, too.


    # 6.2 DOCUMENTATION


    There is no replacement for good documentation, if a system starts to behave erratically
    at 3:00 A.M. The truth contained in this sentence has hit us many times'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'during the last 18 years while working as system administrators. Problems or
    strange behavior will always occur while you are busy doing something completely
    different. Switching into “error fighting mode” is much simpler when you are able
    to use good documentation as a fallback to bring you up to speed with what happens
    in the affected part of the system. If you know what was changed when and for
    what reason, tackling the problem is much easier.


    What is good documentation? One possible answer: the availability of all relevant
    information in a structured manner. But how should this structure appear? What
    information is to be considered relevant? What about rarely needed information,
    only necessary for certain tasks? How should you be able to search for the needed
    information? To approach a solution, we will talk about storing information first.


    Storing documentation and making it readily accessible at the same time is the
    first hurdle you need to take. Storing the documentation about a system in whatever
    format that you take on that system is the most convenient approach. But one should
    keep in mind that accessing the hardware documentation about the hard drive to
    fix a corruption on it might get difficult. Almost equally difficult is accessing
    information in a format that requires having access to a certain kind of software
    to read it in the first place. All discussions about proprietary data formats
    aside, if you need to install a word processor on one of the server systems connected
    to an uninterruptible power supply (UPS) during a blackout, to look up the information
    desperately needed to get things running again, the documentation can hardly be
    considered readily accessible. The first conclusion you can draw from these example:
    documentation should be available in more than one format, readily accessible
    at all times, and the formats should be as easy to handle as possible. Printing
    everything on paper comes to mind. Paper is readily accessible, provided the way
    it is stored allows some kind of structured access, thus relieving the seeker
    of the information from the task of wading through tons of paper. Changing the
    stored information could be accomplished by using a pencil or a pen—a fantastic
    new digital world, beaten hands down by pen and paper. The author may be exaggerating
    a little, but there are serious implications that motivate painting such a dark
    picture.


    > Keep your documentation platform-independent. Even if you create the documentation
    (the documentation you use on a daily basis now) with the help of the most sophisticated
    program available at the time being and store that information in the program’s
    format, are you sure you will be able to access this information in a couple of
    year’s time? Some of the gray hairs on the author’s head stems from trying to
    convert really old Lotus 1-2-3 files to a format usable with current software,
    accessing data stored on 8” floppies at a dusty CP/M system, and successfully
    converting data written on a tape with a backup software created by a manufacturer
    who decided to leave the field of computing sciences many years ago. Not that
    the


    ![](img/e121d664a879353483b8ef78e54b87ea_182_0.png)'
  merge: -1
