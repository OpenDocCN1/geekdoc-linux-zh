    # 5.2 HOW TO READY A SYSTEM FOR PRODUCTION


    Installing a system and getting it ready for production are two sides of the same
    coin. Installing a system is step one. Step two, equally important—some say even
    more important—is to modify the system until all requirements regarding the network
    it is connected to and the other systems in it are fulfilled. The PATH needs to
    be configured to match the approved standards in your infrastructure, catering
    for additional software that is installed on the new machine. syslog needs to
    know what to report and to do so in a way consistent with the rest of your systems.
    Important files like /etc/hosts should contain all the necessary entries to make
    the new system a well-behaved citizen in the LAN. If all these steps are completed
    and tested, you should still take a look at Chapter 7 on security before releasing
    the system in the wild.


    Another aspect worthy of reevaluation comprises the running services on the new
    system. Are there active services not needed for the intended use of the system?
    Does a file server really need a running Web server or an active mail server process?
    Many services that are not necessary for the purpose of the system can be turned
    off during the installation or were not installed in the first place. Sometimes
    one or two of them sneak back on the system; getting rid of unwanted services
    depends heavily on the manufacturer of the operating system. It never hurts to
    check again, just to ensure that only needed services are running on a production
    system.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# 5.2.1 Setting the $PATH


    As already mentioned in the Chapter 1 discussion of the $PATH variable, the order
    of the paths stored in this type of variable is significant. You have to make
    sure that the relevant paths are searched in a specific order to produce deterministic
    results regarding scripts and programs. You should check the given order first;
    it consists more often than not of /bin:/usr/bin. You have to make sure that the
    current directory is not part of the $PATH variable; its representation is a ".".
    Most systems use a set of files to preconfigure the $PATH during the startup of
    the various shells; these files are usually stored in the /etc tree and are named
    /etc/default/login, /etc/login.default, or /etc/.login. You should check the manpages
    of the various shells for which files are actually read. Which shell a user uses
    for the daily work is dictated either by necessity or simply by a matter of taste
    and preference. Because shells are considered a productivity tool, you should
    make sure that all available shells are configured to match the policy inside
    the network. The next part of the $PATH variable is usually the programs in /usr/local/bin,
    if the directory exists. Some *NIX brands "hide" programs like ping in /usr/sbin
    (usually not part of the $PATH of a "normal" user account) because the program
    is not considered necessary for standard system use. The last part should consist
    of directories needed to access installed software like a database, applications,
    monitoring software, etc. It is important to document the relevant paths regarding
    the executables and the libraries needed by the additional software, thus enabling
    you to add the necessary components to the default $PATH variable. This information
    is equally important to ensure that all relevant directories are visited during
    a backup run and to add them to the monitoring scripts (see Chapter 7 for more
    information on this sort of security). Some applications require the initialization
    of specific environment variables to enable the execution of the programs. One
    example would be the Oracle RDBMS. Certain programs that come with the system
    need variables like ORACLE_BASE and SORA_NLS33: the former stores the base directory
    of the RDBMS, the latter the encoding of the used character set. Most other application
    packages require similar variables to be initialized before being able to function
    properly. You have to make the decision whether variables are set by default or
    are set by a script that is used to start the program(s). Another option would
    be the use of skeleton directories and the differentiation of users into certain
    "classes" or "roles." This last approach will work only for new users, though.
    The best approach to solve this question is to consult the manuals of the relevant
    software. The manufacturers usually provide hints which approach should be taken
    and the inherent drawbacks, should they exist. There are other environment settings—and
    files influencing the environment—to consider, but these are heavily dependent
    on the operating system used. GNU-Linux systems normally make use of the files
    /etc/ld.so.conf or /etc/ld.conf.so to enable the runtime linker to point to the
    current libraries'
  merge: -1
