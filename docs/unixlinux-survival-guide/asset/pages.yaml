  md: '# LISTING 2.28 crontab Template


    ```

    # $Id$

    #Min Hour dom moy dow=Su cmd

    #.........................................

    ```


    Given the fact that a crontab is just a text file, all precautions against loss,
    like checking it into rcs, can be used. The latter especially should be done on
    every occasion the file needs to be changed. This approach allows keeping the
    comments in the crontab short and precise and moves the detailed explanation to
    the log file accompanying the revision.


    > Take note that rcs is the name of the package, and RCS (uppercase) is an acronym
    for Revision Control System.


    Using the template, a command supposed to run once a day, every day at 11:00 A.M.,
    regardless which day of the month, which month of the year, or day of the week,
    would be entered as shown in Listing 2.29.


    # LISTING 2.29 An Entry for a Recurring Job in the crontab


    ```

    # $Id$

    #Min Hour dom moy dow=Su cmd

    #.........................................

    0    11   *   *   *   /usr/local/bin/mydaily.sh

    ```


    If a decision is made that it is sufficient for the command to run Monday to Friday,
    the dow "day of the week" parameter should be changed to 1-5. One word of caution,
    though, cron does not know about public holidays and the like; if the result of
    the program requires some sort of user interaction, for example, like changing
    a tape, you have to make sure that either the program is disabled on that day
    or someone is there to do it. The same goes for Daylight Savings Time (DST)—if
    the system is in a country using it, be aware of the fact that the commands scheduled
    during the time shifts twice a year might not execute.


    The preceding syntax will work even on the oldest incarnations of cron. There
    are newer versions of cron available, especially on Linux or BSD systems. This
    "other" cron uses the mentioned syntax and adds three things:'
