- pgno: 133
  md: 'If you think we are exaggerating here, keep this in mind: backup is expensive,
    but losing your data for good is much more expensive. Being in a position to exchange
    a defective tape drive inside the jukebox with the external unit is just an added
    bonus. Even if the maintenance contract covers a replacement of the defective
    unit within 4 to 8 hours, would anyone risk losing the data over the availability
    of a piece of hardware in two to three years time?


    # 4.2.4 Backup Using rcs


    You can use the Revision Control System, part of most *NIX distributions, on the
    installation media, to check in important files. This is no real backup, but is
    a good way to give you some peace of mind.


    There is more than one way to use rcs for the task at hand. Either you could create
    a directory to hold all configuration files put under revision control, modify
    the files in there, and copy them to their desired location after changing them,
    or you could create rcs directories in all places they are needed, for example,
    /etc.


    Do as you prefer, but make sure all files get checked in after every change and
    write a descriptive log message. Everyone will be able to figure out who did what
    and the reason for the change. You can use rlog to display the revision history,
    create a living documentation in that respect. Listing 4.2 demonstrates the use
    of rcs with a configuration file.


    # **LISTING 4.2**  Check In Hosts


    ```

    root@unixhost> ci -l hosts

    RCS/hosts,v  <--  hosts

    new revision: 1.37; previous revision: 1.36

    enter log message, terminated with single ''.'' or end of file:

    >> added alias linuxhost for 192.168.0.2 (Erik)

    >> .

    done


    root@unixhost> rlog hosts

    ...

    ----------------------------

    revision 1.37  locked by: root;

    date: 2004/08/27 04:35:36;  author: root;  state: Exp;  lines: +3 -1

    added alias linuxhost for 192.168.0.2 (Erik)

    ----------------------------

    ...

    ```


    If the change doesn’t work out the way it should have, you can get the former
    working version out of rcs with co -r revision <filename>. The newer version is
    still available from rcs, so you can find out what went wrong and rectify the
    configuration.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 4.2.5 Back Up to Another System


    If you compare the price of a jukebox, a device containing one or more tape drives
    and a mechanism to feed the tapes to them, with a dedicated *NIX system including
    a disk array, chances are the difference is not that big. The dedicated system
    wins often, actually. Backing up to hard drives has a downside, though. They are
    not as resilient as DLT or AIT tapes, and they usually stay in the system.


    This is not to say that it is cheaper to do all backups to hard disks in the long
    run, but if you have files with retention periods measured in weeks, or sometimes
    a month, hard disks might be an option. If that data cannot exceed a certain size,
    or at least shouldn’t, then backing it up to a hard disk could be financially
    viable.


    This approach could prove useful in another respect depending on the type of data.
    Imagine you copy the files of a file server to a smaller, less powerful system
    with the same capacity regarding hard disks on a periodic basis. If something
    bad should happen to the real file server, you could switch to the smaller system.
    It won’t be as fast, but at least you will be able to keep the service up and
    running. The data is only as current as it was during the last copy run, but the
    users can at least access their files. This approach buys some time to recover
    the real system.


    If you are considering this approach, make sure the system you intend to copy
    to is able to deal with the filenames used, 2-byte characters, length of the paths,
    etc. There are more potential candidates than just file servers, though: the index
    files written by the backup software (see Section 4.2.2 earlier in the chapter),
    SCVROOT on the development server, or the data files used by the database software.
    The data files used by the database system can be especially interesting. The
    size of many databases would allow you to store them on much cheaper systems;
    only the lack of processing power and network interfaces prohibits their use.
    One thing cannot be stressed enough, though: this approach enhances the availability
    of the data; it is not a replacement for a real backup. Remember the GIGO principle
    (garbage in, garbage out)?


    This is an example utilizing the concept for enhancing the availability of an
    Oracle database. The database runs on a really big *NIX box; the backup window
    is 4 hours, starting 5 minutes after midnight. You have to create a script to
    mount the directory tree the data files will be saved to via NFS and launch RMAN
    (Recovery Manager), a part of Oracle. RMAN uses its own configuration to run the
    backup and write the resulting files to the NFS mount. The script should unmount
    the backup directories after a successful completion.


    In case of a database error, the directories can be mounted again, and RMAN can
    be used to, for example, recover a corrupt tablespace (A tablespace is kind of
    a virtual filesystem Oracle uses to store tables and indexes, usually distributed
    over a number of so-called data files. These data files are regular files in the
    *NIX filesystem).'
  merge: -1
  img_proc: true
- pgno: 135
  md: '```

    ######################################

    #

    #    file:        oraback1.sh

    #

    #    purpose:     mount nfs-volume and start

    #                 run_rman.sh to perform backup

    #

    #    author:      Erik Keller

    #

    #    parameters:  none

    #

    ######################################


    # Variables


    mount osxbu1:/Volumes/backups/ora_1 /data1/db_bu


    ./HO/scripts/run_rman.sh


    umount /data1/db_bu


    # EOF

    ```


    The script connects the database server with the system osxbu1 by mounting the
    NFS share /Volumes/backups/ora_1 and executes another script to launch RMAN. It
    disconnects the NFS share after completion. The NFS mount could be permanent as
    well, but because it is used only during backup, the connection gets terminated
    for security reasons. This allows for easier maintenance of the backup system;
    even exchanging it is possible without disrupting the operation of the database
    server, because the backup system’s presence is required only during the time
    after midnight. The replacement backup system just needs the same or bigger size
    of NFS share, exposed by the same name.


    Engaging in a deeper discussion about RMAN is beyond the scope of this book. If
    you are using an Oracle database greater than 9i R2 and don’t use RMAN for recovery
    management, take a look at the program. Don’t believe the rumors; the program
    is not what it used to be in earlier releases. It is usable and is an indispensable
    tool if your job is to keep the database up and running.


    # 4.2.6 Cloning the Boot Disk


    There is no way of booting a system if the hard disk containing the operating
    system is damaged. If the data is stored on a separate hard disk, you could replace
    the defective operating system disk and reinstall and restore the contents of
    the OS.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'This is another reason to separate the operating system and the data created
    on the machine, by the way. However, swapping out the defective hard disk and
    reinstalling the OS is time consuming. Wouldn''t it be nice to have access to
    a copy of the boot disk—not a mirrored disk, but a real copy? If you have the
    means to mirror the disks, you should do so, but you should always keep in mind
    that a corrupt file on one of the mirrors is just stored safer in its corrupt
    state, a deleted file is deleted on all mirrors. Remember: GIGO.


    Almost all *NIX-based systems provide the command dd. This program allows you
    to create an exact clone of a hard disk, provided the target hard disk is either
    the same type or at least of the same size. One of the best approaches to increase
    the availability of a system is to mirror the boot disk and to have a duplicate
    of it. If you are not able to use this approach, for example, because of budgetary
    constraints, then you should at least try to have a duplicate of the boot disk
    available. The cost of hard disk space is going down constantly; the expenditure
    for another hard disk should fit into even the tightest budget. After the system
    is installed and configured, take the following steps to create a copy of the
    boot disk:


    +   1. Find out which device points to the boot disk. df gives you a listing of
    the mounted partitions. Pretend the boot disk is on /dev/dsk/c0t3d0. The target
    disk is not mounted; thus you have to know which controller and which ID to use.
    In Solaris, you could use format to display a list of all known and responding
    hard disks. The first part of the listing displays all available hard disks. You
    assume there is a responding hard disk at /dev/dsk/c1t1d0. You have to make sure
    that there is nothing of value on the disk because the next command overwrites
    the whole disk!

    +   2. To copy the contents of the boot disk bit by bit, you need access to the
    disk as a whole. *NIX usually uses the slice 2 tag—backup for that purpose. Please
    check the documentation for your kind of *NIX to see if your OS uses the same
    approach. Switch the system into single user mode (init S) to minimize the activity
    on the disk. To access the disks, the so-called raw device is used, /dev/rdsk/.
    So the command would be as follows: dd id=/dev/rdsk/c0t3d0s2 of=/dev/rdsk/c1t1d0s2.
    When the command returns, the following will have taken place: a complete copy
    of the hard disk on controller 0, target 3, device 0 will have been written to
    the disk on controller 1, target 1, device 0.

    +   3. The next step varies depending on your decision either to leave the copy
    in the system or to remove the disk and swap it in case of an error. If the latter
    is the case, you are more or less set; the copy contains everything you need to
    boot the system. If the copy should remain in the system, to avoid swapping hard
    disks, entries in /etc/vfstab or /etc/fstab, depending on the OS, need to be changed.
    Mount the copy into a directory using mkdir'
  merge: -1
  img_proc: true
