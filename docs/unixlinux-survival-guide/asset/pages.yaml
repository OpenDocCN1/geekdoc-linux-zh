- pgno: 46
  md: 'is; otherwise, it would create the file TODO.txt,v in the directory RCS and
    delete the original. To get it back, you would have to execute the command co
    TODO.txt.


    The latter approach is fine while working with a team of programmers or fellow
    system administrators, but for the purpose of developing for yourself, it is easier
    to keep the files handy. The moment the file is "unlocked," it becomes writable
    for other programmers, provided they have access to the RCS directory (if one
    of those programmers chooses to work with the file, the file is properly locked
    again while that programmer works on it). This mechanism allows multiple programmers
    to work on the same files without overwriting changes introduced by others. If
