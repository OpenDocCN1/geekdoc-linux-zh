- pgno: 292
  md: '# Appendix D About the CD-ROM


    The CD-ROM contains the more elaborate scripts shown in the book. Thus, they do
    not need to be typed. Although, keep in mind that it is sometimes easier to understand
    a script when you type it instead of just copying the contents to the disk.


    # OVERALL SYSTEM REQUIREMENTS


    Perl version 5.x or greater (the scripts should run on earlier versions but were
    not tested on them).


    Java Runtime Environment (JRE) 1.3 or newer for the DocBook example.


    The scripts should run on any more or less current *NIX-based operating system
    because they use functions and commands that are used by the system itself. In
    short: if *NIX runs on a system, so will the scripts.


    The following sections contain lists of the files to be found in the corresponding
    directory on the CD-ROM.


    # FIGURES


