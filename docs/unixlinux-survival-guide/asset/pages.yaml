  md: 'location in the document. If you want to go to line 1, 1G is used, and to go
    to the end of the document, G alone initiates the jump. If you want to jump to
    the beginning of the current line, you could use 0 instead of the cursor keys
    and $ to jump to the end of the current line.


    # A.4.2 Delete and Change


    The vi editor interprets w (word) as extension of a command. If you input dw (delete
    word), vi will delete a word starting from the current position of the cursor
    until it reaches the next blank or Tab character. If you would use d$, the contents
    of the current line starting again from the position of the cursor to the end
    of the line will be erased. d0 does the same but to the beginning of the line.
    Therefore, you can even use the jump commands to delete parts of a document. The
    command dG deletes everything from the current position of the cursor to the end
    of the document, and d1G deletes everything from the current position of the cursor
    to the beginning of the document. If you want simply to delete the current line,
    you could use the command dd. This command can be extended by using a number;
    5dd deletes the current line and the next four lines, if they exist.


    If you just need to change a word, you could use the command c (change). You need
    to position the cursor on the first character of the word or at the position inside
    the word where the change should start and use the command cw (change word). The
    editor will switch to input mode, and you will be able to overwrite the word starting
    from the current position of the cursor up to the next blank or other delimiter
    recognized by vi. If you want to overwrite the current line starting from the
    cursor position to the end, you could use c$, and if you want to overwrite the
    current line starting from the cursor position to the beginning of the line, you
    could use c0. Pressing the Esc key ends the replacement mode.


    Because all the mentioned commands are destructive, you should always remember
    that you are able to press u (undo) if you should change your mind after the replacement.
    The undo function works on almost every command of vi that changes the document.


    # A.4.3 Global "Search and Replace"


    One thing needs a more exhaustive explanation when using vi and following the
    logic of the program. The command s/old_word/new_word/g substitutes old_word with
    new_word in the current line only and not in the whole document as the g (global)
    switch seems to indicate. To do a real global "search and replace," you need to
    use the command shown in Listing A.13.'
