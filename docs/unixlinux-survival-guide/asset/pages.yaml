- pgno: 233
  md: '# 7.3.4 Testing a System with nmap


    A warning first: before using nmap you have to make sure that using it is not
    a punishable offense wherever you are. This is not a joke; it is a serious threat
    to the security community as a whole. Some are trying to outlaw the use and even
    the possession of that kind of software. Normally it is no one’s business what
    you do with your systems or the systems you are responsible for, respectively.
    However, be clear; running nmap against a system you do not own can result in
    jail time.


    So what is nmap used for? The program can be used to map an existing network by
    scanning it for active IP addresses or to test active IP addresses for open ports,
    among other things. The two uses mentioned could be combined into one scan, as
    well. Now, it should be obvious why this program can pose a real threat to the
    security of a company. On the other hand, nmap has received numerous awards and
    recommendations in the security community for being one of the best programs to
    monitor the network you are responsible for. Many large companies use the program
    to monitor their networks on a constant basis—in one case even involving a network
    of over one million IP addresses. The company in that example uses a dedicated
    machine with a couple of network cards, though.


    If you need to check whether a certain system or a range of systems is available,
    you could use the program as shown in Listing 7.16.


    # LISTING 7.16 Listing the Available Machines in an IP Segment Using nmap


    ```

    root@unixhost> nmap -sP 192.168.0.1-254


    Starting nmap V. 3.00 ( www.insecure.org/nmap/ )

    Host (192.168.0.1) appears to be up.

    Host linuxhost (192.168.0.2) appears to be up.

    Host osxhost (192.168.0.3) appears to be up.

    Host unixhost (192.168.0.5) appears to be up.

    Host cvs host (192.168.0.200) appears to be up.

    Nmap run completed -- 254 IP addresses (5 hosts up) scanned in 6 seconds

    ```


    The option -sP instructs nmap to contact every address in the range of 192.168.0.1-254
    in different ways. If there should be an answer, then the IP address is appended
    to the list. If you need to run such a scan, make sure to talk to the people responsible
    for security first. This kind of scan will show up on most firewalls and IDS (Intrusion
    Detection System), thus triggering an alarm.


    If you need to scan a single system for open ports, you could use the program
    as shown in Listing 7.17.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# LISTING 7.17 Port Scan Using nmap on a Single Host


    ```

    root@unixhost> nmap -P0 -v -v 192.168.0.3


    Starting nmap V. 3.00 ( www.insecure.org/nmap/ )

    No tcp,udp, or ICMP scantype specified, assuming SYN Stealth scan. Use -sP if
    you really don''t want to portscan (and just want to see what hosts are up).

    Host osxhost (192.168.0.3) appears to be up ... good.

    Initiating SYN Stealth Scan against osxhost (192.168.0.3)

    The SYN Stealth Scan took 852 seconds to scan 1601 ports.

    Interesting ports on osxhost (192.168.0.3):

    (The 1600 ports scanned but not shown below are in state: filtered)

    Port      State    Service

    123/tcp   closed   ntp


    Nmap run completed -- 1 IP address (1 host up) scanned in 852 seconds

    ```


    The option -P0 instructs nmap not to test the availability of the indicated system
    by sending an ICMP packet, and -v -v tells the program to be extremely talkative,
    which means the program''s output contains more detailed information. Because
    no specific scan was indicated on the command line, the program performed a so-called
    SYN scan. This means that the program sends certain packages to the system, trying
    to convince it to answer in a certain way. If this certain answer is received,
    then the tested port is open. The program reported one open port of 1600 tested
    ports in Listing 7.17. In that case the reason is that the machine uses a firewall
    that limits packets to port 123 (NTP) to certain IP addresses and blocks everything
    else.


    Another use of the program (most ISPs use this feature) is to determine the operating
    systems connected to the network with the help of the -O option. Listing 7.18
    shows an example.


    # LISTING 7.18 Using nmap to Reveal the Operating System Used (1)


    ```

