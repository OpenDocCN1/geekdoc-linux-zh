- pgno: 270
  md: '# Appendix A One Liners


    One liners are a collection of handy commands and programs, some longer than one
    line. The commands shown are extracts taken from the author’s files containing
    interesting or handy uses of the commands. Some entries are in these files because
    the author cannot or will not memorize the syntax. Every system administrator
    should create files containing interesting programs and commands, giving the right
    wording in the explanation. The files are even searchable with grep.


    > "NIX isn’t about knowing every option in every command, but knowing where to
    look," one of the author’s teachers used to say.


    One other thing—some of the actions and examples found in the following sections
    can be executed via some sort of GUI. The beauty of knowing how to achieve the
    same results on the command line not only translates into a certain independence
    from those GUIs but also enables the system administrator to execute them from
    a PDA or cell phone with a vt100 emulation.


    # A.1 SHELL COMMANDS


    The following commands should work more or less on every brand of *NIX.


    # A.1.1 Finding and Deleting Core Files


    If a program on a *NIX system should crash—this can happen, even on *NIX—then
    the kernel creates a so-called core file. It contains an image of the kernel during
    the time of the crash. This information is very interesting for the developers
    of the program, but of limited use for a system administrator. The command shown
    in Listing A.1 searches the disk for these files and removes them after asking
    for permission.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# LISTING A.1 Finding and Removing Core Files


    ```

    root@unixhost> find . -name core -exec file {} \; -exec rm -i {} \;

    ```


    The chain of commands shown starts to search from the current directory downward
    for files named core, shows which program created them, and asks for permission
    to delete the files.


    # A.1.2 Finding Directories Consuming Disk Space


    If a volume starts to fill up, then it is interesting to find out which directories
    consume the most disk space. Listing A.2 shows how to display and sort the directories.


    # LISTING A.2 Display Directories by Size, Sorted


    ```

    root@unixhost> du -sk * | sort -nr | more

    1143704 usr

    1033478 export

    407870 proc

    381438 var

    17689 sbin

    14846 platform

    13566 kernel

    4246 etc

    1529 dev

    1 opt

    1 nsr

    ...

    ```


    The command du uses the following options in Listing A.2: -s for summary, to sum
    up the underlying directories instead of displaying them one by one, and -k to
    use KB as size unit. The use of -h (nicknamed human readable) would render the
    result useless for sorting because sort would not know that a number with an appended
    "G" is bigger than number with an appended "M." The command sort uses the options
    -n to switch from alphabetical sorting to numerical sorting and -r to reverse
    the result. This means the highest numbers are the first to show up in the output.
    Whether or not the command more needs to be used is dependent on the anticipated
    number of directories in the output. If the result contains more lines than the
    maximum number of lines displayable in the terminal window, then the biggest consumers
    of disk space scroll off the top of the window. The directory names /opt and /nsr
    are symbolic links; they point to other locations on the same or another hard
    disk. Using the command as shown allows you to display a quick rundown of which
    directory uses the most space on the hard disk.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# A.1.3 Who Is Accessing This File?


    As long as a file or directory is accessed by a user or a process, that directory
    or file cannot be deleted, nor can the volume it is stored on be unmounted. So,
    one question often asked by system administrators is, "Who is using this file
    or directory at the moment?" Most NIX systems provide the command fuser to answer
    this question (see Listing A.3). It allows you to identify the number of the process
    accessing the file or the directory at the moment. If the number of the locking
    process is known, then using a command like ps reveals the user account running
    said process.


    # LISTING A.3 Using fuser


    ```

    # fuser admintrans

    admintrans: 951c 938c

    # ps -ef | grep 951 | grep -v grep

    silvied 951 938 0 12:13:49 pts/5 0:00 vi monthlyreport.txt

    # ps -ef | grep 938 | grep -v grep

    silvied 938 929 0 12:13:13 pts/5 0:00 /bin/sh

    silvied 951 938 0 12:13:49 pts/5 0:00 vi monthlyreport.txt

    ```


    Two processes are accessing the directory admintrans in Listing A.3: 951 and 938.
    The letter c means that admintrans is also the current directory ($PWD) of these
    processes. If you need to find out who owns theses processes, you can use the
    command ps filtered with grep. It becomes obvious that the user account silvied
    used vi to access the file called monthlyreport.txt and that the process was started
    from /bin/sh. Listing A.4 demonstrates the use of fuser in a device context.


    # LISTING A.4 Using fuser with a Device


    ```

    root@unixhost# df -h

    Filesystem Size Used Avail Use% Mounted on

    /dev/dsk/c0t3d0s0 1.5G 1.2G 279M 81% /

    /dev/dsk/c0t3d0s1 482M 373M 61M 86% /var

    swap 533M 32K 533M 1% /var/run

    swap 533M 312K 533M 1% /tmp

    /dev/dsk/c0t3d0s7 1.5G 1010M 404M 72% /export/home

    root@unixhost# fuser /dev/dsk/c0t3d0s7

    /dev/dsk/c0t3d0s7: 1047c 1002c 1001c 951co

    ...

    ```


    The use of the command fuser allows a system administrator to find out who is
    using a file or directory at the moment or which account currently holds a lock'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# A.1.4 How to Truncate a Log File?


    Sometimes you need to truncate a file. This means to empty the file without deleting
    it from the hard disk. A possible reason for this requirement might be the fact
    that a program writing to the file cannot be terminated and deleting the file
    would interrupt the program. That program would lose the link to the file if it
    gets deleted and would thus stop writing to it. You can use the command shown
    in Listing A.5 to truncate a file.


    # LISTING A.5 Truncate a File


    ```

    root@unixhost> cat /dev/null > /var/log/authlog

    ```


    You should be aware of the fact that the contents of the file are lost, though.
    If you copy the contents into another file first, then the command could be used
    to manage the size of log files, for example. You just need to make sure that
    the command to copy the contents and the command to truncate the file are executed
    in close succession; you could lose valuable data otherwise.


    # A.1.5 How to Find the Libraries a Program Requires?


    If you should need to know which libraries a program needs to work, to copy that
    program to another system, for example, or in case you receive an error message
    about missing libraries, you could use the command ldd to determine what is required.
    Listing A.6 demonstrates the use.


    # LISTING A.6 Identifying the Required Libraries with ldd


    ```

    root@unixhost> ldd /usr/sbin/fuser

    libkstat.so.1 => /usr/lib/libkstat.so.1

    libc.so.1 => /usr/lib/libc.so.1

