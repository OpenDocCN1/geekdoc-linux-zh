  md: '# 7 Security


    # In This Chapter


    +   - General Thoughts

    +   - File Security

    +   - System Security

    +   - Network Security

    +   - Security Policies


    Security has always been on the agenda of every system administrator, even more
    so since the Internet changed from being a network of computers primarily inside
    research institutions to the global grid it is known today. Virtually every system
    connected to the Internet is able to access every other machine via this connection,
    regardless of geographical distance. It is a known fact that not every system
    connected to the Internet has the best interest of the other netizens in mind.
    Sometimes it is necessary, though, to find the right arguments justifying the
    increased budget to make sure all security precautions are on a current technical
    level. This chapter contains a discussion about the different approaches to security.


    > Securing a system or a network requires extensive knowledge and experience.
    Both can be acquired, but the infrastructure an administrator is responsible for
    cannot be used increase the knowledge or gain experience. It is not possible to
    become a'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'security specialist by reading a book. You should get the support of a security
    professional if there is any doubt about the state of the systems or the network
    regarding their security status.


    To increase your knowledge about the subject of security, you should try to obtain
    as much information as possible, whether by reading books or searching the Internet.
    The best approach is to concentrate on one specific area and to test and research
    extensively. Gaining knowledge and experience is (a rewarding) part of the progression
    to a professional status.


    The following is a list of tried and proven security rules:


    +   - No expectations

    +   - No one and nothing is to be trusted

    +   - Nothing is secure

    +   - Security impacts usability

    +   - A healthy paranoia could save the day


    This list does not contain a single exaggeration. It contains the ground rules
    of security.


    The hints and techniques in the following chapter cannot guarantee a secure environment.
    They are meant to be taken into consideration to achieve a certain state of security.
    A secure environment needs daily maintenance and constant alignment to maintain
    the status quo.


    # 7.1 GENERAL THOUGHTS


    The most impressive security measures are completely useless if the internal customers
    (the users of the systems) are not aware of the reasoning behind them. Most users
    consider security as something that "gets in the way," forcing them to remember
    new passwords after a certain period of time, and prohibits them from installing
    the latest add-ons to their Internet browsers, basically taking away the ability
    to control their systems. The best security policy (see Section 7.5, "Security
    Policy") will be ineffective if the users cannot understand why it is in place.
    There are companies whose system administrators have decided to go from securing
    the machines to damage control only. These system administrators are not willing
    to cope with the constant flow of complaints relayed to them via upper management
    by their users any more. The complaints are similar to this: "It is not possible
    to work without (insert the latest software/add-on/extension to the system)."
    The impact on the morale of the security team is too much. The crucial oversight
    here: the security department forgets to keep the upper management informed (see
    Section'
  merge: -1
  img_proc: true
- pgno: 214
  md: '3.3.7, “Management Relations”). Needless to say, if something should happen,
    the security team is to blame.


    The administrators should try to keep their users current about the possible consequences
    of a security breach. They need to be told about known insecurities of certain
    operating systems and the speed with which a virus is able to infect a system
    by simply opening an e-mail. The best approach to raise awareness is periodic
    training or lectures about known threats. These lectures are not supposed to overwhelm
    the users with technical specifications, but to train them about basic security
    measures and how they are able to profit from obeying the security policies. If
    the schedule of the system administrators does not allow them to conduct the trainings
    themselves or the administrators lack the necessary skills to do the training,
    an external consultant should be hired, thus allowing the administrators to learn
    how to do it first-hand. During a security conference, about a hundred members
    of upper management, coming from various companies, were shocked to the core as
    a security consultant demonstrated how to compromise a current Windows system
    in a matter of minutes and how to use it to send out a huge number of unsolicited
    e-mails. Mind you, that system was not present at the location the conference
    took place, but was sitting on a desk at a security firm at the other side of
    the country. An employee of that security firm discovered the Trojan after opening
    an e-mail on this machine and took the time to investigate its functionality.
    The question comes to mind, “How did the virus get into the network in the first
    place?” The machine in question was a laptop; the employee used this system to
    check his private mail account as well—using the same software. Again, examining
    a virus or Trojan should be done only by a trained professional.


    Another eye-opener for the managers present was the demonstration of a Trojan
    that survived a reboot and became active again once the operating system was up
    and running again. The program survived a reboot because of some clever programming;
    it could be thrown out of the system only by shutting the system down and waiting
    for at least 30 seconds before powering it on again. Programs like this are not
    widespread at the moment because their creation requires a very deep knowledge
    about the underlying hardware, but there is no way of knowing if and when the
    situation might change for the worse. You need to be careful!


    As responsible system administrators, you should monitor Web sites like the “Internet
    Storm Center” at http://isc.sans.org or “SecurityFocus” at http://www.securityfocus.com
    on a daily basis and thus sparing you a lot of trouble. If you are aware of a
    threat, you can do something about it. Keeping track of all published vulnerabilities,
    security breaches, and general insecurities regarding the various operating systems
    can be frustrating, even if the biggest part of them does not concern *NIX. However,
    there are other operating systems, and they usually are part of the same network.
    If there is a reason to act on a certain information, then you should keep a clear
    head, inform management and the users (the order depends on the'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'severity of the threat), and take the necessary precautions. If the precautions
    include blocking a certain port on the network and thus rendering a service used
    inside the network not operational, then you should do your best to explain the
    situation, get an approval from upper management, and proceed. The only thing
    left is to wait for the manufacturer of the affected software or hardware to deliver
    a patch or upgrade. If your users are not able to work without access to this
    special port, then you have to try to make a concise risk assessment, present
    the findings to upper management, and wait for a decision (ideally with the port
    in question or the affected software blocked). You have to contact the manufacturer
    to find out about possible solutions at the same time. Should the manufacturer
    prove unwilling to work with you on that situation—whether it be a simple denial,
    the promise to deliver a patch somewhere in the not too distant future without
    any suggestions to hold the situation at bay for the time being, or, even worse,
    the admittance that the problem exists but "There are so many systems on the Internet,
    chances are slim that you will be affected by this threat"—then it is time seriously
    consider switching manufacturers. The future of the company might be at stake,
    and you have to have a partner you can rely on. A pending security issue is the
    best test if your partner in this situation—the manufacturer of the software or
    hardware—is willing to cooperate. If that should not be the case, then you should
    think about moving on.


    One more word about the often cited "The Internet is huge; why should we be the
    target of an attack?" rationalization. The author''s firewall fends off attacks
    in the 400 per day range at this very moment, on a DSL connection. Think about
    the possible threat to a published IP address. You always have to ask yourself,
    "Are you willing to guarantee the security of 50+ computers you cannot control
    all the time?"


    You should also try to work with your users regarding those issues. You should
    try to explain to them the virtues of a password that has to be changed on a regular
    basis, make them understand that this system is for their protection as well.
    Their business contacts wouldn''t be very pleased to receive unsolicited e-mail
    originating from their accounts, would they? If the e-mails contain messages of
    questionable wording, or even worse, contents that might be a punishable offense
    in certain areas of the country, then all users can understand that security is
    something to be taken very seriously. The same holds true for the passwords used.
    Using the name of the spouse, the pet, or the children is not a good password
    scheme. You need to explain to users that crackers are using so-called dictionary
    attacks to break passwords. This means they try to test the passwords using words
    found in dictionaries of all kinds and subjects. These dictionaries contain names
    as well. Some of the dictionary files circulating on the Internet contain more
    than 400,000 words, including the Latin terms for insects, animals, etc. So even
    the most clever scheme of medical terms used as passwords can be broken. The creation
    of a solid password scheme requires more than a dictionary. Also, if someone manages
    to be in front of'
