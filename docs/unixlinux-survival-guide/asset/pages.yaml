    system (see Section 3.2.2 "Configuring syslog.conf"). As long as you can rely
    on the fact that every process in need is able to send a message to the administrator
    of the system, the files written by syslog are the premier place to look for hints
    if you suspect problems with the machine.


    The directory the files are stored in is usually /var/log. Solaris uses two directories
    for that purpose, /var/adm and /var/log. Most messages should end up in a file
    called either messages or system.log, depending on the configuration. You should
    make it a habit to periodically issue the command shown in Listing 3.34.


