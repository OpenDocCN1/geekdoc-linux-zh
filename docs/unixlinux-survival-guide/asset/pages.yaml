  md: '# Appendix C Internet


    Because the Internet is always changing, there is a slight possibility that some
    of the links listed in Table C.1 might cease to exist. Nevertheless, what follows
    is a list of links, in no particular order, the author uses on a day-to-day basis.


    # TABLE C.1 Useful Internet Links


    | URL | Remarks |

    |---|---|

    | http://www.sage.org | The System Administrators Guild |

    | http://www.usenix.org | The Advanced Computing Systems Association |

    | http://www.sun.com/bigadmin/ | The top admin portal for all Solaris users |

    | http://isc.sans.org | The Internet Storm Center at sans.org |

    | http://slashdot.org | The place to be for news about IT and science in general.
    Their motto is "news for nerds, stuff that matters." Expect to find lively discussions
    about the incoming news, not always polite in wording, but very interesting. Some
    of the people who wrote the operating systems covered in this book are present
    as readers and sometimes even raise their voices to give their opinion on a certain
    subject. |

    | http://www.securityfocus.com | Many interesting articles about security; the
    level spans from beginner to pro. |

    | http://www.macoshints.com | Hints and tips for the users of Apple''s BSD-based
    operating system. |

    | http://www.iana.org/assignments/ipv4-address-space | Information on who maintains
    which IPv4 address range in the Internet. |

    | http://www.iana.org/assignments/port-numbers | Well-known (0–1023) and registered
    ports (1024–49151) |'
