- pgno: 274
  md: '# A.1.6 How to Change the Case in Filenames


    If you should need to change the names of files or directories to be all lowercase
    or all uppercase, for whatever reason, then the command shown in Listing A.7 could
    be used.


    # LISTING A.7 Changing All Names to Lowercase


    ```

    erikk@unixhost:> for i in `ls`; do mv $i `echo $i | tr ''[A-Z]'' ''[a-z]''`; done

    ```


    The for loop uses the command ls to get a list of all the names, be it a file
    or directory. The output of ls is fed into i with the help of the backticks. For
    every name found, the command mv is used to change all characters to lowercase
    by using the output of echo fed into tr (translate) for changing the case of the
    letters A to Z. A file named ThisText.txt will be changed to thistext.txt. The
    regular expression ''[A-Z]'' ''[a-z]'' takes care of all uppercase characters
    and transforms them into lowercase.


    # A.2 SOLARIS SPECIFIC


    This section contains two hints for Solaris administrators.


    # A.2.1 prstat


    A program named prstat is part of all newer Solaris distributions. Its output
    is similar to top, but it cannot be used in an interactive way like top, unfortunately.
    If you should have no means to install top on a Solaris machine, then you could
    use prstat instead. The program is mentioned here because not too many Solaris
    users are aware that the program even exists.


    # A.2.2 Registering Solaris Systems


    One remark regarding this hint: you should register your Solaris systems with
    Sun Microsystems. But if you have to roll out a considerable number of systems,
    then registering every single system while installing the operation system is
    time consuming at best. You should register all systems in one go with the manufacturer
    instead. Listing A.8 shows how to switch off the registration program.


    # LISTING A.8 Disabling the Registration in Solaris


    ```

    root@unixhost> cat DISABLE=1 >> /etc/default/solregis

    ```'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'Again, the systems should be registered; the command in Listing A.8 shows how
    to avoid doing this on every single system during a rollout of 200+ systems, for
