    Examining the output in Listing 1.26 shows that there was just a case of heightened
    activity. Judging the cumulative values sampled over a period of ten minutes indicates
    nothing serious so far. The -s and -e options are used to narrow the window of
    data to be displayed to the time period of 1:00 P.M. to 2:30 P.M. on that day.
    You will find out more about sar in Section 3.1.6, “Monitoring the CPU.”


    # 1.2.5 Create a List


    One of the first things that comes in handy to you when working with a system
    is a listing of all files on a specific machine. You have more than one way to
    accomplish getting that list, but nothing beats a text file, which can be “greped”
    in case of need. The command shown in Listing 1.27 can be used to create a list
    of files, spanning all mounted volumes.


    ```

    root@unixhost:> cd /

    root@unixhost:> find . > flist.txt

    ```'
