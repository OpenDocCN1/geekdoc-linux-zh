    # 3.2.5 What Is a Group?


    A group in *NIX fulfills the same purpose as in the real world. It contains people
    or user accounts in *NIX sharing a common goal or purpose. If a user needs to
    access a certain file, but is not the owner of that file, then it is sufficient
    for that user to be a member of a group that has the necessary access right to
    the file. Every user is a member of at least one group. Which group a user is
    a member of is a decision made by the administrator during the creation of the
    account. This group is the so-called primary group. Membership in additional groups
    is optional and heavily dependent on the activities a user should perform while
    using the account, for example, being a member of the group with execution rights
    for the database maintenance software.'
