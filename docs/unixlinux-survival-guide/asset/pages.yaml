    # A.A.4 Using Abbreviations


    The vi editor was created by programmers for programmers. It contains some features
    to speed up the insertion of text blocks due to its heritage. One of the features
    is the use of so-called abbreviations. If you start vi and type the string in
    Listing A.14 without changing into insert mode, you create such an abbreviation.
    If you are done creating the abbreviation, you close the input by hitting the
    Enter key.


    # LISTING A.14 Definition of an Abbreviation in vi


    ```

    :ab FROBOZZ FroBozz: We make programming less work more pleasure

    ```


    If you would switch to input mode via i now and would type the string FROBOZZ
    and a blank, vi would replace that string with the string FroBozz: We make programming
    less work more pleasure. You can create shortcuts for phrases and sentences you
    need to use more than a couple of times in a document. The system also works for
    programming constructs or XML tags: :ab PARA <para></para> will replace all occurrences
    of PARA with <para></para>. The downside of this system is the fact that you will
    not be able to use the string PARA in the document anymore. You need to exercise
    care when choosing the handle for the abbreviation for that reason and should
    not use words or acronyms you might actually need to write in the document.


    This poses the question of how this system could save time—if you have to retype
    the abbreviations every time vi is started again. The vi editor provides two ways
    to make the abbreviations available without the need to type them in repeatedly.
    The program searches for a file named .exrc in the $HOME directory of the current
    user, or you load such a file by using the command :so <filename> after launching
    the program. Listing A.15 shows how such a file could look.


    # LISTING A.15 Abbreviations for Perl'
