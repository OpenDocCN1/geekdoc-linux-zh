  img_proc: true
- pgno: 239
  md: '# LISTING 7.20  Configuration File for sshd (Excerpt)


    ```

    ...

    #Port 22

    #Protocol 2,1

    Protocol 2

    #ListenAddress 0.0.0.0

    ...

    # Logging

    #obsoletes QuietMode and FascistLogging

    #SyslogFacility AUTH

    #LogLevel INFO

    ...

    # Authentication:


    #LoginGraceTime 120

    #PermitRootLogin yes

    PermitRootLogin no

    #StrictModes yes

    ...

    X11Forwarding yes

    #X11DisplayOffset 10

    ...

    ```


    There is much more to configure than the lines shown in the listing. The configuration
    of sshd reads as follows: lines starting with # are comments. If such a line contains
    a setting, then the setting shown is the default, usually compiled into the program.
    Some entries in Listing 7.20 are more important than others; these entries are
    shown in bold. The first setting to check is protocol. This setting governs what
    protocols will be accepted to establish a connection. The commented line contains
    the default 2,1. This means that the program tries to establish a connection using
    the protocol type 2 first; should this fail, it allows you to use protocol type
    1. This setting was changed to Protocol 2. Protocol type 1 is considered insecure
    and should not be used anymore. The configuration file on Solaris systems already
    contains a warning that the type 1 protocol will be depreciated in the not too
    distant future. The next line of interest is SyslogFacility AUTH (see Section
    5.2.2, “Configuring syslog.conf”). This line establishes the fact that the program
    is able to write log files using the syslog facility of the system and that the
    log entries usually start at info. If there are messages with a higher level,
    then these messages will be written to other log files as well, according to the
    configuration of syslog. The value of PermitRootLogin should always be no, provided
    there are no really good reasons to allow root logins. It is not possible to log
    in using the root account with this setting in place. This ensures that a “lost”
    root password cannot be used to con-'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'nect to the system from the outside. If you want to work as root on the system,
    you have to log in as a normal user and change to root when authenticated on the
    system. As convenient a straight root access may be, you should turn this setting
    off if possible. The last setting, X11Forwarding yes, allows you to use ssh to
    connect an X11 server to the machine and use GUI applications stored on the remote
    machine. This setting is sometimes considered insecure.


    The file ssh_config contains the configuration for the client program ssh. It
    does not contain as many settings as the server. ssh is used to connect to a server
    running sshd. The only thing to check here is the protocol setting; you should
    not allow the program to use protocol type 1 as well. The program uses the file
    in the following manner: if an option was not set on the command line, then the
    program tries to find the setting in $HOME/.ssh/. If the setting could not be
    found in there, the setting in the general ssh_config file is used.


    Listing 7.21 demonstrates the use of ssh to connect to a remote system.


    # LISTING 7.21 Login Using ssh


    ```

    erikk@osxhost:~$ ssh -X 192.168.0.2

    erikk@192.168.0.2''s password:

    Last login: Wed Sep 15 15:33:12 2004 from osxhost


    erikk@linuxhost:~>

    ```


    Because the option -l was not used, the name of the current user is used as account
    name, and the -X option enables X11 forwarding. It is possible to start X11 programs
    on the remote host and display them locally. Regarding the login shown in Listing
    7.21, the X Window would appear on the machine osxhost while the program runs
    on 192.168.0.2.


    The second client program is scp. It creates an encrypted connection to transfer
    files between the systems. This program replaces the rcp command. Listing 7.22
    demonstrates its use.


    # LISTING 7.22 Transferring a File Using scp


    ```

    erikk@unixhost:~$ scp base_netconns.log.040831 \

