    If you don’t feel comfortable using the command line, use the GUI and examine
    the resulting configuration when time permits. If the GUI allows you to lock down
    the system in a way that seems sufficient, then the work is done. If not, rest
    assured that there is no black magic involved in configuring firewalls. Try to
    gain a basic understanding and verify the results on your test system.


    # 7.4.7.2 Firewalling the Inside of the Network


    The configuration of most firewalls allows every connection to be established
    if the connection originates from the inside of the network. Most firewalls allow
    you to configure rules for the connections from the inside to the outside as well.
    Therefore, you are able not only to put rules on the connections from the outside,
    but also to apply rules to connections from your computers. You should make use
    of this capability. If you create a list of allowed ports that can be used from
    the inside your network and you test those rules on the test system to ensure
    that they are working, why not lock the door for all other ports? If there is
    an outbreak of a virus or Trojan program, then the virus or Trojan either needs
    to know which ports are open to establish a connection to the outside world or
    fails miserably and triggers an alarm that indicates the infected machine. Securing
    your system in this way is worth investigating.


    # 7.5 SECURITY POLICY


    A well-formulated and well-planned security policy, enforced companywide, is the
    best prerequisite to create a secure infrastructure. As simple as it may sound,
    it is the best approach to be taken toward a more secure IT environment. Many
    users put too much emphasis on “personal” in “Personal Computer.” This does not
    mean that the owner of a computer should not be able to do what he wants with
    the system. However, things get a little more complicated if that system is part
    of a company network, and the user is not the “owner” of the system. No one would'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'come up with the idea to change the software of a calculator or update the
    coffee machine with a new shiny GUI. The former might make the results of the
    calculator non-deterministic, and touching the coffee pot could trigger a revolution
    inside the IT department.


    Seriously though, the main difference between computers and calculators or typewriters
    is the fact that computers can do much more than those accessories. But the way
    a number of software manufacturers include some kind of “self-healing” intelligence
    into their programs could change operating systems in a non-deterministic way
    by downloading updates from the manufacturer’s site without asking the user or
    the IT department for permission. The resulting confusion, including the loss
    of valuable data, is blamed on the IT department afterward.


    One of the primary causes of non-working computers has not even been mentioned
    until now: the installation of untested software, obtained from unknown sources,
    on the company-supplied computers. And a lack of stability regarding the systems
    is the least of all problems in that respect. The installation of untested software
    is the quickest way to introduce a virus, Trojan, or spyware into the company
    network. As funny as the latest PowerPoint presentations containing cartoons might
    be, from a security point of view, they can be nightmare.


    A consistent security policy, taking the mentioned problems into account, is a
    step in the right direction for every company, provided there are not too many
    exceptions to the rules. To make one thing very clear, a security policy is not
    a tool to hassle the users; it is a tool to improve the security. A good sense
    of proportion allows a sound security policy without tormenting the users. You
    need rules governing the allowed and the forbidden actions concerning the computers.
    These rules need to be applied to the manufacturers of the operating systems and
    the programs as well. Patches and upgrades installed behind the back of the users
    and the IT department destabilize the infrastructure you, as system administrators,
    are responsible for.


    A sound security policy should consist of different modules, and it may well be
    that a monolithic block of rules is not needed or wanted. The same approach to
    the subject is the same as that used for building a good network infrastructure.
    You define what services should be available and create the interfaces. Next,
    you determine how to secure those services and what types of use are acceptable.
    Using this information as a base for a sound security policy is a good starting
    point. You should never try to tackle all issues at once:


    +   - Policy for outside access to the company network

    +   - Policy for using e-mail

    +   - Policy for securing the place of work

    +   - Policy for the installation of software on the workstations'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'This list could go on forever. You should start with topics that are already
    governed by some sort of rules and try to formulate them more precisely. The creation
    of new policies should be easier after tackling the existing topics, if you learn
    from experience.


    # 7.5.1 Why a Good Security Policy Needs to be Platform Independent


    The structure of a security policy should be formulated as platform independent
    as possible. For example, software, updates, and patches have to be cleared with
    the IT department prior to installation. If a simple policy like that gets watered
    down with exceptions for seemingly "secure" systems or platforms, then Pandora''s
    box is already wide open, and arguments like "But the manufacturer says that the
    patch needs to be applied at once to increase security" are hard to conquer. You
    have to draw the line somewhere. Adhering strictly to the stated rules means more
    work for the IT department. On the other hand, if the IT department knows what
    it is doing and has a firm grip on the infrastructure, it should be possible for
    them to deal with a threat from the outside while the testing is finalized.


    The goal to be platform independent holds equally true for the software suppliers.
    Including the manufacturer of a certain antivirus software into the policy will
    make that policy unnecessarily complicated. It would be better to create a list
    of requirements that can be used to measure the offers made by the manufacturers
    and suppliers. For example:


    +   - The AV software has to be available on all workstations used in the company;
    failing to provide the same release for all used workstations terminates the agreement.

    +   - The distribution of virus signatures has to take place from a system inside
    the company. The supplier has to ensure that the software allows you to disable
    the update from sources outside the company.

    +   - The client software needs to be protected against tampering.

    +   - The necessary checks for e-mail and attachments should take place on the
    e-mail server and should be repeated on the client system for security reasons.


    Again, the list shown will not apply to every company and is to be considered
    only as an example. The author would add to the last point: "The AV software on
    the server and the AV software on the client should come from different manufacturers."
    Four eyes will see more than two. Including such detailed requirements in the
    policy increases the workload, but also enables the company to continually test
    the systems used, especially if you have made compromises based on the information
    about future developments promised by a manufacturer during the implementation.'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'If the security policy contains loopholes to make it fit to a certain product,
    then that security policy needs to have the loopholes reworked when you change
    the supplier. The policy should reflect the needs of the company and not the shortcomings
    of the supplier.


    You can find good information pertaining policies at http://www.sans.org/resources/policies.


    # 7.5.2 How to Calculate the Risk


    You need to perform periodical risk assessments. This means you need to calculate
    the costs of a security breach for the company. It should contain questions like:


    +   - Is it possible to determine which data was or could have been manipulated
    during the incident?

    +   - How long will it take to establish the agreed upon service level if a server
    is compromised?

    +   - Is it possible to run the services of the compromised server on another
    system while the original system is reinstalled?

    +   - Are there employees trained in computer forensics or do you have to use
    external help? If you need external help, how long does it take for the external
    contractor to reach the company?

    +   - Is it possible to recover from the lost consumer confidence if a security
    breach is publicized?


    The last point is especially dire for companies doing business over the Internet.
    The financial impact of the loss in confidence cannot be calculated. These questions
    seem to be of a more abstract nature at first glance, because no one likes to
    think about these subjects. However, imagine the following scenario: a file server
    marketing and sales used to store their spreadsheets is compromised. How long
    will it take to make sure that no one changed the location of a point in all these
    numbers? If these numbers are used to create quotes for the customers, what will
    happen if a customer receives a ridiculous quote? If the spreadsheets contain
    e-mail addresses, will the customers like the idea that their addresses are sold
    to e-mail marketing companies? And you are not even to the worst outcomes yet:
    if the files contained the customers and conditions, what would happen if these
    numbers were publicized? Or worse, sold to the competition?


    You need to have a “Plan B” for events like the ones described. This is not about
    scaring people; this is about the creation of a sound “Plan B” should the worst-case
    scenario manifest itself. If you know what you need to do, at least in theory,
    then you are a little less unprepared when dealing with the actual situation.
    Planning and calculating such scenarios costs time and money. Many companies try
    their best to'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'avoid the expense. Even worse for some companies, a risk assessment has the
    potential to uncover flaws in the current planning. It is possible to minimize
    the uncovered risk, but even that comes at a price.


    # 7.6 SUMMARY


    This chapter discussed the various aspects of security; it started with general
    thoughts about security. It covered the three entities that need to be secured:
    the file, the system, and the network. It closed with a discussion about security
    policies and why they are important to the well being of the company. Another
    aspect of a sound security policy, the risk assessment, was covered as well.


    Finally, thinking about worst case scenarios is not an undertaking to be entered
    into lightly. All required parties should be aware of the fact that dealing with
    those scenarios is frustrating at best. On the upside, a bit of creative thinking
    can lead to improvements that can be implemented right away, giving you the feeling
    that you have covered another base and made your environment a little bit more
    secure. This is a rewarding feeling; it helps you to see the future in a brighter
    light. Honestly, it is your job to improve the systems you are responsible for
    every day. You can make this a rewarding job.


    # 7.7 REFERENCES


    [Cheswick03] Cheswick, William, Bellovin, Steven and Rubin, Aviel. Firewalls and
    Internet Security: Repelling the Wily Hacker, Second Edition. Addison-Wesley,
    2003.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# 8 That''s It (Almost)


    # In This Chapter


    +   Ethics for System Administrators

    +   Closing Remarks


    There are two more things to say: one is a serious matter, and the other is a
    good-bye to you.


    # 8.1 ETHICS FOR SYSTEM ADMINISTRATORS


    You have been granted far-reaching rights and options to read, write, and manipulate
    (in a positive sense) data on the systems to be administered. So, a huge responsibility
    comes with the job as system administrator. Your superiors show great trust in
    your integrity by granting you this kind of global access to the company''s data.
    The "System Administrators Guild" (SAGE) publishes a "Code of Ethics" on'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'their Web site (http://www.sage.org/ethics.mm). Take the time to read it. Systems
    administration is much more than just "keeping things running." Frustration sometimes
    comes with the job description. That''s just the way it is. If you should feel
    low, though, take a look at http://www.theregister.co.uk/odds/bofh/. Just keep
    in mind that this site is supposed to be satire and not a lecture in how to behave.


    # 8.2 CLOSING REMARKS


    The author has managed to hit most of the roadblocks regarding *NIX administration
    during the last 18+ years. You will probably find new ones. He has tried to give
    you hints and pointers to ease your daily work a bit. Trying to teach someone
    all the necessary things to be considered a *NIX guru from now on is, most likely,
    impossible. Perfect system administrators aren''t born once in a blue moon, either.
    A great deal regarding systems administration is instinct and gut feeling. Both
    can''t be taught in books; they can be learned, not trained. Try to gain as much
    knowledge as possible and take the time to experiment and test. Sometimes documenting
    the tests doesn''t hurt, by the way. In the beginning, the author learned a lot
    through hints and pointers where to look and what to try. This book contains some
    of these hints and pointers; it is up to you to make use of them. The author hopes
    you will have as much fun as he had and still has while trying to find out how
    things work on a *NIX system.


    At the beginning of this book, the author wrote that systems administration is
    a creative process; hopefully throughout the book you were convinced that this
    statement is true. And now for the most important hint in this book: never forget
    to have fun while working as a system administrator!'
  merge: -1
