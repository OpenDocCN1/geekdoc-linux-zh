    \nuse Getopt::Std;\n\ngetopt('s');\n\nif(length($opt_s) == 0)\n{\n    print \"\
    $0: usage:\\n\\n\";\n    print \"$0 -s <string>\\n\\n\";\n}\nelse\n{\n    print\
    \ \"-s has value: $opt_s\\n\";\n}\n\n# EOF\n```\n\nThis example is just an illustration\
    \ how easy and, most of all, how consistent the handling of command-line arguments\
    \ can be if done with Getopt. The instruction use Getopt::Std; loads the Getopt\
    \ package, and getopt('s'); checks for the existence of the option -s and, if\
    \ successful, stores the following string in the variable $opt_s. If another option,\
    \ for example, -d, should be present instead, the length of the variable $opt_s\
    \ will be 0. Because Getopt was not instructed to evaluate any other options than\
    \ -s and the length of $opt_s is tested in the if clause following the evaluation,\
    \ the presence of the option is mandatory. In the case of a zero length, a message\
    \ of how to use the program is displayed. If the length of $opt_s is > 0, the\
    \ string stored in $opt_s is printed. This example barely scratches the surface\
