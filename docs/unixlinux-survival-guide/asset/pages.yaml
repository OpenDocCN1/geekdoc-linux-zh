    # 6.2.1.1.3 Tips Regarding DocBook and XML


    The easiest way to create new XML files is to use an editor that knows about XML,
    which means it is able to support the writer in writing valid XML. This book was
    written with emacs. There is an extension called psgn1 that enables emacs to "understand"
    XML, more or less. emacs is able to deal with XML documents without this extension,
    but installing psgn1 increases emacs usability. If you open an XML file, for example,
    emacs loads the corresponding DTD and validates the document. If the document
    does not contain the necessary information about which DTD to use, you can use
    the DTD menu command to read the necessary files. emacs is available for almost
    all operating systems and is distributed with a GPL license.


    Since you are working on *NIX, another approach obviously presents itself—creating
    the documents using vi. This editor has no idea what an XML file is, though. It
    is the writer who is in charge to make the right decisions. Possible errors will
    show up as soon as you check the files with xmllint. If you don’t like emacs and
    have no intention to create XML files using vi, don’t despair. The number of XML-aware
    editors is growing on a daily basis. You have a great variety to choose from,
    free and commercial. Finding the right editor is not an easy task, though. You
    should examine the programs that came with the *NIX distribution first; chances
    are good something included can allow the aspiring XML author to take the first
    steps. Use the Internet to find out about new programs that might fit your needs.
    Besides using the usual suspects regarding search engines, take a look at the
    Web site xmlsoftware.com (http://www.xmlsoftware.com/editors.html); the list is
    impressive, but not complete.


    A roadblock discovered sooner or later by every aspiring XML writer concerns the
    characters < and >. If you need to use these characters inside an XML file, they
    have to be written &lt; (easy to remember as less than = <) and &gt; (easy to
    remember as greater than >). This mechanism, replacing the string enclosed between
    & and ;, can also be used to define words or descriptive names that might change
    at a later date. If you want to write the documentation for an imaginary program
    called FroBozz, for example, and you have been told the name will change eventually,
    you need to define an entity containing the preliminary name and'
