    # 2.4 AUTOMATION


    Most *NIX systems are rarely shut down; they are running 24 hours, 7 days a week
    (24/7). Based on this fact, it is sometimes necessary to instruct the system to
    run a certain command or chain of commands at a predefined time and/or date. Other
    programs need to run on a recurring basis, for example, every Sunday. *NIX provides
    two mechanisms to automate things, at and cron.


    # 2.4.1 The at Command


    The command at does exactly what it says by executing things at a certain time
    and date. It can be used for recurring commands, but cron is better suited for
    this purpose most of the time. The exception to this rule would be the following
    situation: execution based on return values from a previous run. For example,
    a program is started at a certain time, does its job, and returns a value to be
    converted again in a certain number of hours. This value is fed into at again
    to schedule the next execution. Reorganizing a database or copying a large amount
    of files for safekeeping, for example, need be handled this way, because you have
    almost no means to calculate the exact amount of time needed for the task.


    The syntax of at is simple enough, comprised simply of at and when the execution
    should begin. The chain of commands shown in Listing 2.23 creates a listing of
    all files in the /tmp directory at 5:00 P.M.


    # LISTING 2.23 Execution of a Command at 17:00 on the Same Day


    ```

    root@unixhost:~> at 17:00

    at> ls -l /tmp > /.HO/documentation/contents_tmp.txt

    at> <EOT>

    commands will be executed using /bin/sh

    job 1087311600.a at Tue Jun 15 17:00:00 2004

    ```'
