    # 3.1.9 What Does TIME_WAIT Mean?


    A TCP network connection in the TIME_WAIT state signals that the connection was
    terminated and that the system will wait for a predefined span of time for incoming
    packages from the other system or, respectively, that it will wait for the connection
    partner to confirm the termination of the connection. The TCP protocol was designed
    this way to minimize the loss of packages.


    So far so good—if the requested confirmation for the termination of the connection
    is not received within the predefined time span, the system will drop the connection
    anyway. Usually, this design choice doesn’t pose a problem at all, but'
