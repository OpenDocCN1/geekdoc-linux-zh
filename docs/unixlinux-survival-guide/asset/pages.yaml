- pgno: 192
  md: "```\n#\n#   parameters:  filename of XML file without\n#               extension,\
    \ e.g. testbook\n#\n########################################################\n\
    \n# Variables\nDBOOK_PATH=/opt/sfw/share/docbook/docbook-xsl-1.66.1\nMY_FOP=/opt/sfw/share/docbook/fop-0.20.5/fop.sh\n\
    \necho Building $1.html $1.pdf\n\n# clean up first\nrm $1.fo $1.pdf\n\n# HTML\n\
    xsltproc \\\n    -o $1.html \\\n    $DBOOK_PATH/html/docbook.xsl \\\n    $1.xml\n\
    \n# PDF\nxsltproc \\\n    -o $1.fo \\\n    --stringparam fop.extensions 1 \\\n\
    \    --stringparam draft.mode no \\\n    --stringparam section.autolabel 1 \\\n\
    \    --stringparam admon.graphics 1 \\\n    --stringparam paper.type A4 \\\n \
    \   $DBOOK_PATH/fo/docbook.xsl \\\n    $1.xml\n\n$MY_FOP -fo $1.fo -pdf $1.pdf\n\
    \n# EOF\n```\n\nYou just need to modify the paths to match the respective system.\
    \ The script contains all commands necessary to transform an XML file adhering\
    \ to the DocBook standard into an HTML and a PDF document. The program xsltproc\
    \ is part of the libxslt package. It is used to transform the XML file using the\
    \ XSLT files. Listing 6.7 demonstrates the use of the script."
  merge: -1
  img_proc: true
