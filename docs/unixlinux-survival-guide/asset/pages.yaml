- pgno: 216
  md: 'a user’s physical computer, that someone will likely look under the keyboard
    if the password is not tacked to the monitor (as many are).


    Another subject is so-called *social engineering*. You have to explain to your
    users that they should not discuss with strangers the operating systems or the
    revisions in use or give information about the software used. For example, an
    inexperienced system administrator received a phone call during a current incident.
    He was asked by the caller, who identified himself as employee of the company
    the management of the firewalls and routers was outsourced to, about the makers
    and the current versions of the routers and firewalls. The caller knew the names
    of the other system administrators, the name of the company the services were
    outsourced to, and when the inexperienced system administrator was on duty. The
    investigation of how the caller gained this knowledge is still pending. You have
    to educate the users that even seemingly irrelevant information like the names
    of companies providing services and the like is not for public consumption. The
    more interesting the target is, the more effort will be taken by crackers to gather
    information about it to crack it.


    Most of the mentioned topics can be dealt with by using a good and sound security
    policy (see Section 7.5, “Security Policy”), but you should never forget that
    if the users feel understood, then they will be more willing to adhere to that
    policy. What follows is a rundown of parts of the systems that need to be secured.


    # 7.2 FILE SECURITY


    Because (almost) everything in a *NIX system is a file (processes executed in
    main memory are files in that memory; even the communication between the processes
    takes place through files), files are the smallest entity that needs to be protected.
    The inherent problem with files is as follows: a file can be protected by simply
    turning the write permission off, but that file will be of limited use after doing
    just that. The next step is a system of granular permissions. *NIX provides a
    plethora of possibilities in that respect, but even this approach does not allow
    you to make the system completely secure. As long as there is a way of writing
    to files, some insecurity remains.


    Holding that insecurity at bay is one of the neverending tasks of every system
    administrator. *NIX provides you with a certain level of security right out of
    the box; improving on what is already there is your job.


    A quick count of the files in `/usr/bin`, `/sbin/`, and `/usr/local/bin` on the
    system returns 828 executable files. The directories `/usr/local/lib` and `/usr/lib`
    contain 6326 files in total; these files can be used by an unspecified number
    of programs and scripts. The system this information was gathered from was a relatively'
