- pgno: 124
  md: 'the manufacturer of the application or the database if there are recommendations
    regarding how to deal with backups. Huge amounts of data are usually backed up
    in an incremental manner; this means only the changed portions of the files are
    written to the backup media. Try to estimate the required time for a recovery
    if the worst happens. Is it still possible to do a recovery in the timeframe given
    to you by the respective department?


    Another very important point is the so-called “retention period,” the time required
    by law or otherwise for which the backup has to be retained. The answer to this
    question tells you when you are able to “recycle” the backup media, but make sure
    you don’t exceed the recommendations given by the manufacturer. Another aspect
    concerning the retention period to keep in mind is the fact that the backups do
    not only have to be available, but readable as well. This means that there has
    to be a device to read the backups back from the respective media. Often the author
    has been confronted with situations in which the media is stored safely somewhere,
    but the devices required to read the media did not exist anymore. This situation
    could pose a serious problem if the backup contains financial data required to
    prove that a certain transaction actually took place, for example.


    # 4.1.2 Weekly Backup


    A full backup should be created once a week if possible, especially if incremental
    backups are created during the week. Recovery of an incremental backup means restoring
    one day after the other until the latest state is available again. A worst case
    scenario would be as follows: the last full backup was done on Sunday. It is Friday,
    and the file in question was modified every day; all tapes created during the
    week, including the full backup, have to be used to recreate the file. Calculating
    the time, depending on the speed of the tape drives and the fill grade of the
    tapes, is definitely an exercise you have to complete. You have to make sure you
    are still able to stay in the given timeframe regarding a recovery.


    Information that needs to be available all the time is no candidate for incremental
    backups. Examples of this sort of information might be drawings from the CAD/CAM
    system the company uses that are required by the engineers to be able to work
    at all; configuration files that are used by a communications system, if the company
    works in this area; data required to interact with the customers of the company;
    and the like. You should try to back up these files as soon as they are created.
    If this approach should not be feasible, then the backup should be created as
    soon as possible. Run periodic checks; if this kind of data creeps into the incremental
    backup, then try to move it to the dailies. Again, there is data crucial to the
    daily operations of a company, and this data requires special approaches regarding
    backup.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 4.1.3 Monthly Backup


    Creating a monthly backup—while not replacing the last weekly backup in the month—could
    be an advantage, as well, provided it can be written without disrupting the daily
    business. It should be considered a backup of the backup.


    Most manufacturers of backup-related software offer the means to create a copy
    of a backup, if you are willing to pay for this privilege. This feature usually
    gets unlocked after the fee is paid. Should you choose this feature, you should
    not forget to add the cost of another tape drive or whatever is used to write
    the backups. The creation of a copy of a full backup usually requires additional
    hardware, because the size of the backup obviously exceeds the amount of free
    storage space.


    # 4.1.4 Off-Site Backups


    A teacher the author knew used to say, “The fireproof closet is of no use at all
    if it is buried under the remainder of the building.” Keep this statement in mind,
    especially if the backup media is stored in the same building in which the systems
    are located. This is not meant to make you paranoid, but just to recommend you
    try to store the backup media as far as possible from the systems inside the building.
    If a fire destroys the data center, chances are you will still have the backup
    and some means to use a replacement system to keep the company working. An even
    better solution is to store the backups in a bank vault or a branch office of
    the company (the branch office should store their backups at another branch office).


    How far away you store the backups depends on the surroundings of the company’s
    location. Companies in San Francisco or Los Angeles, California, usually store
    the backups in a building on the other side of the San Andreas Fault. If your
    area is geologically safer, at least try placing the backups in another part of
    the city. Even if you think that you have no reason to worry about things like
    earthquakes or fires, nobody has gotten fired, so far, for providing a sound backup
    strategy. The company relies on the judgment of the system administrators to create
    this strategy.


    # 4.1.5 The "Backup Window"


    As already mentioned, the timeframe you are able to create the backups in, the
    backup window, plays an important role regarding the backup strategy. If the backup
    run should slow data processing in the company down to a crawl, the backup strategy
    needs to be adjusted accordingly. You have to find a backup window to minimize
    the disruption of the daily business while still allowing the creation of a usable
    set of backups. As a rule of thumb, expect that the faster the backup, the more
    expensive it will be. It’s part of your job description to find a solution all
    sides can agree on.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Many *NIX systems know how to create so-called snapshots. This means the file
    system will be frozen at a predefined point in time, allowing the user to create
    a consistent image of it. All modifications of the files during the time the backup
    runs are written into a buffer and will be applied as soon as the filesystem is
    unlocked again. The users won’t notice anything, provided there is enough space
    dedicated to the buffer used to record the changes. You should make sure to create
    the backup in the fastest possible way, though. All modifications have to be applied
    after the unfreezing, thus increasing the load on the disk subsystem. Some RAID
    systems allow you to do this in hardware, provided you are willing to pay for
    this feature.


    # 4.1.6 Backup Media


    Another important thing to consider is the media to which the backup is written.
    Depending on the strategy, the so-called retention period needs attention. The
    question here would be as follows: “How long do we need to keep the backup?” Different
    media have different storage requirements, regarding temperature, space, or accessibility.


    # 4.1.6.1 CD-R/CD-RW/DVD-R/DVD-RW


    In theory at least, any CD/DVD-type media can be read back on almost every computer
    system. That does not necessarily mean that the data can be processed on that
    system, but it can nevertheless be accessed and copied to a machine that is able
    to work with it. For example, you could use a Macintosh to read crucial data stored
    on a CD/DVD and copy it back to the system where the data would be processed.
    The only thing to keep in mind is that some operating systems cannot deal with
    every possible combination of filenames and paths (some Windows variants cannot
    read pathnames longer than 256 characters) or so-called 2-byte characters in filenames,
    for example, Chinese or Japanese characters. Regarding *NIX, most systems exceed
    the 256 characters in a path either during install or after a couple of weeks.
    There is no use in trying to read a CD/DVD on a system not capable of dealing
    with 2-byte characters if the filenames contain non-ASCII strings. Apart from
    these mentioned downsides, storing the backups on CDs/DVDs seems to be a good
    way to handle them.


    The downside of CDs/DVDs is the fact that they don’t “live as long” as tapes.
    Depending on manufacturer specifications, the lifespan of a CD-R/CD-RW/DVD-R/DVD-RW
    is between 15 and 30 years, provided they are stored standing, with no direct
    sunlight, in a case that doesn’t put too much strain on the plastic surface of
    the disk. The lifespan can be reduced dramatically if the wrong type of marker
    pen is used on the surface and then there is “CD/DVD rot.” Not that the author
    has ever witnessed a “rotting” CD/DVD, but you do not want to find it eating away
    the only copy of a file, so don’t take chances.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Some specialists suggest that creating a copy of the CD in question every five
    years is the best bet. Again, your mileage may vary, but a little paranoia might
    save the day.


    # 4.1.6.2 Tapes


    Tapes on the other hand should last about 30 years, and the capacity is growing
    every year. Based on the retention period, it might be feasible to copy the “old”
    backups to a new type of tape and check the results to make use of the higher
    capacity when upgrading the hardware. Depending on the software that was used
    to write to the tape, the only prerequisite is to have the software and the hardware
    to read it back in available. If a backup software package like “Legato NetWorker®,”
    for example, was used to create the backup, a copy of the software able to run
    on the existing hardware is needed to access the data again. So it all boils down
    to the questions: “How long do you need to access the backups?” and “Are you still
    able to access them with the soft-/hardware at hand?” The purchase of a new tape
    drive, possibly using a new type of tape or format to write to it, requires careful
    planning. Will the old hardware be accessible in the future? Is there a plan to
    make sure the old tape drive will still work in a couple of years? Sometimes,
    if the backup needs to be retained, copying the data to a CD or DVD will be the
    best bet to make certain you can read it in the future. You just have to make
    sure to use a format that is readable with the current (and probably future) software
    and/or operating system. The same holds true for hardware. If the manufacturer
    declares the “End of Life” for a certain piece of hardware, this means the system
    won’t be supported in the not-too-distant future. You have to make sure either
    to provide the means to be able to still read the media or to copy the backups
    to another media type that can be used after the manufacturer has stopped supporting
    the old hardware.


    ![](img/e121d664a879353483b8ef78e54b87ea_127_0.png)


    > Which type of tape should you use? There are many different types of tapes and
    tape drives on the market. Make sure the manufacturer of the ones you use to back
    up your valuable data will still exist in a couple of years.


    Given the current state of technology, DLT or AIT seems to be the best bet. There
    is one drawback regarding the use of DLT tapes, though: the data must be written
    in a continuous stream. Otherwise, the drive mechanism will suffer. There shouldn’t
    be any problems while using “NIX as an operating system, though. To quote a technician:
    every DLT drive connected to a Windows system is another drive sold. This quote
    holds some value, given certain technical observations the author has made, but
    there isn’t any positive proof. The same technician said the incentive to create
    the AIT system was that certain operating systems are not able to create a continuous
    stream of data and the involved companies were fed up with the complaints they
    had to deal with. The author is still trying to get a confirmation for that statement.'
  merge: -1
  img_proc: true
- pgno: 128
  md: "# 4.2 TIPS REGARDING BACKUP\n\nCertain files and directories should be backed\
    \ up independent of the backup strategy used. They are not necessarily written\
    \ to another backup system, but are stored somewhere accessible if the need arises.\n\
    \n# 4.2.1 tar Important Files\n\nEvery *NIX system uses configuration files that\
    \ change over the lifespan of the system. These files must be copied back if the\
    \ system needs to be reinstalled. If one of these files gets corrupted or overwritten,\
    \ it needs to be replaced by a working copy as soon as possible.\n\nSome of these\
    \ files are used for special purposes on certain systems; others are equally important\
    \ on every *NIX system. The script shown in Listing 4.1 stores a copy of these\
    \ files in a directory, and that directory is written to a tar archive for storage\
    \ purposes.\n\n# LISTING 4.1 Script to Back Up Important Files\n\n```\n#!/usr/bin/sh\n\
    # $Id: backup_conf.sh,v 1.1 2004/08/18 11:15:26 root Exp root $\n########################################\n\
    #\n#       file:          backup_conf.sh\n#\n#       purpose:       backup important\
    \ files to\n#                      directory and tar it\n#\n#       author:  \
    \      Erik Keller\n#\n#       parameters:    none\n#\n########################################\n\
    \n# Variables\nSYSNAME=`uname -n`\nDESTDIR=/.HO/backupconf\nTODAY=`date '+%Y_%m_%d'`\n\
    \n# get the right tar (needed in Solaris only)\nif [ -x /opt/sfw/bin/tar ]\nthen\n\
    \    TAR=/opt/sfw/bin/tar\n    TAR_OPTS=czf\n```"
  merge: -1
  img_proc: true
