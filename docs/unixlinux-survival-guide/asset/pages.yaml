    # 2.3.2 Using the Getopt Perl Module


    As soon as your Perl programs are starting to grow in complexity, you will find
    one question comes to mind: how do you process arguments given on the command
    line? A fair share of the Perl programs in circulation use the @ARGV array to
    evaluate the supplied parameters. There is nothing wrong with that approach, but
    the creators of those scripts are making their lives a little bit more complicated
    than necessary. The Perl Standard Library, part of every Perl installation, contains
    a wealth of functions you can use to extend the functionality of the scripts or
    simply tackle certain issues of a more general nature in a standard way. You can
    find ready-built functions to deal with parameters, among other things.


    As the author started out creating his first Perl programs, he had the privilege
    to get to know a couple of well-versed Perl programmers. They took the time to
    look at the created code and listened to the author’s complaints about how hard
    certain things are to realize in Perl. One remark they made to the author about
    a fair number of the programs was this: “But that is part of the standard library,
    isn’t it?” The author actually created complex functions to achieve certain results,
    not knowing that Perl would provide a solution if asked correctly.


    One of these timesavers is the package Getopt. Utilizing it makes the processing
    of command-line switches like -p or evaluation of parameters like -d /export/home
    almost an automatic process. Listing 2.22 shows the usage of the package.'
