  md: '# 3 Maintenance


    # In This Chapter


    +   - What Is Baselining?

    +   - Users and Groups

    +   - Daily Tasks


    Maintenance is the ongoing process of keeping the system running smoothly to make
    sure the users get most out of the money spent for the machine in question. The
    task of baselining the various counters inside the system is explained in Section
    3.1, "What Is Baselining?", the task of keeping the user accounts in good shape
    is covered in Section 3.2, "Users and Groups," and the actions that require constant
    care on a daily basis are described in Section 3.3, "Daily Tasks." This chapter
    lists the more common things a system administrator has to deal with regularly.'
