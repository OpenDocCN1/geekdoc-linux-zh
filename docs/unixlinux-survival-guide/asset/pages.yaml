  md: "lean Solaris machine installation. You should try to count the numbers on your\
    \ own system, as shown in Listing 7.1.\n\n# LISTING 7.1 Counting Files and Directories\
    \ in /usr/lib\n\n```\n# cd /usr/lib\n# ls -lR | wc -l\n    6007\n```\n\nBased\
    \ on the number shown in Listing 7.1, it is not possible to be aware of all files\
    \ and directories in that single directory, let alone be aware of the permissions\
    \ and the size of the files and directories. To help you with this issue, a whole\
    \ industry creating software to monitor this information was created. There are\
    \ commercial products like tripwire, open source packages like aide, and, another\
    \ approach, scripts you create yourself.\n\nThe question remains, “What do you\
    \ have to monitor?” The *NIX answer is, as usual, it depends. Programs and libraries\
    \ require the monitoring of not only the size and the permissions, but also the\
    \ date of the last change of the file. The same holds true for configuration files.\
    \ Log files are a little harder to monitor because they constantly change due\
    \ to their nature, but nevertheless they contain vital information. If an intruder\
    \ should manage to alter your log files, then you have almost no way of finding\
    \ traces of the intrusion. A system that can be considered totally secure is a\
    \ myth. You should try your very best to make it as hard and complicated as possible\
    \ for a possible intruder to compromise your systems, though.\n\n# 7.2.1 File\
    \ Level Security\n\nTo achieve the mentioned goal regarding the security of files,\
    \ the next two sections talk about a script you can create yourself and an open\
