  md: 'nothing at all. By the way, the author might sound paranoid here, but tampering
    with this pile of paper is much more complicated than tampering with the files
    stored on any computer.


    Other commands useful for creating documentation are ifconfig to display the information
    regarding the network interfaces, uname -m to display the installed processor
    architecture in detail, vmstat for displaying the swap information, and df to
    list all mounted file-systems.


    Other documents you should store in the directories documenting the systems are
    log files and the data sampled by the sar probes (see Section 1.2.4, "What Is
    Going On?"). for more information). The load-information contained in the latter
    is especially useful, because it allows the creation of detailed statistics regarding
    the load situation on the systems. The following command (see Listing 6.3) writes
    the sampled data into a file for later examination.


    # LISTING 6.3 Writing a sar File


    ```

    erikkk@unixhost> sar -o `uname -n`.`date +%Y%m%d`.sar

    ```


    This command creates a sar file, using the hostname of the system, the date, and
    the extension .sar to name the file. These files can be read at a later date by
    using sar -s -f option. If this file is created a couple of minutes before midnight
    via a crontab entry, you can gather these files to the system used to store the
    documentation. To make use of these files, you need the sar command of the machine
    the data originated from, but if the production server''s load situation does
    not allow using it to create a report, you could always use the test system for
    that purpose. Important here is the fact that these files provide access to all
    data sampled by sar, not only the information used to baseline the system (see
    Section 3.1, "What Is Baselining?"). This means you should be able to create reports
    and graphs spanning months instead of the last 30 days.


    # 6.2.1.1 Why XML?


    First things first: nobody forces you to structure your documentation using XML.
    But try to use the path of the least resistance. One of the things that drew the
    author to computers was the fact that a machine could take care of the mundane
    details, giving him time to take care of the more important things. You already
    know the author''s point of view regarding documentation: if you don''t have access
    to documentation or the documentation you have access to does not reflect the
    situation you are confronted with, you will have to do more work. And "do more
    work" does not sound appealing.. After creating the necessary documentation using
    vi and emacs for years, someone introduced the author to FrameMaker while he was
    working at a software development company. The native format of the software is
    called'
