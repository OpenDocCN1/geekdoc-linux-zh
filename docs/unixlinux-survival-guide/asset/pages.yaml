    on most modern systems: the original one, created a while ago, and a newer one
    called nawk. The latter knows how to define functions, for example. You shouldn’t
    have any problems if the program is used in the aforementioned way, but still,
    you should be aware of the fact. To find out, simply try to start the program
    nawk and watch the output. If it looks like the following, the newer version is
    available on the system.


