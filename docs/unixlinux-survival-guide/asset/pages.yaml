- pgno: 183
  md: 'author was responsible for this data. He wasn’t even with the respective companies
    at the time the data was created. Then, all of a sudden, the data became interesting
    again, but no one had bothered to copy the files to the new formats that replaced
    the old ones from time to time. These scenarios are not that far-fetched, especially
    not if you are working as a system administrator. In the light of recent developments
    regarding the licensing of software—you don’t buy the software any more; you license
    the use for a certain time, and that’s it—things could get even more complicated.
    Besides that, the author doesn’t like the idea of having to pay someone for the
    privilege of accessing documents he created—containing his intellectual property—just
    because the contents became interesting again. Who has the right to decide how
    much you have to pay to access your data again? Possibly establishing the price
    based on the fact how much the information is worth to you? No thank you!


    What are the options to stay as platform independent as possible? Just to be as
    blunt as permissible: none of the software manufacturers is exempted from this
    criticism. If you are a Macintosh user and used FrameMaker to write documentation
    or books during the last couple of years, you need a license to access these documents—and
    either a Windows machine or a Solaris box to access or modify these documents
    (Adobe sent a note to the Mac users of FrameMaker stating exactly that—that they
    had to use another platform to run the current releases of the software). Plain
    ASCII files will always be accessible; just use any kind of editor to read, modify,
    or print the files. The quality of presentation of the information is debatable,
    though. Besides that, searching for hard disk in a document containing this string
    more than a hundred times is cumbersome at best. To sum it up: plain text files
    are lacking structure. If a plain text file could contain some kind of structure
    to, for example, differentiate between a headline and the body text or, even more
    useful, between the name of a command and the name of something else, the format
    would become an interesting option to store information.


    It might be obvious to some readers what could be used to rectify that: XML. Don’t
    shut the book and run just yet. You aren’t supposed to start learning XML right
    now, nor is it a requirement to read this book any further. If you feel inclined
    to brush up your XML skills, by all means, go ahead; you should probably read
    on regardless, though. This section is about the necessity to document the scripts,
    configurations, and hardware details in some way—preferably in such a way that
    searching for information is as easy as possible. This does not necessarily imply
    that one has to change the way the documentation is created right now. It does
    not imply that documentation in a non-XML format is bad either. We’ll just use
    the inherent flexibility of *NIX to meddle with things a little, why don’t we?'
  merge: -1
