    ## 求职与简历写作技巧


    培训只是第一步——下一步是寻找工作。


    一旦你完成了培训，该如何开始找工作呢？这主要包含两个部分：准备一份优秀的简历以及将自己推向就业市场。无论是通过求职网站申请、使用 LinkedIn 账号，还是向专业猎头发送简历。


    应多寻找专业猎头，而不是通用的招聘板，因为在 IT 领域你更容易找到好工作。在供大于于求的情况下，尝试寻找一个让你提交简历并完善个人资料的网站，以免在努力引起经理注意时淹没在任何邮件系统中。人脉关系也至关重要，因为许多猎头会搜索具备正确技能的潜在员工。


    对于简历，要保持简洁简单。一页纸就足够了。包含基本的联系方式、计算机教育背景以及与系统管理员（Sysadmin）职位相关的任何工作。


