    SECURITY


    ## Researchers uncover Turl Linux malware


    ## Platform shift for former Windows APT


    Security researchers have uncovered a new variant of the Turl advanced persistent
    threat (APT) malware which targets Linux as the target operating system - the
    first turn ever to do so.


    In their recent analysis of the malware, Kurt Baumgartner and Constantin Rau of
    security Lab found Linux becoming an increasingly popular target for financially-motivated
    malware writers due to its position as the majority shareholder of the server
    market.


    "We suspect this component was running for years at a victim site," the pair wrote
    of the malware sample, which was retrieved from a customer system, "but do not
    have enough data to support that statement just yet." Shortly after the report
    was published, the pair found a second, newer variant called Turl that can infect
    a system even from an underprivileged environment.


    Based on code, Turl acts as a stealth backdoor and provides access to the infected
    system with keylogging. Linux has not been a major target for malware activity;
    Baumgartner says it could be, with malware writers actively modifying their software
    to achieve cross-platform compatibility.


    DEVELOPMENT


    ## AMD launches Omega driver update


    INTRODUCING THE


    ![](img/55f2495ee0f271affc0b7194535f335f_6_0.png)


    AMD has released one of its biggest driver updates for its graphics products,
    including GPU and APU chips, and the first to feature distribution-specific packages.


    AMD, much like its rival Nvidia, does not provide an open source driver for its
    graphics to use hardware acceleration unless using a community-based open source
    driver or downloading AMD''s "binary blob" release, which is traditionally distributed
    as an executable archive that can be used as a direct install method or to generate
    distribution-specific packages.


    Starting with the Omega driver, AMD will include the option of downloading distribution-specific
    packages at launch. For Ubuntu and Fedora users alongside the traditional distribution-specific
    installer. As well as improved Linux support, the new driver bundle includes quality
    and performance boosting features.


