    # 新报告显示企业增长以及优先竞争的下降


    Linux 基金会企业终端用户委员会开展的受邀调查结果已发布，显示出人们对 Linux 安全性的非常有信心，且其在企业领域的份额正在增加——这是直接从竞争中赢得。


    该调查是根据政府组织的请求进行的，所有组织每年支出均超过 5 亿美元，或在四年内支出超过 6 亿美元。该调查会在过去四年中每年进行一次相同的方法调查，因此可以进行同比比较。报告声称
