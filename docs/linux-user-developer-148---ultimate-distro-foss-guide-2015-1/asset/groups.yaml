    # 您的观点


    # Linux 用户来信


    您对杂志、Linux 和开源软件的意见


    ## 痴迷 Ripro


    我非常喜欢你们上期介绍的机器人专题！我一直在为我儿子买一些有趣的玩具，我认为这在这个过程中可以帮助教他一些东西，而机器人机器人完全能够胜任这一点。你们以后还会会有关于
    Ripro 的内容吗？我想知道如何正确地将它连接到树莓派（Raspberry Pi）！


    Angela Green


    你运气不错，因为我们本期恰好有一个教程。我们计划在后续章节中对 Ripro 进行更多尝试，包括使用 PC 摄像头、更好的界面、语音控制、文本转语音以及更多针对
    Ripro 的自定义动作。它是一个非常棒的构建平台，我们希望它发挥出潜力，让它实现比我们设更多的功能。


    与此同时，我们听说了一款 Ubuntu 平板电脑，也许可以试试看看是否好用。


    第一批 Ubuntu 手机预计将于 2015 年 2 月上市。老实说。


    ## Ubuntu 手机在哪里？


    # Android 杂志


    距离 Ubuntu 手机计划发布已经两年了——我们仍然在 CES 上看到他们大张旗鼓地宣传 1.0 发布，然而……还有 10 个月。它们还会来吗？它们会到来吗？它们真的有硬件伙伴吗，还是那只是猜测？什么时候能出现在我的续约合同里？


    ## Linux 发布计划


    随着越来越多的 Android 功能合并到 Linux，内核也意识到了，为热门移动设备进行开发已变得容易得多。凭借超过 250 亿次的应用下载和超过 1 亿正在使用的设备，我们拥有了巨大的读者群体。对于更关注
    Android 的杂志，请查看《Android 杂志》，这是唯一专注于该平台的出版物。它包含了让您了解 Android 动态的新和评论，以及关于开发和破解硬件的教程和建议。访问
    www.littlegreenbook.co.uk 了解更多。


    Ben


    主要的区别在于，大多数开源软件（FOSS）开发者不使用 PC 类型——他们通常是为 Linux 发行版的发布构建类型。然而，许多大公司确实有潜力，但为满足截止日期而挣扎——有时他们使用它，但通常只是一个很好的粗略指南。不过，大多数时候，软件在完成后才算完成，你只有在它发布或收到极短通知时才知道它要出来了。


    我从未注意到你关于很多 Linux 发行版的查询——事实上，我从未看到过关于他们的桌面版 Linux 发行版的新闻，甚至是软件和硬件。这有什么特定的原因吗？我理想上知道最近会有什么发布。


    似乎他们曾计划在 2016 年之前将手机推向市场，但由于某些原因，发布时间现在定在 2 月中旬。至于硬件制造商，他们确实有一些！欧洲有一家制造商，中国有另一家，实际产品正在生产中，这会很有趣


    # 话题焦点


    我们的终极发行版指南从在线社区中获得了一些建议，并对我们考虑的发行版进行了少量筛选。在对话中，我们收到的不仅仅是投票：bit.ly/3tLG06g


    ## 发行版不够


    Kevin O''Brien:

    我在任何地方都没有看到“以上所有”。我使用 Ubuntu 并将其作为我的日常发行版，但我猜它们现在都不酷了。


    PCH:

    Ubuntu 在哪里？我配合 elementary OS 一起使用。但“其他”类别呢？


    fkol-k4:

    这个列表中缺少了大量热门发行版，Ubuntu 和几乎所有的 Arch 衍生版，Debian 衍生版不像 #CrunchBang，没有提到基于 Fedora/openSUSE
    的发行版，没有保证（不存在）在任何地方都不存在，最后一个还在继续下去……


    RobZweetsloot:

    这只是我们为该专题考虑的发行版中的一小部分。


    ## Salih Emin 说：


    - 一个有趣的调查……以前从未见过这种调查……“这就像是 70% 的人使用 Ubuntu，但让我们看看其他 30% 说什么，这是为了那 30% 的 Linux
    用户准备的。”


    ## Kiki Novasaki 说：


    - 我在列表里用了 Ubuntu，所以给我看一些。


    ## Electric Prism 说：


    - 我家里每个成员朋友的电脑以及我的电脑都装了 Elementary OS，操作系统是每个人的 Linux。


    ## Stephenoyle 说：


    - 作为一个 Linux 新手，我读了这篇文章，很有趣，可以看到我见过多少发行版。我还没有计划，还没找到我的下一次尝试（这是我第一次听说过）。


    ## Old Dog 说：


    - 我用过 WL 并尝试过 20 多个系统……OS''s puppy 是我生命中最好用的系统！


    ## Knppix & Slack 说：


    - Porteus 的新系统很好。


