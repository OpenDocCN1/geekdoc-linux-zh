    \n# imagineshop.co.uk\n\n0800 808 5450\nnetcetera.co.uk/lud\n\n# 联系我们...\n\n网站：linuxuser.co.uk\n\
    电子邮箱：linuxuser@imagine-publishing.co.uk\n\n# 问答\n\n+ Facebook: Linux User Developer\n\
    + Twitter: @linuxusermag\n\n# 你的问题解答\n\n向我们发送你的问题，我们将尽力回答！\n\n# 分区问题\n\n我想放弃 LVM\
    \ 和全盘加密。我很快就会安装 Makulu。我知道如何使用 GParted 并且做了一些备份。我的问题是：加密 ubuntu 的最佳方法是什么？\n\n\
    我可以进行全新安装。问题是我的分区设置不符合我的要求，特别是我只有 250MB，但我想要 500MB。如果我直接进行安装，安装程序会建议一个并不完全正确的方案。\n\
    \n我以前没用过 LVM，所以我不确定是否可以在使用 Makulu 达到我的目标之前修复它。\n\n如果我从 Live CD 开始并尝试用 GParted\
    \ 调整分区大小怎么样？然后我就可以运行 Makulu 的安装程序了吗？如果“Live 带的 GParted”安装正确了呢？\n\n备份没有使用原始磁盘加密的密钥加密。如果加密了，至少你可以在进入任何中立状态之前修复它。回到\
    \ Makulu 安装程序，它将允许你设置想要的分区，包括自定义大小的启动分区。\n\n无论如何，一旦你使用 GParted 确认当前分区和 LVM 没有被驱动占用并将其恢复到中立状态。\n\
    \n> Jeff Keys\n\n这听起来是个好主意，但在开始删除分区之前，请确保你的\n\n下方 MakuluLinux 是一个新的发行版，旨在为用户提供运行在\
    \ Debian 源码上的稳定系统博客。\n\n# FAQ：问题\n\nQ：有我可以使用的开源博客框架吗？\n\n答：有的，最著名的是 WordPress。无论好坏，它都是用\
    \ PHP 编写的，而且它是完全开源的。不仅如此，它的设置和使用也非常快速方便。或者如果你喜欢 CMS 但想用不同的语言的话。\n\nQ：既然它们是开源的，这意味着我可以编辑我博客上的版本吗？\n\
    \n答：你完全可以——无论你是想更改一个小型博客的行为、使其变得完整，还是删除所有你打算使用的功能，完全取决于你。\n\nQ：我需要任何 Web 托管吗？\n\
    \n答：虽然 WordPress 和其他网站会在自己的博客服务上提供它们的 CMS，但远不如使用自己的平台那样开放或可定制。\n\n![](img/55f2495ee0f271affc0b7194535f335f_87_0.png)\n\
    \n# 问\n解决你所有的技术问题\n\n> 从 Xuntu 中取消加密和 LVM 的最佳方法是什么？\n\n# Crunching Tumbler\n\n\
    # DDoS防御\n\n我的 Web 服务器已经受到攻击一段时间了——这是一种基础的 http 攻击，寻找一个（已不存在的）表单，该表单会生成以 php 开头的错误。自然地，这个错误被报告为封锁\
    \ IP！这样我就可以将 IP 加入我的黑名单。\n\n我最近在 VirtualBox 中安装了最新的 Crunching Linux 进行测试驱动。然而，我注意到\
    \ Shotwell 0.12 来自默认存储库，而不是最新的 0.13 版本。新版本上的 Tumbler 是一个与 Crunching 相当的美化界面，它提供了最新的\
    \ Shotwell！它好得多，但 0.13 在实验分支中。\n\n我有一个想法——有一种方法写脚本来生成这种错误，这样就可以大大减少延迟，并且是帮助攻击拦截\
    \ IP 的更可行的方法。希望你们有一些解决方案！\n\n在处理表单和条目时，我遇到了大量的在线删除问题。我正在使用脚本来修复 Ubuntu 12.04 中的这这类问题，坦率地说，我实际上是在测试最新的\
    \ Ubuntu。对于这个问题，我想知道在在使用任何软件时我可以编辑什么。目前我在 Linux Mint 17 上使用 Firefox。\n\n# 网页编辑\n\
    \n嗯，一种简单的安装方法是进入 Shotwell 并从网站下载源码：https://www.gnome.org/projects/shotwell/\n\n\
    噢，现在 DDoS 听起来一点也不好玩。你必须为此创建自己的脚本，Fail2ban 已经带有一个很棒的解决方案。\n\n正如你所指出的，Crunching\
    \ 可以完全访问 Debian 存储库。实验分支拥有它，你只需要点击几次即可使用所有软件。\n\n这是一个针对 Apache 的棒计划，它可以扫描你的错误日志中任何可能被认为是与攻击恶意的内容。然后拦截\
    \ IP 以免它们再次尝试。你还可以使用此过滤器并获取更新以了解它是如何工作的。\n\n如果你想编辑一个网站，这个巨大的程序。我越尝试删除，文本就增长得越大，现实情况是我觉得这源于浏览或使用其他软件，这就是为什么我想知道使用特定的编辑器。\n\
    \n首先，你将把源添加到 /etc/apt/sources.list。然后转到 /preferences/ 并替换内容：\n\n我感谢任何帮助或建议。\n\n\
    + Package: *\nPin: testing\nPin-Priority: 400\n\n+ Package: *\nPin: unstable\n\
    Pin-Priority: 300\n\n有两种方法可以安装包。首先你可以在不更新依赖的情况下安装：\n\n```\nsudo apt-get install\
    \ $package_name --unstable\n```\n\n这将从 unstable 仓库获取包。或者你可以使用：\n\n```\nsudo apt-get\
    \ install t $package_name\n```\n\n这将从实验分支安装包并更新所有依赖。\n\n如果失败，它会告诉你原因。你现在应该可以在没有\
    \ Shotwell 的情况下安装它，还有其他软件。\n\nFail2ban 被全球许多开发者使用。\n\n![](img/55f2495ee0f271affc0b7194535f335f_88_0.png)\n\
    \n*(注：由于提供的原文在后半部分存在大量重复段落，此处已根据“不要重复输出原文”的原则仅翻译了唯一内容)*\n\n"
