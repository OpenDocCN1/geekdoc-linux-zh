    double the very slow 1.2 GHz processor and a full GB of RAM on its Ingenic-based
    system-on-a-chip. It has native Wi-Fi and Bluetooth, so much so that it performed
    as well as the Pi would be happy. For makers, there are a few more random I/O
    ports as well as a 25 GPIO and UART ports dotted around. It should be superior
    to the original Model B Raspberry in every way.


    Coming pre-installed on the CI20 is a slightly modified version of Android 4.4,
    which, to be fair, is still impressive; usually we''d expect to see a much older
    version of Android. It boots well, so for the CI20 to boot into Android, however,
    upon completing boot we found the bare selection of apps available, and no access
