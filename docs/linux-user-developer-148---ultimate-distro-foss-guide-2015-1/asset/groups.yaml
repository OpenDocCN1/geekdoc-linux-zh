    # Add a reset switch to your Raspberry Pi


    Need to restart your Pi after a system lock-up? Easy strain on the mains connector
    – install a reset switch!


    ![](img/55f2495ee0f271affc0b7194535f335f_61_0.png)


    # What you''ll need


    +   - Momentary switch

    - Suitable wire for PCB projects

    - Soldering iron and solder

    - Single pin header

    - H0/motherboard jumper


    We all know that shutting down a Raspberry Pi by removing the power cable is risky.
    Data may be written to the SD card, leading to corruption, with repeated removal
    of the power cable can cause problems with the connector port.


    # Check your Raspberry Pi model


    Only two models feature the PCB header: the Raspberry Pi B Rev 2 and the B+ (to
    the left of the ''Raspberry Pi 2014'' label). You will need to install the pins
    manually, however, as they are not preinstalled for.


    Clearly this can cause problems. When faults cause the Raspberry Pi to crash,
    the simple fix is to add a simple reset function to the device. There are three
    ways this can be done: with a USB button, a motherboard jumper or a motherboard
    header connected to newly-soldered pins on the PH header on the Model B Rev 2
    and this (this is the most complicated option).


    If you have an old Pi lying around, the reset button is already there and adding
    the connecting motherboard pins is achievable if you have a soldering iron. Otherwise,
    we recommend purchasing the parts alone, although, are aware that you''ll probably
    need to buy more pins than you''ll need.


    Christian Cawley

    is a hardware and software support engineer with much experience in computer and
    smart technology both online and in magazines


    ![](img/55f2495ee0f271affc0b7194535f335f_61_1.png)'
