    # Desktop publishing software


    Finding the best DTP program for creating professional publications


    ## REVIEW


    ## LibreOffice


    Scribus has evolved over the last decade into a powerful program


    There''s no DTP software in LibreOffice, but you can de impress a little


    - The image, illustration and typography tools are exhaustive

    - Layout tools are basic at best, but the elements can be finely controlled


    ## Features


    Scribus is essentially an open inDesign; it has everything - media managers, managers
    and built settings, layers and binding, typography tools, pre-flight checks. The
    interface is a clean and easy to use, with particularly spectacular features.
    We were quite impressed.


    Not speaking of DTP software, LibreOffice''s presentation software can still be
    used to an extent, by pretending that slides are pages. The key trick is that
    you can use LibreOffice''s Document Converter to create ODP from Publisher files.


    ## Layout tools


    You can set any layout you like, and place things pixel-perfectly using the Ctrl
    and Alt keys to help with alignment. There are multiple grids and guides to help
    you with positioning elements and a baseline to align your text. Everything can
    be finely controlled in the options, down to the colour and distance of your guides.


    LibreOffice has pretty decent wizards generating letters and adjusts, for proper
    publications you''ll need to go master, with some slide layouts you can use to
    get started, and it''s easy to import images, videos and other media for digital
    projects. It''s definitely intended to work as DTP though.


    ## Images and text


    The Layers window wisely features hide, lock and wrapping options, and Adobe-style
    blend modes. Text options are stellar - Ctrl+I on a text box to find everything
    from style to tracking and leaders. Images can be edited via GIMP and have effects
    applied.


    Detailed formatting options are available and text styles can be meticulously
    controlled. In fact, the image styles are very good so, if you put the time setting
    up what you need the tools will produce pretty good results if your needs are
    simple.


    ## Output


    True print options, including security settings, embedded fonts, crop, bleed and
    other printer marks. The pre-flight checks are very thorough too, perhaps so much
    more than in InDesign. As well as the option to export EPS and SVG files, with
    which you can handle compression and even presentation effects.


    You can export PDFs from Impress (either less or /JPEG conversion to a DPI). There
    is no crop/bleed options for this in presentation software, but the PDFs themselves
    are high quality. You can also export HTML files with page navigation options
    at the top of online reading. But that though, there''s not much.


    ## Overall


    Intuitive but however, powerful but with a steep learning curve, and with everything
    a pro DTP suite contains, it has unique features like a barcode generator and
    executables.


    It''s a bit of a stretch to get Impress to work so far outside its remit, but
    the recently introduced support for Microsoft Publisher we was worth investigating;
    at least. Unfortunately, it''s not an option.


    79.linuxuser.co.uk


    ## Review

    Desktop publishing software


    ## In brief: Compare and contrast our verdicts


    | | LyX | Lucidpress | Scribus | LibreOffice |

    |---|---|---|---|---|

    | Features | There''s such a lot to learn but it''s well worth it | 7 | Clean
    and simple, aimed for more casual home users | 6 | The complete package, really
    impressive software | 10 | Impress just DTP, deserves support for Publisher files
    | 4 |

    | Layout tools | Excellent for books and journals, not custom layouts | 7 | Smart
    (but simple) tools and good-looking templates | 7 | Fine controls for grids and
    guides gives great layouts | 9 | Very basic templates and layouts, so quite limited
    | 4 |

    | Images and text | Brilliant text and structured options, limited images | 8
    | All the basics are there, with nice effects besides | 7 | Detailed text and
    large GIF-editable images | 5 | Image and text styles are undeniably useful |
    5 |

    | Output | Auto-styles document, outputs to multiple formats | 7 | Essentially
    unusable unless you take a monthly | 10 | All options are available | 5 | High
    quality but basic | 5 |

    | Overall | If you don''t need images and design this | 9 | If worth your money,
    each | 5 | This is the gold standard of Linux | 6 | LibreOffice just can''t compete
    with it | 4 |


    ## AND THE WINNER IS...

    Scribus


    Doing the desktop publishing for Linux, Scribus quickly became the main player.
    LibreOffice was the only one that had support for Publisher, but after some time
