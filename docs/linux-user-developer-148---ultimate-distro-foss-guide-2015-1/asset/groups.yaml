    # Tutorial


    **Rob Zwetsloot** models complex systems and is a web developer proficient in
    Python, Django and PHP. He loves experimenting with computing.


    # Remotely control your Raspberry Pi robot


    Take Rapiro for a spin without needing to be lashed to a laptop by controlling
    it over the network or with a PS3 controller.


    Rapiro is a cool little robot, and while we were playing around it last month
    for big robots we noticed that its potential for expansion and customisation was
    much simpler and satisfying than any of the other robots. In the spirit of that,
    we''re going to build up our Rapiro to do amazing things. We owe it to the ever-useful
    Raspberry Pi and a little Python know-how.


    This month, we''re going to let it off the computer and have it able to walk freely
    on its own using the power of the Raspberry Pi and its own small selection of
    AA batteries to power it. We''re also going to teach you how to control it with
    a PS3 pad so that you don''t have to constantly send commands via an interface.


    # What you''ll need


    - Raspberry Pi Model B

    - Rapiro

    - Compatible wireless dongle

    - PS3 controller

    - Mini USB cable


    ![](img/55f2495ee0f271affc0b7194535f335f_67_0.png)


    # # Remotely control your Raspberry Pi robot


    ![](img/55f2495ee0f271affc0b7194535f335f_68_0.png)


    ### 01 Set up the Raspberry Pi


    You''ll need an original Raspberry Pi Model B for Rapiro, as B needs to trim the
    connections for Rapiro to fit. Install Raspian on it and perform the usual `apt-get
    update && sudo apt-get upgrade` before doing firmware upgrade to update all the
    software.


    ### 02 Set up wireless


    Keep Raspian in command-only boot (or set it to boot in command line but stay
    on the desktop and use the graphical utility to set the wireless dongle to connect
    to your network).


    ### 03 Get the IP address


    Open terminal and type `ifconfig` - it will spit out the details for networking.
    Specifically, you want to look for yours and its relevant IP details. Make a note
    of this as you will be using it to connect to the Raspberry Pi.


    ### 04 Connect remotely


    On your PC or laptop and begin to test out the Raspberry Pi. Open a terminal and
    type:


    ```

    $ ssh pi@[IP address]

    ```


    You may have to enter the keys (raspberry) and you''ll be into the Raspberry Pi
    system.


    ### 05 Install extra software


    To send signals to Rapiro from the command line you need to get Micro. This is
    only required as Python has a special library for this. You can install it on
    the command line using:


    ```

    $ sudo apt-get install

    ```


    ### 06 Install into Rapiro


    Turn off and disconnect the Raspberry Pi from all cables. Next, remove the screws
    holding Rapiro''s head together and take the front off. The Raspberry Pi clicks
    into the base of the head with the ports poking out the back of the head as it''s
    not attached anymore.


    ![](img/55f2495ee0f271affc0b7194535f335f_68_1.png)


    ### 07 Connect the Raspberry Pi


    The spare Pi left inside Rapiro''s head can be connected to the Raspberry Pi to
    both power and allow for control from the Pi. Refer to the image to see how it''s
    attached with the black cable on the opposite side of the edge of the pins.


    ![](img/55f2495ee0f271affc0b7194535f335f_68_2.png)


    # Tutorial


    ![](img/55f2495ee0f271affc0b7194535f335f_69_0.png)


    Above it takes a little practice but the analogue sticks are really fun to use.


    ### 08 Reconnect the head


    That''s it! Once you''ve plugged the Raspberry Pi in it''s ready to go. Reattach
    the head to the body and you can start remotely controlling Rapiro by the Pi.
    If you want to power Rapiro with external power keep the head open as you''ll
    need to add power to the Pi at the same time.


    ### 12 Break down the command


    There are four parts to that command: the RGB values for the LED lights and the
    T value for milliseconds. We''ve set the green to maximum (255) and the other
    two colors to 0, while T is 10. Quite simple – around the code.


    ### 09 First test


    Turn Rapiro on and see if everything works. Does the Raspberry Pi light up? The
    most common problem is that you may have to put the Raspberry Pi cable into the
    wrong way, meaning you''ll have to completely disconnect it to fix it.


    ### 13 Raise right hand


    Let''s do something a little more interesting and move one of the servos in Rapiro''s
    body. We can raise the right arm by sending a couple of commands to its arm so:


    ```

    $ echo "M6" | sudo microcom -b 57600 -o -d /dev/ttyAMA0

    ```


    ```

    $ echo "M6" | sudo microcom -b 57600 -o -d /dev/ttyAMA0

    ```


    ### 10 First commands


    If your Raspberry is now working and the Raspberry Pi is powering on, it''s time
    to take it for a test drive. Connect via ssh like use the sketch that has been
    uploaded to your Raspberry, with M6 being the left way. You can also directly
    control the motors and LEDs with serial commands.


    ### 14 Further breakdowns


    There''s more in serial code to explain. First of all, the S numbers should be
    used - in case 02, which is the right shoulder. The V value is the angle of the
    arm - 0 is down while 180 is up. T is the same as the code before. Only two commands
    can be done at a time like this.


    ### 11 Serial commands


    This is using Arduino sketch that has been uploaded to your Raspberry, with M6
    being the left way. You can also directly control the motors and LEDs with serial
    commands. To change the lights to 10ms,


    ### 15 Full code listing


    ```

    $ echo "PRN0002550000010" | sudo microcom -b 57600 -o -d /dev/ttyAMA0

    ```


    From here we start making custom scripts for Raspberry that do a lot more than
    some of the Arduino scripts. They can be quite tough though, due to the way you
    would have to extract them; by referring to the listing on the following page
    you''ll be able to build up an original sketch for any.


    # Remotely control your Raspberry Pi robot


    To get Rapiro to work with the controller, you''ll need a custom script. A basic
    script can be found on the Rapiro website, so download it to the Pi:


    ```

    $ wget http://www.klik.co.jp/rapiro/ra_ps3_ver_1.py

    ```


    # 17 Preparation


    Grab a PS3 controller and the cable, or use available USB dongle you might. Plug
    it in and wait a few seconds to connect to the Pi. You can then run the code:


    ```

    $ python rapiro_ps3_ver_1.py

    ```


    # 18 Move Rapiro!


    Ok, this is the cool part: the analog sticks control both arms, each being able
    to manipulate the rotation of shoulder and raising. Pulling the triggers will
    grip the hands, while the L and R buttons swing the head.


    D-pads allow you to activate the walk forward and back commands as well as turn
    on the spot. The face buttons allow you to wave with both hands, or X stopping
    everything and returning it to the base state.


    # 19 Code limits


    The code is limited to how many actions you can perform at once, and will overflow
    the buffer if you try to do too complicated. That''s fine, you can immediately
    start the code again.


    # Truly wireless


    # 20 Modifying the code


    The code calls for specific movements of the standard body. Using the code for
    Rapiro last issue where we had the drift ability, you can also add this to Select.
    Find the line com in the SELECT part of the code and change it:


    The PS3 controller is connected to the phone with a wire like a leash, reminding
    it with a bit of a headache. Using Bluetooth module modifies the controls so the
    controller works wirelessly. It is a shot at an upgrade!


    ```

    com.write("#?")

    ```


    # Serial Code


    | S | Description |

    | :--- | :--- |

    | S00 | The head, turn to side |

    | S01 | The waist, turn to side |

    | S02 | The right shoulder, turn forward and back |

    | S03 | Right arm, raise up and down |

    | S04 | Right hand, open and close |

    | S05 | Left shoulder, turn forward and back |

    | S06 | Left arm, raise up and down |

    | S07 | Left hand, open and close |

    | S08 | Right foot, turn to side |

    | S09 | Right foot, turn to side |

    | S10 | Left foot, turn to side |

    | S11 | Left foot, turn to side |

    | R | Red color for eye LEDs, 255 |

    | G | Green color for eye LEDs, 255 |

    | B | Blue color for eye LEDs, 255 |

    | T | Time in milliseconds for the action to take place |


