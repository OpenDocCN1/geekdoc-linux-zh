    # Recommended Projects


    - FreeNAS: The project has moved to github - see at https://github.com/freeenas

    - OpenMediaVault: A lightweight network storage (NAS) solution

    - Disk Imager: Writeable images for USB sticks or SSDs


    ![](img/55f2495ee0f271affc0b7194535f335f_46_2.png)


    # Easily back up Windows PC


    You can access your NAS4Free CFS/SMB share on NAS4Free PC by typing `\NAS4Free`
    in Explorer. You could also back up using the Windows backup feature (Windows
    7 or later).


    ![](img/55f2495ee0f271affc0b7194535f335f_46_3.png)


    # 01 Download NAS4Free


    You can find NAS4Free files on a Live CD or USB image, depending on whether you
    want to boot from CD or USB. Also, select the correct version for PC: NAS4Free
    (64-bit) or x86 (32-bit).


    # 02 Boot it


    After setting the BIOS on your old PC to boot first from CD or USB stick, insert
    NAS4Free. It will go through the boot process, which may take a while.


    # 05 Configure LAN interface


    Once the drive reboots, you will end up at the Console Menu. This time, enter
    1 to select your Ethernet interface (from just one).


    # 06 Configure IP address


    Back at the Console Menu, enter 2 to configure your IP address. Say No, then enter
    to accept the default subnet mask. Use your own IP address as the default gateway
    and enter your DNS server.


    # 03 Choose install method


    Eventually you enter 9 to install from live CD/USB. Then choose 2 to install on
    the PC hard disk if you want to run the OS from a USB flash drive.


    # 04 Install to disk


    Press OK on the next menu, the method and destination menu, then say No to swap
    partition (unless you have very little RAM); NAS4Free will then be installed on
    the chosen disk. Note the data partition parameters.


    ![](img/55f2495ee0f271affc0b7194535f335f_46_4.png)


    # 07 Access WebUI


    With the basic setup, you can access your NAS4Free server from now. Enter its
    IP address in a web browser and you''ll see the NAS4Free WebUI. The default username
    is ''admin'', with password ''nas4free''.


    ![](img/55f2495ee0f271affc0b7194535f335f_46_5.png)


    # Back up your NAS4Free


    Again, you can use Time Machine to share your NAS4Free drive via AFP (Apple File
    Protocol). In the web GUI, go to Services/Groups & Groups, click the ''+'' in
    the Groups list and Add Classes. Then Click Users, then ''+'' and fill the fields,
    filling the Group as you want. Go to Services/AFP and click Shares. Click ''+'',
    add a name and comment, click the ''Path...'' and choose your share folder and
    optional folder. Disable automatic disk discovery and choose Time Machine. Then
    click OK, click both authentication options, then Save and Restart. Now, from
    your Mac, go to Time Machine preferences, click Select Disk, and enter the address
    `smb://NAS4Free` to connect, and you''ll see your NAS4Free folder.


