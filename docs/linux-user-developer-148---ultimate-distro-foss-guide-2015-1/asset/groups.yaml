    # 问题与解答


    解决您所有的技术问题

    Q/A


    这是一个从 tar 包中提取的可运行 HPLIP。虽然它运行在 Slackware 系统上，但参数非常标准，你可能会发现它们用：


    ```bash

    /config/

    --prefix=/usr

    --libdir=/usr/lib$LDPURFFIX/

    --with-backend=$usr/

    --with-cups=/usr/lib/cups

    --libdir=$LDPURFFIX/cups/filter

    --sysconfdir=/etc

    --docdir=/usr/share/hplip

    --with-hplip-version

    --with-hp-cupdir=/usr/cup/hp

    --enable-hplip-install

    --enable-shadow-build

    --enable-ghost-build

    --enable-fax-build

    ```


    # 这些配置参数将生成一个安装了 hpgijs 的完整启动 HPLIP


    ```bash

    --enable-fomatic-drv-install

    --enable-network-build-by-cups

    --enable-qt4

    --enable-policykit

    --build-shared-libcups-linux

    --enable-cups-psd-install

    --enable-linux

    ```


    （这样你就不需要再构建独立的版本了）。

    还有其他你应该记住的事情，例如记住带有 setup- 前缀的 H-P 设备。


    然而，你可能实际上想忽略那两行包含 LDPURFFIX 的内容（整个脚本决定了将使用的系统库位置，例如使用 32 位系统或 64 位系统）。


    查看上面的链接并向下查看关于这些问题的答案（该文档实际上写得很好），你可以从上面的配置参数中下载最新版本。如果你有一个可以用来测试的机子，那就更好了。


    这些配置参数将生成一个安装了 hpgijs 的完整启动 HPLIP


    希望这些有所帮助。


    # 音频重采样


    Intel Edison 已由 Active Robots 提供


    我有几十个 flac 文件可以在 Ampeg 以及其他正规播放器上播放，但在我的 Sony 设备上无法播放，因为采样率太高。我的大部分是 1784 kbps/48000
    Hz。这让我了解了它支持的内容，即我对这些文件进行重采样，以便我的 Sony 系统可以简单地使用它们：


    - $ flac -sampler=44100 -out=(file.flac) [infile.flac]


    但显然 flac 在不包含的情况下无法编码，但当我检查文件时，它们仍然是 24bit/48kHz。频率：Linux 操作系统 SUSE 13.2 已顺利收到，感谢建议。


    George


    啊，开源软件和可定制电脑的优势。这至少对于 Sony 提供的良好的 FLAC 来说是这样，所以你不会损失任何明显的质量。至于实际转换文件，你可以在终端中运行
    ffmpeg 来，使用类似下面的命令：


    ```bash

    $ ffmpeg -i [input].flac -ar 44100 -sample_fmt s16 [output].flac

    ```


    Edison 是一个超智能的计算平台，将改变你看待嵌入式电子的方式。Edison 融合了大量技术，同时提供了与你常用的单板计算机相同的稳健性，并且它运行在
    Linux 上。


    ![](img/55f2495ee0f271affc0b7194535f335f_90_0.png)


    由 Intel! Atom™ SoC 双核 CPU 以及集成 WiFi、蓝牙 LE、闪存存储和一个 70 针连接器驱动，用于连接各种多功能的轻量化“区块”模块，这些模块可以相互堆叠。难怪这个小家伙能如此降低电子产品的准入门槛！


    使用使用通配符 (*) 或脚本对你所有的 Sonos 文件进行批量处理。


