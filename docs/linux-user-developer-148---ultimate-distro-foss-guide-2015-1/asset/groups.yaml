    # 2015 终极发行版与开源软件指南


    探索每个类别中最佳的免费软件


    ## 特性


    ## 最适合的发行版...


    ### 企业级


    对于公司而言，Linux 可以显著降低 IT 基础设施的总体拥有成本，但哪种发行版脱颖而出呢？


    ### SUSE Linux 桌面/服务器


    在面向企业群体的桌面发行版方面，有两个名字高出于众：SUSE 和红帽（Red Hat）。它们都提供了专门标记为“企业 Linux”的桌面和服务器发行版，并都通过多种商业支持为其产品提供。


    企业版还提供典型的需求支持，这是其利润来源。作为直接的商业支持，该公司提供各种形式的技术援助。SUSE Assist 是 SUSE 支持服务上的明珠，为无法负担专专家的公司提供来自专业顾问的上门服务。


    ![](img/55f2495ee0f271affc0b7194535f335f_20_0.png)


    ## 其他替代发行版


    ### 红帽企业版 (Red Hat Enterprise)


    与 SUSE 类似，红帽企业 Linux 提供服务器、桌面和移动版，并拥有包括苏黎世联邦理工学院在内的健康客户群。支持响应迅速，而且他们在全球范围内提供开发设施。


    ![](img/55f2495ee0f271affc0b7194535f335f_20_1.png)


    ### OpenSUSE


    OpenSUSE 是由 SUSE 赞助的免费完整版 Linux。它提供了出色的合同支持甚至提供了服务器功能。


    ![](img/55f2495ee0f271affc0b7194535f335f_20_2.png)


    ### Ubuntu


    与红帽一样，Ubuntu 背后的公司提供不同的支持合同和行动，具有丰富的软件兼容性供选择。


    凭借像 Linux Store 和 Exchange Depot 这样多样化的客户，SUSE Linux Enterprise 充满了功能，提供了服务器管理的自动化支持，而
    SUSE Cloud 提供了基于 OpenStack 的云基础设施，使得服务变得简单。


    作为其桌面和服务器变体，SUSE Linux Enterprise 带有附加扩展选项，适用于点站点环境和对实时性能有高要求的高可用环境。


    稳定性和支持是有代价的；与社区驱动的 OpenSUSE 相比，SUSE Linux Enterprise 的软件包较少，但它包含的许多软件包非常适合专业环境。


    SUSE 软件包中的最后点笔是 SUSE Studio，它为企业用户提供了自定义 SUSE 发行版的方法，并可以从 Live CD 镜像甚至根据其需求定制弹性云
    (EC) 实例进行创建。


    当 SUSE 出现时，它的质量与红帽并列，两者都在尝试相互竞争，在投入之前，请务必查看对方提供了什么。


    > 在 SUSE 之上是一个高质量的发行版，为其需求量身定制


    ## 最佳工具


    | | | | | | | |

    |---|---|---|---|---|---|---|

    | | | | | | | |

    | | | | | | | |

    | | | | | | | |

    | | | | | | | |

    | | | | | | | |


    ### Puppet


    一种开源的配置管理实用程序，旨在支持类 Linux 和 Windows 的异构网络。对于企业级基础设施的系统管理员来说，Puppet 是一个强大的工具。


    ### Chef


    作为 Puppet 的替代品，基于 Ruby 的 Chef 与 AWS、Google Cloud Platform 等云环境良好集成，并作为本地安装程序用于管理基础设施。


    ### Docker


    Docker 允许在 Linux 上轻松、快速地部署软件容器。与任何虚拟机相比，Docker 容器的开销要低得多。


    ### Dlyn


    Dlyn 为那些采取积极安全措施的人设计，旨在成为黑客群的强硬工具，因为它提供了审计 Linux 发行版的方法，还可以检查安全漏洞和配置错误。


    ### SUSE Studio


    虽然 SUSE Studio 最常被 SUSE 团队使用，但旨在构建和运行任何 Linux 发行版的系统镜像，并可以使系统管理员的工作变得更容易。


    ![](img/55f2495ee0f271affc0b7194535f335f_20_3.png)


    21 www.linuxux.com


    ## 特性


    ## 最适合的发行版...

    安全


    ## 其他替代发行版


    ### BackBack Linux


    对于不需要 AI 支持的人来说，BackBack 发行版是 Ubuntu 的极佳选择，具有轻量级的 X 窗口管理器。BackBack 非常强大，并有一系列预装实用程序。


    当主流媒体只让其读者担心黑客攻击时，专注于安全的发行版是“好人”至关重要的工具。


    ### Kali Linux


    多年来，BackTrack Linux 一直一直是安全渗透测试的 Linux 发行版之王。然而在2013年，该项目分支出了 Kali。


    Kali Linux 由 Offensive Security 的 Aaron 和 Devon Kennedy 创建并维护，Kali 是 BackTrack
    的底层重写，是其继任者。


    Kali 基于 Debian，预装了大多数流行的安全工具，包括网络嗅探器和 Wireshark、端口扫描工具 nmap、密码破解器 John Reilly
    以及用于无线网络渗透测试的 Airc-ng 套件。与 Ubuntu 相比，它的仓库有更多选择。


    Kali 与竞争对手的不同之处在于兼容性；包括 32 位和 64 位架构。他们一直致力于将 Kali 引入更流行的桌面。它提供了适用于树莓派和各种手机等不同设备的构建。


    然而，最令人印象深刻的特征可能是 Kali 子项目 NetHunter。目前适用于 Android 智能手机和平板，KaliHunter 直接提供各种渗透工具——这是一个桌面测试的绝佳工具，无需随身携带一台顶级笔记本。


    Kali 既可以安装在硬盘上，也可以从内存和另一个桌面安装，这非常适合日常使用。它是任何网络安全人员的显而易见的选择——这对于脚本小子来说非常简单——非常到位。


    ![](img/55f2495ee0f271affc0b7194535f335f_21_0.png)


    ### REMUX


    用于网络渗透测试的-BackBack 逆向工程工具。提供了用于内存调查、文档分析以及网页内容的分析工具。


    | 桌面环境 | 7 |

