    # Create and manage Linux containers with Elastichosts


    ### Advisor

    **Rob Zweetloot models complex systems and is a web developer in Python, Django
    and PHP.** He learns by experimenting


    Containers are the future of virtual machines, find out how to set up one here


    **Virtualisation on the cloud is changing.** No longer do you need to create virtual
    hosts to hold your systems; you can now use Linux containers to create distros
    with more containers than any virtualised system. Thanks to cgroups in the kernel,
    specific instances can share the kernel while they all use their own resources,
    which allows for more efficient resource use while running the containers over
    virtual machines.


    In this tutorial we will be showing you how to set up, maintain and use containers
    via Elastichosts, working through the basics of this system that you may not be
    familiar with yet. It offers many features that you can try out before you commit
    to using it. You''ll need ssh installed on your machine, and a way to access a
    web browser to set it up all at once - then you can maintain it mostly via the
    command line.


    # Resources


    Elastichosts accountichosts.co.uk'
