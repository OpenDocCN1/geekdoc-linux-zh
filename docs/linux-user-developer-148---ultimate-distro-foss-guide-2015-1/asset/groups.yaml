    # # Remotely control your Raspberry Pi robot


    ![](img/55f2495ee0f271affc0b7194535f335f_68_0.png)


    # 01 Set up the Raspberry Pi


    You''ll need an original Raspberry Pi Model B for the Rapiro, as the B+ needs
    you to trim the connections in the Rapiro for it to fit. Install Raspian on it
    and perform the usual `apt-get update && sudo apt-get upgrade` before doing a
    firmware upgrade to update all the software.


    # 02 Set up wireless


    Keep Raspian in command line-only boot (or set it to boot in command line but
    stay on the desktop and use the graphical utility to set the wireless dongle to
    connect to your network.


    # 03 Get the IP address


    Open terminal and type `ifconfig` - it will spit out the connection details for
    networking. Specifically, you want to look for yours and its relevant IP details.
    Make a note of this as you will be using it to connect to the Raspberry Pi.


    # 04 Connect remotely


    on your PC or laptop and begin to test out the Raspberry Pi. Open a terminal and
    type:


    ```

    $ ssh pi@[IP address]

    ```


    You may have to enter the keys on your machine, but enter the user password (raspberry)
    and you''ll be into the Raspberry Pi''s system.


    # 05 Install extra software


    To send the signals to the Rapiro from the command line you need to get Micicom.
    This is only required for control as Python has a special library for this. You
    can install it on the command line using SSH:


    ```

    $ sudo apt-get install

    ```


    # 06 Install into Rapiro


    Turn off and disconnect the Raspberry Pi from all the cables. Next, remove the
    screws holding Rapiro''s head together and take the front off. The Raspberry Pi
    delicately clicks into the base of the head, with the ports poking out the back
    of the head - hold the back as it''s not attached any more.


    ![](img/55f2495ee0f271affc0b7194535f335f_68_1.png)


    # 07 Connect the Raspberry Pi


    The spare Pi left inside Rapiro''s head can be connected to the Raspberry Pi to
    both power and allow for control from the Pi. Refer to the image to see how it''s
    attached, with the black cable on the opposite side of the edge of the pins.


