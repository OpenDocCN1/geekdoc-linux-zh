    # 使用 Elastichosts 创建 Linux 容器

    设置和管理 Linux 容器所需的所有知识


    ## 教程


    ![](img/55f2495ee0f271affc0b7194535f335f_34_0.png)


    ## 灵活云服务器

    免费专家支持与尖端技术


    ### 01 设置您的账户

    使用图形界面登录系统并使用 elastichosts.com 创建账户。试用账户有效期为五，无需添加支付信息即可使用，因此试用结束后不会有意外付费。


    ### 02 创建您的容器

    使用新账户登录，服务器将准备好供您添加虚拟机和容器。在界面上找到“添加 (Add)”按钮，并在输入服务器详情之前选择“服务器 (容器)”。为它命名并选择一个要使用的镜像。


    ### 03 布局

    安装完成后，您将剩下两个对象——服务器和文件存储空间。你会注意到，默认情况下不占用存储空间，发行版层层在容器外部处理。目前容器也处于关闭状态。


    ### 04 设置静态 IP

    在我们切换到容器之前，我们可以创建一个静态 IP ——再次点击“添加”并找到静态 IP 选项。创建完成后，在服务器详情旁边找到网络选项 —— 从下拉菜单中选择此新
    IP。


    ### 05 启动服务器

    设置好 IP 后，就可以首次启动服务器。按下电源开关，服务器将非常快速且平稳地启动。注意，某些设置不会被更改。


    ### 06 SSH 详情

    连接到服务器最简单的方法是通过 ssh 获取。如何连接特定 ssh 的详情可以在服务器的“连接 (Connect)”菜单中找到。查看服务器详情旁边以了解如何连接。


    ### 07 建立连接

    打开终端与服务器建立 ssh 连接。默认使用用户（或 root），因此您可以使用如下命令建立连接：


    ### 08 使用 ssh

    进入内部后，您可以使用 ssh 使用任何其他命令行。通过 `ifconfig` 查找网络设置，使用包管理器安装软件包（正如您预期的功能 Linux 发行版），而这只是冰山一角。


    ```

    $ ssh user@host

    ```


    ### 09 关闭服务器

    您可以在所使用的相应登录界面中操作，也可以通过图形界面的按钮进行。使用命令和强制电源。若要使用终端关机，请使用 `sudo shutdown -h now`；若需要软重置，请重启。


    ### 11 通过 WebDAV 连接

    在您的管理器中，前往并连接到安全 (https) WebDAV。输入服务器上 https 之后的地址，将文件夹选择为本地共享，并输入存储的用户名和密码。


    ### 12 本地存储

    在创建服务器后，您也可以更改服务器可用的资源量。关闭服务器并返回服务器配置菜单，可以在那里修改 RAM 和 CPU 使用率、配额以及开放或特定选项。


    ### 14 其他设置

    在创建服务器后，您也可以更改服务器可用的资源量。关闭服务器并返回服务器配置菜单，可以在那里修改 RAM 和 CPU 使用率、配额以及开放或特定选项。


    ### 15额外功能

    我们让使用 Datawrapper 进行数据可视化尽可能简单。如果您在 Excel 或 Sheets 中工作，只需选择表头并粘贴即可。


