    # 教程


    **Rob Zwetsloot** 是一位复杂系统建模师，也是一名精通 Python、Django 和 PHP 的 Web 开发者。他热爱实验计算。


    # 远程控制你的 Raspberry Pi 机器人


    通过网络控制或使用 PS3 控制器来操控 Rapiro，无需再被束缚在笔记本电脑旁。


    Rapiro 是一个酷酷的小机器人。上个月我们在为大机器人项目玩弄它时，我们注意到它的扩展和定制潜力比任何其他机器人都更简单、更令人满意。本着这种精神，我们将改进我们的
    Rapiro 来完成一些惊不起的事情。这要归功于万用的 Raspberry Pi 和一些 Python 知识。


    这个月，我们将让它离开电脑，利用 Raspberry Pi 的功能和它自带的小组 AA 电池让它能够自由行走。我们还将教你如何使用 PS3 手手柄来控制它，这样你就不需要不断通过接口发送命令了。


    # 你需要什么


    - Raspberry Pi Model B

    - Rapiro

    - 兼容的无线接收器

    - PS3 控制器

    - 迷你 USB 数据线


    ![](img/55f2495ee0f271affc0b7194535f335f_67_0.png)


    # # 远程控制你的 Raspberry Pi 机器人


    ![](img/55f2495ee0f271affc0b7194535f335f_68_0.png)


    ### 01 设置 Raspberry Pi


    Rapiro 需要一个原装的 Raspberry Pi Model B，因为 B 型需要修剪连接以适应 Rapiro 的安装。在它上安装 Raspian，并在进行固件升级之前执行常规的
    `apt-get update && sudo apt-get upgrade` 以更新所有软件。


    ### 02 设置无线网络


    让 Raspian 保持在仅命令行启动模式（或将其设置为命令行启动但保持留在桌面上，并使用图形化工具将无线接收器设置为连接到你的网络）。


    ### 03 获取 IP 地址


    打开终端并输入 `ifconfig` - 它将输出网络详情。具体来说，你需要查找你自己的以及相关的 IP 详情。记下它，因为你将用它连接到 Raspberry
    Pi。


    ### 04 远程连接


    在你的 PC 或笔记本电脑上并开始测试 Raspberry Pi。打开终端并输入：


    ```

    $ ssh pi@[IP address]

    ```


    你可能需要输入密钥（raspberry），然后你就进入了 Raspberry Pi 系统。


    ### 05 安装额外软件


    为了从命令行向 Rapiro 发送信号，你需要获取 Micro。这是必须的，因为 Python 有一个专门为此的库。你可以在命令行中使用以下命令安装它：


    ```

    $ sudo apt-get install

    ```


