    # 教程


    **Rob Zwetsloot** 是一位复杂系统建模师，也是一名精通 Python、Django 和 PHP 的 Web 开发者。他热爱实验计算。


    # 远程控制你的 Raspberry Pi 机器人


    通过网络控制或使用 PS3 控制器来操控 Rapiro，无需再被束缚在笔记本电脑旁。


    Rapiro 是一个酷酷的小机器人。上个月我们在为大机器人项目玩弄它时，我们注意到它的扩展和定制潜力比任何其他机器人都更简单、更令人满意。本着这种精神，我们将改进我们的
    Rapiro 来完成一些惊不起的事情。这要归功于万用的 Raspberry Pi 和一些 Python 知识。


    这个月，我们将让它离开电脑，利用 Raspberry Pi 的功能和它自带的小组 AA 电池让它能够自由行走。我们还将教你如何使用 PS3 手柄来控制它，这样你就不需要不断通过接口发送命令了。


    # 你需要什么


    - Raspberry Pi Model B

    - Rapiro

    - 兼容的无线接收器

    - PS3 控制器

    - 迷你 USB 数据线


    ![](img/55f2495ee0f271affc0b7194535f335f_67_0.png)


    # 远程控制你的 Raspberry Pi 机器人


    ![](img/55f2495ee0f271affc0b7194535f335f_68_0.png)


    ### 01 设置 Raspberry Pi


    Rapiro 需要一个原装的 Raspberry Pi Model B，因为 B 型需要修剪连接以适应 Rapiro 的安装。在它上安装 Raspian，并在进行固件升级之前执行常规的
    `apt-get update && sudo apt-get upgrade` 以更新所有软件。


    ### 02 设置无线网络


    让 Raspian 保持在仅命令行启动模式（或将其设置为命令行启动但保持留在桌面上，并使用图形化工具将无线接收器设置为连接到你的网络）。


    ### 03 获取 IP 地址


    打开终端并输入 `ifconfig` - 它将输出网络详情。具体来说，你需要查找你自己的以及相关的 IP 详情。记下它，因为你将用它连接到 Raspberry
    Pi。


    ### 04 远程连接


    在你的 PC 或笔记本电脑上并开始测试 Raspberry Pi。打开终端并输入：


    ```

    $ ssh pi@[IP address]

    ```


    你可能需要输入密钥（raspberry），然后你就进入了 Raspberry Pi 系统。


    ### 05 安装额外软件


    为了从命令行向 Rapiro 发送信号，你需要获取 Micro。这是必须的，因为 Python 有一个专门为此的库。你可以在命令行中使用以下命令安装它：


    ```

    $ sudo apt-get install

    ```


    ### 06 安装到 Rapiro 中


    关闭并断开 Raspberry Pi 的所有线缆。接下来，拆下固定 Rapiro 部的螺丝取下正面。Raspberry Pi 卡在头部的底座上，端口从头部的背面伸出，因为它已经不再连接了。


    ![](img/55f2495ee0f271affc0b7194535f335f_68_1.png)


    ### 07 连接 Raspberry Pi


    留在 Rapiro 头部内部的备用 Pi 可以连接到 Raspberry Pi，用于供电并允许从 Pi 进行控制。参考图像查看如何用引脚边缘另一侧黑色电缆进行连接。


    ![](img/55f2495ee0f271affc0b7194535f335f_68_2.png)


    # 教程


    ![](img/55f2495ee0f271affc0b7194535f335f_69_0.png)


    上面的操作需要一点练习，但模拟摇杆的使用非常有趣。


    ### 08 重新连接头部


    搞定！一旦插好 Raspberry Pi，它就准备就绪了。将头部装回身上，你就可以通过 Pi 开始远程控制 Rapiro。如果你想用外部电源为 Rapiro
    电，请保持头部打开，因为你需要同时为 Pi 电。


    ### 12 解析命令


    该命令分为四个部分：LED 灯光的 RGB 值和代表毫秒的 T 值。我们将绿色设置为最大（255），另外两种颜色设为 0，而 T 为 10。代码周围非常简单。


    ### 09 首次测试


    开启 Rapiro 电源看看一切是否正常工作。Raspberry Pi 的灯亮了吗？最常见的问题是你可能把 Raspberry Pi 的线插反了，这意味着你必须完全断开它来修复。


    ### 13 举起右手


    让我们做些更有趣的事情，移动 Rapiro 身体里的一个舵器。我们可以通过向手臂发送几个命令来抬起右手，所以：


    ```

    $ echo "M6" | sudo microcom -b 57600 -o -d /dev/ttyAMA0

    ```


    ```

    $ echo "M6" | sudo microcom -b 57600 -o -d /dev/ttyAMA0

    ```


    ### 10 第一批命令


    如果你的 Raspberry 现在工作正常，且 Raspberry Pi 正在供电，那么它就可以工作了。


    ### 14 命令拆解


    （此处省略重复部分）


    # 远程控制你的 Raspberry Pi 机器人


    （此处省略重复部分）


    # 17 准备工作


    抓住 PS3 控制器和电缆，像牵绳子一样提醒它。插入 Pi 并等待几秒。


    ```

    $ python rapiro_ver_1.py

    ```


    # 18 移动 Rapiro！


    好的，这是最酷的部分：模拟摇杆控制双臂，拉动扳机抓住手。L 和 R 键控制前后移动并原地旋转。


    # 19 代码限制


    代码限制了同时执行的动作数量，如果尝试太复杂的操作会导致缓冲区溢出。没关系，你可以立即重新运行代码。


    # 真正无线


    # 20 修改代码


    代码要求身体的特定动作。对于我们在上一个问题遇到漂移问题的 Raspberry，你也可以添加这个。在代码选择部分找到 com 行并修改它：


    ```

    com.write("#?")

    ```


    # 串口代码


    | S | 描述 |

    | :--- | :--- |

    | S00 | 头部，转动 |

    | S01 | 腰部，转动 |

    | S02 | 右肩，前后移动 |

    | S03 | 右臂，抬起放下 |

    | S04 | 右手，开合 |

    | S05 | 左肩，前后移动 |

    | S06 | 左臂，抬起放下 |

    | S07 | 左手，开合 |

    | S08 | 右脚，转动 |

    | S09 | 右脚，转动 |

    | S10 | 左脚，转动 |

    | S11 | 左脚，转动 |

    | R | 红色 LED，255 |

    | G | 绿色 LED，255 |

    | B | 蓝色 LED，255 |

    | T | 动作持续的毫秒数 |


