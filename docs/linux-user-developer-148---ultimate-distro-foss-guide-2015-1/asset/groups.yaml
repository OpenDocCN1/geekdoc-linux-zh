    airflow, performing well.


    # Pros


    Unlike most eight-core ARM chips, the A8chip has the ability to run all cores
    simultaneously. On ARM''s big.LITTLE architecture there are four low-power Cortex-A5
    cores. In mobile use, the big.LITTLE architecture is designed to save power by
    spinning down the high-power cores during times of competition the chip can also
    rather impressively opt to run all eight cores at the same time for a serious
    boost to its multi-threaded performance.


    The board itself is a completely new design. Those who had used previous models
    as network-attached storage devices will be disappointed by the switch to the
