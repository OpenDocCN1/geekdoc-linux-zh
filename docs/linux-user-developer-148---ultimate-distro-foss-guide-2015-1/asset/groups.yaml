    # Review


    ![](img/55f2495ee0f271affc0b7194535f335f_83_0.png)


    # MINI PC


    # MIPS Creator CI20


    A Pi competitor using MIPS chip with potentially a lot more power and much more
    users for makers and hackers


    It’s rare that we get something with seemingly much promise that we become utterly
    defeated and disappointed by it. Unfortunately, the CI20 is just this type of
    device and first tell you in this review that we don''t really do the promise.

    If also wasn''t clear, we were actively looking forward to the CI20 could only
    double the very slow 1.2 GHz processor and a full GB of RAM on its Ingenic-based
    system-on-a-chip. It has native Wi-Fi and Bluetooth, so much so that it performed
    as well as the Pi would be happy. For makers, there are a few more random I/O
    ports as well as a 25 GPIO and UART ports dotted around. It should be superior
    to the original Model B Raspberry in every way.


    Coming pre-installed on the CI20 is a slightly modified version of Android 4.4,
    which, to be fair, is still impressive; usually we''d expect to see a much older
    version of Android. It boots well, so for the CI20 to boot into Android, however,
    upon completing boot we found the bare selection of apps available, and no access
    to the Play Store. With custom versions of Android, the CI20 does not allow access
    to the Play store and install apps like Gmail. Along with the Chrome calendar,
    three benchmarking apps and a file explorer; the explorer at least allows you
    to sideload apps


    Performance-wise, it''s only okay. It was able to play high definition YouTube
    videos straight with no issues, although the audio was not working via the HDMI
    port.'
  - '[PAGE 84]


    # # MIPS Creator CI20

    Has the Raspberry Pi met its match?


    # ## Technical specs


    | Operating System | Android 6.4-0 or Debian 7 |

    | Processor | Dual core 1.2 GHz MIPS32 |

    | Memory | 1GB DDR3 |

    | Storage | 4GB flash memory |

    | Dimensions | 90mm x 95mm x 14mm |

    | Power | 5V external supply |

    | Ports | 2x USB 2.0, 1x HDMI, Ethernet, Wi-Fi, Bluetooth, 3.5mm jack |

    | GPIO | 2x UART, 25x GPIO, 2x SPI, I2C, ADC, expansion headers, 14-pin ETAG connector
    |

    | Price | £50/$69 |


    ![](img/55f2495ee0f271affc0b7194535f335f_84_0.png)


    # ## Also consider


    ![](img/55f2495ee0f271affc0b7194535f335f_84_1.png)


    ![](img/55f2495ee0f271affc0b7194535f335f_84_2.png)


    ![](img/55f2495ee0f271affc0b7194535f335f_84_3.png)


    ### Banana Pi

    BPI-M

    The Banana Pi was the board that seemed like the cheap-easy-coaster of the Raspberry
    Pi, but turned out awful. It also has the Wi-Fi and GPIO pins like the CI20 mini,
    and is just as good for many projects. bananapi.org


    **Top** There''s a built-in infrared receiver


    **Left** As well as 25 GPIO pins, there are also two UARTs


    **Right** Two right-angled USB ports


    ![](img/55f2495ee0f271affc0b7194535f335f_84_4.png)


    actually had to connect via an Ethernet cable as the Wi-Fi was extremely weak,
    unlike just the router only a few metres away in the same room.


    Instant Debut in slightly better performance than booting in just a couple of
    minutes and making better use of the HDMI port. In terms of performance, this
    version of Debian is optimized for the Pi, running roughly the same performance.
    While we were mentioned that this was enough for us, there was the provision that
    we could easily install. Installing is limited, having only the choice of the
    aforementioned Debian and Android images. To install them requires a bit of wizardry,
    navigating to the specific locations and pressing the generically labelled “button”
    during boot time to allow installation to the onboard flash.


    Overall, it''s not the best piece of hardware. The MIPS architecture is badly
    supported in this area and the unoptimistic distros and OSs really showed this.
    For more


    day-to-day usage, it doesn''t really hold the candle to the excellent Raspberry
    Pi. For making and playing projects, it doesn''t have of an advantage if you care
    about the price, however, although it is a little bit bigger and more awkwardly
    shaped.


    It''s definitely no Raspberry Pi clone.


    # ## Rob Zwetski


    # ## Summary


    The CI20 really seems to have used up over of the other Pis and single computer
    boards out there, and the price is justified. The hardware and limited operating
    system result in a lackluster piece of kit that really had a lot of potential.


    ![](img/55f2495ee0f271affc0b7194535f335f_84_5.png)


    # ## Raspberry Pi Model B+ EZ4


    The revision of the Raspberry Pi design, which has a faster processor, can''t
    quite match the similar price. In comparison, however, is making the jump from
    jackbacks to better projects in cases that are easy to come


    ![](img/55f2495ee0f271affc0b7194535f335f_84_6.png)


    # ## More information


    rs-www.linux.co.uk


