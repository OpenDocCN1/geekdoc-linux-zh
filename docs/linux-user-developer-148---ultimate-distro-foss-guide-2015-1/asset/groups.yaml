    所有 2ndQuadrant 的培训课程均由在开发和管理方面拥有多年经验的 PostgreSQL 首席授授。目前提供的课程包括 Linux 下的 PostgreSQL、DBAS、恢复以及
    PostgreSQL 实现。对于想要学习 PostgreSQL 的人员，还有一门为期五天的密集课程。欲了解更多信息，请访问 www.2ndquadrant.com/en/。


    英国气象局在对替代方案进行彻底评估后，将 PostgreSQL 选为其首选 RDBMS。这一决策受到了 2ndQuadrant 培训的影响。数据服务组合团队负责人
