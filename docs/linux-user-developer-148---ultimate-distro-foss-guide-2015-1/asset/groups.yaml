    你可以在 Live CD 或 USB 镜像中找到 NAS4Free 文件，取决于你想从 CD 还是 USB 启动。还要为 PC 选择正确的版本：NAS4Free
    (64位) 或 x86 (32位)。


    # 02 启动它


    在你的旧电脑上设置 BIOS 先从 CD 或 USB 盘启动后，插入 NAS4Free。它将通过启动过程，这可能需要一段时间。


    # 05 配置 LAN 接口


    一旦驱动器重启，你将进入控制菜单。这次，输入 1 选择你的以太网接口（来自一个）。


    # 06 配置 IP 地址


    回到控制菜单，输入 2 配置你的 IP 地址。输入 No，然后回车接受子网掩码。使用自己的 IP 地址作为默认网关并输入 DNS 服务器。


    # 03 选择安装方法


    最后你输入 9 从 live CD/USB 安装。如果你想从 USB 闪存运行操作系统，则选择 2 安装到 PC 硬盘。


    # 04 安装到磁盘


    在下一个菜单点击 OK，在方法和目标菜单，然后对交换分区说 No（除非你的内存非常小）；NAS4Free 将安装在选定的磁盘上。注意数据分区参数。


    ![](img/55f2495ee0f271affc0b7194535f335f_46_4.png)


    # 07 访问 WebUI


    通过基本设置，你现在可以访问你的 NAS4Free 服务器了。在浏览器中输入它的 IP 地址，你将看到 NAS4Free WebUI。默认用户名为 ''admin''，密码为
    ''nas4free''。


    ![](img/55f2495ee0f271affc0b7194535f335f_46_5.png)


    # 备份你的 NAS4Free


    再次，你可以使用 Time Machine 通过 AFP（苹果文件协议）共享你的 NAS4Free 驱动器。在 Web GUI 中，前往 Services/Groups
    & Groups，在 Groups列表中点击 ''+'' 并添加类别。然后点击 Users，再点击 ''+'' 并填写字段，按你的意填写 Group。前往
    Services/AFP 并点击 Shares。点击 ''+''，添加名称和注释，点击“Path...” 选择你的共享文件夹和可选文件夹。禁用自动磁盘发现并选择
    Time Machine。然后点击 OK，点击两个身份验证选项，然后保存并重启。现在，从你的 Mac 进入 Time Machine 偏好，点击选择磁盘并输入地址
    `smb://NAS4Free` 进行连接，你将看到 NAS4Free 文件夹。


