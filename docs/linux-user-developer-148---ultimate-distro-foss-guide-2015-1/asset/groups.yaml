    ### Knoppix

    Knoppix 仍然是顶级的实时发行版之一，尽管随着其他发行版的加入，竞争已变得激烈。Knoppix 长期以来保持流行，同时随着时代的变化在其他领域进行更新。


    Knoppix 将自己定位为发行版所提供的一切内容的展示，你所获得的发行版多样性意味着你可以轻松访问 Linux 上几乎所有已知的自由软件（FOSS），而无需安装——它包含了一应有的一切。


    由于包含了大量的软件，Knoppix 的启动和运行速度很快。这是由于软件在“过程中”压缩和解压缩的方式，使得 2 GB 的 USB DVD 可以随时包含任何内容。Knoppix
    还有几张备忘录，让你能够以不同的屏幕和显示选项启动，或者由于某些原因在各种计算机上进入 Linux。它不是系统管理员工作的最佳选择，但可以完成许多仅限 Linux
    的任务。


