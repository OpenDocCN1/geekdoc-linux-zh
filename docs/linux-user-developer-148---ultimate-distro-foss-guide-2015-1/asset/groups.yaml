    条款与细则

    两位赢者将获得一张价值高达 £2,750 的 2ndQuadrant 培训券。培训券仅允许他们预订一门时长最长五天且价值不超过 £2,750 的课程，且不能与任何优惠或折扣同时使用。课程预订后，即使课程价格上涨，培训券依然有效。赢者必须在
    2015 年 7 月 1 日之前预订计划课程。课程视供应情况而定，并在伦敦举行。参赛者必须年满 18 周岁。条款与细则可能会更改。


    ## 通过提升知识获取成果


    我们优秀的课程提供无与伦比的培训。


    100% 的客户对我们的 PostgreSQL 培训计划评为优秀。预留您的位置，获取核心代码的专家知识。


    +44 (0)870 766 7756

    2ndquadrant.com/knowledge


    2ndQuadrant + 专业 PostgreSQL


    # 开源

    您的 Linux 新闻与观点来源


    # 自由软件专栏


    ## 系统 —— 无论好坏


    Systemd 帮助管理 Linux 发行版中日益增多的进程。这是一个值得的目标，但事情绝从未那么简单……


    规范 Linux 跨日益增多的系统和进程的配置。希望这会让每个人——开发者、发行版厂商、制造商和 Linux 管理员——的生活变得更轻松。当然，这并不那么容易。


    与其最小化已经变成现状的进程问题，正如一位 Linux 评论者所说，“系统、设备管理器、登录管理器、DNS 解析器、控制台终端模拟器、包管理器工具包”，在这种情况下，Debian
    一直在使用自己的启动程序。Debian 选择将 systemd 作为默认启动选项是一个民主选择，并且仍然是一个选项。一组由他们自己资深 Unix 管理员组成的开发者宣布了
    Debian 的分支，命名为……


    抱怨之处是 systemd 是单体架构，而具有单点故障的单体进程不是我的做事方式。这种类型的问题是一个进程的故障就能导致整个系统崩溃，这使我们处于风险之中。


    Debian 使用 systemd 的决定是为了开放和民主。有些人比其他人更具这种精神。Debian 开发者以乐于倾听和保持社区团结而闻名。开发者们非常积极，并且在自己的做事方式和技术差异上是正确的，有时甚至不作任何妥协。


    Richard Hillary 为多种出版物撰写关于 Linux、数字权利和自由软件的文章。


    > “我喜欢更快的启动时间的想法，但也喜欢使用可靠的脚本来系统的启动”


    普通的 Linux 用户可能会被旨在夺回 init 守护 shell 并启动 Ubuntu initramash 的争论和愤怒所吓倒。Linux 内核的脚本是其启动程序的经过测试的选项，并被许多人视为可以在内核处编写的需要重启的脚本。


    随着 Linux 的增长，流行系统和进程的数量成倍增加，发行版也变得多样化。移动设备与专用服务器的预期非常不同，其实现也有自己的要求。在一些关注的早期开发团队中，Debian
    开发者已使用集成启动程序来处理未来实现的问题。Gnome 类似的也适用于 Wayland 和其他子系统。


    在我看来，用户并不希望一整天都在重启和配置文件，这似乎是一种非常陌生的控制系统的方式，并且为了在单一内核面前避免所有守护进程的故障。


    Debian 的 Linux 简单性经常被他人评判，有时并非如此，正如 Gnome 和 Wayland 开发者最近发现的那样。内核开发者并不是争论的焦点。大多数发行版都选择了它们，包括
    Debian 和 Ubuntu。


    大多数开发者知道 Linux 的某些部分具有价值及其有使用寿命。Gnome 为了被提升到基础，必须在接缝处失败。二十年后，在一个日益复杂的冲突系统和进程的世界，需要一个
    init 系统。它可能不完美，但他们会告诉我们正确的决定。


    ## “Devian 将是没有 systemd 的 Debian”


    '
