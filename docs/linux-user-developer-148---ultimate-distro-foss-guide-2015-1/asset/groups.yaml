    ## Cloud Foundry gets its own foundation


    The Linux Foundation to provide management and operations support


    The open source Cloud Foundry platform-as-a-service (PaaS) project has announced
    the formation of a new independent and non-profit foundation managed by a Linux
    Foundation Collaborative Project under a system.


    Cloud Foundry, the project has been announced, will improve and develop community
    participation. A major feature is a new supported source development that supporters
    claim offers a unique ''fast-track'' for commit rights. Coupled with a new certification
    program, details will be released in the next year, Cloud Foundry is a hopeful
    of improved community interaction.


    "Community participation accelerates concepts to maturity, and is increasingly
    being adopted as a way to deliver cloud-based solutions to customers," claimed
    Larry Carvalho, PaaS researcher at market analyst firm IDC of The Foundry formation
    "The announcement of the Cloud Foundry Foundation aims to improve transparency
    and technical innovation of the open source platform." The Foundation also comes
    with Intel joining as a Platinum member and Hotnorks as Gold members. New members
    include IBM, AppDirect, Brantube, Fujitsu, Miro, Capcom, and Toshiba''s Solutions
    division.


    ![](img/55f2495ee0f271affc0b7194535f335f_8_0.png)


    Above Cloud Foundry now has a non-profit foundation, managed by The Linux Foundation


    CONTAINERS


    ## COREOS launches Docker rival Rocket


    Looks to give Docker for its money


    The COREOS project has announced that it is building its own Docker-like runtime,
    dubbed Rocket, with a focus on composability, security and speed.

    Brandon Phillips, co founder and technical officer of COREOS, is a member of the
    Docker governance board, but has expressed disagreement with the current direction
    that Docker is taking. "A simple re-usable component is not how things are playing
    out. Docker now is building tools for launching cloud servers, systems for clustering,
    and images, running, uploading, downloading, and eventually overlay networking,
    all compiled into one monolithic binary primary as your root server," his team
    wrote in the Rocket project announcement. "We should stop talking about Docker
    containers, and start talking about the Docker Platform. It is not becoming the
    simple composable building we envisioned."


    Rocket, COREOS claims, is the opposite, and close to Phillips'' original vision
    for Docker. A preliminary version has been released on the company''s GitHub repository.
    The announcement on COREOS blog also states that Docker will be fully integrated
    with COREOS, as it is today.


    ![](img/55f2495ee0f271affc0b7194535f335f_8_1.png)


