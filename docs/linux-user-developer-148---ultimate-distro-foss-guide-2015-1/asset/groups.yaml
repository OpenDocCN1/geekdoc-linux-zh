    # Tutorial


    ![](img/55f2495ee0f271affc0b7194535f335f_41_0.png)


    # Build a Linux HTPC


    Set up the most powerful home theatre PC using a custom Linux setup, with tips
    on hardware and software.


    Some of the best commercial home theatre PCs and media centres are established
    and/or open source software. When it comes to controlling what you watch, people
    like to have a familiar interface and to get what they want. This is something
    like Kodi – XBMC is so popular, due to years of development, testing and maturing,
    it’s extremely easy to use and do/play many things without any extra setup.


    A lot of these solutions can lack customisation, and aren''t as open as what you
    create yourself in Linux. What we will show you is all the tutorials you need
    to create your own Linux software that can power your TV and watch all your shows,
    or play your music library in a pinch.


    We’ll be using Kodi to do this, but a lot of the tips can apply to any other HTPC
    software you would like to use.


    # Advisor


    Rob Zwetsloot models complex systems and is a web developer in Python, Django
    and PHP. He loves to experiment with computing.


    # Resources


    OpenELEC http://openelec.tv


    www.linuxuser.co.uk


