    | 性能 | 9 |

    | 安装 | 9 |


    ![](img/55f2495ee0f271affc0b7194535f335f_21_1.png)


    ## KALI LINUX


    Kali 之上已足够完整


    ## 最佳开源软件


    ### OpenVAS


    OpenVAS 由 Michael Boyle 创建，是一种用于发现漏洞的漏洞扫描器。它是一个开源项目，被安全专业人员用于测试系统。也被想要发现自己网络漏洞的个人使用。


    ### Metasploit


    Metasploit 是一个渗透测试框架。它允许你发现、利用和报告漏洞。它也被安全专业人员用于系统。


    ### Wireshark


    Wireshark 是一个网络协议分析器，允许你捕获并交互网络流量。它被用于故障排除、软件分析和安全分析。


