    # 为你的树莓派添加重置开关


    直接拔掉电源关闭树莓派是危险的。


    检查你的树莓派型号


    只有两个型号具有排针：Raspberry Pi B Rev 2 和 B+（to the left of the ''Raspberry Pi 2014''
    label）。 You will need to install the pins manually, however, as they are not preinstalled.
    Clearly this can cause problems. When faults cause the Raspberry Pi to crash,
    the simple fix is to add a simple reset function to the device. There are three
    ways this can be done: with a button, a motherboard jumper or a motherboard header
    connected to newly-soldered pins on the PH header on the Model B Rev 2 and this
    (this is the most complicated option). If you have an old Pi lying around, the
    reset button is already there and adding the connecting motherboard pins is achievable
    if you have a soldering iron. Otherwise, we recommend purchasing the parts alone,
    although we are aware that you''ll probably need to buy more pins than you''ll
    need. Christian Cawley is a hardware and software support engineer with much experience
    in computer and smart technology both online and in magazines


    ## 02 找到你的组件

    Header pins can be purchased online, although this will invariably result in having
    to order more than you need. Alternatively, if you have an old motherboard, remove
    a pair of pins with a soldering iron.


    ## 03 将排针焊到你的树莓派

    To gain stability when soldering, place the Pi upside down on a piece of foam,
    insert the slotted headers into the holes. Using fine solder to ensure the pins
    are maintained. This will require a very steady hand, so get assistance.


    ## 04 连接你的重置开关

    Leave the solder to cool for a few minutes before attaching the reset switch.
    Some cases do not have space for the pins, so take time to plan ahead and make
    sure everything fits. If not, you may need to make adjustments to your case.


    ## 05 崩溃后重置树莓派

    With the installed switch, you will be able to reset the Raspberry Pi when required.
    Note, however, that this isn''t an option to use whenever you feel like restarting.
    Rather, it should only be done when the system fails to respond within a reasonable
    time frame.


    ## 06 使用 HDD 跳线帽重置

    不想焊接到你的树莓派？这 is perfectly understandable, but it doesn''t mean you cannot reset
    memory. We have another solution for you. Using a motherboard, two GPIO pins and
    a script to initiate an ordered shutdown is a simple alternative that doesn''t
    involve solder and potential PCB damage.


    ## 07 识别 GPIO 引

    This method works on most models. Each a GPIO array, 26 pins on the A and B (Rev
    2) and 40 on the A+ and B+. pins 5 and 6 counting from the left with the right
    hand way around.


