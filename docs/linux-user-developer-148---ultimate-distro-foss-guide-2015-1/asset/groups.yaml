  mdcn: "\n\n## 你愿意为 Code Club 志愿者吗？\n\nCode Club 是一个全国性的网络，为 9-11 岁的儿童提供志愿者领导的课后编程俱乐部。\n\
    \n我们需要懂计算机编程的人担任志愿者，每周在当地的小学、图书馆或社区中心运营一小时的俱乐部。\n\n我们为志愿者创建了教学项目，我们制作这些项目通过向孩子们展示如何制作电脑游戏、动画和网站来教他们如何编程。\n\
    \n加入我们吧，让我们教下一代编写代码！\n\n访问 www.codeclub.org.uk 了解更多信息\n\n# 广告投放\n\n### LinuxUser\n\
