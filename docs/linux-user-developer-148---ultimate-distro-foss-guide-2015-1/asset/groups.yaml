    # Welcome to issue 148 Linux User & Developer


    > Get Linux User cheaper every issue Page 32


    **Bob Zetsloot** started using Python to model complex simulations. Beginning
    very shortly after the annual awards at the LUUG conference in 2013, he now works
    remotely from Massachusetts, where he says his mission is to protect the Project
    Penguin, codename ‘joeden’.


    **Jon Masters** is a kernel hacker who has been working with Linux for 19 years,
    since he first attended at MIT in Cambridge, Massachusetts, and works for an enterprise
    Linux vendor. You can find him on Twitter.


    **Aaron Shaw** at The MapGen has been heavily involved with Raspberry Pi since
    its beginning, finding himself enough to use it everywhere. In this issue, Aaron
    uses gestures and touch control by means of a Hover Board (p.64).


    **Phil Keating** started out on GRAGmagazine in 1998. As a veteran hardware enthusiast
    and technology journalist, Phil has tested and reviewed hundreds of apps and games.
    This month he walks through the setup and configuration of NaSteam, so you can
    turn your PC into a dedicated retro gaming box.


    **Christian Gawley** is an IT and software engineer, and since 2010 has written
    for magazines and smartphone users both in and online. He says he found a way
    to get away from the headache of Linux fragmentation by installing a simple reset
    switch to make reboots much simpler (p.62).


    **Gareth Halcliffe** is a recent reporter and writer on the open source world,
    covering latest developments from all over the web. He says in his CubeBoard page
    6, a month ago he found Expert’s insights in a few pages of our Ultimate Distro
    & FOSS feature (p.16).


    # This issue


    - Best FOSS and distros

    - Become a certified sysadmin

    - Win $5,500 of PostgreSQL training

    - Add gesture control to your Ras Pi


    Welcome to the latest issue of Linux User & Developer, the UK’s favourite Linux
    and open source magazine. We’re kicking off with 25 collections of new year gifts
    for you. First is our special guide to the Linux year, what you should be using
    this year, which starts on page 16 – we go every category, so there’s something
    for every type of user, and anything that has caught up inside File.co to make
    it easy for you to download. We have free passes provided by Linux Foundation
    to go with Become a Certified Sysadmin feature (p.26). We speak to Jim Berlin
    to find out how and to pass with flying colours. Their certification was launched
    earlier this year, and we also ask what you’ll be tested and you’ll have a chance
    to win one of five LFCS exams. The seasoned Sysadmins might be interested in our
    Postscript feature this month, as 2ndQuadrant offers a training course to each
    editors that’s worth a $5,500, to learn 10 more. Finally, we have five Hover Boards
    given away, as in our page 64 tutorial–not the funny kind, but they do add gesture
    and touch control to your Pi! Good luck! Gavin Thomas, Deputy Editor


