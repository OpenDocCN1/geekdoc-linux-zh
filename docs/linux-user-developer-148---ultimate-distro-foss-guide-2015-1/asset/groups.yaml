    ### 01 Choosing your hardware

    What''s going to power your TV - a custom build machine or a more expensive PC?
    A mini PC will likely be smaller, but you can still make slim systems. You can
    also use a Raspberry Pi, but if you''re going to concentrate more than x86 solutions.


    ![](img/55f2495ee0f271affc0b7194535f335f_42_1.png)


    ### 07 Repurposing old parts

    If you have components lying around, you may be able to put together a system
    without the need for buying new kit. The minimum requirements are graphics more
    than anything else, so as long as you have an Nvidia 850 GT, a Radeon HD GPU you
    will be able to run Kodi core.


    ![](img/55f2495ee0f271affc0b7194535f335f_42_2.png)


    ### 02 Mini PCs

    There are many mini PCs you could choose for the task, in which we used Intel
    Mini PCs and Mini Boxes. Zotac and Gigabyte are also up to the task and include
    a Blu-ray or other disc drive of your personal choice.


    ### 04 Motherboard options

    Mini IT boxes are relatively cheap and you can get decent performance easily from
    your regular component supplier. We recommend AMD chips with onboard graphics
    - these are perfect to handle modern codecs and hardware decoding.


    ### 08 Remote control

    Most IR receivers and universal remotes will work with the Kodi software which
    is built in the Linux kernel. We will cover other methods later.


    ### 03 Getting a case

    If you want to build an HTPC, the choice of case is near essential. Using old
    parts and cases is a good way to do this quickly and easily, the resulting product
    will require a lot of look. Check out mini-ITX chassis for any way to get a slim
    system you can readily find components for,


    ### 05 Other components

    You''ll also need some RAM and a CPU - try for at least 2 GB of RAM; however,
    we recommend providing RAM over the CPU will be the most lifting in the system.


    ### 09 Get OpenELEC

    The easiest and best route for setting up Kodi is grab OpenELEC - it is created
    by the Kodi dev team and is stripped down to the basics to make it simple. Grab
    your ISO from http://openelec.tv.


    ### 06 Power supply

    If you worry about power supplies, please don''t skip the waste if you can help
    it. A system might look like a low idle draw but when decoding high-quality content
    it might need a lot more than usual. Also you can easily upgrade in the future.


