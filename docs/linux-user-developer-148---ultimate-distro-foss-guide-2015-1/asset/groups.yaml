    - 3 Tell the story


    | BAR CHART | COLUMN CHART | GROUPED COLUMN CHART |

    |---|---|---|

    | LINE CHART | PIE CHART | ELECTION DONUT |

    | DATA TABLE | | |


    Hint: If the visualization doesn''t look like you expected, try to transpose the
    data.


    Select layout: Datawrapper


    # 03 Started


    Before creating your first graph, you need to create an account to share your
    charts to other websites; there is little use in keeping them to them. Click the
    ''Sign up'' button at the top to create your account, then log in with your credentials.
    Once registered, Datawrapper will host the email server, and you will get an email
    with the validation link - click the link to activate.


    If you haven''t received the email, or if you have issues with activation, you
    may have to look in your spam folder, or you may need to request a new activation
    email.


    # 04 Data upload


    To create a chart, click the "Chart" button at the top-right corner. Next, you
    need to upload your data - it can be anything in any format you like, it just
    needs to have at least a pair of data points. Adding data to Datawrapper is very
    easy as ever. If you are using OpenOffice or Excel, simply copy and paste your
    data into the text field marked. If you have a CSV file, you can upload it directly
    from your computer. If you want to see how it works first, try using a few data
    samples available in Datawrapper. Just click on the ''Sample data'' and then click
    the "Upload & continue" button.


    interpreted as label or data. You can also credit the data source; it will be
    shown in the bottom of the map if you update the data under Credit source. There
    are a couple of ways to customize the attribution: click the check box on the
    column header. As a header, a new menu opens up on the left. On the row-column
    transformation tab you can swap the columns. After you''ve done what you want
    to do, click "Visualize" to go to the chart.


    # 05 Check and describe


    The next step is to check and describe the data you just uploaded. After you paste/upload
    it, it will be displayed in a table format. You can then use it to carefully inspect
    it to make sure that the data is interpreted the way you want it. If a change
    is required, you can edit the data directly. You can control whether the first
    result is


    # 06 Visualise data

    various chart types


    Data can take any size or shape, so many options. The visualisation tab lets you
    simply pick a chart type to visualize the data presented in the previous step.
    You can select bar chart, line chart and a few other column types to see how they
    fit your data. With smart visualisation, you don''t need to worry with the theory
    behind chart design. You can just imagine it as you like, and then click "transpose
    the data" and the chart will take a comprehensive shape (in most of the cases).
    If there is still a problem, you can then select a different chart type.


    # Visualise your data with Datawrapper


    Put your points across quickly and efficiently


    # TUTORIAL


    ![](img/55f2495ee0f271affc0b7194535f335f_40_0.png)


    ## Data can take any size or shape, so charts need to be flexible too


    # 07 Refine the charts


    After you select a chart for your data, it''s time to fine-tune it to suit. Click
    on the ''Refine'' tab you can edit charts based on the chart you selected here.

    If you have bars, you can edit the bar/col columns, you get the option to choose
    the colour. You can also choose to sort the bars and reverse them.

    - Line charts: In addition to changing your colour, you can choose to fill the
    area below the line, make it curved or stepped. You can also adjust the axis.

    - Data: You can add data to tables using the refining option. The table can also
    be displayed in separate pages, if it has several columns.

    - Pie/donut charts: You can edit the colours of these types of.


    # 08 Add story to the chart


    Now that the charts are customised, let''s add story to it. The ''Tell the story''
    tab lets you edit the title of the chart and add some description to this info.
    In the chart window, you can highlight the important elements of the chart, using
    the drop-down menus available below the description. You can also edit the ''Check
    & Describe'' section too.


    # 09 Publish & Embed


    This is the final step in the creation process. You can view your creation in
    full glory. If you have already entered your email - as discussed in Step 3, you
    will also get a ready-to-use code snippet for the ''Embed into your website''
    section. You can just copy and paste it into another and the chart is shown -
    given that your server is accessible from the web. If you have installed Datawrapper
    on a computer in your network, you can display the charts within your network.
    You also have the option to export the chart as an image that can be used for
    publishing etc.


    # 10 Finishing touches


    Datawrapper is a great tool that allows anyone to create beautiful charts - there
    is no need for any technical or mathematical knowledge. If you have some data,
    Datawrapper can be a little bit tricky, but if you follow these few steps carefully.
    If you have visited the Datawrapper, you will be aware that there are many features
    available. Prominent among the charts is the map feature, which lets you show
    data in a geographical map format. This is not currently available in the GitHub
    source, so it will be.

