    ## 01 开始


    在 Ubuntu 系统上，你可以通过以下命令获取 Cacti：


    ```

    apt-get install cacti

    ```


    安装 Cacti 将自动安装 RRDTool 以及所有需要的软件包，共同创建一个监控站点，可以轻松安装。


    ## 05 Apache 设置


    Cacti 站点将设置在（默认）/etc/cacti/conf-available/cacti.conf。你还需要安装并启用 php-mysql；在 Ubuntu
    系统上，安装后启用该模块。否则，你可能需要重启 Apache 或通过编辑 Apache 配置文件和设置来执行。


    ## 02 安装


    安装 Cacti 不比 MRTG 困难，因为它使用数据库存储而不是文本文件。Cacti 使用 PHP 进行配置并应该支持。在完成安装之前，确保 MySQL
    和 Apache 已运行。


    ## 03 安装前


    下一步非常重要：在进行任何操作之前，你应该将 Cacti 数据导入 MySQL 数据库。在 Ubuntu Linux 系统上，可以通过以下方式完成：


    你需要 root 权限在你的 Linux 机器上设置 Cacti。你还应该知道 Cacti 的 SNMP 相关配置，如果是 ADSL


    ```

    $ /usr/share/doc/cacti/schema.sql | mysql -u root -p cacti

    ```


    ## 04 MySQL 设置


    Cacti 需要一个数据库。MySQL 的用户名名是 ''cacti''，密码应该是 ''cacti''。如果必要，你可以使用另一个数据库来存储所有 Cacti
    相关数据。手动编辑 /etc/cacti/debian/config.php 并放入 Cacti 源码文件中的 config.php 文件。如果没有此设置，安装将失败，你将无处获取数据！为了开始安装，你现在应该将浏览器指向
