    features transactional updates and ''snappy'' applications specifically for containerised
    environments.


    Launched first on Microsoft''s cloud vice president Bob Kelly claimed, and "we
    were excited to be the first cloud provider to offer a new sense of rendering
    with most popular Linux platforms in the rapidly growing cloud."


    Ubuntu Core features upgrades of both the system and its applications, which can
    be rolled back at any time post-installation. Canonical claims to offer ''bulletproof
    security'' for the entire cloud native ecosystem.


    Based on an architecture that was originally designed for the smartphone market,
    Ubuntu Core is in alpha preview for now. The company has yet to announce a roadmap
    for full release.


    OPEN SOURCE


    ## Marines drop Windows for Linux


    The US Department of Defense has announced a contract modification that requires
    a new breed of mobile radar system, designed for the Marine Corps, instead of
    using the originally-specified Windows XP platform.


    The contract was signed in 2005, but the latest version of the GATOR (Ground/Air
    Task-Oriented Radar) included a clause allowing for later modification.


    The DoD now wants the radars be shifted over to Linux to reduce complexity and
    improve security.


    If contractor Northrop Grumman delivers on expectations, Linux GATOR will become
    the standard hardware for the US Marines in a deal valued at $2 billion.


    OPEN SOURCE


    ## Debian freed to escape systemd


    ### Debian Project split results in new distribution


    Controversy over the decision to use systemd as the default in the next version
    of running Debian distribution has caused some members to leave and split their
    own: Devuan


    Pronounced Dev-One, Devuan established a vote to stand against systemd. When it
    came down on the side of systemd, members from both sides of the argument have
    resigned from Debian. Thomas-Fog Henry, Debian maintainer and long-time supporter
    — following increasingly acrimonious debates, founded ''The Veteran Union Debian
    collective'', Devuan aims to create a Debian-like distribution, but with systemd
    removed in favor of a more traditional init system.


    "This exodus is ultimately a relief for us," said the force behind the claimed,
    "to lead a peaceful space for where we are able to do well."


    "Devuan will install its own packages from Debian where necessary, with the first
    goal of removing systemd, inheriting the Debian development while making changes,
    free from bloat as a minimal base distro without systemd. Our objective is for
    the spring of 2015 is that users will be able to switch from Debian 7 to Devuan
    1 smoothly."


    ![](img/55f2495ee0f271affc0b7194535f335f_7_0.png)


    Left Debian does not. It has its own log, but the team has called for another.


    The Devuan team is currently seeking donations in order to fund the creation and
    release of its first. At the time of writing, the project had raised just over
    $1,600 by the Dyne, non-profit foundation.


