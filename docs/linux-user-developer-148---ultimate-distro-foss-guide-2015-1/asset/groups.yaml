    第三个按钮是音乐选择器，它会随机挑选一首歌并播放——那是用 Python 实现的。


    最后一个会发送短信——那是用 Pymish 实现的，他是原树莓派团队的成员。我后来在那里遇到了他。当他说可以使用某种廉价的东西，那些排针里就有一些它们……


