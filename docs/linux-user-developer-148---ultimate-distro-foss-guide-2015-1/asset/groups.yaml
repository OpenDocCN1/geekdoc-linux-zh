    # Visualise your data with Datawrapper


    With attention spans failing, data visualization is a very important way to point
    out your point quickly and efficiently


    A recent study from the National Center for Biology Information in the US found
    that the average adult''s attention span has dropped to a mere 12 seconds in seconds.
    If your report doesn''t seem much from the process, it means that you have even
    less time to point your points. It is very important to now in an easy way to
    catch catchy. Is this possible? How can you create compelling stories every time?
    The answer may lie in the common phrase ''a picture is worth a thousand words'',
    which can process images over 60,000 times faster than text.


    So why not convey messages with images and graphs? In this tutorial, we will introduce
    you to Datawrapper, which helps you convert raw data into easily comprehensible
    graphs. Based on the server-client model you can install on a web server that
    anyone can access through their browser. After creating a graph, you can either
    embed it on a web page or export it as an image for printing. With Datawrapper
    you are covered for all data types. We will now start with the installation process,
    and move on to plot graphs.


    # Advisor


    Nitish Tiwari is a software developer by profession and open source enthusiast
    by heart. He has years of experience writing for open source setting up and use
    open source software for their business needs


    # Resources


    # Datawrapper home page


    www.datawrapper.com'
