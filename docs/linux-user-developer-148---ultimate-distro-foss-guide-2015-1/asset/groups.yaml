    ## 最佳发行版...


    ## 轻量级


    一个轻量级的 Linux 发行版可以通过使用较少的资源，帮助你在旧或配置不足的系统中发挥最大性能。


    ### Lubuntu


    你可以从许多不同的角度定义“轻量”。虽然发行版本身的软件部分可能是最消耗资源的，但内核和后台软件包也会消耗 CPU 周期，而 Lubuntu 以及其他运行
    LXDE 的 Linux 发行版对操作核心的影响并不大；仅仅运行桌面本身可能成为瓶颈。Lubuntu 是一个实有所值的发行版。虽然我们不是 Unity 的最大粉丝，但
    Lubuntu 环境是一个非常稳健且易于使用的系统。


    Ubuntu 拥有一个优秀的中心，使软件包下载变得更容易。一个良好的桌面环境确实可以带来差异。LXDE 并不是极端轻量——它使用 78 MB 内存，而 Ubuntu
    是 98 MB——它增加了 Ubuntu 令人印象深刻的软件，并为你提供了一个不牺牲任何功能又能访问所有喜好功能的轻量级发行版。


    在软件方面，Lubuntu 自带了一套不同的默认应用程序，适应你的原生舒适感。你面对的是 Firefox、Penguin 和 LibreOffice 等智能工具。从这里开始很棒，然后移动到完整的
    Lubuntu 仓库，这样你就可以用你真正熟悉的元素开始构建你的系统。它绝对不是最轻的，但它是你可以在轻量级硬件上使用的最佳发行版。


    ### 替代发行版


    ### wattOS


    一个非常轻量且快速的操作系统，旨在桌面视图下保持快速运行并节省能量，无论是插电源还是使用电池，其表现都非常出色。


    ### Puppy Linux


    Puppy Linux 允许你选择专门为旧硬件设计的发行版。它极快，并且在极小的内存中运行，感觉仍然功能完备的系统。


    ### Porteus


    一个非常快速的发行版仅占用 300 MB 空间，并可以轻松从实时介质运行。你可以添加模块以获得额外功能，并创建一个高度定制的发行版。


    | 桌面环境 | 评分 |

    | :--- | :--- |

    | 文档 | 7 |

    | 自定义性 | 8 |

    | 社区 | 6 |

    | 软件包 | 9 |

    | 性能 | 9 |

    | 安装 | 8 |


    ## 最佳开源软件 (FOSS)


    ### Audacious


    非常轻量且非常快速，Audacious 无疑是预算范围内最好的音频播放器。它接入大多数主流桌面的环境，允许你更好地控制它。


    ### Midori


    虽然处于轻量化的边缘，但与其某些同类软件一样实用，它成功提供了一些优秀的功能，使得浏览网页变得相当不错。


    ### CMPlayer


    一个轻量级的视频播放器，仍然拥有良好的界面，不需要在命令行中穿梭；只要你安装了正确的解码器和后端，它就能满足你的一切需求。


    ### Geany


    一个具有 IDE 功能的文本编辑器，适用于那些只有少量项目的人员；它易于设置并支持许多语言，这意味着你可以在全面开发之前用它进行日常编辑。


    ### Enlightenment


    一个用于完整桌面环境的窗口管理器。Enlightenment 是一个非常且轻量级的框架，作为默认桌面非常好，但它也可以带给你寻找其他。


    ## 娱乐


    ### Kodi


    谈到媒体和其他形式的娱乐消费时，知名名称之一是 XBMC。遗憾的是，对于著名的品牌名 Kodi 来说，“非常”是多余的。


    ### Ubuntu


    作为一种娱乐发行版，Ubuntu 拥有一份完整的软件包列表。你可以在 Ubuntu 上播放任何类型的音乐。著名的 Kodi 还制作了 OpenELEC，这是一种针对不同硬件类型优化的
    Linux 发行版。它不仅可以在树莓派、Apple TV 以及其他设备上运行，你还可以获得适用于 x86 和 x64 系统的版本。


    ### OpenELEC


    OpenELEC 只占用极少的系统资源，同时提供完整版本。这意味着你可以使用任何存储来保存任何类型的媒体，然而，你可以从设置好的任何其他计算机上流传输你的媒体。这不是为了烘焙。AVLinux
    是那些想要制作音频视频的极佳选择，得益于自定义内核以及实时光盘或 USB 盘上丰富的选择。对于电视和电脑，这都是一种在任何情况下消费媒体的极佳方式，拥有大量的解码器和在线免费插件。有许多插件允许你从许多视频源进行流传输。


    ### VLC


    一个极其强大的轻量级播放器，可以播放几乎任何种媒体，也可以接收。如果你不想流传输你的桌面，它非常多功能且易于使用。


    ### Clementine


    功能最全的音频播放器，带有内置库和播放列表管理以及极佳的使用界面。它会动态构建，但在旧系统上的运行并不理想。


    ### Nuvola


    通过浏览器流传输解决的问题之一是我们可以控制任何设备媒体的播放。它允许你今天将所有的流媒体音频保在一个地方，以及更多。


    ### GIMP


    强大的图像处理工具，作为开源的最佳选项，GIMP 甚至可以挑战 Photoshop 以及其他功能和工具——它在某些地方习惯更直观。


    ### AVLinux


    OpenELEC 声称可以在15 分钟内设置好你的设备。上面是一些你可以做的常识性操作，以及一些插件。


