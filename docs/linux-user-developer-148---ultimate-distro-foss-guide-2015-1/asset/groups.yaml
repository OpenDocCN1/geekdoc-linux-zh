    # Add a reset switch to your Raspberry Pi


    Need to restart your Pi after a system lock-up? Easy strain on the mains connector
    – install a reset switch!


    ![](img/55f2495ee0f271affc0b7194535f335f_61_0.png)


    # What you''ll need


    - Momentary switch

    - Suitable wire for PCB projects

    - Soldering iron and solder

    - Single pin header

    - H0/motherboard jumper


    We all know that shutting down a Raspberry Pi by removing the power cable is risky.
    Data may be written to the SD card, leading to corruption, with repeated removal
    of the power cable can cause problems with the connector port.


    # Check your Raspberry Pi model


    Only two models feature the PCB header: the Raspberry Pi B Rev 2 and the B+ (to
    the left of the ''Raspberry Pi 2014'' label). You will need to install the pins
    manually, however, as they are not preinstalled.


    Clearly this can cause problems. When faults cause the Raspberry Pi to crash,
    the simple fix is to add a simple reset function to the device. There are three
    ways this can be done: with a USB button, a motherboard jumper or a motherboard
    header connected to newly-soldered pins on the PH header on the Model B Rev 2
    and this (this is the most complicated option).


    If you have an old Pi lying around, the reset button is already there and adding
    the connecting motherboard pins is achievable if you have a soldering iron. Otherwise,
    we recommend purchasing the parts alone, although we are aware that you''ll probably
    need to buy more pins than you''ll need.


    Christian Cawley

    is a hardware and software support engineer with much experience in computer and
    smart technology both online and in magazines


    ![](img/55f2495ee0f271affc0b7194535f335f_61_1.png)


    # Add a reset switch to your Raspberry Pi


    # Shutting down a Raspberry Pi by removing the power cable is risky


    ![](img/55f2495ee0f271affc0b7194535f335f_62_0.png)


    ![](img/55f2495ee0f271affc0b7194535f335f_62_1.png)


    ## 02 Find your components

    Header pins can be purchased online, although this will invariably result in having
    to order more than you need. Alternatively, if you have an old motherboard, remove
    a pair of pins with a soldering iron.


    ## 03 Solder pins to your Pi

    To gain stability when soldering, place the Pi upside down on a piece of foam,
    insert the slotted headers into the holes. Using fine solder to ensure the pins
    are maintained. This will require a very steady hand, so get assistance.


    ## 04 Connect your reset switch

    Leave the solder to cool for a few minutes before attaching the reset switch.
    Some cases do not have space for the pins, so take time to plan ahead and make
    sure everything fits. If not, you may need to make adjustments to your case.


    ## 05 Reset Raspberry Pi following crashes

    With the installed switch, you will be able to reset the Raspberry Pi when required.
    Note, however, that this isn''t an option to use whenever you feel like restarting.
    Rather, it should only be done when the system fails to respond within a reasonable
    time frame.


    ## 06 Reset with a HDD jumper

    Not keen soldering to your Raspberry Pi? This is perfectly understandable, but
    it doesn''t mean you cannot reset memory. We have another solution for you. Using
    a motherboard, two GPIO pins and a script to initiate an ordered shutdown is a
    simple alternative that doesn''t involve solder and potential PCB damage.


    ## 07 Identify the GPIO pins

    This method works on most models. Each a GPIO array, 26 pins on the A and B (Rev
    2) and 40 on the A+ and B+. pins 5 and 6 counting from the left with the right
    hand way around.


    ## 08 Detect with a script

    Use the script at bit.ly/1Ge5mn03 to detect the jumper, making it a Pi shut down.
    (sudo chmod 755) it /etc/crontab to run the script whenever you boot up.


    > @boot root /home/user/scripts/gpio_actions.sh


    Remember to remove the jumper before booting up!


    ## 09 Try a USB reset button

    Specialist stores offer USB reset buttons that can be connected to your Pi for
