    # Visualise your data with Datawrapper


    Put your point across quickly and efficiently


    # TUTORIAL


    ![](img/55f2495ee0f271affc0b7194535f335f_38_0.png)


    ```apache

    <directory /var/www/datawrapper//>

    Options IndexesFollowSymLinks

    AllowOverride All

    Require all granted

    </directory>

    <directory /var/www/datawrapper/charts/static/*>

    Options IndexesFollowSymLinks

    AllowOverride All

    Require all granted

    </directory>

    <directory /var/www/js/*>

    Options IndexesFollowSymLinks

    AllowOverride All

    Require all granted

    </directory>

    ```


    # AccessFileName: The name of the file to look for in each directory

    # for additional configuration directives. See also the AllowOverride

    # AccessFileName .htaccess


    # The following lines prevent .htaccess and .htpasswd from being used


    # 01 Installation


    To start with Datawrapper, you need to have Apache server (with mod_rewrite and
    mod_php enabled), PHP (version 5.2 or above) and MySQL server installed. This
    can be done under one package (LAMP stack). To install the LAMP server, first
    refresh the package index using `sudo apt-get update` then install-server. Use
    the `sudo apache2 restart` command to restart apache service. If you are not comfortable
    using the command prompted for databases. To install phpMyAdmin use the following:


    Due to its design, a database is required to run it in a subdirectory, e.g. `http://localhost/phpmyadmin/`
    with installation.


    Until you download Datawrapper, it is available at https://github.com/datawrapper/datawrapper.
    Navigate to the Datawrapper command prompt and run `composer install`.


    # 02 Server configuration


    Now that the dependencies are installed and the database is ready, we need to
    create two virtual hosts: one for the Datawrapper (pointing to `/www/folder/datawrapper`)
    and one for the database (pointing to `datawrapper-conf.php`).


    For the record, we have used Ubuntu 14.04 as the system and hardware version 14.04
    for installation.


    First copy two copies of the default configuration (000-default.conf) and name
    them as the following hosts:


    ```bash

    # sudo cp /etc/apache2/sites-available/000-default.conf /etc/apache2/sites-available/datawrapper.conf

    # sudo cp /etc/apache2/sites-available/000-default.conf /etc/apache2/sites-available/datawrapper-db.conf

    ```


    Plain Text | Tab: 4 | Ln 63, Col 1 | INS


    Then update the DocumentRoot and Server names in the file. Enable the access to
    the database root added in the apache2 configuration file (available at `/etc/apache2/apache2.conf`).
    This blog and database are configured not to access root file system outside /var/.
    Enable the sites by using the command:


    ```bash

    # sudo a2ensite datawrapper.local

    ```


    ```bash

    # sudo a2ensite chart.datawrapper.local

    ```


    This completes the installation: you can now access datawrapper at datawrapper.local,
    and if everything is fine you''ll see the message "Congratulations! You have successfully
    installed datawrapper."


    This downloads all the dependencies required by Datawrapper. Create a MySQL database,
    and initialize the table schema using `/lib/core/`


    # Tutorial


    datawrapper.local/chart/3eeXz/visualize#select-visualization


    - Upload Data

    - Check & Describe

    - Publish & Embed


    [ Insert title here ]


