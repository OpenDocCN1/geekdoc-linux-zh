    # 桌面出版软件


    寻找创建专业出版物的最佳 DTP 程序


    ## 评测


    ## LibreOffice


    Scribus 在过去十年中已演变为一个强大的程序


    LibreOffice 中没有 DTP 软件，但你也可以稍微应付一下


    - 图像、插图和排版工具非常详尽

    - 布局工具充其量基础，但可以对元素进行精细控制


    ## 特性


    Scribus 本质上是一个开源 InDesign；它包含一切 - 媒体管理器、管理器和内置设置、图层和装订、排版工具、预检。界面简洁且易用，具有特别出色的功能。我们对其留下了深刻印象。


    话不说 DTP 软件，LibreOffice 的演示软件仍然可以在一定程度上使用，只需将幻灯片视为页面。关键技巧是你可以使用 LibreOffice 的文档转换器从
    Publisher 文件创建 ODP。


    ## 布局工具


    你可以设置任何你喜欢的布局，并使用 Ctrl 和 Alt 键辅助对齐来实现像素级的精确放置。有多个网格和指南可以帮助你定位元素，并有一条基线来对齐文本。所有内容都可以在选项中精细控制，甚至到指南的颜色和距离。


    LibreOffice 拥有相当不错的生成信函和调整的向导，对于正式出版物你需要精通它，可以使用一些幻灯片布局作为开始，并且很容易地为数字项目导入图像、视频和其他媒体。不过，它显然是设计用于
    DTP 的。


    ## 图像和文本


    图层窗口智能地提供了隐藏、锁定和环绕选项，以及 Adobe 风格的混合模式。文本选项非常出色 - 在文本框上按 Ctrl+I 可以找到从样式到字间距和引导符的所有内容。图像可以通过
    GIMP 进行编辑并应用效果。


    提供了详细的格式选项，可以对文本样式进行精细控制。事实上，图像样式非常好，所以如果你花时间设置好你需要的，只要你的需求简单，工具就会产生非常不错的结果。


    ## 输出


    真正的打印选项，包括安全设置、嵌入字体、裁切、出血和其他打印标记。预检也非常详尽，可能比 InDesign 中多得多。还有导出 EPS 和 SVG 文件的选项，通过这些文件你可以处理压缩甚至演示效果。


    你可以从 Impress 导出 PDF（无论是低分辨率还是 /JPEG 转换为 DPI）。演示软件中没有这些裁切/出血选项，但 PDF 本身是高质量的。你还可以导出
    HTML 文件，在在线阅读顶部带有页面导航选项。不过，这并不多。


    ## 总体


    直观但功能强大且学习曲线陡峭，并且包含了专业 DTP 套件包含的所有内容，它具有如条形码生成器和可执行文件等独特功能。


    让 Impress 远超出其职范围范围有些牵强，但最近引入的对 Microsoft Publisher 的支持值得调查；至少。遗憾的是，它并不是一个选项。


    79.linuxuser.co.uk


    ## 评测

    桌面出版软件


    ## 简要：对比与总结我们的裁决


    | | LyX | Lucidpress | Scribus | LibreOffice |

    |---|---|---|---|---|

    | 特性 | 有很多东西要学，但非常值得 | 7 | 简洁简单，面向更非正式的家庭用户 | 6 | 完整的包，令人印象深刻的软件 | 10 | Impress
    仅是 DTP，理应支持 Publisher 文件 | 4 |

    | 布局工具 | 非常适合书籍和期刊，不适合自定义布局 | 7 | 智能（但简单）的工具和漂亮的模板 | 7 | 对网格和指南的精细控制提供了很好的布局 |
    9 | 非常基础的模板和布局，因此相当有限 | 4 |

    | 图像和文本 | 出色的文本和结构化选项，图像受限 | 8 | 所有基础功能齐全，此外还有漂亮的效果 | 7 | 详细的文本和大型 GIF 编辑图像 |
    5 | 图像和文本样式不可否认地有用 | 5 |

    | 输出 | 文档自动样式化，输出多种格式 | 7 | 除非你每月付费，否则基本上无法使用 | 10 | 所有选项可用 | 5 | 高质量但基础 | 5 |

    | 总体 | 如果你不需要图像和设计，这个 | 9 | 如果值你的钱，每份 | 5 | 这是 Linux 的金标准 | 6 | LibreOffice 根本无法与之竞争
    | 4 |


    ## 获胜者是...

    Scribus


    在 Linux 桌面出版领域，Scribus 迅速成为了主要参与者。LibreOffice 是唯一支持 Publisher 的，但在使用一段时间后，我们发现它并不值得。它具有独特的功能是原因。对于初学者来说，学习曲线可能是望而不可及的，特别是如果安装了亚克力外壳。公司已选择跳过四核产品，直接为市场推出了八核
    ARM 板。


