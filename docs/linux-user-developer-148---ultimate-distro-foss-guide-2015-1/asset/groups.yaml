    经过多年的开发、测试和成熟，非常受欢迎，它极易使用，并且不需要任何额外设置即可执行或播放许多功能。


    这些解决方案中的许多可能缺乏定制，而且不如你自己在 Linux 中创建的系统那样开放。我们将向你展示你所需的所有教程，帮助你创建自己的 Linux 软件，它可以驱动你的电视并观看所有的节目，或者在急需时播放你的音乐库。


