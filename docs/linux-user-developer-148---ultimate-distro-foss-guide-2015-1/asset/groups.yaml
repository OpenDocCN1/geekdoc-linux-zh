    # 欢迎阅读第 148 期 Linux User & Developer


    > 每期购买 Linux User 都更便宜，第 32 页


    **Bob Zetsloot** 开始使用 Python 对复杂的模拟进行建模。在 2013 年 LUUG 会议年度颁奖活动不久后，他开始于马萨诸塞州远程工作，他在那里的使命是保护代号为“joeden”的企鹅项目。


    **Jon Masters** 是一位内核黑客，从事 Linux 工作已有 19 年，从他最初在位于马萨诸塞州剑桥的麻理工学院学习开始，他为一家企业 Linux
    供应商工作。你可以在 Twitter 上找到他。


    **Aaron Shaw** 来自 MapGen，自树莓派诞生之初就深度参与其中，并发现自己随处随地使用它。在本期中，Aaron 通过悬浮板（第 64 页）实现了手势和触控控制。


    **Phil Keating** 于 1998 年开始在 GRAG 杂志工作。作为一名资深硬件爱好者和技术记者，Phil 测试并评论了数百款应用和游戏。本月，他将介绍
    NaSteam 的安装和配置，让你可以将 PC 变成一台专用的复古游戏盒。


    **Christian Gawley** 是一位 IT 和软件工程师，自 2010 年以来一直为线上及线外的手机用户撰写文章。他说他找到了一种避免 Linux
    碎片化烦恼的方法，通过安装一个简单的重置开关让重启变得简单得多（第 62 页）。


    **Gareth Halcliffe** 是一位近期关注开源世界的记者和作家，涵盖网络各地的最新动态。他在 CubeBoard 第 6 页中提到，一个月前，他在“终极发行版与开源软件”专栏的几页内容中发现了专家的见解（第
    16 页）。


    # 本期内容


    - 最优开源软件和发行版

    - 成为认证系统管理员

    - 赢取 $5,500 的 PostgreSQL 培训

    - 为你的树莓派添加手势控制


    欢迎阅读 Linux User & Developer 最新期，这是英国最喜爱的 Linux 和开源杂志。我们从为您提供的 25 份新年礼物开始。首先是我们在第
    16 页开始的 Linux 年度特别指南，介绍了你今年应该使用什么——我们涵盖了所有类别，因此每种类型的用户都有对应的内容，并且 File.co 内的所有内容都方便您下载。我们还提供了
    Linux 基金会提供的免费通行证，用于“成为认证系统管理员”专栏（第 26 页）。我们采访了 Jim Berlin 以了解如何以及优异地通过考试。他们的认证于今年早些时候推出，我们询问了将接受哪些测试，你将有机会赢得五场
    LFCS 考试之一。资深系统管理员可能对我们本月的后记部分感兴趣，因为 2ndQuadrant 为每位编辑提供了一项价值 5,500 美元的培训课程，学习额外的
    10 项技能。最后，我们赠送了五块悬浮板，正如我们在第 64 页教程中那样——不是那种搞笑的，但它们确实为你的树莓派增加了手势和触控控制！祝你好运！Gavin
    Thomas，副主编


