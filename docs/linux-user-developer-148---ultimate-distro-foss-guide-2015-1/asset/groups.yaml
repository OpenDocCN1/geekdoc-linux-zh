    2ndQuadrant 的互动非常高兴。”


    2ndQuadrant 提供接触全球最大的 PostgreSQL 专家团队之一的渠道，并通过开发为更广泛的用户社区做出贡献。因此，该公司能够为需要支持的客户提供
    15 分钟的响应时间。


    要获得赢得 2ndQuadrant 价值 £2,750 培训券的机会，您只需向我们发送电子邮件，并提供以下问题的全部答案：


    ## PostgreSQL 引擎的名称是什么？


