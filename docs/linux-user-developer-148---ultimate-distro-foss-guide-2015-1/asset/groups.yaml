    # Repurpose old hardware with NAS4Free to use as a NAS server for backups and
    more


    The fast pace of technological progress is great, but it does mean that hardware
    becomes redundant. This begs the question: what do we do with that old PC sitting
    in the attic? Instead of selling it or giving it away, the best option is to turn
    it into a network-attached server for storing files, media and backups. For this
    purpose there are several specialists to choose from, including FreeNAS and OpenMedia
    Vault. However, to encompass as much older hardware as possible, we''ll be using
    NAS4Free – a legacy version of FreeNAS – since it has lower system requirements.
    Ideally, it only needs 512MB of RAM to work, but you may be able to get away with
    as little as 256MB for the full version.

    We will show how to install NAS4Free on your old PC and access and configure it
    from any client on your network. You can schedule regular backups of selected
    folders using sync and cron for backup or other uses including UPnP media streaming
    and downloading (using the built-in Transmission) – you could even set up iCloud
    hosting. So dust off that old PC and let''s get it working for you again!


