    # Pi 手套


    我的 Pi 手套诞生于纽约——让我来给你们讲讲故事。


    我受邀参加在伦敦举行的第二届树莓派大会。第二天是一个非常有趣的黑客日，我和 Eben Upton 以及其他想交流的人聊了聊。


    我们想设计出某种你可以在物理上可以使用的设备，于是决定使用手套。


    于是我们想出一个方案：如果你触碰大指和小指，屏幕上的字符就会移动，于是我们用手套把它做了出来。


    如果我们真的能做更多事情——一些戴在手上的东西——我说我可以用 Python 为社交媒体（如 Twitter）制作一些创意性的。


    这就是这样开始的。Pi 手套其实只是一块纸板、一个 Pi Zero、一个电池盒、一些电线和胶带，但这就是它的开端。


    他问我我想做什么，我说我要造一个能实现所有这些甚至更多功能的手套。这不仅仅是一个小练习——它是一个项目。


