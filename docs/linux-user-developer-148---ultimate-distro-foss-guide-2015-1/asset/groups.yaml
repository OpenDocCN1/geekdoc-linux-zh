    ## 滚动更新 (Rolling release)

    对于那些不喜欢受制于正式发布计划的人来说，滚动更新发行版承诺让系统永不过时。


    ### Sabayon

    Sabayon 是 Gentoo 的一个变体，它保留了滚动更新的精神，但更注重“开箱即用”。Sabayon 缺乏 Gentoo 的灵活性，但仍然是一个强大的发行版。


    ### Gentoo

    Gentoo 以快速的企鹅命名，Gentoo 和 Arch 长期以来一直是竞争对手。两者都提供滚动发布方法论，这意味着最新的更新会同步发布，确保安装只需一次——且两者都具有类
    BSD 的软件分发方式。


    ### Arch

    Arch 的不同之处在于它将用户直接留在控制台上，安装过程是一个自由的过程。一旦安装完成，它既快速又极具活性。


    ### Aptos

    Aptos 提供了一个熟悉的环境和滚动更新。Aptos 以 Debian 的不稳定分支（unstable）为父级，包含了许多针对 Debian 自由软件的定制。


    对于 Linux 用户来说，Arch 这种不干预的方法就像是在没有被介绍滚动更新世界的情况下，被投入了深水区。Gentoo 最初于 2002 年发布，是一个开发和软件发布需要某些方法的发行版。


    运行 Gentoo 的另一个主要特点是它的软件直接通过系统管理器从源码编译。这意味着你需要等待维护者为该平台构建并上传包，该包可以针对你的特定需求进行优化，并在通用编译会导致系统下降的情况下进行基准测试。当然，权衡是从源码编译比直接从
    Arch 安装预编译的二进制文件花费长时间。


    与 Gentoo 类似，Arch 的安装过程提供了帮助——通过通道和邮件列表提供了大量的社区帮助——但最近发布的 USB 变体使其尝试变得更容易。它的人气在近年来增加了。对于任何想要高度可定制系统的人来说，Gentoo
    都是一个极佳的选择，而且安装会变得更容易——这个过程本不应该独自完成。


    > 上述安装比 Gentoo 慢，为你提供了更好的选择方法


    ## GIMP

    ### Audacity

    作为 GNU 图像处理程序（GIMP）的开源对应，最近引入了单窗口界面以解决对其可用性的批评，将其功能带给新的受众。你可以想象一下使用带有效果和滤器的多轨道混音。Audacity
    帮助证明了 Linux 是用于创作性工作的，并且它能够与专有平台相衡。


    ### Firefox

    Firefox 曾因臃肿而备受批评——尽管该项目的初衷是处理 Mozilla 中感知到的新闻问题。Firefox 浏览器（版本 34）仍然是用户中的热门选择。


    ### LibreOffice

    LibreOffice 在 MyASystems 收购 OpenOffice.org 后创建，来自 Document Foundation 的 LibreOffice
    现在需求很大，提供的功能甚至让最忠实的 Microsoft Office 粉丝也感到满意。


    ### VLC

    VLC 的强大之处在于它的灵活性，以及播放任何音频或视频格式的能力——它支持一切，并具有从各种源录制的能力——捕捉你的桌面视图。


