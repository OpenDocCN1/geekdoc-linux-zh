    将文件存储在内部存储是确保你可以持续访问它们的好方法——特别是那些你家庭中的（例如，如果你有孩子，他们会反复观看动画片）。这将自动添加到你想要在家庭位置通过
    Kodi 使用列表中。


    ### 16 USB 存储

    连接内部存储对某些人来说可能有点困难，但 USB 闪存将轻松连接到系统，并立即添加到你的视频库中，持续任何来自内部存储的内容作为。


