    ## 使用 Cacti 监控网络流量


    顾问


    Mihalis Tsoukalos 是一位 UNIX 系统管理员，同时也精通数据库编程和数学。他自 1993 年以来一直使用 Linux。学习如何安装和配置
    Cacti，以便使用 SNMP 打开网络绘图应用监控 Cisco ADSL 路由器的流量，该应用使用 RRDTool - 一种用于时间序列数据的日志和绘图系统。路由定义连接不同的网络，因此应该至少有两个不同的网络接口。我们将使用一个
    Cisco 8750 ADSL 路由器，它有一个 RJ45 以太网端口和一个 Wi-Fi 连接。你想监控的是 ADSL 连接。别担心 - 不要认为你将使用
    ADSL 接口来获取所需数据，SNMP 可以询问三个接口中的任何一个并获取相同的 ADSL 相关数据！我们之前在 Linux! 第 140 期中关于 MRTG
    的教程中使用了 ADSL 接口，而本教程将使用 Wi-Fi 连接。使用不同的 IP 或接口没有区别。Cacti 的功能比 MRTG 多得多，允许开发者在不处理
    Cacti 源代码的情况下生成额外的 Cacti 功能。一篇即将发表的文章将向你展示如何开发 Cacti 插件，但在这里我们将重点放在安装和配置。


