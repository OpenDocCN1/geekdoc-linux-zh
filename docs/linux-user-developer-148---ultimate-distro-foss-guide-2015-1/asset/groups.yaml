    ## # CubieTech

    CubieBoard 4


    带有强大的 64 核 GPU 和八核 ARM 处理器，CubieBoard 4 能否成为 Nvidia Jetson TK1 可行的低成本替代方案？


    CubieBoard 4，也称为 CC-A80，是 CubieTech 来自 Cubieruck 的最新，它采用了 CubieBoard 2 双核 A20
    系统级处理器，提升了 RAM 并添加了可选功能，公司已选择跳过四核产品，直接为市场推出了八核 ARM 板。那些用过之前型号作为网络附属存储设备的用户会对切换到新芯片直接带有板载
    SATA 连接感到失望，尽管带有引出线的 USB-3 端口（支持 2.4GHz 和蓝牙）对此也无任何益益。


    与大多数八核 ARM 芯片不同，A8chip 有能力同时运行所有核心。在 ARM 的 big.LITTLE 架构上有四个低功耗的 Cortex-A5 核心。在移动使用中，big.LITTLE
    架构设计用于在竞争期间关闭高功耗核心来节省电力，芯片还可以令人印象深刻地选择同时运行所有八个核心，大幅提升其多线程性能。


    主板本身是一个全新的设计。


    Mali-V72 GPU 没有加速支持，且热输出也是原因，特别是如果安装了亚克力外壳。


    Android 显然是 CubieTech 的目标。虽然不是最新版本，但 AIWiner 版本的构建表现良好，并努力从八核中榨出最大的性能。


