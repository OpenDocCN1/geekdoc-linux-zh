    # 新闻

    Linux 社区动态

    开源


    安全


    ## 研究人员发现 Turl Linux 恶意软件


    ## 前 Windows APT 的平台转移


    安全研究人员发现了 Turl 高级持续性威胁（APT）恶意软件的新变体，该变体以 Linux 为目标操作系统——这是其首次针对该系统的攻击。


    在最近对该恶意软件的分析中，安全实验室的 Kurt Baumgartner 和 Constantin Rau 发现，Linux 正在成为日益受欢迎的财务驱动型恶意软件编写者的目标，由于其在服务器市场中占据大多数份额份额。


    “我们怀疑这个组件在受害者的站点已经运行了多年，”这对在描述从客户系统中获取的恶意软件样本时写道，“但目前还没有足够的数据来支持这一说法。”报告发布后不久，他们发现了第二个名为
    Turl 的更新更新变体，该变体甚至可以从低权限的环境感染系统。


    根据代码，Turl 充当一个隐蔽后门，并提供带有键盘记录功能对受感染系统的访问权限。Linux 一直并不是恶意软件活动的主要目标；Baumgartner 表示，它可能成为，因为恶意软件编写者正在积极修改其软件以实现跨平台兼容性。


    开发


    ## AMD 发布 Omega 驱动程序更新


    推出


    ![](img/55f2495ee0f271affc0b7194535f335f_6_0.png)


    AMD 发布了其图形产品最大的驱动程序更新之一，包括 GPU 和 APU 芯片，这是首次包含特定发行版的包。


    AMD 就像其竞争对手 Nvidia 一样，不为其图形提供开源驱动以使用硬件加速，除非使用基于社区的开源驱动或下载 AMD 的“二进制块”（binary blob）版本，这通常以可执行存档的形式发布，可以作为直接安装方法或生成特定发行版的包。


    从 Omega 驱动程序开始，AMD 将在启动提供下载特定发行版包的选项。适用于 Ubuntu 和 Fedora 用户，以及传统的发行版安装程序。除了改进对
    Linux 的支持外，新的驱动包还包含质量和性能提升功能。


    ## Linux 日历


    ### ICISSP 2015


    - ESEOD，昂热尔，卢瓦尔

    - 法国

    - iciss.org


    2 月 9-11 日


    首届国际信息系统安全与隐私会议旨在建立一个 Linux 开发者和从业者社区，对专有软件和开源软件专业开放。


    2 月 9-13 日


    ## Linaro Connect


    - 香港皇家阿尔卑斯大酒店

    - connect.linaro.org


    Linaro Connect 提供主题演讲、讨论和引人入目的会议，面向那些在 ARM 平台上工作的人士以及如何有效地优化这两者。


    2 月 18-20 日


    ## Linux 基金协作峰


    - 加利福尼亚州葡萄酒园酒店

    - events.linuxfoundation.org


    这是一个由 Linux 基金会组织的受邀参加活动，协作峰旨在建立团结并连接专家，共同促进开源的发展。


    2 月 19-22 日


    ## SCALE 13x


    - 洛杉矶机场希尔顿酒店

    - 美国

    - linuxuxexpo.org


    第 13 届加利福尼亚 Linux Expo 是历史上最大的社区运行 DOSS 会议，其展示了符合开源倡议组织指南的项目。


    www.linuxuser.com


    ## OpenSource: 您的 Linux 新闻和观点来源


    www.linuxuxer.com 直接向我们发送邮件...

    获取最新的新闻和观点请发送至 linuxuxer@imagine-publishing.co.uk


    云


    ## Canonical 推出‘snappy’ Ubuntu Core


    针对容器爱好者的事务性更新


    Canonical 宣布推出了一种新的 Ubuntu，称为 Ubuntu Core，其特点是专门为容器化环境设计的事务性更新和‘snappy’应用程序。


    由微软云副总裁 Bob Kelly 首先发布，他表示：“我们很高兴成为首个云提供商，在快速增长的云中大多数流行的 Linux 平台提供新的渲染感。”


    Ubuntu Core 具有系统及其应用程序的升级，可以在安装后任何时间回滚。Canonical 声称为整个云原生生态系统提供“防弹级安全”。


    '
