    ![](img/55f2495ee0f271affc0b7194535f335f_47_1.png)


    # BitTorrent client


    Let your NAS box handle all torrents


    Another feature of NAS4Free is its built-in Transmission BitTorrent client. From
    the web UI, go to Services/BitTorrent and click Add. Download the torrent and
    watch, then alter any settings you want, then click Start. If you want to download
    a torrent to a specific folder (from one connected to PC), NAS4Free will start.
    Click the icon at the bottom of the BitTorrent screen to check its progress. You
    may need to get to your router to forward the port used.


    # 11 Enable sharing


    Go to Shares/CIFS/SMB and click Add. Then click ''+'' to enter a name and comment.
    Hit ... for Path and choose the share name, pop folder, then click Apply. Then
    the Settings tab, then Save and Restart.


    # 08 General settings


    For your security, you can change the username and password via System/General
    - click the Password tab to change. The General menu also allows you to set settings
    such as AS and time zone.


    # 12 Remote access


    You can now access the shared folder from the browser of another PC - Browse the
    drop-down, then use the system file for a preformatted disk - if you want, or
    connect via Windows/Network Groups. A backup subfolder is created, to be stored
    from shared folders and subfolders.


    # 13 Set up users


    On the web UI, go to Service/RSync. Click the Modules tab, then enter a name and
    comment. Hit the ''...'' button, select your mount point and Backups subfolder.
    Click OK, Add, Apply Changes. Click Settings tab, then Enable, then Save and Restart.

