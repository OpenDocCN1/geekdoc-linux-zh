    Not speaking DTP software, LibreOffice''s presentation software can still be used
    to an extent, by pretending that slides are pages. The key trick is that you can
    use LibreOffice''s Document Converter creates ODP from Publisher files.


    # Layout tools


    # Layout tools


    You can set any layout you like, and place things pixel-perfectly using the Ctrl
    and Alt keys to help with alignment. There are multiple grids and guides to help
    you with positioning elements and a baseline to align your text. Everything can
    be finely controlled in the options, down to the colour and distance of your guides.


    LibreOffice has pretty decent wizards generating letters and adjusts, for proper
    publications you''ll need to go master, with some slide layouts you can use to
    get started, and it''s easy to import images, videos and other media for digital
    projects. It''s definitely intended to work as DTP though.


    # Images and text


    # Images and text


    The Layers window wisely features hide, lock and wrapping options, and Adobe-style
    blend modes. Text options are stellar - Ctrl+I on a text box to find everything
    from style to tracking and leaders. Images can be edited via GIMP and have effects
    applied.


    Detailed formatting options are available and text styles can be meticulously
    controlled. In fact, the image styles are very good so, if you put the time setting
    up what you need the tools will produce pretty good if your needs are simple.


    # Output


    # Output


    True print options, including security settings, embedded fonts, crop, bleed and
    other printer marks. The pre-flight checks are very thorough too, perhaps so much
    more than in InDesign. As well as the option to export EPS and SVG files, with
    which you can handle compression and even presentation effects.


    You can export PDFs from Impress (either less or /JPEG conversion to a DPI). There
    is no crop/bleed options for this in presentation software, but the PDFs themselves
    are high quality. You can also export HTML files with page navigation options
    at the top of online reading. But that though, there''s not much.


    # Overall


    # Overall


    Intuitive but however, powerful but with a steep learning curve, and with everything
    a pro DTP suite contains, it has unique features like a barcode generator and
    executables.


    It''s a bit of a stretch to get Impress to work so far outside its remit, but
    the recently introduced support for Microsoft Publisher we was worth investigating;
    at least. Unfortunately, it''s not a option.


