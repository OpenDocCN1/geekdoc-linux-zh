    # Add the Cisco device


    Logged in as admin (guest)


    ![](img/55f2495ee0f271affc0b7194535f335f_51_1.png)


    # Add the Cisco device


    After installing and configuring to Cacti, you are ready to add devices and graphs
    to Cacti. The thing you need to know in order to monitor your Cisco router with
    Cacti is the name of the SNMP community (public) and the name of the IP address
    (192.168.2.1).


    To add the router, you should click on ''Devices'' list. Then click ''Enabled''
    on Status, and then click Edit. Now you will have to fill in the required fields
    and click ''Create''.


    ![](img/55f2495ee0f271affc0b7194535f335f_51_2.png)


    # Finish the installation


    Two simple steps are required that should leave little to difficulty. After finishing
    the setup, you should log in to Cacti using the admin user. If you wish to change
    the default password, you can do so under ''Settings''. From now you will have
    the URL to connect to your Cacti installation.


    ![](img/55f2495ee0f271affc0b7194535f335f_51_3.png)


    Everything is okay, the next thing is want to display ''Create Graphs for this
    Host'' on the upper-right side of the screen. Click ''Create Graphs for this Host''
    to go to the next screen. Select Graph Trees from the left menu and then click
    Next. This will allow you to select the device you want to monitor. Follow the
    instructions on-screen, and you are done!


    # The generated Cacti


    A script that runs as a job will output the Cacti which is automatically configured
    during installation. You can look at /etc/cron/cacti.file for more information
    about how the Cacti is being generated.


    # Check Cisco configuration


    If you have a Cisco TOPIP profile that is available for other devices (Cisco,
    Dialer), Linux and other networks, Windows machines, etc., After using the admin
    user, you should make sure that the device you are connecting to is properly configured.
    Cacti will acquire data from the Cisco router using SNMP, so you should check
    if SNMP is working on Cisco.


    # User management


    Users in Cacti can be divided into three categories: Anonymous, Normal, and Administrators.
    What differentiates these three categories is how they authenticate and the permissions
    they have. You can also add users using the command interface of Cacti which is
    simpler. You can visit http://cacti.net/downloads/html/scripts.html for more information
    about Cacti command line scripts.


    > Cacti configuration

    Make sure all of these are correct before connecting.

    (SNMP) Node Binary Path: The path to the node binary.

    (FILE) path

    (SNMP) PHP Binary Path: The path to your PHP binary file (may require a php. file
    to get it right).

    (FILE) path

    (SNMP) SNMP Binary Path: The path to your SNMP binary.

    (FILE) path'
