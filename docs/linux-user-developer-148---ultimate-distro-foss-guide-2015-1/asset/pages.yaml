  md: "# # Add gesture control to your Raspberry Pi\n\n**08** Once you have completed\
    \ step 7, if you touch the Hover board or make gestures you will begin to see\
    \ the output in the terminal as a bunch of 0s and 1s and then etc. The way Hover\
    \ works is that it can sense any difference and sends these to the Raspberry Pi\
    \ over I2C as 8-bit binary value. The first three bits describe whether it was\
    \ a gesture or event and the remaining five describe the type or direction of\
    \ the event. The exact bytes are shown in the code listing to the right.\n\n#\
    \ Full code listing\n\n```\nimport time\nfrom Hover_library import Hover\n```\n\
    \n```\nhover = Hover(Address=0x42, ts=23, reset=24)\ntry:\n    while True:\n \
    \       # Check if hover is ready to send gesture\n        # or touch event\n\
    \        if hover.getStatus() == ::\n            # Read data and print the\n \
    \           # gesture or touch event\n            message = hover.getEvent()\n\
    \            print(message)\n            if message == \"010000010\":\n      \
    \          # code for west touch goes here\n            elif message == \"011000010\"\
    :\n                # code for center touch goes here\n            elif message\
    \ == \"010010000\":\n                # code for east touch goes here\n       \
    \     elif message == \"010000100\":\n                # code for south touch goes\
    \ here\n            elif message == \"010000010\":\n                # code for\
    \ north touch goes here\n            elif message == \"010110000\":\n        \
    \        # code for swipe right goes here\n            elif message == \"000010100\"\
    :\n                # code for swipe left goes here\n            elif message ==\
    \ \"001100000\":\n                # code for swipe down goes here\n          \
    \  elif message == \"000001100\":\n                # code for swipe up goes here\n\
    \        # Release the ts until Hover is\n        # ready to send the next event\n\
    \        hover.setRelease()\n        time.sleep(0.01) # Sleep for some ms\n```\n\
