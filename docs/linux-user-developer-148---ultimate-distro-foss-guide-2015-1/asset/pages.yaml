    OPEN SOURCE


    # # Marines drop

    Windows for

    Linux


    The US Department of Defense has announced a contract modification that requires
    a new breed of mobile radar system, designed for the Marine Corps, instead of
    using the originally-specified Windows XP platform.


    The contract was signed in 2005, but the latest version of the GATOR (Ground/Air
    Task-Oriented Radar) included a clause allowing for later modification.


    The DoD now wants the radars be shifted over to Linux to reduce complexity and
    improve security.


    If contractor Northrop Grumman delivers on expectations, Linux GATOR will become
    the standard hardware for the US Marines in a deal valued at $2 billion.


