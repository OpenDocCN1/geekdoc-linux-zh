    # Features


    # Features


    It''s packed with complex features, but the learning curve is steep. To get the
    full out of LyX you need to spend some time learning it, particularly the coding
    sides. But once you''ve got it down, you can use speed typing with the toolset
    to generate incredibly smart documents.


    Lucidpress clearly targets non-professional users, and if you''ve used Apple''s
    Pages you''d instantly recognize its influence. It''s slick and simple, although
    light on controls. You can collaborate with people to edit and publish directly
    from Lucidpress.


    # Layout tools


    # Layout tools


    Given its TeXLaTeX base, LyX has the majority of layouts. It''s primarily focused
    on journals, articles and books, and most of the templates reflect this, so layout
    tools are excellent for traditional writing. But we struggle to create custom
    layouts for modern publishing-LyX isn''t really designed for that.


    As a basic margin and ruler, there are some neat features in the contextual menu
    panel when you select objects, being able to align their sizes and extend their
    define. Scalable for digital publications-it is added, too. The templates are
    surprisingly good, though the majority are locked in the Premium account.


    # Images and text


    # Images and text


    Text-wise it is lovely, with elements like the Maths bar to beautifully render
    formula types. The table of citations are functional and also with images. But
    with that, you can only scale and move the text size, rotate, setting handling
    values is nothing much better than positioning by hand.


    The options for image mastery are however limited to shadows, borders, opacity
    and gradients. They are all surface-level and don''t give you much fine control.
    A simple story with the text controls; aside from the font, line spacing, etc
    all have effects like linking and binding.


    # Output


    # Output


    What is we free to work with for the final output (hit Ctrl+R to produce). While
    that output looks great with standard-type publishing projects like books, and
    so on, it looks much less aligned with modern styles. But with LaTeX, you can
    export to a range of PDF formats, HTML, EPS, Postscript and many more niche formats
    besides.


