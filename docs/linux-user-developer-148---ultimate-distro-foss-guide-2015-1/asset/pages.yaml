    # UPnP Streaming


    Stream music, videos and photos


    ![](img/55f2495ee0f271affc0b7194535f335f_48_1.png)


    You can also turn your NAS backup box into a UPnP server. Make a folder for your
    PC''s file browser or SSH, and subfolders for Music, Photos, Video (if you are
    transcoding). Go to Services/DLNA/UPnP in the Free4NAS web UI, click and choose
    your folder as the else directory. For the media library, choose one of your browsers,
    click OK, then Add. For the other subfolders, Create a profile for UPnP (Sony
    PlayStation 3). Enable transcoding if needed and select the directory term.


    # ## For extra security, you can change


    the username and password


    ![](img/55f2495ee0f271affc0b7194535f335f_48_2.png)


    # 16 SSH login


    Setting up SSH key authentication (sec. bit ed25519) comes from the command line.
    First, open a terminal and enter:


    # 18 Rename public key


    Rename your public key:


    ```

    ssh-copy-id ~/.id_rsa.pub ~/.ssh/authorized_keys

    ```


    ```

    ssh -i root@[NAS4Free IP]

    ```


    Type ''yes'', enter the password to log in to your NAS server.


    Then out:


    Copy the public key to your client PC:


    ```

    scp -p root@[NAS4Free IP]:~/.ssh/authorized_keys ~/.ssh/

    ```


    ![](img/55f2495ee0f271affc0b7194535f335f_48_3.png)


    # 14 Start up ssh


    We''ll want to use rsync with ssh to backup files from the client to our NAS4Free
    server. In the web GUI go to Settings > Enable. Tick the ''Perm SSH login option.
    Then Save and Restart.


    # 15 Backup with rsync


    Now let''s try a backup from the client PC. You can run rsync from the command
    line, using ''rsync -avz'' - for particularly useful when choosing files. Choose
    the folder to backup, then enter the destination: root@[NAS4Free IP]:mnt/volume/NAS4Free.
    It will prompt you for a passphrase; enter your NAS4Free password (default is
    ''nas4free'').


    # 17 Generate SSH key


    Now we can generate an SSH key pair, by entering:


    # 19 Automate backup


    You can now automate backup with cron.


    ```

    ssh-keygen

    ```


    Press Enter to accept the default file location, then Enter to set an empty passphrase
    and Enter again to confirm it. Your SSH key pair will then be generated.


    ```

    cron -ab

    ```


    Copy and paste your rsync command into the line at the bottom, by the date and
    time. it''s 5 mins, then * * * for a daily backup at times, so for a 2pm daily
    backup you''d use:


    ```

    00 14 * * *

    ```


