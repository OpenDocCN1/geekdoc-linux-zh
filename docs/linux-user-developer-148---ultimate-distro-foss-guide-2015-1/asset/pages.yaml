    # Resampling audio


    Intel Edison now available from Active Robots


    I have a dozen flac files that play in Ampeg and every other proper player, but
    won''t play on my Sony because the sample rate is too high. I have mostly 1784
    kbps at 48000 Hz. This gives me some information on what it supports, which is
    am resampling these files so that my Sony system can use them by as simple as:


    +   $ flac -sampler=44100 -out=(file.flac) [infile.flac]


    But apparently flac does not encode without containing, but when I inspect the
    files they are still 24bit/48kHz. Frequency: Linux operating system SUSE 13.2
    was gladly received, Thanks to advice.


    George


    Ah, the benefits of open source software and customisable computers. That''s what
    a decent FLAC from Sony at least is, so you won''t be losing any noticeable quality.
    As for actually converting the files, you can do that by running ffmpeg in the
    terminal, using a command something like:


    ```

    $ ffmpeg -i [input].flac -ar 44100 -sample_fmt s16

    [output].flac

    ```


