    # # Researchers uncover Turl Linux malware


    # Platform shift for former Windows APT


    Security researchers have uncovered a new variant of the Turl advanced persistent
    threat (APT) malware which targets Linux as the target operating system - the
    first turn ever to do so.


    In their recent analysis of the malware, Kurt Baumgartner and Constantin Rau of
    security Lab found Linux becoming an increasingly popular target for financially-motivated
    malware writers to its position as the majority shareholder of the server market.


    We suspect this component was running for years at a victim site, the pair wrote
    of the malware sample, which was retrieved in the


    from a customer system, "but do not have enough data to support that statement
    just." Shortly after the report was published, the pair found a second, newer
    variant called Turl that can infect a system even from an underprivileged environment.


    Based on cd00r, Turl acts as a stealth backdoor and provides access to the infected
    system with keylogging. Linux has not been a major target for malware activity;
    Baumgartner says it could be, with malware writers actively modifying their software
    to achieve cross-platform compatibility.


