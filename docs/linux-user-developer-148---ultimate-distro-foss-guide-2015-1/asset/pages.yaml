  md: '# Pi Glove


    So my Pi Glove grew out of New York — let me tell you about.


    I was invited to the second Raspberry Pi conference back in London. The second
    day was a pretty hack day, and I had a bit of a chat with Eben Upton and other
    people who wanted to talk.


    We wanted to come up something you could physically use, and we decided to use
    a glove.


    So we came up with that if you touched a thumb and finger, it would move a character
    on-screen, so we made it out of a glove.


    And if we could actually make something more — something that is on the hand —
    I said I could also use Python to make something creative for social media, like
    Twitter.


    That''s how it started. The Pi Glove was actually just a piece of cardboard, a
    Pi Zero, a battery pack, some wires, and some tape, but that''s how it started.


    And he asked me what I wanted to do, and I said I''d build a glove that does all
    of that and more. This wasn''t just village — it was a project.


    # What is the Pi Glove so that?


    From the index, if you press the first button it''ll be using the camera. The
    second button it''ll post a tweet to Twitter (using something like ''Picture this
    was taken by me'').


    The third button is a music picker, so it''ll pick a random song and play it —
    that was using Python.


    And the last one will send a text message — that was using Pymorish, and he was
    on the original Raspberry Pi team. I met him there after. And when he said I could
    delete something cheap, which had some of them in the sticks...


    So we were chatting and one of the things I said was ''if you''re at the station
    and you want to check when the next train arrives, you pull out your phone and...


    check the app, load it up — wouldn''t it be better if you pressed a button in
    your pocket and read it in your ear, which is better than looking at a screen?


    He told me to get in touch with him on Raspberry Pi, which then parses the data
    and uses Google Sheets to search the data and returns it back.


    so that it always travel between stations, but the next stage is to develop something
    for that and then we could do it for that too.


    So you have four buttons — do you have plans for some other hierarchical? Maybe
    build a paint tool that if you move your finger, it''ll draw on the screen? Or
    something so mapped out?


    That''ll be the next stage. I asked him about what he wanted to do, and its simple
    things like checking the time. He said, ''If I want to know the time, it''s much
    easier for me to have a phone than it is to just press a button and have it tell
    me the time!'' And we were talking about that.


    And you require assistance, how could you develop for that — if you have some
    sensors on the glove which produce a multiple output?


    So I use Python to speak what you''re mentioning here, because it''s much easier,
    and it''s not any other than those voice you''re using here, it''s not the Pi
    platform we''re working on.


    looking into see what there is available and I was struggling to find something
    — there was an Arduino drone which you could move with your fingers on the deck,
    but there was nothing else like this. Even in terms of what I wanted.


    So eventually, I was envisaging some kind of glove that''s more tactile, rather
    than just pressing buttons.


    Have you ever imagined of Heaps and the Raspberry MiMU? They''re very different,
    with gesture control.


    In fact, Eben mentioned some comprehensive Sonic with Sonic Pi, and on the next
    day we had that he had a project with a friend who was making electronic music
    and he wanted more participation in this, so the moves to the left then the volume
    goes and so on.


    He was very passionate about the idea of the audience influencing on the music
    they''re listening to, just using their right hand and then it.


    I''m just going to play something; if the audience doesn''t like a bit and then...


    So you could control the Pi glove, if you''re ready for it to control the Pi right
    with the left or with a hand.


    We started with the idea that we could use the glove for pictures — but actually,
    many people are asking for the glove to be able to take a photo far away?


    If that was what we wanted to get a photo to take a picture that''s only far away
    in truth, but it''s in your pocket and it takes a picture.


    So that was the idea, which could be made in the pocket or something like that
    — like near level, taking a picture of what''s in front of you instead of the
    picture, but then you could be happy-snap so that you can take photos when you''re
    out.


    Barack Obama asked for justice for 50,000 cameras mounted on the world of the
    world and some stuff like that, it''s the same idea. And I thought that it''s
    the next step: people could move around with these cameras.


