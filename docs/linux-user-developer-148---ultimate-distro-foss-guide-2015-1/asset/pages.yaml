    # Kali Linux


    For years, BackTrack Linux was the king of Linux distributions for doing security
    penetration testing. In 2013, however, the project was forked into Kali.


    Kali Linux, created and maintained by Aaron and Devon Kennedy of Offensive Security,
    Kali is a ground-up rewrite of BackTrack, its successor to it.


    Based on Debian, Kali includes pre-installed most of popular security tools, including
    network sniffer and Wireshark, port-scanning tool nmap, password cracker


    John Reilly and the Airc-ng suite for penetration testing of wireless networks.
    Its repositories have many more choices available, in comparison to Ubuntu.


    Where Kali differs from the competition is in compatibility; as well as 32-bit
    and 64-bit architectures. They have worked to bring Kali to the more popular desktop.
    Builds are available for devices as diverse as the Raspberry Pi and various mobile
    phones.


    Perhaps most impressive feature, however, is Kali sub-project NetHunter. Currently
    available for Android smartphones and tablets, KaliHunter provides various penetration
    tools directly—a great tool for desktop testing without having to lug an all-top
    laptop around.


