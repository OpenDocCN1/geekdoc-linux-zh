  md: '# Questions & answers


    All your technical problems solved

    Q/A


    Here''s a working HPLIP, from the tarball. Now, this is on a Slackware

    system but the arguments are pretty standard and you may find them useful:


    ```

    /config/

    --prefix=/usr

    --libdir=/usr/lib$LDPURFFIX/

    --with-backend=$usr/

    --with-cups=/usr/lib/cups

    --libdir=$LDPURFFIX/cups/filter

    --sysconfdir=/etc

    --docdir=/usr/share/hplip

    --with-hplip-version

    --with-hp-cupdir=/usr/cup/hp

    --enable-hplip-install

    --enable-shadow-build

    --enable-ghost-build

    --enable-fax-build

    ```


    # These configuration arguments will result in a full-boot HPLIP with hpgijs installed


    ```

    --enable-fomatic-drv-install

    --enable-network-build-bycups

    --enable-qt4

    --enable-policykit

    --build-shared-libcups-linux

    --enable-cups-psd-install

    --enable-linux

    ```


    (so you don''t need to build separate versions any more).

    There are other things you should keep in mind, such as remembering H-P devices
    with setup-.


    However, you might actually want to go ahead and ignore those two lines that contains
    LDPURFFIX (the entire script determines the location of system libraries which
    will use, for example, 32-bit system or 64-bit system).


    Look at the link above and follow it down to the answer how these questions (the
    documentation is for actually pretty good) you might download the latest from
    the configure arguments above. It would also be nice if you had a tested box to
    play with.


    These configuration arguments will result in a full-boot HPLIP with hpgijs


