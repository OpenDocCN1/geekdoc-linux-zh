    # New reports show enterprise growth and a decline for priority competition


    The results of an invitation-only survey conducted by The Linux Foundation''s
    Enterprise End-User Council have been published, showing considerable faith in
    the security of Linux and a growing share in the enterprise sector - won its,
    directly from competition.


    The survey was conducted upon public request of governmental organisations, all
    of which had spent $500 million or more per annum or $600 million or more in four
    years that the Foundation has performed a survey, allowing for direct-to-year
    comparisons over the same methodology. The report include the claim that Linux
    growth is continuing apiece in the enterprise sector, with more than 85 percent
    of respondents having Linux servers in their infrastructure over the past year
    and 82 percent planning to add Linux over the coming years.


    the past year, 78 per cent of respondents reported perception that Linux was more
    secure than rival systems.


    Not all respondents painted a pretty picture, in particular the lack of staff
    with the expertise required to maintain and support a Linux infrastructure, with
    40 per cent of respondents being dissatisfied with the level of support they received.


    "The software way is today built in the methods used to build Linux, the world''s
    largest collaborative development project," claimed Amanda McPherson, vice president
    of marketing and services at Linux regarding the report''s findings. "The Enterprise
    End User gives us important insight into how Linux is used in the most complex
    environments and how to understand how Linux development for decades to come."


    Additional findings include Linux in the cloud market, with 78 per cent of respondents
    stating that Linux powers their primary cloud platform, compared to 24 per cent
    using Windows, and more than two per using others. The discovery of high-profile
    security vulnerabilities in the OpenSSL and GNU TLS projects in


    installed as replacements for proprietary operating system with Microsoft''s Windows
    being singled out during the same period.


    The Foundation warns, that the results of the survey are not to be taken as an
    assessment of potential growth in the enterprise sector, as enterprise users motivated
    to use Linux "are not an unusual lot, but the size and buying power and technical
    preferences are.


    The full report for this and previous years can be downloaded from linuxfoundation.org


