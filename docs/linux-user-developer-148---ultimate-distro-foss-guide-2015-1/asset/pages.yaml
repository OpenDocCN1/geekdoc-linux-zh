    Advisor


    Mihalis Tsoukalos is a UNIX system administrator also proficient in programming
    databases and mathematics. He has using Linux since 1993 Learn how to install
    and configure Cacti in order to watch the traffic of a Cisco ADSL router using
    SNMP open network graphing application that uses RRDTool - a logging and graphing
    system for time series data. A router, by definition connects different networks
    therefore it should have at least two distinct network interfaces. We will use
    a Cisco 8750 ADSL router that has one RJAS Ethernet port and one Wi-Fi connection.
    What you want to monitor is the ADSL connection. Don''t worry - do not think that
    you will need to use the ADSL interface to get the desired data, SNMP can ask
    any one of the three interfaces and get the same ADSL-related data! Our previous
    tutorial about MRTG in issue 140 of Linux! used the ADSL interface whereas this
    tutorial will use the Wi-Fi connection. Using a different IP or interface makes
    no difference. Cacti has many more features than MRTG which enable developers
    to generate additional Cacti features without dealing with Cacti''s source code.
    A forthcoming article will show you how to develop a Cacti plugin, but here we
    will focus on installation and configuration.


