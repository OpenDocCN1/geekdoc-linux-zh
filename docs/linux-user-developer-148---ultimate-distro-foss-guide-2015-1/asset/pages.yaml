    Watch traffic on a Cisco ADSL router using SNMP TUTORIAL


    ![](img/55f2495ee0f271affc0b7194535f335f_52_0.png)


    # ## 12 Create and use a user


    Head across Console/Utilities/User Management. You can see that two users are
    created by default: admin and guest. To add a custom user, fill in the required
    information. On the Permissions tab, turn on the Graphs checkbox. Now, to create
    the new user, it is advised ''User'' must change password at next login.


    After creating the user, add the user to the Graph Permissions and add the graphs
    they should be allowed to see.


    # ## 13 Cacti directories


    The /var/lib/cacti directory contains all the RDD files that keep your performance
    data. /var/share/cacti/resource directory holds all the templates and queries
    of Cacti. /var/log/cacti directory contains all logs of Cacti - you should visit
    its files when there are problems with Cacti. /var/share/cacti/cli directory holds
    all the command line scripts.


    ![](img/55f2495ee0f271affc0b7194535f335f_52_1.png)


    # ## Although backing up MRTG is a simple copy process, backing up Cacti is more
    demanding“”


    4 Although backing up MRTG is a simple copy process, backing up Cacti is more
    demanding


    # 14 Back up and restore


    Cacti is more demanding because its data is stored on a database. To back up Cacti,
    backup the MySQL database using the following command:


    ```

    $ mysqldump -u cacti -pcaciptiasword cacti > cacti.sql

    ```


    Similarly, you can back up all Cacti files and MX scripts, just make sure that
    you include all files and directories. If you are not familiar with MySQL, should
    ask your database administrator for help, because backup is a critical task.


    # 15 Bonus material


    The default Cacti installation automatically gathers and displays data you select
    (localhost). You can see it by selecting Graphs/DefaultTree/HostLocal.


    # 16 Final thoughts


    Installing Cacti is not as easy as installing MRTG. However, Cacti provides output,
    support plugins, and multiple users with different privileges. Cacti is used for
    monitoring large servers.


    Upon your needs, you can choose MRTG or Cacti and be assured that any of them
    will serve you.


