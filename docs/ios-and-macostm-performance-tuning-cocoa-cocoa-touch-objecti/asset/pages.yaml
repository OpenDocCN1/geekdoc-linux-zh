    \ all the way to the most recent addition,\nGrand Central Dispatch (GCD).\n\n\
    # Threads\n\nThreading on OS X is essentially built on a kernel-level implementation\
    \ of POSIX\nthreads (threads). These kernel threads are relatively expensive entities\
    \ to manage,\nsimilar to Objective-C objects, which much more so. Running a function\n\
    my_computation arg ) on a new POSIX thread using thread_create, as\nin 3.522,\
    \ takes around 7 µs to have overhead on my machine in\nadition to the cost of\
