    # Compression


    Compression is an obvious space-saving measure, and many of the techniques for
    saving memory, such as the bit-field discussed above, can be viewed as specialized
    forms of compression.


    These types of compression have the feature that they are directly usable in their
    compressed state, so the data needs to be decompressed before it can be used.
    This means that both the uncompressed and the compressed representation are in
    memory, with at least the uncompressed version being dirty. An uncompressed representation
    can therefore paradoxically often be faster and more efficient than one that is
    compressed.


    # Purgable Memory


    One way of alleviating the memory pressure of dirty decompressed versions of data,
    or any other data that can be computed from a more compact representation, purgeable
    memory. Marking memory indicates the operating system that when there is memory
    pressure, it can discard this memory despite the fact that it is known to be dirty,
    instead of having to swap it to disk.


    Apple provides both low-level interface using flags for the map system call, as
    well as the higher-level and more convenient NSPurgeableData class, which wraps
    a NSMutableData compatible interface over purgeable data and also implements the
    NSDiscardableContent protocol.

    The beginContentAccess and endContentAccess of the protocol must be used to lock
    and unlock the actual contents, respectively; data can only be accessed when locked
    and only until purged.

    The discardPossible message will purge the data unless it is currently locked,
    and this can also be done by the system if there is memory pressure. Once the
    data has been purged, beginContentAccess returns “NO” and access methods like
    bytes or mutableBytes if used without a successful lock using beginContentAccess.
    It is important to not keep pointers to the data around, as accessing data via
    these pointers will cause the process to be killed if the data has been purged.


