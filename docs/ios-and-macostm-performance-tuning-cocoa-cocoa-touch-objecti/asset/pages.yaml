  md: '# Quartz and the PostScript Imaging Model


    Like much of our current computing environment, Quartz traces back to the Xerox
    Palo Alto Research Center (PARC) as the Bravo system, which later became the PostScript
    page description language for printers and typewriters as well NeXT''s DisplayPostScript
    client-server windowing and drawing system and Adobe''s PDF, PostScript without
    the programmability, turned into Mac OS X''s.


    One of the unique features of the PostScript page description language on which
    PDF and Quartz are based is that it has a precisely defined imaging model. The
    target is defined as a raster image, with the source being three distinct primitive
    types:


    +   1. Raster images

    2. Paths, either filled or stroked

    3. Text


    These primitives can be transformed by arbitrary affine transformations, clipped
    by paths and filled with a color, and in later versions of the model gradient
    or other type of non-constant shading. The original formulation of the imaging
    model defines the Painter''s Algorithm for rasterization, meaning that the last
    primitive to write a particular pixel defines the shape, replacing whatever is
    there. Quartz and current versions of PDF use a new formulation that includes
    alpha blending, meaning that previous values contribute to new values. Anti-aliasing
    depends on this sort of blending operation, because partial coverage of a pixel
    by the background color already present at that pixel.


    What''s important is that the final value of every pixel is defined precisely
    by the model and not up to the degrees of the implementation, and Apple has been
    very consistent in applying this quality perspective.


    In the imaging model, all the primitives above turn into one: the filled path.
    Text characters are mapped to glyph via encodings and then turned into paths via
    formats. Stroked paths (“outlines”) are converted “stroked” into two outlines
    with the area in-filled; glyph and end-cap elements are also added as geometry
    to this path to be filled. Curves are converted to straight line segments (“flattened”)
    by high resolution and then rasterized.


    Even raster images are defined as grids of rectangles that can be scaled and rotated
    For example, drawing a 256-pixel-wide and 1-pixel high image with values ranging
    from 0 to 255 is to have exactly the same result as drawing 256 rectangles with
    gray values from 0 to 1, and the raster image method was in fact the recommended
    emulation of gradients before gradients became intrinsic: Set the shape you want
    drawn as a clip path and then draw an image that represents the gradient, scaled
    to fit the shape.


    Figure 14.3 illustrates these different representations using the example of the
    lowercase “a”, rendered in the Times Roman font.'
