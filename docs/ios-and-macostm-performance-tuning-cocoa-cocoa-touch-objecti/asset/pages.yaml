  md: '# Compile Times


    Swift leans on the compiler quite heavily, much more than Objective-C, and more
    similar to C++, which also has compile times typically longer than C or Objective-C.
    My experience is that there is a base overhead of 2 times relative to C/Objective-C,
    with at least 4 times when optimizing. This is reflected in the compile times
    of the integer benchmark we looked at, earlier, as shown in Table 9.6.


    With many other aspects of performance, C and Objective-C compilers are not the
    benchmark for fast compilation speeds. The legacy of file-inclusion-based modularity
    with header files poses a huge challenge for C-based language, though precompiled
    headers or modules help a lot. Languages such as Go that were specifically designed
    to avoid that type of problem can be compiled much more quickly, and development
    systems like Smalltalk compile individual methods instantaneously.


