  md: '# Chapter 12 I/O: Pitfalls and Techniques


    # Memory Dumps


    The conceptually simplest and potentially fastest technique for saving state is
    to do a memory dump. Just take the address of the data you save and ever write
    ( ) or out it in an NSData for writing with one of the writeTo... methods, making
    sure to use the non-copying initializer (`initWithBytesCopy...`).


    This technique used to be popular. The early Microsoft Office formats as .doc
    and .xls were effectively dumps of the (fairy complicated) internal structures.
    This was great for performance, but is somewhat less than for interoperability,
    you would need to either have or reverse-engineer Microsoft’s internal data structures
    to read and write the file format. This becomes tricky as internal representation
    changes, for example, due to different padding, endianness, and the move from
    16 to 32 to 64 bits


    The Squeak system mentioned earlier most of these issues. It use an image as primary
    storage, which is simply a memory dump of the internal object. Memory is kept
    by the copying garbage collector, the address of a saved image is stored, and
    on load it tries to the same address or it all pointers in the image if it cannot
    allocate memory at the same address. Endianness is reversed if necessary.


    The results are quite good. The default Squeak image has around 1.2 million objects,
    it takes 200 ms to save those to a 23-MB image file, and adding 1 million SampleObject
    instances increases the space to 46 MB and the time to 500 ms.


    However, the problem they’ve solved is interoperability. Only other Squeak systems
    can interpret image files, and an image has to save as a whole, so I can only
    save my SampleObject instances by saving the entire image containing those objects.


