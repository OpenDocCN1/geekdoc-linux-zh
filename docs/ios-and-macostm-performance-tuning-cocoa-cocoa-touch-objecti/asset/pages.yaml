  md: '# Too Much Communication Slows Down Installation


    image drawing is as fast as can be, as image drawing has been problematic ever
    since the NextStep days. However, CGLayer is still an advantage when generating
    PDFs, as it will preserve vector information for repeated elements. So CGLayer
    is a good thing if you plan to have print or PDF output and repeated elements.


    Considering the performance advantages of OpenGL in Chapter 15 and the obvious
    performance of modern games rendering complex scenes at high frame rates, accelerating
    drawing using OpenGL appears to be an absolute no-brainer. Conceptually this is
    true, but implementing such acceleration has turned out to be anything (a no-brainer).
    Apple made several attempts at incorporating OpenGL into Quartz at the OS level,
    and to my knowledge of all these were cancelled. The additional transaction costs
    tended to eat up gains in those parts of the graphics drawing that could be accelerated.
    A particular problem is the very immediate, call/return nature of the Quartz APIs,
    which maps reasonably well onto the OpenGL API but not well onto the actual hardware
    interface (see the OpenGL/Metal discussion in the “Metal” section in Chapter 14).


    Another is that the graphics primitives are different: Quartz uses filled and
    stroked bezier paths, which have been expensively tessated to turn them into the
    triangles used by the graphics hardware and exposed by the APIs. If they are shaped,
    that translation cost would be easier to amortize over many uses, but the APIs
    don''t really provide for that.


    # Too Much Communication Slows Down Installation


    One investigation that had an unexpected result was looking into the mysterious
    slowdown of an installer in a new Mac OS version. The installer was installing
    several thousand small files and previously had performed as expected. With the
    new version, the installer had slowed down sevenfold, almost an order of magnitude.
    I/O rates were much slower than the disk subsystem could support and CPU usage
    was negligible, so there did not seem to be an actual bottleneck to explain the
    drop in performance.


    # The Display Throttle


    After much head-scratching and tool usage, the culprit was found to be the status
    updates the installer was providing. It was displaying the name of every single
    file it installed, and in order to make sure the user had a chance to see every
    one of those filenames, it was flushing to the screen after every name. This eagerness
    to keep the user abreast of its progress fell afoul of throttling mechanism inside
    the Mac OS X graphics subsystem that limits graphic updates to roughly the refresh
    rate, nowadays somewhat arbitrarily at 60 Hz. Trying to flush the screen more
    often will simply block your program, as illustrated by Example 16.1.'
