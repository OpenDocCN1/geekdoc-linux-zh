    may affect the routine being measured, and for that reason is often infeasible
    for measuring routines that execute quickly. It also means adding extra code with
    potential bugs to the project, whereas external tools keep the original code clean.


    If your applications log significant events using NSLog(), you are already doing
    some measurement because the logs produced by NSLog() have a millisecond-precision
    pre-pended. If you have a log of application activity, you know how long it took
    to get from one of these significant events to another, in time (not CPU time).
