  md: "# Summary 39\n\nthat we can reject candidate locations much more cheaply by\
    \ looking at their first character, without incurring the overhead of a function\
    \ call.\n\nThe second problem is is only significant in that without the function\
    \ pointer the compiler could have done that job for us: string comparison functions\
    \ belong to a class of \"special\" functions that compilers are aware of and make\
    \ specialized, inlined code rather than a function pointer and call to a library.\
    \ However, the compilers can't see \"through\" the function pointer and thus can't\
    \ inline the code for us.\n\nWith that brief insight, the fix was simple: Pull\
    \ out the first character of the string comparison as shown in Example 2.4.\n\n\
    # Example 2.4 Slightly more efficient string search\n\n```\ncomparisonFunc = isCaseSensitive\
    \ ? strncmp : strcasecmp\nint len=strlen(target)\nint max=strlen(source)-len;\n\
    for (int i=0;i<max;i++) {\n    if (tolower(source[i]) == tolower(target[0]) &&\n\
    \        comparisonFunc(source+i, len )) {\n        // success\n    }\n}\n```\n\
    \nSince strncasecmp is defined as converting both input strings to lowercase,\
    \ this is equivalent to calling the strings. Another option would have been to\
    \ not use a function pointer in order to let the compiler use its inlining prowess,\
    \ but would mean duplicating the code—not a good option when considering the alternatives.\n\
    \nThe code in Example 2.4 is far from optimal. First, we do not adjust the string\
    \ pointer and length in the call to comparisonFunc() to reflect that we've already\
    \ checked the first character. In fact, we can't do that, the first character\
    \ is actually a bit too lenient: It always uses the tolower() function even in\
    \ the non-insensitive case, giving some false matches. These false matches for\
    \ the first character don't matter for correctness because they will be filtered\
    \ out by the call to comparisonFunc().\n\nAll performance deficiencies and the\
    \ fact that the code is so much less efficient than the advanced string algorithms\
    \ being examined not matter bit: The one line change not improved performance\
    \ by an order of magnitude, that improvement was also sufficient to make the indexing\
    \ process disk-bound, meaning further algorithmic improvement didn't affect performance.\
    \ Elapsed time: less than an hour.\n\n# Summary\n\nThis chapter introduced performance\
    \ measurement from command-line tools via the Instruments profiler to internal\
    \ measurement and performance tests. While mastering"
