  md: '# Garbage Collection


    Fortunately, the problem of determining the lifetime of a reference in ntrivial
    environments has a long history, with many solutions dating back to at least the
    early LISP implementations of the 1950s.


    There are principally two techniques for garbage collection: tracing the heap
    to using reference counting to find dead objects. As shown in the 2004 OOPSLA
    paper A Unified Theory of Garbage Collection by Bacon, Cheng, and Rajan, these
    approaches (tracing garbage collection and reference-counting collection) are
    duals of each other, and optimized versions of each collector take on characteristics
    of the other type.


    Early garbage collectors used reference counting, each time a new reference to
    an object is created, a count inside the object is increased, and each time a
    reference disappeared the count decreased again, all automatically by the runtime
    system. When the reference count reaches zero, the object can be released because
    there are no more references to it.


    # Foundation Object Ownership


    When OPENSTEP introduced the new Foundation classes still familiar today (NSArray,
    NSString, NSDictionary, NSNumber, etc.), it also introduced a garbage collection
    scheme based on reference counting to replace the fully manual resource management
    scheme of early NextStep versions.


    Although not integrated into the language the reference-counting collectors mechanism
    is capable of coexisting with a low-level language like C. Since the reference
    counting system does not have special access to internal objects, it is relatively
    slow as such goes. This is compensated by the fact that it generally does not
    track references in local variables, with the ownership rules only applying to
    references held in instance variables. This drastically reduces the number of
    reference-counting operations.


    Foundation’s ownership-based reference-counting scheme is often referred to as
    "manual reference counting" (MRC). This is incorrect; reference counting can be,
    and is highly automatically generated, for the use of accesses, with those also
    automatically generated. In fact, property definitions in MRC, ARC, and even the
    tracing collector are essentially indistinguishable.


    Figure 5.10 illustrates how reference counts work. The root has a reference to
    object a, which therefore has a reference count of 1. Object a has a reference
    to object b, which also has a reference count of 1. If we add a back pointer to
    object b to object a, a’s reference count increases to 2, with all other reference
    counts remaining the same.


    If the reference from root to object a then goes away, object a’s reference count
    drops back to 1. This example also illustrates a reference cycle: objects a and
    b are no longer referenced from the rest of the program; they should therefore
    be freed.'
