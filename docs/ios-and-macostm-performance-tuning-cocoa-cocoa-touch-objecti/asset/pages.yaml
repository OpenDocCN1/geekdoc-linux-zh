    # # Summary


    In this chapter, we''ve seen that I/O performance over time follows a very specific
    pattern: capacity increases more than bandwidth, which increases more than latency,
    even with occasional jumps like the move to the SSDs.


    In practice, this means that good performance can be achieved by making requests
    as large as possible; reading or writing a single byte is practically as expensive
    as reading or writing many kilobytesobytes. Unless absolutely necessary, I avoid
    writing parts of files, instead taking a page from the Amoeba operating system³
    and treating files as immutable, only ever reading and writing entire files at
    a time, and ideally avoiding small files. If I need to read parts of a large file,
    I use memory mapping in order to still only the whole file logically, leaving
    any partial access to the OS. If I need to incrementally generate a large file,
    I only append to it and only allow reading once the file has finished writing.


    We will take a close look at these sorts of techniques and the problems with partial
    file reads and updates, especially in the context of databases, in Chapter 12.


