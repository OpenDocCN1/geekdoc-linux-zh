    # Observations


    Finally, the benchmark game shows Swift programs benchmarking consistently 5 to
    30 times slower than equal C programs. It just to be certain that these results
    were not outliners, I cross-checked by comparing Swift with Java. Here, Swift
    was typically 5 times slower than Java, with the range being 20% to 8% slower.


    Although any one of these is easy to dismiss as an outlier, the pattern is really
    consistent for that 3 to 10 times slower with “reasonable” code. Heroic manual
    optimizations and a bit of luck are required to take that to somewhere between
    3 times slower and almost parity, depending on the type of code in question. With
    Swift evolving as quickly as it does, all of these specific timings will probably
    be obsolete by the time this book is in print, but the overall pattern seems to
    hold.


    Conversely, when I see claims of Swift beating C/Objective-C in performance, the
    claims are typically not backed with data, instead justified either not at all
    or with “well, it should, because, er, reasons.” In the rare cases there is data,
    the data is most dubious and at worst outset false, with non-robust benchmarks
    being optimized away, operations on primitive integers compared to operations
    on objects, or non-optimized but highly optimizable C compared to highly optimized
    Swift code.


