  md: '# Segregated Stores


    265


    Another hybrid form is utilized by the LevelDB key-value store, an open-source
    rewrite of Google''s BigTable data store. Its basic store comprises Sorted String
    Tables, which are read-only lists of strings with an index. Writability is provided
    using a Log Structured Tree: all changes are appended to a log in memory and disk.
    Reads are satisfied from the recent changes stored in memory and then from the
    sorted read-only tables on disk, for example, by having those tables mapped into
    memory. This means that writes are always fast and reads always fast, with the
    cost of having to occasionally rewrite the sorted tables from the log, operations
    that can then be performed using large batches, and sequential reads and writes.


    LevelDB still provides a classic Read Update Delete (CRUD) interface to the data,
    but the applications themselves exhibit the characteristics of an Event Poster,
    RSS feeds, or social networking applications, and e-mail. Such systems can easily
    take advantage of the (time-based) structure of their data: e-mails received the
    last day are usually more frequently accessed than those last week, which are
    in turn more frequently accessed than those of the last month, and so. On the
    other hand, many people, myself included, never actually delete. A relational
    database like SQLite treats all elements in a table equally, or over time performance
    deteriorates for all messages, even though the actual working remains the same.


    If I were to store a back end for e-mail, I would structure it in a local store
    similar to LevelDB: keep the most recent changes in memory and in a local store
    that is quick to access and quick to modify. Every once in a while, I would write
    older messages to read-only chunks (maybe per-month) with extensive indexing,
    threading, and other metadata so that operations would only ever have to look
    at the summaries. This way accessing the working would remain the same speed regardless
    of the size of the mailbox, with older storage only accessed for searches and
    performed in large batches at optimal access speeds. However, I would not actually
    use LevelDB, because its limitation to only strings and no indexes would be too
    restrictive.


    # Segregated Stores


    The mail store I described is really an example of a segregated store. The idea
    of a segregated store is to keep pieces of data with different sizes, access requirements,
    and life cycles from each other—for example, old messages from new messages.


    One example of this standing in other media-rich applications is Apple''s Keynote
    program. In this ''13 format, all object layout information was contained in a
    single XML file index.apxl, either in a directory wrapper or in a zip file. Media
    data such as images or movies are kept separate from this file, so even presentations
    up to 100 pages and a total size of over 1 Gigabyte have index.apxl file size
    of over 2 MB.


    In addition, the contents of the index.apxl file change effectively with every
    edit, whereas the media files are immutable once they are imported; they only
    change if a new version of the media file is imported.'
