    the limits of human perception, or simply fooling the observer, is a common technique
    for keeping up the appearance of responsiveness even when an actual answer or
    result cannot be supplied in time.


    # Software and APIs


    On Mac OS and iOS, user interaction is largely managed by high-level frameworks,
    UIKit for iOS and AppKit for Mac OS. These kits read user input from different
    inputs, translate them into events delivered to client code, and organize the
    user interface. A high-level overview of the graphics APIs is shown in Figure
    14.1.


    The high-level toolkits provide a fairly large number of widgets such as buttons,
    checkboxes, tables, and editors. With few exceptions, the widgets are both sufficiently
    self-contained and performant for responding within the thresholds desired earlier,
    so generally not a problem.


    These widgets are built with a user-extensive hierarchy based on the NSView on
    OS and iOS. A view describes a rectangular area on the screen that it renders,
    using the drawRect: method and for which it gets to handle input events. These
    high-level toolkits do their drawing primarily via the general-purpose graphics
    API CoreGraphics, aka Quartz.


