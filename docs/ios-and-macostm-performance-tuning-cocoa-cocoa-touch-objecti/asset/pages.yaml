    Drastically reducing the work the CPU has to compose the different layers then
    creates the headroom to animate these compositions. The fact that the animations
    are orchestrated by a separate process and executed on the highly capable GPU
    hardware means the system can guarantee much greater degrees of smoothness and
    performance than if the client programs were.


    The performance guarantees in turn allow animations to become a central part of
    the user experience. Apart from making the user experience much more “solid” and
    realistic, the animations are also extremely useful in improve perceived responsiveness.


    If the system starts an animation immediately it will feel responsive to the user,
    even if it doesn''t actually have the final answer yet. The time taken by the
    animation can potentially be used to come up with that final answer, as long as
    we can come up with a good enough proxy for the animation target.'
