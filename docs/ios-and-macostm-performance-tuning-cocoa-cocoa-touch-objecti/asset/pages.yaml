  md: '# Keys of Interest


    Another feature that yields 30% is the ability for the client to specify keys
    of interest. The insight here is that many clients only look at a subset of the
    keys, yet the parser expends the parsing effort on all keys, whether they will
    be used or not.


    A general solution to this would be lazy evaluation, triggering parsing only when
    the value is requested. The overhead of managing lazy evaluation can easily outweigh
    the savings, for relatively simple operations we are using here. In addition,
    complexity also increases significantly in languages like Swift or Objective-C
    that do not have comprehensive built-support for lazy evaluation.


    So instead of lazy evaluation, let the client specify the keys that they are interested
    in, and the parser will only parse field values for those keys. The code in Example
    13.18 already incorporates support for keys of interest using the mapper parameter,
    which maps field indices in the field index into the result set. After the boundaries
    of the field are determined, a new MPWSubData is only created if there is an entry
    in the mapper array.


