  md: "# Chapter 3 CPU: Pitfalls and Techniques\n\nTaking into account Amdahl's Law,\
    \ your task should probably take at least around 1 ms before you parallelizing,\
    \ and you should probably consider other optimization options first.\n\nExample\
    \ 3.22 Creating new threads using pthread, Cocoa NThread, or convenience messages\n\
    \n```\npthread_create(&pthread, attrs, my_computation, arg);\n[NSThread detachNewThreadSelector:@selector(myComputation:)\n\
    ToTarget:self]\n[self performSelectorInBackground:@selector(myComputation:)\n\
    withObject:arg];\n```\n\nSo, similar to the balancing of OOP vs. C, getting good\
    \ thread performance meaning indented tasks that are sufficiently coarse-grained\
    \ to be worth off-loading into a thread, but at the same time sufficiently fine-grained\
    \ or uniformly sized until there are sufficient to keep cores busy.\n\nIn addition\
    \ to the overhead of thread creation, there is also the overhead of synchronization\
    \ to shared mutable state, or ensuring that state is not shared—at, if you get\
    \ right. If you get it wrong, you will crashes, inconsistent and corrupted data,\
    \ or deadlocks. One of the cheapest ways to ensure thread-safe is actually pthread-thread\
    \ variables, accessing to such a variable via pthread_getspecific() is slightly\
    \ cheaper than a message sent. This is obviously only an option if you want to\
    \ have multiple separate values, instead of sharing a single value between threads.\n\
    \nIn case data needs to access, that data needs to be protected with mutex_lock()(43\
    \ ns) more conveniently and with Objective-C @synchronized section, which also\
    \ protects against dangling locks and thus deadlocks by handling exceptions inside\
    \ the @synchronized section. Atomic functions can be used relatively cheaply (at\
    \ 8 ns, around 10 times slower than an operation in the uncontended case) increment\
    \ simple integer variables or build more complex lock-free or wait-free structures.\n\
    \n# Work Queues\n\nJust like the problem of thread creation is similar to the\
    \ problem of object-allocation overhead, so work queues are similar to object\
    \ caches as a solution to the problem: they reuse the expensive threads to work\
    \ on multiple work items, which are inserted into and fetched from work queues.\n\
    \ Cocoa's NSOperations actually took slightly longer to create and execute a pthread\
    \ (8 µs vs.7 µs), dispatching a work item using GCD introduced in Snow Leopard\
    \ was really 10 times faster than a pthread, at 700 ns per item for a simple static\
    \ block, and around 1.8 µs for a slightly more complex block with arguments like\
    \ the one in Example 3.23."
