    # # The Power of Hybrids


    When Cox chose Objective-C, the choice of a hybrid language was very

    dideliberate. In addition to needing more performance than a pure Smalltalk code

    he envisioned two different purposes: one is implementing components

    (called “Software-ICs”) efficiently, largely in C, and the other is connecting
    those

    components together using dynamic message sending.

    This hybrid pattern can often be seen where high performance meets dynamic

    grep or are written in C but hooked up dynamically using the shell.

    NumPy is popular for controlling numerical processing routines written in C or

    ++ from Python, and at the high end, supercomputing centers used the

    string-binding language TCL (generally slower than Ruby) to “steer”

    computations in their clusters.


    When performance problems occur in Objective-C, it is almost because

    this hybrid was disregarded and Objective-C was treated as pure

    object-oriented language. As Table 1.1 shows, Objective-C is a very bad pure

    object-oriented language: It is slower than the pure object-oriented languages,

    with high rates of object creation, while delivering fewer features, being

    less crash resistant and offering a far less interactive programming environment.


    Objective-C is an awesome hybrid language, great for connecting coarse

    grain vertices with very fast and flexible message passing. In addition

    al the typical hybrid pattern of pre-fab components in a fast/static

    language connected by a flexible slower language, Objective-C also allows a more

    gradual approach that presuppose the bottlenecks will be.


    You may have noticed at some odd choice of PostScript in the selection

    of languages. The reason for this choice is that the particular PostScript

    interpreter in actually written in Objective-C. And not only is it written

    in Objective-C, it is written in a pure object-oriented fashion, with all PostScript

    objects (stacks, strings, numbers, matrices) mapped straight to Objective-C objects.

    Despite apparently connecting the hybrid pattern and using a more pure

    object-oriented approach, it outperforms the industry-standard PostScript interpreter

    ipped with Mac OS X, which is written in straight C.


