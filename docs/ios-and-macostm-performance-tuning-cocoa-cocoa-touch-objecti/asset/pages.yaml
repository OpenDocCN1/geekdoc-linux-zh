  md: '# Too Much Communication Slows Down Installation 329


    Note that Quartz is smart enough to figure whether there has been any drawing
    at all, so just calling flushWindow() in a tight loop will return immediately
    because it doesn''t actually attempt to flush in a case. You need to actually
    draw something, though it doesn''t actually have to be different.


    # Working with the Display Throttle


    While there are ways of working around the display throttle, games using OpenGL
    can get much higher refresh rates, and it is probably better to actually take
    that lesson to heart: Status updates can happen much more frequently than the
    user cares to know about. For example, I measured an NSUrlSessionDataObject via
    its methods, and it gave me status updates 273 times a second when downloading
    via a g-Mbit/s DSL line.


    Not only am I confident that users don''t care about knowing their extra download
    273 times a second—certainly not—you would actually be able to read a byte count
    that refreshed so often. For the byte count, a second is probably plenty, whereas
    progress bars might be slightly smoother if updated at a higher rate, around 10
    times per second.


    I have so far three techniques to avoid excessive UI refreshes, two which actually
    work. The first technique to be very good for essentially continuous progress
    monitoring, for example, of drawing or disk progress. It uses a timer running
    around 10 Hz that queries the progress and updates the display. Apart from smoothing
    and limiting progress display, this technique also avoids model → communication,
    which is desirable from an architectural point of view. The drawback of the timer
    technique is that the timers have to be started and stopped independently of the
    underlying operation.


    The second technique, update-request batching, avoids explicit timers, but does
    not manage to avoid communication. One way of implementing update-request batching
    is to store the update request and then send a message to deliver at a later point
    in time, for example, 0.1 s, a technique we demonstrate in Example 16.4 in the
    next section.


    The third technique I thought would be clever using performSelector:afterDelay:
    and canceling previous requests, and in fact I have seen this technique used many
    times. Alas, it doesn''t actually work, least if there is enough load for the
    intervals to be shorter than the delay. In that case, we just keep cancelling
    the sending of the update message until the updates stop coming.


    # Installers and Progress Reporting Today


    Considering how egregious this particular problem is, you might think it is rare,
    obvious, and no longer happens. You''ve been—in January 2016, it was reported
    that the node manager npm could be slowed down by 50% to 200% when the progress
    bar was turned on, and Microsoft’s auto-updater still uses around 150% CPU (as
    measured by top on a two-core machine), displaying its progress bars during updates.'
