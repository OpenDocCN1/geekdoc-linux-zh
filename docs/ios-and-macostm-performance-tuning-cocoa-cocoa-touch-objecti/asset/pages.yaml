    # # iOS Considerations


    As we''ve noted a number of times, the lack of a swapfile on iOS makes a significant
    difference: Instead of performance degrading gradually, you hit a brick wall.
    What doesn''t change, however, is the fluid nature of the memory subsystem, and
    together these make for a challenging environment.


    On one hand, your process will get killed if you are too aggressive or quick about
    requesting memory from the system, or too slow in giving up when requested. On
    the other hand, the system has enough uses for checking memory status and only
    what is available will often not your app to function properly.


    Memory warnings, for example, delivered on the main thread. This means that if
    your app is on the main thread (whether allocating or not) while a memory warning
    is pending, your app is likely to get marked as unresponsive and get killed. On
    the other hand, just moving your allocations onto a background thread is not the
    answer: I see apps getting killed because the background thread was happily allocating
    chunks of memory while the foreground thread was trying to process a memory warning.


    One solution I found is for backgrounds with high allocation requirements to "ping"
    the main thread a "do-nothing" message. (using the performSelector:onThread: class
    of messages with the waitUntilDone set to YES). If a memory warning is being processed
    on the main thread, this will block the background thread behind processing and
    allowing memory to be free before proceeding.


    Speaking of memory warnings, when you receive a memory warning, pretty drop everything
    you''re doing and start free memory.

    The inability to swap dirty pages out to disk means that keeping your memory clean,
    by example by mapping, is even more important on iOS than on OS X. Although the
    system can''t swap, it can still force all clean pages out of memory, requiring
    the system to read them back when next required, so the system can be slowed down
    by memory pressure just like OS X.


