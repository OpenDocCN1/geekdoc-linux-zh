    # VM Tracker


    Fortunately, the VM Tracker instrument does capture these allocations and Instruments
    not only has the ability to run multiple instruments simultaneously, but by default
    all the VM Tracker instrument when you select the Allocations template from the
    template chooser.


    The tool tips in Figure 6.13 show this effect with an iOS application running
