  md: '# Command-Line Tools 123


    program and will even break information down by object classes. It is like an
    X-ray machine for your process, and I find it extremely useful for analyzing program
    behavior.


    To run the heap command, you pass it the process name or process id of the process
    you want to examine. It delivers two types of information on stdout. The first
    part is summary information for each malloc zone it finds. The following shows
    the summary information for heap running around Xcode. For each zone, it shows
    how much the program currently has allocated and how much has been allocated for
    this zone from the system. Low utilization numbers are usually a sign of fragmentation.


