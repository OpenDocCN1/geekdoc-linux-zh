    # Trends


    To say that CPU performance has improved dramatically in the quarter of a century
    since the original Macintosh with its MC 68000 CPU was introduced is an understatement
    of colossal proportions. Today''s machines are approximately 4,000 times faster,
    and that''s from a base that wasn''t too shabby to begin. This improvement has
    been achieved by increasing clock-frequencies, adding resources that most common
    instructions can execute in a single clock-cycle, and finally duplicating functional
    units and adding control logic multiple instructions from a nominally instruction
    stream can be analyzed and executed in parallel.


    None of these advances have come for free. Pipelining is usually required to allow
    the many steps in decoding and executing instructions to overlap in order to achieve
    throughput of one instruction per clock-cycle. In addition, clock-frequencies
    require individual pipeline steps to be physically shorter and less capable and
    thus the overall pipelines to be deeper, increasing the cost of pipeline hazards
    as stalls or mispredicted branches, making maximum throughput ever harder to achieve
    and actual performance ever to predict.


    Whereas CPU and memory speeds were roughly matched in the MC 68000 days, even
    allowing for some DRAM accesses to refresh the screen, today DRAM access times
    are 100 times too slow to directly supply the CPU with data. This makes it necessary
    to have large and complex caches between the CPU and main memory. Of course, caches
    make access slower in the worst case, so again have to hope that the average cases
    work in our favor, and predictability is adversely affected. Another aspect here
    is the relative performance of components has changed over the years. Where it
    used to make sense to precompute tables of expensive computations, nowadays its
    very often better to just compute rather than wait for memory.


    Finally, exploiting instruction-level parallelism (ILP) has meant putting a lot
    more functional units onto the die, as well as adding control logic to detect
    and extract potentially parallel instructions and to make sure their effects are
    visible to the running program as they had executed sequentially.


    All of these mechanisms have now reached the point of diminishing returns, the
    free ride that software developers have over the last couple of decades has come
    to a screech halt. We can no longer rely on the next generation of CPUs to cover
    both users'' expectations and our performance sins of the past—performance that
    have eaten up if not all of the gains made in hardware.


    In fact, many luminaries have quipped that software tends to get slower at a slightly
    faster rate than hardware gets faster, and when hardware was still'
