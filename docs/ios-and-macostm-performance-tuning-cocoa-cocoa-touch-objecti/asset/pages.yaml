  md: "# Chapter 7 Memory: Pitfalls and Techniques\n\nOne way to mitigate this is\
    \ to prere the mapped data: For example, a so-called page walker running in its\
    \ own thread simply touches every page of the mapped file, causing it to be read\
    \ into memory. A very simple page walker is shown in Example 7.10. It assumes\
    \ the page size is 4,096 bytes and reads exactly 1 byte from each page in the\
    \ Namespace argument. More sophisticated versions can be paced to stay only a\
    \ little ahead of the main computational thread, for example, when sequentially\
    \ processing a large-mapped file.\n\n# Example 7.10 Page walker\n\n```\nint pageWalker(\
    \ NSData *data ) {\n    int dummyResult=0;\n    const char *bytes=[data bytes];\n\
    \    for ( int i=0, max=[data length]; i+=4096 ) {\n        dummyResult=bytes[i];\n\
    \    }\n    return dummyResult;\n}\n```\n\n# madvise\n\nAlthough page walking\
    \ does not affect the semantics of a program, it improves performance by essentially\
    \ causing the I/O for a piece of the mapped file to occur before the processing\
    \ that will actually need reaches it. Another way to achieve this effect is with\
    \ the madvise system call, which allows you to give hints (\"advise\") to the\
    \ system about your future plans with specific pieces of address space.\n\nOne\
    \ hint can give MADV_WILLNEED. This should have the effect of paging any data\
    \ that's not in memory—similar to the page walker, but simpler. Once you're done\
    \ with a piece of memory, you can tell the system, using MADV_DONT, which will\
    \ make those pages eligible for eviction before. If you are simply accessing contents\
    \ sequentially, MADV_SEQUENTIAL the system will effectively do read-ahead and\
    \ free-behind for you.\n\nGoing back to the discussion in the \"Architectural\
    \ Considerations\" section of this chapter, what memory walking in general and\
    \ MADV_SEQUENTIAL in particular allows you to dig in the call-return style while\
    \ at the same time enjoying the performance advantages of a streaming style, with\
    \ the additional flexibility of being able to break out of that style when necessary\
    \ without jumping through hoops.\n\nThe MADV_FREE is like MADV_DONT except that\
    \ you are saying you don't actually care about the content of the memory in question,\
    \ meaning that the system can discard it. (Dirty memory with MADV_DONT still needs\
    \ to be paged out.)\n\nThe malloc update in Snow Leopard leaves MADV_FREE to heap\
    \ memory that has been freed, in order to avoid swapping memory to disk that no\
    \ longer contains useful data."
