    # Multicore


    As we saw in Chapter 1, Moore''s Law is still providing more transistors but no
    longer significant increases in clock frequency or performance per cycle. This
    shift in capabilities means our single-threaded programs are no longer getting
    faster just by running them on newer hardware. Instead, we now have to turn to
    multithreading in order to take advantage of the added capabilities, which come
    in the form of additional cores. Getting multithreading is a hard problem, not
    just due to the potential for race conditions and deadlocks, but also the addition
    of thread management and synchronization actually adds significant overhead that
