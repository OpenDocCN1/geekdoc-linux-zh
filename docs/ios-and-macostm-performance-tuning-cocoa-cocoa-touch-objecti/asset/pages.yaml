    # File I/O


    Files in Unix are just streams of bytes, with the addition of metadata such as
    a name (precisely, zero or more names), an owner, and access permissions as well
    as dates. Filesystems manage the mapping of a hierarchy of these abstract files
    onto concrete sectors on a hardware device, and the kernel manages moving data
    between the disk (via device drivers) and the unified buffer cache (UBC) and such
    programs or other parts of the kernel. As with the basic API, buffering plays
    a crucial role in making the abstraction performably.


    Figure 10.2 shows a rough approximation of how a filesystem maps to streams of
    data and both the directories of the hierarchical namespace and the data blocks
    to blocks on a storage medium.


    Getting to the file /mach_kernel means reading the directory /, looking for the
    mach_kernel deeper in that directory, and looking up the data blocks for that
    file there.

    2 Accessing a file deeper in the hierarchy such as /Users/marcel/Documents/Hi
    means starting at the /, directory, finding the Users entry in that directory,
    finding the data block(s) for the Users directory, reading those data blocks,
    finding the marcel entry, and so forth.


    The OS must optimally cache each in memory as much as possible, otherwise every
    access to a particular "file" abstraction would require multiple disk accesses,
    each involving an expensive seek, because the data was accessed


