    representations with a common interface is valuable, allowing string representations
    for different usage scenarios to be used interchangeably. For example, literal
    NSStrings are represented by the NSConstantString class that store 8-bit characters,
    whereas the standard NSCFSString class (backed by CFStringFoundation objects)
    subclasses could also interchangeably provide more sophisticated implementations
    as ropes, which store the string as a binary of smaller strings and can efficiently
