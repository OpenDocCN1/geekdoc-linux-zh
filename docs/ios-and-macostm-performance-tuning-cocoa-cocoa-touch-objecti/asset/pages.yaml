    the different serialization methods is more pronounced than just the timings,
    whereas the on-disk size differs by a factor of 2 at most.


    When dealing with large data sets, especially large numbers of objects, Apple
    currently does not have an adequate serialization mechanism, and the mechanism
    that Apple recommends most for large data sets is actually the one that is suitable
    best in terms of time and memory used. The discrepancy is bad for deserialization
    rather than for serialization, with the argument that files are read more than
    they are written. With auto-save and versions, this may no longer be the case.


