  md: 'the garbage collection runs. Concurrent garbage collections generally make
    pauses smaller without completely eliminating them, with additional costs and
    complexities.


    Mark and sweep also interacts poorly with virtual memory, because in a virtual-memory
    environment it scans address space rather than memory, potentially swapping in
    large amounts of unused memory from the disk to discover it is still unused.


    Generation-scavenging collectors ameliorate the negative effects by taking advantage
    of temporal cohesion, whereas copying collectors make a allocation to a cheap
    "bump pointer" operation, which is why most modern collectors are both copying
    and generational.


    Tracing garbage collection is difficult to implement reliably and efficiently
    in a language with pointers such as Objective-C, where pointers may be hidden,
    patterns may make false positives, and memory can''t be moved.


    While workable in special cases, Apple''s home-grown tracing garbage collection
    never achieved the performance and reliability levels to be viable on OS X and
    iOS. In the end, it never made into iOS and was deprecated on OS X after two releases.


    # Automatic Reference Counting


    With the deprecation of the GC in 10.7, Apple introduced Automatic Reference Counting
    (ARC) as an Objective-C language feature. Probably the biggest advantage over
    Apple''s tracing garbage collection is that ARC can be mixed with other reference-counting
    code unlike the tracing collector, which had to be enabled for an entire process
    (including plugins).


    ARC doesn''t just manage the existing ownership rules, which are mostly storing
    references in instance variables. Instead, the compiler inserts reference-counting
    operations when pointers to Objective-C objects are assigned and passed/returned
    from/to functions, vastly increasing the number of reference-counting operations,
    also closing potential windows of vulnerability and making reference counting
    more precise.


    Despite improvements in the runtime functions supporting reference counting, the
    overhead of these additional reference-counting operations would be prohibitive,
    so a LLVM optimization pass is used to remove many of these operations as possible.
    While this additional pass can get rid of the many of these added reference-counting
    operations, quite a few tend to remain, leading to typical slowdowns in the range
    of 10% to 100% compared to MRC.


    Cycles are not dealt with atomically, though mechanisms such as weak references
    have been added to make cycle avoidance easier. A weak reference does not count
    toward the retain count of the object referenced (references that do count called
    strong), and in addition a back-pointer to the referencing pointer is maintained.
    When the strong reference count of the object goes to zero and the object is deallocated,
    all weak references are tracked down and pointers set to zero. This avoids dangling
    references to deallocated objects.'
