  md: '# Chapter 4 CPU Example: XML Parsing


    Note that the code doesn''t actually do any processing of the data itself, it
    just provides the noteParsed function with pointers to sections of the original
    data, annotated as text or tag. The difference between this type of non-extractive
    processing—which just annotates a piece of data—and more extractive processing—which
    actually processes the data—is shown in Figure 4.1 using the XML text <greeting>hello
    world!</greeting> as an example.


    In extractive processing (shown in the top of Figure 4.1), we allocate a new string
    object for every significant XML structure in the original data—this case an open
    tag, some content, and a close tag. We then proceed to copy the content from the
    original data into the new structures, and then proceed with further specific
    processing.


    In non-extractive processing, we don''t do anything once we encounter an element
    of interest, we just notify our client what the element is and where it can be
    found in the binaries.


    This is already sufficient for many kinds of processing, for example, extracting
    the text content or counting tags, but it doesn''t yet deal with decoding the
    tags, attributes, or other structured elements of the file. It can also reproduce
    the original file verbatim and do partial processing on a few interesting bits.


    One bit of inefficiency in the code in Example 4.1 is that it follows the prototypical-machine
    code very closely, going through the switch statement for every character and
    then testing the character for the condition. This repeated checking of the state
    is redundant once we are in a state, we know that we will stay in that state until
    we encounter the character that causes the state to switch. Turning the if conditionals
    for the exit condition into while loops for the continuation fixes this and speeds
    up the variant in Example 4.3 to slightly over 1 GB/s.


    | open | content | close | tag/content objects |

    | --- | --- | --- | --- |

    | "greeting" | "hello world!" | "greeting" | temporary string objects |

    | <greeting>hello world!</greeting> | | copy data into strings original XML data
