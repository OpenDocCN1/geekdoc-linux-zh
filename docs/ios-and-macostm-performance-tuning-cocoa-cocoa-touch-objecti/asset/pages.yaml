    # The Death of Optimizing Compilers


    The type of performance model underlying the query for the SSC was useful when
    computers were generally slower and we wanted them to be a bit faster (or a lot
    faster—but rarely worked out, see Probing''s Law).


    Today, compilers are generally fast, and therefore large parts of most programs
    are performance critical. In fact, what started out is the Pareto rule for performance-critical
    code (20%) of the code accounts for 80% of the performance and vice versa) had
    already moved to a 97-3 rule in 1974 when Knuth made his famous remarks about
    small efficiencies, and nowadays it is ever more skewed.


    The overwhelming majority of code in most programs, and especially in interactive
    programs, is not just hot, but is ice cold. Therefore, its performance is largely
    irrelevant. Unless you have factors of a thousand or more involved: even code
    that is used 1% of the time becomes a significant factor if it runs 1,000 times
    over!


    I think the Cocoa code provides ample evidence that this is true. Just look at
    our own at the ARC code in the "Optimizing ARC" section of Chapter 7: the code
    in non-optimized debug builds was one order of magnitude slower than release,
    yet we dont. I am not sure that the same goes for most Swift code in iOS or Mac
    development. It is being compiled in debug mode (no optimization), and yes, it
    is an order of magnitude or slower than release mode (optimized), and yes, but
    nobody notices. This explains Swift''s reputation for speed that is so strongly
    contrasted by just every bit of empirical data I could find.


    As a consequence, one might think that performance is increasingly irrelevant,
    but that is not to be an incorrect conclusion. Performance is actually getting
    more important, as compilers become faster, users are using them to process more
    data, often dramatically. With more data, the innermost loops of our programs
    are becoming significantly more relevant, not less, even as the rest of the program
    becomes less and less relevant.


    At the same, demands on performance are increasing. Initially, compiler jobs were
    submitted to a data center and could take a day or two to be run. With interactive
    terminals, response times in the seconds become the norm, and later those expectations
    rose to "immediate", meaning mean less than 100 ms. Nowadays, significant parts
    of our computations have to be able to run at animation speeds, 60 frames per
    second or 16.6 ms per frame, with stuttering not permitted. So, predictability
    and worst-case performance are essential.'
