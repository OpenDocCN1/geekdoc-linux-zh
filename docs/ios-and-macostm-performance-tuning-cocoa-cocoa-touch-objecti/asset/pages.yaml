  md: '# Chapter 16 Graphics and UI: Pitfalls and Techniques


    In OS 10.9 and iOS 7, Apple introduced explicit support for reporting progress
    of long running tasks with the NSProgress class and NSReporting protocol. The
    basic idea is to have objects report on progress of individual activities and
    combine those individual reports to obtain the overall progress. Having implemented
    a very similar system back in the late 1990s, I can say that this is very well
    done.


    As, Apple completely dropped the ball, or maybe just pushed, when it came to actually
    reporting progress. The recommended technique for actually reporting to the UI
    is to observe the percentCompleted property of the top-level NSProgress object.
    That doesn''t solve any of the problems we''ve seen, and it adds the problem that
    the KVO notification is going to be delivered on the background thread that changes
    the progress status.


    In fact, Apple admonishes: "Don''t update completedUnitCount in a tight loop,"
    they are aware of the problem, and they realize they haven''t actually solved.


    # Overwhelming an iPhone


    The symptom was that the UI would freeze, for a significant amount of time, before
    the app could use again. This happened especially on first launch of the app,
    as it had to do an initial fetch/update of all the items in all the feeds. Subsequent
    launches tended not to have as much of a problem because data was cached, but
    there was a bad user experience to contain.


    Profiling showed that the time was being spent in UIKit drawing code (text drawing,
    table layout). The Cell reuse mechanism advocated by Apple was being used and
    working as expected, with no particular overhead from Apple creation. Not much
    to do, right?


    Wrong! The problem turned out to be the code in Example 16.2.'
