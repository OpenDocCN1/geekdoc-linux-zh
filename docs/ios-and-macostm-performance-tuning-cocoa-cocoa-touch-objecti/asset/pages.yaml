  md: '# Chapter 13 I/O: Examples


    subclasses. There is no official specification of the binary property list format,
    but Apple’s implementation is published as open source³ and not only contains
    code, but also a lengthy comment describing the format in sufficient detail to
    allow an alternate implementation.


    Figure 13.2 is a rough schematic of the structure of a binary property list extracted
    from the comment in CFBinaryPlist.c.


    There are two main sections: the object table containing variable–length encodings
    of the actual objects and the offset table with indices into the object table.
    The two central sections are a header and a trailer, with information such as
    the root index, the location of the offset table, and the sizes of various objects.


    A few the most recent encodings are also shown in Figure 13.2. The object type
    is encoded into the top nibble of the first byte, with the second nibble either
    encoding a subtype or a length of 0 to 15. A length of 15 is a flag indicating
    that the actual length will be encoded as an integer word following the initial
    byte.


    | header: magic, length, CRC | Integer | 0x1 | length 1 | integer value |

    |---|---|---|---|---||

    | | Real | 0x2 | length 1 | float/double value |

    | object table | String | 0x5 | length 1 | length 2 | ASCII chars |

    | | String | 0x6 | length 1 | length 2 | UTF-16 chars |

    | offset table integers pointing into object table | Array | 0xA | length 1 |
    length 2 | object offsets |

    | trailer: root object offset table start sizes | Dictionary | 0xD | length 1
    | length 2 | key offsets value offsets |


    Figure 13.2 Schematic representation of binary property list format


    > 3. For example, see https://github.com/opensource-apple/CF/blob/master/CFBinaryPlist.c.'
