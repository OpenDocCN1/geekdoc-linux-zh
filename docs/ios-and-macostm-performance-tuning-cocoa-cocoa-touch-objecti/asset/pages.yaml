  md: '# Chapter 2 CPU: Measurement and Tools


    # Data Mining: Focus


    The simplest form of data mining happens when you click the right arrow next to
    a line of the profile, or select *Focus on subtree* the data-mining context menu
    in Figure 2.11: The call graph displayed in the Details view starts with the node
    that was selected, with all percentages relative to this node (which is at 100%
    by definition). I use this to get rid of symbols only in program start; other
    than that, I generally prefer to see context.


    Figure 2.12 shows the call graph of a slightly modified *sumints* program that
    deems twice—once in the main function and once in a helper function.


    The main users of the CPU are two calls to `[NSNumber numberWithInt:one in main
    and one in the other`. If we want to look more closely at the cost of `[NSNumber
    numberWithInt:]`; we might choose to focus, resulting in the focused graph shown
    in Figure 2.13.


    However, closer inspection reveals that this is not exactly what we want, because
    it focuses on only one instance of `[NSNumber numberWithInt:call`, the first one
    in call (you can see that the total milliseconds is roughly the same as the number
    previously shown for the first call).


    However, what we want to see is the total cost of `[NSNumber numberWithInt:]`,
    no matter where it is called. Seeing the cost of a specific function no matter
    where it is called a frequent requirement, and for leaf functions it is easily
    accomplished by switching to the inverted call graph. For functions in the middle,
    there is no obvious way to accomplish this, which is why there is a specific data-mining
    feature *Focus on calls by* . . . in the data-mining context menu (Figure 2.11).


    This is one of those features that you really have to know and why it''s in order
    to make use of it. The result can be seen in Figure 2.14. Once you''ve used this
    multiple-feature focus, you''ll not know how you managed without it. To the best
    of my knowledge, it is the only way to get at this information, except for doing
    further massaging of _sample output.


    ```

    Charge ''[NSNumber numberWithInt:]'' to callers

    Prune ''[NSNumber numberWithInt:]'' and subtrees

    Charge ''Foundation'' to callers

    Flatten ''Foundation'' to boundary frames


    Focus on subtree

    Focus on calls made by ''[NSNumber numberWithInt:]''

    Focus on calls of ''\[NSNumber numberWithInt:]''

    Focus on calls made by ''Foundation''

    Focus on callers of ''Foundation''


    Reveal in Xcode

    Locate dSYM...

    Downloaded dSYM

    Load dSYM

    ```


    Figure 2.11 Instruments data-mining context menu'
