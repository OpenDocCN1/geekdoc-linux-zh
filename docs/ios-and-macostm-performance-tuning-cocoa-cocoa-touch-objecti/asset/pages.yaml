    \ at simple integer arithmetic, and the C program as written translates directly\
    \ to CPU instructions.\n\n# The Perils of (Micro-)Benchmarking\n\nHowever, let's\
    \ run a sanity check to see if we're actually measuring something real. When you\
    \ compile and run Example 1.2, the program displays approximately the same time\
    \ as Example 1.1.\n\n# Example 1.2 Sanity check: an empty test program\n\n```\n\
    int main(int argc, char *argv[]) {\n    return 0;\n}\n```\n\nWhat's going on here?\
    \ There are actually several problems.\n\n+   1. A modern optimizer notices that\
    \ the result of the computation is not used and there are no side effects of the\
    \ computation itself, and therefore discards the computation.\n2. Even if it weren't\
    \ able to discard the result, the optimizer can and actually compute the result\
    \ for this computation statically, instead of generating code for the loop it\
    \ generates for the result.\n3. The number of iterations is small enough, and\
    \ CPUs are fast enough, that total running time is dominated by process start-up\
    \ time; the actual running time of the loop doesn't matter.\n\nIn order to get\
    \ results, we need to make a couple of changes: First, we need to make the task\
    \ larger so that we are actually measuring it and not process start-up overhead.\
    \ We can do this by including an outer loop that simply runs the actual loop we\
    \ want to run a (large) number of times. Second, we use the result, for example,\
    \ by printing it to stdout. Note that both of these requirements combine in a\
    \ way that seems nonsensical at first: We reset the sum variable to 0 every\n\n\
