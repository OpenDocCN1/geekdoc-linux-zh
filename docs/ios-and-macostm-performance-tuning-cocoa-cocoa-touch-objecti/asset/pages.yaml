    model to use external storage for large binary data blobs (this is a good idea;
    also see the "Segregated Stores" section in this chapter), de-normalize your data
    to avoid cross-relationship fetches, experiment with batch sizes in data import
    tasks, put numeric predicates in first fetch specifications, which evaluate more
    quickly, and so on.


    However, all of these are indicative of overcoming a weakness showing off strength.
    If CoreData has such great performance, why do I have to spend so much effort
    getting my fetch specifications to be just the right size, not too large, not
    too small? These recommendations would make a lot more sense if we used the client/server
    model that CoreData is patterned after, minimizing traffic across the network
    is almost always a good idea. When the "server" is not just on the same machine,
    but actually a library sitting in the same process just a function call away,
    preserving communications bandwidth to that server does not have the same weight.


    # SQLite


    If CoreData doesn''t work for you and you don''t want to hold the entire graph
    in memory as required by the serialization techniques presented thus far, another
    option is talking directly to some sort of database. SQLite is popular for this
    application on OS X and iOS as it comes as a library that is embedded in your
    application rather than a separate database server application. SQLite also ships
    with Oses and is widely used by Apple themselves, not least in CoreData.


    The SQLite API is somewhat verbose, so I used the lightweight fmdb wrapper.¹10
    Unlike CoreData, fmdb does not handle relationships automatically, so we have
    to add an object id and a parent id to our data model, which we need to populate
    and resolve as we interact with the database.


    Performance was overall much better than CoreData, for example, 6.7 s to insert
    the 1M objects instead of 26 to 36 s, with only around 16 MB of constant


    > 10. GRDB is a similar wrapper for Swift (https://github.com/groupe/GRDB.swift).'
