    \ structure combining the stop times themselves and the bucket index.\n\nExample\
    \ 13.16 Index structure\n\n```\ntypedef struct {\n    int bytime[32];    // hour,\
    \ minute\n} Buckets;\n```\n\n```\ntypedef struct {\n    Buckets bucketOffsets;\n\
    \    StopTimes times[];\n} AllTimes;\n```"
