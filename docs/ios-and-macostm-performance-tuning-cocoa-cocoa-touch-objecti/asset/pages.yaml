    # Memory and Concurrency


    With the large discrepancy between CPU and memory speeds even for a single core,
    it shouldn''t be a surprise that managing memory bandwidth and latency is one
    of the primary concerns in writing high-performance multicast software.


    If you want to keep multiple cores busy, they need to be able to work out of their
    private caches the majority of the time. Cache aware programs specifically take
    the known size of the caches into account, for example, splitting work into blocks
    of 16K or some other size. As the names suggest, they tend to be parametrized
    by the specific cache size and characteristics, so they are either hardware dependent
    or at least to be parametrized at runtime.


    Cache-oblivious algorithms use a recursive subdivision strategy and typically
    work on trees or tree-like structures, with most of the detailed work done near
    the leaves. The team behind the experimental and defunct Fortress numerical computing
    language (intended to be a safe successor to FORTRAN, hence the name) has many
    good presentations'' on the Web on this.


    Another case of cache pollution can occur when a thread streams through memory,
    forcing threads'' data out of the caches. Special instructions in multimedia instruction
    sets as SSE allow reading data from main memory without going through caches.
    Streaming performance of main memory is much higher than random access speeds,
    which can be sufficient for actual streaming. Apple''s vDSP and vImage already
    take advantage of these instructions, they can be a good option.


    Contention occurs when two threads are trying to access the same piece of data.
    Since data in CPUs is organized in cache lines of typically 64 bytes, false sharing
    can occur when two threads access the data that is actually at different locations,
    but those two locations on the same cache line. In this case, the CPU has to keep
    shuffling the data between the two cores, dramatically lowering throughput. If
    you find have false sharing between threads, adding enough padding between the
    pieces of data that are causing the sharing it on different cache lines can dramatically
    improve performance.


