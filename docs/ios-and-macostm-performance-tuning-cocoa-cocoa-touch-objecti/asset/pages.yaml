  md: '# Event Posting


    One interesting alternative to (relational) databases is an architectural pattern
    known as Event Poster,¹⁵ where instead of modifying a persistent store, you store
    deltas that were added to an in-memory representation of data. Coming back to
    our example of saving Moby Dick on every keystroke, imagine just writing the list
    of keystrokes of (a) storing the entire file or (b) trying to modify the file
    in-place as it is edited.


    It should be obvious that this approach works very efficiently for saving data:
    Instead of writing O(n) on every event as we would were, we write O(1). Updating
    an in-disk data structure such as a B-Tree would cost O(log n) for each update,
    that likely exceeds the relative cost because the operations would tend to be
    expensive seeks and moves, whereas events could be efficiently appended to a file
    sequentially. For n operations, that makes the complexity O(n²) for the full save,
    for update-in-place, and O(n) for event posting.


    In the pure form of the pattern, the event log is the only storage, the in-memory
    state is reconstructed on replaying the event log. This can be surprisingly simple
    and effective strategy, as I discovered when implementing the replacement¹⁶ for
    the problematic BBC feeds processing mentioned mentioned. Once we replayed the
    feed index, noticed that all we needed for persistence was to remove the code
    that deleted incoming feeds (which we already wanted to do for auditing purposes).
    Having a well-optimized ingest processor could easily simplify the rest of the
    system: Performance begets simplicity performs, a virtuous cycle that I witnessed
    numerous times.


    # Hybrid Forms


    Issues with the pure Event Poster pattern are that it requires all data to fit
    in memory and the event log can get very large, potentially growing without irrespective
    of the size of the currently active data (think of rewriting every sentence in
    Moby Dick times the log will be times larger than the size of the body changed).
    For this reason, the Event Poster pattern is usually not applied in its pure form,
    but instead combined with other forms of storage.


    One such hybrid is a checkpoint of the current store: write the state of the system
    at specific checkpoints, for example, using a fast memory dump. On reads, attempt
    to read the checkpoint file, replaying the log if the checkpoint file does not
    read correctly. This was the strategy we used with the feeds processing system,
    in addition to occasionally pruning the log to eliminate entries that were no
    longer relevant, for example, because they were overwritten by later entries (this
    needs to be done if you want to keep the log for audit purposes).


    > 15. http://martinfowler.com/bliki/EventPoster.html

    16. M. Weier and C. Die. “In-process rest at the BBC,” REST: Advanced research
    topics and practical applications (2014). Eds. C. Pautasso, E. Wilde, and R. Alarco.'
