  md: '# Command-Line Tools


    +   1. A header gives various bits of metadata about the process being sampled.
    I usually ignore and for it

    2. The call graph, which is the meat of the information gathered.

    3. A sorted list of the most expensive/most used leaf functions.

    4. A trailer showing an overview of the code/libraries included in the running
    process, which I usually ignore.


    Sample output contains a lot of information, not all of which is necessarily useful
    at any particular time. In particular, the wealth of output can obscure the actually
    relevant information. The Call graph section, for example, is used to convey the
    call hierarchy, and children of particular node are sorted so that the heaviest
    is shown first. We can easily see that allocating NSNumber objects using _CFRuntimeCreateInstances
    takes approximately one third of the time spent. However, finding the other two
    thirds of the time is a bit trickier instead of other functions at that level
    we see the implementation details of _CFRunCreateInstances that are potentially
    interesting tidbits, but not actually pieces of information.

    The fact that sample output opens the possibility of a wide variety of ad-hoc
    processing using Unix tools from the command line. A simple example using grep
    and remove unwanted detail. It cuts off the call graph at a specified depth and
    allows us to see all the direct descendants responsible for our main function.
    It achieves this by removing all lines that start with a specific number (in this
    case 14) of non-numeric characters. As specific entries are indented with the
    number of samples encountered, this effectively filters out entries that are more
    deeply nested.


    ```

    $ grep -v "^[0-9]\{1}" samples.txt | head -20

    Analysis of sampling (pid 4710) 2 every millisecond

