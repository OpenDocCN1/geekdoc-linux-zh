    totality: a highly image-centric weather app and the Wunder-list 3 task manager.


    # Beautiful Weather App


    A couple of years ago, I was approached by a young Berlin start-up that had hitherto

    worked primarily on puzzle apps and had been very successful with that. Their
    goal

    was to build the most beautiful weather app on the planet, and now that they were

    almost done it beautiful (see Figure 17.1) they hit some snags actually getting

    it shippable.


    The app was so heavy that it would routinely crash out of memory

    errors. In addition, there were performance problems. I''ve already discussed
    some

    the lessons learned in earlier chapters, but one of the most remarkable is this

    rasty interaction between memory warnings and threading: If you run your

    memory consumer on the main thread, your process will be blocked from receiving\and
    acting on memory warnings and will likely get killed, even if you could in

    principle do something about them. On the other hand, if your memory consumer

    runs on a background thread, it is likely that it will continue to consume memory

    as even the main thread is trying to do something about the memory warning,

    leading to the process getting killed.


    The solution was to have the background thread occasionally "check in" with the

    main thread by sending a message to the main thread and waiting for the result,

    esfully before large allocations. The result would be give the main thread a

    chance to react to any memory warnings and stall the background thread if such

    processing was taking place.


