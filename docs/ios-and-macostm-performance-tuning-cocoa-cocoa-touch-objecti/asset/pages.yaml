  md: '# Chapter 4 CPU Example: XML Parsing


    solve. In a complete document that can be examined, SAX parser sends the client
    messages for individual events in the XML file (such as “open tag encountered,”
    “character data encountered”) as they occur in the file, and forges without matching
    further stuff.


    Mac OS X started the SAX interface with the NSXMLParser class in Mac OS X 10.3
    and the DOM interface 10.4 not using NSXMLDocument. iOS also has NSXMLParser and
    does not provide an Objective-C level DOM interface, probably due to memory considerations.\¹


    For my particular application, streaming seemed the way to go since the documents
    could potentially get large and I would typically be interested in some small
    subset of the entire document.


    The first attempts at NSXMLParser, which wraps libxml2, were disappointing, and
    given the earlier experience with XML parsing, seemed I should be able to do better.
    Also, any wry attempts at creating an NSXMLParser-compatible SAX API by wrapping
    around output of my C scanner were more than disappointing, some ever than the
    built-in parts. Further investigation revealed that a third parser, the opengroup
    project''s SOPE XML parser, which also wraps libxml2 in Objective-C, achieved
    performance almost identical to NSXMLParser at around 7 MB/s. Obviously there
    was something going on.


    The something was object allocation, with a little bit of API mismatch thrown
