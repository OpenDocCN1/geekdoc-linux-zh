    but you have to use interfaces that allow you to become fast should the need arise.


    The more I have followed Alan\u2019s advice to focus on the methods, the better
    my

    programs have become, and the easier it has been made to make them go.


    # # Methods


    Objective-C methods generally fall into two rough categories: lean and mean C
    data

    manipulation on one hand and high-level coordination using message sends on the

    other.


    For the data-manipulation operations, all the usual tricks in the repertoire apply:

    moving expensive operations out of loops (if there is no loop, how is the method

    taking time?), strength reduction, and using optimized primitives such as the
    built-in

    memory copy functions or libraries like vdsr and finding semantically

    equivalent but cheaper replacements. Fortunately, the compiler will help most
    of

    this optimization turned on. However, instead compiling the end-results of

    loops, LLVM/clang managed to optimize away most of the simple loops from our

    benchmark programs unless we specifically told it.


    In order to keep data manipulation methods lean and mean, it is important to

    design the messaging interface appropriately, passing all the data required

    to into the method in question, rather than having the method pull the data from

    sources.


    High-level coordination methods should generally not executed very often and

    there not require any optimization. In fact, I''ve had excellent

    performance results implementing such methods in interpreted scripting

    languages. A method triggering an animation last half a second, for example, will

    take less than 0.2% of available time even if it takes a full millisecond to

    execute, which simply won''t be worth worrying about.


