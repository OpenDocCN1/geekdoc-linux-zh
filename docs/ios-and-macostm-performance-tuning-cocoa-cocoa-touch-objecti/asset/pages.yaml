    A better use-case is when you are parsing external data into a different internal
    format, but even when it is not without problems. Unless you have fixed-size data
    elements and those to account for when reading, there will be elements of interest
    straddling buffer boundaries, as shown in Figure 12.7.


    Handling this usually requires buffer stitching. First, remember the start of
