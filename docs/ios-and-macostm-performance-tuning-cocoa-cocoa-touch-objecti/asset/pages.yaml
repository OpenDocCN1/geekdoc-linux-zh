  md: '# Graphics and UI: Pitfalls and Techniques


    Fast graphics programming is, in effect, an entire industry unto itself many books
    worth of techniques and much more lore passed around online, so we can''t possibly
    cover it exhaustively nor even do it justice. For example, we will be taking a
    cursory glance at OpenGL. What we do look at techniques that work for non-game
    end-user applications using the regular graphics stack.


    # Pitfalls


    For responsiveness, one of the biggest pitfalls is to perform long or unpredictable
    operations on the main thread. This includes all I/O, as we saw in the previous
    sections, even the smallest I/O operation can potentially take a long time. On
    the other hand, putting operations in the background without actually making the
    I/O responsive is worse, and this is something I''ve also seen a bit of: no spinning
    cursor and all the UI operational, but nothing happens. In this case, being on
    the main thread is preferable as if at least triggers the system-busy cursor,
    giving the user an indication of what is going on.


    For graphics, one of the biggest and most visible blunders is one of the most
    pervasive techniques of delivering graphics: having your assets prerendered and
    delivered as bitmaps. The likely most extreme example of this technique was the
    non-game magazine apps were created using certain Adobe publishing tools for delivery
    on the iPad, with every page of the magazine prerendered as a full-page bitmap,
    once for portrait and once for landscape. With I/O being the slowest part of the
    modern computer experience, both over the (cellular) wireless and from disk, even
    if solid state, this was not exactly a stellar user experience. And when Retina
    displays came out, everything looked even more fuzzy instead of getting better.


    With the advent of high-resolution retina displays, anything that is artwork,
    is digitally generated, should probably be available as vector artwork, if it
    isn''t drawn'
