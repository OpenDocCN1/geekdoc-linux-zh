  md: '# Chapter 17 Graphics and UI: Examples


    The simplicity of the data store is helped by the fact that our back end consists
    of a loose federation of microservices that at best eventual consistency between
    different entities. This means that our consistency requirements are no more than
    the canonical store, keeping the individual files consistent by passing YES to
    the NSD method writeFile:atomically is quite sufficient.


    All writes to disk are asynchronous from the main thread; however, they are executed
    synchronously in a loop from a background thread responsible for the disk. The
    main thread just sends the URIs of objects it wishes to save to the background
    thread via a queue. When the background worker thread gets it it fetches the current
    up-to-date entry from the memory store and serializes it to disk.


    Since the disk always has the most current version, multiple write requests can
    be coalesced by simply discarding duplicate request URIs from the queue. This
    helps minimize the load on the disk subsystem.


    # RESTOperation Queues


    In the previous section, I mentioned that write requests to the file writer are
    sent via a queue. This queue is a WLRESTOperationQueue, instances of which we
    use throughout the system to connect Wunderlist actively acting entities. They
    are, so to speak, the secret sauce for keeping Wunderlist responsive while at
    the same time interacting with network and maintaining persistence.


    As the name suggests, a RESTOperationQueue consists of a Queue of REST operations,
    of which each of a WObjectReference coupled with a REST verb (GET, PUT, DELETE)
    that tells the target what it should do with the reference. What that means depends
    on the specific target. For the disk store, receiving a PUT means that the objects
    specified by the URI should be saved to disk; for the Web interface it means to
    send an HTTP PUT to the back end.


    Each queue can be added to any thread and maintains its own worker thread to service
    the entries. It can optionally deliver to a specified target that''s different
    from the service thread, the main thread. Compared to GCD, having a single worker
    per queue drastically reduces the number of threads with their corresponding resource
    consumption.


    RESTOperationQueue objects support coalescing by automatically rejecting duplicate
    entries. Getting this right crucially depends on the entries in the queue we took
    quite some time to figure this out, with the RESTOperationQueue in its present
    form only appearing after a year of development.


