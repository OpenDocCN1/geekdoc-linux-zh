    When I started this exploration into binary list encoding, I had no idea where
    it would go, and frankly I was not expecting much. After all, the format has been
    in use for over a decade and is an Apple workhorse, so has been optimized heavily
    during the time. I have to admit that I am very happy with how it turned out earlier
    at work, it has tangible results that can be applied immediately. With Not only
    does this example show the principles and techniques I discussed with lazy loading,
    property objects can now be used for very large data sets, potentially simplifying
    a class of applications that need lots of data. Using direct reading/writing removes
    80% of the time and 99% of the memory overhead.


    The large magnitude of these results were obtained not by looking in Instruments
    and removing hotspots, but by looking at architectural issues such as the non-overridable
    API and call/return semantics requiring a fully formed argument.


    That could be: performance could be improved further by optimizing the loading
    of objects or even allowing them to be eliminated by adding inline objects for
    primitive types. The same API could be extended to also cover XML and JSON property
    lists.


    In addition, you might have noticed that the API is now very close to keyed archiving.
    Adding to the fact that binary property lists can actually handle at least acyclic
    object graphs, and you that the only thing missing from a keyed archive is a way
    to encode object classes for dictionaries, for example, in a section after the
    object table, the format has room for it. Alternately, it seems likely that the
    performance overhead of keyed archiving would be significantly reduced if the
    additional nested dictionaries were not materialized in memory.'
