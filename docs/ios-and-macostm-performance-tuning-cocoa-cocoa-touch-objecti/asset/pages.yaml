  md: '# 7

    Memory: Pitfalls and Techniques


    The most common techniques for memory optimization revolve around the use of more
    compact data structures, and this chapter will definitely discuss that topic.
    In addition, we will show some pitfalls, especially those common in Objective-C
    code.(Did you guess that some of them involve Foundation objects?)


    Of course, we also need to have a look leak avoidance, and the special role that
    reference counting plays for both Objective-C and Swift reference types, as well
    as the alternative of passing values around instead of references. We will look
    at Objective-C caching techniques and APIs, as well as APIs for controlling the
    mapping of address space to real memory.


    We will continue our theme of the importance of architectural choices for performance,
    underscoring the point with a small example highlighting the difference those
    architectural choices can make. But not least, we will look at concurrency issues
    and the special iOS memory environment.


    # Reference Counting


    Even after the introduction of Automatic Reference Counting (ARC), one of the
    first topics in every discussion about Objective-C seems to be the reference-counting
    mechanism of Apple''s Foundation. I have to admit I always find the somewhat overblown,
    as reference counting is both easy to work with and very predictable in its performance
    characteristics. As the classic reference-counting implementation is provided
    as library code, it is also amenable to normal factoring techniques for reducing
    the amount of code involved.


    Due to ARC''s performance limitations, I use non-ARC reference counting in performance-critical
    code. My strategy for dealing with reference counting consists of the following
    patterns.'
