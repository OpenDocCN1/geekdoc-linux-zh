    For the static data to loaded, the student had chosen a property list, which was
    quite sufficient for encoding his data structure. The property list should also
    be fast enough for completely interactive performance. The previous chapter showed
    speeds of around 300K objects per second on OS X, even assuming a performance
    penalty of 10 times for iPhone hardware, we would still be able to do the 30 objects
    visible at any time in 1 ms, 16 times faster than required for 60 Hz animation
    (and that’s still a conservative measure as we wouldn’t need to swap out objects
    on every frame).


    The obvious problem is despite only needing a maximum of 30 objects at a time,
    we have to read the entire list before we can display even a single item. If you
    have a large data set, this can quickly become prohibitive. Although CoreData
    might be an option in this case, which would be rejected by the original poster
    and might be too complex for the applications at hand, I would agree with you.


    The obvious solution to the obvious problem is a lazy-loading property list, so
    only the elements that get accessed are decoded. A good place would be the decoding
    of arrays; instead of decoding the array immediately, return an object that decodes
    its elements on-demand. With an actual object-oriented implementation of a property
    list we could just override the implementation of -decodeArray or some equivalent
    method, but Apple’s Foundation implements property listing in CoreFoundation’s
