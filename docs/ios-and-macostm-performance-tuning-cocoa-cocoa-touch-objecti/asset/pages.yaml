    does not, as well as having to manage the data movement without much any feedback
    from the OS regarding total memory pressure and eviction preferences. Finally,
    you won''t be able to take advantage of buffered memory as quickly; data that
    remains mapped is simply a normal memory access, whereas you need to at least
