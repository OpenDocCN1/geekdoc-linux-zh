    You may be wondering where the parallelism is. It is absent, mostly because XML
    is an inherently sequential file format. For example, you might think that you
    can parallelize parsing subtrees, but can''t generally know how deep a specific
    subtree will be, meaning your partitioning is likely to be off, and furthermore
    you can''t continue to the next element without having parsed the existing subtree.
    The interface between parser and client is also a tempting, but the interaction
    is so high-bandwidth and fine-grained to look promising.


    The only approach of parallelizing XML parsing I have seen has a chance of working
    is a very quick and dirty scan of the entire document to get the overall structure,
    and then partitioning the pieces into different threads at boundaries that make
    sense in terms of the document structure.


