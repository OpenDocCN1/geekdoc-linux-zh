    \ and only for the 64-bit version of that runtime. Tagged integers are a technique\
    \ taken from LISP and Smalltalk systems where the value of an integer object is\
    \ not encoded in an allocated structure pointed to by the object, as rather in\
    \ the object pointer itself. This pointer direction when accessing and especially\
    \ the memory allocation when destroying the data (integers in this case). This\
