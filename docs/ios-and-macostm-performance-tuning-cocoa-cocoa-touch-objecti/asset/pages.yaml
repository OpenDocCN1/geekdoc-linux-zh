  md: '# Relational and Other Databases


    These seem reputed for SQLite and CoreData run contrary to the common perception
    of relational databases as the pinnacle of I/O optimization and performance, but
    this perception was never well founded historically, theoretically, or practically.


    In my personal experience, relational databases have typically been around an
    order of magnitude slower than even simply nonrelational storage and query strategies.
    For example, when I was conducting my investigation into Mail.app performance,
    I was stunned to find out querying the metadata of a mailbox with approximately
    20K messages took SQLite well over a second, whereas doing a simple brute-force
    linear search of an index format of that mailbox (essentially a concatenation
    of all messages in a single file) using the grep command-line utility took a few
    millis faster than a sophisticated SQL database!


    One reason, course, is that relational databases are general-purpose tools that
    were never designed with performance as their primary goal. Instead, they were
    meant to allow multiple clients access to ad-hoc queries. It took many years of
    engineering work in the 1970s to 1980s for relational database management systems
    to catch up with performance their competitors. Many of the implementation strategies
    for coping with the hardware environment of the times, such as on B-Trees, multi-threading
    to handle disk latency, and explicit buffer management don’t match today’s hardware
    well, and removing them improves performance by an order of magnitude or more.¹²


    In fact, Turing winner and general database guru Michael Stonebreaker (Ingres)
    has published a series of papers, first declaring the end of the “size fits all”¹
    use of relational databases for specialized applications.¹³ and later the “end
    of an era,” casting doubt even over the use of traditional databases in their
    core application of online transaction processing (OLTP).¹⁴


    > 11. http://www.jwz.org/doc/manual.html


    > 12. S. Harizopoulos, D. Abadi, S. Madden, and M. Stonebreaker. OLTP through
