  md: '# Assessing Swift Performance 177


    frequently allow you to have and keep your modeling cake while simultaneously
    munching down on some delicious performance chow, but they have been either curtailed
    or eliminated outright in Swift.


    Instead the programmer is supposed to structure her programs in such a way as
    to give as much information to the compiler as possible. That is very easy for
    the compiler to understand the whole program and then rely on the optimizer to
    actually figure out how to most efficiently map the high-level abstractions to
    efficient/optimal machine implementations.


    I call this compiler-oriented development (COD) because it seems to be more focused
    on making life easy for the compiler rather than the developer.


    It is very different from the hybrid model represented by Objective-C that we
    talked about a bit in the "Power of Hybrids" section in Chapter 1: The compiler
    mostly gets out of the way, and the language provides simple and understandable
    abstractions. It is the developer''s job to spot hotspots and fix them using the
    many tools provided.


    # Benchmarks


    This is a short section. While Apple has provided slides and headline comparison
    numbers, it hasn''t provided the benchmarks those numbers are on or even just
    detailed results. Requests to provide the source code to those benchmarks were
    met with silence. In short, Apple has provided no empirical data regarding Swift''s
    performance.


    # Assessing Swift Performance


    With Apple not forthcoming on Swift''s actual performance characteristics, we
    have to take a look ourselves, tuning without at least some idea of what those
    characteristics are in practice is meaningless. In the following, I will give
    an overview and an analysis of the current state of Swift performance and look
    at the highly compiler-centric model of optimization championed.


    # Basic Performance Characteristics


    We already saw some Swift performance characteristics in Chapter 1, for the integer
    summation code in Example 1.5 and 1.6.


    Performance when computing with primitives and basic control flow is not too dissimilar
    to Objective-C, with an approximate 50% performance penalty, rising to roughly
    300% when objects were involved. To find out what the cause of this penalty was,
    I compiled the primitive version in Example 1.5 (integer summation) and then examined
    the generated machine code with otool -Vt. The result is shown in Example 9.1.'
