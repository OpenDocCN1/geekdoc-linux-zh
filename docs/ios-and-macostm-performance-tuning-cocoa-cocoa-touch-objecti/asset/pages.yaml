  md: 'and removing the shadow did not make a difference; all the thumbnails were
    still colored red due to blending.


    In the end, it turned out the problem was the thumbnail themselves contained an
    alpha channel. This alpha channel was not needed because all the pixels had full/opaque
    coverage, but this is not something the GPU or the APIs can figure out, so it
    had to run the blending operation, and then to completely overwrite the target
    pixel.


    The thumbnails were created from the PDF files using a Core Graphics context,
    so the fix was to specify kCGImageAlphaNoneSkipList as argument to CGBitmapContextCreate(),
    instead of kCGImageAlphaMultiplied Last. Specifying kCGImageAlphaNone, the obviously
    choice for not wanting an alpha, did not work; the function returns an error at
    runtime.


    Figure 15.8 shows the result of the fix: everything is green in Instruments (shown
    as light gray in the printed book), indicating no blending, and with shadows drawn.
    Also, the performance gain was fairly minimal, but sometimes that''s all you can
    get, and considering the also fairly minimal effort, it was a worthwhile optimization.


    Finally, I also looked at the misaligned image (Figure 15.9), which shows a misaligned
    thumbnail images. As the images should be centered and the width of the image
    can''t be controlled, there is no way to align the currently misaligned images,
    so potentially this will need to stay unoptimized.


    If it turns out that the misaligned generating procedure could be modified to
    round the widths of the image up to the nearest "alignment-safe" value and then
    draw the actual document thumbnail centered within the larger thumbnail. However,
    this would require making the edges of the image transparent in order to maintain
    visual fidelity, which incurs blending costs (see above). Another option would
    be to compromise on visual fidelity and draw the thumbnail with a small white
    border or draw it to slightly different dimensions.


