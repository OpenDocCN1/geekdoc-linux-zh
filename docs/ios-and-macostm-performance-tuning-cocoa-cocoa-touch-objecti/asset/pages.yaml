    # Data Handling


    In addition to utilizing network bandwidth, another problem with the initWithContentsOfURL
    approach is data handling and memory consumption. Each individual file is loaded
    into memory before processing begins, which can be a problem if the amount of
    data is large.


    There are two ways of dealing with this problem. The first is to process data
    immediately and incrementally as it arrives. This approach works well if the amount
    of incoming data per file is large, can be processed incrementally, and will be
    reduced substantially in processing. It means that the processing logic will be
    able to process data in chunks, dealing with buffer stitching (see above) and
    partial results, and also be able to report those partial results to the UI.


    For this particular feed-handling approach we choose the second approach, which
    is to download the files to disk instead of memory and then map those files into
    memory. This gives us the advantages of memory mapping and the simplicity of dealing
    with complete files. It was feasible because the individual feed files were relatively
    small; we just had a lot of them.


    By downloading to disk, we also more or less automatically have our own URL cache.
    We could control the lifetime of objects in our cache and also use it for offline
    reading and quick start-up, starting the application from the cache and updating
    the data incrementally to the server if available.


