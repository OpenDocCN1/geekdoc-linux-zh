  md: '# CPU: Measurement and Tools


    Measurement plays an absolutely crucial part in performance optimization. We cannot
    control what we cannot measure, and controlling performance parameters—hopefully
    by improving them—is the goal of the exercise. Without measuring to control our
    results, we cannot be sure that what we are actually improving the situation,
    rather than making it worse.


    Another important aspect is analysis; after all, it helps tremendously to have
    a good idea what might be the problem before we try to fix it. However, unlike
    verification, measurement for analysis has just a helper function, being one of
    the sources for forming our hypothesis about the nature of the problem. When a
    problem is obvious, it can be expedient to skip measurement and act directly on
    the current hypothesis. Of course, increases the risk that you get your hypothesis
    wrong, and verification will tell you that you missed and need to try again. This
    is so much a personal choice based on your experience, hit rate, and tolerance
    for extra work that you guessed wrong.


    Apart from the pure discovery step, performance measurement should be looked like
    scientific experiments designed to answer specific questions in relation to an
    existing hypothesis, meaning the tools should always be used to answer a specific
    question that you have. Just gathering lots of data and chasing numbers without
    a specific performance analysis by the system and question you want is rarely
    effective, unless you are happy with spending a couple of days optimizing your
    system''s idle loop.


    Fortunately, Mac OS X has plenty of tools to answer a variety of questions you
    might have about CPU performance. The task is made easier by the fact that CPU
    time is a quantity that is tracked for every process by the scheduler as part
    of normal operations, and tends to be very deterministic for a given program.
    In many simple cases, that time tracked by the system can simply be queried and
    accurate. If more fine-grain information is required, sampling tools can give


