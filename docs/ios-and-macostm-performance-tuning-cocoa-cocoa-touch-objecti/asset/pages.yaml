  md: '# 9


    # Swift


    Introduced to great fanfare at WWDC 2014, Swift is Apple’s new programming language,
    billed as “Objective-C without the C.” This was an interesting marketing slogan,
    considering the fact that we know Objective-C was created by adding Smalltalk
    to C (Equation 9.1).


    > Objective-C = C + Smalltalk (9.1)


    According to the rules of Algebra I learned in high school, subtracting C from
    both sides of the equation (Equation 9.2) does not yield Swift, and in fact Swift
    seems much closely related to C# or C++ than Smalltalk or, for that matter, Objective-C.


    > Objective-C – C = Smalltalk (9.2)


    Minor marketing issues aside, Swift has been a hugely popular success, with many
    articles, books, and conferences dedicated to the topic.


    # Swift Performance: Claims


    From the very beginning, Apple has been heavily promoting Swift’s performance,
    right down to the name: Swift. In the Platforms of the Union, performance of the
    new language was a key focus, for example, with the performance comparison shown
    in Figure 9.1.


    It is an impressive display, with Swift being 3.9 times faster than...exactly
    what? Python. You might wonder what Python is doing in this comparison, considering
    that it is an interpreted scripting language that is not intended for performance–intensive
    work at all and has effectively no relevance to OS X and iOS development.


    It turns out that when you compare the Objective-C and Swift columns, 2.6 vs.
    3.9 is just a factor 1.4 difference, and when you plot that and make the colors
    the same as one another, as shown in Figure 9.2, that’s not particularly impressive
    slide.'
