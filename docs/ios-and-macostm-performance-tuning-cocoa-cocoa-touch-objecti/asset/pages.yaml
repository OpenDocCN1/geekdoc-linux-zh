  md: '# From Quartz Extreme to Core Animation 305


    CPU is effectively idle, waiting for those commands to finish. Both cases also
    feature low-powered CPUs by modern standards.


    In addition to benefiting special-purpose hardware, GPUs can also take advantage
    of the massive parallelism in graphics workloads and the huge numbers of transistors
    available on current technology chip dies to exploit that parallelism. CPUs have
    similar transistor budgets, but simply do not have nearly the same parallelism
    available in their workloads.


    So whereas CPUs designers have to resort to more elaborate schemes in order to
    squeeze every performance gains out of their largely serial insertion streams,
    additional hardware resources tuned at GPU workloads translate almost linearly
    to increases in performance. This is the main reason that GPU performance is not
    just much higher than CPU performance (for applicable workloads), but the performance
    improvement curve is also much steeper, maintaining the gap that widens with every
    year.


    # From Quartz Extreme to Core Animation


    Exploiting the performance potential of modern GPUs for system-wide graphics rendering
    rather than OpenGL-based games has been a driving force in the evolution of Mac
    OS and iOS graphics APIs, starting with pure Quartz-based rendering and slowly
    adding accelerated components such as Quartz Extreme, Quartz GL, and most recently
    Core Animation.


    The most obvious way of leveraging GPUs for Quartz drawing is to map the Quartz
    primitives to GPU commands. The problem with this approach is that the graphics
    hardware implements OpenGL-compatible primitives, and OpenGL primitives do not
    match the Quartz primitives. OpenGL does not have paths; it has triangle or quadrilateral
    polygons, or curves. Instead of strokes, there are polygons. While mapping these
    primitives is, for example, tessellation for converting filled paths, translation
    is expensive. OpenGL has a loosely defined rendering model, meaning that hardware
    has significant leeway in interpreting commands in a way that is efficient. This
    looseness is in conflict with Quartz''s strictly defined imaging model and Apple''s
    requirements in terms of graphics fidelity.


    However, there is one primitive that translates readily: raster images. And there
    is a (hidden) subsystem the Window Manager, which multiplexes the physical screen
    between windows owned by a different process so that every process can draw into
    its own windows without having to worry about other processes are drawing.


    Via the Window Manager, every graphics API on Mac OS X, whether immediate or retained,
    in fact becomes a retained API with the window bitmaps the retained state, with
    all the advantages of a retained-mode API: Windows can be moved around and the
    consequences of content becoming visible entirely within the Window Manager. Unlike
    many earlier windowing systems, and unlike the view'
