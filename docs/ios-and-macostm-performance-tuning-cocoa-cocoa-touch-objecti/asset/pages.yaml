  md: "# Example 16.2 Model to view notification code\n\n```\n- (void) notifyChanged\n\
    {\n  [NSNotificationCenter defaultCenter\n      postNotificationName: @\"UserChanged\"\
    \n      object:nil];\n}\n```\n\nAlthough this code may seem OK and matches a lot\
    \ of the published example for NSNotificationCenter, it actually suffers from\
    \ two problems. First is the lack of update-throttling discussed in the previous\
    \ section, the second is that it is too unspecified: it just says that something\
    \ changed, not what changed. Without this important piece of context information,\
    \ the UI element receiving the notification (in this case, a table view) has no\
    \ other choice but update all of its UI. Not only is this quadratic in the number\
    \ of (visible) elements, it also updates the display for items that are not even\
    \ visible and may not be in the current list at all!\nThe simple way of overcoming\
    \ this problem is of course to include the current object in the notification,\
    \ which fortunately NSNotification is set up to handle. Example 16.3 shows this\
    \ improvement.\n\n# Example 16.3 Model to view notification code with context\n\
    \n```\n- (void) notifyChanged\n{\n  [NSNotificationCenter defaultCenter\n    \
    \  postNotificationName: @\"UserChanged\"\n      object:self];\n}\n```\n\nThe\
    \ receiving code was then able to retrieve the object in question the notification,\
    \ figure out whether it was relevant at all (contained in the current table),\
    \ and then update only that row. The code in Example 16.4 combines this context-dependent\
    \ refresh with the batched refreshing from the previous section. It assumes that\
