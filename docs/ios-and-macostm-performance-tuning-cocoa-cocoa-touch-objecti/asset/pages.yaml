    # Profiling Options


    As I mentioned, the default profiling options are adequate for a wide variety
    of profiling tasks. On the other hand, customizing your profiling session can
    transform Instruments into a highly tuned profiling machine, and my guess is once
    you''ve used them you will quickly find them indispensable.


    First, there are a number of variations for starting a profiling session in addition
    to hitting Profile in Xcode. Using the selector in the top left of the toolbar
    (to the right of the record and pause buttons), you can profile programs that
    are already running or launch arbitrary GUI or command-line programs on any device
    enabled for debugging. You can switch an iOS device to untethered profiling if
    you need freedom of movement, for example, to profile code using instruments


    The Instruments Dock menu also has additional entries that allow you to start
    profiling sessions without interacting with the Instruments UI. This can be important
    if you want to capture information from an application running on the same computer
    as Instruments without deactivating that application, which would happen if you
    interact with the Instruments UI. An even more hands-off approach is starting
    a profiling session using the instruments command-line tool.'
