    \ best we can achieve\nspeedup to the number of cores in the system—and this is\
    \ only for perfectly\nparallelizable, so-called “embarrassingly parallel” problems.\n\
    \n```\nS(N) = \\frac{P}{(1-P) + \\frac{P}{N}} (3.1)\n```\n\nAmdahl’s Law (Equation\
    \ 3.1), relating the potential speedup (S) due to\nparallelization with N cores\
    \ (S(N)) to the fraction of the program that be\nparallelized (P) shows that the\
    \ benefit of newer cores gets very quickly when\nthere are even small parts of\
    \ the program that cannot be parallelized. So even with\nvery good 90% parallelizable\
    \ program, going from 2 to 4 cores gives 70% speedup,\ng from 8 to 12 cores only\
    \ another 21%. And the maximum speedup even\nwith infinite number of cores is\
    \ 10. For a program that is 50% parallelizable,\nspeedup with 2 cores is 33%,\
