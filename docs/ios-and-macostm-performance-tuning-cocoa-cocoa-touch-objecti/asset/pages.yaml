  md: '# Core Animation Instrument


    315


    copies/blends the entire layer tree on an update. The shouldRasterize flag on
    a layer tells Core Animation to instead cache the rasterized representation of
    the sublayers of the layer that the flag is set on.


    It does not keep the rasterized bitmap of all the layers with this flag set, however,
    but instead has a global cache where a limited number of bitmaps are kept for
    a limited amount of time.


    +   **Color Copied Images**—This flag shows whether a specific image was able
    to be used directly by the GPU or had to be copied/converted by the CPU first
    (it colors the latter case).


    +   **Color Misaligned Images**—This is another flag for fine-tuning memory patterns.
    When images are aligned on word boundaries, all memory access is at least a full
    word at a time. When images are not aligned, multiple source words need to be
    read in order to produce each word of output, and the GPU has to shift and mask
    the source bits.


    Depending on how smart the GPU is, the extra memory accesses either occur for
