    # OpenGL


    The second fundamental graphics API in Mac OS X is the 3D OpenGL API (OpenGL ES
    on iOS). OpenGL is a language-independent and cross-platform 3D graphics originally
    developed by Silicon Graphics but later turned into an open standard. It surpassed
    the existing open-standard PHIGS largely because, like Postscript and Quartz,
    it was considered much easier to program than the retained-mode PHIGS.


    The graphics model and the primitives supported are very different from Quartz.
    OpenGL has vertex arrays that can be accessed by polygon meshes, polylines, or
    point clouds. Images are not supported directly, but rather as textures applied
    to surfaces. Text isn''t supported at all, so libraries have to be used to convert
    text to polygons or bitmaps.'
