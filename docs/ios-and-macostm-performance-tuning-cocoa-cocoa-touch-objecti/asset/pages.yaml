  md: "# Architectural Considerations 149\n\n(If you really want to try this yourself,\
    \ be prepared to wait a long time and the very least reboot your machine to clean\
    \ up swap space afterward. You may also actually run out of swap space and induce\
    \ a kernel panic, so I don't recommend this. Save your work, back up your system\
    \ beforehand, and don't say you weren't warned!)\n\nThe reason for this memory\
    \ growth is not an implementation flaw in the description method, it is a fundamental\
    \ characteristic of the call-and-return architectural style. In this style, you\
    \ call a function or method and it returns a result. Since that is the entire\
    \ interaction, the result that has been returned is complete; there is no real\
    \ cost of a partial result.\n\nWhen we need to compose these intermediate results\
    \ into a final result, we need to completely build all of the partial results,\
    \ then allocate memory to hold the combined results, and copy the partial results\
    \ into the final result. Repeat this at each nesting level and you get a total\
    \ complexity of O(m x n), where m is the depth and n is the total size. In the\
    \ (admittedly slightly pathological) example given here that the nesting depth\
    \ equals the total size (m = n), gives us the n² result that we measured.\n\n\
    Fortunately, there is a fairly solution using a streaming approach, similar to\
    \ what we saw with SAX for XML parsing, but simpler because we are generating\
    \ partial results instead of parsing. Instead of constructing complete partial\
    \ results, we accumulate partial results into a shared buffer once at the start,\
    \ passing that buffer in our methods of returning the result from the methods.\
    \ The describeOn: method in Example 7.6 implements the accumulator-based streaming\
    \ design for NSArray. The remainder of the code integrates it with the current\
    \ description protocol and exposes a fastDescription that encapsulates setting\
    \ up the accumulator.\n\n# Example 7.6 Streaming a description with describeOn:\n\
    \n```\n#import <Foundation/Foundation.h>\n\n@implementation NSArray(describeOn)\n\
