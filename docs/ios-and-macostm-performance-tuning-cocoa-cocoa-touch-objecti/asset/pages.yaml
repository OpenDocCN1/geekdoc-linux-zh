    # # Stack Allocation


    However, despite the technical inaccuracy, the terminology has stuck and is close
    enough to the somewhat more complicated truth. It is now to distinguish two different
    types of allocation: stack allocation occurs implicitly/automatically when a function
    or method is invoked by decrementing the stack pointer. All variables local to
    a function are allocated using this pointer decrement, so this is extremely quick,
    as is deallocation: the pointer is incremented again. The sizes are computed by
    the compiler.


    Figure 5.7 illustrates how stack allocation works in the schematic program given
    in Example 5.4: a `main()` function that has a single `int` variable and two functions,
    the first of which has a single NSRect local, and the second of which has more
    integers. The diagram illustrates another benefit of stack allocation: locality
    of reference. Since allocation happens by incrementing a pointer, all the variables
    are located near each other in memory, which is beneficial for the way caches
    are organized. All the local variables shown here fit onto a single cache line,
    and that same cache line is reused for subsequent functions, so all this interaction
    with stack variables happens within the L1 cache, with infrequent trips to L2
    or L3 and only rare interaction with main memory.'
