    # Heap Allocation with malloc()


    Heap allocation, on the other hand, is manual: A function or method (in Swift:
    constructor) must be called to allocate, and a different function is called to
    deallocate (there are different ways to automate this, see the “Resource Management”
    section in this chapter). Heap allocation is necessary if an allocation is to
    outline the scope of the function that created it. Heap allocation implies pointers
    and reference semantics, so that you can have more than one reference to it. Objective-C
    and Swift objects have reference semantics and are allocated.


    User programs do not obtain memory (address space) directly from the operating
    system because requiring a system call for any allocation would be too slow and
    the smallest allocation would be a 4-KB OS page. The malloc package requests larger
    (multi-page) pools of memory from the OS and dell them to the user program in
    smaller sizes using the functions malloc, calloc, and realloc. It is the user
    program’s job to return memory to those pools using free.


    Up version 10.5, OS X used “scalable malloc,” an implementation that emphasized
    memory conservation over raw performance and also required significant amounts
    of locking. With Snow Leopard, this was replaced by magazine malloc, an implementation
    inspired by the Hoard allocator³ designed specifically for multithreaded applications.
