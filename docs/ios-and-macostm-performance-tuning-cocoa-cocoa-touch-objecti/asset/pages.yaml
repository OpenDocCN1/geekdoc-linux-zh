    connections, preferring instead to reuse an existing connection. FTP, for example,
    uses a single control connection for an entire session but requires a new data
    connection for every transfer, making it ill-suited for transferring a large number
    of smaller files. HTTP also suffers from being fundamentally connectionless, although
