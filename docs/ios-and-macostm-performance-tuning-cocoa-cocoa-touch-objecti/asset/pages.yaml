    to be what is going on. One of the many data-mining features in Instruments is
    the ability to remove a function from the call tree and its cost to the callers
    of said function. Using this changing feature to remove many of the helpers functions
    used in alloc yields the much clearer picture in Figure 4.3. The malloc free()
    and calloc() alone account for over 31% of the total runtime, and the vast majority
    of the function in that 31% is related to storage allocation.


    Fortunately, we have object caching to help us use this with this case, and it
    is ideally suited for SAX-style parsing: the objects are created temporarily and
    then immediately discarded by the parser, and a lot of very similar objects are
    being created.


