  md: '# Hardware 207


    slower relative to the work we are asking them to do, and also slower relative
    to the computers they''re hooked up to.


    The Apple II''s ProDrive had a transfer speed of 5 MBit/s, which was actually
    faster than the Apple''s 6502 processor could handle at a 1-MHz clock speed and
    several clocks instruction. It could transfer its 5-MB capacity in 10 s, not counting
    seconds. Today''s hard drives transfer around 100 MBit/s, or so 10 ns per drive.
    In 10 ns, our laptop CPU can execute well 30 instructions, if it isn''t blocked
    by memory. The contents of a typical consumer drive with 1-terabyte capacity would
    take 10,000 s, or almost 3 hours to transfer.


    If weren''t enough bad news, access times, while also getting slightly faster
    over time, access speeds are determined by the ability to quickly move and stop
    a mass (the seeking head) and rotational delays. Both are large questions of physics;
    physics haven''t changed and are not going to change, with engineering advances
    in moving and stopping these masses coming much slower. In addition, moving masses
    is associated with noise, so demand for quieter disk drives has actually led to
    decreases in seek performance.


    The ever-increasing spread between transfer speed and seek performance has led
    to the phrase "Disk is the new tape."


    # Solid-State Disks


    SSDs lift many of the physically induced limitations of rotating disks, to the
    fact that they have no moving parts. The initial access times (''seek'') are much
    improved, but as we saw in the last chapter, they still are slow compared to memory.
    There are also physical limitations, for example, increases in capacity such as
    multilevel cells have their trade-off not just decreased reliability, but also
    slower and write speeds.


    Writing in general is an expensive section of flash (which takes some time) before
    any information can be written. Batching becomes more important than on hard drives
    because of small writes will not only be slow; but will also wear out the cells
    ahead of time.


    So SSDs represent an improvement, and they are the easiest to improve things like
    start-up performance or server-side databases (especially if read-mostly), they
    are not a panacea. In fact, a 2012 study¹ Web-browser performance found that it
    was not limited by processor speeds or even slow cellular networks, but instead
    by the combination of SQLite and slow flash speeds


