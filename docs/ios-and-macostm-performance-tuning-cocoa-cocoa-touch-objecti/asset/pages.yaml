  md: '# Temporary Allocations and Object Caching 151


    While this was obviously an extreme example, the general principle that holds
    large data sets with partial results are difficult to handle with a call-return
    architectural style, and even medium-sized data sets with nesting will suffer
    from the need to have full partial results reconstructed by the m × n space/time
    complexity inherent in nested structures. Objective-C suffers more from this style
    than other languages, due to the cost of object creation and the associated autorelease
    needed when returning a newly created object from a method. Just adding data to
    an already existing object is much cheaper.


    So when designing something API, try to make it fundamentally streaming capable,
    for by passing some sort of accumulator that can accept results incrementally.
    Examples of this type of object—for example, the CoreGraphicsContextRef for talking
    to the display or perhaps more famously the Unix descriptor fd or the- object
    for I/O. In fact, Unix is the proper poster for streaming, with its pipes-and-filters
    architectural style, and most Unix filters will work with arbitrary-length data
    without any degradation.


    As shown in Example 7.6, adding a call-return method is easy, whereas converting
    a call-return API to streaming tends to be difficult without a rewrite.


    Once we have an accumulator, an obvious extension is to make the accumulator smarter
    than a simple NSMutableString. We will look a little more closely at a family
    of such classes in the next chapter, which will also take care of the infinite
    recursion in Example 7.4.


    # Temporary Allocations and Object Caching


    As we see here and in the "Object Creation and Caching" section of Chapter 3,
    temporary objects can be a serious challenge for Objective-C programs. The buildup
    of temporary objects is both expensive and can lead to considerable growth, even
    if we''ve taken care to build n² algorithms.


    Heap count can be controlled with nested autorelease pools or with the new describeOn:
    method in Example 7.6 demonstrates this by wrapping every iteration of the loop
    that describes the contents of the array in a nested pool. This cleans up any
    temporary objects that are no longer needed, especially those of the recursive
    send of describeOn:


    Even if we avoid excessive heap by cleaning up regularly, temporary objects still
    present a performance problem because they are expensive to create and destroy.
    This is due to the fact that Next/Apple Objective-C and Swift require objects
    to be heap allocated they do not allow the objects themselves to be allocated
    on the stack like other temporary variables. From a point of view, this limitation
    is unfortunate because stack allocation is essentially free. A single addition
    to the stack pointer "allocates" all the stack variables for a given function.'
