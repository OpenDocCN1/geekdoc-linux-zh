  md: '# Resource Management


    So for small objects, the heap-allocation vs. overhead for L1 cache is on the
    order of a factor 10,000, while for main memory it is still around a factor 100.
    This is one of the primary reasons why many small temporary objects and high performance
    don''t mix easily, though we will show how it can be done in Chapter 7.


    Small temporary objects are absolutely fine for the ≈97% of nonperformance intensive
    code, and small permanent objects are also fine. This is good, in many cases,
    modeling objects with identity, and pure value objects don''t fit the required
    semantics. Reference semantics are also required if you want to construct graphs
    or need to refer to the same object from multiple locations for other reasons.


    But in general, Objective-C and Swift prefer their objects to be coarser grained
    and more long-lived than pure(r) object-oriented languages, which tend to be object
    allocators not based on malloc that can be significantly faster at supporting
    fine-grained objects.


    If you have large objects, heap allocation can also be significantly faster than
    stack allocation because you can pass an 8-byte pointer rather than copying the
    whole object.


    At the other end of the scale, you will notice that the allocation becomes extremely
    small compared to actually using all that, and in fact that the ending operating
    system hasn''t cleared the memory, it has lazily provided address space. The more
    significant cost will come as the program tries to actually use the memory and
    the operating system provides and clears real memory for the address space requested.


    # Resource Management


    Resources used by a program, such as memory, need to have their life cycle managed
    however: and how is the resource allocated, and when deallocated?


    One simple resource management regimen we looked at in the previous section and
    used in most procedural programming languages, including Objective-C is stack
    allocation: a variable declared within the scope of a function/method that has
    auto scope and is automatically destroyed once the function/method exits, which
    continues to exist while other functions are called.


    For heap-allocated objects with dynamically determined lifetimes, but Stepstone
    Objective-C and pre-Foundation had manual memory management, much like C''s malloc()
    and free(): An object was created and destroyed with +free. This works fine in
    simple cases where there is effectively a single “owner” of an object reference,
    because there is only a single reference or there is a discernible “master” reference
    that determines the lifetime of the object, but it breaks down when multiple independent
    entities have to coordinate the lifetime of an object.'
