  md: "# Chapter 3 CPU: Pitfalls and Techniques\n\nWhile convenient due the literal\
    \ NSString syntax (@\"This is a constant string\"), this conflating of human-readable\
    \ text and functional strings at times be unfortunate in terms of performance.\
    \ Fortunately, many types of keys are more optimized exist—for example, basic\
    \ C strings, message names, and instance variable names.\n\n# Objects\n\nSince\
    \ you're programming in Objective-C, it is likely objects are going to be your\
    \ major data-structuring mechanism.\n\nUse C inside objects. The messaging interface\
    \ hides the representation, and users are none wiser. Try to avoid using fine-grain,\
    \ semantic-free objects to implement the coarse-grain, semantic-bearing objects.\n\
    \n# Accessors\n\nAccessors are methods that just read or write an object's internal\
    \ data, corresponding roughly to memory read and write instructions. According\
    \ to good-oriented style, attributes of an object should not be accessed directly,\
    \ certainly not from outside the object, but preferably from within. Objective-C\
    \ 2.0 properties handle the burden of accessors.\n\nHowever, accessors also at\
    \ least be minimized and ideally be eliminated altogether, because they turn into\
    \ intelligent agents that respond to high-level requests for service to data-bearing\
