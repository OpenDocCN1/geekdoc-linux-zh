- img_proc: true
  md: '# Process-Level Resource Reclamation


    While all the techniques so far work while a program is running, it is important
    to remember that all temporary resources used by a process will be cleaned up
    by the operating system at process termination. This resource reclamation is not
    just essentially perfect, it is also very fast.


    # Summary


    In this chapter we have seen the tremendous performance range of the different
    elements in the memory hierarchy, which are all presented as a uniform address
    space to user programs. In order to optimize performance of memory access, it
    is necessary to minimize total memory use and optimize memory access patterns
    so that they take advantage of the (non-linear) capabilities of the hardware.


    The following chapters will first show how to measure memory consumption and identify
    access patterns, and then go on to techniques for tuning memory use.'
  merge: -1
