  md: '# Chapter 9 Swift


    +   The greater use of value semantics (see the "Stack Allocation" section of
    Chapter 5) using structs is supposed to free us from the cost of heap allocation
    and reference counting, especially ARC (see the "Reference Counting" section in
    Chapter 7), and it is true that dealing with references is particularly expensive
    in Swift, much more so than in Objective-C.


    +   Primitives and objects of these mechanisms are more closely linked, whereas
    a Foundation NSArray can only contain object references, a Swift Array can contain
    primitives, structs, or object references. Primitive numbers are easily boxed
    and unboxed, often automatically, when used in object contexts.


    +   Generics allow specialization to be applied, for example the generic sort
    method of an array can be specialized by an integer-comparison function to yield
    an optimized integer-sorting function without indirection through pointers or
    merges.


    All of this is good stuff, and certainly gives opportunities for a compiler to
    optimize. Having a more unified syntax of two systems bolted together and held
    together with duct tape is also certainly welcome.


    However, all of these mechanisms might only lead to better performance; there
    is no guarantee that they actually do, and they are available to Objective-C programmers
    as well. For example, Objective-C makes heavy use of value semantics for primitive
    types such as floating point numbers and structs as NSString, CGPoint, NSRect,
    NSRange, and so on.


    Making their slightly more convenient is not a bad thing per se, but it also doesn''t
    actually do for performance, especially since Apple recommends and expects most
    to be using classes:


    > "In all other cases, define a class, and create instances of that class to be
    managed by reference. In practice, this means that most data constructs be classes,
    not structures."


    Apple Inc., 2014. The Swift Programming Language (Swift 3). eBooks.


    This recommendation to use classes is used, as we know that micro-optimizations
    as this isn''t worth 97% or more of the code. However, it is in conflict with
    Apple''s recommendations for Swift, which are vastly prefer structs unless there
    is a compelling reason not to do so.


    The problem is that both recommendations are correct, and the inherent conflict
    flies in the face of the collective wisdom gathered over the last 40 years or
    so: Model the data first, appropriately; apply targeted optimizations after. With
    Swift, you are supposed to make this performance choice at the modeling stage
    of your application.


    Objective-C also had and still has this problem, as the previous chapters showed
    there were mechanisms that allow the developer to apply targeted optimizations
    for better performance, such as IMP-caching, object-caching, or use of basic C
    data types like char* instead of String. These mechanisms'
