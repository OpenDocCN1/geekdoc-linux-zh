  md: '# Command-Line Tools


    In this case, we see that the sumint is a lot of CPU capacity, essentially all
    of one CPU, and that it''s being done for quite some time, accumulating a total
    of over 9 s of CPU time. The CPU usage line in the header shows us that we have
    a two-processor system, because without almost 100% of one CPU is still taking
    slightly less than 50% of the total CPU capacity available in the system. This
    type of display shows that we have something worth investigating more.


    I tend to run top with the -u flag that shows %CPU usage when running in a general
    "tell me the system is doing" so that the most active processes are always near
    top, but without that flag when I am trying to focus on a specific process, so
    it stays in the same place in the output. Check out the page for many more sophisticated
    options to control display, analysis, and sampling rate.


    # time


    We already used the time command to give us measurements of the different summation
    programs. It is one of the simplest measurement tools available, as it executes
    its argument and reports the CPU time and the clock time by execution of the whole
    program. CPU time is broken down into time spent in user-space and kernel space
    (sys).


    As it provides only a few numbers and requires no setup, it is perfect for quickly
    testing out algorithms that can be extracted into a command-line tool. Analysis
    of larger programs is not supported, again, unless parts can be extracted into
    a tool. Let''s look more closely at the time output running our test:


    ```

    $ time ./sumintsc


    500500


    real       0m.764s

    user       0m.735s

    sys        0m.0306s

    ```


    The fact that real time is almost identical to user time means that the program
    is almost nearly CPU bound, focusing on CPU performance is the correct approach
    for improving its overall performance. On an unloaded system, a large difference
    between real and user + sys will mean that the CPUs are not CPU bound, but waiting
    for I/O or for other programs. If not enough CPUs are available for the system,
    it could also mean that the kernel preempted the program. As this is indistinguishable
    from the other situations, it is important to have sufficient idle CPU resources
    in the system to run the test program. Fortunately, with modern multicore computers,
    this is becoming less of a problem.


    One thing to watch out for is that time exists both as a separate program in /usr/bin/time
    and as a built-in shell command. You will usually get the built-in command, but
    the man page explaining some extra options applies to the command /usr/bin.


    19'
