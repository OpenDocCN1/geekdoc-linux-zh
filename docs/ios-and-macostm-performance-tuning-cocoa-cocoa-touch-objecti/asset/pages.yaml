    # Objects, Cheaply


    Before moving on, we obviously need to check whether our back-of-the-envelope
    calculations about the relative cost of object creation in XML parsing are true.
    Using the Invert Call Tree of the Profile instrument should point us to the bottlenecks
    of a program, and our reasoning leads us to believe that we should have a bottleneck
    in object allocation.


