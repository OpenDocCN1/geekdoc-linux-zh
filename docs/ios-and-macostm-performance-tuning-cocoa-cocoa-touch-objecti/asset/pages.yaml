  md: '# Negative Space: top and time


    Our friends time and top are useful in detecting that I/O is happening and blocking
    our process, through mostly using the concept of negative space: if we notice
    time that is not accounted for, or CPU utilization significantly below 100%, there
    is a strong suspicion that I/O may be to blame. For example, running the command
    time .datamapping test_file yields the result shown:


    ```

    > time .datamapping testfile_3gb

    real 0m1.937s

    user 0m0.305s

    sys 0m1.613s

    ```


    The large discrepancy between real and user time, with user time only being 0.3,
    but the real time being more than 10 s. The sys time only adds 1.6 s of kernel
    CPU, for a total of about just 2 s of time using the CPU. The other 8 s are missing,
    meaning only about 20% CPU utilization and 80% idle time. This could have been
    from processes preempting this one, but scheduling is usually fair that it would
    have been several processes or one at significant higher priority, for a real-time
    process. Another reason would have been that the process decided to de-schedule
    itself by using the sleep() system call or similar calls to wait for some specified
    amount of time.


    The most likely explanation, especially in our case, is that the process is I/O
    bound, meaning it was synchronously waiting for an external device to perform
    some I/O—in this case, to deliver data.


    Assuming you have enough memory for keeping the file in RAM, a second timing run
    of the program will yield the very different results shown below: it is much faster,
    and user sys add up almost nearly to the real time measured.


    ```

    > time .datamapping testfile_3gb

    real 0m1.937s

    user 0m0.305s

    sys 0m1.613s

    ```


    This is the result of the buffer cache we discussed in the last section. The entire
    file has been cached in memory, and instead of doing I/O from disk, the OS just
    copies the data from the buffer to the program, making repeatable I/O trivial.


    The purge command enters the buffer cache and returns the system to roughly the
    same state it was after a cold boot (power-off). After a purge, the OS will be
    free to read from disk again. The purge command''s effects are global and also
    changes to be written to disk, so expect significant degradation in system performance
    for a while. Also, wait for the system to settle and page in its basic necessities
    before performing your measurements.


    You can also see symptoms of an I/O bound process in the top screenshot Figure
    11.1, with top showing the datamapping process at 17.7% CPU'
