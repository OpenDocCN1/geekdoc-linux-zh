  md: '# Operating System 213


    swapping despite the fact that there is plenty of RAM to keep all programs in
    memory—a problem that showed up with Spotlight, for example.


    Fortunately, this tends to be more of a problem for system services and can be
    mitigated by using uncached/unbuffered I/O and/or explicitly controlling the allocation
    strategies with the madvise() system call we saw in the `madvise` section of Chapter
    7.


    In addition to caching previous reads where the same data is read again in the
    future, the disk subsystem speculatively reads data that it believes will be requested
    in the future, so-called read-ahead.


    The UBC does not cache reads, but it buffers writes. When a program writes to
    a file it is copied to the UBC. The sync() system globally writes changes to disk.
    It is executed every 30 s by the launch daemon (earlier OS versions have a separate
    daemon for the same task). Delaying the writes decouples the application from
    the slower I/O devices and allows the system to group I/O together in larger batches,
    optimizing the I/O in the process, combining writes to a single block, or shorting
    requests to minimize disk seeks.


    Again, this buffering is crucial for general system performance, an earlier version
    of Unix that used synchronous writes had around 3% to 5% the write throughput
    of systems with write buffering, and similar slowdowns can be observed when forcibly
    writing to synchronous. The main cost of delayed writes is that data may not be
    consistent on disk even though the application has written it and can be lost
    if there is a power failure or system crash between the time that the application
    wrote the data and the time of the failure. In addition, there is an in-memory
    copy operation.


    # The Network Stack


    The main network stack on OS X and iOS deals with TCP/IP, the Transmission Control
    Protocol/Internet Protocol. Basic IP is packet oriented like most of the network
    hardware, but the widely used TCP provides the “stream of bytes” abstraction used
    throughout the rest of the Unix kernel. The main of high-level protocols used
    over the Internet today such as HTTP and FTP are built on top of TCP’s stream
    abstraction, with the packet-oriented, unreliable Datagram Protocol more widely
    used for broadcast and media applications.


    A naive implementation of a reliable, stream-oriented transport would be limited
    by the latency of the network, because receipt of packets has to be acknowledged.
    Fortunately, TCP is a very sophisticated protocol paired with equally sophisticated
    implementations. Significant amounts of buffering, sliding receipt windows, flow
    control, out-of-order retransmission, and so on, help TCP achieve throughput close
    to the available bandwidth in many situations without much help from the application
    programmer.


    However, establishing TCP connections is limited by network latency, and actually
    takes several round-trips, so care should be taken to minimize the number of'
