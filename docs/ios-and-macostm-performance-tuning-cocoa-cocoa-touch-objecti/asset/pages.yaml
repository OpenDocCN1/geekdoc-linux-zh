  md: '# CPU: Principles


    The interaction between CPU performance and Objective-C has a history going back
    to the beginnings of Objective-C in the early 1980s and the first public release
    of Smalltalk. Smalltalk is a dynamic object-oriented language and environment
    implemented on a top of a byte-coded virtual machine with garbage collection and
    complemented by the first integrated bit-mapped graphical user interface (GUI).
    It was this environment Steve Jobs saw during his famous visit to Xerox PARC and
    decided to popularize with the Lisa and Macintosh computers.


    Although it provided amazing capabilities for the time, the Smalltalk environment
    proved too much for the emerging workstation-class microprocessors such as the
    Motorola MC 68000, which was to be at the heart of both the Mac and Lisa, and
    handle with acceptable performance.


    Three approaches emerged to tackle this performance problem—two at the extremes
    and one compromise somewhere in the middle.


    +   1. The first approach is represented by the Macintosh Toolbox and original
    MacOS. The Macintosh completely dropped the expressiveness of Smalltalk''s dynamic
    object-oriented approach and instead retained just the GUI, which was reimplemented
    in MC 68000 assembly language. This made it possible to personalize the GUI, but
    left the software engineering and environmental advantages of Smalltalk.

    in fact, Steve Jobs said that he was so enthral with the GUI that he missed the
    more important pieces of the PARC magic: object-oriented programming and networking.

    2. On the other end of the spectrum, the Smalltalk community decided to innovate
    in implementation technologies to close the performance gap. This led to important
    innovations such as just-in-time compilation and scavenging garbage collection
    that dramatically increased performance.

    Moore''s Law turned out to be an even bigger contributor, though. Even a naive
    Smalltalk-80-style bytecode interpreter on today''s hardware is roughly 100 times
    faster than assembly language on MC 68000 class machines even for basic'
  merge: -1
  pgno: 20
- img_proc: true
  md: "integer operations directly supported by the CPU hardware, and such integer\
    \ computation represents pretty much a worst-case for Smalltalk.\n\n3. The middle-ground\
    \ approach is the one taken by Objective-C, a hybrid language that integrates\
    \ a Smalltalk-like dynamic object-runtime on top of the C programming language.\
    \ Objective-C emerged around the same time as the original Macintosh on comparable\
    \ computational power. Instead of discarding object techniques completely like\
    \ the original Mac, or relying purely on technological advances to make them viable,\
    \ Objective-C makes both sets of techniques easily available at all times and\
    \ leaves it to developers to apply those technological options appropriately.\n\
    \nWith the right set of decisions, this third approach—Objective-C—makes it possible\
    \ to achieve best-of-breed performance and high levels of expressiveness and productivity.\
    \ However, with power comes great responsibility: Used less wisely, it is also\
    \ possible to achieve expressiveness worse than C combined with speed faster than\
    \ Smalltalk. This book will give you the techniques to avoid the latter and the\
    \ former.\n\n# A Simple Example\n\nBut enough, let's see some actual code! The\
    \ task will be simple and purely CPU-bound: summing integers from 1 to 1,000.\
    \ We will implement two Objective-C examples demonstrating the range of styles\
    \ and covering performance characteristics with Objective-C and Cocoa. In addition,\
    \ we will look at the same example implemented in other programming languages,\
    \ which we'll use as reference points for the different Objective-C styles.\n\n\
    Note that this is not a useful method for computing the first n integers. In case,\
    \ we use the closed formula discovered by Gauss: $n(n+1)/2$\n\nThe first thing\
    \ you will notice when you look at the Objective-C program shown in Example 1.1\
    \ is that it looks like C. That's OK; Objective-C is a pure superset of C and\
    \ therefore any C program is also an Objective-C program. Type in the code shown\
    \ in Example 1.1 and save the file as sumint_ex1.m.\n\nExample 1.1 Sum integers\
    \ in Objective-C using primitive types\n\n```\n#include <stdio.h>\n\nint main(int\
    \ argc, char *argv[])\n{\n  int i,sum;\n  sum=0;\n  for (i=1;i<=1000; i++) {\n\
    \    sum=i;\n  }\n\n```"
