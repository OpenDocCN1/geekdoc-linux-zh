  md: "# Chapter 13 I/O: Examples\n\nWith this structure mapped into memory, lookup\
    \ by time becomes quite efficient, only taking around 53.4 μs per lookup, roughly\
    \ a factor of 8,000 faster than the same using CoreData. I mentioned in Chapter\
    \ 12 that mapped binary representation is the way to go for best performance;\
    \ this is an example of that. You might imagine replacing a database query with\
    \ two in-memory structures extracts a memory penalty for our performance improvements,\
    \ but instead I observed a drop in memory consumption, around 4 MB vs 5 MB for\
    \ the CoreData solution. In addition, due to the fact that the structure is mapped,\
    \ the memory used remains clean and thus contributes marginally to memory pressure,\
    \ with the system always evicting of entries without having to spend memory warnings.\n\
    \nI experimented with a few different algorithms for combining the two results\
    \ (location and time). What ended being fastest was a single nested loop, first\
    \ filtering by location and searching for the stops that were found in the buckets\
    \ for the relevant time interval.\n\n# Stop Time Import\n\nHow do we get the stops\
    \ from GTFS structures into the efficient binary format that we can use? Once\
    \ we have an array of StopTime create the bucket index that makes access so fast.\
    \ Since we are sorting by small integers, we can use an efficient bucket sort,\
    \ one of the few (non-general) sorts that run in O(n) rather than the theoretical\
    \ lower bound of O(n log n) for general sorts based on comparison and it exchange.\
    \ Example 13.17 shows the code, as follows:\n\n+   - Size the individual buckets,\
    \ incrementing the bucket count for every instance of a particular count.\n- Offsets\
    \ must take the sizes of all the previous buckets into account, accumulate sizes.\n\
    - Create a temporary copy of the StopTimes.\n- Do the actual bucket sort:\n  a.\
    \ Place the stop into its bucket based on hour and minute.\n  b. Increment the\
    \ bucket offset of the current bucket.\n- Finally, sort the offsets within each\
    \ bucket using a conventional merge sort.\n\nExample 13.17 Efficiently sorting\
    \ stops by first time and then by stop id\n\n```\n(void) sort\n{\n  StopTime *sorted=calloc(count+20,\
    \ sizeof(StopTime));\n  Buckets bucketSizes,bucketOffsets;\n  bzero(&bucketSizes,\
    \ sizeof bucketSizes);\n  bzero(&bucketOffsets, sizeof bucketOffsets);\n}\n```"
