  md: '# Command-Line Tools


    ![](img/29111a88ed1326b01d04057a653fdbec_139_0.png)


    As with CPU performance, the command line offers a number of performance tools
    that give quick and reasonably detailed information without much overhead or set-up
    work. Shell scripts also allow you to combine multiple commands in order to capture
    multiple facets at the same time.


    # top


    We already presented top in the “top” section of Chapter 2 for CPU measurement
    and the many of the benefits are also true for its use in memory analysis. It
    gives you a continuously updated view of the system as a whole as well as some
    information for specific processes.


    The summary information that interests me the most is the PhysMem line. It shows
    how physical memory is actually being used at the system level, with parts wired,
    active, inactive, and free. Wired memory is memory that is in the kernel and cannot
    be swapped to disk; it resides permanently in real memory.'
  merge: -1
