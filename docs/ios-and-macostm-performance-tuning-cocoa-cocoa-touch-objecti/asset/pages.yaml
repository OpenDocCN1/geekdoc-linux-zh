    # Quartz Debug


    For OS X, a specialized tool for debugging graphics problems is the aptly named
    Quartz Debug. Figure 15.3 shows its options window and the framerate meter. Quartz
    Debug enables debugging parameters in Mac OS X''s graphics stack, so it won''t
    affect your project, but all running programs, including Quartz Debug itself,
    so it is best to quit at or hide all other apps except one test.


    The option I find most useful is Flash screen updates, pretty much in the middle
    of the options window. With this option, Quartz flashes a red rectangle around
    the area of the screen that was updated with identical content, meaning that the
    drawing was completely redundant and should be eliminated. There isn''t really
    any good way to draw identical content.


    Next is the Flash screen updates setting, which is similar to the previous option
    except that it flashes a yellow rectangle on all updates, not just redundant ones.
    This option allows you to identify drawing that, while, may not have to be refreshed
    as often as it is. This option can produce a lot of clutter.'
