  md: '# Memory Example: FilterStreams


    We''ve touched on streaming approaches before, for example, when looking at the
    effects of memory mapping or when comparing DOM-based XML parsers to those based
    on SAX or MAX.


    In the preceding chapter, we showed how to drastically lower consumption by changing
    the description method that returns an NSString to a streaming describeOn: method
    that updates an NSMutableString passed into it as an argument.


    However, having the argument be an NSMutableString seems to somewhat contradict
    our objective of having semantically rich objects, and also doesn''t solve the
    initial problem of infinite recursion causing a crash. It shouldn''t come as a
    surprise that we can do better. In fact, we will introduce an entire hierarchy
    of FilterStreams, which combine aspects of the Unix pipes-filters architectural
    style with object-oriented concepts like polymorphism, incidentally solving the
    problem of infinite recursion in -description.


    # Unix Pipes and Filters


    The Unix pipes and filters architecture is probably the best known streaming architecture.
    It has at least two desirable properties: the filter components are interchangeable
    and can be processed incrementally, reading partial inputs and writing partial
    outputs until processing is complete, as long as the semantics of the operation
    make it possible. It is also concurrent, with each filter processing data in its
    own process, highly optimized, and untyped (which is a stream of bytes). A graphical
    representation of a two-stage pipeline is shown in Figure 8.1: the output from
    Filter 1 is connected to the input of Filter 2. In addition, the whole pipeline
    again has one input and one output, meaning the composed pipeline can act as a
    filter in another pipeline.


    However, the data operated on Unix filters are characters, which have to be parsed
    into meaningful units on input and regenerated from any internal'
