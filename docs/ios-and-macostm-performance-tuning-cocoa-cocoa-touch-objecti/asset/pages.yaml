    been written to the process (and that we want to minimize). To the best of my
    knowledge, memory not included in Allocations includes at least the types CoreAnimation,
    Image IO, and CoreGraphics image.


    # Counters/PM Events


    The Counters instrument reads the CPU''s performance monitoring registers at regular
    intervals. These are over 300 statistics that the CPU keeps, including things
    like "Cycles the divider busy" and "Branches executed." I''ve included the Counters
    instrument in this chapter on memory because it also includes very detailed statistics
    about some of the memory hierarchy that are managed by the CPU hardware, the caches,
    load/store buffers, and memory interface. I don''t know of any other way of getting
    information about memory and cache traffic.


    Figure 6.14 shows the Counters after a run with a few counters selected. I inverted
    the call graph, so it is showing the function with the highest MISALIGN_MEM_REF_STORES,
    which to the Intel documentation means: "Speculative cache-line split store-address
