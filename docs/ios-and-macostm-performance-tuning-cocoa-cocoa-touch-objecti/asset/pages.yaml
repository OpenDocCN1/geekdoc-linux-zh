- img_proc: true
  md: 'Resources that are managed by the kernel, including processes, threads, file
    descriptors, or even virtual memory pages themselves take some amount of wired
    kernel memory for the bookkeeping information maintained by the kernel, in addition
    to any memory used by the resources. The kernel


    Free memory is just that, currently unused and immediately available. Usually
    tries to minimize the free memory in the system, from a small reserve, keep free
    memory because an expensive resource is not being utilized.


    The active process is also easy; this memory is virtually allocated to processes
    and in, well, active use. It is with inactive memory that the kernel manages to
    minimize free memory: These are old mappings of files and caches and buffers that
    the kernel keeps around in case they may be needed again, but can free up in case
    active memory is required by the processes in the system.


    Another number to keep an eye on is the paging rate in the VM line, particularly
    the pageouts. If the number inside the parentheses is nonzero, your system is
    currently swapping to disk. If you have sustained paging activity, you will typically
    get a noticeable slowdown in your system and hear disk activity, if you have a
    spinning disk rather than a solid-state drive.


    In the per-process lines, find the RPVT and VPRVT lines most useful. RPVT, the
    resident memory, is the actual amount of real memory in use by your process, and
    in real-world situations most closely answers the question “How much is my program
    using?” previously discussed. That, until your process starts swapping, at which
    point RPVT can become arbitrarily smaller and thus is no longer tracking for your
    memory consumption.


    VPRVT shows the address space privately allocated to your process and is a good
    analog of real memory when swapping. It does not seem to take account free (zero-filled)
    address space or unshared memory mapped files, however. SIZE captures both of
    these, but also captures a lot of system-shared address space, which it is generally
    only as a relative metric.


    Figure 6.2 shows the object-allocation versus of the integer summing program from
    Chapter 1 runs into it. It is using 254 MB of real, private memory within 268
    MB of virtual address space. But we still have 2 GB of physical memory available,
    so there is no danger of swapping (and pageouts are zero).


    Figure 6.3 shows the program 12 s into it; real memory consumption is now 734
    MB, and it still tracks virtual memory, which has increased to 748 MB. We still
    have free memory, and both page counters are zero. So in all, we have a program
    that is rapidly consuming available memory, but within the bounds of the system
    it being run on.


    # heap


    As suggested by the name, the heap command takes a snapshot of your application''s
    heap, roughly the memory allocated by malloc and its variants. Unlike top, it
    always shows address space and never real memory, in case these two numbers have
    diverged. On one hand, it will show you the memory actually allocated your'
