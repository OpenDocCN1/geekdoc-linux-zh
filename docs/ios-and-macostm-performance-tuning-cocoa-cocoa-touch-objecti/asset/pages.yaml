    The first microcomputer hard disks spun at 3,600 revolutions per minute (rpm)
    and had fixed-size sectors that provided a transfer speed of 5 MBit/s (625 KByte/s).
    Today’s drives do not spin much faster, with speeds from 4,200 to at most 7,200
    rpm for laptop and desktop drives and up to 15,000 rpm for server-class drives
    where power consumption, heat, and noise are less of an issue. Table 10.1 relates
    rotational speed to the time it takes to read a track.


    The other factor controlling transfer speed is density, and this has gone up significantly
    as ever clever ways of encoding the bits on the magnetic media have been found:
    putting tracks closer together with servo motors homing in the original, recording
    bits vertically together the medium, getting more sensitive to sensitive heads,
    heating the platter read before a head, and so on. However, due to the fact that
    the disk is a 2D platter, but the read/write operations are of a linear track,
    density always produces a linear increase in transfer speed but a quadratic increase
    in storage capacity.


    Increases in transfer speed of hard disks whereas always lag behind in storage
    capacity, by simple math. Considering the seeming inexorable fact that the amount
    of data stored increases with available storage capacity, this means that disks,
    while nominally slower, in fact are growing increasingly


