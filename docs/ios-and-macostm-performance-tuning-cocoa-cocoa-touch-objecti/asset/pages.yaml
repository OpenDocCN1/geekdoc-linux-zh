    # Foundation Objects vs. Primitives


    We already saw in Chapter 3 that Foundation and CoreFoundation, while convenient
    in some cases, can extract a significant CPU performance penalty, so it shouldn''t
    be surprising that there is a significant memory cost as well.


    An NSumber representing float has size of 32 bytes, while the float itself is
    only 4 bytes, and an 8-fold expansion. Similar numbers apply to the other primitive
    wrappers. An extension is NSNumber or CFNumber representing integers on the 64-bit
    runtime, as we explored in the "Primitive Types" section of Chapter 3. These are
    encoded in the object pointer itself and don''t take up extra space.


    Speaking of pointers, all the object representations also use a pointer of memory
    in whatever structure or object is holding onto reference, so that 4 bytes on
    a 32-system or 8 bytes on a 64-bit system. We didn''t factor this into our comparison,
    so with the pointer, the difference between a direct float and an NSNumber is
    actually 4 bytes, and the expansion becomes a factor of 10. Figure 7.3 shows the
    memory layout of a Rectangle using 4 values or (simplified) NSNumber objects.
    With each box 8 bytes wide, the object using primitives uses 24 bytes total, all
