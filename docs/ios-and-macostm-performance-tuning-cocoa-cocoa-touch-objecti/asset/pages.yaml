  md: "The algorithm for parsing a binary property list is basic recursive descent.\n\
    \n+   1. Start with the root index.\n2. Read object at an index n.\n3. If the\
    \ object has already been parsed, return it.\n4. If the object has not been parsed,\
    \ parse it:\n   a. Get offset of encoded object by offset table.\n   b. Decode\
    \ object at offset.\n   c. For any embedded object with index m, read object at\
    \ this index.\n   d. Return the parsed object.\n\nThe parseAtIndex: method that\
    \ encodes the core of this algorithm is shown in Example 13.5. It reads the top\
    \ nibble of the first byte and then switches on the object type in nibble, dispatching\
    \ the decoding of the object types to individuals method. Code typically does\
    \ not parse objects directly through the objectAtIndex: method (also in Example\
    \ 13.5), which implements a cache for objects already read.\n\nExample 13.5 Parse\
    \ an object from a binary property list\n\n```\n-parseAtIndex:(long)anIndex\n\
    {\nlong offset=objects[index];\nint topNibble=(bytes[offset] & 0xf0) >> 4;\nid\
    \ result=nil;\nswitch ( topNibble) {\n  case 0x1:\n    result = [self readIntegerAtIndex:anIndex];\n\
    \    break;\n  case 0x2:\n    result = [self readRealNumberAtIndex:anIndex];\n\
    \    break;\n  case 0x5:\n    result = [self readASCIIStringAtIndex:anIndex];\n\
    \    break;\n  case 0x6:\n    result = [self readUTF16CString:anIndex];\n    break;\n\
    \  case 0xa:\n    result = [self readArrayAtIndex:anIndex];\n    break;\n  case\
    \ 0xd:\n    result = [self readDictAtIndex:anIndex];\n    break;\n  default:\n\
    \    [NSException raise:@\"\"unsupported\"\n```"
