    directly as code. Bitmaps are much larger and don''t scale, so they have to be
    supplied at every resolution, but the idea of "pixel perfect" artwork just won''t
    die.


    The iPhone 6 Plus has a 1,920×1,080 panel, but rendering actually takes place
    at 3 times the resolution, 2,208×1,242 pixels. These two resolutions don''t match,
    so the pixels are downsampled by a factor of 1.15×the display resolution. Whether
    that is accomplished by downsampling pixel art (which happens automatically with
    Quartz and the proper device transform set) or as a separate step that downsamples
    the entire rendered framebuffer doesn''t matter (much). Either way, there are
    no more "pixel perfect" rendered designs. And what''s more, it doesn''t matter—at
    400-dpi screen resolution, nobody cares about or can identify, individual pixels
    and users use the screen of the 6 Plus.


    If you absolutely have to use bitmap artwork, there are different optimization
    techniques that can reduce file sizes and loading times dramatically, even over
    the "optimized" PNG files that Xcode produces. We will use these in more detail
    in Chapter 17.


    In terms of basic drawing, the biggest problems tend to be things like overdrawing
    (drawing the same pixels multiple times) and redrawing parts of the screen that
    haven''t changed. Fortunately, the tools discussed in Chapter 15 will help you
    diagnose and resolve those issues, so use the tools!


