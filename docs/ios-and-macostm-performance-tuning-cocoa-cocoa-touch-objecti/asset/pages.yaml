    bother making such optimizations on a one-shot job, but when it''s a question
    of preparing quality programs, I don''t want to restrict myself to tools that
    do me such efficiencies.


    > "Structured Programming with Go Statements," Knuth, 1974.


    The quote is embedded in the paper "Structured Programming with Go Statements"
    from 1974, which is largely about achieving better performance via the use of
    statements. It is in fact, in large an advocacy piece for optimization, not against
    it, containing such gems as the idea that engineers in other disciplines would
    be excluded from practicing their profession if they gave up performance reliably
    as programmers.


    What makes Objective-C so powerful is that once you have the information as what
    needs optimization, you can readily reach, smash-bits, and exploit all the hardware
    has to give. Both until point and for the parts that don''t need it, you can enjoy
    the remarkable productivity of a highly dynamic object-oriented language.


    Swift takes a different approach: making everything more static up-front and then
    let the compiler figure it out. While superbly sound, this approach inverts Knuth''s
    dictum by making microperformance a deciding factor in not just application modeling,
    language design. In addition to the approach being questionable doesn''t work:
    Swift is not just slower than optimized Objective-C, it is often significantly
    slower than non-optimized Objective-C, without any further recourse than to wait
    the compiler to get better or rewriting your code in S. That questionable premature
    optimization doesn''t even pay off.


    That a little bit of structural foresight and planning is extremely helpful in
    order to enjoy the benefits of late optimization: You should have an idea of the
    order of magnitude that you are dealing with (one, a thousand, a million?), what
    operations you need to support, and whether the machine you are targeting can
    handle this amount of data, at least in principle.


