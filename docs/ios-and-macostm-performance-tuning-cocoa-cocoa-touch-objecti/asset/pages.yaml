  md: '# Graphics and UI Principles


    Now that we''ve looked at the performance of several lower-level subsystems, the
    CPU, memory, and the I/O subsystem, it''s time to put the parts together to build
    high-performance user interfaces. That means both drawing those user interfaces
    quickly, and also putting everything together so the application reacts quickly
    to user requests.


    # Responsiveness


    When we speak of a high-performance user interface, we usually mean one that is
    responsive, meaning it responds to a user action. How quickly? Well, in general
    as quickly as possible, but there are actually perceptual thresholds that delineate
    qualitative differences in user perception. These limits are shown in Table 14.1.


    The times that are probably most relevant are the 100 ms for feedback to user
    requests and 60 Hz/16(2/3) ms for smooth animation. Both are important for creating
    the illusion of directly manipulating objects on the screen, rather than giving
    commands to a computer that then does something on the screen later. The 25–Hz
    (often quoted as 30-Hz) freq is the one used, for example, for analog film production,
    but it relies on integration effects such as motion blur are


    Table 14.1 Response time Limit Effect


    | Response Time Limit | Effect |

    |---||

    | 10 s | Keep user''s attention |

    | 1 s | User stays in flow |

    | 100 ms | User is manipulating object directly |

    | 40 ms (25 Hz) | Multiple frames fuse into motion |

    | 16(2/3) ms (60 Hz) | Motion becomes smooth |

    | 1 ms | Fast-moving hand is tracked* |


    > * See http://www.youtube.com/watch?v=OvQCCLkPt4.'
