  md: 'fluid. For example, if you detect 20 MB of memory using host_statistics, does
    that mean you have 20 MB to play with? No. On one hand, the OS may make more memory
    available for you from the inactive list if you ask for it. On the other hand,
    the 20 MB may be below its threshold free reserve, and it may start swapping on
    OS X or your memory warnings/killing your process on this iOS.


    # Memory Instruments


    As Instruments has slowly gobbled up all other GUI performance tools, it is no
    surprise that it also has a number of individual instruments for dealing with
    memory. While some may more heavyweight than the command-line tools, it does feature
    additional capabilities such as tracking usage over and richer data-analysis options.
    It also has the ability to run multiple instruments simultaneously, which is useful
    for capturing the multiple facets of memory. Finally, it is pretty your only option
    for iOS devices.


    The three instruments I will look at are the Allocations, the VM Tracker, and
    the Leaks instrument. In addition, the Counters instrument can give you stats
    about the effectiveness of the CPU caches, such as hits and misses.


    # Leaks Instrument


    The Leaks instrument is similar to the command-line tool. It finds memory leaks
    in your application, but provides more detail. Figure 6.4 shows the leaks from
    Example 6.1, with the stack call in the details pane. An overall graph with the
    amount of leaks at each node is also available.


