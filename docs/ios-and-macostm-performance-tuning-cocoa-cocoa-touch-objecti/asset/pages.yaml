  md: 'The time limit is useful for creating consistent, repeatable, and thus comparable
    profiles, for example by profiling an application for 2 s from launch and comparing
    what happens in 2 s with different optimizations. It can also be convenient to
    simply have to hit the stop button.


    The window limit has two use-cases that I am aware of: first, it allows you to
    capture a profile of a specific activity that requires long setup in an application
    without capturing the long setup in the profile. A related but possibly significant
    case is if the setup is indeterminate: let''s say you have an event that you want
    to profile, but you can''t reproduce deterministically. With window limit to 10
    s you just let Instruments run continuously, and when you see the behavior you
    are targeting, hit the stop button. Your trace will contain the 10 s of before
    you stop, hopefully including the event you are interested in.


    Although there will be some impact on having Instruments running, the fact that
    we have multiple CPUs means your target app can often run unimpeded by the profiling.
    Use of the window limit means memory doesn''t fill up, which will otherwise happen
    very quickly.


    Setting a window limit will automatically activate the Defer lag, which means
    you can''t interact with Instruments until profiling is done, or to minimize interference
    with the program being profiled. You can also set this flag manually without the
    window limit option.


    I prefer having at least a time limit set, in order to prevent runaway profiling


    Finally, you can configure the Instrument(s) being used. In the case of the Time
    Profiler instrument, the choices correctly report to the real, user, and sys components
    reported by the command-line command: by default, Time Profiler reports use time,
    meaning time spent running the CPU on behalf of the user program. Selecting Recording
    Waiting Threads corresponds to the real component, meaning well-clock time, so
    tracking waiting for I/O is also included. This can be useful at times, but will
    usually require some sophisticated data mining for interactive programs or instrument
    to remove the time waiting for the user. Finally, you can also look at time and
    call stacks in the kernel, corresponding to the sys component. I''ve used this
    maybe once or twice in my career. Other instruments will offer different configuration
    options.


    # Basic Analysis


    Unlike performance tools, Instruments allows you to start analyzing while the
    profile is still being gathered. This can be convenient, but beware that such
    interactions can negatively affect the program if it''s running on the same machine,
    and there can also be a negative impact on the quality of the data you are gathering.
    Figure 2.5 shows a CPU trace during profiling: The record button has been replaced
    by a stop button, the timeline is starting to fill (with a fairly uninteracting
    graph because the sumints program is purely CPU bound), and the details pane is
    starting to show functions.'
