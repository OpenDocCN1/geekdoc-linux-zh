    on a chip (SOC). This decoder hardware can actually be slower than software, but
    uses much less power, so Apple prefers it when it is slower. There is also some
    constant overhead in talking to the hardware, which sits behind a Mac interface.


    Fortunately, it turned out that these overheads are fixed and I was measuring
    small images. 17.3 through 17.5 show a more representative set of measurements
    with images of different sizes and at different subsampling settings.


    For larger images, the fixed overheads are amortized over more data being decoded,
    and JPEG easily beats the alternatives, with TurboJPEG coming in a good second
    and PNG just unacceptable. Furthermore, PNG actually gets substantially slower
    when subsampling, whereas the JPEG decoders are really able to get generous speedups
    by doing only decoding.


