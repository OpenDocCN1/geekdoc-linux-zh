    is now an accepted fact in the Apple developer community.


    # Language Characteristics


    Although Apple hasn''t given us any solid evidence of Swift''s performance, it
    has given us for amazing Swift performance.


    +   - Swift''s design is much more static than Objective-C, meaning there is much
    more information available at compile time for the user to use

    - Dynamically, dynamic dispatch is drastically reduced, with most “native” Swift
    methods being dispatched statically.


    Objective-C''s dynamic dispatch is an absolute barrier to compiler awareness,
    which was always a thorn in the side of the compiler and runtime team. Just-in-time
    (JIT) compilers can resolve this at runtime, but there are many reasons not to
    use JIT technology for performance.¹


