    \ constant factors instead of different complexity classes of the time.\n\n# Summary\n\
    \nComputers are fast. This trivial observation has surprising consequences. Most\
    \ of your code is less performance critical than it has ever, because computers\
    \ are so fast that it doesn't matter if you control your supercomputers with Tcl\
    \ or your iOS animations with Ruby or JavaScript. However, the parts of the code\
    \ are performance critical are more performance critical than ever, and this is\
