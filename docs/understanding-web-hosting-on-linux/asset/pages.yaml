    # # The Servlet API


    The examples shown in Figures 7.5 and 7.6 use the HTML file Panel.html and a Java
    servlet called “PanelServlet”. The servlet is invoked by the URL request http://127.0.0.1:8080/servlet/PanelServlet.
    The PanelServlet dynamically builds the HTML response.


    A servlet is a Java class that is built on top of the generic HttpServlet. HttpServlet
    provides code implementations for common services, two of which we have already
    mentioned: doGet and doPostPost. HttpServlet''s implementations for doGet and
    doPostPost do nothing. They''re in feature of Java called inheritance. This is
    important because the servlet engine calls all servlets that have these methods,
    by order of an object-oriented feature based on which HTTP method type was qualified
    in the HTML form tag. One way to be sure your servlet has the appropriate method
    used is to code a doPost that simply invokes the doGet method.


    We like to use HTTP GET requests when we test, but HTTP POST requests for production.
