    \ \"Mozilla/4.0/4.06 [Win95; U;Nav)\",\n\nThe HttpServletRequest class provides\
    \ object-oriented access to all the information that possibly be embedded in Web\
    \ requests, such as HTTP cookies, HTTP headers, HTML form input, and HTTP query\
