  md: '# 70 · CHAPTER 5


    Although not included on the Red Hat distribution because of licensing issues,
    Adobe itself provides a free PDF viewer, called the Acrobat Reader, which runs
    on Linux. To obtain it, point your browser to https://www.adobe.com and follow
    the instructions for downloading Acrobat Reader. Once the file is downloaded,
    you''ll need to install (decompress) by issuing the following command:


    ```

    tar -xzf linux-ar-405.tar.gz

    ```


    This will create a directory called ILINXR.install in which you will find a document
    called INSTGUID.TXT. How to read it is an exercise left to the reader (we wanted
    to say), but here''s a hint: it''s a text document. You''ll need to install Acrobat
    Reader as the super user, so be sure to use the command before you begin the installation,
    type exit to return to your user profile


    The last common document format is the Adobe PostScript format. You might already
    heard the term "PostScript" in the context of a printer, so you might be confused
    with the concept of a file in PostScript format. Actually, PostScript is a programming
    language that was created for rendering documents. PostScript-capable printer
    is capable of executing the instructions presented to it in a PostScript file.
    By convention, PostScript files end with the extension .ps. Earlier in this chapter,
    you used to create a PostScript version of its manpage. Issue the following command
    to see what''s going on before the scenes:


    ```

    more man.ps

    ```


    A PostScript rendering engine recognizes a PostScript file by the string %PS-Adobe-x.x
    in the first line. The "x" is the version of the language used within the file.
    Since the PostScript version of the manpage isn''t all that is interesting to
    view in its native format, let''s see what it looks like rendered. Exit by pressing
    the Q key, and then issue this command:


    ```

    ghostview man.ps

    ```


    The ghostview program uses another program, gs, to render PostScript or PDF files
    and present the result on the screen. Like xpdf, ghostview provides the obligatory
    navigation icons with which you can page through the document. To exit ghostview,
    click the X in the upper-right corner of the window.


    # Chapter Summary


    One of the fundamental skills that you must master on your way to becoming a Linux
    guru is learning to find the documentation. With the long history that Linux has
    inherited comes an equally list of methods to store thoughts and instructions.
    The ancient art of text-based documentation has been improved upon with the advent
    of manpages, info pages, PDF files, and HTML..., but it has never been completely
    superceded.'
