- pgno: 95
  md: '# 80. CHAPTER 6


    ![](img/069cd06404ac5e90171e6d857bf3ad28_95_0.png)


    # Images


    The &lt;IMG&gt; tag qualified with the SRC option, as used in Figure 6.5, presents
    an image that exists in the same directory as the HTML itself. Although you can
    find a lot of images on the Web, you will soon need to develop your own. Linux
    has a well-known open-source utility for creating images: The Gimp (which stands
    for "GNU Image Manipulation Program" or "General Image Manipulation Program").
    The Gimp, which is functionally comparable to Adobe’s Photoshop, is a GUI-driven
    utility that allows you to draw your images or perform screen captures.


    Another powerful image utility is gview. The gview utility presents an easy-to-use
    tree view of your directory. From the tree view, you can pick the image you wish
    to display. Further, you can select one of four Linux image utilities—the Gimp,
    Electric Eyes, XV, and Xpaint—with which to modify your image.


    # Form Precedes Function


    We believe that business programmers need not know much about how to make HTML
    "pretty," we strongly believe they need to know how to develop HTML input forms.
    A single input form, comparable to a display file’s record format, is described
    within a part of &lt;FORM&gt;...&lt;/FORM&gt;. The following code snippet from
    Figure 6.2 presents the single input panel shown in Figure 6.3.


    ```

    <FORM ACTION="/servlet/myServer" METHOD="POST">

    <INPUT TYPE="text" NAME="TextField">

    <INPUT TYPE="SUBMIT" NAME="Submit" VALUE="Submit">

    </FORM>

    ```


    The &lt;FORM&gt; tag has two options: ACTION and METHOD. The **ACTION** option
    qualifies the name of the server-side application program that is to process the
    form’s input data. The **METHOD** option specifies whether the input data is passed
    as part of the URL (GET) or over the HTTP packet (with POST).'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# An Introduction to the Web · 81


    The form contains two input fields: one typed as text and one typed as submit.
    The use of text is fairly obvious, and you''ve already guessed that submit is
    used to present a button, when pressed, causes the input data to be sent to the
    server.


    HTML forms can contain a variety of input types, such as text fields, radio buttons,
    check boxes, dropdown lists, and hidden fields. 6.7 shows an HTML file called
    Panel.html, which contains each of these input types. 6.8 shows how Panel.html
    looks in KDE''s Konqueror Web browser.


    ```

    <HTML>

    <HEAD>

    <TITLE>Example HTML Panel</TITLE>

    </HEAD>

    <body>

    <CENTER><H1>Example HTML Panel Design</H1></CENTER>

    <CENTER><H3>Please complete the following skill survey</H3></CENTER>

    <FORM ACTION="/servlet" METHOD="GET">

    <br>

    <B>Name:</B><br>

    <INPUT type="text" name="name" SIZE=25 MAXLEN=25>

    <br>

    <B>I know the following languages</B>:<br>

