    # # Protocols


    An understanding of the term protocol is important because of the misconceptions
    most people have about the meaning of the URLs they type into their browsers.
    Take, for example, the URL "http://www.mydomain.com" Most people erroneously believe
    that it is listening on port (80), and "www" in the URL indicates "Worldwide Web."
    Well, it does, but in name only. Actually, "www" is simply a host within the "mydomain.com"
    domain. The URL could just easily have been "http://myserver.mydomain.com" and
    everything would have worked just fine. The use of "www" as a standard host name
    so that people could make assumptions about the location of a company''s Web site.
    Following this standard, a person wanting to find out more information about IBM''s
    product would visit http://ibm.com. It is actually the "http://" part of the URL
    that indicates you want to communicate using the Hypertext Transmission Protocol.


    Simply put, a protocol is an agreed-upon language used to accomplish a given task.
    In the case of a Web server, your browser makes a connection to the port on which
    it is listening and once connected, specifies the specific commands to retrieve
    a single file. The Web server will return either the requested file or an error
    message indicating that it wasn''t found. At that point, the connection is broken
    and the exchange is completed.


    The browser will format the page sent to it and display it to you. Images embedded
    in the Web page will result in subsequent consequences to the Web server, as clicking
    on any links. Each connection is a separate transaction that ends with a response
    from the server. You can verify this by simply connecting to your computer''s
    Web server. Ensure that you have the Web server running (/sbin/service httpd status).
    Then, from a command line, type the following:


    ```

    telnet localhost80

    ```


    This uses the client to connect to the HTTP port of your computer. Once you receive
    the message Escape character is '' '', the Web server is ready for your request.
    Type GET /HTTP/1.0 and press Enter twice. You''ll get a notification that the
    Web server received your request, along with a message indicating'
