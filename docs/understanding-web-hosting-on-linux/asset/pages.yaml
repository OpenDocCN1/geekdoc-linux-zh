- pgno: 60
  md: '# 4


    # Linux Configuration and Startup


    The Linux lifecycle is composed of four phases:


    +   - Booting on or starting up Linux

    - Logging on

    - Using Linux applications

    - When necessary for system maintenance, shutting down the system


    This chapter covers all four of these phases.


    # Starting Up


    The term booting the system was borrowed from the saying “pulling yourself up
    by your bootstraps,” which refers to someone going without any help from anyone
    else. Picture some cowboy out on the prairie knocked unconscious after being thrown
    by a horse—with no help available, he has to pull himself up and get going again.
    Bootstrapping your computer is basically the same thing. The bootstrap of Linux,
    and most operating systems, is a small file contained either on a floppy disk
    or on the first sector of your system’s primary hard drive, known as the Master
    Boot Record, or MBR.


    Your computer’s hardware contains a little piece of software called the BIOS (Binary
    Input/Output System) that is hard-wired to your system’s board. When you power
    on your system, the BIOS looks for the startup file on your system’s floppy or
    primary drive. A Linux diskette contains a compressed version of the Linux kernel.
    Once loaded into memory, the kernel decompresses itself and starts executing.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 6 • CHAPTER 4


    Many Linux systems use LILO (Linux Loader) to control the boot process. LILO is
    installed on the MBR of your primary hard drive. Figure 4.1 show the L configuration
    file (/etc/lilo.conf) from a particular laptop. As mentioned in chapter 3, the
    Red Hat installation will configure LILO for you, but it''s a good idea to understand
    what the various sections of lilo.conf accomplish. The first three statements
    of the file set the basic parameters for Linux. The boot statement sets the name
    of the device where LILO should install itself in the MBR, /dev/hda in this system''s
    case. Note that hda is the Linux name of a physical device, not a logical partition
    as hda2. The install statement names the file containing the boot sector to use
    on the MBR, and the map statement specifies the file that LILO creates when installed.


    ```

    # basic parameters

    boot=/dev/hda

    install=/boot/boot.b

    map=/boot/boot.b


    # Boot option: Linux Version 2.4

    image=/boot/vmlinux-2.4.2-2

    label=linux

    read-only

    root=/dev/hda5


    # Boot option: NetTraverse''s Win4Lin kernel

    image=/boot/win4lin

    label=win4lin

    root=/dev/hda5


    # section for Windows/2000

    other=/dev/hda1

    optional

    label=dos


    # boot-time options

    append="mem=512"

    ```


    Figure 4.1: The lilo.conf file supports boot-time options for multiple operating
    systems.


    The next three sections of the LILO configuration file in Figure 4.1 qualify three
    operating-system options. LILO supports the optional booting of various operating
    systems. At boot time on this example, you could select to Linux version 2.4,
    a custom version of Linux by NetTraverse Win4Lin (that supports running Windows
    98 operating system in a Linux process), or Windows 2000.


    The last statement of the lilo.conf file in Figure 4.1 is a boot-time option.
    There are a dozen or so possible boot-time options, but this one qualifies that
    the laptop has 512 Mb of memory.


    Messages will be displayed while your system is booting, but there are many that
    you might important error messages. So, after the boot process is complete, review
    all the messages in the log file /var/log/messages.


    > Note: If you modify lilo.conf, you must run /sbin/lilo command while you are
    signed on as root to place the configuration options into the boot process.


    Until Linux came around, IBM''s iSeries only supported one operating system, OS/400.
    As a result, the iSeries did not have a generic process for loading and installing
    operating systems. Also, the iSeries runs as a secondary operating system in a
    partition, with OS/400 always running in the primary partition.'
