    ```


    The minimum configuration here is useful for gaining an understanding of the Apache
    configuration process works. For production servers, it is probably a better to
    start with the default httpd.conf configuration file in the /etc/httpd and then
    use the /etc/rc.d/httpd script to start and stop Apache. The /etc/httpd/conf/conf
    file is lengthy, but then contains plenty of comments that do a great job of explaining
    what each directive is. Don''t forget to look at the documentation at the www.apache.org
    site.


    # Support


    If you are a little wary of this unsupported Web server stuff (that''s right,
    the authors of Apache didn''t volunteer to answer tech-support phones), you might
    want to consider a commercial implementation of the Apache HTTP Server. IBM provides
    such a service, IBM HTTP Server, shown in Figure 9.3. The IBM HTTP Server provides
    the quality and power of the Apache HTTP server, along with the support that you
    expect from an IBM commercial product.


    Think of IBM HTTP Server as a shrink-wrapped Apache server with simple installation
    and full support. Also, because IBM HTTP Server is a pay-for-view product, IBM
    is able to legally bundle support for SSL (although the U.S. government won''t
    allow it to provide the source code for its SSL Apache module);


    IBM keeps ties with the Apache Group; the company pays the salaries for two full-time
    members of the Apache Group core. IBM also has a complete team of programmers
    making enhancements to the IBM HTTP Server. To ensure compatibility with the Apache
    HTTP server, these enhancements are submitted to the Apache Group. Once those
    enhancements are accepted, they become a permanent part of both the Apache server
    and the IBM HTTP Server.'
