- pgno: 205
  md: "# Table 13.1: String Comparison Operators\n\n| Operator | True if... |\n|---|---|\n\
    | str1 = str2 | str1 matches str2 |\n| str1 != str2 | str1 does not match str2\
    \ |\n| str1 < str2 | str1 is less than str2 |\n| str1 > str2 | str1 is greater\
    \ than str2 |\n| -n str1 | str1 has a length greater than zero |\n| -z str1 |\
    \ str1 has a length of zero |\n\nConditional expressions can also contain some\
    \ sophisticated file operators, such as those in Table 13.2. For instance, in\
    \ a Red Hat installation, each user's .bash_profile startup script checks to see\
    \ if the user has a .bashrc in the home directory. If .bashrc exists and is a\
    \ regular file, the script executes it, as shown in the following code snippet\n\
    \n```\nif [ -f ~/.bashrc ]; then\n    /.bashrc\n```\n\nNote that the tilde (~)\
    \ refers to the user's home directory.\n\n# Table 13.2: Partial List of File Attribute\
    \ Operators\n\n| Operator | True if... |\n|---|---|\n| -a file | file exists |\n\
    | -d file | file is a directory |\n| -e file | file exists |\n| -t file | file\
    \ is a regular (text) file |\n| -h file | file is a symbolic link |\n| -r file\
    \ | current user has read permissions on file |\n| -s file | file has a size greater\
    \ than zero |\n| -w file | current user has write permissions on file |\n| -x\
    \ file | current user has execute permissions on file |\n| -O file | current user\
    \ owns file |\n| -G file | current user is a member of file's group |\n\n# Exit\
    \ Codes\n\nOne of the strengths of shell scripts is that they can use other commands.\
    \ Most commands return an integer value, called an exit code, that tells its invoker\
    \ if it ran properly. An exit code with a value of zero means that the command\
    \ ran as expected. A non-zero exit code typically means the command did not work\
    \ as expected. That non-zero value, depending on the command, might further describe\
    \ to its invoker what went wrong."
  merge: -1
  img_proc: true
- pgno: 206
  md: "Using the special environment variable $?, you can look at the exit code of\
    \ the previous command. For instance, if you attempt to change your current directory\
    \ to one that doesn't exist, the exit code will be one:\n\n```\n$ cd bogus\n$\
    \ echo $?\n1\n```\n\nWhen the current directory is valid, the exit code value\
    \ is zero:\n\n```\n$ cd /opt\n$ echo $?\n0\n```\n\nYour shell script can predict\
    \ blocks of code based on the value of an exit code. For instance, the following\
    \ script lets the user know if a directory-change worked:\n\n```\nif cd $1\nthen\n\
    \  echo \"Now in directory $1\"\nelse\n  echo \"Sorry, $1 does not exist\"\nfi\n\
    ```\n\n# Looping\n\nIn addition to supporting conditional logic, all programming\
    \ languages have a facility that allows a program to perform a block of code,\
    \ to loop, until some condition is met. Shell scripts have do/until, do/while,\
    \ and for loops. The format of each of these loops is shown in Figure 13.1.\n\n\
    ```\nwhile condition; do\n  statements\ndone\n\nuntil condition; do\n  statements\n\
    done\n\nfor variable in list; do\n  statements that use variable\ndone\n```\n\n\
    Figure 13.1: Shell scripts can iterate through blocks of code using while, until,\
    \ or for loops.\n\nThe difference between a while and an until loop is that the\
    \ while loop executes as long as the condition is true, and the until loop executes\
    \ as long as the condition is false. Here is a simple example of a while loop:\n\
    \n```\nwhile true; do\n  echo 'looping...'\ndone\n```"
  merge: -1
  img_proc: true
- pgno: 207
  md: "The condition of the loop is simply true, which effectively makes the loop\
    \ execute forever. (If you enter an example and test it, you'll have to press\
    \ Ctrl-C to abort the loop.) If you replace while with until in the example, the\
    \ conditional code never executes.\n\nFor loops are handling the elements of a\
    \ directory list. The following example simply echoes the contents of the current\
    \ directory:\n\n```\nfor elem in /*; do\n  echo elem\ndone\n```\n\nNote that elem\
    \ in this example is a variable that takes the value of the current list element\
    \ being processed.\n\nThere might be times when you want to prematurely exit out\
    \ of a loop before the loop's condition has been met. The reserved word break\
    \ may be used for this. Some programmers may use a while true loop with an if\
    \ inside the body of the loop that terminates the loop with break. There might\
    \ also be times when you do not want to finish executing the body of the loop\
    \ for the current iteration, but instead move on, or continue with the next iteration.\
    \ The reserved word continue can be used for this purpose.\n\n# Case Statements\n\
    \nThe last script-control to cover here is the case statement. There are times\
    \ when you want to predicate a variety of code paths based on the value of the\
    \ same variable. For example, a script that uses a parameter to predict whether\
    \ to start up a process, list the current status of that process, end that process,\
    \ or list the usage of the script. A nested if, such as the one in Figure 13.2,\
    \ could handle that, but case could also be used.\n\n```\n#!/bin/sh\nif [ \"$1\"\
    \ = 'start' ]; then\n  echo 'start it'\nelif [ \"$1\" = 'status' ]; then\n  echo\
    \ 'list status'\nelif [ \"$1\" = 'stop' ]; then\n  echo 'stop it'\nelse\n  echo\
    \ 'Usage: $0 start|status|stop'\n  exit 1\nfi\n```\n\nFigure 13.2: A nested if\
    \ could be used in a script that started, stopped, listed status, and provided\
    \ for a process.\n\nCase Statements have the following format:"
  merge: -1
  img_proc: true
- pgno: 208
  md: "# Shell Programming · 193\n\n```\ncase expression in\n  pattern1)\n    statements\
    \ ;;\n  pattern2)\n    statements ;;\n  *)\n    statements that handle drop-through\
    \ cases ;;\nesesac\n```\n\nThe asterisk handles those circumstances where the\
    \ value of expression has no associated pattern. Programmers typically call this\
    \ portion of the case statement the drop-through case.\n\nA working example of\
    \ a script that uses the case statement Apache s http script (which, on a Red\
    \ Hat system, can be found in the /etc/rc/init.d directory). The portion of the\
    \ script that predicates processing based on parameter I is shown in Figure 13.3.\n\
    \n```\ncase \"$1\" in\n  start)\n    ;\n  stop)\n    ;\n  status)\n    status\
    \ $httpd\n    ;\n  restart)\n    stop\n    start\n    ;\n  reload)\n    echo -n\"\
    Reloading $prog\"\n    killproc $httpd -HUP\n    RETRIEVAL=$7\n    echo\n    ;\n\
    \  condrestart)\n    if [ -f /var/run/httpd.pid ]; then\n      stop\n      start\n\
    \    fi\n    ;\n  echo $\"Usage: $prog {start|stop|restart|reload|condrestart|status}\"\
    \n  exit 1\nesesac\n```\n\nFigure 13.3: Apache's httpd script uses a case statement\
    \ to handle its various parameter options.\n\n# Tomcat Code Review\n\nA good way\
    \ to show the power of shell programming is to review Apache's Tomcat script.\
    \ The script is called tomcat.sh and is located under the bin directory where\
    \ Tomcat is installed (/opt/jakarta-tomcat on our system). The tomcat.sh script\
    \ shown in Figure 14.3 is devoid of comment (except for the first line), so it\
    \ might be worthwhile to add comments to the script as you step through the code."
  merge: -1
  img_proc: true
