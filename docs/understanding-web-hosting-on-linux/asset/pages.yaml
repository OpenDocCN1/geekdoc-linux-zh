    # Aliases


    The last advanced shell feature covered here is aliases. The alias utility allows
    you to assign a name to a command string. A good way to learn about aliases is
    to look at the ones that Red Hat has set up for you. You can review all aliases
    on your system by using the alias command with the -p option. The following shows
    the results when signed on as root to our Red Hat 7.1 system:'
