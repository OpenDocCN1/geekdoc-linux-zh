  md: '# Linux Operation, Configuration, and Administration • 155


    +   - User directories are likely candidates for frequent backup, if you have
    created any users (including yourself). If you simply request the /home directory,
    you''ll be in good shape.


    +   - Other directories that are possible candidates for backup include /usr/local
    and /opt. The frequency with which you back up these directories depends on the
    frequency with which you load software. If your system is stable, you can simply
    back them whenever you add or remove software.


    +   - Be sure to back up your databases! You''ll need to check the database vendor''s
    documentation to determine how to extract the information and ensure it gets into
    your backup. PostgreSQL has the pg_dump command to extract the schema and contents
    of an entire database. The output from this can be redirected to an output file
    in one of aforementioned directories, so that databases can be included in a normal
    backup schedule.


    +   - Learn to use tar. This venerable program is the basis for almost all software
    and data between Linux and UNIX systems, and it is extremely powerful. Although
    it is for "tape archiver", tar can write its output to a file. Unfortunately,
    Webb doesn''t seem to have a "System Backup" tab (although one could be created),
    so you''ll need to get cozy with the command-line version. Here is a sample command
    line that would save the directories listed in the previous items:


    ```

    tar -cjf mybackup.tbz /etc /var /home /opt /usr/local

    ```


    # # Keeping Current


    Last on your list of maintenance items is keeping current on your distribution
    software. One of the really great things about open-source software is that bugs
    or security flaws are frequently viewed soon after they are discovered. Red Hat
    and the other distribution authors quickly find that the patches are propagated
    throughout their software.


    Red Hat posts all of its updates at redhat.com/errata/, check for the latest packages.
    Also included with each fix package are the instructions for installation, so
    you''ll be guessing how to do it. If you purchase a boxed set of Red Hat distribution,
    you can take advantage of the update program, which automates the entire process.
    It connects to Red Hat''s site and compares the list of available fixed packages
    there with the list installed on your system, keeping your system synchronized
    with Red Hat.


    # # Chapter Summary


    This chapter examined some of the tasks faced by a system administrator, such
