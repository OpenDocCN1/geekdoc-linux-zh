- pgno: 160
  md: '# 10


    # Linux Operation, Configuration, and Administration


    The Linux system that results from your carefully planned installation will have
    everything you need to keep you off the streets for a long time to come. Eventually,
    though, you''ll want to make some changes. You might want to alter the way your
    desktop looks and behaves, perhaps add some additional software, or make configuration
    changes to the base Linux system. If nothing else, entropy will eventually attack
    your system, forcing you to delve into the system configuration. This chapter
    introduces you to the tools for making these changes.


    # The User Interface


    It might seem incongruous to have a section on user interfaces in a book that
    deals with Linux-based Web hosting. After all, most Linux servers run without
    benefit of a keyboard and screen (a.k.a. headless), so the only user interface
    available is via a browser or remote command-line shell. We realize that the first
    server you build will probably be hosted on your own workstation. With that in
    mind, let''s take a quick look at the Linux GUI and find out why it is so powerful.


    # X in a Nutshell


    Anyone who has used the Windows operating system is already familiar with a graphical
    user interface (GUI). Unlike Microsoft''s ofertas, where the GUI is an integral
    part of the operating system, the Linux GUI is an add-on called the X Window system
    (or just X).'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# 146 CHAPTER 10


    The X Window system is based on a client/server architecture, with the various
    parts available individual software components. At the heart is the X server,
    which runs on the computer to which is attached the hardware providing the basic
    requirements of X: a graphics card and monitor, and a mouse. Working in conjunction
    with the X server are two additional components: the desktop environment and the
    window manager. (sorry—we just couldn''t resist) that permit you to give your
    a personalized look. The server, desktop environment, and window manager communicate
    with one another to provide you with the X Window experience.


    The server is the one item within X that is not negotiable. You need to run one
    that is compiled for your particular CPU and operating system. There is an X server
    available for virtually every computer equipped with the basics, and your Linux
    distribution undoubtedly includes it. If your usual operating system is Linux,
    MacOS, OS/2, or even Windows, chances can get an X server—if not an open-source
    (free) one, then a commercial one.


    For the window manager and desktop environment, you have many choices. With your
    Linux distribution are various window managers, such as sawfish, windowmaker,
    and enlightenment, as well as desktop environments, as KDE and Gnome. If you choose
    to install X and either or both KDE and Gnome, you already have some or all of
    these options at your disposal. Depending on which desktop you choose for your
    default, you''ll find yourself in KDE or Gnome. If you are one of their itinerant
    GUI-trollers, you''ll have lots of new toys to play with.


    Before going any further, it would be helpful if you were currently at a computer
    that is in X. If you configured your computer to start in level 5 (the graphical
    runlevel), you will have a graphical signon screen. If you are looking at the
    console login: prompt, you need to log on and, at the command prompt, enter the
    command start, which brings up a graphical desktop. This, of course, assumes that
    you installed the X server and a desktop. If not, you can either go back and install
    them now, or simply skip this section if you don''t plan to use X.


    To start, click the KDE Control Center (on the toolbar at the bottom of the screen)
    or the Gnome Control Center (Foot->Settings->Gnome Control Center), and take a
    look at the vast array of options you can change. It''s enough to make a geek
    drool. You can see what these control centers look like in Figures 10.1 and 10.2.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Linux Operation, Configuration, and Administration • 147


    ![](img/069cd06404ac5e90171e6d857bf3ad28_162_0.png)


    10:1: The KDE Control Center allows easy configuration of your desktop.


    ![](img/069cd06404ac5e90171e6d857bf3ad28_162_1.png)


    10:2: Gnome provides a control center similar to that of KDE.


    You might want to check both desktop environments to which you like better. Red
    Hat seems to push Gnome, but KDE is reputed to be the easiest to convert to Windows.
    We use both, although we''re leaning towards toward KDE. Keep in mind that running
    a desktop environment is entirely optional; if you have a memory-constrained system,
    you can run without one.


    At this point, you''re probably wondering what advantages X provides over its
    embedded-GUI equivalent. After all, the job of any GUI is to make it easy for
    you to do your work, and if you are used to the Windows environment, let''s look,
    however, at some of the advantages of X.


    First on last, of course, is the freedom of choosing which manager/desktop environment
    combination you want to use—including the choice to run none at all. If the selections
    provided with your distribution don''t inspire you, there are more at www.plig.org/swinman/.
    You are bound to find one that fits'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# 148 CHAPTER 10


    both your tastes and your hardware. The closest equivalent to this in the Windows
    worlds comes from Stark, in a package titled "Object Desktop," which started as
    an OS/2 Workplace Shell extension. This product enables you to make your desktop
    "skinnable," allowing you to customize its content. The bloat inherent in the
    Windows GUI is still there, however: Object Desktop adds to it. So, while X allows
    you to balance functionality with form, the Windows GUI only allows you to add
    a pretty facade at the cost of more bloat.


    Another advantage of X is its virtual desktop. Both Gnome and KDE can also have
    virtual desktops, or separate desktops (pages) within the virtual desktops. For
    instance, let''s say, that you are sitting at work or in class, you want to play
    games. On one desktop you can have Freecell running, while on another, you can
    have your work, switching between them with keystrokes or clicks. On a more particular,
    you can place your Web browser in one window to view your latest creation, while
    having the source open in an editor. The best Windows does is stack one window
    on top of another. Any competent user will have windows open, and X provides an
    easy way to organize them. Granted, the Object product allows you to have multiple
    desktops, but it is a Windows add-on instead of an inherent trait. And, you have
    to pay for Object Desktop; X is available for free.


    One of the features touted in Windows XP is the "fast-switch". This feature permits
    a user to interrupt his or her work for something else and do so again. When the
    new user logs in, the state of the original user''s desktop is restored where
    he or she left off. In instance, Microsoft is fairly attempting to create the
    multitasker operating system that it has claimed as a function of Windows for
    a long time. X is built on an operating system that is truly multitasker; it has
    been able to do this since its inception. To demonstrate, press Ctrl-Alt-F2, and
    you''ll find yourself at another console. Log on as someone else, and then enter
    the following to start another X server on console 1:


    ```

    startx :-1

    ```


    You can alternate between your two users'' sessions simply by pressing Ctrl-Alt-F7
    for the original session, and Ctrl-Alt-F8 for the second session. And there you
    have it—the X Windows fast-switch feature! You can''t do that with Windows version
    XP.


    Of course, you could argue that this isn''t a big deal, so let''s go one step
    further. Although it is not apparent to a user on a single computer, the X client/server
    architecture applies to two separate computers. The programs communicate with
    each other over TCP/IP sockets, which are within the same machine or on different
    machines. This makes it possible to run a program on one computer while controlling
    it from another, which is something you just can''t do from a Windows desktop.
    That''s not completely true, since you can run a program like Virtual Network
    Computing (www.uk.research.at.com/vnc/). With VNC you get remote access to a Windows
    computer, and not remote access to the Windows computer. This difference becomes
    apparent if you happen to seize control of a Windows computer without its user
    being aware of the capability. In other words, you can remotely control the computer,
    but only to the extent that you would if you were sitting directly in front of
    it. A single Linux computer could easily be running programs on behalf of any
    number of users who are located anywhere on any network capable of reaching it.
    In fact, it is possible that the machine you use could be doing that right now!
    The good news: you will have an opportunity to experiment with all of this during
    the exercises at the end of this chapter.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Linux Operation, Configuration, and Administration • 149


    # # Facility Configuration and Administration


    There are many different aspects to configuring and administering a Linux box
    that quite a number of books have been written on the subject. This section boils
    Linux configuration down to one simple fact: almost without fail, you can find
    the configurations for the operating system and programs in the main /etc directory,
    or one of the other "etc" directories, such as /opt/etc or /usr/local/etc.


    Our initial plan for this section was to show some examples from within /etc directory,
    point out how to edit them, and then go on talk about the various KDE, Gnome,
    or Linux utilities that you could use to accomplish the same task. The problem
    is, like so many things Linux, there are many ways to accomplish this, and there
    are some risks to advocating a particular method. For example, the linuxconf utility
    is mentioned in many books as the primary way of configuring your system. However,
    it is officially deprecated by Red Hat, a polite way of saying it''s broken, it''s
    not supported, and it''s unlikely to ever be fixed. As a matter of fact, it is
    so broken that, if you see references to it anywhere on your system, you should
    go out of your way to avoid it. As we can both attest, its use is likely to destroy
    your working configuration.


    There have been other attempts to configuring your system less of an arcane art
    and more of science, but they all have been made obsolete by what has to the best
    configuration tool ever: Webmin. It not only allows you to easily configure your
    system, it slices and dices to maintain it as well! Webmin is all you need to
    configure and maintain your Linux server. (If you are a system administrator,
    however, you will still want to purchase some Linux administration books to explore
    the guts of the system.)


    Webmin is a browser-based application that allows you to configure and manage
    your computer locally (from the same machine), or from another across a network.
    So complete is the implementation that you can replace all other configuration
    tools with this one. As a bonus, it is extensible, so that any software author
    can write a Webmin module to support his or her application. Webmin, will upon
    installation, determine the distribution of Linux (and some other operating systems)
    on which it is running and automatically configure itself to provide only the
    relevant options. But we digress. You first need to get and install Webmin.


    Point your browser to http://www.webmin.com/webmin/ to get the Webmin RPM. To
    ensure you don''t have conflicts with the browser distinguishing between a RealPlayer
    file and an RPM file, hold the Shift key while clicking the link to save the downloaded
    file a place to reside, which is probably your home directory, and a name, which
    is probably webmin-0.90-1.noarch.rpm (although the .90-1 could be different as
    the program is updated).


    Once the file is downloaded, open a terminal window to get a command line, and
    then issue the su command to switch to the root user (You aren''t logged on as
    the root user already, are you? You shouldn''t be!) At the prompt, enter the following
    command to install the package:


    ```

    rpm -Uvh webmin-0.90-1.noarch.rpm

    ```


    > Tip: Everything through webmin in the line above, and press Tab. The file name
    will be completed for you through the magic of the bash shell.


    After waiting and gnashing of disk, you''ll be rewarded with a prompt that says
    you can log on to http://localhost:10000. That means the Webmin server is ready
    to accept connections, but is awaiting the connection on port 10000 instead of
    the standard HTTP port 80. You may now exit the terminal session'
  merge: -1
  img_proc: true
- pgno: 165
  md: '(close the window or type exit at the command line) and fire up your browser
    (which we assume is Netscape. Enter that address into the Location field and press
    Enter. You will be prompted to log into Webmin.)


    It is important to note that the user name and password you use to log into Webmin
    will determine the level of access you are granted. Webmin honors Linux privileges,
    so log as the root user. You should find yourself at the screen shown in Figure
    10.3.


    ![](img/069cd06404ac5e90171e6d857bf3ad28_165_0.png)


    The very first task to perform is to verify that you have Webmin secured from
    the world. Upon initial installation, it should be configured to accept connections
    only from the loopback interface, meaning that you can connect to it from your
    local machine (localhost) on IP address 127.0.0.1. You want to ensure that this
    is the case. If you were to log into Webmin from another machine on an unencrypted
    connection, the user name and password would travel the network in plain text,
    so that anyone with a packet sniffer would be able to configure your system for
    you very quickly. That would be a bad thing.


    To verify that Webmin is listening on the loopback interface only, click the Webmin
    Configuration link, and then click Ports and Addresses. If the resulting display
    resembles Figure 10.4, you are ready to go. If it doesn''t, make it do so, and
    then click Save.'
