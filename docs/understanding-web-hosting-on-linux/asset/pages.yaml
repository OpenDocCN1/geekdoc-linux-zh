- pgno: 14
  md: '# Preface


    As the Web Internet continues to grow, more and more people find the notion of
    publishing their thoughts to the World Wide Web quite intriguing. Some people
    want to share their hobbies with the world and make new friends with similar interests.
    Others like to post information and pictures where their families can find them.
    Still others are just exhibitionists. Whatever the reasons, the web holds a fascination
    that very few can ignore.


    Most Web publishers are content with posting static web pages, and, for them,
    the Web space provided by their Internet Service Providers (ISPs) is sufficient.
    But for businesses and technically advanced individuals, static pages simply are
    not adequate. Both need something more.


    Today, the hot Web technologies involve server-side programming. There are many
    server-side technologies from which to choose, but one of the leading is based
    on Sun System''s Java language. Any time you visit a Web site and find in your
    browser a URL that references a file with extension "jsp", you are experiencing
    server-side Java in action. Java programs run unchanged on any platform for which
    a Java Virtual Machine is available, including personal computers from Apple or
    Intel-based PCs running Linux or Windows. Java scales right through higher iron,
    as the eSeries machines from IBM. The knowledge that you gain programming on your
    personal computer scales automatically!


    This book is a guide to setting up a complete environment for yourself on which
    learn about this wonderful technology. When you''re done, you''ll have a system
    replete with a database management system, a Web server as well as server-side
    Java. And you''ll know how it all works. Because the whole shebang is based on
    Linux, and that of the open-source era, everything you learn here is applicable
    to any platform on which Linux will run. This includes Apple hardware, Intel and
    Intel-compatible hardware, and of course, the eSeries by IBM.


    We hope that you enjoy your exploration of these exciting technologies. We certainly
    enjoyed mapping your journey. Weith*'
  merge: -1
  img_proc: true
