- pgno: 134
  md: 'SELECT always includes the table name. It can explicitly qualify the columns
    to list in the query result, in this example:


    ```

    SELECT LastName, State, PhoneNo FROM customer

    ```


    If you want to list all the columns of a table, you can use the asterisk wildcard
    in the SELECT statement:


    ```

    SELECT * FROM customer

    ```


    Rarely does a business process require a query that returns the entire contents
    of a table. Most queries contain what is known as a predicate. The predicate "pre-dictates"
    what rows are to be retrieved. Place your predicate in the SELECT statement''s
    optional WHERE clause. For instance, to list all customers in the state of Montana,
    you would use the following query:


    ```

    SELECT LastName, State, PhoneNo FROM customer WHERE State = ''MO''

    ```


    Predicates can become extremely complex. There are a number of predicate forms:
    relational, between, null, exists, like and in. This book covers only relational
    predicates. (For the use of other predicates, see a book on SQL.)


    SQL predicates are written as alric expressions. In fact, SQL has its own brand
    of algebra, known as relational algebra. The relational predicates can use any
    of the relations shown in Table 8.4.


    | Table 8.4: Predicates Written as Algebraic Expressions

    | Algebraic Relation | Description |

    | --- | --- |

    | = | Equal to |

    | != | Not equal to |

    | > | Greater than |

    | >= | Not greater than |

    | < | Less than |

    | <= | Not less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |

    | and | Logical and |

    | or | Logical or |


    Expression can include multiple ANDs and ORs, and parentheses can be used to order
    the evaluation of the expression. The following query, for instance, retrieves
    all of the customers who have a last name of "Denoncourt" and live in southern
    California:


    ```

    SELECT *

    FROM customer

    WHERE LastName = ''Denoncourt''

    AND State = ''CA''

    AND (ZipCode = 11111 OR ZipCode = 99999)

    ```'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'Queries always return what is known as a result set. A result set is basically
    a virtual table: it is all that exists in main memory, but not on a persistent
    storage device.


    SQL queries are based on relational algebra. The relational algebra used in the
    WHERE clause of a SELECT statement is comprised of Boolean expressions that identify
    the subset rows contained within a table. Said another way, an SQL result set
    is the subset of rows that match the search criterion specified in the WHERE clause.


    # # The Order By Clause


    One feature of the SELECT statement worth noting is the ORDER BY clause. This
    is used to sort the result set returned from a SELECT. The following statement,
    for instance, lists all customers by state:


    ```

    SELECT *

    FROM customer

    ORDER BY.State

    ```


    # # Joining Files


    Information is spread out among multiple tables, the SELECT statement allows you
    to query multiple tables in one statement. In relational algebra, this mult query
    capability is known as a join. To join the results of two or more tables, you
    list them using the FROM clause. The SELECT statement can contain columns from
    any of the tables specified in FROM:


    ```

    SELECT column name,[?] FROM table name, table name,[?] WHERE join predicate

    ```


    The organization of the WHERE clause of an SQL join is extremely important. The
    predicate should start with the foreign-key relationship of the primary table
    to the secondary table (or tables). For instance, the virtual table shown in Table
    8.2 was the result of joining all three of the files in the accounts-rece database
    with the following SELECT statement:


    ```

    SELECT invoice.InvoiceNo,customer.CustNo,

    customer.LastName,customer.State,

    invoiceDetail.LineNo,invoiceDetail.Desc,

    invoiceDetail.Qty,invoice.InvoiceDate

    FROM invoice,invoiceDetail

    WHERE invoice.InvoiceNo = invoiceDetail.InvoiceNo

    AND invoice.CustNo = customer.CustNo

    ```


    In this operation, the ambiguous column names (used in multiple files) are qualified
    with the table name and a dot operator. For optimal performance, your WHERE clause
    should cut out as many rows as possible, early in your SQL statement''s predicate.


    # # Database Maintenance


    So, this chapter has covered how to create tables and indexes with SQL''s CREATE
    statement, populate them with the INSERT statement, and query them with the SELECT
    statement. Next, you need to know how to modify rows in a table and how to delete
    rows, tables, and indexes.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'SQL''s UPDATE statement is used to change the values of columns in the rows
    of a table:


    ```

    UPDATE table name SET column name = expression [\,] [WHERE predicate]

    ```


    If an update operation has no WHERE clause, all the rows of the table will be
    modified to the value specified in the SET clause. For this reason, most UPDATE
    operations should contain WHERE clauses. For example, the following statement
    changes the CloseDate column for a particular invoice:


    ```

    UPDATE invoice

    SET CloseDate = ''28-Nov-1999''

    WHERE InvoiceNo = 1234

    ```


    Rows are removed from a table with the DELETE statement:


    ```

    DELETE FROM table name WHERE predicate

    ```


    It is good practice to test the predicate of an UPDATE or a DELETE statement by
    using it in a SELECT statement first.


    Tables and indexes can be removed with the DROP statement:


    ```

    DROP TABLE table name

    DROP INDEX index name FROM table name

    ```


    For instance, a customer table could be removed with the following:


    ```

    DROP INDEX customer01 FROM customer

    ```


    Note, however, this statement won''t run for the customer table created earlier
    because that table has an index. Before you delete a table, all the indexes built
    over it must be removed. You would remove the customer table''s index with the
