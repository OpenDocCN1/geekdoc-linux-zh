    and then follow the path /bin/linux/i386/ to retrieve the file mod_jk-noaepi.so.


    The module mod_jk-noaepi.so enables Apache to communicate with Tomcat. You''ll
    need to move it to the directory /etc/httpd/libexec/ with the following command:


    ```

    mv <download-dir>/mod_jk-noaepi.so /etc/httpd/libexec/mod_jk.so

