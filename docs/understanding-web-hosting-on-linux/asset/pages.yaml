  md: '# Installation


    Since the title of this chapter is “Installation,” you could reasonably assume
    that it contains a step-by-step set of instructions on how to accomplish this
    task. Well, forget that idea. Such a document is already available for Red Hat
    Linux, titled (non-coincidentally) “The Official Red Hat x86 Installation Guide.”
    This document is available in printed form with the Red Hat boxed set, and in
    both HTML and Adobe PDF format on the distribution CDs and the Red Hat Web site
    (www.redhat.com/support/manuals). There is no need to reinterpret that document’s
    information here. Besides, any well-crafted instructions added here would be obsolete
    by the time you read them. Instead, this chapter focuses on installation issues
    that would otherwise typically be learned through trial-and-error.


    # Preparation Is the Key


    Preparation is the key to successfully installing an operating system. This is
    particularly true when you are dealing with a computer that will be used as a
    server. A server, unlike a desktop workstation, is expected to be available to
    multiple users, typically on a 24-hour basis. Once a server is placed online,
    its maintenance, upgrade, or reconfiguration typically involves some planning
    so that the system downtime can be minimized.


    It is bad enough to have make changes to a server due to increasing capacity requirements
    (although this can be a good problem, if it means that server use is on the increase).
    It is even worse if you need to go through the exercise due to some shortsightedness
    or lack of planning on the part of the original system architect. System downtime
    will, at the very least, erode your users’ confidence in the server and, perhaps,
    in your abilities. At the very worst, the downtime will cost your company money
    in lost sales or'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 24 · CHAPTER 3


    productivity, especially if the server happens to be hosting an e-business application.
    And that might just cost you your job.


    In the context of a Linux server, preparation includes the following steps:


    +   1. Ensure that the hardware is supported by the operating system.

    2. Ensure that the hardware has sufficient capacity for the tasks that you plan
    for it.

    3. Determine what software you need for the server. (Most server software is bundled
    with the operating system, but you might need to gather some from additional sources.
    Ensure that you retrieve the documentation and software updates during your quest.)

    4. Decide how to carve up the disk estate.

    5. Plan your backup and recovery strategy.

    6. Install, configure, and test.


    Each of these steps is discussed in detail in the following sections.


    # Is Your Distribution Compatible with Your Hardware?


    As discussed in the previous chapter, hardware compatibility can be a major issue
    when selecting Linux as your operating system of choice, since it does not always
    support the latest gizmos and gadgets. Fortunately, the manufacturers of those
    products target the home user, where the "sizzle" factor sells more product than
    actual utility. Since you are building a server, you are dealing with an area
    where Linux excels and unsupported gizmos are unlikely to be a factor. You still
    need to do your homework, however, to ensure that you do not have nasty surprises
    during installation.


    Highest on the compatibility checklist is the platform''s architecture, on which
    you plan to install Linux. Unlike Windows, which runs only on Intel or compatible
    hardware (Windows NT does run on the DEC/Compaq Alpha chip, but is no longer supported),
    Linux is available on a number of different platforms. It is imperative that you
    get the distribution for your architecture. Because the focus in this book is
    on Linux-Intel-compatible platforms, you will need the Red Hat Distribution for
    the "x86" platform.


    Next in priority is compatibility with disk interfaces. Two different interfaces
    are commonly in use. The first, SCSI (Small Computer System Interface), is typically
    used in server and workstation machines. SCSI has been around for a long time,
    and the equipment that you use is usually of high quality and reliability. SCSI
    has two main benefits: performance and compatibility. Except for the very low-end
    controllers with page scanners, SCSI controllers include their own processors.
    These processors handle the communications between the peripherals and the main
    system, which increases the performance of the system as a whole. At the time
    of this writing, the maximum transfer rate available for a SCSI-based system is
    160 Mb/sec. Since SCSI has been around for such a long time, it''s almost a foregone
    conclusion that the SCSI controller you want to use will just just fine with Linux,
    particularly if it''s from a mainstream manufacturer.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'SCSI has any downside, it would have to be. Along with the higher performance
    and reliability comes a higher price. SCSI devices are manufactured with higher-quality
    parts and within finer tolerances than other device, which increases their production
    costs. Since they are sold in fewer numbers than their consumer-grade equivalents,
    there aren''t many items over which the costs can be distributed, resulting in
    a higher-per-unit cost.


    The unit of cost leads to the second disk interface: IDE (Integrated Drive Electronics).
    In addition to SCSI, early interfaces MFM and RLL, both of which were limited
    in their performance capabilities. A cheaper, yet better-performing, alternative
    was created that moved the "smarts" from the controller card to the hard drive
    itself—hence the integrated upgrade. IDE was a major improvement over its MFM/RLL
    predecessors, offering better performance at a lower cost. Although it wasn''t
    a contender in performance compared to SCSI, it was a step up for the burgeoning
    PC industry. A later version, IDE (Enhanced Integrated Drive Electronics) added
    both the speed and the ability of the drive to report its identity (how many heads/sectors/cylinders
    it has) to the computer''s BIOS, making hardware installation much easier for
    the user to tackle.


    Why should this be of any interest to you? Because IDE is one of those gizmos
    we alluded to. The high CPU bus speeds available in modern PCs have highlighted
    the dismal performance exhibited by the disk subsystem. A CPU at 1GHz has exactly
    the same performance as one running at 33MHz if both are awaiting arrival of data
    from the disk subsystem. To combat this phenomenon, and to give you another way
    to compare the performance of your system with that of a neighbor''s (with spawning
    a hardware upgrade), manufacturers have come up with some enhancements, with specifications
    known as UMA-33, UMA-66, and UMA-100. These drives carry data at 33 Mb/second,
    66 Mb/second, and 100 Mb/second, so the I/O bottleneck isn''t as much of a problem
    as it was once. Unfortunately, these are new kids on the block, and for controllers
    they aren''t supported by many out-of-the-box Linux distributions. Fortunately,
    Red Hat is fairly up-to-date and can handle many of the commonly available interfaces.
    To be safe, you''ll need to check.


    Although we have discussed the CPU and drive interface so far, you should take
    the time to make a checklist of all your computer''s hardware, and then check
    the hardware compatibility to see if all of it is supported. Red Hat users check
    http://hardware.redhat.com to find a list of compatible products. Two other resources
    are the "Linux Hardware Compatibility HOWTO" (www.linuxdoc.org/) and the Hardware
    Database (http://fld.linuxdoc.org).


    No matter which Linux distribution you choose, make sure that the hardware you
    choose is supported. Although many of the major PC vendors now offer computers
    with Linux preloaded, guaranteeing hardware compatibility, you will probably be
    loading Linux onto whatever you''ve decided to recycle. Ensuring that your distribution
    either supports or can be made to support your hardware will make the installation
    process less irritating. It is time well spent.


    # How Big Is Enough?


    One confusing aspect of building a server is determining the minimum hardware
    requirements. Although Linux has famous for its ability to make older and less
    powerful equipment sing, you must have sufficient hardware resources to handle
    requests in a timely manner. If you don''t, your users will look elsewhere. Other
    than advice like "just purchase a server-class machine to start off,", there are
    hard and fast rules to the alchemy of server-building. Nevertheless, keep in mind
    the following tips:


    +   * The fastest disk drive you can afford. As mentioned earlier, a CPU that''s
    waiting for the arrival of data from the disk subsystem is an idle CPU, regardless
    of its speed. For applications that'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'include a lot of disk I/O, such as a database server, faster disk hardware
    will keep the CPU supplied with data to work with, minimizing idle time. The newest
    Ultra-160 SCSI system is always a good bet, but the EIDE UDMA-100 hardware is
    no slouch either.


    You can improve your subsystem performance by spreading the requests over multiple
    units. With this setup, multiple disk arms can be working simultaneously. If you
    can afford to do so, install more than one disk drive and partition them so that
    the workload is distributed evenly across them. (You''ll see how to do this).
    If you install multiple disks, particularly if you use EIDE drives, be sure to
    install them on separate IDE channels. Most motherboards support at least two
    IDE channels, by using both, you''ll increase your I/O bandwidth, further enhancing
    performance.


    +   as much RAM into the box as can. Linux has a real talent for managing memory.
    If the physical RAM exceeds the current processes, it will use it as a cache for
    data that would normally be sent straight to disk. It will also store recently
    accessed data in memory. If a request is made for data that is still in cache,
    it will be retrieved from instead of avoiding another request to the disk subsystem.


    In short, more RAM can allow for slower disk performance. Conversely, to compensate
    for less RAM by increasing the swap partition on the disk drive, but this will
    decrease the system''s performance because of the relative performance differences
    between real memory and virtual (disk-space) memory.


    +   Consider your CPU performance. This is where the numbers become more difficult
    to pin down. As you know, Linux is a multitasking operating system, meaning it
    can do many things at the same time. Well, not. Actually, the CPU works on one
    task, then switches to the next. It does switching quickly enough to give the
    illusion that everything is running at the same time.


    Although a complete discussion of how it selects task to execute next and how
    much time it spends on a task is beyond the scope of this book, you need to consider
    which tasks you plan to run on the server. If you run your Web server on one machine
    and have a separate computer for your database, even a 233 MHz Pentium might be
    fast enough for your Web server. On the other hand, if you plan on running the
    database on the same machine as your Web server (which might not be a great idea
    if you expect many queries to the database), you will need a CPU that has cycles
    to burn. A long-running query can easily soak up CPU time to make additional connections
    to the Web server appear sluggish and make the server seem unresponsive. Naturally,
    you should avoid this situation.


    You might also consider choosing a motherboard that can handle multiple CPUs.
    Older versions of these motherboards can be bought quite in. Linux will balance
    requests across the various CPUs, helping to keep a heavy-duty database query
    from hogging all CPU cycles.


    As you see, it is somewhat difficult to give explicit recommendations because
    of the variation in job mixes encountered in different installations. We know
    that you would still like some kind of recommendation, so, here goes:


    A low-volume Web server, or one that would be a great development machine, would
    consist of a Pentium/Pro Pentium II or faster processor, at least 128 MB of RAM,
    and a relatively fast disk drive system. This assumes that the server will be
    dedicated to this task and not used simultaneously as a workstation. A workstation
    implies the use of the X window system (the Linux GUI) and its inherent memory
    requirements, which would necessitate a corresponding increase in memory and CPU
    capacity.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# # Acquiring the Pieces and Updates


    After you have picked up the Red Hat distribution, one of the first things you''ll
    want to do—either before the installation if you have another Internet-connected
    computer, or immediately after the installation—is to go to Red Hat''s errata
    page (www.redhat.com/errata) and retrieve all of the updates for your distro.
    The Linux community is quick to produce patches for errant software, particularly
    if those have recently discovered security hole.


    Furthermore, the distribution will undoubtedly be missing some of the software
    you will require for your Web server. Almost all distros include the Apache Web
    server (which is the one we recommend), so that base is covered. However, if you
    intend to use Java to provide dynamic content to your site (which we also recommend),
    you''ll need a Java virtual machine (JVM) for Linux. There are number to choose
    from. You can obtain a Linux JVM from the original supplier: Blackout, now at
    www.blackdown.org; from IBM at www.ibm.com; or from Sun Systems at http://java.sun.com.


    Once you have acquired the JVM, you''ll need some kind of servlet container in
    which to run the server-side Java programs you''ll be running. A good choice,
    if you have the hardware to run it, is IBM''s WebSphere. The open-source alternative,
    Tomcat, is great for lightweight websites. It is available at http://jakarta.apache.org.


    It is the rare site that doesn''t use some kind of database management system.
    Included with your Red Hat package are two MySQL and PostgreSQL. You''ll need
    to check the Web sites for each of them to find which best suits your needs. MySQL
    can be found at www.mysql.com and PostgreSQL can be found at www.postgresql.com.
    If you need a commercial database, you can hardly go with IBM''s own DB2 Universal
    Database, which is available on IBM''s S/390 (zSeries) and AS/400 (iSeries) platforms.
    DB2 does, of course, cost money, while the open-source alternatives are free.
    The alternative you choose depends on your needs.


    This list of software requirements is not meant to be all-inclusive; instead,
    it is designed to get you thinking about your needs. You will be much likely to
    have a successful installation if you select your software and read the associated
    installation documentation prior to the actual installation.


    # # Carving Up the Disk Estate


    > On a clear day you seek forever. (Ancient Computing Proverb)


    One of your tasks during the installation of Red Hat Linux (or any operating system,
    other than DOS/Windows) is to carve your disk into at least two, but probably
    more, logical chunks of varying sizes. When created under DOS/Windows using the
    fdisk program, these chunks, called partitions, make a single drive appear to
    the operating system to be multiple drives. Thus, a physical drive, divided into
    two parts, would appear as Windows drives C: and D:(Actually, if you had more
    than one drive, you could dedicate the entire drive to a single partition.)


    Information about each partition, with its size and partition ID (the type of
    file system on the partition), is stored on the drive in a data structure known
    as the partition table. This table is capable of storing information up to four
    partitions, referred to as primary partitions. One of these partitions can be
    created as a special type, known as an extended partition, which permits the drive
    to be divided even further.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 28 · CHAPTER 3


    Figure 3.1 shows a disk drive partitioned with fdisk (which would appear as Windows
    C:) and an extended partition. A logical partition (which would appear as D:)
    has been created within the extended partition. This extended logical partition
    allocates only once of the space in the extended partition. The remainder is left
    unallocated. Each of the partitions needs to have a file system written to it
    before Windows can use it. The program varies with the version of Windows. Windows
    9x and ME use a derivative of the original FORMAT from the original DOS/Windows
    3.1 operating system. Windows NT, 2000, and XP use a newer program called Disk
    Administrator, which does what FORMAT does and more.


    ![](img/069cd06404ac5e90171e6d857bf3ad28_43_0.png)


    Figure 3.1: A simple partitioning scheme from a DOS/Windows viewpoint.


    Partitioning a disk drive with Linux is similar to partitioning it in Windows.
    A program called fdisk creates the partitions. As with Windows, the raw partitions
    must be formatted before they can store data, although there are exceptions to
    the rule. (For example, DBMSs can write data to a raw partition.) Once the drive
    is partitioned, it needs to be formatted. For this task, Linux includes a program
    called mke2fs (\`make ext2 file system\`) that performs the equivalent function
    of fdisk.


    Linux and Windows diverge, however, when it comes to managing partitions. Linux
    doesn''t refer to partitions, or physical devices, with letters. There is no "A"
    to represent the floppy drive or "C" to the first hard drive or partition. The
    Linux file system is based on an inverted tree structure, typically drawn in a
    diagram with the root directory (indicated by a forward slash/) at the top. Windows
    also uses an inverted tree structure, which does so by partition, and with a backlash
    (\) instead of a forward slash for the root. There is a root directory on each
    floppy disk (A\) and on each physical hard drive or partition (C\, D\, etc.).
    Linux, on the other hand, has only one root directory, and every file, subdirectory,
    or physical device appears in the tree subordinate to the root.


    Figure 3.2 shows a single hard drive divided into three partitions by Linux: one
    contains the actual kernel (/boot), one is used for swap space (virtual memory
    to be used in lieu of physical memory), and one contains everything else (). Notice
    that the drive and partitions appear multiple times in the directory tree in Figure
    3.2. In the /dev (devices) directory, for example, the entire hard drive is referred
    to as /dev/hda, and the individual partitions are /dev/hda1, /dev/hda2, /dev/hda5,
    and /dev/hda6.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Installation · 29


    ![](img/069cd06404ac5e90171e6d857bf3ad28_44_0.png)


    The mappings between the drive, partitions, and entries in /dev are done automatically
    during system startup. This mapping assumes that the drive is the master drive
    on the primary IDE channel. If it were the slave drive on the primary IDE channel,
    it would be /dev/hdb. The references to the primary and secondary drives on the
    secondary IDE channel would be /dev/hdc and /dev/hdd1, respectively. In either
    case, an IDE-ROM drive would be skipped as one of these. And the floppy drive?
    If it were the standard 1.44 Mb floppy (which, to Windows, you would find it at
    /dev/hd0).


    You might be wondering why hda three and four have been skipped in the sequence.
    The reason is that only two of the primary partitions have been created. First
    is /dev/sda1 and the second is /dev/sda2, which has been marked as an extended
    partition and encompasses the remainder of the drive. Any logical partitions created
    within an extended partition will be numbered with five, thus creating the missing
    partitions.


    Now that you have some idea of how Linux maps the physical drives and partitions,
    let''s see how it refers to whenever data is to be written or read. To make the
    partition accessible, the mount command must be issued. This command associates
    a partition with a specific device, grafting it into the directory tree off a
    directory called a mount point. This can be done manually, or automatically at
    system startup by adding entries into a configuration file called /etc/stab.


    In Figure 3.2, the second partition has been dedicated to swap space, and therefore
    does not appear anywhere than in /dev. The other two partitions, however, have
    been grafted into the tree structure. Partition 1 has been mounted in the Linux
    file system as /boot, which is read as "the directory appearing under the root
    directory." Partition 3 is mounted as /, the root partition. In the directory
    hierarchy, /boot and /dev are both subordinate to /.


    If you are familiar with the Windows naming convention, you might find the Linux
    convention somewhat disconcerting. Once you become accustomed to it, however,
    you''ll find it not only natural, but also much more flexible—even elegant. Refer
    to "An Introduction to Disk Partitions" in the appendix of the Official Red Hat
    Linux Reference Guide.


    There is one restriction when dealing with the contents of /boot. Most PCs have
    trouble booting systems where the kernel (stored in /boot) falls outside of the
    1,024 cylinders of the disk drive. In this mind, it''s best to create a small
    (20 Mb or so) partition to serve as the partition containing /boot. This will
    ensure that the PC will be able to successfully load the kernel when the time
    comes.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'The simple three-part partitioning strategy discussed in this section is one
    recommended by Red Hat, primarily because it is fairly simple to understand. The
    next section discusses an alternative that is more complicated, but provides better
    flexibility. In this strategy, the disk partitioning and formatting is done during
    the installation of Red Hat, and you will not be required to manually invoke either
    fdisk or mk2fs. Instead, the graphical installer will handle these details for
    you, insulating you from the decidedly user-friendly fdisk program by replacing
    it with the kinder, Disk Drill. If you ever need to do any partitioning on an
    active system, you will need to learn the mechanics of fdisk, Disk Drill is available
    only during system installation. Once your system is up and running, you can read
    more about fdisk by accessing its man page (discussed in chapter 4).


    # Planning Your Backup and Recovery Strategy


    One aspect of configuring any system is considering the ramifications if the worst
    happens and shiny, new disk drive decides to quit. (Actually, the question isn''t/the
    drive will quit, but rather when it will.) How are you going to get your system
    operating again? Even if it happens across one-in-a-million drive that possesses
    the secret to immortality, you will eventually want to upgrade the operating system
    to a newer level as your needs change or when helpful functions are added to Linux.
    Planning strategy for recovery or upgrade is much easier before the start installation.
    The layout of a Linux system allows your plan for recovery for upgrading as well.
    Let''s look at some of the factors you should consider when planning your system.


    Have you ever noticed how recovery and backup tools are available for the Windows
    platform? An entire industry has built around these functions to compensate for
    what we believe are serious flaws in Windows'' design. On the first list of biggest
    mistakes would have to be the concept of the system registry. This is a binary
    file that Windows uses to store configuration information about itself. Everything
    you''ve ever configured on your system has affected the registry. Lose or corrupt
    that file, and you and your system are down for count. The only way to make manual
    edits to the registry is with one of the Microsoft-supplied programs REGEDIT or
    REGEDIT32. However, both of these require GUI interfaces to operate. If your system
    fails to boot, you are out of luck. To make matters worse, Microsoft has application
    program interfaces (APIs) to allow software tools to use the registry for the
    same purpose. If that gets corrupted, but your system still starts, your applications
    might not work like they used to. A deal! You get two opportunities to optimize
    your system for the price of.


    Another flaw in Windows is the way application software and operating software
    are segregated—or rather, not segregated. It appears as if Windows goes out of
    its way to ensure that application software gets mingled with operating system
    software. Load any application software on your system, and you really find your
    hard drive. Sure, if the software''s authors choose to use the standard Windows
    ShieldGuard, you can uninstall an application easily enough, most of the time.
    If you want to back up and restore a specific application, though, things get
    more difficult.


    The solution to these problems has traditionally been to reinstall a failing application—or
    worse, the entire operating system and all of the applications. The latest versions
    of Windows seem to address these problems. A simpler design in the first place,
    though, might have avoided the need.


    Not surprisingly, we believe that Linux has this simpler design. To begin with,
    Linux has no registry in which all configuration information is stored. All configuration
    files on a Linux system are stored individually, by program, in text files. They,
    are easily identifiable and can be edited by any of the available text editors,
    such as that that run from a text console, like vi. This is a handy feature you'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Installation • 31


    ever have to modify a configuration file from a command line, and it''s the only
    option you''ll have to boot into single-user mode or from a recovery disk or CD.
    In addition, you can save each configuration file individually prior to making
    any changes. So, you always have the capability to immediately fall back to a
    previous configuration should go awry with your experiments.


    The only Red Linux feature that is similar to the Windows registry is the Red
    Hat Package Manager (RPM) database. This is used during the installation of software
    packages, packaged via RPM, to keep track of the software that has been installed
    on the system. Later, it can assist in the removal of specified packages, ensuring
    that their removal will not affect the correct operation of software running on
    the system. It will also be useful when you install additional software or in
    which software packages are already available on the system or in the list to
    be loaded. Because the RPM database is used only for keeping a software inventory,
    its corruption will not affect normal system operations. Its corruption will be
    problematic when additional software is loaded via RPM. Unlike the Windows registry,
    though, the RPM database can be rebuilt, should it become corrupted.


    To keep your system from mixing with the operating system software, Red Hat and
    other Linux distributions support the File System Hierarchy Standard (FHS). The
    purpose of the FHS is to provide a standard definition of the names, locations,
    and purposes of certain files and directories. The collaborative document that
    describes FHS can be found at www.pathname.com/fhs.


    We''ll hold off on a complete description of the various Linux directories until
    chapter 4. Now, we''ll concentrate on the following directories, which contain
    programs and data that do not necessarily come with your Red Hat distribution:


    +   /usr/local—This is the location set aside by FHS for the administrator (you)
    to install software that you''ve identified and wish to.


    +   /opt—This serves the same purpose as /usr/local. This is where we recommend
    that you place static software, such as StarOffice, the Tomcat servlet, and the
    Java Development Kit.


    +   /home—This is where the user''s personal directory is placed. For example,
    a user named "Dewey" would have /home/dewey his home directory.


    If the Red Hat recommendations are followed, all of these directories will be
    on the same partition as the root directory. This isn''t necessarily bad; for
    many people, it will be how their systems configured. What happens, if these three
    directories are on separate partitions. These directories contain programs and
    data that are basically independent of whatever distribution of Linux load. If
    they are on separate partitions, they can be left untouched until the current
    distribution of Linux is replaced with a newer or entirely different version.


    As mentioned, one of the steps performed by the Red Hat installer is the execution
    of mk2fs to format the disk partitions prior to their use. A system that already
    contains formatted partitions will result in the installation program offering
    you the choice as to which partition will get formatted, with certain restrictions.
    (Obviously, you don''t have a choice if the partition is not formatted with a
    file system compatible with your Linux distribution.) If the installer is querying
    you about one of those partitions, you simply intend to leave it intact. The result
    is that all of the extraneous programs you''ve collected, as well as your user''s
    data, will be available once your system is back up.


    Indeed, Red Hat has an installation option that gives the opportunity to upgrade
    your system from one version of its distribution to another. In our opinion, it''s
    much better to install a fresh copy of a new distribution instead of upgrading
    an older one. This ensures that any oversights in Red Hat''s'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'installation program will not come back to haunt you later. After all, writing
