- pgno: 227
  md: "# # UNDERSTANDING\n Web Hosting on Linux\n\nThe Linux operating system was\
    \ initially created by Linus Torvalds, who began his work in 1991 and worked steadily\
    \ until 1994 when Version 1.0 of the Linux Kernel was released. Developed under\
    \ the General Public License, Linux source code is freely available to everyone,\
    \ and Linux is therefore considered an excellent, low-cost alternative to more\
    \ expensive operating systems. The Linux operating system may be used as an end-user\
    \ platform as well as for a wide variety of purposes, including networking and\
    \ software development.\n\nBy virtue of its functionality and availability, Linux\
    \ has become quite popular. As a result, students around the world have been seeing\
    \ Linux education. This book is a guide to setting up a complete Linux environment\
    \ on Android. As you move through the text and the accompanying labs, you will\
    \ build a system with a database management system, a Web server, and server-side\
    \ Java.\n\nAnd you'll understand how it works. Because the system is based on\
    \ Linux, that of the open-source era, everything you learn here is applicable\
    \ to any platform where Linux will run. These platforms include Apple hardware,\
    \ Intel and Intel-compatible hardware, and, of course, the eServer by IBM.\n\n\
    Although there are many variations on how to pronounce the word \"Linux,\" it\
    \ is often pronounced with a short \"i\" and with the first syllable stressed,\
    \ as in LI-nucks.\n\n# TOPICS COVERED:\n\n+   - Linux background and strategies\n\
    - Various distributions of Linux\n- Linux installation\n- Linux configuration\n\
    - Available documentation and finding it\n- Basic introduction to Web technologies\
    \ and programming\n- Server-side Java\n- Databases\n- The Apache Web server\n\
    - Linux operation and administration\n- Linux and the Internet\n- Using the Bash\
    \ Shell and shell programming\n\nDon Donencourt programmed in RPG and COBOL on\
    \ the IBM ISeries platform for eight years before becoming accomplished object-oriented\
    \ C++ and Java programmer. Don has been developing object-oriented applications\
    \ for over 10 years and has written dozens of articles on Java that have been\
    \ published in variety of magazines. At the turn of the century, Don began to\
    \ master Linux so that he had the expertise required to develop Java applications\
    \ on any platform. Today, Don is a success at Webphere editor for ePro Magazine,\
    \ contributor to ISeries News, and Master Expert for COMMON.\n\nBarry Kline is\
    \ a consultant and has been developing software on DEC and IBM platforms for over\
    \ 20 years. Barry discovered Linux in the days when it was necessary to download\
    \ diskette images and code from the internet. Since then, he has installed Linux\
    \ on hundreds of machines, which functions as servers and workstations in ISeries\
    \ and Windows environments. Barry has published dozens of articles about Linux\
    \ and a monthly column. The Linux Letter, published by MC Press (www.mcpressonline.com).\n\
