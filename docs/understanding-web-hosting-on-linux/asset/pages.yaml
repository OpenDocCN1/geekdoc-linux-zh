- pgno: 30
  md: '# 2


    # Distributions


    In the previous chapter, Linux is referred to as an operating system because that''s
    what most people call it. Actually, however, Linux is not an operating system.
    It is, instead, the *kernel* of an operating system. This distinction is important,
    so we''ll explain it first, before discussing Linux distributions.


    # What''s in a Name


    Most casual computer users have little idea of what''s going on "under the covers."
    Most believe that, when the word processor is active, it is the only program running.
    Actually, a running computer that appears to be sitting idle is, in fact, quite
    busy. Many processes and threads are running all of the time. To satisfy yourself
    that this is true, go to a Windows computer (other than Windows 95 or 98), press
    Ctrl-Alt-Delete (the "three finger salute\ and then click on Task Manager. When
    it starts, click the Processes tab, and you''ll see a list of some of the processes
    currently executing. These tasks will appear even if you have no user applications
    active.


    It is the job of an operating system to schedule the resources required to run
    each of these processes, plus whatever you add with your applications. At the
    very least, each process requires some memory and CPU to run, and most processes
    require some kind of disk access to retrieve data. The operating system must perform
    a juggling act to keep all of this running, ensuring that no process gets starved
    for resources too long. This problem manifests itself in slow response times.
    An in-depth discussion of operating systems is beyond the scope of this book,
    but this basic understanding will be helpful when setting up your Web server.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'To fully appreciate what an operating system kernel is, think of your computer
    as an integrated combination of software and hardware. Figure 2.1 shows this combination
    drawn as a layered rectangle. Communication between layers can be accomplished
    only by going through all intervening layers.


    ![](img/069cd06404ac5e90171e6d857bf3ad28_31_0.png)


    The hardware components of the computer are at the core of the integrated mass
    in Figure 2.1. This core includes the memory, CPU, video system, I/O system (keyboard,
    communications, USB ports, etc.), and storage (hard drive, CD, floppy). Enveloping
    the core is a layer of software called *firmware*. This layer is supplied by the
    hardware''s manufacturer to provide a means for communicating with other software.
    Firmware is also called *embedded software* because it''s typically burned into
    read-only memory (ROM) or some kind of electrically erasable programmable read-only
    memory (EEPROM), which can be updated using manufacturer-supplied programs.


    The next layer is the operating system kernel. Through software modules known
    as *device drivers*, which can be provided by the manufacturer or by enterprising
    open-source programmers, the kernel can communicate with the hardware. Any program
    that requires a resource, such as a chunk of memory, must request it from the
    kernel. In fact, the kernel is responsible for the allocation of all the computer''s
    resources. Using CPU time it provides the scheduling so that all processes get
    a chance to run, arbitrating between conflicting requests for resources. Most
    importantly, it provides protection between processes, so that some errant program
    instructions in one process can''t cause damage to another.


    The next layer is the system software. This layer is an adjunct to the kernel
    and extends the services that the kernel provides. An operating system is the
    combination of the kernel and the system software.


    The kernel could function without this software, but the computer would be, in
    effect, spinning its wheels and accomplishing nothing. The system software adds
    whatever functionality is required to make the'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'computer operate in the role to which it is assigned. For example, a workstation
    computer has significantly different functionality than, say, a network server,
    and thus will have different pieces of software loaded. A network server has little
    need for a sophisticated video system, since it is probably text-based and has
    no GUI capability. Therefore, it will not have the system software dealing with
    graphics loaded onto its hard drive.


    The outer layer of software is the application software. This might include the
    Apache Web server, the DB2 Universal Database (although on the AS/400, DB2 is
    tied into the system software), and the Gimp graphics editor.


    It''s easy for the distinction between system software and application software
    to become blurred, particularly because system software such as Windows and Linux
    typically includes so much application software. Most people tend to classify
    any software''s available for multiple operating systems or for end users (such
    as a word processor) as an application. If the software modifies the behavior
    of the operating system in some way, or operates directly on objects within the
    operating system, then it is considered system software. After all, if it walks
    like a duck and quacks like a duck...


    # GNU/Linux


    Arguably the biggest reason UNIX doesn''t have a bigger share of the market is,
    early on, every company that wrote some UNIX-like operating system did so from
    the kernel layer up. Layers of software above to that specific kernel specification.
    This snowball all the way up to the application layer. As a result, it became
    very difficult to port an application written on one variation of UNIX to another.
    Software companies had to have different versions of their applications for each
    version of UNIX to which they marketed their products. This became an incredibly
    expensive proposal and a very unattractive business model. To combat this, the
    IEEE Portable Standards Committee was formed, and POSIX (pronounced "pah-six")
    developed. This standard was developed by extracting the best points of all the
    existing variants and then codifying the result. Application software written
    on one POSIX-compliant variation of UNIX can be ported with relative ease.


    The software that has brought GNU Torvalds fame and fortune (well, fame anyway)
    is a kernel. The system software that enables an operating system when combined
    with the kernel was provided by the GNU project. The resulting operating system
    is called GNU/Linux. This is a major point of contention among peers, referring
    to GNU/Linux as Linux minimizes the contribution of GNU and the Free Software
    Foundation to the Linux phenomenon. So, keep in mind, when you see or hear anything
    about Linux, GNU had a great deal to do with it. Even though we use the simpler
    “Linux” in this book, we do so while recognizing the contribution of GNU and the
    Free Software Foundation.


    # Definition of Distributions


    Now that you know about kernels, you need to know what a distribution is. To give
    a complete explanation, we must first look at how “techies” had to obtain copies
    of Linux.


    You might not have ever installed an operating system on your computer before
    most big-name computer manufacturers provide one (typically, Windows) pre-installed.
    If you have a Windows installation, the process has probably been to insert a
    CD into a CD-ROM drive, power on the computer, and'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'then follow the on-screen instructions. Modern Linux distributions have made
    the installation equivalent to that of Windows. This has not always been the case.


    When the Linux kernel was initially made available (long before version 1.0),
    the only option you had to download its source code from an FTP site (the Web
    as we know it was in its infancy), and then compile it on another system, copying
    the resulting binaries onto disks. Once the kernel successfully running, you had
    to go back to the Internet, and then download and compile the various source files
    for each of the required programs and utilities, being mindful of the dependencies
    between programs (i.e., one requires another). The resulting binaries would then
    be copied to diskette for installation on the target system. In short, you had
    to completely rectify your Linux system. Given the complexity of this task, it''s
    no wonder that the only users of the early system were hackers (in the positive
    sense of the word) with UNIX backgrounds. Their interest was primarily the potential
    to bring their believed UNIX environment home to their computers without having
    to pay for the price.


    It is unlikely that Linux would have achieved the status currently enjoys had
    this remained unchanged. Unfortunately, the need to simplify the Linux installation
    process appeared, and some enterprising individuals decided to bundle all of the
    tools, compiled and ready-to-run, into a package that could be installed by "mere
    mortals." Included in this package was a set of installation scripts that would
    modify the installation, based on the answers the user supplied to the script''s
    questions. Thus, the concept of a distribution was born. Short definition of distribution,
    then, is:


    > A distribution is GNU/Linux system and associated utilities, bundled into a
    package along with installation and/or configuration scripts (programs), which
    tends to be the center of many religious wars in the Linux community.


    We''ll expand this definition.


    One of the first popular Linux distributions was Slack, developed and maintained
    by Patrick Volkenberg. Slack started as a floppy-based distribution, with various
    parts of the OS divided into several letters of diskettes. A diskette was set
    for the kernel, one for networking, one for compilers, and so on. It also had
    an installation script that seemed to ask a never-ending series of questions.
    Worse, the script was not very forgiving; you could not change the answer to any
    question without restarting the installation. This could be a major irritation
    if it happened toward the end of the process.


    For all its merits, however, Slack was a major step forward. While it required
    a bit of knowledge to use it, it did allow people who wanted to use Linux to do
    so without jumping through hoops, particularly those who didn''t have an additional
    computer to compile the source files to get Linux running. Slack is still a viable
    distribution that has been updated with each new Linux kernel. The distribution
    is now available on a bootable CD-ROM, and the installation script is much more
    user-friendly. For all its improvements, though, Slack is not for the beginner.
    It requires some knowledge to install effectively.


    # Anyone Can Do It


    Now you know the basics of distributions (also called distros), you might wonder
    who creates them. The answer is simple: anyone can create a distribution, as mentioned
    in chapter 1, the kernel and GNU software have been based on GPLed. That means
    there is no legal encumbrance preventing someone from creating a distro, other
    than that of releasing any software based upon other GPL with the same'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'copyright. The result can be distributed as the author wishes, complete with
    the code that came from other sources. That''s the beauty of open-source software.


    Contrast with the commercial model practiced by companies such as Microsoft. Suppose
    a company called Slick Software sold a compelling package to manage widgets. How
    long do you think Microsoft would permit Slick to bundle a Windows with its own
    widget software? The answer is obvious. On the other hand, Slick could bundle
    a Linux distribution with its software without any problem at all. Again, that''s
