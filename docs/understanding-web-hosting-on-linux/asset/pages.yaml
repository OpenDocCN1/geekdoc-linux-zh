  md: '# # JavaServer Pages


    In a period of about 12 months after Sun Microsystems introduced the Servlet API
    servlets became widely adopted as a standard for host-based Internet applications.
    Java servlets are essentially Java with embedded HTML. A JavaServer Pages (JSP),
    on the other hand, is essentially HTML with embedded Java.


    Your JSP files are placed in the same directories as your HTML. Like HTML, they
    are qualified by users in a Web browser. The only difference is that the JSP file
    has an extension of .jsp rather than .html. When the Web server sees the .jsp,
    it passes the request to a Web application server as IBM''s WebSphere or Apache''s
    Tomcat.


    The best way to learn how JSP works is to follow a simple example. The following
    line of text contains the complete HTML syntax from a file called Minimal.html:


    ```

    <html><body>

    Minimal HTML file

    </body></html>

    ```


    If you place this Web file in Tomcat it passes the request for http://usr/local/tomcat/webapps/ROOT
    deployment directory and request it from your Web browser with http://127.0.0.1:8080/Minimal.html,
    Tomcat simply sends that HTML text file down to the browser. If you rename Minimal.html
    to Minimal.jsp, however, the process works entirely differently.


    When you request Minimal.jsp, the Web server sees the j extension, creates a Java
    source file that contains the complete HTML and Java syntax of the JSP, and compiles
    it into a Java servlet. For example, when I entered http://127.0.0.1:8080/Minimal.jsp
    into my Netscape browser, Tomcat created the Java servlet source file shown in
    Figure 7.10, compiled it into a Java class called Minimal_jsp_1.class, and then
    executed that The servlet simply sent the dynamically generated HTML file with
    the string "Minimal HTML file" back to my Web browser.'
