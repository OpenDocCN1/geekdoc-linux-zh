    For the less adventurous, another way to compare and contrast the vast distributions
    is to go to www.linux.com and check out the "Distributions" link. The number in
    distributions is in this site''s database. At the time this book was written,
    there were 219. Click on the link, and you''ll see short descriptions of each
    distribution, as well as links to a number of special-purpose ones, including
    those that are floppy-based, built for security, or built for international use
    (with appropriate language fonts for double-byte character sets, as those used
    in Asian and Middle Eastern countries).


    The short descriptions on "Distributions" hardly do the distributions justice.
    To complete them, you''d have to follow the link to each one''s home page, where
    you could read about its design goals, features, and included application software.
    This would be a real time-consuming chore. To narrow down your selections, ask
    yourself what you need or want with your Linux machine.


    If you have specific application software in mind, the choice might be fairly
    straightforward. For instance, if your company has a requirement to use Core''s
    WordOffice 2000 suite or itsDRAW program, use Core''s distribution. This is particularly
    true if you''re going to buy hardware that''s approved for use of Core''s, so
    you can ensure that the hardware will be supported.


    But if you have hardware already sitting in your office until you''ll load Linux.
    In this case, a distribution that has a Linux kernel new enough to support your
    hardware, assuming that one exists. In most cases, bleeding-edge hardware gets
    support for Windows long before Linux makes manufacturers write drivers for Windows
    before delivering hardware to market. After all, they want to sell hardware, and
    since Windows has the lion''s share of the desktop market, the drivers must be
    ready. With a few exceptions, Linux support for a piece of hardware comes after
    it is available to the public.


    While manufacturers write Linux drivers, most of the time, the Linux community
    gets from the manufacturer is the hardware specifications. The actual software
    engineering has to be done in the open-source community. And they can''t do that
    until the hardware can be purchased. The moral is to pick'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'distribution for which there is active development. If you do, you won''t have
    to wait too long until new hardware gets supported.


    Speaking of court, remember to consider long-term support for your system when
    picking a distribution. The cost of an operating system is just a small part of
    the total cost of ownership (TCO) for any computer system. You must keep the system
    running. Even Linux is miles ahead in the purchase-cost race, and is arguably
    ahead in the stability (and, therefore, TCO) race, you''re going to need to maintain
    your system, since your software and hardware requirements will change over time.
    You''ll need someone to do that. The reality is that the number of qualified Linux
    gurus available to maintain it is eclipsed by the number of qualified Windows
    gurus available, but that will change over time.


    The myth that “everyone” is a Windows guru (after all, they use the OS on their
    home PC, so that makes them experts) gives the perception that obtaining support
    for a Windows box is trivial. It is this perception that gives “suits” a warm,
    fuzzy feeling when adopting Windows as the operating system over Linux. Linux
    is a tangible product, with a tangible cost, produced by a non-insignificant company,
    it is an easy choice for the corporate world. All you know from the Internet,
    can obtain support, should need the arise.


    The corporate argument against Linux stems from the necessity of support. The
    clients who use our services can always call on us to support their systems—at
    least when we hit the lottery, retire, or meet an untimely demise. We''re not
    being tired when making that statement. Those thoughts have crossed the minds
    of more than one of our clients. An exit from their world could prove problematic.
    Fortunately, it''s a problem that can be solved by selecting a distribution for
    which support is available.


    Although not the only one, Red Hat is such one company. Red Hat derives some revenue
    through the retail of its distributions, but its business model is predicated
    on selling support services. After all, you wouldn''t want to buy from a company
    selling software that can be downloaded from the Internet, or purchased once and
