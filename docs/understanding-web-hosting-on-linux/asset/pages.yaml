- pgno: 57
  md: '# 42 · CHAPTER 3


    +   1. rpm -Uhv package_name.rpm updates or installs a package. If the package
    is not installed, it will be installed. If it is already installed, older versions
    of the software will be replaced by the newer version.


    +   2. rpm -ivh package_name.rpm installs a package. This option is typically
    used when updating a kernel package, since it allows the older version of the
    kernel to remain. Should anything go wrong with the newer version, you can always
    boot the older version.


    Assume, for example, that you have a package on your system called foo. To see
    what version of foo is currently installed, type the command `rpm -q foo`. You
    should get a response like `foo-1.4.5-10`. Assuming a new package has become available,
    say `foo-1.5.0-1.rpm`, you download it and type the command `rpm -Uhv foo-1.5.0-1.rpm`.
    Once the package has been installed, the command rpm -q would return `foo-1.5.0-1`,
    indicating that the update was successful.


    # Chapter Summary


    This chapter outlined the steps required to install Linux. It emphasized preparation,
    with the focus on creating a system that is flexible and can be easily upgraded
    or reconfigured. Good system administration requires that the system software
    be kept up-to-date to ensure the latest security upgrades and enhancements are
    in place. To ensure a smooth installation, nothing beats reading the documentation
    prior to installation. And no system is complete without a boot diskette.


