    Figure 13.4: Apache''s Tomcat script uses many of the features of shell programming
    (part 4 of 4)


    The script begins by checking to see if a special file called .tomcatrc (Tomcat
    resource) exists under the user''s home directory. (Refer to Table 13.2 to find
    the meaning of the file operators used in the tomcat.sh conditionals.) If .tomcatrc
    exists, tomcat.sh executes it with the dot sourcing operator.


    The next three blocks of code are aligned with the same predicate:


    ```

    if [ "TOMCAT_HOME" = "" ]; then

    ```


    The first two code blocks attempt to set the value of TOMCAT_HOME, while the third
    echoes a message to the user and gives up (exits with an error code of one). That
    first first block uses the qualified name of the script (with the $0 variable)
    to guide where TOMCAT_HOME should be. The while loop that begins with the following
    condition is decided by:


    ```

    while [ -h "PRG" ]; do

    ```


    It handles circumstances where the qualified tomcat.sh file name is a link, by
    back-peddling links until the real file is found. The while loop uses the expr
    and an odd search string to retrieve the linked name from a directory list:


    ```

    link=expr "$ls" : \''.*\.(.*)$''

    ```


    Note that a long directory list will show that a file is a link by listing the
    name of the linked file after the -> operator loop.


    The while loop uses basename to strip the directory and extension from $0 and
    dirname to strip the nondirectory extension from a qualified file name. After
    the while loop terminates (because there are no more links), Tomcat checks if
    the directory, so laboriously found by back-peddling links, contains a directory
    called conf. If it does, Tomcat assumes that''s the proper directory and sets
    TOMCAT_HOME to it.'
