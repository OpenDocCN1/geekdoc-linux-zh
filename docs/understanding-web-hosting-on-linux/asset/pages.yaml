    We filename globbing regularly when searching for files with the find command.
    For instance, if you want a list of all the Java source in a specific directory
    under your home directory, you can use the following command:


    ```

    $ find ~/manta/*.java

    ```


    The asterisk wildcard tells find to list all files that have the string ".java"
    as the file name''s extension. If you wanted to drill down further and find Java
    source for a file that contained the string "DTD" in the file name, you could
    use the following command:


    ```

    $ find ~/manta/*DTD*.*.java

    ```


    If you wanted to look for any Java source that starts with an uppercase alphabetical
    letter and finishes with a numeric, you could use the following command:


