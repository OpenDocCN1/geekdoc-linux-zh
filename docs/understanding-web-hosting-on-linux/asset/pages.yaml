    facility that converts human-readable domain names like “www.ibm.com” to the cryptic
    Internet Protocol (IP) addresses required heavily by the Internet.


    Today, Linux is used heavily in businesses because it proved its reliability as
    a server platform during the dawn of the Internet revolution. Initially, however,
    IT (Information Technology) directors scoffed at the idea of using “free” software
    such as Linux for mission-critical applications. Nevertheless, in the back door
    of corporate America. The networking experts who were given the task of setting
    up and maintaining Internet applications were comfortable with the stability and
    reliability of Linux. These networking personnel, without asking management, began
    to use Linux to host their Internet applications.


    The product-approval process at most companies revolves around the signing of
    purchase orders. Since Linux is free, however, networking personnel didn’t have
    to cut purchase orders. As a result, management often had no idea Linux had been
    deployed at their companies. When Linux began to receive positive press, and the
    stocks of companies like Red Hat started to explode, many IT directors asked their
    experts to try Linux, only to find out it was already being used.


    # Who Needs Linux


    Linux is a good operating system for colleges and universities, not only because
    it’s free and runs on old computers that other operating systems can’t handle,
    but because all the code for Linux comes with it. Students can research the code,
    make modifications, reconfigure, and recompile the entire operating system. In
    fact, Linux enhancements and bugs fix quite often from the computer-science departments
    of universities.


    Linux is a good host for a desktop graphical user interface (GUI). The desktop
    metaphor of a GUI allows users to organize application windows on their monitors
    in the same way that they organize pages and books on their desks. A desktop GUI
    also enables the point-and-click capabilities of a mouse, where a picture represents
    an action that will occur when the user clicks on it. GUIs have improved the usability
    of computer applications, and today’s users expect a GUI environment for PCs.


    # GUI Choices


    Unlike Windows, Linux does not have an integrated GUI. Linux is a part of the
    open source movement that frees you from proprietary solutions. If Linux had an
    integrated GUI, it would be picking the desktop GUI for you. When you install
    Linux, you pick from a variety of choices available for system software, including
    your choice of a GUI environment. The two most prominent Linux GUIs are KDE (www.kde.com)
    and Gnome (www.gnome.org). KDE is more Windows-like, while Gnome is more sophisticated
    with greater potential for application integration through object-oriented interfaces.
    For this, one of the authors used KDE as his desktop GUI, while the other used
    Gnome.


    Desktop GUIs like KDE, Gnome, and Microsoft Windows do not, provide a complete
    set of application software. They just come with basic facilities such as file
    browsers, email clients, and configuration software that allows you to add application
    software. When you purchase a PC with Windows preinstalled, a suite of office
    products is included in the price (bundled). This office typically include, at
    the very least, a word processor and a spreadsheet.


    With proprietary solutions like Microsoft Office, you pay a premium for the office
    software. With Linux, you have freedom of choice for office software. You can
    pick from a variety of options, from'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Why Linux •3


    free open-source solutions like Sun''s StarOffice (which was used to write this
    book), to pay-for-view solutions like Appluxware/Anywhere (www.vistource.com/products/)
    and WordPerfect Office (www.corel.com/products/linux.htm).


    # Linux Origins


    Linux is considered a new operating system. Because it is UNIX-based, however,
    much of the technology behind it is over 30 years old. In 1969, Ken Thompson and
    Ritchie, software engineers at AT&T Bell Labs who had previously worked on the
    Multics (Multiplexed Information and Computing Service) operating system, began
    developing a portable operating system. They called this operating system "Unics"
    as on Multics (The later mutated to an x.)


    To make their operating system portable, Thompson and Ritchie had to develop a
    language that was not bound to a specific platform, and the C language was born.
    The C source for every UNIX operating system could be copied and then recompiled
    on various platforms. Because AT&T Bell Labs made the C source code for UNIX freely,
    several UNIX variants emerged: BSD (Berkeley Systems Division) UNIX, Sun Micros''
    SunOS, and AT&T''s System V. After the federal breakup of AT&T, Bell Labs UNIX
    was generally considered to be a commercial asset of AT&T. As a result, companies
    that wanted to use UNIX to formally license it.


    The vendors who to license UNIX rights from AT&T ended up tweaking their own flavors
    of UNIX so that they could lock their customers into their variant. Despite these
    "UNIX wars," as they were called, UNIX was still successful, and most technical
    colleges had UNIX in their curriculum.


    To circumvent UNIX licensing, Andrew Tanenbaum, the author of highly successful
    books on operating systems and compilers, created his own flavor of UNIX, MINIX,
    for the sole purpose of teaching UNIX to college students. Much later, the University
    of California at Berkeley also created a UNIX derivation called FreeBSD, that,
    like MINIX, was enabled to be freely modifiable and distributable. Today, however,
    the most known and famous version of UNIX is Linux, created by Linus Torvalds.


    In the early 90s, Torvalds, a graduate student at the University of Helsinki,
    became tired of the limitations of MINIX. He began to develop Linux as his version
    of UNIX for the Intel platform. Through Internet newsgroups and forums, Torvalds
    invited other computer scientists to assist with his project. On October 5, 1991,
    the initial version of Linux, 0.02, was released. Version 1.0, the first business-quality
    version, was made available in March 1994.


    Linux has received so much positive press than any other UNIX variation, including
    IBM''s, AT&T''s, and Sun Micros''. Interestingly, FreeBSD (www.freebsd.org), is
    comparable to Linux in features and quality, has nowhere near the acceptance rate,
    mostly because of bad timing. While Linux was the darling of the press, the BSD
    was in litigation with AT&T to determine whether BSD contained property Bell Labs
    material. By the time BSD was from the litigation, Linux had gained the industry
    momentum.


    # The History of Microsoft Windows


    Linux is often compared to Microsoft''s operating systems. Because of the "Linux
    or Windows" question, it is worthy to briefly review the history of Microsoft
    Windows. Microsoft got its start in 1983 because IBM wanted an operating system
    for its new IBM PC. IBM could have developed its own operating system'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'for the PC. In fact, an excellent operating system was already available at
    one of their research divisions. However, because IBM was under investigation
    by the federal government for having a monopoly, it began to search for an outside
    software firm to develop the PC''s operating system.


    Bill Gates'' mother figured to find out IBM''s research and suggested that an
    IBM executive acquaintance of hers gave her son a call. At that time, Gates''
    expertise was in the development of BASIC compilers, when IBM asked if his company
    (which only amounted to a couple of people at the time) could create an operating
    system for the PC, he said Gates bought the rights to an existing operating system
    for $40,000, tethered it to IBM''s specifications, and called it Disk Operating
    System (DOS). Shrewdly, Gates asked IBM for royalties on DOS rather than a lump-sum
    payment. Millions of PCs were so with DOS bundled, and Microsoft started its rise
    to dominance.


    IBM realized that PCs required a more powerful operating system than DOS, so it
    invited Microsoft to partner with it in the development of a multitasking operating
    system. Microsoft agreed, and the two companies began the collaborative development
    on what would become OS/2. While Microsoft was developing OS/2 with IBM, it was
    also developing its own new multitasking operating system. Then, after OS/2 was
    introduced, Microsoft came out with Windows.


    OS/2 was superior to Windows because OS/2 was a full multitasking operating system,
    while Windows was on top of DOS and lacked multitasking capabilities. Nevertheless,
    because Windows was backward-compatible with DOS applications, and partly because
    of Bill Gates'' marketing genius, Windows became the dominant PC operating system,
    while IBM''s technically superior OS/2 flourished.


    Later, Windows 95 and 98 provided improved GUI capabilities, but the operating
    system still crashed regularly, and users began rebooting their machines daily
    as an acceptable part of owning a PC. Even in the 1980s, operating system crashes,
    even on personal workstations or corporate servers, should not have been acceptable
    because sophisticated multitasking operating systems had been available since
    the 197s.


    It wasn''t until the introduction of NT that Microsoft provided a full multitasking
    operating system. (Meanwhile, OS/2 flourished to the point of being discontinued.)
    With Windows NT, Microsoft finally produced an operating system that could be
    compared to Linux. Still, NT was known to crash regularly, and many system administrators
    found that for reliability, they needed to have one server per application: one
    for Web, one for file serving, and one as a Domain Name Service. In 2000, Microsoft
    came out with Windows 2000, and the reliability of Windows 2000 as a server has
    been far superior to its Microsoft predecessors.


    # Linux Growth


    When Linux version 1.0 was introduced in 1994, the first people to use it were
    UNIX programmers who wanted UNIX-based systems at home. They found that not only
    was Linux a solid operating system for their Intel-based PCs, but it also had
    many of the same capabilities as the UNIX operating systems running on the costly-mid-large
    systems at their workplaces.


    As mentioned earlier, when the Internet exploded, network administrators were
    given the task of getting their companies on the Web. That task required additional
    hardware and software. Rather than going through the laborious procurement process,
    these networking administrators pulled 386 and 486 PCs that could no longer run
    the latest versions of Windows, loaded Linux, and configured these boxes with'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'servers. Networking administrators also found that they could recompile the
    Linux operating system with only those features required for a specific server,
    enhancing performance.


    Many of the early adopters of Linux used their home-based Linux systems and their
    knowledge of UNIX to deploy personal Web sites. A significant number of these
    personal Web sites evolved into commercial sites. What better operating system
    for an Internet startup than one that has all the required TCP/IP software, is
    robust, solid, and yet?


    Corporate American began to take notice of Linux, and the rate of Linux-hosted
    Web sites skyrocketed to 17 percent of the server market (source: International
    Data Corporation, www.idc.com). By 1998, that number was 25 percent and, in 2000,
    Linux gained the number-two spot behind Windows 2000 in the server operating-system
    market, with 27 percent of market. IDC predicts that the Linux operating environment
    worldwide will achieve a 25 percent compound annual growth rate through to 2003.


    # # Cost Effectiveness


    Virtually all businesses require cost justifications for new directions. Although
    the Linux operating system is free, there are other costs to consider. First,
    there is the question of technical support, both internally and externally. Then,
    there is the question of whether or not Linux is a verifiably reliable, stable,
    and secure platform. If a company dedicates a thousand work-hours to the deployment
    of a Linux-based Web site, and it fails; that''s a loss of perhaps $100,000. Even
    if the project was success, would an NT or Solaris solution have been less costly?
    To answer the question of server costs, companies need to look at three factors:
    hardware, software, and support.


    # # Hardware Costs


    Linux can run on any existing hardware. In fact, it is known as the "universal
    OS" because it runs on all kinds of devices, from wristwatches to the one in Figure
    1.1 to high-end platforms as those provided by Hewlett Packard, IBM, and Sun.


    ![](img/069cd06404ac5e90171e6d857bf3ad28_20_0.png)


    Figure 1.1: To demonstrate the portability of Linux, IBM installed it on a wristwatch.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 6 · CHAPTER 1


    Of course, a company won’t be running its Web server off a wristwatch, but many
    small companies running Linux-based Web servers off old Intel 486s and low-end
    Pentiums. At the other end of the scale, larger companies can opt to install Linux
    on existing IBM, Sun, or Hewlett-Packard hardware. IBM’s iSeries even allows to
    run Linux on the same machines as legacy OS/400 systems, using a facility know
    as logical partitioning, or LPAR. In fact, using LPAR technology, the iSeries
    can run up to 32 virtual Linux operating systems on one iSeries platform. IBM’s
    gargantuan zSeries platform, shown in Figure 1.2, takes the capabilities of LPAR
    even further: a single zSeries machine can host literally thousands of virtual
    Linux operating systems.


    ![](img/069cd06404ac5e90171e6d857bf3ad28_21_0.png)


    Figure 1.2: The IBM zSeries platform is able to concurrently run thousands of
    virtual Linux operating systems.


    If a company has existing hardware, however, why wouldn’t it simply use that platform’s
    native operating system instead of Linux to host the Web server? The answer is
    two-fold:


    +   1. Linux has some of the best Internet software.


    +   2. There are far more Internet professionals with Linux experience than those
    with, say, IBM OS/400 or OS/390 Internet experience.


    Furthermore, the Linux professional base is growing exponentially, while the professional
    base for all other operating systems (except Windows) has leveled off.


    Even if a company opts to purchase new hardware for Web serving, the required
    hardware for Linux will be equal to or less than required for other platforms.
    The hardware requirements will be equal if you run the Linux operating system
    using the default product installation, but it can be less if you favor the reduced
    size of the Linux operating system recompiled to contain only the required software
    components.


    # Software Costs


    You have already learned what Linux costs—it’s free. Costs for other operating
    systems can range anywhere from $800 to as much as $100,000, depending on multiuser
    licensing fees. But what about all the'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'other software required to host a Web server? You''ll need several products
    that support TCP/IP, the low-level protocol of the Internet. Obviously, you''ll
    need a Web server, and you''ll probably also need an email server. Linux, unlike
    other operating systems, has its TCP/IP modules fully integrated. For serving
    and email, the various Linux distributions bundle the world-class open-source
    Apache HTTP server (www.apache.org) and sendmail (www.sendmail.org), along with
    many other Web-hosting products.


    An important piece of software vital to the hosting of a robust site is a Web
    server. While Web servers (also known as HTTP servers) basically serve only static,
    unchanging Pages, Web applications work in association with HTTP servers to serve
    dynamically constructed, interactive pages. When a user''s request for dynamic
    information comes into the HTTP server, it forwards the request to the Web server.
    The Web server, in turn, uses Java code to dynamically construct a Web page that
    responds to the user''s request. The Web application server sends this forwards
    to the HTTP server, which sends it to the user''s browser.


    The cost of Web application servers is not a consideration for whether or not
    to use Linux because all Web applications (except Microsoft''s Internet Server)
    run on all operating systems. IBM''s WebSphere, for example, runs well not on
    all of IBM''s operating systems (AS/400, OS/390, and AIX), also on Solaris, HPUNIX,
    and Linux. WebSphere''s closest competitor, BEA''s WebLogic, also runs on a variety
    of operating systems, including Linux. In addition, the open-source Web servers
    available, most notably Apache''s Tomcat, run on many operating systems, including
    Linux.


    # Support Costs


    Having discounted hardware and software costs, the only real cost is support.
    The big question that companies have about "free" software is who is going to
    support it? For Linux, the answer is multifaceted. One source of support is the
    Linux user community, which, in 1997, was awarded "Best Technical Support" from
    InfoWorld. The Linux user community is made up of experts who are ready to freely
    help new Linux users. The community is accessible through a wide variety of newsgroups
    available from Usenet (www.usenet.com) and Internet Relay Chat (at www.irc.org).


    Many corporate executives, however, want to put a a "suit and tie" on technical
    support. They want to pay to ensure the quality and availability of these services.
    Formal support for Linux is available from a variety of sources, the first and
    most obvious being the Linux distributors. These distributors, some of whom are
    shown in Table 1.1, sell installation CDs for Linux that come with bundled open
    source software, and a limited amount of phone and Web support. Most of these
    distributors also offer extended support programs. In fact, much of their revenue
    comes from technical support for Linux.


