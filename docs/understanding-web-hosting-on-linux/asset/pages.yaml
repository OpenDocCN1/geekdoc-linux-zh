    DirectoryIndex tomcat.html

    ```


    Figure 9.1: a minimal httpd.conf Apache configuration file enables basic Web serving.


    Each of the lines in Figure 9.1 is known as a directive (except for the comment
    line, which is preceded by a pound symbol). The ServerRoot qualifies the directory
    that contains the Apache modules. The Port directive qualifies Apache to sit on
    the TCP/IP port number of 8888. (If this directive is omitted, the default HTTP
    port number of 8888 is used.) The next two directives, User and Group, qualify
    the user profile that Apache will use to verify access to requested files. The
    user name of “nobody” sounds fake, but if you look at the /etc/passwd file (which
    lists all users for your system), you’ll find nobody listed. User nobody pretty
    much is a nobody in terms of accessing sensitive information on your machine.
    And that’s the point. When users request files from your Apache HTTP server, they
    will only be able to access those files that user has rights to.


    The ServerAdmin directive simply qualifies the address of the master, should a
    Web-browsing user wish to connect him or her. The ServerName directive qualifies
    the domain name of the server machine. Since this configuration is for test purposes
    only, it uses the special loop-back domain of localhost. The DocumentRoot directive
    qualifies the directory created earlier to hold the files to be served by this
    Apache instance.


    Let’s skip the LoadModule and AddModule directives for a moment, and move ahead
    to TypesConfig and DirectoryIndex. TypesConfig qualifies a file that maps HTTP
    content types to file extensions. It is through this file that Apache is able
    to set the appropriate HTTP content-type header sent to the browser. Table 9.2
    shows a partial list of the mime.types file.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Table 9.2: A Partial List of the Default /etc/mimes.types File


