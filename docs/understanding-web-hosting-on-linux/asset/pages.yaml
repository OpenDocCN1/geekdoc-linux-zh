    | text/html | .html or .htm |


    The last directive in this minimal httpd.conf DirectoryIndex, qualifies the name
    of the HTML file that Apache is to serve, should a Web-browsing user enter only
    the server name.


    Now, back to the LoadModule and AddModule directives. The default httpd.conf file
    that exists in the /etc/httpd/conf contains numerous LoadModule and AddModule
    directives. However, the minimal example httpd.conf only qualifies the mod_mime
    and mod_dir modules to be loaded and We added these because they enable the TypesConfig
    and Directory directives. If you remove the LoadModule and AddModule directives
    (or comment them out by adding a pound symbol for the first character in their
    lines), and Apache will fail to start.


    One problem with multiple Apache configuration is that you can''t use the handy-duty
    httpd Apache startup script in the /etc/rc.init.d/ to use it. Instead, you have
    to directly invoke the httpd binary located in /usr/sbin. Further, you have to
    qualify the location of the custom Apache configuration file:


    ```

    /usr/sbin/httpd -f /home/userdir/www2/conf

    ```


    Using this strategy, you can start multiple Apache instances, as long as each
    configuration file qualifies a different port number.


    The /etc/rc.init.d/httpd script has a stop option to end the Apache server, but
    since you can''t use the script with this strategy, you have to end the Apache
    manually. If de a Linux process, use the kill command with the process ID of the
    controlling Apache process. To find that process ID, use the following ps command:


    ```

    ps aux | grep /usr/sbin/httpd

    ```


    The ps command lists all httpd processes, as shown in Figure 9.2. Note that Figure
    9.2 lists, not one, but nine processes. Also note that the name of the user associated
    with the first process is the super user (root), while the other processes are
    the ordinary nobody user. Finally, note that the process ID (the second column)
    is perfectly sequential.


    This sequence is no coincidence. The first process, 2959 in this port case, is
    the true server; the others are merely helper processes. The first process sits
    on the TCP/IP port waiting for Web-browsing requests. As soon as a request comes
    in, it hands the responsibility for handling to its child processes. This does
    two things:'
