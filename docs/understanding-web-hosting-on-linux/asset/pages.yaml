  md: '# 66 CHAPTER 5


    cross-dialect, and man is. It is the elder statesman among documentation strategies,
    available on all UNIX-like systems, including Linux.


    View the manpage for man by issuing the following at a command prompt:


    man man


    You will be presented with the first screen of the manpage. Note that man is classified
    in section I (executable programs or shell commands). You can determine this by
    observing the numeral that appears between the parentheses after the name of the
    page. Paging through the manpage is done in the same manner as for in the less
    command: use the spacebar to page forward, the B key to page back, and the Q key
    to quit.


    # Info for Information


    As many of the manpages are, they do suffer from one serious inadequacy: they
    have no inherent navigation system. With many, you are forced to page through
    the screens sequentially or (at best) use the search facility. By now, everyone
    is used to hyperlink systems, where you can jump from one part of the documentation
    to another. The aforementioned programmers, having looked upon manpages and decided
    that they were better than text documents but could stand some improvement, created
    another document type: the info format.


    The info format distinguishes itself from the manpage by being broken down into
    pieces known as nodes, extending the functionality of man by including navigational
    capabilities. You can jump from one node to another, select nodes from a menu
    of nodes and, if the author was clever, take advantage of cross-references. Before
    you issue the command to get into the info tutorial, keep in mind that info software
    was written to a video display terminal, not a GUI. it might seem a bit primitive
    to a person used to GUIs. To a person used to a VDT, however, it is quite an improvement.
    That said, issue the following command and take the time to read through the tutorial:


    info info


    It will only take a few minutes of your time, but it will be well-spent.


    You might be wondering which document type has been used to document a particular
    piece of software. The decision between the two formats is up to you. Some purists
    prefer the man format and wouldn''t be caught dead writing anything else. Others
    like the info format and use it exclusively. So, how do you know whether to use
    info or man? Frankly, the authors of info considered this issue and took the path
    of least resistance: If you issue the command man info and can''t find an info
    page, it assumes it must be a manpage and displays that instead. a manpage viewed
    through info won''t have the same navigational abilities as a true info page,
    but you can at least use a single tool to read both. The converse of this is not
    true. If you issue the command man foo and foo is an info page, you''ll get an
    error from man that says “No man page for.


    # Gnome Help Browser


    We admit that you might be overwhelmed by man and info for documentation. After
    all, both of the programs are older than many of the readers of this book. If
    you have never used a computer system that'
