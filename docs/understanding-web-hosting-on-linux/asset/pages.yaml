- pgno: 130
  md: '# 8


    # RDB, SQL, and JDBC


    Relational databases (RDBs) are the predominant storage mechanism for business
    information. In this chapter, you learn what an RDB is, how to create and maintain
    an RDB using Structured Query Language (SQL) commands, and how to automate SQL
    in Java applications with Java Database Connectivity (JDBC).


    You are probably already comfortable with the concept of a database, but you might
    be unfamiliar with the concept of a relational database. Basically, a relational
    database is a set of files that can be connected to form an additional, virtual
    file. Each database file contains fields that describe the attributes of a specific
    business entity. Files are populated with records that store information specific
    to real-world instances of business entities. RDBs refer to files as tables, columns
    and as rows.


    Consider the accounts-receivable database shown in Table 8.1. Its invoice table
    stores information about money payable to a company, its invoice detail table
    stores information about line items associated with an invoice, and its customer
    table stores information about each customer.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Table 8.1: A Simple Accounts-Receivable Database with Invoice, Invoice Detail,
    and Customer Database Files


    | Invoice | CustNo | InvoiceDate | CloseDate |

    | --- | --- | --- | --- |

    | 1234 | 981 | 11/10/1999 | |

    | Invoice Detail | LineNo | Desc | Qty | Charge |

    | --- | --- | --- | --- | --- |

    | 1234 | 1 | Bolts | 2 | 1.98 |

    | 1234 | | Washers | 15 | 2.66 |

    | Customer | LastName | Street | City | ZipCode | State | PhoneNo |

    | --- | --- | --- | --- | --- | --- | --- |

    | 981 | Denoncourt | 5650 El Camino | Carlsbad | 99999 | CA | (800)477-5665 |


    Each table in a database has a key. A key is composed of one or more columns that
    uniquely describe the data contained in one row. That is, the key uniquely defines
    the row of a real-world entity. For instance, the key for the customer table in
    Table 8.1 is the customer number; the key for the invoice table is the invoice
    number; and the key for the invoice detail table is the combination of invoice
    number and line number. These are known as *primary keys*, and they are used to
    retrieve specific


    In addition to primary keys, a table may also have one or more *foreign keys*.
    A column that is a key in one table matches the key in another. For instance,
    the customer number that matches the table''s primary key. Foreign keys store
    a table''s relationship with another table—the “relational” database. For example,
    in Table 8.1, the value of customer 981 from the invoice''s row is a foreign key
    that associates customer “Denoncourt” from Carlsbad, California. Proper maintenance
    of a database requires that the values for foreign keys correspond to the primary
    key in the related table. The RDB term for this requirement is *referential integrity*.


    The foreign key relationships allow you to join related tables to form virtual
    tables. For instance, selected columns from the customer, invoice, and invoice
    detail tables can be joined to form the virtual table shown in Table 8.2: note
    the redundant information in Table 8.2: the customer number, state, and date columns
    are duplicated. However, however, Table 8.2 is a virtual table; it doesn''t exist
    on a persistent storage device (disk). The information in the table was obtained
    by joining the records from the customer, invoice, and invoice detail tables based
    on their foreign key and primary-key relationships.


    A major benefit of RDBS is that you control redundant information. The information
    related to a customer is stored in one row. The information about an invoice is
    stored in another row. If relating to one business entity were duplicated in the
    rows of various tables, the integrity of information would be difficult to maintain.


    # Table 8.2: A Virtual Formed By Joining Files Using Their Key Relationships


    | Invoice | CustNo | LastName | State | LineNo | Desc | Qty | InvoiceDate |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | 1234 | 981 | Denoncourt | CA | 1 | Bolts | 2 | 11/10/1999 |

    | 1234 | 981 | Denoncourt | CA | 2 | Washers | 15 | 11/10/1999 |'
