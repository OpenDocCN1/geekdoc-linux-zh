    Red Hat distribution comes from; Red Hat''s retail package doesn''t have a fancy
    holographic seal or product ID you need to know in. Regardless of your software''s
    pedigree, you can purchase a support agreement from Red Hat that suits your needs.
    That availability of support, along with the warm embrace of companies like IBM,
    has legitimized Linux in corporate circles.


    So, how do you choose a distribution?


    +   * Pick one that supports the hardware on which you''re going to load it.

    * Pick one that includes applications you''ll want or need to use.

    * If you''re going to use it in a corporate environment, pick one that is mainstream,
    with ongoing development. Obscure or special-purpose distributions are inappropriate
    for the business world.


    For the purposes of this book, we choose Red Hat Linux.


    # Chapter Summary


    The entity known as the “Linux operating system” is, in fact, comprised of the
    Linux kernel and system software from the Free Software Foundation. So, the proper
    name for Linux is GNU/Linux.


    A distribution is made up of the kernel, system software, application software,
    and installation/configuration tools, bundled together in a particular way to
    satisfy specific requirements defined by the distribution''s author. A distribution
    should be selected according to how closely it supports'
