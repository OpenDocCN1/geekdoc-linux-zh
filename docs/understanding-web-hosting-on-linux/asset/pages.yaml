  md: '# The Apache Web Server


    The Native Americans known as the Apaches once freely roamed the southwestern
    United States. Their was a society in which everyone had a voice in the direction
    of the tribe. Apaches lived efficiently off the land that they believed was not
    to be owned, but was there to be used by everyone. The spirit of the Apache is
    alive and well today. It flourishes in cyberspace, where over half of all Web
    sites are hosted by Apache HTTP servers. Like the land inhabited by the Apaches,
    the Apache HTTP server is not owned by anyone. Companies and individuals have
    free access not only to the server itself, but also to its source code.


    The Apache HTTP server is available for free download from www.apache.org. The
    extension to the domain name identifies the site as a nonprofit organization.
    The Apache HTTP server merely whereas, then, as Microsoft likes to suggest? No.
    It is a viable and robust Web server for both large and small Web sites. IBM''s
    WebSphere application server, for instance, is designed as a plugin for the Apache
    HTTP server on all platforms.


    To understand a little more about the Apache HTTP server, you need to look at
    its history. Until 1995, only a few Web servers were available, and the number-one
    Web server was the National Center for Computing Applications (NCSA) HTTP server.
    However, by early 1995, the NCSA project began to stall. Not wanting the project
    to collapse, its users informally created a group that freely distributed code
    patches to the original server. The spirit of a new HTTP server began to evolve
    from what wanted to "a patch here and there a patch," and the Apache ("a patchy")
    HTTP server was born. Its creators were a collection of serious computer scientists
    who wanted an HTTP server that was powerful enough to meet their expanding requirements.
    These programmers formed a nonprofit organization called the Apache Group, and
    in April 1995, the first version of the Apache HTTP server became available to
    the general public. By the end of 1996, Apache was the leading Web server in an
    increasingly competitive market.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 136 · CHAPTER 9


    You might be wondering why any individuals or organizations would devote their
    time and talents to improving a Web server without the promise of a return on
    their investment. First, you must understand that there is a return: an improved
    Web server. Second, organizations that extend the Apache HTTP server to pay back
    the Apache organization by sharing their improvements with them. Third, there
    are bored developers who want to make a contribution to cyberspace and choose
    to do so by enhancing the most popular Web server in the world. (It looks pretty
    good on a résumé, too)


    # Patches


    The thought of "a patch here and a patch there" conjures up a pair of old jeans
    with haphazard patches on areas that weren''t designed properly. Forget the term
    patch whens to HTTP requests. |

    | mod_asis | Sends a message as it is, without HTTP headers. |

    | mod_actions | Specifies CGI scripts as handlers for particular file types. |

    | mod_spelling | Corrects URL parsing based on file and directory names in the
    server system. |

    | mod_user | Selects resources by user name and a common prefix. |

    | mod_alias | Maps one part of a file system to another. |

    | mod_rewrite | Rewrites URLs using specified rules. |

    | mod_access | Huns a CGI script based on MIME type or HTTP request method. |

    | mod_auth | Provides authentication against text-based password files. |

    | mod_auth_anon | Allows anonymous access to authenticated areas. |

    | mod_auth_db | Provides HTTP authentication against a database. |

    | mod_expires | Handles responses with expired HTTP headers. |

    | mod_headers | Manipulates response headers. |

    | mod_so | Loads modules at runtime. |

    | mod_setenvif | Sets environment variables based on header fields in the request.
    |


    To use a module, you must specify the AddModule directive in a configuration file,
    qualifying the name of the module services you want to enable with your Apache
    server. Pretty clean. The base server is very small and fast, but easily extensible
    with standard modules to support such advanced features as'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# The Apache Web Server • 137


    servlets, Perl, FastCGI (a.k.a. persistent CGI), HTTP cookies, server-side includes,
    and Secured Sockets Layer.


    The parade of modules doesn''t stop there, however. The Apache HTTP server was
    designed to take full advantage of the power of modular programming, which resulted
    in an easily extensible and customizable server. Anyone can extend the Apache
    HTTP server by creating a custom Apache module.


    Sometimes, after a particular custom module becomes heavily used and well regarded,
    the Apache Group will add it to the core set of modules included in the Apache
    download. Many frequently used and recommended third-party modules are freely
    available from http://modules.apache.org.


    # The Apache Code


    The add-on Apache modules can be statically or dynamically bound to the HTTP server
    program. As mentioned, you dynamically bind an Apache module by specifying the
    AddModule directive and the module name in a configuration file. For speed, you
    can statically bind Apache modules to the Apache HTTP server by recompiling the
    server program. The server program is called httpd (which stands for “Hypertext
    Transfer Protocol Daemon”). You can think of httpd as a demon that hides in the
    background, waiting for requests from people trying to gain Web-based access to
    your host via TCP/IP and HTTP. The Apache HTTP server is delivered with the binary
    executable httpd program, the complete C source code for httpd, and the C code
    for all of the standard Apache module extensions.


    # Apache Startup


    The Apache Web server can be started by invoking the httpd command from a terminal
    session, but most distributions have a startup script that simplifies Apache.
    Red Hat’s script is also called httpd, and it exists in the /etc/rc.init.d/ directory.
    If you attempt to invoke the script without any options, you’ll receive the following
    message:


    ```

    $ /etc/rc.init.d/httpd

    Usage: httpd [start|stop|restart|reload|condstart|status]

    ```


    This helpful message tells you the arguments required by the httpd script. The
    status option will tell you whether or not Apache is active, and the other options
    are obvious.


    When Apache is started, it looks for the httpd.conf file in /etc/httpd/conf. You
    might be a little overwhelmed the first time you look at that httpd.conf, so we’ve
    supplied a minimal version in Figure 9.1 Apache expects a particular directory
    structure:


    +   - A directory for the httpd.conf file

    - A directory called htmldocs to hold the hypertext documents Apache is to serve

    - A directory called logs to hold various pieces of information that Apache can
    be configured to log'
  merge: -1
  img_proc: true
