    # Standard Linux Directories


    As you move around your Linux system, you begin to see a rather complex directory
    structure. Table 4.3 describes what is contained in the more important Linux directories.
    Perhaps the most important directory is the /home directory because the user-specific
    directories exist under it. When a user is added to the system, a directory is
    automatically created under /home that has the same name as the user. When you
    log in, your current directory is automatically set to your home directory. As
    you accumulate personal files, they should be placed under home directory. For
    more granular control of your projects, it''s a good idea to create directories
    under your home directory to organize your files.


    Another important directory is /opt. This is where you should place additional
    applications, such as JDKs, Sun''s StarOffice, and IBM''s WebSphere. Some experts
    argue that you should place such applications under /usr/local. It''s a matter
    of taste, but we feel that, since /opt stands for "optional," is where optional
    applications should go. It is perhaps more important to be consistent about where
    you put your applications whether they go in /opt or /usr/local. Pick one and
    stick with it.'
