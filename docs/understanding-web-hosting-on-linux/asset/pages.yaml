  md: '# Linux Configuration and Startup · 47


    To start up Linux on an iSeries machine, you load the kernel into the partition,
    initialize it, and link to the root file system. You do this with OS/400''s Create
    Network Server Description command (CRTNWSD).


    # Initialization


    After device drivers are installed by the boot process, the init program (located
    under the /sbin directory in Red Hat) is executed. This program starts or stops
    various Linux applications during system startup or shutdown. The processing completed
    by the init program is controlled by a special file called initabb, see Figure
    4.2 (located under the /etc directory in Red Hat). Like lioconf, the Red Hat initialization
    will configure initabb for you, but it is still a good idea to understand how
    it drives the processing of the init program.


    | initabb | This file describes how the INIT process should set up the system
    in a certain run-level |

    | Author: Miguel van Soerenburg, -miquels@drinkel.net | Modified for RH Linux
    by Marc Ewing and Donna Barnes |


    +   # Default runlevel; the runlevels used by RHS are:

    - 0 halt (DO NOT set initdefault to this)

    - 1 Single user mode

    - 2 Multiserver, without NFS (The same as 3, if you do not have networking)

    - 4 unused

    - 5 X1

    - 6 reboot (DO NOT set initdefault to this)


    ```

    # 3:initdefault:

    # System initialization.

    sis::sysinit/etc/rc.d/rc.sysinit


    10:0:wait/etc/rc.d/rc 0

    11:1:wait/etc/rc.d/rc 1

    12:2:wait/etc/rc.d/rc 2

    13:3:wait/etc/rc.d/rc 3

    14:4:wait/etc/rc.d/rc 4

    15:5:wait/etc/rc.d/rc 5

    16:6:wait/etc/rc.d/rc 6

    ```


    +   # Things to run in every runlevel.

    once:/sbin/bin/update

    # Trap CTRL-ALT-DELETE

    ca:ctrapdel:/sbin/shutdown -t3 -r now

    # When our UPS tells us power failed, assume we have a few minutes

    # of power left. Schedule a shutdown for 2 minutes from now.

    # This does, of course, assume you have power installed and

    # UPS connected and working correctly


    Figure 4.2: The initabb file controls the initialization sequence of Red Hat Linux
    (part 1 of 2).'
