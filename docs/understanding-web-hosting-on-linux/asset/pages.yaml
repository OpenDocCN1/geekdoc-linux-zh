    The initab file follows a format that is initially very difficult to understand.
    Each line conforms to the following:


    ```

    code:runlevel:action:command

    ```


    The code is a unique one- or two-character sequence that identifies the specific
    entry in the initab file. The runlevel indicates that runlevel 0 executes the
    processes required to do a hard halt, runlevel 3 executes processes required to
    enable a Linux multiuser mode, and runlevel 6 qualifies reboot processes to run.
    The initab file has one line that identifies the default runlevel. In Figure 4.2,
    runlevel 3 is to be used unless otherwise qualified with the execution of the
    init program, as during the boot process.


    You can manually run the init program by invoking it with the runlevel as a parameter.
    For instance, to shut down your system, you could use the following command as
    the root user:


    ```

    init 6

    ```


    The si:sysinit/etc/rc.rc.sysinit entry that follows the default runlevel enters
    a script called rc.sysinit to execute. This script does such checking and monitoring
    file systems, enabling memory for disk swapping, and synchronizing the Linux system
    clock with the platform''s hardware clock. Following the execution of the rc.sysinit
    script, a script called rc is executed with a parameter that qualifies the runlevel.


    On Red Hat, the rc executes scripts that exist in directories qualified, by the
    runlevel. When the init program runs with runlevel 3, the initab file calls the
    rc script to turn around and runs the scripts located in a directory called /etc/rc.d/rc3.d.
    Red Hat''s rc.3 script executes all scripts that are prefixed with a K before
    it executes the ones that are prefixed with an S. The K scripts kill, stop down,
    processes that might already be executing, and the S scripts start processes.
    The two digits following the K or S control the execution order of scripts.


    On Red Hat, the various runlevels start or stop the same processes, the common
    scripts are in a directory called /etc/rc.d/init.d, while symbolic links to those
    scripts are in the various rc.X directories. To give you an example of how this
