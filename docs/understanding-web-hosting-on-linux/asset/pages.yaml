  md: '# 7


    # Server-side Java


    Java is a programming introduced by Sun Microsystems in 1996. It was originally
    used for creating the native mode of browser-based applications known as applets.
    Users, however, quickly tired of the slow download times associated with Java
    applets. In 1998, Sun introduced the servlet specification. Today, the predominant
    use for Java is in server-side applications.


    Java has become the ubiquitous language of network computing for many reasons.
    Here are a few of the more important ones:


    +   Object orientation—Java is an OO (object-oriented) language that improves
    reliability and reusability of code. Many computer languages today are OO, C++
    and SmallTalk. Even legacy languages like COBOL are evolving into OO-capable languages.
    One of the benefits of Java is that it designed from the beginning as an object-oriented
    language, so it strongly enforces OO rules.


    +   Small executables—Java generates very small executables, which means it is
    well-suited to an environment where application code needs to be downloaded from
    the server to a client machine.


    +   Security—Java programs execute within the Java virtual machine (JVM) instead
    of the native mode of the client operating system. Therefore, Java cannot corrupt
    memory outside its process space. For example, a Java program that runs in a Web
    browser cannot access anything that the client machine doesn''t grant it to. This
    kind of Java program (an applet) can''t even perform I/O.


    +   Machine-independence—Since Java code runs through a JVM, and JVMs are available
    on most computers (through browsers or natively through the operating system),
    you write your Java code once, for all platforms.


    +   Simplicity—Similar to C++, Java is simpler. Many of the complexities of C++
    have been removed. For example, in Java, you don''t need to be concerned about
    memory allocation and'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 88 · CHAPTER 7


    deallocation, and you don''t have to work with pointers. While this allows for
    portability, the downside

    is that Java programs are interpreted, so they run more slowly than native executable
    code. A

    technique known as Just-in-Time compilation (JIT), however, can improve a Java
    program''s

    performance. When a Java program is received by a client computer, the JIT compiler
    converts it into

    a native program.


    # How Java Works


    When you compile a Java program, the compiler does not create an executable program
    for the particular

    architecture of the machine on you''re compiling. Instead, the Java compiler creates
    what is known as

    Java bytes code. These byte codes are instructions that a Java virtual machine
    understands and executes.

    JVMs become available in Netscape Navigator 2.0 and Microsoft Internet Explorer
    3.0. All major computer

    operating systems also offer JVMs.


    There are three types of Java programs:


    +   - Applets are programs written to run in a Web browser. Applets are actually
    launched from an HTML

    document through special embedded HTML statements.

    - Applications, unlike Java applets, do not run from a Web browser. Instead, they
    run on the computer

    like a native program. For example, the JVMs available for Linux allow you to
    run Java applications

    from a Linux command line.

    - Servlets run, not from a browser or from a command line, but from a Web application
    server, your

    IBM''s WebSphere or Apache''s Tomcat.


    To be able to compile a Java class, run a Java application, or run a Web server,
    your computer

    will need a JVM installed. JVMs for Linux are available for free from Sun (http://java.sun.com),

    BlackDown (www.blackdown.org), and IBM (www.ibm.com/developerworks/java). If your
    system does

    ot already have a JVM installed, the Sun download site has a Red Hat mirror, which
    provides the easiest

    installation. The download will be in binary format, with a name such as j2dsdk-1_3_1_01-

    inux-i386-rpm.bin. To install the JVM, simply execute the binary while logged-in
    as the root user:


    > /your download dir~/j2dsdk-1_3_01-linux-i386-rpm.bin


    We suggest modifying your JDK standard Once you install your Linux JVM,

    you will need to modify your /etc/profile file to add the JAVA_HOME environment
    variable and modify the

    PATH variable to point to the location of Java''s bin directory, for example:


    ```

    export JAVA_HOME=/opt/jdk1.3

    export PATH=$PATH:$JAVA_HOME/bin

    ```


    To test that your JVM is installed properly, restart Gnome (or KDE), open a terminal,
    and enter the

    following command:


    ```

    java -version

    ```


    The terminal should display the currently installed version number of the JVM
    qualified in your PATH

    environment variable.'
