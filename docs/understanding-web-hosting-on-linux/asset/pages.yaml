    Note that you might have to create the libexec directory. Also note that mod_jk-noaepi.so
    to simply mod_jk.so (There is an ansi version and a non-capi version of mod_jk.so
    available for download).


    Finally, include the entries required for Tomcat in the Apache configuration file
    by adding this line to the end of Apache''s /etc/httpd/conf/httpd.conf file:


    ```

    Include /opt/etc/httpd/conf/httpd.jakarta-tomcat/conf/mod_jk.conf-auto

    ```


    Apache is now ready to work with Tomcat, and you''re ready to test the installation.
