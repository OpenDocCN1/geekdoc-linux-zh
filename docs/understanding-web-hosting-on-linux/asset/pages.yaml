  md: '# 13


    # Shell Programming


    The last chapter introduced you to the power of UNIX shells. This chapter goes
    a step farther, by showing the power of shell scripts. There are two reasons why
    you need to understand how to program a shell script:


    +   - You might need to revise or enhance an existing shell script.

    - You might want to create your own script to relieve the tedium of keying the
    same set of commands over and over again.


    A good example of an existing shell script to enhance is Apache''s Tomcat startup
    script,tomcat.sh. Later in this chapter, you will review the startup script in
    detail. Right now, you will learn how to create your own shell scripts.


    One simple way of reducing the keystrokes necessary to execute a complex shell
    command is to create an alias, as discussed in chapter 12. However, aliases are
    limited because they cannot operate on parameters and they do not support conditional
    statements. A shell condition might be based on an input parameter or on some
    state of that machine (such as the existence of a file or directory).


    +   There are four special variables available to scripts:

    - $0 refers to the name of the shell script.

    - $1 through $9 refers to the value of parameters 1 to 9.

    - $@ returns the values of all arguments in a single string.

    - $$# gives the parameter count.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'For example, here is a script called say.sh (.sh being the default extension
    for shell scripts):


    ```

    $!/bin/sh

    echo "This shell script is called $0"

    echo "Parameter 1 is equal to $1"

    ```


    When executed from the command line and passed a single parameter, it produces
    the following output:


    ```

    $ sh say.sh hey

    This shell script is called ./say.sh

    Parameter 1 is equal to hey

    ```


    Comments in shell scripts start with the pound symbol (#). The first line of the
    say.sh script is a special comment line. The exclamation point followed by /bin/sh
    in this line identifies the that is to run the script. You could change it to
    /bin/bash (for the bash shell), but you''ll find that /bin/sh (for the original,
    Bourne, shell) is more standard because any UNIX system that might execute your
    script will be guaranteed to have the Bourne shell. If you don''t expect your
    script to run on other systems, you can omit the comment.


    # Command Execution


    To run the say.sh script, you pass it as a parameter to the sh command. (You could
    also use the bash command.) To be able to run say.sh from other script, or to
    otherwise work like other UNIX commands, you would have to put its path qualifier
    in your PATH environment variable (or copy it one of the directories in your path)
    and change its permissions to allow it to be executed:


    ```

    $ PATH=$PATH:pwd

    $ chmod +x say.sh

    ```


    Then, you could execute the say.sh command without the sh command processor:


    ```

    $ say.sh hey

    This shell script is called ./say.sh

    Parameter 1 is equal to hey

    ```


    Optionally, instead of modifying the path, you could use the dot operator to qualify
    that the script exists in the current directory:


    ```

    $ ./say.sh hey

    This shell script is called ./say.sh

    Parameter 1 is equal to hey

    ```


    One final way of executing a script is by sourcing the script. You source a script
    by using the source command followed by the name of the script. When you source
    a script, the current shell executes it line by line if you were entering each
    line manually into a terminal session. When you execute a script with the sh command,
    script runs as a subprocess, in its own shell:'
  merge: -1
  img_proc: true
