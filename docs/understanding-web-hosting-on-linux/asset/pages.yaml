    fi\necho \"This shell script is called $0\"\necho \"Parameter 1 is equal to $1\"\
    \n```\n\nThen, if you omitted a parameter to the say.sh script, you'd get the\
    \ following message:\n\n```\n$ ./say.sh hey\nUsage: say.sh <word>\n```\n\nThe\
    \ predicate used in this new version of say.sh uses the following scripting:\n\
    \n```\nif [ conditional ]; then\nfi\n```\n\nThe conditional, in this circumstance,\
    \ uses the -z operator to see if string $1 is zero. Table 13.1 shows several other\
    \ string-comparison operators that can be used in conditional expressions."
  merge: -1
