  md: '# Linux and the Internet • 165


    Although modern browsers can communicate with FTP, earlier computer users became
    familiar with the FTP client called, amazingly enough, ftp. You can get a taste
    of FTP by issuing the command ftp from a command line. At the ftp prompt, type
    a question mark and press Enter. You''ll be presented with a list of commands
    included in the File Transfer Protocol. If you don''t want to do that yourself,
    you can always look at Figure 11.3, where we''ve done the heavy lifting for you.


    ```

    ftp ?

