  img_proc: true
- pgno: 190
  md: '# History Repeats Itself


    Another useful feature of bash is its ability to retrieve, edit, and re-execute
    previously entered commands. By simply pressing the Up arrow key, you retrieve
    the last command executed. If you keep pressing the Up arrow, bash will continue
    to retrieve the commands executed. If you are looking for commands past the terminal
    screen, use the Down arrow to go in reverse direction. Once you''ve retrieved
    the command you want, you can edit it with the help of the Home, End, Delete,
    Backspace, and arrow keys, and press enter to execute the modified command.


    If you type two exclamation points, bash will retrieve and immediately execute
    the previously entered command. If you type one exclamation point followed by
    a number n, bash will retrieve and execute the command entered n times again.
    Perhaps the coolest feature of bash history, though, is the search-and-execution
    flow. If you type an execution point followed by a string, bash will scan history
    for the command that contained that string, and then execute it. Suppose you would
    like to use the `date` command to set your system date to equal that of an Internet
    time server. Instead of trying to remember the URL for the time server, you simply
    type the following:


    +   - !?date


    Bash pulls from history and executes something like this:


    ```

    rdate -s tock.usno.navy.mil

    ```


    To delve a little deeper into the mechanics of bash history, consider the results
    of the following command:


    ```

    $ set | grep HIST

    HISTFILE=/home/donat/.bash_history

    HISTSIZE=1000

    HISTSIZE=1000

    ```


    The **set** command is discussed later in this chapter, but from the list, you
    can see that the user''s personal history file is `/home/donat/.bash_history`.
    The history file is simply a text file, so you can open it with your favorite
    text editor or use `less` to display its contents:


    ```

    $ less /home/donat/.bash_history

    ```


    The history file will become especially handy when you start to create bash scripts
    to automate the execution of a series of bash commands under a single, home-grown,
    custom Linux command, as covered in the next chapter.


    # I/O Redirection and Piping


    Enough of the history lesson. It''s time to move on to another bash power feature:
    input/output redirection and piping. In a few commands already shown in this chapter,
    you''ve seen the pipe operator (|) used. Let''s review these commands:'
  merge: -1
  img_proc: true
- pgno: 191
  md: '```

    $ cat /etc/passwd | grep username: cut -d : -f 7

    $ ls | less

    $ set | grep HIST

    ```


    The simplest of these three commands is ls. When you execute this command, the
    | operator tells bash to

    p the output from ls into the less command. You already know that less shows the
    contents of a file

    p at a time. The file, in this case, is a virtual one created from the output
    of the ls command.


    # stdin, stdout, and stderr Files


    In UNIX, all programs have three standard files: stdin, stdout, and stderr. Unless
    qualified, all the files

    standard output file (stdout) is your terminal session. When you run the ls command
    by itself, the | operator tells bash to pipe standard

    out of is to the standard input of less. The less command, when it doesn''t have
    a file name as

    argument, displays the data from stdin.


    The other commands that used the pipe operator, cat and set, work similarly. The
    set command lists all

    the environment variables currently set on your system. (You''ll find out about
    environment variables later

    in this chapter.) The standard output of set, in this case, is piped to the grep
    command. The grep command

    is a simple utility that scans for strings. The argument to grep in this example
    is HIST, so the set command

    pipes the entire list of environment variables (about two dozen) to grep, which
    then lists to its standard

    output all the environment variables with the string HIST in them. Note that the
    standard output for grep, in

    this case, was not piped, so it simply went to the terminal session. Alternatively,
    grep''s standard output

    had been piped to the less command:


    ```

    $ set | grep HIST | less

    ```


    The cat command in the example also piped to grep, the standard output of which
    was piped to a powerful

    command called cut. We''ll leave it up to you to research cut but, to summarize,
    it removes elementaneous

    sections of a text line, resulting in standard output that contains only meaningful
    pieces of data. In this case,

    the line was an entry from the password file and all piece of information we are
    interested in (with pieces

    determined by the colon separator) is the seventh—the user''s default shell.


    # Redirection


    Whereas the pipe operator allows you to force the standard output from one command
    to the standard

    input of another command, the redirection operators in Table 12.1 allow you to
    force standard output and

    errors to a particular file.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Table 12.1: Input/Output Redirectors


    | Redirector | Function |

    |---|---|

    | >file | Redirects standard output to the specified file. |

    | 2>file | Redirects standard error to the specified file. |

    | >>file | Redirects standard output to the specified file, appending existing
    data. |

    | 2>> | Redirects standard error to the specified file, appending existing data.
    |

    | &file | Redirects both standard output and standard error to the specified file.
    |

    | <file | Redirects standard input to the specified file. |

    | <<text | Redirects standard input until a line matching is found. |

    | cmd1 | cmd2 | Uses the standard output of cmd1 as input to cmd2. |


    The following command will please a verbose list of the files in our home directory
    into a file called listome.txt.


    ```

    $ ls -1 /home/donat > listome.txt

    ```


    If the file did not exist before the execution of the command, it would have been
    created; if it already existed, its contents would have been overwritten. To append
    to a file, you can use the double less-than redirection operator: >>.


    Suppose you want to add to listome.txt the files that exist in a subdirectory
    called java. You would use the following command:


    ```

    $ ls -1 /home/donat/java >> listome.txt

    ```


    However, the list doesn''t differentiate the files in your home directory and
    the subdirectory of Java. To handle that, use the cat command to add a subdirectory
    header line to listome.txt. The cat command normally takes input from a file name
    argument, but if no file name is qualified, cat will use the standard input of
    the screen. The cat command''s standard output, unless redirected, also lists
    to the scren.


    To add that subdirectory header line with cat, use the following command, and
    after the text entry, press Ctrl-D:


    ```

    $ cat >> listome.txt

    The java subdirectory contents:^

    ```


    Note that ^D is not added to the file; it represents the Ctrl-D keystroke combination
    that forces standard input to the cat command to close. Obviously, you have to
    re-execute all three commands in the proper sequence so that the subdirectory
    header precedes the output in the listome.txt file.


    # UNIX Filters


    The most frequent use of redirection is for standard output. However, there will
    be occasions when you want to redirect standard input, especially when using UNIX
    filters. Filters are utility programs that are used as command blocks; each one
    performs a specific type of filtering on standard input. Table 12.2 shows a few
    of the more common UNIX filters.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Table 12.2: UNIX Filters


    | Utility | Purpose |

    | --- | --- |

    | cat | Copy stdin to stdout. |

    | grep | Search for strings in stdin. |

    | sort | Sort lines in input. |

    | cut | Extract columns from input. |

    | sed | Perform editing operations on input. |


    Each of the filters in Table 12.2 defaults to the terminal screen as **stdin**,
    **stdout**, and **stderr**. For instance, if you enter the **sort** command with
    no arguments, it will accept input from the terminal. The sort utility will then,
    after you close terminal input with Ctrl-D, sort the entries and list them to
    **stdout** (the screen). The following example shows what happens if you enter
    **sort**, then four lines that contain the numerals 4, 3, 2, and 1, and finish
    by pressing Ctrl-D:


    ```

    $ sort

    4

    3

    2

    1

    A

    1

    2

    3

    4

    ```


    The sort utility, by itself, is not all useful. When you redirect or pipe standard
    input or output to it, however, it becomes very useful. For instance, you could
    quickly sort the entries in a password file as follows:


    ```

    $ sort < /etc/passwd

    ```


    If your reason for sorting the password file was to find a specific user, **grep**
    would even be better:


    ```

    $ grep username < /etc/passwd

    ```


    The output from this command contains the complete line from the password file.
    If you want one section of a line, such as the section that contains the user''s
    default shell, you''d use the **cut** utility. For instance, at the beginning
    of this chapter, you saw the following command:


    ```

    $ cat /etc/passwd | grep Username:| cut -d : -f 7

    ```


    This uses **cat** to pipe the contents of /etc/passwd to **grep**. The **grep**
    utility finds the lines containing the specified user name, and pipes it to **cut**.
    The **cut** utility then extracts the seventh field, as determined by colon separators,
    and lists it to standard output, the screen. Although this process seems complicated,
    it illustrates how filters can be combined to create useful and powerful utilities—in
    a single bash statement.


    To understand how the combination of these three UNIX filters work, let''s break
    the previous command into two statements:'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Using the Bash Shell 179


    ```

    $ grep Username: < /etc/passwd > temp.txt

    $ cut -d -f 7 < temp.txt

    ```


    The grep utility''s stdin is redirected to the password file, and its stdout is
    redirected to a file called temp.txt. Then, cut reads from the file, which contains
    a single line, extracts the seventh field of that line, and lists it to standard
    output. Whereas this version uses temporary files to store the results of a UNIX
    filter, the one-line command bypassed the need for creating a physical file on
    disk by piping stdout from one utility right into stdin.


    When you use redirection and pipes with ease from the bash shell, you will be
    a power Linux user.


    # Variables


    At the beginning of this chapter, you saw a much easier way of listing the default
    shell for a user than with a combination of cat, grep, and cut.


    ```

    $ echo SHELL

    ```


    The word SHELL is a variable. Variables are simply symbols that represent pieces
    of information, just like in algebra, where changing the value of X changes the
    results of an equation. The value of a shell variable can be set and later retrieved.
    The variable called SHELL is a symbol that contains the default shell for a user.
    You retrieve and use the values of variables in bash commands. The echo command
    writes to standard output the value of the string passed to it. In the example
    above, the value of the string is stored in the contents of a variable. The dollar
    sign tells bash that the string, SHELL, is not a literal string, but instead a
    symbol to a string, bash knows to get the value of that variable.


    > Note: You can list all currently existing variables with the set command.


    You can create variables by using the simple syntax name=value. For instance,
    if you wanted to create a variable called LASTNAME, set its value to Denoncourt,
    and list that variable''s value, you''d use the following commands:


    ```

    $ LASTNAME=Denoncourt

    $ echo $LASTNAME

    ```


    > Note: It is a standard to name variables using all uppercase characters.


    You can create many variables as you like, but Linux ships with many variables
    already created. There is one standard variable that you should know about: PATH.
    We''ve already mentioned that Linux has thousands of commands (programs) in various
    directories on your system. How does bash find those programs so it can execute
    them? Through the PATH variable, which contains a semicolon-separated list of
    directories that bash uses to search for programs. If you issue a command from
    bash that doesn''t exist in any of the directories in the PATH variable, you get
    a "command not found" error.


    Consider a new Linux user called donut. If you listed the user''s PATH, you would
    get something like the following:'
  merge: -1
  img_proc: true
