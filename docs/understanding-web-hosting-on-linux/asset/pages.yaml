- pgno: 104
  md: '# Java Statements


    A Java statement can be a comment, a declaration, a control statement, or a block.
    Most Java statements end with a semicolon.


    # Comments


    Comment statements do not end with a semicolon. There are two types of comments.
    The first type starts with two slashes (//), and the comment continues to the
    end of the statement. This type of comment is usually just one line long. For
    example, the first line of the following is a comment:


    ```

    // add 1 to integer variable x

    int x = 0;

    x = x + 1;

    ```


    This type of comment can also be added to an executable Java statement (which
    ends with a semicolon).


    ```

    x = x + 1; // add 1 to integer variable x

    ```


    Use the second type of comment for multiple lines or blocks of comments. The comment
    starts with the /* characters and continues until the /* characters are encountered.
    This type makes it much easier to deal with blocks of statements:


    ```

    /* This is a block of comment statements that continues line

    after line

    until here */

    ```


    # Declaration Statements


    Declaration statements, as the name implies, declare something, such as a variable
    or a class. For example, the following declaration statement declares integer
    x and initializes it to the value of one.


    ```

    int x = 1;

    ```


    To add one to variable x and assign the value to x, you would use this statement:


    ```

    x = x + 1;

    ```


    As in RPG, variables in Java can be defined on the fly; they don''t have to be
    defined at the beginning of the program. In the following example, the statement
    performs an assignment to variable x and defines it at the same time:


    ```

    int x = x + 1;

    ```'
