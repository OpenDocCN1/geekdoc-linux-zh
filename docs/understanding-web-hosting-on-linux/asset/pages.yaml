    # # Editing Text Files


    So far, this chapter has introduced two configuration files: filo.conf and inittab.
    Both of these are simple text files that can be edited with any one of the variety
    of text editors with Linux. All Linux configuration settings are done with text
    files, so it''s time to learn how to use several of the editors: vi, pico, and
    gedit.


    # ## vi Editor


    The facto editor of UNIX is vi ("visual interface”). Although it is not the easiest
    editor to use, you need to become comfortable with its basics because every UNIX
    or Linux system you might ever touch will have it. Also, many other Linux utilities
    adopt vi features. For instance, man and less support its powerful searching capabilities.


    To start it, enter the vi command by the name of the file you want to edit. If
    the file doesn''t exist, vi will create it for you. For example, the following
    creates a file called vi-test in the user''s home directory:


    ```

    $ vi vi-test

    ```


    Figure 4.3 shows the resulting screen in a terminal session window. You try to
    enter text at this point, however, you''ll find that nothing happens. That''s
    because vi works in three modes: input mode, command mode, and ex mode. The vi
    editor opens in command mode, which allows you to enter a number of mostly single-letter
    commands. For example, i (in lowercase) changes the mode from command to input.'
