    \ The first works well with\n# Java Platform 1 based runtimes. The second works\
    \ well with\n# Java2 Platform based runtimes.\n\n# -jcp runner.jar:servlet.jar:classes\
    \ org.apache.shell.Startup $\n# java -jcp runner.jar:servlet.jar:classes org.apache.shell.Startup\
    \ $\n\\nif [ -f ${HOME}/tomcat ]; then\n    ${HOME}/tomcat\nfi\n\nif [ \"${TOMCAT_HOME}\"\
    \ = \"\"\" ]; then\n    # resolve links\n    # $0 may be a link to home\n    PRG=$0\n\
    \    progname=$(basename $0)\n\nwhile [ -h \"$PRG\" ]; do\n    link=$(ls -ld \"\
    $PRG\" | awk '{print $9}' | sed 's/.*\\///')\n    if echo \"$link\" | grep -q\
    \ /dev/null; then\n        PRG=\"$link\"\n    else\n        PRG=\"$(dirname \"\
    $PRG\")/$link\"\n    fi\ndone\n\nTCAT_HOME_1=$(dirname \"$PRG\")\necho \"Guessing\
    \ Tomcat_HOME from tomcat.sh to \\${TOMCAT_HOME_1}\"\nif [ -d \\${TOMCAT_HOME_1}/conf\
    \ ] ]; then\n    TOMCAT_HOME=\\${TOMCAT_HOME_1}\n    echo \"Setting Tomcat_HOME\
    \ to \\${TOMCAT_HOME}\"\nfi\n\nif [ \"${TOMCAT_HOME}\" = \"\"\" ]; then\n    #\
    \ try to find tomcat\n    if [ -d \\${HOME}/opt/tomcat/conf ] ]; then\n      \
    \  TOMCAT_HOME=\\${HOME}/opt/tomcat\n        echo \"Defaulting TOMCAT_HOME to\
    \ \\${TOMCAT_HOME}\"\n    fi\nfi\n\nif [ -d /opt/tomcat/conf ] ]; then\n    TOMCAT_HOME=-/opt/tomcat\n\
    \    echo \"Defaulting TOMCAT_HOME to \\${TOMCAT_HOME}\"\nfi\n\n# Add other \"\
    standard\" locations for tomcat\n\nif [ \"${TOMCAT_HOME}\" = \"\"\" ]; then\n\
    \    echo TOMCAT_HOME not set, you need to set it or install it in a standard\
    \ location\n```\n\nFigure 13.4: Apache's Tomcat script uses many of the features\
    \ of shell script programming (part 1 of 4)."
