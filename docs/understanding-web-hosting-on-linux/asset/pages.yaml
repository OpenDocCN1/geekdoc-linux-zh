    \ 2).\n\nThe JDBCBasics servlet's init method starts by loading the JDBC driver:\n\
    \n```\nClass.forName(\"com.ibm.as400.access.JDBCDriver\");\n```\n\nNote that this\
    \ code refers to a specific vendor's implementation of a JDBC driver. When you\
    \ register the JDBC driver, you have to refer to an explicit one. This particular\
    \ servlet uses a database for AS/400. If you wanted to switch your relational\
    \ database, you would have to change this line to specify a JDBC driver that works\
    \ with the new RDB. Also note that the driver name is a string, which means that\
    \ it can be (and normally) softcoded (Softcoding refers to the technique of putting\
    \ site-specific information in a text file that is retrieved at runtime by the\
    \ application).\n\nThe next step, after registering the driver, involves setting\
    \ up a connection to the RDB's host. To do this, you specify a URL with the protocol\
    \ of jdbc and a subprotocol of as400 (for the AS/400), followed by the IP address\
    \ or domain name of your AS/400 and the user profile and password:\n\n```\nConnection\
    \ con = DriverManager.getConnection(\n  \"jdbc:as400://my400Domain\", \"Profile\"\
    , \"Password\");\n```\n\nSetting the protocol to jdbc is similar to setting the\
    \ protocol to http when you run the server. There is, as, no subprotocol for the\
    \ Hypertext Transfer Protocol (HTTP). The JDBC driver, however, requires a subprotocol.\
    \ AS/400's JDBC requires a subprotocol of as400. IBM's DB2 driver for the Linux\
    \ driver requires a subprotocol of db2. The JDBC driver for PostgreSQL, the open-source\
    \ relational database, requires a subprotocol of postgresql. Note that if you\
    \ softcode your JDBC driver name, you should also softcode the subprotocol."
