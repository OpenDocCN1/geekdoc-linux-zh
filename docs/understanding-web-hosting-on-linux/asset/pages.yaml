  md: 'security-related messages are stored. Of particular importance are indicating
    that the system rejected the user ID or password multiple times, since this could
    indicate someone was trying to break into your system, albeit via a cruder route,
    brute-force method.


    For the most part, facility monitoring is comprised mainly of knowing such things
    as the amount of disk space used in your system, how many users are on the system
    at one time, and what normal log messages look like. The next step is watching
    the logs for changes to the norm. For this task, Webmin is probably the easiest
    solution.


    # Routine Maintenance


    One of the great things about the current crop of Linux distributions is that
    much of the tedium that of a system administrator''s job has been automated. For
    example, we indicated earlier that quite a bit of information is logged to disk.
    That simply space continues to eat up as the system runs. Left to their own devices,
    the logging daemons would eventually eat every available byte. The obvious solution
    to the problem is to occasionally archive the current log files and re-create
    them, thereby freeing up the space used.


    This job used to be done manually whenever it appeared that drive space was becoming
    precarious in short supply. Now, the logrotate command takes care of it. If you
    are interested, display the contents of the /etc/logrotate.d/ directory to see
    a list of logging daemons by logrotate. You''d need to remember this command,
    if it weren''t for the cron daemon.


    In your Webmin window, click the System tab, then click Scheduled Cron for a list
    of what gets rotated. Continuing with the logrotate task, click the /etc/cron.daily/logrotate
    link, and you''ll find out every day at a specific minute and hour (which, on
    our system, is 4:02 A.M.), the logs are rotated. If you examine the /var/log/
    directory, you''ll note that the archived logs are numbered, the newest starting
    with .1 going up from there. Depending on the setting in the /etc/logrotate.d
    directory, the number of archived logs can vary. But some are kept for four generations,
    but some are kept even longer.


    # Backing Up


    Even though housekeeping is configured and maintained for you, the one that can''t
    be automated is backup. Responsibility falls squarely on your shoulders. There
    are a number of different viewpoints on backup. To fully understand them requires
    a book on system administration, but to cut to the chase, there are basic things
    you need to consider when planning your backup strategy.


    We use the following guidelines:


    +   - Only back up those directories you can''t restore from the installation
    CDs. You already have a backup of your operating system on your distribution CD-ROMs,
    so don''t feel need to do a complete backup of your system.

    - Since most configuration information is kept in /etc, it would make sense to
    include this directory in a backup.

    - Obviously, you''ll want a backup of your Web server''s root directory, for a
    standard Apache installation on Red Linux is /var/www. If you choose to back up
    this entire directory, you''ll not only get the Web pages, but also any CGI programs
    in /var/www/cgi-bin.'
