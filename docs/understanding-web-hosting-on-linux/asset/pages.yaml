- pgno: 78
  md: '# Documentation


    Nowhere does the axiom "knowledge is power" apply better than in the Linux world,
    since the full power of the operating system is unleashed only to those with the
    knowledge to use it. The trouble is, the information you need to unlock this power
    is found in a hodge-podge of places and formats, a reminder that Linux is the
    result of a decade of development by many different people. Not only that, but
    Linux inherits vagaries from 25 years of UNIX and its variations. The biggest
    hurdle to mastering Linux, then, is figuring out where to find the documentation.


    This chapter is devoted to helping you through this rite of initiation. Starting
    with the simplest form of documentation available, the text file, it works up
    to the state-of-the-art help systems currently employed by Red Hat Linux.


    # Lowest Common Denominator


    One nicely we all take for granted in modern software is online help. Without
    it, software is immediately judged amateur and incomplete, regardless of how good
    it might be. Today''s help systems, with their hyperlinks, graphics, and search
    engines, are not a new idea; instead, they are the result of the evolution of
    the computer itself.


    In "ancient" times (before the GUI, but after computers crawled out of the primordial
    ooze of wiring panels and punched cards), users communicated with their computers
    through dumb terminals. The earliest were teypewriters, where every character
    was printed on paper. It was nice to have the complete transcript of a session
    that these provided, but their speed was appallingly slow (as slow as 11 characters
    per second), and their appetite for paper was huge.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Video display terminals (VDTs) were an immediate improvement over teletypewriters.
    They were usually faster and consumed no expendables, but, too, were limited to
    displaying lines of text. It should come as no surprise, that, the original means
    to document systems was simple text files. Any editor was sufficient to create
    one of these files, though most authors now embed Standard Generalized Markup
    Language (SGML) tags into their documentation so the final output isn''t strictly
    limited to text. Furthermore, no special software is required to view text documentation;
    the utilities that come with any Linux distribution are sufficient.


    Let''s take a moment to examine some text documentation with Red Hat Linux. To
    begin, log onto your system as a normal user, and start the X Window system with
    the startx command. Open a terminal emulation session by clicking on the terminal
    icon at the bottom of the screen, and maximize the window. At the command prompt,
    type the following command:


    ```

    /usr/share/doc

    ```


    This changes your current directory to the one where Red Hat stores the text documentation
    for the software you''ve loaded, in addition to other types of documentation (discussed
    later in this chapter).


    Now that you''re in the correct directory, issue the list command. You''ll see
    a larger list listing of the directories under this directory. For the most part,
    each directory is named for the version of the program it documents. So, a directory
    called "aProgram-1.3" would contain documentation for version 1.3 of aparat.


    The directory of particular interest right now is HOWTO, as you have probably
    seen, contains how-documents. Many of these are outdated, superseded by updates
    in the software they describe, but are nonetheless useful, if for no reason than
    to give you an idea of what''s been accomplished for you by the configuration
    utilities. Issue the command cd HOWTO, and then again issue the command ls. The
    list of files displayed are in text format, viewing a text editor or programs
    such as more or less. If you scan the list, you''ll see some fairly interesting
    documentation. Before Red Hat and other companies started to write software to
    easily system configuration, these documents provided the information required
    for a system administrator (that''s you) to accomplish specific tasks.


    The first-to-how you should examine HOWTO-INDEX, by issuing this command:


    ```

    less HOWTO-INDEX

    ```


    You''ll be presented with the first page of the document. You can page down through
    the document by pressing the spacebar. Once past the first page, you can page
    back up by pressing the B key. A full set of navigation instructions can be obtained
    by pressing the H key (for help). When you have read HOWTO-INDEX, exit less by
    pressing the Q key. Be sure to browse through the other files you see; there''s
    some excellent reading available.


    # In the Beginning, Geeks Created Man


    And the programmers looked upon the text documentation they had created. And they
    thought, "It is good. But we can make it better." So, they put their heads together
    and decided to add the following features:


    +   * The capability to search the documentation for a particular string. Sure,
    text-based documentation can be searched with tools such as grep, but it isn''t
    an elegant solution.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Documentation 65


    +   - The Capability to categorize the documentation into a meaningful hierarchy.
    This can be accomplished through the judicious use of directory names, but requires
    everyone to agree on the location of the directories. It is also difficult to
    do if you wish to include the next feature...


    +   - The capability to work for any software, not only what is included with
    the operating system. If users create their own software and would like to use
    the same documentation method as the operating system, they should be able to
    do it. This same feature would also enable the documentation system to be cross-platform,
    or at least be across the various dialects of UNIX.


    The result of the programmers'' work is the document format known as the **manpage**.
    Each manpage is divided into several parts: Name, Synopsis, Description, Options,
    Files, See Also, Bugs, and Author. The command to view a manpage is simply **man
    manpage**, where man refers to a specific help file. These files are typically
    named the same as the commands they document.


    How does **man** satisfy the programmers'' specifications? The first requirement
    was that the documentation be searchable, and manpages are searchable by using
    the command line option -k. For example, the following line tells **man** to search
    for "Search This" in the description section of each manpage, and then display
    the name and description of each manpage where the string is found:


    ```

    man -k "Search This"

    ```


    The second requirement was that the documentation be stored in a hierarchy. Manpages
    are segregated into nine sections, divided as follows:


    +   1. Executable programs or shell commands

    2. System calls (functions provided by the kernel)

    3. Library calls (functions provided by the system libraries)

    4. Special files

    5. File formats and conventions

    6. Games

    7. Macro packages and conventions

    8. System administration and commands

    9. Nonstandard kernel routines


    Your call to **man** can include the section in which you wish to look for the
    manpage. So, if two manpages have the same name, as would be the case for a program
    called "foo" and a file called "foo," and you want the manpage for the foo program,
    you''d issue this command:


    ```

    man 1 foo

    ```


    The final requirement was that the documentation system be viable for any software,
    not just system software. This is accomplished by the use of the **manpath** environmental
    variable. This environmental variable is used by **man** to determine where it
    should look for the various manpages. If users install software that comes with
    manpages, or write their own manpages, they can manipulate **manpath** or declare
    it on the command line with the **man** command. The last part of this requirement
    was that the documentation'
