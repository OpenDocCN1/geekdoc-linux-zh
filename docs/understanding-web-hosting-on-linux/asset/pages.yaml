- pgno: 97
  md: '# 82 · CHAPTER 6


    ![](img/069cd06404ac5e90171e6d857bf3ad28_97_0.png)


    # Text Fields


    Of the input types in Figure 6.7, the text field is the easiest to describe:


    ```

    <INPUT TYPE="text" NAME="name" SIZE=25 MAXLENGTH=25>

    ```


    The TYPE option declares the input as text; NAME creates what amounts to a variable
    name; SIZE declares the number of characters viewable on the browser panel; and
    MAXLENGTH declares the maximum number of characters that can be entered in that
    text field. Notice the prompt for the input field. <B>Name:</B> <B>/B> tags just
    signify bold.


    # Check Boxes


    The first check box in Figure 6.7 defines the input field as a check box with
    a variable name of RPG:


    ```

    <INPUT TYPE="checkbox" NAME="name" VALUE="RPG">RPG

    ```


    Unlike the text, the checkbox has its value explicitly specified as "RPG". Check
    boxes are Boolean values. In this example, a user clicks it to indicate that he
    or has RPG programming experience. If the user does not click the check box, the
    RPG input field isn''t even sent to the server. If the user clicks the check box,
    the input field identified with the variable name of RPG is sent to the server
    with the value of "RPG".'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Radio Buttons


    Use radio buttons instead of check boxes when you have a group of options whose
    Boolean values are mutually exclusive. All of the radio buttons in Figure 6.7
    have the same variable name, exp. Because they all have the same name, the user
    can only select one of them. The value specified for the selected button is sent
    to the server. You can explicitly check one of your radio buttons (or check boxes,
    for that) by simply placing CHECKED in the input statement:


    ```

    <INPUT TYPE="radio" NAME="exp" VALUE="<5" CHECKED>

    ```


    # Dropdown Lists


    Dropdown lists (also called "select lists") make it easy for a user to quickly
    select an item. Whenever a user''s input has to match a specific list of values,
    use a select list. You should not, for instance, force the user to enter the two-letter
    abbreviation for a state, only to respond that the particular abbreviation is
    invalid.


    The <SELECT> tag in Figure 6.7 uses the NAME option to identify the variable "prof".
    The select list is populated with options. The <OPTION> tag always has a value
    specified. Before the closing <OPTION> tag, the display value is specified. An
    option for a select list of states, for instance, might have the state code as
    the value, but the state spelled out for display:


    ```

    <OPTION VALUE="VA">Virginia</OPTION>

    ```


    # The Submit Button


    The submit button was mentioned earlier, but one trick we want to mention here
    is to simulate function keys with HTML submit buttons. In legacy midrange and
    mainframe applications, function keys are used to tell the program how to process
    the screen input data. If you''d like the same facility in an HTML form, just
    specify several submit fields. The two submit buttons, for instance, add an item
    to or cancel the order, respectively.


    ```

    <INPUT TYPE="SUBMIT" NAME="Submit" VALUE="Add Item">

    <INPUT TYPE="SUBMIT" NAME="Submit" VALUE="Cancel Order">

    ```


    Notice that both variable names for the submit buttons are the same because the
    user can only select one of them. The value associated with that button is passed
    to the server program, which can then use predicate logic based on that value
    to change the execution of the code path.


    Take a look at the input tag that follows for the submit button in Figure 6.7.
    It has the input type of RESET. When it resets all buttons, all the values in
    the form are reset to their original values, the forms stays active in the browser,
    and nothing is sent to the server.


    One, powerful input field needs to be described: the hidden field. Like subtle
    hidden fields, HTML hidden hidden field are not displayed to the user. They are
    explicitly for use by the server program. Typically, hidden fields are used in
    HTML to maintain application state, but you can use them for any reason you wish.
    Just keep in mind that the HTML form still needs to be sent over the Internet,
    so don''t overcome them.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# HTML, the New User Interface


    The "pseudo-GUI" of HTML is good enough for users. It has all the required features
    of a full-blown GUI, such as a desktop metaphor. With HTML, if you need a popup
    window, you simply insert a hyperlink that makes another browser session open.
    If a user wants several HTML-based applications running at one time, he or she
    opens additional browser windows. As you''ve seen, HTML also has check boxes,
    radio buttons, and dropdown lists.


    Yes, the full GUI of an applet or client/server application is more sophisticated,
    but the extra programming required to handle window events adds considerable programming
    effort to both development and maintenance. It is far easier to use HTML as the
    user interface, with Java servlets to handle the input, perform the business logic,
    and respond to the user, than to develop true GUI applications.


    # End of Chapter Review


    # Key Terms


    | Applets | HTTP | Stateful Protocol |

    | Common Gateway Interface | HTTP Headers | Stateless Protocol |

    | Dynamic Information Retrieval | HttpSession Object | Web |

