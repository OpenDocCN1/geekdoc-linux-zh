    $ echo $CLASSPATH

    :/opt/java/jdom-b6/build/jdom.jar:/opt/java/jdom-b6/lib/xerces.jar

    ```


    > Note: The dot operator by itself in PATH or CLASSPATH refers to the current
    directory.


    # Dot Profile


    By qualifying the location of java and jacavac in PATH and various .jar files
    in CLASSPATH, we had set up a Java development environment in bash. But whenever
    we signed off, our PATH and CLASSPATH modifications were lost. That meant each
    time one of us logged in, we would have to reset the Java environment. There is
    a better way.


    Whenever you log on, Linux runs a couple of special scripts. It first executes
    the commands in a script located in the /etc directory. Then it executes a script
    called .bash_profile in your home directory. To have our Java environment set
    every time we logged onto our Linux system, we modified the .bash_profile, which
    is as shown in Figure 12.2.'
