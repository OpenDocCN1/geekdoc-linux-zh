    So what differentiates one from another? To answer that question, check out any
    of the Linux newsgroups. Get on an Internet Relay Chat, like #linux, and see what
    "everyone" has to say. What questions are being asked and what, if, distribution
    is mentioned in either a positive or negative light. Keep in mind that, for reason,
    the choice of distribution could become a personal thing with many people. derogatory
    comments about a given distro are likely to get you into a flame war, so tread
    lightly, and choose your yours carefully when you don''t want to ask anything.
    Judge like you''re grading a test on a curve, discounting the hint and low comments
    about a distribution, and you should come away with a reasonable view of its highlights
