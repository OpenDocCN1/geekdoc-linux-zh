  md: '# 12


    # Using the Bash Shell


    In the Microsoft Windows world, after you''ve booted the system, you are presented
    with a sophisticated graphical user interface. Everything in Windows is done through
    that GUI. In fact, the GUI components of Windows are hard-wired into its operating
    system. Even if your Windows system has no monitor attached at boot time (because,
    for example, it''s a server), the operating system still loads all the GUI components.
    UNIX systems, on the other hand, load GUI components as an option.


    For optimal performance of Linux server systems, you really don''t want the unnecessary
    baggage of a graphical desktop environment slowing down your server. How then,
    do you control the system? How do you start, and reconfigure the Web server? How
    do you add users? On Microsoft Windows, this would all be done from a sophisticated
    GUI. On UNIX, your "window" to the operating system is the bash shell.


    # What''s a Shell?


    Actually, saying that the bash shell is Linux''s window to the operating system
    is not completely true. Like many things in UNIX, you have many options for the
    type of shell you use; the bash shell is simply the default. Once Linux is booted,
    the terminal screen displayed is under control of the bash shell, unless you select
    a desktop environment to automatically start. Even if a desktop environment is
    loaded on your system, however, bash terminal session is available as an application
    window. Either click the terminal-emulator icon, or from a non-GUI terminal screen,
    press Ctrl-Alt-F1 (or F2, F3, F4, F5, or F6).


    The first UNIX shell was called simply Shell. It was a text-based screen that
    allowed the user to enter system commands. That first shell was only as powerful
    as the limited DOS shell of Microsoft operating'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'In 1978, Stephen Bourne replaced the original UNIX shell with a new one that
    added advanced scripting capabilities and command-line editing. The Bourne shell,
    as it is called, is still available; you can try it from your Linux machine by
    entering /bin/sh from a terminal screen.


    Bill Joy (more recently known as one of the Scientists who created Java), while
    he was at the University of Berkeley at Southern California, created the C shell.
    The C shell has more job-control features than the Bourne shell and sports c-like
    syntax. And, the C shell is available on Linux. You can try it by typing /bin/c.
    This "shell" goes on: there is a shell Korn; OS/400 has one called Q; and there
    are many others. Eventually, a group of UNIX programmers combined the features
    of several shells into one called bash (a play on words that stands for the "Bourne
    Again Shell"). The bash shell, because of its powerful features, was selected
    as the default Linux shell.


    If you become attached to a shell other than bash, you can change to it by modifying
    your user profile in the /etc/passwd file. Each entry in the passwd file contains
    a semicolon-separated list of options:


    ```

    username:password:userid:groupid:user_description:home_dir

    ```


    The following line qualifies the shell as /bin/bash in one of the authors'' passwd
    file entries:


    ```

    donat:x:500:500::/home/donat:/bin/bash

    ```


    To give an idea of the powerful yet quirky features of bash, rather than using
    an editor or the less command to view the /etc/passwd file, you can use the following
    command to list your default shell (replacing username with your user name):


    ```

    $ cat /etc/passwd | grep Username | cut -d -f 7

    ```


    It reports by listing /bin/bash to your terminal screen.


    > Note: The dollar symbol is the bash prompt when you are logged on as a normal
    user. When you are logged in as root, the shell prompt will have a pound symbol
    (#). Commands that require root privileges are identified in this chapter with
    the # symbol; otherwise, the $ symbol is displayed.


    Another way to list your default shell is by echoing the SHELL environment variable:


    ```

    $ echo SHELL

    ```


    Once again, it simply lists /bin/bash to your terminal screen.


    These echo and cat commands use some of the powerful features of the bash shell:
    piping and environment variables. In this chapter, you''ll learn not only about
    environment variables and piping, but also features like file redirection, filename
    globbing, and substitution mechanisms—in other words, how to become a power shell
    user.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Command Execution


    Linux commands follow a common structure:


    command option(s) argument(s)


    Command arguments qualify information that is necessary for the command to execute.
    For instance, the cd command requires the name of the directory you wish to make
    current:


    ```

    $ cd books/linux/

    ```


    Command options modify how the execution of a command is to proceed. For example,
    the -l option of the ls command tells the list command to show verbose information
    about files:


    ```

    $ ls -l

    ```


    Command options are identified with a hyphen, followed by a single character.
    Some commands, however, also have options that require a double hyphen followed
    by a word. For instance, the ls command has an option that will recursively descend
    into lower-level directories:


    ```

    $ ls -recursive

    ```


    The number of files listed with this version of the ls command will probably fill
    more than one screen. Power bash users use a pipe to the less command to show
    just one screen worth of data at a time:


    ```

    $ ls | less

    ```


    You probably won''t remember all the options of the myriad Linux commands, so
    don''t forget to use the man command to get help. If you enter the following,
    for example, you''ll get a nice Linux manual for the ls command:


    ```

    $ man ls

    ```


    # Foreground/Background


    When you execute a command, bash creates a new Linux process and executes it in
    the foreground. While a process is simply a program running on the system. While
    a command is executing in the foreground of your terminal session, you will be
    unable to enter other commands. If you want to execute a command that might take
    a long time, you can force it to a background process by adding an ampersand (&)
    to the end of the command. For example, suppose you want to edit a file using
    Gnome''s gedit. If you enter edit followed by the name of the file you want to
    edit, the terminal session will not accept any other commands. For that reason,
    you will usually launch gedit as a background process. For instance, to edit /etc/lilo.conf
    you would enter the following:


    ```

    gedit /etc/lilo.conf &

    ```'
  merge: -1
  img_proc: true
