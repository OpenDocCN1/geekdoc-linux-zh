    versions.


    Up to this point, we''ve considered open-source or free software for developing
    and deploying a commercial Web site. To host a highly sophisticated Web site,
    you might want to look at commercial software. The open-source relational databases,
    for example, don''t contain all of the features available in the commercial products
    of Sybase, Oracle, or IBM''s DB2 UDB. Similarly, open-source Web application servers
    do not scale as well as IBM''s WebSphere. BEA''s WebLogic, and Sun''s i. The three
    open-source Java IDEs just mentioned (VAJ, JBuilder, and Forte) have commercial
