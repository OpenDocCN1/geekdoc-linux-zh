  md: '# 110 · CHAPTER 7


    Four other object variables are also available in the Java code of JSP file: response,
    session, out, and in. The PrintWriter and BufferedReader classes of the out and
    in object variables are from the java.io package. The class of the session object
    is HttpSession; it is used to maintain the user state. The class of the response
    object is HttpServletResponse. It''s sort of the opposite of HttpServlet; as you
    might guess, encapsulates object-oriented access to any of the facilities available
    with an HTTP response that is to be sent to the client. (Table 7.4 shows a list
    of the methods available to response.) Through the methods of the request, response,
    and session object variables, you will be able to do with ease what CGI programmers
    must struggle with.


    # Scriptlets


    When more than line of Java code is contained within the <% and %> that section
    of code is known as a scriptlet. The Java syntax inserted between those tags can
    be as complex as you desire. The following example shows a Java for loop:


    ```

    <html><body>

    for (int idx = 0; idx < 3; idx++) { %>

    Current index is <%=idx%> <br>

    } %>

    </body></html>

    ```


    The first scriptlet in this example starts the for loop with an opening curly
    brace, but the scriptlet abruptly ends with the closing %>. The string "Current
    index is" is just good old HTML, but then a JSP expression is used to dump the
    value of the idx variable. Finally, the loop is terminated with a closing curly
    brace. The output of this simple JSP is as follows:


    Current index is 0

    Current index is 1

    Current index is 2


    # Directives, Declarations, and Comments


    JSP directives are identified by the symbol at symbol <%@. Directives are typically
    used to qualify the packages of Java classes you wish to use in your JSP. For
    instance, earlier example fully qualified the Date object as java.util.Date. If
    you remove the util qualifier, the example JSP won''t compile to a servlet. If
    you use a page directive, the Date class must not be:


    ```

    <% page import="java.util.*" %>

    <html><body>

    Today''s date is <%=new Date()).toLocaleDateString() %>

    </body></html>

    ```


    JSP declarations are identified by the exclamation point (%!). Declarations are
    used to describe object variables that can be used in any of the Java code within
    a JSP file. All the browser-based requests for same JSP share the values of the
    declared object variables. JDBC Connection objects are good candidates to be defined
    in a JSP declaration.


    JSP comments are identified by a set of double hyphens (%-- and --%>). Use the
    comment code when you don''t want the comment code to be included in the HTML
    sent to the browser. On the other hand, when you'
