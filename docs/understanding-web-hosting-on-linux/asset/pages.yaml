- pgno: 66
  md: '# Linux Configuration and Startup


    Table 4.1: A Starter Set of Linux Commands

    | Command | Description |

    |---|---|n| cd | Change the current directory. |

    | pwd | Print the working directory. |

    | ls | List all the files, directories, and links in the current or qualified
    directory. |

    | cp | Copy a file. |

    | mv | Move or rename a file. |

    | less | Display the contents of a file one screen at a time. |

    | man | Display documentation about a command. |

    | apropos | List all commands that have the string argument qualified by the apropos
    command in your man description. |


    Through a combination of cd, ls, cp, and mv, you should be able to control and
    maintain the files on your system. The less command provides a quick way to view
    the contents of text files, one screen at a time. An example of this command is
    to view the system log file /var/log/messages:


    ```

    /var/log/messages

    ```


    The Home and End keys can be used to move to the first or last page of the file
    being displayed, while the PageUp and PageDown keys allow you to move one page
    at a time. To exit the less utility, press the q key.


    There is a lot more power to the commands you''ve seen so far. To find out about
    them, use man followed by the name of the command you wish to read more about,
    like this:


    ```

    man less

    ```


    The display of man works just like less, so when you are done reading, press q
    to exit.


    Linux keeps a history of commands, which can be retrieved, one line at a time,
    with the Up arrow key. That''s how if you want to execute a series of similar
    commands. Once you retrieve a command, you can use the Home, End, Backspace, and
    Left Right arrow keys to edit it.


    Of the thousands of commands in Linux, you''ll end up remembering your favorites.
    Times, though, you''ll need to do something for which you can''t remember the
    command: That''s what the apropos command is for. Simply specify a keyword you''d
    expect to see on the manpage for the command.


    # DOS Comparisons


    The bash shell is one of many shells, such as the C shell, K shell, and Q shell.
    Even Microsoft''s DOS command screen is a shell, although limited when compared
    to UNIX versions. If you are already comfortable with the commands available in
    the rather limited DOS shell, Table 4.2 will help you move to a real shell.'
