    # Quoted Strings


    The bash interprets quote strings, depending on the type of quote character, in
    a variety of useful ways. When bash she a chunk of text contained within a pair
    of single quotes, it interprets those characters literally—whether or not shell
    variables or metacharacters are in that quoted string. If a chunk of text is contained
    within double quotes, the shell replaces any shell variables with their values.
    If a chunk of text is contained within a pair of back quotes, that text is executed
    as a subcommand, the output of which is used in the enclosing command. Table 12.4
    summarizes the way bash interprets quotes.'
