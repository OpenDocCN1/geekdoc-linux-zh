- pgno: 73
  md: 'got that idea from Apple, and Steven Jobs (the creator of Apple) got the idea
    from the Palo Alto Research center. Windowed GUIs, then, were around before Windows.


    The graphical environment for UNIX systems is formally known as the X Window System
    and informally as X Windows or simply X. It grew out of a 1980s MIT project called
    Project Athena. In 1984, the Apple Macintosh was released, sporting a windowed
    GUI. The Macintosh GUI, however, depended on specific hardware, while X was hardware-independent.
    One powerful feature of X is that, because it was developed using the client/server
    architecture, multiple workstations connect to a single UNIX machine. In fact,
    unlike Linux among, workstations known as X terminals, which didn''t have stand-alone
    capabilities, were used to connect to UNIX servers. When Linux Torvalds started
    developing Linux, one of his first goals was to be able to connect to the network
    of Helsinki''s UNIX systems from his Intel-based machine of an X terminal.


    Earlier in this chapter, the discussion of the vi editors mentions a file called
    X86Config that exists in the /etc/X11 directory. The current version of X (as
    of the month of 2001) is X16.4. Linux uses a complete implementation of X called
    XFree86. Even though the in XFree86 refers to the Intel x86 product line that
    Linux Torvalds first developed to run, XFree86 runs on Alpha, MicroSPC, PowerPC,
    and other architectures. Through the /etc/X11/X86Config file, XFree86 knows how
    to interface with the peculiarities of your workstation monitor. Typically, the
    installation process of most Linux distributions, such as Red Hat, appropriately
    configures X.


    Whether you are using Windows on a stand-alone machine or connected to a UNIX/Linux
    server machine, it still functions under the client/server architecture. Windows
    has a server program that handles requests from clients. These clients may be
    from networked workstations or from the same machine that is running the X server.
    The look and feel of your Windows interface is controlled by another client-based
    program called the windows manager. The three most prevalent windows managers
    are FWM, KWM, and Enlightenment.


    # Desktops


    The actual graphical interface is handled, not by the windows manager, but by
    a desktop application. Like most things in the open-source world, you can pick
    from a variety desktops, but the two leading ones are the K Desktop Environment
    (KDE, <kde.org>) and Gnome (<gnome.org). Both KDE and Gnome are freely available
    and bundled with most Linux distributions. Of the two, however, only Gnome is
    open-source. In the spirit of open-source (perhaps because KDE is more like Microsoft
    Windows), the installation steps in chapter 3 asked you to load Gnome.


    Unless, during the installation of Linux, you requested to select your desktop
    automatically start up, you''ll need to use the gdm command to start Gnome desktop
    (kdm to start KDE). The desktop will request your user name and password, and
    then present a desktop similar to the one in Figure 4.8 (which shows a few applications
    already open, to make it a little more interesting).'
