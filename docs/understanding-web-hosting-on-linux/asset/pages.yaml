  md: '# Using the Bash Shell 183


    | Table 12.4: Special Characters in Quoted Strings |

    | Character | Meaning |

    | --- | --- |

    | '' | Text within a pair of single quotes is interpreted literally. Shell variables
    and metacharacters are not replaced with their interpreted values. |

    | " | Similar to single quotes, except that shell variables are replaced with
    their values.

    Text within a pair of back quotes is executed as a subcommand, the output of which
    is then used in the enclosing command.

    | \ | Characters that follow a slash are interpreted literally; any metacharacter
    meaning is ignored. If the backslash is the last character in a line, it signals
    to the shell that a continuation line will follow. |


