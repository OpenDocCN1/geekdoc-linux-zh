- pgno: 88
  md: '# An Introduction to the Web


    Although the Internet was around for over 10 years before the Web was crafted
    on top of it. Tim Berners-Lee created the Web while he was an employee at the
    European Laboratory of Particle Physics (CERN). CERN is a research center where
    scientists from all over the world slam particles together in a special machine
    and analyze the results. These scientists then extrapolate complex theories from
    the reactions of these particles.


    Although we do not profess to understand even the simplest of CERN''s theories,
    we do understand the Web architecture that Berners-Lee created. The Web is an
    elegant solution to a big problem that the CERN scientists had: how to exchange
    information. The scientists all used different computer systems, making it extremely
    difficult to share information. CERN''s computer systems were already connected
    via the Internet, but they lacked a common interface. Berners-Lee invented a standard
    exchange protocol called Hyper Transfer Protocol (HTTP). The idea was that an
    Internet server program would transfer HTTP packets on request to client programs.
    An HTTP packet would contain text-based information embedded within tags that
    describe the presentation attributes of that information: Hypertext Markup Language
    (HTML). HTTP client applications, today known as Web browsers, would accept the
    HTTP packets, parse the HTML, and present the text-based information.


    In 1993, the National Center for Supercomputing Applications (NCSA) at the University
    of Illinois created the first industrial-strength Web browser, called Mosaic.
    One of Mosaic''s developers, Marc Andreessen, who had coded support for graphical
    images in Mosaic, foresaw the potential of the Web. In 1994, his new company,
    Netscape Communications Corporation, release Navigator. Where Berners-Lee brought
    information exchange to scientists and computer experts, Andreessen brought it
    to anyone who had a personal computer.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# 74 CHAPTER 6


    # Applets


    While the Web was under development, Sun Microsystems was developing a small,
    object-oriented language called Oak, which was designed to transfer code to small
    appliances. The small appliance would require a "virtual" operating system (a
    virtual machine) that could interpret and execute dynamically transferred chunks
    of code. Sun''s Oak language was a technical success, but it was shelved because
    Sun''s marketing department realized the Web was not ready to pay the surcharge
    for appliances that contained virtual machines. In other words, nobody would pay
    $350 for a toaster. (Coincidentally, people are paying $350 for smart appliances
    today, when you consider the success of PDAs.)


    When the Web started to flourish, Sun realized that a Web browser was basically
    just a small appliance. Sun partnered with Netscape, and Netscape''s Navigator
    was bundled with a virtual machine. Because Sun found out there was a trademark
    for Oak, it had to come up with a new name. Sun tells coming up with the name
    "Java" while in a coffee shop, but a more practical explanation is that it is
    an acronym for "Just Another Virtual Assembler." In any case, the marriage of
    Java and Web browser was a huge success.


    The early success of Java soon evaporated, however, because it was based on applets.
    The "applet" itself means "little application," and how busy programmers develop
    "little applications" Applets just too long to download from the Web to a Web
    browser. In fact, Java would have done it were not for the introduction of server-side
    Java with servlets and Java Pages. Chapter 7 covers servlets and Java Pages. This
    chapter explains HTML and HTTP.


    # HTTP: The Protocol of the Web


    A basic understanding of Hypertext Transfer Protocol is necessary to developing
    server-side Java applications. The first thing you need to understand is that
    the Web is a stateless protocol. Other Internet protocols, such as FTP, are stateful.
    When you use FTP, you sign on, and the FTP server maintains a persistent connection
    to the FTP client. If you change the directory or set an option, FTP stepping
    stays in effect throughout your session. With HTTP, however, each browser request
    requires a new connection to the server.


    Consider a URL as "http://www.WidgetsRS.com/sales/itemlist.html" entered by a
    user into a Web browser. The protocol is qualified by "http": the TCP/IP address
    of the server machine is qualified by the domain name "www.WidgetsRS.com"; and
    the file name is qualified by "sales/itemlist.html." The Web server that is sitting
    on the TCP/IP address qualified by the HTTP request and establishes a TCP/IP connection.
    The server connects the itemlist html file and sends an HTTP response to the client,
    which contains the contents of the requested HTML file. Then, the server terminates
    the connection. If the user immediately makes another request, the Web server
    makes a completely new connection. This means that your application''s state (such
    as file cursors, data structures, and program variable) is not maintained between
    user requests. HTTP, therefore, is a stateless protocol.


    Clearly, there is a way around this. Otherwise, you''d never be able to visit
    a Web site like www.amazon.com, open a shopping cart, fill your cart with books,
    and confirm your order by entering your credit card information. Sun''s Servlet
    API has a solution: the HttpSession object. The HttpServlet object maintains the
    application state between user requests.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Client Request


    Client HTTP requests come in two basic forms: GET and POST. A GET request is sent
    to the server when a user types a URL into a browser or clicks a hyperlink. The
    browser builds an HTTP packet that contains, at minimum, the request method or
    command type, the name of the object that the user is requesting, the HTTP version,
    the product name of the browser, and the list of file types that the browser can
    handle:


    ```

    GET /login HTTP/1.0

    User-Agent: Mozilla/4.02 [en] (Win95; I)

    Accept: image/gif, image/jpeg, text/html, /*

    ```


    Meanwhile, the domain name (or IP address), the qualifier for the request, and
    the user input parameter (if any) are passed as what is known as the query string:


    ```

    http://www.mc.com/servlet/login?user=don&pass=secret

    ```


    Again, the "port" of the URL says that it is using the Hypertext Transfer Protocol.
    The domain name of the server is "http://www.mc.com" (although this could also
    be an IP address). The "servlet" is the qualifier for the requested object, and
    "login" is the name of the requested object. The question mark indicates that
    a query string follows, and the ampersand then shows the start of a new key/value
    parameter pair. In the example, the parameters are the user name "don," and the
    password "secret" (which isn''t, now).


    This brings up (justifiable) concern about sending information such as passwords
    as free text across the Internet. To avoid this, use POST instead of GET. An HTTP
    POST request embeds all the parameters to the HTTP packet, instead of sending
    them as part of the URL. Then, as long as you use Secure Sockets Layer configured
    on your server, all the data in the HTTP packet is encrypted by the browser and
    decrypted by the server. Explicitly specifying POST is covered later in this chapter.


    # The Response


    The earliest Web servers served merely static HTML and images. When a user requests
    a static HTML page, the qualifier portion of the request is used as the path to
    the HTML file on the host. For example, if the request was for "http://www.WidgetsRU.com/html/HelloWorld.html",
    the Web server would simply open the file HelloWorld.html in the directory called,
    and then stuff the contents of that into an HTTP response packet. That response
    packet is fairly easy to build, as you can see in Figure 6.1. The packet starts
    by specifying which version of HTTP it contains (in this case, 1.0), followed
    by the HTTP status codes. Status codes are used to tell the client (the browser)
    whether the request was successfully filled. A summary of HTTP status codes is
    shown in Table 6.1.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# 76 · CHAPTER 6


    ```

    HTTP/1.0 200 OK

    Server: Little Web Server

    Content-type: text/html

    Content-length: 133


    <html><body>Hello World!</body></body></html>

    ```


    Figure 6.1: An HTTP packet contains header information along with an embedded
    file, typically HTML, that is the HTTP server''s response to the client''s request.


    # Table 6.1: HTTP Status Codes


    | Error | Description |

    |---|---|

    | 1xx | Informational. HTTP/1.0 does not define any, but HTTP/1.1 does. |

    | 2xx | Successful. The request was received, understood, and accepted. |

    | 3xx | Redirection. The server requests the Web client redirect to another URL
    |

    | 4xx | Client error. The request was improperly formatted or cannot be fulfilled.
    |

    | 5xx | Server error. There was a valid request that the server cannot fulfill.
    |


    You have noticed that the HTTP response packet in Figure 6.1 contains not the
    complete contents of the HelloWorld.html file, but also a few lines that further
    describe the response. Those extra lines contain HTTP headers. The header tells
    the browser the name of the HTTP server that handled its request. The content
    type header specifies that the embedded content contains text-based HTML, while
    the content-length header gives the total length of the file. There are more HTTP
    headers than server, content type; a few of the more interesting ones are listed
    in Table 6.2.


    # Table 6.2: HTTP Headers that Enable Sophisticated Internet Applications


    | Header | Description |

    |---|---|

    | Allow | Tells the client which HTTP methods are supported, such as get, post,
    and head. |

    | Expires | The date when the HTML becomes invalid. |

    | Pragma | A general-purpose field commonly used to specify "no cache". |

    | If-Modified-Since | Returns the file to the client only if modified since a
    date. |

    | Last-Modified | The date when the file was last modified. |

    | Location | The directory of the server-based file. |

    | Referer | The address of the file linked to this file. |

    | Set-Cookie | Application-specific information, often used to maintain state
    across a stateless protocol. |

    | User-Agent | The name and version of the HTTP client. |


    # Where''s My Package?


    When the Web first became ubiquitous, every company had to have a Web site. Many
    of them slapped one together by converting their marketing material to HTML and
    images. This type of Web is known as brochure because it is nothing more than
    your standard advertising information, except that it is on the Web. To get a
    return on their investment in a Web site, however,'
