- pgno: 16
  md: '# 1


    # Why Linux


    The Linux operating system was initially available merely as a UNIX clone for
    Intel-based workstations. Linux has grown, however, from Linus Torvalds'' 1991
    school project for Finland''s University of Helsinki to be the only operating
    system that runs on all major computing platforms, including IBM''s eServers,
    Sun''s platforms, and Intel''s complete line of processors, from the 386 to the
    64-bit Itanium. Linux gained worldwide attention in the mid-1990s when it became
    one of the dominant operating systems used for Web hosting.


    Early adopters of the Web Linux for two main reasons:


    +   1. It''s free.


    +   2. As a UNIX platform, it can run a variety of excellent Internet server applications,
    most notably the Apache Web server and sendmail.


    Linux is also a full multitasking operating system, which means it can run many
    processes concurrently. Internet server machines need to be able to multitask
    so that they can run concurrent processes such as email, Web servers, and relational
    databases, thus being able to respond to numerous simultaneous requests from remote
    users. Personal workstations need to be able to multitask so the user can view
    the screens of multiple applications—such as a spreadsheet, a text editor, and
    a personal organizer—at the same time.


    As a UNIX platform, Linux runs a wide variety of powerful Internet server applications.
    Beside Apache and sendmail, Linux can run software such as Network File System
    (NFS), a file server for Linux and UNIX file systems; SAMBA, a file server for
    Windows NT file systems; and Domain Name Service (DNS),'
