    # Odds, Enns, and Email


    One of the widely used Internet facilities is email, and it may have been that
    first drew you to the Internet. When you first became "connected," your ISP or
    network administrator should have provided the names of your SMTP and POP servers,
    which you dutifully filled into the appropriate spaces in your client''s configuration
    screen.


    Once your email was started, you probably didnt give any more thought to the curious
    terms SMTP and POP. Surprisingly, the last P in each of these terms stands for
    "protocols." The protocols primarily responsible for delivering your messages
    and receiving them are the Simple Mail Transfer Protocol (SMTP), the Post Office
    Protocol (POP), and, to a growing extent, the Internet Message Access Protocol
    (IMAP).


    Let''s begin this discussion with SMTP, which transmits your message to its destination.
    SMTP is the protocol used between servers to exchange mail, not the program itself,
    so if you are running an SMTP daemon, you''ll need to obtain an SMTP server program.
    The standard on Red Linux is the venerable and very powerful sendmail, notorious
    for its incredibly tricky configuration and infamous security for older versions.
    Simpler and more secure programs include QMail and Postfix, which is readily available
    in RPM format for a Red Hat system. Regardless of which server you choose, they
    all operate in the same fashion. Upon startup, they check their configuration,
    decide where they are running and from whom they will accept mail, then patiently
    await a connection on TCP/IP port 25.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# 166 · CHAPTER 11


    Suppose you''ve just heard a really bad joke and wish to inflict it on a friend
    via email. Opening up your email client, you enter "friend@hisdomain.com" into
    the "To: field, and after filling in a subject like "I thought you might like
    this" (which might make your friend suspect that you just sent a Microsoft email
    virus), you start typing the lengthy text of the joke. When you click the Send
    button, your email client will connect with the SMTP server, and using the SMTP
    protocol, send the message through the ether to its intended recipient.


    A standard Red Hat installation already will sendmail running, with which you
    can communicate with telnet. Typing the following:


    ```

    telnet localhost 25

    Trying 127.0.0.1...

    Connected to us2.

    Escape character is ''[AJ]''.

    220 localhost SMTPP 8.11.2/8.11.2; Wed, 05 Dec 2001 21:46:52 -0500

    HELO localhost

    250 localhost Hello IDENT:userid@localhost [127.0.0.1], pleased to meet you

    MAIL FROM:userid@localhost

    250 2.1.5 userid... Recipient ok

    Data

    354 Enter mail, end with ". on a line by itself

    This is a message to myself.

    250 2.0.0 f862mak11188 Message accepted for delivery

    QUIT

    ```


    You could see a heading that begins with the digits 220 and then has your host
    name, the version of sendmail that is running, and the local date and time. You
    can then type HELO localhost. Sendmail will greet you, notifying that you have
    successfully gotten its attention. Figure 11.4 shows the complete conversation.


    ![](img/069cd06404ac5e90171e6d857bf3ad28_181_0.png)


    It''s now ready to communicate with you. Feel free to experiment! When you are
    ready, disconnect from sendmail by using QUIT. You should be notified that you
    have new mail. You can work through this procedure with your ISP''s SMTP queue,
    and send mail to anyone.


    It is no mystery that the mail ended up in the right place, since you connected
    to the SMTP server on your own machine. You might be wondering, how many mail
    ends up on the machine in the cyberworld, if you pardon the oxymoron. It''s quite
    simple. If you send an email addressed in the form "userid@hostname.domain.com",
    you are asking for the mail to be delivered to a specific host with the given
    domain. You''ve done that before with your Web browser ("www.yourdomain.com").
    There''s no magic there. But what happens to an email addressed simply to "userid@domain.com"?
    On what host does message finally arrive?


    Although you''ve never had see it, an entry in the DNS database specifies the
    host that handles mail for a given domain. In fact, there can be multiple hosts
    specified, so that delivery attempts can be made with each one, until the message
    is successfully received. Redundancy is to ensure that the mail doesn''t "bounce"
    if the primary mail server fails.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Linux and the Internet • 167


    Once the mail arrives at its final destination, you use your email client to retrieve
    it. If you haven''t already viewed the message you sent to yourself earlier, find
    it in the /var/spool/mail directory of your system, in a file that has your user
    name. One method to view the message is to simply issue the command `cat /var/spool/mail/username`
    (substitute the appropriate username).


    "But wait! you proclaim. "What is all other stuff at the top of the message?"


    That "stuff" is heading information added by sendmail, for RFC 1869, which describes
    SMTP. Each SMTP server, from the SMTP server you connected to the last SMTP server
    to handle the message, adds its own heading information, but you can always see
    the route your message took. Most email clients hide that information from you,
    but you can configure them to show headers, if you wish.


    Using the cat command to view your message isn''t very practical, since each incoming
    message is appended to this file, so you''d be seeing the same messages over and
    over. Instead, you can access your messages using your email client. On your local
    machine, you can configure your client to manipulate the mail spool file directly.
    If your mail was located on another machine, you would not have access to the
    mail spool file. Instead, your email client would connect to a POP server.


    Like SMTP servers, POP servers are software that listen on a TCP/IP port (in this
    case, 110) and allow connections from client software. Unlike SMTP, which requires
    no user or password information, POP will connect to your client immediately and
    ask it for identity (with USER and PASS commands) before proceeding. Once your
    identity has been authenticated, the POP server will respond to commands from
    your client. These include instructions to the POP server to send a of your waiting
    messages, send one of the waiting messages, or delete a message, unless you''ve
    configured your email client to keep the messages on the server.


    You can experiment with POP servers by issuing the following command:


    ```

    telnet yourPopServer 110

    ```


    Once connected, issue USER username, then issue password for your account. The
    HELP command will give you a list of commands that the POP server understands.


    Once you''ve received your messages, they exist nowhere but in your local mailbox.
    This isn''t much of a problem, unless you use multiple computers. Then, it seems
    that the email you want to review is always "where you aren''t." Sure, with a
    little creativity, you can configure all of your computers to leave messages on
    the server. The better solution, is to use IMAP. This is typically no more complicated
    than using your email client to use IMAP (assuming your ISP provides one) instead
    of a POP server. The difference, though, is that the mail is left at the server.
    This is much more convenient for a user who has many computers, since the mail
    is in one place. Most ISPs do not offer IMAP simply because of the space requirements
    on their end. They''re more than happy when you connect and delete your messages
    from their disk drives. Fail to do that too long, and people who send you messages
    will start getting them bounced back.


    No discussion of Internet email would be complete without a MIME, the Multipurpose
    Internet Mail Extension. You have probably attached some kind of file to an email
    message before. Unless the attachment was text, it was using MIME.


    When email was first created, the messages were pure ASCII text. Although a byte
    is one eight-bit character (for a total of 256 characters), ASCII only defined
    the first 128. The upper characters were "extended" for'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'printing cute symbols on printers, or for printer-control characters, or for
    some of the characters used in non-English languages. Actually, only the lower
    seven bits would be passed through email systems.


    Today, it''s not at all unusual to send pictures and other files that have ASCII
    values that are in the upper 128 characters. These binary files wouldn''t be able
    to pass normally through the email system without MIME. Simply put, MIME maps
    the nonroutable characters in binary files into roughly two-byte strings that
    are routable. These pass flawlessly through email systems.


    Most clients take care of the conversion for you automatically. If you attach
    a picture to one of your emails, the client will convert it, and the recipient''s
    email client will convert it back. If you look at the raw data in your file, you''ll
    see how this is done, assuming that you''ve ever received a MIME-encoded attachment
    (which you probably have).


