- pgno: 92
  md: '# An Introduction to the Web · 77


    companies need dynamic information—information retrieved from powerful corporate
    relational databases using an application programming language.


    For a simple example of dynamic information retrieved via the Web, see the Federal
    Express site at www.fedex.com. From any Web browser, you can enter your package
    identifier to find out your package is at any given time. User input comes from
    HTML forms, such as the one in Figure 6.2. The code for this form is shown in
    Figure 6.3. An HTML tag contains an ACTION option with which to specify the program
    that to process the user''s input. A Web server passes the user''s request to
    this host program. The host program dynamically builds the HTTP response, which
    it subsequently returns to the HTTP server.


    ![](img/069cd06404ac5e90171e6d857bf3ad28_92_0.png)


    ```

    <HTML>

    <BODY>

    <FORM

    ACTION="/servlet/PackageFind"

    METHOD="POST">

    <INPUT TYPE="TEXT" NAME="packageNumber">

    <INPUT TYPE="SUBMIT" NAME="Submit" VALUE="Submit">

    </FORM>

    </BODY>

    </HTML>

    ```


    Figure 6.3: An HTML input form qualifies the server program that is respond to
    the user request.


    In the early 1990s, HTTP servers were extended using Common Gateway Interface
    (CGI) to respond to user requests with dynamically created HTML content. However,
    today, the best option is to use Java servlets. How does a Web server know to
    invoke a Java servlet instead of simply returning static HTML? The Web server
    looks for /servlet in its qualifier. If it''s anything else, the server will use
    the qualifier as the directory path for the file. When the qualifier contains
    /servlet, your server will handle the request to a servlet engine (such as IBM''s
    WebSphere) for processing. You can also configure your Web server to support CGI.
    In this case, when the Web server sees the /cgi-bin URL qualifier, it passes the
    request to a CGI plug-in that invokes a legacy program.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# “Need to Know” HTML


    There are dozens of books of HTML, but most of them are half-a-foot thick and
    cover far more HTML than a business programmer needs to know. Buy one of those
    books, but don’t read it cover-to-cover; instead, use it as a reference book.
    The next several pages quickly cover the minimal HTML you need to know to present
    and accept information via a Web browser. You can let an HTML developer “pretty
    up” your forms. Better yet, you can simply run your HTML files through a visual
    editor as Microsoft’s FrontPage or IBM’s WebSphere Studio.


    There are two parts to the HTML covered here: the basic tags for formatting information,
    and the tags required to build forms.


    # Basic Tags


    HTML is comprised of sets of tags that describe how to present the data contained
    within those tags. An HTML file is wrapped by `<HTML>` and `</HTML>` tags. The
    data to be displayed is wrapped by `<body>` and `</BODY>`. The following, for
    instance, a minimal HTML file:


    ```

    <BODY>Minimal HTML file</BODY></HTML>

    ```


    Normally, however, an HTML file includes global settings, such as the title within
    the `<HEAD>` tag:


    ```

    <HEAD><TITLE>Minimal HTML</TITLE></HEAD>

    ```


    Web browsers will automatically wrap text. If you want an explicit line break,
    however, you can use the break tag, `<BR>` (which, unlike the tags you’ve seen
    so far, is not part of a pair).


    Text headings are identified with `<Hx>` tags that display the headings in decreasing
    font size. The following HTML, for instance, presents the screen in Figure 6.4:


    ```

    <HTML>

    <BODY>

    <h1>One:</h1><H2>Two:</H2><H3>Three:</H3>

    </BODY></HTML>

    ```'
  merge: -1
  img_proc: true
- pgno: 94
  md: '![](img/069cd06404ac5e90171e6d857bf3ad28_94_0.png)


    The HTML in Figure 6.5 shows a few other tags that center text, present an image,
    insert a hyperlink, create a numbered list, and create a bulleted list. As shown
    in Figure 6.6, the <CENTER></CENTER> pair of tags simply centers the text it contains.
    The <img> tag is used to present a graphic (normally a GIF or JPG file). The <a>
    (anchor) presents a hyperlink link to a Web site, where "Click here for cool stuff"
    is the hyperlink.


    A numbered list is identified with the <OL>.</OL> (ordered list) pair, a bulleted
    list is identified with <ul>></UL> (unordered list). Each list element in both
    the ordered and unordered list is identified with an <LI> (list item) tag (without
    a closing tag).


    ```

    <HTML>

    <BODY>

    <CENTER>Centered Text</CENTER>

    <BR>

    <IMG SRC="Java400.gif">

    <BR><BR>

    <a href="http://www.ibm.com/">

    Click here for cool stuff</a>

    <BR>

    <OL>

    <li>one

    <li>two

    </OL>

    <UL>

    <li>first

    <li>second

    </UL>

    </BODY>

    </HTML>

    ```


    Figure 6.5: A combination of simple HTML tags can be used to develop an interactive
    Web page.'
