    > Note: Variables are appended by setting them equal to their existing value (with
    the dollar operator and variable name), followed by the value to be appended.


    The topic of Java programming brings up another important variable that is not
    created by default: the Java CLASSPATH variable. CLASSPATH is to java what PATH
    is to bash. The Java Virtual Machine (JVM) looks for Java classes (which you can
    think of as Java programs) by searching through the semicolon-separated list of
    directories and Java archives (compressed Java classes) in the CLASSPATH variable.


    At the time of writing, we were working on a project that required the classes
    contained in the files jdom.jar and xerces.jar. Our CLASSPATH, at that point,
    was as follows:


