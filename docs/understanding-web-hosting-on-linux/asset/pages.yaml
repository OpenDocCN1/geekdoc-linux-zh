    init.d/postgresql script called K12postgresql, it does not contain a link to /etc/rc.d/init.d/postgresql
    preceded by an S. When Red Hat was installed, it placed the link in rc.3 that
    would shut down PostgreSQL, in case the user wanted to start PostgreSQL manually
    and forgot about it on Linux shutdown.


    Have rc.3 automatically start PostgreSQL, you would simply have to create a link
    to /etc/rc.d/init.d/postgresql called S12postgresql (where the 12 could be any
    two-digit number), with the following command:


    ```

    in /etc/rc.d/init.d/postgresql S12postgresql

    ```


    Even though the rc scripts run as a separate process, the init program waits until
    finish executing the rc entries in the initab file explicitly to say. After the
    rc scripts complete, the init program executes the rest of the entries in the
    initab file. We will skip most of them, as they are self-explanatory. However,
    take a look at the /etc/getty scripts. These script start up six virtual consoles,
    which means you can sign on six different times as six different people on the
    single system console. To toggle between virtual consoles, press Ctrl-Alt followed
    by the number of the console you wish to see.


    The only other initab entry mentioning this is:


    ```

    ca::ctrlaltdel:/sbin/shutdown -t3 -r now

    ```


    This entry causes Linux to be able to capture the Ctrl-Alt-Delete keystroke combination
    and gently shut down the system.


    # Customizing Startup


    A better way of configuring PostgreSQL to start up, rather than adding the link
    in the rc.3 directory, is to modify the script script called /etc/rc.d.local.
    Each of the rc.N directories contains a link called S99local that points to a
    file called /etc/rc.d.local. Because 99 is the largest possible number, a script
    called rc.local will always be executed last. So, instead of creating the link
    called S12postgresql, you could place the entry in the rc.local script:


    ```

    /etc/rc.d/init.d/postgresql start

    ```


    There are two advantages to this approach:


    +   - It places all your startup modifications in one script file.

    - You can ensure that your custom processes are started after all the default
    processes are initialized.


    # Signing On


    The root user is the omnipotent profile of Linux, also known as the super user.
    When Linux is installed, you are prompted for the password for the root user.
    Part of the Linux install is to create a less powerful user. As discussed in chapter
    3, Linux security is set up that all the files on the system have three levels
    of authorization: user (or owner), user group, and users who are neither the owner
    nor part of the authorized user group. The root user, being all-powerful, has
    access to all files. For security purposes, you should use the sign-on only when
    it is necessary.'
