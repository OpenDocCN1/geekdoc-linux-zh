    # # Word Completion


    Sometimes, as consultants, we have the unfortunate requirement of working in a
    Microsoft Windows environment. Microsoft''s DOS is itself a shell, although with
    a limited set of commands and features. In DOS, we miss the powerful features
    of bash. The feature we miss most is word completion. In bash, if you forget the
    name of a command, directory, or file (remember that commands and directories
    are implemented as files on UNIX), simply type the first few characters and press
    Tab. Bash will flesh out the rest of the name if there is only one match, or list
    all the files that start with those letters if you press Tab again. For instance,
    if you type the letter c and press Tab, bash will beep to tell you no exact match
    found. If you press Tab a second time, bash responds with the list of commands
    starting with c. as shown in Figure 12.1. In fact, if you press Tab twice without
    typing any character at the prompt, it will list the several thousand commands
    that are available.


    Using word completion for directory and file names comes in quite handy. For instance,
    we had a consulting gig where the files existed in /opt/tomcat/webapps/manta/WEB-INF/com/manta.
    To change to that long-winded directory, we would enter /opt/tomcat and press
    Tab to flesh out manta, then we and Tab to flesh out webapps, and so on.'
