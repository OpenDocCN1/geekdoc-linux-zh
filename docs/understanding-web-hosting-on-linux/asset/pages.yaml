    \ --%> |\n\n# Expressions\n\nJSP expressions are one of the five types of Java\
    \ code that can be contained in a JSP file. Consider this example:\n\n```\n<html><body>\n\
    Today's date <%=new java.util.Date()).toLocaleString() %>\n</body></html>\n```\n\
    \nA JSP expression simply dumps the string representation of the object that follows\
    \ the <%= tag into the dynamically generated HTML. When the JSP page is requested,\
    \ the servlet automatically generated by the Web server will dynamically insert\
    \ today's date into an HTML file. The dynamically constructed HTML file is sent\
    \ to the requesting browser and presented to the user in the following format:\n\
    \nToday's date May 29, 2001 1:57:53 PM\n\n# Request and Response Objects\n\nBecause\
    \ a JSP file ultimately becomes a servlet, the parameters that are sent to the\
    \ standard functions of a servlet, request and response, can be used in the JSP.\
