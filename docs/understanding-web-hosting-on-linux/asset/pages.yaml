  md: "primary key. Indexes enhance database performance because they optimize retrieval\
    \ based on the key of the index. Since the primary key of any table is the primary\
    \ access mechanism, it stands to reason that you should create an index by each\
    \ file's primary key. The SQL syntax to create an index is as follows:\n\n```\n\
    CREATE [UNIQUE] INDEX index name ON table name (column name[,])\n```\n\nHere are\
    \ the SQL statements to create indexes over the three accounts-receivable tables:\n\
    \n```\nCREATE UNIQUE INDEX invoice01 on invoice (InvoiceNo)\nCREATE UNIQUE INDEX\
    \ invoiceDetail01 on invoiceDetail (InvoiceNo, LineNo)\nCREATE UNIQUE INDEX customer01\
    \ on customer (CustNo)\n```\n\nThe UNIQUE keyword tells the RDB to disallowed\
    \ duplicate key values. If you create an index over another column (or columns)\
    \ of a table where the key of that index is not unique, you would omit UNIQUE.\n\
    \n# # Populating the Database\n\nAdding rows to a table is done with the SQL INSERT\
    \ command:\n\n```\nINSERT INTO table name VALUES (value1[,])\n```\n\nTo add the\
    \ rows displayed in the database Table 8.1, you would use the following commands:\n\
    \n```\nINSERT INTO customer\nVALUES (981, 'Denoncourt', 'S650 El Camino Real',\
    \ 'Carlslad', 99999, 'CA', \n8004775665')\nINSERT INTO invoice VALUES (1234, 981,\
    \ '11-Nov-1999', NULL)\nINSERT INTO invoiceDetail VALUES (1234, 1, 'Bolts', 2,\
    \ 1.98)\nINSERT INTO invoiceDetail VALUES (1234, 2, 'Washers', 15, 2.266)\n```\n\
    \nThe SQL keyword NULL means the value has explicitly not set.\n\n# # Querying\
    \ the Database\n\nCompanies consider the information in their databases to be\
    \ a corporate asset. Much of the value of a database comes from the ability of\
    \ individuals and automated processes to query it so that a business process can\
    \ act on the results of query. For example, an automated process might print labels\
    \ from information stored in a product catalog so a company's marketing department\
    \ can send mailers to all customers who ordered more than $100 worth of merchandise\
    \ in the past year. A salesperson, on the other hand, might want to interactively\
    \ view information about a specific customer along with all orders for that customer.\n\
    \nRDB queries are requested via the SQL SELECT statement, in this format:\n\n\
    ```\nSELECT *|column name[,]) FROM table name;\n```"
