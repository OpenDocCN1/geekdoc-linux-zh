  md: '# Linux Configuration and Startup • 59


    ![](img/069cd06404ac5e90171e6d857bf3ad28_74_0.png)


    # # Logging Out


    To finish this chapter’s discussion of the Linux system lifecycle, you need to
    know how to end Linux. Perhaps the most technical way is to use the **init** command,
    qualifying the option of zero. You might recall from the **ittab** discussion
    earlier in this chapter that the zero option shuts down the system. Similarly,
    to shut down and force an immediate restart, you could pass option six to the
    **init** program. There are, two easier ways to shut down: the logout option of
    your desktop or simply press the Ctrl-Alt-Delete key sequence. In the **ittab**
    file, this sequence is mapped to a command called **shutdown**, so you have yet
    another way to end Linux: invoke the **shutdown** command. This has some sophisticated
    options, such as specifying the number of seconds to wait before shutting down,
    qualifying a warning message to be sent to all connected users, and specifying
    an option to restart the system immediately after Linux shuts down.


    # # Chapter Summary


    In this chapter, you were introduced to the system lifecycle of Linux. You learned
    how Linux bootstraps itself with LILO, how the application services are started
    with the **init** program (controlled by the **ittab file), and how to customize
    what applications are automatically started. Next, you saw how to sign on to the
    system as the root, or super user, and as a normal user. Then, you were introduced
    to a basic set of Linux commands (with their DOS equivalents), to the standard
    directory structure of Linux, and to put new applications and personal files.


    Several text editors were covered: vi, pico, and Gnome’s gedit. Since gedit requires
    a graphical user interface, with X Windows, windows managers, and the desktop
    environments KDE and Gnome. Finally, you learned several options for shutting
    down Linux.'
