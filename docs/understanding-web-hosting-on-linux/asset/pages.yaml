    When that user first begins to compile and test Java applications with the javac
    and java commands, or she would have to fully qualify those commands with their
    directory locations:


    ```

    $ /opt/java/jdk1.2.2/bin/javac SomeJava.java

    $ /opt/java/jdk1.2.2/bin/java SomeJava

    ```


    To avoid wasting time entering directory paths, the user would modify the PATH
