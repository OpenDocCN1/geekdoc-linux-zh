  md: '# Table 8.5: Useful Functions in the Statement Class


    | Function | Description |

    | cancel() | Enables a thread to cancel a statement being executed by another
    thread. |

    | clearWarnings() | After this call, returns null until a new warning is reported
    for this Statement object. |

    | close() | Immediately releases a Statement''s database and JDBC resources instead
    of waiting for this to happen when it is automatically closed; in many cases.
    |

    | execute(String) | Executes an SQL statement that may return multiple results.
    |

    | executeQuery(String) | Executes an SQL statement that returns a single result.
    |

    | executeUpdate(String) | Executes an SQL INSERT, UPDATE, or DELETE statement.
    |

    | getMaxFieldSize() | Specifies (in bytes) the maximum amount of data returned
    for any column value; applies only to BINARY, VARIARY, CHAR, VARCHAR, and LONGVARCHAR
    columns |

    | getMaxRows() | Specifies the maximum number of rows a result set can contain.
    |

    | getResults() | Moves to a statement''s next result. |

    | getQueryTimeout() | Limits the number of seconds the driver will wait for a
