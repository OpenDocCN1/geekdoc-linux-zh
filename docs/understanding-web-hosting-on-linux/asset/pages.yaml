- pgno: 65
  md: 'To make it easier to use the root sign-on, Linux provides the su command (for
    "super user"). If you are logged in as a user other than root, but need root privileges,
    the su command, which prompts for the root user''s password. You can then execute
    commands that require root privileges. Be sure, however, to use the exit command
    to return to your alter-ego of a normal user with super (and potentially dangerous)
    powers. You can also use the su command while you''re logged in root to temporarily
    assume the role of a normal user. In that case, the command requires the user
    name. For instance, to temporarily run as user bill while logged in root, you''ll
    use this:


    ```

    su bill

    ```


    # # Running Linux Commands


    The Linux login screen program is known as the bash shell. Once you''ve logged
    into Linux, you can invoke thousands of commands from bash. Chapter 12 covers
    bash in detail, while this section bootstraps, to boost your knowledge of bash
    and Linux commands in general. The bash prompt defaults to your user name, the
    host name of your system, the current directory, and a dollar sign ($) if you
    are logged in as a normal user, or a pound sign (#) if you are logged in root.


    From the bash prompt, you are ready to begin mastery of Linux. Linux commands
    follow a common structure:


    ```

    command option(s) argument(s)

    ```


    Many commands, however, execute without requiring options or arguments. A starter
    set of Linux commands is shown in Table 4.1. The cd command can be used to move
    around the various directories of your file system. When you use cd, you can use
    either relative or absolute addressing. Absolute addressing means specifying the
    full directory location by preceding the directory name with a slash (/). For
    instance, to change the current directory to /usr/local you''d use the following
    command:


    ```

    cd /usr/local

    ```


    Relative addressing is used when you change your directory using a qualifier that
    is relative to your current directory. For instance, if you''re in the /usr/local
    directory, if you wanted to move up one directory and down to /usr/bin, you''d
    use the following command:


    ```

    cd ../bin

    ```


    You can go several directories by using a series of ../../. A single dot rather
    than two dots indicates the current directory.'
