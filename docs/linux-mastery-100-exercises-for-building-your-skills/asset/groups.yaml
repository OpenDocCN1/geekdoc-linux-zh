    - sort file1.txt | uniq > file2.txt


    This command sorts the lines of the file1.txt file and pipes the output to the
    uniq command. The uniq command then removes duplicates and writes the output to
    a new file, file2.txt.


    ### The Awk Command


    Another method for removing duplicates is to use the awk command. The awk command
    is a powerful scripting language for text processing. The basic syntax for removing
    duplicates with awk is:


    - awk ''!x[$0]++ file1.txt > file2.txt


    This command reads the file1.txt file and writes the output to a new file, file2.txt.
    The !x[$0]++ expression ensures that only unique lines are written to the output
    file.


    ### The uniq Command


    The uniq command is specifically designed for removing duplicates from sorted
    text files. The basic syntax for uniq is:


    - uniq file1.txt > file2.txt


    This command removes duplicates from the file1.txt file and writes the output
    to a new file, file2.txt. Note that the input file must be sorted, as uniq only
    removes consecutive duplicates.


    In conclusion, there are several methods for removing duplicates from a file in
    Linux. Whether you''re using the sort and uniq commands, the awk command, or any
    other method, these techniques help you simplify and streamline your data processing
    tasks.


    # Modifying Text Files with Regular Expressions


    Regular expressions are a powerful tool for manipulating text in the Linux command
    line. With regular expressions, you can search for specific patterns in text,
    replace text, and extract information from text files. In this article, we''ll
    explore some common techniques for modifying text files with regular expressions.


    ### The sed Command


    The sed command is one of the most used tools for working with regular expressions
    in Linux. sed stands for "stream editor" and it allows you to perform various
    transformations on a file, or on input from the command line.


    Here''s a simple example of using sed to replace all occurrences of the word "apple"
    with "banana" in a file:


    - sed ''s/apple/banana/g'' file1.txt > file2.txt


    This command takes the input from file1.txt and writes the output to file2.txt.
    The s/apple/banana/g expression tells sed to search for all occurrences of the
    word "apple" and replace them with "banana".


    The grep command is another tool that''s used in conjunction with regular expressions.
    grep allows you to search for patterns in a file, and it''s particularly useful
    when you need to extract information from a large file.


    Here''s a simple example of grep to search for all lines containing the word "apple"
    in a file:


    - grep ''apple'' file1.txt


    This command takes the input from file1.txt and outputs all lines that contain
    the word "apple".


    The awk command is another tool for working with regular expressions in Linux.
    awk is a scripting language specifically designed for text processing, and it
    provides a wide range of functionality for manipulating text.


    Here''s a simple example of awk to search for all lines containing the word "apple"
    in a file, and to print the line number with the line:


    - awk ''/apple/{print NR,$0}'' file1.txt


    This command takes the input from file1.txt and outputs the line number (NR) and
    the line itself for all lines that contain the word "apple".


    In conclusion, regular expressions are a powerful tool for working with text files
    in the Linux command line. Whether you''re using the sed command, the grep command,
    the awk command, or any other tool, these techniques can help you manipulate text
    files more efficiently and effectively.


