    Searching for text in a file is a common task when working with the Linux command
    line. There are several ways to search for text in a file, we''ll take a look
    at some of the most popular commands for doing so.


    ### The grep Command


    The grep (short for "global expression print") command is used to search for specific
    text in a file. The basic syntax for grep is:


    ```

    grep text file1.txt

    ```


    This will search for the text in the file1.txt file and display the lines that
    contain it. You can also search for text in multiple files by specifying multiple
    file names:


    ```

    grep text file1.txt file2.txt

    ```


    The grep command also has several options that you can use to customize your search.
    For example, you can use the -i option to make the search case-insensitive:


    ```

    grep -i text file1.txt

    ```


    You can use the -n option to display the line numbers of the lines that contain
    the text:


    ```

    grep -n text file1.txt

    ```


    ### The fgrep Command


    The fgrep (short for "fixed string global regular expression print") command is
