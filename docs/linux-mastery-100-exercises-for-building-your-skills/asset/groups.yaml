    # # Chapter 3: Working with Text Files


    # ## Displaying the Contents of a File


    Displaying the contents of a file is a common task when working with the Linux
    command line. There are several ways to display the contents of a file, we''ll
    take a look at some of the most popular commands for doing so.


    The cat Command


    The cat (short for "concatenate") command is used to display the contents of a
    file. It''s the simplest and quickest way to display the contents of a file. The
    basic syntax for cat is:


    ```

    cat file1.txt

    ```


    This will display the contents of the file1.txt file on the screen. If you have
    multiple files, you can concatenate them into one file by specifying multiple
    file names:


    ```

    cat file1.txt file2.txt > combined.txt

    ```


    The less Command


    The less command is used to display the contents of a file one page at a time.
    This is useful when you''re working with large files and don''t want to scroll
    through the entire file to find what you''re looking for. The basic syntax for
    less is:


    ```

    less file1.txt

    ```


    This will display the contents of the file1.txt file one page at a time, and you
    can use the arrow keys to move up and down through the file. You can also search
    for specific text by typing / followed by the text you want to find.


    The head and tail Commands


    The head and tail commands are used to display the first or last part of a file,
    respectively. The basic syntax for head is:


    ```

    head file1.txt

    ```


    This will display the first 10 lines of the file1.txt file. You can specify the
    number of lines to display using the -n option:'
  - '[PAGE 16]


    ```

    head -n 5 file1.txt

    ```


    The basic syntax for tail:


    ```

    tail file1.txt

    ```


    This will display the last 10 lines of the file1.txt file. You can specify the
    number of lines to display using the -n option:


    ```

    tail -n 5 file1.txt

    ```


    # The grep Command


    The grep (short for "global expression print") command is used to search for specific
    text in a file. The basic syntax for grep is:


    ```

    grep text file1.txt

    ```


    This will search for the text in the file1.txt file and display the lines that
    contain it. You can also search for text in multiple files by specifying multiple
    file names:


    ```

    grep text file1.txt file2.txt

    ```


    In conclusion, these are some of the most popular commands for displaying the
