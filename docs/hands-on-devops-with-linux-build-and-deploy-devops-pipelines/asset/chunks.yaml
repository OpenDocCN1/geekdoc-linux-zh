    eipassoc-07026da6c9093c86a\"\n}\n```\n\n让我们再次检查一次实例：\n\n```bash\nPS C:\\Users\\\
    1511 MXTI> aws ec2 describe-instances --query \"Reservations[*].Instances[*].{Instance:InstanceId,State:State,DNS:PublicDnsName,\
