- fmt: "\n```json\n},\n\"DNS\": \"\"\n}\n]\n]\n```\n\nThe instance does not have access\
    \ to the internet. So, we need to create an Internet Gateway for that using the\
    \ following command:\n\n```bash\nPS C:\\Users\\1511 MXTI>aws ec2 create-internet-gateway\n\
    ```\n\n```json\n{\n  \"InternetGateway\": {\n    \"Attachments\": [],\n    \"\
    InternetGatewayId\": \"igw-05d94c382dd27185b\",\n    \"Tags\": []\n  }\n}\n```\n\
    \nNow, we need to associate the Internet Gateway with the VPC, and all the instances\
    \ inside the same VPC will have access to the internet.\n\n```bash\nPS C:\\Users\\\
    1511 MXTI>aws ec2 attach-internet-gateway --internet-gateway-id igw-05d94c382dd27185b\
    \ --vpc-id vpc-0825b5c6f6a2a2429\n```\n\nEven creating the Internet Gateway and\
    \ the VPC, it is required to create a default route. Then, all the connections,\
    \ by default, will try to go through the internet first. You can check the route\
    \ tables using the following command:\n\n```bash\nPS C:\\Users\\1511 MXTI>aws\
    \ ec2 describe-route-tables\n```\n\n```json\n{\n  \"RouteTables\": [\n    {\n\
    \      \"Associations\": [\n        {\n          \"Main\": true,\n          \"\
    RouteTableAssociationId\": \"rtbassoc-0388bce2f3bf06f9b\",\n          \"RouteTableId\"\
    : \"rtb-0ba4bf0ea11f024ee\",\n          \"AssociationState\": {\n            \"\
    State\": \"associated\"\n          }\n        }\n      ],\n      \"PropagatingVgws\"\
    : [],\n      \"RouteTableId\": \"rtb-0ba4bf0ea11f024ee\",\n      \"Routes\": [\n\
    \        {\n          \"DestinationCidrBlock\": \"192.168.0.0/24\",\n        \
    \  \"GatewayId\": \"local\",\n          \"Origin\": \"CreateRouteTable\",\n  \
    \        \"State\": \"active\"\n        }\n      ],\n      \"Tags\": [],\n   \
    \   \"VpcId\": \"vpc-0825b5c6f6a2a2429\",\n      \"OwnerId\": \"360560397478\"\
    \n    }\n  ]\n}\n```\n\nThe route with the ID `rtb-0ba4bf0ea11f024ee` is associated\
    \ with the VPC `vpc-0825b5c6f6a2a2429`, which is the `vpc` that we created. Therefore,\
    \ we need to assign a new route so that every connection with the destination\
    \ to `0.0.0.0/0` will pass through our Internet Gateway, represented by the ID\
    \ `igw-05d94c382dd27185b`.\n\n```bash\nPS C:\\Users\\1511 MXTI>aws ec2 create-route\
    \ --route-table-id rtb-0ba4bf0ea11f024ee --destination-cidr-block 0.0.0.0/0 --gateway-id\
    \ igw-05d94c382dd27185b\n```\n\n```json\n{\n  \"Return\": true\n}\n```\n\nNow,\
    \ you can create a public IP address, and see if we can connect using the following\
    \ command:\n\n```bash\nPS C:\\Users\\1511 MXTI>aws ec2 allocate-address\n```\n\
    \n```json\n{\n  \"PublicIp\": \"18.156.153.94\",\n  \"AllocationId\": \"eipalloc-04066542351eff3a4\"\
    ,\n  \"PublicIpv4Pool\": \"amazon\",\n  \"NetworkBorderGroup\": \"eu-central-1\"\
    ,\n  \"Domain\": \"vpc\"\n}\n```\n\nNow, we have the public IP and we need to\
    \ assign it with the instance:\n\n```bash\nPS C:\\Users\\1511 MXTI>aws ec2 associate-address\
    \ --allocation-id eipalloc-04066542351eff3a4 --instance-id i-0d26f9c327b92b630\n\
    ```\n\n```json\n{\n  \"AssociationId\": \"eipassoc-07026da6c9093c86a\"\n}\n```\n\
    \nLet us check the instance one more time:\n\n```bash\nPS C:\\Users\\1511 MXTI>\
    \ aws ec2 describe-instances --query \"Reservations[*].Instances[*].{Instance:InstanceId,State:State,DNS:PublicDnsName,\
    \ IP:PublicIpAddress}\"\n```\n\n```json\n[\n  [\n    {\n      \"Instance\": \"\
    i-0d26f9c327b92b630\",\n      \"State\": {\n        \"Code\": 16,\n        \"\
    Name\": \"running\"\n      },\n      \"DNS\": \"\",\n      \"IP\": \"18.156.153.94\"\
    \n    }\n  ]\n]\n```\n\nNow, we have the IP address: `18.156.153.93` assigned\
    \ with the instance. We still do not have the Public DNS, but, we can try to connect\
    \ using the IP. Remember the Private Key that we saved when we created the SSH?\
    \ You will need it now:\n\n```bash\nPS C:\\Users\\1511 MXTI>ssh -i devopskey.pem\
    \ ubuntu@18.156.153.94\n```\n\n```text\nThe authenticity of host '18.156.153.94\
    \ (18.156.153.94)' can't be established.\nECDSA key fingerprint is SHA256:N5kMSWQKVwBLycjjUpzJ/AsRnRbBvDVqagBJunxCXyA.\n\
    Are you sure you want to continue connecting (yes/no)? yes\nWarning: Permanently\
    \ added '18.156.153.94' (ECDSA) to the list of known hosts.\n```\n\n```text\n\
    Welcome to Ubuntu 18.04.3 LTS (GNU/Linux 4.1)\n```\n"
