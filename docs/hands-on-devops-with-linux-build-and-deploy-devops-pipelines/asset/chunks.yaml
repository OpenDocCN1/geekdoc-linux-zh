    tests, create a new version of the image with the same name, send it to the hub,
    and download it in to your production/quality/development environment.


    # Creating Images with Dockerfile


    Now that you already know all the steps of how to create an image and how to push
    it into the hub, we can automate these steps using the `Dockerfile`. This file
    helps you to track the modifications made into an image. When you just create
    a container, install everything and create an image. It is a difficult task to
    track everything that was installed. Therefore, if you want to create a new version
    for the same application, you have to track all the dependencies and everything,
    to ensure that all the earlier dependencies are still present in the new image.


    Now, create a file, called `Dockerfile`, and we will include all the steps running
    in the container within the file:


    ```

    root@devops:~# vim Dockerfile

    from centos

    maintainer alisson.copyleft@gmail.com

    run yum clean all

    run yum install python3 python3-pip -y

    run python3 -m pip install flask

    copy app.py /srv/app.py

    expose 5000

    cmd ["python3","/srv/app.py"]

    ```


    Earlier, you have the file content, which has exactly all the commands that we
    ran within the container. The statements are self-explained, thus, you can use:


    * `from`, to specify the base image.

    * `maintainer`, to specify who is maintaining the image.

    * `run`, will execute the commands within the container.

    * `copy`, copy one file from the local machine to the container.

    * `expose`, publishes the container port.

    * `cmd`, the command which will ensure the container running.


    To create the image based on `Dockerfile`, run the following command:


    ```

    root@devops:~# docker build . -t my_new_image

    ```


    `Sending build context to Docker daemon 735.7kB`

    `Step 1/8 : from centos`

    `latest: Pulling from library/centos`

    `8a29a15cefae: Pulling fs layer`


    The Docker build will look for a `Dockerfile` inside the current directory. The
    parameter `-t` means `TAG`, which will define the image name. So, after the command
    finishes, you can just create a new container by running the following command:


    ```

    Successfully built b1b23966bb89

    Successfully tagged my_new_image:latest

    ```


    ```

    root@devops:~# docker run my_new_image

    ```


    `* Serving Flask app "app" (lazy loading)`

    `* Environment: production`

    `WARNING: This is a development server. Do not use it in a production deployment.`

    `Use a production WSGI server instead.`

    `* Debug mode: on`

    `* Running on http://0.0.0.0:5000/ (Press CTRL+C to quit)`

    `* Restarting with stat`

    `* Debugger is active!`

    `* Debugger PIN: 130-050-890`


    It easy to see that now we did not have to pass any additional parameters, because
    all of them were already passed in the `Dockerfile`. The `Dockerfile` basically
    did the same steps for us before it created a new container. If you check the
    output, you will see the following:


    `Successfully built b1b23966bb89`


    This is the container ID, and in the end the container was tagged with the name
    specified in the `docker build`:


    `Successfully tagged my_new_image:latest`


    You can directly put the repository name and push it there. Now, you already know
    the basics of Docker and it is the minimum requirement for you start to Dockerize
    your applications.


    # Conclusion


    To conclude, we could see that working with Docker is an easy task. We just have
    to apply our previous knowledge in a different area of work. Then, you can create
    a version of your environment, including Infrastructure as Code, ship it to everywhere
    you want to, but Docker, in itself, is not enough for the large production environments.
    For that, we have a chapter about Kubernetes and Docker is a requirement for us
    to work with it.


    # CHAPTER 6: Automating Your Infrastructure as Code


    This chapter aims to explain how the Infrastructure as Code works, install Vagrant,
    how to work using it, create new virtual machines in an automated way using the
    Shell Script, and set up all Infrastructure we did before.


    # Structure


    In this chapter, we will discuss the following topics:


    * Introduction to Infrastructure as Code

    * Installing Vagrant and creating virtual machines

    * Setting up a LAMP server

    * Setting up a Docker server


    # Objectives


    After studying this unit, you should be able to:


    * What is Vagrant and how it works

    * Setup a Docker environment using Vagrant automation

    * Setting up an Apache server

    * Benefits of automation


    # Introduction to Infrastructure as Code


    Infrastructure as Code is a technique used to document, version, and maintain
    the control of your infrastructure in a very similar way as you with software
    development. Then, you can create a file describing the desired state of your
    infrastructure, deploy it on a test environment, validate your code, deploy on
    a staging environment, and if everything goes well, you can proceed to the production
    environment. It is possible using pipelines; therefore, you can use the same code
    for all the environment and change the server''s sizes using the variables defined
    for each of the environments.


    # What is Vagrant and How It Works?


    In the beginning of this book, you will learn how to setup VirtualBox, download
    an ISO, create a VM, attach the ISO, and format and install the operating system.
    However, it is a recurrent task in the daily life of a DevOps engineer. Can you
    imagine yourself installing 100 VMs every day and destroying them after the working
    day to save money? It is insane. But, when we use Infrastructure as Code (IaC),
    this task becomes very easy to do, because you just need to do some clicks, and
    run some commands to create and destroy everything.


    Vagrant is a tool that can be integrated with the Virtual Box. It is responsible
    to read your code, convert it into Virtual Box commands, and also run the code
    within the VM. You need not to execute all those steps learned in the first chapter.
    HashiCorp created Vagrant and they have an official repository of images that
    you can use to setup your environment. So, you do not need to go to the official
    website, download the ISO, and setup the machine.


    # Vagrant installing


    You can download Vagrant from the following link:


    **[https://www.vagrantup.com/downloads.html](https://www.vagrantup.com/downloads.html)**


    I am using Windows, so I will download the MSI version.

