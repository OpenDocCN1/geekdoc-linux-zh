    ```


    `此目录下已放置一个 ''Vagrantfile''。你现在已准备好 ''vagrant up'' 你的第一个虚拟机环境了！请阅读 Vagrantfile
    中的注释以及 ''vagrantup.com'' 上的文档以获取更多关于使用 Vagrant 的信息。`


    `PS C:\Users\1511 MXTI\VagrantChapter>`


    命令 `vagrant init` 会创建一个示例文件，包含大多数虚拟机情况的常用配置。让我们查看文件内容：


    ```

    PS C:\Users\1511 MXTI\VagrantChapter> cat .\Vagrantfile

    ```


    # -*- mode: ruby -*-

    # vi: set ft=ruby :

    # 所有 Vagrant 配置都在下方完成。Vagrant.configure 中的

    # "2" 配置了配置版本（为了向后兼容，我们支持旧的样式）。

    # 除非你清楚自己在做什么，否则请不要更改它。

    Vagrant.configure("2") do |config|

    # 最常用的配置选项在下方提供了文档和注释。

    # 如需完整参考，请参阅在线文档：

    # https://docs.vagrantup.com。

    # 每个 Vagrant 开发环境都需要一个 box（镜像）。你可以在

    # https://vagrantcloud.com/search  boxes。

    config.vm.box = "base"

    # 禁用自动 box 更新检查。如果你禁用了此项，则

    # 只有在用户运行 ''vagrant box outdated'' 时才会检查更新。

    # 这不建议这样做。

    # config.vm.box_check_update = false

    # 创建转发端口映射，允许从宿主机的端口

    # 访问虚拟机内的特定端口。在下面的示例中，

    # 访问 "localhost:8080" 将访问虚拟机上的 80 端口。

    # 注意：这将启用对打开端口的公共访问

    # config.vm.network "forwarded_port", guest: 80, host: 8080

    # 创建转发端口映射，允许从宿主机的端口

    # 访问虚拟机内的特定端口，并仅允许通过 127.0.0.1 访问禁用公共访问

    # config.vm.network "forwarded_port", guest: 80, host: 8080, host_ip: "127.0.0.1"

    # 创建私有网络，允许使用特定的 IP

    # 仅主机访问虚拟机。

    # config.vm.network "private_network", ip: "192.168.33.10"

    # 创建公共网络，通常对应于桥接网络。

    # 桥接网络使虚拟机看起来像你网络上的另一个物理设备。

    # config.vm.network "public_network"

    # 向虚拟机虚拟机共享额外的文件夹。第一个参数是

    # 宿主机上实际文件夹的路径。第二个参数是

    # 虚拟机上挂载文件夹的路径。可选的第三

    # 参数是一组非必需选项。

    # config.vm.synced_folder "../data", "/vagrant_data"

    # 特定提供者的配置，允许你对 Vagrant 的各种

    # 后端提供者进行微调。这些提供了特定的选项。

    # VirtualBox 示例：

    #

    # # 在启动机器时显示 VirtualBox GUI

    # vb.gui = true

    #

    # # 自定义虚拟机的内存量：

    # vb.memory = "1024"

    # end

    #

    # 查看你正在使用的提供者的文档以获取有关可用选项的 更多信息。

    # 使用 shell 脚本启用配置（provisioning）。其他可用配置器

    # 如 Ansible, Chef, Docker, Puppet 和 Salt。请查看文档

    # 获取更多关于其特定语法和使用的信息。

    # config.vm.provision "shell", inline: <<-SHELL

    # apt-get update

    # apt-get install -y apache2

    # SHELL

    end

    ```


    在同一个文件夹中，运行以下命令：


    ```

    PS C:\Users\1511 MXTI\VagrantChapter> vagrant status

    ```


    当前机器状态：

    default not created (virtualbox)


    这意味着我们有一个名为 `default` 的虚拟机（VM），但它还没有被创建。所以，我们将创建一个。


    示例文件包含一些配置和许多注释，简要解释了这些命令的作用。该文件使用默认配置允许你只创建一个虚拟机。在本章中，我们将创建两个虚拟机，一个安装了 LAMP 服务器，另一个安装了
    Docker。我将修改该文件，并解释示例文件与新文件之间的差异：


    ```ruby-ruby

    # -*- mode: ruby -*-

    # vi: set ft=ruby :

    Vagrant.configure("2") do |config|

    config.vm.box = "ubuntu/focal64"

    config.vm.box_check_update = false

    config.vm.provider "virtualbox" do |vb|

    vb.memory = "1024"

    end

    config.vm.define "lamp" do |lamp|

    lamp.vm.network "private_network", ip: "192.168.33.10"

    lamp.vm.provision "shell", inline: <<-SHELL

    apt-get clean

    apt update -y

    SHELL

    end

    config.vm.define "docker" do |docker|

    docker.vm.network "private_network", ip: "192.168.33.11"

    docker.vm.provision "shell", inline: <<-SHELL

    apt-get clean

    apt update -y

    SHELL

    end

    config.vm.provision "shell", inline: <<-SHELL

    apt-get clean

    apt update -y

    SHELL

    end

    ```


    前面的文件是我修改后的。它比示例文件更简洁，并且做了更多。让我们运行 `vagrant status` 看看发生了什么：


    ```

    PS C:\Users\1511 MXTI\VagrantChapter> vagrant status

    ```


    当前机器状态：

    lamp      not created (virtualbox)

    docker  not created (virtualbox)


    有趣的是，现在我们有两个虚拟机，一个名为 `lamp`，另一个名为 `docker`。它们还没有被创建。在新文件中，我使用了名为 `multi-machine`
    的 Vagrant 资源。它允许在一个文件中创建多个机器。


    现在，让我们分析文件以及在创建虚拟机之前会发生什么：


    ```ruby

    config.vm.box = "ubuntu/focal64"

    config.vm.box_check_update = false

    config.vm.provider "virtualbox" do |vb|

    vb.memory = "1024"

    end

    ```


    这部分 `config.vm` 是适用于文件中声明的所有虚拟机的通用配置。因此，所有机器将具有 1024 MB 的内存。`config.vm.box` 是将在虚拟机使用的镜像。在我们的案例中，我们将使用
    Ubuntu 服务器，版本 20.04：


    ```ruby

    config.vm.define "lamp" do |lamp|

    lamp.vm.network "private_network", ip: "192.168.33.10"

    lamp.vm.provision "shell", inline: <<-SHELL

    apt-get clean

    apt update -y

    SHELL

    end

    ```


    在这一部分，我们为 `lamp` 机器提供了本地配置。它是专门为名为 `lamp` 的虚拟机设置的。然后，在这个定义的虚拟机将具有 IP 地址 `192.168.33.10`，以及在配置中运行的命令，即在此部分：`lamp.vm.provision`。它也适用于
    Docker 虚拟机：


    ```ruby

    config.vm.provision "shell", inline: <<-SHELL

    apt-get clean

    apt update -y

    SHELL

    ```


    在最后一部分，我们有 `config.vm.provision`。在这个块中，你可以定义在所有虚拟机中运行的命令，但 `lamp.vm.provision`（它仅在
    lamp 虚拟机中运行）和 `docker.vm.provision`（它仅在 Docker 虚拟机中运行）除外。


