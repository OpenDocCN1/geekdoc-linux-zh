    \n# 第 1 章\n\n# 开始使用 Linux\n\n本章将向你介绍 Linux 世界，重点关注服务器。因此，我不会在桌面端进行解释。你将看到关于 Linux\
    \ 的解释、为什么你应该了解它、它的基本概念以及很多命令。我是一个技术人员，所以做好准备，因为你将看到如何亲手搭建你的实验室！\n\n# 结构\n\n在本章中，我们将讨论以下主题：\n\
    \n*   什么是 Linux\n    *   发行版\n    *   服务器\n*   搭建你的环境\n    *   安装 `VirtualBox`\n\
    \    *   安装 Linux 系统\n*   通过 `SSH` 访问\n*   `Bash` 简介\n    *   实用命令\n    *   基础文件以及如何编辑它们\n\
    \    *   自定义你的 shell\n    *   安装包\n\n# 目标\n\n学习完本单元后，你应该能够：\n\n*   理解 Linux 的基础知识\n\
    *   选择你喜欢的发行版\n*   安装你的虚拟机\n*   访问任何远程 Linux 服务器\n\n# 什么是 Linux？\n\n在我看来，如果你买了这本书，你可能对\
    \ Linux 是什么有了基本概念，并且已经知道为什么要学习它。总结来说，Linux 是一个具有开源代码的操作系统，工作与著名的 Windows 类似，但不属于任何公司。那么，代码是如何开源的？每个人都可以通过这个网站下载\
    \ Linux 核心：[`www.kernel.org/`](https://www.kernel.org/)，如果你感兴趣想看看源代码，可以在这个链接找到：[`git.kernel.org/`](https://git.kernel.org/)。\n\
    \nLinux 取这个名字是因为它的创造者 *Linus Torvalds*。前三个字母是 Linus 的首字母，后两个字母来自另一个名为 Minix 的操作系统，它是由一个名叫\
    \ *Andrew Tanenbaum* 的人创建的。\n\n"
