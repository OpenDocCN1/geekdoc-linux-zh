    \n现在，我们将基于 CentOS 镜像创建一个新容器，并在这个容器中放入我们在上一节中学到的 Python 应用程序：\n\n```\nroot@devops:~#\
    \ docker run -ti --name python_app -p 5000:5000 centos /bin/bash\n```\n\n```\n\
    [root@ce7f74b0304a /]#\n```\n\n现在的创建速度明显比第一次快。这是因为 CentOS 镜像已经存在于我们的本地仓库中了。因此，Docker\
    \ 不需要重新下载它。\n\n使用以下命令在容器中安装依赖项：\n\n```\n[root@ce7f74b0304a /]# yum clean all &&\
    \ yum install python3 python3-pip -y\n```\n\n```\nFailed to set locale, defaulting\
