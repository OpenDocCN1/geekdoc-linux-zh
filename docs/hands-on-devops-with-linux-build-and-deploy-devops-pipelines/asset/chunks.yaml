    # Chapter 10


    # Continuous Integration and Continuous Delivery Using Jenkins


    This chapter aims to introduce you to the concept of Pipelines, `CI` (`Continuous
    Integration`), and `CD` (`Continuous Delivery`). It also gives an introduction
    to Jenkins, the most famous CI/CD platform and open-source.


    # Structure


    In this chapter, we will discuss the following topics:


    * Pipelines

    * Continuous Integration

    * Continuous Delivery

    * Pipeline as Code and Jenkins


    # Objectives


    After studying this unit, you should be able to:


    * Know about DevOps pipelines

    * Differentiate and how to implement CI/CD

    * Create your pipelines as code using Groovy and Jenkins

    * Deploy an application using Vagrant, Docker, and Jenkins


    # Pipelines


    We can define a pipeline as a sequence of steps, which will take one thing from
    a starting point to an ending point, following a predefined path. In our case,
    when the code enters the pipeline, we have to check many things, like the code
    quality, best practices, running tests, generating a `ZIP` file, and it can be
    increased as much as you want. At the end of your pipeline, you will have your
    code with quality, following the best practices and ready to deploy everything
    in an automated way. It helps you improve the quality of your product or infrastructure,
    and speed up the process, as no one has to test each part of the pipeline. For
    some pipelines, the DevOps practices defined specific names, like Continuous Integration
    and Continuous Delivery.


    # Continuous Integration


    Usually, when we are developing a software, we have many stages where our application
    goes through before reaching the end customer. Currently, we have these most common
    stages:


    * **Development**: Where the developers can test the applications, fix bugs, and
    validate new requests. In this environment, we can break everything.

    * **Staging**: A copy of the production environment, but just for business team
    to validate the requirements. In this environment, we can have failures.

    * **Production**: This environment is where the application is in production,
    with everything validated, tested, and ready for end customer.


    The goal is to deliver the applications as much we can to avoid problems.


    The Continuous Integration pipeline is created to connect all the environment.
    For example, in development stage, we have to follow some of the following tests:


    * **Unit tests**: This test aims to validate the business rules for each part
    of our code, like classes, methods, functions, or whatsoever. But, these are the
    simplest tests that you can do. For example, you can receive the task of creating
    a function where you need to sum 2 numbers. Your test will pass the numbers to
    that function and check if you are returning the expected result.

    * **Integration tests**: Here, you will have to test a business case. For example,
    you created an `API`. Your end customer will make a request sending 2 parameters
    and he is expecting a JSON response with a product data. In this case, we do not
    need to check what is happening in the source code of your `API`, we just need
    to make sure that when we receive those 2 parameters, we will return the JSON
    with product data.

    * **End-to-end**: This is the hardest test that you have in your application.
    It will test your entire system, each functionality in detail impersonating a
    real customer. It takes a lot of time to be developed, so, most of the companies
    stop at integration tests.

    * **Quality test**: This test is used more to check the quality of your code.
    If you are following the best practices, if you are creating reusable codes, and
    not just copying and pasting code everywhere in your code, which will make the
    maintenance harder.


    Of course, those tests that I explained are just common tests that you will find
    in most of the companies that you will work. However, there are more ways of testing
    applications. It can vary from project to project and company to company.


    Once we pass in all these tests, we have to make our application go to other teams
    who will also test the application, many times in a manual way, to make sure that
    the developer understood what the requirements are and how we need to code our
    product. This is where we have the Continuous Delivery.


    # Continuous Delivery


    In this stage, the developer did all work they were delegated to do. But, of course,
    we can have many communication problems between the client request and the software
    delivery.

