    know more about that, you can check the documentation later on. But, for now,
    the most important thing is to see if it is working. So, let''s run the `ElastAlert`
    with the following command:


    `root@efk:~#` **`elastalert --rule rules/alert_404.yml --verbose`**


    `1 rules loaded`


    `INFO:elastalert:Starting up`


    `INFO:elastalert:Disabled rules are: []`


    `INFO:elastalert:Sleeping for 9.999665 seconds`


    Now, you can try to access a non-existing page, like the following screenshot:


    ![](images/Figure-12.10.jpg)


    **Figure 12.10**


    This access should generate a log with the `404` status. You probably saw a log
    like this on `ElastAlert`:


    `INFO:elastalert:Queried rule Alerting 404 from 2020-06-30 18:54 UTC to 2020-06-30
    18:57 UTC: 2 / 2 hits`


    `INFO:elastalert:Ran Alerting 404 from 2020-06-30 18:54 UTC to 2020-06-30 18:57
    UTC: 2 query hits (2 already seen), 0 matches, 0 alerts sent`


    `INFO:elastalert:Background configuration change check run at 2020-06-30 18:57
    UTC`


    `INFO:elastalert:Background alerts thread 0 pending alerts sent at 2020-06-30
    18:57 UTC`


    It means that our alert is working and I should have received a notification on
    Slack:


    ![](images/Figure-12.11.jpg)


