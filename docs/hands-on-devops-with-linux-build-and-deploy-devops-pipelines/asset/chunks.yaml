    \ always, we will choose the `UbuntuServer`. Therefore, you can create the VM\
    \ by running the following command:\n\n```bash\nPS C:\\Users\\1511 MXTI> az vm\
    \ create -n vm1 -g book --image Canonical:UbuntuServer:18.04-LTS:latest --admin-username\
    \ ubuntu\n```\n\n```json\n{\n  \"fqdns\": \"\",\n  \"id\": \"/subscriptions/55465d5a-355d-43d1-85ce-9e518c812c0c/resourceGroups/book/providers/Microsoft.Compute/virtualMachines/vm1\"\
    ,\n  \"location\": \"eastus\",\n  \"macAddress\": \"00-0D-3A-9A-DF-E9\",\n  \"\
    powerState\": \"VM running\",\n  \"privateIpAddress\": \"10.0.0.4\",\n  \"publicIpAddress\"\
    : \"52.224.120.36\",\n  \"resourceGroup\": \"book\",\n  \"zones\": \"\"\n}\n```\n\
    \nFor the image name, we usually refer to the `URN` (`Uniform Resource Name`),\
    \ which is the identification for the image. The parameter, `--admin-username`\
    \ is the user who will have the access to run `sudo` and do the administrative\
    \ tasks.\n\nThe Azure command line is smart enough to get your default SSH-key\
    \ and add it into the VM. Therefore, to connect, you can just run an SSH command\
    \ as default and login:\n\n```bash\nPS C:\\Users\\1511 MXTI> ssh ubuntu@52.224.120.36\n\
    ```\n\n`The authenticity of host '52.224.120.36 (52.224.120.36)' can't be established.`\n\
    `ECDSA key fingerprint is SHA256:F/Tb2nXVw4B3aertXLsde0wUTzNkBzu+aOwFHEFpl/A.`\n\
    `Are you sure you want to continue connecting (yes/no)? yes`\n`Warning: Permanently\
    \ added '52.224.120.36' (ECDSA) to the list of known hosts.`\n`Welcome to Ubuntu\
    \ 18.04.4 LTS (GNU/Linux 5.0.0-1036-azure x86_64)Welcome to Ubuntu 18.04.4 LTS\
    \ (GNU/Linux 5.0.0-1036-azure x86_64)`\n`ubuntu@vm1:~$`\n\nNow that you have everything\
    \ up and running, we can delete everything to avoid some unexpected costs, except\
    \ the ones we are studying:\n\n```bash\nPS C:\\Users\\1511 MXTI> az group delete\
    \ --name book\n```\n\n`Are you sure you want to perform this operation? (y/n):\
    \ y`\n`PS C:\\Users\\1511 MXTI>`\n\nYou can be relieved now and be sure that everything\
    \ we created before will cost.\n\n# Conclusion\n\nI showed you how to create a\
    \ VM in three of the main Cloud players. On Amazon, I showed with so much more\
    \ details than the other competitors. But I do not mean that it is harder than\
    \ the other. It was just my explanation. Currently, I am working with Azure. But\
    \ in the past, I have worked with Amazon and Google as well. Therefore, in my\
    \ view, a good DevOps engineer should be able to work with all the platforms.\
    \ The concepts are same and you can deliver the same essential infrastructure.\
    \ There is another concept which is called Multicloud, which aims to use all the\
    \ Clouds together and you can retrieve the best from each one, like authenticating\
    \ your users and services using Azure Active Directory, creating the VMs using\
    \ Amazon EC2, and query your data using the Big Query on Google.\n\n# Working\
    \ with Terraform\n\nThis chapter aims to introduce you to Terraform, a tool to\
    \ help you with the Multicloud concept, allowing you to create the same infrastructure\
    \ among all the Cloud players in the same automated way.\n\n# Structure\n\nIn\
    \ this chapter, we will discuss the following topics:\n\n* Multicloud\n* HashiCorp\n\
    * Introduction to Terraform\n* Creating the Infrastructure\n\n# Objectives\n\n\
    After studying this unit, you should be able to:\n\n* Know about HashiCorp tools\n\
    * Explain what Multicloud is\n* Use Terraform to provide Infrastructure\n* Have\
    \ all your Infrastructure as Code\n\n# Multicloud\n\nWe learned in the previous\
    \ chapter that there are many Cloud providers available. The most famous are AWS,\
    \ GCP, and Azure. But, we also have other options like IBM Cloud, Oracle Cloud,\
    \ Digital Ocean, etc. Each one of these has its services, which can be the criteria\
    \ for you to decide among them. However, what can you do when you need the services\
    \ from each one of them? For example, you must use an Active Directory Authentication,\
    \ which is only available on Azure, but you also need BigQuery to analyze your\
    \ data, and it is only available on GCP, and you also need to use the DynamoDB,\
    \ which is only available on AWS.\n\n# HashiCorp\n\nHashiCorp is a company that\
    \ created many tools to help you with infrastructure management. In their stack,\
    \ you can find the following tools:\n\n*   `Packer` (`https://www.packer.io/`):\
    \ This is a tool to create your own images.\n*   `Vagrant` (`https://www.vagrantup.com/`):\
    \ You already know that tool. We have created Virtual Machines with it.\n*   `Nomad`\
    \ (`https://www.hashicorp.com/products/nomad/`): It is an orchestrator to deploy\
    \ your applications among different environments.\n*   `Consul` (`https://www.hashicorp.com/products/consul/`):\
    \ It is commonly used as Service Discovery and Service Mesh.\n*   `Vault` (`https://www.hashicorp.com/products/vault/`):\
    \ It is a tool made to manage your secrets.\n*   `Terraform` (`https://www.hashicorp.com/products/terraform/`):\
    \ It is our focus in this chapter.\n\n# Introduction to Terraform\n\nTerraform\
    \ is a tool to create and manage your Infrastructure as Code like we did using\
    \ `Vagrant`, but here, with more details and using public Clouds with focus on\
    \ productions environments, not just laboratories, as we did earlier.\n\nYou can\
    \ download the open-source version by the following link: `https://www.terraform.io/downloads.html`.\n\
    \nYou just need to unzip the file and include the path in the `PATH` environment\
    \ variable. After that, you need to run the following command:\n\n```bash\nPS\
    \ C:\\Users\\1511 MXTI> terraform --version\n```\n\n`Terraform v0.12.24`, which\
    \ is the installation of Terraform.\n"
