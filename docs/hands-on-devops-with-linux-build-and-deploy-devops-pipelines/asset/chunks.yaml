    多年前，我会向你详细解释 Linux 上的重要目录，这是在目录和分区之间划分磁盘的最佳方法。但现如今，当我们与虚拟机一起工作时，这已经不那么重要了。我们可以把
    Amazon EC2 实例作为一个例子。它们甚至没有 SWAP 分区。如果你缺少空间，只需在根分区中增加空间并清理你的服务器即可。另一个重要的点是 `/var`
    目录。我现在不会深入讨论这个话题，但它是存储 Linux 系统日志的目录。因此，它们经常占用你大量的空闲空间，我们必须经常清理它。多年前，我会要求你将其划分为不同的分区。但今天，我们有工具将日志发送到
    `Log Server`，我们可以每天从本地机器上删除日志。不过，请选择 `Use An Entire Disk`（使用整个硬盘）：


    ![](img/Figure-1.22.jpg)


    **图 1.22**


    现在，选择安装操作系统的物理设备，并按 `Enter`：


    ![](img/Figure-1.23.jpg)


    **图 1.23**


    接下来的屏幕显示了磁盘是如何分区的。我们可以看到有一个 `Physical Device`（物理设备）、`VBOX_HARDDISK`，它被分为两个部分。启动分区是启动系统所必需的，也是引导加载程序安装的地方。


    `root` 分区，也称为 `/`。只需选择 `Done`（完成）：


    ![](img/Figure-1.24.jpg)


    **图 1.24**


    在这里，我们将创建第一个用户，然后我将定义以下数据：


    *   你的名字：`alisson` - 这只是你的真实名字，但不会被用于任何地方。

    *   你的服务器名称：`devops` - 这是你机器的主机名

    *   选择用户名：`alisson` - 这就是你访问服务器时实际使用的用户

    *   选择一个密码：`devops`

    *   确认你的密码：`devops`


    按 `Done`。


    ### 注意！


    接一步非常重要。默认没有安装 OpenSSH 服务器，所以你必须选择该选项并安装 OpenSSH 服务器。你可以使用 `Tab` 键切换选项。否则，你将无法从远程连接访问你的服务器：


    ![](img/Figure-1.25.jpg)


    **图 1.25**


    现在你已经选择了正确的选项，按 `Done`：


    ![](img/Figure-1.26.jpg)


    **图 1.26**


    现在，你需要为你的服务器选择一个安装 `Template`（模板），例如 Nextcloud 服务器。或者，如果你打算运行 Kubernetes，可以选择
    `microk8s`，但这不是我们想要的。所以，按 `Tab` 将选项更改为 `Done`，然后按 `Enter`：


    ![](img/Figure-1.27.jpg)


    **图 1.27**


    现在，你的安装已经开始。这可能需要一段时间时间，因为 Ubuntu 将下载更新和一些重要的软件包。你没有义务进行更新。但在我看来，对于学习 Linux 的人来说，拥有一个更新的系统是很重要的。只需等待安装完成，当
    Ubuntu 询问你 `Reboot`（重启）时，执行。重启后，你将看到以下屏幕：


    ![](img/Figure-1.28.jpg)


    **图 1.28**


    输入你在安装期间定义的凭据：


    ```

    login: alisson

    password: devops

    ```


    现在你已经进入了 Linux Shell。从现在开始，你将能够运行命令、安装软件包并对你的服务器做任何你想做的事。这个访问控制台正是你在数据中心内部时会进行的操作。将一个
    `KVM`（键盘视频显示器鼠标）连接到服务器并运行命令。我在做托管（Colocation）时做过很多次。这是一种业务模式，你可以购买自己的物理服务器并将其安装在别人的数据中心内部。因此，你将使用数据中心的基础，但服务器属于你。


    除非你在数据中心内部工作，否则它并不常用用。如果你仍然登录在机器上，请运行以下命令：


    ```bash

    ip a

    ```


    上一个命令将显示你所有的网络接口及其 IP 地址，如下截图所示：


    ![](img/Figure-1.29.jpg)


    **图 1.29**


    我们只有 2 个 IP 地址和 2 个接口：


    ```

    Interface: lo

    IP Address: 127.0.0.1

    ```


    这是本地 IP 地址。它用于在不离开机器的情况下建立 TCP/IP 连接：


    ```

    Interface: enp0s3

    IP Address: 10.0.2.15

    ```


    这是一个 NAT 接口。我们需要这个接口只是为了建立连接。但我们无法使用此配置从外部访问机器。它仅用于安装目的。我们本可以在之前更改它。然而，我想向你展示如何更改该配置以及为什么我们需要这样做。


    要更改此配置，回到 VirtualBox 的主界面。现在，点击虚拟机，然后点击 `Settings`（设置） | `Network`（网络）。在这一部分 `Attached`（连接），你会看到值
    Nat。将其更改为 `Bridge Network`（桥接网络），并在 `Name`（名称）选项中：选择你具有互联网访问的网络接口。在我的情况下，配置如下所示：


    ![](img/Figure-1.30.jpg)


    **图 1.30**


    保存配置后，回到你的虚拟机并再次运行以下命令：


    ```bash

    ip a

    ```


    你将看到一个新的 IP 地址。在我的情况下，绑定了 `192.168.178.62`：


    ![](img/Figure-1.31.jpg)


    **图 1.31**


    # 通过 SSH 访问


    我们现在有了从外部的连接。那么，我们如何使用 SSH 连接到那台机器呢？过去，使用 Putty 等工具从 Windows 机器 SSH 连接到服务器很常见，但在新版本的
    Windows 中，我们有了 PowerShell，它是默认安装的，我们可以用它来访问虚拟机。


    如果你使用 Windows，请打开 PowerShell；如果是 Linux/MacOS，打开 Terminal，运行以下命令：


    ```bash

    ssh alisson@192.168.178.62

    ```


    命令遵循 `USER@HOSTNAME` 结构。如果你没有配置主机名，可以使用 IP 地址。之后按 `Enter`。它将向你显示以下消息：


    ```

    The authenticity of host ''192.168.178.62 (192.168.178.62)'' can''t be established.

    ECDSA key fingerprint is SHA256:GX474/IAL/VeIoiV/r6WoPZHRg3HfFTS3tfvigA9jKM.

    Are you sure you want to continue connecting (yes/no)? yes

    Warning: Permanently added ''192.168.178.62'' (ECDSA) to the list of known hosts.

    ```


    发生这种情况是因为这是你第一次连接到该服务器。你只需输入 `Yes` 来确保你想要连接它，然后 SSH 将向你要密码：


    ```

    alisson@192.168.178.62''s password:

    ```


    输入你在安装期间定义的密码。在我的情况下，它是 DevOps，你将再次访问 Linux Shell：


    ```

    Welcome to Ubuntu 18.04.3 LTS (GNU/Linux 4.15.0-76-generic x86_64)Welcome to Ubuntu
    18.04.3 LTS (GNU/Linux 4.15.0-76-generic x86_64)

    * Documentation:      https://help.ubuntu.com

    * Management:         https://landscape.canonical.com

    * Support:            https://ubuntu.com/advantage

    System information as of Fri Jan 31 20:04:07 UTC 2020

    System load:  0.0                             88

    Usage of /:   39.0% of 9.78GB  Users logged in:  1

    Memory usage: 15%                            IP address for enp0s3:  192.168.178.62

    Swap usage:   0%

    61 packages can be updated.

    0 updates are security updates.

    Last login: Fri Jan 31 19:41:36 2020

    To run a command as administrator (user "root"), use `sudo <command>`.

    See `man sudo_root` for details.

    alisson@devops:~$

    ```


    有很多关于加密 SSH 连接的理论和概念，我们还有 `known_hosts` 文件。如果你想成为 Linux 专家，这很重要，但对我们现在来说并不那么重要。


