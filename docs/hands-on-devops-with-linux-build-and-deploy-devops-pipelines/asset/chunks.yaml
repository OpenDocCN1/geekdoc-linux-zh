    # [Conclusion](#toc.xhtml_s86a)


    We just learned how to create a pipeline as code using Jenkins, run code quality
    checks, functional tests, create an image based on a functional application, and
    deploy it on the top of a Docker server.


    We could see that it is not an extremely hard task. Of course, as complex as is
    your project, more complex will be your pipeline. For example, in the initial
    steps, we were able to run everything on Jenkins by itself. By the final steps,
    we had to add a node and run on top of it. We also learned new information about
    Docker, for example, some parameters to start the container every time that the
    server has started. It is also possible to build an image using a Dockerfile hosted
    directly in a remote repository.


    I am pretty sure this introduction will give you the start for creating your pipelines
    which will fit perfectly with your projects.


