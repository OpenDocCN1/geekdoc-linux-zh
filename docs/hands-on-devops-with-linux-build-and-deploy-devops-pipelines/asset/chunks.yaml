    # [Conclusion](#toc.xhtml_s67a)


    I showed you how to create a VM in three of the main Cloud players. On Amazon,
    I showed with so much more details than the other competitors. But I do not mean
    that it is harder than the other. It was just my explanation. Currently, I am
    working with Azure. But in the past, I have worked with Amazon and Google as well.
    Therefore, in my view, a good DevOps engineer should be able to work with all
    the platforms. The concepts are same and you can deliver the same essential infrastructure.
    There is another concept which is called Multicloud, which aims to use all the
    Clouds together and you can retrieve the best from each one, like authenticating
    your users and services using Azure Active Directory, creating the VMs using Amazon
    EC2, and query your data using the Big Query on Google.


    # [CHAPTER 8](#toc.xhtml_c08)


    # [Working with Terraform](#toc.xhtml_c08)


    This chapter aims to introduce you to Terraform, a tool to help you with the Multicloud
    concept, allowing you to create the same infrastructure among all the Cloud players
    in the same automated way.


    # [Structure](#toc.xhtml_s68a)


    In this chapter, we will discuss the following topics:


    *   Multicloud


    *   HashiCorp


    *   Introduction to Terraform


    *   Creating the Infrastructure


    # [Objectives](#toc.xhtml_s69a)


    After studying this unit, you should be able to:


    *   Know about HashiCorp tools


    *   Explain what Multicloud is


    *   Use Terraform to provide Infrastructure


    *   Have all your Infrastructure as Code


    # [Multicloud](#toc.xhtml_s70a)


    We learned in the previous chapter that there are many Cloud providers available.
    The most famous are AWS, GCP, and Azure. But, we also have other options like
    IBM Cloud, Oracle Cloud, Digital Ocean, etc. Each one of these has its services,
    which can be the criteria for you to decide among them. However, what can you
    do when you need the services from each one of them? For example, you must use
    an Active Directory Authentication, which is only available on Azure, but you
    also need BigQuery to analyze your data, and it is only available on GCP, and
    you also need to use the DynamoDB, which is only available on AWS. In the end,
    you have an on-premises infrastructure based on OpenStack. Therefore, when you
    need to use many Cloud providers, we call that scenario Multicloud. The challenge
    now is how to manage all that Infrastructure in the same way, and perhaps, by
    using the same tools.


    # [HashiCorp](#toc.xhtml_s71a)


    HashiCorp is a company that created many tools to help you with the task of managing
    infrastructure among different scenarios, like AWS, GCP, Azure, Digital Ocean,
    etc. We already have experience using their tools; Vagrant is one of the tools
    from HashiCorp stack which we can use for our development environments. In their
    stack, you can find the following tools:


    *   **Packer ([https://www.packer.io/](https://www.packer.io/)):** This is a tool
    to create your own Cloud images. In the Vagrant chapter, we used the Ubuntu Cloud
    image to create our VMs, but if you want to create a custom image with your application
    or after running a security pipeline.


    *   **Vagrant ([https://www.vagrantup.com/](https://www.vagrantup.com/)):** You
    already know that tool. We have created many Virtual Machines and tested the applications.


    *   **Nomad ([https://www.hashicorp.com/products/nomad/](https://www.hashicorp.com/products/nomad/)**
    **):** It is an orchestrator to deploy your applications among different environments,
    like the public Clouds or the private Clouds.


    *   **Consul ([https://www.hashicorp.com/products/consul/](https://www.hashicorp.com/products/consul/)):**
    It is commonly used as a Service Discovery and Service Mesh.


    *   **Vault ([https://www.hashicorp.com/products/vault/](https://www.hashicorp.com/products/vault/)):**
    It is a tool made to manage your secrets. It is an alternative for the secret
    services on Cloud like Azure Secret, but, of course, with some differences, like
    rotate the secrets automatically.


    *   **Terraform ([https://www.hashicorp.com/products/terraform/](https://www.hashicorp.com/products/terraform/)):**
    It is our focus in this chapter. I will show you how to create the Infrastructure
    in an easy way and have the control among some code files.


    # [Introduction to Terraform](#toc.xhtml_s72a)


    Terraform is a tool to create and manage your Infrastructure as Code like we did
    using Vagrant, but here, with more details and using public Clouds with focus
    on productions environments, not just laboratories, as we did earlier.


    You can download the open-source version by the following link:


    **[https://www.terraform.io/downloads.html](https://www.terraform.io/downloads.html)**


    You just need to unzip the file and include the path in the `PATH` environment
    variable. After that, you need to run the following command:


    `PS C:\Users\1511 MXTI>` **`terraform--version`**


    `Terraform v0.12.24`


    **If you have problems with the installation, HashiCorp has a tutorial explaining
    how to do it step-by-step: [https://learn.hashicorp.com/tutorials/terraform/install-cli](https://learn.hashicorp.com/tutorials/terraform/install-cli)**


    The current version is v0.12.24, which is the installation of Terraform.'
