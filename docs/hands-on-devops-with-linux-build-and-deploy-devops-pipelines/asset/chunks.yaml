  trans: '

    要在你的笔记本电脑或个人电脑上运行虚拟机（VM），你需要检查你的处理器架构是否为 64 位。此规格可以在笔记本电脑制造商或处理器制造商处找到。检查完此设置后，你需要在设备的
    BIOS 或 UEFI 中启用虚拟化。此配置可能因设备而异，但在大多数情况下，可以在 `Advanced` 或 `Security` 选项中找到名为 Intel
    Virtualization Technology 的项目。


    # 安装 VirtualBox


    现在我们有很多虚拟化工具可以在笔记本电脑上运行，例如 VMware Player、KVM、QEMU、HyperV。但在我看来，VirtualBox 是最简单的一个，并且包含了我们创建实验室所需的所有功能。


    要安装 VirtualBox，你需要从官方网站下载最新版本：


    [`www.virtualbox.org/wiki/Downloads`](https://www.virtualbox.org/wiki/Downloads)


    我使用的是 Windows 系统，所以我将下载 Windows 版本。但如果你有 Linux 基础知识或正在使用 MacOS，步骤基本上是相同的。


    下载文件后，双击它，安装步骤基本上就是 `Next`、`Next` 和 `Finish`。出现的第一个窗口只是解释你正准备安装 VirtualBox：


    ![](img/Figure-1.1.jpg)

    **图 1.1**


    第二个窗口对于你选择所有资源非常重要，因为很多时候，主要在你需要在 PC 和虚拟机之间共享文件，甚至配置网络时需要它们：


    ![](img/Figure-1.2.jpg)

    **图 1.2**


    以下是关于快捷方式的基本选项，如果你想将它们添加到桌面：


    ![](img/Figure-1.3.jpg)

    **图 1.3**


    在这一步，安装程序会要求你提供`Admin Rights`(管理员权限），因为 VirtualBox 将创建一个`bridge interface`(桥接接口）。该接口负责宿主机与虚拟机之间的通信，没有它，你无法从虚拟机访问互联网：


    ![](img/Figure-1.4.jpg)

    **图 1.4**


    ![](img/Figure-1.5.jpg)

    **图 1.5**


    ![](img/Figure-1.6.jpg)

    **图 1.6**


    安装完成后，你就可以打开 VirtualBox，主界面将所示：


    ![](img/Figure-1.7.jpg)

    **图 1.7**


    现在，我们准备好设置第一个 Linux 环境了。VirtualBox 有很多选项供你配置和探索。但我现在不会关注它，因为我们有一个 Linux 系统要安装。


    # 安装 Linux 系统


    由于我之前提到过我们将使用 Ubuntu 服务器来完成此书中的所有操作，你可以从此链接下载最新版本：


    [`ubuntu.com/download/server`](https://ubuntu.com/download/server)


    然后，下载此文件：`ubuntu-18.04.3-live-server-amd64.iso`


    现在，让我们开始安装。第一步是打开 VirtualBox，点击 `New`，在新窗口中输入 `UbuntuServer`，如下例所示：


    ![](img/Figure-1.8.jpg)

    **图 1.8**


    点击 `Next` 后，你需要定义你想在虚拟机中使用的内存量。Linux 系统通常不需要很多内存即可运行，但在你安装服务并测试它们之后，将需要更多内存。目前，1
    GB 就够了。然后点击 `Next`：


    ![](img/Figure-1.9.jpg)

    **图 1.9**


    在这一部分，创建一个`New Disk`(新磁盘)。该磁盘本质是你硬盘上的一个文件，虚拟机将在其中存储所有数据。点击 `Create`，你会看到以下窗口：


    ![](img/Figure-1.10.jpg)

    **图 1.10**


    VDI 是 VirtualBox 使用的标准类型。如果你打算将此机器导入其他虚拟化工具，可以更改类型。例如，`VMDK` 是 VMware 使用类型。点击
    `Next`：


    ![](img/Figure-1.11.jpg)

    **图 1.11**


    这个窗口非常重要。在实验室中，你将始终使用`Dynamically allocated`(动态分配)选项，因为 VirtualBox 会创建一个小文件并根据磁盘使用增加大小。


    `Fixed Size`(固定大小)建议用于生产环境，因为虚拟化工具会为你的虚拟机保留该空间。即使你没有使用所有分配的磁盘空间，它也能避免虚拟空间超过`Physical
    Space`(物理空间)。在某些情况下，当你在生产环境中使用`Dynamically allocated`大小时，你会超过`Storage`(存储)的总空间，但你的虚拟机仍有剩余空间。我以前遇到过这种情况，真的很难处理。选择此选项的另一个原因是，它可以避免虚拟化工具在每次写入后重新计算磁盘空间。当你对每次写入使用`Dynamically
    allocated`类型时，系统将计算实际大小以及在达到定义限制之前需要增加多少：


    ![](img/Figure-1.12.jpg)

    **图 1.12**


    在这里，你可以定义虚拟机数据的存储位置和磁盘大小。对我们来说，10 GB 足够运行我们的测试：


    ![](img/Figure-1.13.jpg)

    **图 1.13**


    现在，你的虚拟机创建好了！


    # 安装你的 Linux 系统


    一旦我们准备好了所有前提条件（例如创建虚拟机并定义所有配置），是时候安装系统了。双击你的虚拟机。会出现以下屏幕：


    ![](img/Figure-1.14.jpg)

    **图 1.14**


    此虚拟机中尚未安装任何操作系统。你需要通过点击黄色文件夹来从 Ubuntu 网站下载 ISO：


    ![](img/Figure-1.15.jpg)

    **图 1.15**


    点击 `Add`，并选择你已经下载的 ISO 文件。选择它，点击 choose，然后点击 `Start`：


    ![](img/Figure-1.16.jpg)

    **图 1.16**


    现在，选择你的语言。即使我曾住在巴西、加拿大，现在住在德国，我也总是选择`English`。选择此选项无疑会避免很多关于排序的问题，例如标点符号、特殊字符等：


    ![](img/Figure-1.17.jpg)

    **图 1.17**


    此选项取决于你的键盘布局。你可能需要根据你目前所在的国家对其进行更改。我的键盘布局是美国布局，所以我选择此选项：


    ![](img/Figure-1.18.jpg)

    **图 1.18**


    现在，你什么都不需要做。只需按 `Done`，因为我们将使用默认配置。这一步非常重要，因为 Ubuntu 会在安装期间下载一些更新。所以，确保 PC 和虚拟机都有网络连接是重要的：


    ![](img/Figure-1.19.jpg)

    **图 1.19**


    如果你是在工作时间进行此操作，并且你的公司通过代理访问互联网，现在是你配置的时候了。只需输入代理 URL 并按 `Done`：


    ![](img/Figure-1.20.jpg)

    **图 1.20**


    在这里，你可以定义 Ubuntu 下载更新的镜像站(Mirror)。如果你有网络连接，它将选择离你最近的镜像。在我的情况下，我使用的是德国仓库：


    ![](img/Figure-1.21.jpg)

    **图 1.21**

