- fmt: "\nWe know that using a password to access the server is not the best practice,\
    \ because they are a lot reliable and are easily exposed. So, we can create a\
    \ key pair to secure our access. You can exit from your shell by typing the following\
    \ command:\n\n```\nalisson@devops:~$ logout\n```\n\n```\nConnection to 192.168.178.62\
    \ closed.\n```\n\nOr press `Ctrl` + `D`. In your PowerShell console, type the\
    \ following command:\n\n```\nssh-keygen\n```\n\nAnd press `Enter` for all the\
    \ options. This command will generate two files for you:\n\n* `id_rsa`: `id_rsa`\
    \ is your private key. This should be in your PC, and only you can have this file.\n\
    * `id_rsa.pub`: `id_rsa.pub` is the public key. You will copy this file to every\
    \ Linux server you want to access without a password.\n\nTo copy your public key\
    \ to our server, run the following command:\n\n```bash\nscp .\\.ssh\\id_rsa.pub\
    \ alisson@192.168.178.62:/home/alisson/id_rsa.pub\n```\n\n```\nalisson@192.168.178.62's\
    \ password:\nid_rsa.pub\n100%   398   397.4KB/s   00:00\n```\n\nThe file was copied,\
    \ so access the server again:\n\n```bash\nssh alisson@192.168.178.62\n```\n\n\
    ```\nalisson@192.168.178.62's password:\n```\n\nCreate the `.ssh` directory and\
    \ create the `authorized_keys` file. This file will store all the public keys\
    \ to access the server using the user `alisson`:\n\n```bash\nmkdir .ssh\ncat id_rsa.pub\
    \ >> .ssh/authorized_keys\nlogout\n```\n\nNow, if you try to access the server\
    \ again, no password will be asked, like the following example:\n\n```bash\nssh\
    \ alisson@192.168.178.62\n```\n\n```\nWelcome to Ubuntu 18.04.3 LTS (GNU/Linux\
    \ 4.15.0-76-generic x86_64)Welcome to Ubuntu 18.04.3 LTS (GNU/Linux 4.15.0-76-generic\
    \ x86_64)\n* Documentation:    https://help.ubuntu.com\n* Management:      https://landscape.canonical.com\n\
    * Support:          https://ubuntu.com/advantage\nSystem information as of Fri\
    \ Jan 31 2024:51 UTC 2020\nSystem load:   0.2             Processes:         \
    \    88\nUsage of /:    39.0% of 9.78GB   Users logged in:      1\nMemory usage:\
    \  15%             IP address for enp0s3:  192.168.178.62\nSwap usage:    0%\n\
    61 packages can be updated.\n0 updates are security updates.\nLast login: Fri\
    \ Jan 31 20:20:28 2020 from 192.168.178.60\nTo run a command as administrator\
    \ (user \"root\"), use \"sudo <command>\".\nSee \"man sudo_root\" for details.\n\
    alisson@devops:~$\n```\n\nMission complete! Now we are ready to learn more about\
    \ the Bash, directories, files, and many more.\n\n# Conclusion\n\nThis was just\
    \ the first chapter with the basics on how to install your own Linux server, and\
    \ create your labs on the top of the VirtualBox. I strongly recommend you to do\
    \ all these steps again using other Linux distributions and discover which one\
    \ is your favorite. When I started using Linux, I created my own labs using different\
    \ distributions, including Slackware, Gentoo, BigLinux, Mandrake, Mandriva. So,\
    \ feel free to choose your own. In the companies I worked for all these years,\
    \ most of them used RedHat or CentOS, and they had theirs on on-premises infrastructure.\
    \ But, since I started to work with Cloud, it has been changing. If you try to\
    \ create Ubuntu server machine on Amazon, you will see that it is one of the most\
    \ used distributions.\n\n# Chapter 2: Working with Bash\n\nThis chapter will explain\
    \ the basics for you to navigate inside your Linux system, the main directories,\
    \ mostly used commands, important files, managing users and groups, and how the\
    \ Linux permission system works!\n\n# Structure\n\nIn this chapter, we will discuss\
    \ the following topics:\n\n* What is Bash?\n    * Introduction\n    * Basic commands\n\
    * Managing files and directories\n    * Structure of directories\n    * Important\
    \ files\n    * Customizing your environment\n* Managing users and groups\n   \
    \ * Creating and modifying users\n    * Creating and modifying groups\n* Working\
    \ with permissions\n    * Changing read and write permissions\n    * Changing\
    \ the owner of files and executing scripts\n\n# Objectives\n\nAfter studying this\
    \ unit, you should be able to:\n\n* Understand directories infrastructure\n* Customize\
    \ your environment using important files\n* Manage users and groups\n* Understand\
    \ the permissions and executing scripts\n\n# What is Bash?\n\nBash is an abbreviation\
    \ of Bourne Again Shell. It is an improved version of the Legacy Shell that we\
    \ used to see in older Linux/Unix Systems. In this version, we have many features,\
    \ like creating functions, controlling jobs in the foreground and background,\
    \ creating aliases, customizing your environment, putting color in your terminal,\
    \ new shortcuts, auto-complete, and many other features that we are going to see\
    \ in this chapter. Just to give you more context about it, Shell is the interface\
    \ on Linux which is used to administer the system. In other words, it is where\
    \ we run all the commands.\n\nIt is also a programming language. Often among Linux\
    \ users, we see the term Shell Scripting. What does it mean? It means we can get\
    \ all the commands used during our work, put all of them together in the same\
    \ file, give permission to execute it, and automate your daily job. It is a Shell\
    \ Script. It is basically the Swiss Knife of the Linux administrators. Today,\
    \ it is frequently challenged by Python, because Python is an object-oriented\
    \ language and has a lot of features which are very easy to use if we compare\
    \ it with the Shell Script. Nevertheless, it will always be the favorite tool\
    \ of all the Linux administrators to automate easy tasks, and at the end of this\
    \ chapter, I will teach how to create a script using all the commands learned\
    \ before.\n\n# Introduction\n\nIn the last chapter, we configured and installed\
    \ our Linux system and we were able to access it using the SSH tool. The point\
    \ where we stopped is as follows:\n\n```\nssh alisson@192.168.178.62\n```\n\n\
    ```\nWelcome to Ubuntu 18.04.3 LTS (GNU/Linux 4.15.0-76-generic x86_64)\n* Documentation:\
    \    https://help.ubuntu.com\n* Management:      https://landscape.canonical.com\n\
    * Support:          https://ubuntu.com/advantage\nSystem information disabled\
    \ due to load higher than 1.0\n* Multipass 1.0 is out! Get Ubuntu VMs on demand\
    \ on your Linux, Windows or\nMac. Supports cloud-init for fast, local, cloud devops\
    \ simulation.\nhttps://multipass.run/\n60 packages can be updated.\n6 updates\
    \ are security updates.\nLast login: Mon Feb 10 18:59:46 2020\nTo run a command\
    \ as administrator (user \"root\"), use \"sudo <command>\".\nSee \"man sudo_root\"\
    \ for details.\nalisson@devops:~$\n```\n\nIt means we are inside the Linux Shell.\
    \ Now, we are going to call it Bash because it is the command-line interpreter.\
    \ Every operating system has its own command-line interpreter, because it is required\
    \ to administer the system. In the older versions of Windows, we had MS-DOS. Now,\
    \ we have the PowerShell. In the older versions of Linux, we had the Shell. Now,\
    \ we have the Bash and some users are migrating from Bash to Z shell. I will show\
    \ in the following pages how we can change our `CLI` (Command Line Interpreter).\n\
    \nWithin your server, the most useful command is called `ls`:\n\n```bash\nalisson@devops:~$\
    \ ls\nid_rsa.pub\n```\n\nThis command is used to show the files and the directories\
    \ of Linux. It can be used with different parameters. For example, if I want to\
    \ show the files and directories in a detailed mode, I can pass the parameter\
    \ `-l`:\n\n```bash\nalisson@devops:~$ ls -l\ntotal 4\n-rw-rw-r-- 1 alisson alisson\
    \ 398 Jan 31 20:18 id_rsa.pub\nalisson@devops:~$\n```\n\nThe last output shows\
    \ us more information following that sequence:\n\n`Permissions – Number of the\
    \ Hard Links – User – Group – Size – Last Modification Date – Filename`\n"
