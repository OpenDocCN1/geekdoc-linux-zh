    # [Managing groups](#toc.xhtml_s22a)


    This task is pretty similar to the user management. We can see all the groups:


    `alisson@devops:~$` **`sudo getent group`**


    `root:x:0:`


    `daemon:x:1:`


    `bin:x:2:`


    `sys:x:3:`


    `adm:x:4:syslog,Alisson`


    Find a group using a specific name:


    `alisson@devops:~$` **`sudo getent group sudo`**


    `sudo:x:27:Alisson`


    Create a new user and add this user to the group `sudo`:


    `alisson@devops:~$` **`sudo useradd gabriela`**


    `alisson@devops:~$` **`sudo getent passwd gabriela`**


    `gabriela:x:1001:1001::/home/gabriela:/bin/sh`


    `alisson@devops:~$` **`sudo getent group sudo`**


    `sudo:x:27:Alisson`


    The command I ran showed that I created a user called `gabriela`. This user is
    present in the `passwd` file and the group `sudo` just had the user `Alisson`
    added. To add the new user, run the following command:


    `alisson@devops:~$` **`sudo gpasswd -a gabriela sudo`**


    `Adding user gabriela to group sudo`


    `alisson@devops:~$` **`sudo getent group sudo`**


    `sudo:x:27:alisson,gabriela`


    Perfect! Now, we have 2 users who belong the `sudo` group and we can switch the
    user to see if the new one has the same permissions:


    `alisson@devops:~$` **`sudo su - gabriela`**


    `No directory, logging in with HOME=/`


    `$`


    One interesting point is if you paid attention, I ran 2 different commands to
    create a user .Firstly, I ran the `adduser` and after I ran `useradd`. What is
    the difference between the commands?


    The last output when I changed the user using the command `su -`, I received the
    message of no directory for this user. Therefore, the command `useradd` does not
    create the `home` folder for the user as the `adduser` does. So, we can use the
    `useradd` for the technical user, which does not need a `password` or `home` directory,
    and the `adduser` for common users. Do I use that in my daily work? No, I use
    the `adduser` for everything and after that, I remove the shell and the password,
    like the following:


    `alisson@devops:~$ sudo adduser app1 --shell /bin/false`


    `Adding user ''app1'' …`


    `Adding new group ''app1'' (1002) …`


    `Adding new user ''app1'' (1002) with group ''app1'' …`


