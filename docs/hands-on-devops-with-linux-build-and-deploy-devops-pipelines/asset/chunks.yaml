  raw: 'One thing that is nice to work with Linux is since all the documentation comes
    inside the files, like we saw in the `/etc/sudoers`, the comments explain how
    and where you have to edit the file. We also have the command `man` for that:


    `alisson@devops:~$` **`man sudo`**


    `SUDO(8)`


    `BSD System Manager''s Manual`


    `SUDO(8)`


    `NAME`


    `sudo, sudoedit — execute a command as another user`


    `SYNOPSIS`


    `sudo -h | -K | -k | -V`


    `sudo -v [-AknS] [-a type] [-g group] [-h host] [-p prompt] [-u user]`


    `sudo -l [-AknS] [-a type] [-g group] [-h host] [-p prompt] [-U user] [-u user]
    [command]`


    `sudo [-AbEHnPS] [-a type] [-C num] [-c class] [-g group] [-h host] [-p prompt]
    [-r role] [-t type] [-T timeout] [-u user] [VAR=value] [-i | -s] [command]`


    `sudoedit [-AknS] [-a type] [-C num] [-c class] [-g group] [-h host] [-p prompt]
    [-T timeout] [-u user] file …`


    This is just the first few lines of the file. To quit the man, press `q`. The
    file `/etc/crontab`:


    `alisson@devops:~$ cat /etc/crontab`


    `# /etc/crontab: system-wide crontab`


    `# Unlike any other crontab you don''t have to run the ''crontab''`


    `# command to install the new version when you edit this file`


    `# and files in /etc/cron.d. These files also have username fields,`


    `# that none of the other crontabs do.`


    `SHELL=/bin/sh`


    `PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin`


    `# m h dom mon dow user command`


    `17 * * * * root cd / && run-parts --report /etc/cron.hourly`


    `25 6 * * * root test -x /usr/sbin/anacron || (cd / && run-parts --report /etc/cron.daily)`


    `47 6 * * 7 root test -x /usr/sbin/anacron || (cd / && run-parts --report /etc/cron.weekly)`


    `52 6 1 * * root test -x /usr/sbin/anacron || (cd / && run-parts --report /etc/cron.monthly)`


    `#`


    This is responsible to manage the scheduled tasks. It follows the following structure:


    `Minute – hour – day of the month – month – day of the week – user - command`


    So, if you want to schedule the tasks to run every `Friday` at `07 pm`, you can
    add a line like the following:


    `00 19   * * 5   root   bash /bin/backup.sh`


    Therefore, every `Friday` at `7 pm,` the user root will run the command `backup.sh.`
    This is how we must read a line in the `crontab` file. This is the main file,
    but each user has their own `crontabs`, and they can be found in the following
    path:


    `alisson@devops:~$` **`sudo ls /var/spool/cron/crontabs/ -la`**


    `[sudo] password for alisson:`


    `total 8`


    `drwx-wx--T 2 root crontab 4096 Nov 16 2017 .`


    `drwxr-xr-x 5 root root    4096 Aug 5  2019 ..`


    We do not have any file inside this directory, because we never created any schedule.
    But, we can edit the users'' `crontab` for you to see the creation of the file.
    Type the following command in your terminal:


    `alisson@devops:~$` **`crontab -e`**


    `no crontab for alisson - using an empty one`


    `Select an editor. To change later, run ''select-editor''.`


    `1\. /bin/nano <---- easiest`


    `2\. /usr/bin/vim.basic`


    `3\. /usr/bin/vim.tiny`


    `4\. /bin/ed`


    `Choose 1-4 [1]: 2`


    `crontab: installing new crontab`


    You can choose option 2, as I did. It will set the VIM as the default text editor
    for your `crontab`. Wait for the VIM to open and close by pressing *Esc,* and
    use the following command:


    **`:wq!`**


    I will explain more about VIM in the next section. Now that you have saved your
    user `crontab`, you can check the folder again:


    `alisson@devops:~$` **`sudo ls /var/spool/cron/crontabs/ -la`**


    `total 12`


    `drwx-wx--T 2 root crontab 4096 Feb 17 20:54 .`


    `drwxr-xr-x 5 root root 4096 Aug 5 2019 ..`


    `-rw------- 1 alisson crontab 1089 Feb 17 20:54 alisson`


    You can see that a file with the same user''s name was created. So, every user
    will have a file in this folder since they created a `crontab` using the command
    `crontab -e`. For Linux systems, it is a requirement to have an SSH connection
    and the configuration file for this is: `/etc/ssh/sshd_config`:


    `alisson@devops:~$` **`cat /etc/ssh/sshd_config`**


    `# $OpenBSD: sshd_config,v 1.101 2017/03/14 07:19:07 djm Exp $`


    `# This is the sshd server system-wide configuration file. See`


    `# sshd_config(5) for more information.`


    `# This sshd was compiled with PATH=/usr/bin:/bin:/usr/sbin:/sbin`


    `# The strategy used for options in the default sshd_config shipped with`


    `# OpenSSH is to specify options with their default value where`


    `# possible, but leave them commented. Uncommented options override the`


    `# default value.`


    `#Port 22`


    `#AddressFamily any`


    `#ListenAddress 0.0.0.0`


    `#ListenAddress ::`


    Formerly, we have a short part of the file, in which you are able to change the
    port, and define which IP addresses will listen for the connections:


    `alisson@devops:~$` **`grep Root /etc/ssh/sshd_config`**


    `#PermitRootLogin prohibit-password`


    `# the setting of "PermitRootLogin without-password".`


    One important configuration in the preceding file, `PermitRootLogin`, is in some
    cases, we are able to login in the server using the root user directly. But, it
    is not a good practice. However, it is not uncommon to see in an on-premises environment.
    In the cloud environment, it is never allowed, because everyone in the world can
    try to access with the root user.


    Another important configuration is the following one:


    `alisson@devops:~$` **`grep PasswordAuthentication /etc/ssh/sshd_config`**


    `#PasswordAuthentication yes`


    `# PasswordAuthentication. Depending on your PAM configuration,`


    `# PAM authentication, then enable this but set PasswordAuthentication`


    `PasswordAuthentication yes`


    If you are working with any Cloud provider like Amazon, Azure, or GCP, this configuration
    is disabled by default, for security reasons. We have added our SSH key in the
    server in the first chapter. So, if you want, you can edit this file and change
    the option for `no`.


    # [Managing users and groups](#toc.xhtml_s20a)


    Now, you already know some of the important files, and the files responsible to
    manage users and groups. We could just open these files and edit them to create
    new users and groups. But, Linux has useful commands which should be used to do
    that job and make our life easier.


    # [Managing users](#toc.xhtml_s21a)


    To see the users, we have the command `getent`:


    `alisson@devops:~$` **`getent passwd`**


    `root:x:0:0:root:/root:/bin/bash`


    `daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin`


    `bin:x:2:2:bin:/bin:/usr/sbin/nologin`


    `sys:x:3:3:sys:/dev:/usr/sbin/nologin`


    The output is a quite similar as the command `cat`, but, the difference is that
    we can look for a specific user, like we did using the command `grep`:


    `alisson@devops:~$` **`getent passwd alisson`**


    `alisson:x:1000:1000:alisson:/home/alisson:/bin/bash`


    Thus, it is up to you which command you want to use. When I am working, I always
    use the `getent`, to look for a user or group, and the `grep` command, to find
    a line in any file of the Linux system.


    To add a new user, run the following command:


    `alisson@devops:~$` **`sudo adduser elvis`**


    `[sudo] password for alisson:`


    `Adding user ''elvis'' …`


    `Adding new group ''elvis'' (1001) …`


    `Adding new user ''elvis'' (1001) with group ''elvis'' …`


    `Creating home directory ''/home/elvis'' …`


    `Copying files from ''/etc/skel'' …`


    `Enter new UNIX password:`


    `Retype new UNIX password:`


    `passwd: password updated successfully`


    `Changing the user information for elvis`


    `Enter the new value, or press ENTER for the default`


    `Full Name []:`


    `Room Number []:`


    `Work Phone []:`


    `Home Phone []:`


    `Other []:`


    `Is the information correct? [Y/n]`


    Only the username and password are mandatory. You can leave the other options
    blank, as I did in the example. I set the password as `devops`. If you analyze
    the command output, you can see two things that are important for us to pay attention.


    The first is the information about the `home` directory. The command creates a
    folder called `elvis` within the `/home` folder. As I explained earlier, the `home`
    folder is responsible for the user''s files.'
