    \  config.vm.define \"efk\" do |efk|\n    efk.vm.network \"private_network\",\
    \ ip: \"192.168.99.50\"\n    efk.vm.hostname = \"efk\"\n    config.vm.provider\
    \ \"virtualbox\" do |v|\n      v.memory = 4096\n    end\n    efk.vm.provision\
