    `}`


    In the subnet too, I used the same CIDR Block. I want to have only one subnet
    in my VPC. But, you can create, for example, a VPC with a bigger block like `/16`
    or `/8` and split it into many subnets, as many as you want.


    For security reasons, we are obligated to create security groups. It is like firewall
    rules, which will allow the traffic to determine the IP address, networks, and
    block, or allow ports depending on the protocols. Therefore, let''s create it
    because it is a requirement, for instance:


    `PS C:\Users\1511 MXTI>` **`aws ec2 create-security-group --group-name devops-book
    --description "Example used in the book" --vpc-id vpc-0825b5c6f6a2a2429`**


    `{`


    `"GroupId": "sg-0da7b308d99365dc3"`


    `}`


    Save the **`GroupId.`** Now, we need to allow all the TCP connections in this
    group:


    `PS C:\Users\1511 MXTI>` **`aws ec2 authorize-security-group-ingress --group-id
    sg-0da7b308d99365dc3 --protocol tcp --port 22 --cidr 0.0.0.0/0`**


    For the port `22`, the access can be given from any source and we can assign this
    `SecurityGroup` to any instance that we have. And finally, we can create an instance:


    `PS C:\Users\1511 MXTI>` **`aws ec2 run-instances --count 1 --instance-type t3.micro
    --key-name DevopsBook --security-group-ids sg-0da7b308d99365dc3 --subnet-id subnet-0c7889e706674e64f
    --image-id ami-0b418580298265d5c`**


