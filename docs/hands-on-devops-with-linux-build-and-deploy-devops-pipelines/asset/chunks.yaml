    To exit from the `top`, press `q`. This command basically shows the current state
    of your machine, the state of memory, CPU, processes running, etc. There is another
    version of top which is called `htop`. It does exactly the same thing. However,
    it has a better interface, and therefore, before we install that version, run
    the following command:


    ```bash

    alisson@devops:~$ sudo su -

    [sudo] password for alisson:

    root@devops:~#

    ```


    The previous command changes your current user to the user `root`. Until now,
    we were running the command `sudo` before every command which needs more permission.
    Now, we need not type `sudo` before the command every time because we are already
    the administrator of this server. Or, you can say that we are the `root` user.


    Sometimes, when we create a server based on an image. The local cache of `APT`
    is completely outdated. So, we need to clean it and update using the following
    commands:


    ```bash

    root@devops:~# apt clean

    root@devops:~# apt update

