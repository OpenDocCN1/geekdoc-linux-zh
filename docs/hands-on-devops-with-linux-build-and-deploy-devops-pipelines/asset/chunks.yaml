    # [Provisioning using GCP](#toc.xhtml_s65a)


    Now is the time to create the same infrastructure using the Google Cloud Platform.
    The elements are the same in all the platforms. We will need networks, subnets,
    SSH keys, public IP address, etc. However, the commands and the way we are going
    to implement it, changes by the platform. Therefore, let''s install the Google
    Cloud Shell and start a walkthrough of it:


    **https://dl.google.com/dl/cloudsdk/channels/rapid/GoogleCloudSDKInstaller.exe**


    To install it, double click, then click on **`Next`**, **`Next`**, and **`Finish`**.
    After the installation finishes, you need to create your configuration by running
    the following command:


    `PS C:\Users\1511 MXTI>` **`gcloud config configurations create book`**


    `Created [book].`


    `Activated [book].`


    Now, you must configure your Google account to access the platform.


    `PS C:\Users\1511 MXTI>` **`gcloud init`**


    `Welcome! This command will take you through the configuration of gcloud.`


    `Settings from your current configuration [book] are:`


    `core:`


    `disable_usage_reporting: ''True''`


    `Pick configuration to use:`


    `[1] Re-initialize this configuration [book] with new settings`


    `[2] Create a new configuration`


    `[3] Switch to and re-initialize existing configuration: [default]`


    `Please enter your numeric choice: 1`


    `Your current configuration has been set to: [book]`


    `You can skip diagnostics next time by using the following flag:`


    `gcloud init --skip-diagnostics`


    `Network diagnostic detects and fixes local network connection issues.`


    `Checking network connection…done.`


    `Reachability Check passed.`


    `Network diagnostic passed (1/1 checks passed).`


    `Choose the account you would like to use to perform operations for`


    `this configuration:`


    `[1] alisson.machado@stone.com.br`


    **`[2] Log in with a new account`**


    **`Please enter your numeric choice: 2`**


    `Your browser has been opened to visit:`


    I already have one existing configuration. So, I choose the re-initialize the
    option, and then, I add a new account, because the first email displayed is not
    my current Google account. This process will open a browser for you and you just
    need to login to your account. If everything went well with you, the terminal
    will show you the following message:


    `You are logged in as: [alisson.copyleft@gmail.com].`


    `Pick cloud project to use:`


    `[1] alisson-187813`


    `[2] saas-205517`


    **`[3] Create a new project`**


    `Please enter numeric choice or text value (must exactly match list item):`


    In my case, I will create a new project, called `chapter7-20200423`:


    `Please enter numeric choice or text value (must exactly match list item): 3`


    `Enter a Project ID. Note that a Project ID CANNOT be changed later.`


    `Project IDs must be 6-30 characters (lowercase ASCII, digits, or`


    **`hyphens) in length and start with a lowercase letter. chapter7-20200423`**


    `Waiting for [operations/cp.8418911479956985045] to finish…done.`


    **`Your current project has been set to: [chapter7-20200423].`**


    Now, my project is ready to use. To access it, go to **https://console.cloud.google.com**,
    click on **`Projects`**| **`All`** and you will see your projects there:'
