    `"cloudName": "AzureCloud",`


    `"isDefault": true,`


    `"managedByTenants": [],`


    `"name": "Pay-As-You-Go",`


    `"state": "Enabled",`


    `"user": {`


    `"name": "alisson.copyleft@gmail.com",`


    `"type": "user"`


    `}`


    `}`


    `]`


    The command, `az login` authenticates your command line with your Azure account.


    Similar to Google, where we created one project to separate all the provisioned
    services by context, we will do the same on Azure, but instead of creating the
    projects, we will create `ResourceGroups`.


    But, before creating the `ResourceGroup`, we need to know which location we will
    use. To see the locations available, run the following command:


    `PS C:\Users\1511 MXTI>`**`az account list-locations`**


    `[`


    `{`


    `"displayName": "Central US",`


    `"id": "/subscriptions/55465d5a-355d-43d1-85ce-9e518c812c0c/locations/centralus",`


