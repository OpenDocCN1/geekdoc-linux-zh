- fmt: "\nAnd it is possible to see the file content. So this is how the permission\
    \ works. I show how we can change the permission using the number. If you want\
    \ to change it using letters, it is basically the same. Let's try:\n\n```\ngabriela@devops:/home/alisson$\
    \ cd\ngabriela@devops:~$ touch letters_file\ngabriela@devops:~$ ls -la letters_file\n\
    -rw-rw-r-- 1 gabriela gabriela 0 Feb 20 19:47 letters_file\n```\n\nTo remove all\
    \ the permission to others:\n\n```bash\ngabriela@devops:~$ chmod o= letters_file\n\
    gabriela@devops:~$ ls -la letters_file\n-rw-rw---- 1 gabriela gabriela 0 Feb 20\
    \ 19:47 letters_file\n```\n\nThen, we can see that I just had to type `o=`, which\
    \ means `other = nothing`, and the permissions were set. I could just add the\
    \ execution permission:\n\n```bash\ngabriela@devops:~$ chmod o+x letters_file\n\
    gabriela@devops:~$ ls -la letters_file\n-rw-rw---x 1 gabriela gabriela 0 Feb 20\
    \ 19:47 letters_file\n```\n\nOr, I can set the permissions to read for all, and\
    \ write just for the owner:\n\n```bash\ngabriela@devops:~$ chmod g=rx,o=rx letters_file\n\
    gabriela@devops:~$ ls -la letters_file\n-rw-r-xr-x 1 gabriela gabriela 0 Feb 20\
    \ 19:47 letters_file\n```\n\nAnd if I want to give the write permission to everyone,\
    \ I will do the following:\n\n```bash\ngabriela@devops:~$ chmod +w letters_file\n\
    gabriela@devops:~$ ls -la letters_file\n-rw-rwxr-x 1 gabriela gabriela 0 Feb 20\
    \ 19:47 letters_file\n```\n\nThe same command works for the directories.\n\n#\
    \ Change the owner of files and executing scripts\n\nThe same way as `chmod` is\
    \ used for permissions, `chown` is used for ownership. Let me use the same files\
    \ that we have:\n\n```bash\ngabriela@devops:~$ ls -la letters_file\n-rw-rwxr-x\
    \ 1 gabriela gabriela 0 Feb 20 19:47 letters_file\n```\n\nThe owner is `gabriela`,\
    \ and the group is `gabriela` too. In the previous example, I have added the user\
    \ `gabriela` to the group `alisson`, and then the user was able to access the\
    \ file. But this time, I will do it differently:\n\n```bash\ngabriela@devops:~$\
    \ chown gabriela:alisson letters_file\ngabriela@devops:~$ ls -la letters_file\n\
    -rw-rwxr-x 1 gabriela alisson 0 Feb 20 19:47 letters_file\n```\n\nNow, the group\
    \ owner for this file is `alisson`. If I want to change the user, I can run the\
    \ command as follows:\n\n```bash\ngabriela@devops:~$ sudo chown juergen letters_file\n\
    [sudo] password for gabriela:\ngabriela@devops:~$ ls -la letters_file\n-rw-rwxr-x\
    \ 1 juergen alisson 0 Feb 20 19:47 letters_file\n```\n\n`Jurgen` is the owner\
    \ of this file. We can use the command `chown` to change the user and the group\
    \ for a file or directory. But we have a command which can also be used to change\
    \ the group:\n\n```bash\ngabriela@devops:~$ sudo chgrp gabriela letters_file\n\
    gabriela@devops:~$ ls -la letters_file\n-rw-rwxr-x 1 juergen gabriela 0 Feb 20\
    \ 19:47 letters_file\n```\n\nThe group is now changed. Therefore, the command\
    \ `chgrp` changes only the group, and the command `chown` changes the owner, or\
    \ the owner and the group. Thus, to finish this chapter, we are just missing to\
    \ see how to execute a script. So let's create a simple one:\n\n```bash\ngabriela@devops:~$\
    \ echo \"echo this is a simple script\"> simple_script.sh\ngabriela@devops:~$\
    \ ls -la simple_script.sh\n-rw-rw-r-- 1 gabriela gabriela 29 Feb 20 20:05 simple_script.sh\n\
    ```\n\nHere, we have the script created. To execute it, run it as follows:\n\n\
    ```bash\ngabriela@devops:~$ ./simple_script.sh\n-su: ./simple_script.sh: Permission\
    \ denied\n```\n\nPermission denied! This happens because, if we analyze the previous\
    \ command run and check the permissions, there is no `x`, which represents the\
    \ execution permission. Then, set the following permission:\n\n```bash\ngabriela@devops:~$\
    \ chmod +x simple_script.sh\n```\n\nRun the script again:\n\n```bash\ngabriela@devops:~$\
    \ ./simple_script.sh\nthis is a simple script\n```\n\nLet's check the permissions\
    \ one more time:\n\n```bash\ngabriela@devops:~$ ls -la simple_script.sh\n-rwxrwxr-x\
    \ 1 gabriela gabriela 29 Feb 20 20:05 simple_script.sh\n```\n\nThe x is in all\
    \ the permission groups for the users, groups, and others. So, everyone can execute\
    \ it. If you still give the execution just for the file owner or for the group,\
    \ you can use `chmod` for it, and use the same `math` to set the permissions.\n\
    \n# CHAPTER 3\n\n# Setting Up a Service\n\nThis chapter will explain how the Linux\
    \ Package system works, how to install a package, install a service, configure\
    \ it, and run your first application in your first LAMP (Linux Apache MySQL PHP)\
    \ server.\n\n# Structure\n\nIn this chapter, we will discuss the following topics:\n\
    \n*   Learning how to install a package\n    *   APT\n*   Installing the Apache\n\
    \    *   Configuring your service\n    *   Creating a VHost\n*   Installing MySQL\n\
    \    *   Configuring the service\n    *   Creating a database and tables\n*  \
    \ Deploying your application\n    *   Installing PHP\n    *   Deploying WordPress\n\
    \n# Objectives\n\nAfter studying this unit, you should be able to:\n\n*   Understand\
    \ the Linux package system\n*   Install packages using APT\n*   Setup a web server\n\
    *   Setup a database server\n*   Deploy an application\n\n# Learning how to install\
    \ a package\n\nMost of the Linux distributions have a package manager by default.\
    \ It can be YUM, APT, Zypper, pacman, slackapt, etc. Each one has its own particularities,\
    \ but all were made for the same purpose, to install the packages that are basically\
    \ the Linux programs, via centralized repositories which are distributed all over\
    \ the world.\n\nIn the first chapter, I gave a brief explanation about the Linux\
    \ distributions and some differences. Some of them are in the package management\
    \ systems. Now, I am going to give 2 examples of the most famous package managers.\n\
    \nDebian based distributions, like Ubuntu, have the `APT` (`Advanced Package Tool`).\
    \ It connects to a central repository like this: `http://de.archive.ubuntu.com/ubuntu`.\
    \ It is just an Apache web server, and in it, are stored several packages which\
    \ we can choose and install.\n\nRedHat based distributions, like CentOS, have\
    \ `YUM` (`Yellow Dog Update Manager`), which will soon be replaced by the `DNF`\
    \ (`Dandified Yum`), the new substitute of YUM. It also uses a central repository\
    \ like `https://dl.fedoraproject.org/pub/epel/7/x86_64/`, and also stores several\
    \ packages.\n\nNow, let's focus on Debian which is our goal here, once we are\
    \ using Ubuntu.\n\n# APT\n\nIf you run just the command `apt` without any parameter,\
    \ you will see the following output:\n\n```\nalisson@devops:~$ apt\napt 1.6.11\
    \ (amd64)\n\nUsage: apt [options] command\n\napt is a commandline package manager\
    \ and provides commands for\nsearching and managing as well as querying information\
    \ about packages.\nIt provides the same functionality as the specialized APT tools,\n\
    like apt-get and apt-cache, but enables options more suitable for\ninteractive\
    \ use by default.\n\nMost used commands:\nlist - list packages based on package\
    \ names\nsearch - search in package descriptions\nshow - show package details\n\
    install - install packages\nremove - remove packages\nautoremove - Remove automatically\
    \ unused packages\nupdate - update list of available packages\nupgrade - upgrade\
    \ the system by installing/upgrading packages\nfull-upgrade - upgrade the system\
    \ by removing/installing/upgrading packages\nedit-sources - edit the source information\
    \ file\n\nSee apt(8) for more information about the available commands.\nConfiguration\
    \ options and syntax is detailed in apt.conf(5).\nInformation about how to configure\
    \ sources can be found in sources.list(5).\nPackage and version choices can be\
    \ expressed via apt_preferences(5).\nSecurity details are available in apt-secure(8).\n\
    \nThis APT has Super Cow Powers.\n```\n"
