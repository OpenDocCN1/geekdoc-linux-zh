    ![](img/Figure-7.8.jpg)


    **图 7.8**


    在 Google 上，创建虚拟机（VM）的服务名称为 `Google Compute Engine`。使用此服务，我们将能够像在 Amazon 上完全相同的方式进行创建。


    ### 激活计费


    首先，你需要激活账户中的计费功能。在项目内的 `Dashboard` 中，点击 `Go to Compute Engine`，在那里你有一个名为 `Enable
    billing` 的按钮，如下图所示：


    ![](img/Figure-7.9.jpg)


    **图 7.9**


    点击它并等待几分钟让配置完成。一旦配置完成，你可以使用以下命令找到想要创建实例的镜像：


    ![](img/p150.jpg)


    你将发现很多选项。在我的案例中，我将使用 `ubuntu-1804-xenial-20200407.`。你还需要选择要创建 VM 的区域：


    ![](img/p150a.jpg)


    这次，我将使用 `us-east1-b` 区域在位于创建我的 VM。在 AWS 部分，我们创建了 `t3.micro` 大小的实例。在 Google 上，我们有对应的，但名称不同：


    ![](img/p150b.jpg)


    有很多你可以使用的机器系列类型。不同系列之间的区别在于你使用 VM 的目的。`E2` 家族是为通用型虚拟机制作的。因此，我将只使用它，最小尺寸是 micro，对应于
    2 个 CPU 和 1 GB 内存。


    ### 创建实例


    有时，在创建 VM 时仅设置镜像名称可能会导致错误。为了避免出现这种情况，你可以直接放置镜像链接，如下：


    ```

    PS C:\Users\1511 MXTI> gcloud compute images list –uri

    ```


    `https://www.googleapis.com/compute/v1/projects/centos-cloud/global/images/centos-6-v20200402`


    `https://www.googleapis.com/compute/v1/projects/centos-cloud/global/images/centos-7-v20200420`


    `https://www.googleapis.com/compute/v1/projects/ubuntu-os-cloud/global/images/ubuntu-1804-bionic-v20200414
    https://www.googleapis.com/compute/v1/projects/coreos-cloud/global/images/coreos-alpha-2430-0-0-v20200229`


    因此，镜像链接如下：


    `https://www.googleapis.com/compute/v1/projects/ubuntu-os-cloud/global/images/ubuntu-1804-bionic-v20200414`


    要创建你的 VM，运行以下命令：


    ```

    PS C:\Users\1511 MXTI> gcloud compute instances create vm1 --zone=us-east1-b --machine-type=e2-micro
    --image=https://www.googleapis.com/compute/v1/projects/ubuntu-os-cloud/global/images/ubuntu-1804-bionic-v20200414

    ```


    `Created [https://www.googleapis.com/compute/v1/projects/chapter7-20200423/zones/us-east1-b/instances/vm1].`


    ![](img/p151.jpg)


    该 VM 现在正在运行，外部 IP 为 `25.229.97.23.`。你可以用它连接到你的机器。然而，Google Cloud Shell 有特定的命令为你创建
    SSH 密钥并自动登录实例：


    ```

    PS C:\Users\1511 MXTI> gcloud compute ssh vm1

    ```


    `WARNING: The PuTTY PPK SSH key file for gcloud does not exist.`

    `WARNING: The public SSH key file for gcloud does not exist.`

    `WARNING: The private SSH key file for gcloud does not exist.`

    `WARNING: you do not have an SSH key for gcloud.`

