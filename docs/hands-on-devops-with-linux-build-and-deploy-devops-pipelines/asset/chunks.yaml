    ![](images/p104.jpg)


    We can see zero containers running. It happens because once you type exit or *Ctrl*
    + *D* from your container terminal, the container stops. To see that, type the
    following command:


    ![](images/p104a.jpg)


    Now, you can see your container created. If you give a look, you can see that
    the value in the column `CONTAINER ID` is exactly the same as the container hostname
    when we created it.


    However, why does the Docker has this behavior? Why is it that when we exit from
    a container, the container stops? This happens because in the containers concept,
    one container is created for one specific purpose, different from the virtual
    machines. So, we do not need to concern about uptime or maintaining a container.
    You can just delete it and create a new one. If you want to make changes into
    a container, you must modify the image, save it, delete the current container,
    and start a new one with the new version of the image.'
