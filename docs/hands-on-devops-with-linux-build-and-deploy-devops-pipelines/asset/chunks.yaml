    # Conclusion


    In this chapter, we saw the benefits of using a tool like Vagrant, which allows
    us to write the VM configurations like OS image, IP address, hostname, VM memory,
    etc. In the provision part, we could write a Shell Script and the script will
    run during the boot. If it doesn’t, or if you want to run the script again, you
    can execute the command `vagrant provision`. Vagrant allows you to use different
    technologies, like Ansible, Puppet, or Chef to create your provision scripts.
    I used the Shell Script as an example, but, feel free to test and create your
    own scripts. Another important thing we learned is the Vagrant file. In this file,
    you define everything, and you can share the content with your team, so that they
    will be available to contribute with you to develop your environment.


    # CHAPTER 7


    ## Creating Your Infrastructure Using Cloud Services


    This chapter aims to introduce you to the biggest Cloud players and how we can
    use it to speed up the provisioning, scalability, and reliability of our Infrastructure.


    ### Structure


    In this chapter, we will discuss the following topics:


    * Cloud and Main Players

    * Provisioning using AWS

    * Provisioning using GCP

    * Provisioning using Azure


    ### Objectives


    After studying this unit, you should be able to:


    * Define Cloud and how to use it

    * Set up the environment on each player

    * Create a simple infrastructure using the command line

    * Check the infrastructure created in the Cloud console


    ### Cloud and Main Players


    Until this moment, we have been using our own computer to create everything. However,
    running the applications in production requires a lot of stuff, such as, high
    availability, backup, monitoring, redundancy, etc. In the past, many companies
    had their own data centers or local servers which were turned on 24*7\. Hence,
    it takes a lot of effort to manage everything, because it is not just taking care
    of the virtual machines or the software; it is necessary to manage the network,
    storage, energy, no breaks, internet connection, and many other things that are
    involved in IT. Also, a team with different skills to manage everything is required
    to have the redundancy of people as well, because, if some employee in the company
    gets sick, you must have another available, in case something stops working.


    When I began working in the IT industry, some of the companies that I worked for
    were using a service called Colocation, in which you can basically rent a Rack
    inside a data center, and you can install your servers. Therefore, you just need
    to manage your servers. The networking, energy and internet part were delegated
    to the company which was offering the service. After sometime, we began to use
    the services from a company called `SoftLayer`. They had their own data center
    and we could pay and use a physical server for some time when we were renting
    the server.


    After this period, we started working with the `AWS`, which is a Cloud company.
    There, we could rent the virtual machines, exactly like the VMs that we have been
    created in the earlier chapters. There are a lot of benefits of using this service,
    such as high availability. So, if some physical server fails in their data center,
    you can just shut down the VM and start the VM in another server, or even pay
    them to do the backup for you. Thus, only one person can manage an entire infrastructure
    with hundreds of servers.


    ### AWS


    Amazon Web Services is currently the main Cloud player at the moment. They have
    dozens of services which you can use to deploy your applications, monitor, backup,
    create VMs, databases, queues, etc. It also allows you to create everything in
    an automated way using a command line, which is called `AWSCLI`. But, of course,
    it is not that easy to use all their services. That is why, they have created
    many courses and certifications, so that the people can get qualified and take
    the best of what their services can offer.


    ### GCP


    Google Cloud Platform is the newest one. They are offering many services like
    AWS, but, they still do not have all the services as theirs. Nevertheless, they
    have some unique services, like `Big Query`, which is one of the most used to
    query large datasets and store the data on the Cloud. Furthermore, if you are
    working with machine learning, they have clusters available to take the maximum
    performance with `TensorFlow` Projects. GCP is often cheaper than its other big
    competitors. I am using it for my personal projects.


    ### Azure


    This is the Microsoft Cloud platform. So, if you are planning to export your active
    directory to the Cloud, this is the one. They have unique services, like `SQL
    server`, `Azure Active Directory`, or even the `Azure DevOps` which have become
    very famous. Some of the big companies that I worked for in the past used Azure
    as their main platform, because Microsoft is a reliable company. But, they are
    the most expensive as well. So, if money is not your problem, and you are using
    Microsoft products in your applications, this is the right option.


    ### Provisioning using AWS


    AWS has its own courses to explain how to use all the services. Then, my goal
    here is to show you how we can provide the same infrastructure like we did using
    the VirtualBox and Vagrant. So, I will focus on VMs and how we can install things
    on it.


    Therefore, your first task is to create your own AWS Account. You can visit the
    following link to do so:


    `http://console.aws.amazon.com/`


    After you have created your account and logged in into the console, you will see
    a page shown in the following figure:


    ![](images/Figure-7.1.jpg)


    **Figure 7.1**


    This console allows you to create any service that you want. Now, click on `Services`|`EC2`|`Running
    Instances`. You will see the following page:


    ![](images/Figure-7.2.jpg)


    **Figure 7.2**

