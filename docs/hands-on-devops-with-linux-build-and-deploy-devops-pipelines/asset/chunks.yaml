    # 献给*我的家人和朋友*


    # 关于作者


    **Alisson Machado de Menezes** 是一位经验丰富的大数据 DevOps 工程师。在过去的十年里，他曾担任不同的职位，如开发人员、运营分析师、支持分析师、DevOps
    工程师、IT 经理、技术负责人，现在深耕大数据领域。他在巴西的 Python Brasil、The Developers Conference、自由软件国际展等活动中进行过多次演讲，并为一些私人公司提供服务。他还教授过
    Python 编程、敏捷基础设施、MongoDB、Openshift、Kubernetes、DevOps 和 DevSecOps 等课程。他拥有 Linux
    系统管理员 (`LPIC-1`)、Linux 工程师 (`LPIC-2`)、Suse 认证 Linux 管理员 (`SUSE CLA`)、`LPIC – OT`
    DevOps 工具工程师、Exin – DevOps 专业人员认证，并在加拿大学习过英语。


    2019 年，Alisson 搬到了德国，在欧洲汽车营销领域开启了新挑战，旨在助力未来的出行，我们正努力成为电动汽车的先驱。


    在工作之余，Alisson 尝试维护一个博客，分享他参与过的项目经验；有空时会旅行、徒步并尝试不同类型的啤酒。


    # 关于评审员


    **Leonardo Mendes** 目前在 Cogna 担任软件可靠性工程师，是技术创新团队的核心成员。他专注于 FOSS（自由和开源软件）项目。他热爱培训，并在教育项目中工作过，协调培训团队交付
    Linux、DevOps、云和大数据培训，还参与了实施项目，并教授关于 Linux、DevOps 和云的课程。


    他毕业于计算机网络专业，并拥有云计算硕士学位（MBA）。


    # 鸣谢


    我想感谢几位在撰写本书期间给予我持续和不断支持的人。首先，我想感谢我的家人，他们教育了我，教我如何变得独立和坚强。Leonardo Mendes 是本书的技术审稿人，也是我最好的朋友之一。Gabriela
    Dias 是这十年 IT 经验中我遇到的最好的领导，也是我心中一个人的榜样。Juergen Bohn 是带我来到德国的老板，为我在欧洲开启了许多大门和数以虚计的机会。如果没有生活中的这些人，我永远无法完成这本书。


    如果没有 BPB Publications 的支持，这本书就不可能问世，他们在我写作期间给予了我支持和关注。


    最后，我要感谢上帝，他赋予我智慧、力量以及所有的道路，让我处于现在的位置。


    # 前言


    DevOps 是 2017 年搜索率最高的词。在我看来，当我们停止在 IT 团队之间建立边界，开始协作和共同工作以实现共同目标时，可以认为是 IT 领域的一场革命。此外，我们还拥有
    DevOps 思维中包含的所有技术手段，利用自动化来缩短上市时间并更快速地交付高质量的软件和服务。


    我进入 领域是因为对 IT 的一切都好奇。我还是一个青少年时就开始学习网络安全，因为我想成为一名黑客。随后，我学习了操作系统、计算机编程、数据库、网络、安全等。这些术语为后来
    DevOps 的出现做好了准备。


    如今，DevOps 工程师必须掌握这些技能。在我的日常工作中，例如，我必须编写脚本自动化云服务器的安装，这可以通过许多方式实现。大多数情况下针对特定需求使用
    `Python`；对于更通用的场景，我使用 `Ansible`。我使用 `Jenkins` 进行调度自动化、创建流水线。


    我在巴西生活期间还编写过其他课程，包括 MongoDB、DevSecOps、Python 开发、Docker 和 OpenShift 以及敏捷基础设施。在过去的十年里，我在不同的公司、不同的场景中工作。


    现在我的职位是大数据 DevOps 工程师，我将 DevOps 自动化知识应用于大数据场景，创建流水线并自动化数据湖、数据流水线、治理规则等。


    本书的主要目标是为当今市场的 DevOps 工程师提供所需的信息和技能，根据我的十年经验提供最常用技术的基本概述和步骤：


    - **第 1 章** 本章介绍了本地机器上的虚拟化概念，旨在让你创建实验室、测试新技术、在不破坏生产环境的情况下模拟环境，并用于学习。

    - **第 2 章** 本章向你介绍了一些基础 bash 命令，因为我们知道如今 Linux 已经不再是一个加分项，而是云和高可用性领域人员的必备要求。

    - **第 3 章** 在这里，我们设置了一些服务，如数据库和 Web 服务器，搭建最常见的安装，即我们所谓的 Lamp（Linux Apache Mysql
    PHP）。

    - **第 4 章** 反向代理通常在你只有一个公 IP 且有多个站点运行在私有结构之后使用。当你不使用云服务（如 Azure 或 Amazon）时，你可以自己设置
    Nginx 并实现负载均衡，或者将连接传递到私有服务器以确保安全。


