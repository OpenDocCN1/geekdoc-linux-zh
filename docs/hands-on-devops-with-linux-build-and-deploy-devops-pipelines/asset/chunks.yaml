  trans: "\n并且可以看到文件内容。这就是权限的工作原理。我将展示我们如何使用数字来更改权限。如果你想使用字母来更改，基本上也是那样的。让我们尝试：\n\n\
    ```\ngabriela@devops:/home/alisson$ cd\ngabriela@devops:~$ touch letters_file\n\
    gabriela@devops:~$ ls -la letters_file\n-rw-rw-r-- 1 gabriela gabriela 0 Feb 20\
    \ 19:47 letters_file\n```\n\n移除其他用户的所有权限：\n\n```bash\ngabriela@devops:~$ chmod\
    \ o= letters_file\ngabriela@devops:~$ ls -la letters_file\n-rw-rw---- 1 gabriela\
    \ gabriela 0 Feb 20 19:47 letters_file\n```\n\n然后，我们可以看到我只需要输入 `o=`，这意味着 `other\
    \ = 无权限`，权限就设置了。我只需要添加执行权限：\n\n```bash\ngabriela@devops:~$ chmod o+x letters_file\n\
    gabriela@devops:~$ ls -la letters_file\n-rw-rw---x 1 gabriela gabriela 0 Feb 20\
    \ 19:47 letters_file\n```\n\n或者，我可以为所有人设置读取权限，仅为所有者设置写入权限：\n\n```bash\ngabriela@devops:~$\
    \ chmod g=rx,o=rx letters_file\ngabriela@devops:~$ ls -la letters_file\n-rw-r-xr-x\
    \ 1 gabriela gabriela 0 Feb 20 19:47 letters_file\n```\n\n如果我想给所有人写入权限，我将执行以下操作：\n\
    \n```bash\ngabriela@devops:~$ chmod +w letters_file\ngabriela@devops:~$ ls -la\
    \ letters_file\n-rw-rwxr-x 1 gabriela gabriela 0 Feb 20 19:47 letters_file\n```\n\
    \n相同的命令也适用于目录。\n\n# 修改文件所有者和执行脚本所有者\n\n与 `chmod` 用于权限一样，`chown` 用于所有权。让我使用我们已有的文件：\n\
    \n```bash\ngabriela@devops:~$ ls -la letters_file\n-rw-rwxr-x 1 gabriela gabriela\
    \ 0 Feb 20 19:47 letters_file\n```\n\n所有者是 `gabriela`，组也是 `gabriela`。在在上一个示例中，我将用户\
    \ `gabriela` 添加到了组 `alisson` 中，然后用户就能访问该文件。但这次，我将采取不同的方法：\n\n```bash\ngabriela@devops:~$\
    \ chown gabriela:alisson letters_file\ngabriela@devops:~$ ls -la letters_file\n\
    -rw-rwxr-x 1 gabriela alisson 0 Feb 20 19:47 letters_file\n```\n\n现在，该文件的组所有是\
    \ `alisson`。如果我想更改用户，可以运行如下命令：\n\n```bash\ngabriela@devops:~$ sudo chown juergen\
    \ letters_file\n[sudo] password for gabriela:\ngabriela@devops:~$ ls -la letters_file\n\
    -rw-rwxr-x 1 juergen alisson 0 Feb 20 19:47 letters_file\n```\n\n`Jurgen` 是该文件的所有者。我们可以使用\
    \ `chown` 命令来更改文件或目录的用户和组。但我们也有一个命令可以更改组：\n\n```bash\ngabriela@devops:~$ sudo\
    \ chgrp gabriela letters_file\ngabriela@devops:~$ ls -la letters_file\n-rw-rwxr-x\
    \ 1 juergen gabriela 0 Feb 20 19:47 letters_file\n```\n\n组现在已经更改。因此，`chgrp` 命令仅更改组，而\
    \ `chown` 命令更改所有者，或者所有者和组。因此，为了完成这一章，我们只需要查看如何执行脚本。让我们创建一个简单的脚本：\n\n```bash\n\
    gabriela@devops:~$ echo \"echo this is a simple script\"> simple_script.sh\ngabriela@devops:~$\
    \ ls -la simple_script.sh\n-rw-rw-r-- 1 gabriela gabriela 29 Feb 20 20:05 simple_script.sh\n\
    ```\n\n在这里，我们创建了脚本。要执行它，请如下运行：\n\n```bash\ngabriela@devops:~$ ./simple_script.sh\n\
    -su: ./simple_script.sh: Permission denied\n```\n\n拒绝拒绝！发生这种情况是因为，如果我们分析之前运行的命令并检查权限，发现没有代表执行权限的\
    \ `x`。然后，设置以下权限：\n\n```bash\ngabriela@devops:~$ chmod +x simple_script.sh\n```\n\
    \n再次运行脚本：\n\n```bash\ngabriela@devops:~$ ./simple_script.sh\nthis is a simple\
    \ script\n```\n\n再次检查一次权限：\n\n```bash\ngabriela@devops:~$ ls -la simple_script.sh\n\
    -rwxrwxr-x 1 gabriela gabriela 29 Feb 20 20:05 simple_script.sh\n```\n\n用户、组和其他人的所有权限组中都有\
    \ `x`。因此，每个人都可以执行它。如果你只想给文件所有者或组提供执行权限，可以使用 `chmod` 来实现，并使用相同的 `math` 方法来设置权限。\n\
    \n# 第 3 章\n\n# 设置服务\n\n本章将解释 Linux 软件包系统的工作原理、如何安装软件包、安装服务、配置它，以及在你的第一个 LAMP (Linux\
    \ Apache MySQL PHP) 服务器上运行你的第一个应用程序。\n\n# 结构\n\n在本章中，我们将讨论以下主题：\n\n*   学习如何安装软件包\n\
    \    *   APT\n*   安装 Apache\n    *   配置你的服务\n    *   创建虚拟主机 (VHost)\n*   安装 MySQL\n\
    \    *   配置服务\n    *   创建数据库和表\n*   部署你的应用程序\n    *   安装 PHP\n    *   部署 WordPress\n\
    \n# 目标\n\n在学习此单元后，你应该能够：\n\n*   理解 Linux 软件包系统\n*   使用 APT 安装软件包\n*   设置 Web 服务器\n\
    *   设置数据库服务器\n*   部署应用程序\n\n# 学习如何安装软件包\n\n大多数 Linux 发行版默认都带有一个包管理器。它可以是 YUM、APT、Zypper、pacman、slackapt\
    \ 等。每个工具都有有其特殊之处，但它们都是为了同一个目的设计的：通过分布在世界各地的中心化仓库安装本质上是 Linux 程序的软件包。\n\n在第一章中，我简要解释了\
    \ Linux 发行版以及一些区别。其中一些区别体现在包管理系统中。现在，我将给出两个最著名的包管理器的示例。\n\n基于 Debian 的发行版（如 Ubuntu）拥有\
    \ `APT`（高级软件包工具）。它连接到这样的中心仓库，例如：`http://de.archive.ubuntu.com/ubuntu`。这仅仅是一个 Apache\
    \ Web 服务器，其中存储了我们可以选择并安装的多个软件包。\n\n基于 RedHat 的发行版（如 CentOS）拥有 `YUM`（黄色狗更新管理器），它很快将由\
    \ `DNF`（Dandified Yum）取代，这是 YUM 的新替代品。它也使用中心仓库，如 `https://dl.fedoraproject.org/pub/epel/7/x86_64/`，并且存储了多个软件包。\n\
    \n现在，让我们关注作为我们目标的 Debian，因为我们正在使用 Ubuntu。\n\n# APT\n\n如果你不带任何参数运行 `apt` 命令，你将看到以下输出：\n\
    \n```\nalisson@devops:~$ apt\napt 1.6.11 (amd64)\n\nUsage: apt [options] command\n\
    \napt 是命令行包管理器，提供了用于搜索和管理软件包以及查询软件包信息的命令。\n它提供了与专门的 APT 工具（如 apt-get 和 apt-cache）相同的功能，但默认启用了更适合交互式使用的选项。\n\
    \n最常用的命令：\nlist - 根据包名列出软件包\nsearch - 在包描述中搜索\nshow - 显示包详情\ninstall - 安装软件包\n\
    remove - 软件包\nautoremove - 自动删除未使用的软件包\nupdate - 更新可用软件包列表\nupgrade - 通过安装/升级软件包来升级系统\n\
    full-upgrade - 通过删除/安装/升级软件包来升级系统\nedit-sources - 编辑源信息文件\n\n访问 apt(8) 获取更多有关可用命令的信息。\n\
    \n配置选项和语法在 apt.conf(5) 中详细介绍。\n关于如何配置源的信息可以在 sources.list(5) 中找到。软件包和版本选择可以通过\
    \ apt_preferences(5) 表达。\n安全详情请参阅 apt-secure(8)。\n\n此 APT 拥有超级牛能力。\n```\n"
