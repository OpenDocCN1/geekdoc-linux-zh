    \ 是 Web 界面，可以连接到 `elasticsearch` 以实现数据可视化。否则，我们必须向 `elasticsearch` 的 API 发起请求。`Kibana`\
    \ 还为我们许多功能，例如基于日志创建图表。因此，我们可以创建过去两个小时内应用程序产生错误数量的可视化。或者在另一个示例中，我们可以统计 HTTP 状态码并根据请求数进行排序。40\
    \ 个请求返回状态 400，500 个请求返回状态 200，10 个请求返回状态 500 等。\n\n# 安装 EFK 堆栈\n\n我们将采用以下场景：我们将在使用\
    \ `Vagrant` 在虚拟机中设置 `elastsearch` 和 `Kibana`，`Fluentd` 将运行在我们的 `minikube` 集群中，用于将运行中的应用程序日志推送到远程服务器，并将以中心化的方式进行可视化。\n\
    \n`Vagrant` 文件如下：\n\n```ruby\n# -*- mode: ruby -*-\n# vi: set ft=ruby :\n# 所有\
    \ Vagrant 配置均在下方。Vagrant.configure 中的 \"2\"\n# 配置了配置版本（我们为了向后兼容性支持\n# 旧样式）。除非你确定自己在做什么，否则请不要更改它。\n\
