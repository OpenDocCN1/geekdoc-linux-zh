    The sample file has some configurations and many comments giving a brief explanation
    of what the commands do. This file, with the default configuration, allows you
    to create just one VM. In this chapter, we will create two virtual machines, one
    with the LAMP server installed, and other with the Docker installed. I will modify
    that file and explain the differences between the example file and the new one:


    ```ruby

    # -*- mode: ruby -*-

    # vi: set ft=ruby :

    Vagrant.configure("2") do |config|

    config.vm.box = "ubuntu/focal64"

    config.vm.box_check_update = false

    config.vm.provider "virtualbox" do |vb|

    vb.memory = "1024"

    end

    config.vm.define "lamp" do |lamp|

    lamp.vm.network "private_network", ip: "192.168.33.10"

    lamp.vm.provision "shell", inline: <<-SHELL

    apt-get clean

    apt update -y

    SHELL

    end

    config.vm.define "docker" do |docker|

    docker.vm.network "private_network", ip: "192.168.33.11"

    docker.vm.provision "shell", inline: <<-SHELL

    apt-get clean

    apt update -y

    SHELL

    end

    config.vm.provision "shell", inline: <<-SHELL

    apt-get clean

    apt update -y

    SHELL

    End

    ```


    The preceding file is my new and modified one. It is cleaner than the example
    one, and does more stuff. Let''s run the `vagrant status`, to see if something
    has changed:


    ```

    PS C:\Users\1511 MXTI\VagrantChapter> vagrant status

    ```


    Current machine states:

    lamp      not created (virtualbox)

    docker  not created (virtualbox)


    Interestingly, now we have two virtual machines, one is called a `lamp`, and the
    other is called `Docker`. Both are not created yet. In the new file, I used a
    Vagrant resource called `multi-machine`. It allows you to create more than one
    machine per file. So, you can have as many machines as you want in the same file.


    Now, let''s analyze the file and what will happen before we create the VMs:


    ```ruby

    config.vm.box = "ubuntu/focal64"

    config.vm.box_check_update = false

    config.vm.provider "virtualbox" do |vb|

    vb.memory = "1024"

    end

    ```


    This part with `config.vm` is the common configuration for all the virtual machines
    declared in the file. So, all the machines will be created with 1024 MB of RAM.
    The `config.vm.box` is the image which will be used in the machine. In our case,
    we will use the Ubuntu server, version 20.04:


    ```ruby

    config.vm.define "lamp" do |lamp|

    lamp.vm.network "private_network", ip: "192.168.33.10"

    lamp.vm.provision "shell", inline: <<-SHELL

    apt-get clean

    apt update -y

    SHELL

    end

    ```


    In this part, we have a local configuration just for the machine `lamp`. It is
    specifically for the virtual machine, called `lamp`. Then, in this called, the
    VM will have the IP address `192.168.33.10`, and the command which will be run
    in the provision of the VM, as in, inside this part: `lamp.vm.provision`. It also
    applies to the Docker VM:


    ```ruby

    config.vm.provision "shell", inline: <<-SHELL

    apt-get clean

    apt update -y

    SHELL

    ```


    In the final part, we have the `config.vm.provision`. Inside this block, you can
    define the command which will run in all the VMs, except `lamp.vm.provision`,
    which will run only in the lamp VM, and `docker.vm.provision`, which will run
    only in the Docker VM.

