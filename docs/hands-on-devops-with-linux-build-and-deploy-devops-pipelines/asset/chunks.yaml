    To run VMs on your laptop or personal computer, you need to check if your processor
    arch is 64-bit. This specification can be found at the laptop manufacturer or
    processor manufacturer. After checking this setting, you need to enable virtualization
    at your device''s BIOS or UEFI. This configuration can be very different according
    to your equipment, but in most of the cases, it can be found in the `Advanced`
    or `Security` option with the name Intel Virtualization Technology.


    # Installing the VirtualBox


    Nowadays, we have many options for virtualization tools to run on your laptop,
    like VMware Player, KVM, QEMU, HyperV. But, in my opinion, VirtualBox is the easiest
    one and has all the features we need to create our labs.


    To install the VirtualBox, you need to download its latest version from the official
    website:


    [https://www.virtualbox.org/wiki/Downloads](https://www.virtualbox.org/wiki/Downloads)


    I am using Windows system, so, I am going to download the Windows version. But,
    if you have the basic knowledge of Linux or you are using MacOS, the steps are
    basically the same.


    After downloading the file, double click and the installation step is basically
    `Next`, `Next`, and `Finish`. The following first window is just explaining that
    you are about to install the VirtualBox:


    ![](images/Figure-1.1.jpg)

    **Figure 1.1**


    The second window is important for you to select all the resources, because a
    lot of times, they are needed mainly when you want to share the files between
    your PC and the VM, or even configure networks:


    ![](images/Figure-1.2.jpg)

    **Figure 1.2**


    Following are the basic options about the shortcuts, if you want to add them to
    your desktop:


    ![](images/Figure-1.3.jpg)

    **Figure 1.3**


    At this step, the installation will ask you for the `Admin Rights,`, because the
    VirtualBox will create a `bridge interface.` This interface is responsible for
    the communication between the host machine and the VM, and without it, you will
    not be able to access the internet from your virtual machine:


    ![](images/Figure-1.4.jpg)

    **Figure 1.4**


    ![](images/Figure-1.5.jpg)

    **Figure 1.5**


    ![](images/Figure-1.6.jpg)

    **Figure 1.6**


    After the installation completes, you will be able to open the VirtualBox, and
    the main screen will be as shown in the following figure:


    ![](images/Figure-1.7.jpg)

    **Figure 1.7**


    Now, we are ready to set up our first Linux environment. The VirtualBox has a
    lot of options for you to configure and explore. But, I will not focus on it now
    because we have a Linux system to install.


    # Installing the Linux System


    Since I mentioned earlier that we will use the Ubuntu server to do everything
    in this book, you can download the latest version from this link:


    [https://ubuntu.com/download/server](https://ubuntu.com/download/server)


    Then, download this file: `ubuntu-18.04.3-live-server-amd64.iso`


    Now, let''s start the installation. The first step is to open the VirtualBox,
    click on `New`, and in the new window, type `UbuntuServer`, as given in the following
    example:


    ![](images/Figure-1.8.jpg)

    **Figure 1.8**


    After clicking on `Next,` you need to define the amount of memory you want to
    have in your VM. The Linux system, usually, does not need a lot of memory to work,
    but, after you install your services and test them, you will need more memory.
    For now, 1 GB is enough. Then, click on `Next`:


    ![](images/Figure-1.9.jpg)

    **Figure 1.9**


    In this part, create a `New Disk.` The disk is basically a file in your disk where
    the VM will store all the data. Click on `Create` and you will see the following
    window:


    ![](images/Figure-1.10.jpg)

    **Figure 1.10**


    VDI is the standard type used by the VirtualBox. You can change the type if you
    intend to import this machine in other Virtualization Tool. `VMDK`, for example,
    is the type used by VMware. Click on `Next`:


    ![](images/Figure-1.11.jpg)

    **Figure 1.11**


    This window is very important. In your laboratories, you will always use the `Dynamically
    allocated` option, because the VirtualBox will create a small file and will increase
    the size according to the disk usage.


    The `Fixed Size` is recommended for the production environments, because the Virtualization
    Tool will reserve that space for your VM. Even if you don''t use all the disk
    space allocated, it will avoid you from having more Virtual Space than the `Physical
    Space.` In some cases, when you use the `Dynamically allocated` size in production
    environments, you overcome the total space of your `Storage,` but your virtual
    machines still have free space. I had experienced this in the past and it is really
    hard to deal with. One more reason to choose this option is because you avoid
    your Virtualization Tool to recalculate the disk space after every writes. When
    you use the `Dynamically allocated` type for every write, your system will calculate
    the actual size and how much it needs to increase before it reaches the defined
    limit:


    ![](images/Figure-1.12.jpg)

    **Figure 1.12**


    Here, you can define where the VM data will be stored and the disk size. For us,
    10 GB is enough to run our tests:


    ![](images/Figure-1.13.jpg)

    **Figure 1.13**


    Now, your VM is created!


    # Installing Your Linux System


    Once we have all the prerequisites, like creating the VM and defining all the
    configurations, it''s time to install the system. So, double click on your VM.
    The following screen will sppear:


    ![](images/Figure-1.14.jpg)

    **Figure 1.14**


    You do not have any operating system installed in this VM. You need to select
    the ISO download from the Ubuntu website by clicking on the yellow folder:


    ![](images/Figure-1.15.jpg)

    **Figure 1.15**


    Click on `Add`, and select the ISO file you had already downloaded. Select it,
    click on choose, and `Start`:


    ![](images/Figure-1.16.jpg)

    **Figure 1.16**


    Now, select your language. I always select `English` even when I lived in Brazil,
    Canada, and now in Germany. Selecting this option, for sure, will avoid a lot
    of problems regarding collation, like punctuation, special characters, etc.:


    ![](images/Figure-1.17.jpg)

    **Figure 1.17**


    This option depends on your keyboard layout. You will probably need to change
    it according to the country you are living in the moment. My keyboard has the
    layout of the US, so I will select this option:


    ![](images/Figure-1.18.jpg)

    **Figure 1.18**


    Now, you don''t need to do anything. Just press `Done`, because we will use the
    default configuration. This step is really important because Ubuntu will download
    some updates during the installation. So, it is important to have an internet
    connection in your PC and in your VM:


    ![](images/Figure-1.19.jpg)

    **Figure 1.19**


    If you are doing this during your work time, and if your company has the proxy
    to access the internet, now is the time for you to configure. So, just put the
    proxy URL and press `Done`:


    ![](images/Figure-1.20.jpg)

    **Figure 1.20**


    Here, you can define the Mirror where Ubuntu will download the updates. If you
    have an internet connection, it will select the nearest mirror to you. In my case,
    I have the German repository:


    ![](images/Figure-1.21.jpg)

    **Figure 1.21**

