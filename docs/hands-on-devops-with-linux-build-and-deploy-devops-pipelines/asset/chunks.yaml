    672 systemd-n 20 0 80048 5076 4484 S 0.0 0.5 0:00.19 /lib/systemd/systemd-networkd

    696 systemd-r 20 0 70636 4916 4356 S 0.0 0.5 0:00.19 /lib/systemd/systemd-resolved

    ```


    In this simple output, we are able to see some improvements. For example, we now
    have a bar to indicate the amount of memory used in the server. It is a good tool
    to analyze the current state of your server, but it is not used much in the production
    system because it consumes more memory than the traditional `top`. So, let’s remove
    this package using the following command:


    ```bash

    root@devops:~# apt remove htop

    Reading package lists… Done

    Building dependency tree

    Reading state information… Done

    The following packages will be REMOVED:

    htop ubuntu-server

    0 upgraded, 0 newly installed, 2 to remove and 64 not upgraded.

    After this operation, 269 kB disk space will be freed.

    Do you want to continue? [Y/n] y

    (Reading database … 102467 files and directories currently installed.)

    Removing ubuntu-server (1.417.3) …

    Removing htop (2.1.0-3) …

    Processing triggers for mime-support (3.60ubuntu1) …

    Processing triggers for man-db (2.8.3-2ubuntu0.1) …

    ```


    These are all the commands you will probably use in your daily work while installing
    the packages on Linux. Beside the commands, we also have some important files
    which are required to install some packages that may not be available in the official
    repositories.


    The first important file is `/etc/apt/sources.list`:


    ```bash

    root@devops:~# cat /etc/apt/sources.list

    # See http://help.ubuntu.com/community/UpgradeNotes for how to upgrade to

    # newer versions of the distribution.

    deb http://de.archive.ubuntu.com/ubuntu bionic main restricted

    deb http://de.archive.ubuntu.com/ubuntu bionic-updates main

    ```


    Above-mentioned is an example of the first few entries from `sources.list`. These
    are the lines representing the remote repositories where the packages are found.
    If you want to add a new repository, you can just find the respective line and
    add at the end of this file, for example:


    ```text

    deb http://ppa.launchpad.net/canonical-kernel-team/unstable/ubuntu bionic main

    ```


    `PPA` (**Personal Packages Archives**). These are the useful repositories that
    are not included in the distribution, but you may find some packages which you
    want to use.


    Another important directory is `/var/cache/apt/`. In the beginning, I explained
    that `APT` stores the cache inside the Linux, and if it is too old, we need to
    clean and update it. This folder also downloads the packages installed in our
    system, for example:


    ```bash

    root@devops:~# apt install htop --download-only

    Reading package lists… Done

    Building dependency tree

    Reading state information… Done

    The following NEW packages will be installed:

    htop

    0 upgraded, 1 newly installed, 0 to remove and 64 not upgraded.

    Need to get 80.0 kB of archives.

    After this operation, 221 kB of additional disk space will be used.

    Get:1 http://de.archive.ubuntu.com/ubuntu bionic/main amd64 htop amd64 2.1.0-3
    [80.0 kB]

    Fetched 80.0 kB in 0s (451 kB/s)

    Download complete and in download only mode

    ```

