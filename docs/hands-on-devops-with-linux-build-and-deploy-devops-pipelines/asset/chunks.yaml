- fmt: '

    The second is the `/etc/skel`, where the command `adduser` gets the default files
    present in the `home` folder of the user. We can give it a look with the following
    command:


    ```

    alisson@devops:~$ ls /etc/skel/ -la

    ```


    ```

    total 20

    drwxr-xr-x 2 root root 4096 Aug 5 2019 .

    drwxr-xr-x 91 root root 4096 Feb 18 19:25 ..

    -rw-r--r-- 1 root root 220 Apr 4 2018 .bash_logout

    -rw-r--r-- 1 root root 3771 Apr 4 2018 .bashrc

    -rw-r--r-- 1 root root 807 Apr 4 2018 .profile

    ```


    These files are responsible to customize the user''s environment. We are going
    to edit them in the last part of this chapter. But, if you want to put more items
    inside the `home` folder, you can just add inside the `/etc/skel`, and they will
    be present for the next user created. Let''s test it.


    Let''s create a skeleton for a hosting server. How does the web server work? Usually,
    we have the user and in the `home` folder of each user, you have some folder called,
    `public_html`, `mail`, `conf`, `logs`. All these folders must be created at the
    same time as the user is created. So, run the following command:


    ```

    alisson@devops:~$ sudo mkdir /etc/skel/{public_html, logs, mail, conf}

    ```


    ```

    [sudo] password for alisson:

    alisson@devops:~$ ls /etc/skel/

    conf logs mail public_html

    alisson@devops:~$

    ```


    So, as you can see, now we have these four folders created inside the `/etc/skel`.
    Now, let''s create another user to see it working:


    ```

    alisson@devops:~$ sudo adduser customer01

    ```


    ```

    Adding user ''customer01'' …

    Adding new group ''customer01'' (1002) …

    Adding new user ''customer01'' (1002) with group ''customer01'' …

    Creating home directory ''/home/customer01'' …

    Copying files from ''/etc/skel'' …

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    Changing the user information for customer01

    Enter the new value, or press ENTER for the default

    Full Name []:

    Room Number []:

    Work Phone []:

    Home Phone []:

    Other []:

    Is the information correct? [Y/n]

    ```


    ```

    alisson@devops:~$ ls /home/customer01/

    ```


    ```

    conf logs mail public_html

    ```


    As you can see now, we have these folders created in the `home` folder of the
    user. I am setting the same password for all users. But, if you forgot a password
    and you want to change it, the command to do that is as follows:


    ```

    alisson@devops:~$ sudo passwd elvis

    ```


    ```

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    ```


    Now, type the new password and it is changed.


    We are now talking about the hosting servers. So, let''s use another example.
    Imagine your customer did not pay you. So, you need to block this user. To execute
    this task, you can run the following command:


    ```

    alisson@devops:~$ sudo passwd -l customer01

    ```


    ```

    passwd: password expiry information changed.

    ```


    One interesting thing about Linux is if you want to know how it blocks the users,
    you can give a look at the `/etc/shadow`:


    ```

    alisson@devops:~$ sudo getent shadow customer01

    ```


    ```

    customer01:!$6$PExBAe3N$6AxVOOJLi/A5ddWOp2I/ZhvB00mpVwq4KQ78/4.QNNcrz2tsGGFu8XXr/TU7NFA/Hg3T2X9.R5v6cCuzbYF8j.:18310:0:99999:7:::

    ```


    Paying attention to the output is easy. To note one difference, let''s compare
    with a non-blocked user:


    ```

    alisson@devops:~$ sudo getent shadow alisson

    ```


    ```

    alisson:$6$aeR.OxEqoVMnyUuq$eYxtbG6V.156mtlsK9QBZcVOjQZBm7NlcKFn5x1 yxF4mffuLYd6Wmz2R9V2iKZvuC7fgp96H7.jlQW/o7OenF/:18292:0:99999:7:::

    ```


    In the second column, where the password is stored, for a blocked user, you can
    see that the system puts an exclamation point (`!`) as the first character. This
    way, the user can type his password and it will never match with the hash because
    there is an exclamation point in the beginning.


    To unblock the user, type the following command:


    ```

    alisson@devops:~$ sudo passwd -u customer01

    ```


    ```

    passwd: password expiry information changed.

    alisson@devops:~$ sudo getent shadow customer01

    ```


    ```

    customer01:$6$PExBAe3N$6AxVOOJLi/A5ddWOp2I/ZhvB00mpVwq4KQ78/4.QNNcrz2tsGGFu8XXr/TU7NFA/Hg3T2X9.R5v6cCuzbYF8j.:18310:0:99999:7:::

    ```


    Now, Linux removed the `!` in the beginning of the hash and the user is able to
    access the shell again. If the customer canceled the service with you, it is possible
    to remove his user. To execute this task, you need to run the following command:


    ```

    alisson@devops:~$ sudo userdel elvis

    alisson@devops:~$ sudo getent passwd elvis

    ```


    It is important to remember that deleting a user does not mean the `home` directory
    is removed. If you want to remove it as well, you can use:


    ```

    alisson@devops:~$ sudo userdel -r elvis

    ```

