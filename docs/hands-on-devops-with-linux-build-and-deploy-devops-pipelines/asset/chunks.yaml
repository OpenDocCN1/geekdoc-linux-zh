  raw: 'Therefore, once all the tests were made by the developers, we can assume that
    we have a new version of our application, which can be called version 0.1\. Assuming
    that it is working, we will create a package of that application and deploy it
    in the staging environment. In this environment, someone from the business part
    of the company will validate again if the feature requests are working properly
    as they requested. This stage is also used for the UX team to validate if your
    interface is understandable and easy to use. If this version of the application
    does not fulfill all the requirements, or the developers did not understand how
    the new feature should work, this version can be discarded and they will work
    in a new version called, 0.2\. For example, and it will pass through all the environments
    again until it fulfills all the requirements specified by the end customer.


    At the end of the day, Continuous Delivery is being able to deploy a version of
    your application every time a new feature is released. Not accumulating these
    features will be harder to test, since many are not uncommon for business areas
    validating the application manually.


    # [Pipeline as Code and Jenkins](#toc.xhtml_s85a)


    We have many tools which can help us with the pipelines and integration between
    the environment, and indeed Jenkins is the most famous, because of its flexibility
    that allows us to install many plugins to easily integrate with the Cloud providers
    and also being open source. Thus, we do not need to pay for a license.


    The focus of this book is not especially software development, but Infrastructure
    as Code. So, all the examples that I will use will be regarding Infrastructure
    and how we can test and deploy it.


    Firstly, we need to setup our Jenkins server. I will setup it using Vagrant. To
    create a VM with Ubuntu, install Docker, and then, Jenkins will run on top of
    the Docker:


    `# -*- mode: ruby -*-`


