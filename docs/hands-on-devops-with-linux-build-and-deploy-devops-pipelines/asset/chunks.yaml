  trans: "\n现在，我们可以回到 Kibana 仪表板，因为日志应该已经发送到服务器了。下一个目标是将它们可视化。在初始页面上，点击 `Explore on\
    \ my own`（自行探索）选项。然后，点击左上角并发现日志：\n\n![](img/Figure-12.3.jpg)\n\n**图 12.3**\n\n\
    现在，我们可以创建一个匹配所有存储日志的索引。当该集群仅用于此 Kubernetes 环境时，我们就可以这样做。如果你对公司的所有日志使用同一个 `elasticsearch`，那么为每种情况创建不同的索引会更好：\n\
    \n![](img/Figure-12.4.jpg)\n\n**图 12.4**\n\n我们必须定义 `Index Pattern as *`（索引模式为\
    \ *），这将获取所有的日志：\n\n![](img/Figure-12.5.jpg)\n\n**图 12.5**\n\n你可以将时间过滤器选择为时间。如果我们再次回到发现（discovery）部分并选择\
    \ 3 个月前的日志，我们将能够看到日志已经在 `Elasticsearch` 中。当然，我们不需要设置 3 个月前，我只是想确保我们能看到所有的当前日志：\n\
    \n![](img/Figure-12.6.jpg)\n\n**图 12.6**\n\n如果你查看左侧，可以找到一些 Kubernetes 元素。你可以尝试操作一下，因为现在我们不需要访问\
    \ Kubernetes 集群就可以访问日志。\n\n让我们部署一个应用程序并看看我们如何检查日志：\n\n```bash\nkubectl create\
    \ ns chapter11\n```\n\n创建一个名为 `Chapter11: Deploying and Scaling your Application\
    \ using Kubernetes` 的命名空间，因为我们将使用上一个章节中的应用程序。应用程序的 `yaml` 文件如下：\n\n```yaml\napiVersion:\
    \ apps/v1\nkind: Deployment\nmetadata:\n  name: python\n  namespace: chapter11\n\
    \  labels:\n  app: python\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
    \      app: python\n  template:\n    metadata:\n      labels:\n        app: python\n\
    \    spec:\n      containers:\n      - name: python\n        image: alissonmenezes/python:latest\n\
    \        ports:\n        - containerPort: 8080\n---\napiVersion: v1\nkind: Service\n\
    metadata:\n  labels:\n  app: python\n  name: python\n  namespace: chapter11\n\
    spec:\n  ports:\n  - name: http\n    port: 80\n    protocol: TCP\n    targetPort:\
    \ 8080\n  selector:\n    app: python\n  type: ClusterIP\n---\napiVersion: extensions/v1beta1\n\
    kind: Ingress\nmetadata:\n  name: python\n  labels:\n    app: python\n  namespace:\
    \ chapter11\n  annotations:\n    nginx.ingress.kubernetes.io/rewrite-target: /\n\
    spec:\n  backend:\n    serviceName: python\n    servicePort: 80\n```\n\n现在运行以下命令：\n\
    \n```bash\nPS C:\\Users\\1511 MXTI\\Documents\\Blog\\EKF> minikube.exe ip\n```\n\
    `192.168.99.102`\n\nKubernetes IP 是 `192.168.99.102`。我们将使用它来访问应用程序。确保你已经通过以下命令启用了\
    \ ingress：\n\n```bash\nPS C:\\Users\\1511 MXTI\\DataLake> minikube.exe addons\
    \ enable ingress\n```\n* 'ingress' 插件已启用\n\n如果我们在浏览器中访问应用程序，我们将看到以下页面：\n\n![](img/Figure-12.7.jpg)\n\
    \n**图 12.7**\n\n如果我们查看 Kubernetes 上的应用程序日志，我们可以看到以下：\n\n```bash\nPS C:\\Users\\\
    1511 MXTI\\DataLake> kubectl logs deploy/python -n chapter11\n```\n* Running on\
    \ http://0.0.0.0:8080/ (Press CTRL+C to quit)\n* Restarting with stat\n* Debugger\
    \ is active!\n* Debugger PIN: 954-738-244\n`172.17.0.6 - - [28/Jun/2020 10:22:16]\
    \ \"GET / HTTP/1.1\" 200 -`\n`172.17.0.6 - - [28/Jun/2020 10:22:17] \"GET /favicon.ico\
    \ HTTP/1.1\" 404 -`\n`172.17.0.6 - - [28/Jun/2020 10:22:18] \"GET / HTTP/1.1\"\
    \ 200 -`\n`172.17.0.6 - - [28/Jun/2020 10:22:18] \"GET / HTTP/1.1\" 200 -`\n\n\
    这意味着我们已经生成了一些日志，然后我们可以在 Kibana 上看到它们。让我们看一下。首先，我们需要 pod 名称：\n\n```bash\nPS C:\\\
    Users\\1511 MXTI\\DataLake> kubectl get pods -n chapter11\n```\n`NAME        \
    \                 READY   STATUS    RESTARTS  AGE`\n`python-779879dbb6-wrw2g \
    \ 1/1     Running   0         44m`\n\n在 Kibana 上的查询将如下：\n\n`kubernetes.pod_name:python-779879dbb6-wrw2g`\n\
    \n语法是：`key : value`。然后，第一个参数是你想要过滤的相应元素。冒号 `:` 代表等于，最后是你用作标准的值。\n\n你看到的 Kibana\
    \ 页面将如截图所示：\n\n![](img/Figure-12.8.jpg)\n\n**图 12.8**\n\n让我们分析日志，因为我们有一个重要信息需要检查：\n\
    \n![](img/Figure-12.9.jpg)\n\n**图 12.9**\n\n注意，`pod_name` 匹配标准，且日志包含了我们在 Kubernetes\
    \ 上看到的日志行。现在我们确定日志已发送到 elasticsearch。我们可以在 Kibana 上将它们可视化，现在，我们可以创建一个特定的可视化结果来简化日志分析。\n\
    \n# 创建告警\n\n既然 elasticsearch 中有了日志，而且我们知道如何找到它们，让我们创建一些告警，以便它们在事件发生时通知我们。事件可以由你定义，可以返回状态\
    \ `404`、状态 `500`，或者例如错误消息的一部分。\n\n在我们的情况下，每当有人尝试访问不存在的页面时，它将返回 `404` 状态并发送通知。为了实现这一点，我们将使用一个名为\
    \ `ElastAlert` 的工具。这是一个 Python 工具，它可以连接到我们的 elasticsearch，读取日志并发送通知。\n\n在 EFK\
    \ 栈中，让我们安装它。\n\n```bash\nroot@efk:~# apt install python3-pip -y\nroot@efk:~# python3\
    \ -m pip install elastalert\n```\n\n有时，我们可能会因为其他模块的版本而遇到问题。`ElastAlert`最重要的模块是\
    \ `PyYAML`。所以，让我们升级它以确保我们使用的是最新版本：\n\n```bash\nroot@efk:~# python3 -m pip install\
    \ PyYAML --upgrade\n```\n\n一旦安装 ElastAlert，我们需要将其与 elasticsearch 连接。要这样做，运行以下命令：\n\
    \n```bash\nroot@efk:~# elastalert-create-index\n```\n`Enter Elasticsearch host:\
    \ 127.0.0.1`\n`Enter Elasticsearch port: 9200`\n`Use SSL? t/f: f`\n`Enter optional\
    \ basic-auth username:`\n`Enter optional basic-auth password:`\n`Enter optional\
    \ Elasticsearch prefix (prepends a string to the URL of request):`\n`New index\
    \ name? (Default elastalert_status)`\n`New alias name? (Default elastalert_alerts)`\n\
    `Name of existing index to copy? (Default None)`\n`Elastic Version: 7.0`\n`Reading\
    \ Elastic 6 mappings:`\n`Reading index mapping 'es_mappings/silence.json'`\n`Reading\
    \ index mapping 'es_mappings/elastalert_status.json'`\n`Reading index mapping\
    \ 'es_mappings/elastalert.json'`\n`Reading index mapping 'es_mappings/past_elastalert.json'`\n\
    `Reading index mapping 'es_mappings/elastalert_error.json'`\n`New index elastalert_status\
    \ created`\n`Done!`\n\n所以，下一步是创建 `config.yaml`，这是配置 elasticsearch 服务器的文件：\n\n\
    ```bash\nroot@efk:~# cat config.yaml\n```\n`rules_folder: rules`\n`run_every:`\n\
    `minutes: 1`\n`buffer_time:`\n`minutes: 15`\n`es_host: 127.0.0.1`\n`es_port: 9200`\n\
    `writeback_index: elastalert_status`\n`writeback_alias: elastalert_alerts`\n`alert_time_limit:`\n\
    `days: 2`\n\n现在，我们需要创建一个规则。`ElastAlert` 每分钟运行一次查询，检查我们是否有匹配标准的日志。使用以下命令创建一个名为\
    \ rules 的文件夹：\n\n```bash\nroot@efk:~# ls\n```\n`config.yaml rules`\n\n```bash\n\
    root@efk:~# mkdir rules\nroot@efk:~# pwd\n```\n`/root`\n\n在 rules 文件夹中，创建一个名为\
    \ `alert_404.yml` 的文件，内容如下：\n\n```yaml\nes_host: 192.168.99.50\nes_port: 9200\n\
    name: Alerting 404\ntype: frequency\nindex: \"*\"\nnum_events: 1\ntimeframe:\n\
    \  hours: 24\nfilter:\n- query:\n    wildcard:\n      log: \"404\"\nalert:\n-\
    \ slack:\n    slack_webhook_url: \"https://hooks.slack.com/services/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\"\
    `\n```\n"
- fmt: "\nI created a workspace on Slack, where I created a web hook. If you want\
    \ to know more about that, you can check the documentation later on. But, for\
    \ now, the most important thing is to see if it is working. So, let's run the\
    \ `ElastAlert` with the following command:\n\n```\nroot@efk:~# elastalert --rule\
    \ rules/alert_404.yml --verbose\n```\n\n```\n1 rules loaded\nINFO:elastalert:Starting\
    \ up\nINFO:elastalert:Disabled rules are: []\nINFO:elastalert:Sleeping for 9.999665\
    \ seconds\n```\n\nNow, you can try to access a non-existing page, like the following\
    \ screenshot:\n\n![](images/Figure-12.10.jpg)\n\n**Figure 12.10**\n\nThis access\
    \ should generate a log with the `404` status. You probably saw a log like this\
    \ on `ElastAlert`:\n\n```\nINFO:elastalert:Queried rule Alerting 404 from 2020-06-30\
    \ 18:54 UTC to 2020-06-30 18:57 UTC: 2 / 2 hits\nINFO:elastalert:Ran Alerting\
    \ 404 from 2020-06-30 18:54 UTC to 2020-06-30 18:57 UTC: 2 query hits (2 already\
    \ seen), 0 matches, 0 alerts sent\nINFO:elastalert:Background configuration change\
    \ check run at 2020-06-30 18:57 UTC\nINFO:elastalert:Background alerts thread\
    \ 0 pending alerts sent at 2020-06-30 18:57 UTC\n```\n\nIt means that our alert\
