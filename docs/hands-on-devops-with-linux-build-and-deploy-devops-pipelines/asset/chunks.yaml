    # 第 7 章


    ## 使用云服务创建你的基础设施


    本章旨在向你介绍最大的云服务商，以及我们如何利用它们来加速基础设施的配置、扩展性和可靠性。


    ### 结构


    在本章中，我们将讨论以下主题：


    * 云和主要参与者

    * 使用 AWS 进行配置

    * 使用 GCP 进行配置

    * 使用 Azure 进行配置


    ### 目标


    学习本单元后，你应该能够：


    * 定义什么是云以及如何使用它

    * 在每个服务商上设置环境

    * 使用命令行创建简单的基础设施

    * 在云控制台中检查创建的基础设施


    ### 云和主要参与者


    到目前为止，我们一直使用自己的电脑来创建一切。然而，在生产环境中运行应用程序需要很多支持，例如高可用性、备份、监控、冗余等。在过去，许多公司拥有自己的数据中心或本地服务器，并
    24*7 小时运行。因此，管理一切需要耗费大量精力，因为不仅要维护虚拟机或软件，还需要管理网络、存储、能源、不间断运行、互联网连接以及许多涉及 IT 的其他事务。此外，还需要一个拥有不同技能的团队来管理一切，并且需要人员上的冗余，因为如果公司里的某些员工生病了，你必须有其他人可用，以防某些环节停止工作。


    当我开始在 IT 行业工作时，我曾就职的一些公司正在使用一种称为 Colocation（托管）的服务，你基本上可以在数据中心内租用一个机架（Rack），并安装你的服务器。因此，你只需要管理自己的服务器。网络、能源和互联网部分都交给了提供服务的公司。过了一段时间，我们开始使用一家名为
    `SoftLayer` 的公司的服务。他们有自己的数据中心，当我们租服务器时，可以付费并使用一段时间物理服务器。


    在此之后，我们开始与 `AWS` 合作，这是一家云公司。在那里，我们可以租用虚拟机，就像我们在前面的章节中创建的 VM 一样。使用此服务有很多好处，例如高可用性。所以，如果他们数据中心里的某个物理服务器故障，你只需要关闭
    VM 并在另一台服务器上启动它，甚至可以付费让他们为你进行备份。这样，一个人就可以管理包含数百台服务器的整个基础设施。


    ### AWS


    Amazon Web Services 是目前主要的云服务参与者。他们有几十种服务，可以使用它们来部署应用程序、监控、备份、创建 VM、数据库、队列等。它还允许你使用命令行以自动化方式创建一切，这被称为
    `AWSCLI`。但当然，使用他们所有的服务并不那么容易。这就是为什么他们创建了许多课程和认证，以便人们获得资质并充分利用他们服务提供的功能。


    ### GCP


    Google Cloud Platform（谷歌云平台）是最新的。他们提供的许多服务与 AWS 类似，但他们还没有拥有所有的服务。尽管如此，他们拥有一些独特的服务，比如
    `Big Query`，它是查询大型数据集和将数据存储在云端常用的工具之一。此外，如果你从事机器学习，他们提供了可用的集群来配合 `TensorFlow`
    项目发挥最大性能。GCP 通常比其他大竞争对手便宜。我正用它处理我的个人项目。


    ### Azure


    这是微软的云平台。所以，如果你计划将活动目录（Active Directory）导出到云端，这就是你的选择。他们有独特的服务，如 `SQL server`、`Azure
    Active Directory` 甚至非常著名的 `Azure DevOps`。我过去就职的一些大公司曾使用 Azure 作为他们的主平台，因为微软是一家可靠的公司。但他们也是最贵的。所以，如果钱不是你的问题，而且你在应用程序中使用了微软产品，这就是正确的选择。


    ### 使用 AWS 进行配置


    AWS 有自己的课程来解释如何使用所有服务。那么，我这里的目标是向你展示如何提供与我们使用 VirtualBox 和 Vagrant 时相同的基础设施。因此，我将关注
    VM 以及我们如何在上面安装东西。


    因此，你的第一个任务是创建你自己的 AWS 账户。你可以访问以下链接进行创建：


    `http://console.aws.amazon.com/`


    创建账户并登录控制台后，你将看到如图所示的页面：


    ![](img/Figure-7.1.jpg)


    **图 7.1**


    该控制台允许你创建任何你的服务。现在，点击 `Services`|`EC2`|`Running Instances`。你会看到以下页面：


    ![](img/Figure-7.2.jpg)


    **图 7.2**


