    `# Cmnd alias specification`


    `# User privilege specification`


    `root ALL=(ALL:ALL) ALL`


    `# Members of the admin group may gain root privileges`


    `%admin ALL=(ALL) ALL`


    `# Allow members of group sudo to execute any command`


    `%sudo   ALL=(ALL:ALL) ALL`


    `# See sudoers(5) for more information on "#include" directives:`


    `#includedir /etc/sudoers.d`


    This file is responsible to manage who can use the `sudo` command. I explained
    earlier, the only users in the group `sudo` can run the command. But, how does
    the command know which group it needs to use? Because of the following line:


    `# Allow members of group sudo to execute any command`


    `%sudo   ALL=(ALL:ALL) ALL`


    You can put more groups in this file or you can put the users directly, like the
    following line:


    `# User privilege specification`


    `root   ALL=(ALL:ALL) ALL`'
