    `Vagrant.configure("2") do |config|`


    `config.vm.box = "ubuntu/bionic64"`


    `config.vm.box_check_update = false`


    `config.vm.provider "virtualbox" do |vb|`


    `vb.memory = "1024"`


    `end`


    `config.vm.define "docker" do |docker|`


    `docker.vm.box = "ubuntu/bionic64"`


