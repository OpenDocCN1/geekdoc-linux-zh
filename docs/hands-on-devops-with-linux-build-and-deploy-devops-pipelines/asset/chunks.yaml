  trans: "\n我们知道使用密码访问服务器并不是最佳实践，因为它们不够可靠且容易泄暴露。因此，我们可以创建一个密钥对来确保访问安全。你可以通过输入以下命令退出\
    \ shell：\n\n```\nalisson@devops:~$ logout\n```\n\n```\nConnection to 192.168.178.62\
    \ closed.\n```\n\n或者按下 `Ctrl` + `D`。在你的 PowerShell 控制台中，输入以下命令：\n\n```\nssh-keygen\n\
    ```\n\n并对所有选项直接按 `Enter` 键。此命令将为你生成两个文件：\n\n* `id_rsa`: `id_rsa` 是你的私钥。它应该留在你的电脑上，并且只有你才能拥有这个文件。\n\
    * `id_rsa.pub`: `id_rsa.pub` 是公钥。你将把此文件复制到每一个你想无密码访问的 Linux 服务器上。\n\n将你的公钥拷贝到我们的服务器，运行以下命令：\n\
    \n```bash\nscp .\\.ssh\\id_rsa.pub alisson@192.168.178.62:/home/alisson/id_rsa.pub\n\
    ```\n\n```\nalisson@192.168.178.62's password:\nid_rsa.pub\n100%   398   397.4KB/s\
    \   00:00\n```\n\n文件已拷贝，现在再次访问服务器：\n\n```bash\nssh alisson@192.168.178.62\n```\n\
    \n```\nalisson@192.168.178.62's password:\n```\n\n创建 `.ssh` 目录并创建 `authorized_keys`\
    \ 文件。该文件将存储所有使用 `alisson` 用户访问服务器的公钥：\n\n```bash\nmkdir .ssh\ncat id_rsa.pub >>\
    \ .ssh/authorized_keys\nlogout\n```\n\n现在，如果你尝试再次访问服务器，将不再询问密码，如下例所示：\n\n```bash\n\
    ssh alisson@192.168.178.62\n```\n\n```\nWelcome to Ubuntu 18.04.3 LTS (GNU/Linux\
    \ 4.15.0-76-generic x86_64)Welcome to Ubuntu 18.04.3 LTS (GNU/Linux 4.15.0-76-generic\
    \ x86_64)\n* Documentation:    https://help.ubuntu.com\n* Management:      https://landscape.canonical.com\n\
