    # CHAPTER 9: Working with Git


    This chapter aims to introduce you to `Git`, a tool to help you work in the same
    code, and collaborate with other developers in the same project in a remote way.


    ## Structure


    In this chapter, we will discuss the following topics:


    * `Git`

    * `GitFlow`

    * `GitHub`


    ## Objectives


    After studying this unit, you should be able to:


    * Install and use `Git` with the local repositories

    * Understand the `GitFlow` and how it can be applied in the daily work

    * Share your code with other people using `GitHub`


    ## Git


    `Git` is a tool created by `Linus Torvalds`, the creator of the Linux system.
    The tool was created to help the Linux developers control the development flow
    among many developers around the world. It helps to solve conflicts, track the
    modifications, or even revert the configurations that were working before and
    stopped working in a new version.


    To install `Git`, you can access the following link:


    [https://git-scm.com/download/win](https://git-scm.com/download/win)


    The installation process is the same that we did for all Windows applications;
    just `Next`, `Next`, and `Finish`. After the installation, you will find a new
    program called `Git Bash`, which allows you to create your local repos and use
    the `Git` commands to create versions of your application:


    ![](images/Figure-9.1.jpg)


    **Figure 9.1**


    In the next steps, I will show you some basic commands which are enough for you
    to use `Git` in your daily work. Of course, it is possible to create an entire
    book just to explain the `Git` commands and how to deal with conflicts and different
    strategies of versioning code. However, let''s keep with the basics because “done
    is better than perfect":


    ```

    1511 MXTI@avell MINGW64 ~

    $ mkdir Chapter09

    1511 MXTI@avell MINGW64 ~

    $ cd Chapter09/

    ```


    Aforementioned, you have the output of my `Git Bash`. Creating a folder, called
    `Chapter09` and get inside that folder. Here, I will create my first repository:


    ```

    1511 MXTI@avell MINGW64 ~/Chapter09

    $ git init

    Initialized empty Git repository in C:/Users/1511 MXTI/Chapter09/.git/

    ```


    The command `git init` is responsible to initialize any folder of a `Git` repository.
    It basically creates a folder, called `.git` with a pre-defined folder structure
    which will store the files with the metadata for your code, like what was changed
    from the current version of the code and your modifications, which files you want
    to send to the new version, and other things. A repository is a folder where you
    store and track the modifications of your code.


    Now, we can use any text editor to create some code and track the changes. I will
    use the Visual Studio Code, because it is my favorite. But, feel free to use any
    according to your preference:


    ![](images/Figure-9.2.jpg)


    **Figure 9.2**


    I created a new file called `code.txt` in the text editor, just too as an example
    with some random content. Within the `Git` repositories, we can track the modifications
    of any kind of the text file, Python codes, C++ codes, Java, or whatsoever.


    The next step is to check what changed since the beginning when I created the
    repository and created the file, the Visual Studio Code as integration with the
    PowerShell. Thus, I will use it to run the `Git` commands.


    The first command is `git status`:


    ```

    PS C:\Users\1511 MXTI\Chapter09> git status

    On branch master

    No commits yet

    Untracked files:

    (use "git add <file>…" to include in what will be committed)

    code.txt

    nothing added to commit but untracked files present (use "git add" to track)

    ```


    In the preceding command, we can see that we are on the `branch` `master` and
    we have one untraced file, called `code.txt`. The branches are the versions that
    you can have of the same project. You can use it in the way that you want, with
    the name that you want. However, create a flow which helps you to keep a standard
    of the organization. Otherwise, each project would have a version strategy.


