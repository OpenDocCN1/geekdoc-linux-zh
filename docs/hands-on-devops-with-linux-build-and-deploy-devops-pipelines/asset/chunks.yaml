  trans: "\n现在，我们可以使用云提供商创建文件并构建第一个虚拟机（VM）。我将首先使用 `GCP`，这是我个人项目使用的云提供商。然后，第一步是创建一个用于存储代码的文件夹。\n\
    \n![](img/p161.jpg)\n\n当然，将代码拆分为多个文件是最佳实践，因为这使得代码具有可复性且易于管理。但在这里，我们只创建一个虚拟机来学习\
    \ Terraform 语法并理解它的工作原理。因此，我将所有内容都写在一个单文件中。\n\n## 设置服务账户 (Service Account)\n\n\
    首先，我们需要创建一个服务账户，它相当于用户名和密码，用于代表我创建资源。访问 Google Cloud 控制台 (`https://console.cloud.google.com/`)，进入\
    \ `IAM & Admin`，并在 `Create service account` 中创建一个名为 `terraform` 的账户，如下截图所示：\n\n\
    ![](img/Figure-8.1.jpg)\n\n**图 8.1**\n\n点击 `Create`，然后选择 `Role Compute Admin`。此角色将允许服务账户管理与\
    \ Compute Engine 相关的所有资源，这对应于我们的虚拟机。\n\n然后，你必须按照如下所示创建一个 JSON 格式的密钥：\n\n![](img/Figure-8.2.jpg)\n\
    \n**图 8.2**\n\n现在，你已经配置好了服务账户并可以供 Terraform 使用。复制 JSON 文件，并将其放入创建 Terraform 代码的同一个文件夹中。在我们创建的文件夹中，创建一个名为\
    \ `infrastructure.tf` 的新文件，内容如下：\n\n```terraform\nprovider \"google\" {\n  credentials\
    \ = file(\"terraform_sa.json\")\n  project     = \"alisson-187813\"\n  region\
    \      = \"us-east1\"\n}\n```\n\n这段代码对于 Terraform 是必须的。在这个文件中，你将使用 Google provider。Provider\
    \ 是为了在你的 Terraform 代码与你想交互的平台之间建立接口而创建模块。例如，我曾遇到过需要在 Linux 上管理 DNS 服务器（Bind9）的情况。当使用\
    \ Terraform 执行的方法是使用 `TSIG` 协议时，我必须导入 DNS provider。在 Azure 的情况下，我导入了 `AzureRM`\
    \ provider。如果你想了解更多信息，我的个人博客上有两篇文章。\n\n使用 Azure 和 Terraform：[`alissonmachado.com.br/terraform-azure-criando-uma-infraestrutura-basica/`](http://alissonmachado.com.br/terraform-azure-criando-uma-infraestrutura-basica/)\n\
    \n使用 Terraform 和 TSIG 管理 DNS：[`alissonmachado.com.br/terraform-gerenciando-dns-com-tsig/`](http://alissonmachado.com.br/terraform-gerenciando-dns-com-tsig/)\n\
    \n## 初始化 Terraform\n\n回到代码部分，provider 并不随 Terraform 默认提供。你需要下载它们。你可以使用以下命令完成：\n\
    \n```cmd\nC:\\Users\\1511 MXTI\\ProductionInfrastructure> terraform init\n```\n\
    \n```text\nInitializing the backend…\nInitializing provider plugins…\n- Checking\
    \ for available provider plugins…\n- Downloading plugin for provider \"google\"\
    \ (hashicorp/google) 3.20.0…\nThe following providers do not have any version\
    \ constraints in configuration, so the latest version was installed. 防止自动升级到可能包含破坏性更改的新主版本，建议在配置中相应的\
    \ provider 块中添加 version = \"…\" 约束，使用下方建议的约束字符串。\n* provider.google: version =\
    \ \"~> 3.20\"\nTerraform has been successfully initialized!\n```\n\n你现在可以开始使用\
    \ Terraform 了。尝试运行 `terraform plan` 来查看你的基础设施所需的任何更改。现在所有的 Terraform 命令都应该可以工作。\n\
    \n如果你设置或更改了 Terraform 的模块或后端（backend）配置，请重新运行此命令重新初始化工作目录。如果你忘记了，其他命令会检测到并在必要时提醒你这样做。\n\
    \n## 创建基础设施\n\n现在你能够创建基础设施了，因为你已经在本地机器上安装了 provider。因此，包含以下代码来创建我们的第一个实例：\n\n\
    ```terraform\nprovider \"google\" {\n  credentials = file(\"terraform_sa.json\"\
    )\n  project     = \"alisson-187813\"\n  region      = \"us-east1\"\n}\n\nresource\
    \ \"google_compute_instance\" \"chapter8\" {\n  name         = \"chapter8-instance\"\
    \n  machine_type = \"g1-small\"\n  zone         = \"us-east1-b\"\n  boot_disk\
    \ {\n    initialize_params {\n      image = \"ubuntu-1804-bionic-v20200414\"\n\
    \    }\n  }\n  network_interface {\n    network = \"default\"\n    access_config\
    \ {\n    }\n  }\n}\n```\n\n在前面的代码中，我们定义将使用一个名为 `google_compute_instance` 的资源，正如我们在上一章中所做的，它对应于虚拟机。但现在，我们使用\
    \ Terraform 来。该实例将使用 `us-east1-b` 区域的 Ubuntu 1804 镜像以及其他细节（如网络配置）。我们将使用 Google\
    \ 设置的默认值。\n\n使用 Terraform 创建新代码时，第一件事是运行以下命令：\n\n```powershell\nPS C:\\Users\\\
    1511 MXTI\\ProductionInfrastructure> terraform plan\n```\n\n```text\nRefreshing\
    \ Terraform state in-memory prior to plan…\n刷新后的状态将用于用于计算此计划，但不会被\n持久化到本地或远程状态存储中。\n\
    ------------------------------------------------------------------------\n已生成执行计划，并如下所示。\n\
    资源操作将用以下符号表示：\n+ create\nTerraform will perform the following actions:\n# google_compute_instance.chapter8\
    \ will be created\n+ resource \"google_compute_instance\" \"chapter8\" {\n+ can_ip_forward\
    \           = false\n+ cpu_platform             = (known after apply)\n+ current_status\
    \           = (known after apply)\n+ deletion_protection      = false\n+ guest_accelerator\
    \        = (known after apply)\n+ id                      = (known after apply)\n\
    + instance_id              = (known after apply)\n+ label_fingerprint        \
    \ = (known after apply)\n+ machine_type             = \"g1-small\"\n+ metadata_fingerprint\
    \      = (known after apply)\n+ min_cpu_platform         = (known after apply)\n\
    + name                     = \"chapter8-instance\"\n+ project                \
    \  = (known after apply)\n+ self_link                = (known after apply)\n+\
    \ tags_fingerprint          = (known after apply)\n+ zone                    \
    \  = \"us-east1-b\"\n+ boot_disk {\n+ auto_delete              = true\n+ device_name\
    \              = (known after apply)\n+ disk_encryption_key_sha256 = (known after\
    \ apply)\n+ kms_key_self_link        = (known after apply)\n+ mode           \
    \           = \"READ_WRITE\"\n+ source                    = (known after apply)\n\
    + initialize_params {\n+ image  = \"ubuntu/1804-lts\"\n+ labels = (known after\
    \ apply)\n+ size   = (known after apply)\n+ type   = (known after apply)\n}\n\
    }\n+ network_interface {\n+ name               = (known after apply)\n+ network\
    \            = \"default\"\n+ network_ip         = (known after apply)\n+ subnetwork\
    \         = (known after apply)\n+ subnetwork_project = (known after apply)\n\
    + access_config {\n+ nat_ip          = (known after apply)\n+ network_tier = (known\
    \ after apply)\n}\n}\n}\n+ scheduling {\n+ automatic_restart   = (known after\
    \ apply)\n+ on_host_maintenance = (known after apply)\n+ preemptible         \
    \ = (known after apply)\n+ node_affinities {\n+ key      = (known after apply)\n\
    + operator = (known after apply)\n+ values   = (known after apply)\n}\n}\n}\n\
    }\n\nPlan: 1 to add, 0 to change, 0 to destroy.\n\n------------------------------------------------------------------------\n\
    注意: 你没有指定一个 \"-out\" 参数来保存此计划，因此当随后运行 \"terraform apply\" 时，Terraform 无法保证将恰好执行这些操作。\n"
