    你经常会看到 Linux 与其他字母绑定在一起，比如 GNU。这是因为当 Linus Torvalds 创建 Linux 时，他使用了许多由 GNU 项目创建的工具，[`www.gnu.org/home.en.html`](https://www.gnu.org/home.en.html)。GNU
    项目始于自由软件会创始人理查德·斯托曼（Richard Stallman），[`www.fsf.org`](https://www.fsf.org)。开源意味着什么？这意味着由
    GNU 项目编写的每个软件，其代码对任何想要对其进行开发的人开放。那么，Linus Torvalds 是如何使用 GNU 项目工具的呢？他采用同样的开源哲学，并使用
    GNU 项目的工具发布了 Linux 系统。这解释了 GNU/Linux 这个术语的由来。


    # 发行版


    由于 Linux 是开源的，许多个人和公司创建了他们自己的 Linux 版本，这些被称为“发行版”。任何拥有计算机编程知识的人都可以创建自己的 Linux
    发行版。一个例子是由巴西程序员卡洛·莫里托（Carlos Morimoto）创建的 Kurumin Linux，可以在此链接找到：[`distrowatch.com/table.php?distribution=kurumin`](https://distrowatch.com/table.php?distribution=kurumin)。遗憾的是，它已经停止维护了，因为维护自己的发行版并不是一项轻松的任务。你必须担心更新、新版本、新软件、错误修复以及无数可能的事情，对于单个人来说，在没有报酬的情况下投入所有这些精力基本上是不可能的。因此，决定在你的基础设施中安装哪种发行版是一个重要的课题。想象一下这种情况：你开始使用一个发行版，一年后，它停止维护了，你必须重新安装你包含
    300 多台服务器的整个基础设施。作为专业人士，我们不能让这种情况发生。


    关于我们想为基础设施选择的发行版，有多个选择，但其中一些是最常用的，原因我将在下文中进一步解释：


    *   **RedHat Enterprise Linux (红帽企业级 Linux)**：由于红帽公司的存在，它是最著名且最企业化的发行版。它是 Linux
    世界最著名的公司之一。它拥有强大的支持、频繁的更新，并且与红帽软件有 100%的兼容性，例如 `JBoss`、`OpenStack`、`RedHat Enterprise
    Virtualization Manager` 以及许多其他选项。但是，使用 `RHEL` 需要向公司购买订阅并付费。否则，你既无法收到任何更新，也无法访问仓库。

    *   **Community Enterprise Operating System (社区企业操作系统)**：`CentOS` 是 `RHEL` 的社区版本。在那些选择不使用付费版本并希望使用红帽软件社区版本的公司中，它是最常见的发行版。

    *   **SUSE**：它是 Novell（微软）的发行版，是一个不错的选择，因为微软是全球最大的公司之一。因此，它停止维护的概率为零，你将始终获得公司发布的更新和新软件。它还有一个名为
    `OpenSUSE` 的社区版本，其特性与 `CentOS` 相同。

    *   **Debian**：对于那些更深参与社区且不希望绑定到任何公司（如之前提到的发行版）的人来说，这是一个选择。`Debian` 100% 由社区维护，是我们拥的最古老的发行版之一。此外，它运行在许多服务器上，非常稳定可靠，经常被公司和普通用户使用。

    *   **Ubuntu**：这个发行版是由 `Canonical` 公司在非洲制作的，他们曾向全球分发 CD，让人们更多地了解 Linux 并在桌面上运行它。`Canonical`
    最初的目标用户是终端用户。因此，我认为对于桌面来说，Ubuntu 是最常用的发行版，而对于服务器，则是 `CentOS`。`Ubuntu` 有一个服务器版本，那是我最喜欢的发行版。这就是为什么我使用
    `Ubuntu` 来写这本书。但你在这里学到的知识可以适用于所有的发行版。


    # 服务器


    服务器无非是计算机。它们通常比 PC 更强大，是为了特定目的而创建和安装的。例如，我们可以安装一个 Linux 服务器来充当 Web 服务器。换句话说，就是在上面运行网站，比如
    Facebook、Amazon 或 Google。它也可以作为数据库服务器，我们可以在上面安装 `PostgreSQL`、`SQL Server`、`MySQL`、`Oracle`
    或其他的；作为文件服务器，公司将所有数据存储在其中，在许多情况下，是将所有数据放在一起。一个例子就是我们所说的 `LAMP`，Linux Apache MySQL
    PHP。通常，当我们有一个 Linux 系统（在这种情况下是 Web 服务器）、`Apache`、一个数据库服务器（`MySQL`）和一个编程语言解释器（在这种情况下是
    `PHP`）时，我们称之为 `LAMP`。我们也可以将其称为“栈”（Stack）。栈意味着一组你可以用来解决问题的工具集。我最喜欢的栈之一是 `NPM`、`Nginx`、`Python`
    和 `MongoDB`。我一直用它来解决我工作公司的许多问题。这个栈可以安装在服务器上（虚拟或物理均可），我们将在接下来的章节中介绍。


    On-premise（本地化）是一个经常用于安装在公司基础设施内部的服务器术语，很多时候位于数据中心，有时位于系统管理员的桌下。当我们使用 `OpenStack`
    或 `oVirt` 等工具在物理服务器上创建虚拟机时，`VMs` 也可以运行在本地化基础设施中。这是公司为了获得更强的韧性、灵活性并在利用资源而采用的策略。一个例子是，如果你必须更换数据中心的一或多台服务器（因为它们太旧了，无法与其他服务器相同的性能），你可以将
    `VMs` 从一台服务器迁移到另一台。更换物理机器，并在安装新机器后，将所有 `VMs` 迁移回来。


    Cloud（云）用于描述虚拟服务器安装在其他东西的基础设施内部。在大多数情况下，像 `AWS`、`Azure` 和 `GCP` 这样的公司有自己的本地化基础设施并将其租给我们。因此，我们不需要担心维护，例如在磁盘故障时更换磁盘、在服务器过时时更换服务器，甚至不需要电力和互联网。此外，你可以在工作日结束后关闭它们并在第二天重新启动，从而节省成本。所有这些提供商只根据机器运行的时间收取费用。否则，你只需为存储付费。


    # 结论


    现在我们已经对服务器、虚拟机、Linux 和发行版有了简要的解释，我们准备好开始动手实践了。让我们从设置第一个 Linux 环境开始，了解基础知识，以及更多内容。


    # 设置你的环境


    Linux 专业人员最重要的任务之一是具备设置不同类型环境的能力，运行 Web 服务器、数据库、文件系统以及来自不同供应商的各种服务。在本章中，我们将学习从哪里下载
    Linux 发行版、如何安装虚拟化工具来创建测试环境、如何创建基础镜像以便于创建新实验室，以及如果你的测试环境崩溃了（这在我们学习新知识时经常发生），会发生什么。


    '
