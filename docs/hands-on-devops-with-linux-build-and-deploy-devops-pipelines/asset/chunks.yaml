- fmt: "\n## [Chapter 5](#c05.xhtml) Docker is one of the leading technologies of\
    \ a DevOps engineer stack. Here, we will learn the very basics, but enough for\
    \ you to create your images and commit them to a registry for a deployment.\n\n\
    ## [Chapter 6](#c06.xhtml) Vagrant is also one very useful tool for those who\
    \ are not using Docker yet. We know that many companies are still using on premise\
    \ infrastructure. It also needs to be automated. Somehow, this chapter aims to\
    \ teach you how to create your automation scripts.\n\n## [Chapter 7](#c07.xhtml)\
    \ After working on your laptop, this chapter will teach you how to create the\
    \ labs and infrastructure using Cloud Services and the `CLI` (Command-line interface),\
    \ with a focus on automation.\n\n## [Chapter 8](#c08.xhtml) Multicloud is one\
    \ topic that we cannot avoid. After learning the command-line interfaces and the\
    \ differences among the different cloud providers, `Terraform` will give you a\
    \ single workflow to create your infrastructure on any provider.\n\n## [Chapter\
    \ 9](#c09.xhtml) At this point, we have created a lot of code. Therefore, we need\
    \ to use `Git` to save it and also created documentation and different versions\
    \ of our infrastructure.\n\n## [Chapter 10](#c10.xhtml) Pipelines is a way to\
    \ create a workflow on your automation, defining dependencies, step-by-step, `Jenkins`\
    \ is the most famous open source tool for it, and in this chapter, we will learn\
    \ more about it.\n\n## [Chapter 11](#c11.xhtml) In my perspective, `Kubernetes`\
    \ will become the standard way of application deployment, and then I could not\
    \ write a book without giving you at least the basics of it.\n\n## [Chapter 12](#c12.xhtml)\
    \ Once all your infrastructure is ready to be scaled and automated, we need to\
    \ find a way to centralize the logs because when you have a few servers, you can\
    \ go one-by-one and check the logs. But when we have planter thousands of servers,\
    \ creating automated we must centralize the logs in the server for audition purposes\
    \ and debugging, the `Elasticsearch`, `Fluend`, and `Kibana` are the references\
    \ for it.\n\n# Downloading the coloured images\n\nPlease follow the link to download\
    \ the `Coloured Images` of the book:\n\n# [https://rebrand.ly/aeb0pwp](https://rebrand.ly/aeb0pwp)\n\
