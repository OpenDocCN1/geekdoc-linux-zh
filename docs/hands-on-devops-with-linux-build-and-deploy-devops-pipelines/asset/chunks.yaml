    # [Conclusion](#toc.xhtml_s102a)


    This chapter was a short explanation of how we can set up an environment using
    the EFK stack and Kubernetes. The same steps work on Cloud or on-premises environments.
    This whole chapter aimed to show you a short explanation about everything that
    is possible to do using the DevOps technologies. For each chapter, we could have
    written a whole book. However, in my view, it is very important to have a general
    overview about different topics, because, you will be able to think what is possible
    to do and what the people are using for different cases. And after that, you can
    go deep in each one of the solutions represented here or find their alternatives.


