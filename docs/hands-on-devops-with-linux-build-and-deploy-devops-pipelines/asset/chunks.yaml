    ![](images/Figure-7.8.jpg)


    **Figure 7.8**


    On Google, the service name to create the VMs is `Google Compute Engine`. Using
    this service, we will be able to create exactly as we did on Amazon.


    ### Activate Billing


    Firstly, you need to activate the billing in your account. In your `Dashboard`
    within the project, click on `Go to Compute Engine`, and there, you have a button,
    called `Enable billing`, as shown in the following figure:


    ![](images/Figure-7.9.jpg)


    **Figure 7.9**


    Click it and wait for a few minutes for the configuration to complete. Once the
    configuration is done, you can find the image with which you want to create your
    instance using the following command:


    ![](images/p150.jpg)


    You will find many options. In my case, I will use `ubuntu-1804-xenial-20200407.`
    You also need to choose the zone where you want to create your VM:


    ![](images/p150a.jpg)


    This time, I will create my VM on the US using the zone `us-east1-b`. In the AWS
    part, we created an instance with the `t3.micro` size. On Google, we have a respective,
    but with a different name:


    ![](images/p150b.jpg)


    There are many machine family types which you can use. The difference between
    families is the purpose for what you want to use your VM. The `E2` family was
    made for the general purpose VMs. So, I will use that only and the smallest size
    is micro, which corresponds to 2 CPUs and 1 GB of memory.


    ### Create Instance


    Sometimes, just setting the image name when you are creating your VM can raise
    an error. To avoid that, you can put the image link directly, as follows:


    ```

    PS C:\Users\1511 MXTI> gcloud compute images list –uri

    ```


    `https://www.googleapis.com/compute/v1/projects/centos-cloud/global/images/centos-6-v20200402`


    `https://www.googleapis.com/compute/v1/projects/centos-cloud/global/images/centos-7-v20200420`


    `https://www.googleapis.com/compute/v1/projects/ubuntu-os-cloud/global/images/ubuntu-1804-bionic-v20200414
    https://www.googleapis.com/compute/v1/projects/coreos-cloud/global/images/coreos-alpha-2430-0-0-v20200229`


    Therefore, the image link is as follows:


    `https://www.googleapis.com/compute/v1/projects/ubuntu-os-cloud/global/images/ubuntu-1804-bionic-v20200414`


    To create your VM, run the following command:


    ```

    PS C:\Users\1511 MXTI> gcloud compute instances create vm1 --zone=us-east1-b --machine-type=e2-micro
    --image=https://www.googleapis.com/compute/v1/projects/ubuntu-os-cloud/global/images/ubuntu-1804-bionic-v20200414

    ```


    `Created [https://www.googleapis.com/compute/v1/projects/chapter7-20200423/zones/us-east1-b/instances/vm1].`


    ![](images/p151.jpg)


    The VM is now running with the external IP `25.229.97.23.` You can use it to connect
    to your machine. However, the Google Cloud Shell has a specific command to create
    the SSH key for you and automatically login into the instance:


    ```

    PS C:\Users\1511 MXTI> gcloud compute ssh vm1

    ```


    `WARNING: The PuTTY PPK SSH key file for gcloud does not exist.`

    `WARNING: The public SSH key file for gcloud does not exist.`

    `WARNING: The private SSH key file for gcloud does not exist.`

    `WARNING: you do not have an SSH key for gcloud.`

    `WARNING: SSH keygen will be executed to generate a key.`

    `WARNING: Invalid characters in local username [1511 MXTI]. Using username corresponding
    to active account: [alisson_copyleft]`

    `No zone specified. Using zone [us-east1-b] for instance: [vm1].`

    `Updating project ssh metadata…Updated [https://www.googleapis.com/compute/v1/projects/chapter7-20200423].`

    `Updating project ssh metadata…done.`

    `Waiting for SSH key to propagate.`

    `The server''s host key is not cached in the registry. You have no guarantee that
    the server is the computer you think it is.`

    `The server''s ssh-ed25519 key fingerprint is:`

    `ssh-ed25519 255 9c:f6:6d:58:38:8e:d7:c4:df:63:28:8b:b4:c8:53:24`

    `If you trust this host, enter "y" to add the key to PuTTY''s cache and carry
    on connecting.`

    `If you want to carry on connecting just once, without adding the key to the cache,
    enter "n".`

    `If you do not trust this host, press Return to abandon the connection.`

    `Store key in cache? (y/n)`


    Previously, you have all the output. Just to show you how it works, once the command
    finishes, a terminal will open for you where you have already logged in within
    the VM:


    ![](images/Figure-7.10.jpg)


    **Figure 7.10**


    And if you want to delete your instance after learning all these steps, you need
    to run the following command:


    ```

    PS C:\Users\1511 MXTI> gcloud compute instances delete vm1

    ```


    `No zone specified. Using zone [us-east1-b] for instance: [vm1].`

    `The following instances will be deleted. Any attached disks configured to be
    auto-deleted will be deleted unless they are attached to any other instances or
    the ''--keep-disks'' flag is given and specifies them for keeping. Deleting a
    disk is irreversible and any data on the disk will be lost.`

    `- [vm1] in [us-east1-b]`

    `Do you want to continue (Y/n)?`


    For now, this is enough for you to start with your Infrastructure on GCP.


    # Provisioning using Azure


    As we did with the other Cloud players, we are going to do the same on Azure.
    The goal of providing the same Infrastructure, in the same way, is to show you
    the process and make you feel comfortable in choosing the one you prefer.


    ### Install Azure CLI


    The first step is installing the Azure command-line by the following link:


    [https://docs.microsoft.com/en-us/cli/azure/install-azure-cli-windows?view=azure-cli-latest](https://docs.microsoft.com/en-us/cli/azure/install-azure-cli-windows?view=azure-cli-latest)


    The installation process is exactly the same as all the MSI packages. Double click,
    click `Next`, `Next`, and `Finish`. After the installation finishes, you can run
    the following command to check if it is working:


    ```

    PS C:\Users\1511 MXTI> az --version

    ```


    ![](images/p153.jpg)


    `Python location ''C:\Program Files (x86)\Microsoft SDKs\Azure\CLI2\python.exe''`

    `Extensions directory ''C:\Users\1511 MXTI\.azure\cliextensions''`

    `Python (Windows) 3.6.6 (v3.6.6:4cf1f54eb7, Jun 27 2018, 02:47:15) [MSC v.1900
    32 bit (Intel)]`


    Now, the Azure CLI is installed successfully. To begin with, run the following
    command:


    ```

    PS C:\Users\1511 MXTI> az login

    ```


    `You have logged in. Now let us find all the subscriptions to which you have access…`


    ```

    [

    {

    "cloudName": "AzureCloud",

    "isDefault": true,

    "managedByTenants": [],

    "name": "Pay-As-You-Go",

    "state": "Enabled",

    "user": {

    "name": "alisson_copyleft@gmail.com",

    "type": "user"

    }

    }

    ]

    ```


    The command, `az login` authenticates your command line with your account.


    Similar to Google, where we created one project to separate all provisioned services,
    we will do the same on Azure, but instead of creating the projects, we will create
    `ResourceGroups`.


    But, before creating the `ResourceGroup`, we need to know which location we will
    use. To see the locations available, run the following:


    ```

    PS C:\Users\1511 MXTI> az account list-locations

    ```


    ```

    [

    {

    "displayName": "Central US",

    "id": "/subscriptions/55465d5a-355d-43d1-85ce-9e518c81c0c/locations/centralus",

    "latitude": "41.5908",

    "longitude": "-93.6208",

    "name": "centralus",

    "subscriptionId": null

    },

    {

    "displayName": "East US",

    "id": "/subscriptions/55465d5a-355d-43d1-85ce-9e518c81c0c/locations/eastus",

    "latitude": "37.3719",

    "longitude": "-79.8164",

    "name": "eastus",

    "subscriptionId": null

    }

    ]

    ```


    The command will show all the locations available. In my case, I will use the
    East US. Now, we can create `ResourceGroup` with the following command:


    ```

    PS C:\Users\1511 MXTI> az group create --location eastus --name book

    ```


    ```

    {

    "id": "/subscriptions/55465d5a-355d-43d1-85ce-9e518c81c0c/resourceGroups/book",

    "location": "eastus",

    "managedBy": null,

    "name": "book",

    "properties": {

    "provisioningState": "Succeeded"

    },

    "tags": null,

    "type": "Microsoft.Resources/resourceGroups"

    }

    ```

