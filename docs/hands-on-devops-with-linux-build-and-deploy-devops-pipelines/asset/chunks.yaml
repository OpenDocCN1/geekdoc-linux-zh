  trans: "\n\n我们还需要安装 `kubectl`，这是一个我们将用它来管理 `dev`、`stg` 和 `prd` 集群的命令。如果您使用的是其他操作系统，可以遵循官方文档：[`kubernetes.io/docs/tasks/tools/install-minikube/`](https://kubernetes.io/docs/tasks/tools/install-minikube/)\n\
    \n```bash\nPS C:\\Users\\1511 MXTI> wget https://storage.googleapis.com/kubernetes-release/release/v1.18.3/bin/linux/amd64/kubectl\
    \ -O kubectl.exe\n```\n\n首先，我们可以运行一个简单的命令来查看在我们的环境中配置了多少集群：\n\n```bash\nPS C:\\\
    Users\\1511 MXTI> .\\kubectl.exe config get-clusters\n```\n`NAME`\nMinikube\n\n\
    目前，只有一个 `minikube.`。但我们会有更多，需要了解的一个重要点是 `kubectl` 是从哪里获取这些信息的：\n\n```bash\nPS\
    \ C:\\Users\\1511 MXTI> cat 'C:\\Users\\1511 MXTI\\.kube\\config'\n```\n\n在 `minikube`\
    \ 安装 `k8s` 集群后，它会将配置写入位于您的 `home` 目录下的 `.kube` 文件夹中的 `config` 文件。所有的认证信息都位于该文件中。如果您想了解集群内部运行的所有内容，可以运行以下命令：\n\
    \n![](img/p227.jpg)\n\n我使用了参数来获取 pods，另一个参数是 `–all-namespaces.`。它向我们展示了集群所有命名空间中运行的所有容器。目前，我们只有一个，名为\
    \ `kube-system`。在继续学习更多命令之前，理解 `pod`、namespace（命名空间）以及其他概念是非常重要的。\n\n*   **POD**:\
    \ 它代表运行的一个或多个容器集。\n*   **NAMESPACE (命名空间)**: 对象之间的逻辑隔离。例如，在同一个集群中，我可以拥有 `dev –\
    \ stg – prd` 命名空间，每个空间运行相同应用程序的不同版本，或者可以是 `project1`、`project2` 和 `project3`。您可以根据需要将集群分为任意数量的命名空间。\n\
    *   **SERVICE (服务)**: 这是您用于连接外部世界与您的 pods 的资源。如果您还记得 Docker 章节，我们必须将主机端口 `8080`\
    \ 映射到容器端口 `8080.`。但这仅针对一个容器。在 Kubernetes 中，我们有一个 `POD`，它可以包含一个或多个容器，并可以随时销毁和重建。然而，我们不能丢失端口映射，这就是\
    \ `SERVICE` 的工作，我们在其中配置 `NODE` 端口，它将重定向到 `POD` 端口，与我们在 Docker 中做的方法完全相同。这是服务的用途之一，我们也可以有其他实现，例如负载均衡器，它有一个\
    \ `clusterIP`，将接收传入的连接并转发到容器。\n*   **DEPLOYMENT (部署)**: 这是一组规则，确保您有特定数量的运行容器。所有容器都运行相同的镜像，如果任何容器死亡，它将会被重建。换句话说，它会自动创建您的\
    \ `PODs`，并且 `REPLICASET` 会确保运行容器的存在。\n*   **INGRESS (入口)**: 该资源可以比作虚拟主机，就像我们在\
    \ Apache 章节中做的那样。在这里，我们将有一个 `NAME`，它将指向 `SERVICE`，而 `SERVICE` 将指向 `POD`。如果您没有使用\
    \ DNS，则 `INGRESS` 不是强制性的。\n\n上述项目被称为 Kubernetes 对象。还有许多其他对象可以探索以了解更多关于 Kubernetes\
    \ 的知识，但我们可以专门写一本书来解释。现在，我认为最后部署一些微服务足够了。如果您正在部署有状态的应用，您可能需要扩展阅读范围到 `VOLUMES`（卷）。\n\
    \n现在，我们可以创建第一个 `NAMESPACE` 并开始尝试一些对象：\n\n```bash\nPS C:\\Users\\1511 MXTI> .\\\
    kubectl.exe create namespace chapter11\nnamespace/chapter11 created\n```\n\n```bash\n\
    PS C:\\Users\\1511 MXTI> .\\kubectl.exe get ns\nNAME             STATUS    AGE\n\
    chapter11        Active    11s\ndefault          Active    38m\nkube-node-lease\
    \  Active    38m\nkube-public      Active    38m\nkube-system      Active    38m\n\
    ```\n\n注意，可以使用参数的全形式，也可以使用短形式，例如当我列出命名空间时，我只使用了 `ns`。\n\n`INGRESS` 是 Kubernetes\
    \ 的一个独立资源。当您在云端使用它时，某些云厂商已经为您安装好了。但在本地环境中，您通常需要安装。对于我们的本地环境，我们必须使用以下命令进行安装：\n\n\
    ```bash\nPS C:\\Users\\1511 MXTI> .\\minikube.exe addons enable ingress\n* The\
    \ 'ingress' addon is enabled\n```\n\n要在集群中运行您的第一个应用程序，请运行以下命令：\n\n```bash\nPS\
    \ C:\\Users\\1511 MXTI> .\\kubectl.exe --namespace=chapter11 run python -dti --port=8080\
    \ --image=alissonmenezes/python:latest -l app=python\n```\n\n此命令将我的个人仓库 `alissonmenezes`\
    \ 下载 `python_app:v1` 并暴露端口 `8080`。如果您想检查 `pod` 是否正在运行，可以使用以下命令：\n\n```bash\nPS\
    \ C:\\Users\\1511 MXTI> kubectl get pods --namespace=chapter11\nNAME    READY\
    \   STATUS    RESTARTS   AGE\npython   1/1     Running   1             6m43s\n\
    ```\n\n现在我们有一个包含一个容器的 pod 在运行。然而，我们想要访问该应用程序，但目前它仅在集群内部可用。集群内部的其他应用程序已经能够访问它，但对我们外部用户来说，必须为它创建一个服务：\n\
    \n```bash\nPS C:\\Users\\1511 MXTI> .\\kubectl.exe --namespace=chapter11 create\
    \ service clusterip python --tcp=80:8080\nservice/python created\n```\n\n我们刚刚创建了\
    \ `clusterip` 类型的 `SERVICE`。它不暴露 `NODE` 端口，我们需要 ingress 来从集群外部到内部的映射。创建一个名为 `app.yaml`\
    \ 的文件，内容如下：\n\n```yaml\napiVersion: extensions/v1beta1\nkind: Ingress\nmetadata:\n\
    name: python\nnamespace: chapter11\nannotations:\n  nginx.ingress.kubernetes.io/rewrite-target:\
    \ /\nspec:\n  backend:\n    serviceName: python\n    servicePort: 80\n```\n\n\
    `INGRESS` 由 Nginx 服务器组成，我们称之为“Ingress Controller”（入口控制器）。它基本上是在将来自任何地址或名称的传入连接通过代理传递转发到名为\
    \ Python 的服务。\n\n要应用该文件，您必须使用以下命令：\n\n```bash\nPS C:\\Users\\1511 MXTI> .\\kubectl.exe\
    \ apply -f .\\app.yaml\ningress.extensions/python created\n```\n\n获取 minikube\
    \ 的 IP 地址，运行以下命令：\n\n```bash\nPS C:\\Users\\1511 MXTI> .\\minikube ip\n192.168.99.101\n\
    ```\n\n如果您在网络浏览器中输入此地址，您将看到以下页面：\n\n![](img/Figure-11.1.jpg)\n\n**图 11.1**\n\n\
    应用程序正在运行！\n\n我们通过命令成功创建了一切，并仅使用 `YAML` 文件创建了 Ingress。然而，完全可以使用文件来创建一切，这是在 Kubernetes\
    \ 上部署一切常用的方法，因为我们可以对文件进行版本控制，并像上一章那样在流水线中运行它们。\n\n我们可以如下所示在一个文件中创建所有内容：\n\n```yaml\n\
    ---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\nname: python\nnamespace:\
    \ chapter11\nlabels:\n  app: python\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
    \      app: python\n  template:\n    metadata:\n      labels:\n        app: python\n\
    \    spec:\n      containers:\n      - name: python\n        image: alissonmenezes/python:latest\n\
    \        ports:\n        - containerPort: 8080\n---\napiVersion: v1\nkind: Service\n\
    metadata:\n  labels:\n    app: python\n  name: python\nnamespace: chapter11\n\
    spec:\n  ports:\n  - name: http\n    port: 80\n    protocol: TCP\n    targetPort:\
    \ 8080\n  selector:\n    app: python\n  type: ClusterIP\n---\napiVersion: extensions/v1beta1\n\
    kind: Ingress\nmetadata:\n  labels:\n    app: python\n  name: python\nnamespace:\
    \ chapter11\nannotations:\n  nginx.ingress.kubernetes.io/rewrite-target: /\nspec:\n\
    \  backend:\n    serviceName: python\n    servicePort: 80\n```\n\n"
