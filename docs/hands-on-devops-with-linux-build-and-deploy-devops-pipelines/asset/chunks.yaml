  raw: '# [Up and running](#toc.xhtml_s54a)


    With the file explained and everything configures to create the VMs, type the
    following command:


    `PS C:\Users\1511 MXTI\VagrantChapter> vagrant up --provider=virtualbox`


    `Bringing machine ''lamp'' up with ''virtualbox'' provider…`


    `Bringing machine ''docker'' up with ''virtualbox'' provider…`


    `==> lamp: Box ''ubuntu/focal64'' could not be found. Attempting to find and install…`


    `lamp: Box Provider: virtualbox`


    `lamp: Box Version: >= 0`


    `==> lamp: Loading metadata for box ''ubuntu/focal64''`


    `lamp: URL: https://vagrantcloud.com/ubuntu/focal64`


    It will take a while because Vagrant will download the box:


    `==> lamp: Loading metadata for box ''ubuntu/focal64''`


    `lamp: URL: https://vagrantcloud.com/ubuntu/focal64`


    `==> lamp: Adding box ''ubuntu/focal64'' (v20200409.0.0) for provider: virtualbox`


    `lamp:Downloading: https://vagrantcloud.com/ubuntu/boxes/focal64/versions/20200409.0.0/providers/virtualbox.box`


    `lamp: Download redirected to host: cloud-images.ubuntu.com`


    `lamp: Progress: 11% (Rate: 1411k/s, Estimated time remaining: 0:06:09)`


    The box is a Cloud image, but with specific configurations to run on top of Vagrant.
    As you can see in the logs, Vagrant is downloading the image for VirtualBox. It
    is also possible to provision using Hyper-V or KVM.


    Vagrant Cloud (**[http://vagrantcloud.com/](http://vagrantcloud.com/)**) is the
    official repository to download the images. But, of course, is not the only one.
    You can also create your images using Packer (**[https://packer.io/](https://packer.io/)**).
    However, if you don’t, you can search there what images are available for you
    to create your VMs.


    ![](images/Figure-6.4.jpg)


    **Figure 6.4**


    After the provision, if you want to check your local boxes, use the following
    command:


    `PS C:\Users\1511 MXTI\VagrantChapter> vagrant box list`


    `centos/7              (virtualbox, 1801.02)`


    `fedora/28-cloud-base  (virtualbox, 20180425)`


    `ubuntu/bionic64       (virtualbox, 20190807.0.0)`


    `ubuntu/focal64        (virtualbox, 20200409.0.0)`


    `ubuntu/xenial64       (virtualbox, 20180413.0.0)Status: Downloaded newer image
    for`


    If you have a fresh installation, you probably have only the Ubuntu/focal64, the
    one we downloaded:


    `PS C:\Users\1511 MXTI\VagrantChapter> vagrant status`


    `Current machine states:`


    `lamp     running (virtualbox)`


    `docker   running (virtualbox)`


    If everything went well with your provision, run the command `vagrant status`
    and it will show you the running VMs. If there is a machine that is not created
    yet, you can try to run the `vagrant up –provider=virtualbox` again, and see if
    it works. If it doesn’t, check your installation and your internet connection.


    Suppose, you did not define any password or SSH key to connect to these VMs, then,
    how do we connect to them? Vagrant is also managing that for us. With the `vagrant
    status,` we can see the names of the VMs and use these names to connect using
    the command, `vagrant ssh`:


    `PS C:\Users\1511 MXTI\VagrantChapter> vagrant ssh docker`


    `Welcome to Ubuntu Focal Fossa (development branch) (GNU/Linux 5.4.0-21-generic
    x86_64)`


    `* Documentation:  https://help.ubuntu.com`


    `* Management:     https://landscape.canonical.com`


    `* Support:        https://ubuntu.com/advantage`


    The VM was successfully provisioned, and as you can see with the Ubuntu Focal
    Fossa version, Vagrant also created as user, called `vagrant`, to connect to the
    VMs, which has p`seudo` permission. So, we can just change the user and run all
    the commands:


    `vagrant@ubuntu-focal:~$` **`sudo su -`**


    `root@ubuntu-focal:~#`


    Now, you can manage everything as we did in the previous chapters. But, let''s
    see how we can provision a LAMP in an automated way.


    # [Setting up a LAMP Server](#toc.xhtml_s55a)


    You already know the commands, and then, we can basically put the commands in
    the provision section of vagrant file and provision the VM again:


    `# -*- mode: ruby -*-`


    `# vi: set ft=ruby :`


    `Vagrant.configure("2") do |config|`


    `config.vm.box = "ubuntu/focal64"`


    `config.vm.box_check_update = false`


    `config.vm.provider "virtualbox" do |vb|`


    `vb.memory = "1024"`


    `end`


    `config.vm.define "lamp" do |lamp|`


    `lamp.vm.network "private_network", ip: "192.168.33.10"`


    `lamp.vm.hostname = "lamp"`


    `lamp.vm.provision "shell", inline: <<-SHELL`


    `sudo apt-get clean`


    `sudo apt update -y`


    `sudo apt install apache2 mysql-server php7.4 -y`


    `SHELL`


    `end`


    `config.vm.define "docker" do |docker|`


    `docker.vm.network "private_network", ip: "192.168.33.11"`


    `docker.vm.hostname = "docker"`


    `docker.vm.provision "shell", inline: <<-SHELL`


    `apt-get clean`


    `apt update -y`


    `SHELL`


    `end`


    `config.vm.provision "shell", inline: <<-SHELL`


    `apt-get clean`


    `apt update -y`


    `SHELL`


    `end`


    In this case, I changed the `lamp.vm.provision`, including the Shell Script to
    install PHP, Apache, and MySQL server. Once the VM is created, run the following
    command:


    `PS C:\Users\1511 MXTI\VagrantChapter> vagrant provision lamp`


    `==> lamp: Running provisioner: shell…`


    `lamp: Running: inline script`


    `lamp:`


    `lamp: WARNING: apt does not have a stable CLI interface. Use with caution in
    scripts.`


    `lamp: Get:1 http://archive.ubuntu.com/ubuntu focal InRelease [265 kB]`


    `lamp: Hit:2 http://security.ubuntu.com/ubuntu focal-security InRelease`


    `lamp: Hit:3 http://archive.ubuntu.com/ubuntu focal-updates InRelease`


    You can follow the provisioning process in your Terminal. After the installation
    finishes, you can login into the VM:


    `PS C:\Users\1511 MXTI\VagrantChapter>`**`vagrant ssh lamp`**


    `Welcome to Ubuntu Focal Fossa (development branch) (GNU/Linux 5.4.0-21-generic
    x86_64)`


    Check the services running:


    ![](images/p127.jpg)


    Check the IP address, the one defined in the Vagrant file:


    `vagrant@lamp:~$` **`ip a`**


    `3: enp0s8: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc fq_codel state UP
    group default qlen 1000`


    `link/ether 08:00:27:69:a5:81 brd ff:ff:ff:ff:ff:ff`


    `inet 192.168.33.10/24 brd 192.168.33.255 scope global enp0s8`


    `valid_lft forever preferred_lft forever`


    You can check the IP address in the browser and see Apache running:


    ![](images/Figure-6.5.jpg)


    **Figure 6.5**


    Now, every time you want to provision a new LAMP server, you can directly copy
    the code, or include a new VM with the provision code and it will work.


    # [Setting up the Docker Server](#toc.xhtml_s56a)


    This process is not different from the first one. So, let''s edit the Vagrant
    file again:


    `# -*- mode: ruby -*-`


    `# vi: set ft=ruby :`


    `Vagrant.configure("2") do |config|`


    `config.vm.box = "ubuntu/bionic64"`


    `config.vm.box_check_update = false`


    `config.vm.provider "virtualbox" do |vb|`


    `vb.memory = "1024"`


    `end`


    `config.vm.define "lamp" do |lamp|`


    `lamp.vm.network "private_network", ip: "192.168.33.10"`


    `lamp.vm.hostname = "lamp"`


    `lamp.vm.provision "shell", inline: <<-SHELL`


    `sudo apt-get clean`


    `sudo apt update -y`


    `sudo apt install apache2 mysql-server php7.4 -y`


    `SHELL`


    `end`


    `config.vm.define "docker" do |docker|`


    `docker.vm.box = "ubuntu/bionic64"`


    `docker.vm.network "private_network", ip: "192.168.33.11"`


    `docker.vm.hostname = "docker"`


    `docker.vm.provision "shell", inline: <<-SHELL`


    `apt clean`


    `apt-get update`


    `apt-get remove docker docker-engine docker.io containerd runc -y`


    `apt-get install apt-transport-https ca-certificates curl gnupg-agent software-properties-common
    -y`


    `curl -fsSL https://download.docker.com/linux/ubuntu/gpg | apt-key add -`


    `add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu
    $(lsb_release -cs) stable"`


    `apt-get update -y`


    `apt-get install docker-ce docker-ce-cli containerd.io -y`


    `SHELL`


    `end`


    `config.vm.provision "shell", inline: <<-SHELL`


    `apt-get clean`


    `apt update -y`


    `SHELL`


    `end`'
