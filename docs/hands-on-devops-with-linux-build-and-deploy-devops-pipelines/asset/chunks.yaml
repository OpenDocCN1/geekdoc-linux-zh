- fmt: '

    Years ago, I would have given you a big explanation about the important directories
    on Linux, which is the best way to split your disk among the directories and the
    partitions. But nowadays, it is not that important when we work with the virtual
    machines. We can consider the Amazon EC2 instances as an example. These do not
    even have the SWAP partition. If you lack space, just increase more in your root
    partition and clean your server. Another important thing is the `/var` directory.
    I won''t go deep into that topic now, but it is the directory where the logs of
    your Linux system are stored. Therefore, they frequently use a lot of your free
    space and we have to clean it often. Years ago, I would ask you split it into
    a different partition. But today, we have tools to ship the logs to a `Log Server`,
    and we can just remove the logs every day from the local machine. However, select
    `Use An Entire Disk`:


    ![](images/Figure-1.22.jpg)


    **Figure 1.22**


    Now, select the physical device where the operating system will be installed,
    and press `Enter`:


    ![](images/Figure-1.23.jpg)


    **Figure 1.23**


    The following screen shows you how your disk has been partitioned. We can see
    that there is a `Physical Device`, `VBOX_HARDDISK`, and it is split into two parts.
    The boot partition, which is mandatory to boot your system, is where the bootloader
    is installed.


    The `root` partition, also known as `/`. Just select `Done`:


    ![](images/Figure-1.24.jpg)


    **Figure 1.24**


    Here, we will create the first user, and then I will define the following data:


    *   Your name: `alisson` - this is just your real name, but it will not be used
    for anything.

    *   Your Server''s name: `devops` - this is the hostname of your machine

    *   Pick a username: `alisson` - this is literally the user which you will use
    to access the server

    *   Choose a password: `devops`

    *   Confirm your password: `devops`


    Press `Done`.


    ### Attention!


    The following step is really important. The OpenSSH server is not installed by
    default, so you have to select the option, and install the OpenSSH server. You
    can use the key `Tab` to change the options. Otherwise, you will not be able to
    access your server from a remote connection:


    ![](images/Figure-1.25.jpg)


    **Figure 1.25**


    Now that you have selected the right option, press `Done`:


    ![](images/Figure-1.26.jpg)


    **Figure 1.26**


    Now, you need to select a `Template` of installation for your server, like a Nextcloud
    server. Or, if you intend to run Kubernetes, you can select the `microk8s`, But
    it is not what we want. So, press `Tab` to change the option to `Done`, and press
    `Enter`:


    ![](images/Figure-1.27.jpg)


    **Figure 1.27**


    Now, your installation has begun. It may take a while because Ubuntu will download
    the updates and some important packages. You are not obligated to do the updates.
    But, in my view, it is important for those who are learning Linux to have an updated
    system. Just wait for the installation to finish, and when Ubuntu asks you for
    a `Reboot`, do that. After the reboot, you will see the following screen:


    ![](images/Figure-1.28.jpg)


    **Figure 1.28**


    Enter the credentials defined during your installation:


    ```

    login: alisson

    password: devops

    ```


    Now, you are inside the Linux shell. Starting now, you will be able to run the
    commands, install packages, and do everything that you want with your server.
    This access console is exactly what you would do if you were inside a datacenter.
    Plug a `KVM` (`Keyboard Video Mouse`) to a server and run the commands. I did
    a lot of that when I was working with Colocation. This is a business model in
    which you can buy your own physical servers and install inside the datacenter
    of someone else''s. Thus, you will use the datacenter infrastructure, but the
    server belongs to you.


    It is not used much, unless you are working within a datacenter. If you are still
    logged in into your machine, run the following command:


    ```bash

    ip a

    ```


    The preceding command will show all the network interfaces you have and their
    IP address, like the following screenshot:


    ![](images/Figure-1.29.jpg)


    **Figure 1.29**


    We just have 2 IP addresses and 2 interfaces:


    ```

    Interface: lo

    IP Address: 127.0.0.1

    ```


    This is the local IP address. It is used to make the TCP/IP connection without
    getting outside of the machine:


    ```

    Interface: enp0s3

    IP Address: 10.0.2.15

    ```


    This is a NAT interface. We need this interface just to make the internet connection.
    But, we cannot access the machine from outside using this configuration. It is
    used just for the installation purposes. We could have changed that before. However,
    I wanted to show you how to change that configuration and why we need to do it.


    To change this configuration, go to the main screen of the VirtualBox. Now, click
    on the virtual machine, and then, click on `Settings` | `Network`. In this part,
    `Attached`, you will see the value Nat. Change it to the `Bridge Network`, and
    in the option `Name`: select the network interface that you have the internet
    access to. In my case, it is configured like the following screenshot:


    ![](images/Figure-1.30.jpg)


    **Figure 1.30**


    After saving the configuration, go back to your VM and run the following command
    again:


    ```bash

    ip a

    ```


    You will see a new IP address. In my case, `192.168.178.62` was attached:


    ![](images/Figure-1.31.jpg)


    **Figure 1.31**


    # Accessing via SSH


    We have a connection from the outside now. So, how can we connect to that machine
    using the SSH? In the past, it was common to use tools like Putty to SSH the servers
    from Windows machines, but in the new versions of Windows, we have PowerShell,
    which is installed by default and we can use it to access our VM.


    Open the PowerShell if you''re using Windows or Terminal in Linux/MacOS, and run
    the following command:


    ```bash

    ssh alisson@192.168.178.62

    ```


    The command follows the structure `USER@HOSTNAME`. If you do not have a hostname
    configured, you can use the IP address. After that, press `Enter`. It will show
    you the following message:


    ```

    The authenticity of host ''192.168.178.62 (192.168.178.62)'' can''t be established.

    ECDSA key fingerprint is SHA256:GX474/IAL/VeIoiV/r6WoPZHRg3HfFTS3tfvigA9jKM.

    Are you sure you want to continue connecting (yes/no)? yes

    Warning: Permanently added ''192.168.178.62'' (ECDSA) to the list of known hosts.

    ```


    It happens because this is the first time you are connecting to that server. You
    can just type `Yes` to make sure you want to connect to it and then, the SSH will
    ask for your password:


    ```

    alisson@192.168.178.62''s password:

    ```


    Type the password defined in your installation. In my case, it was DevOps, and
    you will be able to access the Linux shell again:


    ```

    Welcome to Ubuntu 18.04.3 LTS (GNU/Linux 4.15.0-76-generic x86_64)Welcome to Ubuntu
    18.04.3 LTS (GNU/Linux 4.15.0-76-generic x86_64)

    * Documentation:      https://help.ubuntu.com

    * Management:         https://landscape.canonical.com

    * Support:            https://ubuntu.com/advantage

    System information as of Fri Jan 31 20:04:07 UTC 2020

    System load:  0.0                             88

    Usage of /:   39.0% of 9.78GB  Users logged in:  1

    Memory usage: 15%                            IP address for enp0s3:  192.168.178.62

    Swap usage:   0%

    61 packages can be updated.

    0 updates are security updates.

    Last login: Fri Jan 31 19:41:36 2020

    To run a command as administrator (user "root"), use `sudo <command>`.

    See `man sudo_root` for details.

    alisson@devops:~$

    ```


    There is a lot of theory and concepts about the SSH connections which are encrypted,
    and we have the `known_hosts` files. It is important to know if you want to become
    a Linux expert, but not that important for us now.

