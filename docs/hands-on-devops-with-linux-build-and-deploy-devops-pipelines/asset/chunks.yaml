    5.  When are the Jenkins nodes needed?


    # [CHAPTER 11](#toc.xhtml_c11)


    # [Deploying and Scaling Your Application Using Kubernetes](#toc.xhtml_c11)


    This chapter aims to introduce you to Kubernetes, showing how to create YAML files
    to deploy, and scale your applications with the most popular and reliable container
    orchestration tool.


    # [Structure](#toc.xhtml_s88a)


    In this chapter, we will discuss the following topics:


    *   Kubernetes


    *   Introduction to Kubernetes


    *   Deploying on Cloud


    # [Objectives](#toc.xhtml_s89a)


    After studying this unit, you should be able to:


    *   Know about Kubernetes


    *   Explain the benefits of Kubernetes


    *   Create YAML files to deploy your application


    *   Test your application running in the cluster


    # [Kubernetes](#toc.xhtml_s90a)


    Kubernetes is a container orchestration tool. In the previous chapters, we have
    been using Docker a lot for deploying applications, creating new images, etc.
    However, imagine if you have more than one hundred containers to manage. It is
    an impossible task for just one guy. The Docker, by itself, has the Docker Swarm,
    which helps you with that task. But, it is not commonly adopted by the market,
    since it misses some features and integrations that we have on Kubernetes. It
    was created by Google some years ago, based on a project, called Borg, which was
    also a container orchestration tool. With the release of Docker, that project
    was adapted to use it, and now it has become the official platform to manage your
    cluster.


    # [Introduction to Kubernetes](#toc.xhtml_s91a)


    Like the other chapters, our focus is always on how to implement it in the real-world.
    Let''s have a short introduction of how we can setup our local environment to
    learn Kubernetes, and then, we can setup a real environment and deploy an application.
    You will see that the commands are same when we run it in our local environment
    and on the Cloud environment.


    First of all, we will install minikube. It is a tool to set up a local Kubernetes
    environment on the top of a Virtual Box, like we have been doing along with the
    book:


    **`wget https://github.com/kubernetes/minikube/releases/download/v1.11.0/minikube-windows-amd64.exe
    -O minikube.exe`**


    If you are using another OS, you can follow the official documentation: **[https://kubernetes.io/docs/tasks/tools/install-minikube/](https://kubernetes.io/docs/tasks/tools/install-minikube/)**


    Then, we can start the cluster:


    `PS C:\Users\1511 MXTI>`**`.\minikube.exe start`**


    `* minikube v1.11.0 on Microsoft Windows 10 Pro 10.0.19041 Build 19041`


    `* Automatically selected the virtualbox driver`


    `* Downloading VM boot image …`


    `* Starting control plane node minikube in cluster minikube`


    `* Downloading Kubernetes v1.18.3 preload …`


    `* Creating virtualbox VM (CPUs=2, Memory=6000MB, Disk=20000MB) …`


    `* Preparing Kubernetes v1.18.3 on Docker 19.03.8 …`


    `* Verifying Kubernetes components…`


    `* Enabled addons: default-storageclass, storage-provisioner`


    `* Done! kubectl is now configured to use "minikube"`'
