    # Dedicated to *My Family and Friends*


    # About the Author


    **Alisson Machado de Menezes** is an experienced Big Data DevOps Engineer, who
    for the past ten years has been working in different positions, such as Developer,
    Operations Analyst, Support Analyst, DevOps Engineer, IT Manager, Technical leader
    and now diving into Big Data. Has many lectures in Brazil in events like Python
    Brasil, The Developers Conference, Feira Internacional de Software Livre and for
    some companies in private. Also gave classes regarding Python Programming, Agile
    Infrastructure, MongoDB, Openshift, Kubernetes, DevOps and DevSecOps. Has the
    certifications Linux System Administrator (`LPIC-1`), Linux Engineer (`LPIC-2`),
    Suse Certified Linux Administrator (`SUSE CLA`), `LPIC – OT` DevOps Tools Engineer,
    Exin – DevOps Professional and Studied English in Canada.


    In 2019, Alisson moved to Germany starting a new challenge in Europe on the Automotive
    Marketing to help of Empower mobility for tomorrow, where we are trying to be
    the pioneers on Electrical Cars.


    Outside work, Alisson tries to maintain a blog where he shares some experience
    on the project which he has been working and when there is time travelling, hiking
    and try different types of beer.


    # About the Reviewer


    **Leonardo Mendes** is currently working as a Software Reliability Engineer and
    core member of the technology innovation team at Cogna. He focuses on FOSS (Free
    and Open Source Software) projects. He is passionate about training and worked
    in projects of Education, coordinating the training team in the delivery of Linux,
    DevOps, Cloud and Big Data training, also participate in the implementation projects,
    and teaching the courses about Linux, DevOps, Cloud.


    He is graduated from Computer Networking and has MBA at Cloud Computing.


    # Acknowledgement


    There are a few people I want to thank for the continued and ongoing support they
    have given me during the writing of this book. First and foremost, I would like
    to thank my family, who educated me, taught me how to be independent and strong.
    Leonardo Mendes, who was the technical reviewer of this book and is one of my
    best friends. Gabriela Dias, who was the best leader that I had in these ten years
    of experience in IT and is a great example of a person for me. Juergen Bohn, the
    boss who brings me to Germany and opened so many doors and uncountable opportunities
    in Europe. I could have never completed this book without these people in my life.


    This book wouldn’t have happened if I hadn’t had the support from BPB Publications,
    which gave me the support and attention while I was writing.


    Finally, I would like to thank God who gave me the intelligence, strength and
    all the ways for me to be where I am right now.


    # Preface


    DevOps was the most searched word in 2017. In my perspective, we can consider
    some revolution in IT when we stop creating boundaries among IT teams and start
    collaborating and working together, aiming for a common objective. Apart from
    that, we have all the technical stuff which are included in the DevOps mindset,
    using automation to speed up the time to market and delivery faster, high-quality
    software and services.


    I came into DevOps because of my curiosity regarding everything in IT. I started
    when I was a teenager, studying cybersecurity, because I wanted to be a Hacker,
    like all geeks when they start with IT. Then I studied operating systems, computer
    programming, databases, network, security, etc. These terms prepareded me when
    DevOps came into the picture.


    Today, the DevOps engineers must possess all these skills. In my daily work, for
    example, I have to create scripts to automate the cloud servers installation,
    which can be done in many different ways. Mostly, I use `Python` for my automation
    when it is something very specific. For more generic scenarios, I use `Ansible`.
    I use `Jenkins` for scheduling automation, creating pipelines, and many other
    tools.


    I also wrote some other courses when I was living in Brazil, which included `MongoDB`,
    DevSecOps, Python Development, Docker and OpenShift, and Agile Infrastructure.
    In the ten years working there, I worked in different companies, in different
    scenarios, like web hosting, e-commerce development, open-source consultant, EdTech’s,
    and payment gateways.


    Today, my position is Big Data DevOps Engineer, wherein I apply my DevOps knowledge
    about automation into a Big Data scenario, to create pipelines, and automation
    to create data lakes, data pipelines, automating governance rules, etc.


    The primary goal of this book is to provide the information and skills necessary
    to work in today’s market as a DevOps Engineer, giving you the basic overview
    and steps of the most used technologies, based on my ten years of experience:


    - **[Chapter 1](#c01.xhtml)** This chapter introduces you with the the virtualization
    concept on your local machine aiming for you to create your labs, test your new
    technologies, simulate environments without crashing anything in production, and
    for your studying purposes.

    - **[Chapter 2](#c02.xhtml)** This chapter explains you about some basic bash
    commands, because we know that nowadays Linux is not a differential anymore, rather
    a requirement for those who work with Cloud and High Availability.

    - **[Chapter 3](#c03.xhtml)** Here, we set up some services, like a database and
    a web server bringing up the most common installation, what we call Lamp (Linux
    Apache Mysql PHP).

    - **[Chapter 4](#c04.xhtml)** Reverse proxy is commonly used when you have just
    one public IP, and you have different sites running behind a private structure.
    When you are not using cloud services, like Azure or Amazon, you can either set
    up your own Nginx and make the load balance, or you can pass your connections
    to the private servers enforcing the security.

