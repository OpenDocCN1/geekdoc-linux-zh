    发生这种情况是因为我们代理背后的服务器尚未运行。因此，让我们运行它并检查变化：


    ```bash

    root@devops:~# gunicorn --chdir /root/ app:app

    [2020-03-23 18:52:26 +0000] [24025] [INFO] Starting gunicorn 20.0.4

