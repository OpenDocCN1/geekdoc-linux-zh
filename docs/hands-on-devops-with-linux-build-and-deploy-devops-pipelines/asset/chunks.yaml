    `To prevent automatic upgrades to new major versions that may contain breaking
    changes, it is recommended to add version = "…" constraints to the corresponding
    provider blocks in configuration, with the constraint strings suggested below.`


    `* provider.google: version = "~> 3.20"`


    `Terraform has been successfully initialized!`


    You may now begin working with Terraform. Try running "terraform plan" to see
    any changes that are required for your infrastructure. All Terraform commands
    should now work.


    If you ever set or change modules or backend configuration for Terraform, rerun
    this command to reinitialize your working directory. If you forget, other commands
    will detect it and remind you to do so if necessary.


    Now, you are able to create the Infrastructure because you already have the provider
    installed in your local machine. Therefore, include the following code to create
    our first instance:


    `provider "google" {`


    `credentials = file("terraform_sa.json")`


    `project     = "alisson-187813"`


    `region      = "us-east1"`


    `}`


    `resource "google_compute_instance""chapter8" {`


    `name         = "chapter8-instance"`


    `machine_type = "g1-small"`


    `zone         = "us-east1-b"`


    `boot_disk {`


    `initialize_params {`


    `image = "ubuntu-1804-bionic-v20200414"`


    `}`


    `}`


    `network_interface {`


    `network = "default"`


    `access_config {`


    `}`


    `}`


    `}`


    In the preceding code, we defined that we will use a resource called `google_compute_instance`
    which corresponds to a VM as we did in the previous chapter. But, now we are doing
    so using Terraform. This instance will be created using the Ubuntu 1804 image
