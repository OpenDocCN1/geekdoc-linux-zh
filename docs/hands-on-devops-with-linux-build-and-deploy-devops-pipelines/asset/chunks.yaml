    The previous command means that we need to run a new container with a TTY (terminal),
    which is represented by the parameter `-t`, and an interactive, represented by
    the parameter `-i`. Thus, we can run the commands in the container terminal and
    see their outputs.


    When your container is created, you can see the following output:


    ```bash

