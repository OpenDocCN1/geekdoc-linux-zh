  trans: "\n\n我在 Slack 上创建了一个工作区，并在其中创建了一个 web hook。如果你想了解更多关于它的信息，稍后可以查看文档。但现在，最重要的是查看它是否正常工作。因此，让我们使用以下命令运行\
    \ `ElastAlert`：\n\n```\nroot@efk:~# elastalert --rule rules/alert_404.yml --verbose\n\
    ```\n\n```\n1 rules loaded\nINFO:elastalert:Starting up\nINFO:elastalert:Disabled\
    \ rules are: []\nINFO:elastalert:Sleeping for 9.999665 seconds\n```\n\n现在，你可以尝试访问一个不存在的页面，如下所示所示：\n\
    \n![](img/Figure-12.10.jpg)\n\n**图 12.10**\n\n这次访问应该生成一个带有 `404` 状态的日志。你可能在 `ElastAlert`\
    \ 上看到了这样的日志：\n\n```\nINFO:elastalert:Queried rule Alerting 404 from 2020-06-30\
    \ 18:54 UTC to 2020-06-30 18:57 UTC: 2 / 2 hits\nINFO:elastalert:Ran Alerting\
    \ 404 from 2020-06-30 18:54 UTC to 2020-06-30 18:57 UTC: 2 query hits (2 already\
    \ seen), 0 matches, 0 alerts sent\nINFO:elastalert:Background configuration change\
    \ check run at 2020-06-30 18:57 UTC\nINFO:elastalert:Background alerts thread\
    \ 0 pending alerts sent at 2020-06-30 18:57 UTC\n```\n\n这意味着我们的警告正在工作，我应该在 Slack\
    \ 上收到了通知：\n\n![](img/Figure-12.11.jpg)\n\n**图 12.11**\n\n正如你在前一张图像中看到的，我在 Slack\
    \ 上收到了带有日志的通知，通过我可以看到错误并检查应用程序正在发生什么。\n\n当然，你可以探索更多 `ElastAlert` 并配置不同类型的告警，例如使用电子邮件。然而，许多公司现在正在从电子邮件转到\
    \ Slack 或类似的工具。这就是为什么我用它作为一个例子的原因。\n\n# 结论\n\n本章简要解释了我们如何使用 EFK 栈和 Kubernetes\
    \ 设置环境。相同的步骤在云端或本地环境中同样适用。整个章节旨在向你简要介绍使用 DevOps 技术栈（DevOps-ologies）可以实现的一切。对于每一章，我们都可以写一整本书。但在我看来，对不同的主题有一个概览是非常重要的，因为你可以思考可以做什么，以及人们在不同情况下正在使用什么。之后，你可以深入研究这里代表的每种解决方案或寻找它们的替代方案。\n\
