    `http://192.168.178.62/`


    ![](img/Figure-3.1.jpg)


    **图 3.1**


    这是服务器在 Ubuntu 上运行时时的 Apache 默认页面。通常，此页面会根据你的操作系统而不同。


    现在，你可以说你已经设置了一个 Web 服务器。然而，我们知道网站不仅仅是使用 HTML 制作的。有大量的后端处理。通常是 `PHP`。当然，你可以使用可用的几十种编程语言之一来开发你的网站。但我仍然非常确定
    `PHP` 是大多数网站常用的语言。


    # 安装 PHP


    在这一部分中，让我们安装 `PHP` 并创建一个简单的页面来检查它是否已安装，以及可以使用它的它的哪些模块：


    ```bash

    root@devops:~# apt install php -y

    ```


    使用 `APT` 安装非常简单。当我们安装 `PHP` 和 `Apache` 时，会一起安装许多 Apache 模块。你可以运行以下命令来检查它们：


    ```bash

    root@devops:~# a2enmod

    ```


    `Your choices are: access_compat actions alias allowmethods asis auth_basic auth_digest
    auth_form authn_anon authn_core authn_dbd authn_dbm authn_file authn_socache authnz_fcgi
    authnz_ldap authz_core authz_dbd authz_dbm authz_groupfile authz_host authz_owner
    authz_user autoindex buffer cache cache_disk cache_socache cern_meta cgi cgid
    charset_lite data dav dav_fs dav_lock dbd deflate dialup dir dump_io echo env
    expires ext_filter file_cache filter headers heartbeat heartmonitor http2 ident
    imagemap include info lbmethod_bybusyness lbmethod_byrequests lbmethod_bytraffic
    lbmethod_heartbeat ldap log_debug log_forensic lua macro mime mime_magic mpm_event
    mpm_preforkmpm_worker negotiation php7.2 proxy proxy_ajp proxy_balancer proxy_connectproxy_express
    proxy_fcgi proxy_fdpass proxy_ftp proxy_hcheck proxy_html proxy_http proxy_http2
    proxy_scgi proxy_wstunnel ratelimit reflector remoteip reqtimeout request rewrite
    sed session session_cookie session_crypto session_dbd setenvif slotmem_plain slotmem_shm
    socache_dbm socache_memcache socache_shmcb speling ssl status substitute suexec
    unique_id userdir usertrack vhost_alias xml2enc`


    `Which module(s) do you want to enable (wildcards ok)?`


    有很多选项，但我们寻找的是 `php7.2`：


    ```bash

    root@devops:~# a2enmod php7.2

    ```


    `Considering dependency mpm_prefork for php7.2:`

    `Considering conflict mpm_event for mpm_prefork:`

    `Considering conflict mpm_worker for mpm_prefork:`

    `Module mpm_prefork already enabled`

    `Considering conflict php5 for php7.2:`

    `Module php7.2 already enabled`


    命令 `a2enmod` 启用了 `php7.2` 模块，该模块负责集成 `Apache` 和 `PHP`。当我们通过浏览器访问 `PHP` 页面时，`Apache`
    将调用该模块，由它调用 `PHP` 解释器并运行代码。让我们创建一个简单的页面作为示例：


    ```bash

    root@devops:~# vim /var/www/html/info.php

    ```


    ```php

    <?php

    phpinfo();

    ?>

    ```


    这段代码是你可以在 `PHP` 上运行的最简单的代码，用于检查一切是否运行正常。当你通过浏览器调用该页面时，你将看到以下内容：


    ![](img/Figure-3.2.jpg)


    **图 3.2**


    现在你可以通过浏览器看到你 `PHP` 安装中安装的所有内容，并确保 `PHP` 正在运行。当我们在 Web 服务器中运行完整应用程序时，`PHP` 和 `Apache`
    就足够发布信息并使其随处可访问了。


    然而，完整的系统会存储和管理数据，为了做到这一点，我们需要一个**数据库管理系统**，它可以有很多种。数据库系统和编程语言一样多，并且分为不同的类别：`SQL`、`NoSQL`、`Key
    Values` 等。


    运行在 Web 服务器上最流行的 `DBMS` 是 `MySQL/MariaDB`。所以，让我们安装并测试它。


    # 安装 MariaDB


    运行在 Web 服务器上最流行的 `DBMS` 是 `MySQL/MariaDB`。所以，让我们安装并测试：


    ```bash

    root@devops:~# apt install mariadb-server mariadb-client -y

    ```


    安装后，运行以下命令：


    ```bash

    root@devops:~# mysql

    ```


    `Welcome to the MariaDB monitor. Version 10.3.44-MariaDB on Ubuntu (10.04)`

    `Copyright (c) 2000-2018 MariaDB Contributors`

    `MariaDB is a fork of MySQL licensed under the GPL General Public License.`

    `MariaDB is a compatible drop-in replacement for MySQL.`

    `MariaDB is developed by the MariaDB Foundation.`

    `MariaDB documentation available at https://wiki.mariadb.org`

    `Type "help" for help information.`


    `MariaDB [(none)]>`


    在过去，我们通常使用 `MySQL`。但在 Oracle 购买它之后，创建了一个名为 `MariaDB` 的分支，并变得越来越受欢迎。它的 API 完全兼容
    `MySQL` 服务器。要创建一个数据库，你需要运行以下命令：


    ```sql

    MariaDB [(none)]> create database chapter03;

    ```


    `Query OK, 1 row affected (0.00 sec)`


    `MariaDB [(none)]> use chapter03;`


    `Database changed`


    你可以看到我们创建了一个名为 `chapter03` 的数据库，但没有任何表：


    ```sql

    MariaDB [(none)]> show tables;

    ```


    `Empty set (0.00 sec)`


    我们可以通过运行以下命令来创建一个表：


    ```sql

    MariaDB [(none)]> create table users(id integer primary key auto_increment, name
    varchar(50));

    ```


    `Query OK, 0 rows affected (1.77 sec)`


    我们刚刚创建了一个包含 2 列的表，一个称为 `ID`，将存储数字，另一个称为 `name`，将接收字符串。要检查表结构，使用以下命令：


    ![](img/p83.jpg)


    我刚刚输入了 4 个不同的用户 `alisson`、`gabriela`、`juergen` 和 `leonardo` 来演示如何查看存储在表中的数据：


    ```sql

    MariaDB [(none)]> select * from users;

    ```


    `+----+----------+`

    `| id | name |`

    `+----+----------+`

    `| 1 | alisson |`

    `| 2 | gabriela |`

    `| 3 | juergen |`

    `| 4 | leonardo |`

    `+----+----------+`

    `4 rows in set (0.00 sec)`


    注意数字是由数据库自动增加的。这在使用自增列时是正常的。我们这样做只是为了确保数据库服务器正在运行。现在，我们有了一个完整的配置，我们称之为 **LAMP**
    (**Linux Apache MariaDB PHP**)，并且准备好部署一个真实的应用程序。


    为了实现，我们将使用 WordPress 并看看它是如何工作的。按下 *Ctrl* + *D* 退出 MariaDB 控制台。


    # 安装 WordPress


    第一个任务是从官方网站下载 WordPress：

