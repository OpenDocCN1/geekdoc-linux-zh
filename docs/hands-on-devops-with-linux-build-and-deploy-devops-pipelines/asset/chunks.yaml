    \ (user \"root\"), use \"sudo <command>\".\nSee \"man sudo_root\" for details.\n\
    alisson@devops:~$\n```\n\n任务完成！现在我们准备好学习更多 Bash、目录、文件以及更多内容了。\n\n# 结论\n\n这只是第一章，介绍了如何安装自己的\
    \ Linux 服务器以及在 VirtualBox 之上创建实验环境。我强烈建议你使用其他 Linux 发行版再次执行所有步骤，并发现你最喜欢哪一个。当我开始使用\
    \ Linux 时，我使用不同的发行版创建了自己的实验环境，包括 Slackware、Gentoo、BigLinux、Mandrake 和 Mandriva。所以，尽管选择你自己的。在我这些年工作的公司里，大多数使用\
    \ RedHat 或 CentOS，并且它们运行在本地基础设施上。但自从我开始接触云服务，情况发生了变化。如果你尝试在 Amazon 上创建 Ubuntu\
    \ 服务器，你会发现它是最常用的发行版之一。\n\n# 第 2 章：使用 Bash\n\n本章将介绍在 Linux 系统内部导航的基础知识、主要目录、最常用的命令、重要文件、用户和组的管理，以及\
    \ Linux 权限系统的工作原理！\n\n# 结构\n\n在本章中我们将讨论以下主题：\n\n* 什么是 Bash？\n    * 简介\n    * 基础命令\n\
    * 管理文件和目录\n    * 目录结构\n    * 重要文件\n    * 自定义你的环境\n* 管理用户和组\n    * 创建和修改用户\n  \
    \  * 创建和修改组\n* 权限操作\n    * 修改读写权限\n    * 修改文件所有者和执行脚本\n\n# 目标\n\n学习完本单元后，你将能够：\n\
    \n* 理解目录基础架构\n* 使用重要文件自定义你的环境\n* 管理用户和组\n* 理解权限和执行脚本\n\n# 什么是 Bash？\n\nBash 是\
    \ Bourne Again Shell 的缩写。它是我们在旧版 Linux/Unix 系统中看到的遗留 Shell 的改进版本。在这个版本中，我们拥有许多功能，如创建函数、控制前台和后台作业、创建别名、自定义你的环境、在终端中添加颜色、新的快捷键、自动补全以及我们将在本章看到的许多其他功能。为了让你有更多背景信息，Shell\
    \ 是 Linux 上用于管理系统的接口。换句话说，它是我们运行所有命令的地方。\n\n它也是一种编程语言。在 Linux 用户中，我们经常看到 Shell\
    \ Scripting（Shell 脚本）这个术语。它什么意思？这意味着我们可以获取工作期间所有命令，将它们全部放在同一个文件中，赋予执行权限，并自动化你的日常工作。这就是一个\
    \ Shell 脚本。它基本上是 Linux 管理员的瑞士军刀。今天，它经常受到 Python 的挑战，因为 Python 是一种面向对象的语言，与 Shell\
    \ 脚本相比，它拥有许多非常易用的功能。尽管如此，它将始终是所有 Linux 管理员自动化简单任务的首选工具，在本章结束时，我将教你如何使用之前学过的命令创建一个脚本。\n\
    \n# 简介\n\n在上一章中，我们配置并安装了 Linux 系统，并能够使用 SSH 工具访问它。我们停止的地方如下：\n\n```\nssh alisson@192.168.178.62\n\
    ```\n\n```\nWelcome to Ubuntu 18.04.3 LTS (GNU/Linux 4.15.0-76-generic x86_64)\n\
    * Documentation:    https://help.ubuntu.com\n* Management:      https://landscape.canonical.com\n\
