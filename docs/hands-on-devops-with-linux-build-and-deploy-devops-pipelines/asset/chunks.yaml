    \ | apt-key add -\n      apt-get install apt-transport-https -y\n      echo \"\
    deb https://artifacts.elastic.co/packages/7.x/apt stable main\" | tee -a /etc/apt/sources.list.d/elastic-7.x.list\n\
    \      apt-get update\n      apt-get install Elasticsearch kibana -y\n      #sed\
    \ -i \"s/#network.host: 192.168.0.1/network.host: 0.0.0.0/g\" /etc/Elasticsearch/Elasticsearch.yml\n\
    \      #sed -i \"s/#discovery.seed_hosts: \\[\\\"host1\\\", \\\"host2\\\"\\]/discovery.seed_hosts:\
    \ \\[\\]/g\" /etc/Elasticsearch/Elasticsearch.yml\n      #sed -i \"s/#server.host:\
    \ \\\"localhost\\\"/server.host: \\\"0.0.0.0\\\"/g\" /etc/kibana/kibana.yml\n\
    \      #/etc/init.d/kibana restart\n      #/etc/init.d/Elasticsearch start\n \
    \   SHELL\n  end\nend\n```\n\n使用以下命令置备您的虚拟机：\n\n`vagrant up --provision`\n\n当服务器就绪后，我们必须更改某些配置。首先，通过以下命令启用\
    \ `elasticsearch` 监听所有地址：\n\n`sed -i \"s/#network.host: 192.168.0.1/network.host:\
    \ 0.0.0.0/g\" /etc/Elasticsearch/Elasticsearch.yml`\n\n其次，通过以下命令更改种子主机：\n\n`sed\
    \ -i \"s/#discovery.seed_hosts: \\[\\\"host1\\\", \\\"host2\\\"\\]/discovery.seed_hosts:\
    \ \\[\\]/g\" /etc/Elasticsearch/Elasticsearch.yml`\n\n第三，你必须通过以下命令定义为单节点集群：\n\n\
    `echo \"discovery.type: single-node\">> /etc/Elasticsearch/Elasticsearch.yml`\n\
    \n第四，通过以下命令将 `Kibana` 配置也监听所有地址：\n\n`sed -i \"s/#server.host: \\\"localhost\\\"\
    /server.host: \\\"0.0.0.0\\\"/g\" /etc/kibana/kibana.yml`\n\n然后，你可以通过运行以下命令重启服务：\n\
    \n```bash\nroot@efk:~# /etc/init.d/kibana restart\nd/Elasticsearch start\nkibana\
    \ started\nroot@efk:~# /etc/init.d/Elasticsearch start\n[….] Starting Elasticsearch\
    \ (via systemctl): Elasticsearch.service\n```\n\n如果你正确执行了所有步骤，可以使用命令 `ss –ntpl`\
    \ 检查服务端口：\n\n![](img/Figure-12.1.jpg)\n\n**图 12.1**\n\n`Kibana` 运行在端口 `5601`。现在，你可以使用以下地址检查界面。\n\
    \n`http://192.168.99.50:5601`\n\n![](img/Figure-12.2.jpg)\n\n**图 12.2**\n\n服务器启动需要一段时间。如果花费了大约\
    \ 10 分钟，请担心。\n\n此时，我们不需要在这台服务器上做任何其他操作了，所以让我们进入 `minikube` 并运行 `FluentD` 来推送日志。之后，我们将返回\
    \ `Kibana` 服务器查看日志。\n\n# 运行 Fluentd\n\n首先，让我们使用以下命令设置 `minikube` 环境：\n\n```bash\n\
    PS C:\\Users\\1511 MXTI\\Documents\\Blog\\EKF> minikube delete\n* Deleting \"\
    minikube\" in virtualbox …\n* Removed all traces of the \"minikube\" cluster.\n\
    PS C:\\Users\\1511 MXTI\\Documents\\Blog\\EKF> minikube start\n* minikube v1.11.0\
    \ on Microsoft Windows 10 Pro 10.0.19041 Build 19041\n* Automatically selected\
    \ the virtualbox driver\n* Starting control plane node minikube in cluster minikube\n\
    * Creating virtualbox VM (CPUs=2, Memory=6000MB, Disk=20000MB) …\n* Preparing\
    \ Kubernetes v1.18.3 on Docker 19.03.8 …\n* Verifying Kubernetes components…\n\
    * Enabled addons: default-storageclass, storage-provisioner\n* Done! kubectl is\
    \ now configured to use \"minikube\"\n```\n\n我删除了现有的环境并启动了一个全新的环境，以确保我们的环境完全相同。在\
    \ Kubernetes 环境运行的情况下，我们将使用以下文件设置 `DaemonSet`：\n\n```yaml\napiVersion: apps/v1\n\
    kind: DaemonSet\nmetadata:\n  name: fluentd\n  namespace: kube-system\nlabels:\n\
    \  k8s-app: fluentd-logging\n  version: v1\nspec:\n  selector:\n    matchLabels:\n\
    \      name: fluentd\n  template:\n    metadata:\n      labels:\n        name:\
    \ fluentd\n        k8s-app: fluentd-logging\n        version: v1\n        kubernetes.io/cluster-service:\
    \ \"true\"\n    spec:\n      containers:\n      - name: fluentd\n        image:\
    \ fluent/fluentd-kubernetes-daemonset:v1-debian-Elasticsearch\n        env:\n\
    \        - name: FLUENT_ELASTICSEARCH_HOST\n          value: \"192.168.99.50\"\
    \n        - name: FLUENT_ELASTICSEARCH_SSL_VERIFY\n          value: \"false\"\n\
    \        - name: FLUENT_ELASTICSEARCH_PORT\n          value: \"9200\"\n      \
    \  - name: FLUENT_ELASTICSEARCH_SCHEME\n          value: \"http\"\n        - name:\
    \ FLUENT_UID\n          value: \"0\"\n        - name: FLUENT_LOGSTASH_FORMAT\n\
    \          value: \"true\"\n        - name: FLUENT_LOGSTASH_PREFIX\n         \
    \ value: \"fluentd\"\n        - name: FLUENT_SYSTEMD_CONF\n          value: \"\
    disable\"\n        resources:\n          limits:\n            memory: 200Mi\n\
    \          requests:\n            cpu: 100m\n            memory: 200Mi\n     \
    \   volumeMounts:\n        - name: varlog\n          mountPath: /var/log\n   \
    \     - name: varlibcontainers\n          mountPath: /var/lib/containers\n   \
    \       readOnly: true\n      volumes:\n      - name: varlog\n        hostPath:\n\
    \          path: /var/log\n      - name: varlibcontainers\n        hostPath:\n\
    \          path: /var/lib/containers\n```\n\n`DaemonSet`：是一个负责在每个节点上运行相同 pod 的\
    \ Kubernetes 对象。普通 pod 与 `DaemonSet` 的区别在于，`Set` 在节点上是强制性的，如果你在部署应用程序，并不非要在所有节点上运行该应用程序：\n\
    \n```bash\nkubectl apply -f fluentd.yaml\ndaemonset.apps/fluentd configured\n\
    ```\n\n前面的命令将在你的集群中运行 `DaemonSet`。要检查它是否运行，你可以运行以下命令：\n\n```bash\nPS C:\\Users\\\
    1511 MXTI\\Documents\\Blog\\EKF> kubectl get daemonset -n kube-system\nNAME  \
    \     DESIRED   CURRENT   READY   UP-DATE   AVAILABLE   NODE SELECTOR   AGE\n\
    fluentd    1         1         1         0s        1           <none>        \
    \  7m26s\nkube-proxy  1         1         1         0s        1           kubernetes.io/os=linux\
    \  13h\n```\n\n检查日志是非常重要的，因为从开始，日志必须发送到 elasticsearch 服务器：\n\n```bash\nPS C:\\\
    Users\\1511 MXTI\\Documents\\Blog\\EKF> kubectl logs daemonset/fluentd -n kube-system\n\
    ```\n\n"
- fmt: "\nNow, we can go back to the Kibana dashboard, because the logs must have\
    \ already been shipped to the server. The next goal is to visualize them. In the\
    \ initial page, click on the option `Explore on my own`. Then, click on the top\
    \ left and discover the logs:\n\n![](images/Figure-12.3.jpg)\n\n**Figure 12.3**\n\
    \nNow, we can create an index that matches with all the logs stored. We can do\
    \ that once that cluster is used only for this Kubernetes environment. If you\
    \ will use the same `elasticsearch` for all the logs of the company, it would\
    \ be better to create different indexes for each case:\n\n![](images/Figure-12.4.jpg)\n\
    \n**Figure 12.4**\n\nWe must define the `Index Pattern as *`, which will get all\
    \ the logs:\n\n![](images/Figure-12.5.jpg)\n\n**Figure 12.5**\n\nYou can select\
    \ the time filter as a timestamp. If we go again to the discovery part and select\
    \ logs from 3 months ago, we will be able to see that the logs are already in\
    \ the `Elasticsearch`. Of course, we do not need to put 3 months ago, but I just\
    \ wanted to make sure that we will see all the present logs:\n\n![](images/Figure-12.6.jpg)\n\
    \n**Figure 12.6**\n\nIf you look on the left side, you can find some Kubernetes\
    \ elements. You can play around that because, now, we do not need to access the\
    \ Kubernetes cluster to access the logs.\n\nLet's deploy an application and see\
    \ how we can check the logs:\n\n```bash\nkubectl create ns chapter11\n```\n\n\
    Create a namespace, called `Chapter11: Deploying and Scaling your Application\
    \ using Kubernetes`, because we will use the same application used in the last\
    \ chapter. The `yaml` file for the application is as follows:\n\n```yaml\napiVersion:\
    \ apps/v1\nkind: Deployment\nmetadata:\n  name: python\n  namespace: chapter11\n\
    \  labels:\n  app: python\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
    \      app: python\n  template:\n    metadata:\n      labels:\n        app: python\n\
    \    spec:\n      containers:\n      - name: python\n        image: alissonmenezes/python:latest\n\
    \        ports:\n        - containerPort: 8080\n---\napiVersion: v1\nkind: Service\n\
    metadata:\n  labels:\n  app: python\n  name: python\n  namespace: chapter11\n\
    spec:\n  ports:\n  - name: http\n    port: 80\n    protocol: TCP\n    targetPort:\
    \ 8080\n  selector:\n    app: python\n  type: ClusterIP\n---\napiVersion: extensions/v1beta1\n\
    kind: Ingress\nmetadata:\n  name: python\n  labels:\n    app: python\n  namespace:\
    \ chapter11\n  annotations:\n    nginx.ingress.kubernetes.io/rewrite-target: /\n\
    spec:\n  backend:\n    serviceName: python\n    servicePort: 80\n```\n\nRun the\
    \ following command now:\n\n```bash\nPS C:\\Users\\1511 MXTI\\Documents\\Blog\\\
    EKF> minikube.exe ip\n```\n`192.168.99.102`\n\nThe Kubernetes IP is `192.168.99.102`.\
    \ We will use it to access the application. Make sure that you have enabled the\
    \ ingress with the following command:\n\n```bash\nPS C:\\Users\\1511 MXTI\\DataLake>\
    \ minikube.exe addons enable ingress\n```\n* The 'ingress' addon is enabled\n\n\
    If we access the application on the browser, we will see the following page:\n\
    \n![](images/Figure-12.7.jpg)\n\n**Figure 12.7**\n\nIf we go to the applications\
    \ logs on Kubernetes, we can see the following:\n\n```bash\nPS C:\\Users\\1511\
    \ MXTI\\DataLake> kubectl logs deploy/python -n chapter11\n```\n* Running on http://0.0.0.0:8080/\
    \ (Press CTRL+C to quit)\n* Restarting with stat\n* Debugger is active!\n* Debugger\
    \ PIN: 954-738-244\n`172.17.0.6 - - [28/Jun/2020 10:22:16] \"GET / HTTP/1.1\"\
    \ 200 -`\n`172.17.0.6 - - [28/Jun/2020 10:22:17] \"GET /favicon.ico HTTP/1.1\"\
    \ 404 -`\n`172.17.0.6 - - [28/Jun/2020 10:22:18] \"GET / HTTP/1.1\" 200 -`\n`172.17.0.6\
    \ - - [28/Jun/2020 10:22:18] \"GET / HTTP/1.1\" 200 -`\n\nIt means that we generated\
    \ some logs, and then we can see those on the Kibana. Let's give a look. First,\
    \ we need the pod name:\n\n```bash\nPS C:\\Users\\1511 MXTI\\DataLake> kubectl\
    \ get pods -n chapter11\n```\n`NAME                         READY   STATUS   \
    \ RESTARTS  AGE`\n`python-779879dbb6-wrw2g  1/1     Running   0         44m`\n\
    \nAnd the query on Kibana will be like this:\n\n`kubernetes.pod_name:python-779879dbb6-wrw2g`\n\
    \nThe syntax is: `key : value`. Then, the first parameter is the respective element\
    \ that you want to filter. The colon, `:`, , represents the equal and in the end,\
    \ you have the value used as a criteria.\n\nThe Kibana page you will see will\
    \ be like the following screenshot:\n\n![](images/Figure-12.8.jpg)\n\n**Figure\
    \ 12.8**\n\nLet's analyze the log because we have an important information to\
    \ check:\n\n![](images/Figure-12.9.jpg)\n\n**Figure 12.9**\n\nPay attention, the\
    \ `pod_name` matches with the criteria, and the log has the logline that we saw\
    \ on the Kubernetes. Now, we are sure that the logs were sent to elasticsearch.\
    \ We can visualize them on Kibana and now, we can create a specific visualization\
    \ to simplify the log analysis.\n\n# Creating alerts\n\nWith the logs within the\
    \ elasticsearch and we know how to find them, let's create some alerts which will\
    \ notify us when an event happens. The event can be defined by you, can return\
    \ a status `404`, status `500`, or for example, part of an error message.\n\n\
    In our case, every time that someone tries to access a non-existing page, it will\
    \ return the `404` status and it will send a notification. In order to do that,\
    \ we will use a tool called `ElastAlert`. It is a tool in Python which will connect\
    \ to our elasticsearch, will read the logs, and send the notifications.\n\nWithin\
    \ the EFK stack, let's install it.\n\n```bash\nroot@efk:~# apt install python3-pip\
    \ -y\nroot@efk:~# python3 -m pip install elastalert\n```\n\nSometimes, we may\
    \ face an issue because of the other modules version. The most important module\
    \ for the `ElastAlert` is `PyYAML`. So, let's upgrade it to make sure that we\
    \ are using the latest version:\n\n```bash\nroot@efk:~# python3 -m pip install\
    \ PyYAML --upgrade\n```\n\nOnce ElastAlert is installed, we need to connect it\
    \ with elasticsearch. To do it, run the following command:\n\n```bash\nroot@efk:~#\
    \ elastalert-create-index\n```\n`Enter Elasticsearch host: 127.0.0.1`\n`Enter\
    \ Elasticsearch port: 9200`\n`Use SSL? t/f: f`\n`Enter optional basic-auth username:`\n\
    `Enter optional basic-auth password:`\n`Enter optional Elasticsearch prefix (prepends\
    \ a string to the URL of request):`\n`New index name? (Default elastalert_status)`\n\
    `New alias name? (Default elastalert_alerts)`\n`Name of existing index to copy?\
    \ (Default None)`\n`Elastic Version: 7.0`\n`Reading Elastic 6 mappings:`\n`Reading\
    \ index mapping 'es_mappings/silence.json'`\n`Reading index mapping 'es_mappings/elastalert_status.json'`\n\
    `Reading index mapping 'es_mappings/elastalert.json'`\n`Reading index mapping\
    \ 'es_mappings/past_elastalert.json'`\n`Reading index mapping 'es_mappings/elastalert_error.json'`\n\
    `New index elastalert_status created`\n`Done!`\n\nSo, the next step is to create\
    \ the `config.yaml`, which is the file where elasticsearch server is configured:\n\
    \n```bash\nroot@efk:~# cat config.yaml\n```\n`rules_folder: rules`\n`run_every:`\n\
    `minutes: 1`\n`buffer_time:`\n`minutes: 15`\n`es_host: 127.0.0.1`\n`es_port: 9200`\n\
    `writeback_index: elastalert_status`\n`writeback_alias: elastalert_alerts`\n`alert_time_limit:`\n\
    `days: 2`\n\nNow, we need to create a rule. The `ElastAlert` will run the query\
    \ every minute checking if we have the logs which match the criteria. Create a\
    \ folder, called rules with the following command:\n\n```bash\nroot@efk:~# ls\n\
    ```\n`config.yaml rules`\n\n```bash\nroot@efk:~# mkdir rules\nroot@efk:~# pwd\n\
    ```\n`/root`\n\nWithin the rules folder, create a file, called `alert_404.yml`\
    \ with the following content:\n\n```yaml\nes_host: 192.168.99.50\nes_port: 9200\n\
    name: Alerting 404\ntype: frequency\nindex: \"*\"\nnum_events: 1\ntimeframe:\n\
    \  hours: 24\nfilter:\n- query:\n    wildcard:\n      log: \"404\"\nalert:\n-\
    \ slack:\n    slack_webhook_url: \"https://hooks.slack.com/services/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\"\
    `\n"
