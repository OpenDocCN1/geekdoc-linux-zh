    **图 3.5**\n\n# 结论\n\n我们刚刚使用 PHP、Apache 和 MariaDB 在 Linux 上搭建了最流行的技术栈。如果你正从事 Web\
    \ 托管工作或作为自由职业 Web 开发人员，这对你将非常有帮助，因为你可以使用 WordPress 创建网站，并且你现在知道如何设置和管理你的服务器。这只是后续章节的准备工作，在后续章节我们将实现自动化。\n\
    \n# 第 4 章：配置 Nginx 反向代理\n\n本章旨在解释 Nginx 是什么以及它的作用。\n\n## 目标\n\n学习本单元后，你应该能够：\n\
    \n- 什么是 Nginx\n- 什么是反向代理\n- 创建一个简单的页面\n- 配置 Nginx\n\n## 安装 Nginx\n\nNginx 是一个高性能\
    \ HTTP 服务器、反向代理、负载均衡器和邮件代理缓存。它因其速度和处理大量并发连接的能力而被广泛使用。\n\n首先，让我们运行以下命令安装 Nginx：\n\
    \n```bash\nroot@devops:~# apt install nginx -y\n```\n\n```\nReading package lists...\
    \ Done\nBuilding dependency tree\nReading state information... Done\nThe following\
    \ additional packages will be installed:\n  nginx nginx-common\nThe following\
    \ NEW packages will be installed:\n  nginx nginx-common\n0 upgraded, 2 newly installed,\
    \ 0 to remove and 2461 kB of downloaded.\n```\n\n安装完成后，你可以通过以下命令检查此文件夹中的所有配置文件：\n\
    \n```bash\nroot@devops:~# ls /etc/nginx/\n```\n\n```\nconf.d fastcgi_params modules-enabled\
    \ nginx.conf sites-enabled sites-available\n```\n\n你可能看到了它与 Apache 的某些相似之处。例如，这里也有\
    \ `sites-enabled` 和 `sites-disable`（应为 available）文件夹。所以你已经知道这些目录的作用了。然而，最重要的是\
    \ `nginx.conf`，它存储了 Web 服务器的主配置。我们可以使用 `grep` 来检查启用的行，换之即非注释行：\n\n```bash\nroot@devops:~#\
    \ grep -v \"#\" /etc/nginx/nginx.conf\n```\n\n```nginx\nuser www-data;\nworker_processes\
