    # [Creating alerts](#toc.xhtml_s101a)


    With the logs within the elasticsearch and we know how to find them, let''s create
    some alerts which will notify us when an event happens. The event can be defined
    by you, can return a status `404`, status `500`, or for example, part of an error
    message.


    In our case, every time that someone tries to access a non-existing page, it will
    return the `404` status and it will send a notification. In order to do that,
    we will use a tool called **ElastAlert**. It is a tool in Python which will connect
    to our elasticsearch, will read the logs, and send the notifications.


    Within the EFK stack, let''s install it.


    `root@efk:~#` **`apt install python3-pip -y`**


    `root@efk:~#` **`python3 -m pip install elastalert`**


    Sometimes, we may face an issue because of the other modules version. The most
    important module for the `ElastAlert` is the PyYAML. So, let''s upgrade it to
    make sure that we are using the latest version:


    `root@efk:~#` **`python3 -m pip install PyYAML --upgrade`**


    Once ElastAlert is installed, we need to connect it with elasticsearch. To do
    it, run the following command:


    `root@efk:~#` **`elastalert-create-index`**


    `Enter Elasticsearch host: 127.0.0.1`


    `Enter Elasticsearch port: 9200`


    `Use SSL? t/f: f`


    `Enter optional basic-auth username (or leave blank):`


    `Enter optional basic-auth password (or leave blank):`


    `Enter optional Elasticsearch URL prefix (prepends a string to the URL of every
    request):`


    `New index name? (Default elastalert_status)`


    `New alias name? (Default elastalert_alerts)`


    `Name of existing index to copy? (Default None)`


    `Elastic Version: 7.8.0`


    `Reading Elastic 6 index mappings:`


    `Reading index mapping ''es_mappings/6/silence.json''`


    `Reading index mapping ''es_mappings/6/elastalert_status.json''`


    `Reading index mapping ''es_mappings/6/elastalert.json''`


    `Reading index mapping ''es_mappings/6/past_elastalert.json''`


    `Reading index mapping ''es_mappings/6/elastalert_error.json''`


    `New index elastalert_status created`


    `Done!`


    So, the next step is to create the `config.yaml`, which is the file where the
    elasticsearch server is configured:


    `root@efk:~#` **`cat config.yaml`**


    `rules_folder: rules`


    `run_every:`


    `minutes: 1`


    `buffer_time:`


    `minutes: 15`


    `es_host: 127.0.0.1`


    `es_port: 9200`


    `writeback_index: elastalert_status`


    `writeback_alias: elastalert_alerts`


    `alert_time_limit:`


    `days: 2`


    Now, we need to create a rule. The `ElastAlert` will run the query every minute
    checking if we have the logs which match the criteria. Create a folder, called
    rules with the following command:


    `root@efk:~#` **`ls`**


    `config.yaml  rules`


    `root@efk:~#` **`mkdir rules`**


    `root@efk:~#` **`pwd`**


    `/root`


    Within the rules folder, create a file, called `alert_404.yml` with the following
    content:


    `es_host: 192.168.99.50`


    `es_port: 9200`


    `name: Alerting 404`


    `type: frequency`


    `index: "*"`


    `num_events: 1`


    `timeframe:`


    `hours: 24`


    `filter:`


    `- query:`


    `wildcard:`


    `log: "404"`


    `alert:`


    `- slack:`


    `slack_webhook_url: "https://hooks.slack.com/services/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"`'
