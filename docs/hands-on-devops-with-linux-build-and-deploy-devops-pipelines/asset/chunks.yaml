    \ and executing scripts\n\n# [Objectives](#toc.xhtml_s14a)\n\nAfter studying this\
    \ unit, you should be able to:\n\n*   Understand directories infrastructure\n\n\
    *   Customize your environment using important files\n\n*   Manage users and groups\n\
    \n*   Understand the permissions and executing scripts\n\n# [What is Bash?](#toc.xhtml_s15a)\n\
    \nBash is an abbreviation of Bourne Again Shell. It is an improved version of\
    \ the Legacy Shell that we used to see in older Linux/Unix Systems. In this version,\
    \ we have many features, like creating functions, controlling jobs in the foreground\
    \ and background, creating aliases, customizing your environment, putting color\
    \ in your terminal, new shortcuts, auto-complete, and many other features that\
    \ we are going to see in this chapter. Just to give you more context about it,\
    \ Shell is the interface on Linux which is used to administer the system. In other\
    \ words, it is where we run all the commands.\n\nIt is also a programming language.\
    \ Often among Linux users, we see the term Shell Scripting. What does it mean?\
    \ It means we can get all the commands used during our work, put all of them together\
    \ in the same file, give permission to execute it, and automate your daily job.\
    \ It is a Shell Script. It is basically the Swiss Knife of the Linux administrators.\
    \ Today, it is frequently challenged by Python, because Python is an object-oriented\
    \ language and has a lot of features which are very easy to use if we compare\
    \ it with the Shell Script. Nevertheless, it will always be the favorite tool\
    \ of all the Linux administrators to automate easy tasks, and at the end of this\
    \ chapter, I will teach how to create a script using all the commands learned\
    \ before.\n\n# [Introduction](#toc.xhtml_s16a)\n\nIn the last chapter, we configured\
    \ and installed our Linux system and we were able to access it using the SSH tool.\
    \ The point where we stopped is as follows:\n\n`ssh alisson@192.168.178.62`\n\n\
    `Welcome to Ubuntu 18.04.3 LTS (GNU/Linux 4.15.0-76-generic x86_64)`\n\n`* Documentation:   https://help.ubuntu.com`\n\
    \n`* Management:      https://landscape.canonical.com`\n\n`* Support:         https://ubuntu.com/advantage`\n\
    \n`System information disabled due to load higher than 1.0`\n\n`* Multipass 1.0\
    \ is out! Get Ubuntu VMs on demand on your Linux, Windows or`\n\n`Mac. Supports\
    \ cloud-init for fast, local, cloud devops simulation.`\n\n`https://multipass.run/`\n\
    \n`60 packages can be updated.`\n\n`6 updates are security updates.`\n\n`Last\
    \ login: Mon Feb 10 18:59:46 2020`\n\n`To run a command as administrator (user\
    \ \"root\"), use \"sudo <command>\".`\n\n`See \"man sudo_root\" for details.`\n\
    \n`alisson@devops:~$`\n\nIt means we are inside the Linux Shell. Now, we are going\
    \ to call it Bash because it is the command-line interpreter used. Every operating\
    \ system has its own command-line interpreter, because it is required to administer\
    \ the system. In the older versions of Windows, we had MS-DOS. Now, we have the\
    \ PowerShell. In the older versions of Linux, we had the Shell. Now, we have the\
    \ Bash and some users are migrating from Bash to Z shell. I will show in the following\
    \ pages how we can change our **CLI** (**Command Line Interpreter**).\n\nWithin\
    \ your server, the most useful command is called `ls`:\n\n`alisson@devops:~$`\
    \ **`ls`**\n\n`id_rsa.pub`\n\nThis command is used to show the files and the directories\
    \ of Linux. It can be used with different parameters. For example, if I want to\
    \ show the files and directories in a detailed mode, I can pass the parameter\
    \ `–l`:\n\n`alisson@devops:~$` **`ls -l`**\n\n`total 4`\n\n`-rw-rw-r-- 1 alisson\
    \ alisson 398 Jan 31 20:18 id_rsa.pub`\n\n`alisson@devops:~$`\n\nThe last output\
    \ shows us more information following that sequence:\n\n`Permissions – Number\
    \ of the Hard Links – User – Group – Size – Last Modification Date – Filename`"
