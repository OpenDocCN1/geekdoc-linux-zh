- fmt: '

    We installed one basic package to learn how `APT` works. Now, let''s install a
    real one. The Apache web server is currently the most used web servers in the
    world. You can deploy any application using it as a Load Balancer, cache for static
    files, proxy for another web server, and many other options that depend on your
    usage. To install Apache, use the following command:


    ```bash

    root@devops:~# apt install apache2 -y

    ```


    `Reading package lists… Done`

    `Building dependency tree`

    `Reading state information… Done`


    The following additional packages will be installed:


    `apache2-bin apache2-data apache2-utils libapr1 libaprutil1 libaprutil1-dbd-sqlite3
    libaprutil1-ldap liblua5.2-0 ssl-cert`


    If the installation ran well for you, it is possible to validate if Apache is
    installed and running using the following command:


    ```bash

    root@devops:~# service apache2 status

    ```


    `apache2.service - The Apache HTTP Server`

    `Loaded: loaded (/lib/systemd/system/apache2.service; disabled; vendor preset:
    enabled)`

    `Drop-In: /lib/systemd/system/apache2.service.d`

    `└─apache2-systemd.conf`

    `Active: active (running) since Mon 2020-07-06 12:56:38 UTC; 11s ago`

    `Process: 22810 ExecStart=/usr/sbin/apachectl start (code=exited, status=0/SUCCESS)`


    Pay attention to the part where says it `Active` (running), or, you can also use
    the command `ss -ntpl`:


    ```bash

    root@devops:~# ss -ntpl

    ```


    ![](images/p79.jpg)


    We can see Apache running on port `80`, with the `PID 22848`. `PID` means process
    identification. Now, the server is up and running. Let''s check the access via
    browser:


    `http://192.168.178.62/`


    ![](images/Figure-3.1.jpg)


    **Figure 3.1**


    This is the Apache default page when the server is running on Ubuntu. Usually,
    this page is different depending on your OS.


    Now, you can say that you have setup a web server. However, we know that the websites
    are not just made using HTML. There is a lot of back-end processing. Usually,
    it is `PHP`. Of course, you can develop your website using any of the dozens of
    programming languages that are available. But, I am still pretty sure that `PHP`
    is the most common used for most of the websites.


    # Installing PHP


    In this part, let''s install `PHP` and create a simple page to check if it is
    installed, and what are the modules available to use with it:


    ```bash

    root@devops:~# apt install php -y

    ```


    The installation is simple using `APT`. When we install `PHP` and `Apache`, there
    are many Apache modules that are installed together. You can run the following
    command to check them:


    ```bash

    root@devops:~# a2enmod

    ```


    `Your choices are: access_compat actions alias allowmethods asis auth_basic auth_digest
    auth_form authn_anon authn_core authn_dbd authn_dbm authn_file authn_socache authnz_fcgi
    authnz_ldap authz_core authz_dbd authz_dbm authz_groupfile authz_host authz_owner
    authz_user autoindex buffer cache cache_disk cache_socache cern_meta cgi cgid
    charset_lite data dav dav_fs dav_lock dbd deflate dialup dir dump_io echo env
    expires ext_filter file_cache filter headers heartbeat heartmonitor http2 ident
    imagemap include info lbmethod_bybusyness lbmethod_byrequests lbmethod_bytraffic
    lbmethod_heartbeat ldap log_debug log_forensic lua macro mime mime_magic mpm_event
    mpm_preforkmpm_worker negotiation php7.2 proxy proxy_ajp proxy_balancer proxy_connectproxy_express
    proxy_fcgi proxy_fdpass proxy_ftp proxy_hcheck proxy_html proxy_http proxy_http2
    proxy_scgi proxy_wstunnel ratelimit reflector remoteip reqtimeout request rewrite
    sed session session_cookie session_crypto session_dbd setenvif slotmem_plain slotmem_shm
    socache_dbm socache_memcache socache_shmcb speling ssl status substitute suexec
    unique_id userdir usertrack vhost_alias xml2enc`


    `Which module(s) do you want to enable (wildcards ok)?`


    There are many options, but the one we are looking for is `php7.2`:


    ```bash

    root@devops:~# a2enmod php7.2

    ```


    `Considering dependency mpm_prefork for php7.2:`

    `Considering conflict mpm_event for mpm_prefork:`

    `Considering conflict mpm_worker for mpm_prefork:`

    `Module mpm_prefork already enabled`

    `Considering conflict php5 for php7.2:`

    `Module php7.2 already enabled`


    The command `a2enmod`, enables the `php7.2` module, which is responsible to integrate
    `Apache` and `PHP`. When we access a `PHP` page via a browser, `Apache` will call
    that module which will call the `PHP` interpreter and run the code. Let''s create
    a simple page as an example:


    ```bash

    root@devops:~# vim /var/www/html/info.php

    ```


    ```php

    <?php

    phpinfo();

    ?>

    ```


    This code is the simplest code that you can run on `PHP` to check if everything
    is running. When you call that page via a browser, you will see the following:


    ![](images/Figure-3.2.jpg)


    **Figure 3.2**


    Now, you can see via browser, everything which is installed with your `PHP` installation,
    and make sure that `PHP` is running. When we are running a complete application
    within a web server, `PHP` and `Apache` are enough to publish the information
    and make it available for access everywhere.


    However, full systems store and manage data, and in order to do it, we need a
    **Database Management System**, which can be many. We have as much database systems
    as we have programming languages, and in different categories, `SQL`, `NoSQL`,
    `Key Values`, etc.


    The most popular `DBMS` running on web servers is `MySQL/MariaDB`. So, let''s
    install it and test.


    # Installing MariaDB


    The most popular `DBMS` running on web servers is `MySQL/MariaDB`. So, let''s
    install it and test:


    ```bash

    root@devops:~# apt install mariadb-server mariadb-client -y

    ```


    After the installation, run the following:


    ```bash

    root@devops:~# mysql

    ```


    `Welcome to the MariaDB monitor. Version 10.3.44-MariaDB on Ubuntu (10.04)`

    `Copyright (c) 2000-2018 MariaDB Contributors`

    `MariaDB is a fork of MySQL licensed under the GPL General Public License.`

    `MariaDB is a compatible drop-in replacement for MySQL.`

    `MariaDB is developed by the MariaDB Foundation.`

    `MariaDB documentation available at https://wiki.mariadb.org`

    `Type "help" for help information.`


    `MariaDB [(none)]>`


    In the past, we usually used `MySQL`. But after Oracle bought it, a fork called
    `MariaDB` was created and became more and popular. Its API is completely compatible
    with `MySQL` server. To create a database, you need to run the following command:


    ```sql

    MariaDB [(none)]> create database chapter03;

    ```


    `Query OK, 1 row affected (0.00 sec)`


    `MariaDB [(none)]> use chapter03;`


    `Database changed`


    You can see that we created a database, called `chapter03`, with no tables:


    ```sql

    MariaDB [(none)]> show tables;

    ```


    `Empty set (0.00 sec)`


    We can create one by running the following:


    ```sql

    MariaDB [(none)]> create table users(id integer primary key auto_increment, name
    varchar(50));

    ```


    `Query OK, 0 rows affected (1.77 sec)`


    We just created a table with 2 columns, one called `ID`, which will store numbers,
    and the other called `name`, which will receive strings. To check the table structure,
    use the following command:


    ![](images/p83.jpg)


    I just entered 4 different users, `alisson`, `gabriela`, `juergen`, and `leonardo`
    to demonstrate how we can see the data stored in a table:


    ```sql

    MariaDB [(none)]> select * from users;

    ```


    `+----+----------+`

    `| id | name |`

    `+----+----------+`

    `| 1 | alisson |`

    `| 2 | gabriela |`

    `| 3 | juergen |`

    `| 4 | leonardo |`

    `+----+----------+`

    `4 rows in set (0.00 sec)`


    Notice that I just entered the names and the numbers were automatically increased
    by the database. This is normal when we have an auto-increment column. We did
    that just to make sure the database server is running. Now, we have a full setup
    which we call **LAMP** (**Linux Apache MariaDB PHP**) and we are ready to deploy
    a real application.


    For that, we will use WordPress and see how it works. Leave the MariaDB console
    by pressing *Ctrl* + *D*.


    # Installing WordPress


    The first task is to download WordPress from the official website:

