    And that is it. This was your `QuickStart` for managing user and groups. Of course,
    we could go so much deeper in these topics, but I still have to explain how you
    can customize your environment.


    # Working with Permissions


    The Linux permission system works differently from Windows. We have some numbers
    associated with the permission. So, for example:


    - 1 – Execution

    - 2 - Writing

    - 4 – Reading


    So you always have to make some math to apply for the permission. If you want
    to assign the execution permission you can set as `1`, write permission `2` and
    reading permission `4`. `Write + Reading` is equal to `6`, so the permission is
    `6`. If you want `Read + Write + Execution` is equal to `7`. Let''s create a file
    and check its permissions:


    ```

    alisson@devops:~$ touch new_file

    alisson@devops:~$ ls -la new_file

    ```


    ```

    -rw-rw-r-- 1 alisson alisson 0 Feb 20 19:21 new_file

    ```


    The command `touch` is responsible to change the access time of any file. If the
    file does not exist, it creates one. Checking the output, you can see that we
    have the permissions: `read+write`, `read+write`, read, but what means that sequence:


    `user – group – other`


    In the same line, we can see `alisson alisson`, the first one is the user owner
    for this file and the second one is the group. By default, all the users created
    on Linux have a group with the same name as the user.


    If you remember the numbers which represent the permission, we can make a calculation,
    `read+write = 4 + 2 = 6`. Then we have the following permissions:


    ```

    664

    ```


    Therefore, the user can read and write. Users from the same group can also read
    and write, users who do not belong to the group can just read. Now, we can create
    a directory and analyze the permissions as we did just now:


    ```

    alisson@devops:~$ mkdir new_folder

    alisson@devops:~$ ls -la | grep new_folder

    ```


    ```

    drwxrwxr-x 2 alisson alisson 4096 Feb 20 19:29 new_folder

    ```


    Analyzing the permissions, we can see, `read + write + execution` for the user
    and group, and `read + execution` for the others. If we make the following association:


    ```

    read + write + execution = 4 + 2 + 1 = 7

    read + execution = 4 + 1 = 5

    ```


    Then, we have `775`. What can we conclude, then? The default permissions for the
    files are `644`, and for the directories are `775`.


    **Why are the permissions for the directories and the files different? If we paid
    attention, the only difference is Execution. The files are created without this,
    just for security. So, we can execute the wrong files, and the folders are created
    with the execution permission because with this permission, we can open the folders.**


    Nice, but how can we change the file permissions?


    # Changing read and write permissions


