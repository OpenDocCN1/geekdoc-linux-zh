  trans: "\n我的账户是空的。我过去使用过更多的 AWS，目前在我的工作中使用 Azure，并在个人项目中使用 GCP。然而，这是你用来管理虚拟机（VMs）的控制台。对你来说，知道在控制台中哪里查看你的虚拟机非常重要，因为这样更容易看到你拥有的监控情况。但从现在开始，我们将使用命令行创建一切。所以，现在请安装\
    \ Python，然后输入以下 AWS 命令行：\n\n`https://www.python.org/downloads/`\n\n安装 Python 后，运行以下命令行安装\
    \ AWS CLI：\n\n```\nPS C:\\Users\\1511 MXTI> python -m pip install awscli --user\n\
    Collecting awscli\n```\n\n要检查 AWS CLI 是否安装成功，运行以下命令：\n\n```\nPS C:\\Users\\1511\
    \ MXTI> aws --version\naws-cli/1.18.42 Python/3.8.2 Windows/10 botocore/1.15.42\n\
    ```\n\n一切运行正常。现在，为了配置访问权限，你需要创建一个具有程序化访问的 IAM 账户。最简单的方法是点击 `Services` 并输入 `IAM`，如下截图所示：\n\
    \n![](img/Figure-7.3.jpg)\n\n**图 7.3**\n\n`IAM` 意味着 `Identity Access Management`（身份访问管理）。该服务负责创建和管理用户及组。在仪表板中，点击\
    \ `Users`|`Add User`:\n\n![](img/Figure-7.4.jpg)\n\n**图 7.4**\n\n我正在创建一个名为 DevOps\
    \ 的新用户，并开启程序化访问：\n\n![](img/Figure-7.5.jpg)\n\n**图 7.5**\n\n直接选择 `Attach existing\
    \ policies` 选项，会出现 `AdministratorAccess` 策略。此策略将允许我们的用户在 AWS 账户中执行所有操作。此权限不推荐用于生产环境。用户必须仅拥有特定目的所需的权限。\n\
    \n![](img/Figure-7.6.jpg)\n\n**图 7.6**\n\n保存用户后，你将被重定向到带有 `Access Key`（访问密钥）和\
    \ `Secret Key`（秘密密钥）的页面。保存这些值，因为你永远无法再次获得 `Secret Key`。唯一的方法是重新创建一个新用户。\n\n![](img/Figure-7.7.jpg)\n\
    \n**图 7.7**\n\n遵循这些步骤后，我们可以配置命令行并测试我们是否能够连接到控制台。第一个任务是将我们的密钥添加到本地环境中：\n\n```\n\
    PS C:\\Users\\1511 MXTI> aws configure\nAWS Access Key ID [None]: YOU_ACCESS_KEY\n\
