- fmt: "\nNow, we can create the files and create our first VM using a Cloud provider.\
    \ I will do that first using the `GCP` which is the Cloud provider that I use\
    \ for my personal projects. Then, the first step is creating a folder where you\
    \ will store your code.\n\n![](images/p161.jpg)\n\nOf course, it is the best practice\
    \ to split your code into many files, because it makes the code reusable and easy\
    \ to manage. But in this, we will just create one virtual machine to learn the\
    \ Terraform syntax and understand how it works. So, I will create everything in\
    \ one single file.\n\n## Setting up Service Account\n\nTo begin with, we need\
    \ to create a service account which is a username and a password to create resources\
    \ on my behalf. To access your Google Cloud Console (`https://console.cloud.google.com/`),\
    \ go to `IAM & Admin` and on `Create service account`, create an account called\
    \ `terraform`, as shown in the following screenshot:\n\n![](images/Figure-8.1.jpg)\n\
    \n**Figure 8.1**\n\nClick on `Create`, and then select the `Role Compute Admin`.\
    \ This role will allow the service account to manage all the resources regarding\
    \ the Compute Engine, which corresponds to our VMs.\n\nThen, you must create a\
    \ key in the JSON format as shown in the following screenshot:\n\n![](images/Figure-8.2.jpg)\n\
    \n**Figure 8.2**\n\nNow, you have the service account configured and ready to\
    \ use with Terraform. Copy the JSON file, and put it in the same folder where\
    \ we will create the Terraform code. In the folder that we created, let's create\
    \ a new file, called `infrastructure.tf` with the following content:\n\n```terraform\n\
    provider \"google\" {\n  credentials = file(\"terraform_sa.json\")\n  project\
    \     = \"alisson-187813\"\n  region      = \"us-east1\"\n}\n```\n\nThis code\
    \ is necessary for Terraform. In this file, you will use the Google providers.\
    \ Providers are modules created to make the interface between your Terraform code\
    \ and the platform that you want to interact with. For example, once I had a situation\
    \ where I had to manage a DNS server on Linux (Bind9). When the way to do it using\
    \ the Terraform was using the `TSIG` protocol, I had to import the DNS provider.\
    \ In the case of Azure, I imported the `AzureRM` provider. If you want to get\
    \ to know more about that, I have two posts on my personal blog.\n\nUsing Azure\
    \ and Terraform: [http://alissonmachado.com.br/terraform-azure-criando-uma-infraestrutura-basica/](http://alissonmachado.com.br/terraform-azure-criando-uma-infraestrutura-basica/)\n\
    \nManaging DNS using Terraform and TSIG: [http://alissonmachado.com.br/terraform-gerenciando-dns-com-tsig/](http://alissonmachado.com.br/terraform-gerenciando-dns-com-tsig/)\n\
    \n## Initializing Terraform\n\nGetting back to the code, the providers do not\
    \ come by default with Terraform. You must download them. You can do it using\
    \ the following command:\n\n```cmd\nC:\\Users\\1511 MXTI\\ProductionInfrastructure>\
    \ terraform init\n```\n\n```text\nInitializing the backend…\nInitializing provider\
    \ plugins…\n- Checking for available provider plugins…\n- Downloading plugin for\
    \ provider \"google\" (hashicorp/google) 3.20.0…\nThe following providers do not\
    \ have any version constraints in configuration, so the latest version was installed.\n\
    To prevent automatic upgrades to new major versions that may contain breaking\
    \ changes, it is recommended to add version = \"…\" constraints to the corresponding\
    \ provider blocks in configuration, with the constraint strings suggested below.\n\
    * provider.google: version = \"~> 3.20\"\nTerraform has been successfully initialized!\n\
    ```\n\nYou may now begin working with Terraform. Try running `terraform plan`\
    \ to see any changes that are required for your infrastructure. All Terraform\
    \ commands should now work.\n\nIf you ever set or change modules or backend configuration\
    \ for Terraform, rerun this command to reinitialize your working directory. If\
    \ you forget, other commands will detect it and remind you to do so if necessary.\n\
    \n## Creating Infrastructure\n\nNow, you are able to create the Infrastructure\
    \ because you already have the provider installed in your local machine. Therefore,\
    \ include the following code to create our first instance:\n\n```terraform\nprovider\
    \ \"google\" {\n  credentials = file(\"terraform_sa.json\")\n  project     = \"\
    alisson-187813\"\n  region      = \"us-east1\"\n}\n\nresource \"google_compute_instance\"\
    \ \"chapter8\" {\n  name         = \"chapter8-instance\"\n  machine_type = \"\
    g1-small\"\n  zone         = \"us-east1-b\"\n  boot_disk {\n    initialize_params\
    \ {\n      image = \"ubuntu-1804-bionic-v20200414\"\n    }\n  }\n  network_interface\
    \ {\n    network = \"default\"\n    access_config {\n    }\n  }\n}\n```\n\nIn\
    \ the preceding code, we defined that we will use a resource called `google_compute_instance`\
    \ which corresponds to a VM as we did in the previous chapter. But, now we are\
    \ doing so using Terraform. This instance will be created using the Ubuntu 1804\
    \ image in the zone `us-east1-b` and the other details, like networking configurations.\
    \ We will use the default set by Google.\n\nThe first thing when we create a new\
    \ code using Terraform is to run the following command:\n\n```powershell\nPS C:\\\
    Users\\1511 MXTI\\ProductionInfrastructure> terraform plan\n```\n\n```text\nRefreshing\
    \ Terraform state in-memory prior to plan…\nThe refreshed state will be used to\
    \ calculate this plan, but will not be\npersisted to local or remote state storage.\n\
    ------------------------------------------------------------------------\nAn execution\
    \ plan has been generated and is shown below.\nResource actions are indicated\
    \ with the following symbols:\n+ create\nTerraform will perform the following\
    \ actions:\n# google_compute_instance.chapter8 will be created\n+ resource \"\
    google_compute_instance\" \"chapter8\" {\n+ can_ip_forward           = false\n\
    + cpu_platform             = (known after apply)\n+ current_status           =\
    \ (known after apply)\n+ deletion_protection      = false\n+ guest_accelerator\
    \        = (known after apply)\n+ id                      = (known after apply)\n\
    + instance_id              = (known after apply)\n+ label_fingerprint        \
    \ = (known after apply)\n+ machine_type             = \"g1-small\"\n+ metadata_fingerprint\
    \      = (known after apply)\n+ min_cpu_platform         = (known after apply)\n\
    + name                     = \"chapter8-instance\"\n+ project                \
    \  = (known after apply)\n+ self_link                = (known after apply)\n+\
    \ tags_fingerprint          = (known after apply)\n+ zone                    \
    \  = \"us-east1-b\"\n+ boot_disk {\n+ auto_delete              = true\n+ device_name\
    \              = (known after apply)\n+ disk_encryption_key_sha256 = (known after\
    \ apply)\n+ kms_key_self_link        = (known after apply)\n+ mode           \
    \           = \"READ_WRITE\"\n+ source                    = (known after apply)\n\
    + initialize_params {\n+ image  = \"ubuntu/1804-lts\"\n+ labels = (known after\
    \ apply)\n+ size   = (known after apply)\n+ type   = (known after apply)\n}\n\
    }\n+ network_interface {\n+ name               = (known after apply)\n+ network\
    \            = \"default\"\n+ network_ip         = (known after apply)\n+ subnetwork\
    \         = (known after apply)\n+ subnetwork_project = (known after apply)\n\
    + access_config {\n+ nat_ip          = (known after apply)\n+ network_tier = (known\
    \ after apply)\n}\n}\n}\n+ scheduling {\n+ automatic_restart   = (known after\
    \ apply)\n+ on_host_maintenance = (known after apply)\n+ preemptible         \
    \ = (known after apply)\n+ node_affinities {\n+ key      = (known after apply)\n\
    + operator = (known after apply)\n+ values   = (known after apply)\n}\n}\n}\n\
    }\n\nPlan: 1 to add, 0 to change, 0 to destroy.\n\n------------------------------------------------------------------------\n\
    Note: You didn't specify an \"-out\" parameter to save this plan, so Terraform\
    \ can't guarantee that exactly these actions will be performed if \"terraform\
    \ apply\" is subsequently run.\n"
  raw: 'Now, we can create the files and create our first VM using a Cloud provider.
    I will do that first using the GCP which is the Cloud provider that I use for
    my personal projects. Then, the first step is creating a folder where you will
    store your code.


    ![](images/p161.jpg)


    Of course, it is the best practice to split your code into many files, because
    it makes the code reusable and easy to manage. But in this, we will just create
    one virtual machine to learn the Terraform syntax and understand how it works.
    So, I will create everything in one single file.


    To begin with, we need to create a service account which is a username and a password
    to create resources on my behalf. To access your Google Cloud Console (**https://console.cloud.google.com/**),
    go to **`IAM & Admin`** and on **`Create service account`**, create an account
    called terraform, as shown in the following screenshot:


    ![](images/Figure-8.1.jpg)


    **Figure 8.1**


    Click on **`Create`**, and then select the **`Role Compute Admin`**. This role
    will allow the service account to manage all the resources regarding the Compute
    Engine, which corresponds to our VMs.


    Then, you must create a key in the JSON format as shown in the following screenshot:


    ![](images/Figure-8.2.jpg)


    **Figure 8.2**


    Now, you have the service account configured and ready to use with Terraform.
    Copy the JSON file, and put it in the same folder where we will create the Terraform
    code. In the folder that we created, let''s create a new file, called infrastructure.tf
    with the following content:


    `provider "google" {`


    `credentials = file("terraform_sa.json")`


    `project     = "alisson-187813"`


    `region      = "us-east1"`


    `}`


    This code is necessary for Terraform. In this file, you will use the Google providers.
    Providers are modules created to make the interface between your Terraform code
    and the platform that you want to interact with. For example, once I had a situation
    where I had to manage a DNS server on Linux (Bind9). When the way to do it using
    the Terraform was using the TSIG protocol, I had to import the DNS provider. In
    the case of Azure, I imported the AzureRM provider. If you want to get to know
    more about that, I have two posts on my personal blog.


    Using Azure and Terraform: **[http://alissonmachado.com.br/terraform-azure-criando-uma-infraestrutura-basica/](http://alissonmachado.com.br/terraform-azure-criando-uma-infraestrutura-basica/)**


    Managing DNS using Terraform and TSIG: **[http://alissonmachado.com.br/terraform-gerenciando-dns-com-tsig/](http://alissonmachado.com.br/terraform-gerenciando-dns-com-tsig/)**


    Getting back to the code, the providers do not come by default with Terraform.
    You must download them. You can do it using the following command:


    `C:\Users\1511 MXTI\ProductionInfrastructure>` **`terraform init`**


    `Initializing the backend…`


    `Initializing provider plugins…`


    `- Checking for available provider plugins…`


    `- Downloading plugin for provider "google" (hashicorp/google) 3.20.0…`


