- fmt: "\nTherefore, once all the tests were made by the developers, we can assume\
    \ that we have a new version of our application, which can be called version `0.1`.\
    \ Assuming that it is working, we will create a package of that application and\
    \ deploy it in the staging environment. In this environment, someone from the\
    \ business part of the company will validate again if the feature requests are\
    \ working properly as they requested. This stage is also used for the UX team\
    \ to validate if your interface is understandable and easy to use. If this version\
    \ of the application does not fulfill all the requirements, or the developers\
    \ did not understand how the new feature should work, this version can be discarded\
    \ and they will work in a new version called, `0.2`. For example, and it will\
    \ pass through all the environments again until it fulfills all the requirements\
    \ specified by the end customer.\n\nAt the end of the day, Continuous Delivery\
    \ is being able to deploy a version of your application every time a new feature\
    \ is released. Not accumulating these features will be harder to test, since many\
    \ are not uncommon for business areas validating the application manually.\n\n\
    # Pipeline as Code and Jenkins\n\nWe have many tools which can help us with the\
    \ pipelines and integration between the environment, and indeed Jenkins is the\
    \ most famous, because of its flexibility that allows us to install many plugins\
    \ to easily integrate with the Cloud providers and also being open source. Thus,\
    \ we do not need to pay for a license.\n\nThe focus of this book is not especially\
    \ software development, but Infrastructure as Code. So, all the examples that\
    \ I will use will be regarding Infrastructure and how we can test and deploy it.\n\
    \nFirstly, we need to setup our Jenkins server. I will setup it using Vagrant.\
    \ To create a VM with Ubuntu, install Docker, and then, Jenkins will run on top\
    \ of the Docker:\n\n```ruby\n# -*- mode: ruby -*-\n# vi: set ft=ruby :\nVagrant.configure(\"\
    2\") do |config|\n  config.vm.box = \"ubuntu/bionic64\"\n  config.vm.box_check_update\
    \ = false\n  config.vm.provider \"virtualbox\" do |vb|\n    vb.memory = \"1024\"\
    \n  end\n  config.vm.define \"docker\" do |docker|\n    docker.vm.box = \"ubuntu/bionic64\"\
    \n    docker.vm.network \"private_network\", ip: \"192.168.33.11\"\n    docker.vm.hostname\
    \ = \"docker\"\n    docker.vm.provision \"shell\", inline: <<-SHELL\n      apt\
    \ clean\n      apt-get update\n      apt-get remove docker docker-engine docker.io\
    \ containerd runc -y\n      apt-get install apt-transport-https ca-certificates\
    \ curl gnupg-agent software-properties-common -y\n      curl -fsSL https://download.docker.com/linux/ubuntu/gpg\
    \ | apt-key add -\n      add-apt-repository \"deb [arch=amd64] https://download.docker.com/linux/ubuntu\
    \ $(lsb_release -cs) stable\"\n      apt-get update -y\n      apt-get install\
    \ docker.io -y\n    SHELL\n  end\nend\n```\n\nThe preceding code is just edited\
    \ a little bit from `chapter06`. Then, we already know how to install and run\
    \ a VM on Vagrant. Now, I have a Docker environment running and to run the Jenkins\
    \ in a container is very simple. Just run the following command:\n\n```bash\n\
    root@docker:~# docker run -tdi --restart=always --name jenkins -p 8080:8080 -p\
    \ 50000:50000 jenkins/jenkins:lts\n```\n\nAfter the containers start, you can\
    \ access the Jenkins by the following address:\n\n`http://192.168.33.11:8080/login?from=%2F`\n\
    \nIt will show you the following screen asking for the initial password:\n\n![](images/Figure-10.1.jpg)\n\
    \n**Figure 10.1**\n\nYou can get the password by running the following command:\n\
    \n```bash\ndocker exec -ti jenkins cat /var/jenkins_home/secrets/initialAdminPassword\n\
    ```\n\n`a7a1b2c796404bceab99b014f3220a9a`\n\nYou can just copy the password:\n\
    \n`a7a1b2c796404bceab99b014f3220a9a`\n\nPaste in the screen and proceed with the\
    \ installation.\n\n![](images/Figure-10.2.jpg)\n\n**Figure 10.2**\n\nIt is highly\
    \ recommended to install the suggested plugins because it will install one of\
    \ the most important, which is the git plugin. Now, you just need to follow the\
    \ sequence, `Next`, `Next`, and `Finish`, to finalize your installation.\n\n![](images/Figure-10.3.jpg)\n\
    \n**Figure 10.3**\n\nThe last part of the installation is setting your admin credentials.\
