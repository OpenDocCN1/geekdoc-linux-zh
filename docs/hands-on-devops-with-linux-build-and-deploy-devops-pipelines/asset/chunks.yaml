    \    \"offer\": \"UbuntuServer\",\n    \"publisher\": \"Canonical\",\n    \"sku\"\
    : \"18.04-LTS\",\n    \"urn\": \"Canonical:UbuntuServer:18.04-LTS:latest\",\n\
    \    \"urnAlias\": \"UbuntuLTS\",\n    \"version\": \"latest\"\n  }\n]\n```\n\n\
