    Default output format [None]:\n```\n\n在区域名称中，我设置了 `eu-central-1`，它对应 `Frankfurt`，因为我住在\
    \ `Germany`。人们通常将此选项设置为 `us-east-1`，它对应美国的弗吉尼亚。所以，这取决于你的决定。\n\n现在，你可以使用以下命令检查是否有任何示例实例：\n\
    \n```\nPS C:\\Users\\1511 MXTI> aws ec2 describe-instances\n{\n  \"Reservations\"\
    : []\n}\n```\n\n我没有任何示例实例，但在使用控制台时创建一个是一项简单的任务。只需点击几次，你就可以创建一个。然而，你无法实现自动化。要实现自动化，你需要使用命令行，为此，你应该了解虚拟机所需的所需的每一个对象。\n\
