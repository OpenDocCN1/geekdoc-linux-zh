    Jun 10, 2020 12:46:41 PM hudson.remoting.jnlp.Main$CuiListener status\nINFO: Handshaking\n\
    Jun 10, 2020 12:46:41 PM hudson.remoting.jnlp.Main$CuiListener status\nINFO: Connecting\
    \ to 192.168.33.11:50000\nJun 10, 2020 12:46:41 PM hudson.remoting.jnlp.Main$CuiListener\
    \ status\nINFO: Trying protocol: JNLP4-connect\nJun 10, 2020 12:46:42 PM hudson.remoting.jnlp.Main$CuiListener\
    \ status\nINFO: Remote identity confirmed: 52:84:5b:cb:ed:f7:98:4c:da:b2:64:66:48:de:cf:be\n\
    Jun 10, 2020 12:46:43 PM hudson.remoting.jnlp.Main$CuiListener status\nINFO: Connected\n\
    ```\n\nagent 已成功连接。现在，我们可以继续编写流水线代码并完成应用程序部署：\n\n```\npipeline {\n    agent any;\n\
    \    stages {\n        stage('Preparing the environment') {\n            steps\
    \ {\n                sh 'python -m pip install -r requirements.txt'\n        \
    \    }\n        }\n        stage('Code Quality') {\n            steps {\n    \
    \            sh 'python -m pylint app.py'\n            }\n        }\n        stage('Tests')\
    \ {\n            steps {\n                sh 'python -m pytest'\n            }\n\
    \        }\n        stage('Build') {\n            agent {\n                node{\n\
    \                    label \"DockerServer\";\n                }\n            }\n\
    \            steps {\n                sh 'docker build https://github.com/AlissonMMenezes/Chapter10.git\
    \ -t chapter10:latest'\n            }\n        }\n        stage('Deploy') {\n\
    \            agent {\n                node{\n                    label \"DockerServer\"\
    ;\n                }\n            }\n            steps {\n                sh 'docker\
    \ run -tdi -p 5000:5000 chapter10:latest'\n            }\n        }\n    }\n}\n\
    ```\n\n这是流水线的最新版本。让我们运行它看看它是否可以工作：\n\n![](img/Figure-10.16.jpg)\n\n图 10.16\n\n\
    太棒了！现在我们拥有了一个功能完整的流水线，它带有应用版本控制，可以运行测试、代码质量检查，并且实现了 Docker 化。\n\n## 结论\n\n我们刚刚学习了如何使用\
    \ Jenkins 创建代码即流水线（pipeline as code）、运行代码质量检查、功能测试、基于功能应用程序创建镜像，并将其部署在 Docker\
    \ 服务器上。\n\n我们可以看到，这并不是一项极其困难的任务。当然，你的项目越复杂，你的流水线就会越复杂。例如，在初始步骤中，我们能够让 Jenkins\
    \ 独立运行一切。而在最后步骤中，我们必须添加一个节点并在其上运行。我们还学习了关于 Docker 的新知识，例如每次服务器启动时启动容器的某些参数。我们还可以使用直接托管在远程仓库中的\
    \ Dockerfile 来构建镜像。\n\n我深信这段介绍将为你创建完美契合你项目的流水线提供开始。\n\n## 问题\n\n1. 使用流水线有什么好处？\n\
    2. 什么是 CI 和 CD？\n3. 为什么将流水线作为代码（as code）是一种良好的实践？\n4. BlueOcean 插件可以带给我们哪些好处？\n\
    5. 什么时候需要 Jenkins 节点？\n\n## 第 11 章\n\n## 使用 Kubernetes 部署和扩展你的应用程序\n\n本旨在向你介绍\
    \ Kubernetes，展示如何创建 YAML 文件来使用最流行且可靠的容器编排工具部署并扩展你的应用程序。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\
    \n* Kubernetes\n* Kubernetes 简介\n* 在云端部署\n\n## 目标\n\n学习完本单元后，你应该能够：\n\n* 了解 Kubernetes\n\
    * 解释 Kubernetes 的优势\n* 创建 YAML 文件来部署你的应用程序\n* 测试在集群中运行的应用程序\n\n## Kubernetes\n\
    \nKubernetes 是一个容器编排工具。在之前的章节中，我们经常使用 Docker 来部署应用程序、创建新镜像等。然而，想象如果你有超过一百个容器需要管理，这对于一个人来说是不可能完成的任务。Docker\
    \ 本身带有 `Docker Swarm`，可以帮助你完成该任务。但它并没有被市场广泛采用，因为缺少了 Kubernetes 中的某些功能和集成。它由 Google\
    \ 在几年前创建，基于一个名为 `Borg` 的项目（这也是容器编排工具）。随着 Docker 的发布，该项目进行了适配，现在它已成为管理集群的官方平台。\n\
    \n## Kubernetes 简介\n\n与其他章节一样，我们的重点始终是如何真实环境中实现它。让我们简要介绍如何设置本地环境来学习 Kubernetes，然后我们可以设置真实环境并部署应用程序。你会发现，在本地环境和云端运行时命令是相同的。\n\
    \n首先，我们将安装 `minikube`。它是一个在 Virtual Box 之上设置本地 Kubernetes 环境的工具，正如我们随书中做的那样：\n\
    \n```\nwget https://github.com/kubernetes/minikube/releases/download/v1.11.0/minikube-windows-amd64.exe\
    \ -O minikube.exe\n```\n\n如果你使用的是其他操作系统，可以参考官方文档：[`kubernetes.io/docs/tasks/install-minikube/`](https://kubernetes.io/docs/tasks/install-minikube/)\n\
    \n然后，我们可以启动集群：\n\n```\nPS C:\\Users\\1511 MXTI>.\\minikube.exe start\n* minikube\
    \ v1.11.0 on Microsoft Windows 10 Pro 10.0.19041 Build 19041\n* Automatically\
    \ selected the virtualbox driver\n* Downloading VM boot image …\n* Starting control\
    \ plane node minikube in cluster minikube\n* Downloading Kubernetes v1.18.3 preload\
    \ …\n* Creating virtualbox VM (CPUs=2, Memory=6000MB, Disk=20000MB) …\n* Preparing\
    \ Kubernetes v1.18.3 on Docker 19.03.8 …\n* Verifying Kubernetes components…\n\
    * Enabled addons: default-storageclass, storage-provisioner\n* Done! kubectl is\
    \ now configured to use \"minikube\"\n```\n"
- fmt: "\nWe also need to install the `kubectl`, a command which we will use to manage\
    \ your cluster, for `dev`, `stg`, and `prd`. If you are using another operating\
    \ system, you can follow the official documentation: [https://kubernetes.io/docs/tasks/tools/install-minikube/](https://kubernetes.io/docs/tasks/tools/install-minikube/)\n\
    \n```bash\nPS C:\\Users\\1511 MXTI> wget https://storage.googleapis.com/kubernetes-release/release/v1.18.3/bin/linux/amd64/kubectl\
    \ -O kubectl.exe\n```\n\nTo begin with, we can run a simple command to see how\
    \ many clusters we have configured in our environment:\n\n```bash\nPS C:\\Users\\\
    1511 MXTI> .\\kubectl.exe config get-clusters\n```\n`NAME`\nMinikube\n\nFor now,\
    \ it is just the `minikube.` But we will have more, one important thing to know\
    \ is where the `kubectl` get this informationfrom:\n\n```bash\nPS C:\\Users\\\
    1511 MXTI> cat 'C:\\Users\\1511 MXTI\\.kube\\config'\n```\n\nAfter the `minikube`\
    \ installs the `k8s` cluster, it configures within the `config` file, inside of\
    \ `.kube` folder which is located in your `home` directory. All the authenticate\
    \ information is located within that file. If you want to know everything running\
    \ inside your cluster, you can run the following command:\n\n![](images/p227.jpg)\n\
    \nI used the parameter to get pods, and another parameter `–all-namespaces.` It\
    \ shows us all the running containers in the cluster among all the namespaces.\
    \ For now, we just have one, called `kube-system`. Before we move on with more\
    \ commands, it is important to understand `pod`, namespace, and not just it.\n\
    \n*   **POD**: It represents a set of one or more containers running.\n*   **NAMESPACE**:\
    \ It is the logical separation among the objects. For example, in the same cluster\
    \ I can have, `dev – stg – prd`, namespaces, each one running on different versions\
    \ of the same application, or it could be, `project1`, `project2`, and `project3`.\
    \ You can divide your cluster in as many namespaces as you want.\n*   **SERVICE**:\
    \ This is a resource which you will use to connect the external world with your\
    \ pods. If you remember the Docker chapter, we had to map the host port `8080`\
    \ to the container port `8080.` But it was for only one container. On Kubernetes,\
    \ we have a `POD` which can have one or more containers that can be destroyed\
    \ and recreated at any time. However, we cannot lose the port mapping, that is,\
    \ the `SERVICE` job, where we configure a `NODE` Port, which will redirect to\
    \ a `POD` port, exactly in the same way we did with Docker. It was one of the\
    \ usages of the services, but, we can also have other implementations, like a\
    \ load balancer, which has a `clusterIP` that will receive the incoming connections\
    \ and forward it to the containers.\n*   **DEPLOYMENT**: It is a set of rules\
    \ to make sure that you have a specific number of running containers. All the\
    \ containers are running the same image, and if any container dies, it will be\
    \ recreated. In other words, it will create your `PODs` automatically, and the\
    \ `REPLICASET` will ensure the running containers.\n*   **INGRESS**: This resource\
    \ can be compared to a Virtual Host, like we did in the Apache chapter. Here,\
    \ we will have a `NAME`, which will point to `SERVICE,` which will point to a\
    \ `POD`. If you are not using a DNS, the `INGRESS` is not mandatory.\n\nThe aforementioned\
    \ items are called the Kubernetes objects. There are so many more objects that\
    \ we can explore to understand more about Kubernetes, but we could write a whole\
    \ book just explaining it. For now, I think it is enough to deploy some micro-services\
    \ at last. If you are deploying stateful applications, you will probably have\
    \ to extend your reading to `VOLUMES`.\n\nSo, now we can create the first `NAMESPACE`\
    \ and start to play around some objects:\n\n```bash\nPS C:\\Users\\1511 MXTI>\
    \ .\\kubectl.exe create namespace chapter11\nnamespace/chapter11 created\n```\n\
    \n```bash\nPS C:\\Users\\1511 MXTI> .\\kubectl.exe get ns\nNAME             STATUS\
    \    AGE\nchapter11        Active    11s\ndefault          Active    38m\nkube-node-lease\
    \  Active    38m\nkube-public      Active    38m\nkube-system      Active    38m\n\
    ```\n\nNotice that we can use the full form of the parameters, and also the short\
    \ form, like, when I listed the namespaces, I used just the `ns`.\n\nThe `INGRESS`\
    \ is a separate resource from Kubernetes. When you are using it on the Cloud,\
    \ some give it to you already installed. But, in an on-premises environment, you\
    \ usually have to install. For our local environment, we will have to install\
    \ it using the following command:\n\n```bash\nPS C:\\Users\\1511 MXTI> .\\minikube.exe\
    \ addons enable ingress\n* The 'ingress' addon is enabled\n```\n\nTo run your\
    \ first application in the cluster, run the following command:\n\n```bash\nPS\
    \ C:\\Users\\1511 MXTI> .\\kubectl.exe --namespace=chapter11 run python -dti --port=8080\
    \ --image=alissonmenezes/python:latest -l app=python\n```\n\nThis command will\
    \ download the `python_app:v1` from my personal repository `alissonmenezes` and\
    \ expose the port `8080`. If you want to check if the `pod` is running, you can\
    \ use the following command:\n\n```bash\nPS C:\\Users\\1511 MXTI> kubectl get\
    \ pods --namespace=chapter11\nNAME    READY   STATUS    RESTARTS   AGE\npython\
    \   1/1     Running   1             6m43s\n```\n\nNow we have one pod running\
    \ with one container in it. However, we want to access the application, but at\
    \ this moment it is available only inside the cluster. The other applications\
    \ inside the cluster are already capable of accessing it, but for us, from the\
    \ outside, we will have to create a service for it:\n\n```bash\nPS C:\\Users\\\
    1511 MXTI> .\\kubectl.exe --namespace=chapter11 create service clusterip python\
    \ --tcp=80:8080\nservice/python created\n```\n\nWe just created the `SERVICE`\
    \ with `clusterip` type. It does not expose the `NODE` port, and we need the ingress\
    \ to make the mapping from the outside to the inside of the cluster. Create a\
    \ file called `app.yaml` with the following content:\n\n```yaml\napiVersion: extensions/v1beta1\n\
    kind: Ingress\nmetadata:\nname: python\nnamespace: chapter11\nannotations:\n \
    \ nginx.ingress.kubernetes.io/rewrite-target: /\nspec:\n  backend:\n    serviceName:\
    \ python\n    servicePort: 80\n```\n\nThe `INGRESS` is composed of Nginx server,\
    \ which we call the “Ingress Controller”. It is basically doing a proxy pass of\
    \ the incoming connections from any addresses or names being forwarded to a service,\
    \ called Python.\n\nTo apply the file, you must use the following command:\n\n\
    ```bash\nPS C:\\Users\\1511 MXTI> .\\kubectl.exe apply -f .\\app.yaml\ningress.extensions/python\
    \ created\n```\n\nTo get the minikube IP address, run the following command:\n\
    \n```bash\nPS C:\\Users\\1511 MXTI> .\\minikube ip\n192.168.99.101\n```\n\nIf\
    \ you type this address on your web browser, you must see the following page:\n\
    \n![](images/Figure-11.1.jpg)\n\n**Figure 11.1**\n\nThe application is running!\n\
    \nWe have successfully created everything using the commands and just the Ingress\
    \ using a `YAML` file. However, it is possible to create everything just using\
    \ the files that are the most used way to deploy everything on Kubernetes, because\
    \ we can version the files and run it on the pipeline as we did in the previous\
    \ chapter.\n\nWe can create everything in one file as follows:\n\n```yaml\n---\n\
    apiVersion: apps/v1\nkind: Deployment\nmetadata:\nname: python\nnamespace: chapter11\n\
    labels:\n  app: python\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
    \      app: python\n  template:\n    metadata:\n      labels:\n        app: python\n\
    \    spec:\n      containers:\n      - name: python\n        image: alissonmenezes/python:latest\n\
    \        ports:\n        - containerPort: 8080\n---\napiVersion: v1\nkind: Service\n\
    metadata:\n  labels:\n    app: python\n  name: python\nnamespace: chapter11\n\
    spec:\n  ports:\n  - name: http\n    port: 80\n    protocol: TCP\n    targetPort:\
    \ 8080\n  selector:\n    app: python\n  type: ClusterIP\n---\napiVersion: extensions/v1beta1\n\
    kind: Ingress\nmetadata:\n  labels:\n    app: python\n  name: python\nnamespace:\
    \ chapter11\nannotations:\n  nginx.ingress.kubernetes.io/rewrite-target: /\nspec:\n\
    ```\n"
