    \ `yum`。这个命令对应 Ubuntu 上的 APT，你可以用它从远程仓库安装软件包。\n\n下载完成后，为应用程序安装 Python 模块：\n\n\
    ```\n[root@ce7f74b0304a /]# python3 -m pip install flask\n```\n\n```\nSuccessfully\
