- fmt: "\nElasticsearch, Fluentd, and Kibana; this stack is famous around the Kubernetes\
    \ environments. Often, we can see a `DaemonSet` of `FluentD` running on all the\
    \ nodes retrieving the logs and sending them to an `Elasticsearch` Server which\
    \ will index the logs and parse them, thus, making it easy to search the specific\
    \ events based on your criteria. `Kibana` is the web interface that can be connected\
    \ to an `elasticsearch` in order to visualize the data. Otherwise, we would have\
    \ to make requests to the `elasticsearch` API. `Kibana` also gives us many features,\
    \ like creating graphics based on logs. Thus, we can create visualizations of\
    \ how many errors the application raised in the last two hours. Or, in another\
    \ example, we could count the HTTP status codes and order them based on the number\
    \ of requests. 40 requests returned status 400, 500 requests return status 200,\
    \ 10 requests returned status 500, etc.\n\n# Setup the EFK Stack\n\nWe will have\
    \ the following scenario; we are going to set up the `elastsearch` and `Kibana`\
    \ in a virtual machine using `Vagrant` and the `Fluentd` will run within our `minikube`\
    \ cluster to ship the logs from the running applications to the remote server,\
    \ and we will visualize it in a centralized way.\n\nThe `Vagrant` file is as follows:\n\
    \n```ruby\n# -*- mode: ruby -*-\n# vi: set ft=ruby :\n# All Vagrant configuration\
    \ is done below. The \"2\" in Vagrant.configure\n# configures the configuration\
    \ version (we support older styles for\n# backwards compatibility). Please don't\
    \ change it unless you know what\n# you're doing.\nVagrant.configure(\"2\") do\
    \ |config|\n  config.vm.box = \"ubuntu/bionic64\"\n  config.vm.define \"efk\"\
    \ do |efk|\n    efk.vm.network \"private_network\", ip: \"192.168.99.50\"\n  \
    \  efk.vm.hostname = \"efk\"\n    config.vm.provider \"virtualbox\" do |v|\n \
    \     v.memory = 4096\n    end\n    efk.vm.provision \"shell\", inline: <<-SHELL\n\
    \      apt clean\n      wget -qO - https://artifacts.elastic.co/GPG-KEY-Elasticsearch\
    \ | apt-key add -\n      apt-get install apt-transport-https -y\n      echo \"\
    deb https://artifacts.elastic.co/packages/7.x/apt stable main\" | tee -a /etc/apt/sources.list.d/elastic-7.x.list\n\
    \      apt-get update\n      apt-get install Elasticsearch kibana -y\n      #sed\
    \ -i \"s/#network.host: 192.168.0.1/network.host: 0.0.0.0/g\" /etc/Elasticsearch/Elasticsearch.yml\n\
    \      #sed -i \"s/#discovery.seed_hosts: \\[\\\"host1\\\", \\\"host2\\\"\\]/discovery.seed_hosts:\
    \ \\[\\]/g\" /etc/Elasticsearch/Elasticsearch.yml\n      #sed -i \"s/#server.host:\
    \ \\\"localhost\\\"/server.host: \\\"0.0.0.0\\\"/g\" /etc/kibana/kibana.yml\n\
    \      #/etc/init.d/kibana restart\n      #/etc/init.d/Elasticsearch start\n \
    \   SHELL\n  end\nend\n```\n\nProvision your VM using the following command:\n\
    \n`vagrant up --provision`\n\nWhen the server is ready, we have to change some\
    \ configurations. First, enable the `elasticsearch` to listen to all the addresses\
    \ by the following command:\n\n`sed -i \"s/#network.host: 192.168.0.1/network.host:\
    \ 0.0.0.0/g\" /etc/Elasticsearch/Elasticsearch.yml`\n\nSecond, change the seed\
    \ hosts by the following command:\n\n`sed -i \"s/#discovery.seed_hosts: \\[\\\"\
    host1\\\", \\\"host2\\\"\\]/discovery.seed_hosts: \\[\\]/g\" /etc/Elasticsearch/Elasticsearch.yml`\n\
    \nThird, you must define that it is a single node cluster by the following command:\n\
    \n`echo \"discovery.type: single-node\">> /etc/Elasticsearch/Elasticsearch.yml`\n\
    \nFourth, change the `Kibana` configuration to listen to all the addresses as\
    \ well by the following command:\n\n`sed -i \"s/#server.host: \\\"localhost\\\"\
    /server.host: \\\"0.0.0.0\\\"/g\" /etc/kibana/kibana.yml`\n\nThen, you can restart\
    \ the services by running the following command:\n\n```bash\nroot@efk:~# /etc/init.d/kibana\
    \ restart\nd/Elasticsearch start\nkibana started\nroot@efk:~# /etc/init.d/Elasticsearch\
    \ start\n[….] Starting Elasticsearch (via systemctl): Elasticsearch.service\n\
    ```\n\nIf you did all the steps correctly, you can check the service ports using\
    \ the command `ss –ntpl`:\n\n![](images/Figure-12.1.jpg)\n\n**Figure 12.1**\n\n\
    The `Kibana` is running on port `5601`. Now, you can use the following address\
    \ to check the interface.\n\n`http://192.168.99.50:5601`\n\n![](images/Figure-12.2.jpg)\n\
    \n**Figure 12.2**\n\nThe server takes a while to start. If it takes about 10 minutes,\
    \ do not worry.\n\nAt this moment, we do not have to do anything else in this\
    \ server, so, let's go to the `minikube` and run the `FluentD` to ship the logs.\
    \ After that, we will come back to the `Kibana` server and see the logs.\n\n#\
    \ Running Fluentd\n\nFirst of all, let's setup the `minikube` environment with\
    \ the following command:\n\n```bash\nPS C:\\Users\\1511 MXTI\\Documents\\Blog\\\
    EKF> minikube delete\n* Deleting \"minikube\" in virtualbox …\n* Removed all traces\
    \ of the \"minikube\" cluster.\nPS C:\\Users\\1511 MXTI\\Documents\\Blog\\EKF>\
    \ minikube start\n* minikube v1.11.0 on Microsoft Windows 10 Pro 10.0.19041 Build\
    \ 19041\n* Automatically selected the virtualbox driver\n* Starting control plane\
    \ node minikube in cluster minikube\n* Creating virtualbox VM (CPUs=2, Memory=6000MB,\
    \ Disk=20000MB) …\n* Preparing Kubernetes v1.18.3 on Docker 19.03.8 …\n* Verifying\
    \ Kubernetes components…\n* Enabled addons: default-storageclass, storage-provisioner\n\
    * Done! kubectl is now configured to use \"minikube\"\n```\n\nI deleted my existing\
    \ environment and started a fresh environment to make sure that we have exactly\
    \ the same environment. With the Kubernetes environment running, we will set up\
    \ the `DaemonSet` using the following file:\n\n```yaml\napiVersion: apps/v1\n\
    kind: DaemonSet\nmetadata:\n  name: fluentd\n  namespace: kube-system\nlabels:\n\
    \  k8s-app: fluentd-logging\n  version: v1\nspec:\n  selector:\n    matchLabels:\n\
    \      name: fluentd\n  template:\n    metadata:\n      labels:\n        name:\
    \ fluentd\n        k8s-app: fluentd-logging\n        version: v1\n        kubernetes.io/cluster-service:\
    \ \"true\"\n    spec:\n      containers:\n      - name: fluentd\n        image:\
    \ fluent/fluentd-kubernetes-daemonset:v1-debian-Elasticsearch\n        env:\n\
    \        - name: FLUENT_ELASTICSEARCH_HOST\n          value: \"192.168.99.50\"\
    \n        - name: FLUENT_ELASTICSEARCH_SSL_VERIFY\n          value: \"false\"\n\
    \        - name: FLUENT_ELASTICSEARCH_PORT\n          value: \"9200\"\n      \
    \  - name: FLUENT_ELASTICSEARCH_SCHEME\n          value: \"http\"\n        - name:\
    \ FLUENT_UID\n          value: \"0\"\n        - name: FLUENT_LOGSTASH_FORMAT\n\
    \          value: \"true\"\n        - name: FLUENT_LOGSTASH_PREFIX\n         \
    \ value: \"fluentd\"\n        - name: FLUENT_SYSTEMD_CONF\n          value: \"\
    disable\"\n        resources:\n          limits:\n            memory: 200Mi\n\
    \          requests:\n            cpu: 100m\n            memory: 200Mi\n     \
    \   volumeMounts:\n        - name: varlog\n          mountPath: /var/log\n   \
    \     - name: varlibcontainers\n          mountPath: /var/lib/containers\n   \
    \       readOnly: true\n      volumes:\n      - name: varlog\n        hostPath:\n\
    \          path: /var/log\n      - name: varlibcontainers\n        hostPath:\n\
    \          path: /var/lib/containers\n```\n\n`DaemonSet`: It is a Kubernetes object\
    \ which is responsible to run the same pod on every node. The difference between\
    \ a normal pod and a `DaemonSet` is that a pod is mandatory on every node, if\
    \ you are deploying an application, not necessary you have to run the application\
    \ on all nodes:\n\n```bash\nkubectl apply -f fluentd.yaml\ndaemonset.apps/fluentd\
    \ configured\n```\n\nThe preceding command will run the `DaemonSet` in your cluster.\
    \ To check if it is running, you can run the following command:\n\n```bash\nPS\
    \ C:\\Users\\1511 MXTI\\Documents\\Blog\\EKF> kubectl get daemonset -n kube-system\n\
    NAME       DESIRED   CURRENT   READY   UP-DATE   AVAILABLE   NODE SELECTOR   AGE\n\
    fluentd    1         1         1         0s        1           <none>        \
    \  7m26s\nkube-proxy  1         1         1         0s        1           kubernetes.io/os=linux\
    \  13h\n```\n\nIt is important to check the logs, because starting from now, the\
    \ logs must be sent to the elasticsearch server:\n\n```bash\nPS C:\\Users\\1511\
    \ MXTI\\Documents\\Blog\\EKF> kubectl logs daemonset/fluentd -n kube-system\n\
    ```\n"
  raw: 'Elasticsearch, Fluentd, and Kibana; this stack is famous around the Kubernetes
    environments. Often, we can see a DaemonSet of FluentD running on all the nodes
    retrieving the logs and sending them to an Elasticsearch Server which will index
    the logs and parse them, thus, making it easy to search the specific events based
    on your criteria. Kibana is the web interface that can be connected to an elasticsearch
    in order to visualize the data. Otherwise, we would have to make requests to the
    elasticsearch API. Kibana also gives us many features, like creating graphics
    based on logs. Thus, we can create visualizations of how many errors the application
    raised in the last two hours. Or, in another example, we could count the HTTP
    status codes and order them based on the number of requests. 40 requests returned
    status 400, 500 requests return status 200, 10 requests returned status 500, etc.


    # [Setup the EFK Stack](#toc.xhtml_s98a)


    We will have the following scenario; we are going to set up the elastichsearch
    and Kibana in a virtual machine using Vagrant and the Fluentd will run within
    our minikube cluster to ship the logs from the running applications to the remote
    server, and we will visualize it in a centralized way.


    The Vagrant file is as follows:


    `# -*- mode: ruby -*-`


    `# vi: set ft=ruby :`


    `# All Vagrant configuration is done below. The "2" in Vagrant.configure`


    `# configures the configuration version (we support older styles for`


    `# backwards compatibility). Please don''t change it unless you know what`


    `# you''re doing.`


    `Vagrant.configure("2") do |config|`


    `config.vm.box = "ubuntu/bionic64"`


    `config.vm.define "efk" do |efk|`


    `efk.vm.network "private_network", ip: "192.168.99.50"`


    `efk.vm.hostname = "efk"`


    `config.vm.provider "virtualbox" do |v|`


    `v.memory = 4096`


    `end`


    `efk.vm.provision "shell", inline: <<-SHELL`


    `apt clean`


    `wget -qO - https://artifacts.elastic.co/GPG-KEY-Elasticsearch | apt-key add -`


    `apt-get install apt-transport-https -y`


    `echo "deb https://artifacts.elastic.co/packages/7.x/apt stable main" | tee -a
    /etc/apt/sources.list.d/elastic-7.x.list`


    `apt-get update`


    `apt-get install Elasticsearch kibana -y`


    `#sed -i "s/#network.host: 192.168.0.1/network.host: 0.0.0.0/g" /etc/Elasticsearch/Elasticsearch.yml`


    `#sed -i "s/#discovery.seed_hosts: \[\"host1\", \"host2\"\]/discovery.seed_hosts:
    \[\]/g" /etc/Elasticsearch/Elasticsearch.yml`


    `#sed -i "s/#server.host: \"localhost\"/server.host: \"0.0.0.0\"/g" /etc/kibana/kibana.yml`


    `#/etc/init.d/kibana restart`


    `#/etc/init.d/Elasticsearch start`


    `SHELL`


    `end`


    `end`


    Provision your VM using the following command:


    **`vagrant up --provision`**


    When the server is ready, we have to change some configurations. First, enable
    the elasticsearch to listen to all the addresses by the following command:


    **`sed -i "s/#network.host: 192.168.0.1/network.host: 0.0.0.0/g" /etc/Elasticsearch/Elasticsearch.yml`**


    Second, change the seed hosts by the following command:


    **`sed -i "s/#discovery.seed_hosts: \[\"host1\", \"host2\"\]/discovery.seed_hosts:
    \[\]/g" /etc/Elasticsearch/Elasticsearch.yml`**


    Third, you must define that it is a single node cluster by the following command:


    **`echo "discovery.type: single-node">> /etc/Elasticsearch/Elasticsearch.yml`**


    Fourth, change the Kibana configuration to listen to all the addresses as well
    by the following command:


    **`sed -i "s/#server.host: \"localhost\"/server.host: \"0.0.0.0\"/g" /etc/kibana/kibana.yml`**


    Then, you can restart the services by running the following command:


    `root@efk:~#` **`/etc/init.d/kibanarestart`**


    `d/Elasticsearch start`


    `kibana started`


    `root@efk:~# /etc/init.d/Elasticsearchstart`


    `[….] Starting Elasticsearch (via systemctl): Elasticsearch.service`


    If you did all the steps correctly, you can check the service ports using the
    command `ss –ntpl`:


    ![](images/Figure-12.1.jpg)


    **Figure 12.1**


    The Kibana is running on port `5601.` Now, you can use the following address to
    check the interface.


    `http://192.168.99.50:5601`


    ![](images/Figure-12.2.jpg)


    **Figure 12.2**


    The server takes a while to start. If it takes about 10 minutes, do not worry.


    At this moment, we do not have to do anything else in this server, so, let''s
    go to the minikube and run the FluentD to ship the logs. After that, we will come
    back to the Kibana server and see the logs.


