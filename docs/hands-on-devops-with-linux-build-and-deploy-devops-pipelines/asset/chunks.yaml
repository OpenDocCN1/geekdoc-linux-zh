    # [Conclusion](#toc.xhtml_s93a)


    This chapter introduced to you the basic steps of Kubernetes. It was a very short
    introduction. As I mentioned earlier, it is possible to write an entire book about
    Kubernetes. The goal here is just to deploy an application as an example and see
    how it works in your local environment and on the cloud using GKE.


    I recommend you to read more about Kubernetes and Istio. You will discover amazing
    things, like fine-grain routes, A/B tests, canary deployment, going deep into
    the deployment strategies, and so much more.


    I have a post in my personal blog giving a short introduction to Istio. You can
    translate the page using Google Chrome and see what we are doing.


    **[https://alissonmachado.com.br/istio-e-minikube-teste-a-b/](https://alissonmachado.com.br/istio-e-minikube-teste-a-b/)**


