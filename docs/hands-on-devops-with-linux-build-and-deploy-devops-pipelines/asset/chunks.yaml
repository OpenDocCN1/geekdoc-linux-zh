    These are the most important directories you can find in your Linux system and
    they will be a part of your daily work.


    # Important Files


    Now that you already know the important directories, let''s get inside of them
    and see the files that are important for our system to work.


    One important file is the `/etc/passwd`. This file is responsible to store all
    the Linux users, and we can give a look at its content using the `cat` command:


    ```bash

    alisson@devops:~$ cat /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin

    bin:x:2:2:bin:/bin:/usr/sbin/nologin

    sys:x:3:3:sys:/dev:/usr/sbin/nologin

    sync:x:4:65534:sync:/bin:/bin/sync

    ```


    This was an example of the first 5 lines. Its structure follows the following
    sequence:


    `User – password – user id – group id – comment – home folder - shell`


    The data is separated by a colon (`:`). It is important to know that the Linux
    shell has many useful commands to work with these kinds of files.


    For example, we could use the command `cut` to see just the information we want:


    ```bash

    alisson@devops:~$ cut -f 1,6,7 -d : /etc/passwd

    root:/root:/bin/bash

    daemon:/usr/sbin:/usr/sbin/nologin

    bin:/bin:/usr/sbin/nologin

    sys:/dev:/usr/sbin/nologin

    ```


    Thus, in the example, I printed just the columns 1, 6, 7 which correspond to the
    user, the home folder, and the shell.


    I am not posting the entire output of the command because I want to save some
    space. But, you probably are running this on your own virtual machine. So, if
    you want to show just the first 3 lines of any file, you can use the command `head`.
    By default, this command shows the first 10 lines of a file, but we have the `-n`
    parameter, where we can define as many lines we want to see.


    For example:


    ```bash

    alisson@devops:~$ head -n 3 /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    daemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin

    bin:x:2:2:bin:/bin:/usr/sbin/nologin

    ```


    On Linux, it is also possible to concatenate the commands. If you want to see
    just the first 3 lines and only the columns 1, 6, 7 like we did with the `cut`
    command, we can use the pipe (`|`). This statement has the function of getting
    the output of the last command and sending it to the next command in the pipeline.


    Example:


    ```bash

    alisson@devops:~$ head -n3 /etc/passwd | cut -f 1,6,7 -d :

    root:/root:/bin/bash

    daemon:/usr/sbin:/usr/sbin/nologin

    bin:/bin:/usr/sbin/nologin

    ```


    Therefore, every time that you want to concatenate the commands, you must use
    the pipe (`|`). One interesting point is the second columns of the `/etc/passwd`
    file. I wrote that it is the password, but we can only see an `x`, this character
    represents the encrypted password. The hash can be found in the file `/etc/shadow`:


    ```bash

    alisson@devops:~$ sudo head -n3 /etc/shadow

    [sudo] password for alisson:

    root:*:18113:0:99999:7:::

    daemon:*:18113:0:99999:7:::

    bin:*:18113:0:99999:7:::

    ```


    To see the content of this file, you need to run the command `sudo` before the
    command `head`. The `sudo` command means the substitute users do. In a simple
    way, we are running the command `head` as we were another user. If you do not
    specify the user, by default, the user is root. The password is the same as we
    set in the installation. If you set the same password as me, it’s `devops`.


    To see your user''s password, we can use the command `grep`. This command will
    find the line which corresponds with our criteria of the search.


    Example:


    ```bash

    alisson@devops:~$ sudo grep alisson /etc/shadow

    alisson:$6$aeR.OxEqoVMnyUuq$eYxtbG6V.156mtlsK9QBZcVOjQZBm7NlcKFn5x1y xF4mffuLYd6Wmz2R9V2iKZvuC7fgp96H7.jlQW/o7OenF/:18292:0:99999:7:::

    ```


    Now you can clearly see the password hash in the second column. Of course, we
    cannot decrypt it, but if you want to take a Linux certification, you will need
    to record this file and the structures. However, we can also remove a user''s
    password. You can just edit this file and delete the hash. This way, the user
    will not have a password and he can set a new one in the future.


    Regarding the users, we also have one file on Linux to manage the groups. This
    file is located in `/etc/group`:


    ```bash

    alisson@devops:~$ head -n 3 /etc/group

    root:x:0:

    daemon:x:1:

    bin:x:2:

    ```


    Wait, the input text contains some repetitive and garbled segments at the end.
    I will clean up the structure while maintaining the core information provided
    in the later paragraphs.


    The file follows the following sequence:

    `Group name | password | group id`


    As explained, we can use `grep` to find the group. Another important file is `/etc/fstab`,
    which is used for mount information.

    '
