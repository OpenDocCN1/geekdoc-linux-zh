    \ \"root\"), use \"sudo <command>\".\nSee \"man sudo_root\" for details.\nalisson@devops:~$\n\
    ```\n\n这意味着我们在 Linux Shell 中。现在我们将将其称为 Bash，因为它是命令行解释器。每个操作系统都有自己的命令行解释器，因为它是系统所需的。在旧版本的\
    \ Windows 中，我们有 MS-DOS。现在我们有 PowerShell。在旧版本的 Linux 中，我们有 Shell。现在有些用户正从 Bash\
    \ 迁移到 Z shell。我将在接下来的页面介绍如何更改我们的 `CLI`。\n\n在你的服务器中，最有用的命令叫做 `ls`：\n\n```bash\n\
    alisson@devops:~$ ls\nid_rsa.pub\n```\n\n此命令用于显示 Linux 的文件和目录。它可以配合不同的参数使用。例如，如果我想详细模式显示文件和目录，可以传递参数\
    \ `-l`：\n\n```bash\nalisson@devops:~$ ls -l\ntotal 4\n-rw-rw-r-- 1 alisson alisson\
    \ 398 Jan 31 20:18 id_rsa.pub\nalisson@devops:~$\n```\n\n最后的输出按顺序向我们展示更多信息：\n\n\
    `权限 – 硬链接数 – 用户 – 组 – 大小 – 最后修改日期 – 文件名`\n"
