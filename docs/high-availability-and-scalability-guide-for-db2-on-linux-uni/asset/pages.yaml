  md: 'To set up HADR for the command line environment, complete the following steps:


    +   1. Set the required database configuration parameters


    If archive logging is not already turned on, then update the LOGRETAIN parameter
    using the following command:


    ```

    db2 update database configuration for sample using LOGRETAIN

    recovery

    ```


    Also, the LOGINDEXBUILD parameter, so that index creation, re-creation, or reorganization
    operations are logged, using the following command:


    ```

    db2 update database configuration for sample using LOGINDEXBUILD ON

    ```


    +   2. Back up your database on the primary and move a copy to the standby server
    using the following command:


    ```

    db2 backup database sample to /usr/db2/backup

    ```


    +   3. Restore the database on your standby system.


    In our example, we restore to the SAMPLE database on the POLONIUM server using
    the following command:


    ```

    db2 restore database sample from /usr/db2/backup taken at

    200611114321 replace history file

    ```


    +   4. Configure databases for ACR. This step is optional but highly recommended.
    To configure ACR, update the ALTERNATE SERVER database configuration on both the
    primary and standby servers with the following steps:


    +   a. On the primary server, LEAD in our test case, set the standby server as
    the alternate server using the following command:


    ```

    db2 update alternate server for database sample using hostname

    polonium port 50001

    ```


    +   b. On the standby server, POLONIUM in our test case, set the primary server
    as the alternate server using the following command:


    ```

    db2 update alternate server for database sample using hostname

    lead port 50001

    ```


    +   5. Update the following fields in the services file on the primary system
    LEAD HADR communication:


    +   - Service name: DB2_HADR_1

    - Port number: 55001

    - Service name: DB2_HADR_2

    - Port number: 55002'
