    The ranges specified for each data partition can be generated automatically or
    manually.


    # 13.7.1 Automatically generated ranges


    Automatic generation is a simple method of creating many data partitions quickly
    and easily. This method is appropriate for equal sized ranges based on dates or
    numbers.


    Example 13-8 and Example 13-9 demonstrate how to use the CREATE TABLE statement
    to define and generate automatically the ranges specified for each data partition.


    The statement in Example 13-8 results in 12 data partitions each with 1 key value
    (l_shipdate) >=(''1/1/1992), (l_shipdate) < (''3/1/1992), (l_shipdate) < (''4/1/1992),
    (l_shipdate) < (''5/1/1992), ..., (l_shipdate) < (''12/1/1992), (l_shipdate) <=
    (''12/31/1992).


    Example 13-8 Creating LINEITEM


    ```

    CREATE TABLE lineitem (

    l1_orderkey DECIMAL(10,0) NOT NULL,

    l1_quantity DECIMAL(12,2),

    l1_shipdate DATE,

    l1_year_month INT GENERATED ALWAYS AS (YEAR(l_shipdate) +

    MONTH(l_shipdate))

    PARTITION BY RANGE (l_shipdate)

    (STARTING (''1/1/1992'') ENDING (''12/31/1992'') EVERY MONTH);

    ```


    The starting value of the first data partition is inclusive because the overall
    starting bound (''1/1/1992'') is inclusive (default). Similarly, the ending bound
    of the last data partition is inclusive because the overall ending bound (''12/31/1992'')
    is inclusive (default). The remaining STARTING values are inclusive and the remaining
    ENDING values are all exclusive. Each data partition holds n keys where n is given
    by the EVERY clause. Use the formula (start + every) to find the end of the range
    for each data partition. The last data partition might have fewer keys if the
    EVERY value does not divide evenly into the START and END range.'
  merge: -1
  pgno: 416
- img_proc: true
  md: 'In Example 13-9 there is a statement that results in 10 data partitions each
    with 100 key values (1 < b <= 101, 101 < b <= 201, ..., 901 <= b <= 1000).


    # Example 13-9 Creating a table with 10 data partitions


    ```

    CREATE TABLE t(a INT, b INT)

    PARTITION BY RANGE(b) (STARTING FROM (1)

    EXCLUSIVE ENDING AT (1000) EVERY (100))

    ```


    The starting value of the first data partition (b > 1 and b <= 101) is exclusive
    because the overall starting bound (1) is exclusive. Similarly, the ending bound
    of the last data partition (b > 901 b <= 1000) is exclusive because the overall
    ending bound (1000) is inclusive. The remaining STARTING values are all exclusive
    and the remaining ENDING values are all inclusive. Each data partition holds n
    key values given by the EVERY clause.


    Finally, if both the starting and ending bound of the overall clause are exclusive,
    the starting value of the first data partition is exclusive because the overall
    starting bound (1) is exclusive. The partition is exclusive because the overall
    ending bound (1000) is exclusive. The remaining STARTING values are all exclusive
    and the ENDING values are all inclusive. Each data partition (except the last)
    holds n key values where n is given by the EVERY clause.


    # 13.7.2 Manually generated ranges


    Manual generation creates a new data partition for each range listed in the PARTITION
    BY clause. This form of the syntax allows for greater flexibility when defining
    ranges thereby increasing your data and LOB placement options. Examples 3 and
    4 demonstrate how to use the CREATE TABLE statement to define and generate manually
    the ranges specified for a data partition.'
