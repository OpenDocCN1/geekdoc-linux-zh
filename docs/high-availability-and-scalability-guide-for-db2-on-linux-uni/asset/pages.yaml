    # 1.4 Replication


    Replication solutions have been in use for some time. There are multiple replication
    technologies to suit different environments. In this section we focus on software-based
    replication.


    DB2 Universal Database™ for Linux, UNIX, and Windows provides two different solutions
    that you can use to replicate data from and to relational databases: SQL replication
    and Q replication. In SQL replication, committed source changes are staged in
    relational tables before being replicated to target systems. In Q replication,
    committed source changes are written in messages that are transported through
    WebSphere® MQ message queues to target systems.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'DB2 also provides a solution event publishing for converting committed source
    changes into messages in an XML format and publishing those messages to applications
    such as message brokers.


    # 1.4.1 SQL replication


    SQL replication is integrated in DB2 using IBM WebSphere Information Integration.


    The source system has a capture program that scans the DB2 log files looking for
    records belonging to replicated tables and then places this information in temporary
    storage known as staging tables.


    The records in these staging tables are sent to the target system, where an apply
    program executes them as DB2 SQL operations against the replica database.


    Figure 1-5 shows an overview of SQL replication architecture. Inside the source
    server are set of DB2 relational tables called Capture control tables. Information
    about sources is written to these tables. The Capture program, which runs on the
    source server, uses this information to know what data it is supposed to capture.
    Information about targets goes in the Apply control tables. The Apply program,
    which is also typical on your target server, uses this information to know which
    targets it is supposed to write data.


    ![](img/a97b7826c3cf736045d80f48b5520a20_31_0.png)


    Figure 1-5 Infrastructure for a simple configuration in SQL replication'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Advantages


