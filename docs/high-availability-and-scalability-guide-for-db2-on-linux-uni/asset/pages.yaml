    Click Next.


    +   b. Choose how you would like to handle your archived logs: We would generally
    select DB2 to automatically archive the log files, and then specify a location
    such as /usr/db2/arch (*nix) or C:\db2arch (Windows), Click Next.


    +   c. Choose the number and size of your log files: We accept defaults here,
    but refer you to DB2 9.1 Administration Guide: Planning, SC10-4223, Chapter 5
    for recommendations based on your requirements. Click Next.


    +   d. Specify the location of your log files: We would specify a location such
    as /usr/db2actlog (*nix) or C:\db2actlog (Windows). Click Next.


    +   e. Specify where to store your backup: This is required as part of the conversion
    to archive/linear logging, as the database is placed in backup pending after changing
    critical database configuration parameters, and logging in the new linear format
    from that point in time. We would specify a location such as /usr/db2/backup (*nix)
