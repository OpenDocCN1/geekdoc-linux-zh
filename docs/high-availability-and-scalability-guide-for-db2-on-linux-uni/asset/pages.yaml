    +   c. Each client must connect to the primary instance at least once, so as to
    pickup alternate server information. Also, clients must connect through a TCPIP
    node entry, not through a local node entry. If you wish to connect through a local
    node entry (for example, the client resides on the same node as the database),
    you must create a TCPIP catalog entry that references the local instance (that
    is, a loop back entry)


    +   d. If using Java Database Connectivity (JDBC) type 4 clients, client, reroute

    information will not be picked up from the local directory. Applications'
