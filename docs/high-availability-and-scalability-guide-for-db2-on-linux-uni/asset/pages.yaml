- img_proc: true
  md: '# Network down


    The primary database is continuously polling the network. If the network goes
    down, the primary database will detect the condition as soon as the primary host
    machine operating system detects the condition. If the primary machine and therefore
    the primary database can detect the failure, it will close the connection quickly.
    Closing the connection will cause the primary database to change from Peer state
    to disconnected state, unblocking pending transactions.


    If the primary is unable to report network failure timely, DB2 will rely on HADR_TIMEOUT
    to disconnect. If the primary does not receive any message from the standby for
    HADR_TIMEOUT, it will disconnect. In such scenario, transactions on the primary
    will be blocked while the primary waits on the timeout. In ASYNC mode, when the
    primary sends logs, these could be buffered in the network path and delay the
    blocking of transactions on the primary. As the primary keeps sending more logs,
    it will eventually cause congestion and the transactions will be blocked.


    When there is congestion, the standby cannot receive heartbeat from the primary
    anymore and updates Its heartbeat time and continues to send heartbeat to the
    primary, the standby will not drop connection after HADR_TIMEOUT. On the primary
    side, since the primary is receiving heartbeat from the standby, the primary will
    not drop connection either, after the HADR_TIMEOUT. Since the standby can send
    heartbeat and the primary can receive standby''s heartbeat, the HADR pair will
    stay connected. In the worst case, an unresponsive primary will cause primary
    transactions to be blocked until the primary does not receive any heartbeat or
    message from the standby for HADR_TIMEOUT. If no heartbeat is received by the
    primary from the standby until HADR_TIMEOUT, the HADR state changes to DISCONNECTED.


    When the primary changes to DISCONNECTED, the primary gives up the transfer of
    the log records to the standby database. The primary database continues processing
    transactions even though it cannot transfer logs to the standby database. There
    is a possibility of data loss, if you execute a TAKEOVER BY FORCE command when
    there is a data gap between the primary database and standby database. The primary
    will continue to listen on the HADR TCP/IP port waiting for the standby to come
    online. When the network recovers, the standby database tries to catch up with
    the primary until they return to peer status.


    Figure 6-1 shows what happens when the network is down between the primary and
    secondary.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '![](img/a97b7826c3cf736045d80f48b5520a20_168_0.png)


    Figure 6-1 Behavior of HADR when the primary cannot transfer logs to the standby


    # # Network congestion


    Network congestion can happen when the standby is behind in receiving and processing
    log data from the primary. This can cause the standby''s log receive buffer to
    fill up, thereby preventing the buffer from receiving more log pages. This will
    cause a slowdown on the primary in all modes, including ASYNC mode.


    In SYNC and NEARSYNC, if the primary database flushes its log buffer one more
    time, the data is likely to be buffered in the network pipeline, consisting of
    the primary machine, the network, and the standby database. Because the standby
    database does not have free log buffer (DB2_HADR_BUF_SIZE) to receive it, it cannot
    acknowledge. So primary will be blocked, waiting for the acknowledgement. Congestion
    is not likely to occur for SYNC and NEARSYNC as unless this log data is acknowledged,
    and no more logs will be sent by the blocked primary.


    In ASYNC mode, the primary will continue to send logs until the network pipeline
    fills up. The network pipeline consists of the TCP buffers on the primary machine,
    the TCP buffers on the standby machine, the network path between the primary and
    the standby, and the HADR standby log receive buffer. When the primary cannot
    send any more logs, congestion can occur.


    Large jobs table reorganization can flood the standby and cause congestion as
    the standby database is replaying log records that take a long time to replay.
    The primary load has sharp peaks, they might be absorbed by a larger standby buffer.'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'You can mitigate congestion problem by tuning the TCP/IP network to

    increase TCP/IP network buffering and also increase DB2_HADR_BUF_SIZE

    registry variable to increase the log receive buffer on the standby. But a larger

    buffer would not help if the primary has a sustained log rate higher than the

    by can handle. Snapshot™ or db2pd will report connection status as

    "congested". Congestion is reported by the hadr_connect_status monitor

    element.


    # 6.3.8 Avoiding data loss in an HADR cluster software


    An HADR with HA cluster software implementation automates the HADR

    takeover process. If a network error is detected, the primary database will enter

    t disconnected state and let transactions proceed. This behavior maximizes the

    availability of HADR database. Although the transactions can still be

    committed during the time the database is in a disconnected state, these

    transactions will not reach the standby and only on the primary database.


    If the primary database goes down before the network is recovered, the

    automatic take over process starts. Since the primary database is down, the

    standby will take over by the primary force. The log gaps are not handled and
    the

    log records that were not transferred to the standby database, yet will be lost
    on

    the new primary database. Figure 6-2 shows the behavior of a HADR database

    when the primary database cannot transfer logs to the standby.


    ![](img/a97b7826c3cf736045d80f48b5520a20_169_0.png)


    High Availability and Scalability Guide for DB2 on Linux, UNIX, and Windows'
