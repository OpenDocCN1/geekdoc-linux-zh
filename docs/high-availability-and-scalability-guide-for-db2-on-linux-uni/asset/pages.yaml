  md: '# 13.7 Approaches to defining ranges on partitioned tables


    When you create a partitioned table, you can specify a range for each data partition.
    A partitioned table uses a data organization scheme in which table data is divided
    across multiple data table partitions according to the values of the table partitioning
    key columns. Data from a given table is partitioned into multiple storage objects
    by the specifications provided in the PARTITION BY clause of the CREATE TABLE
    statement. A range is specified by the STARTING FROM ENDING AT values of the PARTITION
    BY clause.


    To completely define the range for each data partition, you must specify sufficient
    boundaries. The following is a list of guidelines to consider when defining ranges
    on a partitioned table:


    +   * The STARTING clause specifies a lower boundary for the data partition range.
    This is mandatory for the lowest data partition range (although you can define
    the boundary as MINVALUE). The lowest data partition range is the partition with
    the specified bound.


    +   * The ENDING (or VALUES) clause specifies a high boundary for the data partition
    range. This is mandatory for the highest data partition range (although you can
    define the boundary as MAXVALUE). The highest data partition range is the partition
    with the specified bound.


    +   * If you do not specify an ENDING clause for a data partition, then the next
    greater data partition must specify a STARTING clause. Likewise, if you do not
    specify a STARTING clause, the previous data partition must specify an ENDING
    clause.


    +   * MINVALUE specifies a value that is smaller than any possible value for the
    column type used. MINVALUE and INCLUSIVE or EXCLUSIVE cannot be specified together.


    +   * MAXVALUE specifies a value that is larger than any possible value for the
    column type used. MAXVALUE and INCLUSIVE or EXCLUSIVE cannot be specified together.


    +   * INCLUSIVE indicates that all values equal to the specified value are to
    be included in the data partition containing this boundary.


    +   * EXCLUSIVE indicates that all values equal to the specified value are *not*
    included in the data partition containing this boundary.


    +   * The NULL clause specifies whether null values are to sorted high or low
    when considering data partition placement. By default, null values are sorted
    high. Null values in the table partitioning key columns are treated as positive
    infinity, and are placed in a range ending at MAXVALUE. If no such data partition
    is defined, null values are considered to be out-of-range values.'
  merge: -1
