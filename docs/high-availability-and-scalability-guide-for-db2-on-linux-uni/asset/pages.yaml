    # Part 1


    # DB2 High availability options


    In this part of the book, we introduce the various high availability options that
    DB2 offers. We focus on the DB2 High Availability and Disaster Recovery (HADR)
    feature. We provide a detailed description of HADR, including setup and configuration,
    administration and monitoring, considerations, and best practices.


    We describe the clustering software HACMP, TSA, and Microsoft Windows Clusters,
    explaining how to set up these product with DB2, and how to use them to automate
