  md: 'For partitioned tables only, you can override the index location by using the
    IN clause on the CREATE INDEX statement, which allows you to specify a table space
    for the index. This approach allows you to place different indexes belonging to
    a partitioned table in different table spaces as required.


    You can specify an index table space for a partitioned table in the CREATE ...IN
    `<table>` is the name of an arbitrary table space in the database. The only restriction
    is that the table space must be of the same type as the data table space (that
    is SMS or DMS).


    When you create a partitioned table without specifying where to place its non-partitioned
    indexes, and you create an index using the CREATE INDEX statement that does not
    specify a specific table space, the index is created in the table space of the
    first attached or visible data partition. Each of the following three possible
    cases is evaluated in order to determine where the index is created. The evaluation
    stops when there is a match to one of the:


    +   Case 1, when an index table space is specified in CREATE INDEX ... IN `<table>`
    statement, the table space specified in `<table1>` is used for this index.


    +   Case 2, when an index table space is specified in the CREATE TABLE .. INDEX
    IN `<table>2>` statement, the table space specified in `<table2>` is used for
    this index.


    +   Case 3, when no table space is specified, use the table space used by the
    first attached or visible data partition.


    Where the index is created depends on what is done during the CREATE TABLE statement.
    For non-partitioned tables, if you do not specify any INDEX IN clause, the database
    fills it for you and it is the same as your data table space. For partitioned
    tables, if you leave it blank, it remains as blank, and case 3 applies.


    Example 13-6 assumes the existence of a partitioned table sales (a, b, c), and
    creates a unique index "a_idx" in the table space "ts1".


    Example 13-6 Creating a unique index


    ```

    CREATE UNIQUE INDEX a_idx ON sales (a) IN ts1

    ```


    Example 13-7 assumes the existence of a partitioned table sales (a, b, c), and
    creates an index "b_idx" in the table space "ts2".


    Example 13-7 Creating index in different table space


    ```

    CREATE INDEX b_idx ON sales (b) IN ts2

    ```'
