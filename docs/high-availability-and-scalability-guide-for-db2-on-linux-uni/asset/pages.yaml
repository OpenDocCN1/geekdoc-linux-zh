    # 9.7.3 Creating a highly available IP address for the resource


    DB2 clients access the DB2 server via TCP/IP. The IP address, which the DB2 client
    used to communicate with the DB2 server, also has to be included in the Window
    Cluster resource group. In the event of a machine failure, the other node will
    take over the IP address, and clients will be able to attempt a reconnect.'
