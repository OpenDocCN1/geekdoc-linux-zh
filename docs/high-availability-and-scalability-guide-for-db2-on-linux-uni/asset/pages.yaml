  md: 'Attention: Since the DB2 TSA scripts for HADR require distinct names for the
    primary and standby instances, we recommend that absolute container path names
    do not contain the instance name as part of the path, as that increases the possibilities
    of error in managing database storage in a HADR environment.


    For example, use ALTER TABLES SPACE1 ADD

    (FILE ''/data/harddb/tspace/cont2'' 2000) where the path

    /data/harddb/tspace1 must exist on both primary and standby nodes.

    Avoid using ALTER TABLES SPACE1 ADD

    (FILE ''/misc/homep/db2inst/cont2'' 2000) where the path

    /misc/homep/db2inst should be on both primary and standby.

    Relative path names can be used as usual, for example,

    ALTER TABLES SPACE1 ADD (FILE ''cont2'' 2000).


    +   3. For HADR to work, you must change the database''s (hadrb) default circular
    logging by issuing the following command:

    (P) % db2 update cfg for hadrb LOGRETAIN ON


    +   4. We must create a backup copy of the database (hadrb) that will be restored
    on the standby instance, and act as the standby database of the HADR pair. The
    backup image will be written to the instance owner''s home directory, for example
    /misc/homep/db2inst

    (P) % db2 backup database hadrb


    +   5. Transfer the backup image of the primary database (hadrb) to the standby
    instance owner''s home directory (for example, /misc/homes/db2insts). Here is
    an example of that that uses secure copy (scp):

    (P) % scp /misc/homep/db2inst/<backup_image_name> \

    db2insts@hadr02

    Where <backup_image_name> is the name of the backup file.


    +   6. As standby instance owner (db2insts), create the standby database on the
    standby node (hadr02) as follows:

    (S) % db2 restore database hadrb replace history file


    +   7. Allow TCIP communication to both the primary and standby instance (for
    example, db2inst and db2insts respectively). Note that DB2_db2inst 60000/tcp should
    be in the /etc/services file on the primary node (hadr01), and DB2_db2insts 60000/tcp
    should be in the /etc/services file on the standby node (hadr02) before issuing
    the following commands:

    (P) %S db2set DB2COMM~tcpip

    (P) % db2 update dbm cfg using SVCENAME DB2_db2inst

    (S) % db2 update dbm cfg using SVCENAME DB2_db2insts'
