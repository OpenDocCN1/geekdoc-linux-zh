- img_proc: true
  md: "# 3.1 Requirements for setting up HADR\n\nBefore you start your setup of HADR,\
    \ you must first know the requirements for setup. As part of this book, we describe\
    \ the basic outline of what you need to get started (for more details, refer to\
    \ DB2 9.1 Data Recovery and High Availability Guide and Reference, SC10-4228).\
    \ Along with the requirements, we have added our recommendations.\n\n# Requirements\n\
    \nSetting up an HADR includes the following requirements:\n\n+   - HADR is a DB2\
    \ optional licensing feature. One license is included in the Enterprise Server\
    \ Edition (ESE).\n\n+   - The operating system on the primary and standby databases\
    \ should be the same version, including the patches. For a short time, during\
    \ upgrades, they can be different.\n\n+   - A TCP/IP interface must be available\
    \ between the HADR primary and the standby.\n\n+   - The DB2 version and level\
    \ must be the same on both the primary and the standby systems. For a short time,\
    \ during upgrades, they can be different.\n\n+   - The DB2 software for both the\
    \ primary and the standby database must have the same bit size (32-bit or 64-bit).\n\
    \n+   - Buffer pools on the primary and the standby should be the same.\n\n+ \
    \  - The primary and standby databases must have the same database name. This\
    \ means they must be in different instances.\n\n+   - Table spaces must be identical\
    \ on the primary and standby databases including:\n  - Table space size\n  - Table\
    \ space path\n  - Container size\n  - Container size\n  - Container file type\n\
    \n+   - The amount of space allocated for log files should also be the same on\
    \ both the primary and standby databases.\n\n# Highly recommended\n\nThese are\
    \ some of the highly recommended parameters to set up an HADR:\n\n+   - Use identical\
    \ host computers for the HADR primary and standby databases. That is, they should\
    \ be from the same vendor and have the same architecture."
  merge: -1
  pgno: 59
- img_proc: true
  md: '+   - Use a high-speed, high-capacity network for the TCP/IP interface.


    +   - Ensure that the primary and standby databases have equal amounts of memory.


    +   - Have identical database (DB) and database management (DBM) configuration
    parameters.


    # 3.2 Setup and configuration


    Here we perform the steps to set up HADR on an existing installation of DB2. Our
    Lab example uses 32-bit DB2 9 for SuSE Linux on Intel® (kernel 2.6). However,
    these steps are applicable to all candidate environments.


    # 3.2.1 Preparing the environment


    In order to prepare a real world pre-change environment to set up HADR, there
    are a few things you can plan for, which will allow you to be ready well beforehand.
    Unless you are currently still using linear logging, the only downtime required
    for setting up HADR is for updating database configuration parameters. This can
    be avoided by schedule the work in a regular maintenance window. There should
    be no pressure to minimize your change window, other than a recommendation to
    avoid periods of heavy logging if you want to avoid a long wait for the standby
    to catch up before reaching the Peer state.


    If you are still using linear logging in your real world environment, you might
    want to set aside a separate change window before commencing HADR to plan for
    the changeover to linear logging, and all the associated considerations for log
    archival, overflow, log file size, and retry on failure. If you are testing HADR
    setup on a sandbox environment, this is only a minor consideration, and no separate
    planning is required.


    As basic components for this Lab, you require two DB2 instances of the same FixPak
    level. You can expect to see something like the following text in a pop-up message
    if your instances do not match:


    > The selected standby system is not at the same DB2 version as the primary system.
    HADR requires identical DB2 version on the primary and standby systems. MYSERVER
    - DB2 - DB2Version(8,2,6) - LEAD - DB2_LEAD (db2Inst1) - DB2Version(9,1,0)


    HADR will work even if both instances are located on the same server, but a real-world
    environment will have separate servers, as we have used in our example.'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'Ascertain whether you will use the GUI HADR Setup wizard or the DB2

    Command Line Processor (CLP) to configure HADR. The GUI wizard is perfect

    for introducing people who are new to the concept of HADR, but it has all the

    complexity and high network bandwidth overheads of a GUI. Ensure that you can

    get a fast and reliable display of the DB2 GUI interface. This is even more

    important if you are intending to use an X11 emulator for remote setup of

    Linux/UNIX system.


    The DB2 CLP environment is suited for experienced administrators or for

    repeated configurations on multiple HADR server-pairs. It is also suitable for

    environments where it is impractical to get a GUI interface working, whether

    locally or remotely, such as AIX with telnet-only access, or systems with

    Java™, or systems with limited administrative network bandwidth.


    If you work in a high-security environment where people performing DB2 installs

    and maintenance are not given sesu/sudo or Windows Administrator/

    authority other than in a special window, take the necessary steps to

    request that authority.


    If you are running HADR setup from the GUI wizard as the DB2 instance ID for

    example, this specifically requires that the DB2 instance ID has the authority
    to

    update the /etc/services files (%SystemRoot%/system32/drivers/etc/services on

    Windows), unless these parts have already been registered. You might also have

    to manually update the /etc/hosts file if you do not have a reliable Domain Name

    System (DNS) in place, but still want to use host names rather than IP

    addresses.


    The two servers you would use in a real world implementation must be

    connected by a very reliable TCP/IP connection. They must preferably have no

    firewall between them, or at least with port 523 for DB2 Administration Server,

    t main port for each DB2 instance, and the two ports you will set aside fornHADR
    communication must be left open.


    Depending on your environment, and your choice of HADR SYNCMODE, you

    might be working with physically separate servers:


    +   - Over an intranet WAN (recommend ASYNC or NEARSYNC; more for

    disaster recovery functionality as opposed to a strictly high availability

    implementation)


    +   - On a LAN (recommend NEARSYNC)


    +   - On servers sitting physically next to each other in the same rack (recommend

    SYNC)


    Our Lab example uses the latter configuration.'
  merge: -1
