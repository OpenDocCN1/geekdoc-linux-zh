  md: '# 13.8 Restrictions


    We can identify both table level restrictions and statement level restrictions
    when using data partitions.


    +   Table level restrictions:

    Tables created using the automatically generated form of the syntax (containing
    the EVERY clause) are constrained to use a numeric or date type in the table partitioning
    key.


    +   Statement level restrictions:

    At the SQL statement level, we can identify the following restrictions:

    - MINVALUE and MAXVALUE are not supported in the automatically generated form
    of the syntax.

    - Ranges are ascending.

    - Only one column can be specified in the automatically generated form of the
    syntax.

    - The increment in the EVERY clause must be greater than zero.

    - The ENDING value must be greater than or equal to the STARTING value.'
  merge: -1
