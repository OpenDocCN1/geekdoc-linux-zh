    # Basic network setup


    Make sure that three nodes (hadr01, hadr02, and hadr03) are able to communicate
    with each other through TCP/IP protocol.


    To set up the network, perform the following steps:


    +   1. Set up the network using static IP or DHCP. In our example, we use static
    IP with a subnet mask of 255.255.255.0 for each node.

    2. If you choose to use IP addresses, then add the IP addresses to the hostname
    mapping information in /etc/hosts file on each node (P), (S) and (H). Following
    is sample content of the /etc/hosts file:

    nOn (P): 92.26.95 hadr01

    On (S): 92.26.96 hadr02

    On (C): 92.26.94 hadr03

    Adding IP address to hostname mappings to the systems'' DNS servers as a single
    point of failure. Should DNS fail, the cluster systems can still resolve addresses
    of the other machines via the hosts file.

    Note that adding this information on the client is not recommended because of
    the maintenance overhead of updating all clients'' hosts files, should the mappings
    change.


    +   3. Test that you can ping from each node to all other nodes successfully by
    using the following commands:

    (P) (S) (H) # ping hadr01

    (P) (S) (H) # ping hadr02

    (P) (S) (H) # ping hadr03


