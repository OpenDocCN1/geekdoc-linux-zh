- img_proc: true
  md: '# DB2 and HACMP


    In this chapter we explain how to integrate DB2 in a High Availability Cluster
    Multi-Processing (HACMP) environment. We provide the basic management concepts
    with recommendations and considerations to reduce the time consumed for failover.


    We cover the following topics:


    +   - Overview

    - How DB2 works with HACMP

    - Planning an HACMP cluster

    - Setting up an HACMP cluster

    - Considerations for the db2nodes.cfg file

    - Tuning tips for quick failover'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# 8.1 Overview


    HACMP for AIX provides a highly available computing environment. HACMP facilitates
    the automatic switching of users, applications, and data from one system to another
    in the cluster after a hardware or software failure. The primary reason to create
    HACMP clusters is to provide a highly available environment for mission-critical
    applications. In an HACMP cluster, ensure the availability of these applications,
    the applications are placed under HACMP control. HACMP ensures that the applications
    remain available to client processes even if a component fails. To ensure availability
    in case of a component failure, the HACMP software moves the application along
    with resources to another node in the cluster.


    Here we list some common HACMP terms:


    +   - Topology:

    nThe layout of physical components and connections defined in HACMP.


    +   - Cluster:

    nThe group of nodes that work together closely for the purpose of enhancing availability
    of services.


    +   - Node:

    Each server within the cluster definition. A Service (or Primary) node is designated
    as active to provide service to applications. A Standby node sits ready to take
    over if the service node fails.


    +   - Resource:

    A resource is an object that is protected and controlled by HACMP. It may include
    the IP address to which clients access, file systems, or raw devices on shared
    volume groups, and the start and stop scripts control applications.


    +   - Resource group:

    This is a group of all the resources that need to be failed over to the other.
    These include, but are not limited to,

    - The shared disks as defined in the volume groups. Raw devices or file systems
    are defined on them.

    - The IP address (Service Address) which the clients connect to.

    - The applications to be started to provide services. DB2 instance start and stop
    scripts are included in this definition.


    +   - Service address:

    The IP address that provides services to clients. The service IP address is included
    in the resource group.'
  merge: -1
  pgno: 201
- img_proc: true
  md: '+   Shared disk:

    Shared disk is storage devices and volume groups connected to multiple nodes.
    Raw devices and file systems required to provide services are placed on them.
    From the perspective of DB2 in a non HDRF implementation of HACMP, this would
    include the database directory, space containers, database logs, and so on.


    +   Application server:

    The application server is simply a set of scripts to start and stop the applications
    running on HACMP node. One is an application server start script that starts up
    the applications which are a prerequisite to provision of client services. The
    other is an application server stop script that stops applications before releasing
    resource groups. From the perspective of DB2, this would include scripts to start
    up and stop the database instance.


    While there is only one main script to provide stop and start functionality for
    all applications and services, this work can easily be made modular by splitting
    the tasks into many subscriptions which are called from the main script. instance,
    with appropriate logic in the main calling script, subscriptions can be called
    in a specific order according to file name, and can be dynamically added or removed
    from a subdirectory without changing the main calling script.


    For more information about term terminology, refer to AI HACMP v5.4 Master Glossary,
    SC23-4867-08.


    # 8.2 How DB2 works with HACMP


    In this section, we focus on the HACMP cluster created on shared disks. High availability
    is enabled by moving these disk resources (changing node has control over them)
    and restarting database instance on a standby node when the service node has an
    outage. We call this classic type of a shared disk cluster. Here we explain how
    DB2 works in a shared disk cluster controlled by HACMP with an example of a simple
    partitioned instance.


    Figure 8-1 illustrates HACMP topology and related DB2 database components. HACMP
    manages the group of resources required to provide a service, including shared
    disks where database components reside, the IP address for client service, and
    the application server handling the starting and stopping of the applications
    (including DB2 database instance).'
  merge: -1
  pgno: 202
- img_proc: true
  md: '![](img/a97b7826c3cf736045d80f48b5520a20_203_0.png)


    HACMP continuously sends the heartbeats between the nodes in the cluster to identify
    if and when one is down. HACMP handles resource group takeover from one system
    to the other as needed after a failure or fallback once the failed node is repaired.
    In a DB2 single-partitioned environment, the cluster takes the following actions:


    +   * Failover (unplanned takeover):

    If the service node fails, the HACMP standby node detects the service node outage.
    When the keepalive packets from all network routes are not received from the other
    node, the standby node starts to take over the resource group. This means the
    standby node acquires the shared storage devices and the volume group where database
    components are created, and the service IP address through which clients communicate
    with the server. Once the resources are taken over, the start script defined in
    the application server is issued, which starts the DB2 instance along with other
    critical services and applications. Figure 8-2 shows how the resource group has
    been moved to a standby node during failover.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '![](img/a97b7826c3cf736045d80f48b5520a20_204_0.png)


    Figure 8-2 Failover (unplanned takeover)


    +   - **Switch over (planned takeover for maintenance):**


    You can switch over the resource group intentionally to the standby node for the
    purpose of machine maintenance. This is done by performing two HACMP management
    operations:


    +   - Stop Failover in takeover mode on service node.


    The application server Stop script on the node that needs to release the resource
    group is invoked. The Stop script gracefully stops all the applications and processes
    which access the shared disk.


    +   - Move the resource group from the service node to the standby node.


    The HACMP process is still running on both nodes. HACMP releases all resources
    including shared disks and any service IP address related to the resource group.
    After released by the service node, the resource group is acquired on the standby
    node’s side.'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'Figure 8-3 illustrates how the resource group moves during switch over.


    ![](img/a97b7826c3cf736045d80f48b5520a20_205_0.png)


    # 8.3 Planning the HACMP cluster


    When you plan the HACMP cluster, you can choose the configurations that fit your
    system environment:


    +   Active/standby:


    The typical configuration is active/standby configuration. In this configuration
    one node is active and the other is on standby. One resource group is shared between
    the nodes. This configuration is very simple and easy to manage but one node is
    not utilized for service.


    +   Active/active:


    The active/active is also referred to as mutual takeover. In an active/active
    configuration, a database is usually running under each node. Figure 8-4 illustrates
    the mutual takeover configuration. Database_A is running on node_A and database_B
    is running on node_B. The resource group for database_A is taken over by node_B.
    Both database_A and database_B are then running on one node: node_B. If node_B
    crashes, the same operation happens, just in the opposite direction.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '![](img/a97b7826c3cf736045d80f48b5520a20_206_0.png)


    Figure 8-4 Mutual takeover


    This configuration is called active/active since each node has its own database
    running and both are active at the same time. In the meantime, both play the standby
    role for the other one and can takeover each other''s resources. This is why this
    configuration is also called a mutual takeover configuration. With this configuration,
    you can exploit both machine resources for services, but this is more complicated
    compared to active/standby.


    For this configuration, you need to plan carefully so that each node has enough
    machine resources (CPU or physical memory) to carry two databases while running.
    Let us say you have 1GB physical memory on each node and have allocated 600MB
    for a DB2 buffer pool in each database. After node_A fails, database_A is moved
    to node_B. Total memory requirement exceeds node_B. What happens next is a huge
    page out to paging space which sometimes causes the system to hang, and at the
    very least impacts performance to a degree where no work is possible.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '+   - Other variations:


    There are some variations of cluster configurations for more than three nodes
    in a cluster. See Figure 8-5.


    ![](img/a97b7826c3cf736045d80f48b5520a20_207_0.png)


    For more details about the DB2 highly available data store, refer to the IBM white
    paper "DB2 Universal Database and the Highly Available Data Store" at:


    http://www.ibm.com/developerworks/db2/library/techarticle/0310melnyk/0310melnyk.html


    # 8.4 Setting up HACMP


    Setting up HACMP usually requires the following steps:


    +   1. Define the cluster and add nodes to the cluster.


    +   2. Configure the HACMP network and decide which method is be used for IP address
    takeover.


    +   3. Configure the communication interface and devices. A heart-beating disk
    can be used as the heart beat device. To configure the heart-beating disk, the
    shared disk should be in an enhanced concurrent volume group.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '4. Configure the high availability service IP.


    5. Configure the application server.


    It is often useful to place a simple test script (dummy scripts) for the corresponding
    start and stop script entry to test the basic functions of HACMP. After verifying
    that the HACMP environment functions properly, modify the start and stop script
    to work.


    6. Configure the High Availability (HA) resource group.


    This will associate the HA service IP, shared volume groups and files, the application
    server and all the resources required by the application into one resource group.
    In case a node failure happens, HACMP will move the resource group running on
    the failed node to the surviving node in the cluster.


    7. Verify and synchronize HACMP configuration.


    After configuring HACMP, you must verify and synchronize the topology and resource
    group using the facility provided by HACMP (for example, via SMIT command panels).
    Every time the HACMP configuration is changed, you must re-synchronize the cluster
    from the node where the change has been made.


    After the verification and synchronization is successful, you may start the HACMP
    service.


    # 8.4.1 HACMP cluster setup planning


    Before you set up an HACMP environment, you need to plan the cluster environment.
    Consider the following list of items:


    +   - Physical nodes

    - Network

    - Application back end/services software (for example, DB2)

    - HACMP configuration

    - Application server start/stop scripts


    Next, we examine the planning of these items briefly in a sample environment specific
    to a disk sharing configuration. Detailed information and instructions for each
    item can be found in the links provided in 8.4.2, "HACMP configuration" on page
    193.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# Sample environment


    Figure 8-6 shows the sample configuration of an active/standby HACMP cluster configuration,
    with a normal DB2 instance in a shared disk configuration.


    ![](img/a97b7826c3cf736045d80f48b5520a20_209_0.png)


    Figure 8-6 HACMP disk shared cluster


    Here is the planning for this sample environment:


    +   * Physical node configuration:

    * Two physical nodes named Node1 and Node2 are defined in the cluster:

    - Node1 is designated as the *service* node normally providing service for clients.
    A single partitioned DB2 instance is running on this node.

    - Node2 is the *standby* node which normally stands for any service node outage.
    No DB2 instance runs on the standby node. The role of both nodes changes in response
    to system failover, or to planned takeover issued by administrators.

    * The network configuration is set up as follows:

    - Two ethernet network interfaces on each node are provided for client connectivity.
    These are both under the control of HACMP. The service address for clients is
    added on one of these network interfaces.

    - One Serial (RS-232C) network is configured for HACMP keepalive. A serial network
    (non TCP/IP network) is recommended, as it makes HACMP failure detection more
    reliable.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '+   - DB2 configuration:


    The DB2 product libraries are installed on the local disk of each server. A single
    partitioned instance named db2inst and its database named SAMPLE are created on
    a shared disk. If table spaces or logs are placed in different devices within
    the shared disk, those devices would all have to be included in a single resource
    group.


    +   - HACMP configuration:


    +   - A resource group named shared_rg is configured in the cluster, which has
    a service IP address, application server, and file systems on a shared disk as
    resources.


    +   - A service address is defined in the resource group. Each DB2 client has
    the entry for this service address in its catalog node directory and connects
    to the Service node through this IP address.


    +   - An application server is also defined in resource group. The application
    server start simply starts up database instance and restarts the database. The
    application server stop stops instances.


    # 8.4.2 HACMP configuration


    In the section, we briefly discussed the planning stage prior to HACMP implementation.
    In this section we introduce an outline of actually setting up HACMP in a shared
    disk cluster configuration. For more details and a step-by-step guide to set up
    HACMP and DB2, refer to the following documents:


    +   - IBM DB2 Universal Database Edition for AIX and HACMP/ES ftp://ftp.software.ibm.com/software/data/paps/papers/db2exe-aihacmp.pdf


    +   - DB2 UDB V8.1 ESE and high availability on AIX with HACMP 4.4.1: A mutual
    scenario http://www.ibm.com/developerworks/db2/library/techarticle/dm-0407nikoloulou/


    # Checking the network connection


    Before configuring HACMP, the network must be configured properly. The following
    steps show how to check network configurations for the cluster.


    +   1. Check that IP addresses are configured on network interfaces on both nodes.


    +   2. Check that the /etc/hosts file has all entries of IP addresses and their
    labels are used by HACMP.


    +   3. Verify that the name resolution is working well using the host command.
    If something is wrong, check and modify the /etc/hosts file.'
  merge: -1
  pgno: 210
