  md: 'HACMP software will detect when the active node is down and do the IP takeover
    as well as issue the HDR takeover command to make the standby as the new primary
    server. In this case the HACMP service IP address is configured as 9.43.86.111.


    To activate client reroute, you need to update the alternate server for database
    SAMPLE at KAGA using the service IP as the host name as:


    ```

    db2 update alternate server for database using hostname

    9.43.86.111 port 50030

    ```


    To enable an alternate server for the standby server ATLANTIC which can fail back
    to primary server at KANAGA port 50030, you need to run the following command
    on host ATLANTIC. Again, the service IP is used as the host name.


    ```

    db2 update alternate server for database using hostname

    9.43.86.111 port 50030

    ```


    After failback to old primary server, the old primary server (KANAGA) should be
    reintegrated into the HADR pair.


    At the client machine, the database SAMPLE is cataloged at service IP address
    9.43.86.111 at port 50030.


    In this HDR with HACMP environment, service IP address (9.43.86.111) was used
    as the alternate server on both the primary and the standby servers. The service
    IP address (9.43.86.111) was also used as the host name when cataloging the database
    SAMPLE at the client. If the primary database server at KANAGA goes down, DB2
    will keep trying to establish the connection to the alternate server location
    (host 9.43.86.111 with port 50030). Assuming that HACMP has successfully done
    the IP takeover and moved the resource group to ATLANTIC and there is no communication
    error on the connection to the alternate server, the application can then continue
    to run subsequent statements or retry the failed transactions.


    Initially the service owner is KANAGA. Once the HACMP detects that the primary
    node KANAGA is down, it performs takeover and the standby node ATLANTIC owns the
    resource. DB2 continues to connect to the service IP at alternate server location
    (host 9.43.86.111 with port 50030). Assuming that HACMP has successfully done
    the IP takeover and moved the resource group to ATLANTIC and there is no communication
    error on the connection to the alternate server, the application can then continue
    to run subsequent statements or retry the failed transactions.


    In an HACMP/HADR cluster, we could also have configured the alternate servers
    similar to the “Example 2: Involving an HADR database” on page 127. This is another
    option to configure the alternate servers in a HACMP/HADR cluster.'
