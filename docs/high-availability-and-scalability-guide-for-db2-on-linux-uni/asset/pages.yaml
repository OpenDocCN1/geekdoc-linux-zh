    # 4.3.3 After an HADR disconnect or server failure


    Here is an issue and possible fixes encountered after HADR is disconnected or
    a server failure.


    +   Symptom:


    As an example, let us say an operating system fix is carried out, and the server
    gets recycles without so much as a courtesy e-mail to DB2 support about it. As
    a result, HADR becomes disconnected, and attempts to restart it continually fails.


    +   Fix:


    In this case, the case will most likely be mismatching or lost log records on
    the standby, such that it cannot reintegrate successfully with the primary. You
    can find this out by just looking at the output in the db2diag.log file for the
    times you attempt to start HADR on either the primary or the standby. The error
    messages for this are clear. Subsequent corrective action is straightforward.


    You have no choice but to re-establish HADR by backing up the primary, transferring
    it to the standby, and restoring it there. Instructions for this are fully set
    out in 3.4.5, “Re-establishing HADR after failure” on page 86.'
