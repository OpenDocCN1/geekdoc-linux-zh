    # # 3.3.2 Planned takeover


    Planned takeover is also referred to as switching roles or role exchange. For
    example, issue the TAKEOVER command when you want to switch roles of the databases.
    For example, during an upgrade you switch roles, making the standby the primary.
    Remember to re-route your clients manually or by using the ACR after you have
    issued the TAKEOVER command.


    Switching roles is only done from standby when the databases are in the Peer state.
    The TAKEOVER command fails if the databases are in any other state.


    The takeover procedure is simply issuing the TAKEOVER command.


    For example, issue the takeover command on the standby database using the following
    command:


    ```

    `db2 takeover hadr on database sample`

    ```


    The details for the TAKEOVER HADR command are found in the DB2 9.1 Command Reference,
    SC10-4226.'
