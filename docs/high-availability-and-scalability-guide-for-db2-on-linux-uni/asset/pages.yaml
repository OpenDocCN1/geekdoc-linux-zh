  md: '# Table partitioning


    In this chapter we discuss a new feature of large database management: table partitioning,
    introduced in DB2 9. Table partitioning allows database administrators (DBAs)
    to divide table data into partitions and store it in one or multiple table spaces.
    It also provides easier management, improved performance, and greater scalability
    for large databases.


    We introduce the following topics:


    +   - Concepts of partitions

    - Performance impact of table partitioning

    - How to create and manipulate partitioned tables

    - How to use this new feature, with examples'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# 13.1 Introduction


    Table partitioning feature is a table organization scheme in which table data
    is divided into partitions according to the values in one or more table partition
    columns of the table. Each data partition is stored separately in a storage object
    called data partition or range. These storage objects can be in different table
    spaces, in the same table space, or a combination of both. The decisions on where
    to place the storage objects and the data range that each storage object will
    contain are made at the time of creating the table, or by altering the table using
    the PARTITION BY clause.


    DB2 supports data partitions or data ranges based on a variety of attributes.
    A commonly used partitioning scheme is the data, by which you can group data into
    partitions by year or month. You can also use numeric attributes for partitioning.
    For instance, records with IDs from 1 to 1million are stored in one data partition,
    IDs from 1million to 2 million are stored in another data partition, and so on.
    Another example is that you can have records for customers with names starting
    from A-C in one data partition, D-M in the second data partition, N-Q in third
    partition, and R-Z in the last partition.


    Data partition names or numbers are useful for data partition operations. Although
    you have the option to reference a data partition by its name or number, they
    can be completely transparent to applications. That is, applications can access
    data by specifying the column and table names only, and do not have to worry about
    which data partition(s) data resides in.


    A partitioned table simplifies the rolling in and rolling out of table data, and
    can contain vastly more data as compared to an ordinary table. You can create
    a partitioned table with a maximum of 32767 data partitions. Data partitions can
    be added to, attached to, and detached from a partitioned table, and you can store
    multiple data partition ranges from a table in one table space. You can use the
    ALTER ... ATTACH statement to incorporate (roll-in) an existing table into a partitioned
    table. The roll-out operation can be accomplished with the ALTER TABLE ... DETACH
    statement.


    Using partitions can also increase query performance by scanning only the relevant
    table partitions instead of the entire table, to get a consolidated result. The
    SQL engine can skip partitions during data read if a partition does not contain
    the relevant information to resolve the query.'
  merge: -1
  pgno: 401
- img_proc: true
  md: 'Table data is partitioned as specified in the PARTITION clause of the CREATE
    TABLE statement. The columns used in this definition are referred to as partitioning
    key columns. This organization scheme can be used in isolation or in combination
    with other organization schemes. By combining the DISTRIBUTE BY and PARTITION
    BY clauses of the CREATE TABLE statement, data can be spread across database partitions
    spanning multiple table spaces. The DB2 organization schemes include:


    +   * DISTRIBUTE BY HASH

    * PARTITION BY RANGE

    * ORGANIZE BY DIMENSIONS


    Partitioned hierarchical or temporary tables, range-clustered tables, and partitioned
    views are not supported in DB2 V9.1. Also, the following column types are not
    supported for use in partitioned tables:


    +   * XML

    * DATALINK


    The following columns cannot be used as the partitioning key for a partitioned
    table:


    +   * Long Varchar

    * Long Vargraphic

    * Binary Large Object (BLOB)

    * Character Large Object (CLOB)

    * Double-byte character large object (DBCLOB)


    # 13.2 Benefits of table partitioning


    Table partitioning has many benefits including fast roll-in and roll-out, easier
    administration of large tables, flexible index placement, and increased query
    performance. Some of the situations in which table partitioning can be particularly
    beneficial are as follows:


    +   * You have a large data warehouse, where you usually add or delete parts of
    the information based on a known criteria, for example date. In such a situation
    the system can benefit from easier roll-in and roll-out of that data.

    * You have a data warehouse with large tables and you have a criteria for queries
    that could split the data among several devices.

    * You are required to use Hierarchical Storage Management (HSM) solutions more
    effectively.

    * You are required to place indexes in different devices, depending on the speed
    of the devices and how often the indexes are used.'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# 13.2.1 Efficient roll-in and roll-out


    Table partitioning provides the capability of rolling data partition into and
    out a table without having to take the database offline. By attaching a new partition,
    you can add an existing table including data, to a partitioned table as a new
    partition. The recently added partition will conform to certain criteria for the
    partitioning range. You can also split a table partition as an independent table
    by detaching the partition.


    This fast roll-in and roll-out capability is particularly useful in maintaining
    a certain range of data online and in archiving the out-dated data or keeping
    the out-dated data in a historical table. For example, a manufacturing site can
    have a partitioned table which stores one year of failure analysis data. The table
    is partitioned by month. At the beginning of each month the oldest Fragment of
    data is detached from the table and attached to the historical table. A new fragment
    of data is added for the month that is beginning.


    # 13.2.2 Easier administration of large tables


    Table level administration is more flexible because you can perform administrative
    tasks on individual data partitions. These tasks include:


    +   - Detaching and reattaching a data partition

    - Backing up and restoring individual data partitions

    - Reorganizing individual indexes


    Time-consuming maintenance operations can be shortened by breaking them into a
    series of smaller operations. For example, you can backup a partitioned table
    one data partition at a time if the data partitions are placed in separate spaces.


    # 13.2.3 Flexible index placement


    Individual indexes from the same table can now be placed in different table spaces
    allowing more granular control of index placement. Some benefits of this new design
    include:


    +   - Improved performance of drop index and online index create.

    - Ability to use different values for any of the table space characteristics between
    each index on the table (for example, different page sizes for each index may
    be appropriate to ensure better space utilization).

    - Reduced input and output (IO) contention providing more efficient concurrent
    access to the index data for the table.'
  merge: -1
