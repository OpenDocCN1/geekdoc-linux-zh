  md: '# Register HADR with TSA for automatic management


    In this step, we enable TSA to automatically monitor and manage the HADR pair.

    We do this by registering the HADR pair as a resource group with TSA.


    Do not manually issue DB2 “Takeover” commands after registering HADR as a resource
    group with TSA. Instead, use the following command to manually restart HADR:


    ```

    # chrg -o online <resource_group_name>

    ```


    Where <resource_group_name> is the name TSA gives to HADR resource group, for
    example db2hadr_hadrb-rg.


    For operator failedover, issue the following command:


    ```

    # rgeq -o move -n <node> <resource_group_name>

    ```


    Where <node> is the node (hadr01) at which the database (hadrb) has “Primary”
    HADR role. <resource_group_name> is the name TSA gives to resource group, for
    example db2hadr_hadrb-rg.


