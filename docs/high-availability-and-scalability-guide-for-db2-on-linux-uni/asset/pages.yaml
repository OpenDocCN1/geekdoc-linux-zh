    # 1


    # # DB2 high availability options


    In this chapter we provide an overview of different high availability and fault
    tolerance options in the market, where we briefly describe some technologies and
    products that can help you increase the availability of your DB2 applications.


    We review these technologies and discuss, at a high level, how you can integrate
    DB2 with them. We also discuss some scenarios where these technologies might be
    suitable for your enterprise.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 1.1 Introduction


    DB2 provides several features that can increase high availability of the database
    servers, including these:


    +   - High Availability and Disaster Recovery (HADR)

    - Automatic Client Reroute (ACR)

    - SQL replication

    - Q replication

    - Some basic DB2 features also increase the availability of your operation, such
    as online backup and in-place reorganization.


    In addition to these options, DB2 supports a number of software and hardware offerings
    from IBM and other providers that you can use in conjunction with DB2 to strengthen
    high availability in your environment.


    The decision on what products or features to use depends, as always, on the specific
    challenges of the environment, budget, complexity, time to implement, and degree
    of security required.


    DB2 offers cost-effective alternatives to implement a very reliable solution.
    You can replace some of the DB2 high availability features with additional hardware
    and software, which most of the time, drives up cost. For example, most high availability
    solutions implemented at the operating system level (clusters) heavily rely on
    shared disks, making storage the weak link in your operation. To overcome this,
    you are required to implement storage mirrors that escalate costs.


    # 1.2 Hardware-based solutions


    Hardware solutions usually have the high performance and security by copying or
    replicating whole disks. Using a hardware solution reduces the granularity and
    ability to determine when and what must be replicated. Solutions are also usually
    much more expensive than software solutions.


    DB2 offerings are completely integrated with these hardware-based type of solutions.
    The redundant array of independent disks (RAID) technology and remote storage
    mirroring are commonly used in a database system.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# 1.2.1 RAID technology


    Redundant array of independent disks (RAID) technology consists of a group of
    individual disks that can be accessed as a whole to increase performance, fault
    tolerance, or both. While RAID technologies can be implemented at the software
    level, these implementations usually do not have the level of security or performance
    most database servers require. In this chapter, we discuss hardware level RAID.


    # RAID 0


    RAID 0 is also known as *disk striping*. It refers to the usage of two or more
    disks, where the disk controller (known as a RAID controller) splits the I/O operations
    among the drives, creating a parallel write or read operation that increases performance
    but not reliability.


    As Figure 1-1 shows, the RAID controller receives an 8 KB block to write. The
    controller splits the data into four 2 KB and writes the data parallel among all
    drives. RAID 0 provides no redundancy.


    ![](img/a97b7826c3cf736045d80f48b5520a20_22_0.png)


    Figure 1-1 RAID 0 (disk striping) architecture


    # RAID 1


    RAID 1 is also known as *disk mirroring*. In RAID 1, the RAID controller replicates
    the writing operations from the main (or primary) disk to one or more spare disks
    called *mirrors*. Performance of write operations does not suffer, as the writing
    to the devices is accomplished in parallel.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'Read operations are actually improved as the controller uses all devices to
    read from, reducing contention as illustrated in Figure 1-2.


    ![](img/a97b7826c3cf736045d80f48b5520a20_23_0.png)


    Figure 1-2 RAID 1 (disk mirroring) architecture


    # # RAID 3


    Mirroring is great for security and very good for read performance, but it requires
    twice as much disk, which can be expensive. RAID 3 provides an alternative.


    With RAID 3, a minimum of three disks is required. One of these is dedicated to
    store parity information about the data of the other two. In the event of a disk
    failure, the information in any of the disks can be re-created from the other
    disks.


    The downside of this technology is that the parity disk receives a heavy load,
    as any write operation requires a write on the parity disk. As illustrated in
    Figure 1-3, all writes require the computation of parity information, which is
    an additional CPU overhead. The more disks you have, the lower the percentage
    of disk space dedicated for parity.


    Note that RAID 3 is not recommended for database storage, because of the single
    parity disk bottleneck.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '![](img/a97b7826c3cf736045d80f48b5520a20_24_0.png)


    Figure 1-3 RAID 3 architecture in implementation


    # RAID 5


    RAID 5 is a variation of RAID 3. It has the same concept but instead dedicating
    one single disk for parity, it spreads the parity among all the devices to balance
    the write load.


    RAID 5 is a cost-effective alternative to mirror data. It provides redundancy
    at the expense of one physical disk per array and four I/O (2 reads and 2 writes)
    operations per I/O write request. As the number of physical disks in the array
    increases, the cost penalty for the array decreases, but the write penalty remains
    the same. Therefore, RAID 5 is not an optimal choice for online transaction processing
    (OLTP) database or random write I/O intensive systems.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Figure 1-4 shows how a basic RAID 5 system works.


    ![](img/a97b7826c3cf736045d80f48b5520a20_25_0.png)


    Figure-1-4 A basic RAID 5 example system


    # RAID 10 and RAID 01


    RAID 10 and RAID 01 (also known as 1+0 and 0+1) both use a combination of mirroring
    with stripping. This is a winning combination for performance and fault tolerance
    can be quite expensive.


    The difference between RAID 10 and RAID 01 is that with RAID 10, individual disks
    are mirrored, and these mirrored groups are striped. On the other hand, with RAID
    01 the mirror is applied to a whole striped volume. In words, RAID 10 is a "mirror
    of stripes", and RAID 01 is a "mirror of stripes". Because the failure of a single
    element in the stripe makes it unusable, the best alternative is to always stripe
    mirrored volumes, that is RAID 10.


    From a pure performance and fault tolerance point of view, RAID 10 (1+0) is the
    perfect match and the best option for databases. RAID 5 can be a very cost-effective
    alternative for non-OLTP database storage.


    # When to use


    In general, RAID can be considered for the following situations:


    +   * When there are no concerns about site failures; this means, where the entire
    RAID would be lost or taken offline


    +   * When fault tolerance, performance, or both are the most important factors'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# DB2 integration


    DB2 databases can benefit from using RAID. As mentioned before, RAID 5 is not
    suitable for databases running OLTP applications. However, using RAID 1 or RAID
    10 for tablespaces increases the performance, tolerance to failure of any application,
    or both.


    For more information about RAID, see the Web site:


    http://en.wikipedia.org/wiki/Redundant_array_of_independent_disks


    # 1.2.2 Remote storage mirroring


    For years, mirroring and RAID have been the tools of choice to increase availability
    and performance at the hardware level. With ever increasing demands, many enterprises
    must not only be sure that their operations do not stop if a failure occurs, but
    also require fast access to data at a remote location. Remote storage mirroring
    combines mirroring and replication in enterprise-level storage, allowing enterprises
    to provide solutions for other requirements.


    The concept behind this technology is to have two or more disk arrays in boxes
    (also referred to as Storage Enclosures), located in geographically remote locations.
    These boxes are connected using Dark fiber or similar technologies and implement
    algorithms to replicate the data between the boxes.


    Storage mirroring replicates all disk writes, including the log information. There
    are specific ways to update the remote disk change from brand to brand. In general,
    synchronous and asynchronous are two typical modes to update the remote disk.


    Most of the time, remote storage mirroring has to be integrated with additional
    resources if automatic failover operations are required. Some examples of remote
    storage mirroring products are:


    +   * IBM Peer to Peer Remote Copy (PPRC) and IBM Peer to Peer Remote Copy over
    xExtended Distances (PPRC-XD)

    * Hitachi TrueCopy


    # Advantages


    The advantages of remote storage mirroring are as follows:


    +   * Several copies of data are kept in geographically remote locations.

    * Copies are made at the hardware level, which usually improves performance and
    reliability.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# When to use


    Use this technology when no data loss can be tolerated and the copy must be made
    with minimum delay.


    # DB2 integration


    Remote storage mirroring seamlessly integrates with DB2, allowing the enterprise
    to have a disaster recovery site providing continuous service. Additional technology,
    such as clustering, is required to automate the process of starting DB2 at the
    new site.


    For more information, refer to the following Web sites:


    +   - Dark fiber:

    http://en.wikipedia.org/wiki/Dark_fiber


    +   - PPRC:

    http://en.wikipedia.org/wiki/Peer_to_Remote_Copy


    # 1.3 Clustering solutions


    Clustering is a technique that has been employed for a long time to increase the
    resilience, performance, and availability of the solutions implemented in servers.
    A *cluster* is a virtual machine made up of two or more machines (or nodes), with
    various subsystems registered to the cluster configuration as resources. The functionality
    of the resources and the nodes is logically bound together using additional software
    and hardware. Clusters create the concept of highly available resources. In the
    event of a node failure, resources on other nodes can take over the workload,
    minimizing the downtime.


    The idea of clustering is to present to the users a single machine, in fact the
    system has multiple nodes to serve the client applications. Many clusters in an
    active/passive configuration where only one node performs work, with the others
    standing by as the backup in case of failure. Some cluster solutions are sophisticated
    enough to allow load balancing between the nodes in active/active configuration,
    thus maximizing the performance of the applications and providing more cost-effective
    use of the resources.


    Clustering solutions can be broadly categorized in two types:


    +   - Operating system dependent

    - Operating system independent'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# 1.3.1 Operating system dependent


    Most operating systems provide tools or products to create clusters. The techniques
    and concepts are similar, and the intention is always to present to the world
    a single virtual server, although the services can be spread among the nodes or
    members of the cluster.


    In the event of a service or resource failure, cluster processes try to restart
    the resource in the affected node, and if that is not possible, resources on another
    node take their place.


    Irrespective of cluster implementation, connection-oriented applications, such
    as database applications, require embedded logic to detect lost connections and
    to retry those operations that were in doubt or unfinished. The advantage of the
    cluster is that the clustering software often provides features for the applications
    to continue working effectively with no transactional data loss when the transfer
    between the nodes is automated. This reduces downtime and human intervention.


    These are some of the existing cluster solution providers:


    +   * IBM HACMP for AIX and Linux for IBM System™

    * Windows Server® 2003 Clustering Services for 32-bit/64-bit Intel/AMD platforms
    (formerly MSCS) and Windows Compute Cluster 2003 for 64-bit Intel/AMD platforms.

    * HP Serviceguard for HP-UX and Linux

    * Sun™ Cluster for Solaris™


    # Advantage


    The advantage of the operating system dependent clustering software is that it
    is highly integrated with the operating system.


    # When to use


    If you have a homogeneous architecture, operating system dependent clustering
    software that is well integrated with the operating system is a good choice.


    # DB2 integration


    DB2 supports all the operating system dependent clustering software listed above.
    There are DB2 agents or resource types to integrate these cluster solutions with
    DB2. The integration is either provided from DB2 as libraries that are automatically
    installed, or as sample scripts.'
  merge: -1
