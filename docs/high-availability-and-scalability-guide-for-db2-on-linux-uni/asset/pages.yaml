    \ to take a backup image from the standby database:\n\n+   1. Database backup\
    \ on the standby server:\n   - Suppose you have another storage area for the snapshot\
    \ of the standby database, and FlashCopy is configured between the storage area\
    \ for the standby database and the snapshot. Do the following steps:\n     - Deactivate\
    \ the database on the standby database.\n     - Stop the database instance.\n\
    \     - Unmount all file systems and varyoff volume groups. To ensure the consistency\
    \ of the snapshot image, no write activity is allowed during FlashCopy logical\
    \ copy. So it is preferable to unmount file systems (and varyoff volume groups).\n\
    \     - Use a Storage Copy function such as Flash Copy to take a snapshot of storage\
    \ image from the standby database, which includes the database directory and table\
    \ space containers. Basically, the logical copy completes in a moment waiting\
    \ for the physical copy of whole storage area. IBM Total Data Storage, once the\
    \ logical copy is finished, you can activate standby image again.\n     - Activate\
    \ (varyon) volume groups, mount file systems, and activate the database. Note\
    \ when the standby database is deactivated, you might not have the latest standby\
    \ database.\n\n+   2. Restoring to the primary server:\n   - If you have to restore\
    \ the database from this backup to the primary server, you must do the following\
    \ steps:\n     - Restore all the DB2 related files to the correct original location\
    \ on the primary server from the restored database should be in database rollback\
    \ pending state already.\n     - Make all the log files available (including the\
    \ active log files and archived log files from the primary server) to be processed.\n\
    \     - When the backup image was made on the standby server, its HADR status\
    \ was on standby mode. Also, the HADR configuration parameters are copied from\
    \ the standby database. They should be updated for the primary database.\n   \
    \  - Apply the log files from the original primary database to the restored database."
