- img_proc: true
  md: "In the following sections, we discuss two different methods to make the DB2\
    \ instance highly available with Windows Cluster: the manual method and the automatic\
    \ method using db2mscs.\n\nNote that you cannot use db2icrt with option -c <CLUSTERNAME>\
    \ to create a DB2 instance directly under the specified cluster. You must create\
    \ a DB instance and then migrate the instance to the cluster with the procedures\
    \ discussed here. If you try to create the instance with the -c option, you will\
    \ get a syntax error and the instance will not be created.\n\n# 9.7 Manually configuring\
    \ a DB2 instance in Windows Cluster\n\nAlthough there is a semi-automatic utility\
    \ db2mscs that does most of the work for you, it is important to understand what\
    \ steps are involved in making a DB2 instance highly available in a Windows Cluster\
    \ environment, so that you will be able to diagnose any problem that occurs.\n\
    \nThe following procedure can be used to configure a DB2 instance in a Windows\
    \ cluster to provide high availability:\n\n+   - Add a DB2 resource type to the\
    \ cluster.\n- Create a Cluster group to group all the resources for the instance.\n\
    - Create or move the supporting resources to the DB2 group:\n  - A highly available\
    \ IP address is mandatory.\n  - A highly available shared disk to store an instance\
    \ profile is mandatory.\n  - If this is a multi-partition database, the instance\
    \ profile directory must be shared and made highly available.\n\n# 9.7.1 Adding\
    \ the DB2 resource type\n\nOnce DB2 is installed and the instance is created,\
    \ you have to create a DB2 resource type in Cluster Server. A resource type is\
    \ basically a dynamic load library that is registered in Windows Cluster to manage\
    \ a specific type or types of resource. To allow Windows Cluster to manage the\
    \ DB2 instance, the DB2 instance must be a resource in the cluster."
  merge: -1
  pgno: 254
- img_proc: true
  md: 'In the Cluster Administrator, under Cluster Configuration, the Resource Type
    folder contains the current resource types that can be managed by the cluster
