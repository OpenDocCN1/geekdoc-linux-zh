    # 13.5 Locking behavior on partitioned tables


    In addition to an overall table lock, there is a lock for each data partition
    in a partitioned table. This allows for finer granularity and increased concurrency
    compared to a non-partitioned table. The new data partition lock is identified
    in the output of the db2pd command, event monitors, administrative views, and
    table functions.


    When accessing a table, locking behavior obtains the table lock first, and then
    acquires data partition locks as dictated by the data accessed. Access methods
    and isolation levels require locking of data partitions not in the result set.
    Once these data partition locks are acquired, they can be held as long as the
    table lock. For example, cursor stability (CS) scan over an index might keep the
    locks on previously accessed partitions to reduce the costs of re-acquiring the
    data partition lock if that data partition is referenced in subsequent keys. The
    data partition lock also carries the cost of ensuring access to the table spaces.
    For non-partitioned tables, table space access is handled by the table lock. Therefore,
    data partition locking occurs even if there is an exclusive or share lock at the
    table level for a partitioned table.


    Finer granularity allows one transaction to have exclusive access to a given data
    partition and avoids row locking while other transactions are able to access other
    data partitions. This behavior can be a result of the plan chosen for a mass update
    or due to escalation of locks to the data partition level. The table lock for
    many access methods is normally an intent lock, even if the data partitions are
    locked in share or exclusive. This allows for increased concurrency. However,
    non-intent locks are required at the data partition level and the plan indicates
    that all data partitions may be accessed, then a non-intent might be chosen at
    the table level to prevent deadlocks between data partition locks from concurrent'
