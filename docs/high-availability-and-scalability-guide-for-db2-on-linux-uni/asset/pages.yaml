    on page 52 shows the system name value of polonium.itsosj.ibm.com), you might
    have to insert the TCP/IP address and host name entry for the remote host/server
    (POLONIUM) on your local /etc/hosts file. For Windows, this address and host name
    would have to go in the file: %SystemRoot%system32\drivers\hosts. Otherwise, you
    can get TCP/IP errors as shown in Figure 3-3.


    Example 3-3 No local entry in /etc/hosts for the remote hostname


    SQL22212N DB2 Administration Server communication error has been detected. Client
    system: "x.x.x.x".


    This is because the DB2 Admin Server on the remote system might have the host/server
    name down in text rather than a literal IP address, and that is what you have
    specified literal IP addresses for your remote System and Host names. Note that
    you can receive the SQL22212N error for other generic reasons, listed in the pop-up
    message at the time you receive the error message.


    For the fields specifying the service name and the port number, we have used port
    50001 for both DBINST1 on the primary and DB2INST1 on the standby — that is, the
    primary DB2 port for the DB2 service and on each server; this is the port with
    which clients connect to DB2.


    HADR itself uses two ports, for each server. We use 55001 and 55002; these ports
