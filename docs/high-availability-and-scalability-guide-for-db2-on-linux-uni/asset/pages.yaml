    example, hadr02) as follows:


    +   (S) % db2 start hadr on db hadrb as standby


    Ignore the message: "Logindex build was not enabled before HADR started."


    Make sure that you keep the following points in mind:


    +   a. Always start HADR on the standby before cataloging.


    +   b. At each client, ensure that the primary node (hadr01) is cataloged. Here
    is an example:


    ```

