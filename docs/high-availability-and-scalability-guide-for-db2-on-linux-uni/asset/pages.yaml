    # 8.6 Tuning tips for quick failover


    When an outage on a primary database occurs, the steps required for continuing
    database services are as follows:


    +   1. Failure detection

    2. Resource failover required to provide service

    3. Restart applications and services


    To speed up the recovery time, we need to reduce the time taken in each step.
    In this section we discuss the considerations for each step.


    ![](img/a97b7826c3cf736045d80f48b5520a20_225_0.png)


    # 8.6.1 Failure detection time


    Failure detection time can be tuned by the cluster software settings. For HACMP,
    failure detection rate for each network type can be specified. There are several
    network types such as: atm, ethernet, fddi, hps, dbkhb, rs232, tmsci, tmssa. Having
    the same detection rate is recommended through all networks of the cluster.


    HACMP provides three default settings: SLOW(48s), NORMAL(20s), and FAST(10s).You
    can also specify a custom failure detection rate in seconds.'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'Note that setting a very low number of seconds can cause misjudgment of failure
    detection (false positives), resulting in unnecessary frequent failover.


    # 8.6.2 Failover to the resources


    In this section, we describe several options to speed up resource failover.


    # IP address takeover


    In previous versions of HACMP, network interfaces were directly overwritten by
    the service address. From HACMP/ES V4.5, an IP alias takeover is available, which
    reduces time for adding the service IP address to the standby node. stated in
    the HACMP v5.3 Administration Guide, SC23-4862-02, the reduced time is due to
    fewer commands being required when moving addresses.


    For more information on IP Aliases in HACMP, see the HACMP manuals:


    +   - HACMP v5.3 Administration Guide, SC23-4862-06

    - HACMP v5.3 Planning and Implementation Guide SC23-4861-07


    # Disk resource failover


    During a failover, HACMP moves shared disks defined in the resource group from
    one to another. This includes the following activities:


    +   - Varyon (activate) VG - varyng command

    - Mount FSs (if the FSs are defined in the resource group)


    The delay in a DB2 failover mostly stems from the move to control the shared disks
    and resources from one server to another. An integrity check of file systems (fsck)
    consumes a tremendous amount of time when the shared VG contains huge FSs. The
    more FSs in the resource group, the longer it takes to failover., the basic way
    to speed up resource takeover is to reduce the amount of FSs in the resource group.
    This can be accomplished by using raw device counters instead of FSs. With DB2
    database managed space (DMS) on raw device, we can significantly decrease the
    disk resource failover time, because there is no need to mount and check consistency
    of FSs during failover.


    We can also have a concurrent access resource group for the raw disk, decreasing
    failover time even further. Concurrent access volume group with HACMP enables
    both nodes to activate a VG simultaneously. This configuration reduces time for
    takeover resources, since a shared disk is always activated on standby nodes and
    there is no need to activate/varyon the VGs either. Using concurrent access with
    HACMP requires the installation of an additional HACMP file set. For example:


    ```

    cluster.es.clvm.rte for 5.3.0.0 COMMITTED ES for AI Concurrent Access

    ```'
  merge: -1
  pgno: 226
- img_proc: true
  md: "Concurrent access mode is not supported by JFSs. Instead, you must use only\
    \ raw logical volumes or physical disks for concurrent access resource groups.\n\
    \nAnother consideration for the concurrent access resource group concerns the\
    \ logistics of ensuring that no processes on the standby node (for, DB2 instances)\
    \ are actively using any shared disks. Concurrent VGs are activated from all the\
    \ nodes in the cluster. This means that they can be accessible from all nodes\
    \ in the cluster simultaneously and there is a very real possibility of unintentional\
    \ data corruption or loss. In this situation, software with a shared disk has\
    \ the responsibility to ensure consistent data access, whether that be performed\
    \ within the software, or controlled externally via the application/start scripts.\n\
    \nWhile DB2 databases will not tolerate concurrent access from multiple servers,\
    \ in mixed/hybrid HACMP/HADR, as discussed in Chapter 10, \"HADR in clustering\
    \ software\" on page 253, DB2 databases use a shared disk on the primary cluster,\
    \ and HADR writes to the standby on a third server node. Of, only one DB2 instance\
    \ can use this shared disk at once.\n\nTo improve performance of failover/takeover,\
    \ using raw device for data storage as mentioned above. The next question is a\
    \ matter of what is created on the raw device and what is not.\n\n+   - User table\
    \ spaces:\n  If your database is huge, user table spaces should take up most part\
    \ of the shared disks, using DMS raw device for the table space container will\
    \ improve failover performance.\n\n+   - Temporary table spaces:\n  You can configure\
    \ temporary table spaces in raw devices too. For huge sequential read and write\
    \ I/Os, DMS temporary table space is preferable in terms of performance. On the\
    \ other hand, SMS table space is recommended from the point of view of storage\
    \ utilization and ease of manageability. One concession to help with DMS containers\
    \ is the automatic table space resizing for table spaces available from DB2 V8\
    \ FixPak 9. For details of the automatic table space resizing, see DB2 InfoCenter.\n\
    \n```\nhttp://publib.boulder.ibm.com/infocenter/db2luw/v8/index.jsp?topic=/com.ibm.db2.udb.doc/admin/c0012277.htm\n\
    ```\n\n+   - Catalog table space:\n  You can specify the characteristics of the\
    \ DB2 system catalog table space when you create databases with the CREATE DATABASE\
    \ command. Since the DB2 SYSCATSPACE is small in most cases, it is unlikely to\
    \ contribute to reduction of failover time."
  merge: -1
  pgno: 227
- img_proc: true
  md: '+   Active logs:

    An active log can be configured in raw device. Note that from DB2 version 9, database
    logging using raw devices is deprecated. For details, see the DB2 Information
    Center topic "Database logging using raw devices is deprecated":

    http://publib.boulder.ibm.com/infocenter/db2luw/v9/index.jsp?topic=/com.ibm.db2.udn.rn/doc/c0023086.htm


    +   Other database components:

    Other database components, such as database directory files, instance home and
    subdirectories, and archive log directories have be created on FSs. Note that
    the archive logs also have the option to use TSM and avoid the issue altogether.


    Since we have FSs for some database components, HACMP fast takeover can help to
    recover these file system resources. This recent feature from HACMP V5.1 enables
    faster resource takeover using AI Enhanced Concurrent Volume Groups (ECM). Enhanced
    concurrent VG of AI active and passive mode vary, can be included in a non-concurrent
    resource group, and the fast takeover is set up automatically by the HACMP software.


    For all shared VGs in enhanced concurrent mode that contain FSs, HACMP will activate
    the fast takeover feature. When HACMP starts, all nodes in a resource group sharing
    the same enhanced volume group will vary VG in passive mode. When the resource
    group is brought online, the node that acquires the resources will vary the VG
    in active mode. This reduces the time to vary VG, even though it requires time
    to mount FSs. The prerequisites for this functionality are:


    +   HACMP V5.1 or later

    AIX 5L 5.2 or higher

    bos.clvm.5.2.0.11 or higher

    APAR I44237


    For more information about fast disk takeover, see HACMP for AIX 5L V5.3 Planning
    and Installation Guide, SC23-4861-06.


    There is another HACMP option to speed up mounting FSs: parallel mount of FSs.
    This feature allows for specification of how FSs are mounted during resource takeover.
    Parallel mount can be faster than sequential (default). This option can be used
    if you do not have nested FSs.


    You can also change the method of the file system integrity check from the default
    fsck to logredo. Although logredo may speed up mounting FSs, this option does
    not guarantee that all the errors in the FSs can be fixed by the node crashes
    in the middle of file system I/O.'
  merge: -1
