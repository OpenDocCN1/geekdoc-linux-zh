    # Understanding automation on TSA


    The following are the common terms between TSA and other clustering solutions:


    +   Resource: This can be a physical device such as a disk, a network adapter;
    software, from the Operating System itself, through middle ware and DBMS, WebSphere
    Administration Server (WAS) and Web Server daemons. With respect to up/down status
    monitoring and automation (and now end-to-end automation), resources can also
    exist at multiple tiers, for example, grouping granular resources and base-level
    cluster environments to make the concept of an application environment.


    +   Critical resource: This is a resource that must not be active on more than
    one node at the same time. A primary example of this is a static IP address that
    is shared between the nodes which clients use to connect to server resources.
    By this definition, the HADR primary role database would also be a critical resource.


    +   Cluster/peer domain: This is a group of system nodes or nodes. These are what
    resources are part of, if groups of resources become unavailable, it essentially
    indicates that a given node, or subcluster is unavailable. This leads to automated
    actions designed to maintain availability by establishing quorum, and to attempt
    restoration of the failed nodes without conflicting with resources on available
    nodes.


    +   Quorum: The majority level of operational nodes, required before certain operations
    can be performed within a cluster. TSA splits this definition into:


    +   Configuration quorum: Determines whether cluster configuration changes will
    be accepted.


    +   Operational quorum: Determines whether state changes of resources will be
    accepted (so as not to cause conflicts).'
  merge: -1
  pgno: 304
- img_proc: true
  md: '+   Tie-breaker: Where equal number of nodes exist in a subcluster, this determines
    which of those subclusters can have the quorum. The mechanism of the tie-breaker
    can be of six different types, depending on the platform and devices available:


    +   Operator: Requires human intervention for a decision in order to reach a quorum.


    +   Fail: A default/pseudo tie-breaker in which neither subcluster attains quorum.


    +   SCSI: Shared SCSI disk implementation on certain Linux platforms. SCSI reserve
    or persistent reserve command is used to achieve tie-breaker status.


    +   ECKDTM: Shared ECKD disk on system z Linux. ECKD reserve command is used to
    achieve tie-breaker exclusive status


    +   Disk: Shared SCSI-like disk on AIX. An equivalent or pseudo-SCSI reserve or
    persistent reserve command is used to achieve tie-breaker exclusive status on
    SCSI-like or emulated disk.


    +   EXEC: Network implementation which calls a command executable to achieve a
    tie-breaker. ICMP (Internet Control Message Protocol) ping echo requests are sent
    to an external IP instance to determine tie-breaker exclusive status in the case
    of subcluster nodes failing. Note that this method relies on failure of ICMP response
    to indicate subcluster/node failure and is unable to determine if communication
    is still working between the subcluster peer nodes.


    In the terminology specific to TSA, the hierarchy by which Tivoli System Automation
    coordinates resources in a clustered environment comprises an Automation Manager,
    which consists of a Binder and a Logic Deck.


    +   Binder: Has resources assigned (bound) to a particular node. If the resource
    cannot be accessed on any node, it is placed in a Sacrified state. If it can be
    accessed, then it is placed in a bound state to that node. Resources in a bound
    state are only actually started if resource dependencies have been met.


    If System Automation has not yet tried to access a given resource, it is by default
    in an unbiased state. Conflicts between multiple available resources are managed
    by a priority value. The resource with lower priority is placed in Sacrified state.


    +   Logic deck: Sends orders to start and stop resources according to the rules
    set out by the Automation Policy.


    +   Automation Policies: An abstract rule-based set of dependencies and relationships
    between resources, rather than hard and fast scripts. The'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'Automation Policies determine what should occur when values change in the monitored
    states of resources, specifically when differences occur between a Desired State
    (Online/Offline), and an Observed State


    +   * Resource relationships: A critical part of the automation policy


    +   - Stop-start relationships determine which resources should be stopped or
    started in a given scenario.


    +   - Location relationships determine whether related resources should be started
    on the same or on separate nodes.


    +   * Equivalency: A group of resources which can be said to provide the same
    function: TSA can choose from any of these in order to provide a given function
    in the required definition of availability. For example, a given with redundant
    network adapters, if one fails, IP address can be mapped by TSA to another adapter
    in the equivalency.


    Technically, TSA Automation Policies themselves do not entail scripting. Policies
    are in the form of business rules or heuristics which dictate a high level how
    resources on various nodes should behave and interact. This enables attribution
    of priorities such that for any partial or total resource failure scenario, the
    appropriate action will be taken.


    At a lower level, resources are started, stopped, and monitored using scripts
    or command line interfaces to the resource in question. Some scripts are provided
    with the TSA product for certain common resource types, and some are available
    as downloadable samples. Scripts would be written in-house for any uncommon resources
    or software with TSA is not familiar.


    Sample scripts for many TSA environments can be found at the Web site:


    ```

    http://www.ibm.com/software/tivoli/products/sys-auth-linux/downloads.html

    ```


    An example of a lower script for resource interaction is the status script required
    for HDR in DB2 in a TSA-managed cluster environment. This could take the form
    of a shell script executing db2pd or get snapshot with some text/string manipulation
    logic for example. The scripts for some UNIX platforms are supported, but may
    be adapted for other patterns.


    HADR monitoring in DB2 9 is extremely easy by simple table functions to retrieve
    the HDR monitor elements. Previously, a script had to interpret the output of
    db2pd, db2 get snapshot of database, or continuously monitor the output of db2diag
    log Details can be found in 4.5, "Monitoring HADR: db2diag" on page 107. For efficiency
    and speed required in critical banking applications, it may be best to continue
    using a script tailored to continually the last several lines of db2diag log to
    check on'
