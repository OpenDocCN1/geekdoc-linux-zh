  md: '5. To verify that data has been distributed across database partition servers,
    enter the following commands from a DB2 command window:


    SELECT DISTINCT DBPARTITIONNUM(empno) FROM employee;

    The output will list the database partitions used by the EMPLOYEE table.

    The specific output will depend on the number of partitions in the database and
    the number of partitions in the partition group used by the table space where
    the EMPLOYEE table was created.


    # 12.3 Scaling the database


    As customer data volumes grow, and more users are added, a scalable database must
    be able to deliver good performance and keep pace with the growth. By designing
    a multi-partition database properly you can expect the DB2 DPF system to scale
    in a near-linear fashion. Because the number of database partitions has little
    impact on the inter-partition traffic, DB2 has a very scalable performance. For
    achieving good scalability it is important to understand the concept of balanced
    configuration unit (BCU).


    # 12.3.1 Balanced configuration unit


    Scalability is achieved by splitting the data across multiple DB2 database partitions.
    These database partitions reside on a stack of technology which includes the DB2
    software, operating system, processors, memory, I/O backplane or I/O paths, disk
    controllers and individual disk spindles. A balanced configuration unit is a subset
    of the whole database that is designed to meet the customer requirements for performance,
    failover, and support. Multiple BCUs can be combined to complete the entire data
    warehouse design and to fulfill customer requirements. You may think of the BCU
    as a building block. Multiple identical building blocks are combined to form the
    entire database solution. Figure 12-8.'
  merge: -1
  pgno: 390
- img_proc: true
  md: '![](img/a97b7826c3cf736045d80f48b5520a20_391_0.png)


    Figure 12-8 Balanced configuration unit


    A BCU is the minimum replicable hardware/software stack necessary to start or
    expand the growing business data requirements. A BCU is a single node with a scalable
    ratio from disks to I/O to memory to CPUs to network. The *balanced partition
    unit* (BPU) is the smallest unit of infrastructure that can be formed. A BPU is
    a DB2 database partition with multi-partition data and server “components”. A
    BCU can be composed of multiple BPUs. Therefore, if one understands the behavior
    of one partition, one can understand the behavior of the BCU, and thus of the
    entire infrastructure.


    # # 12.3.2 Scaling the number of partitions


    Data growth can lead to imbalance of CPU/disk and other resources. We must identify
    the new number of BCUs to implement the solution which can handle the increase
    in data growth. Once we have identified the required number of BCUs'
  merge: -1
  pgno: 391
- img_proc: true
  md: 'and BPUs we can add the appropriate number of DB2 partitions. As illustrated
    in Figure 12-9, once the new partitions are added, the data can be redistributed
    among the database partitions to achieve a balanced database partition group.


