  md: '# HADR with clustering software


    Clustering software such as High Availability Cluster Multi-Processing (HACMP)
    and Tivoli System Automation (TSA) are among system high availability options.
    Combining High Availability Disaster Recovery (HADR) with clustering software
    strengthens the high availability for the computing environment. In this chapter
    we discuss how to configure HADR with HACMP or TSA to enable automating HADR takeover.


    We introduce the following topics:


    +   - Why clustering software is needed

    - Automating HADR takeover with HACMP

    - Automating HADR takeover with TSA'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# 10.1 Overview: Why clustering software is needed


    The present version of HADR does not monitor the environment of the primary database
    server for outages such as network down. As illustrated in Figure 10-1, in the
    Remote Catchup Pending state, the standby database keeps waiting for log records
    to be transferred even though the primary database is no longer active. It is
    necessary to monitor the HADR pair and manually issue appropriate takeover commands
    in the event of a primary database failure. This is where clustering software
    is required to automate HADR takeover.


    ![](img/a97b7826c3cf736045d80f48b5520a20_271_0.png)


    What is clustering software?


    What is clustering software?

    \Clustering software automates failover of resources such as processes, applications,
    storages, and IP addresses. Clustering software monitors the health of the network,
    hardware and software processes, detects and communicates any fault, and automatically
    fails the service and associated resources to a healthy host in the cluster.


    In a cluster environment, the terms failover, fallover, and takeover are often
    used interchangeably, referring to the action which system activities are moved
    from the failed system to the healthy one. Specifically, failover refers to the
    activity of the broken node/server handing over responsibility to a backup or
    standby node/server. Fallover is similar, but a more general term for moving resources,
    including planned move operations for the purpose of maintenance. Takeover refers
    to the activity of the backup node/server making resources active after the original
    primary server breaks/fails.


    There are several clustering software you can choose depending on the platforms
    where the databases are running. The following lists are a few of them:


    +   - Tivoli System Automation for Linux

    nTivoli System Automation is a solution that is designed to provide a multi-tiered
    architecture of clustering in a heterogeneous environment. This may either be
    through the TSA base-level cluster solutions from other vendors, coupled with
    the TSA end-to-end component, which interfaces with all the base-level'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'clustering software (with adapters for non-TSA products). This enables central
    control of all clusters, and facilitates the grouping of interdependent base-level
    clusters into applications. TISA provides a consistent, single monitoring and
    control interface for these disparate servers and clusters within a mission-critical
    business environment, and can truly be considered an integrated and automated
    highly available solution.


    For detailed information about Tivoli System Automation, see the white paper entitled
    "Highly Available DB2 Universal Database - Tivoli System Automation for Linux",
    which is available on the Web site, "DB2 Database for Linux, UNIX®,, and Windows
    and DB2 Connect - Online Support":


    +   - http://www.ibm.com/software/data/pubs/


    +   - IBM High Availability Cluster Multi-Processing for AIX

    HACMP VS offers robust high availability and disaster recovery for IBM customers
    with mission-critical applications. HACMP base services for cluster node membership,
    system management, configuration integrity and control, failover and recovery
    for applications. HACMP clusters with both non-concurrent and concurrent access
    can contain up to 32 nodes. A node is an AIX 5L operating system, and it may be
    a System p, an RS/6000® server, or a logical partition (LPAR) of an applicable
    System p.


    For detailed information about HACMP, see the following Web site:


    +   - http://www-03.ibm.com/systems/software/hacmp.html


    +   - Microsoft Cluster Server for Windows operating systems


    Microsoft Cluster Server (MSCS) was introduced in Windows 2003. The new replacement
    for MSCS has improved capabilities. It allows you to connect to eight nodes in
    a cluster; and, additional technology to make geographically remote clusters has
    been added.


    For information about MSCS, see the following white paper "Implementing IBM DB2
    Universal Database V8.1 Enterprise Server Edition with Microsoft Cluster Server"
    "DB2 Database for Linux, UNIX, and Windows Support":


    +   - http://www.ibm.com/software/data/pubs/


    +   - LifeKeeper for Linux/Windows


    LifeKeeper for Linux/Windows is a clustering software provided by SteelEye Technology,
    Inc. LifeKeeper provides features and functions to monitor system and application
    health, maintaining client connectivity and providing uninterrupted data access.
    By maintaining the system uptime, LifeKeeper ensures high availability for Linux/Windows
    applications.


    More details of this product are available at:


    +   - http://www.steeleye.com/products/'
  merge: -1
  pgno: 272
- img_proc: true
  md: 'The article, DB2 UDB and SteelEyeKeeper for Linux - A High Availability Database,
    introduces a sample configuration of integrating DB2 into LifeKeeper cluster environment.
    This article is available at the following site:


    ftp://ftp.software.ibm.com/software/data/pubs/papers/1k.pdf


    +   DNCWARClusterPerfect is the clustering software of Toshiba Solutions Corporation.
    This product provides a way of keeping computing resources available to users
    in the event of a hardware or software failure. By connecting multiple servers,
    other servers in the cluster take over the workload when one goes down.


    # HADR works in an environment with clustering software


    When a primary database server outage occurs, clustering software detects the
    failure and fails the resources from the primary to the standby node. You can
    configure the failover scripts to issue HADR takeover on the standby database
    in connection with the resource failover. Figure 10-2 shows a typical failover
    flow in the HADR cluster automated by the clustering software.


    ![](img/a97b7826c3cf736045d80f48b5520a20_273_0.png)


    In the cluster environment, the typical failover flow is as follows:


    +   Under normal operations, users connect to the primary server and execute transactions
    against the database in this server. HADR continuously transfers the changes from
    the DB2 log from the primary to the standby server. In the standby, the logs are
    continuously replayed, thereby replicating the primary database. The standby database
    is in rollforward pending and no user can access this database.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '2. In the event of an outage on the primary server, clustering software detects
    the fault and starts to failover the defined resources like IP address and executes
    takeover scripts. Clustering software can be configured to detect not only the
    server outage but also an instance crash by monitoring instance process.


    3. The takeover script(s) issues a HADR takeover command against the standby database
    to change its role to primary. The old standby server can now serve users as the
    primary.


    4. While HADR takes care of synchronization of data between a primary and standby
    pair, there is still a need for applications to dynamically access the new server
    after an outage. This is achieved by the DB2 Automatic Client Reroute feature.
    Whenever the client fails to connect to the original server, the DB2 client will
    attempt to reroute the connection to the alternate server. If the reroute succeeds,
    the application can continue.


    5. When the failed server comes back online, it can be started as the standby
    server, reversing roles to those prevailing role to the outage.


    # What resources should be taken over


    The resources that must be taken over to automate HADR takeover with clustering
    software are follows:


    +   - Storage devices:

    In a disk shared cluster, you must configure the shared storage device and create
    all database resources on it.


    In an HADR environment, there is no need to share storage resources for failover,
    since the primary and standby databases are independent databases that reside
    on separate storage devices.


    +   - IP address:

    IP address takeover is optional. When you use Automatic Client Reroute, you do
    not always have to have a failover IP address because switching the IP address
    is handled on the client side. But be aware that for the clients or other servers
    which communicate with the database server and do not support Automatic Client
    Reroute, you must switch the definition of the IP address to the new primary database
    server.


    +   - Takeover scripts:

    Takeover scripts must be configured as a resource of the clustering software,
    and must be issued on the standby database by the clustering software at the time
    of takeover of resources after detecting an outage on the primary database.'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# 10.2 Automating HADR takeover with HACMP


    This section describes how to automate DB2 HADR takeover in an HACMP environment.
    The section also describes the failover test procedure for HADR controlled by
    the HACMP facility.


    HACMP for AIX provides a highly available computing environment. HACMP facilitates
    the automatic switching of users, applications, and data from one system to another
    in the cluster after a hardware or software failure. The primary reason to create
    HACMP clusters is to provide a highly available environment for mission-critical
    applications. In these applications, the applications are placed under HACMP control.
    HACMP ensures that the applications remain available even when a component in
    a cluster fails. To ensure availability in case of a component failure, the HACMP
    software moves the application along with the resources, another node in the cluster.
    For more details regarding HACMP, see Chapter 8, "DB2 and HACMP" on page 183.


    # 10.2.1 HACMP and HADR planning


    Before you set up an HADR and HACMP environment, you must plan the cluster environment.
    The following items must be considered:


    +   * Physical nodes

    * Network

    * HACMP configuration

    * HADR configuration

    * Scripts'
  merge: -1
  pgno: 275
- img_proc: true
  md: "# Lab environment\n\nFigure 10-3 shows the configuration of HACMP and HADR\
    \ in our Lab environment.\n\n![](img/a97b7826c3cf736045d80f48b5520a20_276_0.png)\n\
    \nFigure 10-3 Lab environment\n\nThe planning for our Lab environment is as follows:\n\
    \n+   - Physical node configurations:\n  - Two physical nodes named Node1 and\
    \ Node2 are defined in the cluster.\n  - Node1 is designated as the service node,\
    \ which regularly provides service to clients. The HADR primary database runs\
    \ on this node.\n  - Node2 is the standby node on which the HADR standby database\
    \ resides. The role of both these nodes changes in response to system failover\
    \ or planned takeover issued by administrators.\n- Network configurations:\n \
    \ - Two ethernet network interfaces on each node are provided for the client's\
    \ access, which are under the control of HACMP. The service address for the clients\
    \ is added on one of these network interfaces."
  merge: -1
  pgno: 276
- img_proc: true
  md: '+   - One ethernet network interface is dedicated to HADR communications. We
    recommend that you have a separate network for HADR if you want to avoid the interference
    of HADR log transfer.


    +   - One serial (RS-232C) network is configured for HACMP keep-alive. Having
    a serial network (non TCP/IP network) is recommended in order to make HACMP failure
    detection more reliable.


    **Note:** There is no need to have shared disks disks for HADR in an HACMP cluster,
    since the primary and standby databases are independent databases, which can reside
    in separate storage devices.


    +   ▶ HACMP configuration:


    +   - Resource group named *hadr_rg* is configured, which includes a service address
    and an application server.


    +   - In our Lab, we configured a service address in the HACMP resource group.
    IP address takeover is optional if you use Automatic Client Reroute where clients
    can automatically switch the nodes they connect to.


    +   ▶ HADR configuration:


    +   - Each node has the DB2 instance named *hadrist*. Instance names do not always
    have to be identical on both the nodes.


    +   - Each instance has the database named *SAMPLE*. The database name should
    be identical on both the nodes.


    +   - Configure dedicated network for HADR communication.


    # Failover after primary node crash


    Figure 10-4 show the cluster behavior in the event of a primary (service) node
    crash:


    +   1. HACMP detects the primary nodes outage and starts the failover process.
    The resource group *hadr_rg* is acquired by the standby node (Node2).


    +   2. The Service IP address related to the resource group is added to the standby
    node.


    +   3. The Start script in the HACMP application server, which is related to the
    resource group, is issued on the standby node. The script includes the TAKEOVER
    HADR command to change the role of the standby database to primary.


    +   4. Clients who address the service address succeed in connecting to the new
    primary database on the surviving node, which has the HACMP resource group now.'
  merge: -1
  pgno: 277
- img_proc: true
  md: '![](img/a97b7826c3cf736045d80f48b5520a20_278_0.png)


    Figure 10-4 Automatic failover to standby node


    # # Reintegration of old primary node


    Figure 10-5 shows the process required to reintegrate the old primary node into
    clusters. This process is as follows:


    +   1. After Node1 is recovered from a hardware crash, you can start up instance
    and start HADR as the standby database on this node by executing the **start hadr**
    command with `as standby` option manually.

    2. The standby database automatically catches up with the log records which are
    processed only on the new primary database during the time the old primary Node
    is out of order.

    3. After the standby database catches up all the log gaps, the HADR primary and
    standby again return to the Peer state. Reintegration of the old primary database
    here is complete.'
  merge: -1
  pgno: 278
