  md: '# Create a DB2 HADR database


    Now that you have created the primary and standby instances (db2instp and db2insts
    respectively), you need to create a database (hadrb) that you will make highly
    available through HADR.


    +   1. As root, make sure that the database instance is started as follows. Remember,
    *do not* issue db2start as the instance is now controlled by TSA:


    ```

    () # chrg -o online db2_dbinstp_0-rg

    () # getstatus

    ```


    -- Resource Groups and Resources --


    | Group Name | Resources |

    |---|---|

    | db2_dbinstp_0-rg | db2_dbinstp_0-rs |

    | db2_dbinstp_0-rg | db2_dbinstp_0-ip |

    | db2_dbinsts_0-rg | db2_dbinsts_0-rs |

    | db2_dbinsts_0-rg | db2_dbinsts_0-ip |


    -- Resources --


    | Resource Name | Node Name | State |

    |---|---|---|

    | db2_dbinstp_0-rs | hadr01 | Online |

    | db2_dbinstp_0-ip | hadr01 | Online |

    | db2_dbinsts_0-rs | hadr02 | Online |

    | db2_dbinsts_0-ip | hadr02 | Online |


    If you would like to better understand how HADR works, please view the following
    Flash demo: http://demos.dfw.ibm.com/on_demand/IBM_Demo_DB2_HADR-Jan05.html?tm1S=index&S=C


    +   2. As primary instance owner (db2instp), create the database (hadrb) that
    you will later make highly available with HADR as follows.


    ```

    () % db2 create database hadrb on <database_directory_path>

    ```


    Where <database_directory_path> is any valid path on the primary node, for example
    /misc/homep/db2inst.'
