  md: '# 3.4.4 Considerations while running HADR


    Once the HADR is configured and running, consider these situations:


    +   If you schedule backup and housekeeping tasks through the DB2 tools database,
    you should consider managing it through HADR in parallel with your application
    database. In the case where an extended outage of the primary server carries through
    a critical batch window, you will want it to be working and running the same tasks
    just as on the original primary server.


    +   The db cfg parameter AUTORESTART should be turned off if you do not want the
    standby database to attempt to roll forward while HADR is stopped and the DB2
    instance gets recycled while that database is still in STANDARD mode.


    +   If you use ACR rather than a clustering solution to control IP addressing
    and takeover for remote clients, db2auto should be turned off for the DB2 instances
    which control HADR databases. To explain an example of server A and server B,
    this is so that DB2 on a broken primary server A does not automatically restart
    when server A is subsequently fixed and started up, causing a split-brain scenario.


    In the context of HADR, split brain can be summarized as where remote clients
    cannot distinguish one server from the other when connecting to their database,
    owing the possibility of changes made to the wrong database, and then unable to
    be isolated and transferred to the correct database.


    Fortately, DB2 HADR is able to protect itself from split-brain scenarios where
    an HADR primary database has been deactivated while it was in HADR mode. If a
    client attempts to connect to a standby database, it will go through an attempt
    to activate the database in HADR primary mode, and connect to an HADR standby.
    After the HADR_TIMEOUT interval, DB2 will return an SQL1768N with reason 7:


    The primary database failed to establish a connection to its standby database
    within the HADR timeout interval.


    This is why it is easier from an Administration point of view to start the HADR
    standby database first, then the primary, as there is no pressure to get the other
    database started before the HADR_TIMEOUT interval lapses and the database is left
    inactive.


    Split brain in the context of HADR can still occur in other ways:


    +   Where the broken HADR primary server was never actually deactivated (for example,
    where the failure was with the network rather than with the server), and after
    a db2 takeover hadr on database ... by force command is issued by the standby
    server B, the broken primary server A unexpectedly comes back online.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '+   - Where the broken HADR PRIMARY on server A has a db2 stop hadr on database
    command issued on it, that it is now in STANDARD mode, and clients can once again
    connect to it instead of the correct HADR primary database running on server B.
    As with the previous scenario, this should not be possible in a proper clustering
    solution that manages IP addressing. Remote clients in this case can only connect
    to a single server that has the role of the active node.


    # 3.4.5 Re-establishing HADR after failure


    Also referred to as reintegration of HADR, this process is very similar to the
    initial setup of HADR, but without all the configuration of db cfg parameters.


    There are two ways to successfully get HADR working again in a paired primary
    and standby relationship; both should require no downtime, and the first is an
    rapid and low complexity solution.


    For familiarity, we are using the example of HADR database SAMPLE on Server A
    as primary and Server B as standby, where Server A suffers a failure, followed
    by a takeover hadr by force command on server B, that server becomes the new primary.


    The first way will only work if the primary and the standby are in Peer state
    at the time of Server A''s failure. In this scenario, the DB2 instance is eventually
    restarted on server A correcting whatever failure occurred. DB2 HADR will protect
    itself from split brain by not allowing activation of the database on server A,
    returning SQL176N with RC 7 if any database activation or remote client connection
    attempts are made at this time.


    The next thing to do is issue the command db2 start hadr on database as sample
    on Server A. Note that database SAMPLE also cannot have had a db2 stop hadr on
    database command run beforehand, as it will then contain log records that server
    B does not know about, making it effectively unusable as a standby for server
    B. Attempts to restart HADR it as standby will result in SQL176N RC 1. Attempting
    to start HADR as standby on server A''s SAMPLE database will naturally fail for
    the same reason if the databases are not in Peer state at the time of server A''s
    failure.'
  merge: -1
