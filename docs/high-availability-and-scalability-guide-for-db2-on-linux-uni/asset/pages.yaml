  md: "# 5.3 Limitations\n\nThere are some limitations when using the automatic client\
    \ reroute feature:\n\n+   - TCP/IP is the only supported communications protocol\
    \ by automatic client reroute in DB2 UDB servers. Even if DB2 is setup for a loopback,\
    \ TCP/IP communications protocol must be used in order to accommodate the automatic\
    \ client reroute feature.\n\n+   - Automatic client reroute feature is supported\
    \ only in DB2 for Linux, UNIX and Windows operating systems in both the client\
    \ and the server side. Other DB2 families do not currently support this feature.\n\
    \n+   - The DB2 server installed in the alternate host server must be the same\
    \ version (but could have a FixPak when compared to the DB2 installed on the original\
    \ host server.\n\n+   - If the connection is re-established to the alternate server,\
    \ any new connection to the same database alias will be connected to the alternate\
    \ server. If you want any new connection to be established to the original location\
    \ in case the problem is fixed, there are three methods to achieve it:\n    -\
    \ You need to take the alternate server offline and the connections to fail back\
    \ over the original server. This requires that the original server has been cataloged\
    \ using the UPDATE ALTERNATE SERVER command such that it is set to be the alternate\
    \ location as the alternate server.\n    - You could catalog a new database alias\
    \ to be used by the new connections.\n    - You could uncatalog the database entry\
    \ and re-catalog it.\n\n+   - The alternate server information is always kept\
    \ in memory. If you do not have the authority to update the database directory\
    \ (or because it is a read-only database), other applications will not be able\
    \ to determine and use the alternate server, because the memory is not shared\
    \ among applications.\n\n+   - The client will be unable to reestablish the database\
    \ connection if the alternate location has a different authentication type than\
    \ the original location. The same authentication is applied to all alternate locations.\n\
    \n+   - When there is a communication failure, all session resources as global\
    \ temporary tables, identity, sequences, cursors, options (SET SERVER OPTION)\
    \ for federated processing and session registers are all lost. The application\
    \ is responsible to re-establish the session resources in order to continue processing\
    \ the work. You do not have to run any of the special register statements after\
    \ the connection is re-established, because DB2 will replay the special register\
    \ statements that were issued before the communication error."
