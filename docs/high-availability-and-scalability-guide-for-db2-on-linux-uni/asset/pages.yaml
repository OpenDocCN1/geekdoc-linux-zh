  md: '8. DB2 must start an HADR service on the primary node (hadr01), to ship logs
    to the standby node (hadr02). Thus, as root, we must add the following to the
    /etc/services file on the primary node:


    ```

    (P) # hadinst 18819/tcp

    ```


    9. DB2 must start an HADR service on the standby node (hadr02), to accept logs
    from the primary node (hadr01). Thus, as root, we add the following to the /etc/services
    file on the standby node:


    ```

    (S) # hadrinsts 18820/tcp

    ```


    10. As primary instance owner (db2inst), enable HADR on the primary database (hadrdb)
    as follows:


    +   (P) % db2 update db cfg for haddb \ HADR_LOCAL_HOST hadr01

    (S) % db2 update db cfg for haddb \ HADR_REMOTE_HOST hadr02

    (P) % db2 update db cfg for haddb \ HADR_LOCAL_SVC 18819

    (P) % db2 update db cfg for haddb \ HADR_REMOTE_SVC 18820

    (P) % db2 update db cfg for haddb \ HADR_REMOTE_INST db2insts


    11. As standby instance owner (db2insts), enable HADR on the standby database
    (hadrdb) as follows:


    +   (S) % db2 update db cfg for haddb \ HADR_LOCAL_HOST hadr02

    (S) % db2 update db cfg for haddb \ HADR_REMOTE_HOST hadr01

    (S) % db2 update db cfg for haddb \ HADR_LOCAL_SVC 18819

    (S) % db2 update db cfg for haddb \ HADR_REMOTE_SVC 18820

    (S) % db2 update db cfg for haddb \ HADR_REMOTE_INST db2instp


    12.Choose a synchronization mode to run the HADR pair. There are three modes:
    synchronous, non-synchronous, and asynchronous. Synchronous mode provides the
    greatest protection against transaction loss, but has the slowest transaction
    time. Asynchronous mode provides the least protection but has the fastest transaction
    time. Near-synchronous mode provides more protection than asynchronous mode and
    its transaction time is a little faster than that of synchronous mode. We use
    the synchronous mode in this case:


    ```

    (P) % db2 update db cfg for haddb HADR_SYNCMODE\ sync

    ```


    For information on the various HADR synchronization modes, the section in DB2
    Information Center at the Web site:


    ```

    http://publib.boulder.ibm.com/infocenter/db2help/index.jsp?topic=/com.dbm.db2ud.doc/admin/r0011445.htm

    ```


    13.Specify the amount of time (in seconds) that the HADR process waits before
    considering a communication attempt to failed:


    ```

    (P) % db2 update db cfg for haddb HADR_TIMEOUT 30

    ```'
