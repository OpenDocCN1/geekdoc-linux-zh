  md: 'In the Add Instance dialog box, the Instance node name is the nickname you
    create for the remote instance, cataloged for use on your local system (this is
    what gets displayed in the Control Center).


    Remember, the System node name and the Instance node name are not meant to be
    the same. Behind the scenes, the System node definition is cataloging an ADMIN
    TCPIP NODE entry; the Instance node definition is cataloging a regular TCPIP NODE
    entry. That is why we have separate layers in the DB2 Control Center tree structure.


    One to avoid conflicts, while inside the wizard, is to add the system and instance
    definitions beforehand. This can be done with the Control Center or the Configuration
    Assistant. However, if discovery of the remote objects is not working for whatever
    reason, you will have to catalog the remote server node, and database aliases
    manually; see Example 3-1 and Example 3-2 on page 45.


