- img_proc: true
  md: '+   Failback:


    After a failover has occurred, which made the original standby into a primary,
    failback is the act of reverting this database back to a standby and bringing
    the original primary back as a primary once again. That means, switching the roles
    of the primary and the standby, while both are alive and healthy.


    Failback is not a mandatory operation. A customer can choose to leave the databases
    in their reversed roles until another failover is necessary due to the failure
    of the new primary. This is especially likely in cases where the HA goal is ultra-fast
    failover, as failback can be viewed as a needless avoidable interruption in service.


    Customers who choose this option must ensure that all DB2-related objects and
    processes that HDR does not replicate, are the same on both the servers; especially
    things such as batch schedule tasks, which must be deactivated when the database
    is in the standby mode, and activated while it is in the primary mode.


    +   Failover:


    Failure is an event where any database service prerequisite component (DB2, operating
    system, server machine or network) is no longer able to provide the service it
    is supposed to. HDR will maintain data availability in the event of failure of
    any single component. If the failure affects only the standby system or the communication
    between the primary and the standby, data remains fully available on the primary
    without any disruption or required user action.


    If the failure prevents the primary from providing DB2 functionality, the user
    can take the primary DB2 instance, the server, or completely down (if it is not
    already) and initiate failover, which will rapidly change the standby system into
    primary, making the data available after only a brief outage.


    Some failures can be detected and reported by HDR and DB2 to assist the user in
    deciding whether failover is needed or whether certain database components simply
    require attention. The HDR database processes will report a failure when they
    are unable to communicate. The DB2 database processes will report a failure when
    they detect a fault These are the only DB2 database components that will report
    failures as provided by the DB2 software.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '+   Out of band:

    In this book, out of band refers to operations that can be performed on the primary
    database, and which must be replicated at the standby, but cannot be repeated
    solely based on log records. Such operations are non-logged or completely logged
    at the primary. In order to replicate such an operation, its results (a copy of
    the new or modified object, for example) must be passed to the standby by some
    other means. This "other means" is considered to be out of band with respect to
    the log stream. Note that this use of the term is different from the meaning of
    out of band in TCP/IP. Thus, it is preferable to refer to the specific operations
    or to non-logged or not completely operations to avoid any confusion.


    +   Outage period:

    The outage period is the amount of time it takes to failover DB2 functionality
    from a broken DB2 primary database to the standby. This period of time starts
    from the point at which failover is initiated to the point that DB2 functionality
    is restored. A client connecting to the DB2 database, it will be seen as a connection
    failure, at which point retry logic should be working to ensure that the transaction
    is not lost.


    +   Peer state:

    After the standby catches up with in-memory logs on the primary, HADR enters the
    Peer state, in which the primary ships the log page to the standby whenever it
    flushes a log page to the disk. The log pages are replayed on the standby as they
    arrive. The pages are also written to local log files on the standby that the
    primary and standby have identical log sequences. Transaction commits on the primary
    wait for acknowledgment messages from the standby or at least for a successful
    return of log send calls, depending on the user-specified log shipping mode level.


    +   Primary (database):

    This is the principal (master) copy of the database. Applications apply updates
    to the primary database and those updates are propagated to the standby via log
    shipping.


    +   Primary reintegration:

    In cases, the old primary database can rejoin a HADR pair after a failover. Because
    the old standby is now the primary, the old primary can only join as a standby.
    This is called primary reintegration. After primary reintegration, a rollback
    can be performed optionally.


    +   Standby (database):

    This is a copy of the primary database. It is not updated directly by the application.
    All updates occur by rolling forward log data generated on the primary database.'
  merge: -1
  pgno: 55
- img_proc: true
  md: '+   Split brain:


    This refers to the condition of having both databases in an HADR pair acting as
    primaries simultaneously. Such a situation leads to the databases becoming inconsistent
    with each other and is thus to be avoided at all costs. HADR will never automatically
    make state transitions that result in two primaries, and when the pair communicate
    with each other (that is, the network connection between them is operating properly),
    they will also prevent a user from creating this situation in an enforced takeover.
    HADR will also not allow an inactive primary database to be activated without
    a successful connection to a standby within the HADR_TIMEOUT period.


    However, split brain is possible in a situation where the user instructs the current
    standby to become a primary while the communications between the pair is down,
    if either the current primary is still active or if it is brought back to the
    non-HADR, or standard mode. There is nothing HADR can do to prevent this, in order
    for HADR to achieve its main HA goals, there must be some way to change the standby
    into a primary in situations where the original primary or the network is operative
    (for example, the building housing the primary burns down, but the standby is
    safe in another building), so an HADR standby must obey the orders of the user
    to become a primary if it is no longer able to talk to the original primary.


    +   Standard (database):


    In the context of HADR, standard means a normally operating non-HADR database.
    That is, a database not using the HADR feature, and therefore not operating in
    either the primary or the standby mode.


    +   Synchronous mode:


    In the Peer state, the primary will not consider a transaction as committed until
    it gets an acknowledgment message from the standby confirming that the relevant
    log data has been received and written to the disk on the standby. Therefore,
    if a transaction is committed on the primary, it is guaranteed to be persistently
    stored in the standby''s log file. Even if the standby crashes before it is able
    to replay the log, it can still replay it from its own log file when it restarts.
    There will be no transaction loss in a failover as long as the primary was in
    Peer state at the time of the failure.


    +   Near-synchronous mode:


    In the Peer state, the primary will not consider a transaction as committed until
    it gets an acknowledgment message from the standby confirming that the relevant
    log data has been received and written to the main-memory of the standby. There
    is a very small chance that some transaction data would be lost should a failover
    occur.'
  merge: -1
  pgno: 56
- img_proc: true
  md: '+   Asynchronous mode:

    In the Peer state, the primary will successfully submits the relevant log data
    to the network. The primary does not wait for any acknowledgment message that
    the log data was received. There is a high chance that transaction data would
    be lost should failover occur.


    +   Takeover:

    Takeover is the act of the HADR standby taking over control of the database from
    the old primary server and becoming the new HADR primary. Takeover is always initiated
    from the standby. If the primary can be reached over the network in an unforced
    takeover, the standby will ask it to switch to standby, performing cooperative
    role switching. Otherwise, the standby takes takeover unilaterally (with the risk
    of dual primary/split brain). Failback is a form of cooperative role switching
    performed after first reintegrating the repaired server as a standby. Note that
    HADR takeover can be performed outside the context of failover and failback. A
    user might want to switch HADR roles for rolling upgrade, which does not involve
    a failure at all.


    +   Engine dispatchable unit (EDU):

    The engine dispatchable unit (EDU) can be implemented either as a process or a
    thread, depending on the platform architecture.


    +   Primary reintegration:

    In some cases, the old primary database can rejoin an HADR pair after a failover.
    Because the old standby is now the primary, the old primary can only join as a
    standby. This is one form of HADR reintegration. After reintegration, a failback
    can optionally be performed. See 3.4.5, “Re-establishing HADR after failover”
    on page 86 for steps involved in reintegration.'
  merge: -1
