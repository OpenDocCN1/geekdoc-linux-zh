  md: '# Q replication


    In this chapter we provide an introduction to Q replication and a simple overview
    of its structure. We also give you step-by-step instructions for setting up a
    unidirectional Q replication.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# 11.1 Introduction


    Q replication is a replication solution that uses WebSphere MQ message queues
    to transmit transactions between source and target databases.


    Q replication is divided into three types:


    +   - Unidirectional


    In unidirectional Q replication, changes are captured at the source and replicated
    to the target. Unidirectional Q replication can happen from one source to one
    or many targets. In unidirectional replication, typically the target is used for
    read-only.


    +   - Bidirectional


    In bidirectional Q replication, two tables on two servers replicate each other.
    Changes made on either table are replicated to the corresponding table. You cannot
    replicate a subset of rolls, and each table must have the same number of columns
    and data types for those columns, though you can have different schema and table
    names.


    +   - Peer-to-peer


    In peer-to-peer Q replication, tables are replicated between two or more servers.
    As in bidirectional Q replication, the replicated tables must all be of the same
    structure, though each table can have its own schema and table name.


    Q replication can be set up in many different configurations. You can use Q replication
    for replication between databases on the same server or remote servers. You can
    set up a one-to-many relationship or many-to-one relationship.


    For more details on different Q replication configurations, refer to the DB2 Information
    Center:


    http://publib.boulder.ibm.com/infocenter/db21uw/v9/index.jsp


    We describe the basic structure of Q replication:


    +   - A Q Capture program that runs on the source server reads the DB2 recovery
    log for changes to the source tables specified for replication. It then places
    the messages in a queue called send queue. The Q Capture program uses a set of
    DB2 tables called Q Capture Control tables. The capture control store information
    about the replication sources, corresponding targets, MQ queues being used, and
    other data.'
  merge: -1
  pgno: 333
- img_proc: true
  md: '+   Q subscriptions define the source and target tables to be replicated. Q
    subscriptions need a replication queue map to identify the WebSphere MQ queues
    used for sending and receiving transactions.


    +   The Q Apply program runs on the target server, receiving the messages and
    applying the transactions to the target tables. The Q Apply program also has a
    set of DB2 tables Q Apply Control tables.


    In the rest of this chapter we focus on a unidirectional Q replication setup.


    # 11.2 Unidirectional setup


    This section provides a step-by-step example of a unidirectional replication setup
    between two remote servers. See Figure 11-1.


    ![](img/a97b7826c3cf736045d80f48b5520a20_334_0.png)


    Figure 11-1 Unidirectional setup diagram'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'The following tasks must be completed for setting up a unidirectional Q replication:


    +   1. Set up the database on both the source and target database servers.

    2. Set up WebSphere MQ objects on the source server and the target server.

    3. Start the listener and the channel on the source and the target.

    4. Optional: Test the queues.

    5. Create the Q Capture Control tables.

    6. Create the Q Apply Control tables.

    7. Create a Q subscription.

    8. Configure target to source server connectivity.

    9. Start Q Capture.

    10. Start Q Apply.


    In our example, we used two Windows servers running DB2 Version 9.1 and WebSphere
    MQ 6.0. The step-by-step process to set up a unidirectional replication with remote
    servers is as follows:


    +   1. Initial database setup on the source and the target server:

    na. The source database (SAMPLE in our test case) must have the database configuration
    parameter LOGRETAIN set to RECOVERY.

    ```

    db2 update database configuration for sample using LOGRETAIN RECOVERY

    ```nA backup will be required if you are setting the LOGRETAIN to recovery for
    the first time.

    nb. Identify your target database. For our example, the target database is TGTDB.

    2. Setup of WebSphere MQ objects on the source server:

    na. Create a queue manager QMGR1 from the command window:

    ```

    strmqm QMGR1

    ```

    b. Start the Q manager that you have just created:

    ```

    strmqm QMGR1

    ```

    c. To create the needed MQ objects, run the following command with the example
    script shown in Example 11-1. Remember to replace the IP and port number with
    your required IP and port number:

    ```

    runmqsc QMGR1 < QMGR1.DEF

    ```'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'Example 11-1 QMGR1.DEF


    **This script creates the following objects within queue manager QMGR1

    at at the source:


    **A local administration queue

    DEF QLOCAL(''SAMPLE_ADMINQ'') DESCR(''Capture Admin Queue'') REPLACE


    **A local restart queue

    DEF QLOCAL(''SAMPLE_RESTARTQ'') DESCR(''Capture Restart Queue'') REPLACE


    **A remote queue definition for Q Queue to put data messages

    DEF REMOTE(''SAMPLE2TGTDBQ'') XMITQ(''QMGR2'') RNAME(''SAMPLE2TGTDBQ'')

    RQNAME(''QMGR2'') REPLACE


    **A local transmission queue

    DEF QLOCAL(''QMGR2'') USAGE(XMITQ) REPLACE


    **A sender channel from QMGR1 to queue manager QMGR2 using transmission

    **queue

    **Replace the ip with your ip and the port number with your port number

    DEF CHANNEL(''QMGR1.TO.QMGR2'') CHLYPE(SDR) TRPTYPE(TCP)

    CONNAME(''9.43.86.78 (14116)'') XMITQ(''QMGR2'') REPLACE


    **A receiver channel from QMGR2

    DEF CHANNEL(''QMGR2.TO.QMGR1'') CHLYPE(RCVR) TRPTYPE(TCP) REPLACE


    +   3. Setup of WebSphere MQ objects on the target server:


    +   a. Create a queue manager with a different name as the source from the command
    window:

    `ctrmqm QMGR2`


    +   b. Start the Q manager that you have just created:

    `stmgr QMGR2`


    +   c. To create the needed MQ objects, run the following command with the example
    script shown in Example 11-2. Remember to replace the IP and port number with
    your required IP and port number:

    `runmqsc QMGR2 < QMGR2.DEF`'
  merge: -1
  pgno: 336
- img_proc: true
  md: "# Example 11-2 QMGR2.DEF\n\n**This script creates the following objects within\
    \ queue manager QMGR2\n**at the target:\n\n```\n**A remote queue definition that\
    \ points to the administration queue at\n**the source**\nDEF REMOTE('('SAMPLE_ADMINQ')\
    \ XMITQ('QMGR1') +\nRNAME('SAMPLE_ADMINQ') QNAME('QMGR1') REPLACE\n```\n\n```\n\
    **A model queue definition for spill queues that hold data messages\n**from Q\
    \ Capture during the load**\nDEF MODEL('IBMQ.SPILL.MODELQ') DEFSOPT(SHARED) +\n\
    MAXDEPTH(500000) MGLDVSQ(FIFO) DETYPE(PERMDYN) REPLACE\n```\n\n```\n**A local\
    \ queue for Q Apply to get data messages from the Q Capture\n**program at the\
    \ source**\nDEF QLOCAL('SAMPLEGTDBQ') REPLACE\n```\n\n```\n**A local transmission\
    \ queue**\nDEF QLOCAL('QMGR1') USAGE(XMITQ) REPLACE\n```\n\n```\n**A sender channel\
    \ from QM2 to queue manager QMGR1 using transmission\n**queue QMGR1**\n**Replace\
    \ the ip with your ip and the port number with your port number\nDEF CHANNEL('QMGR2.TO.QMGR1')\
    \ CHLYPE(SDR) TRPTYPE(TCP) +\nCONNAME('9.43.86.75(1415)') XMITQ('QMGR1') REPLACE\n\
    ```\n\n```\n**A receiver channel from QMGR1**\nDEF CHANNEL('QMGR1.TO.QMGR2') CHLYPE(RCVR)\
    \ TRPTYPE(TCP) REPLACE\n```\n\n+   4. Start the listener and the channel on the\
    \ source and the target:\n   a. On the source, from a command window start the\
    \ listener:\n      RUNMQSR -T TCP - QMGR1 -P 1415\n   b. On the target, from a\
    \ command window, start the listener:\n      RUNMQSR -T TCP - QMGR2 -P 1416\n\
    \   c. On the source, from a command window, start the channel:\n      To start\
    \ the channel, first use the RUNMQSC command to start the\n      interactive MQSC\
    \ command line:\n      RUNMQSC QMGR1\n      This command starts the channel:\n\
    \      START CHANNEL(QMGR1.TO.QMGR2)"
