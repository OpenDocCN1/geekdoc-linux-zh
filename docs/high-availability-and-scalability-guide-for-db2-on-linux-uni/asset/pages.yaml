  md: '# HADR introduction


    Organizations today face a tough challenge in choosing an appropriate high availability
    solution that meets their business requirements and IT budgets.


    Until recently, such solutions were based on proprietary systems, and involved
    significant investment in capital, time, and resources to assemble, integrate,
    test, manage, and support. This scenario has been changed dramatically with the
    introduction of software-based high availability solutions.


    In this chapter we provide a general overview of an IBM software-based availability
    solution: DB2 High Availability Disaster Recovery (HADR).


    We cover the following topics:


    +   * High availability overview

    * HADR overview

    * Why HADR?

    * HADR architecture

    * Terminology'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 2.1 High availability overview


    High availability (HA) is the term used to describe systems that run and are available
    to customers more or less the time. For this to occur:


    +   - Transactions must be processed efficiently, without appreciable performance
    degradations (or even loss of availability) during peak operating periods.


    +   - Systems must be able to recover quickly when hardware or software failures
    occur, or when disaster strikes. DB2 has an advanced continuous checkpointing
    system and a parallel recovery capability to allow for extremely fast recovery.


    +   - Software that powers the enterprise databases must be continuously running
    and available for transaction processing. To keep the database manager running,
    you must ensure another database manager can take over if it fails. The concept
    of moving functionality from one server to another is variously known as failover
    or takeover, largely depending on the software vendor''s terminology. Failover
    allows for the automatic transfer of workload from one system to another when
    there is a hardware failure.


    # 2.1.1 Solutions for high availability


    More than ever, customers are demanding a 24x7 operating environment. To implement
    this requirement, organizations must give high availability and disaster recovery
    a great deal of consideration.


    Many customers use a hardware high availability (HA) approach, where all the application
    updates on one machine are synchronized to a backup machine. However, there are
    many advantages of using a software-based approach, chief among them lower cost.
    IBM provides software-based HA solutions such as DB2 HADR, WebSphere Information
    Integrator Q Replication, SQL Replication, and HA clustering software — HACMP
    and Tivoli System Automation (TSA).


    HADR is one among several replication solutions offered in the DB2 product family.
    WebSphere Information Integrator and the DB2 database system include SQL replication
    and Q replication solutions that can also be used, in some configurations, to
    provide high availability. These functions maintain logically consistent copies
    of database tables at multiple locations. In addition, they provide flexibility
    and complex functionality such as column filtering, data transformation, updates
    to any copy of a table, and can also be used in partitioned database environments.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# 2.1.2 Types of high availability


    There are two types of high availability:


    +   - Continuous availability:

    Continuous availability requires that the database engine be available for processing
    SQL transactions without any downtime. Such availability is usually implemented
    in mission-critical business applications. For this to happen, total redundancy
    is required, which means you must have two systems that are fully independent
    of each other, both in terms of hardware and software.


    +   - Failover availability:

    Failover availability is differentiated from continuous availability by the fact
    that for some period of time, however small, the database engine or other critical
    server function is not available for transaction processing. The essential components
    for this type of solution are:

    - Primary and standby systems

    - Failure detection

    - Data source movement


    In the context of providing continuity for a database management system, the two
    systems (primary and standby), each must have access to copies of the database
    data, which clients can normally access from the primary. When the failure detection
    mechanism is triggered by a critical resource breaking on the primary, a failover
    takes place. In the failover process, the data source is moved from the primary
    to the standby system, and clients start accessing the data through that system.
    It should be pointed out that this process is seamless from the clients'' perspective.
    Some solutions allow for the data source to be replicated, such that the primary
    and the standby data is stored separately. Others have the data in a single location,
    which is shared between a primary and a standby system, but only accessed by one
    system at any given time.


    This book focuses on solutions providing failover availability, although to some
    extent, certain scalability solutions also provide a type of continuous availability.


    # 2.2 HADR overview


    DB2 High Availability Disaster Recovery (HADR) is a database replication feature
    that provides a high availability solution for both partial and complete site
    failures. A database server can fail from any number of factors: environmental
    (power/temperature), hardware, network connectivity, software, or human intervention.'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'Recovery from the loss of a database server in a standard installation can
    require a machine reboot and database crash recovery, which will interrupt the
    database services. By using HADR, you can minimize the downtime to only a few
    seconds. HADR protects against data loss by continually replicating data changes
    from a source database, called the primary, to a target database, called the standby.
    Furthermore, you can seamlessly redirect clients that were using the original
    primary database to the standby database (which becomes the new primary database)
    by using Automatic Client Reroute (ACR) and retry logic in the application. This
    seamless redirection is also possible using software solutions discussed in other
    chapters, which can manage IP address redirection.


    Figure 2-1 illustrates the concept of HADR, where DB2''s log buffer is used as
    a single source for all changes to the DB2 primary database.


    ![](img/a97b7826c3cf736045d80f48b5520a20_43_0.png)


    Figure 2-1 HADR overview


    HADR transmits the log records from the primary database server to the standby
    server. The HADR standby replays all the log records to its copy of the database,
    keeping it synchronized with the primary database server. The standby server is
    in a continuous rollover mode and is in a state of near-readiness, the takeover
    to the standby is extremely fast. Applications can only access the primary database
    and have no access to the standby database.


    High Availability and Scalability Guide for DB2 on Linux, UNIX, and Windows'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'Using two dedicated TCP/IP communication ports and a heartbeat, the primary
    and the standby keep track of where they are processing currently, and the current
    state of replication; perhaps most importantly, whether currently the standby
    database is logically the same as the primary (known as HADR Peer state). In the
    Peer state, the HADR primary retrieves log data from its in-memory log buffer
    at the time the log pages are flushed to the primary''s disk and sends them to
    the standby through TCP/IP.


    As mentioned, HADR communication between the primary and the standby is through
    TCP/IP which enables the database to be replicated to a remote geographical site.
    This allows the database to be recovered in case of a disaster at the primary
    database server site. The HADR solution provides both HA and disaster recovery
    ability. As you can appreciate, HADR, with the potential for no loss of committed
    transaction data, provides an incomparable improvement on conventional methods
    for DB2 disaster recovery, which often means losses in terms of committed transaction
    data.


    If the primary system is not available, a takeover HADR by force operation will
    convert the standby system to be the new primary system. Once the maintenance
    or repair is done in the old primary system, you can bring the original DB2 up
    and return both DB2 servers to their primary and standby roles after reintegration
    of HADR.


    In a DB2-ready environment, HADR is easy to set up and configured. The bottom
    line is that HADR is an efficient method of supporting high availability disaster
    recovery.


    # Why HADR?


    The reasons to choose HADR as a solution are follows:


    +   - Ultra-fast failover capability

    - Negligible impact on performance

    - Easy to set up and monitor

    - Rolling upgrades without interruption between non-major versions or changes
    requiring server recycling, and reduced change windows for upgrades

    - Transparent failover and failback for applications

    - Easy integration with HA clustering software

    - Dramatically improved disaster recovery compared to conventional methods'
  merge: -1
