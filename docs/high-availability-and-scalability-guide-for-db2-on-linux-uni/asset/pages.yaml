    # 1.4.3 DB2 HADR


    DB2 High Availability and Disaster Recovery (HADR) is a feature in DB2 Enterprise
    Server allowing replication of any logged database to a local remote location.


    DB2 HADR works in a similar fashion to the storage mirroring solutions, but all
    the work is made inside DB2 at the software level. A DB2 HADR primary database
    uses internal processes to ship database logs to a HADR standby database. A process
    at the standby server replays these logs directly to the standby database. The
    standby database can be switched on in the event of a disaster, or whenever the
    primary requires to be temporarily offline for scheduled downtime.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# Advantages


    The advantages of using DB2 HADR include:


    +   - Ultra™ fast failover capability

    - Negligible impact on performance

    - Easy to set up and monitor

    - Rolling upgrades without service interruption between non-major versions or
    changes requiring server recycling, and reduced change windows for other upgrades

    - Transparent failover and failback for applications

    - Easy integration with high availability (HA) clustering software

    - Dramatically improved disaster recovery compared to conventional methods


    # When to use


    You can use DB2 HADR:


    +   - When there is a requirement for a disaster recovery site with fast failover.

    - No committed transaction data loss, where the replica (standby) database must
    be continually kept up-to-date with the primary. This means that you have the
    benefits of two-phase commit between separate systems, without the crippling performance
    overheads of synchronous update activity.

    - No downtime for system changes windows. HADR allows DB2 FixPak applications
    and certain configuration parameter changes to both databases, and operating system
    maintenance/recycling windows with no downtime for DB2 clients.


    For more information on DB2 HADR, refer to:

    DB2 9.1 Data Recovery and High Availability Guide and Reference, SC10-4228.


    # 1.5 Hybrid use of shared disk cluster and HADR


    For a local HA solution, a disk shared cluster with clustering software is the
    most well known configuration. HADR provides an HA solution that can be used in
    a database server that is physically in the same room or remotely. This section
    describes the combination (hybrid) of these two solutions and how this hybrid
    system strengthens high availability of the database system.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# 1.5.1 Overview


    There are several considerations for a shared disk cluster. Because resources
    are shared between the cluster nodes, a disk shared configuration cannot provide
    services or planned maintenance of the shared storage in:


    +   - Crash or maintenance of the shared storage device.

    - Maintenance requires to stop the cluster software.

    - FixPak update or configuration change that requires to stop database instance.

    - Site disaster


    By adding HDR standby database to the shared disk cluster, continuous service
    is possible even in the cases mentioned previously. Here we call this system a
    *hybrid system*. Figure 1-7 illustrates a hybrid high availability system with
    shared disk cluster and HDR.


    ![](img/a97b7826c3cf736045d80f48b5520a20_36_0.png)


    In this configuration, there are three nodes with different roles:


    +   - Active primary node:

    This node provides service with shared disks. DB2 instance is running on it. Also,
    it plays a role of HADR primary database, transferring log records to standby
    database.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '+   Passive (local) standby node:

    If the active primary node fails, the local standby node takes over the resources,
    including shared disk.


    +   HADR (remote) standby node:

    The node where the HADR standby database is running. When both active primary
    node and the passive standby node are not available, this node can provide service.
    HADR standby can be placed in the same local site as the other nodes, but it must
    be in a remote site for the purpose of disaster recovery.


    # 1.5.2 Case study of hybrid system


    The following are the operations required of a hybrid system when possible failure
    or maintenance in the database system occurs:


    +   Failure of the primary node:

    The resource group, including the shared disk, is automatically failed over to
    the passive standby node, and the service is restarted. After failover, the HADR
    connection is re-established with the new active primary (passive standby), as
    shown in Figure 1-8.


    ![](img/a97b7826c3cf736045d80f48b5520a20_37_0.png)'
  merge: -1
  pgno: 37
- img_proc: true
  md: '+   Crash or planned maintenance of the shared storage device:


    If the shared disk is unavailable for any reason, the shared disk cluster cannot
    continue its services. In this case, the service can be taken over to the HADR
    standby. Even when the shared disk has to be stopped for the purpose of maintenance,
    such as upgrading the microcode of storage devices, or for restructuring the storage
    configuration. You do not have to stop database services for applications, as
    shown in Figure 1-9.


    ![](img/a97b7826c3cf736045d80f48b5520a20_38_0.png)


    Figure 1-9 Crash or planned maintenance of shared storage device


    +   Cluster software maintenance:


    When you are required to stop the cluster software to make some configuration
    changes and a failover test is required, you can fail over the services to the
    HADR standby database. Meanwhile, you can check the behaviors of the cluster software
    without any impact on the application services.


    +   Upgrading DB2 FixPak (Rotating upgrade):


    You can upgrade DB2 FixPak with only an extremely short service downtime. Complete
    the following steps to upgrade DB2 FixPak:


    +   a. Update FixPak on HADR standby and re-establish the HADR connection.


    +   b. Fail over to HADR standby. The downtime for the application is just a few
    seconds of taking over the HADR role.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'c. Update DB2 FixPak in the shared disk cluster (active primary node and passive
    standby node).


    d. Switch the HADR role back to the local cluster.


    +   * Using standby database as staging environment:


    It is frequently necessary to test new applications or new database functions
    on a database, which has the amount of data (or data itself) similar to the product
    environment. After the standby database is detached from the HADR pair, it is
    available for a staging environment with complete data replicated from the product
