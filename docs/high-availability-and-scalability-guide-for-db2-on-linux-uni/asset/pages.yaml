    ![](img/a97b7826c3cf736045d80f48b5520a20_397_0.png)


    Figure 12-13 Partition 1 is failed over server 1 to Hot standby server 4


    The failover script updates the db2nodes.cfg and restarts partition 1 on Server
    4. Example 12-1 shows a portion of the db2nodes.cfg file before and after the
    failover.


    Example 12-1 db2nodes.cfg


    Before:

    Server1 0

    Server2 0

    Server3 0

    Server4 0


    ```

    db2start dbpartitionnum restart hostname Server4 port 1

    After:

    Server4 1

    Server2 0

    Server3 0

    Server4 0

    ```'
