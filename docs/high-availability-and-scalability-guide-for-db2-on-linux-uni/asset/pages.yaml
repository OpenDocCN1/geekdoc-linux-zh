- img_proc: true
  md: 'If your environment is not tolerant of performing frequent backups, even if
    they are online, then take whatever steps are necessary to get a window in which
    to perform one as a starting point for the HADR change window.


    If you want to reduce the number of steps performed inside the HDR GUI wizard
    as much as possible, in addition to changing from circular to linear/archive logging,
    you can catalog entries for the remote system on both the servers beforehand:


    +   - TCPIP NODE for the DB2 Admin Server

    - TCPIP NODE for the DB2 instance

    - DATABASE alias for the DB2 database


    Example 3-1 and Example 3-2 show the commands to catalog the database and server.


    # Example 3-1 Commands to catalog remote entries on primary server (LEAD)


    ```

    db2 catalog admin tcpip node POLONIUM remote x.x.x.x remote_instance

    db2inst1 system POLONIUM

    db2 catalog tcpip node DB2_POL remote x.x.x.x server 50001

    remote_instance db2inst1 system POLONIUM

    db2 catalog database SAMPLE AS SAM_POL at node DB2_POL

    ```


    # Example 3-2 Commands to catalog remote entries on standby server (POLONIUM)


    ```

    db2 catalog admin tcpip node LEAD remote x.x.x.x remote_instance

    db2inst1 system LEAD

    db2 catalog tcpip node DB2_LEAD remote x.x.x.x server 50001

    remote_instance db2inst1 system LEAD

    db2 catalog database SAMPLE AS SAM_LEAD at node DB2_LEAD

    ```


    One final (optional) consideration concerns the host and port entries for each
    server. The HADR GUI wizard will attempt to add two port entries for HADR into
    /etc/services, but you can arrange to have them added beforehand, especially if
    your local operating system security administrator will not give the DB2 instance
    ID enough authority to do so. Remember that if you do, you will be required to
    override the default entries that appear in the wizard, as it tries to auto-increment
    the port numbers to something that does not already exist in the /etc/services
    file.'
