  md: '# Preface


    This IBM® Redbooks® publication, intended for IT managers, IT architects, DBAs,
    application developers, and other data server professionals, offers a broad understanding
    of DB2® high availability and scalability options. The book is organized as follows:


    +   - Chapter 1 provides an overview of some high availability technologies and
    products that can help you increase the availability of the DB2 database and applications.
    We discuss some scenarios where these technologies are suitable for your enterprise.


    +   - Chapter 2 provides a general overview of the DB2 high availability feature,
    High Availability Disaster Recovery, including HADR architecture, terminologies,
    and HADR advantages.


    +   - Chapter 3 contains steps to set up a High Availability Disaster Recovery
    environment using both command line and Graphical User Interface. The chapter
    covers the basic operations, including START HADR, STOP HADR, and TAKOVER HADR
    commands. It also provides troubleshooting tips.


    +   - Chapter 4 gives a description of administration tasks related to a High
    Availability Disaster Recovery system. The methods of acquiring the status of
    HADR are described, including get snapshot, db2pd, table functions, and db2diag.log.


    +   - Chapter 5 describes an important DB2 feature automatic client recovery (ACR).
    ACR enables a DB2 client application to recover from a loss of communications
    so that the application can continue its work with minimal interruption.


    +   - Chapter 6 discusses the DB2 database and manager configuration parameters
    and registry variables that affect HADR. It also discusses the import factors
    to be considered when implementing a HADR solution to get the optimum HADR performance.


    +   - Chapter 7 focuses on how to perform DB2 FixPak applications with no-downtime
    benefit HADR brings, and DB2 version upgrades or migrations with HADR databases.
    This chapter also explores the considerations when performing changes to other
    system components or updating database configuration parameters.


    +   - Chapter 8 introduces how to integrate DB2 in a High Availability Cluster
    Multi-Processing (HACMP™) environment. It provides the base management concepts
    with recommendations and considerations to reduce the time consumed for failover.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '+   Chapter 9 provides the steps to set up a high available DB2 environment
    with Microsoft® Windows® Cluster. It also provides the fundamental concepts of
    Microsoft Windows Cluster Server architecture.


    +   Chapter 10 discusses how to configure HADR with HACMP or TSA to enable automating
    HDR takeover. It includes the setup procedures of automating HADR takeover with
    HACMP and TSA.


    +   Chapter 11 gives an introduction to Q Replication and a simple overview of
    the structure. This chapter provides step-by-step instructions for setting up
    unidirectional replication.


    +   Chapter 12 introduces the Database Partitioning Feature, which enables DB2
    to scale out to support very large databases and increased parallelism for various
    tasks. This chapter includes the procedures of installing and scaling DB2 databases.


    +   Chapter 13 discusses the improved large database management feature: table
    partitioning, introduced in DB2. This new feature allows DBAs to divide table
    data into partitions and stored in one or multiple table spaces. This new feature
    provides easier management, improved performance, and greater scalability for
    large databases.


    # The team that wrote this Redbooks publication


    This book was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Poughkeepsie Center.


    Whei-Jen Chen is a Project Leader at the International Technical Support Organization,
    San Jose Center. She has extensive experience in application development, database
    design and modeling, and DB2 system administration. Wei-Jen is an IBM Certified
    Solutions Expert in Database Administration and Application Development as an
    IBM Certified IT Specialist.


    Chandraamouli Chandasekaran is a consultant at the IBM Toronto Lab team, where
    DB2 UDB for Linux®, UNIX®, and Windows is developed. He is a member of the Data
    Management Partner Enablement organization where he works with IBM business partners
    to migrate applications to DB2 and perform performance tuning. Chandra is a DB2
    expert in both DB2 administration and application development.


    Don Gning is an IBM Certified Database Administrator for IBM Integrated Technology
    Delivery, Server Systems Operations. He holds a bachelor''s degree in Business
    Information Systems, as well as, a bachelor''s in Finance from Utah University,
    Utah. He has five years experience as a production system DBA.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'Gustavo Castro is an Advisory Software Engineer. He has worked for IBM Corporation
    the last 5 years as an Advanced Support Engineer for Information Management products
    including Informix® and database engines in the areas of Performance, Backup/Recovery,
    and crash analysis.


    Paul Descovich works in a DB2 Systems Support role for IBM Services Australia,
    where most of his time is spent installing, configuring, and maintaining DB2 products.
    The rest of his time is spent motivating architects to determine how DB2 should
    be implemented on new servers. Paul started out in application programming for
    DB2 version 2 release 2 on MVS™ in 1991, then DB2 System Support and DBA work
    from 1993, joining MVS in 1999. Since 2000, his work has become almost exclusively
    related to DB2 on Linux, UNIX, and Windows platforms.


