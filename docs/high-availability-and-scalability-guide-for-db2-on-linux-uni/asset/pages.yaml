    # HADR setup


    In this chapter we describe the steps to set up a High Availability Disaster Recovery
    (HADR) environment using both command line and Graphical User Interface (GUI).
    We cover the basic operations, including START HADR, STOP HADR, and TAKEOVER HADR
    commands. We also provide troubleshooting tips.'
