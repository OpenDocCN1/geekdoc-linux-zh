  md: '# 7.1 DB2 FixPak rolling upgrades


    HADR gives you high availability while applying DB2 FixPaks through rolling upgrades.
    Your database down time need only be literally momentary while you are switching
    roles between your database servers. With properly written applications using
    standard retry logic and handling of message SQL30108N if you are using Automatic
    Client Route (ACR), this effectively means no loss of data and no real realtime.


    In this section we provide examples of a FixPak on a Windows server to illustrate
    the procedure through Graphical User Interface (GUI) tools. We also give you an
    example of a rolling upgrade performed with the DB2 Command Line Processor (CLP).


    These are the steps to perform a rolling upgrade:


    +   1. Check your system''s HADR status.

    2. Apply FixPak on the standby system.

    3. Switch roles from the standby system.

    4. Apply the FixPak in the old primary system.

    5. Switch roles back to the original primary.


    # 7.1.1 Applying DB2 FixPak on Windows operating systems


    In this section, we describe the procedure to apply DB2 FixPak on Windows. Figure
    7-1 illustrates the rolling upgrade performed in our Lab environment.


    We used two servers, PUGET and FAROE. Both systems have the database SAMPLE, where
    PUGET is initially set up to be the primary HADR server, and FAROE is initially
    the standby server. In this example we upgraded from DB2 for LUW Version 8.2 FixPak
    12 to FixPak 13, using the Graphical User Interface (GUI) as much as possible.'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'Figure 7-1 illustrates the rolling upgrade we performed.


    ![](img/a97b7826c3cf736045d80f48b5520a20_184_0.png)


    Figure 7-1 Rolling upgrade


    The steps to apply the FixPak are as follows:


    +   1. Check your system''s HADR status.


    This step is a pre-requisite check; first your DB2 administrator ID (db2admin)
