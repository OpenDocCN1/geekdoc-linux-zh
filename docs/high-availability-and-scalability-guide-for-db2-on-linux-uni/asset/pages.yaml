  md: "The Q Capture program runs on the source server, and reads DB2 recovery logs\
    \ for changes in the source data. These changes are then written to the WebSphere\
    \ MQ queues. The Q apply program runs on the target server and receives the changes\
    \ from the queues and writes to the targets.\n\nQ replication is divided into\
