- img_proc: true
  md: '# Role


    This field indicates the database snapshot is run against. The database role can
    be either Primary or Standby.


    # State


    The status of HADR state will depend on which server you are running the snapshot
    command. A description of each state is given here:


    +   Possible states on the primary database are as follows:


    +   - Peer:


    The primary is communicating with its standby and is shipping log buffer flushes.


    +   - Remote catchup:


    The primary is communicating with its standby and is shipping old logs.


    +   - Remote catchup pending:


    The primary is not shipping any logs (old or new) to the standby. The standby
    is trying to establish a connection with the primary. While in this state, you
    could potentially have a problem with the connection between the HADR servers.


    +   Possible states on the standby database are as follows:


    +   - Peer:


    Caught up to the tail of the log and is receiving currently-generated data from
    the primary and replaying it.


    +   - Remote catchup:


    Not caught up to the tail of the log, has requested old log data from the primary
    that is not in the standby''s path and is not available through the standby''s
    userexist.


    +   - Remote catchup pending:


    Finished its local catchup phase and is ready to receive log data from the primary.
    While in this state, you could potentially have a problem with the connection
    between the HADR servers.


    +   - Local catchup:


    Performing log replay from log data already on the disk of that system.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# Connection status


    The connection status returns the current connection status between the primary
    and the standby. This can be one of the following three possibilities:


    +   - Connected

    The database is connected to its partner node.


    +   - Disconnected

    The database is not connected to its partner node. If the disconnected status
    is not expected, you should check the status of the other HDRF server either the
    primary or the standby, to determine if there is a database problem, or some network
    issue.


    +   - Congested

    The database is connected to its partner node, but the connection is congested.
    With a congested status, we suggest that you troubleshoot the network to pinpoint
    the problem for the congestion.


    # Heartbeats missed


    Heartbeats are used by the HDRF pair to check each other''s status. If this number
    is zero, all heartbeats have been received. The higher this value the worse the
    connection is in. An HDRF database expects at least one heartbeat message from
    the other database for each quarter of the time interval defined in the HDRR_TIMEOUT
    configuration parameter, or 30 seconds, whichever is shorter.


    For example, if your HDRR_TIMEOUT is set to 40 seconds, the HDRF database expects
    one heartbeat every 10 seconds. If no heartbeats are received in an HDRM_INTERVAL,
    the partner is considered not responding and the connection is closed. In the
    case of a closed connection you must determine the cause; either the other HDRF
    server is having problems or there are network problems. Once the problem is found
    and fixed, you can use the START HDRF command to re-establish the HDRF communication,
    if the logs are synchronized, otherwise you must re-establish HDRF through a restore.


    # Primary and standby log position


    These elements show the status on the log position of both the primary and the
    standby. Sync positions are transmitted from the partner node periodically, these
    may not be accurate. If log truncation takes the place "log running average" would
    not be accurate.


    # Log gap running average


    This element shows the running average of the gap between the primary LSN and
    the standby LSN. The gap is measured in number of bytes. Since this is an average
    number, the value might not be 0 even the systems are in SYNC mode and in Peer
    state.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# 4.3 Monitoring HADR db2pd


    The current state of HADR can be gathered without explicit connection to a database
    using the db2pd command. Note that this command requires SYSADM authority in DB2,
    and also requires that the database be activated in order to get any useful output
    related to HADR.


    Example 4-2 shows the command syntax and monitor element output for the db2pd
    command to get HADR information for the SAMPLE database on our HADR primary server
    (LEAD).


    Example 4-2 Output of db2pd for LEAD (primary)


    ```

    db2inst@lead:~ db2pd -d sample -hadr

    ```


    Database Partition 0 -- Database SAMPLE -- Active -- Up 1 days 01:52:39


    | HADR Information: State | SyncMode | HeartBeatMissed | LogGapRunAvg (bytes)
    |

    |---|---|---|---||

    | Role Primary Peer | Sync 0 | 0 |

    | ConnectStatus ConnectTime | Timeout |

    | Connected | Oct 31 14:37:16 2006 (1162334236) 3 |

    | LocalHost | LocalService |

    | LEAD | DB2_HADR_1 |

    | RemoteHost | RemoteService | RemoteInstance |

    | polonium | DB2_HADR_2 | db2inst |

    | PrimaryFile PrimaryPg PrimaryLSN |

    | S000031.LOG 289 | 0x0000000000890D9F3B |

    | StandByFile StandByPg StandByLSN |

    | S000031.LOG 289 | 0x0000000000890D9F3B'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'Example 4-3 shows the output for the db2pd command to get HADR information
    for the SAMPLE database on our HADR standby server (POLONIUM).


    Example 4-3 Output of db2pd for POLONIUM (standby)


    ```

    db2inst1@> db2pd -d sample -hadr

    ```


    Database Partition 0 -- Database SAMPLE -- Active -- Up 1 days 01:54:36


    HADR Information:

    Role State SyncHeartbeatsMissed LogGapRunAvg(bytes)

    Standby Peer Sync 0 0


    ConnectStatus ConnectTime Timeout

    Connected Tue Oct 31 14:37:16 2006 (1162334236) 3


    LocalHost LocalService

    polonium DB2_HADR_2


    RemoteHost RemoteService RemoteInstance

    LEAD DB2_HADR_1 db2inst1


    PrimaryFile PrimaryPg PrimaryLSN

    S000031.LOG 289 00000000008909F3B


    StandByFile StandByPg StandByLSN

    S000031.LOG 289 00000000008909F3B


    As expected, the db2pd outputs on the HADR primary and the standby differences
    and similarities. In our example (see Example 4-2 on page 101 and Example 4-3
    above), the only noticeable differences are — in addition to having HADR Role
    of Primary and POLONIUM having Standby — that the LocalHost,LocalService monitor
    element values are swapped with RemoteHost and RemoteService.


    In a long-running HADR pair, after numerous log writes and HADR stop/start activity,
    the primary and the standby log information (PrimaryFile,StandByFile,PrimaryPg,StandByPg,PrimaryLSN,StandByLSN)
    can differ. Having said, in an HADR State of Peer, the output for each value shown
    in a db2pd command on the primary must still match the output for that value shown
    in a db2pd command run on the standby at that time. That is, if the db2pd output
    for StandBy on primary was 289, then it should also be 289 for the db2pd output
    for StandByPg on standby, even if PrimaryPg was some other value.


    You may also notice that the LogGapRunAvg value is not 0 bytes, even when HADR
    State is Peer.'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'The log gap running average value actually represents the average of the difference
    between the LSN of the primary and the standby, at the last time the primary and
    the standby databases were communicating. If a primary log is truncated for any
    reason, a gap will appear as the primary moved to the start of the next log and
    the standby is still at the end of the last log. This gap should close after the
    next log write by the primary.


    For more information about db2pd and HADR monitoring, refer to the following sources:


    +   - DB2 9.1 Data Recovery and High Availability Guide and Reference, SC10-4228

    - DB2 9.1 Command Reference, SC10-4226

    - System Monitor Guide and Reference, SC10-4251


    # 4.4 Monitoring HADR: Administrative view and table function


    With DB2 9, a new way to view the various monitor elements within HADR is to use
    either an administrative view, or a table function.


    Monitor elements are the individual attributes for various functions inside DB2
    which are monitored. That is, they have counters or point-in-time status values
    updated as related events occur. Related monitor elements are referred to as logical
    data groups.


    For the HADR logical data group in DB2 9, administrative views and table functions
    allow applications and scripts alike to use simple SQL queries and get a single
    value for each HADR monitor element (or formatted output with multiple columns
    as required) rather than attempting to write complicated string manipulation routines
    or use awk and grep, to strip the output of db2pd or db2 get snapshot for database.'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'Example 4-4 and Example 4-5 show sample syntax to effectively get the same
    result, specifically, the current value of the HADR_STATE monitor.


    Example 4-4 SQL table function to get the current primary HADR_STATE


    ```

    HADR_STATE

    -------

    PEER


    record(s) selected.

    ```


    Example 4-5 SQL Administrative View to get the current primary HADR_STATE


    ```

    > db2 "select HADR_STATE from sysbimadm.snaphadr"n

    ```


    ```

    HADR_STATE

    -------

    PEER


    record(s) selected.

    ```


    Note that these are SQL queries and require a prior connection to the database.
    This means that with current versions of HADR, you are unable to use either administrative
    views or table functions to get the values of the monitor elements for a standby
    database. Attempts to run these commands on the standby result in:


    SQL1024 A database connection does not exist. SQLSTATE=08003


    As you can guess, attempts to connect to a standby database result in:


    SQL176N The command cannot be issued on an HADR standby database. Reason code
    = "1",


    The available monitor elements for the HADR logical data group are shown in Example
    4-6. A full description of each monitor element can be found in DB2 9.1 Administrative
    SQL Routines and Views, SC10-4293.


    Example 4-6 Output of describe table SYSIBADM.SNAPHADR


