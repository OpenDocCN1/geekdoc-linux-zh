    # 7.3 Rolling OS/Application/DB2 configuration parameters


    This section covers high level instructions for database and database manager
    configuration parameters, as well as any operating system (OS) and application
    upgrades. In order to keep your HADR systems optimal, you should apply changes
    to both systems as quickly as possible.


    Note when changing HADR database configurations, DB2 will not allow you to switch
    roles, so this will require a short database outage while you update the parameters
    on the primary server.


    For the primary, this process is not required for those databases or database
    manager configuration parameters which are dynamic - that is, which require no
    recycling of the DB2 database or instance to take immediate effect. For the Istanbul,
    since you cannot connect to the database to perform dynamic configuration parameter
    updating, recycling the database is required to change configuration parameters.
    The listing of these parameters and which are dynamic can be found in DB2 9.1
    Performance Guide, SC10-4222.


