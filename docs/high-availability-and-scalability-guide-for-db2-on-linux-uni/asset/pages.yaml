    GID (Group ID) so that the copy image file generated by the primary instance is
    also accessible from the standby instance. If it is not accessible from the standby
    instance, the table space that includes the table with loaded data will be marked
    as restore pending and cannot accept any more updates. You''ll have to rebuild
    the standby database from the primary.'
