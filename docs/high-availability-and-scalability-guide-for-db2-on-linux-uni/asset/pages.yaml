  md: '# 6.3.13 Log archive and HADR


    Log archive only happens on the primary. If the primary and the standby use log
    archive devices, with takeover back and forth, some log files will be archived
    on one device and others on the other device. Log is never archived on the standby
    database even when you set up USERXIT, LOGARCHMETHOD1 or LOGARCHMETHOD2. The standby
    writes logs it receives from the primary into its local log file. To avoid filling
    the log path, it recycles logs once a file is no longer needed for the purposes
    of crash recovery and takeover readiness.


    For more information, see DB2 Information Center: Administering → High Availability
    → high availability disaster recovery overview → Standby database states.


    # 6.3.14 Database restore consideration


    Following are some considerations for database restore:


    +   - Redirected here is not supported.


    - "Redirected" (restore database ... to) and log directory (restore database ...
    newlog ...) changes are supported. Table space containers created by relative
    paths will be restored to paths relative to the new database directory.


    - Restoring the standby database has certain requirements.


    When creating the standby database by restore from primary database, the restore
    command(s) should leave the database in rollforward pending state, otherwise,
    start HADR as standby will fail with HADR error SQL1767N start HADR cannot complete.
    Reason code = "1". Be sure not to specify the option, without rollforward, when
    you rebuild the standby database.


    # 6.4 Restrictions


    We summarize the HADR restrictions:


    +   - HADR is not supported in a partitioned database environment.

    - The primary and standby databases must have the same operating system type and
    the same version of the DB2 database system, except for a short time during a
    rolling upgrade. It is recommended to have the same operating system version,
    but is not mandatory. A different FixPak is allowed because it is needed for a
    rolling upgrade, but is not recommended for normal operation. When FixPaks are
    different, the primary cannot be a later version, because a later primary may
    generate logs the standby cannot understand.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '+   The DB2 database system release on the primary and standby databases must
    be the same bit size (32 or 64 bit).


    +   Database seed must be identical. The primary and the standby must originate
    from the same database.


    +   The same storage path is required on the primary and the standby. This is
    required so that table spaces can be replicated. The same storage path is often
    achieved by symbolic links.


    +   Reads on the standby database are not supported. Clients cannot connect to
    the standby database.


    +   Log archiving can only be performed by the current primary database.


    +   Self Tuning Memory Manager (STMM) can be run only on the current primary database.


    +   Backup operations are not supported on the standby database.


    +   Circular logging is not supported.


    +   Infinite logging is not supported.


    +   Non-logged operations, such as changes to database configuration parameters
    and to the recovery history file, are not replicated to the standby database.
    LOBs larger than 1 GB can only be defined as non-logged. LOBS which are not logged
    are not replicated, but LOB space is allocated on the standby. The LOBs on the
    standby will have the right size, but the content will be binary zero.


    +   Use of Data Links is not supported.


    +   HADR does not support the use of raw I/O (direct disk access) for database
    log files. If HADR is started through the START command, or the database is activated
    (restarted) with HADR configured, and the raw logs are detected, the associated
    command will fail.'
