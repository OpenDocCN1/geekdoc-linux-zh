    # Command line steps


    Re-establishing (reintegrating) the standby with the primary can be achieved through
    a few command line steps issued by the DB2 user ID:


    +   1. Prepare a database backup to restore the standby with:


    Backup your primary database, online or offline, it does not matter. You might
    wish to compress the backup to save time when transferring it to the remote (standby)
    server, or use a TSM target which the remote server has been authorized to read.
    In our example on Linux, we made a backup of the SAMPLE database on the local
    server (LEAD) to local disk, then use scp to transfer the backup file to the remote
    server (POLONIUM):

    db2 backup database sample online to : /usr/db2/backup compress


    +   2. Transfer your primary database backup file to the remote server:


    For our example, we need to find the name of the backup file; the destination
    of the backup step was /usr/db2/backup. Windows, up to and including DB2 V8, the
    name of the backup files consists of a hierarchy of subdirectories inside the
    database subdirectory. The file name to be copied is the final portion of the
    hmmss timestamp plus a six digit extension indicating the backup sequence number,
    usually .001, unless you prevent concurrent backups. As of DB 2, the backup file
    name on Windows Linux/UNIX, a long file name in a single directory.


    In Example 3-5, Linux server, ls -1 of /usr/db2/backup shows:


    Example 3-5 List database backup files


    ```

    db2inst1@lead: /usr/db2/backup ls -l

    total 53380

    -rw-r-- 1 db2inst1 2006193792 2006-10-05 18:26 SAMPLE.0_db2inst1.NODE0000.CATNO0000.200610051826501

    -rw-r-- 1 db2inst1 2006127904 2006-10-11 13:46 SAMPLE.0_db2inst1.NODE0000.CATNO0000.200610111436301

    -rw-r-- 1 db2inst1 2006127904 2006-10-11 14:31 SAMPLE.0_db2inst1.NODE0000.200610111431201

    -rw-r-- 1 db2inst1 217846272 2006-10-18 15:15 SAMPLE.0_db2inst1.NODE0000.200610181511200

    ```


    The backup file name we want to contain a timestamp with the output of the example
    backup command as follows:


    Backup successful. The timestamp for this backup image : 2006101815112200


    The matching file for us:


    SAMPLE.0_db2inst1.NODE0000.2006101815112200


    The timestamp (200610181511200, in our example), is also used in the restore command
    later, so note it down.


