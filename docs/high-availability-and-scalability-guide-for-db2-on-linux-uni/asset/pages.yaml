    You can see from Figure 9-24 that the DB2 resource is managed by library db2wolf.dll.
    This is the case in version 8.2. In DB2 version 9.1, the resource is managed by
    library db2server.dll located in %WinDir%\MSCS. db2server.dll will in turn invoke
