    # 9.6 Creating a DB2 instance


    We create the single partition ESE instance using the db2icrt utility in the node
    to be used as the initial resource owner in the cluster. In our example, we created
    a DB2 instance in Mocha. The instance name is DB2PERU and the owner of the instance
    is the Domain user db2admin.


    Chapter 9. DB2 with Microsoft Windows Cluster Server 235'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'Figure 9-21 shows the command used to create the instance and the result of
    the command. Note that db2icrt will request the password of the domain user ID
    specified in the -u option.


    The second command db2ilist in the same screen lists the instances in the local
    machine. Use the -w flag in the db2icrt command to set the type of instance to
    a Workgroup server or Enterprise service edition. Additionally, you can use the
    -p option to assign a password to the instance if necessary.


    ![](img/a97b7826c3cf736045d80f48b5520a20_253_0.png)


    Figure 9-21 DB2 instance creation


    If you open the Windows Services (Start → Administrative Tools → Services), you
    should see a new created service that represents the instance.


    In the case of an ESE instance, the name of the service has the suffix <INSTANCE-NAME><NODE
    NUMBER>, for example, DB2-DB2PERU-0.


    In the case of a WSE instance, the name of the service has suffix <INSTANCE-NAME>.
    If we created a WSE instance, the service will be DB2-DB2PERU.


    This name is very important, as it will be the Windows Registry Key of the service.
    This means that the following entries must exist in the Windows registry:


    +   * ESE instance:

    HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\DB2PERU-0

    * WSE instance:

    HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\DB2PERU


    The cluster looks for this entry to start a highly available DB2 instance. This
    is usually the most common problem in setting up DB2 with Windows Cluster. If
    you name the DB2 resource with a name that is different from your entry, the resource
    will not not find the DB2 server and will not start. Renaming the resource will
    not solve the problem and you will have to recreate it.'
  merge: -1
