    # 10.3.2 Setting up HADR with TSA


    This section documents the procedures to set up the topology depicted in

    Figure 10 on page 292. It is a three node topology, in which one node

    (hadr01) hosts the primary database (hadrb) and a second node (hadr02) hosts

    standby. The third node will host the client application, as well as provide

    quorum between primary and standby nodes.


    Your topology does not have to include redundant NICs (eth1 in Figure 10-19 on

    page 292). Redundant NICs allow for recovery from simple outages caused by

    primary NIC failure (eth0). For example, if hadr01 on Figure 10-19 on

    page 292 were to go down for some reason, the IP address that is

    hosting (that is, 9.26.96.85) could be taken over by eth1. In fact, there is an

    opportunity in "Set up highly available IP addresses" on page 299 to make each

    DB2 instance''s (db2inst and db2inst) IP highly available with TSA.


    The letters in front of a command in the following steps designate node(s)

    a command is to be issued to properly set the topology as shown in

    Figure 10 on page 292. The order of the letters also designates the order in

    you should issue a command on each node:


    +   - (P): Primary Database Node (hadr01)

    - (S): Standby database node (hadr02)

    - (H): Heartbeat node (hadr03)'
