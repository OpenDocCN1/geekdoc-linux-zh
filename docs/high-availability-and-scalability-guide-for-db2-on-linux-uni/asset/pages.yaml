- img_proc: true
  md: "# 4.1 Administering HADR systems\n\nThe focus of this section is to give you\
    \ an insight on what is different on an HADR system as far as day-to-day DB2 administration\
    \ goes to. The administration of an HADR system is done mainly on the primary\
    \ server, replicated over to the standby. Regular database maintenance, such as\
    \ backups, REORG, and RUNSTATS, are performed only on the primary. Logged operations\
    \ are replicated to the standby, so it is important to understand what is a logged\
    \ operation as compared to a non-logged operation.\n\n# Replicated operations\n\
    \nThe following operations are replicated to the standby from the primary:\n\n\
    +   - Data Definition Language (DDL)\n  - Includes create and drop table, index,\
    \ and\n- Data Manipulation Language (DML):\n  - Insert, update, or delete\n- Buffer\
    \ pool:\n  - Create and drop\n- Table space:\n  - Create, drop, or alter.\n  -\
    \ Container sizes, file types (raw device or file system), and paths must be identical\
    \ on the primary and the standby.\n- Table space types (DMS or SMS) must be identical\
    \ on both the servers.\n- If the database is enabled for automatic storage, the\
    \ storage paths must be identical.\n- Online REORG:\n  - Replicated. The standby's\
    \ Peer state with the primary is rarely impacted by this, although it can impact\
    \ the system because of the increase in the number of log records generated.\n\
    - Offline REORG:\n  - Replicated, but depends on whether the REORG is re-clustering\
    \ by an index.\n- Re-clustering REORG:\n\nOperations are logged per hundreds or\
    \ thousands of affected rows. The standby may fall behind in this case."
  merge: -1
  pgno: 111
- img_proc: true
  md: '+   - Non-clustering REORG:

    The entire operation is a single record copy generated after REORG on the primary.
    This operation has the greatest impact on the standby''s ability to keep up with
    the primary.


    +   - Stored procedures and user defined functions (UDF):

    - Creation statements are replicated.


    +   - HADR does not replicate the external code for stored procedures or UDF library
    files. In order keep these in synchronization between the primary and the standby,
    it is the user''s responsibility to set these up on identical paths on both the
    primary and the standby servers. If the paths are not identical, invocation will
    fail on the standby.


    # Non-replicated operations


    The following database operations are not replicated by HADR:


    +   - NOT LOGGED INITIALLY tables:

    - Tables created with the NOT LOGGED INITIALLY option specified are not replicated.
    The tables are invalid on the standby and after a takeover, attempts to access
    these tables will result in an error.


    +   - BLOBS and CLOBs:

    - Non-logged Large Objects (LOBs) are not replicated, but the space will be allocated
    and LOB data will be set to binary zeros on the standby.


    +   - Data links:

    - NOT SUPPORTED in HADR.

    - HADR fails when DATALINKS are set to YES


    +   - Database configuration:

    - UPDATE DB CFG is not replicated.

    - Dynamic database configuration parameters can be updated to both the primary
    and the standby without interruption. For the database configuration parameters
    that need a recycle of the database we recommend you follow the rolling upgrade
    steps. See 7.1, “DB2 FixPak rolling upgrades” on page 166.


    +   - Recovery history file:

    - NOT automatically copied to standby.

    - You can place an initial copy of the history file by using a primary backup
    image to restore the history file to the standby using the RESTORE command with
    the REPLACE HISTORY FILE option for example:

    db2 restore database sample replace history file'
  merge: -1
  pgno: 112
- img_proc: true
  md: '- You can also update the history file on the standby from a primary backup
    image by the RESTORE command for example:


    db2 restore database sample history file


    - If a takeover occurs and the standby database has an up-to-date history file,
    backup and restore operations on the new primary will generate new records in
    the history file and blend seamlessly with the records generated on the original
    primary. If the history file is out-of-date or has missing entries, an automatic
    incremental restore operation might not be possible; instead, a manual restore
    operation will be required.


    - We think the recovery history file for the primary database will not be relevant
    to the standby database, as it contains DB2 recovery information specific to that
    primary server; DB2 keeps records of which backup file to use for recovery to
    prior points in time, among other things. In most HADR implementations, the standby
    system will only be used in the primary mode as a temporary measure, while the
    old primary server is being fixed, making the primary version of the recovery
    history file irrelevant; also, because of potentially different log file numbers
    and locations between the primary and the standby, incorrect for use on the standby
    server.


    For information, refer to the following source:

    DB2 9.1 Data Recovery and High Availability Guide and Reference, SC10-4228.


    # Replicating LOAD operations


    The following are LOAD operations that are logged on the primary and sent to the
    standby:


    +   - COPY YES:

    - Data is replicated on the standby by the standby can access the path or device
    specified in the load.

    - Otherwise, the table space is marked bad and future log records for this table
    space are skipped.

    - To avoid forced reintegration of the standby, you can recover the standby table
    space making sure that the path or devices are set correctly and re-run the LOAD
    command with the REPLACE option.

    - If it is not possible to have both server accessing the same path or device,
    you can deactivate the standby database while the load operation is performed,
    perform the load on the primary, place a copy of the output file in the standby
    path, and then activate the standby database. For this situation, also see the
    use of registry variable DB2LOADREC in 6.2, "DB2 HADR registry variables" on page
    143.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '+   NONRECOVERABLE LOAD:


    +   - The equivalent table on the standby will be marked bad and future log records
    regarding this table are skipped.


    +   - The standby database will skip log records that pertain to this table. You
    can choose to re-issue the LOAD command on the primary with the COPY and REPLACE
    options specified to bring the table back, or you can drop the table to recover
    the space.


    +   LOAD COPY NO:


    +   - Load operations with the COPY NO option specified are not supported, so
    the command is automatically converted to LOAD NONRECOVERABLE on the primary.


    +   - In order for a LOAD COPY option to execute on the primary you can set the
    DB2_LOAD_COPY_NO_OVERRIDE registry variable to COPY YES and it converts your LOAD
    commands automatically into LOAD COPY YES. The DB2_LOAD_COPY_NO_OVERRIDE is ignored
    on the standby.


    # Database backup


    Database backup operations in relation to HADR as follows:


    +   - Backup on the standby is NOT allowed.


    +   - Any of the standard database backups are allowed on the primary. If your
    goal is high availability, we recommend utilizing the online backup, in order
    to keep your database available.


    # Database restore


    Database restore operations in relation to HADR are as follows:


    +   - Table space level restore on the primary or the standby is not allowed.


    +   - Redirected restores are not allowed.


    +   - A database restore can be performed on either the primary or the standby,
    but might reset the database to standard mode. In order to restore the database
    mode, the START HADR command with either the AS PRIMARY or AS STANDBY can be used.


    +   - When restoring a database the old standby can be reintegrated by START HADR
    AS STANDBY, if the restore log forward option is specified for a point in time
    or later than the current log sequence number (LSN) on the standby.'
  merge: -1
  pgno: 114
- img_proc: true
  md: "# Log files\n\nDatabase log operations replicated in relation to archive logging\
    \ as follows:\n\n+   - No replication of LOG ARCHIVES from the primary to the\
    \ standby.\n- Log archive occurs only on the primary to your specified archive\
    \ method.\n- The standby does not invoke USERXIT.\n  - It extracts logs out of\
    \ archive location for log replay.\n\n# 4.2 Snapshot\n\nThe SNAPSHOT FOR DATABASE\
    \ command is one way to get the status of the HDR databases. The snapshot can\
    \ be used any time you need the current status of either the primary or the standby\
    \ database.\n\n```\ndb2 get snapshot for database on database name\n```\n\nThe\
    \ information returned represents the status of the database manager operations\
    \ at the time command is issued. HDR information is listed under the heading of\
    \ HDR Status, as shown in Example 4-1.\n\nExample 4-1 Sample snapshot output\n\
    \n| Role = Primary |\n| --- | --- |\n| State = Peer |\n| Synchronization mode\
    \ = Sync |\n| Connection status = Connected, 10/20/2006 15:17:12.95439 |\n| Heartbeats\
    \ missed = 0 |\n| Local host = LEAD |\n| Local service = DB2_HDR_1 |\n| Remote\
    \ host = polonium |\n| Remote service = DB2_HDR_2 |\n| Remote instance = db2inst1\
    \ |\n| timeout(seconds) = 3 |\n| Primary log position(file, page, LSN) = S0000029.LOG,\
    \ 532, 000000082FC4C |\n| Standby log position(file, page, LSN) = S0000029.LOG,\
    \ 532, 000000082FC4C |\n| Log running average(bytes) = 0 |\n\nWithin the HDR Status\
    \ section, most of the output reflects your current settings in the database configuration\
    \ file. The settings that can have changed are Role, State, Connection status,\
    \ Heartbeats missed, Primary log position, Standby log position, and the Log gap\
    \ running average."
  merge: -1
