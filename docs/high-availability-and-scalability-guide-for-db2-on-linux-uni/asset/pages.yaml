  md: 'Before issuing a drop, if data exists on the database partition being dropped,
    you must redistribute the data that resides on this database partition for every
    database to ensure that data is not lost. The following are the steps to drop
    a partition


    +   1. Redistribute the data that resides on the database partition.


    +   2. Issue the **drop dbpartitionnum verify** command on the database partition
    to be dropped if you verify that the database partition is not in use.

    - If the SQL6034W message is received, you can proceed with the drop partition
    process.

    - If the SQL6035W message is received, you must use the **redistribute database
    partitiongroup** command to move the data from the database partition being dropped
    to other database partitions of the database. You cannot drop the database partition
    until this is completed.


    +   3. Issue the **db2stop drop dbpartitionnum** command.


    +   4. Restart the database with **db2start**.


    # # 12.4 High availability on DPF


    Data availability at the processor level is an issue if a node goes down in a
    shared nothing architecture. In this case, the data on the node is not available
    until the administrator recovers the node. In a shared disk, you can lose a processor,
    and still access disk from another processor. In a DPF shared nothing environment,
    if you lose a processor, you will no longer have access to that data.


    HADR is not supported on DB2 ESE with DPF. For high availability on DPF, DB2 provides
    failover support on many platforms using platform-specific high cluster software:


    +   - On AIX, DB2 supports HA failover through the capabilities of High Availability
    Cluster Multi-Processing, Enhanced Scalability (HACMP ES).


    +   - On Windows, you can implement HA failover support with Microsoft Cluster
    Server (MSCS).


    +   - On the Solaris Operating Environment, you can implement HA failover support
    with Sun Cluster or VERITAS Cluster Server.


    +   - On Hewlett-Packard, you can implement failover support with Multi-Computer/ServiceGuard.


    +   - On Linux, Tivoli System Automation (TSA) Base Component provides first-tier
    clustering/failover support.'
  merge: -1
  pgno: 394
- img_proc: true
  md: 'Figure 12-11 illustrates HACMP solution for a highly available DB2 DPF system.


    For detailed information about HA failover support and configuration, refer to
    Data Recovery and High Availability Guide and Reference, SC10-4228, or see Chapter
    10, “HADR with clustering software” on page 253.


    ![](img/a97b7826c3cf736045d80f48b5520a20_395_0.png)


    Figure 12-11 HACMP cluster solution


    High availability in a DPF environment requires a cluster of systems. A cluster
    is a group of connected systems that work together as a single system. Clustering
    allows servers to back up each other when failures occur, by picking up the workload
    of the failed server.


    Normally, DPF is a shared-nothing environment, but in an HA environment it can
    be configured such that disks are shared in support of failover. Two systems in
    a cluster each have an independent database workload which access the data on
    non-shared disks. In the event of a failover, this data will not recovered on
    the other server. Only the data that utilizes the shared disks is eligible to
    be recovered on the other backup server. What actually happens in the event of
    a failover is controlled by HA software scripts, which can be easily tailored
    to your unique environment.


    In a DB2 environment, when a partition fails on a node in a cluster, the HA software
    detects the failed partition and restarts the partition on another node. The HA
    failover script updates the db2nodes.cfg file and restarts the'
  merge: -1
  pgno: 395
- img_proc: true
  md: 'partition on the backup server/node. If a server with multiple DB2 partitions
    fails, it is important that the failover script starts the failed logical DB2
    partitions on the backup server in the order that is defined in the db2nodes.cfg
    file. The logical database partition with port number 0 must be started first.


    In a DPF environment, the HA clustering software can detect a failed node and
    restart the lost node on an empty space, in which case the load stays balanced,
    or the lost node can be restarted on another node that already has data, in which
    case the load is unbalanced because the takeover node is working harder than the
    others.


    The three most common failover strategies are known as *Idle Standby, Takeover
    and Hot/Active Standby*. See Figure 12-12.


    ![](img/a97b7826c3cf736045d80f48b5520a20_396_0.png)


    +   Idle Standby: In this configuration, one system is idle, or in standby mode,
    ready to take over the instance if there is an operating system or hardware failure
    involving any of the other systems. Overall system performance is not impacted,
    because the standby system is idle until needed.


    +   Active Standby: Another implementation where one server (a Hot Standby) is
    prepared to take over any of the other servers in the group which fails. All the
    servers in this DPF configuration are active. You must also configure a backup
    for the hot standby.'
  merge: -1
  pgno: 396
- img_proc: true
  md: 'Mutual Takeover: In this configuration, each system is the designated backup
    for another system. In the Active Standby and Mutual Takeover configurations the
    overall system performance may be impacted, because the backup system must do
    extra work following a failover. It must do its own work the that was being done
    by the failed system.


    Figure 12-13 shows an example of Hot Standby Takeover where Server 4 is configured
    to be the backup of Server 1 which is running partitions 1 and 4. Both the servers,
    Server1 andServer4 are in active mode running partitions 1 and 4. When Server
    1, which is running DB2 partition 1, goes down, the HA software fails over 1 to
