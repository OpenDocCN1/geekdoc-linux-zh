- img_proc: true
  md: 'Note: To reduce the possibility of network error, we recommend that you have
    duplicate networks for HADR communication.


    To avoid data loss, the automated failover should only be performed if the HADR
    is in Peer state when the primary crashed. Before you execute HADR takeover, ensure
    that the HADR is in Peer state, which means there is no log gap between databases
    in SYNC or NSYNC mode. ASYNC mode is not discussed here, since this mode does
    not guarantee the integrity of databases by its characteristics.


    By monitoring the HADR status properly and adding a handling logic in HACMP clustered
    environment, we can guarantee that the committed data will not be lost after the
    standby system took over the database. Figure 6-3 illustrates the concept of saving
