- img_proc: true
  md: 'After issuing the TAKEOVER HADR command from the standby, the following steps
    are carried out in the background:


    +   1. Standby tells the primary that it is taking over.

    2. Primary rolls off all client connections and refuses new connections.

    3. Primary rolls back any open transactions and ships the remaining log, up to
    end of the log, standby.

    4. Standby replays received log, up to end of the log.

    5. Standby becomes the new primary.

    6. Standby becomes the new primary.


    # Using the GUI


    In our example, we start with SAMPLE database on POLONIUM as the primary database.
    Perform the following steps:


    +   1. From the Control Center expand the object tree down to the database object,
    right-click the database name you plan to takeover HADR on. **High Availability
    Disaster Recovery** → Manage.'
