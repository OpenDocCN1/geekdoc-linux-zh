    # 10.3 Automating HADR takeover with TSA


    IBM Tivoli System for Multiplatforms (TSA) provides a framework to automatically
    manage the availability of what are known as resources. Examples of resources
    includes:


    +   - Any piece of software for which start, monitor, and stop scripts can be
    written to control.


    +   - Any Network Interface Card (NIC) for which TSA has been granted access to.
    That is, TSA will manage the availability of any IP address that a user wishes
    by floating that IP address across NICs it has been granted access to.


    For example, both a DB2 instance and HADR itself, have start, stop, and monitor
    commands. TSA scripts can be written to automatically manage these resources,
    as well as other attributes of a resource, are needed by TSA to manage that. TSA
    resource''s attributes in an object container, much like the attributes of a Java
    class. In fact, TSA manages a resource by instantiating a class for resource.


    TSA also allows resources to be managed in what are known as resource groups.
    TSA guarantees that all resources within a given resource group will be online
    at only one physical node at any point in time. Also, all of those resources will
    reside on the same physical node. Examples of resource groups (such as related
    resources) are a DB2 instance, its IP address, and all of the databases that it
    manages.


    Finally, TSA provides high availability (HA), for any resource group that it manages,
    by restarting all of its resources if it fails. The resource group will be restarted
    on an appropriate node in the currently online cluster domain. An appropriate
    node must contain a copy of all of the resources, that are defined in the failing
    resource group, to be selected as a node to restart on.'
  merge: -1
