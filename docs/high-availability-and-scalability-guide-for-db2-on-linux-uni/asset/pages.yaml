- img_proc: true
  md: '# Automatic client reroute


    In this chapter we describe an important DB2 feature known as automatic client
    reroute (ACR). ACR enables a DB2 UDB client application to recover from a loss
    of communications so that the application can continue its work with minimal interruption.


    We discuss the following topics:


    +   - Automatic client reroute overview

    - Automatic client reroute tuning

    - Limitations

    - Examples'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# 5.1 Automatic client reroute overview


    When there is a loss of communication between the client and the database server,
    the client receives a communication failure that terminates the application with
    an error. If high availability is important, you should implement a redundant
    setup and the ability to failover to the redundant setup. Automatic client reroute
    is a DB2 feature that enables a DB2 Client to recover from a loss of connection
    to the DB2 server by rerouting the connection to an alternate server. This automatic
    connection rerouting occurs without any manual intervention.


    # 5.1.1 DB2 automatic client reroute with HADR


    Figure 5-1 illustrates the automatic client reroute with HADR.


    ![](img/a97b7826c3cf736045d80f48b5520a20_133_0.png)


    Figure 5-1 Automatic client reroute implementation in HADR


    To enable the automatic client reroute feature, the DB2 server is configured with
    the name of an alternative location that the client can access. The UPDATE ALTERNATE
    SERVER FOR DATABASE command is used to define the alternate server location on
    a particular database.


    ```

    db2 update alternate server for database db2 using hostname XYZ port yyyy

    ```


    The alternate host name and port number is given as part of the command. The location
    is stored in the system database directory file at the server instance.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'The alternate server location information is propagated to the client when
    the client makes a connection to the DB2 server. If communication between the
    client and the server is lost for any reason, DB2 Client will attempt to re-establish
    the connection by using the alternate server information.


    The automatic client reroute feature could be used within the configurable environments.


    +   * Enterprise Server Edition (ESE) with the data partitioning feature (DPF)

    * SQL Replication

    * Tivoli System Automation (TSA)

    * High Availability Cluster Multiprocessor (HACMP)

    * High Availability Disaster Recovery (HADR)


    # 5.1.2 DB2 automatic client reroute


    If an alternate server is specified, automatic client reroute is activated when
    a communication error (SQLCode -30081) or SQLCode -1224 is detected. These error
    codes are not returned to the client but they activate DB2 automatic client reroute
    feature. In a high availability disaster recovery (HADR) environment, the automatic
    client reroute will also be activated if SQLCode -1776 is returned.


    When automatic client reroute is activated, DB2 Client first attempts to re-establish
    the connection to the original server, if it fails, it will try the alternate
    server. The DB2 Client will continue to connect with the original server and the
    alternate server, alternating the attempts between the two servers until it gets
    a successful connection for ten minutes from the moment it detected a communication
    failure expire whichever happens first. The timing of these attempts varies from
    the initial very rapid connection attempts between the two servers with a default
    lengthening of the intervals between the attempts. This is the default behavior.
    But we can control the interval durations using registry variables.


    | Time | Interval between attempts |

    |---|---|n| 0 to 30 seconds | 0 seconds |

    | 30 to 60 seconds | 2 seconds |

    | 1min to 2 minutes | 5 seconds |

    | 2min to 5 minutes | 10 seconds |

    | 5min to 10minutes | 30 seconds |'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'Once a connection is successful, the SQLCode -30108 or SQLCode -4498 for Java
    Universal Driver JCC clients is returned to indicate that a database connection
    has been re-established following the communication failure.

    Example 5-1 shows the SQLCode 4498.


    Example 5-1 SQLCode 4498


    SQLException: com.ibm.db2.jcc.C.ClientRouteException:

    ibm[db2][jcc][t4][2027][11212] A connection failed but has been re-established.
    The host name or IP address is "94.83.86.111" and the service name or port number
    is 50,030.Special registers may or not be-attempted (Reason code = 1).SQLCode:
    -4498


    When the application receives this message, the state of the transactions that
    were executing "unknown." Because the client did not get a reply from the server,
    it does not know if the transaction succeeded or not. The transaction may have
    been committed on the old server, and it may also have been replicated to the
    new server.


    It is the application''s responsibility to check if the transaction has succeeded
    or not submit if needed. The application can continue with the new transaction
    or the application can have logic to trap this exception and check the status
    of the transactions and retry only the failed transaction to make the application
    seamless to the communication failure. The client code only returns the error
    for the original communications failure (SQL30081N) to the application if the
    re-establishment of the client communications is not possible to either the original
    or alternate server after 10 minutes.'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'Figure 5-2 shows the sequence of steps when there is a connection failure to
    the primary database.


    ![](img/a97b7826c3cf736045d80f48b5520a20_136_0.png)


    Figure 5-2 Automatic client reroute in action


    # 5.2 Automatic client reroute tuning


    DB2 Client actually tries to connect to the original server first before connecting
    to the alternate server when client reroute is triggered. Therefore, to enable
    fast reroute to the alternate server, the connection to the original server which
    has just died to have a timeout error quickly. There are three options to achieve
    this:


    +   - Tuning TCP/IP network: To the automatic client reroute perform better, we
    can tune the TCP/IP network parameters of the operating system on which DB2 application
    is running. For example, on AIX operating system, tune tcp_keepinit. The default
    value 150 means that 75 seconds has to be passed before the connection is really
    routed to the alternate server.


    +   - Configuring DB2 registry variables: The operating system network parameters
    affects all the applications on the system. It is recommended to configure the
    following DB2 client reroute registry variables which affect only DB2 applications.
    You need to tune the parameters which will enable DB2 to quickly figure out that
    the network connection is not alive.'
  merge: -1
  pgno: 136
- img_proc: true
  md: '+   - DB2TCP_CLIENT_CONTIMEOUT:


    This registry variable specifies the number of seconds a client waits for the
    completion on a TCP/IP connection operation. If a connection is not established
    in the seconds specified, then the DB2 database manager returns the error code
    -30081. There is no timeout if the registry variable is set to 0.


    +   - DB2TCP_CLIENT_RCVTIMEOUT:


    This registry variable specifies the number of seconds a client waits for data
    on a TCP/IP receive operation. If data from the server is not received in the
    seconds specified, then the DB2 database manager returns the error code -30081.
    There is no timeout if the registry variable is set to 0. This variable should
    be set to longer than the longest query execution time. Otherwise, the client
    will timeout during a long query and think that the connection is broken.


    By default, the automatic client route feature retries the connection to a database
    repeatedly for up to 10 minutes. It is, however, possible to configure the exact
    retry behavior using one or both of these registry variables:


    +   - DB2_MAX_CLIENT_CONNRETRIES:


    This registry variable specifies the maximum number of connection retries attempted
    by the automatic client reroute. If this registry variable is not set, but the
    DB2_CONNRETRIES_INTERVAL is set, the default value is 10.


    +   - DB2_CONNRETRIES_INTERVAL:


    This registry variable specifies the sleep time between consecutive connection
    retries, in number of seconds. If this variable is not set, but DB2_MAX_CLIENT_CONNRETRIES
    is set, the default value of DB2_CONNRETRIES_INTERVAL is 30 seconds.


    If DB2_MAX_CLIENT_CONNRETRIES nor DB2_CONNRETRIES_INTERVAL is set, the automatic
    client reroute reverts to its default behavior.


    Automatic client reroute tries to connect to both original and alternate servers
    in a set of trials. In one of set, client connects forms as follows:


    +   - Two times for original server


    +   - Two times for alternate server


    After one set of trial, client waits for DB2_CONNRETRIES_INTERVAL and then repeats
    this trial process for DB2_MAX_CLIENT_CONNRETRIES. After the trial reaches DB2_MAX_CLIENT_CONNRETRIES_INTERVAL
