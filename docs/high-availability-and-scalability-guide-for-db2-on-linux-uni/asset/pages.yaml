    #  10.2.5 Prepare application server scripts


    To automate HADR takeover with HACMP, we utilize the HACMP application server
    start/stop scripts. By including start/stop commands in the script, HACMP can
    handle HADR operations in connection with the resource group. The application
    scripts for HADR can be placed in the directory of your choice. We place our scripts
    in the /home/hadinist/scripts directory. The sample scripts can be found in Appendix
    A, “HACMP application server scripts” on page 403. Here we explain some of these
    HACMP controlled scripts and how they work.


    # hadr_primary_takeover.ksh (start script)


    We define a shell script hadr_primary_takeover.ksh as the start script for HACMP
    application server. This script is executed in the following situations when the
    node acquires the resource group:


    +   - Normal start up of HACMP on the first (service) node in the cluster.

    - Unplanned takeover that is triggered by failure detection of HACMP.

    - Planned takeover by stopping HACMP in takeover mode, or moving the resource
    group by an administrative command.


    This script is executed not only when the resource group has fallen over to the
    standby node, but also when the first node in the cluster is started and acquires
    the resource group. This script checks which is the starting trigger by issuing
    the HACMP command: cLRGinfo.'
  merge: -1
  pgno: 293
- img_proc: true
  md: 'Figure 10-17 shows the flow chart of the script, hadr_primary_takeover.ksh.
    If the trigger is normal HACMP start up, then this script simply exits. If the
    starting trigger is takeover, which means that this script is issued on the standby
    node in connection with the resource group fall over, then this script checks
    the HDRA role. If the HDRA role is standby, it issues the takeover hadr command
    by force option.


    In circumstances where the standby database cannot communicate with the primary
    database, the takeover hadr command needs the force option to change its role
    to primary. But for planned takeover, by force option is not preferable, so in
    our example, the normal takeover hadr command without the by force option) is
    issued from the stop script by a remote command before this script is issued on
    the standby node.


    ![](img/a97b7826c3cf736045d80f48b5520a20_294_0.png)


    Figure 10-17 hadr_primary_takeover.ksh script flow


    # hadr_primary_stop.ksh (stop script)


    We define hadr_primary_stop.ksh as the stop script for HACMP application server.
    Figure 10-18 shows the script logic flow. This script is executed on the service
    node and when the node releases the resource group. That is, when you stop HACMP
    in takeover or move the resource group from one server to the other intentionally
    for planned takeover. For planned takeover, it is preferable to issue the takeover
    hadr command as soon as possible. In our example, this script issues a remote
    command to the standby node to execute the takeover hadr command.


    Chapter 10. HDRA with clustering software 277'
