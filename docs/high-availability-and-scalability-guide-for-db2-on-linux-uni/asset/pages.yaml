  md: '# 4.5 Monitoring HADR db2diag


    It is not only possible to get certain basic status information about HADR from
    the db2diag.log, but depending on what you need, it can be very efficient to simply
    awk or get the tail of the db2diag.log file. For example, from db2diag.log, you
    can easily find out whether the primary server thinks it is currently in the Peer
    state or not. In addition, using the db2diag system command allows you to filter
    and format the output of the db2diag.log file. This neither requires overhead
    to achieve a connection to the DB2 database, nor interface through any API to
    the DB2 snapshot or monitor element data.


    Example 4-7 and Example 4-8 show the various stages of progress through HADR startup
    to achieve the Peer state, and the syntax of the HADR messages you will see. This
    can be useful whether you are manually eyeballing the output, or if you are scanning
    through the db2diag.log with some string searching algorithm for specific text.


    We have provided these examples to specifically show what happens in parallel
    time lines on the primary and the standby after an initial HADR reintegration.
    The db2diag.log text shown in Example 4-7 was just after the backup file had been
    restored to the standby, and HADR was started, first on the standby server (POLONIUM),
    and then on the primary server (LEAD).


    We show the events on the standby first in Example 4-7, as this is where events
    actually committed.


    Example 4-7 Progress of HADR status from startup to Peer on the standby


