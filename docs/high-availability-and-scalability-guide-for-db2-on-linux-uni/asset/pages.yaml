    # Set up highly available IP addresses


    Making an IP address highly available involves telling TSA of redundant network
    interface cards (NICs) (eth1) that you want to make equivalent to the primary
    NIC (eth0). Doing this allows TSA to restart an instance''s failing IP address
    on one of the equivalent redundant NICs.


    +   1. As root, redundant NICs on the primary node (hadr01) that you would like
    to make equivalent to the primary NIC (eth0). Then, do the same on the standby
    node (hadr02):


    > (P) S # ifconfig -a | grep ''eth|Mask''

    You should see encap:Ethernet similar to the following lines:


    ```

    eth0

    encap:Ethernet

    inet addr:9.26.96.84 Bcast:9.26.97.255


    eth1

    encap:Ethernet

    inet addr:192.168.1.1 Bcast:192.168.1.255

    ```


    In this case, we choose to create an equivalency group with both NICs eth0 and
    eth1. Note that if there is only one NIC present on your system, you will create
    an equivalency group of only this single adapter.


    +   2. Choose any number of NICs on a node for the members of the NIC equivalency
    group. Note that for a equivalency group with N members, N-1 NICs may fail and
    the IP address will be transparently moved to one of the surviving NICs in the
    group. Should the last (or only) NIC in the equivalency group fail, the node will
    be brought down (automatically by TSA) and any HADR resource groups will then
    be hosted at the surviving node.


    +   3. Create an equivalency between the chosen NICs as follows (this first example
    assumes that eth0 and eth1 are active and equivalent on each cluster membership):


    > (P) # mkqu -D "Name like ''eth0'' | Name like ''eth1'' \

    NodeNameList=''hadr01'''''' virpubnic_hadr01 IBM.NetworkInterface


    (S) # mkqu -D "Name like ''eth0'' | Name like ''eth1'' \

    NodeNameList=''hadr02'''''' virpubnic_hadr02 IBM.NetworkInterface'
