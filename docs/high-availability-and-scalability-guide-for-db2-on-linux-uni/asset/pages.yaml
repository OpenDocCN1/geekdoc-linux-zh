  md: '# HADR best practice


    In this chapter we describe the DB2 configuration parameters and registry variables
    that affect HADR. We also discuss the import factors to consider when implementing
    an HADR solution to obtain the most optimum HADR performance.


    We cover the following topics:


    +   - DB2 HADR configuration parameters

    - DB2 HADR registry variables

    - Recommendations and considerations

    - Restrictions'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# 6.1 DB2 HADR configuration parameters


    Here we explore the relevant database manager configuration parameters (dbm cfg
    parm) and database configuration parameters (db cfg subm) that have some appreciable
    impact on HADR.


    In most cases, there is no need to change these parameters manually after setting
    up HADR. However, it is always useful to know what to change and why, in the event
    that an architectural requirement is changed further down the track.


    We do not provide specific performance recommendations in this section, as each
    environment will require tuning to match its own unique characteristics. Having
    said that, the information provided here, in the DB2 manual pages, and other references
    listed will be enough to give you a good idea of which settings will meet your
    requirements.


    One thing to keep in mind, with configuration parameters, and the registry and
    environment variables in the next section, is that they can only be recognized
    and used while the database is in primary, or standby variables, and ignored otherwise.
    Still, it is important for these parameters/variables to be set and maintained
    on both servers of the HADR pair, for when the time comes to switch roles or perform
    a forced takeover.


    # 6.1.1 Basic configuration parameters


    The following terms can be found in DB2 9 Information Center (Reference → Configuration
    Parameters → Database Systems) and in DB2 9 Performance Guide SC10-4222: Appendix
    A. The same information is also given in DB2 V8.2 Information Center and Administration
    Guide: Performance V8, SC09-4821-01.


    +   * AUTORESTART


    Consider setting this db cfg parm to value when using automatic client reroute,
    so that a broken primary server does not come back online and restart in HADR
    primary role, causing a split-brain scenario.


    In a non-HADR environment, it is good to leave AUTORESTART set to ON, as the database
    will automatically activate when the instance is started and the first application
    connection attempt is made, attempting log/crash recovery for any inflight/inbound
    transactions that existed at the time the database was deactivated.


    When AUTRESTART is left OFF, connection attempts receive an SQL1015N message.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '+   - LOGINDEXBUILD:

    This db cfg param value should be set to ON so that maintenance operations on
    indexes, as as create, or REORG, on the primary database will be logged and carried
    out to match on the standby database.


    +   - LOGRETAIN / LOGARCHMETHn:

    You must have at least one db cfg param set in order to use HADR. Circular logging
    is not supported.

    LOGRETAIN is a legacy parameter from the days before a native archiving method
    (LOGARCHMETHn) was supported. You can still use it to specify that DB2 active
    logs and archive logs should be stored in one single location. The log file location
    is specified by LOGPATH and can be changed by updating NEWLOGPATH and deactivate/activate
    database commands.

    LOGARCHMETHn (1,2) specifies the destination for the primary and mirror archive
    logs. This can be a disk, TSM, userexit, or supplied destination driver. Having
    a value here means that an active log is closed by DB2 (no more active transactions
    referring to it), it is moved out of the active log directory and sent to the
    target/destination.


    +   - HADR_DB_ROLE:

    This db cfg param is configurable indirectly through HADR commands, to STOP, START,
    and TAKEOVER HADR. The possible values are:

    - STANDARD:

    The database is not in an HADR role and can be processed normally.

    - PRIMARY:

    The database is the HADR primary, all client interactions with the HADR pair occur
    here.

    - STANDBY:

    The database is the HADR standby, any interaction attempts will receive an SQL1776
    message. Only DB2''s log replay engine is allowed to run against this database.
    You can issue the following command against an HADR standby database to see the
    log replay application:

    db2 list applications all show detail


    +   - HADR_LOCAL_HOST:

    This db cfg param refers to the host name or IP address for the current server.
    The reason for using a separate host field for HADR is to support the use of HADR
    specific network card, which is addressed by its own IP address or host name that
    is different from the "usual" name of the host.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '+   HADR_LOCAL_SVC

    Logically coupled with the above parameter, this db cfg param specifies the port
    number used for the local HADR component of the HADR database. Note that this
    is completely separate from the port/service assigned to a given DB2 Instance.
    The HADR service/port number is specific to each HADR database.


    +   HADR_REMOTE_HOST:

    This db cfg param specifies the host name or IP address of the remote server for
    the HADR paired databases.


    +   HADR_REMOTE_INST:

    This db cfg param specifies the DB2 Instance name on the remote server for the
    HADR paired databases. Note that there is no equivalent db cfg param for the local
    server — it can be derived from the current instance environment variable.


    +   HADR_REMOTE_SVC

    Combined with the HADR_REMOTE_HOST and HADR_REMOTE_INST, this db cfg param specifies
    the port number or service name used by the HADR database on the remote server.
    With the HADR_LOCAL_SVC, this value is specific to the database, and any given
    pair of HADR databases must have two different TCPIP port numbers.


    +   HADR_SYNCMODE:

    This is an important db cfg parameter. The setting must match on both servers
    in the HADR pair.

    The following values are possible:


    +   - SYNC

    In this mode, logs are considered successful only when logs have been written
    to log files on the primary database and the primary database has received acknowledgement
    from the standby database that the logs have also been written to log files on
    the standby database. The log data is guaranteed to be stored on both servers.


    +   - NEARSYNC

    In this mode, logs are considered successful only when the log records have been
    written to the log files on the primary database and when the primary database
    has received acknowledgement from the standby system that the logs have also been
    written to main memory on the standby system. Loss of data occurs only if both
    sites fail simultaneously and if the target site has not been transferred to nonvolatile
    storage with all of the log data that it has received.'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'ASYNC:

    In this mode, log writes are considered successful only when the log records have
    been written to the log files on the primary database and have been delivered
    to the TCP layer of the primary system''s machine. Because the primary system
    does not wait for acknowledgement from the standby system, transactions might
    be considered committed when they are still on the way to the standby.


    +   HADR_TIMEOUT:


    This db cfg parm specifies the time in seconds which the DB2 HADR EDU will wait
    for any response from its HADR partner, before considering communication to have
    failed and closing connection. If HADR was in Peer state before closing connection,
    the primary would no longer follow Peer semantics when HADR connection is closed.
    The response could be either heartbeat or acknowledgement (ACK) signals. Note
    that there is no timeout for ACK signal wait, and ACK signals are not used for
    ASYNC mode. This value must also match on both sides of the HADR pair.


    +   INDEXREC:


    Index recreation time is both a dbm and db cfg parm which specifies when, if necessary,
    DB2 will attempt to rebuild invalid indexes — specifically for HADR, whether this
    will occur during HADR log replay on the standby. The db cfg parm is meant to
    be used as the default for all databases for that instance, the db cfg parm, when
    not set to SYSTEM, will override that value. Possible values are:


    +   SYSTEM:


    Applies to db cfg only; accept the value for INDEXREC in the dbm cfg.


    +   ACCESS:


    Rebuild invalid index when the index is first accessed, and then rebuild on HADR
    standby during log replay.


    +   ACCESS_NO_REDO:


    Rebuild invalid index when index is first accessed, but leave invalid on HADR
    standby, no rebuild during log replay. The index would be rebuilt after an HADR
    takeover and the first access of the underlying table.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '+   RESTART:


    This is the default value. Rebuild invalid index occurs after a RESTART DATABASE
    or HADR takeover on the normal or primary database, and on the standby database
    during log replay. The AUTORESTART db cfg param effectively means RESTART DATABASE
    is implicitly set at the time an application attempts to connect to the database.
    Indexes are rebuilt asynchronously (no wait) at takeover time, and synchronously
    (wait) at restart time.


    +   RESTART_NO_REDO:


    Rebuild of invalid index occurs after a RESTART DATABASE on the normal or primary
    database, but not on the standby during HADR replay. Rebuild would occur only
    after HADR takeover.


    +   SELF_TUNING_MEM:


    From DB 9 onwards, DB2 is to dynamically assign memory for buffer pools, package
    cache, lock sort heap, and database shared memory, using this db cfg param. Self
    Tuning Memory, even when set up on both servers, can only be active on an HADR
    primary database.


    +   LOGFILSZ:


    This db cfg param which specifies the size of active logs is taken from the primary
    and used by the standby so that the size of active logs on both servers — the
    standby db cfg value of LOGFILSZ is ignored. The value is kept even after an HADR
    role switch or takeover, until such time the database is restarted, when the local
    LOGFILSZ value is used for active log size.


    # 6.1.2 Automatic client reroute configuration parameters


    This minute subset of DB2 configuration parameters is strictly speaking, not part
    of HADR, or even, strictly speaking, a configuration parameter, but it is used
    by ACR.


    The command db2 update alternate server for database sets values stored in the
    system database directory file for the server and DB2 Instance port number. As
    an example for database SAMPLE, where our current primary server is named LEAD,
    and the alternate would be named POLONIUM, using TCP/IP port 50001 for the DB2
    instance DB2INST1:


    ```

    db2 update alternate server for database sample using hostname

    POLONIUM port 50001

    ```


    The mechanism of automatic client reroute, and how it is a separate entity to
    HADR, are explained in Chapter 5, “Automatic client reroute” on page 115.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# 6.2 DB2 HADR registry variables


    This section examines the DB2 registry and operating system shell environment
    variables pertaining to HADR.


    The following can be found in DB2 9 Information Center (Reference -> Configuration
    Parameters -> Database Systems) and in DB2 V8.2 Performance Guide, SC10-4222:
    Appendix B. The information are also equivalent in DB2 V8.2 Information Center
    and Administration Guide: Performance V8, SC09-4821-01.


    +   DB2_HADR_BUF_SIZE: This variable is only recognized while the database is
    in standby role. By default, it is the size of the HADR standby log buffer. The
    value of this variable is calculated as twice of LOGBUFS.


    The standby replay mechanism retrieves logs directly from the log buffer. If the
    standby is slow in replying logs, and the primary sends more logs to the standby,
    the log buffer will eventually become "full", preventing the standby from receiving
    logs. Saturation of the standby buffer will cause transactions on the primary
    to be blocked until receive buffer has more room to receive log pages.


    If the synchronization mode is ASYNC, the network pipeline from the primary to
    the standby will eventually fill up and the primary will not be able to send any
    logs. This is called "congestion". In ASYNC mode, network congestion and saturation
    of the standby''s buffer will stay the primary log processing. Hence transactions
    on the primary are to be blocked until congestion is cleared, provided the standby
    can send heartbeat and the primary can receive the standby''s heartbeat


    If the synchronization mode is SYNC or NEARSYNC, the primary is likely to be out
    one more batch of logs after the standby buffer receive full. This batch of logs
    will be buffered in the network pipeline between the primary and the standby.
    In SYNC and NEARSYNC modes, although the primary is not likely to encounter congestion
    when sending logs, it will still have to wait for acknowledgement messages when
    the standby buffer is full. Thus the primary transaction processing will eventually
    be blocked in all the synchronization modes when the standby receive buffer is
    full.


    A larger standby buffer size (set by registry variable DB2_HADR_BUF_SIZE) will
    allow the standby to absorb load peaks, reducing the chance of slowing the primary
    down. But if the sustained throughput of the standby log processing is lower than
    the primary log creation rate, a larger buffer will still be filled up and the
    primary be slowed down.'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'If your primary load is uneven, consider a larger standby receive buffer to
    absorb the peaks. Consider that in certain scenarios, SYNC and NEARSYNC modes
    see a significant benefit from a very generous increase of the DB2_HADR_BUF_SIZE
    value, whereas the manual might give the impression that all ASYNC mode would
    benefit.


    We recommend that you perform basic transactional throughput using a large DB2_HADR_BUF_SIZE
    value on each of the synchronization modes to determine the best solution for
    your environment. NEARSYNC is the default mode, and in many cases will provide
    a solution which is closest in performance to not running HADR.


    +   LOAD_COPY_NO_OVERRIDE


    This variable is not specific to HADR. However it can have an adverse or beneficial
    effect on an HADR database depending on the value you assign to it. The variable
    is ignored on the standby databases, but applied on either a primary or a standard
    role database.


    By default, when a db2 load...copy command runs on an HADR database, DB2 will
    convert to NONRECOVERABLE, that table space will be placed in a copy pending (read
    only) state, and the HADR standby will cease to match the primary. The standby
    on the standby will be marked, and logs from the primary will not be applied.
    This state can be corrected by subsequent execution of a db2 load...copy yes command.


    If this registry variable is set to COPY YES (with a valid destination as part
    of the syntax), the load is converted such that it will automatically be used
    with log replay on the HADR standby to maintain data integrity. Note that the
    load command would still have to use a valid target which the HADR standby database
    can access, in order for this to be effective (i.e. a shared drive with matching
    path, or a mutually accessible TSM target).


    +   DB2LOADREC


    This registry variable can be used when the db2 load...copy yes image location
    on the HADR standby does not match the target location it was sent to the HADR
    primary. This can happen when shared disk relative mapping does not match on servers,
    or by means of file transfer outside DB2''s control is occurring. Essentially,
    the value of DB2LOADREC is set to a plain text file which contains all required
    media information about the load copy backup image. The structure and required
    content of this file is fully described in the DB2 v9 Data Recovery and High Availability
    Guide and Reference, from page 165, and also in DB2 9 Data Movements Utilities
    Guide and Reference, SC10-4227, page 131.


    As of DB2 9, there are no Operating Shell environment variables used to influence
    the operation of HADR.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# 6.3 Recommendations and considerations


    In this section we point out the important things to consider implementing an
    HADR solution. There is no one perfect way of configuring HADR; everything depends
    on the user''s requirements. If transaction performance is critical, then you
    might have to sacrifice HADR takeover time. If there is high logging activity
    and the network cannot keep up with the logging, you might have to sacrifice the
    transaction performance. You have to weigh the pros and cons of each the following
    factors on the user requirements when tuning the HADR.


    # 6.3.1 DB2 transaction performance


    HADR setup could have a very slight impact on the performance of the DB2 transactions.
    With a stricter logging mode, the potential performance impact is higher. The
    tuning in an HADR setup is just the usual tuning of DB2 parameters in a non-HADR
    environment. There are no specific HADR parameters to be tuned. Each environment
    will require tuning to match its unique characteristics.


    Depending on the logging mode, the performance of the in-flight transactions on
    the primary can get affected when the standby goes down.


    The primary database continuously polls the network. If the network or the standby
    machine goes down, the primary database will detect the condition as soon as the
    primary host operating system detects the condition. If the standby database crashes,
    the standby machine and the network are still up, in most cases, the primary machine
    and therefore the primary database can detect the failure and close the connection
    quickly. Closing the connection will cause the primary database to change from
    Peer state to disconnected state, unblocking pending transactions. HADR state
    changes from peer


    If the primary machine is unable to report the standby or network failure in time,
    DB2 will rely on HADR_TIMEOUT to disconnect. If the primary does not receive any
    message from the standby for HADR_TIMEOUT seconds (default 120) since the last
    heartbeat, it will change the state to disconnected.


    With SYNC and NEAR SYNC logging mode, a commit statement for in-flight transactions
    does not complete until HADR state is changed to disconnected. This is because
    for SYNC and NEARSYNC modes, the primary will have to wait for the acknowledgement.
    With ASYNC logging mode, in-flight transactions do not suffer from a network disconnection
    or the standby down and commit statement for them complete immediately. This is
    because ASYNC mode when the primary sends logs, the operating system network layer
    might return success, but buffer the data in the network path, or it might return
    "congestion".'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'For ASYNC mode, if the primary keeps sending more logs, it will eventually
    cause congestion. If send returns congestion, the primary transaction processing
    will be blocked immediately in ASYNC mode also. When there is that the receive
    buffer is full, the standby it cannot receive heartbeat from primary owner. It
    updates its heartbeat receive time and continues to send heartbeat to primary,
    so the standby will not drop connection after HDR_TIMEOUT.


    On the primary side, since the primary is receiving heartbeat from the standby,
    the primary also will not drop connection after HDR_TIMEOUT. Since the standby
    can send heartbeat and the primary can receive the standby''s heartbeat, the HDR
    pair will stay connected. In the worst case, unresponsive standby or network could
    cause the primary transactions to be blocked as long as the primary can receive
    heartbeat from the standby.


    # 6.3.2 DB2 utilities performance


    Most DB2 utilities have no significant performance difference in the HDR environment.
    CPU usage also does not change significantly with HDR. But the DB2 REORG (both
    INPLACE/SHADOW mode) shows a performance slowdown. Table reorganization performance
    degrades with stricter log shipping mode.


    # 6.3.3 How to reduce the takeover time


    Customers would like to keep HADR takeover time to a minimum. By reducing the
    amount of transaction rollback after takeover over the standby, you can open up
    the database to the clients sooner.


    There is not a significant difference in takeover time between the different log
    shipping modes. When primary fails, forced takeover is usually faster than unforced.
    If the standby detects the failure and is already disconnected, unforced takeover
    cannot be issued because the standby is no longer in Peer state.


    If you know for sure that the primary has failed and would like to failover, issue
    forced takeover on the standby. If the standby has not detected the failure and
    is still in Peer state, it will allow unforced takeover. But because the primary
    is down, unforced takeover will not get any response from the primary and will
    hang for HDR_TIMEOUT period. So if you have determined that primary is down, you
    should issue forced takeover directly.'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# 6.3.4 Seamless takeover


    HADR does not automatically detect a failed primary and issue a takeover. This
    process is manual. Once the user has determined the primary is down, the user
    can issue the takeover command. But manual takeover might not be acceptable in
    certain situations. In that case, you can configure HADR with a clustering software
    such as HACMP or TSA or MSCS to make this takeover completely seamless. The cluster
    software detects that the primary is down and issues an HADR takeover. Refer to
    Chapter 10, "HADR with clustering software" on page 253 for more details on implementing
    this solution.


    # 6.3.5 Applications with high logging rate


    For applications that have a very high logging activity, you have to make sure
    that the network is capable of transmitting that load of data. The standby database
    should also be powerful enough to replay the logged operations of the database
    as fast as they are generated on the primary. We recommend identical primary and
    standby hardware.


    DB2 HADR does not currently support compression of the log files before sending
    them to the standby in order to improve this situation. However, depending on
    the synchronization mode you are using, the logging rate on the primary can be
    reduced to the rate of transfer on the network by choosing a more strict form
    of log shipping mode, such as SYNC mode, which forces the primary to wait for
    the standby to acknowledge that it has received the log record before it can proceed.
    Network bandwidth is the limit of logging rate.


    In most systems, the logging capability is not driven to its limit. Some systems
    do not see much difference among the three synchronization modes, or with the
    HADR enabled or disabled. This behavior is usually seen in systems where HADR
    is not the bottleneck of database performance.


    # 6.3.6 Performance implications of HADR_TIMEOUT


    If one database does not receive any message from the other one for the HADR_TIMEOUT
    period, the connection is closed.


    Try to avoid setting the HADR_TIMEOUT too long. In Peer state, if the standby
    is not responding, transactions on the primary can have HADR_TIMEOUT period.


    Setting the HADR_TIMEOUT too short can also impact the performance. You may get
    a false alarm on the connection. Frequent disconnecting and reconnecting are a
    waste of resources. HA protection also suffers as disconnection brings the primary
    out of Peer state. We recommend setting it to at least 10 seconds.'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# 6.3.7 Network considerations


    The primary database ships the log records to the standby database server over
    TCP/IP network when the primary does a log flush. In the primary database, SQL
    agents EDU produce logs and write the logs into the log buffer, whose size is
    controlled by the database configuration parameter LOGBUFSZ. The logw consumes
    the logs by writing them to disk. The write operation is called log flushing.
    Each write operation (and the logs written) is a flush. For HADR primary databases,
    each flush is also sent to the standby database. For each write call, there is
    a matching send that delivers the exact block of log data to the TCP layer.


    The logger does not wait for the log buffer to be full to flush it. A transaction
    commit will generate a flush request. If there is no request, logw will still
    wake up from time to flush the log buffer. The size of each log flush is non-deterministic.
    When there are multiple sessions, multiple requests can be combined. The logger
    is designed to be self tuning. If a flush takes a longer time, when the logger
    completes the flush, there will be more outstanding requests, and therefore stronger
    grouping on commit requests, improving performance by reducing the number of writes.


    If there is only one client session, each commit will cause a log flush. If the
    synchronization mode is SYNC or NEARSYNC and the network is not very fast, the
    round trip messaging required by the synchronization mode can have a great impact
    on performance.


    If the primary log buffer is large, each flush is likely to be large too. The
    send request to TCP can involve large blocks of data. The TCP layer can be tuned
    to handle such requests efficiently.


    For HADR to work efficiently, a high speed, high capacity network between the
    primary and standby database is highly recommended. This will enable the standby
    to receive and acknowledge the logs as quickly as possible. We also recommend
    that the bandwidth of the network link be greater than the bandwidth of the logs
    generated. The network is vital to the performance of HADR, so it is important
    to tune the network. For better performance in an HADR environment, the network
    between both databases should be set up correctly. In terms of AIX tuning, set
    these two OS parameters that affect the network performance:


    +   * tcp_recvspace:


    The tcp_recvspace tunable specifies how many bytes of the data receiving system
    can buffer in the kernel on receiving sockets queue. The tcp_recvspace tunable
    is also used by the TCP protocol to set the TCP window size, which the TCP uses
    to limit how many bytes of data it will send to the receiver to ensure that the
    receiver has enough space to buffer the data. The tcp_recvspace tunable is a key
    parameter for TCP performance'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'because TCP must be able to transmit multiple packets into the network to ensure
    that the network pipeline is full. If TCP cannot keep enough packets in the pipeline,
    performance suffers. You can set the tcp_recvvspace tunable [value] command by
    no -o tcp_recvvspace. You can also set interface-specific values of tcp_recvvspace
    from shmit enuel


    +   - tcp_sendspace:


    The tcp_sendspace tunable specifies how many bytes of the sending application
    can buffer in the kernel before the application is blocked on a send call. The
    TCP-socket send buffer is used to buffer the application data before it is sent
    to the receiver by the TCP protocol. The default size of the send buffer is basically
    specified by the tcp_sendspace t value. You should set the tcp_sendspace tunable
    value at least as large as the tcp_recvspace value, and for higher speeds, the
    tcp_sendspace value should be at least twice the size of the tcp_recvspace value.


    For more details on TCP tuning parameters, see the following site:

    http://publib.boulder.ibm.com/infocenter/pseries/v5r3/index.jsp?topic=com.ibm.aix.prftund/doc/prftund/tcp_streaming_workload_tuning.htm


    # Network delays


    Network latency affects transaction performance in all SYNC and NEARSYNC modes.
    The slowdown in system performance as a result of using SYNC mode can be significantly
    larger than that of the other synchronization modes. In SYNC mode, the primary
    database sends logs to the standby database after the log pages have been successfully
    written to the primary database disk.


    In order to protect the integrity of the system, the primary database waits for
    an acknowledgement from standby before notifying an application that a transaction
    was prepared or committed. The standby database sends the acknowledgement only
    after it writes the log pages to the standby database disk. The resulting overhead
    is the log write on the standby database plus round-trip messaging.


    In NEARSYNC mode, the primary database writes and sends logs in parallel. The
    primary waits for an acknowledgement from the standby. The standby database acknowledges
    as soon as the log pages are received into its memory. On a fast network, the
    overhead to the primary database is minimal. The acknowledgement might have already
    arrived by the time the primary database finishes local log write.


    For ASYNC mode, the log write and send are also in parallel; however, in this
    mode the primary database does not wait for an acknowledgement from the standby.
    Therefore, network delay is not an issue. Performance overhead is even smaller
    with ASYNC mode than with NEARSYNC mode.'
  merge: -1
