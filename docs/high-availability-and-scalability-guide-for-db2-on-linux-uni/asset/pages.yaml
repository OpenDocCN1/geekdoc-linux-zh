  md: 'The ACR box refers to Automatic Client Route, which is effectively a software
    layer sitting on top of HADR, between external clients, and each DB2 instance.
    It is there to route the Client to whichever DB2 instance is currently set as
    the primary. For more details about ACR, refer to Chapter 5, "Automatic client
    reroute" on page 115.


    In our Lab, clients can communicate with the DB2 instance through port 55001,
    and DB2 HADR communicates between the servers through ports 55001 and 55002. The
    DB2 Admin Server (DAS) GUI interface communicates through port 523.


    The database being set up in HADR configuration is called SAMPLE; we will eventually
    get this database an alias on each remote server, so that it is accessible from
    the GUI Control Center Manage HADR dialog box, and for general remote takeover,
    stop, and start commands.


    In the Lab, we start out with one SAMPLE database, sitting in the DB2INST instance
    on one of the servers (LEAD).


    We finish with SAMPLE acting as HADR primary on the DB2INST1 instance on LEAD,
    and as HADR standby in the DB2INST1 instance on POLONIUM.


    In the step descriptions that follow, the term remote is used in the context of
    the server that we eventually configure the standby database on, and likewise,
    the term local is used interchangeably with primary. This is simply because we
    are running the wizard on the server that will become the primary. Initially,
    we do not have a primary or a standby, the local server where the setup wizard
    dialog boxes appear (LEAD for our example) and the remote server that will get
    a database restored on it (POLONIUM).


    After configuration is complete, the primary and standby roles can be swapped
    at will, so these are temporary descriptions at best. To help with establishing
    a more permanent frame of reference, we have included our Lab example server names
    (LEAD and POLONIUM) in parentheses when listing a given server, so you can substitute
    your own server names for each situation.'
