    ![](img/a97b7826c3cf736045d80f48b5520a20_261_0.png)


    Figure 9-29 New DB2 instance resource created


    # 9.7.4 Migrating the DB2 instance to the cluster environment


    The instance, as it is now, has been created in only one node in the cluster.
    In the event of a failure, the other node would not have been able to find information
    about this instance. The same applies for any other resource in the cluster. Windows
    Cluster maintains information about the status, resources types, nodes, and so
    on, of the cluster in a file located in %WinDir%\ClusterSTDB. This file exists
    in each node and is synchronized constantly by the Cluster Server software.


    Additionally, the applications in the cluster have access configuration information
    in any of the nodes. To avoid replicating potentially multiple registry keys in
    the registry, most of the contents of the CLUSTDB and all information related
    to a highly available resource must be located in the same Windows Registry key:


    ```

    HKEY_LOCAL_MACHINE\Cluster

    ```


    This key is also synchronized among the nodes by Windows so applications use it
    in any of the nodes.


    The process of migrating a DB2 instance to the cluster includes two steps:


    +   - Moving the DB2 instance profile directory to a highly available disk where
    it can be found by any node.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '2. Creating a Windows register key in the cluster section of the Windows Registry.


    These two tasks are accomplished using the db2iclus utility that must be run in
    the node where the DB2 instance was created.


    In Figure 9-30, you can see a series of commands:


    +   - db2ilist shows you that there are two instances in the system. None of them
    are available in the cluster


    +   - mkdir R:\DB2Profs: In the highly available disk Drive R, you create a directory
    DB2Profs to store the instances.


    +   - db2iclus MIGRATE /i:DB2PERU /p:r:\DB2Profs /c:ANCASH: The db2iclus command
    moves the DB2INCA to the cluster and places the DB2 instance profile directory
    in R:\DB2Profs.


    The last db2ilist command shows that the instance has been moved to the cluster
    as we require.


    ![](img/a97b7826c3cf736045d80f48b5520a20_262_0.png)


    Chapter 9. DB2 with Microsoft Windows Cluster Server 245'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# 9.7.5 Adding a reference to the instance in the other nodes


    The db2iclus migrate command places the DB2 instance profile directory in the
    shared drive and adds the instance to the shared part of the Windows registry.
    However, the instance was created in one node only (Mochica in this example).
    The instance creation modifies several Windows registry keys as well as creating
    the service to be started in Windows. All these elements are missing from the
    other nodes in the cluster. If a failure occurs at this point, the cluster server
    will correctly failover to another node (Chimu) but will not find the Windows
    Service for the DB2 instance DB2PERU. The failover will be aborted.


    Use the db2iclus ADD command with the clause to create references to the instance
    in the remaining nodes. In our example, the second node is Chimu. The command
    must be run from the node that has the instance to be referenced and as follows:


    ```

    db2iclus ADD /i:DB2PERU /m:CHIMU /c:ANCASH /u:db2admin

    ```


    Figure 9-31 shows that the db2list command is executed twice in Chimu. The second
    execution is after running the db2iclus command showing that the instance is now
    existing in this node.


    ![](img/a97b7826c3cf736045d80f48b5520a20_263_0.png)


    Figure 9-31 Adding a DB2 instance to the second node


    # 9.7.6 Creating the highly available DB2 instance resource


    Migrating the instance to a cluster environment does not add this DB2 instance
    as a resource for the cluster. That is, up to this point, the cluster does not
    know that there is a highly available DB2 instance to be managed. In order to
    accomplish this, you must create a resource of type DB2 using Cluster Administrator
    utility.'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'Use the New Resource wizard in the Cluster Administrator to add the DB2 instance
    as a cluster resource:


    +   1. From the Cluster Administrator, right-click the DB2 group created (DB2PERU-0
    Group in this case) and then File -> New -> Resource.


    +   2. The New Resource wizard shows up.


    The resource name must be exactly the same as the last part of the Windows service
    name of our instance. In example, the Windows service name of our instance is
    DB2-DB2PERU-0, so the resource name must be DB2PERU-0. Select DB2 as the Resource
    Type and click Next. See Figure


    > Note: If the resource name is incorrect, the Cluster Server will not be able
    to find the service to start or stop DB2. The resource will be offline.


    To change the resource name, you have to drop and recreate the resource with the
    correct name. Renaming the resource will not solve the problem.


    ![](img/a97b7826c3cf736045d80f48b5520a20_264_0.png)


    Figure 9-32 Creating the DB2 instance resource


    +   3. In the Possible Owners window, accept the default of all nodes in the cluster
    as the owners. Click Next.


    +   4. The Dependencies window is shown. The instance must be dependent in the
    highly available IP Address and disks created, the instance cannot start without
    these two resources. They are DB2PERU-0 IP Address and Disk R:'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'See Figure 9-33. Click **Next** to proceed. In the next dialog, click **Finish**
    to create the resource.


    # Dependencies


    ![](img/a97b7826c3cf736045d80f48b5520a20_265_0.png)


    **Figure 9-33** Dependency list for the DB2 instance resource


    +   5. In the Cluster Administrator main window, right-click on the newly created
    resource and click **Bring online**.


    Once the DB2 instance is added to the cluster, you should start/stop the DB2 instance
    using only the Cluster Administrator interface. If you use any other means such
    as the DB2 Command Line Processor, you might have the following problems:


    +   If you stop the instance from the command line processor, the Cluster Server
    will detect this as a failure and will try to bring the instance immediately.


    +   If the DB2 cluster service is offline and you bring the instance online from
    the command line processor, the cluster will not detect this and thus from the
    instance will not be highly available.


    # 9.8 Configuring a highly available DB2 instance using db2mscs


    The *db2mscs* utility automates most of the steps of creating a highly available
    DB2 instance in the Windows Cluster environment. The prerequisite is the shared
    disk where the instance profile will be made made highly available before running
    the utility. All other steps such as creating the highly available IP address
    and network name are automated by the tool.'
  merge: -1
