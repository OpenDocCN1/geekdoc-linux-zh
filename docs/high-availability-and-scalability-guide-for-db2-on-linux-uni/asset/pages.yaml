    # 13.2.4 Data partition elimination during query processing


    Query processing is enhanced to automatically eliminate data partitions based

    on the predicates of the query. The data partition elimination ability benefits

    many decision support queries. It also increases the throughput for OLTP

    systems by allowing the use of multiple devices to insert, update, and delete

    table data at the same time.


    # 13.3 Creating a partitioned table


    Partitioned tables can be created by the CREATE TABLE statement with

    the PARTITION BY clause or using Control Center. To partition an existing table,

    y must unload the data, drop the table and recreate it as a partitioned table.


    The ALTER TABLE statement allows you to add partitions to a table. The ALTER

    TABLE statement with DETACH or ATTACH clauses can be used to add an

    existing table as a partition of a partitioned table or to convert a data partition
    into

    an independent table.


    # 13.3.1 Prerequisites


    To create a table, the privileges held by the authorization ID of the statement

    must include at least one of the following authorities or privileges:


    +   - CREAT authority on the database and USE privilege on all the table

    spaces used by the table, as well as one of the following:

    - IMPLICIT_SCHEMA authority on the database, if the implicit or explicit

    schema name of the table does not exist.

    - CREATEIN privilege on the schema, if the schema name of the table

    refers to an existing schema.'
