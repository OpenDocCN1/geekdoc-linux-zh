    # 5.4.1 Example 1: Involving a non-HADR database


    In this example we use two DB2 host systems KANAGA and ATLANTIC. At KANAGA, a
    database SAMPLE is created. Furthermore, the database SAMPLE is also created at
    the alternate server ATLANTIC with port number 50030.


    At the client machine, the database SAMPLE is cataloged at node KANAGA. Node KANAGA
    references the host name KANAGA and port 50030.


    To activate automatic client reroute, you need to update the alternate server
    for database SAMPLE at server KANAGA as follows:


    ```

    db2 update alternate server for database sample using hostname atlantic

    port 50030

    ```


    Without having the client reroute feature set up, the application receives an
    communication error when executing a transaction, SQL30081N. With the automatic
    client reroute feature set up, DB2 will try to establish the connection to KANAGA
    again. If it is still not working, DB2 will try the alternate server location
    (host ATLANTIC with port 50030). Assuming there is no communication error on the
    connection to the alternate server location, the application can continue to run
    subsequent statements or resubmit the transaction if it has failed. Since we do
    not have HADR in this case, one has to consider how to keep the two databases
    in sync and the standby to be online when the primary is down.'
