  md: 'In the Add System dialog box, the three mandatory fields for details of the
    remote server (System, Host, and Node name) are described as follows:


    +   * System name: If you do not have a working DNS and you will use the IP address
    of the server in the next field, put the host name value here. By default, entering
    a value in this field will fill out all the three fields with the same value,
    which is usually acceptable in a DNS environment with good naming standards.

    * Host name: Either the IP address, the DNS, or the host name of the server registered
    in the /etc/hosts file.

    * Node name: This can be any user-assigned value. Within DB2, it is a nickname,
    which represents the server, as opposed to the Instance node name, which represents
    the instance. In Windows, this is meant to refer to the NetBios Workstation name
    (dbm cfg part: NNAME). There should be a hover/pop-up with this descriptive instruction
    if you hold the cursor on the node field. Practically speaking, it represents
    an ADMIN TCPIP NODE, which you can get a current list of with the


    ```

    db2 list admin node directory

    ```


    The remote server''s dbm cfg might not even have an appropriate name defined,
    so you can use any name up to eight characters.


    The fact that you are required to catalog the Admin TCPIP Node partially explains
    why you must have the DB2 Admin Server running at both ends in order to set up
    and manage HADR using the GUI interfaces and wizards.


    When you are finished with the Add System dialog box, click OK. You may be prompted
    at this point by the DB2 Admin Server to enter a SYSADM user ID and password for
    connectivity to that new system. If you receive a communication failure after
    correctly entering a valid user ID and password in this dialog box, it could be
    related to the firewall for port 523, but it is best to check through all the
    possibilities described in the troubleshooting guide presented in 3.4, "Troubleshooting"
    on page 80.


    If you receive the SQL1018N error message due to a duplicate node name, and you
    want to remove the incorrect entry and use values in your Add System dialog box
    without cancelling the Setup HADR wizard, you can open a separate Command Window,
    and enter the command:


    ```

    db2 uncatalog admin node <nodename>

    ```'
