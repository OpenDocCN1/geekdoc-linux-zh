  md: '# 6.3.9 Index logging


    By default, the index build creates a log "create object" record, but index pages
    within the object are not logged. The index is then marked as "pending rebuild"
    and will be rebuilt once recovery is complete. This is undesirable for HADR, as
    a standby will have pending rebuild indexes that will be rebuilt when someone
    accesses them. On each takeover you will have indexes marked as bad, and will
    need an index rebuild. Index rebuild can take a long time after failover.


    The LOGINDEXBUILD database configuration parameter must be set to ON to establish
    a rule at the database level to log all indexes. This controls whether log build
    object or not. Index update is always logged. This parameter applies at index
    creation, recreation, and table reorganization. The default is OFF. We recommend
    setting this parameter to ON for HADR databases.


    There is a table level index attribute that overrides the database level configuration
    parameter. This table level is set with the ALTER TABLE statement LOG INDEX build,
    which can be set to the following values:


    +   * ON: Logs index build

    * OFF: Does not log index build

    * NULL: Defaults to LOGINDEXBUILD is set in database configuration


    There might be an impact to transaction performance if the LOGINDEXBUILD is ON.
    The impact on performance depends on the amount logs generated and number of indexes
    rebuilt or reorganized, the HADR synchronization mode, and the network availability
    and the standby''s ability to keep up with the primary. When the LOGINDEXBUILD
    is ON, issuing a REORG command on large number of tables that involves rebuilding
    indexes could impact transaction performance.


    The database manager and database level configuration parameter INDEXREC specifies
    the invalid index is to be rebuilt. Refer to "DB2 HADR configuration parameters"
    on page 138 for more details on the values for this parameter.


    # 6.3.10 Read on the standby


    HADR has certain restrictions; the standby database is not a full functional database.
    You cannot update the database from the standby, nor can you issue read-only queries
    on the standby. A fully accessible standby database would provide businesses with
    an opportunity for data mining without impacting users'' access on the primary
    database.'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'If there is a customer requirement to read from a standby, then the workaround
    is to use Veritas Storage Foundation for DB2 HADR. For more details on this implementation,
    read the white paper, Accessible Standby Database in IBM DB2 UDB HADR Environment
    Using Veritas Volume Instant Snapshots, at the Web site:


    ftp://ftp.software.ibm.com/software/data/pubs/papers/vrts-hadr.pdf


    This article describes the design and implementation of a solution for providing
    a fully accessible point-in-time copy of the standby database in a DB2 UDB HADR
    environment. Although this copy of the standby database is fully accessible, it
    is separated from the HADR pair so updates are not automatically applied to the
    main (HADR) pair of database copies.


    This solution leverages a new feature called instant space optimized volume snapshot
    which a single point-in-time copy of the storage can be created with only a small
    amount of additional disk space. Only storage for changed blocks is required.
    This article discusses how to activate a point-in-time copy of the standby database
    without impacting the active HADR databases. The space optimized volume snapshot
    feature enables the capability to produce a clean copy of the standby database
    without a WRITE SUSPEND on the primary database during the snapshot procedure.


    Figure 6-5 illustrates the Veritas Storage foundation for DB2.


    ![](img/a97b7826c3cf736045d80f48b5520a20_175_0.png)


