- img_proc: true
  md: '# # High Availability and Scalability Guide for DB2 on Linux, UNIX, and Windows


    Learn HADR setup, administration, monitoring, and best practices


    As organizations strive to do more with less, IBM DB2 for Linux, UNIX, and Windows
    provides various built-in availability features. DB2 further provides high availability
    by leveraging enterprise system resources with broad support for clustering software
    such as HACMP, TSA, and Microsoft Windows Cluster Server.


    Use HACMP, TSA, and MSCS with DB2 and DB2 HADR


    IBM Redbooks publication describes DB2''s high availability functions and features,
    focusing on High Availability Disaster Recovery (HADR) in the OLTP environment.
    The book provides a detailed discussion of HADR, including setup, configuration,
    administration, monitoring, and practices.


    Quick start with DB2 DPF


    We explain how to configure cluster software HACMP, TSA, and MSCS with DB2 and
    how to use these products to automate HADR takeover.


    DB2 also provides unprecedented enterprise-class scalability to 32-bit and 64-bit
    Linux, UNIX, and Windows platforms. We introduce the DB2 Database Partitioning
    Feature, covering the installation, configuration, and scaling of a database partition.


    ![](img/a97b7826c3cf736045d80f48b5520a20_445_0.png)


    INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create timely technical
    information based on realistic scenarios. recommendations are provided to help
    you implement IT solutions'' more effectively in your environment.


    For more information: ibm.com/redbooks


    SG24-7363-00 ISBN 0738488976'
