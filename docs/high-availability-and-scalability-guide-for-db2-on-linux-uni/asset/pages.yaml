- img_proc: true
  md: '# Starting and activating the database


    After the resources are taken over by the standby node, the next thing to do is
    to re-enable the DB2 database for client use, which includes the following activities:


    +   - Restart the DB2 instance (by the db2start command)

    - Activate the database, including buffer pool activation and crash recovery


    If crash recovery is required, it can consume some time before the database can
    be opened for client access. From the perspective of high availability, it is
    imperative to reduce crash recovery time and restart the database more rapidly.


    Crash recovery is the process by which the database is moved back to a consistent
    and usable state. This is done by rolling back incomplete transactions and completing
    transactions that were still in memory when the crash occurred. In other words,
    crash recovery updates the data in table containers to match what is stored in
    any unprocessed log records. This time consumed by crash recovery depends on how
    large the gap is between the log records and the actual data in database containers.
    Here, the gap equates to the amount of log records as follows:


    +   - Records to be rolled forward: The amount of log records that have been committed,
    but have not been written from the buffer pool to the disk.

    - Records to be rolled back: The amount of log records that have not been committed,
    but have been written to disk.


    To make crash recovery fast, you have to reduce these amounts:


    +   - Records to be rolled forward:


    You can synchronize memory and database pages more frequently by writing the dirty
    pages on buffer pool to the database pages. We introduce some relevant tuning
    parameters next.


    +   - NUM_IOCLEANERS:

    The page cleaner DB2 process (I/O cleaner) is in charge of writing dirty pages
    on the buffer pool to the database pages. The number of processes activated is
    determined by the database configuration parameter NUM_IOCLEANERS. When you increase
    this parameter, the contents of the database will be updated more on disk, because
    the page cleaner cleans dirty pages from buffer pools to data pages and therefore
    this will reduce the crash recovery time. We recommend that you increase this
    parameter depending on the number of CPU cores on the server.'
  merge: -1
  pgno: 229
- img_proc: true
  md: '– SOFTMAX and CHNGPGS_THRESH:


    The page cleaners are started according to the setting of the database configuration
    parameters SOFTMAX and CHNGPGS_THRESH. Tuning these parameters lower than default
    values helps to reduce crash recovery time, with the trade-off of increasing the
    load on system resources.


    When the SOFTMAX parameter is set lower, it will cause the database manager to
    trigger the page cleaners more often and take more frequent soft checkpoints.
    The log control file is then written to disk more often and thus can reduce crash
    recovery time.


    The lower that the CHNGPGS_THRESH parameter is set, the lower the percentage of
    changed pages is required to be kept in the buffer pool. This will trigger the
    asynchronous page cleaners to start the buffer pool more often. This also means
    when committed data to the disk more often and therefore less recovery time is
    needed in case of crash recovery.


    In theory, spreading out smaller but more frequent writes from buffer pools should
    reduce peak I/O load, and reduce the frequency of synchronous write I/O, frequent
    writes to storage by page cleaners may sometimes lead to adverse performance impacts.
    Consider the impacts to system load and throughput and tune for the best values
    to suit your system.


    From DB2 V8.1.4 onwards, consider using registry variable DB2_USE_ALTERNATE_PAGE_CLEANING
    for even improved and proactive page cleaner activity. This registry variable
    makes CHNGPGS_THRESH redundant, as it is no longer controls page cleaning.


    +   Records to be rolled back:


    It is important to frequently commit from the applications. This cannot be stressed
    enough; issues of transactional performance, concurrency, and ease of recoverability
    are heavily dependent on how applications are coded.


    Despite the appearance of a continuous connection to a database back-end, a well
    coded online transaction will perform most of its work without even holding locks
    on data, and will only need to gain locks momentarily before immediately committing
    in order to process requests after the user has confirmed a given answer.


    Batch processing is also a frequently abused target from users who expect to be
    able to see logged updates of millions of rows at a time, and then get upset when
    a login failure or timeout occurs halfway through their input files, and their
    transaction takes time to rollback. These are often the same users who complain
    when told the answer is to commit frequently as possible, meaning that they will
    have to code retry and restart logic into their batch jobs, or pursue alternatives
    such as unlogged loads with copy yes options.'
  merge: -1
  pgno: 230
