    INSTANCE: db2inst1  MODE : 000

    FUNCTION: DB2UDB, High Availability Disaster Recovery, hdrSetHdrState,probe:10000

    CHANGE : HADR state set to S-Peer (was S-NearPeer)


    To sum up the states of progression on the standby:


    +   - **None**: HADR has not yet started, the state is to None.

    - **S-Boot**: This is the initial phase.

    - **S-LocalCatch**: This indicates that any data from the standby log path sitting
    in the replay queue is being processed.

    - **S-RemoteCatchPending**: HADR has reached the end of the replay queue, and
    is waiting for a connection to the primary in order to see if there are further
    logs yet to be sent for replay.

    - **S-RemoteCatch**: HADR has made a connection to the primary, commencing receiving
    active/archive logs from the primary log path and replaying those logs to get
    closer to the Peer state (as opposed to Peer state, where logs are sourced from
    the memory on the primary).

    - **S-NearPeer**: HADR has finished replaying all logs on the standby local disk,
    and is waiting for the primary to suspend log writing, and complete reading any
    on-disk logs for the primary.

    - **S-Peer**: From the standby''s point of view, it has achieved the Peer state
    with the primary, according to the rules of the current SYNCMODE. The source of
    logs in the Peer state is the log buffer. That is, in-memory logs, as opposed
    to the primary on-disk logs in the case of RemoteCatch.


    These states which HADR standby database goes through, HADR START and database
    activation by achieving the Peer state, are also described in Chapter 7 of the
    DB2 9.1 Data Recovery and High Availability Guide and Reference, SC10-4228. The
    output in the db2diag file describes instance states. There is also a prefix to
    show whether the state is for a standby (S-) or for a primary (P-) database. Correspondingly,
    this summary of states for the standby can be applied to the same states in Example
    4-8 for the primary.'
