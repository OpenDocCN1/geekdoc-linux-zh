    # 6.3.12 Replicating load data


    When LOAD utility is used to move data into a table, the data is not included
    in the log file. There are some special requirements to replicate load data in
    the HADR environment. The basic rule is that the load operation is replicated
    only if there is a copy of the loaded data available for the standby to obtain
    the data.


    The copy device must be available when the standby replays the load operation
    any time after the primary completes the load. If a load operation is executed
    on the primary database with the NONCOVERABLE option, the command will execute
    on the primary database and the table on the standby database will be marked bad.
    The standby database will skip future log records that pertain to this table.
    You can choose to issue the LOAD command with the YES and REPLACE options specified
    to bring the table back, or you can drop the table to recover the space.


    For more details, see DB2 Information Center: Administering → database systems
    → High Availability → Managing HADR → configurations for HADR, and search for
    "Load operations and HADR."'
