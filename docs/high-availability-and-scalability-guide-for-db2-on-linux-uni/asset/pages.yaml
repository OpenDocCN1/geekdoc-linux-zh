    # Shutdown


    Although the STOP HADR command can be used to stop HADR the primary or the standby,
    or both, it should be used with caution. If you want to stop the specified database
    but still want to maintain its role as either an HADR primary or a standby database,
    do not issue the STOP HADR command. If you issue the STOP HADR command, the database
    will become a standard database and might require re-initialization in order to
    resume operations as an HADR database. Instead, use the DEACTIVATE DATABASE command.


    If you only want to shut down the HADR operation, this is the recommended way
    of shutting down the HADR pair:


    +   1. Deactivate the primary database.

    2. Stop DB2 on the primary database.

    3. Deactivate the standby database.

    4. Stop DB2 on the standby database


    # Using the STOP HADR command


    You can stop HADR from the command line or the Control Center. When you want to
    bring your database to a standalone database, you can use the STOP HADR command.'
