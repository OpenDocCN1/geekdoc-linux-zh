  md: "db2mscs uses a configuration file that defines the user and password to create\
    \ the services, the name and value of the resources like IP Addresses and network\
    \ names, and so on. db2mscs accepts three parameters:\n\ndb2mscs -f:<config_file>\
    \ -u:<instance name> -d:<debug_file>\n\n+   - f option: This option specifies\
    \ the configuration file. The default value of parameter is db2mscs.cfg\n\n+ \
    \  - u option: This option allows you to revert all changes in the specified instance\
    \ and return it to its unclustered form.\n\n+   - d option: This option specifies\
    \ the debug file name. The utility writes debugging information into the text\
    \ file specified in this option.\n\nThe configuration file accepts parameters\
    \ in the following format:\n\n| PARAMETER | VALUE\n\nDB2 provides some sample\
    \ configuration files under the directory %DB2Dir%\\sqlib\\cfg:\n\n+   - db2mscs.das,\
    \ to cluster a DAS instance.\n- db2mscs.ee, to cluster an EE instance.\n- db2mscs.ee,\
    \ to cluster an EEE instance.\n\nThe meaning of each parameter can be found in\
    \ the DB2 manual, Command Reference, SC10-4226.\n\nSince we have created an ESE\
    \ instance in the example above, we use db2mscs to cluster a WSE instance. Figure\
    \ 9-34 shows the commands to a DB2 WSE instance named DB2INCA.\n\n```\nC:\\DB2\\\
    SQLLIB\\BIN>db2list\nDB2PEUM\n C : ANCASH\nDB2CTLS\n\nC:\\DB2\\SQLLIB\\BIN>db2create\
    \ -s WSE -u db2admin\nEnter current password for db2admin:\nDB2000I DB2CRT command\
    \ completed successfully.\n\nC:\\DB2\\SQLLIB\\BIN>db2list\nDB2PEUM\n C : ANCASH\n\
    DB2INCA\nDB2CTLS\n\nC:\\DB2\\SQLLIB\\BIN>_\n```\n\nFigure 9-34"
  merge: -1
  pgno: 266
- img_proc: true
  md: 'The sample configuration file that we use is shown in Example 9-1.


    Example 9-1 Windows Cluster configuration file


    ```

    DB2_LOGON_USERNAME=CHAVIN\dbadmin

    DB2_LOGON_PASSWORD=mypasswd123

    CLUSTER_NAME=ANCASH

    GROUP_NAME=DB2INCA Group

    DB2_INSTANCE=DB2INCA

    #DB2_NODE=0

    ```


    ```

    IP_NAME=DB2INCA IP Address

    IP_ADDRESS=9.43.86.131

    IP_SUBNET=255.255.255.0

    IP_NETWORK=IBM Power 9

    ```


    ```

    NETNAME_NAME=DB2INCA Net

    NETNAME_VALUE=DB2INCA Net

    NETNAME_DEPENDENCY=DB2INCA IP Address

    ```


    ```

    DISK_NAME=T:

    INSTPROF_PATH=T:\DB2Profs

    ```


    Here are some points to notice in this example:


    +   - The value of IP_NAME is arbitrary. It is a good practice to use the instance
    name for the IP_NAME.


    +   - The value of NETNAME_DEPENDENCY has to be the same as the one on the IP_NAME
    since the network name depends on the IP_NAME.


    +   - The value of DISK_NAME must be a physical disk resource which has already
    existed in the cluster.


    Before running db2mscs, you must set the environment variable DB2INSTANCE to be
    the same as the db2mscs.cfg parameter DB2_INSTANCE. If you fail to do this, the
    operation will fail because db2mscs tries to start the sentence specified by DB2INSTANCE.
    Typically you will receive an error message as:


    ```

    C:\SQLIB\BIN>db2mscs -f:\temp\db2mscs.cfg

    DB21516 DB2MSCS cannot bring resource "DB2CLSV" online. Ensure that the properties
    of the resource are set correctly.

    ```


    Changing the instance name will solve the problem, as we can see here:


    ```

    C:\SQLIB\BIN>set DB2INSTANCE=DB2INCA

    C:\SQLIB\BIN>db2mscs -f:\temp\db2mscs.cfg

    ```


    DB25001 The DB2MSCS command completed successfully.


    250 High Availability and Scalability Guide for DB2 on Linux, UNIX, and Windows'
