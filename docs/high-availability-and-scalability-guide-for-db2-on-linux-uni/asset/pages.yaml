  md: '# 8.5 Considerations for db2nodes.cfg file


    From version 8 onwards, DB2 ESE single and partitioned instances have a db2nodes.cfg
    file in the sqllib subdirectory of the Instance home. db2nodes.cfg file is used
    to define the database partition servers that participate in a DB2 instance. In
    the cluster environment, you have to consider the entry of this file to start
    DB2 instances on different nodes.


    Suppose that a DB2 ESE single partition instance is running in a cluster which
    is composed of a service node named node1 and a standby node named node2. When
    a takeover occurs, the DB2 instance has to be started on node2. If the Instance
    home directory is configured on the shared disk, the entry in db2nodes.cfg file
    on the shared directory will not match the host name of the standby node. Then
    the db2start command fails with error codes -6048 or -6031 when the application
    start script tries to start the DB2 instance. Example 8-6 shows the case of db2start
    failing when db2nodes.cfg not


    Example 8-6 Error messages caused by an invalid db2nodes.cfg entry


    ```

    $hostname

    host2


    $cat /home/db2inst1/sqllib/db2nodes.cfg

    host1 0

    ```


    ```

    $ db2start

    SQL6048N A communication error occurred during START or STOP DATABASE MANAGER
    processing.

    ```


    You have several options to avoid this error, some of which are listed below:


    +   1. Modify the file entry in the start script.

    2. Use the db2start command with the restart option.

    3. Use the db2gcf command with the -u option.

    4. Use an alias in the hosts files.

    5. Use the IP address in db2nodes.cfg.


    Options 1, 2, and 3 modify the entry of db2nodes.cfg file manually or automatically,
    while options 4 and 5 do not require permission for remote execution, while options
    1, 3, and 4 do not.


    Next we describe ach of these options in further detail.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Modifying the file entry in the start script


    Perhaps the simplest of the listed methods, this entails modifying the entry of
    the db2nodes.cfg file before starting the DB2 instance, or preparing another configuration
    file with the correct entry and overwriting the existing db2nodes.cfg file. In
    our example, a DB2 instance, on the HACMP Service node named node1, (node2 as
    standby), has a db2nodes.cfg file shown below:


    +   - node1 0


    In the event of a takeover over node2, the db2nodes.cfg file shown above would
    be invalid, the application start script can include a process to modify db2nodes.cfg
    as below, or prepare a local file which already has the entry and copies or overwrites
    this file to the db2nodes.cfg file before starting the DB2 instance on node2.


    +   - node2 0


