    # 3.4 Troubleshooting


    Here we examine some of the possible issues you might encounter while setting
    up and running HADR, and while attempting to resume the HADR operation after a
    server failure, or other unanticipated interruption to DB2 communication. In most
    cases, the solutions and workarounds are straightforward, but not immediately
    obvious from any error messages you might or not be getting at the time. These
    examples are from first-hand experience, and the workarounds presented might not
    be the only way to resolve the situation.


    An additional source of material to review in case you run into trouble when setting
    up, are the platform-specific prerequisites and maintenance dependencies which
    are dynamically updated online on the Web site:


