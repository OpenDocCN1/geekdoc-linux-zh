- img_proc: true
  md: 'In an ideal situation, the Peer state should be continually tracked on the
    HADR primary server. If any failure occurs while not in Peer state, then consideration
    should be made before issuing db2 had takeover database sample by force command
    on the standby server B. In this, every effort should be made to correct issues
    on Server A and have that database restarted than issue a takeover by force command
    on Server B''s STANDBY database, as Peer state is the only guarantee you have
    that there has been no lost data from committed transactions.


    The second way will work regardless of whether the HADR pair was in Peer state
    at the time of a server failure. This method is relatively less complex, and saves
    time compared to the initial setup of HADR, hence the db cfg parameters are stored
    separately from the physical data containers, in a non-user-readable file called
    SQLDBCONF. This file is not replaced by a restore command unless the database
    has been dropped prior to the restore.


    At the most, if you need to drop your standby database before executing the restore
    from primary backup, you would need to change the db cfg parameters:


    +   - HADR_LOCAL_HOST = <hostname>

    - HADR_LOCAL_SVC = <this server HADR port#>

    - HADR_REMOTE_HOST = <the remote server hostname>

    - HADR_REMOTE_SVC = <the remote server''s HADR port#>

    - HADR_REMOTE_INST = <the remote server''s DB2 Instance name>


    Normally, you would never need to drop your standby database prior to the restore.
    However, DB2 will not let you restore the top of a database which is currently
    in an HADR standby or primary state, and in some cases, DB2 will not let you stop
    and put that database into a standard mode; this can happen if HADR was not stopped
    on a database before the DB2 instance is migrated from version 8 to version 9.


    Apart from not having to change your db cfg parameters after a restore, one reason
    you would not want to drop the database before the restore would be if you have
    a database with large containers, irrespective of the amount of data contained
    within them. DB2 needs to pre-format at the time of database creation. Large containers
    will take more time. The time needed depends on the storage and system capacity.
    Restoring the database without dropping the database before would save the pre-format
    time.


    If you are concerned about scheduling a downtime window for re-establishing HADR,
    you can rest assured that you should not need one: at most, you might experience
    read-only impact for a short duration while the online backup takes places on
    the primary database. As DB2 9.1 Command Reference, SC10-4226, Chapter 3 states:'
