    # Configuring the shared disk


    This requirement is specific to an HACMP shared disk configuration. Because shared
    disks are such an integral part of the HACMP setup, this section lists the high
    level steps needed to set up shared disk resources.


    Following are some of the terms concerning AIX Logical Volume Manager, which are
    used in this section:


    +   * Volume group (VG)

    * Logical volume (LV)

    * Journaled file system (JFS)

    * File system (FS)

    * Log that maintains a consistent JFS (JFSLog)


    Perform these steps to set up shared disk drives and the logical volume manager:


    +   1. Check the disk drives.


    Check that the external disk is configured and recognized from both nodes.


    +   2. Create the VG.


    Create the VG on the service node. The VG must have a unique name and major number
    (serial ID of VG) for all nodes in the cluster. You can check available major
    number on both nodes with the 1lvlstmajor command:


    ```

    root@model:/ 1lvlstmajor

    58...

    ```


    To add a volume group you can use the smit menu:


    ```

    # smity vg

    From Volume Groups -> Add a Volume Group -> Add an Original Volumes Group. Enter
    VOLUME GROUP name, and the available Volume group MAJOR NUMBER. as shown in Example
    8-1.

    ```'
  merge: -1
