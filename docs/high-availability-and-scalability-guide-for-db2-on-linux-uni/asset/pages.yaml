  md: '# Handling failure with the help of HADR


    The mechanism of DB2 HADR for handling failure at the primary side, is through
    the FORCE clause in the HADR takeover command, as mentioned previously. Once this
    occurs, HADR only knows about the new primary system, and looks for the failed
    primary reintegrating or new standby system that is initialized. The old primary
    system can no longer be validly used in its present state for clients to connect
    to, because of the potential loss in data integrity.


    The process of repairing the old primary system must be done carefully so as to
    avoid an accidental start HADR by force. The situation where two databases are
    active in HADR primary mode, one or more have HADR stopped and are now in the
    standard mode, is known as split brain, which is described in 2.5, "Terminology"
    on page 36. Creating an environment which is safe for repair (no risk of accidental
    client connection) can be accomplished by disabling the remote client TCP/IP connectivity
    to the DB2 instance port number on that server, whether that is by means of IP
    address control, or firewall, or simply updating the database manager configuration
    port number for that instance to some unused value.


    After the failed original primary server is repaired, it can be re-established
    as a standby database if the two copies of the database be made consistent. This
    process is discussed in 3.4.5, "Re-establishing failure" on page 86. After the
    original primary database is reintegrated into the HADR pair as the standby database,
    you can easily switch the roles of the databases to set the database on the repaired
    server to once again be the primary database, with an unforced HADR takeover command.


    # HADR topology


    The standard, and only currently supported topology for any pair of databases
    is one primary and one standby. This makes the most commonly seen layout as a
    pair of servers, one with a single DB2 instance acting as the primary, and the
    other with a single DB2 instance acting as standby.


    However, this does not limit the ways in which multiple pairs of HADR databases
    can be implemented on multiple server nodes.


    HADR replication takes place at a database level not at the instance level. So
    the standby server can have multiple databases from multiple primaries on it.
    Another configuration option is to implement two servers in an active/active mode
    cluster as shown in Figure 2-5. The advantage with this option is that it makes
    more efficient use of the available CPU cycles.'
