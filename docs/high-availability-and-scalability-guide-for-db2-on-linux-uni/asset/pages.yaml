- img_proc: true
  md: '# 9.7.2 Creating a DB2 group


    In order to create a highly available DB2 resource, we recommend that you place
    this resource in a separate group that can be failed over, failed back, and made
    online/offline independently from the main cluster group.


    The group can have any name. The recommended naming convention is to name it the
    instance. In our example, the DB2 instance is DB2PERU. We create a group called
    DB2PERU-0 Group.


    To create a group in the cluster, follow these steps:


    +   1. From Cluster Administrator utility go to File → Cluster → New → Group.

    2. The New Group wizard starts. Enter the group name in the Name field. We name
    this group DB2PERU-0 Group. See Figure 9-25.


    ![](img/a97b7826c3cf736045d80f48b5520a20_257_0.png)


    Figure 9-25 New Group wizard'
  merge: -1
  pgno: 257
- img_proc: true
  md: '3. In the Preferred Owners window (Figure 9-26), add the nodes that will be
    the owners of this resource.


    > Note: The node sequence makes a difference here. The node at the top of the
    list in the Preferred Owners list will be the initial owner of the group. All
    resources created inside a group are initially owned by the group owner.


    The owner of the resource is the node that can use the resources. In the case
    of a shared disk, for example, even the disk is shared and both nodes have paths
    to access it. The cluster software makes it so only the current owner can read
    and write that device.


    ![](img/a97b7826c3cf736045d80f48b5520a20_258_0.png)


    Figure 9-26 Owners


    Once the group is created, you will notice that there is a red arrow next to the
    group name that indicates that the group is offline (not working). This is due
    to the fact that the group does not have any resource defined and therefore is
    not working.'
  merge: -1
