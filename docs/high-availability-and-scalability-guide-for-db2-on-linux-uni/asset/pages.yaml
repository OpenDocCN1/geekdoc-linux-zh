    If client route is activated, you need to set the connection timeout value to
    a value that is equal to or greater than the maximum time it takes to connect
    to the server. Otherwise, the connection might timeout and be routed to the alternate
    server by client reroute. For example, on a normal day it takes 10 seconds to
    connect to the server, and on a busy day it takes 20 seconds, the connection timeout
    value should be set to at least 20 seconds.


    In the db2cli.ini file, you can set ConnectTimeout CLI/ODBC configuration keyword
    to specify the time in seconds to wait for a reply when trying to establish a
    connection to a server before terminating the attempt and generating a communication
    timeout. By default the client waits indefinitely for a reply from the server
    when trying to establish a connection.


    If ConnectTimeout is set and client route is activated, a connection will be attempted
    only to the original server and to the alternate server. Since the ConnectTimeout
    value is used when attempting to connect each server, the maximum waiting time
    will be approximately double the specified value for ConnectTimeout. If neither
    server can be reached by the keyword, an error message will be received, as shown
