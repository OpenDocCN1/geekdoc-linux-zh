  md: '# 5.4.2 Example 2: Involving a HADR database


    In this example, we set up HADR configuration between KANAGA and ATLANTIC for
    database SAMPLE. At KANAGA, a primary database SAMPLE is created. A standby HADR
    database is also created at host ATLANTIC with port 50030.


    At the client machine, a database SAMPLE is cataloged at node KANAGA. Node KANAGA
    references the host name KANAGA and port 50030.


    To activate automatic client reroute, you need to update the alternate server
    for database SAMPLE at KANAGA as follows:


    ```

    db2 update alternate server for database sample using hostname atlantic

    port 50030

    ```


    To enable an alternate server for the standby server at ATLANTIC which can fail
    back to primary server at KANAGA port 50030 which can be reintegrated into the
    HADR pair, you need to run this command on host ATLANTIC.


    ```

    db2 update alternate server for database sample using hostname kanaga

    port 50030

    ```


    Without having the automatic client reroute feature set up, the application will
    receive an error SQL30081N. When the primary database fails, applications will
    receive an error SQL30081N if HADR successfully brings up the standby server.


    If the automatic client reroute is set up, DB2 will try to establish the connection
    to KANAGA again. If it is still not working, DB2 will try the alternate server
    location (host ATLANTIC with port 50030). Assuming there is no communication error
    on the connection to the alternate server location, the application can continue
    to run subsequent statements or retry the failed transactions. The alternate server
    location is where the HADR standby is located. For client reroute to succeed,
    HADR has to successfully bring up the standby as the new primary. This process
    has to be initiated by the HADR takeover command either manually or by automating
    takeover through some other HA software like HACMP.


    # 5.4.3 Example 3: Involving a HADR database in HACMP cluster


    In this scenario, we set up an HADR pair on KANAGA and ATLANTIC where the primary
    and standby databases are serviced by the same cluster manager. HADR is established
    between KANAGA and ATLANTIC for database SAMPLE. At the server KANAGA, primary
    database SAMPLE is created. A standby HADR database is also created at host ATLANTIC
    with port 50030.'
