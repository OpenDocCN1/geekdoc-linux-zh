  md: 'To reintegrate the old primary, perform the following steps:


    +   1. Recover the failed primary, and bring it back online.


    +   2. Restart the failed primary as the new standby using the START HADR command,
    for example:


    ```

    db2 start hadr on database sample as standby

    ```


    If the two databases have incompatible log streams, for example, because of logs
    not being received from the standby before takeover, then the reintegration of
    the old primary to the new standby will fail and you will have to restore a backup
    of the current primary to your failed primary to start it as the new standby.
    Refer to 3.4.5, “Re-establishing HADR after failure” on page 86 for more details
    on reintegration.


