  md: '# ### 3.3 Basic operation


    This section give you basic details on the start, stop, and takeover operations
    preformed for HADR. We give examples for both the command line environment and
    GUI environment.


    # #### 3.3.1 Starting up and shutting down


    This section covers the startup and shutdown procedures for HADR on a GUI and
    command line environment.


    ##### Startup

    Before starting HADR, you should ensure that your database manager (instance)
    on both the primary and standby databases are started. Use the db2start command
    to start the instance. The instance can be started in any order, primary or standby.


    When starting HADR, we recommend that you start the standby database before the
    primary database. The reason for starting the standby first is that the primary
    HADR startup, without the FORCE option, requires the standby to be active within
    the HADR_TIMEOUT period or startup will fail to prevent a split-brain scenario.


    ##### Using the startup command

    This is the syntax for the startup command:


    ```

    START HADR ON DATABASE database-alias [USER username USING password] AS [PRIMARY
    BY FORCE] | STANDBY

    ```


    When starting the primary, the BY FORCE option specifies that the HADR primary
    database will not wait for the standby database to connect to it. After a start
    BY FORCE, the primary database will still accept valid connections from the standby
    database whenever the standby later becomes available.


    For example, to start HADR on the primary, issue the following command:


    ```

    db2 start hadr on database sample as primary

    ```


    It is important to note which database you are when you start HADR.


    You can find the details for the START HADR command in DB2 9.1 Reference, SC10-4226.'
  merge: -1
  pgno: 85
- img_proc: true
