  md: 'The best way to use a DataSource object is for your system administrator to
    create and manage it separately, using WebSphere or some other tool. The program
    that creates and manages a DataSource object also uses the Java Naming and Directory
    Interface™ (JNDI) to assign a logical name to the DataSource object. The JDBC
    application that the DataSource object can refer to the object by its logical
    name, and does not need any information about the underlying data source. In addition,
    your system administrator can modify the data source attributes, and you do not
    need to change your application program.


    To obtain a connection using a data source object:


    +   1. From your system administrator, obtain the logical name of the data source
    from which you need to connect.


    +   2. Create a Context object to use in the next step. The Context interface
    is part of the Java Naming and Directory Interface (JNDI), not JDBC.


    +   3. In your application program, use JNDI to get the DataSource object that
    is associated with the logical data source name.


    +   4. Use the DataSource.getConnection method to obtain the connection.


    By using javax.sql.DataSource interface, alternate server parameters can be picked
    up by the JCC application and kept in non-volatile storage on the client machine.
    The storage can be done using the JNDI API. If, for a local file system is specified
    as the non-volatile storage, JNDI will create a .bindings file which contain the
    required alternate server information.


    After the current JVM is shut down, the information will then persist in that
    file until a new JVM is created. The new JVM will attempt to connect to the server.
    The alternate server information has been updated, this will be updated on the
    client machine without requiring your intervention. If the server is missing however,
    .binding file will be read and a new connection will be made at the location of
    the alternate server. LDAP can also be used to provide non-volatile storage for
    the alternate server. Using volatile storage is not recommended, as a client machine
    failure could result in the loss of alternate server data stored in memory.


    To register the alternate server with JNDI and to persist:


    +   1. Create an instance of DB2ClientRerouteServerList, and bind that instance
    to the JNDI registry. DB2ClientRerouteServerList is a serializable bean with four
    properties:


    +   - alternateServerName

    - alternatePortNumber

    - primaryServerName

    - primaryPortNumber'
