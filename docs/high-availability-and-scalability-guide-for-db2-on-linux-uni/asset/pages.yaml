    ```


    +   3. Create the JFSLog.

    Create the JFSLog with a unique name on the new VG. When creating the first system
    on a new VG, AIX will automatically create a JFSLog, with the name of logv00,
    logv01, and on, for each new JFSLog on the machine. By default, AIX creates only
    one JFSLog per VG. Because a unique name is needed for the JFSLog, it is best
    to define the JFSLog with the mkliv command, before creating the first file system.


    To create a JFSLog with the name db2vgjfslog db2vg, issue the following command:


    ```

    # mklv -t jfslog -y db2vgjfslog db2vg 1

    ```


    To format the JFSLog, issue the following command, and when asked to destroy the
    LV:


    ```

    # logform /dev/db2vgjfslog

    ```


    logform: destroy /dev/db2vgjfslog (y)? y


    +   4. Create file LVs and JFSs as are needed, and ensure that you have unique
    names and are not currently defined on any node. Set the FSs so that they are
    not mounted on restart. Verify the current LV and JFS names.


    To create the LV for the /home/db2inst1 file system, issue the following command:


    ```

    # smit lv

    ```'
