- img_proc: true
  md: 'Clicking Show Command provides you the command DB2 used for this operation.
    Figure 3-23 illustrates the output.


    ![](img/a97b7826c3cf736045d80f48b5520a20_94_0.png)


    Figure 3-23 Takeover HADR command


    Now the primary and the standby roles are swapped. Issue the same command again
    to swap back the roles. This can be done as often as necessary, so long as the
    databases are in the Peer state.


    # 3.3.3 Takeover by force


    A takeover by force is also referred to as failover, which is issued from the
    standby database with the TAKEOVER command BY FORCE option included. You should
    use the takeover by force only if your primary database is not functional. The
    BY FORCE option tells the standby to become the new primary coordinating with
    the original primary as it does with a planned takeover.


    The procedure for failover includes the following steps:


    +   1. Make sure that the primary is down to minimize the chances of data loss.
    If a takeover BY FORCE is issued and the primary is not down, this can result
    in both the databases becoming primary databases. This is referred to as split
    brain.'
  merge: -1
  pgno: 94
- img_proc: true
  md: '2. Issue the TAKOVER HADR command with the BY FORCE option on the standby database.
    The following is an example for the sample database:


    ```

    db2 takeover hadr on database sample by force

    ```


    After issuing the TAKOVER HADR command with the BY FORCE option on the standby,
    the following steps are carried out in the background:


    +   1. The standby sends a notice asking the primary to shut down.

    2. The standby does not wait for any acknowledgement from the primary to confirm
    that it has received the takeover notification or that it has shut down.

    3. The standby stops receiving logs from the primary, finishes playing the logs
    it already received, and then becomes a primary.


    Data loss is possible when a takeover is forced. Your chance of data loss depends
    on your configuration and circumstances. The following list shows the general
    settings and the result of a failure on the primary.


    +   If the primary database is in the Peer state when it fails:

    - With syncmode to SYNC, the standby will not lose any transactions that were
    reported committed to the application before the primary failed.

    - With syncmode to NEARSYNC, the standby only loses transactions committed by
    the primary if the primary and standby databases fail at the same time. This is
    a highly unlikely circumstance.

    - With syncmode to ASYNC, the standby database can lose transactions committed
    on the primary if the standby did not receive all of the log records for those
    particular transactions before the takeover operation performed. As in the NEARSYNC
    mode, the primary and standby fail at the same time, transactions can be lost.

    If the primary is in the remote catch pending state or any other non-Peer state
    when it fails:

    - For all the three syncmodes (SYNC, NEARSYNC, ASYNC), transactions that have
    not been received and processed by the standby database will be lost.


    For more details on the ways to prevent data loss in a forced takeover, see Chapter
    7 in DB2 9.1 Data Recovery and High Availability Guide and Reference, SC10-4228.


    Following a takeover by force because of a failure at the primary database, the
    old primary is recovered and you bring it back online, you can reintegrate the
    old primary as the standby database.'
  merge: -1
