- img_proc: true
  md: '# Locking for SQL LOCK statements


    For partitioned tables, the only lock acquired for the LOCK TABLE statement is
    at the table level. No data partition locks are acquired.


    This ensures there is no row locking for subsequent DML statements, and also avoids
    deadlocks at the row, or data partition level. LOCK TABLE IN EXCLUSIVE MODE can
    also be used to guarantee exclusive access when updating indexes, which is useful
    in limiting the growth of type 2 indexes during a large update.


    # Row and block lock escalation


    For partitioned tables, the unit of escalation of row and block locks is the data
    partition level. This again means that a table is more accessible to other transactions
    if a data partition is escalated to share, exclusive, or super exclusive, leaving
    other non-escalated data partitions unaffected. The transaction may continue to
    row lock on other data partitions after escalation for a given data partition.


    The notification log message for escalations includes the data partition escalated
    as the partitioned table''s name. Therefore, exclusive access to an index cannot
    be ensured by lock escalation. Either the overall table lock for the access method
    must use an exclusive table level, an explicit LOCK TABLE IN EXCLUSIVE MODE statement
    must be issued, or the table must use the LOCKSIZE TABLE attribute. The overall
    table lock for the access method is chosen by the optimizer, and depends upon
    data partition elimination. A large update to a table might choose an exclusive
    table lock if there is no data partition elimination occurring.


    # LOCKSIZE TABLE option in the ALTER TABLE statement


    The ALTER TABLE statement has an option for setting LOCKSIZE TABLE, which ensures
    the table is locked in shared or exclusive mode with no intent locks. For a partitioned
    table this lock strategy is applied to both the table lock and the data partition
    locks for any data partitions accessed.


    # Rotating data in a partitioned table


    Rotating data in a DB2 Database for Linux, UNIX, and Windows refer to the method
    of reusing space in a data partition by removing obsolete data from the table
    before adding new data. The Table partitioning function allows you to detach the
    data partition with the obsolete data, then attach a new data partition with the
    latest data.'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# 13.6 Understanding partitioned index behavior


    Indexes on partitioned tables are similar to indexes for ordinary tables, that
    is, each index contains pointers to rows in all the data partitions of the table.
    One important difference, however, is that each index on a partitioned table is
    an independent object.


    In contrast, in partitioned database environments, the index is distributed across
    the database partitions in the same manner as the table. Because an index on a
    partitioned table can act independently of other indexes, some special considerations
    are needed with respect to which table space is used when creating an index on
    a partitioned table.


    An index on a partitioned table is created in a single table space even if the
    data partitions of the table span multiple table spaces. Both DMS and SMS table
    spaces support the use of indexes in a different location than the table. All
    table spaces specified must be in the same database partition group. Each index
    can be placed in its own table space, including large table spaces. Each index
    table space must use the same storage mechanism as the data partitions, either
    DMS or SMS. Indexes in large table spaces can contain up to 2^{29} pages.


    Additional benefits of an index on a partitioned table include:


    +   - Improved performance of drop index and online index create.


    +   - The ability to use different values for any of the table space characteristics
    between each index on the table (for example, different page sizes for each index
    may be appropriate to ensure better space utilization).


    +   - Reduced I/O contention providing more efficient concurrent access to the
    index data for the table.


    +   - When individual indexes are dropped space will immediately become available
    to the system without the need for an index reorganization.


    +   - If you choose to perform index reorganization, an individual index can be
    reorganized.


    Figure 13-1 shows a non-partitioned index on a partitioned table residing in a
    single table space.'
