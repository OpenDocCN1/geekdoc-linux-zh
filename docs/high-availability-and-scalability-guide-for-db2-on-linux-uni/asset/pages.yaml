- img_proc: true
  md: '# TSA components


    Since V2.1 (V2.2) at the time of writing, TSA consists of these components:


    +   - End-to-end automation component:


    This is the second-tier-enabling technology, which gives TSA a rare ability to
    provide control over heterogeneous environments of multiple base-level clusters.
    The low level clustering software, currently installed, is not replaced. TSA end-to-end
    automation control can control an existing HACMP on AIX, Heartbeat on Linux, and
    MSCS just as easily as it were controlling a TSA base component cluster on these
    same platforms. TSA software interfaces called End-to-End Automation Adapters
    operate between TSA and the base-level clustering software.


    For more details, refer to:


    +   - End-to-end Automation with IBM Tivoli System Automation for Multiplatforms,
    SG24-7117.


    +   - Base component:


    This TSA component provides base-level cluster functionality. It acts as an equivalent
    to HACMP or clustering software, on AIX and Linux. The TSA base component consists
    of the following parts:


    +   a. Automation adapter:


    At the base component level, a first level automation adapter is used to directly
    control resources on nodes inside the base-level cluster.


    At the end-to-end automation component level, an end-to-end automation adapter
    provides an interface between the automation layer already existing within a single
    base-level cluster, and the end-to-end automation layer that spans multiple clusters.


    +   b. Operations console of the base component:


    The TSA Operations Console is a Web browser accessed (no client software install),
    based on the WebSphere Portal Integrated Solutions Console. It spans all TSA domains,
    and provides the same look and feel, there is no interface discrepancy between
    platforms.


    While the Operations Console is there to monitor the automation and current states
    of various resources, it also allows manual resource state changes (for example
    if a server is required to be taken offline for maintenance), and performs takeovers
    accordingly. The Operations Console can operate in three different modes:


    +   i. End-to-end automation mode: Where end-to-end automation is essentially
    active.'
