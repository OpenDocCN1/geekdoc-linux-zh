    TSA monitors the HADR pair for primary database failure, and will issue appropriate
    takeover commands on the standby database in the event of a primary database failure.
    Also, in addition to being an application server, had03 acts as a heartbeat node.
    That is, TSA on had03 will provide quorum between the primary and standby nodes,
    so as to prevent the scenario of having two primary databases (also known as "split-brain"
    syndrome) in the event of simple network communications problems between had01
    and had02.


    For TSA cluster domains that are running TSA v2.1 or later, it is possible to
    use a network tiebreaker to provide quorum support. In this environment, only
