- img_proc: true
  md: '# DB2 with Microsoft Windows Cluster Server


    In this chapter we provide the steps to set up a highly available DB2 environment
    with Microsoft Windows Cluster. We explain the fundamental concepts of Microsoft
    Windows Cluster Server to help you understand its architecture and the basic configuration
    procedures in Windows 2003 Advanced Server.


    We discuss how to configure a DB2 instance and other cluster resources to become
    the highly available resource in Window Cluster Server.


    We demonstrate the configuration steps using both the automatic utility db2mscs
    and the manual steps.


    > Note: This chapter uses the screen shots from Microsoft Windows Cluster. Microsoft
    product screen shots are reprinted with permission from Microsoft Corporation.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# 9.1 Cluster Server concepts


    Microsoft’s answer to high availability requirements in business is Windows Cluster
    Server, formerly known as Microsoft Cluster Servers (MSCS).


    MSCS was early introduced in the Windows NT® 4.0 Enterprise edition as a separate
    component from the operating system.


    With the introduction of Windows 2003 Advanced Server and Data Center editions,
    MSCS has been revamped in what is now called Windows Cluster Server (which will
    be referred to as Cluster Server hereafter). Cluster Server is an integral part
    of the operating system and therefore cannot be uninstalled. It is always present
    (under %windir%Cluster), therefore no additional software pieces have to be installed.


    The objective of this chapter is not to make an exhaustive description of Windows
    Cluster but to introduce the fundamental concepts that the DB2 DBA can consider
    this feature with DB2 when selecting a clustering product for a DB2 application.


    In this section, we introduce some concepts particular to Cluster Server. General
    concepts from cluster technologies are not mentioned as they have been described
    in Chapter 1, “DB2 high availability options” on page 3.


    # 9.1.1 Types of clusters


    Cluster Server provides technologies to create two types of highly available servers,
    depending on what services must be made available:


    +   - Network Load Balance (NLB)

    - Quorum cluster server


    # Network Load Balance


    NLB is a type of cluster that allows enterprises to create a farm of servers (nodes)
    that provide a service to applications. In the event of a failure in one of the
    nodes, the workload of that node can be assimilated by the rest of the nodes in
    the farm. This type of cluster is suitable for applications that do not store
    a state. Applications that are usually capable to scale-out horizontally, such
    as Proxy servers, Web servers, and so on, are the target for this type of clustering
    solution.


    An NLB server uses algorithms to balance the load of each node to generate the
    best possible overall performance. NLB is included in all versions of Windows
    2003.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Quorum cluster server


    Quorum cluster servers can be used for applications that store a state (such as
    a Database Management System) and are used for services that usually scale vertically
    and have to be made highly available.


    Since these services can scale-out vertically, a server farm cannot be created,
    and the only way to make the server highly available in case of node failure is
    to have a spare machine that will take over the functions of the failed node.


    Cluster servers require the use of special shared disks among the nodes or the
    use of complex algorithms among nodes to synchronize the state of the nodes and
    the services they provide.


    Cluster servers come in two different types:


    +   - Single quorum servers

    - Majority node set (MNS)


    # Single quorum servers


    Single quorum servers use a shared disk known as quorum. These shared disks are
    SCSI disks in a shared bus or a Storage Area Network (SAN) using Fiber Optics.


    One of these shared disks is known as the quorum for the cluster. This quorum
    is used as an arbitrator to track which node is the owner of the resources and
    services. If the node that owns the resource goes down, Cluster takes action to
    move the service to another node.


    # Majority node set


    MNS consists of two or more nodes that do not have a single shared quorum. Each
    node in the system has their own copy of the quorum in a local disk. The Cluster
    Server uses complicated algorithms to keep the local quorums synchronized. These
    nodes may or not be attached to one or more cluster storage devices.


    MNS clusters are more commonly seen in a geographically dispersed cluster configuration
    and is the reason for not using shared devices. The down side of this type of
    configuration is that for the cluster to work, you require half of the nodes plus
    one and interconnected.


    This rule is necessary since all clusters are connected only throughout the network.
    The only way to know if a server has the correct quorum information is by knowing
    that the majority of the nodes have the same information.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 9.1.2 Microsoft Cluster Server definitions


    From now on we refer only to single quorum servers. In this section, we introduce

    a few concepts that are necessary to understand how single quorum servers

    work in Windows Cluster Servers.


    # Resource type


    In Cluster Server, a resource type is a service, such as Web service, IP address,

    or a device, such as a shared disk, that has to be made highly available.


    For every type of resource to be manipulated, you require a handler which is an

    interface that will manipulate this resource. For example, if you want to

    make highly available a shared disk, you require a mechanism to:


    +   - Detect the resource is working properly.

    - Detect the availability of the disk from each node.

    - Failover or failback the resource among the nodes as necessary.


    In the case of Cluster Server, this handler is implemented as a Dynamic Link

    Library (dll) that must be provided by the provider of the service or resource.
    In

    t case of basic operating systems or resources (such as disks), Cluster Server

    provides a default dll that can handle them.


    In the case of DB2, a new type of resource known as DB2 should be created.

    The library that manages this resource is version dependent. The dyl files and

    location are as follows:


    +   - DB2 Version 8: %DB2PATH%%db2wolf.dll

    - DB2 Version 9: %windir\MSCS\db2server.dll


    # Resource


    A resource is any element you want to make highly available in the system.

    Common resources that you will find:


    +   - IP addresses

    - DB2 instances

    - File shares, which are shared directories in Windows

    - Shared disks


    # Groups


    A cluster group is a set of resources that are interdependent of each other.

    are are logically linked together for a specific purpose, for example, to make
    a DB2

    instance highly available.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'Groups also make it possible to establish ownership of the resources to each
    node. When the group is created, you must specify what nodes can use the resources
    in that group and which node will be the initial owner.


    # 9.2 Minimum configuration and sample setup


    In order to set up a single quorum Cluster Server, you require at the very least:


    +   - A Windows 2003 domain.

    - Two machines to work as the nodes in the cluster suing the Windows 2003 Advanced
    Server or Data Center Editions.

    - A shared disk that can be accessed simultaneously from all the nodes.

    - Two network cards in each node is desirable but not mandatory.


    In our example, we have the following resources:


    +   - We set up a machine Wisla, a Windows 2003 standard server, running Windows
    2002 Advanced Server.

    - Machines Mocha and Chimu running Windows 2002 Advanced Server.

    - Each node has a QLogic Q2200 PCI Fiber Channel adapter to access the SAN devices.

    - Four disks are created in the SAN infrastructure for the nodes:


    +   - Drive Q: has 1 GB space and has been created to be the quorum of the cluster.

    - Driver R;, S and T: are 50 GB partitions for DB2 table spaces and instance profile
    storage.


    Following is the procedure to set up a highly available DB2 environment with Cluster
    Server. We provide detailed steps for creating Windows Clustering Server and configure
    DB2 with it in the next sections. Refer to the Windows documentation for the steps
    mentioning the Windows domain controller.


    +   1. Install Windows 2003 Advanced Server or Data Center Edition on each machine
    that will be a cluster node.

    2. Configure the shared disk devices and make sure that each node has access to
    the shared resources.

    3. Add the nodes to the Windows Domain.

    4. Create a Cluster Server.

    5. Add nodes to the Cluster Server.

    6. Install DB2.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '+   7. Create a DB2 instance.

    8. Make the DB2 instance highly available.


    # 9.3 Creating a cluster server


    In order to create a cluster, you require a Windows Domain. All the information
    related to the cluster is stored in the active directory of the domain. The machines
    that will be part of the cluster must use Windows 2003 Enterprise Edition or Windows
    2003 Data Center Edition. The cluster services are not available in Windows 2003
    standard edition.


    We follow these steps to create a Cluster Server:


    +   - Add the machines that will be the nodes to the domain.

    - Create the cluster in the domain.


    # 9.3.1 Adding the machines to the domain


    The first step is to attach the machines that will conform the cluster into the
    Windows domain. In order to accomplish this, follow this procedure for each machine.'
  merge: -1
