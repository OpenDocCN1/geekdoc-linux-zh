    PART Q01_02 STARTING (2002,1) ENDING (2002, 3) INCLUSIVE,

    PART Q02_02 ENDING (2002, 6) INCLUSIVE,

    PART Q03_02 ENDING (2002, 9) INCLUSIVE,

    PART Q04_02 ENDING (2002,12) INCLUSIVE,

    PART CURRENT ENDING (MAXVALUE, MAXIMUM)

    );

    ```


    Gaps in the ranges are permitted. The CREATE TABLE syntax supports gaps by allowing
    you to specify a STARTING value for a range that does not line up against the
    ENDING value of the previous data partition.


    Example 13-11 creates a table with a gap between 101 and 200.


    # Example 13-11 Creating a partitioned table with range gaps


    ```

    CREATE TABLE foo (a INT)

    PARTITION BY RANGE (a)

    (STARTING FROM (1) ENDING AT (100),

    STARTING FROM (201) ENDING AT (300))

    ```


    The use of the ALTER TABLE statement, allows data partitions to be added or removed,
    can also cause gaps in the ranges.


    When you insert a row into a partitioned table, it is automatically placed into
    the proper data partition based on its key value and the range it falls within.
    If it falls outside of any ranges defined for the table, the insert fails and
    an is returned to the application:


    ```

    SQL0327 The row cannot be inserted into table <tablename> because it is outside
    the bounds of the defined data partition ranges.

    SQLSTATE=22255

    ```'
