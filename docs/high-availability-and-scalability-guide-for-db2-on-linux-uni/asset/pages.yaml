    +   - It includes DB2 for OS/390® and z/OS® sources, targets, both, in addition
    to DB2 for Linux, UNIX, and Windows sources, targets, or both.


    +   - It can access multiple database management system (DBMS) types of sources
    and destinations.


    +   - Replica databases are not disabled or hidden from client connectivity Client
    read-only access to replica database is recommended with SQL replication due to
    unidirectional replication.


    # When to use


    You can use SQL replication in the following situations:


    +   - If you have a heterogeneous database provider environment, SQL replication
    can access more source and destinations than Q replication.


    +   - When you have multiple targets from a single source, the information can
    be replicated or broadcast from the staging tables. This can suit geographic distribution
    for read-only or aggregate data for Management Information Systems or data warehousing.


    For more information on SQL replication, refer to the following sources:


