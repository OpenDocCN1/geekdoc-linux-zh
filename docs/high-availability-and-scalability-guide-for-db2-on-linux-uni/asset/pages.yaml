  md: '# 2.3 DB2 logical log architecture


    In this section, we discuss the logical log architecture. This DB2 architectural
    background can be helpful for clearly comprehending the architecture behind HADR.
    We assume that the readers are familiar with the DB2 buffer pool architecture.


    One of the main features that DB2 has to improve performance, and guarantee the
    security and robustness of your data, is the capability of managing transaction
    integrity.


    In order to preserve the logical integrity of the database, individual SQL operations
    are grouped together as a transaction. All operations inside a transaction are
    guaranteed to be executed in an all-or-none fashion. If a failure occurs at any
    individual step, the transaction is aborted (rolled back) and all individual operations
    that have already executed are undone. Transactions are also known as atomic,
    or logical units of work, in which they can be constituted of smaller elements,
    they cannot (and must not) be logically split up, either from the point view of
    an application''s specific business rules, or data integrity in general.


    DB2''s logical logging implements Semantics (ARIES) recovery algorithm, which
    is a write-ahead logging (WAL) protocol to ensure atomic operations. In this protocol,
    every agent that modifies a page will also generate a record of the operation
    known as a *logical log record*. This logical log record is stored in a special
    section of the disk known as a *logical log file*. Transactions have special logical
    log records that identify the beginning and the end of a transaction. In the event
    of a crash, the logical log files are read and all records in them are replayed.
    All records belonging to the incomplete transactions are rolled back, bringing
    the database to a consistent state.


    ARIES is described in further detail at the following Web site:

    http://www.almaden.ibm.com/u/mohan/ARIES_Impact.html


    For performance reasons, the log records are not written directly to the disk,
    but to a buffer area known as the *logical log buffer*. To minimize the information
    loss, the logical log buffer is flushed every time an application commits a transaction.


    For the ARIES protocol to work as designed, a condition must be met: not dirty
    pages in the buffer pool can be written to the disk (table space container) before
    the logical log buffer pages containing the logical log records that modified
    the buffer pool page are written to the logical log file.'
  merge: -1
  pgno: 45
- img_proc: true
  md: 'Figure 2-2 depicts a sequence of events that happen on the server when an application
    requests an update to a page in a table space. The db2agent is a process (in Windows
    platforms it is a Windows thread) that is in charge of executing the work requested
    by the application.


    ![](img/a97b7826c3cf736045d80f48b5520a20_46_0.png)


    Figure 2-2 Application interaction with DB2 processes to update table space data


    Here we describe each sequential event:


    +   1. The application requests to update a row in a table.

    2. The data is read (fetched) from the table space into a page in the buffer pool.

    3. The db2agent receives the page from the buffer pool and modifies it.

    4. The DB2 engine records what was changed in that by writing a logical log record
    into the logical log buffer. This record can later be used to undo the operation
    in case of a rollback, or to replay the transaction in the event of a failure
    (rollforward).

    5. The page is modified and placed again into the buffer pool. At this point it
    is not safe to write the page from the buffer pool back into the table space as
    the logical log record is still in the log buffer but is not written to the log
    file yet.'
  merge: -1
  pgno: 46
- img_proc: true
  md: 'Because the log buffer only exists in the memory, a system crash can cause
    the logical log record to be lost forever. If this change was written to the table
    space before it were recorded in the log file, in the event of a DB2 crash, DB2
    would not know about this transaction from the log files, DB2 would not be able
    to replicate that data by means of a rollforward from the most recent backup image.
    Conversely, a crash after a successful write of log data to the log file on the
    disk would enable DB2 rollforward recovery to replicate the data correctly in
    the table space container.


    Note that flushing the log buffer and the buffer pool are asynchronous operations
    accomplished by different engine dispatchable units (EDUs), db2agent is free at
    this point to do any other work.


    +   6. At some point an event triggers a log buffer to be written to the logical
    log files. This work is accomplished by an EDU called db2loggw. Events that might
    trigger the flush of the log buffer include:


    +   - An application issues commit and commit count is equal or higher than the
    value specified in the database configuration parameter MINCOMMIT.


    +   - A page in the buffer pool that references a log record in this buffer must
    be written to the disk.


    +   7. Once the logical record has been written to the logical log file, it is
    safe to flush the modified data page from the buffer pool into the table space.


    Every operation executed by the database over a page generates a logical log record
    that is stored in a logical log file. Logging is made at the database level in
    DB2, so each database will have its own log files and separate logging processes.


    The log buffer is written to the disk by the logger db2loggw. There is another
    EDU known as the log reader which has the role of reading data from the logical
    log files during, for example, a rollforward operation, or when a userxit application
    is invoked. The classical log reader used by DB2 version 8 is db2loggr.


    With the introduction of HADR in DB2 V8, a new type of log architecture is created.
    This architecture is implemented by an EDU known as log file reader. Presently,
    db2fr and db2loggr coexist to manage different subsystems, but eventually, both
    of them will be migrated to the new db2fr EDU.


    # 2.4 HADR architecture


    HADR technology is tightly coupled to the DB2 logging and recovery strategy. The
    main design goal of DB2 HADR is to quickly fail the failed system to a spare cluster
    node or to a disaster site in case of failure of the primary server.


    30 High Availability and Scalability Guide for DB2 on Linux, UNIX, and Windows'
  merge: -1
  pgno: 47
- img_proc: true
  md: 'The basic architecture of HADR is very simple. It is based on the shipping
    of logical log records from the primary database to a remote instance that contains
    what is known as the "standby database". Thus, in DB2 the HADR implementation
    allows for the database administrator (DBA) to decide which databases must be
    replicated.


    The communication between the primary and the standby databases is accomplished
    by a communication protocol based in messages relayed over the TCP/IP layer.


    After the appropriate start HADR commands have been entered on both the standby
    and primary databases, the HADR system actually starts once the primary can make
    a successful initial connection to an activated standby database. In any case
    the database can then only be deactivated by the deactivate database command.


    In an HADR system, DB2 has two special EDUs to manipulate HADR work. The one in
    the primary is db2hadr. Its counterpart in the standby database is db2hadrs. They
    are in charge of sending logical logs from the primary to the standby, processing
    system messages, and receiving logical logs on the standby system.


    At database activation in the primary, db2hadr is spawned; this will read the
    database configuration file and open a port to listen for a connection from the
    standby. The relevant HADR database configuration parameters are described in
    6.1, "DB2 HADR configuration parameters" on page 138. This during time no connections
    are allowed. The primary will wait for the number of seconds set in the configuration
    parameter HADR_TIMEOUT for the standby connection, and will then abort the database
    activation if it is not able to successfully connect to an active standby database.


    If the FORCE clause is used when issuing the START HADR command, the database
    will not wait to connect. The primary creates a listener and listens on the HADR
    port. The standby will initiate to connect to the primary. If the standby''s connection
    attempt fails, it will retrying to the primary. Clients will be able to find the
    primary database, and whenever the standby is ready, the HADR functionality will
    become operative.


    The downside of using FORCE clause is that the database will not respect the setting
    of the AUTOSTART parameter and in the event of a crash occurring, crash recovery
    will be performed irrespective of the current setting. Any other methods to start
    HADR, including ACTIVATE DATABASE and the first client connection, will respect
    AUTOSTART settings.


    After the connection is established, the status and "health" of the HADR system
    is monitored by a mechanism known as heartbeats. This is basically to verify that'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'both the primary and standby can see each other. Heartbeats are special short
    messages sent over the HDRF connection from the primary to the standby, which
    are acknowledged and sent back by the standby. The heartbeat messages are spaced
    at known time intervals so each can know how many heartbeats have been missed
    and take appropriate actions.


    Upon successful connection of the standby database to the primary, the HDRR enters
    the catchup phase. During the catchup phase the size of the log gap from the standby
    to the primary is established and the primary starts sending all logical logs
    that are required for the standby to reach the same point as the primary.


    The logical log reading is accomplished in the primary by the db2ifr EDU. This
    process relays logical log pages to the db2hadprp, in turn will relay the pages
    over the TCP/IP layer for the db2hadrs in the standby to catch and relay to its
    logical recovery subsystem.


    Once all the logs in the disk and the memory in the primary have been relayed
    to the standby, the HDR system enters the Peer state.


    During the Peer state the db2ifr in the primary finishes its mission and passes
    the token to db2logw. This db2loggw EDU is in charge of writing the logical log
    buffers to the disk, has an extra task while in the HDR mode: immediately after
    the log flush is flushed to the disk, db2loggw sends a message to db2hadprp with
    the location of the buffer and waits. db2hadprp picks the records from the log
    buffer directly and ships them to the standby server.


    Upon completion of this log shipping, db2stands sends the log shipping status
    (either the log was shipped successfully or log shipping failed due to a TCP/IP
    error) to db2loggw so that it can continue processing buffers.


    Since db2loggw cannot proceed without the acknowledgment of db2hadprp, this is
    a crucial point for performance. Depending on the HDR mode, the speed to send
    the acknowledgment to the logger will be different. The completion of log shipping
    and sending status to db2loggw depends on the TCP/IP send status and the HDR synchronization
    mode being used. Until a log shipping status is received by db2loggw, the database
    write activity cannot proceed on the primary system. If this happens, transactions
    on the primary system will be blocked until db2loggw receives such a notification
    from db2hadprp.


    Figure 2-3 shows the HDR primary database architecture details. The primary database
    ships the log records to the standby database server over the TCP/IP network (shown
    as the network zigzag on the right), when the primary does a log flush. The primary
    database performs a log flush when the application issues a commit or when the
    DB2 log buffer (which is controlled by the database configuration parameter LOGBUFSZ)
    becomes full.


    32 High Availability and Scalability Guide for DB2 on Linux, UNIX, and Windows'
