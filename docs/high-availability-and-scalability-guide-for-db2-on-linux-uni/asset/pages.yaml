    Setting up HADR in conjunction with TSA is done by first setting up two servers
    (using Linux in the article as example). These will be the primary and standby
    nodes within TSA, and will likewise contain the DB2 HADR primary and standby databases,
    respectively. A third server, for example an application server) can either serve
