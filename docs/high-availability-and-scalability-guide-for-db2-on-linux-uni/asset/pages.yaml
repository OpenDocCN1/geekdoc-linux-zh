    | HADR_ROLE | SYSIBADM | VARCHAR | | 10 0 Yes |

    | HADR_STATE | SYSIBADM | VARCHAR | | 14 0 Yes |


    104 High Availability and Scalability Guide for DB2 on Linux, UNIX, and Windows'
