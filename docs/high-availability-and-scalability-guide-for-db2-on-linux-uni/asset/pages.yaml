    Figure 12-10 Different methods for Adding a DB2 partition


    When partitions are added to a database, the data could be rebalanced to take
    advantage of the new database partitions. The redistribute partition group utility
    moves data across database partitions, after adding a database partition, before
    removing a database partition or during load balancing, or both. An example of
    how to use the redistribute command when we add a partition is given below:


    +   1. Update the database partition group definition.


    ALTER DATABASE PARTITION GROUP GPR1 ADD DBPARTITIONNUM(5) WITHOUT TABLESPACES


    +   2. Extend all the table spaces (defined in this database partition group)
    to the new partition with partition-specific container definitions.


    ALTER TABLESPACE TBS1 ADD (FILE ''/DATA/TB'' 2048) ON DBPARTITIONNUM(5)


    +   3. Redistribute the data uniformly for all the tables created in the table
    across the database partition group GPR1 across the newly added partition and
    update the GPR1''s partition map.


    REDISTRIBUTE DATABASE PARTITION GROUP GPR1 UNIFORM


    db2 also provides commands to drop a database partition.'
