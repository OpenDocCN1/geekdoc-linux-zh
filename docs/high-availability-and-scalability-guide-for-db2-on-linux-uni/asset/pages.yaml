  md: "![](img/a97b7826c3cf736045d80f48b5520a20_52_0.png)\n\nFigure 2-5 HADR takes\
    \ place at database level not DB2 instance level\n\n# # HADR synchronization modes\n\
    \nWith HADR, you can choose the level of protection you want from potential loss\
    \ of data by specifying one of the three synchronization modes:\n\n+   - Synchronous:\n\
    \  Log write is considered successful only when logs have been written to the\
    \ primary's log files after an acknowledgement has also been received that it\
    \ has also been written to the standby's log files. There can be no data loss\
    \ in this mode if the HADR is in the Peer state.\n\n+   - Near-synchronous:\n\
    \  This is the default option. Log write is successful only when the primary's\
    \ log buffer has been written to log files on the primary and an acknowledgement\
    \ is received that log buffer has been received on standby. A double failure would\
    \ then have to occur for data loss while in the Peer state; that is, if the primary\
    \ goes down and the standby also fails before takeover is completed. In this case\
    \ transactions in memory are lost. This is very unlikely, especially if the two\
    \ servers are using independent power and operating environments.\n\n+   - Asynchronous:\n\
    \  Log write is successful when logs have been written to the primary and log\
    \ data has been delivered to the TCP/IP layer. Data loss is more likely in this\
    \ mode. A failure of the primary, network, or the standby can cause log loss.\
    \ If the primary becomes available again, then standby can still synchronize successfully.\
    \ If takeover is needed due to a primary failure while log data remains outstanding,\
    \ these will never make it to the standby database, and transactions will be lost."
