  md: '# Part 2


    # DB2 scalability

    options


    In this part of the book, we introduce the DB2 Data Partition Feature (DPF),

    including an overview, installation steps, and an explanation of how to scale
    the

    dabase. This gives you a quick start in understanding DB2 DPF. We also

    disc the DB2 table partitioning feature introduced in DB2 9.


    ![](img/a97b7826c3cf736045d80f48b5520a20_372_0.png)'
  merge: -1
  pgno: 372
- img_proc: true
  md: 356 High Availability and Scalability Guide for DB2 on Linux, UNIX, and Windows
  merge: -1
  pgno: 373
- img_proc: true
  md: '# DB2 Database Partitioning Feature


    DB2 for Linux, UNIX, and Windows is highly scalable and capable of supporting
    hardware platforms from uniprocessor mobile computers, single and clustered Symmetric
    Multiprocessing (SMP) servers, to parallel systems with hundreds of nodes and
    many processors per node. This extremely versatile capability provides both extensive
    and granular growth. In this chapter we introduce the Database Partitioning Feature
    (DPF) which enables DB2 to scale out to support very large databases and increased
    parallelism for various tasks.


    We discuss the following topics:


    +   * Overview of DPF

    * Installation

    * Scaling the database

    * High availability (HA) on DPF


    ![](img/a97b7826c3cf736045d80f48b5520a20_374_0.png)'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# 12.1 Overview of DPF


    A hardware trend that we observe is to build enterprise systems by assembling
    together a group of cheaper, smaller servers. Customers want their databases to
    take advantage of this trend as their data keeps growing and it is very difficult
    for them to estimate how big their database will be a few years from now. Customers
    would like the database architecture to be flexible enough to take advantage of
    the processing power of another server node added to an existing cluster.


    Database Partitioning Feature (DPF) available on DB2 for LUW Enterprise Server
    Edition (ESE) extends the capability of this relational database manager into
    the parole, multi-node environment. With DPF your database is scalable, as you
    can add new servers and spread your database across them. This means more CPUs,
    more memory, and more disks from each of the additional servers for your database.
    DB2 ESE with DPF is ideal for managing data warehousing, data mining, and online
    analytical processing (OLAP) workloads. It can also work well with online transaction
    processing (OLTP) workloads. Figure 12-1 illustrates DB2 partitioned on networked
    machines. An application can connect to any of the database partitions.


    ![](img/a97b7826c3cf736045d80f48b5520a20_375_0.png)


    Figure 12-1 DB2 database with database partitions on different servers


    DPF allows a DB2 database to have multiple database partitions. When a database
    is partitioned, the database is split into different independent parts, each consisting
    of its own data in table containers, configuration files, indexes, and transaction
    logs. Multiple partitions can be assigned to a single'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'physical server and these partitions share the resources of that server. A
    database partition is sometimes called a node, in a vaguely similar sense to the
    way a server within a cluster is called a node, although non-replicated partitioned
    databases require all nodes to be active at once. Figure 12-2 Illustrates DB2
    partitioned on SMP machines.


    ![](img/a97b7826c3cf736045d80f48b5520a20_376_0.png)


    Figure 12-2 Multiple DB2 partitions on one SMP server


    DB2 implements DPF using a shared nothing architecture. The key advantage of the
    shared nothing architecture is that no special hardware is required and each server
    only needs to part of the work, as a result of which there are performance gains
    from not sharing resources across the network. The shared nothing architecture
    eliminates the overhead of distributed lock management. The database size is scalable
    with the number of disks and number of processors. DPF has a very scalable architecture
    and has minimal communication between the nodes. The DPF shared nothing architecture
    enables DB2 to provide the best scalability and price, performance or both. Figure
    12-3 illustrates this architecture.'
  merge: -1
  pgno: 376
- img_proc: true
  md: '# Client Application


    ![](img/a97b7826c3cf736045d80f48b5520a20_377_0.png)


    Figure 12-3 Each Partition has its own database, buffer pool and logs


    A **single-partition database** is by definition, a database, which has only one
    database partition. All data in the database is stored in that partition. A **multi-partitioned
    database** is a database with two or more database partitions. Because data is
    divided across database partitions, you can use the power of multiple processors
    on multiple physical nodes to satisfy requests for information. DB2 supports a
    partitioned storage model, in which the ¹(partitioning key) is used to partition
    data across a set of database partitions. This means that the data is physically
    stored across more than one database partition, and yet can be accessed as though
    it were located in the same place. Applications and users accessing aware of the
    physical location of the data. The data, while physically split, is used and managed
    as a logical unit. Data retrieval and update requests are decomposed automatically
    into sub-requests, and executed in parallel among the applicable database partitions.
    The fact that databases split across database partitions is transparent to users
    issuing SQL statements. It is possible, if DB2 determines that a statement or
    command affects only one, or


    > ¹ In DB2 9.1, the term partitioning key is changed to distribution key.


    360 High Availability and Scalability Guide for DB2 on Linux, UNIX, and Windows'
  merge: -1
  pgno: 377
- img_proc: true
  md: 'a subset of all of the database partitions, DB2 will direct the work to that
    partition or that subset of partitions.


    User interaction occurs through one database partition, known as the coordinator
    node for that user. An application can connect to any partition. The partition
    to which the application is connected acts as the coordinator for that application,
    and the coordinator is responsible for passing requests and data between the application
    and the partitions in the database.


    Users have the flexibility to spread the workload across a partitioned database
    for large tables, while allowing smaller tables to be stored on one or more database
    partitions. Index data is also partitioned with its corresponding tables. Each
    database partition has local indexes on the data it stores. This results in increased
    performance for local data access in each partition.


    DB2 DPF has the capability of recognizing that data being accessed for a join
    or subquery is located on the same partition in the same database partition group.
    This is known as *table collocation*. Rows in collated tables with the same key
    values are located on the same partition. DB2 can choose to perform join or subquery
    processing at the partition in which the data is stored. This has significant
    performance advantages. To take advantage of this small or medium size tables
    can be replicated across multiple partitions so that query processing related
    to them can be done locally.


    # 12.1.1 DB2 partitioned instance


    Every DB2 partitioned instance is owned by one instance and is distinct from other
    instances. A DB2 instance is created on any one of the machines in the configuration,
    which becomes the "primary machine". This primary server is known as the DB2 instance-owning
    server as its disk physically stores the instance home directory. This instance
    home directory is exported to the other servers in the DPF environment. On the
    other servers, a DB2 instance is separately created: all the same characteristics,
    the instance name, the same password, and a shared instance home directory. Each
    instance can manage multiple databases; however, a single database can only belong
    to one instance. It is possible to have multiple DB2 instances on the same group
    of servers.


    All the servers participating in a DPF instance must be interconnected by a communication
    facility which could be a network using the TCP/IP protocol. Several TCP/IP ports
    are reserved on each server for this "interpartition" communication. The Fast
    Communication Manager (FCM) will use these ports to handle most of the communication
    between partitions.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# 12.1.2 The db2nodes.cfg configuration file


    The db2nodes.cfg file is used to define the database partition servers that will
    participate in a DB2 instance. The db2nodes.cfg file is also used to specify the
    IP address or host name of a high-speed interconnect, should you want to use a
    high-speed interconnect for database partition server communication.


    The db2nodes.cfg file must be located under the SQLIB directory for the instance
    owner on Linux and UNIX. On Windows, it is located under the SQLIB:<Instance name>directory.


    You can edit the db2nodes.cfg file using an editor, but on a Windows platform
    it is recommended that the db2nodes.cfg file be changed through db2 commands and
    not be manually edited.


    On Windows platforms, do not attempt to create or modify the node configuration
    db2nodes.cfg file manually. You can use the db2cr command to add a database partition
    server to an instance. You can use the db2drop command to drop a database partition
    server from an instance. You can use the db2nch command to modify the configuration
    of a database partition server, including moving the database partition server
    from one computer to another; changing the TCP/IP host name, or selecting a different
    logical port or network name.


    The db2nodes.cfg file contains one line for each database partition that belongs
    to an instance. Each line has the following format:


    dbpartitionnum hostname [logical-port [netname]]


    Tokens are delimited by blanks. The variables are:


    +   * dbpartitionnum: The database partition number, which can be from 0 to 999,
    uniquely defines a database partition. Database partition numbers must be in an
    ascending sequence. You can have gaps in the sequence. Once a database partition
    number has been assigned, it cannot be changed. Otherwise the information in the
    distribution map, which specifies how data is distributed, will be compromised.
    If you drop a database partition, its database partition number can be used again
    for any new database partition you add. The database partition number is used
    to generate a database partition name in the database directory.


    It has the format: NODennnn.

    Here "nnnn" is the database partition number, which is left-padded with zeros.
    This database partition number is also used by the CREATE DATABASE and DROP DATABASE
    commands.


    +   * hostname: The host name of the IP address for inter-partition communications.
    Use the fully-qualified name for the hostname. The'
  merge: -1
  pgno: 379
- img_proc: true
  md: '/etc/hosts file should also use the fully-qualified name. If the fully-qualified
    name is not used in the db2nodes.cfg file and in the /etc/hosts file, you will
    receive an error message SQL30082N RC=3. The exception to this is when netname
    is specified. In this situation, netname is used for most communications, with
    the hostname only being used for db2start, db2stop, and db2_all.


    +   - logical-port: This parameter is optional, and specifies the logical port
    number for the database partition. This number is used with the database manager
    instance name to identify a TCP/IP service name entry in the etc/services file.
    The combination of the IP address and the logical-port is used as a well-known
    address, and must be unique among all applications to support connections between
    database partitions. For each host name, logical-port must be either 0 (zero)
    or blank (which defaults to 0). The database partition associated with this port
    is the default node on the host which it connects. You can override this with
    the DB2NODE environment variable in db2profile script, or with sqesect() API.


    +   - netname: This parameter is optional, and is used to support a host that
    has more than one active TCP/IP interface, each with its own hostname.


    #  12.1.3 Catalog partition


    The SYSCAT table space contains all the DB2 system catalog information (metadata)
    about the database. In a DPF environment, SYSCAT cannot be partitioned, but must
    reside in the Catalog partition. When creating a database, the partition on which
    the Create Database command is issued becomes the new database. All access to
    system tables goes through this database partition.


    #  12.1.4 Partition groups


    You are not restricted to having all table spaces divided across all database
    partitions in the database. You can divide table spaces across a subset of database
    partitions in the system. A database partition group is a logical layer that allows
    the grouping of one or more partitions to perform operations on all the partitions
    in the group. The following are examples of creating a database partition:


    ```

    CREATE DATABASE PARTITION GROUP A ON DBPARTITIONNUMS (1,2,4)

    CREATE DATABASE PARTITION GROUP B ON DBPARTITIONNUMS (3)

    CREATE DATABASE PARTITION GROUP C ON DBPARTITIONNUMS (1,2,3,4)

    ```


    DB2 DPF table spaces are created in database partition groups. The CREATE TABLESPACE
    statement with the IN DATABASE PARTITION GROUP clause can be used for this purpose.
    Tables are then created'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'a table is created in a multi-partition group space, some of its rows are stored
    in one partition, and other rows are stored in other partitions. Usually, a single
    database partition exists on each physical node, and the processors on each system
    are used by the database manager at each database partition to manage its own
    part of the total data in the database. Figure 12-4 illustrates a database with
    four partitions and three partition groups.


    | Database Manager Instance |

    | DATABASE 1 |

    | Partition 1 | Partition 2 | Partition 3 | Partition 4 |

    | Partition group A | Partition group A | Partition group B | Partition group
    A |

    | Tablespace X | Tablespace X | Tablespace Z | Tablespace X |

    | Table 1 | Table 1 | Table 4 | Table 1 |

    | Table 2 | Table 2 | | Table 2 |

    | Tablespace Y | Tablespace Y | | Tablespace Y |

    | Table 3 | Table 3 | | Table 3 |


    Figure 12-4 Database partition groups


    # 12.1.5 Distribution keys and distribution maps


    Users can choose how to partition their data by specifying distribution keys in
    the create table statement or using the default distribution key. It is very important
    to choose an appropriate partition key as this determines the partition each row
    of data is stored and has a big impact on performance. Data should be partitioned
    to avoid cross-partition joins. Ideally we want all data referred by all statements
    in any given transaction to reside in one node (collocation).


    When a database partition group is created, a distribution map² is generated.
    A distribution map is just an array, or a vector, of 4096 entries, each of which
    maps to one of the database partitions of the database partition group. DB2 uses
    a hashing algorithm to partition the rows. A distribution key value is hashed
    to generate the partition map value. The hash value ranges from 0 to 4095.


    > ² Prior to DB2 9, distribution map was referred as partitioning map.'
  merge: -1
  pgno: 381
- img_proc: true
  md: 'The distribution map entry for the index provides the database partition number
    for the hashed row.


    Figure 12-5 shows the partition map for database partition group 1 with partitions
    1,2,4.


    ![](img/a97b7826c3cf736045d80f48b5520a20_382_0.png)


    Figure 12-5 Partition Map for Database Partition Group 1


    Figure 12-6 shows how DB2 determines which partition given row belongs to. Here
    the partition key EMPNO (value 120) is hashed to a value 9 which is used to index
    to the partition number 1.'
  merge: -1
  pgno: 382
- img_proc: true
  md: '![](img/a97b7826c3cf736045d80f48b5520a20_383_0.png)


    Figure 12-6 DB2 process to identify the partition row has to be placed


    In certain cases choosing an appropriate partition key may not be possible and
    can cause data skew. Data skew is a situation where data is not even distributed
    across the nodes, where most of the data ends up on one of the nodes. If that
    happens, you can no longer ensure performance with scalability, and can only run
    as fast as the slowest node on the system. In this situation, nodes with heavy
    data concentration will become a bottleneck. DB2 has updatable partition maps
    to allow you to redistribute the data and correct the data skew.


    # # 12.2 Installation


    There is no technical prerequisite to enable DPF on existing DB2 ESE servers other
    than purchasing the required license and following a configuration checklist.


    # ## 12.2.1 High level installation procedure


    Figure 12-7 illustrates a conceptual DB2 partitioned database environment. We
    describe a high level installation procedure using this environment on AIX.'
  merge: -1
  pgno: 383
- img_proc: true
  md: '![](img/a97b7826c3cf736045d80f48b5520a20_384_0.png)


    Figure 12-7 Server A is the instance owning partition server as it is the primary
    computer


    Each of the installation steps to configure DPF on an AI cluster is described
    in detail in Quick Beginnings for DB2 Servers, GC10-4246.


    The following lists the steps to configure DPF on an AI cluster:


    +   1. Verify that each computer meets the necessary operating system, memory
    and disk requirements. The minimum requirements for hardware, operating system
    or distribution, software, communication, DB2 Administration Server (DAS), memory,
    and disk for the installation of a partitioned DB2 server must be met.


    +   2. Update kernel parameters on each computer (HP-UX, Linux, Solaris). Check
    the manual for recommended kernel settings and how they can be changed for HP-UX,
    Linux, and Solaris.


    +   3. Modify environment settings on each computer (AIX). Use the manual to guide
    you to the recommended settings for the AIX mauproc device attribute, as well
    as TCP/IP network parameters. The manual also provides recommendations on paging
    space and the number of network file system daemons (NFSDS) that should be running
    on every computer.


    +   4. Verify that NFS daemon is running on the computer. Create a DB2 home system
    on the primary computer and share it with participating computers. Create a DB2
    home file system on the primary computer, NFS export the home file system, and
    NFS mount the home file system on each participating computer.'
  merge: -1
  pgno: 384
- img_proc: true
  md: '5. Create required users and groups on each computer. Three users and groups
    are generally required to operate DB2: an Instance owner and group, fenced user
    and group, and DB2 Administration Server and group.


    +   a. Create a group for the DB2 instance owner (for example, db2adm), the fenced
    group that will execute user defined functions (UDFs) or stored procedures (for
    example, db2admin), and the Administration Server group (for example, db2asgrp)
    by entering the following commands:


    ```

    mkgroup id=999 db2admin

    mkgroup id=998 db2fadmin

    mkgroup id=997 db2asgrp

    ```


    +   b. Create a user that belongs to group that you created in the previous step
    using the following commands. The home directory for each user will be the DB2
    home directory that you previously created and shared (/db2home).


    ```

    mkuser id=1004 pgrp=db2admin groups=db2fadmin

    home=/db2home/db2inst1 core=-1 data=491519 rss=32767 fs=-1

    size=1 db2inst1

    ```


    ```

    mkuser id=1003 pgrp=db2fadmin groups=db2fencil

    home=/db2home/db2fenc1 db2fenc1

    ```


    ```

    mkuser id=1002 pgrp=db2asgrp groups=db2asgrp home=/db2home/db2asgrp db2asgrp

    db2as

    ```


    +   c. Set an initial password for each user that you created.


