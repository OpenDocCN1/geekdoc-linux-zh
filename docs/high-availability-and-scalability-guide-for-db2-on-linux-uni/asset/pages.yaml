  md: '# Specify synchronization mode for peer state log writing


    When the primary and standby systems are in peer state the primary system writes
    log pages to a local disk and sends them to the standby system. The synchronization
    mode specifies the log behavior between the primary and standby systems when they
    are in peer state. If the systems are in catchup state, log writing primary is
    not impacted and the synchronization mode does not apply.


    Synchronization mode


    +   - Synchronous


    This mode guarantees no loss of data. fallback is supported.


    +   - Near synchronous


    This mode guarantees no loss of data for single point-of-failure disasters. If
    no loss of data has occurred, fallback is not supported.


    +   - Asynchronous


    In this mode primary does not wait for log data to reach the standby. This means
    log data might be lost in the event of a failover. If HADR detects a loss of log
    data, which is likely to occur in this mode, fallback is not supported.


    Connection time-out period:


    Time in seconds


