    # Publishing applications with .NET 6.0


    Publishing methods are as follows:


    +   * Single-file application: Deploy as a single executable. This method packages
    your application and all its dependencies into a single executable file. It simplifies
    deployment by reducing the number of files you need to distribute and manage.
    However, it can result in a larger file size because necessary dependencies are
    bundled together.

    * Framework-dependent deployment (FDD): Uses a shared system-wide version of .NET.
    In this approach, your application relies on a shared, system-wide version of
    the .NET runtime. This means your application package does not include the .NET
    runtime, which makes the application smaller. The downside is that the target
    system must install the appropriate version of the .NET runtime.

    * Self-contained deployment (SCD): Includes .NET in the deployment. This method
    packages the .NET runtime installed with your application, allowing it to run
    independently of the .NET version installed on the target system. This ensures
    compatibility and simplifies deployment at the cost of a larger package size since
    it includes the .NET runtime.


    +   1. Publish the application:

    ```bash

    lb@rhel9_byp ~$ dotnet publish my-app -f net6.0 -c Release

    ```


    +   2. Optional: Trim dependencies for RHEL:

    ```bash

    lb@rhel9_byp ~$ dotnet publish my-app -f net6.0 -c Release -r rhel.9-x64 --self-contained
    false

    ```


    # Running .NET applications in containers


    To deploy .NET applications in containers on RHEL, follow the steps below. This
    method uses .NET runtime and container tools like Podman for efficient deployment
    pipeline.'
  merge: -1
