    # Introduction


    A default RHEL 9 installation is set up with a server + GUI configuration, meaning
    your RHEL 9 server will have a default desktop environment installed along with
    some basic server software.


    In this chapter, we will go through some details on navigating and managing your
    RHEL 9 server installation with GNOME, a free and open-source desktop environment
    for Linux and similar operating systems. GNU Network Object Environment (GNOME)
    development started in 1997. Development of GNOME is managed by the GNOME Project,
    composed of volunteers working alongside corporate sponsored contributors to the
    project. Red Hat is currently one of the biggest corporate sponsors of the project.


    We will dive deeper into GNOME, navigating the user interface, and using the tools
    included to manage our RHEL 9 system.'
