  md: '# Recipe #66: Set up an NFS service


    Network File System (NFS) is a protocol that allows you to share directories and
    files with other systems over a network. By setting up NFS, you can allow multiple
    users or systems to access the same files from their own systems as if the files
    were present locally. These receipts will take you through the steps to install,
    configure, and secure an NFS server on RHEL 9. NFS is a distributed file system
    protocol that allows a user on a client computer to access files over a network
    in a similar manner to how local storage is accessed. NFS has been widely used
    in enterprise environments, making it an essential service for systems administrators
    to manage.


    Step 1: Installing NFS. Before you start up NFS, you need to install the necessary
    packages on your RHEL 9 system. You can do this with the dnf package manager.


    ```

    [lb@rhel9_bpp ~] sudo dnf install nfs-utils

    ```


    Once installed, enable and start the NFS service and restart services:


    ```

    [lb@rhel9_bpp ~] sudo systemctl enable nfs-server rpcbind

    [lb@rhel9_bpp ~] sudo systemctl start nfs-server rpcbind

    ```


    Step 2: Configuring NFS. You need to specify which directories you want to share
    with clients in the /etc/exports file. Here''s how you can configure a shared
    directory.


    Create a directory that you want to share:


    ```

    [lb@rhel9_bpp ~] sudo mkdir /sharedfiles

    ```


    Open the /etc/exports file and add the directory with its access settings:


    ```

    [lb@rhel9_bpp ~] sudo nano /etc/exports

    ```


    Add the following line to allow access from a specific subnet:

    /sharedfiles 192.168.1.0/24(rw,sync,no_root_squash)


    This configuration allows machines in the 192.168.1.0/24 subnet to read and write
    to the /sharedfiles directory.


    Step 3: Exporting the shares. After configuring the directories, you want to share,
    export and restart the NFS service to apply the changes:


    ```

    [lb@rhel9_bpp ~] sudo exportfs -ra

    [lb@rhel9_bpp ~] sudo systemctl restart nfs-server

    ```


    Step 4: Configuring firewalls. If you are running a firewall, you need to allow
    NFS through it. Configure firewalld to allow NFS:


    ```

    [lb@rhel9_bpp ~] sudo firewall-cmd --permanent --add-service=nfs

    [lb@rhel9_bpp ~] sudo firewall-cmd --permanent --add-service=mount

    [lb@rhel9_bpp ~] sudo firewall-cmd --permanent --add-service=rpc-bind

    [lb@rhel9_bpp ~] sudo firewall-cmd --reload

    ```'
