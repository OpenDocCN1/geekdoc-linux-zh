    as non-free), as well as software with strict redistribution policy due to copyright
    and

    license applied.


    RPM Fusion classifies software packages with the following:


    +   - **Free repository**: Software that is released under a free license but
    is not included

    in Fedora. The audio mixing editor *Audacity* is available in this repository.

    - **Non-free repository**: Software that is not released under a free license
    but can be

    distributed through RPM Fusion repository. NVIDIA drivers are available in this

    - **Free tainted**: Software that is distributed in a free license, but is restricted
    in

    some countries. A good example of this would be the *libdvdcss* library which

    is a popular add-on to enable Linux desktops to DVD content.

    - **Non-free tainted**: Software that is non-free, but redistribution policy is
    not made

    by the clear of the said software. The *kmod-nvidia-open* package which

    provide the NVIDIA driver kernel module is available here.


