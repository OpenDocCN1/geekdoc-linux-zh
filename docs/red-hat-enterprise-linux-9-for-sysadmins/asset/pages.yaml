    Once verified, check the `/etc/dnf/automatic` file by opening with a text editor
    and set the actions and behaviors of the tool as you want `dnf-automatic` to run.
    The configuration file is well commented on the parameters you set and has four
    key sections with the following settings by default:


    **[commands_type]**


    `upgrade_type = default` (this default setting executes all available upgrades.
    This can’also be set as **security** to do only only security upgrades).


    `network_online_timeout = 60` (defines the maximum time in seconds that the tool
    is connecting to Red Hat repositories. The default setting is **60 seconds**).


    `download_updates = yes` (updates will be downloaded when made available. Setting
    this to no will just check updates but not download them).


