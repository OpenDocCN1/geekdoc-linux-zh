    +   g. ike and phase2alg: Define the encryption and hashing algorithms.


    +   h. dpd: Dead Peer Detection, which ensures that the VPN connection is terminated
    if the peer becomes unresponsive.


    # Define the shared secret:


    The shared secret for the VPN is defined in the /etc/ipsec.secrets file:

    sudo nano /etc/ipsec.secrets


    Add the following line:

    @yourserverdomain.com : PSK "yoursharedsecret"


    Replace yoursharedsecret with a strong, unique passphrase.


