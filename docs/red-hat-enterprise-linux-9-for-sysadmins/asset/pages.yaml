  md: '# Recipe #36: Install and configure Squid proxy cache


    Squid is a popular caching proxy that supports HTTP, HTTPS, FTP, and other protocols.
    It is generally used as an accelerator to speed up access to web pages by optimizing
    the data flow from the web server to client browsers. The caching is done on frequently
    accessed content that allows the web host to save bandwidth. Squid is particularly
    useful when web sites experience a surge in traffic and allows to increasing the
    capacity of web servers that use the cached content when serving to web clients.
    In this recipe, we will go through the steps on installing and configuring Squid
    proxy cache in your RHEL9 system:


    +   1. In previous recipes, we always ensure our software packages from the repository
    are updated using the dnf command. Once updated, we install the Squid package:

    ```bash

    [@rhel19_byp ~] sudo dnf update

    [@rhel19_byp ~] sudo dnf install squid

    ```


    +   2. Once installation is completed, configure Squid with a text editor. The
    main configuration file for Squid is nano /etc/squid/squid.conf:

    ```bash

    [@rhel19_byp ~] sudo nano /etc/squid/squid.conf

    ```nThe squid.conf file contains a lot of options to configure the caching server.
    Below is a simple configuration that provides caching services. Go through each
    line especially the services that would use Squid and make changes as you need:

    ```bash

    # Squid normally Listens to port 3128

    http_port 3128

    ```


    # We recommend you to use at least the following Line.

    hierarchy_topstoplist cgi-bin ?


    # Uncomment and adjust the following to add a disk cache directory.

    cache_dir ufs /var/spool/squid 100 16 256


    # Leave coredumps in the first cache dir

    coredump_dir /var/spool/squid


    # Add any of your own refresh_pattern entries above these.

    refresh_pattern ^ftp 1440 20% 10080

    refresh_pattern ^gopher 1440 0% 1440

    refresh_pattern -i (/cgi-bin|\?) 0 0% 0

    refresh_pattern . 0 20%'
