  md: '# Configuring Software Repositories and RHEL 9 Updates


    When you need to check what packages were installed in the past week, do a **dnf
    list recent** command:


    +   1. `[jsg@rhel-19-bpw~$] sudo dnf list recent`


    So, let us say you need to check available packages that can be installed from
    enabled repositories. After doing a search, you can just invoke a **dnf list available
    command**. Like in previous examples, the list will be long so we are not including
