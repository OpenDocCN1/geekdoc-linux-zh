    # # Recipe #23: Install and configure the EPEL repository


    The adopting of open-source software is all about choice and this is a key consideration
    in adopting Linux in the enterprise with RHEL 9 as a top choice in enabling that
    strength. However, there would be cases where you wish to install a particular
    piece of software in RHEL 9, but it is not included in the officially supported
    list and repositories provided by Red Hat. Given that RHEL 9 is based on the excellent
    work done by Fedora, there is a wide range of software applications and platforms
    that are available in the latter but not included as part of the officially supported
    packages in the former.


    This led to the creation of a Special Interest Group (SIG) within the Fedora Project
    called Extra Packages for Enterprise Linux (EPEL), which provides the additional
    packages that made Fedora great and made it available and compatible for RHEL
    and other RHEL-based distributions. EPEL is available as a repository that can
    be added to your RHEL 9 setup.


