- pgno: 160
  md: '# CHAPTER 10


    # Create, Manage, and Monitor Containers


    # Introduction


    In Chapter 9, Administration of Virtualization Workloads, we discussed about using
    the virtualization functionality of RHEL 9 to run multiple instances of operating
    system as virtual machine guests. This functionality allowed for greater flexibility
    for sysads by creating more systems to run on top of an existing hardware host.
    Much of workloads in the world today run on virtual machines, either running on-premises
    or in a public cloud provider like AWS or Azure. In this chapter, we will discuss
    another method of running workloads through containers in Linux, a type of technology
    that packages and isolates applications with the entire environment (files, execution
    runtimes, etc.) necessary to run it — not to the level of completeness of the
    VM. Linux containers are much more portable than VMs and this portability make
    it easy to move the application from one environment to another (for example,
    from on-premises to a public cloud environment). VMs are limited to the hypervisor
    and the capacity of the machine (usually a physical host), whereas containers,
    you can expect consistency across environments because of their independence from
    the host machine, sharing only the operating system and standard applications
    but isolate the key runtime and libraries necessary to run the application in
    the container.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# Structure


    In this chapter, we will cover the following topics:


    +   - Building containers on RHEL 9 as a single node environment

    - Use Podman and Buildah in creating and managing containers

    - Create and manage container images as the Universal Base Image and the RHEL
    base image


    # Objectives


    Containers are hot technologies currently being adopted by enterprises and the
    market has seen a shift of preference from virtual machines to containers to run
    in-house applications as well as third-party software that support it. As the
    technology is relatively new, set time to learn and understand from this chapter,
    the foundation concepts of container technologies, and be able to build a single
    node container environment where you can start using tools like *Podman* to create
    and manage container workloads.


    # Recipe #51: Install the container tools


    Before we start going through the process of installing the tools you need build
    and manage containers, you may have used or heard of a technology called **Docker**.
    This is a very popular tool to build and manage containers and is still widely
    used today, although its popularity has been overshadowed by another project for
    managing containers called *Kubernetes*. Docker''s approach to containerization
    is different compared to that of a Linux container. As of RHEL 9, Red has removed
    Docker tools and support, so we won''t be discussing Docker in this chapter (though
    we will refer to tools that are optional to manage Docker containers).


    From the console, update the repositories and install the **container-tools**
    meta package which contains the latest tools for containerization:


    ```

    $[js@rhel9_bpb] sudo dnf install container-tools

    ```


    The **container-tools** package we use in this chapter replaces Docker and have
    the following advantages:


    +   - **Rootless**: Having the container without root means they are secure and
    can run without privileges that may be taken advantage of.

    - **No daemon running**: If you do not run any containers in the system, the tools
    will not be running in the background, meaning less resource requirements.


    The package has three main software tools for containerization:


    +   - Podman is a container engine designed to create and run **Open Container
    Initiative (OCI)'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'and build an open industry standard for container formats and related runtimes.
    It can also be used to manage container instances. Many of our exercises in this
    chapter will use Podman.


    +   * Buildah is an image building tool that is used by Podman to perform the
    creation. The tool is OCI-compatible, so the output is compatible with Docker
    and Kubernetes. Both tools are complementary with each other.


    +   * Skopeo is used to manipulate, inspect, sign and transfer container images
    and image repositories. Unlike the previous tools mentioned, it is open source
    and lightweight. You can use Skopeo to remotely inspect images on a registry without
    downloading the whole container image and works with OCI and Docker images.


    > This chapter will focus primarily on using Podman with Buildah. The Red Hat
    blog published a good introduction and overview of the Podman, Buildah, and Skopeo
    tools. You can read through it at https://www.redhat.com/en/blog/say-hello-buildah-podman-and-skopeo.


    If you want to manage containers, you can do this with Podman installing the **podman-docker**
    tool. Usually, this is included when you install **container-tools** but you can
    also install this separately in case it is not yet part of installation. That
    tool replaces the all **Docker** command interface and calls the Docker API with
    equivalent podman commands:


    ```

    [jsg@rhel19_bp own ~]$ sudo dnf install podman-docker

    ```


    # # Recipe #52: Build a rootless container environment


    By default, running the container tools we installed as sudo or root user gets
    you full access to the capacity of your system. However, there may be cases where
    you do not want to grant root or sudo access to some containers. RHEL 9, you have
    the option to create a rootless container which means you can safely run a container
    limited to the rules and security measures set in a regular user. Note that to
    allow non-root users to use container tools, you need to set this up as a root
    user or with root privileges.


    From the console, let us pull the container image from the remote Red Hat registry:


    ```

    [jsg@rhel19_bpn ~]$ podman pull registry.access.redhat.com/ubi9/ubi

    ```


    To view the list of images from **podman**, use the images command:


    ```

    [jsg@rhel19_bpn ~]$ podman images

    ```'
