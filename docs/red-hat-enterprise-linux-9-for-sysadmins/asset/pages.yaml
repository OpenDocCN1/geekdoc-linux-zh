    # Recipe #84: Set up RHEL in Federal Information Processing Standard mode


    Federal Information Processing Standards (FIPS) 140 is a series of security standards
    developed by the National Institute of Standards and Technology (NIST) to validate
    the quality and security of cryptographic modules. Running RHEL in FIPS mode ensures
    that all cryptographic operations comply with these standards. This guide will
    walk you through setting up RHEL in FIPS mode, ensuring your system meets cryptographic
    requirements. Enabling FIPS mode on your RHEL system ensures that:


    +   * All cryptographic operations use FIPS-approved algorithms.


    +   * The system performs self-checks to validate the integrity and correctness
    of cryptographic operations.


    +   * Cryptographic key material is generated in a secure and compliant manner.


    Important considerations


    +   * Pre-installation configuration: The recommended method for ensuring full
    FIPS compliance is to enable FIPS mode during the installation of RHEL. This guarantees
    that all cryptographic key material is generated using FIPS approved algorithms
    from the start.


    +   * Post-installation enabling: If you enable FIPS mode after installation,
    note that the system may not fully comply with FIPS 140 as some cryptographic
    keys generated prior to enabling FIPS mode might not meet the standards.


    +   * Irreversibility: Once FIPS mode is enabled, disabling it without compromising
    the system''s integrity is not straightforward. If you need to disable FIPS mode,
    a complete reinstallation of the system is recommended.


    # Enabling FIPS mode during installation


    To ensure that all cryptographic keys are generated using FIPS-approved algorithms,
    it is best to enable FIPS mode during the installation of RHEL.


    Procedure:


    +   * Add FIPS kernel parameter: During the RHEL installation process, add the
    fips=1 option to the kernel command line. This can be done at the GRUB boot menu
    by editing the boot options...


    ```

    linux /vmlinuz ... fips=1

    ```'
  merge: -1
  img_proc: true
