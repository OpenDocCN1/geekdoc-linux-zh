- pgno: 168
  md: '# Conclusion


    Containers are the industry’s latest set of platforms and tools used to run high
    performance, cloud-native applications. RHEL 9 provides a complete set of tools
    to get started through the **container-tools** metackage which includes essential
    tools like Podman and Buildah. Much of the work you need to do with containers
    will revolve around Podman which provides to end support throughout the lifecycle
    of containers management and is completely OCI-compliant, making it compatible
    with Docker tools. While Red Hat provides essential tools for containers using
    Podman, it has an enterprise-grade solution for application development and deployment
    through its Red Hat OpenShift Container Platform solution. This chapter provided
    a good starting point in learning and managing basic containers in RHEL 9.


    In the next chapter, we will discuss managing networks, files, and storage services
    in RHEL 9. We will go through the details of setting up and managing these essential
    services to ensure your RHEL 9 services are robust and secure when you access
    them.


    # Points to remember


    +   **The container-tools** metackage contains all the essential tools necessary
    in building and managing simple containers through tools like Podman and Buildah.
    If you have no need for the installed extra tools, you can install individual
    packages by searching for the software and installing with **dnf**.

    * Rootless containers are recommended for simple container workloads that do not
    need to access root-level access of files and libraries. However, before creating
    rootless containers, you need to create a user that has rights to use the container

    * Container network tools allow you to open access for your deployed application
    in the container to other containers or to applications from the internet. Make
    sure to monitor and manage the networks and delete unallocated ones when there
    is no use anymore.


