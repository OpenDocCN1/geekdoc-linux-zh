    # ## Recipe #26: Automate software updates with DNF Automatic


    In cases where automatic software updates and security patches installation is
    desired, RHEL 9 provides a handy tool for this called DNF Automatic. The tool
    parameters are set in a configuration file and the command will execute based
    on the information or data set in the said file. DNF Automatic can be set to execute
    the following outcomes:


    +   * Notify and exit: Sends a notification after running the DNF Automatic tool
    checked updates.

    * Download the updates: Downloads the updated packages only.'
  merge: -1
