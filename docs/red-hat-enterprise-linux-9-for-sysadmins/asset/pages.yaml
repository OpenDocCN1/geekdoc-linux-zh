- pgno: 46
  md: '# Recipe #3: Configure disk partitions for RHEL 9


    From Recipe #2, we configured our single disk automatically using Anaconda. But
    what we want to configure this manually? Anaconda allows us to customize the disk
    and create partitions based on recommended configurations.


    But before we partition the disk, let us do a quick review of a typical directory
    structure that you would see in a RHEL 9 system:


    +   * **Root directory (/):** Pretty much everything in RHEL 9 falls under the
    **root** directory. From /, the directory branches and takes shaping on how the
    partitioning is done.

    * **Boot (/boot):** The **boot** directory contains all the files and executables
    needed by RHEL 9 to start, like the Linux kernel that loaded RHEL 9.

    * **Home (/home):** Your RHEL 9 local users will have their files and personal
    directories inside /home. Example would be /home/jsg where all my files are inside
    this folder.

    * **Root user (/root):** The **root** user itself will be in its own folder instead
    of being part of /home.

    * **Essential binaries (/bin):** This directory contains all the essential executable
    files or binaries shared across users in your RHEL 9 system. For example, the
    bash shell inside the terminal.

    * **User binaries and read-only files (/usr):** Some applications of users are
    located here. An example of this would be the applications installed by a user
    in GNOME.

    * **Lib (/lib):** These contain libraries needed by applications in /bin to execute.

    * **Var (/var):** These contain variable data files like logs written by applications.

    * **Opt (/opt):** Optional software packages are installed here. Proprietary applications
    are generally installed in this location. Let us say install Microsoft Edge on
    Linux, the browser executable will be in /opt/microsoft/msedge.

    * **Lost + found (/lost+found):** In the event of a system crash, files recovered
    were placed here.

    * **Swap space:** The swap space is created and used as a contingency to move
    inactive resources when the amount of physical memory or RAM in the system is
    full.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# Red Hat Enterprise Linux 9 for SysAdmins


    the amount of swap space is the same as that of the physical memory. However,
    the swap space performance would not be the same compared to adding more physical
    memory in your system.


    Anaconda will create /,boot, and a swap space, to install RHEL 9 as the rest of
    the directories will be created as well during the installation. If you are installing
    RHEL 9 with multiple disks, it is possible to place certain directories in specific
    disks, especially those that would potentially grow over time like the /home directory.


    Another factor to consider when doing a manual partition is the method or type
    of partition to do. In RHEL 9, we can do the following:


    +   **Logical Volume (LVM):** By default RHEL 9 uses LVM to create a partition.
    Let us say you have 4 physical devices with 1 TB capacity for each device. LVM
    will treat the 3 drives as one single volume with a capacity of 4 TB. The physical
    devices are designated as **physical volumes (PV)** and the PVs are then created
    in the **volume group (VG)**. What partitioning and directory structure then.
    What is about LVM that we can add and manage more PVs that allow us to increase
    the size of the VG, making us sysadmins think of total capacity rather than individual
    disk capacity and management. Thus, RHEL 9 makes disk management easier with LVM.


    +   **LVM provisioning:** This takes a step further the LVM concept (which is
    already nice for starters). With LVM provisioning, it is possible to create a
    bigger volume size than the actual volume on the back end. But the partition size
    is not fully allocated at start, rather the partition only grows at the time data
    is written on. This is done by creating a thin pool in the logical volume. The
    thin pool can be expanded based on the growth of storage use. The only downside?
    As the sysadmin will have to be proactive in monitoring the use of thinly provisioned
    storage to ensure that users will have the capacity that you overcommitted with
    this method.


    > Tip: A good candidate for LVM provisioning is the /home directory where users
    can have bigger storage allocated than what is available in the back end, but
    they would not be aware until they reach full capacity of their allocation, but
    by that time you would have already added more PVs to the VG.


    +   **Standard partitioning:** By making a standard partition, we lock the size
    of the directory we assign to. For example, if we allocate 20 GB to /home, users
    will have to share that space and limit it to the total size assigned. A standard
    partition is ideal when considering a physical drive to a particular directory.
    It is a great way to manage storage, but not the most flexible way to do it.


    One last thing to consider disk partitioning, the file system to use in your set
    up. By default, RHEL 9 uses the XFS file system. XFS has many features over the
    other file systems as:'
  merge: -1
  img_proc: true
- pgno: 48
  md: '+   - Setting directory quotas

    - Defragmenting and enlarging an active volume

    - Quicker crash recovery

    - Support for large file systems, up to 500 TB with a file size up to 16 TB

    - Support for LVM and standard partitioning


    And these are just a few of what XFS does makes LVM the logical choice (pun intended)
    in setting up your disk partition.


    Now, let us go through some steps on customizing the storage partitioning in your
    RHEL 9 system.


    # Step 1: Customize the storage configuration


    After you have selected the disk, you would like to install RHEL 9, from Storage
    Configuration, select Custom, then click Done.


    # Step 2: Do a manual partition of the disk


    You will proceed with manual partitioning of the disk.


    There are two ways to do the manual partitioning:


    +   - Automatic creation: Anaconda will automatically create 3 partitions: The
    root (/), boot partition (/boot), and swap space. You add more partitions by clicking
    the plus (+) sign at the bottom and select the mount point (such as /home, /var,
    etc.) and input the desired capacity of the mount point. If you wish to restart
    again, you can click Discard All at the bottom, then select Reset Selections,
    which brings you back to the previous view, or select the mount point you wish
    to change or delete then click the minus (-) sign at the bottom. When you are
    satisfied with the partition layout and sizing, just click the Blue Button at
    the top.

    - Step by step creation: For this, you will create each mount point from scratch
    by clicking on the (+) button and selecting the mount point you wish to create
    along with the desired size. This is like the custom partitioning we did after
    Anaconda did the automatic partitioning. Make sure you use /, /boot, and swap
    space at the very least. As mentioned at the beginning of this recipe, all other
    mount points will also be created by Anaconda if you only created the three essential
