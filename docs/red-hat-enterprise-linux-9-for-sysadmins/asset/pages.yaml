- pgno: 68
  md: 'The tar utility will create a compressed tar archive called mybackup.tar.gz
    located in /mnt/backup and will consist of files and directories from the /home/directory.


    +   5. Update the RHEL 8 system prior to upgrade: Make that your RHEL 8 system
    has the latest, supported security and software updates prior to the upgrade.
    From the console, do a dnf update:


    ```

    [jsg@rhel9_bpd ~]$ sudo dnf update

    ```


    +   4. Disable third-party software repositories: To ensure a smooth upgrade process,
    temporarily disable third party repositories with this subscription-manager command:


    ```

    [jsg@rhel9_bpd ~]$ sudo subscription-manager repos --disable=

    ```


    +   5. Install the LEAPP utility and run the pre-upgrade check: The recommended
    way to upgrade RHEL 8 to RHEL 9 is leapp. Install this tool with dnf:


    ```

    [jsg@rhel9_bpd ~]$ sudo dnf install leapp

    ```


    Once installed, do a pre-upgrade check:


    ```

    [jsg@rhel9_bpd ~]$ sudo leapp upgrade

    ```


    During the pre-upgrade check, leapp will collect data in the RHEL 8 system, check
    upgradeability, and generate a report located at /var/log/leapp. The report will
    provide a list of issues found and solutions to fix the issues. It will also give
    a recommendation on whether to proceed with the upgrade or not.


    +   6. Upgrade to RHEL 9 using LEAPP: Once your RHEL 8 system has passed the leapp
    pre-upgrade check, you can proceed with the upgrade to RHEL 9 with the leapp upgrade
    command:


    ```

    [jsg@rhel9_bpd ~]$ sudo leapp upgrade --target 9.0

    ```


    During the upgrade, leapp will download all the necessary packages and execute
    the rpm updates in the background. Once completed, you can manually reboot the
    system. You can also opt to include a --reboot option from the leapp upgrade command
    so that the system will reboot automatically upon completion.


    +   7. Check and confirm that the upgrade is successful: You can do the following
    commands to verify that you have successfully upgraded your RHEL 8 system to RHEL
    9:


    ```

    [jsg@rhel9_bpd ~]$ sudo cat /etc/redhat-release

    ```


    The output of the cat command should show that you are now on RHEL 9. Check if
    your RHEL 9 system is connected to the network by doing some basic ping from the
    terminal or connect to a remote server via ssh to validate the connection as well.
    Once confirmed, update your new RHEL 9 system to get all newly released software
    and security updates.'
