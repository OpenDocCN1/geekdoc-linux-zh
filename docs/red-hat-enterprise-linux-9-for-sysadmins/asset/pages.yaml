    # Automating and scheduling reports


    To ensure continuous monitoring, you can automate the generation of performance
    reports using cron jobs. For example, you can schedule a daily report to be generated
    at midnight:


    +   Create a cron job: Edit the crontab for the root user or a monitoring user:

    `sudo crontab -e`


    Add the following line to generate a report at midnight every:

    `0 * * * * /usr/bin/sar -A > /var/log/sysstat/daily_report_$(%Y%mm%d).txt`


