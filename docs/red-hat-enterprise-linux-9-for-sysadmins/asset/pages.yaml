    # RHEL 9 Updates


    # ## Introduction


    Red Hat provides official support to the software packages it provides out of
    the box as well as those downloaded and installed from their official software
    repositories. As a SysAd, you will encounter cases where some packages are not
    officially supported by Red Hat, but you will still need to install and configure
    it into your system. To do so, you will need to configure a new software repository
    that would allow you to install and manage a software package that is not provided,
    nor officially supported by Red Hat.


    In this chapter, we will learn how to manage software packages with the dnf tool,
    configure new software repositories so we can install additional software packages
    that are not provided by Red Hat, update our RHEL 9 system, and configure dnf
    to automatically download and update RHEL 9 when desired.


    # ## Structure


    In this chapter, we will discuss the following topics:


    +   * Using the dnf command for managing software packages

    * Adding additional software repositories based on need, and understand how it
    affects your RHEL 9 system support'
  merge: -1
