    # # Recipe #20: Clean the sos report to remove sensitive or private data


    If you wish not to include data that is deemed private by your organization, you
    can use the sos utility to obfuscate data that is potentially sensitive. You need
    to run the sos report command to create the report and start cleaning up the report
    using the sos clean command.


