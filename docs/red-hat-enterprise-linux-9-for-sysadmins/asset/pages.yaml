- pgno: 182
  md: '# Working Around Networks, Files, and Storage Services


    15:30:43.261234 IP 198.51.100.7 > 203.0.113.5: GREv0, proto IPv6, length 118


    Here, proto 47 filters for GRE packets (47 is the IP protocol number for GRE).
    As we see, IPv6 packets are indeed encapsulated in GRE (IPv4) packets between
    our two public IPv4 addresses.


    This setup allows us to use IPv6 when our ISP or parts of the internet infrastructure
    do not support it natively. It is particularly useful in scenarios like:


    +   - IPv6 migration: Gradually moving to IPv6 while still relying on IPv4 infrastructure.


    +   - Cloud connectivity: Connecting to IPv6 only cloud services on an IPv4 only
    network.


    +   - IoT deployments: Many IoT devices are IPv6 only to conserve IPv4 addresses.


    To ensure our security, we should also set up encryption. GRE does not provide
    this natively, so we pair it with IPsec:


    ```

    [1b@rhel9_bpp ~]$ sudo dnf install libreswan

    [1b@rhel9_bpp ~]$ sudo tee /etc/ipsec.d/gre-tunnel.conf << EOF

    conn gre-tunnel

    left=203.0.113.5

    right=198.51.100.7

    authby=secret

    type=transport

    auto=start

    phase2=esp-aes256-sha2

    EOF

    ```


    ```

    [1b@rhel9_bpp ~]$ sudo tee /etc/ipsec.d/gre-tunnel.secrets << EOF

    203.0.113.5 198.51.100.7: PSK "v3ry3cur3Sh@r3dK3y"

    EOF

    [1b@rhel9_bpp ~]$ sudo systemctl enable --now ipsec

    ```


    Now, our GRE tunnel is encrypted with IPsec, providing confidentiality and integrity
    for our IPv6 traffic as it crosses the IPv4 network.


    By using RHEL 9''s NetworkManager and additional tools like libreswan, we successfully
    set up a secure, IPsec encrypted GRE tunnel. This allows us to carry IPv6 traffic
    over an IPv4 network, showcasing RHEL 9''s flexibility in adapting to diverse
    network environments. Whether you are migrating to new protocols, connecting disparate
    networks, or just learning about tunneling, RHEL 9 provides the tools to make
    it happen.'
  merge: -1
  img_proc: true
