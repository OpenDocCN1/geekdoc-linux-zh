    System services are background processes that run continuously on a RHEL 9 system
    to support various functions and applications. RHEL runs several essential system
    services by default that allows the system to function properly. However, there
    are times that some services loaded by default may not be considered essential
    in your day-to-day operations and may need to be disabled or unloaded. Let us
    go through some basics in managing system services in RHEL 9:'
