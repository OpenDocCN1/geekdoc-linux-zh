    # **## CentOS Linux and CentOS Stream**


    Started in 2004, **CentOS Linux** is a community distribution driven by The CentOS
    Project that aims to provide the stability of a Linux system that is completely
    binary compatible with RHEL as it is the upstream source of the distribution.
    That means CentOS Linux is essentially RHEL without the Red Hat branding, trademarks,
    and other properties that Red'
