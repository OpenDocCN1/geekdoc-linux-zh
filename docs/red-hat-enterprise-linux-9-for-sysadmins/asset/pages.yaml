    various aspects of system performance.


    +   Monitoring CPU usage with sar: The sar command collects, reports, and saves
    CPU usage data.

    sar -u 1 5


    This command reports CPU usage every second for 5 seconds. You can also view historical
    data by simply running sar with the appropriate options.


    +   Monitoring disk I/O with iostat: The iostat command monitors and reports on
    CPU utilization and I/O statistics for devices and partitions.

    iostat -dx 5 3


    This command provides detailed I/O statistics every 5 seconds, three times.


    +   Monitoring memory usage with free: While free is not part of sysstat, it is
    often used in conjunction with sar to monitor memory usage.

    free -m


