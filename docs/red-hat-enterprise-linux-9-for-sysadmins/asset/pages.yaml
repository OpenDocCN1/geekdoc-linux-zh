- pgno: 32
  md: '# CHAPTER 2

    Setting Up

    RHEL 9


    # Introduction


    Picking up from our progress in *Chapter 1, Introducing Red Hat Enterprise Linux
    9*, we will now start to do some hands-on exercises on installing and configuring
    a RHEL 9 system. In this chapter, we will start with downloading the RHEL 9 image,
    decide the target platform for installation, and go through some download options
    depending on your connection and the level of understanding with regards to the
    installation options. Next, we will do a step-by-step walkthrough of the installation
    process and finish the chapter by going through the advanced installation options
    using the Kickstart tool.


    # Structure


    In this chapter, we will discuss the following topics:


    +   * Downloading and creating bootable media for RHEL 9 installation

    * Choosing RHEL 9 installation options

    * Disk partitioning and set up for RHEL 9

    * Configurations for the RHEL 9 installation

    * Automating RHEL 9 installation and configuration with Kickstart'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Objectives


    In this chapter, we set the following learning objectives. First, you will get
    the appropriate RHEL 9 image file based on the intended computing architecture
    that you will install it with. Once downloaded, you will create a bootable USB
    stick and run this to your computer or virtual machine. Once RHEL 9 is booted,
    you will configure installation options and proceed with the installation based
    on your use case. You will also learn how to do an automated installation for
    RHEL 9, which would be useful for multiple installation setups.


    In the next section, you will download the RHEL 9 image and set it up as bootable
    media that we use for our installation.


    # Download the RHEL 9 installation image


    There are several types of installation methods that we can use for our system,
    and we will go through them in detail. First, you need to download an ISO image.
    An ISO image is a disc image based on the ISO 9660 file system that is widely
    used in the CD-ROM format. DVD images use the Universal Disk Format (UDF) to accommodate
    the larger capacity of media. But in the case of our RHEL 9, all of them are available
    as an ISO image download.


    In Chapter 1, Introducing Red Hat Enterprise Linux 9, we discussed about the architectures
    that RHEL 9 supports which include:


    +   * AMD and Intel 64-bit architectures (x86-64)

    * 64-bit ARM architecture

    * IBM Power Systems (POWER9)

    * 64-bit IBM Z and IBM LinuxOne


    In this book, we will cover only the AMD and Intel 64-bit architectures (x86-64)
    as it is the most widely used and accessible architecture that we can use. You
    can also use a virtual machine setup for installation if your host machine has
    a 64-bit CPU.


    But before we continue with downloading anything. Make sure your setup (be a desktop
    or laptop computer, server, or virtual machine) have the following minimum requirements:


    | CPU | Memory | Storage |

    | AMD and Intel 64-bit architectures (x86_64), note that RHEL 9 does not support
    for 32-bit CPUs | 1.5 GiB for an ISO installation; at least 3 GiB for a network
    installation. | 10 GB minimum, 20 GB recommended. |

    | 64-bit ARM architecture (AArch64-ARMv8.x and ARMv9,x) | 1.5 GiB for an ISO installation;
    at least 4 GiB for a network installation. | 10 GB minimum, 20 GB recommended.
    |


    Table 2.1'
  merge: -1
  img_proc: true
