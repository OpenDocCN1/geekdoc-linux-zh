    of open-source software became mainstream and cemented the company''s brand as
    one of the technology companies in the world. Being a publicly traded company
    allowed Red Hat to transition its business model from a boxed software provider
    to one that focuses on enabling open-source technologies for the enterprise. The
    following years after the IPO saw Red Hat build its portfolio of products and
