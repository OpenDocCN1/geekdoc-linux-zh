- pgno: 172
  md: '# Working Around Networks, Files, and Storage Services


    If you use the console, you can use the nmcli command line tool, which is part
    of NetworkManager, to configure both ethernet and Wi-Fi connections:

    [1b@rhel19_bp ~]$ sudo nmcli connection add type ethernet con-name "Office-LAN"
    ifname eth0 ip4 192.168.1.100/24 gw4 192.168.1.1 [1b@rhel19_bp ~]$ sudo nmcli
    device wifi connect "MyHomeWiFi" password "mysecurepassword"


    NetworkManager, along with its tools nmcli and nmui, were developed to provide
    a more streamlined network configuration experience and have the following advantages:


    +   - **Cross-platform consistency**: Whether you are on a server, desktop, or
    even a different Linux distribution, NetworkManager provides a consistent interface.

    - **Dynamic configuration**: Easily switch between different networks or connection
    types without manual reconfiguration.

    - **Integration with desktop environments**: For GNOME (GNU Network Object Model)
    or KDE (K Desktop Environment) users, NetworkManager integrates smoothly with
    the GUI.

    - **Extensibility**: Supports various VPN tunnels, mobile broadband, and more
    through plugins.


    nmcli is the command line interface for NetworkManager, designed to provide full
    access to NetworkManager capabilities. It is particularly useful in server environments
    or for scripting. Most of our exercises in this chapter will use nmcli.


    nmui is a text-based interface that provides a more visual, menu-driven approach
    to network configuration. It is great for those who prefer a more guided experience
    or when working in environments where a full GUI is not available.


    nm-connection-editor is the graphical tool for NetworkManager, typically used
    in desktop environments. While we focus on command line tools in this chapter,
    desktop users might find this tool intuitive.


    > Tip: This chapter will focus primarily on using nmcli for network configuration.
    The Red Hat Customer Portal offers comprehensive documentation on NetworkManager
    in RHEL 9. You can read it through at https://access.redhat.com/documentation/en/red_hat_enterprise_linux/9/html-single/configuring_and_managing_networking/index.


    If you wish to use the old network configuration methods, you can do this by installing
    the network-scripts package. However, this is not recommended as it is considered
    a legacy in RHEL 9. The old scripts are kept around mainly for compatibility with
    older configurations or very specific setups that have not been migrated to NetworkManager
    yet:


    ```

    [1b@rhel19_bp ~]$ sudo dnf install network-scripts

    ```'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'In the spirit of moving forward with modern, robust tools, we strongly encourage
    using NetworkManager for all your network configuration needs in RHEL 9.


    # Recipe #58: Configure a VLAN to secure network traffic


    VLANs in RHEL 9 to secure network traffic, you might have used or heard of techniques
    like physical network segmentation or using separate network switches for different
    departments. These traditional methods have been around for a long time and are
    still used today, although their flexibility and cost-effectiveness have been
    overshadowed by VLAN technology. The old approach often involved purchasing additional
    hardware, rewiring office spaces, and manually configuring each switch, which
    could be expensive, time consuming, and less adaptable to changing business needs.
    As with RHEL 9, Red Hat seamlessly integrated VLAN configuration with NetworkManager,
    providing a more dynamic and software defined approach to network segmentation.
    We won''t discuss physical network segmentation practices in this chapter (though
    we may reference traditional security practices for comprehensive network design).
    Most enterprise switches support VLAN tagging (IEEE 802.1Q), which works seamlessly
    with the VLAN capabilities of RHEL 9. We can set up a VLAN in RHEL 9 to secure
    network traffic by using the nmcli tool provided by NetworkManager. In this example,
    we will create a VLAN for our finance department to isolate its sensitive traffic
    from the rest of the network:


    ```

    [lb@rhel19_bpp] ~ sudo nmcli connection add type vlan con-name "Finance-VLAN"
    ifname vlan10 vlan.parent eth0.id 10 ip4 192.168.10.50/24 gw4

    192.168.10.1

    ```


    Connection ''Finance-VLAN'' (3ae5f8d0-7e2b-45d5-b5f5-69cb5f8e3c0) successfully
    added.


    Let us break this down:


    +   - **type vlan**: Specifies that we are creating a VLAN connection.

    - **con-name "Finance-VLAN"**: A human readable name for our connection.

    - **interface vlan10**: The network interface name for this VLAN.

    - **vlan.parent eth0**: The physical interface that this VLAN is built on.

    - **vlan.id: 10**: Our VLAN ID, coordinated with network admins.

    - **ip4 192.168.10.50/24 gw4 192.168.10.1**: Static IP settings for this VLAN.


    Once we have confirmed that the VLAN connection is set up correctly, we can activate
    it:

    [lb@rhel19_bpp] ~ sudo nmcli connection up "Finance-VLAN"

    Connection successfully activated (D-Bus active path: /org/freedesktop/NetworkManager/ActiveConnection/3)'
  merge: -1
  img_proc: true
