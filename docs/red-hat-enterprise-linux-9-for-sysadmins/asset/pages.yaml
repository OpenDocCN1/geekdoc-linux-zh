- pgno: 171
  md: '# Structure


    In this chapter, we will cover the following topics:


    +   - Configure the Ethernet and Wi-Fi connections

    - Configure a VLAN to secure network traffic

    - Configure network bonding on network interfaces for higher throughput

    - Configure a VPN connection

    - Set up an IP tunnel

    - Do basic disk administration with parted and fdisk

    - Create logical storage devices with LVM

    - Manage a remote iSCSI storage

    - Set up a Samba service for file and print services

    - Set up an NFS service


    # Objectives


    In this chapter, we discuss why RHEL 9 is an excellent platform for managing network
    infrastructure, emphasizing its capabilities in securely configuring and managing
    network services. We will cover the creation of these network services, focusing
    on securing them against threats and effectively managing file storage and associated
    storage devices within the RHEL 9 ecosystem. Additionally, we will emphasize building
    and managing file services tailored for network users, as well as implementing
    robust measures to secure these storage devices and maintain data integrity accessibility.


    # Recipe #57: Configure the Ethernet and Wi-Fi connection


    We before diving into configuring ethernet and Wi-Fi connections in RHEL 9, you
    might have used or heard of network configuration tools like **ifconfig** or **ip**.
    These are low-level tools that have been around for a long time and are still
    used today, although their popularity has been overshadowed by more user-friendly
    tools like NetworkManager. The old approach to network configuration often involved
    editing configuration files in /etc/sysconfig/network-scripts/, which could be
    prone error and less intuitive.


    As of RHEL 9, Red Hat has NetworkManager the primary tool for network configuration,
    providing a more consistent and user friendly approach across different environments.
    We won''t be discussing about the old methods in this chapter (though) we may
    refer some low-level tools that are optional for advanced troubleshooting.'
  merge: -1
