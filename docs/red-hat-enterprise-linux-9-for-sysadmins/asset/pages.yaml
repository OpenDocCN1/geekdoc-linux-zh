  md: '# Capacity Planning, Log Analysis, and System Audits 265


    To monitor user login activity using auditd, you need to define audit rules that
    log relevant events such as successful logins, failed login attempts, and session
    openings.


    +   1. Create audit rules for user logins:


    Add the following rules to monitor login events. These rules can be added to the
    /etc/audit/rules.d/audit.rules file or directly using auditctl.


    Monitor the /var/log/secure file: The /var/log/secure file logs all login attempts,
    both successful and failed:


    ```

    auditctl -w /var/log/secure -p wa -k logins

    ```


    Monitor session opening (PAM): This rules pluggable authentication modules (PAM)
    events related to session management, including user logins:


    ```

    auditctl -a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k pam

    ```


    Monitor useradd, usermod, and usermdel commands: These commands are used to add,
    modify, and delete users on the system:


    ```

    auditctl -w /usr/sbin/useradd -p x -k user_mgmt

    auditctl -w /usr/sbin/usermod -p x -k user_mgmt

    auditctl -w /usr/sbin/usermdel -p x -k user_mgmt

    ```


    +   2. Persist the audit rules:


    If you used auditctl to set up these rules, you should add them to /etc/audit/rules.d
    to make them persistent across reboots:


    ```

    echo "a /var/log/secure -p wa -k logins" | sudo tee -a /etc/audit/rules.d/audit.rules

    echo "a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -k pam" | sudo
    tee -a /etc/audit/rules.d/audit.rules

    echo "-w /usr/sbin/useradd -p x -k user_mgmt" | sudo tee -a /etc/audit/rules.d/audit.rules

    echo "-w /usr/sbin/usermod -p x -k user_mgmt" | sudo tee -a /etc/audit/rules.d/audit.rules

    echo "-w /usr/sbin/usermdel -p x -k user_mgmt" | sudo tee -a /etc/audit/rules.d/audit.rules

    ```


    Then, load the rules:


