    # Recipe #13: Configure date and time settings


    To ensure the system clock in RHEL 9 is accurate, we need to learn how to configure
    the date and time settings. This ensures that the system clock is accurate and
    synchronized with other devices and servers on the network. RHEL 9 uses the timedatectl
    command to manage time and date settings. This command is part of the systemd
    system and service manager, which is responsible for controlling and managing
    the system’s processes and services.


    Now let configure time and date settings in RHEL 9:


    +   1 Check the current time and date settings


    Before we make any changes, let us check the current time and date settings. To
    do this, run the timedatectl command in the console:


    ```

    [jsg@rhel9_bpb ~]$ sudo timedatectl

    ```


    The timedatectl command will display the current time, date, and time zone of
    your RHEL 9 system.


    +   2 Set the new time zone


    If the time zone of the system is not set correctly, the time will be incorrect
    and may lead to issues in the applications you use. We will still use the timedatectl'
