- pgno: 170
  md: '# CHAPTER 11


    # Working Around

    Networks, Files, and

    Storage Services


    # Introduction


    Building on the practical insights of *Chapter 10, Create, Manage, and Monitor
    Containers*, where we discussed the transformative impact of containerization
    technology, *Chapter 11, Working around Networks, Files, and Storage Services*,
    shifts our focus to the foundational network and storage configurations that support
    robust IT infrastructures. Containers optimize application deployment by abstracting
    software from the underlying hardware, allowing effortless movement across environments
    and streamlined development pipelines.


    In this chapter, we will explore the physical and logical structures that enable
    these advanced technologies to function seamlessly. We will explore the configuration
    and management of network services like **Virtual LANs (VLANs)** and **virtual
    private networks (VPNs)**, understand network bonding for higher throughput, and
    set up IP tunnels. Additionally, we will cover fundamental and advanced storage
    management techniques using tools like **parted, fdisk, and Logical Volume Management
    (LVM)**. This discussion not only complements the container centric workflows
    from the previous chapter by providing a secure, efficient, and scalable backend
    but also sets the stage for complex networking setups essential for today''s distributed
    applications and cloud-based environments.'
