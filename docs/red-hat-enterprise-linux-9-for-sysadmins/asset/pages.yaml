  md: '# Recipe #29: Managing storage in GNOME


    The Disks utility tool in GNOME is used primarily for managing storage in your
    GNOME Desktop. You can run the Disks utility from Show Applications, select Utilities,
    and select Disks. Let us go through some basic operations in managing storage
    in GNOME.


    Check the disk space usage


    +   - Using the Disk Usage Analyzer tool: From Utilities, click on Disk Usage
    Analyzer to open the disk visualization tool. You can select from the Home folder
    and the localhost disk to show a graphical representation of disk space based
    on the partitions set by RHEL 9.

    - Using Monitor: From Utilities, click on System Monitor to run the application.
    Select the File Systems tab to show the physical and virtual devices attached
    to your RHEL 9 system. The Used column shows how much disk space in the partition
    is used.


    # Manage volumes and partitions


    You can check and make changes to the storage volumes with the Disk utility.


    +   - From Utilities, click on Disks to run the Disk utility.

    - From the left pane, you can select from virtual disks, CD/DVD drives, block
    devices, and partitions. Select the device to check and make changes.

    - Once a device is selected, the details of the storage, capacity and usage, as
    well as disk operation options are presented in the right pane. Do take care using
    this tool as it is possible to wipe out storage using the tools provided. You
    can deactivate a partition and select additional partition options such as format,
    resize, and test the disk with a benchmark tool.

    - Note that the Disk utility can destroy a partition along with stored data if
    not used properly. Go through the options in detail before making any changes
    to your disks and volumes.


