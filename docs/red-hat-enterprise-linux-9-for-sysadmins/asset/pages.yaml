    the VM session. Ensure that you only use this if the VM is unresponsive:


    ```

    [jsg@rhel9_bvp ~]$ sudo virsh destroy demo-guest1

    ```


    Domain rhel9-guest01 destroyed


    3. If you wish to delete the VM, use the virsh undef command. Be careful when
    using this command as deleting a virtual machine is irreversible, so make sure
    you have backed up data from the VM with files stored in attached storage. The
    VM also needs to be shut down before deletion:


    ```

    [jsg@rhel9_bvp ~]$ sudo virsh undef rhel9-guest01 --remove-all-storage

    ```


    rhel9-guest01 has been undefined


    From the virsh undef command above, we have also removed all associated storage
    images from the VM. You can also add a -graceful option to the command syntax
    to clean the cache of the disk image.


    # # Conclusion


    Virtualization is a key functionality and solution that SysAds can take advantage
    of RHEL 9. While it has defined limits set by the hardware, virtualization can
    help extend your computing requirements when running solutions that can take advantage
    of shared hardware resources and still have independent control of the underlying
    operating system and solution deployed. RHEL 9 can be used as a virtualization
    host for workloads that require minimal hardware requirements and the management
    lifecycle of the VM can be done with a few key commands from the console.


    In the next chapter, we will discuss the function concepts of container technologies.


    # # Points to remember


    +   - Make to check first if your hardware has enough computing and storage capacity
    to run VM guests especially when running at the same time. Your computer’s CPU
    should also support virtualization and RHEL 9 supports only AMD64, Intel 64, and
    the IBM Z systems (z13 and later).'
