    # Recipe #1: Create a bootable USB stick for RHEL 9


    For our first recipe, we build a bootable media from the DVD iso we just downloaded
    from the Red Hat website. We will be using a USB stick as the installation media
    for RHEL 9, and we need to write the DVD iso image to, so it becomes bootable
    on your target computer or server. Make sure your USB stick is dedicated for this
    exercise as it will erase everything! Also ensure that it is at least 16 GB in
    size so that we have enough room to write the DVD iso image. Once you have your
    USB stick, go ahead to Step 1.


    # Step 1: Install the Fedora Media Writer application


    The quickest way to create a bootable USB stick is to use the Fedora Media Writer
    application to write the DVD iso. You can download the app at https://getfedora.org.
    From that website, select the Fedora Workstation version and from there, the Fedora
    Media Writer download link for both Windows and macOS computers will be. Install
    the version that is right for your use. Figure 2.2 shows how the Fedora Media
    Writer looks like on a Windows 11 setup:


