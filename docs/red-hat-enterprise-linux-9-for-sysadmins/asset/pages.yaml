- pgno: 96
  md: '# Conclusion


    To managing RHEL 9 subscriptions and entitlements, you first need to create a
    Red Hat account. Doing so makes it easier for you to manage your Red Hat subscriptions
    and entitlements which cover both enterprise and individual/developer accounts.
    A Red Hat account also gives you access to the Red Hat Developer Portal that provides
    a no-cost RHEL developer subscription for assessment, testing, and learning. The
    Red Hat account is also needed for creating support requests in the Red Hat Customer
    Portal. If you are managing a RHEL 9 environment with a commercial subscription
    from Red Hat, you can use the sos utility tool to generate a system report that
    you can send to Red Hat as part of the technical support support resolution process
    and this report will allow Red Hat support engineers to diagnose your system based
    on the generated report.


    In the next chapter, we will go through the steps and details in configuring additional
    software repositories in RHEL 9 so you can expand the software catalog based on
    your needs.


    # Points to remember


    +   * Create a Red Hat account to manage your RHEL 9 subscriptions and entitlements
    using the Red Hat Customer Portal. This can be used for both developer (no-cost)
    and enterprise accounts.

    * For individual testing and evaluation, take advantage of the no-cost RHEL for
    developers subscription as it gives enough entitlements for your assessment and
    learning goals.

    * To ensure that data is anonymized before getting technical support from Red
    Hat (for commercial subscriptions), always use the clean option and send the obfuscated
    *.obfuscated.tar.xz file to Red Hat or upload using the sos utility tool.


    # Join our book''s Discord space


    Join the book''s Discord Workspace for Latest updates, Offers, Tech happenings
    around the world, New Release and Sessions with the Authors:

    https://discord.bpbonline.com


