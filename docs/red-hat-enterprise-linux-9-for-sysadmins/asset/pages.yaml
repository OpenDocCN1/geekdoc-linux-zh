    \n+   Open the configuration file:\n  sudo vi /etc/audit/auditd.conf\n\n+   Key\
    \ configuration options:\n  - log_file: Specifies the location of the audit log\
    \ file. By default, it is set to /var/log/audit.log.\n  - log_format: Specifies\
    \ the format of the log file. Options include RAW,NOLOG, ENRICHED. The default\
    \ is ENRICHED.\n  - max_log_file: Specifies the maximum size of the log file in\
    \ megabytes before it is rotated. The default is 8 MB.\n  - num_logs: Specifies\
    \ the number of rotated logs to keep. The default is 5.\n  - space_left_action:\
    \ Defines the action to take when free space on the disk reaches a threshold.\
    \ Options include IGNORE, SYSLOG, SUSPEND, HALT.\n  - admin_space_left_action:\
    \ Defines the action to take when free space reaches the admin-defined threshold.\n\
    \  - max_log_file_action: Specifies the action to take when the maximum log size\
