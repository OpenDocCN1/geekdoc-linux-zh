- pgno: 87
  md: '# Recipe #19: Install the sos utility and generate a system report


    The first thing to do prior to getting official technical support from Red Hat
    is to generate a report that contains system and diagnostic information of your
    RHEL 9 installation and setup. This report is generated by the sos utility and
    is called as a sos report. The sos report is the initial data used by Red Hat
    technical support engineers for analysis of a RHEL 9 setup. The data collected
    from your RHEL 9 system would include the following:


    +   * The kernel version installed

    * System and services configuration

    * Installed packages

    * The command output from sos itself


    To generate the sos report, you will first need to install the sos utility tool.\
    Open the command line and switch to root. As root, install the sos package with
    the dnf command:


    +   1. [jsg@rhel19-bpb ~]$ sudo -i

    2. [sudo] password for jsg:

    3. [root@rhel19-bpb]# dnf install sos


    ![](img/d96b39fd89022f83082b77305c8fd6e9_87_0.png)'
