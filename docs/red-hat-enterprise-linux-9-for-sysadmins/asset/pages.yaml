- pgno: 3
  md: '# About the Authors


    +   * Jerome Gotangco is a technology consultant with extensive experience in
    the IT Industry. Currently an OpenShift Specialist at Red Hat, he champions the
    Open Hybrid Cloud approach for enterprises using open-source software platforms.
    Jerome has a strong background in open source, previously involved in OpenStack
    and Ubuntu development. Prior to Red Hat, he served as an Azure consultant at
    Microsoft and Hewlett Packard Enterprise. Beyond his technical expertise, Jerome
    enjoys reading, writing essays and poems, painting miniature figurines, and maintaining
    an active lifestyle with fitness and goal.


    +   * Luca Berton is a seasoned IT professional with over 18 years of experience
    in Linux system administration, cloud engineering, and automation. Renowned as
    an IT Automation expert, Luca has authored several best-selling books, including
    Ansible for VMware by Examples, Ansible for Kubernetes by Examples, Red Hat Ansible
    Automation Platform, and Hands-on Ansible Automation.


    Luca''s dedication to open-source projects and his commitment to sharing knowledge
    are reflected in his creation of the Ansible Pilot project, which serves as a
    resource for automation enthusiasts worldwide. His expertise extends to presenting
    at international conferences, contributing to the growth of the Ansible community,
    and mentoring aspiring IT professionals.


    As a thought leader and practitioner, Luca combines a deep technical understanding
    with practical insights, making his work a trusted resource for IT professionals
    globally. Through this book, he aims to equip readers with the skills and confidence
    to excel in their careers and beyond.'
