    # # Recipe #11: Upgrade from a previous version of RHEL


    It is possible to upgrade an existing RHEL installation to RHEL 9 if it still
    supported by Red Hat. However, certain conditions exist:


    +   - RHEL 8: You can do an in-place upgrade to RHEL 9 using the LEAPP utility.
    LEAPP is a tool accessible via CLI and is a framework for modernizing operating
    systems and applications.

    - RHEL 7 and below: there is no direct upgrade path to RHEL 9 with these versions.
    To upgrade to RHEL 9, you must do an in-place upgrade to RHEL 8 (where supported),
    prior to doing another upgrade to RHEL 9, like how it is described in #1.


    For this recipe, let us go through the steps in upgrading an existing RHEL 8 installation
    to RHEL 9:


    +   - Check the system requirements: Make sure that your system meets the minimum
    requirements for RHEL 9. To go through the system requirements, head back to Chapter
    2, Setting Up RHEL 9, and review the specifications needed to do an upgrade.

    - Do a data backup: It is important to backup up all important and relevant data
    and configurations prior to doing the upgrade to RHEL 9. This includes files in
    your home directory to ensure that the data is secure in case the upgrade fails.
    You can use the tar utility to do a simple backup of the /home directory with
    the command:


    ```

    [jsg@rhel9_bpb ~]$$ tar czf /mnt/backup/mybackup.tar.gz /home/

    ```'
