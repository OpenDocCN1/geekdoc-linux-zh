    # Recipe #90: Secure NFS services


    Securing network services like NFS is crucial to protect sensitive data and prevent
    unauthorized access. In RHEL, you can secure these services by using a combination
    of firewall rules, SELinux policies, and encryption mechanisms like TLS. NFS allows
    remote hosts to mount filesystems over a network, which can expose data to unauthorized
    access if not properly secured.


    Step 1: Install NFS server


    Ensure that the NFS server packages are installed:


    ```

    sudo dnf install nfs-utils

    ```


    Step 2: Configure NFS exports


    Edit the /etc/exports file to define the directories to be shared and their access
    controls:


    ```

    sudo nano /etc/exports

    ```


    Add a line for each directory you want to export, specifying the permissions:

    /data/nfs_share 192.168.1.0/24(rw,sync,no_root_squash,no_subtree_check)


    +   a. rw: Read-write access.

    b. sync: Ensures changes are written to disk before the client is notified.

    c. no_root_squash: Preserves root privileges for remote users (with caution).

    d. no_subtree_check: Disables subtree checking, which improves performance.


    Step 3: Apply export configuration


    After exporting the /etc/exports file, apply the configuration:


    ```

    sudo exports -rav

    ```


    Step 4: Secure NFS with firewall


    Open necessary ports in the firewall:


    ```

    sudo firewall-cmd --permanent --add-service=nfs

    sudo firewall-cmd --permanent --add-service=mountd

    sudo firewall-cmd --permanent --add-service=rpc-bind

    sudo firewall-cmd --reload

    ```'
