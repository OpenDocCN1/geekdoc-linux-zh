    # # Objectives


    In this chapter, we set the following RHEL objectives: learn and understand the
    **dnf** tool to be able to install and update software packages for your RHEL
    9 system. This tool is essential learning for sysadmins; add and manage new software
    repositories to your RHEL 9 system so you would be able to install software packages
    outside those provided by Red Hat (such as proprietary or non-free software packages)
    and widen the capabilities of your system.


    Now, let us start installing and managing them in your RHEL 9 system!


    # # Recipe #22: Configure the DNF tool and update RHEL 9


    By default, RHEL 9 uses **Dandified YUM** (DNF) package manager to install and
    manage RHEL 9 software packages delivered in the **Red Hat Package Manager** (RPM)
    format. DNF is also used in Fedora as all the other Red Hat-based distributions
    available. Previously, RHEL used **yum** (Yellowdog Updater Modified) as default
    but has transitioned to DNF since RHEL 9. While yum still works, you should use
    **dnf** and the syntax and flags are similar. So, let us start some basic DNF
    commands that will be you in managing your RHEL 9 setup.


    Before upgrading any package, it would be ideal to check if there are updates
    available:


    +   1. `[jsg@rhel9-byp ~]$ sudo dnf check-update`

    2. Updating Subscription Management repositories.

    3. Last metadata expiration check: 2:03:03 ago on Sat 14 Jan 2023 01:41:55 PM
    PST.


    If package updates available, you can upgrade a specific package only:


    +   1. `[jsg@rhel9-byp ~]$ sudo dnf upgrade <package>`


    You can also upgrade all the packages available with the with **dnf** upgrade
    command:


    +   1. `[jsg@rhel9-byp ~]$ sudo dnf upgrade`


    If you wish to install a new package, you can do a search. If you are not familiar
    with the package name, you can use specific keywords:


    +   1. `[jsg@rhel9-byp ~]$ sudo dnf search emacs`

    2. Updating Subscription Management repositories.

