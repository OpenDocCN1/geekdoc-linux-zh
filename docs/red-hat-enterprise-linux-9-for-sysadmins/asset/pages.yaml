    # Recipe #56: Manage the container network


    In Podman, you can create new rules and manage traffic for both internal and external
    network access. There are two network types in podman:


    +   * Rootless: The network is automatically set up with no IP address assigned.

    * Rootful: The container has an IP address assigned


    By default, Podman creates a bridged network. From the terminal you can list all
    the container networks with podman network ls command:


    ```

    [jsg@rhel19-bpb~$] podman network ls

    ```


    You can also inspect the details of the container network and show the range of
    the IPs, the type of network, and installed plugins by invoking podman network
    inspect command and the network name you wish to inspect:


    ```

    [jsg@rhel19-bpb~$] podman network inspect podman

    ```


    Let us create a new container network and use a handy container network name that
    you can remember for later use:


    ```

    [jsg@rhel19-bpb~$] podman create bpbnetwork

    ```


    To check if the bpbnetwork is created, list all active container networks again
    with podman network ls command:


    ```

    [jsg@rhel19-bpb~$] podman network ls

    ```


    The next thing is to accomplish connecting a container to the new container network
    using the podman network connect command and include the network name and the
    container name where the new network will be attached:


    ```

    [jsg@rhel19-bpb~$] podman network connect bpbnetwork name_of_container

    ```


    To disconnect, use the same network name and container name.


    ```

    [jsg@rhel19-bpb~$] podman network disconnect bpbnetwork name_of_container

    ```


    Finally, remove the unused network with the podman network rm command and use
    the network name to identify the network to be removed:


    ```

    [jsg@rhel19-bpb~$] podman network rm bpbnetwork

