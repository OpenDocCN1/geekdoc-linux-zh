- pgno: 49
  md: '# Recipe #4: Conduct an automated installation of RHEL 9 using Kickstart


    In the previous recipes, we have installed and configured RHEL 9 with an interactive
    interface using Anaconda. That method is the most common way to install RHEL 9
    in your system and gives you a solid foundation in building the skills needed
    for succeeding recipes in this book. But what if we had to do the same thing over
    again to multiple systems? Using Anaconda for every system we install would be
    cumbersome as you must accomplish every step. For that reason, you need to automate
    the installation process and RHEL 9 provides a great tool for that Kickstart.


    Kickstart allows you to automate the RHEL 9 installation process from configuring
    system settings, drive partitioning, software to be installed, just to name a
    few. A Kickstart configuration file can be used by multiple systems at the same
    time, allowing for RHEL 9 installations at scale. So as a sysadmin, learning how
    to do automated installation and configuration of RHEL 9 with Kickstart is a valuable
    timesaver!


    A Kickstart installation can be done using the DVD iso we created in previous
    recipes. We will focus on an automated DVD install in this recipe. The other ways
    we can use Kickstart installation is through the network, by way of HTTPS, FTP,
    or NFS (we will go through the HTTPS process in the next recipe).


    Here are the steps on creating a Kickstart file:


    # Step 1: Access the Kickstart Generator tool


    The fastest way to create a Kickstart file is through the Kickstart Generator
    tool provided by Red Hat which can be accessed at https://access.redhat.com/labs/kickstartconfig/
    (you may need to create a Red Hat account to access the tool). The tool provides
    an easy way to create the file by providing answers to the configuration settings
    that is normally done in the manual install. Head to the link provided and you
    will be forwarded to the tool interface like Figure 2.12 below:'
  merge: -1
  img_proc: true
