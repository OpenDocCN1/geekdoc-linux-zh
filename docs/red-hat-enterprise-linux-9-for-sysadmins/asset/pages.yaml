  md: '# # Recipe #25: Manage RHEL 9 software packages


    As shown in Recipe #22, **dnf** is a handy tool for installing new packages and
    updating your RHEL 9 system. The use of the tool is not just limited to packages
    provided by Red Hat, but also to the repositories we added in *Recipes #23* (EPEL)
    and *#24* (RPM Fusion). Now let us go through more in-depth use of *dnf* in managing
    the packages in your RHEL 9 system.


    To check the list of repositories that are active in the RHEL 9 system, do a **repol**:


    +   1. `[jsg@rhel9-bpb ~]$ sudo dnf repolist`

    2. Updating Subscription Management repositories.

    3. repo id repo name

    4. codeready-builder-for-rhel-9-x86_64-rmps

    Red Hat CodeReady Linux Builder for RHEL 9 x86_64 (RPMs)

    5. epel

    Extra Packages for Enterprise Linux 9 - x86_64

    6. rhel-9-for-x86_64-appstream-rmps

    Red Hat Enterprise Linux 9 for x86_64 - AppStream (RPMs)

    7. rhel-9-for-x86_64-baseos-rpps

    Red Hat Enterprise Linux 9 for x86_64 - BaseOS (RPMs)

    8. rmfusion-free-updates

    RPM Fusion for EL 9 - Free - Updates

    9. rmfusion-nonfree-updates

    RPM Fusion for EL 9 - Nonfree - Updates


    You can also list active and inactive repositories available by invoking **repolist
    all**:


    ```

    . `[jsg@rhel9-bpb ~]$ sudo dnf repolist all`

    ```


    The command will provide a list of the enabled repositories as well as disabled
    repositories. This would be a long list, so the output of the command is not shown
    here.


    If you wish to enable a repository and install a particular package, you can invoke
    it over one line:


    ```

    . `[jsg@rhel9-bpb ~]$ sudo dnf --enablerepo=repo-name install package`

    ```


    Another thing to consider in managing software packages is to be able to list
    all installed packages. From the terminal you can list all packages with the list
    installed command:


    ```

    . `[jsg@rhel9-bpb ~]$ sudo dnf list installed`

    ```


    This would be a long list, so we did not include output. But you will be provided
    with details of the packages along with information on what repository it was
    installed from.'
