    # Recipe #76: Manage cluster resources and cluster nodes


    Managing a high availability cluster is important to ensure that it does not stop
    smooth operation and graceful handling of maintenance tasks. You are using the
    pcs as a tool to trusty cluster command line companion.


    # Resource relocation


    Move a resource to its preferred node based on current cluster conditions. The
    resource_name is the name of the resource you want to relocate


    +   * Relocate the resource: This command calculates the optimal node and moves
    the resource:

    `pcs resource relocate run resource_name`'
  merge: -1
  img_proc: true
- pgno: 223
  md: '+   2. Optional: clear relocate constraints: After relocation, you can remove
    the temporary constraints created by the command:

    `pcs resource relocate clear resource_name`


    # # Live migration


    Move a resource to a different node without interrupting service (if the resource
    agent supports it). The following command uses the `resource_name` for the resource
    to migrate and `target_node` for the destination node.


    +   1. Check for live migration support: Ensure the resource agent supports live
    migration. Cons its documentation.


    +   2. Migrate the resource: Use the move command with the `--wait` flag:

    `pcs resource move resource_name target_node --wait`


    +   3. Resource disable/enable:

    Temporarily stop and prevent a resource from running. The `resource_name` specifies
    the resource to manage.

    a) Disable the resource:

    `pcs resource disable resource_name`

    b) Re-enable the resource:

    `pcs resource enable resource_name`


    # # Resource ban


    Prevent a resource from running on a specific node. The resource to restrict `resource_name`,
    and `node_name` is the node from which to ban the resource.


    +   1. Ban the resource:

    `pcs resource ban resource_name node_name`


    +   2. Optional: remove the ban:

    `pcs resource clear resource_name node_name`


    # # Node standby


    Temporarily remove a node from service, migrating its resources elsewhere. The
    `node_name` specifies the node to put in standby mode.


    +   1. Enter standby mode:

    `pcs node standby node_name`'
