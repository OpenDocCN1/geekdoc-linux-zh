  md: '# Managing RHEL 9 Subscriptions


    ![](img/d96b39fd89022f83082b77305c8fd6e9_86_0.png)


    > Figure 5.8: Information of a registered RHEL 9 system using Red Hat Subscription
    Manager application in GNOME


    Once your RHEL 9 system is registered and the subscription activated, the last
    exercise for this recipe is to validate the activation and check the entitlements
    utilized based on your account. From the Red Hat Developer portal (you can also
    go to the Red Hat Customer Portal for this), click on your Account icon at the
    top right side of the Red Hat and select **Subscriptions**. You will be presented
