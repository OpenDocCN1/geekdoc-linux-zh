    # Virtualization is a functionality of a RHEL 9 system that allows a sysad to
    run multiple instances of operating systems as guests without affecting the original
    system that acts as host. The guests are called virtual machines or VMs and are
    independent of the host machine yet utilize the underlying hardware and software
    resources in a shared manner. Since VMs run independently, they are managed as
    if they are a complete system, the hardware is virtualized and shared across other
    guests. Users may not be aware at all that they are in VM unless they check the
    details of the system through various tools and utilities. In short, virtualization
    allows you to run multiple instances of independent systems from a single host,
    and this gives sysads and application developers a lot of flexibility in building
    solutions when hardware resources are in short supply. This chapter is all about
    virtualization in RHEL 9 and is a great reference to bookmark when you need a
    complete step by step documentation in enabling virtualized workloads in your
    system.


