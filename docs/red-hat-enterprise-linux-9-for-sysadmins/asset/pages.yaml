    In this configuration, [homes] provides a private share for each user, and [printers]
    configures Samba to share printers installed on the server.


    Step 3: Adding users. Samba uses its own set of passwords separate from the Linux
    system passwords. You need to add users to the Samba password database to allow
    them access to the shares:


    ```

    [lb@rhel9_bpj]$ sudo smbpasswd -a username

    ```


    Replace username with the actual account name. The user must also exist on the
    Linux system.


    Step 4: Managing Samba services. Ensure after configuring your file shares and
    adding users, restart the Samba services to apply the changes:


    ```

    [lb@rhel9_bpj]$ sudo systemctl restart smb

    ```


    Step 5: Configuring firewalls. Ensure that your firewall allows Samba traffic.
    You can configure firewall-cmd to allow Samba through the firewall as follows:


    ```

    [lb@rhel9_bpj]$ sudo firewall-cmd --permanent --add-service=samba

    [lb@rhel9_bpj]$ sudo firewall-cmd --reload

    ```


    Step 6: Accessing shares from a client. From a Windows client, you can access
    the Samba shares by entering \samba_server\ in the file explorer address bar,
    where samba_server is the IP address of your Samba server. You will be prompted
    to enter the username and password configured earlier.


    Setting up a Samba server on RHEL 9 provides a powerful, flexible solution for
    file and print services in a mixed OS environment. By following the steps outlined
    above, you can successfully deploy Samba to meet your network-sharing needs. Whether
    you are managing a home network or a corporate infrastructure, Samba offers a
    robust platform for seamless cross-platform integration.'
