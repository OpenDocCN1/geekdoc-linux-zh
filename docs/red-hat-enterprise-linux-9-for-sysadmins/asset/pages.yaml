    +   3. Block unwanted traffic


    The next step to configure in your firewall is to block unwanted traffic. This
    includes blocking incoming traffic from unknown sources, blocking IP addresses,
    To block incoming traffic from unknown sources, do the following command from
    the console:


    ```

    [jsg@rhel19_bpd ~/] sudo firewall-cmd --permanent --add-rich-rule=family="ipv4"
    source address="0.0.0.0/0" reject

    ```


    To block incoming traffic from a specific IP address, do the following command
    from the console (change the IP address as needed):


    ```

    [jsg@rhel19_bpd ~/] sudo firewall-cmd --permanent --add-rich-rule=family="ipv4"
    source="192.168.1.100" reject

    ```


    +   4. Reload the firewall configuration


    After making changes to the firewall configuration, reload the configuration to
    apply the changes. run firewall-cmd with the --reload flag:


    ```

    [jsg@rhel19_bpd ~/] sudo firewall-cmd --reload

    ```


    +   5. Check firewall configuration


    To check the firewall configuration, and display all active firewall rules including
    the allowed services and blocked traffic, use the --list-all flag:


    ```

    [jsg@rhel19_bpd ~/] sudo firewall-cmd --list-all

    ```


    Remember to reload the firewall configuration after making changes and regularly
    review the firewall rules to ensure they remain updated, and your system secured.


