    # Recipe #65: Set up a Samba service for file and print services


    Setting up a Samba service on RHEL 9 servers can vastly improve the interoperability
    between Linux and Windows machines within a network. Samba allows file and printer
    sharing across various operating systems, making it an essential service for mixed-environment
    setups. This recipe guides you through the steps to install, configure, and secure
    a Samba server for file and print services. Samba is an open-source software that
    provides seamless services to SMB/CIFS (Server Message Block/Common Internet File
    System) clients. It allows a Linux server to function as a file and print server
    for Windows, Linux, and macOS clients, facilitating data sharing and central document
    management in a mixed OS environment.


    **Step 1**: Installing Samba on RHEL 9, First, you need to install the Samba packages.
    You can do this using the **dnf** package manager.


    ```

    [@rhel9-bpp ~]$ sudo dnf install samba-client samba-common

    ```


    After installation, ensure that the Samba services are enabled and started.


    ```

    [@rhel9-bpp ~]$ sudo systemctl enable smb nmb

    [@rhel9-bpp ~]$ sudo systemctl start smb nmb

    ```


    **Step 2**: Configuring Samba. The main configuration file for Samba is **/etc/samba/smb.conf**.
    You will need to edit this file to set up your shared directories and printers.


    Here is an example configuration:


    ```

    [global]

    workgroup = WORKGROUP

    security = user

    passdb backend = tdbsam

    printing = cups

    printcap name = cups

    load printers = yes

    cups options = raw

    ```


    [homes]'
