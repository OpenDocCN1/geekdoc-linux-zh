    # Recipe #89: Set up a VPN with IPSec


    Internet Protocol Security (IPSec) is a set of protocols to secure Internet Protocol
    (IP) communications by authenticating and encrypting each IP packet in a communication
    session. Setting up a virtual private network (VPN) with IPSec on RHEL ensures
    secure communication over potentially insecure networks.


    This guide will walk you through the process of setting up an IPSec based VPN
    using Libres, and a popular IPSec implementation.


    Step 1: Install required packages


    First, install the necessary packages for IPSec:

    sudo dnf install libreswan


    Libreswan is a widely used implementation of IPSec, and it provides the tools
    needed to set up an IPSec VPN.


    Step 2: Configure the IPSec VPN


    The IPSec configuration is typically handled through the /etc/ipsec.conf file
    and individual connection definitions in the /etc/ipsec.d/ directory.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Edit the main configuration file:


    Open the /etc/ipsec.conf file for editing:

    sudo nano /etc/ipsec.conf


    Ensure the configuration includes the following:


    ```

    config setup

    protostack=netkey

    uniqueids=no

    ```


    +   a. protostack=netkey: Specifies the use of the native IPSec stack in the Linux
    kernel.


    +   b. uniqueids=no: Allows multiple connections from the same client.


    # Create a connection definition:


    Define the VPN connection by creating a new file in the /etc/ipsec.d/ directory,
    for example, vpn.conf:


    ```

    sudo nano /etc/ipsec.d/vpn.conf

    ```


    Add the following configuration to define your IPSec connection:


    ```

    conn myvpn

    authby=secret

    auto=start

    left=your.server.ip

    leftid=@yourserverdomain.com

    leftsubnet=%your.server.subnet/24

    right=any

    rightid=@yourclientdomain.com

    rightsubnet=your.client.subnet/24

    ike=aes256-sha2_512;modp2048

    phase2alg=aes256-sha2_512;modp2048

    elififetime=8h

    salifetime=1h

    pfs=yes

    dpddelay=30

    dpdtimeout=120

    dpdaction=restart

    ```


    +   a. left: The IP address of your VPN server.


    +   b. leftid: The identifier for your server (usually the domain name).


    +   c. leftsubnet: The subnet behind the VPN server that should be accessible
    via VPN.'
  merge: -1
  img_proc: true
