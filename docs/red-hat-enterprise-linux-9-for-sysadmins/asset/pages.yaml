    On October 28, 2018, IBM announced its intentions to acquire Red Hat for $34 billion
    USD to become an independent subsidiary as part of IBM''s Hybrid cloud business.
    The said acquisition was approved and closed on July 8, 2019.


    To date, Red Hat has over 19,000 employees globally, and the business has gone
