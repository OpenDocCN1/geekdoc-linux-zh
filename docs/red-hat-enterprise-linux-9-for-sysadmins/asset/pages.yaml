    \ defaults 0 2\n/dev/sdc3 none swap sw 0 0\n\nIn this recipe, we have used both\
    \ fdisk and parted to partition our disks, showcasing their different strengths:\n\
    \n+   - fdisk is the traditional tool that uses the older MBR partitioning scheme.\
    \ It is simple and widely supported but limited to 2 TB disks and four primary\
    \ partitions. We used on sdb to create a basic layout with standard Linux and\
    \ LVM partitions.\n- parted is more modern, supporting GPT. GPT allows disks larger\
    \ than 2 TB, more than four primary partitions, and partition naming. We used\
    \ it on sdc to create a more complex layout, demonstrating features like percentage\
    \ based sizing and partition flags.\n\nThe choice between fdisk and parted often\
    \ comes down to disk size, partition scheme and required features. In modern systems,\
    \ especially with large disks, parted is generally the better choice.\n\nOur partition\
    \ layout on sdc shows thoughtful planning:\n\n+   - A large ext4 partition for\
    \ immediate data needs.\n- An LVM partition for backups, allowing easy size adjustments.\n\
    - Dedicated swap space for better system performance.\n- A reserved partition,\
