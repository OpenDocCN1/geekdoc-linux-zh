  md: '# Recipe #61: Set up an IP tunnel


    We set up an IP tunnel in RHEL 9 to encapsulate one network protocol inside another
    to connect two hosts across different networks. In this example, we will create
    a Generic Routing Encapsulation (GRE) tunnel to carry IPv6 over an IPv4 network:


    ```

    [lb@rhel_9_bbp]$ sudo nmcli connection add type ip-tunnel

    con-name IPv6-over-IPv4

    ifname gre

    ip-tunnel.mode gre

    ip-tunnel.local 203.0.113.5

    ip-tunnel.remote 198.51.100.7

    ip6 2001:db8:1234::/64

    Connection ''IPv6-over-IPv4'' (7cd9e5f3-6a2b-41c8-a9f6-8e3d4f5c6b7a) successfully
    added.

    ```


    Let us break down this:


    +   - ip-tunnel: Specifies that we are creating a tunneling connection.

    - con-name IPv6-over-IPv4: A descriptive name for our tunnel.

    - ifname gre: The interface name for our tunnel.

    - ip-tunnel.mode gre: We are using GRE mode, which can encapsulate various protocols.

    - ip-tunnel.local 203.0.113.5: Our server''s public IPv4 address.

    - ip-tunnel.remote 198.51.100.7: The remote server''s public IPv4 address.

    - ip6 2001:db8:1234::/64: Our IPv6 address inside the tunnel.


    > Note: We are using reserved IP ranges (203.0.113.0/24 for server, 198.51.100.0
    for testing, and 2001:db8::/32 for IPv6 documentation) to avoid conflicts.


    Now, let us activate our tunnel:


    ```

    [lb@rhel_9_bbp]$ sudo nmcli connection "IPv6-over-IPv4"

    Connection successfully activated (D-Bus active path: /org/freedesktop/NetworkManager/ActiveConnection/11)

    ```


    Let verify our tunnel setup:


    ```

    [lb@rhel_9_bbp]$ ~ ip -d link show gre

    12: gre@NONE: <POINTTOPOINT,NOARP,UP,LOWER UP> mtu 1476 qdisc noqueue state UNKNOWN
    mode DEFAULT group default qlen 1000

    link/gre 203.0.113.5 peer 198.51.100.7

    inet6 2001:db8:1234::/64 scope global tentative

    valid_lft forever preferred_lft forever

    ```'
