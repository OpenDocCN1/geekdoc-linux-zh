- pgno: 29
  md: '# 8 Red Hat Enterprise Linux 9 for SysAdmins


    as the upstream source), CentOS Linux became a favorite alternative distribution
    among organizations that have the capabilities to build and manage a solution
    stack and seek the rock-solid reliability of RHEL without paying for a subscription
    to Red Hat for commercial support. In 2014, The CentOS Project became affiliated
    with Red Hat as an independent project (like Fedora) with its own Governing Board
    responsible for managing, curating the activities, and marketing The CentOS Project.
    Method of development for CentOS Linux continued until December 2020, when the
    CentOS Board announced that development model of CentOS Linux would discontinue
    at the end of 2021 and introduce a new distribution called CentOS Stream. The
    last supported version of CentOS Linux is version 7 which was based on RHEL 7
    and released in July 2014. CentOS Linux 8 inherited the 10-year support cycle
    for updates and is expected to have maintenance updates until June 2030. As for
    this, the final release of CentOS Linux is version 8 reached end of life (EOL)
    on December 31, 2021. After this, all CentOS Project development focused on CentOS
    Stream.


    CentOS Stream started after the release of CentOS 8 to continuously deliver the
    innovations of a Linux distribution and serve as the new upstream source for Red
    Hat Enterprise development. That means CentOS sits between Fedora and RHEL. This
    is a radical change from the previous model of development wherein CentOS used
    RHEL as its upstream source, which made it much popular among users and allowed
    them to get the best of what RHEL provides without the cost of a Red Hat subscription.
    While this upset many end users of CentOS Linux, the introduction of CentOS Stream
    provided an opportunity for organizations, especially those who are invested in
    the RHEL ecosystem, to become part of the community that would work and influence
    on future changes and directions of RHEL development which includes thousands
    of independent software vendors (ISVs), hardware original equipment manufacturers
    (OEMs), and Red Hat ecosystem. As the new upstream source for RHEL, CentOS gives
    these organizations a platform for building and testing their solution offerings
    to become compatible with future versions of RHEL.


    CentOS Stream 9, the latest release of as this writing, uses Fedora as the upstream
    source with succeeding minor versions (RHEL 9.1, 9.2, onwards), using CentOS Stream
    9 as an upstream resource. What does this mean for you the sysadmin? CentOS Stream
    9 is very much aligned to RHEL 9 (and succeeding versions) development; hence,
    the expected support lifecycle is expected to be that of RHEL 9 until 2027. You
    can download CentOS Linux and CentOS Stream installation and source code images
    at https://www.centos.org/downloads.


    # Rocky Linux and AlmaLinux OS


    The discontinuation of CentOS Linux development and the introduction of CentOS
    Stream resulted to a major backlash among the CentOS community and among them,
    Greg Kurtzer, who happened to be a co-founder of The CentOS Project. Greg announced
    that he would be starting a new project called Rocky Linux that was true to the
    original goals'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Introducing Red Hat Linux 9


    aspirations of CentOS Linux. The name Rocky Linux was a tribute to early CentOS
    founder Rocky McGaugh. Rocky Linux is rebuilt from RHEL sources meaning it is
    binary compatible and would provide the same reliability and stability of a RHEL
    release. Rocky has two official releases, Rocky 8 (derived from RHEL 8), with
    planned EoL by May 31, 2029, and Rocky 9 (derived from RHEL 9), with planned EoL
    by May 31, 2032. You can check out these Rocky releases at https://rockylinux.com.


    Like Rocky Linux, AlmaLinux OS is a community driven and governed Linux distribution
    project that aims to provide an enterprise grade, binary compatible with RHEL
    distribution. Development and management of AlmaLinux OS is owned by the AlmaLinux
    Foundation, a non-profit organization. The foundation owns all assets related
    to AlmaLinuxOS. Similar to Rocky Linux, AlmaLinux OS is backed by big companies
    that previously benefited from the success of CentOS Linux, like AWS, Microsoft,
    AMD, and ARM. AlmaLinux OS versions are very similar to that of RHEL, and you
    can download installation images for x86_64, aarch64, and other architectures
    at https://almalux.org.


    # Oracle Linux


    One of the biggest enterprise software providers in the world, Oracle, introduced
    in 2006 a 100% binary compatible alternative to RHEL called Oracle Linux. This
    binary compatibility resulted by adopting a similar model of development with
    CentOS Linux, and with Oracle''s depth and reach in the enterprise market, able
    to provide 24/7 global professional technical support to customers who need that
    of coverage. Having Oracle Linux as part of the Oracle portfolio enabled the company
    to manage the technology stack and direction from hardware, operating system,
    and applications. As a RHEL compatible distribution, Oracle can provide an enterprise
    support path for CentOS users who do not want to move to a Red Hat subscription.


    Oracle Linux is made with two versions based on Linux kernel tuning:


    +   - Oracle Linux with Red Hat Compatible Kernel (RHCK): Uses 100% RHEL sources
    and is considered binary compatible with all supported RHEL releases.


    +   - Oracle Linux with Unbreakable Enterprise Kernel (UEK): Like the RHCK release
    but utilizes newer kernel sources with Oracle enhancements enhanced aligned to
    Oracle products (hardware and software). These enhancements are heavily used in
    Oracle''s Engineered Systems (full-stack solutions designed to run the Oracle
    Database and supported applications for mission-critical workloads) and the Oracle
    Cloud Infrastructure (OCI).


    Oracle Linux versioning is like RHEL version conventions, making it easy for users
    to immediately check compatibility and changes from RHEL upstream (especially
    UEK versions). Users can download the distributions at no cost, and as an option,
    subscribe to professional technical support for an additional fee. You can check
    out more information'
  merge: -1
  img_proc: true
