    manually set the time and date with the following:


    ```

    [jsg@rhel9_bjp ~]$ sudo timedatectl set-time "2023-04-23 12:30:00"

    ```


    The format you must use is YYYY-MM-DD HH:MM:SS which pertains to the year, month,
    day, hours, minutes and seconds you wish to set.


