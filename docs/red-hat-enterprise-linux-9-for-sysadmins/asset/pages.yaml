- pgno: 5
  md: '# Preface


    First, we wish to thank you for getting this book, be it for your continued learning
    using Linux distributions as a hobby, or just simply interested in learning a
    new operating system. Second, this book has been written for you, dear system
    administrators of the world, to enable and empower you to be productive with the
    latest edition of Red Hat''s flagship Linux distribution Red Hat Enterprise Linux
    9 (RHEL 9). This book is written in such a way that it can be used as a handy
    reference whenever you need to do something with my RHEL 9 system, like installing
    a database service, spinning up a single node instance for Kubernetes, and more!
    Treat it like a cookbook if you will – always ready to give you the quickest and
    best way to cook up a recipe. In fact, it is the way the book is structured!


    Who is this book for and how to use the cookbook?


    As the title suggests, Red Hat Enterprise Linux 9 for SysAdmins is written for
    System Administrators or SysAdmins who are responsible for installing, configuring,
    and managing an RHEL 9 server in their respective IT environments, be it deployed
    in a data center server, on-premises in the company as a stand-alone server, a
    virtual machine running in a hypervisor, or even in private and public cloud as
    a virtual machine deployment. From a day-to-day point of view, SysAdmins are responsible
    for ensuring computer systems, such as servers, are running in peak condition
    and tuned to handle volumes of transactions. SysAdmins also do proactive planning
    and monitoring; these systems are accessed securely and don''t affect the productivity
    of users relying on the services running in the systems managed by SysAdmins.
    In short, they are the unseen heroes of today''s hyper-connected world, making
    sure the applications that we use every day, be a social network, a digital wallet,
    or an online banking application, among others, are always available and for our
    day-to-day transactions.


    This book is written for junior to mid-level SysAdmins who have managed a Linux
    server before and need to become productive with RHEL 9 in a short amount of time.
    The book contains over 107 recipes of tasks in building and managing a RHEL 9
    system along with applications – installing RHEL 9, building a database server,
    designing a cluster for high availability, and creating a platform for artificial
    intelligence, in the style of a cookbook. Each chapter will focus on a particular
    topic and will contain at least 5 recipes to get your task done in a shorter amount
    of time. The table of contents is structured this way along to make it easy to
    go back to your favorite recipes anytime!'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'We have written this book in a cookbook style and below are just some of the
    great things you''ll learn in each chapter:


    # Chapter 1: Introducing Red Hat Enterprise 9 - You will learn what Red Hat Enterprise
    Linux (or RHEL), its origin, and how critical this operating system is in the
    enterprise. You will also get additional information on getting support for RHEL,
    as well as known alternatives to RHEL.


    # Chapter 2: Setting Up RHEL 9 - You will get information on downloading RHEL
    9 and creating bootable media to be used for the installation. When you get to
    do an installation, you will learn the basics as well as advance lessons on disk
    partitioning and automating the RHEL 9 installation for mass deployments using
    Kickstart.


    # Chapter 3: Establish RHEL 9 on Cloud - Cloud computing is a great way to learn
    about RHEL and you learn how to deploy and configure RHEL 9 on the major cloud
    providers: AWS, Microsoft Azure, and Google Cloud Platform. You will also learn
    to manage your RHEL 9 deployments with the Red Hat Hybrid Cloud Console and use
    existing subscriptions to save money on cloud deployments with Red Cloud Access.


    # Chapter 4: Miscellaneous Configurations of RHEL 9 - When you get to install
    and set up a RHEL 9 system, you will need to do some customizations and configurations
    to make it usable and secure. This chapter will guide you through basic and essential
    configurations in RHEL 9.


    # Chapter 5: Managing RHEL 9 Subscriptions - Running RHEL 9 requires a subscription
    from Red Hat and you will learn in this chapter how to obtain a no-cost developer
    subscription for your learning journey, as well registering your RHEL 9 systems
    to receive software updates and send diagnostic reports to Red Hat to get technical
    support.


    # Chapter 6: Configuring Software Repositories and RHEL 9 Updates - You will learn
    to add third-party software repositories to be able to install new software as
    well as update installed software.


    # Chapter 7: Managing RHEL 9 with GNOME Desktop - RHEL 9 includes the GNOME Desktop
    and you will learn how to configure and navigate with this simple graphical user
    interface to use and manage your RHEL 9 system.


    # Chapter 8: Managing Infrastructure and Databases - RHEL 9 provides a large repository
    of enterprise-grade open-source infrastructure and database software that you
    can install and configure in this chapter.'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'Chapter 9: Administration of Virtualization Workloads - You will learn how
    to create virtual machines and manage them in RHEL 9.


    Chapter 10: Create, Manage, and Monitor Containers - RHEL 9 has robust container
    support with Podman and Buildah and you will have a good grasp of the tools by
    creating and managing container workloads in RHEL 9.


    Chapter 11: Working Around Networks, Files, and Storage Services - This chapter
    covers the essentials of networking, file systems, and storage in RHEL 9. You
    will learn to configure and manage network interfaces, implement firewall rules,
    and set up DNS and DHCP services. Additionally, you will delve into managing file
    systems, including creating and monitoring file systems, NFS and SMB for file
    sharing, and working with advanced storage solutions like Logical Volume Manager
    (LVM) and Stratis.


    Chapter 12: Source Codes, DevOps Pipelines, and Application Development - This
    chapter explores how RHEL seamlessly integrates with modern development practices.
    It teaches you to set up development environments, manage source code repositories
    with Git, and build CI/CD pipelines using tools like Jenkins, Ansible, and Podman.
    You will also explore RHEL debugging utilities and perform profiles to streamline
    application development and deployment.


    Chapter 13: Administration of Clusters and Servers - RHEL is a trusted choice
    for enterprise-grade clustering and server management. This chapter focuses on
    creating and managing high-availability clusters with tools like Pacemaker and
    Corosync. You will learn to configure load balancers, optimize server performance,
    and maintain uptime for critical services. You will also explore distributed file
    systems and shared storage for clusters.


    Chapter 14: Security Hardening of RHEL - Securing systems is vital in the enterprise
    landscape. This chapter provides comprehensive guidance on hardening your RHEL
    installations. Topics include SELinux configuration, managing firewalls with FirewallID,
    implementing audit rules, and enforcing security policies. Learn about Red Hat
    Insights, the SCAP Security Guide, and automating security compliance to ensure
    your systems meet enterprise security standards.


    Chapter 15: Capacity Planning, Log Analysis, and System Audits - Efficient resource
    management and monitoring are crucial for RHEL administrators. In this chapter,
    you will explore tools like top, vmstat, and iotop to monitor system performance
    and plan for future capacity needs. You''ll learn to manage and analyze logs using
    Rsyslog and Logrotate and conduct system audits using tools like Auditd to maintain
    compliance and traceability.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'Chapter 16: Artificial Intelligence and Machine Learning - Discover how RHEL
    supports AI/ML workloads. This chapter introduces you to deploying and managing
    AI frameworks and libraries like TensorFlow, PyTorch, and Scikit-learn on RHEL.
    Learn to optimize hardware for AI/ML, and leverage containerized environments
    for machine learning pipelines to accelerate AI/ML application development.


    This is all you need to use this cookbook and go over through the recipes!'
  merge: -1
  img_proc: true
