    RHEL 9 can automatically synchronize the system clock with a remote time server
    using the Network Time Protocol (NTP). To enable automatic time synchronization,
    run the following command in the console:


    ```

    [jsg@rhel9_bjp ~]$ sudo timedatectl set-ntp yes

    ```


    The RHEL 9 system clock will now synchronize to the default NTP servers online
    and will reference the time zone set earlier.


