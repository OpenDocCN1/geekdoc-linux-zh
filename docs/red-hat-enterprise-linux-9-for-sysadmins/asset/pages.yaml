    # Recipe #82: Set up and configure the firewall service firewall


    The firewall on RHEL provides a dynamic and highly customizable host-based firewall
    solution. It allows administrators to control incoming and outgoing network traffic
    by defining a set of rules and zones. firewall is a service daemon that offers
    a dynamic firewall management tool with support for network zones, allowing administrators
    to assign different security levels to different network interfaces. Unlike static
    firewall solutions, firewall can modify rules on the fly without needing to restart
    the service, ensuring uninterrupted traffic management.


    Key concepts:


    +   - Zones: Zones represent different levels of trust for network interfaces
    or sources. They define what incoming traffic is allowed depending on the network''s
    trust level.

    - Services: Predefined sets of rules that allow traffic for specific services,
    such as HTTP or SSH. Services automatically open the required ports and set the
    necessary protocols.


    To effectively manage firewall on your system, follow the steps below to install,
    configure, and manage firewall settings:


    +   1. Installing firewall


    Step 1: Installing the package


    On RHEL, firewall is typically installed by default. If it is not installed, you
    can install it using the following command:


    ```

    sudo dnf install firewall

    ```


    Step 2: Starting and enabling firewall


    Ensure that firewall starts at boot and is running by executing:


    ```

    sudo systemctl start firewall

    ```


    ```

    sudo systemctl enable firewall

    ```'
