  md: '# Recipe #54: Manage the containers with Podman


    podman, you can create and manage the lifecycle of containers. A pod is the smallest
    compute unit in a container environment. A pod is basically a group that contains
    one or more containers. It includes what is called an infra container that holds
    information, also known as, namespaces, and this infra container can communicate
    to other containers in the pod.


    Since we have some understanding of pods and how podman can be used to manage
    them, let us go through the steps in creating, managing, and shutting down pods.
    Make sure the container-tool package is installed prior to doing these steps.
    If you do not have container-tool installed yet, check Recipe #51, Install the
    container tools.


    To view the Podman documentation and available commands, just open a terminal
    and use:


