- pgno: 75
  md: '# 1. List the system services installed in RHEL 9


    The systemctl** command allows you to interact with the systemd system and service
    manager. The command allows you to manage RHEL 9 system and perform tasks needed
    to start, stop, restart, loading, and unloading system services.


    The first thing you need to check is the system services that are loaded and active
    in RHEL 9. Open a console and list the loaded services:


    ```

    [jsg@rhel9_bpf ~]$ sudo systemctl list-units --type service

    ```


    You can also list all services loaded in RHEL 9 regardless of state if they are
    active or disabled:


    ```

    [jsg@rhel9_bpf ~]$ sudo systemctl list-unit-files --type service

    ```


    # 2. Enable a system service in RHEL 9


    The same systemctl command is used in enabling a system service in RHEL 9. Once
    you have listed the system services and identified what to enable, do the following
    from the console to enable the service:


    ```

    [jsg@rhel9_bpf ~]$ sudo systemctl enable <name>.service

    ```


    Replace <name> with the name of the service you want to enable. Once executed,
    the service will be enabled and will automatically start every time you reboot
    the system.


    It is important to note that enabling a service does not start immediately. If
    the service is currently running, you will need to start it manually using the
    systemctl start command:


    ```

    [jsg@rhel9_bpf ~]$ sudo systemctl start <name>.service

    ```


    # 3. Disable a system service in RHEL 9


    Disabling a system service in RHEL 9 is also done using the systemctl command:


    ```

    [jsg@rhel9_bpf ~]$ sudo systemctl disable <name>.service

    ```


    Like before, replace < name> with the name of the service you want to disable.
    When completed, the service will be disabled and will not automatically start
    after every boot or rebooting of your RHEL 9 system.


    Remember, just like when enabling a service where it does not start automatically,
    disabling a service does not stop immediately. If the service is currently running,
    you will need to stop it manually using the systemctl stop command:


    ```

    [jsg@rhel9_bpf ~]$ sudo systemctl stop <name>.service

    ```'
  merge: -1
