    # Recipe #59: Configure network bonding for network interfaces for higher throughput


    We can set up network bonding in RHEL 9 to aggregate multiple network interfaces
    into a single logical interface, providing higher throughput and redundancy. In
    this example, we will bind two Gigabit interfaces for increased bandwidth:


    ```

    [lb@rhel9_bpp~$] sudo nmcli connection add type bond con-name bond0 ifname bond0

    bond mode 802.3ad ip4 192.168.1.100/24 gw 192.168.1.1

    ```


    ''connection'' (8f6e21bd-33e-4c1a-6d4f4c0e3b2a) successfully added.


    ```

    [lb@rhel9_bpp~$] sudo nmcli connection add type ethernet slave-type bond

    con-name bond0-port1 ifname eth1 master bond

    connection ''bond0-port1'' (3ae6f70-7e2b-45d5-b5f5-6a9cb5f8e3c1)

    successfully added.

    ```


    ```

    [lb@rhel9_bpp~$] sudo nmcli connection add type ethernet slave-type bond

    con-name bond0-port2 ifname eth2 master bond

    connection ''bond0-port2'' (55g8h9d2-9k4c-67e7-d7h7-8b0de7g9f5e2)

    successfully added.

    ```


    Let us break down these commands:


    Create bond0:


    +   * **type bond**: Specifies a bonding connection.

    * **con-name bond0**: Name for our bond.

    * **ifname bond0**: Interface name for the bond.

    * **mode 802.3ad**: IEEE 802.3ad dynamic link aggregation (LACP protocol)

    * **ip4 192.168.1.100/24**: Static IP for the bond.


    Add eth1 to bond0:


    +   * **type ethernet slave-type bond**: An ethernet interface as a bond slave.

    * **con-name bond0-port1**: Name for this slave connection.

    * **ifname eth1**: The first interface to add.

    * **master bond0**: Associates with our bond.'
