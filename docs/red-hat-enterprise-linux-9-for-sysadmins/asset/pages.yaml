- pgno: 228
  md: '# # Recipe #77: Check available security advisories from the console


    Maintaining the security of enterprise systems requires regular monitoring and
    application of security updates. Red Hat provides a comprehensive system for managing
    these updates through RHSA. Red Hat Security (RHS) notifications document security
    flaws identified and fixed in Red Hat products and services. These notifications
    are part of Red Hat''s advisory system, called RHSA (Red Hat Security Advisory).
    Each RHSA contains critical information:


    +   * **Severity**: Level of threat posed by the security flaw.

    * **Type and status**: The nature and current status of the issue.

    * **Affected products**: List of Red Hat products impacted by the flaw.

    * **Summary of fixed issues**: Brief details about the issues addressed.

    * **CVE number**: Common vulnerabilities and exposures numbers, providing additional
    details such as attack complexity and impact.


    Security advisories are also available on the Red Hat Customer Portal, where they
    can be filtered by product, variant, version, and architecture.


    To check security updates have already been applied to your system, you can use
    the `dnf updateinfo` command as described in the following recipes.


    Procedure:


    +   * Run the following command to list all security updates that are installed
    on the host:

    `dnf updateinfo list security -installed`


    +   * The output will include details of the installed security advisories, which
    showing packages have been updated for security reasons:

    RHSA-2019:1234 Important/Sec.libssh2-1.8.0-7.module=el18+2833+c7d6092

    RHSA-2019:4567 Important/Sec.python3-3.6.7.1.el18.x86_64


    Regular monitoring and applying security updates is critical for maintaining the
    security of your Red Hat systems. The `dnf updateinfo` utility is a powerful tool
    allowing administrators to list pending and installed security updates, ensuring
    that systems remain protected against known vulnerabilities.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Recipe #78: Identify available security updates not yet installed in RHEL


    To identify available security updates that still need to be installed on an RHEL
    system, you can use the dnf package manager. The following steps will guide you
    through the process:


    Open a Terminal and run the following command to list all available security updates
    that have not yet installed on your system:


    ```

    dnf updateinfo list updates security

    ```


    Review the output:


    +   a) The command will produce a list of security advisories that apply to your
    system but have not yet been installed. The output will include important details
    as the advisory ID, the severity of the update, and the packages affected.


    Example output:

    RHSA-2024:0123 Important/Sec.kernel-5.14.0-70.13.1.el19_0.x86_64

    RHSA-2024:0456 Moderate/Sec.systemd-249-19.el19.1.1.x86_64

    RHSA-2024:0789 Low/Sec.openssl-3.0.1-41.el19_0.x86_64


    +   b) RHSA-2024:0123 refers to a Red Hat Security Advisory ID, Important/Sec.
    identifies the severity and that it is a security related update, and the package
    affected is kernel-5.14.0-70.13.1.el19_0.x86_64.


    This command provides a straightforward way to check for pending security updates,
    ensuring that you keep your RHEL system secure by applying necessary patches on
    time.


    # Recipe #79: Install a specific security update from an advisory


    You can investigate a specific security advisory and retrieve detailed information
    using its ID.


    Procedure:


    +   a) Run the following command to display details of a specific security advisory:

    dndf updateinfo info RHSA-2019:0999


    +   b) The output will include comprehensive information about the advisory, such
    as the update ID, type, date, bugs, CVEs, and a detailed description.'
