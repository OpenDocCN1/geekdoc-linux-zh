    # Recipe #53: Manage the container registry


    A container registry is a collection or a repository of container images used
    when we build container-based applications with Podman as well as the container
    tools we have installed in previous recipes (see Recipe #51, Install the container
    tools). As part of your subscription, RHEL has access to the following:


    +   - registry.access.redhat.com

    - registry.redhat.io


    To get a list of container images from an identified registry, we can do a pull
    command from the terminal:


    ```

    [js@rhel19_bpp ~]$ podman pull registry.access.redhat.com/ubi9/ubi

    ```


    Now let us break down the podman pull command to understand further:


    +   - registry.access.redhat.com: Pertains to the location of the registry server

    - ubi9: The namespace

    - ubi: The name of the container image


    You can check all the available images in a particular registry by using the search
    command from Podman and explicitly include the registry server location:


    ```

    [js@rhel19-bpp ~]$ podman search registry.access.redhat.com

    ```


    You can also search for a particular container image from all available container
    registries. In the example below, we are searching for images related to openjdk-11:


    ```

    [js@rhel19-bpp ~]$ podman search openjdk-11

    ```


    You can edit the container registry as a super user by opening the registries.conf
    file located at /etc/containers/registries.conf and change the default system-wide
    settings.


    ```

    [js@rhel19-bpp ~]$ sudo nano /etc/containers/registries.conf

