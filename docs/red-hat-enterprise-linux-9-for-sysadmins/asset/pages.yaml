    # Recipe #80: Set up RHEL to install security updates automatically


    We can configure the RHEL system to download and install security updates automatically.
    Ensuring your system remains up to date with the latest security patches is critical
    for maintaining a secure environment.


    Prerequisites:

    Before proceeding, ensure the following prerequisites are met:


    +   Red Hat subscription: The system must have an active Red Hat subscription
    attached to it.

    dnf-automatic package: The dnf-automatic package should be installed on your system.


    Procedure:

