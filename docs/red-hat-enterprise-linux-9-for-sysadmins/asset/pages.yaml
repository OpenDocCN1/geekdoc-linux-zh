    # # Alternatives to RHEL


    In this section, we will discover some well-known distributions that are considered
    viable alternatives to RHEL depending on the use case and application workloads
    to run. We will focus on distributions that have a direct connection or relation
    to RHEL be it on a development perspective or have lineage to RHEL through its
    source code.


    # # Fedora Linux


    Fedora Linux is a community driven Linux distribution that is used as the development
    starting point for RHEL. In Linux distribution parlance, Fedora Linux is the upstream
    source, meaning that the source code of Fedora Linux is picked up by Red Hat,
    stabilized, and made secure to build the RHEL product. Fedora development, release,
    and support is community driven, and led and managed by the Fedora Project, comprised
    of volunteers contributing code, documentation, marketing, and artwork. To manage
    the Fedora Project organization, The Fedora Council was established to coordinate
    the work done by the volunteer community. The project was founded on September
    22, 2003, and has been active since. The project by itself, has no legal identity
    and directly sponsored by Red Hat. The company provides support by providing a
    pool of dedicated developers, resources needed for development, build tools and
    infrastructure, as well as marketing oversight. Red Hat is legally responsible
    for the directions and actions adopted and executed by the project.


    Because the focus of Fedora Linux is bringing the latest and best of what a Linux
    distribution can offer, a new version is released every six months. Primary supported
    include x86_64 and ARM arch64 while alternative architectures are provided PowerPC64LE
    (IBM Power), and s390x (IBM z 5 Systems). The latest version of Fedora as of this
    writing is Fedora 37 and was released November 15, 2022, with five different versions
    depending on the deployment case:


    +   - Fedora Workstation: Targeted for desktop and laptop users, the latest version
    as of this writing (Fedora 40), includes the GNOME 46 desktop environment. It
    is suitable for Linux hobbyists, application developers, and even power users.
    A typical Fedora 40 desktop interface experience is shown in Figure 1.1:'
