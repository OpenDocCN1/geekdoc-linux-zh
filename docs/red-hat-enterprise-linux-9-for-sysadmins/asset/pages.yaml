    # Recipe #81: Implement secure disk partitions


    Secure disk partitioning is a critical aspect of hardening your RHEL system. Configuring
    your system with appropriate partitions can isolate key directories, improve performance,
    and enhance security. This recipe recaps the recommended partitioning practices
    and explains how to use Linux Unified Key Setup (LUKS) on-disk format to encrypt
    partitions.


    # Recommended partitioning scheme


    Hot Hat recommends creating separate partitions for the following directories:


    +   * /boot

    * /

    * /home

    * /tmp

    * /var/tmp


    /boot partition


    The /boot partition is essential because it stores the boot loader and kernel
    images required to start your system.


    > Alert: This partition should not be encrypted to ensure that your system can
    boot correctly. Including /boot within an encrypted / partition may prevent the
    system from booting if the encrypted partition becomes inaccessible.


    /home partition


    Storing user data in a separate /home partition offers several advantages:


    +   * Data protection: If the root partition (/) becomes corrupted, your user
    data remains intact, reducing the risk of data loss.

    * Ease of upgrade: Keeping user data in a separate partition simplifies system
    upgrades, as the /home directory is not overwritten during the installation of
    a new RHEL version.

    * System stability: If user data is stored in / and the partition fills up, the
    entire system may become unstable. Using a separate /home partition prevents this
    issue.


    /tmp and /var/tmp partitions


    The /tmp and /var/tmp directories store temporary files that do not need long
    term storage. These directories should be in separate partitions to prevent them
    from filling up the root partition, which could lead to system instability or
    crashes.'
  merge: -1
  img_proc: true
