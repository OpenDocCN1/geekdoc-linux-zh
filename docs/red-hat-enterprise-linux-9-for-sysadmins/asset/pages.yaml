    # Recipe #15: Set up a firewall


    It is good practice to set up a basic firewall in RHEL 9 to ensure traffic going
    in and out of your system is properly secured and only allowed ports use the network.
    Let us go through the process of setting up a firewall in RHEL 9.


    +   - Check the status of the firewall


    Before setting up a firewall, let us check the status of the firewall. To do this,
    run the firewall-cmd command from the console:


    ```

    [jsg@rhel9_bp ~]$ sudo firewall-cmd --state

    ```


    If the firewall is active, you will see the running status. If the firewall is
    inactive, you will see the status not running. To start the firewall run the systemctl
    command and indicate the firewallld service.


    ```

    [jsg@rhel9_bp ~]$ sudo systemctl start firewallld

    ```


    +   - Allow essential services


    After checking the firewall status, the next step is to allow essential services
    by the firewall-cmd command. These services are required for the system to function
    correctly. Examples of essential services below include SSH, DNS, HTTP, and HTTPS.


    To add SSH:


    ```

    [jsg@rhel9_bp ~]$ sudo firewall-cmd --permanent --add-service=ssh

    ```


    To add DNS:


    ```

    [jsg@rhel9_bp ~]$ sudo firewall-cmd --permanent --add-service=dns

    ```


    To add HTTP:


    ```

    [jsg@rhel9_bp ~]$ sudo firewall-cmd --permanent --add-service=http

    ```


    To add HTTPS:


    ```

    [jsg@rhel9_bp ~]$ sudo firewall-cmd --permanent --add-service=https

    ```'
  merge: -1
  img_proc: true
