- pgno: 54
  md: '# # CHAPTER 3

    # Establish

    RHEL 9 on Cloud


    # # Introduction


    In Chapter 2, Setting Up RHEL 9, we installed and configured RHEL 9 in a standalone
    virtual machine. The same process can also be applied to installing it in a bare
    metal server, desktop, or even a laptop computer if the required minimum specifications
    of the target hardware that you would use is available. In this chapter, we will
    focus on deploying RHEL 9 on a public cloud which accelerates deployment and makes
    setup and configuration easier as the infrastructure needed is already set up
    and ready for use. Cloud computing is now the norm in enterprise computing and
    many, if not all enterprises in the world consider the public cloud as a viable
    platform to run applications and services. The availability of compute, storage,
    network, and application services in a pay-as-you-go or consumption model of usage
    allowed for enterprise platforms and projects to be deployed and configured in
    a rapid manner, in a safe, secure, and trusted delivery platform. In a public
    cloud deployment model, companies and enterprises are provided a committed service-level
    agreement (SLA) to ensure the computing infrastructure used is always running
    and available. For enterprises, this model of computing has increased business
    activity and rapid deployment of resources means faster time to market for services
    to the public. Combined with the security and resiliency of RHEL 9, learning how
    to implement and manage RHEL 9 deployed on a public cloud is a must learn skill
    for sysadmins.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Structure


    In this chapter, we will discuss the following topics:


    +   - Deploy RHEL 9 on the public cloud with AWS, Microsoft Azure, and Google
    Cloud Platform


    +   - Manage your RHEL 9 deployments with the Red Hat Hybrid Cloud Console


    +   - Migrating your existing Red Hat subscriptions to Microsoft Azure with Red
    Hat Cloud Access


    # Objectives


    In this chapter, you will learn to securely deploy RHEL 9 as a virtual machine
    in a public cloud service of your choice. After deploying, you will get introduced
    to the Red Hat Hybrid Cloud Console which would enable you to manage your RHEL
    9 systems. Finally, you will learn how to migrate your active RHEL 9 subscriptions
    and move them to Microsoft Azure with no additional cost to your entitlement.


    # Recipe #6: Deploy a RHEL 9 virtual machine on Amazon Web Services (AWS)


    In this recipe, we will deploy a baseline RHEL 9 system in a VM in AWS. The VM
    service in AWS is called the Elastic Compute Cloud (EC2). In AWS, VMs are referred
    to as instances and we will be using the term throughout the book as a system
    that is deployed as a VM in a public cloud. Now, let us go through the steps in
    creating a RHEL 9 VM in AWS:


    +   1. If you do not have an AWS account, sign up for one at https://aws.amazon.com/.
    You will also need to set your billing details to use AWS resources and get RHEL
    9 as part of the set.


    +   2. If you are using a corporate account, check with your cloud administrator
    to provide access as your company may already have a set AWS landing zone that
    defines the governance, security, and cost management requirements of your company.


    +   3. From the AWS console, navigate to Compute and select EC2.


    +   4. Launch instance and select an Amazon Machine Image (AMI) which is the VM
    image you need to deploy to launch a VM instance.


    +   5. Search for RHEL and select the version that you would like to deploy on
    EC2. Make sure you are getting official images from AWS so that you would be able
    to connect to your Red Hat account for Cloud Access benefit and have the VM monitored
    by Red Hat Insights.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Next, select the size of the VM by going through the Instance types available.


    Once you have selected the Instance type, configure the basic details such as
    network setup. You also need to add storage as the VM will only contain the boot
    disk for RHEL 9 to run on.


    You can add a Tag to properly manage and identify your RHEL 9 machine from the
    rest of your AWS resources.


    Configure the firewall rules for the RHEL 9 VM by setting up a Security group
    by identifying the ports and IP addresses to access the VM. If your AWS landing
    zone already has security groups, choose the appropriate one for your instance.


    To be able to access the RHEL 9 VM after deployment through a Secure Shell (SSH),
    generate a keypair and you will be able to download the private key that you will
    need to access the RHEL 9 VM over SSH.


    Finally, review all the configurations you have just set before launching the
    EC2 instance. After a few minutes, your RHEL 9 VM in EC2 will be available.


    # # Recipe #7: Deploy a RHEL 9 virtual machine on Microsoft Azure


    For this recipe, we will deploy a RHEL 9 system as a VM on Microsoft Azure with
    a standalone or personal account. The steps below should also apply if you are
    using a corporate account or have an existing Enterprise Agreement (EA) with Microsoft.
    Work with your cloud administration team if you are going to deploy RHEL 9 with
    a corporate account as this entails cost, network, and security considerations.
    Your company may have already set an Azure landing zone to ensure that all resources
    deployed in Azure are managed and secured, with proper cost management gates and
    rules in place.


    +   1. If you do not have access to Azure, create one for free and for personal
    use at https://azure.microsoft.com/en-us/. Once created, login using your Azure
    credentials.


    +   2. From the Azure portal, create a new VM. You can type virtual machine in
    the search bar at the top, or if an icon of a VM is available, click on to proceed.


    +   3. Click Create and select Azure Virtual Machine.


    +   4. Select the Subscription that you would use to pay for the Azure resources.
    Depending on your use, this could either be a pay-as-you-go, a personal subscription
    (like a Visual Studio Enterprise benefit), or a corporate Enterprise Agreement
    with Microsoft.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '5. For Resource group, create a new one for this exercise. If you have existing
    resource groups already set, select the one which you want RHEL 9 Azure VM to
