    # Recipe #97: Define rules and functions of the audit with auditctl


    auditctl is a command-line utility used to control and configure the Linux kernel''s
    audit system. It allows you to define rules and manage the behavior of auditd,
    the audit daemon. This utility is particularly powerful for setting up audit rules
    dynamically, without needing to restart auditd. Below is a detailed guide on how
    to define rules and functions using auditctl:


    # Basic syntax of auditctl


    The general syntax for using auditctl is:

    auditctl [options] [rules]


    # Types of audit rules


    Audit rules can be broadly categorized into four types:


    +   - File/Directory watch rules: Monitor access to specific files or directories.

    - System call rules: Monitor specific system calls.

    - User/Group rules: Monitor activities based on user or group IDs.

    - Keyed rules: Rules that include a key for easier identification in the audit
    logs.


    +   File/Directory watch rules

    These rules are used to monitor changes to /etc/passwd.

    Example: Monitor changes to /etc/passwd.

    auditctl -w /etc/passwd -p wa -k password_changes


    +   -w /etc/passwd: Watch the file /etc/passwd.

    -p wa: Monitor write (w) and attribute change (a) permissions.

    -k password_changes: Assign a key named password_changes to this rule for easy
    identification in logs.


    +   System call rules

    System call rules monitor specific system calls made by processes. These rules
    are more complex and allow fine-grained monitoring of system behavior.'
  merge: -1
  img_proc: true
