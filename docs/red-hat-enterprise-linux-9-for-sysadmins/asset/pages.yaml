    In this recipe, we have harnessed the power of LVM in RHEL 9 to create a flexible,
    and robust storage setup. LVM introduces abstraction layers between physical disks
    and the file systems:


    +   - PVs: The raw disks or partitions.

    - VGs: Pool of PVs, the storage buckets.

    - LVs: The virtual partitions carved out from VGs.


    This abstraction provides numerous benefits:


    +   - Flexibility: We easily created /var and /home volumes without worrying about
    physical partition boundaries. When /var needed more space, we extended it on-the-fly
    without affecting /home.


    +   - Performance: By stripping home-lv across both PVs (in data-vg and backup-vg),
    we improve I/O performance. Each read/write operation can utilize both disks simultaneously.'
