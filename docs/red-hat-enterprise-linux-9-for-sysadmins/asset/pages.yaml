    # Recipe # 98: Using pre-configured audit rules based on certification standards


    When configuring an audit system in RHEL, it is often beneficial to use pre-configured
    audit rules that are designed to meet specific security certification standards,
    such as PCI-DSS, HIPAA, or CIS benchmarks. These pre-configured rules ensure that
    your system''s auditing aligns with industry best practices and regulatory requirements.
    RHEL provides several profiles and pre-configured audit rulesets that can be used
    to quickly set up an audit system that is compliant with these standards. This
    is how to apply your preconfigured audit rules:


    Step 1: Install the SCAP Security Guide


    The SCAP Security Guide is a useful tool that provides pre-configured audit rules
    and security profiles that can be applied to your RHEL system to comply with various
    standards. To use it, you need to install the scap-security-guide package.


    ```

    sudo dnf install scap-security-guide

    ```


    Step 2: Apply a pre-configured audit ruleset


    The scap-security-guide package provides several audit rules that are aligned
    with different security standards. You can find these rules in the /usr/share/audit/sample-rules/
    directory or apply them directly using the OpenSCAP tools.


    +   Identify the desired audit profile: The scap-security-guide includes profiles
    for various standards, such as PCI-DSS, CIS, DISA SIG, etc. You can use the oscap
    to list these profiles.


    ```

    oscinfo /usr/share/xml/scap/ssg/content/ssc-rhel9-ds.xml

    ```


    This command lists the available profiles and their descriptions.


    +   Apply the audit rules: You can directly apply audit rules from a specific
    profile using oscap:


    Example: Apply the CIS benchmark audit rules:


    ```

    sudo oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_

    ```'
