  md: '# Configure using the graphical interface:


    To configure network interfaces using the graphical interface, follow these steps:


    +   Click on the Activities menu on the top left of the screen.


    +   Type Settings in the search bar and click on the Settings icon.


    +   Click on the Network icon.


    +   Click on the + button to add a new connection.


    +   Choose the type of connection you want to configure (choose between the options
    provided such as Ethernet, Wi-Fi, VPN, etc.).


    +   Follow the on-screen prompts to configure the connection.


    # Configure using the console:


    To configure network interfaces using console, follow these steps:


    +   Open a console session.


    +   Use the nmcli command as a sudouser to manage network interfaces.


    +   Use the nmcli connection add to add to a new connection.


    +   Use the appropriate options and arguments to configure the connection (e.g.,
    --type, --conname, --autoconnect, etc.).


    +   Use the nmcli connection modify command to modify an existing connection.


    +   Use the nmcli connection delete to delete a connection.


    # Manual configuration


    Network interfaces in RHEL 9 can also be configured manually by directly editing
    configuration files. The two main configuration files are /etc/sysconfig/network-scripts/ifcfg-<interface_name>
    and /etc/resolv.conf.


    Configure the network interface with ifcfg-<interface_name>:


    The /etc/sysconfig/network-scripts/ifcfg-<interface_name> file contains information
    for a specific network interface. To configure a network interface manually, follow
    these steps:


    +   Open the /etc/sysconfig/network-scripts/ifcfg-<interface_name> file with a
    text editor.


    +   Save the file and reload or reboot the system for the changes to take effect.'
