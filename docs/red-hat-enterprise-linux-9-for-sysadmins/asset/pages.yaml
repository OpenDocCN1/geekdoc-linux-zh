  md: '# Step 3: Verifying the firewall status


    To verify firewalld is active and running.

    sudo systemctl status firewalld


    +   2. Configuring firewall zones


    Zones define the level of trust for network interfaces or source IP addresses.
    Each zone has its own set of rules. Below is an overview of some common predefined
    zones:


    +   - public: For use in public areas, only selected incoming connections are
    accepted.


    +   - home: For home networks, incoming connections from other trusted devices
    are allowed.


    +   - dmz: For computers in a demilitarized zone (DMZ), limited access to the
    internal network is allowed.


    Example: Assigning an interface to a zone


    To assign a network interface to a specific zone, use the following commands:


    +   1. List active zones and interfaces:

    sudo firewall-cmd --get-active-zones


    +   2. Assign an interface to a zone:

    sudo firewall-cmd --zone=home --change-interface=eth0 --permanent


    +   3. Reload the configuration:

    sudo firewall-cmd --reload


    +   3. Managing firewall services


    Services in firewalld are predefined rules that enable or disable network access
    for specific applications. For example, enabling the SSH service will open port
    22.


    Example: Allowing SSH traffic


    +   1. Enable the SSH service:

    sudo firewall-cmd --zone=public --add-service=ssh -permanent


    +   2. Reload the configuration:

    sudo firewall-cmd --reload


    +   3. Verify the service:

    sudo firewall-cmd --zone=public --list-services


    +   4. Opening and closing ports'
