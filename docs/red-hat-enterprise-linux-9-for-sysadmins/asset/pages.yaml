    ft replace rule inet example_table example_chain handle 4 tcp dport 22

    meta nftrace set 1 accept


    monitor


    nftables represents a significant advancement in firewall management on RHEL,
    offering greater flexibility, performance, and ease of use compared to its predecessors.
    Whether you are migrating from iptables or starting fresh, nftables provides the
    necessary tools to manage complex networking environments effectively.'
