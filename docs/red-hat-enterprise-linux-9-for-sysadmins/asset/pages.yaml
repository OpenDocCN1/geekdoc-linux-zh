    package_mgmt_report_$(date +%Y\%m\%d).txt" | sudo tee -a /etc/crontab


    This cron runs daily at midnight, generating a summary report and saving it

    in /var/log/audit/


    +   Forward logs to a centralized log server:


    Forwarding logs to a centralized log server or SIEM system allows you to monitor

    and analyze software installation and update activities across multiple systems.


    Example: Use rsyslog to forward logs:


    ```

    sudo vi /etc/rsyslog.d/audit.conf


    Add:

    $InputLoad imfile

    $InputFileName /var/log/audit/audit.log

    $InputTag audit

    $InputFileStateFile audit-state

    $InputFacility info local7

    $InputRunFileMonitor

    *.* @logserver.example.com:514

    ```


    Then restart rsyslog:

    systemctl restart rsyslog


    # Step 5: Review and respond to software management activities


    Regularly review the logs and reports for any suspicious activities, such as:


    +   - Unexpected or unauthorized package installations or updates.

    - Installation of packages from non-standard repositories.

    - Modifications to critical system packages.


    If any suspicious activity is detected, follow your organization’s security incident

    response procedures to investigate and mitigate potential risks. By configuring
    auditd

    to monitor software installations and updates by regularly reviewing system logs

    and reports, you can maintain tight control over package management activities
    on your

    RHEL systems. This helps to ensure system integrity, prevent unauthorized software

    changes, and comply with security and operational policies. Automating the monitoring

    process and centralizing logs further enhances your ability to manage and secure
    your

    environment.'
