    # Recipe #18: Register your RHEL 9 system to receive software updates


    As discussed in Recipe #17, you need to register your RHEL 9 system to Red Hat
    to receive software and security updates. Registering your RHEL 9 system also
    lets you connect (as an option) to Red Insights, a managed cloud service by Red
    Hat that analyzes your RHEL 9 system based on the configuration, installed applications,
    and provides prescriptive and pro-active information in securing and using your
    system to its fullest. Red Hat Insights is included in every RHEL subscription
    (including the no-cost RHEL program).


    You can choose 3 methods to register your RHEL 9 system to Red Hat and you have
    to do it during setup or after completing the installation. Let us go through
    each option:


    +   - Registering through Anaconda: During the installation setup from Anaconda,
    select Connect to Red Hat. Use your Red Hat credentials to register your RHEL
    9 system. You can also put information on the purpose of your RHEL 9 system by
    marking Set System Purpose and selecting the following:


    +   - Role: The role of the RHEL 9 system you are registering.


    +   - SLA: Depending on your subscription, it can be Premium (24x7), Standard
    (8x5), or Self-Support.


    +   - Usage: You can tag your RHEL 9 system as Production, Compute Node, or for
    Development/Test.'
