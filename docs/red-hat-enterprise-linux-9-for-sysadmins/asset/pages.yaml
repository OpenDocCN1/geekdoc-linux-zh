  md: '# # CHAPTER 1


    # # Introducing Red Hat Linux 9


    # ## Introduction


    Welcome to **Red Hat Enterprise Linux (RHEL)** 9 for SysAdmins!


    This chapter gives you a brief introduction to RHEL 9 — what it is, why it was
    created, what is its intended purpose, and who is the target audience for this
    book. You will also learn where to gather additional information on RHEL 9 outside
    the scope of this book, as well as other Linux distributions that have deep ties
    with RHEL 9 and known derivatives and alternatives that you might want to consider
    if you are seeking to experience the cutting edge of open-source Linux distributions
    and software. So, with that, let us begin.


    # ## Structure


    In this chapter, we will discuss the following topics:


    +   * Understanding Red Hat Enterprise Linux


    +   * Getting additional information on RHEL


    +   * Alternatives to RHEL'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Objectives


    By the end of this chapter, you will understand what RHEL is and its history,
    along with learning how Red Hat became one of the biggest names in the IT industry.
    This chapter will also build up the skills required for your day-to-day tasks
    in managing a RHEL 9 environment like getting up-to-date information about RHEL
    9, and browsing through some alternative platforms that have close ties to RHEL
    9.


    With the objectives set in place, let us start learning.


    # Understanding Red Hat Enterprise Linux


    RHEL, a commercial Linux distribution developed and distributed by Red Hat specifically
    for the enterprise. By enterprise, we mean that Red Hat provides commercial support
    for the use of RHEL throughout its supportive lifecycle. While RHEL is considered
    a commercial Linux distribution, it is open-source, which means Red Hat provides
    RHEL to users and grants the rights to use the software, inspect and study the
    source code of the software, make modifications to the source code, and distribute
    the modified made. This open-source model of software development promotes collaboration,
    transparency, and sharing. Many of today’s software development practices are
    based on the open-source model and released under various licenses compatible
    with the said model.


    RHEL 9 was officially announced at the Red Hat Summit on May 10, 2022, with the
    theme, Delivering Hybrid cloud innovation from the Datacenter to the Edge. RHEL
    9 was assigned the codename Plow, released to the public on May 17, 2022, and
    shipped with the Linux kernel 5.14.0 among the GNOME 40 desktop environment. Supported
    architectures include:


    +   - AMD and Intel 64-bit architectures (x86-64-v2)

    - 64-bit ARM architecture (ARMv8.0-A)

    - IBM Power Systems little-endian (POWER9)

    - 64-bit IBM Z and IBM LinuxONE


    RHEL 9, along with succeeding versions in the series (9.x), are shipped with a
    10-year lifecycle support. That we expect the RHEL 9.x series to be officially
    supported until May 2032. As of this writing, the latest edition of RHEL 9 is
    version 9.4, was released on April 30, 2024, with updated software packages along
    the Linux kernel with support to the hardware architectures listed from the previous
    paragraph. Succeeding versions of RHEL 9 from 9.1 to 9.10 are considered minor
    releases with various level of support policies.


    Other versions of RHEL still being supported and maintained by Red Hat include
    the following:'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Introducing Red Hat Enterprise Linux 9


    +   - RHEL 8 (codename Ootpa), was released in May 2019, and supported until May
    2029


    +   - RHEL 7 (codename Maipo), was released in June 2014, and supported until
    June 2024


    RHEL prior to RHEL 7 have either retired or are currently about to end their Extended
    lifecycle support. We will discuss more about the RHEL lifecycle support in detail
    in *Chapter 5, Managing RHEL 9 Subscriptions.*


    While RHEL 9 is provided as open-source software, Red Hat holds the trademark
    to its brand, logo, and related properties. These trademarked assets do not fall
    under the open-source licenses that RHEL 9 source code gets distributed and cannot
    be re-modified, nor distributed due to their intellectual property and trademarks
    applied. However, for the rest of what RHEL 9 provides as open-source, it is fair
    game and there are other Linux distributions that have used and exercised the
    freedoms that open-source software provides such as CentOS and Rocky Linux. These
    RHEL based distributions have proven to be viable alternatives to RHEL for workloads
    and use cases that do not require the enterprise-grade support that Red Hat provides
    for RHEL. We will discuss more about these alternatives in the later part of this
    chapter.


    # Who is Red Hat?


    RHEL is no doubt, a great product, but exactly who is Red Hat, the company that
    created it, and how did it get started? RHEL got its beginnings from 1994 when
    Marc Ewing, an engineer, started the Red Hat Linux Project. It was called Red
    Hat because Marc was known to wear a red hat while attending at the Carnegie Mellon
    University (CMU). Red Hat Linux was distributed and up for sale as *compact discs
    (CDs)*, which prompted Bob Young, a budding software entrepreneur, to buy much
    of the CDs in bulk and sell them on retail. This proved to be a lucrative business
    venture for both. In 1995, the two combined forces formed Red Hat Software with
    Young as the CEO.


    Red Hat Linux became so successful in the market that it became a formidable challenger
    to the operating system business which was then dominated by Microsoft with its
    Windows operating system that spanned across desktop and server environments.
    It was also when the internet started to become more pervasive globally, and this
    contributed to the adoption growth of Linux with Red Hat becoming the facto facto
    favored among corporate and enterprise organizations on running their platforms
    and systems online. Beyond the boxed Red Hat Linux distribution business, the
    Red Hat brand was popular on merchandise, with T-shirts, stickers, caps, and even
    fedoras! Red Hat continues this tradition of selling merchandise today through
    the Red Hat Cool Stuff Store. You can check out the Red Hat Cool Store at https://coolstuff.redhat.com/.
    From the store, you can browse through and order various Red Hat branded merchandise
    like shirts, caps, bags, stickers, mugs, and other desktop toys!'
  merge: -1
  img_proc: true
