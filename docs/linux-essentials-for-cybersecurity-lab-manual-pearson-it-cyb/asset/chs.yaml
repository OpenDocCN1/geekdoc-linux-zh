  ## 第 20 章 网络服务配置：基本服务


  这些实验应该在你在第 1 章“发行版与关键组件](#ch01.xhtml)”中安装的 CentOS 操作系统上进行。在开始这些实验之前，请登录你在安装过程中创建的学生账户。


  ### 实验 20.1 配置 BIND 服务器


  注意


  创建一个完整的 BIND 服务器超出了本书的讨论范围。在本实验中，你将创建并探索纯缓存服务器的组件。纯缓存服务器应仅供本地系统使用。


  第 1 步 打开一个终端窗口。


  第 2 步 使用 `su` 命令切换到 root 账户。


  第 3 步 运行 `yum` 命令安装 `bind` 和 `bind-utils` 软件包。


  第 4 步 编辑 `/etc/named.conf` 文件，使其内容如下：


  点击此处查看代码图片


  ```

  listen-on port 53 { 127.0.0.1; any; };

  allow-query     { localhost; any; };

  allow-query-cache       { localhost; any; };

  ```


  第 5 步 测试 `/etc/named.conf` 文件的语法。


  第 6 步 重启 `named` 服务。


  第 7 步 检查 `named` 服务的状态。


  第 8 步 启用 `named` 服务。


  第 9 步 执行以下命令以确保你的防火墙允许 DNS 查询：


  点击此处查看代码图片


  ```

  firewall-cmd --add-port=53/udp

  firewall-cmd --add-port=53/udp --permanent

  ```


  第 10 步 通过执行以下命令测试服务：


  点击此处查看代码图片


  ```

  dig @localhost onecoursesource.com +trace

  ```


  ### 实验 20.2 配置 Postfix 服务器


  第 1 步 打开一个终端窗口。


  第 2 步 使用 `su` 命令切换到 root 账户。


  第 3 步 查看 `Postconf` 中 `inet_interfaces` 设置的当前值。


  第 4 步 将 `inet_interfaces` 设置的值更改为 `all`。


  第 5 步 将 `myhost` 设置的值更改为 `testserv`。


  第 6 步 创建一个邮件别名，以便发送给 root 用户的邮件发送给学生用户。


  第 7 步 执行正确的命令将更改保存到 `/etc/alias` 文件到 Postfix 数据库。


