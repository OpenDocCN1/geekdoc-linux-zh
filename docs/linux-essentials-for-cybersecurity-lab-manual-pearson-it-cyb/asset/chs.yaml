  ## 第 8 章 开发账户策略


  这些实验应该在你在第 1 章 的“发行版与关键组件](#ch01.xhtml)”中安装的 Kali 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


  ### 实验 8.1 测试账户安全性


  *场景：* 创建五个账户，每个账户设置一个不同的密码。让某些密码非常简单（例如单词），另一些复杂。然后对这些新账户运行工具，查看哪些密码被破解了。


  ### 实验 8.2 开发账户策略


  本实验没有特定的正确答案。目标是根据《网络安全 Linux 基础》第 6、7 和 8 章的内容为用户和组账户制定安全策略。


  作为起点，你可以利用位于 `www.sans.org/security-resources/policies) 处的一些优秀示例策略。你可能会发现该网站上的某些策略非常有用，有些是针对账户的。例如，有一个名为“密码保护”的策略。虽然你可以利用该网站的一些策略并参考其格式，但你还应该包含自己的原创内容。


  # 第三部分 文件与数据存储


  ## 第 9 章 文件权限


  这些实验应该在你在[第 1 章` 的“发行版与关键组件](#ch01.xhtml)”中安装的 CentOS 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


  ### 实验 9.1 管理文件权限


  第 1 步。打开终端窗口。


  第 2 步。执行正确的命令显示 `/etc/chrony.keys` 文件的权限。


  第 3 步。根据第 2 步命令的输出，谁是 `/etc/chrony.keys` 的所有？


  第 4 步。根据第 2 步命令的输出，`/etc/chrony.keys` 属于哪个组？


  第 5 步。执行 `more/etc/chrony.keys` 命令，然后解释该命令为何失败。


  第 6 步。使用 `su` 命令切换到 root 账户。





  ### 步骤 7. 执行正确的命令将学生用户添加到 chrony 组。


  ### 步骤 8. 退出系统。（注意，这对于组所有权的生效是必须的。）


  ### 步骤 9. 以学生用户的身份登录。


  ### 步骤 10. 打开终端窗口。


  ### 步骤 11. 执行正确的命令显示当前用户所属的组。


  ### 步骤 12. 执行 `/more/etc/chrony.keys` 命令以验证学生用户现在可以显示该文件的内容。


  ### 步骤 13. 将 `/etc/chrony.keys` 文件复制到当前目录（学生用户的家目录）。


  ### 步骤 14. 使用八进制法，将当前目录下 `chrony.keys` 文件的权限更改为 `-r---------`。


  ### 步骤 15. 使用符号法，将当前目录下 `chrony.keys` 文件的权限更改为允许组成员读取权限。


  ### 步骤 16. 使用八进制法，尝试将 `/etc` 目录下 `chrony.keys` 文件的权限更改为 `-r---------`。解释为什么该命令失败了。


  ### 步骤 17. 更改当前 shell 的掩码值，使任何新目录具有以下权限：`drwxr-x---`


  ### 步骤 18. 根据步骤 17 中的掩码值，在此 shell 中创建的所有文件将具有什么权限？


  ### 实验 9.2 管理特殊权限


  *场景 1：* 你担心该系统上的 SUID 权限。首先运行命令找到所有设置了 SUID 权限的文件。然后修改 `newgrp` 命令，使其不再是 SUID 文件。


  *场景 2：* 三个用户需要在系统上共享文件，但其他用户都不能访问这些文件。为 `sophia`、`olivia` 和 `emma` 创建用户账户，使用账户参数的默认值。创建一个名为
  `shared` 的公共组，用于允许这三个用户相互共享文件。最后，创建一个名为 `/home/shared` 的目录，仅允许这三个用户访问，并自动将所有新文件的组所有权赋予
  `shared` 组。


  *场景 3：* 创建一个名为 `/data` 的目录，所有用户都其中添加文件与他人共享。该目录应只允许文件的所有者（以及 root 用户）删除文件。


  ### 实验 9.3 启用访问控制列表（ACL）


  步骤 1. 打开终端窗口。


  步骤 2. 将 `/etc/hosts` 文件复制到学生用户的家目录。


  步骤 3. 为 `games` 组设置访问控制列表 (ACL)，允许该组对 `hosts` 文件具有读取写权限。


  步骤 4. 显示 `hosts` 文件的 ACL。


  步骤 5. 将 `hosts` 文件的 ACL 掩码值更改为只读。


  步骤 6. 显示 `hosts` 文件的 ACL 以验证 ACL 掩码。


  步骤 7. 创建名为 `test_acl` 的目录。


  步骤 8. 为 `test_acl` 目录创建默认 ACL，使 `adm` 用户对 `test_acl` 目录下创建的所有新文件和目录具有读写权限。


  步骤 9. 使用 `touch` 命令在 `test_acl` 目录中创建一个名为 `test_file` 的新文件。


  步骤 10. 通过查看 `test_file` 文件的 ACL 验证默认 ACL。


  ### 实验 9.4 管理文件所有权和属性


  步骤 1. 打开终端窗口。


  步骤 2. 使用 `su` 命令切换到 root 账户。


  步骤 3. 将 `/etc/group` 文件复制到 `/tmp` 目录。


  步骤 4. 将 `/tmp/group` 文件的所有者更改为学生用户。


  步骤 5. 将 `/tmp/group` 文件的组所有权更改为 `bin` 组。


  步骤 6. 将 `/tmp/group` 文件设置为不可变（immutable）。


  步骤 7. 运行正确的命令显示 `/tmp/group` 文件的属性。


  步骤 8. 尝试删除 `/tmp/group` 文件。解释为什么失败了。


  步骤 9. Remove `/tmp/group` 文件的不可变属性。


  步骤 10. 删除 `/tmp/group` 文件。


  ### 实验 9.5 使用 SELinux 监控安全问题


  步骤 1. 打开终端窗口。


  步骤 2. 使用 `su` 命令切换到 root 账户。


  步骤 3. 执行正确的命令确定 SELinux 当前处于什么模式（强制 enforcing 或 宽容 permissive）。


  注意

  CentOS 通常默认为强制模式。


  步骤 4. 将当前模式更改为宽容模式。


  步骤 5. 显示 SELinux 状态。


  注意

  SELinux 阻止访问文件，这与文件属性类似。


  ## 第 10 章 管理本地存储：基础


  这些实验应在你安装的操作系统上进行。在开始这些实验之前，登录你安装的的账户。


  ### 实验 10.1 创建分区和文件系统


  步骤 1. 打开终端窗口。


  步骤 2. 使用 `su` 命令切换到 root 账户。


  步骤 3. 执行 `ls /dev**` 命令查看当前分区。应该是 `sda1` 和 `sda2`。


  步骤 4. 执行 `shutdown` 命令关闭系统。


  步骤 5. 在 VirtualBox 中，右键点击 `CENTOS 7` 虚拟机并点击“设置”。


  步骤 6. 点击“存储”，然后点击“控制器: SATA”。


  步骤 7. 点击“添加硬盘”图标并点击“创建新硬盘”。


  步骤 8. 在“创建新硬盘”对话框中，点击“下一步”。


  步骤 9. 在第二个框中，点击“创建”。


  步骤 10. 点击“确定”按钮关闭“设置”窗口。你现在有了另一个硬盘。


  步骤 11. 双击 `CENTOS 7` 虚拟机启动虚拟机。


  步骤 12. 启动过程完成后，以学生用户身份登录。


  步骤 13. 打开终端窗口。


  步骤 14. 使用 `su` 命令切换到 root 账户。


  步骤 15. 执行 `ls /dev**` 命令查看新硬盘。新设备是 `/dev/sdb`。


  步骤 16. 执行正确的 `fdisk` 命令显示 `/dev/sda` 的分区表（应显示两个分区）。


  步骤 17. 执行正确的 `fdisk` 命令显示 `/dev/sdb` 的分区表（其中一个是空的）。


  步骤 18. 使用 `fdisk` 命令在 `/dev/sdb` 设备上创建一个主分区。该新分区的大小应为 25MB。


  步骤 19. 在 `/dev/sdb1` 分区创建一个 ext4 文件系统。


  步骤 20. 创建名为 `/repo` 的目录并将 `/dev/sdb1` 分区挂载到该目录下。


  注意

  不要破坏此分区。你将在下一个实验中使用它。


  ### 实验 10.2 启动时挂载文件系统


  *场景：*你现在有一个挂载到 `/repo` 的 ext4 文件系统（*/dev/sdb1*）。配置系统，使该分区在启动过程中能够自动挂载。使用以下参数：


  *   为文件系统分配标签 `repo`。使用标签而非设备名称执行挂载。


  *   对于挂载选项，在该文件系统上不允许 SUID 程序。


  *   对于 FSCK 检查，使用值 `1`。


  *   对于 dump 级别，使用值 `0`。






  为此自动挂载配置系统，并在重启系统之前测试挂载。


  #### 注意事项


  不要破坏此分区。你将在下一次实验中使用它。


  ### 实验 10.3 管理交换设备


  *场景：* 创建两个新的交换设备。其中一个交换设备应是一个名为 `/var/swapfile` 的 50MB 文件。另一个交换设备应是一个大小为 50MB 的交换分区（`/dev/sdb2`）。这些交换设备应该在每次启动过程中自动启用。（为此项项操作，请使用该分区的
  `UUID`。）


  ## 第 11 章 管理本地存储：高级功能


  这些实验应该在第 1 章 中的“发行版和核心组件””中安装的 CentOS 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


  ### 实验 11.1 管理加密文件系统


  **场景：** 在实验 10.1 中，你创建了一个挂载在 `/repo` 目录下的分区。更改此分区，使其拥有加密文件系统。请注意，CentOS 不需要加载 `aes`
  和 `sha256` 模块。


  完成此实验后，你可以删除添加到 `/etc/fstab` 文件中的那行，因为你将在后的任何实验中不再使用该分区。


  ### 实验 11.2 配置逻辑卷


  **场景：** 向你的系统添加三个新的 50MB 虚拟硬盘，以模拟一台拥有三块新硬盘的服务器。使用实验 10.1 提供的技术在 Oracle VM VirtualBox
  Manager 程序中创建这些新硬盘。然后，使用这三块硬盘创建一个名为 `VG1` 的新卷组。使用 `VG1` 卷组创建两个逻辑卷：一个名为 `lv0` 且大小为
  20MB 的逻辑卷，以及一个名为 `lv1` 且使用 `VG1` 剩余可用空间的逻辑卷。为每个新的逻辑卷创建文件系统，创建挂载点（`/lv0` 和 `/lv1`），并配置系统在启动过程中挂载这些新的逻辑卷。


  ### 实验 11.3 管理磁盘配额


  **场景：** 在挂载在 `/lv1` 挂载点的文件系统上实现磁盘配额。限制条件应适用于学生用户。为该用户账户设置 10MB 文件空间和 100 个文件的硬限制。同时创建一个
  8MB 和 80 个文件的软限制。


  ### 实验 11.4 管理硬链接和软链接


  第 1 步。打开终端窗口。


  第 2 步。使用 `su` 命令切换到 root 账户。


  第 3 步。使用 `ls` 和 `grep` 命令显示 `/var` 目录下的所有软链接。


  第 4 步创建一个从名为 `/root/info` 的文件到 `/etc/passwd` 文件的软链接。


  第 5 步执行正确的命令显示你在第 4 步中创建的软链接。


  第 6 步执行正确的命令显示 `/usr/bin/c2ph` 文件的硬链接数量。


  第 7 步执行正确的命令显示 `/usr/bin/c2ph` 文件的 inode 码。


  第 8 步执行正确的命令找到所有与 `/usr/bin/c2ph` 文件建立硬链接的文件。


  ## 第 12 章 管理网络存储


  这些实验应该在第 1 章中的“发行版和核心组件””中安装的 CentOS 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


  #### 注意事项


  理想情况下，你应该两个系统来运行基于网络的实验。然而，这种设置需要额外的内存和更快的 CPU。为了避免对系统产生过多的硬件要求，本实验让你运行一个同时充当服务器和客户端的单一虚拟机。


  ### 实验 12.1 配置 Samba


  第 1 步。打开终端窗口。


  第 2 步。使用 `su` 命令切换到 root 用户。


  第 3 步。使用 `yum` 命令安装 `samba` 包。


  第 4 步。使用 `vim` 命令编辑 Samba 服务器的配置文件。


  第 5 步为 `/usr/bin` 目录添加一个名为 `commands` 的共享。这应该是一个可浏览的只读共享。


  第 6 步执行正确的命令检查 Samba 服务器配置文件的语法和格式。


  第 7 步执行以下命令启动 Samba 服务并确保它们在启动时自动启动：


  ```

  systemctl enable smb

  systemctl enable nmb

  systemctl start smb

  systemctl start nmb

  ```


  第 8 步。为学生用户创建一个 Samba 账户。提供一个自定义的密码。


  第 9 步。使用学生 Samba 账户显示本地的 Samba 服务器共享（使用 `localhost` 或 `127.0.0.1` 作为服务器名称或 IP 地址）。


  第 10 步。使用 `smbclient` 命令连接到 Samba `commands` 共享。


  第 11 步。在 `smb` 提示符下列出共享的文件。


  第 12 步。退出 `smbclient` 工具。


  第 13 步。创建一个名为 `commands` 的目录。


  第 14 步。使用学生账户在 `/commands` 目录下挂载 Samba `commands` 共享。


  第 15 步。列出 `/commands` 目录下的文件以验证。


  第 16 步。卸载 Samba 共享。


  #### 注意事项


  CentOS 7 使用 NFS 4，它不使用 `portmap`。


  *场景：*为 `/usr/bin` 创建一个 NFS 共享。该共享应该是对所有机器可读的。通过挂载 12.1 中创建的 `commands` 目录进行本地测试。


  ### 实验 12.2 管理 NFS


  注意


  完成后，卸载资源。


  ### 实验 12.3 管理 iSCSI


  第 1 步。打开终端窗口。


  第 2 步。使用 `su` 命令切换到 root 用户。


  第 3 步。使用以下 `yum` 命令安装创建 iSCSI 所需的包：


  ```

  yum install epel-release

  yum install scsi-target-utils

  ```


  第 4 步。为了将 10.1 中创建的 `/dev/sdb1` 分区用于 iSCSI 目标，从卸载分区开始。


  第 5 步。接下来，删除 `/etc/fstab` 中自动挂载该设备的行。


  第 6 步。在 `/etc/tgt/targets.conf` 中添加正确的条目，使用 IP 地址 `127.0.0.1` 共享 `/dev/sdb1` 设备。


  允许的初始化器使用。


  第 7 步。通过执行以下命令启动并启用 `tgtd` 守护进程：


  ```

  systemctl enable tgtd

  systemctl start tgtd

  ```


  第 8 步。执行正确的命令验证该目标已启用。


  第 9 步。执行正确的命令显示 IP 地址为 `127.0.0.1` 的 iSCSI 服务器提供的目标。


  注意


  由于在同一系统上运行 iSCSI 目标和初始化可能会导致问题，本实验到此为止。请查阅 *Linux Essentials for Cybersecurity*
  第 12 章，了解使用此 iSCSI 设备所需的步骤。


  ## 第 13 章 制定存储安全策略


  这些实验应该在第 1 章中的“发行版和核心组件””中安装的 CentOS 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


  ### 实验 13.1 备份文件系统


  第 1 步。打开终端窗口。


  第 2 步。使用 `su` 命令切换到 root 用户。


  第 3 步。将 `/etc/X11` 目录的内容备份到名为 `/tmp/X11.tar` 的 tar 文件中。


  第 4 步。列出 `/tmp/X11.tar` 文件的内容，包括详细信息（例如使用详细模式）。


  第 5 步。移动到 `/tmp` 目录。






  第 6 步。将 `X11.tar` 文件的内容提取到当前目录。


  第 7 步。使用 `gzip` 压缩选项将 `/etc/X11` 目录的内容备份为名为 `/tmp/X11.tar.gz` 的压缩 tar 文件。


  第 8 步。执行正确的命令，以便查看并比较两个 tar 文件的大小。


  ### 实验 13.2 开发备份安全策略


  本实验没有特定的标准答案。你的目标是利用你在**《网络安全的 Linux 基础》**一书第 9 章](#ch09.xhtml)、第 10 章](#ch10.xhtml)、第
  11 章](#ch11.xhtml)和第 12 章](#ch12.xhtml)中学到的知识，制定用于数据备份的安全策略。


  作为一个起点，你可以利用 [`www.sans.org/security-resources/policies`](https://www.sans.org/security-resources/policies)
  提供的某些优秀示例安全策略。你可能会发现该网站的一些策略非常有用，因为其中某些是针对账户的。例如，有一个名为“灾难恢复计划策略”的示例策略。虽然你可以使用该网站的一些策略并参考其格式，但你也应该根据你在**《网络安全的
  Linux 基础》**一书第 9 章](#ch09.xhtml)、第 10 章](#ch10.xhtml)、第 11 章](#ch11.xhtml)和第 12
  章](#ch12.xhtml)中学到的知识，创建原创的内容。


  # 第四部分 自动化


  ## 第 14 章 Crontab 和 At


  这些实验应该在第 1 章](#ch01.xhtml)“发行版与关键组件](#ch01.xhtml)”中安装的 Ubuntu 系统上进行。在开始此实验之前，请登录在安装过程中创建的学生账户。


  ### 实验 14.1 管理 crontab


  第 1 步。打开终端窗口。


  第 2 步。执行允许你编辑当前用户 `crontab` 文件的命令。


  第 3 步。进入编辑器后，添加一个 `crontab` 条目，该条目每个工作日（周一至周五）下午 5:50 运行 `who` 命令，并将命令输出发送到 `/home/student/who-there`
  文件。


  第 4 步。保存更改并退出编辑器。


  第 5 步。执行允许你查看当前用户 `crontab` 文件的命令。


  第 6 步。使用 `su` 命令切换到 root 账户。


  第 7 步。执行允许你查看学生用户 `crontab` 文件的命令。


  第 8 步。修改系统，使学生用户不再可以使用 `crontab` 命令。


  第 9 步。执行返回学生账户的命令。


  第 10 步。执行允许你查看当前用户 `crontab` 文件的命令。注意，由于你在第 8 步的操作，此命令应该失败。


  第 11 步。使用 `su` 命令切换到 root 账户。


  第 12 步。执行允许你查看学生用户 `crontab` 文件的命令（并阅读解释命令失败的消息）。注意，虽然学生用户不再能执行 `crontab` 命令，但该用户之前的
  `crontab` 条目仍然存在。


  第 13 步。执行查看 `/var/spool/cron/crontabs/student` 文件的命令。注意，当学生用户仍可访问 `crontab` 命令时，此命令的输出与
  `crontab -l -u student` 相同。这是因为该文件存储学生用户 `crontab` 文件的地方。


  第 14 步。删除 `/var/spool/cron/crontabs/student` 文件，然后使用 `systemctl restart cron` 命令重启
  crontab 服务。


  第 15 步。查看主系统级 `crontab` 文件。你不会对此文件进行更改，但根据文件中看到的内容，描述所执行的任务。


  第 16 步。执行正确的命令，查看系统 `crontab` 每天执行一次的命令。


  第 17 步。执行正确的命令，显示存放*额外*系统 `crontab` 条目的目录内容。


  ### 实验 14.2 配置 at 命令


  第 1 步。打开终端窗口。


  第 2 步。使用 `at` 命令在明天下午 2 执行一个命令。你将删除此 `at` 任务，因此实际命令并不重要。例如，你可以执行 `ls` 命令。


  第 3 步。列出当前用户的 `at` 任务。


  第 4 步。删除你在第 2 步中创建的 `at` 任务。


  ## 第 15 章 脚本


  这些实验应该在第 1 章](#ch01.xhtml)“发行版与关键组件](#ch01.xhtml)”中安装的 Ubuntu 系统上进行。在开始此实验之前，请登录在安装过程中创建的学生账户。


  注意


  在查看本章的实验答案时，请记住在编写程序时，并没有唯一的正确答案。如果你的程序实现了场景的目标，你就已经完成了任务。


  ### 实验 15.1 脚本项目 #1


  **场景**：在某些情况下，不熟悉 Linux 的人们需要运行特定的命令。为了方便，你可以创建一个菜单驱动程序。


  对于此场景，创建一个具有以下选项的菜单驱动程序：


  1. 列出登录的用户（使用 `who` 命令）

  2. 显示系统信息（使用 `uname -v`）

  3. 列出当前目录下最大的五个文件（使用 `ls -lS`）

  4. 列出基本 CPU 信息（使用 `lscpu | head`）

  5. 显示系统时间（使用 `date`）

  6. 退出程序


  程序应持续循环，直到用户选择 6。如果选择了无效选项，程序还应产生错误消息。


  ### 实验 15.2 脚本项目 #2


  **场景**：通常脚本面临的最大挑战之一是验证用户输入。即使是确保输入有效的整数这种简单事情也会导致大量的代码。


  对于此场景，创建一个验证用户输入的程序，使其只允许输入整数（全数），无论正负。


  ## 第 16 章 常见自动化任务


  这些实验应该在第 1 章](#ch01.xhtml)“发行版与关键组件](#ch01.xhtml)”中安装的 Ubuntu 系统上进行。在开始此实验之前，请登录在安装过程中创建的学生账户。


  ### 实验 16.1 脚本项目 #3


  **场景**：手动进行系统检查非常耗时，且该过程经常被忽略。对于此场景，创建一个 shell 脚本，在整个系统中搜索以下文件：


  *   SUID 文件

  *   SGID 文件（非目录）

  *   对“其他”用户具有写权限的文件和目录，不包括符号链接。


  此脚本应在 `/var/reports` 目录下创建一个报告。报告应包含所有上述文件，文件名应为 `file-report-*`，其中 `*` 被替换为当前系统日期。


  以 root 用户身份测试脚本，然后通过在 `/etc/cron.d` 目录添加文件，使该脚本每天凌晨 3:15 运行。


  ### 实验 16.2 脚本项目 #4






  **场景：** 组织中的用户抱怨说，当他们需要恢复备份文件时，IT 支持花费了太长时间。他们希望在不小心删除文件时能够自行恢复。针对这种情况有几种可能的解决方案，包括一个名为“备份快照”的功能，你有机会可以研究一下。但是，由于该系统上的人数很少，一个简单的脚本应该就能运行。


  创建一个脚本，以 `tar` 格式备份每个用户主目录（除“root”用户外）的所有文件。这些备份应存放在名为 `/var/backups/*username*`
  的目录中，其中 `*username*` 替换为用户名。


  #### 注意事项


  请考虑你可能需要创建 `/var/backups/username` 目录，并且该目录应该由一个权限为 `rwx------` 的用户所有。此外，每个备份文件的文件名应包含备份日期，并由一个权限为
  `rw-------` 的用户所有。


  修改系统 `crontab` 以每周运行一次此命令。


  # 第 17 章 开发自动化安全策略


  这些实验应该在你在 第 1 章“发行版和关键组件”中安装的 Ubuntu 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


  ### 实验 17.1 加固 `crontab` 和 `at`


  *场景：* 根据《网络安全 Linux 基础》中的建议，确保所有 `cron` 和 `at` 文件的权限尽可能严格。


  *异常情况：* 如果你在 Ubuntu 上更改了 `/var/spool/cron` 和 `/var/spool/at` 的权限，普通用户将无法使用相应的对应命令（`crontab`
  和 `at`）。更改这些权限并以学生用户身份测试，然后将权限改回原始设置。


  ### 实验 17.2 创建自动化安全策略


  本实验没有特定的标准答案。目标是利用你在《网络安全 Linux 基础第 14 章、第 15 章和第 16 章中中学到的知识，为用户和组账户制定安全策略。


  作为一个起点，你可以利用位于 [`www.sans.org/security-resources/policies`](https://www.sans.org/security-resources/policies)
  的一些优秀的示例安全策略。注意，你可能会发现该网站上的某些策略非常有用，因为某些是针对账户的。虽然你可以利用网站上的某些策略并参考其格式，但你也应该根据你在《网络安全
  Linux 基础第 14 章、第 15 章和第 16 章中学到的知识，创建原创内容。


