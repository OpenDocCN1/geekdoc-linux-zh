  ## 第 19 章 网络配置


  这些实验应该在你在 第 1 章“发行版和关键组件”中安装的 CentOS 和 Ubuntu 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。第一个实验
  (19.1) 应在 CentOS 上执行，第二个实验 (19.2) 应在 Ubuntu 上执行。


  ### 实验 19.1 在 CentOS 上理解网络配置


  为了帮助避免破坏网络，本实验侧重于查看信息而非进行永久更改。


  1. 在 CentOS 上打开终端窗口。

  2. 使用 `ifconfig` 命令显示网络配置。

  3. 使用 `nmcli` 命令确定网络管理器是否激活。

  4. 使用 `arp` 命令显示 ARP 表。

  5. 使用 `route` 命令显示路由表。

  6. 使用 `route` 命令为 `192.168.145.0/24` 网络添加新路由，网关为 `192.168.0.99`。

  7. 使用 `route` 命令显示新的路由表。

  8. 显示主机名。

  9. 将主机名改为 `mymachine`。

  10. 使用 `host` 命令对 `ubuntu.com` 进行 DNS 查询。

  11. 使用 `dig` 命令对 `ubuntu.com` 进行 DNS 查询。

  12. 使用 `netstat` 命令显示 TCP 信息。

  13. 使用 `netstat` 命令显示路由表。

  14. 使用 `cat` 命令显示包含主机名的文件内容。

  15. 使用 `cat` 命令显示包含主机到 IP 地址转换的文件内容。

  16. 使用 `cat` 命令显示包含系统 DNS 服务器的文件内容。

  17. 使用 `cat` 命令显示决定系统是否默认开启网络的文件内容。

  18. 使用 `cat` 命令显示包含 `eth0` 设备设置的文件（如果你在虚拟机上操作，则为 `emp0s3`）。

  19. 重启系统将所有网络设置还原为原始。


