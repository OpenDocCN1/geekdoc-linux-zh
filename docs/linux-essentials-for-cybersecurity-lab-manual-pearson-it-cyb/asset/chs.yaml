  # 第 VI 部分 进程与日志管理


  ## 第 24 章 进程控制


  ### 实验 24.1 管理系统进程


  第 1 步 打开一个终端窗口。


  第 2 步 列出当前 shell 中运行的进程。


  第 3 步 列出系统上运行的所有进程。


  第 4 步 使用 `grep` 和 `ps` 命令列出系统中所有以 *sh* 结尾的进程。


  第 5 步 使用 `pgrep` 命令列出系统中所有以 *sh* 结尾的进程。


  第 6 步 使用 `top` 命令显示所有运行的进程。（在接下来的步骤中保持此命令运行。）






  第 7 步。在 `top` 命令运行时，显示帮助屏幕。


  第 8 步在 `top` 命令运行时，将刷新周期从 2 秒更改为 5 秒。


  第 9 步退出 `top` 命令。


  第 10 步在后台执行 `gnome-calculator` 程序。


  第 11 步在当前 shell 中，列出所有运行中的作业。


  第 12 步使用 `kill` 命令配合 `gnome-calculator` 程序的作业号停止（杀死）该程序。


  第 13 步在后台执行 5 次 `gnome-calculator` 程序。


  第 14 步使用 `killall` 命令停止（杀死）所有的 `gnome-calculator` 程序实例。


  第 15 步在后台执行 `gnome-calculator` 程序。


  第 16 步在当前 shell 中，使用 `ps` 命令列出所有运行的进程。


  第 17 步将 `gnome-calculator` 程序的优先级更改为 nice 值 15。


  ### 实验 24.2 显示系统信息


  第 1 步。打开终端窗口。


  第 2 步。执行显示系统已运行时间的命令。


  第 3 步。执行 `uptime` 命令，使输出采用“美化”（pretty）格式。


  第 4 步。执行显示可用内存和交换空间量的命令。


  第 5 步。执行 `free` 命令，使输出以兆字节为单位。


  第 6 步。执行 `free` 命令，使输出每 2 秒更新一次。


  第 7 步。执行 `free` 命令，使输出显示每列的总计。


  ## 第 25 章 系统日志


  这些实验应该在你在第 1 章“发行版和关键组件”中安装的 CentOS 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


  ### 实验 25.1 管理日志文件


  **场景：** 修改 CentOS 系统以使以下日志事件发生：


  *   所有 `debug` 级别的 `cron` 消息应发送到 `/var/log/cron.debug` 文件。


  *   所有来自 `local3` 服务的消息应发送到 root 用户的终端。


  验证这些更改已正确生效。


  ### 实验 25.2 配置日志轮转


  **场景：** 修改 CentOS 系统以使以下情况发生：


  *   默认情况下，日志文件应每天进行轮转。


  *   默认情况下，应保留 10 份轮转后的日志文件备份。


  *   默认情况下，已轮过的日志文件应被压缩。


  *   所有 CUPS 日志文件应每周轮转一次，且仅保留 4 份备份。


