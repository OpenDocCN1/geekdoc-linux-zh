    第 15 步。重新发送第 14 步中的广播消息，但不显示横幅信息。


    第 16 步。回到你在第 7 步中打开的另一个终端窗口，并停止显示 wall 消息。


    第 17 步。在以 root 用户身份登录的终端窗口中，发布 `shutdown` 命令，但使用一个不会实际导致系统关机的选项。


    # 第二部分 用户和组账户


    ## 第 6 章 管理组账户


    这些实验应该在你在第 1 章 的“发行版与关键组件](#ch01.xhtml)”中安装的 Ubuntu 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 6.1 管理组账户


    第 1 步。打开终端窗口。


    第 2 步。显示当前用户的 ID 和组成员身份。


    第 3 步。显示 root 账户的组成员身份。


    第 4 步。运行正确的命令确定 `/etc/group` 文件的所有者和所属组。


    第 5 步。显示 games 组的账户信息。


    第 6 步。显示 games 组的密码信息。


    第 7 步。运行后续命令 `su -` 切换到 root 账户（提示 root root root ）。


    第 8 步。创建一个名为 `test` 的新组。


    第 9 步。显示 test 组的账户信息。


    第 10 步。将 test 组的组名改为 `newtest`。


    第 11 步。将学生账户作为 `newtest` 组的辅助成员添加，而不覆盖该用户的当前组成员身份。


    ### 实验 6.2 管理组管理员


    *场景：* 在此实验中，你将被要求提供“目标”，而不是被具体告知要采取哪些步骤。根据你对该主题所学的知识来实现最终结果。创建一个名为 `eng` 的新组并将学生用户添加到该组。使学生用户成为组管理员。为了测试这一点，在以学生用户登录时，将
    `bin` 用户添加到 `eng` 组，然后验证这一新的组成员身份。


    ## 第 7 章 管理用户账户


    这些实验应该在你在第 1 章 的“发行版与关键组件](#ch01.xhtml)”中安装的 Ubuntu 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 7.1 管理用户账户


    第 1 步。打开终端窗口。


    第 2 步。执行正确的命令显示 `bin` 账户的用户账户信息（包括登录 shell 和家目录）。


    第 3 步。执行正确的命令显示 `bin` 账户的用户密码信息（包括加密密码和密码过期时间）。


    第 4 步。第 3 步中的命令应该执行失败。执行正确的 `su` 命令更改你的账户，以便第 3 步的命令在执行时能够成功。


    第 5 步。创建一个名为 `jake` 的新用户，并显式使用选项为该用户创建家目录 `/home/jake`。


    第 6 步。为 `jake` 用户设置一个你选择的密码。


    第 7 步。运行正确的命令显示创建新账户时使用的默认值。


    第 8 步。使用 `less` 命令显示包含密码过期默认值的文件。


    第 9 步。使用 `less` 命令显示包含默认登录 shell 的文件。


    第 10 步。使用单个命令删除 `jake` 用户及其家目录。


    ### 实验 7.2 用户账户安全


    *场景：* 创建一个名为 `sue` 的用户账户，并带有以下限制：


    警告


    在 Ubuntu 中，用户账户命令的某些选项与书中提供的标准选项不同。对于本实验，你需要探索你所安装的特定 Ubuntu 发行版的文档，以发现正确答案。


    - 账户应该有一个强效的随机生成的密码（考虑使用 [`passwordsgenerator.net`](https://passwordsgenerator.net)
    或类似的网站来创建密码）。

    - 用户应当是 games 组的辅助成员。

    - 用户的家目录应显式设置为 `/home/sue`。

    - 用户应强制每 60 天更改一次密码。

    - 用户在设置密码后 2 天内不允许更改密码。

    - 密码警告字段应设置为 10。

    - 密码不活动期应设置为 60。

    - 账户应设置为 2025 年 1 月 1 日过期。

    - 该用户（以及所有其他用户）的密码最小长度为 12 个字符。


    ### 实验 7.3 配置 `sudo`


    *场景：* 允许 `sue` 用户使用 `apt-get` 命令。通过以 `sue` 用户身份安装包来验证此能力。


    ## 第 8 章 开发账户策略


    这些实验应该在你在第 1 章 的“发行版与关键组件](#ch01.xhtml)”中安装的 Kali 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 8.1 测试账户安全性


    *场景：* 创建五个账户，每个账户设置一个不同的密码。让某些密码非常简单（例如单词），另一些复杂。然后对这些新账户运行工具，查看哪些密码被破解了。


    ### 实验 8.2 开发账户策略


    本实验没有特定的正确答案。目标是根据《网络安全 Linux 基础》第 6、7 和 8 章的内容为用户和组账户制定安全策略。


    作为起点，你可以利用位于 `www.sans.org/security-resources/policies) 处的一些优秀示例策略。你可能会发现该网站上的某些策略非常有用，有些是针对账户的。例如，有一个名为“密码保护”的策略。虽然你可以利用该网站的一些策略并参考其格式，但你还应该包含自己的原创内容。


