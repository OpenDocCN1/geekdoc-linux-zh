    ### Lab 28.1 Configuring GRUB Security


    **Scenario:** You need to configure the current system so it is more secure because
    it will be located in a public area. Configure the GRUB boot so the following
    features are enabled:


    *   The GRUB menu should not appear. Instead, the default image should be automatically
    booted.


    *   Create a superuser GRUB account named `super` with the encrypted password
    `noaccess`.


    *   Create a regular GRUB account named `user` with the encrypted password `secured`.


    ### Lab 28.2 Managing the Startup Process


    This lab doesn’t have a specific correct answer. The goal is to use what you learned
    in [Chapter 28](#ch28.xhtml) of *Linux Essentials for Cybersecurity* to determine
    which services are unnecessary for your system. When you discover a service that
    you deem unnecessary, your next task is to change the boot process so this service
    will not be enabled at boot.


    As you complete this lab, consider the following guidelines:


    *   Begin by listing all the services that are currently active for `multi-user.target`.


    *   Determine what each service provides (that is, which process it starts and
    what that process does).


    *   If you find an unnecessary process, disable it and then reboot your system.


    *   Record which services you disable so you know what to enable at a later date
    if something isn’t working correctly.


    **Example:** `cups.service` provides the CUPS (printer) server. This isn’t needed
    on most servers, as no printing takes place.


