    对理解计算机工作原理以及与他人分享这些知识的热情使他在 IT 领域获得了一个丰回报的职业。他的经验涵盖 Linux、Unix 以及 Perl、Python、Tcl
    和 BASH 等编程语言。他是一家 IT 培训机构 One Course Source 的创始人兼总裁。


