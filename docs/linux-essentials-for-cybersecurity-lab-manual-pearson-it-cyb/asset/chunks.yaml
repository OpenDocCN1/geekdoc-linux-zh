    **Scenario:** Users in your organization have complained that it takes too long
    for IT support to assist them when they need to get a backup file restored. They
    want to be able to restore files on their own when they accidently delete files.
    There are several possible solutions to this situation, including a feature called
    “backup snapshots” that you should look into when you have a chance. However,
    because there are only a handful of people on this system, a simple script should
    work.


    Create a script that will back up all the files of every user’s home directory
    (except the “root” user) in `tar` format. These backups should go into a directory
    named `/var/backups/*username*`, where `*username* is replaced by the name of
    the user.


    #### Note


    Consider that you might need to create the `/var/backups/username` directory and
    that the directory should be owned by a user with the permissions `rwx------`.
    Also, each backup file should include the date of the backup in the filename and
    should be owned by a user with the permissions `rw-------`.


    Modify the system `crontab` to run this command weekly.


