    \ “[Distributions and Key Components](#ch01.xhtml).” Before you begin these labs,\
    \ log in to the student account that you created during the installation process.\n\
    \n### Lab 21.1 Configuring and Administering an Apache Server\n\n**Scenario:**\
    \ Install the `httpd` web server package and configure it as follows:\n\n*   Ensure\
    \ that a test `index.html` page appears when you go to the main web server site\
    \ (aka, `localhost`). This page should display the text `server up`.\n\n*   Change\
