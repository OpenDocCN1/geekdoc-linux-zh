    \ Before you begin these labs, log in to the student account that you created\
    \ during the installation process.\n\n### Lab 22.1 Configuring an FTP Server\n\
    \n**Scenario:** Install and configure a VSFTPD server for the local system that\
    \ meets the following objectives:\n\n*   Disables anonymous FTP access\n\n*  \
    \ Denies the `bob` user account access to the FTP server\n\n*   Limits the FTP\
    \ server to two FTP client sessions\n\n*   Disables the ability for regular users\
    \ to upload files via the FTP server\n\n### Lab 22.2 Administering an SSH Server\n\
    \n**Scenario:** Configure the SSH server for the local system to meet the following\
    \ objectives:\n\n*   Allow only Protocol 2 connections.\n\n*   Set the logging\
    \ level to `VERBOSE`.\n\n*   Do not permit root logins.\n\n*   Deny bob ability\
    \ to log in.\n\n## Chapter 23. Develop a Network Policy\n\nThese labs should be\
    \ performed on the CentOS operating system that you installed in [Chapter 1](#ch01.xhtml),\
    \ “[Distributions and Key Components](#ch01.xhtml).” Before you begin these labs,\
    \ log in to the student account that you created during the installation process.\n\
    \n### Lab 23.1 Administering Kernel Parameters\n\n**Scenario:** Implement the\
    \ following kernel changes so they are persistent:\n\n*   Ignore all ping requests.\n\
    \n*   Ignore all broadcast requests.\n\n*   Enable TCP SYN protection.\n\n*  \
    \ Disable IP routing.\n\n### Lab 23.2 Securing a System with TCP Wrappers\n\n\
    **Scenario:** Implement the following TCP Wrappers rules:\n\n*   Allow SSH from\
