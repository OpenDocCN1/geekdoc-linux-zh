    Step 9. Enter the *exit* command to log out of the SSH connection. (Run this command
    only once; running it a second time will result in your terminal window being
    closed.)


    Step 10. Return to your original window, in which you are logged in as the root
    user. (Keep the terminal window from step 7 open.) Create a message-of-the-day
    file that displays **Restricted server - only log in if you have been authorized**
    after a user logs in.


    Step 11. Return to the terminal window that you opened in step 7 and run the *ssh
    localhost* command again to test the message-of-the-day file.'
