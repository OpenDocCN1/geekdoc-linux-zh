    # Part II User and Group Accounts


    ## Chapter 6. Managing Group Accounts


    These labs should be performed on the Ubuntu operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    ### Lab 6.1 Managing Group Accounts


    Step 1. Open a terminal window.


    Step 2. Display the current user’s ID and group membership.


    Step 3. Display the group membership of the root account.


    Step 4. Run the correct command to determine the user owner and group owner of
    the `/etc/group` file.


    Step 5. Display the group account information for the games group.


    Step 6. Display the group password information for the games group.


    Step 7. Run the `su -` following command to switch to the root account (and provide
    the root password when prompted).


    Step 8. Create a new group named `test`.


    Step 9. Display the group account information for the test group.


    Step 10. Change the group name of the test group to `newtest`.


    Step 11. Add the student account as a secondary member of the `newtest` group
    without overriding this user’s current group membership.


    ### Lab 6.2 Managing Group Administrators


    *Scenario:* In this lab you will be asked to provide a “goal” rather than be told
    specifically which steps to take. It is up to you to achieve the end result based
    on what you have learned regarding this topic. Create a new group named `eng`
    and add the student user to this group. Make the student user a group administrator.
    To test this, add the `bin` user to the `eng` group while logged in as the student
    user and then verify this new group membership.


    ## Chapter 7. Managing User Accounts


    These labs should be performed on the Ubuntu operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    ### Lab 7.1 Managing User Accounts


    Step 1. Open a terminal window.


    Step 2. Execute the correct command to display user account information (including
    the login shell and home directory) for the `bin` account.


    Step 3. Execute the correct command to display user password information (including
    the encrypted password and password aging) for the `bin` account.


    Step 4. The command in step 3 should have failed. Execute the correct `su` command
    to change your account so the command from step 3 will be successful when executed.


    Step 5. Create a new user named `jake` and explicitly use options to create the
    home directory `/home/jake` for this user.


    Step 6. Set a password for the `jake` user to a password of your choosing.


    Step 7. Run the correct command to display the default values used when a new
    account is created.


    Step 8. Using the `less` command, display the file that contains the password
    aging defaults.


    Step 9. Using the `less` command, display the file that contains the default login
    shell.


    Step 10. Delete the `jake` user and his home directory, using a single command.


    ### Lab 7.2 Securing User Accounts


    *Scenario:* Create a user account named `sue` with the following restrictions:


    Warning


    With Ubuntu, some of the options for user account commands are different from
    the standard options provided in the book. For this lab you need to explore the
    documentation for the specific Ubuntu distro you installed to discover the correct
    answer.


    - The account should have a strong, randomly generated password (consider using
    [https://passwordsgenerator.net](https://passwordsgenerator.net) or a similar
    site to create the password).

    - The user should be a secondary member of the games group.

    - The user’s home directory should be explicitly set as `/home/sue`.

    - The user should be forced to change her password every 60 days.

    - The user should not be allowed to change her password for 2 days after it has
    been set.

    - The password warning field should be set to 10.

    - The password inactivity period should be set to 60.

    - The account should be set to expire on January 1, 2025.

    - This user (and all others) should have a minimum password length of 12 characters.


    ### Lab 7.3 Configuring `sudo`


    *Scenario:* Allow the `sue` user the ability to use the `apt-get` command. Verify
    this ability by installing the `joe` package as the `sue` user.


    ## Chapter 8. Develop an Account Policy


    These labs should be performed on the Kali operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    ### Lab 8.1 Testing the Security of Accounts


    *Scenario:* Create five user accounts, with a different password for each. Make
    some of the passwords very simple, such as words, and some of the passwords more
    complex. Then run the tool on these new accounts and see which passwords were
    compromised.


    ### Lab 8.2 Developing an Account Policy


    This lab does not have a specific correct answer. The goal is to use what you
    learned in [Chapters 6](#ch06.xhtml), [7](#ch07.xhtml), and [8](#ch08.xhtml) of
    *Linux Essentials for Cybersecurity* to develop security policies for user and
    group accounts.


    As a starting point, you can make use of some excellent sample policies located
    at [https://www.sans.org/security-resources/policies](https://www.sans.org/security-resources/policies).
    You may find some policies on this site very useful, as some are specific to accounts.
    For example, there is a policy called Password Protection Policy. While you can
    make use of some of the policies on this site and make use of the format of the
    policies, you should also include original work that you create.


