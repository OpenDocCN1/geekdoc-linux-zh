    ## 第 28 章 系统启动


    这些实验应该在你在第 1 章“发行版和关键组件”中安装的 CentOS 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 28.1 配置 GRUB 安全


    **场景：** 你需要配置当前系统使其更安全，因为它位于公共区域。配置 GRUB 启动以便以下功能：


    *   GRUB 菜单不应显示。相反，应自动启动镜像。


    *   创建一个名为 `super` 的超级用户 GRUB 账户，密码为 `noaccess`。


    *   创建一个名为 `user` 的普通 GRUB 账户，密码为 `secured`。


    ### 实验 28.2 管理启动过程


    此实验没有特定的标准答案。目标是利用《网络安全 Linux 基础》第 28 章](#ch28.xhtml)中学的知识来确定哪些服务是不必要的。当你发现一个不必要的服务时，下一个任务是更改启动过程，使其在启动时不启用。


    在完成此实验时，请考虑以下指南：


    *   首先列出所有针对 `multi-user.target` 激活的服务。


    *   确定每个服务提供什么（即它启动了什么进程以及该进程做什么）。


    *   如果你发现了一个必要的进程，禁用它并重启系统。


    *   记录你禁用的服务，以便在以后出现问题时知道需要启用哪些。


    示例：`cups.service` 提供 CUPS（打印机）服务器。大多数服务器上不需要它，因为没有打印操作。


