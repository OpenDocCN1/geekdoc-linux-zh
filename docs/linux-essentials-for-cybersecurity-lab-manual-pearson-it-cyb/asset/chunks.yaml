    10. 使用 `host` 命令对 `ubuntu.com` 进行 DNS 查询。

    11. 使用 `dig` 命令对 `ubuntu.com` 进行 DNS 查询。

    12. 使用 `netstat` 命令显示 TCP 信息。

    13. 使用 `netstat` 命令显示路由表。

    14. 使用 `cat` 命令显示包含主机名的文件内容。

    15. 使用 `cat` 命令显示包含主机到 IP 地址转换的文件内容。

    16. 使用 `cat` 命令显示包含系统 DNS 服务器的文件内容。

    17. 使用 `cat` 命令显示决定系统是否默认开启网络的文件内容。

    18. 使用 `cat` 命令显示包含 `eth0` 设备设置的文件（如果你在虚拟机上操作，则为 `emp0s3`）。

    19. 重启系统将所有网络设置还原为原始。


    ### 实验 19.2 在 Ubuntu 上理解网络配置


    为了帮助避免破坏网络，本实验侧重于查看信息而非进行永久更改。


    1. 在 Ubuntu 系统上打开终端。

    2. 使用 `ip addr` 命令显示当前网络配置。

    3. 使用 `ip` 命令显示路由表。

    4. 使用 `ip` 命令为 `192.168.145.0/24` 网络添加新路由，网关为 `192.168.0.99`。

    5. 使用 `ip` 命令显示新的路由表。

    6. 使用 `netstat` 命令显示 UDP 信息。

    7. 使用 `netstat` 命令列出网络统计数据。

    8. 使用 `cat` 命令显示包含 NSS（名称服务切换）配置的文件内容。

    9. 使用 `cat` 命令显示包含内核参数的文件内容。


