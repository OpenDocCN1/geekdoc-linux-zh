    ### Lab 10.3 Managing Swap Devices


    *Scenario:* Create two new swap devices. One swap device should be a 50MB file
    named `/var/swapfile`. The second swap device should be a swap partition (`/dev/sdb2`)
    that is 50MB in size. These swap devices should be automatically enabled during
    each boot process. (Use the `UUID` of the partition for this.)


    ## Chapter 11. Manage Local Storage: Advanced Features


    These labs should be performed on the CentOS operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    ### Lab 11.1 Managing Encrypted Filesystems


    **Scenario:** In Lab 10.1 you created a partition that was mounted under the `/repo`
    directory. Change this partition so it has an encrypted filesystem on it. Note
    that the `aes` and `sha256` modules do not need to be loaded for CentOS.


    After you complete this lab, you can remove the line that you added to the `/etc/fstab`
    file as you will not be using this partition in any further lab.


    ### Lab 11.2 Configuring Logical Volumes


    **Scenario:** Add three new 50MB virtual hard disks to your system to simulate
    a server that has three new hard drives. Use the technique provided in Lab 10.1
    to create these new hard disks within the Oracle VM VirtualBox Manager program.
    Then create a new volume group named `VG1`, using these three hard drives. Using
    the `VG1` volume group, create two logical volumes: a logical volume named `lv0`
    that is 20MB in size, and a logical volume named `lv1` that uses the rest of the
    available space from `VG1`. Create filesystems for each new logical volume, create
    mount points (`/lv0` and `/lv1`), and configure the system to mount these new
    logical volumes during the boot process.


    ### Lab 11.3 Administering Disk Quotas


    **Scenario:** Implement disk quotas on the filesystem that is mounted under the
    `/lv1` mount point. The limitations should be for the student user. Apply a hard
    limit on this user account of 10MB of file space and 100 files. Also create a
    soft limit of 8MB and 80 files.


    ### Lab 11.4 Managing Hard and Soft Links


    Step 1. Open a terminal window.


    Step 2. Switch to the root account by using the `su` command.


    Step 3. Using the `ls` and `grep` commands, display all the soft links in the
    `/var` directory.


    Step 4. Create a soft line from a file named `/root/info` to the `/etc/passwd`
    file.


    Step 5. Execute the correct command to display the soft link you created in step
    4.


    Step 6. Execute the correct command to display the number of hard links for the
    `/usr/bin/c2ph` file.


    Step 7. Execute the correct command to display the inode number of the `/usr/bin/c2ph`
    file.


    Step 8. Execute the correct command to find all the files that are hard linked
    with the `/usr/bin/c2ph` file.


    ## Chapter 12. Manage Network Storage


    These labs should be performed on the CentOS operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    ## Note


    Ideally you would have two systems for working on network-based labs. However,
    such a setup would require extra RAM and a faster CPU. To avoid having too many
    hardware requirements for your system, this lab has you run a single virtual machine
    that acts as both the server and the client.


    ### Lab 12.1 Configuring Samba


    Step 1. Open a terminal window.


    Step 2. Use the `su` command to switch to the root user.


    Step 3. Install the `samba` package by using the `yum` command.


    Step 4. Edit the configuration file for the Samba server by using the `vim` command.


    Step 5. Add a share for the `/usr/bin` directory called `commands`. This should
    be a read-only share that is browseable.


    Step 6. Execute the correct command to check the syntax and format of the Samba
    server configuration file.


    Step 7. Execute the following commands to start the Samba services and ensure
    that they will start at boot:


    ```

    systemctl enable smb

    systemctl enable nmb

    systemctl start smb

    systemctl start nmb

    ```


    Step 8. Create a Samba account for the student user. Provide a password of your
    choosing.


    Step 9. Use the student Samba account to display the Samba server shares of the
    local machine (using `localhost` or `127.0.0.1` for the server name or IP address).


    Step 10. Connect to the Samba `commands` share by using the `smbclient` command.


    Step 11. At the `smb` prompt, list the files on the share.


    Step 12. Quit the `smbclient` utility.


    Step 13. Make a directory named `commands`.


    Step 14. Mount the Samba `commands` share by using the student account under the
    `/commands` directory.


    Step 15. List the files in the `/commands` directory to verify that the worked.


    Step 16. Unmount the Samba share.


    ## Note


    CentOS 7 uses NFS version 4, which does not use `portmap`.


    *Scenario:* Create an NFS share of `/usr/bin`. The share should be available for
    all machines as a read-only share. Test this locally by mounting the `/commands`
    directory created in 12.1.


    ### Lab 12.2 Administering NFS


    Note


    When you are finished, unmount the resource.


    ### Lab 12.3 Managing iSCSI


    Step 1. Open a terminal window.


    Step 2. Use the `su` command to switch to the root user.


    Step 3. Use the following `yum` commands to install the packages that allow you
    to create iSCSI targets:


    ```

    yum install epel-release

    yum install scsi-target-utils

    ```


    Step 4. To use the `/dev/sdb1` partition you created in 10.1 for the iSCSI target,
    start by ummountinging the partition.


    Step 5. Next, remove the line in `/etc/fstab` that mounts this device automatically.


    Step 6. Add the correct entry in `/etc/tgt/targets.conf` to share the `/dev/sdb1`
    device using the IP address `127.0.0.1` for the permitted initiator.


    Step 7. Start and enable the `tgtd` daemon by executing the following:


    ```

    systemctl enable tgtd

    systemctl start tgtd

    ```


    Step 8. Execute the correct command to verify that the target has been enabled
    on this system.


    Step 9. Execute the correct command to display the targets provided by the iSCSI
    server with IP address `127.0.0.1`.


    Note


    Because having an iSCSI target and initiator on the same system may cause issues,
    this lab stops at this point. Review the content in [Chapter 12](#ch12.xhtml)
    of *Linux Essentials for Cybersecurity* for a look at the steps required to make
    use of this iSCSI device.


