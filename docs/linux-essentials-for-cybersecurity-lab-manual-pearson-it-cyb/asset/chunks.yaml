    [Chapter 24](#ch24.xhtml), “[Process Control](#ch24.xhtml),”] includes labs on
    starting, viewing, and controlling processes (programs).


    [Chapter 25](#ch25.xhtml), “[System Logging](#ch25.xhtml),”] gives you hands-on
    experience with viewing system logs as well as how to configure a system to create
    custom log entries.


    [Chapter 26](#ch26.xhtml), “[Red Hat–Based Software Management](#ch26.xhtml),”]
    includes labs on administering software on Red Hat–based systems such as Fedora
    and CentOS.


