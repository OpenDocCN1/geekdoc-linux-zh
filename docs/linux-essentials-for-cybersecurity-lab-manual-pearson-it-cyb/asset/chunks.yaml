    and click the mirrors link for the ISO images:


    ![A screenshot displays the download centOS Linux ISO images window.](graphics/01fig01.jpg)


    Step 2. Click on a mirror site of your choosing and then click on the **CentOS-7-x86_64-Everything-1708.iso**
    link to download the file. It takes some time for the file to download.


    Step 3. Start Oracle VirtualBox and then click the **New** button.


    Step 4. Enter **CENTOS 7 - for class** in the Name box.


    Step 5. Change the memory size to **4196 MB** and click the **Create** button.


    Step 6. Change the file size to **10.00 GB**.


    Step 7. Change the storage on physical hard disk to **Fixed Size** and click the
    **Create** button.


    Step 8. When you are returned to the main Oracle VirtualBox screen, click on the
    **Start** button.


    Step 9. Click on the small folder icon next to the drop-down list and navigate
    to the location where you downloaded the CentOS ISO file. Select that file and
    then click the **Open** button.


    Step 10. Click the **Start** button.


    Step 11. Click in the installation window and then at the CentOS 7 screen, either
    press the **Enter** key to start the installation or wait for the timer to run
    down and the installation to begin automatically.


    Note


    You can press the **Esc** key to avoid the lengthy media check. In addition, to
    “get out of” the virtual machine, press your right **Ctrl** key (the Ctrl key
    on the right side of your keyboard).


    Step 12. At the Welcome to CENTOS 7 screen, click the **Continue** button to accept
    the default installation language, English.


    Step 13. Click the **Installation Destination** button.


    Step 14. Under Local Standard Disks, click on the icon of the **10 GiB** disk
    multiple times until it is marked as selected. It is marked as selected when a
    checkmark appears next to the disk icon.


    Step 15. Click the **Done** button in the upper-left area of the window.


    Step 16. Click the **Network & Host Name** button.


    Step 17. Click the icon next to **Ethernet (enp0s3)** to change the value from
    **OFF** to **ON**.


    Step 18. Click the **Done** button to return to the INSTALLATION SUMMARY screen.


    Step 19. Click the **SOFTWARE SELECTION** button.


    Step 20. Click **GNOME Desktop** and then click the **Done** button.


    Step 21. Click the **Begin Installation** button.


    Step 22. While the installation is running, click on the **ROOT PASSWORD** button
    and set a password for the root account that is easy for you to remember. You
    may need to click the **Done** button twice if your password isn’t very strong.


    Step 23. While the installation is running, click on the **USER CREATION** button.


    Step 24. For both full name and user name, enter **student**. Enter a password
    of your choosing and then click the **Done** button. You may need to click the
    **Done** button twice if your password isn’t very strong. Do not make this account
    an administrator.


    Step 25. When the installation is complete, click the **Reboot** button.


    Step 26. After the system boots, when the INITIAL SETUP screen appears, click
    the **LICENSE INFORMATION** button.


    Step 27. Click the box next to **I accept the license agreement** and then click
    the **Done** button in the upper-left corner of the screen.


    Step 28. Click the **FINISH CONFIGURATION** button.


    Step 29. At the login screen, log in as the student user.


    Step 30. After logging in, click the **Next** button at the Welcome screen.


    Step 31. Click the **Next** button at the Typing screen.


    Step 32. Turn off **Location Services** and then click the **Next** button.


    Step 33. Click the **Skip** button at the Online Accounts screen.


    Step 34. Click the **Start using CentOS Linux** button.


    Step 35. If you are interested, you can view the help videos for using GNOME on
    the Getting Started screen. Close this window when finished.


    Step 36. For the next lab, you need to suspend the CentOS operating system. By
    suspending, you can start again quickly from the Oracle VirtualBox manager. To
    suspend, click the close box (the **X**) in the upper-right corner. Make sure
    **Save the machine state** is selected and then click the **OK** button. When
    you want to use CentOS again, just double-click the **CENTOS 7 - for class (Saved)**
    icon in the Oracle VM VirtualBox Manager window.


    ### Lab 1.2 Installing Ubuntu


    Step 1. Go to [https://www.ubuntu.com/download/desktop](https://www.ubuntu.com/download/desktop)
    and click on the **Download** button.


    Step 2. Click the **Not now, take me to the download** link to download the file.
    It takes some time to download the file.


    Step 3. Start Oracle VirtualBox and click the **New** button.


    Step 4. Enter **Ubuntu - for class** in the Name box.


    Step 5. Change the memory size to **4196 MB** and click the **Create** button.


    Step 6. Change the file size to **10.00 GB**.


    Step 7. Change the storage on physical hard disk to **Fixed Size** and click the
    **Create** button.


    Step 8. When you are returned to the main Oracle VirtualBox screen, click the
    **Start** button.


    Step 9. Click the small folder icon next to the drop-down list and navigate to
    the location where you downloaded the Ubuntu ISO file. Select that file and then
    click the **Open** button.


    Step 10. Click the **Start** button.


    Note


    The Ubuntu operating system typically doesn’t “capture” the mouse, so you shouldn’t
    need to use the right **Ctrl** button to return to the host operating system.'
