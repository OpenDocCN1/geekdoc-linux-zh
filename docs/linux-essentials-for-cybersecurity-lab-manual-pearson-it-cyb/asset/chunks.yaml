  trans: '


    ### 第 10 步 使用 `cat` 命令显示包含持久性 IP 地址设置的文件内容。


    第 11 步 使用 `ping` 命令确定是否可以通过网络访问 [ubuntu.com](http://ubuntu.com) 系统。（仅发送 10 次 ping
    请求。）


    第 12 步 使用 `traceroute` 命令显示连接到 [ubuntu.com](http://ubuntu.com) 系统时使用的路由器。


    第 13 步重启你的系统以将所有网络设置还原为初始状态。


    ## 第 20 章 网络服务配置：基本服务


    这些实验应该在你在第 1 章“发行版与关键组件](#ch01.xhtml)”中安装的 CentOS 操作系统上进行。在开始这些实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 20.1 配置 BIND 服务器


    注意


    创建一个完整的 BIND 服务器超出了本书的讨论范围。在本实验中，你将创建并探索纯缓存服务器的组件。纯缓存服务器应仅供本地系统使用。


    第 1 步 打开一个终端窗口。


    第 2 步 使用 `su` 命令切换到 root 账户。


    第 3 步 运行 `yum` 命令安装 `bind` 和 `bind-utils` 软件包。


    第 4 步 编辑 `/etc/named.conf` 文件，使其内容如下：


    点击此处查看代码图片


    ```

    listen-on port 53 { 127.0.0.1; any; };

    allow-query     { localhost; any; };

    allow-query-cache       { localhost; any; };

    ```


    第 5 步 测试 `/etc/named.conf` 文件的语法。


    第 6 步 重启 `named` 服务。


    第 7 步 检查 `named` 服务的状态。


    第 8 步 启用 `named` 服务。


    第 9 步 执行以下命令以确保你的防火墙允许 DNS 查询：


    点击此处查看代码图片


    ```

    firewall-cmd --add-port=53/udp

    firewall-cmd --add-port=53/udp --permanent

    ```


    第 10 步 通过执行以下命令测试服务：


    点击此处查看代码图片


    ```

    dig @localhost onecoursesource.com +trace

    ```


    ### 实验 20.2 配置 Postfix 服务器


    第 1 步 打开一个终端窗口。


    第 2 步 使用 `su` 命令切换到 root 账户。


    第 3 步 查看 `Postconf` 中 `inet_interfaces` 设置的当前值。


    第 4 步 将 `inet_interfaces` 设置的值更改为 `all`。


    第 5 步 将 `myhost` 设置的值更改为 `testserv`。


    第 6 步 创建一个邮件别名，以便发送给 root 用户的邮件发送给学生用户。


    第 7 步 执行正确的命令将更改保存到 `/etc/alias` 文件到 Postfix 数据库。


    ## 第 21 章 网络服务配置：Web 服务


    这些实验应该在你在第 1 章“发行版与关键组件](#ch01.xhtml)”中安装的 CentOS 操作系统上进行。在开始这些实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 21.1 配置和管理 Apache 服务器


    **场景：** 安装 `httpd` Web 服务器包并按如下方式进行配置：


    *   确保当你访问主 Web 站点（即 `localhost`）时会出现一个测试的 `index.html` 页面。该页面应显示文本 `server up`。


    *   将日志级别更改为 `info`。


    *   将客户端数量限制为 25 个。


    *   使用 `.htaccess` 文件创建一个名为 `docs` 的安全目录。


    *   创建一个名为 `student` 的 Apache 用户，该用户可以访问 `docs` 目录。


    ### 实验 21.2 配置代理服务器


    **场景：** 配置你的本地系统作为代理服务器。默认情况下，Squid 被配置为在端口 3128 正向代理服务器。在安装 Squid 后，启动服务并使用 Firefox
    测试代理服务器。


    ## 第 22 章 连接到远程系统


    这些实验应该在你在第 1 章“发行版与关键组件](#ch01.xhtml)”中安装的 CentOS 操作系统上进行。在开始这些实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 22.1 配置 FTP 服务器


    **场景：** 为本地系统安装并配置 VSFTPD 服务器以满足以下目标：


    *   禁用匿名 FTP 访问


    *   拒绝 `bob` 用户账户访问 FTP 服务器


    *   将 FTP 服务器限制为两个 FTP 客户端会话


    *   禁用普通用户通过 FTP 服务器上传文件的功能


    ### 实验 22.2 管理 SSH 服务器


    **场景：** 配置本地系统的 SSH 服务器以满足以下目标：


    *   仅允许协议 2 连接。


    *   将日志级别设置为 `VERBOSE`。


    *   不允许 root 登录。


    *   拒绝 bob 登录。


    ## 第 23 章 制定网络策略


    这些实验应该在你在第 1 章“发行版与关键组件](#ch01.xhtml)”中安装的 CentOS 操作系统上进行。在开始这些实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 23.1 管理内核参数


    **场景：** 实现以下内核更改使其持久化：


    *   忽略所有 ping 请求。


    *   忽略所有广播请求。


    *   启用 TCP 保护。


    *   禁用 IP 路由。


    ### 实验 23.2 使用 TCP Wrappers 安全系统


    **场景：** 实现以下 TCP Wrappers 规则：


    *   允许所有主机 SSH。


    *   允许本地网络访问 FTP 服务器。


    *   允许可以通过主机解析的客户端连接 xinetd。


    *   阻止所有系统访问其他服务。


    ### 实验 23.3 配置网络时间


    **场景：** 配置你的系统使用以下 NTP 服务器：


    *   0.pool.ntp.org


    *   1.pool.ntp.org


    *   2.pool.ntp.org


    *   3.pool.ntp.org


    ### 实验 23.4 创建网络策略


    本实验没有特定答案。目标是利用你在第 19、20、21 和 22 章中学到的知识为用户和组账户制定安全策略。


    作为起点，你可以利用 [`www.sans.org/security-resources/policies`](https://www.sans.org/security-resources/policies)
    位于优秀示例策略。注意，你可能会发现网站上的某些策略非常有用，因为有些是针对账户的。虽然你可以利用网站上的某些策略并参考其格式，但你还应该包含自己创建的原创工作。


    # 第 VI 部分 进程与日志管理


    ## 第 24 章 进程控制


    ### 实验 24.1 管理系统进程


    第 1 步 打开一个终端窗口。


    第 2 步 列出当前 shell 中运行的进程。


