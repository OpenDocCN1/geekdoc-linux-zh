    Step 2. Use the `su` command to switch to the root user.


    Step 3. Back up the contents of the `/etc/X11` directory into a tar file named
    `/tmp/X11.tar`.


    Step 4. List the contents of the `/tmp/X11.tar` file, including details about
    the files (such as using verbose mode).


    Step 5. Move to the `/tmp` directory.

