    ### Lab 19.1 Understanding Network Configuration on CentOS


    To help you avoid accidentally breaking networking on your system, this lab focuses
    on viewing network information and not making permanent changes to network.


    1. Open a terminal window on your CentOS system.

    2. Use the `ifconfig` command to display the current network configuration.

    3. Use the `nmcli` command to determine whether the Network Manager is active.

    4. Use the `arp` command to display the ARP table.

    5. Use the `route` command to display the routing table.

    6. Use the `route` command to add a new route for the `192.168.145.0/24` network,
    with gateway `192.168.0.199`.

    7. Use the `route` command to display the new routing table.

    8. Display the current system name.

    9. Change the current system name to `mymachine`.

    10. Use the `host` command to perform a DNS query on `ubuntu.com`.

    11. Use the `dig` command to perform a DNS query on `ubuntu.com`.

    12. Use the `netstat` command to display TCP information.

    13. Use the `netstat` command to display the routing table.

    14. Use the `cat` command to display the contents of the file that contains the
    system’s hostname.

    15. Use the `cat` command to display the contents of the file that contains the
    hostname-to-IP-address translation.

    16. Use the `cat` command to display the contents of the file that contains the
    DNS servers for this system.

    17. Use the `cat` command to display the contents of the file that determines
    if networking should be turned on default for this system.

    18. Use the `cat` command to display the contents of the file that contains the
    settings for the `eth0` device (or `emp0s3` if you are working on a virtual machine).

    19. Reboot your system to revert all the networking settings back to the original.


    ### Lab 19.2 Understanding Network Configuration on Ubuntu


    To help you avoid accidentally breaking networking on your system, this lab focuses
    on viewing network information and not making permanent changes to network configuration.


    1. Open a terminal window on your Ubuntu system.

    2. Use the `ip addr` command to display the current network configuration.

    3. Use the `ip` command to display the routing table.

    4. Use the `ip` command to add a new route for the `192.168.145.0/24` network,
    with gateway `192.168.0.199`.

    5. Use the `ip` command to display the new routing table.

    6. Use the `netstat` command to display UDP information.

    7. Use the `netstat` command to list network statistics.

    8. Use the `cat` command to display the contents of the file that contains NSS
    (Name Service Switch) configuration.

    9. Use the `cat` command to display the contents of the file that contains kernel
    parameters.

