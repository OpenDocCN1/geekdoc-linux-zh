    ## Chapter 2\. Working on the Command Line


    These labs should be performed on the Ubuntu operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    ### Lab 2.1 Manage Files


    Step 1. Open a terminal window.


    Step 2. Display your current directory.


    Step 3. Using an absolute pathname, switch to the */etc* directory.


