  trans: '

    这些实验应该在你在第 1 章“发行版与关键组件](#ch01.xhtml)”中安装的 CentOS 操作系统上进行。在开始这些实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 29.1 探索常见漏洞与披露（CVE）报告


    *场景：*你被要求在系统上安装 Apache Web 服务器。贵公司的策略是在安装新软件产品之前审查最近的 CVE。请查看 Apache 最新的三个 CVE
    报告，并记录每个漏洞的详细信息。


    ### 实验 29.2 管理和加固遗留服务


    *场景：*你被要求在当前系统上安装一个 `tcpmux` 服务器，以与来自另一个系统的遗留应用程序配合。首先安装 `xinetd` 软件包。然后配置 `tcpmux`
    服务器，并考虑以下要求：


    * 如果每秒的连接尝试次数超过 20 次，则禁用该服务 30 秒。

    * 每次仅允许两个活跃连接。


    # 第八部分 安全任务


    ## 第 30 章 尾迹探测（Footprinting）


    这些实验应该在你在第 1 章“发行版与关键组件](#ch01.xhtml)”中安装的 CentOS 操作系统上进行。在开始这些实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 30.1 使用探测工具


    步骤 1. 打开终端窗口。

    步骤 2. 切换到 root 账户。

    步骤 3. 执行 `nmap` 命令探测本地系统上的开放 TCP 端口。

    步骤 4. 执行 `nmap` 命令探测本地系统上的开放 UDP 端口。

    步骤 5. 执行 `nmap` 命令探测本地系统的 5000–10000 端口。

    步骤 6. 执行 `netstat` 命令按协议显示网络数据包信息的摘要。

    步骤 7. 执行 `netstat` 命令显示路由表。

    步骤 8. 执行 `netstat` 命令显示所有监听套接字（sockets）。

    步骤 9. 执行 `lsof` 命令打开网络套接字。

    步骤 10. 执行 `lsof` 命令在不解析主机名或端口名的情况下打开网络套接字。


    ### 实验 30.2 网络扫描


    步骤 1. 打开终端窗口。

    步骤 2. 切换到 root 账户。

    步骤 3. 对 192.168.10.0 C 类网络中的所有系统执行 `nmap` 命令。

    步骤 4. 执行 `tcpdump` 命令捕获 10 个数据包。

    步骤 5. 执行 `tcpdump` 命令以带有完整详细数据输出的方式捕获 10 个数据包。

    步骤 6. 执行 `ifconfig` 命令确定你的主网络接口的名称。

    步骤 7. 执行 `tcpdump` 命令专门在主接口网络上捕获 10 个数据包。

    步骤 8. 执行 `tcpdump` 命令为主接口网络上的任何 SSH 连接捕获 10 个数据包。

    步骤 9. 执行 `tcpdump` 命令捕获 500 个数据包。将输出保存到名为 `/tmp/tcpdump.data` 的文件中。

    步骤 10. 执行 `tcpdump` 命令查看 `/tmp/tcpdump.data` 文件的内容。


    ## 第 31 章 防火墙


    此实验应该在你在第 1 章“发行版与关键组件](#ch01.xhtml)”中安装的 CentOS 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 31.1 创建防火墙保护系统


    **场景：** 使用 `iptables` 命令为本地系统创建一个符合以下远程的防火墙：


    * 允许来自任何系统的 SSH 和 FTP 端口的入站连接

    * 允许来自 192.168.1.0/24 网络中任何系统的 telnet 端口的入站连接

    * 记录所有其他入站连接

    * 通过更改默认策略丢所有其他入站连接


    注意：不要保存你在本次实验练习中所做的更改。


    ## 第 32 章 入侵检测


    此实验应该在你在第 1 章“发行版与关键组件](#ch01.xhtml)”中安装的 CentOS 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 32.1 制定入侵检测安全计划


    此实验没有特定的标准答案。目标是利用你在《网络安全 Linux 基础》第 32 章中学到的知识，开发入侵检测的安全策略。


    作为一个开始，你可以利用[`www.sans.org/security-resources/policies`](https://www.sans.org/security-resources/policies)提供的一些优秀示例安全策略。你可能会发现该网站上的某些策略有用，因为某些是针对特定账户的。例如，有一个名为灾恢复计划策略（Disaster
    Recovery Plan Policy）的示例策略。虽然你可以利用该网站的一些策略和策略格式，但你也应该根据你在《网络安全 Linux 基础》第 9 章,第
    10 章,第 11 章和第 12 章中学的内容包含原创作品。


    ## 第 33 章 额外任务


    这些实验应该在你在第 1 章“发行版与关键组件](#ch01.xhtml)”中安装的 CentOS 操作系统上进行。在开始这些实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 33.1 配置 fail2ban


    *场景：*安装 `fail2ban` 软件并进行配置，考虑以下因素：


    * 将封禁时间设置为 5 分钟。

    * 将失败次数设置为 10 次。

    * 将 `findtime` 设置为 10 分钟。

    * 确保服务已启用。


    ### 实验 33.2 使用 gpg 加密文件


    步骤 1. 打开终端窗口。

    步骤 2. 使用 RSA 加密创建 `gpg` 密钥。使用 `Joe User` 作为真实姓名，使用 `joe@user.com` 作为电子邮件地址，并在所有其他提示中使用默认值。

    步骤 3. 为 Joe User 创建一个名为 `testkey` 的公钥文件。

    步骤 4. 将 `testkey` 公钥导入 GPG 数据库。

    步骤 5. 将 `/etc/hosts` 文件复制到你的主目录。

    步骤 6. 将 `/etc/hosts` 文件复制到你的主目录。

    步骤 7. 使用步骤 2 中创建的公钥加密主目录下的 `hosts` 文件。


    ## 代码片段


    许多书籍包含编程代码或配置示例。为了优化这些元素的呈现，请在单列横屏模式下查看电子书，并将字体大小调整为最小。除了以流式文本格式呈现代码和配置外，我们还包含了代码图像，以模仿纸质书籍中的呈现方式；因此，当流式格式可能会损害代码列表的呈现时，你会看到一个“点击此处查看代码图像”的链接。点击链接即可查看打印真度的代码图像。要返回之前查看的页面，请点击设备或应用程序上的返回键。


