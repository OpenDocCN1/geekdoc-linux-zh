    ## 第 25 章 系统日志


    这些实验应该在你在第 1 章“发行版和关键组件”中安装的 CentOS 操作系统上进行。在开始此实验之前，请登录你在安装过程中创建的学生账户。


    ### 实验 25.1 管理日志文件


    **场景：** 修改 CentOS 系统以使以下日志事件发生：


    *   所有 `debug` 级别的 `cron` 消息应发送到 `/var/log/cron.debug` 文件。


    *   所有来自 `local3` 服务的消息应发送到 root 用户的终端。


    验证这些更改已正确生效。


    ### 实验 25.2 配置日志轮转


    **场景：** 修改 CentOS 系统以使以下情况发生：


    *   默认情况下，日志文件应每天进行轮转。


    *   默认情况下，应保留 10 份轮转后的日志文件备份。


    *   默认情况下，已轮过的日志文件应被压缩。


    *   所有 CUPS 日志文件应每周轮转一次，且仅保留 4 份备份。


