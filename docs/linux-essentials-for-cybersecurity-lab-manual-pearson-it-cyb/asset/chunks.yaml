    \n### Lab 23.3 Configuring Network Time\n\n**Scenario:** Configure your system\
    \ to use the following NTP servers:\n\n*   0.pool.ntp.org\n\n*   1.pool.ntp.org\n\
    \n*   2.pool.ntp.org\n\n*   3.pool.ntp.org\n\n### Lab 23.4 Creating a Networking\
    \ Policy\n\nThis lab does not have a specific answer. The goal is to use what\
    \ you learned in Chapters 19, 20, 21, and 22 to develop security policies for\
    \ user and group accounts.\n\nAs a starting point, you can make use of some excellent\
    \ sample policies located at [https://www.sans.org/security-resources/policies](https://www.sans.org/security-resources/policies).\
    \ Note that you may find some policies on this site very useful, as some are specific\
    \ to accounts. While you can make use of some of the policies on this site and\
    \ make use of the format of the policies, you should also include original work\
    \ that you create, based on what you have learned.\n\n# Part VI Process and Log\
    \ Administration\n\n## Chapter 24. Process Control\n\n### Lab 24.1 Managing System\
    \ Processes\n\nStep 1. Open a terminal window.\n\nStep 2. List the processes that\
    \ are running in the current shell.\n\nStep 3. List all processes that are running\
    \ on this system.\n\nStep 4. Using the `grep` and `ps` commands, list all processes\
