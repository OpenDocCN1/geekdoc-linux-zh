    第 24 章，“进程控制](#ch24.xhtml)”]包含了关于启动、查看和控制进程（程序）的实验。


    第 25 章，“系统日志](#ch25.xhtml)”]将让你获得查看系统日志的实操体验，以及如何配置系统以创建自定义日志条目。


    第 26 章，“基于 Red Hat 的软件管理](#ch26.xhtml)”]包含了在 Fedora 和 CentOS 等基于 Red Hat 的系统上管理软件的实验。


    第 27 章，“基于 Debian 的软件管理](#ch27.xhtml)”]包含了在 Ubuntu 等基于 Debian 的系统上管理软件的实验。


    第 28 章，“系统启动](#ch28.xhtml)”]将让你练习配置 GRUB 和管理启动过程。


    第 29 章，“制定软件管理安全策略](#ch29.xhtml)”]将通过你利用在第 26 章–第 28 章中获得的知识提供创建安全策略的经验。此外，你还将探索
    CVE 报告。


    第 30 章，“足迹探测](#ch30.xhtml)”包含了涵盖黑客发现系统信息技术的实验。


    第 31 章，“防火墙](#ch31.xhtml)”探索了侧重于配置保护系统免受网络攻击的软件的实验。


    第 32 章，“入侵检测](#ch32.xhtml)”将提供使用工具和技术的经验，帮助你判断是否有人破解了你系统的安全性。


    第 33 章，“其他安全任务](#ch33.xhtml)”包含了涵盖各种附加 Linux 安全特性的实验，包括 `fail2ban` 服务、VPN 和文件加密。


    # 第一部分 Linux 简介


    ## 第 1 节 发行版和核心组件


    本实验的目标是帮助你安装在后续实验中将使用的三个操作系统。在继续之前，应在你的系统上安装 Oracle Virtual Box。你还需要至少 8GB 的内存（宿主机操作系统占用
    4GB，虚拟机占用 4GB）。请注意，虽然你将安装三个 Linux 发行版，但在这些实验的任何时候，只有一个处于“激活”状态（已启动）。


    你还需要总共 36GB 的硬盘空间用于存放这三个发行版（两个发行版每个使用 10GB 空间，另一个使用 16GB 空间）。


    ### 实验 1.1 安装 CentOS


    步骤 1. 进入 [`wiki.centos.org/Download`](https://wiki.centos.org/Download) 并点击镜像链接获取
    ISO 镜像：


    ![显示下载 CentOS Linux ISO 镜像窗口的截图。](img/01fig01.jpg)


    步骤 2. 点击你选择的镜像站点，然后点击 `CentOS-7-x86_64-Everything-1708.iso` 链接下载文件。下载文件需要时间。


    步骤 3. 启动 Oracle VirtualBox，然后点击 `New`新建）按钮。


    步骤 4. 在 Name（名称）框中输入 `CENTOS 7 - for class`。


    步骤 5. 将内存大小更改为 `4196 MB` 并点击 `Create`（创建）按钮。


    步骤 6. 将文件大小更改为 `10.00 GB`。


    步骤 7. 将物理硬盘存储更改为 `Fixed Size`（固定大小）并点击 `Create`（创建）按钮。


    步骤 8. 返回 Oracle VirtualBox 主界面后，点击 `Start`（启动）按钮。


    步骤 9. 点击下拉列表旁边的小文件夹图标，导航到你下载 CentOS ISO 文件的位置。选择该文件，然后点击 `Open`（打开）按钮。


    步骤 10. 点击 `Start`（启动）按钮。


    步骤 11. 点击安装窗口，然后在 CentOS 7 界面，按按 `Enter` 键开始安装，或等待计时器结束自动开始安装。


    注意


    你可以按下 `Esc` 键来跳过漫长的媒体检查。此外，要“退出”虚拟机，请按下右侧的 `Ctrl` 键（键盘右侧的 `Ctrl` 键）。


    步骤 12. 在 Welcome to CENTOS 7 界面，点击 `Continue`（继续）按钮以接受默认的安装语言——英语。


    步骤 13. 点击 `Installation Destination`（安装位置）按钮。


    步骤 14. 在 Local Standard Disks（本地标准磁盘）下，多次点击 `10 GiB` 磁盘图标直到其被标记为选中。当磁盘图标旁边出现勾标记时，即表示已选中。


    步骤 15. 点击窗口左上角的 `Done`（完成）按钮。


    步骤 16. 点击 `Network & Host Name`（网络与主机名）按钮。


    步骤 17. 点击 `Ethernet (enp0s3)` 旁边的图标将值从 `OFF`（关闭）更改为 `ON`（开启）。


    步骤 18. 点击 `Done`（完成）按钮返回 INSTALLATION SUMMARY（安装摘要）界面。


    步骤 19. 点击 `SOFTWARE SELECTION`（软件选择）按钮。


    步骤 20. 点击 `GNOME Desktop`。


    步骤 21. 点击 `Begin Installation`（开始安装）。


    步骤 22. 点击 `ROOT` 用户。


    步骤 23. 点击 `PASSWORD`（密码）按钮。


    步骤 24. 点击 `USER CREATION`（用户创建）按钮。


    步骤 25. 点击 `REBOOT`（重启）按钮。


    步骤 26. 点击 `LICENSE INFORMATION`（许可信息）按钮。


    步骤 27. 点击 `DONE`（完成）按钮。


    步骤 28. 点击 `CONFIGURATION`（配置）按钮。


    步骤 29. 以 `student` 登录。


    步骤 30. 点击 `Next`（下一步）按钮。


    步骤 31. 点击 `Next`（下一步）按钮。


    步骤 32. 关闭 `Location Services`（位置服务）。


    步骤 33. 点击 `Skip`（跳过）按钮。


    步骤 34. 点击 `Start using Linux`（启动 Linux）按钮。


    步骤 35. 对于下一个实验，你需要挂起 CentOS 操作系统。要挂起，点击右上角的关闭框。确保选择了 `Save the machine state`（保存机器状态），然后点击
    `OK` 按钮。当你再次需要使用 CentOS 时，双击 Oracle VM Manager 中的 `CENTOS 7 - for class (Saved)`
    图标。


    ### 实验 1.2 安装 Ubuntu


    步骤 1. 进入 [`www.ubuntu.com/download/desktop`](https://www.ubuntu.com/download/desktop)
    并点击 `Download`（下载）按钮。


    步骤 2. 点击 `Not now, take me to the download` 链接下载文件。


    步骤 3. 启动 Oracle VirtualBox 并点击 `New`（新建）按钮。


    步骤 4. 在 Name（名称）框中输入 `Ubuntu - for class`。


    步骤 5. 将内存大小更改为 `4196 MB` 并点击 `Create`（创建）按钮。


    步骤 6. 将文件大小更改为 `10.00 GB`。


    步骤 7. 将物理硬盘存储更改为 `Fixed Size`（固定大小）并点击 `Create`（创建）按钮。


