    includes labs on administering software on Debian–based systems, such as Ubuntu.


    [Chapter 28](#ch28.xhtml), “[System Booting](#ch28.xhtml),”] gives you practice
    configuring GRUB and managing the boot process.


    [Chapter 29](#ch29.xhtml), “[Develop a Software Management Security Policy](#ch29.xhtml),”]
    provides you with the experience to create a security policy using the knowledge
    you acquired in [Chapters 26](#ch26.xhtml)–[28](#ch28.xhtml). In addition, you
    will explore CVE reports.


    [Chapter 30](#ch30.xhtml), “[Footprinting](#ch30.xhtml),”] includes labs that
    cover the techniques that hackers use to discover information about systems.


    [Chapter 31](#ch31.xhtml), “[Firewalls](#ch31.xhtml),”] explores labs focused
    on configuring software that protects your systems from network-based attacks.


    [Chapter 32](#ch32.xhtml), “[Intrusion Detection](#ch32.xhtml),”] provides you
    with experience using tools and techniques that help you determine if someone
    has successfully compromised the security of your systems.


    [Chapter 33](#ch33.xhtml), “[Additional Security Tasks](#ch33.xhtml),”] includes
    labs that cover a variety of additional Linux security features, including the
    `fail2ban` service, VPNs, and file encryption.


    # Part I Introducing Linux


    ## Chapter 1. Distributions and Key Components


    The goal of this lab is to help you install the three operating systems that you
    will use during the remainder of the labs. Oracle Virtual Box should be installed
    on your system before you proceed. You will also need at least 8GB of RAM (4GB
    for your host operating system and 4GB for the virtual machine). Note that while
    you will be installing three Linux distributions, only one will be “active” (booted
    up) at any given point during these labs.


    You will also need 36GB total hard drive space for the three distributions (two
    distributions will use 10GB of space each, and the other will use 16GB of space).


    ### Lab 1.1 Installing CentOS


    Step 1. Go to [https://wiki.centos.org/Download](https://wiki.centos.org/Download)
    and click the mirrors link for the ISO images:


    ![A screenshot displays the download centOS Linux ISO images window.](graphics/01fig01.jpg)


    Step 2. Click on a mirror site of your choosing and then click on the `CentOS-7-x86_64-Everything-1708.iso`
    link to download the file. It takes some time for the file to download.


    Step 3. Start Oracle VirtualBox and then click the `New` button.


    Step 4. Enter `CENTOS 7 - for class` in the Name box.


    Step 5. Change the memory size to `4196 MB` and click the `Create` button.


    Step 6. Change the file size to `10.00 GB`.


    Step 7. Change the storage on physical hard disk to `Fixed Size` and click the
    `Create` button.


    Step 8. When you are returned to the main Oracle VirtualBox screen, click on the
    `Start` button.


    Step 9. Click on the small folder icon next to the drop-down list and navigate
    to the location where you downloaded the CentOS ISO file. Select that file and
    then click the `Open` button.


    Step 10. Click the `Start` button.


    Step 11. Click in the installation window and then at the CentOS 7 screen, either
    press the `Enter` key to start the installation or wait for the timer to run down
    and the installation to begin automatically.


    Note


    You can press the `Esc` key to avoid the lengthy media check. In addition, to
    “get out of” the virtual machine, press your right `Ctrl` key (the `Ctrl` key
    on the right side of your keyboard).


    Step 12. At the Welcome to CENTOS 7 screen, click the `Continue` button to accept
    the default installation language, English.


    Step 13. Click the `Installation Destination` button.


    Step 14. Under Local Standard Disks, click on the icon of the `10 GiB` disk multiple
    times until it is marked as selected. It is marked as selected when a checkmark
    appears next to the disk icon.


    Step 15. Click the `Done` button in the upper-left area of the window.


    Step 16. Click the `Network & Host Name` button.


    Step 17. Click the icon next to `Ethernet (enp0s3)` to change the value from `OFF`
    to `ON`.


    Step 18. Click the `Done` button to return to the INSTALLATION SUMMARY screen.


    Step 19. Click the `SOFTWARE SELECTION` button.


    Step 20. Click `GNOME Desktop`.


    Step 21. Click `Begin Installation`.


    Step 22. Click the `ROOT` button.


    Step 23. Click the `PASSWORD` button.


    Step 24. Click the `USER CREATION` button.


    Step 25. Click the `REBOOT` button.


    Step 26. Click the `LICENSE INFORMATION` button.


    Step 27. Click the `DONE` button.


    Step 28. Click the `CONFIGURATION` button.


    Step 29. Log in as `student`.


    Step 30. Click the `Next` button.


    Step 31. Click the `Next` button.


    Step 32. Turn off `Location Services`.


    Step 33. Click the `Skip` button.


    Step 34. Click the `Start using Linux` button.


    Step 35. For the next lab, you need to suspend the CentOS operating system. To
    suspend, click the close box (the `X`) in the upper-right. Make sure `Save the
    machine state` is selected and then click the `OK` button. When you want to use
    CentOS again, just double-click the `CENTOS 7 - for class (Saved)` icon in the
    Oracle VM Manager.


    ### Lab 1.2 Installing Ubuntu


    Step 1. Go to [https://www.ubuntu.com/download/desktop](https://www.ubuntu.com/download/desktop)
    and click the `Download` button.


    Step 2. Click the `Not now, take me to the download` link to download the file.


    Step 3. Start Oracle VirtualBox and click the `New` button.


    Step 4. Enter `Ubuntu - for class` in the Name box.


    Step 5. Change the memory size to `4196 MB` and click the `Create` button.


    Step 6. Change the file size to `10.00 GB`.


    Step 7. Change the storage on physical hard disk to `Fixed Size` and click the
    `Create` button.

