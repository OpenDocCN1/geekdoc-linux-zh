    for convenient access to downloads, updates, and corrections as they become available.
    To start the registration process, go to [www.pearsonitcertification.com/register](http://www.pearsonitcertification.com/register)
    and log in or create an account[*](#pref04.xhtml_fn1). Enter the product ISBN
    9780789760555 and click Submit. When the process is complete, you will find any
    available bonus content under Registered Products.


    [*](#pref04.xhtml_rfn1)Be sure to check the box that you would like to hear from
    us to receive exclusive discounts on future editions of this product.


    ## Figure Credits


    Figure 1-1 Courtesy of CentOS Corporation


    Figure 9-1 Courtesy of CentOS Corporation


    Figure 10-1 Courtesy of CentOS Corporation


    Figure 10-2 Courtesy of CentOS Corporation


    Figure 11-1 Courtesy of CentOS Corporation


    Figure 11-2 Courtesy of CentOS Corporation


    ## Introduction


    While developing *Linux Essentials for Cybersecurity*, it became clear that having
    hands-on experience would be very useful. Reading new content gets you only so
    far. To really become a Linux cybersecurity expert, you need practice. From that
    idea, this lab guide was born.


    You will note that there are three different types of labs in this book:


    *   Labs in which you are presented with a short problem that requires only a
    single operation to complete.


    *   Labs that are more complex but in which we provide you with a guide to perform
    each step, one at a time.


    *   Scenario labs in which you are asked to solve a problem entirely on your own.
    These labs are designed to pose a greater challenge.


    No matter the type, these labs are designed to be performed on live systems. While
    you could just write down the answers in some cases, I highly encourage you to
    work on Linux systems to complete all the labs. Not only will you get a sense
    of accomplishment, but the concepts and practices that are explored in *Linux
    Essentials for Cybersecurity* are more likely to find a permanent home in your
    brain.


    Enjoy the journey and remember to always stand on the light side of the cybersecurity
    force.


    ### Who Should Read This Book?


    It might be easier to answer the question “Who shouldn’t read this book?” Linux
    distributions are used by a large variety of individuals, including the following:


    *   Software developers


    *   Database administrators


    *   Website administrators


    *   Security administrators


    *   System administrators


    *   System recovery experts


    *   Big data engineers


    *   Hackers


    *   Government organizations


    *   Mobile users and developers (Android is a Linux distribution.)


    *   Chip vendors (Embedded Linux is found on many chip devices.)


    *   Digital forensic experts


    *   Educators


    This isn’t even a complete list! Linux is literally everywhere. It is the operating
    system used on Android phones. A large number of web and email servers run on
    Linux. Many network devices, such as routers and firewalls, have a version of
    embedded Linux installed on them.


    This book is for people who want to better use Linux systems and ensure that the
    Linux systems they work on are as secure as possible.


    ### How This Book Is Organized


    **[Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml),”**
    includes labs in which you will install the Linux distributions that you will
    use throughout the rest of this book.


    **[Chapter 2](#ch02.xhtml), “[Working on the Command Line](#ch02.xhtml),”** covers
    labs related to the essential commands needed to work in the Linux environment.


    **[Chapter 3](#ch03.xhtml), “[Getting Help](#ch03.xhtml),”** provides you with
    hands-on experience to get additional information on Linux topics.


    **[Chapter 4](#ch04.xhtml), “[Editing Files](#ch04.xhtml),”** incorporates labs
    in which you practice using the **vim** editor.


    **[Chapter 5](#ch05.xhtml), “[When Things Go Wrong](#ch05.xhtml),”** provides
    you with experience in how to handle problems that may arise in Linux.


    **[Chapter 6](#ch06.xhtml), “[Managing Group Accounts](#ch06.xhtml),”** contains
    labs that focus on group accounts, including how to add, modify, and delete groups.


    **[Chapter 7](#ch07.xhtml), “[Managing User Accounts](#ch07.xhtml),”** contains
    labs that focus on user accounts, including how to add, modify, and delete users.
    This chapter also has a lab for securing user accounts as well as a lab for configuring
    **sudo**.


    **[Chapter 8](#ch08.xhtml), “[Develop an Account Security Policy](#ch08.xhtml),”**
    provides you with practice creating a user security policy and how to test the
    security of accounts.


    **[Chapter 9](#ch09.xhtml), “[File Permissions](#ch09.xhtml),”** focuses on securing
    files using Linux permissions. These labs also dive into more advanced topics,
    such as special permissions, **umask**, access control lists (ACLs), SELinux,
    and file attributes.


    **[Chapter 10](#ch10.xhtml), “[Manage Local Storage: Essentials](#ch10.xhtml),”**
    includes labs that are related to the concepts involved with local storage devices,
    such as how to create partitions and filesystems and some additional essential
    filesystem features.


    **[Chapter 11](#ch11.xhtml), “[Manage Local Storage: Advanced Features](#ch11.xhtml),”**
    provides hands-on activities related to advanced features of local storage devices,
    including how to create encrypted filesystems. You will get practice creating
    and managing logical volumes.


    **[Chapter 12](#ch12.xhtml), “[Manage Network Storage](#ch12.xhtml),”** provides
    exercises that are focused on making storage devices available across the network.
    Filesystem sharing techniques such as Network File System, Samba, and iSCSI are
    included.


    **[Chapter 13](#ch13.xhtml), “[Develop a Storage Security Policy](#ch13.xhtml),”**
    provides you with the experience of creating a security policy using the knowledge
    you acquired in [Chapters 9](#ch09.xhtml)–[12](#ch12.xhtml). There is also a very
    important lab that covers performing filesystem backups.


    **[Chapter 14](#ch14.xhtml), “[Crontab and At](#ch14.xhtml),”** includes labs
    for managing the **crontab** and **at** systems.


    **[Chapter 15](#ch15.xhtml), “[Scripting](#ch15.xhtml),”** provides you with experience
    in shell scripting by having you create two shell scripts.


    **[Chapter 16](#ch16.xhtml), “[Common Automation Tasks](#ch16.xhtml),”** includes
    labs on creating shell scripts that are commonly used to automate tasks on Linux
    systems.


    **[Chapter 17](#ch17.xhtml), “[Develop an Automation Security Policy](#ch17.xhtml),”**
    provides you with the experience to create a security policy using the knowledge
    you acquired in [Chapters 14](#ch14.xhtml)–[16](#ch16.xhtml). This chapter also
    includes a hands-on lab on securing the **crontab** and **at** systems.


    **[Chapter 18](#ch18.xhtml), “[Networking Basics](#ch18.xhtml),”** provides labs
    that help you explore network components on Linux.


    **[Chapter 19](#ch19.xhtml), “[Network Configuration](#ch19.xhtml),”** covers
    the process of configuring your system to connect to a network, both on Ubuntu
    and CentOS.


    **[Chapter 20](#ch20.xhtml), “[Network Service Configuration: Essential Services](#ch20.xhtml),”**
    includes labs for configuring several network-based tools, including DNS and email
    servers.


    **[Chapter 21](#ch21.xhtml), “[Network Service Configuration: Web Services](#ch21.xhtml),”**
    provides the experience of configuring several network-based tools, including
    the Apache web server and Squid.


    **[Chapter 22](#ch22.xhtml), “[Connecting to Remote Systems](#ch22.xhtml),”**
    includes labs on configuring LDAP, FTP, and SSH servers.


    **[Chapter 23](#ch23.xhtml), “[Develop a Network Security Policy](#ch23.xhtml),”**
    provides you with the experience to create a security policy using the knowledge
    you acquired in [Chapters 18](#ch18.xhtml)–[22](#ch22.xhtml).'
