    \ the `inet_interfaces` setting for `Postconf`.\n\nStep 4. Change the value of\
    \ the `inet_interfaces` setting to `all`.\n\nStep 5. Change the value of the `myhost`\
    \ setting to `testserv`.\n\nStep 6. Create an email alias so email for the root\
    \ user will be sent to the student user.\n\nStep 7. Execute the correct command\
    \ to save the changes to the `/etc/alias` file to the Postfix database.\n\n##\
    \ Chapter 21. Network Service Configuration: Web Services\n\nThese labs should\
