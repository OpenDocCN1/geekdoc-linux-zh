    ### Lab 1.3 Installing Kali


    Step 1. Visit `https://www.kali.org/downloads/` and click the `HTTP` link in the
    `Kali Linux 64 Bit` row. It takes some time to download the file.


    Step 2. Start Oracle VirtualBox and click the `New` button.


    Step 3. Enter `Kali - for class` in the `Name` box.


    Step 4. Change the memory size to `4196 MB` and click the `Create` button.


    Step 5. Change the file size to `16.00 GB`.


    #### Note

    The settings in this case are not the same as for the CentOS and Ubuntu installations.
    Kali Linux has more software and requires a bigger disk.


    Step 6. Change the storage on physical hard disk to `Fixed Size` and click the
    `Create` button.


    Step 7. When you are returned to the main Oracle VirtualBox screen, click the
    `Start` button.


    Step 8. Click the small folder icon next to the drop-down list and navigate to
    the location where you downloaded the Kali ISO file. Select that file and then
    click the `Open` button.


    Step 9. Click the `Start` button.


    #### Note

    The Kali operating system typically “captures” the mouse, so you will likely need
    to use the right `Ctrl` button to return to the host operating system.


    Step 10. Use the down arrow key to move to `Graphical install` and press the `Enter`
    key.


    Step 11. At the Select a language screen, click the `Continue` button.


    Step 12. At the Select your location screen, choose your geographic location.


    Step 13. At the Configure the keyboard screen, click the `Continue` button.


    Step 14. At the first Configure the network screen, click the `Continue` button
    to accept the default host name.


    Step 15. At the second Configure the network screen, click the `Continue` button
    leave the domain name blank.


    Step 16. At the Set up users and passwords screen, provide a password of your
    choosing for the root account.


    Step 17. At the Configure the clock screen, choose your time zone and then click
    the `Continue` button.


    Step 18. At the first Partition disks screen, click the `Continue` button to use
    the default `Guided - use entire disk` option.


    Step 19. At the second Partition disks screen, click the `Continue` button to
    use the available disk.


    Step 20. At the third Partition disks screen, click the `Continue` button to use
    the default `All files in one partition` option.


    Step 21. At the fourth Partition disks screen, click the `Continue` button to
    use the default `Finish partitioning and write changes to disk` option.


    Step 22. At the fifth Partition disks screen, click the circle next to `Yes` and
    then click the `Continue` button.


    Step 23. On the first Configure the package manager screen, click the `Continue`
    button.


    Step 24. On the second Configure the package manager screen, click the `Continue`
    button.


    Step 25. On the first Install the GRUB boot loader on a hard disk screen, click
    the `Continue` button.


    Step 26. On the second Install the GRUB boot loader on a hard disk screen, click
    on the line that starts with `/dev/sda` and then click the `Continue` button.


    Step 27. On the Finish the installation screen, click the `Continue` button.


    Step 28. After the system has rebooted, log in as the root user.


    Step 29. For the next lab, you need to suspend the Ubuntu operating system. By
    suspending, you can start again quickly from the Oracle VirtualBox manager. To
    suspend, click the close box (the `X`) in the upper-right corner. Make sure `Save
    the machine state` is selected and then click the `OK` button. When you want to
    use `Ubuntu` again, just double-click the `Ubuntu - for class (Saved)` icon in
    the Oracle VM VirtualBox Manager window.


    ## Chapter 2 Working on the Command Line


    These labs should be performed on the Ubuntu system.


    ### Lab 2.1 Manage Files


    Step 1. Open a terminal window.


    Step 2. Display your current directory.


    Step 3. Using an absolute pathname, switch to `/etc`.


    Step 4. Using a relative pathname, move to `/etc/skel`.


    Step 5. Using a relative pathname, move up one directory.


    Step 6. List the files in the current directory.


    Step 7. Perform a “long display” listing of the current directory.


    Step 8. List all the files in the current directory that begin with the letter
    `s`.


    Step 9. Run the command that will determine the type of contents in `/etc/group`.


    Step 10. Display only the last five lines of `/etc/group` file.


    Step 11. Execute the command to return to your home directory.


    Step 12. Make a directory named `data` in the current directory.


    Step 13. Copy the `/etc/passwd` file into the data directory.


    Step 14. Copy the `/etc/ppp` directory into the current directory (and ignore
    any “Permission denied” error messages).


    Step 15. Rename the `ppp` directory that is located in the current directory to
    `peers`.


    Step 16. Update the timestamp of the `data/passwd` file to the current date and
    time.


    Step 17. Create a new empty file named `test` in the `data` directory.


    Step 18. Delete the `data/passwd` file.


    Step 19. Delete the `peers` directory.


    ### Lab 2.2 Using Shell Features


    Step 1. Open a terminal window.


    Step 2. Display the value of the `HOME` variable.


    Step 3. Display all the shell variables and values.


    Step 4. Display the value of the `TEST` variable. (Note that this variable currently
    has no value.)


    Step 5. Change the current shell so that an error message will be displayed when
    an undefined variable is used.


    Step 6. Modify the `PATH` variable to include the `/opt` directory.


    Step 7. Create a new environment variable named `EVENT` and set it to the value
    `now` by using a single command.


    Step 8. Display all the environment variables.


    Step 9. Create an alias in the current shell for the `ls` command so it will run
    the command `ls -a`.


    Step 10. Display all the aliases for the current shell.


    Step 11. Remove the `fgrep` alias from the current shell.


    Step 12. Display a list of previously executed commands.


    Step 13. Re-execute the last `ls` command from the history list.

