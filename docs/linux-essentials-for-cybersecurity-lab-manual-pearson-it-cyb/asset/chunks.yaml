    ## 第 3 章 获取帮助


    这些实验应该在你在第 1 章 “发发行版与关键组件](#ch01.xhtml)”]中安装的 Ubuntu 操作系统上进行。在开始此实验之前，请登录到你在安装过程中创建的学生账户。


    ### 实验 3.1 使用 `man` 获取帮助


    第 1 步打开一个终端窗口。


    第 2 步显示 `ls` 命令的帮助页（man page）。


    第 3 步搜索术语 `sort`。


    第 4 步继续搜索，直到找到按文件大小排序的选项。


    第 5 步退出 man 页。


    第 6 步确定 `ls` 命令所在的章节。


    第 7 步在 man 页中搜索关键词 `list` 并输出管道给 `less` 命令。


    第 8 步执行 `su -` 命令切换到 root 账户。（在提示提示时输入 root 密码。）


    第 9 步运行命令更新 man 页面数据库。


    第 10 步运行 `exit` 命令返回学生账户。


    第 11 步更改 `MANPATH` 变量以包含 `/var/man` 目录。


    第 12 步执行带有显示命令帮助信息的选项的 `ls` 命令。


    第 13 步使用 `help` 命令显示关于 `umask` 命令的信息。


    ### 实验 3.2 使用 `info` 获取帮助


    第 1 步打开一个终端窗口。


    第 2 步执行不带参数的 `info` 命令。


    第 3 步转到文件权限（File permissions）部分。


    第 4 步转到模式结构（Mode Structure）部分。


    第 5 步输入命令移动到下一个节点（应该是节点 27.2）。


    第 6 步输入命令返回到上一个节点（应该是节点 27.1）。


    第 7 步输入命令返回到父节点（应该是节点 27）。


    第 8 步输入命令返回到你上次所在的节点（应该是 27.1）。


    第 9 步退出 info 页面。


    #### 注意事项


    从现在起，你可能需要通过查看 man 或 info 页面来完成实验。


    ## 第 4 章 编辑文件


    这些实验应该在你在第 1 章 “发发行版与关键组件](#ch01.xhtml)”]中安装的 Ubuntu 操作系统上进行。在开始此实验之前，请登录到你在安装过程中创建的学生账户。


    在此实验中，答案可能因操作不同而有所差异，因为在 `vim` 中完成各种任务有多种方法。


    ### 实验 4.1 使用 `vim` 编辑器文件


    第 1 步打开一个终端窗口。


    第 2 步将 `/usr/share/doc/git-doc/user-manual.txt` 文件复制到你的当前目录（选择此文件是因为它是系统自带的且是一个相当大的文件）。


    第 3 步用 `vim` 编辑器打开 `user-manual.txt` 文件。


    第 4 步向下移动 12 行。


    第 5 步在插入模式（insert mode）下，输入：`*****`


    第 6 步返回到命令模式（command mode）。


    第 7 步跳转到第 43 行。


    第 8 步删除当前行。


    第 9 步向下移动一行。


    第 10 步在当前行下方打开一个新行。


    第 11 步在文档中输入以下文本：`Review this data`


    第 12 步返回到命令模式。


    第 13 步跳转到文件顶部。


    第 14 步向前移动三个句子。


    第 15 步向前移动四个单词。


    第 16 步搜索术语 `example`。


    第 17 步继续搜索的下一次出现处。


    第 18 步删除当前单词。


    第 19 步跳转到文档末尾。


    第 20 步在文档末尾粘贴来自缓冲区区的文本。


    第 21 步返回到文件顶部。


    第 22 步将整个文档中所有 `project` 出现处替换为 `program`。


    第 23 步保存并退出文档。


    第 24 步运行 `vimtutor`，然后按照该程序中的步骤操作。


    ## 第 5 章 当出现问题时


    这些实验应该在你在第 1 章 “发发行版与关键组件](#ch01.xhtml)”]中安装的 Ubuntu 操作系统上进行。在开始此实验之前，请登录到你在安装过程中创建的学生账户。


    ### 实验 5.1 故障排除问题


    你不会在书中直接找到此实验的答案。故障排除需要探索和阅读文档——这些技能你将在实验中习得。


    第 1 步打开一个终端窗口。


    第 2 步执行命令 `ls /var`。


    第 3 步第 2 步失败。查看错误信息并确定原因。


    第 4 步运行什么命令可以确定目录名称？


    第 5 步执行正确的命令查看日志所在的目录。


    第 6 步运行 `head -N 7 /etc/passwd`。


    第 7 步第 6 步失败。可以使用什么命令来确定正确的选项？


    第 8 步根据你阅读文档的内容执行正确的命令。


    第 9 步执行以下命令：`cp /etc/passwd /var`。


    第 10 步第 9 步失败。可以使用什么命令来确定正确的选项？


    第 11 步根据命令失败的原因，确定一个可以拷贝该文件的位置，并执行正确的命令。


    ### 实验 5.2 配置用户通知


    第 1 步打开一个终端窗口。


    第 2 步使用 `su -` 命令切换到 root 账户（使用你在安装过程中为 root 设置的密码）。


    第 3 步修改正确的文件，更改命令行登录提示以显示当前日期、节点名称和当前登录系统的用户数。


    第 4 步修改正确的文件，更改网络登录提示以显示消息 **Welcome to this system**。


    第 5 步修改正确的文件，在建立 SSH 连接时显示第 4 步中的网络登录提示。


    第 6 步执行以下命令重启 SSH 服务并启用第 5 步中的更改：`service ssh restart`。


    第 7 步打开一个新的终端窗口。


    第 8 步通过登录远程系统来测试 SSH 提示：`ssh localhost`。


    第 9 步输入 `exit` 命令退出 SSH 连接。（只运行一次此命令；运行第二次会导致你的终端窗口关闭。）


    第 10 步返回你原始的窗口，你在其中是以 root 用户身份登录的。（保持第 7 步的终端窗口开启创建一个每日消息文件，在用户登录后显示 **Restricted
    server - only log in if you have been authorized**。


    第 11 步返回你在第 7 步打开的终端窗口，再次运行 `ssh localhost` 命令以测试每日消息文件。


