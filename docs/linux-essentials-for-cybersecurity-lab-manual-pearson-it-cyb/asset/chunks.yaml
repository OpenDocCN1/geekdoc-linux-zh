    \ command, list all processes that are running on this system that end in *sh*.\n\
    \nStep 6. Display all processes that are running by using the `top` command. (Keep\
    \ this command running for the next few steps.)\n"
  raw: 'Step 10. Use the *cat* command to display the contents of the file that contains
    the persistent IP address settings.


    Step 11. Use the *ping* command to determine if the [ubuntu.com](http://ubuntu.com)
    system is accessible via the network. (Send 10 ping requests only.)


    Step 12. Use the *traceroute* command to display the routers that are used to
    connect to the [ubuntu.com](http://ubuntu.com) system.


    Step 13. Reboot your system to revert all the networking settings back to the
    original.


    ## Chapter 20\. Network Service Configuration: Essential Services


    These labs should be performed on the CentOS operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin these labs, log in to the student account that you created during
    the installation process.


    ### Lab 20.1 Configuring a BIND Server


    Note


    Creating a full BIND server is beyond the scope of this book. In this lab you
    will create and explore the components of a caching-only server. A caching-only
    server should be used only by the local system.


    Step 1. Open a terminal window.


    Step 2. Switch to the root account by using the **su** command.


    Step 3. Run the **yum** command to install the **bind** and **bind-utils** software
    packages.


    Step 4. Edit the **/etc/named.conf** file to look as follows:


    [Click here to view code image](#ch20_images.xhtml_p0105_1a)


    ```

    listen-on port 53 { 127.0.0.1; any; };

    allow-query     { localhost; any; };

    allow-query-cache       { localhost; any; };

    ```


    Step 5. Test the syntax of the **/etc/named.conf** file.


    Step 6. Restart the **named** service.


    Step 7. Check the status of the **named** service.


    Step 8. Enable the **named** service.


    Step 9. Execute the following commands to ensure that your firewall allows for
    DNS queries:


    [Click here to view code image](#ch20_images.xhtml_p0105_2a)


    ```

    firewall-cmd --add-port=53/udp

    firewall-cmd --add-port=53/udp --permanent

    ```


    Step 10. Test the service by executing the following command:


    [Click here to view code image](#ch20_images.xhtml_p0105_3a)


    ```

    dig @localhost onecoursesource.com +trace

    ```


    ### Lab 20.2 Configuring a Postfix Server


    Step 1. Open a terminal window.


    Step 2. Switch to the root account by using the **su** command.


    Step 3. View the current value of the **inet_interfaces** setting for **Postconf**.


    Step 4. Change the value of the **inet_interfaces** setting to **all**.


    Step 5. Change the value of the **myhost** setting to **testserv**.


    Step 6. Create an email alias so email for the root user will be sent to the student
    user.


    Step 7. Execute the correct command to save the changes to the **/etc/alias**
    file to the Postfix database.


    ## Chapter 21\. Network Service Configuration: Web Services


    These labs should be performed on the CentOS operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin these labs, log in to the student account that you created during
    the installation process.


    ### Lab 21.1 Configuring and Administering an Apache Server


    **Scenario:** Install the **httpd** web server package and configure it as follows:


    *   Ensure that a test **index.html** page appears when you go to the main web
    server site (aka, **localhost**). This page should display the text **server up**.


    *   Change the log level to **info**.


    *   Limit the number of clients to 25.


    *   Use an **.htaccess** file to create a secured directory named **docs**.


    *   Create an Apache user named **student** that can access the **docs** directory.


    ### Lab 21.2 Configuring a Proxy Server


    **Scenario:** Configure your local system to act as a proxy server. By default,
    Squid is configured as a forward proxy server on port 3128\. After installing
    Squid, start the service and use Firefox to test the proxy server.


    ## Chapter 22\. Connecting to Remote Systems


    These labs should be performed on the CentOS operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin these labs, log in to the student account that you created during
    the installation process.


    ### Lab 22.1 Configuring an FTP Server


    **Scenario:** Install and configure a VSFTPD server for the local system that
    meets the following objectives:


    *   Disables anonymous FTP access


    *   Denies the bob user account access to the FTP server


    *   Limits the FTP server to two FTP client sessions


    *   Disables the ability for regular users to upload files via the FTP server


    ### Lab 22.2 Administering an SSH Server


    **Scenario:** Configure the SSH server for the local system to meet the following
    objectives:


    *   Allow only Protocol 2 connections.


    *   Set the logging level to **VERBOSE**.


    *   Do not permit root logins.


    *   Deny the user bob the ability to log in via SSH.


    ## Chapter 23\. Develop a Network Security Policy


    These labs should be performed on the CentOS operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    ### Lab 23.1 Administering Kernel Security Parameters


    **Scenario:** Implement the following kernel parameter changes so they are persistent
    across reboots:


    *   Ignore all ping requests.


    *   Ignore all broadcast requests.


    *   Enable TCP SYN protection.


    *   Disable IP source routing.


    ### Lab 23.2 Securing a System with TCP Wrappers


    **Scenario:** Implement the following TCP Wrappers rules:


    *   Allow SSH connections from all hosts.


    *   Allow connections to the Very Security FTP server from hosts in your local
    network.


    *   Allow connections to the xinetd server for any clients that can be resolved
    via the hostname resolver tool.


    *   Block access to all other services that use TCP Wrappers from all systems.


    ### Lab 23.3 Configuring Network Time Protocol


    **Scenario:** Configure your system to use the following NTP servers to configure
    the system time:


    *   0.pool.ntp.org


    *   1.pool.ntp.org


    *   2.pool.ntp.org


    *   3.pool.ntp.org


    ### Lab 23.4 Creating a Networking Security Policy


    This lab does not have a specific correct answer. The goal is to use what you
    learned in [Chapters 19](#ch19.xhtml), [20](#ch20.xhtml), [21](#ch21.xhtml), and
    [22](#ch22.xhtml) of **Linux Essentials for Cybersecurity** to develop security
    policies for user and group accounts.


    As a starting point, you can make use of some excellent sample security policies
    located at [https://www.sans.org/security-resources/policies](https://www.sans.org/security-resources/policies).
    Note that you may find some policies on this site very useful, as some are specific
    to accounts. While you can make use of some of the policies on this site and make
    use of the format of the policies, you should also include original work that
    you create, based on what you have learned in [Chapters 19](#ch19.xhtml), [20](#ch20.xhtml),
    [21](#ch21.xhtml), and [22](#ch22.xhtml) of **Linux Essentials for Cybersecurity**.


    # Part VI Process and Log Administration


    ## Chapter 24\. Process Control


    These labs should be performed on the CentOS operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    ### Lab 24.1 Managing System Processes


    Step 1. Open a terminal window.


    Step 2. List the processes that are running in the current shell.


    Step 3. List all processes that are running on this system.


    Step 4. Using the **grep** and **ps** commands, list all processes that are running
    on this system that end in *sh*.


    Step 5. Using the **pgrep** command, list all processes that are running on this
    system that end in *sh*.


    Step 6. Display all processes that are running by using the **top** command. (Keep
    this command running for the next few steps.)'
