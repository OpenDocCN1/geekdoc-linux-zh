    ### 实验 19.1 在 CentOS 上理解网络配置


    为了帮助避免破坏网络，本实验侧重于查看信息而非进行永久更改。


    1. 在 CentOS 上打开终端窗口。

    2. 使用 `ifconfig` 命令显示网络配置。

    3. 使用 `nmcli` 命令确定网络管理器是否激活。

    4. 使用 `arp` 命令显示 ARP 表。

    5. 使用 `route` 命令显示路由表。

