    # Part IV Automation


    ## Chapter 14. Crontab and At


    These labs should be performed on the Ubuntu operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    ### Lab 14.1 Managing crontab


    Step 1. Open a terminal window.


    Step 2. Execute the command that will allow you to edit the current user’s `crontab`
    file.


    Step 3. After you have entered the editor, add a `crontab` entry that will run
    the `who` command at 5:50 p.m. every weekday (Monday through Friday) and send
    the output of the command to the `/home/student/who-there` file.


    Step 4. Save your changes and exit the editor.


    Step 5. Execute the command that will allow you to view the current user’s `crontab`
    file.


    Step 6. Use the `su` command to switch to the root account.


    Step 7. Execute the command that will allow you to view the student user’s `crontab`
    file.


    Step 8. Modify the system so the student user can no longer use the `crontab`
    command.


    Step 9. Execute the command to return to the student account.


    Step 10. Execute the command that will allow you to view the current user’s `crontab`
    file. Note that this command should fail because of the action you took in step
    8.


    Step 11. Use the `su` command to switch to the root account.


    Step 12. Execute the command that will allow you to view the student user’s `crontab`
    file (and read the message that tells why this command fails). Note that while
    the student user can no longer execute `crontab` commands, the previous `crontab`
    entry for this user still exists.


    Step 13. Execute the command to view the `/var/spool/cron/crontabs/student` file.
    Note that this command has the same output as `crontab -l -u student` when the
    student user still had access to the `crontab` command. This is because this file
    is where the student user’s `crontab` file is stored.


    Step 14. Delete the `/var/spool/cron/crontabs/student` file and then use the `systemctl
    restart cron` command to restart the `crontab` service.


    Step 15. View the primary system `crontab` file. You will not be making changes
    to this file, but based on what you see in this file, describe the tasks that
    are performed.


    Step 16. Execute the correct command to view the commands that will be executed
    by the system `crontab` once per day.


    Step 17. Execute the correct command that displays the content of the directory
    that holds *additional* system `crontab` entries.


    ### Lab 14.2 Configuring at Commands


    Step 1. Open a terminal window.


    Step 2. Using the `at` command, execute a command at 2 p.m. tomorrow. You will
    be removing this `at` job, so the actual command is not really important. For
    example, you can execute the `ls` command.


    Step 3. List the `at` jobs for the current user.


    Step 4. Remove the `at` job you created in step 2.


    ## Chapter 15. Scripting


    These labs should be performed on the Ubuntu operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    Note


    When reviewing the lab answers for this chapter, keep in mind that when it comes
    to creating programs, there is not any single correct answer. If your program
    meets the goal of the scenario, then you have completed the task.


    ### Lab 15.1 Script Project #1


    **Scenario:** In some cases, people who are not strong in Linux may need to run
    specific commands. To make this easier, you can create a menu-driven program.


    For this scenario, create a menu-driven program that has the following options:


    1. List users who are logged in (using the `who` command)

    2. List system information (using `uname -v`)

    3. List the five largest files in the current directory (using `ls -lS`)

    4. List basic CPU information (using `lscpu | head`)

    5. Display system time (using `date`)

    6. Exit the program


    The program should continue in a loop until the user chooses 6. The program should
    also produce an error message if an invalid option is chosen.


    ### Lab 15.2 Script Project #2


    **Scenario:** Often one the biggest challenges with a script is validating user
    input. Even simple things like ensuring that a valid integer is entered can result
    in a fair amount of code.


    For this scenario, create a program that validates user input so that only an
    integer (whole number), positive or negative, is allowed.


    ## Chapter 16. Common Automation Tasks


    These labs should be performed on the Ubuntu operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    ### Lab 16.1 Script Project #3


    **Scenario:** Performing system checks manually can be time consuming, and the
    process is often overlooked. For this scenario, create a shell script that searches
    the entire system for the following files:


    *   SUID files

    *   SGID files (not directories)

    *   Files and directories that have the write permission set for the “others”
    permission set, not including symbolic links.


    This script should create a report in the `/var/reports` directory. The report
    should include all the aforementioned files, and the filename should be `file-report-*`,
    where `*` is replaced with the current system date.


    Test the script as the root user and then have this script run nightly at 3:15
    a.m. by adding a file in the `/etc/cron.d` directory.


