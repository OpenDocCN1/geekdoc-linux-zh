    for each.


    ### Lab 29.2 Managing and Securing Legacy Services


    *Scenario:* You have been asked to install a `tcpmux` server on the current system
    to be used with a legacy application from another system. Begin by installing
    the `xinetd` package. Then configure the `tcpmux` server, considering the following
    requirements:


    * If there are more than 20 connection attempts per second, disable the service
    for 30 seconds.

    * Permit only two active connections at a time.


    # Part VIII Security Tasks


    ## Chapter 30. Footprinting


    These labs should be performed on the CentOS operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin these labs, log in to the student account that you created during
    the installation process.


    ### Lab 30.1 Using Probing Tools


    Step 1. Open a terminal window.

    Step 2. Switch to the root account.

    Step 3. Execute the `nmap` command to probe for open TCP on the local system.

    Step 4. Execute the `nmap` command to probe for open UDP on the local system.

    Step 5. Execute the `nmap` command to probe for ports 5000–10000 on the local
    system.

    Step 6. Execute the `netstat` command to display a summary of network packet information
    by protocol.

    Step 7. Execute the `netstat` command to display the routing table.

    Step 8. Execute the `netstat` command to display all listening sockets.

    Step 9. Execute the `lsof` command to open network sockets.

    Step 10. Execute the `lsof` command to open network sockets without resolving
    hostnames or port names.


    ### Lab 30.2 Scanning the Network


    Step 1. Open a terminal window.

    Step 2. Switch to the root account.

    Step 3. Execute the `nmap` command for all systems in the 192.168.10.0 Class C
    network.

    Step 4. Execute the `tcpdump` command to capture 10 packets.

    Step 5. Execute the `tcpdump` command to capture 10 packets with full verbose
    data output.

    Step 6. Execute the `ifconfig` command to determine the name of your primary network
    interface.

    Step 7. Execute the `tcpdump` command to capture 10 packets specifically on the
    primary interface network.

    Step 8. Execute the `tcpdump` command to capture 10 packets for any SSH connection
    on the primary interface network.

    Step 9. Execute the `tcpdump` command to capture 500 packets. Save the output
    to the file named `/tmp/tcpdump.data`.

    Step 10. Execute the `tcpdump` command to view the contents of the `/tmp/tcpdump.data`
    file.


    ## Chapter 31. Firewalls


    This lab should be performed on the CentOS operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    ### Lab 31.1 Creating a Firewall to Protect a System


    **Scenario:** Using the `iptables` command, create a firewall for the local system
    that meets the following objectives:


    * Allows incoming connections for the SSH and FTP ports from any system

    * Allows incoming connections for the telnet port for any system in the 192.168.1.0/24
    network

    * Logs all other incoming connections

    * Drops all other incoming connections by changing the default policy


    Note: Do not save the changes you make during this lab exercise.


    ## Chapter 32. Intrusion Detection


    This lab should be performed on the CentOS operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin this lab, log in to the student account that you created during
    the installation process.


    ### Lab 32.1 Creating an Intrusion Detection Security Plan


    This lab doesn’t have a specific correct answer. The goal is to use what you learned
    in [Chapter 32](#ch32.xhtml) of Linux Essentials for Cybersecurity to develop
    security policies for intrusion detection.


    As a starting point, you can make use of some excellent sample security policies
    available at [https://www.sans.org/security-resources/policies](https://www.sans.org/security-resources/policies).
    You may find some policies at this site very useful, as some are specific to accounts.
    For example, there is a sample policy called Disaster Recovery Plan Policy. While
    you can make use of some of the policies on this site and make use of the format
    of the policies, you should also include original work that you create, based
    on what you have learned in [Chapters 9](#ch09.xhtml), [10](#ch10.xhtml), [11](#ch11.xhtml),
    and [12](#ch12.xhtml) of Linux Essentials for Cybersecurity.


    ## Chapter 33. Additional Tasks


    These labs should be performed on the CentOS operating system that you installed
    in [Chapter 1](#ch01.xhtml), “[Distributions and Key Components](#ch01.xhtml).”
    Before you begin these labs, log in to the student account that you created during
    the installation process.


    ### Lab 33.1 Configuring fail2ban


    *Scenario:* Install the `fail2ban` software and configure it, keeping in mind
    the following:


    * Set the ban length to 5 minutes.

    * Set the number of failures to 10.

    * Set the `findtime` setting to 10 minutes.

    * Make sure the service is enabled.


    ### Lab 33.2 Encrypting Files with gpg


    Step 1. Open a terminal window.

    Step 2. Create `gpg` keys using RSA and RSA encryption. Use `Joe User` for the
    Real Name, `joe@user.com` for the email address, and default values at all the
    other prompts.

    Step 3. Create a public key file named `testkey` for Joe User.

    Step 4. Import the `testkey` public key into the GPG database.

    Step 5. Copy the `/etc/hosts` file to your home directory.

    Step 6. Copy the `/etc/hosts` file to your home directory.

    Step 7. Encrypt the `hosts` file that is in your home directory using the public
    key that you created in step 2.


    ## Code Snippets


    Many titles include programming code or configuration examples. To optimize the
    presentation of these elements, view the eBook in single-column, landscape mode
    and adjust the font size to the smallest setting. In addition to presenting code
    and configurations in the reflowable text format, we have included images of the
    code that mimic the presentation found in the print book; therefore, where the
    reflowable format may compromise the presentation of the code listing, you will
    see a “Click here to view code image” link. Click the link to view the print-fidelity
    code image. To return to the previous page viewed, click the Back button on your
    device or app.

