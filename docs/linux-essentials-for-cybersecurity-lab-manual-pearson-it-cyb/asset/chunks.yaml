    *Linux Essentials for Cybersecurity Lab Manual* 副本，以便方便获取下载、更新和更正内容。要开始注册过程，请访问
    [www.pearsonitcertification.com/register](http://www.pearsonitcertification.com/register)
    并登录或创建账户。输入产品 ISBN 9780789760555 并点击 `Submit`。流程完成后，您将在“Registered Products”（注册产品）下找到任何可额外内容。


    请务必勾选您希望接收我们的消息的框，以获取该产品未来版本的专属折扣。


    ## 图片致谢


    - 图 1-1 由 CentOS Corporation 提供

    - 图 9-1 由 CentOS Corporation 提供

    - 图 10-1 由 CentOS Corporation 提供

    - 图 10-2 由 CentOS Corporation 提供

    - 图 11-1 由 CentOS Corporation 提供

    - 图 11-2 由 CentOS Corporation 提供


    ## 引言


    在开发 *Linux Essentials for Cybersecurity* 的过程中，我清楚地意识到拥有实践经验将非常有帮助。仅仅阅读新内容只能让你进步有限。要真正成为一名
    Linux 网络安全专家，你需要实践。正基于这一理念，本实验指南应运而生。


    你会注意到书中共有三种不同类型的实验：


    - 实验：向你展示一个简单的问题，只需一次操作即可完成。

    - 实验：较为复杂，我们会为你提供指南，指导你逐一执行每个步骤。

    - 场景实验：要求你完全独立地解决问题。这些实验旨在提出更大的挑战。


    无论何种类型，这些实验都设计为在实机系统中进行。虽然在某些情况下你可以直接写下答案，但我强烈建议你在 Linux 系统上操作完成所有实验。这不仅会让你获得成就感，而且在
    *Linux Essentials for Cybersecurity* 中探索的理念和实践更有可能在你的脑中留下永久的记忆。


    尽享受这段旅程，并记住始终站在网络安全力量的光明的一面。


    ### 谁应该读这本书？


    回答“谁不应该读这本书？”这个问题可能更容易一些。Linux 发行版被许多类型的人使用，包括：


    - 软件开发人员

    - 数据库管理员

    - 网站管理员

    - 安全管理员

    - 系统管理员

    - 系统恢复专家

    - 大数据工程师

    - 黑客

    - 政府机构

    - 移动用户和开发者（Android 是一个 Linux 发行版）

    - 芯片供应商（许多芯片设备上都了嵌入式 Linux）

    - 数字取证专家

    - 教育工作者


    这甚至不是一个完整的列表！Linux 简直无处不在。它是 Android 手机使用的操作系统。大量的 Web 服务器和电子邮件服务器运行在 Linux 上。许多网络设备（如路由器和防火墙）也安装了嵌入式
    Linux 版本。


    这本书是为那些想要更好地使用 Linux 系统，并确保他们所工作的 Linux 系统尽可能安全的人准备的。


    ### 本书的结构


    - **第 1 章, “发行版与核心组件”**，包含了实验，你将在实验中安装书中其余部分将使用的 Linux 发行版。

    - **第 2 章, “命令行操作”**，涵盖了与在 Linux 环境工作所需的必备命令相关的实验。

    - **第 3 章, “获取帮助”**，为你提供了获取 Linux 某主题额外信息的实操经验。

    - **第 4 章, “编辑文件”**，包含了让你练习使用 `vim` 编辑器的实验。

    - **第 5 章, “当问题出现时”**，为你提供了处理 Linux 中可能出现问题的经验。

    - **第 6 章, “管理组账户”**，包含了关注组账户的实验，包括如何添加、修改和删除组。

    - **第 7 章, “管理用户账户”**，包含了关注用户账户的实验，包括如何添加、修改和删除用户。本章还有一个用于用户账户安全的实验以及一个配置 `sudo`
    的实验。

    - **第 8 章, “制定账户安全策略”**，为你提供了创建用户安全策略以及测试账户安全性的实践。

    - **第 9 章, “文件权限”**，重点是使用 Linux 权限保护文件。这些实验还深入探讨了更高级的主题，如特殊权限、`umask`、访问控制列表 (ACL)、SELinux
    和文件属性。

    - **第 10 章, “管理本地存储：基础”**，包含了与本地存储设备概念相关的实验，例如如何创建分区和文件系统以及一些额外的基础文件系统功能。

    - **第 11 章, “管理本地存储：高级功能”**，提供了与本地存储设备高级功能相关的实践活动，包括如何创建加密文件系统。你将练习创建逻辑卷。

    - **第 12 章, “管理网络存储”**，提供了关于跨网络提供存储设备的练习。包含了网络文件系统 (NFS)、Samba 和 iSCSI 等技术。

    - **第 13 章, “制定存储策略”**，为你提供了利用第 9 章到第 12 章所学知识创建安全策略的实践。还有一个关于文件备份的重要实验。

    - **第 14 章, “Crontab 和 At”**，包含了管理 `crontab` 和 `at` 系统的实验。

    - **第 15 章, “脚本编写”**，通过让你创建脚本来提供经验。

    - **第 16 章, “常见自动化任务”**，包含了用于自动化 Linux 系统任务的脚本实验。

    - **第 17 章, “制定自动化安全策略”**，为你提供了利用第 14 章到第 16 章所学知识创建安全策略的经验。本章还有一个加固 `crontab`
    和 `at` 系统的实践实验。

    - **第 18 章, “网络基础”**，提供了帮助探索 Linux 网络组件的实验。

    - **第 19 章, “网络配置”**，涵盖了配置系统连接网络的过程，包括 Ubuntu 和 CentOS。

    - **第 20 章, “网络服务配置：基础服务”**，包含了配置若干网络工具的实验，包括 DNS 和电子邮件服务器。

    - **第 21 章, “网络服务配置：Web 服务”**，提供了配置若干网络工具的经验，包括 Apache Web 服务器和 Squid。

    - **第 22 章, “连接远程系统”**，包含了配置 LDAP、FTP 和 SSH 服务器的实验。

    - **第 23 章, “制定网络安全策略”**，为你提供了利用第 18 章到第 22 章所学知识创建安全策略的经验。


