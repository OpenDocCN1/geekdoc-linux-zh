    # 典型程序


    下面的图显示了一个简单的程序，旨在要求计算机用户输入两个独立的值，并将其打印出来。让我们逐步分析这些代码行，理解每一行的含义。


    ## 第 1 行

    此行包含 `#include <iostream>`。它是程序的开始。


    `#include` 语句从 `<iostream>` 库中调用 `Cin` 和 `Cout` 命令。如果没有这一行，程序将无法接收也无法显示任何输入。


    ## 第 2 行

    `Using namespace` 是一个命令，而 `std` 代表“standard”（标准）是一个库。当你写 `Using namespace std`
    时，你正在将该库中的所有内容引入到你的类中，但这与使用 `#include` 命令并不一样。


    C++ 中的命名空间（Namespace）是将单词放在作用范围内的方法，任何在该范围之外的单词都看不到命名空间内部的代码。为了让命名空间之外的代码看到命名空间**内部**的代码，你必须使用
    `Using namespace` 命令。


    ## 第 4 行

    在这行中，`main()` 是一个函数，`int` 指定了函数将处理的值类型（整数）。C++ 中的函数是一组共同完成一个任务的语句。这是 C++ 中始终存在的第一个函数，并且必须始终编写。


    ## 第 5 行和第 14 行

    第 5 行和第 14 行的大括号表示复合语句的开始和结束。


    ## 第 6 行

    在这里，分配了两个变量，变量 `a` 和变量 `b`。如所述，变量是分配给 RAM 的用于存储数据的位置。因此，进行了两次内存分配来存储整数。变量 `a`
    被赋值为值 `10`，变量 `b` 被赋值为值 `20`。这个过程被称为初始化，即设置一个初始值，即使没有用户的输入，也有一个起始值。


    ## 第 7 行

    此行进行了初始化。`double` 类型的变量初始化方式与整数类型变量的初始化相同。


    ## 第 9 行

    此行使用了打印语句 `Cout`。它打印了语句“Enter the values for “a and b””，但不带引号。


    只有引号内的语句才会被打印。注意，语句“Enter the values for a and b”中编写 `a` 和 `b` 不显示变量 `a` 包含的值，它只会将其显示为字母，因为它们位于引号内。


    在该行的末尾，我们有一个保留字 `endL`。`endL` 单词导致其后的每个语句都从新的一行开始。


    ## 第 10 行

    此行包含 `Cin >>` 语句。`Cin` 语句提示用户为 `a` 和 `b` 输入值。如果没有计算机用户进行此类输入，程序将无法进行。


    ## 第 11 行

    观察发现，在语句 `Cout << “ Value of a: ” 中，可以看到冒号之后（引导用户预期的输入）在结束语句的引号之前有一个空格。这些空格将使程序在运行时，输出看起来如下所示：


    Value of a: 50


    然而，如果没有这个空格，输出将呈现这种形式：Value of a:50


    同时，孤立的 `a` 将显示用户输入的值。两个语句中间的 `endL` 在程序运行时将把 “Value of b: ” 移动到显示的下一行。


    ## 第 13 行

    `return 0;` 语句允许 `main` 函数返回一个整数数据类型。从技术来说，在 C 或 C++ 中，main 函数必须返回一个值，因为它被声明为“int
    main”。如果 main 声明为“void main”，就不需要 `return 0`。


    接下来，我们有一些运算符，它们允许我们执行一些操作。其中一些运算符包括——数学运算符、比较运算符，


    ### 数学运算符

    数学运算符：正如名称所示，它允许我们执行数学运算。我们在现实世界中拥有的数学运算符与我们这里的完全相同。它们是：

    - 加法

    - 减法

    - 乘法

    - 除法 &

    - 模运算 (Modulus)


    模数是你除法两个数时剩余的数。例如，当你将 5 除以 2 时，结果为 2，余数为 1。余数 `1` 就是模数。


    ### 比较运算符

    我们还有比较运算符，它们是：


    - **等等运算符 `==`**：值得注意的是，双等号运算符 (`==`) 的工作原理与单等号运算符 (`=`) 不同。单等号运算符用于给变量赋值，而双等号运算符比较两个变量之间的值，特别是当与条件语句一起使用时（条件语句稍后介绍）。例如，编写
    `a = b` 将 `b` 中的任何值赋值给 `a`。编写类似 `if a == b …`（其中“if”是一个条件语句）将确认 `b` 中包含的值与 `a`
    中的值是否相同。如果是，将执行由代码编写者指定的特定操作。


    - **不等运算符 `!=`**：该运算符正如名称所示，表示比较的两个或多个变量不相等。例如，`a != b` 意味着变量 `a` 和 `b` 中的值是不同的。


    - **与运算符 `&&`**：它代表单词“and”（和）。所以，例如如果你有：`a != c && b == a`。它可以被读为一个条件，意为“a 不等于
    c 且 b 等于 a。”


    - **或运算符 `|`**：就像我们每天使用的普通 OR（或）词一样，C++ 这里的含义也相同。`a != c | b == a`。上面的语句简单读为：“a
    不等于 c 或 b 等于 a”。


    ## 逻辑流

    现在，让我们通过一些实际的代码行，其中比较语句与一些条件语句一起使用。你已经看到上面代码的逻辑了吗？


    基本上，第 9 行表示，如果变量 `a` 中包含的值与 `b` 中的值相同，且 `c` 中的值不等于 `b`，那么第 11 行编写的语句“I will not
    sleep”将被显示。然而，如果这些条件中任何一个为（例如 `a` 不等于 `b` 或 `c` 等于 `d`），那么第 15 行读取“I will fight
    against sleep”的语句将被打印。


    ![](img/index-81_1.jpg)


    第 15 行写的 `else` 是一个条件语句，就像在现实世界中一样，意味着如果第 9 行的条件为**假**，则跳过第 11 行的语句，并考虑后面的另一个条件。


    如果用 `OR` 语句代替 `else` 语句，意味着第 9 行的条件只需要有一个为真（`a == b` 的值或 `c != d`），第 11 行的语句就会被考虑，并忽略第
    15 行。


    通过学习不同程序的一系列代码将增强理解，从长远来看让你习惯运算符及其各种功能以及如何使用它们。当实现这一点后，制作一个键盘记录器（Keylogger）的过程对你来说将毫不费力。


