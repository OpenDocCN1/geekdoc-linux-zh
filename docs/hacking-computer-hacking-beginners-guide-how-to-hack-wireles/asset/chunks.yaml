    `phishing`（网络钓鱼）。在黑客术语那种独特的命名传统中，phishing 是“fishing”（钓鱼）的同音词，其名称源于这种做法类似于在水中投入鱼钩，等待鱼儿上钩。典型的网络钓鱼邮件写得看起来像是来自银行、在线购物或服务账户，甚至是来自受害者组织内部某个部门的合法通信。通常，这些邮件会以请求确认或重置密码的形式呈现给用户。复杂的网络钓鱼信息会使用伪造的邮件头、具有说服力的语言以及与合法邮件几乎一致的格式。如果目标用户落入陷阱，他们将用用户名和密码回复邮件，或者点击在看似合法的表单中接受信息的网页链接。通常，一次网络钓鱼攻击会部署成千上封邮件，希望至少有一小部分接收者做出回应。


    与网络钓鱼不同，网络钓鱼向多个用户发送大量相同的邮件，就像在许多鱼面前投放鱼饵；`spear-phishing`（鱼叉式钓鱼）针对的是特定的用户——就像鱼叉者者瞄准某一条鱼。


    虽然 `spear-phishing` 不像网络钓鱼攻击那样产生大量账户，但它的成功率可能更高，因为更个性化的邮件通常更具说服力。执行良好的鱼叉式钓鱼邮件通常会通过名字称呼目标用户，并包含其他个人细节以使其看起来更真实。因此，在鱼叉式钓鱼攻击之前通常会进行一些研究或社会工程调查。在大多数情况下，进行这种攻击是因为黑客已经识别出目标个体拥有他们特别感兴趣的信息、资产或计算机访问权限。终极的鱼叉式钓鱼攻击针对组织中的高价值目标——通常是高管或拥有顶级访问权限的信息官。由于这些人是“大鱼”，这种攻击类型已被称为
    `harpooning`（鱼叉攻击）或 `whaling`（捕鲸攻击）。


    网络钓鱼、鱼叉式钓鱼和捕鲸攻击的目的不仅是为了获取密码。有时，它们被用于收集其他信息或向目标系统投递恶意软件。


    # 网络漏洞 (WEB EXPLOITS)


    有很多网络漏洞和相关的利用程序——新漏洞出现的速度与旧漏洞被修复的速度一样。几十种语言以各种组合组合创建一个网站或网络应用程序，漏洞可能存在于该结构的任何地方。


    此处列举了一些常见利用程序的示例，说明了黑客如何利用漏洞来获利。


    ## SQL 注入 (SQL INJECTION)


    SQL 数据库查询语言在全球范围内无处不在。它经常被用于其他网页代码中管理用户登录和数据库访问请求。由于数据库查询不可避免地包含来自用户输入的字符串，因此自然容易受到操纵。`SQL`
    `injection`（注入）是一种利用 SQL 语言本身语法的网络利用手段。SQL 使用 `AND` 和 `OR` 等布尔逻辑操作来连接语句段，包括用户输入的字符串。一个典型的用户登录
    SQL 语句可能看起来如下：


    ```

    SELECT * FROM database WHERE user = '' '''' + username + '''' '';

    ```


    上述语句将用户输入的与 user 字段对应的字符串插入到语句中的 `username` 变量中。该语句期望用户输入一个简单的、典型的用户名字符串。与大多数黑客寻求利用的漏洞一样，对用户输入字段的意外使用可能会导致意之外的行为。聪明的黑客学会了利用
    SQL 语法，通过在用户字段中输入特殊字符串来执行某些所需的 SQL 命令，从而获取用户账户的访问。例如，以下字符串在作为用户名输入时可能看起来是乱码或其他无趣的内容：


    ```

    '' OR ''1''=''1

    ```


    然而，如果 SQL 解释器字面上地处理生成的命令，它将读取：


    ```

    SELECT * FROM database WHERE user = '' '' OR 1=1;

    ```


    当此命令执行时，它会被读取为（用通俗的话来说）：


    “从数据库中选择用户为‘ ’ `OR` 1=1 的所有记录”


    可能没有任何用户名是空字符串，但 `OR` 关键字的存在意味着如果 `OR` 两侧的每个子句（`user = '' '' OR 1=1`）中有一个为真，命令就会执行。由于
    `1=1` 始终为真，命令必须执行。任何恒为真的语句都可以放在 `OR` 之后，但 `1=1` 是一个高效的选择。通过用户字符串插入命令段正是这种程序被称为“注入”的原因。这只是一个简单的例子，大多数网站现在都有了防止这种基础攻击的防御措施，但注入攻击（SQL
    之外的其他脚本也可能受到注入攻击）仍然是一个常见的威胁，并作为利用软件漏洞的说明性示例。有多个网站允许黑客对已知 SQL 漏洞的模拟网站进行注入攻击。


    ## URL 操纵 (URL MANIPULATION)


    网站的网络地址或通用资源定位符（`URL`）不仅包含网站资源文件网络位置的信息，通常还包含某些用户交互后传递给网络应用程序的其他信息。这些信息可能是编码的，或者遵循某种语义方案。作为一个简单的例子，考虑一个具有以下主
    URL 的虚构搜索引擎：


    `http://www.acmesearch.com/`


    当用户在表单中输入搜索词并点击提交时，网站可能会根据某种格式自动在 URL 后附加搜索词。这是将信息传递给网页脚本和数据库查询以满足用户请求的方法。因此，如果这个假设搜索引擎的用户正在搜索“beginner
    hacking”，网站可能会提交以下 URL（或类似的内容）：


    ```

    http://www.acmesearch.com/search?=beginner+hacking

    ```


    如果用户注意到这种模式，他们很容易发现自己可以绕过用于用户界面的表单，只需将搜索词输入到观察到的 URL 方案中。这种 `URL manipulation`
    在用于搜索引擎等服务时显然是相当无害的。然而，在网络电子商务的早期，这些简单的 URL 语义实际上被用于提交产品订单。没多久，黑客就学会了如何操纵支付金额以及订购的产品类型和数量。尽管大多数在线商家现在有了更安全的流程，但仍然有许多类型的网站和服务存在可以通过
    URL 操纵利用的漏洞。


    ## 跨站脚本与请求伪造 (CROSS-SITE SCRIPTING AND REQUEST FORGERY)


    某些网站允许用户通过这种方式与网站交互，用户的输入成为网站内容的一部分。对此最好的例子是带有用户评论（针对照片、文章等）的网站。


    这些评论通常由用户通过网页表单或类似的界面提交。如果攻击者能够输入评论以外的内容——通过 URL 操纵或直接输入表单字段——它就可能成为其他用户访问的网站代码的一部分。黑客已经学会了如何通过利用不防御此类攻击的服务器，通过这些表单字段向网站注入恶意代码。


