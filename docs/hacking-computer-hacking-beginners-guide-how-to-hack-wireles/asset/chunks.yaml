    注入的代码可以被写成这种方式：其他用户甚至不知道他们的浏览器正在运行注入的代码。这种活动已被称为跨站脚本（XSS），黑客可以利用它在用户机器上植入恶意代码，或劫持用户身份以登录目标机器。


    当用户登录到安全网站时，该网站会授予其对服务器上资源的访问权限。通常情况下，这种访问仅授予该特定用户用于单次登录会话。一旦用户注销或关闭网站，他们必须重新登录并开启新会话才能再次访问。


    会话信息通过使用 `cookies` 存储在用户系统中，`cookies` 是包含特定会话状态有用信息的小文件。会话 cookie（或`身份验证 cookie`）让服务器知道用户当前处于登录状态。如果黑客能够截获一个不安全的会话
    cookie，他们可以在自己的机器上复制它，并在用户处于当前会话期间利用它获取目标系统的访问权限。例如，如果用户登录了他们的银行账户，银行放置在其计算机上的会话
    cookie 会让银行服务器知道可以允许用户访问该账户。如果黑客能够在自己的机器上获取那个特定的会话 cookie，他们就可以欺骗银行服务器允许他们访问该账户。黑客实现这一目的的方法是建立一个他们认为许多用户想要的虚假网站。由于用户经常同时打开多个标签页或浏览器窗口使用网页，黑客希望用户在登录某些安全账户的同时，也登录了他们的恶意网站。当用户与黑客网站进行交互时，他们会在不经意间通过自己的浏览器执行脚本，这些脚本向安全网站发送命令。由于安全网站（例如银行）在相应会话期间允许访问，它无法知道该请求是非合法的。这种攻击被称为
    `跨站请求伪造`（CSRF）。执行 CSRF 攻击的一种常见方法是将虚假的服务器请求注入到相对无害的内容中，例如图像链接或其他网页元素中。这使得代码被隐藏在用户的视线之外。


    在上述说明的 SQL 注入、URL 操纵、跨站脚本和跨站请求伪造案例中，被利用的漏洞可以通过在执行前检查用户输入是否存在可疑内容来被相当容易地缓解。网站程序员已经察觉了许多此类攻击方法，并尝试在向用户提供访问和服务的的同时，降低网站的脆弱性。这就是为什么理解黑客的本质以及不同类型的攻击如此重要的原因。


    # 第 6 章 恶意活动与代码


    拉丁语根词“mal”简单来说意思是“坏”。因此，恶意活动的特征是具有伤害的意图。在黑客攻击中，这种伤害可能表现为金钱、财产或声誉的盗窃。它可能仅仅是为了破坏本身或为了实现其他目的。由于现在有许多关键系统都已经数字化、互联并在线，黑客有潜力造成大规模或大规模的破坏。


    ## 拒绝服务攻击


    当我们在街上看到一个想要与之交谈的人（无论是朋友还是陌生人）时，我们通常不会直接走过去并开始谈论脑海中的任何话题。人类通信的通用协议是首先执行某种问候。人们可能会说“你好”（或某种变体）并说出对方的名字，也许还会快速握手——然后当对方回应时，对话就开始了。在发起电话时也预期类似的程序，在这种情况下，它的目的更具实用性，因为对话的双方参与者通常都想确定自己正在和谁说话。对话中的前几个字用于确认双方的身份。这种协议也用于计算机网络通信。


    网络中的一个节点不会简单杂乱地发送请求、命令或数据，而是会尝试首先确认与其尝试通信的节点的存在和就绪状态。


    在正常的网络对话中（通常通过 `TCP` 协议），预期会发生三次握手（handshake）程序。在握手过程中，首先由对话发起者向接收者发送一个同步（`SYN`）包。该包包含发送者的
    `IP` 地址，包中的一个标志位指示接收者这确实是一个 `SYN` 包。如果 `SYN` 包成功送递且接收者已准备好通信，它将向发送者返回一个确认（`ACK`）包，包含自己的
    `IP` 地址以及一个指示其为 `ACK` 包的标志位。最后，原始发送者将向接收者发送一个 `ACK` 包，然后就可以开始正常通信。有时，数据包在网络节点之间的传输过程中由于某种原因丢失。这可能是由于高流量、网络硬件故障、电或电磁干扰以及其他原因。


    因此，如果发送者在规定时间内没有从目标接收者处收到 `ACK` 包，它将发送另一个同步请求。同样，接收者将无限传输 `ACK` 包，直到收到来自原始发送者的确认。一个没有丢包导致中断的正常握手总结如下：


    1) 发送者：`SYN` → 接收者

    2) 接收者：`ACK` → 发送者

    3) 发送者：`ACK` → 接收者

    4) 发送者 ⇄ 接收者


    任何给网络节点只有与有限数量的其他节点通信的能力。当黑客能够通过导致重复传输 `SYN` 和 `ACK` 包来破坏握手过程时，合法通信可能会被显著降低甚至完全停止。


    这种攻击被称为拒绝服务（DoS）攻击。


    ### 基础 DOS


    拒绝服务攻击背的核心思想是伪造 `IP` 包头中的标志位，以欺骗服务器发送重复的 `ACK` 请求。实现此点的最简单方法是破坏上述步骤二和步骤三之间的传统握手过程。当接收者向原始发送者发送
    `ACK` 请求时，它期望收到另一个 `ACK` 包以便开始通信。然而，如果发送者用另一个 `SYN` 请求作为响应，接收者将被迫响应另一个 `ACK` 包。如果这种往复持续下去，它就会占用服务器机器上的网络资源和端口。这种情况类似于一个永远完不了的“咚咚””笑话……（“咚咚”，“是谁呀？”，“咚咚”，“是谁呀？”，“咚咚”，“是谁呀？”，等）。这种简单的
    DoS 攻击被称为 `SYN 洪水`。执行 DoS 攻击有多种方法，其中大多数都利用了 `TCP/IP` 协议本身的漏洞。


    ### 分布式 DOS


