- fmt: '

    A `distributed denial-of-service` (DDoS) attack is one in which a hacker or a
    group of hackers is able to execute a coordinated DoS attack from a large number
    of machines. Working together, the machines transmitting the attack packets can
    simply overwhelm a target system to the point where the server is unreachable
    by legitimate users, or so slow in response to user requests that it is virtually
    unusable. In most cases, the machines that are transmitting the attack-related
    packets are not even in the possession of the hackers that are executing the attack.
    When hackers are preparing for a large DDoS attack, they implant malicious code
    on as many machines as possible that belong to users who are not knowing participants
    in the attack. Often, these machines are spread out over a large geographic area
    and multiple networks, sometimes even worldwide, making it difficult for authorities
    or the security personnel of a victimized system to cut off the attack.


    # MALWARE


    The word `malware` is a portmanteau describing malicious software. The term covers
    many different kinds of software that might be implanted on a target machine by
    hackers to either cause damage or seize control of all or a part of the target.
    Malware is a widespread and serious problem throughout the internet. There are
    myriad ways in which malware can behave once activated on a host machine. Some
    are designed to spread themselves to other machines and others remain covertly
    on a host machine to either gather confidential information for the hacker, tie
    up computer resources, or cause damage to the system. Sometimes malware is placed
    on a machine in order to later control that machine for use in attacks, such as
    DDoS, in coordination with other machines that have been taken over en masse.


    ## VIRUSES


    `Viruses` are the oldest and most commonly known type of malware. Like their biological
    namesakes, viruses are designed to spread from machine to machine, infecting large
    number of users, and sometimes entire self-contained networks in the process.
    These malicious devices are segments of code that attach themselves (just like
    biological viruses) to other programs that have otherwise legitimate purposes.
    When the legitimate program is activated by an unsuspecting user, the virus code
    is executed and can run without ever being noticed. When a virus is activated
    it makes a copy of itself and attempts to attach itself to other legitimate programs
    within the system or domain to which it has access. This allows the virus to spread
    throughout an individual node and also to other nodes on the network. A virus
    is not usually written by a hacker to simply spread itself around, however. Typically,
    the hacker has a specific task in mind for the virus to complete when it reaches
    its destination.


    Since it is designed to remain hidden, a virus can perform any number of actions
    on its host machine. It can collect personal and financial information and covertly
    use the computer’s own communications capabilities to relay the information back
    to the hacker. Other viruses are designed to delete information or cause disruptions
    in a computer’s operation or communication.


    A virus can even be written to cause physical damage to a computer system.


    For example, one particular virus that was widespread in the 1990’s was designed
    to cause the motor-controlled armature on the host’s optical hard drive to rapidly
    move back and forth until the motor failed. This sort of virus can do a great
    deal of damage to computer-controlled machinery that has network connectivity.


    ## WORMS


    `Worms` are similar to viruses in that they are designed to replicate and spread
    throughout a system or network. However, since viruses are part of larger programs,
    they must be downloaded by the user and their host program must be launched before
    the malicious code can be executed. Conversely, a worm is its own self-contained
    program. Worms also differ from viruses in that they do not require a user to
    open another program in order for them to execute. Once a worm infects a machine,
    it can replicate itself and then spread to another system through the network.


    Rather than causing damage or gaining access to systems, the purpose of a worm
    is normally to consume system and network resources in order to slow down or halt
    that system’s operation by occupying memory and network bandwidth. Occasionally,
    a worm may be used to gather information as well.


    ## BEWARE OF “GEEKS” BEARING GIFTS


    Legend has it that the epic war between the Achaeans (ancient Greeks) and the
    Trojans ended when the crafty hero Odysseus fashioned a giant wooden horse and
    left it at the gates of Troy as an apparent offering to the city. Unbeknownst
    to the grateful Trojans, who wheeled the large gift into their city and behind
    their notoriously secure walls, there was a contingent of Greek soldiers hiding
    inside the hollow belly of the horse. The soldiers emerged that night under cover
    of darkness to open the gates for the rest of the Achaean army, who entered and
    subsequently sacked the city. For thousands of years, whether true or not, this
    story has served as a cautionary tale - reminding us to be vigilant and that sometimes
    things which might seem harmless or innocent can lead to our downfall. In computer
    hacking, a `Trojan horse` is a piece of malware that appears to be legitimate
    or desirable software. It may even function normally in whatever purpose for which
    the user downloaded it. The typical purpose of a Trojan horse, often just called
    a “Trojan” is to give a hacker remote access and control of the target system.
    Any malware that is written to give a hacker surreptitious control over the processes
    of a user’s machine is known as a `rootkit`.


    Viruses, worms, and Trojans, as well as the various payloads that they deliver
    to target systems take a good bit of programming skill in their creation to be
    successful. Computer security professionals as well as anti-malware products focus
    a great deal of effort on thwarting these malicious programs. Hackers that deal
    in malware are constantly honing their skills and their creations are evolving
    in complexity.


    # CHAPTER 7. WIRELESS HACKING


    The proliferation of readily available Wi-Fi networks has made Wi-Fi one of the
    most common network mediums. Wi-Fi is in many ways superior to traditional copper
    wire physically connected networks. Aside from the convenience of connectivity
    and the flexibility of network configurations that wireless networks afford the
    users, the lack of physical infrastructure needed to complete the network makes
    it much cheaper and easier to implement than Ethernet. With this convenience,
    however, comes certain security concerns that are not associated with traditional
    hardwired networks. With a copper or fiber-based network, a physical connection
    is needed for a new machine to join the network. A hacker would normally have
    difficulty accessing the physical space of a target network and would likely arouse
    suspicion attempting to connect their own hardware to network cabling. Although
    the range of Wi-Fi is limited, it is omnidirectional and the radiofrequency signals
    admitted by the server and the various nodes on a wireless network traverse walls
    and other barriers and can be intercepted by anyone in range. This gives the hacker
    much more freedom to conduct a network intrusion without being detected.


    ## HACKING WI-FI

