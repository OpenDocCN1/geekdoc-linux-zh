    虽然我们在这里构建的键盘记录器（Keylogger）可能不是最先进的，也不具备你预期键盘记录器应有的那些超级功能，但凭借你通过构建此工具所积累的知识，只需稍加研究，制作出具有摄像头激活、屏幕截屏等其他酷功能的更高级版本对你来说将不是问题。


    此外，如果你学习了这门课程，预计你已经基本掌握了 `C++` 编程语言及其语法、工作原理，并且除了刚刚学会构建的键盘记录器之外，还能编写其他程序。


    继续实践、研究并为你沿途中遇到的问题问题寻找解决方案，你将看到巨大的进步。


    # 关于作者


    Alan T. Norman 是一位来自旧金山的、充满自豪、精明且遵守伦理的黑客。


    在斯坦福大学获得科学学士学位后，Alan 现在位于旧金山市中心的一家中型信息技术公司工作。他渴望为美国政府担任安全黑客，同时也热爱向他人教授技术的未来。Alan
    坚信，未来无论是在安全、公司成功还是未来的职业方面，都将严重依赖计算机“极客”。在空余时间，他喜欢分析和审视有关篮球运动的一切细节。


    # 结论


    在本书编写期间，可能会有几十甚至上百个新的计算机和网络漏洞及其相应的利用程序被开发出来。这就是黑客和信息安全世界的动态本质。秉持本指南开始时的精神——强调不断磨炼和获取技能与知识——有抱负的黑客应该以本书的基本大纲为基础，有条不紊地扩展每一个主题，深入研究他们最感兴趣领域的历史和当前最先进水平。最重要的是，他们应该构建一个无害的空间（无论是使用虚拟还是物理硬件）来同时练习漏洞利用和安全防护。最后，在开启黑客之旅之前，你应当在充分充分理解自己的目标和责任的基础上，与你活动的伦理、道德和法律影响达成和解。


    # 最后的一件事...


    你喜欢这本书吗？


    如果是，请通过在亚马逊上评论来告诉我！


    评论是独立作者的生命线。如果你只有一点点时间，哪怕只是寥几字和一个评分，我也将不胜感激。如果你不喜欢这本书，请告诉我！给我发邮件到 `alannormanit@gmail.com`，并告诉你不喜欢哪里！也许我可以改进。在当今世界，一本书不必是停滞不前的，它可以随着时间的推移和像你这样的者的反馈而改进。你可以影响这本书，我欢迎你的反馈。帮助这本书对所有人变得更好！


