    即使拥有了知识、机智以及恰当的顽强坚持，黑客仍然需要特定的物理工具来实施攻击。然而，黑客并不一定是一项昂贵的职业或爱好。黑客所需的大多数软件工具都可以免费，因为它们是开源产品。黑客也不需要数千美元的高性能计算设备——对于大多数攻击来说，一台内存、存储和处理器速度合理的简单笔记本电脑或台式电脑就足够了。几十年来，黑客以相对低廉的预算完成大量工作而闻名。虽然每个人都需要根据自己的特定目标决定需要什么种硬件和软件组合，但本章将作为指南，帮助理解黑客社区中有哪些可用且首选的选项。


    # 操作系统与发行版


    操作系统（OS）是计算机硬件与软件之间的中间器。操作系统通常负责管理文件系统、外设通信和计算机系统的用户账户等职责。有多种商业和开源操作系统品牌，可以安装在任何特定的计算机平台上。`Microsoft
    Windows` 是“PC”型系统最为人知且安装最多的商业操作系统。苹果公司拥有自己的操作系统，并预装在其计算机和移动系统中。谷歌的开源 `Android`
    操作系统正在迅速普及。


    `Linux` 操作系统以黑客文化中的传奇人物 `Linus Torvalds` 命名并由其开发，它是 `UNIX` 操作系统（苹果操作系统也基于 `UNIX`）的开源分支。多年来，`Linux`
    因其灵活性和移植性在黑客和硬核计算机爱好者中广受欢迎。通过其用户的不断钻磨，各种 `Linux` 发行版已演化出不同的用途。发行版通常通过其大小、用户界面、硬件驱动程序和预装的软件工具来区分。一些流行的
    Linux 发行版，如 `Red Hat` 和 `Ubuntu`，用于通用领域。另一些则是为特定任务和平台开发的。黑客“攻击”平台上的操作系统是其工具箱的核心。


    ## KALI LINUX


    `Kali` 前称为 `Backtrack`，是一种深受黑客喜欢的开源 Linux 操作系统。`Kali`（最新的 `Kali Linux` 发行版可以在
    `www.kali.org/downloads` 找到）可以安装在专用机器上，也可以在另一个操作系统的虚拟机中运行。多年来，`Kali` 演变为包含大量最有用的漏洞评估和利用程序。它是初学者黑客应该获取的首批工具之一。`Kali`
    不仅提供了使用 Linux 平台的练习，还包含了黑客执行某些最基础的底层攻击所需的所有内容，以便获得宝贵的经验。


    ![](img/index-27_1.jpg)


    带有工具菜单的 Kali Linux 截图


    ## 取证发行版


    `Linux` 操作系统也有几个免费发行版，旨在用于计算机取证分析。这些发行版包含了某些工具，允许安全专业人员在受害者机器上寻找计算机攻击的痕迹。黑客在练习攻击时也会使用这些发行版，以便学习如何避免被发现。


    ## 虚拟机


    `Virtual machines` 是在现有操作系统的范围内模拟某些硬件平台行为的程序。这允许用户在某块硬件上安装多个操作系统，将每一个都视为一台独立的机器。维护虚拟机不仅让黑客能够运行各种不同黑客工具的能力，还提供了一个无后果的“沙盒”来练习黑客技巧的机会。练习攻击的一种常用技术是在虚拟机内安装与潜在目标相同的操作系统，并练习攻击该系统的已知漏洞，甚至探测更多漏洞。获取旧的、废弃的操作系统免费版本（例如某些旧版本的
    `Windows` 发布）以及该特定版本的漏洞列表是非常容易的。在虚拟机上安装一个尚未通过最新安全更新的操作系统，为黑客提供了一个完美的练习攻击的方法，而无需担心损坏目标系统或触犯法律。


    # 编程语言


    计算机是人类的仆人，但如果没有清晰的指令，它们不知道做什么。由于机器的二进制语言对于人类程序员来说很难高效概念化，我们开发了更接近人类语言的编程语言，然后将其翻译成机器能理解。计算机语言已从简单的逐行脚本演变为更模块化的结构化语言，再到今天用于开发软件的高级面向对象语言。然而，脚本语言在计算机和网络运行仍然起着重要作用。由于程序是由人编写的，它们自然存在错误。这些错误不仅是实际编码中的无意失误，也是程序本身规划中的疏忽。这些错误正是黑客在尝试未经授权访问目标系统时寻找的。因此，对于黑客来说，获取必要的编译器和解释器以精通几种重要的编程语言，并至少基本熟悉其他几种语言是至关重要的。大多数编程工具都是开源的，并可以各种形式免费获得。


    ## 面向对象的语言


    面向对象的语言是高级计算机编程语言，完成后会被编译成可执行的机器码。程序员使用某种文本编辑程序来开发他们的代码。他们还需要一个适用于可执行程序将运行的计算机平台的编译器。某些软件开发工具还包含调试功能，允许程序员在程序编译之前发现语法和其他错误。面向对象的语言的核心思想是，计算机程序中的不同组件可以被视为具有某些`properties`（属性）的`objects`对象）。属性可以通过被称为`methods`方法）的过程进行操作，对象可以被放在不同的`classes`类）中。学习面向对象编程是志向黑客学习过程的重要部分。大量的在线和离线软件都是使用
    `C++` 和 `Java` 等面向对象的语言开发的。当黑客熟悉这些语言时，理解这些语言编写的程序中的漏洞并对其进行利用就变得可能。此外，黑客经常发现自己需要编写自己的软件来自动化攻击，或者在获得系统访问权限后帮助他们获取控制或传输数据。


    ## 解释型语言


