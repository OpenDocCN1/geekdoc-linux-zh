    # 引言


    黑客并不一定需要是工程师、计算机科学家，或者对微处理器或计算机硬件设计有深入的了解，但他们应该理解计算机是如何运作的、主要组件及其相互作用方式、计算机如何通过局域网和互联网联网、用户通常如何与机器交互，以及——最重要的一点——软件如何决定计算机的功能。一名优秀的黑客应该熟练并精通几种门计算机语言，并理解主要的操作系统。对于黑客来说，熟悉密码学的历史、数学和实践也是非常有有用的。


    一个几乎没有黑客经验、编程知识仅处于初级或中等水平的外行人员，对系统发动攻击是可能的，而且变得越来越普遍。人们通常使用脚本并遵循由经验丰富的操作人员开发的程序来实现这一点。


    这种情况最发生在简单的攻击中，例如拒绝服务攻击。这些缺乏经验的黑客在黑客社区中被称为 `script kiddies`（脚本小子）。这种类型活动的问题在于，执行者对他们正在运行的代码中发生了什么了解甚少，并且可能无法预见到副作用或其他意之外的后果。在尝试攻击之前，最好完全理解你正在做什么。


    ## 计算机与处理器


    计算机在尺寸、形状和用途上各不相同，但大多数本质上具有相同的设计。一个好的黑客应该研究计算机如何从 20 世纪最早的机器演变为我们今天使用的极其复杂的机器。在这个过程中，显而易见的是计算机具有相同的基本组件。要成为一名有效的黑客，你应该了解大多数现代计算机上不同类型的处理器。


    例如，三大微处理器制造商是 `Intel`、`American Micro Devices (AMD)` 和 `Motorola`。这些处理器构成了黑客会遇到的大多数个人电脑，但每种处理器都有自己独特的指令集。虽然大多数黑客很少需要处理机器层面的编程语言，但更复杂的攻击可能需要理解处理器指令集之间的差异。


    某些处理器可以由终端用户编程。这些被称为现场可编程门阵列 (`FPGA`)，并被越来越多地用于嵌入式系统，特别是工业控制。众许多黑客会在这些芯片生产期间获取其访问权限，以便在最终目的地部署恶意软件。对于这类复杂的攻击，理解
    `FPGA` 架构和编程是必要的。这些嵌入式攻击对于大规模购买芯片并用于关键系统的军事和工业客户来说，特别令人担忧。


    ## 网络与协议


    对于志向成为黑客的人，最重要的学习科目之一是网络架构和协议。计算机可以通过许多配置和规模进行联网，并由不同的技术管理它们之间的互连。从铜线、光纤，到无线和卫星连接，以及所有这些介质的组合，我们建立了一个遍布全球的巨大计算机网络。这个网络在大规模上作为一个整体来理解，也可以看作是较小的自包含网络的连接。


    从尺寸来说，计算机网络传统上被归类为局域网 (`LAN`) 和广域网 (`WAN`)。`WANs` 连接多个 `LANs`。不同规模的网络还有许多其他命名，随着新技术和导电性的发展，术语总是在变化。跟上这些变化是黑客持续的任务之一。


    网络也有不同的架构。架构不仅取决于不同节点的配置，还取决于连接它们的介质。最初，网络化计算机总是通过铜线连接的。常用的铜质网线（通常被称为 `ethernet`
    电缆）由双对绞铜线组成。虽然这些电缆中最常见的是五类或 `CAT-5` 电缆，但它正开始让位于新标准 `CAT-6` 之后，后者具有更大的信号传输能力。对于极高速应用和更长距离，通常会选择光纤。光纤使用光而不是电，具有极高的信息携带能力。它们被用于传输大多数现代电缆电视和高速互联网服务。光纤是互联网的骨干。在较小的区域内，无线网络非常常见。使用无线局域网
    (`Wi-Fi`) 协议，无线网络存在于大量的个人、私人商业 `LANs` 中。黑客通常对破解 `Wi-Fi` 网络特别感兴趣，这导致了 `Wi-Fi` 安全标准的演进。


    无论架构或传输介质如何，当两个终端跨网络通信时，它们必须使用一组被称为 `protocol` 的通用规则进行通信。网络协议自第一批计算机网络创建以来一直在演变，但它们保留了相同的底层分层方法。通常，网络被概念化为执行不同功能的不同层。这也被称为
    `stack`（栈）。今天使用的最常见的通信协议是互联网协议 (`IP`) 和传输控制协议 (`TCP`)。合在一起时，它们通常被称为 `TCP/IP`。这些协议偶尔会发生变化并进行标准化。对于黑客来说，学习这些协议以及它们如何与
    `stack` 不同层之间的通信相关至关重要。这就是黑客如何获得系统更高级别访问权限的方式。


    ## 编程语言


    对于从未做过的人来说，从零开始学习编程语言可能令人生生畏，但许多人发现，一旦你精通了一种编程语言，学习其他语言就会容易且快速得多。


    黑客不仅需要理解编程语言以便利用软件漏洞，许多黑客还需要编写自己的代码以能够执行特定的攻击。阅读、理解和编写代码是黑客技术的基础。


    编程语言的范围从非常晦涩的机器码（以二进制和十六进制格式表示，用于直接与处理器通信）到用于软件开发的高级面向语言。常见的高级面向语言有 `C++` 和 `Java`。在高级语言中编写的代码被编译成特定处理器的相应机器码，这使得高级语言在不同类型的机器之间具有非常好的移植性。另一类是脚本语言，命令是逐行执行的而不是编译成机器码。


    学习编程语言需要时间和实践——没有其他方法可以精通。编写、调试和重新编译代码的漫长夜晚和宵战是初级黑客常见的入礼。


    '
- fmt: '

    Even armed with knowledge, resourcefulness, and just the right amount of stubborn
    perseverance, the hacker still needs a certain set of physical tools to conduct
    an attack. However, hacking does not have to be an expensive profession or hobby.
    Most of the software tools that a hacker needs can be obtained freely because
    they are open-source products. Nor does a hacker need thousands of dollars in
    high-powered computing equipment - for most attacks, a simple laptop or desktop
    computer with a reasonable amount of memory, storage, and processor speed will
    suffice. Over the decades, hackers have become notorious for accomplishing a great
    deal on relatively low budgets. Although each individual will need to decide for
    themselves what combination of hardware and software they need for their particular
    goals, this chapter will serve as a guide to help understand what different options
    are available and preferred in the hacking community.


    # OPERATING SYSTEMS & DISTRIBUTIONS


    An operating system (OS) is the intermediary between a computer’s hardware and
    software. An OS typically manages the file system, peripheral communication, and
    user accounts of a computer system, among other responsibilities. There are several
    brands of operating systems, both commercial and open source, that can be installed
    on any given computer platform. `Microsoft Windows` is the most commonly known
    and installed commercial OS for “PC” style systems. Apple has its own OS that
    comes installed on its computer and mobile systems. Google’s open source `Android`
    OS is rapidly gaining popularity.


    The `Linux` operating system, named for and developed by `Linus Torvalds` - a
    legendary figure in hacker culture - is an open-source offshoot of the `UNIX`
    (Apple’s OS is also based on `UNIX`) operating system. `Linux` gained popularity
    among hackers and hard-core computer enthusiasts over the years for its flexibility
    and portability. Various distributions of `Linux` have evolved for different purposes
    through constant tinkering by its users. Distributions are typically distinguished
    from each other by their size, user interface, hardware drivers and the software
    tools that come pre-installed. Some popular Linux distributions, like `Red Hat`
    and `Ubuntu`, are for general use. Others have been developed for specific tasks
    and platforms. The operating system on a hacker’s “attack” platform is the heart
    of his or her toolkit.


    ## KALI LINUX


    Formerly known as `Backtrack`, `Kali` is a popular open source Linux operating
    system for hackers. `Kali` (the most recent distributions of `Kali Linux` can
    be found at `www.kali.org/downloads`) can be installed on a dedicated machine,
    or run from a virtual machine within another operating system. Over the years
    `Kali` has evolved to contain a large array of the most useful vulnerability assessment
    and exploitation programs. It is one of the first tools that a beginning hacker
    should obtain. `Kali` not only provides practice using a Linux platform, but also
    contains everything a hacker needs to perform some of the most basic lower-level
    attacks in order to gain valuable experience.


    ![](index-27_1.jpg)


    A Screenshot of Kali Linux With a Menu of Tools


    ## FORENSIC DISTRIBUTIONS


    the `Linux` OS is also available in several free distributions that are intended
    to be used for forensic computer analysis. These distributions contain tools that
    allow security professionals to look for traces of a computer attack on a victim
    machine. Hackers also use these distributions when they are practicing attacks
    so that they can learn how to keep from being detected.


    ## VIRTUAL MACHINES


    `Virtual machines` are programs that emulate the behavior of certain hardware
    platforms within the confines of an existing operating system. This allows a user
    to install several operating systems on one piece of hardware, treating each one
    as if it were a separate machine. Maintaining virtual machines not only gives
    the hacker the ability to run various different hacking tools, but also provides
    the opportunity to practice hacking skills in a consequence-free “sandbox”. A
    common technique for practicing attacks is to install an operating system that
    is equivalent to a potential target within a virtual machine, and to practice
    attacking that system’s known vulnerabilities, and even probing for more. It is
    fairly easy to obtain free versions of old, defunct operating systems - like some
    of the older `Windows` releases - along with a list of the vulnerabilities of
    that particular version. Having an OS installed on a virtual machine that has
    not been patched with its latest security updates gives the hacker a perfect way
    to practice attacks without the worry of damaging a target system or running afoul
    of the law.


    # PROGRAMMING LANGUAGES


    Computers are the servants of mankind, but they don’t know what to do without
    clear instructions. Since the binary language of machines is very difficult for
    human programmers to efficiently conceptualize, we developed programming languages
    that are closer to human language which can then be translated for the machine
    to understand. Computer languages have evolved from simple line-by-line scripts,
    to more modular structured languages, to the advanced object-oriented languages
    that are used to develop software today. Scripted languages, however, still play
    a major part in computer and network operations. Since programs are written by
    people, they are of course subject to error. These errors are not only unintended
    mistakes in the actual coding, but oversights in the planning of the program itself.
    These errors are what hackers look for when attempting to gain unauthorized access
    to their target systems. It is therefore fundamental for hackers to obtain the
    compilers and interpreters necessary to become fluent in a few important programming
    languages, and at least minimally familiar with several others. Most of these
    programming tools are open-source and freely available in one form or another.


    ## OBJECT-ORIENTED LANGUAGES


    Object-oriented languages are high-level computer programming languages that are
    compiled upon completion into executable machine code. Programmers use some sort
    of text editing program to develop their code. They also need a compiler that
    is appropriate to the computer platform on which the executable program will be
    run. Some software development tools also contain debugging functions that allow
    the programmer to discover syntax and other errors before the program is compiled.
    Object-oriented languages are centered around the idea that different components
    in a computer program can be treated as `objects` with certain `properties`. The
    properties can be manipulated by procedures known as `methods`, and objects can
    be placed into various `classes`. Learning object-oriented programming is a vital
    part of the learning process for an aspiring hacker. A great deal of software,
    both online and off-line, is developed using object-oriented languages like `C++`
    and `Java`. Understanding the vulnerabilities in programs that are written in
    these languages, and subsequently exploiting them, becomes possible when a hacker
    is familiar with the languages. In addition, hackers often find themselves needing
    to write their own software to automate attacks or to help them gain control or
    transfer data once they have access to a system.


    ## INTERPRETED LANGUAGES

