    The Keylogger we built isn’t too awesome majorly because of the way it records
    information. When we test ran it, we discovered that it couldn’t handle spaces
    and tabs alike but just saved the input anyway. Let us build more functions into
    our Keylogger so it will become better at handling inputs. We can achieve this
    by utilizing `Switch` statements. Let’s get into it right away!


    ## Incorporating the Switch Statement


    Mention was made earlier that in order for us to equip our Keylogger with the
    capability of handling spaces, tabs and other characters we will have to utilize
    the `switch` statement. However before we bring in our `switch` statement, we
    will need to group our previously written codes under one function: `void log()`,
    to make things easier for us. Our grouping will be done as shown in the figure
    below:


    ![](index-107_1.jpg


    So on Line 8 the function `void` with name `log` is created to house our previous
    codes. This function will return no value. Furthermore, as required `void` is
    called within the `main` function on Line 8 so it can be used at any time by simply
    calling it and not having to re-write it all over again. On re-testing the program,
    it will run just like it did previously.


    With reference to the figure above:


    Delete `write << c;` on Line 27. We will put this back later as a default case
    so incase our conditional statements all evaluate to false, it will be executed.
    For the main time let’s take it out so we could put our cases in place.


    As on Line 28, write the `switch` statement and pass whatever happens in the variable
    `c` (which we created earlier) to `switch` by parenthesizing it so whatever comes
    into the variable is handled by `switch`.


    Let’s create a `case` (one of different conditions), say `case 8`. So, if the
    variable `c` has a numerical value of 8 (as in `case 8`) in ASCII it


    ![](index-108_1.jpg


    ![](index-108_2.jpg


    means it is a back space. We keep on adding cases utilizing different numbers
    from the ASCII code depending on what the numbers represent, so our Keylogger
    can relate to almost any character a user inputs.


    So; said in other words, what the statements from Line 22 to 35 does this: Line
    22 covers values from the ASCII code within 8 and 222. Line 24 has a conditional
    `if` statement which checks to see if there has been any key interruptions i.e.
    if any key on the users keyboard has been pressed and if this evaluates to `true`,
    the function on Line 26 should take note of it, store it in a file defined on
    the same line as `Record.text` and also make sure that later inputs do not overwrite
    earlier ones. The `switch` statement on Line 28 lets the cases which are evaluated
    within Line 30 and 34 be passed into the variable `c`, describing every step of
    the way, what key, be it a backspace, the enter key, escape key etc. a user presses
    on his keyboard instead of giving us those tab spaces it gave earlier. Line 35
    will save the keystrokes of the user -supposing he doesn’t press any of the keys
    within number 8 to 222 of the ASCII codes or any of those our cases cover- the
    way it did in our primitive Keylogger.


    Time has to be taken to include cases that will cover a lot of possible characters
    that can be utilized for a username or password, as this will make the Keylogger
    save user inputs in a way that will be understood. Let’s take a look at upper
    and lower case letters.


    ![](index-110_1.jpg


    ## Upper and Lower Case Letters


    Just as important as the upper and lower case letters are to the English language,
    they are important too to general programming especially when it comes to utilizing
    them for the purpose of the Keylogger. We have to learn how to differentiate between
    the two letter cases. We will also be doing a little bit of filtering with the
    tab, caps lock, shift, alt, arrow and mouse keys too.


    Well, we can differentiate between the upper and lower case letters by using the
    state of the shift key; we can also use the state of the arrow key too. So if
    either of these two keys is pressed then please write capital letters otherwise
    write lower case letters. This is what we want to tell our program. By default,
    the program above will write in capital letters so we have to define the state
    for lower case letters.


    It’s true that slight changes has been made to the program for our Keylogger shown
    in the figure above, nevertheless do not gather butterflies in your stomach as
    we will analyze the whole program. We made mention that the first Keylogger we
    made was a primitive one, gradually we are going into the more sophisticated ones.


    One of the things we have changed is the variable in which our keystrokes are
    placed. We changed its name from `c` to `key`. Giving names that fit the information
    to be placed in variables is good practice as it helps in the location of any
    information very easily or should in case you are working with a team of other
    code writers, they will be able to locate whatever function they


    ![](index-111_1.jpg


    On line 23, we have incorporated the `sleep` function though it has be commented
    out for the time being it will be used later on. The `sleep` function helps prevent
    the CPU from maxing (causing it to slow down) out as a result of running repetitively.
    However the `sleep` function is not the best solution for preventing the CPU from
    maxing out but for now we will use it to avoid getting into any complex matters.


    While the `Sleep()` function will pause the program for any number of milliseconds
    put within the parenthesis (e.g. `sleep(1), sleep(2), sleep(5)…` etc.), the `sleep()`
    function with zero within its parenthesis (i.e. `sleep(0)`) does something different.
    It tells the program to stop using the CPU whenever another program wants to use
    it.


    Let us go ahead and analyze the code from Line 31 down to 43 as it is a block,
    which works together.


    Note that `Key += 32` is equivalent to `Key = Key + 32`.


    The block of codes displayed in figure above is one created for the purpose of
    distinguishing between the upper and lower case letters.


    Line 30 contains an `if` statement which basically say: `if` the value of `key`
    is greater than `64` (all values from ASCII code) but lesser than `91` and the
    `shift` key is not pressed (written as `!(GetAsyncKey(0x10))`) -where `0x10` is
    the hexadecimal notation for the Shift key- please add `32` to the previous key
    values. It is worthy of note that the range `64 to 91` within the `if` conditional
    statements was not just chosen at random but on intent owing to the fact that
    letters of the alphabet fall between this range on the ASCII table.


    ![](index-112_1.jpg


    From the cutout of the ASCII code displayed in the figure below, doing some little
    math, we will see why we chose the number `32` to be added to the values in `key`
    within our conditional `if` statement on Line 31.


    Our `if` conditional statement on Line 31 stated: `if` `key` is greater than `64`…
    this means during evaluation, `Key` will be read from the number `65`. Now take
    a look at the number `65` on the ASCII table under the character column. `65`
    represents the upper case letter A.


    Now, if `32` is added to `65` the result is `97`. Take a look at the char column
    of number `97` on the ASCII table, does the number `97` represent the lower case
    letter `a`? Yes does does


    Remember that by default our Keylogger program will use upper case letters and
    like the codes within Line 31 and 33 states, **if the shift key is not pressed**
    (**to make the letter uppercase**) then the value 32 (**which will convert the
    letter to its lowercase as defined by the ASCII table**) should be added. Now
    we know why 32 is the number chosen to be added.

