    justify any subversive means. This is especially true in cases where hackers or
    groups of hackers are serving a political or social purpose. It is up to each
    individual to determine whether their activities warrant the risk of arrest and
    punishment (including incarceration) and to think about whether the value they
    place on their own security and privacy extend to the targets of their attacks.


    MAKE YOUR OWN KEYLOGGER IN C++


    Today, with the existence of a program called a Keylogger, gaining unauthorized
    access to a computer user’s passwords, accounts and confidential information has
    become as easy as falling off a log. You don’t necessarily need to have physical
    access to the user’s computer before you are able to monitor it, sometimes all
    it takes is a single click on a link to your program by the user.


    Anyone with basic knowledge about computer can use a Keylogger. By the time you
    are done with this chapter, hopefully you will be able to make your own keylogger
    through simple, well explained and illustrated steps I have made for you.


    *WHAT IS A KEYLOGGER?*


    A keylogger, sometimes called a “keystroke logger” or “system monitor” is a computer
    program that monitors and records every keystroke made by a computer user to gain
    unauthorized access to passwords and other confidential information.


    *MAKING YOUR OWN KEYLOGGER VS DOWNLOADING ONE*


    Why it’s better to write your own Keylogger as opposed to just downloading it
    from the internet is the reason of Anti-virus detection. If you write your own
    custom codes for a keylogger and keep the source code to yourself, companies that
    specialize in creating Anti-virus will have nothing about your Keylogger and thus,
    the chances of cracking it will be considerably low.


    Furthermore, downloading a Keylogger from the Internet is tremendously dangerous,
    as you have no idea what might have been imbedded in the program. In other words,
    you might have your own system “monitored”.


    REQUIREMENTS FOR MAKING YOUR OWN KEYLOGGER


    In other to make your own Keylogger, you will need to have some certain packages
    ready to use. Some of these packages include: *1\. A VIRTUAL MACHINE*


    When codes are written and needed to be tested, it is not always advisable to
    run them directly on your computer. This is because the code might have a destructive
    nature and running them could leave your system damaged. It is in cases of testing
    written programs that the utilization of a Virtual Machine comes handy.


    A virtual machine is a program that has an environment similar to the one your
    computer system has, where programs that might be destructive can be tested without
    causing the slightest harm to it, should it be destructive.


    You will be right if you say - whatever happens within a virtual machine stays
    within a virtual machine. A virtual machine can be downloaded easily.


    *2\. WINDOWS OPERATING SYSTEM*'
