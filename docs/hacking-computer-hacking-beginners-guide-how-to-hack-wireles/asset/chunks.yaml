    （记住它的目的）。在第 10 行和第 12 行，使用了 `Cin` 函数，它将要求计算机用户输入一个值。一旦程序要求的两个值都已输入，程序将根据第 14 行的条件语句进行评估，如果结果为真，程序将按照第
    16 行的指示打印“A 大于 B”。


    在第 18 行，条件语句 `else if` 是一种用在 `if` 和 `else` 语句之间的条件语句。它被用于添加其他几个条件，如果所有条件的求值结果都为
    `false`，则将打印 `else` 语句下的行。正如在本程序中所，如果条件 `a > b` 为假，则将打印 `else` 语句下的行——“A 小于 B”，除非
    `else if` 条件为真，此时将打印“A 等于 B”。


    从上面编写的代码中可以观察到，用户为变量 `a` 输入了值 1，为变量 `b` 输入了值 3。这些值不满足第 14 行的条件，也不满足第 18 行的条件，因此考虑了
    `else` 语句。打印第 24 行的语句“A 小于 B”。


    ![](img/index-84_1.jpg)


    ### 循环 (LOOPS)


    C++ 中的循环可以被称为一条圆形路径，通过该路径，条件语句不断循环评估，直到满足所需的条件或提供了逃生路线。让我们分析一个使用了循环的程序。有几种类型的循环，例如
    `While` 循环、`For` 循环等。让我们从 `While` 循环开始。


    可以看出，`while` 语句放置在需要重复评估的代码行之前，包括用户输入（`Cin` 和 `Cout` 语句）。在 `while` 之后，总有一个括号，其中包含诸如
    `true`、`false`、`1` 或 `0` 等内容。数字 `1` 可以被替换为 `true`，就像 `0` 可以替换为 `false` 一样。循环可以设置为持续运行而不停止，也可以设置为运行若干次后停止。


    如你所知，第 12 行和第 14 行只是将被打印的语句，而第 13 行和第 14 行将反复要求用户输入值（循环）。从第 17 行到第 23 行是待评估的条件语句。在第
    25 行，变量 `a` 和 `b` 都被赋值为 -1。现在假设所有其他条件的求值结果为假，程序将继续运行，直到第 25 行的条件求值为真（`a == -1
    | b == -1`），即用户输入值 -1，然后将执行第 26 行的指令，即循环打破，并打印第 29 行的语句。


    然而，我们处理循环条件语句终止的方法并不高效。


    ![](img/index-85_1.jpg)


    ![](img/index-85_2.jpg)


    这是因为如果用户按照第 13 行的要求为 `a` 输入值 -1，循环不会打破，而是会再次要求用户输入变量 `b` 的值。只有当 `a` 和 `b` 都赋值为
    -1 时，循环才会打破。


    让我们看一种更高效利用条件语句和 `break` 语句的方法，以便当用户为其中任一个变量输入 -1 时，循环就会终止。


    如上所示，`if` 语句（导致跳出循环）和 `break` 语句直接置于要求用户输入的第 13 行下方，这样当用户输入值 -1 时，循环将打破并打印 `else`
    语句。在输入除 -1 以外的数值的情况下，将先打印第 12 行的语句，随后第 13 行将要求用户为变量 `b` 输入。再次，如果为变量 `b` 输入了除 -1
    以外的值，下方的其余条件语句将被评估，并打印相应的结果：


    ![](img/index-86_1.jpg)


    此外，重要的一点是，知道如何安排你的代码行以产生特定的输出并不是 C++ 特有的。这只需要基础逻辑。你只需要知道不同的语句、它们的用途以及如何使用它们。为了实现特定功能而排列这些语句的方式完全取决于你的想法。


    接下来我们将学习 `For` 循环。但在在此之前，让我们先看看增量（`increments`）是如何工作的。


    到目前为止，我们之前程序的所有内容保持不变，但在第 9 行，有一个初始化变量 `i`，即设置为 0。创建此变量 `i` 是为了在 `while` 循环内部使用它，以设置程序在循环内终止前运行的次数。


    第 10 行的 `While( i <= 3 )` 是一个条件，指示程序在 `i` 的值小于 3 时保持运行，一旦 `i` 变为 3 就停止，即程序将运行三次。


    ![](img/index-87_1.jpg)


    ![](img/index-87_2.jpg)


    在第 35 行，`i++` 是一个增量语句，它简单意味着每次循环完成后向 `i` 加 1。它也可以写成：`i = i + 1`，然而，`i++` 更简洁，也是大多数人的用法。


    在每个条件语句的末尾都添加 `<< i`，因此每个循环结束后都会显示完成的循环次数。


    #### FOR 循环 (FOR LOOP)


    `For` 执行的功能与 `While` 循环基本相同。它们的相似之处在于两者都让程序以迭代的方式运行。然而，它们之间的区别在于在程序中的使用方式。


    从上面的图中可以看出 `for` 循环是如何编写的。`For( int i =`


    ![](img/index-88_1.jpg)


    `0; i < 3; i++)` 仅意味着变量 `i` 被赋值持有变量类型的数据，并初始化为零。`i < 3; i++` 指示程序持续运行（记录完成循环的次数），直到
    `i` 比 3 小 1，即程序将只运行两次。此外，值得注意的是，由于增量是在 `for` 循环后的括号内进行的，因此增量仅对该块内的程序起作用。


    ### 使用数学运算符 (UTILIZING THE MATH OPERATORS)


    正如提到的，C++ 世界中的数学运算符与现实世界中的运算符没有区别。让我们看看如何使用这些运算符，特别是对于 `float` 和 `double` 等其他数据类型，我们目前为止一直在处理整数。我们还将看到为什么某些数据类型无法持有某些值（小数值）。


    在上述程序的第 6、7 和 8 行，值被赋值给 `int`、`double` 和 `float` 类型的变量。这些赋值符合变量类型。


