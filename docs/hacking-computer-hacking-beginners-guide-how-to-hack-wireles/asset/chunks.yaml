    Object-oriented languages are highly structured and modularized. A single statement
    in the code of an object-oriented language cannot be run on its own without the
    context of the rest of the program. This is why object-oriented languages must
    use a compiler to translate the program into machine code before it can be understood
    by the computer. Although this is useful for larger, more complex programs, it
    can be overkill and unnecessarily time-consuming for shorter programming tasks.
    An interpreted language, conversely, is executed (for the most part) on a line-by-line
    basis by the computer, allowing for quick corrections and more intuitive debugging.


    One of the most popular interpreted languages is `Python`. A free, open-source
    project, `Python` has gained worldwide popularity for its simplicity, flexibility,
    and portability. Hackers often use `Python` to help them automate certain tasks
    that are often performed on the command line. `Python`, like most open-source
    software, comes in multiple distributions depending on the intended application.
    These different distributions contain various sets of prewritten modules, or packages,
    that can be pieced together in a `Python` script.


    Other interpreted languages that are important to the hacker include web scripting
    languages such as `HTML`, `JavaScript`, `Perl`, `PHP`, and `Ruby`. These languages
    are used to develop web applications. It is vulnerabilities within web applications,
    in part, that allow hackers to gain access to target websites.


    ## Database Query Languages


    A common goal of hackers is to gain access to private or confidential data.


    Servers store high volumes of data in organized structures known as `databases`.
    Databases have their own language that is used within the code of other programming
    languages when accessing the data. If a web application, for example, needs to
    access or change the profile information of one of its users it will need to send
    a command to the database that is written in that database’s appropriate language.
    These commands are known as `queries`. One of the most common database languages
    used for online applications Is the Structured Query Language, or `SQL`. Exploiting
    vulnerabilities in `SQL` has, over the years, been one of the most common methods
    that hackers have used to access websites and the data contained within them.
    As programmers have become wise to the vulnerabilities in `SQL`, they have made
    great efforts to correct those vulnerabilities, so some of the more simple attacks
    are less common. Understanding `SQL` and other database query languages is another
    essential tool for the hacker. An `SQL` server can be set up on a hacker’s test
    machine in order to practice various methods of attack.


    ## Chapter 5. Gaining Access


    In most cases, the goal of the hacker is to gain access to a system for which
    they are not authorized. The best way to do this is to exploit vulnerabilities
    in the system of authentication. These vulnerabilities, in most cases, lie either
    in the habits of authorized users or in the coding of the software running on
    the target server. Hackers are very adept at discovering and learning how to exploit
    vulnerabilities very quickly, and new ones seem to emerge just as quickly as old
    ones are mitigated. Any given piece of server software, especially large and complex
    ones, likely even have multiple vulnerabilities that have not even been discovered
    yet. A good security professional learns how to think like a hacker so that they
    can anticipate problems with the systems that they are protecting before black
    hat hackers can exploit them. This chapter illustrates some exploits of a few
    of the more common in traditional vulnerabilities in both human users and software.


    ## Social Engineering


    Human users are often the weakest link in the “kill chain” of computer security.
    Many users not only have little understanding of the systems they are using, but
    they also tend to have little appreciation for the nature of cyber threats, and
    have little desire to take the time and effort to protect themselves. Although
    people are starting becoming more aware, there are still enough easy human targets
    around for hackers to exploit. `Social engineering` is the activity of using simple
    reconnaissance or deception to obtain passwords or access directly from unsuspecting
    users. Social engineering requires little technical expertise and is preferred
    by hackers to the more difficult and risky attacks that entail intrusive methods.


    ### Passive Password Acquisition


    Perhaps the simplest type of social social engineering is that of guessing an
    individual’s login password. Despite warnings, users continue to use passwords
    that contain common or easily guessed sequences of characters. The main reason
    that this practice is so common is that people tend to desire passwords that they
    can easily recall. Most people have several email and user accounts for both home
    and work, making it difficult to keep track of them all, and thus may use the
    same - or a similar – password for multiple accounts.


    This practice puts all of their accounts in danger when a hacker successfully
    obtains the password. Common password mistakes are using one’s own name or that
    of a family member or pet, using words commonly found in a dictionary, using sequences
    of numbers corresponding to their birthday or that of a loved one, including parts
    of their residential address, using names of favorite sport teams, and other similar
    themes that are easily remembered. One of the biggest reasons why this is an especially
    poor practice in the modern age is that there is so much personal information
    that is readily and publicly available on the internet. A simple glance at an
    individual’s social media page usually reveals a treasure trove of information
    about them. When someone allows their social media profile to be publicly viewed,
    it becomes a perfect source for hacker to refine their password guesses. Personal
    data useful for guessing passwords can also be obtained through the practice of
    `dumpster diving`, whereby a hacker rummages through a target user’s trash for
    paperwork containing sensitive information. Password security has become such
    a problem that more and more websites, online accounts, email services, and other
    systems that require passwords are beginning to enact strict restrictions on the
    format and content of passwords.


    More interactive types of social engineering involve a certain degree of surveillance
    or reconnaissance on the part of the hacker. If a hacker has physical access to
    the location of their target system, they might attempt to view a user while they
    are actually typing their login information. This is colloquially known as `shoulder
    surfing` because it simply involves covertly peering over the shoulders of users.


