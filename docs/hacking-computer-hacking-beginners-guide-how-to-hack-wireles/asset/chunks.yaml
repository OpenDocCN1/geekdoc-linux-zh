    # 设置 ECLIPSE 环境


    启动 Eclipse 时，会显示一个欢迎界面，引导你对 Eclipse 环境进行导览。如果你恰好喜欢实战指南，可以继续操作，否则将其关闭即可。在欢迎语之后，Eclipse
    会显示一个很小的默认程序，该程序在编译后会打印“hello world”。不要担心这些代码初看起来看起来有多复杂，随着我们的学习，一切都会迎刃而解，你会发现编程就像吃菜饼一样简单。


    紫色、蓝色和绿色文本的行被称为“代码（Codes）”。我们很快就会操作它们。


    ![](img/index-70_1.jpg)


    ## 配置编码环境的步骤


    1. 关闭默认程序。我们可以通过点击屏幕左侧项目旁的“x”按钮来实现。

    2. 点击左上角的 `File`，选择 `New` ，然后选择 `C++ project`，因为我们要创建一个 C++ 环境。

    3. 为你想要创建的项目起一个合适的名称，例如 `Keylogger`、`Calculator`、`Mary Jane` 等任何名称都可。

    4. 在 `Project type` 下选择 `Empty project.`。在 `Toolchains` 下选择 `MinGW GCC`（这是我们下载的编译器）。点击
    `Next` 继续进行作者和版权设置，或者点击 `Finish` 直接进入 Eclipse 代码编辑器。


    ……这一类工作我们就做完了。现在，就像我们之前处理 JDK 一样，我们需要在这里设置一些路径。


    ### 下列是具体步骤：


    1. 找到你的项目名称，右键点击它，在出现的下拉菜单中滚动并点击 `Properties`。

    2. 展开 `C/C++ build`，并在下拉菜单中点击 `Environment`。

    3. 在 `Environment path to select,` 下，点击 `Path` 并点击 `Edit.`。显示的默认路径很长、冗长且乏味，但是
    ![](img/index-71_1.jpg)

    ![](img/index-71_2.jpg)

    我们只需要在开头添加一个很小的路径变量。

    4. 还记得我们设置 JDK 路径变量时拷贝的路径吗？将 `C:\mingw\bin;` 粘贴到 eclipse 路径变量的开头，使其看起来像下图所示：

    5. 点击 `Apply`


    我们只剩最后一件事要做，Eclipse 的设置就完成了。


    这是在设置二进制解析器（binary parser）。


    1. 点击 `File`，在出现的下拉菜单中点击 `Properties,` `C++ Build` ，然后进入设置。

    2. 在 `Settings` 下点击 `Binary Parser.`。确保勾选了 PE ![](img/index-72_1.jpg) Windows
    解析器。

    3. 点击 `Ok`，设置全部完成。


    ## 如何运行编写的代码


    现在环境已经就绪，你可以开始编码了。然而，编码并不仅仅结束于编写很多很多行代码，运行它们同样重要。


    定期运行编写的代码是非常重要的，因为这能让程序员知道所写的内容是否按预期输出。你应该边写边运行代码，这样你就能知道编写的结果，以及是否有任何想要修改的地方。以下是运行编写代码的简单步骤：


    1. 在 Eclipse 环境的左上角有一个锤子符号。锤子代表“构建（Build）”。如果不构建编写的代码，将无法运行。点击它（快捷键：`Ctrl B`）来构建你的代码。

    2. 在屏幕中间上方有一个大绿色“播放”按钮，点击它可以运行你编写的程序。该按钮代表“运行（Run）”，点击它你的程序就会运行。就是这样，简单得如 ABC。


    ## 编程基础（C++ 快速课程）


    诚然，我们关注的是制作键盘记录器，你可能在奇怪为什么我们还在绕圈子。事实是，我们非常有必要具备将要工作的环境以及将要使用的工具的基础知识。


    C++ 是我们决定使用的编程语言，因此我们将学习该语言的基础领域，这将为我们稍后的方向（制作键盘记录器）提供感。随着学习的深入，我们将学习越来越多关于这种语言的知识。


    ### 术语


    **变量（Variable）。** 变量是内存中的一个位置，可以存储供程序使用的值。一个类比是邮政箱，每个箱都有一个地址（邮箱号）。当打开箱时，就可以取出内容。同样地，每个内存位置都有一个地址，当调用它时，就可以取出内容。


    **标识符（Identifier）。** 标识符是从 C++ 字符集中提取的字符序列。


    每个变量都需要一个标识符来区别于其他变量。例如，给定变量 `a`，`a` 是标识符而值是内容。标识符可以由字母、数字和/或下划线组成。

    - 它不能以数字开头。

    - C++ 是区分大小写的；也就是说，大写字母和小写字母被认为是不同的。例如 `boy != BOY`（其中 `!=` 意味着不等于）。

    - 它不能是保留字。


    **保留字（Reserved words）。** 保留字或关键字是那些对 C++ 编译器具有特殊含义的单词。一些 C++ 关键字包括 `double`、`asm`、`break`、`operator`、`static`、`void`
    等。


    要声明变量，必须先给它一个名称和要存储的数据类型。

    例如：`Int a;` 其中 `a` 是一个标识符，类型为整数。


    有多种 C++ 数据类型，每种数据类型都有其特定的功能。下面列出了各种数据类型：

    - **Int:** 这些是较小的整数，例如：

    - **Long int:** 大整数。

    - **Float:** 较小的实数。

    - **Double:** 这些是带小数点的数字，例如 `20.3`、`0.45`。

    - **Long double:** 极大的实数。

    - **Char:** 单个字符。

    - **Bool:** 布尔值。它可以取两个值之一：true 或 false ![](img/index-76_1.jpg)


    ## 理解代码语句


    当我们第一次启动 Eclipse 并收到欢迎语时，不久后我们看到了默认程序，如果按照我们之前学到的步骤运行它，它将显示“Hello World”。让我们过一下那个默认程序中用绿色、紫色和红色编写的代码以及它们是如何运作的。


    **#include:** `#include` 语句是调用从库中引入语句并将其包含在正在编写的程序中。库可以被看作一个房间，里面存放了许多预先写好的代码，我们可以随时利用。它减免了我们在编码时必须手动编写每一个可能需要的东西的压力。


    **<iostream>:** 这是一个库文件，包含某些特定的函数，使我们能够使用某些命令。其中一些命令包括：`Cout` 和 `Cin`。


    **Cout:** 这是一个向计算机用户显示编写代码输出结果的命令。例如，如果你编写了一个向用户提问的程序，`Cout` 语句就是让这些问题对用户可见的关键。


    **Cin:** 这一语句是一个用于从用户接收输入的命令。例如，如果你编写了一个收集不同人员生物识别信息的程序，`Cin` 命令将使你的程序能够获取计算机用户键入的信息。


    解释 `Cin` 和 `Cout` 语句的一个很好的例子是计算器。`Cin` 允许计算器接收你的输入，而 `Cout` 让它向你显示答案。


