  trans: '

    我们构建的键盘记录器并不太厉害，主要在于它记录信息的方式。当我们测试它时，发现它无法无法处理空格和制表符，而是直接保存了输入。让我们为键盘记录器添加更多功能，使其能更好地处理输入。我们可以通过利用
    `Switch` 语句来实现这一点。让我们立即开始！


    ## 引入 Switch 语句


    之前提到，为了让我们的键盘记录器具备处理空格、制表符和其他字符的能力，我们必须使用 `switch` 语句。然而，在引入 `switch` 语句之前，我们需要将之前编写的代码组合在一个函数下：`void
    log()`，以便于我们操作。我们的分组方式如如下所示：


    ![](img/index-107_1.jpg


    因此，在第 8 行创建了名为 `log` 的 `void` 函数来存放我们之前的代码。该函数不返回任何值。此外，按照要求在第 8 行的 `main` 函数中调用了
    `void`，这样就可以通过简单的调用来随时使用，而不需要重新编写一遍。重新测试程序时，它的运行方式将与之前一样。


    参考上图：


    删除第 27 行的 `write << c;`。我们稍后会将其回来作为默认情况（default case），以防当所有条件语句都为假时，它可以执行。目前我们先将其移除，以便放置我们的各个
    cases。


    在第 28 行，编写 `switch` 语句，并将变量 `c`（我们之前创建的）中发生的任何情况通过括号传递给 `switch`，这样进入变量的任何内容都会被
    `switch` 处理。


    让我们创建一个 `case`（不同条件之一），例如 `case 8`。这样，如果变量 `c` 在 ASCII 中的数值为 8（如 `case 8` 所示），那么


    ![](index-108_1.jpg


    ![](index-108_2.jpg


    意味着它是一个退格键（back space）。我们将根据 ASCII 码不同数字的含义继续添加不同的数字数字，这样我们的键盘记录器就能关联用户输入的几乎任何字符。


    换句话说，第 22 行到 35 行的语句的作用是：第 22 行涵盖了 ASCII 码中 8 到 222 之间的值。第 24 行有一个条件 `if` 语句，用于检查是否有按键中断，即用户键盘上是否有任何按键被按下，如果判断结果为
    `true`，则第 26 行的函数应该记录它，将其存储在与 `Record.text` 同行定义的文件中，并确保后续输入不会覆盖之前的输入。第 28 行的
    `switch` 语句允许第 30 行和 34 行中评估的 cases 被传递到变量 `c` 中，描述了过程中的每一步，用户在键盘上按下的按键（无论是退格键、回车键、退出键等），而不是像之前那样提供那些制表符。第
    35 行将保存用户的按键——假设他没有按下 ASCII 码中 8 到 222 之间的任何按键，或者没有按下我们 cases 覆盖的任何按键——就像我们原始键盘记录器中做的那样。


    需要花时间包含涵盖许多可能用于用户名或密码的字符，因为这将使键盘记录器以易于理解的方式保存用户输入。让我们来看看大写和小写字母。


    ![](index-110_1.jpg


    ## 大写和小写字母


    大小写字母对英语语言同样重要，它们对通用编程也非常重要，特别是当将其用于键盘记录器的目的时。我们必须学习如何区分这两种字母大小。我们还将对制表符、大写、shift、alt、方向键和鼠标键进行一些过滤。


    嗯，我们可以通过 shift 键的状态来区分大写和小写字母；也可以使用方向键的状态。所以，如果这两个键中的任意一个按下，请写大写字母，否则写小写字母。这就是我们要告诉程序的。在默认情况下，上面的程序将写入大写字母，所以我们必须定义小写字母的状态。


    诚然，对图中所示的键盘记录器程序进行了微调，但尽管如此，不要担心，因为我们将分析整个程序。我们提到过，制作的第一个键盘记录器是原始的，现在我们正逐渐进入更复杂的阶段。


    我们更改的内容之一是存放按键记录的变量。我们将它的名称从 `c` 改为 `key`。为要放入变量的信息命名匹配的名称是良好的习惯，因为它有助于非常容易地定位任何信息，或者万一与其他代码编写人员团队合作时，他们能够找到他们需要的任何函数


    ![](index-111_1.jpg


    在第 23 行，我们引入了 `sleep` 函数，尽管目前暂时被注释掉了，但稍后会使用。`sleep` 函数有助于防止 CPU 因为重复运行而满载（导致其变慢）。然而，`sleep`
    函数不是防止 CPU 满载的最佳解决方案，但目前我们将使用它来避免陷入任何复杂问题。


    虽然 `Sleep()` 函数会根据括号内输入的任意毫秒数暂停程序（例如 `sleep(1), sleep(2), sleep(5)…` 等），但括号内为
    0 的 `sleep()` 函数（即 `sleep(0)`）作用不同。它告诉程序，每当另一个程序想要使用 CPU 时，就停止使用 CPU。


    让我们继续分析第 31 行到 43 行的代码，因为它们是一个共同工作的代码块。


    注意 `Key += 32` 等于 `Key = Key + 32`。


    上图代码块是为了区分大写和小写字母而创建的。


    第 30 行包含一个 `if` 语句，基本含义是：`if` `key` 的值大于 `64`（所有 ASCII 码值）但小于 `91`，且 `shift` 键未按下（写为
    `!(GetAsyncKey(0x10))`——其中 `0x10` 是 Shift 键的十六进制表示——请将之前的键值加上 `32`。值得注意的是，`if`
    条件语句中的 `64 到 91` 范围并不是随机选择的，而是有意的，因为字母表中的 ASCII 表正好落在这个范围内。


    ![](index-112_1.jpg


    从下方所示 ASCII 码片段中，通过简单的计算，我们就能明白为什么在第 31 行的条件 `if` 语句中选择给 `key` 值加上数字 `32`。


    我们第 31 行的 `if` 条件语句规定：`if` `key` 大于 `64`……这意味着在评估期间，`Key` 将从数字 `65` 读取。现在看 ASCII
    表中字符列下的数字 `65`。`65` 代表大写字母 A。


    现在，如果给 `65` 加上 `32`，结果是 `97`。看 ASCII 表中数字 `97` 的字符列，数字 `97` 代表小写字母 `a` 吗？是的，确实。


    记住，我们的键盘记录器程序默认使用大写字母，正如第 31 行和第 33 行代码所示，**如果 shift 键未按下**（**为了使字母大写**），则应该加上值
    32（**这将根据 ASCII 表的定义将字母转换为小写**）。现在我们知道为什么选择 32 作为相加的数字了。

