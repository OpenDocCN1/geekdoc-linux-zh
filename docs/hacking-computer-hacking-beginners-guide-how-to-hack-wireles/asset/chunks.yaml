    许多病毒、木马和其他恶意软件经常通过电子邮件发送到目标机器——要么作为直接附件，要么通过指向受感染网站的链接。彻底检查电子邮件的发送者至关重要，以确保他们确实是其所称身份。黑客经常使用外观上与合法发送者非常相似的虚假邮件地址。用户应该留意邮件格式中的细微差异（例如
    `john@mybank.com` 与 `john@my-bank.com`）。有时，高级黑客能够伪造他们的回信邮件地址，使其看起来与合法地址完全相同，但邮件头中的信息会指示恶意意图。


    电子邮件中提供的任何链接也应该保持某种程度的怀疑。你应该确保这些链接来自你信任的人，并问自己那个人是否会向你发送那种链接。常识会大有裨益。在打开任何邮件附件之前（尤其是可执行文件），应该对该邮件运行病毒或恶意软件扫描。


    ## 计算机软件安全


    计算机安全专家有时对杀毒软件的效能存在分歧。有些人认为，购买昂贵的病毒和恶意软件保护软件可能是在浪费钱，因为高级黑客擅长规避这些保护。然而，目前有多种免费的计算机安全软件套装，只要保持安全软件更新，它们就能保护大多数用户的计算机系统免受大多数最基础且常见的恶意程序的侵害。


    无论如何，大多数软件都通过补丁和更新提供自身的安全保障。这就是为什么用户手动更新软件和操作系统，或允许这些程序自动更新是极其重要的。这对于修复操作系统和网络浏览器的漏洞尤为关键。`Microsoft
    Windows`、`Java` 和 `Adobe Flash` 通常是黑客攻击的目标，应该不断保持更新。


    ## 网络安全与加密


    Wi-Fi 路由器的加密协议应设置为其特定硬件支持的最高加密级别。将路由器设置为不向公共广播网络名称也是一种良好的做法（尽管大多数黑客可以轻易绕过这一招数）。密码安全在
    Wi-Fi 网络上格为重要，因为足够长且复杂的密码可以显著延长黑客破解你网络密码的时间。在许多情况下，使用具有最大长度和足够复杂度密码的 `WPA-2` 加密会让黑客破解网络变得极其困难且耗时，以至于他们直接转向另一个安全性更低的目标。


    ## Web 应用安全


    网站应用程序中的漏洞非常多，特别是 Web 代码中存在的 `SQL` 和其他脚本语言。


    提供用户访问信息和服务的网站的程序员需要针对一些更常见的攻击建立某些防御措施。


    许多 SQL 注入攻击可以通过将用户输入附加到任何 `SQL` 命令之前对其进行“清理”（`sanitizing`）来轻易击败。换句话说，在用户在 Web
    界面上输入的字符串作为变量插入 `SQL` 语句之前，子程序应该检查该字符串是否包含可疑内容。此程序也可用于其他类型的注入攻击，包括跨站脚本（XSS）和跨站请求伪造（CSRF）。


    ## 道德黑客


    必须明确，黑客并不是小偷、恐怖分子、破坏者和顽皮少年的专属领域。学习和实践黑客对于理解如何最好防止意图有害的黑客至关重要。虽然黑客通常并不昂贵，但黑客所需的知识和技能并不容易获得，需要自律和奉献才能掌握。这使得黑客社区——至少对于成功的黑客而言——是一个相当排外的群体。它也让有才华的黑客比普通人具有优势，而心怀恶意的人很容易利用这种优势。


    个人的伦理和道德准则往往会渗透到他们所从事的任何活动中。然而，某些明智的人可以轻易对他们信息较少的同伴执行黑客攻击，这对于本应守法的公民来说可能是一种诱人的诱惑。某些攻击发起时具有的匿名性进一步增加了这种诱惑。


    此外，自己很容易说服自己攻击的目标正当任何颠覆性手段。这在黑客或黑客团体为政治或社会目的服务的情况下尤为如此。每个人都要决定自己的活动是否值得承担逮捕和惩罚（包括监禁）的风险，并思考他们对自己安全和隐私的重视是否延伸到了攻击目标。


    ## 使用 C++ 制作自己的键盘记录器


    今天，随着名为 `Keylogger` 的程序的存在，未经授权访问计算机用户的密码、账户和机密信息已变得像掉木桩一样简单。你并不需要在监控它之前物理接触用户的计算机，有时用户只需点击指向你程序的链接即可。


    任何具有基础计算机知识的人都可以使用 `Keylogger`。当你完成这一章时，希望你能够通过我为你提供的简单、解释清晰且带图的步骤制作你自己的键盘记录器。


    ### 什么是键盘记录器？


    键盘记录器（有时称为“按键记录器”或“系统监控器”）是一种计算机程序，通过监控和记录计算机用户输入的每一个按键，来获取未经授权的密码和其他机密信息。


    ### 制作自己的键盘记录器 vs 下载一个


    为什么自己写键盘记录器比直接从互联网下载更好，原因在于反杀毒软件的检测。如果你为键盘记录器编写了自己的自定义代码并将源代码留给自己，专门创建反杀毒软件的公司将对你的键盘记录器一无所知，因此破解它的几率会非常低。


    此外，从互联网下载 `Keylogger` 是极其危险的，因为你不知道程序中可能被嵌入了什么。换句话说，你自己的系统可能会被“监控”。


    ## 制作自己的键盘记录器的要求


    为了制作你自己的键盘记录器，你需要准备好某些特定的包来使用。这些包包括：


    #### 1. 虚拟机


    在编写代码并需要测试时，并不总是建议直接在你的计算机上运行它们。这是因为代码可能具有破坏性，运行它们可能会导致你的系统损坏。在测试编写的程序时，使用虚拟机（`Virtual
    Machine）会派上用场。


    虚拟机是一个提供与你计算机系统环境相似环境的程序，在那个环境中，可以测试可能具有破坏性的程序，而即使它们具有破坏性，也不会对其造成任何微小的伤害。


    如果你说——虚拟机内部发生的任何事情都会留在虚拟机内部，你是正确的。虚拟机可以很容易地下载。


    #### 2. Windows 操作系统


