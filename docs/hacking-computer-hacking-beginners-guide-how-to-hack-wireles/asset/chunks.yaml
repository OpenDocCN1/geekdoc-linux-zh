    大多数 Wi-Fi 网络由一个无线路由器（或一组无线路由器）组成，这些路由器连接到一个调制解调器，为某个物理位置提供互联网访问。路由器在特定通道上广播和接收无线信号，将相应的
    `TCP/IP` 数据包传输至其他具有相似无线连接能力的机器和设备。在任何给定时间，在与该位置调制解调器连接的路由器及其相关通道上通信的所有节点共同构成了一个
    Wi-Fi 网络。从本质上说，Wi-Fi 网络是极具动态且流动的。特别是在咖啡馆或提供无线访问的办公楼等商业环境中，特定网络上的节点数量和性质在不断变化。


    在这些公共环境中，黑客很容易在大众眼皮底下隐藏行踪，并试图入侵网络上的任何节点。一旦黑客成功进入网络，他们就可以扫描网络中的所有连接机器，并探测漏洞。许多网络同时拥有相互连接的无线和有线子网络。当黑客获得无线网络的访问权限时，理论上可以利用此访问网络中有线部分的所有节点。这使得
    Wi-Fi 破解成为现代黑客追求的一个非常热门的目标。


    ## WI-FI 加密协议


    由于 Wi-Fi 信号发射到空气中而不是限制在线路内，因此信号中所包含的信息进行加密至关重要。否则，任何人都可以被动地接收并查看网络节点之间发送的任何信息。自无线网络开始流行以来，Wi-Fi
    使用的加密协议不可不断演变。此外，随着技术的改进导致带宽和数据传输速率的增加，大量信息可以在极短时间内从无线网络中广播，这使得对其进行加密并防止其落入恶意黑客手中变得尤为重要。


    最古老且最常见的 Wi-Fi 加密协议是有线等效隐私保护 (`WEP`)。正如其名称所示，`WEP` 标准的目标是为网络用户提供与物理连接网络同等的安全防护。遗憾的是，随着时间的推移，`WEP`
    已成为所有现有加密协议中最不安全的一种，即使是最没有经验的黑客也能相当轻松地破解。事实上，`WEP` 是如此不安全，以许多 Wi-Fi 路由器制造商不再在其硬件上提供该类型的加密选项。大多数安全专业人员建议路由器所有人在有其他可用选项的情况下不要使用
    `WEP`。互联网上可以免费方便地找到攻击受 `WEP` 保护的 Wi-Fi 网络的逐步说明和代码示例。尽管加密级别已从 64 位增加到 128 位再到 256
    位，但 `WEP` 底层的缺陷仍然可以被最稚嫩的新手黑客轻易利用。


    `WEP` 最大的问题是，密码仅通过对网络流量进行被动“嗅探”（接收和查看网络数据包）就能被快速容易地破解。


    相比 `WEP` Wi-Fi 加密的一个重大飞跃是 Wi-Fi 保护访问 (`WPA`) 加密标准。这种新协议修复了 `WEP` 中的许多问题，但由于它仍然基于一些相同的底层加密算法，仍然容易受到攻击。此外，受
    `WPA` 保护的路由器在部署时带有一个功能，旨在方便家庭用户将新设备连接到其网络。该功能在采用 `WPA` 的系统中被证明是一个额外的漏洞。


    没过多久，就需要对 `WPA` 进行更新以保持 Wi-Fi 更加安全。一种在其他安全应用中使用的新加密标准——高级加密标准 (`AES`) 成为新 Wi-Fi
    加密协议中的强制性要求，该协议被称为 `WPA-2`。带有 `AES` 加密的 `WPA-2` 已成为可用无线路由器的推荐设置，因为它与其先前的标准相比在安全性方面有了显著提高。破解
    `WPA` 和 `WPA-2` 需要比攻击受 `WEP` 保护网络的简单被动嗅探更具侵入性的黑客技术。


    ## WI-FI 攻击


    黑客进行 Wi-Fi 攻击至少需要一台计算机（通常是笔记本电脑），用于运行破解 Wi-Fi 密码的脚本。他们还必须获取一个相对便宜的特殊 Wi-Fi 适配器。


    ![](img/index-50_1.jpg)


    可以在黑客资源网站上找到合适的 Wi-Fi 适配器列表，但通常适配器必须具有名为“监听模式”（monitor mode）的功能才能执行 Wi-Fi 攻击。需要注意的是，并非零售电脑供应商店找到的所有
    Wi-Fi 适配器都具有此功能，大多数笔记本内部适配器都是不合适的。


    通常，黑客倾向于使用某种 Linux 发行版（通常是 `Kali`）来进行 Wi-Fi 攻击，因为大多数现成工具都是为 Linux 操作系统编写的并预装在
    `Kali` 上。通过某些配置，也可以在另一个操作系统的虚拟机中运行 Linux 以发起成功的攻击。虽然从其他操作系统发起攻击是可能的，但对于初学者来说，从原生
    Linux 发行版或虚拟机发起攻击要容易得多。推荐使用像 `Kali` 这样对黑客友好的发行版。


    针对各种加密协议进行 Wi-Fi 攻击的详细程序和推荐程序随时间变化，但原理是相同的。对于针对 `WEP` 加密的最简单攻击，通用步骤如下：


    1) 在“监听模式”下（由名为 `airmon-ng` 的程序设置），使用名为 `airodump-ng` 的程序，在适配器范围内监控并查看所有 Wi-Fi
    流量。


    多个路由器上的实时 Wi-Fi 流量 ([aircrack-ng.org)](http://aircrack-ng.org)


    2) 选择一个使用 `WEP` 加密的目标 Wi-Fi 网络，并记录名称 (`ESSID`) 和网络地址（格式为 `XX:XX:XX:XX:XX:XX` 的
    `BSSID`）。


    ![](img/index-51_1.jpg)


    3) 重启 `airodump-ng` 以开始捕获来自目标特定网络的流量。


    4) 等待捕获到足够数量的数据包（在流量较少的网络上这可能需要更长时间）。


    5) 使用名为 `aircrack-ng` 的程序将捕获的网络数据包组合成一个完整的密码。


    一个成功解密的 Wi-Fi 密钥 ([aircrack-ng.org](http://aircrack-ng.org)) 如果网络流量太慢，无法在合理时间内捕获足够的数据包来破解密码，某些黑客会选择使用名为
    `aireplay-ng` 的程序向网络注入伪造数据包，创建必要的流量以便更快破解。然而，这种活动需要黑客的机器实际上从其 Wi-Fi 适配器广播信号，这使其更加显眼。


    `WPA` 加密无法被被动破解，需要额外的包注入步骤。破解 `WPA` 可能需要更长时间，并且是一个更具侵入性的过程，但比破解 `WEP` 并不困难。名为
    `reaver` 的程序（通常在 `Kali` 发行版可用）通常被黑客用于破解 `WPA`。`WPA-2` 破解对于经验更丰富的从业者来说是一个更高级的概念。（注：上述软件工具已预装在
    `Kali Linux` 中，或可以从 [www.aircrack-ng.org](http://www.aircrack-ng.org) 下载）。


    # 第 8 章 你的第一次攻击


