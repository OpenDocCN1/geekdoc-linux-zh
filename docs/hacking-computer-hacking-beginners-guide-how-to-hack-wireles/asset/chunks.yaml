    我们将制作的键盘记录器（Keylogger）只能感染 Windows PC。我们选择制作这种键盘记录器是因为大多数桌面用户都使用 Windows 平台。此外，制作一个可以在
    Windows 系统上运行的键盘记录器比制作一个可以在 Mac PC 上运行的要容易得多。正出于这个原因，我们从简单的工作开始，以后可以在我的下一本书进阶到更复杂的任务。


    ### 3. IDE – 集成开发环境


    IDE 是一套软件套件，它整合了开发者编写和测试软件所需的各种工具。


    通常，一个 IDE 包含代码编辑器、调试器和编译器，开发者通过一个单一的图形用户界面（GUI）访问这些工具。我们在这个项目中使用一个名为“eclipse”的
    IDE。


    ### 4. 编译器


    编译器是一种特殊的程序，它可以处理用特定计算机语言编写的语句，并将其转换为计算机处理器可以理解的机器语言或“代码”。


    在我们开始编写键盘记录器之前，我们需要设置环境，并学习一些关于 C++ 的基础知识。学习 C++ 是因为大多数 Windows 代码都是用它编写的，而我们的键盘记录器目标是
    Windows。


    你绝对希望你的键盘记录器能够在所有使用 Windows 操作系统的系统上通用运行。


    提前告知你，由于 C++ 语法的性质，它并不是下一种容易学习的编程语言。尽管如此，不要轻易放弃，我们将从简单的内容开始，逐渐过渡到更高级的内容，采取全面的循序渐进的方法。


    我还建议你使用关于 C++ 的外部材料来扩展你在本项目过程中将涉及的领域的知识，这将提高你的工作效率。


    希望到本章结束时，你将能够制作你自己的键盘记录器，并对其进行修改以满足你的需求。


    ![](img/index-63_1.jpg)


    # 设置环境


    就像在使用计算机系统之前需要对其进行设置一样，同样，我们需要设置一个环境，使我们能够用 C++ 编写代码，并最终制作出一个键盘记录器。


    我们需要的第一个东西是集成开发环境（IDE），如前，我们将使用 Eclipse。我们选择的 IDE（`Eclipse`）是基于 Java 的，因此我们需要访问
    Java 网站（[`www.eclipse.org`](http://www.eclipse.org)）来下载它。


    当我们进入 Java 网站时，会发现有很多可供下载的 eclipse 程序。然而，由于我们打算使用 C++ 编程语言，我们下载“适用于 C/C++ 开发者的
    Eclipse”，同时心中记得我们正在 Windows 平台上工作。因此，尽管有适用于 Linux、Solaris、Mac 系统等其他 Eclipse 版本，我们将下载适用于
    Windows 平台的 Eclipse。


    ![](img/index-64_1.jpg)


    我们还需要在 32 位或 64 位操作系统选项之间选择，取决于你的电脑运行的是哪种。你可以通过右键点击“此电脑”或“我的电脑”然后点击“属性”轻松检查你的系统运行的是哪种。这些步骤将显示你的系统规格。确定系统运行的位数后，下载与之兼容的
    Eclipse 文件。


    下载完成后，下载的文件将默认位于你的下载文件夹中，除非你更改了存放位置。我们需要解压该文件，因为它是压缩过的。


    在解压并安装 Eclipse 文件后，尝试运行它将显示一条错误消息，说明 Eclipse 在没有 Java 运行环境（JRE）或 Java 开发包（JDK）的情况下无法工作。


    这完全不是问题，因为我们只需要回到互联网下载一个 JDK。最新版本的 JDK 通常带有 JRE。


    我们可以简单地 搜索“Java development kit”并点击指向 Oracle 网站的链接，在那里我们可以进行所需的下载。


    ![](img/index-65_1.jpg)


    ![](img/index-65_2.jpg)


    在网站上，我们有了许多不同操作系统和不同系统位数的 JDK 程序，从适用于 Linux 系统的 JDK 到适用于 Mac OS Solaris JDK 等。然而，正如我们所知，我们对适用于
    Windows 系统的 JDK 感感兴趣。我们直接下载，确保符合我们的系统位数（32 位或 64 位）。


    在开始下载之前，我们需要点击提供的复选框以接受 Oracle Binary Code 许可协议。我们完成此操作并继续下载和安装 JDK。


    现在，与我们下载的大多数程序不同，我们必须设置环境变量路径。我们对 JDK 执行此操作是因为它不像大多数其他程序那样自动设置路径。未设置变量路径的影响是：每当我们想要运行此类文件（未设置变量路径时）时，我们必须指定可执行文件的完整路径，例如：`C:\Program
    Files\Java\jdk1.7.0\bin\javac Myclass.java`。这可能是![](img/index-66_1.jpg)


    ![](img/index-66_2.jpg)


    非常繁琐并导致很多错误。


    例如，Eclipse 运行需要 JDK，但如果未设置 JDK 路径，Eclipse 将无法找到它，除非手动输入路径，否则无法运行。设置路径简单意味着设置一个地址，使程序的位置变得可行。


    ### 设置 JDK 路径


    1. 导航到文件资源管理器（快捷键：`windows + E`），右键点击“此电脑”或“我的电脑”，从显示的下拉菜单中点击“属性”。

    2. 点击“高级设置”，然后从弹出的菜单中点击“环境变量”，然后向下选择系统变量。

    3. 在键盘上按下“P”，你将被重定向到“路径”。现在让我们编辑它。默认路径将类似于：`%systemRoot%`...如底图中更完整的格式所示。（路径只是为了放大显示在记事本中，![](img/index-67_1.jpg)[](index-67_2.jpg)你需要在记事本中放置路径。）

    4. 向现有的地址添加 `C:\mingw\bin;`，使其如下所示所示。避免对路径进行任何其他更改，否则尝试运行 Eclipse 时会遇到错误消息。

    5. 按照提示多次点击“确定”，最后点击“应用”，JDK 路径即已设置完成。


    '
- fmt: '

    # SETTING THE ECLIPSE ENVIRONMENT


    On launching Eclipse, greetings with a welcome screen that will offer a tour around
    the eclipse environment will be displayed. If you happen to be one that loves
    practical guides, you could go on with it, else close it. Immediately after the
    greeting note, Eclipse displays a small default program, which will print “hello
    world” when, compiled. Do not worry about how complex these codes might seem at
    first glance, as we progress things will unwrap and you will see that coding is
    just piece of cake waiting to be eaten.


    The lines in purple, blue and green texts are called “Codes.” We will be playing
    around with them in no time.


    ![](index-70_1.jpg)


    ## STEPS TO SETUP THE ENVIRONMENT FOR CODING


    1. Close the default program. We can achieve this by clicking on the projects
    ‘x’ button at the left hand side of the screen.

    2. Click on `File` in the upper left corner, select `New` and then `C++ project`
    because we want to create a C++ environment.

    3. Give the project you want to create a befitting name e.g. `Keylogger`, `Calculator`,
    `Mary Jane`, anything.

    4. Under `Project type` select `Empty project.` Select `MinGW GCC` (which is the
    compiler we downloaded) under `Toolchains`. Click on `Next` to proceed with author
    and copyright settings or click `Finish` to go to Eclipse code editor directly.


    …and we are done with things in that category. Now, just like we did for the JDK,
    we need to go ahead and set some paths right here.


    ### LISTED BELOW ARE THE STEPS:


    1. Go to your project name, right-click on it and from the drop-down menu that
    appears scroll down and click `Properties`.

    2. Expand the `C/C++ build` and from the drop down menu, click on `Environment`.

    3. Under `Environment path to select,` click on `Path` and click on `Edit.` The
    default path displayed is long, cumbersome and tedious however ![](index-71_1.jpg)

    ![](index-71_2.jpg)

    we only need to add a small path variable to its beginning.

    4. Remember the path we copied out when we were setting our JDK path variable?
    `C:\mingw\binbin;` paste it at the beginning of the eclipse path variable so it
    looks like it does in the figure below:

    5. Click on `Apply`


    We have just one more thing to do and we are done with setting up eclipse.


    This is setting the binary parser.


    1. Click on `File` and from the drop down menu that appears, click on `Properties,`
    `C++ Build` and then go into settings.

    2. Under `Settings` Click on `Binary Parser.` Make sure that the PE ![](index-72_1.jpg)
    Windows parser is ticked.

    3. Click on `Ok` and that’s all about the settings.


    ## HOW TO RUN WRITTEN CODES


    Now that your environment is set your coding can begin. However it does not all
    end at just writing many and many lines of codes, running them is important.


    Running written codes at intervals is important as it enables the coder know if
    what he is writing is coming out the way he wants it. You run your codes as you
    write so you know the outcome of what you have written and if there any changes
    you will like to make. Here are simple steps to running your written codes:


    1. At the upper left corner of the eclipse environment, there is a hammer symbol.
    The hammer signifies “Build.” Without building the written code, it will not run.
    Click on it (Shortcut: `Ctrl B`) to build your code.

    2. There is a big green “Play” button at the top middle portion of your screen,
    click on it to run your written program. The button signifies “Run,” click on
    it and your program will run. That’s it, simple as ABC.


    ## PROGRAMMING BASICS (CRASH COURSE ON C++)


    True, we are concerned with making a Keylogger and you must be wondering why we
    are still beating around the bush. Thing is, it is really necessary that we equip
    ourselves with basic knowledge of the environments we will work in and the tools
    we will use.


    C++ is the programming language we have decided to use and so we will go through
    basic areas of this language which will give us a sense of direction of where
    we are headed (making a Keylogger.) later on, as we progress we will learn more
    and more and more of this language.


    ### TERMS


    **Variable.** A variable is a location in memory where a value can be stored for
    use by a program. An analogy is the post office boxes where each box has an address
    (post office box number). When the box is opened, the content will be retrieved.
    Similarly, each memory location has an address and when that is invoked, the content
    can be retrieved.


    **Identifier.** An identifier is a sequence of characters taken from the C++ character
    set.


    Each variable needs an identifier that distinguishes it from another. For instance,
    given a variable `a`, `a` is the identifier and the value is the content. An identifier
    can consist of alphabets, digits and / or underscores.

    - It must not start with a digit.

    - C++ is case sensitive; that is upper case and lower case letters are considered
    different from each other. For example `boy != BOY` (where `!=` means not equal
    to)

    - It must not be a reserved word.


    **Reserved words.** A reserved word or keyword is a word that has special meaning
    to the C++ compiler. Some C++ keywords are `double`, `asm`, `break`, `operator`,
    `static`, `void`, etc.


    To declare a variable, it must be first given a name and type of data to hold.

    For example: `Int a;` where `a` is an identifier and is of type integer.


    There are several C++ data types and each of these data types have their functions.
    Listed below are the various data types:

    - **Int:** These are small whole numbers e.g.

    - **Long int:** Large whole numbers

    - **Float:** small real numbers

    - **Double:** These are numbers with decimal points, e.g. `20.3`, `0.45`

    - **Long double:** Very large real numbers

    - **Char:** A single character

    - **Bool:** Boolean value. It can take one of two values: true or false ![](index-76_1.jpg)


    ## UNDERSTANDING CODE STATEMENTS


    When we first launched Eclipse and were welcomed with a greeting note, we saw
    a default program shortly after which if we ran using the steps we learnt earlier
    would have displayed “Hello World.” Let us go through the functions of those codes
    that were written in green, purple and red in that default program and how they
    operate.


    **#include:** The statement `#include` is a call for statements from a library
    to be included in the program being written. A library can be said a room which
    houses a lot of pre-written codes that we can utilize at any time. It saves us
    the stress of having to write every single thing we might need while coding.


    **<iostream>:** This is a library file which contains some certain functions which
    will enable us utilize some certain commands. Some of these commands include:
    `Cout` and `Cin`.


    **Cout:** This is a command that displays the outcome of written codes to the
    computer user. For example, if you write codes for a program that will ask a user
    questions, the `Cout` statement is what will make the questions visible to the
    user.


    **Cin:** This statement is a command which is used to receive input from a user.
    For instance if you write a program that collects the biometrics of different
    people, the `Cin` command is what will enable your program take in the information
    the computer user will key in.


    A good example explaining both the `Cin` and `Cout` statement is a calculator.
    `Cin` allows the calculator to take in your inputs and `Cout` lets it display
    an answer to you.


    ### EXAMPLES OF:


    **A single line comment:** `//Life is not a bed of roses.`

