  trans: '

    已经收集了涵盖键盘数字和符号的用例，现在测试一下键盘记录器是否真的能识别它们是非常好的。如上所示，我们已经编写了代码并设置运行。使用命令提示符窗口，我们在键盘上输入数字，并通过按住
    Shift 键连续输入数字 1 到 9 来输入符号。


    从上图中可以清楚看到，键盘记录器识别了我们的数字和符号输入。因此，如果用户恰好使用数字和符号作为密码、用户名或其他任何内容，我们的键盘记录器在目前的状态仍然能够良好工作。


    在此之前，我们添加了一个函数，使键盘记录器能够区分大写和小写字母，这样如果用户使用混合了数字、符号、大小写字母作为密码，它仍然能正常运行。


    ![](img/index-121_1.jpg)


    走到这一步，我们可以决定按现状使用键盘记录器，但添加更多功能也完全不是坏事，因为键盘记录器的按键越多，我们对其整体性能的信任就越高。让我们继续添加更多用例，让我们的键盘记录器在总体更具相关性。


    ### 虚拟键


    到为止，我们一直在添加围绕数字、字母和符号的一系列用例，但我们还没有真正做过工作的领域是虚拟键。虚拟键涵盖了 `tab` 键、`capslock`、`backspace`、`escape`、`delete`
    键以及许多其他键，如 `f-keys`、`arrow`键等，它们的作用是让键盘记录器获取的日志看起来美观易读。


    想象一下，如果你的键盘记录器发送你一周收集的输入，但不包含 backspace、delete 键或 tab，你的日志会变成什么样。日志将非常冗长，很难从中筛选出实际信息。


    我们尝试将键盘记录器的范围缩小，仅包含用户可能用于密码的大多数按键，而不是添加所有按键。例如，方向键、num lock 和 f-keys 并不一定需要添加到键盘记录器中。


    这很重要，因为大多数键盘记录器在发送信息之前会收集一周或更久的信息。此外，存在的不太相关的按键越多，为了获取我们需要的单个密码和用户名，我们需要筛选的输入负载就越大。


    可以在互联网上搜索虚拟键，并根据你的需求添加那些能更好地实现你目的按键。


    ![](img/index-122_1.jpg)


    ![](img/index-122_2.jpg)


    在第 127 行到第 145 行之间，我们包含了许多非常重要的代码，如上所示的 backspace、delete、escape 和其他键。


    如观察到的，虚拟键可以在既不使用 `if` 语句也不使用大括号的情况下编写，并且它们仍然运行良好。


    让我们对我们的键盘记录器进行一次真实测试，看看它的性能如何，以及日志文件的可读性会有提高。


    如上所示，我们的键盘记录器首先使用命令窗口再次测试一次，以衡量其功能。正如你可能已经注意到的，它显示用户在编写用户名的过程中使用了一次 backspace。所以你已经看到我们的日志文件更具可读性了。


    现在让我们在浏览器中测试键盘记录器，以确定它在


    ![](img/index-123_1.jpg)


    ![](img/index-123_2.jpg)


    ![](img/index-123_3.jpg)


    那里是否也能正常工作。


    我们访问了几个网站，最后停留在 Ubuntu 论坛，我们在那里输入了用户名和密码。如果我们的键盘记录器是好用的，它应该从我们第一次打开浏览器时就记录了我们的击键。让我们看看是否做到了。


    完美！我们的键盘记录器运行得非常好，因为它告诉我在访问 Udemy 和 Gmail 之前，最后才尝试登录 Ubuntu 论坛。


    ![](img/index-124_1.jpg)


    ### 隐藏键盘记录器控制台窗口


    基本上，我们已经在键盘记录器中加入了很多功能，可以说我们已经完成了。然而，在我们说完成键盘记录器之前，还有两件重要的事要做。第一件是：创建一个键盘记录器的
    `release` 版本，以便将其安装在 CD 上或作为文件发送；第二是：`隐藏文件`。我们还将看到键盘记录器的一个问题，这个问题在 eclipse 环境内运行时是无法看到的。


    以下是创建我们的键盘记录器发布版本的步骤：由于程序在编辑器中编写良好，请转到 eclipse 环境左上角的“锤子”图标。在出现的下拉菜单中，选择 `debug`
    然后选择 `release`。


    确保键盘记录器没有运行以避免获取错误消息。然后，选择 `build` 或使用 `ctrl + s` 实现相同的目的。


    打开文件管理器并进入我们的工作区。点击 `Keylogger`（这是我们的项目名称），打开它。在 `keylogger` 内部我们有一个 `debug` 版本、一个
    `release` 版本以及其他文件。现在，我们键盘记录器的发布版本准备好执行了。


    ![](img/index-125_1.jpg)


    ![](img/index-125_2.jpg)


    ### 隐藏键盘记录器


    点击 `Keylogger.exe`（执行文件）时，一个保存用户击键的黑色窗口出现在主屏幕上，看起来如下图所示：


    黑色窗口会将我们按的任何键记录到 `RECORD.txt` 文件中，但这一点也不好，因为任何在屏幕上看到这种显示的人都会觉得不对劲。你认为典型的电脑用户会做什么？可能会按
    X（关闭按钮），就结束了；你的键盘记录器停止运行，你所有的努力都无缘付诸流。


    然而，我们有一种方法可以隐藏这个窗口。我们可以通过在代码中创建一个会隐藏整个程序的函数来实现。让我们先给这个函数起一个名字，帮助我们在代码内部识别它，以便我们在任何需要时都能引用它，例如：`hide`。


    ![](img/index-126_1.jpg)


    ![](img/index-126_2.jpg)


    在创建隐藏键盘记录器的函数时，我们需要首先在 `main` 函数外部创建一个函数，然后在内部（即 `main` 函数）调用它；我们还需要在程序末尾创建另一个函数。


    在第 9 行，创建了一个名为 `hide` 的隐藏键盘记录器的函数。它创建在 `main` 函数外部。随后，该函数在第 13 行的 `main` 函数中被调用，程序末尾也添加了该函数的扩展，如下所示：在第
    182 行，创建名为 `stealth` 的处理器，用于处理由 `FindwindowA()` 函数生成的输入（主屏幕上的键盘记录器窗口）。在第 185 行，存储在
    `stealth` 中的键盘记录器窗口详情设置为 0。零意味着它不应该在主屏幕上显示。


    完成这些后，重新构建并发布我们的键盘记录器作为执行文件后，我们获得了极佳的结果。键盘记录器不再主屏幕上显示窗口，因此即使是你作为创建者也看不到它正在运行。然而，确认你的代码是否运行可能是一个问题。检查这个问题的方法是在系统的任何地方写东西，比如在记事本上。之后，打开我们的工作区以及
    `Record.txt` 文件，如果你的击键被保存了，说明你的键盘记录器工作正常。


    如果你已经读到了这里，热烈祝贺！


    最后，我们来到了这门介绍构建键盘记录器课程的终点。希望此时，**制作你自己的键盘记录器**对你来说不再是一个不可能的任务，而是一个可以轻松完成且毫无压力的任务。

