    The reader is given some practical guidance on setting up and practicing some
    beginner-level hacking in `Chapter 8: Your First Hack.` Two exercises are selected
    to help the aspiring hacker get their feet wet with some simple tools and inexpensive
    equipment.


    `Chapter 9: Defensive Security & Hacker Ethics` wraps up this introduction to
    hacking with some notes about protecting oneself from hackers, and discusses some
    of the philosophical issues associated with the ethics of hacking.


    # CHAPTER 1. WHAT IS HACKING?


    It is important to lay the groundwork for a proper introduction to computer hacking
    by first discussing some commonly used terms and to clear up any ambiguities with
    regard to their meanings. Computer professionals and serious hobbyists tend to
    use a lot of jargon that has evolved over the years in what had traditionally
    been a very closed and exclusive clique. It isn’t always clear what certain terms
    mean without an understanding of the context in which they developed. Although
    by no means a complete lexicon, this chapter introduces some of the basic language
    used among hackers and computer security professionals. Other terms will appear
    in later chapters within the appropriate topics. None of these definitions are
    in any way “official”, but rather represent an understanding of their common usage.


    This chapter also attempts to clarify what hacking is as an activity, what it
    is not, and who hackers are. Depictions and discussions of hacking in popular
    culture can tend to paint an overly simplistic picture of hackers and of hacking
    as a whole. Indeed, an accurate understanding is lost in the translation of buzzwords
    and popular misconceptions.


    ## HACKING & HACKERS


    The word `hacking` normally conjures images of a lone cyber-criminal, hunched
    over a computer and transferring money at will from an unsuspecting bank, or downloading
    sensitive documents with ease from a government database. In modern English, the
    term hacking can take on several different meanings depending on the context.
    As a matter of general use, the word typically refers to the act of exploiting
    computer security vulnerabilities to gain unauthorized access to a system. However,
    with the emergence of cybersecurity as a major industry, computer hacking is no
    longer exclusively a criminal activity and is often performed by certified professionals
    who have been specifically requested to assess a computer system’s vulnerabilities
    (see the next section on “white hat”, “black hat”, and “gray hat” hacking) by
    testing various methods of penetration. Furthermore, hacking for the purposes
    of national security has also become a sanctioned (whether acknowledged or not)
    activity by many nation-states. Therefore, a broader understanding of the term
    should acknowledge that hacking is often authorized, even if the intruder in question
    is subverting the normal process of accessing the system.


    Even broader use of the word hacking involves the modification, unconventional
    use, or subversive access of any object, process, or piece of technology - not
    just computers or networks. For instance, in the early days of hacker subculture
    it was a popular activity to “hack” payphones or vending machines to gain access
    to them without the use of money - and to share the instructions for doing so
    with the hacking community at large. The simple act of putting normally discarded
    household objects to new and innovative uses (using empty soda cans as pencil
    holders, etc.) is often referred to as hacking.


    Even certain useful processes and shortcuts for everyday life, like using to-do
    lists or finding creative ways to save money on products and services, are often
    referred to as hacking (often called “life hacking”). It is also common to encounter
    the term `hacker` in reference to anyone who is especially talented or knowledgeable
    in the use of computers.


    This book will concentrate on the concept of hacking that is specifically concerned
    with the activity of gaining access to software, computer systems, or networks
    through unintended means. This includes the simplest forms of social engineering
    used to determine passwords up to the use of sophisticated hardware and software
    for advanced penetration. The term `hacker` will thus be used to refer to any
    individual, authorized or otherwise, who is attempting to surreptitiously access
    a computer system or network, without regard to their ethical intentions. The
    term `cracker` is also commonly used in place of hacker – specifically in reference
    to those who are attempting to break passwords, bypass software restrictions,
    or otherwise circumvent computer security.


    ## THE “HATS” OF HACKING


    Classic Hollywood scenes of the Old American West often featured cartoonish depictions
    of gun slinging adversaries – usually a sheriff or marshal against a dastardly
    bandit or a band of miscreants. It was common to distinguish the “good guys” from
    the “bad guys” by the color of their cowboy hats. The brave and pure protagonist
    usually wore a white hat, where the villain wore a dark colored or black one.
    This imagery carried over into other aspects of culture over the years and eventually
    made its way into the jargon of computer security.


    ### BLACK HAT


    A `black hat` hacker (or cracker) is one who is unambiguously attempting to subvert
    the security of a computer system (or closed-source software code) or information
    network knowingly against the will of its owner. The goal of the black hat hacker
    is to gain unauthorized access to the system, either to obtain or destroy information,
    cause a disruption in operation, deny access to legitimate users, or to seize
    control of the system for their own purposes. Some hackers will seize, or threaten
    to seize, control of a system – or prevent access by others - and blackmail the
    owner into paying a ransom before relinquishing control. A hacker is considered
    a black hat even if they have what they themselves would describe as noble intentions.
    In other words, even hackers who are hacking for social or political purposes
    are black hats because they intend to exploit any vulnerabilities they discover.
    Similarly, entities from adversarial nation-states that are hacking for the purposes
    of warfare can be considered black hats regardless of their justifications or
    the international status of their nation.


    ### WHITE HAT


    Because there are so many creative and unanticipated ways to access computers
    and networks, often the only way to discover exploitable weaknesses is to attempt
    to hack one’s own system before someone with malicious intentions does so first
    and causes irreparable damage. A `white hat` hacker has been specifically authorized
    by the owner or custodian of a target system to discover and test its vulnerabilities.
    This is known as `penetration testing`. The white hat hacker uses the same tools
    and procedures as a black hat hacker, and often has equal knowledge and skills.
    In fact, it is not uncommon for a former black hat to find legitimate employment
    as a white hat because black hats typically have a great deal of practical experience
    with system penetration. Government agencies and corporations have been known
    to employ formerly prosecuted computer criminals to test vital systems.


    ### GRAY HAT

