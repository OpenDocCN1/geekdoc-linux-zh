    `分布式拒绝服务` (DDoS) 攻击是指黑客或一组黑客能够从大量机器执行协调的 DoS 攻击。这些传输攻击包的机器通过共同工作，可以简单地淹没目标系统，导致服务器无法被用户访问，或者对用户请求的响应极其缓慢以至于几乎无法使用。在大多数情况下，传输攻击相关数据包的机器甚至并不在执行攻击的黑客手中。当黑客准备进行大规模
    DDoS 攻击时，他们会在尽可能多属于不知情参与者的用户机器上植入恶意代码。通常，这些机器分布在广泛的地理区域和多个网络中，有时甚至遍布全球，使得执法部门或受害系统的安全人员难以切断攻击。


    # 恶意软件


    `malware` 一词是恶意（malicious）和软件（software）的组合。该术语涵盖了许多类型的软件，黑客可能会将这些软件植入目标机器，用以造成损害或控制目标的全部或部分。恶意软件是整个范围内一个广泛且严重的问题。恶意软件在宿主机上激活后，有无数种行为方式。有些被设计为传播到其他机器，而另一些则隐蔽地留在宿主机上，以便为黑客收集机密信息、占用计算机资源或对系统造成破坏。有时，恶意软件被放置在机器上，是为了日后控制该机器并与其他被大量接管的机器协同进行诸如
    DDoS 等攻击。


    ## 病毒


    `病毒` 是最古老且最广为人知的恶意软件类型。与其生物学上的名称一样，病毒被设计为从机器到机器进行传播，感染大量用户，有时在此过程中感染整个自包含的网络。这些恶意设备是代码段，它们将自己（就像生物病毒一样）附着在其他具有合法目的的程序上。当毫无防备的用户激活该合法程序时，病毒代码就会被执行，并可以在不被察觉的情况下运行。当病毒被激活时，它会复制自己，并尝试将其附着到其所访问的系统或网域内的其他合法程序上。这允许病毒遍布整个节点，并传播到网络上的其他节点。然而，病毒通常不是黑客为了简单让自己到处传播而写的。通常，黑客希望病毒在到达目的地后完成某项特定的任务。


    由于病毒被设计为保持隐藏，它可以在其宿主机上执行任何数量的动作。它可以收集个人和财务信息，并隐蔽地利用计算机自身的通信能力将信息回传给黑客。其他病毒被设计用于删除信息或干扰计算机的运行或通信。


    病毒甚至可以被编写成能够对计算机系统造成物理损坏。


    例如，20 世纪 90 年代非常流行的一种特定病毒被设计为使宿主机光驱硬盘上由电机控制的铁臂快速往复移动，直到电机故障。这种病毒会对具有网络连接的计算机控制的设备造成巨大破坏。


    ## 蠕虫


    `蠕虫` 与病毒的相似之处在于它们都被设计为在整个系统或网络中复制和传播。然而，由于病毒是较大程序的一部分，它们必须由用户下载，并且在执行恶意代码之前必须启动宿主程序。相反，蠕虫本身就是一个自包含的程序。蠕虫与病毒的区别还在于它们在执行时不需要用户打开另一个程序。一旦蠕虫感染了某台机器，它就可以复制自己，通过网络传播到另一个系统。


    蠕虫的目的通常不是造成损害或获取系统权限，而是消耗系统和网络资源，通过占用内存和网络带宽来减慢或停止该系统的运行。偶尔，蠕虫也可能用于收集信息。


    ## 警惕携带礼物的“极客”


    传说中，阿基亚人（古希腊人）与特洛伊人之间的史诗战争结束于机智的奥德修斯制作了一个巨大的木马，并将其留在特洛伊城门外作为给这座城市的贡品。感激的特洛伊人将这份大礼物推入城并带入他们臭名昭著的安全围墙之后，并不知道木马空腹内隐藏着一群希腊士兵。士兵们在晚上在黑暗的掩护下出现，为剩下的阿基亚军队打开大门，他们随后进入并洗劫了这座城市。几千年来，无论这个故事是否属实，它一直作为一个警示故事存在——提醒我们要保持警惕，有时看起来看似无害或无辜的事情可能会导致我们的失败。在计算机黑客领域，`特洛伊木马`是一种看起来是合法或理想软件的恶意软件。它甚至可能在用户下载它的任何用途上正常运行。特洛伊木马的典型目的（通常被称为“特洛伊”）是为黑客提供对目标系统的远程访问和控制。任何编写用于让黑客秘密控制用户机器进程的恶意软件被称为
    `rootkit`。


    病毒、蠕虫和特洛伊木马，以及它们交付到目标系统的各种有效负载，在创建时都需要相当编程技巧才能成功。计算机安全专家以及反恶意软件产品投入大量精力阻止这些恶意程序。从事恶意软件的黑客不断磨练技能，他们的创作在复杂性上不断演进。


    # 第 7 章 无线黑客


    破解 Wi-FI


    '
- fmt: '

    Most Wi-Fi networks consist of a wireless router, or a group of wireless routers,
    that are connected to a modem which is delivering internet access to some physical
    location. The routers broadcast and receive radio signals on specific channels
    that carry the appropriate `TCP/IP` packets to and from other machines and devices
    that have similar wireless connectivity. All nodes communicating at any given
    time on the channels associated with the router or routers that are connected
    to the modem at that location comprise a Wi-Fi network. By nature, Wi-Fi networks
    are very dynamic and fluid. Especially in commercial settings, like coffee shops
    or office buildings that provide wireless access, the number and nature of the
    nodes on that particular network are in constant flux.


    In these public settings, it is easy for a hacker to hide in plain sight and attempt
    to intrude into any of the nodes on the network. Once the hacker is successfully
    on the network itself, they can scan the network for all connected machines and
    probe for vulnerabilities. Many networks have both wireless and wired subnetworks
    that are interconnected. When a hacker gains access to a wireless network they
    can conceivably use that to leverage access to all of the nodes on the wired portion
    of the network. This makes WiFiFi hacking a very popular goal for modern hackers.


    ## WI-FI ENCRYPTION PROTOCOLS


    Since Wi-Fi signals are broadcast into the air as opposed to being confined within
    wires, it is important for the information contained in the signals to be encrypted.
    Otherwise, anyone could passively receive and view any information being sent
    between the nodes on the network. The encryption protocols used in Wi-Fi have
    necessarily evolved since wireless networks began gaining popularity. Moreover,
    as technology has improved and resulted in increased bandwidth and data rates,
    a great density of information can be broadcast from a wireless network in a very
    short period of time, making it especially important for it to be encrypted and
    kept out of the hands of malicious hackers.


    The oldest and most common Wi-Fi encryption protocol is Wired Equivalent Privacy
    (`WEP`). The goal of the `WEP` standard, as the name implies, was to give network
    users the same amount of security that they would have on a physically connected
    network. Unfortunately, over time `WEP` has become the least secure of all of
    the existing encryption protocols and it is quite easily hacked by even the most
    inexperienced hackers. `WEP` is so insecure in fact, that many Wi-Fi router manufacturers
    no longer provide that type of encryption as an option on their hardware. Most
    security professionals recommend that router owners do not use `WEP` when other
    options are available. Step-by-step instructions and coding examples for attacking
    `WEP` protected Wi-Fi networks are freely and readily available on the internet.
    Although the level of encryption has increased from 64 bit to 128 bit to 256 bit,
    the underlying flaws in `WEP` remain easily exploitable by even the most green
    of neophyte hackers.


    The biggest problem with `WEP` is that a password can be quickly and easily deciphered
    simply through the passive “sniffing” (receiving and viewing network packets)
    of network traffic.


    A significant step up from `WEP` Wi-Fi encryption is the Wi-Fi Protected Access
    (`WPA`) standard of encryption. This new protocol fixed many of the problems in
    `WEP`, but remained vulnerable to attack because it was still based on some of
    the same underlying encryption algorithms. Furthermore, `WPA`-protected routers
    were deployed with a feature that was designed to make it more convenient for
    home users to connect new devices to their network. This feature proved to be
    an additional vulnerability in systems that employed `WPA`.


    It wasn’t long before an update to `WPA` was needed to keep Wi-Fi networks more
    secure. A new encryption standard being used in other secure applications, the
    Advanced Encryption Standard (`AES`), became mandatory in the new Wi-Fi encryption
    protocol which became known as `WPA-2`. `WPA-2` with `AES` encryption has become
    the recommended setting for wireless routers on which it is available because
    of its significant improvement in security over its preceding standards. Cracking
    `WPA` and `WPA-2` requires more intrusive hacking techniques than the simple passive
    sniffing that can be used to attack `WEP`-protected networks.


    ## WI-FI ATTACKS


    In order to conduct a Wi-Fi attack a hacker needs, at a minimum, a computer (normally
    a laptop) that can run scripts which are used to decipher the Wi-Fi password.
    They also must acquire a special Wi-Fi adapter that can be purchased relatively
    cheaply.


    ![](index-50_1.jpg)


    A list of suitable Wi-Fi adapters can be found on hacker resource websites, but
    in general the adapter must have a feature known as “monitor mode” in order to
    be able to execute a Wi-Fi attack. It is important to note that not all Wi-Fi
    adapters that can be found at retail computer supply stores have this feature,
    and most internal laptop adapters are not appropriate.


    In general, hackers prefer to use some sort of Linux distribution, usually `Kali`,
    to conduct a Wi-Fi attack because most of the readily available tools were written
    for the Linux OS and come preinstalled on `Kali`. It is also possible with some
    configuration to run Linux on a virtual machine within another OS to mount a successful
    attack. Although attacks from other operating systems are possible, it is much
    easier for the beginner to conduct them from either a native Linux distribution
    or a virtual machine. A hacker-friendly distribution like `Kali` is recommended.


    The detailed procedures and recommended programs for conducting Wi-Fi attacks
    against the various encryption protocols changes over time, although the general
    principles are the same. For the simplest attack, which is against `WEP` encryption,
    the general steps are as follows:


    1) monitor and view all Wi-Fi traffic in the range of the adapter while in “monitor
    mode” (set by a program called `airmon-ng`) using a program called `airodump-ng`.


    Live W-Fi Traffic on Several Routers ([aircrack-ng.org)](http://aircrack-ng.org)


    2) choose a target Wi-Fi network that is using `WEP` encryption and make a note
    of the name (`ESSID`) and network address (`BSSID` in the form `XX:XX:XX:XX:XX:XX`)


    ![](index-51_1.jpg)


    3) restart `airodump-ng` to begin capturing network traffic from the specific
    network that you are targeting


    4) wait for a sufficient number of packets to be captured (this may take longer
    on networks with less traffic)


    5) use a program called `aircrack-ng` to piece together the captured network packets
    into a coherent password


    A Successfully Decrypted Wi-Fi Key ([aircrack-ng.org](http://aircrack-ng.org))
    If network traffic is too slow to capture a sufficient number of packets for decrypting
    the password in a reasonable period of time, some hackers choose to use a program
    called `aireplay-ng` to inject artificial packets into the network and create
    the necessary traffic to crack it more quickly. However, this activity requires
    the hacker’s machine to actually broadcast signals from its Wi-Fi adapter, making
    it more conspicuous.


    `WPA` encryption cannot be cracked passively and requires the additional step
    of packet injection. Cracking `WPA` can take longer and is a more invasive procedure,
    but it is not much more difficult than cracking `WEP`. A program called `reaver`,
    normally available on the `Kali` distribution is typically used by hackers to
    crack `WPA`. `WPA-2` hacking is a much more advanced concept for more experienced
    practitioners. (Note: the software tools above are preinstalled on `Kali Linux`,
    or can be downloaded from [www.aircrack-ng.org](http://www.aircrack-ng.org))


    # CHAPTER 8. YOUR FIRST HACK

