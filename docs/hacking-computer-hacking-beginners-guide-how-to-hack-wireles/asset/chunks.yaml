    Though the Keylogger we have built here might not be the most advanced one that
    there is out there or one with the super features that you expected a keylogger
    to have, however with the knowledge you have gathered on building what we have
    here, making others with more advanced features such as webcam activation, screen
    capturing and other cool features wouldn’t be a problem to you with little research.


    Furthermore, if you followed this course it is expected that you understand pretty
    much about the `C++` programming language, its syntax, how it functions and you
    are able to write other programs beside the Keylogger which you have just learnt
    to build.


    Continue practicing, researching and finding solutions to problems you will encounter
    along the way and you will record great improvements.


    # ABOUT THE AUTHOR


    Alan T. Norman is a proud, savvy, and ethical hacker from San Francisco City.


    After receiving a Bachelors of Science at Stanford University. Alan now works
    for a mid-size Informational Technology Firm in the heart of SFC. He aspires to
    work for the United States government as a security hacker, but also loves teaching
    others about the future of technology. Alan firmly believes that the future will
    heavily rely on computer "geeks" for both security and the successes of companies
    and future jobs alike. In his spare time, he loves to analyze and scrutinize everything
    about the game of basketball.


    # CONCLUSION


    While this book was being written, it is likely that dozens, if not hundreds,
    of new computer and network vulnerabilities and their corresponding exploits developed.
    Such is the dynamic nature of the world of hacking and information security. In
    the spirit with which this guide began - with an emphasis on the constant honing
    and acquisition of skills and knowledge – the aspiring hacker should take the
    basic outline of this book and use it as a basis to methodically expand on each
    individual theme, delving into both the history and current state-of-the- art
    of the areas in which they are most interested. Most importantly, they should
    construct a consequence-free space – either with virtual or physical hardware
    - to practice both exploits and security. Finally, before setting out on the journey
    of hacking, you would come to terms with the ethical, moral, and legal implications
    of your activities with a full understanding of both your goals and responsibilities.


    # ONE LAST THING...


