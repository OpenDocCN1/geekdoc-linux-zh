  trans: '

    找到了！！！我们的语句就位于我们通过设置的路径创建的文件中。


    做得好。


    现在，在代码结束时始终关闭文件是一个良好的习惯。这项工作非常简单，而且我们有一个内置函数来处理它，它只需要重写我们的 `output filestream`
    名称（第 8 行：`write`），加上 `.close()` 以及括号和分号，如下图 I 所示，即 `write.close()`。即使我们看不到它，这也能有效地关闭文件。


    ### 从文件中读取内容


    我们将学习从文件中读取输入内容的基本过程，但稍后我们必须将其与循环结合起来，以便实现更强大的功能。目前，我们将学习如何从文件中读取单个字符。


    下面的图显示了完成此操作的程序，让我们来评估一下。


    ![](img/index-99_1.jpg)


    ![](img/index-99_2.jpg)


    首先，因为我们需要一个变量来存储它，所以在第 11 行创建了一个类型为 `string` 的变量 `x`。在第 13 行，语句 `read >> x;` 将第一个单词读取到
    `x` 中，即它只读取到第一个空格为止。


    在第 15 行，`Cout << x,` 指令程序向控制台打印语句变量 `x`。


    运行程序时，显示“Windows”，这是发送到我们文件（`OUR_FILE.txt`）的语句中的第一个单词。


    请在上方图中查找更多解释。


    随着学习的深入，我们将看到如何读取整个语句或输入，无论其长度如何，无论每个单词之间的空格如何等等。这并不复杂，因为我们只需要创建一个循环并知道如何处理它。我们一定会这样做，因为我们需要掌握如何向文件中写入内容以及从文件中读取内容。


    我们终于完成了 C++ 的基础学习，现在可以开始构建我们的键盘记录器（Keylogger）了。我们将从能着的最简单、最原始的键盘记录器开始，以便打好基础，然后转向更复杂的程序。


    ![](img/index-101_1.jpg)


    ### 基础键盘记录器


    键盘记录器首先需要的是 `#include <windows.h>` 和 `#include <Winuser.h>` 头文件，因为我们需要某些由这些文件提供的函数。


    在循环中嵌套循环（嵌套循环）是非常重要的，因为键盘记录器内部有很多这种结构。下面的程序展示了如何在另一个循环内部构建一个循环并使其无限运行。


    在第 11 行，创建了一个类型为 `char` 的变量，在第 13 行开始了第一个循环（`for` 循环）。在这个循环的括号内，设置了条件来控制程序块的操作。创建了一个类型为
    `int` 的变量 `i` 并初始化为 0。只要 `i` 小于 3，循环就会继续运行，即 `i` 将运行两次。`i++` 计数并记录程序完成的循环次数，一旦满足
    `i < 3` 的条件就会停止。此循环的开始和结束由大括号定义，跨越从第 14 行到第 21 行。


    **注意：** 大括号用于标记函数（functions）的开始和结束。


    换句话说，第 13 行的 `for` 循环将开始，一旦开始，它将开始评估内部列出的条件。如果评估为 `true`，即如果 `i`


    ![](img/index-102_1.jpg)


    小于 3，它将运行 `for` 循环大括号内的任何代码。


    在第 15 行和 18 行之间，我们在第一个循环下方嵌套了另一个 `for` 循环。程序评估第 15 行的代码，只要评估为 `true`，它就会继续打印第
    17 行的语句，直到变为 `false`——当 `j` 大于等于 `3` 时——它将停止，退出第二个循环并进入第一个循环，然后再次打印第 20 行的语句。如果第一个条件再次评估为
    `true`，第二个循环将再次运行，如此重复 3 次（0 – 2 = 0, 1, 2 次）。请结合其输出学习下面的程序。


    ![](img/index-103_1.jpg)


    ![](img/index-103_2.jpg)


    ![](img/index-103_3.jpg)


    现在你已经理解了嵌套结构是如何工作的，让我们直接进入它在键盘记录器上的应用。


    从正上方的图中，第 12 行包含一个 `for` 循环。括号内的两个分号规定该循环是无限的，即它是


    ![](img/index-104_1.jpg)


    设置为持续运行而不停止。在第 14 行有一个嵌套循环，其条件指定了程序能够读取的字符范围。


    这一范围的字符是从 ASCII 码获得的。没有必要在脑中携带 ASCII 表，可以从网上引用它。下面是 ASCII 代码表示例：每个数字代表一定数量的字符。在我们的键盘记录器程序中，第
    14 行包含了 ASCII 表中 8 到 222 之间的字符。第 16 行的语句对我们来说是新的，但它并不复杂。它被称为“系统中断函数”。它的作用是观察计算机用户是否在键盘上输入了任何内容。考虑到它与
    `if` 语句一起使用，意思是：用户是否已按下任何键？如果是，将按键存储在我们的变量 `c` 中，然后根据第 18 行和 19 行将其发送到我们的文件中。


    在同一行（18 行）括号内，`ios::app` 指定我们不希望在有人按下按键时重写文件。如果不指定这一点，每当用户按下按键，文件就会重新打开，之前写入的任何将被新内容覆盖。


    我们似乎完成了原始键盘记录器的编写并准备好运行它了。


    然而，如果我们尝试按照原样运行程序，将会得到错误消息。粗一看，你认为什么可能导致错误？


    头文件！我们未能附加启用程序运行/执行代码中指定函数的头文件，即发送接收输入的文件的函数


    ![](img/index-105_1.jpg)


    ![](img/index-105_2.jpg)


    此函数的头文件（允许我们利用 `ofstream` 函数）是 `#include <fstream>`。现在，在代码顶部加上以下头文件后，我们的程序将成功运行：在我们的
    eclipse 环境运行键盘记录器程序时，我们可能会认为程序没有运行，因为窗口控制台上不会打印任何内容。这是正常的，但我们没有在代码的任何地方指定输入打印内容，而是发送到我们的文件中。


    我们的小型键盘记录器功能是存储我们目前在系统任何地方记录的按键，并将其发送到 `Record.txt`。为了证明键盘记录器正在工作，让我们访问浏览器，进行输入并返回我们的文件查看输入是否已存储。


    在在方的图中，可以看到打开了浏览器并访问了 Yahoo 网站。现在我们登录了，输入用户名为 `USERNAME`，密码为 `PASSWORD`。在此之后，为了确定键盘记录器是否在运行，我们到了键盘记录器项目的默认文件位置，正如部分覆盖浏览器的白色屏幕所示，我们为网站
    `Yahoo.com` 做的输入被记录了（然而，`yahoo.com` 中的点不存在，在我们继续为键盘记录器添加更多功能时，我们会确保考虑到所有字符）。`Username`
    和 `Password` 也被记录为


    ![](img/index-106_1.jpg)


    所示。


    我们成功编写了一个非常简单的键盘记录器，但它缺少一些功能，例如 `filters`（过滤器），它可以过滤掉一些不需要的字符，例如我们在输入时出现的类似 Tab
    的空格。此外，我们还将为它添加其他功能。

