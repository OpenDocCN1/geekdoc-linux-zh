- fmt: '

    The neophyte hacker shouldn’t even think about attempting an attack on a real
    target as their first foray into hacking. Sufficient tools and technologies exist
    which are easily obtained and with which various methods can be rehearsed in a
    virtual environment. This type of practice is essential for the hacker and is
    more valuable than all of the reading and study one could accomplish. To build
    confidence and gain appreciation for the nuances and practical pitfalls, the beginning
    hacker should aspire to accomplish the simple attacks suggested in this chapter.
    The details of the attacks will vary and currently applicable instructions should
    be researched by the reader, but the general principles of the setup and execution
    should be fairly universal.


    # HACKING YOUR OWN WI-FI


    The purpose of this practice attack is to successfully obtain the password of
    a WEP-encrypted Wi-Fi network. To minimize risk, the network and any connected
    devices should be owned or controlled by you, or by someone who has given you
    explicit permission to perform penetration testing.


    ### What you need:


    1) A computer

    2) A wireless network adapter that supports `monitor mode`

    3) Access to a Wi-Fi router with WEP encryption (does not have to have internet
    access)

    4) The latest version of `Kali Linux` (installed as the primary OS or in a virtual
    machine)


    ### Setting up:


    1) Ensure that the router is set to WEP and give it a password of your choice

    2) Turn off the internal Wi-Fi adapter on your laptop if you have one

    3) Connect the `monitor mode` adapter to your attack machine and install any necessary
    drivers

    4) Be sure the attack computer is in wireless range of the target network


    ### Procedure:


    1) Follow the `Wi-Fi Hacking` steps from Chapter 7

    2) Confirm that the cracked password matches the one you set for the network

    3) Repeat the hack using `aireplay-ng` for packet injection and compare execution
    times

    4) Change the length or complexity of the password and repeat the hack, comparing
    execution times


    # A VIRTUAL WINDOWS VULNERABILITY ASSESSMENT


    Operating systems contain multiple software vulnerabilities that hackers are ready
    and willing to exploit. When a hacker discovers an un-patched version of an OS,
    there are a number of commonly available exploits with which to gain access. The
    first step in deploying those exploits is to analyze the OS for the most glaring
    vulnerabilities. `Kali Linux` features natively installed tools that will scan
    a system and provide a list of vulnerabilities. This exercise will require two
    virtual machines running within the same system (regardless of the host OS). It
    will also require an installation image for an older, unsupported, and un-patched
    version of `Microsoft Windows` (`Windows ’95` or `’98` are good choices). These
    images can be obtained online (`usgcb.nist.gov`) or from an old CD.


    ### What you need:


    1) A computer with any OS

    2) Virtualization software

    3) The latest version of `Kali Linux`

    4) An unsupported, un-patched version of `Microsoft Windows`


    ### Setting up:


    1) Install `Kali Linux` on a virtual machine

    2) Install the target `Windows` distribution on a virtual machine (on the same
    host system as `Kali`)


    ### Procedure:


    1) Execute a network scan from the `Kali` virtual machine using a program called
    `nmap`

    2) Practice changing various settings in `nmap` so that OS vulnerabilities will
    be detected and displayed

    3) Make note of the listed `Windows` vulnerabilities and begin researching exploits!


    # CHAPTER 9. DEFENSIVE SECURITY & HACKER ETHICS


    Looking at the world through the eyes of the hacker can be a scary thing. When
    you realize how vulnerable your home network is, the first thing you want to do
    is change your Wi-Fi encryption. You look at emails more closely and with an edge
    of suspicion. Knowing what you know about scripting attacks, you start to be mindful
    not to leave too many browser windows or tabs open simultaneously. Understanding
    the tools and motives of malicious hackers gives people a new appreciation for
    information and computer security. This knowledge should also give the beginning
    hacker pause to reflect on the reasons that they are choosing to learn hacking
    and an understanding that the power they may eventually gain should come along
    with an equal degree of responsibility. This chapter explores how individuals
    and organizations can protect themselves from some of the most common types of
    attacks and discusses some of the ethical issues associated with operating as
    a white hat or gray hat hacker.


    ## PROTEing Yourself


    From simple measures like ensuring a secure password, to more advanced concepts
    like choosing the proper encryption protocols and installing protective network
    software, computer security is an everyday process for people who live in our
    connected world. Most aspects of day-to-day security simply involve common sense
    and vigilance. It is helpful to get into a regular routine for periodic tasks
    like updating or changing passwords, ensuring the latest versions or patches for
    installed software and operating systems, and downloading current virus and malware
    definitions. In order to avoid becoming a victim of the attacks you are learning
    as a beginning hacker, security should become a part of your daily life and your
    thought process.


    ### PASSWORD AND EMAIL PRACTICES


    The days of using your dog’s name and the last four digits of your Social Security
    number as your email password are over. Using a properly configured password is
    one of the easiest ways for people to prevent themselves from some very simple
    “brute force” attacks on logins. The first thing that password-guessing hackers
    and automated password cracking software do is look for common proper names, words
    commonly found in a dictionary, and simple sequences of numbers. A surprising
    number of people continue to use these types of passwords because they are much
    easier to remember. It is important to note that the practice of replacing certain
    letters in common words with numbers or symbols that have similar appearance (for
    example: `p@55w0rd` instead of `password`), although it is more secure than using
    a common word in its original form, is no longer fooling hackers. Most hackers
    have caught onto this trick and are using scripts which will cycle through the
    replacement characters during a brute force attack.


    It is not uncommon for a modern individual to have dozens of passwords for various
    machines, email accounts, and websites. It is frustrating to have to keep track
    of so many different passwords, and to have reset them when they are forgotten.
    However, the inconvenience of proper password practice is ultimately preferable
    to being victimized by a malicious hacker. Longer passwords with sufficient complexity
    and a mix of letters, numbers, and special characters at the least extend the
    amount of time hackers have to spend attempting to crack a password. An extra
    layer of security, as frustrating as it may be, is not to use the same password
    for all of your accounts. If a hacker is somehow able to successfully crack one
    of your passwords, they will then have access to all of your other accounts if
    you are constantly recycling the same password.


    It is sometimes considered acceptable password security to write down passwords,
    as long as they are stored securely. However, individuals that write down passwords
    on sticky notes that are attached to their computer monitors are just asking for
    the next “shoulder surfing” hacker to make them regret that decision. In addition,
    the longer a password stays around, the more likely it is to be cracked, so it
    is recommended to change passwords on occasion (no need to overdo it, in most
    cases every few months or even every year is sufficient.)

