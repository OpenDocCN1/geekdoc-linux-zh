    Many viruses, Trojans, and other malware are frequently delivered to a target
    machine through email - either as direct attachments or through links to infected
    websites. It is important to thoroughly inspect the sender of an email to be certain
    that they are who they say they are. Hackers will often use fake email addresses
    that are very similar in appearance to legitimate senders. Users should look out
    for subtle differences in the format of an email (for example `john@mybank.com`
    vs. `john@my-bank.com`). Sometimes, advanced hackers are able to forge their return
    email address to look identical to a legitimate address, but there is information
    in the email headers that indicate ill intent.


    Any links provided in an email should also be viewed with a certain amount of
    suspicion. You should be sure that the links are from someone you trust, and ask
    yourself if that person would’ve sent you that sort of link. A little bit of common
    sense will go a long way. Before opening any email attachment, especially one
    that is an executable file, a virus or malware scan should be run on the email.


    ## Computer Software Security


    Computer security professionals occasionally disagree on the efficacy of antivirus
    software. Some argue that expensive software for virus and malware protection
    can be a waste of money because advanced hackers are adept at circumventing those
    protections. However, there are multiple free computer security software suites
    available that will protect the computer systems of most home users against the
    majority of the most basic and prevalent nefarious programs, provided that the
    security software is kept up to date.


    In any event, most software provides its own security through patches and updates.
    This is why it is very important for users to either manually update their software
    and operating system, or to allow those programs to update themselves automatically.
    This is especially critical for patching vulnerabilities in operating systems
    and web browsers. `Microsoft Windows`, `Java`, and `Adobe Flash` are commonly
    targeted by hackers and should be constantly kept up to date.


    ## Network Security and Encryption


    A Wi-Fi router’s encryption protocol should be set to the highest level of encryption
    available to its particular hardware. It is also good practice to set your router
    to not publicly broadcast the name of the network (although most hackers can easily
    get around this trick). Password security is especially important on Wi-Fi networks
    because a sufficiently lengthy and complex password can extend the amount of time
    it takes a hacker to crack your network password by a significant amount of time.
    In many cases, using `WPA-2` encryption with a password of maximum length and
    sufficient complexity will make it so difficult and time-consuming for a hacker
    to crack into the network that they will simply move on to another, less secure
    target.


    ## Web Application Security


    Vulnerabilities in website applications, especially with `SQL` and other scripted
    languages that are present within web code, are numerous.


    Programmers of websites that provide user access to information and services need
    to institute certain safeguards against some of the more common attacks.


    Many SQL injection attacks are easily thwarted by `sanitizing` user input before
    it is attached to any `SQL` commands. In other words, before the string that a
    user has entered into a web interface is inserted as a variable into an `SQL`
    statement, a subroutine should check the string for suspicious content. This procedure
    can be used for other types of injection attacks as well, including cross-site
    scripting and cross-site request forgery.


    ## The Ethical Hacker


    It should be clear that hacking is not the exclusive realm of thieves, terrorists,
    saboteurs, and mischievous teenagers. The study and practice of hacking is essential
    for the understanding of how to best protect against hackers that intend to do
    harm. Although hacking is not generally expensive, the knowledge and skills required
    for hacking are not easily acquired and take discipline and dedication to master.
    This makes the hacking community – at least in terms of the successful ones –
    a fairly exclusive group. It also gives talented hackers an advantage over the
    general population that those with ill intentions readily exploit.


    The personal ethics and moral compass of individuals tend to bleed over into any
    activity they undertake. However, the ease with which some intelligent individuals
    can execute hacking attacks against their less-informed peers may present a tantalizing
    temptation to otherwise law-abiding citizens. The potential anonymity with which
    some attacks can be launched only adds to that temptation.


    Additionally, it can be easy to convince oneself that the end goals of an attack
    justify any subversive means. This is especially true in cases where hackers or
    groups of hackers are serving a political or social purpose. It is up to each
    individual to determine whether their activities warrant the risk of arrest and
    punishment (including incarceration) and to think about whether the value they
    place on their own security and privacy extend to the targets of their attacks.


    ## Make Your Own Keylogger in C++


    Today, with the existence of a program called a `Keylogger`, gaining unauthorized
    access to a computer user’s passwords, accounts and confidential information has
    become as easy as falling off a log. You don’t necessarily need to have physical
    access to the user’s computer before you are able to monitor it, sometimes all
    it takes is a single click on a link to your program by the user.


    Anyone with basic knowledge about computer can use a `Keylogger`. By the time
    you are done with this chapter, hopefully you will be able to make your own keylogger
    through simple, well explained and illustrated steps I have made for you.


    ### What is a Keylogger?


    A keylogger, sometimes called a “keystroke logger” or “system monitor” is a computer
    program that monitors and records every keystroke made by a computer user to gain
    unauthorized access to passwords and other confidential information.


    ### Making Your Own Keylogger vs Downloading One


    Why it’s better to write your own Keylogger as opposed to just downloading it
    from the internet is the reason of Anti-virus detection. If you write your own
    custom codes for a keylogger and keep the source code to yourself, companies that
    specialize in creating Anti-virus will have nothing about your Keylogger and thus,
    the chances of cracking it will be considerably low.


    Furthermore, downloading a `Keylogger` from the Internet is tremendously dangerous,
    as you have no idea what might have been imbedded in the program. In other words,
    you might have your own system “monitored”.


    ## Requirements for Making Your Own Keylogger


    In other to make your own Keylogger, you will need to have some certain packages
    ready to use. Some of these packages include:


    #### 1. A Virtual Machine


    When codes are written and needed to be tested, it is not always advisable to
    run them directly on your computer. This is because the code might have a destructive
    nature and running them could leave your system damaged. It is in cases of testing
    written programs that the utilization of a `Virtual Machine` comes handy.


    A virtual machine is a program that has an environment similar to the one your
    computer system has, where programs that might be destructive can be tested without
    causing the slightest harm to it, should it be destructive.


    You will be right if you say - whatever happens within a virtual machine stays
    within a virtual machine. A virtual machine can be downloaded easily.


    #### 2. Windows Operating System

