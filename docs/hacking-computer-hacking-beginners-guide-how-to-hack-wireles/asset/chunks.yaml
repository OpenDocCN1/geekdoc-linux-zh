    As the name implies, the term `gray hat` (often spelled as “grey”) is a bit less
    concrete in its characterization of the hacker’s ethics. A `gray hat-hacker does
    not necessarily have the permission of a system owner or custodian, and therefore
    could be considered to be acting unethically when attempting to detect security
    vulnerabilities. However, a gray hat is not performing these actions with the
    intention of exploiting the vulnerabilities or helping others to do so. Rather,
    they are essentially conducting unauthorized penetration testing with the goal
    of alerting the owner to any potential flaws. Often, gray hats will hack for the
    express purpose of strengthening a system that they use or enjoy to prevent any
    future subversion by actors with more malicious intent.


    # CONSEQUENCES OF HACKING


    The consequences of unauthorized computer access range from the minor costs and
    inconveniences of everyday information security to severely dangerous and even
    deadly situations. Although there can be serious criminal penalties against hackers
    who are caught and prosecuted, society at large bears the brunt of the financial
    and human costs of malicious hacking. Because of the interconnected nature of
    the modern world, a single clever individual sitting in a café with a laptop computer
    can cause enormous damage to life and property.


    It is important to understand the ramifications of hacking in order to know where
    to focus efforts for the prevention of certain computer related crimes.


    ## CRIMINALITY


    There are, of course, legal consequences for hackers caught intruding into a computer
    system or network. Specific laws and penalties vary among nations as well as among
    individual states and municipalities. Enforcement of laws also varies among nations.
    Some governments simply do not prioritize the prosecution of cybercrimes, especially
    when the victims are outside of their own country. This allows many hackers to
    operate with impunity in certain parts of the world. In fact, some advanced nations
    have elements within their governments in which hacking is a prescribed function.
    Some military and civilian security and law enforcement agencies feature divisions
    whose mandate is to hack the sensitive systems of foreign adversaries. It is a
    point of contention when some of these agencies intrude into the private files
    and communications of their own citizens, often leading to political consequences.


    Penalties for illegal hacking largely depend on the nature of the transgression
    itself. Accessing someone’s private information without their authorization would
    likely carry a lesser penalty than using the access to steal money, sabotage equipment,
    or to commit treason. High-profile prosecutions have resulted from hackers stealing
    and either selling or disseminating personal, sensitive, or classified information.


    ## VICTIMS


    Victims of hacking range from being the recipients of relatively harmless practical
    jokes on social media, to those publicly embarrassed by the release of personal
    photos or emails, to victims of theft, destructive viruses, and blackmail. In
    more serious cases of hacking where national security is threatened by the release
    of sensitive information or the destruction of critical infrastructure, society
    as a whole is the victim.


    Identity theft is one of the most common computer crimes. Hackers target the personal
    information of unsuspecting individuals and either use the data for personal gain
    or sell it to others. Victims often don’t know that their information has been
    compromised until they see unauthorized activity on their credit card or banking
    accounts. Although personal data is often obtained by hackers by targeting individual
    victims, some sophisticated criminals have in recent years been able to gain access
    to large databases of personal and financial information by hacking the servers
    of retailers and online service providers with millions of customer accounts.
    These high-profile data breaches have enormous cost in monetary terms, but also
    damage the reputations of the targeted companies and shake the public''s trust
    in information security. Similar data breaches have resulted in the public distribution
    of personal emails and photographs, often causing embarrassment, damaging relationships,
    and resulting is loss of employment of the victims.


    ## PREVENTION COSTS


    There is a classic “Catch-22“ when it comes to the prevention of hacking. For
    most individuals, it takes little more than some common sense, vigilance, good
    security practices, and some freely available software to stay protected from
    most attacks. However, with the rise in popularity of cloud computing, where files
    are stored on an external server in addition to or instead of on personal devices,
    individuals have less control over the security of their own data. This puts a
    large financial burden on the custodians of cloud servers to protect an increasingly
    high volume of centralized personal information.


    Large corporations and government entities thus regularly find themselves spending
    equal or more money per year on computer security than they might lose in most
    common attacks. Nevertheless, these measures are necessary because a successful,
    large-scale, sophisticated attack – however unlikely – can have catastrophic consequences.
    Similarly, individuals wishing to protect themselves from cyber criminals will
    purchase security software or identity theft protection services. These costs,
    along with the time and effort spent practicing good information security, can
    be an unwelcome burden.


    ## NATIONAL AND GLOBAL SECURITY


    The increasing reliance of industrial control systems on networked computers and
    devices, along with the rapidly interconnected nature of critical infrastructure,
    have left the vital services of industrial nations highly vulnerable to cyber-attack.
    Municipal power, water, sewer, internet, and television services can be disrupted
    by saboteurs, whether for the purpose of political activism, blackmail, or terrorism.
    Even short-term interruption of some of these services can result in loss of life
    or property. The safety of nuclear power plants is of particular concern, as we
    have seen in recent years that hackers can implant viruses in commonly used electronic
    components to disrupt industrial machinery.


    Banking systems and financial trading networks are high value targets for hackers,
    whether they are seeking financial gain or to cause economic turmoil in a rival
    nation. Some governments are already openly deploying their own hackers for electronic
    warfare. Targets for government and military hacking also include the increasingly
    networked vehicles and instruments of war.


    Electronic components can be compromised by hackers on the production line before
    they ever even make it into a tank, battleship, fighter jet, aerial drone, or
    other military vehicle – so governments must be careful about who they contract
    in the supply line. Sensitive email, telephone, or satellite communications must
    also be protected from adversaries. It is not just nation-states who are a threat
    to advanced military systems. Terrorist organizations are becoming increasingly
    sophisticated and are shifting to more technological methods.


    # CHAPTER 2. VULNERABILITIES AND EXPLOITS


    The essence of hacking is the exploitation of flaws in the security of a computer,
    device, software component, or network. These flaws are known as `vulnerabilities`.
    The goal of the hacker is to discover the vulnerabilities in a system that will
    give them the easiest access or control that serves their purposes. Once the vulnerabilities
    are understood, `exploitation` of those vulnerabilities can begin, whereby the
    hacker takes advantage of the system flaws to gain access. Generally, black hat
    and white hat hackers intend to exploit the vulnerabilities, albeit for different
    purposes, where gray hats will attempt to notify the owner so that action can
    be taken to protect the system.


    ## VULNERABILITIES

