    `phishing`. In the tradition of the quirky nomenclature of hacking jargon, phishing
    is a homonym of “fishing”, and gets its name from the idea that the practice is
    similar to dangling a hook in the water, waiting for a fish to bite. A typical
    phishing email is written to resemble a legitimate communication from a bank,
    from an online shopping or service account, or even from a department within a
    victim’s own organization. Often, the email will present itself to the user as
    a request to confirm or reset a password. Sophisticated phishing messages will
    use forged email headers, convincing language, and nearly identical formatting
    to legitimate emails. If a target user falls for the trap, they will respond to
    the email with their username and password or click on a web link that accepts
    the information in a legitimate-looking form. Normally, thousands of emails will
    be deployed in a single phishing attack in the hopes that at least a small percentage
    of recipients will respond.


    In contrast to phishing, where a high volume of identical emails is sent to multiple
    users like dangling bait among many fish, `spear-phishing` targets specific users
    – just as a spear-fisherman is aiming at an individual fish.


    Although `spear-phishing` does not produce a high volume of accounts like a phishing
    attack, it can have a higher rate of success because more individualized emails
    are generally more convincing. A well-executed spear-phishing email will often
    address the target user by name, and contain other personal details to make it
    appear more authentic. Thus, there is typically some research or social engineering
    that precedes a spear-phishing attack. In most cases, this type of attack is conducted
    because the hacker has identified the individuals being targeted as possessing
    information, assets, or computer access that is of particular interest. The ultimate
    spear-phishing attacks are leveled against high-value targets in an organization
    – typically executives or information officers with top access. Because these
    individuals are the “big fish”, this type of attack has become known as `harpooning`
    or `whaling`.


    Phishing, spear-phishing, and harpooning attacks are not only conducted for the
    purpose of obtaining passwords. Sometimes they are used to gather other information
    or to deliver malicious software to a target system.


    # WEB EXPLOITS


    There are many kinds of web vulnerabilities and associated exploits - and new
    ones arise just as quickly as old ones are closed. There are dozens of languages
    that are pieced together in various combinations to create a website or web application
    and vulnerabilities can exist anywhere within that structure.


    Listed here are a few examples of common exploits that illustrate how hackers
    use vulnerabilities to their advantage.


    ## SQL INJECTION


    The SQL database query language is widely ubiquitous on the World Wide Web. It
    is used most often within other web code to manage user logins and database access
    requests. Since a database query inevitably contains strings which originate from
    user input, it is naturally vulnerable to manipulation. `SQL` `injection` is a
    web exploitation that takes advantage of the syntax of the SQL language itself.
    SQL uses Boolean logic operations like `AND` and `OR` to connect statement segments,
    including strings that were input by the user. A typical SQL statement for a user
    login might look similar to the following:


    ```

    SELECT * FROM database WHERE user = '' '''' + username + '''' '';

    ```


    The above statement will insert the user-inputted string corresponding to the
    user field into the `username` variable in the statement. This statement is expecting
    the user to input a simple, typical user name string. Like most vulnerabilities
    that hackers seek to exploit, unintended usage of the user input field can result
    is unanticipated behavior. Clever hackers learned to exploit SQL syntax to gain
    access to user accounts by entering special strings into user fields that cause
    certain desired SQL commands to be executed. For example, the following string
    might appear to be gibberish or otherwise uninteresting when entered as a username:


    ```

    '' OR ''1''=''1

    ```


    However, if the SQL interpreter takes the resulting command literally, it will
    read:


    ```

    SELECT * FROM database WHERE user = '' '' OR 1=1;

    ```


    When this command is executed, it will be read as (to paraphrase in plain English):


    “select all records from database where the user is ‘ ’ `OR` 1=1”


    There will likely not be any usernames that are a blank string, but the presence
    of the `OR` keyword means that the command will execute if either clause on each
    side of the `OR` (`user = '' '' OR 1=1`) is true. Since `1=1` is always true,
    the command must execute. Any statement that is always true can be placed after
    the `OR`, but `1=1` is an efficient option. The insertion of a command segment
    through the user string is why this procedure is called “injection”. This is a
    simple example, and most sites now have safeguards against such a basic attack,
    but injection (other scripts besides SQL can be vulnerable to injection) attacks
    continue to be a common threat and serve as an illustrative example of exploiting
    a software vulnerability. There are multiple websites that allow hackers to practice
    injection attacks against mock sites with known SQL vulnerabilities.


    ## URL MANIPULATION


    The web address, or Universal Resource Locator (`URL`), of a website not only
    contains information about the network location of a site’s resource files, but
    often contains other information that is passed on to the web application after
    some sort of user interaction. This information might be encoded, or might follow
    some sort of semantic scheme. As a simple example, consider a fictional search
    engine with the following home URL:


    `http://www.acmesearch.com/`


    When a user enters a search term into the form and clicks the submit button, the
    site may automatically append the url with the search terms according to some
    format. This is a way to pass information along to web scripts and database queries
    in order to fulfill the request of the user. So if the user of this hypothetical
    search engine is searching for “beginner hacking”, the site may submit the following
    URL (or something similar):


    ```

    http://www.acmesearch.com/search?=beginner+hacking

    ```


    If a user notices the pattern, they can easily figure out that they can circumvent
    the web form for user interface and simply type their search terms into the URL
    scheme that they observed. This sort of `URL manipulation` is, of course, fairly
    innocuous when used on services like search engines. However, in the early days
    of web commerce, these sorts of simple URL semantics were actually used to submit
    product orders. It wasn’t long before hackers figured out how to manipulate the
    payment amount as well as the type and number of products that they were ordering.
    Although most online merchants now have a more secure process, there are still
    many types of websites and services that have vulnerabilities which can be exploited
    through URL manipulation.


    ## CROSS-SITE SCRIPTING AND REQUEST FORGERY


    Some websites may allow users to interact with the site in such a way that the
    user’s input becomes part of the website content. One of the best examples of
    this are websites that feature comments (on photos, articles, etc.) from users.


    Those comments are normally submitted by users through the use of a web form or
    similar interface. If an attacker is able to enter something other than a comment
    - either by URL manipulation or direct input into the form fields - it could become
    part of the website code that is accessed by other users. Hackers have learned
    how to inject malicious code into websites through these form fields by exploiting
    servers that do not safeguard against this type of attack.

