    The injected code can be written in such a way that other users don’t even know
    that their browser is running the injected code. This activity has become known
    as cross-site scripting (XSS), and can be used by hackers to implant malicious
    code onto user machines or to co-opt user identities in order to login to a target
    machine.


    When a user logs in to a secure website, that website grants access to resources
    on its server. Typically, this access is only granted to that particular user
    for that single login session. Once the user either logs out or closes the website,
    they will have to login again and begin a new session for access.


    Session information is stored on the user’s system through the use of `cookies`,
    which are small files containing useful information about the state of a particular
    session. Session cookies, or `authentication cookies`, let the server know that
    a user is currently logged in. If a hacker is able to intercept an insecure session
    cookie, they can duplicate it on their own machine and use it to gain access to
    a target system while the user is in their current session. For example, if a
    user is logged into their banking account, a session cookie placed on their computer
    by the bank lets the bank server know that it is okay to continue allowing the
    user access to the account. If a hacker is able to obtain that particular session
    cookie on their own machine, then they can fool the bank server into allowing
    them access to that account. Hackers achieve this by setting up a fake website
    that they believe many users will want to visit. Since users quite often use the
    web with multiple tabs or browser windows open simultaneously, the hacker is hoping
    that users will be logged in to some secure account while also logged in to be
    their malicious website. When users are interacting with the hacker website, they
    are unknowingly executing scripts through their own browser that send commands
    to the secure website. Since the secure site (for instance, the bank) is allowing
    access during that session it has no way of knowing that the request is not legitimate.
    This attack is known as `cross-site request forgery` (CSRF). A common way to execute
    a CSRF attack is to inject a false server request into something relatively innocent
    such as a link to an image or some other website element. This keeps the code
    hidden from the view of the user.


    In the cases illustrated above, for SQL injection, URL manipulation, cross-site
    scripting, and cross-site request forgery, the vulnerabilities which are being
    exploited can be mitigated fairly easily by checking user input for suspicious
    content before executing it. Website programmers have caught on to many of these
    attack methods, and are trying to make their sites less vulnerable while at the
    same time still providing access and services to users. This is why it is so important
    to understand the nature of hacking and the different types of attacks.


    # CHAPTER 6. MALICIOUS ACTIVITY AND CODE


    The Latin root word “mal” means, simply, “bad”. Malicious activity is thus characterized
    by the intent to do harm. In hacking, that harm might take the form of the theft
    of money, property, or reputation. It may also simply amount to sabotage for its
    own sake or to serve some other cause. Because so many vital systems are now digitized,
    interconnected, and online, hackers have the potential to do damage on small and
    large scales.


    ## DENIAL-OF-SERVICE ATTACKS


    When we see somebody on the street, whether friend or stranger, that we wish to
    speak to, we typically don’t just walk up to them and begin speaking about whatever
    topic is on our mind. The general protocol for human communication is to first
    execute some sort of greeting. One might say “hello” (or some variant) and say
    the person’s name, and perhaps give a quick handshake - then when the other party
    responds, the conversation begins. The same sort of procedure is expected when
    initiating a telephone call, in which case it serves more of a practical purpose
    because both participants in the conversation generally want to be sure that they
    know with whom they are speaking. The first few words in the conversation serve
    to acknowledge the identity of both parties. This protocol is also used in computer
    network communications.


    Rather than simply blasting out requests, commands, or data haphazardly, one node
    in a network will attempt to first acknowledge the presence and readiness of the
    node with which it is attempting to communicate.


    In normal network conversation, typically through `TCP` protocol, a three way
    `handshake` procedure is expected to occur. During this handshake, a synchronization
    (`SYN`) packet is first sent from the initiator of the conversation to the receiver.
    This packet contains the `IP` address of the sender and a flag within the packet
    indicates to the receiver that it is indeed an `SYN` packet. If the `SYN` packet
    is successfully delivered, and the recipient is ready for communication, it will
    send an acknowledgment (`ACK`) packet back to the sender containing its own `IP`
    address as well as a flag indicating that it is an `ACK` packet. Finally, the
    original sender will send an `ACK` packet to the recipient and then normal communication
    can commence. Sometimes, packets are lost in delivery between network nodes for
    one reason or another. This can occur because of high traffic, because of malfunctions
    in the network hardware, electrical or electromagnetic interference, and other
    reasons.


    Therefore if a sender does not receive an `ACK` packet from the intended recipient
    within a prescribed period of time, it will send out another synchronization request.
    Likewise, a recipient will continue to transmit an `ACK` packet indefinitely until
    it receives an acknowledgment from the original sender. A normal handshake, without
    the interruptions that result from loss packets, is summarized as follows:


    1) Sender: `SYN` → Recipient

    2) Recipient: `ACK` → Sender

    3) Sender: `ACK` → Recipient

    4) Sender ⇄ Recipient


    Any given network node only has the capacity to communicate with a finite number
    of other nodes. When a hacker is able to disrupt the handshake process by causing
    the repeated transmission of `SYN` and `ACK` packets, legitimate communication
    can be significantly slowed down or even stopped entirely.


    This type of attack is known as a denial-of-service (DoS) attack.


    ### BASIC DOS


    The essential idea behind a denial-of-service attack is to forge the flags within
    an `IP` packet header in order to trick a server into transmitting repeated `ACK`
    requests. The simplest way to do this is to disrupt the traditional handshake
    process between steps two and three above. When the recipient sends an `ACK` request
    back to the original sender it is expecting another `ACK` packet in return so
    that communication can commence. However, if the sender responds with another
    `SYN` request, the recipient is forced to respond with another `ACK` packet. If
    this back-and-forth continues, it ties up network resources and ports on the server
    machine. The situation is analogous to a “knock-knock” joke that never ends… (“knock-knock”,
    “who’s there?”, “knock-knock”, “who’s there?”, “knock-knock”, “who’s there?”,
    etc.). This type of simple DoS attack is known as `SYN flooding`. There are multiple
    methods of executing a DoS attack, most of which take advantage of vulnerabilities
    within the `TCP/IP` protocol itself.


    ### DISTRIBUTED DOS

