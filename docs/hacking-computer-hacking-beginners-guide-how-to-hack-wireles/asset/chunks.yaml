    # TYPICAL PROGRAM


    The diagram below shows a simple program which is designed to ask the computer
    user to input two separate values which it prints out. Let’s go through the lines
    of this code step-by-step understanding what each means.


    ## Line 1

    This line contains `#include <iostream>`. It is what begins this program.


    The `#include` statement calls the `Cin` and `Cout` commands out of the library
    `<iostream>`. Without this line, the program will neither take in nor display
    any input.


    ## Line 2

    `Using namespace` is a command, and `std` which stands for ‘standard’ is a library.
    When you write `Using namespace std` you are bringing everything from that library
    into your class, but it is not quite like using the `#include` command.


    Namespace in C++ is a way to put word in a scope, and any word that is outside
    of that scope cannot see the code inside the namespace. In order for the code
    that is outside of a namespace to see code that is INSIDE of a namespace, you
    must use the `Using namespace` command.


    ## Line 4

    On this line, the `main()` is a function and `int` specifies the type of values
    that the function will be dealing with (integers.) A function in C++ is a group
    of statements that together forms a task. This is the first function always in
    C++ and it must always be written.


    ## Lines 5 & 14

    The curly braces on line 5 and 14 indicate the start and end of a compound statement.


    ## Line 6

    Here, two variables are allocated, variable `a` and variable `b`. As stated earlier,
    a variable is a location assigned to the RAM used to store data. Therefore, two
    memory allocations are made to store integers. Variable `a` was assigned a value
    of `10` and variable `b` a value of `20`. This process is called initialization,
    i.e. setting an initial value so even without input by a user there is a starting
    value.


    ## Line 7

    On this line initialization was made. The variable of type `double` was initialized
    just as the variable of type integer was initialized.


    ## Line 9

    On this line the print out statement `Cout` is utilized. It prints the statement
    “Enter the values for “a and b” though without the quotation marks.


    Only statements within the quotation marks get printed. Note that the `a` and
    `b` written in the statement “Enter the values for a and b” will not display the
    value contained in the variable `a` it will only display it as the letter of an
    alphabet because it lies within the quotation marks.


    At the end of this line, we have a reserved word `endL`. The `endL` word causes
    every statement that comes after it to begin on a new line.


    ## Line 10

    This line contains the `Cin >>` statement. The `Cin` statement prompts the user
    to input a value for both `a` and `b`. Without the computer user making such input,
    the program will not progress.


    ## Line 11

    When observed, in the statement `Cout << “ Value of a: ” it can be seen that after
    the column (ushering in the expected input of the user) there is a space before
    the quotation mark which ends the statement. These spaces will make the output
    look as shown below when the program is set to run.


    Value of a: 50


    However, without this space, the output will take this form: Value of a:50


    Meanwhile, the stand alone `a` is what will display the value inputted by the
    user. The `endL` at the center of both statements takes “Value of b: ” to the
    next line on display when the program is set to run.


    ## Line 13

    The `return 0;` statement enables the `main` function to return an integer data
    type. Technically, in C or C++, main function has to return a value because it
    is declared as “int main”. If main is declared like “void main”, then there’s
    no need of `return 0`.


    Next up, we have a couple of operators, which enable us carry out some operations.
    Some of these operators include – the math operator, comparison operator,


    ### The Math Operator

    The math operator: Like the name implies, it enables us carry out mathematical
    operations. The math operators we have in the real world are the very same ones
    we have here. They are:

    - Addition

    - Subtraction

    - Multiplication

    - Division &

    - Modulus


    The modulus is the number that remains when you divide two numbers. Example, when
    you divide 5 by 2, the result will be 2 with a remainder of 1. The remainder `1`
    is the modulus.


    ### Comparison Operators

    We also have Comparison operators and they are:


    - **The equal–equal operator `==`**: It is worthy of note that the double equal
    sign operator (`==`) doesn’t function like the single equal sign operator (`=`).
    While the single equal sign operator is used for assigning values to a variable,
    the double sign operator compares the values between two variables especially
    when used with a conditional statement (conditional statements will be treated
    later). For instance, writing `a = b` will assign whatever values in `b` to `a`.
    Writing something like `if a == b …` (where “if” is a conditional statement) will
    confirm if the value contained in `b` is same as that in `a`. And if it is, a
    particular operation specified by the code writer will be executed.


    - **Not-equal-to operator `!=`**: This operator as the name implies that the two
    or more variables in comparison are not equal. For instance, `a != b` implies
    that the values in the variables `a` and `b` are different.


    - **The and-and operator `&&`**: This represents the word and. So, if you have
    for example: `a != c && b == a`. It can be read as a condition which reads as
    “a is not equal to c AND b equals a.”


    - **The OR operator `|`**: Just like the regular OR word we use everyday, the
    one here in C++ means the same. `a != c | b == a`. The statement above simply
    reads: “a is not equal to c OR b equals a”


    ## Logic Flow

    Now, let us walk through actual lines of code where the comparison statements
    are used together with some conditional statement. Do you see the logic of the
    code above already?


    Basically, Line 9 is stating that if the value contained in the variable `a` is
    same as that contained in `b` and the value in `c` is not equal to that in `b`
    then the statement “I will not sleep” written on Line 11 will be displayed. However,
    if any of these conditions happen to be false (for instance `a` does not equal
    `b` or `c` equals `d`) then the statement on line 15 which reads “I will fight
    against sleep” will be printed.


    ![](index-81_1.jpg)


    The `else` written on Line 15 is a conditional statement, which just like it does
    in the real world means that if the condition on Line 9 evaluates to **false**
    then the statement on Line 11 be skipped and another condition down the line be
    considered.


    If the `OR` statement was used in place of the `else` statement, it will imply
    that only one of the conditions on Line 9 will have to be true (either the value
    in `a == b` or `c != d`) for the statement on Line 11 to be considered and that
    on Line 15 to be ignored.


    Going through series and series of codes for different programs will enhance understanding
    and on the long run get you used to the operators, their various functions and
    how they can be used. When this is achieved, walking through the process of making
    a Keylogger will cause you no sweat.


    ## Analysis

    By adding some new statements to our previously analyzed program and explaining
    them step by step our understanding of coding in C++ will improve greatly. Let
    us analyze the following programs below:


    The code from Line 1 to 7 is familiar codes and hence, they have been omitted.


    In Line 9 and 11, the `Cout` function is used and the statement “Enter value for
    a: ” and “Enter value for b: ” will be printed out (note the space at the end
    of both sentences, between colon and the quotation mark that ends the statements).


