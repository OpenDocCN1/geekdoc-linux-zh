    你可以从 ASCII 表中任选一个数字（代表任何大写字母），将该数字加上 `32`，看看它是否会引导你找到相同字母的小写。


    ![](img/index-113_1.jpg)

    ![](img/index-113_2.jpg)


    虽然第 34 行的语句关闭了 `file`：但第 35 行的语句仅用于测试运行，因此我们不需要检查其他任何内容。我们之后可能会将其删除，但目前先看看它在程序中是如何运行的。


    综合分析来看，第 31 行到 42 行的意思是：`if` 如果程序中的值范围落在 ASCII 码中字母表的范围内，且没有按下 `shift` 键（为了大写），则对前面的值加数字
    `32` 以将其转换为小写，并将此小写字母写入 `file`；但是，如果 `shift` 键未被按下，则输入应以大写形式发送到 `file`。


    下图显示了程序在测试运行会话期间的输出：这里使用了命令提示符（只要有输入，可以在任何地方测试键盘记录器）来测试程序，正如你所看到的，它确实有效了。


    同样注意，我们刚刚分析的程序是区分大写和小写字母的。在上面的测试中，我们写的每个单词之间没有留空格，这是因为我们使用了多行注释来屏蔽代码中包含处理间距和类似功能所需的
    `cases` 部分，因此如果我们使用空格，输入的形式将会变得杂乱。我们在这里的基本意图是处理`大写和小小写字母`。


    此外，这只是实现大写和小写字母区分的方法之一，还有多种方法可以实现。其中某些方法可能比这种更好，尽管尽管尝试，因为这将进一步丰富你的知识。


    ### 过滤字符


    在这里，我们将看到如何过滤掉所有类型的字符。这很重要，因为在大多数情况下，人们倾向于输入某些字符作为密码，例如：星号、感叹号、英镑符号（）等，而这些符号在大多数情况下是通过两个或多个键的组合获得的。过滤将使我们的键盘记录器能够识别用户何时按下此类按键。


    然而，我们需要处理这些问题，大问题是“怎么做”？想一想，你在键盘上按下什么键来获取感叹号？虽然取决于你使用的键盘，但对于感叹号来说，它是通用的；`Shift
    1` 就能给你它。我们需要写一个语句来识别 `shift` 键的状态，如果 `shift` 键被按下，且随其后的值是键盘上数字 `1` 的 ASCII 值，请不要记录
    `1`，而是记录“感叹号”。


    让我们来解决这个问题吧。仅利用 `if` 语句并不是处理此问题的最佳方法，但将其与 `switch` 语句结合使用是非常棒的，因为这有助于提高效率。


    引入我们之前编写的其余代码，加上图中第 43 行到第 50 行显示的最新代码，我们的键盘记录器就具备了检测诸如感叹号以及用户在密码中使用的其他符号的功能。


    ![](img/index-115_1.jpg)

    ![](img/index-115_2.jpg)


    在之前描述了第 35 行到 45 行代码的功能后，并且我们已经熟悉这些代码及其运行方式（C++ 基础），我们可能已经对上述程序部分将如何运行做出了很好的猜测。这很好，因为这很大程度上说明我们比开始时进步了，这太棒了！


    嗯，从 ASCII 码来看，第 (47) 行的值 `49` 代表数字 `1`。


    第 49 行说：`if` 如果 `shift` 键（十六进制形式为 `0x10`）被中断并告诉我们。此外，由于程序列表中加入了 `case 49`，如果用户在按下
    `shift` 键后立即在键盘上输入数字 `1`，它将根据第 50 行的指示将感叹符号 (`!`) 发送到 `RECORD.txt`。


    如上所示，正在利用引号以及通过命令提示符窗口输入的短备注“Heythere”来运行和测试键盘记录器，看看它是否会识别感叹符号并将其发送到我们定义的项目文件（`!`），或者仅仅给我们提供一些


    ![](img/index-116_1.jpg)


    太棒了！如上图所示，我们的键盘记录器现在按照其真实身份写入感叹号，而不仅仅是一个奇怪的图形*高亮显示的语句是之前测试过的代码，它不是最近测试结果的一部分。*


    从现在开始，我们只需要继续在 `switch` 语句的基础上进行构建，添加越来越多的 `cases` 来表示我们希望键盘记录器能够解释的所有字符。这将允许我们根据我们通常喜欢的键盘来定制键盘记录器，因此即使一个人的按键配置不同，对你的影响也并不大。


    到为止，我们已经分块编写了代码，从 case 检查块、字符合并块到文件记录块等，并将这些具有不同功能的块组合在一起，以实现良好键盘记录器的单一目标。现在让我们继续进行
    case 合（过滤）以及更好的通用代码安排。


    ![](img/index-117_1.jpg)

    ![](img/index-117_2.jpg)


    ### 包含其他字符


    我们在每个检查的末尾加入了更多的 `break` 语句，因此如果条件语句求值为 `true`，程序应该跳出循环并处理下一个任务。同样，在带有 `switch`
    语句及其 cases 的 `else` 部分；对于图中看到的从括号、反斜杠、正斜杠、感叹号等所有字符，它们是以一种方式编写的，程序可以判断出只是按了一个值而没有按下
    shift 键，因此它应该打印该值而不是符号。


    例如，在第 48 行，我们写了 `case 48`。ASCII 表上的 `48` 代表数字 `0`。


    所以，当用户按下带有数字 `0` 的键同时按下右括号时，取决于 `shift i` 是否被按下（根据第 50 行的语句），将记录右括号 ")" 或数字 `0`。


    ![](img/index-118_1.jpg)

    ![](img/index-118_2.jpg)

    ![](img/index-118_3.jpg)


    (检查第 48 行和 52 行的代码)。通过第 50 行的 `GetAsyncKey(0x10)` 函数，程序验证 `shift` 键是否被按下，如果是且同时按了
    0，则考虑右括号；否则，写入 0。


    通过第 55 行的 `break` 语句，如果位于第 48 行和 54 行之间的条件求值为 `true`，程序不会立即去检查其他 cases，而是立即退出循环。


    基本上，对于程序中从第 48 行开始关于判断用户输入的是数字还是与键盘上各个数字共享同一键的符号的其余 cases，我们遵循与第 48 行和 53 行中的
    `0` 或 `右括号` 情况相同的逻辑。


    下图显示了这些 cases 组合在一起的样子：


    ![](img/index-119_1.jpg)

    ![](img/index-119_2.jpg)

    ![](img/index-119_3.jpg)


    现在我们已经合并了涵盖键盘数字和符号的 cases，让我们继续测试它们是否能够正常工作。


    ![](img/index-120_1.jpg)

    ![](img/index-120_2.jpg)


