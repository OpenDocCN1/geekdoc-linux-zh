    # Introduction


    It is not necessary for a hacker to be an engineer, computer scientist, or to
    have intimate knowledge of microprocessor or computer hardware design, but they
    should understand how a computer works, the chief components and how they interact,
    how computers are networked both locally and through the internet, how users typically
    interact with their machines, and - most importantly - how software dictates computer
    function. An excellent hacker is fluent and practiced in several computer languages
    and understands the major operating systems. In is also very useful for a hacker
    to be familiar with the history, mathematics, and practice of cryptography.


    It is possible, and increasingly common, for a layperson with little hacking experience
    and only slight or intermediate knowledge about programming to conduct an attack
    against a system. People often do this using scripts and following procedures
    that were developed by more experienced operators.


    This happens most commonly with simpler types of attacks, like denial of service.
    These inexperienced hackers are known in the hacking community as `script kiddies`.
    The problem with this type of activity is that the perpetrators have little appreciation
    for what’s going on in the code they are running, and may not be able to anticipate
    side effects or other unintended consequences. It is best to fully understand
    what you are doing before attempting an attack.


    ## Computers and Processors


    Computers vary in size, shape, and purpose, but most of them essentially have
    the same design. A good hacker should study how computers evolved from the earliest
    machines in the 20th century to the vastly more sophisticated machines that we
    use today. In the process, it becomes evident that computers have the same basic
    components. To be an effective hacker, you should know the different types of
    processors that exist on the majority of modern computers.


    For instance, the three largest microprocessor manufacturers are `Intel`, `American
    Micro Devices (AMD)`, and `Motorola`. These processors comprise most of the personal
    computers that a hacker will encounter, but each has their own unique instruction
    set. Although most hackers rarely have to deal with programming languages on the
    machine level, more sophisticated attacks may require an understanding of the
    differences between processor instruction sets.


    Some processors are programmable by the end user. These are known as Field-Programmable
    Gate Arrays (`FPGA`) and are being used more and more often for embedded systems,
    particularly industrial controls. Hackers have been known to gain access to these
    chips while they are in production in order to deploy malicious software at the
    final destination. An understanding of `FPGA` architecture and programming is
    necessary for these types of sophisticated attacks. These embedded attacks are
    particularly concerning to military and industrial customers that purchase chips
    on a large scale for critical systems.


    ## Networking and Protocols


    One of the most important subjects for the aspiring hacker to study is that of
    network architecture and protocols. Computers can be networked in many different
    configurations and sizes, and with different technologies that govern their interconnection.
    From copper wire, to fiber optics, to wireless and satellite connections, as well
    as combinations of all of these media, we have built a vast network of computers
    across the globe. This network can be understood in its entirety on a large scale
    as well as viewed as a connection of smaller self-contained networks.


    In terms of size, computer networks have been traditionally categorized as Local
    Area Networks (`LAN`) and Wide Area Networks (`WAN`). `WANs` connect multiple
    `LANs`. There are multiple other designations for different sizes of networks,
    and the terminology is always changing as new technologies and conductivities
    develop. Keeping up with these changes is one of the ongoing tasks of a hacker.


    Networks also have different architectures. The architecture is determined not
    only by the configuration of the different nodes but also on the medium that connects
    them. Originally, networked computers were always connected by copper wire. Commonly
    used copper network cables, often known as `ethernet` cables, consist of twisted
    pairs of copper wire. Although the most common of these cables is the category
    five, or `CAT-5`, cable, it is beginning to give way to a new standard, `CAT-6`,
    which has a greater capacity for transmission of signals. For very high speed
    applications and longer distances, fiber-optic cables are usually chosen. Fiber
    optics use light instead of electricity and have a very high capacity for carrying
    information. They are used to carry most modern cable television and high speed
    internet services. Fiber optics serve as the backbone for the internet. Within
    smaller areas, wireless networks are very common. Using a Wireless Fidelity (`Wi-Fi`)
    protocol, wireless networks exist in a large number of personal, private, and
    commercial `LANs`. Hackers are often particularly interested in hacking into `Wi-Fi`
    networks, resulting in the evolution of `Wi-Fi` security standards.


    Regardless of the architecture or medium of transmission, when two terminals are
    communicating across a network they must do so using a common set of rules known
    as a `protocol`. Networking protocols have evolved since the first computer networks
    were created, but they have retained the same basic layered approach. In general,
    a network is conceptualized in terms of different layers that perform different
    functions. This is also known as a `stack`. The most common communication protocols
    used today are the Internet Protocol (`IP`) and Transmission Control Protocol
    (`TCP`). Taken together, these are commonly known as `TCP/IP`. These protocols
    change and are standardized on occasion. It is critical for the hacker to learn
    these protocols and how they relate to communication between the different layers
    of the `stack`. This is how hackers can gain higher and higher levels of access
    to a system.


    ## Programming Languages


    It may seem daunting to learn a programming language from scratch having never
    done it before, but many people find that once they become proficient at one programming
    language, it is much easier and faster to learn others.


    Hackers not only have to understand programming languages to be able to exploit
    software vulnerabilities, but many hackers need to write their own code to be
    able to execute a particular attack. Reading, understanding, and writing code
    is fundamental to hacking.


    Programming languages range from very obscure machine code, which is in binary
    and hexadecimal format and is used to communicate directly with a processor, to
    high-level object-oriented languages that are used for software development. Common
    high-level object-oriented languages are `C++` and `Java`. The code written in
    high-level languages is compiled into the appropriate machine code for a particular
    processor, which makes high-level languages very portable between different types
    of machines. Another category is a scripted language, where commands are executed
    line-by-line instead of being compiled into machine code.


    Learning programming languages takes time and practice - there is no other way
    to become proficient. Long evenings and overnight marathons of writing, debugging,
    and recompiling code are a common rite-of-passage among beginning hackers.


    # CHAPTER 4. THE HACKER’S TOOLKIT

