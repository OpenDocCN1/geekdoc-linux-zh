    面向对象的语言具有高度的结构化和模块化。面向对象的语言代码中的单条语句在没有程序其他部分上下文的情况下无法独立运行。这就是为什么面向对象的语言必须使用编译器将程序翻译成机器码，计算机才能理解。虽然这对于更大、更复杂的程序很有用，但对于较短的编程任务来说可能大材小用且浪费浪费时间。相反，解释型语言（大部分情况下）是由计算机逐行执行的，允许快速修正和更直观的调试。


    最流行的解释型语言之一是 `Python`。作为一个免费的开源项目，`Python` 因其简单性、灵活性可移植性而享誉全球。黑客经常使用 `Python`
    来帮助他们自动化某些在命令行上执行的任务。`Python` 与大多数开源软件一样，根据预期用途提供多个发行版本。这些不同的发行包含各种预写的模块（或包），这些模块可以在
    `Python` 脚本中组合在一起。


    对黑客来说其他重要的解释型语言包括 Web 脚本语言，如 `HTML`、`JavaScript`、`Perl`、`PHP` 和 `Ruby`。这些语言用于开发
    Web 应用程序。正是 Web 应用程序中的漏洞，让黑客能够访问目标网站。


    ## 数据库查询语言


    黑客的一个共同目标是访问私有或机密数据。


    服务器在被称为 `databases` 的组织化结构中存储大量数据。数据库有自己的语言，在其他编程语言的代码中访问数据时会使用。例如，如果一个 Web 应用程序需要访问或更改某个用户的个人信息，它需要向数据库发送用该数据库相应语言编写的命令。这些命令被称为
    `queries`。用于在线程序的常用的数据库语言之一是结构化查询语言，即 `SQL`。多年来，利用 `SQL` 漏洞一直是黑客访问网站及其包含的数据的最常用方法之一。随着程序员们意识到
    `SQL` 中的漏洞，他们付出了巨大努力来纠正这些漏洞，因此一些较简单的攻击已不再常见。理解 `SQL` 和其他数据库查询语言是黑客的另一个必备工具。可以在黑客的测试机上建立一个
    `SQL` 服务器，以练习各种攻击方法。


    ## 第 5 章 获取访问


    在大多数情况下，黑客的目标是获得对未经授权系统的访问权限。实现此点的最佳方法是利用身份验证系统中的漏洞。这些漏洞在大多数情况下存在于授权用户的习惯中，或者运行在目标服务器上的软件编码中。黑客非常擅长快速发现并学习如何利用漏洞，而新漏洞出现的频率似乎与旧漏洞被修复的速度一样快。任何服务器软件，特别是大型复杂的软件，可能甚至存在多个尚未被发现的漏洞。优秀的安全专业人员学习如何像黑客一样思考，以便在黑帽黑客利用之前预测他们所保护的系统可能出现的问题。本章说明了人类用户和软件中一些常见的传统漏洞的几种利用方式。


    ## 社会工程


    人类用户通常是计算机安全“杀伤链”中最薄弱的环节。许多用户不仅对他们正在使用的系统了解甚少，而且往往对网络威胁的本质缺乏认知，并且不愿意花费时间和精力保护自己。尽管人们开始变得更有意识，但周围仍有足够容易的人类目标供黑客利用。`Social
    engineering` 是利用简单的侦察或欺骗直接从毫无防备的用户那里获取密码或访问权限的活动。社会工程不需要多少技术知识，黑客更倾向于涉及侵入性方法的更困难、风险更高的攻击。


    ### 被动密码获取


    可能最简单的社交工程类型是猜测个人的登录密码。尽管有警告，用户继续使用包含常见或易猜的字符序列的密码。这种做法如此普遍的主要原因是，人们倾向于想要他们容易记起的密码。大多数人在家庭和工作中都有几个电子邮件和用户账户，这很难跟踪所有的账户，因此可能对多个账户使用相同或相似的密码。


    当黑客成功获取密码时，这种做法使他们所有的账户陷入危险。常见的密码错误包括使用自己的姓名或家庭成员或宠物的名字、使用字典中常见的单词、使用与其生日或亲人生日相应的数字序列、包括居住地址的部分、使用喜爱的运动队名称以及其他容易记忆的类似主题。在现代社会，这种做法尤为糟糕的极大原因之一是，互联网上有大量可以轻松且公开获取的个人信息。只需一眼个人的社交媒体页面，通常就能揭示大量关于他们的信息。当某人允许其社交媒体资料被公开查看时，它就成了黑客完善密码猜测的完美来源。用于猜测密码的个人数据也可以通过
    `dumpster diving`（翻垃圾桶）的行为获得，即黑客搜寻目标用户的垃圾，寻找包含敏感信息的纸质。密码安全已成为一个严重的问题，越来越多的网站、在线账户、电子邮件服务和其他需要密码的系统开始对密码格式和内容实施严格限制。


    更具互动性的社会工程涉及黑客对目标进行某种程度的监控或侦察。如果黑客可以物理访问目标系统的所在地，他们可能会尝试在用户实际输入登录信息时观察用户。这在口中被称为
    `shoulder surfing`（窥视），因为这只需秘密地从用户的肩膀后面窥视。


    ## 钓鱼、鱼叉式钓鱼和鲸鱼式钓鱼


    互联网的普遍匿名性往往会让人们产生虚假的安全感，使他们参与一些在面对面时绝不会参与的行为。如果一个陌生人敲某人的门，自称是其银行代表并索要保险箱的钥匙，这个人可能会被迅速把门关在脸上。


    尽管如此，每天都有成千上万的人通过网络、电子邮件、电话和短信向诈骗黑客泄露他们的个人和登录信息。黑客获取用户信息的一种常用方法是过程


