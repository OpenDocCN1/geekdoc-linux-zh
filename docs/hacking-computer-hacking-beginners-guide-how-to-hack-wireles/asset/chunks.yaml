    The Keylogger we will be making will be one that can only infect a windows PC.
    We choose to make such a Keylogger because majority of the desktop users utilize
    a windows platform. However, besides that, making a Keylogger that can infect
    a windows system is far easier compared to making one that will function on a
    Mac PC. For this reason, we begin with the easy works and later we can advance
    to the more complex ones in my next books.


    ### 3. IDE – INTEGRATED DEVELOPMENT ENVIRONMENT


    An IDE is a software suite that consolidates the basic tools that developers need
    to write and test software.


    Typically, an IDE contains a code editor, a debugger and a compiler that the developer
    accesses through a single graphical interface (GUI). We will utilize an IDE called
    “eclipse” for this project.


    ### 4. COMPILER


    A compiler is a special program that processes statements written in a particular
    computer language and converts them to machine language or “code” that a computer
    processor can understand.


    Before we start writing our Keylogger, we will need to set up our environment
    and also learn some basic things about C++. C++ because most of the codes for
    windows are written in it and our Keylogger is targeted for windows.


    You definitely want your Keylogger to have the capability of running universally
    across all systems that utilize the windows operating system.


    Just so you know before hand, C++ is not the next easiest programming language
    to learn because of the nature of its syntax. Notwithstanding, don’t give up already,
    we will begin with the simple things and move on gradually to the more advanced
    ones, taking a comprehensive step-by-step approach.


    I also advise that you use external materials on C++ to expand your knowledge
    on the areas we will touch during the cause of this project as this will enhance
    your productivity.


    Hopefully, by the end of this chapter you will be able to make your own Keylogger
    and also modify it to suit your purposes.


