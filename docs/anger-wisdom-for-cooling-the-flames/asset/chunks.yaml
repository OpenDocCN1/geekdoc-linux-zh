- fmt: "\nWhen we eat mindfully, we are not eating or chewing our anger, our anxiety,\
    \ or our projects. We are chewing the food, prepared lovingly by others. It is\
    \ very pleasant. When the food in your mouth becomes almost liquefied, you experience\
    \ its flavor more intensely and the food tastes very, very good. You may want\
    \ to try chewing like this today. Be aware of each movement of your mouth. You\
    \ will discover that the food tastes so delicious. It may only be bread. Without\
    \ any butter or jelly at all. But it’s wonderful. \n\nPerhaps you will also have\
    \ some milk. I never drink milk. I chew milk. When I put a piece of bread into\
    \ my mouth, I chew for a while in mindfulness, and then I take a spoonful of milk.\
    \ I put it in my mouth, and I continue to chew with awareness. You don’t know\
    \ how delicious it can be just chewing some milk and some bread. \n\nWhen the\
    \ food has become liquid, mixed with your saliva, it is half-digested already.\
    \ So when it arrives in your stomach and intestines, the digestion becomes extremely\
    \ easy. Much of the nutrients in the bread and milk will be absorbed into our\
    \ body. You get a lot of joy and freedom during the time you chew. When you eat\
    \ like this, you will naturally eat less. \n\nWhen you serve yourself, be aware\
    \ of your eyes. Don’t trust them. It is your eyes that push you to take too much\
    \ food. You don’t need so much. If you know how to eat mindfully and joyfully,\
    \ you become aware that you need only half the amount that your eyes tell you\
    \ to take. Please try. Just chewing something very simple like zucchini, carrots,\
    \ bread, and milk may turn out to be the best meal of your life. It’s wonderful.\
    \ \n\nMany of us in Plum Village, our practice center in France, have experienced\
    \ this kind of eating, chewing very mindfully, very slowly. Try eating like this.\
    \ It can help you to feel much better in your body and, therefore, in your spirit,\
    \ in your consciousness. Our eyes are bigger than our stomach. We have to empower\
    \ our eyes with the energy of mindfulness so that we know exactly what amount\
    \ of food we really need. \n\nThe Chinese term for the alms bowl used by a monk\
    \ or nun means “the instrument for appropriate measure.” We use this kind of bowl\
    \ to protect us from being deceived by our eyes. If the food comes to the top\
    \ of the bowl, we know that it is largely sufficient. We take only that amount\
    \ of food. If you can eat like that, you can afford to buy less. When you buy\
    \ less food, you can afford to buy organically grown food. This is something that\
    \ we can do, alone or in our families. It will be a tremendous support for farmers\
    \ who want to make a living growing organic food.\n\n# The Fifth Mindfulness Training\n\
    \nAll of us need a diet based on our willingness to love and to serve. A diet\
    \ based on our intelligence. The Five Mindfulness Trainings are the way out of\
    \ suffering, for the world and for each of us as individuals (see full text in\
    \ Appendix A). Looking deeply at the way we consume is the practice of the Fifth\
    \ Mindfulness Training. This mindfulness training concerns the practice of mindful\
    \ consumption, of following a diet that can liberate us and liberate our society.\
    \ \n\nBecause we are aware of the suffering caused by unmindful consumption, we\
    \ make the commitment: \"... to cultivate good health, both physical and mental,\
    \ for myself, my family, and my society by practicing mindful eating, drinking,\
    \ and consuming. I vow to ingest only items that preserve peace, well-being, and\
    \ joy in my body, in my consciousness, and in the collective body and consciousness\
    \ of my family and society. I am determined not to use alcohol or any other intoxicant\
    \ or to ingest food or other items that contain toxins, such as certain TV programs,\
    \ magazines, books, films, and conversations...\"\n\n# Consuming Anger\n\nIf you\
    \ want to take care of your anger, your frustration, and your despair, you might\
    \ consider living according to this mindfulness training. If you drink alcohol\
    \ mindfully, you can see that it creates suffering. The intake of alcohol causes\
    \ disease to the body and the mind, and death on the road. The making of alcohol\
    \ also involves creating suffering. The use of the grains in its production is\
    \ linked to the lack of food in the world. Mindfulness of eating and drinking\
    \ can bring us this liberating insight.\n\nDiscuss a strategy of mindful consumption\
    \ with the people you love, with members of your family, even if they are still\
    \ young. Children can understand this, so they should participate in such discussions.\
    \ Together you can make decisions about what to eat, what to drink, what television\
    \ programs to watch, what to read, and what kind of conversations to have. This\
    \ strategy is for your own protection. \n\nWe cannot speak about anger, and how\
    \ to handle our anger, without paying attention to all the things that we consume,\
    \ because anger is not separate from these things. Talk to your community about\
    \ a strategy of mindful consuming. In Plum Village, we try our best to protect\
    \ ourselves. We try not to consume things that nurture our anger, frustration,\
    \ and fear. To consume more mindfully, we need to regularly discuss what we eat,\
    \ how we eat, how to buy less, and how to have higher-quality food, both edible\
    \ and the food we consume through our senses.\n\n# Saving Your House\n\nWhen someone\
    \ says or does something that makes us angry, we suffer. We tend to say or do\
    \ something back to make the other suffer, with the hope that we will suffer less.\
    \ We think, “I want to punish you, I want to make you suffer because you have\
    \ made me suffer. And when I see you suffer a lot, I will feel better.” Many of\
    \ us are inclined to believe in such childish practice. The fact is that when\
    \ you make the other suffer, he will try to find relief by making you suffer more.\
    \ The result is an escalation of suffering on both sides. Both of you need compassion\
    \ and help. Neither of you needs punishment.\n\n# Putting Out the Fire of Anger\n\
    \nWhen you get angry, go back to yourself, and take very good care of your anger.\
    \ And when someone makes you suffer, go back and take care of your suffering,\
    \ your anger. Do not say or do anything. Whatever you say or do in a state of\
    \ anger may cause more damage in your relationship. Most of us don’t do that.\
    \ We don’t want to go back to ourselves. We want to follow the other person in\
    \ order to punish him or her. \n\nIf your house is on fire, the most urgent thing\
    \ to do is to go back and try to put out the fire, not to run after the person\
    \ you believe to be the arsonist. If you run after the person you suspect has\
    \ burned your house, your house will burn down while you are chasing him or her.\
    \ That is not wise. You must go back and put out the fire. So when you are angry,\
    \ if you continue to interact with or argue with the other person, if you try\
    \ to punish her, you are acting exactly like someone who runs after the arsonist\
    \ while everything goes up in flames.\n\n## Tools for Cooling the Flames\n\nThe\
    \ Buddha gave us very effective instruments to put out the fire in: the method\
    \ of mindful breathing, the method of mindful walking, the method of embracing\
    \ our anger.\n"
