  trans: '

    他们曾彼此相爱，相信没有了彼此对方就无法生存。但在过去的几年里，这对夫妻都遭受了许多苦难。他们不再喜欢凝视对方，不再喜欢彼此交谈，也不再给对方写信了。


    在她发现那个盒子的前一天，她的丈夫告诉她他必须去出差了。他觉得待在家里并不愉快，也许可能在旅途中寻找一点快乐或愉悦。她很清楚这一点。当丈夫告诉她他要去纽约开个会时，她说：“如果你有工作要做，就尽管去吧。”她已经习惯了这种，这非常普通。


    然后，他没有按照计划回家，而是打来电话说：“我必须多留两天，因为我还有事情要处理。”她很轻易地接受了，因为即使他在家里，她也不快乐。挂掉电话后，她开始重新整理衣柜，并发现了那个盒子。那是一盒“Lu”饼干——法国一个非常著名的品牌。她感到很奇，因为她已经很久没有打开那个盒子了。她放下掸子，打开盒子，闻到了一股非常熟悉的味道。她取出其中一封信，站在那里读了起来。这封信是多么甜蜜啊！他的语言充满了理解和爱。她感到神清气爽，像一片干涸的土地终于暴露在雨水里。她又打开了另一封信，因为那是太美了。最后，她把整盒信带到桌边，坐下来，一封一封地读，直到读完所有的四十六或十七封。


    她过去幸福的种子依然在那里。它们被埋在层层苦难之下——但它们依然在那里。所以，当读着那封他年轻时写下的、充满爱的信时，她感到自己体内的幸福种子开始被浇灌了。当你做这种事情时，你就是在浇灌深藏在意识深处的幸福种子。


    在最近的这段时间，她的丈夫完全没有用过那种语言了。但现在，读着这些信，她能听见丈夫正用那种甜蜜的方式说话。幸福曾是他们的现实。为什么他们现在生活得像地狱一样？她几乎不记得他曾那样对她说话，但那是事实。他曾能用那种语言和她交流。


    ### 浇灌幸福的种子


    在读完所有信的一个半小时里，她浇灌了自己内心的幸福种子。她意识到他们两个都是不熟道的。他们一直在彼此浇灌苦难的种子，却没能浇灌幸福的种子。


    读完所有的信后，她产生了一种强烈的欲望，想坐下来给他写一封信，告诉他在那段关系之初，她是多么幸福。她写道，她希望那些金色时光的幸福被重新发现并重新创造。现在她可以再次诚实而真挚地称他为“我的亲爱的”。她花了四十五分钟写了那封信。这是一封真正的情书——写给那个写了她保存在盒子里的信的、迷人的年轻人。


    读他的信然后写回信大约花了三个小时。这是一段练习的过程，但她并不知道自己在练习。写完信后，她感到内心非常轻松。信还没有寄出去；丈夫还没有读；但她觉得好多了，因为幸福的种子已经重新醒了，它们被浇灌了。她上楼把信放在了他的书桌上。在剩下的整天时间里，她是快乐的。她快乐，仅仅是因为那些信浇灌了她心中积极的种子。


    在读信和给丈夫写信的过程中，她获得了一些见解。他们中没有一个是熟道的。他们不知道如何保持他们应得的幸福。在他们的言语和行动中，他们为彼此创造了地狱。他们都接受作为一个家庭、一对夫妇生活，但他们不再拥有任何幸福。在理解了这一点后，她确信如果他们都尝试练习，幸福就能恢复。她充满了希望，不再像过去几年那样受苦。


    当她的丈夫回家时，他上楼，看到了书桌上的那封信。在信中，她写道：“我们的苦难我负部分责任，因为我们没有拥有我们应得的幸福。让我们重新开始，恢复沟通。让我们和平、和谐与幸福再次成为现实。”


    他花了大量时间读那封信，并深刻地思考她所写的内容。他不知道自己正在冥想。但他也在练习，因为通过读妻子的信，他体内的幸福种子也被浇灌了。他在楼上留了很久，深沉地思考，并获得了她前一天得到的同样的见解。正因为这样，他们都有机会重新开始并恢复他们的幸福。


    如今，人们，恋人们，不再给对方写信了。他们只是拿起手机说：“你今晚有空吗？我们出去好吗？”仅此如此，你什么也留不下。这很遗憾。我们必须学会重新写信。写给你爱的人，他可能是你的父亲或儿子；她可能是你的女儿、你的母亲、你的姐妹或你的朋友。花时间写下你的感激和爱。


    ### 小奇迹


    你有许多方法可以恢复沟通。如果你发现和儿子交流太困难，为什么不练习一两天的正念行走和正念呼吸呢？然后坐下来给他写一封信。你可以使用同样的语言：“亲爱的儿子，我知道你过得非常痛苦，作为你的父亲，我负部分责任，因为我不知道如何将我最好的部分传递给你。我知道你一直无法向我传达你的痛苦，我希望这种情况发生改变。我想守在你的身边。让我们互相帮助，尝试改善我们的沟通。”


    你必须学会说这种语言。慈爱的话将救赎我们。慈悲的倾听将救赎我们。这是我们作为修行者完成的奇迹。你有能力做到这一点。在意识的深处，你有足够的平和、足够的慈悲和理解。你必须向它寻求帮助，呼唤内心的佛性。在一个充满爱的朋友的支持下，你有可能重新开始并恢复沟通。


    ### 感恩的时刻，觉悟的时刻


    有时，我们会对生命中的另一个人感到非常感激。我们深切感激他的存在。我们充满了慈悲、感激和爱。我们在生命中经历过这样的时刻。我们感到非常感激，对方还活着，他仍与我们身边，并在非常艰难的时刻支持过我们。我建议，如果这种时刻再次发生，请利用它。为了从这段时间内真正获益，请退到一个你可以与自己相处的地方。

