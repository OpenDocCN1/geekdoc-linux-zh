    你可以以后再做这件事。就在那个时刻，最好回到你的房间或安静的地方，沉浸在那种感激的感觉中。然后写下你的感受、你的感激、你的快乐。用半页或一页纸的长度，尽力通过文字表达自己，或者录音。这个感激的时刻是启悟的时刻、正念的时刻、智慧的时刻。它是你意识深处的显现。你内在就有这种理解和洞察力。


    但当你愤怒时，你的感激和爱似乎完全消失了。你觉得它们仿佛从未存在过，所以你必须把它们写在一张纸上并妥善保存。时不时拿出来重读一遍。《心经》是许多佛教徒每日诵读的经典，它是佛关于智慧教义的精华。你所写下的就是一部《心经》，因为它源于你的心——不是源于菩萨或佛的心，而是源于你自己的心。它是你自己的《心经》。


    ## 每日诵读你的心经

    我们都可以从那个被她在饼干盒里保存的情书所拯救的妇女的故事中学习到东西。THICH NHAT HANH 110 2S 1S R 1L 2L


    当你阅读这些发自内心的信件时，你被它们拯救了。你的救救者并非来自外部，而是来自内部。你可以去爱；你完全有欣赏他人、感到感激的能力。这是一种祝福。你知道自己幸运地遇到了伴侣，幸运在生命中拥有你爱的人。为什么要让这个真理飞走呢？它就在你的心里。


    所以，你必须每天诵读你的《心经》。你必须注视它。每当你触碰内心的爱与欣赏时，你再次感到感激，再次珍惜他或她的存在。你必须独处，才能充分欣赏对方的存在。如果你们总是在一起，你可能开始认为他是理所当然的，忘记了享受他的美与好。偶尔抽出三天或七天休息。离开他一段时间，以便能更加欣赏他。尽管你离他很远，但他比你们时刻在一起时显得更加真实、更加充实。在你们分离期间，你会记得他对他而言是多么重要、多么珍贵。


    所以，请写下或制作属于你自己的《心经》（或多部经），并将其保放在神圣的地方。尝试经常诵读你的经。然后，当愤怒淹没你，而你又不够技巧去拥抱它时，你的《心经》将提供巨大的帮助。拿起它，练习深呼吸，然后阅读它。你立刻会回到自我，回到你的《心经》111
    2S 1S R 1L 2L，你的痛苦会少很多。当你阅读你的《心经》时，你会知道该做什么以及如何应对。挑战在于让自己这样做。你必须创造条件、准备、计划并组织，以便你真正从自己的智慧中获益。利用你的才华来安排和创造这类修行。


    ## 离开愤怒的彼岸

    你仍然站在痛苦与愤怒的岸边。为什么不离开这个岸，去往彼岸——无愤怒、和平与解脱的彼岸？那里要愉快得多。你为什么要花几个小时、一个晚上甚至几天的时间在愤怒中受苦？有一条船你可以用来快速渡到彼岸。那条船是通过正念呼吸回到自身的修行，这样我们就能深审视自己的痛苦、愤怒和忧郁，并对它们微笑。这样做，我们克服了痛苦并渡到了彼岸。


    不要留在这个岸上继续成为你愤怒的受害者。无愤怒在你体内；无愤怒是可能的。只需渡过河去彼岸，去无愤怒的彼岸。那里清凉、愉快且令人神怡。不要让自己被愤怒所暴虐。释放你自己，解脱你自己。THICH
    NHAT HANH 112 2S 1S R 1L 2L


    在老师、其他修行的朋友以及你自己的修行的帮助下渡过。依靠这些船渡过河到达彼岸。现在你可能正站在混乱、愤怒或怀疑的岸边。不要留在那儿；去彼岸。通过僧团（sangha）、你法中的兄弟姐妹、你的行走与呼吸修行、你的深审修行，以及诵读你自己的《心经》，你很快就能渡过去。也许只需要几分钟。


    你有权获得快乐。你有权慈悲，有权去爱。觉醒的种子在你体内。通过修行，你可以立刻将这颗种子变成花。你可以结束痛苦，因为佛法是立时生效的。它比阿司匹林还快。


    ## 愤怒时送上礼物

    有时你会对某人感到愤怒，并尽一切努力转化愤怒，但似乎无济于事。在这种情况下，佛建议你给对方一份礼物。这听起来很幼稚，但它非常有效。当我们对某人愤怒时，我们想要伤害他们。给他们送礼物会将这种想法变为想要让他们快乐。


    所以，当你对某人愤怒时，你的《心经》113 2S 1S R 1L 2L 送上礼物。当我们对某人愤怒时，我们想要伤害他们。给他们送礼物会将这种想法变为想要让他们快乐。所以，当你对某人愤怒时，你的《心经》113
    2S 1S R 1L 2L 送上礼物。当我们对某人愤怒时，我们想要伤害他们。给他们送礼物会将这种想法变为想要让他们快乐。所以，当你对某人愤怒时，你的《心经》113
    2S 1S R 1L 2L 送上礼物。当我们对某人愤怒时，我们想要伤害他们。给他们送礼物会将这种想法变为想要让他们快乐。


    ## 理解的缓解

    当你愤怒时，你想要缓解痛苦。这是一种本能。有许多缓解方法，但最大的解脱来自于理解。当理解存在时，愤怒会自行消失。当你理解别人的处境，当你理解痛苦的本质时，愤怒必须消失，因为它会被转化为慈悲。深审是愤怒最推荐的药物。如果你观察，你将会理解对方的困难以及他们从未能实现的深层愿望。这时慈悲会在你心中产生，慈悲
    THICH NHAT HANH 114 2S 1S R 1L 2L 愤怒的解药。如果你允许慈悲从心中涌发，愤怒之火会立刻熄灭。我们的大部分痛苦源于对“独立自我”的缺乏理解和洞察。他人就是你，你就是他人。如果你触及这个真理，愤怒就会消失。慈悲是产生于理解的美丽花朵。所以当你对某人愤怒时，练习正念呼吸。


    ## 宣泄的危险

    有些治疗师建议我们通过表达愤怒来感觉好些。他们建议我们通过说或做事情来释放愤怒，比如拿根棍子打轮胎，或者用力撞击门。他们还建议打枕头。这些治疗师认为这是消除我们体内愤怒能量的方法。他们称之为“宣泄”。当你房间里有烟时，你想通风让烟雾散出去。愤怒是一种烟，一种让你痛苦的能量。当你的《心经》的烟雾
