  trans: '

    深入洞察我们感知本质的方法，以及深入洞察他人的方法，就是意识到她也深受许多痛苦并需要帮助。这些方法非常实用，而且直接来自佛法。


    有意识地吸气，是知道空气进入你的身体；有意识地呼气，是知道你的身体正在交换空气。因此，你正与空气、与身体接触，因为你的心正关注这一切，你也与你的心接触；正如其是。只需要一次意识的呼吸，就能重新与你自己和周围的一切建立联系，而三次意识的呼吸就能维持这种联系。


    每当你不是站立、坐或躺时，你就在行走。但你要去哪里呢？你已经到达了。每一步，你都可以抵达当下，你可以步入净土或上帝之国。当你从房间的一侧走到另一侧，或从一栋建筑走到另一栋建筑时，请留意脚与大地的接触，留意空气进入身体的接触。这可能帮助你发现吸气时你可以舒服地走多少步，呼气时又能走多少步。吸气时你可以说“吸”，呼气时，你可以说“呼”。这样你整天都在练习行禅。熄灭怒火
    25 2S 1S R 1L 2L


    ## 我们愤怒时长什么样？


    每当愤怒升起时，拿镜子照照自己。当你愤怒时，你并不漂亮，也不体面。你脸上成百的肌肉变得非常紧张。你的脸看起来像一颗随时准备爆炸的炸弹。看一个愤怒的人。当你看到她的紧张时，你会感到恐惧。那颗炸弹随时可能爆炸。所以，在愤怒的时刻看到自己非常有帮助。这是一个正念的钟。当你看到自己那样时，你有动力去做事情来改变它。你知道如何做才能看起来更漂亮。你不需要任何一行和
    26 2S 1S R 1L 2L 化妆。你只需要平静、冷静地呼吸，并正心地微笑。如果你能做到一两次，你看起来会好得多。只需看着镜子，平静地吸气，微笑着呼气，你会感到宽慰。


    愤怒是一种心理学现象，但它与生物和生物化学因素密切相关。愤怒让你肌肉紧绷，但当你知道如何微笑时，你开始放松，你的愤怒就会减少。微笑让正念的能量在你体内产生，帮助你拥抱愤怒。在古代，国王王后的侍从总是随身带着镜子，因为每当有人见皇帝时，他们的外表必须是完美的。所以为了正式礼仪，人们会随身带着一个装小镜子的袋子。试一下。随身带一面镜子照照，看看自己处于什么状态。在你几次吸呼气并对着自己微笑后，紧张就会消失，你会获得一些宽慰。


    ## 用正念的阳光拥抱愤怒


    愤怒像一个嚎叫的婴儿，受着痛苦并哭泣。婴儿需要母亲拥抱他。你就是拥抱 27 2S 1S R 1L 2L 你的婴儿——你的愤怒的母亲。当你开始练习正念地吸呼气时，你就拥有了母亲的能量，去摇篮和拥抱那个婴儿。只需拥抱你的愤怒，只需吸气和呼气，这就足够了。婴儿会立刻感到宽慰。


    所有的植物都受到阳光的滋。它们对阳光都很敏感。任何被阳光拥抱的植物都会经历转化。清晨，花朵尚未盛开。但当太阳升起，阳光拥抱花朵并试图渗透它们。阳光是由微小的粒子——光子组成的。光子一个一个地逐渐渗透花朵，直到里面有很多。在那个时刻，花朵无法再抵抗，必须向阳光绽放自己。


    同样，我们内在所有的心理构造和生理构造都对正念很敏感。如果正念在那里，拥抱你的身体，你的身体就会发生转化。如果正念在那里，拥抱你的愤怒或绝望，它们也将被转化。根据佛法并根据我们的经验，任何被正念能量拥抱的东西都会经历转化。你的愤怒像一朵花。起初你可能不理解愤怒的本质，或者不知道它为什么升起。但如果你知道如何用正念的能量拥抱它，它就会开始绽放。你可能正坐着，遵循
    28 2S 1S R 1L 2L


    ## 处理愤怒


    你的呼吸，或者你可能正在练习行禅来产生正念能量并拥抱你的愤怒。十分或二十分后，你突然会看到你愤怒的本质。它可能仅仅是因为错误的认知或缺乏技巧而产生。这就像你煮土豆；你把土豆放入锅中，盖上盖，放在火上。但即使火很大，如果你在五分钟后关掉火，土豆是煮不熟的。你需要维持火一段时间，让花朵绽放。愤怒就像那样——起初它是生的。你不能吃生土豆。你的愤怒很难让人忍受，但如果你知道如何照顾它、烹饪它，那么你愤怒的负能量就会变成理解与慈悲的正能量。你可以做到的。这不是只有大者
    29 2S 1S R 1L 2L 才能做到的事。你也可以做到。你可以将愤怒的垃圾转化为慈悲的花朵。我们许多人只需要十五分钟就能做到。


    ## 化垃圾为花朵


    有机园丁不会考虑扔掉垃圾。她知道她需要垃圾。她有能力将垃圾转化为肥料，这样肥料就能再次变成生菜、黄瓜、萝卜和花朵。作为一名修行者，你是一个园丁，一个有机园丁。愤怒和爱都具有有机的特质，这意味着它们都可以改变。爱可以被转化为
    30 2S 1S R 1L 2L


