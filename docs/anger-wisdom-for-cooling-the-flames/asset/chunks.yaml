    # 洞察止住愤怒


    看起来你像是两个独立的个体，但如果你更深层地观察，你会发现你仍然是一个整体。因此，平息争端、恢复你们之间的和平，就像是在恢复你内心、你身体里的和平。你和你的孩子本性相同，你们属于同一个现实。


    多年前当我在伦敦时，我走进书店，看到一本名为《我的母亲，我自己》（*My Mother, Myself*）的书。这是一个智慧的标题。你的母亲，你自己。你可以写另一本书，《我的女儿，我自己》，或者《我的儿子》、《我的父亲》。这是真实的现实。当你对儿子生气时，你是在对自己生气。当你惩罚儿子时，你是在惩罚自己。当你给父亲施加痛苦时，你对自己施加痛苦。


    当我们对“非我”产生洞察时，我们就能理解这一点：自我是由“非我”的元素构成的，比如我们的父亲、母亲、所有的祖先，以及太阳、空气和地球。当你能触及这种洞察，触及非我的现实时，你就知道快乐和痛苦并不是个体的问题。你的痛苦就是你所爱人的痛苦。他们的快乐就是你的快乐。当你明白这一点时，你就不会被惩罚或责备的想法所诱惑。你的行为将变得更有智慧。这种智能，这种智慧……


    # 愤怒：冷却火焰的智慧


    智慧是你沉思的、深度观察的果实。所以，当你阅读《心经》（*Heart Sutra*）时，它帮助你记住这种洞察：你的孩子、你的伴侣就是你。我们读经是为了沉浸在真理中，沉浸在非我的洞察中。你被鼓励写的《心经》，源于你自己的洞察——即你与他人是一一的。《心经》是关于智慧的。你的《心经》也是。它提醒你，你们不是独立的、孤立的自我。它提醒你之爱的智慧。


    当你愤怒时，当你被“独立自我”的想法误导时，阅读《心经》将帮助你重新回到自己。当洞察存在时，佛就在，你是安全的。你不再需要受苦。我们必须不断提醒自己，有很多方法可以缓解愤怒，但最好、最深的缓解来自于理解，来自于对“非我”的洞察。


    “非我”并不是一种抽象的哲学。“非我”是你可以通过正念生活触及的现实。非我的洞察将恢复你与他人之间的和平与和谐。你值得和平，你值得快乐。这就是为什么你必须与他、与她坐下来，设计一种共同生活的策略。此外，你你自己也必须找到一种带给你和谐与和平的生活方式——一份与自己的和平协议，因为很多时候你会被内心的战争和冲突所撕裂。


    你处于战争状态是因为你缺乏智慧，缺乏洞察。通过理解，你可以恢复自己内心以及与他人关系中的和平与和谐。你将知道如何智能地行动和反应，使你不再处于战争区或冲突区。如果你内心有和平与和谐，对方也会感知到，你们之间的和平与和谐将很快恢复。你会变得更加愉快，更加容易相处，这对于对方有巨大的帮助。


    所以，为了帮助你的儿子，请先与自己和解。深层地观察你自己。如果你想帮助你的母亲，请恢复你内心的和平。发现让你能够帮助母亲的洞察。帮助自己是帮助他人的第一个条件。放下名为“自我”的幻象。这是修行的精髓，将让你和他人从愤怒和痛苦中解出来。


    # 从自己开始


    没有沟通，就不可能有真正的理解。但请确保你首先能与自己沟通。如果你不能与自己沟通，你又指望与他人沟通呢？爱也是如此。如果你不爱自己，你就无法爱别人。如果你不能接受自己，如果你不能善待自己，你就无法为另人做这些。


    很多时候，你的行为完全和你父亲一模一样，但你并没有意识到。尽管你表现得像他，你却觉得你们完全相反。你不接受他，你恨他。当你不接受你的父亲时，你就不接受你自己。你的父亲在你身上，你是你父亲的延续。所以如果你能与自己沟通，你就能与你父亲沟通。


    自我是由非我元素构成的；因此，了解我们就是我们的修行。我们的父亲是一个“非我”元素。我们说父亲不是我们，但没有父亲，我们无法存在。所以他完全存在于我们的身体和大脑中。他是我们。因此，如果你理解了你自己，理解了整个自我，你就明白你就是你的父亲——他不在你之外。在你体内还有许多其他“非我”元素是可以触及并识别的——你的祖先、地球、太阳、水、空气、你吃的所有食物等等。


    这些事物似乎与你是分离的，但没有它们，你就无法生存。假设交战双方想要谈判，但双方对自己的了解都不够。你必须真正了解你自己、你的派系、你的处境，才能理解对方、对方的国家、对方的人民。自我与他人不是分离的事物，因为双方的痛苦、希望和愤怒是非常相似的。当我们愤怒时，我们受苦。如果你真的理解了这一点，你也能理解，当对方愤怒时，意味着他（她）正在受苦。


    当有人侮辱你或对你粗暴时，你必须足够聪明，看到那个人正受于自身的暴力和愤怒之苦。但我们往往忘记了。我们认为只有自己在受苦，而对方是压迫者。这足以让愤怒产生，并加强我们惩罚的欲望。我们因为受苦，所以想要惩罚对方。那么，我们内心也有愤怒，也有暴力，正如他们一样。当我们看到自己的痛苦和愤怒与他们的痛苦和愤怒无异时，我们会表现出慈悲。


