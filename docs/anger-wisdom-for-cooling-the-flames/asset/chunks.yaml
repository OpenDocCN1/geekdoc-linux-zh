    us the capacity to love, to understand, to be compassionate. Ifyou know this,
    then when it rains you won’t be desperate. You know that the rain is there, but
    the sunshine is still there somewhere. Soon the rain will stop, and the sun will
    shine again. Have hope. Ifyou can remind yourself that the positive elements are
    still present within you and the other person, you will know that it is possible
    to break through, so that the best things in both of you can come up and manifest
    again. The practice is there for that. The practice will help you touch the sunshine,
    touch the Buddha, the goodness within you so that you can transform the situation.
    You can call this goodness anything you want to, whatever is familiar to you from
    your own spiritual tradition. Deep down you must know that you are capable ofbeing
    THICH NHAT HANH 90 2S 1S R 1L 2L


    peace. Develop the conviction that the energy ofthe Buddha is in you. The only
    thing you need to do is to call on it for help. You can do this by practicing
    mindful breathing, mind- ful walking, and mindful sitting. Training Ourselves
    to Listen Deeply Communicating is a practice. You have to be skillful in order
    to communicate. Good will is not enough. You have to learn how to do it. Maybe
    you have lost your capacity to listen. Maybe the other person has spoken so often
    with bitterness, always condemning and blaming, that you have had enough. You
    cannot listen anymore. You begin to try to avoid him or her.You don’t have the
    capacity to listen to that person anymore. You try to avoid him out offear. You
    don’t want to suf- fer. But this can also create a misunderstanding, and make
    him feel that you despise him. This can cause him a lot ofsuffer- ing. You give
    him the impression that you want to boycott him, to ignore his presence. You cannot
    face him and at the same time you cannot avoid him. The only solution is to train
    yourselfto be able to communicate again. Deep listening is the way. We know that
    many people suffer, feeling that no one is COMPASSIONATE COMMUNICATION 91 2S 1S
    R 1L 2L


    able to understand them or their situation. Everyone is too busy and no one seems
    to have the capacity to listen. But all ofus need someone who can listen to us.
    Today there are people who practice psychotherapy and they are supposed to be
    there for you, to sit and listen to you so that you can open your heart. They
    have to listen deeply in order to be real therapists. Real therapists have the
    capac- ity to listen with all their being, without prejudices, without judgment.
    I don’t know how therapists train themselves to acquire this kind ofcapacity to
    listen. A therapist also may be full of suffering. While sitting and listening
    to the client, the seeds ofsuffering in him or her may be watered. Ifthe therapist
    is overwhelmed by his own suffering, how can he listen properly to the other person?
    When you are trained to be a therapist, you have to learn the art ofdeep listening.
    Listening with empathy means you listen in such a way that the other person feels
    you are really listening, really un- derstanding, hearing with your whole being—with
    your heart. But how many ofus can listen like that? We agree in principle that
    we should listen with our heart, so that we can really hear what the other is
    saying. We agree that we should give the speaker the feeling that he is being
    listened to and being understood. Only that can give him a feeling ofrelief. But,
    in fact, how many ofus can listen like that? THICH NHAT HANH 92 2S 1S R 1L 2L'
