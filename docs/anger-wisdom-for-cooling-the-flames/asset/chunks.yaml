    # Listening to Give Relief


    Deep listening, compassionate listening is not listening with the purpose of analyzing
    or even uncovering what has happened in the past. You listen first of all in order
    to give the other person relief, a chance to speak out, to feel that someone finally
    understands him or her.


    Deep listening is the kind of listening that helps us keep compassion alive while
    the other speaks, which may be for half an hour or forty-five minutes. During
    this time you have in mind only one idea, one desire: to listen in order to give
    the other person the chance to speak out and suffer less. This is your only purpose.
    Other things like analyzing, understanding the past, can be byproduct of this
    work. But first of all listen with compassion.


    ## Compassion Is the Antidote for Anger and Bitterness


    If you keep compassion alive in you while listening, then anger and irritation
    cannot arise. Otherwise the things he says, the things she says will touch off
    your irritation, anger, and suffering. Compassion alone can protect you from becoming
    irritated, angry, or full of despair.


    So you want to act as a Great Being while listening because you know that the
    other person suffers so much and needs you to step in and rescue him. But you
    have to be equipped with something to do the job. When firemen come to help put
    out a fire, they have to have the right equipment. They must have ladders, water,
    and the kind of clothing that can protect them from fire. They have to know many
    ways to protect themselves and to put the fire out.


    When you listen deeply to someone who suffers, you step into a zone of fire. There
    is a fire of suffering, of anger burning in the person you are listening to. If
    you are not well equipped, you cannot help and you might become a victim of the
    fire in the other person. This is why you need equipment.


    Your equipment here is compassion, which can be nourished and kept alive with
    the practice of mindful breathing. Mindful breathing generates the energy of mindfulness.
    Mindful breathing keeps your basic desire alive, the desire to help the other
    person speak out. When the other person speaks, his words might be full of bitterness,
    condemnation, and judgment. These words might touch off suffering in you. But
    if compassion is kept alive in you, through the practice of mindful breathing,
    you are protected. You are capable of sitting there and listening for one hour
    without suffering. Your compassion will nourish you, knowing that you are helping
    THICH NHAT HANH the other person to suffer less.


    Play the role of a Bodhisattva. You will be the best kind of therapist. Compassion
    is born from happiness and also from understanding. When compassion and understanding
    are kept alive, you are safe. What the other person says will not make you suffer
    and you can listen deeply. You really listen.


    When you do not have the capacity to listen with compassion, you cannot just pretend
    you are listening. The other person will realize that you are full of ideas about
    suffering, but don’t really understand him or her. When you have understanding,
    you can listen with compassion, you can listen deeply, and the quality of this
    listening is the fruit of your practice.


    ## Nourishing Ourselves


    Touching suffering can help us nourish our compassion and be able to recognize
    happiness when it is there. If we are not in contact with pain, we cannot know
    what real happiness is. So touching suffering is our practice. But each one of
    us has limits. We cannot do more than we can do. This is why we have to take good
    care of ourselves.


    If you listen too much to the suffering, the anger of other people, you will be
    affected. You will be in touch only with suffering, and you won’t have the opportunity
    to be in touch with other, positive elements. This will destroy your balance.


    Therefore, in your daily life, you have to practice so that you can be in touch
    with elements that do not constantly express suffering: the sky, the birds, the
    trees, the flowers, children—whatever is refreshing, healing, and nourishing in
    us and around us. Sometimes you get lost in your suffering, in your worries. Let
    your friends rescue you. They may say, “Look how beautiful the sky is this morning.
    It is foggy, but it’s really beautiful. Paradise is right here. Why don’t you
    come back to the present and witness this beauty?”


    You are with the community, with brothers and sisters who are capable of being
    happy. So the community rescues you and helps you to be in touch again with the
    positive elements of life. This is the practice of nourishment. It’s very important.
    We should be able to live each day deeply, with joy, peace, and compassion because
    time goes by so quickly.


    Each morning I offer a stick of incense to the Buddha. I promise myself that I
    will enjoy every minute of the day that is given me to live. It is thanks to the
    practice of mindful walking and mindful breathing that I can enjoy deeply every
    moment of my daily life. Mindful breathing and mindful walking are like two friends,
    always helping me to delve into the here and the now and touch the wonders of
    life that are available. We need to receive the nourishment we deserve. Listening
    to the sound of the bell is a very nourishing and pleasant THICH NHAT HANH practice.


    In Plum Village, whenever the phone rings, the clock chimes, or the monastery
    bell is invited, we have a chance to stop whatever we are doing, to stop our talking
    and our thinking. These are bells of mindfulness. When we hear the sound of the
    bell, we relax our body and return to our breathing. We realize that we are alive
    and can get in touch with many wonders of life that are present for us. We stop
    naturally, with enjoyment, not with solemnity or stiffness. Breathing in and out
    three times, we enjoy the fact that we are alive. When we stop, we restore our
    calm and peace, we become free. Our work becomes more enjoyable, and the people
    around us become more real.


    The practice of stopping and breathing with the bell is an example of the kind
    of practice that helps you get in touch with the beautiful and nourishing elements
    in daily life. You can do it alone, but with the sangha you can do it much more
    easily. The community is always there. When you get lost in your suffering, it
    can rescue you and put you in touch with the positive elements of life. To know
    our limits is our practice. Even if you are a spiritual teacher and you have the
    capacity of listening to people’s suffering, you have to know your limits. You
    have to enjoy walking meditation. You have to enjoy your tea. You have to enjoy
    the company of happy people so that you get sufficient nourishment. To listen
    to the other person, you have to take COMPASSIONATE COMMUNICATION.

