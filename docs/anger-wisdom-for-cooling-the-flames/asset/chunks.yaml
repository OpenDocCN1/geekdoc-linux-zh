- fmt: "\nHate. You know this very well. Many of us begin a relationship- with great\
    \ love, very intense love. So intense that we believe that, without our partner,\
    \ we cannot survive. Yet if we do not practice mindfulness, it takes only one\
    \ or two years for our love to be transformed into hatred. Then, in our partner’s\
    \ presence we have the opposite feeling, we feel terrible. It becomes impossible\
    \ to live together anymore, so divorce is the only way. \n\nLove has been transformed\
    \ into hatred; our flower has become garbage. But with the energy of mindfulness,\
    \ you can look into the garbage and say, “I am not afraid. I am capable of transforming\
    \ the garbage back into love.” If you see elements of garbage in you, like fear,\
    \ despair, and hatred, don’t panic. As a good organic gardener, a good practitioner,\
    \ you can face this: “I recognize that there is garbage in me. I am going to transform\
    \ this garbage into nourishing compost that can make love reappear.” \n\nThose\
    \ who have confidence in the practice don’t think of running away from a difficult\
    \ relationship. When you know the techniques of mindful breathing, mindful walking,\
    \ mindful sitting, and mindful eating, you can generate the energy of mindfulness\
    \ and embrace your anger or your despair. Just embracing it will give you relief.\
    \ Then as you continue embracing, you can practice looking deeply into the nature\
    \ of your anger. \n\n## The Two Phases of Practice\n\nThe practice has two phases.\
    \ The first phase is putting out the fire of anger recognizing: “My dear anger,\
    \ I know you are there, I am taking good care of you.” The second phase is to\
    \ look deeply into the nature of your anger to see how it has come about.\n\n\
    ## Caring for Your Baby, Anger\n\nYou have to be like a mother listening for the\
    \ cries of her baby. If a mother is working in the kitchen and hears her baby\
    \ crying, she puts down whatever she is doing, and goes to comfort her baby. She\
    \ may be making a very good soup; the soup is important, but it’s much less important\
    \ than the suffering of her baby. She has to put down the soup, and go the baby’s\
    \ room. Her appearance in the room is like sunshine because the mother is full\
    \ of warmth, concern, and tenderness. \n\nThe first thing she does is pick up\
    \ the baby and embrace him tenderly. When the mother embraces her baby, her energy\
    \ penetrates him and soothes him. This is exactly what you have to learn to do\
    \ when anger begins to surface. You have to abandon everything that you are doing,\
    \ because your most important task is to go back to yourself and take care of\
    \ your baby, your anger. Nothing is more urgent than taking good care of your\
    \ baby.\n\nRemember when you were a little child and you had a fever, although\
    \ they gave you aspirin or other medicine, you didn’t feel better until your mother\
    \ came and put her hand on your burning forehead? That felt so good! Her hand\
    \ was like the hand of a goddess. When she touched you with her hand, a lot of\
    \ freshness, love, and compassion penetrated into your body. \n\nThe hand of your\
    \ mother is your own hand. Her hand is still alive in yours, if you know how to\
    \ breathe in and out, to be mindful. Then, touching your forehead with your very\
    \ own hand, you will see that your mother’s hand is still there, touching your\
    \ forehead. You will have the same energy of love and tenderness for yourself.\
    \ The mother holds her baby with mindfulness, fully concentrated on him. The baby\
    \ feels some relief because he is being held tenderly by his mother, like the\
    \ flower embraced by the sunshine. She holds the baby not only for the sake of\
    \ holding the baby, but also to find out what is wrong with him. Because she is\
    \ a true mother, and very talented, she can find out what is wrong with her baby\
    \ very quickly. She is a baby specialist. As practitioners, we have to be anger\
    \ specialists. We have to attend to our anger; we have to practice until we understand\
    \ the roots of our anger and how it works.\n\n## Holding Your Baby\n\nHolding\
    \ the baby mindfully, the mother quickly discovers the cause of his suffering.\
    \ Then it is very easy for her to correct the situation. If the baby has a fever,\
    \ then she will give him medicine to help the fever down. If he is hungry, she\
    \ will feed him warm milk. If the diaper is too tight, she will loosen it. \n\n\
    As practitioners, we do exactly like this. We hold our baby of anger in mindfulness\
    \ so that we get relief. We continue the practice of mindful breathing and mindful\
    \ walking, as a lullaby for our anger. The energy of mindfulness penetrates into\
    \ the energy of anger, exactly like the energy of the mother penetrates into the\
    \ energy of the baby. There’s no difference at all. If you know how to practice\
    \ mindful breathing, smiling, and walking meditation, it is certain that you will\
    \ find relief in five, ten, or fifteen minutes.\n\n## Discovering the True Nature\
    \ of Your Anger\n\nAt the moment you become angry, you tend to believe that your\
    \ misery has been created by another person. You blame him or her for all your\
    \ suffering. But by looking deeply, you may realize that the seed of anger in\
    \ you is the main cause of your suffering. Many other people, confronted with\
    \ the same situation, would not get angry like you. They hear the same words,\
    \ they see the same situation, and yet they are able to stay calm. \n\nWhy do\
    \ you get angry so easily? You may get angry very easily because your seed of\
    \ anger is too strong and because you have not practiced. All of us have a seed\
    \ of anger in the depth of our consciousness. But in some of us, that seed of\
    \ anger is bigger than our other seeds—like love or compassion. When we begin\
    \ to cultivate the energy of mindfulness, the first insight we have is that the\
    \ main cause of our suffering, our misery, is not the other person—it is the seed\
    \ of anger in us. Then we will stop blaming the other person. We realize she or\
    \ he is only a secondary cause. You get a lot of relief when you have this insight,\
    \ and you begin to feel much better. But the other person still may be in hell\
    \ because she does not know to practice. Once you have taken care of your anger,\
    \ you become aware that she is still suffering. So now you can focus your attention\
    \ on the other person.\n\n## Helping Not Punishing\n\nWhen someone does not know\
    \ how to handle his own suffering, he allows it to spill over the people around\
    \ him. When you suffer, you make people around you suffer. That’s very natural.\
    \ This is why we have to learn how to handle our suffering, so we won’t spread\
    \ it everywhere. \n\nWhen you are the head of a family, for instance, you know\
    \ that the well-being of your family members is very important. Because you have\
    \ compassion, you do not allow your suffering to harm those around you. You practice\
    \ to learn how to handle your suffering because you know that your suffering is\
    \ not an individual matter, your happiness is not an individual matter. When someone\
    \ is angry, and doesn’t know how to handle her anger, she is helpless, she suffers.\
    \ She also makes the people around her suffer. At first, you feel that she deserves\
    \ punishment. You want to punish her because she has made you suffer. But after\
    \ ten or fifteen minutes of walking meditation and mindful looking, you realize\
    \ that what she needs is help and not punishment. This is a good insight. This\
    \ person may be someone very close to you—she may be your wife, he may be your\
    \ husband. If you don’t help him or her, who will?\n"
