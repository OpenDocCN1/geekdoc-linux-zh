- fmt: "\nYou can do this later. Right at that moment, it is better to withdraw into\
    \ your room or to a quiet place, and immerse yourself in that feeling of gratitude.\
    \ Then write down your feelings, your gratitude, your happiness. In half a page\
    \ or one page, do your best to express yourself in writing, or record yourself\
    \ on tape. This moment of gratitude is a moment of enlightenment, of mindfulness,\
    \ of intelligence. It is a manifestation from the depths of your consciousness.\
    \ You have this understanding and insight in you.\n\nBut when you get angry, your\
    \ gratitude and love do not seem to be there at all. You feel as if they have\
    \ never existed, so you have to write them down on a sheet of paper and keep it\
    \ safely. From time to time, take it out and read it again. The `Heart Sutra`,\
    \ a scripture that is chanted daily by many Buddhists, is the essence of the Buddha’s\
    \ teachings on wisdom. What you have written is a `Heart Sutra` because it comes\
    \ from your heart—not from the heart of a Bodhisattva or the Buddha, but from\
    \ your own heart. It is your `Heart Sutra`. \n\n## Chant Your Heart Sutra Daily\n\
    We can all learn something from the story of the woman who was saved by the love\
    \ letters she kept in a biscuit box. THICH NHAT HANH 110 2S 1S R 1L 2L\n\nWhen\
    \ you read such letters from the heart, you are saved by them. Your savior doesn’t\
    \ come from outside; it comes from inside. You can love; you do have the capacity\
    \ to appreciate the other person, to feel grateful. This is a blessing. You know\
    \ you are lucky to have met your partner, you are lucky to have your beloved one\
    \ in your life. Why do you let this truth fly away? It is in your heart.\n\nSo\
    \ you have to chant your `Heart Sutra` every day. You have to look at it. Every\
    \ time you touch the love and appreciation in you, you feel grateful again, you\
    \ cherish his or her presence again. You have to be alone in order to fully appreciate\
    \ the other person’s presence. If you are always together, then you may begin\
    \ to take him for granted, forgetting to enjoy his beauty and goodness. Every\
    \ now and then, take three or seven days off. Take time away from him in order\
    \ to be able to appreciate him more. Although you are far away from him, he is\
    \ more real to you, more substantial than when you are constantly together. During\
    \ the time you are apart, you will remember how important, how precious he is\
    \ to you.\n\nSo, please, write or produce your own `Heart Sutra`, or sutras, and\
    \ keep it in a sacred place. Try to chant your sutra often. Then, when anger overwhelms\
    \ you, and you are not skillful enough to embrace it, your `Heart Sutra` will\
    \ help tremendously. Pick it up, practice breathing deeply in and out, and read\
    \ it. Right away you will come back to yourself, YOUR HEART SUTRA 111 2S 1S R\
    \ 1L 2L and you will suffer much less. When you read your `Heart Sutra`, you will\
    \ know what to do and how to respond. The challenge is getting yourself to do\
    \ it. You must create the conditions, prepare, plan, and organize, so that you\
    \ can really profit from your intelligence. Use your talent to arrange and create\
    \ these kinds of practices.\n\n## Leave the Shore of Anger\nYou are still standing\
    \ on the shore of suffering and anger. Why don’t you leave this shore, and go\
    \ to the other shore— the shore of non-anger, peace, and liberation? It’s much\
    \ more pleasant there. Why do you have to spend several hours, one evening, or\
    \ even days suffering in anger? There is a boat you can use to cross very quickly\
    \ to the other shore. That boat is the practice of returning to ourselves, through\
    \ mindful breathing, so that we can look deeply at our suffering, anger, and depression\
    \ and smile at them. Doing this, we overcome our pain and cross over to the other\
    \ shore.\n\nDon’t stay on this shore and continue to be the victim of your anger.\
    \ Non-anger is in you; non-anger is possible. Just cross the river and go to the\
    \ other shore, the shore of non-anger. It is cool, pleasant, and refreshing there.\
    \ Don’t allow yourself to be tyrannized by your anger. Free yourself, liberate\
    \ yourself. THICH NHAT HANH 112 2S 1S R 1L 2L\n\nCross over with the help of a\
    \ teacher, other friends who practice, and your own practice. Rely on these boats\
    \ to cross the river and go to the other shore. Right now you may be standing\
    \ on the shore of confusion, anger, or doubt. Don’t stay there; go to the other\
    \ shore. With the sangha, your brothers and sisters in the dharma, your practice\
    \ of walking and breathing, your practice of looking deeply, and of chanting your\
    \ own `Heart Sutra`, you will cross very quickly. Maybe in just a few minutes.\n\
    \nYou have the right to be happy. You have the right to be compassionate, to be\
    \ loving. The seed of awakening is in you. With the practice, you can turn this\
    \ seed into a flower right away. You can end your suffering, because the dharma\
    \ is immediately effective. It is quicker than aspirin.\n\n## Give a Gift When\
    \ You Are Angry\nThere may be times when you are angry with someone, and you try\
    \ everything you can to transform your anger, but nothing seems to work. In this\
    \ case, the Buddha proposes that you give the other person a present. It sounds\
    \ childish, but it is very effective. When we’re angry with someone, we want to\
    \ hurt them. Giving them a present changes that into wanting to make them happy.\n\
    \nSo, when you are angry with someone, YOUR HEART SUTRA 113 2S 1S R 1L 2L give\
    \ him a present. After we’re angry with someone, we want to hurt them. Giving\
    \ them a present changes that into wanting to make them happy. So, when you are\
    \ angry with someone, YOUR HEART SUTRA 113 2S 1S R 1L 2L give him a present. After\
    \ we’re angry with someone, we want to hurt them. Giving them a present changes\
    \ that into wanting to make them happy. So, when you are angry with someone, YOUR\
    \ HEART SUTRA 113 2S 1S R 1L 2L give him a present. After we’re angry with someone,\
    \ we want to hurt them. Giving them a present changes that into wanting to make\
    \ them happy.\n\n## The Relief of Understanding\nWhen you are angry, you want\
    \ to ease your suffering. That is a natural tendency. There are many ways to find\
    \ relief, but the greatest relief comes from understanding. When understanding\
    \ is there, anger will go away by itself. When you understand the situation of\
    \ the other person, when you understand the nature of suffering, anger has to\
    \ vanish, because it will be transformed into compassion. Looking deeply is the\
    \ medicine most recommended for anger. If you look, you will understand the other’s\
    \ difficulties and their deepest aspiration they have never been able to realize.\
    \ Then compassion is born in you and compassion is THICH NHAT HANH 114 2S 1S R\
    \ 1L 2L the antidote for anger. If you allow compassion to spring from your heart,\
    \ the fire of anger will die right away. Most of our suffering is born from our\
    \ lack of understanding and insight that there is no separate self. The other\
