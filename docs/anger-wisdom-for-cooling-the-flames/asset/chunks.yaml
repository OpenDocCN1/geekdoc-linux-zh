    Things become less important and the decision becomes much easier. I have written
    three volumes on the history of Buddhism in Vietnam. All three volumes have been
    well received by readers. There is one more to write, the fourth volume. It’s
    very important: the history of Buddhism in Vietnam from 1964 to the present. Writing
    this book is a very exciting and interesting project. I have lived through this
    period and so have gained firsthand experience. If I don’t write it, there might
    not be anyone else with the time or the direct experience to do it. And this would
    do some injustice to history.


    Writing this book would also help people to learn more about the development and
    practice of Buddhism. In me there is a historian. And I feel great joy when I
    play this role: making discoveries, revealing things that are new to other people,
    and giving the younger generation a direction to go in. They can learn a lot from
    the mistakes and the successes of past generations. So the desire to write this
    fourth volume is very strong. But I have not been able to write it because there
    are many more urgent things to do, such as helping relieve the suffering of people
    right beside me, in front of me, and around me. I cannot afford to be a scholar,
    a historian, although I know that this book is very important. I have all the
    documents needed for writing the book, but I would need one year to complete it.
    Which would THICH NHAT HANH 190 2S 1S R 1L 2L mean no retreats, no dharma talks,
    no consultations, and so on. We all have many things to do in our daily life.
    You have to decide which things are the most important to you. Getting a university
    degree may take you six or even eight years, and that is quite a long period of
    time. You may believe that this degree is important for your happiness. It might
    be, but perhaps there are other elements that are more important to your well-being,
    and to your happiness. You can work on improving the relationship between you
    and your father, your mother, or your partner. Do you have time for this? Can
    you afford enough time in order to do this work? It is very important to improve
    the relationship between you and your beloved ones. You are willing to put aside
    six years for a diploma; do you have the wisdom to use just as much time to work
    out a relationship? To deal with your anger? This time will bring you and the
    other person the happiness and stability you need to restore communication.


    ## Writing a Book on Yourself


    Recently, a university professor from the United States came to Plum Village.
    He was very eager to write a book on Thomas Merton and myself. He wanted to talk
    to me about RESTORING THE PURE LAND 191 2S 1S R 1L 2L it, and I said immediately,
    “Why don’t you write a book on yourself? Why don’t you invest one hundred percent
    of yourself into the practice of making yourself and the people around you happy?
    That is more important than writing a book on Thomas Merton and myself. Many books
    have been written on Thomas Merton already.”


    Our friend said, with the best intentions and a lot of love, “But no one has written
    a book on you yet.” I answered, “I don’t care about a book on me, but I care very
    much about you writing a book on yourself. Write with your whole heart to transform
    yourself into an instrument of dharma, of the practice, so that you can become
    a free person, a happy person. That way you can help many people around you to
    be happy also.”


    What is most important to me is to establish a good relationship between my students
    and myself. I have to make it possible for people to practice and to transform.
    This is very rewarding and nourishing. Every time a practitioner is capable of
    transforming her suffering, and able to establish a good relationship with others,
    it is quite a victory. Not only a victory for him or for her, but a victory for
    the whole community, and for the practice as well. This is very nourishing for
    all of us. We know the story of the young nun in Plum Village who was able to
    help a mother and daughter reconcile. That was a real victory. It strengthened
    her faith in the practice and ours at the same time. THICH NHAT HANH 192 2S 1S
    R 1L 2L


    If you have difficulties with another person, and think that she only wants to
    make you suffer, and that it’s impossible to do anything to help her, then you
    are not putting the teachings into practice. If it seems impossible for you to
    have a dialogue with her, that’s because you lack experience in the practice.
    It is possible for you to talk to that person. Many people ask the question—“What
    if the other person doesn’t want to cooperate, doesn’t want to listen?” If the
    other person doesn’t want to listen to you, to talk to you, or to work it out
    with you right now, then continue to practice and transform yourself so that reconciliation
    will be possible. Writing a book on yourself is a way of looking deeply to recognize
    the roots of your suffering and find ways to transform them. It will help you
    become a free and happy person, able to make others around you happy also.


    ## Nectar of Compassion


    You should nourish yourself with the nectar of compassion before you approach
    another person in order to reconcile. Compassion is born from understanding—understanding
    that the other person also suffers. We tend to forget this. We see only our own
    suffering, and then we exaggerate, thinking, “No one else suffers like I do; I
    am the only one who suffers RESTORING THE PURE LAND 193 2S 1S R 1L 2L like this.”
    But with community to support you, you will be able to look deeper, to see that
    the other person suffers suffers much. It may be that the other person has not
    had enough support, he has not been able to advance on the path, and you have
    not helped him either. You are not even able to help yourself. But the teachings
    are exactly for that, the community is exactly for that—for nourishing ourselves
    with the nectar of compassion. We have to call on the dharma, we have to call
    on the sangha to help us. The dharma is effective in the here and now.


    ## Leaving the Prison of Notions


    You should not practice like a machine, but with intelligence, so that each step,
    each breath, will make you feel better. Each mindful meal, each cup of tea, can
    make you feel better. Touch the wonders of life within and around you. Nourish
    yourself by allowing the beautiful and healing elements around you to penetrate
    you. This is the most important thing to do. Ideas are not nourishing. In fact,
    ideas and notions very often become obstacles. They can become a prison. We must
    leave these ideas and notions behind in order to touch life so THICH NHAT HANH
    194 2S 1S R 1L 2L full of wonders. Learn from your fellow practitioners who are
    capable of being happy, capable of loving. There are such people. They don’t have
    problems with other members of their community because they can accept everyone.
    They are content. We have to cultivate the capacity of being happy like them.
    Living in the same environment, we share the same conditions of happiness. Others
    are capable of being happy, why can’t we? What kind of obstacle is preventing
    us from being happy?


    ## A Crucial Letter


    If you have been trained in loving speech and deep listening, you can resolve
    a conflict with someone else by speaking to him or her directly. But if you are
    unsure whether your peace, solidity, and compassion are enough to keep you fresh,
    loving, and calm while you speak, then you may like to practice writing a letter.
    Writing a letter is a very important practice. Because even if you have the best
    intentions, if your practice is not solid enough, you may become irritated when
    you speak and react in an unskillful way. This can ruin your chance. So sometimes
    it’s safer and easier to write a letter. In a letter you can be perfectly honest.
    You can tell the other person that there are things that she has done that have

