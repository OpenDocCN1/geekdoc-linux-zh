    Because you know how to embrace your anger, you now feel much better, but you
    see that the other person continues to suffer. This insight motivates you to go
    back to him. No one can help, except you. Now you are filled with the desire to
    return and help. It is a completely different kind of thinking—there is no more
    wish to punish. Your anger has been transformed into compassion. The practice
    of mindfulness leads to concentration and insight. Insight is the fruit of the
    practice, which can help us to forgive, to love. In a period of fifteen minutes,
    or half an hour, the practice of mindfulness, concentration, and insight can liberate
    you from your anger and turn you into a loving person. That is the strength of
    the dharma, the miracle of the dharma.


    # Stopping the Cycle of Anger


    There was a twelve-year-old boy who used to come to Plum Village every summer
    to practice with other young people. He had a problem with his father because
    every time he made a mistake or fell and hurt himself, instead of helping, his
    father would shout at him and call him all sorts of names: “You stupid boy! How
    can you do something like that to yourself?” This would happen just because the
    boy would fall down and get hurt.


    So he didn’t see his father as a loving father, as a good father. He promised
    himself that when he grew up, got married, and had children, he would not treat
    his children like that. If his son was playing and got hurt and bled, he would
    not shout at him. He would embrace his son and try to help him.


    The second year he was in Plum Village, he came with his younger sister. His sister
    was playing with other girls on the hammock, and suddenly she fell off. She hit
    her head on a piece of rock, and blood began to stream down her face. Suddenly
    the young man felt the energy of anger coming up. He was about to shout at his
    younger sister: “You stupid girl! How could you do something like that to yourself?”
    He was about to do the same thing that his father had done to him. But because
    he had practiced in Plum Village for two summers, he was able to stop himself.
    Instead of shouting, he began to practice mindful walking and mindful breathing
    while others helped his sister. In just five minutes he experienced a moment of
    enlightenment. He saw that his reaction, his anger, was a kind of habit energy
    that had been transmitted to him by his father. He had become exactly like his
    father, the continuation of his father. He did not want to treat his sister like
    that, but the energy transmitted to him by his father was so strong that he almost
    did exactly what his father had done to him.


    For a twelve-year-old boy, that is quite an awakening. He continued his walking,
    and suddenly he was filled with the desire to practice in order to transform this
    habit energy, so that he would not transmit it to his children. He knew that only
    the practice of mindfulness could help him to stop this cycle of suffering. The
    boy was also able to see that his father was a victim of the transmission of anger
    as well. His father might not have wanted to treat him like that, but he had done
    so because the habit energy in him was too strong. The moment this insight came
    to him, that his father was also a victim of transmission, all of his anger toward
    his father vanished. A few minutes later, he suddenly had the desire to go back
    home and invite his father to practice with him. As a young man of twelve years
    old, that was quite a realization.


    # A Good Gardener


    When you understand the suffering of the other person, you are able to transform
    your desire to punish, and then you want only to help him or her. At that moment,
    you know that your practice has succeeded. You are a good gardener. Inside every
    one of us is a garden, and each practitioner has to go back to it and take care
    of it. Maybe in the past, you left it untended for a long time. You should know
    exactly what is going on in your own garden, and try to put everything in order.
    Restore the beauty; restore the harmony in your garden. Many people will enjoy
    your garden, if it is well tended.


    # Taking Care of Yourself, Taking Care of the Other


    As children, our fathers and our mothers taught us how to breathe, how to walk,
    how to sit, how to eat, and how to speak. But when we come to the practice, we
    are reborn, as spiritual beings. So we have to learn how to breathe again, mindfully.
    We learn how to walk again, mindfully. We want to learn how to listen again, mindfully
    and with compassion. We want to learn how to speak again, with the language of
    love, to honor our original commitment.


    “Darling, I suffer. I am angry. I want you to know it.” This expresses faithfulness
    to your commitment.


    “Darling, I am doing my best. I am taking good care of my anger. For me and for
    you also. I don’t want to explode, to destroy myself and destroy you. I am doing
    my best. I am putting into practice what I have learned from my teacher, from
    my sangha.” This faithfulness will inspire respect and confidence in the other
    party.


    # Anger: Wisdom for Cooling the Flames


    “Darling, I need your help.” This is a very strong statement, because usually
    when you’re angry, you have the tendency to say, “I don’t need you.” If you can
    say these sentences with sincerity, from your heart, a transformation will take
    place in the other person to start practicing, just by your behavior. She will
    think, “He is faithful to me. He is keeping his commitment. He is trying his best.”
    Taking care of yourself, you take care of your loved one. Self-love is the foundation
    for your capacity to love the other person. If you don’t take care of yourself,
    if you are not happy, if you are not peaceful, you cannot make the other person
    happy; you cannot love. Your capacity for loving another depends entirely on your
    capacity for loving yourself.


    # Healing the Wounded Child Within


    Many of us still have a wounded child alive within us. Our wounds may have been
    caused by our father or our mother. Our father may have been wounded when he was
    a child. Our mother may have been wounded as a little girl, too. Because they
    did not know how to heal the wounds from childhood, they have transmitted their
    wounds to us. If we do not know how to transform and heal the wounds in ourselves,
    we are going to transmit them to our children and grandchildren. This is why we
    have to go back to the wounded child in us, to help him or her heal. Sometimes
    the wounded child in us needs all of our attention. That little child might emerge
    from the depths of our consciousness, and ask for our attention. If you are mindful,
    you will hear his or her voice calling for help. At that moment, instead of contemplating
    the beautiful sunrise, you go back and tenderly embrace the wounded child within
    you.


    “Breathing in, I go back to my wounded child; breathing out, I will take good
    care of my wounded child.” To take good care of ourselves, we must go back and
    take care of the wounded child inside of us. You have to practice going back to
    your wounded child every day. You have to embrace him or her tenderly, like a
    big brother or a big sister. You have to talk to him, talk to her. And you can
    write a letter to the little child in you, of two or three pages, to say that
    you recognize his or her presence and you will do everything you can to heal his
    or her wounds.

