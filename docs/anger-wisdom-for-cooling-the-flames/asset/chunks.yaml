- fmt: "\n# Breathe to Take Care of Your Anger\n\nWhen the energy of anger, jealousy,\
    \ or despair manifests in us, we should know how to handle it, otherwise we will\
    \ be overwhelmed by it and suffer tremendously. Mindful breathing is the practice\
    \ that can help us take care of our emotions. First, in order to take good care\
    \ of our emotions, we have to learn how to take good care of our body. By becoming\
    \ aware of breathing in and out we become aware of our body. \n\n“Breathing in,\
    \ I am aware of my whole body, breathing out, I am aware of my whole body.” Go\
    \ back to your body. Embrace it with the energy of mindfulness generated by the\
    \ practice of mindful breathing.\n\n## Ten Minutes Mindful Breathing\n\nIn daily\
    \ life, we may be very busy taking care of many things, and we forget how important\
    \ our body is to us. Our body may be suffering or sick. So we should know how\
    \ to go back to our body, in order to embrace it tenderly, with mindfulness. As\
    \ a mother holds her baby tenderly in her arms, we are doing very much the same\
    \ thing. We go back to our body and we embrace our body with tenderness, with\
    \ the energy of mindfulness. \n\nAfter having embraced our body as a whole, we\
    \ begin to embrace all the different parts of our body one by one—our eyes, our\
    \ nose, our lungs, our heart, our stomach, our kidneys, and so on.\n\n### Deep\
    \ Relaxation for Embracing and Healing Anger\n\nThe best position for practicing\
    \ this is lying down. You focus your attention on a part of your body, such as\
    \ your heart. As you breathe in, you become aware of your heart, and as you breathe\
    \ out, you smile towards it. You send it your love, your tenderness. The energy\
    \ of mindfulness is like a beam of light that can show us very clearly every part\
    \ of our body. Modern hospitals have scanners that can scan our body to see each\
    \ area clearly. But the light beam of the scanner is an X-ray beam, and not the\
    \ loving beam of mindfulness. We call this practice of scanning our body with\
    \ a beam of mindfulness, `Deep Relaxation` (see text for Deep Relaxation in Appendix\
    \ D). \n\nAnother instruction for mindful breathing is “Breathing in, I calm my\
    \ whole body, breathing out, I calm my whole body.” Your body may be agitated\
    \ and tense, and embracing with the energy of mindfulness can help it to relax\
    \ and become peaceful again. When the body functions peacefully, it can begin\
    \ to heal. This helps the mind to relax and also heal. \n\nAccording to this teaching,\
    \ our breath is a part of our body. When we are afraid of something or when we\
    \ are angry, our breath is shallow and the quality of our breathing is very low.\
    \ Our breath is short, noisy, and not peaceful at all. But if you know how to\
    \ begin breathing in and breathing outfully, calming your breath, then, in just\
    \ a few minutes, your breath will improve. Your breathing will become lighter,\
    \ more silent, and more harmonious. And your mind will begin to calm. \n\nBreathing,\
    \ like meditation, is no less than an art. You have to be very artful handling\
    \ your in-breath and out-breath, so that harmony can be reestablished in your\
    \ body and your mind. If you dominate your breath with violence, you cannot create\
    \ harmony and peace in your body or in your consciousness. \n\nOnce your breathing\
    \ has become calmer and deeper, you can continue breathing like this in order\
    \ to embrace different parts of your body. While lying down, practice mindful\
    \ breathing and generate the energy of mindfulness. Scan your body with the loving\
    \ beam of mindfulness from the top of your head until you arrive at the soles\
    \ of your feet. It may take half an hour. This is the best way of showing your\
    \ concern, your love, your attention to your body. Each of us should be able to\
    \ do this at least once a day. You can arrange your schedule so that every day,\
    \ maybe before going to sleep, the whole family can lie down comfortably on the\
    \ floor and practice total relaxation for twenty or thirty minutes. Turn off the\
    \ television and invite everyone to come and participate. In the beginning you\
    \ might like to use a tape to guide the whole family in practicing total relaxation.\
    \ Later, one of you can lead the practice, helping everyone calm and care for\
    \ their bodies.\n\n## You Can Make It Through the Storm\n\nThere are several simple\
    \ methods for taking care of our strong emotions. One is “belly breathing,” breathing\
    \ from the abdomen. When we are caught in a strong emotion like fear or anger,\
    \ our practice is to bring our attention down to the abdomen. To stay on the level\
    \ of the intellect is dangerous. Strong emotions are like a storm, and to stand\
    \ in the middle of a storm is very dangerous. Yet that is what most of us do when\
    \ we stay in our minds, letting our feelings overwhelm us. \n\nInstead, we have\
    \ to get rooted by bringing our attention downward. We focus on our abdomen and\
    \ practice mindful breathing, just giving all of our attention to its rise and\
    \ fall. We can do this either sitting or lying down. When you look at a tree in\
    \ a storm, you see that the top of the tree is very unstable and vulnerable. The\
    \ wind can break the smaller branches at any time. But when you look down to the\
    \ trunk of the tree, you have a different impression. You see that the tree is\
    \ very solid and still, and you know that it will be able to withstand the storm.\
    \ \n\nWe are also like a tree. Our head is like the top of the tree during a tempest\
    \ of a strong emotion, so we have to bring our attention down to the level of\
    \ our navel. We begin to practice mindful breathing. We concentrate just on our\
    \ breathing and on the rise and fall of our abdomen. It is a very important practice\
    \ because it helps us to see that, although an emotion may be very strong, it\
    \ will stay only for a while and then go; it cannot last forever. If you train\
    \ yourself to practice like this during difficult times, you will survive these\
    \ storms.\n\nYou have to be aware that your emotion is just an emotion. It comes,\
    \ stays for some time, and then goes away. Why should someone die because of an\
    \ emotion? You are more than your emotions. It is important to remember this.\
    \ During a crisis, when you breathe in and out, maintain the awareness that your\
    \ emotion will go away if you continue to practice. After you have succeeded a\
    \ few times, you will have confidence in yourself and in the practice. Let us\
    \ not get caught by our thoughts and feelings. Let us bring our attention down\
    \ to our belly and breathe in and out. This storm will go away, so don’t be afraid.\n\
    \n## Recognizing and Embracing Mental Formations\n\nWe embrace our bodies with\
    \ mindfulness in order to calm them. We can do the same with mental formations:\
    \ “Breathing in, I am aware of my mental formations. Breathing out, I am aware\
    \ of my mental formations.” In Buddhist psychology there are fifty-one mental\
    \ formations. There are negative mental formations, like anger, craving, and jealousy,\
    \ and there are positive mental formations, like mindfulness and equanimity. When\
    \ we experience a positive mental formation like joy or compassion, we should\
    \ breathe in and out in order to be\n"
