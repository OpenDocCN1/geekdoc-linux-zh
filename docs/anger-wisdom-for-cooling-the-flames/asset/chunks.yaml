    The capacity to love and accept is not there. If you are skillful as a meditator,
    as a peace-worker, you can help the love, the understanding to reappear in yourself
    and the other person. Please do not believe that love is not in you. It’s not
    true; love is always in you. It is like the sunshine; even when it rains, the
    sunshine is always there a little bit above the clouds. If you go above the clouds,
    you see plenty of sunshine. So if you believe that there is no love in you, that
    you feel only hate for the other person, you are wrong. Wait until the other person
    dies. You will cry and cry and wish that he could come back to life. This shows
    that love is there. You should give love a chance to manifest, while the other
    person is still alive. To help love to reappear you have to know how to manage
    your anger. Anger always goes together with confusion, with ignorance.


    ## Going Past Judgment


    Suppose you are the teacher of a five-year-old girl. When her mother comes to
    pick her up from school, you see that the mother is aggressive, making the little
    girl suffer. What can you do? You can do a lot. The child will listen to you,
    so you can help her to understand her mother. You can also give her a chance to
    speak out and tell you of the difficulties she has with her mother, even though
    she is only five.


    You can play the role of a good mother for her. You can tell her that it is possible
    for the two of you to help her mother. You can teach her how to act and react
    in moments when the mother becomes angry and violent to avoid making the situation
    worse. It is very important to help the little girl, because when there is a change
    in her, it will have a good effect on the mother.


    As the teacher of the young girl, you also have access to the mother. If you have
    compassion and insight you will be able to help. Otherwise, you will only judge
    the mother as wrong and the daughter as right. You will only be able to condemn
    the mother’s abusive behavior. You oppose her violence with her child, but it
    is not helpful just to express your disapproval. You have to do something. You
    have to act out of compassion and insight, not only for the abused child, but
    also for the child’s mother and father.


    If you cannot help her father and mother, you cannot help the child. You may see
    the child as the victim, as the only one who needs help. But if you really want
    to do everything you can to help the child, you must help the mother and father—who
    you considered to be the enemy. If you do not help them you cannot help the child.
    Helping the parents is helping the child. The parents are full of ignorance, they
    are full of violence and anger, and that is why their child suffers. So you have
    to have compassion towards the parents. You have to see the roots of the suffering.
    Our educators need to know this and help all of us take care of parents in order
    to take care of children.


    ## Serving Our Country


    The French government is trying hard to take care of youngsters who are violent.
    They do have some insight. They understand that the violence and the suffering
    of these youngsters are caused by society. In order to know how to respond, we
    must listen like a doctor. We must listen very carefully to the organism of society,
    to see why the youngsters become so violent, so angry. If we do this, we will
    see that the roots of their anger and violence are in the family, in the way parents
    conduct their daily life. And the roots of family violence are found in the way
    society is organized and how people consume.


    The government is also people. The government is made of fathers, of mothers,
    of sons, of daughters. And these fathers, mothers, sons, and daughters also carry
    the violence of their family within them. So if the French prime minister does
    not practice looking deeply, does not see the anger, violence, depression, and
    suffering within himself, he will not be able to understand the violence, anger,
    and depression in the younger generation. He also has to understand members of
    his government, in the ministry of youth, in the ministry of education, etc.,
    and see their suffering.


    As citizens, as a government, we must act, but on what basis should that action
    take place? On the basis of understanding. If we have practiced looking deeply
    enough in order to see the roots of anger and violence in our society, then we
    will have a lot of compassion for our young people. We will know that just locking
    them up and punishing them is not going to help. This is what the former French
    Prime Minister Jospin has said. So he and his government do have some insight.


    But as a people, as citizens, we have to help. We have to help deepen this kind
    of insight. As an educator, as a parent, as an artist, as a writer, we have to
    practice so that we have enough insight to help our government. Even if you are
    in a different political party than the ruling party, you have to practice. When
    you help the ruling party, you are helping your country. It is your country that
    you must help, not a political party.


    And if the current French prime minister now has a chance to do something to improve
    the condition of the young people in France, then the appropriate way to serve
    your country is to offer him your insight and your help. This does not mean you
    betray your people or your party. Your party exists in order to serve your country,
    not to create difficulties for another party or the party in power. So, as a politician,
    you have to practice non-duality. You have to see that compassion is above any
    political affiliation. This is not partisan politics but intelligent politics.
    They are politics that are humane, that aim at the well-being and the transformation
    of society, not just at gaining power.


    ## Eight DAVID AND ANGELINA: THE HABIT ENERGY OF ANGER


    There was a young man named David. He was a very handsome young man and quite
    intelligent. He was born into a rich family and had everything he needed to be
    successful. But he did not enjoy life. He was not capable of being happy. He had
    a lot of problems with his parents, brothers, and sisters. He did not know how
    to communicate. He was a very egotistical person, so he always blamed his father,
    his mother, his sister, and his brothers for his misery. He suffered a lot, but
    he was not miserable because everyone hated him, or because everyone wanted to
    punish him. He was miserable because he was not capable of loving, of understanding.
    He was able to make friends for a few days, but soon after that his friends would
    leave him because it was quite difficult to be around him.

