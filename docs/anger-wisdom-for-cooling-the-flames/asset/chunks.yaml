    is called “getting in touch with our anger.”It is wonderful and very important.
    You have to recognize and embrace anger when it manifests instead ofsuppressing
    it. But the important question here is who is the one getting in touch with, taking
    care of, and recognizing anger? Anger is an energy, and ifthat energy is overwhelming,
    you can be a victim ofit. You should be able to generate another kind of energy
    that can recognize and take care ofthe anger. Anger is a zone ofenergy that needs
    to be touched, that needs to be recognized. The question is, what is touching
    what? What energy can do the touching and the recognizing? It is the en- ergy
    ofmindfulness. So every time we get angry, we practice mindful breathing and mindful
    walking, in order to touch the seed ofmindfulness and generate the energy ofmindfulness
    in us. Mindfulness is not there to suppress. Mindfulness is there to welcome,
    to recognize: “Hello, my little anger, I know you are there. My old friend.”Mindfulness
    is the energy that helps us to be aware ofwhat is there. To be mindful is always
    THICH NHAT HANH 118 2S 1S R 1L 2L


    to be mindful ofsomething. You may be mindful ofyour in- breath, or out-breath,
    and that is mindfulness ofbreathing. Youmaybemindfulof theteayouaredrinking,andthat
    ismindfulness ofdrinking. When you eat mindfully, that is mindfulness ofeating.
    When you walk mindfully, it is mind- fulness ofwalking. In this case, we practice
    mindfulness ofanger. “I’m aware that I’m angry, and I’m aware that anger is in
    me.”So, mind- fulness is touching, recognizing, greeting, and embracing. It does
    not fight or suppress. The role ofmindfulness is like the role ofa mother, embracing
    and soothing the suffering child. Anger is in you; anger is your baby, your child.
    You have to take very good care of it. When it recognizes anger, mind- fulness
    says, “Hello there, my anger, I know you are there. I will take good care ofyou,
    don’t worry.”The moment mind- fulness is there, you are safe, you can smile, because
    the energy ofthe Buddha is born in you. If you don’t know how to handle your anger,
    it can kill you. Without mindfulness, you may become the victim of anger. It can
    make you vomit blood and even die. Many peo- ple die because ofanger—it is a shock
    to your whole system, it creates tremendous pressure and pain inside you. When
    the Buddha is present, when the energy of mindfulness is there, you are protected.
    Mindfulness helps you take care of your situation. When the big brother is there,
    the younger YOUR HEART SUTRA 119 2S 1S R 1L 2L


    brother is safe. When the mother is there, the child is safe. Through the practice,
    the mother or the big brother in you becomes better and better at taking care
    ofanger. Whilerecognizingandembracingouranger,wemustgen- eratemindfulnesscontinuously.Wecandothisbythepractice
    of continuousmindfulwalkingandbreathing.If youdon’t havemindfulness,nothingyoudowillbringyourelief,evenif
    youhitapillowwithallyourmight.Hittingapillowdoesn’t helpyougetintouchwithyourangerordiscoverthenature
    ofyouranger.Youdon’tevengetintouchwiththepillow.If youwereintouchwiththepillow,thenyouwouldknowthat
    itwasonlyapillow,andnotyourenemy.Whydoyouhitthe pillowlikethat?Becauseyoudon’tknowthatitisjustapillow.
    When you really get in touch with something, then you will know its true nature.
    Ifyou get in touch with one per- son deeply, then you know who she or he truly
    is. Ifmind- fulness is not there, getting in touch with something or someone is
    not possible. Without mindfulness, you become a victim because your anger pushes
    you to do harmful things. You Are the Object of Your Anger Who do you think you
    are? You are the other person. Ifyou get angry with your son, you are getting
    angry with yourself. THICH NHAT HANH 120 2S 1S R 1L 2L


    Youarewrongtothinkthatyoursonisnotyou.Yourson isyou. Genetically, physiologically,
    scientifically, your son is your continuation. That is the real truth. Who is
    your mother? Your mother is you. You are her continuation as a de- scendant, and
    she is your continuation as an ancestor. She links you to all those who came before,
    and you link her to all the future generations. You belong to the same stream
    of life. To think that she is a different entity, to think that you can have nothing
    to do with her is sheer ignorance. When a young man says, “I no longer want to
    have anything to do with my father,”that is sheer ignorance, because the young
    man is nothing but his father. As a mother, pregnant with your child, you had
    this in- sight, that your child is you. You ate for your baby, you drank for your
    baby, you took care of your baby. When you took care ofyourself, you took care
    ofyour baby. You were very careful, because you knew that the baby was you. But
    by the time your child reaches the age ofthirteen or fourteen, you begin to lose
    this insight. You and your child feel separated, less connected. You don’t know
    how to improve your rela- tionship, to make peace after a fight. Soon, the gap
    between the two ofyou grows bigger and more solid. Your relation- ship becomes
    very difficult and full ofconflict. YOUR HEART SUTRA 121 2S 1S R 1L 2L'
