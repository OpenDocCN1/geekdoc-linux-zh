  trans: "\n……我喜欢种蔬菜，照顾黄瓜和生菜。她想得很务实，建议我不应该浪费时间在花园里忙碌，而应该把时间花在写诗。我回答道：“亲爱的朋友，如果我不种生菜，我就写不出我所写的那些诗。”这是事实。如果你不住在专注中，住在正念中，如果你不深度地生活在生活的每一个时刻，你就无法写作。你无法创造出任何可以给他人的价值所在。诗是你送给人们的花。一个慈悲的眼神、一个微笑、一个充满爱心的行为，也是在正念与专注之树上绽放的花。即使你在为家人准备午餐时没有想那首诗，那首诗也在创作中。\n\
    \n当我写短篇故事、小说或剧本时，可能需要一周或几周才能完成。但那个故事或小说一直在那里。同样，尽管你没有在考虑要写给爱人的信，但那封信已经在你的意识深处被写好了。你不能只是坐在那里写故事或小说。你还必须做其他事情。你喝茶、做早餐、洗衣服、给蔬菜浇水。做这些事情花费的时间是极其重要的。你必须做好它们。你必须把百分之百的自我投入到烹饪、浇灌、投入到**恢复净土式洗碗**的行为中。你只需要享受你正在做的任何事，并深度地去做。这对于你的故事、你的信或你想创造的任何其他事情都非常重要。觉悟与洗碗或种生菜并不是分离的。学习如何在深度正念与专注中生活生活的每一个时刻，就是修行。一件艺术作品的构思和展开恰恰发生在我们生活的这些时刻。你开始写下音乐或诗的时间，只是分娩的时间。婴儿必须已经在你体内存，你才能把它分娩出来。但如果婴儿不在你体内，即使你在书桌前坐好几个小时，也没有东西可以分娩，你无法创造任何东西。你的洞察力、你的慈悲以及你以触动人心的方式写作的能力，都是在你修行树上绽放的花。我们应该好好利用生活的每一个时刻，让这种洞察力和慈悲得以绽放。\n\
    \n## 转化的礼物\n\n一个怀孕的母亲每当想到体内的宝宝时，都会感到非常快乐。宝宝虽然还没有出生，却能给母亲很多快乐。在生活的每一个时刻，她都意识到宝宝的存在，因此她带着爱做每件事。她带着爱吃饭，她带着爱喝水，因为她知道如果没有她的爱，宝宝可能不会健康。她一直非常小心。她知道如果她犯了错，如果她抽了很多烟，如果她喝了很多酒，这对宝宝没有好处。所以她非常正念，带着爱心生活。\n\
    \n修行者必须表现得像母亲一样。我们知道想要创造一些东西，想要为人类、为世界提供一些东西。我们每个人身上都怀揣着一个宝宝——佛子，而我们可以提供的正是我们体内的这个佛子。我们必须住在正念中，以便好好照顾我们的佛子。正是我们体内的佛的能量让我们能够写出一封真正的情书，并与他人和解。一封真正的情书是由洞察、理解和慈悲构成的。否则，它就不是一封情书。一封真正的情书可以引发他人的转化，从而让世界产生转化。但在让他人产生转化之前，它必须先在你内心产生转化。你写这封信花费的时间可能是你的一生。\n\
    \n## 和平条约\n\n在灵提山，情侣、家庭成员或朋友经常在仪式上签署这份条约，整个社区都会到场。然而，你可以根据任何让你感到舒服的方式对其进行调整。结尾处是佛教的参考内容，但请随意更改它们以符合你自己的精神传统。\n\
    \n### 和平条约\n\n为了让我们能够长久幸福地生活在一起，为了让我们能够不断发展和深化我们的爱与理解，我们以下签署人誓将遵守并实践以下内容：\n\n\
    **我，那个愤怒的人，同意：**\n\n1. 克制任何可能导致进一步伤害或升级愤怒的言行或行为。\n2. 不压抑我的愤怒。\n3. 练习正念呼吸，回到自我来照顾我的愤怒。\n\
    4. 在二十四小时内，冷静地通过口头或递交《和平便条》告诉令我生气的人我的愤怒和痛苦。\n5. 约在本周稍晚些时候（如周五晚上）进行会谈，通过口头或面条，以更彻底地讨论此事。\n\
    6. 不说：“我不生气，没关系，我不痛苦。没什么好生气的气的。”\n7. 在坐着、行走、躺下、工作和开车时，深度审视我的日常生活，以看到：\n   - 我自己在某些时候是如何是不圆满的。\n\
    \   - 我是如何因为自己的习性能量而伤害了对方。\n   - 我心中强烈的愤怒种子是我愤怒的首要原因。\n   - 对方只是次要原因。\n   - 对方只是在寻求从他们的痛苦中解脱。\n\
    \   - 只要对方还痛苦，我就无法真正快乐。\n8. 在我意识到自己的不圆满和缺乏正念时，立即道歉，而不等待周五晚上的约定。\n9. 如果我没有感到足够冷静可以会面，则推迟周五的会面。\n\
    \n**我，那个令对方生气的人，同意：**\n\n1. 尊重对方的情绪，不嘲笑对方，并给对方足够的时间冷静。\n2. 不强求立即讨论。\n3. 通过口头或便条确认对方的会面请求，并向其保证我会准时。\n\
    4. 如果我可以道歉，就立即这样做，不要等到周五晚上。\n5. 练习正念呼吸和深度观察，以看到：\n   - 我拥有愤怒和不友的种子以及习性能量，这让对方不快乐。\n\
    \   - 我错误地认为让对方痛苦可以减轻我自己的痛苦。\n   - 通过让对方痛苦，我让自己了痛苦。\n6. 在我意识到自己的不圆满和缺乏正念时立即道歉，不进行任何辩护自己的尝试，也不等待周五的会面。\n\
    \n我们在佛的见证下以及僧团正念的见证下，发誓遵守这些条款并全诚实践。我们祈求三宝保护，以赐予清明与信心。\n\n签名，______________________\
    \ ______________________\n日期 ____ 年 __ 月 __ 日 于 ________\n\n# 愤怒：用以熄灭火焰的智慧\n\n\
    **第一正念训练：对生命的敬畏**\n意识到生命毁灭所带来的痛苦，我发愿培养慈悲，并学习保护人类、动物、植物和矿物生命的方法。我决定不杀生、不放任杀生、不在世界上、在我的思维或生活中纵容任何杀生行为。\n\
    \n**第二正念训练：慷慨**\n意识到剥削、社会不公、偷窃和压迫所带来的痛苦，我发愿培养慈心\n\n"
