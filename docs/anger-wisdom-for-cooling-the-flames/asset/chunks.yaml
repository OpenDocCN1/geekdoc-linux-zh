    爱与接纳的能力并不存在。如果你作为一个冥想者、一个和平工作者得足够明智，你可以帮助爱与理解在你自己和他人身上重新出现。请不要认为爱不在你身上。那不是事实；爱一直都在你心中。它就像阳光；即使在下雨时，阳光也一直存在云层上方不远的地方。如果你走到云层之上，你就能看到充足的阳光。所以，如果你认为你内心没有爱，你只对他人感到仇恨，那么你就错了。等那个人去世后再说吧。你会哭个不停，希望他死而复生。这说明爱是在那里的。你应该在对方还活着的时候，给爱一个显现的机会。为了帮助爱重新出现，你必须学会如何管理你的愤怒。愤怒总是与困惑、无知并生。


    ## 超越评判


    假设你是一个五岁女孩的老师。当她的妈妈来学校接她时，你发现这位妈妈很有侵略性，让小女孩很痛苦。你能做什么？你可以做很多事情。孩子会听你的话，所以你可以帮助她理解她的母亲。你也可以给她一个倾诉的机会，告诉她她和妈妈相处的困难，尽管她只有五岁。


    你可以为她扮演一个好妈妈的角色。你可以告诉她，你们俩是可以帮助她妈妈的。你可以教她在妈妈变得愤怒和暴力的时刻如何表现和反应，以避免情况恶化。帮助这个小女孩非常重要，因为当她发生变化时，会对她妈妈产生良好的影响。


    作为小女孩的老师，你也有机会接触那位母亲。如果你拥有慈悲和洞察力，你将能够提供帮助。否则，你只会评判母亲是错的，女儿是对的。你只会谴责母亲的虐待行为。你反对她对孩子的暴行，但仅仅表达你的反对是不起作用的。你必须做些什么。你必须出于慈悲和洞察力去行动，不仅为了受虐待的孩子，也为了孩子的父母。


    如果你不能帮助她的父亲和母亲，你就无法帮助这个孩子。你可能把孩子看作受害者，是唯一需要帮助的人。但如果你真的想尽所能地帮助这个孩子，你就必须帮助那些被你视为敌人的孩子的父母。如果你不帮助他们，你就无法帮助这个孩子。帮助父母就是帮助这个孩子。父母充满了无知，充满了暴力和愤怒，这就是为什么他们的孩子在受苦。所以你必须对父母持有慈悲。你必须看到痛苦的根源。我们的教育者需要了解这一点，并帮助我们所有人照顾父母，以便照顾孩子。


    ## 服务于祖国


    法国政府正努力照顾那些具有暴力的青少年。他们确实拥有一些洞察力。他们理解这些少年的暴力和痛苦是由社会造成的。为了知道如何应对，我们必须像倾听一样去倾听（注：此处原文为
