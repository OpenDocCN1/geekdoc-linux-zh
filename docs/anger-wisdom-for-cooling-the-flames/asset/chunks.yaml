- fmt: "\n# Insight Stops Anger\n\nIt may seem like you are two separate entities,\
    \ but if you look deeper, you will see that you are still one. So settling the\
    \ dispute, restoring peace between you both, is like restoring peace within yourself,\
    \ within your own body. You and your child are of the same nature, you belong\
    \ to the same reality. \n\nMany years ago when I was in London, I walked into\
    \ a bookshop and saw a book entitled *My Mother, Myself*. This is an intelligent\
    \ title. Your mother, yourself. You can write another book, *My Daughter, Myself*.\
    \ Or *My Son, Myself*; *My Father, Myself*. It is the actual reality. When you\
    \ get angry with your son, you are getting angry with yourself. When you punish\
    \ your son, you punish yourself. When you inflict suffering on your father, you\
    \ inflict suffering on yourself. \n\nWe understand this when we have the insight\
    \ of non-self, the insight that the self is made of non-self elements, like our\
    \ father, mother, all our ancestors, as well as the sun, the air, and the earth.\
    \ When you can touch this insight, the reality of non-self, you know that happiness\
    \ and suffering are not individual matters. Your suffering is the suffering of\
    \ your beloved ones. Their happiness is your happiness. When you know this, you\
    \ will not be tempted by the idea of punishing or of blaming. You’ll behave with\
    \ much more wisdom. This intelligence, this wisdom...\n\n# Anger: Wisdom for Cooling\
    \ the Flames\n\nWisdom is the fruit of your contemplation, of your looking deeply.\
    \ So when you read your *Heart Sutra*, it helps you to remember the insight that\
    \ your child, your partner, is you. We read a sutra to immerse ourselves in the\
    \ truth, in the insight of non-self. The *Heart Sutra* that you are encouraged\
    \ to write is a sutra that comes from your own insight that you and the other\
    \ person are one. The *Heart Sutra* is about wisdom. So is your *Heart Sutra*.\
    \ It reminds you of the wisdom that you are not separate, isolated selves. It\
    \ reminds you of the wisdom of your love. \n\nWhen you are angry, when you are\
    \ misled by the idea that you are a separate self, reading that *Heart Sutra*\
    \ will help you return to yourself again. When insight is there, then the Buddha\
    \ is there, and you are safe. You don’t have to suffer anymore. We have to constantly\
    \ remind ourselves that there are many ways of getting relief from anger, but\
    \ the best, deepest relief comes from understanding, the insight of non-self.\
    \ \n\nNon-self is not an abstract philosophy. Non-self is a reality that you can\
    \ touch by living mindfully. The insight of non-self will restore peace and harmony\
    \ between you and the other person. You deserve peace, you deserve happiness.\
    \ That is why you have to sit down with him, with her, and design a strategy for\
    \ living together. Furthermore, you yourself must also figure out a way of living\
    \ that will bring you harmony and peace—a peace treaty with yourself, because\
    \ very often you are torn apart by the war and the conflict inside of you. \n\n\
    You are at war because you lack wisdom, you lack insight. With understanding,\
    \ you can restore peace and harmony in yourself and in your relationships with\
    \ others. You will know how to act and how to react with intelligence so that\
    \ you are no longer in a war zone, a zone of conflict. If there is peace and harmony\
    \ in you, the other person will recognize it, and peace and harmony between both\
    \ of you will be restored quickly. You will be much more pleasant, much easier\
    \ to be with, and that will help the other person tremendously. \n\nSo to help\
    \ your son, make peace with yourself. Look deeply into yourself. If you want to\
    \ help your mother, restore peace in yourself. Discover the insight that will\
    \ allow you to help your mother. Helping yourself is the first condition for helping\
    \ the other. Let go of the illusion called self. This is the essence of the practice\
    \ that will free you and the other person from anger and suffering.\n\n# Begin\
    \ with Yourself\n\nWithout communication, no real understanding can be possible.\
    \ But be sure that you can communicate with yourself first. If you cannot communicate\
    \ with yourself, how do you expect to communicate with another person? Love is\
    \ the same. If you don’t love yourself, you cannot love someone else. If you cannot\
    \ accept yourself, if you cannot treat yourself with kindness, you cannot do this\
    \ for another person. \n\nVery often you behave exactly like your father, but\
    \ you don’t realize it. And though you behave like him, you feel you are total\
    \ opposites. You do not accept him, you hate him. When you do not accept your\
    \ father, you do not accept yourself. Your father is in you; you are the continuation\
    \ of your father. So if you can communicate with yourself, then you can communicate\
    \ with your father. \n\nThe self is made of non-self elements; therefore, understanding\
    \ ourselves is our practice. Our father is a non-self element. We say our father\
    \ is not us, but without our father, we cannot exist. So he is fully present in\
    \ our body and in our mind. He is us. Thus, if you understand yourself, your whole\
    \ self, you understand that you are your father—he is not outside of you. There\
    \ are so many other non-self elements that you can touch and recognize within\
    \ yourself—your ancestors, the earth, the sun, water, air, all the food you eat,\
    \ and much more. \n\nIt may seem like these things are separate from you, but\
    \ without them, you could not live. Suppose warring parties want to negotiate,\
    \ and both sides not know enough about themselves. You have to really know yourself,\
    \ your party, your situation, in order to understand the other’s party, the other’s\
    \ nation, the other’s people. Self and others are not separate things, because\
    \ the suffering, hope, and anger of both sides is very much the same. When we\
    \ get angry, we suffer. If you really understand that, you also will be able to\
    \ understand that when the other person is angry, it means that she is suffering.\
    \ \n\nWhen someone insults you or behaves violently towards you, you have to be\
    \ intelligent enough to see the person suffers from his own violence and anger.\
    \ But we tend to forget. We think that we are the only ones that suffer, and the\
    \ other person is our oppressor. This is enough to make anger arise, and to strengthen\
    \ our desire to punish. We want to punish the other person because we suffer.\
    \ Then, we have anger in us; we have violence in us, just as they do. When we\
    \ see that our suffering and anger are no different from theirs and anger, we\
    \ will behave compassionately. Understanding the other is understanding yourself,\
    \ and understanding yourself is understanding the other person. Everything must\
    \ begin with you. To understand ourselves, we must learn and practice the way\
    \ of non-duality. We should not fight our anger, because anger is our self, a\
    \ part of our self. Anger is of an organic nature, like love. We have to take\
    \ good care of anger. And because it is an organic entity, an organic phenomenon,\
    \ it is possible to transform it into another organic entity. The garbage can\
    \ be transformed back into compost, into lettuce, and into cucumber. So don’t\
    \ despise your anger. Don’t fight your anger, and don’t suppress your anger. Learn\
    \ the tender way of taking care of your anger, and transform it into the energy\
    \ of understanding and compassion.\n"
