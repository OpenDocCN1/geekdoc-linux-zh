    通过正念呼吸和正念行走。内在的佛并非一个简单的概念。内在的佛不是一种理论或观点。它是一个现实，因为我们所有人都有产生正念能量能量。正念意味着处于当下，觉察正在发生的事情。这种能量对于练习至关重要。正念的能量就像哥哥、姐姐或母亲，将年幼者抱在怀里，好好照顾那个受苦的婴儿——即我们的愤怒、绝望或嫉妒。能量区域一是愤怒，能量区域二是正念。练习就是用正念的能量去识别并拥抱愤怒的能量。你必须温柔地这样做，不要带有暴力。这不是在压抑我们的愤怒。正念是你，愤怒也是你，所以你不应该把自己变成一个战场，让一方与另一方搏斗。你不应该认为正念是好且正确的，而愤怒是邪恶且错误的。你不应该那样想。你只需要意识到愤怒是一种负能量，而正念是正能量。这样，你就可以用正能量来照顾负能量了。


    ### 有机的感受

    我们的练习基于对“不二元性”的洞察。我们的负面情绪和正面情绪都是有机的，属于同一个现实。所以，不需要战斗；我们只需要拥抱和照顾。因此，在佛教传统中，冥想并不意味着你把自己变成一个战场，让善战胜胜恶。这非常重要。你可能认为你必须对抗邪恶，并将其从你的内心和心中逐出去。但这是错误的。练习是转化你自己。如果你没有垃圾，就没有东西可以用来堆肥。如果你没有堆肥，就没有东西可以滋养你体内的花朵。你需要体内的苦难和烦恼。由于它们是有机的，你知道你可以转化它们并善加利用它们。


    ### 互即性的洞察

    我们的练习方法应该是是非暴力的。非暴力只能产生于对不二元性、对“互即性”的洞察。这种洞察是指万物都是相互相连的，没有任何东西可以独立存在。对他人施暴力就是对你自己施暴力。如果你没有不二元性的洞察，你仍然会暴力的。你仍然想要惩罚、压抑和破坏。但一旦你渗透了不二元性的现实，你将对体内的花朵和垃圾都微笑，你将拥抱两者。这种洞察是你非暴力行动的基础。当你有了不二元性和互即性的洞察，你就会以最非暴力的方式照顾你的身体。你用非暴力的方式照顾你的心理构造，包括你的愤怒。你用极度的温柔照顾你的兄弟、姐妹、父亲、母亲、社区和整个社会。这种态度无法产生任何暴力。当你渗透了互即性的现实时，你不会将任何人视为敌人。我们练习的基础是不二元性的洞察，是非暴力的洞察。这种洞察教导我们如何用温柔的方式对待我们的身体。我们必须用温柔的方式对待我们的愤怒和绝望。愤怒的根源在于不嗔的元素中。它根根于我们日常生活的方式。如果我们能不加歧视地好好照顾我们体内的一切，就能防止负能量占据主导地位。我们减弱负种子的力量，使它们不至于淹没我们。


    ### 明智地表达愤怒

    当愤怒在我们身上显现时，我们必须识别并接受愤怒在那里，并且它需要被照顾。在这一刻，我们建议不要说什么，不要出于愤怒做任何事。我们立即回到内心，邀请正念的能量也显现出来，以拥抱、识别并好好照顾我们的愤怒。但我们建议告诉对方我们很生气，我们很痛苦。


    “亲爱的，我很痛苦，我很生气，我想让你知道这一点。”然后，如果你是一个好的练习者，你还会补充道：“我正在尽力照顾我的愤怒。”你可以用第三句话结尾：“请务必帮帮我，”因为他或她仍然与你非常亲密、非常接近。你仍然需要他或她。用这样表达愤怒是非常明智的。它是非常真实、非常忠实的，因为在关系之初，你曾向伴侣承诺会分享一切，无论是正面的还是负面的。这种语言、这种沟通将激发尊重，并激励对方回头并像你一样练习。他或她会看到你尊重自己。你证明了当你在愤怒时，你知道如何照顾你的愤怒。你正尽力拥抱它，所以你不再将伴侣视为需要惩罚的敌人。你将他或她视为依然在那里支持你的盟友。这三句话是非常积极的话。记住，你必须在二十四小时内告诉他或她。佛说，僧侣有权生气，但时间不能超过一个晚上。把愤怒憋在心里太久是不健康的。不要把你的苦难或愤怒留超过一天。你必须用一种冷静、慈爱的方式说这三句话，并且必须训练自己这样做。如果你还不够冷静来表达愤怒，而截止日期快到了，你就必须把这三句话写在纸上交给他他或她。“亲爱的，我很生气，我很痛苦。我不知道你为什么对我这样做，为什么对我说这些。我想让你知道我很痛苦。我正在尽力练习照顾我的愤怒。亲爱的，我需要你的帮助。”


    ### 周五晚上的约会

    你可能想在你的三句话、在你的道歉信中增加一些内容：“我们周五晚上坐下来一起进行深度观察吧。”也许你在一一或周二这么说，这样你们就有三四天的时间进行练习。在这期间，你们双方都有机会回顾过去，并更好地理解冲突产生。你们可以在任何时候聚在一起，但周五晚上很好，因为如果你们能和解，如果能解决问题，你们将度过一个美好的周末。在周五晚上到来之前，你要练习正念呼吸和深度观察来理解愤怒的根源。无论是在开车、走路、烹饪还是洗碗，你都继续用正念拥抱你的愤怒。通过这样做，你有机会深度观察你愤怒的本质。


    '
- fmt: "\n# Selective Watering\n\nYou have to protect yourself and your beloved ones\
    \ by practicing selective watering. You say, “Darling, if you really care for\
    \ me, if you really love me, please do not water the negative seeds in me every\
    \ day. If you do, I’ll be very unhappy, and if I’m unhappy, I’ll make you unhappy.\
    \ So please, please don’t water the seeds of anger, intolerance, irritation, or\
    \ despair in me. And I promise not to water the seeds in you. I know that you\
    \ also have negative seeds, and I’ll be very careful not to water these seeds\
    \ in you, because I know if I do, you’ll be very unhappy. And then I will suffer\
    \ also. I vow only to water the positive seeds in you—the seeds of love, compassion,\
    \ and understanding.” \n\nIn Plum Village, we call this the practice of selective\
    \ watering. If you get angry very easily, it is because your seed of anger has\
    \ been watered frequently over many years. You have allowed it to be watered.\
    \ You have not signed a contract with the people around you, agreeing to water\
    \ only the good seeds. You have not practiced protecting yourself. If you don’t\
    \ protect yourself, you don’t protect those you love. \n\nWhen we embrace anger\
    \ and take good care of our anger, we obtain relief. We can look deeply into it\
    \ and gain many insights. The first insight may be that the seed of anger in us\
    \ has grown a little too big, and it is the main cause of our misery. As we begin\
    \ to see this fact, we realize that the other person is only a secondary cause.\
    \ The other person is not the main cause of our anger. If we continue to look\
    \ deeply, we see that the other person suffers a great deal. Someone who suffers\
    \ a lot always makes the people around him or her suffer. He does not know how\
    \ to manage his suffering, how to embrace and transform it. So his suffering continues\
    \ to grow every day. \n\nIn the past, we have not helped him. We have not practiced\
    \ selective watering. If we had practiced watering the positive seeds in him every\
    \ day, he would not be the way he is today. The practice of selective watering\
    \ is very effective. Just one hour of practice can make a big difference. One\
    \ hour of watering the flower in the other person can make him or her begin to\
    \ bloom. It is not so difficult to do.\n\n# Flower Watering\n\nSome years ago,\
    \ a couple from Bordeaux came to Plum Village to attend a dharmatalk. We were\
    \ celebrating the Buddha’s birthday, and I was giving a talk on selective watering,\
    \ flower watering. I noticed that the wife was crying silently during the dharmatalk.\
    \ Afterwards, I approached the husband and said, “Your flower needs to be watered.”\
