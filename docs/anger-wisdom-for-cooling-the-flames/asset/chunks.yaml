    In daily life, we may be very busy taking care of many things, and we forget how
    important our body is to us. Our body may be suffering or sick. So we should know
    how to go back to our body, in order to embrace it tenderly, with mind- fulness.
    As a mother holds her baby tenderly in her arms, we are doing very much the same
    thing. We go back to our body and we embrace our body with tenderness, with the
    energy of mindfulness. After having embraced our body as a whole, we begin to
    embrace all the different parts ofour body one by one—our eyes, our nose, our
    lungs, our heart, our stomach, our kidneys, and so on. Deep Relaxation for Embracing
    and Healing Anger The best position for practicing this is lying down. You focus
    your attention on a part ofyour body, such as your heart. As you breathe in, you
    become aware ofyour heart, and as you breathe out, you smile towards it. You send
    it your love, your tenderness. The energy ofmindfulness is like a beam oflight
    that can show us very clearly every part ofour body. Modern hospi- tals have scanners
    that can scan our body to see each area THICH NHAT HANH 178 2S 1S R 1L 2L


    clearly. But the light beam ofthe scanner is an X-ray beam, and not the loving
    beam ofmindfulness. We call this practice ofscanning our body with a beam of mindfulness,
    Deep Relaxation (see text for Deep Relax- ation in Appendix D). Another instruction
    for mindful breathing is “Breathing in, I calm my whole body, breathing out, I
    calm my whole body.”Your body may be agitated and tense, and embracing with the
    energy of mindfulness can help it to relax and become peaceful again. When the
    body functions peacefully, it can begin to heal. This helps the mind to relax
    and also heal. According to this teaching, our breath is a part of our body. When
    we are afraid ofsomething or when we are angry, our breath is shallow and the
    quality ofour breathing is very low. Our breath is short, noisy, and not peaceful
    at all. But if you know how to begin breathing in and breathing out mind- fully,
    calming your breath, then, in just a few minutes, your breath will improve. Your
    breathing will become lighter, more silent, and more harmonious. And your mind
    will begin to calm. Breathing, like meditation, is no less than an art. You have
    to be very artful handling your in-breath and out-breath, so that harmony can
    be reestablished in your body and your mind. Ifyou dominate your breath with violence,
    you cannot MINDFUL BREATHING 179 2S 1S R 1L 2L


    create harmony and peace in your body or in your con- sciousness. Once your breathing
    has become calmer and deeper, you can continue breathing like this in order to
    em- brace different parts ofyour body. While lying down, practice mindful breathing
    and gen- erate the energy of mindfulness. Scan your body with the loving beam
    ofmindfulness from the top ofyour head until you arrive at the soles ofyour feet.
    It may take halfan hour. This is the best way ofshowing your concern, your love,
    your attention to your body. Each ofus should be able to do this at least once
    a day. You can arrange your schedule so that every day, maybe be- fore going to
    sleep, the whole family can lie down comfort- ably on the floor and practice total
    relaxation for twenty or thirty minutes. Turn offthe television and invite everyone
    to come and participate. In the beginning you might like to use a tape to guide
    the whole family in practicing total relax- ation. Later, one ofyou can lead the
    practice, helping every- one calm and care for their bodies. You Can Make It Through
    the Storm There are several simple methods for taking care of our strong emotions.
    One is “belly breathing,”breathing from THICH NHAT HANH 180 2S 1S R 1L 2L


    the abdomen. When we are caught in a strong emotion like fear or anger, our practice
    is to bring our attention down to the abdomen. To stay on the level ofthe intellect
    is danger- ous. Strong emotions are like a storm, and to stand in the middle ofa
    storm is very dangerous. Yet that is what most of us do when we stay in our minds,
    letting our feelings over- whelm us. Instead, we have to get rooted by bringing
    our at- tention downward. We focus on our abdomen and practice mindful breathing,
    just giving all ofour attention to its rise and fall. We can do this either sitting
    or lying down. When you look at a tree in a storm, you see that the top of the
    tree is very unstable and vulnerable. The wind can break the smaller branches
    at any time. But when you look down to the trunk of the tree, you have a different
    impres- sion. You see that the tree is very solid and still, and you know that
    it will be able to withstand the storm. We are also like a tree. Our head is like
    the top ofthe tree during a tem- pest ofa strong emotion, so we have to bring
    our attention down to the level ofour navel. We begin to practice mindful breathing.
    We concentrate just on our breathing and on the rise and fall ofour abdomen. It
    is a very important practice because it helps us to see that, although an emotion
    may be very strong, it will stay only for a while and then go; it can- not last
    forever. Ifyou train yourselfto practice like this dur- ing difficult times, you
    will survive these storms. MINDFUL BREATHING 181 2S 1S R 1L 2L


    You have to be aware that your emotion is just an emo- tion. It comes, stays for
    some time, and then goes away. Why should someone die because of an emotion? You
    are more than your emotions. It is important to remember this. Dur- ing a crisis,
    when you breathe in and out, maintain the aware- ness that your emotion will go
    away if you continue to practice. After you have succeeded a few times, you will
    have confidence in yourself and in the practice. Let us not get caught by our
    thoughts and feelings. Let us bring our atten- tion down to our belly and breathe
    in and out. This storm will go away, so don’t be afraid. Recognizing and Embracing
    Mental Formations We embrace our bodies with mindfulness in order to calm them.
    We can do the same with mental formations: “Breath- ing in, I am aware ofmy mental
    formations. Breathing out, I am aware ofmy mental formations.”In Buddhist psychology
    there are fifty-one mental formations. There are negative men- tal formations,
    like anger, craving, and jealousy, and there are positive mental formations, like
    mindfulness and equanimity. When we experience a positive mental formation like
    joy or compassion, we should breathe in and out in order to be THICH NHAT HANH
