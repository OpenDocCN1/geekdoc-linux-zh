    # 选择性浇水


    你必须通过练习选择性浇水来保护你自己和你爱的人。你说：“亲爱的，如果你真的在乎我，真的爱我，请不要每天都浇灌我身上的负面种子。如果你这样做，我会非常不开心；如果我不开心，我也会让你不开心。所以，请、请不要浇灌我心中愤怒、不宽容、烦躁或绝望的种子。我承诺不去浇灌你身上的种子。我知道你也有负面种子，我会非常小心地不浇灌你的这些种子，因为我知道如果我这样做，你会非常不开心。那样我也会遭受痛苦。我发誓只浇灌你体内的积极种子——爱、慈悲和理解的种子。”


    在灵山，我们把这称为选择性浇水的练习。如果你很容易生气，是因为你愤怒的种子多年来被频繁地浇灌了。你允许了它被浇灌。你没有与周围的人签署合同，同意只浇灌好种子。你没有练习过保护自己。如果你不保护自己，你就无法保护你爱的人。


    当我们拥抱愤怒并好好照顾愤怒时，我们就能获得解脱。我们可以深入观察它，获得许多洞见。第一个洞见可能是：我们体内的愤怒种子生长得太大了，它是我们痛苦的根源。当我们开始看到这个事实时，我们意识到对方只是次要原因。对方并不是我们愤怒的主因。如果我们继续深入观察，会发现对方也承受着巨大的痛苦。一个深受痛苦的人总是会让周围的人也跟着痛苦。他不知道如何管理自己的痛苦，不知道如何拥抱并转化它。所以，他的痛苦每天都在增长。


    在过去，我们没有帮助他。我们没有练习选择性浇水。如果我们每天都浇灌他体内的积极种子，他就不会变成现在的样子。选择性浇水的练习非常有效。仅仅是一小时的练习就能产生巨大的变化。浇灌一小时对方心中的花朵，就能让他或她开始绽放。这并不难。


    # 浇花


    几年前，有一对来自波尔多的夫妇来到灵山参加法会。当时我们正在庆祝佛诞，我正在做一个关于选择性浇水、浇花的法讲座。我注意到妻子在法会期间默默地流泪。此后，我走向丈夫说：“你的花需要浇水了。”


    他立刻理解了我的意思，在回家的路上，他开始浇灌妻子的积极种子。路程只花了一个小时十分钟。当他们回到家时，孩子们看到母亲神清气爽感到非常惊讶，因为她已经很久没有那样了。她体内有很多奇妙的种子，但她的丈夫没有发现它们。他没有浇灌它们。他只浇灌了她的负面种子，因为他没有练习。


    并不是他不能浇灌她体内的积极种子。他完全有能力浇花，但他需要来到灵山来提醒他这项练习。他需要老师来督促他这样做。这就是为什么拥有一个实践团体是如此重要。你需要僧团（sangha），你需要兄弟、姐妹或朋友来提醒你已经知道的事情。法在你体内，但它也需要被浇灌才能显现并变成现实。如果你真的练习过浇灌爱人的积极种子，那么他或她今天就不会带给你这么多痛苦。所以，你对自己的痛苦负有部分责任。


    # 回去帮助


    在周五的预约之前，请练习深入观察，以识别你在冲突中所占的角色。不要把一切都归咎于对方。首先要承认你痛苦的主因是你体内的愤怒种子，而对方只是次要原因。当你开始理解自己在冲突中的角色时，你会感到更加解脱。因为你有能力进行正念呼吸、拥抱你的愤怒并释放负能量，在练习十五分钟后，你会感觉好得多。


    但对方可能仍在地狱中。她可能仍在承受着巨大的痛苦。你爱的人是你的花，你对她负责。你已经发誓要照顾她。你知道你对她现在的样子也负有部分责任，因为你没有练习，你没有照顾你的花。你对她产生了慈悲，突然被想要回去帮助她的欲望所触动。对方可能是对你非常重要的人。如果你不帮助，谁来帮助？当你产生想要回去帮助对方的欲望一刻，你就知道所有的愤怒能量都转化成了慈悲的能量。你的练习结出了果实。肥、垃圾已经转化回了花。这可能需要十五分钟、半小时或一小时。


    # 你确定你是的吗？


    曾有一个男人不得不离开家很一段时间。在他离开之前，妻子怀孕了，但他并。当他回来时，妻子已经生了一个孩子。他怀疑那个小男孩不是他的，认为那是以前为家里工作过的邻居的儿子。他怀疑地看着那个男孩。他恨他。他在男孩的脸上看到了邻居的脸。有一天，男人的兄弟第一次来访。当他看到那个男孩时，他对父亲说：“他长得真像你。完全一模一样。”


    兄弟的到来是一件乐事，因为这帮助父亲消除了错误的认知。但这种错误的认知控制了这个男人十二的人生。它让父亲深陷痛苦，让他的妻子深陷痛苦，当然，那个男孩也遭受了这种恨。我们总是根据错误的认知行动。我们不应该对自己的任何认知感到确定。当你看着美丽的日落时，你可能很确定你看到的是此时此刻的太阳，但科学家会告诉你，你看到的太阳影像是八分钟前的太阳影像。阳光从那么遥远的距离到达地球需要八分钟。同样，当你看到一颗恒星时，你认为星星在那里，但那颗星星可能在一、二或一万年前就已经消失了。我们必须非常小心自己的认知，否则我们会遭受痛苦。在纸上写下“你确定吗？”并挂在房间里非常有帮助。在诊所和医院里，他们开始挂上这些告示牌：“即使你确定，也再检查一遍。”这是一个因。


