    你全身的细胞都在与你一起欢快地微笑。为你全身所有的细胞充满感谢。感受腹部轻柔的起伏。如果你正在引导他人，并且如果你觉得这样做这样做，现在可以唱几首放松的歌曲或摇篮曲。最后，缓慢地伸展并睁开眼睛。慢慢起来，从容而轻盈。练习将你此时此刻所产生的平静和正念能量带到下一次活动中，并贯穿整天。


    # 附录 D


    ## 一行 (Thich Nhat Hanh)


    一行在非凡的时代度过了非凡的人生。从十六岁起，他就是一名佛教僧侣、和平活动人士和道法的追求者。他历经了迫害、三场战争以及三十多年的流亡。他是越南一座寺庙的导师，该寺庙的传承可溯到两千多年前，实际上可以追溯到佛陀本人。一行老师是一位百余部诗歌、小说和哲学著作的作者，他创立了大学和社会服务机构，并营救了难民；他曾在巴黎和平会议期间担任越南佛教代表团团，并被马丁·路德·金牧师提名角诺贝尔和平奖。他居住在法国和佛蒙特州。


    ## 修持社区


    一行在法国西南部（梅花村）、佛蒙特州（绿山法中心）和加利福尼亚州（鹿园公园）设有修持社区，僧侣、尼师、在家士和在家女在此练习正念生活的艺术。欢迎游客至少参加一周的学习。


    欲了解信息，请致信：

    - `Plum Village`: 13 Martineau 33580 Dieulivol France

