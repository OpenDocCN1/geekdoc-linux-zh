    and learn ways to work for the well-being of people, animals, plants, and minerals.
    I vow to practice generosity by sharing my time, energy, and material resources
    with those who are in real need. I am determined not to steal and not to possess
    anything that should belong to others. I will respect the property of others,
    but I will prevent others from profiting from human suffering or the suffering
    of other species on earth.


    ### The Third Mindfulness Training: Sexual Responsibility

    Aware the suffering caused by sexual misconduct, I vow to cultivate responsibility
    and learn ways to protect the safety and integrity of individuals, couples, families,
    and society. I am determined not to engage in sexual relations without love and
    a long-term commitment. To preserve the happiness of myself and others, I am determined
    to respect my commitments and the commitments of others. I will do everything
    in my power to protect children from sexual abuse and to protect couples and families
    from being broken by sexual misconduct.


    ### The Fourth Mindfulness Training: Deep Listening and Loving Speech

    Aware of the suffering caused by unmindful speech and the inability to listen
    to others, I vow to cultivate loving speech and deep listening in order to bring
    joy and happiness to others and relieve others of their suffering. Knowing that
    words can create happiness or suffering, I vow to learn to speak truthfully with
    words that inspire self-confidence, joy, and hope. I am determined not to spread
    news that I do not know to be certain and not to criticize or condemn things of
    which I am not sure. I will refrain from uttering words that can cause division
    or discord, or that can cause the family or the community to break. I will make
    all efforts to reconcile and resolve all conflicts, however small.


    ### The Fifth Mindfulness Training: Mindful Consumption

    Aware of the suffering caused by unmindful consumption, I vow to cultivate good
    health, both physical and mental, for myself, my family, and my society by practicing
    mindful eating, drinking, and consuming. I vow to ingest only items that preserve
    peace, well-being, and joy in my body, in my consciousness, and in the collective
    body and consciousness of my family and society. I am determined not to use alcohol
    or any other intoxicant or to ingest food or other items that contain toxins,
    such as certain TV programs, magazines, books, films, and conversations. I am
    aware that to damage my body or my consciousness with these poisons is to betray
    my ancestors, my parents, my society, and future generations. I will work to transform
    violence, fear, anger, and confusion in myself and in society by practicing a
    diet for myself and for society. I understand that a proper diet is crucial for
    self-transformation and for the transformation of society.


    ## APPENDIX C: GUIDED MEDITATIONS FOR LOOKING DEEPLY AND RELEASING ANGER


    You may find these guided meditations helpful in practicing the teachings you
    have received on transforming anger. You can guide yourself through them silently
    or invite someone else to guide the meditations, reading the exercises out loud.
    Begin with “Breathing in, I know I am breathing in. Breathing out, I know I am
    breathing out.” Followed by the key words “In, out.” You should always start with
    a few moments of mindful breathing to calm your mind. Use the first key word to
    accompany the in-breath, and the second key word to accompany the out-breath.
    Repeat these key words silently with your in- and out-breath in order to really
    touch the meaning of the meditation. Avoid saying the words mechanically; instead
    experience and feel them concretely. Allow eight to ten in- and out-breaths for
    each exercise, keeping the key words alive during each in- and out-breath.


    #### Looking Deeply at Anger

    1. Contemplating a person in anger, I breathe in. `Angry person` Seeing the suffering
    of that person, I breathe out. `Suffering`

    2. Contemplating the damage from anger to self and others, I breathe in. `Anger
    harms self` Seeing that anger burns and others destroys happiness, I breathe out.
    `Destroys happiness`

    3. Seeing anger’s roots in my body, I breathe in. `Anger’s roots in` Seeing anger’s
    roots in my body consciousness, I breathe out. `Anger’s roots in consciousness`

    4. Seeing the roots of anger in wrong perceptions and ignorance, breathe in. `Anger’s
    roots in` Smiling to my wrong wrong perceptions perceptions and ignorance, I and
    ignorance breathe out out. `Smiling`

    5. Seeing the angry person suffer, I breathe in. `Angry person suffers` Feeling
    compassion for the angry person who suffers, I breathe out. `Feeling compassion`

    6. Seeing the unfavorable environment and unhappiness of the angry person, I breathe
    in. `Angry person` Understanding the causes of unhappy unhappiness, I breathe
