    Anger comes up, you want to open a door and turn on the fan, so the anger will
    go out. So you ventilate by hitting a stone or a tree with a stick, or by pounding
    on your pillow. I have seen many people practice like that. Actually, they do
    get some temporary relief. But, the side effects of venting are very harmful.
    They will make you suffer much more. Anger needs energy to manifest. When you
    try to vent it by using all your might to hit something or pound your pillow,
    half an hour later, you will be exhausted. Because you are exhausted, you will
    have no energy left to feed your anger. You may think that anger is no longer
    there, but that’s not true; you are simply too tired to be angry.


    It is the roots of anger in you that produce anger. The roots of anger lie in
    ignorance, wrong perceptions, in the lack of understanding and compassion. When
    you vent your anger, you simply open the energy that is feeding your anger. The
    roots of anger are always there, and by expressing anger like that, you are strengthening
    the roots of anger in yourself. That is the danger of venting.


    There was an article in `The New York Times`, March 9, 1999, on anger, titled
    “Letting Out Aggression Is Called Bad Advice.” According to this article, a lot
    of research has been done by social psychologists, and they concluded that trying
    to express your anger and your aggression by hitting a pillow and the like won’t
    help at all. In fact, it will make the situation worse. While you pound the pillow,
    you are not calming or reducing your anger—you are rehearsing it. If you practice
    hitting a pillow every day, then the seed of anger in you will grow every day.
    And someday, when you meet the person who made you angry, you may practice what
    you have learned. You will just hit the other person and end up in jail. That
    is why handling your aggression by hitting a pillow, or venting, is not helpful
    at all. It is dangerous. It is not truly ventilating the energy of anger since
    anger is not getting out of your system.


    Venting your anger is a practice based on ignorance. When you imagine the object
    of your hate as a pillow, hitting the object of your hate, you rehearse your ignorance
    and anger. Instead of lessening your violence and anger, you become more violent
    and angry. A number of therapists have confirmed that the practice of venting
    anger is dangerous. They told me that they stopped advising their clients to do
    it. After their clients vent by hitting pillows, they are tired, and so they think
    they feel better. But after they rest and have some food, if someone comes and
    waters the seed of anger in them, they become even angrier than before. They have
    fed the roots of their anger by rehearsing it.


    ## When Mindfulness Is There, You Are Safe


    We have to be there for our anger, we have to recognize its presence and take
    good care of it. In psychotherapy this is called “getting in touch with our anger.”
    It is wonderful and very important. You have to recognize and embrace anger when
    it manifests instead of suppressing it. But the important question here is who
    is the one getting in touch with, taking care of, and recognizing anger? Anger
    is an energy, and if that energy is overwhelming, you can be a victim of it. You
    should be able to generate another kind of energy that can recognize and take
    care of the anger. Anger is a zone of energy that needs to be touched, that needs
    to be recognized.


    The question is, what is touching what? What energy can do the touching and the
    recognizing? It is the energy of mindfulness. So every time we get angry, we practice
    mindful breathing and mindful walking, in order to touch the seed of mindfulness
    and generate the energy of mindfulness in us. Mindfulness is not there to suppress.
    Mindfulness is there to welcome, to recognize: “Hello, my little anger, I know
    you are there. My old friend.” Mindfulness is the energy that helps us to be aware
    of what is there.


    To be mindful is always to be mindful of something. You may be mindful of your
    inhale, or out-breath, and that is mindfulness of breathing. You may be mindful
    of the tea you are drinking, and that is mindfulness of drinking. When you eat
    mindfully, that is mindfulness of eating. When you walk mindfully, it is mindfulness
    of walking. In this case, we practice mindfulness of anger. “I’m aware that I’m
    angry, and I’m aware that anger is in me.”


    So, mindfulness is touching, recognizing, greeting, and embracing. It does not
    fight or suppress. The role of mindfulness is like the role of a mother, embracing
    and soothing the suffering child. Anger is in you; anger is your baby, your child.
    You have to take very good care of it. When it recognizes anger, mindfulness says,
    “Hello there, my anger, I know you are there. I will take good care of you, don’t
    worry.” The moment mindfulness is there, you are safe, you can smile, because
    the energy of the Buddha is born in you.


    If you don’t know how to handle your anger, it can kill you. Without mindfulness,
    you may become the victim of anger. It can make you vomit blood and even die.
    Many people die because of anger—it is a shock to your whole system. Without mindfulness,
    you become a victim of anger because it pushes you to do harmful things. When
    the Buddha is present, you are protected. When the mother is there, is safe. We
    do this continuously by mindfulwalking and breathing. When we recognizing and
    embracing anger, we must do this by mindfulwalking and breathing. If you don''t
    have mindfulness, you will bring yourelief, even if you hitapillowwithallyourmight.
    Hittingapillow doesn''t helpyou getintouchyouranger. If you were intouchthepillow,
    thenyouwould know itonlyapillow, and notyou. Why do you hit the pillow like that?
    Because you don’t know it is just a pillow. When you really get in touch with
    something, then you will know its true nature. If mindfulness is not there, getting
    in touch someone is not possible.


    ## You Are the Object of Your Anger


    Who do you think you are? You are the other person. If you get angry with your
    son, you are getting angry with yourself. You are wrong to think that your son
    is not you. Your son is you. Genetically, physiologically, scientifically, your
    son is your continuation. That is the real truth. Who is your mother? Your mother
    is you. You are her continuation as a descendant, and she is your continuation
    as an ancestor. She links you to all who came before, and you link her to all
    the future generations. You belong to the same stream of life. To think that she
    is a different entity, to think that you can have nothing to do with her is sheer
    ignorance. When a young man says, “I no longer want to have anything to do with
    my father,” that is sheer ignorance, because the young man is nothing but his
    father. As a mother, pregnant with your child, you had this insight, that your
    child is you. You ate for your baby, you drank for your baby, you took care of
    your baby. When you took care of yourself, you took care of your baby. You were
    very careful, because you knew that the baby was you. But by the time your child
    reaches the age of thirteen or fourteen, you begin to lose this insight. You and
    your child feel separated, less connected. You don’t know how to improve your
    relationship, to make peace after a fight. Soon, the gap between the two of you
    grows bigger and more solid. Your relationship becomes very difficult and full
    of conflict.

