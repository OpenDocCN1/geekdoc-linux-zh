- fmt: "\nThe wounded child inside of us. The wounded child in us is here in the present\
    \ moment. And we can heal him or her right now. “My dear little wounded child,\
    \ I’m here for you, ready to listen to you. Please tell me all your suffering,\
    \ all your pain. I am here, really listening.”\n\nAnd if you know how to go back\
    \ to her, to him, and listen like that every day for five or ten minutes, healing\
    \ will take place. When you climb a beautiful mountain, invite your little child\
    \ within to climb with you. When you contemplate the beautiful sunset, invite\
    \ him or her to enjoy it with you. If you do that for a few weeks or a few months,\
    \ the wounded child in you will be healed.\n\nMindfulness is the energy that can\
    \ help us do this.\n\n## Becoming a Free Person\n\nOne minute of practice is one\
    \ minute of generating the energy of mindfulness. It doesn’t come from outside\
    \ of you; it comes from within. The energy of mindfulness is the kind of energy\
    \ that helps us to be here, to be fully present in the here and the now.\n\nWhen\
    \ you drink tea in mindfulness, your body and your mind are perfectly united.\
    \ You are real, and the tea you drink also becomes real. When you sit in a café,\
    \ with a lot of music in the background and a lot of projects in your head, you’re\
    \ not really drinking your coffee or your tea. You’re drinking your projects,\
    \ you’re drinking your worries. You are not real, and the coffee is not real either.\
    \ Your tea or your coffee can only reveal itself to you as a reality when you\
    \ go back to your self, and produce your true presence, freeing yourself from\
    \ the past, the future, and from your worries.\n\nWhen you are real, the tea also\
    \ becomes real and the encounter between you and the tea is real. This is genuine\
    \ tea drinking. You can organize a tea meditation to provide an opportunity for\
