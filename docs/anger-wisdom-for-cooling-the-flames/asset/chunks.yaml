    我们的愤怒。我们不能说：“愤怒离开吧，你必须离开。我不想要你。”当你胃疼时，你不会说：“我不想要你的胃，离开吧。”不，你会照顾好它。同样，我们必须拥抱并照顾好我们的愤怒。我们要按照它的样子承认它，拥抱它，并微笑。帮助我们做到这些事情的能量是正念，正念行走和正念呼吸。


    # 幸福不是一个人的事


    这并不意味着你要隐藏自己的愤怒。你必须让对方知道你正在生气，你正在遭受痛苦。这非常重要。当你对某人生气，请不要假装没生气。不要假装自己不痛苦。如果对方对你来说很重要，那么你就必须承认你生气了，你正在遭受痛苦。用平静的方式告诉他或她。在真爱中没有自傲。你不能假装自己不痛苦，不能假装不生气。这种否定是基于自傲的。“生气？我？我为什么要生气？我很好好的。”


    但事实上，你并不好。你正处在地狱之中。愤怒正在焚毁你，你必须告诉你的伴侣、你的儿子或你的女儿。我们的倾向是说：“我不需要你也能快乐！我可以自己过！”这是对我们最初分享一切的誓言的背叛。在开始时，你们互相说：“没有你我活不下去。我的快乐取决于你。”你们做过那宣言。但当你生气时，你说出了相反的话：“我不需要你！别离我远点！别碰我！”


    你宁愿躲进房间关上门。你尽力证明你不需要对方。这是一个非常人性化、非常普通的倾向。但这不是智慧。幸福不是一个人的事。如果你们中有一个不快乐，另一个人就不可能快乐。


    ## 1. “亲爱的，我生气了。我很痛苦。”


    说“亲爱的，我爱你”是好的，这很重要。我们与爱的人分享喜悦和良好的感受是自然的。但当你遭受痛苦、当你对他或她生气时，你也必须让对方知道。你必须表达你的感受。你有这个权利。这是真爱。“亲爱的，我对你生气了。我很痛苦。”


    尽力平静地说出来。你的声音里可能有些忧伤，这没关系。只要不要说惩罚或指责的话。“亲爱的，我生气了。我很痛苦，我需要你知道这一点。”这是爱的语言，因为你们曾誓言要互相支持，作为伴侣，或作为夫妻。父子、母女也是一对，所以即使对方是你的孩子或父母，你也必须说出来。


    你有责任在你痛苦时告诉他或她。当你快乐时，与她（或他）分享你的快乐。当你痛苦时，告诉你的爱人你的痛苦。即使你认为你的愤怒是由他或她造成的，你仍然必须遵守承诺。平静地告诉他或她。使用充满爱的语言。这是唯一的条件。


    你必须尽快这样做。你不应该把你的愤怒和痛苦留存在心里超过二十四小时。否则，它就会变得过分。它会毒害你。这将证明你对他或对她的爱、信任非常脆弱。所以你必须尽快告诉他或她你的痛苦和愤怒。二十四小时是最后期限。


    你可能觉得你无法立即告诉他或她，因为你还没有冷静。你仍然很生气。所以请练习正念呼吸和在户外行走。当你感到冷静并准备好分享时，再开口。但如果截止日期临近，而你还没有冷静，那么你就得把它写下来。写一封和平信（Peace
    Note），一条和平信息。把信交给她，并确保她在二十四小时过去之前收到。这非常重要。你们每一个人都必须承诺，当你们互相生气时要这样做。否则，你们没有尊重你们的和平条约的条款。


    ## 2. “我正在尽力。”


    如果你致力于改变现状，你可以更进一步。当你让对方知道你正在痛苦时，你可以再加一句话。你可以加上：“我正在尽力。”这意味着你克制自己因愤怒发泄。这意味着你正在练习正念呼吸和正念行走，以便用正念来拥抱你的愤怒。你正在根据教导进行练习。除非练习，否则不要说“我正在尽力”。


    当你生气时，你知道如何练习，所以你有权说“我正在尽力”。这将激发对方的信心和尊重。“我正在尽力”意味着你正履行你回到内心并照顾好你愤怒的承诺。当你生气时，你的愤怒就是你的宝宝，你必须照顾它。这就像你的胃不舒服，你需要对方来帮助你。


    ## 3. “请帮助我。”


    第三句话顺理成章：“请帮助我。亲爱的，我需要你的帮助。”这是爱的语言。当你对对方生气时，你倾向于说相反的话——“别碰我！我不需要你。没有你我也能处理得很好！”但你们已经承诺要互相照顾。所以当你感到痛苦时，尽管你知道如何练习，你仍然需要对方帮助你进行练习。“亲爱的，我需要你的帮助。请一定要帮助我。”


    如果你能够写下或说出这三句话，你就拥有真爱的能力。你正在使用真诚的语言。“亲爱的，我很痛苦，我想让你知道。亲爱的，我正在尽力。我正努力不指责任何人，包括你。既然我们如此亲近，既然我们已经对彼此做过承诺，我觉得需要你的支持和帮助才能摆脱这种痛苦、愤怒的状态。”


    # 共同转化愤怒


    如果我是对方，而你和我分享了这三句话，我会看到你对我非常忠诚，你对我真的有真爱。不仅是在你快乐时分享快乐，而且在你痛苦时，你也分享你的痛苦。

