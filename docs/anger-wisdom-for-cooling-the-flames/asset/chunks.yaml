    给自己留出需要的时间。正念呼吸和户外正念行走是拥抱愤怒的极佳方式。即使是跑步也很有帮助。就像煮土豆一样，你至少需要保持火燃烧十五或二十分钟。你不能吃生土豆。你必须在正念的火炉上“烹饪”你的愤怒。这可能需要十分或二十分，也可能更久。


    ### 赢得胜利

    在煮土豆时，你必须盖上锅盖以防止热量流失。这就是专注。因此，当你通过行走或呼吸来照顾你的愤怒时，不要做其他事情。不要听收音机，不要看电视，不要读书。盖好锅盖，只做一件事。只练习深度行走冥想、深度正念呼吸，投入你百分之百的精力来拥抱你的愤怒，就像好好照顾婴儿一样。


    在一段时间的拥抱和深度观察后，洞察力将会产生，你的愤怒也会消减。你会感觉好得多，并产生动力回去帮助那个人。当你打开锅盖时，土豆会发出宜人的香气。你的愤怒已经转化成了慈悲的能量。


    这是可能的。就像郁金香一样。当太阳能量足够强大时，郁金香必须绽放，向太阳展示她的内心。你的愤怒是一种花。你必须用正念的阳光去拥抱它。让正念的能量渗透进愤怒的能量中。经过五或十分的正念，你的愤怒将发生转化。每一个心理形成——愤怒、嫉妒、绝望等——对正念都很敏感，就像所有植物对阳光敏感一样。


    通过培养正念的能量，你可以治愈你的身体和意识，因为正念是佛的能量。在基督教中，据说耶稣体内拥有上帝、圣灵的能量。这就是他能够治愈许多人的原因。他的治愈能量被称为圣灵。在佛教语言中，那种能量是佛的能量，正念的能量。正念包含了专注、理解和慈悲的能量。


    因此，佛教冥想的练习是产生提供我们专注、慈悲、理解、爱和幸福能量的练习。修行中心每个人都在这样做，因此我们共同提供了一个强大的集体能量场，拥抱并保护我们以及与我们在一起的人。即使只经过一次练习，我们也能发现自己非常有能力照顾自己的愤怒。我们为自己和爱的人赢得了一场胜利。当我们失败时，我们和爱的人也失败了。但当我们胜利时，我们也为那个人赢得了胜利。所以，即使对方不知道这种练习，我们也可以为自己和他她练习。不要等对方开始练习才开始练习。你可以为你们两个人这样做。


    可能曾有过一段时期，你无法与父母沟通。尽管你们住在同一个房子里，但你可能觉得父亲或母亲非常疏远。在这种情况下，父母和孩子都在受苦。双方都认为只有误解、仇恨和分离。父母和孩子并不知道他们有很多共同点。他们不知道彼此都拥有理解、原谅和爱彼此的能力。因此，识别我们心中一直存在的积极元素非常重要，这能防止愤怒和其他负面元素主宰我们。


    ### 五种慈悲的沟通


    #### 云层后的阳光

    当下雨雨时，我们认为没有阳光。但如果我们乘飞机飞得高高的，穿过云层，我们就会重新发现阳光。我们看到阳光一直都在。在愤怒或绝望的时刻，我们的爱也在这里。我们沟通、原谅、慈悲的能力依然在那里。你必须相信这一点。我们不仅仅是愤怒，我们不仅仅是痛苦。我们必须意识到，我们内心确实拥有爱、理解和慈悲的能力。


    如果你知道这一点，那么下雨时你就不会绝望。你知道雨在那里，但阳光依然在某处。很快雨就会停，太阳会再次升起。要有希望。如果你能提醒自己，积极元素仍然存在于你和对方心中，你就会知道突破是可能的，这样双方最美好的东西就能再次出来并显现。


    练习正是为了此。练习将帮助你触碰阳光，触碰佛，触碰你内在的善意，使你能改变局面。你可以给这种善意任何你想要的称呼，只要是你自己的精神传统中熟悉的即可。在内心深处，你必须知道你有能力保持和平。建立起佛能量在你体内的信念。你唯一需要做的就是寻求它的助。。你可以通过练习正念呼吸、正念行走和正念坐禅来实现。


    #### 训练我们深听

    沟通是一种练习。你必须熟练才能沟通。有善意是不够的。你必须学习如何去做。也许你已经失去了倾听的能力。也许对方说话时总是带着苦涩，总是谴责和指责，你已经受够了。你无法再倾听了。你开始尝试避开他。你不再有能力倾听那个人。你试图避开他，你不想再了。但这也会产生误解，让他觉得你鄙视他。这会给他带来很多痛苦。你给他留下的印象是你想要抵制他，无视他的存在。你无法面对他，同时又无法避开他。唯一的解决是训练自己能够再次沟通。深听是捷径。我们知道许多人正在痛苦，觉得没有人能理解他们或他们的处境。每个人都太忙，似乎没有人有倾听的能力。但我们所有人都需要一个能倾听我们的人。现在有许多练习心理治疗的人，他们本应该出现在那里，坐下来倾听你，好让你可以敞开心扉。他们必须深听才能成为真正的治疗师。真正的治疗师有全心倾听的能力，不带偏见，不带判断。我不知道治疗师是如何训练自己获得这种倾听能力的。治疗师也可能充满痛苦。在坐着倾听来访者时，他的痛苦种子可能会被浇灌。如果治疗师被自己的痛苦所淹没，他如何能正确倾听他人呢？


