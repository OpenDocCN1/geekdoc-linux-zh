    Our anger. We cannot say, “Go away anger, you have to go away. I don’t want you.”
    When you have a stomachache, you don’t say, “I don’t want you stomach, go away.”
    No, you take care of it. In the same way, we have to embrace and take good care
    of our anger. We recognize it as it is, embrace it, and smile. The energy that
    helps us do these things is mindfulness, mindfulness of walking and mindfulness
    of breathing.


    # Happiness Is Not an Individual Matter


    This does not mean that you have to hide your anger. You have to let the other
    person know that you are angry and that you suffer. This is very important. When
    you get angry with someone, please don’t pretend that you are not angry. Don’t
    pretend that you don’t suffer. If the other person is dear to you, then you have
    to confess that you are angry, and that you suffer. Tell him or her in a calm
    way. In true love, there is no pride. You cannot pretend that you don’t suffer.
    You cannot pretend that you are not angry. This kind of denial is based on pride.
    “Angry? Me? Why should I be angry? I’m okay.”


    But, in fact, you are not okay. You are in hell. Anger is burning you up, and
    you must tell your partner, your son, your daughter. Our tendency is to say, “I
    don’t need you to be happy! I can be on my own!” This is a betrayal of our initial
    vow to share everything. In the beginning you told each other, “I cannot live
    without you. My happiness depends on you.” You made declarations like that. But
    when you are angry, you say the opposite: “I don’t need you! Don’t come near me!
    Don’t touch me!”


    You prefer to go into your room and lock the door. You try your best to demonstrate
    that you don’t need the other person. This is a very human, very ordinary tendency.
    But this is not wisdom. Happiness is not an individual matter. If one of you is
    not happy, it will be impossible for the other person to be happy.


    ## 1. “DARLING, I AM ANGRY. I SUFFER.”


    To say, “Darling, I love you,” is good, it is important. It is natural that we
    share our joy and good feelings with our beloved one. But you also have to let
    the other person know when you suffer, when you are angry with him or her. You
    have to express what you feel. You have the right. This is true love. “Darling,
    I am angry at you. I suffer.”


    Try your best to say it peacefully. There may be some sadness in your voice, that’s
    fine. Just don’t say something to punish or to blame. “Darling, I am angry. I
    suffer, and I need you to know it.” This is the language of love, because you
    have vowed to support each other, as partners, or as husband and wife. Father
    and son, mother and daughter are also a couple, so even if the other person is
    your child or your parent, you must still speak out.


    You have the duty to tell him or her when you suffer. When you are happy, share
    your happiness, with her, with him. When you suffer, tell your beloved one about
    your suffering. Even if you think your anger was created by him or her, you still
    have to keep your commitment. Tell him or her calmly. Use loving speech. This
    is the only condition.


    You must do this as soon as possible. You should not keep your anger, your suffering
    to yourself for more than twenty-four hours. Otherwise, it becomes too much. It
    can poison you. This would prove that your love, your trust for him or her is
    very weak. So you have to tell him or her about your suffering, your anger as
    soon as you can. Twenty-four hours is the deadline.


    You may feel you are not capable of telling him or her right away because you
    are not yet calm. You are still very angry. So practice mindful breathing and
    walking outdoors. Then when you feel calm and ready to share, you speak. But if
    the deadline comes close, and you are not yet calm, then you have to write it
    down. Write a Peace Note, a peace message. Deliver the letter to her and make
    sure she gets it before twenty-four hours have passed. This is very important.
    Each of you has to make the promise to act in this way when you get angry at each
    other. Otherwise you are not respecting the terms of your peace treaty.


    ## 2. “I AM DOING MY BEST.”


    If you are committed to changing things, you can go further. You can add another
    sentence when you let the other person know that you suffer. You can add, “I’m
    doing my best.” This means you refrain from acting out of anger. It means that
    you are practicing mindful breathing and mindful walking in order to embrace your
    anger with mindfulness. You are practicing according to the teaching. Don’t say,
    “I am doing my best” unless you practice.


    When you are angry, you know how to practice, so you have the right to say, “I
    am doing my best.” That will inspire confidence and respect in the other person.
    “I am doing my best” means you are living up to your commitment to go home to
    yourself and take good care of your anger. When you are angry, your anger is your
    baby and you have to look after it. It is like your stomach is upset, you need
    the other person to help you.


    ## 3. “PLEASE HELP ME.”


    The third sentence follows naturally, “Please help me. Darling, I need your help.”
    That is the language of love. When you get angry with the other person, you have
    the tendency to say the opposite—“Don’t touch me! I don’t need you. I can manage
    very well without you!” But you have made the commitment to take good care of
    each other. So it’s very natural that when you suffer, although you know how to
    practice, you still need the other person to help you in your practice. “Darling,
    I need your help. Please do help me.”


    If you are capable of writing or saying these three sentences, you are capable
    of true love. You are using the authentic language of love. “Darling, I suffer,
    and I want you to know it. Darling, I am doing my best. I’m trying not to blame
    anyone else, including you. Since we are so close to each other, since we have
    made a commitment to each other, I feel that I need your support and your help
    to get out of this state of suffering, anger.”


    # Transforming Anger Together


    If I were the other person, and you shared these three sentences with me, I would
    see that you are very faithful to me, that you really have true love for me. Not
    only when you’re happy do you share your happiness, but when you suffer, you also
    share your suffering.

