    the decision-making will be- come easier, and we won’t have to suffer a lot. When
    a person wants to become a monastic, for instance, it is not an easy decision.
    Ifyour desire to be a monastic is less than one hundred percent, don’t become
    a monastic. It must be more than one hundred percent. When you feel that monastic
