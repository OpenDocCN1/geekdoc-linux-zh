    Care of yourself. On the one hand, you need to get the right nourishment every
    day. On the other hand, you need to practice nourishing compassion in yourself
    so that you can be well equipped for the task of listening. You have to play the
    role of a Great Being, someone who has so much happiness that she is able to rescue
    people from their suffering.


    ## You Are Your Children


    As a father or mother, you have to listen to your son or your daughter. This is
    very important because your son is yourself; your daughter is yourself. Your child
    is your continuation. The most important task for you is to restore communication
    between you and your child. If your heart does not function well, if your stomach
    is not in good health, you don’t think of cutting it out and throwing it away.
    You cannot say, “You are not my heart! My heart does not behave like that. You
    are not my stomach! My stomach does not behave like that. I will have nothing
    to do with you anymore!” This is not intelligent. You might talk to your son or
    your daughter like that, and this is not intelligent, either.


    The moment your son or daughter is conceived in your womb, you see yourself and
    the fetus as one. You may even begin to have a conversation with the baby, “Keep
    still my beloved one. I know you are there.” You speak to him or to her with love.
    You become aware of what you consume, because whatever you eat and drink, the
    baby also eats and drinks. Your worries and your joy are the worries and joy of
    your baby. You and the baby are one.


    When you give birth to the baby and the umbilical cord is cut, this awareness
    of your unity may begin to fade away. By the time your son or your daughter turns
    twelve or thirteen, you have completely forgotten that she or he is you. You think
    of him or her as a separate entity. You have problems with each other. Having
    a problem with your child is like having trouble with your stomach, your heart,
    your kidneys. If you believe that he is another person, a separate entity, you
    can say, “Go away! You are not my son! You are not my daughter! My son doesn’t
    behave like that. My daughter doesn’t behave like that.”


    But because you cannot say this to your stomach or to your heart, you cannot say
    it to your son or your daughter. The Buddha said, “There is no separate self.”
    You and your son, you and your daughter are just a continuation of many generations
    of ancestors. You are part of a long stream of life. Whatever your children do
    continues to affect you deeply—just like when they were in your womb. Whatever
    you do still affects your children deeply because they can never be cut off from
    you. Your happiness and suffering are your child’s happiness and suffering and
    vice versa.


    ## CompassASSionate Communication


    That is why you have to invest one hundred percent of yourself in the task of
    restoring communication.


    ### Starting a Dialogue


    Confusion and ignorance make us think that we are the only ones who suffer. We
    believe that our son or our daughter does not suffer. But in fact, whenever you
    suffer, your child also suffers. You are there in every cell of your son’s body,
    in every cell of your daughter’s body. Every emotion and every perception in your
    child, is your emotion and perception. Therefore we have to remember the insight
    that we had in the beginning that he and you, that she and you, are one.


    Start a dialogue with your son or your daughter. In the past you have made mistakes.
    You have caused your stomach to suffer. The way you have eaten and drunk, the
    way you have worried has had a big impact on your stomach, your intestines, your
    heart. You are responsible for your heart, your intestines, and your stomach.
    In very much the same way, you are responsible for your son and your daughter.
    You cannot say that you are not responsible.


    It would be much wiser to come to your child and say, “My dear child, I know you
    suffer a lot. For many years, you have suffered a lot. When you suffer, I suffer,
    too. How can I be happy when my child suffers? So I recognize that both you and
    I suffer. Can we come together and search for a solution? Can we talk? I really
    want to restore communication, but alone, I cannot do much. I need your help.”


    If, as a father or mother, you are capable of saying things like this to your
    child, the situation may change because you know how to use loving speech. Your
    language comes from love, from understanding, and from enlightenment. Enlightenment
    of the fact that you and your child are one, and that happiness and well-being
    are not an individual matter. These concern both of you. So what you say to your
    child has to come from your love and understanding, the understanding that there
    is no separate self. You can speak like this because you understand the true nature
    of both yourself and your child. You know that your daughter is the way she is
    because you are the way you are. You are interdependent. You are the way you are
    because your son is the way he is. You are not separate.


    Train yourself in the art of mindful living. Train yourself so that you can become
    skillful enough to restore communication. “My dear son, I know that you are me.
    You are my continuation, and when you suffer there is no way that I can be happy,
    so let us come together and sort things out. Please help me.”


    The son also can learn to speak this way because he understands that if his father
    suffers, he cannot be happy either. Through the practice of mindfulness, the son
    can touch the reality of no separate self and can learn to restore communication
    with his father. He may be the one who takes the initiative. The same thing can
    happen between partners. You have vowed to live as one. With deep sincerity you
    have vowed to share your happiness and suffering. Telling your partner that you
    need his or her help to begin anew is only a continuation of those vows. Every
    one of us has the capacity for talking and listening like this.


    ### Love Letters


    There is a French woman who kept old love letters from her husband. He wrote her
    beautiful letters before they married. Every time she got a letter from him, she
    savored every sentence—every word—it was so sweet, so understanding, so full of
    love. She was delighted whenever she got a letter, so she kept all his letters
    in a biscuit box. One morning, while she was rearranging her closet, she discovered
    the ancient biscuit box where she stored all his letters. It had been a long time
    since she had seen it. The box of letters told of the most wonderful time, when
    she and her husband were young.

