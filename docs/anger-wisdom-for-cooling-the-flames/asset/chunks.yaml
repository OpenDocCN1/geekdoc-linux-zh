- fmt: "\n# Compassion Is Intelligent\n\nUnderstanding and compassion are very powerful\
    \ sources of energy. They are the opposite of stupidity and passivity. \n\nIf\
    \ you think that compassion is passive, weak, or cowardly, then you don't know\
    \ what real understanding or compassion is. If you think that compassionate people\
    \ do not resist and challenge injustice, you are wrong. They are warriors, heroes,\
    \ and heroines who have gained many victories.\n\nWhen you act with compassion,\
    \ with non-violence, when you act on the basis of non-duality, you have to be\
    \ very strong. You no longer act out of anger, you do not punish or blame. Compassion\
    \ grows constantly inside of you, and you can succeed in your fight against injustice.\n\
    \nMahatma Gandhi was just one person. He did not have any bombs, any guns, or\
    \ any political party. He acted simply on the insight of non-duality, the strength\
    \ of compassion, not on the basis of anger. Human beings are not our enemy. Our\
    \ enemy is not the other person. Our enemy is the violence, ignorance, and injustice\
    \ in us and in the other person. When we are armed with compassion and understanding,\
    \ we fight not against other people, but against the tendency to invade, to dominate,\
    \ and to exploit.\n\nWe don’t want to kill others, but we will not let them dominate\
    \ and exploit us or other people. You have to protect yourself. You are not stupid.\
    \ You are very intelligent, and you have insight. Being compassionate does not\
    \ mean allowing other people to do violence to themselves or to you. Being compassionate\
    \ means being intelligent. Non-violent action that springs from love can only\
    \ be intelligent action. Being compassionate doesn’t mean suffering unnecessarily\
    \ or losing your common sense.\n\nSuppose you are leading a group of people doing\
    \ walking meditation, moving slowly and beautifully. The walking meditation generates\
    \ a lot of energy; it embraces everyone with calm, solidity, and peace. But suddenly\
    \ it begins to rain. Would you continue to walk slowly, letting yourself and everyone\
    \ else get soaked? That’s not intelligent. If you are a good leader of the walking\
    \ meditation, you will break into a jogging meditation. You still maintain the\
    \ joy of the walking meditation. You can laugh and smile, and thus you prove that\
    \ the practice is not stupid. You can also be mindful while running and avoid\
    \ getting soaked. \n\nWe have to practice in an intelligent way. Meditation is\
    \ not a stupid act. Meditation is not just blindly following whatever the person\
    \ next to you does. To meditate you have to be skillful and make good use of your\
    \ intelligence.\n\n## Building a Compassionate Police Force\n\nTo be kind does\
    \ not mean to be passive. To be compassionate does not mean to allow others to\
    \ walk all over you, to allow yourself to be destroyed. You have to protect yourself\
    \ and protect others.\n\nIf you need to lock someone up because he is dangerous,\
    \ then you have to do that. But you have to do it with compassion. Your motivation\
    \ is to prevent that person from continuing his course of destruction and from\
    \ feeding his anger. You don’t have to be a monk in order to be compassionate,\
    \ you can be a policeman. You can be a judge or a prison guard. But as a policeman,\
    \ a judge, or prison guard, we need you to be a Bodhisattva. We need you to be\
    \ beings of great compassion.\n\nAlthough you have to be very firm, you should\
    \ always keep compassion alive in you. And if you practice mindful living, you\
    \ have to help the policeman act out of compassion and non-fear. The police in\
    \ our time are full of fear, anger, and stress, because they have been assaulted\
    \ many times. Those who hate the police and insult them don’t understand the police\
    \ yet. In the morning, when the police put on their uniform and guns, they are\
    \ not sure that they will return home alive in the evening. The police suffer\
    \ very much. Their families suffer very much. They don’t enjoy beating people.\
    \ They don’t enjoy shooting people. But because they do not know how to handle\
    \ the blocks of fear, suffering, and violence in them, they also can become victims\
    \ of society like other people.\n\nSo, as a police chief, if you really understand\
    \ the minds and hearts of the people on your police force, you will train yourself\
    \ in such a way that compassion and understanding will be born in your heart.\
    \ Then you will be able to educate and help the policemen and women who have to\
    \ go out on the streets every morning, every night, to do the hard task of keeping\
    \ the city in peace.\n\nIn France the police are called “peace-keepers.” But if\
    \ you don’t have peace in you, how can you keep peace in the city? You have to\
    \ keep peace in yourself first. And peace here means non-fear, intelligence, and\
    \ insight. The police do learn a number of techniques in order to protect themselves,\
    \ but self-defense techniques are not enough. You have to be intelligent. You\
    \ have to act out of non-fear. If you are too fearful, then you will make many\
    \ mistakes. You will be tempted to use your gun, and you may kill many innocent\
    \ people.\n\n## We Cannot Take Sides\n\nIn Los Angeles, four policemen beat a\
    \ black driver nearly to death. The press talked about it all over the world,\
    \ and everyone wanted to take sides. You may have taken the side of the victim\
    \ of the beating, or of the policemen. When you judge and take sides, you act\
    \ as though you are outside of the conflict. You act as though you are not the\
    \ black driver who was beaten, or the four policemen. But looking deeply, you\
    \ see that you are the victim of the beating, and you are the four policemen.\
    \ Anger, frustration, and violence are in the person who was beaten and in those\
    \ who did the beating.\n\nTo understand the police and help them suffer less,\
    \ let us imagine that we are the husband or wife of a police officer. Living together,\
    \ you are in touch with how hard your spouse’s life is. So every morning and every\
    \ evening, you want to do something to help your spouse to transform his or her\
    \ anger, and frustration. When you are capable of helping your husband or wife\
    \ suffer less, then the whole city will profit— even the delinquent youth.\n\n\
    ## A Dialogue to End Anger and Violence\n\nThe image of police full of violence,\
    \ prejudice, and fear is not a positive image. So many young people see police\
    \ as their enemy. They want to burn police cars and beat up policemen, because\
    \ the police are the object of their anger, their frustration. We must organize\
    \ a meeting, a dialogue, between police and the youngsters who have committed\
    \ acts of violence, and who have been put in prison. Why don’t we organize this\
    \ kind of conversation and give the police a chance to speak about their frustration,\
    \ anger, and fear? And why don’t we allow these youngsters who fight with the\
    \ police to speak out about their frustration, anger, and fear? Why don’t we televise\
    \ these dialogues so that a whole nation can learn from it? This would be true\
    \ meditation: looking deeply, not as an individual, but as a city, as a nation.\
    \ We have not seen the truth. We have seen a lot of movies, detective stories,\
    \ and Westerns, but we have not seen the truth that is in the hearts and minds\
    \ of real people.\n\n## Bombing Ourselves\n\n“God, please forgive them, because\
    \ they do not know what they are doing,” said Christ. When someone commits a crime\
    \ and makes others suffer, it is because he does not know what he is doing. Many\
    \ young people commit crimes, and they do not know, they do not understand how\
    \ much suffering they cause.\n"
