- fmt: "\nGive yourself as much time as you need. The practices of mindful breathing\
    \ and mindful walking outdoors are wonderful ways to embrace your anger. Even\
    \ the practice of jogging is very helpful. Just like when you cook potatoes, you\
    \ need to keep the fire going for at least fifteen or twenty minutes. You cannot\
    \ eat raw potatoes. You have to cook your anger on the fire of mindfulness. It\
    \ may take ten or twenty minutes. It may take more.\n\n### Gaining a Victory\n\
    While cooking your potatoes, you have to cover the pot in order to prevent heat\
    \ from escaping. That is concentration. So while you practice walking or breathing\
    \ to take care of your anger, don’t do anything else. Don’t listen to the radio,\
    \ don’t watch television, don’t read a book. Cover the pot and just do one thing.\
    \ Just practice deep walking meditation, deep mindful breathing, and use one hundred\
    \ percent of yourself in order to embrace your anger, exactly like you would take\
    \ good care of a baby.\n\nAfter some time of embracing and looking deeply, insight\
    \ will come and your anger will diminish. You’ll feel much better, and you’ll\
    \ be motivated to go back and help the other person. When you remove the lid of\
    \ the pot, the potatoes will smell wonderful. Your anger will have been transformed\
    \ into the energy of loving-kindness.\n\nThis is possible. It is like the tulips.\
    \ When the energy of the sun is strong enough, the tulip has to open herself and\
    \ show her heart to the sun. Your anger is a kind of flower. You have to embrace\
    \ it with the sunshine of mindfulness. Let the energy of mindfulness penetrate\
    \ into the energy of anger. After five or ten minutes of mindfulness, your anger\
    \ will be transformed. Every mental formation—anger, jealousy, despair, etc.—is\
    \ sensitive to mindfulness the way all vegetation is sensitive to sunshine.\n\n\
    By cultivating the energy of mindfulness, you can heal your body and your consciousness,\
    \ because mindfulness is the energy of the Buddha. In Christianity, it is said\
    \ that Jesus has the energy of God, of the Holy Spirit, within him. That is why\
    \ he is able to heal many people. His healing energy is called the Holy Spirit.\
    \ In Buddhist language, that energy is the energy of the Buddha, the energy of\
    \ mindfulness. Mindfulness contains the energy of concentration, understanding,\
    \ and compassion. \n\nThus, the practice of Buddhist meditation is the practice\
    \ of generating the energy that will offer us concentration, compassion, understanding,\
    \ love, and happiness. Everyone in a practice center is doing just that, so together\
    \ we offer a powerful, collective zone of energy that embraces and protects us\
    \ and the people who come to stay with us. Even after one session of practice,\
    \ we notice that we are very capable of taking care of our anger. We have gained\
    \ a victory for ourselves and for our beloved ones. When we lose, we and our beloved\
    \ ones lose. But when we win a victory, we win for the other person as well. So,\
    \ even if the other person does not know the practice, we can practice for both\
    \ ourselves and him or her. Don’t wait for the other person to practice in order\
    \ to start practicing. You can do it for both of you.\n\nThere may have been a\
    \ time when you could not communicate with your parents. Although you lived in\
    \ the same house, you might have felt that your father or mother was very distant.\
    \ In this situation, both parent and child suffer. Each side believes that there\
    \ is only misunderstanding, hatred, and separation. The parent and child do not\
    \ know that they have many things in common. They do not know that they both have\
    \ the capacity to understand, to forgive, and to love each other. Therefore, it\
    \ is very important to recognize the positive elements that are always there in\
    \ us to prevent anger and other negative elements from dominating us.\n\n### FIVE\
    \ COMPASSIONATE COMMUNICATION\n\n#### The Sunshine Behind the Clouds\nWhen it\
    \ is raining, we think that there is no sunshine. But if we fly high in an airplane\
    \ and go through the clouds, we re discover the sunshine again. We see that the\
    \ sunshine is always there. In a time of anger or despair, our love is still there\
    \ also. Our capacity to communicate, to forgive, to be compassionate is still\
    \ there. You have to believe this. We are more than our anger, we are more than\
    \ our suffering. We must recognize that we do have within us the capacity to love,\
    \ to understand, to be compassionate. \n\nIf you know this, then when it rains\
    \ you won’t be desperate. You know that the rain is there, but the sunshine is\
    \ still there somewhere. Soon the rain will stop, and the sun will shine again.\
    \ Have hope. If you can remind yourself that the positive elements are still present\
    \ within you and the other person, you will know that it is possible to break\
    \ through, so that the best things in both of you can come up and manifest again.\
    \ \n\nThe practice is there for that. The practice will help you touch the sunshine,\
    \ touch the Buddha, the goodness within you so that you can transform the situation.\
    \ You can call this goodness anything you want to, whatever is familiar to you\
    \ from your own spiritual tradition. Deep down you must know that you are capable\
    \ of being peace. Develop the conviction that the energy of the Buddha is in you.\
    \ The only thing you need to do is to call on it for help. You can do this by\
    \ practicing mindful breathing, mindful walking, and mindful sitting.\n\n####\
    \ Training Ourselves to Listen Deeply\nCommunicating is a practice. You have to\
    \ be skillful in order to communicate. Good will is not enough. You have to learn\
    \ how to do it. Maybe you have lost your capacity to listen. Maybe the other person\
    \ has spoken so often with bitterness, always condemning and blaming, that you\
    \ have had enough. You cannot listen anymore. You begin to try to avoid him. You\
    \ don’t have the capacity to listen to that person anymore. You try to avoid him\
    \ You don’t want to suffer. But this can also create a misunderstanding, and make\
    \ him feel that you despise him. This can cause him a lot of suffering. You give\
    \ him the impression that you want to boycott him, to ignore his presence. You\
    \ cannot face him and at the same time you cannot avoid him. The only solution\
    \ is to train yourself to be able to communicate again. Deep listening is the\
    \ way. We know that many people suffer, feeling that no one is able to understand\
    \ them or their situation. Everyone is too busy and no one seems to have the capacity\
    \ to listen. But all of us need someone who can listen to us. Today there are\
    \ people who practice psychotherapy and they are supposed to be there for you,\
    \ to sit and listen to you so that you can open your heart. They have to listen\
    \ deeply in order to be real therapists. Real therapists have the capacity to\
    \ listen with all their being, without prejudices, without judgment. I don’t know\
    \ how therapists train themselves to acquire this kind of capacity to listen.\
    \ A therapist also may be full of suffering. While sitting and listening to the\
    \ client, the seeds of suffering in him or her may be watered. If the therapist\
    \ is overwhelmed by his own suffering, how can he listen properly to the other\
    \ person?\n"
