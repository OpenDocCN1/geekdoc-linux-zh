    in, feel your abdomen rising, and as your breathe out, feel your abdomen falling.
    For several breaths, just notice the rise and fall ofyour abdomen. Now, as you
    breathe in, become aware ofyour two feet. As you breathe out, allow your two feet
    to relax. Breathing in, send your love to your feet, and breathing out, smile
    to your feet. As you breathe in and out, know how wonderful it is to have two
    feet, that allow you to walk, to run, to play sports, to dance, to drive, to do
    so many activities throughout the day. Send your gratitude to your two feet for
    always being there for you whenever you need them. Breathing in, become aware
    of your right and left legs. Breathing out, allow all the cells in your legs to
    relax. Breath- ing in, smile to your legs, and breathing out, send them your love.
    Appreciate whatever degree of strength and health is APPENDIX D 222 2S 1S R 1L
    2L


    there in your legs. As you breathe in and out, send them your tenderness and care.
    Allow them to rest, sinking gently into the floor. Release any tension you may
    be holding in your legs. Breathing in, become aware of your two hands lying on
    the floor. Breathing out, completely relax all the muscles in your two hands,
    releasing any tension you may be holding in them. As you breathe in, appreciate
    how wonderful it is to have two hands. As you breathe out, send a smile oflove
    to your two hands. Breathing in and out, be in touch with all the things your
    two hands allow you to do: to cook, to write, to drive, to hold the hand ofsomeone
    else, to hold a baby, to wash your own body, to draw, to play a musical instrument,
    to type, to build and fix things, to pet an animal, to hold a cup of tea. So many
    things are available to you because of your two hands. Just enjoy the fact that
    you have two hands and allow all the cells in your hands to really rest. Breathing
    in, become aware ofyour two arms. Breathing out, allow your arms, to fully relax.
    As you breathe in, send your love to your arms, and as you breathe out, smile
    to them. Take the time to appreciate your arms and whatever strength and health
    are there in your arms. Send them your gratitude for allowing you to hug someone
    else, to swing on a swing, to help and serve others, to work hard—cleaning the
    house, mowing the lawn, to do so many things throughout the day. APPENDIX D 223
    2S 1S R 1L 2L


    Breathing in and out, allow your two arms to let go and rest completely on the
    floor. With each out-breath, feel the ten- sion leaving your arms. As you embrace
    your arms with your mindfulness, feel joy and ease in every part ofyour two arms.
    Breathing in, become aware ofyour shoulders. Breathing out, allow any tension
    in your shoulders to flow out into the floor. As you breathe in, send your love
    to your shoulders, and as you breathe out, smile with gratitude to them. Breathing
    in and out, be aware that you may have allowed a lot oftension and stress to accumulate
    in your shoulders. With each exha- lation, allow the tension to leave your shoulders,
    feeling them relax more and more deeply. Send them your tenderness and care, knowing
    that you do not want to put too much strain on them, but that you want to live
    in a way that will allow them to be relaxed and at ease. Breathing in, become
    aware ofyour heart. Breathing out, allow your heart to rest. With your in-breath,
    send your love to your heart. With your out-breath, smile to your heart. As you
    breathe in and out, get in touch with how wonderful it is to have a heart still
    beating in your chest. Your heart allows your life to be possible, and it is always
    there for you, every minute, every day. It never takes a break. Your heart has
    been beating since you were a four-week-old fetus in your mother’s womb. It is
    a marvelous organ that allows you to do every- thing you do throughout the day.
    Breathe in and know that APPENDIX D 224 2S 1S R 1L 2L


    your heart also loves you. Breathe out and commit to live in a way that will help
    your heart to function well. With each ex- halation, feel your heart relaxing
    more and more. Allow each cell in your heart to smile with ease and joy. Breathing
    in, become aware of your stomach and in- testines. Breathing out, allow your stomach
    and intestines to relax. As you breathe in, send them your love and gratitude.
    As you breathe out, smile tenderly to them. Breathing in and out, know how essential
    these organs are to your health. Give them the chance to rest deeply. Each day
    they digest and as- similate the food you eat, giving you energy and strength.
    They need you to take the time to recognize and appreciate them. As you breathe
    in, feel your stomach and intestines re- laxing and releasing all tension. As
    you breathe out, enjoy the fact that you have a stomach and intestines. Breathing
    in, become aware ofyour eyes. Breathing out, allow your eyes and the muscles around
    your eyes to relax. Breathing in, smile to your eyes, and breathing out, send
    them your love. Allow your eyes to rest and roll back into your head. As you breathe
    in and out, know how precious your two eyes are. They allow you to look into the
    eyes ofsomeone you love, to see a beautiful sunset, to read and write, to move
    around with ease, to see a bird flying in the sky, to watch a movie—so many things
    are possible because of your two eyes. Take the time to appreciate the gift ofsight
    and allow APPENDIX D 225 2S 1S R 1L 2L


    your eyes to rest deeply. You can gently raise your eyebrows to help release any
    tension you may be holding around your eyes. Here you can continue to relax other
    areas of your body, using the same pattern as above. Now, if there is a place
    in your body that is sick or in pain, take this time to become aware of it and
    send it your love. Breathing in, allow this area to rest, and breathing out, smile
    to it with great tenderness and affection. Be aware that there are other parts
    of your body that are still strong and healthy. Allow these strong parts ofyour
    body to send their strength and energy to the weak or sick area. Feel the support,
    energy, and love of the rest of your body penetrating the weak area, soothing
    and healing it. Breathe in and affirm your own capacity to heal, breathe out and
    let go ofthe worry or fear you may be holding in your body. Breathing in and out,
    smile with love and confidence to the area ofyour body that is not well. Finally,
    breathing in, become aware ofthe whole ofyour body lying down. Breathing out,
    enjoy the sensation ofyour wholebodylyingdown,veryrelaxedandcalm.Smileto yourwhole
    body as you breathe in, and send your love and compassion to your whole body as
