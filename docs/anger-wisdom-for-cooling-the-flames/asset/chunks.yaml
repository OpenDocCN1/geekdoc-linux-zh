  trans: '

    恨。你对此非常熟悉。我们中的许多人在开始一段关系时，怀有巨大的爱，极其强烈的爱。这种爱强烈到让我们相信，没有伴侣我们就无法生存。然而，如果我们不练习正念，只需要一两年的时间，我们的爱就会变成恨。然后，在伴侣身边时，我们产生了相反的感觉，感到非常糟糕。变得再再无法生活在一起，因此离婚成了唯一的出路。


    爱已经变成了恨；我们的花已经变成了垃圾。但通过正念的能量，你可以审视这些垃圾并说：“我不害怕。我有能力将垃圾重新转化为爱。”如果你在自己身上看到了垃圾的元素，比如恐惧、绝望和仇恨，不要恐慌。作为一名优秀的有机园艺师，一名优秀的修行者，你可以面对这一切：“我意识到我体内有垃圾。我要将这些垃圾转化为能够滋养生命的堆肥，让爱重新出现。”


    那些对修行有信心的人不会想着逃避一段艰难的关系。当你掌握了正念呼吸、正念行走、正念坐禅和正念饮食的技巧时，你就能产生正念的能量并拥抱你的愤怒或绝望。仅仅是拥抱它就能带给你宽藉。然后随着你继续拥抱，你可以练习深入观察你愤怒的本质。


    ## 修行的两个阶段


    修行分为两个阶段。第一阶段是熄灭愤怒之火并承认：“我亲爱的愤怒，我知道你在那里，我正在很好地照顾你。”第二阶段是深入观察你愤怒的本质，看看它是如何产生的。


    ## 照顾你的婴儿：愤怒


    你必须像一位倾听婴儿哭声的母亲。如果母亲正在厨房里工作，听到婴儿在哭，她会放下手头的一切，去安慰她的婴儿。她可能在做一汤非常好喝的汤；汤很重要，但它比婴儿的痛苦要轻得多。她必须放下汤，走进婴儿的房间。她出现在房间就像阳光，因为母亲充满了温暖、关怀和温柔。


    她做的第一件事是抱起婴儿并温柔地抱着他。当母亲拥抱婴儿时，她的能量渗透进他的身体并安抚他。这正是当愤怒开始浮现时你必须学会做的。你必须放弃你正在做的一切，因为你最重要的任务是回到自己，照顾好你的婴儿，你的愤怒。没有比好好照顾你的婴儿更紧急的事情了。


    记得你小时候发烧的时候，尽管他们给了你阿斯匹林或其他药物，但直到妈妈来把手放在你发烫的额头上，你才觉得好受了？那种感觉太棒了！她的手就像女神的手。当她用手触摸你时，许多清凉、爱和慈悲渗透进了你的身体。


    你母亲的手就是你自己的手。如果你知道如何呼吸，如何保持正念，她的手依然活在你的手中。那么，当你用自己的手触摸自己的额头时，你会发现妈妈的手依然在那里，触摸着你的额头。你对自己也会产生同样的爱和温柔的能量。母亲正念地抱着婴儿，全神贯注地看着他。婴儿感到有些宽藉，因为他被母亲温柔地抱着，就像被阳光拥抱的花朵。她抱孩子不仅是为了抱住他，更是为了发现他哪里出了问题。因为她是一个真正的母亲，而且非常有才华，她能很快发现婴儿哪里不对。她是一个婴儿专家。作为修行者，我们必须成为愤怒专家。我们必须关注自己的愤怒；我们必须练习直到理解愤怒的根源以及它是如何运作的。


    ## 抱着你的婴儿


    正念地抱着婴儿，母亲很快发现了他痛苦的根源。然后对她来说，修正这种情况很容易。如果婴儿发烧，她会给他药帮助退烧。如果他饿了，她会喂他温牛奶。如果尿布太紧，她会把它放开。


    作为修行者，我们完全也是这样做。我们在正念中抱着我们的愤怒之婴儿，以便获得宽藉。我们继续练习正念呼吸和正念行走，作为我们愤怒的摇篮曲。正念的能量渗透进愤怒的能量，就像母亲的能量渗透进婴儿的能量一样。完全没有区别。如果你知道如何练习正念呼吸、微笑和行走冥想，你会在五、十或十五分钟内找到宽藉。


    ## 发现你愤怒的真性


    在你愤怒的瞬间，你倾向于认为你的痛苦是由另一个人创造的。你埋怪他她所有的痛苦。但通过深入观察，你可能会意识到你体内的愤怒种子是你痛苦的主要原因。许多人在面对相同的情况时，并像你那样生气。他们听到同样的话，看到同样的情境，却能够保持冷静。


    你为什么如此容易生气？你可能非常容易生气，是因为你的愤怒种子太强大了，而且因为你没有练习。我们所有人的意识深处都有愤怒种子。但在我们某些人身上，那颗愤怒种子比其他的种子——如爱或慈悲——要大。当我们开始培养正念能量时，我们获得的第一个洞察是，我们痛苦、不幸的主要原因不是别人——而是我们体内的愤怒种子。这时我们将停止埋怪别人。我们意识到他她只是次要原因。当你产生这种洞察时，你会获得很多宽藉，并开始感觉好多了。但另一个人可能仍然处于地狱，因为她不知道修行。


    ## 帮助而非惩罚


    当一个人不知道如何处理自己的痛苦时，他会让痛苦溢到周围的人身上。当你痛苦时，你就让周围的人受苦。这非常自然。这就是为什么我们必须学会处理自己的痛苦，以免让它处处扩散。


    例如，当你是一个家庭的主人时，你知道家人的福祉非常重要。因为你有慈悲，你不会让自己的痛苦伤害周围的人。你练习学习如何处理自己的痛苦，因为你知道你的痛苦不是个人的问题，你的快乐也不是个人的问题。当某人愤怒且不知道如何处理她的愤怒时，她是无助的，她在受苦。她也让她周围的人受苦。起初，你觉得她应该受到惩罚。你想惩罚她，因为她让你受了苦。但在十分十五的行走冥想和正念观察后，你意识到她需要帮助而非惩罚。这是一个很好的洞察。这个人可能是你非常亲近的人——她可能是你的妻子，他可能是你的丈夫。如果你不帮助他她，谁来帮？

