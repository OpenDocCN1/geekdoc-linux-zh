    The cold air is embraced by the hot air and becomes warm— there’s no fighting
    at all between them. We practice taking care of our anger in the same way. Mindfulness
    recognizes anger, is aware of its presence, accepts and allows it to be there.
    Mindfulness is like a big brother who does not suppress his younger brother’s
    suffering. He simply says, “Dear brother, I’m here for you.” You take your younger
    brother in your arms and you comfort him. This is exactly our practice. Imagine
    a mother getting angry with her baby and hitting him when he cries. That mother
    does not know that she and her baby are one. We are mothers of our anger, and
    we have to help our baby, our anger, not fight and destroy it. Our anger is us,
    and our compassion is also us. To meditate does not mean to fight. In Buddhism,
    the practice of meditation should be the practice of embracing and transforming,
    not of fighting.


    ### Using Anger, Using Suffering

    To grow the tree of enlightenment, we must make good use of our afflictions, our
    suffering. It is like growing lotus flowers; we cannot grow a lotus on marble.
    We cannot grow a lotus without mud.


    # Anger: Wisdom for Cooling the Flames


    Practitioners of meditation do not discriminate against or reject their internal
    formations. We do not transform ourselves into a battlefield, good fighting evil.
    We treat our afflictions, our anger, our jealousy with a lot of tenderness. When
    anger comes up in us, we should begin to practice mindful breathing right away:
    “Breathing in, I know that anger is in me. Breathing out, I am taking good care
    of my anger.” We behave exactly like a mother: “Breathing in, I know that my child
    is crying. Breathing out, I will take good care of my child.” This is the practice
    of compassion. If you don’t know how to treat yourself with compassion, how can
    you treat another person with compassion? When anger arises, continue to practice
    mindful breathing and mindful walking to generate the energy of mindfulness. Continue
    to tenderly embrace the energy of anger within you. Anger may continue to be there
    for some time, but you are safe, because the Buddha is in you, helping you to
    take good care of your anger. The energy of mindfulness is the energy of the Buddha.
    When you practice mindful breathing and embracing your anger, you are under the
    protection of the Buddha. There is no doubt about it: the Buddha is embracing
    you and your anger with a lot of compassion.


    ### Giving and Receiving Mindfulness Energy

    When you are angry, when you feel despair, you practice mindful breathing and
    mindful walking, to generate the energy of mindfulness. This energy allows you
    to recognize and embrace your painful feelings. And if your mindfulness is not
    strong enough, you ask a brother or a sister in the practice to sit close to you,
    to breathe with you, to walk with you in order to support you with his or her
    mindfulness energy. Practicing mindfulness does not mean that you have to do everything
    on your own. You can practice with the support of your friends. They can generate
    enough mindfulness energy to help you take care of your strong emotions. We can
    also support others with our mindfulness when they are in difficulty. When our
    child is drowning in a strong emotion, we can hold his or her hand and say, “My
    dear one, breathe. Breathe in and out with Mommy, with Daddy.” We can also invite
    our child to do walking meditation with us, gently taking her hand and helping
    her calm down, with each step. When you give your child some of your mindfulness
    energy, she will be able to calm down very quickly and embrace her emotions.


    ### Recognizing, Embracing, Relieving the Suffering of Anger

    The first function of mindfulness is to recognize, not to fight. “Breathing in,
    I know that anger has manifested in me. Hello, my little anger.” And breathing
    out, “I will take good care of you.” Once we have recognized our anger, we embrace
    it. This is the second function of mindfulness, and it is a very pleasant practice.
    Instead of fighting, we are taking good care of our emotion. If you know how to
    embrace your anger, something will change. We have said many times that it is
    like cooking potatoes. You cover the pot and then the water will begin to boil.
    You must keep the stove on for at least twenty minutes for the potatoes to cook.
    Your anger is a kind of potato and you cannot eat a raw potato. Mindfulness is
    like the fire cooking the potatoes of anger. The first few minutes of recognizing
    and embracing your anger with tenderness can bring results. You get some relief.
    Anger is still there, but you do not suffer so much anymore, because you know
    how to take care of your baby. So the third function of mindfulness is soothing,
    relieving. Anger is there, but it is being taken care of. The situation is no
    longer in chaos, with the crying baby left all alone. The mother is there to take
    care of the baby and the situation is under control.


    ### Keeping Mindfulness Alive

    And who is this mother? The mother is the living Buddha. The capacity of being
    mindful, the capacity of being understanding, loving, and caring is the Buddha
    in us. Every time we are capable of generating mindfulness, it makes the Buddha
    in us a reality. With the Buddha in you, you have nothing to worry about anymore.
    Everything will be fine if you know how to keep the Buddha you alive. It is important
    to recognize that we always have the Buddha within us. Even if we are angry, unkind,
    or in despair, the Buddha is always within us. This means we always have the potential
    to be mindful, to be understanding, to be loving. We need to practice mindful
    breathing or walking in order to touch the Buddha within us. When you touch the
    seed of mindfulness that lies in your consciousness, the Buddha will manifest
    in your mind consciousness and embrace your anger. You don’t have to worry, just
    continue to practice breathing or walking to keep the Buddha alive. Thing will
    be fine. The Buddha recognizes. The Buddha embraces. The Buddha relieves, and
    the Buddha looks deeply into the nature of anger. The Buddha understands. And
    this understanding will bring about transformation.


    ### The Basement and the Living Room

    Let us use a house to represent our consciousness. We can identify two parts:
    the basement is the store consciousness and the living area is mind consciousness.
    Internal formations, like anger, rest in the store consciousness.

