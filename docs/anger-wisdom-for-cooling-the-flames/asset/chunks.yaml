    He came in contact with the dharma, and it had a deep impact on him. He wanted
    to begin anew, to change his life. So he decided to become a monk. With great
    eagerness to learn, he stayed with the Plum Village sangha for three or four months,
    and he proved he was capable of becoming a monk. From the day he came to our center,
    he practiced mindful consumption, walking meditation, sitting meditation, participating
    in all the activities ofthe the sangha. He did not expect anything from his father,
    he just began with himself. Thanks to that kind of living, making peace with himself,
    he was able to write his father every week. Not expecting an answer at all, he
    wrote to his father about his practice, the small joys he felt every day. Six
    months later, he picked up the phone, and breathed in and out mindfully. This
    helped him to stay calm. He dialed the number, and his father answered. His father
    knew that he had become a monk, and he was very angry about that. So the first
    thing he said was, “Are you still with that group? Are you still a monk? What
    is your future?”


    The young man replied, “Dad, my greatest concern now is how to establish a good
    relationship between us. That would make me very happy. It is the most important
    thing to me. To be able to communicate with you again, to be able to be close
    again, that is my only concern. It is more important than anything, including
    the future.” His father kept silent, for a long time. The young monk just continued
    to follow his breathing. Finally the father said, “Okay, I accept that. That is
    important for me, too.”


    So anger was not the only thing his father felt for his son. In many letters,
    the young man had written about beautiful things that had nourished the positive
    elements in his father. From that day on, his father called him every week. Communication
    has been reestablished, and the happiness of both father and son has now become
    a reality.


    ## Peace Begins with You


    Before we can make deep changes in our lives, we have to look into our diet, our
    way of consuming. We have to live in such a way that we stop consuming the things
    that poison us and intoxicate us. Then, we will have the strength to allow the
    best in us to arise, and we will no longer be victims of anger, or frustration.
    Everything is possible when the door of communication is open. So we must invest
    ourselves in the practice of opening up and restoring communication. You have
    to express your willingness, your desire to make peace with the other person.
    Ask him to support you. Tell him, “Communication between us is the most important
    thing to me. Our relationship is the most precious thing, nothing is more important.”
    Make it clear and ask for support. You have to start negotiating a strategy. No
    matter how much the other person can do, you have to do all that you are capable
    of doing yourself. You must give one hundred percent of yourself. Whatever you
    can do for yourself, you do for him, or for her.


    Don’t wait. Don’t put forth conditions, saying, “If you don’t make an effort to
    reconcile, then I won’t either.” This will not work. Peace, reconciliation, and
    happiness begin with you. It is wrong to think that if the other person does not
    change or improve, then nothing can be improved. There are always ways to create
    more joy, peace, and harmony, and you have access to them. The way you walk, the
    way you breathe, the way you smile, the way you react, all of this is very important.
    You must begin with this.


    There are many ways to communicate, and the best way is to show that you no longer
    feel any anger or condemnation. You show that you understand and accept the other
    person. You communicate this not only by your words, but also by your way of being—with
    your eyes full of compassion and your actions full of tenderness. The fact that
    you are fresh and pleasant to be around already changes a lot. No one can resist
    coming close to you. You become a tree with a cool shade, a stream of cool water.
    Both people and animals will want to come near you because your presence is refreshing
    and enjoyable. When you begin with yourself, you will be able to restore communication,
    and the other person will change naturally.


    ## Peace Treaty


    We tell our beloved one, “My darling, in the past we have made each other suffer
    so much, because neither of us was capable of handling our anger. Now we have
    to work out a strategy for taking good care of our anger.” The dharma can remove
    the heat of anger, and the fever of suffering. It is a wisdom that can bring joy
    and peace in the here and the now. Our strategy for peace and reconciliation should
    be based on this. Whenever the energy of anger comes up, we often want to express
    it to punish the person whom we believe to be the source of our suffering. This
    is the habit energy in us. When we suffer, we always blame the other person for
    having made us suffer. We do not realize that anger is, first of all, our business.
    We are primarily responsible for our anger, but we believe very naively that if
    we can say something or do something to punish the other person, we will suffer
    less. This kind of belief should be uprooted.


    Because whatever you do or say in a state of anger will only cause more damage
    in the relationship. Instead, we should try not to do anything or say anything
    when we are angry. When you say something unkind, when you do something in retaliation,
    your anger increases. You make the other person suffer, and he will try hard to
    get relief. That is how the conflict escalates. This has happened so many times
    in the past. You are both very familiar with the escalation of anger, suffering,
    and yet you have not learned anything. Trying to punish the other person is only
    going to make the situation worse. Punishing the other person is self-punishment.
    That is true in every circumstance. Every time the United States Army tries to
    punish Iraq, only does Iraq suffer, but the U.S. also suffers. Every time Iraq
    tries to punish the U.S., the U.S. suffers, but Iraq also suffers. The same is
    true everywhere; between the Israeli and Palestinian, between the Muslim and Hindu,
    between you and the other person. It has always been like that. So let us wake
    up; let us be aware that punishing the other is not an intelligent strategy. Both
    you and the other person are intelligent. You can use your intelligence. You must
    come together and agree on a strategy for taking care of anger. You both know
    that trying to punish each other is not wise. So promise each other that every
    time you get angry, you will not say or do anything out of anger. Instead, you
    will take care of your anger by going back to yourselves—practicing mindful breathing
    and mindful walking. Take advantage of the moments when you are happy together
    to sign the contract, your peace treaty, a treaty of true love. Your peace treaty
    should be written and signed entirely on the basis of love, not like a peace treaty
    signed by political parties. They base their treaties only on national interest.
    They are still full of a lot of suspicion and anger. But your peace treaty must
    be purely a love treaty.


    ## Embracing Anger


    The Buddha never advised us to suppress our anger. He taught us to go back to
    ourselves and take good care of it. When something is physically wrong with us,
    in our intestines, our stomach, or our liver, we have to stop and take good care
    of them. We do some massage, we use a hot-water bottle, we do everything possible
    in order to take care of them. Just like our organs, our anger is part of us.
    When we are angry, we have to go back to ourselves and take good care of it.

