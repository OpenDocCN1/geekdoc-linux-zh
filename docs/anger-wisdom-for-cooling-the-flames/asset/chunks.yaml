    \ yourself. When you are angry, you are not very beautiful, you are not presentable.\
    \ Hundreds of muscles on your face become very tense. Your face looks like a bomb\
    \ ready to explode. Look at someone who is angry. When you see the tension in\
    \ her, you become frightened. The bomb in may explode any minute. So it is very\
    \ helpful to see yourself in moments when you are angry. It is a bell of mindfulness.\
    \ When you see yourself like that, you are motivated to do something to change\
    \ it. You know what to do to look more beautiful. You don’t need any THICH NHAT\
    \ HANH 26 2S 1S R 1L 2L cosmetics. You need only to breathe peacefully, calmly,\
    \ and smile mindfully. If you can do that one or twice, you will look much better.\
    \ Just look in the mirror, breathing in calmly, breathing out smiling, and you\
    \ will feel relief.\n\nAnger is a mental, psychological phenomenon, yet it is\
    \ closely linked to biological and biochemical elements. Anger makes you tense\
    \ your muscles, but when you know how to smile, you begin to relax and your anger\
    \ will decrease. Smiling allows the energy of mindfulness to be born in you, helping\
    \ you to embrace your anger. In old times, servants of kings and queens always\
    \ had to have a mirror, because whenever anyone was presented to the emperor,\
    \ they had to be perfect in their appearance. So for the sake of formal etiquette,\
    \ people would carry a pouch with a small mirror inside. Try it. Carry a mirror\
    \ with you and look at it to see what state you are in. After you have breathed\
    \ in and out a few times, smiling at yourself, the tension will be gone, and you\
    \ will obtain some relief.\n\n## Embracing Anger with the Sunshine of Mindfulness\n\
    \nAnger is like a howling baby, suffering and crying. The baby needs his mother\
    \ to embrace him. You are the mother for PUTTING OUT THE FIRE OF ANGER 27 2S 1S\
    \ R 1L 2L your baby, your anger. The moment you begin to practice breathing mindfully\
    \ in and out, you have the energy of a mother, to cradle and embrace the baby.\
    \ Just embracing your anger, just breathing in and breathing out, that is good\
    \ enough. The baby will feel relief right away.\n\nAll plants are nourished by\
    \ sunshine. All of them are sensitive to it. Any vegetation that is embraced by\
    \ the sunshine will undergo a transformation. In the morning, the flowers have\
    \ not yet opened. But when the sun comes out, the sunshine embraces the flowers\
    \ and tries to penetrate them. The sunshine is made of tiny particles, photons.\
    \ The photons gradually penetrate the flower one by one until there are a lot\
    \ of them inside. At that point the flower cannot resist any longer and has to\
    \ open herself to the sunshine.\n\nIn the same way, all mental formations and\
    \ all physiological formations in us are sensitive to mindfulness. If mindfulness\
    \ is there, embracing your body, your body will transform. If mindfulness is there,\
    \ embracing your anger or despair, then they, too, will be transformed. According\
    \ to the Buddha and according to our experience, anything embraced by the energy\
    \ of mindfulness will undergo a transformation. Your anger is like a flower. In\
    \ the beginning you may not understand the nature of your anger, or why it has\
    \ come up. But if you know how to embrace it with the energy of mindfulness, it\
    \ will begin to open. You may be sitting, following THICH NHAT HANH 28 2S 1S R\
    \ 1L 2L\n\n## Cooking Anger\n\nYour breathing, or you may be practicing walking\
    \ meditation to generate the energy of mindfulness and embrace your anger. After\
    \ ten or twenty minutes, suddenly you will see the true nature of your anger.\
    \ It may have arisen just because of wrong perception or the lack of skillfulness.\
    \ It’s like when you cook potatoes; you put the potatoes in pot, cover it, and\
