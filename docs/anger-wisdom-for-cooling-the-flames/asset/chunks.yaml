    arsonist. Ifyou run after the person you suspect has burned your house, your house
    will burn down while you are chasing him or her. That is not wise. You must go
    back and put out the fire. So when you are angry, if you continue to interact
    with or argue with the other person, ifyou try to punish her, you are acting exactly
    like someone who runs after the arsonist while everything goes up in flames. Tools
    for Cooling the Flames TheBuddhagaveusveryeffectiveinstrumentstoputoutthe fireinus:themethodofmindfulbreathing,themethodof
    mindfulwalking,themethodof embracingouranger,the THICH NHAT HANH 24 2S 1S R 1L
