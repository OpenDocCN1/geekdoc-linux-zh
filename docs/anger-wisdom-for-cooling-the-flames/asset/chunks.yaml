  trans: '

    竭尽全力，我充满信心并尊重你，因为你是一个真正的实践者。你对你所学的知识、教导以及你的实践团体保持忠诚。当你练习这三句话时，你是在心中拥抱了你的老师和你的僧团。因为你付尽全力，所以我最终也付尽全力。我回到自己并练习。为了对得起你，我必须深层观察，并且付尽全力。我必须问问自己：“我说了什么，做了什么，才会让她或他遭受那样的痛苦？我为什么要那样？”


    仅仅是听你说话，仅仅是阅读你给我的《和平信》（Peace Note），我就能找回自我。法在接触了你之后，现在开始触碰我，轮到我被正念的能量所充满了。所以，当对方收到你的信息——一条通过爱语传达的信息时，他会被你的爱、你的语言和你的实践所启发。当信息传达过去，他心中会产生许多觉醒和尊重。他会愿意回到内心，反思自己是否做过或说过任何让你痛苦的事。通过这种方式，你向他传递了你的实践。他会看到你正在尽力。为了回应这一点，他也会想要尽力。他会在心里默默对自己说：“亲爱的，我也在尽力。”


    真爱的语言 61 2S 1S R 1L 2L


    这太棒了；你们两个都在实践。法入驻了你们双方。佛活在你们每个人心中。不再有危险了。你们已经回到了自己，通过深层观察来真正理解局势。如果在此期间，你们其中一个人对真实发生的情况有了洞察，那么你必须立即告诉对方你发现了什么。也许你会意识到，你之所以愤怒是因为一种错误的认知。当你产生这样的洞察时，你必须立即告诉对方。你必须让她知道，你很抱歉自己无缘故地生气。她什么错都没有做。你之所以生气是因为你误解了状况。给她打电话，发传真给她，发邮件给她，因为她仍然非常担心你的痛苦。这会让她立刻感到宽慰。


    回首过去，对方可能也会意识到她因为烦躁或错误的认知而说了或做了一些事。她对对你说或为你做的事感到后悔，因此她也必须分享她的洞察。“亲爱的，前几天我不够正念。我说了一些不妥的话。我有误解。我做了一些不友善的事，我意识到那是因为我不够圆融。我并不是想让你受苦。所以我道歉，并承诺下次我会更圆融、更正念。”


    一师一行 62 2S 1S R 1L 2L 消息后，你停止了痛苦，在你的心中，你对对方充满了许多尊重。现在，对方成了一名同修者。你们之间的相互尊重不断增长，而尊重是真爱的基石。


    ### 特别嘉宾

    在越南传统中，夫妻双方被要求像对待客人一样对待彼此。你们真正互相尊重。当换衣服时，你们不会在对方面前换。你们表现得充满敬畏。如果对对方不再有尊重，真爱无法长久。相互尊重，将彼此视为客人，是亚洲社会的传统。我相信这种态度在西方也曾存在过，至少在古代是如此。没有这种相互尊重，爱无法长久。愤怒和其他负面能量将开始占据主导。


    在位于法国的梅花禅（Plum Village）修持中心举行的婚礼上，夫妻互相鞠躬以示尊重。这是因为每个人心中都有佛性——觉悟、发展大慈悲和大正解的能力。当你尊重地向伴侣鞠躬时，你感受到了你的爱。如果你对对方不再有任何尊重，爱真爱的语言
    63 2S 1S R 1L 2L 就死了。这就是为什么我们必须非常小心地滋养和维持我们的相互尊重。使用这三句真爱，深层观察并承认我们在冲突中的责任，是表达尊重和滋养爱的非常具体的方式。不要低估这三句真爱。


    ### 口袋中的石头

    这三句话的每一个分子完全由真爱组成。爱可以处理一切。你可能喜欢把这三句话写在信用卡大小纸上，滑进钱包。敬畏这张纸，把它当作能拯救你的东西，因为它会提醒你对彼此的承诺。


    我们中有些人会在口袋里放一颗小石头，一颗在前院捡起来的漂亮石头。我们非常仔细地洗过它，并随身携带。每当我们把手伸进口袋，都会触碰到那块小石头，并轻轻握住它。我们练习正念呼吸，感到非常平静。当愤怒升起时，石头就变成了法。它提醒我们那三句话。仅仅是握着石头，平静地深呼吸并微笑，就能对你有巨大的帮助。这听起来有点幼稚，但这种练习非常有用。


    当你，一师一行 64 2S 1S R 1L 2L 在学校、上班或购物时，你没有提醒能带你回到自己的东西。所以口袋里的小石头充当了你的老师、你的同修——它是一声正念之钟，允许你停下来回到呼吸。许多人用念珠念耶稣或阿弥陀佛的名字。石头是一种念珠，提醒你的老师一直与你在一起，你的道侣也一直在你身边。它将帮助你回到呼吸，让爱在你心中诞生，并让这种爱保持生命力。它可以帮助觉悟在你心中存。真爱的语言
    65 2S 1S R 1L 2L 留白


    #### 能量区域

    我们知道当我们体内产生愤怒时，应该克制反应，即不要说话或做任何事。在愤怒时说话或做某事是不明智的。我们被促使回到自己，好好照顾我们的愤怒。愤怒是我们体内的一个能量区域。它是我们的一部分。它是一个我们需要照顾的受苦婴儿。做到点的最好方法是产生另一个能量区域，来拥抱并照顾我们的愤怒。第二个能量区域是正念能量。正念是佛的能量。它是我们可以使用的，我们有能力产生它
    67 四次转化

