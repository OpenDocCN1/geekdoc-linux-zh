    # Meditation Insight


    Had this kind of insight? In your sitting meditation, you have to see your Angelina
    stepping into your life as an angel. You have to see how things have deteriorated
    between you and her: how you treated her, how you made her suffer, and how she
    left you. When you can look into your relationship in this way, you are practicing
    deep meditation. The insight you get will tell you exactly what to do and what
    not to do. It is possible for you to offer the incense of the heart and call your
    Angelina back.


    Angelina is always there. Love is still in her heart. She is ready to forgive,
    if you know how to burn the incense of your heart, the incense of the Mindfulness
    Trainings, concentration, and insight. You maybe be a lucky person, because more
    than one Angelina has stepped into your life. Your partner, your son, your daughter,
    your father, your mother are also your Angelinas.


    The practice is to call our Angelina by his or her true name, to recognize and
    appreciate that the she is your Angelina. Do not say that no Angelina has ever
    come into your life. That’s not true. Sit mindfully and silently call her name,
    his name.


    “My Angelina, I’m sorry. You have stepped into my life, and I have made you suffer.
    I have made myself suffer at the same time. I did not mean to. I was unskilled.
    I did not know how to protect myself, and protect you, with the practice of the
    Mindfulness Trainings. I want to begin a new.”


    If you really practice like this, Angelina will come back to you.


    ## Protecting My Angelinas


    I am a David also. I have many Angelinas in my life. And in my small meditation
    hall, I have a picture of about one hundred of my Angelinas—they are my students
    who live in our practice centers in France and the United States. Before I practice
    sitting meditation, I always look at that picture and bow to all my Angelinas.


    Then I sit down and I vow to live in such a way that my Angelinas will never leave
    me. I vow to practice mindful speech, to practice the Mindfulness Trainings, and
    not to betray my Angelinas. By doing so, I avoid causing suffering to my Angelinas
    and I am able to bring them joy. This makes me very happy.


    If your Angelina has left you, what will you do to bring her back into your life?
    Your Angelina still may be with you, but about to leave you, or your Angelina
    may have already left you. In both cases the practice of protection is relevant,
    because the practice can help you to keep her or to bring her back to you. Please
    do not get lost in abstract notions. Spiritual teachings are alive, and they can
    help you to protect your Angelina. True wisdom and compassion are born from touching
    real suffering. This is the kind of dharma that is appropriate and effective and
    relevant to the situation. Use all your time and energy to look back and ask yourself
    these questions: Where is my Angelina now? How have I treated her? And if she
    has left: What should I do in order to bring her home again?


    ## The Knots of Anger


    In our consciousness there are blocks of pain, anger, and frustration called internal
    formations. They are also called knots because they tie us up and obstruct our
    freedom. When someone insults us, or does something unkind to us, an internal
    formation is created in our consciousness. If you don’t know how to undo the internal
    knot and transform it, the knot will stay there for a long time. And the next
    time someone says something or does something to you of the same nature, that
    internal formation will grow stronger. As knots or blocks of pain in us, our internal
    formations have the power to push us, to dictate our behavior.


    After a while, it becomes very difficult for us to transform, to undo the knots,
    and we cannot ease the constriction of this crystallized formation. The Sanskrit
    word for internal formation is `samyojana`. It means “to crystallize.” Every one
    of us has internal formations that we need to take care of. With the practice
    of meditation we can undo these knots and experience transformation and healing.


    Not all internal formations are unpleasant. There are also pleasant internal formations,
    but they can still make us suffer. When you taste, hear, or see something pleasant,
    then that pleasure can become a strong internal knot. When the object of your
    pleasure disappears, you miss it and you begin searching for it. You spend a lot
    of time and energy trying to experience it again.


    If you smoke marijuana or drink alcohol, and begin to like it, then it becomes
    an internal formation in your body and in your mind. You cannot get it off your
    mind. You will always look for more. The strength of the internal knot is pushing
    you and controlling you. So internal formations deprive us of our freedom.


    Falling in love is a big internal formation. Once you are in love, you think only
    of the other person. You are not free anymore. You cannot do anything; you cannot
    study, you cannot work, you cannot enjoy the sunshine or the beauty of nature
    around you. You can think only of the object of your love. That is why we speak
    about it as a kind of accident, “falling in love.” You fall down. You are not
    stable anymore you have gotten into an accident. So love can also be an internal
    knot. Pleasant or unpleasant, both kinds of knots take away our liberty. That
    is why we should guard our body and mind very carefully, to prevent these knots
    from taking root in us. Drugs, alcohol, and tobacco can create internal formations
    in our body. And anger, jealousy, despair can create internal formations in our
    mind.


    ## Training in Aggression


    Anger is an internal formation, and since it makes us suffer, we try our best
    to get rid of. Psychologists like the expression “getting it out of your system.”
    They speak about venting anger, like ventilating a room with smoke. Some psychologists
    say that when the energy of anger arises in you, you should ventilate it by hitting
    a pillow, kicking something, or by going into the forest to yell and shout.


    As a kid you were not supposed to say certain swear words. Your parents may not
    have allowed you to say these words, because they are harmful, they damage relationships.
    So you went into the woods or to an isolated place and shouted these words very
    clearly, very strongly, in order to relieve the feeling of oppression. This is
    also venting. People who use venting techniques like hitting a pillow or shouting
    are actually rehearsing anger. When someone is angry and vents their anger by
    hitting a pillow, they are learning a dangerous habit. They are training in aggression.
    Instead, we generate the energy of mindfulness and embrace anger every time it
    manifests.


    ## Treating Anger with Tenderness


    Mindfulness does not fight anger or despair. Mindfulness is there in order to
    recognize. To be mindful of something is to recognize that something is there
    in the present moment. Mindfulness is the capacity of being aware of what is going
    on in the present moment. “Breathing in I know that anger has manifested in me;
    breathing out I smile towards my anger.” This is not an act of suppression or
    fighting. It is an act of recognizing. Once we recognize our anger, we embrace
    it with a lot of awareness, a lot of tenderness. When it is cold in your room,
    you turn on the heater, and the heater begins to send out waves of hot air. The
    cold air doesn’t have to leave the room for the room to become warm.

