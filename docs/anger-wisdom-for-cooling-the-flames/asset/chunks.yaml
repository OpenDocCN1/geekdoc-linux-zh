    made you suffer, that have hurt you. You can write everything you feel inside.
    As you write, your practice is to be calm, to use the language of peace, of loving-kindness.
    Try to establish dialogue. You can write things like “My dear friend, I may be
    the victim of wrong perceptions, and what I write here may not reflect the truth.
    However, this is my experience of the situation. This is what I really feel in
    my heart. If there is anything wrong in what I write, let us sit down and look
    into it together so that we can clarify the misunderstanding.”


    In our tradition, when the monks and the nuns come together to offer guidance
    to someone who has requested it, they always use this kind of language. They use
    the insight of the community. This does not mean that the community’s vision is
    perfect, but it is the best insight they can offer us. So the brothers and sisters
    acknowledge in their response that “As we offer this guidance, we are aware there
    may be things that we have not understood. There may be positive things in you
    that we have not seen. And there may be some wrong perception on the part of the
    community.”


    So when you write a letter to the other person, do the same: “If my perceptions
    are not right, then please correct me.” Use loving speech when you write. If one
    sentence is not written well enough, you can always begin anew and write another
    sentence that is more kind. In the letter, we have to demonstrate that we have
    the capacity to see the suffering in the other person: “Dear friend, I know that
    you have suffered. And I know that you are not wholly responsible for your suffering.”


    Because you have practiced looking deeply, you have discovered a number of different
    roots and causes of the other person’s suffering. You can tell him all these things.
    You can tell him of your own suffering, and show that you understand why he acted
    or spoke the way he did. Take one, two, or even three weeks to finish your letter,
    because it is a very important letter. It is more important than the fourth volume
    on the history of Buddhism in Vietnam. More important than the book on Thich Nhat
    Hanh and Thomas Merton. That letter is crucial for your happiness. The time you
    spend writing it is even more important than the one or two years you spend writing
    your doctoral thesis. Your thesis is not as crucial as this letter. Writing a
    letter like this is the best thing you can do to have a breakthrough and restore
    communication. You are not alone in doing this. You have brothers and sisters
    who can shine light on you and help you with your letter. The people you need
    are right there with you in your community. When we write a book, we give the
    manuscript to friends, to specialists in order to ask for advice. Your fellow
    practitioners are specialists, because they all practice deep listening, deep
    looking, and loving speech.


    You are the best doctor, you are the best therapist for your beloved one. So show
    the letter to a sister and ask her to tell you whether the language is kind enough,
    calm enough, and whether the insight is deep enough. After you show it to one
    brother or sister, you can still show it to another brother or sister until you
    feel that your letter will bring about a transformation in the other person and
    heal him. How much of your time, energy, and love will you invest in such a letter?
    And who would refuse to help you in this important endeavor? It is crucial that
    you restore communication with this person whom you care so much about. It may
    be your father, your mother, your daughter, or your partner. He or she may be
    sitting right next to you.


    ### Restoring the Pure Land


    In the beginning of your relationship, the other person made a commitment to love
    and take care of you, but now, he’s very, very distant. He doesn’t want to look
    at you anymore. He doesn’t want to hold your hand and walk with you anymore, and
    you suffer. In the beginning of relationship, you felt you were in paradise. He
    fell in love with you, and you were so happy. Now it seems like he does not love
    you anymore and that he has abandoned you. He may be looking for another person,
    another relationship. Your paradise has become hell and you cannot get out of
    your hell.


    Where does that hell come from? Is there someone pushing you into that hell and
    keeping you there? Perhaps hell is created by your mind, by your notions, by your
    wrong perceptions. So it is only with your mind that you can destroy the hell,
    and free yourself. The practice of mindfulness, of recognizing and embracing anger
    is to open the door of your hell and transform it, rescuing yourself and the other
    person, returning together to the land of peace. This is possible and you are
    the one who is going to do it. Your friends who practice will, of course, support
    you with their insight, their energy of mindfulness and loving-kindness. If you
    succeed in restoring the relationship, making the other person and yourself happy
    again, you make a great contribution. Everyone enjoys the victory, because everyone
    gains more faith in the practice. With support you can transform your hell and
    restore the Pure Land, restore peace in your daily life. You can start straightaway.
    You can begin to write that letter today. You will find out that with just a pencil
    and a sheet of paper, you can practice and transform your relationship.


    ### Writing Your Letter All Long


    While you’re sitting, doing walking meditation, working, cleaning, or cooking
    a meal, don’t think about the letter. But everything you do will be related to
    the letter. The time you spend at your desk writing is only the time of putting
    your feelings on paper. But this is not exactly the moment that you produce the
    letter. You produce the letter when you water the vegetables, when you practice
    walking meditation, when you cook for the community. All these practices help
    you become more solid, more peaceful. The mindfulness and concentration you generate
    can help the seed of understanding and compassion in you to grow. When your letter
    comes from the mindfulness you have been generating all day long, then it will
    be a wonderful letter.


    ### Live Each Moment Beautifully


    About fifteen years ago, an American Buddhist scholar visited me while I was in
    the United States. She said, “Dear teacher, you write such beautiful poems. You
    spend a lot of time growing lettuce and doing things like that. Why don’t you
    use your time to write more poetry?”


    She had read somewhere

