    basement—in the form of a seed, until you hear, see, read, or think of something
    that touches your seed of anger. Then it comes up and manifests on the level of
    your mind consciousness, your living room. It manifests as a zone of energy that
    makes the atmosphere in your living room heavy and unpleasant. When the energy
    of anger comes up, we suffer. Whenever anger manifests, the practitioner immediately
    invites the energy of mindfulness to manifest also, through the practice of mindful
    walking and mindful breathing. This way, another zone of energy—the energy of
    mindfulness— is created. It is so important to learn how to practice walking and
    breathing mindfully, how to practice cleaning and working mindfully, how to practice
    mindfulness in our daily life. Then, every time a negative energy manifests, we
    will know how to generate the energy of mindfulness in order to embrace it and
    take care of it.


    ## The Mind Needs Good Circulation, Too


    There are toxins in our body and, if our blood does not circulate well, these
    toxins will accumulate in certain places. In order to remain healthy, our organism
    has to expel these toxins. Massaging will stimulate the blood circulation. When
    the blood circulates well, it can nourish organs like the kidneys, the liver,
    and the lungs so that they can expel toxins from the body. Therefore it is important
    to have good blood circulation. Drinking a lot of water and practicing deep breathing
    can also help expel toxins from the body, through the skin, lungs, urine, and
    excrement. All practices that help eliminate toxins from our system are very important.


    Now suppose I have a very painful spot in my body, because a lot of toxins have
    accumulated there. Every time I touch this spot, it hurts; this is equivalent
    to touching an internal knot in the mind. The energy of mindfulness, the practice
    of mindfulness, is like the practice of massaging an internal formation. You may
    have a block of suffering, pain, sorrow, or despair in you and this is a poison,
    a toxin in your consciousness. You have to practice mindfulness in order to embrace
    and transform the toxin. Embracing your pain and sorrow with the energy of mindfulness
    is exactly the practice of massaging, not our body, but our consciousness.


    Our consciousness may be in a situation of bad circulation. When the blood does
    not circulate well, then our organs cannot function properly and we get sick.
    When our psyche does not circulate well, then our mind will become sick. Mindfulness
    is an energy that stimulates and accelerates circulation throughout blocks of
    pain.


    ## Occupying the Living Room


    Our blocks of pain, sorrow, anger, and despair always want to come up into our
    mind consciousness, into our living room, because they have grown big and need
    our attention. They want to emerge, but we don’t want them to come up because
    they are painful to look at. So we try to block their way. We want them to stay
    asleep down in the basement. Because we do not want to face them, our habit is
    to fill our living room with other guests. But whenever we have ten or fifteen
    minutes of free time, and we don’t know what to do, these internal knots will
    come up and make a mess in the living room.


    To avoid this, we pick up a book, we turn on the television, we go for a drive,
    we do anything to keep our living room occupied. When the living room is occupied,
    these unpleasant internal formations will not come up. All mental formations need
    to circulate, but we don’t want them to come up because we don’t want to feel
    the pain. We want them to stay locked away. We are very afraid, because we believe
    that if we allow them to come up, we will suffer a lot. That is why our daily
    habit is to fill up the living room with guests, like television, books, magazines,
    and conversations, in order to keep these internal formations from surfacing.


    When we continue to do this, we create bad circulation in our psyche, and symptoms
    of mental illness and depression begin to appear. They may manifest in our body
    or in our mind. Sometimes when we have a headache, we take aspirin, but our headache
    does not go away. This kind of headache can be a symptom of mental illness. Sometimes
    we have allergies. We think that it is a physical problem, but allergies can also
    be a symptom of mental illness. We are advised by doctors to take drugs, and so
    we continue to suppress our internal formations, making our sickness worse.


    ## Making Your Unwanted Guests Feel at Home


    When you remove the embargo and the blocks of pain come up, you will have to suffer
    a bit. There is no way to avoid it. And that is why the Buddha said that you have
    to learn how to embrace this pain. It is for this reason that the practice of
    mindfulness is so important. You generate a strong source of energy so that you
    can recognize, embrace, and take care of these negative energies. And since the
    Buddha is in you as the energy of mindfulness, you invite Buddha to come up and
    help you embrace the internal knots. If they don’t want to come up, you coax them
    to come up. After being embraced for some time, they will return back to the basement
    and become seeds again.


    For instance, the Buddha said that all of us have the seed of fear, but most of
    us suppress it and keep it locked in the dark. To help us identify, embrace, and
    look deeply at fear, he offered us the Five Remances:


    - I am of nature to grow old. I cannot escape old age.

    - I am of nature to have ill health. I cannot escape ill health.

    - I am of nature to die. I cannot escape dying.

    - All that is dear to me and everyone I love are of nature to change. There is
    no way to escape separated from them. I come here empty-handed, and I go empty-handed.

    - My actions are my only true belongings. I cannot escape the consequences of
    my actions. My actions are the ground on which I stand.


    Every day we have to practice like this, taking a few moments to contemplate each
    exercise as we follow our breathing. We practice the Five Remrances so that the
    seed of fear can circulate. We must invite it up to be recognized, to be embraced.
    And then when it goes back again, it becomes smaller.


    When we invite our seed of fear up like this, we will be better equipped to take
    care of our anger. Fear gives life to anger. You don’t have peace when fear is
    there, so it becomes the soil on which anger can grow. Fear is based on ignorance,
    and this lack of understanding is also a primary cause of anger. Every time you
    give your internal formations a bath of mindfulness, the blocks of pain in you
    become lighter and less dangerous. So give your anger, your despair, your fear
    a bath of mindfulness every day—that is your practice. If mindfulness is not there,
    it is very unpleasant to have these seeds come up. But if you know how to generate
    the energy of mindfulness, it is very healing to invite them up every day and
    embrace them. After several days or weeks of bringing them up daily and helping
    them go back again, you create good circulation in your psyche, and the symptoms
    of mental illness will begin to disappear. Mindfulness does the work of massaging
    your internal formations, your blocks of suffering. You have to allow them to
    circulate, and this is possible only if you are not afraid of them. If you learn
    not to fear your knots of suffering, you can learn how to embrace them with the
    energy of mindfulness and to transform them.

