    tion that if a disease is not detected early, then it will be very difficult to
    heal. The medical doctors are not thinking in terms of mental formations. They
    are thinking in terms of a hidden disease. But we can also make use of this slogan—
    “Even if you are sure, check again.”


    We have made ourselves suffer, we made a hell for ourselves and our beloved ones
    because of our perceptions. Are you sure of your perception? There are people
    who suffer from a wrong perception for ten or twenty years. They are sure the
    other person has betrayed them or hates them, even though the other person has
    only good intentions. A person who is the victim of a wrong perception makes himself
    and the people around him suffer a lot.


    When you are angry, and you suffer, please go back and inspect very deeply the
    content, the nature of your perceptions. If you are capable of removing the wrong
    perception, peace and happiness will be restored in you, and you will be able
    to love the other person again.


    ## Looking Into Anger Together


    When the other person knows that you are doing your best, looking into the cause
    of your anger, she also is motivated to practice. THICH NHAT HANH 80 2S 1S R 1L
    2L


    While driving, while cooking, she will ask herself, “What have I done? What have
    I said to make him suffer that much?” And she also will have a chance to practice
    looking deeply. She knows that in the past, she has reacted in ways that made
    you suffer. She begins to question her belief that she is not responsible for
    your suffering.


    If she finds out that she was unskillful when saying or doing something, then
    she has to call or fax you to tell you that she is sorry. SoSo if both of you
    get some insight during the week, you don’t need to wait for Friday. Friday evening
    can then become a very joyful time when both of you sit together and enjoy a nice
    meal, or perhaps a cup of tea and a piece of cake. You can celebrate your love
    and your relationship.


    ## Sharing Everything, Even When It’s Difficult


    If neither of you has succeeded in the practice, then Friday is a time for you
    to practice deep listening and loving speech. The one who is angry has the right
    to tell the other what is in his heart. If it is your partner who is angry, you
    just listen, because you have made the promise to listen and not to react. You
    do your best to practice compassionate listening. TRANSFORMATION 81 2S 1S R 1L
    2L


    # Anger : Wisdom for Cooling the Flames


    Listen not for the purpose of judging, criticizing, or analyzing. You listen only
    to help the other person to express himself and find some relief from his suffering.
    When you share your suffering, you have the right to say everything in your heart—it
    is your duty to do so, because the other person has the right to know everything.
    You have made a commitment to each other.


    You should tell him everything that is in your heart, with only one condition—you
    must use calm and loving speech. The moment irritation manifests, the moment you
    think that you are going to lose your calm, your serenity, please stop. “Darling,
    I cannot continue now, may we meet another time? I need to practice more mindful
    walking and breathing. I’m not at my best right now, so I do not think I can succeed
    in the practice of loving speech.”


    The other person will agree to postpone the session until later, perhaps next
    Friday. If you are the one who listens, you also practice mindful breathing. Practice
    mindful breathing to empty yourself of any ideas or notions, in order to listen.
    Listen with compassion, and be there with your whole being to give the other person
    relief. You do have the seed of compassion within you, and it will manifest when
    you see that the other person suffers so much. Therefore you vow to be the Bodhisattva,
    the Great Being of deep listening. This Bodhisattva of Great Compassion must be
    a real person, and not just an idea. THICH NHAT HANH 82 2S 1S R 1L 2L


    ## With Compassion You Don’t Make Mistakes


    You can make a mistake only when you forget that the other person suffers. You
    tend to believe that you are the only one who suffers, and that the other person
    is enjoying your suffering. You will say and do mean and cruel things when you
    believe that you are the only one who suffers and that the other person does not
    suffer at all.


    The awareness that the other person suffers very much will help you to play the
    role of the Bodhisattva of deep listening. Compassion becomes possible, and you
    can keep compassion alive during the whole time of listening. You’ll be the best
    therapist for him or her. During the time the other person speaks, he may be very
    judgmental, only blaming and punishing. He may be very bitter and cynical. Yet,
    because compassion is still in you, this does not affect you.


    The nectar of compassion is so wonderful. If you are committed to keeping it alive,
    then you are protected. What the other person says will not touch off the anger
    and irritation in you, because compassion is the real antidote for anger. Nothing
    can heal anger except compassion. This is why the practice of compassion is a
    very wonderful practice. TRANSFORMATION 83 2S 1S R 1L 2L


    Compassion is possible only when understanding is there. Understanding what? Understanding
    that the other person suffers and that I must help. If I don’t help, who is going
    to help? When listening, you may notice a lot of wrong perceptions in the other
    person’s speech. Still, you remain compassionate, because you know she is a victim
    of wrong perception. If you try to correct her, you may cut her off, preventing
    her from speaking out and fully expressing herself. So just sit and listen with
    all your attention, with your best intentions, and this will be very healing.


    If you want to help correct her wrong perception, you have to wait until the moment
    is right. While listening, your only aim is to give her a chance to speak out
    and share what is in her heart. You don’t say anything. This Friday evening is
    entirely for her to speak. You just listen. Then, perhaps a few days later, when
    she feels much better, you try to give her the information that she needs to correct
    her perception. “Darling, the other day you said something, but that is not really
    what happened. What happened is ...” Use loving speech when you correct her. If
    necessary, ask a friend who knows what really happened to help the other person
    understand the true situation so that she can be freed from her wrong perceptions.
    THICH NHAT HANH 84 2S 1S R 1L 2L


    ## Patience Is the Mark of True Love


    Anger is a living thing. It comes up, and it needs time to go back down. Even
    if you have clear evidence to convince someone his anger is entirely based on
    a wrong perception, please don’t interfere right away. Like craving, jealousy,
    and all afflictions, anger needs time to die down. This is the case even after
    the other person realizes that he or she misunderstood the situation.


    When you turn off a fan, it continues to spin a few thousand times before stopping.
    Anger is like that. Don’t expect the other person to stop being angry right away.
    That’s not realistic. You have to allow anger to die down slowly. So don’t rush.
    Patience is the mark of true love. A father has to be patient in order to show
    his love for his son or daughter. A mother, a son, and a daughter also. If you
    want to love, you must learn to be patient. If you are not patient, you cannot
    help the other person. You must also be patient with yourself. The practice of
    embracing your anger takes time. But just five minutes of mindful breathing, mindful
    walking, and embracing your anger can be effective. If five minutes is not enough,
    take ten minutes, and if ten minutes is not enough, take fifteen min- TRANSFORMATION
