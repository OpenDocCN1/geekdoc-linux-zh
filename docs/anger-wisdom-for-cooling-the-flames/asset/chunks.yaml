    way ofconsuming. We have to live in such a way that we stop consuming the things
    that poison us and intoxicate us. Then, we will have the strength to allow the
    best in us to arise, and we will no longer be victims ofanger, offrustration.
    Everything is possible when the door ofcommunication is open. So we must invest
    ourselves in the practice ofopen- ing up and restoring communication. You have
    to express your willingness, your desire to make peace with the other person.
    Ask him to support you. Tell him, “Communication between us is the most important
    thing to me. Our relation- THICH NHAT HANH 50 2S 1S R 1L 2L


    ship is the most precious thing, nothing is more important.” Make it clear and
    ask for support. You have to start negotiating a strategy. No matter how much
    the other person can do, you have to do all that you are capable ofdoing yourself.
    You must give one hundred percent ofyourself. Whatever you can do for yourself,
    you do for him, or for her. Don’t wait. Don’t put forth conditions, saying, “If
    you don’t make an effort to reconcile, then I won’t either.” This will not work.
    Peace, reconciliation, and happiness begin with you. It is wrong to think that
    if the other person does not change or improve, then nothing can be improved.
    There are always ways to create more joy, peace, and harmony, and you have access
    to them. The way you walk, the way you breathe, the way you smile, the way you
    react, all ofthis is very im- portant. You must begin with this. There are many
    ways to communicate, and the best way is to show that you no longer feel any anger
    or condemnation. You show that you understand and accept the other person. You
    communicate this not only by your words, but also by your way ofbeing—with your
    eyes full ofcompassion and your actions full of tenderness. The fact that you
    are fresh and pleasant to be around already changes a lot. No one can resist coming
    close to you. You become a tree with a cool THE LANGUAGE OF TRUE LOVE 51 2S 1S
    R 1L 2L


    shade, a stream ofcool water. Both people and animals will want to come near you
    because your presence is refreshing and enjoyable. When you begin with yourself,
    you will be able to restore communication, and the other person will change naturally.
    Peace Treaty We tell our beloved one, “My darling, in the past we have madeeachothersuffersomuch,becauseneitherof
    uswas capable ofhandling our anger. Now we have to work out a strategy for taking
    good care ofour anger.” The dharma can remove the heat ofanger, and the fever
    ofsuffering. It is a wisdom that can bring joy and peace in the here and the now.
    Our strategy for peace and reconciliation should be based on this. Whenever the
    energy ofanger comes up, we often want to express it to punish the person whom
    we believe to be the source ofour suffering. This is the habit energy in us. When
    we suffer, we always blame the other person for having made us suffer. We do not
    realize that anger is, first ofall, our busi- ness.We are primarily responsible
    for our anger, but we believe very naively that ifwe can say something or do some-
    thing to punish the other person, we will suffer less. This THICH NHAT HANH 52
    2S 1S R 1L 2L


    kind ofbeliefshould be uprooted. Because whatever you do or say in a state ofanger
    will only cause more damage in the relationship. Instead, we should try not to
    do anything or say anything when we are angry. When you say something really unkind,
    when you do something in retaliation, your anger increases. You make the other
    person suffer, and he will try hard to say or do some- thing back to get relief
    from his suffering. That is how the conflict escalates. This has happened so many
    times in the past. You are both very familiar with the escalation ofanger, ofsuffering,
    and yet you have not learned anything from it. Trying to punish the other person
    is only going to make the situation worse. Punishing the other person is self-punishment.
    That is true in every circumstance. Every time the United States Army tries to
    punish Iraq, not only does Iraq suffer, but the U.S. also suffers. Every time
    Iraq tries to punish the U.S., the U.S. suffers, but Iraq also suffers. The same
    is true every- where; between the Israeli and Palestinian, between the Mus- lim
    and Hindu, between you and the other person. It has always been like that. So
    let us wake up; let us be aware that punishing the other is not an intelligent
    strategy. Both you and the other person are intelligent. You can use your intelli-
    gence. You must come together and agree on a strategy for taking care ofyour anger.
    You both know that trying to pun- THE LANGUAGE OF TRUE LOVE 53 2S 1S R 1L 2L


    ish each other is not wise. So promise each other that every time you get angry,
    you will not say or do anything out of anger. Instead, you will take care ofyour
    anger by going back to yourselves—practicing mindful breathing and mindful walking.
    Take advantage ofthe moments when you are happy to- gether to sign the contract,
    your peace treaty, a treaty oftrue love. Your peace treaty should be written and
    signed entirely on the basis oflove, not like a peace treaty signed by politi-
    cal parties. They base their treaties only on national self- interest. They are
    still full ofa lot ofsuspicion and anger. But your peace treaty must be purely
    a love treaty. Embracing Anger The Buddha never advised us to suppress our anger.
    He taught us to go back to ourselves and take good care of it. When something
    is physically wrong with us, in our in- testines, our stomach, or our liver, we
    have to stop and take good care ofthem. We do some massage, we use a hot-water
    bottle, we do everything possible in order to take care of them. Just like our
    organs, our anger is part ofus. When we are angry, we have to go back to ourselves
    and take good care of THICH NHAT HANH 54 2S 1S R 1L 2L'
