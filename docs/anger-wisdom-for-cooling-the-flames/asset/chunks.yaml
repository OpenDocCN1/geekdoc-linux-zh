    Violence causes. Every time they commit an act of violence, they are doing it
    to themselves as well as others. They may feel that committing these acts of violence
    and expressing anger will lessen their anger. But the anger in them will only
    continue to grow. When you drop bombs on your enemy, you drop the same bombs on
    yourself, on your own country. During the war in Vietnam, the American people
    suffered just as much as the Vietnamese people. The wounds of war are as deep
    in America as in Vietnam. Stopping violence is what we have to do. And we cannot
    stop violence unless we have the insight that what we do to the other person,
    we are doing to ourselves. Teachers must show students that when they are violent,
    they themselves will suffer. But teachers cannot just tell them this, they have
    to be more creative than that. We should not be dogmatic in our way of sharing
    insight with others. We should be flexible and intelligent, using “skillful means.”
    Skillful means is very important. A Great Being has to be skillful in the practice
    and in helping other people.


    # Stopping Wars Before They Happen


    The majority of us wait until a war breaks out in order to begin some kind of
    effort to stop it. Many of us do not know that the roots of war are everywhere,
    including in our own thinking and way of life. We are not capable of seeing the
    war while it is still hidden. We begin to focus our attention on the war only
    when the war breaks out into the open and people start talking about it. Then
    we feel overwhelmed by the intensity of the war. We feel helpless. We take sides
    and feel that one is right and the other is wrong. We condemn one side, but we
    have nothing to contribute towards ending the destruction caused by the war.


    As a true practitioner, you have to practice looking deeply into the situation
    to see the war before it starts. You have to begin acting in order to stop the
    war before it breaks out into the open. With your insight and awareness, you can
    help other people to wake up and develop the same awareness. Then, together you
    can act skillfully in order to prevent the war from breaking out into the open.


    The countries of `NATO` thought that violence, bombing Belgrade, was the only
    solution to ending racial discrimination in the former Yugoslavia. They believed
    that there was no other way. They were not able to see and respond to the roots
    of war, which were already apparent before the war started, because their capacity
    of looking deeply, of meditation is limited. Violence can never bring about peace
    and understanding. Only by looking deeply in order to understand the true roots
    of violence can we achieve peace.


    NO ENEMIES


    If you are a good meditator, you may have deeper insight than others, and you
    may know better ways to stop racial discrimination without resorting to bombs
    or other violent means. There are many wars about to break out everywhere on the
    planet. If you are really a person of peace, you should be aware of that, and
    try your best, together with your community, to stop these wars before they blow
    up, causing extreme violence.


    If you want to stop violent interventions like the one in `Kosovo`, then you have
    to offer an alternative. If you have a good idea, you can transmit that idea to
    your congressperson or senator and urge them to intervene so that a more positive
    course of action can be taken. We need to learn to meditate as a nation, not only
    as individuals, in order to achieve the kind of insight that will be able to stop
    war and violence.


    # Collective Insight


    There is a young man who is a vegetarian, not because he is fanatic or dogmatic,
    but out of mindfulness. He does not eat the flesh of animals because he doesn’t
    have the heart to eat them. His father was very unhappy about this, and so there
    was no harmony or joy in his home. The young man knew that he could not stop being
    vegetarian, because he would be miserable if he had to eat animals. He could not
    change just to please his father, but he did not want this tense atmosphere to
    continue. He used his intelligence; he did not remain passive.


    One day he came home with a `videotape`, and said, “Dad, here’s a wonderful documentary
    film.” He then showed a video about the slaughter of animals to his father and
    the whole family. His father experienced so much suffering in watching animals
    being slaughtered that after having seen that film, he did not want to eat meat
    anymore. The insight was direct; it was not an idea. Instead of using anger, instead
    of letting suffering overwhelm him, the young man acted out of loving-kindness,
    wisdom, and intelligence. He was able to convince the whole family not to eat
    animals so that compassion could be nourished within each one of them. The act
    of showing that documentary film was very skillful, and full of love. With skillful
    action, you can win a very big victory.


    As an individual, you may have some insight, and that insight gives rise to compassion
    and a willingness to act. But as an individual, you can only do so much. If other
    people do not have the same insight, you have to do your best to make your insight
    a collective one. Yet you cannot force your insight on others. You may force them
    to accept your idea, but then it is simply an idea, not a real insight. Insight
    is not an idea. The way to share your insight is to help create the conditions
    so that others can realize the same insight—through their own experience, not
    just believing what you say. This takes skillfulness and patience.


    # Helping Love to Reappear


    There is a sister in `Plum Village` who is still very young—twenty-two. She was
    able to help a mother and daughter to reconcile just after they vowed never to
    see each other again. In a period of three hours, she was able to help the mother
    and the daughter resolve their conflict. In the end, both of them practiced hugging
    meditation. They gently took each other in their arms and breathed in and out
    mindfully several times. They practiced, “Breathing in, I am aware that I am alive;
    breathing out, I am aware that my beloved one is still alive, here in my arms.”


    They practiced to be mindful of the gift of each other’s presence and were deeply
    in touch with the present moment, putting one hundred percent of themselves in
    the act of embracing the other. It was very healing. Through the practice, they
    realized that they loved each other very much. They did not know that they loved
    each other so much, because they had not been skillful in their relationship,
    in their way of speaking and listening. Just because anger or hate is present
    does not mean that

