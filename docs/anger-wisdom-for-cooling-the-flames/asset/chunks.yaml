    your best, I have confidence and I respect you because you are a real practitioner.
    You are faithful to what you have learned, the teachings and your community of
    practice. When you practice these three sentences, you are embracing your teacher
    and your sangha in your heart. Because you are doing your best, I end up doing
    my best. I go back to myself and practice. In order to be worthy of you, I have
    to look deeply, and also do my best. I have to ask myself, “What did I say, what
    did I do to have made her or him suffer like that? Why did I do that?”


    Just listening to you, just reading the Peace Note you gave me, I can recover
    myself. The dharma, after having touched you, is now beginning to touch me, and
    it is my turn to be inhabited by the energy of mindfulness. So when the other
    person receives your message, a message communicated by loving speech, he will
    be inspired by your love, by your language, and by your practice. A lot of awakening
    and respect is born in him when the message has gotten across. He will be willing
    to go back to himself and reconsider whether he has done or said anything that
    has made you suffer. In this way you have conveyed to him your practice. He will
    see that you are doing your best. And in order to respond to that, he also will
    want to do his best. He will say silently to himself: “Darling, I am also doing
    my best.”


    THE LANGUAGE OF TRUE LOVE 61 2S 1S R 1L 2L


    This is wonderful; both of you are practicing. The dharma has inhabited both of
    you. The Buddha is alive in each of you. There is no danger anymore. You have
    come back to yourself, practicing looking deeply in order to truly understand
    the situation. If during this time, one of you experiences an insight into what
    is really going on, then you have to tell the other person right away what you
    have discovered. Perhaps you become aware that you became angry because of a wrong
    perception. When you have such an insight, you have to tell the other person right
    away. You must let her know that you are sorry that you got angry for nothing.
    She did not do anything wrong at all. You got angry because you misunderstood
    the situation. Telephone her, fax her, e-mail her, because she is still very concerned
    about your suffering. This will give her relief right away.


    In looking back, the other person may also realize that she has said or done something
    out of irritation or because of a wrong perception. She regrets what she has said
    or done to you, and so she also has to share her insight. “Darling, the other
    day, I was not very mindful. I said something incorrect. I had a misperception.
    I did something unkind, and I see it was because I was not skillful enough. I
    did not mean to make you suffer. So I apologize and I promise that next time,
    I’ll be more skillful, more mindful.”


    THICH NHAT HANH 62 2S 1S R 1L 2L message, you stop suffering, and in your heart,
    you feel a lot of respect for the other person. Now, the other person is a co-practitioner.
    Your mutual respect for each other continues to grow, and respect is the foundation
    of true love.


    ### Special Guest

    In the Vietnamese tradition, husband and wife are expected to treat each other
    like a guest. You really respect each other. When you change your clothes, you
    don’t change in front of each other. You behave with reverence. If respect for
    the other person is no longer there, true love cannot continue for long. Respecting
    each other, treating each other as a guest, is traditional in Asian society. I
    believe this attitude existed in the West also, at least in old times. Without
    such mutual respect, love cannot last for a long time. Anger and other negative
    energies will begin to dominate.


    In the wedding ceremonies performed in Plum Village, our retreat center in France,
    the couple bows to each other, to show their respect. This is because each person
    has the Buddha nature within—the capacity to be enlightened, to develop great
    compassion and great understanding. When you bow to your partner with respect,
    you notice your love. If you no longer have any respect for the other person,
    love is THE LANGUAGE OF TRUE LOVE 63 2S 1S R 1L 2L dead. This is why we have to
    be very careful to nourish and sustain our mutual respect. Using these three sentences
    of true love, looking deeply to acknowledge our responsibility in the conflict,
    is a very concrete way to express our respect and nourish our love. Do not underestimate
    the three sentences of true love.


    ### Pebble in Your Pocket

    Every molecule of these three sentences consists entirely of true love. Love can
    handle anything. You may like to write these three sentences down on a piece of
    paper the size of a credit card and slip it into your wallet. Revere that sheet
    of paper as something that can save you because it will remind you of your commitment
    to each other.


    Some of us keep a pebble in our pocket, a beautiful pebble we picked up in the
    front yard. We washed it very carefully and always carry it with us. Every time
    we put our hands in our pocket, we touch the small pebble, and hold it gently.
    We practice mindful breathing and we feel very peaceful. When anger arises, the
    pebble becomes the dharma. It reminds us of our three sentences. Just holding
    the pebble, breathing in and out calmly and smiling, can help you tremendously.
    It sounds a little bit childish, but this practice is very useful.


    When you THICH NHAT HANH 64 2S 1S R 1L 2L are in school, at work, or out shopping,
    you have no reminders to bring you back to yourself. So the little pebble in your
    pocket serves as your teacher, as your fellow practitioner—it is a bell of mindfulness,
    allowing you to pause and return to your breathing. Many people invoke the name
    of Jesus or Buddha Amitabha with a rosary. The pebble is a kind of rosary, a reminder
    that your teacher is always with you, your dharma brothers and sisters are always
    with you. It will help you to go back to your breathing, allow love to be born
    in you, and keep that love in you alive. It can help keep enlightenment alive
    in you. THE LANGUAGE OF TRUE LOVE 65 2S 1S R 1L 2L INTENTIONAL BLANK


    #### Zones of Energy

    We know that when anger is present in us we should refrain from reacting, namely
    from speaking, or doing anything. To say something, to do something while you
    are angry is not wise. We are urged to go back to ourselves in order to take good
    care of our anger. Anger is a zone of energy in us. It is part of us. It is a
    suffering baby that we have to take care of. The best way to do this is to generate
    another zone of energy that can embrace and take care of our anger. The second
    zone of energy is the energy of mindfulness. Mindfulness is the energy of the
    Buddha. It is available to us, and we are capable of generating it 67 2S 1S R
    1L 2L FOUR TRANSFORMATION

