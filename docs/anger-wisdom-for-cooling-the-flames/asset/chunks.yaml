- fmt: "\nHave to offer the incense of the heart, namely the incense of mindfulness.\
    \ The incense of concentration, the incense of insight. Burning incense without\
    \ mindfulness wouldn’t work. David sat there and thought deeply about his situation.\
    \ He saw that he had not succeeded with his parents, with his brothers and sisters,\
    \ with his friends, with his society. He had even failed with Angelina. \n\nHe\
    \ began to see that he always blamed other people for his suffering. This was\
    \ the first time he had a few moments of `concentration` and he began to have\
    \ some `insight`. This was the first time in his life he sat down quietly and\
    \ saw that he had been unjust to his parents, and that communication was not possible\
    \ partly because of him. He had blamed everyone. He hadn’t understood until now\
    \ that he was responsible. Even with such a sweet and beautiful person like Angelina,\
    \ he had not succeeded. \n\nFor the first time, tears ran down his cheeks, and\
    \ he was truly sorry for the way he had treated his parents, brothers, sisters,\
    \ and friends. He remembered the time he came home drunk, very late at night,\
    \ beat Angelina and abused her. He thought of all of this, and suddenly a drop\
    \ of compassion penetrated his heart, a heart so full of suffering and afflict.\
    \ And he continued crying. The more he cried, the more refreshed he felt in his\
    \ heart. A transformation took place within him. \n\nHe began to understand what\
    \ Angelina had tried to tell him, about how to live according to the `Five Mindfulness\
    \ Trainings`, about practicing deep listening and loving speech. He felt a willingness\
    \ to begin anew, and he told himself that if Angelina ever came back, he would\
    \ be a different person. “I will know how to take care of her, and how to make\
    \ happiness possible.”\n\nAt that moment there was a knock on the door. Angelina\
    \ was back. Although David had practiced barely one hour, his transformation was\
    \ profound.\n\n### David and Angelina Are Among Us\nDo not think that David is\
    \ only a person in a story, a person of the past. No. David is still alive; he\
    \ sits here among us. Angelina, too. Remember that David was intelligent, handsome,\
    \ but he had a very strong habit energy of always blaming others for his misery.\
    \ He couldn’t communicate with his parents, his brothers, his sisters, or his\
    \ friends. He made them suffer. He did not want to make them unhappy, but his\
    \ habit energy was too strong, so he could not avoid it. \n\nHe was lonely, and\
    \ he thought that he was the only one in the world who was that lonely. All of\
    \ us have this need—it is very human. We need someone who can really understand\
    \ us and help us confront the difficulties of life.\n\nSo, it is not difficult\
    \ to understand David. You understand his deepest desire. You understand his difficulties.\
    \ One day, Angelina stepped into his life. From time to time, this kind of good\
    \ fortune happens to us, too. Sometimes a very nice person steps into our life.\
    \ And if we know how to take care of that person, our life becomes more meaningful.\
    \ But if we don’t know how to take care of ourselves and our habit energy, we\
    \ will not know how to take care of our Angelina. So we become angry with her,\
    \ and we mistreat her. That is why Angelina has left us, because she suffered\
    \ so much from our behavior.\n\n### Keeping Angelina in Our Life\nThe minute Angelina\
    \ stepped down from the painting and became a real person, she smiled a heavenly\
    \ smile at David. She looked at the bowl of the noodles and she said, “How can\
    \ you eat such junk food? Just a minute.”\n\nThen she disappeared. And in no time\
    \ at all, she reappeared with a basket of green vegetables. She prepared a very\
    \ delicious bowl of noodles for David quite different from the instant ones he\
    \ was used to eating. Angelina is talented. She knows how to make you happy. But\
    \ you were not grateful, and you lacked understanding. \n\nYou were not capable\
    \ of keeping your Angelina, and that is why she left. Maybe you are Angelina,\
    \ and because your David was so difficult to be with, you have left your David.\
    \ Although you did your best to help him, it was impossible to live with him.\
    \ He was not capable of recognizing that you are his Angelina. His habit energy\
    \ pushed him to continue to live and consume away that poisoned his body and mind.\
    \ \n\nMaybe he went to the bar every night and got drunk. And no matter how much\
    \ you pleaded with him, he could not stop drinking. And every night he came home\
    \ drunk and beat you. He was not able to listen to you at all. No matter how hard\
    \ you tried to be sweet, to be patient, he always cut you off, and didn’t allow\
    \ you to finish your sentence. He was never capable of listening to you. You were\
    \ patient, but you have your limits. Communication was impossible and so you gave\
    \ up.\n\n### Where Is Your Angelina Now?\nWho is David, and who is Angelina? I\
    \ would like you to answer this question. Are you David? If you are David, then\
    \ where is your Angelina now? Is she still with you, or has she left you? What\
    \ have you done to her? How did you treat her?\n\nDid you take good care of her?\
    \ Were you able to make her happy? We have to ask ourselves all these questions.\
    \ “Where is my Angelina now? Where is she? What have I done to her?” These are\
    \ very important questions that help us to look deeply. This is meditation, true\
    \ meditation. David might be your partner. Angelina might be your partner. Angelina\
    \ can be a man or a woman, David as well. Angelina stepped into your life. In\
    \ the beginning you were so happy to be with her, you cherished her presence.\
    \ You thought that with her, life was possible. But you were not able to maintain\
    \ that awareness. You lost the awareness that Angelina was life’s gift to you.\
    \ You made her suffer so much that she left you. There was a time when she pleaded\
    \ with you to practice the `Five Mindfulness Trainings`, but because of your habit\
    \ energy, you never accepted. She begged you to consume in moderation, and to\
    \ stop drinking. She invited you to use loving speech, to listen deeply, to associate\
    \ with good people and not with those who water negative seeds in you. But you\
    \ never listened to her. You continued with your way of life, pushed by your habit\
    \ energy, and that is why she had to leave. Your Angelina may be your daughter\
    \ or your son. He or she has come into your life. How have you treated him or\
    \ her?\n\n### Beginning New\nIn our daily life we run continuously. We do not\
    \ have the capacity or the opportunity to stop and look deeply into our life.\
    \ We must look back, and look deeply in order to understand. David sat for forty-five\
    \ minutes in his room, looking back at his life. He gained a lot of insight and\
    \ he began to cry. He cried for the first time in his life because he recognized\
    \ his habit energy and the damage he had caused to the people around him, his\
    \ parents, his friends, his brothers and sisters, and himself. We may practice\
    \ sitting meditation everyday, but have we\n"
