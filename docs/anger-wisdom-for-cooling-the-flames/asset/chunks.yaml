    # APPENDIX D


    ## Thich Nhat Hanh


    Thich Nhat Hanh has lived an extraordinary life in an extraordinary time. Since
    the age of sixteen he has been a Buddhist monk, a peace activist, and a seeker
    of the way. He has survived persecution, three wars, and more than thirty years
    of exile. He is the master of a temple in Vietnam whose lineage goes back over
    two thousand years and, indeed, is traceable to Buddha himself. The author of
    more than one hundred books of poetry, fiction, and philosophy, Thich Nhat Hanh
    has founded universities and social service organizations, and rescued boat people;
    he led the Vietnamese Buddhist delegation at the Paris Peace Talks and was nominated
    for the Nobel Peace Prize by the Reverend Martin Luther King, Jr. He makes his
    home in France and Vermont.


    ## Retreat Communities


    Thich Nhat Hanh has retreat communities in southwestern France (Plum Village),
    Vermont (Green Mountain Dharma Center), and California (Deer Park), where monks,
    nuns, laymen, and laywomen practice the art of mindful living. Visitors are invited
    to join the practice for at least one week.


    For information, please write to:

    - `Plum Village`: 13 Martineau 33580 Dieulivol France

    - `NH-office@plumvillage.org` (for women)

    - `LH-office@plumvillage.org` (for women)

    - `UH-office@plumvillage.org` (for men)

    - `www.plumvillage.org`


    For information about our monasteries, mindfulness practice centers, and retreats
