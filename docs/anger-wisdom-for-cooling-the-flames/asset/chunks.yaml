    暴力产生的原因。每当他们实施暴力行为时，他们不仅在伤害他人，也在伤害自己。他们可能觉得实施暴力行为和表达愤怒可以减轻他们的愤怒。但他们内心的愤怒只会不断增长。当你向敌人投掷炸弹时，你也是向自己、向自己的国家投掷了同样的炸弹。在越南战争期间，美国人遭受的痛苦与越南人一样多。战争的伤痕在
    във和越南一样深。我们必须做的是停止暴力。如果我们没有这种洞察力，即意识到我们对他人的所一切其实都是对自己所做的，我们就无法停止暴力。老师必须向学生展示，当他们采取暴力时，他们自己也会遭受痛苦。但老师不能仅仅告诉他们这些，必须比这更有创造性。我们在与他人分享洞察力时不应该是教条的。我们应该是灵活且智慧的，运用“方便法”（skillful
    means）。方便非常重要。一个大者在修行和帮助他人方面必须是圆巧的。


    # 在战争爆发前制止它


    我们大多数人等到战争爆发，才开始尝试停止停止它。我们中许多人不知道战争的根源无处不在，包括在我们自己的思维和生活方式中。我们无法在战争仍然隐藏时就预见到它。只有当战争公开爆发人们开始谈论它时，我们才开始关注战争。那时，我们会被战争的激烈程度所压倒。我们感到无力。我们选择站队，觉得一方是正确的，另一方是错误的。我们谴责一方，但对于结束战争造成的破坏，我们无任何贡献。


    作为一名真正的修行者，你必须练习深度观察情况，在战争开始之前预见到它。你必须开始行动，以便在战争爆发之前制止它。凭借你的洞察力和意识，你可以帮助他人觉醒并培养出同样的意识。然后，你们可以共同圆巧地行动，防止战争公开爆发。


    `NATO`国家认为，暴力（轰炸贝尔格莱德）是结束前南斯拉夫地区种族歧视的唯一解决方案。他们认为没有其他办法。他们无法看到并回应战争的根源，而这些根源在战争开始之前就已经显而易见，因为他们深度观察和冥想的能力是有限的。暴力永远无法带来和平与理解。只有通过深度观察来理解暴力的真正根源，我们才能获得和平。


    没有敌人


    如果你是一个良好的冥想者，你可能比别人有更深刻的洞察力，你可能知道更好的方法来停止种族歧视，而无需诉诸炸弹或其他暴力手段。地球上到处都有战争即将爆发。如果你是一个真正的和平主义，你应该意识到这一点，并与你的社区一起尽力，在这些战争爆发并导致极端暴力之前制止它们。


    如果你想停止像`Kosovo`（科索沃）那样的暴力干预，你就必须提供替代方案。如果你有一个好主意，可以将主意传给你的议员或参议员，敦促他们干预，以便采取更积极的行动方案。我们需要学习作为一个国家去冥想，而不仅仅是个人，以便获得那种能够停止战争和暴力的洞察力。


    # 集体洞察力


    有一个年轻人是素食主义者，并不是因为他狂热或教条，而是出于正念。由于他不吃动物的肉，因为他不忍心吃掉它们。他的父亲对此非常不愉快，因此家里没有和谐或快乐。这个年轻人知道自己不能停止素食，因为如果他被迫吃动物，他会过得很痛苦。他不能仅仅为了取悦父亲而改变，但他不想让这种紧张的气氛持续下去。他运用智慧，没有保持被动。


    一天，他带了一带`videotape`（录像带）回家说：“爸爸，这是一部很棒的纪录片。”他向父亲和全家人展示了一个关于屠杀动物的视频。父亲看到动物被屠杀时经历了巨大的痛苦，看完电影后，他再也不想吃肉了。这种洞察是直接的，而不是一个想法。年轻人没有使用愤怒，也没有让痛苦淹没他，而是出于慈、智慧和智慧行动。他能够说服全家人不吃动物，让慈悲在每个人心中生长。展示那部纪录片的行为非常圆巧，充满了爱。通过圆巧的行动，你可以赢得巨大的胜利。


    作为个人，你可能有一些洞察力，这种洞察力产生了慈悲和行动的意愿。但作为个人，你能做的是有限的。如果其他人没有同样的洞察力，你必须尽力让你的洞察力成为集体的。然而，你不能将你的洞察力强加于他人。你可以强他们接受你的观点，但那仅仅是一个观点，而不是真正的洞察力。洞察力不是想法。分享你的洞察力的方法是帮助创造条件，让他人实现同样的洞察——通过他们自己的经历，而不是仅仅相信你所说的。这需要技巧和耐心。


    # 让爱重新出现


    `Plum Village`（梅花村）有一位非常年轻的姐姐——二十二岁。在一个母女发誓再也不见对方之后，她就帮助了她们和解。在三个小时内，她帮助母女化解了冲突。最后，两人都练习了拥抱冥想。他们温柔地将对方拥在怀中，正念地呼吸几次。他们练习道：“吸气，我感知到我活着；呼气，我感知到我爱的人还活着，就在我的怀里。”


    他们练习正念对方陪伴的礼物，并与当下保持深度接触，将百分之百的自我投入拥抱对方的行为中。这非常有疗愈作用。通过练习，他们意识到彼此深爱对方。他们不知道自己爱得如此深，因为在关系中、在说话和倾听的方式上并不圆巧。即使愤怒或仇恨存在，并不意味着

