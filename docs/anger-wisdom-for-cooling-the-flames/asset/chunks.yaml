- fmt: "\nThe method of looking deeply into the nature of our perceptions, and the\
    \ method of looking deeply into the other person is to realize that she also suffers\
    \ a lot and needs help. These methods are very practical, and they come directly\
    \ from Buddha. \n\nTo breathe in consciously is to know that the air is entering\
    \ your body, and to breathe out consciously is to know that your body is exchanging\
    \ air. Thus, you are in contact with the air and with your body, and because your\
    \ mind is being attentive to all this, you are in contact with your mind, too;\
    \ just as it is. It needs only one conscious breath to be back in contact with\
    \ yourself and everything around you, and three conscious breaths to maintain\
    \ the contact.\n\nWhenever you are not standing, sitting, or lying down, you are\
    \ going. But where are you going? You have already arrived. With every step, you\
    \ can arrive in the present moment, you can step into the Pure Land or into the\
    \ Kingdom of God. When you are walking from one side of the room to the other,\
    \ or from one building to another, be aware of the contact of your feet with the\
    \ earth and be aware of the contact of the air as it enters your body. It may\
    \ help you to discover how many steps you can make comfortably during an inhale\
    \ and how many during an out-breath. As you breathe in, you can say “in,” and\
    \ as you breathe out, you can say “out.” Then you are practicing walking meditation\
    \ all day PUTTING OUT THE FIRE OF ANGER 25 2S 1S R 1L 2L\n\n## What Do We Look\
