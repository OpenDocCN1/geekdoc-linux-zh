    # 倾听以缓解


    深度倾听，慈悲的倾听并不是为了分析甚至揭露过去发生的事情而倾听。你首先倾听是为了给对方解脱，给他们倾诉的机会，让他们觉得终于有人理解了他或她。


    深度倾听是一种帮助我们在对方说话时保持慈悲心的倾听方式，对方说话可能会持续半小时或四十五分钟。在这段时间，你心中只有一个念头，一个愿望：通过倾听给对方一个倾诉的机会，让他们少受苦。这是你唯一的目的。像分析、理解过去等其他事情可以是这项工作的副产品。但首先，要带着慈悲倾听。


    ## 慈悲是愤怒与怨恨的解药


    如果你在倾听时保持慈悲，那么愤怒和烦躁就不会产生。否则，他说的话、她说的话将引发你的烦躁、愤怒和痛苦。唯有慈悲才能保护你不免于变得焦虑、愤怒或充满绝望。


    因此，你在倾听时想要像一位伟者一样行动，因为你知道对方正承受巨大的痛苦，需要你介入并拯救。但你必须配备相应的装备来完成工作。当消防员来帮忙灭火时，他们必须拥有正确的设备。他们必须有梯子、水以及能够保护他们免受火伤害的衣服。他们必须知道许多保护自己和灭火的方法。


    当你深层倾听一个受苦的人时，你就进入了一个火区。在你所倾听的人身上，正燃烧着痛苦和愤怒之火。如果你没有准备好装备，你就无法提供帮助，并可能成为他人之火的受害者。这就是为什么你需要装备。


    你这里的装备是慈悲，它可以通过正念呼吸练习来滋养和保持。正念呼吸产生正念的能量。正念呼吸保持你的基本愿望，即帮助对方倾诉的愿望。当对方说话时，他的话可能充满了怨恨、谴和评判。这些话可能会引发你内心的痛苦。但如果你通过正念呼吸练习保持内心的慈悲，你就得到了保护。你有能力坐在那里倾听一小时而不感到痛苦。你的慈悲将滋养你，因为你知道你正在帮助**一和（THICH
    NHAT HANH）**的人少受苦。


    扮演菩萨的角色。你将成为最优秀的治疗师。慈悲源于快乐，也源于理解。当慈悲和理解并存同时，你是安全的。对方所说的话不会让你痛苦，你可以深层倾听。你真的在倾听。


    当你没有能力带着慈悲倾听时，你不能仅仅假装在倾听。对方会意识到你满脑都是关于痛苦的想法，但并没有真正理解他或她。当你拥有理解时，你可以带着慈悲倾听，你可以深层倾听，而这种倾听的质量正是你练习的成果。


    ## 滋养我们


    接触痛苦可以帮助我们滋养慈悲，并能在快乐出现时识别它。如果我们不接触痛苦，就不知道真正的快乐是什么。因此，接触痛苦是我们的练习。但我们每个人都有局限。我们不能做超出能力范围的事。这就是为什么我们必须照顾好自己。


    如果你过分倾听痛苦和愤怒，你会受到影响。你只会与痛苦接触，而没有机会接触其他积极的元素。这将破坏你的平衡。


    因此，在日常生活中，你必须练习，让自己能够接触那些并非不断表达痛苦的元素：天空、鸟儿、树木、花朵、孩子——任何在我们身上和周围让我们感到清爽、治愈和滋养的事物。有时你会迷失在自己的痛苦和忧虑中。让你的朋友营救你。他们可能会说：“看看今天早上天空有多美。虽然有雾，但真的很美。天堂就在这里。你为什么不回到当下，见证这种美呢？”


    你与群体在一起，与能够获得快乐的兄弟姐妹在一起。因此，群体营救了你，并帮助你重新接触生活的积极元素。这就是滋养的练习。这非常重要。我们应该能够深度地度过每一天，带着喜悦、和平慈悲，因为时间过得如此快。


    每天早晨，我向佛供一香。我承诺自己，将享受给予我的每一分钟。正亏了正念行走和正念呼吸的练习，我才能深度享受日常生活的每一个时刻。正念呼吸和正念行走就像两个朋友，始终帮助我深入此时此刻，触碰生活中各种奇迹。我们需要接受应得的滋养。听钟声是非常滋养且愉悦的**一和（THICH
    NHAT HANH）**练习。


    在灵源禅（Plum Village），每当电话响起、时钟敲响或寺院钟声响起，我们都有机会停止正在做的一切事情，停止说话和思考。这些是正念的钟。当我们听到钟声时，我们放松身体，回到呼吸。我们意识到自己是活着的，可以接触到许多在我们面前的奇迹。我们自然地停下来，带着享受的心，而不是庄重或僵硬。深呼吸三次，享受我们活着的这一事实。当我们停下时，我们恢复了平静与和平，我们变得自由。我们的工作变得更加愉快，周围的人也变得更加真实。


    随钟声停止并呼吸的练习，是一种帮助你接触日常生活中美丽且滋养元素的练习示例。你可以独自这样做，但通过僧团（sangha），你可以做得轻松得多。群体一直在那里。当你迷失在痛苦中时，它可以营救你，并让你重新接触生活的积极元素。知晓局限是我们的练习。


