    \ of our daily life. The time when you begin to write down the music or the poems\
    \ is only the time of delivering the baby. The baby has to be in you already in\
    \ order for you to deliver it. But if the baby is not in you, even if you sit\
    \ for hours and hours at your desk, there’s nothing to deliver, and you cannot\
    \ produce anything. Your insight, your compassion, and your ability to write in\
    \ a way that will move the other person’s heart are flowers that bloom on your\
    \ tree of practice. We should make good use of every moment of our daily life\
    \ in order to allow this insight and compassion to bloom.\n\n## The Gift of Transformation\n\
    \nA pregnant mother can be very happy every time she thinks of the baby inside\
    \ of her. The baby, although not born yet, can give the mother a lot of joy. Every\
    \ moment of her daily life, she is aware of the baby’s presence, so she does everything\
    \ with love. She eats with love, she drinks with love because she knows that without\
    \ her love, the baby may not be healthy. She’s very careful all the time. She\
    \ knows that if she makes a mistake, if she smokes a lot, if she drinks a lot\
    \ of alcohol, this will not be good for her baby. So she’s very mindful, and she\
    \ lives with the mind of love.\n\nPractitioners have to act very much like a mother.\
    \ We know that we want to produce something, we want to offer something to humanity,\
    \ to the world. Each of us carries within ourselves a baby—the baby Buddha, and\
    \ it is the baby Buddha in us that we can offer. We must live in mindfulness in\
    \ order to take good care of our baby Buddha. It is the energy of the Buddha in\
    \ us that allows us to write a real love letter and reconcile with another person.\
    \ A real love letter is made of insight, understanding, and compassion. Otherwise\
    \ it is not a love letter. A true love letter can produce a transformation in\
    \ the other person, and therefore in the world. But before it produces a transformation\
    \ in the other person, it has to produce a transformation within you. The time\
    \ you take to write the letter may be your whole life.\n\n## PEACE TREATY\n\n\
    At Plum Village, couples, family members, or friends often sign this treaty in\
    \ a ceremony in which the whole community is present. However, you can adapt it\
    \ in any way that makes you feel comfortable. At the end are Buddhist references,\
    \ but please feel free to change them to match your own spiritual tradition.\n\
    \n### PEACE TREATY\n\nIn Order That We May Live Long and Happily Together, In\
    \ Order That We May Continually Develop and Deepen Our Love and Understanding,\
    \ We, the Undersigned, Vow to Observe and Practice the Following:\n\n**I, the\
    \ one who is angry, agree to:**\n\n1. Refrain from saying or doing anything that\
    \ might cause further damage or escalate the anger.\n2. Not suppress my anger.\n\
    3. Practice mindful breathing and go back to myself to take care of my anger.\n\
    4. Calmly, within twenty-four hours, tell the one who has made me angry about\
    \ my anger and suffering, either verbally or by delivering a Peace Note.\n5. Ask\
    \ for an appointment later in the week, like Friday evening, either verbally or\
    \ by note, to discuss this matter more thoroughly.\n6. Not say: “I am not angry,\
    \ it’s okay, I am not suffering. There is nothing to be angry about.”\n7. Look\
    \ deeply into my daily life, while sitting, walking, lying down, working, and\
    \ driving in order to see:\n   - The ways that I myself, have been unskillful\
    \ at times.\n   - How I have hurt the other person because of my own habit energy.\n\
    \   - How the strong seed of anger in me is the primary cause of my anger.\n \
    \  - How the other person is only the secondary cause.\n   - How the other person\
    \ is only seeking relief from his or her suffering.\n   - That as long as the\
    \ other person suffers, I cannot be truly happy.\n8. Apologize immediately, without\
    \ waiting for the Friday appointment, as soon as I recognize my unskillfulness\
    \ and lack of mindfulness.\n9. Postpone the Friday meeting if I do not feel calm\
    \ enough to meet with the other person.\n\n**I, the one who has made the other\
    \ angry, agree to:**\n\n1. Respect the other person’s feelings, not ridicule him/her\
    \ and allow enough time for him/her to calm down.\n2. Not press for an immediate\
    \ discussion.\n3. Confirm the other person’s request for a meeting, either verbally\
    \ or by note, and assure him or her that I will be there.\n4. If I can apologize,\
    \ do so right away and not wait until Friday evening.\n5. Practice mindful breathing\
    \ and deep looking to see how:\n   - I have seeds of anger and unkindness as well\
    \ as habit energy, which makes the other person unhappy.\n   - I have mistakenly\
    \ thought that making the other person suffer would relieve my own suffering.\n\
    \   - By making him/her suffer, I make myself suffer.\n6. Apologize as soon as\
    \ I realize my unskillfulness and lack of mindfulness, without making any attempt\
    \ to justify myself and without waiting for the Friday meeting.\n\nWe Vow with\
    \ the Presence of the Lord Buddha as Witness and the Mindful Presence of Our Sangha,\
    \ to Abide by These Articles and Practice Them Wholeheartedly. We Invoke the Three\
    \ Gems for Protection to Grant us Clarity and Confidence.\n\nSigned, ______________________\
    \ ______________________\nThe___ Day of________ in the Year____ at ________\n\n\
    # Anger : Wisdom for Cooling the Flames\n\n**The First Mindfulness Training: Reverence\
    \ for Life**\nAware ofthe suffering caused by the destruction of life, I vow to\
    \ cultivate compassion and learn ways to protect the lives of people, animals,\
    \ plants, and minerals. I am determined not to kill, not to let others kill, and\
    \ not to condone any act of killing in the world, in my thinking, or in my way\
    \ of life.\n\n**The Second Mindfulness Training: Generosity**\nAware ofthe suffering\
    \ caused by exploitation, social injustice, stealing, and oppression, I vow to\
    \ cultivate loving-kindness\n"
