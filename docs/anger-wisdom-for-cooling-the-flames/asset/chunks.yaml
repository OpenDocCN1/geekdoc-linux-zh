    他非常傲慢，非常自我中心，而且缺乏理解和同情心。有一天，他去了镇上的一座寺庙，但并不是为了听法法。他不在乎法法。他去那里是希望能结交新朋友，因为他迫切需要一个朋友。到目前为止，还没有能成为他的朋友。他富有、相帅，很多人都想结识他，但所有人都在不久之后就离开了他。


    所以那天早晨，他去了寺庙，因为没有朋友的生活就像地狱。他渴望一个朋友，渴望一个伴侣，即使他并没有留住朋友或伴侣的能力。当他来到寺庙时，遇到了一群出来的人，其中有一个非常美丽的年轻女士。那位年轻女士的形象深深地触动了他，他陷入了爱河，目失了魂。他不再进入寺庙感兴趣，转身跟随那群人。不幸的是，另一群人涌了进来，人潮让
    `David` 难以离开。当他终于离开寺庙时，那群人和那位美丽的女士已经消失得影无踪了。他到处寻找了一个小时也没有找到她，带着心中那个美丽的影像回了家。那晚他没有睡着，第二晚也没有。接着在第三个晚上，他看到一个留着白胡子的美丽老头。


    老人说：“如果你想见到她，今天就去东集市吧。”虽然还没到早晨，但他再也睡不着了。他起床一直等到中午才开始寻找那位年轻女士。当他到达东集市时，人并不多。时间还很早，于是他进了一书店开始环顾四周。突然，他抬头看到看到墙上挂着一幅非常美丽的年轻女士的画像。那正是他三天前在寺庙见过的那个年轻女士。同样的眼睛，同样的鼻子，同样的嘴巴。在梦中，他被告诉他会在市场遇到那位女士，但也许这就是老人的意思——画作就是他能拥有的全部。


    “也许我只配拥有一个影像，”他想，“我不配拥有现实。”于是，他没有买书，而是用所有的钱买下了那幅画。他把画带回家，挂在大学宿舍房间的墙上。他是一个孤独的人。他没有朋友。他经常不去学校食堂，而是呆在家里吃方便面。你可能已经猜到
    `David` 是亚洲人了。那一天，他准备了两碗方便面和两双筷子。第二碗是留给画中女士的。他享受着他的面条，偶尔抬头邀请画中的女士一起吃。


    我们知道，有些人无法与人类交流。他们养一只猫或一只狗作伴，这样他们就可以把所有的爱和关怀都倾注在它们身上。他们为宠物买最贵的食物。对许多人来说，爱一只猫或狗要容易得多，因为它们永远不会与你争吵。当你说了一些不好听的话时，它们不会反应。`David`
    也是如此。他可以和画中的女士和平相处，但如果那位女士在，他可能无法和她共处超过二十四小时。


    有一天，他没能吃完那碗面。生活似乎完全没有滋味了。他已经忍到了极限。在那一刻，他抬头看向画像。他正要问：“活着到底有什么意义？”这时，他看到那位女士眨了眨眼并笑了。他大吃一惊。他以为自己在做梦。他揉了揉眼睛再次抬头，她就在那里，静静地不动。几天后，他看到那位女士再次微笑并眨眼。他感到非常惊讶。他继续看着她，突然，她变成了一个真人，从画中走了出来。她的名字叫
    `Angelina`，因为她来自天堂。你无法想象那个年轻人有多开心。他置身于天堂。拥有这样一位美丽的年轻女士作为朋友，还有什么更妙的呢？


    但你可能已经猜到了故事的结局。即使面对像 `Angelina` 这样清新善良的人，他也无法快乐。三四个月后，她离开了他。和像 `David` 这样的人生活是不可能的。一个早晨，他醒来发现书桌上有一条纸。年轻女士彻底离开了。她写道：“David，我无法和你在一起。你太自我中心了，你没有听任何人的意见。你聪明、帅、富有。但你不知道如何与另一个人类维持关系。”


    那天早晨，`David` 想自杀。他想如果他连和这样一个甜美美丽的女士都无法生活，那么他一定一无价值。他找了一根绳子想上吊。在法国，每年有一万人自杀。平均每天大约三十三人。这太多了。而
    `David` 就在其中，等待着你的拯救。在美国和整个欧洲，自杀率也非常相似。人们被绝望所淹没。对于我们许多人来说，交流已变得不可能，生活不再有意义。


    ### 献心香


    当 `David` 在绳子上打结时，他突然想起有一天 `Angelina` 微笑着说：“David，如果有一天我不在身边了，而你非常想念我，就点一些香吧。”她说这句话那天，她成功说服他和他一起去寺庙听法。在那里，僧师解释了如何通过点香作为交流的方式。当你点香时，你想与佛、与菩萨、与祖先交流。如果我们能与祖先交流，我们也可以与周围的兄弟姐妹交流。


    所以僧师是在谈论通过供香的行为进行交流。他说我们献的香应该是心香：正念的香、定定的香、智慧与洞察的香。`David` 坐在 `Angelina` 身边，但他并没有听得很仔细。然而，他听到的足够让他记住那件事。当他们两人离开寺庙后，`Angelina`
    转向他说：“David，如果有一天你想与我联系，就点一些香。”想起这个，他丢掉绳子，跑到附近的商店买了一束香。但 `David` 并不知道如何点香。在梅花村，我们每次点香都只用一根。他用了整整束，短短几分钟内，他的房间就满了烟。他等了十五分钟、半小时、一小时，但
    `Angelina` 没有出现。于是他想起僧师说的话——为了让真正的交流成为可能，你...


