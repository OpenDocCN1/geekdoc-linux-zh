    ……这意味着如果一种疾病没有被早期发现，治疗将变得非常困难。医生们并不是从心理构造的角度来思考。他们考虑的是一种隐藏的疾病。但我们也可以利用这句口号——即使你确定了，也要检查一遍。”


    由于我们的感知，我们让自己遭受了痛苦，为自己和爱的人制造了地狱。你确定你的感知吗？有些人因为因为错误的感知而受了十年或二十年的苦。他们坚信对方背叛了他们或恨他们，尽管对方其实出于好意。一个错误感知的受害者会让自己和周围的人都遭受巨大的痛苦。


    当你感到愤怒并痛苦时，请回溯并深度地审视你感知的内容和本质。如果你能够消除错误的感知，和平与幸福将重新回到你身上，你也将能够再次爱那一个人。


    ## 共同审视愤怒


    当对方知道你正在尽力去审视你愤怒的原因时，她也会产生修行的动力。THICH NHAT HANH 80 2S 1S R 1L 2L


    在开车时、在做饭时，她会问自己：“我做了什么？我说了什么才让他受这么多苦？”她也会获得深度审视的机会。她知道在过去，她曾以让你痛苦的方式做出反应。她开始质疑自己的信念，即她对你的痛苦不负责。


    如果她发现自己在说话或做某事时是不圆满的，她就必须打电话或发邮件给你告诉她很抱歉。所以，如果你们在这一周内都获得了一些洞察，就不需要等到周五。周五晚上可以变成一个非常愉快的时光，你们可以坐在一起享受一顿美晚餐，或者也许是一杯茶和一块蛋糕。你可以庆祝你们的爱和你们的关系。


    ## 分享一切，即使在艰难时刻


    如果你们都没有成功成功练习，那么周五就是你们练习深度倾听和爱之语的时间。愤怒的人有权告诉对方他内心的想法。如果你的伴侣很愤怒，你只需要听，因为你已经承诺过要倾听而不做出反应。你要尽力练习慈悲的倾听。TRANSFORMATION
    81 2S 1S R 1L 2L


    # 愤怒：熄灭火焰的智慧


    倾听不是为了评判、批评或分析。你倾听只是为了帮助对方表达自己，并从痛苦中获得解脱。当你分享你的痛苦时，你有权说出你内心的一切——这是你的责任，因为对方有权知道一切。你们对彼此做过承诺。


    你应该告诉他你内心的一切，但只有一个条件——你必须使用冷静且充满爱的言语。当烦躁显现的一刻，当你觉得你即将失去冷静和宁静的这一刻，请停止。“亲爱的，我现在无法继续了，我们可以下次再聚吗？我需要练习更多的正念行走和呼吸。我现在的状态不是最好的，所以我不认为能成功练习爱之语。”


    对方会同意推迟这次会话到晚些，也许是下周五。如果你是倾听者，也要练习正念呼吸。练习正念呼吸以清空你大脑中的任何想法或成见，以便倾听。带着慈悲去倾听，用你的全神贯注给予对方解脱。你内心确实有着慈悲的种子，当你看到对方如此痛苦时，它就会显现出来。因此，你发愿成为一位菩萨，一位深度倾听的大士。这位大慈悲菩萨必须是一个真实的人，而不仅仅是一个观念。THICH
    NHAT HANH 82 2S 1S R 1L 2L


    ## 拥有慈悲你就不会犯错


    只有当你忘记对方也在痛苦时，你才会犯错。你倾向于认为只有你一个人在受苦，而对方在享受你的痛苦。当你认为只有你自己在受苦而对方完全不受痛苦时，你会说出并做出刻薄、残酷的事情。


    意识到对方非常痛苦的意识将帮助你扮演深度倾听菩萨的角色。慈悲变得可能，你可以在整个倾听过程中保持慈悲。你将成为他（她）最好的治疗师。在对方说话期间，他可能非常有评判性，只会指责和惩罚。他可能非常苦涩和愤世嫉俗。然而，因为慈悲仍在你心中，这并不会影响你。


    慈悲的甘水是如此奇妙。如果你致力于保持它的活力，你就得到了保护。对方说的话不会触发你内心的愤怒和烦躁，因为慈悲是愤怒的真正的解药。除了慈悲，没有什么能治愈愤怒。这就是为什么练习慈悲是一项非常奇妙的修行。TRANSFORMATION
    83 2S 1S R 1L 2L


    慈悲只有在理解存在时才可能。理解什么？理解对方正在痛苦，而我必须帮助。如果我不帮助，谁来帮助？倾听时，你可能会注意到对方话中有很多错误感知。尽管如此，你依然慈悲，因为你知道她是错误感知的受害者。如果你试图纠正她，你可能会打断她，阻止她说话和充分表达自己。所以只需坐着，带着所有的注意力，带着最好的善意去倾听，这将非常有疗愈力。


    如果你想帮助她纠正错误的感知，你必须等待时机。在倾听时，你的唯一目标是给她有机会说话并分享她内心的想法。你不要说什么。这个周五晚上完全属于她说话。你只需要听。然后，也许几天后，当她感觉好多了，你再提供她纠正感知所需的信息。“亲爱的，几天前你说了一些，但那并非事实。实际发生的情况是……”在纠正她时要使用爱之语。如有必要，请了解真实情况的朋友帮助对方理解真实状况，这样她就能从错误的感知中解放出来。THICH
    NHAT HANH 84 2S 1S R 1L 2L


    ## 耐心是真爱的标志


    愤怒是一种活生生的东西。它升起，也需要时间回去。即使你有明确的证据来说服某人的愤怒完全基于一个错误的感知，请不要立即干扰。就像贪婪、嫉妒和所有的恼一样，愤怒需要时间来平息。即使在对方意识到误解了情况后也是如此。


    当你关掉风扇时，它还会旋转几千次才会停止。愤怒也是如此。不要期待对方立即停止愤怒。这并不现实。你必须允许愤怒缓慢平息。所以不要急躁。耐心是真爱的标志。父亲必须有耐心才能表现对子女的爱。母亲、儿子、女儿也是。如果你想爱，你必须学会耐心。如果你没有耐心，你就无法帮助对方。你必须对自己耐心。拥抱愤怒的练习需要时间。但只需五分钟的正念呼吸、正念行走和拥抱愤怒就是有效的。如果五分钟不够，就花十分分钟，如果十分分钟不够，就花十五
