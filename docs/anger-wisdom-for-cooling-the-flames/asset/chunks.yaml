    an organic phenomenon, it is possible to transform it into another organic entity.
    The garbage can be transformed back into compost, into lettuce, and into cucumber.
    So don’t despise your anger. Don’t fight your anger, and don’t suppress your anger.
    Learn the tender way oftaking care ofyour anger, and transform it into the energy
    ofunderstanding and compassion. NO ENEMIES 127 2S 1S R 1L 2L'
