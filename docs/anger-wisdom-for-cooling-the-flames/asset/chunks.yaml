    愤怒升起时，你想打开窗户并开启风扇，这样愤怒就会消散。于是你通过用棍子敲石头或树木来发泄，或者通过捶枕头来发泄。我见过许多人这样做。实际上，他们确实获得了一些暂时的缓解。但是，发泄的副作用是非常有害的。它们会让你遭受更多的痛苦。愤怒需要能量来表现。当你试图通过用尽全力击打某些东西或捶枕头来发泄时，半小时后，你就会精疲力竭。因为你精疲力竭，你就没有剩余能量来滋养你的愤怒。你可能认为愤怒已经消失了，但事实并非如此；你只是太累了，无法愤怒。


    是你体内的愤怒之源产生了愤怒。愤怒的根源在于无知、错误的认知、以及理解与慈情的缺失。当你发泄愤怒时，你仅仅是开启了滋养愤怒的能量。愤怒的根一直在那里，通过那种方式表达愤怒，你正在加强自己内在愤怒的根。这就是发泄的危险之处。


    《纽约时报》1999 年 3 月 9 日刊过的一篇关于愤怒的文章，标题为“宣泄攻击性被视为错误的建议”。根据这篇文章，社会心理学家进行了大量的研究，他们得出结论：试图通过捶打枕头等方式来表达你的愤怒和攻击性毫无帮助。事实上，它会让情况变得更糟。当你捶枕头时，你并没有在平复或减少你的愤怒——你是在在排练它。如果你每天练习捶打枕头，那么你体内的愤怒种子就会每天生长。某一天，当你遇到那个令你愤怒的人时，你可能会练习你学到的东西。你只会击打那个人，并最终入狱。这就是为什么通过捶打枕头或发泄来处理你的攻击性完全没有帮助的。它是危险的。这并不是真正地排泄愤怒的能量，因为愤怒并没有离开你的系统。


    发泄愤怒是一种基于无知的练习。当你将仇恨的对象想象成一个枕头，击打你仇恨的对象时，你是在排练你的无知和愤怒。你并没有减少你的暴力和愤怒，反而变得更加暴力、更加愤怒。许多治疗师已经证实发泄愤怒的练习是危险的。他们告诉我，他们已经停止建议客户这样做。在客户通过捶打枕头发泄后，他们很疲惫，因此认为自己感觉好多了。但在他们休息并吃过东西后，如果有人来浇灌他们体内愤怒的种子，他们会比以前更愤怒。他们通过排练愤怒来滋养了愤怒的根。


    ## 当正念存在时，你是安全的


    我们必须面对自己的愤怒，必须承认它的存在并妥善照顾它。在心理治疗中，这被称为“与我们的愤怒接触”。这是非常奇妙且重要的。当愤怒表现时，你必须识别并拥抱它，而不是压抑它。但这里重要的问题是，是谁在接触、照顾和识别愤怒？愤怒是一种能量，如果这种能量压倒了你，你就会成为它的受害者。你应该能够产生另一种能量，这种能量可以识别并照顾愤怒。愤怒是一个需要触碰、需要识别的能量区域。


    问题是，什么在接触什么？什么能量可以进行接触和识别？那是正念的能量。所以，每当我们愤怒时，我们练习正念呼吸和正念行走，以便触碰正念的种子并在我们体内产生正念能量。正念不是为了压抑。正念是为了欢迎，是为了识别：“你好，我的小愤怒，我知道你在那里。我的老朋友。”正念是帮助我们意识到所存在物的能量。


    正念始终是指对某事保持正念。你可能正念你的吸气或呼气，那是呼吸的正念。你可能正念你正在喝的茶，那是饮用的正念。当你正念地进食时，那是进食的正念。当你正念地行走时，那是行走的正念。在这种情况下，我们练习愤怒的正念。“我意识到我我很愤怒，我意识到愤怒就在我体内。”


    所以，正念是接触、识别、问候和拥抱。它不战斗，不压抑。正念的角色就像母亲的角色，拥抱并安抚受苦的孩子。愤怒存在于你体内；愤怒是你的宝宝，你的孩子。你必须很好地照顾它。当它识别到愤怒时，正念会说：“你好啊，我的愤怒，我知道你在那里。我会好好照顾你，别担心。”正念存在的那一刻，你是安全的，你可以微笑，因为佛的能量在你体内生根了。


    如果你不知道如何处理你的愤怒，它会杀死你。没有正念，你可能会成为愤怒的受害者。它可以让你吐血甚至死亡。许多人死于愤怒——这是对你整个系统的冲击。没有正念，你成为愤怒的受害者，因为推着你去做有害的事情。当佛在时，你受到保护。当母亲在时，是安全的。我们通过正念行走和呼吸持续地这样做。当我们识别并拥抱愤怒时，我们必须通过正念行走和呼吸来这样做。如果你没有正念，它带给你解脱，即使你尽全力捶枕头。捶枕头无法帮助你与愤怒接触。如果你接触的是枕头，那么你就会知道它只是一个枕头，而不是你。你为什么要那样捶枕头？因为你不知道它仅仅是一个枕头。


    ## 你是你愤怒的对象


    你认为你自己是谁？你是那个人。如果你对你的儿子愤怒，你是在生自己的气。认为你的儿子不是你是错误的。你的儿子是你。在遗传上、生理上、科学上，你的儿子是你的延续。这是真理。你的母亲是谁？你的母亲是你。你是她作为后代的延续，她是你作为祖先的延续。她将你与之前的人联系起来，你将她与未来的世代联系起来。你们属于同一个生命流。认为她是一个不同的实体，认为你与她毫无关系，是完全的无知。当一个年轻人说“我不想再和我的父亲有任何关系”时，那是完全的无知，因为那个年轻人就是他的父亲。

