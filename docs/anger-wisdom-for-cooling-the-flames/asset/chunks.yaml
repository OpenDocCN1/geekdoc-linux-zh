    of calling it a wave or a particle, they call it a “wavicle,”com- bining the words
    wave and particle. This is the name scientists have given the elementary particle.
    The same thing is true with mind and body. Our dualis- tic view tells us that
    mind cannot be body, and body cannot be mind. But looking deeply, we see that
    body is mind, mind is body. Ifwe can overcome the duality that sees the mind and
    body as entirely separate, we come very close to the truth. Many people are beginning
    to realize that what happens to the body also happens to the mind, and vice versa.
    Mod- ern medicine is aware that the sickness ofthe body may be a result ofsickness
    in the mind. And sickness in our minds may be connected to sickness in our bodies.
    Body and mind are THICH NHAT HANH 14 2S 1S R 1L 2L


    not two separate entities—they are one. We have to take very good care ofour body
    ifwe want to master our anger. The way we eat, the way we consume, is very important.
    We Are What We Eat Our anger, our frustration, our despair, have much to do with
    our body and the food we eat. We must work out a strategy ofeating, ofconsuming
    to protect ourselves from anger and violence. Eating is an aspect ofcivilization.
    The way we grow our food, the kind offood we eat, and the way we eat it has much
    to do with civilization because the choices we make can bring about peace and
    relieve suffering. The food that we eat can play a very important role in our
    anger. Our food may contain anger. When we eat the flesh of an animal with mad
    cow disease, anger is there in the meat. But we must also look at the other kinds
    offood that we eat. When we eat an egg or a chicken, we know that the egg or chicken
    can also contain a lot ofanger. We are eating anger, and therefore we express
    anger. Nowadays, chickens are raised in large-scale modern farms where they cannot
    walk, run, or seek food in the soil. They are fed solely by humans. They are kept
    in small cages and can- not move at all. Day and night they have to stand. Imagine
    CONSUMING ANGER 15 2S 1S R 1L 2L


    that you have no right to walk or to run. Imagine that you have to stay day and
    night in just one place. You would be- come mad. So the chickens become mad. In
    order for the chickens to produce more eggs, the farm- ers create artificial days
    and nights. They use indoor lighting to create a shorter day and a shorter night
    so that the chick- ens believe that twenty-four hours have passed, and then they
    produce more eggs. There is a lot ofanger, a lot offrustra- tion, and much suffering
    in the chickens. They express their anger and frustration by attacking the chickens
    next to them. They use their beaks to peck and wound each other. They cause each
    other to bleed, to suffer, and to die. That is why farmers now cut the beaks off
    all the chickens, to prevent them from attacking each other out offrustration.
    So when you eat the flesh or egg ofsuch a chicken, you are eating anger and frustration.
    So be aware. Be careful what you eat. Ifyou eat anger, you will become and express
    anger. Ifyou eat despair, you will express despair. Ifyou eat frus- tration, you
    will express frustration. We have to eat happy eggs from happy chickens. We have
    to drink milk that does not come from angry cows. We should drink organic milk
    that comes from cows that are raised naturally. We have to make an effort to support
    farm- ers to raise these animals in a more humane way. We also have to buy vegetables
    that are grown organically. It is more THICH NHAT HANH 16 2S 1S R 1L 2L


    expensive, but, to compensate, we can eat less. We can learn to eat less. Consuming
    Anger Through Other Senses Not only do we nourish our anger with edible food,
    but also through what we consume with our eyes, ears, and con- sciousness. The
    consumption ofcultural items is also linked to anger. Therefore, developing a
    strategy for consuming is very important. What we read in magazines, what we view
    on television, can also be toxic. It may also contain anger and frustration. A
    film is like a piece ofbeefsteak. It can contain anger. Ifyou consume it, you
    are eating anger, you are eating frustration. Newspaper articles, and even conversations,
    can contain a lot ofanger. You may feel lonely sometimes and want to talk to some-
    one. In one hour of conversation, the other person’s words may poison you with
    a lot oftoxins. You may ingest a lot of anger, which you will express later on.
    That is why mindful consumption is very important. When you listen to the news,
    when you read a newspaper article, when you discuss some- thing with others, are
    you ingesting the same kind oftoxins that you ingest when you eat unmindfully?
    CONSUMING ANGER 17 2S 1S R 1L 2L


    Eating Well, Eating Less There are those who take refuge in eating to forget their
    sor- row and their depression. Overeating can create difficulties for the digestive
    system, contributing to the arising ofanger. It can also produce too much energy.
    Ifyou do not know how to handle this energy, it can become the energy ofanger,
    of sex, and ofviolence. When we eat well, we can eat less. We need only halfthe
    amount offood that we eat every day. To eat well, we should chew our food about
    fifty times before we swallow. When we eat very slowly, and make the food in our
    mouth into a kind ofliquid, we will absorb much more nutrition through our intestines.
    Ifwe eat well, and chew our food carefully, we get more nutrition than ifwe eat
    a lot but don’t digest it well. Eating is a deep practice. When I eat, I enjoy
    every morsel ofmy food. I am aware ofthe food, aware that I am eating. We can
    practice mindfulness of eating—we know what we are chewing. We chew our food very
    carefully and with a lot ofjoy. From time to time, we stop chewing and get in
    touch with the friends, family, or sangha—community of practi- tioners—around
    us. We appreciate that it is wonderful to be sitting here chewing like this, not
    worrying about anything. THICH NHAT HANH 18 2S 1S R 1L 2L'
