    # 慈悲是智慧


    理解与慈悲是非常强大的能量源。它们是愚蠢和被动的对立面。


    如果你认为慈悲是被动的、软弱或胆小的，那么你并不了解什么是真正的理解或慈悲。如果你认为富有慈悲的人不反抗也不挑战不公，你就错了。他们是赢得过许多胜利的战士、英雄和女英雄。


    当你带着慈悲、带着非暴力，基于非二元性的原则行动时，你必须非常强大。你不再出于愤怒而行动，不再进行惩罚或指责。慈悲在你内心不断生长，你可以在反抗不公的战斗中取得成功。


    圣雄圣·甘地只是其中一人。他没有炸弹，没有枪支，也没有政党。他仅仅根据对非二元性的洞察和慈悲的力量而行动，而不是基于愤怒。人类不是我们的敌人。敌人不是他人。我们的敌人是存在我们以及他人体内的暴力、无知和不公。当我们用慈悲和理解武装自己时，我们斗争的不是他人，而是那种侵略、支配和剥削的倾向。


    我们不想杀死他人，但我们不会让他们支配和剥削我们或他人。你必须保护你自己。你并不愚蠢。你非常聪明，并且拥有洞察力。慈悲并不意味着允许他人对自己或对自己施加暴力。慈悲意味着智慧。源于爱的非暴力行动只能是智慧的行动。慈悲并不意味着遭受不必要的痛苦或丧失常识。


    假设你正在带领一群人进行行禅，动作缓慢而优美。行禅产生了大量的能量；它用宁静、稳固和和平拥抱每一个人。但突然下起雨来。你会继续缓慢行走，让自己和每个人都被淋湿吗？那是不智慧的。如果你是一个优秀的行禅领导者，你会转为跑步冥禅。你依然保持着行禅的喜悦。你可以大笑、微笑，从而证明这种修行并不愚蠢。你还可以在跑步时保持正念，避免被淋湿。


    我们必须以智慧的方式进行练习。冥想并不是愚蠢的行为。冥想并不是盲目跟随身边人的做法。要冥想，你必须具备技巧并善用你的智慧。


    ## 建立一支慈悲的警察部队


    善良并不意味着被动。慈悲并不意味着允许他人肆意蹂躏你，允许自己被毁灭。你必须保护你自己，保护他人。


    如果你因为某人危险而需要关押他，那么你必须这样做。但你必须带着慈悲去做。你的动机是防止那个人继续他的毁灭之路并滋养他的愤怒。你不需要成为僧侣来拥有慈悲，你可以成为一名警察。你可以成为法官或狱警。但作为警察、法官或狱警，我们需要你们成为菩萨。我们需要你们成为大慈悲的众生。


    尽管你必须非常坚定，但你应该始终保持内心的慈悲之力。如果你实践正念生活，你就必须帮助警察出于慈悲和无畏而行动。我们这个时代的警察充满了恐惧、愤怒和压力，因为他们曾受到多次攻击。那些仇恨警察并侮辱他们的人还不够了解警察。清晨，当警察穿上制服、配上武器时，他们并不确定晚上是否还能活着回到家。警察承受着巨大的痛苦。他们的家人也承受着痛苦。他们并不享受打人，并不享受射击。但因为他们不知道如何处理体内的恐惧、痛苦和暴力，他们也可能像其他人一样成为社会的受害者。


    因此，作为警察局长，如果你真正理解你警队成员的心灵，你就会训练自己让慈悲与理解在你的心中诞生。那时，你就能教育并帮助那些每天早晚都必须上街、执行维持城市和平这项艰巨任务的男警女警。


    在法国，警察被称为“和平维护者”。但如果你内心没有和平，又如何维持城市的和平呢？你必须首先保持内心的和平。这里的和平意味着无畏、智慧和洞察。警察确实学习了许多保护自己的技术，但仅有自防技术是不够的。你必须是智慧的。你必须出于无畏而行动。如果你过于恐惧，你就会犯下很多错误。你会受到使用枪的诱惑，并可能杀死许多无辜的人。


    ## 我们无法偏袒一方


    在洛杉矶，四名警察将一名黑人司机殴打几乎昏死。媒体全世界报道了此事，每个人都想站队。你可能站在被殴打受害者的一边，也可能站在警察的一边。当你做出评判并站队时，你表现得好像在冲突之外。你表现得好像自己不是那个被殴打的黑人司机，也不是那四名警察。但深层观察，你会发现你既是被殴打的受害者，也是那四名警察。愤怒、挫败和暴力存在于被殴打者身上，也存在于施者身上。


    为了理解警察并帮助他们减轻痛苦，让我们想象自己是警察的丈夫或妻子。生活在一起，你很体会配偶生活的艰辛。因此，每天早晚，你都想做些什么来帮助配偶转化他的愤怒和挫败。当你能够帮助配偶减轻痛苦时，整个城市都会受益——甚至是那些问题少年。


    ## 一场结束愤怒与暴力的对话


    一个满是暴力、偏见和恐惧的警察形象并不是一个积极的形象。如此多的年轻人将警察视为敌人。他们想烧毁警车、殴打警察，因为警察是他们愤怒和挫败的对象。我们必须在警察与犯过暴力行为并入狱的青少年之间组织一场会议、对话。我们为什么不组织这种对话，给警察一个机会谈谈他们的挫败、愤怒和恐惧呢？我们为什么不让这些与警察抗争的青少年说出他们的挫败、愤怒和恐惧呢？我们为什么不把这些对话直播，让整个国家都能从中学习？这才是真正的冥想：深层地观察，不是作为一个个体，而是作为一个城市、作为一个国家。我们还没有看到真相。我们看过很多电影、侦探故事和西部片，但我们没有看到真实人们内心和想法中的真相。


    ## 自我轰炸


    “父啊，求你赦免他们，因为他们不知道自己在做什么，”基督说道。当一个人犯罪并让他人遭受痛苦时，是因为他不知道自己在做什么。许多青少年犯罪，他们并不知道，不理解自己造成了多大的痛苦。


