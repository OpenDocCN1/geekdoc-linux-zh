    Through mindful breathing and mindful walking. The Buddha within is not a mere
    concept. The Buddha within is not a theory or a notion. It is a reality, because
    all of us are capable of generating the energy of mindfulness. Mindfulness means
    to be present, to be aware of what is going on. This energy is very crucial for
    the practice. The energy of mindfulness is like a big brother, big sister, or
    a mother, holding the younger one in her arms, taking good care of the suffering
    baby, which is our anger, despair, or jealousy. Energy Zone One is anger, and
    Energy Zone Two is mindfulness. The practice is to use the energy of mindfulness
    to recognize and embrace the energy of anger. You have to do it tenderly, without
    violence. This is not an act of suppressing our anger. Mindfulness is you and
    anger is also you, so you shouldn’t transform yourself into a battlefield, one
    side fighting the other. You should not believe that mindfulness is good and correct,
    while anger is evil and wrong. You should not think like that. You only need to
    recognize that anger is a negative energy and that mindfulness is a positive one.
    Then you can use the positive energy in order to take care of the negative one.


    ### Organic Feelings

    Our practice is based on the insight of non-duality. Both our negative feelings
    and positive feelings are organic and belong to the same reality. So there is
    no need to fight; we only need to embrace and take care. Therefore, in the Buddhist
    tradition, meditation does not mean you transform yourself into a battlefield,
    with the good fighting the evil. This is very important. You may think that you
    have to combat evil and chase it out of your heart and mind. But this is wrong.
    The practice is to transform yourself. If you don’t have garbage, you have nothing
    to use in order to make compost. And if you have no compost, you have nothing
    to nourish the flower in you. You need the suffering, the afflictions in you.
    Since they are organic, you know that you can transform them and make good use
    of them.


    ### The Insight of Inter-Being

    Our method of practice should be non-violent. Non-violence can be born only from
    the insight of non-duality, of inter-being. This is the insight that everything
    is interconnected and nothing can exist by itself alone. Doing violence to others
    is doing violence to yourself. If you do not have the insight of non-duality,
    you will still be violent. You will still want to punish, to suppress, and to
    destroy. But once you have penetrated the reality of non-duality, you will smile
    at both the flower and garbage in you, you will embrace both. This insight is
    the ground for your non-violent action. When you have the insight of non-duality
    and inter-being, you take care of your body in the most non-violent way possible.
    You take care of your mental formations, including your anger, with non-violence.
    You take care of your brother, your sister, your father, your mother, your community,
    and your society, with utmost tenderness. No violence can be born from this kind
    of attitude. You won’t regard anyone as an enemy when you have penetrated the
    reality of inter-being. The foundation of our practice is the insight of non-duality,
    the insight of non-violence. This insight teaches us how to treat our body with
    tenderness. We must treat our anger and our despair with tenderness. Anger has
    roots in non-anger elements. It has roots in the way we live our daily life. If
    we take good care of everything in us, without discrimination, we prevent our
    negative energies from dominating. We reduce the strength of our negative seeds
    so that they won’t overwhelm us.


    ### Expressing Anger Wisely

    When anger manifests in us, we must recognize and accept that anger is there and
    that it needs to be tended to. At this moment we are advised not to say anything,
    not to do anything out of anger. We immediately return to ourselves and invite
    the energy of mindfulness to manifest also, in order to embrace, recognize, and
    take good care of our anger. But we are advised to tell the other person that
    we are angry, that we suffer.


    “Darling, I suffer, I’m angry, and I want you to know it.” Then if you are a good
    practitioner, you also add, “I’m doing my best to take care of my anger.” And
    you can conclude with the third sentence, “Please, do help me,” because he or
    she is still very intimate, very close to you. You still need him or her. Expressing
    your anger in this way is extremely wise. It is very truthful, very faithful because
    in the beginning of your relationship, you made a vow with your partner that you
    would share everything, positive or negative. This kind of language, this kind
    of communication will inspire respect, and motivate the other person to look back
    and to practice like you. He or she will see that you respect yourself. You demonstrate
    that when you are angry, you know how to take care of your anger. You are doing
    your best in order to embrace it, and so you no longer consider your partner as
    an enemy to be punished. You see him or her as an ally who is still there to support
    you. These three sentences are very positive things to say. Remember that you
    have to tell him or her within twenty-four hours. The Buddha said that a monk
    has the right to be angry, but not for more than one night. It’s not healthy to
    keep your anger inside for too long. Do not keep your suffering or your anger
    to yourself for more than one day. You have to say these three things in a calm,
    loving way, and you must train yourself to do so. If you are not calm enough to
    express your anger and the deadline is drawing close, then you have to write the
    three sentences down on a piece of paper and deliver it to him or her. “Darling,
    I am angry, I suffer. I don’t know why you have done this to me, why you have
    said this to me. I want you to know that I suffer. I am doing my best to practice
    taking care of my anger. Darling, I need you to help me.” You have to deliver
    this kind of peace note to him and make sure that he will get it. The moment you
    tell him or deliver the note to him, you will already feel some relief.


    ### An Appointment for Friday Evening

    You may like to add something to your three sentences, to your peace note: “Let
    us sit down Friday evening and look deeply together.” Perhaps you say this on
    Monday or Tuesday, so you still have another three or four days to practice. During
    this time, both of you will have a chance to look back and understand better what
    caused the conflict. You can come together any time, but Friday evening is good
    because if you can reconcile, if you can sort it out, then you will have a wonderful
    weekend together. Until Friday evening comes, you practice mindful breathing and
    looking deeply to understand the roots of anger. Whether you are driving, walking,
    cooking, or washing, you continue to embrace your anger with mindfulness. By doing
    so, you have a chance to look deeply into the nature of your anger. You discover
    that the main cause of your suffering is the seed of anger in you, because it
    has been watered too often, by yourself and by other people. Anger is in us in
    the form of a seed. The seeds of love and compassion are also there. In our consciousness,
    there are many negative seeds and also many positive seeds. The practice is to
    avoid watering the negative seeds, and to identify and water the positive seeds
    every day. This is the practice of love.

