    buyingbooks,he usedallhismoneytobuythatpainting.Hebroughtithome, andhehungitonthewallofhisdormitoryroomatcollege.
    He was a lonely person. He did not have friends. Often he did not go to the campus
    cafeteria. Instead, he stayed home and ate instant noodles. You may have already
    guessed that David is Asian. That day, he prepared two bowls ofinstant noodles,
    and two pairs ofchopsticks. The second bowl was for the lady in the painting.
    He enjoyed his noodles, and from time to time he looked up and invited the lady
    in the painting to eat. DAVID AND ANGELINA 147 2S 1S R 1L 2L


    We know that there are people who cannot communicate with human beings. They have
    a cat or a dog to live with for company, so that they can pour out all their love
    and care on it. They buy the most expensive food for their pet. For many people,
    it is much easier to love a cat or a dog because they never argue with you. When
    you say something that is not nice, they don’t react. The same thing was true
    with David. He could live in peace with the lady in the painting, but ifthe real
    lady were there, he might not be able to live with her for more than twenty-four
    hours. One day he could not finish his bowl of noodles. Life seemed to have no
    flavor at all. He had had it up to his neck. At that moment, he looked up at the
    painting. He was about to ask, “What’s the use ofliving anyway?”when he saw the
    lady blink her eyes and smile. He was very startled. He thought that he was in
    a dream. He rubbed his eyes and looked up again, and there she was, perfectly
    still. A few days later, he saw the lady smile and blink her eyes again. He was
    very surprised. He continued to look at her, and suddenly she became a real person
    and stepped down from the painting. Her name was Angelina, because she came from
    heaven. You cannot imagine how happy the young man was. He was in paradise. To
    have such a beautiful young lady as a friend, what could be more wonderful? But
    you may have already guessed the rest ofthe story. He THICH NHAT HANH 148 2S 1S
    R 1L 2L


    was not capable ofbeing happy even with someone as fresh and kind as Angelina.
    And three or four months later, she left him. It was impossible to live with someone
    like David. One morning he woke up and found a note on his desk. The young lady
    had gone for good. She wrote: “David, it is im- possible to live with you. You
    are too self-centered, you have nocapacitytolistentoanyone.Youareintelligent,handsome,
    and rich. But you don’t know how to maintain a relationship with another human
    being.”That morning, David wanted to kill himself. He thought that ifhe could
    not even manage to live with such a sweet, beautiful lady, then he must be worth-
    less. He looked for a piece ofrope to hang himselfwith. Every year in France,
    twelve thousand people commit sui- cide. That is about thirty-three every day.
    That’s far too many. And David is among them, waiting for you to rescue him. In
    the United States and throughout Europe, the rate ofsuicide is very much the same.
    People are overwhelmed by despair. For many ofus, communication has become impossible
    and life no longer has meaning. Offering the Incense of the Heart While David
    was tying a knot in the rope, he suddenly re- membered that one day Angelina smiled
    and said, “David, if DAVID AND ANGELINA 149 2S 1S R 1L 2L


    someday I’m no longer around and you miss me very much, just burn some incense.”The
    day she said this, she had been able to convince him to come to the temple with
    her to lis- ten to a dharma talk. There, the monk was explaining how to offer
    incense as a way ofcommunicating. When you burn in- cense, you want to communicate
    with the Buddha, with the Bodhisattvas, with our ancestors. Ifwe can communicate
    with our ancestors, we can communicate also with our brothers and sisters around
    us. So the monk was talking about com- municating through the act ofoffering incense.
    He said that the incense we offer should be the incense ofour heart: the incense
    ofmindfulness, the incense ofconcentration, the in- cense ofwisdom, ofinsight.
    David was there sitting close to Angelina, but he did not listen very deeply.
    However, he heard enough to remember that event. After both ofthem left the temple,
    Angelina turned to him and said, “David, ifsomeday you want to get in touch with
    me, offer some incense.” Remembering this, he dropped the rope, ran to the store
    nearby and bought a bundle of incense. But David did not know how to burn incense.
    In Plum Village every time we offer incense, we use only one stick. He used the
