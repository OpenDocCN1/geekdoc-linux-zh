    照顾好你自己。一方面，你每天需要获得正确的营养；另一方面，你需要培养内在的慈悲心，以便为倾听这项任务做好充分准备。你必须扮演一个“大觉”的角色，一个拥有如此巨大幸福足以将人们从苦难中拯救出来的人。


    ## 你就是你的孩子


    作为父亲或母亲，你必须听你儿子或女儿的话。这非常重要，因为你的儿子是你；你的女儿也是你自己。你的孩子是你的延续。你最重要的任务是恢复你与孩子之间的沟通。如果你的心脏功能不正常，如果你的胃不健康，你不会想过把它切掉扔掉。你不能说：“你不是我的心！我的心不是那样的。你不是我的胃！我的胃不是那样的。我再也不想你有关系了！”这不明智。你可能也会这样对你的儿子或女儿，这同样不明智的。


    从你的儿子或女儿在子宫中受孕的一刻起，你就将自己和胎儿视为一体。你甚至可能开始和宝宝对话：“亲爱的，保持安静。我知道你在这里。”你用爱对他或对她说话。你开始意识到自己摄入了什么，因为无论你吃什么喝什么，宝宝也在吃喝。你的忧虑和喜悦就是宝宝的忧虑和喜悦。你和宝宝是一体的。


    当你生下宝宝并剪断脐带，这种合一的意识可能会开始消失。当你的儿子或女儿十二或十三岁时，你已经完全忘记了他或她就是你。你把他或她视为一个独立的实体。你们之间产生了问题。和孩子产生问题就像你的胃、心、肾脏出了问题。如果你认为他是另一个人，一个独立的实体，你可以说：“走开！你不是我的儿子！你不是我的女儿！我的儿子不是那样。我的女儿不是那样。”


    但因为你不能对你的胃或心这样说，你就不能对你的儿子或女儿这样说。佛说：“没有彼此独立的自我。”你和你的儿子，你和你的女儿，只是许多代祖先的延续。你是漫长生命流的一部分。你的孩子做什么都会深远地影响你——就像他们还在你子宫里一样。你所做的一切仍然会深远影响你的孩子，因为他们永远无法与你分离。你的幸福和痛苦就是孩子的幸福和痛苦，反之亦然。


    ## 慈悲沟通


    这就是为什么你必须将全身百的精力投入到恢复沟通的任务中。


    ### 开启对话


    困惑和无知让我们认为只有我们自己受苦。我们相信我们的儿子或女儿并不痛苦。但事实上，每当你痛苦时，你的孩子也痛苦。你存在于儿子身体的每一个细胞中，存在于女儿身体的每一个细胞中。孩子身上的每种情绪和每种感知，都是你的情绪和感知。因此，我们记得最初的那种洞察：他和你，以及她和你，是一体的的。


    和你的儿子或女儿开始对话。在过去，你犯过错。你让你的胃遭受了痛苦。你进食呼吸的方式、忧虑的方式，对你的胃、肠道、心脏产生了巨大影响。你对你的心、肠道和胃负责。同样，你对你的儿子和女儿负责。你不能说自己不负责。


    更明智的做法是走向孩子说：“亲爱的孩子，我知道你很痛苦。多年来，你受了很多苦。当你痛苦时，我也痛苦。当我的孩子痛苦时，我怎么能快乐呢？所以我意识到你我都在痛苦。我们能一起寻找解决方案吗？我们可以聊聊吗？我真的想恢复沟通，但单靠我一个人做不到。我需要你的帮助。”


    如果你作为父亲或母亲，有能力对孩子说这样的话，情况可能会改变，因为你懂得如何使用慈爱的语言。你的语言源于爱，源于理解，源于开悟。开悟你和孩子是一体的，幸福与安康不是个人的问题。这关乎你们双方。所以你对孩子说的的话必须源于你的爱和理解，源对“没有彼此独立自我”的理解。你可以这样说话，因为你理解了你自己和孩子的本性。你知道你的女儿之所以是这样，是因为你也是这样。你们是相互依存的。你之所以是这样，是因为你的儿子是这样。你们并不孤立。


    训练自己正念生活的艺术。训练自己，让你变得足够熟练以恢复沟通。“亲爱的儿子，我知道你就是我。你是我的延续，当你痛苦时，我没有可能获得快乐，所以让我们一起把事情解决好。请帮帮我。”


    儿子也可以学会这样说话，因为他明白如果他的父亲痛苦，他也无法快乐。通过正念的练习，儿子可以触及“没有彼此独立自我”的现实，并学会与父亲恢复沟通。他可能是那个主动的人。同样的事情也会发生在伴侣之间。你们发愿要合而为一。你们深诚地发愿分享彼此的幸福与痛苦。告诉伴侣你需要他或她的帮助来重新开始，这只是那些愿言的延续。我们每个人都有这样交谈和倾听的能力。


    ### 情书


    有一位法国女性留着丈夫的旧情书。在结婚之前，丈夫给她写了优美的信。每当她收到他的信时，她都会品味每一句话——每一个字——那是如此甜蜜、如此理解、充满爱。每当收到信她都很高兴，所以她把所有的信存在一个饼干罐里。一个早上，当她在整理衣橱时，发现了那个存放他所有信的旧饼干罐。她已经很久没看到它了。信箱讲述了她和丈夫年轻时最美好的时光。

