    当我们正念进食时，我们并不是在进食或咀嚼我们的愤怒、焦虑或项目。我们是在咀嚼他人用心准备的食物。这种感觉非常愉快。当你嘴里的食物几乎变成液体时，你会更强烈地体验到它的味道，食物会变得非常好、非常好吃。你今天可以尝试这样咀嚼。觉察你嘴部的每一个动作。你会发现食物是如此美味。它可能只是面包，完全没有黄油或果酱，但它是很棒的。


    也许你还会配一些牛奶。我从不喝牛奶。我咀嚼牛奶。当我把面包放进嘴里时，我会正念地咀嚼一会儿，然后喝一口牛奶。我把它放在嘴里，继续带着觉知去咀嚼。你无法想象仅仅咀嚼一些牛奶和面包会有多美味。


    当食物变成液体并与唾液混合时，它已经半半了。所以当它进入你的胃和肠道时，消化变得极其容易。面包和牛奶中的许多营养会被吸收进我们的体内。在咀嚼的过程中，你会获得很多快乐和自由。当你这样进食时，你自然会吃得少一些。


    当你给自己取食物时，要觉察你的眼睛。不要信任它们。是你的眼睛推着你拿过多的食物。你不需要那么多。如果你知道如何正念且快乐地进食，你会意识到你只需要眼睛告诉你要拿的量的一半。请尝试一下。仅仅咀嚼一些非常简单的东西，如西葫芦、胡萝卜、面包和牛奶，可能成为你一生中最棒的一餐饭。它太棒了。


    我们在灵山（位于法国的修行中心）的许多人都经历过这种进食方式——非常正念、非常缓慢地咀嚼。尝试这样吃吧。这可以帮助你的身体感觉好得多，因此在你的精神和意识中也是如此。我们的眼睛比胃口大。我们必须用正念的能量来赋予眼睛，这样我们才能确切知道自己真正需要多少食物。


    僧尼使用的饭钵，其中文术语意思是“量入合适的器具”。我们使用这种碗来保护自己，不被眼睛欺骗。如果食物满了碗，我们就知道已经足够了。我们只取等量的食物。如果你能像那样吃，你就可以买得少一些。当你买得少时，你就能买得起有机食品。这是我们个人或家庭可以做到的。这将对想要通过种植有机食品维持生计的农民提供巨大的支持。


    # 第五正念戒


    我们所有人都需要一种基于我们爱与服务的意愿的饮食。一种基于我们智慧的饮食。五正念戒是通往世界以及我们每个个体摆脱痛苦的出路（见附录 A 全文）。深度审视我们的消费方式就是第五正念戒的修行。这项正念戒涉及正念消费的实践，即遵循一种能够解放我们和我们社会的饮食方式。


    因为我们意识到了非正念消费所造成的痛苦，我们做出承诺：“……通过练习正念饮食、饮水和消费，为我自己、我的家庭和我的社会培养身心健康。我发誓只摄入那些能保持我的身体、意识以及我家庭和社会的集体身体与意识中和平、健康与快乐的物品。我决定不使用酒精或其他任何致醉剂，也不摄入含有毒素的食物或其他物品，例如某些电视节目、杂志、书籍、电影和对话……”


    # 消费愤怒


    如果你想照顾好你的愤怒、挫败和绝望，你可以考虑根据这项正念戒来生活。如果你正念地饮酒，你可以看到它创造了痛苦。摄入酒精会导致身体和心灵的疾病，以及道路上的死亡。制造酒精也涉及痛苦的创造。在生产酒精时使用的谷物与世界上粮食短缺有关。对饮食的觉念可以带给我们这种解放性的见解。


    与你爱的人、与你的家人讨论正念消费的策略，即使他们还很小。孩子可以理解这些，所以他们应该参与此类讨论。你们可以一起决定吃什么、喝什么、看什么电视节目、读什么以及进行什么样的对话。这种策略是为了保护你你自己。


    如果我们不留心我们所消费的一切东西，我们就无法谈论愤怒以及如何处理愤怒，因为愤怒与这些东西是并没分离的。与你的社区谈论正念消费的策略。在灵山，我们尽力保护自己。我们试着不消费那些滋养我们愤怒、挫败和恐惧的东西。为了更正念地消费，我们需要定期讨论我们吃什么、如何吃、如何买得少，以及如何获得更高质量的食物——包括可口的食物以及我们通过感官消费的食物。


    # 守护你的房子


    当某人说或做了一些令我们愤怒的事时，我们会遭受痛苦。我们倾向于回击或做一些让对方遭受痛苦的事，希望这样我们可以少受苦。我们会想：“我想惩罚你，我想让你受苦，因为你让我受了苦。看到你非常痛苦时，我会感觉好受。”我们许多人倾向于相信这种幼稚的做法。事实是，当你让他遭受痛苦时，他会试图通过让你遭受更多痛苦来获得缓解。结果是双方痛苦的升级。你们双方都需要慈悲和帮助。你们都不需要惩罚。


    # 熄灭愤怒之火


    当你愤怒时，回到内心，并照顾好你的愤怒。当别人让你遭受痛苦时，回到内心，照顾你的痛苦和愤怒。不要说或做任何事。你在愤怒状态下的所言所行都可能给你的关系造成更大的伤害。我们大多数人并不这样做。我们不想回到内心。我们想要跟随对方去惩罚他。


    如果你的房子起火了，最紧迫的任务是回去尝试灭火，而不是去追那个你认为是纵火犯。如果你去追那个你怀疑火烧了你房子的人，你的房子会在你追逐时被烧光。那不是明智。你必须回去灭火。所以当你愤怒时，如果你继续与对方互动或争吵，如果你试图惩罚对方，你的行为就像是在房子一片火光时去追那个纵火犯一样。


    ## 灭火的工具


    佛给了我们非常有效的熄灭内心火焰的工具：正念呼吸的方法、正念行走的方法以及拥抱愤怒的方法。


