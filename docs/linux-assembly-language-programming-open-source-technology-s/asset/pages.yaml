    limits. Since the GDT and the IDT are not accessed via selectors, they are called
    memory segments. The TSS and the LDT are referred to as *special memory segments*


    The task state segment is used in task switches. The task being saved its registers
    in its task state segment. The base address and limit of the TSS is defined by
    a segment descriptor, just like other memory segments.


    The local descriptor table (segment), LDTS, is used to store descriptors of segments
    which are not shared with all other tasks on the system.


    The global descriptor table is used for storing descriptors of memory segments
    which are accessed by all tasks on the system, as well as all LDTS and TSS descriptors.


    As we can see from Figure 13-3, there can be only one global and one local descriptor
    table in effect at any given time. When a task switch occurs, the local descriptor
