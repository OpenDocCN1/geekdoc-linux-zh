  md: 'Section 13.3. Setting Up the Global Descriptor Table


    239


    This system of protection is incomplete, however. Locking the front door to your
    house doesn''t lock the house if the back door is unlocked. Since all tasks can
    access the global table, there must be something to prevent a rogue task from
    reading the descriptors defining the local descriptor tables belonging to other
    tasks.

    Consider this code:


    ```

    MOV AX, 0

    ; AX is a 16-bit selector.

    ; Bit 2 is 0; We''re pointing into the global table.

    ; Bits 0 and 1 are 0

    ; That''s system level privilege.

    ```


    ```

    HAK: LLDT AX

    ; AX is pointing at some descriptor

    ; It could be a local descriptor table

    ; If so''s probably not our own local table.

    ; And in that case we have just borrowed someone

    ; else''s private descriptor table and can

    access anything listed in there.

    ADD AX, 8

    ; Maybe not.

    ; Go to the next descriptor

    ; The local tables are in here.

    ; We''ll find them.

    ```


    Program 13.2


    Memory protection by itself doesn''t work. User processes must not be allowed
    to execute code like the above code.


    # 13.3 Setting Up the Global Descriptor Table


    When an x86 processor is turned on or restarted, it does not create a global descriptor
    table automatically. Hence (unless a manufacturer puts one in a ROM), none exist
    at boot time. Since the processor can''t use memory in protected mode with a global
    table, the processor must boot up in real mode. The processor can subsequently
    be switched into protected mode, but only after the global table has been set
    up.


    The processor has base address and limit registers for the global descriptor table
    (GDT). These registers are loaded using the command


    ```

    LGDT mem

    ```


    where mem points to six bytes of memory containing a two-byte limit and a four-byte
    base address for the global table. Although a register MOV command might have
    been a more convenient way of doing this, there are no six-byte registers available.'
  merge: -1
  pgno: 258
- img_proc: true
  md: "As an example of how we might use the LGDT command, suppose that then descriptors\
    \ we want to use as our global table have been starting at address 10000H. Our\
    \ global table will therefore be eighty bytes long and start at 10000H. The limit\
    \ is one less than eighty, or 4FH. In order to use the LGDT command, we need to\
    \ store these values in memory somewhere. Suppose we set up a “scratch” memory\
    \ area at 20000H and put our GDT values there. After this code\n\n```\nMOV AX,\
    \ 2000H      ; Set up a segment for the scratch area.\nMOV DS, AX\nMOV AX, 4FH\
    \           ; GDT's limit is a 2 byte value.\nMOV [DS:0], AX       ; Store 79\
    \ into the first 2 bytes of\n                      ; scratch.\nMOV EAX, 10000H\
    \     ; GDT's base address is a 4 byte value.\nMOV [DS:2], EAX      ; Store this\
    \ 4 byte address\n                      ; 2 bytes into the scratch.\n        \
    \              ; (Don't overwrite the first two bytes.)\nLGDT [DS:0];\n; This\
    \ loads the GDT base address register\n                      ; and the GDT limit\
    \ register\n                      ; i.e., load all 6 bytes.\n```\n\n# Program\
    \ 13.3\n\nexecuted, the GDT bases address and limit registers will be loaded.\
    \ The global table has not been used for anything yet. In fact, we could even\
    \ run this code first and then store those eighty bytes next. The global table\
    \ will not go into operation until the processor is switched into protected mode.\n\
    \n# 13.4 Closing\n\nThe surface has barely been scratched. The way forward is\
    \ open."
