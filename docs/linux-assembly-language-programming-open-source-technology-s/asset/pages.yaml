  md: '# Section 6.2. Addresses in Brackets


    lines which would have resulted from using the [imm] format.

    At first sight it would appear that we could do better by using ADD instructions
    instead of multiple INC instructions. But this would actually ruin everything.
    Because we are using a loop to proceed four bytes at a time the least significant
    to the most significant bytes, we encounter a problem with the carry flag. If
    between two executions of the DEC instruction we move four down the number using
    an ADD instruction, we have messed the carry flag. In chapter 4 it is noted that
    the carry flag is unaffected by the INC and DEC instructions. The reason for this
    arcane exception suddenly becomes clear. Multibyte arithmetic needs a carry flag
    which can sweep loop counter adjustments. Because they don''t affect the carry
    flag, the INC and DEC instructions can be used to carry out harmless loop counter
    adjustments. Adding 4 using four INC instructions is not without beautiful, but
    it works.


    This code is not bad from the standpoint of taking up space memory is cheap. But
    it is bad from the standpoint of adding execution time to a loop. If there is
    one place where execution is costly in the middle of a nested loop, and is exactly
    where extra INC instructions are.

    Another memory format is useful in dealing with this problem.


    # 6.2.3 The [reg+scale*reg+imm]


    The most general memory format is the [reg + scale * reg + imm] format, where
    scale is a scale factor which must be 1, 2, 4, or 8. The register which is multiplied
    by the scale factor is the index register. The other register is called the base
    register. Some fields may be omitted. This gives us the effect of a variety of
    formats, including


