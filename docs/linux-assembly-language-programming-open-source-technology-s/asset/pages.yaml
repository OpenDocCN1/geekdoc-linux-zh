    # 9.7.2 Store 0 into the CPL


    The next step in the processing of an interrupt is that 0 is loaded into the CPL.
    Confidence in the safety of this step must be based on confidence in the code
    that is being jumped to.


    The original value of the CPL is restored when the IRET instruction executes.
    The mechanism behind the CPL store and restore is discussed in chapter 13.


    # 9.7.3 Change Stacks


    The ESP used by the kernel is waiting in the task state segment. The ESP corresponding
    to CPL = 0 is loaded into there ESP when 0 is loaded into the CPL. The current
    ESP is not stored in the task state segment. It is pushed onto the new stack.


    The fact that the task state segment is not changed when 0 is stored into the
    CPL is what is meant by saying that the kernel is executing “within” or “in behalf
    of” a task. In other words, there is no task switch involved. The same task is
    still running.


    # 9.7.4 Jump to the ISR


    To do the jump, the return address of the next instruction is pushed onto the
    new stack. The new EIP is then loaded with the 32-bit address from the gate.'
