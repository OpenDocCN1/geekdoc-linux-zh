    # 13.2.6 Task Isolation by Local Descriptor Tables


    A process can access only memory segments that are listed in two tables, its own
    table called the local descriptor table, and another called the global descriptor
    table. The system has only one global descriptor table. All processes have access
    to the global table, but local tables should not be shared. Consequently one method
    the operating system could use to isolate tasks from one another would be to hand
    out different descriptor tables to different processes. If a segment is not listed
    in either the global descriptor table or the process''s local descriptor table...
    Before discussing protection further, we need to look at some of the descriptors,
    selectors, and the descriptor tables.


    Segmentation on the 80286 was designed to allow different tasks to have their
    own memory segments to which other tasks would not have access. Each task can
    have its own local descriptor table. Descriptors of private memory segments can
    be stored in these local tables. The x86 architecture implements local descriptor
    tables as segments, complete with descriptors in the global table. In the memory
