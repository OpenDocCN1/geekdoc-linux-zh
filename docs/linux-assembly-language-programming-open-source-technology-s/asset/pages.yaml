    Figure 1-2. Stages of Gnu C Compilation


    or sometimes just an *executable.*

    The gnu C compiler works in stages. See Figure 1-2. To compile a program as prog.c
    with the gnu compiler, one can enter the command


    ```

    linuxbox$ gcc prog.c

    ```


    This command takes the translation through all the stages and produces an executable
    file called a.out. To stop at an earlier stage, one can add a *switch* to the
    gcc command line. For example, to produce an assembly code file, the “-S” switch
    (upper case) is used. Entering the command


    ```

    linuxbox$ gcc -S prog.s

    ```


    yields an assembly language file, prog.s. To finish the compilation, the gcc command
    may be used on the .s file


    ```

    linuxbox$ gcc prog.s

    ```


    # 1.4 The Edlinas Assembler


    The assembly language in the .s files produced by the gnu compiler is different
    from the widely used Intel assembly language for the x86 processors. Edlinas assembly
    language is essentially the Intel assembly language. Its object code file run
    under x86 Linux. Edlinas is an interactive environment consisting of an editor,
    an assembler, and a simulator.


    # 1.4.1 Editing


    Source code editing uses commands borrowed from EDLIN, a DOS editor. Among the
    commands are **i** for insert, **d** for delete, **c** for change, **e** for exit,
    **q** for quit, and **h** for help. Commands affect the *current line*, which
    is the line that has the asterisk*. The asterisk is moved using the arrow keys.
    Entered lines are checked by the assembler for syntax errors.'
