  md: '# PREFACE


    Assembly language is language which gives the programmer direct control over the
    computer. That is what appeals to people about assembly language. It is like using
    a stick shift. Programming with other languages, high-level languages, is like
    using an automatic.


    Many people who use computers simply run programs. To them a program is a canned
    software package. People who like to write programs to be able to shape the behavior
