    # 9.3.1 The 8259 Interrupt Controller


    The ISA interrupt controller is based on the Intel 8259 PIC, or programmable interrupt
    controller. The 8259 is the interrupt controller circuit used in the original
    IBM PC. 8259 may be used either simply as in the PC or combined into a-tiered
    structure with one master and anywhere from one to eight slaves, as shown in Figure
    9-4. In the original PC there was a 8259. A master-one slave configuration became
    fixed as a part of the ISA architecture. The ISA interrupt controller circuit
    is shown in Figure 9-5. In this configuration there are 15 IRQ lines which feed
    into the two 8259.


    If the interrupts reported by the 8259 were built in, then the different controllers
    in this configuration, shown in Figure 9-4, would all report the same set of numbers.
    This would not be satisfactory. The reason for having a controller circuit is
    that different wires on the IRQ bus can generate different interrupt numbers.
    Consequently, different 8259s need to report different interrupt numbers. The
    only easily way to do this is to make the 8259 programmable. An 8259 can be programmed
    to report any consecutive numbers starting at any multiple of 8 less than 256.
    Programming of the 8259 is done at boot time using OUT commands. The EOI command
    in 8259 is 20H. In the ISA architecture the master 8259 is assigned the data port
    20H (Could this be geek humor at work?) as well as 21H. The slave is assigned
    the ports 0AOH and 01H.'
