  md: '# 2.4 The Binary System


    Knowing the binary system is important because the native arithmetic of all existing
    computer processors is binary arithmetic.


    Binary numbers use only digits: 0 and 1. All binary numbers are constructed from
    just two digits. Counting goes like this: 1, 10, 11, 100, 110, 111, 1000, 1010,
    1011, 1100, 1101, 1110, 10000, 10001, 10010, etc.


    The binary system is a placeholding system except for the ones position stands
    for a unit which is twice the value of the next smaller unit. See Table 2.3.


    # 2.4.1 Binary Addition


    Suppose we want to add


    ```

    1101

    + 110

    ```


    which is thirteen plus six. The first column does not require a carry:


    ```

    1101

    + 110

    1

    ```


    Neither the second:


    ```

    1101

    + 110

    11

    ```


    The third column totals two, which is 10, which is carry 1:


    ```

    1

    1101

    + 110

    011

    ```


    The fourth column also totals two, which is again 0 carry 1:


    ```

    1101

    + 110

    10011

    ```


    This is exactly how a computer adds thirteen and six. We can check that the result
    is nineteen.


    ```

    1 x 16 = 16

    0 x 8 = 0

    0 x 4 = 0

    1 x 2 = 2

    1 x 1 = 1

    19

    ```'
