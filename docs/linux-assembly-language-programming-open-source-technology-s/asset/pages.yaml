  md: '# 3.6 Negative Number Representation


    The customary way to represent a negative number is to prepend a minus sign. Putting
    a - in front of a 3 makes a -3. This method of representing negatives is called
    signed magnitude representation. It can be implemented on the computer by allocating
    one bit for sign. To change the sign of a number that is stored using signed magnitude
    representation, one can simply flip the sign bit. Signed magnitude representation
    is not generally used for integers on the computer. The reason is that in order
    to do addition with signed magnitude representation, you need to do it the way
    it is taught to youngsters.


    # 3.6.1 Signed Magnitude Addition


    To add x and y:


    +   - Case I. If x and y are both positive, just add and make your answer positive.

    - Case II. If x and y are both negative, remove the negative signs, the numbers,
    and tack a minus sign onto the result.

    - Case III. If x and y have different signs, subtract the smaller magnitude from
    the larger magnitude, and if the larger magnitude has a minus sign, then tack
    this onto the result.


    Implementing signed magnitude addition with logic circuits on a chip would be
    a terrible waste of transistors.


    # 3.6.2 Easy Addition


    The method which is actually used with logic circuits to add x and y works like
    this: Pay no attention to whether x and y are positive or negative; just add them!


    Such a method would seem to be no method at all. But it works. It works because
    a special system for representing negatives is used, and because a register has
    a finite size, like an odometer.


