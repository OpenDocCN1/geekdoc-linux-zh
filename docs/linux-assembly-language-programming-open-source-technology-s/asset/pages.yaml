    # 6.2.4 16-Bit Addresses


    In 6.2.2 the [reg] format for memory addressing was presented where reg

    could be any of the eight 32-bit general registers. The 8086 and 80286 also use

    a [reg] format. Not all 16-bit registers are permitted, however, only BP, BX,

    SI, and DI. There is also a [reg + reg + imm] form must be a 16-number.

    If two registers are used, the only allowed combinations are BP + SI, BP + DI,

    BX + SI, and BX + DI. Since these restrictions are easy to forget, programmers

    not accustomed to 16-bit addresses may find themselves using disallowed forms
    of

    address. Most programmers will prefer to 16-bit addressing whenever possible.


    These 16-bit forms of memory address can be used on an 80386. When they

    our in 32-bit code, a special prefix, 67H, has to be applied to the machine code

    to notify the processor that memory address bits in the ModRM byte are coded

    using the 16-bit coding system. This prefix is called the address size prefix.
    It

    is similar to the operand size prefix introduced in chapter 5, 5.5.


    # 6.2.5 CISC vs. RISC


    An x86 computer is generally considered to be a complex instruction set computer

    (CISC). This is partly because of complicated addressing, as in the [EDX + 4+ESI

    + ABC] memory operand. Machines such as the SUN and MIPS workstations are

    based on the idea that simplifying the instructions and having fewer of them,

    they easier and faster to execute. This can make more up for the fact

    it takes more of these little instructions to write a program. Computing based

    on this philosophy is called RISC, reduced instruction set computing. The RISC\sv.
    CISC is not either- or like little endian RISC is\aset of features that may be
    adopted partially, in varying degrees. One reason

    the 486 and Pentium processors were able to compete with the early RISC

    PowerPC processors is that they adopted a piecemeal RISC philosophy. Although

    CISC instructions are allowed on a Pentium, it works faster if programmed using
    a

    RIS-like subset of the total instruction set.


    Their notwithstanding, the Pentium and Pentium Pro have gone

    over to a total RISC architecture. The instruction used internally is a pure

    RISC instruction set. Traditional x86 instructions are converted internally to
    RISC

