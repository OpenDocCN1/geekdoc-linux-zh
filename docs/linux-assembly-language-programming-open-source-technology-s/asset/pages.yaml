    \ this obstacle.\n\nTo use a system call from assembler, it is necessary to know\
    \ the parameter passing conventions. These conventions are established by macros\
    \ also located in unistd.h. According to the conventions used in Linux 2.2, the\
    \ parameters are stored in left to right order in registers EBX, ECX, EDX, EDI,\
