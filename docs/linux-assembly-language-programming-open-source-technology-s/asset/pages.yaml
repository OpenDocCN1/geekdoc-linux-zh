    # Program 9.1


    Suppose that the printer with the data port at port 378H also has a status port
    at port 379H and responds to an inquiry to this port with a 1 when it is ready
    and with a 0 when it''s not. In this case the output loop might look like this:
    A loop


    ```

    MOV EDX, 379H ; Printer status port

    MOV ECX, 0

    IN AL, [DX] ; Ask the printer if it''s ready

    CMP AL, 1 ; 1 means it''s ready

    JNE XYZ ; If not try again

    MOV AL, [ABC + ECX]

    DEC EDX ; Data port is 378H

    OUT [DX], AL ; Send one byte!

    INC ECX

    INC EDX ; Put back the status port

    CMP ECX, 100000

