    in 16–39 and 56–63, 24 bits fill eight bits. (This odd fracture is a vestige of
    the 24-bit addressing used on the 80286.) Displaying all eight bytes as a 16-digit
    hex number, using X for undetermined yields


    ```

    02 XX XX 00 00 XX XX

    ```


    The 32-bit limit values are coded into 21 bits by restricting the number of allowable
    limit values. The 20 bits from 0–15 and 48–51 encode five digits. Bit 55, G for
    granularity, determines whether the remaining three hex digits will be 0 added
    to the top end or F added to the scheme. If we use G = 0 for byte granularity,
    inserting the 20 limit bits, FFFFF, gives us:


    ```

    02 F XX 00 00 00 FF FF

