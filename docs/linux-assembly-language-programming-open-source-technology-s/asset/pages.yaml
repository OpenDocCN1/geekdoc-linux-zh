    \ appearances, the write() system call is not an ordinary C function. Like all\
    \ system calls in Linux, it use INT 80H to transfer control to the kernel. Each\
    \ system call in Linux has a number. A list of these calls and their numbers can\
    \ be found in /usr/src/linux/arch/i386/unistd.h. In Linux 2.0, write() is system\
    \ call 4. To carry out this system call, the number 4 must be stored in the EAX\
    \ register before INT 80H is called.\n\nIn DOS, many calls are made using INT\
    \ 21H. The number stored in the AH register determines which system call is being\
    \ made. A list of these calls can be found in standard books on DOS. The book\
    \ Undocumented DOS by Andrew Schulman, et al., attempts to list all of them. The\
