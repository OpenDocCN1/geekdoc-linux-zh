    # ## 11.1.3 Direct Memory Access


    The reader interested in getting on to device drivers may skip ahead to section
    11.2. The reader curious about what keeps the floppy drive, or other peripherals
    for that, from interrupting the processor after every fetched byte should read
    the next two paragraphs.


    In addition to the IRQ line, the 8272 also has an output line called DMARQ, for
    *DMA request* for *direct memory access*. Instead of using the IRQ line, the 8272
    may be programmed to use the DMARQ line instead. The DMARQ line runs from the
    8272 to a processor called a DMA controller which is equipped to issue , bus control
    signals and write bus cycles. It can relieve the CPU of the task of transferring
    bytes one at a time from the floppy drive into memory. In order to use the bus
    cycle machinery by the DMA not interfere with the CPU, which is constantly using
    the buses to fetch instructions, there is a HOLD line running from the DMA controller
    to the CPU and a HOLDA (hold acknowledge) line running from the CPU to the DMA
    controller. To use the buses, the DMA controller must ask for permission using
    the HOLD and receive it on the HOLDA line. Incrementally, the programmer must
    instruct the CPU to without permission using the LOCK prefix.


    Setting up a DMA transfer requires more work on the part of the programmer than
    setting up a 512-byte file. The floppy controller, but it results in saving a
    great deal of CPU time.


