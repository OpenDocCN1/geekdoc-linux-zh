  md: '# ABOUT THE CD


    The CD-ROM accompanying this book contains six directories:


    +   1. The cq directory contains the device driver files for theMorse code speaker
    driver.

    2. The dosemu directory contains a distribution of the dosemu program. It can
    also be obtained from www.dosemu.org.

    3. The edlinas directory contains the DOS executable EDL.EXE and another file
    X86.DAT, which is required for Edlinas to execute. Subdirectories of this directory
    contain source code, compiling information, and sample programs.

    4. The nasm directory contains the compressed download of the NASM program as
    well as a copy of the license governing its use. It can also be obtained from
    www.cryogen.com/nasm.

    5. The ob directory contains the source code for the object code parser, ob.

    6. The scalex directory contains the device driver files for the Scaladex driver.


    # TECHNICAL SUPPORT


    Prentice Hall does not offer technical support for this CD-ROM. However, if there
    is a problem with the media, you may obtain a replacement copy by emailing us
    with your problem at:


    disc_exchange@prenhall.com'
