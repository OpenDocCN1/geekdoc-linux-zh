  md: '# CHAPTER 11


    # DEVICE DRIVERS


    In chapter 6, the use of memory commands was discussed assuming that the programmer
    has unrestricted access to memory. In chapter 8, the use of memory commands in
    user programs where Linux restricts memory access is discussed. In chapter 4,
    section 4.2, the use of I/O commands is discussed, again assuming that the programmer
    has unrestricted I/O access. Although there are system commands whose purpose
    is to grant I/O access to a user, the default situation in Linux disallows the
    use of IN and OUT instructions issued in user programs. System calls translate
    service requests into IN and OUT instructions. Because system calls execute at
    privilege level zero, these I/O instructions can be executed.


    A device driver consists of all the programs needed to translate system calls
    to a particular device into I/O instructions to that device, plus a program to
    handle interrupt service requests by the device. All the programs in the device
    driver are incorporated into the Linux kernel. Over half the code in Linux is
    driver code.


    There is a lot of code involved because there is a variety in the hardware devices
    being accessed. It is a notable achievement of Unix that this multiplicity of
    hardware is brought under the control of a small repertoire of simple commands.
    An important stage in the development of this repertoire was the concept of a
    device-independent file.


