    #  3.1.2 Behavior of the NOT Gate


    The NOT gate is a logic gate which has one input terminal. To describe the behavior
    of the NOT gate, all that is needed is describe how its input determines its output.
    The rules are:


    +   - If the input is at logic 1, the output is logic 0.

    - If the input is at logic 0, the output is at logic 1.


    We can now put a flashlight by hooking the output of the NOT gate to a bulb and
    the input to a mechanical switch. Figure 3-3 illustrates this hookup. When wires
    in a diagram are shown crossing at a black dot, it means the wires are not in
    contact with each other. When wires cross and there is no black dot, it means
    they are connected. The flashlight is ultimately controlled by a mechanical switch,
    just like the flashlight in Figure 3-1. When the switch is in the down position
    as shown in the figure, the flashlight is on. The down position connects the input
    of the NOT gate to the negative battery terminal, which puts it at logic 0. Therefore,
    because of the way a NOT gate works, the output is at logic 1. This means that
    the output terminal is connected internally by the NOT gate to the positive power
    terminal and therefore to the positive end of the battery. Hence the bulb gets
    current and the flashlight is on.


