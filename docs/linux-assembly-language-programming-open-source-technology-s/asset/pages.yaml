  md: 'For a more involved example, consider the following algorithm. This algorithm
    is at the heart of a well-known, unsolved mathematics problem called the Collatz
    Problem.


    If x is even divide it by 2

    If x is odd multiply it by 3 and add 1 to it.


    Repeat this process until x = 1.


    Suppose we want a program which executes this algorithm and counts how many steps
    are required until the value of x becomes 1.

    It requires a loop to determine whether a number is even or odd, or to divide
    it by 2, if we are using only add, subtract, and conditional jump commands, it
    makes sense to devise a subprogram to do this. Specifically, suppose we assign
    the subprogram the task of examining the EAX register and storing half of EAX
    in EBX if EAX is even, and zero in EBX otherwise. We may code this subprogram
    as:


    ```

    HAF: MOV ECX, EAX

    MOV EBX, 0

    AGN: INC EBX ; Count the subtractions

    SUB ECX, 2 ; Repeatedly subtract 2

    JG AGN ;

    JZ DUN ; It comes out even

    MOV EBX, 0 ; It''s not even.

    DUN: RET

    ```


    # Program 7.4


    With this subprogram we may now write a main program which executes Program 7.4.


    # 7.3 Parameter Passing


