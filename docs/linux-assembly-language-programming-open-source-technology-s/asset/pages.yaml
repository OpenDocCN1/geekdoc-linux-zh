  md: '# 1.5 NASM


    The Nationwide Assembler, or NASM, is an open source assembler that runs under
    Linux as well as DOS. Its use is increasing and has much to recommend it. In particular
    due to its widespread use, it has been exposed to a very thorough debugging. It
    also accepts a broader vocabulary of assembly language instructions than Eldinas.
    Most of the programs in this book may be assembled using either assembler. Eldinas
    can be used to step through the example programs in the text, but for the bigger
    programs such as the interrupt handler in chapter 11, NASM is definitely the better
    choice. NASM is an industrial-strength assembler.


    To unpack the distribution, which comes with this, use the command


    ```

    linuxbox$ -al nasm097s.zip

    ```


    after copying it to a suitable directory. To build it, you can then copy the appropriate
    makefile


    ```

    linuxbox$: cp makefile.unix Makefile

    ```


    and run


    ```

    linuxbox$: make

    ```


    # 1.6 Other Assemblers


    MASM and Turbo-Assembler are assemblers that have been very widely used in connection
    with DOS. The fact that Windows is not so easy to work with assembly language
    has led to a decrease in the popularity of these assemblers. Many people have
    the impression that Linux is not particularly assembler-friendly either. This
    impression is partly based on the view of assembly language that you get working
    with gcc. Those accustomed to Intel syntax may understandably find the AT&T syntax
    awkward. Worse, when assembly language instructions are inserted into C code,
    the quotation marks required by gcc and the line-jumbling that occurs are pretty
    relevent. I hope that by chapter 7, readers will be persuaded that interacting
    with Linux using assembly language can be clean and neat.


    There are a few other assemblers around. A brief discussion of them can be found
    in an Assembly-HOWTO at the Linux Documentation Project''s Website, www.linuxdoc.org/HOWTO.


    # Further Reading


    Open Sources, Voices from the Open Source Revolution, by Chris DiBona et al.,
    O''Reilly: 1999.


    A Quarter Century of Unix, Peter Salus, Addison-Wesley: 1994.'
