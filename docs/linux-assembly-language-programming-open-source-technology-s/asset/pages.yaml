    # 10.3.2 Edge vs. Level Triggered IRQ Bits


    The 8259 programmable interrupt controller discussed in chapter 9, 9.2 has a register
    which determines whether the interrupts it receives will be processed as edge-triggered
    or level-triggered. There is one bit for each of the eight IRQ lines it handles.
    The difference between the two triggering modes is important. If an I/O device
    uses level-triggered signaling and the 8259 treats its IRQ as edge-triggered,
    then interrupt signals from the I/O device could be ignored. By using bit manipulation
    commands, it is possible to single out one bit on this register and change it.


    For example, suppose that we are installing a card which sends out edge-triggered
    interrupt requests on IRQ4 (IRQ4 is the request line conventionally associated
    with COM1). On an ISA machine the register which controls this is located at I/O
    port D40H. It is called ELCR (Edge/Level Control Register). Each 0 bit makes the
    corresponding IRQ line edge-triggered; each 1 bit causes level triggering. The
    simplest way to make IRQ4 edge would be to write a 0 to this port.


    ```

    MOV AL,0

    MOV EDX, D40H; ELCR''s address is D40H.

    OUT [DX]; Store a zero in the ELCR.

    ```


    But this would be a bad idea. It would make all eight bits in the ELCR. Any of
    the IRQs which happen use level triggering would get foiled. To set them all correctly,
    we must know what all the triggerings are for all inputs, or we can just leave
    them as they are except for the fourth bit. To make bit 4 zero, we can OR the
    contents of the ELCR with the binary 1110 1111 = EFH. To do what we need to read
    from the ELCR, do the masking, and then write back to it.


    ```

    MOV EDX, D40H : ELCR''s address is D40H.

    IN AL, [DX] ; Read the ELCR register.

    AND AL, 0EFH ; Mask bit 4.

    OUT [DX], AL ; Write altered byte out to the ELCR.

    ```


