    # 11.3.6 Signals


    Processes in Unix has a handful of different mechanisms available to communicate
    with each other. One of these is the sending of signals. When a process is killed
    with a ctrl-C or a kill command, the process has received a signal. To explain
    what a signal is, we need to expand on the notion of a task. We have described
    the task state segment as a region of memory where registers are saved when a
    task occurs. The task state segment is maintained by the hardware. But it is also
    part of the contextual information that is maintained by Linux for each process.
    There is a structure struct task_struct defined in /src/linux/include/sched.h
    which holds all the information Linux needs on a process. This information is
    available to the device driver when it is executing in behalf of a process because
    there is a global variable in kernel memory called whose value is always the task
    structure for the current process. In the driver for /dev/cq, for example, it
    makes sense to access this variable from cq_write() but not from cq_timer_handle().
    One of the components of struct task_struct is the hardware''s task state segment.
    The component is the Process ID number which shows up when ps is running. It is
    needed when killing jobs from the command. Another component of struct task_struct
    is signal. This component is typed as an array of integers. Each bit in the array
    can carry a signal. With two-two-bit integers in the array, Linux is configured
    for a maximum of 64 signals. Whatever the subtle distinctions are between all
    of these different signals, receiving a signal means just one thing to a device
    driver: it''s time to quit.'
