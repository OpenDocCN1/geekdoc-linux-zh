    A device-independent file is a list of bytes with a name, and that''s all it is.
    As such, it is an abstraction. It soon proved to be a very useful abstraction.
    Immediately in the wake of the device-independent file concept followed another
    innovation of the Multics operating system. This idea was that it should be possible
    for a programmer to treat I/O devices (printers, terminals, etc.) as device-independent
    files. This is the basis of the Unix device abstraction. Inputting data from a
    device can then be done just as you would "read" from a file. Outputting data
    to a device can be done just as you would "write" to a file. Turning file operations
    into generic device operations makes easier for the applications programmer and
    also clarifies the code of the driver. Its role is to provide the kernel with
    device specific versions of read(), write(), open(), etc., that can be accessed
    when it is processing those generic system calls which come from user programs.


