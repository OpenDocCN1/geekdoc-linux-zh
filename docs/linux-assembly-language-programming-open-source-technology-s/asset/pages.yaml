  md: "Chapter 11 Device Drivers\n\nwill start the speaker beeping. In order for this\
    \ to happen, there has to be an entry\nnamed cq in the /dev directory, which has\
    \ a connection with the programs as\ncq_write().\n\n# 11.3.11 Loose Ends\n\nTo\
    \ finish the device driver, it is only necessary to /usr/include/linux/major.h\
    \ file.\n\n+   * Add a number for the device to the device for the /usr/include/linux/major.h\
    \ file.\n\n+   * Create an entry for the device in the /dev directory using the\
    \ mknod command.\n\n+   * Write a cq_init() function and include a call to it\
    \ in the mem.c file.\n\n+   * Modify the Makefile for the directory containing\
    \ the driver, in this case\n/usr/src/linux/drivers/char/, and recompile the kernel.\n\
    \nThe /dev directory contains a list of many files, most of which are not\nactually\
    \ files. The ls -l command distinguishes different types of files in the\nfirst\
    \ character of each line. Files which are real are listed beginning with\na-,\
    \ directories are listed with a d, hard links with an l, etc. Devices are listed\n\
    with either b or c, depending on whether they are block devices or character\n\
    devices. Block devices transfer data in blocks, i.e., big uniformly-sized chunks.\
    \ To\ndo this, they interact with the kernel's buffer cache. Block devices can\
    \ be mounted,\ni.e., incorporated into Unix's tree-structured file hierarchy.\
    \ A hard drive is a good\nexample of a block device. Character devices don't use\
    \ blocks and they don't\nget mounted. Our little speaker driver is a character\
    \ device. Each device listing,\nfor a block or a character device, also lists\
    \ a major number and a minor\nnumber. The major number is used as an index into\
    \ chrdevs, a kernel array of\ncharacter device drivers.\n\n```\nstruct device_struct\
    \ chrdevs[MAX_CHRDEV]\n```\n\nEach device driver is just a\n\n```\n{\n    const\
    \ char * name;\n    const struct file_operations * fops;\n};\n```\n\nThe device\
    \ is entered into the array by the function register_chrdev() which\nis defined\
    \ in /usr/src/linux/fs/devices.c. The most important lines of this\ndefinition\
    \ are as follows."
