  md: '# CHAPTER 6

    MEMORY


    In chapter 4, section 4.2 we noted that the MOV command can be used to transfer
    data to and from memory just as IN and OUT can be used to transfer data to and
    from I/O devices. For the programmer, using MOV to access memory is simple: just
    enclose an address in brackets. Neither DOS nor Linux, however, are the addresses
    enclosed by brackets actual addresses. In DOS an processing mechanism called segmentation
    is used, and in Linux another called paging is used. In this chapter we make the
    simplifying assumption that this is done that addresses enclosed in brackets are
    hardware addresses. Programs run under Edinas. Segmentation and paging will be
    dealt with later. Segmentation is discussed in chapter 12, and paging is discussed
    in chapter 8.


    # 6.1 4-Byte Data Width


    Data transfer between a processor and its memory is easy when word size and register
    size agree. For example, the 8080 processor fetches eight-bit words into its eight-bit
    registers. Eight-bit registers are, of course, mainly a thing of the past. But
    eight-bit words we still have. Intel has implemented many measures so that its
    new processors would run old software. One of these has the maintenance of eight-bit
    words, despite the fact that processor registers and data transfers long outgrew
    the eight-bit size. The 386 processor, for example, has 32-bit registers and 32-bit
    data transfers,


    When register and word sizes don''t match, simple transfer commands no longer
    make sense. For example, without further protocols in place the command


    ```

    MOV [19H], EAX

    ```


    does not make sense. The memory location referred to, like Intel memory locations,
    is an eight-bit location. But EAX is a 32-bit register.


    # 6.1.1 Storage Protocols


    Two further protocols are used.'
