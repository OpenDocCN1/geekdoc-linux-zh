    ```


    # Program 9.2


    like solves the problem of lost data by reducing processor throughput down to
    the speed of the printer. Most of the processor''s time is spent executing the
    three instructions following the XYZ label.


    Successively querying I/O device after another about its status is called polling.
    Polling makes a modest improvement in this situation by putting an inquiry to
    all pending I/O devices into one status loop. But it is still clearly a waste
    of processor time.'
