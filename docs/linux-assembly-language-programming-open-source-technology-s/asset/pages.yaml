  md: 'When these four steps have been completed, control has been transferred to
    kernel code, which runs at CPL = 0. The resources of the processor, which are
    accessible from this level of privilege, include all the data structures vital
    to the functioning of the operating system as well as the hardware and the memory.


    When the ISR is concluded, then with one exception, control is returned to the
    user code. Both the stack and the CPL are restored. The exception is in the case
    of the timer interrupt.


    # 9.8 Scheduling


    In Table 9.3 we see that the maskable interrupt with the highest priority is the
    timer interrupt. The ISR for this interrupt keeps track of time used by all processes.
    In particular, it sets a flag called `need_resched` when a process is out of time.
    When Linux does a return from any interrupt, the timer interrupt included, it
    checks this flag, and calls `schedule()` if `need_resched` is set. The `schedule()`
    system call is the `scheduler`. It is the central program in the operating system.
    It determines which process gets to run next. When necessary, it initiates a task
    switch.


    So the ultimate computing resource, processor time, also falls under the control
    of the CPL-based protection system.


