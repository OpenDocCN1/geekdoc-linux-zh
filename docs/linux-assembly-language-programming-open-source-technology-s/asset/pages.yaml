  md: '# 2.3 Conversion to Pentimal


    Sometimes conversions are unavoidable. For a computer to be able to store a number
    in binary which is input in decimal, a conversion is needed. Although conversions
    can be done by searching for a representation which works, there are more efficient
    methods. Consider the conversion of 207 into base five. To understand this, may
    help to look at the answer before we start:


    ```

    1312 = 1 \cdot 5^3 + 3 \cdot 5^2 + 1 \cdot 5^1 + 2 \cdot 5^0

    ```


    We can see that five can be factored out of this sum, except for the 2 at the
    end:


    ```

    1312 = (1 \cdot 5^2 + 3 \cdot 5^1 + 1 \cdot 5^0) \cdot 5 + 2

    ```


    But this just says that the quotient and remainder of 207 divided by 5 are. Notice
    that the remainder is our units digit. Furthermore, we can calculate the quotient
    and remainder using base ten, which is what we have available when we start this
    conversion:


    ```

    41\n207\n-5\n2

    ```


    and so our ones digit is 2.


    We have in base ten that:


    ```

    207 = 41 \cdot 5 + 2

    ```


    where again peeking at the answer shows us that:


    ```

    41 = 1 \cdot 5^2 + 3 \cdot 5^1 + 1 \cdot 5^0

    ```


    The quotient, 41, contains the information needed to get all the other digits.
    We can be obtained using more divisions:


    ```

    8\n41\n-5

    ```


    and adjoining this digit gives us 12.


    ```

    5\n8\n-5

    ```


    which gives us 312.


    The last division has a zero quotient:


    ```

