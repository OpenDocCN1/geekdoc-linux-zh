  md: '# 4.8.1 The Pentium''s Dual Pipeline


    If we look at the time for each instruction to execute, in the first case we get


    $\frac{110.0}{4,294,967,289 \times 6} = 4.303\text{ ns}$


    This arithmetic assumes that the program spent all of its time in the loop. Comparing
    this with the length of one cycle clock,


    $\frac{1}{120,000,006} = 8.333\text{ ns}$


    we find the amazing result that the time for two instructions to execute, 8.606
    nanoseconds, is just a little over one cycle clock. Since one instruction per
    cycle is ideal under ordinary circumstances, what we have here is special. It
    is an illustration of the Pentium''s dual pipeline. When possible, the Pentium
    pairs instructions off and executes two at once. This is how rates of more than
    one instruction per cycle can be achieved. (There is actually another pipeline
    for floating point numbers.) The instruction pairing also explains why the 2:1
    improvement we might have expected when we reduced the number of instructions
    in the loop from six to three did not materialize. What happened was that the
    number of instruction pairs went from three to two, one of the “pairs” being half-empty.
    The time 76.14 nanoseconds is .687 of 110.9 nanoseconds. This is approximately
    two-thirds, suggesting the use of two instruction pairs instead of three for each
    pass through the loop.'
