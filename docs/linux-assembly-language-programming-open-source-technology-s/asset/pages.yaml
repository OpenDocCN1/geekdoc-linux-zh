  md: '# Figure 8-3. x86 Virtual Memory System


    The translation between the virtual addresses and the real ones is done using
    extensive sets of tables called page tables. Each process has its own set of tables.


    Figure 8-5 shows the situation which results. The reader will note that memory
    has been seriously overbooked. There are typically many processes running. Each
    process uses potentially 4 Gig of virtual address space. But the typical computer
    has much less RAM than would be needed to supply all processes with 4 Gig! At
    first sight, paging seems to be a very bad idea. But in fact it economizes on
    memory usage and is one of the reasons computers are able to run big programs
    as fast as they do. Airlines overbook in order to keep their planes occupied.
    The cost of free airline tickets now and then to bumped passengers is more than
    paid for keeping the seats full. Likewise, the occasional page fault is not made
    up for keeping the seats busy.


    Paging works by copying temporarily idle portions of memory onto disk. As suggested
    by its name, it works in units called pages.


    # 4K Pages


    On an x86 machine, a page is 4,096 bytes. In order to set up a paging system,
    four areas need to be divided up into pages:


    ![](img/e6bb80db7ee4cfb71e664401ff93b58b_144_0.png)'
  merge: -1
