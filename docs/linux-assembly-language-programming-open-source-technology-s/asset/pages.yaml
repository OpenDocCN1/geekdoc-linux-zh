  md: 'Motorola''s 6800 and 68000 processors. MIPS and PowerPC processors can work
    in either mode.


    In order to encourage software developers to migrate away from competing hardware,
    a common strategy is to incorporate compatibility features. A compatibility feature
    added to the 486 processor is the BSW instruction. It reverses the byte ordering
    of any 32-bit general register. Its format is simply:


    ```

    BSWAP reg

    ```


    For example the EAX register contained the number 12345678H, then following the
    execution of the BSWAP EAX command, it would contain the number 78563412H.


    # 6.1.3 Alignment


    The discrepancy between the four-byte data transfer size and the one-byte word
    size which exists in 386 and 486 systems is not fully reflected in the hardware.
    In fact the one-byte word size is a kind of fiction maintained for the benefit
    of the software. Although memory on these systems is forced to emulate a one-byte
    word memory, words are actually four bytes wide. The two lowest bits of the 32-bit
    address bus are not there. The wires on the address bus are A31 through A2. A1
    and A0 are missing. From a hardware point of view, a 386 addresses $2^{30}$ 32-bit
    words. The 역시 is a fiction. But because the fiction is consistently maintained,
    software which believes this fiction works. It doesn''t work as well as software
    which takes the true state of affairs into account. For example the command


    ```

    MOV EAX, [10H]

    ```


    access four bytes of memory whose 32-bit addresses are


    ```

    0000 0000 0000 0000 0000 0000 0001 0000

    0000 0000 0000 0000 0000 0000 0001 0001

    0000 0000 0000 0000 0000 0000 0001 0010

    0000 0000 0000 0000 0000 0000 0001 0011

    ```


    Note that these addresses differ only in the "non-existent" bottom two bits. These
    four bytes are actually just one four-byte word. The command can be accomplished
    with a single memory transfer. On the other hand the command


    ```

    MOV EAX, [12H]

    ```


    which also accesses four bytes of memory, cannot be carried out in the same way.
    The 32-bit addresses of these four bytes are


    ```

    0000 0000 0000 0000 0000 0000 0001 0010

    0000 0000 0000 0000 0000 0000 0001 0011

    0000 0000 0000 0000 0000 0000 0001 0100

    0000 0000 0000 0000 0000 0000 0001 0101

    ```'
