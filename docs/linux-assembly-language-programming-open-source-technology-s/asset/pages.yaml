  md: '# LINUX

    Assembly Language Programming


    BOB NEVELN


    In Linux Assembly Language Programming, Bob Nevel explains all the key features
    of x86 assembly language in the context of the Linux operating system and the
    C language. The book''s step-by-step, one-concept-at-a-time coverage will help
    any hardware programmer move to Linux and master essential skills for Linux device
    driver development. You won''t learn new x86 assembly language skills, you''ll
    also gain powerful "under the hood" insight into how Linux works.


    The first Linux-centered guide to x86 assembly language!


    # Linux x86 assembly language programming, from start to finish!


    +   - Place-holding numeration

    - Logic circuits

    - Computation

    - The four-field format

    - Machine language

    - Memory

    - The stack

    - Linux user programs

    - NASM

    - DOS programs

    - Interrupts

    - Bit manipulations

    - Device drivers

    - And more...


    Bonus CD-ROM includes the popular Open Source assembler NASM; edlin, the #1 x86
    assembler development simulator–PLUS, all sample device drivers from the book!


    # ABOUT THE AUTHOR


    BOB NEVELN U.S. currently coordinator of Computer Science at Widener University,
    where he has worked on the mathematics and evolution of the genetic code. He holds
    a Ph.D. in Mathematics from Northwestern University.


    $44.99 U.S. $68.00 Canada

