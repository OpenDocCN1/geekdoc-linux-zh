  md: '# CHAPTER 9


    # INTERRUPTS


    The fetch-execute cycle is a program-driven model of computation. But computers
    are not totally program driven. To some extent they are hardware driven. CPUs
    are equipped with input signal pins which allow the fetch-execute cycle to be
    interrupted. The original purpose of these pins was to increase processor efficiency
    by reducing the amount of time spent in communication with I/O devices.


    In chapter 8 we saw how a device to increase memory efficiency was adopted as
    a device for controlling memory access. Interrupts undergo a similar transition.
    This chapter begins by how interrupts economize on processor time. Then, starting
    with section 9.6, we will see how interrupts are used to control processor access.


    # 9.1 Polling


    Without interrupt pins, I/O communication would have to rely on processor instructions
    such as the IN and OUT commands.


    # 9.1.1 Data Ports


    Suppose that a processor is sending characters from a buffer located at ABC to
    a printer located at port 37H, and to do this one-by OUT commands from a loop,
    as shown in Program 9.1. Assuming one instruction per machine cycle, each execution
    of the loop would take five machine cycles. At a clock rate of 100 MHz, all 100,000
    characters would be sent to the printer in .005 seconds. This is enough time for
    the printer to print one or two of them. The printer would be swamped, and most
    of the output to the printer would be lost.


    Printers are slower in comparison to processors. So are most other I/O devices.


    # 9.1.2 Status Ports


    To prevent data loss, a printer must have a status port as well as a data port.
    The processor will then be required to inquire of the status port whether or not
    the printer is ready to receive another character. The processor will only output
    another character when the printer is ready.'
