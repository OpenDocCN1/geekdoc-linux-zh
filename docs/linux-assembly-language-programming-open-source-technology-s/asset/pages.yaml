  md: '# 238 Chapter 13 Linux Boot Time Programs


    ![](img/e6bb80db7ee4cfb71e664401ff93b58b_257_0.png)


    Figure 13-7. Memory with Protected Segments


    In Figure 13-7, there are eight memory segments. Each of these memory segments
    is defined by a descriptor situated in a descriptor table. Although the global
    table is like a segment, it is not a segment. There is no descriptor for it anywhere
    in memory and no selector for it anywhere in the processor.

    Reviewing briefly, the operating system protects the memory belonging to one task
    from access by another task by using local descriptor tables. A new task would
    receive a local descriptor table containing descriptors of all the segments to
    which that task is allowed access. So long as the operating system did not put
    the same descriptor in the local table belonging to some other task, that segment
    would be private. A task can only access a segment if a descriptor for that segment
    is in the global table or its own local table.'
