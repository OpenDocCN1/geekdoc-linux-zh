    # 3.13.3 Negative Numbers and Congruences


    Two''s complement representation is used for negative numbers, in part because
    it allows addition and subtraction hardware to be used irrespective of whether
    the bits being operated on are intended as signed integers or as unsigned integers.
    The mathematical explanation for why two''s complement representation works like
    this is based on a concept due to C. F. Gauss, a remarkable nineteenth century
    mathematician.


    Gauss defined a ≡ b(mod m) to mean that a and b differ by some exact multiple
    of m. In two''s complement representation, a negative number and the positive
    number are used to represent it by the turnover value of the registers being used.
    If four-bit registers are being used, then each negative and its positive representation
    differ by 2^4, or 16, as shown in Table 3.9. In Gauss'' notation, for example,
    -5 ≡ 11 (mod 16). When the computer does (-2) + (-3) as 14 + 13, it depends on
    the fact that 14 + 13 = 27 ≡ -5 (mod 16). The four-bit addition hardware produces
    11 because a carry of 16 is lost. But that is okay. Eleven is the correct representative
    for -5.


    # Congruence Addition Theorem


    This reasoning is summarized in the following theorem due to Gauss:


    ```

    If a ≡ b(mod m) and c ≡ d(mod m)

    then a + c ≡ b + d (mod m)

    ```


    This theorem shows that congruences can be added just like equations. Gauss devised
    the congruence notation in order to make the point that a congruence is similar
    to an equation.


    # Congruence Multiplication Theorem


    The following theorem states that congruences can also be multiplied just like
    equations.


    ```

    If a ≡ b(mod m) and c ≡ d(mod m)

    then a · c ≡ b · d(mod m)

    ```


    Because of this nice theorem, we should be able to use both signed and unsigned
    numbers with MUL just like ADD and have no problems! Except for one.

    We want to double the register size as we go. So the theorem we really need is
    this:'
