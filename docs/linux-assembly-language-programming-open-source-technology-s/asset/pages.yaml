    # 13.2.2 Special Segments, the GDT and the IDT


    Shown in Figure 13-3 are registers for the task state segment, the local and global
    descriptor tables, and the interrupt descriptor table, the TSS, LDTS, GDT, and
    IDT. None of these are memory segments in the sense that they can be used in an
    ordinary memory access command. For example,


    ```

