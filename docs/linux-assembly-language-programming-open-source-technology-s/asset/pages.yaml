    An odometer is an adding machine. It adds the miles that you drive. Mileage is
    always considered to have a positive value. (Would a negative value imply driving
    backwards, or what?) However, consider the following equation, which we would
    ordinarily think of making sense only for negative numbers.


    ```

    x + 10 = 5

    ```'
