  md: '# Section 12.1. Real Mode Segmentation


    ```

    MOV AX, 5000H

    MOV ES, AX

    MOV AX, 0C800H

    MOV SS, AX

    ```


    So then DS holds 2000H, ES holds 5000H, and SS holds C800H. Figure 12-2 shows
    the three segments which are enabled by these three register loads. The entire
    memory consists of the addresses from 0 through FFFFFH. The DS segment consists
    of the addresses from 20000H through 2FFFF. The ES segment ranges from 50000H
    through 5FFFF. The SS segment goes from C8000H through D7FFF.


    # 12.1.2 Segment:Offset Notation


    Suppose now we would like to refer to the memory whose address is 23456H in an
    assembler command. This address lies in the DS segment. (This is because 2000H
    was just stored in the DS register.) It is 3456H bytes from the base address,
    the difference minus the base address, is called the offset. The segment:offset
    pair is often used in the assembly language as follows:


    ```

    MOV BL, DS:[3456H]

    ```


    In NASM the syntax is


    ```

    MOV BL, [DS:3456H]

    ```


    This command loads the contents of memory location 23456H into BL. 23456H = 2000H
    + 3456H. Note that the base address itself is a five-digit hex number, even though
    DS only holds four digits, in this case 2000H.


    The address 23456H is a physical address, not a virtual address. The bits which
    the processor pushes onto the ds bus may be read off the binary number


    ```

    0010 0111 0100 0110

    ```


    The same memory read could be accomplished using a 16-bit address register as:


    ```

    MOV BX, 3456H

    MOV BL, [DS:BX]

    ```


    BX, BP, SI, and DI may be used for addressing in this way, but SP, AX, CX, and
    DX may not.


    # 12.1.3 Default Segments


    Segment designations may be omitted. There is always a default segment. Referring
    to Table 12.1, we see that the default segment for an immediate address is the
    DS segment. Hence the command


    ```

    MOV BL, [3456H]

    ```'
