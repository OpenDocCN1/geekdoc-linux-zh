  md: '# CHAPTER 12


    # DOS PROGRAMS


    Linux was written for the 386. The 386 retains many of the features of the 8086.
    Since DOS was written for the 8086, there is much to be learned about the 386
    from the study of DOS programs.


    The environment in which a DOS program operates is very different from the environment
    of a Unix program. It is remarkable that one and the same processor can sustain
    both of these environments. Three main differences between the DOS environment
    and the Unix user program are


    +   1 Memory referencing. In Unix, memory access is controlled using a virtual
    memory system. In Linux, virtual memory is based on paging. The applications programmer
    has no direct access to physical memory. In DOS, there is no paging. Knowing the
    physical address of a memory location enables the programmer to write directly
    to that location. It requires manipulation of the segmentation process, as is
    explained in chapter 12, section 12.1. In Unix, the applications programmer may
    ignore the segmentation process since for users there is just one big segment
    and it is always the same.


    +   2 Privilege level. In Unix, only system programs have system-level privilege.
    User programs do not. Strictly speaking, DOS has no privilege levels. But


    ![](img/e6bb80db7ee4cfb71e664401ff93b58b_231_0.png)


    Figure 12-1. Unprotected Operating System such as DOS'
