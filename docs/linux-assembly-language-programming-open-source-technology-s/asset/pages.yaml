    ![](img/e6bb80db7ee4cfb71e664401ff93b58b_166_0.png)


    **Figure 9-1.** A Computer with Only One Interrupt


    # ## 9.2 External Interrupts


    In order to allow programmers to avoid relying on polling, processors have at
    least one interrupt pin which allows I/O devices to signal the processor when
    they need the processor to do something. Such a pin is called an *interrupt pin*.
    An interrupt pin makes it possible for an I/O device to initiate communication
    with the CPU. A CPU without an interrupt pin has been compared to a telephone
    without a bell.


    Suppose that a printer is connected to an interrupt pin on the CPU, as shown in
    Figure 9-1. With the printer hooked up to the CPU in this way, the CPU would be
    able to ignore the printer until it received a signal. It could then process a
    printer character and return to its main job. There would be relatively little
    wasted time. This setup would work fine if the printer were the only I/O device
    which ever needed attention. But of course there are many such devices.


    To allow several I/O devices, one might expect there to be several interrupt pins
    on the processor. The x86 architecture does not do this way. It has only one general-purpose
    interrupt pin. It delegates the abration of interrupt signals to an external circuit
    called the *interrupt controller circuit*, as shown in Figure 9-2. This figure
    also shows an IRQ bus from the I/O system to the interrupt controller circuit.
    An IRQ bus consists of wires from various I/O devices. Each device that needs
    interrupt service is given one of the wires on this bus, assuming that there are
    enough of them to go around, that is. The IRQ buses are numbered IRQ0, IRQ1, etc.
    IRQ stands for *interrupt request line*. The numbers 0, 1, etc., encountered in
