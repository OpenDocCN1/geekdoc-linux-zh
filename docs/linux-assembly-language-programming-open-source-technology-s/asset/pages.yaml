    actually, when DOS is running, all programs execute at effectively system-level
    privilege. Linux user programs do not carry system-level privilege. One consequence
    of this is they do not have direct I/O access. That is, they are not allowed to
    use either the IN or the OUT instructions. Privilege levels discussed in chapter
    9, section 9.6.


    +   - Coding default. x86 Linux programs execute with a 32-bit coding default.
    DOS programs execute with a 16-bit coding default. Coding defaults are discussed
    in chapter 5, section 5.5.


    When x86 processors, starting with the 80286, create a DOS environment, they are
    said to be operating in real mode. When not in real mode, they are said to be
    in protected mode. In Linux, user programs and most kernel programs run in protected
    mode. Linux only uses real mode for booting and this is necessary the only way
    an x86 processor can boot is in real


    Privilege levels and coding defaults have already been discussed, but segmentation
    has been totally ignored to this point. However DOS programs require it. We begin
    our discussion of segmentation with real mode segmentation. Segmentation in protected
    mode is discussed in chapter 13, section 13.2.


    # 12.1 Real Mode Segmentation


    The terms segment and segmentation are used in many overlapping and conflicting
    ways. Consequently, it would be well to make a preliminary attempt at clarifying
    terminology. In DOS, code and data segments of a program may be stored in code
    and data segments of memory, but not necessarily. In Linux, they are never. Text
    and data segments of a program are stored on separate pages of memory, not separate
    segments of memory. In x86 Linux, the error message “Segmentation Fault” does
    when it refers a protection fault. Worst of all is the term logical segment which
    accurately specifies nothing at all.


    To avoid muddying things further, this book will doggedly adhere to the following
    distinctions between program segments, memory segments, and segmentation.


    # Segments and Segmentation


    +   - Program segment. Since chapter 8, we have applied the term segment to a
    chunk of an executable file. This is standard usage. Programs typically have text
    and data segments.


    +   - Segmentation process. In this book, the segmentation is applied only to
    an address processing mechanism which has the effect of dividing memory into chunks.


    +   - Memory segment. It is custom to apply the term segment to the chunks of
    memory produced by the segmentation process. In this book, memory'
