  md: '# CHAPTER

    7

    THE STACK


    The **stack** is a portion of memory which is shared with the operating system.
    It is used by programs for communication with subprograms, for temporary storage,
    and when making system calls. It is called the stack because it is a “last stored
    first retrieved” policy. It is in fact an example of the data structure that is
    called a stack. Because it is used by the operating system as well as by the programmer,
    it must be used responsibly. Misusing the stack is a very easy way to crash a
    program, or the whole system, if the operating system is unprotected.


    # 7.1 Push and Pop Operations


    The following figure shows the stack and the ESP register. This register has the
    job of keeping track of the stack. It does this by holding the address of the
    top of the stack. The SP in ESP stands for *stack pointer*. Although the ESP is
    called a general register because it is accessible to the programmer like the
    registers EAX, EBX, etc., writes to ESP should be done only with great care.


    Suppose that ESP contained the address 19H as in Figure 7-1. Then storing the
    byte 76H on the stack would find the location 18H and the stack pointer would
    be changed, as shown in Figure 7-2. This kind of operation is called a *push*.
    The one-byte push shown here is essentially the same as the following two operations:


    | Stack Pointer | | |

    |---|---|---||

    | ESP: | 17 | |

    | | 18 | |

    | | 19H | 3A | Stack Top |

    | | 1A | BB | |

    | | 1B | A4 | |

    | | 1C | 04 | |


    **Figure 7-1.** Before Push'
