  md: '# 9.6 Privilege Levels


    When a system call takes over the processor, it does so because a program needs
    the kernel to do something that it is unable to do for itself, like read a file
    or write to the monitor. The program is incapable of these things because the
    processor itself is blocked from doing them while user is executing. The difference
    between kernel code and user code is a difference in privilege level. Since the
    286, the protection system based on a system of four different privilege levels
    has been in place. The four levels are


    +   - 0 System privilege level, used by the Linux kernel.

    - 1 Unused in Linux.

    - 2 User level privilege, used by Linux user programs.


    The privilege level of the currently executing code is called the current privilege
    level. It is stored in a two-bit register called the CPL register.


    # 9.6.1 The CPL Register


    The CPL register is one of the most important registers on the machine. Level
    0 has the most privilege. Changing the CPL value to 0 is like disengaging the
    safety catch on the processor. It takes place every time a system call is executed.
    It is a more drastic step than becoming superuser. From the standpoint of CPL-based
    privilege, the superuser is just another user. But when the CPL is 0, the processor
    can do things that no user can do. For example, it can modify the page tables
    or change the interrupt descriptor table.


    Of course, if root is the owner of the disk image of the kernel, the file vlinux
    in the root directory, root can do whatever it wants by changing this file. root
    can also modify kernel code which is stored in modules. But these changes will
    only take effect the next time the system is booted or a kernel module loaded.


    # 9.6.2 Privileged Instructions


    The LIDT instruction changes the address stored in the IDT register. This is the
    address that the processor goes to when it receives an interrupt. This instruction
    has the effect of changing from one interrupt table to another one. If used by
    a user, it could take control of all interrupts by sending the processor to a
    private table for handling of interrupts. It is a good example of what is called
    a privileged instruction. The processor will not execute a privileged instruction
    unless the CPL = 0. If this instruction is included in code which is executing
    while the CPL > 0, for example, in user code where the CPL = 3, it causes an exception
    called general protection error. See Table 9.4.'
