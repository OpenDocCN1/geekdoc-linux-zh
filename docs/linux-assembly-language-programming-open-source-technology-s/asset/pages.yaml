  md: 'CR3 is reloaded automatically every time the x86 processor changes from one
    task to another. This is what makes it possible for each task to have its own
    set of virtual addresses. The kernel memory in the last one-quarter of the address
    space (see section 8.2.3) is there because Linux puts it there. This address space
    is shared because the page tables which translate these addresses are shared.
    The last one-quarter of every page table table on the system is identical.


    # 8.3.7 Kernel Memory Access


    The fact that kernel addresses are stored in all the page tables on the system
    might lead us to believe that kernel memory can be used by all processes on the
    system. In a way this is true. In chapter 9, section 9.7 we will see user code
    may invoke system calls to get access to kernel memory. However, user code by
    itself does not have this kind of access. It is blocked by the U.S user-supervisor
    bit of the table entries for kernel memory (See Figure 8-8).


