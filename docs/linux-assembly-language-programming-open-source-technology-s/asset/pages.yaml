    # The Interrupt Enable Flag


    The design of the 8086 allows for a very simple way to avoid this situation. The
    idea would be to enforce a strict "one-at-a-time" interrupt policy. It would work
    by automatically blocking interrupt signals when an ISR is running, and unblocking
    them when it is finished. One of the flags on the x86 processor is called the
    interrupt enable flag. When this is cleared, all signals on the general-purpose
    interrupt pin are ignored. When an 8086 enters an ISR, this is automatically cleared.
    That is the processor pushes the flags onto the stack before entering an ISR.
    It allows the interrupt enable flag to be restored to its original state when
    the ISR is done. When the interrupt flag is set, interrupts are handled normally.


    The one-at-a-time interrupt policy would make life easy for the interrupt controller.
    The controller could process an incoming interrupt by passing it along to the
    processor until it was acknowledged. As soon as the interrupt was received, the
    controller could wash its hands of that interrupt because the processor could
    be counted upon to work nonstop until it was done.


    Although the one-at-a-time policy is very easy to implement on an x86 processor,
    standard PCs do not use it. The problem with it is that interrupts need a quick
    response can be kept waiting. If a serial port is getting ready to start tracing
    data because its buffer is full, then it should not be made to wait while a floppy
