    # 4.7.1 The Carry Flag


    In the case of unsigned numbers, the inequality A < B turns out to be easier to
    test than its signed counterpart. Since a subtraction of unsigned numbers A -
    B cannot go out of range on the high side, it is out of range if and only if it
    is negative. Out of range errors for unsigned numbers are called carry errors.
    Here A < B is true if and only if the subtraction A - B produces a carry error.
    A flag which flags carry negative results of a subtraction. The x86 processors
    have a carry flag to indicate these errors. Using CF to denote the value of this
    carry flag, we can easily use the condition to implement the unsigned "if less
    than" command as "if CF."


    Like the sign flag, the zero flag, and the overflow flag, the carry flag responds
    to conditions occurring when ADD or SUB are used. Unlike these other flags, it
    is unaffected by the INC and DEC commands.


