    page; the BIOS call does not.


    Figure 12-5 illustrates the typical sequence of function calls. The fact that
    DOS programs call BIOS and not directly to the hardware leaves designers free
    to make least minor changes in their hardware without the necessity for changes
    in DOS. By revising the BIOS programs so as to maintain the same functionality
    of BIOS interrupts, changes in DOS become accomplished without disrupting applications
    programs, provided that the DOS interrupt is rewritten so that it affords the
    same functionality to the applications program. These layers afford applications
    programmers, systems programmers, and hardware designers a modest degree of independence
    from one another.


    User programs which bypass or one of these layers risk a loss in portability.
    A program which calls directly to the hardware may not run on a machine with different
    hardware. The strongest reason a software developer has for sacrificing portability
    is that bypassing software layers reduces execution time. Execution time is still
    a problem in connection with video processing. It is one reason that the video
    buffer became standardized. So much software wrote to it that directly moving
    it would have made the graphics hardware with the old buffer missing difficult
    to sell.


