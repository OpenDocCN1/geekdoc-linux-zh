    interpretation, -5 < 2, yields a true, whereas the unsigned interpretation, 11
    < 2, yields a false. The hardware must make a different response in the two cases.
    This means that a single “less than” command cannot work. Two are needed, one
    for signed numbers and one for unsigned numbers. This issue comes over and over
    again in assembly language.


    In the C language, integers may be declared as unsigned int or signed int. The
    unspecified int declaration means the same as signed int.


