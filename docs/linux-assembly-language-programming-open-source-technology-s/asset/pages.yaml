    # 11.3.8 Timing the Morse Code


    The timing of dots and dashes is an art, not a science. A Morse Code driver has
    good timing if it sounds right to a Morse Code practitioner. Time values in this
    driver are based on the following rules:


    +   - All time values are based on the duration of the wholenote component of
    cq_area, which is given in hundredths of a second, or jiffies.

    - A dash is one-fourth of a wholenote.

    - A dot is one-sixteenth of a wholenote.

    - Quiet intervals between dots and dashes of a lettter are one-eighth of a wholenote.

    - Quiet intervals between letters are three-eighths of a wholenote.

    - A character not included in the Morse Code get a silent interval of one-quarter
    of a wholenote.


