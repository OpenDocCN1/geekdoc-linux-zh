  md: 'Section 9.6. Privilege Levels


    The MOV mnemonic names an instruction that can be used to access the control registers.

    The command


    MOV reg, reg


    where one reg is a control register and the other is a 32-bit general register,
    can be used to load a value into CR3, for example. CR3 holds the address of the
    page table table where address translation begins. Loading a new value into CR3
    has the effect of changing one set of page tables to another. If this could be
    by a user, the user could take control of physical memory. MOV used with control
    registers is another good example of a privileged instruction.


    # 9.6.3 Stack Problems


    The ISR code that the interrupt is jumping to may well use the stack, it is important
    that the stack not be subject to write access by the user. Even though user code
    will not function until the ISR exits, there can still be trouble. For example,
    suppose the system call read() transfers data from a file to user memory. One
    of the parameters to this call is the address of some memory that the user has
    permission to write on. In executing the call, the system will store file at that
    address. The stack being used by the system is the user''s stack, then the user
    has permission to write on. The user may then supply the address as parameter
