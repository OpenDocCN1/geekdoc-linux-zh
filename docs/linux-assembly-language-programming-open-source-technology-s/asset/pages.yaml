  md: '# Section 9.3. ISA Architecture


    As a device with the I/O address, the interrupt controller looks like just any
    I/O device. It is special in that it is the only I/O device that can signal the
    processor directly. All the others must go through the interrupt controller.


    # 9.2.3 The NMI and RESET Interrupts


    Besides the general-purpose interrupt pin on the x86, there are two other interrupt
    pins. They are the NMI and RESET pins.


    A signal on the NMI, nonmaskable interrupt pin, is not blocked by clearing the
    interrupt enable flag. It does not trigger an interrupt acknowledge cycle. It
    is serviced by interrupt service routine number 2. It is used to signal parity
    errors in memory or power supply problems.


    The RESET pin is intended for situations where there may no interrupt descriptor
    table in memory. For example, when the computer is being turned on. Consequently,
    there is no point in storing an address for it in the interrupt table. Instead
    the address is built into the processor. The address is FFFFFFFF (or FFFOH on
    the 8086). It is easily remembered as -16 in the complement. The read-only memory
    at this address must contain a jump instruction whose target is the POST, or Power
    On Self Test, program. This is located on the ROM chip chips by the computer manufacturer,
    but are often bought from a third party such as American Megrends or Phoenix.
    The POST can be thought of as the ISR for the RESET interrupt. The final act of
    the POST is to initiate the boot sequence. The RESET pin is connected to the power
    supply and to a button on the front of the computer.


    # 9.3 ISA architecture


    The ISA architecture is essentially the architecture of the IBM AT computer. The
    AT is an 8026-based computer introduced in 1984. Many ISA, or Industry Standard
    Architecture, arose in reaction to the introduction by IBM of a new architecture
    called Microchannel for the PS5/2 computers. Microchannel was intended to replace
    the very popular architecture of the AT. Many third parties manufactured cards
    could be inserted into the expansion slots of an AT, or an AT clone. The reaction
    of these third parties to IBM''s new architecture, which would have made all their
    AT obsolete, was to band together and rename the AT architecture the Industry
    Standard Architecture. As a result, the lifespan of the features was a considerable
    extension. Many important architectural features were standardized in the ISA,
    including


    +   - the interrupt controller circuit


    +   - many IRQ assignments


    +   - many I/O port assignments'
