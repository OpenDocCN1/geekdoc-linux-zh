    \ to the labels used in the C compiler, it is important to count off the bytes\
    \ from the beginning of the structure. These are used to access the device memory.\
    \ Hence scalex.area + 4 is used instead of scalex.area.read. Since all components\
    \ of this structure are four bytes in size, there are no tricks in the counting.\n\
