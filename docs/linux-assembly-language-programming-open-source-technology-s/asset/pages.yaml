    # SRAM vs. DRAM


    When memory circuits are built out of logic circuits, it is called static memory
    or SRAM. Memory circuits can also be made of capacitors. A charged capacitor represents
    a stored 1; a discharged capacitor represents a stored 0. Since fewer transistors
    are required, these circuits can be packed with greater density on a chip. Small,
    closely packed capacitors have the disadvantage that they discharge rapidly. They
    require constant checking. Every capacitor which is not completely discharged
    must be pumped back up again. Because the memory is being constantly “refreshed,”
    it is called dynamic memory, or “DRAM. Dynamic memory is like a bookshelf without
    the shelf, except in the case of a book falling four feet, say to the floor, you
    would have .5 seconds to catch it before it hits the floor. These little capacitors
    discharge in .001 seconds. The memory refresh must be done approximately every
    100 us. Unlike many developments which have numerous contributors, dynamic memory
    was invented by a single person, Ted Hoff, around 1970. Dynamic memory is cheaper
    and slower than static memory. Static memory is usually used for cache, while
    dynamic memory is used for RAM.


    One drawback of DRAM is that it makes hardware debugging much more difficult.
    The simplest way to do hardware debugging would be to slow the computer''s clock
    down away. Aberrant behavior could then be observed as it happened. But because
    of DRAM refresh requests, there is no easy way to do it.


