    what makes it unnecessary to do a task switch every time the speaker is ready
    for another letter.


    +   **mcode:** The pointer, mcode, keeps track of where in the string of dots
    and dashes for the current character we are.


    +   **buffer_offset:** The buffer_offset component picks out out which character
    in the buffer is currently working on.


    +   **buffer_end:** The buffer_end marks the end of the current buffer load. It
    is usually just the same as CQ_BUFFER_SIZE. But in case the buffer is given only
    partial load, buffer_end allows the driver to quit on time without running all
    the way to the end of the buffer.


    +   **cq_wait.q:** The last component, cq_wait.q, is there because although the
    text buffer, buffer[CQ_BUFFER_SIZE], is a good idea, it does not completely solve
    the problem of accessing the user''s text. When all in the buffer has been sent
    to the speaker and there is more to go, then we''re back where we were before
    when we had no buffer, trying to get ahead of user''s text when the user''s process
    is not running (and the user''s address space is not functional).


    The buffer in device memory does not eliminate the need for task switches. It
    can only reduce the number of them. It can do this by making the buffer larger.
    The bigger the buffer, the less often a task switch is needed. But a bigger buffer
    increases the size of kernel memory. We have here a typical vs. space trade off.


    The user-called process, which fills the buffer, and the timer-handler, which
    empties the buffer, are an example of what is called producer-consumer pair.


    # 11.3.5 Wait Queues


    Wait queues were designed to allow processes to suspend operation in such a way
    that they can be easily reactivated when needed. For example, a producer can suspend
    operation when it produced a surplus and be reactivated by a consumer when the
    supply is exhausted.


