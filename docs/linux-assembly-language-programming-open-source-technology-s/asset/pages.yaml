    # 8.3.5 Memory Protection


    When the present bit is not set, there are two possibilities:


    +   1. It may mean that the page containing the sought after byte is located on
    disk. In this case, a Page Fault results.

    2. It may also mean that the address is not valid at all! In this case, a Segmentation
    Fault results.


    The first possibility is no surprise. The idea of paging is to put some memory
    pages onto the disk. When a program tries to access them, this is of course a
    problem. Problems like this are dealt with in chapter 9, section 9.4.

    The second possibility is somewhat foreign to the idea of paging as a memory magnifying
    feature. But it brings out exactly what we mean when we say that Linux uses paging
    to “protect” memory. Because the page tables are under the control of the operating
    system, it gives the operating system an opportunity to intercept every single
    memory request. This is how Linux keeps potentially overwhelming demands for memory
    under control. Only addresses on which it has allocated to processes will have
    the present bit in the page tables set. Any reference to an unallocated page results
    in the dreaded “Segmentation Fault” error message.


    # 8.3.6 The CR3 Register


    Translation begins at the page table. Each task has its own page table table.
    The physical address of the page table table is stored in a register called CR3.
    CR stands for control register. The control registers were added to the x86 processors
    starting with the 386. For more discussion of these registers see chapter 13,
    section 13.1.'
