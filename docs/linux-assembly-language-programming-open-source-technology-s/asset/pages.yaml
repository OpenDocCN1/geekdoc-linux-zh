    # 3.1.1 Logic Gate Terminals


    A logic gate is a circuit which works like a switch. Figure 3-2 shows a generic
    logic gate hooked up to a battery. As shown in the figure, a logic gate has four
    or more terminals.


    +   1. **Output Terminal.** This terminal is switched so that it is connected
    either to the positive or the negative power terminal. The switching is done by
    solid-state electronics imbedded in silicon and involves no moving parts.

    2. **Positive Power Terminal.** This terminal is always connected to the positive
    battery or power supply terminal.

    3. **Negative Power Terminal.** This terminal is always connected to the negative
    battery or power supply terminal.

    4. **Input Terminal.** A logic gate has one or more input terminals. These terminals
    carry the input signals which determine whether the output terminal is switched
    to the positive or the negative power terminal. Different types of logic gates
    makes this determination in different ways.


    # Logic Value Conventions


    Because the two power terminals on the logic gate are always connected to the
    corresponding terminals on the battery or power supply, the output terminal always
    supplies a connection to either the positive or the negative battery or power
    supply terminal. For circuits in this book


    +   - A gate terminal connected directly or indirectly to the positive battery
    or power supply terminal is described as being "at logic 1."\n- A gate terminal
    connected directly or indirectly to the negative battery or power supply terminal
    is described as being "at logic 0."'
