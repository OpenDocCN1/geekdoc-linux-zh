    # 12.3.2 Keyboard Buffer


    When a key is either pressed or released, an interrupt is generated. On an ISA
    machine this interrupt is allotted, IRQ #1, which in turn is reported by the interrupt
    controller as interrupt number 9. (See Table 9.3).


    The DOS interrupt service routine 9 interrogates the keyboard at I/O port 64H
    and deposits characters it receives from there in a tiny buffer located at 41EH.
    The


    | Keyboard Buffer (ASCII - Scan) | | | | | | | |

    |---|---|---|---|---|---|---||

    | 41E | 41F | 420 | 421 | 422 | 423 | ... | 43C | 43D |

