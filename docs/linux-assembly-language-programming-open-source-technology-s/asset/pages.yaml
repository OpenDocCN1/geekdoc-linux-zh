  md: '# Drivers That Can''t Be Killed


    The signal_pending() call checks the signal component of the process for non-zero
    bits. It is the responsibility of the writer of the device driver to make sure
    this is done and go ahead and quit if such bits are found. Failure to do so results
    in a device that can''t be killed. This is an easy mistake to make and a serious
    one. Multitasking in Linux is sometimes called cooperative multitasking. User
    tasks that execute with kernel privilege, as cq_write(), are expected to yield
    to the processor voluntarily. If they don''t, the scheduler won''t force them
    to do so. In order to fulfill this responsibility, the driver must include code
    as


    ```

    signal_pending(current)

    return value;

    ```


    at points in the code which will be encountered frequently so that waiting for
    the device driver to arrive at these points as it executes will not cause undue
    delay.


    One more detail fixing in order to make sure the driver responds to signals.


    # 11.3.7 States of a Process


    A very important component of struct task_struct is state. Its most important
    values are assigned in /usr/src/linux/include/linux/sched.h.


    ```

    #define TASK_RUNNING 0

    #define TASK_INTERRUPTIBLE 1

    #define TASK_UNINTERRUPTIBLE 2

    #define TASK_ZOMBIE 4

    #define TASK_STOPPED 8

    ```


    Tasks which are on the run-queue, i.e. those who are now taking using the processor,
    have TASK_RUNNING as the value of their state component. When a task puts itself
    onto a wait queue, state may take either TASK_INTERRUPTIBLE or TASK_UNINTERRUPTIBLE
    as values. And it makes a big difference. Although we might reasonably suppose
    the difference has to do with interrupts, it doesn''t. It has to do with signals.

    If state has value TASK_UNINTERRUPTIBLE, then its signal component will not be
    altered by a Ctrl-C or kill. Unfortunately this is the value assigned to the sleep_on()
    function. In Version 11.5, the calls to sleep_on() and wake_up() need to be replaced
    by their interruptible counterparts. Otherwise we would have the same problem
    that we would get if we omitted the signal_pending() check. The definitions of
    two sleep_on functions are defined in /usr/src/linux/kernel/sched.c as well as
    the main part of wake_up(). The two wake_up macros are defined in /usr/src/linux/include/linux/sched.h.'
