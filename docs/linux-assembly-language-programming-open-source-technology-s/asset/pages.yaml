    # The Interrupt Acknowledge Bus Cycle


    Since the x86 receives its interrupts all via one pin, it cannot tell from a single
    "knock on the door" when I/O device is signaling for attention. As shown in Figure
    9-2, the interrupt controller circuit is connected to the data bus just like memory
    and I/O. To get the required identification from the interrupt controller, the
    processor performs a read, which is initiated to a memory or an I/O read. It is
    called *interrupt acknowledge bus cycle*. Just as the processor uses the M/IO#
    pin to indicate whether it is commanding a memory or an I/O read, it uses the
    D/C# pin to distinguish an I/O controller read from memory and I/O cycles. D is
    for data and C is for code. The complete list of bus cycles by the D/C#, M/IO#,
    and W/R# pins is given in Table 9.1.


    When the processor receives an interrupt, it initiates an interrupt acknowledge
    bus cycle. Only the interrupt controller may respond to an interrupt acknowledge
    bus cycle. It responds by depositing a one-byte number on the bottom eight bits
    of the data bus. This is called the *interrupt number*. It is not the same as
    an IRQ number. The processor reads the interrupt number off the data bus.'
