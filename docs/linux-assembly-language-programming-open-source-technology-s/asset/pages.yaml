    # 5.5 32-Bit vs. 16-Bit Code


    To this point we have discussed code for commands involving 32-bit registers only.
    We are now ready to consider the coding of the 16-bit general registers.


    The MOV ECX,EAX command, as noted in section 5.1, can be encoded as 89 C1. The
    corresponding 16-bit command is MOV ECX,AX. Surprisingly, the code for this command
    is also 89 C1! The 80386 was designed to use the same encodings for the 16-bit
    registers as the 32-bit registers. There is clearly a problem with this. When
    the processor fetches the 89 C1, which instruction should be executed, MOV ECX,EAX
    or MOV CX,AX? It happens that the decision is based on a single bit in the processor
    which determines whether code is interpreted as 32-bit, in which case 81 means
    MOV ECX,EAX, or 16-bit, in which case 89 C1 means MOV CX,AX.


