- img_proc: true
  md: '1. The available physical memory is broken up into pages. Since 4,096 = 2^{12}
    = 4K = 1000H, every page starts at an address ending in three zeros. Pages in
    physical memory are sometimes called *page frames*.


    2. Each task''s 4 Gig virtual address spaces is also divided into pages. 4 Gig
    corresponds to 1 Meg of pages.


    ```

    4 Gig \div 4K = (4 \times 2^{20}) \div (4 \times 2^{10}) = 2^{32} \div 2^{20}
    = 2^{12} Meg.

    ```


    Again, every page starts at an address ending in three zeros.


    3. The portion of the hard disk used for paging is also divided into pages. This
    portion is often called the *swap space*. Since most disks are formatted into
    512-byte sectors, this means the number of sectors allocated to the swap space
    must be a multiple of 8, 4,096 = 8 \times 512.


    4. The page tables use to translate virtual addresses are themselves set up in
    units of pages. These tables are described in section 8.3.1.


    Note that pages of virtual memory, physical memory, and disk all have the same
    size. This facilitates data transfers in page size quantities.


    # 8.2.2 Paging vs. Swapping


    The *swap space* is unfortunate since "swapping" traditionally refers to copying
    entire processes to and from the disk. When demand for memory on a multitasking
    system exceeds the available RAM, a simple solution to this problem is to copy
    some process out to the disk. That is what swapping does. Swapping does not increase
    memory efficiency. It prevents memory from overloading. It can be done by the
    operating system on its own. It does not require any special hardware support.
    Swapping was common in Unix systems before paging was invented. Linux does not
    use swapping and never has.


    Although swapping solves the problem of memory unavailability, it does not go
    well in making memory usage efficient. Copying whole processes into and of memory
    tends to fragment memory just as copying files onto and off a disk tends to fragment
    a disk. Furthermore, by treating processes as wholes, it misses out on the possibility
    that keeping just the most important parts of each process in memory, it may be
    possible to run all the processes without ongoing disk access. Failing this, it
    may at least be possible to greatly reduce the fraction of the processor''s time
    which is wasted in serving memory faults.


    # Page Faults


    Using paging, all the processes are run as though they were all in memory simultaneously.
    When a instruction is encountered which refers to a memory location on disk, this
    is called a *page fault*. When a page fault occurs, some page frame in RAM has
    to be chosen so that the needed page may be loaded into it'
