    # 3.5.3 Registers


    Four latches used together in parallel can store four bits. This is an example
    of a register. A four-bit register is a collection of circuits that can store
    four bits. Different registers in a processor do not have to store the same number
    of bits, but it is easier to make things work when they do. The number of bits
    in a "typical" register is one of the attributes of a processor which determines
    whether it is called a four-bit processor, an eight-bit processor, or whatever.


    The contents of a four-bit register are very naturally specified using a four-digit
    binary number. The four-digit binary numbers are the integers from 0 through 15.
    An eight-bit register holds an integer from 0 through 127.


    We see that the most natural way of specifying the contents of a register leaves
    no room for negative numbers. The representation of negative numbers will be discussed
    in the next section.


    # 3.5.4 Bit Significance


    Because binary numbers are used to describe the contents of registers and memory,
    the numerical concept of a significant digit is useful in singling out individual
    bits of a specific storage location. For example, if a four-bit register holds
    the binary number 1100, then the four digits in order of significance are 1, 1,
    0, and 0. So the most significant digit is 1, and the least significant digit
    is 0. The three most significant digits are 110. Sometimes in this text, the most
    significant bits will be referred to as the top or upper bits and the least significant
    as the bottom or lower bits.'
