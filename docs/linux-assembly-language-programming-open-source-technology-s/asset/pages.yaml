    In chapter 12, we discussed the main differences between the environment provided
    to user programs which run under Linux and the environment under which DOS programs
    run. We saw how different these two environments are. Much of the difference between
    these two environments is due to the fact that a different operating system is
    running in each. But there is also a difference at the hardware level. DOS was
    written for the 8086 processor. In order for DOS to run on a machine, that machine
    must act like 8086. Linux is a multitasking system. In order for it to run on
    a machine, machine must have hardware support for the protection of one task from
    another. The x86 processors, from the 8036 on, support both of these operating
    systems by running in two distinct operating modes, real mode which emulates an
    8086 and protected mode, which has multitasking support.


    # 13.1 Changing to Protected Mode


    Whether an x86 processor runs in real or protected mode is determined by the bottom
    bit of the CR0 register. This register is a 32-bit extension of the 16-bit Machine
    Status Word register on the 8028. The least significant bit in this is actually
    the most significant bit on the entire processor. If it is cleared, the processor
    operates in real mode. If it is set, the processor operates in protected mode.


    Table 13.1 shows the bit allocations of the CR0 register in the 486.

    To change to protected mode from DOS is easy.


    ```

    MOV EAX, CR0

    OR EAX, 1      ; Make the least significant bit 1.

    MOV CR0, EAX   ; Here goes!

    ```


