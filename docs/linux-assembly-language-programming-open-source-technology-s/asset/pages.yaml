    numeration system, and vice versa.


    # 2.1.3 Pentimal Numerals


    The place values in the pentimal numeration system are one, five, twenty-five,
    one hundred twenty-five, etc. Each value is worth of five at most of any other
    smaller.


    Any number can be represented using at most of any one place value. So the digits
    5, 6, 7, 8, and 9 are not used. All numbers are represented using only the numerals
    0, 1, 2, 3, and 4.


    The pentimal 24 is the same as the ordinary decimal 14. It means 2 fives and 4,
    like 2 nickels and 4 pennies. Similarly, 124 is the same as 39 in base ten. In
    it means 1 quarter, 2 nickels and 4 pennies.


    Counting goes like this: 1, 2, 3, 4, 10, 11, 12, 13, 14, 20, 21, 22, 23, 24, 30,
    31, 32, 33, 40, 41, 42, 43, 44, 100, 101, 102, 103, 104, 110, and so on. Using
    pentimal numeration to describe pentimal money, we get:


    | 1 nickel | 10 pennies (10 = five) |

    | 1 quarter | 10 nickels |

    | | 100 pennies (100 = twenty-five) |

    | 1 Dollar | 10 quarters |

    | | 100 nickels |

    | | 1000 pennies (1000 = one hundred twenty-five) |


    # 2.2 Pentimal Arithmetic


    Given a base five arithmetic problem:


    423

    + 334


    we have a choice of methods. We can convert these numbers into base ten, do the
    arithmetic, and then convert back to base five. Or we can do the problem without
    any conversions using the "native arithmetic"


    The first method is easier at first since we are used to base ten. Thinking in
    terms of monetary units: 423 is four quarters, two nickels and three pennies,
    i.e., 113 cents in ordinary base ten. Similarly, 334 is 94 cents in ordinary base
    ten. So we can do the addition using ordinary base ten arithmetic:


    113

    + 94

    207


    One hundred thirteen plus 94 is 207, or $2.07. To convert back, start by taking
    out one big dollar, a dollar and a quarter, and we have 82 cents left. This is
    three quarters, one nickel and two pennies. The answer is 1312.'
