- img_proc: true
  md: '# 3.2.3 Other Boot Loaders


    There are many other ways to boot a kernel, including from DOS via LOADLIN or
    SYSLINUX,, over the network, or even directly from the PC BIOS with LinuxBIOS!
    Most other boot loaders work like LILO, although some do not support the TAB key
    to list options. You may need to pay attention to boot diagnostics for this information.
    However, the way you enter parameters is usually identical to LILO and GRUB.


    # 3.2.4 Single-User Mode and Emergency Booting


    When something goes wrong with the system, an administrator''s first recourse
    for booting quickly to a usable state is single-user mode. The idea is that the
    system quickly boots to a root shell instead of going through the whole mess of
    services. On Linux, single-user mode is usually runlevel1. You may need to type
    the root password to enter single-user mode.

    Common tasks in single-user mode include the following:


    +   * Checking filesystems after a system crash

    * Fixing problems in critical files, such as /etc/fstab, /etc/passwd, and /etc/initab

    * Restoring backups after a system crash


    Don''t expect many amenities in single-user mode. You may need to set the terminal
    type (enter TERM~linux) to get full-screen editors to work, and the network may
    not be available. You can configure the network and other systems by hand, but
    if it''s a pain.


    When you finish with single-user mode, you can exit the shell to see if the system
    starts normally. However, it''s usually a good idea to exit to reboot the system,
    because the transition from single-user mode to regular multi-user mode is not
    always perfect.


    If you have a real mess on your hands, and even single-user mode doesn''t work,
    you can try the -b kernel parameter for an emergency boot instead of any kind
    of orderly startup. This does not mount the root filesystem as read-write or give
    you anything else, so you''ll probably need to do some remounting, and possibly
    the /proc filesystem before getting anything useful. If things are really broken,
    you might consider using a rescue CD-ROM of this rudimentary emergency boot shell.
    You may also be able to get an emergency boot by using the init+/bin/sh kernel
    parameter.


    Finally, if you break your kernel or boot loader, you won''t be able to get single-user
    mode without extra help. You can often boot your system with a kernel from a bootable
    CD-ROM by passing the root parameter to the CD-ROM''s kernel boot loader. Your
    system might look somewhat strange without your regular kernel, but you should
    still be able to move files around or perhaps compile a new kernel to get yourself
    out of the jam.'
