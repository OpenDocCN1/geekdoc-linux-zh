  md: "# 7.7 Command Substitution\n\nThe Bourne shell can redirect a command's standard\
    \ output back to the shell's own command line. That is, you can use a command's\
    \ output as an argument to another command, or you can store the command output\
    \ in a shell variable. You do this by enclosing a command in quotes ('').\nHere's\
    \ an example that stores a command inside a variable, FLAGS:\n\n```\n#!/bin/sh\n\
    FLAGS=$(grep ^flags /proc/cpuinfo | sed 's/.*:////' | head -1)\necho processor\
    \ supports:\nfor f in $FLAGS; do\n    case $f in\n        fpu) MSG=\"floating\
    \ point unit\"\n            ;;\n        3dnow) MSG=\"3NOW graphics extensions\"\
    \n            ;;\n        mtrr) MSG=\"memory type range register\"\n         \
    \   ;;\n        *) MSG=\"unknown\"\n            ;;\n    esac\nechoecho $f: $MSG\n\
    done\n```\n\nThe second line contains the command substitution, in bold type.\
    \ This example is somewhat complicated, because it demonstrates that you can use\
    \ both single quotes and pipelines inside the command substitution backticks.\
    \ The result of the grep command is sent to the sed command (more about sed later),\
    \ which removes anything matching the expression ..*:; and the result of sed is\
    \ then passed to head.\n\nIt's easy to go overboard with command substitution.\
    \ For example, don't use `ls` in a script, because using the shell to expand *\
    \ is faster. Also, if you want to invoke a command on several filenames that you\
    \ get as a result of a find command, you may want to consider using a pipeline\
    \ to x rather than command substitution (Section 7.10.4).\n\n# 7.8 Temporary File\
    \ Management\n\nSometimes it is necessary to create a temporary file to collect\
    \ output for use by a later command. When making such a file, you must make sure\
