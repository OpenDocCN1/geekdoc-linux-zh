- img_proc: true
  md: '# 2.4.2 Creating a Filesystem


    You cannot mount and store files on a partition that does not contain a filesystem.
    The partitioning process described in Section 2.3.4 does not create any filesystems;
    you must place the filesystems on the partitions in a separate step. To create
    a Second Extended (ext2) filesystem, use the mk2fs program on the target device,
    as in this example for /dev/hdc3:


    ```

    mk2fs /dev/hdc3

    ```


    The mk2fs program automatically determines the number of blocks in a device and
    sets some reasonable defaults. Unless you really know what you''re doing and feel
    like reading the mk2fs(8) manual page in detail, you shouldn''t change these.


    When you create a filesystem, you initialize its database, including the superblock
    and the inode tables. The superblock is at the top level of the data-base, and
    it mk2fs creates a number of backups in case the original is destroyed. You may
    wish to record a few of the superblock backups when mk2fs runs, in case you need
    to recover it later in the event of a disk failure (see Section 2.4.8).


    > WARNING Filesystem creation is a rare task that you should only need to perform
    after adding a new disk or repartitioning an old disk. You should create a filesystem
    once for each new partition that has no preexisting data (or data that you want
    to remove). Creating a new filesystem on top of an existing filesystem will effectively
    destroy the old data.


    # Creating ext3 Filesystems


    The only substantial difference between ext2 and ext3 filesystems is that ext3
    filesystems have a journal file containing changes not written to the regular
    filesystem database. To create an ext3 filesystem, use the -j option to mk2fs:


    ```

    mk2fs -j /dev/disk_device

    ```


    Don''t worry if you forget the -j option when creating a filesystem. You can add
    a journal file to an existing filesystem with the utility. Here''s an example:


    ```

    tune2fs -j /dev/sda1

    ```


    When upgrading a filesystem to ext3, don''t forget to change the ext2 to ext3
    in the /etc/fstab file.


    # 2.4.3 Mounting a Filesystem


    On Unix, the process of attaching a filesystem is called mounting. When the system
    boots, the kernel reads some configuration data and mounts / based on that data.
    To mount a filesystem, you must know the following:'
  merge: -1
