  md: '# 10


    # MAINTAINING THE KERNEL


    As mentioned in Section 2.2, the kernel is the core of the operating system. In
    some respects, the Linux kernel is no different than any other software package.
    You can configure, build, and install the kernel because it comes as source code.
    However, the procedure for doing so is substantially different than for any other
    software package because the kernel *runs* like no other package.


    There are four basic topics pertaining to kernel management:


    **Configuring and compiling a new kernel** Your end goal here is to build an image
    file, ready for the boot loader.


    **Manipulating loadable kernel modules** You don''t have to build the kernel as
    one massive chunk of code. Kernel modules let you load drivers and kernel services
    as you need them.'
