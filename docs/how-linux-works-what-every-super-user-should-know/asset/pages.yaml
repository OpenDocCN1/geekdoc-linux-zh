    # Should You Compile Shared Libraries?


    Shared libraries (see Section 8.1.4) cause trouble with custom installations,
    primarily because a shared library upgrade can break a large number of programs
    at once. For this reason, you should *never* make links to shared libraries in
    /usr/local/lib when using Encap. Leave shared libraries in their installed location.


    Even with this precaution, you still have these problems:


    +   * It''s hard to tell if you can actually delete an old shared library, because
    some program may depend on the library.

    * It''s difficult to link programs against the shared library. You must use the
    `-l,-rpath` path link option.

    * When linking against a shared library, you should specify a path that includes
    a version number. For example, use `/opt/bogon/bogon-3.2.3/lib` instead of `/opt/bogon/default`.
    You risk library version mismatches otherwise.


    In fact, shared libraries can cause so many problems that you should always think
    twice before installing them. If the library is fairly small (such as libpng and
    libtiff), there''s no problem in opting for static libraries over shared libraries.
    Use this configure option to disable shared libraries for packages that use GNU
    autoconf


    ```

    ./configure --disable-shared

    ```


