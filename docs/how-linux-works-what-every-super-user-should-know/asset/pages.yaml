    # 2.4.8 Checking and Repairing Filesystems


    The optimizations that Unixystems offer are made possible by a sophisticated database-like
    mechanism. For filesystems to work seamlessly, the kernel has to trust that there
    are no errors in a mounted filesystem. Otherwise, serious errors such as data
    loss and system crashes can happen.


    The most frequent cause of a filesystem error is shutting down the system in a
    rude way (for example, with the power switch on the computer). The system''s filesystem
    cache in memory may not match the data on the disk, and the system also may be
    in the process of altering the filesystem when you decide to give it a kick. Even
    though a new generation of filesystems supports journals to make filesystem corruption
    less common, you should always shut down the system properly (see Section 3.1.5).
    Furthermore, filesystem checks are still necessary every now and then as sanity
    checks.


    You need to remember one command to check a filesystem: fsck. However, there is
    a different version of this tool for each filesystem type Linux supports. The
    information presented here is specific to second and third extended (ext2/ext3)
    filesystems and the e2fsck utility. You generally don''t need to type e2fsck,
    fsck can figure out the filesystem type, or you are looking for the e2fsck manual
    page.


    To run fsck in interactive manual mode, use the device or mount point (in /etc/fstab)
    as the argument:


    ```

    fsck /dev/hdd1

    ```'
