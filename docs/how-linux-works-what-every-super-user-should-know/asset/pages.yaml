    the broadband connection with all of the machines on the network, but also link
    those machines with each other.


    Of course, a Linux machine with two Ethernet cards and a hub or switch can do
    anything that a router can do. In fact, you have much finer control over a full-blown
    Linux machine acting as a router. However, very few people actually have a use
    for the fancy tricks you get with Linux, and the cost of a router is not much
    more than the cost of a switch.


    If you decide to purchase a router, skip to Section 5.10 for Ethernet networking
    details. Otherwise, if you are using PPPoE to connect to your ISP and want to
