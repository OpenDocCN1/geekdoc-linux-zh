    # 4.11 Running Commands as the Superuser


    You before see any more system commands, you should learn more about

    how to run commands as the superuser. You probably already know that you

    can run su command and enter the root password to start a root shell.

    This practice works, but it has these disadvantages:


    +   - You have no record of system-altering commands.

    - You have no record of the users who performed system-altering commands.'
