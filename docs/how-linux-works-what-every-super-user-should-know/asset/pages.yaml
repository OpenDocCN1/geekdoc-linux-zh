- img_proc: true
  md: 'The compile takes some time. As it runs along, you see messages like this:


    ```

    CC    init/version.o

    ```


    If you see a message containing [M], it means that make is compiling a module:


    ```

    CC [M] net/sctp/protocol.o

    ```


    The following output appears when make builds bzImage:


    ```

    Kernel: arch/i386/boot/bzImage is ready

    ```


    As the preceding message indicates, the build process creates your kernel image
    as arch/i386/boot/bzImage. The process also creates a file named System.map that
    contains kernel symbols and locations. You may have to wait a little while after
    the “Kernel ready” message appears, because make may still need to compile some
    kernel modules. Don''t interrupt the build; make sure that you wait until you
    get your prompt back before installing the kernel.


    **NOTE** In kernel versions prior to 2.6, you had to run the following commands
    for a complete kernel build:


    ```

    make dep

    make bzImage

    ```


    # Failed Compiles


    Recent kernels are very self-contained; there are only two primary things that
    can go wrong during the build process:


    +   - If you get a parse error or some other sort of coherent compiler error,
    the compiler on your machine probably doesn''t match the recommended compiler
    in the README file. Kernel code is very particular about the compiler, especially
    due to all of the assembly code involved.

    - If the compiler dies unexpectedly midway through the build process, your hardware
    may be at fault. Compiling a kernel stresses a machine much more than almost any
    other task. Bad memory and overclocked or overheated processors are the main culprits.


    If you need to see each command in the build process to track down a problem,
    use this command:


    ```

    make V=1

    ```'
