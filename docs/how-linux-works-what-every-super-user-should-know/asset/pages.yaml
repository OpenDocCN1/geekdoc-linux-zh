    # 12.5.8 Fomatic (for Non-PostScript Printers)


    If your printer does not have native PostScript support, there may still be one
    more piece of the puzzle to configure — the rasterizer filter. There are several
    options here, but the most popular system at the moment is Fomatic.


    Before going into details about Fomatic, you should be clear on the end goal here:
    you want to write a print file to run a Ghostscript (gs) command to render PostScript
    input into bitmap format to send to the printer. The command arguments look something
    like this:


    ```

    gs -q -dSAFER -DNOOPAUSE -dBATCH -sOutputFile=-

    ```


    This seems enough, but unfortunately, device_options can be a tremendous mess.
    There are countless combinations of printer data formats and options. Fomatic
    attempts to resolve these problems with a database containing options for nearly
    every printer model out there. You may see references to this database all over
    the Web but very little information on how to actually use the database.'
