    They may contain some examples and cross-references, but that''s about it.

    Don''t expect a tutorial, and don''t expect an engaging literary style. For

    programs with many options, the manual page often lists the options in

    some systematic way (for example, alphabetical order). It won''t bother to

    tell you what the important ones are. If you are patient, you can usually find

    what you need to know. If you''re excessively impatient, ask a friend, or pay

