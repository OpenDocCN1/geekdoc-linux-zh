    See Section 12.6.3 for notes on certain HP printer drivers.


    # Testing Fomatic


    To use Fomatic as a filter, you need the fomatic-rip program in lib/cups/filter
    (a symbolic link to another location works). You can verify that Fomatic produces
    the correct printer output by running fomatic-rip on the command line, generating
    printer output by running. You can then send this data directly to the printer,
    bypassing the first spooler.


    First, locate your printer''s PPD file (ppd_file) and find a PostScript file to
    test with (test_file.ps). Run this command to create printer data in test.pr


    ```

    fomatic-rip v --ppd ppd_file test_file.ps > test.pr

    ```


    The -v option specifies verbose operation so that you can see exactly what the
    filter is doing. If everything goes well, you should see the following at the
    end of the diagnostic messages:


    ```

    KID4 exited with status 0

    Renderer exit stat: 0

    Renderer process finished

    ```


    Closing fomatic-rip.


    Successful completion also means that test.pr should now be a gigantic (probably
    binary) file that you can send directly to the printer device.


    # 12.5.9 Administrative Command Overview


    With the mesh of print filters hopefully behind you, it''s time to learn some
    commands for day-to-day tasks. Compared to other Unix server systems, it''s not
    terribly important that you know the syntax of every last command, because the
    Web administration interface does an adequate job in most cases (and is sometimes
    far preferable to the command line — for example, when doing printer media option
    configuration).'
  merge: -1
  pgno: 275
- img_proc: true
  md: 'However, you should develop at least a passing familiarity with the following
    commands (remember that each command has a manual page):


    +   -`lpadmin` Adds, removes, and modifies printers.

    `-lpinfo` Displays device and PPD file information (for use with `lpadmin`).

    `-lpoptions` Sets printer options. To display a quick list of options for a particular
    printer, run this command:


    ```

    lpoptions -p printer -1

    ```


    +   -`lpstat` Displays printer and job information (after you create printers).
    To display a printer''s job queue, use this command:


    ```

    lpstat -o printer

    ```


    To see the status of every printer on the system, use this:


    ```

    lpstat -a

    ```


    +   -`cancel` Removes a job. To remove all jobs from a queue, run this command:

    `-cancel -d printer -a


    +   -`disable` Enables printing (but still possibly allows new jobs on the queue).

    `-enable` Enables printing.

    `-reject` Disables print queuing.

    `-accept` Enables print queuing.

    `-lppasswd` Modifies users and passwords (for digest authentication; Section 12.5.2).


    # 12.5.10 Client Access Control


    By default, CUPS allows printer and administration access only to localhost. If
    you have a network of machines that you want to grant access to your CUPS server,
    then you have to change your cupsd.conf file to reflect this. To get an idea of
    how per-client access controls works, edit your cups.conf file and search for
    the line that reads `<Location />`. It should start with a section that looks
    like:


    ```

    <Location />

    Order Deny,Allow

    Deny. From All

    Allow From 127.0.0.1

    </Location>

    ```'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'The Location / section defines global access-control parameters for the CUPS
    server. In the preceding example, the directives work together to give access
    to localhost (127.0.0.1) and nothing else:


    +   * Order Deny,Allow Allows you to specify hosts and networks that are denied
    and allowed with the Deny and Allow directives. Further-more, it also means that
    you can override Deny directives with Allow directives. This is the most useful
    mode in CUPS, and you should never change it.


    +   * Deny From All Denies access to all clients by default. Again, you should
    not change this.


    +   * Allow From 127.0.0.1 Makes an exception to the preceding Deny From All rule,
    granting access to localhost.


    If you want to allow access for all of your printers to more clients, you can
    just add another rule directive after the Allow From 127.0.0.1 line. The following
    rule directive grants access to the subnet defined by 10.0.1.0/255.255.255.0:


    Allow From 10.0.1.0/255.255.255.0


    You may have as many Allow From lines as you like, and you can specify the client
    parameter in several ways. The following five specification types are the most
    useful:


    +   * Subnet notation, as in the preceding 10.0.1.0/255.255.255.0 example


    +   * IP addresses,


    +   * Fully qualified domain names, such as client.example.com


    +   * Domain wildcards, such as *.example.com


    +   * Network interfaces, such as B0(eth0)


    Remember that the Location / section is for global access, including printer job
    control and other client tasks. On the other hand, they have their own location
    section (<Location /admin>) that specifically excludes connections from all except
    localhost. In fact, you have already seen this section when you forced CUPS to
    digest authentication. Search for it in your cupsd.conf to verify that it allows
    administrative access to localhost, and nothing else.


    > You can specify per-printer client access by adding <Location /printers/name>
    access control sections, where name is the name of a printer. You''ll probably
    need to experiment for a while to get it to work perfectly.


    # 12.5.11 Auto-Discovery


    One of the most interesting CUPS features is automatic network printer discovery.
    This is called browsing. Most CUPS installations have browsing active by default,
    meaning that CUPS listens for messages from other printer servers on the network.
    The cupsd.conf parameter is Browsing:'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Browsing On


    However, without additional help, your CUPS server will likely not make itself
    known to the other printers on the network. To make your CUPS server broadcast
    its presence, you need a BrowseAddress broadcast address parameter in cupsd.conf.
    For example, to send notification packets to as many hosts on the network as possible
    (essentially, as many as your routers allow), use this parameter:


    BrowseAddress 255.255.255.255


    You can think of a numeric broadcast address as a sort of inverse subnet combined
    with an IP address. For example, to send packets to the subnet defined by 10.1.2.0/255.255.255.0,
    try this:


    BrowseAddress 10.1.2.255


    This said, the best choice is likely the “local” interface selection that sends
    broadcast packets to all network interfaces except PPP links:


    BrowseAddress @LOCAL


    If you have a server with several Ethernet interfaces, but do not want to broadcast
    on all of these interfaces, use @IF. For example, here''s how to broadcast to
    eth1:


    BrowseAddress @IF(eth1)


    # 12.5.12 Running an LPD-Compatible Server


    Browsing and broadcasting goes a long way toward allowing communication between
    various CUPS servers on a network, but if you want other clients running Berkeley
    LPD printing systems be able to print to your CUPS server, you need to configure
    your server to allow jobs from these clients.


    To do this, run a special LPD frontend called cups-lpd located in /usr/lib/cups/daemon.
    This is an inetd service (see Section 6.3), so you want a line like this in your
    /etc/inetd.conf (or the xinetd equivalent):


    printer stream tcp nowait cups-user /usr/lib/cups/daemon/cups-lpd cups-lpd


    cups-user is your CUPS User from cupsd.conf (usually 1). There is no built-in
    access control in cups-lpd, but like any other network service, you want to make
    sure that your firewall rules have adequate coverage; see Section 5.13. Remember
    that printer is defined in /etc/services as port 515.'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# 12.5.13 Troubleshooting CUPS


    When you have a problem with CUPS, it''s particularly important to take things
    one step at a time. You may find this sequence helpful:


    +   Make sure that CUPS is working properly by creating a test printer with no
    filters (raw mode) and a device of file:/dev/null. Send a test file to the printer
    with the Web interface and lp, and verify that the jobs complete with lpstat


    ```

    ```

    lpstat -w -o test_printer_name

    lpstat -o test_printer_name

    ```

    ```


    +   Use your printer''s PPD file to activate your filter. See Sections 12.5.4
    and 12.5.6 for more detail if something goes wrong. Print more test files, making
    sure that the jobs finish.


    +   Add the printer''s actual device, and then try another test job. If necessary,
    try printing to a file, then sending the file directly to the printer.


    If a test job fails and stalls, the printer state changes to “not ready,” and
    you need to start the printer to retry the job or run any new jobs. You can do
    this with either printer or the Web interface. Before you starting changes around,
    though, you should look at your log files, which are described in the next section.


    # Error Messages


    The complex nature of the print spooler and filters makes it crucial that you
    pay careful attention to your log messages. The most important log file is /var/log/cups/error_log
    (the name is slightly misleading because the file also contains normal diagnostic
    messages).


    Looking at the log reveals this:


    ```

    ```

    [timestamp] Started filter /usr/lib/cups/filter/pstops (PID 3144) for job 26.

    [timestamp] ProcessPPDRequest: 10 status code=0

    [timestamp] Process[26] unable to open file - : Permission denied

    ```

    ```


    The letter at the start of the line indicates the message severity or priority.
    The three letters in the preceding example are as follows:


    +   An informational log message. These notices indicate some significant event,
    such as a filter invocation or job submission.


    +   A verbose debugging message. You should not care about these unless you run
    into a problem.


    +   An error message indicating that something doesn''t work. The CUPS scheduler
    usually keeps running if there is an error. However, you may end up missing a
    feature or having a stalled printer.'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'You can change the log level with the LogLevel parameter in the cupsd.conf
    file. The default level is info in most installations. If you want the debugging
    messages, you must use debug. If you change the logLevel parameter, remember to
    reload your configuration file after making any changes by sending a HUP signal
    to cupsd.


    # Filter Problems


    The first thing you should do after running into trouble in the print filter stage
    is to make sure that the CUPS filters in /etc/cups/mime.convs function properly.


    To do this, disable any filters that you might have in your printer''s PPD file
    so that you can eliminate the backend filter from the list of things that can
    go wrong. You will only have such filters if you are using a non-PostScript printer.
    If that''s your case, edit your printer''s PPD file (the one in /etc/cups/ppd),
    looking for a cupsFilter parameter (see Section 12.5.7). Comment out it by adding
    a % just after the *: for example:


    ```

    *cupsFilter: "application/vnd.cups-postscript 0 fomatic-rip"

    ```


    After making this (and making cupsd re-read its configuration with a HUP signal),
    submit a test job to see if data can make it the mime.convs filter stage to the
    printer device. Although you are not likely to run into any trouble with the CUPS-supplied
    filter programs in mime.convs, this process may have you uncover spool directory
    permissions problems (discussed in the next section) because these sorts of problems
    usually show up in the initial print stages.


    Having worked out any kinks not involving the cupsFilter filter, re-enable this
    parameter and look for more trouble:


    +   - Verify that the cupsFilter filter is in the lib/cups/filter directory.


    +   - For the Foromatic filter, use fomatic-rip -v manually from the command line
    to check for valid output (see Section 12.5.8).


    +   - Check that the filter has the path for any new program.


    +   - If your filter relies on Ghostscript, ensure that you have the required
    driver by running gs -help.


    # Spool Directory Permission Errors


    Look for this in your error log:


    ```

    E [timestamp] Job n] unable to open print file - : Permission denied

    ```


    CUPS normally runs its filters as the pseudo-user lp and the group sys, so this
    user must have access to the spool directory /var/spool/cups in order to access
    intermediate data. When fixing the permissions, look for these problems:'
  merge: -1
  pgno: 280
- img_proc: true
  md: '+   • Check all component directories of /var/spool/cups. Can the lp user access
    each of them?


    +   • Make sure that you have the lp user in /etc/passwd file.


    +   • Verify that lp belongs to the sys group. (Remember that you can change the
    pseudo-user and group with the User and Group parameters of cupsd.conf.)


    # Device Problems


    After running through the filter gauntlet, you are ready to send output to devices.
    Fortunately, there is relatively little that can go wrong at this final stage:


    +   • The lp user must have write access to any printer device directly connected
    to the system. In addition, check the kernel bootup messages and /proc to ensure
    that the kernel recognizes the device ports.


    +   • For network printers, make sure that your host can reach the printer. If
    your device is the socket type on TCP port 9100, test the connection with this
    command:


    ```

    telnet printer_address 9100

    ```


    Terminate a successful connection by pressing CONTROL-]-. Unless you know the
    printer''s native language, this connection does little good other than confirming
    that it can be made.


    # 12.6 Ghostscript


    If you want to get a handle on printing under Unix, you should get to know Ghostscript.
    As mentioned before, most Unix programs that generate PostScript output. Ghostscript
    is a PostScript interpreter that includes these features:


    +   • Bitmap rendering from PostScript code in several different output formats


    +   • PostScript file filtering


    +   • Reading and writing to PDF format


    +   • Document previewing


    To get a feel for how Ghostscript works, run it with a file and no other arguments:


    ```

    gs file.ps

    ```


    In addition to getting a preview window showing the first page of the file, you
    should also see this message back at your terminal window:


    ```

    >>showpage, press <return> to continue<<

    ```'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'As the prompt suggests, pressing RETURN pages through the file. After reaching
    the final page, you get a GS> prompt; you may press CONTROL-D to exit.


    There are several frontend programs, such as gv and ggv, that give a nicer interface
    to the Ghostscript preview. Whether you use one of these frontend programs or
    not, running a-preview can verify that you have a valid PostScript file to begin
    with. This can go a long way in tracking down problems, especially if you print
    spooler also uses Ghostscript to rasterize images for the printer.


    # 12.6.1 Command-Line Options


    A few gs command line such as the one in Section 12.5.8 may seem a bit complicated,
    especially when it comes to device specification. However, it''s not hard to gain
    enough familiarity to make use of Ghostscript''s filtering capabilities.


    Take a close look at the following command, which filters old.ps to new.ps:


    ```

    gs -q -dOPAUSE -dBATCH -sDEVICE=pswwrite -sOutputFile=new.ps old.ps

    ```


    The first four options are typical for files that run with no user input. Here''s
    what they specify:


    +   -q Quiet mode; suppress any normal diagnostic output.

    -dOPAUSE Do not wait for the user to press RETURN after each page.

    -dBATCH Terminate after interpreting all input.

    -dSAFER Disable file allocation capabilities (to avoid security problems). The
    -dPARANOIDSAF option disables file-read capabilities.


    The next two options usually go hand-in-hand when creating an output file:

    -sDEVICE=driver_name Use driver_name as the output driver. In this context, the
    term driver usually refers to a file format driver rather than a piece of code
    that manipulates devices, though there are exceptions (such as the x11 driver
    for the preview window). To see a list of drivers, run gs -help.


    > Some drivers require other command-line parameters to operate correctly. Two
    notable examples are the unprint and lj drivers. The unprint driver comes with
    a number of .upp files (containing extra parameters) in the Ghostscript library.
    To use these settings, use @file.upp, for example:


    ```

    gs @file.upp -dOPAUSE -dBATCH -sOutputFile=out ...

    ```


    -sOutputFile=file Write output to file (use - standard output). If you wish to
    create one file per page of PostScript input, insert %d into the name of file.
    Ghostscript substitutes the page number for %d.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# 12.6.2 More Ghostscript Tricks


    Here are a few more useful things that you can do with Ghostscript:


    +   - To transform a PostScript file into a PDF file, use the pdfwrite driver
    (Ghostscript comes with a ps2pdf script that does essentially the same thing):


    ```

    gs -q -dNOPAUSE -dBATCH -dSAFER -sDEVICE=pdfwrite -sOutputFile=file.pdf file.ps

    ```


    +   - The pswrite driver (introduced in the previous section) is an effective
    way to make somewhat defective files print. If you can view the file with Ghostscript,
    the chances are good that a file filtered with the pswrite driver will print on
    even a finicky printer.


    +   - You can combine several PostScript or PDF files into one by adding the additional
    filenames to the end of the command line.


    +   - To change the output resolution (in dots per inch), use the -dpi or -dxdpi
    -ydpi parameters. The default resolution is usually 72 dpi. These commands generate
    larger bitmaps:


    ```

    gs -q -dNOPAUSE -dBATCH -dSAFER -r150 -sDEVICE=ppmraw -sOutputFile=file.ps

    gs -q -dNOPAUSE -dBATCH -dSAFER -r300x150 -sDEVICE=ppmraw -sOutputFile=file.ps

    ```


    # 12.6.3 HP Inkjet Server


    If you have an inkjet or non-PostScript laser printer made by HP, then you almost
    certainly need the HPIJS (HP Inkjet Server) printer driver package. The main part
    of HPIJS is a program called hpijs. You can think of this as a plug-in driver
    for Ghostscript that translates Ghostscript''s internal raster image into printer
    formats. This driver is especially important if you are printing photographs or
    other graphics.


    You can tell if you need HPIJS by looking at the PPD file for your printer. If
    you need the -sDEVICE=ijs in the FormaticRIPcommand line, you need the driver.
    You can install it as a binary package or from source code; the only thing that
    matters is that Ghostscript can find it in its path.


    > Current versions of hpijs come with foomatic-rip and a set of PPD files. The
    best quality likely comes from using these PPD files rather than random ones you
    see on the Internet.


    # 12.7 Further Printing Topics


    This chapter is really only the tip of the iceberg when it comes to printing.
    Chapter 14 revisits printing to look at details of how to interface CUPS with
    Samba servers, but among the aspects not touched here are application configuration,
    complex color graphics support, and advanced PostScript topics, not to mention
    several Unix print server packages.'
  merge: -1
  pgno: 283
- img_proc: true
  md: 'Here are some Web sites that can help you with your quest for Unix printer
    configuration:


    http://www.linuxprinting.org/ This site has PPD files and documentation on many
    print servers. It also contains the Foomatic central information site.


    http://www.cups.org/ This is the central CUPS Web site.


    http://www.ghostscript.com/ A good source for Ghostscript software and topics.


    http://gimp-print.sourceforge.net/ Gimp-print is a GIMP plug-in specifically designed
    for direct color printing. In certain cases, you may want to make gimp-print generate
    printer-ready data, bypassing Ghostscript rasterization completely with the lp
