    ```


    This procedure confirms that your CUPS server is running and you can add and modify
    printers.


    # Adding a Real Printer


    Now that you have some familiarity with the process, you are ready to add a real
    printer with a particular model using this command:


    ```

    lpadmin -p name -v device -m model

    ```


    The model parameter is extremely important because it provides printer-specific
    information, including the printer driver specification. If you do not use the
    -m parameter, CUPS uses a "raw" print model, sending unfiltered input directly
    to the printer. You almost certainly do not want this, because printers can generate
    copious amounts of garbage upon receiving bad input.

    If you want to make the new printer the default, run this command:


    ```

    lpoptions -d name

    ```'
