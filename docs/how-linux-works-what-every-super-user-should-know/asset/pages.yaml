  md: 'Never use fsck on a mounted filesystem. The kernel may alter the disk data
    as you run the check, causing mismatches that can crash your system and corrupt
    files. There is only one exception. If you mount the root as read-only in single
    user mode, you may use fsck on the root filesystem.


    In manual mode, fsck prints verbose status reports on its passes, which should
    look like this when there are no problems:


    +   Pass 1: Checking inodes, blocks, and sizes

    Pass 2: Checking directory structure

    Pass 3: Checking directory connectivity

    Pass 4: Checking reference counts

    Pass 5: Checking group summary information

    /dev/hdd1: 11/1976 files (0.0% non-contiguous), 265/7891 blocks


    If fsck finds a problem in manual mode, it stops and asks you a question relevant
    to fixing the problem. These questions deal with the internal structure of the
    filesystem, such as reconnecting inodes and clearing blocks. The reconciliation
    means that fsck finds a file that doesn''t appear to have a name; reconnecting
    places the file in the lost+found directory as a number. You need to give the
    name based on the content of the file.


    In general, it''s pointless to sit through the fsck process if you just made the
    mistake of an impolite shutdown. efsck has a -p option to automatically fix silly
    problems without asking if there is a serious error. It is so common that Linux
    distributions run some variant of fsck -at boot time (fsck -a is also common).


    However, if you suspect there is some major disaster, such as a hardware failure
    or device misconfiguration, you need to decide on a course of action, because
    fsck can really mess up a filesystem with larger problems. A telltale of a serious
    problem is a lot of questions in manual mode.


    If you think that something really bad happened, running fsck -n to check over
    the filesystem without modifying anything. There''s some sort of problem with
    the device configuration (an incorrect number of blocks in the partition table,
    loose cables, whatever) that you think you can fix, then fix it before running
    fsck for real. You''re likely to lose a lot of data otherwise.


    If you suspect only the superblock a key filesystem database component, is corrupt
    (for example, some wrote to the beginning of the disk partition), you might be
    able to recover the filesystem with one of the superblock backups that m2fs creates.
    Use fsck -b num to replace the corrupted superblock with an alternate block num.


    You may not know where to find a backup superblock, because you didn''t write
    the numbers when m2fs is run. If the filesystem was created with the default values,
    you can try m2fs -n on the device to view a list of superblock backup numbers
    without destroying your data (again, make sure that you''re using -n, because
    you''ll really tear up the filesystem otherwise).'
