- img_proc: true
  md: '# 12.5.4 Adding and Editing Printers


    The easiest way to add a printer is with the Web interface (there is an Add Printer
    button on the printer list page). The first time you try to do any administration
    task, CUPS asks you for a username and password. Use the admin user and password
    that you configured in Section 12.5.2.


    To add a printer with the command-line interface, use the lpdadmin command. The
    bare minimum command for adding a printer without a print filter is as follows:


    ```

    lpdadmin -p name -v device

    ```


    Depending on your configuration, you may need the -E option to specify encryption.


    # Adding a Test Printer


    As is the case with most Unix utilities, commands like lpdadmin do nothing more
    than modify test files (except that with CUPS, lpdadmin opens a network connection
    to the CUPS server, sends some data, and then the server changes the files). You
    should know exactly what happens when you run lpdadmin.


    Add a dummy test printer by going through the following steps:


    +   1. Run lpdadmin to add the printer:


    lpdadmin -p test -v file:/dev/null


    2. Use lpstat to verify that the printer is there:


    lpstat -p


    Y new printer should show up as follows:


    printer test disabled since Jan 01 00:00 - reason unknown


    3. Examine /etc/cups/printers.conf. You should see an entry like this:


    <DefaultPrinter test>

    Info test

    DeviceURI file:/dev/null

    ...

    ...

    </Printer>


    4. Activate your printer:


    lpdadmin -p test'
