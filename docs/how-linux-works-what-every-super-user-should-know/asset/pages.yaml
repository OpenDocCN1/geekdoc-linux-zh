    # 4.3.2 Working with Groups


    Groups in Unix offer a way to share files with certain other users on the system,
    by deny access to all other users. The idea is that you can read or write permission
    bits (described in Section 1.17) for the group, but not the world (everyone else).
    This was once important because many users shared one machine, but this has become
    less significant in recent years as workstations have become more personal.


    As mentioned earlier, /etc/passwd has a group field. The /etc/group defines the
    group IDs, as are shown in this example:


    ```

    root*:0:juser

    demon*:1:

    bin*:2:

    sys*:3:

    adm*:4:

    disk*:6:juser,beazley

    noggroup*:65534:

    user*:1000:

    ```


    The fields in /etc/group are as follows:


    +   - The group name. (This is what shows up when you run a command like ls -1).

    - The group password. This is hardly ever used; you can use * or any other default
    value.

    - The group ID (a number). The GID must be unique within the group file. This
    number goes into a user''s group field in their /etc/passwd entry.

    - An optional list of users that belong to the group. In addition to the users
    listed here, users with the corresponding group ID in their passwd file entries
    also belong to the group.


    Figure 4-2 identifies the fields in a group file entry.'
