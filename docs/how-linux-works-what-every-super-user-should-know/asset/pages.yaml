    # 4.3 User Management Files


    The user system in Unix allows different people to log in to the same machine
    without interfering with one another. At the lowest level, users are nothing more
    than numbers (user IDs), but login names help to avert confusion and boredom.

    The plain-text file /etc/passwd maps login names to user IDs, and it looks something
    like this:


    ```

    root:x:0:0:Super:/root:/bin/sh

    daemon*:1:1:daemon:/usr/bin:/bin/sh

    bin*:2:2:bin:/bin/sh

    sys*:3:3:sys:/dev:/bin/sh

    nobody*:65534:65534:nobody:/home:/bin/false

    user:x:3119:1000:Random User:/home/user:/bin/bash

    beazly:x:143:1000:David Beazly:/home/beazly:/bin/bash

    ```


    The format is straightforward. Each line represents one user, with seven fields
    separated by colons:


    +   * The user (login) name.

    * The user''s encrypted password. On most Linux systems, the password is not actually
    stored in the passwd file, but in the shadow file. shadow is similar to passwd,
    but normal users do not read permission on shadow. The second field in passwd
    or shadow is the encrypted password, and it looks like a bunch of garbage, such
    as dCVKEIR/oppc (in Unix, passwords are never stored in clear text). The rest
    of the fields in shadow deal with matters such as password expiration dates.

    * An x in the second field in the passwd file indicates that the encrypted password
    is stored in shadow. An * indicates that the user cannot log in, and if the field
    is blank (that is, appears as ::), no password is required to log in. Watch out
    blank passwords. You should never have a user without a password.

    * The user ID (UID), the user''s representation to the kernel. It should be unique.
    You can have two entries with the same user ID, but it will confuse you and some
    of your software.

    * The group ID (GID). It should be one of the numbered entries in the /etc/passwd
    file. Groups define file permissions and little else. This group is also called
    the user''s primary group.'
