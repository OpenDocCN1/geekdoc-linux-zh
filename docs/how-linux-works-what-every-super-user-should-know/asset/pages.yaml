  md: '`insert socket` Tells relevant drivers that you just put a card into socket.
    Like eject, this is not necessary for most cards.

    suspend socket` Attempts to freeze the driver for socket and cut the power.

    `resume socket` Attempts to recover from a suspend operation.

    `reset socket` Resets the card in socket.


    There are a few more complex options for cards that need to operate in multiple
    environments (schemes); see the cardctl(8) manual page and the PCMCIA-HOWTO for
    more information.


    NOTE `pcmcia-cs` builds also come with cardint, a GUI display of the PCMCIA configuration.
    You may prefer to run this application in place of information commands such as
    cardctl status.


    # 11.7 Approaching Other Devices


    Obviously, the number of devices that you can attach to your PC is enormous, and
    attempting to write a chapter that covers all of them is next to impossible. However,
    with what you just learned about SCSI, USB, PCMCIA, and IEEE 1394, along with
    what you will learn about printers in Chapter 12, Ethernet interfaces, and so
    on, you should be well equipped to take on almost anything. For example, you know
    how to identify a USB scanner; it''s just a matter of installing the appropriate
    drivers and software (the most popular Unix scanning system is called SANE, if
    you are interested).


    This book isn''t finished with devices just yet, though. In particular, Chapter
    13 has information about tape drives, and Chapter 17 gives tips on how to purchase
    hardware so that you can avoid Linux compatibility nightmares.'
