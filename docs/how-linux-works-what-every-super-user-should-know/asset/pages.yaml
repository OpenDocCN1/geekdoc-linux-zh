  md: '# Staying Up to Date


    One make fundamental is that targets should be up to date with their dependencies.
    If you type make twice in a row for the preceding example, the first command builds
    myprog, but the second command yields this output:


    ```

    make: Nothing to be done for `all`.

    ```


    For this specific through, make looked at its rules and noticed that myprog already
    exists. To be more specific, make did not build myprog because none of the dependencies
    had changed since the last time it built myprog. You can experiment with this
    as:


    +   1. Run touch aux.c.

    2. Run make again. This time, make figures out that aux.c is newer than aux.o
    already in the directory, it must compile aux.o again.

    3. myprog depends on aux.o, and now aux.o is newer than the preexisting myprog,
    so make must create myprog.


    This type of chain reaction is very typical.


    # Command-Line Options


    You can get a great deal of mileage from make if you know how its command-line
    options work.

    The most common make option is specifying a single target on the command line.
    For the preceding Makefile, you can run make aux.o if you want only the aux.o
    file.


    You can also define a macro on the command line. Let''s say that you want to use
    a different compiler called my_bad_cc. Try this:


    ```

    make CC=my_bad_cc

    ```


    Here, make uses your definition of CC instead of its default compiler, cc. Command-line
    macros come in handy when you''re testing out your preprocessor definitions and
    libraries, especially with the CFLAGS and LDFLAGS macros explained later.

    You don''t even need to run a Makefile. If built-in make matches a target, you
    can just ask make to create the target. For example, if you have the source to
    a very simple program blah.c, try make blah. The make run tries the following
    command:


    ```

    cc blah.o -o blah

    ```


    This use of make works only for the most elementary C programs; if your program
    needs a library or special include directory, you''re probably better off writing
    a Makefile.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'Running make without a Makefile is actually most useful when you aren''t dealing
    with a C program, but with something like Fortran, x, yacc. It can be a real pain
    to figure out how the compiler or utility works, so why not let make try to figure
    it out for you? Even if make fails to create the target, it will probably still
    give you a pretty good hint as to how you might use the tool. Two more make options
    stand out from the rest:


    +   - -n Prints the commands necessary for a build, but prevents make from actually
    running any commands

    - -f file Tells make to read from file instead of Makefile or makefile


    # Standard Macros and Variables


    make has special macros and variables. It''s difficult to tell the difference
    between a macro and a variable, so this book uses the term macro to mean something
    that usually doesn''t change after make starts building targets. As you earlier,
    you can set macros at the start of your Makefile. The following list includes
    the most common macros:


    +   CFLAGS C compiler options. When creating object code from a .c file, make
    passes this as an argument to the compiler.

    LDFLAGS Like CFLAGS, but for the linker when creating an executable from object
    code.

    LDTBS If you use LDFLAGS but do not want to combine the library name options with
    the search path, put the library name options in this file.

    CC The C compiler. The default is cc.

    CPPFLAGS C preprocessor options. When make runs the C preprocessor in some way,
    it passes this macro''s expansion as an argument.

    CXXFLAGS GNU uses this for C++ compiler flags. Like C++ source extensions (and
    nearly everything else associated with C++), it isn''t standard and probably won''t
    work with other make variants unless you define your own rule.


    A make variable changes as you build targets. Because you don''t ever set variable
    by hand, the following list includes $:


    +   $@

    $* Expands to the basename of the current target. For example, if you''re building
    blah.o, this expands to blah.


    The most comprehensive list of the make variables on Linux is the make info page.


    > NOTE Keep in mind that GNU make has many extensions, built-in rules, and features
    that other variants do not have. This is fine as long as you''re running Linux,
    but if you step off onto a Sun or BSD machine and expect the same stuff to work,
    you might be in for a surprise.'
