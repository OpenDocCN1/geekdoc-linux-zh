- img_proc: true
  md: 'To get a general feel for how configuration options work, go into the Processor
    type and features submenu. You will see options such as these:


    +   * Math emulation

    * MTRR (Memory Type Range Register) support

    * > /dev/cpu/microcode - Intel IA32 CPU microcode


    You can alter an item''s configuration value by moving to the item and pressing
    the SPACEBAR. The square brackets ([ ]) provide a simple on/off toggle:


    +   * indicates that the feature is on.

    [ ] indicates that the feature is off.


    You may not compile on/off features as kernel modules. Active features go directly
    into the main kernel image.

    By contrast, an item with angle brackets (< >) denotes a feature that you may
    compile as a module. You can use the SPACEBAR to toggle between these values:


    +   * indicates that the feature is on.

    < indicates that the feature is configured as a module.

    > indicates that the feature is off.


    An item that includes regular parentheses like these, ( ), is a multiple-choice
    option or a number that you can customize. Press ENTER to see the option list,
    or enter a number.


    # When Should You Compile a Driver as a Module?


    There aren''t many absolute rules for deciding which features to compile as part
    of the main kernel image, but here are a few guidelines and rules that can help
    you:


    +   * Always compile your root filesystem type directly into the kernel, not as
    a module. Your system won''t boot otherwise.

    * Most administrators prefer to compile crucial disk support (such as SCSI host
    adapter drivers) directly into the kernel. There is a way to get around this with
    an initial RAM disk, but that is more an ugly hack than anything else.

    * Most administrators also compile network interface card drivers directly into
    the kernel. This isn''t as crucial as disk support, though.

    * Compile obscure filesystems as modules. You may need them at some point, but
    there is no point in wasting memory in the meantime.'
