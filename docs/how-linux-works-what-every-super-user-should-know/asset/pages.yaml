    the object file above the rule that builds the executable. If several executables
    use the same object file, put the object rule above all of the executable rules.


    # 8.2 Debuggers


    The standard debugger on Linux systems is gdb, with DDD as a graphical frontend.
    To enable full debugging in your programs, you must run the compiler with the
    -g option to write a symbol table and other debugging information into the executable.
    To start gdb on an executable named program, run this command:


    ```

    gdb program

    ```'
