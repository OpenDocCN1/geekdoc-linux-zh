    # 5.7 Using DHCP Clients


    The Dynamic Host Configuration Protocol (DHCP) allows a host to get its IP address,
    subnet mask, default gateway, DNS servers, and other information from the network,
    so that you do not have to type these parameters by hand. Network administrators
    like DHCP because users don''t have to nag them for IP addresses because when
    they want to connect to the network.


    If ifconfig, DHCP works on a network interface setup option for DHCP, so if you
    don''t feel like digging around try to find what files controls the interface
    settings, it''s all right to let your distribution''s setup program do the work.


    When your machine asks a DHCP server for an IP address, it is really asking for
    an address for a certain amount of time. When the lease is up, your machine can
    ask to renew the lease.


    Most distributions use the ISC (Internet Software Consortium) dhclient program
    to request and retrieve IP address information from a DHCP server. To get a lease,
    you can run dhclient by hand on the command line, before doing so you must remove
    any default gateway route. Once you have done that, you can request an IP lease
    by running the following command:


    ```

    dhclient eth0

    ```


    dhclient stores its process ID in /var/run/dhclient.pid and its lease information
    in /var/state/dhclient.leases.


    Red Linux versions 7 and earlier use a program pump instead of dhclient. You can
    run it with pump -i interface, but you may want to consider getting dhclient from
    ISC or as an RPM.


    # 5.8 PPP Connections


    So far, you have seen Internet connections based on a local area network (LAN)
    and a default gateway on that network. However, if you have a modem and telephone
    line to connect to the Internet, you cannot use the same host-to-network layer
    interfaces described in previous sections because your connection does not run
    over the Ethernet physical medium.'
