  md: '# More No-Nonsense Books from


    # NO STARCH PRESS


    ![](img/969dbb62afa2179379a21a5f06798aaf_375_0.png)


    # THE LINUX COOKBOOK, 2ND ED


    Tips and Techniques for Everyday Use


    by MICHAEL STUTZ


    The Linux Cookbook is your guide to getting the most out of Linux. Organized by
    general task (such as working with text, managing files, and manipulating graphics),
    each section contains a series of step-by-step recipes that help you get your
    work done quickly and efficiently, most often from the command line. Perfect as
    an introduction to Linux and the command line, or as a desk-top reference for
    the seasoned user. Covers the major Linux distributions.


    APRIL 2004, 576 PP., $39.95 ($57.95 CAN)


    ISBN 1-59327-031-3


    ![](img/969dbb62afa2179379a21a5f06798aaf_375_1.png)


    # WICKED COOL SHELL SCRIPTS


    101 Scripts for Linux, Mac OS X, and UNIX


    by DAVE TAYLOR


    This cookbook of useful, customizable, and fun scripts gives you the tools to
    solve common Linux, Mac OS X and UNIX problems and personalize your computing
    environment. Among the more than 100 scripts included are an interactive calculator,
    a shell checker, a disk backup utility, a weather tracker, and a web log analysis
    tool. The book also teaches you how to write your own sophisticated shell scripts
    by explaining the syntax and techniques used to build each example scripts. Examples
    are written in Bourne Shell (sh) syntax.


    JANUARY 2004, 368 PP., $29.95 ($43.95 CAN)


    ISBN 1-59327-012-7


    ![](img/969dbb62afa2179379a21a5f06798aaf_375_2.png)


    # HACKING


    The Art of Exploitation


    by JON ERICKSON


    A comprehensive introduction to exploitation techniques and creative problem-solving
    methods known as "hacking". Explains technical aspects of hacking such as stack
    overflows, heap overflows, string exploits, return-to-libc, shellcode, and cryptographic
    attacks on 802.1b.


    > "the seminal hackers handbook" – SecurityForums.com


    NOVEMBER 2003, 264 PP., $39.95 ($59.95 CAN)


    ISBN 1-59327-007-0'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# # THE LINUX ENTERPRISE CLUSTER


    by KARL KOPPER

    The Linux Enterprise Cluster explains how to take a number of inexpensive computers
    with limited resources, place them on a normal computer network, and install free
    software so that the computers act together one powerful server. The book includes
    information on how to build a high-availability server using the Heartbeat package,
    how to use the Linux Virtual Server load balancing software, how to configure
    a reliable printing system in a Linux cluster environment, and how to build a
    job scheduling system in Linux with no single point of failure.


    MAY 2004, 456 PP., $49.95 ($72.95 CAN) W/CD

    ISBN 1-59327-036-4


    ![](img/969dbb62afa2179379a21a5f06798aaf_376_0.png)


    # # THE BOOK OF WEBIN


    ...or How I Learned to Stop Worrying and Love Unix

    by JOE COOPER


    A comprehensive guide to Unix system administration with Webmin, Everything you
    need to know about Webmin''s unique features, including the standard system features
    (network configuration, disk configuration, users and groups, etc.) and how to
    integrate the most popular services (Apache, BIND, Sendmail, and more). Tutorials
    show how to accomplish common tasks with each service.


