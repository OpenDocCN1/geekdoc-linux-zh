    # # 9.4 Installation Practice


    Knowing how to build and install software is good, but knowing when and where
    to install your own packages is what proves to be useful. Linux distributions
    to cram in as much software as possible on installation. You should always ask
    yourself if you should install a package by yourself instead: Here are the advantages
    of doing it yourself:


    +   • You can customize package defaults.

    • Custom software usually survives operating system upgrades.

    • When installing a package, you often get a much clearer picture of how to use
    the package.

    • You always get the latest releases.

    • It''s easier to back up a custom package.

    • It''s easier to distribute self-installed packages across a network.


    These are the disadvantages:


    +   • It takes time.

    • If you don''t actually use the package, you''re wasting your time.

    • There is a potential for misconfiguring packages.


    Consider the Library and the coreutils package (ls, cat, and so on) — there is
    really no point in building these by yourself unless you have some real obsession
    with the build process. On the other hand, if you have a vital interest in network
    servers such as Apache, the best way to get complete control is to install the
    servers yourself.


    # # 9.4.1 Where to Install


    The default prefix in GNU autoconf and many other packages is /usr/local, the
    traditional directory for locally installed software. Operating system upgrades
    ignore /usr/local, so you won''t lose anything installed there during an operating
    system upgrade.


    For local software installations, /usr/local is fine. However, if you have a lot
    of custom software installed, this can turn into a terrible mess. Thousands of
    odd little files can make their way into the /usr/local hierarchy, and you may
    have no idea where the files came from.


    There are several schemes that help manage software packages. I like the Encap
    system (http://www.encap.org/) because it requires no extra software.'
