    IP over Ethernet is straightforward. When you want to send a packet to some other
    host on your local area network, your machine must know that host''s MAC address.
    Using a series of ARP (Address Resolution Protocol) broadcasts, your host maps
    the IP address of the target to the target''s MAC address and then sends the IP
    packet out on the wire to that MAC address.


