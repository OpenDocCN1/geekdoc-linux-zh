  md: '# 4.6.1 Installing Crontab Files


    Each user can have their own crontab file. The system usually stores all crontabs
    in /var/spool/cron/crontabs. Normal users can''t write to this directory. Instead,
    the crontab command installs, lists, and removes a user''s crontab.


    The easiest way to install a crontab is to put your crontab entries into a file,
    then use crontab file to install file as your current crontab. crontab command
    checks the file format to make sure that you haven''t screwed anything up. If
    you want to list your cron jobs, run crontab -1. To remove the crontab, use crontab
    -r.


    Using temporary files to create and manipulate your crontab can be a little messy,
    so if you want to edit and install your crontab in one motion, run crontab -e.
    If you make a mistake, crontab tells you where the mistake is and asks you would
    like to try editing again.


    # 4.6.2 System Crontab Files


    Rather than use the superuser''s crontab for scheduling recurring system tasks,
    Linux distributions normally have an /etc/crontab file. Do not use the crontab
    command to edit this file; it has a slightly different format with one field —
    the user who should run the job. Here is an example for a job to run at 6:42 AM,
    running as the superuser (root):


    ```

    2 6 * * * root /usr/local/bin/cleansystem > /dev/null 2>&1

    ```


    Some distributions also use the /etc/cron.d directory to store system crontab
    files. These files may have any name, but they have the same format as /etc/crontab.


    # 4.7 Scheduling One-Time Tasks with at


    If you want to run a job in the future but not to use crontab because the command
    should only run once, you can do it with the at service. For example, if you want
    to run myjob at 10:30 PM, enter this command:


    ```

    at 22:30

    myjob

    ```


    End the input with a CONTROL-D (at reads the commands from the standard input).


    To check that the job has been scheduled, use at or to remove it, use atm. You
    can schedule jobs days into the future by adding the date in DD.MM.YY format;
    for example, at 22:30 30.09.03.


    There isn''t too much else to the at command. at actually does not see much use
    in common practice. However, it can be handy for the odd time that you need to
    shut the system down in the future.'
  merge: -1
