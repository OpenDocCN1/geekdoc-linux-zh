    # ## 5.5 Configuring a Default Gateway


    In the previous section, you saw how to manually configure an Ethernet network
    interface with a particular address and mask. You can connect to networks outside
    your subnet by adding a default gateway to your kernel''s IP routing table with
    this command:


    ```

    route add default gw gw-address

    ```


    The gw-address parameter is the IP address of your default gateway; it must be
    an address in a locally connected subnet defined by the address and mask settings
    of your network interface (as described in the previous section). If you have
    a static IP address, a default route setting usually goes along with an ifconfig
    command in your boot sequence. For other kinds of connections, programs usually
    set the default route.


    To view the current default route, run this command:


    ```

    route -n

    ```


    The output should look like this:


    | Destination | Gateway | Genmask | Flags Metric Ref | Use Iface |

    | --- | --- | --- | --- | --- | --- | --- |

    | 10.1.2.0 | 0.0.0.0 | 255.255.255.0 | U | 0 | 0 | eth0 |

    | 0.0.0.0 | 10.1.2.1 | 0.0.0.0 | UG | 0 | 0 | eth0 |


    The ifconfig command that configured the eth network interface in this example
    added the first route line. However, the last is the default gateway, because
    it has a mask of 0.0.0.0, which allows the host to reach all other hosts on the
    Internet. The gateway''s IP address is 10.1.2.1, and you can see that you route
    that gateway through the eth network interface.


    If you mistake a gateway address when adding a route, you cannot attach another
    gateway until you delete the erroneous route. To remove the current default gateway,
    run this command:


    ```

    route -del default

    ```


    Figure 5-1 on the next page shows a typical local area network with a gateway,
    or router. The subnet is 10.1.2.0/255.255.255.0 with a default gateway of 10.1.2.1.
    Each IP address represents a network interface, as does the uplink'
