    # 3.1.4 Controlling init


    Occasionally, you need to give init a little kick to tell it to switch runlevels,
    to re-read the inittab file, or to shut down the system. Because init is always
    the first process on a system, its process ID is always 1.


    You can control init with telinit. For example, if you want to switch to runlevel
    3, use this command:


    ```

    telinit 3

    ```


    When switching runlevels, init tries to kill off all processes that aren''t in
    the inittab file for the new runlevel. Therefore, you should be careful about
    changing runlevels.


    When you need to add or remove respawning jobs or make any other change to the
    inittab file, you must tell init about the change and cause it to re-read the
    file. Some people kill -HUP 1 to tell init to change and do to this. The traditional
    method works on most versions of Unix, as long as you type it correctly. However,
    you can also run this telinit command:


    ```

    telinit q

    ```


    You can use telinit s to switch to single-user mode (see Section 3.2.4).


    # 3.1.5 Shutting Down


    init controls how the system shuts down and reboots. The proper way to shut down
    a Linux machine is to use the shutdown command.


    There are two basic ways to use shutdown. If you halt the system, it shuts the
    machine down and keeps it down. To make the machine halt immediately, use you
    this command:


    ```

    shutdown -h now

    ```


    On most modern machines with reasonably recent versions of Linux, a halt cuts
    the power to the machine. You can also reboot the machine. For a reboot, use -r
    instead of -h.


