  md: 'There are two versions of each tape-device on a Unix system:


    +   - A rewind tape device rewinds the tape after every operation. For example,

    /dev/nsto is a rewind device.


    +   - A no-rewind tape device does not rewind the tape after an operation. No-

    rewind devices start with n; for example, /dev/nsto is a no-rewind device.


    For day-to-day operation, rewind devices are practically useless. You may as

    well forget that they exist; the next few sections show that you often need to

    position the tape.


    When working with tapes, you sometimes need to know the tape block

    size. Applications intend to write the tape in a certain block size, and many

    tape drives do not allow you to read from the tape if you specify the incorrect

    block size. This is almost never a problem, because you normally write to

    read from the tape with the same program. However, if you want to use dd

    get direct access to tape files, you may need to specify the block size manually

    (see Section 13.6.7).


    Before you started with a tape drive, you should set the TAPE environ-

    variable to the no-rewind device name. This variable saves a lot of

    typing in the long run, in particular, with -f options for the mt and tar

    commands (which are explained in the next section).


    # 13.6.1 Working with Tape Drives


    A tape is one of the simplest forms of media available. You can think of a tape

    as a sequence of files with a file mark between each file, as shown in Figure

    13-1. Notice how there is no file mark at the beginning of the tape and that

    the first file is numbered 0.


    ![](img/969dbb62afa2179379a21a5f06798aaf_292_0.png)


    Figure 13-1: Files and file marks on a tape.'
