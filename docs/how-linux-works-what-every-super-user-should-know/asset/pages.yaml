    ```


    The right-hand column contains contains backend types and complete URIs. You might
    see the following backends:


    +   - parallel Most direct connections are still through the parallel port. The
    port named LPT1 in DOS and Windows is /dev/lp0 on Linux, so the following device
    specification works fine in most cases:


    ```

    parallel:/dev/lp0

    ```


    However, you may want to use the bidirectional capabilities of the port for PostScript
    printers. For example, you may want an accounting program to ask the printer how
