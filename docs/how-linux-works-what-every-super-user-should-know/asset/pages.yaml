    # 3.1.2 How Processes in Runlevels Start


    You are now ready to learn how init starts the system services, just before it

    lets log in. Recall the inittab line from earlier:


    ```

    15:5:wait:/etc/rc.d/rc 5

    ```


    This small line triggers many other programs. rc stands for run commands,

    and you will hear people refer to the commands as scripts, programs, or

    services. So, where are these commands, anyway?

    For level 5, in this example, the commands are probably either in

    /etc/rc.d/rc5 or /etc/rc5.d. Runlevel 1 uses rc1.d, runlevel 2 uses rc2.d,

    and so on. You might find the following items in the rc5.d directory:


    | S10sysklogd | S20ppp | S99ppm |

    | S12kernel | S25netstd_nfs | S99httpd |

    | S15netstd_init | S30netstd_misc | S99rmologin |

    | S18netbase | S45pcmcia | S99sshd |

    | S20acct | S89atd | |

    | S20logout | S89cron |


    The rc 5 command starts programs in this runlevel directory by running the

    following commands:


    ```

    S10sysklogd start

    s12kernel start

    s15netstd_init start

    s18netbase start

    ...

    ...

    S99sshd start

    ```


    Notice the start argument in each command. The 5 in a command name

    means that the command should run in start mode, and the number (00

    through 99) determines where in the sequence rc starts the command.

    The rc*.d commands are usually shell scripts that start programs in /bin

    or /usr/sbin. Normally, you can figure out what one of the commands

    actually does by looking at the script with less or another pager program.

    You can start one of these services by hand. For example, if you want to

    start the httpd Web server program manually, run S99httpd start. Similarly, if

    you ever need to kill one of the services when the machine is on, you can run

    the command in the rc*.d directory with the stop argument (S99httpd stop,

    for instance).'
