- img_proc: true
  md: '# 13.7.3 Amanda Tapes


    Amanda is an automatic backup system that writes a "hybrid" archive on a tape.
    That is, the first 32KB block in an Amanda tape contains information about the
    archive, and the rest of the blocks make up a regular archive in tar or dump format.


    If you come across an Amanda file, do the following to extract the files:


    +   1. Put the first block into bs a file named header:


    ```

    dd if=file of=header bs=32k count=1

    ```


    +   2. Run strings header. The output should look something like this:


    ```

    AMANDA: FILE 20031117 duplex /etc lec lev comp .gz program /bin/tar

    to restore, position tape at start of file and run:

    diff if=<tape> bs=32k skip=1 | /bin/gzip -dc | bin/tar -f... -

    ```


    +   3. Follow the instructions. Extract the contents from the rest of the file
    as follows (if you''re using a tape drive as file, the tape head should already
    be correctly positioned, don''t use skip=1):


    ```

    dd if=file bs=32k skip=1 | unpack_command

    ```


    unpack_command should follow the output you got in step 2. For example, if you''re
    dealing with a tar archive, unpack_command might look like this:


    ```

    gzip -dc | tar xpf -

    ```


    #  13.8 Further Backup Topics


    This chapter covers the basics of manual backups for small systems. However, once
    you get into larger operations, there is much more to explore:


    +   - Automated backups. Amanda (http://www.amanda.org/) is a popular, powerful,
    and free automatic network backup package (that is, after you figure out how it
    works).

    - Tape changers. The Linux mtx command can operate a tape changer and autoloader.

    - Backups with Samba.

    - Commercial backup systems such as BRU.

    - Database backup systems (Oracle and the like).


    A good, comprehensive, and detailed guide to backups (especially for large organizations)
    is Unix Backup and Recovery [Preston].'
