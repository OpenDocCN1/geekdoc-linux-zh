    (PPPoE) through their devices. This is the most common kind of DSL connection,
    and as would have it, it''s the most complicated. See Section 5.9.2 for more information
    on PPPoE.


    +   * DSL with a static IP address Some DSL providers talk straight IP over Ethernet
    if you have a fixed IP address. In this case, you can use the-manual configuration
    described in Section 5.4.


    The preceding rules are based on the hardware available to service providers,
    but your provider may be different. Telephone companies prefer PPPoE because it''s
