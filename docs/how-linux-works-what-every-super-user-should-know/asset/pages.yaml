  md: '# Encap


    Encap abuses symbolic links, but that''s a small price to pay for the features
    you get:


    +   - You can identify everything in /usr/local by package name.

    - You can keep old versions of a software package intact, so you can always downgrade,
    run the old version, and use the old version as a model.

    - It is easy to remove old versions and entire packages.

    - You can easily transport packages to another partition or another machine.

    - Encap requires very little extra configuration.


    The main idea behind Encap is that you encapsulate a package installation before
    making it available in /usr/local. To start, you must have a common installation
    root (most administrators use /usr/local/encap or /opt; this book uses /opt because
    it''s shorter).

    Let''s say that you are installing bogon-3.2.3. Here''s what you would do with
    Encap:


    +   1. Configure, build, and install the package with an installation prefix that
    reflects the package and version. For example, the package uses GNU autoconf,
    so run this command:


    ```

    /configure --prefix=/opt/bogon/bogon-3.2.3

    ```


    +   2. Go to /opt/bogon and make a symbolic link to the install you just made
    from default:


    ```

    cd /opt/bogon

    ln -s /opt/bogon/bogon-3.2.3 default

    ```


    +   3. If there are binary programs in /opt/bogon/default/bin, run this command:


    ```

    ln -s /opt/bogon/default/bin/* /usr/local/bin

    ```


    +   4. If there are binary programs in /opt/bogon/default/sbin, run this command:


    ```

    ln -s /opt/bogon/default/sbin/* /usr/local/sbin

    ```


    +   5. Run the appropriate variant of the following command for each section in
    which there are manual pages (the example works for man section 1):


    ```

    ln -s /opt/bogon/default/man/mani/* /usr/local/man/mani

    ```'
