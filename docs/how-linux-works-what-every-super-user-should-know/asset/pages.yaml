  md: 'NOTE If you have a service that you need to encrypt, the service offers no
    native support, you can try Stunnel (http://www.stunnel.org/), an encryption wrapper
    package like Tcpd, Stunnel is especially good at wrapping itnet services.


    Some servers are chronic targets of attacks because of poor implementation and
    design. You should deactivate the following services if you ever come across them:


    +   - sendmail I would usually rail against a specific program, but Sendmail has
    an exceptionally long history of exploitation. There are two very good alternative
    mail servers, Postfix (http://www.postfix.org/) and qmail (http://www.qmail.org/).

    - ftpd For whatever reason, all FTP servers seem plagued with vulnerabilities.
    In addition, most FTP servers use clear-text passwords. If you have to move files
    from one machine to another, consider an SSH-based solution or rsync server.

    - telnet, rlogin, rexec All of these pass remote session data (including passwords)
    in clear-text form. Avoid these unless you happen to have a Kerberos-enabled version.

    - fingerd Intruders can get user lists and other information with the finger service.


    # 6.7.3 Port Scanning


    Listing your open ports and firewall configuration with netstat and iptables is
    a good start for staying on top of unwanted traffic, but you may want to go a
    step further with Nmap (Network Mapper), a program that scans all of the ports
    on a machine or network of machines, looking for potential vulnerabilities. Nmap
    gives you a view from the outside and eliminates guessing which ports are open.
    Most intruders use Nmap, and you can get it at http://www.insecure.org/


    WARNING If someone else the network that you want to Nmap (or run Nmap from),
    ask if that person is all right that you do so. Network administrators watch for
    port scans and delight in stomping on any machine that runs a scan.


    Just run nmap host to run a generic scan on the host. Here''s an example:


    ```

    Starting nmap 3.30 ( http://www.insecure.org/nmap/ ) at 2003-08-04 16:25:20 PDT
    Interesting ports on host (10.1.2.2):

    Port State Service

    |9/tcp open discard

    |13/tcp open daytime

    |22/tcp open ssh

    |37/tcp open time

    |111/tcp open sunrpc

    ```


