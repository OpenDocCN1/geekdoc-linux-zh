- img_proc: true
  md: '# Block Devices


    The **Block devices** section of the kernel configuration contains miscellaneous
    random-access storage devices, such as floppy disks and RAM disks. These devices
    normally hold filesystems that you directly attach to your current system with
    the mount command. The interesting drivers here include the following:


    +   * **Normal floppy disk support** A driver for the PC floppy disk drive.

    * **Loopback device support** A simple driver that maps a file into a block device.
    This driver is very useful because it allows you to mount a filesystem on a disk
    image.

    * **Network block device support** A driver that allows you to use a network server
    as a block device.

    * **RAM disk support** A driver that designates a chunk of physical memory as
    disk space.

    * **Initial RAM disk (initrd) support** A driver that provides a special kind
    of RAM disk that a boot loader gives to the kernel as the initial / partition
    during the very first stages of init. Many distributions use an initial RAM disk
    for SCSI drivers and other modules that may not be in their kernels.

    * **Parallel port IDE device support** A driver for certain older portable disk
    devices.


    # ATA (IDE) Support


    You should always compile ATA (IDE) support directly into your kernel unless you
    know exactly what you''re doing. There are several kinds of IDE drivers that you
    can enable:


    +   * **Disk support** A driver required if you want hard drives to work. Needless
    say, you should compile this driver directly into the kernel.

    * **CD-ROM support** A driver for ATAPI CD-ROM and DVD-ROM drives.

    * **Floppy support** A driver for various removable-media drives with ATAPI interface.

    * **SCSI emulation** A driver for ATAPI CD-R and CD-RW drives. Older Linux CD-burning
    software worked exclusively with SCSI drivers; if your CD-burning software is
    up to date, you do not need this driver.

    * **Various chipsets** Drivers for various specific chipsets. If your motherboard''s
    IDE chipset is listed, you might be able to squeeze out a little more performance
    with one of these drivers.


    # SCSI Support


    Even if you have no SCSI devices, you may still need SCSI support because many
    Linux device drivers work through emulated SCSI devices. For example, if you want
    to use USB mass storage, you need SCSI disk support.'
