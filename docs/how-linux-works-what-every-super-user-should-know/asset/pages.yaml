    # 13.6.2 Creating Archives on a Tape


    It is difficult to understand how a tape drive works by running through various
    files on a random tape in a collection of backups. Therefore, to explain the process
    of searching through a tape, this section shows you how to create some archives
    for yourself before going into the specifics of unarchiving. Once you have learned
    this, you will be able to play with a tape without significant confusion or worrying
    about losing data.


    Here is a procedure for creating three files on a tape — specifically, tar archives
    of /lib, /boot, and /dev:


    +   - Put a new tape in your drive (a blank tape, or one that you don''t care
    about).

    - Make sure that your TAPE environment variable is set to the no-rewind tape device.

    - Run mt status to verify that the tape is in the drive and your TAPE variable
