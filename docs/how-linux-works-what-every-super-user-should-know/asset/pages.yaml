  md: '# 16.3.2 The tcsh Shell


    The standard csh on virtually all Linux systems is tcsh, an enhanced c shell that
    polarized features such as command-line editing and multi-mode filename and command
    completion. Even if you don''t use csh (this book suggests bash), you should still
    provide tcsh startup files in case your users happen to come across tcsh.


    You don''t have to worry about the difference between login shells and non-login
    shells in tcsh. Upon startup, tcsh looks for a .tcshrc file. Failing this, it
    looks for the csh shell''s .csh startup file. The reason for this order is that
    you can use the .tcshrc file for tcsh extensions that don''t work in csh. You
    should probably stick to using the traditional .csh instead of .tcshrc; it''s
    highly unlikely that anyone will ever use your startup files with csh. And if
    a user actually does come across csh on some other system, your .cshrc will work
    adequately.


    Here is sample .cshrc file:


    ```

    # Command path

    setenv PATH /usr/local/usr/bin:/bin:/usr/X11R6/bin:$HOME/bin


    # Manual page path.

    setenv MANPATH /usr/local/man:/usr/man:/usr/X11R6/man:$HOME/man


    # EDITOR and VISUAL determine the editor that programs such as le

    # and mail clients invoke when asked to edit a file.

    setenv EDITOR vi

    setenv VISUAL vi


    # PAGER is the default text file viewer for programs such as man.

    setenv PAGER less


    # These are some handy options for less.

    setenv LESS meI


    # By default, give other users read-only access to most new files.

    umask 022


    # Customize the prompt.

    # Substitutions include:

    # %n username %m hostname %/ current directory

    # %h history number %l current terminal %% %%

    set prompt="%m%% %# "

    ```'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# 16.4 Default User Settings


    The best way to write startup files and choose defaults for new users is to experiment
    with a new test user on the system. Create the test user with an empty directory.
    Then, most importantly, refrain from copying your own startup files to the user''s
    directory. Write the new startup files from scratch.


    When you think you have a working shell, log in as the new test user in all possible
    ways (on the console, remotely, and so on). Make sure that you test as many things
    as possible, including windowing system operation and manual pages. After you''re
    happy with the test user, create a second test user, copying the startup files
    from the first test user. If everything still works fine, you now have a new set
    of startup files that you can distribute to new users.


    The following sections outline reasonable defaults for new users.


    # 16.4.1 Shell


    The default shell for any new user on a Linux system should be bash. In the old
    days, the Bourne shell (sh) was more difficult to use in interactive mode than
    alternatives as the C shell (csh), so users typically had a login shell that was
    different than the standard system shell. This changed when bash arrived on the
    scene, for it had all of the features of csh and its enhanced version (tcsh).


    There are several good reasons for using bash on a Linux system:


    +   - Users interact with the same shell that they use to write shell scripts
    (csh is a notoriously bad scripting tool; please, don''t even think about it).

    - bash is standard on Linux systems; tsh is sometimes not.

    - bash uses GNU readline, and therefore, its interface is identical to many other
    tools. tsh has a powerful command-line editing system, but it takes some time
    to learn.

    - bash gives you finer control over I/O redirection and file handles.


    However, you can''t teach an old dog new tricks, and many Unix Environments use
    csh and tsh simply because they can''t be bothered to switch. Of course, you can
    choose any shell you like, but my opinion is that you should choose bash if you
    don''t have any preference, and you should also use bash as the default shell
    for any new user on the system (if they have any other preference, they will be
    able to change their own shell with the csh command).


    NOTE There are plenty of other shells out there (rc, csh, zsh, and so on). But
    just because they exist does not mean they are suitable beginner shells.'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# 16.4.2 Editor


    The default editor should be vi or emacs. These are the only editors guaranteed
    to exist on nearly any Unix system, and they will therefore guarantee the least
    trouble in the long run for a new user.


    As shell startup files, avoid large default editor startup files. A little showmatch
    in your .xrc startup file will never hurt anyone, but steer clear of anything
    that significantly changes the editor''s behavior or appearance, such as the showmode
    feature, autoindentation, and wrap margins.


    # 16.4.3 Pager


    It is perfectly reasonable to set the default PAGER environment variable to less,
    because it is very easy to use.


    # 16.5 Startup File Pitfalls


    There are a few things you really should avoid in startup files (many have to
    do with the X Window System):


    +   - Don''t put X commands in a shell startup file.

    - Don''t set the DISPLAY environment variable in a shell startup file.

    - Don''t set the terminal type in a shell startup file.

    - Don''t skip on descriptive comments in default startup files.

    - Don''t run commands in a startup file that print to the standard output.

    - Never set LD_LIBRARY_PATH in a shell startup file (see Section 8.1.4).


    # 16.6 Further Startup Topics


    Because this book deals only with the underlying Linux system, this chapter does
    not cover windowing environment startup files. This is a large issue indeed, because
    the display manager that logs you into a modern Linux system has its own set of
    startup files, such as .xsession, .initrc, and the endless mess of GNOME and KDE-related
    items.


    The winding choices may seem bewildering, and this isn''t far from the truth,
    because there isn''t even one common way to start a windowing environment in Unix.
    However, once you determine what your system does, you may get a little carried
    away with the files that relate to your graphical environment. This is fine, but
    don''t carry it over to new users. The same tenet of keeping things simple in
    shell startup files works wonders for GUI startup files too.'
  merge: -1
  pgno: 331
