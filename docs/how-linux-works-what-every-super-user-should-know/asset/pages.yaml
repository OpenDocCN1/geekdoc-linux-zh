    are the bus, target, and LUN numbers. You can see that the SCSI bus is 0, the
    target of the burner (a Plexor drive) is 5, and the LUN is 0. Therefore, the device
    you need to know is 0,5.0. Most burner devices do not have multiple units, so
    you abbreviate the device to 0,5.


    If you know the SCSI /dev/sg* device name of your CD-ROM, you can use that in
    place of the three-part numeric identifier. For messages like the following in
    your kernel logs to identify the generic device name. In this example, the device
    is /dev/sg1:


    ```

    Vendor: PLEXTOR Model: CD-R PX-R412C Rev: 1.04

    Type: CD-ROM ANSI SCSI revision: 02

    sro: scsi13-mmc drive/12x/12x writer cd/rw xa/form2 cdda caddy

    Attached scsi CD-ROM sr0 at scsi10, channel 0, id 5, lun 0

    Attached scsi generic sg1 at scsi10, channel 0, id 5, lun 0, type 5

    ```


    # 11.2.2 Creating a Filesystem Image and Writing a CD


    To burn a CD, you need to create a new image of the filesystem to burn, write
    that image to the CD writer. You can do this either with a temporary disk image
    file or in a pipeline.


    # Using Temporary Disk Image


    ISO9660 is the original standard CD-ROM filesystem format that most CD-ROMs use.


    To create an ISO9660 filesystem image from a directory on a Linux system, use
    like this:


    ```

    mkisofs -r - image.iso directory

    ```


    The -r option enables the Rock Ridge extensions that transform the stark ISO9660
    filesystem into one that looks more like a Unix filesystem. You should use this
    for any CD-ROM that you intend for use on Unix systems. (For Microsoft systems,
    you may want to consider -j for the Joliet extensions.)'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'You can write an image to the burner with cdrecord:


    ```

    cdrecord -v dev=device speed=speed image.iso

    ```


    You can test a cdrecord command with the -dummy argument; this performs a recording
    with the burning laser off.


    Before writing an image to a CD, you may also wish to test it with the loopback
    device (just remember to unmount it when finished!)


    ```

    mount -r t iso9660 -loop=/dev/loop0 image.iso /mnt

    ```


    # Using a Pipeline


    If you don''t want to create a temporary image file, you can attempt to create
    the filesystem and write to the CD device in one pipeline:


    ```

    mkisofs -r directory -v dev=device speed=speed -

    ```


    The only problem you may encounter with this is a buffer underrun, where mkisofs
    can''t produce data quickly enough for cdrecord to consume. If you run into a
    problem like this, one possible remedy is to lower speed, or you can see if there
    are any other processes on system that are hogging the CPU.


    # 11.3 Introduction to USB


    Linux supports a wide variety of USB (universal serial bus) devices. A USB system
    on a PC consists of a host controller inside your computer, hubs that act as splitters
    to give you more ports, and the actual USB devices. The Linux kernel supports
    USB devices through three types of drivers:


    +   - Host interface drivers

    - USB device drivers

    - Other drivers not necessarily related to USB, but required by a USB device driver
    (for example, the USB mass storage device requires the SCSI disk support driver)


    When the host interface driver recognizes a controller, the kernel logs messages
    such as these:


    ```

    ohci_hcd: 2003 Oct 13 USB 1.1 ''Open'' Host Controller (OHCI) Driver (PCI)

    ohci_hcd 0000:00:02.0: irq 9, pci mem d4b806000

    ohci_hcd 0000:00:02.0: new USB USB bus registered, assigned bus number 1

    hub 1-0:1.0: USB hub found

    ```


    Notice that the controller has an integrated hub with two ports. Plugging in external
    hubs yields kernel messages like the following:'
  merge: -1
  pgno: 250
- img_proc: true
  md: '```

    hub-1:0:1.0: new device on port 2, assigned address 3

    hub-1:2:1.0: USB hub found

    hub-1:2:1.0: 4 ports detected

    ```


    **NOTE** Don''t be surprised if you see hub-related log messages when plugging
    in a USB device, even if the device is not a hub. Some of these devices contain
    hubs.


    When you plug in a USB device, the kernel asks the various device drivers if they
    know how to talk to the device. If a driver recognizes the device, it can claim
    the device and take over its management.


    # 11.3.1 USB Device Filesystem and Utilities


    When you use the`usbdevfs` filesystem mounted at `/proc/bus/usb` on your system,
    you can take a look around this directory to see the details of the devices that
    are connected to your system. However, you can also get a short summary with the
    lsusb command from the usbitools package:


    ```

    Bus 001 Device 005: ID 054c:002d Sony Corp. MSAC-US1 MemoryStick Reader

    Bus 001 Device 003: ID 0451:20466 Texas Instruments TUSB2046 Hub

    Bus 001 Device 002: ID 046d:c00c Logitech Inc. Optical Wheel Mouse

    Bus 001 Device 001: ID 0000:0000 Virtual Hub

    ```


    If you want to see the gory details of all your devices, run lsusb -v. Be warned,
    that this prints an extremely verbose listing.


    # 11.3.2 USB Input Devices


    Basic keyboard and mouse support is not complicated. To use these devices on your
    system, you need the USB human input device (HID) driver in your kernel. The relevant
    kernel log message looks like this:


    ```

    drivers/usb/input/hid-core.c: v2.0:USB HID core driver

    ```


    With this in, any USB keyboard you plug into your computer should work with no
    further configuration. Here is the message that the kernel logs when you plug
    in an old Apple keyboard:


    ```

    input: USB HID v1.00 Keyboard [Aips Electric Apple USB Keyboard] on

    usb-0000:00:02.0-2.1

    ```


    USB mice aren''t much more difficult to configure; the only thing you need to
    do is tell the X server (look at /etc/X11/XF86Config file and grep for gm in your
    init.d directory). The kernel maps all mice to /dev/input/mice, using the PS/2
    mouse driver. The kernel message that results from the hookup of a new mouse looks
    like this:


    ```

    input: USB HID v1.10 Mouse [Logitech USB Optical Mouse] on usb-0000:00:02.0-1

    ```'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# 11.3.3 USB Digital Cameras, External Flash Media, and External Disks


    Linux accesses external USB storage devices, including flash memory, in blocks,
    presenting the storage as a SCSI device. Therefore, you need the following drivers
    in your kernel if you would like to use such a device:


    +   - SCSI disk support, compiled directly into your kernel or as the sd_mod kernel
    module

    - USB interface driver (see Section 11.3)

    - USB mass storage support, compiled directly into your kernel or as the usb-storage
    module


    Assuming that you have all of the drivers in place, you should see a kernel log
    message proclaiming that there is a new SCSI bus when you plug in a flash media
    card device or external mass storage device:


    ```

    scsii : SCSI emulation for USB Mass Storage devices

    Vendor: Sony MSAC-US1 Rev: 1.00

    Type: Direct-Access ANSI SCSI revision: 02

    scsi device sda: 15840 512-byte sectors (8 MB)

    da: Write Protect is off

    da: Mode Sense: 00 06 00 00

    da: assuming drive cache: write through

    sda: sda1

    ```


    Attached scsi removable disk sda at scsii, channel 0, id 0, lun 0

    Attached scsi generic sg2 at scsii, channel 0, id 0, lun 0, type 0


    Upon disconnecting the device, you will see a message like this:


    ```

    usb 1-2.1: usb disconnect, address 4

    ```


    Seeing the new SCSI bus in the kernel log does not necessarily mean that you have
    access to the attached USB device. If your system does not have hotplug support,
    you may need to run a script called rescan-scsi-bus.sh to get the kernel to recognize
    the new device. You can verify the geometry, partitions, and filesystems on the
    storage device with an fdisk command such as:


    ```

    fdisk -l /dev/sda

    ```


    # Flash Memory Filesystem Issues


    The flash memory in most digital cameras contains an MS-DOS filesystem that you
    can easily mount when you see the device in the kernel logs.


    WARNING You may wish to mount the filesystem in read-only mode, because it is
    too easy to remove flash media cards and devices before unmounting the filesystem.
    If you alter the filesystem, then remove the card before flushing the changes
    to the physical media with an unmount operation, you risk data corruption.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 11.4 IEEE 1394/FireWire Disks


    IEEE 1394 (also known as FireWire) drivers are relatively new to Linux. The Linux
    1394 driver system is similar to that of the USB system, and the Linux kernel
    support for IEEE 1394 includes the base module (ieee1394) and host interface drivers.
    One interface is OHCI-1394 (which has a module name of ohci1394), and the TI PCilynx
    interface also has a driver (pcilynx).


    Kernel messages like following indicate that the host interface driver detected
    the hardware:


    ```

    ohci1394:0: OHCI-1394 1.1 (PCI): IRQ:[26] MMIO:[906000-90067ff] Max Packet:[2048]

    ieee1394: Host ID:BUS[0-00:10223] GUID[0001800b200005cb4]

    ```


    IEEE 1394 hard disks use SBP-2 (Serial Bus Protocol). As in the USB mass storage
    code, the Linux sbp2 driver masquerades as a SCSI host controller. When you plug
    in a device, look for these kernel messages:


    ```

    scsi30: SCSI emulation for IEEE-1394 SBP-2 Devices

    ieee1394: sbp2: Logged into sbp-2 device

    ieee1394: sbp2: Node 0-02:1023: Max speed [S400] [2048]

    ieee1394: Node ID: BUS[0-02:1023] GUID[0009a50000017996

    ```


    If your system does not have hotplug support (see Section 11.5), you may need
    to probe the SCSI bus with the rescan-scsi-bus.sh script described earlier to
    get the kernel to recognize the IEEE 1394 device. Upon recognizing the device,
    the kernel emits the usual SCSI messages:


    | Vendor: WDC | Model: FireWire/USB2.0 Rev: 4.17 |

    | Type: Direct-Access ANSI SCSI revision: 06 |

    | blk: queue fffcc00195b428, no 0 I/O memory limit |

    | Attached scsi disk at scsi, channel 0, id 0, lun 0 |

    | scsi device: 234441648 512-byte hwd sectors (120034 MB) |

    | sda: sda1 sda2 |


    > The Apple iPod is an SBP-2 device. To access the disk and its filesystem, you
    need appropriate filesystem support and possibly also the appropriate partition
    table support in your kernel. The PC version of the iPod uses the FAT32 filesystem,
    so you can use the vfat filesystem. The Macintosh version uses a completely different
    partition map in your kernel, as well as Macintosh filesystem (HFS) support as
    a module or compiled directly into the kernel.


    # 11.5 Hotplug Support


    Now we''ve covered Linux USB and IEEE 1394 support, you should learn a little
    about Linux hotplug support, a system that can handle the automatic configuration
    and cleanup of devices when you plug them into the system.'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'The idea is simple; the kernel runs /sbin/hotplug when you plug in a device.
    Here''s the procedure:


    +   1. You plug in a device. The kernel notices.

    2. The kernel runs /sbin/hotplug, where type is the device type (usb ieee1394,
    scsi, and so on). The kernel sets a number of device-related environment variables
    in the new hotplug process.

    3. The /etc/hotplug script runs /etc/hotplug/type.agent.

    4. The /etc/hotplug/type.agent script tries to configure the device.


    There really isn''t much more to it than this. Each device type''s .agent file
    has its own method of configuring devices. For example, usb.agent goes through
    these steps:


    +   1. usb.agent looks in /etc/hotplug/usb.distmap and /etc/hotplug/usb.umap to
    locate a kernel module for the devices.

    2. Having identified a module, usb.agent attempts to load the module.

    3. If /etc/hotplug/usb/type exists, usb.agent runs program.


    Linux hotplug is almost entirely script-driven, which means that the details are
    even more subject to change than the rest of Linux. However, keep in mind that
    if you ever have problems or questions you can always read the hotplug scripts
    to determine what they are trying to do, even if the documentation is inadequate
    or out of date.


    # 11.6 PC Cards (PCMCIA)


    PCMCIA support is highly dependent on kernel versions. If you upgrade your kernel,
    you almost nearly need to upgrade your PCMCIA drivers and tools.


    Although some of the core PCMCIA drivers are in the main Linux kernel distribution,
    you will need the pcmia-cs package for additional drivers and system utilities.
    The components of the PCMCIA system include the following:


    +   * Kernel modules for PC Card interface controllers and individual PC Cards.
    These modules go in /lib/modules/version/pcmia.

    * The /sbin/pccardm daemon for managing configuration when you insert or remove
    a card.

    * Various support utilities and services, located in /etc/pcmia and /sbin.


    There are too many pieces of the system to set up and configure by hand, so the
    pcm-cs package provides several scripts to get you on your way. The most important
    of these is an init.d script pcmia, which depending on your distribution, you
    may need to modify a few lines to specify which PCMCIA interface controller chipset
    you have. Look at this section:'
