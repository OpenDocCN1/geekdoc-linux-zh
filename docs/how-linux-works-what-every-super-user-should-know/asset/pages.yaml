    # 5.8.1 Testing Your Serial Port and Modem


    Before you start with the full ppp setup, you should use minicom to make sure
    that your modem works and that you can initiate a PPP connection. Modems talk
    to your computer through serial port devices, the first thing you need to do is
    determine the serial port that your modem is connected to.


    > Don''t try to use a Winem with Linux. See Section 17.2.4.


    As mentioned in Section 2.3.2, Linux serial port devices are at `/dev/tty5`. If
    you''re having problems, it''s best to check your boot messages as described in
    Section 4.1 if the modem setup looks right and to verify that you''re using the
    correct serial port device. In addition, you can run `/proc/ioports` for more
    statistics. Most modern hardware and kernels actually recognize the hardware configuration
    correctly, but if you have extra serial ports on different hardware interrupt
    numbers (IRQs), you may need to run setserial to specify the hardware parameters
    that the serial port uses. For example:


    ```

    setserial /dev/ttyS3 irq 5

    ```


    See the setserial(8) manual page for more options and a good overall explanation
    of serial ports.

    Now you can get down to the business of checking the connection to the dial-up
    server with these steps:


    +   1. Configure the baud rate, serial port, and other minicom settings with this
    command:


    minicom -s

    n2. After choosing your settings, exit the configuration menu. minicom then attempts
    to connect to the serial port.

    3. Upon success, you should be able to enter AT commands. Test it by typing AT
    and then pressing ENTER. You should get OK as a response. If you''re having trouble,
    skip to step 7 and then back to step 1.'
