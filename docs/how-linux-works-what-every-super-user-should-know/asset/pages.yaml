- img_proc: true
  md: 'In the bad old days, there was one central hosts file that everyone repeatedly
    copied to their own machine to stay up to date. This might have worked for a handful
    of machines, but as the ARPANET/Internet grew, this quickly got out of hand. The
    Domain Name System (DNS) decentralized resolution. The idea is that your machine''s
    resolver (in the C library) asks a nameserver for the IP address corresponding
    to a hostname. If the nameserver does not know, it can find out who is responsible
    for that name and ask for the IP address from the responsible party''s nameserver.
    If you do not already know the DNS server addresses that your ISP use, ask your
    provider for them.


    Let''s say your ISP''s nameserver addresses are 10.32.45.23 and 10.3.2.3. Put
    the servers in your system /etc/resolv.conf file like this:


    ```

    search mydomain.com example.com

    nameserver 10.32.45.23

    nameserver 10.3.2.3

    ```


    The search line in the preceding example asks the resolver to look for the IP
    address of host.mydomain.example.com, and for host.example.com if you ask for
    an incomplete domain name host does not resolve on the first attempt.


    For a simple network configuration where you do not have control of your own nameserver,
    there is little to know about DNS except to make sure that your machine''s hostname
    resolution works. To verify this, type host_name where known_name is some Internet
    name that you know (such as with www.example.com). The output should be something
    like this:


    ```

    known_name has address 10.218.44.5

    ```


    You should also be able to look up a name based on its IP address with host address.
    If the address owner is doing their part, you DNS administrators often do not
    configure their servers to return these hostnames. Furthermore, the mapping of
    hostname to address is not one-to-one; you can have many hostnames for a single
    address.


    Before moving on, take a look at /etc/nsswitch.conf. It should have a line like
    this:


    ```

    hosts: files dns

    ```


    Putting files ahead of dns ensures that your system checks the /etc/hosts file
    for the hostname of your requested IP address before asking the DNS server. This
    is usually a good idea (especially for looking up localhost), but your /etc/hosts
    file should be as short as possible. Don''t put anything in there because you
    want to boost performance; it will burn you later.'
