    # 4.1 System Logging


    Most system programs write their diagnostic output to the syslog service. The
    syslog daemon waits for messages, and depending on the type of message received,
    funnels the output to a file, the screen, users, some combination of these, or
    just ignores it. The system logger is one of the most important parts of the system.
    When something goes wrong and you don''t know where to start, you should check
    the system log files first. There is a sample log message:


    Aug 19 17:59:48 sshd[484]: Server listening on 0.0.0.0 port 22


    Most Linux distributions use the /var/log to store log files, you can find out
    for sure by looking at /etc/syslog.conf, the syslog configuration file. It contains
    lines like:


    ```

    kern.*                 /dev/console

    *.info;authpriv.none    /var/log/messages

    authpriv.*             /var/log/secure,root

    mail.*                  /var/log/maillog

    cron.*                   /var/log/cron

    *emerg                 *

    local7.*               /var/log/boot.log

    ```


    The type of information to be logged is on the left, and the place where it is
    logged to on the right. Most of the logs in this example are normal files, but
    there are some exceptions: /dev/console is a special device for the system console,
    root means to send a message to the superuser if user is logged in, and * means
    to send a message to all users currently on the system. You can also send messages
    to another host with @.


    Log messages carry a facility and a priority. The facility is a general category
    of message (Check the syslog.conf(5) manual page for a current list of all facilities).
    Most are fairly obvious from their name (mail, for example). mail, authpriv, cron,
    and local7 facilities. In line 6, * is a wildcard that catches out related to
    all facilities.


    In the syslog.conf file, the priority follows the dot (.) after the facility.
    The priority may be one of debug, info, notice, warning, err, crit, alert, or
    emerg. This is the order of the priorities, with emerg being the highest.


    NOTE


    You can exclude log messages from a facility in syslog.conf by specifying a priority
    of none, as shown on line 2 of the preceding example.'
