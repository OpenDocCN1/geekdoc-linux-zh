  md: 'To unmount (detach) a filesystem, use the unmount command:


    umount mountpoint


    See Section 2.4.6 for a few more options.


    # 2.4.4 Filesystem Buffering


    Linux, like other versions of Unix, buffers (caches) all requested changes to
    filesystems in memory before actually writing the changes to the disk. This cache
    system is transparent to the user and improves performance because the kernel
    can perform a large collection of file writes at once instead of performing the
    changes on demand.


    When you unmount a filesystem with unmount, the kernel automatically synchronizes
    with the disk. At any other time, you can force the kernel to write the changes
    in its buffer by running the sync command. If (for whatever reason) you can''t
    unmount a filesystem before you turn off the system, make sure that you run sync
    first.


    # 2.4.5 Filesystem Mount Options


    There are many ways to change the mount command behavior. This is often necessary
    with removable media or when performing system maintenance.


    The total number of mount options is staggering. The very extensive mount(8) manual
    page is a good reference, but it''s hard to know where to start and what you can
    safely ignore.


    Options fall into two rough categories: general options and filesystem-specific
    options. General options include -t for specifying the filesystem type, which
    was mentioned earlier. By contrast, a filesystem-specific option pertains only
    to certain filesystem types. To activate a filesystem option, use the -o switch
    followed by the option. For example, -o norck turns off Rock Ridge extensions
    on an ISO9660 filesystem, but it has no meaning for any other kind of filesystem.


    # Short Options


    The most important general options are the following:


    +   -r The -r option mounts the filesystem in read-only mode. This has a number
    of uses, from write protection to bootstrapping. You don''t need to specify this
    option when accessing a read-only device such as a CD-ROM; the system will do
    it for you (and will also tell you about the read-only status).


    +   -n The -n option ensures that mount does not try to update the system mount
    database, /etc/mtab. The mount operation fails when it cannot write to this file.
    This is important at boot time, because the root partition (and therefore, the
    system mount database) are read-only at first.'
