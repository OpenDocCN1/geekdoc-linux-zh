  md: 'To get this detailed logging, the logLevel parameter in your cupsd.conf must
    be a minimum of info. However, info does not log the initial file type; you need
    to set the parameter to debug in order to log this additional information.


    In the log, you can see some filters running, and from the names of the filters,
    you know that CUPS has some sort of idea about the job''s file type. Unfortunately,
    the actual workings of the conversion mechanism aren''t terribly obvious from
    the log file output. Here''s the sequence:


    +   1. CUPS determines the output format that the backend needs to send to the
    printer by looking at the PPD file.

    2. CUPS determines the input file type with the help of /etc/cups/mime.types.
    In the preceding example log output, the application/postscript rule in /etc/cups/mime.types
    matched.

    3. CUPS looks through the /etc/cups/mime.convs file for a suitable filter to perform
    the conversion between the input file format and the format that the backend needs.
    Consider this line from mime.convs that transforms plain-text files to PostScript
    output:


    | text/plain | application/postscript | 33 | texttops |


    The four columns here are the MIME type, the output MIME type, the estimated cost,
    and the name of the filter program that converts the input to the output.


    4. CUPS runs the filter or filter sequence required for the printer backend. If
    there are no suitable entries in mime.convs, CUPS logs this message:


    ```

    Unable to convert file o to printable format for job n

    ```


    +   5. CUPS runs any necessary additional filter before handling the final output
    to the backend (see the next section).


    # Specifying a Backend Filter in the PPD File


    Just before sending the job to the printer backend, CUPS may run a backend filter
    from the PPD file.

    Backend filters are set with the cupsFilter parameter in the PPD file. Here is
    an example from the PPD file that you saw earlier:


    ```

    *cupsFilter: "application/vnd.cups-postscript foomatic-rip"

    ```


    As you see, the cupsFilter parameter''s value consists of three parts:


    +   1. An expected MIME type. In the preceding example, the type is PostScript.
    The default is vnd.cups-postscript.

    2. The relative cost of the filter (set this to 0).

    3. The filter''s executable name.'
