  md: '# 14


    # SHARING FILES WITH SAMBA


    Your Linux machine probably doesn''t live alone on your network. If you have a
    PC running Windows, it''s only natural that you would want to permit access to
    your Linux system''s files and printers from those Windows machines with the standard
    Windows network protocol, SMB (Server Message Block). Mac OS X also supports SMB
    filesharing.


    The standard filesharing software suite for Unix is called Samba. Not only does
    Samba allow your network''s Windows computers to get to your Linux system, but
    it works the other way around — you can print and access files on Windows servers
    from your Linux machine with the included client software.


    To set up a Samba server, you need to perform these steps:


    +   1. Create an smb.conf file.


    +   2. Add filesharing share sections to smb.conf.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '3. Add printer share sections to smb.conf.

    4. Start the Samba daemons: nmbd and smbd.


    A share is a resource that you offer to a client, such as a directory, limited
    to printer.

    The discussion of Samba in this chapter is concise, limited to getting Windows
    machines on a single subnet to see a stand-alone Linux machine through the Windows
    Network Neighborhood browser. There are countless ways to configure Samba, because
    there are many possibilities for access control and network topology. For the
    gory details on how to configure a large-scale server, you will find How Samba
    Works [Lendecke] a much more extensive guide, and there is also information at
    the Samba Web site, http://www.samba.org/


    # 14.1 Configuring the Server


    The central Samba configuration file is smb.conf, and it is usually located in
    Samba''s lib directory (for example, /usr/local/lib). However, some distributions
    put the configuration file in an etc directory, such as /etc/samba or /usr/local/etc.
    The smb.conf file breaks down into several sections denoted with square brackets
    (such as [global] and [printers]).nThe [global] section in smb.conf contains general
    options that apply to the entire server and all shares. These options pertain
    primarily to network configuration and access control. Here is a sample [global]
    section that shows you how to set the server name, description, and workgroup:


    ```

    [global]

    # server name

    netbios name = name


    # server description

    server string = My server via Samba


    # workgroup

    workgroup = MYNETWORK

    ```


    These parameters work as follows:


    +   netbios name The server name. If you omit this parameter, Samba uses the Unix
    hostname.

    server string A short description of the server. The default is the Samba version
    number.

    workgroup The SMB workgroup name. If you''re on a Windows NT domain, set this
    parameter to the name of your domain.'
  merge: -1
  pgno: 305
- img_proc: true
  md: '#  14.1.1 Server Access Control


    There are a few options you can add to your smb.conf file to put limits on the
    machines and users that can access your Samba server. The following list includes
    many options that you can set in your [global] section, as well as in the other
    sections that control individual shares (described later in the chapter):


    Set this to have Samba listen on the given networks or interfaces. Here are two
    examples:


    ```

    interfaces = 10.23.2.0/255.255.255.0

    interfaces = eth0

    ```


    bind interfaces Set this to yes when using the interfaces parameter in order to
    limit access to machines that you can reach on those interfaces.


    valid users Set this to allow the given users access. For example:


    ```

    valid users = jruser, bill

    ```


    guest ok Set this parameter to true if you would like a share to be available
    to anonymous users on the network.


    guest only Set this parameter to true to allow anonymous access only.

    browse Set this to make shares available in Samba''s browseable share list. If
    you set this parameter to no for any or all shares, you will still be able to
    access shares on the Samba server, but they will not be browseable, and therefore
    you will need to know their exact names.


    #  14.1.2 Passwords


    In general, you only want to allow access to your Samba server with password authentication.
    Unfortunately, the basic password system on Unix is different than that on Windows,
    so unless you specify clear-text network passwords or authenticate passwords with
    a Windows server, you must set up an alternative password file. This section shows
    you how.


    Assuming that your Samba configuration directory is /etc/samba, you can use these
    entries in your [global] section to define the Samba password file as /etc/samba/passwd_smb:


    ```

    # use a separate password file for Samba to enable encrypted passwords

    security = user

    encrypt passwords = yes

    smb passwd file = /etc/samba/passwd_smb

    ```'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'With these lines in place, you can manipulate the passwd_smb password file
    with the smbpasswd program.


    **NOTE** If you have access to a Windows NT domain, you can set security = domain,
    to make Samba the domain''s usernames and eliminate the need for an SMB password
    file. However, in order for domain users to access the machine running Samba,
    each domain user must have a local account with the same username on the machine
    running Samba.


    # Adding and Deleting Users


    The first thing you need to do in order to give a Windows user access to your
    Samba server is to add the user to the passwd_smb file with the smbpasswd -a command:


    ```

    smbpasswd -a username

    ```


    The username parameter to the smbpasswd command must be a valid username on your
    Linux system.


    Much like the regular system''s passwd program would, smbpasswd asks you to enter
    the new user''s password twice. If the Samba password file does not exist, smbpasswd
    creates it for you, then confirms that it has created the new user.


    To remove a user, use the -x option to smbpasswd:


    ```

    smbpasswd -x username

    ```


    At times, you may not necessarily want to delete a user, but rather, temporarily
    deactivate the user. The -d option disables a user; and -e re-enables the user:


    ```

    smbpasswd -d username

    smbpasswd -e username

    ```


    # Changing Passwords


    You can change a Samba password as the superuser by using smbpasswd with no options
    or keywords other than the username:


    ```

    smbpasswd username

    ```


    However, if the Samba server is running, any user can change their own Samba password
    by entering smbpasswd by itself on the command line.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# 14.2 Starting the Server


    After you add a user and a password, you should probably test your server. To
    start the server, you need to run nmbd and smbd with the following arguments,
    where `smb_config_file` is the full path of your smb.conf file:


    ```

    nmbd -D -s smbd_config_file

    smbd -D -s smbd_config_file

    ```


    The nmbd daemon is a NetBIOS name server, and smbd does the actual work of handling
    share requests. The -D option specifies daemon mode. If you alter the smb.conf
    file while smbd is running, notify the daemon of the changes with a HUP signal.


    # 14.3 Diagnostics and Log Files


    If something goes wrong starting one of the Samba servers, an error message appears
    on the command line. However, runtime diagnostic messages go to the log.nmbd and
    log.smbd files.


    These files are usually in a var directory, but you can change the location to
    dir by specifying the -1 dir option to smbd and nmbd. However, if you want to
    override the log directory location (to /var/log, for example), it''s usually
    better to change the log file directory and log filename once with the log file
    parameter in smb.conf. You can force the log output from smbd to a file with this
    in the [global] section of smb.conf:


    ```

    log file = /var/log/smbd.log

    ```


    Unfortunately, this does not set the nmbd log directory; if you want the log output
    from both daemons to the same file, you must still use nmbd -1 /var/log/smbd.log.


    # 14.4 Sharing Files


    To export a directory to SMB clients (that is, to share a directory with a client),
    add a section like this to your smb.conf file, where `label` is what you would
    like to call the share, and `path` is the full directory path:


    ```

    [label]

    path = path

    comment = share description

    guest = no

    writable = yes

    printable = no

    ```'
  merge: -1
  pgno: 308
- img_proc: true
  md: 'These parameters are useful in directory shares:


    +   - **guest** Allows guest access to the share. The public parameter is a synonym.


    +   - **writable** Yes or true setting here marks the share as read-write. Do
    not allow guest access to a read-write share.


    +   - **printable** Specifies a printing share; this parameter must be set to
    no or false for a directory share.


    +   - **veto files** Prevents the export of any files that match the given patterns.
    You must enclose each pattern inside forward slashes (so that it looks like `/pattern/`).
    Here''s an example that bars object files, as well as any directory named bin:


    ```

    veto files = /*.o/bin/

    ```


    # ## 14.4.1 Home Directories


    You can put a special section called [homes] in your smb.conf file if you want
    to export home directories to users. The section should look like this:


    ```

    [homes]

    comment = home directories

    browseable = no

    writable = yes

    ```


    By default, Samba reads the logged-in user''s /etc/passwd entry to determine the
    user''s home directory for [homes]. However, if you don''t want Samba to follow
    this behavior (that is, you want to keep the Windows home directories in a different
    place than the regular Linux home directories), you can use the %s substitution
    in a path parameter. Here is an example that switches the user''s [homes] directory
    to /u/%user:


    ```

    path = /u/%s

    ```


    Samba substitutes the current username for the %s.


    # ## 14.5 Sharing Printers


    You can export all of your printers to Windows clients with a special [printers]
    section in your smb.conf file. Here''s how the section looks when you''re using
    CUPS:


    ```

    [printers]

    comment = Printers

    browseable = yes

    ```'
  merge: -1
  pgno: 309
- img_proc: true
  md: '```

    printing = CUPS

    path = cups

    printable = yes

    writable = no

    ```


    To use the printing = CUPS parameter, your Samba installation must be configured
    and linked against the CUPS library.


    As you learned in Chapter 12, there are several printing systems in addition to
    CUPS. On Linux, you can set the printing parameter to BSD, LPRNG, PLP, or CUPS.
    Of these, CUPS is the easiest.


    NOTE Depending on your configuration, you may also want to allow guest access
    to your printers with the guest ok = yes option because you may not want to give
    a Samba password or account to everyone who needs to access the printers.


    # 14.5.1 Sharing a Single Printer


    If you want to export a single printer, you can do so with a printer section that
    looks like this:


    ```

    [printer_name]

    comment = My printer

    printer name = printer_name

    printing = CUPS

    path = cups

    browseable = yes

    printable = yes

    ```


    You can specify a driver name for Windows clients with the printer driver parameter.
    For example, to tell a client that the printer is an HP LaserJet 4M, you can use
    the following in the printer section:


    ```

    printer driver = HP LaserJet 4M

    ```


    # 14 Using the Samba Client


    Samba comes with a program named smbclient that can print to and access remote
    Windows shares. This program comes when you are in an environment where you must
    interact with Windows servers that offer no Unix-friendly means of communication.


    To get started with smbclient, use the -L option to get a list of shares from
    a remote server SERVER:


    ```

    smbclient -L -U username SERVER

    ```


    You do not need -U username if your Linux username is the same as your username
    on SERVER.'
  merge: -1
  pgno: 310
- img_proc: true
  md: 'After running share command, smclient asks for a password. If you want to try
    to access a share as a guest, you can press ENTER; otherwise, enter your password
    on SERVER.


    Upon success, you should get a share list like this:


    | Sharename | Type | Comment |

    | --- | --- | --- |

    | Software | Disk | Software distribution |

    | Scratch | Disk | Scratch space |

    | IPC | IPC | IPC Service |

    | ADMIN | IPC | IPC Service |

    | Printer1 | Printer | Printer in 231A |

    | Printer2 | Printer | Printer in basement |


    Look at the Type field to make sense of each share. You should only pay attention
    to the Disk and Printer shares (the IPC shares are for remote management). In
    this list, there are two disk shares and two printer shares. You can use the name
    in the Sharename column to access the share.


    # 14.6.1 Accessing Files


    If you need only casual access to files in a disk share, use the following command
    (again, you can omit the -U username if your Linux username matches your username
    on the server):


    ```

    smclient -u username \\SERVER\sharename''

    ```


    Upon success, you will get a prompt like this:


    ```

    smb: \>

    ```


    In this file transfer mode, smclient is similar to the Unix ftp; you can run these
    commands:


    +   get file Copies file from the remote server to the current local directory.

    put file Copies file from the local machine to the remote server.

    cd dir Changes Changes the directory on the remote server to dir.

    lcd localdir Changes the current local directory to localdir.

    pwd Prints the current directory on the remote server, including the share and
    server names.

    !command Runs command on the local host. Two particularly handy commands are !pwd
    and !ls to determine directory and file status on the local side.

    help Shows a full list of commands.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# Using the SMB Filesystem


    If you need frequent access to files on a Windows server, you can attach the share
    directly to your system with the smbmount command:


    ```

    smbmount \\SERVER\sharename\ -c mount mountpoint -U username -P password

    ```


    To use this command, you must have the smbfs kernel driver loaded as a module
    or directly compiled into the kernel. In addition, the rest of the Samba programs
    should be in your path. By default, a Samba installation built from source code
    does not include the smbmount command. You must specify --with-smbmount when running
    the Samba configure script to create these programs.


    # 14.6.2 Printing to a Windows Share


    The easiest way to print to a Windows SMB share is through CUPS. Follow these
    steps to create a printer working:


    +   Put the CUPS SMB back in place. Find the smbspool program in your Samba distribution,
    and then create a symbolic link named smb in the backend directory to smbspool,
    like this:


    ```

    -s smbspool_path/smbspool cups_prefix/lib/cups/backend/smb

    ```


    +   Restart CUPS


    +   Run lpinfo -v to confirm that the SMB spooler is in the available ends. You
    should see this in the output:


    ```

    network smb

    ```


    +   Add a new printer as outlined in Chapter 12. If you don''t need a password
    to access the printer, use the following as the printer device path (notice that
    the backslashes are forward slashes in CUPS):


    ```

    sm://SERVER/sharename

    ```


    If you need a username and password, add them to the front of the server:


    ```

    sm://username:password@SERVER/sharename

    ```


    If your target printer is in a different Windows workgroup, you can specify the
    workgroup in the first part of the name:


    ```

    sm://username:password@WORKGROUP/SERVER/sharename

    ```'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# Sending Files Directly to a Printer


    If you have a file that is suitable for a printer (such as a PostScript file that
    that you want to send to a PostScript printer), you can send it directly to the
    printer share with this smbclient variant:


    ```

    smbclient ''\\SERVER\sharename'' -U username -P < file

    ```


    This command is particularly useful when testing and troubleshooting printers.
    Working with CUPS and Samba simultaneously can be difficult, so if you find yourself
    running into trouble when trying to access a printer on a Windows system, try
    going through these steps:


    +   1. Use the Windows system to print a test document to a file, then transfer
    file to your Linux system.

    2. Run the command in the preceding example to attempt to print the test file.

    3. If the file does not print, you have a problem on the Samba side. Otherwise,
    the problem lies with CUPS.'
  merge: -1
  pgno: 313
- img_proc: true
  md: This old method gets the job done, but it is not very flexible. In particular,
    after the transfer completes, the remote host may not have an exact copy of the
    directory. If directory already exists on the remote machine, and it contains
    some extraneous files, those files persist after the transfer.
  merge: -1
