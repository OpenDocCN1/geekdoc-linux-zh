  md: '# 4.8 Tracking Individual Processes


    You saw how to use ps in Section 1.16 for listing process characteristics of any
    given time. ps is good for getting a snapshot of the current processes, but it
    does little to tell you how processes change over time. Using ps alone, it''s
    not terribly easy to pick out processes that are using too much CPU time or memory.


    The top program displays the current system status and many of the fields that
    you might see in a ps listing, but it updates the display every second. By default,
    top shows the most active processes (that is, currently taking up the most CPU
    time).


    You can send commands to top with keystrokes. These are some of the most important
    commands:


    +   - SPACEBAR Updates the display immediately

    - M Sorts by current resident memory usage

    - T Sorts by (cumulative) CPU usage

    - P Sorts by current CPU usage (the default)

    - U Displays only one user''s processes

    - Q Displays a usage summary for all top commands


    If you want to know how much CPU time a process uses during its entire lifetime,
    use time. (If your shell has built-in time command, you may need to run /usr/bin/time
    to get the full output shown below.) For example, to measure the CPU time used
    by ls, run this command:


    ```

    time ls

    ```


    After ls terminates, you should get some output like this:


    ```

    0.05user 0.09system 0:00.elapsed 31%CPU (avgtxt+0avgdata Omaxresident)k 0inputs+0outputs
    (125major+5minor)pagefaults Oswaps

    ```


    +   - User time is the number of seconds that the CPU has spent running the program''s
    own code. On modern processors, some commands run so quickly that you may get
    a zero value here because the actual CPU time is so low that rounds down to zero.

    - System time is how long the kernel spends doing the process''s work (for example,
    reading files and directories).

    - Elapsed time is the total time to run the process from start to finish, including
    the time that the CPU spent doing other tasks. This number is not very useful
    for performance measurements.


    See Section 4.10 for a description of the other fields.'
  merge: -1
  pgno: 95
