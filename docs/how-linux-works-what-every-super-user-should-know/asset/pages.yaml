- img_proc: true
  md: 'These are the media drivers:


    +   **SCSI disk support** Covers all fixed and removable-media disk-like storage
    devices, except CD-ROM drives.


    +   **SCSI tape support***


    +   **SCSI CD-ROM support**


    +   **SCSI generic support** Allows applications talk to a SCSI device at a low
    level. You need SCSI generic support for a wide range of devices, including CD
    burners, changer devices on tape drives, SCSI scanners, and more.


    A look inside the SCSI low-level drivers submenu reveals drivers for many kinds
    of SCSI host controllers. Some of the drivers are named after the SCSI chipset
    on the host controller, so you may have to look carefully at your hardware to
    find a match. The low-level driver list also includes support for some parallel
    port devices, as Zip drives.


    NOTE If your kernel and root partition are on a SCSI disk, compile SCSI support
    (including the disk and host controller drivers) directly into the kernel rather
    than as modules. This makes booting much easier, because you do not need to worry
    about loading SCSI modules from a disk that the kernel does not yet how to access.


    # Networking Support


    You need networking support for almost any system, even if you do not have an
    external network connection. Many applications use local network interface features.


    Your first order of business is to pick the networking devices that you need.
    For many Ethernet devices, look under **Ethernet (10 or 100对比)**. There are many
    devices to choose from. If you''re not sure what you need, don''t be afraid to
    configure several drivers as modules. In addition, if you plan to dial up to the
    Internet or use DSL connections, you need PPP support, along with asynchronous
    (serial port) or PPP over Ethernet (PPPoE) support. If you''re not sure about
    PPP options, configure them as modules.


    The configuration options inside the Networking options submenu represent the
    trickiest part of the kernel network configuration. You need to select all of
    the options and protocols that you intend to use. The essential options for many
    packages include the following:


    +   **TCP/IP networking**nUnix domain sockets


    +   **Packet socket** (for features such as promiscuous mode)


    Not obvious is Network packet filtering, which is required for any kind of firewall
    or NAT (Network Address Translation, or “IP masquerading”) support. Just selecting
    this option is not enough enough, in general, your'
