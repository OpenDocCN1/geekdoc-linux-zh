  md: '+   - List everything and pipe the output to a command like less, and run a
    search to find what you''re looking for.

    - Narrow down the list that lsof provides with command-line options.


    If you use command-line options, you can provide a filename as an argument, and
    lsof will list only the entries that match the argument. For example, the following
    command displays entries for open files in /usr:


    ```

    lsof /usr

    ```


    To list the open files for a particular process ID, run this command:


    ```

    lsof -p pid

    ```


    lsof has dozens of other options; lsof -h provides a short summary. Most options
    pertain to the output format. Make sure that you look at Section 6.5.1 for lsof
    network features.


    > lsof is highly dependent on kernel information. If you upgrade your kernel,
    you may need to upgrade lsof.


    # 4.8.2 Tracing Program Execution with ltrace


    With the exception of time, the tools you have seen so far examine active processes.
    However, if you have no idea why a program dies immediately after starting up,
    even lsof won''t help you. You would have a difficult time running lsof concurrently
    with a failed command.


    The trace (system call trace) and ltrace (library trace) commands can help you
    discover what a program attempts to do. These tools produce extraordinarily large
    amounts of output, but once you know what to look for, you will be in a good position
    for tracking down problems.


    A system call is a privileged operation that the kernel must perform for a process,
    such as opening and reading data from a file. trace prints all of the system calls
    that a process makes. To get the idea, run this command:


    ```

    strace cat /dev/null

    ```


    The first part of output deals primarily with loading shared libraries. You can
    ignore this stuff:


