    Every now and then, you might get a patch to apply against source code to fix
    bugs or add features. You may also see the term diff as a synonym for patch, because
    the diff program produces the patch. The beginning of a patch looks something
    like this:


    ```

    --- src/file.c.orig 2003-07-17 14:29:12.000000000 +0100

    +++ src/file.c 2003-09-18 10:22:17.000000000 +0100

    @@ -2,16 +2,12 @@

    ```


