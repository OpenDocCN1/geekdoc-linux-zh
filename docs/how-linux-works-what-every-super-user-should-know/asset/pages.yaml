- img_proc: true
  md: 'When you are through configuration and decide to exit, the menu system will
    ask you if you would like to save the current configuration. If you choose Yes,
    the system backs up your previous .config file as .config.old and writes a new
    .config file.


    # 10.4.1 Configuration Options


    Most of the configuration options are fairly self-explanatory. For example, in
    the menu shown in Figure 10-1 on page 205, the items under Device Drivers > SCSI
    device support > SCSI low-level drivers correspond to device drivers for SCSI
    host controllers.


    Some configuration options depend on other options, and until you activate the
    dependency options you cannot reach configuration options that have dependencies.
    For example, to reach the SCSI low-level drivers submenu, you must first activate
    SCSI device support in the previous menu. These dependencies are not always obvious;
    you may need to do a little bit of experimentation to find what you''re looking
    for. If you''re really stumped on a dependency, go to the source. Look at /i386/Config,
    the master file for all options and online help for configuration.


    The following sections outline the most significant kernel options that reside
    within the important top-level menus. Keep in mind that these options change with
    time; you may see items not listed here, or the items may be in a different place
