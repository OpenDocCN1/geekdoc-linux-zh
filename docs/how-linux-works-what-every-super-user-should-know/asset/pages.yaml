    X11Forwarding value Enables X Window System client tunneling if value is set to
    yes.

    XAuthLocation path Provides a path for xauth; X11 tunneling does not work without
    xauth. If xauth isn''t in /usr/X11R6/bin, set path to the full path-name for xauth.


    # Host Keys


    OpenSSH has three different host keys: one for protocol 1, and two for protocol
    2. Each has a public key (with .pub file extension) and a private key (with no
    extension). Do not let anyone see your private key, even on your own system. If
    someone gets your private key, SSH provides no protection against password snooping.
    SSH version 1 has RSA keys only, and SSH version 2 has RSA and DSA keys. RSA and
    DSA are public key cryptography algorithms. SSH version 2 provides both because
    there are always debates over which one is better.

    The key filenames are as follows:


    # Table 6-1: OpenSSH Key Files


    | ssh_host_rsa_key | Private RSA key (version 2) |

    | ssh_host_rsa_key.pub | Public RSA key (version 2) |

    | ssh_host_dsa_key | Private DSA key (version 2) |

    | ssh_host_dsa_key.pub | Public DSA key (version 2) |

    | ssh_host_key | Private RSA key (version 1) |

    | ssh_host_key.pub | Public RSA key (version 1) |


    Normally, you do not need to build the keys, because the OpenSSH installation
    program should do this for you. However, this isn''t always given, and you may
    need to know how to create keys if you plan to use programs like ssh-agent.


    To create SSH protocol version 2 keys, use the ssh-keygen program that comes with
    OpenSSH:


    ```

    ssh-keygen -t r -N '''' \-f ssh_host_rsa_key

    ssh-keygen -t dsa -N '''' \-f ssh_host_dsa_key

    ```'
