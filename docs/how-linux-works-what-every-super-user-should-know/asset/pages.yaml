  md: '# 13.6.5 Moving Forward Backing Up


    The mt fsf command moves the tape to the start of the next file. There is also
    a command for moving the tape back:


    ```

    mt bsf

    ```


    However, it is important to understand that this command rewinds the tape to the
    end of the previous file on the tape; that is, to the start of the next file mark
    that the tape head sees.


    Let''s say that you are at the start of file 1, as shown earlier in Figure 13-5.
    Running mt bsf reverses the state to that shown in Figure 13-4. Try it for yourself,
    and then run another mt status. The file number should be with 0 a block number
    of -1 (the driver cannot compute the length of the file by itself).


    In general, to get back to the start of the previous file when you are at the
    start of a file, you need to move back twice and then forward once. Because most
    mt tape movement commands take an optional file count (an example is the 2 here),
    you can run the following sequence:


    ```

    mt rewind

    mt fsf

    ```


    However, there''s another gotcha here, because the tape in this example is the
    start of file 1. Running mt bsf 2 attempts to move the tape back two file marks.
    However, the beginning of the tape is not a file mark. Therefore, the mt bsf 2
    in this sequence backs up, passing one file mark, and then hits the beginning
    of the tape, producing an I/O error. The subsequent mt fsf skips forward again,
    moving the tape back to the beginning of file 1.


    Therefore, if you want to get to file 0, you should always rewind the tape instead
    with mt rewind.


    > NOTE The Linux includes a bsfm command that is supposed to take you directly
    to the start of the previous file. This nonstandard extension does not work quite
    correctly; if the tape head is at a start of a file, bsfm runs mt bsf, then mt
    fsf, taking you right back to where you started.


    The bottom line is that you need to pay careful attention to the tape head position
    with respect to the file marks and choose the appropriate command. If it seems
    a little ridiculous to you, it''s probably not worth sweating over; to get to
    file n on a tape, this always works (though it may be slower):


    ```

    mt rewind

    mt fsf n

    ```


    To eject the tape, use the offline command:


    ```

    mt offline

    ```'
