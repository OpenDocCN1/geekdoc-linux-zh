  md: '+   You don''t have access to your normal familiar shell environment.


    +   You have to type the root password.


    Most larger workstation installations employ a package named sudo to allow administrators
    to run commands as root when they are logged in themselves. For example, if you
    want to use vipw to edit the /etc/passwd file, you could do it like this:


    ```

    sudo vipw

    ```


    When you run this command, sudo logs this action with the syslog facility, so
    that you have a record of what you did.


    Of course, the system doesn''t let any user run commands as the superuser; you
    must configure the privileged users in the /etc/sudoers file. As it turns out,
    sudo has great many options (that you''ll probably never use), and the side effect
    of this is that the /etc/sudoers file has a somewhat complicated syntax. Here
    is an example file that gives user1 and user2 power to run any command as root
    without having to enter a password:


    User_Alias ADMINS = user1, user2


    ```

    ADMINS ALL = NOPASSWD: ALL

    root ALL=(ALL) ALL

    ```


    The first line defines an ADMINS user alias with the two users, and the second
    line grants the privileges. The ALL = NOPASSWD: ALL part means that the users
    in the ADMINS alias can use sudo to execute commands as root. The second ALL means
    "any command." The first ALL means "any host" (if you have more than one machine,
    you can set different kinds of access for each machine or for groups of machines,
    but this book will not explain that feature).


    The root ALL=(ALL) simply means that the superuser may also use sudo to run any
    command on any host. The extra (ALL) means that the superuser may also run commands
    as any other user. You can extend this privilege to the ADMINS users by changing
    the /etc/sudoers line shown earlier to this:


    ```

    ADMINS ALL = (ALL) NOPASSWD: ALL

    ```


    > NOTE Use the visudo command to edit /etc/sudoers. This command checks for file
    syntax errors after you save the file.


    That''s all you need to know about sudo for now. If you need its more advanced
    features, consult the sudoers(5) and sudo(8) manual pages.'
