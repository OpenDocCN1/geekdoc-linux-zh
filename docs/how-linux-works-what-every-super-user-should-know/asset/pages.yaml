    \ a non-login shell.\n\nNon-interactive shell This is a shell that doesn't require\
    \ input from a terminal.\n\nThe reasoning behind the two different startup file\
    \ systems is that in the old days, users logged through a traditional terminal\
    \ with a login shell, then started non-login subshells with windowing systems\
