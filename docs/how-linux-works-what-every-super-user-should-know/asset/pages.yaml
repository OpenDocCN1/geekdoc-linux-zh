  md: '# 5


    # # CONFIGURING YOUR NETWORK


    Networking is the practice of sending data from one computer to another computer.
    For a simple connection to the Internet, you need to do the following:


    +   - Connect a network interface on your machine to a network

    - Define a gateway to the rest of the Internet

    - Show your machine how to resolve hostnames


    Unfortunately, there are so many different kinds of networks that there is no
    one simple formula to get your system talking to the rest of the world. For Ethernet
    connections with a static (fixed) IP address, a separate command or file performs
    each of the preceding steps. However, DHCP (Dynamic Host Configuration Protocol)
    configurations and PPP (Point-to-Point Protocol) connections use different configuration
    schemes. This chapter begins with setting up static interfaces because they are
    easy to understand, and then it moves to DHCP and PPP, including DSL (Digital
    Subscriber Line) and PPPoE (PPP over Ethernet) connections.


    After you know how to connect your machine to a network, you''re ready to move
    on to more advanced topics, such as building your own networks and configuring
    firewalls, described later in this chapter.'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'If you really want to understand Linux network configuration, you must be able
    to distinguish each layer in the network. Here are the layers in the Internet,
    from the top level to the bottom level:


    **Application Layer** Contains the "language" that applications and servers use
    to communicate; usually a protocol of some sort. Common application layer protocols
    include Hypertext Transfer Protocol (HTTP), used for the Wide Wide Web, Secure
    Shell (SSH), and the File Transfer Protocol (FTP).


    **Transport Layer** Defines the data transmission characteristics of the application
    layer. This is host-specific information, and it includes data-integrity checking,
    source and destination ports, and specifications for breaking application data
    into packets. TCP (Transmission Control Protocol) is the most common transport
    layer protocol.


    **Internet Layer** Defines how to moves from the source to the destination host.
    The particular packet-transit rule set for the Internet as IP (Internet Protocol).
    This is sometimes called the network layer.


    **Host-to-Network Layer** Defines how to send packets from the Internet layer
    across the physical medium, such as Ethernet or a modem. This is sometimes called
    the physical layer.


    This may sound overly complicated, but it''s important that you understand it,
    because your data must travel through these layers twice before it reaches its
    destination. Your bytes leave the application layer on the source host, then go
    down to the physical medium, across the medium, and then again up to the application
    layer on the destination host.


    Unfortunately, the layers sometimes bleed in strange ways, and terms like TCP/IP
    reflect the integration. The distinction is only getting more vague — in particular,
    devices that once dealt with the Internet layer now sometimes look at the transport
    layer data to determine where to send data.


    To connect your Linux machine to the network, you will need to configure the Internet
    and host-to-network layers, so let''s get straight to them. If you want to know
    a lot about layers (and networks in general), look at Computer Networks [Tanenbaum].


    You have heard of another set of layers known as the ISO OSI (Open Systems Interconnection)
    Reference Model. This is a seven-layer network model often used in teaching and
    designing networks, but this book does not cover the OSI model because it is of
    little practical use for understanding how Linux Internet networking works.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# 5.2 The Internet Layer


    The Internet as we know it is based on the Internet Protocol, version 4 (IPv4).
    The basic idea is that each computer on the Internet has a numeric IP address
    in the form of a.b.c.d, where a and d one-byte numbers from 1 to 254, and b and
    c one-byte numbers from 0 to 255. Technically, an IP address is a four-byte (32-bit)
    number, but it''s usually easiest to deal with the address as a dotted-quad sequence
    of decimal numbers, like 10.23.2.37, instead of something ugly like the hexadecimal
    0xA0170225.


    A subnet is a group of IP addresses in some (hopefully) regular order. For example,
    the hosts between 10.23.2.1 and 10.23.2.254 could comprise a subnet, or all the
    hosts between 10.23.1.1 and 10.23.255.254 could also be a subnet.


    Subnets are important because they determine how your packets move between different
    machines. To communicate with another computer, your machine must know that other''s
    IP address. If the destination is your local area network''s subnet, your system
    can send the data directly to that host, but if not, your machine probably has
    to send it to a gateway (or router) that transmits your data across another network
    on its way to the final destination.


    # 5.2.1 More Subnets


    A subnet mask defines a subnet; for example, the subnet mask for 10.23.2.1–10.23.2.254
    is 255.255.255.0. In pure binary, the subnet mask “covers” the bits in an address
    that are common to the subnet. For example, here are the binary forms of 10.23.2.0
    and 255.255.255.0:


    ```

    10.23.2.0:    00001010 00101111 00000011 00000000

    255.255.255.0: 11111111 11111111 11111111 00000000

    ```


    Now, let’s “cover” the bits in 10.23.2.0 with the 1s in 255.255.255.0 by marking
    these in bold:


    ```

    10.23.2.0:    00001010 00101111 00000011 00000000

    ```


    Look at the bits that aren’t bold. You can set any of these bits to 1 to get a
    valid IP address in this particular subnet (with two exceptions: all 0s and all
    1s).


    Putting it all together, you can see that a host computer with an IP address of
    10.23.2.1 and a subnet mask of 255.255.255.0 can directly communicate with other
    computers that have IP addresses beginning with 10.23.2 (to talk to the rest of
    the Internet, your computer needs to use a gateway). You can denote this entire
    subnet as 10.23.2.0/255.255.255.0.'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'If you''re lucky, you will deal only with easy subnet masks like 255.255.0
    255.255.0.0, but you may be unfortunate and encounter stuff like 255.255.255.192,
    where it isn''t quite simple to determine the set of addresses that belong to
    the subnet. It helps to know that 192 is hexadecimal, from which you should be
    able to figure out which addresses belong to which subnet. If you aren''t familiar
    with conversion between binary, decimal, and hexadecimal formats, you should probably
    learn now. The dc (decimal calculator) program has excellent facilities for converting
    different radix representations.


    A common shorthand for subnet masks is to identify the number of bits at the start
    of the subnet mask that have a value of 1. For example, 255.255.255.0 contains
    24 1-bits to start the 32-bit sequence, so you can write the earlier example of
    10.23.2.0/255.255.255.0 as 10.23.2.0/24. Table 5-1 shows several example subnet
    masks.


    # Table 5-1: Subnet Masks


    | Long Form | Short Form |

    |---|---|

    | 255.0.0.0 | 8 |

    | 255.255.0.0 | 16 |

    | 255.240.0.0 | 12 |

    | 255.255.255.0 | 24 |

    | 255.255.255.192 | 26 |


    Therefore, to specify 10.0.0.0/255.0.0.0, you can use 10.0.0.0/8.


    # 5.3 Basic ICMP Tools


    Before you configure your network devices, you should learn how to use ICMP (Internet
    Control Message Protocol) tools. ICMP packets help you root out problems with
    connectivity and routing.


    ping (see http://arp.ml/mw-/ping.html) is one of the most basic debugging tools.
    It sends ICMP echo request packets to a host. If the host gets the packet and
    feels nice enough, it sends an ICMP echo response in return.


    Let''s say you run ping 10.1.2.21 and you get this:


    ```

    PING 10.1.2.21 (10.1.2.21): 56 data bytes

    6 bytes from 10.1.2.21: icmp_seq=0 ttl=255 time=8.0 ms

    6 bytes from 10.1.2.21: icmp_seq=1 ttl=255 time=3.2 ms

    6 bytes from 10.1.2.21: icmp_seq=2 ttl=255 time=3.4 ms

    6 bytes from 10.1.2.21: icmp_seq=4 ttl=255 time=3.4 ms

    6 bytes from 10.1.2.21: icmp_seq=5 ttl=255 time=3.2 ms

    ```


    The most important parts of the output are the icmp_seq number and the round-trip
    time. ping sends a sequence of echo request packets, one every second.'
  merge: -1
  pgno: 109
- img_proc: true
  md: 'Notice that there''s a gap between 2 and 4 in this example. This usually means
    that there''s some kind of connectivity problem. It is possible to get packets
    out of order, but if this happens, there''s still some kind of problem because
    ping sends only one packet a second. If a response takes more than a second, the
    connection is extremely slow.


    The round-trip time is the total elapsed time between the request packet was transmitted
    and moment that the response packet arrived. If there are incomplete routes between
    the request source and the destination, ping immediately reports the ICMP "host
    unreachable" packets that come back as a result of the disconnection.


    On a wired LAN, you should expect absolutely no packet loss and low numbers for
    the round-trip time (the preceding example output is from a wireless network).
    You should also expect no packet loss from your network to and from your ISP,
    as well as reasonable, steady round-trip times.


    Sadly, not all on the Internet respond to ICMP echo request packets as they once
    did. Therefore, you may come across situations where you can connect to a Web
    site on a host, but not a ping response.


    Another ICMP-based program is traceroute; it will come in when you reach the material
    on routing later in the chapter. Traceroute host to the exact path your packets
    take to a remote host. One of the best things about traceroute is its reporting
    of return-trip times at each step in the route, as demonstrated in this output
    fragment:


    ```

    4 206.220.243.106 1.163 ms 0.997 ms 1.182 ms

    5 4.24.203.65 1.421 ms 1.12 ms 1.463 ms

