    # 12.5.5 Printer Devices (Backend Specifications)


    As you might assume from the file:/dev/null specification in the test printer
    you created, you specify devices with Uniform Resource Identifiers (URIs). You
    can get a partial list of URI options with the lpinfo command:


    ```

    lpinfo -v

