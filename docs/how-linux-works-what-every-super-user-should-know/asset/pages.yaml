- img_proc: true
  md: '# 11.1 Floppy Drives


    When working with a PC floppy drive, you must remember that it is one of the most
    unreliable pieces of hardware that you can find on a PC. You can mount the first
    floppy drive using the device /dev/fd0, but this can be dangerous, because the
    kernel will not like any hardware errors. Using the mtools programs is a good
    alternative to mounting the filesystem directly.


    The mtools programs look like their MS-DOS counterpart commands with an m at the
    beginning. For example, you can use mdir for a directory listing.


    To copy a file from a floppy disk to the current directory, run this command:


    ```

    mcopy a:file

    ```


    Copying files from the local system to the disk is similar:


    ```

    mcopy file a:

    ```


    You can also format a floppy with an MS-DOS filesystem using the mformat command:


    ```

    mformat a:

    ```


    For more options and commands, refer to the mtools(3) manual page.


    # 11.1.1 Floppy Images


    Sometimes it''s more convenient to copy the entire image of a floppy disk to a
    file on your hard disk than it is to deal with individual floppy disk operations.
    You can perform the extraction with dd:


    ```

    dd if=/dev/fd0 of=image_file bs=512

    ```


    You might be able to make the extraction a little faster by changing the bs parameter
    to 32k. After you have the image file, it''s convenient to mount the image file
    on your system with a loopback block device. This example mounts an image of an
    MS-DOS filesystem:


    ```

    mount -t vfat -oloop=/dev/loop0 image_file mount_point

    ```


    > WARNING Remember to unmount the image file after you finish, especially if you
    plan to alter the filesystem in the image.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# 11.1.2 Low-Level Formatting a Floppy Disk


    If you absolutely need to write to a floppy disk, but you keep getting I/O errors,
    you can now try to format a disk with the superformat program (which is part of
    the fdutils package) or with fdformat.


    # 11.2 CD Writers


    Linux CD burning programs work with ATAPI devices and generic SCSI devices, such
    as `/dev/hdc` and `/dev/sgo`. The most popular command-line CD recording utility
    for Linux is cddrecord.


    Most CD burners on the market are ATAPI devices. At one time, Linux supported
    these devices with an IDE-to-SCSI emulation driver called ide-scsi. However, with
    Linux kernel version 2.6, this is no longer necessary, and the ide-scsi driver
    may not work well in newer kernel releases.


    # 11.2.1 Verifying the Hardware


    Before trying to write a CD, you should verify that the CD recorder drive exists
    and determine its name and specification. For IDE devices, locating the device
    is easy; just use the standard device name for the entire disk (for example, `/dev/hdc`;
    see Section 2.3.4 for more information).


    You can verify the existence and identity of a device with the `-ing` option to
    cddrecord.


    ```

    cdrecord -ing dev=device

    ```


    If there is an ATAPI device at *device*, the output of the cddrecord -ing command
    looks like this:


    | Device type | Removable CD-ROM |

    | Version | :0 |

    | Response Format: 1 |

    | Vendor_info | ''PLEXTOR '' |

    | Identifikation | ''CD-R PX-W4012A'' |

    | Revision | '':1.01'' |

    | Device seems to be: Generic mmc CD-RW. |


    You can search for a SCSI CD recorder device with this command:


    ```

    cdrecord -scanbus

    ```


    The output should look something like the following:'
  merge: -1
  pgno: 248
