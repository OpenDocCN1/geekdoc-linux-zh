    # 11.6.1 When you Insert a Card


    The cardmgr program reads configuration data and activates scripts in /etc/pcmcia
    in response to cards being inserted and removed. The central configuration database
    is /etc/pcmcia/config.


    When you insert a PC Card, cardmgr reads information from the PC Card.


    +   1. It reads the device identifier from the PC Card.

    2. It looks up the identifier in /etc/pcmcia/config, retrieving the kernel module
    name that contains the device driver.

    3. It matches the kernel module name with a class name in /etc/pcmcia/config.

    4. It loads the kernel module(s) and configures the PC Card with respect to the
    local options in /etc/pcmcia/config.opts.

    5. It runs a class script located in the /etc/pcmcia directory, corresponding
    to the class name it found in /etc/pcmcia/config.


    # /etc/pcmcia


    Let''s look at the /etc/pcmcia directory in more detail. Each kernel module has
    one or more matching PC Card definitions in the /etc/pcmcia/config file. For example,
    here is an entry that matches the 3c589_cs module against its vendor and version
    identifier strings:


    ```

    card "Lucent Technologies WaveLAN Adapter"

    version "Lucent Technologies", "WaveLAN/PCMIA"

    bind "wavelan_cs"

    ```


    The bind in the last line means to bind the card definition to one or more kernel
    modules. However, the card definition does not always specify which version of
    the hardware. cardmgr can also identify the appropriate kernel module by using
    other hardware criteria, including the function parameter, as in this example:


    ```

    card "ATA/IDE Fixed Disk"

    function fixed_disk

    bind "ide_cs"

    ```


    Well-defined device interfaces such as disks, serial ports (modems), and flash
    memory usually have a function parameter, but don''t expect this from all devices.
    In particular, Ethernet cards usually don''t have a function parameter. You may
    also use manual device-identifier matches that use the manfid keyword.'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'Having identified the necessary kernel module(s), cardmgr then looks for the
    device driver class, which are found in the first part of /etc/pcmcia/config.
    Here is a sample definition that maps wavelan_cs to the network driver class:


    ```

    device "wavelan_cs"

    class "network" module "wavelan_cs"

    ```


    Each driver class has a script in /etc/pcmcia that cardmgr runs after loading
    and configuring a card''s module (you''ll see more about class scripts shortly).


    # Configuration Options


    You should not modify /etc/pcmcia/config.opts; instead, enter your local configuration
    data in /etc/pcmcia/config.opts (cardmgr usually reads this file after config).
    For the most part, the PCMCIA utilities should work fine with the default settings,
    but the machine- and card-specific options in config.opts are at your disposal
    if your hardware just won''t behave.


    Of particular interest are the exclude and include keywords that enable you to
    manually specify IRQs and addresses. For example, you will see the following lines
    to prevent cardmgr from using standard IRQs, regardless of what the kernel may
    say about their availability:


    ```

    # First built-in serial port

    exclude irq 4

    ```


    ```

    # First built-in parallel port

    exclude irq 7

    ```


    You can specify per-module options with the module keyword. These examples are
    also from the default config.opts file:


    ```

    "ray_cs" opts "net_type=1 essid=ESSID1"

    ```


    ```

    "wavelan_cs" opts "station_name=MY_PC"

    ```


    > **NOTE** In normal circumstances, you do not configure wireless options with
    config.opts, rather, with iwconfig and possibly /etc/pcmcia/wireless.opts (see
    Section 5.15 for more information).


    # Auxiliary Configuration Scripts


    Each driver class has a script in /etc/pcmcia. For example, the /etc/pcmcia/network
    script corresponds to the network class mentioned earlier. cardmgr runs the class
    script after loading and configuring a card''s module.


    The /etc/pcmcia configuration scripts work like init.d boot scripts, taking an
    argument to start, stop, reload, or perform other actions:'
  merge: -1
