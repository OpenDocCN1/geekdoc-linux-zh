    \ and run all sorts of wasteful programs in these subshells. With login shells,\
    \ you could run fancy startup commands in a file as .bash_profile, leaving only\
    \ aliases and other \"lightweight\" things to .bashrc.\n\nThat's a nice theory,\
    \ but in modern times, nearly everyone logs in through a graphical display manager\
    \ that never starts a login shell. Therefore, you need to set up your entire environment\
