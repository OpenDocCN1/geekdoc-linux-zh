- img_proc: true
  md: '# Bus Options


    You shouldn''t need to change the bus options for most systems. Unless you have
    an extremely old or odd system, include PCI support (and if you''d like to list
    and diagnose devices on the PCI bus, install lspci, which is part of the pci-utils
    package).


    You should enable the Support for hot-pluggable devices option so that your system
    can take appropriate action when you attach and detach removable devices.


    Newer kernels include base PCMCIA (PC Card/CardBus) drivers in configuration options
    this menu — in previous systems, PCMCIA support was completely separate from the
    main kernel distribution. You still need the PCMCIA utilities if you intend to
    use PC cards, and at the moment, you can still leave out PCMCIA kernel support
    here and get it from these utilities, which may change in the future.


    # Executable File Formats


    To start a process from an executable file on the disk, the kernel needs to know
    how to load the executable file, how to initialize the process in memory, and
    where to start running the process. An executable''s format determines these characteristics.
    Most binaries on a modern Linux system are ELF (Executable and Linkable Format)
    files. You probably do not need to support the ancient "a.out" executable format
    (you may not even have the shared libraries to support these binaries), but it
    does not take much memory to include support, and you can build it as a module.


    # Device Drivers


    Configuring device drivers is a long process due to the wide variety of devices
    that Linux supports. Unfortunately, it''s during this stage that you can get bogged
    down with all of the options and end building up a kernel that is far too large
    because you included drivers for devices that you will never have. If you''re
    in doubt about whether you are going to use any particular driver (other than
    a disk driver), build it as a module so that it does not necessarily take kernel
    memory.


    The following sections describe the driver configuration options inside the Device
    drivers menu.


    # Plug and Play Support


    You must enable Plug and Play support if you want any reasonably modern built-in
    hardware in your computer to work. You may also need plug-and-play support in
    order to use network cards, internal modems, and sound cards.'
  merge: -1
