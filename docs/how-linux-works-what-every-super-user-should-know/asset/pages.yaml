- img_proc: true
  md: 'Newer printers with USB connections use a slightly different backend than parallel
    ports. The URI looks something like the following, although the device filename
    may not be on your system:


    ```

    usb:/dev/usb/lp0

    ```


    This is a direct TCP network connection to the print engine of a network printer.
    Most of these printers listen on TCP port 9100, so you can specify this as follows
    (since port 9100 is the default, you don''t really need the:9100):


    ```

    socket:/printer_host:9100

    ```


    If you want CUPS to send jobs to the Berkeley LPD port of a remote print server
    or printer, use this URI specification:


    ```

    lpd:/host/printer_name

    ```


    This is for printing to a Windows printer. You need to use Samba''s smspool program
    in this case. See Section 14.6.2 for more details on the URI specification and
    setting up the Samba backend.


    These are for printing to other network IPP servers (such as remote CUPS servers).
    Here is an example:


    ```

    ipp://host/printer_name

    ```


    In the early days of Unix, machines talked to printers with a serial port, and
    some have special-purpose system still have serial ports. Because serial ports
    have a more complex system configuration than parallel ports, you often need special
    parameters to indicate the baud rate and other port settings. At the very least,
    you should specify the baud rate, as in in this example:


    ```

    serial:/dev/ttyS1?baud=3840

    ```


    However, you often need to specify the parity and flow-control settings. Flow-control
    settings include soft (or xoff), dtrsr, and hard (or rtscts). Use a + sign before
    each additional setting, as shown in the following example:


    ```

    serial:/dev/ttyS1?baud=38400+size=8+parity=none+flow=dtrsr

    ```


    SCSI printers are rare, but if you happen to find one, you can print to its generic
    SCSI device, as in this example:


    ```

    scsi:/dev/sg1

    ```'
