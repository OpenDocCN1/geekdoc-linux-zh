- img_proc: true
  md: 'Study the command. The xvf part specifies the mode and options; it is the same
    as -xvf. The meanings are as follows:


    +   - The x flag puts tar into extract (unpack) mode. You can extract individual
    parts of the archive by placing the names of the parts at the end of the command
    line, but you must know their exact names. To find out sure, see the table of
    contents mode described shortly.


    +   - The v flag activates verbose diagnostic output, causing tar to print the
    names of the files and directories in the archive when it encounters them. Adding
    another v causes tar to print details such as file size and permissions.


    +   - The f flag denotes the file option. The next argument in the command line
    must be the file which tar is to work (in the preceding example, it is file.tar).
    You must use this option and a filename at all — there is one exception, but it
    involves tape drives (see Section 13.6). To use standard input or output, use
    - instead of the filename.


    When using extract mode, remember that tar does not remove the archived .tar file
    after extracting its contents.


    Before unpacking, it''s usually a good idea to check the contents of a .tar file
    with the t (table of contents) mode instead of x. This mode verifies the archive''s
    basic integrity and prints the names of all files inside.


    The most important reason for testing an archive is that sometimes unpacking an
    archive can dump a huge mess of files into the current directory. This is difficult
    to clean up. You check an archive with the t mode, verify that everything is in
    a rational directory structure — that is, all filenames in the archive should
    start with the same directory. If you''re not sure, create a temporary directory,
    change to that, and then extract. You can always use mv ... if it turned out to
    be a false alarm.


    One last significant option to tar is p, which preserves permissions. Use this
    in extract to override your mask and get the exact permissions specified in the
    archive. The p option is the default when running as the superuser. If you''re
    having trouble with permissions and ownership when unpacking an archive as the
    superuser, make sure that you are waiting until the command terminates and you
    get the shell prompt back. Although you may only want to extract a small part
    of the archive, tar must run through the whole thing. You must not interrupt the
    process, because it sets the permissions only after checking the entire archive.


    You should commit all of the tar options and modes in this section to memory;
    if you''re having trouble, make some flash cards. This may sound like a grade-school
    strategy, but it is very important to avoid careless mistakes with this command.'
