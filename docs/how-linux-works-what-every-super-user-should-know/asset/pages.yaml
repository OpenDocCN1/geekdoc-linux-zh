  md: '# 9.2.4 Autoconf Log Files


    If something goes wrong during the configure process and the cause isn''t obvious,
    you can examine config.log to find the problem. Unfortunately, config.log is often
    a gigantic file, making it difficult to locate the exact source of the problem.


    The best approach is to go to the very end of config.log (for example, by pressing
    g in less), and then page back up until you see the problem. However, there is
    still a lot of stuff at the end, because configure dumps its entire environment
    there, including output variables, cache variables, and other definitions.


    You can also try running a search for the error message, starting from the end
    of the file. For example let''s say that configure fails, terminating with this
    message:


    ```

    `config.log` for more details.

    ```


    Search backward for the string "for more details" (or "config.log,") or anything
    that looks reasonably unique; it''s a pretty good bet that the error is nearby.


