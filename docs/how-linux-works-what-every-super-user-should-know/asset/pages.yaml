- img_proc: true
  md: '# 13


    # # BACKUPS


    There is no single system for backups on Linux. There are many different kinds
    of archiving programs and formats. You already saw tar, one of the most popular
    archivers, in Chapter 1. The good news is that there isn’t much more to making
    backups than what you already know; the bad news is that it’s not too clear how
    you should get the archive to the physical medium.


    This chapter takes you through the basics of backups: what data you need to back
    up, what backup devices are available, what types of backups you can make, how
    to use the most common archivers, and how to use tape drives.


    # ## 13.1 What Should You Back Up?


    Your backup priorities should be as follows:


    +   1. Home directories. Try to make daily backups of your home directories.

    2. System-specific configuration and data, such as the stuff in /etc and /var.
    This should include your machine’s list of installed packages.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '3. Locally installed software (for example, /usr/local). You don''t have to
    lose the work you put into custom software installations, to make a backup every
    now and then.


    4. System software from your distribution. This is really the least of your worries,
    which you can properly restore this part of the system by reinstalling the operating
    system. Furthermore, by the time your disk gets around to crashing so hard that
    you need to restore from backups, you probably need to install a newer version
    of the operating system anyway.


    # 13.2 Backup Hardware


    In the formative years of Unix, there was only one reasonable kind of backup hardware:
    the tape drive. Tapes were inexpensive compared to fixed storage (hard drives),
    they were fairly reliable, and they could be taken off-site for additional data
    security.


    However, hard disk technology has outpaced tape drive technology in the past ten
    years. For PCs, tape drives are expensive compared to hard disks (and the tapes
    themselves are also expensive). In addition, tape drive capacities are far smaller
    than the disks now on the market.


    There are currently two popular backup alternatives to tape drives:


    +   - CD- and DVD-R/RW drives

    - An extra hard disk (internal or external)


    Both of these work, but you need to improvise, because there aren''t any tried-and-true
    standard solutions for making backups to these devices. You still want to use
    a traditional backup utility (almost certainly tar) to create archives on the
    medium, but you need to find a way to manage the archives by yourself.


    That said, don''t count out the tape drive just. A significant portion of this
    chapter deals with tape drives.


    # 13.3 Full and Incremental Backups


    Before going into detail about backup hardware and archiving programs, you need
    to know about the two basic backup types:


    +   **Full backup** An archive of everything on a filesystem or directory

    **Incremental backup** An archive of all items that have changed since the last
    backup


    In large-scale operations, there are more kinds of backups, and you may hear of
    cumulative and differential backups. These are levels between incremental and
    full backups — that is, an incremental backup may contain all of the changes since
    the last differential backup, and the differential backup, in turn, could contain
    all changes since the last backup. However, for small systems where you do backups
    by hand, it is reasonable to deal only with full backups and the incremental backups
    that build on the full backups.'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'The advantage to incremental backups is that they usually finish quickly and
    do not require much storage space. However, over time, the difference between
    the last full backup and the current state on the disk gets to be so significant
    that these advantages dwindle: incremental backups start to take up as much space
    as full backups, and it can be very difficult to merge one full backup and a newer-incremental
    backup if you ever need to restore a full set of files from the backups. In particular,
    files that you intentionally deleted between the two backups can reappear. Therefore,
    you will need to do a full backup on a regular basis.


    Systems administrators generally keep a set of full and incremental backups so
    that they can restore files that may have only existed for a short period of time.
    For example, if you have daily incremental backups that go back 30 days and a
    full backup from at least 30 days ago, you can restore any file that was on the
    filesystem at backup time during that period. Of course, if you don''t know the
    exact dates, finding the file can take a little time.


    To restore a complete set of files, you need to extract the latest backup first,
    then the latest incremental backup (unless, of course, the full backup is by chance
    newer than the incremental backup).


    # 13.4 Using tar for Backups and Restores


    In Section 1.18, you learned the basics of tar. It turns out, you already know
    nearly all you need in order to do manual backups. If you want a comprehensive
    list of tar options, you can look at the (gigantic) GNU info documents. However,
    the good news is that you don''t need to know many options, and after reading
    this section, you should only need tar --help every now and then as a refresher.


    # 13.4.1 Creating Archives


    With processors as fast as they are, and disks getting even larger, it doesn''t
    make much sense to omit compression for any archive. Recall that you can create
    a compressed archive of a directory with one command:


    ```

    tar zcvf archive directory

    ```


    A large part of making a backup is figuring out where to put the archive. There
    are a few choices here:


    +   - For tape drives, see Section 13.6.2 for how to write the archive to the
    tape device.

    - For backing up a spare disk, you can write the archive as a file on the disk''s
    filesystem.

    - If you need to pipe the output to standard output (to feed it to another command,
    such as cdrecord), - use as the archive name.'
  merge: -1
  pgno: 288
- img_proc: true
  md: 'Here are some options to consider when running GNU tar:


    +   --exclude file Exclude file from the archive.

    --exclude-from file Doesn''t include in the archive any of the files listed in
    file.

    --one-file-system Archives files from inside a single filesystem. This is handy
    for backing up partitions.

    --absolute-paths Doesn''t strip the leading / from an absolute pathname. This
    has its uses, but only if you know what you''re doing.

    --listed-incremental file Uses file as the incremental state file (see Section
    13.4.2).


    One tricky part about adding these options to a traditional tar command is that
    you must insert a - in front of the regular one-character options. Therefore,
    if you want to create an archive of the device directory, exclude misc/scratch,
    you would have to run the following with -zcvf rather than with zcv, as you saw
    in the previous example. Here''s how it would look:


    ```

    tar exclude misc/scratch -zcvf archive misc

    ```


    > Remember that tar strips the leading / from an absolute pathname (unless you
    specify the --absolute-paths parameter). Therefore, to exclude an item, you must
    match the path that goes into the archive, not necessarily the one on the system.
    Let''s say that you wanted to create an archive of / without /usr. You must remove
    the / by yourself:


    ```

    tar --exclude usr -zcvf archive /

    ```


    # 13.4.2 Incremental Backups with tar


    To enable incremental backups with GNU tar, you need to create an incremental
    state file that contains information about each newly archived file. Here''s how
    to do it:


    +   1. Run the following command to make a full backup in full_archive (state_file
    is the name of the state file; you must choose your name):


    ```

    tar --listed-incremental state_file -zcvf full_archive file ...

    ```


    +   2. Make a copy of the original state file. For example:


    ```

    cp state_file state_file_incr

    ```


    +   3. When it is time to make an incremental backup, run the same tar command
    as earlier, but with the state file copy that you created in step 2, state_file_incr:'
  merge: -1
  pgno: 289
- img_proc: true
  md: '```

    tar --listed-incremental state_file_incr -zcvf incremental_archive_file1 ...

    ```


    This should produce a much smaller archive than the full backup, because tar compares
    the time(s) listed in state_file_incr (remember), it''s a copy of the original
    state_file against the modification times of the current files on the disk.


    +   4. Repeat steps 2 and 3 for subsequent incremental backups.

    5. To do another full backup, delete or rename state_file and start at step 1.


    You need to make a copy of the original state file before each incremental backup
    because GNU tar updates the file specified with --listed-incremental after its
    run. If you were to perform backups with the same state file over and over again,
    the incremental backups would only record the changes since the last incremental
    backup, not since the last backup. Although this would yield a complete set of
    changes, it would also make it nearly impossible to find a file inside a set of
    incremental backups. Furthermore, to do a complete restore, you would need to
    use all of your incremental backups.


    > NOTE Remember incremental backups are only good when accompanied by the previous
    full backup. Make sure that you don''t overwrite your full backup with an incremental
    backup.


    # 13.4.3 Extracting Archives


    Recall from Section 1.18.13 that you can extract files from a compressed archive
    as follows:


    ```

    tar xvf archive

    ```


    By default, tar extracts all files in the archive. However, you can limit the
    extraction to specific files and directories by adding their names to the end
    of the command line (you may need to run tar zzvf to get a list of filenames):


    ```

    tar xvf archive file1 file2 ...

    ```


    When extracting system files and home directories as root (for example, from a
    restore or when moving things around), it is critical that you use the p option
    to preserve the original permissions:


    ```

    tar xvpf archive

    ```


    Otherwise, tar creates files using the current permissions mask (umask). This
    can be annoying at the very least, and could cause your system to malfunction
    at the worst.'
