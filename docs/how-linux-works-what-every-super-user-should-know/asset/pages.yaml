    # 7.10.2 awk


    You may have seen the awk command already. This is not a simple single-purpose
    command — it''s a powerful programming language. Perhaps unfortunately, awk is
    now something of a lost art due to larger languages such as Perl.


    However, entire books do exist on the subject of awk, including The AWK Programming
    Language [Aho 1988]. This said, you will see many, many people use awk to pick
    a single field out of an input stream like this:


    ```

    ls -1 | awk ''{print $5}''

    ```


    This command prints the fifth field of the 1s output (the file size); the result
    is a list of file sizes.


    # 7.10.3 sed


    sed stands for stream editor, and it is an automatic text editor that takes an
    input stream (a file or the standard input), alters it according to some expression,
    and prints the results to standard output. In many respects, sed is somewhat similar
    to ed, the original Unix text editor. It has dozens of operations, matching tools,
    and addressing capabilities. Like awk, there are books about sed, including one
    that covers both sed & awk [Dougherty].


    Although sed is a big program, an in-depth analysis is beyond the scope of this
    book, it''s easy to see how it works. In general, sed takes an address and an
    operation as one argument. The address is a set of lines, and the command determines
    what to do with the lines.


    For example, the following command reads /etc/passwd, deletes lines three through
    six and sends the result to the standard output:


    ```

    sed 3,6 /etc/passwd

    ```


    In this example, 3,6 is the address (a range of lines), and d is the operation
    (delete). If you omit the address, sed operates on all lines in its input stream.
    The two most common sed operations are s (search and replace) and d.


    Let''s go through a few more sed examples. In all of the examples, single quotes
    are necessary to prevent the shell from expanding special characters like * and
    $.'
  merge: -1
  pgno: 177
- img_proc: true
  md: 'The following command replaces the regular expression exp with text (see Section
    1.5.1 for basic information on regular expressions):


    ```

    sed /s/exp/text/

    ```


    The preceding command replaces only one instance of the expression exp per line.
    To replace all instances of exp, use the g modifier at the end of the operation:


    ```

    sed /s/exp/text/g

    ```


    You can also use a regular expression as the address. The following command deletes
    any line that matches the regular expression exp:


    ```

    sed ''/exp/d''

    ```


    # 7.10.4 xargs


    If you ever have to run one command on a huge number of files, the command or
    shell sometimes responds that it can''t fit all of the arguments in its buffer.
    Use xargs to get around this problem. xargs runs a command on each filename in
    its standard input stream.


    Many people use xargs in conjunction with the find command. Here is an example
    that can help you verify that every file in the current directory tree that ends
    with .gif is actually in the GIF format:


    ```

    find -name ''*.gif'' -print | xargs file

    ```


    In the preceding example, xargs runs the file command. However, this invocation
    can cause errors or leave your system open to security problems, because filenames
    can include spaces and newlines. If you are writing a script or need extra security,
    use the following form instead, which changes the find output separator and the
    xargs argument delimiter from a newline to a NULL character:


    ```

    find -name ''*.gif'' -print0 | xargs -0 file

    ```


    Keep in mind that if you have a large list of files, xargs starts a lot of processes.
    Don''t expect great performance.


    > You may need to add two hyphens (--) to the end of your xargs command if there
    is a possibility that any of the target files starts with -. The -- is a way to
    tell a program that any arguments that follow the -- are filenames, not options.
    However, keep in mind that not all programs support --'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# 7.10.5 expr


    If you need arithmetic operations in your shell scripts, the expr command can
    help you (and even do some string operations). The command expr 1 + 2 prints 3;
    run expr --help for a full list of operations.


    expr is a clumsy, slow way of doing math. If you find yourself using expr frequently,
    it probably means that you should be using a language like Perl, Python, or awk
    instead of a shell script.


    # 7.10.6 exec


    The exec command is the built-in shell feature that replaces the current shell
    process with the program you name after exec. This is a feature for saving system
    resources, but remember that there''s no return; once you run exec in a shell
    script, the script and shell running it are gone, replaced by the new command.


    You can test it in a shell window. Try running cat. After you press CONTROL-D
    or CONTROL-C to terminate the cat program, your window disappears because its
    child process no longer exists.


    # 7.11 Subshells


    Sometimes you need to alter the environment in a shell slightly, but don''t want
    a permanent change. You can change and restore a part of the environment (such
    as the path or working directory) using shell variables, but is a clumsy way to
    go about things. The way is to use a subshell, an entirely new shell process that
    you can create for the purpose of running a command or two. The new shell has
    a copy of the original shell''s environment, and when the new shell exits, any
    changes you made to that shell environment disappear, leaving the initial shell
    to as normal.


    To use a subshell, put the commands to be executed by the subshell in parentheses.
    For example, the following line executes the command uglyprogram in uglydir, leaving
    the original shell intact:


    ```

    (cd uglydir)

    ```


    Here''s another example, showing how to add a component to the path that might
    cause a permanent change:


    ```

    (PATH=/usr/confusing:$PATH; uglyprogram)

    ```


    Pipes and background processes work with subshells. The following example uses
    tar to make an archive of the entire directory tree within orig and then unpacks
    the archive into the new directory target, effectively duplicating the files and
    folders in orig:'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'tar cf -orig | (cd target; xvf -)


    **WARNING** Double-check this sort of command before you run it, because you want
    to make sure that the target directory exists and is completely separate from
    the orig directory.


    # 7.12 Including Other Files in Scripts


    If you need to include another file in your shell script, use the . operator.
    For example, this runs the commands in the file config.sh:


    +   - config.sh


    This "include" syntax does not start a subshell, and it can be useful for a group
    of scripts that need to use a single configuration file.


    # 7.13 Reading User Input


    The read command reads a line of text from the standard input and stores the text
    in a variable. For example, the following command stores the input in $var:


    ```

    read var

    ```


    This is a built-in shell command. It''s useful to a certain extent, and when used
    in conjunction with other shell features not mentioned in this book, you can do
    some more interesting things, but at a certain point you have to ask yourself
    when enough is enough.


    # 7.14 Too Much?


    The shell is so feature-rich that it''s difficult to condense its important elements
    into a single chapter. If you''re interested in what else the shell can do, you
    might want to look at some of the books on shell programming, such as Unix Shell
    Programming [Kochan], or the shell script discussion in the UNIX Programming Environment
    [Kernighan].


    Above all, remember what shell scripts do best — manipulate files and commands.
    If you find yourself writing something that looks convoluted, especially if it
    involves string or arithmetic operations, you should probably look to a scripting
    language like Perl, Python, or awk.'
  merge: -1
  pgno: 180
