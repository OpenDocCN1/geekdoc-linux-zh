    You may need to experiment with the speed option to crecord, because the archiving
    command might not produce data fast enough for your recorder.

    Again, remember that this command does not create a filesystem on the disc. To
    read from the archive, you can just use the device.


    # ## 13.5.1 Backups to Hard Disks


    Using a spare hard disk for backups is relatively easy. Create a regular filesystem
    on the disk and simply write your archives as regular files. You should be able
    to keep a fair amount of data on the spare disk if you use compression and incremental
    backups.


    # # 13.6 Tape Drive Devices


    Tape devices are character devices on a Linux system, going by a variety of filenames:


    +   - SCSI tapes use the names /dev/st0, /dev/nst0, /dev/st1, /dev/nst1, and so
    on. The SCSI tape drive interface and driver is widely regarded as the most reliable,
    but, of course, SCSI tape drives are also more expensive than others.

    - ATAPI tape devices start at /dev/htp0 and /dev/nht0.

    - There is limited support for tape drives on the floppy controller at /dev/ft0
    and /dev/nft0.


    To identify a tape drive, look in your kernel messages for lines like this:'
