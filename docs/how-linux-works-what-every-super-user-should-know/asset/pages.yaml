- img_proc: true
  md: '# Sound


    There are two parts to sound configuration: API support and drivers. The current
    sound system is called Advanced Linux Sound Architecture (ALSA), but you should
    also include the emulation support for the old OSS (Open Sound System), because
    many programs still use the OSS interface.


    The driver configuration for sound devices is very similar to that for network
    devices — many of the sound drivers carry the names of the sound chipset.


    # USB Support


    When configuring USB, choose an interface driver first:


    +   - UHCI and OHCI are USB 1.1 interfaces. Even if you have a USB 2.0 motherboard,
    you need one of these. If you don''t know which one your motherboard supports,
    pick both (modules are okay); the kernel will sort it out.

    - EHCI is a USB 2.0 interface.


    You also want to enable the USB device filesystem option that can maintain USB
    device information in /proc/bus/usb.


    Configuring the kernel to support USB devices is fairly straightforward, but there
    are two gotchas:


    +   - The Mass storage support option requires that you also enable SCSI and SCSI
    disk support.

    - The Interface device support (HID) option requires that you enable the input
    drivers described earlier. To get USB mouse and keyboard support, you need to
    enable HID input layer support in the USB support menu. Don''t use the boot protocol
    unless you know exactly what you''re doing.


    # Filesystems


    You can add support for many different filesystems to your Linux kernel configuration.
    However, make sure that you compile your primary filesystem directly into the
    kernel. For example, if your root partition uses ext2, don''t modularize ext2
    support. Otherwise, your system will not be able to mount the root filesystem
    and therefore will not boot.


    These are the most important filesystems:


    +   - Second extended (ext2) The Linux standard for many years.


    +   - Third extended (ext3) A journaled version of ext2; now the standard for
    many distributions.


    +   - Reiserfs A high-performance journaled filesystem.'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'DOS/FAT/NT MS-DOS- and Windows-compatible filesystems. For the get MS-DOS filesystem
    support, you need to enable FAT. VFAT is the extended filesystem introduced with
    Windows 95. You need VFAT if you plan to read images from the flash memory cards
    in digital cameras and similar devices.


    **ISO8660** A standard CD-ROM filesystem. The Linux driver includes the Rock Ridge
    extensions. You can also add the Microsoft Joliet extensions.


    **UDF** A newer CD-ROM and DVD filesystem.


    **Minix** A filesystem that was the Linux standard a long time ago (it predates
    Linux). It never hurts to include Minix filesystem support as a module.


    **Pseudo filesystems** These are system interfaces, not storage mechanisms. The
    /proc filesystem is one of the best-known pseudo-filesystems, and one that you
    should always configure. You should also include the /dev/pts filesystem and the
    virtual memory filesystem.


    **Network filesystems** These are used for sharing files with machines over the
    network.


    There are also couple important filesystem-related options:


    +   **Kernel automounter** Enables automatic filesystem mounting and unmounting.
    This is a popular solution for managing network file access.


    +   **Partition types** Allows Linux to read partitioning schemes other than the
    regular PC partition tables, including BSD disklabels and Solaris x86 partitions.


    This wraps up the important kernel configuration options. You shouldn''t really
    have to worry about the other options (such as the Profiling support for kernel
    development); let''s turn our focus to compiling the kernel.


    # 10.4.2 Compiling the Kernel and Modules


    After save your kernel configuration, you''re ready to build the kernel. To get
    a list of make targets, you can run this command:


    ```

    make bImage

    ```


    Your main goals are to compile the bImage compressed kernel image and the kernel
    modules. Because these two are the default targets, you only need to run the following
    to build everything:


    ```

    make

    ```'
