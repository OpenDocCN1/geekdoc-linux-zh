  md: '# 2

    DEVICES, DISKS,

    FILESYSTEMS,

    AND THE KERNEL


    This chapter is a guided tour of the infrastructure in a functioning Linux system,
    including the system directories, devices, and the kernel. A large part of the
    material in this chapter deals with filesystems. When you master the workings
    of Linux filesystems, you will find it much easier to deal with system crashes,
    manage software, and accommodate new hardware.


    > NOTE You must do most system configuration and maintenance work as the superuser;
    this and all remaining chapters assume that you have this capability.'
