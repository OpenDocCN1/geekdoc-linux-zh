  md: '# 4.8.1 Finding Open Files with lsof


    The lsof command lists open files and the processes that are using these open
    files. Because Unix places such a great emphasis on files, lsof is among the most
    useful tools for finding trouble spots. lsof does not stop at regular files —
    it can list network sockets, dynamic libraries, pipes, and more.


    Running lsof on the command line usually produces a tremendous amount of output.
    There is a fragment of what you might see:


    COMMAND PID FD TYPE SIZE DEVICE NODE NAME

    init 1 root cwd DIR 3,1 4096 2 /

    init 1 root rtd DIR 3,1 4096 2 /

    init 1 root txt REG 3,1 24480 16212 /sbin/init

    init 1 root mem REG 3,1 999542 32329 /lib/ld-linux.2.3.2.so

    init 1 root mem REG 3,1 125176 32208 /lib/libc-2.3.2.so

    init 1 root 10u FIFO 3,1 97634 /dev/devinittctl


    vi 3511 user cwd DIR 3,4 4096 163866 /home/ouser/w

    vi 3511 user rtd DIR 3,1 4096 2 /

    vi 3511 user txt REG 3,3 327048 561520 /usr/bin/vi


    vi 3511 user 3w REG 3,4 18993 163867 /home/ouser/w


    The fields in this output are follows:


    +   **COMMAND** The command name for the process that holds the file descriptor.

    **PID** The process ID.

    **USER** The user running the process.

    **FD** The file descriptor or the number that a process uses in conjunction with
    the system libraries to identify and manipulate a file.

    **TYPE** The file type (regular, directory, socket, etc.).

    **DEVICE** The major and minor number of the device that holds the file.

    **SIZE** The file''s size.

    **NODE** The file''s inode number.

    **NAME** The filename.


    The lsof(1) manual page contains a full list of what you might see for each field,
    but you should be able to guess just by looking at the output. For example, look
    at the entries with `cwd` in the FD field. These lines indicate current working
    directories of the processes. Another example is the very last line, showing a
    file that the user is currently editing with vi.


    There are two approaches to running lsof:'
  merge: -1
  pgno: 96
