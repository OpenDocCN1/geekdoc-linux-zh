    Many dial-up ISPs require that logins use PAP (Password Authentication Protocol)
    or CHAP (Challenge Handshake Authentication Protocol). If your ISP has such a
    requirement, get started by adding the following entry for your username to the
    end of the /etc/ppp/peers/name options file from 5.8.2:


    ```

    name username

