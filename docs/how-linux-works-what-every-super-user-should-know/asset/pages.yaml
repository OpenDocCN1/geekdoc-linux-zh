- img_proc: true
  md: '+   - A graphics card.

    - A case to hold the components. The case usually includes a power supply.


    # 17.1.1 Processor and Motherboard


    Virtually all IA32-like (x86 PC) central processing unit (CPU) models work with
    Linux. The kernel and gcc compiler support may many vendor-specific CPU optimizations,
    and features such as multiprocessing also work well with Linux.


    Two important considerations when choosing a processor should be power consumption
    and heat. CPUs that consume more power also generate a substantial amount of heat.
    To handle the extra heat, you need a lot of fans. Never overclock a processor
    running Linux, unless you like to see your computer crash.


    If you are interested in taming the usual din that a computer makes, a great place
    to start is the power supply. Most power supply units with PC cases are of the
    cheapest sort, with loud, unreliable cooling fans. You can easily replace the
    power supply with a low-noise premium model from a third party. It will not be
    cheap, but if noise irritates you, it is worth every penny.


    Although nearly all CPU models work with Linux, some care be taken when choosing
    the CPU''s home — the motherboard. You should consider your motherboard, processor,
    and memory as a single unit, and you may even want to choose your motherboard
    first and find a CPU to fit. After all, it is possible that your motherboard will
    cost more than the CPU! Pick a motherboard that has been available for a reasonable
    amount of time. Three or four months should be sufficient. Often, initial releases
    of Linux dont immediately support each bell and whistle that comes off the assembly
    line, and these unusual features may interfere with normal system operation. Watch
    out for brand-new processor models that require you to purchase a new motherboard
    chipset, as these can be expensive nightmares.


    Modern motherboards come with a number of integrated peripherals. They normally
    include two ATA disk interfaces, plus parallel, and USB ports. Some motherboards
    come with additional hardware, such as integrated SCSI controllers, video chips,
    and sound. These integrated features can save you space on the motherboard and
    the hassle of installing your own components, but if you buy plug-in components,
    you can perhaps save a little money and a compatibility headache. The advantages
    of integrated motherboard components are somewhat dubious in the case of most
    components except SCSI controllers. If many people, you choose a motherboard with
    integrated video, find out what chip it uses and make certain that the XFree8
    server has support for it (see http://www.xfree8.org/ and http://www.xouvert.org/).


    NOTE'
