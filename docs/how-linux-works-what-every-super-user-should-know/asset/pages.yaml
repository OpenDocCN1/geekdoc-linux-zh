    For instance, Linux uses /cdrom as a mount point for CD-ROM devices. The mount
    point need not be directly below ; it may be anywhere on the system.


    When mounting a filesystem, the common terminology is "mount a device point."
    To learn the current filesystem status of your system, run the output looks like
