- img_proc: true
  md: '# ### 1.18.1 Compressed Archives (.tar.gz)


    Many beginners find it confusing that archives normally come compressed, where
    archive file ends in .tar.gz. To unpack a compressed archive, work from the right
    side to the left; get rid of the .gz first and then worry about the .tar. For
    example, these two commands decompress and unpack file.tar.gz:


    ```

    gunzip file.tar.gz

    tar xvf file.tar

    ```


    When you''re starting out, it''s fine to do this one step at a time, first running
    gunzip to decompress and then tar to verify and unpack. When you do enough, you
    soon memorize the entire archiving and compression process. However this is not
    the fastest or most efficient way to invoke tar on a compressed archive. In particular,
    it wastes system resources — disk space and kernel I/O time.


    You can combine archival and compression functions with a pipeline; for example,
    this command unpack file.tar.gz:


    ```

    zcat file.tar.gz | tar xvf -

    ```


    zcat is the same as gunzip -dc. The -d option decompresses and the -c option sends
    the result to standard output (in this case, to the tar command).


    Because this is a common operation, the version of tar with Linux has a shortcut.
    You can use z as an option to automatically invoke gunzip on the archive. For
    example, use tar ztvf file.tar.gz to verify a compressed archive. However, for
    the sake of learning, you should make an effort to master the longer form before
    taking the shortcut.


    > NOTE A .tgz file is the same as a .tar.gz file. The name is meant to fit into
    FAT (MS-DOS based systems).


    # ### 1.18.2 Other Compression Utilities


    A newer compression program gaining some popularity in Unix is bzip2, where compressed
    files end with .bz2. Marginally slower than gzip, it often compresses files a
    little more, and is therefore increasingly popular in the distribution of source
    code. The decompressing program is bzip2, and the options of both components are
    close to those of gzip that you dont need to learn anything new.


    Most Linux distributions come with zip and unzip programs compatible with the
    ZIP archives on Windows systems. They work on the usual .zip files as well as
    self-extracting archives ending in .exe.


    If you encounter a file that ends in .Z, you have found a relic created by the
    compress program, once the Unix standard. gunzip can unpack these files, but gzip
    will not create them.'
  merge: -1
