    #  4.10 Monitoring System Performance


    Most Linux systems behave well under a distribution''s default settings, and you
    can spend hours and days trying to tune your machine''s performance without attaining
    any meaningful results. Sometimes performance can be improved, though, and this
    section concentrates primarily on memory and processor performance, and looks
    at how you can find out if a hardware upgrade might be worthwhile.


    The two most important things that you should know about performance on your system
    are the load average and the system''s swap/page fault behavior. The load average
    is the number of processes currently ready to run. The uptime command tells you
    load averages in addition to how long the kernel has been running:


    +   - up 91 days, ... load average: 0.08, 0.03, 0.01


    The three numbers are the load averages for the past minute, 5 minutes, and 15
    minutes. As you can see, this system isn''t very busy, because the processor has
    been running at 1 percent capacity for the past quarter hour (the last number
    is 0.01). Most systems exhibit a load average of 0 when you''re doing anything
    except compiling a program or playing a game. A load average of 0 is usually a
    good sign, because it means your processor isn''t being challenged, and you''re
    saving power by not running a silly screensaver.


    If the load average is around 1, it''s not necessarily a bad thing; it simply
    means that the processor has something to do for all the time — you can find the
    process currently using most of the CPU time with the top command. If the load
    average goes near 2 or above, multiple processes are starting to interfere with
    each other, and the kernel is trying to divide the CPU resources evenly. Unless,
    of course, you have two processors, in which case, a load average of 2 means that
    both processors have just enough to do all of the.


    A high load average does not necessarily mean that your system is having trouble.
    A system with enough memory and I/O resources can easily handle many running processes.
    Don''t panic if your load average is high and your system still responds. The
    system is just running a lot of processes.


    Essential System Files, Servers, and Utilities 81'
