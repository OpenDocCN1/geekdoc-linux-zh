  md: '# 4.5 Setting the Time


    A well-functioning Unix machine depends on accurate timekeeping. The kernel is
    responsible for maintaining the system clock, the clock consulted when you run
    commands such as date. You can also set the system clock with the date command,
    but this is usually a a bad idea, because you''ll never get the time exactly right.
    You want your system clock to be very close to the correct time.


    PC hardware has a battery-backed "real-time" clock. It''s not the greatest clock
    in the world, but it''s better than nothing. The kernel usually sets its time
    based on this clock at boot time, and you can reset the system clock to the current
    hardware time with hwclock. If your hardware clock is in UTC (Universal Coordinated
    Time, or Greenwich Mean Time), run this command:


    ```

    hwclock --hctos --utc

    ```


    You should try to keep your hardware clock in UTC to avoid any trouble with time
    zone or daylight savings time corrections. However, if you insist on keeping the
    hardware clock set to the local time, run this command:


    ```

    hwclock --hctos --localtime

    ```


    Unfortunately, the kernel isn''t terribly good at keeping time, because Unix machines
    often stay up for months and years, and they tend to develop a drift. In addition,
    it''s fairly rude to make the system clock jump ahead or back by running hwclock
    on a frequent basis; time-based system events can get lost or merged. If you want
    to gradually change the system clock based on the hardware clock, run this command:


    ```

    adjtimex --adjust

    ```


    However, this is only good for updating the clock manually when it has already
    drifted. To keep the time up to date, you need to run a network time daemon (see
    Section 4.5.2).


    # 4.5.1 Time Zones


    The system clock runs in UTC. System libraries convert this into local time and
    compensate for daylight savings time and any other strange circumstances (such
    as living in Indiana).


    To set your system''s time zone, make a symbolic link to the appropriate time
    zone file in /usr/share/zoneinfo from /etc/localtime. For example, here is the
    command to configure a United States Pacific Time Zone setting:


    ```

    ln -sf /usr/share/zoneinfo/US/Pacific /etc/localtime

    ```'
  merge: -1
  pgno: 91
