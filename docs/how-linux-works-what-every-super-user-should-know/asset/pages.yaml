    - Day of month (1–31)

    - Month (1–12)

    - Day of week (0–7; 0 and 7 are Sunday


    ![](img/969dbb62afa2179379a21a5f06798aaf_93_0.png)


    Figure-4-3: An entry in the crontab file.


    The preceding example says to run spmake daily, because the day of month, month,
    and day of week fields are all * (the * character matches all possible values,
    meaning every day of the month, every month, or every day of the week). If you
    want to run the job only on the 14th of each month, use this crontab line:


    ```

    15 09 * * * /home/juser/bin/spmake

    ```


    You may select more than one time for each field. For example, if you would like
    the program to run on the 5th as well as the 14th, use 5,14 in the third field:


    ```

    15 09 5,14 * * /home/juser/bin/spmake

    ```


    The remainder of the line is the command to run. When cron runs the job, the command
    may generate standard output or error or exit abnormally. If that happens, cron
    mails this information to you. You may want to redirect the output to /dev/null
    or some log file if you find this annoying.


    The crontab(5) manual page is a full reference for the cron file format. However,
    there is also a crontab(1) manual page for the installation utility, so you willll
    need to use man 5 crontab to get the right one.'
