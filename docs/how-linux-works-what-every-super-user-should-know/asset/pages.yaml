    if necessary). After logging in, keep going (you might need to type ppp or something
    similar) until you get "garbage" mentioned in the previous step. In this case,
    you probably do not need to use PAP or CHAP.


    7. Exit minicom by pressing CONTROL-A, then x. If minicom hangs when you''re trying
    to exit, you can wait a little while to see if it times out, or you can be impatient,
    open another window, and use kill -KILL the minicom process.


    When interacting with the modem and remote server, take careful notes of all the
    settings you used, what you had to type, and the responses you got back. You''ll
    need this information to write a chat script.


    # 5.8.2 Starting pppd with Options Files


    Now that you know how to log in to your ISP''s server manually, you can create
    a configuration file containing the same connection settings you used with minicom
    -s. This allows you to make pppd dial the telephone number automatically.


    Pick a name for the ISP and create an options file called /etc/ppp/peers/name,
    with the following lines:


    ```

    ttyS1 115200 crtscs

    connect ''/usr/sbin/chat -v /etc/ppp/chat-name''

    noauth

    defaultroute

    mru 1500

    ```'
