  md: '# 16


    # USER ENVIRONMENTS


    This book’s focus is on the Linux system that normally lies underneath a user’s
    interactive session. Eventually, the system and the user have to meet somewhere.
    You saw plenty of commands and shell features in Chapter 1 and Chapter 7, but
    there’s still one little piece missing: the startup files that set defaults for
    the shell and other programs.


    Most users do not pay close attention to their startup files. Over time, the files
    become cluttered, containing unnecessary environment variables and tests that
    can lead to annoying (or quite serious) problems. Worse still, operating system
    vendors usually do not consider the consequences of what they put in the default
    startup files, packing them full of items that may even confuse the user.

    Keeping in tune with the shell-oriented theme of this book, this chapter focuses
    specifically on startup files. If you have ever received a Unix account in the
    past, it may have come with a bafflingly array of startup files, sometimes dot
    files because they nearly always start with a dot (.). You may be surprised to
    learn that it really isn’t necessary to have so many startup files.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# 16.1 Appropriate Startup Files


    When designing startup files, you should keep the user in mind. If you are the
    only user on a machine, you don''t have much to worry about — if you make an error,
    you''re the only one affected, and it''s easy to fix. However, if your new startup
    files are to be the defaults for all new users on a machine or network, or if
    you think that someone might copy your files for using a different machine, your
    task becomes considerably more difficult. If you make an error in a startup file
    for ten users, you might end up fixing this error ten times. That''s annoying,
    to say the least.


    There are two essential goals to keep in mind when creating startup files for
    other users:


    +   **Simplicity** Keep the number of startup files small, and the files as small
    and simple as possible so that they are easy to modify but hard to break. Each
    item in a startup file is just one more thing that can break.


    +   **Readability** Use many comments in the files, so that the users get a good
    picture of what each part of a file does.


    # 16.2 Shell Startup File Elements


    What goes into a shell startup file? Some things may seem obvious, such as the
    path and a prompt setting. But wait, what exactly *should* be in the path, and
    what does a reasonable prompt look like? And how much is too much to put in a
    startup file?


    The next few sections outline the essentials of a shell startup file, covering
    the command path, manual page path, prompt, aliases, and permissions mask.


    # 16.2.1 The Command Path


    The most important part of any shell startup file is the command path. The path
    should cover the directories that contain every application of any general interest
    to a regular user. At the very least, the path should contain these components,
    in this order:


    ```

    /usr/local/bin

    /usr/bin

    /usr/X11R/bin

    /bin

    ```


    This order ensures that you can override standard default programs with specific
    program variants located in /usr/local.

    It''s important to make every general-use program on the system available through
    one of the directories listed above (for example, using the Encap system described
    in Section 9.4). If the general-use programs are located in more than just these
    four directories, it probably means that your system is getting out of control.
    Don''t change the path in your user environment to'
  merge: -1
  pgno: 323
- img_proc: true
  md: 'accommodate a new system directory. In fact, in the interest of minimizing
    the number of directories in the command path, some administrators prefer to fold
    the programs in /usr/X1R6/bin into /usr/local/bin or /usr/bin with the help of
    symbolic links or a different installation prefix.


    Many users use a bin directory to store their shell scripts and programs, so you
    may want to add this to the front of the path:


    ```

    $HOME/bin

    ```


    If you are interested in systems utilities (such as traceroute, ping, and lsmod),
    add the sbin directories to your path:


    ```

    /usr/local/sbin

    /usr/sbin

    /sbin

    ```


    # Adding Dot (.) to the Path


    There is one but controversial command path component to discuss: the dot. Placing
    a dot (.) in your path allows you to run programs in the current directory without
    using ./ in front of the program name. This may seem convenient when writing scripts
    or compiling programs, but it is a bad idea for two reasons:


    +   - It can be a security problem. You should never put a dot at the front of
    the path. For example, an attacker could put a Trojan horse in an archive distributed
    on the Internet. Even if a dot is at the end of the path, you are still vulnerable
    to typos such as s1.

    - It is inconsistent and can be confusing. A dot in the path can mean that a command''s
    behavior can change according to the current directory.


    # 16.2 The Manual Page Path


    Your manual (the MANPATH environment variable used by man) should match your command
    path, except that each directory in the manual path variable should end in a /man
    directory rather than /bin.


    Here is the manual page path that corresponds to the command path listed in Section
    16.2.1:


    ```

    /usr/local/man:/usr/man:/usr/X1R6/man:$HOME/man

    ```


    # 16.2.3 The Prompt


    Avoid a long, complicated, useless prompt. For whatever reason, many administrators
    feel the need to drag in everything, including the kitchen sink. Just because
    you can place the current working directory, hostname, username, and fancy decorations
    in a prompt, it doesn''t mean that you should.'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'Above all, avoid strange characters, such as these:


    ```

    { } = & <

    ```


    **NOTE** Take special care to avoid>. This can cause erratic, empty files to appear
    in your current directory if you accidentally copy and paste a section of your
    shell window, because `>` redirects output from a file.


    Even a shell''s default prompt isn''t ideal. For example, the default bash prompt
    contains the shell name and version number, and the default tsh prompt includes
    the hostname, the current working directory, and a >.


    Here is a simple prompt setting for bash that ends with the customary $ (the traditional
    tsh prompt ends with %):


    The \u is a substitution for the current username (see the PROMPING section of
    the bash manual page). Other popular substitutions include the following:


    +   - \h The hostname (the short form, without domain names)

    - \! The history number

    - \w The current directory (this can become somewhat long; you can display only
    the final component with \w)

    - \$ if running as a user account, and # if root


    # 16.2.4 Aliases


    Among the stickier points of modern user environments is the role of aliases,
    a shell feature that substitutes one string for another before executing a command.
    At one time, these were efficient shortcuts intended to save some time typing.
    However, aliases also have these drawbacks:


    +   - They have bulky syntax, especially when manipulating arguments.

    - They are confusing; a shell''s built-in which command can tell you something
    is an alias, but it won''t tell you where it was defined.

    - They are frowned upon subshells and non-interactive shells; they do not work
    in other shells.


    With all of these disadvantages, it makes sense to avoid aliases whenever possible,
    because it''s easier to write a shell script (see Chapter 7). Modern computers
    can start and execute shells so quickly that the difference between an alias and
    an entirely new command should not mean anything to you.


    However, there is one particular instance where aliases do come in handy — when
    you wish to alter part of the shell''s environment. You can''t change an environment
    variable with a shell script, because scripts run as subshells.


    306 Chapter 16'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# 16.2.5 The Permissions Mask


    As described in Section 1.17.1, a shell''s built-in umask (permissions mask) sets
    your default permissions. You should run umask in one of your startup files to
    make certain that any program you create files with your desired permissions.
    However, you may wonder what the best choice is, especially if you have a standalone
    machine with no other users.

    The two reasonable choices break down as follows:


    +   **077** This is the most restrictive permissions mask; it does not give any
    other users access to new files and directories. This is appropriate on a multi-user
    system where you do not want other users to look at any of your files.

    **022** Gives other users read access to new files and directories. This is more
    useful than what you may initially presume on a single-user system, because many
    daemons run as pseudo-users would not be able to see files and directories created
    with the more restrictive 077.


    > Certain applications (mail programs in particular) override the umask, changing
    it to 077 because they feel that their files are the business of no one but the
    file owner.


    # 16.3 Startup File Order and Examples


    Now that you know what to put into shell startup files, it''s time to see some
    specific examples. Surprisingly, one of the most difficult and confusing parts
    of creating startup files is determining which of several startup files to use.
    The next sections cover the two most popular Unix shells, bash and tc.


    # 16.3.1 The bash shell


    In bash, you have these startup filenames to choose from: .bash_profile, .profile,
    .bash_login, and .bashrc. Which of these is appropriate to use for your command
    path, manual page path, prompt, aliases, and permissions mask? The answer is that
    you should have a .bashrc file accompanied by a .bash_profile symbolic link pointing
    to .bashrc.


    The reason for this setup is that there are several different kinds of shell instance
    types, as follows:


    +   **Interactive shell** The is the type of shell that you use to run commands
    from a terminal. There are two subtypes of interactive shells:


    +   Login shell This is traditionally invoked by /bin/login; for example, when
    getty or ssh starts /bin/login. The exact circumstances that determine an interactive
    shell are a little strange (the first character of a login shell''s invocation
    name is a -), but the basic idea is that the login shell is an initial shell.
    When bash runs as a login shell, it looks for a user''s .bash_profile, .bash_login,
    and .profile files, running the first one that it sees.'
  merge: -1
  pgno: 326
