  md: '# 8.4 Scripting Languages


    A long time ago, the average Unix systems manager didn''t have to worry much about
    scripting languages other than the Bourne shell and awk. Shell scripts (discussed
    in Chapter 7) continue to be an important part of Unix, but as stated earlier,
    awk has faded somewhat from the scripting area. However, many powerful successors
    have arrived, and many systems programs have actually switched from C to scripting
    languages (such as the sensible version of the which program). Let''s look at
    some scripting basics.


    The first thing that you need to know about any scripting language is that the
    first line of a script looks similar to a Bourne shell script. For example, a
    Perl script starts out like this:


    ```

    #!usr/bin/perl

    ```


    In Unix, any executable text file that starts with #! is a script. The pathname
    following this prefix is the scripting language interpreter executable. When Unix
    tries to run an executable file that starts with #1, it runs the program, and
    then sends the script file to the new program''s standard input. Therefore, even
    this is a script:


    ```

    #!/bin/tail +2

    This program prints this line...

    and this line, too.

    ```


    The first line of a shell script often contains one of the most basic script problems
    — an invalid path to the scripting language interpreter. Let''s say that you named
    the previous script myscript. Now, if tail were actually in /usr/bin on your system
    (not /bin)? When you tried to run myscript, you would get this error:


    ```

    myscript: No such file or directory

    ```


    Most Unix error messages aren''t confusing, misleading, or otherwise incomplete,
    this one certainly qualifies on all three counts. First of all, script does exist
    — you can see it in front of your eyes with 1ls. Is there a problem with your
    filesystem? No. The system really meant to say that you couldn''t find /bin/tail,
    but it just had a small communication breakdown.


    Another script "gotcha" is that you shouldn''t expect any more than one argument
    in the script''s first line to work. That is, in the preceding example may work,
    but if you add another argument, the system might'
