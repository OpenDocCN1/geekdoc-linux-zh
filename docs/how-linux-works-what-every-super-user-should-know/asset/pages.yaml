    # 12.5 Identifying a Filter


    One of the most frequently encountered problems with CUPS is that many of the
    PPD files you find on the Internet CUPS-specific print filter parameters that
    you may not have on your system. You should be able to recognize these parameters
    and have an idea of how to correct or delete them as you go.


    CUPS filters convert file formats in two ways:


    **To a common format** This type of filter converts various file formats into
    a common format. This common format will be either PostScript or raster data.
    The mime.conv file controls the filters that perform the conversion. For the most
    part, you should not have to worry about these filters, which are covered in the
    next section.


    **From a common format** A filter specified in the PPD file runs just before the
    backend to change the common format data into the language that the printer understands.
    If you have a PostScript printer, you probably do not need this filter in your
    PPD file. However, if you don''t have a PostScript printer, these backend filters
    require a lot of attention, as you will see.


    # CUPS Filters and mime.conv


    CUPS comes with a number of filters in /usr/lib/cups/filter that transform various
    intermediate file formats into printer-ready data. However, it is difficult to
    see where and how CUPS runs these filters.


    When you print a file, you can observe something like the following in the log
    file (this example is for a text file):


    ```

    Started filter /usr/lib/cups/filter/textttops (PID 3999) for job 25.

    Started filter /usr/lib/cups/filter/pstops (PID 4000) for job 25.

    ```'
