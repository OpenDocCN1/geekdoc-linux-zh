- img_proc: true
  md: "+   • Using a synchronizer system that duplicates an entire directory structure\n\
    on the remote host. The two most popular synchronizer utilities are\nrsync and\
    \ rdist. \n\n+   • Using old, clunky, insecure programs like ftp that you should\
    \ not use.\n\nThis chapter explains the rsync system. The main advantages of rsync\
    \ over other systems are:\n\n+   • There is only one command to learn, rsync,\
    \ which has a relatively\nsimple syntax.\n\n+   • It offers relatively good performance.\n\
    \n+   • It has multiple operating modes.\n\n# 15.1 rsync Basics\n\nThe basic requirement\
    \ of the rsync system is that you install the rsync program\non the source and\
    \ destination hosts. The easiest way to transfer files is to use\na remote shell\
    \ account. This section assumes that you want to transfer files to\nor from a\
    \ machine to which you have SSH access.\n\nOn the surface, the rsync command is\
    \ not much different than sc or rcp.\nIn fact, you can run rsync with the same\
    \ arguments as those utilities. For\nexample, to copy a group of files to your\
    \ home directory on host, you can run\nthis command:\n\n```\nrsync file1 file2\
    \ ... host:\n```\n\nHowever, given your current system and rsync configuration,\
    \ this command\nwill not work, because the rsync program defaults to using rsh\
    \ as the\nremote shell, and as you saw in Section 6.7, you shouldn't use something\
    \ this\ninsecure. To get around this, you can tell rsync to use ssh with the --rsh\n\
    option:\n\n```\nrsync --rsh=ssh file1 file2 ... host:destination_dir\n```\n\n\
    Look out for this error message:\n\nrsync not found\nrsync: connection unexpectedly\
    \ closed (0 bytes read so far)\nrsync: error in rsync protocol data stream (code\
    \ 12) at io.c(165)\n\nThis notice says that your remote path can't find rsync\
    \ on its system. If rsync\nisn't in the remote path but is on the system, use\
    \ --rsync-path=path to\nmanually specify its location.\n\nIf you don't want to\
    \ type --rsync=ssh every time that you invoke an rsync\ncommand, set the RSYNC_RSH\
    \ environment variable to ssh. The remainder of\ncommands in this chapter assume\
    \ that you have done this."
  merge: -1
  pgno: 315
- img_proc: true
  md: 'If your username is different on the remote host, add user@ to the hostname,
    use user as your username on host:


    ```

    rsync file1 file2 ... user@host:destination_dir

    ```


    With no extra options, rsync copies only files. In fact, if you specify just the
    options described so far and you supply a directory dir as an argument, you will
    see this message:


    skipping directory dir


    To transfer entire directory hierarchies, complete with the same symbolic links,
    permissions, modes, and devices, use the -a option, as in this example:


    ```

    rsync -a dir host:destination_dir

    ```


    If you''re not too sure what will happen when you transfer the files, use the
    -n option to operate rsync without actually copying any files. The -n option implies
    the -v (verbose mode) option, showing details about the transfer and the files
    involved:


    ```

    rsync -na dir host:destination_dir

    ```


    The output looks like this:


    ```

    building file list ... done

    ml/nftrans/nftrans.html

    [more files]

    wrote 2183 bytes read 24 bytes 401.27 bytes/sec

    ```


    # 15.1.1 Making Exact Copies of a Directory Structure


    By default, rsync copies files and directories without considering the previous
    contents of the destination directory. For example, if you transferred the directory
    d containing the files a and b to a the destination would contain d/a, d/b, and
    d/c after the rsync. To make an exact replica of the source directory, you must
    delete files in the destination directory that do not exist in the source directory,
    such as d/c in this example.


    Use the --delete option to remove files from the destination that don''t reside
    in the local directory, like this:


    ```

    rsync -a --delete dir host:destination_dir

    ```


    > NOTE Again, if you''re not certain about your transfer, use the -n option to
    tell you if rsync wants to delete any files before it actually performs the removal.'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'You may also wish to use --max-delete=n to make sure rsync deletes more than
    n files in the target directory. This option essentially amounts to a last-ditch
    effort not to delete large numbers of files when there''s some problem on the
    source side. However, it will still delete files until reaching n deleted files,
    and in fact, you may notice that your version of rsync might have a bug, it deletes
    one more than n files.


    # ## 15.2 Using the Trailing Slash


    You have to be particularly careful when specifying a directory as the source
    in an rsync command line. Consider this command:


    ```

    rsync -a dir host:dest_dir

    ```


    Once this command completes, you will have a directory dir inside dest_dir on
    host. However, adding a slash (/) significantly changes the behavior:


    ```

    rsync -a dir/ host:dest_dir

    ```


    Here, rsync copies everything inside dir to dest_dir on host without actually
    copying the dir directory itself. The dir directory will not exist on host the
    operation. Therefore, you can think of a transfer of dir/ as an operation similar
    to cp dir/* dest_dir on the local filesystem.


    ```

    rsync -a d/ host:c

    ```


    After the transfer completes, the directory c contains copies of a and b, but
    not d. If, however you had omitted the trailing / on d, c would have gotten a
    copy of d, with a and b inside, so that as a result of the transfer you''d have
    files and directories named c/d/a and c/d/b on the remote host.


    When transferring files and directories to a remote host, accidentally adding
    / after a path would normally be nothing more than a nuisance; you could go to
    the remote host, add the dir directory, and put all of the transferred items back
    in dir. Unfortunately, you must be careful of disaster when combining the trailing
    / with the --delete option. If you use the --delete option to transfer dir to
    dest_dir without the slash, rsync ignores everything in dest_dir except dir. Using
    dir/, on the other hand, makes rsync compare the contents of dir against dest_dir
    and makes dest_dir look exactly like dir. Therefore, you can accidentally delete
    a whole bunch of files in dest_dir.


    **WARNING** Beware of your shell''s automatic filename completion feature. GNU
    readline and many other completion libraries tack a trailing slash onto a completed
    directory name.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# 15.1.3 Excluding Files and Directories


    One very important feature of rsync is its ability to exclude files and directories
    from a transfer operation. Let''s say that you would like to transfer a local
    directory called src to host, but you want to exclude anything named RCS. You
    can do it like this:


    ```

    rsync -a --exclude=RCS src host:

    ```


    It''s important to note that this command excludes all files and directories named
    RCS because --exclude takes a pattern, not an absolute filename. If you want to
    exclude only one specific item, specify an absolute path that starts with /, as
    in this example:


    ```

    rsync -a --exclude=/src/RCS src host:

    ```


    > NOTE The first in /src/RCS in this command is not the root directory of your
    system, rather, the very base directory of the transfer.


    Here are a few more tips on exclude patterns:


    +   - You may have as many --exclude parameters as you like.

    - If you use the same patterns time and again, place those patterns in a plain-text
    file (one pattern per line), and then use --exclude-from-file.

    - To exclude directories named item but include files with this name, use a trailing
    slash: --exclude=item/

    - The exclude pattern is based on a full file or directory name component and
    may contain simple wildcards. For example, t* matches this, but does not match
    others.

    - If you exclude a directory or filename, but find that your pattern is too restrictive,
    use --include to specifically include another file or directory.


    # 15.2 Checksums and Verbose Transfers


    The rsync command uses checksums (near-unique signatures) to determine whether
    any files on the transfer source are already on the destination.


    The first time you transfer an entire directory hierarchy to a remote host, rsync
    sees that none of the files already exist at the destination, and transfers everything.
    Testing your transfer with rsync -n verifies this for you.


    After running rsync, try running it again, but this time as rsync -n or rsync
    -v. This time, no files should show up in the transfer list because an exact copy
    of the file exists on both ends, so the checksums are the same.'
  merge: -1
  pgno: 318
- img_proc: true
  md: 'However, when the files on the source side are not identical to the files on
    the destination side, rsync transfers the source files and overwrites files that
    exist on the remote side. There are a few options that override this checksum
    behavior:


    +   --ignore-existing Does not clobber files already on the target side.


    +   --backup (abbreviation: -b) Does not clobber files already on the target,
    but rather renames these files by adding a -suffix to their names before transferring
    the new files.


    +   --suffix=s Changes the suffix used with --backup - to s.


    +   --update (abbreviation: -u) Does not clobber file on the target that has a
    later date than the corresponding file on the source.


    With no special options, rsync operates quietly, only producing output when there
    is a problem. However, you can use rsync -v for verbose mode, and if you need
    more output, rsync -vv gives yet more details. (You can tack on as many v options
    as you like, but two is probably more than you.) For a comprehensive summary after
    the transfer, rsync --stats.


    # 15.3 Compression


    Many administrators use -z in conjunction with -a to compress the data before
    transmission:


    ```

    rsync -az dir host:destination_dir

    ```


    Compression can improve performance in certain situations. For example, if you
    are uploading a large amount of data across a slow connection (such as the slow
    upstream link on many DSL connections), or if the latency between the two hosts
    is high, it helps. However, across a fast 100 Mb/s local area network, the two
    endpoints can spend more time compressing and decompressing data than the network
    takes transmitting the uncompressed files.


    # 15.4 Limiting Bandwidth


    It''s easy to clog the uplink of DSL and cable modem connections when uploading
    a large amount of data to a remote host. Even though you won''t be using your
    (normally large) downlink capacity during such a transfer, your connection will
    still seem slow if you let rsync go as fast as it can, because outgoing TCP packets
    such as HTTP requests will have with your transfers for bandwidth on your uplink.


    To get around this, you can use --bwlimit to give your uplink a little breathing
    room. For example, to limit the bandwidth to 10000 kilobytes per second, you might
    do something like this:


    ```

    rsync --bwlimit=10000 -a dir host:destination_dir

    ```'
  merge: -1
  pgno: 319
- img_proc: true
  md: '# ## 15.5 Transferring Files to Your Computer


    The rsync command isn''t just for copying files from your local machine to a remote
    host. You can also transfer files from a remote machine to your local host by
    placing the remote host and remote source path as the first argument on the command
    line. Therefore, to transfer src_dir host to dest_dir on the local host, run this
    command:


    ```

    rsync -a host:src_dir dest_dir

    ```


    > NOTE If you omit host:, you can use rsync for making duplicates of directories
    on your local machine.


    # ## 15.6 Further rsync Topics


    rsync can do many things that are beyond the scope of this book. One of its several
    significant abilities is acting as a network server. Such a server offers several
    modules that you can call by symbolic names instead of pathnames. You can also
    offer read-only access to the modules; this is a nice alternative to anonymous
    FTP.


    Another important feature is rsync batch mode operation. Although it is fairly
    easy to write scripts containing rsync commands to do network file distribution,
    rsync can also employ a number of auxiliary files related to command options,
    logging, and transfer state. In particular, the state files make long transfers
    faster, and easier to resume when interrupted.


    There are also many command-line options than those described in this chapter.
    To get a rough overview, run rsync --help. There is more detailed information
    in the rsync (1) manual page as well as at the rsync home page: http://samba.anu.edu.au/rsync/.'
