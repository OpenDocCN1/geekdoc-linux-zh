    # # 13.5 Backups to Non-Traditional Media


    Even though you have the ability to create your own file systems on CD- or DVD-R/RW
    drives and spare hard disks, you should still stick with an archiver program like
    tar to make your backups. The primary reason is simple: tar preserves all file
    attributes, including permissions and ownership. In addition, it is easier to
    manage full and incremental backups with crecord (see Section 11.2.2, your best
    bet is probably to write a compressed tar archive directly to the CD or DVD with
    a command like this:


    ```

    tar zcf - | crecord dev=dev crecord_args -

