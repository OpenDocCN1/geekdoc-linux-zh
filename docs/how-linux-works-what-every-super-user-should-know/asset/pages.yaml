  md: '```

    id:5:initdefault:

    ```


    This line means that the default runlevel on the system is 5. All lines in the
    inittab file take this form, with four fields separated by colons occuring in
    the following order:


    +   - A unique identifier (a short string, such as id in the preceding example)

    - The applicable runlevel number(s)

    - The action init should take (in the preceding example, the action to set the
    default runlevel to 5)

    - A command to execute (optional)


    There is no command to execute in the preceding initdefault example because a
    command doesn''t make sense in the context of setting the default runlevel. Look
    a little further down in inittab, until you see a line like this:


    ```

    15:5:wait:/etc/rc.d/rc 5

    ```


    This particular line is important because it triggers most of the system configuration
    and services through the rc.d and init.d directories (see Section 3.1.2). You
    can see that init is set to execute a command called /etc/rc.d/rc 5 when runlevel
    5. The wait action tells when and how init runs the command: run rc 5 once when
    entering runlevel 5, and wait for this to finish before doing anything else.


    There are several different actions in addition to initdefault and wait, especially
    pertaining to power management, and the inittab(5) manual page tells you all about
    them. The ones that you''re most likely to encounter are explained in the following
    sections.


    # respawn


    The respawn action causes init to run the command that follows, and if the command
    finishes executing, to run it again. You''re likely to see something similar to
    this line in your inittab file:


    ```

    1:2345:respawn:/bin/mingetty tty1

    ```


    The getty programs provide login prompts. The preceding line is for the first
    virtual console (/dev/tty1), the one when you press ALT-F1 or CONTROL-ALT-F1 (see
    Section 3.3). The respawn action brings the login prompt back after you log out.


    # ctrlaltdel


    The ctrlaltdel action controls what the system does when you press CONTROL-ALT-DELETE
    on a virtual console. On most systems, this is some sort of reboot command, using
    the shutdown command, which is covered in Section 3.1.5.'
