- img_proc: true
  md: '# # 1


    # # THE BASICS


    This chapter is a guide to the Unix commands and utilities that you must know
    to get anything out of this book. This is preliminary material, and you may already
    know a substantial amount. Even if you think you''re up to speed, though, take
    a few seconds to flip through the sections just to make sure.


    You may be asking yourself, "I thought this was a book about Linux, not Unix?"
    Don''t worry; this chapter is just getting you ready for working with the Linux
    system. Linux is a Unix flavor at heart. You will see the word "Unix" in this
    chapter more than "Linux" because you can take the information straight over to
    Solaris, BSD, and other Unix-flavored systems. Special care has been taken to
    avoid too many Linux-specific user interface extensions, not only so you will
    have a better background with other operating systems, but also because these
    extensions tend to be extremely unstable. You will be able to adapt to new Linux
    releases much more quickly if you know the core that does not change.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Although the material here may seem sparse, you need to convince yourself that
    Unix is not hard. Yes, most reports from the field are to the contrary, but in
    the end, Unix is nothing but a bunch of files and a few commands for manipulating
    those files. If you are familiar with other operating systems, you shouldn''t
    have a problem. However, if you find the information in this preliminary chapter
    somewhat lacking, there are books with much more detail for beginners, such as
    UNIX for the Impatient [Abrahams] and Learning the UNIX Operating System [Peek].


    # # About /bin/sh


    The shell is one of the most important parts of a Unix system. A shell is a program
    that runs commands. For example, one of the shell''s duties is to run the commands
    that users type. Shells also serve as small programming environments. Unix programmers
    often break common tasks into little components and rely on the shell to manage
    tasks and to piece things together.


    Many important parts of the system are actually shell scripts—text files that
    contain nothing but shell commands. If you have worked with MS-DOS, shell scripts
    may seem similar to .BAT files, but the shell is far more powerful. Chapter 7
    is a small guide to shell scripts, and you can peruse it anytime after finishing
    this chapter.


    As you progress through this book, you will learn how to manipulate commands with
    the shell. One of the best things about the shell is that if you make a mistake,
    you can look at what you typed, see what went wrong, and then try again quickly.
    Do not be afraid to try new things. The only way to learn the shell is to use
    it.


    There are many different Unix shells, but all derive many of their features from
    the Bourne shell, or /bin/sh. Every Unix system needs the Bourne shell to function
    correctly, as you will see throughout this book.


    Linux uses an enhanced version of the shell, called bash, or the “Bourne-again”
    is the default shell for most Linux distributions, and /bin/sh is normally some
    sort of link to bash on a Linux system. You should use the bash when running the
    examples in this book.


    You may not have bash if you''re using this chapter as a guide for a Unix account
    at an organization where you are not the systems administrator. You can change
    your shell with csh or your systems administrator for help.


    # # 1.2 Using the Shell


    When you installed Linux, you set up a root (superuser) password, and hopefully
    you also made at least one more regular user for yourself. For this chapter, you
    should log in as the regular user.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'The first thing you need to do after logging in is to bring up a shell, its
    window contains a prompt at the top that usually ends with a dollar sign ($).
    On Red Hat Linux, the prompt looks like [name@host]. If you know Windows, you
    will find that the shell window looks vaguely similar to the command prompt.


    NOTE You may hear the shell window referred to as the terminal window. The terminal
    window is part of the user interface that accepts keystrokes from the windowing
    system and draws the characters on the screen. You can think of the terminal as
    a middleman between the shell and the user.


    Now type the following command and press ENTER:


    ```

    cat /etc/passwd

    ```


    The command prints a couple of lines that start with usernames, and then you get
    your shell prompt back. If you can''t read the text very well, manipulate the
    font settings to your liking. You''re going to be spending a good part of your
    time with this book in the shell, so you should be comfortable with it.


    The cat command is a great one to start with because it''s one of the easiest
    Unix commands. Its syntax is as:


    ```

    cat file1 file2 ...

    ```


    When you run this command, cat prints (and concatenates) the files file1, file2,
    and any additional files (denoted by ...) and exits.


    If you do not specify any input files, cat reads from the standard input, which
    in this case is the keyboard. To see this at work, type cat and press ENTER. Unlike
    the earlier example, you do not get your shell prompt back because cat is still
    running. Now type some stuff (it doesn''t matter what). After you press ENTER
    at the end of each line, cat repeats the line you typed. When you''re sick of
    this, press CONTROL-D on a line by itself to terminate the command and return
    to the shell prompt.


    NOTE Do not confuse CONTROL-D and CONTROL-C. CONTROL-D on a line by itself stops
    the current standard input entry (and often terminates a program). CONTROL-C terminates
    a program regardless of its input or output.


    You have now experienced standard input (stdin) and output (stdout), two important
    components of the Unix shell environment. Standard input is a program''s default
    input source. When you run cat without any arguments, it didn''t give up because
    there were no arguments; instead, cat switched to standard input instead of going
    after some files. Here, standard input was the stuff that came from your keyboard.
    Standard output, on the other hand, is where a program''s output goes by default.
    In this case, that location is'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'terminal window running the shell. The best feature of standard input and output
    is that you can easily send them to places other than their defaults, as described
    in Section 1.14.


    # ## 1.3 Basic Commands


    It''s time to learn some other Unix commands. Most of the following programs take
    multiple arguments, and some have so many options and formats that an unabridged
    listing would be pointless. This is a simplified list; you don''t need to know
    all of the details just yet.


    # ### 1.3.1 ls


    The ls command lists the contents of a directory. The default is the current directory.
    Use ls -l for a detailed (long) listing and ls -F file type indicator (for information
    on file types and the permissions in the left column, see Section 1.17). Here
    is a sample listing:


    | -TW-xr--r | 1 user | users | 3804 Apr 30 | 2000 abusive.c |

    | -TW-xr--r | 1 user | users | 4165 May 26 | 1999 battery.zip |

    | -TW-xr--r | 1 user | users | 131219 Oct 26 | 2000 beav_1.40-13.tar.gz |

    | -TW-xr--r | 1 user | users | 6255 May 30 | 1999 country_c |

    | dwxrxr-X | 2 user | | 4096 Jul 17 | 20:00 cs335 |

    | -TWXXxr-X | 1 user | users | 7108 Feb 2 | 2001 dhry |

    | -TW-xr--r | 1 user | users | 11309 Oct 20 | 1999 dhry.c |

    | -TW-xr--r | 1 user | users | 56 Oct 6 | 1999 doit |

    | dwxrxr-X | 6 user | users | 4096 Feb 20 | 13:51 dw |

    | dwxrxr-X | 3 user | users | 4096 May 2 | 2000 tough-stuff |


    # ### 1.3.2 cp


    In the first form shown below, cp copies the contents of file1 to file2. In the
    second form, it copies all files to the dir directory:


    ```

    cp file1 file2

    cp fileN ... file dir

    ```


    # ### 1.3.3 mv


    In the first form below, mv renames file1 to file2. In the second form, it moves
    all files to the dir directory:


    ```

    mv file1 file2

    mv fileN ... file dir

    ```'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# ### 1.3.4 touch


    The touch command creates a file. If the file already exists, touch does not change
    it, but it does update the timestamp you see with the long listing by the ls -1
    command.


    ```

    touch file

    ```


    # ### 1.3.5 rm


    To delete (remove) a file, use rm. After you remove a file, it''s gone. Do not
    expect to be able to “undelete” anything.


    ```

    rm file

    ```


    # ### 1.3.6 echo


    The echo command prints its arguments to the standard output:


    ```

    echo Hello there.

    ```


    The echo command is very useful for finding expansions of shell wildcards and
    variables that you will encounter later in this chapter.


    # # 1.4 Using Directory Commands


    Unix has a directory hierarchy that starts at /, sometimes called the root. The
    directory separator is the slash (/), not the backslash (\). There are several
    standard subdirectories in the root directory, such as /usr (you''ll learn all
    about them in Section 2.1).


    A directory specification is called a path, and one that starts at the root (such
    as /usr/lib is a full or absolute path). Similarly, a filename with a full path
    in front (such as /usr/lib/libc.a) is a full pathname.


    The path component identified by two dots (..) specifies the parent of your shell''s
    current directory, and one dot (.) specifies the current directory. For example,
    if the current working directory of your shell is /usr/lib, the path .../bin refers
    to /usr/bin. A path beginning with .. is called a relative pathname.


    The following sections describe the essential directory commands.


    # ### 1.4.1 cd


    The cd command changes the shell''s current working directory to dir:


    ```

    cd dir

    ```


    If you omit dir, the shell returns to your home directory.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 1.4.2 mkdir


    The mkdir command creates a new directory, dir:


    ```

    mkdir dir

    ```


    # 1.4.3 rmdir


    The rmdir command removes the directory dir:


    ```

    rmdir dir

    ```


    If dir isn''t empty, this command fails. However, if you''re impatient, you probably
    don''t want to laboriously delete all the files and subdirectories inside dir
    first. You can use `rm -rf dir` to delete a directory and its contents, but be
    careful. This is one of the few commands that can do serious damage, especially
    if you run it as the superuser. The -r option specifies recursive delete, and
    -f forces the delete operation. Don''t use the -rf flags with wildcards as a star
    (*). Above all, always double-check your command.


    # 1.4.4 Shell Wildcards


    The shell is capable of matching simple patterns with files in the current working
    directory. The simplest of these is the star character (*), which means match
    any number of arbitrary characters. For example, the following command prints
    a list of files in the current directory:


    ```

    echo *

    ```


    After matching files to wildcards, the shell substitutes the filenames for the
    wildcard in the command line and runs the revised command line. Here are some
    more wildcard examples: *@ matches all files starting with at; *@ matches files
    that end with at; and *@* matches any files that contain at. If no match matches
    a wildcard, the shell does no substitution, and the command runs with literal
    characters as * (for example, try a command such as echo*dkdfsaH).


    If you''re used to MS-DOS, you might instinctively type *. as a wildcard to match
    all files. Break this habit. In Linux and other versions of Unix, you must use
    * to match all files. In the Unix shell, *.* matches only files and directories
    that contain the dot (.) character in their names. Unix filenames do not need
    extensions and often do not carry them.


    Another shell wildcard character is the question mark (?), instructing the shell
    to match exactly one arbitrary character. For example, b@ matches boat and brat.


    If you do not want the shell to expand a wildcard in a command, enclose the wildcard
    in single quotes (''''). For example, the command echo ''*'' prints a star. You
    will find this handy in a few of the commands described in the'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'next section, such as grep and find. Quoting is a somewhat tricky matter, so
    don''t get too involved with it just yet — you''ll learn much more later, in Section
    7.2.


    This isn''t the end to a modern shell''s pattern-matching capabilities * and are
    what you need to know.


    # 1.5 Intermediate Commands


    The following sections describe the most essential intermediate Unix commands
    beyond the basics that you saw earlier in this chapter. There are many more commands
    where these come from; check out Appendix A for a large list of commands on your
    system.


    # 1.5.1 grep


    grep prints the lines from a file or input stream that match an expression. For
    example, if you want to print the lines in the /etc/passwd file that contain the
    text root, use this command:


    ```

    grep root /etc/passwd

    ```


    The grep command is extraordinarily handy when operating on multiple files at
    once, because it prints the filename in addition to the matching line when in
    this multiple-file mode. For example, if you want to check every file in /etc
    that contains your root, you could use this command:


    ```

    grep root /etc/*

    ```


    Two of the most important grep options are -i (for case-insensitive matches) and
    -v (which inverts the search; it prints all lines that don''t match). There is
    also a more powerful variant called grep.


    grep understands patterns known as regular expressions that are grounded in computer
    science theory and are ubiquitous in Unix utilities. Regular expressions are more
    powerful than wildcard-style patterns, and they have a different syntax. The two
    most important things to remember about regular expressions are these:


    +   * to match any number of characters (like the * in wildcards)

    * to match one arbitrary character


    The grep(1) manual page contains a detailed description of regular expressions,
    but it can be a little difficult to read. To learn more, you can try Mastering
    Regular Expressions [Friedl], or look at the regular expressions chapter of Programming
    Perl [Wall]. If you like math and are interested in where these things come from,
    look Introduction to Automata Theory, Languages, and Computation [Hopcroft].'
  merge: -1
  pgno: 26
- img_proc: true
  md: '#  1.5.2 more less


    When a command''s output is long, it can scroll off the top of the screen, it''s
    annoying to use a scrollbar to view output because you have to move your hands
    around. You sometimes may also want to look at a large text file without starting
    a text editor. Two standard commands for text navigation are more and less.


    To page through a big file like /usr/dict/words, you will see the contents of
    the file, one screenful at a time. You can press the space bar to go forward in
    the file and the b key to skip back one screenful. To quit more, type q.


    The command performs the same function as more, but it is far more powerful and
    widely used. Use less --help to get a good summary of its operations.


    As you will learn in Section 1.14, you can send the output of nearly any program
    to another program''s input, enabling operations such as (try it to see what it
    does):


    ```

    grep ie /usr/dict/words | less

    ```


    #  1.5.3 pwd


    This program''s name stands for "print working directory," and the command outputs
    the current working directory. That''s all that pwd does, but it''s useful. Some
    Linux distributions set up accounts with the current working directory in the
    prompt, but you may wish to change that because the current working directory
    takes up a lot of space on a line.


    #  1.5.4 diff


    To see the differences between two text files, use diff:


    ```

    diff file1 file2

    ```


    There are several options that can control the format of the output, as -c, but
    the default format is often the most comprehensible (for human beings, that is).


    #  1.5.5 file


    If you see a file and are unsure of its format, try using file to see if the system
    can guess, based on a large set of rules:


    ```

    file file

    ```


    You may be surprised to see how much this innocent-looking command can do.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# 1.5.6 find


    It''s frustrating when you know that a certain file is in a directory tree somewhere,
    and you just don''t know where. Run find to find file in dir:


    ```

    find dir -name file -print

    ```


    Like most programs in this section, find is capable of some fancy stuff. However,
    don''t try options as -exec before you know the form shown by heart, and you know
    why you need the -name and -print options. The find command accepts wildcard characters,
    as *, but you must enclose them in single quotes to protect the wildcard characters
    of the shell''s own wildcard features (recall from Section 1.4.4 that the shell
    expands wildcards before running commands).


    # 1.5.7 head and tail


    To view a portion of a file or stream, use the head and tail commands. For example,
    head /etc/initab shows the first ten lines of this system configuration file,
    and tail /etc/initab shows the last ten lines. You can change the number of lines
    to print by using the -n option, where n is the number of lines you want to see.
    If you want to print lines starting at line n, use tail +n.


    # 1.5.8 sort


    The sort command quickly puts the lines of a text file in alphanumeric order.
    If the file''s lines start with numbers, and you want to sort in numeric order,
    use the -n option. The -r option reverses the order of the sort.


    # 1.6 Changing Your Password and Shell


    On large commercial sites, it is important to change your password when you log
    in. At home, you may not even have a password, but you should. Use the passwd
    command to change your password. It asks for your old password and prompts you
    for your new password twice.


    As any other manual will tell you, choose a password that does not include any
    real words in any language. Don''t try to combine words, either. One of the easiest
    to get a good password is to pick a sentence, produce an acronym from it, and
    then modify the acronym with a number or some punctuation. For example, Ayht8irt
    is a modification of the previous sentence.


    # 1.6.1 chsh


    You can change your shell with the chsh command, but keep in mind that your book
    assumes that you''re running bash.'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# 1.7 Dot Files


    Change to your home directory and take a look around with ls, and then run ls
    -a. At first, you will not see the configuration files, which are also called
    *dot files*. Dot files are nothing more than files and directories whose name
    begin with a dot (.). Common dot files are .bashrc and .login. There are some
    dot directories, too, such as .mozilla.


    There is nothing special about dot files or directories. Some programs just don''t
    list them by default, so you don''t see a complete mess when listing the contents
    of your home directory. For example, without the -a option, ls doesn''t list dot
    files. In addition, shell wildcards don''t match dot files unless you explicitly
    use a pattern as *.


    > You can still run into problems with wildcards because *. matches and .. (the
    current and parent directories). You may wish to use a pattern such as [^]* or
    ?? to get all dot files except the current and parent directories. This isn''t
    a perfect solution, but it usually works.


    # 1.8 Environment and Shell Variables


    The shell can store temporary variables, *shell variables*, that store the value
    of text strings. Shell variables are very useful for keeping track of state in
    scripts, and some shell variables control the shell behaviors (for example, the
    PS1 controls the prompt). To assign a value to a shell variable, use the equal
    sign (=):


    ```

    STUFF=blah

    ```


    The preceding example sets the value of the variable named STUFF blah. To access
    this variable, use $STUFF (for example, try running echo $STUFF).


    An environment variable is like a shell variable, but is not specific to the shell.
    All programs on Unix systems have environment variable storage. The difference
    that you will notice is that the operating system passes all of your shell''s
    environment variables to programs that the runs, whereas shell variables are not
    accessible by the commands that you run. Some programs use environment variables
    for configuration and options. For example, you can put your favorite less command-line
    options in the LESS environment variable, and use less when you run it. Many manual
    manuals contain a section marked ENVIRONMENT that describes these variables.


    You can assign a new environment variable just as you would a shell variable,
    except that creating the variable, you must run the export operation to transfer
    the variable to the shell''s environment variable storage. The following sequence
    of commands assigns a value to STUFF and changes it into an environment variable:


    ```

    STUFF=blah

    export STUFF

    ```'
  merge: -1
  pgno: 29
- img_proc: true
  md: "# 1.9 The Command Path\n\nPATH is a special environment variable containing\
    \ the command path (or path for short). A command path is a list of system directories\
    \ that the shell looks in when trying to locate a command. For example, if you\
    \ try to run the ls command, the shell searches the directories listed in PATH\
    \ for the program. If programs with the same name appear in several directories\
    \ in the path, the shell runs the first path that matches.\n\nIf you run echo\
    \ $PATH, you'll see that the path components are separated by colons (:). Here's\
    \ a simple example:\n\n```\n/usr/local/bin:/usr/X11R6/bin:/usr/bin:/bin\n```\n\
    \nTo make the shell look in more places for programs, you can change the PATH\
    \ environment variable. You can add a directory dir to the beginning of the path\
    \ so that the shell looks in dir before looking in any of the other PATH directories\
    \ with this command:\n\n```\nPATH=$dir:$PATH\n```\n\nAs an alternative, you can\
    \ append a directory name to the end of the PATH variable, causing the shell to\
    \ look in dir last: \n\n```\nPATH=$PATH:$dir\n```\n\nExercise caution when modifying\
    \ the path, because you can accidentally wipe out your entire path if you mistype\
    \ $PATH. Don't panic if this happens, because it isn't permanent (for a lasting\
    \ effect), you need to mistype it when editing a certain configuration file, and\
    \ then it isn't difficult to rectify. One of the easiest methods to get back to\
    \ normal is to exit the terminal window that you're using and start another.\n\
    \nNOTE\n\n# 1.10 Special Characters\n\nIf you know people who are into Linux,\
    \ and you have some desire to discuss it with them, you should know a few names\
    \ for some of the special characters that you'll encounter. If you are infinitely\
    \ amused by this sort of thing, look at the Jargon File (http://catb.org/esr/jargon/html/)\
    \ or its printed version, The New Hacker's Dictionary [Raymond].\n\nTable 1-1\
    \ on the next page lists a set of the special characters, what they are, what\
    \ people call them, and their uses. You have already seen many of these characters\
    \ in this chapter. Not all meanings of each character are identified because there\
    \ are too many to list. Some utilities, as the Perl programming language, use\
