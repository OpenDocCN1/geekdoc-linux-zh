    # 3.1 init


    There is nothing special about init. It is a program just like any other on the
    Linux system, and you''ll find it in /sbin along with other system binaries. The
    main purpose of init is to start and stop other programs in a particular sequence.
    All you have to know is how this sequence works.


    There are few different variations, but most Linux distributions use the System
    V style discussed here. Some distributions use a simpler version than the BSD
    init, but you are unlikely to encounter this.


    # 3.1 Runlevels


    At any given time on a Linux system, a certain base set of processes are running.
    The state of this machine is called its runlevel, and it is denoted with a number
    from 0 through 6. The system spends most of its time in a single runlevel. However,
    when you shut down the machine, init switches to a different runlevel in order
    to terminate the system services in an orderly fashion and to tell the kernel
    to stop. Yet another runlevel is for single-user mode, discussed in Section 3.2.4.


    The easiest way to get a handle on runlevels is to examine the init configuration
    file, /etc/inittab. Look for a line like this:'
