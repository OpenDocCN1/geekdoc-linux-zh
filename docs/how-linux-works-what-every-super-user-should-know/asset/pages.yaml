  md: '# 6


    # NETWORK SERVICES


    Chapter 5 explained all layers of Internet networks except the application layer.
    Network applications (clients and servers) interact with the operating system
    by using a transport layer protocol and interface, such as TCP. This chapter covers
    basic network servers, including the inetd superserver and SSH servers. In addition,
    you will see some tools that will help you debug the servers.


    Unix network servers come in many forms. A server may listen to a port on its
    own, or it may use a superserver such as inetd. Servers have no common configuration
    database, and they vary widely in features. Most servers have a configuration
    file to control their behavior (though with no common format), and most use the
    operating system''s syslog service for message logging.


    If you understand the system of TCP and UDP ports described in Section 5.12, you
    won''t run into much trouble with network servers. Let''s start out by getting
    an idea of how network clients talk to network servers.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# 6.1 The Basics of Services


    TCP services are among the easiest to understand because they are simple, uninterrupted
    data streams. For example, you can talk directly to a Web server on TCP port 80
    to get an idea of how data comes across the connection. Run the following command
    to connect to a Web server:


    ```

    telnet www.nytimes.com 80

    ```


    You should get a response like this:


    ```

    Trying some address...

    Connected to www.nytimes.com.

    Escape character is ''^]''.

    ```


    Now type this:


    ```

    GET /

    ```


    Press ENTER twice. The server should send a bunch of HTML text as a response,
    and then terminate the connection.

    There are two important lessons here:


    +   - The remote host has a Server process listening on TCP port 80.

    - telnet was the client that initiated the connection.


    > telnet is a program originally meant to enable logins to remote hosts. Although
    the non-Kerberos telnet login server is completely insecure (as you will learn
    later), the telnet client is useful for debugging remote services. telnet does
    not work with UDP or any other transport layer other than TCP. See Section 6.5.3
    for information on netcat, a powerful general-purpose network client.


    # 6.2 Stand-Alone Servers


    Stand-alone network servers are no different than any other server daemons on
    your system (such as cron), except that you already saw syslog in Chapter 4, which
    accepts UDP packets on port 514 if it is started with the -r option.


    Here are other common network servers that you may find running on your system:


    +   - httpd Web server

    lpd Print server (see Chapter 12)

    postfix, qmail, sendmail Mail servers

    sshd Secure shell daemon (see Section 6.4)

    nfsd, mounted Network filesystem daemons

    smbd, nmbd Windows file-sharing daemons (see Chapter 14)

    portmap Remote procedure call (RPC) portmap service daemon


    126 Chapter 6'
  merge: -1
  pgno: 145
- img_proc: true
  md: '# 6.3 The inetd Daemon


    Implementing stand-alone servers for every single service is somewhat inefficient,
    because each server must know all about the network interface API, have its port
    configuration system, and so on. In many respects, the API for talking to TCP
    is not much different from the standard I/O system. TCP servers read from network
    ports and return output back to those ports — this is similar to the behavior
    of cat with no arguments in Section 1.2 is similar.


    The inetd daemon is a superserver that standardizes network port access and interfaces
    between regular programs and network ports. After you start it, reads the inetd.conf
    file and listens on the network ports defined in that file, attaching a newly
    started process to every new connection.


    Each line in inetd.conf looks something like this:


    ```

    ident stream tcp nowait nobody /usr/sbin/inetd identd -i

    ```


    There are several fields here (see Section 5.12).


    +   **Service name** The service name from /etc/services

    **Socket type** This is usually stream for TCP and dgram for UDP.

    **Protocol** The transport protocol, such as tcp or udp.

    **Datagram server behavior** For UDP, this is wait or nowait. Services using any
    other transport protocol should use nowait.

    **User** The username that should run the service. Add .group if you want to set
    a group.

    **Executable** The program that inetd should connect to the service.

    **Arguments** The arguments for the executable in the preceding field. The first
    argument should be the name of the program.


    A # sign in inetd.conf denotes a comment. To deactivate an inetd service, place
    a # before its entry in /etc/inetd.conf and then run the following command to
    make inetd re-read its configuration file:


    ```

    kill -HUP cat /var/run/inetd.pid

    ```


    inetd has several built-in services that you might see at the beginning of the
    inetd.conf, including echo, charger, discard, daytime, and time. You can use these
    for testing, but otherwise they aren''t important.


    # 6.3.1 TCP Wrapper: tcpd, /etc/hosts.allow, /etc/hosts.deny


    Before lower-level firewalls took off in popularity, many administrators used
    the TCP wrapper library for host control over network services. In fact, if you
    run an IP firewall, you should still use TCP wrappers on any service that'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'does not have its own logging mechanism (and inetd services do not have such
    capabilities).

    The tcpd program is the TCP wrapper utility for linking inetd with a server. An
    administrator can modify the inetd.conf file to include tcpd, like this:


    ```

    finger stream tcp nowait nobody /usr/sbin/in /usr/sbin/in.fingered

    ```


    When someone makes a connection to the finger port, the following happens:


    +   1. inetd runs tcpd as /usr/sbin/in.fingered.

    2. tcpd verifies the executable /usr/sbin/in.fingered.

    3. tcpd connects /etc/hosts.allow and /etc/hosts.deny to see if the remote machine
    has permission to connect.

    4. tcpd logs its decision.

    5. If tcpd decides that the remote host is okay, it runs /usr/sbin/in.fingered.

    Otherwise, tcpd terminates, dropping the connection.


    Here is an example hosts.deny file:


    ```

    ALL: .badguys.example.com

    infinger: nofinger.example.com

    portmap: ALL

    ```


    You can interpret this as follows:


    +   * No one in the subdomain .badguys.example.com may connect to any TCP wrapper-enabled
    program.

    * The host nofinger.example.com may not run in.fingered.

    * No one may access portmap (see Section 6.6 for more information on this service).


    The TCP wrapper library reads /etc/hosts.allow before matching an incoming connection,
    the TCP wrapper library allows the connection, ignoring /etc/hosts.deny. For example,
    the rule in /etc/hosts.allow matches following line in /etc/hosts.allow enables
    portmap access to the subdomain goodguys.example.com:


    ```

    portmap: .goodguys.example.com

    ```


    > Using domain names in a TCP wrapper configuration has the disadvantage that
    it uses DNS. Forcing DNS lookups can hinder performance. It''s also not extremely
    secure; it''s possible to affect DNS lookups.'
  merge: -1
  pgno: 147
- img_proc: true
  md: "# 6.3.2 xinetd\n\nSome Linux distributions come with an enhanced version of\
    \ inetd named xinetd (http://www.xinetd.org/). You can read about the xinetd improvements\
    \ at the Web site, but to summarize, xinetd offers built-in TCP wrapper stub,\
    \ better logging, and extended access control.\n\nIf you currently have inetd,\
    \ should you run xinetd? If you need its features, however, if you only have one\
    \ local server (for example, FAM for the GNOME desktop), and you firewall the\
    \ external traffic to this server anywhere, there are probably better things to\
    \ do with your time. xinetd administrators should also keep careful track of security\
    \ advisories, because this package has not as widespread as the old inetd.\n\n\
    xinetd does not read inetd.conf, but if you understand the fields in inetd.conf\
    \ you will have no trouble using xinetd. If you need an alternative to /etc/xinetd.d,\
    \ you can also use itox to convert your inetd.conf to a xinetd.conf file that\
    \ xinetd can read.\n\nTo add a new service to xinetd, create a file in /etc/xinetd.d\
    \ with the name of the service. For example, the /etc/xinetd.d/finger file might\
    \ look like this:\n\n```\nservice finger\n{\n  socket_type = stream\n  protocol\
    \ = tcp\n  wait = no\n  user = nobody\n  passenv =\n  server = /usr/sbin/in.fingerd\n\
    \  server_args =\n}\n```\n\nTo make xinetd recognize the changes, run kill -USR\
    \ on the xinetd process ID.\n\n# 6.4 Secure Shell (SSH)\n\nThe shell (SSH) is\
    \ now the de facto standard for remote logins to other machines. It replaces old,\
    \ insecure programs like telnet and rlogin. In addition to being a good example\
    \ of a stand-alone server (for the purposes of this book, at least), SSH has these\
    \ features:\n\n+   - Encrypts your password and all other session data, protecting\
    \ you from snoopers.\n- Tunnels other network connections, including those from\
    \ X Window System clients. Tunneling is the process of packaging and transporting\
    \ a network connection using another network connection. The advantages"
  merge: -1
  pgno: 148
- img_proc: true
  md: 'of using SSH to tunnel X Window System connections are that SSH sets up the
    display environment for you and encrypts the X data inside the tunnel.


    +   - Has clients for almost every operating system.


    +   - Uses keys for host authentication.


    OpenSSH (http://www.openssh.com/) is a popular free SSH implementation for Unix.
    The OpenSSH client is ssh and the server is sshd. OpenSSH uses public key cryptography
    for authentication and less complex ciphers for its session data. SSH does not
    come without its disadvantages; in particular, you need the remote host''s public
    key, and you necessarily get it in a secure way (however, you can check it manually
    if you think you''re being spoofed). If you would like to know how cryptography
    works, get your hands on Applied Cryptography (Schneier).


    There are two main SSH protocol versions: 1 and 2. OpenSSH supports both, with
    version 2 being the default.


    # 6.4.1 Installing OpenSSH


    You can install a precompiled binary version of OpenSSH, such as an .rpm file
    in a Red Hat distribution, or you can get the "portable" source code from the
    OpenSSH Web site to install from source. If you install from source, you need
    a version of the SSL (Secure Socket Layer) library, preferably OpenSSL.


    In either case, you need to know your OpenSSH configuration directory—it is usually
    /etc or /usr/local/etc. If you install from source code, you can override the
    default configuration directory by using the --sysconfdir parameter to configure
    (see Chapter 9 for more information on compiling software from source).


    # 6.4.2 The SSHD Server


    To run sshd, you need a configuration file and host keys in the configuration
    directory. The configuration filename is sshd_config. It''s easy to confuse this
    filename with the client''s ssh_config setup file, so look out. You shouldn''t
    need to change anything in sshd_config, but it never hurts to check.


    The file consists of keyword-value pairs, as shown in this fragment:


    ```

    Port 22

    #Protocol 2,1

    #ListenAddress 0.0.0.0

    #ListenAddress ::

    HostKey /usr/local/etc/ssh_host_key

    HostKey /usr/local/etc/ssh_host_rsa_key

    HostKey /usr/local/etc/ssh_host_dsa_key

    ```'
