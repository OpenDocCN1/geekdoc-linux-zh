  md: '# 13.6.6 mt Commands and Status


    These are the most common mt commands:


    +   - mt status Produces a status report.

    - mt fsf n Winds forward to the start of the first block of the next file. The
    n parameter is optional; if specified, mt skips ahead n files instead of just
    one.

    - mt bsf n Winds back to the end of the previous file. The n is an optional file
    count.

    - mt rewind Rewinds the tape.

    - mt offline Rewinds the tape, then prepares for tape removal. In some tape drives,
    the tape drive ejects the tape; in others, the drive unlocks the tape so that
    you can manually remove it.

    - mt retension Winds the tape all the way forward and then rewinds. Sometimes
    helps with tapes that you are having trouble reading.

    - mt eraseases the entire tape. This usually takes a long time.


    There are countless mt commands documented in the mt(1) manual page, but they
    aren''t really useful unless you''re trying to extract blocks from the center
    of a file or to set SCSI tape drive options.

    Running mt yields a number of status codes (such as the BOT code from Section
    13.6.1). Here are the important codes:


    +   - ONLINE The drive is ready with a loaded tape.

    - DR_OPEN The drive is empty (possibly with the door open).

    - BOT The current position is the beginning of the file.

    - EOF The current position is the beginning of a file (the end of a file mark).
    This is a somewhat misleading code, because you can confuse it with the end of
    file.

    - EOT The current position is the end of the tape.

    - EOD The current position is the end of recorded media. You can reach this by
    trying to mt fsf past the very last file marker.

    - WR_PROT The current tape is read-only.


    # 13.6.7 Direct File Access


    tar isn''t the only command that can write archives to a tape. Sometimes you may
    not know what is on the tape, and even if you do, you may want to copy a file
    from the tape to the local filesystem for further (and easier) examination.


    Your old friend dd can do this, as this example for /dev/nsto shows:


    ```

    dd if=/dev/nsto of=output_file

    ```'
