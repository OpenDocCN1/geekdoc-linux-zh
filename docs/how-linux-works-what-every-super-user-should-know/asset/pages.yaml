  md: '# 5.14 Network Address Translation (IP Masquerading)


    Network Address Translation (NAT) permits sharing a single IP address (for example,
    from a PPP or broadband connection) with an entire internal network. NAT is very
    popular with home and small office networks. IPv4 addresses are in short supply,
    and furthermore, ISPs do not really want to bother with more routing than they
    can handle. As mentioned in Section 5.9.1, many small routers support NAT. In
    Linux, the variant of NAT that most people use is known as IP masquerading.


    The basic idea behind NAT is that the machine with the Internet connection acts
    as a proxy between the internal network and the rest of the Internet. Consider
    a network like the one in Figure 5-1 on page 94, and assume that the router (gateway)
    has an eth interface for an internal private network and a ppp interface for the
    uplink to the Internet.


    Every host on the Internet knows how to connect to the router, but they know nothing
    about the internal private network behind the router. Under NAT, each of the internal
    hosts has the router as its default gateway. The system works roughly as follows:


    +   1. A host on the internal private network wishes to make a connection to the
    outside world, so it sends its connection request packets through the router as
    normal.

    2. The router intercepts the connection request packet rather than passing it
    out to the Internet (where it would get lost, the public Internet knows nothing
    about private networks such as 10.1.2.0/24).

    3. The router determines the destination of the connection request packet and
    opens its own connection to the destination.

    4. When the router obtains the connection, it fakes a "connection established"
    message back to the original host.

    5. The router is now the middleman between the internal host and the destination.
    The destination knows nothing about the internal host; the connection on the remote
    host looks like it came from the router.


    This doesn''t sound bad until you think about how it works. Old IP routing knows
    only source and destination IP addresses in the Internet layer. However, if the
    router dealt only with the Internet layer, each host on the internal network could
    establish only one connection to a single destination at one time (among other
    limitations), because there is no information in the Internet layer part of a
    packet that could distinguish multiple requests from the same host to the same
    destination.


    Therefore, NAT must dissect packets to pull out more identifying information.
    The only suitable stuff is in the transport layer — in particular, the TCP and
    UDP port numbers. The transport layer is very complex, so you'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'can imagine that there are lots of things that can go wrong when a router goes
    mucking about inside transport layer information that comes from two hosts (the
    internal one and the external one) that it knows nothing about.


    That said, NAT works better in practice than this brief description might suggest.
    To set up a Linux machine to perform as a NAT router, you must activate all of
    the following inside the kernel configuration: network packet filtering (“firewall
    support”), connection tracking, IP tables support, full NAT, and MASQUERADE target
    output.


    **NOTE** See Chapter 10 for information on the kernel.


    Then you need to run iptables commands to make the router perform NAT for its
    private subnet. The following examples are for the earlier example:


    ```

    echo 1 >/proc/sys/net/ipv4/forward

    iptables -P FORWARD DROP

    iptables -t nat -A POSTROUTING -o ppo -j MASQUERADE

    iptables -A FORWARD -i eth -j ACCEPT

    iptables -A FORWARD -m state --ESTABLISHED,RELATED -j ACCEPT

    ```


    This example applies to an internal Ethernet network on sharing a PPP Internet
    connection (ppo). Change these to suit your network.


    When using NAT, remember that it''s essentially a hack. In a perfect world, we
    would all be IPv6 (the next-generation Internet), and we could get permanent subnets
    from our ISPs without any pain. In the mean-time, though, you have to deal with
    NAT limitations:


    +   Internet hosts cannot connect to services inside the private network without
    special port forwarding help from the NAT router. Of course, the hosts in the
    private network may have network security vulnerabilities, so this limitation
    may be more of a blessing than a drawback.


    +   Because Internet hosts cannot connect to internal hosts, some services need
    even more complicated packet dissection to work.


    +   NAT works for TCP, UDP, and some ICMP, but not necessarily all-transport layer
    protocols.


    +   NAT requires much more memory and computing power than normal IP routing,
    so the computer acting as the router cannot be completely underpowered. In addition,
    there is always connection overhead and latency. However, modern computers are
    more than fast enough to handle this, and the overhead and latency don''t really
    matter unless you''re running a big operation.'
  merge: -1
  pgno: 139
- img_proc: true
  md: '# 5.15 Wireless Ethernet


    The proliferation of notebook computers and other portable computing devices has
    given rise to wireless Ethernet (also irritatingly known as "Wi-Fi") that you
    do not need to physically plug into a switch or hub. There are two popular consumer
    versions of the standard: 802.11b (maximum speed 11 Mbps) and 802.11g (54 Mbps).


    In principle, wireless Ethernet isn''t much different from any other kind of Ethernet,
    that it uses radio waves instead of copper wires or fiber. You can configure a
    wireless card''s network interface with traditional tools, such as ifconfig and
    client. And wireless Ethernet cards have addresses just like their wired counterparts.


    With a wireless network, you typically will be able to send packets out to some
    wired network. To accomplish this, you can buy a wireless base station to bridge
    (or link) a wireless network to a wired network - it''s like adding more ports
    to a hub or switch by plugging in another hub or switch into one of the ports.
    A wireless base station contains both wired and wireless networking hardware;
    it physically plugs into the wired network and can also communicate wirelessly
    with wireless network devices. (You can make a regular computer to do the work
    of a wireless base station, but it''s hardly worth the.)


    Linux has an additional tool iwconfig for setting up a few technical details of
    a wireless network. For example, if someone else has a wireless network next door,
    you need to differentiate yours from theirs with an Extended Service Set Identifier
    (ESSID) string identifier.


    To enable iwconfig, your kernel needs the wireless LAN extensions that you''ll
    find in the kernel configuration''s networking support options (Chapter 10). Running
    iwconfig with no options yields output like this:


    ```

    lo no wireless extensions.

    eth0 no wireless extensions.

    eth1 IEEE 802.11-DS ESSID:"some net" Nickname:"HERMES I"

    Mode:Managed Frequency:2.437GHz Access Point:00:04:5AC:BE:17

    Bit Rate:11Mb/s Tx-Power:15 dBm Sensitivity:1/3

    RTS:off Fragment:off

    Power Management:off

    Link Quality:44/92 Signal level:-49 dB Noise level:-93 dB

    Rx invalid nwid:0 invalid crypt:0 invalid misc:7255

    ```


    As you can see, wireless settings are attached to network interfaces. The important
    settings are as follows:'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'ESSID A string identifier for the network. Your wireless access point should
    have this setting.


    **Mode** A setting that defines the type of network and the network interface''s
    role in the network. Most wireless networks are managed networks, meaning that
    there is at least one interface that serves as an access point and oversees the
    nodes on the network. Your interface can act as a client, the master access point,
    a secondary access point, or a repeater. however, there are also ad hoc networks
    that have no access points.


    **Access point** The MAC address of your current wireless access point''s wireless
    interface (if you''re on a managed network).


    **Encryption key** The wireless network card''s current Wired Equivalent Privacy
    (WEP) key.


    You can manually set these parameters just as you would with ifconfig:


    ```

    iwconfig eth1 essynet mode managed

    ```


    In the preceding example, ifconfig configures the eth1 interface with an ESSID
    of managed and a network topology of managed. The important iwconfig parameters
    are listed in Table 5-5. See the iwconfig(8) manual page for a complete list of
    parameters.


    # Table 5-5: ifconfig Parameters


    | Parameter | Value |

    |---|---|

    | essid | The ESSID string, or any. |

    | ap | The MAC address of your access point, or any. |

    | mode | Managed, Master, Repeater, Secondary, or Auto. |

    | channel | A channel number (each channel has a predetermined frequency); run
    iwlist interface channel to get a list of available channels. |

    | freq | A direct frequency specification (for example, 2.412g for 2.412 GHz).
    |

    | key | Normally, the hexadecimal value of the WEP key, or off to disable WEP.
    |


    For wireless plug-in PC cards, most distributions support the PC utilities in
    /etc/pcmcia, where you will find a configuration file called wireless.opts. When
    you plug a wireless card into your machine, the PC card services daemon described
    in Section 11.6 runs /etc/pcmcia/wireless runs iwconfig based on the parameters
    in wireless.opts, which is a Bourne case statement, making decisions primarily
    based on your wireless card''s MAC address. The wireless.opts configuration file
    has many entries that you should examine.


    To create an entry in this file for a wireless card with MAC address 00:02:2D:B0:EE:E4,
    you could use the following:'
  merge: -1
  pgno: 141
- img_proc: true
  md: '```

    *,*,00:02:2D:BO:EE:E4)

    INFO="My Home Network"

    ESSID="my network"

    MODE="Managed"

    RATE="auto"

    KEY="2688645297"

    ;;

    ```


    You must place this in the case statement in wireless.opts before these lines:


    > # NOTE : Remove the four lines START SECTION TO REMOVE

    **,*,;*

    ;;

    # END SECTION TO REMOVE


    # 5.15.1 A Lecture on Wireless Security


    Unfortunately, using radio waves as a medium is absurdly insecure. Anyone with
    any kind of wireless Ethernet device, everything as small as a Sharp Zaurus, can
    sidle up near your network and waltz all around your packets. Without any additional
    protective measures, anyone can get access to your network, snoop around your
    packets, or do something for much worse. For example, if your wireless network
    is connected to the Internet, anyone can use your network for a wide variety of
    very illegal activities.


    There are several ways to make it considerably tougher to access your wireless
    network, and you''d think that most people would use them. Surprisingly, the overwhelming
    majority do not. It''s easy to set up a completely insecure wireless network,
    whereas to make the network secure you need to enter a whole bunch of numbers
    into any computer that wants to use it. Who wants to go through all of trouble
    when the network works just out of the box? Not to mention that it''s a continuous
    hassle, especially when one of your friends comes over with a notebook.


    Everyone thinks, "Hey, all of this stuff can''t happen to me." But it and will
    you choose not to have any security. Frequently, the weakest kind of wireless
    security, WEP, drifts off virtually all would-be intruders. If nothing else, you
    should enable WEP on your access points and wireless network interfaces. Yes,
    this does mean typing in a bunch of numbers, but if you really want to risk being
    caught in the middle of a legal mess?


    You should know that WEP is not terribly secure. Given to ten million packets,
    someone snooping on your network can figure out your WEP key with a program as
    AirSniff. Of course, sniffing five to ten million packets takes a while, but if
    this concerns you, change your keys now and then (like, say, every three million
    packets).'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'In any case, never transmit any sensitive data across your network without
    serious encryption like SSL or SSH, even if you are using WEP. This is especially
    true if you do not control your network, and also holds for wired networks.


    If you have a good reason to be paranoid about security, WEP isn’t going to help
    you much. You should require IPSec or SSH port forwarding for all traffic on your
    wireless network. Many administrators use a virtual private network (VPN) to implement
    an IPSec-based system.'
  merge: -1
  pgno: 143
