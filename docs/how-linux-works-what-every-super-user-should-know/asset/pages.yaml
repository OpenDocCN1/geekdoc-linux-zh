  pgno: 265
- img_proc: true
  md: '2. Change AuthType Basic to AuthType Digest. Basic authentication sets up a
    Web browser to use Unix user passwords as plain text. Earlier in the networking
    chapters, this is a really bad idea.

    3. Run the following command to add an admin user to the CUPS digest password
    file (/etc/cups/passwd.md5):


    ```

    lpppasswd -a admin

    ```


    4. When prompted, choose a password containing at least six characters and one
    number.


    # Certificate Authentication (for Command-Line Utilities)


    You are now set up to use the CUPS Web interface securely. However, you will inevitably
    turn to command-line administration programs such as lpadmin when managing CUPS.
    These utilities also require authentication because they operate through the same
    network port as the Web interface. However, you may notice that you don''t need
    a password to run these command-line programs as the superuser. Why is this?


    The answer is that CUPS has another form of authentication called certificate
    authentication, used primarily by the command-line programs and internal server
    communication. The CUPS scheduler places identifiers in the certificate directory
    /etc/cups/certs for the one you care about is /etc/cups/certs/0. Any user that
    can read this file can run administrative programs without a password, because
    these programs send the certificate instead of a username and password.


    > NOTE Don''t use chmod to allow administrative access for non-root users because
    you may inadvertently allow administrative access for anyone on the system. Instead,
    add the desired users to the Unix group specified by the Group directive from
    Section 12.5.


    # 12.5.3 Starting CUPS


    With your security now under control, you''re ready to start the CUPS scheduler
    and add some printers. To start CUPS, all you need to do is run cupsd as the superuser.
    If you compile CUPS from source code, you should take careful note that the install
    modifies your init.d and rc.d boot directories to make CUPS part of your startup
    sequence.


    To test your installation, access the Web interface by pointing to a Web browser
    to CUPS at this URL (notice that this is the IPP port on your machine):


    ```

    http://localhost:631/

    ```


    This should yield a screen with several printing options. There are no printers
    in a new CUPS installation, so adding a printer is your first order of business.'
