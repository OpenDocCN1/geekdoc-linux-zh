- img_proc: true
  md: 'Most people would rather just not have to deal with it, but that attitude and
    a broadband connection will get your system compromised in no time. Fortunately,
    you don''t need to know very much to keep your system safe. Here are a few basic
    rules of thumb:


    +   * Run as few services as possible Intruders can break into services that don''t
    exist on your system. If you know what a service is, and you''re not using it
    at the moment, don''t turn it on just in case you might want it.


    +   * Block as much as possible with a firewall Unix systems that you may not
    know about, as TCP port 6000 for the X Window System server. No other system needs
    to know about these, and no other system in the world *should* know about them,
    Furthermore, it is very difficult to track and regulate the services on your system,
    because many different kinds of programs listen on ports. You can prevent intruders
    from discovering internal services with effective firewall rules. Refer to Section
    5.13.1 for an example firewall.


    +   * Keep on top of the services that you offer to the entire Internet If you
    run an SSH server or Postfix or other services, make sure that you have the ability
    to stay up to date with the software and get appropriate alerts. See Section 6.4
    for some online resources.


    +   * Don''t give an account to anyone who doesn''t need an account It''s much
    easier to gain superuser access from a local account than it is to break in remotely.
    In fact, given the huge base of software (and the resulting bugs and design flaws)
    available on most systems, it''s almost laughably easy to gain superuser access
    to a system after you get to a shell prompt. Don''t assume that your friends know
    how to protect your passwords (or to choose good passwords in first place).


    +   * Avoid installing dubious binary packages They can contain Trojan horses.


    That''s the practical end of protecting yourself. You should know a few basics
    on why it is important to do so. There are three basic kinds of network attacks:


    +   **Full compromise** This means getting superuser access (full control) of
    a machine. An intruder can accomplish this by trying a service attack, such as
    a buffer overflow exploit, or by taking over a poorly protected user account,
    and then trying to exploit a poorly written gesetzt program.


    +   ** Denial-of-service (DoS)** attacks These prevent a machine from carrying
    out its network services, or they force a computer to malfunction in some other
    way without any special access. These attacks are harder to prevent, but they
    are easier to respond to.'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'Virus worm Linux users are mostly immune to email worms and viruses, simply
    because their email clients aren''t stupid as to actually run programs that they
    get in message attachments, and Linux isn''t as attractive a target as Windows.
    However, you can create a Linux virus; it''s been done before, and as Linux gains
    popularity, it will happen with increasing frequency. Avoid binary software distributions,
    especially from places that you''ve never heard of. Some network services have
    been susceptible to worms before, and history is doomed to repeat itself.


    # 6.7.1 Where Linux Distributions Stand


    Not long ago, installing Linux distributions on easily accessible networks (such
    as university networks) practically ensured security compromises. These distributions
    activated every single service by default and had no default firewalling. It wasn''t
    just Linux, — Solaris is remarkably good at leaving the door open, not to mention
    the hundreds of Windows exploits, and so on.


    Linux distributions are better now; they do not activate every possible service,
    and they tend to come with preconfigured firewalls. There is no doubt that programmers
    do most of the work. Programmers delight in adding new network services, especially
    for GUI applications and support, but security takes a backseat. Better authentication
    (such as the Kerberos system) would help tremendously, but this happens to be
    one of the weakest and most disorganized areas of most applications.


    A firewall isn''t necessarily the ideal solution, but it does offer a uniform
    way to block all network traffic. The only thing that ever came close to this
    in the past was the TCP wrapper system, but that only worked for inetd servers
    and applications that specifically included wrapper support.


    In a perfect world, programmers would write invulnerable code, while you wait
    for a perfect world, you would need to know what to look out for.


    # 6.7.2 Typical Vulnerabilities


    There are two important kinds of vulnerabilities that you need to worry about:
    direct attacks and clear-text password sniffing. Direct attacks just to take over
    your machine without being terribly subtle. The most common type of direct attack
    is a buffer overflow exploit, where a careless programmer doesn''t check the bounds
    of a buffer array. The attacker fabricates a stack frame inside a huge chunk of
    data, dumps it to the remote server, and hopes that the program overwrites its
    program data and eventually executes the new stack frame. It''s a somewhat complicated
    attack, but easy to replicate.


    On the other hand, clear-text passwords can allow intruders to log in to your
    machine. From there, they will inevitably gain superuser access locally (which
    is much easier than making a remote attack), to use the machine as an intermediary
    for attacking other hosts, or both.'
