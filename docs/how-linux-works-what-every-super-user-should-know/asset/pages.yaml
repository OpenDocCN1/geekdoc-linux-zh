    # 9.1.1 Where to Start


    After you extract the contents of a source archive and have a bunch of files in
    front of you, try to get a feel for the package. In particular, look for these
    files: README and INSTALL.


    Always look at README files first. They often contain a description of the package,
    a small manual, installation hints, and other useful information. Many packages
    also come with INSTALL files that contain instructions on how to compile and install
    the package. Check for special compiler options and definitions that fall into
    roughly three categories:


    +   - Files relating to the make system, such as Makefile.in and configure. Some
    packages come with a Makefile that you may need to modify. However, most modern
    packages use autoconf and with a configure script to generate a Makefile from
    Makefile.in based on your system settings and configuration options.

    - Source code files ending in .c or .cc Source code files may appear just about
    anywhere in a package directory. C++ source code files usually have .cc, .C or
    .c suffixes.

    - Object files ending in .o or binaries. Normally there aren''t any object files
    in source code distributions. However, you may find object files in rare cases
    when the package maintainer is not allowed to release source code, and you may
    need to do something special to use the object files. In most cases, object (or
    binary executable) files in a source distribution mean that the package wasn''t
    put together too well, and you should make clean to make sure that you get a fresh
    compile.


    # 9.2 GNU Autoconf


    Even though C source code is usually fairly portable, there are still differences
    on each platform that make it impossible to compile most packages with a single
    Makefile. An early solution to this problem was to provide individual Makefiles
    for every operating system, or to provide a Makefile that was easy to modify.
    This approach somehow evolved into scripts that generate Makefiles based on an
    analysis of the system used to build the package.


    GNU autoconf is now the most popular system for automatic file generation. Packages
    using this system come with files named configure, Makefile.in, and config.h.in.
    To generate a Makefile, run configure to check your system for prerequisites:'
