    code for your system (like a C compiler), and bytecode compilers for use by a
    bytecode interpreter (usually called a virtual machine, even though''s more of
    an abstract machine). You will invariably encounter bytecode on Linux.


    Bytecode files end in .class. The Java runtime environment (JRE) contains all
    of the programs you need to run Java bytecode. To run a bytecode file, use this
    command:


    ```

    java file.class

    ```


