    \ ends with esac.\n\nFor each case value, you can match a single string (such\
    \ as bye in the preceding example), multiple strings with | (hi|hello returns\
    \ true if $1 equals hi or hello), or make use of the * or ? wildcard (what*).\
    \ If you want to make a case that catches all possible values other than the case\
    \ values specified, use a single *, as shown by the final case in the preceding\
    \ example.\n\n> **NOTE** Each case must end with a double semicolon (;;). You\
    \ risk a syntax error otherwise.\n\n# 7.6 Loops\n\nThere are two kinds of loops\
