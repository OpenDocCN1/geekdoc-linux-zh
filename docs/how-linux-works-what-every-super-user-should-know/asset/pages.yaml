  md: '```

    # CONFIG_HIGHMEM64G is not set

    # CONFIG_MATH_EMULATION is not set

    CONFIG_MTRR=y

    CONFIG_HAVE_DEC_LOCK=y

    ```


    This file isnt easy to write with a text editor, so there are several configuration
    utilities that generate the file for you. An easy, standard way to set up a kernel
    is to run this command:


    ```

    make menuconfig

    ```


    After some initial setup, make menuconfig runs a text-based menu interface that
    is shown in Figure 10-1. The box in the center of the screen contains the options
    at the current configuration level. You can navigate the menu with the up- and
    down-arrow keys. An arrow next to an item (--) indicates a submenu.


    ![](img/969dbb62afa2179379a21a5f06798aaf_224_0.png)


    Figure 10-1: The make menuconfig kernel configuration menu.


    The bottom of the menu contains three actions that you can navigate to with the
    left- and right-arrow keys. Pressing ENTER while one of the menu items is highlighted
    performs whichever of the three actions is also highlighted:


    Select If the current menu item leads to a submenu, the configuration system activates
    the submenu.


    Exit exits the current submenu. If you are at the top-level menu, the configuration
    system asks whether you would like to save the current configuration. You can
    activate the Exit option by pressing ESC.


    Help Shows any online help for the current item. You can also get at the help
    by pressing the ? key.'
  merge: -1
