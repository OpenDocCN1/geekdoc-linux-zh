- img_proc: true
  md: '# 2.1 Directory Hierarchy


    As mentioned in Chapter 1, your Linux system has a root directory (/). The root
    contains several subdirectories and possibly a file or two. This area stays clean;
    don''t let stray files end up here. But don''t fall victim to a syndrome that
    affects many administrators — removing files in a zealous attempt to keep the
    system "clean". If you don''t know what something does (and can''t figure it out),
    don''t remove it.


    The names of the directories in / have special meanings that pervade the Linux
    system in the root, but there are also many other /bin directories throughout
    the system, including /usr/bin and /usr/local/bin. All of these directories contain
    executables.


    If you want to know the gory details of the many directories on the system, have
    a look at the Filesystem Hierarchy Standard [Filesystem]. For the most part, the
    directory names reflect the root and /usr directory patterns described in the
    next sections.


    # 2.1.1 The Essential Root Subdirectories


    The most important of the root directory''s subdirectories are the following:


    +   - bin Contains binary programs (also known as *executables*), which are programs
    that are ready to run. Most of the basic Unix commands such as ls and cp are in
    /bin. However, some of the files in /bin are not in binary format because shell
    scripts perform the tasks of binaries in modern systems.


    +   - dev Contains device files. Read more about these special files in Section
    2.3.


    +   - etc The core system configuration directory (pronounced EHT-ee). User password,
    boot, device, networking, and other setup files are here. Many items in /etc are
    specific to the particular hardware on the machine — for example, the /etc/X11
    directory contains the graphics configuration directory.


    +   - home Holds personal directories for normal users on the system. Most Unix
    installations conform to this standard.


    +   - lib An abbreviation for library. In Linux, this directory holds library
    files containing code that executables can use. There are two types of libraries:
    static and shared. The /lib directory should contain only shared libraries, but
    other lib directories such as /usr/lib contain both varieties, as well as other
    auxiliary files.


    +   - proc Provides system statistics through a directory-and-file interface that
    you can browse with standard Unix tools, like those introduced in Chapter 1. Much
    of the /proc subdirectory structure on Linux is unique, but many other Unix variants
    have similar features.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '+   - sbin The place to find system executables. Programs in sbin directories
    pertain to system management, so regular users usually do not have sbin components
    in their command paths. Many of the utilities do not work for normal users.


    +   - tmp The place to put temporary files that you don''t care much about. Any
    user may read to and write from /tmp, but they may not have permission to access
    another user''s files. Some programs use this directory as a workspace. If something
    is extremely important, put it in /tmp. Most distributions clear /tmp when the
    machine boots, and some even remove its old files periodically. Don''t fill /tmp
    either, because its space is usually shared with something critical (the rest
    of /, for example).


    +   - usr Pronounced as "user," but this subdirectory does not contain user files
    (there have been no user files in /usr on Unix systems long before Linux existed).
    Instead, /usr is a large directory hierarchy that looks like the root. The bulk
    of the Linux system resides in /usr. Many of the directory names in /usr are the
    same as in the root and hold the same type of files; /usr/bin and /lib are two
    examples. The primary reason that the root does not contain the complete system
    is to keep requirements low. The /usr is so important that Section 2.1.3 is dedicated
    to it.


    +   - var The "variable" subdirectory, where programs record runtime information.
    System logging, user tracking, caches, and other files that system programs create
    and tend all go into /var. There is a /var/tmp similar to /tmp, but the system
    doesn''t wipe it on clean.


    # 2.1.2 Other Root Subdirectories


    There are a few interesting subdirectories in the root:


    +   - boot Contains kernel boot loader files. These files pertain only to the
    first stage of the Linux startup process; you will not find information about
    how Linux starts up its services in this directory.


    +   - cdrom Where most Linux distributions attach a CD drive; the contents of
    the disc are under this directory. The root may contain similar directories for
    other removable devices.


    +   - opt May contain additional third-party software. Many systems don''t use
    /opt.


    # 2.1.3 The /usr Directory


    The /usr directory may look relatively clean at first glance, but a quick look
    at /usr/bin and /usr/lib reveals that there''s a lot here. In addition to the
    subdirectories that you just read about, /usr contains the following:'
  merge: -1
  pgno: 50
- img_proc: true
  md: '+   - include Holds header files used by the C compiler (see Section 8.1.2).

    - info Contains GNU info pages (see Section 1.13).

    - local Where administrators can install their own software. Its structure should
    look like that of / /usr.

    - man Contains manual pages. Unformatted pages go in the man*directories here
    (according to the numbered category described in Section 1.13, and human-readable
    formatted pages go in cat*).

    - share Contains files that should work on other Unix machines with no loss of
    functionality. That''s the theory, anyway; a true directory becoming rare because
    there are no space issues on modern disks. It is often more of pain to maintain
    a shared directory than it''s worth. In any case, man, info, and some other subdirectories
    are often found here.

    - X1R6 Holds the core Linux windowing system software, called XFree86. However,
    the custom configuration files for your computer are usually in /etc/X11.

    - dict An oddball subdirectory containing dictionaries; /usr/dict/words is one
    such dictionary file.


    # ## The Kernel


    You now know what the Linux directory structure looks like. Before going to devices
    and filesystems, you must learn some higher-level concepts about the kernel.

    The *kernel* of an operating system is the very core of a running system. It''s
    a very special program that manages all processes, device drivers, and I/O. When
    the system boots, the kernel runs first, initializing hardware and internal data
    structures. After the kernel completes this stage, it loads and starts the init
    program.

    The kernel also has many functions once the system boots. Process and device management
    are the most important. The idea is that although computers with one CPU run only
    one program at a time, the kernel can keep several programs in memory at the same
    time. Process and device management run together in a cycle like this:


    +   1. The kernel has control of the processor. There are several processes in
    memory.

    2. The kernel selects a process and finds out that process was last running.

    3. The kernel relinquishes control of the processor to that process.

    4. That process runs for a few milliseconds.

    5. When the time is up, a clock interrupt stops the process and gives control
    back to the kernel.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '6. The kernel takes care of any system work that it needs to do, such as

    reading to and from devices.

    7. Go to step 2.


    This description of the kernel''s work is somewhat simplified, but as you can

    see, there is nothing magic about the kernel. It is not a process; it is just

    piece of code that runs every now and then between processes.


    On Linux systems, the kernel is normally in a file /vmlinuz

    /boot/vmlinuz. A boot loader loads this file into memory and sets it in motion

    when the system boots. Details on how to configure the boot loader

    and how to create a Linux kernel are in Chapters 3 and 10.


    If you are interested in the detailed workings of a kernel, the classic

    textbook is Operating System Concepts [Silberschatz].


    # 2.3 Devices


    You will find it very easy to manipulate device on a Unix system because

    the kernel normally presents the device I/O interface to system and user

    processes as files. Not only can a programmer use regular file operations to

    work with a device, but some devices are also accessible to standard programs

    like cat, so you don''t have to be a programmer to use a device. Linux uses

    the same design of device files as other Unix flavors, but device filenames

    and functionality vary among flavors.


    Linux devices are in the /dev directory, and running ls /dev reveals

    that there are more than a few files in /dev. So how do you work with devices?

    To get started, consider this command:


    ```

    echo blah > /dev/null

    ```


    Like any command with redirected output, this sends some stuff to the

    standard output to a file. However, the file is /dev/null, a device, and the

    kernel decides to do with any data written to this device. In the case of

    /dev/null, the kernel simply ignores the data (making /dev/null a bitbucket).

    of Course, other devices actually do doing things, such as /dev/dsp, which plays

    sound if you send appropriate output there (for example, cat blab.wav >

    /dev/dsp).


    To identify a device, use ls -l to get a long listing and look at the

    permissions. Here are four examples:


    | biW-IW---- 1 root disk 3, 65 Jul 20 1998 hdb1 |

    | CIW-IW-IW- 1 root root 1, 3 Jul 20 1998 null |

    | PIW-I--I-- 1 root root 0 Mar 3 19:17 gpmdata |

    | SIW-IW-IW- 1 root root 0 Dec 18 07:43 log |'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'Notice the very first character of each line in the listing. If this character
    is b, c, p, or s, then the file is a device. These letters stand for block, character,
    pipe, and socket, respectively:


    +   **Block device** Programs access data in a block device in fixed chunks. hdb1
    in the preceding example is a disk device. Because disks break down into data,
    it is only natural that a disk be a block device. A block device''s total size
    is fixed, and a program has random access to any block in the device.


    +   **Character device** Character devices work with data streams. You can read
    characters from or write characters to these devices, like /dev/null in the previous
    example. Character devices don''t have a size; when you read from or write to
    a character device, the kernel usually performs a leaving record of the activity
    inside the kernel. Printers are character devices, and after the kernel sends
    data to a printer, the responsibility for that data passes to the printer; the
    kernel cannot back up and reexamine the data stream.


    +   **Pipe device** Niped pipes are like character devices, but there is another
    process at the other end of the I/O stream instead of a kernel driver. An example
    of such a process is gpm, a program that can duplicate mouse events and send them
    to the named pipe /dev/gpidata for use by other programs.


    +   **Socket device** Sockets are special-purpose I/O files offering a type of
    network interface. For example, the gpm program accepts control commands through
    the /dev/gpctl socket. You don''t need to worry about sockets if you''re not a
    network programmer.


    The numbers before the dates in the first two lines of the previous listing are
    the major and minor device numbers that help the kernel identify the device. Similar
    devices usually have the same major number, such as hda3 and hdb1 (these are both
    hard disk partitions).


    # 2.3.1 dd and Devices


    The name dd stands for convert and copy. dd is extremely useful when working with
    block and character devices. This program''s sole function is to read from an
    input file or stream and write to an output file or stream, doing some encoding
    conversion on the way. It was originally developed for reblocking.


    dd copies data in blocks of a fixed size. Here is an example of using dd with
    a character device and some common options:


    ```

    dd if=/dev/zero of=new_file bs=1024 count=1

    ```'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'As you can see, the dd option format is different from the option formats of
    most other Unix commands; rather than use the character to signal an option, you
    name an option and set its value to something with the - sign. The preceding example
    copies a single 1024 -byte file from /dev/zero (a continuous stream of zero bytes)
    to the file new_file. These are the important dd options:


    +   - if=file The input file. The default is the standard.

    - of=file The output file. The default is the output.

    - bs=size The block size; dd reads and writes this many bytes of data at a time.
    To abbreviate large chunks of data, you may use b and k signify 512 and 1024 bytes.
    Therefore, the example above could read bs=1k instead of bs=1024.

    - ib=size, ob=size The input and output block sizes. If you can use the same block
    size for both input and output, use the bs option, but if this is impossible,
    then use ib and bs for input and output, respectively.

    - count=num The total number of blocks to copy. When working with a huge file,
    or a device that supplies an endless stream of data (like /dev/zero), you want
    dd to stop at a fixed point. Otherwise you waste a lot of disk space, CPU time,
    or both. count can be used in conjunction with the skip parameter to copy a small
    piece out of a large file or device.

    - skip=num Skip the first num blocks in the input file or stream; do not copy
    them to the output.


    # 2.3.2 Device Name Summary


    Sometimes it is difficult to find the name of a device (for example, when partitioning
    a disk). Here are two tactics for finding out:


    +   - Guess the name from the output of the dmesg command (which prints the last
    few kernel messages) or the kernel system log file (see Section 4.1); this output
    might contain a description of the devices on your system.

    - Run cat /proc/devices to see the block and character devices for which your
    system currently has drivers. Each line consists of a number and name. The number
    is the major number of the device described in Section 2.3. If you can guess the
    device from the name, look in /dev for the character or block devices with the
    corresponding major number, and you''ve found the device files.


    Neither method is terribly reliable, especially because the kernel does not load
    device drivers until you try to use them. (Section 10.8 has information on the
    driver-loading mechanism.)


    The following sections list the most common Linux devices and their naming conventions.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Hard Disks: /dev/hd*


    These are the ATA (IDE) disks and partitions. All are block devices.

    Two example names are /dev/sda1 and /dev/hdb. The letter hd identifies the disk,
    and the number represents the partition. A device without a number is a device
    for an entire disk. (Information on how to partition disks is in Section 2.3.4.
    To connect disks to your current systems, start at Section 2.4.3.)


    # SCSI Disks: /dev/sd*


    SCSI disks carry the names /dev/sda, /dev/sdb, and so on, and the disks work much
    like their ATA counterparts, the SCSI disk names do not directly correspond to
    a SCSI host controller and target. Linux assigns the devices in the order that
    it encounters.

    For example, if you have two SCSI controllers, scsi0 and scsi1, with disks scsi0
    target 0, 3, and scsi1 target 1, the device assignments are as shown in Table
    2-1.


    # Table 2-1: Sample Device Assignments


    | Controller | Target | Device Assignment |

    |---|---|---|

    | scsi0 | 0 | /dev/sda |

    | scsi0 | 3 | /dev/sdb |

    | scsi1 | 1 | /dev/sdc |


    This naming scheme can cause problems when reconfiguring hardware. Let''s say
    scsi0 target 3 explodes and you must remove the disk that the machine can work
    again. When you do so, scsi1 target 1 moves to /dev/sdb from /dev/sdc, and you
    have to change the fstab file (described later in this chapter).


    # Terminals: /dev/tty*, /dev/pts/*, /dev/tty


    Terminals are devices for moving characters between the system and an I/O device,
    usually for text output to a terminal screen. The terminal device interface goes
    back a long way, to the days when terminals were typewriter-devices.

    Pseudo-terminal devices are emulated terminals that understand the I/O features
    of real terminals, but rather than talk to a real piece of hardware, the kernel
    presents the I/O interface to a piece of software, such as a shell window.

    Two common terminal devices are /dev/tty1 (the first virtual console) and /dev/pts/0
    (the first pseudo-terminal device).

    dev/tty device is the controlling terminal of the current process. If a process
    is currently reading from and writing to a terminal, this device is a synonym
    for that terminal. A process does not need to be attached to a terminal.


    36 Chapter 2'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Serial Ports: /dev/ttyS5*


    Serial ports are special terminal devices. You can''t do much on the command line
    with serial port devices because there are too many settings to worry about, such
    as baud rate and flow control.


    The port known as COM1 on Windows is /dev/tty50, COM2 is /dev/tty51, and so on.
    For add-in modem cems, check the output of the dmesg command for the port assignment.


    # Floppy Disks: /dev/fd*


    Section 11.1.1 covers operations on these block devices. The 3.5-inch floppy on
    most modern systems is /dev/fd0.


    # Parallel Ports: /dev/lp0, /dev/lp1


    These unidirectional port devices correspond to LPT1 and LPT2 in Windows. You
    can send files (such as a file to be printed) directly to a parallel port with
    the cat command, but you might need to give the printer an extra form or reset
    afterward.


    The bidirectional parallel ports are /dev/parport0 and /dev/parport1.


    # Audio Devices: /dev/dsp, /dev/audio, /dev/mixer, /dev/snd/*, etc.


    Linux has two sets of audio devices. There are separate devices for the OSS (Open
    Sound System) and the newer ALSA (Advanced Linux Sound Architecture) system interface.
    Linux systems that use ALSA usually contain OSS compatibility devices, because
    most applications still use OSS. Some rudimentary operations are possible with
    the dsp and audio devices that belong to OSS. As mentioned earlier, the computer
    plays any WAV file that you send to /dev/dsp frequency mismatches. The ALSA devices
    are in the /dev/snd directory, but you can''t do much by restricting I/O to them.


    > The aplay programs can play samples from the command line. To adjust the volume
    and mixer settings, amix and alsmixer are available on most systems.


    # 2.3.3 Creating Devices


    To create one device file, use mknod. The device name as well as its major and
    minor numbers. For example, if you remove /dev/hda2 by accident, you can create
    it with this command:


    ```

    mknod /dev/hda2 3 2

    ```


    The b 3 2 specifies a block device with a major number 3 and a minor number 2.
    For character or named pipe devices, use c or p instead of b. The mknod command
    is useful only for creating the missing device or named pipe. As you upgrade your
    system and add device drivers, you may need to create entirely new groups of devices.
    Because there are so'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'many devices, it''s better to use the MAKDEV program (found in /dev) to create
    groups of devices. Device groups can be named after the common part of several
    device names, such as hda, or they can have a completely separate name, such as
    std-hd. For example, to create all devices beginning with hda, run this command:


    ```

    /dev/MAKDEV hda

    ```


    The MAKDEV command is harmless if the devices already exist on your system.


    devfs


    Before you go to the trouble of making any device files, you should see whether
    you''re running devfs, an automatic device-file generation system. The easiest
    way to check for devfs is to run mount and look for devfs in the output.

    If your system runs devfs, you should not have to create missing device files
    because the kernel maintains the directory of available device files. Linux kernels
    typically configure devfs at boot time, starting a special auxiliary program called
    devfsd that gives the administrator the ability to customize the device system.


    devfs was an experimental feature in older Linux kernels, but is classified as
    obsolete in the latest Linux kernels.


    # 2.3.4 Partitioning Disk Devices


    Before you can use a new disk on your system, you need to know how to partition
    disks with their device files. If you''ve never worked with partitions before,
    don''t worry. A disk partition is just a piece of the disk dedicated to one purpose,
    such as a specific directory tree. On PCs, partitions have numbers starting at
    1.

    To get, identify the disk that you want to partition. Most PCs have two ATA interfaces,
    called primary and secondary interfaces, and each interface can have a master
    and slave disk, for a total of four disk devices. The standard ATA disk assignments
    are as follows:


    +   - /dev/hda Master disk, primary interface

    - /dev/hdb Slave disk, primary interface

    - /dev/hdc Master disk, secondary interface

    - /dev/hdd Slave disk, secondary interface


    There are several partitioning utilities, but the most simple and direct is fdisk.
    To get started, run fdisk (where dev is one of the devices listed above), then
    print the current partition list with p.

    Here is sample from fdisk output for a device with three partitions, two containing
    filesystems and one with swap (see Section 2.5 for more information on swap partitions).'
