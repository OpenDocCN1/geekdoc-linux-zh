    # 3.1.3 Adding and Removing Services


    If you want to add, delete, or modify services in the rc*.d directories, you

    need to take a closer look at the files inside. A long listing reveals a structure

    like this:


    ```

    S10sysyslogd -> ../init.d/syslogd

    S12kernel -> ../init.d/kernel

    S15netstd_init -> ../init.d/netstd_init

    S18netbase -> ../init.d/netbase

    ...


    ```


    The commands in an rc*.d directory are actually symbolic links to files in

    an init.d directory, usually in /etc or /etc/rc.d. Linux distributions contain

    these links so that they can use the same startup scripts for all runlevels. This

    convention is by no means a requirement, but it often makes organization a

    a little easier.


    To prevent one of the commands in the init.d from running in

    a particular runlevel, you might think of moving the symbolic link in the

    appropriate rc*.d directory. This does work, but if you make a mistake and

    never need to put the link back in place, you might have trouble remembering the

    exact name of the link. Therefore, you shouldn''t remove links in the

    rc*.d directories, but rather, add an underscore (_) to the beginning of the

    link name like this:


    ```

    mv S99httpd _S99httpd


    ```


    At boot time, rc ignores _S99httpd because it doesn''t start with S5 or K.

    Furthermore, the original name is still obvious, and you have quick access

    to the command if you''re in a pinch and need to start it by hand.


    To add a service, you must create a script like the others in the init.d

    directory and make a symbolic link in the correct rc*.d directory. You

    may need to read Chapter 7 first if you''re not familiar with shell scripts.

    However, the easiest way to write a script is to examine the scripts already

    in init.d, make a copy of one that you understand, and modify the code.


    When adding a service, make sure that you choose an appropriate place

