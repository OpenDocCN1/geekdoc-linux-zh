- img_proc: true
  md: '# 17.1.2 Memory


    The third guideline from the beginning of this chapter ("you often get what you
    pay for") is most important when buying memory. Name-brand memory is only marginally
    more expensive than generic labels, and it can save you many headaches. A Linux
    machine exhibits odd behavior if it has bad memory. If a program seems to crash
    often, look for these symptoms:


    +   - The crash happens in the same place every time.

    - Rebooting makes the problem away.

    - The operating system appears unaffected, and other programs run fine.

    - It happens during frequent disk access.


    You should consider buying ECC (error-correcting code) memory. It is a little
    less expensive than standard memory, and not all motherboards support it (read
    your motherboard manual carefully), but ECC practically ensures you have never
    a memory problem.


    A Linux system automatically uses extra memory for disk cache, and this can substantially
    improve performance for applications that use large files (or several small files).
    However, for many users, there is a point where more memory adds little or no
    benefit because the system has already cached everything. You can briefly check
    the state of a system''s memory utilization with the free command; the information
    in /proc/meminfo has a little more detail.


    # 17.1.3 Hard Disk


    The old "IDE versus SCSI" question was once one of the biggest debates surrounding
    hard disks. However, if you want to build a desktop computer, the debate means
    little, because you will likely choose an ATA (IDE) disk out of cost. In the old
    days, power users used ATA disks to be performance dogs, and there wasn''t a large
    disparity in price when compared against SCSI disks. Improvements in CPU speeds,
    caching, memory cost, the interface, and hard disk manufacturing techniques have
    made ATA perform well for a desktop system with a single disk — even Apple switched
    its desktop disks to the ATA type.


    A disk has two primary specification numbers: average access time (measured in
    milliseconds) and rotation speed (measured in rotations per minute, or RPM). In
    general, a faster (lower) access time is the more important consideration for
    Unix, because the system spends a lot of time looking at a bunch of small files.
    If you are a software developer, this is particularly important because compilers
    and scripting languages use many file accesses on a single invocation. On the
    other hand, if you have big files (movies, music, whatever), a higher rotational
    speed gets this off the hard disk faster.'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'There usually isn''t a trade-off between rotational speed and access time because
    they are linked. More RPMs mean the disk head takes less time to pass over the
    proper place on the disk platter for the next access, hence a lower average access
    time.


    Higher performance, however, comes at a price and beyond the sticker price. The
    fastest-spinning disks are usually noisy and generate more heat. I''ll spare you
    the "hard disks I have hated in the past" war stories, but if you want a quiet
    disk, look for one with a fluid bearing system (sometimes called FDB). These drives
    use liquid instead of solid ball bearings for their platters, and are a big improvement
    for your ears.


    Any ATA disk should work in a Linux system. The kernel disk drivers are fast,
    and they support special features with the hdpar command. If you run into compatibility
    issues, they will likely be between your motherboard and the disk (in particular,
    some older motherboards do not support disks larger than 32GB; look for jumpers
    on the disk to "clip" the disk, limiting it to a lower capacity).


    If you put two disks in the same system, put them on different interfaces (your
    motherboard should have primary and secondary ATA interfaces ), which should improve
    concurrent access slightly. If you purchase an add-in ATA interface card, you
    may need extra drivers. When considering one of these cards, look for drivers
    in the ATA support menu described in Section 10.4.1.


    # 17.1.4 Network Cards and Infrastructure


    The Linux kernel supports wired PC Ethernet devices (also known as NICs, or network
    interface cards), but you should check any card against the compatibility list
    in a current Linux kernel. Don''t believe a manufacturer''s claim of compatibility
    in this case — the manufacturer may require you to install a special kernel driver
    before the device works. Keep in mind that the kernel drivers that come from vendors
    often don''t work correctly.


    Most cable and DSL, adapters require an Ethernet card. You should be able to use
    any supported Ethernet regardless of the protocol that you use, provided that
    Linux supports the protocol. You may need to use a funny protocol like PPPoE for
    your provider (see Section 5.9).


    Current networks of 100Base-T (100 megabytes per second, or about 12 megabytes
    per second) are more than adequate for most purposes. They are also very inexpensive.
    To attach several machines to a home network, you need a hub or switch (it is
    possible to connect two machines directly with an Ethernet crossover cable, but
    this isn''t really worth the trouble).


    The most significant differences between using a hub and a low-end switch is that
    a switch can send and receive signals at the same time and therefore has a potential
    of faster throughput and lower latency. However, unless you have a habit of sending
    large files around your network simultaneously, you won''t notice much of a performance
    difference between the two. On the other hand, the difference in price between
    hubs and switches'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'is also fairly small. Whether you purchase a hub or a switch, pick a model
    that has ports for each of your computers, plus a few extra. Also, make sure that
    the hardware supports the older 10Base-T standard. This feature is often called
    10/100, and it provides the most convenient way to move files from an old computer
    with a 10Base-T interface.


    # Wireless Ethernet


    You may want to consider wireless Ethernet for a notebook, even if you don''t
    plan to use Ethernet when you''re on the go. There are several advantages:


    +   - It is one less cable to connect. This saves time as well as wear and tear
    on the machine.

    - Visitors with wireless cards can connect to your network without much hassle.

    - Some PDAs can connect to a network with wireless Ethernet.

    - You may need to connect to a foreign network at some time.


    There are also some disadvantages:


    +   - It is more expensive.

    - Security can be a hassle

    - There are some really annoying twerps who think that wireless Ethernet makes
    them the coolest people on the planet.


    To make Ethernet work, you need a wireless access point along with the network
    card (some notebooks with integrated cards). Many access points come in in units
    that also provide a broadband router and an integrated switch. If you don''t have
    a broadband connection or choose not to use the routing feature, the switch can
    still be useful for connecting desktop computers.


    For notebook Ethernet cards, see Section 11.6. For information on how to set up
    a wireless client, see Section 5.15.


    # 17.5 Graphics Hardware


    Your primary concern in choosing a video card should be compatibility with XFree86.
    Although you can inspect the list of compatible cards at http://www.xfree86.org/
    and http://www.x.org/, it is unfortunately not always easy to identify a card
    because manufacturers have a habit of not changing product names while altering
    hardware significantly.


    As with the motherboard, a good method for ensuring that your system is to identify
    a brand or particular graphics chip that has consistent support and then find
    a video card that isn''t cutting-edge. If a card has been available for some time,
    there is a much greater chance of XFree86 support. Regarding performance, quick
    video hardware often means very little under Linux; in fact, the fastest 3-D hardware
    may not be optimal for normal tasks in XFree86.'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'XFree86 supports multi-output video cards and additional cards that can drive
    multiple monitors, sometimes called multiple heads. If you value your onscreen
    workspace, this is worth looking at the emergence of LCD displays makes it feasible
    to have two large monitors without the desk size of an aircraft carrier. You can
    also combine multiple displays into one big virtual display with the Xinerama
    extension.


    # 17.2 Other Hardware Components


    It''s time to move beyond the essential components and look at your choices for
    the other parts that you can attach to a computer.


    # 17.2.1 Monitors


    Because you will work with the shell interface more under Unix than other operating
    systems, you should choose a monitor that displays crisp text. In addition, high
    resolution is important in a monitor because you want the ability to display at
    least shell or text editor windows at once, so that you can quickly switch between
    them. However, you can only take resolution so far. To the beginner, it is always
    tempting to reduce the font size to accommodate more windows, but because there
    is no real substitute for a large display.


    Traditional Unix workstations like Sun SPARCStations usually come with very large,
    expensive cathode ray tube (CRT) monitors offering some of the highest resolutions
    commercially available. CRT displays are now lighter and carry the lowest price
    of high-end displays. However, you should avoid them whenever possible. Above
    all, an LCD display offers a razor-sharp text display that is impossible on any
    CRT. This advantage, combined with a very light weight, small footprint, and lack
    of a flyback transformer makes a good case for an LCD display for all but the
    most special-purpose applications. At some point in the not-so-distant future,
    a CRT will not even be a consideration, rendering this paragraph a historic curiosity.


    As mentioned above, traditional monitors that paired with Unix machines had fairly
    high resolutions. The minimum that Sun and Next used was 1152×900 (often called
    megapixel displays), and most users found it comfortable (you won''t find this
    option on modern LCD displays). 1024×768 is a little cramped but passable if you
    can keep a minimal desktop environment. It also may be the only option if you
    are shopping for a notebook. A 1280×1024 display is the next step up and it is
    often ideal; if you happen to have just a little extra and are aching to spend
    it on something worthwhile, this is it. Higher resolutions such as 1600×1200 are
    good if you have large graphics to display. However, if you want to increase your
    workspace, especially for text, it''s better to buy a second monitor and use'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'the multi-monitor support mentioned in Section 17.1.5. A multi-monitor configuration
    costs less than a single monitor and gives you more effective onscreen space due
    to the layout of the monitors.


    # 17.2.2 Keyboards


    Choose your keyboard wisely, because you''ll use it more than you imagined in
    Linux. First, check the basics of the layout. Is the ESC key in a reasonable place,
    and is it a normal-sized key? This is extremely important for vi users, who press
    ESC on a regular basis. Where are the tilde- (~) and pipe-backslash (|) keys?
    These characters come up frequently in shell commands. (To those using non-U.
    keyboards, you might want to ask a friend about good key layouts and mappings.)


    If you intend to run only Unix on your computer, keys other than those immediately
    around the alphanumerics aren''t important. You don''t really need a numeric keypad
    or 37 function keys. Arrow keys are also less important when running Unix unless
    you''re playing a game. Nearly every program that takes text input accepts CONTROL-P,
    CONTROL-N, CONTROL-B, and CONTROL-F (up, down, left, right, and respectively).
    In vi, you will make use of h, j, k, and l (left, down, up, and right).


    One little thing to watch out for is the CAPS LOCK key. On virtually every keyboard
    made, it is next to the A key. This is wrong; the CONTROL key belongs there. CAPS
    LOCK is large enough and doesn''t have an overly weird shape. You should remind
    the CAPS lock to CONTROL and use it that way.


    # 17.2.3 Mice


    Other than your personal preferences and testing, there is only one thing to remember
    when buying a mouse: Make sure your mouse has at least three buttons. The third
    (middle) button in X Window applications does a paste operation; you don''t want
    to be without it. You can even use it to paste a URL into a browser window. Also,
    clicking on a link in Mozilla with the middle button makes the link appear in
    a new window or tab.


    In a modern mouse, the scroll wheel usually doubles as the third button when pressed
    down. The scroll wheel is more difficult to press than a real button, and many
    Unix veterans dislike this. However, there may be some merit to it, because clumsy
    fingers on traditional three-button mice have been known to paste strange commands
    into Unix shells and editors.


    # 17.2.4 Modems


    Most modems and many voice modems work with Linux. There is only one very important
    rule when buying a modem for Linux: Never buy a Winmodem. These devices require
    complicated software drivers to signal processing. There are some straggling Linux
    drivers for certain Winmodems'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'out there, but you shouldn''t bother. You don''t want waste time trying to
    set this up, and you don''t want the extra strain on your kernel. It is unfortunate
    that many notebooks come with Winmodems; if you have a Winmodem in your notebook,
    your only option is usually to get a PC Card modem.


    That said, for desktops you have a choice between internal and external modems.
    Internal modems are cheaper, do not have power supplies, and need no cords other
    than the telephone line. Unfortunately, they may also require some Plug-and-Play
    manipulation or disabling of serial. You may be able to use an external USB modem,
    but make sure there''s a Linux driver before you buy.


    # 17.2.5 Printers


    Because Unix printers generate the PostScript page description language, the easiest
    way to get a Linux-compatible printer is to buy one that supports PostScript.
    Many laser printers and some inkjet printers with this capability. Unfortunately,
    these printers are also more expensive than those with simpler imaging technology.


    Linux also supports printers that don''t understand PostScript Ghostscript to
    transform the PostScript generated by the printer drivers into something they
    understand. However, this adds an extra step to the printing process inside your
    machine, and it can be difficult to configure (see Chapter 12).


    There are three common ways to connect a printer to a Linux system: using a parallel
    port, using a USB port, or adding the printer to a local area network. The parallel
    port is an old and somewhat primitive method, but it works well. USB is the newest
    method and should work as well as your USB drivers do (see Section 11.3). Printing
    over the network is fast, it requires no extra drivers, and it is the easiest
    to configure. Most network-capable printers also support PostScript, but they
    are considerably more expensive than their non-networked counterparts.


    # 17.3 A Word About Hardware Upgrades


    Before we look at how you can save money, you should know something about upgrades.
    For many people, some kinds of products seem more appealing because you can upgrade
    somewhere down the line. This may work for old tools and kitchen appliances, but
    the computer industry doesn''t think that way. They want you to buy something,
    use it for a year, throw it away, and then buy the newest model because they wouldn''t
    make any money if they actually had to offer upgrades for the dinosaurs of the
    past. Really, computers just aren''t designed like the Stanley #5 jack plane,
    which was offered in the same basic form for 115 years.'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'If you see something advertised as being upgradable to some future specification
    with some extra piece of hardware, it probably isn''t going to do you a whiff
    of stuff, especially if that extra piece of hardware doesn''t exist yet. It usually
    means that the company has a new product that isn''t quite ready, and therefore,
    the marketing department is trying to think of ways to milk an old product. If
    that little upgrade actually does occur, it will most likely be crippled by the
    old and new technologies are so different that the engineers had to do some really
    bogus stuff to get the things to talk to each other. I could bring up countless
    examples, many involving CPUs, but you should take my word on this one.


    So what can you upgrade, and what kinds of parts can you carry from an old computer
    to a new one? Disks, for one, are always fairly easy to add to a machine, whether
    a disk is used or new. Memory is a little more complicated. For the most part,
    you can add more memory to your existing system, but keep in mind that you may
    need to remove some of your old memory to make room for the new stuff.


    You should regard the motherboard, processor, and memory as one unit when purchasing
    hardware. Don''t even think of carrying just one of these components over to a
    newer system (well, this is a slight fib; sometimes you can keep your memory,
    but it''s very rare). You may also need a new power supply, case, or graphics
    card when you upgrade hardware on your system, because the standards for these
    components are not terribly stable.


    Peripherals and USB devices are easier to carry from system to system. There really
    isn''t any need to change peripheral devices (like printers) if you have what
    works. And if you have a keyboard or mouse that you like a lot on your old system


    Upgradable firmware (embedded software) in external hardware components (such
    as modems) is also a good thing, because it''s much easier for a company to write
    software to support new protocols than to develop and produce hardware fixes.


    # 17.4 Saving Money


    Axiom 3 in the introduction to this chapter stated that you often get what you
    pay for; in other words, you might need to pay for a system that works and works
    well. However, there''s no injunction against saving money. If you don''t have
    an obsession with the very latest products, and you know what to look for, you
    can look for slightly older stuff and save a substantial sum.'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# 17.4.1 CPU


    Although it is true that your CPU does most of the work on a Linux system, the
    CPU normally spends most of its time doing absolutely nothing. The uptime command
    reveals that the processor isn''t running any jobs. If processor speed is important
    to you, you''ll know it from the type of computing that you do, be it graphics
    or numerical analysis. But for the vast majority of users, there are many features
    more important than CPU speed, and carefully choosing a processor is one of the
    best ways to save money on a new computer.


    Nowhere does price so wildly diverge among processors. A vendor''s list at the
    time of this writing shows one price for its fastest CPU. The next step down is
    50 percent of that price, but it is still 91.5 percent as fast as the top model.
    A slower processor costing 25 percent of the top model retains 78 percent of the
    performance. Now you may ask yourself, maybe I need that extra 22 percent of power?
    For comparison, I am typing on a computer that is only 12 percent as fast as the
    top processor in that list, and I have no complaints.


    The trick to selecting a processor is to pick a spot on the performance/price
    curve that looks good. Figures 17-1 and 17-2 show plots of ten processors. Figure
    17-1 shows how quickly the price rises as the processor speed reaches the fastest
    available. In Figure 17-2 on the next page, you can see how much performance you
    get for each dollar that you spend for the same set of processors.


    ![](img/969dbb62afa2179379a21a5f06798aaf_342_0.png)


    Figure 17-1: Costs of several processors.'
  merge: -1
  pgno: 342
- img_proc: true
  md: '![](img/969dbb62afa2179379a21a5f06798aaf_343_0.png)


    Figure 17-2: Performance value.


    If you are strictly interested in getting the most bang for the buck, the best
    choice is the CPU represented by the maximum in the graph on the right. However,
    keep in mind that you might want to go for one of the CPUs with slightly faster
    numbers because it might cost only a few dollars more, or you might be able to
    buy a CD or something else with the savings from choosing a marginally slower
    option.


    You must be cautious in measuring the performance of a processor. The only halfway
    precise way to compare processors is to compare different clock speeds of the
    *same model*. Looking at the megahertz (MHz) numbers of two different models,
    even from the same manufacturer, is comparing apples and oranges. The benchmark
    results you read about are also unreliable because operation speeds vary among
    different processors. Unless you know exactly what you''re looking for, benchmarks
    are next to useless. Decide on a price first, and then look for the best deals
    among the models that fall within your price range.


    If you find any of this economic analysis remotely interesting, you might want
    to read the first chapter of *Computer Architecture: A Quantitative Approach*
    [Hennessey].


    # ## 17.4 Hard Disk


    More expensive hard disks often provide more space for the money. For example,
    a certain hard disk may offer 100 percent more space over another model for only
    33 percent more money. But if you''re running Linux, which'
  merge: -1
  pgno: 343
- img_proc: true
  md: 'is an operating system with relatively low system storage requirements, is
    "supersizing" really worth it? Considering how much modern hard disk can store,
    will you actually use that extra space before you buy another disk?


    By the time you need to purchase another disk, you may find that the cost per
    megabyte on a new disk is far lower, or that there are desirable technology improvements
    that just make you want to decommission your old disk. Remember that the hard
    disk still has moving parts, and it is therefore one of the least reliable components
    in a computer.


    # ### 17.4.3 Computer Case


    Ugly cases with unrefined power supplies and sophisticated internal structures
    are cheaper. If you''re not picky and can put up with the hassle, this could be
    worth it (that is, you a graduate student and know what it means to have something
    "cheap but somewhat functional if kind of annoying\). Also, you might be able
    to get a used case for free. Be careful, though: a secondhand power supply may
    not work with your motherboard, and it may not work at all.


    # ### 17.4.4 Video Card


    Sometimes you can get a graphics card that the vendor targets for office users.
    These cards are often less expensive than others. Also, old or discontinued models
    on clearance won''t hurt performance on Linux.


    # ## 17.5 Notebooks


    It is difficult to balance Linux compatibility with the latest features on notebook
    computers. The most common problems with notebooks are built-in video chipsets
    that XFree6 does not support. Other components that tend to lack drivers are modems,
    Ethernet interfaces, sound cards, and CD-ROM drives.


    The online community is a good place to look for information on Linux notebook
    compatibility. The http://www.tuxmobile.org/ site is a clearinghouse links to
    people who are running Linux on nearly all common notebook models. However, these
    pages are often out of date, and the driver configuration or bug fixes described
    may not be necessary with current Linux drivers.


    # ## 17.6 Smaller Designs


    Once upon a time, if you wanted a PC, your options were limited to large machines.
    Because interchangeable parts were so important to build the PC as a commodity,
    manufacturers were reluctant to design anything smaller because the factor form
    would change and be incompatible with everything on the market. Very small Unix
    machines were on the market, such as the Sun SPARCstation IPC and IPX, but they
    were expensive.'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'This is changing. Increased demand from consumers, small dimensional standards
    taken largely from notebook computers, and special applications have created a
    market for a new class of machines. Form factors such as Mini-ITX are now on the
    market. They aren''t the fastest computers around, and they aren''t overly expandable,
    but they have big advantages. They are small, quiet, use less power, generate
    less heat, and are astonishingly inexpensive. Linux has made a contribution to
    the increasing popularity of these machines. Whereas a computer with relatively
    low processor power stood no chance against a market using Microsoft''s resource-hungry
    operating systems, the ever-increasing population of Linux users does not care.
    Manufacturers know this and make sure that their products support Linux.


    The current small machines are hybrids. The motherboards can still fill into standard
    cases, use normal-size memory, and often have a single PCI slot. They accept standard
    PC components, even the power supply. However, because many of the components
    are self-contained and generate little heat (including power supplies), it has
    become fashionable to custom-build smaller enclosures. These machines really shine
    when placed in special cases that will not accept larger components.


    One common example of this is the CD-ROM drive. On a regular desktop computer,
    these devices are gigantic because they fit into a half-height 5 1/4-inch drive
    bay. To make them fit in a smaller machine, an easy substitution for the normal
    size CD-ROM drive is a notebook CD-ROM drive. Like the embedded processors found
    on many small motherboards, a notebook CD-ROM drive may not be as quick as its
    larger cousin, but it is a fraction of the size.'
  merge: -1
