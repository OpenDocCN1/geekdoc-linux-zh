- img_proc: true
  md: 'A tape does not contain a filesystem. Furthermore, there is no information
    on a tape indicating the name of each file (though automated backup systems usually
    include a special tape index file at the beginning of the tape). When manually
    working with a tape, you work with file numbers and file marks, and nothing else.


    To access the data on a tape, you must manipulate the tape drive head. Figure
    13-2 shows the initial position of the tape head. Let''s say that your tape device
    is sto, so you''re using the tape device /dev/nsto. First, verify the tape position
    with the mt status command (the -f file option specifies the tape device file;
    remember that you do not need this if you set the TAPE environment variable);


    mt -f /dev/nsto status


    ![](img/969dbb62afa2179379a21a5f06798aaf_293_0.png)


    Figure 13-2: The tape head at the beginning of a tape.


    The output should look like this (the following output is from a DAT drive):


    ```

    SCSI 2 tape drive:

    File number=0, block number=0, partition=0.

    Tape block size 0 bytes. Density code 0x13 (DDS 61000 bpi).

    Soft error count since last status=0

    General status bits on (41010000):

    BOT ONLINE IM_REP EN

    ```


    There''s a lot of information here:


    +   - The current file number is 0.

    - The current block number is 0, so the tape head is at the beginning of a file.

    - You should ignore the partition; most tape drives don''t support it anyway.

    - The block size is 0, meaning that the tape drive does not have a fixed block
    size.

    - The density code indicates how much data can fit on the tape.'
