    It is possible to change the way the kernel schedules a process so that the process
    gets more or less CPU time than other processes. The kernel runs each process
    according to its scheduling *priority*, which is a number between -20 and 19,
    with -20 being the foremost priority (yes, it''s a bit confusing).

    The ps -1 command lists the current priority of a process if it is stopped, and
    it''s a little easier to see how it works with the top command, as shown here:


