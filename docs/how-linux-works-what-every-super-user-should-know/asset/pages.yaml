    # 5.9.1 Routers


    Before you connect your Linux machine directly to a broadband connection, you
    need to ask yourself this very important question: Is it really worth it?


    The alternative is to purchase a small router. These very inexpensive devices
    do not only speak IP and PPPoE, but often include a multi-port 10/100Base-T Ethernet
    switch and a wireless access point. They can do network address translation, route
    packets from the outside world to ports on their internal networks, and more.
    (Sometimes they have pretty lights that serve eye candy when you have nothing
    else to do)


