- img_proc: true
  md: '# 10.4.3 Installing Modules


    Before you install and boot from your new kernel, you should put the new kernel
    modules in /lib/modules with this command:


    ```

    make modules_install

    ```


    Your new modules should appear in /lib/modules/version, where version is your
    kernel version. If you fail to install the modules before booting your kernel,
    the kernel module utilities will not automatically recognize the new modules,
    and you may end up missing a few drivers.


    The module installation builds a module dependency list in /lib/modules/version/modules.dep.
    If this stage fails, it''s likely that your module utilities are out of date.
    As of this writing, the module utilities are in a package named module-init-tools.


    # 10.4.4 Kernel Parameters


    Sometimes you need to send extra parameters to the kernel at boot time in order
    to get devices or services working. For example, one of the most elementary kernel
    parameters is root=partition, which sets the initial root partition to partition.


    You can enter a kernel parameter after the kernel image name. For example, at
    a LILO prompt where your kernel label is Linux, you can type this:


    ```

    Linux root=/dev/hda3

    ```


    Documentation/kernel-parameters.txt contains a list of all kernel parameters.
    Most of them are for hardware. In addition to root=partition, here are the most
    important parameters:


    +   - init=path This starts as the first process on the system in place of /sbin/init.
    For example, you can use init=/bin/sh to get out of a tight spot if your init
    does not work properly.


    +   - mem=size This specifies that the machine has size memory, the kernel should
    not autodetect the memory size. For example, to specify 512MB of memory, you would
    use mem=512M.


    +   - rootfstype=type This specifies that the root filesystem''s type is type.


    A number as a boot parameter indicates the init runlevel. You can use s or 5 for
    single-user mode.


    # 10.5 Installing Your Kernel with a Boot Loader


    Boot loaders load kernel images into memory and hand control of the CPU over to
    the newly loaded kernel. To make your new kernel work, you must tell the boot
    loader about the kernel.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'If you have never worked with boot loader before, you need to know how a PC
    boots from the hard disk. On a normal Microsoft-based system, the boot process
    works like this:


    +   1. After performing the power-on self test (POST), the BIOS loads sector I
    of the hard disk into memory and runs whatever landed in memory. On Windows-based
    systems, this sector is called the Master Boot Record (MBR).


    +   2. The MBR extracts the partition table from the disk and identifies the "active"
    partition.


    +   3. The MBR loads and runs yet another boot sector from the active partition,
    setting the operating system in motion.


    On a Linux system, you can install the kernel boot loader on the active partition
    or you can replace the MBR with the boot loader. If you decide to replace the
    MBR with a boot loader such as GRUB or LILO, it is important to remember that
    the active partition has little meaning — these boot loaders address partitions
    based on their own configuration systems.


    From a practical point of view, your decision to overwrite the active partition
    makes little difference. If your machine runs Linux, you probably want GRUB or
    LILO as your default boot loader. Even if you have a dual-boot machine, you still
    want to use GRUB or LILO, because both boot loaders are capable of loading boot
    sectors from other operating systems.


    The important point is that you know exactly where your boot loader resides. Let''s
    say your disk is /dev/sda and you have a Linux root partition at /dev/sda3. If
    you replace the MBR by writing GRUB to /dev/hda, you need to remember that the
    active partition is now irrelevant; GRUB uses its own configuration system to
    access partitions. However, if you decide to write the boot loader to /dev/hda3
    instead, keeping the old MBR, your system will get to boot loader only if /dev/hda3
    is the active partition.


    If you need to replace the MBR on a hard disk, run the DOS command FDISK /MBR.


    When configuring a boot loader, be sure that you know the location of the root
    partition and any kernel parameters.


    # 10.5.1 Which Boot Loader?


    Because there are two popular Linux boot loaders, you may wonder which one you
    should choose:


    LILO Linux Loader. This was one of the very first Linux boot loaders. Its disadvantages
    are that it is not terribly flexible and that you must run lilo to install a new
    boot block every time you install a new kernel. However, LILO is fairly self-contained.'
  merge: -1
  pgno: 236
- img_proc: true
  md: 'GRUB Grand Unified Boot Loader. This is a newer boot system gaining in popularity,
    and it does not need a reconfiguration for every new kernel because it can read
    many kinds of filesystems. This feature is especially handy for situations where
    you might need to boot from an old kernel. Initially, GRUB is slightly trickier
    to configure than LILO, but it is much easier to deal with once installed, you
    do not need to replace the boot sector for every new kernel. I recommend GRUB.


    # 10.5.2 GRUB


    With GRUB, you need only install the boot loader code on your machine once; after
    that, you can modify a GRUB menu file for any new kernel that you want to boot
    on a permanent basis.


    The GRUB boot files are in /boot/grub. GRUB loads the various stage files into
    memory during the boot process. If you already have GRUB on your machine, you
    just need to modify the /boot/grub/menu.lst when you add a new kernel image under
    a new name.(If you install a new kernel with the same name as the old kernel,
    you do not need to modify the menu file).


    Some distributions preinstall GRUB but have a different name for menu.lst. You
    may need to dig around in /boot to find the correct filename. In any case, the
    menu file looks like this:


    ```

    default 0

    timeout 10

    title Linux

    kernel (hdo0,0)/vmlinuz root=/dev/hda1

    title backup

    kernel (hdo,0)/vmlinuz.0 root=/dev/hda1

    ```


    The parameters in the menu file are as follows:


    +   - default The title entry that GRUB should boot by default. 0 is the first
    entry, 1 is the second, and so on.

    - timeout How long GRUB should wait before loading the default image.

    - title A label for the kernel.

    - kernel The kernel image and parameters, possibly including the root device.


    In GRUB, (hdo) is the first hard disk on your system, usually /dev/hda. GRUB assigns
    disk mappings in the order that they appear on your system, so if you have /dev/hda
    and /dev/hdb devices but no /dev/hdb, GRUB would assign (h0) to /dev/hda and (h1).
    The first number is for the disk, and the second is for the partition (if there
    is a partition). Check /boot/grub/device.map file for your system''s hard drive
    mapping.'
  merge: -1
  pgno: 237
- img_proc: true
  md: 'The kernel images in the preceding example are on the root partition of the
    primary master ATA hard disk. There are two kernel images: a regular kernel at
    /boot/vmlinuz and a backup at /boot/vmlinuz.0.


    # Root Device Confusion


    You may find it that the root partition is actually specified twice in the kernel
    line in the preceding example (you can see (hd0,0) and /dev/hda1). This is easy
    to explain: the (hd0,0) is where GRUB expects to find the kernel image, and root=/dev/hda1
    is a Linux kernel parameter that tells the kernel what it should mount as the
    root partition. These two locations are usually, but not always, the same. However,
    the GRUB and Linux device names are completely different, and so you need them
    in two places in the configuration file.


    Unfortunately, you may see this alternate syntax in menu.lst:


    ```

    root (hd0,0)

    kernel /boot/vmlinuz0 root=/dev/hda1

    ```


    This is confusing, because GRUB does not pass its root parameter (hd0,0) to the
    Linux kernel. Omitting the GRUB root parameter can prevent some head scratching.


    # Booting Other Operating Systems


    There are all sorts of other things you can do with GRUB, like load splash screens
    and change the title (use info grub to see all of the options). However, the only
    essential thing you should know is how to make a dual-boot system.


    Here is a definition for a DOS or Windows system on /dev/hda3:


    ```

    title dos

    rootnoverify (hd0,2)

    makeactive

    chainloader +1

    ```


    Remember how the PC boot loaders usually work, by first loading whatever is on
    the first sector of the disk, then loading the first sector of the active partition.


    # Installing GRUB


    To put GRUB on your system for the first time, you must make sure that you have
    a menu.lst file. The GRUB installation process does not create menu.lst; you must
    come up with this file on your own. If you don''t, you can still boot your system,
    but you must type a series of commands resembling entries in menu.lst as follows:


    ```

    kernel (hd0,0)/boot/vmlinuz root=/dev/hda1

    boot

    ```'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'To install the GRUB software, run this command to put the boot sector on your
    disk:


    ```

    grub-install device

    ```


    Here, device is your boot device, such as /dev/hda. However, if you have a special
    /boot partition, you need to do something like this:


    ```

    grub-install --root-directory=/boot device

    ```


    After running grub-install, review /boot/grub/device.map to make that the devices
    relevant to booting the kernel are in the map file and agree with your menu.1st
    file.


    # 10.5.3 LILO


    To load your kernel with LILO, you must settle on a permanent location for your
    kernel image and install a new boot block for every change you make to the kernel
    configuration.


    Let''s say that you want to boot /vmlinuz as your kernel with a root partition
    of /dev/hda. Furthermore, you want to install the boot loader on /dev/hda (replacing
    the MBR). Do the following:


    +   1. Move the new image into place at /boot/vminuz.

    2. Create the LILO configuration file, /etc/lilo.conf. An elementary configuration
    might look like this:


    ```

    boot=/dev/hda

    root=/dev/hda1

    install=/boot/boot.b

    map=/boot/map

    vga=normal

    delay=20


    image=/boot/vmlinuz

    label=Linux

    read-only

    ```


    +   3. Run lilo -t v to test the configuration without changing the system.

    4. Run lilo to install the boot loader code at /dev/hda.


    You can add more images and boot sectors to the LILO configuration. For example,
    if you saved your previous kernel as /boot/vmlinuz.0, you could add this to your
    lilo.conf to make the old image available as backup at the prompt:


    ```

    image=/boot/vmlinuz.0

    label=backup

    read-only

    ```'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'You can use the other keyword for foreign operating systems. The following
    addition to lilo.conf offers a Windows partition on /dev/hda3 as dos at the LILO
    prompt:


    ```

    other=/dev/hda3

    label=dos

    ```


    # LILO Parameters


    Some of the most important lilo.conf parameters are listed here:


    +   - **boot=bootdev** Writes the new boot sector to the bootdev device.

    - **root=rootdev** Uses rootdev as the kernel''s default root partition.

    - **read-only** Mounts the root partition initially as read-only. You should include
    this for normal boot situations (init remounts the root partition in read-write
    mode later).

    - **append="** Includes options as boot parameters.

    - **delay=num** Displays the LILO prompt for num tenths of a second before booting
    the default kernel image.

    - **map=file** Stores the kernel''s location in map_file. Don''t delete this file.

    - **install=file** Specifies that file is the actual boot loader code that lilo
    writes to the boot sector.

    - **image=file** Defines a bootable kernel image with file. You should always
    use the label parameter directly following this definition to name the image.

    - **label=name** Uses name to label the current boot entry.

    - **other=partition** Defines another partition that contains a boot sector; analogous
    to image for other operating systems. Use label to define a label for the boot
    sector.

    - **linear** Remaps the boot sector load references when the BIOS disk geometry
    is different than the geometry that the Linux kernel sees. This is usually not
    necessary, because most modern BIOS code can recognize very large disks.


    # 10.5.4 Initial RAM Disks


    An initial RAM disk is a temporary partition that the kernel should mount before
    doing else. Red Hat Linux uses initial RAM disks to support SCSI hot controller
    drivers and all other drivers that are compiled as modules.


    > NOTE You do not need an initial RAM disk if you compile all the drivers necessary
    to mount your root filesystem directly into your kernel. The overwhelming majority
    of systems do not need an initial RAM disk.'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'To install an initial RAM disk on a Red Hat Linux system, follow these steps:


    +   1. Build your kernel and install the modules. Do not run any boot loader configuration
    or reboot just yet.


    +   2. Run this command to create a RAM disk image (where *version* is your kernel
    version):


    ```

    mkinitrd /boot/inititrd-version version

    ```


    +   3. If your boot loader is LILO, add this line to your new kernel''s section
    in lilo.conf and run lilo:


    ```

    initrd-=/boot/inititrd-version

    ```


    +   4. For GRUB, add the following to the appropriate kernel section:


    ```

    initrd /boot/inititrd-version

    ```


    # 10.6 Testing the Kernel


    When you boot your new kernel for the first time, you should take a careful look
    at the kernel diagnostic messages to make sure that all of your hardware shows
    up and that the drivers are doing what they are supposed to do. Unfortunately,
    kernel messages tend to fly by so quickly that you can''t see them. You can run
    dmesg to see the most recent messages, but to see everything, you need to look
    at your log files.


    Most /etc/syslog.conf files send kernel messages to a file such as /var/log/kernel.log.
    If you don''t see it anywhere, add a line like this to your /etc/syslog.conf:


    ```

    kern.* /var/log/kernel.log

    ```


    Then run this command:


    ```

    kill -HUP ~/var/run/syslogd.pid

    ```


    You may wish to make a checklist for your new kernel to make sure that your system
    still operates as it should. Here''s an example:


    +   * Do the network interface and network firewalls work?


    +   * Are all of your disk partitions still visible?


    +   * Does the kernel see your serial, parallel, and USB ports?


    +   * Does all of your external hardware work?


    +   * Does the X Window System work?'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# 10.7 Boot Floppies


    You can also boot the kernel from a floppy disk. Creating a boot floppy can be
    useful when recovering a Linux system that has no active kernel.


    To create a boot floppy, put a freshly formatted floppy disk in the drive, go
    to the kernel source directory, and run this command:


    ```

    make bz

    ```


    Of course, this only works if the size of your bImage is smaller than the floppy
    disk capacity.


    You may also need to run rdev to set the floppy''s default root device. For example,
    if your root partition is /dev/hda1, use this command:


    ```

    rdev/fdo /dev/hda1

    ```


    Again, boot floppies are primarily useful during a system recovery when there
    is no active kernel. For testing new kernels, it''s far better just to use an
    advanced boot loader as GRUB.


    # 10.8 Working with Loadable Kernel Modules


    Loadable modules are little pieces of kernel code that you can load and unload
    into the kernel memory space while the kernel is running.


    The make modules_install command (discussed in the "Installing Modules" section)
    installs the kernel module object files in /lib/modules/ver-version, where version
    is your kernel version number. Module object filenames end with .ko in kernel
    versions 2.6.0 and later, and .o in older releases.


    All distributions use modules in some capacity. If you would like to see the modules
    currently loaded on your system, run this command:


    ```

    lsmod

    ```


    The output should look something like this:


    | Module | Size Used by |

    | es1370 | 24768 0 (autoclean) |

    | appletalk | 19966 13 (autoclean) |


    This output includes es1370 (a sound card) and appletalk (a network protocol driver).
    autoclean means that the kernel may try to automatically unload the module if
    it is not used for some time.


    To load a module, use the modprobe command:


    ```

    modprobe module

    ```'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'To remove a single module, use the -r option:


    ```

    modprobe -r module

    ```


    As mentioned earlier, you can find module dependencies in /lib/modules/version/modules.dep.
    Dependencies don''t arrive on your system by magic; you must build an explicit
    list (the module install process usually does this for you). You may need to create
    dependencies by hand for all installed kernel versions after installing a module
    that doesn''t come with the kernel. You can do this by running this command:


    ```

    depmod -a

    ```


    However, this doesn''t always work, because depmod may try to read the symbol
    function memory address locations in the currently running kernel. It won''t work
    if you''re trying to build dependencies for kernels other than the one you''re
    running. To zero in on a particular kernel version, find a System.map file that
    corresponds to that kernel, and then run this command:


    ```

    depmod -a -F System.map version

    ```


    As mentioned earlier, you do not need to run depmod under normal circumstances,
    because make modules_install runs it for you.


    > If you can''t find the module that corresponds to a particular feature, go to
    the feature in the kernel configuration menu and press ? to get the help screen.
    This usually displays the module name.


    # 10.8.1 Kernel Module Loader


    It''s inconvenient to manually load a module every time you need to use a particular
    feature or driver. For example, if you compiled a certain filesystem as a module,
    it would be too much work to run a modprobe before a mount command that referenced
    the filesystem.


    The Linux kernel provides an automatic module loader that can load modules without
    additional modprobe or insmod commands. To use the loader, enable the Kernel module
    loader option in the kernel configuration. A kernel with the module loader runs
    modprobe to load modules that it wants.


    There are limits to what the module loader can do without additional configuration.
    In general, it can load most modules that do not involve specific devices. For
    example, the module loader can load IP tables modules, and it can load filesystem
    modules as long as you specify the filesystem type with a mount command.


    The module loader cannot guess your hardware. For instance, the module loader
    will not try to figure out what kind of Ethernet card is in your system. Therefore,
    you need to provide extra hints with the modprobe.conf file.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# 10.8.2 modprobe Configuration


    The modprobe program reads /etc/modprobe.conf for important device information.

    Most entries are aliases such as this:


    alias eth0 tulip


    Here, the kernel loads the tulip module if you configure the eth0 network interface.

    In other cases, you may need to specify drivers by their major device numbers,
    such as this entry for an Adapttec host controller:


    alias block-major-8 aic7xxx


    Wildcards are also possible in modprobe.conf aliases. For example, if all of

    Ethernet interface cards use the tulip driver, you can use this line to catch
    all

    interfaces:


    alias eth* tulip


    > NOTE The module utilities discussed here are the ones that go with kernel version
    2.6.0. These

    programs are part of the module-init-utils package. Earlier kernel versions used
    the

    modutils package. The most significant difference between the two sets of utilities
    is that

    the new package reads modprobe.conf instead of modules.conf. The syntax in both
    files

    is similar.


    # Chaining Modules and the install Keyword


    You can chain modules together with the install keyword. For example,

    if SCSI disk support isn''t compiled directly into the kernel, you can force

    it, as in this example for /dev/sda on the Adapttec host controller from the

    preceding section:


    alias block-major-8 my_scsi_modules

    install my_scsi_modules /sbin/modprobe sd_mod; /sbin/modprobe aic7xxx


    This works as follows:


    +   1. A process (or the kernel) tries to access /dev/sda. Assume that this device

    is not yet mapped to an actual device.

    2. The kernel sees that /dev/sda isn''t mapped to its device, which has a

    block major number of 8. Therefore, the kernel runs this command:


    modprobe block-major-8

    3. modprobe searches though /etc/modprobe.conf for block-major-8 and finds

    the alias line.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '4. The alias line says to look for my_scsi_modules, so modprobe runs itself,
    this time as follows:


    ```

    modprobe my_scsi_modules

    ```


    5. The new modprobe sees install my_scsi_modules in modprobe.conf, and then runs
    the command(s) that follow in the file. In this case, these commands are two additional
    modprobe commands.


    You can include any command that you like in an install line. If you need to debug
    something or just want to experiment, try adding an echo command.


    **NOTE** There is a remove keyword that works like install but runs command when
    you remove a module.


    # Module Options


    Kernel modules can take various parameters with the options keyword, as shown
    in this example for a SoundBlaster 16:


    ```

    alias snd-card-0 snd-sb16

    options snd-sb16 port=0x220 irq=5 dma=8 dma16=5 mpu_port=0x330

    ```'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# 11

    CONFIGURING AND MANIPULATING PERIPHERAL DEVICES


    This chapter covers various peripheral devices that may be attached to your computer.
    Although compiling and installing the low-level drivers for your kernel are the
    first steps in getting any device including peripherals working, you may also
    need additional utilities or servers to do anything useful with the device.


    A great deal of the work involved when configuring peripherals is digging through
    kernel log messages to see exactly how the kernel assigns a device and whether
    the kernel recognizes the device correctly in the first place. Therefore, this
    chapter contains a great number of example kernel messages that you can use as
    a guide for your own installation.'
  merge: -1
