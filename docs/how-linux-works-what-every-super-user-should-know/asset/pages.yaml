  md: '# PREFACE


    This book is about learning how a Linux system works so that you can be an effective
    systems administrator, programmer, home user, researcher, or just someone who
    likes to have fun with their computer. If you want to know what you can do when
    you have root access, then this book is for you.


    The first part of this book shows you the basic layout and workings of a Linux
    system, including the directory structure and boot process. From there, you will
    learn the basics of networking.


    The next part of the book is dedicated to programming tools. You may wonder why
    programming tools are important to system operation; after all, other systems
    don''t come with development software. Unix-like systems as Linux are different;
    not only is it not at all unusual to build your own version of popular software,
    but shell scripts and similar tools are closely intertwined with the system.


    With the basic topics out of the way, the last half of the book is dedicated to
    more specialized information, such as the kernel, printing, and user environments.
    In addition, there is a special chapter dedicated to purchasing hardware suitable
    for Linux systems.


    One of the nice things about Linux is that the system doesn''t make any effort
    to hide itself from you. You don''t have to worry about strange undocumented binary
    formats, catch-all configuration databases (such as the Windows Registry), and
    frustratingly opaque GUI setup tools. Furthermore, like its BSD cousins, Linux
    retains its users because it gives them the chance to customize their systems
    to a degree impossible on other platforms This book shows you how.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Prerequisites


    You do not have to know much about Linux or Unix to understand this book. Basic
    computer knowledge is more important than specifics. Here are the bare essentials:


    +   - You should know what files and directories are.

    - You should have Linux installed on a computer of your own, superuser (root)
    account, and a regular user account. The distribution that you choose does not
    matter. You need to be able to experiment with your machine as you read this book.


    In addition, it helps if you have a little experience with the Unix shell. Without
    this background, it may take some time to get through the first chapter. You may
    also want to review binary and hexadecimal number systems for a few sections of
    the book.


    # Kernel Chapter


    Some time ago, I wrote a document called the Kernel-HOWTO. Due to increased demands
    on my time, I had to give up maintainership, but I haven''t forgotten the first
    Linux-related thing I ever wrote. Chapter 10 is all-new material on how to configure
    and compile the Linux kernel. Furthermore, you are free to copy and distribute
    Chapter 10 as if it were a regular HOWTO document.


    # Acknowledgments


    Thanks go to James Duncan, Douglas N. Arnold, Bill Fenner, Ken Hornstein, Scott
    Dickson, Dan Ehrlich, Felix Lee, Scott Schwartz, Gregory P. Smith, Dan Sully,
    Gina Steele, and, of course, everyone at No Starch Press.


    Brian Ward

    San Francisco, CA'
