    # 4.11 Labs


    # Lab 1: Improving the Basic Character Driver


    Starting from sample_driver.c, extend it to:


    +   - Keep track of the number of times it has been opened since loading, and
    print out the counter every time the device is opened.

    - Print the major numbers when the device is opened.


    To exercise your driver, write a program to read (and/or) write from the node,
    using the standard Unix I/O functions (`read()`, `write()`, `close()


    After loading the module with `insmod` (which is equivalent to typing `cat /proc/modules/`).


    # Lab 2: Private Data for Each Open


    Modify the previous driver to ensure that each opening of the device allocates
    its own data area, which is freed upon release. Data will not persist across multiple
    opens.


    # Lab 3: Seeking and the End of the Device.


    Adapt one of the previous drivers to have read and write entries watching out
    for the end of the device.


    Implement a `lseek()` entry point. See the man page for `lseek()` to see how return
    values and error codes should be specified.


    For an extra exercise, use the `POSIX_SEEK` bit to make any attempt to seek result
    in an error.


    # Lab 4: Dynamical Node Creation (I)


    Adapt the previous driver to allocate the major number dynamically.


    Write loading and unloading scripts that ascertain the major number assigned and
    remove the node as required.


