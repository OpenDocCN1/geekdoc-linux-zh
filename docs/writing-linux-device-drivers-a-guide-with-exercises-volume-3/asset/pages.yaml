  md: '# Chapter 22


    # PCI


    ![](img/5f0cab84232061dba742ffc69894b1f1_137_0.png)


    We''ll see how Linux uses PCI devices, and describe the various functions used
    to find and manipulate them. We''ll also consider the newer PCI Express standard.


    | 22.1 What is PCI? | 253 |

    | 22.2 PCI Device Drivers | 256 |

    | 22.3 PCI Structures and Functions | 258 |

    | 22.4 Accessing Configuration Space | 259 |

    | 22.5 Accessing I/O and Memory Spaces | 260 |

    | 22.6 PCI Express | 261 |

    | 22.7 Labs | 261 |


    # 22.1 What is PCI?


    PCI stands for Peripheral Component Interconnect. It replaces ISA (Industry Standard
    Architecture) with three main goals:


    +   * Better performance transferring data between CPU and peripherals.

    * Platform-independent as possible.'
