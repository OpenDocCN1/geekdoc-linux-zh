  md: '# Chapter 13


    # ioctls


    ![](img/5f0cab84232061dba742ffc69894b1f1_87_0.png)


    We''ll consider the ioctl method (I/O Control) which is a grab bag which can be
    used in many different ways for applications to communicate with device drivers.
    We discuss what ioctls are, how they are called, and how to write driver entry
    points for them.


    +   13.1 What are ioctls? .....................................................................................
    153

    13.2 Driver entry point for ioctls ....................................................................
    154

    13.3 Locking ioctls .......................................................................................
    155

    13.4 Defining ioctls .......................................................................................
    156

    13.5 Labs .....................................................................................................
    158


    # 13.1 What are ioctls?


    ioctl() (input output control) are special functions which are unique to a device
    or class of device. ioctl() is both a call from user-space, as well as a driver
    entry point (i.e., like write()), read(), etc.).


    Various commands can be implemented which either send or receive information from
    a device. One can control device driver behaviour: i.e., shutdown, reset and modify.
    One can send out-of-band messages when reads and writes are pending.'
