    # 24.3 Network Drivers


    We are going to concentrate on the datalink layer, the device driver. We are going
    to consider the allocation of the network and transport layers except for how
    they interact with device drivers.


    For other classes of devices, network drivers can be built-in or modular.


    Network drivers are fundamentally different from block and device drivers because
    they operate in an asynchronous mode. They are identified by a name, such as eth
    or ppp0.


    At the kernel level we work with packet transmission and reception, not read and
    write operations. The network driver asks to push pushing packets; other drivers
    are sent to send towards the kernel.


    To make a network device driver, templates are implemented in the kernel sources.
    For ISA hardware, the relevant file is /usr/src/linux/drivers/net/isa-skeleton.c,
    and for PCI it is /usr/src/linux/drivers/net/pci-skeleton.c.'
