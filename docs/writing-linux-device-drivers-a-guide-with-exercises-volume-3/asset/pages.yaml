  md: '# 4.1 Device Nodes


    Character and block devices have filesystem entries associated with them. These
    nodes can be used by user-level programs to communicate with the device, whose
    driver can manage more than one device node.


    Examples of device nodes:


    ```

    ```

    lvrxdev  1 root      3 May 25 01:56 cdr - hda

    br-rw---- 1 root floppy  2, May 25 01:56 fd80

    br-rw---- 1 root floppy  2, May 24 01:56 f60d0

    cr-rw---- 0 root       09, May 16 01:56 c4072

    cr-rw---- 1 loop       99, May 25 01:56 parton0

    cr-rw---- 1 loop       99, May 25 01:56 parton2

    ```

    ```


    Device nodes are named as


    ```

    ```

    mknod [-m mode] /dev/<name> <major> <minor>

    e.g., mkn 666 /dev/sdc 254 1

    ```

    ```


    or from the kernel system.


    # 4.2 Major and Minor Numbers


    The major and minor numbers identify the driver associated with the device. Generally
    speaking, all device nodes of the same type (block or character) with the same
    major number use the same driver.


    The minor number is used only by the driver to differentiate between the different
    devices it may control. These might be different instances of the same kind of
    device (such as the first and second card, or hard partition) or different operations
    of a device (such as primary and slave drives).


    The major and minor numbers are stored in a variable of dev_t, which has 32 bits,
    with 12 bits for the major number, and 20 bits for the minor.


    The internal layout is complicated for historical reasons, and it is not guaranteed
    that it will change in future kernel versions. Thus one should always use the
    following macros to construct (or deconstruct) major and minor numbers from a
    dev_t structure.


    Table 4.1: Device node macros


    | Macro | Meaning |

    |---|---|n| MAJOR(dev_t dev); | Extract the major number. |

    | MINOR(dev_t dev); | Extract the minor number. |

    | MKDEV(int major, int minor); | Return a dev_t built from major and minor numbers
    |


    One can use the inline function:


    ```

    ```

    unsigned int major(struct inode *inode) / = = MAJOR(inode->i_dev);

    unsigned int minor(struct inode *inode) / = = MIN(inode->i_dev);

    ```

    ```


    when one needs to work with structures.


    ![](img/5f0cab84232061dba742ffc69894b1f1_29_0.png)


    +   - In the kernel, device nodes are packed in the dev_t type, which was limited
    to 16 effective bits, even divided between major and minor numbers, so that each
    was limited to the range 0-255.


    +   - In the kernel registered a major number, no other driver could be registered
    with the same major, and all minor numbers belonged to the driver.


    +   - In the 2. kernel, however, one assigns a range of minor numbers which can
    be less than all available, and two loaded drivers can have the same major number,
    as long as they have distinct minor number ranges.


    A list of major and minor numbers pre-assigned devices can be found in /usr/src/linux/Documentation/devices.txt.
    (The major numbers 122, 140 and 254 are reserved for experimental devices, etc.)
    Symbols assigned for major numbers can be found in /usr/src/include/linux/maxfs.h.
    Device number reservations are probably,, but more methods using dynamical allocation.


    That that devices have methods in user-space as well, in some POSIX system calls
    such as inode and stat have arguments with the dev_t type data, or use structures
    that do.'
