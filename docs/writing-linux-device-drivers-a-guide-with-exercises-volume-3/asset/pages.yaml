  md: 'CHAPTER 24. NETWORK DRIVERS 1: BASICS


    276


    The outermost header and footer correspond to the datalink layer, which describes
    the hardware, device driver, and the hardware type of network: such as Ethernet
    or Token Ring. For instance, the MAC address will appear here.


    The next layer describes the network protocol, such as IPv4, and the innermost
    header describes the transport layer, such as TCP or UDP.


    For reasons of optimization, the network and transport layer are not completely
    separated as they might be. In practice network layers may contain implementations
    of the transport layer, rather than passing through a common code base. For instance,
    both internal and local stacks have their own implementation(code).


    24.4. LOADING/UNLOADING


    # 24.4 Loading/Unloading


    Network drivers are loaded and unloaded with:


    ```

    #include <linux/netdevice.h>

    ```


    ```

    int register_netdev(struct net_dev *dev);

    voidregister_netdev(struct net_dev *dev);

    ```


    Usually one registers the device in the initialization callback function and unregisters
    it in the exit call.


    ```

    ifconfig interface [options] [address]

    ```


    can be used to stop, or configure interfaces,


    register_netdev(*dev) function invokes an initialization routine to probe for
    the network card, and in the file the net_device structure, which includes the
    interface name (which can be dynamically assigned).unregister_netdev(*dev) removes
    it from the list of interfaces.


    The net_dev structure contains all information about the device, and we will discuss
    it in detail. To obtain proper reference use the allocated and freed dynamically
