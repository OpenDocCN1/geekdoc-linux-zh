  md: '# CHAPTER 23. DIRECT MEMORY ACCESS (DMA)


    # 23.3 DMA MEMORY CONSTRAINTS


    # 23.1 What is DMA?


    Direct Memory Access (DMA) permits peripheral devices to transfer data to or from
    system memory while bypassing CPU control. Proper non-virtual peripherals are
    likely to have DMA capabilities.


    The types of DMAs are very hardware-dependent, both in the sense of the CPU involved
    (e.g., x86 or Alpha), and the type of bus (e.g., PCI, ISA, etc.), and to certain
    degrees of freedom from independence.


    Since the 2.4 kernel there has been effort to provide a hardware-independent interface.
    This was achieved in the 2.6 kernel series, permitting to deal with more abstract
    methods than getting deep into the hardware particulars..


    On the x86 platform, DMA operates quite differently for ISA and PCI devices. One
    could say:


    +   * ISA: The hardware is less complex, but the device drivers are more complicated
    and have to work hard to manage DMA transfers.

    * PCI: The hardware is more complex, but the device drivers are less complicated
    and have easier managing DMA transfers.


    When we concentrate on the PCI bus which is more modern and widespread.


    When application pushes (or writes) data to the hardware also has a synchronous
    transfer and the steps are simple.


    Transfers can be triggered asynchronously when the hardware acquires and pushes
    data to the system when there are no masters present. In this case:


    +   * The driver kernel must buffer the data until a read() call is issued by
    an application.

    * The hardware announces the arrival of data by raising an interrupt.

    * The interrupt handler tells the hardware where to send the data.

    * The peripheral device puts the data in the DMA buffer.

    * The hardware issues an interrupt when it is finished.


    Note that while pushes and pulls have many similar steps, the asynchronous transfer
    involves two per transfer, not one.


    # 23.2 DMA and Interrupts


    DMA must occupy contiguous memory. You can''t use valloc(), kmalloc() and the
    get_free() functions. You can use only the allocated functions which will be physically
    contiguous.


    If you specify DMA, the primary memory will not be contiguous, and on x86 it will
    fall under MAX_ADDRESS=16 MB limit.


    The efficiency of DMA is very dependent on proper interrupt handling. Interrupts
    may be required when the device acquires, and we will need to know when the transfer
    is complete.


    Transfer requires a DMA-suitable buffer, which must be contiguous and within an
    address range of the device. We will discuss how such buffers can be allocated
    and released. If we follow this other: either a buffer exists for the transfer
    and is not released until it is re-used in subsequent transfers; or must be allocated
    before the transfer begins and released when it completes.


    For PCI this could be unnecessary and wasteful, but then PCI devices with actually
    addressing limitations (limit some were poorly crafted from an ISA device). It
    is necessary to check what addresses are available.


    Because the device is connected to a peripheral bus which uses DMA buses (while
    both kernel and user code virtual) connecting functions are needed. These are
    used when communicating with the Memory Management Unit (MMU) or other hardware
    connecting to the CPU''s address lines:


    Transfers can be triggered synchronously, or directly, such as an application
    requests or pulls data through a read() call:


    +   * The hardware is told to begin sending

    * The calling process puts to sleep.

    * The hardware puts data in the DMA buffer.

    * The hardware issues an interrupt when it is finished.

    * The interrupt handler deals with the interrupt, acquires data, and awakens the
    process, which can now read the data.


    ```

    #include <virtio.h>


    unsigned long virt_to_bus (volatile void address);

    void *bus_to_virt (unsigned long address);

    unsigned long virt_to_phys (volatile void address);

    void *phys_to_virt (unsigned long address);

    ```


    You can look at the header file where these macros are defined.


    On the x86 platform bus and physical addresses are the same so functions do the
    same thing.'
