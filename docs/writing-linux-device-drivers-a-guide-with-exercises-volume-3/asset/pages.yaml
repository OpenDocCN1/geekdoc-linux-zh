  md: '# CHAPTER I. PRELIMINARIES


    # 1.5 HARDWARE


    Beginning with the 2.6.11 kernel, a new scheme was adopted which a fourth digit
    is used for small patches that concern security and stability matters. Non-controversial
    patches are accepted, and are numbered in 2.6.11.1, 2.6.11.2, 2.6.11.3 etc.


    Some when teach device drivers use simple devices hanging off an external port.
    Rather than do we will use the hardware on the machine as network cards and input
    devices, and piggyback our devices on top of the already installed ones using
    the kernel''s alpha


    The idea has a good measure of stability to support the development process and
    keep complaints about not having a stable kernel for production. Running whatever
    sort of patches are accepted for this stable kernel can be found at /usr/src/linux/Documentation/stable_rules.txt.


    Questions come up one of the following:


    +   - How many I/O ports does my device use, and what addresses do they use?

    - What IRQ?

    - Do I read bytes or words, how many per interrupt, etc?

    - What standards does the device conform to?


    # 1.4 Platforms


    We will try to be platform-independent as possible. However, we will consider
    the x86 architecture explicitly from time and we want not to constrain Linux on
    IA64, Alpha, SPARC, PPC, ARM, etc we.


    These questions can be answered only from the hardware''s specifications, and
    by examining the hardware. When you are writing a driver you must have enough
    knowledge and you to write it out by probing a device which keeps its specifications
    secret, and a lot of drivers have been emerging since Linux has become much mature
    and are better enough encouraging us to configure them if you want your devices
    supported, and then just doing this kind of work properly.


    There are at least three reasons to consider the x86 architecture explicitly:


    +   - There are parts of the Linux kernel which must be platform-dependent, and
    to understand what is going on some specificity will be needed.

    - You are probably working on an x86 right now.

    - Most people develop for Linux are concentrating on this platform.


    Get as much information as you can from the hardware, but be prepared for some
    of it to be wrong or out of date, especially when it is new. It is not for the
    hardware and the driver to be in sync or for a device to fully follow all specifications.
    Sometimes this is because device manufacturers are making sure the device works
    adequately under the market-dominant operating system and then asking questions
    at point later.


    We''ll try to make any platform-dependence explicit. All solutions have been tested
    on 32-bit and 64-bit architectures.


    # 1.6 Linux Driver Project


    ![](img/5f0cab84232061dba742ffc69894b1f1_14_0.png)


    +   - The 2.6.24 kernel is a merge of the 32-bit i386 and 64-bit x86 architectures.
    The new name is simply x86.

    - This involved a major reorganization and rewrite of code and completion took
    a while.

    - Many files were reorganized; for instance instead of /arch/i386/init.c we have
    arch/x86/mm/init_32.c and arch/x86/mm/init_64.c.


    The Linux Driver Project is a group of kernel developers and some project managers
    who provide open source device drivers for free. The project work will require
    manufacturers and when will sign NDA (Non-Disclosure Agreement) as long as the
    project lasts


    The project is led by Greg Ross-Hartman whose website of code is at http://www.kernel.org/linux/wiki/bin/.
    New newcomers are always welcome. Our web page is at http://linuxdriverproject.org/


    A goal of the project is to bring many external drivers into the main kernel tree.
    A list of potential candidates is kept at http://linuxdriverproject.org/wiki/bin/view/Main/OutOfDrivers.
    Also maintained is a list of devices for which no Linux drivers exist, which can
    be found at http://linuxdriverproject.org/wiki/bin/view/Main/DriversNeeded.'
