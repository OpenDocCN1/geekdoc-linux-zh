  md: '# CHAPTER 6. KERNEL FEATURES


    # 6.5. LABS


    +   * The kernel is executing a task which has been scheduled to run at either
    a specific time or when convenient. Such a function may be queued through a kernel
    timer, a tasklet or another softirq.

    * The kernel is initializing, shutting down, or running the scheduler.


    At such times the process context is not defined; although references to the current
    task_struct may yield errors. This situation is called interrupt context, as we
    can see it arises when no processes are involved.


    The kernel context has a lighter weight than that of a process; swapping in and
    out between kernel threads is much simpler and faster than it is for full processes.


    Recent kernels use more of so-called kernel processes, which are much like user
    processes but run directly by the kernel.


    Such pseudo-processes are used to execute management threads, such as over maintaining
    the buffer and page caches, which have to synchronize files on disk with memory
    areas. Other examples are kthrepd and kjournald; do ps aux and look at processes
    whose names are surrounded by square brackets.


    These processes behave like normal processes and are allowed to sleep. However,
    they do not have a true process context and thus cannot transfer data back and
    forth with user-space. In fact they all share the same memory space and switching
    between each other.


    You can use them anywhere with the macros:


    ```

    in_atomic()          /* in hardware interrupt context */

    in_softirq();      /* in software interrupt context (bh) */

    in_in_interrupt();    /* in either hard/soft irq context */

    in_atomic();          /* in preemption-disabled context */

    ```


    Sleeping is disallowed if any of these macros evaluate as true.


    # 6.5 Labs


    You need the complicated redirection because brace puts its output on stderr unless
    you -o -option to redirect it to all.


    While this is running (under less), you can examine more details about the process,
    by examining the /proc filesystem directory.


    ```

    ps aux | grep lr

    ```


    to find the process ID associated with the process. Then you can look at the pseudo-files


    ```

    /proc/[pid]/fd/*

    ```


    to see how the file descriptors are mapped to the underlying files (or pipes),
    etc.


    # Lab 1: Using trace.


    trace is used to trace system calls and signals. In the simplest case you would
    do


    ```

    trace (options) [arguments]

    ```


    Each system call, its arguments and return value are printed. According to the
    man page:


    > "Arguments are printed in symbolic form with passion."


    and indeed they are. There are a lot of options; read the man page:


    As an example, try


    ```

    trace ls -LRF 2>&1 | len

    ```'
