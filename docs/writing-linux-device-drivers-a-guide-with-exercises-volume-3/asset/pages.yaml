    Same as _get_user() but doesn''t call access_ok(). When safety is already assured.


    Both methods avoid buffering or caching for the data being transferred. They require
    more to set up and shut down than copying methods previously discussed. What is
    the best method depends on a number of factors, such as the size of transfers,
    the likelihood the data will be reused, etc.


    # _put_user(), _put_user()


