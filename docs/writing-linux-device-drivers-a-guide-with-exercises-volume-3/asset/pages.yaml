  md: '# CHAPTER 23. DIRECT MEMORY ACCESS (DMA)


    # 23.6 DMA POOLS


    # 23.6 DMA Pools


    DMA mappings might be used for network packets, or filesystem buffers. They have
    the following properties:


    +   * The direction of a transfer must match the value given during mapping.


    +   * After a mapping, it belongs to the device, not the CPU; the driver should
    not return the buffer until it has unmapped.


    +   * Thus for a write the data should be placed in the buffer before the mapping;
    for a read it should not be noticed until unmapped (which can be done after the
    device signals, through an interrupt, or through the transfer).


    A third kind of mapping is a so-called Scatter-gather DMA Mapping. This permits
    buffers, which may be non-contiguous, to be transferred to or from the device
    at one time.


    It is possible to set up a DMA pool, which works much like a memory cache. We''ll
    consider that next:


    Suppose you need small DMA transfers. For coherent transfers, dma_alloc_coherent
    has a minimum size of one page. Thus, a good choice would be to set up a DMA Pool,
    which is essentially a slab cache used for DMA transfers.


    The basic functions are:


    ```

    #include <linux/dmapool.h>

    void *dma_pool_create(const char name, struct device *dev, size_t size, size_t
    alignment, size_t allocation);

    void dma_pool_destroy(struct dma_pool *pool);

    void *dma_pool_alloc(struct dma_pool *pool, size_t size, int flags, d __t *handle);

    void dma_pool_free(struct dma_pool *pool, void *ptr, size_t size);

    ```


    No actual mapping is done by dma_pool_create(); it just sets up a pool with a
    name to, to be associated with the device structure; allocation, if requested,
    happens by sizes.


    The alignment argument (if zero) is the hardware alignment for pool allocations.
    The final allocation, if not-PAGE_SIZE, in the pool will not cross page boundaries.


    The actual mapping is done by dma_pool_alloc(). The flags argument determines
    whether the mapping is coherent (GFP_SYNC, etc.). The return value is the virtual
    address of the DMA buffer, which is accessible by the CPU.


    To avoid memory leaks, buffers should be returned to the pool with dma_pool_free(),
    and when finished the pool can be wiped out with dma_pool_destroy().


    Note that the allocation of the pool will use coherent DMA mappings, which means
    both the device and the driver can use without cache flushing.


    # 23.7 Scatter/Gather Mappings


    ![](img/5f0cab84232061dba742ffc69894b1f1_145_0.png)


    It is easy to create a DMA if you have only one (large or small) contiguous buffer
    to work with. Then you can just give a starting address and a length and let the
    driver handle the transfer.


    However, one might need several buffers working at the same time, and they might
    not be contiguous. This might occur due to:


    Rather using a generic interface, the 2.4 kernel used a PCI-specific interface.
    The functions in one-to-one correspondence with the generic ones and:


    ```

    #include <linux/pci.h>

    int dma_lease(struct pci_dev *dev, size64 size)

    int dma_alloc_consistent(struct pci_dev *dev, size_t size, void **addr, int __handle)

    void dma_free_coherent(struct pci_dev *dev, void *ptr, size_t size)

    size_t dma_map(struct pci_dev *dev, void *addr, size_t size, size_t direction,
    int __handle)

    void dma_unmap(struct pci_dev *dev, void *ptr, size_t size, size_t direction);

    ```


    +   * A Read() or write() system call.


    +   * A Disk 1/O request.


    +   * Transfer of a set of pages in a mapped kernel I/O buffer (such as one might
    have when using contiguous region. Many devices are capable of this)


    While this older API has been removed, it is now a wrapper around the general
    interface, which should be used in any new code.


    Of one course can chain a series of individual requests, each of which represents
    a contiguous region. Many devices are capable of assembling this at a hardware
    level; so'
