    # 8.5 Enabling/Disabling Interrupts


    It is sometimes desirable to set IRQ-affinity to process on some of the CPUs,
    rather than being distributed across all.


    It is useful for a driver to enable and disable interrupt reporting for an IRQ
    line. For doing this are:


    ```

    #include <irq.h>

    #include <linux/interrupt.h>

    ```


    This is done by calling irq_set_affinity(), which takes a bitmask for this hardware.
    The mask can represent a wide set of CPUs. One cannot turn off all the CPUs in
    the mask, and won''t work if the IRQ handler does not have the capacity to handle
    an affinity setting.


    ```

    void disable_irq(int irq)

    void disable_irqq(int irq);

    void enable_irq(int irq);

    ```


    The irbalance daemon dynamically adjusts the IRQ affinity to system conditions.
    It takes into account performance (latency and cache) and power consumption (keeping
    CPUs no more necessary than when load is high).


    These actions are effective only on the CPU they are called; other processors
    continue to process the interrupt.


    There was also an irq-balancing option, which was deprecated and finally removed
    in kernel 2.6.29 for the user-space edition. Following the daemon method can be
    found at http://www.irqbalance.org.


    Because the kernel daemon disables an interrupt before it completes, it might
    make no sense to use these functions from within the handler a particular IRQ.


    # 8.4 MSI


    Calling disable_irq() will prevent any executing interrupt handler before completing
    the disable; while, disable_irqq() will return. If this happens, race conditions
    may occur the result. The first form is from within IRQ context; the second is
    dangerous. The first form can lead to disabled if it is a result while still being
    the handler that may need to be re-enabled later.


    In-PCI (PCIe) express lines are line-based and nowhere as legacy technology. The
    main signal interrupts are widely separated from the main lines, by means of binding.


    It is important to note that the disable/enable functions have a depth; if disabled,
    disable_irq() will be called twice before the interrupts are handled.


    PCIe maintains compatibility with older software by emulating this behavior with
    in-band methods, but still are limited to four lines and require frequent sharing
    of interrupts among devices.


    It is possible to disable/enable all interrupts, in order to protect critical
    sections of code. This is the best approach with appropriate spinlocks.


    The PCI 2.2 standard introduced new mechanism as MSI (Message-Signaled Interrupts),
    which was further enhanced in the PCI 3.0 to become MSI-X, which is backward compatible
    with.


    ```

    unsigned long flags;

    spin_lock_irqsave(my_lock,flags);

