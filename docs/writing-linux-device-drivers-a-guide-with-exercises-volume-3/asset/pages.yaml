    # 24.1 Network Layers and Data Encapsulation


    Networking applications communicate with servers and clients who are also networking
    applications.

    These applications (or daemons) may either be on remote hosts or on the local
    machine.


    For the most parts drivers are constructed to be independent of the actual hardware,

    of network involved, routing, and protocol involved. This is not a general rule,
    however, as

    sometimes the application may work at a lower level or require certain features.'
