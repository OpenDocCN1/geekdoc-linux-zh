  md: "# CHAPTER 23. DIRECT MEMORY ACCESS (DMA)\n\n# 23.8. DMA UNDER ISA\n\nscatterlist\
    \ of pointers and lengths can be given to the device and it will take care of\
    \ doing it all as one operation.\n\nOnce it is time to transfer each buffer. Because\
    \ of architectural differences, one should not directly refer to the scatterlist\
    \ data structure, but instead use the macros:\n\nIn order to comply you first\
    \ have to set up an array of structures describing the required transfer. For\
    \ x86 this structure is defined in /usr/src/linux/arch/x86/include/asm and it\
    \ looks like:\n\n```\ndma_set_dma_address(struct scatterlist *sg)\nunsigned int\
    \ dma_map_len(struct scatterlist *sg);\n```\n\n```\nstruct scatterlist {\n   \
    \ unsigned long page_link;\n    unsigned int offset;\n    unsigned int dma_addr;\n\
    \    unsigned int length;\n    unsigned int unused;\n};\n```\n\nreturn the bus\
    \ (DMA) address and length of the buffer (which may be different than what was\
    \ passed to dma_map_sg() because of buffer coherence).\n\nAfter the full transfer\
    \ has been made, one calls\n\nThe driver maps the page, offset, and length fields\
    \ for each buffer in the array; Note length is specified in bytes.\nThe device\
    \ will fill the field in the following function:\n\n```\ndma_map_sg(struct device\
    \ *dev, struct scatterlist *sg, int nents, enum dma_data_direction);\n```\n\n\
    ```\ndma_unmap_sg(struct device *dev, struct scatterlist *sg, int nents,\n   \
    \ enum dma_data_direction);\n```\n\nwhere is the result value mapped to the mapping\
    \ function, not the coalesced value.\n\n# 23.8 DMA UNDER ISA\n\nwhere ments is\
    \ the number of buffers in the array. This function returns the number of buffers\
    \ to transfer. This can be less than ments because any adjacent buffers will be\
    \ merged:\n\nThere are two kinds of ISA transfers using DMA: native motherboard\
    \ controller, and ISA-master, where the peripheral device controls everything.\
    \ This type is rare and we don't see it, but it is similar to PCI transfers.\n\
    \n![](img/5f0cab84232061dba742ffc69894b1f1_146_0.png)\n\nThe DMA (8227 DMA Controller)\
    \ manages information about the direction and status of transfers. When a DMA\
    \ request is received the DMA controller signals the CPU. The device can then\
    \ read and write data. These circuits are now part of the motherboard controller,\
    \ rather than separate 8237.\n\nThe peripheral device must signal a DMA request\
    \ when it needs to read or write. For transfers it is easier to get ready, answer\
    \ the interrupt when the transfer is complete.\n\nIn kernel version 2.6.24, the\
    \ scatterlist structure changed to:\n\nThe device driver tells the DMA, address\
    \ and size of the transfer, tells the peripheral to start and receives an interrupt\
    \ when the transfer is complete.\n\n```\nstruct scatterlist {\n    unsigned long\
    \ page_link;\n    unsigned int offset;\n    unsigned int length;\n    unsigned\
