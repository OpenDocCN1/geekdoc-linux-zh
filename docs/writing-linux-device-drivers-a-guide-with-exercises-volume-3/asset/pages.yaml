    \ However, on modern CPUs the clock frequency can vary continuously during operation.\n\
    \nThe machine obtains the value of the time stamp counter is:\n\n```\n#include\
    \ <asm/msr.h>\rdtsc(low,high)\rdtsc(low)\rdtsc(high)\n```\n\nThe rdtsc() returns\
    \ the 64-bit value of the TSC and splits it into two 32-bit arguments. rdtsc(low)\
    \ gets only the lower 32 bits. This is insufficient because a 2 GHz system would\
