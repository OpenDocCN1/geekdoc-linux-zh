  md: '# 28.1 What is USB?


    USB stands for Universal Serial Bus. It permits easy connection of multiple peripherals
    to one port, and automatic hotplugging of devices attached (and detached) while
    the computer is running. Virtually any type of peripheral (with USB capability)
    can be connected to a USB port; it includes scanners, mice, network cams, keyboards,
    binders, printers, storage devices, etc.


    Version 1.0 of the USB specification was released in January 1996 by an alliance
    of Compaq, Intel, Microsoft and NEC. Version 1.1 was released in September 1998,
    and version 2.0 was released in 1999.


    One thing to be careful about when using the USB 2.0 standard, is that the phase
    full speed is not as fast. The newer standard is described as high speed.


    Up to 12 devices can be connected simultaneously. The USB cable carries four wires;
    power and two signals. In the original, the total bandwidth was limited to 12
    Mbit/s, but overhead limited this to something like 8 Mbit/s and realistic performance
    as low as 2 Mbit/s. USB 2.0 brought a theoretical speed of 480 Mbit/s.


    Devices may be either low or high speed, or operate in other mode according to
    function. A high speed device on a controller or hub will be limited to lesser
    capabilities.


    Power can be delivered either through the USB bus or from a peripheral''s own
    power supply. A total of 500 mA can be provided by each controller. When a device
    is plugged in it may greedily grab up to 100 mA and then request more if limits
    are not exceeded.


    The kernel contains all of USB-related documentation in the /usr/src/linux/Documentation
    directory.


    ![](img/5f0cab84232061dba742ffc69894b1f1_166_0.png)


    +   * Support for the new USB 3.0 standard (also known as XHCI) has been included
    in kernel version 2.6.31, making the Linux operating system to incorporate it.


    # 28.2 USB Topology


    USB ports are incorporated in all recent motherboards. In most cases there are
    at least 2 ports. The ports can be connected either directly or to hubs, which
    can be connected to more hubs. There is a virtual root hub by the host controller.
    The total number of devices per hub is 127.


    Technically, the structure of USB is not that a bus; it is a tree with upstream
    and downstream nodes. Each device can have only one upstream connection (with
    a type A connector),


    # 28.3 Descriptors


    For USB 1.X, there are two types of controllers:


    +   * OHCI (Host Controller Interface) from Compaq.

    * UHCI (Universal Host Controller Interface) from Intel.


    UHCI is simple and thus requires a somewhat more complex device driver. Peripherals
    should work equally well with either controller.


    For USB 2.0, the standard is EHCI (Enhanced Host Controller Interface).


    Upon being hooked to the bus, a peripheral identifies as belonging to one of several
    classes. When a particular device is loaded it will claim the device and handle
    all communication with it.


    | USB Controller | Device | Hub |


    Figure 28.1: USB topology


    ![](img/5f0cab84232061dba742ffc69894b1f1_166_1.png)


    Each USB device has a unique device descriptor, assigned to it when the peripheral
    is connected to the bus. In addition it gets a device address (an integer ranging
    from 1 to 127). The descriptor has all pertinent information applying to the device
    and all of its possible configurations.


    A device has one or more configuration descriptors. This has specific information
    about how the device may be used.


    Figure 28.2: USB descriptors'
