    \ = skb->len;\ndata = skb->data;\ndev->trans_start = jiffies;\n\n/* so we can\
    \ free it in interrupt routine */\npriv = skb;\n\nsynet_b_tx(dev, len, dev);\n\
    \nreturn 0;\n```\n\nThe first driver has to put the data into one or more buffers,\
    \ which are passed off to a hardware-specific function, synet_b_tx(which you have\
    \ to write) which is responsible for actually sending the data over the device.\
    \ When finished transmitting an interrupt and the buffers can be freed in the\
    \ interrupt handler\n\nA timestamp (in jiffies) is placed in the dev->trans_start\
    \ value, and the value of the data structure (the dev->priv), which has previously\
    \ been linked to this kind of data, is stored in the skb.\n\nWhen we initialized\
    \ the dev_structure, we filled a field for dev->timeout. If a time value greater\
    \ than this field has passed since dev->trans_start, and the skb is still in use,\
    \ then the kernel networking stack will cause the dev->timeout function associated\
    \ with the device to be called. This function has to do whatever is necessary\
    \ to ensure proper cleanup of any in-progress transmission, and wherever necessary\n\
    \nOne can can determine if the output device is busy, having enough memory to\
    \ store packets; when the driver is full, it will have to call netdev_stop_queue()\
    \ to stop any outgoing data, and call netdev_wakeup() when it is ready to accept.\
    \ Whether the number of outgoing packets is as few as one, or many, drivers have\
    \ to deal with this difficulty.\n\nOne occasionally might need to delay transmission\
    \ from more else than in the hard_start_xmit() callback function. An example would\
    \ be in a re-configuration request, by calling netdev_stop_queue(), one should\
    \ employ the function:\n\n```\nvoid netdev_disable(struct netdev_device *dev);\n\
    ```\n\nThe handler will be invoked upon receipt of an interrupt from the network\
    \ device, which will determine if it is being called data has arrived, or because\
    \ data has been sent. (Normally it will do this by checking some timer).\n\nEither\
    \ the handler or the transmission route must call allocate (or reuse) any necessary\
    \ socket buffers. Using dev_alloc_skb() for this can be done at interrupt time\
    \ since it uses GFP_ATOMIC.\n\nWhen the packet has been successfully received,\
    \ the function net_rx(dev) gets to pass the packet up to the higher layers in\
    \ the kernel.\n\nHere's very simple example (without checking) of a routine which\
    \ would get called out of the interrupt, which arguments as a pointer to a network\
    \ device, and one to a buffer of known length called off the device:\n\n```\n\
    void mydev_rx(struct netdev_device *dev, int len, unsigned char *buf) {\n  struct\
    \ skb *skb;\n skb = dev_alloc_skb(len+2);\n skb_reserve(skb);\n memcpy(skb_put(skb),\
    \ buf, len);\n skb_protocol = eth_type(skb);\n skb_sum = CHECKSUM_UNNECESSARY;\n\
    \ netdev_rx(skb);\n return;\n}\n```\n\nSince the Ethernet header is 14 bytes,\
    \ the skb_reserve() function is called to put out the Internet header so it can\
