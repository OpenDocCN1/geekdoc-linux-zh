    # 4.6. UDEV AND HAL


    ```

    struct cdev_alloc(void);

    int cdev_add(struct cdev *cdev, struct file_operations *fops);

    void cdev_put(struct cdev *cdev);

    struct kobject *cdev_dev(struct cdev);

    int cdev_init(struct cdev *cdev, dev_t dev, unsigned count);

    void cdev_del(struct cdev *cdev);

    ```


    udev handles the generation of device nodes but it does not handle the discovery
    of them. This requires a Hardware Abstraction Layer, which is provided by freedev
    (https://www.freedev.org/).


    HAL uses the D-BUS (device bus) infrastructure, as provided by HAL (hal daemon).
    It maintains a dynamic list of all connected hardware devices and is dearly coupled
    to the hotplug facility. The kernel will dump all the information that HAL currently
    has to /usr/share/hal and /etc/hal.


    These should be allocated dynamically, and then initialized with code like:


    ```

    struct cdev *mydev = cdev_alloc(0);

    cdev_init(mydev, &my_fops);

    ```


    This code allocates memory for the structure, initializes it and sets the owner
    and fields to the proper file_operations.


    The cleanest way to use udev is to have a pure system; the device entry is empty
    until populated with device nodes as they are needed. When used this way, one
    boot with either an initfs image, which may contain a set of preliminary device
    nodes as the udev program initializes.


    The driver will free when one calls:


    ```

    cdev_remove(mydev, first, count);

    ```


    This function should not be called until the driver is ready to handle incoming
    things that comes from.


    The inverse function is


    and after this called the device is removed from the system and the cdev structure
    should not be accessed after this point.


    ```

    cdev_del(struct cdev);

    ```


    Devices are added and removed from the system by the hotplug subsystem, udev handles
    the necessary to create and remove device nodes. Information about major and minor
    numbers, permissions, are gathered by information from kernel events (monitored
    at /sys) and set as configuration files.


    # 4.6 udev and HAL


    The main configuration file is /etc/udev.conf. It contains information about where
    to place device nodes and ownership. By default rules in /etc/udev.rules/ for
    device naming are created. By reading the main page for udev one can get a lot
    of information about how to set rules.


    Creation and removal of a device node dynamically, from using the device driver,
    is done by the following functions defined in /usr/src/linux/include/device.h:


    ```

    #include <class.h>

    ```


    ```

    struct class {struct module owner, const char *name};

    struct device {struct class *cls, struct cdev *parent, dev_t dev, int count};

    void device_create(struct class *cls, dev_t dev);

    void device_destroy(struct class *cls, dev_t dev);

    ```


    ```

    static struct class *foo_class;


    / create node in the init function /

    foo_class = class_create(THIS_MODULE, "class");

    device_create(foo_class, NULL, "X0", "mydev");


    / remove node in the exit function /

    device_destroy(foo_class, dev);

    class_destroy(foo_class);

    ```


    The methods of managing device nodes become clumsy and difficult as Linux evolved.
    The method of device nodes in /dev and its subdirectories reached in the 15,000
    - 20,000 range in most installations during the 2.4 kernel. For all kinds of devices
    which would be newly automatically created by scripts, but could not be sure exactly
    which hardware would be needed


    Of course developers and system administrators were limited to what was actually
    expected, especially when needed, but this was a manually and prone to error-prone
    case.


    Note that while device nodes are not normal files and do not take up space on
    the filesystem, having directories point down to device nodes, especially when
    first use. Furthermore, exhaustion of available major and minor numbers required
    a more modern and dynamic approach to the creation and management of device nodes


    Ideally, one would like to register devices by name. However, major and minor
    numbers cannot be got rid of allgether, as userspace requires them.


    The udev method creates nodes that will never be needed. This is in user space
    a task of device nodes for users, and indicates that most of the work of creating,
    removing, and modifying nodes is done in user-space.


    One has to be careful what is necessary to make the device usable before the device
    node is created, to avoid race conditions.'
