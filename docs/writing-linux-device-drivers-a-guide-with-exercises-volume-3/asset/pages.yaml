  md: '# CHAPTER 19. SLEEPING AND WAKE QUEUES


    # 19. GOING TO SLEEP AND WAKE UP


    At times it is necessary for the task to go sleep until whatever condition or
    resource it is waiting for. When the resources become available, or the condition
    becomes (perhaps signaled by the arrival of an interrupt) it becomes necessary
    to wake up the sleeping task.


    There can be wait queues in the systems and they are connected in a list. In some
    cases they may be shared among several tasks.


    Another way to wait is to think of task organization and queues. There is a list
    of all tasks that have WAITING in the state of their task_struct, called the runqueue.
    A task which is scheduled out would turn back into the field as soon as a timescale
    is available or it is woken up.


    Sleeping (with a state of TASK_INTERRUPTIBLE, UNINTERRUPTIBLE, or TASKKILLABLE)
    instead of one possible wait queues, of which corresponds to getting woken up
    by a particular event or series of events, at which point the sleeping task can
    go back to running.


    Sleeping and waking up comes into two forms: interruptible and uninterruptible.
    An uninterruptible task is not woken up by a signal and should be readily woken
    up, especially in device drivers. It is difficult to get out of such a task in
    this situation unless a reboot is made or by terminating an ancestor process.


    The TASK_KILLABLE state is woken up by any signal (while TASK_INTERRUPTIBLE with
    any signal).


    When a wait queue is woken, all tasks on the wait queue are roused (unless an
    exclusive sleep is used, as we shall call).


    It is very easy to crash with improper use of wait queues. In particular, kernel
    threads of interrupt service should never go to sleep.


    The data structure used for wait queues is of type wait_queue_head_, just called
    a wait queue. It is explicitly and initialized with the statements


    ```

    #include <linux/sched.h>

    ```


    ```

    wait_queue_head_t wq;

    init_wait_queue(&wq);

    ```


    If the wait queue is not active it can be run and initialized with the


    ```

    DECLARE_WAIT_QUEUE_HEAD(wq);

    ```


    Don''t forget to initialize a wait queue.


    # 19. Going to Sleep and Wake Up


    Now that we have set up a wait queue, we need to use functions for putting a task
    to sleep and waking it up.


    ```

    #include <linux/wait.h>

    ```


    ```

    wait_event(wait_queue_head_t wq, int condition);

    wait_event_interruptible(wait_queue_head_t wq, int condition);

    wait_event_killible

    ```


    ```

    void wake_up(wait_queue_head_t wq);

    wake_up(wait_queue_head_t wq);

    ```


    The wait_event() calls are macros. They do not take wq, as an argument.


    The proper wake should be paired with the originating sleep call. (However,

    wait_event_killible should be paired with wq, which isn''t optimal).


    In general you will use the interruptible wait which returns 0 if the task was
    woken up by a wake up and -1 if it returns a signal. The other forms are rarely
    and only used by critical sections of the kernel, as while waiting for a page
    to be read from disk.


    When you use the interruptible wait you will always have to check whether your
    task was woken up by a signal, or if there was an explicit wake up. The signal_pending(current)
    macro can be used for this purpose.


    The condition has two important purposes:


    +   - Help avoid the race condition in which a task is destined to sleep but the
    wake up arrives before the condition changes; the condition is checked before
    actually putting the task to sleep.


    +   - It checks the condition upon waking and if it is not true the task remains
    asleep. This avoids another class of race conditions where a task is set to sleep
    before it has a chance to really wake up.


    You will have to call the wake_up_functions when you wake their tasks; they do
    not set up a spinning loop until the condition evaluates to true (non-zero).


    Sometimes you might want your task to sleep long. For this purpose one can use:


    ```

    wait_event_timeout(wait_queue_head_t wq, int condition, long timeout);

    wait_event_interruptible_timeout(wait_queue_head_t wq, int condition, long timeout);

    ```


    If they return out, the remaining timeout functions 0. If the interruptible timeout
    returns a signal the task was woken up.


    The waking functions wake all sleepers on the specified wait queue. There is no
    order in the order they will be woken up; they will be scheduled by priority algorithms
    rather than FIFO or FIFO. The tasks can be woken up by any CPU. A little more
    can be achieved with:


    ```

    wake_up_interruptible_sync(wait_queue_head_t wq);

    ```


    which checks whether the task woken up has a higher priority than the currently
    running one, and if so, invokes the scheduler if possible. However this is rarely
    used.


