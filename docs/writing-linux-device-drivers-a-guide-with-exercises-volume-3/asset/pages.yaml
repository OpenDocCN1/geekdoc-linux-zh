    The_user() function clears the contents of the memory location pointed to.


    # 18.3 Direct transfer - Kernel I/O and Memory Mapping


    There are two complementary methods Linux uses over the here heretofore described
    functions.

    In the kernel, the direct access is given access to user-space memory pointers.
    The memory is locked down when the transfer goes on, making sure no swaps occur
    and the pointers remain valid. When the transfer is over it is released. This
    is the basis of the raw I/O implementation.

    Note if a file is opened with the non-standard O_DIRECT flag, lock will be used
    on that file.'
