    Under ACPI there are also a bunch of Device State Definitions. They range from
    D0 to D3. All devices must have D0 modes defined, but D1 and D2 are optional.


    | Value | Meaning |

    |---|---|

    | D3 | Off, to the device. Context is lost; operating system may reinitialize
    upon resume. |

    | D2 | Meaning depends on the class of device. Save more than D1. Device may lose
    some of its context. |

    | D1 | Meaning depends on the class of the device. Saves more context than D2.
    |

    | D0 | Full power to the device, which is completely active, retaining all context.
