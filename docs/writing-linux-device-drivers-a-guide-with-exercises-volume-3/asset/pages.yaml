    AS, but it is now CFQ but distributions many I/O schedulers for different devices.
    The choice can be easily made through the command line, or from kernel code calling
    the following


    +   ** noop (A simple scheduler)


    In order to prevent request starvation, an algorithm deadline determines how many
    times an I/O request has been bypassed by newer requests, and a threshold prompts
    the request to be satisfied.


