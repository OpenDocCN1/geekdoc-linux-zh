    # 34.1 I/O Scheduling


    The I/O scheduler provides the interface between the generic block layer and low-level
    physical device drivers. Both the VM and VFS layers submit I/O requests to block
    devices; it is the job of the I/O scheduling layer to prioritize and order these
    requests before they are given to the block devices.


    Any I/O scheduling algorithm has to satisfy certain (sometimes conflicting) requirements:


    > * Hardware access times should be minimized; i.e., requests should be ordered
    according to policy'
