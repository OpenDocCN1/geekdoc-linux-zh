    struct *generic;\n#endif\nstruct disk_disk *dkextants;\n```\n\nmajor is the major\
    \ number associated with the device, first_major is the first minor number for\
    \ the disk.\n\ndisk_name is the disk name without partition, e.g., hd0.\n\nrequest_queue\
    \ points to the queue of pending operations for the disk. Note that if there is\
    \ only one request queue for the disk, then it is associated with\n\nprivate_data\
    \ points to an object not used by the kernel and can be used to hold a data structure\
    \ for the driver that can use for any purpose.\n\ncapacity is the size of the\
    \ disk in 512-byte sectors; if you have a larger sector size, the capacity has\
    \ to be unified in this way.\n\nflags control the device-operations. Possible\
    \ values include GENHD_FL_REMOVABLE, GENHD_FL_CD etc.\n\nThe following functions\
    \ are used to allocate, configure, and free gendisk structures:\n\n# 35.4 gendisk\
    \ structure\n\nThe gendisk structure is defined in /usr/src/linux/include/gendisk.h\
    \ and describes a particular device. You have to set it up, manipulate it, and\
    \ free it when needed.\n\nThe gendisk structure is:\n\n```\nstruct gendisk {\n\
    \    /* major number of driver */\n    int major, first_major;\n};\n```\n\n```\n\
    #include <gendisk.h>\n\nstruct gendisk *alloc_disk(int minors);\nvoid add_disk(struct\
    \ gendisk *gd);\nvoid put_disk(struct gendisk *gd);\n```"
