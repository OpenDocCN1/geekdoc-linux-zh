    \ is being loaded. Usually set to the THIS_MODULE.\n\n```\nloff_t (*read)(struct\
    \ file *file, loff_t offset, int *ppos)\n```\n\nthe character read/write position\
    \ in file, returning the new position. Note that loff_t is 64-bit on 32-bit architectures.\n\
    \nIf one wants to inhibit seeking on the device (as one), one can use the FMODE_SEEK\
    \ bit in file structure (by providing the open method);\n\n```\nfile_operations\
    \ (*f_mode = file->f_op &FMODE_SEEK);\n```\n\n```\nsize_t (*write)(struct file\
    \ *file, loff_t offset, char __user *buffer, size_t count, int *ppos)\n```\n\n\
    reads from device, returning the number of bytes read. An error code: negative\
    \ value may mean end of device and is not an error. You may also choose to block\
    \ if the device is not ready and the process has set the non-blocking flag.\n\n\
    A simple read() point might look like:\n\n```\nsize_t my_read(struct file *file,\
    \ loff_t offset, char __user *buffer, size_t size, int *ppos)\n{\n\tsize_t ret;\n\
    \tret = copy_from_user(buffer, kbuf, size);\n\tif (ret) {\n\t\treturn -EFAULT;\n\
    \t}\n\tprintk(KERN_INFO \"READ buffer %zu bytes\\n\", size);\n\t*ppos += size;\n\
    \treturn size;\n}\n```\n\nIn this case a read method copies from a buffer in kernel-space\
    \ (kbuf) to a user-space (buffer). But one can also use mmap because it is improper\
    \ to de-reference user-space pointers in kernel-space; the reader may not need\
    \ to visit a page of memory at the current time, either it has not been allocated\
    \ or it has been swapped out.\n\nOne must use the copy_to_user() and copy_from_user()\
    \ functions (depending on direction) which take care of these problems. (We will\
    \ later show more advanced techniques for avoiding the extra copies, including\
    \ memory mapping, raw/O etc.).\n\nThe kernel will be dynamically allocated, so\
    \ the kernel-per task stack is limited. This must be done with:\n\n```\nstruct\
    \ kmalloc_slab *slab;\nchar *kbuf = kmalloc(size, GFP_KERNEL);\n```\n\nwhere the\
    \ limit is 1024 pages (4 MB on x86).\n\nIf using the GFP_KERNEL flag, memory allocation\
    \ block may become available; if GFP_ATOMIC is used the request is not blocking.\
    \ We will discuss memory allocation in detail.\n\nThe position in the device is\
    \ updated by modifying the value of *ppos which points to the current value. The\
