  md: "# CHAPTER 27. NETWORK DRIVERS IV: SELECTED TOPICS\n\n27.2. CHANGES IN LINK\
    \ STATE\n\n303\n\n# 27.1 Multicasting\n\nA multicast packet is sent to more than\
    \ one (but not all) network destinations. For purpose a unique multicast address\
    \ is assigned to a group of hosts; any packet sent to that address will be received\
    \ by all members of the group.\n\nFor either the least significant bit in the\
    \ first byte of the destination address is set, at the same time as the first\
    \ bit of the device address is cleared.\n\nMulticast packets do not need to retrieve\
    \ any other packet, and the device driver may need to transmit them. It is up\
    \ to the kernel to retrieve them to the right hardware address.\n\nHowever, reception\
    \ of multicast packets is more complex and can require more work from the device,\
    \ depending on its implementation.\n\nSome devices have no multicast capability.\
    \ They receive packets either either directed to their hardware interface, or\
    \ broadcast to all. They receive multicast traffic only by receiving all packets,\
    \ which can overwhelm the system. A device will not have the IFF_MULTICAST flag\
    \ in its net_device structure.\n\nTable 2.1: Multicasting flags\n\n| Flag | Meaning\
    \ |\n|---|---|\n| IFF_MULTICAST | If not set, the device won't handle multicast\
    \ packets. However, the set_multicast_list(1) method will still be called whenever\
    \ the flags change. |\n| IFF_ALLMULTI | Tells the driver to retrieve all multicast\
    \ packets. |\n| IFF_PROMISC | Put interface in promiscuous mode. All packets are\
    \ received regardless of whether it is in dev_rx_list. |\n\nCorbet, Rubini and\
    \ Kerr-Hartman give an example of an implementation of the set_multicast_list(1)\
    \ method.\n\n# 27.2 Changes in Link State\n\nA second class of devices detects\
    \ multicast packets from multicast; they receive only one copy which is or is\
    \ not intended for them and should be handled then. This has a lower overhead\
    \ than the first class.\n\nNetwork connections can go up and down due to external\
    \ events, such as plugging a cable in or out. Almost all network devices have\
    \ a capacity of sensing a plug; when it presents the hardware is available.\n\n\
    A third class of devices performs multicast detection in its hardware. This kind\
    \ of device accepts a list of multicast addresses to be interested in or all others.\
    \ This is the most efficient class of devices as it doesn't accept packets and\
    \ then drop them. Whenever the list of valid addresses is updated, the kernel\
    \ updates the list of the device.\n\nLinux provides functions to notify the other\
    \ listeners when the state goes up or down to inform them about.\n\nThe method\
    \ called whenever the list of multicast addresses is associated with it\n\n```\n\
    void (*dev_multicast_list(struct net_device *dev));\n(where dev is the device's\
    \ net_device structure). The function is invoked whenever dev->flags change. If\
    \ the driver cannot it should supply NULL\n```\n\n```\nvoid (*net_carrier(struct\
    \ net_device *dev));\nvoid (*net_carrier_off(struct net_device *dev));\nint net_carrier(struct\
    \ net_device *dev));\n```\n\nThe data structure linking the list of all multicast\
    \ addresses the device deals with:\n\nThe on and off functions should be called\
    \ whenever the driver detects a change of state. They may be called to report\
    \ a major configuration change, or reset.\n\n```\nstruct dev_mc_list {\n\t*next;\
    \                /* at most addresses in list */\n\t*ub;\n\tstruct in_addr *addr_list;\
    \ /* hardware address */\n\tint len;               /* address length /\\n\tstruct\
    \ in_addr *users; /* # of users */\n\tint count;             /* # of groups */\n\
    };\n\nstruct dev_mc_list *dev->dev_mc_list;\n```\n\nThe final function checks\
    \ the net_device structure to sense the state.\n\n# 27.3 ioctls\n\nWhen an ioctl()\
    \ command is sent to a socket descriptor, the command is first compared to defined\
    \ in /usr/src/linux/include/linux/sock.\n\nIf a command is a socket configuration,\
    \ such as STOCSIFFADDR it is directly upon by high levels of the networking code.\n\
