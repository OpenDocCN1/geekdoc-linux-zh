  md: "# CHAPTER 12. RACE CONDITIONS AND SYNCHRONIZATION METHODS\n\n# 12.5. BIG KERNEL\n\
    \n143\n\nunsigned long flags;\nspinlock_t my_lock;\n\nspin_init(&my_lock);\n\n\
    spin_irqsave(&my_lock, flags);\n......\nspin_unlock_irrestore(&my_lock, flags);\n\
    \nspin_unlock() waits until the spinlock is free.\nspin_is_locked() returns 1\
    \ if the spinlock is set.\nspin_trylock() returns 1 if it got the lock; otherwise\
    \ returns with 0; i.e., it is a non-blocking call.\n\nOn processor systems, this\
    \ is not-a, as the interrupt disabling and restoring still goes on, and as mentioned\
    \ these functions should be used when out of process-context. These functions\
    \ take much more time than the \"no-irq\" versions.\n\n# 12.5 Big Kernel Lock\n\
    \nNote that the interrupt disabling occurs only on the current processor; other\
    \ CPUs are free to handle the lock which is held.\n\nOne mechanism used abundantly\
    \ throughout the Linux kernel is the so-called Big Kernel Lock, or BKL. It is\
    \ implemented simply with\n\nThere also exists the lockless functions:\n\n```\n\
    lock_kernel();\ncritical codes\n......\nunlock_kernel();\n```\n\n```\nspinlock_irq(&my_lock);\n\
    spinlock_unlockq(&my_lock);\n```\n\nThe BKL was originally a normal spinlock with\
    \ widespread usage. As such, it is a relic of earlier times when kernel was going\
    \ coarse.\n\nthe difference being that mask of interrupts is not used, and all\
    \ interrupts are restored in the unlocking operation. This is dangerous (an interrupt\
    \ may have been denied) and generally these functions should not be used.\n\n\
    In the 2.6.11 the BKL was converted to a semaphore and really should be called\
    \ the Kernel Semaphore. As a result it follows in two ways from other locking\
    \ mechanisms:\n\nAnd there are also reader and writer locks with these there can\
    \ be more than one reader in a critical region, but in order to make an exclusive\
    \ write lock must be locked. In other cases read lock only reads the lock, while\
    \ a writer locks the lock. Examples would be:\n\n+   - It can be acquired recursively\
    \ within a given day.\n- Sleeping is permitted while holding the BKL: it is released\
    \ when sleep begins and gathered upon awakening.\n\nunsigned long flags;\nlock_t\
    \ my_lock;\nrw_lock(&my_lock);\n\n```\nread_irqsave(&my_lock, flags);\ncritical\
    \ code \nread_unlock_irrestore(&my_lock, flags);\n```\n\nWith kernel preemption\
    \ it is possible to turn on BKL preemption as a kernel configuration option through\
    \ kernel 2.6.24; after that it is automatically done.\n\n```\nwrite_irqsave(&my_lock,\
    \ flags);\nexclusive code read and write access\nwrite_unlock_irrestore(&my_lock,\
    \ flags);\n```\n\nNewcomers are confused by code like:\n\n```\nlock_kernel();\n\
    ......\nspin_lock(&my_lock);\nspin_unlock(&my_lock);\nunlock_kernel();\n```\n\n\
    There are also \"irq-lock\" versions of these for non-interrupt tasks.\n\nThese\
    \ locks favour readers over writers, i.e., if there is a lock and for readers\
    \ waiting they will get access first. This can cause starvation and help motivate\
    \ the development and use of locks.\n\nIn a fixed-grained lock is nested within\
    \ the BKL. The confusion arises because of not understanding that all spinlocks\
    \ are advisory; i.e., they are only effective when code examines a lock status.\
    \ They are not mandatory locks.\n\nThere are few other spinlock functions:\n\n\
    ```\nspin_unlock_wait(spinlock_t *lock);\nint spin_is_locked(spinlock_t *lock);\n\
    int spin_trylock(spinlock_t *lock);\n```\n\nThere is an ongoing effort to eliminate\
    \ almost all instances of the BKL, or its promiscuous use leads to a lot of bottlenecks\
    \ when code that in no way interacts with other code takes the BKL and suspends\
    \ the other."
