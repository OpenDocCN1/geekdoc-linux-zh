    At a lower level, the driver_structure will then contain pointers to these functions:


    # 30.3 System Power States


    ```

    struct device_driver {

    ```


    ```

    int (*probe)      /* struct device *dev */

    int (*remove)     /* struct device *dev */

    void (*wakeup)    /* struct device *dev */

    int (*suspend)    /* struct device *dev, pm_message_t */

    int (*resume)     /* struct device *dev */

    };

    ```


    Many drivers are written with only one or none of these functions supplied. This
    may be because the hardware has no advanced power capabilities.


    Under APM there are five states the system can be:


    Table 30.1: APM power states

    | State | Meaning |

    |---|---|

    | Full On | Default mode. No power management. All devices are on. |

    | APM Enabled | System works; some devices may not be powered. CPU may be slowed
    or stopped. |

    | APM Standby | Enters this state after short period of inactivity; recovery to
    the enabled state should be instantaneous. Devices in a low power state may be
    slowed or stopped. |

    | APM Suspend | Enters this state after long period of inactivity; recovery to
    the enabled state takes a longer period. System is in a low power state with most
    power managed devices off. clock is stopped. System may go into hibernation, a
    sleep implementation which saves parameters. |

    | Off | System all off. Nothing saved. |


    More often than not is in the rush to get a working device driver callback functions
    on the back end and just as an enhancement or optimization to benefit users. Unfortunately
    they are not properly coded or never written.


    There has been considerable frustration expressed about this in the kernel community,
    and many attempts to deify device drivers that fail to satisfy these callbacks.


    # 30.2 APM and ACPI


    Virtually all modern boards will support APM (Advanced Power Management), or the
    next ACPI (Advanced Configuration and Power Interface). Other architectures such
    as x86_64 also have the ACPI.


    The big difference is that APM handles the most power management in the system
    hardware and has no access to it. The ACPI standard puts the power management
    directly in the operating system, which allows for far more flexibility and control.
    It also leads to much direct control of peripherals.


    The legacy project (http://www.kernel.org/doc/legacy/) contains a lot of information
    on tools, documentation, and for getting Linux to take better control of power
    management and reduce overhead consumption.


    If both APM and ACPI are used in the kernel, they will overlap and de-match features
    of both as which might corrupt each other.


    Both APM and ACPI use the use-space daemons (apmd and acpid) which should be started
    by the system startup scripts. If the system doesn''t support the interface, the
    daemons will quit peacefully.


    No matter which power management you use, Linux uses the same functions in the
    device drivers that simplifies things considerably. The actual interface is (fortunately)
    not very complicated-


    Under ACPI there is a clear delineation, with an additional level of detail. The
    correspondences with APM are fairly transparent. With G standing for, and S staying
    for the states are:'
