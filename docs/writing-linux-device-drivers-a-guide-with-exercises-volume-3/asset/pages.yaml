    # 30.4 Callback Functions


    The following functions are part of the ACPI interface. If ACPI is not available,
    APM is used some of these functions no-ops. Drivers do not need to be aware of
    which scheme is being used; they do have to handle suspend and resume requests.


    For PCI device, power management facilities are incorporated through functions
    pointed to by elements of the pci_driver data structure associated with the device:


    ```

    struct pci_driver {

    struct list_head head;

    char *name;

