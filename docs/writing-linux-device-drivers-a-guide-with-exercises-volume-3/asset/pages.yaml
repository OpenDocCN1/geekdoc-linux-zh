  md: '# 5.2 Kernel Browsers


    One has to browse the kernel source to understand the workings of the kernel,
    compare kernel versions. Often the best tools for simple tasks are such as grep
    and find.


    One modern tool is the Linux Source Browser (lx) which can be accessed at http://linux.no/.
    This website contains source code repositories for every linux kernel produced,
    as well as source code and instructions for a local installation of lx.


    The map tree is version 0.9.4 of the kernel, which is very robust but relatively
    slow and more difficult to compile under. A sample implementation of the kernel
    0.3.1 can be found at http://users.kernel.org/qjunjun/linux/source


    Local use of it requires running a web server (typically apache) and several hundred
    MB of disk space per kernel version instance.


    A b-tree index is built by the cquery, which is standard on many Linux systems.
    To use the kernel source, one may run scan the kernel source directory, created
    by the cquery tool, or run scan the main kernel source from then as it is interactive
    and intuitive.


    Another approach is to use GNU Global Index, which can be found at http://www.gnu.org/software/.
    Many distributions also offer a package which is very easy to install and use:
    just make index. The cross-indexing is done and then you navigate the results
    using your favorite browser, simply by pointing to /usr/src/linuxindex. One disadvantage
    of it is its use of over 2 GB of disk space per kernel.


    All these methods work, and there are others such as using make tags and searching
    with grep that can be used by emacs and vi. For what it''s worth, we find the
    preference for lx (or older versions) to be the easiest of comparison of different
    kernel versions.


    # 5.3 Kernel Configuration


    Kernel distributions vary unduly from those whose sources are directly obtained
    from the "official" kernel repository at http://www.kernel.org. Patches have been
    made to the kernel source, including the addition of new features and device drivers
    that have not made it into the "official" kernel, as well as bug fixes enhancements.


    The default configuration for various kernels has only a few kinds of hardware
    turned on (such as one network card) as well as various subsystems turned off,
    the actual defaults probably reflecting the actual hardware Linux towards (which
    has at or one point), such as choice of sound card, video...


    When you configure the kernel you produce a configuration file, config, in the
    main kernel source directory. If the CONFIG_KCONFIG_PROC option is set, information
    about the config file can be read right inside the kernel directory or read-directly
    from /proc/config.


    # 5.4 ROLLING YOUR KERNEL


    Running the scripts/extract-config on a kernel image (compressed or uncompressed)
    built with KCONFIG_y will generate a copy of the configuration file. (Beware,
    this utility needs to be run from the kernel source directory, or requires some
    modifications to).


    If you don''t have the kernel source, you can find extract-config in the /usr/src/$(uname
    -r)/build as an additional optional package.


    In these configurations, drivers for almost all hardware are compiled as kernel
    modules. This is the trick because one cannot know in advance which hardware the
    end user will need, so all possibilities must be prepared.


    On the other hand, if only the hardware present the kernel compilation can be
    sped up significantly. In addition, the configuration process goes as fast as
    you want to turn on what you need.


    # 5.5 Rolling Your Own Kernel


    For experiment you may want to try your own, in particular if you need to compile
    and install a vanilla kernel from http://www.kernel.org. In order to do this you
    need:


    +   * The kernel source (e.g., linux-2.6.31.tar.bz)

    * A configuration file (e.g., config-2.6.31.x86_64)


    The first of these can be obtained from http://www.kernel.com/cdp and the second
    can be obtained from


    The following script (KERNEL.sh), which included in your sources, will take care
    of all the steps of unpacking, compiling, and installing. To do this you


    ```

    $ KERNEL.sh 2.6.31.linux.tar.bz2 config-2.6.31.x86_64

    ```


    if the kernel has already been unpacked and configured, go to the kernel source
    directory and running with no arguments will take care of compilation and installation.


    ```

    #!/bin/bash


    # Script to compile and install the Linux and modules.

    # written by James Coopstein (2002-2009)

    # config opt, make build kernel

    ```


    ```

    function get_config() {

    KERNEL=$1

    TARFILE=$2

    CONFIGFILE=$3

    LKV-VERSION=$KERNEL

    KERNEL-REVS=$KERNEL.config

    if [ -f "$TARFILE" ]; then echo "$TARFILE not found, exiting" && exit 1; fi

    if [ -f "$CONFIGFILE" ]; then echo "$CONFIGFILE not found, exiting" && exit 1;
    fi

    }

    ```'
