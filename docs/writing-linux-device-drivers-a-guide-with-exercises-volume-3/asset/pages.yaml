    While Linux permits up to 64 GB of memory to be used, the limit per process is
    less than 3 GB on 32-bit architectures. This is because there is only 4 GB of
    address space (i.e., is 32-bit) and the top GB is reserved for kernel. The limit
    is somewhat less than 3 GB because some address space is reserved for memory-mapped
    devices.


    Table 17.1: GFP memory allocation flags


    | Value | Meaning |

    | --- | --- |

    | GFP_KERNEL | Block and sleep if the memory is not immediately available, allowing
    promotion to occur. This is the normal way of calling kmalloc().n| GFP_ATOMIC
    | Returns immediately if no pages are available. For instance, this might be done
    when kmalloc() is called from an interrupt, where sleep would prevent reentrant
    of other interrupts.

    | GFP_DMA | For buffers to be used with DMA devices; ORed with GFP_KERNEL or GFP_ATOMIC
    ensures the memory will be contiguous and falls under MAX_DMA_SIZE (which is 16
    MB on x86 for PCI is unspecified). The exact meaning of this flag is platform
    dependent.

    | GFP_USER | Used to allocate memory for a user. May sleep, and is a low priority
    request.

    | GFP_HIGHER | Like GFP_USER, but allocates from high memory

    | GFP_NOFS | Not for use by filesystem calls, direct I/O initiation.

    | GFP_FREE | For internal use.|


    # 17.3 Page Tables


    Memory is broken into pages of fixed size (4 KB on x86). Portable code should
    not depend on a particular page size. To obtain the actual value one can use the
    PAGE_SIZE macro or user-space programs can get the function getpagesize().


    For 4KB pages, the 12 bits of virtual address contains offset; the remaining bits
    contain the virtual page frame number (PPN).


    Pages of virtual memory may be in any order in physical memory. The kernel converts
    the virtual PFN to PFN using page tables. Each entry in the page table contains
    a valid flag, PFN, and control information.


    If the requested virtual page is not valid, the kernel gets a page fault and then
    tries to get the proper physical memory. Demand Paging will bring in the page.
    A page may have been swapped out to the disk.


    If a page has been modified and not needed, it is marked as dirty and will be
    written to disk if the page files contain data, or to the swap area. Pages to
    be discarded with a LRU (Least Recently Used) algorithm.


    Drivers only use the values GFP_KERNEL, GFP_ATOMIC, and GFP_DMA.


    Linux uses a four-level page table, though on 32-bit systems uses only two levels
    of page tables. (Before version 2.6, Linux used a three-level page table). This
    permits using various functional methods for architecture; traversing the superlevels
    involves all-junction functions.


    The in_interalloc() function can be used to check if you are in an interrupt or
    process context. For instance:


    If we use 64 GB space on x86, Linux uses the PAE (Physical Address Extension)
    facility which gives an extra 4 GB of address space. In this it uses a three-level
    scheme, rather than one in which dimension equals


    ```

    char *buffer = kmalloc(size, in_interalloc() ? GFP_ATOMIC : GFP_KERNEL);


    ```


    A similar marker, in_atomic(), also to check if you are in a preempted context.


    The most common functions for allocating and freeing memory in the Linux kernel:


    ```

    #include <linux/slab.h>

    ```


    ```

    void *kmalloc(unsigned int len, gfp_t gfp_mask);

    void kfree(void *ptr);


    ```


    Possible values for the gfp_mask argument are detailed in /usr/src/include/linux/mem.h


    +   * GFP_ATOMIC allocations are to draw memory resources more than those with
    GFP_KERNEL to lessen chances of failure; they should not be used when they are
    not necessary.


    To allocate cleared memory,


    ```

    void *kzalloc(size_t size, gfp_t flags);


    ```


    which calls kmalloc(size, flags) and then clears the allocated region.


