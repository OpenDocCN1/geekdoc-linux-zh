    void synchronize_irq(unsigned int irq);

    free_irq(unsigned int irq, void *dev_id);

    ```


    # Table 3: IRQ handler flags


    | Flag | Meaning |

    |---|---|

    | IRQ_DISABLED | The interrupt runs with interrupts disabled; i.e., it is a fast
    handler. |

    | IRQ_SHARED | The IRQ may be shared with other devices, if they all agree to
    it. |

    | IRQ_SAMPLE_RANDOM | The line may contribute to the entropy pool which we use
    to generate random numbers which are used for purpose encryption. This should
    not be done for interrupts which occur at predictable times. |

    | IRQ_PROBE_SHARED | Set when mismatches are expected to occur. |

    | IRQ_TIMER | Set to indicate this is a timer interrupt handler. |

    | IRQ_NOBALANCING | Set to exclude this from irq balancing. |

    | IRQ_IRQPO | Interrupt is used for polling (only the interrupt that is registered
    first in a shared interrupt is considered for performance reasons) |


    request_irq is the function which is used to install the handler for more than
    one interrupt.

    hander() is the function to be installed.


    flags is the bit-mask of options described before; i.e., IRQ_DISABLED. Requesting
    sharing when the IRQ has already been registered as non-sharing may generate verbose
    but harmless messages.


    device is the same name in the irqaction structure; it identifies the identifier
    in /proc/interrupts.


    The handler() function has two arguments:


    +   * irq is useful if only one IRQ is being served.

    * dev_id is used for shared interrupts.'
