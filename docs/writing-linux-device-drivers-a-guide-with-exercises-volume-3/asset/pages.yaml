    # ## 29.1 What are MTD Devices?


    Memory Technology Devices (MTD) are flash memory devices. They are often used
    in various embedded devices.


    Such a device may have all of its memory in flash (which functions like a hard
    disk used in that its values are preserved upon power off) but often it will also
    have normal ROM of some type.


    Flash memory is a high-speed EEPROM where data is programmed (and erased) in blocks,
    rather than byte by byte as in normal REPROM.'
