  md: "# CHAPTER 12. RACE CONDITIONS AND SYNCHRONIZATION METHODS\n\n# 12.7. SEMAPHORES\n\
    \n```\nwait_queue_head_t;\n\nstruct rv_semaphore {\n    signed_long\n    count;\n\
    \    spinlock_t\n    wait_lock;\n    struct list_head\n    wait_list;\n};\n```\n\
    \n```\nvoid sem_init(struct semaphore *sem, int val);\n```\n\nand is initialized\
    \ with the following inline functions:\n\n```\nstatic void init_MUTEX(struct semaphore\
    \ *sem){\n    sem_init(sem, 1);\n}\n```\n\nThe (down) function checks if someone\
    \ else has acquired the critical section; if the semaphore is greater than zero,\
    \ it decrements it and returns. If it is already zero, it will sleep and try again.\n\
    \n```\nstatic void init_MUTEX_LOCKED(struct semaphore *sem){\n    sem_init(sem,\
