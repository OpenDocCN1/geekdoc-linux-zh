  md: '# CHAPTER 29. MEMORY TECHNOLOGY DEVICES


    # 29.2. NAND VS. NOR


    MTD devices are neither character or block in type; in particular they distinguish
    between write and erase operations, which block devices do not.


    +   - Densities are much higher than NOR devices, and the speed is an order of
    magnitude faster.

    - Bad blocks can be a problem; NAND devices may ship with them, but at any rate,
    blocks will fail with time, and thus drivers have to do block management.

    - Traditionally these devices have been associated with data storage.


    Normal filesystems are generally not appropriate for flash devices for a number
    of reasons, which we detail later, some special filesystems have been designed.


    1999 NAND has grown from about one tenth of the total flash market to most of
    it.

    Regardless of which method the underlying flash device uses, Linux can use the
    same basic methods to access it.


    The Execute in Place, or XIP, method, in which the CPU pages of memory from the
    flash-resident application directly to its virtual address space, with copying
    of pages to RAM first, can be useful in embedded devices.


    Here is a table from http://www.ninfofread.org/doc/nand.html documenting some
    the differences between NAND and NOR devices:


    Some references:


    # Table 29.1: MTD lines


    ```

    http://www-linux.ninfofread.org/

    http://www.ninfofread.com/articles/AT748621247.html

    ```


    The main web site for NAND development.

    A white paper by Cliff Bare and Jeff Sutherland about using flash in embedded
    Linux systems.


    # Table 29.2: NOR AND NAND device features


    | Interface | NOR | NAND |

    |---|---|---|n| Bus | | I/O |

    | Cell | Large | Small |

    | Cell Cost | | High | |

    | Read Time | Fast | Slow |

    | Program Time (single cycle) | Fast | Slow |

    | Program Time (multi byte) | Slow | Fast |

    | Erase Time | Slow | Fast |

    | Power consumption | High | Low, but requires additional RAM |

    | Can execute code | Yes | No, but newer chips can execute a small loader out
    of the first page |

    | Bit trending | nearly unrestricted | 1-3 times, also known as "partial program
    restriction" |

    | Bad blocks at ship time | No | Allowed


    # 29.2 NAND vs. NOR


    There are two basic kinds of flash memory: NOR and NAND.

    NOR flash devices are the older variety with these features:


    +   - A linear address, with individual address and address lines; just like DRAM.

    - Addressed can be directly mapped to the CPU''s address space and access like
    ROM.

    - Programming and erase cycles are respectable; slower than program.

    - Function number of erase cycles is limited, about 100,000 or more.

    - Recent development of MLC (multi-level cell) cells, in which two bits of memory
    can be stored per cell, has boosted density and reduced manufacturing costs per
    unit of memory, although it may come at the cost of reduced performance.

    - Traditionally these devices have been associated with code storage.


    NAND flash devices are non-linear; and have these features:


    +   - Addressing is non-linear; data and commands are multiplexed over 8 I/O lines.
    Thus, device drivers are more complex.

    - Access is sequential.'
