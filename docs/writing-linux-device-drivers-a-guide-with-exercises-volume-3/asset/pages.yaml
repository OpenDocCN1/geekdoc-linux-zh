  md: '# CHAPTER 20. INTERRUPT HANDLING AND DEFERRABLE FUNCTIONS


    # 20.2 DEFERRABLE FUNCTIONS AND SOFTIRS


    In the top half, the driver does what must be done as quickly as possible. This
    may just mean acknowledging the interrupt and getting some data off a device and
    into a buffer.


    In the bottom half, the driver does whatever has been deferred. An interrupt handler
    is not required to have a bottom half.


    +   * Work queues run in process context, and deep sleeping is permitted. Each
    work queue has its own thread on each CPU, sleeping unless other tasks are active.
    A bottom half implemented in this fashion can run on a different CPU than the
    one it scheduled.


    Depending on the kind of bottom half, they are launched in slightly different
    ways, but the system always checks anything needs to be done after an exception
    is handled and then runs any queued halves. This includes:


    +   * After a system call is completed.


    +   * After any other exception is handled.


    +   * When the scheduler selects the kernel process softirqd to.


    # Top Half


    Technically speaking the top half is the interrupt. A typical half:


    +   * Checks to make sure the interrupt was generated by the hardware device;
    this is necessary for interrupt sharing.


    +   * Cleans an interrupt pending on the interface buffer.


    +   * Does what needs to be done immediately (unless writing to/from(the device).
    The data is written to or from a device-specific buffer, which has been previously
    allocated.


    +   * Schedules handling the new information (in the bottom half).


    Another way of implementing a bottom half is through maintaining a kernel thread.
    One off the kernel thread waits until initialization, and then it sleeps until
    it has to work. Scheduling a bottom half means waking up the thread and then it
    goes back to sleep. Calling a thread when a driver is undone to deal with is which


    It is not required to have a bottom half; if there is little processing to do,
    it may be more efficient to do it in the top half, rather than the overhead of
    scheduling and launching a bottom half, and having to be careful about synchronization
    costs.


    # Example (using tasks):


    ```

    static struct my_data { ... } my_data;

    static void t_handler(unsigned long *arg) { ... }


    DECLARE_TASK(task, {name, func, (unsigned long)});

    static void my_interrupt(int irq, void *dev_id) {

    ntop_half_function(0);

    tasklet_schedule(&task);

    return IRQ_HANDLED;

    }

    ```


    # 20.2 Deferrable Functions and Softirqs


    Deferrable functions perform non-critical tasks at a later (deferred) time, usually
    as soon as possible. When the functions they run


    There are two types of softirqs (those that are kernel) which run in interrupt
    context and are not allowed to go to sleep, and workqueues, which run under a
    pseudo-process context and are allowed to sleep.


    There are a number of kinds of softir defined. In order of decreasing priority
    they are:


    # Bottom Half


    A bottom half is used to process data while top half is available for dealing
    with interrupts. Interrupts can be deferred if necessary, but generally this should
    be avoided if it goes against the purpose of having a bottom half.


    The various kinds of bottom halves behave differently:


    +   * Tasklets can run in parallel on different CPUs, although the same task can
    only run one at a time. They are never run in process context. Tasklets will run
    on the CPU that they scheduled them. This leads to cache coherency, and serialization,
    as the tasklet can never run before the bottom handler, which leads to avoidance
    of race conditions.


    | Name | Priority | Purpose |

    |---|---|---|

    | HI_SOFTIRQ | | High-priority tasks. |

    | TIMER_SOFTIRQ | 1 | Scheduled timers. |

    | NET_SOFTIRQ | 2 | Network packet transmission. |

    | RE_SOFTIRQ | 3 | Network packet reception. |

    | BLOCK_SOFTIRQ | 4 | Block device related work. |'
