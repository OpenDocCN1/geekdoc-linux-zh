    a kernel buffer, allocated dynamically (probably during initialization).


    There should also be read() and write() entry points.


    Optionally, you may want to use an ioctl() command to tell user-space the size
    of the kernel buffer mapped.


    > Note: This is not an easy exercise to do, or if time is lacking you are merely
