    # 10.2 Kernel Debuggers\n\nThe first thing to understand about using debuggers\
    \ on the Linux kernel is that Lin Torvalds has stated For his explanation of why,\
    \ which can be found at: http://www.linux.org/2009/0914/a-it-debugger.php3\nThe\
    \ short explanation for this is that reliance on debuggers can cause fixing problems\
    \ with band-aids rather than roots, and leads to race conditions.\nwith an error\
    \ at 0x17 hits my_init().\n\nLinus will tolerate (and even encourage) optional\
    \ debugging aids that check specific known errors (e.g. I am sleeping while hiding\
    \ a spinlock?), or require only an entry point to the kernel, and permit their\
    \ work to be done through modules.\n\n# gdb\n\nThe gdb debugger can be used to\
    \ debug a running kernel. The execution line would be:\n\n```\n$ gdb /boot/vmlinux\
    \ /proc/crash\n```\n\nwhere the first argument is the currently running kernel.\
    \ You can use ddb or other graphical interfaces to gdb. The sections of the kernel\
    \ debug must have been compiled with the -g option, to get much useful information.\
    \ This is not for the faint-hearted. It is pretty difficult.\n\n# kgdb\n\nkgdb\
    \ is another interactive kernel debugger. It requires two processors to be connected\
    \ to a non-null section area. The remote boot uses the user run g (a GDB wrapper\
    \ such as ddb) and can then break into the kernel on the target system, setting\
    \ breakpoints, examining data, etc. It is possible to stop the target kernel during\
