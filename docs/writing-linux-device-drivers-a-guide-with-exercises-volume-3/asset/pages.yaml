    # ## Lab 2: Testing Maximum Memory Allocation


    You can use the function kmem_cache_shrink() to release unused objects. When no
    longer need your memory cache you must free it with kmem_cache_destroy() (which
    shrinks the cache); otherwise memory will not be freed. This will fail if any
    object allocated to the cache has not been released.


    Make sure you free any memory you receive.


    It is also possible to set up a memory cache that never drops below a certain
    size using a memory pool, for which the API can be found in /usr/src/linux/linux/mempool.h.
