  md: '# CHAPTER 24. NETWORK DRIVERS I: BASICS


    # 24.1. NETWORK LAYERS AND DATA ENCAPSULATION


    # Network Layers


    ![](img/5f0cab84232061dba742ffc69894b1f1_148_0.png)


    Networking applications send and receive information by connecting to sockets,
    which operate upon endpoints. Data is sent to or received from sockets as a stream,
    whether or not the transport layer uses connectionless-datagram (such as UDP)
    or connection-oriented-sequence (such as TCP). Note that various combinations
    of these layers are possible,


    The basic data unit that moves through the network layers is the packet, which
    contains data but also has headers and footers containing information. In the
    kernel, each is described by a socket.


    These headers and footers contain information such as source and destination of
    the packet, various options about priority, sequencing, and routing, identification
    of the driver associated with the socket, etc.


    When an application writes to a socket, the transport layer creates one or more
    packets and adds control information. It then hands them off to the network layer
    which adds more control, and decides where the packets are going; Packets going
    out of the network are handed off to the datalink layer and the device driver.


    When packets of data are received by the datalink layer, it checks if they are
    intended for the local machine, and if so it processes them and hands them off
    to the network layer, which passes them through the transport layer, which sequences
    the packets, and finally strips out back to the application.


    This networking may be seen as consisting of a number of stacked layers. This
    stack may be categorized in a number of ways, but a simple description for Linux
    (in which traffic both layers) would be:


    +   * **Application Layer**: This can be familiar programs such as ftp, http and
    smtp, that communicate across the Internet, or as X clients and servers that communicate
    either across the Internet or the local machine, as well as any custom network
    application.


    +   * **Transport Layer**: This is the method of data encapsulation, error checking
    protocols, etc. The two most common are streaming TCP (Transmission Control Protocol)
    connected, and datagram-oriented UDP (User Datagram Protocol) connections. Other
    examples include SLIP and PPP.


    +   * **Network Layer**: This describes how data is to sent across the network,
    containing routing information. The most common protocols are IPv4 (Internet Protocol
    Version 4) and IPv6 for local machine communication. Other examples include ARP
    and ICMP.


    +   * **Datal Layer**: This is the hardware part. It includes both type of device
    (Ethernet, Token Ring, etc.) and the actual device driver for the network card.


    # Data Packet Encapsulation


    | Datalink (Hardware) Header |

    | (Ethernet, Device Driver) |

    | Network Layer Header |

    | (IPv4, IPv6, etc.) |

    | Transport Layer Header |

    | (TCP, UDP, etc.) |

    | Data Payload |

    | Datalink Footer |


    Figure 24:2: Data Packet Encapsulation


    As packets move up and down through the networking layers, the kernel avoids repeated
    copying by passing pointers to the encapsulated data buffer, or payload, in the
    packet, while modifying headers and footers as necessary.


    Figure 24:1: Network layers'
