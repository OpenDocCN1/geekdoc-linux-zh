  md: '# CHAPTER 2. DEVICE DRIVERS


    # 2.1. TYPES OF DEVICES


    manages one or more piece of hardware while the kernel handles process scheduling,
    filesystem access, interrupts, etc.


    Drivers may be integrated directly into the kernel, or can be designed as loadable
    modules. Not all modules are device drivers. A driver can be designed as either
    a modular or a built-in part of the kernel, with little or no change of the source.


    In the usual device taxonomy there are three main types:


    # Character Devices


    +   * Can be written to and read from a device at a time.

    * Well represented as streams.

    * Usually permit only sequential access.

    * Can be considered as files.

    * Implement open, close, read, and write functions.

    * Serial/parallel ports, console (monitor and keyboard), etc.

    * Examples: /dev/ttyS0, /dev/tty30, /dev/sdp0, /dev/sdp1


    ![](img/5f0cab84232061dba742ffc69894b1f1_17_0.png)


    Figure 2.1: From application to device


    # Block Devices


    +   * Can be written to and read from only in block-size multiplexer; access is
    usually cached.

    * Permit random access.

    * Filesystems can be mounted on these devices.

    * In Linux devices behave like character devices, transferring any number of bytes
    at a time.

    * Hard drives, cdroms, etc.

    * Examples: /dev/sda1, /dev/vd0


    # Device Types and User-Hardware Connection


    What differentiates the types of drivers is the methods they use to connect the
    kernel with users-space. Most of the time the connection passes through the VFS
    (Virtual File System), and then methods are invoked depending on whether the access
    is to a character device, block device node, or socket.


    Drivers may or not work on character devices; the essential thing is that they
    are most directly connected to the user and to the hardware.


    Block drivers are connected to the hardware, and to the user through the filesystem,
    caching, and through the Virtual File System (VFS).


    Network drivers are connected to the hardware and to the user through various
    kinds of protocol stacks.


    # Network Devices


    # Other Types of Devices


    There are other types of devices which dont fit precisely in the character/block/network
    division (although functionally they can be used for any of these generic kinds
    of peripherals).


    SCSI (Small Computers Interconnect) devices share an underlying protocol regardless
    of function. The hard work goes into the driver for the controller hardware which
    may run many devices.


    USB (Universal Serial Bus) devices also share an unchanging protocol. Once again
    there is a lower layer of tiers tied to the controller hardware, and device-specific
    drivers for the various peripherals connected to the bus.'
