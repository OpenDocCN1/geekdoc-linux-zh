    # 34.3 I/O Scheduler


    +   ** Completely Fair Queuing (cfq)


    This simple scheduler focuses on disk utilization. For a device, a queue is maintained
    for each request is requested if it can be merged (front or back) with any existing
    request. If the request is not merged, it is placed in the queue with the starting
    number block.


