  md: '# CHAPTER 34. I/O SCHEDULING


    When there are no more close requests, work continues with normal pending I/O
    requests.


    The basic goal is to reduce the per-thread response time. This scheme is similar
    in implementation to the deadline scheduler, and can be considered a variation
    on it.


    # Tunables


    antic_expire:


    Maximum time (in milliseconds) to wait anticipating a good read (close to the
    most recently expired request) before giving up. (Default = HZ/150 = 6)


    read_expire:


    How long (in milliseconds) until a read request expires, as well as the interval
    between serving expired requests. (Default = HZ/8 = 125)


    read_batch_expire:


    How long (in milliseconds) a batch of reads gets before pending writes are served.
    Should be a multiple of expire. The higher the value, the more reading is favored
    over writing. (Default = HZ/2 = 400)


    write_expire and write_batch_expire:


    Serve the same functions for writes. (Defaults = HZ/4 = 250, HZ/8 = 125)


    cost_time:


    Give some statistics.


    Some detailed documentation can be found at: /usr/src/linux/Documentation/block/as-iosched.txt.


    # 34.7 Labs


    # Lab 1: Comparing I/O schedulers


    Write a script (or program if you prefer) that cycles through available I/O schedulers
    on a hard disk and does a configuration of parallel reads and writes of configurable
    size. You''ll probably want to test read and writes as separate.


    To test you''ll make sure you''re actually reading from disk and not from cached
    memory: you can flush out the cache by


    ```

    $ echo 3 > /proc/sys/vm/drop_caches

    ```


    Before doing reads, you can copy a file to /dev/null to avoid writing. To make
    sure all writes are complete you can use a wait command under the shell.


    To test you copy a file (which will be in cached memory after the first read)
    multiple times. To make sure you wait for all writes to complete before getting
    time information, you can use a sync call.


