  md: "# CHAPTER 17. MEMORY MANAGEMENT AND ALLOCATION\n\n# 17.8. SLABS AND CACHE ALLOCATIONS\n\
    \nIt is possible to free any memory allocated using these functions. However,\
    \ if you have grabbed this large memory chunk you are free from any kind of memory\
    \ allocator to reuse the memory as needed.\n\nThese functions are primarily intended\
    \ for critical data structures that are allocated in the boot process and are\
    \ required throughout the life of the system. However, they can also be used for\
    \ other purposes.\n\nThe flags argument is a bitmask of choices used in /usr/src/include/linux/slab.h:\
    \ the main ones are:\n\n# 17.3: Memory cache flags\n\n| Flag | Meaning |\n| ---\
    \ | --- |\n| SLAB_CACHE_ALLOC | Force alignment of objects on cache lines. This\
    \ improves performance but may waste memory. Should be set for critical performance.\
    \ |\n| SLAB_POISON | Fill the slab with the known value, as 0xa5a5a5a5. For catching\
    \ uninitialized memory. |\n| SLAB_RED_ZONE | Surround allocated memory with red\
    \ zones that scream when touched or freed. |\n| SLAB_DEBUG_FREE | Cause system\
    \ panic upon allocation. |\n| SLAB_CACHE_DMA | Make sure allocation in the DMA\
    \ zone. |\n\n# 17.8 Sllabs and Cache Allocations\n\nSuppose you need to allocate\
    \ memory for an object that is less than a page in size, or not a multiple of\
    \ a page size and you don't want to waste space by requesting pages. Or suppose\
    \ you need to create and destroy objects of this same size, perhaps data structures\
    \ or buffers. These size may be page multiples of.\n\nIn other case it may be\
    \ well suited to continually allocate and destroy these objects you need, and\
    \ it is undesirable to have the kind of fragmentation results from constantly\
    \ requesting pages.\n\nWhen you allocate memory and set up your cache allocation,\
    \ Linux has a well-defined interface for doing this. Linux uses an algorithm based\
    \ on the slab allocator. As this part you can create a special memory cache, or\
    \ cache and remove objects from it (the same size) as needed.\n\nThe kernel can\
    \ dynamically shrink the cache if it has memory elsewhere, but it will not re-allocate\
    \ a new object unless there are still empty or partially used slabs in the cache.\
    \ Note that more than one object can be in a slab, whose size is to be an integer\
    \ number of pages.\n\nWhen you have a cache deployed, mine will show up under\
    \ /proc/slabinfo, and we will show something like:\n\nThe following functions\
    \ create, and destroy your own memory cache:\n\n| slabinfo - version 1.1 |\n|\
    \ name | active | num | obj_ | in_ | |\n| --- | --- | --- | --- | --- |\n| kmmem_cache\
    \ | 78 | 100 | 2 | 1 |\n| mycache | 0 | 4096 | 0 | 1 |\n| ip_count | 0 | 116 |\
    \ 0 | 1 |\n| tcp_vcache | 0 | 96 | 0 | 1 |\n| tcb_bind_free | 113 | 32 | 1 | 1\
    \ |\n| size-8192 | 0 | 8192 | 0 | 2 |\n| size-4096 | 0 | 8192 | 0 | 2 |\n| size-256\
    \ | 0 | 32 | 0 | 1 |\n| size-32 | 888 | 8814 | 32 | 69 | 78 | 1 |\n\n```\n#include\
    \ <slab.h>\n\nstruct kmem_cache *kmem_cache_create(\n    const char *name, size_t\
    \ size,\n    size_t offset, unsigned long flags,\n    void (*constructor)(void\
    \ *, struct kmem_cache *, unsigned long),\n    void (*destructor)(void *, struct\
    \ kmem_cache *, unsigned long)\n);\n\nvoid kmem_cache_destroy(struct kmem_cache\
    \ *cache);\n```\n\nThese create a new memory cache of type struct kmem_cache,\
    \ with the name argument to initialize it. All objects in the cache (there can\
    \ be any) number size in bytes, which cannot be more than 100 pages (4MB on x86).\n\
    \nwhere the means of the fields are:\n\n+   * Cache name\n* Number of active objects\n\
    * Total objects\n* Object size\n* Number of active slabs\n* Total slabs\n* Number\
    \ of pages per slab\n\nThe offset argument indicates alignment, or offset into\
    \ the pages you are allocating; normally you'll just give 0.\n\nThe last argument\
    \ to kmem_cache_create() points to an optional constructor function to initialize\
    \ any objects before they are used; the header files contain more detailed information\
    \ about the arguments and flags that can be passed to this used function."
