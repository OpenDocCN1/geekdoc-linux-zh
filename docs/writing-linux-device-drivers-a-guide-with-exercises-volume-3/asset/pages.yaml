  md: '# CHAPTER 28. USB DRIVERS


    # 28.5. DATA TRANSFER


    313


    Each configuration points to one or more interface descriptors. Each interface
    may have alternate settings about how the device might behave. For instance, a
    video camera could have alternate bandwidths: camera activated, microphone activated,
    and camera in control.


    Each interface uses one or more endpoint descriptors, which give the data source
    or sink of the device. (All control transfers use as end of point).


    # 28.4 USB Device Classes


    If a device is plugged into a well-known device class, it is expected to conform
    to standards with respect to device and interface descriptors. The same device
    driver can be used for any device that claims to be a member of that class. The
    following classes are defined in the standard:


    Table 28.2: USB device classes


    | Base Class | Descriptor Usage | Description | Examples |

    |---|---|---|--|

    | 00h | Device | Unspecified | Use class information in the interface descriptors
    |

    | 01h | Interface | Audio | speakers, microphone, sound cards |

    | 02h | Both | Communications and Control | network adapters, media, serial port
    and CDC Control |

    | 03h | Interface | HID (Human Interface Device) | mice, joysticks, keyboards
    |

    | 05h | Interface | Physical | force feedback joystick |

    | 06h | Interface | Image | digital cameras |

    | 07h | Interface | Printer | printers |

    | 08h | Interface | Mass Storage | flash drives, MP3 players, memory card readers
    |

    | 09h | Device | Hub | full and high speed hubs |

    | 0Ah | Interface | CDC-Data | used together with CDC Control |

    | 0Bh | Interface | Smart Card | smart card readers |

    | 0Dh | Interface | Content Security | security |

    | 0Eh | Interface | Video | webcams |


    | | Personal Healthcare | healthcare devices |

    |---|---|--|

    | 0Fh | Interface | |

    | DCh | Both | Diagnostic Device | USB compliance testing devices |

    | E9h | Interface | wireless controller | bluetooth and wi-fi adapters |

    | EFh | Both | Miscellaneous | |

    | FEh | Interface | Application | irda bridge |

    | FFh | Both | Vendor Specific | devices needing specific device drivers |


    Other devices require a fully customized device to be driven.


    # 28.5 Data Transfer


    There are the following types of data to transfer and from USB devices:


    Control transfers are short commands that configure and maintain the state of
    USB devices. While there may also be specific transfer commands, most or all devices
    will support the following standard set defined in /usr/include/linux/usb/device.h


    ```

