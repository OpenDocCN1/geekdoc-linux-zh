  md: '# CHAPTER 27. NETWORK DRIVERS IV: SELECTED TOPICS


    # 27.6 TSO AND TOE


    If the kernel does not recognize the command, it is passed to do_ioctl() method
    defined in the driver.


    One must ensure the interrupt, handling routine so that when a packet is received
    (with incoming interrupts-obviously avoided) it should turn off reception handlers,
    and have the packet off by the function net_rx_schedule(struct net_device *) which
    will induce the poll(device) method to be called eventually.


    ```

    int (~do_ioctl)(struct net_device *dev, struct ifreq *ifr, int cmd);

    ```


    The poll(device) method looks like:


    For this purpose commands are seen as private to the device (SIOCDEVPPRIVATEATE
    vs SIOCDEVPPRIVATE+).


    ```

    int poll()(struct net_device *dev, int work, int budget);

    ```


    The frame actually points to a kernel-space copy of the data-structure used. The
    driver can freely copy this structure without using copy_to_user().


    Where the budget is the maximum number of packets that the function can process.
    As packets are processed, they are passed to net_rx_skb(), or not to net_rx_ifif()
    in normal reception functions.


    If the method is able to process all packets it receives interrupts on, it calls
    the function net_rx_complex() to turn off, and returns a value of 0. A return
    value of 1 indicates more packets need to be processed.


    # 27.4 NAPI and Interrupt Mitigation


    # 27.6 TSO and TOE


    The straightforward way to write a network driver is to handle the arrival of
    every packet by interrupt. The interrupt handler does the necessary work (including
    queuing the packet for deferred processing, through a thread) and then is ready
    for more.


    The purpose of TSO (TCP Segmentation Offload) is to allow a buffer larger than
    the MTU (maximum transfer unit), which is only 1500 bytes, to be passed to the
    network device.


    For high-bandwidth devices such an approach can save CPU; even if the bandwidth
    is limited the CPU time spent can be enough to keep up with the stream.


    The breaking (segmentation) of the buffer into smaller-sized segments as the packet
    passes through routers, switches, etc., is normally done by the CPU before the
    data is passed to the device.


    The kernel offers an interrupt-based, or method, or polling interface. This interface
    is called NAPI (New API) for a bit of a better name.


    With TSO, a 64 KB buffer is broken into 64 mtu-sized segments on the device itself.
    Each segment, packet, or header has to be passed to the TCP/IP and IP protocol
    headers, using a template.


    A device using NAPI may be able to store some number of packets (either on board
    or in-memory DMA ring). It may also be capable of disabling interrupts for packet
    reception while continuing to receive interrupts for packet transmission (and
    possibly other).


    The result is a potentially reduction in the load on the CPU compared to an interrupt-based
    approach. Generally TSO will be important for high-bandwidth, devices as 1 Gb
    or greater speed networks.


    Given these capabilities, NAPI-based drivers turn off interrupts, and periodically
    consume and consumed resources with normal interrupts turned back on in the old-style
    fashion.


    The purpose of TOE (TCP/IP Offload Engine) is to move TCP/IP processing to an
    integrated board on the network card. With TOE, the goal is to free up the CPU
    for other tasks.


    One should use NAPI-based drivers except for only a few high-bandwidth devices,
    and generally do not interrupt them when CPU is loaded.


    Unlike TOE, the TOE mechanism handles both inbound and outbound traffic. Because
    it is a connection-oriented protocol, it is of a lot of complexity.


    # 27.5 NAPI Details


    Assuming we have the hardware capabilities for the device (the ability to turn
    off interrupts for incoming packets and to store a sufficient amount of data packets),
    the first step in writing a network driver that includes interrupt mitigation
    is to add two fields to the net_device structure:


    In Linux, kernel-dev drivers have rejected inclusion of TOE because they have
    implemented TSO. Once TSO, the performance levels are not enough to simplify the
    complexity.


    ```

    dev->poll = my_poll;

    dev->weight = my_weight;

    ```


    Since the TCP/IP stack is implemented on the card, an order with a block with
    closed window, the timeout will help to keep up and have behaviour match expectations.


    The poll(device) method will handle the data that has accumulated while incoming
    interrupts are turned off. The weight parameter indicates how much traffic should
    be accepted through the interface, for 10 Mbps interfaces it should be set to
    16; faster interfaces should use 64. The weight field should not be set to a greater
    than the number of packets the interface can hold.:


    Resource limitations (from memory to number of simultaneous connections that can
    be handled) are more than they are in Linux can be used to facilitate denial of
    service attacks.


    For a detailed explanation of why TOE was never accepted in the Linux kernel,
