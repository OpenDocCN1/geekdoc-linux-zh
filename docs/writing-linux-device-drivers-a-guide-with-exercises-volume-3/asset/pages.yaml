    # 11.6 Timer Implementation


    # 11.7 High Resolution Timers


    The kernel approach of dynamic timer implementation, which has been quite clever
    and efficient, received a great enhancement with the addition of a new approach,
    introduced since the 2.6.16 kernel


    The implementation of dynamic timers has to take care to two distinct tasks:


    We begin with the observation that there are two kinds of dynamic timers:


    +   *  Functions have to be inserted and removed from the list of timers, or have
    the expiration times modified.


    +   *  Functions have to be executed at the proper time.


    +   *  Timer functions, found primarily in scheduler and device drivers, to use
    signal when an event does not happen within a window of time, and each a task
    should be dropped or a recovery activity initiated.


    +   *  Timer functions, expected to actually run within a specified latency and
    resolution,


    The simplest implementation would be maintain one linked list of kernel timers,
    and newly add the requested timer function into either the head or tail, or in
    some kind of sorted fashion, and then when the kernel decides to run any scheduled
    timer, scan the list and run those whose value expires.


    Timeout functions tend to be more numerous than timers, and thus in the present
    dynamic timer implementation, removal of a timer before it runs is far more frequent
    than running the function.'
