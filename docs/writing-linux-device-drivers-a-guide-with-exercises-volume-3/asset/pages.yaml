  md: '# 9.1 Exporting Symbols


    In order for kernel code to make a symbol (i.e., a variable or function) available
    for use by modules, it must export it. If a module has symbols which are to be
    used by modules loaded after it, it is also to export the symbol.


    This is accomplished with the use of the EXPORT_SYMBOL() macro:


    ```

    int my_variable;

    int my_export_fun( int my_variable );

    EXPORT_SYMBOL(my_variable);

    EXPORT_SYMBOL(my_export_fun);

    ```


    Note that the symbols will be exported if they are declared as static.


    It is also possible to export symbols with the macro:


    ```

    EXPORT_SYMBOL_GPL();

    ```


    Exactly how this should be used and what implications it has been considered.
    Certainly it means quite the symbol can be exported to modules which are licensed
    under the GPL, e.g., it can be used in binary-only drivers. However, some it should
    be exported to modules that are used internally by the kernel for basic functions.


    There are some other methods of exporting symbols:


    ```

    EXPORT_PER_GPL();

    EXPORT_PER_GPL_CPU_GPL();

    EXPORT_CPU_GPL_FUTURE();

    EXPORT_KERNEL_GPL();

    ```


    Kernel for the 2.6 series export global symbols in modules unless they are declared
    as static; that is one reason why the static keyword is literally used in kernel,
    for the purpose of avoiding name pollution.


    Note that it still makes sense to declare symbols as static; if the code is compiled
    as built-in binary. The usual rule of thumb is that all symbols should be declared
    static unless there is a need to do otherwise.


    # 9.2 Module Licensing


    Modules can be licensed with the MODULE_LICENSE() macro, as in:


    ```

    MODULE_DESCRIPTION("Does Everything")

    MODULE_AUTHOR("Fandels with Handles")

    MODULE_LICENSE("GPL v2");

    ```


    # 9.2. MODULE LICENSING


    Besides the informal content, this macro has important consequences: Any other
    license causes the kernel to be tainted, and warning messages appear when the
    module is loaded. For the most part any system problems, crashes etc. that arise
    when using a tainted kernel are likely to be blamed on developers (the proc /sys/kernel/tainted
    shows your kernel''s status).


    The following are understood by the kernel:


    # Table 9.1: Licenses


    | License | Meaning | Tainted? |

    | --- | --- | --- |

    | GPL | GNU Public License, V2 or later | No |

    | GPL v2 | GNU Public License | No |

    | GPL and additional rights | GNU Public License, V2 and more | No |

    | Dual BSD/GPL | GNU Public License, V2 text BSD license | No |

    | Dual MPL/GPL | GNU Public License, V2 or Mozilla license | No |

    | Dual MIT/GPL | GNU Public License, V2 or MIT license | No |

    | Proprietary | Non free (as freedom, no free beer) | Yes |


    You can see the licenses of loaded modules with a script like:


    ```

    #!/bin/bash

    for s in $(proc/modules | awk ''{print $1}'');

    do echo -n "$s\t"

    modinfo $s | grep license

    done

    ```


    > A phrase sometimes heard in the Linux kernel developer community is:


    All binary modules are licensed.


    +   A debate about this was held on the kernel mailing list in June 2006. (See
    http://www.kernel.org/Articles/215075.html). The main view coming out of this
    discussion was stated that binary modules could not be tainted, because the GPL
    controls distribution and not use of the kernel code.


    +   We don''t want to get into a legal discussion here, but it is clear whether
    or not certain practices were accepted in the past, the future trend is it is
    only going to become more difficult to get away with binary modules.


    +   Even if enforcement is not pursued vigorously, it is clear that increasing
    technical impediments and inefficiencies are making proprietary more difficult
    and more expensive if not impossible.'
