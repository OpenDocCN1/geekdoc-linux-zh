  md: "# CHAPTER 4. CHARACTER DEVICES\n\n# 4.5. REGISTERING THE DEVICE\n\nThus some\
    \ scripting is required around both module loading and unloading steps.\n\nWhile\
    \ it would be nice to have a module to do an exec() call to name and jump out\
    \ to user space, this is never done; kernel developers feel fairly uneasy making\
    \ nodes in user-land, not the kernel.\n\nEven better, you can use the user facility\
    \ to create a node from within your module. We will show you how to do this.\n\
    \n# 4.4 Accessing the Device Node\n\nUnder-like operating systems, such as Linux,\
    \ applications access peripherals using the same functions they do for regular\
    \ files. This is an essential part of the philosophy: listening to a sound involves\
    \ reading the device node associated with the sound card (generally /dev/audio).\n\
    \nThere are a limited number of entry points into device drivers, and in most\
    \ cases there is one of the system calls that accesses the device and the entry\
    \ point in which it is executed when the call is.\n\nFor a device, such as character\
    \ or block, the entry points are the same irrespective of the actual device. The\
    \ kernel mapping is relatively direct; in the case of block devices there is more\
    \ indirection; layers of the kernel may interfere between the system call and\
    \ the device, a read would involve the virtual filesystem, the actual device,\
    \ and cached layers; a write would be managed by the driver through a read/or\
    \ write call.\n\nThe following are the main operations that can be performed on\
    \ character device nodes by programs in user space:\n\n```\nint open(char *pathname,\
    \ int flags, mode_t mode)\n\nssize_t read(int fd, void *buf, size_t count)\nssize_t\
    \ write(int fd, void *buf, size_t count)\nlseek(int fd, off_t offset, int whence)\n\
    lloffseek(int fd, off_t offset, int whence)\nvoid *mmap(void *addr, size_t len,\
    \ int prot, int flags, int fd, off_t offset)\nint poll(struct pollfd *fds, int\
    \ nfds, int timeout);\n```\n\nThese entry point all have man pages associated\
    \ with them.\n\nThe device driver has entries corresponding to these functions;\
    \ however names and arguments may differ. In the above list, for example the system\
    \ call open() will load to the entry point release().\n\nRemember that applications\
    \ can exert these system calls independently, by using the standard I/O library\
    \ functions, open(), close(), read(), write().\n\n# Accessing Device Nodes\n\n\
    Library Routine\n\n```\nopen(const char *path, int flags, mode_t mode)\nread(int\
    \ fd, void *buf, size_t count)\nwrite(int fd, void *buf, size_t count)\n```\n\n\
    System Calls\n\n```\nopen(const char *pathname, int flags, mode_t mode)\nread(int\
    \ fd, void *buf, size_t count)\nwrite(int fd, void *buf, size_t count)\n```\n\n\
    Entry Points\n\n```\nopen(inode *inode, struct file *file, int flags, mode_t mode)\n\
    read(struct file *file, void *buf, size_t count, loff_t *f_pos)\nwrite(struct\
    \ file *file, void *buf, size_t count, loff_t *f_pos)\n```\n\n# Device Node\n\n\
    ![](img/5f0cab84232061dba742ffc69894b1f1_31_0.png)\n\n# 4.5 Registering the Device\n\
    \nSo far all we have done is reserve device numbers for the exclusive use of our\
    \ driver. Most work\n\nCharacter devices are associated with a cdev structure,\
    \ as described in /usr/src/include/linux/cdev.h:\n\n```\nstruct cdev {\n\tstruct\
    \ kernel *obj;\n\tstruct module *owner;\n\tstruct file_operations *ops;\n\tstruct\
    \ list_head head_list;\n\tdev_t dev;\n\tunsigned int count;\n};\n```\n\nNormally\
    \ you won't work directly with the internals of this structure, but reach it through\
    \ utility functions. In particular we see how the owner and pointers are used.\n\
    \nA number of related functions are needed to work with character devices:\n\n\
    ```\n#include <linux/cdev.h>\n```"
