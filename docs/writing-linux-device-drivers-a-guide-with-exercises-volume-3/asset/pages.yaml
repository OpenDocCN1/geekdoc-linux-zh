  md: '# 21.1 Buses and Ports


    Computers require data paths for the flow of information between the processor,
    memory, and various I/O devices and peripherals. These data paths are known as
    the bus, of which there are several types.


    +   - A data bus is a group of lines that parallel data transfer; on the Pentium
    data buses are 64-bit wide.

    - An address bus transmits addresses; on the Pentium address buses are 32-bit
    wide.

    - A control bus transmits control information, such as whether the bus can allow
    data to get between a CPU and RAM, or between a CPU and an I/O device, and whether
    a read or write is to be performed.


    A bus connecting to an I/O device is an I/O bus; x86 CPUs use 16 or 32 lines to
    address I/O devices, and 16 or 32 out of them transfer data lines. The bus is
    connected to each I/O device through a combination of I/O ports, interfaces, and
    controllers.


    The bus can be of various types such as ISA, EISA, PCI, and MCA. We restrict our
    attention to ISA and PCI.


    Controlling peripherals involves reading and writing to registers on the device.
    When we talk about I/O ports, we are referring to the corresponding addresses,
    or registers.


    External hardware is also accessed by the CPU. All through some kind of peripheral
    bus, but some CPUs, like the x86, have distinct read and write lines and special
    instructions to access these memory objects. On other architectures, memory-portable
    code uses the same basic functions of the architecture, although the implementation
    of them may differ.


    On the x86 architecture this I/O space spans 1 KB in length; ports can be addressed
    as individual 8-bit ports, or two 8-bit ports can be treated as a 16-bit port,
    and four 8-bit ports can be treated as a 32-bit port. To be more precise, you
    can use 8-bit, 16-bit, or 32-bit ports, or some combination. The 16-bit and 32-bit
    ports are aligned on 16- and 32-bit boundaries.


    # 21.2 Memory Ports


    Operations on I/O registers differ in manner from normal memory access. In particular,
    there may be called side-effects. These are generally due to compiler and hardware
    optimizations.


    These optimizations can cause reordering of instructions. In concurrent memory
    reads and writes there is no problem with a variable value since a read always
    returns the last value written.


    However, for I/O ports this can cause the CPU to fail when a process depends on
    the order of memory access. In other words, reading or writing to an I/O register,
    device may initiate or return an interrupt.


    Therefore we must make sure that no reordering is and no occurs. Other problems
    which are difficult to diagnose, and are rare or intermittent, may result.


    # 21.3 REGISTERING I/O PORTS


    The solution is to use appropriate memory barriers when necessary. The necessary
    functions are defined in and included from /usr/src/linux/arch/x86/include/asm.h
    and


    ```

    void barrier(void)

    void readb(void)

    void writeb(void)

    void wb(void)

    ```


    ```

    void sm_rmb(void)

    void sm_wmb(void)

    void sm_mb(void)

    ```


    The barrier() macro forces the compiler to store in memory all values currently
    modified in a CPU register, to read them later when they are needed. This function
    may have no effect on the hardware itself.


    The other macros use memory barriers in the code; how they are implemented depends
    on the platform. It forces any reads before the barrier before any reads done
    after the barrier.


    The versions with sm_ insert memory barriers only on multi-processor systems,
    on single CPU systems they expand to call a a barrier is


    A simple example of a write barrier is:


    ```

    io32write(int value, __ __io *addr);

    io32write(int value, int size, __ __io *addr);

    io32write(int value, __ __io *addr);

    ```


    Most architectures define macros, which combine setting a value with invoking
    a memory barrier. The simplest they look like


    ```

    #define _set_var(addr, value) { *addr = value; while (0); }

    #define _set_varb(addr, value) { *addr = value; while (0); }

    #define _set_varmb(addr, value) { *addr = value; while (0); }

    ```


    Memory barriers may cause a performance hit and should be used with care. One
    should only use the specific form needed. For instance on x86 the write memory
    barrier does nothing as writes are not reordered. However, reads may be reordered,
    so you should use _rmmb() if needed.


    Before we access the I/O ports, the kernel has to register your device, although
    there is nothing at the hardware level to enforce this can lead to many bugs and
    system crashes.


    Linux uses the following functions, defined in /usr/src/linux/kernel/resource.c
    for requesting and releasing I/O ports:'
