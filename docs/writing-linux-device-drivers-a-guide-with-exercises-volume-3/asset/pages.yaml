  md: '# CHAPTER 18. TRANSFERRING BETWEEN USER AND KERNEL SPACE


    # 18.2 PUT(GET).USER() AND COPY_TO(FROM).USER()


    # 18.1 Transferring Between Spaces


    User-space applications work in a different (virtual) memory space than the kernel.


    When an address is passed to the kernel, it is the virtual address in user-space.
    An example would be the pointer to the (read) and (write) driver entry points.


    Any attempt from the kernel to directly access virtual pointers is a good recipe
    for disaster. As matter of principle, these addresses may not be meaningful in
    kernel-space.


    One might get away with deferring a pointer from user-space for awhile. If a page
    fault occurs, the kernel will save the record of the story in that one should
    never directly deference a user-space pointer in kernel-space.


    The functions which accomplish the two distinct things:


    +   * Verify the user-address, and handle any page faults that may occur if the
    page is currently not resident in memory.

    * Perform a copy between the kernel and user addresses.


    Using raw i/o or memory mapping can avoid copying.


    # 18.2 put(get).user() and copy_to(from).user()


    All the functions can be used only in the context of a process, which must refer
    to the current process''s task_struct data structure in order to do the address
    translation. Calling them from an interrupt routine is another recipe for disaster.


    One should never use the following with a spinlock, as they may go to sleep, in
    which case your driver (or the entire system) could get hung, the spinlock never
    be released.


    ```

    #include <linux/user.h>

    ```


    ```

    access_ok(int type, unsigned long addr, unsigned long size);

    ```


    ```

    int get_user(value, void *ptr);

    int _get_user(value, void *ptr);

    int put_user(expr, void *ptr);

    int _put_user(expr, void *ptr);

    ```


    ```

    unsigned long _copy_from_user(void *to, const void *from, unsigned long len)

    ```


    unsigned long len;


    unsigned long to;


    unsigned long from;


    unsigned long _copy_to_user(char *dst, const char *src, unsigned long count);


    long strnc_user(const char *str, unsigned long n);


    unsigned long _get_user(char *user, void *from, unsigned long len);


    +   * These functions are the only place in the kernel page faults are handled
    because they are in user-space, by demand paging or segmentation faults according
    to whether or not they are legal.

    * This occurs only on pages for the user-space pointer; the kernel never swaps
    out pages for its own and always allocates them with urgency and never has demanded
    faulting for kernel memory.


    type is VERIFY_READ or VERIFY_WRITE depending on what you want to do in user-space.
    For both use VERIFY_WRITE


    addr is the address to be checked.


    size is a byte count.


    Is called by the method of following functions; rarely needs to be directly called.


    Returns 1 (true) if access is allowed; 0 on failure.


