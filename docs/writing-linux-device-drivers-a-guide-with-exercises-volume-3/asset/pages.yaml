  md: "# CHAPTER 11. TIMING AND TIMERS\n\n# 11.8. USING HIGH RESOLUTION TIMERS\n\n\
    Timeout functions generally have a weak precision requirement, while (in at least)\
    \ timer functions may have more stringent demands.\n\n```\nint hrtimer_try_to_cancel(struct\
    \ hrtimer *timer);\n\nint hrtimer_restart(struct hrtimer *timer);\n\nktime_hrtimer_get_remaining(const\
    \ struct hrtimer *timer);\nint hrtimer_active(const struct hrtimer *timer);\n\
    int hrtimer_get_res(const clock_t *clock, struct timespec *tp);\n```\n\nThe original\
    \ implementation works well for timeout functions, particularly because it does\
    \ such rapid job of timer removal, only an index lookup is required, and jiffy-level\
    \ accuracy is generic.\n\nThe hrtimers (High Resolution Timer) API, introduced\
    \ in the 2.6.16 kernel, is designed for dynamic alarms needing to execute:\n\n\
    Rather than having a complex of lists, where one list (per CPU) is sorted by time\
    \ of expiration, using a red-black tree. Insertion and removal may be slower than\
    \ the original method, there will be no need for a cascade operation and there\
    \ are fewer elements in the list.\n\nThe only field in the data structure:\n\n\
    ```\nstruct hrtimer {\n    struct rb_node node;\n    ktime_t        expires;\n\
    \    enum hrtimer_restart (*function)(struct hrtimer *);\n    struct hrtimer_base\
    \ *base;\n};\n```\n\nExpiration periods for the hrtimers are expressed in nanoseconds\
    \ rather than jiffies, although some operate at lower resolution.\n\nthat needs\
    \ to be used by the kernel.\n\nThe earliest implementation of the API had a void\
    \ argument to the function and a data field in the structure. With the current\
    \ API, one will want to embed the timer structure in a structure that can be passed\
    \ data into the function.\n\nThis can be done with the container_of() macro as:\n\
    \n```\nstruct my_data {\n    struct hrtimer timer;\n    struct timer_spec data;\n\
    };\n```\n\n# 11.8 High Resolution Timers\n\nThe hrtimers require initialization\
    \ of a new (opaque) ktime_t which measures time in nanosecond resolution if the\
    \ architecture can support it. Its internal representation of ktime_t is different\
    \ on 64-bit and 32-bit platforms and should not be mocked.\n\nFor dealing with\
    \ time the variables contained in /usr/src/linux/include/ktime.h do not require\
    \ much explanation:\n\n```\n#include <ktime.h>\n\nime_t ktime_set(ktime_t *kt,\
