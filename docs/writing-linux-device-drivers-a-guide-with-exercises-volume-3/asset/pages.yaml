  md: '# CHAPTER 21. HARDWARE I/O


    # 21.6. SLOWING I/O CALLS TO THE HARDWARE


    Reading and I/O puts may require the use of memory barriers, which we previously
    discussed.


    +   * For specific bases are optional convenience functions that take care of
    allocating

    I/O resources and remapping them. For instance PCI one can use the following

    functions (and others) defined in /usr/src/linux/drivers/pci/pci-


    ```

    int pci_request(struct pci_dev *dev, int bar, const char *res_name);

    int pci_regions(struct pci_dev *dev, const char *res_name);

    int pci_release(struct pci_dev *dev, int bar);

    ```


    +   * You can request a particular bar (Base Address) associated with the

    device, where bar can range from 0 to 5, or all registers associated with a device.


    +   * The res_name argument is what shows up under /proc/iomem.


    Example:


    ```

    outb_READ_I_LOW, MEM_CONTROL_PORT();


    dx = (inb(MEM_DTA_DATA_PORT) & 0xf);

    ```


    # 21.5 Reading and Writing from I/O Registers


    # 21.6 Slow I/O to the Hardware


