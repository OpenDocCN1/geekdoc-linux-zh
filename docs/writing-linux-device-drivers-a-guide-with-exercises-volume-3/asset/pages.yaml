  md: '# 29.3 Driver and User Modules


    The MTD subsystem in Linux uses a layered approach, where the lower device driver
    has simple entry points for methods like read, write, and erase. The upper layer
    is ignorant of the underlying hardware but manages interaction with user-space.


    There are two kinds of modules comprise the MTD subsystem; driver may or not be
    actual kernel modules; they can be built.


    User modules provide a high level interface to user-space, where Driver modules
    provide the raw access to the devices.


    Currently implemented User modules include:


    +   * Raw character: direct byte by byte access, needed to construct a filesystem
    or raw storage.

    * Raw block: used to put normal filesystems on flash. Flash blocks are cached
    in RAM.

    * FTL, NFTL (Flash Translation Layer Interface)

    * Microsoft Flash System: Read-only for now.

    * Journaling Flash File System (JFFS2): Full read/write, compressed journaling
    filesystem.


    # 29.4 Filesystems


    Filesystems for flash devices have some important challenges:


    +   * Block sizes can be large (64 KB to 256 KB). Under Linux implementations,
    a block device cannot have a block size larger than a page frame (4 KB on x86
    and many others)

    * NOR has a limit to the number of erase cycles per block; typically about 100,000.
    It is important to use all parts of the device equally.

    * There may be bad blocks which must be locked out.

    * Flash memory is expensive, so compressed filesystems are attractive.

    * Journaling enhancement; it shortens the power down.

    * Execution in place is often needed in embedded systems, which is orthogonal
    to compression.


    A number of different filesystems have been used for flash devices, and lets each
    consider in them.

    itrd (Initial RAM Disk) was originally developed for using on floppy systems,
    and to lead a basic operating system which could load essential drivers, such
    as the case in SCSI systems


    # 29.5 LABS


    When used with flash memory, itrd begins by copying a compressed kernel from flash
    to RAM and then decomposes the itrd image and mounts it using the ramdriver.


    The disadvantages are fixed size, which is wasteful, and loss of changes upon
    reboot. Better approaches are now available.


    cramfs is a compressed read only filesystem, where the compression is at the unit
    of pages. The filesystem is made with a writer program, and can be checked with
    the frantic utility, sources of which can be found in /usr/src/cramfs/utils.


    ramfs is a dynamic-static read-only device in a flash system to frequently monitor
    or manage temporary data.


    jffs and its descendant jffs2 are complete read/write, compressed filesystems.
    jffs was developed by Applications in Linux (http://developer.linux.org/software/jffs),
    with no compression. jffs2 provides compression and is developed by a team led
    by David Wood (http://www.redhat.com/jffs2).


    the jffs2 filesystem consists of a list (log entry) containing file information.
    When the filesystem is mounted the log is scanned to find how to put files together.


    Nodes are written sequentially from the first block on, and when the end is reached,
    the kernel is wrapped. This operation evens over the device; it provides wear-leveling.


    Note that more than one filesystem can be used on the same device. For instance
    read-only material can be on cramfs filesystem, frequently changing data can be
    on ramfs, and anything requiring read/write access and perseverance across reboot
    can be put on jfs.


