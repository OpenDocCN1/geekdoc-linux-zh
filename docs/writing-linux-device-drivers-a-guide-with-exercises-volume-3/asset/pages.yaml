    CHAPTER 6. KERNEL FEATURES


    6.2. USER-SPACE VS. KERNEL-SPACE


    # Networking


    +   • Networking operations are not process specific; must be handled by the operating
    system.

    • Incoming packets are asynchronous; must be collected, identified, dispatched.

    • The kernel also has to address routing and address resolution issues.


    # 6.2 User-Space vs. Kernel-Space


    | Processes | Memory | Filesystems |

    | :--- | :--- | :--- |

    | Create/Destroy | Virtual Space Allocate/Free | Structured on unstructured HW
    |

    | Schedule | Process Interaction | Multiple Types Process Interaction |

    | IPC Input/Output | | |


    | Devices | Networking |

    | :--- | :--- |

    | Control Peripherals | Receive Packets - Identity and Dispatch |

    | Systems Operations | Send Packets - Routing and Address Resolution |


    Figure 6.1: Main kernel tasks


    # Execution modes


    +   • Inter-process communication (IPC) and signals and pipes.

    • Scheduling.


    user mode

    Applications and daemons execute with limited privileges (Ring 3 on x86). This
    is true even if the application has root privileges.

    kernel mode

    Kernel has direct privileged access to hardware and memory (Ring 0 on x86). Drivers
    (and modules) have kernel privileges.


    # Memory Management


    +   • Build up a virtual address space for all processes.

    • Allocating and freeing up memory.

    • Process interaction with memory.


    | User Mode | Kernel Mode |

    | --- | --- |

    | Return |


    Figure 6.2: User and kernel space


    Execution is transferred from user mode (space) to kernel mode (space) through
    system calls (which are implemented using synchronous interrupts, or exceptions)
    and hardware interrupts (asynchronous interrupts).

    The mode is a state of each CPU in a multi-processor system rather than the kernel
    itself, as each processor may be in a different execution.


    # Filesystems


    +   • Build structured filesystems on top of unstructured data.

    • Use multiple filesystem types.

    • When virtualization kernels the hypervisor (Xen for example) runs in Ring 0,
    while the guest (client) kernels may run in Ring 0 or Ring 1 depending on the
    type of virtualization.

    • If it is Ring 1 certain amount of trickery and/or emulation is required to accomplish
    this.


    # Device Management


    +   • Systems operations map to physical devices.

    • device drivers control operations for virtually every peripheral and hardware
    component.'
