  md: "# CHAPTER 35. BLOCK DRIVERS\n\n# 35.3. REGISTERING A BLOCK DRIVER\n\nWhile\
    \ a particular system can request any number of bytes, the low-level read/write\
    \ requests must be in units of block size. Each access is cached (unless explicitly\
    \ requested otherwise) which means the device may be delayed, and reads may be\
    \ satisfied from cache.\n\nThe drivers do not have their own read/write functions.\
    \ Instead they deploy a request function, a callback function is invoked by the\
    \ higher levels of the kernel in a fluid that depends on the device.\n\nBlock\
    \ devices have multiple partitions. In instances the partition number corresponds\
    \ to the device's minor, while the device shares the same major number. The naming\
    \ convention for the nodes is:\n\nMajor Name — Partition\n\ne.g., /dev/hda1 has\
    \ Major Number hd, and h1 (the second device), is Partition 4. Details of the\
    \ partitioning are contained in the generic data structure.\n\nBlock devices may\
    \ also employ removable media such as CD-ROMs and floppy disks.\n\n```\n#include\
    \ <linux/fs.h>\n\nint register_blockdev(unsigned int major, const char *name);\n\
    int unregisterblockdev(unsigned int major, const char *name);\n```\n\nregister_blockdev()\
    \ returns 0 on success and -ENOMEM or -EINVAL on failure. Dynamic assignment is\
    \ permitted. The value of major must be less than or equal to MAX_BLOCKDEV=256.\n\
    \nunregister_blockdev() returns 0 on success and -EINVAL on failure. It checks\
    \ that the major and name matches, but does not check if it is the owner of the\
    \ device it is registering.\n\n![](img/5f0cab84232061dba742ffc69894b1f1_190_0.png)\n\
    \n# 35.2 Buffering\n\nFiles on block devices which are organized in fixed block\
    \ sizes, although I/O requests from system calls may be for any number of bytes.\
    \ Thus block devices are controlled by a buffering/caching system, which is shared\
    \ among all devices.\n\nThe cache is cached across the page, and a device may\
    \ contain more than one block device buffer.\n\nThe device itself is accessed\
    \ if:\n\n+   - A block is not present on a read request.\n- A block needs to be\
    \ written (eventually) if the cache no longer matches what is on the device itself,\
    \ in case this must be marked as dirty. Not if a file is opened with the O_SYNC\
    \ flag, no locking is allowed.\n\nAt intervals, the flush process processes all\
    \ blocks that haven't been used for a certain amount of time, to be flushed back\
    \ to the device. Other events may trigger the flushing, the object being used\
    \ to keep the number of dirty blocks in the cache at a minimum, and to make sure\
    \ the most important blocks, those containing inodes and superblocks, are kept\
    \ consistent.\n\nThe system command writes all buffer blocks for the block device.\
    \ The file-system command writes back all buffer blocks for a single file.\n\n\
    # 35.3 Registering a Block Driver\n\nRegistering a device is generally done during\
    \ the initialization routine, and in many ways is pretty similar to doing a character\
    \ device. Registering is generally done during the cleanup, just as for a character\
    \ device. The functions for this are:\n\n+   - There exist more block device registration\
    \ and unregistration functions, blk_register_region() and blk_unregister_region().\n\
    - The use of these is somewhat complicated and can be read about an article in\
    \ Kernel Today in its driver series article: http://www.kernel.org/Articles/25711.\n\
    \nThe block_device operations structure replaces the file_operations structure\
    \ for characters. It gets associated with the device in the generic data structure,\
    \ and as we will show shortly.\n\nThe block_device operations structure is defined\
    \ in /usr/src/linux/include/linux/fs.h as:\n\n```\nstruct block_device {\n\tstruct\
    \ inode *inode; struct file *f;\n\tint (read)(struct inode *, int count, struct\
    \ file *vf);\n\tint (ioctl)(struct inode *, int mode, unsigned long cmd, unsigned\
    \ long arg);\n\tlong (locked_unlock)(struct device *bdev, unsigned long arg);\n\
    \tlong (write)(struct inode *, int count, struct file *vf);\n\tint (direct_access)(struct\
    \ block_device *bdev, sector_t sector, void **kaddr);\n\tunsigned long *_arg;\n\
    \tint (media_changed)(struct block_device *);\n\tint (invalidate_disk)(struct\
    \ block_device *);\n\tint (release)(struct block_device *bdev, struct block_geometry\
    \ *geo);\n\tstruct module *owner;\n};\n```\n\nFor simple devices, one need not\
    \ define open( ) and release( )() entry points, as generic ones will do the work.\
    \ However, real hardware will probably need to perform certain steps at those\
    \ times and will still need methods to be written."
