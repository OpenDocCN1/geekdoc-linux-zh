  md: '# 8.1 What are Interrupts and Exceptions?


    An interrupt (interrupts) is the sequence followed by a processor. It is always
    connected with an electrical signal stemming either outside or inside the processor.


    When an interrupt occurs the kernel must suspend the thread it is currently executing,
    by invoking one or more service routines (ISR) or handlers to the specific interrupt,
    and then return to the suspended thread, or another interrupt.


    Under Linux, interrupts may be levied according to various mechanisms and priorities,
    but they will be served eventually. Interrupts are not queued so one interrupt
    will be served, if another interrupt of the same type arrives while being served,
    it will be served in turn.


    There are two kinds of interrupts:


    +   * Synchronous interrupts, often called exceptions, are generated by the CPU.


    +   * Asynchronous interrupts, often called signals, are generated by other hardware
    devices, and are finally fetched by the APIC (Programmable Interrupt Controller).


    Exceptions may be caused by errors during execution by certain instructions, or
    by special conditions such as a page fault. They may also be caused by a system
    call which makes the CPU enter kernel mode to serve a service from user-load.
    They may occur in out of process contexts. Often a signal is sent to one or more
    processes.


    Interrupts are generally triggered by random events such as a mouse click, keyboard
    press, a data packet arrival, or more regular events such as a timer interrupt.
    They are never associated with a process context.


    Interrupts are very similar to signal; most interrupts may be hardware signals,
    or signals are software interrupts. The general lesson of efficient and signal
    handling still applies well to interrupts.


    Interrupt handling is one of the most difficult tasks incurred by the kernel.
    It requires careful design to avoid race conditions and non-entrant code


    Under Linux interrupts may be shared, and when an interrupt is shared, all handlers
    for that interrupt must agree to it. Each of them will receive the interrupt in
    turn; there is no constraint on the interrupt by one of others.


    # 8.2 Exceptions


    Exceptions fall into two categories:


    Processor-detected exceptions occur when the CPU sets a status bit during instruction
    execution. These can be of three types, depending on the value of the ei register
    in the kernel mode stack:


    +   * The register contains the address of the instruction to be executed after
    the one that caused the trap. Traps are used for debugging and tracing methods
    and there is no need to repeat the instruction that caused the trap.


    +   * Aborts: the register may not contain a meaningful value. There may be a
    hardware failure or an invalid value in tables. The abort will terminate the process.


    Programmed exceptions are generated by the process through int or int3 instructions
    (on x86), such as when invoking a system call. They may also be triggered by the
    instruction which checks for overflow, or by the branch instruction, which checks
    on registers, when the condition is met. Programmed exceptions are handled just
    like traps and are sometimes software interrupts.


    On 32-bit x86 CPUs there are up to 32 exceptions, numbered from 0 to 31. The exception
    listed in the table below is usually sent to the process which triggered the exception.


    | Table 8.1: 32-bit x86 exceptions |

    | Exception/ Service Routine | Type | Signal | Meaning |

    |---|---|---|---|---|n| 0 Divide error div_error | fault | SIGFPE | Attempted
    division by 0. |

    | 1 debug() | trap | SIGTRAP | Used by debugging and tracing. |

    | 2 NMI() | fault | None | Reserved for non-maskable interrupts (NMI pin). |

    | 3 Breakpoint int3() | trap | SIGTRAP | Handler for int3 instruction. |

    | 4 Overflow overflow() | fault | SIGFPE | An instruction has executed overflow.
    |

    | 5 Bounds check bounds() | fault | SIGBUS | An instruction was executed and is
    out of bounds. |

    | 6 Invalid opcode invalid_op | fault | SIGILL | Bad code (part of the CPU instruction
    that caused the exception). |

    | 7 Device not available device_not_available() | fault | SIGBUS | A floating
    point in MI instruction was executed with the flag of set. |

    | 8 Double fault double_fault() | abort | SIGSE | An exception detected while
    trying to handle a trap for some reason they can''t be handled in turn. |

    | 9 Co-processor segment coprocessor_overrun() | abort | SIGFPE | Problem with
    a math cop, like a x37. |'
