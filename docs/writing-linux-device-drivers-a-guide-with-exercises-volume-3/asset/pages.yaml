  md: "# CHAPTER 12. CONDITIONS AND SYNCHRONIZATION METHODS\n\n# 12.4. SPINLOCKS\n\
    \nUsing a structure prevents mixing up atomic variables with normal integers as\
    \ you can't atomic functions on integers and vice versa without explicit casting.\n\
    \n```\nlong_first_set_bit(const unsigned long *addr, unsigned long size);\nlong_next_set_bit(const\
    \ unsigned long *addr, unsigned long size, long offset);\nlong_first_bit_bit(const\
    \ unsigned long *addr, unsigned long size);\n\nunsigned long ffs(unsigned long\
    \ word);\nunsigned long ffs(int v);\nunsigned long ffs(int i);\n```\n\nIn-line\
    \ macros and functions are SMP-safe depending on the architecture:\n\n```\n#include\
    \ <atomic.h>\n\n#define ATOMIC_INIT(i)    ((i))\\n#define atomic_read(v)     \
    \ ((v)->counter)\n#define atomic_set(v,i)    ((((v)->counter) = (i)))\n\nvoid\
    \ atomic_add(int i, atomic_t *v);\nvoid atomic_sub(int i, atomic_t *v);\nvoid\
    \ atomic_dec(atomic_t *v);\n\nint atomic_dec_and_test(atomic_t *v);\nint atomic_inc_and_test(int\
    \ i, atomic_t *v);\nint atomic_add_negative(int i, atomic_t *v);\nint atomic_sub_return(int\
    \ i, atomic_t *v);\nint atomic_inc_return(int i, atomic_t *v);\nint atomic_dec_return(int\
    \ i, atomic_t *v);\n```\n\nIn these functions the type of nr depends on the architecture:\
    \ for 32-bit 64-bit it is an integer. The second argument points to the variable\
    \ in which bits are going to be changed or modified. It type varies among architectures,\
    \ usually unsigned long *).\n\nThe test functions return the bit value before\
    \ their return.\nThere also exist a set of non-atomic bit functions, which differ\
    \ from the above by prefixed with _ (e.g., _set_bit). These can be used when already\
    \ protection is taken in and are much faster than the atomic versions.\n\nNote\
    \ that the ATOMIC_INIT(), atomic_read(), and atomic_set() macros are automatically\
    \ atomic they just use a value.\n\n# 12.4 Spinlocks\n\nA spinlock is a mechanism\
    \ for protecting critical sections of code. It will spin waiting for a resource\
    \ to be available, and not to sleep.\n\nOne can protect the section of code executing\
    \ from one CPU, but more generally one can protect simultaneous access to the\
    \ same resource, which may be touched by different code paths, in addition, may\
    \ be in an interrupt handler or another process context.\n\nOn 64-bit platforms\
    \ there are a 64-bit atomic type and functions, such as atomic_64(atomic_64_t\
    \ *v). You can see the header file for details.\n\n# 12.3 Bit Operations\n\nIn\
    \ order to manage and modify bit flags and lock variables there are a number of\
    \ atomic bit operations provided by the kernel.\n\nThese are accomplished by a\
    \ single machine operation and they are very fast; on most processors they can\
    \ be done without disabling interrupts.\n\nThe functions, not differ somewhat\
    \ according to architecture. They are defined in /usr/src/linux/arch/x86/include/asm/bitops.h\n\
    \nSpinlocks are only important in multi-processor kernels before lock two CPUs\
    \ can access a critical section of code simultaneously, spinlocks were defined\
    \ on single processor systems. However, with primitive hyper-threaded, or multi-core\
    \ system, spinlocks are always necessary.\n\nThe macros in /usr/src/linux/arch/x86/include/asm/bitops.h\
    \ (included from /usr/src/linux/include/asm/bitops.h, when on an SMP system) contain\
    \ the basic code for spinlocks.\nYou have the following:\n\n```\nspin_lock(lock);\n\
    \nspin_lock_lock(lock);\n\ncritical section\n\nspin_unlock(lock);\n```\n\n```\n\
    #include <bitops.h>\n\nvoid set_bit(int bit, volatile long *addr);\nvoid clear_bit(int\
    \ bit, volatile long *addr);\nvoid change_bit(int bit, volatile long *addr);\n\
    \n test_bit(int bit, volatile long *addr);\nint test_and_set_bit(int bit, volatile\
    \ long *addr);\nint test_and_clear_bit(int bit, volatile long *addr);\nint test_and_clear_bit(int\
    \ bit, volatile long *addr);\n```\n\nThis guarantees that the touching resource\
    \ can't run on more than one processor simultaneously, and that the atomic functions\
    \ should not be used outside of process context (in a non-preemptive kernel).\
    \ however, they may cause deadlocks. (See /usr/src/linux/Documentation/spinlocks.txt\
    \ for some explanation.)\n\nOne wants to suspend, or disable interrupt handler\
    \ at the same time. In this case one does:"
