    # 3.4. PASSING PARAMETERS


    +   * All Linux distributions prescribe methods for the automatic loading of particular
    modules on startup. However, the use of udev in Linux distributions usually obviates
    such.


    +   * Red Hat-based systems use the /etc/rc.modules file which will be (if it
    exists) out of /etc/rc.sysinit. In this file any module can be loaded through
    the use of full module commands.


    +   * On Debian-based systems modules listed in /etc/modules will be loaded. (Only
    the names of the modules go in file, not commands.) In GENTO systems, the name
    role is played by the files in /etc/modules.autoload.d.


    +   * On SUSE-based systems the file that needs to be modified is /etc/sysconfig/kernel.


    depmod


    In order for depmod and modprobe to find modules they must be in prescribed places,
    under /lib/modules. The file /etc/modprobe.conf is consulted every time a module
    is loaded or when depmod is run.


    When modules are built in external directories and installed with the modules_install
    target, they are placed in the extra directory.


    # modprobe


    modprobe can load (or unload with the -r option) a stack of modules that depend
    on each other, and can be used instead of insmod.


    It can be used to try a list of modules, and quit whenever one is first and successfully
    loaded heavily depends on /modprobe.conf.


    Whenever there are new modules added, or if there is a change in location depmod
    should be run.


    The modules package requires use of the .ko extension with insmod, but modprobe
    and rmod require no extension.


    Parameters can be passed to modprobe in the same way they are passed to insmod;
    i.e., you can do something like


    # ismod


    lsmod gives information about all loaded modules. The information given includes
    name, size, count, and a list of referring modules. The content is the same as
    in /proc/modules.


    # insmod


    insmod loads a module into the running kernel, resolving all symbols. The -f option
    will try to force loading a module with a version mismatch between kernel and
    module.

    mod can be used to load parameters into modules. For example:


    ```

    insmod my_net_driver irq-10

    ```


    # rmmod


    rmmod unloads modules from the running kernel. A list of modules may be given
    as in:


    ```

    rmmod my_net_driver _char_driver

    ```


    Note no .ko extension specified.


    # depmod


    depmod creates a Makefile-like dependency file ( /lib/modules/KERNEL-VERSION-NUMBER/modules.dep)
    based on the symbols contained in the modules explicitly mentioned on the command
    line, or in the default path.

    dep avoids the use of modprobe. It is always running under boot. Under circumstances
    it should be run


