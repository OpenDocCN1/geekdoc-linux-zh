  md: '# Chapter 14


    # The proc Filesystem


    ![](img/5f0cab84232061dba742ffc69894b1f1_91_0.png)


    We''ll discuss the proc pseudo-filesystem. We''ll show how to create, read and
    write to entries in this filesystem. Finally we''ll also discuss the seq_file
    interface and how it can be used to make proc filesystem entries.


    +   14.1 What is the proc Filesystem7 . . . . . . . . . . . . . . . . . . 161

    14.2 Creating Entries . . . . . . . . . . . . . . . . . . . . . . . . 162

    14.3 Reading Entries . . . . . . . . . . . . . . . . . . . . . . . . 163

    14.4 Writing Entries . . . . . . . . . . . . . . . . . . . . . . . . 164

    14.5 The seq_file Interface . . . . . . . . . . . . . . . . . . . . 165

    14.6 Labs . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 167


    # 14.1 What is the proc Filesystem?


    The proc filesystem is a pseudo-filesystem; it exists only in memory and is mounted
    on an empty /proc directory. Information in the proc filesystem are generated
    only when it is accessed; it is not continually updated.


    Entries in proc can be used to obtain information about the system (and device
    drivers) when read. Writing to entries can set system parameters and modify device
    functionality.'
