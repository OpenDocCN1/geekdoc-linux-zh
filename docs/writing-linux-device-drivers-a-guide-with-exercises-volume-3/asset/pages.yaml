  md: "# CHAPTER 12. RACE CONDITIONS AND SYNCHRONIZATION METHODS\n\n# 12.2. ATOMIC\
    \ OPERATIONS\n\nIf one wants the ability to sleep if the resource is not available\
    \ (to call the scheduler) and have yield the CPU (to another process) one can\
    \ use mutexes (for which the basic operations are atomic lock() and unlock())\
    \ or semaphores (for which the basic operations are up() and down()). Whenever\
    \ possible mutexes should be used rather than semaphores in case\n\nOne should\
    \ note:\n\n+   - Can use mutex() and down() only in process context; mutex_lock()\
    \ should not be used from an interrupt context, while the up() functions can be\
    \ used at any time.\n- The mutex_lock() and down() functions can sleep. The sleep\
    \ may or not be interrupted by signals, depending on the form they are used.\n\
    - Interrupts are not suspended by these functions.\n\n+   - Like spinlocks, the\
    \ semaphore functions also have supplemental read and write forms for the case\
    \ in which one wants to permit simultaneous readers when writing is relatively\
    \ rare.\n\n# 12.1 Concurrency and Synchronization Methods\n\nKernel execution\
    \ is asynchronous and unpredictable, interrupts occur at any time, system calls\
    \ can be entered from many different processes, and kernel threads of execution\
    \ will also access the CPUs.\n\nMany resources can be modified in one process\
    \ while being used. In some cases the code may be distinct, while in others the\
    \ same code is executed concurrently or more simultaneously. Either way data corruption\
    \ is a danger as are potential race conditions causing deadlock.\n\nSuch concurrency\
    \ can be of two types:\n\n+   - True concurrency occurs on SMP systems, when two\
    \ threads of execution on different processes simultaneously access a resource.\n\
    \n+   - Pseudo-concurrency occurs even on single processor systems, when one thread\
    \ is preempted or interrupted and another accesses an open resource.\n\nA variety\
    \ of mechanisms can be used to ensure integrity of shared resources; let's consider\
    \ the various in order of increasing overhead.\n\nThe simplest method is to use\
    \ atomic functions, which work on specially typed types that are essentially integers\
    \ or use the use of atomic bit operations. Atomic functions:\n\n+   - Execute\
    \ in one single instruction; they can not be interrupted in mid-stream, and if\
    \ two operations are requested simultaneously must complete before the second\
    \ one proceeds.\n\n+   - Can be used either in or out of process context.\n\n\
    +   - Can never go to sleep.\n\n+   - Do not suspend interrupts while executing.\n\
    \nIf more than one needs to be protected, one can use spinlocks, which get their\
    \ name because if one attempts to take a spinlock which is already held, the code\
    \ will spin; ie, do a wait until the lock is released. The spinlock:\n\n+   -\
    \ Can be used in interrupt or out of process context, but if used, the forms that\
    \ temporarily block interrupts should be used when the same spinlock is referenced\
    \ in process context.\n\n+   - Can not block to go to sleep; ie., another process\
    \ cannot be scheduled.\n\n+   - Can suspend interrupts while being held.\n\n+\
    \   - Have supplemental read and write forms for the case in which one wants to\
    \ permit simultaneous readers, and writes are relatively rare.\n\nAs an alternative,\
    \ completion functions can be used in place of semaphores in the case where contention\
    \ is expected to be.\n\nThe kernel also uses the seql mechanism, when one has\
    \ to read a value which is rarely changed, and when speed is essential.\n\nAnother\
    \ method for synchronization is RCU (Read-Copy-Update), which can lead to great\
    \ performance boosts.\n\nExactly which method we depends on:\n\n+   - Contention\
    \ is expected to be high or low.\n\n+   - Whether one is in or out of process\
    \ context.\n\n+   - How many operations are to be performed when the lock is held.\n\
    \n+   - Whether sleeping is possible.\n\n+   - How often the lock needs to be\
    \ taken.\n\nFor frequent operations, one would generally pick the one with the\
    \ lowest overhead which fits the other requirements.\n\n# 12.2 Atomic Operations\n\
    \nAtomic functions (many of which are atomic) count as one instruction and work\
    \ on a variable of type atomic_t, which is a structure defined as\n\n```\ntypedef\
    \ struct {\n volatile int counter;\n } atomic_t;\n```\n\n![](img/5f0cab84232061dba742ffc69894b1f1_80_0.png)"
