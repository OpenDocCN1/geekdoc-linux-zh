    # 8.8 Installing an Interrupt Handler


    Normally drivers do not directly access the data structures we just described.
    Instead they use the following functions to install and uninstall interrupt handlers:


    handler points to the interrupt service routine, or handler, that is triggered
    when the interrupt occurs.


    We''ll discuss the arguments later.


    flags is one of the following values:


    #include <irq.h>


    ```

    request_irq(unsigned int irq,

