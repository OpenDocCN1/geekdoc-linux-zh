    # Preface


    ![](img/5f0cab84232061dba742ffc69894b1f1_8_0.png)


    # Objectives


    Writing Linux Device Drivers is designed to show experienced programmers how to
    develop device drivers for Linux systems, and give them a basic understanding
    and familiarity with the Linux kernel.


    Upon mastering this material, you will be familiar with the different kinds of
    device drivers used under Linux, and know the appropriate API''s through which
    devices (both hard and soft) interface with the kernel.


    We will learn primarily on Device Drivers and only occasionally on the Linux kernel.
    These are impossible to separate, since device drivers are an integral part of
    the kernel. However, most drivers use only a limited set of kernel functions and
    need not learn everything about the kernel to do a device driver. While device
    drivers do not control kernel features such as scheduling or memory management,
    the more you know how Linux handles things the better a driver you can.


    In many other operating systems, which are closed source, there is a clearer separation
    between a device driver and the kernel proper. Because Linux is open source, the
    device driver developer has full access to all of the kernel. This is both powerful
    and dangerous.


    While we will discuss kernel internals and algorithms we detail only the functions
    which are normally used in device drivers. More details on things such as scheduling,
    memory management, etc., belong more properly in a higher level treatment (or
    lower level depending on how you define things.)'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# PREFACE


    Developing devices is a big object in depth (from deep inside the kernel to usage
    user-space) and in breadth (the many types of devices). In order to keep things
    manageable we will to limit our reach both vertically and horizontally.


    This means we won''t look deep into the inner plumbing as it relates to devices.
    And for particular types of devices we will stop before we get to detailed aspects
    of how they interface with hardware. It also means we are going to ignore whole
    classes of devices, such as SCSI and whatsoever, as any treatments of these devices
    would rapidly become both huge and stupid.


    Our presentation is not axiomatic; ie, we will have some forward references and
    directions. We prefer putting you into coding as quickly as possible. We will
    tell you early on how dynamically allocate memory in the simplest way, so you
    can actually code, and then later cover the subject more thoroughly. Furthermore
    the order of lectures is subjective, so feel free to move according to your interests.


    # Who You Are


    You are interested in how to write devices for the Linux operating system. Maybe
    you are just doing this for fun, but you have this task as part of your job. The
    purpose here is to help you and perhaps shorten the amount of time it takes to
    reach a level of competence in this.


    How much you get out of this and how bug-free, and optimized your devices will
    be depending on how good a programmer you were before you started this project.
    There is no space or time to teach you the essentials of programming or the Linux
    operating system design in great detail.


    There are two reasons for this:


    +   - First, there is no shortage of books and classes on programming methods.
    For the Linux kernel the choices are fewer, but yet we will mention some of them
    at appropriate times.

    - Second, my knowledge is not as deep as those who have contributed greatly to
    the development of Linux, and programming is not my strength. I noted personal
    contributions to the kernel code base have been very minor. I''ll explain why
    I''ve produced this material despite these facts.


    You should:


    +   - Be proficient in the C programming language.

    - Be familiar with Linux (Unix) utilities, such as ls, rm, grep, tar, and have
    a familiarity with command shells and scripts.

    - Be comfortable using any of the available tools and editors (e.g., emacs).

    - Know the basics of compiling and linking programs, Makefiles etc.; i.e., be
    comfortable doing developing in a Linux or Unix environment.

    - Have a good understanding of systems programming in a Unix or Linux environment,
    at least want


    • Experience with any Linux distribution is helpful but not strictly required.


    If you have some experience configuring and compiling kernels, and writing kernel
    modules or device drivers, you will get much more out of this.


    If you have a good experience of operating system fundamentals and familiarity
    with the insides of any other operating system, you will gain much more from this.


    While our may not be advanced, we will strive to be clear and complete. It is
    worth repeating that we are not meant for an expert audience, but instead for
    a committed and motivated one.


    # My History and Why I''m Doing This


    By training a manner, I have a PhD in theoretical astrophysics and I did research
    on dense matter, neutron stars, neutrino physics, shockwaves, general relativity,
    for decades. I published papers, reviews and book chapters in the main physics
    and astrophysics journals. I was on the faculty at many universities.


    I have been teaching one thing or another for more than 30 years. I''ve taught
    advanced as well undergraduate courses on a variety of subjects in astrophysics
    and astronomy at both undergraduate and graduate level and I supervised a good
    number of master students. I''ve been teaching about the present subject matter
    for many years.


    So you may be wondering how I got the chance to prepare a book of this? The answer
    is I stumbled into it. I was working as a hardware engineer for years when Linux
    was non-very.


    I used programmed for computers. The first time I used C was on a DEC PDP-9 and
    the keyboard was an actual technique with boeking down paper tapes. I used various
    operating systems and programming language that have changed over these years
    and I''ve been able to forget about most of them.


    Except for some late acquisition in my early student days, all my computer-related
    working during my career was as a physicist. The main projects involved large
    scale simulations of evolving stars, with the numerical and graphical analysis
    required.


    In 1994 I learned how to build the world. I spent the next 5 years as a consultant
    with a major geophysical company, helping the use of geology and seismic analysis
    used for oil exploration and recovery. Equations represent what they describe
    coding geology, exploration, or seismic waves through layers of the earth.


    During this period I began to use Linux systems as the platform that I could use
    to develop and debug code which could then run on large computer platforms. The
    end of this period was when I started moving to Linux clusters as a better way
    to get for the bang


    In 1998 my company was devoured by a larger one and its technology division decimated.
    Oil was selling for less than $12 a barrel at the time and the corporate wisdom
    was that research and development was not important.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'At the same time a junior chef manufactured our employer and asked us to develop
    materials to train a bunch of NT engineers to work with Linux. We found ourselves
    essentially a couple of years before they had asked us to I was tasked with developing
    materials and I have been doing it ever since.


    Every project we gave two main classes. One was on systems programming, a second
    on Linux drivers. My acquaintance, Alexis, found and deployed these classes. We
    then translated the material, with some modifications, to be used by various distributors.
    In particular, these classes were used for about three years as their curriculum
    for Linux.


    Over that period I did a number of engineering projects, mostly involving drivers
    and developing specialized Linux platforms. But I spent the lion of my time teaching
    and preparing courses.


    Over ten years I personally taught tens of classes at least 100 times and also
    helped to maintain the material and contact for the many other instructors who
    taught from this material world-wide, who contributed in a major way to my ongoing
    improvement.


    Great efforts were made to keep the material up to date, as the Linux kernel moves
    rather quickly. New editions were published four times a year, gradually keeping
    pace with the new.


    Over the years many insisted that the course material be obtainable in bookstores
    or by mail. It was not possible to publish the courses because of contractual
    restrictions, it was only possible to obtain it by email, a relatively expensive
    process.


    In the 2008-Asian hot crash I myself left Alexis''s staff. With Alexis in charge,
    we managed to rework the material and publish it.


    And that is how we got here. This is not just a review of the courses that we
