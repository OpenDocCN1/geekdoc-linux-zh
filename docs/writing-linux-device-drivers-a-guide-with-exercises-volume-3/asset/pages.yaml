  md: "# CHAPTER 11. TIMING AND TIMERS\n\n# 11.2 TIME STAMP COUNTER\n\nBefore kernel\
    \ 2.6.2 jiffies was a counter that is incremented with every timer interrupt.\
    \ However, with the incorporation of tickless kernels one not need to keep interrupts\
    \ running when the system is idle (For full details, see http://www.linux.org/projects/tickless).\n\
    \nThe default frequency is 100 Hz on x86, which is configurable at any time, range\
    \ from 10 to 1000. Thus we obtain a resolution of 1 to 10 milliseconds for the\
    \ jiffies value.\n\nWith jiffies=1000 it will overflow (and wrap) after 50 days\
    \ of uptime; if someone has been asleep, what happens is not predictable. If you\
    \ are writing driver code it is unlikely to be an issue.\n\nTo avoid any potential\
    \ problems, the jiffies value is set boot during INITIAL_JIFFIES = 300, which\
    \ after five minutes takes effect. As a side effect you might notice that the\
    \ value of jiffies differs from the number of interrupts read from /proc/interrupts\
    \ by the system (Tickless kernels also keep this equality).\n\nUseful to compare\
