    ```\n#include <linux/mmap.h>\n```\n\n```\nint get_user_pages(struct task_struct\
    \ *tsk,\n\tmm_struct *mm,\n\tunsigned long start,\n\tint len,\n\\int flags,\n\t\
    struct page **pages,\n\tstruct_area_struct **vmas);\n```\n\nThe first two arguments\
    \ are the process and user address space info; usually they are current and currentmm.\n\
    \nThe start argument gives the address of the user-space buffer of len pages (not\
