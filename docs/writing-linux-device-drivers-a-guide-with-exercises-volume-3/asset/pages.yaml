    \ great caution. However, you will now have to check if a signal arrived if you\
    \ use this form, you will have your code like\n\n+   - Historically, semaphores\
    \ have been used more than mutexes because they can have more than one owner at\
    \ a time.\n- A semaphore may be more difficult to debug than a mutex in that it\
    \ can have more than one owner at time.\n- Any new code should use mutexes unless\
    \ the counting of semaphores is really needed. The migration of existing semaphores\
    \ to mutexes is gradually and carefully\n\n```\nif (interruptible($sem)) return\
    \ -ESTARTS\n```\n\nells the system to retry the call or return -EINTR to the application;\
    \ which depends on how the semaphore is set.\n\nThe (down_lock) function checks\
