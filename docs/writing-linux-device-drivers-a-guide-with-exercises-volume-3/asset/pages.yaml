    +   - An open-source glue layer, which calls into the binary blob as well as the
    kernel API.


    User-space drivers, as the video drivers incorporated into X.Org (http://www.x.org),
    work completely in user-space, also use privileges to directly address hardware.
    They use ioperm() and iopl() functions to accomplish this, which we discuss when
    we discuss reading and writing to 1/O ports.


    ![](img/5f0cab84232061dba742ffc69894b1f1_18_6.png)


    ![](img/5f0cab84232061dba742ffc69894b1f1_18_7.png)


    ![](img/5f0cab84232061dba742ffc69894b1f1_18_8.png)


    # 2.2 Mechanism vs. Policy


    Device drivers should maintain a clear distinction between mechanism and policy.


    By mechanism, we mean flexibly the abilities that the device itself can amply
    perform. By policy, we mean controlling how those capabilities are used.


    In other words it is not up to the driver to enforce decisions (unless there is
    a hardware limitation) such as:


    +   - How many processes use the device at once.

    - Whether I/O is blocking or non-blocking, synchronous or asynchronous, etc.

    - Whether combinations of parameters can never occur if they are unwise.


    Figure 2.3: Using binary blobs in drivers


    Other examples of this method are used by Nvidia graphics drivers, ndiswrapper
    wireless and NIC drivers, and various filesystem drivers.


    With this method the driver can contain in the binary blob whatever has been ported
    from another operating system, or whatever code is wished to remain private; the
    first reason is most likely that Linux lacking the support is definitely not.


    When such a driver is loaded the kernel binary contained means it is impossible
    to debug properly because there is no source available for all the running code.


    We strongly disapprove this method for reason, but two are sufficient:


    A common driver may use a user-space control program, or daemon, which has the
    capability of controlling policy. As it should provide of settings and parameters
    behaviour, through /dev or /sys.


    +   - Loading binary code into the kernel is a recipe for disaster.

    - Manufacturers make this Linux support and don''t support the development of
    genome open-source drivers.


    A driver which fails to distinguish between mechanism and policy is a driver destined
    for trouble. ''Tomorrow may have many different choices than was made today.''
    One should never underestimate the likelihood of a user behaving in an unexpected
    fashion.


    Thus, we won''t teach this method and we discourage the use of such drivers, less
    less their development.


    # 2.3 Avoiding Binary Blobs


    There is a method of deploying a Linux device driver which has been promoted by
    certain vendors, with we strongly disagree.


    The essence of this method is separate the driver into two parts:


    +   - A binary blob, for which the source is not. This blob may contain all or
    part of the driver from another operating system (usually from you-know-who).

    - Use of firmware is not the same as the methods described above. This firmware
    is data that could have been put in the kernel, but vendors find it easier to
    have the operating system lock. Use of firmware does not causing taint.

    - The line between firmware and binary blobs is gray, and there Linux distributions
    which have problems distributing drivers with require binary firmware, or which
    don'' distribute the binary firmware itself.'
