    \ Directly to User\n\nHigh-bandwidth hardware (e.g., a video camera) can obtain\
    \ lots of speed-up by going straight to the user; i.e., using DMA to get the data\
    \ into kernel-space and transferring them to user space. If one wants to use the\
    \ pages by hand it is tricky; the steps are:\n\nThe allocation function returns\
    \ a virtual address for the buffer, handle size. The third argument points to\
    \ an address on the bus (which is meant to be consistent). The flag argument controls\
    \ how the memory is allocated, and is usually GFP_KERNEL or GFP_ATOMIC if SLEEPING\
    \ is not allowed unless in context. If the request requires it, DMA memory can\
    \ also be freed with dma_free_coherent() which requires asynchronous freeing.\n\
    \n+   - Lock the user pages.\n\n+   - Set up a DMA transfer for each page.\n\n\
    +   - When the DMA is done, unlock the pages.\n\nMemory regions aligned with dma_alloc_coherent()\
    \ are used for called Coherent DMA mappings, which can be accessed as synchronous\
    \ or continuous. These have the following properties:\n\nIf these steps seem familiar,\
    \ it is because they are essentially what the get_user_pages() API does for you;\
    \ you will course have to do the DMA transfers properly.\n\n+   - The buffer can\
    \ be accessed by both the CPU and the device.\n\n+   - A write by either the CPU\
    \ can be immediately read by either, without without cache problems, or flushing\
    \ (however, you may still need to use various memory barriers, as the CPU may\
    \ require I/O operations to maintain consistent memory as it does)\n\n# 23.5 DMA\
    \ under PCI\n\n+   - The minimum allocation is a page. In fact x86 always has\
