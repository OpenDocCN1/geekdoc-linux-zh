  md: '# 6.3 Scheduling Algorithms and Task Structures


    Scheduling is among the most important work the kernel does. The main code for
    this is in /usr/src/linux/include/sched.h and /usr/src/linux/sched.c.


    Tasks switch back and forth between kernel mode and user mode (when they have
    lower priority). The kernel doesn''t control these modes, but it has to handle
    the context switching between them.


    Under Linux, a task by cannot preempt a running task and take over; it must wait
    for its time-slice to expire. However, the scheduler can preempt one task to allow
    another.


    Tasks run until one of the following occurs:


    +   - We need for some system event to complete (like reading a file).

    - The amount of time in their time-slice expires.

    - The scheduler is invoked and finds more task scheduling.


    Additionally, the 2.6 kernel has compile-time options for a preemptible kernel;
    when configured the kernel can behave like a multi-processor system, lower latency,
    and preemptive code when it is enabled. This means that the kernel must be fully
    reentrant.


    A task_struct is the critical data structure under Linux and contains all information
    about a task about, and how it runs. It is called a process descriptor. It is
    defined in /usr/src/linux/include/sched.h.


    The data structure of a task (on the kernel) contains the task ID, e.g., current_pid.
    Since a multi-threaded task shares the same PID but has a unique ID (thread ID),
    this data structure contains additional information about signal handling, memory
    used by the threads.


    While the tasks (or more precisely, threads) that run in either kernel or user
    space are identified by pointers to a task_struct, not by a pid. For kernels earlier
    than 2.6.24 one can obtain a pointer from a pid with


    ```

    struct task_struct *find_task_by_pid(int pid);

    ```


    (In a multi-threaded process, this macro will lock the master thread, while process
    and thread identifier match). However, later kernels do not export this macro
    to modules and one can use nested mutexes instead:


    ```

    struct task_struct *pt = find_task_by_pid(pid); PID_TID(pt);

    ```


    One generally might need to obtain this information from a module and race conditions
    can be a problem as pid can change the lifetime of a process.


    While the schedule() function may be called directly (from kernel, it is more
    likely reached through an interrupt call); such when the current task goes to
    sleep and for


    # 6.4 PROCESS CONTEXT


    into a wait queue; when a system call returns; before a task returns to user from
    kernel; after an interrupt is


    The scheduler decides which task should occupy the CPU, and if it is different
    it changes the context. It tries to keep tasks on the same CPU (to minimize cache
    misses). When a new task is chosen to run, the state of the current task is saved
    in its task_struct and the new task is switched in and made the current one.


    The scheduler before the 2.6.3 kernel used the O(1) scheduler; the time required
    to schedule a task was independent of the number of running tasks. It was designed
    to scale well with SMP systems. For each CPU, tasks were kept in a priority-ordered
    fashion, so without having to search through all the tasks to run, the kernel
    could be made a quick bit-map consultation.


    The 2.6.3 kernel replaced the O(1) scheduler with an entirely new algorithm, which
    is the CFS (Completely Fair Scheduler) scheduler.


    The fairness is the amount of time the task has been run, divided by the number
    of running tasks (with weighting for priorities). This time is compared with the
    activity the task has received to determine the next task.


    CFS also includes architectural modules, each of which can be called in turn.


    When the kernel executes it has full process context, and is obviously in kernel
    mode. There are two different contexts it can be:


    +   - An application (or thread) has issued a read() or write() request, on a
    special device file, such as a serial port, or on a normal interface on hardware
    to which the kernel has access to.

    - A request has been made from user-space. Only when the kernel can handle such
    a request.

    - A user has made a system call getpriority() to examine, or its priority, or
    getpid() to find out its process ID.


    In process context the kernel is executing on behalf of a particular user process.
    Examples would be:


    +   - The kernel is servicing an interrupt. It requests to do so on answering
    to an IRQ line, usually in for or four interrupts. It is up to the kernel to decide
    what process may receive the data and it may have to wake up the process it.'
