    +   * 33.1 What is Asynchronous I/O? ... 345

    * 33.2 The Posix Asynchronous I/O API ... 346

    * 33.3 Linux Implementation ... 347

    * 33.4 Labs ... 348


    # 33.1 What is Asynchronous I/O?


    Normal all I/O operations are performed synchronously; an application will block
    until the read or write is completed, successfully or unsuccessfully.


    Note that this doesn''t mean all writes will be buffered to disk memory, interaction
    with the virtual file system has been completed.


    But if I/O requests are queued up, and program execution continued in parallel
    with the I/O requests? This can be particularly useful on SMP systems and using
    DMA, which does not involve the CPU. When this is done, it is called asynchronous
    I/O, or AIO.'
