    # Making a Kernel Patch


    A patch is a file that contains the differences between your modified source and
    the baseline source. It is used with the diff program and applied with the patch
    utility. Making a kernel patch is tricky; do it properly so that you can use it
    easily later time.


    To produce a patch, suppose the original source is in `/usr/src/linux` and suppose
    your modified source is in `/usr/src/linux2`. You can produce the patch with the
    command:


    ```

    cd /usr/src

    diff linux_hacked hacked_patch

    ```


    where the -u option specifies unified format, the -r option allows to recur through
    directories, and the -o option may copy files present in one tree and not the
    other.


    You can then distribute it to anyone who has the original source and they can
    apply the patch simply by doing:


    ```

    cd /usr/src

    patch -p1 < hacked_patch

    ```


    However, for this to work properly you must be careful, considering the following
    points:


    +   * The original source (under `/usr/src/linux`) should be pristine as it was
    when first unpacked. In any accompanying documentation you should state exactly
    which source you are patching. It is important to make a patch of a distribution-specific
    source, but clearly give the name and purpose of the source you use. If this is
    for the kernel mailing list, use only authentic unpacked source from `http://www.kernel.org`


    # 7.5. SPARSE


    +   * Your source should be cleaned up before producing the patch, perhaps using
    make appropr. Files that have actually changed should be included, and any changes
    in items such as space should be eliminated.


    The above procedure is complete enough, but it can be time consuming as it requires
    the kernel source if there are just a few changes, and it might require keeping
    up to 3 or 4 versions of the source code.


    One trick is to make links instead of copies of the parts of the kernel that are
    not changed, the originals, and diff will go very fast. To do this you would:


    ```

    cd /usr/src

    cp -al linux_work

    ```


    Then you want to use only that kernel, kernel/sys.c. You would do:


    ```

    cd linux_work

    rm sys.c

    cp /usr/src/linux/sys.c

    ```


    Removing the file removes only the link in the current directory, not the original
    file. Now you have directories that are linked together, for the one file that
    you are going to work on, and the diff will be very fast! (Note that the diff
    and cp steps are unnecessary when you use some text editors, which can apply the
    patch directly; however, with many files it is necessary.)


    For a detail of the export format for patches to the kernel mailing list, see
    at `http://www.kernel.org/patch-format.html`, `http://www.alm.com.au/akpn/patches/stuff/ppp.txt`,
    and `linux/Documentation/SubmittingPatches`


    Before submitting a patch you should run the `/usr/src/linux/checkpatch.pl` in
    it and clean up any warnings and errors that result.


