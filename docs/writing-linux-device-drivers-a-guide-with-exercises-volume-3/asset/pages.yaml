  md: "# CHAPTER 11. TIMING AND TIMERS\n\n# 11.9. LABS\n\n# Labs\n\nThe function htimer_cancel()\
    \ will wait until the timer is no longer running on any CPU, returning 0 if the\
    \ timer has expired and 1 if it was successfully cancelled. The htimer_try_cancel()\
    \ function differs by failing if the timer is currently running, and returning\
    \ -1 in that case; it can be restarted by calling htimer_restart().\n\nThe remaining\
    \ functions return the time before expiration, whether the timer is currently\
    \ on the queue, or the clock resolution in nanoseconds.\n\nWrite a driver that\
    \ launches a timer whenever a write() to the device places.\nPass data to the\
    \ driver and have it print.\nHave it print the current->pid field when the timer\
    \ is scheduled, and then again when the function is executed.\n\nHere's an example\
    \ of high resolution timer code:\n\n```\n#include <linux/module.h>\n#include <linux/htimer.h>\n\
    #include <linux/sched.h>\n#include <linux/version.h>\n#include <linux/ktime.h>\n\
    #include <linux/hrtimer.h>\n\nstruct timer_data {\n    struct hrtimer timer;\n\
    \    ktime_t period;\n};\n\nstatic enum hrtimer_restart_t htimer_var(struct hrtimer\
    \ *v) {\n    ktime_t now = ktime_get_time();\n    printk(KERN_INFO, \"%d running\
    \ at %ll jiffies\\n\", current->pid, jiffies);\n    htimer_forward(v, v->period);\n\
    \    return HTIMER_RESTART;\n}\n\nstatic int init_timer(void) {\n    struct timer_data\
    \ *data = kmalloc(sizeof(*data), GFP_KERNEL);\n    data->period = ktime_set(0,\
    \ 1); /* short period, 1 second */\n    htimer_init(&data->timer, CLOCK_REALTIME,\
    \ HRTIMER_MODE_REL);\n    data->timer.function = &htimer_var;\n    htimer_start(&data->timer,\
    \ data->period, 0);\n    return 0;\n}\n\nstatic void exit_timer(void) {\n    htimer_cancel(&data->timer);\n\
    \    kfree(data);\n}\n\nmodule_init(init_timer);\nmodule_exit(exit_timer);\nMODULE_LICENSE(\"\
    GPL, v2\");\n```\n\n# Lab 2: Multiple Timers\n\nMake the period in the first loop\
    \ long enough so you can issue multiple writes before the timer function runs.\n\
    (Hint: you may want to set your data before running this lab)\nHow many times\
    \ does the function go run?\nFix the solution so multiple timers work properly.\n\
    \n# Lab 3: Periodic Kernel Timers\n\nWrite a module that launches a periodic kernel\
    \ function; i.e., it should re-install itself.\nOne periodic sequence should be\
    \ for less than 256 ticks (as it fails in the tv vector), and the other should\
    \ be less than 16 K ticks (as it fails in the tv vector).\nEach time the function\
    \ executes, print the total elapsed since the module loaded (in jiffies)\nFor\
    \ one of the functions, also read the TSC and calibrate with the CPU frequency\
    \ (as read from /proc/cpu_zc variable) to print the elapsed time (hopefully) more\
    \ accurately.\n\n# Lab 5: High Resolution Timers\n\nDo the same things as in the\
    \ previous exercise, setting up two periodic timers, but this time use the hrt\
    \ interface.\n\n# Lab 6: Usingprobes to get statistics\n\nUsing kprobe, find out\
    \ how often kernel timers are deleted before they run."
