    # 32.1 What is Frequency and Voltage Scaling?


    Frequency scaling permits dynamic adjustments to a CPU''s clock speed (and voltage)
    according to system load.


    The goal is to lower power consumption and heat generation; in case of laptops
    this extends battery life and in case of desktops and servers can prolong hardware
    life, lower electric bills and cooling needs, and along the way help save the
    planet.'
