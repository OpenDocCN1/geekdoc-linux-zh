  md: "# CHAPTER 22. PCI\n\n# 22.4. ACCESSING CONFIGURATION SPACE\n\nThe kernel contains\
    \ excellent manual on writing PCI device drivers in the file\n/usr/src/linux/Documentation/pci.txt.\n\
    \nRemember after finding the device, before doing anything with it, you will need\
    \ to call the function\npci_enable_device(struct pci_dev *pci_dev) in order to\
    \ enable it.\n\n+   * A PCI device may of many different kinds, such as a network,\
    \ character, or block\ndevice. In registering it as a PCI device, it will also\
    \ have to register as the particular kind of device it is.\n* This is normally\
    \ done in the probe() callback function, where one would call functions\nas register_meter(dev),\
    \ etc.\n* Likewise, the shutdown() callback function would deregister the device\
    \ with functions\nas unregister_meter(dev).\n\nExample:\n\nTo locate and enable\
    \ particular device:\n\n```\n#include <linux/pci.h>\n\nstruct pci_dev *pdev =\
    \ NULL;\n\nif (pdev = pci_get_device(PCI_VENDOR_ID_INTERG, PCI_DEVICE_ID_INTERG_162,2))\
    \ {\n\treturn -ENOMEM;\n}\npci_enable_device(pdev);\n```\n\nIf desired, the function\n\
    \n```\nchar *pci_name(struct pci_dev *pdev);\n```\n\ncan be called to get the\
    \ bus, device and function number. It does not do this by parsing hardware,\n\
    but by traversing the known list of present devices.\n\nOne can use the macro:\n\
    \n```\nstruct pci_dev *pdev;\nfor_each_pci_dev(pdev, dev) { ... };\n```\n\nto\
    \ step through all pci devices.\n\n# 22.3 PCI Structures and Functions\n\nThe\
    \ header file <usr/src/linux/include/pci.h> defines symbolic names for numeric\
    \ values\nused by PCI functions, for register locations and values. The file /usr/src/linux/include/\n\
