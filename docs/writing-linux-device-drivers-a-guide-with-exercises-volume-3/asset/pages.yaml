    void wait_for_completion(struct completion *c)\nvoid wait_for_completion_interruptible(struct\
    \ completion *c)\nvoid complete(struct completion *c)\nvoid complete_and_exit(struct\
    \ completion *c, long long timeout);\n```\n\nunsigned long wait_for_completion_timeout(struct\
    \ completion *c, long long timeout)\nunsigned long wait_for_completion_interruptible(struct\
    \ completion *c, long long timeout);\n\nThe version with timeout in their name\
    \ will return a wake up if the expiration period is reached without one. Both\
    \ these and the non-interruptible forms have non-void return values and need to\
    \ be checked.\n\nThe completion structure can be initialized in one of two ways:\n\
    \n```\nDECLARE_COMPLETION(x);\nstruct completion x;\ninit_completion(&x);\n```\n\
    \nThe complete_and_exit function returns success if successful, takes an additional\
    \ argument code, which is the exit code for the kernel thread finishing. Obviously,\
    \ this function should only be used in cases such as terminating a background\
    \ thread, or it will kill whatever it is doing.\n\nThe correspondence with semaphores\
    \ is very simple: there is one to one mapping between the methods:\n\n```\nstruct\
    \ semaphore\nsem_init(&s);\ndown(&s)\nwait_for_completion(&s)\ncomplete(&s);\n\
    ```\n\n![](img/5f0cab84232061dba742ffc69894b1f1_85_0.png)\n\n# 12.8 Completion\
    \ Functions\n\n+   * As kernel 2.6.26 effort to remove as many semaphores as possible\
    \ has accelerated.\n* It is possible they be removed altogether at some point,\
