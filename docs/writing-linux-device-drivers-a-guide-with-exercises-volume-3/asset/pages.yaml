    MY_IOCTL = _IOC(''k'', 1, struct my_data_structure);

    ```


    +   - Set the process ID to which signals should be sent.

    - Set the signal which should be sent.

    - Send the signal.


    This won''t work if my_data_structure has been allocated dynamically, as in that
    case sizeof() will return the size of the pointer.


    Decode the ioctl number:


    ```

    _IOC_DIR(cmd)

    _IOC_TYPE(cmd)

    _IOC_NR(cmd)

    _IOC_SIZE(cmd)

    ```


    You''ll also have to develop the sending program.


    +   - If given no arguments it should send SIGKILL to the current process.

    - If given one argument it should set the process ID to send signals to.


    Example:


    ```

    #define MYDRV_RESET IO(MYDRBASE, 1)

    #define MYDRV_STOP IO(MYDRBASE, 2)

    #define MYDRV_READ IO(MYDRBASE, 2, my_data_buffer)

    ```


