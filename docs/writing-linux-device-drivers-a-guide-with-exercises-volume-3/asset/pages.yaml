  md: "# 35.6 Labs\n\n# Lab 1: Building a Block Driver\n\nWrite a basic block driver.\n\
    \nYou'll need to implement at the open() and release() entry points, and include\
    \ a request function.\n\nYou can use 254 for the major device number and select\
    \ a minor device number. For an added exercise try to get the major number dynamically.\
    \ Assuming you are using dev, the node should be automatically created when you\
    \ load the driver; otherwise you will have to actually add the node with mknod.\n\
    \nKeep track of the times the node is used. By permitting multiple requests, or\
    \ exclusive open(), read(), write(), close(). After loading the module you use\
    \ this program to access the node.\n\nNOTE: Make sure you have enough memory to\
    \ handle the disk you create; The solution has 128 MB allocate.\n\n# Lab 2: Read/Write\
    \ Block Driver\n\nExtend the exercise in order to put an ext3 file system (or\
    \ another type) on your device. You can place a filesystem on the device\n\n```\n\
    mkfs.ext3 /dev/mydrive\nmount /dev/mydrive\n```\n\nwhere you give the device name\
    \ and node count. For an additional enhancement, try partitioning the device with\
    \ fdisk. For this you may need an additional ioctl() for HDIOGETZ, and you'll\
    \ have to include: linux/hdreg.h. This list returns a pointer to the following\
    \ structure:\n\n```\nstruct bd_geometry {\n    unsigned char head;\n    unsigned\
    \ char sectors;\n    unsigned short cylinders;\n    unsigned long long;\n};\n\
    ```\n\nRemember the total capacity is (sector size) x (sectors/track) x (cylinders)\
    \ x (heads). You also want to use a value of 4 for the starting sector.\n\n![](img/5f0cab84232061dba742ffc69894b1f1_193_0.png)\n\
    \nThe 2.6.31 kernel introduces changes in the block driver interface, reworking\
    \ the request_queue structure and introducing some new functions. In addition\
    \ to el_next_request() and end_request() no longer appear. Furthermore the function\
    \ block_queue_device_size() has been replaced with block_queue_logical_block_size()\
    \ which has same arguments.\n\nHere is an example of a reworked request function:\n\
    \n```\nstatic void my_request(struct request_queue *rq) {\n    char *ptr;\n  \
    \  int size;\n    unsigned int sectors, sector;\n    printk(KERN_INFO \"entering\
    \ request request\\n\");\n\n    rq = block_fetch_request(rq);\n    while (rq)\
    \ {\n        if (!request_freed(rq)) {\n            printk(KERN_WARNING \"This\
    \ was not a free request, skipping\\n\");\n            goto done;\n        }\n\
    \n        sectors = rq->sectors;\n        sector = rq->sector;\n        ptr =\
    \ *dev_buffer + sector * sector_size;\n        size = rq->sectors * sector_size;\n\
    \n        if ((ptr + size) > (dev_buffer + disk_size)) {\n            printk(KERN_WARNING\
    \ \"tried to go past end of device\\n\");\n            goto done;\n        }\n\
    \n        if (request_data_dir(rq)) {\n            printk(KERN_INFO \"writing\
    \ at sector %lu, %lu sectors\\n\", rq->sector, rq->sectors);\n            memcpy(ptr,\
    \ rq->buffer, size);\n        } else {\n            printk(KERN_INFO \"reading\
    \ at sector %lu, %lu sectors\\n\", rq->sector, rq->sectors);\n            memcpy(rq->buffer,\
    \ ptr, size);\n        }\n        rq = block_fetch_request(rq);\n    }\ndone:\n\
    }\n\ndone:\nprintk(KERN_INFO \"leaving request\\n\");\n\n```"
