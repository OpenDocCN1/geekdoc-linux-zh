    Transfers data from kernel space to user space.

    Same as the _get_user() functions, the exception is reversed; Writes expr data
    to user space at ptr.

    Calls access_ok() internally.


    It is desirable to bypass the buffer and page caches entirely, and have I/O operations
    perform directly to the device in raw form. This eliminates one copy operation.
    Large data applications often use such raw I/O operations.


    # copy_from_user()


