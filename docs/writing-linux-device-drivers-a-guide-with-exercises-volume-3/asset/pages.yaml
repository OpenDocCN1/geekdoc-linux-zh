    a\" (low), \"d\" (high))\"\n#define rdtsc(low) __asm__ __volatile(\"rdtsc : \"\
    a\" (low))\"\n#define rdtsc(high) __asm__ __volatile(\"rdtsc : \"d\" (high))\"\
    )\n```\n\nThese macros can also be used from user-space; make comply with optimization.\n\
    \nThe TSC is used to drift and coordination problems in multi-CPU systems and\
    \ better clock sources exists. In particular relevant case a HPET (High Precision\
    \ Event Timer) is capable of"
