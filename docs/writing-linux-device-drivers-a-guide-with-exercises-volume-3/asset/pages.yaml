    \nMODULE_AUTHOR(\"Jerry Cooperstein\\nMODULE_DESCRIPTION(\"MODULE_ DESCRIPTION_NAME\"\
    )\nMODULE_LICENSE(\"GPL v2\")\n```\n\n# 18.9 Relay Channels\n\nOne often comes\
    \ with the need to transfer information between kernel-space and user-space, but\
    \ not all needs are the same. One may need bi-directionality, efficiency, or promises.\
    \ Or one may be working with a few device, and have large or small amounts of\
    \ data.\n\nThe Relay Interface (formerly known as relays) provides a simple mechanism\
    \ to use that works beautifully when the direction is one: from kernel to user\n\
    \nKernel fills chan buffers with no special constraints on the data format. Users\
    \ get access to the data through system calls (read or mmap()), mapped files (default\
    \ for each channel) that are treated like normal pipes.\n\nFor each relay channel,\
    \ there is one buffer per CPU. In each buffer, there has one or more sub-buffers.\n\
    \nWhen a sub-buffer is full to fit a new chunk of data, the next buffer (if available)\
    \ is used, messages move between sub-buffers (as a message should not be larger\
    \ than a sub-buffer). The kernel can map the sub-buffer to user-space, but only\
    \ when the entire buffer is full.\n\nThe buffer can be set in either overwrite\
    \ or non-overwrite mode (the default); in non-overwrite mode, kernel clients will\
    \ block until readers empty the buffer.\n\nWhen the user-space accesses the data\
    \ with read(), any padding at the end of (including all buffer) must be handled\
    \ and no draining occurs. This is more efficient than just reading, but also more\
    \ complex.\n\nHere's a list of the systems that can be used on a relay channel:\n\
    \n```\n#static dev_t first;\nstatic int registered = 1;\nstatic int my_major =\
    \ 700, count = 0;\nstatic struct cdev cdev_way;\n\nstatic int my_mmap(struct file\
    \ *file, struct vm_area_struct *vma)\n{\n    printk(KERN_INFO \"I entered the\
    \ mmap function:%s\\n\", vma->name);\n    if (remap_pfn_range(vma->vm_area, vma->vm_start,\
    \ vma->vm_end - vma->vm_start, vma->vm_len, vma->vm_prot))\n{\n        return\
    \ -EAGAIN;\n    }\n    return 0;\n}\n```\n\n```\n// not bother open, release,\
    \ read and write */\nstatic struct file_operations my_cdev_fops = {\n    .owner\
    \ = THIS_MODULE,\n    .mmap = my_mmap,\n};\n\nstatic int __init my_init(void)\n\
    {\n    first = register_chrdev(my_major, count, my_cdev_fops);\n    if (first\
    \ < 0) return first;\n    cdev_alloc(&cdev_way);\n    cdev_init(&cdev_way, &my_cdev_fops);\n\
    \    cdev_add(&cdev_way, first, count);\n    printk(KERN_INFO \"undevice in registering\
    \ character device %s\\n\", my_name);\n    return 0;\n}\n```\n\n+   - open():\
    \ open and close an existing buffer. If no process runs, kernel client is still\
    \ using, the channel is freed until counting.\n- read(): consumes data from the\
    \ buffer. In non-overwrite mode it is fine if kernel clients are writing sequentially,\
    \ but in overwrite mode unpredictable outcomes occur. Sub-buffer padding is not\
    \ needed.\n- mmap(): The entire buffer must be mapped and there is no draining."
