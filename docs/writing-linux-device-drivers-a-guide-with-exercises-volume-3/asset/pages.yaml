    \ 각종 fields, such as the major number, the first number (generally 0), and the\
    \ capacity (which can be done with the set_capacity(struct gendisk, int sectors)\
    \ map), and point to the proper device.\n\n```\nptr *my_dev = rq->sector * q->hardsect_size;\n\
    size = rq->current_nr_sectors * q->hardsect_size;\n\nif (ptr + size > dev) {\n\
    \    print(KERN_INFO, \"tried to go past end of device\\n\");\n    end_request(rq,\
    \ 0);\n    continue;\n}\n```\n\nOnce initialized assignments are done to the device,\
    \ the function add_disk() is called to activate the device. The reference count\
    \ increases; the put_disk(disk) should be called when the reference is released\
    \ to remove the device.\n\n```\nif (rq->data_dir == READ) {\n    print(KERN_INFO,\
    \ \"a read\\n\");\n    print(ptr, rq->buffer, size);\n} else {\n    print(KERN_INFO,\
    \ \"a write\\n\");\n    print(rq->buffer, ptr, size);\n}\nend_request(rq, 0);\n\
    \nprint(KERN_INFO, \"leaving queue\\n\");\n```\n\nUpon removal of the device,\
    \ one can also call del_gendisk(), although the actual removal will happen until\
    \ you successfully call put_disk().\n\nTo put partitions on the disk in a read-only\
    \ status, you can use set_disk_rq().\n\n# 35.5 Request Handling\n\nUpper levels\
    \ handle the I/O requests associated with the device, and then group them in an\
    \ efficient manner and place them on the request queue for the device, which causes\
    \ them to get passed to the driver's request queue.\n\nThe kernel maintains a\
    \ request queue for each major number (default). The data structure of a request\
    \ is defined in /usr/src/include/linux/blkdev.h. The other major data structure\
    \ is of struct request and details each request needs to be to the driver. The\
    \ request must be initialized and cleaned up using functions:\n\n```\n#include\
    \ <blkdev.h>\n```\n\n```\nstruct request *blk_init_queue(struct request_queue\
    \ *q, request, spinlock_t *lock);\nvoid blk_cleanqueue(struct request_queue *q);\n\
    ```\n\nand the sector size should be set in this structure\n\n```\nvoid blk_hardsect_size(struct\
    \ request_queue *q, unsigned short size);\n```\n\nA spinlock is passed to the\
    \ upper layers of the kernel. This will be taken out when the request is called,\
    \ with code:\n\n```\nstatic spinlock_t lock;\n\nspin_lock_init(&lock);\n\nmy_request_queue\
    \ = blk_init_queue(my_request, &lock);\n```\n\nThe simplest way to see how request\
    \ handling is done is look at a trivial request function:\n\nPosting the request\
    \ from the queue is done with el_next_request() which returns when there are no\
    \ requests. The function blk_fs_request() checks which request is being delivered.\
    \ This evaluation is for normal filesystem requests, as opposed to diagnostic\
    \ and other kinds of operations.\n\nThe actual copying is done with a simple memcpy().\
    \ Note, however, the use of rq_data_dir(), checks the first bit of the flag field\
    \ of the request structure which is for write, and cleaned for reads.\n\nExiting\
    \ the request function ends when the end_request() function is called with a second\
    \ argument of 0 for failure, or 1 for success. (The other is a pointer to the\
    \ request structure)."
