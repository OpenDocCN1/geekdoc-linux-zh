  md: "# 27.7 MII and ethtool\n\nMany network devices comply with the MII (Media Independent\
    \ Interface), which describes the interface between network controllers andhtransceivers.\n\
    \nThe kernel provides the generic MII interface with:\n\n```\n#include <linux/mii.h>\n\
    \nint mii_if_info (\n    int phy_id;\n    int advertising;\n    int phy_mask;\n\
    \    int reg_mii_mask;\n\nunsigned int full_duplex : 1; /* is full duplex? */\n\
    unsigned int forced_mode : 1; /* is auto disabled? */);\n```\n\n```\nstruct net_device\
    \ *dev;\n mii_write(struct net_device *dev, int phy_id, int reg, int val);\n```\n\
    \nThe methods used in this structure are mii_read() and mii_write(), which allow\
    \ communication with the interface. There exist other functions for obtaining\
    \ information and changing the device state, which are also designed to collaborate\
    \ with the ethtool utility.\n\nethtool provides administrators with a set of utilities\
    \ for controlling interface attributes, such as speed, media, duplex operation,\
    \ checksumming, etc. The driver must support ethtool to take advantage of its\
    \ features.\n\nThe relevant code is found in /usr/src/include/linux/ethtool.h,\
    \ and includes the ethtool_ops structure, which contains a list of methods that\
    \ can be implemented:\n\n```\nstruct ethtool_ops {\n    int (*get_settings)(struct\
    \ net_device *dev, struct ethtool_cmd *);\n    int (*set_settings)(struct net_device\
    \ *dev, struct ethtool_cmd *);\n    void (*get_drvinfo)(struct net_device *dev,\
    \ struct ethtool_drvinfo *);\n    int (*get_reg)(struct net_device *dev, int reg,\
    \ struct ethtool_regs *);\n    int (*set_reg)(struct net_device *dev, int reg,\
    \ int val);\n    void (*get_val)(struct net_device *dev, struct ethtool_val *);\n\
    \    u32 (*get_maxreg)(struct net_device *dev, u32 *max_reg);\n    void (*reset)(struct\
    \ net_device *dev);\n    int (*get_link_info)(struct net_device *dev);\n    int\
    \ (*get_eeprom)(struct net_device *dev, struct ethtool_eeprom *, unsigned int);\n\
    \    int (*set_eeprom)(struct net_device *dev, struct ethtool_eeprom *, unsigned\
    \ int);\n    int (*get_coalesce)(struct net_device *dev, struct ethtool_coalesce\
    \ *);\n    int (*set_coalesce)(struct net_device *dev, struct ethtool_coalesce\
    \ *);\n    void (*get_ringparam)(struct net_device *dev, struct ethtool_ringparam\
    \ *, unsigned int);\n    int (*set_ringparam)(struct net_device *dev, struct ethtool_ringparam\
    \ *, unsigned int);\n};\n```\n\nTo enable ethtool to use a pointer to the network\
    \ device structure, use the ETHTOOL_OPS macro. If MII support is enabled, the\
    \ functions mii_ethtool_gset() and mii_ethtool_sset() can be used to implement\
    \ the get_settings() and set_settings() methods."
