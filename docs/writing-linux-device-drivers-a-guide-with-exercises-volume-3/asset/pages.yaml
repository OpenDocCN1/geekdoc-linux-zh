  md: '# CHAPTER 7 KERNEL STYLE AND GENERAL CONSIDERATIONS


    # 7.7. LINKED LISTS


    While having one with simple direct implementation of that linked list, a new
    one is likely a good way to get your code rejected. Linux kernels have standardized
    one clever implementation that is to be adopted in new code.


    One advantage of a conventional implementation is having to provide a battery
    of functions for removal, insertion, deletion, and other manipulations of the
    linked list. The other is different because of the nature of the data structures.
    The Linux standardized implementation, has no matter what functions are used the
    linked list structures are made of


    A second advantage is that one uses well-tested, safe functions, which are generalized
    to work on all architectures, and on which refinements, enhancements, and improvements
    are made.


    The various functions and structures are detailed in /usr/src/kernel/include/list.h.
    The elementary data structure is


    ```

    struct my_struct = kmalloc(sizeof(struct my_struct), GFP_KERNEL);

    me->val = NULL;

    me->list = NULL;

    INIT_LIST_HEAD(&me->list);

    ```


    ```

    struct list_head my_list;

    INIT_LIST_HEAD(&my_list);

    ```


    ```

    struct list_head {

    struct list_head *next, *prev;

    ```


    The main functions (as macros) invoked in manipulating doubly-linked lists are:


    ```

    #include <list.h>


    void list_add(struct list_head *new, struct list_head *head);

    void list_add_tail(struct list_head *new, struct list_head *head);

    void list_delete(struct list_head *entry);

    void list_splice(struct list_head *list, struct list_head *head, struct list_head
    *next);

    ```


    And each node in the linked list can be used to start traversal; hence the unusual
    list_head. To use this facility you need to place a list_head structure inside
    the structure you are using. For example:


    ```

    struct my_struct {

    struct list_head list_head;

    int val;

    char *data;

    };

    ```


    list_add(entry) inserts an element to its first argument after pointed to by its
    second argument.

    list_add_tail(entry) inserts an element to its first argument at the end of the
    linked list by its second argument.

    list_delete(entry) removes the element from its linked list. One must still deallocate
    any memory associated with the linked data structure.


    list_splice(list, head) joins two lists, where the first argument points to the
    new list and the second returns to the head.


    list_empty(head) checks if the list is empty.


    The critical point is that the next, prev pointers in the list_head structure
    do not point to the data structures in which the list_head is embedded. Instead,
    they point to the list_head field within those structures. To retrieve a pointer
    to the data structure, one needs to use the list_entry() macro shortly.


    The following are used to work through a linked list:


    ```

    list_entry(ptr, type, member)

    list_for_each(pos, head)

    list_for_each_safe(pos, head)

    list_for_each_safe(pos, n, head)

    ```


    The list_head must be initialized before use. This can be done at compile time
    as:


    or at runtime as:


    list_entry(ptr, type, member) returns a pointer to the structure of type indicated
    in its second argument, from the list head is pointed to by the first argument,
    and which member we desire to get is the third argument.


    list_for_each(pos, head) iterates over the list by its second argument, performing
    operations on its member. list_for_each_prev(pos) iterates over the list back
    ward.


    list_for_each_safe(pos, head, n) handles the case where one is removing the list
    entry; the second argument is a pointer to a struct list_head that is used for
    temporary storage.


    A variant is to use the list_entry(pos, head, member) convenience macro (where
    member is the name of the list within the structure) so that the following two
    codes accomplish the same thing:


    struct my_struct *tmp'
