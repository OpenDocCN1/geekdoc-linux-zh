    ```\n\n```\nstatic void my_request(struct request_queue *q)\nstruct request *rq;\n\
    int size;\nchar *prtr;\nKERN_INFO(\"entering request queue\\n\");\n```\n\nThe\
    \ first step is to create the gendisk data structure. This is done with alloc_disk(),\
    \ whose argument is the number of members and thus partitions, the disk can accommodate.\n\
    \n```\nwhile ((rq = el_next_request(q))) {\n    if (blk_fs_request(rq)) {\n  \
    \      print(KERN_INFO, \"This is not a normal request, skipping:\\n\\\");\n \
