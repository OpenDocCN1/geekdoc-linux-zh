  md: "# CHAPTER 20. INTERRUPT HANDLING AND DEFERRABLE FUNCTIONS\n\n# 20.3. TASKLETS\n\
    \n| Type | Process context | SMP Behaviour | SMP Serialization |\n|---|---|---|---||\n\
    | TASKLET_SOFTIRQ | 5 | Normal-priority tasks. | | |\n| SCHED_SOFTIRQ | 6 | Used\
    \ in the CFS scheduler. | | |\n| HRTIMER_SOFTIRQ | 7 | Used if high resolution\
    \ timers are present. | | |\n\nTasklets may run in parallel on multiple CPU systems.\
    \ However, the tasklet cannot be at the same time on more than one CPU; other\
    \ can cause delays which may not be worth the cache savings; work queues can be\
    \ used instead.\n\nA tasklet runs on the CPU that it was scheduled on; this optimizes\
    \ this cache usage. (This means many kinds of race conditions are naturally avoided;\
    \ the thread that invoked it- the tasklet must complete before the tasklet actually\
    \ runs.)\n\nThe various kinds of deferred functions differ mostly in whether they\
    \ operate in process context and their behaviour on multi-processor systems.\n\
    \nThe tasklet is coded in /usr/src/linux/include/interrupt.h. The important data\
    \ structure is:\n\n```\nstruct tasklet_struct {\n    struct tasklet_struct;\n\
    \    unsigned long state;\n    atomic_t count;\n    void (*func)(unsigned long);\n\
    \    unsigned long data;\n};\n```\n\nThe func entry is a pointer to the function\
    \ that will be run, which can have data passed to it through data. The state is\
    \ used to determine whether or not the tasklet has already been scheduled; if\
    \ so it can not be done a second time.\n\nThe main functions for invoking tasklets\
    \ are:\n\n```\nDECLARE_TASKLET(name, function, data);\nDECLARE_TASKLET_DISABLE(name,\
    \ function, data);\n\nvoid tasklet_init(struct tasklet_struct *t, unsigned long\
    \ data);\nvoid tasklet_schedule(struct tasklet_struct *t);\nvoid tasklet_enable(struct\
    \ tasklet_struct *t);\nvoid tasklet_kill(struct tasklet_struct *t);\n```\n\nSoftirqs\
    \ are configured, or constructed in two ways:\n\n+   - After an interrupt is serviced\
    \ the kernel checks if softirqs are pending; if so it executes them in priority\
    \ order.\n- The kernel softirq[cpu] is scheduled in other processes, and consumes\
    \ them in like fashion.\n\nThe second mechanism is required to prevent priority\
    \ inversion causing softirqs when a softirq returns before finishing. To avoid\
    \ this, rebuilt deferred functions that exist a certain backlog are scheduled\
