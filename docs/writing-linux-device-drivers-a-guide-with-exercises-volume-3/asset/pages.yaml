    \ FUNCTIONS FOR MMAP()\n\nThis also be done on device nodes for direct access\
    \ to hardware devices; in this case the driver must register and implement a proper\
    \ mmap() entry.\n\nThis method is not useful for stream-connected. The mapped\
    \ area must be a multiple of PAGE_SIZE, and start on a page boundary.\n\nTwo basic\
    \ kinds of memory mapping:\n\n+   - In a shared map any operation on the memory\
    \ region is completely equivalent to changing the file it represents. Changes\
    \ are committed to disk (with the usual delays) and any process accessing the\
    \ file or mapping it will see the changes.\n- In a private map any changes are\
    \ not committed to disk and not seen by any other process. This is efficient and\
    \ design for a read only situation, or where the final saving of data is to be\
    \ done by writing to another file.\n\nflags specifies the type of the mapped object.\
    \ It has bits:\n\n| Value | Meaning |\n| --- | --- |\n| MAP_FIXED | It can't be\
    \ used, fail. |\n| MAP_SHARED | Share the mapping with all other processes. |\n\
    | MAP_PRIVATE | Create a private copy-on-write mapping. |\n\nMemory mapping can\
    \ be more efficient than direct disk access, particularly when files are shared\
    \ by multiple processes, each of whom can access to certain pages, minimizing\
    \ memory usage and speeding access times.\n\nEither MAP_SHARED or MAP_PRIVATE\
    \ must be specified. Remember, a private mapping does not change the file on disk.\
    \ Whatever changes will be lost when the process terminates.\n\nOther non-POSIX\
    \ flags can be specified (using mmap()), the MAP_ANONYMOUS flag permits a mapping\
