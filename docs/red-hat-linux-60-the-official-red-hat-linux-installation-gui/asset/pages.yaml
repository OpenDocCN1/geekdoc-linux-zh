    -- src


    **The /var Directory** Since the FSSTND requires that you be able to mount /user
    read-only, any programs that write log files or need spool or lock directories
    probably write them to the /var data. The FSSTND states /var is for


    > " variable data files. This includes spool directories and files, administrative
    and logging-data files, and transient and temporary files."


    The following directories should be subdirectories of /var:


    +   /var

    - log

    - catman

    - lib

    - local

    - named

    - nis

