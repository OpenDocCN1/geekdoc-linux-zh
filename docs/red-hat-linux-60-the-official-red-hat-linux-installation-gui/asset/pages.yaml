  md: '# 8.2.1 Printer Configuration


    The printer configuration tool (printtool) maintains the /etc/printcap file, print
    spool directories, and print filters. The filters allow you to print many different
    types of files, including:


    +   - plain text (ASCII) files

    - PostScript files

    - TeX .dvi files

    - GIF, JPEG, TIFF, and other graphics formats

    - RPMs


    In other words, simply printing a GIF or RPM file using the lpr command will result
    in the printer doing "the right thing."


    In order to create a new print queue, choose Add. Then, select what type of printer
    is being added. There are four types of print queues which can be configured with
    printtool:


    +   - Local print queues are for printers attached to a printer or serial port
    on your Red Linux system.

    - Remote print queues are attached to a different system which you can access
    over a TCP/IP network.

    - SMB print queues are attached to a different system which uses LAN-Manager-type
    (SMB) networking.

    - NCP print queues are attached to a different system which uses Novell''s NetWare
    technology.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_175_0.png)'
  merge: -1
