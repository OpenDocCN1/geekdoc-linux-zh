    section, you may see an "Unallocated Partitions" title bar, followed by one or
    more partitions. As the title implies, these are partitions that have been requested,
    but for one reason or another, have not been allocated. A common reason for having
    an unallocated partition is a lack of free space for the partition. In any case,
    the partition remains unallocated and will be displayed after the partition''s
    mount point.


    # The "Drive Summaries" Section


    Each line in the "Drive Summaries" section represents a hard disk on your system.
    Each line has the following fields:


    Drive - This field shows the hard disk''s name.


    Geom [C/H/S] - This field shows the hard disk geometry. The geometry consists
    of three numbers representing the number of cylinders, heads, and sectors as reported
    by the hard disk.


    Total - The "Total" field shows the total available space on the hard disk.'
