  md: "# 11\n\n# # System Administration\n\nThis chapter is an overview of the Red\
    \ Hat Linux system. It will illustrate things that you may not know about the\
    \ system and things that are somewhat different from other UNIX systems.\n\n#\
    \ ## 11.1 Filesystem Structure\n\nRed Hat Software is committed to the Linux File\
    \ System Standard, a collaborative document that defines the names and locations\
    \ of many files and directories. We will continue to track the standard to keep\
    \ Red Hat compliant. \n\n\nWhile compliance with the standard means many things,\
    \ the two most important are compatibility with other compliant systems, and the\
    \ ability to mount the /usr partition read-only. The /usr partition contains common\
    \ executables and is not meant to be changed by users. The /usr partition can\
    \ be mounted from the CD-ROM or from another machine read-only NFS. The current\
    \ Linux Filesystem Standard (FSSTND) document is the authoritative reference to\
    \ any FSSTND compliant system, but the standard leaves many areas undefined or\
    \ extensible. In this section we provide an overview of the standard and a description\
    \ of the parts of the filesystem not covered by the standard.\n\nThe complete\
    \ standard can be viewed at:\n\n```\nhttp://www.pathname.com/fhs/\n```"
  merge: -1
