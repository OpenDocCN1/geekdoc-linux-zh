  md: '214


    # System Administration


    # 11.9 Sendmail


    A default sendmail.cf file will be installed in /etc. The default configuration
    should work for most SMTP-only sites. It will not work for UUCP sites; you will
    need to generate a new sendmail.cf if you must use UUCP mail transfers. To generate
    a new sendmail m and the sendmail source package, Read the README file in the
    sendmail sources for more details on creating sendmail configuration files. Also,
    O''Reilly & Associates publishes a guide with reference entitled sendmail, by
    Bryan Costales.


    One common sendmail configuration is to have a single machine act as a mail gateway
    for all the machines on your network. For instance, Red Hat Software we have a
    machine mail.redhat.com that does all our mail. On that machine we simply need
    to add the names of machines for which mail.redhat.com will handle mail to /etc/sendmail.cw.
    Here is an example:


    ```

    # sendmail.cw - include all aliases for your machine

    # here.

    torgo.redhat.com

    poodle.redhat.com

    devel.redhat.com

    ```


    Then on the other machines, torgo, poodle, and devel we need to edit

    /etc/sendmail.cf to "masquerade" as mail.redhat.com when sending mail, and for
    any local mail processing to redhat.com. Find the DH and DM lines in

    /etc/sendmail.cf and edit them thus:


    ```

    # who send unqualified names to

    # (null means deliver locally)

    DRmail.redhat.com

    ```


    ```

    # who gets all local email traffic

    DHmail.redhat.com

    ```


    ```

    # who masquerade as (null for no masquerading)

    DMmail.redhat.com

    ```


    With this type of configuration, all mail sent will appear as if it were sent
    from redhat.com, and any mail sent to torgo.redhat.com or the other hosts will
    be delivered to mail.redhat.com.


    Please be aware that if you configure your system to masquerade as any other e-mail
    sent from your system will be sent to the machine you are masquerading as. For
    example, in the above illustration, log files that are periodically sent to root@poodle.redhat.com
    by the cron daemon would be sent to root@mail.redhat.com.'
  merge: -1
