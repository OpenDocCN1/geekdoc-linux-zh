  md: 'Enable NIS – allows you to run a group of computers in the Network Information
    Service domain with a common password and group file. There are two options here
    to choose from:


    +   - NIS Domain – this option allows you to specify which domain or group of
    computers your system will belong to.


    +   - NIS Server – this option allows your computer to use a specific NIS server,
    rather than "broadcasting" a message to the local area network asking for any
    available server to host your system.


    +   - Enable Shadow Passwords – provides a very secure method of retaining passwords
    for you.


    +   - MD5 Password allows a password to be used up to 256 characters, instead
    of the standard eight characters or letters.


    The autoconfig format for kickstart looks similar to:


    ```

    auth --enable --nisdomain foo.redhat.com --nisserver server.foo.redhat.com [--useshadow]
    --enablemd5

    ```


    **Please Note:** The commands in the square brackets are optional. If you choose
    to set them, you do not need to use the brackets.


    You are able to change autoconfig using these commands to set up the different
    password options:


    ```

    --enable enable nis by default

    --nisdomain <domain> default NIS domain

    --nisserver <server> default NIS server

    --useshadow use shadow passwords

    --enablemd5 enable MD5 passwords

    ```


    # ### H.3.20 lilo – LILO Configuration


    For machines that use LILO (Intel-based systems), you can specify the LILO configuration
    using the lilo keyword. The default line can be as simple as this:


    ```

    lilo

    ```


    This will install LILO in the hard drive''s master boot record (MBR), and automatically
    boot entries for your Linux installation as well as a DOS or Windows installation
    (if one is present).


    If you don''t have LILO installed in the MBR, you can do so by using the --location
    option. There are three possible places where LILO can be installed:


    +   - mbr - put LILO on the master boot record (default)


    +   - partition - put LILO on the beginning of the root partition'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# H.3 The Kickstart File


    +   - none - don''t install LILO at all (in which case you''ll need your own method
    of booting the

    installed system)


    You can also use the `--append` option to add an `append=` line to the Linux boot
    entry. This is handy

    if you need to do things like set memory sizes, etc. For example, to install LILO
    on the MBR on a

    machine with 128MB of RAM, you add the following `lilo` line:


    ```

    lilo --append ''mem=128M'' --location mbr

    ```


    (Due to the new kernel in Hat Linux 6.0, the mem boot-time option shouldn''t be
    necessary, but

    needed an example.)


    # H.3.21 %packages – Package Selection


    You can use the `%packages` keyword to start the beginning of a kickstart file
    section that lists the

    packages you''d to install (note that this is for installs only, as package selection
    during upgrades

    is not supported).


    Packages can be specified by component or by package name. The installation program

    defines several components that group together related packages. See the RedHat/base/comps
    file

    on any Red Hat Linux CD-ROM for a list of components. The contents are defined
    by the lines

    that begin with a name followed by a space, and then the component name. Each
    of the packages

    in that component are then listed, line-by-line, until the end keyword. Individual
    packages lack the

    leading number found in front of component lines.


    In most cases, it is only necessary to list the desired components and not individual
    packages. Note

    t the `Base` component is always selected by default, so it''s not necessary to
    specify it in the

    `%packages` section.


    Here''s an example %packages section:


    ```

    %packages

    @ Networked Workstation

    @ C Development

    @ Web Server

    @ X Window System

    bsd-games

    ```


    As you can see, components are specified, one to a line, starting with an "@"
    symbol, a space, and then

    the full name as given in the `comps` file. Specify individual packages with no
    additional

    characters (the `bsd-games` line in the example above is an individual package).


    **Note:** You can also direct the kickstart install to use the workstation- and
    server-class installation\methods. To do this, simply add `one` of the following
    lines to the `%packages` section:


    ```

    @ Workstation

    @ Server

    ```'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# H.3.22 %post – Post-Installation Configuration Section


    You have the option of adding commands to be run on the installed system after
    the installation is complete. This section must be at the end of the kickstart
    file and must start with the %post keyword. Note that you can access the network
    in the %post section; however, nameservice has not yet been configured at this
    point, so only IP addresses will work. Here''s an example %post section:


    ```

    %post

    # add comment to /etc/motd

    echo Kickstart-installed Red Hat Linux ''/bin/date'' > /etc/motd


    # add another nameserver

    echo nameserver 10.10.0.2 >> /etc/resolv.conf

    ```


    This section creates a message-of-the-day file containing the date the kickstart
    installation took place, and gets around the network keyword''s one-nameserver-only
    limitation by adding another nameserver to /etc/resolv.conf.'
  merge: -1
