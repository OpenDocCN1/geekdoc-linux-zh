  md: '# 6.11 Finishing Up...


    # 6.10.1 Configuring an XFree86 Server


    If you use XFree86, the installation program launches the Xconfigurator utility.


    Xconfigurator first probes your system in an attempt to determine what type of
    video card you have. Failing that, Xconfigurator will present a list of video
    cards. Select your video card from the list and press Enter. If your video card
    does not appear on the list, XFree86 may not support it. However if you have technical
    knowledge about your card, you may choose Unlisted Card and attempt to configure
    it by matching your video card with one of the available X servers.


    Once you have selected your video card, the installation program installs the
    appropriate XFree86 server, and Xconfigurator presents a list of monitors. If
    your monitor appears on the list, select it and press Enter, select Custom. If
    you select Custom, Xconfigurator prompts you to select the horizontal sync and
    vertical sync of your monitor (these values are generally available in the documentation
    accompanying your monitor, or from your monitor''s vendor manual).


    Caution: it is not recommended to select a monitor "similar" to yours unless you
    are certain that the monitor you are selecting does not exceed the capabilities
    of your monitor. If you do so, you may overclock your monitor and destroy it.


    Next, Xconfigurator prompts you for the amount of video memory installed on your
    video card. If you are not sure, please consult the documentation accompanying
    your video card. It will not damage your video card by choosing more than available,
    but the XFree86 server may not correctly set the clockpicks.


    If the video card you selected have a video clockpick, Xconfigurator presents
    a list of clockpicks. The recommended choice is No Clockpick Setting, as XFree86
    can automatically detect the proper clockpick.


    Next, Xconfigurator prompts you to select the mode you wish to use; select one
    or more modes by pressing Space Xconfigurator writes a configuration file containing
    all of your choices to /etc/X11/XFree86config.


    Finally, you will see a screen which gives you the option of running X Windows
    System when you reboot. If you have X run, GNOME will be the default desktop manager
    you use.


    # 6.11 Finishing Up...


    After you have configured the X Windows System, the installation program will
    prompt you to prepare your system for reboot (see Figure 6.22 on the following
    page). Don''t forget to remove any diskette that might be in the لديك, or CD that
    might be in the CD-ROM drive if your system is to boot from the CD-ROM (unless
    you decide to skip the LILO installation, in which case you will need to use the
    boot disk created during the installation).


    After your computer''s normal power-up sequence has completed, you will see LILO''s
    standard prompt, which is boot:. At the boot: prompt, you can do any of the following
    things:'
