    # Disk Druid''s Buttons


    These buttons control Disk Druid''s actions. They are used to add and delete partitions,
    and to change partition attributes. In addition, there are buttons to accept the
    changes you''ve made, or to exit Disk Druid entirely. Let''s look at each button
    in order.


    Add – The “Add” button is used to request a new partition. When selected, a dialog
    box will appear containing fields that must be filled.


    Edit – The “Edit” button is used to modify attributes of the partition currently
    highlighted in the “Current Disk Partitions” section. Selecting all fields in
    the “Edit Partition” dialog box may be changed, depending on whether the partition
    information has already been written to disk.


    Delete – The “Delete” button is used to delete the partition currently highlighted
    in the “Current Disk Partitions” section. Selecting this button will cause a dialog
    box asking you to confirm the deletion.


    Ok – The “OK” button causes any changes to your system''s partitions to be written
    to disk. You will be asked to confirm your changes before Disk Druid rewrites
    your hard disk table(s). In addition, any mount points you''ve defined are passed
    to the installation program, and will eventually be used by your Red Hat Linux
    system to define the filesystem layout.


    Back – This button causes Disk Druid to abort without saving any changes you''ve
    made. When this button is selected, the installation program will take you back
    to the previous screen, so you can start over.


