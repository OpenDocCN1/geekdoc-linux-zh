    ```


    The netmask information will be set by default, although depending on what kind
    of network you are setting up, or becoming a part of, you may need to specify
    this. If you are connecting to an ISP, ask them for the information. Most likely
    it will be 255.255.255.0 (the default).


    Required fields for Manual Configuration:


    +   - Primary name + domain - the primary name is the name of your computer, the
    domain how your network is specified. For example, foo.bar.com; foo is the primary
    name and bar.com is the domain.


    +   - IP address - this is the address of the machine and will follow the pattern
    of x.x.x.x. For example, 192.168.0.13.


    +   - Net device - type of network card you are using; eth0 would be the appropriate
    entry to use the first ethernet card.


    +   - Kernel module - the correct module based on your network card.


    Information on net devices and kernel modules is described above. The appropriate
    primary name + domain and IP address will depend on whether you are connecting
    a computer to an existing or creating a new network. For connecting to an existing
    network, contact your systems administrators for the information. Getting a network
    connected to the Internet will be the scope of this book, and we recommend following
    the starting point:


    TCP/IP Network Administration, 2nd Edition, by Craig Hunt (O''Reilly and Associates).


    If you''re setting up a private network that won''t be connected to the Internet,
    you can choose any primary name + domain name you would like and have several
    choices for IP addresses (See Figure 82 on the facing page).


    The three sets of numbers above represent class a, b, and c networks. The classes
    are used to describe the number of IP addresses available as well as the range
    of numbers used to describe each. The numbers above have been aside for private
    networks.


    Please Note: You should not use these IP addresses if you connect to the Internet
    since 192.168.0.0* and 192.168.255.* are not reliably considered private. If you
    want your network to be connected to the Internet, or think you might want to
    at some point in the future, do yourself a favor and get yourself non-private
    addresses now.'
