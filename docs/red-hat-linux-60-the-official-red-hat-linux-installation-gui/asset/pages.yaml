  md: '# Geometry When referring to disk drives, the physical characteristics of the
    disk drive''s internal organization. Note that a disk drive may report a "logical
    geometry" that is different from its "physical geometry", normally to get around
    BIOS-related limitations. Also see Cylinder, Head and Sector.


    # GID Short for Group ID. The means by which a user''s membership in a group is
    identified to various parts of Red Hat Linux. GIDs are numeric, although human-readable
    names are stored in the /etc/group file.


    # Group Are a way of assigning access rights to certain classes of users. For
    example, all users working on Project X could be added to group xproj. System
    resources (such as disk space) devoted to Project X could be configured to permit
    only members of xproj access.


    # Hard Disk A hard disk contains rotating magnetic media (in the shape of disks)
    that spin rapidly. Small heads float over the surface of each disk, and are used
    to write and read from the disk as it rotates.


    # Head When referring to disk drives, the number of read/write heads within a
    disk drive. For example, each platter in a disk drive, there are normally two
    heads for each platter - one for each surface - although one surface may go unused.
    Also see Geometry.


    # Hostname A hostname is a human-readable string of characters used to identify
    a particular computer system.


    # I18n See Internationalization.


    # IDE An abbreviation for Integrated Drive Electronics, which is the name of a
    standard interface used to connect primarily disk drives and CD-ROM drives to
    a computer system. Also see "EIDE" and "ATAPI".


    # Intel Company responsible for producing the microprocessors that most commonly
    appear in PC-compatible personal computers. These processors include the 80386,
    80486, Pentium Pro, and Pentium II.


    # Internationalization The practice of designing and writing programs that can
    be easily configured to interact with the user in more than one language. Often
    referred to as "i18n", due to the number of letters between the starting "i" and
    the ending "n".


    # IP Address IP addresses are the method by which individual computer systems
    (for a more strictly accurate interpretation, the network interfaces on those
    computer systems) are identified on a TCP/IP network. All IP addresses consist
    of four number blocks, each ranging from 0 to 253, and separated by periods.


    # Kernel The central part of an operating system upon which the rest of the operating
    system is based.'
