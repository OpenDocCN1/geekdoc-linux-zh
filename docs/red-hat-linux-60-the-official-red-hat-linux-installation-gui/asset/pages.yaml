- img_proc: true
  md: 'ager. The master boot record is a special area on your hard drive that is automatically
    loaded by your computer''s BIOS, and is the earliest point at which LILO can take
    control of the boot process. If you install LILO in the MBR, when you make boots,
    LILO will provide a boot prompt; you can then boot Red Hat Linux or any other
    operating system you configure LILO to boot (see below).


    The first section of your root partition is recommended if you are already using
    another boot loader on your system (OS/2 Boot Manager). In this case, your other
    boot loader will take control first. You can then configure that boot loader to
    start LILO (which will then boot Red Hat Linux).


    A dialog box will let you select the type of LILO installation you desire (Figure
    6.19). Select the location where you wish to install LILO and press Ok. If you
    do not wish to install LILO, press Skip.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_121_0.png)


    Figure 6.19: Installing LILO


    **Please Note:** If you choose Skip, you will not be able to boot your Red Hat
    Linux system directly, and will need to use another boot method (such as a boot
    diskette). This option will only work if you know any other way of booting your
    Red Hat Linux system!


    # 6.9.1 SMP Motherboards and LILO


    This section is specific to SMP motherboards only. If the installer detects a
    SMP motherboard on your system, it will automatically create two lilo.conf entries
    as opposed to the usual single entry.


    One entry will be called smp and the other will be called linux. The smp will
    boot by default. However, if you have trouble with the smp kernel, you can elect
    to boot the linux entry instead. You will retain all the functionality as before,
    but you will only be operating with a single processor.'
  merge: -1
