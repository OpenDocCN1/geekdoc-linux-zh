    \ of the file to indicate another kernel to boot from. We have renamed /boot/vmlinux\
    \ to /boot/vmlinux and changed its label to old. We have also added an initrd\
    \ line for the new kernel:\n\n```\nboot=/dev/hda\nmap=/boot/map\ninstall=/boot/boot.b\n\
    prompt\ntimeout=100\nimage=/boot/vmlinux\nlabel=lilo\ninitrd=/boot/initrd\nroot=/dev/hdal\n\
    read-only\nimage=/boot/vmlinux.old\nlabel=old\nroot=/dev/hdal\nread-only\n```\n\
    \nWhen the system boots and you press Tab at the LILO boot: prompt two choices\
    \ will be shown:\n\n+   LILO boot:\n  linux old\n\nTo boot the new kernel (linux)\
    \ simply press Enter or wait for LILO to time out. If you want to boot the old\
    \ kernel (old), type old and press Enter\n\nHere is a summary of the steps:\n\n\
    +   * /boot/vmlinuz /boot/vmlinuz.old\n* cp /usr/src/linux/arch/i386/boot/zImage\
    \ /boot/vmlinuz"
