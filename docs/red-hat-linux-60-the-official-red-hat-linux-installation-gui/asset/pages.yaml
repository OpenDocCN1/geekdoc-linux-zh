    # 11.8 Building a Custom Kernel


    Many people new to Linux ask, "why should I build my own kernel? Given the advances
    that have been made in the use of kernel modules, the most accurate response to
    question is, unless you know why you need to build your own kernel, you probably
    don’t." Unless you have a specific reason to build a customized kernel (or you’re
    just the curious sort), you may skip ahead to Section 11.9 on page 214.


    # 11.8.1 Building a modularized kernel


    These instructions provide you with the knowledge needed to take advantage of
    the power and flexibility available through kernel modularization. If you do not
    wish to, see Section 11.8.3 for an explanation of the different aspects of building
    and installing a monolithic kernel. It is assumed that you have already installed
    the kernel-headers and kernel-source packages that you use all commands from the
    /usr/src/linux directory.


    It is important to build a kernel with the source tree in a known condition. Therefore,
    it is recommended that you build with the command make. This will remove configuration
    files along the remains of any previous builds that may be scattered around the
    source tree. You must create a configuration file that will determine which components
    to include in your new kernel. Depending upon your hardware and personal preferences
    there are three methods to configure the kernel.


    +   - make config - An interactive text program. Components are presented and
    you answer with Y (yes), N (no), or M (module).


    +   - make menuconfig-A menu driven program. Components are presented in a menu
    of categories, you select the desired components in the same manner used in Red
    Hat Linux'
