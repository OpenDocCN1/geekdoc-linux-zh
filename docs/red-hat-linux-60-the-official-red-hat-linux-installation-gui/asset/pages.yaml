  md: '# 370


    # Glossary


    **CISC** An abbreviation for Complex Instruction Set Computer. A design philosophy
    for computers whereby the processor is designed to execute a relatively large
    number of different instructions, taking a different amount of time to execute
    (depending on the complexity of the instruction). Contrast with RISC.


    **CMOS** Originally an abbreviation for Complementary Metal Oxide Semiconductor
    – a semiconductor used in many integrated circuits. Now often used to store the
    low-level hardware that contains a computer''s BIOS setting, and the computer''s
    hardware lock.


    **Cylinder** When referring to disk drives, the number of positions the disk drive''s
    read/write heads can take over the unit''s disk platters. When viewed from above
    each head positions an imaginary circle of different diameters on the platter''s
    surface, but when viewed from the side, these circles can be thought of as a series
    of cylinders nested within each other, hence the term.


    **Daemon** A daemon is a program that runs, without human intervention, to accomplish
    a given task. For example, `lpd` is a daemon that controls the flow of print jobs
    to a printer.


    **Dependencies** When referring to packages, dependencies are requirements that
    exist between packages. For example, package `foo` may require files that are
    installed by package `bar`. In this example, `bar` must be installed or `foo`
    will have unresolved dependencies. RPM will not normally allow packages with unresolved
    dependencies to be installed.


    **Device Driver** Software that controls a device that is connected to, or part
    of, a computer.


    **Disk Drive** See Hard Disk.


    **Disk Druid** Disk Druid is a component of the Red Hat installation program that
    is used to partition disk drives during the installation process.


    **Diskette** A small mass storage device in a removable cartridge, meant to be
    read/written to, in a compatible drive.


    Distribution An operating system (usually Linux) that has been packaged so as
    to be easily installed.


    **Domain Name** A domain name is used to identify computers as belonging to a
    particular organization. Domain names are hierarchical in nature, with each level
    in the hierarchy being separated from other levels with a period (pronounced "dot").
    For example, Foo Incorporated''s Finance department might use the domain name
    `finance.foo.com.`


    **Driver** See Device Driver.'
