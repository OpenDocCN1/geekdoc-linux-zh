  md: '# 11.1 Filesystem Structure


    The /usr Directory The /usr directory is for files that are shareable across a
    whole site. The /usr directory usually has its own partition, and it should be
    mountable read only. The following directories should be subdirectories of /usr:


    ```

    /usr

    - X1R6

    - bin

    - dict

    - doc

    - etc

    - games

    - include

    - info

    - lib

    - local

    - man

    - sbin

    - share

    - src

    ```


    The X11 directory is for the X Window System (XFree86 on Red Hat Linux), bin is
    for executables, doc is for non-man-page documentation, etc is for site-wide configuration
    files, include is for header files, info is for GNU files, lib is for libraries,
    man is for man pages, sbin is for system administration binaries (those that do
    not belong in /sbin), and src is for source code.


    The /usr/local Directory The FSSTND says:


    > "/usr/local hierarchy is used by the system administrator when installing software
    locally. It needs to be overwritten when the system software is updated. It may
    be used for programs and data that are shareable among a group of machines, but
    not found in /usr."


    The /usr/local directory is similar in structure to the /usr directory. It has
    the following subdirectories, which are similar in purpose to those in the /usr
    directory:


    ```

    /usr/local

    - bin

    - doc

    - etc

    - games

    - include

    - info

    ```'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# 198 System Administration


    +   - lib

