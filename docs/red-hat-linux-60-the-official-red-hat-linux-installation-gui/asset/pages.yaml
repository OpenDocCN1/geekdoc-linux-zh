  md: '# 2.9 A Note About Kernel Drivers


    Installation of Red Hat Linux, there are some limits placed on the filesystems
    and drivers supported by the kernel. However, after installation there is support
    for all filesystems available under Linux. At install time the modularized kernel
    has support for (E)IDE devices, (including ATAP) CD-ROM drives), SCSI adapters,
    and network cards. Additionally, also SLIP, CSIP, PPP, FLIP, FPU emulation, console
    selection, ELF, S/ IPC, IP forwarding, firewalling and accounting, reverse ARP,
    QIC tape and parallel printers, are supported.


    **Please Note:** Because Red Hat Linux supports installation on many different
    types of hardware, many drivers (including those for SCSI adapters, network cards,
    and many CD-ROMs) are not built into the Linux kernel used during installation;
    rather, they are available as modules and loaded as you need them during the installation
    process. If necessary, you will have the chance to specify options for these modules
    when they are loaded, and in fact these drivers will ignore any options you specify
    for them at the `insmod: ` prompt.


    After the installation is complete you may want to rebuild a kernel that includes
    support for your specific hardware configuration. See Section 11.8 on page 210
    for information on building a customized kernel. Note that, in most cases, a custom-built
    kernel is not necessary.


