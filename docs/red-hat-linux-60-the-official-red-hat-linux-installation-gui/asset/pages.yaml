    # 4.7.1 Using Disk Druid


    If you select Disk Druid, you will be presented with a screen that looks like
    figure 4.5. While it may look overwhelming at first, it isn''t. Let''s go over
    each of Disk Druid''s three sections.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_64_0.png)


    # The "Current Disk Partitions" Section


    Each line in the "Current Disk Partitions" section represents a disk partition.
    You''ll note that this section will have a scroll bar to the right, which means
    there might be more partitions than can be'
