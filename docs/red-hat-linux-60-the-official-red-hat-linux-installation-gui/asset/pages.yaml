  md: '# 202


    Most computing sites like to create a group for each major project and assign
    people to the groups they need to be in. Managing files traditionally has been
    difficult, though, because someone creates a file it is owned by the primary group
    he she belongs to. When a single person works on multiple projects, it becomes
    hard to make the files owned by the group that is associated with that project.
    In the UPG scheme, groups are automatically assigned to files on a project-by-project
    basis, which makes managing projects very simple.


    Let''s say you have a big project devel, with many people editing the files in
    a devel directory. Make a group based devel, chgrp the devel directory to devel,
    and add all the users to the devel group. Now, all users will be able to edit
    the devel files and create new files in the devel directory, and these will always
    retain their devel group. Thus, they will be edit-able by other users.


    If you have multiple projects devel, and users who are working on multiple projects,
    these users will never have to change their umask or group when they move from
    project to project. The setgid on each project''s directory "selects" the proper
    group.


    Since each user''s HOME directory is owned by the user and their private group,
    it is safe to set the setgid bit on the HOME directory. However, by default, files
    are created with the primary group of the user, so the setgid bit be redundant.


    # User GroupRationale


    Although UPG is not new to Hat Linux 6.0, many people still have questions about
    it, such as why UPG is necessary. The following is the rationale for the scheme.


    +   - You''d like to have a group of people work on a set of files in say, the
    /usr/lib/emacs/site-lisp directory. You trust a few people to mess around in there,
    but certainly not everyone.

    - So you enter:

    chown -R root.emacs /usr/lib/emacs/site-lisp

    and you add the users to the group you enter.

    - To allow the users to actually create files in the directory you enter:

    chmod 775 /usr/lib/emacs/site-lisp

    - But when a user creates a new file it is assigned the group of the user''s default
    group (usually users). To prevent this you enter

    chmod 2775 /usr/lib/emacs/site-lisp\which causes everything in the directory to
    be created with the "emacs" group.'
