  md: '# 11.2 Special Red Hat File Locations


    # 11.1.2 /usr/local in Red Hat Linux


    In Red Hat, the intended use for /usr/local is slightly different from that specified
    by the FSSTND. The FSSTND says that /usr/local should be where you store software
    is to remain safe from system software upgrades. Since system programs from Red
    Hat are done safely with the RPM system and GNoRPM, you don''t need to protect
    files by putting them in /usr/local. Instead, we recommend you use /usr/local
    for software that is local to your machine.


    For instance, if you have mounted /usr via read-only NFS from beavis. If there
    is a package or program you would like to install, but you are not allowed to
    write beavis, you should install it under /usr/local. Later perhaps, if you''ve
    managed to convince the system administrator of beavis to install the program
    from /usr, you can uninstall it from /usr/local.


    # 11.2 Special Red Hat File Locations


    In addition to the files pertaining to the RPM system that are in /var/lib/rpm
    (Chapter 9), there are two other special locations that are reserved for Red Hat
    Linux configuration and operation.


    The control-panel and related tools put lots of stuff in /usr/lib/rhs. There is
    probably nothing there that you would want to edit. It is mostly small scripts,
    bitmaps and text files.


    The other location, /etc/sysconfig, stores configuration information. The major
    users of the files in this directory are the scripts that run at boot time. It
    is possible to edit these by hand, but it would be better to use the proper control-panel
    tool.


    # 11.3 Users, Groups and User-Private Groups


    Managing users and groups has traditionally been tedious. Red Hat Linux has a
    few tools and conventions that make user and groups easier to manage, and more
    useful.


    The easiest way to manage users and groups is through Linuxconf (see Chapter 8).
    However, you can use adduser to create a new user from the command line.


    # 11.3.1 Standard Users


    Table 11.3.1 lists the standard users set up by the installation process (this
    is essentially the /etc/passwd file). The group id. (GID) in this table is the
    primary group for the user. See Section 11.3.3 for details on how groups are used.'
