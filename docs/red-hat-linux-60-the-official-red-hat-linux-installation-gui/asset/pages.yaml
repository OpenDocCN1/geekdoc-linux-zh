  md: '# 11.5 The floppy Group 205


    **Enabling Console Access for Other Applications** If you wish to make other applications
    besides shutdown, reboot, and halt accessible to console users, you will have
    to do just a little bit more work.


    First of all, console access only works for applications which reside in /sbin
    or /usr/sbin, so the application that you wish to run must be there.


    Create a link from the name of your application to the /usr/bin/consolehelper
    application:


    ```

    cd /usr/bin

    ln -s /security/console.apps/foo foo

    ```


    Create the file /etc/security/console.apps/foo


    ```

    touch /etc/security/console.apps/foo

    ```


    Create a PAM configuration for the foot service in /etc/pam.d/. We suggest that
    you start with a copy of the shutdown service, change it if you want to change
    the behavior:


    ```

    cp /etc/pam.d/shutdown /etc/pam.d/foo

    ```


    Now, when you run /usr/bin/foot, it will call consolehelper, with which the help
    of /usr/sbin/userhelper will authenticate the user (asking for the users password
    if /etc/pam.d/foo is a copy of /etc/pam.d/shutdown; otherwise, it will do precisely
    what is specified in /etc/pam.d/foo) and run /usr/sbin/foot with root permissions.


    # 11.5 The floppy Group


    If for whatever reason, console access is not appropriate for you, and you need
    to give non-root users access to your system''s disk drive, this can be done using
    the floppy group. Simply add the user(s) to the floppy group using the tool of
    your choice. Here''s an example showing how gpasswd can be used to add user to
    the floppy group:


    ```

    [root@bigdog root]# gpasswd -a fred floppy

    Adding user fred to floppy group

    [root@bigdog root]#

    ```


    User fred will now be able to access the system''s disk drive (using the mtools
    utility programs, for instance).'
