    address of the HTTP server you will be using. You will also need the path to the
    Red Hat Linux directory on the HTTP server.


    If you''ve determined that this installation method is most applicable to your
    situation, please skip ahead to Section 2.6 on the next page.


    # 2.4.5 Installing From an NFS Server


    If your system doesn''t have a CD-ROM drive, but do you have network access, then
    an NFS installation may be for you. When installing via NFS, the Red Hat Linux
    packages you select are NFS-installed to your computer from an NFS server system.
    The packages are installed on your hard drive.


    # How To Do It


    If you wish to perform an NFS installation, you will need to mount the Red Hat
    Linux CD-ROM on a machine that supports ISO-9660 file systems with Rock extensions.
    The machine must also support NFS. Export the CD-ROM file system via NFS. You
    will need to have a nameserver configured, or know the NFS server''s IP address,
    as well as the path to the exported CD-ROM.


    Please Note: Your NFS server must be able to handle long filenames.


    > INFO

    For NFS installation, you''ll need a boot diskette only.


    If you''ve determined that this installation method is most applicable to your
    situation, please skip ahead to Section 2.6 on the following page.'
