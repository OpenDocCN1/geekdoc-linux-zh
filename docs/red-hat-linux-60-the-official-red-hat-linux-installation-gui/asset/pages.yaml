  md: '46


    # Local Media Installations


    **Please Note:** Installing Red Hat Linux over another installation of Linux (including
    Red Hat Linux) does not preserve any information (files or data) from the prior
    installation. Make sure you save any important files! If you are worried about
    saving the current data on your existing system (without making a backup on your
    own), you should consider performing an upgrade instead.


    If you wish to perform a full install, choose Install, and skip to 4.5.


    # 4.4.2 Upgrading


    The installation process for Red Hat Linux 6.0 includes the ability to upgrade
    from prior versions of Red Hat Linux (version 2.0 and later) which are based on
    RPM technology.


    Upgrading your system installs the modular 2.2 kernel as well as updated versions
    of the packages which are currently installed on your machine. The upgrade process
    preserves existing files by renaming them a `.rpms` extension (e.g, sendmail.cf.rpms)
    and leaves a log telling what actions it took in `/tmp/upgrade.log`. As software
    evolves, configuration files can change, so you should carefully compare your
    original configuration files to the new files before integrating your changes.


    If you wish to upgrade your Red Hat Linux system, choose Upgrade.


    **Please Note:** Some upgraded packages may require that other packages are also
    installed for proper operation. The upgrade procedure takes care of these *dependencies*,
    but may need to install additional packages which are not on your existing system.


    **Please Note:** If you already have the X Window System (and possibly an older
    version of GNOME) on your machine you may see a screen that prompts you to install
    the latest version of GNOME included in this release.


    # 4.5 Installation Class


    If you choose to perform a full install, the installation program will ask you
    to choose an installation class (see Figure 4.3 on the facing page). You will
    not see this screen if you chose to perform an upgrade. You may choose from the
    following installation classes:


    +   **Workstation** - A workstation-class installation will automatically erase
    all *Linux partitions* from your computer''s hard drive(s). This installation
    type will also attempt to set up a dual boot environment.


    +   **Server** - A server-class installation will automatically erase all *partitions*
    (Linux or others) from your computer''s hard drive(s).


    +   **Custom** - A custom-class installation gives you complete control over partitioning-related
    issues. If you have installed Red Hat Linux in the past, the custom-class installation
    is most similar to past installations.'
