    8.29: Selecting a Printer Type


    After choosing the printer type, a dialog box requests further information about
    the print queue (see Figure 8.30 on the next page). All types of print queues
    require the following information:


    +   - Queue Name: What the queue will be called. Multiple names can be specified
    with the (pipe) character separating entries.

    - Spool Directory: The directory on the local machine where files are stored before
    printing occurs. Be careful not to have more than one print queue use a given
    spool directory.

    - File Limit: Maximum size print job accepted, in kilobytes (1 kb = 1024 bytes).
    A size of 0 limit should be imposed.

    - Input Filter: Filters convert print files into a format the printer can handle.
    Press Select to choose the filter which matches your printer (see Figure 8.31
    on the following page).


    In addition to configuring printers able to print graphical and PostScript output,
    you can configure a text-only printer, which will only print plain ASCII text.
    Most printer drivers are also able to print ASCII text without converting it to
    PostScript first; simply choose Fast printing when you configure the filter. Please
    Note: This only works for non-PostScript printers.'
