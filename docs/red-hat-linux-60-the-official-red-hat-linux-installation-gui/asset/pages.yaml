    # Changing the root Password – General Overview


    Changing roots password isn''t handled in the same manner as changing a user’s
    password. Because of both the importance and security considerations surrounding
    root access, Linuxconf requires you to verify that you currently have access to
    the root account.


    +   * Linuxconf by typing linuxconf at the shell prompt.

