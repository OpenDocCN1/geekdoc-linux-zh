    # ## Installation Guide For The Award-Winning Red Hat Linux Operating System


    Selected as the Operating System Product-of-the-Year, by InfoWorld for the past
    three years, the open-source Red Hat Linux offers more stability, power and control
    than any other OS.


    # ## New OS Features


    Easy to Use


    +   - Autodetect and configuration of hardware

    - NEW Graphical User Interface

    - Automatically starts GUI upon complete installation


    # ## New 2.2 Kernel


    +   - Enhanced performance

    - Automatic SMP support


    # ## Support for More Hardware


    # ## The Latest Optimized C Compiler


    # ## Installation Guide


    This step-by-step guide walks you through the entire installation process, including
    preparing for your first installation, booting the installation program, selecting
    packages and services, and handling any post-installation issues.


