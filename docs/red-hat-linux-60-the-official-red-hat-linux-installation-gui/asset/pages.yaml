    # 11.4 Configuring Console Access


    When (non-root) users log in to a console locally, they are given two types of
    special permission; they can run programs that they not otherwise be able to run,
    and they can access certain files (normally special device files used to access
    diskettes, CD-ROMS, etc.) that they would not be able to access.


    Since there are multiple consoles on a single computer, and multiple users can
    be logged into the computer locally at the same time, one of the users has to
    "win" to access the files. The first user to log in the console owns those files.
    The first user who logs in will be the root owner.


    In contrast, every user who logs in on the console will be allowed to run programs
    normally restricted to the root user. By default, those programs will ask for
    the user''s password. This will be done graphically if X is running which makes
    it possible to make these access items items from a graphical user interface.
    As shipped, the console-accessible programs are shutdown, halt, and reboot.


    **Disabling Console Access** In environments where the console is otherwise secured
    (BIOS and LILO passwords are set, control-alt-delete is disabled, the power and
    reset switches are disabled, etc.) it may not be desirable to allow arbitrary
    users at the console to shutdown, halt, and reboot.


    In order to disable access by users to console programs, you should run the command:


    ```

    rm -f /etc/security/console.apps/*

    ```


    **Disabling All Console Access** In order to disable all console access, in the
    /etc/pam.d/ directory, comment out all lines that refer to pam_console.so. The
    following script will do you the trick:'
