    # 6.9.3 Alternatives to LILO


    If you do not wish to use LILO to boot your Red Hat Linux system, there are a
    few alternatives:


    **Boot Diskette** You can use the boot diskette created by the installation program
    (if you elected to create one).


    LOADLIN can load Linux disk from MS-DOS: unfortunately, it requires a copy of
    the Linux kernel (and, if you have a SCSI adapter) to be available on an MS-DOS
    partition. The only way to accomplish this is to boot your Red Hat Linux system
    using some other method (from LILO on a diskette) and then copy the kernel to
    an MS-DOS partition. `LOADLIN` is available from

    http://metalab.unc.edu/pub/Linux/system/boot/loaders/ and associated mirror sites.


    SYSLUX is an MS-DOS program very similar to LOADLIN; it is also available from

    http://metalab.unc.edu/pub/Linux/system/boot/loaders/ and associated mirror sites.


    Some commercial bootloaders, such as *System Commander*, are able to boot Linux
    (but still require LILO to be installed in your Linux root partition).


