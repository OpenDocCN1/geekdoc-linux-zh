    **More Information** This is an introduction to PAM. More information is included
    in the /usr/doc/pam/ directory, including a System Administrators'' Guide, a Module
    Writers'' Manual, an Application Developers'' Manual, and the PAM standard, DCE-RFC
    86.0. In addition, documentation is available from the Red Hat website, at http://www.redhat.com/linux-info/pam/.


    # 11.7 Shadow Utilities


    Support for shadow passwords has been enhanced significantly for Red Hat Linux
    6.0. Shadow passwords are a method of improving system security by moving the
    encrypted passwords (normally found in /etc/passwd) to another file with more
    restrictive file access permissions. During the installation, you were given the
    option of setting up shadow password protection on your system.


    The shadow-utils package contains a number of utilities that support:


    +   * Conversion from normal to shadow passwords and back (pwconv, pwunconv).

    * Verification of the password, group, and associated shadow files (pwck, grpc).

    * Industry-standard methods of adding, deleting, and modifying user accounts (useradd,
    usermod, and us).

    * Industry-standard methods of adding, deleting, and modifying user groups (groupadd,
    groupmod, and groupdel).

    * Industry-standard method of administering the /etc/group file (grouppasswd).


    **Please Note:** There are a few additional points of interest concerning these
    utilities:


    +   * The utilities will work properly whether shadow is enabled or not.'
