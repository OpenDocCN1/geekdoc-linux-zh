    to a local area network, such as a group of computers in an office, or a wide
    area network, as the Internet. Before continuing, it''s important to know what
    hardware you have and how you intend to connect. If you''re going to dial into
    another computer, make sure your modem is installed and that the cables are arranged
    properly. If you''re using a network card, make sure it is installed properly
    and that the cables are correctly connected. Regardless of what network configuration
    you specify, if every phone line or cable is not in place, you''ll never get connected.
    We''ll start with modem connections and then move on to using network cards.'
