    sifying the appropriate image file.


    # B.2 Making a Diskette Under a Linux-like O/S


    To make a diskette under Linux (or any Linux-like operating system), you must
    have permiss-

    sion to write to the device representing a 3.5-inch diskette drive (known as /dev/fd0
    under Linux).

    First, label a blank, formatted diskette appropriately (eg. "Boot Diskette," "Supplemental
    Diskette,\n(etc.). Insert it into the diskette drive (don''t issue a mount command).
    After mounting the Red Hat

    Linux CD, change directory to the directory containing the desired image file,
    and use the following

    command (changing the name of the image file and diskette device as appropriate):


    ```

    dd if=boot.img of=/dev/fd0 bs=1440

    ```


    If you need to make another diskette, label another, and run dd again, specifying
    the appro-\pri image file.'
