- img_proc: true
  md: '# F7 Installation Using a Serial Terminal


    # F.6.4 Hard Disk Installation


    This installation method requires the contents of the Red Hat Linux/SPARC CD-ROM
    (or equivalent files) have been copied to a hard disk directly attached to your
    SPARC system. It is important to note that the partition holding these files cannot
    be used for any other purpose during the installation (ie, it cannot be a mount
    point during the installation). In addition, the partition must be in ext2 format.


    # F.6.5 HTTP Installation


    This installation method requires a local area network connection and access to
    an HTTP site with the Red Hat Linux/SPARC CD-ROM (or equivalent files).


    # F.7 Installation Using a Serial Terminal


    You can also install Red Hat Linux/SPARC using a serial terminal attached to your
    SPARC system. Any terminal that can emulate a VT100 (or a computer with terminal
    emulation software) will work fine. Boot as you would normally, and in the SILO
    prompt enter:


    ```

    linux serial

    ```


    The installation program runs on the first partition at 9600 baud, 8 bits, no
    parity, 1 stop bit (often called 9600,8.N.1). The installation program can run
    in color, if your serial terminal supports color. Note that a computer running
    kernel and connected to your SPARC system will display in color.


    At any prompt during a serial installation (any dialog with an Ok button), you
    can press Ctrl-Z to start a subshell. To return to the installation program, enter
    exit at the shell prompt.


    When the installation is complete, simply boot normally, and Red Hat Linux should
    come up on your serial terminal.


    **Please Note:** If you want to have a "headless" installation, you must use a
    serial terminal to perform the installation, and make sure you disable GPM.


    # F.8 SILO Configuration


    SILO configuration is nearly identical to LILO configuration. See Section 6.9
    on page 105 for more details.


    **Please Note:**Unlike LILO, SILO cannot be configured to boot other operating
    systems during the installation. However, information on configuring SILO to boot
    other operating systems is is available. Please read the file README in'
  merge: -1
