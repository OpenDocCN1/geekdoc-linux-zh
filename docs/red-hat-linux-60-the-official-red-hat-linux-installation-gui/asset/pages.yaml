  md: '# ## Glossary


    ### Dual Boot

    The act of configuring a computer system to boot more than one operating system.
    The name is something of a misnomer, as it is possible to boot more than the two
    operating systems the word "dual" implies.


    #### EIDE

    an abbreviation for Enhanced Integrated Drive Electronics, which is a newer version
    of the IDE interface standard and another term for a particular implementation
    of IDE devices. EIDE makes larger and faster disk drives possible; most systems
    today use EIDE.


    #### Errata

    Errata is Latin for "Oops.". When software is found to have bugs, often software
    is fixed, and released as errata. Red Hat Linux is no exception to the rule; we
    have an Errata web page http://www.redhat.com/errata.


    #### Extended Partition

    a segment of a disk drive that contains other partitions. See Partition.


    #### FAQ

    an abbreviation for Frequently Asked Questions. Linux information is often presented
    in the form of questions and answers FAQs.


    #### fdisk

    fdisk is a utility program that is used to create, delete or modify partitions
    on a disk.


    #### Filesystem

    A filesystem is the method by which information is stored on disk drives. Different
    operating systems normally use different filesystems, making it difficult to share
    the contents of a disk drive between two operating systems. However, Linux supports
    multiple filesystems, making it possible, for example to read/write a partition
    dedicated to Windows.


    #### Floppy

    a somewhat historical term for a small mass storage device in a removable cartridge,
    meant to be read/written in a compatible device. See "diskette."


    #### Formatting

    The act of writing a filesystem on a disk drive.


    #### FQDN

    an abbreviation for Fully Qualified Domain Name. An FQDN is the human-readable
    name that includes a computer''s hostname and associated domain name. For example,
    given hostname of "foo," and a domain name of "bar.com," the FQDN would be "foo.bar.com."


    #### FTP

    an abbreviation for File Transfer Protocol. Also the name of a program that, as
    the name implies, permits the copying of files from one system to another network.


    #### Gateway

    in networking terms, refers to a device that connects one or more computers to
    another other networks. The device may be specialized hardware (such as a router),
    or may be a general-purpose computer system configured to act as a gateway.


    > ^¹Well, it should be...'
