    For DHCP and boot configurations you only need to specify the Net device and the
    Kernel module. For the Net device, you will choose from a list where the eth prefix
    represents ethernet cards, the arc specifies an archant card and the tr specifies
    token ring cards. A complete list of network cards and their respective modules
