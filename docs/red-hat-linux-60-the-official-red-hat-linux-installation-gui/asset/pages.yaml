  md: '# Local Media Installations


    packages it needs in order to be fully functional, Red Hat Linux checks these
    package dependencies each time you install or remove software packages.


    After you have finished selecting packages to install, the installation program
    checks the list of dependencies. If any package requires another package which
    you have not selected to install, the program presents a list of these unresolved
    dependencies and gives you the opportunity to resolve them (see Figure 4.19 on
    the preceding page). If you simply press OK, the program will resolve them automatically
    by adding all required packages to the list of selected packages.


    # 4.11.4 Package Installation


    After all package dependencies have been resolved, the installation program presents
    a dialog box telling you that log file containing a list of all packages will
    be written to /tmp/install.log on your Red Hat Linux system. Select Ok and continue.


    At this point, the installation will format every partition you selected for formatting.
    This can take several minutes (and will even longer if you directed the installation
    program to check for bad blocks).


    Once all partitions have been formatted, the installation program starts to install
    packages. A window titled "Install Status" is displayed with the following information:


    +   - Package – The name of the package currently installed.


    +   - Size – The size of the package (in kilobytes).


    +   - Summary – A short description of the package.


    +   - Package Installation Progress Bar – A bar showing how complete the current
    package installation is.


    +   - Statistics Section – This section has three rows labeled "Total," "Completed,"
    and "Remaining." As you might guess, these rows contain statistics on the total
    number of packages that will be installed, statistics on the number of packages
    that have been completely installed, and statistics on the packages that have
    not been installed. The information tracked on these three rows:


    +   - Packages – The number of packages.


    +   - Bytes – The size.


    +   - Time – The amount of time.


    Overall Progress Bar – This bar changes color showing how close to completion
    the installation is.


    At this point there''s nothing left for you to do until all the packages have
    been installed. How quickly this happens depends on the number of packages you''ve
    selected, and your computer''s speed.


    Once all packages have been installed, please turn to Chapter 6 on page 91 to
    finish your installation of Red Hat Linux.'
  merge: -1
