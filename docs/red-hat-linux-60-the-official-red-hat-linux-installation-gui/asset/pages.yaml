  md: '# 8.2 System Configuration with the Control Panel


    # 8.2.2 Kernel Daemon Configuration


    Red Hat Linux includes kernel, which automatically loads some software and hardware
    support into memory as it is needed, and unloads it when it is no longer used.


    The tool shown in Figure 8.36 manages the configuration file for kernel. While
    kernel can load some things, such as filesystems, without explicit configuration,
    it needs to be told what hardware support to load when it is presented with a
    generic request.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_180_0.png)


    For instance, when the kernel wants to load for ethernet, kerneld needs to know
    which ethernet card you have, and if your ethernet card requires special configuration,
    it needs to know about that, too.


    # Changing Module Options


    To change the options being given to a module when it is loaded, click on the
    link to select it, then click the Edit button. kernelf will bring a window which
    looks like Figure 8.37 on the following page. The options kernelcfg knows (normally
    all available options) will each have their own field. Normally, you will ignore
    the Other arguments field. Some modules normally have no arguments; just in case,
    they have an Arguments field which allows you to enter configuration information.


    # Changing Modules


    To change which module gets invoked to provide a generic service, such as an ethernet
    card or SCSI host adapter module, you need to delete the old one and add a new
    one. To delete a module, select it by clicking on it, then click on Remove. Then
    click on Add to add the new module, as explained in the following section.'
