    # 5.7 SCSI Support


    When you choose the appropriate installation class, the installation program will
    probe your system for SCSI adapters. In some cases, the installation dialog will
    ask you whether you have any SCSI adapters. If you choose Yes, the following dialog
    prompts a list of SCSI drivers. Choose the driver that most resembles your SCSI
    adapter. The installation program then gives you an opportunity to specify options
    for the SCSI driver you selected; most SCSI drivers should detect your hardware
    automatically, however.


    For either the workstation or server-class installation, you should turn to Chapter
    6 on page 91 to delete at this time.


    # 5.8 Creating Partitions for Red Hat Linux


    At this point, it is necessary to let the installation program know where it should
    install Red Hat Linux. This is done by defining mount points for one or more disk
    partitions in which Red Hat Linux will be installed. You may also need to create
    and/or delete partitions at this time.


    **Please Note:** If you have not planned how you will set up your partitions,
    please refer to Section 2.9 on page 21, and review everything on page 32. For
    a bare minimum, you''ll need an appropriately-sized root partition, and a swap
    partition of at least 16 MB.


    If you are unsure about how to set up your partitions, please refer to Appendix
    C on page 239 for more information.


    The installation program then presents a dialog box that allows you to choose
    from two disk-partitioning tools (see Figure 5.11 on the facing page). The two
    choices you have are:


    +   - **Druid** – This is Red Hat Linux''s install-time disk management utility.
    It can create and delete disk partitions according to user-supplied requirements,
    in addition to managing multiple points for each.

    - **fdisk** – This is the traditional disk partitioning tool. While it is somewhat
    more flexible than Druid the downside is that fdisk assumes you have some experience
    with disk partitioning, and are comfortable with its terse interface.


    With the exception of esoteric situations, Disk Druid can handle the partitioning
    requirements for a typical Red Hat Linux installation.


    Note that there are some points you should be aware of if you decide to use Disk
    Druid under Red Hat Linux/SPARC. Please refer to Appendix F on page 339 for more
    information.'
