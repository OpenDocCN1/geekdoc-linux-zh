  md: '# E.3.1 Using Multiple Ethernet Cards


    You can use multiple Ethernet cards in one machine. If each card uses a different
    driver (e.g., 3509 and a DE425), you simply need to add alias (and possibly options)
    lines for each card to /etc/conf.modules. See Section 8.2.2 on page 165 for more
    information.


    If any two Ethernet cards use the same driver (e.g., 3c509 or a 3c595), and a
    3c595, you will need to give the two card addresses on the driver''s options line
    (in the case of ISA cards), or (for PCI cards) simply add one alias line for each
    card.


    For more information about using than one Ethernet card, see the Linux Ethernet-HOWTO.
    If you installed the howto package when you installed Red Hat Linux, you can find
    it in the file /usr/doc/HOWTO/Ethernet-HOWTO.'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Information Specific to Red Hat Linux/SPARC


    This appendix describes the differences between Red Hat Linux/SPARC and Red Hat
    Linux/Intel installations. While it provides a good overview of these differences,
    you will find it easier to read chapters 2, 3, 4, 5 and 6 in order. These chapters
    will refer you to the appropriate parts of this appendix at the appropriate time.


    In addition, there is a Linux/SPARC homepage at http://www.geog.ubc.ca/elinux.html.
    It has a wealth of information for people considering Red Hat Linux/SPARC, and
    is a great resource.


    # F.1 Supported Hardware


    Red Hat Linux/SPARC supports a variety of hardware based on the SPARC architecture.
    The most recent list of hardware supported by Red Hat Linux/SPARC can be found
    at Red Hat Software''s World Wide Web site at http://www.redhat.com/hardware.


    The following list is current as of the time this manual was produced:


    +   - sunic architecture machines (IPC, SS1, etc)'
  merge: -1
  pgno: 374
- img_proc: true
  md: '# Information Specific to Red Hat Linux/SPARC


    +   * sun4m architecture machines (Classic, SS5, SS10, etc)

    * sun4u (UltraSpar1, UltraSpar2, Enterprise UltraSparc servers)

    * btwwo, cg3, cg6, TCX framebuffers (24 bit on the TCX)

    * cg14 framebuffer (in cg3 mode)

    * SCSI and Ethernet on all of the above

    * type 4 and type 5 keyboards and mice

    * external SCSI drives

    * CD-ROM drives (external and internal)

    * SCSI / Ether SBUS expansion cards

    * Any original equipment Sun monitor for the above framebuffers


    Unsupported Hardware – The following list contains hard-ware that is currently
    unsupported:


    +   * VME based machines, such as the 4/690

    * SPARC 5 Model 170 machines

    * sun4d (SS1000, SS22000)

    * sun4 architecture

    * Eurocard sun4c machines, called the "sun4e" under Solaris2.4 and others, are
    not supported. These are VME-bus sun4e machines, which the kernel has not been
    posted yet.

    * The types of CD-ROMs are unsupported (for more information on CD-ROM compatibility,
    please visit:

    - http://satur-club.org/suncdfaq)

    - All NEC models

    - Some Toshiba XM-401B revisions

    - Toshiba XM-3201B

    - AppleCD 300 Plus on older SPARC PROM

    - Apple CD600


    # F.2 Installation Overview


    Red Hat Linux on a SPARC system is slightly more complex than installing Red Hat
    Linux/Intel, mostly due to differences in machine architecture. In general, the
    main steps to a successful installation are:


    +   1. Determine which console commands your SPARC systems supports.

    2. Determine whether you have sufficient memory to use a ramdisk-based installation.

    3. Determine how you will boot the installation program.

    4. Determine what installation method you will use.

    5. Determine whether you will install Red Hat Linux/SPARC from a serial terminal.

    6. Load and run the Red Hat Linux installation program.


    Let''s look at each of these steps in more detail.'
  merge: -1
  pgno: 375
- img_proc: true
  md: '# F.3 Console Commands


    # F.3 Console Commands


    SPARC systems have two different types of boot commands available, depending on
    the version of the system''s console PROM. Systems with a PROM version less than
    2.0 use what is known as the "old" style boot command, while systems whose PROM
    is at 2.0 or greater can use either the old or the new style boot commands. If
    your SPARC system''s console prompt is "ok," then your system is in new console
    mode, and you can use the new style boot command.


    In general, it''s preferable to use the new style boot command, if your system
    supports it. Of course, it''s possible to use the old style boot command, but
    you''ll need to know a bit more about your hardware configuration. An excellent
    reference on Sun hardware in general (and the old-style boot commands in particular)
    can be found in The Sun Hardware Reference, by James W. Birdsall. The file part2
    contains a detailed description of the various "ROM monitors" present in Sun Systems.


    In general, the new style boot command is boot, followed by a descriptive device
    name (such as floppy, cdrom, or net).


    The old style boot command is b, followed by a device specification in the following
    form:


    ```

    xx(a, b, c)

    ```


    Where xx is used to specify the device type (such as ad for SCSI disks), a is
    the controller number, b is the device''s unit number, and c is the partition
    number. Please refer to The Sun Hardware Reference if you have an older SPARC
    system, and require additional information on its boot command syntax.


    # F.4 Ramdisk-based Installation Criteria


    When the Red Hat Linux/SPARC installation starts, a ramdisk is loaded into memory.
    The ramdisk contains data and programs to perform the installation, and is approximately
    4 MB in size. The ramdisk takes memory away from the Red Hat Linux/SPARC installation
    program, so your SPARC system must have at least 12 MB of memory in order to successfully
    use a ramdisk-based installation.


    For SPARC systems with less than 12 MB of RAM, another approach is available.
    It is known as an NFS-mounted root. As the name implies, instead of using a ramdisk
    to hard parts of the Red Hat Linux/SPARC installation program, an NFS server is
    used to export the files to the SPARC system. While this approach uses less memory,
    it is more complex to set up.


    Note:Red Hat Linux/SPARC may also be installed by booting from the Red Hat Linux/SPARC
    CD-ROM. This method uses neither a ramdisk or an NFS-mounted root, as the necessary
    files are already present on the Red Hat Linux/SPARC CD-ROM. We will discuss booting
    from CD-ROM in Section F.5.2 on page 363.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_376_0.png)'
  merge: -1
  pgno: 376
- img_proc: true
  md: +   Boot From the Network — The installation program is read from a TFTP server.
  merge: -1
  pgno: 377
- img_proc: true
  md: '# F.5 Choosing a Boot Method


    # F.5.1 Booting From Diskette


    If your SPARC system has a disk drive, you can boot the Red Hot Linux/SPARC installation
    program from a diskette. The boot disk image (known as boot32.img for Sun4 and
    Sun4; and boot64.img for UltraSparc) is located in the images/ directory on your
    Red Hot Linux/SPARC-DOM. A ramdisk disk image (known as ramdisk.img) is also available.
    Please refer to Appendix B on page 237 for instructions on writing the image file
    to a diskette. Make sure the boot and ramdisk disks are appropriately.


    # Diskette Boot Commands


    For SPARC systems with a PROM version of 2.0 or greater, the proper boot command
    (when in command mode) is:


    ```

    boot floppy

    ```


    On the other hand, SPARC systems with PROM versions less than 2.0 should use the
    boot command at the > prompt:


    ```

    b fd()

    ```


    **Note:**There have been reports that some systems with pre-2.0 PROMs cannot boot
    the Red Hot Linux/SPARC installation program from diskette. If you find this to
    be the case with your SPARC system, you will need to use another boot method.


    # F.5.2 Booting From CD-ROM


    If your SPARC system has a fully-supported CD-ROM drive, you can boot directly
    from the Red Hot Linux/SPARC CD-ROM. For SPARC systems with a PROM version of
    2.0 or better, use the following command when in command mode:


    ```

    boot cdrom

    ```


    SPARC systems with PROM versions less than 2.0 may not be able to boot from a
    CD-ROM at all, although we''ve received reports that at least some PROM 1.3 systems
    have been able to boot from CD-ROM. If your SPARC system has a CD-ROM over SCSI
    id 6, the following command should boot the Red Hot Linux/SPARC installation program:


    ```

    b add(0,6,0)

    ```


    Note that using an NFS-mounted root after booting from CD-ROM is not supported,
    as the filesystem on the Red Hot Linux/SPARC CD-ROM performs the same function
    as an NFS-mounted root. Therefore, no additional boot command is given for CD-ROM
    boots.'
  merge: -1
  pgno: 378
- img_proc: true
  md: '# F.5.3 Booting From the Network


    There are two types of network boots supported by the Red Hat Linux / SPARC installation
    program:


    +   - Network boot with NFS-mounted root. This method is required for SPARC systems
    with less than 16 MB of RAM.

    - Network boot with network-loaded ramdisk. This method can be used by systems
    with at least 16 MB of RAM.


    While booting your SPARC system from the network is fairly straightforward, there
    are several requirements:


    +   - Your SPARC system must have a network connection.

    - Your network must be able to give your SPARC system its IP address via a rarp.

    - You must have a TFTP server that can download the Red Hat Linux/SPARC kernel
    and installation program to use your SPARC system.

    - If you are going to use an NFS-mounted root, an NFS server capable of exporting
    the Red Hat Linux/SPARC CD-ROM (or equivalent files).


    # Setting up RARP


    If you are going to use rarp, please refer to Section F4.1 on page 362.


    TFTP Server Setup If you are going to set up a TFTP server on a Red Hat Linux
    system, simply install the latest tftp package using RPM, and make sure the line
    in inet.conf that will run tftp is uncommented. Don''t forget to kill -HUP inetd
    if you needed to make any changes to inet.conf.


    Next, you''ll need to make a symlink describing the SPARC system to be booted,
    and pointing to the file from which it should boot. items:


    +   - The IP address of the system to be booted, in hexadecimal.

    - A string describing the architecture of the system to be booted.


    To convert the number "dotted decimal" IP address into its hex, convert each of
    the address four groups of numbers into hex. If the resulting hex number is only
    one digit, add a leading zero to it. Then append all four hex numbers together.
    For example, take the IP address 10.0.2.254. Convert each of four numbers into
    hex, and add a leading zero where necessary:


    ```

    10 = A or 0A

    0 = 0 or 00

    2 = 2 or 02

    254 = FE or FE

    ```'
  merge: -1
  pgno: 379
- img_proc: true
  md: '# F5 Choosing a Boot Method


    Therefore, the IP address 10.0.2.254 in hex is: 0A002FE.

    If you have perl on a system, you can use the following command (modified to include

    y system''s IP address, of course) to have your IP address converted for you:


    ```

    # perl -e ''printf "%02x%x4.\n",10,0,2,254;

    0a002fe''

    ```


    Here we had perl convert 10.0.2.254 for us.

    The second part of the symlink name is the SPARC system''s architecture. For our
    example, we''ll use

    SUN4M. The IP address and architecture are separated by a dot, resulting in this
    symlink name:


    ```

    0A002FE.SUN4M

    ```


    The last step is figuring out what this symlink should point to. There are two
    choices. If you want to

    use an NFS-mounted root, use the:


    ```

    # kernels/vmlinux32 -- for Sun4c and Sun4m

    kernels/vmlinux64 -- for UltraSparc

    ```


    If you would use a ramdisk, use the file


    ```

    images/ftp32.img -- for Sun4c and Sun4m

    images/ftp64.img -- for UltraSparc

    ```


    Place the appropriate file in the TFTP server''s directory, and create the symlink.
    In this example,

    we''re using the image that includes a ramdisk:


    ```

    ln -s ftp32.img 0A002FE.SUN4M

    ln -s ftp64.img 0A002FE.SUN4U

    ```


    # Network Boot Commands


    You''re now ready to boot. If you are going to boot ftp32.img or ftp64.img, simply
    use the

    following command (in new command mode):


    ```

    boot net

    ```


    On the other hand, if you are going boot from vmlinux32 or vmlinux64 and use an
    NFS-mounted

    root, use this command:


    ```

    boot net linux nfsroot=nfs.server.IP.address:/path/to/RH/image

    ```'
