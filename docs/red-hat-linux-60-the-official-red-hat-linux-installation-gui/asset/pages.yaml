  md: '# 4.11 Selecting and Installing Packages


    # 4.11.1 Selecting Components


    Component group packages together according to the functionality they provide.
    For example, C Development, Networked Workstation, or Web Server. Select each
    component you wish to install and press Space. Everything (which can be found
    at the end of the component list) installs all packages included with Red Hat
    Linux (see Figure 4.16). Selecting every package will require you to have GB of
    free disk space.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_76_0.png)


    Figure 4.16: Selecting System Components


    If you wish to select or deselect individual packages, check the Select individual
    packages box.


    # 4.11.2 Selecting Individual Packages


    After selecting the components you wish to install, you may select or deselect
    individual packages. The installation program presents a list of the package groups
    available; using the arrow keys, select a group to examine and press Enter Space
    The installation program presents a list of the packages in that group, which
    you may select or deselect by using the arrow keys to highlight a package, and
    pressing Space


    Please Note: Some packages (such as the kernel and certain libraries) are required
    for every Red Hat Linux system and are not available to select or deselect.


    # Quick Keys


    +   - o – shows that at least one of the packages in that component group has
    been selected.'
