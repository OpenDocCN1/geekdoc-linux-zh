    **Defining the Console** The /etc/security/console.perms defines the console group.
    The syntax of that file is very flexible, so it''s possible to edit file so that
    these instructions no longer apply. The default file has a line like this:


    ```

    <console>=tty[0-9] [0-9] * : [0-9]

    .[0-9] [0-9]

    ```


    When you log in, they are attached to some sort of master terminal, either X server
    with a name like :0 or mymachine.example.com:1; or a device like /dev/tty0 or
    /dev/pts/2. The default is to define local virtual consoles and local X servers
    are considered, but if you want to consider the serial terminal next to you on
    /dev/ttyS1 to be local, which can change line to like:


    ```

    <console>=tty[0-9] [0-9] * : [0-9]

    .[0-9] [0-9] /dev/ttyS1

    ```


    **Making Files Console-Accessible** In /etc/security/console.perms, there is a
    section with lines like:


    ```

    <cdrom>=/dev/cdrom

    ```


    You can add your own lines:


    ```

    <scanner>=/dev/sga

    ```


    (of course, make sure that /dev/sga is really your scanner and not, say, your
    hard drive).\That''s the first part. The second part is to define what is done
    with those files. Look in the last section of /etc/security/console.perms for
    lines similar to


    ```

    <console> 0600 <cdrom> 0600 root

    ```


    and add a line like


    ```

    <console> 0600 <scanner> 0600 root

    ```


    When you log in at the console, you will be given ownership of the /dev/sga device
    and the permissions will be 0600 (readable and writable by you only). When you
    log out, the device will be owned by root and still have 0600 (now: readable and
    writable by root only) permissions.'
