  md: '# Upgrading Packages


    When a new version of a package has been released, it is easy to install it on
    your system. Select the packages from the window of available packages in the
    same way you select packages for installation.

    Both the Upgrade button on the toolbar, from the menu, under Operations ⇒ Upgrade
    will begin the process. You simply add packages in the same manner as you would
    a new package installation.


    During the upgrade, you''ll see a progress indicator like the one for installing
    packages. When it''s finished, any old versions of the packages will be removed,
    unless you specify otherwise (refer to Section 10.4 on page 188 for more information).


    It is much better to use the upgrade option than to uninstall the old versions
    of a package and then install the new one. Using upgrade ensures that any changes
    you make to package configuration files are preserved properly, while uninstalling
    and then reinstalling a new package could cause those changes to be lost.


    If you run out of disk space during an installation, the install will fail. However,
    the package which was being installed when the error occurred may leave some files
    around. To clean this up, reinstall the package you''ve made more disk space available.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_209_0.png)'
