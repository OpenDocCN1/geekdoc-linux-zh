    The screen is a little confusing because neither the title, nor description really
    explains the screen’s purpose. Linuxconf seems to be asking for the new password,
    which isn''t actually the case. Linuxconf wants the root password to access the
    root account. Linuxconf does require access to root, but once there’s nothing
    to keep anyone from sitting down at the computer if the person using Linuxconf
    stays out for a minute. The pitfalls are evident: If the person who was originally
    using Linuxconf logs out of root, they won''t be able to get back into it. A lack
    of validation would give rein over the computer whoever had changed root’s password.

    Once have entered root’s password, it will prompt you for a new password. There
    is also a field called Confirmation where you will need to type the password again
