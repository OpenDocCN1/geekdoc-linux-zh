    # 6.8 Creating a Boot Diskette


    Next, you''ll be given the opportunity to create a customized boot diskette for
    your Red Hat Linux system (see Figure 6.18 on the facing page).


    A boot diskette can be handy for a number of reasons:


    +   - Use It Instead of LILO – You can use a boot diskette instead of LILO. This
    is handy if you''re trying Red Hat Linux for the first time, and you''ll feel
    more comfortable if the boot process for your other operating system is left unchanged.
    With a boot diskette, going back to your other operating system is as easy as
    removing the boot diskette and rebooting.

    - Use In Enmerges – The boot diskette can also be used in conjunction with a rescue
    disk, which will give you the tools necessary to get an ailing system back on
    its feet again.

    - Use When Another Operating System Overwrites LILO – other operating systems
    may not be as flexible as Red Hat Linux when it comes to supported boot methods.
