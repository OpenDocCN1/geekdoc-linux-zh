  md: '# 4.7 Creating Partitions for Red Hat Linux


    # Disk Druid''s Buttons


    buttons control Disk Druid''s actions. They are used to add and delete partitions,
    and to change partition attributes. In addition, there are buttons that are used
    to accept the changes you''ve made, or to exit Disk Druid entirely. Let''s take
    a look at each button in order.


    +   Add - The "Add" button is used to request a new partition. When selected,
    a dialog box will appear containing fields that must be filled.


    +   Edit - The "Edit" button is used to modify attributes of the partition currently
    highlighted in the "Current Disk Partitions" section. Selecting this button will
    cause a dialog box to appear. Some or all of the fields in the "Edit Partition"
    dialog box may be changed, depending on whether the partition information has
    already been written to disk or not.


    +   Delete - The "Delete" button is used to delete the partition currently highlighted
    in the "Current Disk Partitions" section. Selecting this button will cause a dialog
    box to appear asking you to confirm the deletion.


    +   Ok - The "Ok" button causes any changes you have made to be written to disk.
    You will be asked to confirm your changes before Disk Druid rewrites your hard
    partition table(s). In addition, any mount points you''ve defined are passed to
    the installation program, and will eventually be defined by your Red Hat Linux
    system to define the filesystem layout.


    +   Back - This button calls Disk Druid to abort without saving any changes you''ve
    made. When this button is selected, the installation program will take you back
    to the previous screen, so you can start over.


    # Handy Function Keys


    While there is some overlap between Disk Druid''s buttons and the available functions
    keys, there are two keys that have no corresponding buttons:


    +   F2 (Add NFS) - This key is used to add a read-only NFS-served filesystem to
    the set of mount points on your Red Hat Linux system. When selected, a dialog
    box will appear containing fields that must be filled.


    +   F5 (Reset) - This key is used to discard all changes you have made in Disk
    Druid, and return the list of partitions to read from the partition table(s) of
    your hard disk(s). When selected, you will be asked to confirm you want to discard
    the changes. Note that any mount points you''ve specified will be lost, and will
    need to be reentered.


    Note Note: You will need to dedicate at least one partition to Red Hat Linux,
    and optionally more. This is discussed more completely in Section 2.8.5 on page
    29.


    Now''s see how Disk Druid is used to set up partitions for your Red Hat Linux
    system.'
