  md: '# 9 Package Management with RPM


    The Red Hat Package Manager (RPM) is an open packaging system available for anyone
    to use, and works on Red Hat Linux as well as other Linux and UNIX systems. Red
    Hat Software encourages other vendors to take the time to look at RPM and use
    it for their own products. RPM is distributable under the terms of the GPL.


    For the end user, RPM provides many features that making a system far easier than
    it has ever been. Installing, uninstalling, and upgrading RPM packages are all
    one line commands, and all the messy details have been taken care of. RPM maintains
    a database of installed packages and their files, which allows you to perform
    powerful queries and verification of your system. During upgrades, you can configure
    configuration files specially, so that you never lose your customizations – a
    feature that is impossible without RPM.


    For the developer, RPM allows you to take source code for software and package
    it into source and binary packages for end users. This process is quite simple
    and driven from a single file and optional patches that you create. This clear
    delineation of "pristine" sources and your patches and build instructions ensures
    the maintenance of the package as new versions of the software are released.


    **Please Note:** Although it does not hurt to understand the concepts behind RPM,
    there is an alternative for installing, uninstalling and upgrading packages. For
    those of you that prefer a graphical interface to the command line, we suggest
    you use GnoRPM. Please see Chapter 10 on page 183 for more information.'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# 9.1 RPM Design Goals


    Before trying to understand how to use RPM, it helps to have an idea of what the
    design goals are.


    **Upgradability.** With RPM you can upgrade individual components of your system
    without completely reinstalling. When you get a new release of an operating system
    based on RPM (such as Red Hat Linux), you don''t need to reinstall on your machine
    (as you do with operating systems based on other packaging systems). RPM allows
    intelligent, fully-automated, in-place upgrades of your system. Configuration
    files in packages are preserved across upgrades, so you won''t lose your customizations.


    **Powerful Querying** RPM is also designed to have powerful querying options.
    You can search through your entire database for packages or certain files. You
    can easily find out what package file belongs to where it came from. The RPM packages
    are in a compressed archive, with a custom binary header containing useful information
    about the package and its contents, allowing you to query packages quickly and
    easily.


    **System Verification** Another powerful feature is to verify packages. If you
    are worried that you deleted an important file for some package, verify the package.
    You will be notified of anomalies. At any point, you can reinstall the package
    if necessary. Any configuration files that you modified are preserved during reinstallation.


    **Pristine Sources.** A crucial design goal was to allow the use of "pristine"
    software sources, as distributed by the original authors of the software. With
    RPM, you have the pristine sources with any patches that were used, plus complete
    build instructions. This is a big advantage for several reasons. For instance,
    if a new version of a program comes out, you don''t need to start from scratch
    to get it. You can look at the patch to see what might need to do. All the compiled-details,
    and all of the changes that were made to get the software to build properly are
    easily visible this way.


    This goal may only seem important for developers, but it results in higher quality
    software for end users too. We would like to thank the folks from the BOGUS distribution
    for originating the pristine source concept.


    # 9.2 Using RPM


    RPM has five basic modes of operation (not counting package building): installing,
    uninstalling, upgrading, querying, and verifying. This section contains an overview
    of each mode. For complete details and options rpm --help, or turn to Section
    9.4 on page 182 for more information on RPM.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# 9.2 Using RPM


    # 9.2.1 Installing


    RPM packages typically have file names like foo-1.0-1386.rpm, which includes the
    package name (foo),version (1.0), release (1) and architecture (i386). Installing
    a package is as simple as:


    ```

    # rpm -ivh foo-1.0-1386.rpm

    foo ########################################

    ```


    As you see, RPM prints out the name of the package (which is not necessarily the
    same as the file name, which could have been ..rpm), and then prints a succession
    of hash marks as the package installed, as a sort of progress meter.


    Installing packages is designed to be simple, but you can get a few errors:


    # Package Already Installed


    If the package is already installed, you will see:


    ```

    # rpm -ivh foo-1.0-1386.rpm

    foo package foo-1.0-1 is already installed

    error: foo-1.0-1386.rpm cannot be installed

    #

    ```


    If you really want to install the package anyway, you can use --replacepkgs on
    the command line, which tells RPM to ignore the error:


    ```

    # rpm -ivh --replacepkgs foo-1.0-1386.rpm

    foo ########################################

    #

    ```


    # Conflicting Files


    If you attempt to install a package that contains a file that has already been
    installed by another package, you''ll see:


    ```

    # rpm -ivh foo-1.0-1386.rpm

    foo usr/bin/foo conflicts with file from bar-1.0-1

    error: foo-1.0-1386.rpm cannot be installed

    #

    ```'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'To cause RPM to ignore that error, use --replacefiles on the command line:


    ```

    # rpm -ivh --replacefiles foo-1.0-1.i386.rpm

    foo

    # #######################################

    ```


    # Unresolved Dependency


    RPM packages can "depend" on other packages, which means that they require other
    packages to be installed in order to run properly. If you try to install a package
    for which there is such an unresolved dependency, you''ll see:


    ```

    # rpm -ivh bar-1.0-1.i386.rpm

    failed dependencies:

    foo is needed by bar-1.0-1

    #

    ```


    To handle this error you should install the requested packages. If you want to
    force the installation any way (a bad idea since the package probably will not
    run correctly), use --nodeps on the command line.


    # 9.2.2 Uninstalling


    Uninstalling a package is as simple as installing:


    ```

    # rpm -e foo

    #

    ```


    Notice we used the package name "foo", not the name of the original package file
    "foo-1.0-1.i386.rpm".


    You can encounter a dependency error when uninstalling a package if some other
    installed package depends on the one you are trying to remove. For example:


    ```

    # rpm -e foo

    removing these packages would break dependencies:

    foo is needed by bar-1.0-1

    #

    ```


    To cause RPM to ignore that error and uninstall the package anyway (which is also
    a bad idea since the package that depends on it will probably fail to work properly),
    use --nodeps on the command line.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# 9.2 Using RPM


    # 9.2.3 Upgrading


    Upgrading a package is almost just like installing.


    ```

    # rpm -Uvh foo-2.0-1.1386.rpm

    foo ####################################

    #

    ```


    What you don''t see above is that RPM automatically uninstalled any versions of
    the foo package. In fact you may want to use -i to install packages, since it
    works fine when there are no previous versions of the package installed.


    Since RPM performs combination of uninstalling and installing, with configuration
    files, you may see a message:


    ```

    saving /etc/foo.conf as /etc/foo.conf.rpmsave

    ```


    This means that your changes to the configuration file may not be "forward compatible"
    with the new configuration file in the package, so RPM saved your original file,
    and installed a new one. You should investigate and resolve the differences between
    the two files as soon as possible to ensure that your system continues to function
    properly.


    Since upgrading is really a combination of uninstalling and installing, you can
    encounter any errors from those modes, plus one more: If RPM thinks you are trying
    to upgrade a package with an older version number, you will see:


    ```

    # rpm -Uvh foo-1.0-1.1386.rpm

    package foo-2.0-1 (which is newer) is already installed

    error: foo-1.0-1.1386.rpm cannot be installed

    #

    ```


    To cause "upgrade" anyway, use --oldpackage on the command line:


    ```

    # rpm -Uvh --oldpackage foo-1.0-1.1386.rpm

    foo ####################################

    #

    ```


    # 9.2.4 Freshening


    Freshening a package is similar to upgrading:'
  merge: -1
  pgno: 192
- img_proc: true
  md: '# 178 Package Management with RPM


    ```

    # rpm -Fvh foo-1.2-1.i386.rpm

    foo #

    ```


    RPM''s freshen option checks the versions of the packages specified on the command
    line against the versions of packages that have already been installed on your
    system. When a newer version of an-installed package is processed by RPM''s freshen
    option, it will be upgraded to the newer version. RPM''s freshen option will not
    install a package if no previously-installed package of the same name exists.
    This differs from RPM''s upgrade option, as an upgrade will install packages,
    whether or not an older version of the package is installed.


    RPM''s freshen option works well with single packages or with a group of packages.
    It''s especially handy if you''ve just downloaded a large number of different
    packages, and you only want to upgrade those packages that are already installed.
    Using the freshen option means that you won''t have to pick through the downloaded
    packages, deleting any unwanted ones before using RPM.


    In this case, you can simply use the following command:


    ```

    # rpm -Fvh *.rpm

    ```


    RPM will automatically upgrade only those packages that have already been installed.


    # 9.2.5 Querying


    Querying the database of installed packages is accomplished with rpm -q. A simple
    use is rpm -q foo which will print the package name, version, and release number
    of the installed package:


    ```

    # rpm -q foo

    foo-2.0-1

    #

    ```


    Instead of specifying the package name, you can use the following options with
    -q to specify what(s) to query. These are called Package Specification Options.


    +   - -a queries currently installed packages.

    - -f <file> will query the package owning <file>.

    - -p <packagefile> queries the package <packagefile>.


    There are a number of ways to specify what information to display about queried
    packages. The following options are used to select the information you are interested
    in. These are called Information Selection Options.'
  merge: -1
  pgno: 193
- img_proc: true
  md: "# 9.2 Using RPM\n\n+   - -i displays package information such as name, description,\
    \ release, size, build date, install date, vendor, and other miscellaneous information.\n\
    - -l displays the list of files that the package \"owns\".\n- -s displays the\
    \ state of all the files in the package.\n- -d displays a list of files marked\
    \ as documentation (man pages, info pages, README, etc).\n- -c displays a list\
    \ of files marked as configuration files. These are the files you change after\
    \ installation to adapt the package to your system (sendmail.cf, passwd, inittab,\
    \ etc.).\n\nFor other options that display file lists, you can add -v to your\
    \ command line to get the lists in familiar ls -l format.\n\n# 9.2.6 Verifying\n\
    \nVerifying a package compares information about files installed from a package\
    \ with the same information from the original package. Among other things, verifying\
    \ compares the size, MD5 sum, permissions, owner and group of each file.\nrpm\
    \ -V verifies a package. You can use any of the Package Selection Options for\
    \ querying to specify the files you wish to verify. A simple use is rpm -V foo\
    \ verifies that all the files in the foo package are as they were when they were\
    \ originally installed. For example:\n\n+   - To verify a package containing particular\
    \ file:\n  rpm -V /bin/vi\n- To verify ALL installed packages:\n  rpm -Va\n- To\
    \ verify an installed package against an RPM package file:\n  rpm -Vp foo-1.0-1386.rpm\n\
    This can be useful if you suspect your RPM databases are corrupt.\n\nIf everything\
    \ verified properly there will be no output. If there are any discrepancies they\
    \ will be displayed. The format of the output is a string of 8 characters, possible\
    \ \"c\" denoting a configuration file, and the file name. Each of the 8 characters\
    \ denotes the result of a comparison of one attribute of the file to the value\
    \ of that attribute recorded in the RPM database. A single \".\" (period) means\
    \ the test passed. The following characters denote failure of certain tests:\n\
    \nMD5 checksum"
