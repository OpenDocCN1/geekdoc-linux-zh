    | Novell? | 51 | DOS access | e1 |

    | Microport | 52 | DOS R/O | e3 |

    | GNU HURD | 63 | DOS secondary | f2 |

    | Novell Netware 286 | 64 | BBT | ff |


    Figure C.6: Partition Types


    Now you might be wondering how this additional complexity is normally used. See
    Figure C.7 on the facing page for an example.


    That’s right – in many cases there is a single partition spanning the entire disk,
    essentially duplicating the pre-partitioned days of yore. The partition table
    has only one entry, and points to the start of the partition. We’ve labeled this
    partition as being of type “DOS,” although as you can see from Figure C.6, that’s
    a bit simplistic, but adequate for the purposes of this discussion. This is a
    typical partition layout for most newly purchased computers with some version
    of Windows pre-installed.


    # C.1.3 Partitions within Partitions – An Overview of Extended Partitions


    Of course, in time it became obvious that four partitions would not be enough.
    As drives continued to grow, it became more and more likely that a person could
    configure fairly-sized


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_259_0.png)'
