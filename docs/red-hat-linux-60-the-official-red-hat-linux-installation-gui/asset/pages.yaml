    The installation program will display a screen similar to the one in Figure 6.21
    on the following page. Every partition that may be bootable is listed, including
    partitions used by other operating systems. The "Boot label" column will be filled
    in linear with the word linux on your Red Hat system''s root filesystem. Other
    partitions may also have labels. If you would like to add boot labels for other
    partitions (or change an existing boot), use the arrow keys to highlight the desired
    partition. Use the Tab key to select the Edit button, and press Space. You will
    then see a small dialog box to enter/modify the partition''s boot label. Press
    Ok when done.


    The contents of the "Label" column will be what you will need to enter at LILO''s
    Boot: in order to boot your operating system. If you forget the boot labels defined
    on your system, you can press ? at LILO''s Boot: prompt to display a list of defined
    labels.


    There is also a column labeled "Default." Only one partition will have an asterisk
    under column. The partition marked will be the LILO root if there is no user input
    during the boot process. Initially the root partition will be for your Red Hat
    Linux installation. If you''d like to change this, use the arrow keys to highlight
    the partition you''d like to make the default, and press F2. The asterisk should
    move to the selected partition. When you''ve finished, select Ok, and press Space.'
