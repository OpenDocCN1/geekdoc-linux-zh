    # Adding NFS Mounts – General Overview


    NFS stands for Network FileSystem. It is a way for computers to share sections
    of their local filesystems across a network. These sections may be as small as
    a single directory, or include thousands of files in a vast hierarchy of directories.
    For example, many companies will have a single mail server with individuals''
    mail served as an NFS mount to each users'' local systems.


    To add an NFS mount:


    +   -1. Start Linuxconf by typing linuxconf at the shell prompt.


    +   -2. Open Config File systems => Access nfs volume


    +   -3. On the NFS volume screen (see figure 8.13 on the page before), select
    Add.


    The three fields on the Base tab are what you''ll need to concern yourself with.


    +   - Server – The host name of the machine the desired filesystem resides on.
    For example, foo.bar.com.


    +   - Volume – The filesystem you wish to add. For example, /var/spool/mail.


    +   - Mount point – Where in your system you want the remote filesystem accessible
    from. For example, /mnt/mail.'
