  md: '# Adding Modem/PPP/SLIP connections – Quick Reference


    +   1. Start Linuxconf by typing linuxconf at the shell prompt.


    +   2. Open Config ⇒ Networking ⇒ PPP/SLIP/PLIP


    +   3. Select Add.


    +   4. Select the type of connection.


    +   5. Enter the Phone number, login name and password.


    +   6. Select Use PAP authentication only if necessary (only available for PPP
    accounts).


    +   7. Select Accept.


    # Adding Modem/PPP/SLIP connections – General Overview


    There are several pieces of information you will need to get from your ISP (Internet
    Service Provider) or systems administrator before configuring your PPP or SLIP
    account. In the case of some providers, you may have to sort through directions
    on how to set up a PPP connection on Linux. Some providers are ill-equipped to
    handle individuals just like you. I don''t want to get connected, I just need
    some bit of information. The following is what you need for a connection with
    Red Hat Linux. The ISP representatives may respond that you don''t need this information,
    or may suggest that you need more than this. Red Hat has streamlined the information
    needed using intelligent defaults and tools such as Linuxconf to simplify this
    process for you. Unless you have a document specifically for Red Hat Linux, just
    request the information below and go from there. Specifically, you''ll need:


    +   - the IP address for a domain nameserver (DNS);


    +   - the phone number to dial;


    +   - your login and password;


    +   - an IP address for your machine if the network you are connecting to isn
    not going to provide you with a dynamic one;


    +   - whether not your ISP uses an authentication method such as PAP, CHAP or
    MS-CHAP. If so, you will need a "secret" to enable authentication. The secret
    will be a word or sequence of characters. CHAP and MS-CHAP are not currently supported
    using Linuxconf, and rarely used.


    Additional information which may be helpful, but isn''t necessary includes a secondary
    nameserver address, and a search domain. Once you have all this information, you''re
    ready to get connected.


    +   - Start Linuxconf by typing linuxconf at the shell prompt.'
  merge: -1
