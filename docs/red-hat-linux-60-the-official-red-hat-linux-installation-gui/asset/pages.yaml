  md: '# New Features of Red Hat Linux 6.0


    # 1.3 Miscellaneous New Features


    Other miscellaneous features of Red Hat Linux 6.0:


    +   - Enhanced Font Support

    - Enhanced Initscripts

    - Switchdesk Feature

    - Latest Stable 2.2 Kernel Included


    # Enhanced Font Support


    TrueType fonts are now supported in Red Hat Linux 6.0 as a font-server on a local
    machine.

    dynamic font loading is now supported and can be used as a font-server.


    **Note**: Those of you who upgrade will not have this feature until you edit your
    fontpaths. To do this you must edit the `/etc/X11/X86Config` file. Scroll down
    until you see fontpaths listed. Replace them all with `FontPath ''tcp://localhost:7100''`.
    You must also verify that `xfs`, the X Server, is running. By issuing the command
    `/sbin/chkconfig --add xfs` you will ensure that it starts at system boot time.


    # Enhanced Initscripts


    While booting and shutting down the system, Red Hat Linux 6.0 users are now able
    to see if a service has failed by displaying `OK, PASSED or FAILED` at the right-hand
    side of the screen.


    # Switchdesk Feature


    Switchdesk, just as the name implies, allows you to easily switch between different
    desktop environments such as GNOME, AnotherLevel or KDE. Simply run `switchdesk`
    and choose your desired interface.


    # Latest Stable 2.2 Kernel Included


    Red Hat Linux 6.0 includes the latest stable version of the 2.2 Linux kernel.'
  merge: -1
