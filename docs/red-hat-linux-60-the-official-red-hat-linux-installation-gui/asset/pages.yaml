    # 6.6 Setting a Root Password


    The installation program will prompt you to set a root password for your system
    (see Figure 6.16 on the next page). You''ll use the root password to log into
    your Red Hat Linux system for the first time.


    The root password must be at least six characters long; the password you type
    is not echoed to the screen. You must enter the password twice; if the two passwords
    do not match, the installation will ask you to enter them again.


    You might make the root password something you can remember, but not someone else
    to guess. Your name, phone number, query, password, root, and and ancestor are
    all examples of poor passwords. Good passwords mix numbers with upper and lower
    case letters and do not contain dictionary words. Hard387vark or 420BMTNT, for
    example. Remember that the password is case-sensitive. Write down this password
    and keep it in a secure place.


    **Note:** The root user (also known as the superuser) has complete access to the
    entire system; for this reason, logging in as the root user is best only to perform
    system maintenance or admin-'
