- img_proc: true
  md: "# 11.1.1 Overview of the FSSTND\n\nThe directories and files noted here are\
    \ a small subset of those specified by the FSSTND document. Check the latest FSSTND\
    \ document for the most up-to-date and complete information.\n\nThe /dev Directory\
    \ The /dev directory contains file system entries that represent devices that\
    \ are attached to the system. These files are essential for the system to function\
    \ properly.\n\nThe /etc Directory The /etc directory is reserved for configuration\
    \ files that are local to your machine. No binaries are to be put in /etc. Binaries\
    \ that were in the past put in /etc should go into /sbin or possibly /bin.\n\n\
    The X11 and skel directories should be subdirectories of /etc:\n\n```\n/etc\n\
    \  - X11\n  - skel\n```\n\nThe X11 directory is for X11 configuration files as\
    \ XF86config. The skel directory is for \"skeleton\" users, which are used to\
    \ populate a home directory when a user is first created.\n\nThe /lib Directory\
    \ The /lib directory should contain only libraries that are needed to execute\
    \ the binaries in /bin and /sbin.\n\nThe /proc Directory The /proc directory contains\
    \ special files that either extract or send information to the kernel. It is an\
    \ easy method of accessing information about the operating system using the cat\
    \ command.\n\nThe /sbin Directory The /sbin directory is for executables used\
    \ only by the root user, and only the executables needed to boot and mount /usr\
    \ and perform system recovery operations. The FSSTND says:\n\n> \"/sbin typically\
    \ contains files essential for booting the system in the binaries in /bin. Anything\
    \ executed after /usr is known to be mounted (when there are problems) should\
    \ be placed in /usr/sbin. Local-only system administration binaries should be\
    \ placed into /usr/local/sbin.\\\"\n\nAt a minimum, the following programs should\
    \ be in /sbin:\n\n```\nclock, getty, init, update, mkswap, swapon, swapoff, halt,\n\
    reboot, shutdown, fdisk, fsck.\\*, mkfs.\\*, lilo, arp, ifconfig,\nroute\n```"
  merge: -1
