    # Nameserver Specification


    A nameserver and default domain are also needed to establish a network connection.
    The nameserver is used to translate hostnames such as `private.network.com` to
    their corresponding IP address such as `192.168.7.3`. The default domain tells
    the computer to look up a fully qualified hostname is not the fully qualified
    hostname, if the hostname is simply `foo.redhat.com`. If you specify your default
    domain as `redhat.com`, then you could use the hostname to connect successfully.
    For example `ftp` would be sufficient if your search domain is, `ftp foo.redhat.com`
    would be required if you want.


    To specify the nameserver, open `Config` -> `Networking` -> `Name server specification
    (DNS)`


    Nameservers are ranked according to the order in which they are accessed, so it''s
    not unusual to see nameservers referred to as primary, secondary, and so on down
    the list if more than one is specified. Each of these must be an IP address and
    a name. The computer has no way to resolve the name until it connects to a nameserver.
    Screaming obviously when stated, but occasionally overworks people simply asked
    to supply an address for a computer.


    In addition to a default domain, you can also specify search domains. Search works
    differently; proceed from one to six in a similar manner to the nameserver. However,
    they all take precedence over the default domain! Keep this in mind when specifying
    search domains. Searches are not commonly used.


    The item not yet covered is the checkbox for DNS. If you are running a small private
    network with no Internet connection, using `/etc/hosts` files and keeping them
    synchronized will work well. As you add and more machines, the complexity increases
    until it is easier to have a single machine run a DNS than `/etc/hosts` files.


    There is another reason for not using DNS, and if your network is going to use
    NIS instead. Note that NIS can be used in conjunction with DNS. So unless you
    know why `/etc/hosts` or NIS would be best for your situation, DNS is probably
    going to be your best choice.


    You can add, modify, or delete entries from the `/etc/hosts` file using Linuxconf.
    Open `Config` -> `Networking` -> `Information about other hosts`


    To modify or delete an entry select it. To delete the entry, select `Del` at the
    host/network definition screen.'
