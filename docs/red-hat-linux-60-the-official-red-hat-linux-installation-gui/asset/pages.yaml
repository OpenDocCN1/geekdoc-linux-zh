    # System Configuration


    Network devices can be added, removed, configured, activated, deactivated and
    aliased. Ethernet, arcenet, token ring, pocket (ATP), PPP, SLIP, PLIP and loopback
    devices are supported. PPP/SLIP/PLIP support works well on most hardware, but
    some hardware setups may exhibit unpredictable behavior. When using the Network
    Configuration Tool click Save to write your changes to disk, quit without making
    any changes select Quit


    # Managing Names


    The Names of the Network Configuration tool serves two primary purposes: setting
    the hostname and domain of the computer, and determining which name server will
    be used to look up other hosts on the network. The Network tool is not capable
    of configuring a machine as a nameserver. To edit a field or add information to
    a field simply click on the left mouse button and type the new information.


