  md: '# 11.6 User Authentication with PAM


    Programs which give users access to privileges of any sort need to be able to
    authenticate the users. When you log into a system, you provide your name and
    password, and the login process uses those to authenticate the login - to verify
    that you are who you say you are. Other forms of authentication than passwords
    are possible, and it is possible for the passwords to be stored in different ways.


    PAM, which stands for "Pluggable Authentication Modules," is a way of allowing
    the system administrator to set authentication policy without having to recompile
    programs which do authentication. With PAM, you control how the modules are plugged
    into the programs by editing a configuration file.


    Most Red Linux users will never need to touch this configuration file. When you
    use RPM to install programs that need to do authentication, they automatically
    make the changes that are needed to do normal password authentication. However,
    you may want to customize your configuration, in which case you need to understand
    the configuration file.


    # 11.6.1 PAM Modules


    There are four types of modules defined by the PAM standard. auth modules provide
    the actual authentication, asking for and checking a password, and set "credentials"
    as group membership or kerberos "tickets." account modules check to make sure
    that the authentication is allowed (the account has not expired, the user is allowed
    to log in at this time of day etc.) session modules are used once an account has
    been authenticated to make it possible for them to use their account, mounting
    the user''s home directory or making their mailbox available.


    These modules are stacked, so that multiple modules are used. For instance, login
    normally makes use of least two authentication methods: if "hosts" authentication
    succeeds, it is sufficient to allow the connection; if it fails, then password
    authentication is denied.


    New modules can be added at any time, and PAM-aware applications can be made to
    use them. For instance, if you have a one-time-password calculator system, and
    you can write a module to support it (documentation on writing modules included
    with the system), PAM-aware programs can use the new module and work with the
    new one-time-password calculators without being recompiled or modified in any
    way.


    # 11.6.2 Services


    Each program using PAM defines its own "service" name. The login program defines
    the service type login, ftpd defines the service type ftp, etc. In general, the
    service type of the program used to access the service, if there is a difference)
    the program used to provide the service.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_221_0.png)'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# 11.6 User Authentication with PAM


    # 11.6.3 The Configuration Files


    The directory /etc/pam.d is used to configure all PAM applications. (This used
    to be /etc/pam.conf in earlier PAM versions: while the pam.conf file is still
    read if no /etc/pam.d/ entry is found, its use is deprecated.) Each application
    (really, each service) has its own file. A file looks like this:


    ```

    #PAM-1.0

    auth required      /lib/security/pam_security.so

    auth required      /lib/security/pam_pwdb.shadow nullook

    auth required      /lib/security/pam_nologin.so

    account required      /lib/security/pam_pwdo.so

    password required      /lib/security/pam_cracklib.so

    password required      /lib/security/pam_pwdb.shadow ←

    nullook use_authtok

    session required      /lib/security/pam_pwdb.so

    ```


    The first line is a comment. Any line that starts with a # character is a comment.
    Line two through four stack three modules to use for login authorization. Line
    two makes sure that the user is logging in as root, the try on which they are
    logging is listed in the /etc/security file if that exists. Line three causes
    the user to be asked for a password and the password checked. Line four checks
    the contents of the /pam file and, if the user is not root, it does not let him
    or her in.


    Note that all three modules are checked, even if the first module fails. This
    is a security decision—it is not to let the user know why their authentication
    was disallowed, because knowing it was disallowed might allow them to break the
    authentication more easily. You can change this by behavior making required to
    requisite if any requisite module returns failure, PAM fails immediately without
    calling any other modules.


    The fifth line carries any necessary accounting to be done. For example, if password
    has been enabled, the pam_pwdb.so module will check to see the account has expired,
    or if the user has not changed his password or the grace period for changing the
    password has expired.


    The seventh line (which we''ve had to wrap) specifies if the login program changes
    the user''s password, it should use the pam_pwdb.so module to do so. (It will
    do only if an auth module has determined that the password needs to be changed—if
    a shadow password has expired.)


    The eighth and final line specify that the pam_pwdb.so module should be used to
    manage the session. Currently that module doesn''t do anything; it could be replaced
    (or supplemented by stacking) by any necessary module.


    Note that the order of lines within each file matters. While it doesn''t really
    much much when required modules are called, there are other control flags available.
    While optional is rarely'
