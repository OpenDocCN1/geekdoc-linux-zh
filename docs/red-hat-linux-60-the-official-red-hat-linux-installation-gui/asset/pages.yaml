    that base/hdlist is being retrieved.


    Continue to section 5.5 for upgrade or full-installation instructions.


    # 5.5 Upgrading or Installing


    After you choose an installation method, the installation program prompts you
    to either install or upgrade (see Figure 5.9 on page 72).


    # 5.5.1 Installing


    You usually install Red Hat Linux on a clean disk partition or set of partitions,
    or over another installation-of Linux.


    > **Note:** Installing Red Hat Linux over another installation of Linux (including
    Red Hat Linux) does not preserve any information (files or data) from the prior
    installation. Make sure you save any important files! If you are worried about
    saving the current data on your existing system (without making a backup on your
    own), you should consider performing an upgrade instead.


    If you wish to perform a full install, choose **Install**, and skip to section
    5.6 on page 72.'
