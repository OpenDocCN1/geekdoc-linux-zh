    # BIOS-Related Limitations Impacting LILO


    LILO is subject to some limitations imposed by the BIOS in most Intel-based computers.
    Specifically, most BIOSes can''t access more two hard drives and they can''t access
    any data stored beyond cylinder 1023 of every drive. Note that some recent BIOSes
    do not have these limitations, but this is by no means usual.


    All the data LILO needs to access at boot (including the Linux kernel) are in
    the /boot directory. If you follow the partition layout recommended above, or
    if you are performing a workstation-server-class install, the /boot directory
    will be in a small, separate partition. Otherwise, it will reside in the root
    partition. In either case, the partition in which /boot resides must conform to
    the guidelines if you are using LILO to boot your Red Linux system:


    **On Two IDE Drives** - If you have 2 IDE (or EIDE) drives, /boot must be located
    on one of them. Note that this two-drive limit also includes any IDE CD-ROM drives
    on your primary controller. So, if you have one IDE drive, and one IDE CD-ROM
    on your primary controller, /boot must be located on the first hard *only*, even
    if you have other hard drives on your secondary IDE controller.


    **On IDE or SCSI Drive** - If you have one IDE (or EIDE) drive and one or more
    SCSI drives, /boot must be located either on the IDE or the SCSI drive at ID 0.
    No other SCSI Ids will work.


    **On Two SCSI Drives** - If you have some SCSI drives, /boot must be located on
    a drive at ID 0 or 1 Ids. No other SCSI Ids will work.


    **Partition Completely Below Cylinder 1023** - No matter which of the configurations
    apply, the partition that holds /boot must be located entirely below cylinder
    1023. If the partition /boot straddles cylinder 1023, you may face a situation
    where LILO will initially (because all the necessary information is below cylinder
    1023), but will fail if a new kernel is to be loaded, and kernel resides above
    cylinder 1023.


    As mentioned earlier, it is possible that some of the newer BIOS permit LILO to
    work with configurations that don''t meet our guidelines. Likewise, as of LILO''s
    more esoteric features there may be to use a Linux system started, even if the
    configuration doesn''t meet our guidelines. How-ever, due to the number of variables
    involved, Red Hat Software cannot support such extraordinary efforts.


    **Please Note:** Disk Druid as the workstation and server-class install take these
    BIOS-related limitations into account. However, if you decide to use fdisk instead,
    it is your responsibility to ensure that you keep these limitations in mind.'
