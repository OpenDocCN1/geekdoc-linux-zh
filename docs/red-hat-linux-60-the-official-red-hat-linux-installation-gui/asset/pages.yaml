  md: '# 11.10 Controlling Access to Services


    As a security measure, most network services are managed by a protective program
    called a TCP wrapper. The protected services are those listed in

    /etc/inetd.conf that specify /usr/sbin/tcpd. tcpd can allow or deny access to
    a service based on the origin of the request, and the configuration in

    /etc/hosts.allow and /etc/hosts.deny. By default Red Hat Linux allows all requests.
    To deny or limit services you can edit /etc/hosts.allow. Here is an example

    /etc/hosts.allow file:


    +   ALL: redhat.com .redhat.com

    in.talkd: ALL

    in.ntalked: ALL

    in.fingered: ALL

    in.ftptpd: ALL


    This configuration allows all connections from redhat.com and *.redhat.com machines.
    It also allows talk, finger, and ftp requests from all machines.

    tcpd allows much more sophisticated access, using a combination of

    /etc/hosts.allow and /etc/hosts.deny. Read the tcpd(8) and hosts.access(5) man
    pages for complete details.


    # 11.11 Anonymous FTP


    Setting up anonymous FTP is simple. All you need to do is install the anon-ftp
    rpm package (which you may have already done at install time). Once it is installed,
    anonymous FTP will be up and running.

    There are a few files you might wish to edit to configure your FTP server.


    /passwd - This file defines the most of access control for your ftp server. Some
    of the things that you can do are: set logical "groups" to control access from
    different sites, limit the number of simultaneous FTP connections, configure transfer
    logging, and much more.\Read the tpasswd man page for complete details.


    /hosts - The fhosts file is used to allow or deny access to certain accounts from
    various hosts. Read the fhosts man page for details.


    /ftusers - This file lists all the users that are not allowed to ftp into your
    machine. For example, root is listed in /etc/ftusers by default. That means that
    you can not ftp to your machine and log in as root. This is a good security measure,
    but some administrators prefer to remove root from this file.'
  merge: -1
  pgno: 230
