  md: '# #1 New Features of Red Hat Linux 6.0


    This chapter describes features that are new to Red Hat Linux 6.0.


    # ##1.1 Installation-Related Enhancements


    Here is a list of the many changes which have been made in order to make the Red
    Hat Linux installation process even easier:


    +   * New HTTP Installation Method

    * "Out-of-the-Box" Processor Optimized Kernel Support

    * New Boot Disks

    * Improved Package Selection Screen

    * New Authentication Configuration Screen

    * Xconfigurator Part of Install


    Let''s take a look at each one in a bit more detail.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# New HTTP Installation Method


    The Red Hat Linux 6.0 installation program has added HTTP to its available list
    of network-class installations. Similar to the way you would perform an FTP installation,
    you are now able to log in to a website and install Linux.


    For more information on network-class installations, please refer to Chapter 5
    on page 65.


    # ''Out-of-the-Box'' Processor Optimized Kernel Support


    Optimized kernels for the Pentium Pro, Pentium II, and Pentium III processors
    and APM enabled kernels are now supported. Additionally, the Red Hat Linux 6.0
    installation now has SMP motherboard support. The installation process will probe
    your system and if more than one processor is detected, an SMP enabled kernel
    will be automatically installed.


    # New Boot Disk


    There are two boot disks for Red Hat Linux. One is for installing local media
    devices (CD-ROM installs, hard drive installs) and the other is for network based
    installs (NFS, FTP, or HTTP).


    Additionally, the supplemental disk has been replaced by the PCMCIA support disk.
    All install methods now require one disk, unless you need PCMCIA support during
    the install. If needed, you will be prompted for the PCMCIA support disk.


    # Improved Package Selection Screen


    Individual package selection has been improved, with collapsible and expandable
    tree menus to allow easy selection of packages during the installation process.


    # New Authentication Configuration Screen


    The Authentication Configuration screen gives you the option of enabling three
    different types of passwords:


    +   - Enable NIS – allows you to run a group of computers in the same Network
    Information Service domain with a common password and group file. There are two
    options here to choose from:

    - NIS Domain – this option allows you to specify which domain or group of computers
    your system will belong to.

    - NIS Server – this option causes your computer to use a specific NIS server,
    rather than “broadcasting” a message to the local area network asking for any
    available server to host your system.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# 1.2 Desktop and Window Managers


    +   - Enable Shadow Passwords – provides a very secure method of retaining passwords
    for you.

    - Enable MD5 Passwords – allows passwords up to 256 characters, rather than the
    standard eight.


    # Xconfigurator Now Part of the Install


    Xconfigurator is now run at the end of the install, after all filesystem components
    have been installed. In the past, if Xconfigurator were to hang, you would likely
    have to start the installation over. Now it is possible to boot Red Hat Linux
    and configure X after the installation has completed.

    Additionally, Xconfigurator tests X during the installation to make sure it is
    configured correctly for your system. Xconfigurator also offers you the option
    of booting into the X Window System immediately after the installation.


    # 1.2 Desktop and Window Managers


    Red Hat Linux 6.0 provides additional choices in graphical user interfaces.


    +   - GNOME with Enlightenment Included

    - KDE Included


    # GNOME with Enlightenment Included


    GNOME is now included in Red Hat Linux 6.0 as the default desktop manager. GNOME
    features a graphical interface which enables users to easily use and configure
    their systems. GNOME also supports Drag and Drop protocols which help you use
    applications that are not GNOME-compliant.

    Enlightenment is included as the default window manager. Enlightenment provides
    a window manager with a great graphical interface, and is designed to allow the
    user to manipulate it in any way fashionable.


    # KDE Included


    Red Hat Linux 6.0 also includes KDE. A very popular and powerful desktop environment,
