    used, and never used by default on a Red Hat Linux system, sufficient and requisite
    order to become important.


    Let''s look at the auth configuration for /login:


    ```

    auth required      /lib/security/pam_securetty.so

    auth sufficient    /lib/security/pam_rhosts.auth.so

    auth required      /lib/security/pam_pwdb.so shadow nullok

    auth required      /lib/security/pam_nlogin.so

    ```


    That looks almost like the login, but there''s an extra line specifying an extra
    module, and the modules are specified in a different order.


    First, pam_security.so keeps root logins from happening on insecure terminals.
    This effectively disallows all root attempts. If you wish to allow them (in which
    case we recommend that you either connected or be behind a good firewall), you
    can simply remove that line.


    Second, pam_nlogin.so checks /etc/nlogin, as specified above.


    Third, if pam_rhosts.auth.so authenticates the user, PAM immediately returns login
    without any password checking. If pam_rhosts.auth.so fails to authenticate the
    user, failed authentication is ignored.


    Finally (if pam_rhosts.auth.so has failed to authenticate the user), pam_pwdb.so
    module forms normal password authentication.


    Note that if you do not want to prompt for a password if the security check fails,
    you can change the pam_security.so module from required to requisite


    # 11.6.4 Shadow Passwords


    The pam_pwdb.so module will automatically detect that you are using shadow passwords
    and make all necessary adjustments. Please refer to Section 11.7 on the next page
    for more information.


    # 11.6.5 Rexec and PAM


    For security reasons, rexec is not enabled in Red Hat Linux 6.0. Should you wish
    to enable it, you will need to comment out one line in the file /etc/pam.d/rexec.
    Here is a sample of the file (note that your file may differ slightly):


    ```

    #PAM-1.0

    auth required      /lib/security/pam_pwdb.so shadow nullok

    auth required      /lib/security/pam_nlogin.so

    account required    /lib/security/pam_pwdb.so

