  md: '# Making Installation Diskettes


    It is sometimes necessary to create a diskette from an **image file** (for example,
    you might need to use updated diskette images obtained from the Red Hat Linux
    Errata).


    As the names imply, an image file is a file that contains an exact copy (or image)
    of a diskette''s contents. Since a diskette contains filesystem information in
    addition to the data contained in files, the image file is not usable until it
    has been written to a diskette.


    To start, you will need a blank, high-density (1.44 MB), 3.5-inch diskette. You''ll
    need access to a computer with a 3.5-inch disk drive, and capable of running a
    DOS program, or the `dd` utility found on most Linux-like operating systems.


    The image files are found in the following directories on your Red Hat Linux CD:


    +   **images** – Contains the boot and PCMCIA support images for Red Hat Linux/Intel,
    and the various kernel and ramdisk images for Red Hat Linux/Alpha.

    On the Red Hat Linux/SPARC CD, this directory contains the boot image, and an
    image for network booting.

    **milo** – Contains the various images for the Red Hat Linux/Alpha miniloader,
    MILO. The directory exists only on Red Hat Linux/Alpha CDs.


    Once you''ve selected the proper image, it''s time to transfer the image file
    onto a diskette. As mentioned previously, this can be done on a DOS-capable system,
    or on a system running a Linux-like operating system.'
