  md: '# Kickstart Installations


    Due to the need for automated installation, Red Hat Software has created the kickstart
    installation method. With this method, a system administrator can create a single
    file containing the answers to all the questions that would normally be asked
    during a typical Red Hat Linux installation. The kickstart installation method
    is powerful enough that often a single kickstart file can be used to install Red
    Hat Linux on multiple machines.


    **Please Note:** Kickstart installations can only be performed using the CD-ROM
    and NFS installation methods. FTP, HTTP, SMB, or local hard disk installations
    cannot be automated using kickstart mode.


    # H.1 Where to Put A Kickstart File


    To use kickstart mode, you must first create a kickstart file, and make it available
    to the Red Hat Linux installation program. Normally this is done by copying the
    kickstart file to the boot diskette, or making it available on the network. The
    network-based approach is most commonly used, as most kickstart installations
    tend to be performed on networked computers. This also makes it easier to install
    Red Hat Linux on many computers, as the kickstart files can be kept on one server
    system, and read by the individual computers during the installation.


    Let''s take a more in-depth look at the locations where the kickstart file may
    be placed.'
  merge: -1
  pgno: 394
- img_proc: true
  md: '# H.1.1 On Diskette


    To perform a diskette-based kickstart installation, the kickstart file must be
    named ks.cfg, and reside in the boot diskette''s top-level directory. Note that
    the Red Hat Linux boot systems are in MS-DOS format, making it easy to copy the
    kickstart file under Linux using the copy (or if you insist, you can also use
    Windows). Although there is no technological requirement for it, most diskette-based
    kickstart installations install Red Hat Linux from CD-ROM.


    # H.1.2 On the Network


    Network installations using kickstart are common because system administrators
    can automate the installation of many networked computers quickly and painfully.
    In general, the approach most commonly used is for the administrator to have both
    BOOT/DHCP server and an NFS server on the local network. The BOOT/DHCP server
    provides networking information, while NFS provides the installation files. Often
    these two servers run on the same physical machine, but there is no requirement
    for this.


    To do a network-based kickstart installation, you must have a BOOT/DHCP server
    on your network and must include configuration file for the machine you are attempting
    to install. The BOOT/DHCP server will be used to give the client installation
    information as well as the location of the kickstart file.


    If a kickstart file is specified by the BOOT/DHCP server, the client system will
    attend an NFS mount of the file''s path, and will copy the file to the client,
    using it as the kickstart file. The exact settings required vary depending on
    the BOOT/DHCP server you use.


    Here''s an example for the DHCP server shipped with Red Hat Linux:


    ```

    filename /new-machine kickstart/

    next-server blarg.redhat.com;

    ```


    Note that you use filename for the kickstart file''s name (or the directory in
    which the kickstart file resides) and next-server to set the NFS server name.


    If the filename returned by the BOOT/DHCP server ends with a slash ("/"), then
    it is interpreted as a path. In this case, the client system mounts that path
    using NFS, and searches for a specially-named file. The client searches for:


    ```

    <ip-addr>-kickstart

    ```


    The <ip-addr> section of the filename should be replaced with the client''s IP
    address in decimal notation. For example, the filename for a computer with an
    IP address of 10.10.0.1 would be 10.10.0.1-kickstart.


    Note that if you don''t specify a server name, the client system will use the
    server that answered BOOT/DHCP request as its NFS server. If you don''t specify
    a path or filename, the client system will try to mount /kickstart from the BOOT/DHCP
    server, and will try to find the kickstart file using the same <ip-addr>-kickstart
    filename as described above.'
  merge: -1
  pgno: 395
- img_proc: true
  md: "# H2 Starting a Kickstart Installation\n\n# # H2 Starting a Kickstart Installation\n\
    \nTo begin a kickstart installation, you must boot the system from a Red Hat Linux\
    \ boot diskette, and enter a special boot command at the boot prompt. If the kickstart\
    \ file resides on the boot diskette, the proper boot command would be:\n\n```\n\
    ```\nboot: linux ks=floppy\n```\n```\n\nIf, on the other hand, the kickstart file\
    \ resides on a server, the appropriate boot command would be:\n\n```\n```\nboot:\
    \ linux ks\n```\n```\n\n# # H.3 The Kickstart File\n\nNow that you have some background\
    \ information on kickstart installations, let's take a look at the kickstart file\
    \ itself. The kickstart file is a simple text file, containing a list of items,\
    \ each identified by a keyword. You can create it by editing a copy of the README.ks\
    \ file found in the docs/ directory of a Red Hat Linux CD-ROM, or you can create\
    \ it from scratch. You should be able to edit it with any text editor or word\
    \ processor that can save files as ASCII text.\n\nFirst, some ground rules to\
    \ keep in mind while creating your kickstart file:\n\n+   * Items must be specified\
    \ in order. It is not a good idea to change the order of the required items.\n\
    * Items that aren't required can be omitted.\n* For kickstart upgrades, the following\
    \ items are required:\n  - language\n  - installation method\n  - device specification\n\
    \  - keyboard setup\n  - the upgrade keyword\n  - LILO configuration\n\nIf any\
    \ other items are specified for an upgrade, those items will be ignored (note\
    \ that this includes package selection).\n\n+   * Omitting any required item will\
    \ result in the installation process prompting the user for an answer to that\
    \ question, just as during a normal installation. If this happens, the answer\
    \ is given the installation will continue unattended (unless it comes across another\
    \ missing item).\n* Lines starting with a pound sign (#) are treated as comments,\
    \ and are ignored.\n\nLet's take a look at each item in order."
  merge: -1
  pgno: 396
- img_proc: true
  md: '# H.3.1 lang – Language Setting


    The first item that must appear is the language setting. The language you specify
    will be used during the installation as well as to configure any language-specific
    aspect of the installed system. The language specification must be a two letter
    ISO language code, such as en for English, de for German, fr for French, and so
    on. For example, to set the language to English, the kickstart file should contain
    the following line:


    ```

    lang en

    ```


    # H.3.2 network – Networking Configuration


    The next item is the network configuration information. This line is used to tell
    the system how it should configure networking for itself. It is optional, and
    if omitted, the system will be configured for stand-alone operation.


    There are three different methods of network configuration:


    +   - DHCP

    - BOOTP

    - static


    DHCP method uses a DHCP server system to obtain its networking configuration.
    As you might guess, the BOOTP method is similar, requiring a BOOTP server to supply
    the networking configuration.


    The static method requires that you enter all the required networking information
    in the kickstart file. As the names imply, this information is static, and will
    be used during the installation, and after the installation.


    To direct a system to use DHCP to obtain its networking configuration, use the
    following line:


    ```

    network --bootproto dhcp

    ```


    To direct a machine to use BOOTP to obtain its networking configuration, use the
    following line in the kickstart file:


    ```

    network --bootproto bootp

    ```


    The line for static networking is more complex, as you must include all network
    configuration information on one line. You will need to specify:


    +   - IP address

    - netmask

    - gateway IP address'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# H.3 The Kickstart File


    +   - nameserver IP address


    Here''s an example static line:


    ```

    network --bootproto static <-

    --ip 10.0.2.15 <-

    --netmask 255.255.255.0 <-

    --gateway 10.0.2.254 <-

    --nameserver 10.0.2.1

    ```


    **Note:** The entire network configuration must appear on one line! We''ve wrapped
    it here to make it easier to read.


    There are two restrictions you must keep in mind should you use the static method:


    +   - All nameserver configuration information must be specified on one line;
    you cannot wrap lines using a backlash, for example.


    +   - You can only specify one nameserver here. However, you can use the kickstart
    file''s %post section (described in Section H.3.22 on page 392) to add more nameservers,
    if needed.


    # H.3.3 Installation Methods


    The next required item is the installation method. This item directs the installation
    program for the rest of the files required to install Red Hat Linux. There are
    two choices: NFS or CD-ROM. Let''s look at both, starting with NFS.


    # H.3.4 nfs - The NFS Installation Method


    For the NFS installation method, you must include the NFS server''s name and the
    directory to be mounted. Here''s an example:


    ```

    nfs --server hostname.of.server --dir /path/to/RH/CD/image

    ```


    # H.3.5 cdrom - The CD-ROM Installation Method


    For a CD-ROM-based kickstart installation, simply use the following line:


    ```

    cdrom

    ```'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# H.3.6 device – Optional Hardware Information


    The next set of items in the kickstart file is required to specify optional hardware
    information. For PCI-based hardware you can omit this step, as this information
    can be obtained directly from the hardware. Note that IDE hard disks and common
    PCI cards fall into this category. Any other hardware may need to be specified
    here.


    To specify a device, start with the device keyword, followed by the type of device:


    +   - ethernet (for Ethernet cards)

    - scsi (for SCSI cards)

    - cdrom (for non-SCSI, non-IDE CD-ROM drives; usually sound cards with proprietary
    CD-ROM interfaces


    If a kernel module is required to support the device, the module name follows
    the device type.

    Finally, if there are any parameters that are required by a device, they can be
    specified by using the --opts option. Enclose the parameters in quotes after --opts.
    We will show some examples below.


    Note you can specify more than one type of device in a given kickstart file. For
    example, if you know the machines you''ll kickstart-installing have an Adaptec
    1542 or a Buslogic SCSI card, you can enter both in the kickstart file. But be
    aware that the the installation program uses only the first card found, so order
    the devices appropriately.


    An example for an ISA 3com Ethernet card would be:


    ```

    device ethernet 3c503 --opts io=0x330, irq=7

    ```


    Here''s an example line for an Adaptec 1542 SCSI card:


    ```

    device scsi aha54x

    ```


    An example of a SoundBlaster CD-ROM might look like this:


    ```

    device cdrom --opts io=0x240

    ```


    # H.3.7 keyboard – Keyboard Type


    The next item you''ll need to specify is the correct code for your keyboard type.
    For US keyboards, the type is us. For the others, please run the /usr/sbin/kbdconfig
    program on an already-installed Red Hat Linux system. (An alternative approach
    is to set the keyboard type to us and run kbdconfig on the installed system to
    set it properly after the installation completes.)


    An example of this board would be:


    ```

    keyboard us

    ```'
  merge: -1
  pgno: 399
- img_proc: true
  md: '# H.3 The Kickstart File


    # H.3.8 noprobe


    If you do not want your system device controllers to be automatically probed then
    you can issue the command:


    ```

    noprobe

    ```


    By configuring this command, your system will not probe for any device controllers,
    SCSI or other-wise is to be used only if you wish to manually specify the devices
    that are on your system.


    **Note:**You will not be prompted to enter devices at any point. You will have
    to manually enter them into the kickstart configuration file or else you will
    not be able to continue with the installation.


    # H.3.9 device --continue


    Your system is normal: set up or find one device of a type. Without changes, the
    kickstart configuration will load the modules for one type of device, such as
    loading the module for one adapter type. Beyond that, the program will not load
    further modules for that type of device.


    In order to load modules for more than 1 adapter type (for example, two different
    SCSI adapters) you will need to add the command


    ```

    device --continue

    ```


    So, if you will need to have modules for a Adaptec and a BusLogic adapter, then
    you will need to have both of these in the configuration file and you will need
    to have --continue after the first one in the configuration file:


    ```

    device scsi aicxxx --continue

    device scsi BusLogic

    ```


    However, if you have multiple adapters of the same type, then you will not need
    to be concerned with this line, as the single module insertion is enough to control
    all adapters of that type. For example, if you have three Adaptec adapters, the
    single line


    ```

    device scsi aicxxx

    ```


    will load and allow all three adapters to function.


    # H.3.10 Partitioning


    The hard drive in the machine must be partitioned before Red Hat Linux can be
    installed. In this section, we will describe how to specify disk partitioning
    in the kickstart file.'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# H.3.11 zerombr – Partition table initialization


    First, if you are installing Red Hat Linux on a new machine, you should use the
    zerombr keyword to clear the current partition information. This is a good idea,
    because the partition table on new hard drives is usually bogus. Here''s an example
    of zerombr on a new system:


    ```

    zerombr yes

    ```


    On the other hand, if you are installing machines that have a valid partition
    table, even if you want to change part (or all) of it, you should use zerombr
    this way:


    ```

    zerombr no

    ```


    # H.3.12 clearpart – Removing partitions based on partition type


    The next command is optional, but can come in handy. If you''d like to remove
    all partitions, or just any Linux-related partitions, you can use clearpart. For
    example, to clear all partitions of type "Linux native" and "Linux swap," you
    could add this to line:


    ```

    clearpart --linux

    ```


    To clear all partitions from a disk, this line would do the trick:


    ```

    clearpart --all

    ```


    The only options clearpart supports are --linux and --all.


    # H.3.13 part – Partition definition


    The next step is to specify the partitions you want to create. These will only
    be created using the system''s unpartitioned free space. (In other words, if the
    machine had Windows-related partitions, and you had done clearpart those Windows
    partitions would remain untouched.) You must enter one partition per line using
    the following format:


    ```

    part <mnptpt> --size <size in megs> [--grow]

    [--max <size in megs>]

    ```


    (This part line was broken to make it readable.)


    <mnptpt> is the location where you are going to mount that partition in your installed
    system (for example, the root partition would have a mount point of /, while you
    may decide that another partition should have a mount point of /home).'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# H.3 The Kickstart File


    <size in megs> is the size of the partition in megabytes. You can optionally specify
    that the partition is growable by adding the --grow option. Note that making a
    partition growable does not mean that you can increase its size. Instead, a growable
    partition will be automatically resized to use all available unpartitioned free
    space (after all fixed-size partitions have been created).


    Since the amount of unpartitioned free space can vary, and you probably want to
    use it, by tagging partitions as growable you can easily make sure no space is
    wasted. If you have multiple partitions tagged as growable, the free space is
    split evenly among them.


    Note that you can also limit the size of growable partitions with the optional
    --maxsize argument.


    Here''s an example of kickstart partitioning in action. Let''s say you know the
    smallest disk out of a set of machines you plan kickstart-install is 1GB. You''d
    like to use the same kickstart file. You could use the following partitioning
    scheme:


    ```

    zerombr no

    clearpart --all

    part / --size 250

    part swap --size 50

    part /usr --size 500 --maxsize 800

    part /tmp --size 100 --grow

    ```


    When defined this way, the installation program will first clear all partitions.
    It will then set up a 250MB root filesystem, with a 50MB swap partition. Next
    the installation program will create a /usr partition of at least 500MB (it''s
    growable), but it cannot grow beyond 800MB. Finally, the last line will create
    a /tmp partition of at least 100MB (again, it is growable).


    So for 1GB system, you would end up with a 250MB root, a 50MB swap, a 550MB /usr,
    and a 150MB /tmp partition. If another system has a 2GB drive, you would get a
    250MB root, a 50MB swap, a 800MB /usr/tmp.


    # H.3.14 install and upgrade – Install/Upgrade Selection


    The next item to specify whether you are doing a fresh install, or an upgrade
    of an already-installed system. For a fresh install, use:


    ```

    install

    ```


    For an upgrade of an existing system, use:


    ```

    upgrade

    ```


    Keep in mind that for upgrades, the only items that matter are:


    +   - installation media (CD-ROM or NFS)

    - device specification (if necessary)'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# 388


    # Kickstart Installs


    +   - keyboard setup

    - install/upgrade specification (which should be upgrade, of course!)

    - LILO configuration


    # H.3.15 mouse – Mouse Configuration


    To define the type of mouse your system has, you must use the mouse keyword. Run
    mouseconfig--help on an already-installed Red Hat Linux for a list of mouse types.


    Depending on the type of mouse, you may also need to specify the device to which
    the mouse is attached. The default device is correctly set for bus. For serial
    mice, the default device is /dev/cua0, but can be overridden with the --device
    option followed by the device name, such as cual.


    For example, for a three-button PS/2 mouse, you would use:


    ```

    --kickstart generic3ps/2

    ```


    For a two-button PS/2 mouse, use:


    ```

    --kickstart genericps/2

    ```


    For a two-button Microsoft mouse on your second serial port, use:


    ```

    --kickstart microsoft --device cual

    ```


    # H.3.16 timezone – Timezone Definition


    Red Linux is timezone-aware, so you will need to specify the timezone in which
    the machine will operate. This is done using the timezone keyword. There are many
    timezones; the best way to find yours is to run /usr/sbin/timeconfig on an already-installed
    Red Hat Linux system.


    If you would like to have your system''s hardware clock set to use GMT/UTC, add
    the --utc to your timezone line. Here''s an example that defines the timezone
    as US Eastern with the system clock set to GMT:


    ```

    timezone --utc US/Eastern

    ```


    # H.3.17 xconfig – X Window Setup


    The next item is the X Window setup line. The installation program will normally
    find common PCI video hardware and will know which X server to install. The keyword
    for X configuration is xconfig.'
  merge: -1
  pgno: 403
- img_proc: true
  md: '# H.3 The Kickstart File


    If your video card is not autoproubed, you can use the --card option to explicitly
    specify the card. You can use Xconfigurator --help on a running Red Hat Linux
    system to get a list of supported cards to choose from.


    If your card isn''t in the list but is supported by one of the existing servers,
    you can simply install the proper server by using the --server option. Again,
    use Xconfigurator --help to get the list of server names.


    If you need to specify a monitor type. If you don''t install, you will assume
    a generic monitor capable of 640x480Hz. Use the --monitor option to specify something
    other than the default. Again, Xconfigurator --help will list all monitor types.


    If your monitor isn''t listed, you can enter the actual monitor specifications
    by the --hync and --vsync options for horizontal and vertical sync rates, respectively.
    The rates may be single numbers (representing kilertz and megahertz, as appropriate).
    Groups of numbers separated by commas, or two numbers separated by a dash (signifying
    a range). For example:


    ```

    xconfig --hync ''31.5,35.5,50-60'' --vsync ''50-70''

    ```


    An example for a machine where the video card can be autoproubed would be:


    ```

    xconfig --monitor ''tatung cmul4he''

    ```


    An example for a machine where nothing is probed and the monitor isn''t in the
    list might be:


    ```

    xconfig --server ''Mach64'' --hync ''31.5,35.5,50-60'' --vsync ''50-70''

    ```


    # H.3.18 rootpw – Setting the Root Password


    You can put the root password in a kickstart file in the clear (if it would go
    over the network in the clear on an NFS install) or you can specify that an encrypted
    password is to be used. To specify an unencrypted password in the kickstart file,
    use the rootpw keyword, followed by the cleartext password:


    ```

    rootpw myself

    ```


    If you would rather use an encrypted password, grab it out of /etc/passwd (or
    wherever the encrypted version stored), and add the --encrypted option:


    ```

    root --encrypted encryptedpassword

    ```


    # H.3.19 authconfig – Setting up Authentication Configuration


    After you set the root password, you will have the ability to set up different
    network authentications:'
