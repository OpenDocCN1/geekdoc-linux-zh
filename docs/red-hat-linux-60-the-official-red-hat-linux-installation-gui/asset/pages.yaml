  md: '# 2.8.2 Partition Naming Scheme


    Linux refers to disk partitions using a combination of letters and numbers which
    may be confusing, particularly if you''re used to the "C drive" way of referring
    to hard disks and their partitions. In the DOS/Windows world, here is how partitions
    are named:


    +   - Each partition''s type is checked to determine if it can be read by DOS/Windows.

    - If the partition''s type is compatible, it is assigned a "drive letter". The
    drives start with "C".

    - The drive letter can then be used to refer to that partition as well as the
    filesystem contained on that partition.


    Red Hat Linux uses a naming scheme that is more flexible and conveys more information
    than the approach used by other operating systems.


    The naming scheme is file-based, with filenames in the form:


    ```

    /dev/xxyn

    ```


    Here''s to decipher the partition naming scheme:


    /dev/ - This is the name of the directory in which all devices reside. Since partitions
    reside on hard disks, and hard disks are devices, the files representing all partitions
    reside in /dev/.


    xx - The two letters of partition name indicate the type of device on which the
    partition resides. You''ll normally see either hd (for IDE disks), or sd (for
    SCSI disks).


    N - The final number denotes the partition. The first four (primary or extended)
    partitions are numbered 1 through 4. Logical partitions start at 5. E.g., /dev/hda3
    is the third primary or extended partition on the first hard disk /dev/sda5 is
    the second logical partition on the second SCSI disk.


    Please Note: there is no part of this naming convention that is based on partition
    type; unlike DOS/Windows, all partitions can be identified under Red Hat Linux.
    Of course, this means that Red Hat Linux can access data on every type of partition,
    but in many cases it is possible to access data on a partition dedicated to another
    operating system.


    Keep this information in mind; it will make things easier to understand when you''re
    setting up the partitions Red Hat Linux requires.'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# 2 Disk Partitions


    # 2.8.3 Disk Partitions and Other Operating Systems


    If Red Hat partitions will be sharing a hard disk with partitions used by other
    operating systems, from the time you''ll have no problems. However, there are
    certain combinations of Linux and other partitions that require extra care. Information
    on creating disk partitions compatible with other operating systems is available
    in several HOWTOs and Mini-HOWTOs, available on the Red Hat Linux CD in the doc/HOWTO
    and doc/HOWTO/mini directories. In particular, the Mini-HOWTOs whose names start
    with Linux+ are quite helpful.


    ```

    If Red Hat Linux/Intel will coexist on your machine with OS/2, you must create
    your disk partitions with the OS/2 partitioning software—otherwise, OS/2 may not
    recognize the disk partitions. During the installation, do not create any new
    partitions, but set the proper partition types for your Linux partitions using
    the fdisk.

    ```


    # 2.8.4 Disk Partitions and Mount Points


    One area that many new to Linux find confusing is the matter of how partitions
    are used and accessed by the Linux operating system. In DOS/Windows, it is relatively
    simple: If you have more than one partition, each partition gets a "drive letter."
    Then you use the drive to refer to files and directories on a partition


    This is entirely different from Red Hat Linux deals with partitions, and for that,
    the main difference is that each partition is used to form part of the storage
    necessary to support a single set of files and directories. This is done by associating
    a partition with a directory through a process known as mounting. Mounting a partition
    makes its storage available starting at the directory point you choose.


    For example: if partition /dev/sda5 is mounted on /dev/hda, that would mean all
    files and directories under /dev/sda5 would physically reside on /dev/hda. So
    the file /usr/doc/FAQ/it/Linux-FAQ would be stored on /dev/sda5, the file /etc/init.d/Sessions/Gnome
    would not be.


    Continuing it is also possible that one or more directories be mount points for
    other partitions. In instance, a partition (say, /dev/h7) could be mounted on
    /usr/local, meaning that, for example, /usr/local/man/what would then reside on
    /dev/hda? rather than /dev/sda5.


    # 2.8.5 How Many Partitions?


    At this point in the process of preparing to install Red Hat Linux, you will need
    to give some consideration to the number and size of the partitions to be used
    by your new operating system. The question of "how many partitions" continues
    to spark debate within the Linux community and, with out any need to debate in
    sight, it''s safe to say that there are probably many partition layouts as there
    are people debating the issue.'
