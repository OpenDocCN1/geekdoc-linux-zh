    # 9.3 Impressing Your Friends with RPM


    RPM is a very useful tool for both managing your system and diagnosing and fixing
    problems. The best way to make sense of all the options is to look at some examples.


    +   - Let''s say you delete some files by accident, but you aren''t sure what
    you deleted. To verify your entire system and see what might be missing, you would
    enter:


    ```nrpm -Va

    ```

    If some are missing, or appear to have been corrupted, you should probably either-install
    the package or uninstall, then re-install the package.

    - Let''s say you run across a file that you don''t recognize. To find out which
    package owns it, you would enter:


    ```nrpm -qf /usr/X11R6/bin/xjewel

    ```nThe output would look like:


    ```nxewel-1.6-1

    ```

    - We can combine the above two examples in the following scenario. Say you are
    having problems with /usr/bin/paste. You would like to verify the package that
    owns that program but you don''t know which package that is. Simply enter:


    ```rpm -Vf /usr/bin/paste

    ```

    and the appropriate package will be verified.'
