  md: '# 10


    # GnoRPM


    New to Red Hat Linux 6.0, a graphical tool which runs under the X Window System.
    Written by James Henstridge (james@daa.com.au), GnoRPM replaces GLINT. Although
    GnoRPM shares some similarities with GLINT, it is faster, more powerful and holds
    a more user-friendly interface.


    GnoRPM is "GNOME-compliant," meaning that it seamlessly integrates into GNOME,
    the X Window System desktop environment.


    With GnoRPM, you can easily


    +   - install RPM packages

    - uninstall RPM packages

    - upgrade RPM packages

    - find new RPM packages

    - query RPM packages

    - verify RPM packages


    The interface features a menu, a toolbar, a tree and a display window of currently
    installed packages.


    Operations are performed in GnoRPM by finding and selecting packages, then choosing
    the type of operation to perform via push-button on the toolbar or through the
    menu.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# 184


    # GnoRPM


    +   * Installing a package places all of the components of that package on your
    system in the correct locations.

    * Uninstalling one removes all traces of the package except for configuration
    files which you have modified.

    * Upgrading a package installs the newly available version and uninstalls all
    versions that were previously installed. This allows quick upgrading to the latest
    releases of packages. Refer to Section 10.4 on page 188 for information about
    how to alter the default settings for installing and uninstalling packages.


    You can also use the Web find option to search the Internet for newly released
    packages. You can direct GnoRPM to search for particular distributions when you
    want to look for new packages. If you have a slow connection, this option can
    take some time to fully execute. See Section 10.4 on page 188 for more information
    about this feature.


    > **Note:** Exercise caution if you choose to use the Web find to verify the integrity
    of the many packages which are available at numerous repositories. In-installing
    packages, you should perform a query on that to help you determine whether it
    can be trusted. Packages not produced by Red Hat Software are not supported in
    any way by Red Hat Software.


    Using GnoRPM to perform all of these and other operations is the same as using
    rpm from the shell prompt, the graphical nature of GnoRPM often makes these operations
    easier to perform.


    The normal way to handle GnoRPM is to display the available packages, select the
    package(s) you want to operate on, and then select an option from the toolbar
    or menu which performs the operation.


    For instance, you can install, upgrade or uninstall several packages with a few
    button clicks. Likewise, you can query and verify more than one package at a time.


    # 10.1 Starting GnoRPM


    You can start GnoRPM from either an X terminal window or from the GNOME desktop
    panel, under System.


    To start GnoRPM from an X terminal window, at the shell prompt, simply type


    ```

    gnorpm &

    ```


    That will bring up the main GnoRPM window (as shown in Figure 10.1).


    > **Note:** If you would like to install, upgrade or uninstall packages, you must
    be in root. The easiest way to do this is to su root and then the root password
    at a shell prompt. However, you do not need to be in root to query and verify
    packages.


    There are several parts to the GnoRPM interface.'
