  md: '# Glossary


    **Alpha** A RISC (Reduced Instruction Set Computer) architecture developed by
    Digital Equipment Corporation.


    **ATAPI** An abbreviation for AT Attachement Packet Interface. ATAPI is the protocol
    by which CD-ROM drives communicate with a computer system over an IDE interface.


    **Binary** Although the base two-numbering system used by computers is known as
    binary, the word often refers to the executable form of a program. Contrast with
    "source code."


    **BIOS** An abbreviation for Basic Input/Output System. On PC-compatible systems,
    the BIOS is used to perform all necessary functions to properly initialize the
    system''s hardware when power is first applied. The BIOS also controls the boot
    process, low-level input/output routines (hence its name) and (usually) allows
    the user to modify details of the system''s hardware configuration.


    **Boot** Short for "bootstrap." The process by which a computer starts running
    an operating system when power is applied.


    **Boot Diskette** A diskette used to start many Red Hat Linux installations.


    **Bootstrap** See "Boot."'
