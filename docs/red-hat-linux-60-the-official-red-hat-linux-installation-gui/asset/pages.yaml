  md: '# Local Media Installations


    displayed at one time. If you use the ⇃ and ⌂ keys, you can see if there are any
    additional partitions. Each line in this section has five different fields:


    +   **Mount Point** – This field indicates where the partition will be mounted
    when Red Hat Linux is installed and running.


    +   **Device** – This field displays the partition’s device name.


    +   **Requested** – The “Requested” field shows the minimum size requested when
    the partition was defined.


    +   **Actual** – The “Actual” field shows the space currently allocated to the
    partition.


    +   **Type** – This field shows the partition''s type.


    **Another Type of Partition** As you scroll through the “Current Disk Partitions”
    section, you might see an “Unallocated Requested Partitions” title bar, followed
    by one or more partitions. The title implies, there are partitions that have been
    requested, but for one reason or others have not been allocated. A common reason
    for having an unallocated partition is a lack of free space for the partition.
    In any case, the reason the partition remains unallocated will be displayed after
    the partition’s mount point.


    # The “Drive Summaries” Section


    Each line in the “Drive Summaries” section represents a hard disk on your system.
    Each line has the following fields:


    +   **Drive** – This field shows the hard disk’s device name.


    +   **Geom [C/H/S]** – This field shows the hard disk’s geometry. The geometry
    connects three numbers representing the number of cylinders, heads and sectors
    as reported by the hard disk.


    +   **Total** – The “Total” field shows the total available space on the hard
    disk.


    +   **Used** – This field shows how much of the hard disk’s space is currently
    allocated to partitions.


    +   **Free** – The “Free” field shows how much of the hard disk’s space is still
    unallocated.


    +   **Bar Graph** – This field presents a visual representation of the space used
    on the hard disk. The more pound signs there are between the square braces, the
    less free space there is. Figure 4.5 on the page before, the bar graph shows **Adding
    a Partition**, Section 4.7.1 on page 52.


    **Please Note:** The “Drive Summaries” section is displayed only to indicate your
    computer’s disk configuration. It is not meant to be used as a means of specifying
    the target hard disk for a given partition. This is described more completely
    in the **Adding a Partition**, Section 4.7.1 on page 52.'
  merge: -1
