  md: '# Nameserver In TCP/IP networking terms, a nameserver is a computer that can
    translate a human-readable name (such as “foo.car.com”) into a numeric address
    (such as “10.0.2.14”).


    # Netmask A netmask is a set of four number blocks separated by periods. Each
    number is represented as the decimal equivalent of an eight-bit binary number,
    which means that each number may take any value between 0 (all bits cleared) and
    255 (all bits set). Every IP address consists of two parts (the network address
    and the host number). The netmask is used to determine the size of these two parts.
    The positions of the bits that are set in the netmask are considered to represent
    the space reserved for the network address, while the bits that are cleared are
    considered to represent the space aside for the host number.


    # NFS An abbreviation for Network File System, NFS is a method of making the filesystem
    on a remote system accessible on the local system. From a user’s perspective,
    an NFS-mounted filesystem is indistinguishable from a directly-attached disk.


    # Operating System A collection of software that controls various resources of
    a computer.


    # Packages Files that contain software, and are written in a particular format
    that enables the software to be easily installed and removed.


    # PAM An acronym for Pluggable Authentication Modules. PAM is an authentication
    system that controls access to Red Hat Linux.


    # Partition A segment of a disk drive’s storage space that can be accessed as
    if it was a complete disk drive.


    # Partition Table The partition table is a section of a disk drive’s storage space
    aside to define the partitions that exists on that disk drive.


    # Partition Type Partitions contain a field that is used to define the type of
    filesystem the partition is to contain. The partition type is actually a number,
    although many times the partition is referred to by name. For example, the “Linux
    Native” partition type is 82. Note that this number is hexadecimal.


    # PC Card See PCMCIA.


    # PCMCIA Acronym for Personal Computer Memory Card International Association.
    This organization produced a series of standards that define the physical, electrical
    and software characteristics of small, credit-sized devices that can contain memory,
    modems, network adapters and more. Also known as PC Cards, these devices are mainly
    used in laptop computers (although some desktop systems can use PCMCIA cards,
    too).'
