    # Adding a User Account – General Overview


    Adding a user is one of the most basic tasks you will encounter in administering
    your system. To add a user:


    +   - Start Linuxconf by typing linuxconf at the shell prompt.


    +   - Open Config => Users accounts => Normal => User accounts This will open
    the Users-counts tab (see figure 8.3 on page 126).


    +   - If you have more than 15 accounts on the system, Linuxconf will provide
    you with a filter screen (see figure 8.2 on the next page). You can use this to
    select a smaller range of accounts from the full list. To get the full list, select
    Accept without changing any of the parameters. For detailed information on the
    various fields, select the Help button on the Filter control screen.


    +   - Select Add. This will open the User account creation tab (see figure 8.4
    on page 127).


    The account creation tab is where you enter all the information for the new account.
    There are a number of fields you should be aware of, some required, some optional.


    Required Fields:


    +   - Login name – the name of the account. Usually all lowercase. First or last
    names, initials or combination thereof are fairly common login names. For a user
    John T. Smith, "smith," "john," "its," or "jsmith" would be common user names.
    Of course "spike" or something else works just fine, too. You can also use numbers,
    as "its2" would be if you had a second person with the same initials. There is
    no default for this field.


    Optional Fields:


    +   - Full name – this is the name of the user or the account. For an individual,
    it would be their name, "John T. Smith" for example. If the account represents
    a position rather than a person, the full name must be the title. An account called
    "webmaster" might have a full name of "Red Hat Webmaster" or just "Webmaster.\
    There is no default for this field.'
