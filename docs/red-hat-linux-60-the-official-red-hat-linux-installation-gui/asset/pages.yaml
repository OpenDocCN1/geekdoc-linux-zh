  md: '# 11.14 Rescue Modes


    When things go wrong, there are several ways to work on fixing them. However,
    they require that you understand the system well. This manual can''t teach you
    what to do, but we will present the ways that you can use our products to get
    into rescue modes where you can use your own knowledge to rescue the system.


    Through LILO If your system boots, but does not allow you to log in when it has
    completed booting, you can use the single or emergency boot option. The LILO boot:
    prompt, type linux single in order to boot in single-user mode. In single-user
    mode, your local systems will be mounted, but your network will not be activated.
    In emergency mode, almost nothing will be set up. Your root filesystem will be
    mounted, and it will be read-only.


    Emergency Boot Diskettes The boot diskette created during installation of Red
    Hat Linux 6.0 may be used as part of a rescue diskette set. For more information,
    please read the file rescue.txt in the /doc on your Red Hat Linux 6.0 CD-ROM or
    refer to the Official Red Hat Linux Getting Guide.


    # A Handy Trick


    When you have rebuilt a kernel, and want to try out your new hardware, rebooted
    before booting LILO? And you didn''t have an entry for lilo.conf? Read on...


    Here''s a handy trick. In many cases, it''s possible to boot your Red Hat Linux/Intel
    from the Red Hat Linux diskette with your root filesystem mounted and ready to
    go. Here''s how:


    Enter the following command at the diskette''s boot: prompt:


    ```

    linux single root=/dev/hdXX initrd=

    ```


    (Replace the XX in /dev/hdXX with the appropriate number and for your root partition.)


    What does this do? First, it starts in single-user mode, with the root partition
    set to your root partition. The empty initrd specification bypasses the installation-related
    image on the boot diskette, which will cause you to enter single-user mode immediately.


    There is a downside to this trick? Unfortunately, the kernel on the Red Hat Linux
    diskette only has support for IDE built-in, those of you with SCSI-based systems
    won''t be able to use this trick. In that case, you''ll have to use the boot/rescue
    diskette combination mentioned above.'
