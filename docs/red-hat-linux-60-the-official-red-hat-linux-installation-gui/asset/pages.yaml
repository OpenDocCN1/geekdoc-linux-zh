  md: '# 3.4 Selecting an Installation Method


    # 3.4 Selecting an Installation Method


    Next, you will be asked what type of installation method you wish to use. You
    can install Red Hat Linux via any of five basic methods (see Section 2.4 on page
    14), which require the use of a support diskette if you are using a PCMCIA device
    during the install. To summarize, you can install Red Hat Linux from:


    +   CD-ROM - If you have a CD-ROM drive and the Red Hat CD-ROM. Requires a PCMCIA
    support disk only if you will be using a PCMCIA device during the install. Please
    refer to Section 4.2 on page 43 to select the CD-ROM installation method.


    +   Hard Drive - If you copied the Red Hat Linux files to a local hard drive.
    Requires a PCMCIA support disk only if you will be using a PCMCIA device during
    the install. Please refer to Section 4.3 on page 45 to select the hard drive installation
    method.


    +   NFS - If you are installing from an NFS Image server which is exporting the
    Red Hat Linux CD-ROM or a mirror image of Red Hat Linux. Requires a PCMCIA support
    disk only if you will be using a PCMCIA device during the install. Requires a
    network boot disk. Please refer to Section 5.2 on page 68 to select the NFS installation
    method.


    +   FTP - If you are installing directly from an FTP server. Requires a PCMCIA
    support disk only if you will be using a PCMCIA device during the install. Requires
    a network boot disk. Please refer to Section 5.3 on page 69 to select the FTP
    installation method.


    +   HTTP - If you are installing directly from an HTTP Web server. Requires a
    PCMCIA support disk only if you will be using a PCMCIA device during the install.
    Requires a network boot disk. Please refer refer to Section 5.4 on page 69 to
    select the HTTP installation method.


    If you choose to perform a CD-ROM or a hard drive install, please refer to Chapter
    4 on page 43 for those installation instructions.


    If you choose to perform a network-based install (NFS, FTP, HTTP), please refer
    to Chapter 5 on page 65 for those installation instructions.'
