  md: '# C.1 Hard Disk Basic Concepts


    actual disk drive, this is not entirely accurate. In reality, the partition table
    is stored at the very start of the disk, before any "active" flag used by any
    filesystem or user data. But for clarity, we''ll keep it separate in our diagrams.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_258_0.png)


    Figure C.5: Disk Drive with Partition Table


    As Figure C.5 shows, the partition table is divided into four sections. Each section
    can hold the information necessary to define a single partition, meaning that
    the partition table can define no more than four partitions.


    Each partition table entry contains several important characteristics of the partition:


    +   - The points on the disk where the partition starts and ends;

    - Whether the partition is "active";

    - The partition''s type.


    Let''s take a closer look at each of these characteristics. The starting and ending
    points define the partition''s size and location on the disk. The "active" flag
    is used by some operating systems boot loaders. In other words, the operating
    system in the partition that is marked "active" will booted.


    The partition''s type can be a bit confusing. The type is a number that identifies
    the anticipated usage. If that statement sounds a bit vague, that''s because the
    meaning of the partition type is a bit vague. Some operating systems use the partition
    type to denote a specific filesystem type, to flag the partition as being associated
    with a particular operating system, to indicate that the partition contains a
    bootable operating system, or some combination of the three.


    Figure C.6 on the next page contains a listing of some popular (and obscure) partition
    types, along with their numeric values.'
  merge: -1
  pgno: 258
