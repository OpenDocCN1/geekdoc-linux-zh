  md: '# Editing a Partition


    To change a partition''s settings, highlight the partition in the "Current Disk
    Partitions" section, select the Edit button, and press `Space`. You will be presented
    with a dialog box very similar to the one shown in Figure 4.6 on page 52. Make
    the appropriate changes, select **Ok**, and press `Space`.


    **Note:** If the partition already exists on your hard disk, you will only be
    able to change the partition''s mount point. If you want to make any other changes,
    you will need to delete the partition and recreate it.


    # Adding an NFS Mount


    To add a read-only NFS-served filesystem, press `F2`. If you have not selected
    a network-related-installation method, refer to Section 5.1.1 on page 65 for more
    information). Fill in the boxes appropriately. You will then see a dialog box
    "Edit Network Mount Point" (similar to the one in Figure 4.1 on page 48). In this
    dialog box you will need to enter the NFS server name, the path to the exported
    filesystem, and the mount point for the filesystem. Select **Ok** or **Cancel**
    button as appropriate, and press `Space`.


    # Starting Over


    If you''d like to abandon any changes you''ve made in Disk Druid, and would rather
    use `fdisk` instead, you can select the **Back** button, and press `Space`. If
    you want to continue using Disk Druid, but would like to start over, press `F5`
    and Disk Druid will be reset to its initial state.


    # When You''re Finished...


    Once you''ve finished configuring partitions and entering mount points, your screen
    should look something like the one in Figure 4.8 on the facing page. Select **Ok**,
    and press `Space`. Then turn to Section 4.8 on page 38.


    # 4.7.3 Using fdisk


    If you''d rather use `fdisk` to manage partitions, this is the section for you.
    Once you''ve selected `fdisk`, you''ll be presented with a dialog box titled "Partition
    Disks" (see Figure 4.9 on the facing page). In this box is a list of every disk
    on your computer. Move the highlight to the disk you''d like to partition, select
    **Edit**, and press `Space`. You will then enter `fdisk` and can partition the
    disk you selected. Repeat this process for each disk you want to partition. When
    done, select "Done".'
  merge: -1
  pgno: 69
