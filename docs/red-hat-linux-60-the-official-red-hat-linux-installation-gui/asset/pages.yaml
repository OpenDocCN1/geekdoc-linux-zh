  md: '# 6.9 Installing LILO


    # 6.9.2 Adding Options to the LILO Boot Command Line


    Next, the installation program will ask you if you wish to add default options
    to the LILO boot command (see Figure 6.20). Any options you enter will be passed
    to the Linux kernel every time it boots When you reviewed your computer''s BIOS
    settings in Section 2.3 on page 10, if your computer accesses a hard drive in
