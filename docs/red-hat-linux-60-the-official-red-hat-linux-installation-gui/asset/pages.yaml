  md: '# 8


    # # System Configuration


    After installing your Red Hat Linux system, it''s easy to think that the decisions
    you made during the installation are engraved in granite, never to be changed
    again. Nothing could be further from the truth!


    One of the main strengths of Linux is that the operating system can be configured
    to do just about anything. Here at Red Hat Software, we try to make system configuration
    as easy and accessible as possible. To that end, we''ve worked hard on two fronts:


    +   * By developing system configuration tools in-house;

    * By working with outside developers of world-class system configuration tools.


    Anyone familiar with Red Hat Linux over the years has probably seen what we call
    "control panel" system configuration tools. These tools have been developed by
    Red Hat Software to make system configuration easier, and while these tools do
    make life easier for the Red Hat Linux user, we began a search for a system configuration
    tool with even more flexibility and power.


    Our search ended with the inclusion of Linuxconfig into Red Hat Linux 5.1 in June
    1998. Now, with this version of Red Hat Linux, we''ve been able to more fully
    document the popular aspects of system configuration using Linuxconfig.


    Note that we said "popular aspects." One of Linuxconfig''s greatest strengths
    – the incredible range of configuration options under its control – is actually
    a liability when it comes time to document'
