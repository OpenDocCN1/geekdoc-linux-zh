    In the left column the information list, you''ll find the size of the package,
    the machine on which the file is found, the name of the package distribution and
    the group to which its function belongs.


    In the right column, you''ll find the date of the package''s installation on your
    machine, the date the package was built, the name of the vendor and the name of
    the group who packaged the software. If the package has not been installed on
    your machine, that space will simply read, “not installed.”


    Below the description is a list of the files contained in the package. If a D
    appears in its related column to the left of the path, that file is a documentation
    file and would be a good thing to read for help using the application. If a C
    appears in its respective column, it is a configuration file. Under the S column,
    you can view the “state” of the package; here, you''ll receive information if
    any files are reported as “missing” from the package (and therefore probably there''s
    a problem with the'
