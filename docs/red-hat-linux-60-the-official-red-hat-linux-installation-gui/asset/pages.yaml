    lwrxwrxwrwx 1 root root 14 3:32 S40cron -> ..init.d/cron

    lwrxwrxwrwx 1 root root 14 3:11 S01init -> ..init.d/init

    lwrxwrxwrwx 1 root root 13 3:11 S05nfs -> ..init.d/nfs

    nlwrxwrxwrwx 1 root root 15 3:11 S07nfsfs -> ..init.d/nfsfs

    lwrxwrxwrwx 1 root root 18 3:11 S91lpd -> ..init.d/lpd

    lwrxwrxwrwx 1 root root 11 3:11 S99local -> ../rc.local

    ```


    What you''ll notice is that there are no real "files" in the directory. Everything
    there is a link to one of the scripts in the init directory. The links also have
    an "S" and a number at the Beginning. The "S" means to start this particular script
    and a "K" means to stop it. The number is just for ordering purposes. Init will
    start all the services based on the order in which they appear. You can duplicate
    numbers, but it will only confuse you somewhat. You only need to use a two digit
    number, with an upper case "S" or "K" to start or stop the services you require
    to.


    How does init stop services? Simple. Each of the scripts is written to accept
    an argument which can be "start" and "stop." You execute those scripts by hand,
    in fact, with a command like:


    ```

    /etc/rc.d/init.httpd init stop

    ```


    to stop the httpd server. Init reads the name and if it has a "K," it calls the
    script with the "stop" argument. If it has an "S it calls the script with a "start"
    argument.


    Why all these runlevels? Some want an easy way to set up machines to be multi-purpose.
    You could have a "server" runlevel that just runs init, sendmail, networking,
    etc. Then you could have a "user" runlevel that runs xdm, networking, etc.


    # 11.1.3 Init Runlevels


    Generally, Red Hat Linux operates in run level 3— multiuser mode. The following
    runlevels are defined in Red Hat Linux:


    +   0 Halt

    1 Single user mode

    2 Multiuser mode, without NFS

    3 Full multiuser mode

    4 Not used'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# 11.13 The Boot Process, Init, and Shutdown


    +   5 Full multiuser mode (with an X-based login screen)

    6 Reboot


    If your machine gets into a state where it will not boot due to a bad /etc/inittab,
    or will not let you log in because you have a corrupted /etc/passwd or have simply
    forgotten your password, log into single user mode by using linux at the LILO
    boot prompt. A very bare system will come up and you will be given a shell from
    which you can fix things.


    # 11.13.4 Initscript Utilities


    chkconfig utility provides a simple command-line tool for maintaining the /etc/rc.d
    directory. It relieves system administrators from having to directly manipulate
    the numerous symlinks in /etc/rc.d.


    In addition, there is the ntsys utility, that provides a screen-oriented interface,
    chkconfig''s command-line interface.


    Please see the chkconfig and ntsysv pages for more information.


    # 11.13.5 Running Programs at Boot Time


    The file /etc/rc.d/rc.local is executed at boot time, after all other initialization
    is complete, and whenever you change runlevels. You can add additional initialization
    commands here. In addition, you may want to start up additional daemons, or initialize
    a printer. In addition if you require serial port setup, you can edit /etc/rc.d/rc.serial,
    and it will be executed automatically at boot time.


    The default /etc/rc.d/rc.local simply creates a nice login banner with your kernel
    version and machine type.


    # 11.13.6 Shutting Down


    To shut down Red Hat Linux, issue the shutdown command. You can read the shutdown
    man page for complete details, but the two most common usages are:


    ```

    shutdown -h now

    shutdown -r now

    ```


    Each will cleanly down the system. After shutting everything down, the first will
    halt the machine, and the second will reboot.


    Although the reboot and halt commands are now "smart" enough to invoke shutdown
    if run while the system is in runlevels 1-5, it is a bad habit to get into, as
    not Linux-like operating systems have this feature.'
