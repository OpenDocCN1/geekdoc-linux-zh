  md: "# 8.1 System Configuration with Linuxconf\n\nOne thing to keep in mind is that\
    \ all of a device's files and directories are relative to its mount point. Consider\
    \ the following example:\n\n+   - A Linux System\n  - system root directory\n\
    \  - foo — mount point for the CD-ROM\n- A CD-ROM\n  - CD-ROM's root directory\n\
    \  - images — a directory of images on the CD-ROM\n  - images/old — a directory\
    \ of old images\n\nSo, if the above describes the individual filesystems and you\
