    space provided by a larger drive made for more clutter. On the technical side,
    some filesystems

    were never designed to support larger drives. Or the filesystems *could support
    larger drives*, but the

    overhead imposed by the filesystem became excessive.


    The solution to this problem was to divide disks into *partitions*. Each partition
    can be accessed as it

    was a separate disk. This is done through the addition of a *partition table*.


    **Please Note:** While the diagrams in this chapter show the partition table as
    being separate from the'
