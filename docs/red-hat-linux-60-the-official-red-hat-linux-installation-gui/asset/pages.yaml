  md: '# Preface


    Welcome! And thanks for your interest in Red Hat Linux. We have what we think
    is the best Linux distribution on the market today, and we work hard to keep it
    that way. Red Hat Linux 6.0 is the latest in a long line of software from Red
    Hat Software. We hope you like it, and that you enjoy using Red Hat Linux as much
    as we''ve enjoyed making it for you.


    While Linux is popular and well-known by a certain segment of the computer-using
    population, there are many people out there that are only now hearing about Linux.
    For this group of people, the following section should provide enough background
    to help you get acquainted with Linux and Red Hat Software.


    # What is Linux?


    Back in August of 1991, a student from Finland began a post to the comp.os.minix
    newsgroup with the words:


    > Hello everybody out there minix -

    I''m doing a (free) operating system (just a hobby),

    won''t be big and professional like gnu) for

    386(486) AT clones.


    The student Linus Torvalds, and the "hobby" he spoke of eventually became what
    we know today as Linux.


    A full-featured POSIX-like operating system, Linux has been developed not just
    by Linux, but by hundreds of programmers around the world. The interesting thing
    about this is that this massive, world-wide effort is largely uncoordinated. Sure,
    Linux calls the shots that the kernel is concerned, but Linux is more than just
    the kernel. There''s no management infrastructure; a student in Russia gets a
    new motherboard, and writes a driver to support a neat feature the motherboard
    has. A system administrator in Maryland needs backup software, writes it, and
    gives it away to anyone that needs it. The right things just seem to happen at
    the right time.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Another interesting thing is that Linux can be obtained for absolutely no money.
    That''s right, most of the software is available (at no charge) to anyone with
    the time and inclination to download it. But not everyone has that much time...


    # # What is Red Linux?


    Enter a group of programmers based in North Carolina. Their goal was to make it
    easy for every people to give Linux a try. Like many other groups, their approach
    was to bundle all the necessary bits and pieces into a cohesive distribution,
    relieving ''newbies'' from some of the more esoteric aspects of bootstrapping
    a new operating system on their PCs.


    However, unlike other distributions, this was fundamentally different. The difference?
    Instead of being a snapshot of a hard disk that had a working copy of Linux on
    it, or a set of diskettes from which parts of the operating system were dumped,
    this distribution was based on packages.


    Software development in the Linux world is fast-paced, so new versions of software
    come continually. With other distributions, upgrading software is painful – a
    complete upgrade usually means deleting everything on your hard drive and starting
    over.


    Each package provided a different piece of software, fully tested, configured,
    and ready to run. Want to try a new editor? Download the package and install it.
    In seconds, can you give it a try. Don''t like it? Issue a single command, and
    the package is removed.


    If that was all there to it, this would be pretty nifty. But being package-based
    meant there was one additional advantage:


    This distribution could be easily upgraded.


    Now you''ve probably guessed that the group of programmers in North Carolina is
    Red Hat Soft-ware, and the package-based distribution is Red Linux.


    Since Red Hat''s introduction in the summer of 1994, Linux and Red Hat Software
    have grown by leaps and bounds. Much has changed; support for more esoteric hardware,
    huge increases in reliability, and the growing use of Linux by people around the
    world.


    But still remain the same. Linux is still developed by people world-wide; Linux
    is still-volved. Red Hat Software is still located in North Carolina; still trying
    to make Linux easier for people to use.


    And Red Hat is still package-based; always has, always will be.


    Since the release of 4.0, Red Hat runs on three computing platforms: Intel compatible
    PCs, Digital Alpha computers, and Sun SPARC equipment. Our unified source tree
    and the benefits of RPM (Red Hat Package Management) technology enable us to deploy
    Red Hat Linux for each platform with a minimum of effort. This turn enables us
    to manage and port software between these platforms as easily as possible.


    We make Red Linux available by unrestricted FTP from our site and many mirror
    sites on the'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Preface


    Internet. Red Hat Linux is also available on CD-ROM. For current information on
    our product offerings and links to other Red Hat Resources please check Red Hat
    Software''s web site at http://www.redhat.com.


    On many systems, Red Hat Linux is easy to install; the installation program can
    walk you through the process in as as 13 minutes. The system itself is very flexible.
    With RPM, you can install and uninstall software packages with minimal effort.
    Because of RPM, Red Hat Linux is also easy to maintain—package installations can
    be verified and corrected, and uninstalled simply and reliably. Furthermore, Red
    Hat Linux is easy to administer. Included a rich set of administrative tools which
    reduce the hassle of everyday system administration. Complete source code is provided
    for the freely distributable components of the system.


    # An Overview of This Manual


    This manual is organized to guide you through the process of installing Red Hat
    Linux quickly and easily. To that goal, let''s take a quick look at each chapter
    to help you get acclimated:


    +   - **Chapter 1, New Features Of Red Hat Linux 6.0** contains information concerning
    new functionality that has been added to Red Hat Linux 6.0.

    - **Chapter 2, Before You Begin** contains information on tasks you should perform
    prior to the Red Hat Linux installation.

    - **Chapter 3, Starting the Installation** contains detailed instructions for
    starting the Red Hat Linux installation.

    - **Chapter 4, Local Media Installations** contains instructions on installing
    Red Hat Linux from a CD-ROM or hard drive.

    - **Chapter 5, Network Installations** contains instructions on installing Red
    Hat Linux via NFS, FTP, or HTTP.

    - **Chapter 6, Finishing the Installation** contains instructions on the last
    steps required to complete the process.

    - **Chapters 7–11** explain how to find documentation system management and administration
    tools which accompany Red Hat Linux. They also include an explanation of what''s
    special about your Red Hat Linux system, including where files live and more.


    Appendices contain extra information about Red Hat Linux, including an explanation
    of Red Hat Software''s support offerings, package lists, and more.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Quick Start Information


    Those of you have installed Red Hat Linux/Intel before and are in a hurry to get
    started need boot from a boot diskette (or the Red Hat Linux/Intel CD-ROM, if
    your computer supports booting from CD-ROM). There are two boot disks, for CD-ROM
    and hard drive installations and for NFS, FTP, and HTTP installations. Next, select
    the desired installation method. If you are using a PCMCIA device during the installation,
    you will need to use the PCMCIA support disk.


    If you are attempting to install Red Hat Linux for either the Alpha or the SPARC,
    you should read Chapter 2 on page 5. It will refer you to information specific
    to your non-Intel based system.


    # Upgrading from a Prior Version of Red Hat Linux


    The installation process for Red Hat Linux 6.0 includes the ability to upgrade
    from prior versions of Red Hat Linux (2.0 through 5.2, inclusive) which are RPM
    technology. Upgrading your system installs the modular 2.x kernel as well as updated
    versions of the packages that are installed on your machine. The upgrade process
    preserves existing configuration files using a .rpmsave extension (e.g., sendmail.cf.rpmsave)
    and leaves a log telling what actions it took in /tmp/upgrade.log. As software
    evolves, configuration file formats change, so you should carefully compare your
    original configuration files to the new files before integrating your changes.


    # A Word From the Developers


    We would like to thank all beta testers for entrusting their systems to early
    versions of Red Hat Linux and taking the time to submit bug reports from the front,
    especially those of you who have been with Red Hat since the "Halloween" release
    and earlier. We would also like to thank Lincolnvalds and the hundreds of developers
    around the world for creating, truly, one of the wonders of distributed development.


    And, again, we''d like to thank you for your interest in Red Hat Linux!


    The Red Hat Development Team


    +   If you need a boot disk for network type installations, you will have to create
    one. See section 25 on page 18 for that informtaion

    If you are using a PCMCIA device during the install you will need to create a
    PCMCIA support disk.

    Section 2.6 on page 18 will describe how that disk is made'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Preface


    # Notes from the Editor


    The evolutionary process of expanding the scope of this Installation Guide continues.
    As before, we''ve updated the chapters related to the actual installation process.
    We''ve also updated the New Features chapter to reflect all the good stuff that''s
    been added to Red Hat Linux 6.0. We consider this to be "business as usual."


    We''ve also made some changes as a direct result of customer feedback. Some people
    have expressed confusion over all the different terms, abbreviations and acronyms
    that seem to surround computer technology in general, and in Linux. For those
    people, we''ve added a glossary. While it''s not our goal to include a complete
    dictionary with every copy of Red Hat Linux, if you think a particular word should
    be present but is not, feel free to let us know docs@redhat.com.


    As the linux system configuration continues to mature, we''ve created a new system
    configuration containing task-based linuxcond documentation, as well as vestiges
    of the controls that still remain. Our goal is to continue adding linuxcond documentation;
    what you see here is just a first step in process.


    The package list has proven to be quite popular; this time we''ve improved it
    by adding icons showing whether a given package is part of a pre-defined set of
    packages.


    All of this has resulted in the Installation Guide putting on a little weight.
    This is a trend that we expect to continue, which leads us right into the next
    section...


    # We Need Feedback!


    If you spot a typo in the Installation Guide, or if you''ve thought of a way to
    make this manual better, we''d love to hear from you! Be sure to mention the manual''s
    identifier:


    > Inst-6.0-Print-RHS (04/99)


    That we''ll know exactly which version of the guide you have provide


    Please send to:


    docs@redhat.com


    If you have a suggestion, try to be as specific as possible when describing it.
    If you''ve found an error, please include the section and number of the surrounding
    text so we can find it easily. We may not be able to respond to every message
    sent to us, but you can be sure that we''ll reading them all!'
  merge: -1
