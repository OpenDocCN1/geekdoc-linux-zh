  md: '# 2.2.4 Checking for Updated Diskette Images


    From time to time, we find that the installation may fail, and a revised diskette
    image is required for the installation to work properly. In these cases, we make
    special images available via the Red Hat Linux Errata.


    Since this is a relatively rare occurrence, you will in general save time if you
    try to use the standard diskette images first, and then download the Errata only
    if you experience problems completing the installation.


    There are two ways to view the Errata:


    +   1. **World Wide Web** – By pointing your web browser at http://www.redhat.com/errata,
    you can read the Errata On-line, and download diskette images.


    +   2. **Electronic Mail** – By sending an empty mail message to errata@redhat.com,
    you will receive a mail message containing the complete Errata. Also included
    are URLs to each updated package and diskette image in the Errata. By using these
    URLs, you can download any necessary diskette images. Remember to use binary mode
    when transferring a diskette image!


    For now, concentrate only on the Errata entries that include new diskette images
    (the filenames ending in .img). If you find an entry that seems to apply to your
    problem, get a copy of the diskette images, and create them using the instructions
    in Appendix B on page 237.


    # 2.3 Things You Should Know


    In order to prevent any surprises during the installation, you should collect
    some information before attempting to install Red Hat Linux. You can find most
    of this information in the documentation that came with your system, or from the
    system''s vendor or manufacturer.


    **Note:** The most recent list of hardware supported by Red Hat Linux Software''s
    World Wide Web site at http://www.redhat.com/hardware. It''s a good idea to check
    your hardware against this list before proceeding.


    # 2.3.1 Basic Hardware Configuration


    You should have a basic understanding of the hardware installed in your computer,
    including:


    +   *hard drive(s)* – Specifically, the number, size, and type. If you have more
    than one, it''s helpful to know which one is first, second, and so on. It is also
    good to know if your drives are IDE or SCSI. If you have IDE drives, you should
    check your computer''s BIOS to see if you are accessing them in LBA mode. Please
    refer to your computer''s documentation for the proper sequence to access the
    BIOS. Note that your computer''s BIOS may refer to LBA mode by'
