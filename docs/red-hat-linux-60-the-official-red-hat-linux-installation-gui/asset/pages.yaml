    These are just several examples. As you use the system you will find many more
    uses for RPM.


    # 9.4 Other RPM Resources


    For more information on RPM, check out the man page, the help screen (rpm --help),
    and the RPM documents available at


    ```

    http://www.rpm.org/

    ```


    There is an RPM book available. It''s called Maximum RPM


    There is also a mailing list for discussion of RPM related issues, called

    rpm-list@redhat.com. The list is archived on

