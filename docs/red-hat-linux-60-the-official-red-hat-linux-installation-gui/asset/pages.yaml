    Figure 5.9: Upgrading or Installing


    # 5.5.2 Upgrading


    The installation process for Red Hat Linux 6.0 includes the ability to upgrade
    from previous versions of Red Hat Linux (version 2.0 and later) which are based
    on RPM technology. Upgrading your system installs the modular 2.2.x kernel as
    well as updated versions of the packages which are currently installed on your
    machine. The upgrade process preserves configuration files by renaming them using
    an .rpmsave extension (e.g., sendmail.cf.rpmsave) and leaves a log telling what
    actions it took in /tmp/upgrade.log. As software evolves, configuration file formats
    change, so you should carefully compare your original configuration files to the
    new files before integrating your changes.


    If you wish to upgrade your Red Hat Linux system, choose **Upgrade.**


    **Please Note:** Some upgraded packages may require that other packages are also
    installed for proper operation. The upgrade procedure takes care of these *dependencies*,
    but it may need to install additional packages.


    **Please Note:** If you already have the X Window System (and possibly an older
    version of GNOME) on your machine you may see a screen that prompts you to install
    the latest version of GNOME included in this release.


    # 5.6 Installation Class


    If you choose to perform a full install, the installation program will ask you
    to choose an installation class (see Figure 5.10 on the next page). You will not
    see this screen if you choose to perform an upgrade. You may choose from the following
    installation classes:'
