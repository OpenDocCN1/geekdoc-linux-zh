  md: 'package).


    If you''re querying a package that''s already installed, you''ll also find two
    additional buttons beneath at the bottom of this window: **Verify** and **Uninstall**.
    If you''re performing a query on a package that hasn''t been installed yet, the
    buttons on the bottom will be labeled **Install**, **Upgrade** and **Check Sig.**


    To close the query window without performing any action, left-click on the **X**
    at the top right of the window bar.


    # 10.5.2 Verifying Packages


    Verifying a package checks all of the files in the package to ensure they match
    the ones present on your system. The checksum, file size, permissions, and owner
    attributes are all checked the database. This check can be used when you suspect
    that one of the program''s files has become corrupted for some reason.


    Choosing the packages to verify is like choosing the packages to query. Select
    the packages in the display window and use the **Verify** button on the toolbar
    or from **Packages ⇒ Verify** on the menu. A window opens like the one in Figure
    10.6.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_207_0.png)


    Figure 10.6: Verify Window


    As the package is being checked, you''ll see the progress in the **Verify** window.
    If there are any problems discovered during the verify process, they''ll be described
    in the main display area.


    # 10.5.3 Uninstalling Packages


    Uninstalling a package removes the application and associated files from your
    machine. When a package is uninstalled, any files it uses are not needed by other
    packages on your system are also removed. Changed configuration files are copied
    to `<filename>.rpmsave` so you can recover them later.'
