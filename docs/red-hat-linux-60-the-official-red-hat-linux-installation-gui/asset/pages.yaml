  md: '# 8.2 System Configuration with the Control Panel


    # Adding a Networking Interface


    If you have added a networking interface to your machine since installing Red
    Hat Linux, or you didn''t configure your ethernet card at install time, you can
    configure it with a few clicks of a mouse.


    **Please Note:** You may need to configure `kerneld` to load a driver for the
    network interface you are adding (e.g., `eth0`): see Section 8.2 on page 165 for
    more information.


    Begin adding an interface by clicking on **Interfaces** in the main panel. This
    will bring a window of configured devices with a row of available options, see
    Figure 8.42.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_184_0.png)


