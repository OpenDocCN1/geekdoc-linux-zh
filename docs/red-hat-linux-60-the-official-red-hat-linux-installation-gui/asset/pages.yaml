- img_proc: true
  md: '# 11.13 The Boot Process, Init, and Shutdown


    SysV init also differs from BSD init in the config files are in a subdirectory
    of /etc instead of residing directly in /etc. This directory is called rc.d. In
    there you will find rc.sysinit and the following directories:


    ```

    init.d

    rc0.d

    rc1.d

    rc2.d

    rc3.d

    rc4.d

    rc5.d

    rc6.d

    ```


    init.d contains a bunch of scripts. Basically, you require one script for each
    service you may need to start at boot or when entering another runlevel. Services
    include things like networking, nfs, sendmail, http, etc. Services do not include
    things like itself that must be run once and then exited. Things like that should
    go in rc.local or rc.serial.


    If you want rc.local, it should be in /etc/rc.d. Most systems include one even
    though it doesn''t do much. You can also include rc.serial in /etc/rc.d if you
    need to do port specific things at boot time.


    The chain of events is as follows:


    +   * The kernel looks in several places for init and runs the first one it finds

    * init runs /etc/rc.d/rc.sysinit

    * rc.sysinit does a bunch of necessary and then runs rc.serial (if it exists)

    * init runs all the scripts for the runlevel.

    * init runs rc.local


    The default runlevel is decided in /etc/initabb. You should have a line close
    to the top like:


    ```

    init:3:initdefault:

    ```


    From this, you''d look in the second column and see the default runlevel is 3,
    as should be the case for most systems. If you want to change it, you can edit
    /etc/initabb by hand and change the 5. Be very careful when you are messing with
    the initabb. If you mess up, you can fix it by rebooting and doing:


    ```

    LILO boot: linux single

    ```'
  merge: -1
  pgno: 240
