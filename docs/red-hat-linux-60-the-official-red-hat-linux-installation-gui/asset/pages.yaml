  md: '# Glossary


    **PCMCIA** A diskette required for Red Hat Linux installations that require the
    use of a PCMCIA device during the install.


    **Permissions** The set of identifiers that control access to files. Permissions
    consist of three fields: user, group, and world. The user field controls access
    by the user owning the file, while the group field controls access by anyone matching
    the file''s group specification. As the names imply, the world field controls
    access by everyone. Each file contains the same set of bits which specifies operations
    that may or may not be performed, such as reading, writing, and executing.


    **PLIP** An abbreviation for Parallel Line Internet Protocol. PLIP is a protocol
    that permits TCP/IP communication over a computer''s parallel port using a specially-designed
    cable.


    **POSIX** A somewhat mangled abbreviation for Portable Operating System Interface.
    A set of standards that grew out of the UNIX operating system.


    **Process** A process (in somewhat simplistic terms) is one instance of a running
    program on a Linux system.


    **PS/2 Mouse** A PS/2 mouse gets its name from the original in which this type
    of mouse was first used - the IBM PS/2. A PS/2 mouse can be easily identified
    by the small, round connector at the end of its cable.


    **RAM** An acronym for Random Access Memory: RAM is used to hold programs while
    they are being executed, and data while it is being processed. RAM is volatile,
    meaning that information written to RAM will disappear when the computer''s power
    is turned off.


    **Reboot** To restart the boot process. See also "Boot."


    **Red Hat Software** A North Carolina software company: Produces and markets software
    for the Linux operating system, including Red Hat Linux.


    **Rescue Diskette** A diskette containing a rudimentary environment system. As
    the names imply, rescue diskette is normally used in an attempt to "rescue" an
    ailing system from the necessity of re-installing the entire operating system.


    **RISC** An abbreviation for Reduced Instruction Set Computer. A design philosophy
    for computers whereby the processor is optimized to execute a relatively small
    number of different instructions in a predictably amount of time. Contrast with
    CISC.'
