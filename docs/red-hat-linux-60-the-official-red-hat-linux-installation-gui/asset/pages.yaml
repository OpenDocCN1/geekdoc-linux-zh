  md: '# General Parameters and Modules


    This appendix is provided to illustrate some of the possible parameters that may
    be needed by certain drivers. It should be noted that, in most cases, these additional
    parameters are unnecessary. Also included is a list of network hardware and the
    associated modules required by that hardware.


    Please keep in mind that if a device you are attempting to use requires one of
    these parameters, and for support that device is not compiled into the kernel,
    the traditional method of adding the parameter to the LILO boot command will not
    work. Drivers loaded as modules require that these parameters are specified when
    the module is loaded. The Red Hat installation program gives you the option to
    specify module parameters when a driver is loaded.


    For more information concerning the device support compiled into the kernel used
    by the Red Hat Linux installation program, please refer to Section 2.9 on page
    32.


    **Please Note:** Not all of the cards that are listed are supported. Please check
    the hardware compatibility list on Red Hat Software''s World Wide site at http://www.redhat.com/support/docs/hardware.html
    to make sure your card is supported.


    One of the more commonly used parameters, the hdx-cdrom parameter, can be entered
    at the boot prompt, as it deals with support for IDE/ATAPI CD-ROMs, which is part
    of the kernel.


    In the tables below, modules without any parameters listed are either able to
    auto-probe to find the hardware, or require you to manually change settings in
    the module source code, and recompile.'
