  md: '# A.2 Getting Support


    # A.2.2 Support Questions


    Technical support is a black art: in most cases, support technicians rely solely
    on communication with the customer to solve installation problems on hardware
    the technicians have never physically seen. It is extremely important, therefore,
    to state your question clearly and concisely; including detailed information such:


    +   - symptoms of the problem ("Red Hat Linux 6.0 does not recognize my CD-ROM
    drive")

    - when the problem began ("It stopped working yesterday...")

    - what changes you have made to your system around the time of the problem ("...
    after I disconnected it from the IDE controller")

    - any diagnostic output specifically related to the problem ("In the bootup messages,
    it says ''Cannot find /dev/hdb: device disconnected''\). However, this can be
    taken overboard; send us your system logs unless we ask for them;

    - other relevant information ("I''m using the floppy installation method, from
    the CD.")


    # How to Send Them


    Red Hat''s support system is email-based and partially automated; for this reason,
    it is important to make sure you send support questions in the correct format,
    so that your message is recognized and routed to an appropriate support technician.
    In order to receive technical support for your Red Hat software product, you must
    first register it.


    Submitting tickets can be performed in the traditional email way, or be initiated
    via the World Wide Web. After providing the information for the registration,
    you will have a new menu allowing you to edit your registration information or
    open a trouble ticket. Hurry and login to open a ticket on the Web: http://www.redhat.com/support/


    To open a support ticket via email, all you need to do is send the support ticket
    system message with a Subject: [registration nnnn nnnn nnnn nnnn], nnnn nnnn nnnn
    nnnn is the registration number of the product for you are requesting support.
    For example, if your registration number is fff 0ff fff 00ff the subject line
    should be:


    ```

    Subject: [registration fff 0ff fff 00ff]

    ```


    The square brackets, the number sign, and the word ''registration'' must be present.
    If you wish, you may add explanatory text to the subject line:


    ```

    Subject: [registration fff 0ff fff 00ff] CD-ROM

    ```


    Once you''ve opened a ticket, support responses come to you with the support ticket
    number in the subject line:'
