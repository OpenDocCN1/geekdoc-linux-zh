    # 11.13.2 System V Init


    This section is a brief description of the internals of the boot process. It basically
    covers in how

    t machine boots using SysV init, as well as the differences between the init used
    in older Linux

    releases, and SysV init.


    Init is the program that runs by the kernel at boot time. It is in starting all
    the normal

    processes that need to run at boot time. These include the getty processes that
    allow you to log in,

    NFS daemons, FTP daemons, and anything else you want to run when your machine
    boots.


    SysV init is fast becoming the standard in the Linux world to control the startup
    of software at boot

    time. This is because it is easier to use and more powerful and flexible than
    the traditional BSD init.'
  merge: -1
