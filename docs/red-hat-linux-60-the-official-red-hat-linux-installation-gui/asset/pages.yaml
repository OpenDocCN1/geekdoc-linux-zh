  md: '# 10.4 Configuration


    GnoRPM offers a wide selection of choices for installing and uninstalling packages,
    documentation and other features. You can customize GnoRPM through the Preferences
    dialog, which you can access from Operations ⇒ Preferences on the menu. To make
    selections in the Preferences dialog, select the boxes next to the options.


    Under the Behavior tab, you''ll find a number of options for configuring the way
    GRPM installs, uninstalls and upgrades packages. The Behavior tab is split into
    five sections: Install, Upgrade, Other, Database and Architecture. Note that by
    default these boxes were not checked.


    Under Install Options, you have selected the following:


    +   - Dependency checks - When selected, this will install or upgrade a package
    without check- for other types of files on which the program may be dependent
    in order to work. However, unless you know what you''re doing we strongly suggest
    you not use this option as some packages may depend on other packages for files,
    libraries or functions to function correctly.


    +   - Reordering - This option is useful if RPM is able to change the installation
    order of some packages to satisfy dependencies.


    +   - Don''t run scripts - Pre- and post-install scripts are sequences of commands
    that are sometimes included in packages to assist with installation. This check
    box is similar to the --noprocripts option when installing from the shell prompt.


    Under Upgrade Options, you can select the following:


    +   - Allow replacement of packages - Replaces with a new copy of itself. Similar
    to the --replacepackages option from the shell prompt. This option can be useful
    if an already-installed package has been damaged or may require other repair to
    function correctly.


    +   - Allow replacement of files - Allows the replacement of files which are owned
    by another package. The shell prompt equivalent for this RPM option is --replacefiles.
    This can sometimes be useful when there are two packages with the same name but
    different contents.


    +   - Allow upgrade to old version - Like the shell prompt equivalent --oldpackage,
    this option allows you to "upgrade" to an earlier package. It can sometimes be
    useful if the latest version of a package doesn''t function correctly for your
    system.


    +   - Keep packages made obsolete - Prevents packages listed in an Obsoletes header
    from being removed.


    In Other Options, you can select:


    +   - Don''t install documentation - Like --excludedocs, this option can save
    on disk space by excluding documentation as man pages or other information related
    to the package.'
