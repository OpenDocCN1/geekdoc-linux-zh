  md: '# An Introduction to Disk Partitions


    Disk partitions are a standard part of the personal computer landscape, and have
    been for quite some time. However, with many people purchasing computers featuring
    preinstalled operating systems, relatively few people understand how partitions
    work. This chapter attempts to explain how disk partitions work so you''ll find
    your Red Hat Linux installation is as simple as possible.


    # C.1 Hard Disk Basic Concepts


    Hard disks perform a very simple function – they store data and reliably retrieve
    it on command.

    When discussing issues like disk partitioning, it''s important to know a bit about
    the underlying hardware; unfortunately, it''s easy to become bogged down in details.
    Therefore, let''s use a simplified diagram of a disk drive to help us explain
    what goes on ‘under the hood.’ Figure C.1 on the following page shows a brand-new,
    unused disk drive.


    Not much to look at, is it? But if we''re talking about disk drives on a basic
    level, it will do. Let''s say that we''d like to store some data on this drive.
    As things stand now, it won''t work. There''s something we need to do first...'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# C.1.1 It''s Not What You Write, it''s How You Write It


    The old-timers in the audience probably got this one of the first try. We need
    to format the drive. Formatting (usually known as “making a filesystem” in Linux
    parlance) writes information to the drive, creating order out of the empty space
    in an unformatted drive.


    As Figure C.2 on the next page implies, the order imposed by a filesystem involves
    some tradeoffs:


    +   - A small percentage of the drive’s available space is used to store filesystem-related
    data, and can be considered as overhead.


    +   - A filesystem splits the remaining space into small, consistently-sized segments.
    In the Linux world, these segments are known as inodes¹.


    Given that filesystems make things like directories and files possible, these
    tradeoffs are usually seen as a small price to pay.


    It’s worth noting that there is no single, universal filesystem; as Figure C.3
    on the facing page shows, a drive may have one of many different filesystems written
    on it. As you might guess, different filesystems tend to be incompatible; that
    is, an operating system that supports one filesystem (or a handful of related
    filesystem types) may not support another. This last statement is not a hard-and-fact
    rule, however. For example, Red Hat Linux supports a wide variety of filesystems
    (including many commonly used by other operating systems), making interchange
    easy.


    > ¹odes really are consistently-sized, unlike our illustrations. Also, keep in
    mind that an average drive contains thousands of inodes. But for the purposes
    of this discussion, please ignore these minor discrepancies.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_255_0.png)'
  merge: -1
  pgno: 255
- img_proc: true
  md: '![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_256_0.png)


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_256_1.png)'
