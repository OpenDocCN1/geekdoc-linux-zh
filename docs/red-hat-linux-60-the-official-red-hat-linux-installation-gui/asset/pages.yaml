    that must be installed on your system. For example, many of the Red Hat system
    admin-

    istration require the `python` and `python` packages. To make sure your system
    has all the

    packages it needs in order to be fully functional, Red Linux checks these package
    *dependencies*

    each time you install or remove software packages.


    After you have finished selecting packages to install, the installation program
    checks the list of se-

    lected packages for dependencies. If any package requires another which you have
    not

    selected to install, the program presents a list of these *unresolved dependencies*
    and gives you the op-

    ion to resolve them (see Figure 2.25). If you press **Ok**, the program will resolve
    them

    utomatically by adding required packages to the list of selected packages.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_104_0.png)


    Figure 2.25: Unresolved Dependencies


    # 5.11.4 Package Installation


    After all package dependencies have been resolved, the installation program presents
    a dialog box

    telling you that a log file containing a list of all packages installed will be
    written to

    `/tmp/install.log` on your Red Linux system. Select **Ok** and press **Space**
    to continue.'
