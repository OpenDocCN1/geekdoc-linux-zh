  md: '# How To Do It


    As the name implies, you''ll need a Red Hat Linux CD-ROM, a supported CD-ROM drive,
    and a means of starting the installation program.


    Intel systems will need to use the boot diskette (and the PCMCIA support if PCMCIA
    device is used during the install). There is an alternate method of installing
    from CD-ROM that uses no diskettes, but requires the system to be running DOS.
    We''ll discuss this approach (known as autoboot) in Section 3.2.1 on page 38.
    For note, that PCMCIA support is not available when using autoboot.


    **Please Note:** The Red Hat Linux/Intel CD-ROM can be booted by newer computers
    that support bootable CD-ROM, so if you can''t from CD-ROM, you''ll need a boot
    diskette (or autoboot from DOS) to get things started. Note that you may need
    to change BIOS settings in your computer to enable this feature.


    If you''ve determined that this installation method is most applicable to your
    situation, please skip to Section 2.6 on page 18.


    # Installing From an FTP Server


    If you don''t have a Red Hat Linux CD-ROM or a CD-ROM drive, but you do have network
    access, then an FTP installation may be for you. When installing via FTP; the
    Red Hat Linux packages select are downloaded (using FTP) across the network to
    your computer, and are installed on your hard drive.


    # How To Do It


    When doing an FTP install, you''ll need LAN-based access to a network; a dial
    connection if your Local Area Network has Internet access, you can use any of
    the many FTP sites that mirror Red Hat Mirrors. You can find a list of mirrors
    at http://www.redhat.com/mirrors.html.


    If your LAN doesn''t have Internet access, all is not lost. If there is a computer
    on your LAN that can accept anonymous FTP requests, put a copy of the Red Hat
    Linux distribution on that, and you''re ready to dial.


    **Please Note:** Your FTP server must be able to handle filenames.


    For an FTP installation, you must use the network installation boot diskette specific
    to, and a PCM-CIA support diskette if using a PCMCIA device during the installation.
    You will need to have a valid nameserver configured or you must specify the IP
    address of the FTP server you will be using. You will also need the path to the
    Red Hat Linux directory on the FTP server.'
