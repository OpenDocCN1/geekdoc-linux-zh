    # 11.3.3 User Private Groups


    Red Linux uses a private group (UPG) scheme, which makes UNIX groups much easier
    to use. The UPG scheme does not add or change anything in the standard UNIX way
    of handling groups. It offers a new convention for handling groups. Whenever you
    create a new user, he or she has a unique group. The scheme works as follows:


    User Private Group Each user has its own private group, of which only it is a
    member.

    umask = 002 The traditional UNIX umask is 022, which prevents other users and
    other members of a user''s group from modifying a user''s files. Since every user
    has their own private group in the UPG scheme, ''group protection'' is not needed.
    A umask of 002 prevents users from modifying other users'' private files. The
    umask is set in /etc/profile.


    setgid on Directories If you set the setgid bit on a directory (with chmod g+s
    directory), files created in that directory will have their group set to the directory''s
    group.'
