    # Enabling Web-Based Linuxconf Access


    For security reasons, Web-based access to Linuxconf is disabled by default. Before
    attempting to access Linuxconf with a Web browser, you''ll need to enable access.
    Here''s how to do it from the text-mode interface:


    +   1. Start Linuxconf by typing linuxconf at the shell prompt

    2. Open Config -> Networking -> Misc -> Linuxconf network access

    3. In the Linuxconf html access control box, include the hostname of any computers
    that should be allowed to access Linuxconf. This would also include your own system,
    if you wish to use the Web-based interface. Web accesses related to Linuxconf
    may be logged to your system''s htmlaccess.log file by selecting the check box.

    4. Select the Accept button and press Space. Then select the Quit buttons on each
    dialog box to back out of the menu hierarchy. When you come to a dialog labeled
    Status of the system, press Enter to take the default action, which is to apply
    the changes you''ve made.


    At this point, Web-based access has been enabled. To test it out, go to one of
    the systems that access the access control list. Launch your Web browser, and
    enter the following URL:


    ```

    http://<host>:

    ```


    (Replacing <host> with your system''s hostname, of course.) You should see the
    main Linuxconf page. Note that you will need to enter your root password password
    to gain access beyond the first page.


