    # 8.1.3 CD-ROMs, Diskettes, Hard Drives and Filesystems – the Inside Track


    A filesystem is composed of files and directories, all starting from a root directory.
    The root directory may contain any number of files and other directories, with
    each directory in turn following itself. The filesystem often looks like an inverted
    tree with directories as branches and the files as leaves. Filesystems reside
    on mass storage devices such as diskettes, hard drives, and CD-ROMs.


    For example


    Under this arrangement, there are two filesystems – the one on A;: and one on
    C:. In order to specify any on DOS/Windows files, you must explicitly specify
    the device on which the files reside, or it must be the system''s default drive
    (where DOS prompt comes from – the default drive in a system with a single hard
    drive)


    Under Linux


    The process of merging filesystems in this way is known as mounting. When a device
    is mounted, it is then accessible to the system''s users. The ''directory'' under
    which a device''s filesystem becomes accessible is known as the mount point. In
    the previous paragraph, example, /mnt/floppy was the diskette''s mount point.
    Note that there are no restrictions (other than common conventions) as to the
    naming of mount points. We could have just mounted the floppy to /long/path/to/floppy/drive.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_155_0.png)'
