  md: '# Glossary


    373


    **Library** When speaking of computers, refers to a collection of routines that
    perform operations which are commonly required by programs. Libraries may be shared,
    meaning that the library routines reside in a file separate from the programs
    that use. Libraries may also be "statically linked" to a program, meaning that
    copies of the library routines required by that are physically attached to the
    program. Such statically linked binaries do not require the existence of any library
    files in order to execute. Programs linked against libraries will not execute
    unless the required libraries have been installed.


    **LILO** A commonly-used bootstrap loader for Linux systems based on an Intel-compatible
    processor.


    **Linus Torvalds** Created Linux in 1991 while a university student.


    **Linuxconf** A versatile system configuration program written by Jacques Gelinas.
    Linuxconf provides a menu-based approach to system configuration via several different
    user interfaces.


    **Linux** A full-featured, robust, freely-available operating system originally
    developed by Linus Torvalds.


    **Logical Partition** A partition that exists within an extended partition. See
    also "partition" and extended partition."


    **Master Boot Record** The master boot record (MBR) is a section of a disk drive''s
    storage space that is set aside for the purpose of saving information necessary
    to begin the bootstrap process on a personal computer.


    **MBR** See "Master Boot Record."


    **Memory** When referring to computers, memory (in general) is any hardware that
    can store data for retrieval. In this context, memory usually specifically refers
    to RAM.


    **MIL** A commonly-used bootstrap loader for Linux systems based on the Alpha
    processor.


    **Module** In Linux, a module is a collection of routines that perform a system-level
    function, and may be dy-namically loaded and unloaded from the running kernel
    as required. Often containing device drivers, modules are tightly bound to the
    version of the kernel; most modules built from one version of a kernel will not
    load properly on a system running another kernel.


    **Mount Point** The directory under which a filesystem is accessible after being
    mounted.


    **Mount** The act of making a filesystem accessible to a system''s users.'
