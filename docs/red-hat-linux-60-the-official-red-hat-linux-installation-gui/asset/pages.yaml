  md: '# Adding a Partition


    To Add a Partition, select the Add button, and press Space or Enter. A dialog
    box entitled "Edit New Partition" will appear (see Figure 4.6). It contains the
    following fields:


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_67_0.png)


    Figure 4.6: Creating a New Partition


    +   **Partition Point -** Highlight this field and enter the partition point.
    For example, if this partition will be the root partition, enter usr for the usr
    partition, and so on.


    +   **Size (Megs) -** In this field, enter the size (in megabytes) of the partition.
    Note that this field starts with a "1" in it, meaning unless you change it, you
    will end up with 1 MB partition. Delete it using the Backspace key, and enter
    the desired partition size.


    +   **Growable? -** This box indicates whether the size you entered in the previous
    field is to be considered the partition''s exact size, or its minimum size. Press
    Space to check and uncheck the box. When checked, the partition will grow to fill
    all available space on the hard disk. In this case, the partition''s size will
    expand and contract as other partitions are modified. Note that you can make more
    than one partition grow; if you do, the additional free space will be shared between
    all growable partitions.


    +   **Type -** This field contains a list of different partition types. Select
    the appropriate type by using [ ] keys.


    +   **Allowable Drives -** This field contains a list of the hard disks installed
    on your system, with a check box for each. If a hard disk''s box is checked, then
    this partition may be created on that hard disk. If the box is not checked, then
    the partition will never be created on that hard disk. By using different check
    box settings, you can direct Disk Druid to place partitions as you fit, or let
    Disk Druid decide where partitions should go.'
