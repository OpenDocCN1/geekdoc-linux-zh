    If you selected Disk Druid, you will be presented with a screen that looks like
    figure 5.12 on the next page. While it may look overwhelming at first, really
    isn''t. Let''s go over each Disk Druid''s three sections.


    # The "Current Disk Partitions" Section


    Each line in the "Current Disk Partitions" section represents a disk partition.
    You''ll note that this section has a scroll bar to the right, which means that
    there may be more partitions than be displayed at one time. If you use the [ ]
    keys, you can see if there are any additional partitions there. Each line in this
    section has five different fields:


    +   - Mount Point – This field indicates where the partition will be mounted when
    Red Hat Linux is installed and running.


    +   - Device – This field displays the partition''s device name.'
