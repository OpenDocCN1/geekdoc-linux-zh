  md: '# 6.3 Configuring the Time Zone


    # 6.3 Configuring the Time Zone


    Next, the installation program presents a dialog to help you configure your system''s
    time zone (see Figure 6.5).


    If you wish to set the hardware (CMOS) clock to GMT (Greenwich Mean Time, also
    known as UTC, or Coordinated Universal), select Hardware clock set to GMT. Setting
    it to GMT means your system will properly handle daylight-saving time, if your
    time zone uses it. Most networks use GMT.


    **Note:** If your computer runs another operating system from time to time, setting
    the clock by GMT may cause the other operating system to display the incorrect
    time. Keep in mind that if more than one operating system is allowed to automatically
    change the time to compensate for daylight-saving time, it is likely to be improperly
    set.


