    # F.6 Choosing an Installation Method


    Once your SPARC systems has booted, and the installation program is running, you''ll
    be asked to choose an installation method (unless you''ve booted directly from
    CD-ROM, in which case a CD ROM installation method is assumed). Red Hat Linux/SPARC
    can be installed by any of the following methods:


    +   * Installing packages from CD-ROM.

    * Installing packages from an FTP site.

    * Installing packages from an NFS server.

    * Installing packages from a locally-attached hard disk.

    * Installing packages from an HTTP site.


    # F.6.1 CD-ROM Installation


    This is the most straightforward method. It requires a Red Hat Linux/SPARC CD-ROM,
    and a Sun-supported CD-ROM connected to your SPARC system.


    # F.6.2 FTP Installation


    This installation method requires a local area network connection and access to
    an FTP site with the Red Hat Linux/SPARC CD-ROM (or equivalent files).


    # F.6.3 NFS Installation


    Installing via NFS requires a local area network connection and access to an NFS
    server that can export the contents of the Red Hat Linux/SPARC CD-ROM (or equivalent
    files).'
  merge: -1
