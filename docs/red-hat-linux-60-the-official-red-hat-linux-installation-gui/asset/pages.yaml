- img_proc: true
  md: '# C.1 Hard Disk Basic Concepts


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_260_0.png)


    partitions and still have disk space left over. There needed to be some way of
    creating more partitions.


    Enter the extended partition. As you may have noticed in Figure C.6 on the facing
    page, there is an “Extended” partition type; it is this partition type that is
    at the heart of extended partitions. Here’s how it works.


    When a partition is created and its type is set to “Extended,” an extended partition
    table is created. In essence, the extended partition is like a disk drive in its
    own right – it has a partition table that points to one or more partitions (now
    called logical partitions, as opposed to the four primary partitions) contained
    entirely within the extended partition table. Figure C.8 on the next page shows
    a disk drive with one primary partition, and one extended partition containing
    two logical partitions (along with some partitions free space).


    As this figure implies, there is a difference between primary and logical partitions
    – there can only be four primary partitions, but there is no fixed limit to the
    number of logical partitions that can exist. (However, in reality it is probably
    not a good idea to try to define and use more than 12 logical partitions on a
    single disk drive.)'
