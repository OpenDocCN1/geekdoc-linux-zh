  md: '# An Introduction to Disk Partitions


    Of course, writing a filesystem to disk is only the beginning. The goal of this
    process is to actually

    store and retrieve data. Let''s take a look at our drive after some files have
    been written to it.


    ![](img/6f1d66e9f0dd8a64781e93022eb9e8cc_257_0.png)


    Figure C.4: Disk Drive with Data Written to It


    As Figure C.4 shows, 14 of the previously-empty inodes are now holding data. We
    cannot determine

    how many files reside on this drive; it may be as few as one or as many as 14,
    as all files use least

    one inode. Another important point to note is that the used inodes do not have
    to form a contiguous

    region; used and unused inodes may be interspersed. This is known as *fragmentation*.
    Fragmentation

    can play a part when attempting to resize an existing partition.


    With most computer-related technologies, disk drives continued to change over
    time. In particular,

    el they changed in one specific way – they got bigger. Not bigger in size, but
    bigger in capacity.

    And it was this additional capacity that drove a change in the way disk drives
    were used.


    # C.1.2 Partitions – Turning One Into Many


    As disk drive capacities soared, some people started wondering if having all that
    space in one

    chunk wasn''t such a great idea. This line of thinking was driven by several issues,
    some philos-

    ical, technical. On the philosophical side, above a certain size, it just seemed
