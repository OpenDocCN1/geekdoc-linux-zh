    \n+   - A Linux System (with the CD-ROM mounted)\n  - system root directory\n\
    \  - /foo — CD-ROM root directory\n  - /foo/images — a directory of images on\
    \ the CD-ROM\n  - /foo/images/old — a directory of old images\n\nTo mount a filesystem\
    \ make sure to be logged in as root, or become root using the su command. For\
