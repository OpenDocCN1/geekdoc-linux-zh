  md: '# 2.1 Getting Documentation


    Red Hat Linux is a powerful, full-featured operating system. Unless you''re a
    Linux wizard, you''re going to need additional documentation to make the most
    of your Red Hat Linux system. We strongly suggest reading over the Official Red
    Hat Linux Getting Guide to see what it can offer you in both of use and support.
    It has been written guide for you using Red Hat Linux once the installation has
    been completed.


    Everyone should review the Official Red Hat Linux Getting Guide for more information
    on available Linux documentation, as well as using the Red Hat Linux 6.0 to its
    full potential. While many people will find the resources described in the Getting
    Started Guide to be very helpful, people who are just starting to use Linux will
    likely need additional information. The information that will be most helpful
    to you depends on your level of Linux expertise:


    +   **New Linux** - If this is your first time using Linux (or any Linux-like
    operating system, for that), you''ll need solid introductory information on basic
    UNIX concepts. For example, O''Reilly and Associates (https://www.ora.com/) produce
    a wide variety of Linux and UNIX-related books. Give their more general titles
    a try.


    +   **Some Linux Experience** - If you''ve used other Linux distributions (or
    a Linux-like operating system), you''ll probably find that what you''re looking
    for is in some of the more in-depth reference material. For example O''Reilly''s
    more specialized titles are valuable when you need a lot of information on a particular
    subject.


    +   **Old Timer** - If you''re a long-time Red Hat Linux user, you probably don''t
    need us telling you what to do. Thanks for reading this far!


