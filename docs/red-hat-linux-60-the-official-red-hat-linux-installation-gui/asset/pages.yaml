  md: '# An Overview of fdisk


    fdisk includes online help which is terse but useful. Here are a few tips:


    +   - The command for help is m.

    - To list the current partition, use the p command (see Figure 4.10).

    - To add a new partition, use n.


    +   - Linux disk creates partitions of type Linux native by default. When you
    create a swap partition, don''t forget to change it to type Linux swap using the
    t command. The value for the Linux swap type is 82. For other partition types,
    use the 1 command to create a list of partitions and values.

    - Linux allows up to (4) partitions on one disk. If you wish to create more than
    one (and only one) of the four may be an extended partition, which acts as a container
    for one or more logical partitions. Since it acts as a container, the extended
    partition must be at least as large as the total size of all the partitions it
    contains.


    It''s a good idea to write down which partitions (e.g., /dev/hda2) are meant for
    which filesystems (e.g., /user) as you create each one.


    Please Note: None of the changes you make will take effect until you save and
