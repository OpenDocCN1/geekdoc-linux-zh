    you want to configure from the box that appears (see Figure 8.43 on the following
    page).


    **Please Note:** There is now a **clone** button available in netcfg. This button
    can be used to create a "clone" of an already-existing interface. By using clone,
    it is possible for a laptop to have one Ethernet interface defined for a work
    LAN, and a clone Ethernet device defined for a home LAN.


    PPP Interface — Adding a PPP interface can be as simple as supplying the phone
    number, login name and password in the **Create PPP Interface** dialog shown in
    Figure 8.44 on the next page. If you need to use PPP authentication for your PPP
    connection, choose **PAP authentication**. In many cases some degree of customization
    will be needed. Choosing the **Customize** button will allow you to make changes
    to the hardware, communication, and networking settings for the PPP interface.'
