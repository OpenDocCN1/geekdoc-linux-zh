  md: '# RESPONDING TO A MESSAGE 411


    But, a tip on newsgroup etiquette: No matter how right you think you are and how
    goofy you think the others in the thread to which you are responding, maintain
    civility.

    Often in electronic communications, we use the


    anonymity of messages to say things we would never say to someone''s face.

    Manners do not disappear because you''ve been involved in a conversation.

    Endeavor to treat others on newsgroups as you would want to be treated.


