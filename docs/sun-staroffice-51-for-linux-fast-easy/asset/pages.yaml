  md: '# 14

    Working with Functions and Formulas


    Putting all of these numbers and values into the spreadsheet does little good
    if they''re just sitting there. The power of a spreadsheet application such as
    StarCalc is how it can work with those numbers to discover new values. In this
    chapter, you''ll learn how to:


    +   - Write formulas, both simple and complex

    - Use cell references within a formula

    - Copy and move formulas

    - Build functions using StarCalc''s function tools'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Creating Formulas


    A formula compares two or more values in a certain way and then uses the comparison
    as a new value. In other words, the value of 1 is compared to another value of
    1 in such a way that they are combined. Together, their new value is 2. Formulas
    compare values using operators and functions. Operators are the action symbols
    you already know, such as + and --. Functions are less common, but more powerful,
    and will be examined later in this chapter.


    # Creating a Simple Formula


    A simple formula uses one kind of operator at a time. Values in the formula can
    be numeric data or references. Table 14.1 shows the operators StarCalc uses and
    how they differ from everyday use.


    | Table 14.1

    | Traditional versus StarCalc Operators |

    | Formula | StarCalc Formula |

    | --- | --- |

    | 2+2 = 4 | 2+2 = 4 |

    | 2-2 = 0 | 2-2 = 0 |

    | 2×2 = 4 | 2*2 = 4 |

    | 4+2 = 2 | 4/2 = 2 |

    | 2² = 4 | 2^2 = 4 |'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# CREATING FORMULAS 191


    1. Click on a cell. The cell will be highlighted.


    2. Click the mouse pointer in the input line. The text cursor will appear at the
    insertion point.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_214_0.png)


    3. Type =2+2 in the input line.


    4. Click on Accept. The value will be entered.


    # Creating a Complex Formula


    A complex formula contains more than one operator type, such as 3×3 + 4+2. When
    StarCalc makes calculations in complex formulas, it performs multiplication and
    division operators first and then addition and subtraction.


    > TIP

    To keep things less confusing, use parentheses in complex formulas whenever possible.'
  merge: -1
