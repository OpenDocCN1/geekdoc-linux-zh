    will show the download progress.


    # Installing the Software


    After successfully downloading the StarOffice installation file, it''s time to
    start unpacking and installing. We use the'
  merge: -1
  pgno: 481
- img_proc: true
  md: '# INSTALLING THE SOFTWARE 459


    term "unpacking" because as big as the installation file is, the .TAR extension
    on the file name means it has been compressed from a larger file size. You need
    to uncompress the .TAR file, returning it to its actual size. Then you can proceed
    with the installation program.


    ```

    Terminal ~~

    [root@linux ~]# cd /

    [root@linux /]# cd home

    [root@linux /home]# dir

    HOSType for linux_inst rogue so51a_inx_01 tar so51inst

    hffprint http pine-bin-linux z so51a_inx_01 tar so51list

    [root@linux /home]# tar xvf so51a_inx_01 *

    ```


    +   1. **Open a Terminal** window in Linux. The window will appear.


    +   2. **Navigate to the directory** where the downloaded file is located using
    the cd command. The prompts will change to the target directory.


    +   3. **Type tar xvf so51a_inx_01.tar.**


    +   4. **Press Enter.** The compressed file will be unpacked into a new directory,
    so51inst.


    > NOTE

    If you download the file segments, run the tar svf command for each of the seven
    smaller .TAR files. If you save them in the same directory, their contents are
    unpacked into the same destination directories.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_482_0.png)'
  merge: -1
  pgno: 482
