  md: '# CHAPTER 6: LEARNING STARWRITER BASICS


    # Selecting Text


    When dealing with blocks of text, a useful technique is to select the text first.
    Once text is selected, any changes made to the selection will effect all of the
    text within.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_87_0.png)


    +   1. Click the mouse pointer within your document. The cursor will appear where
    you click.


    +   2. Drag the mouse pointer across a line of text. The text will be highlighted
    as you move the mouse.


    +   3. Release the mouse button. The selected text will be highlighted on the
    screen.


    > NOTE

    To remove the selection highlight from the document, simply click the mouse pointer
    anywhere within the document.


