  md: '# Creating Web Documents


    There is more than one way to skin a cat. Why anyone would want to skin a cat
    is a mystery. But it''s catchier than saying that there is more than one way to
    create a Web page in StarWriter.


    The two methods you can use in StarWriter include creating an HTML document from
    scratch and converting an existing document to HTML format.


    # Converting Existing Documents


    Don''t blink, or you might miss this one. It''s that easy!


    +   1. Click on File. The File menu will appear.


    +   2. Click on Save As. The Save As dialog box will open.


