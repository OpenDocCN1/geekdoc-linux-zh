    The context menu will appear.


    +   4. Click on Save As.

    Save As dialog box will open.


    +   5. Navigate to the folder in which you want to save the file.

    The folder''s contents will appear in the Save As dialog box.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_411_1.png)


    +   6. Type a new file name,

    if necessary.


    +   7. Click on Save. The As dialog will close, and the file will be saved.'
