  md: '# 16

    Completing Your Spreadsheet


    Although we are moving closer to pure electronic media, it is still readily apparent
    that people have a great love for paper. It is important to know how to prepare
    and print your StarCalc files into hardcopy. In this chapter, you''ll learn how
