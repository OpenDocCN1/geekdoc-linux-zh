  md: '# Creating Charts Independent of Tables


    If you are writing a slick-looking report, do you really want a table of data
    and a chart in the document at the same time? Probably not—if the chart makes
    the impact you want it to, there should be no need to include the data.


    Thus far, every chart created in this chapter links directly to a table of data.
    That makes sense because all charts must rely on some data. But you can use StarChart
    to create charts from scratch, with no visible attendant of data.


    +   1. **Click and hold the Insert Objects icon** on the main toolbar. The Insert
    Objects floating toolbar will appear.


    +   2. **Click on the Insert Chart icon** on the floating toolbar. The AutoFormat
    Chart dialog box will open.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_278_0.png)'
  merge: -1
  pgno: 278
- img_proc: true
  md: '# 256 CHAPTER 18: LEARNING STARCHARTBASICS


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_279_0.png)


    +   3. Click on the Finish button. The AutoFormat Chart dialog will close and
    a chart template will appear in the document. The chart will be ready to be resized,
    edited, and positioned in the document.


    # Modifying a Chart


    Once you have a chart in your document, you might need to make some changes to
    make it flow in your document better.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_279_1.png)


    # Resizing a Chart


    When StarChart creates a chart within a document, it tends to make it too large.
    Unless you want the chart to dominate your page, you''ll need to resize it.


    +   1. Double-click on the chart. The gray chart border will appear.


    +   2. Click and drag any edge or corner of the gray border. The border will move
    with the mouse pointer.'
