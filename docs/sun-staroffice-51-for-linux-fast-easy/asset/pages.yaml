  md: '# Using Context Menus


    You can modify virtually any area within the StarDesktop screen with context menus.
    This name indicates that the menus alter themselves based on what you are doing
    when you open them. If you start a context menu on a toolbar, you get quite a
    different context menu from what you start one in the document window. Context
    menus give you a faster way to choose commands in StarOffice.


    +   1. Right-click in the document window. The context menu will appear.


    +   2. Click on Character. The Character dialog box will open.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_45_0.png)


    > TIP

    To use a context menu, simply click on the screen anywhere outside the context
    menu.


