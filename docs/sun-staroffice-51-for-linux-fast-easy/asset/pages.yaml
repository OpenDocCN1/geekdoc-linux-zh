  md: '# # 27

    Learning the StarDiscussion Basics


    There are more than 35,000 newsgroups. That''s just the public ones. Some corporations
    provide their own private newsgroups, as well. This huge number of newsgroups
    means you will likely find a discussion on a topic of interest to you.


    To keep the newsgroups on topic, many of them have moderators. Posts to moderated
    newsgroups are monitored by some lucky soul who determines whether the posting
    is relevant to the group. If it is, then she posts it for all to see. If not,
    zap, zap! Many of the larger newsgroups, and all of the groups starting with the
    name alt, do not have moderators. With the larger groups, the size and amount
    of traffic means bound to creep in. In this chapter, you''ll learn how to:


    +   - Use the StarDiscussion interface

    - Write and post a newsgroup message

    - Find and read newsgroup messages

    - Send files with your messages

    - Reply to posted messages'
  merge: -1
  pgno: 420
- img_proc: true
  md: '# Exploring the StarDiscussion Interface


    Looking at the StarDiscussion interface, you will see that it looks rather familiar.
    In fact, it is identical to the StarMail interface. Only the structure of the
    message list is different, and not by much.


    +   - Read message icon. Indicates a read message.

    - Unread message icon. Indicates an unread message.

    - Thread folder. Indicates a group of related messages, based on the subject heading.


    +   - Message pane. Displays the messages within a selected newsgroup.


    +   - Header information pane. Displays detailed information from a selected message''s
    header.


    +   - Header file pane. Displays any files associated with or attached to the
    selected message.


    +   - Message pane. Displays the content of the message.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_421_0.png)


    Thank Jan but my problem is (was) more basic.'
  merge: -1
  pgno: 421
- img_proc: true
  md: '# READING NEWSGROUPS 399


    +   **Newsgroups.** Lists the newsgroups available on your Internet news server
    that you have configured to be listed.


    +   **Direct reply thread.** Indicates a message is a part of a thread that is
    a direct line of replies from the original message.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_422_0.png)


    +   **Number of messages.** Signifies the number of messages within the newsgroup.


    +   **Number of unread messages.** Signifies the number of unread messages within
    the newsgroup.


    # Reading Newsgroups


    If you set up your news server when you installed StarOffice, you will be completely
    ready to read all of the newsgroups.


    Or you? Unlike e-mail, newsgroup messages can be accessed on more than one news
    server. Not all newsgroups reside on every news server. Internet service providers
    might not have room for lot of groups, so the number can be limited. And sometimes,
    you might need to access private newsgroups.


    Once you have connected to a news server, you must look through the list of newsgroups
    to determine which ones you want to browse. Finally, you need to open a newsgroup
    and view the messages posted within.'
  merge: -1
  pgno: 422
