  md: '# Navigating Within a Document


    Moving around from word to word in a document using only the arrow keys can be
    rather tedious and slow. There are better and faster ways to navigate a StarWriter
    document.


    # Using DirectCursor


    DirectCursor allows you to place your mouse pointer anywhere on the screen, regardless
    of whether there is there already. This feature is a great advantage that gives
    you excellent control over the placement of text.


    +   1. Click on the DirectCursor icon in the main toolbar. The DirectCursor mouse
    pointer will appear.


    +   2. Move the DirectCursor mouse pointer to a blank section of your document.
