  md: '# Attaching Files


    One of the great features of e-mail is its ability to send electronic files of
    any shape and most reasonable sizes. These electronic e-mail files are called
    attachments. Sending file attachments has virtually eliminated the old "sneakeraware"
    practice, where files were placed on floppy disks and walked around the office.


    # Opening Received Files


    Receiving files via e-mail has also revitalized another business concept: collaboration.
    Because using attachments facilitates the passing of files back and forth, people
    have more time and inclination to share files and work on them together.


    +   1. Click on a received message that contains a file attachment. The message
    will be selected.

    2. Double-click on the file icon. The file will open in the message pane.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_410_0.png)'
  merge: -1
