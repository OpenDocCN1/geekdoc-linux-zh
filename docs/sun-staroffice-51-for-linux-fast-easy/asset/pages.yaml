  md: '# 23


    # Editing a Presentation


    You can enhance StarImpress presentations in a multitude of ways to go beyond
    the good-looking but basic presentations generated by the AutoPilot.


    A word of caution before beginning the examination of these enhancements: don’t
    get carried away. Keep the look of your slides simple and uncluttered. Don’t go
    crazy with five different kinds of transitions for a six-slide presentation. A
    lot of flashy tricks in your presentation will only serve to distract your audience.
    Simplicity and consistency are the watchwords for a good StarImpress presentation.


    In this chapter, you’ll learn how to:


    +   - Add, delete, and rearrange slides as needed


    +   - Edit text in a StarOffice slide


    +   - Place graphics in your presentation


    +   - Alter presentation and slide designs


    +   - Print a StarImpress presentation'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# Working with Slides


    In Chapter 22, “Learning StarImpress Basics,” you saw how the Slide Sort views
    let you see all of the slides in the presentation at once. This view is an important
    tool for working with slides.


    # Adding Slides


    Nothing in the world is static. Ideas are changed, as are ways of presenting those
    ideas. You can have StarImpress add slides to your presentation.


    +   1. Right-click on the slide tab. Be sure it is the slide after which you want
    the new slide to appear. The context menu will appear.


    +   2. Click on Insert Slide.

    The Insert Slide dialog box will open.


