    what action you want to take for each unrecognized word.


    +   3. Click on Close. The Spelling dialog will close.


    # Working with AutoCorrect


    Ever have a word that you always missspell? AutoCorrect can silently watch out
    for these foibles and correct them as you type.


    # Adding AutoCorrect Entries


    Although StarWriter already defines a lot of AutoCorrect terms, you will have
    your own idiosyncratic spelling problems. Add them to the AutoCorrect listing
    so StarWriter can catch them, too.'
