  md: '# CHAPTER 15: FORMATTING WORKSHEETS


    # Formatting Numbers


    Numeric data is expressed in many different forms: dates, times, and currency,
    just to name a few. You can change the format of your data in just a few steps
    in StarCalc.


    # Changing the Decimal Point Places


    When dealing with numeric data, you must be sure that you use the proper number
    of decimal places. After all, in the United States, a soda pop might cost $45,
    not $.4468.


    +   1. Click on a cell with a numeric value. The cell will be highlighted.


    +   2. Click on the Number Format: Add Decimal icon. A single decimal place will
    be added to the number in the cell.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_225_0.png)'
