  md: '# Glossary


    A

    Absolute reference. A reference to a cell that does not change when copying or
    moving the referencing cell.


    AutoText. A feature of StarWriter that enables the user to save a word or phrase,
    which is inserted into the document after a shortcut phrase is typed and the F3
    key is pressed.


    Active cell. The selected cell in a worksheet.


    B

    Bar chart. A type of chart that uses bars to represent values. Normally used to
    compare items.


    Address. An entry that appears in the Address Book.


    Bookmark. Used to mark a place in a Help file.


    Address Book. A sample StarBase database that also doubles as a useful personal
    information manager.


    Border. A line surrounding paragraphs, pages, tables cells, or objects.


    Alignment. The position of text in a document.


    Browser. A feature of the StarDesktop that allows users to view Web pages on the
    Internet.


    Application Starter. A KDE Windows tool that enables users to start applications
    and open files.


    Attributes. The appearance of text such as bold, underlined, italic, or point
    size.


    C

    Cell. The area defined by a rectangle at which a row and column intersect in a
    StarCalc worksheet.


    AutoCorrect. A feature of StarOffice that automatically corrects spelling mistakes.


    Chart. A graphic representation of numerical data.


    AutoFill. A function that StarCalc to automatically complete series of numbers
    or words while filling cell data.


    Click. Using the mouse to pick a menu item or object in a dialog box.


    AutoFormat. AutoFormat enables the user to apply defined formatting to cells.


    Click and drag. A method of moving text or objects on an object with a mouse,
    dragging it to a new location, and releasing the mouse button to drop it into
    its new location.


    AutoPilot. A feature that walks you through a procedure step-by-step and processes
    something, such as a table, letter, or data-base, based on settings in AutoPilot
    dialog boxes.


    Clipboard. An area of computer memory you can temporarily store text or graphics.'
  merge: -1
  pgno: 497
- img_proc: true
  md: '# GLOSSARY 475


    Close button. Used to shut down or exit a dialog box, window, or application.


    Column. A set of cells running vertically down a worksheet. Also, vertical divisions
    of text on a page.


    Complex formula. A formula in a StarCalc spreadsheet or StarMath formula that
    has multiple operators.


    Coordinates. An alphanumeric reference to a cell.


    Copy. To take a selection from the document and duplicate it on the Clipboard.


    Cut. To take a selection from the document and move it to the Clipboard.


    # F


    Field. A piece of information used in a database. In a form level, a field is
    a placeholder for corresponding data.


    File. Information stored on a disk under a single name.


    Filter. Settings to ensure that only cells meeting certain criteria are displayed
    in the worksheet.


    Find. A feature used to locate characters in a StarOffice document.


    Font. A design of letters, symbols, and numbers, also called a typeface.


    Footer. Text that repeats at the bottom of each page of a document or spreadsheet.


    Footnote. Reference information that prints at the bottom of the page.


    Form. A database window with spaces reserved for fields to enter data.


    Format. To change the appearance of text or objects with features such as the
    font, style, color, borders, and size.


    Form Design View. The view in a database that lets you modify the structure of
    the database.


    Formula. An equation that instructs StarCalc to perform calculations based on
    numerical data in designated fields.


    Formula bar. The location where all data and formulas are entered for a selected
    cell.


    Function. A series of predefined formulas used in spreadsheets and StarMath functions
    perform specialized calculations automatically.


    # D


    Data. Information that can be numerical or textual.


    Data area. The portion of a worksheet that is designated to print.


    Database. A file composed of records, containing fields, together with a set of
    operations for searching or sorting.


    Data type. The category of numerical or textual data.


    Default. A setting or action predetermined by the program unless changed by the
    user.


    Dialog box. A box that displays warnings, messages or requests information from
    the user.


    Document. Any file created in StarOffice.


    # E


    E-mail. Messages sent electronically across a network, typically the Internet.


    Endnote. Reference information that prints on the last page of a document.


    Event. An entry in the StarSchedule calendar that spans less than one day to which
    no other individuals are invited.


    # G


    Graph. A visual representation of numerical data. Also called a chart.


    Gridlines. The lines dividing rows and columns in a table or worksheet.'
  merge: -1
  pgno: 498
- img_proc: true
  md: '# 476 GLOSSARY


    # H


    **Handles.** Small squares that appear when an object is selected and enable its
    resizing or movement.


    **Legend.** In a chart, a box containing text that explains symbols and each data
    series represents. Each symbol is a color pattern or marker that corresponds to
    one data series in the chart.


    **Header.** Text entered in an area of the document for display at the top of
    each page of the document.


    **Line spacing.** The amount of space between lines of text.


    **Help Agent.** A help feature for StarOffice that allows the user to get help
    on the specific task they are trying to perform.


    **Line style.** Effects using width, arrows, and dashes that can be applied to
    a line.


    **HTML.** The language used to create documents for publication on the Web.


    **Linux.** A Unix operating system that allows users extensive control over all
    aspects of their work. Although it''s a command-line only operating system, several
    graphical interfaces can be used "over" the Linux operating system to make it
    more user friendly.


    **Hyperlink.** A created element that consists of an address to a location, such
    as a folder or a Web page.


    # I


    # M


    **Icon.** A graphic representation used on toolbars to represent a function performed
    when the icon is clicked with a mouse.


    **Mail merge.** A procedure that uses a form document, inserts placeholders for
    types of data, and merges document with specific data to produce personalized
    letters, faxes, or e-mail messages.


    **Indent.** To place text away from a margin by a specific distance.


    **Mathematical functions.** Functions that produce mathematical results, such
    as SUM and PRODUCT.


    # J


    **Meeting.** An entry in the StarSchedule calendar that lasts less than one day
    to which others are invited.


    **Justify.** A type of alignment that spreads letters on a line or in a cell between
    the left and right margin or across selected cells.


    **Menu accelerators.** Key combinations used with the Alt key to activate menu
    commands in StarOffice. The keys are specified by underlined lines in menu commands.


    # K


    # N


    **KDE.** A graphical interface designed to be used in Linux systems.


    **Key combinations.** A saved set of keystrokes that you can use to perform an
    action in lieu of a lengthier menu commands.


    # L


    **Notes.** Additional text displayed alongside a StarImpress slide to prompt the
    presenter.


    # O


    **Landscape.** A page orientation that prints a document with the long edge of
    the paper across the top.


    **Object.** A picture, chart, or other graphic element that you can place in a
    StarOffice document.'
  merge: -1
  pgno: 499
- img_proc: true
  md: '# GLOSSARY 477


    Open. To start an application, to insert a document into a new document window,
    or to access a dialog box.


    R

    Range. A collection of cells, ranging from the first named cell to the last.


    Operator. The parts of a formula that indicate an action to be performed, such
    as addition (+) or division (/).


    Redo. A feature that allows the restoration of an action that was reversed using
    the Undo feature.


    Orientation. The way a document prints on a piece of paper; landscape prints with
    the longer side of a page, whereas portrait prints with the shorter edge at top.


    Reference. In a formula, a name or range that refers to the formula to a cell
    or cells.


    Relative reference. A reference to a cell relative to the location of the cell
    where the formula is located.


    Outline. A hierarchy of text that manages major and minor ideas. Used extensively
    in StarImpress.


    Replace. A StarOffice function that locates text and replaces it with different
    text.


    Row. A set of cells running from left to right across a worksheet.


    P

    Page break. A command that tells the application where to begin a new page.


    S

    Save. To take a document residing in the memory of the computer and create a file
    to be stored on disk.


    Page setup. Settings that determine how the pages of the document are set up,
    including margins, orientation, and the size of paper on each page will print.


    Scroll bars. The bars on the right and bottom of the window that allow vertical
    and horizontal movements through a document.


    Page View. A feature that lets you view a document on the screen as it will appear
    when printed.


    Sheet. One of several pages in a StarCalc workbook.


    Paste. To place text or an object placed on the Clipboard (through cutting or
    copying) into a StarOffice document.


    Simple formula. A formula in a StarCalc spreadsheet or Math formula that has only
    one operator.


    Placeholder. A set of text that is used for visual reference within a StarOffice
    template document.


    Slide. An element in a StarImpress presentation equivalent to a page.


    Slide Sort. A view in StarImpress that lets you view all slides together in one
    screen.


    Portrait. A page orientation where a document prints with the shorter edge of
    the paper along the top.


    Sort. To arrange data alphabetically in ascending (A-Z) and descending (Z-A) order.


    Properties. The characteristics of text, objects, or devices. Text properties
    might include font, size, or color.


    Spell tool. A feature that checks the spelling in a document against a dictionary
    and flags possible errors for correction.


    Q

    Queries. Used in a StarBase, a database of data that meets certain criteria.


    StarDesktop. The main area of StarOffice where files and programs are opened and
    managed. All StarOffice documents are opened within the StarDesktop.'
  merge: -1
  pgno: 500
- img_proc: true
  md: '# GLOSSARY


    **Start button.** A button in the StarOffice taskbar like, the KDE Application
    Starter, lets users access applications and files on Linux systems.


    **Tips.** A help feature that displays the name of a tool in a small box when
    the pointer is over the tool.


    **Status bar.** An area at the bottom of the StarDesktop that shows information
    about the document.


    **Toolbars.** Appears in the document window to access many of the commonly used
    features of the StarOffice applications.


    **Transitions.** In StarOffice, elements added to a slide that determine the appearance
    of switching from slide to slide.


    # T


    **Tab.** A setting that you can place along the width of a line of text that enables
    the pointer to quickly jump to that setting.


    **Table.** A collection of columns and rows, forming cells at their intersection,
    to organize sets of data.


    **Table View.** A view in a database where many records display in a table format.


    An open StarOffice document.


    **Task.** A StarOffice device that contains the active task buttons.


    **Task buttons.** StarOffice devices that control opening and closing of each
    open task, as well as other viewing properties.


    **Template.** A collection of formatting settings to create a new document type.


    **Text box.** A floating object containing text that you can create with the drawing
    feature of StarOffice programs to place text anywhere in a document.


    # U


    **Undo.** A feature that allows the reversal of the last action. The user can
    undo actions by repeatedly using this feature to 100 times in StarOffice.


    # W


    **Web page.** A document that appears on the World Wide Web. Also called a Web
    document.


    **Workbook.** A single StarCalc file containing a collection of sheets.


    **World Wide Web.** A series of HTML documents viewed on the Internet.


    # Z


    **Zoom.** To enlarge or reduce the text displays onscreen. It does not affect
    how the document will print.'
