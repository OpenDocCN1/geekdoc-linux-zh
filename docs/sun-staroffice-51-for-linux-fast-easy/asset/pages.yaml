  md: '# Welcome to StarOffice


    StarOffice 5.1 offers Linux users a complete office suite solution—free of charge.
    With this application, you have a word processor, spreadsheet and presentation
    creator, Internet browser, e-mail and newsgroup reader all rolled into one package.
    Before you can begin using all this cool stuff, you need to learn some of the
    basics about the StarOffice interface. In this chapter, you''ll learn how to:


    +   * Start and exit StarOffice

    * Start a Linux application from within StarOffice

    * Recognize the screen elements of the StarDesktop'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Starting StarOffice


    Unlike other office suites, which usually consist of separate programs that work
    together, StarOffice is actually one program. This makes it easier to manage as
    well as start. In this example, you''ll use the KDE interface in Caldera OpenLinux
    2.2. The screen might look different on your Linux machine, but the basic principles
    still apply.


    +   1. **Click** on the **Application Starter**. The main menu will appear.


    +   2. **Move the mouse pointer** to Personal. The Personal menu will appear.


    +   3. **Click** on **StarOffice**. StarOffice will start.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_27_0.png)


    # Exploring the StarDesktop


    Because StarOffice is a single application, you do not use separate buttons or
    icons to start the word processor or the spreadsheet program. Instead, the StarDesktop
    alters itself to accommodate the type of file you want to create. Want to make
    a slide presentation? Open a new or existing'
  merge: -1
  pgno: 27
- img_proc: true
