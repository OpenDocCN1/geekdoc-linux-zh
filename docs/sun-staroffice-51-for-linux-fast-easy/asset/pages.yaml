  md: '# 386 CHAPTER 26: LEARNING THE STARMAIL BASICS


    # Reading Your Messages


    Once your Inbox is updated, you can start to read your new mail. Best of all—no
    bills!


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_409_0.png)


    +   1. Click on a message in the message list pane. The message will be highlighted
    and its contents will appear in the message pane.


    > If the message content is not stored locally, there will be a slight pause while
    the content downloads from the server.


    +   2. Click on the Next Unread Message icon. The next unread message will appear.


    +   3. Repeat Steps 1 and 2 until you have read all of the new messages. All of
    the messages in the Inbox will be marked as read.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_409_1.png)'
