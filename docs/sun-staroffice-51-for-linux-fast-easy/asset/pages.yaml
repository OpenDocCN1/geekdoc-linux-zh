  md: '# ADDING TRANSITIONS


    # Adding Transitions


    When you move from one slide to another in a presentation, the screen often shows
    more than an instant switch. These effects are called transitions, and they are
    easy to add to any slide.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_372_0.png)


    +   1. Click on the Slide Sort View button. The Slide Sort View will appear.


    +   2. Press and hold the Shift key.


    +   3. Click on all slides. The slides will be highlighted.


    +   4. Release the Shift key.


    +   5. Click on the down arrow next to the Effect field. The Effect list will
    appear.


    +   6. Click on the Fade to Center option. The option will be selected and will
    appear in the Effect field.


    +   7. Click on the down arrow next to the Transition Speed field. The Transition
    Speed list will appear.


