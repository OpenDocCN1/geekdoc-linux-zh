    \ Chapter 12\n- Interested in making a variety of charts using StarChart?\nLearn\
    \ how in Chapter 18\n- Wondering how to add special effects to your presentations?\n\
    Go to Chapter 23\n- Want help scheduling your appointments with StarSchedule?\n\
    \ Chapter 28\n\nRelax. Learning StarOffice 5.1 is now a breeze. You are holding\
    \ a book dedicated to one simple idea: To help you get to work as quickly and\
    \ easily as possible. Now you don't have to wade through endless pages of boring\
    \ text. With PRIMA Tech's bestselling fast & easy series, you can simply look\
    \ and learn.\n\n![](img/ebf658698a8f8f48ccc4405fe7df0231_515_0.png)\n\nStarOffice\
    \ 5.1 is easy to learn with point-and-click instructions.\n\nIncludes\nComprehensive\n\
    Glossary\n\nBeginner\nIntermediate\nAdvanced Expert\nPRIMA TECH\nA Division of\
    \ Prima Publishing\nwww.prima-tech.com\nCover Design: Prima Design Team\nCategory:\
    \ Integrated Software\nU.S. $19.99 Can. $27.95 U.K. £18.49\nOnly $19.99!\n\n>\
