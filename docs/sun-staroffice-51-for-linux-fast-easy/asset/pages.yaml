  md: '# 6

    Learning StarWriter Basics


    The word processor component of StarOffice is called, appropriately enough, StarWriter.
    StarWriter’s main job is to get your words down on paper, be it real or electronic.
    In this chapter, you’ll learn how to:


    +   - Create text in your document

    - Edit a document by inserting, selecting, and deleting text

    - Correct mistakes using the Undo and Redo functions

    - Navigate within your document'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# Typing Text


    We have come a long way since the days of the Gutenberg press, in which small
    pieces of movable type were painstakingly arranged to create a single page of
    a book. Now, creating letters, reports, and even books is as easy as twiddling
    your fingers.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_85_0.png)


    +   1. Type some text. The text will appear onscreen.

    2. Press the Enter key. A new line will be started.

    3. Type a paragraph. Press the Enter key only at the end of the paragraph. The
    text will wrap automatically.


    # Editing Text


    It is not often that you can enter all of your text exactly right the first time.
    As you create documents, you will often think of a better way to say something
    after you''ve typed it. This is when it''s useful to know how to edit text in
    StarWriter.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Inserting Text


    Inserting text within a StarWriter document is simple. You can even type text
    over existing text, as you will learn in this section.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_86_0.png)


    +   - **Click the mouse pointer** within your document. The cursor will appear
    where you click.

    - **Type some text.** The text will appear onscreen, pushing existing text aside.

    - **Click on the INSRT field** in the status bar. The status will change to OVER.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_86_1.png)


    +   - **Type some text.** The text will appear onscreen, overwriting existing
    text.

    - **Click on the OVER field** in the status bar. The status will return to INSRT.'
  merge: -1
  pgno: 86
