    # Sending Your Message


    Clicking on the Send Mail icon is not enough to get your messages to their recipients.
    Messages sit in the Outbox until they are sent to your mail server, which typically
    happens after connecting to the Internet.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_407_1.png)


    +   1. After connecting to the Internet, right-click on the Outbox folder. The
    context menu will appear.


    +   2. Click on Update. StarMail will update the contents of the Outbox by sending
    all unsent messages to your configured e-mail server.'
