    open.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_341_1.png)


    +   4. Click on the From template option. The template options will appear.

    5. Click on the Preview check box. The Preview window will activate.

    6. Select the Strategy Recommendation option. The option will be selected.

    7. Click on the Next button. The second dialog box of the AutoPilot Presentation
    will open.'
