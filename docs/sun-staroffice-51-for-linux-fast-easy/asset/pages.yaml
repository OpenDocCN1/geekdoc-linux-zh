  md: '# Exploring the StarMath Screen


    Before examining how to build formulas, take a look at the StarMath interface:


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_285_0.png)


    +   - **Zoom In.** Expands the formula displayed on the screen.

    - **Zoom Out.** Reduces the formula displayed on the screen.

    - **Zoom 100%.** Displays the formula at full size.

    - **Entire Formula.** Displays the entire formula.

    - **Refresh.** Refreshes the displayed formula to reflect changes in the Commands
    window.


    +   - **Formula cursor.** Enables direct editing of a formula in the main StarMath
    window. If it is not enabled, you can only enter formulas in the Commands window.

    - **Symbols.** Opens the Symbols dialog box, where you can select from two symbol
    categories: Greek and Special.'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# CREATING A SIMPLE FORMULA


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_286_0.png)


    +   - Selection window. Allows to access all of the available operators in StarMath.


    +   - Operator categories. Reveal the operators within that category.


    +   - Operators. The operators to insert in a StarMath formula.


    +   - Commands window. Allows you to enter all formulas in the special syntax
    StarMath uses to build formulas.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_286_1.png)


    # Creating a Simple Formula


    As daunting as math can be, you might occasionally need to insert a math formula
    into your documents.


    +   1. Click and hold the Insert Objects icon on the main toolbar. The Insert
    Objects floating toolbar will appear.


    +   2. Click on the Insert Formula icon. The StarMath interface will appear around
    the document.'
