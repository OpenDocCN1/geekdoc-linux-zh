- img_proc: true
  md: '# Preparing to Print


    StarWriter, it is not too difficult to see how pages are set up. In a StarCalc
    spreadsheet, however, such settings as margins and page breaks are not always
    apparent.


    # Setting Up Margins


    The margins of a spreadsheet page are typically hard to see. In fact, they only
    appear after you examine the document in Page View (discussed later in this chapter)
    or you initially change the page margins. This is a strange feature, to be sure,
    which emphasizes the need to always preview your document before printing.


    +   1. **Click on Format.** The Format menu will appear.


    +   2. **Click on Page.** The Page Style dialog box will be open.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_238_0.png)'
  merge: -1
  pgno: 238
