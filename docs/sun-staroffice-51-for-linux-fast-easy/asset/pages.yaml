    store your files any way you want on your Linux PC, and the Explorer provides
    a way to organize your files in the manner that''s easiest for you to use.


    # Opening a File in Explorer


    The Explorer window''s main function is to get you to the files you need to start
    working as fast as possible.


    +   1. Click on the Explorer On/Off icon. The Explorer control bar will appear.


    +   2. Click on the Show button in the Explorer control bar. The Explorer window
    will appear.


