  md: '# Making a Line Graph


    Charts and graphs, although treated similarly in StarChart, are not really the
    same thing. Charts tend to be comparative in nature, illustrating how one value
    compares to another. Graphs tend to reflect changes in value over a given length
    of time, or how values change when certain conditions are met.


    The graphs most familiar to us are line graphs. These graphs show us the hills
    and valleys of data.


    +   1. **Select the cell range** to graph. The cell range will be highlighted.


    +   2. **Click on Insert.** The Insert menu will appear.


    +   3. **Click on Chart.** The first AutoFormat Chart dialog box will open.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_271_0.png)'
