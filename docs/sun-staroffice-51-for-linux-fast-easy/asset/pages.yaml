  md: '# Exploring the Navigator


    You use the Navigator window to locate special Objects within a document. Objects
    appear within any StarOffice document. They include tables and graphics in StarWriter
    documents, slides in Starlimp presentations, and data areas in StarCalc spreadsheets,
    just to name a few. Being able to navigate to these objects is a great time saver.


    # Browsing Objects


    Browsing objects works on the same principle as your computer''s Page Up and Page
    Down keys, except that you can hop from table to table, picture to picture, or
    even page to page. All you need to do is set what objects you want to browse.
    In this example, you''ll look out using the Navigator in a StarWriter document.


    +   1. Click on the Navigator On/Off icon. The Navigator window will appear.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_38_0.png)'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 16 CHAPTER 2: USING THE STARDESKTOP


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_39_0.png)


    2. Click and hold the Navigation icon in the Navigator window. The Navigation
    floating toolbar will appear.


    3. Move the mouse pointer to the Table icon. The Table icon will be selected.


    4. Release the mouse button. The Previous and Next buttons will be set to navigate
    to the Previous Table and Next Table.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_39_1.png)


    5. Click on the Previous Table icon. The cursor will move backward to the previous
    table in the document.


    6. Click on the Next Table icon. The cursor will move forward to the next table
    in the document.'
  merge: -1
  pgno: 39
- img_proc: true
  md: '# EXPLORING THE NAVIGATOR


    # Copying Items to Other Documents


    You can do more than just look at objects with the Navigator. You can copy them
    to other documents as well. In this example, an object is copied between two StreamWriter
    documents.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_40_0.png)


    +   1. In the Navigator window, click and hold the Drag Mode icon. The Drag Mode
    menu will appear.


    +   2. Move the mouse pointer to Insert as Copy. The menu item will be selected.


    +   3. Release the mouse button. The Drag Mode will be set to Insert as Copy.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_40_1.png)


    +   4. Click on any object in the Navigator list box. The object will be selected.


    +   5. Click and drag the object down to the Taskbar, placing the cursor over
    the Task icon for the other document. The second document will appear in the window.'
  merge: -1
