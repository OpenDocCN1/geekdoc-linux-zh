  md: '# # 18

    Learning StarChart Basics


    Let''s face it: charts are simply cool. There is nothing like "Aha!" feeling you
    get when you see previously incomprehensible raw data neatly organized in a chart.


    StarChart works well with its sister component, StarCalc, to create these cool
    charts. The data within StarCalc is more ready to be charted and graphed. All
    it takes is a little planning and effort to yield great results. In this chapter,
    you''ll learn how to:


    +   - Create pie, bar, line, and 3D charts


    +   - Make a chart without a StarCalc spreadsheet


    +   - Resize a chart


    +   - Edit a chart


    +   - Change a chart''s style'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# Creating a Chart


    In StarChart, you can create several types of charts: pie, bar, line, and three-dimensional
    (3D). There are dozens of variants to these four categories. They are all easy
    to create, thanks to StarChart''s AutoFormat chart tool.


    # Making a Pie Chart


    Pie charts provide an excellent vehicle for depicting percentage values. When
    we can see a given piece of the pie in relation to the other pieces, we get a
    pictorial representation in our minds that is more meaningful than mere numbers.


    +   1. **Select** the *cell range* to chart. The cell range will be highlighted.


    +   2. **Click** on **Insert**. The Insert menu will appear.


    +   3. **Click** on **Chart**. The first AutoFormat Chart dialog box will open.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_265_0.png)'
