    +   - Window control buttons


    +   - Title bar


    +   - Menu bar


    +   - Toolbar


    +   - Explorer


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_28_1.png)


    +   - Toolbar scroll button


    +   - Desktop


    +   - Beamer


    +   - Task icon


    +   - Taskbar


    +   - Start button'
  merge: -1
