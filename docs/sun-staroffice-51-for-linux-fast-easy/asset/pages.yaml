    +   3. Click on the 3-D option. The option will be selected.


    +   4. Click on the Columns type. The option will be selected.


    +   5. Click on the Normal variant. The option will be selected.


    +   6. Click on OK. The Chart dialog box will close and the chart will be changed
    to the new type.'
