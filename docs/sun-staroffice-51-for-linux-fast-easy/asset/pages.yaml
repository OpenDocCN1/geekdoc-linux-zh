  md: '# 20

    Learning StarBase Basics


    The average computer user deals with increasingly more data. A spreadsheet alone
    might not fulfill a user''s data needs. This is where StarBase comes in. StarBase
    is StarOffice''s database application. Not only can you create your own database
    with StarBase, but it also comes with a sample Address Book database, which is
    a pretty handy tool in itself. In this chapter, you''ll learn how to:


    +   * Recognize database concepts

    * Navigate the Address Book

    * Use the Address Book to create form letters'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# Database Concepts


    Four different types of objects compose databases. All of these objects working
    together make up the database. These objects are tables, forms, queries, and reports.
    Before examining the workings of an actual database, it helps to review the function
    of each object.


    +   **Tables:** These are essentially simplified spreadsheets. A database table
    is simpler because the purpose of the rows and columns is set, whereas a spreadsheet
    has more flexibility in how you can use rows and columns. In a database table,
    each row is a database record. A database record is a collection of related data.
    In a database of books, for example, one record could be: Ivanhoe, Sir Walter
    Scott, New American Library, September, 1987. This record has five fields: Book
    Title, Author, Publisher, Published Month, and Published Year. All other records
    in this database use the same fields. If a record needs to contain more information,
    then the database needs additional fields. In database programmer lingo, including
    more information is sometimes referred to as adding columns.


    +   **Forms:** These are the interface structure between the user and the table.
    Although you can directly enter data into a table (and some prefer this), a form
    gives the user visual cues to help enter data more quickly, rather than tediously
    tab row after row row of the database.


    +   **Queries:** These are little programming scripts that pull specific information
    out of a database. Once a query gathers information, it must be displayed.


    +   **Reports:** These are similar to spreadsheets in they typically present data
    in tabular form. Reports, however, are not interactive. They simply place the
    data requested'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'by a query into a read-only file, which can be printed or displayed onscreen.
    If you need to change the data, you must change it in the table (through the form).


    Databases can have multiple versions of all of these objects. The choices are
    limitless.


