  md: '# 22

    Learning StarImpress Basics


    Most people are not effective orators; in fact, many people fear public speaking
    just slightly less than death. There is another way to effectively get your point
    across: visual presentations. People simply remember better if they see them with
    their own two eyes.


    Corporate presentations originated with placards showing charts that were created
    by people whose sole job was to...create charts. Overheads appeared next, lending
    presenters the ability to support their points on-the-fly. Then slides, which
    added color and speed to presentations. Now slides can be created directly on
    a computer and projected from there, as well.


    StarImpress is the component in StarOffice that gets this job done for you. In
    this chapter, you''ll learn how to:


    +   - Create a StarImpress presentation

    - Use the different views to modify your presentation'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Creating Presentations


    Creating a StarImpress presentation is fairly routine when you use the AutoPilot
    function. It is important to outline your presentation at least roughly before
    you begin so that you have some idea of what slides to create.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_341_0.png)


    +   1. Click on File. The File menu will appear.

    2. Move the mouse pointer to New. The New menu will appear.

