- img_proc: true
  md: '# Checking for Messages


    > NOTE

    For more information about configuring your Internet and e-mail connections, see
    Appendix A, "StarOffice 5.1 Installation."


    As with sending e-mails, StarMail needs to be prompted to pick up your e-mail
    messages from the Internet mail server you connect to. Think of it as walking
    to the corner post office to get your mail.


    +   1. After connecting to the Internet, click on the E-Mail & News group bar.
    The E-Mail & News group will appear.


    +   2. Right-click on the Inbox folder. The context menu will appear.


    +   3. Click on Update. StarMail will update the contents of the Inbox by downloading
    all new messages from your configured e-mail server.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_408_0.png)


    > TIP

    You can automatically update the Inbox when opened by clicking on Update on Open
    in the folder''s context menu.'
