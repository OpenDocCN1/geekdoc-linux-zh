    in the File type field.


    +   5. Click on Save. The Save dialog box will close, and the file will be in
    HTML format.


    # Creating New Web Documents


    As simple as the Save As method, you should reserve it for basic document conversion,
    as getting corporate documentation quickly onto the company intranet. For more
    creativity, StarWriter provides an AutoPilot to help you start new Web pages.


