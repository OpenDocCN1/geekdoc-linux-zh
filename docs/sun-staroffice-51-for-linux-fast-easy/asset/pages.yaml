    5. Click on OK. The Insert Slide dialog box will close and the new slide will
    appear after the slide originally selected.


    # Deleting Slides


    It is much easier to destroy something than to build it. Such is the way of the
    world and such is the way of StarImpress when you remove a slide.


    +   1. Right-click on the slide tab of the slide you want to remove. The context
    menu will appear.


    +   2. Click on Delete Slide. A message box will appear.


