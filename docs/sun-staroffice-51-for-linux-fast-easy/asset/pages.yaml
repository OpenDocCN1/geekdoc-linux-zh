  md: '# Starting a New Document


    Those of you familiar with other office suite applications might have noticed
    that there are no "on" switches for any of the individual StarOffice components.
    A component only appears when you open a file of the type that that component
    uses. This is true for both existing documents and documents you create from scratch.


    +   1. Click on File. The File menu will appear.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_49_0.png)


    2. Move the mouse pointer to New. The New menu will appear.

    3. Click on Text Document. A new StarWriter document will open.


    # Saving Your Document


    When you complete your masterpiece, you''ll need to save the document on your
    computer. StarOffice makes it a snap to store your work.'
