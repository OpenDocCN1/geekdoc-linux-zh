  md: '# 17 Manipulating Data


    Once your data is entered into a spreadsheet, you can do more than simply add
    and subtract numbers. StarCalc lets you set up data entry restrictions so no “wrong”
    data gets into your calculations, and also lets you filter data so that you can
    see only the figures you need to make a decision. StarCalc even accelerates data
    entry itself. In this chapter, you''ll learn how to:


    +   * Use the selection list to enter data more efficiently

    * Filter your data to see only what you need

    * Make data input rules

    * Group and sort your data

    * Double-check your work with StarCalc''s Detective feature'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# 222 CHAPTER 17: MANIPULATING DATA


    # Entering Data Faster


    Before you start a StarCalc document ask yourself one question: what data do I
    want to enter? After answering this question, start putting data into your spreadsheet.
    If you are fortunate enough to have software that directly enters data into StarCalc,
    then your work is minimal. The rest of us take the old finger-dance approach.
    Luckily, StarCalc has some features that accelerate the data entry process.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_245_0.png)


