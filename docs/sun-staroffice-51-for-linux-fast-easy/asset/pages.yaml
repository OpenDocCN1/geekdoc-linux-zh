    # Applying New Data Formats


    Many of your spreadsheets may use specialized data presentations. Here''s how
    you get StarCalc to treat your numbers correctly.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_226_1.png)


    1. Click on a cell with a numeric value. The cell will be highlighted.


    2. Click on Format. The Format menu will appear.


    3. Click on Cells. The Cell Attributes dialog box will open.


    | | | | | | | |

    |---|---|---|---|---|---||

    | 7 | | | | | | |

    | 8 | | | | | | |

