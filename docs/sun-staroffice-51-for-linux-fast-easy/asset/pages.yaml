  md: '# Formatting with Fonts


    When changing the fonts of cell values in StarCalc, it is important to remember
    that selecting the cell applies changes to all of the cell''s values. Selecting
    a portion of the value in the cell''s input line applies font changes to only
    those selected values.


    # Changing a Font


    Changing the font of a cell is a piece of cake.


    +   1. Click on a cell. The cell will be highlighted.


    +   2. Click on the down arrow next to the Font Name field. The Font Name list
    will appear.


