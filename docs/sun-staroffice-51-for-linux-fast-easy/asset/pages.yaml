    +   3. Click on the Page tab.

    The Page tab will come to the front.


    +   4. Click on the margin field spin controls to increase their values to 1.50".
    The changes will appear in the Preview area.


    +   5. Click on OK. The Page Style dialog box will close and the new margins and
    page breaks will be represented by dark cell lines.


    # Setting Page Orientation and Size


    Spreadsheets usually do not appear in portrait orientation, but rather landscape.
    In this section, you will discover how to change the page orientation and paper
    size for your spreadsheet.


    +   1. Click on Format. The Format menu will appear.


    +   2. Click on Page. The Page Style dialog box will open.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_239_1.png)


