    spreadsheet.


    +   - Horizontal scroll bar. Click and drag this bar to move up and down the spreadsheet.


    +   - Sheet tab. Click on a tab to open other sheets within the spreadsheet file.


    # Entering Data


    You can place various kinds of data in a cell: text, numbers, cell references,
    and formulas. Formulas are examined in Chapter 14, “Working with Functions and
    Formulas.” In the meantime, you can explore how you enter the other three data
    types.'
