  md: '# Working with StarOffice Files


    In StarOffice you are always working with a document. Although people tend to
    think that documents are only created by word processor applications, the truth
    is that a document is any kind of StarOffice file—not just a StarWriter file.
    The way in which you use these documents can give you a critical edge in using
    the StarOffice application. In this chapter, you''ll learn how to:


    +   - Create a new StarOffice document

    - Save your document

    - Open a document from any StarOffice component

    - Print a StarOffice document

    - Close a document'
