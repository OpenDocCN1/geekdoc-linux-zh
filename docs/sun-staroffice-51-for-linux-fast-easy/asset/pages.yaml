  md: '# 26

    Learning the StarMail Basics


    E-mail contributes enormously to the massive dissemination of information. Think
    about this: In the time it takes to read this sentence, an e-mail message can
    be transmitted around the world. You can communicate to anyone who can access
    the Internet for such a low cost it is practically free.


    Because it is a complete office suite solution, StarOffice has StarMail, its own
    way of tapping into this communications medium. With it, you can e-mail colleagues
    across the hall or around the world with ease. In this chapter, you''ll learn
    how to:


    +   - Use the StarMail interface

    - Write and send an e-mail message

    - Receive and read your messages

    - Send files with your messages

    - Reply to and forward messages

    - Delete messages

    - Manage messages with folders'
  merge: -1
  pgno: 402
- img_proc: true
  md: '# Exploring the StarMail Interface


    At first glance, the StarMail interface might seem a bit cluttered and perhaps
    a little confusing. Of all the components in StarOffice, StarMail makes the most
    aggressive use of available screen real estate.


    +   - **Number of unread messages.** Signifies the number of unread messages within
    the folder.

    - **Number of messages.** Signifies the total number of messages within the folder.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_403_0.png)


    +   - **Inbox.** Contains all of your received messages, read or unread.

    - **Outbox.** Contains all the messages you have created, sent or unsent.

    - **Message list pane.** Displays the messages within a selected folder.

    - **Header pane.** Displays any files associated with or attached to the selected
    message.


    +   - **Message pane.** Displays the content of the message.

    - **Header information pane.** Displays detailed information from a selected message''s
    header.'
  merge: -1
  pgno: 403
- img_proc: true
  md: '# Creating an E-mail Message


    StarMail lets you create e-mail messages in just a few short steps.


    +   1. Click on File. The File menu will appear.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_404_0.png)


    +   2. Move the mouse pointer to New. The New menu will appear.


    +   3. Click on Mail. The StarMail interface will appear.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_404_1.png)


    +   4. Type a valid e-mail address in the Address field. The address will appear
    in the field.


    +   5. Press Enter. The address will move into the address list.'
  merge: -1
