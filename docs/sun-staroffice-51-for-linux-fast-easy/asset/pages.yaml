    ![](img/ebf658698a8f8f48ccc4405fe7df0231_103_1.png)


    4. Press Ctrl+V simultaneously. The cut text will appear in the new location.


    > TIP

    nYou can move paragraphs with the keyboard by placing the mouse pointer in the
    paragraph and pressing Ctrl+up arrow or Ctrl+down arrow. The paragraph moves one
    paragraph up or down the page, respectively.'
