  md: '# # 8

    Improving Your Writing


    If you think that StarWriter does nothing more than get your words on paper, think
    again. StarWriter can take an active role in helping you write better. In this
    chapter, you''ll learn how to:


    +   - Search for and replace text

    - Perform a spelling check on your document

    - Customize a spelling check with AutoCorrect

    - Use AutoText as a shortcut to type commonly used terms'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# Using Search and Replace


    Finding a particular word or phrase in a document longer than a page can be tedious.
    StarWriter''s Search tool will do the hard work for you, and the companion Replace
    tool will change the text into whatever you need.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_121_0.png)


    # Using Search


    The search tool tracks any character, word, or phrase in a StarWriter document.


    +   1. Click on the Search On/Off icon. The Search & Replace dialog box will open.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_121_1.png)


    +   2. Type a term in the Search for field. The term will appear.


    +   3. Click on Search to begin the search for the target term. StarWriter will
    highlight the first occurrence of the term it discovers.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# USING SEARCH AND REPLACE 99


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_122_0.png)


    4. Click on Search again to continue the search. The next instance of the item
    will appear.


    5. Click on Close. The Search & Replace dialog box will close.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_122_1.png)


    # Using Replace


    You can replace multiple instances of a word or phrase in your document.


    +   1. Click on the Search On/Off icon. The Search & Replace dialog box will open.'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# 100 CHAPTER 8: IMPROVING YOUR WRITING


    2. Type a search term in the Search for field.


    3. Type a replacement term in the Replace with field.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_123_0.png)


    4. Click on Replace. The first occurrence of the search term will be replaced.


    5. Click on Replace again. The next instance of the phrase will be highlighted.


    6. Click on Close. The Search & Replace dialog box will close.


    > TIP

    You might be tempted to just click on the Replace All button. But be cautious
    because you might end up replacing words or parts of words that you don''t want
    to change. For protection against this, make sure you''ve selected the Whole words
    only and Match case boxes.


    # Correcting Spelling Errors


    The winner of the 1999 Scripps Howard National Spelling Bee won the contest for
    correctly spelling logorrhea (which means pathologically repetitive speech); For
    those of us who have trouble spelling ordinary words, StarOffice gives us hope.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# CORRECTING SPELLING ERRORS


    # # Checking Spelling as You Go


    StarWriter can check your spelling as you type, alerting you to misspelled words.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_124_0.png)


    +   1. Click on the Auto Spellcheck icon.


    Unrecognized words in the document will appear underlined.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_124_1.png)


    +   2. Right-click on an underlined word. A context menu will appear, listing
    a number of alternative spellings for the word.


    +   3a. Click on the correct spelling of the word. The word will be corrected.


    OR'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# CHAPTER 8: IMPROVING YOUR WRITING


    3b. Click on Add if the word is correctly spelled and StarWriter does not recognize
    it. The word will be added to StarWriter''s dictionary, and all other occurrences
    of the word will no longer be underlined.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_125_0.png)


    4. Click on the dictionary name to add the new word. The word will no longer be
    underlined.


    # Running a Spelling Check


    If you do not have time to individually check all of the underlined words, you
    can run a comprehensive search for misspelled words using the Spelling tool.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_125_1.png)


    +   1. Click on the Spelling icon. The Spelling dialog box will open.'
