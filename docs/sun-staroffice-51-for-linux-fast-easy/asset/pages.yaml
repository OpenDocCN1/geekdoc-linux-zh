  md: '# 25


    # Learning the StarDraw Basics


    The ability to create stunning art becomes more accessible to the layperson every
    day. With its vector-based and three-dimensional capabilities, StarDraw is clearly
    a step toward this accessibility.


    A vector-based graphic contains geometric objects—lines, shapes, and shades—but
    no lower unit. Put another way: If you have a line in a vector-based graphic,
    you get a line. If you have a line in a raster-based graphic, which is a more
    common form, you get a collection of dots array to form a line. Because of this
    object-oriented treatment of items in a drawing, you can more easily manipulate
    and interact with the objects—especially given the tools StarDraw includes. In
    this chapter, you''ll learn how to:


    +   - Navigate the StarDraw interface


    +   - Create various shapes


    +   - Draw lines and curves


    +   - Create connected objects


    +   - Apply textures to your drawings


    +   - Build three-dimensional objects'
  merge: -1
  pgno: 379
- img_proc: true
  md: '# Exploring the StarDraw Interface


    StarDraw''s tools have a lot in common with the tools found in StarImpress. In
    fact, with respect to their toolbars, the components are nearly identical.


    This similarity is attributable to the fact that StarImpress''s Drawing View and
    StarDraw have the same goal: creating graphics. Starlimpress just creates multiple
    graphics with more text and a more unified look.


    +   - Main toolbar. Contains the primary tools for creating objects in drawings.

    - Rulers. Virtual measuring devices that assist in the placement of objects on
    the canvas.

    - Object bar. Contains the tools for manipulating objects in drawings.

    - Drawing canvas. The space upon which all drawings are created.

    - Color palette. A selection of colors that you can apply to any object with a
    single mouse click.

    - Mode controls. Activate the three edit modes of a StarDraw document: drawing
    mode, background mode, and


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_380_0.png)


    layer mode. Drawing mode is the default, normal mode for creating a drawing; background
    mode is where you edit only a drawing''s background; and layer mode is where you
    edit a drawing in layers, as if peeling the skin off an onion.'
  merge: -1
  pgno: 380
- img_proc: true
