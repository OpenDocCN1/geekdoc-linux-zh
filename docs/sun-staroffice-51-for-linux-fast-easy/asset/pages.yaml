  md: '# # 12

    Learning StarCalc Basics


    Spreadsheets got their start when accountants used to create large, table-sized
    sheets of paper to hand-write their numbers and calculations. This tedious and
    often frustrating practice has translated well into software form, particularly
    with StarCalc. In this chapter, you''ll learn how to:


    +   * Identify spreadsheet and StarCalc elements

    * Enter data into a spreadsheet

    * Edit spreadsheet data

    * Work with multiple spreadsheets'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Exploring the Spreadsheet


    Opening an existing spreadsheet file or creating a new spreadsheet file starts
    the StarCalc component. StarCalc''s interface contains several elements common
    to most spreadsheet programs:


    +   * **Sheet area.** Displays the row-and-column coordinates of a selected cell
    or cell range.

    * **Formula bar.** Contains important spreadsheet elements: the sheet area field
    and the input line.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_191_0.png)


    +   * **Column heading.** Indicates the column of a selected cell when bold.

    * **Input line.** Inputs data into the selected cell.

    * **Cell.** Contains the data values of the spreadsheet. A cell is formed by the
    intersection of a row and a column.

    * **Row heading.** Indicates the row of a selected cell when bold.


    +   * **Status bar.** Displays the status of your work.

    * **Sheet tab.** Accesses other sheets within the spreadsheet file.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Moving Around the Spreadsheet


    Getting around a spreadsheet file is like moving around on a big map: Knowing
    where you are is half the challenge.


