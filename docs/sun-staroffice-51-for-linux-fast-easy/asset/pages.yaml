  md: '# 458 APPENDIX A: STAROFFICE 5.1 INSTALLATION


    > NOTE

    Getting something for free might mean you have to work for it. Be aware that the
    size of the single download file for this flavor of Linux is extremely large:
    around 70MB. That means on an optimal 28.8K modem connection, it takes about 6
    to 7 hours to download this file. (This equates to 3 to 4 hours on a 56K modem
    and 1 to 2 hours on an ISDN connection.) It is recommended that you start the
    file download before you go to bed at night or before you leave for work in the
    morning. A late-night download will be the fastest because North American and
    European Internet traffic will be at its nightly ebb.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_481_0.png)


