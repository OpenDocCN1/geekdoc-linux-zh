  md: '# 2

    Using the StarDesktop


    StarOffice is a single application with many built-in components. Underneath all
    of the different components is the StarDesktop. You open all documents within
    the StarDesktop, which changes its appearance and accommodate the type of document
    being opened. In any incarnation, the StarDesktop tools, such as Explorer and
    Beamer, are always waiting on the sidelines, ready to be used. In this chapter,
    you''ll learn how to:


    +   - Use the Explorer and Beamer windows

    - Explore document objects in the Navigator window

