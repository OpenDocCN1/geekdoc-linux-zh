  md: '# 30

    Browsing the Web with StarDesktop


    The World Wide Web has become the fastest-growing medium in the history of the
    world. Millions of individual Web sites exist in the world today, compared to
    the mere 1,000 Web sites present in 1992.


    Despite the enormous size of the Web, the latest trend in computing treats the
    Web as an extension of your computer. Not a bad idea if you can get past the fact
    that millions of people use that your computer at the same time. But who cares
    if a file resides on your machine or on a Web server in Nepal? It''s all the same
    to you, as long as you can get the information you need. To participate in this
    paradigm, Sun has given StarDesktop the capability to browse the Internet as if
    you were browsing your own PC. In this chapter, you''ll learn how to:


    +   * Search for interesting Web sites on the Internet

    * Choose a start page for your browser

    * Mark favored Web sites

    * Surf to a specific site'
  merge: -1
  pgno: 460
- img_proc: true
  md: '# Searching the Web


    Searching for a specific Web page is a daunting task. All, every day, millions
    of new words are added to the Internet. StarOffice comes equipped with direct
    links to the best Internet search engines of the day to help you wade through
    the massive World Wide Web.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_461_0.png)


    +   1. **Click on View.** The View menu will appear.


    +   2. **Move the mouse pointer to Toolbars.** The Toolbars menu will appear.


    +   3. **Click on Hyperlink bar.** The Hyperlink bar will appear.


    +   4. **Type a search term** in the URL Name field. The term will appear.


    +   5. **Click and hold the Find icon.** The Find list will appear.


    +   6. **Click on AltaVista.** The AltaVista Web site will appear, displaying
    several search terms that you can click on for more information.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_461_1.png)'
  merge: -1
  pgno: 461
