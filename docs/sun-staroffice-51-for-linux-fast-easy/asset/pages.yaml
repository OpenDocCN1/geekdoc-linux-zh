    \ books around.\"\n—The Toronto Globe and Mail\n\n> \"Prima Publishing's fast\
    \ & easy series is just what consumers need!\"\n—CyberBold, Inc.\n\n![](img/ebf658698a8f8f48ccc4405fe7df0231_515_1.png)"
