  md: '# Introduction


    This Fast & Easy series guide from Prima Tech will be an excellent introduction
    to one of the hottest office suite applications on the market today: StarOffice,
    running on one of the fastest-growing operating systems—Linux.


    Linux and StarOffice seem to be together. Not only is StarOffice one of the few
    robust office suites available for the Linux platform, but the two products have
    similar histories as well. Indeed, the development of Linux and StarOffice has
    many parallels, though the two systems did not join together until 1996.


    Like Linux, StarOffice began with a student, 16-year-old Marco Borries, founded
    Star Division in 1985. Borries started her fledgling software development company
    with the goal of creating an effective, fast, and cheap word processing program.
    Starting with StarWriter, a DOS-based application, Star Division gained much industry
    acclaim in a short amount of time.


    By 1995, Star Division had added more functionality to its flagship products.
    Not only StarWriter, but StarCalc, StarBase, and StarDraw were being offered to
    the public, both separately and as part of the new StarOffice Product. While Microsoft
    began to dominate the North American market, European markets embraced StarOffice,
    due to its lower retail price, critical acclaim, and smaller memory footprint.


    A year later, StarOffice 3.1 became the first version of the application adapted
    for use on Linux.


    Today, StarOffice is available on Linux, Windows, OS/2, Sun/Solaris, and UNIX
    and has been recently bought by Sun Microsystems, which has big plans for the
    application.'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'StarOffice offers one more unique feature that other office suites don''t have.
    You can download and install the full version of the application from the Internet.
    And, depending on how you plan to use StarOffice, you may not have to spend a
    dime to get it.


    # Who Should Read This Book?


    This book is perfect for the first-time StarOffice user. Even if you have a passing
    familiarity with other office suites, the uniqueness of the StarOffice interface
    means you will need to learn quite a few new things. This book will also serve
    as an excellent reference resource. Whenever you venture into new StarOffice territory,
    you will be able to take a quick look and see how to perform the new task.


    # Helpful Hints to Increase Your Skills


    The book contains other helpful elements, as well, which offer insight and key
    information related to the topic being discussed:


    | TIP |

    | Tips tell you about new and faster ways to accomplish a goal. |


    | NOTE |

    | Notes delve into background information regarding a given topic. |


    The appendices will show you how to obtain and install StarOffice 5.1 for Linux
    free from the Internet. You will also learn the key combinations used in all of
    the StarOffice components.'
  merge: -1
