  md: '# Moving or Copying Text


    In the olden days (five years ago), if you had to move a passage of text, you
    used an editor''s knife to literally cut the text off the layout sheet; then physically
    pasted the text with wax onto another part of the page. Today, you can achieve
    the same effect in seconds without the sticky wax. The process is still called
    cutting and pasting, however.


    # Moving Text


    Moving text around a document with the keyboard is a simple process. Using the
    key combinations for Cut (Ctrl+X) and Paste (Ctrl+V) speeds you along.


    +   1. Select the text you want to move. The text will be highlighted.


    +   2. Press Ctrl+X simultaneously. The selected text will disappear.


    ![](img/ebf658698a8f8f48ccc4405fe7df0231_102_0.png)'
