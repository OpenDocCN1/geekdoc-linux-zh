  md: '# 31 Building Web Documents


    For years, the Internet has been regarded as a sort of mystical entity that only
    true wizards could build. We, the commoners, would have to be content to just
    watch and read. No longer! With StarOffice’s HTML editing capabilities, you can
    create your own Web-ready documents in a snap! In this chapter, you’ll learn how
    to:


    +   - Convert existing documents to the Internet

    - Create new Web documents with AutoPilot

    - Create a series of Web pages from a StarImpress presentation'
