    ## If / then / else is built


    The following example illustrates the structure that should be used to take an
    action or series of actions if the conditions of the if statement are met, and
    a series of other actions if not:


    hsoub scripts> gender = "male"


    hsoub scripts> if [["$ gender" == "f *"]]


    More input> then echo "Pleasure to meet you, Madame."


    More input> else echo "How come the lady hasn''t got a drink yet?"


    More input> fi


    How come the lady hasn''t got a drink yet?


    hsoub scripts>


    ###  The difference between [] and [[]]


        Unlike [],]] prevents words from being split into variable values, so if "VAR
    =" var with spaces you don''t need to put $ VAR between double quotes in a test,
    although using quotes remains a better behavior anyway. It also prevents]] pathname
    expansion, so do not attempt to expand wildcards to file names. Also, using]],
    == and =! Interpret the sections on the right as glob patterns that are compared
    to the values on the left. For example, [[* value "== val"]].


    The ALTERNATE-CONSEQUENT-COMMANDS alternative command list that follows the else
    statement may consist of any UNIX command that returns an exit state, just like
    the list of CONSEQUENT-COMMANDS dependent commands that follows the then statement.
    Here''s another example that complements the example described in the Exit-to-If
    Exit chapter in Bash:


    hsoub ~> su -


    Password:


    [root @ alaraby root] # if! grep ^ $ USER / etc / passwd 1> / dev / null


    > then echo "your user account is not managed locally"


    > else echo "your account is managed from the local / etc / passwd file"


    > fi


    your account is managed from the local / etc / passwd file


    [root @ alaraby root] #


    In the previous example, we changed the user to the root user to see the effect
    of else, because your root user is a local user, unlike your user account, as
    it may be subject to a centralized system, such as an LDAP server.


    ### Examine the command line arguments


    It is more appropriate to place values for variables on the command line rather
    than setting the variable to a value and then execute the program. We use the
    position parameters of $ 1, $ 2,…, N $ for this purpose, where # $ indicates the
    number of command-line arguments, and $ 0 indicates the name of the shell program
    . Here''s a simple example:


    hsoub @ alaraby: ~ / testdir $ cat penguin.sh


    #! / bin / bash


    # (Tux) This program allows you to serve food to the penguin


    # The penguin will only be happy when a fish is given


    if ["$ 1" == fish]; then


      echo "Hmmmm fish ... Tux is happy!"


    else


      echo "Tux doesn''t like that. Tux wants fish!"


    fi


    hsoub @ alaraby: ~ / testdir $ penguin.sh apple


    Tux doesn''t like that. Tux wants fish!


    hsoub @ alaraby: ~ / testdir $ penguin.sh fish


    Hmmm fish ... Tux is happy!


    hsoub @ alaraby: ~ / testdir $


    Here''s another example that uses two local operators:


    hsoub ~> cat weight.sh


    #! / bin / bash


    # This program prints a message about your weight if you give your weight in kilograms
    and your height in centimeters


    weight = "$ 1"


    height = "$ 2"


    idealweight = $ [$ height - 110]


    if [$ weight -le $ idealweight]; then


      echo "You should eat a bit more fat."


    else


      echo "You should eat a bit more fruit."


    fi


    hsoub ~> bash -x weight.sh 55 169


    + weight = 55


    + height = 169


    + idealweight = 59


    + ''['' 55 -le 59 '']''


    + echo ''You should eat a bit more fat.''


    You should eat a bit more fat.


    Test the number of arguments


    The following example explains how to modify the previous example to print a message
    if more than two position operators are entered:


    hsoub ~> cat weight.sh


    #! / bin / bash


    # This program prints a message about your weight if you enter your weight in
    kilograms and your height in centimeters


    if [! $ # == 2]; then


      echo "Usage: $ 0 weight_in_kilos length_in_centimeters"


      exit


    fi


    weight = "$ 1"


    height = "$ 2"


    idealweight = $ [$ height - 110]


    if [$ weight -le $ idealweight]; then


      echo "You should eat a bit more fat."


    else


      echo "You should eat a bit more fruit."


    fi


    hsoub ~> weight.sh 70 150


    You should eat a bit more fruit.


    hsoub ~> weight.sh 70 150 33


