    \ `gvim`，但你也会发现 `kwrite` 等其他的。\n\n### 在 if 中使用 exit 语句\n\n我们首先识别了 `exit` 语句，它终止程序的整个执行，通常在用户请求错误、语句未被成功执行或发生其他错误时使用。`exit`\
