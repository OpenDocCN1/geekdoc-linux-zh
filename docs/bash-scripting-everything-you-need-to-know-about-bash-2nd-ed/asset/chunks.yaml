    它是一个能够接收你输入的命令并请求内核执行这些命令的程序。也就是说，它和你操作系统之间充当了中间人，换句话说，它代表了系统的外层或接口，它接收你的指令并给你结果。然后它会再次显示提示符，表示已结束，并等待你输入更多命令。这就是为什么\
    \ shell 被称为命令解释器，类似于 Windows 中的 `.com`。它还包含一种类似于高阶语言的编程语言，非常强大，通过它可以解决任何问题。此外，一个重要特性是可以创建一个文件来创建另一个程序，这让你能够产生所谓的脚本。这里有很多类型的\
    \ shell，但最著名和常用的是两种类型：\n\n- Bourne shell 包括 `sh`、`ksh`、`bash`\n- C shell 包括 `csh`、`tcsh`\n\
    \n如果你使用的是 Bourne shell，你的默认提示符是 `$`。\n\n# 什么是 shell 提示符？\n\n提示符（无论是 `%` 还是 `$`）取决于你正在使用的\
    \ shell 类型。当提示符出现时，意味着 shell 正在等待你输入要执行的命令。如果你以 root 身份登录系统，会出现提示符。以下是每种类型 shell\
    \ 的优缺点：\n\n第一类包括：\n- 符号为 `sh` 的 Bourne shell\n- 符号为 `ksh` 的 Korn shell\n- 符号为\
    \ `bash` 的 Bourne again shell（再次 Bourne 壳）\n\n第二类包括：\n- C shell, TENEX / TOPS\
    \ C shell，符号为 `tcsh`\n\nshell 的起源于 Bourne shell，Stephen R. Bourne 在 20 世纪 70 年代中期在\
    \ AT&T 实验室的 unix 系统上编写了它。因此，有些人称它为“The Shell”，因为它最早出现。这个 shell 通常位于 `/bin/sh`。如前提到的，shell\
    \ 是一个命令解释器，同时也包含一种使用 ALGOL 语言的编程语言，包含以下内容：变量、函数、程序控制命令、循环命令、数学表达式等。所有 Bourne 类型都共享这些特征，但这种原始类型的缺点是难以使用。它没有自动补全功能，也没有保存已执行命令的命令。\n\
    \n十年后，1980 年，Bill Joy 编写了 C shell，避免了在类型中发现困难，并将语法公式从 ALGOL 转换为 C 语言。在其中发现的一些特性有：文本补全、保存之前写过的命令。我们通常在\
    \ `/bin/csh` 路径下找到这个 shell。它的缺点是：支持 I/O 操作的能力弱，缺乏函数，因此不建议用于编程，仅供使用。\n\nTENEX /\
    \ TOPS C shell (符号为 `tcsh`) 是 `csh` 的改进版本，增加了许多功能，包括使用箭头（上/下）查看已执行的命令，以及使用箭头（左/右）修改这些命令。此时，在两种类型的\
    \ shell 之后，David Korn 在 AT&T 编写了符号为 `ksh` 的 Korn shell。它结合了 C shell 和 Bourne shell\
    \ 的便利性，使得 `ksh` 成为许多用户的首选。\n\n总的来说，`ksh` 兼容第一类即 `sh`。这种并行关系有 3 个变体：\n- 符号为 `ksh`\
    \ 的官方版本\n- 符号为 `pdksh` 的公共领域版本\n- 最后是符号为 `dtksh` 的桌面版本\n\nshell 程序员经常使用第一和第二版本。第三种\
    \ `dtksh` 是给 shell 用户的。`ksh` 通常位于 `/bin/ksh` 或 `/usr/bin/ksh` 路径下。如果你的系统没有提供，可以从网上下载其他版本。\n\
    \n最后是 Bourne again shell，它目前被用于大多数发行版中，开发者 Brian Fox 收集了之前的特征并将其放入其中，因此它现在很受欢迎，通常位于\
    \ `/bin/bash` 路径或 `/bin/sh` 路径（后者已成为默认 shell）。\n\n# 进程何时开始和结束？\n\n当你登录系统时，`getty`\
    \ 开始工作，要求你输入用户名和密码，然后将其传递给 `login` 程序，该程序通过与 `/etc/passwd` 比对来检查输入的数据，如下：\n\n\
    ```\nSudaNix: x: 500: 500: ahmad: /home/SudaNix: /bin/bash\n```\n\n匹配的情况下，将执行文件中的，在此情况下是\
    \ `/bin/bash`，当你退出登录时 Shell 结束工作，可以通过输入命令 `/bin/csh` 更改进程类型，此处切换到 Cshell 并退出\n\
    \n 交互式和非交互式进程！！\n\n当你看到提示符时，这意味着进程以交互式方式运行，我的意思是交互式，也就是说，预期你会编写要执行的命令。这是通常正常情况：你进入系统，然后进程开始工作……然后你输入一些命令并退出系统，Shell\
    \ 被挂起。\n\n这与非交互式进程相矛盾：\n\n"
