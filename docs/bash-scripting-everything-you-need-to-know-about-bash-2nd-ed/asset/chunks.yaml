    In the following example, the filenames are converted to lower case, and the continue
    statement returns the loop if no characters need to be converted.


    These commands do not take a lot of system resources, and although such problems
    can be solved using the sed and awk commands, however, it is useful to know this
    method of solution as it is useful when performing large tasks, and it will not
    be necessary if tests are entered In the correct positions within the program,
    saving system resources:


    [wiki @ hsoub ~ / test] cat tolower.sh


    #! / bin / bash


    # This program converts all uppercase file names to lowercase names.


    LIST = "$ (ls)"


    for name in "$ LIST"; do


    if [["$ name"! = * [[: upper:]] *]]; then


    continue


    fi


    ORIG = "$ name"


    NEW = `echo $ name | tr ''A-Z'' ''a-z'''' ''


    mv "$ ORIG" "$ NEW"


