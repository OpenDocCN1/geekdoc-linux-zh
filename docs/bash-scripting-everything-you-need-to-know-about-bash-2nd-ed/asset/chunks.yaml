    Be aware of the dangers of using unsafe tools such as `rlogin`, `telnet`, `rsh`,
    and `rcp`, as they transmit sensitive data over the network without encryption.
    If need tools to remotely administer the system, transfer files, etc., use a Secure
    SHell Protocol (`ssh`) protocol, which is available for free from `http://www.openssh.org`.
    You will also find different programs for non-Unix-like systems, see your local
    software mirror.


    The call when the UID is not identical to the EUID


    No files are read at startup in this case.


    ### Interactive shells


    #### What is interactive chance?


    An interactive shell reads and writes at a user''s terminal as follows:


    Input and outputs are connected to the terminal, and interactive bash behavior
    starts when the `bash` command is called without adding any non-option arguments,
    except if the option is a string that is read, or when the shell is triggered
    to read a standard input, This allows the initialization of positional parameters,
    see Bash environment.


    ##### Is this coincidence interactive?


    To find out if a shell is interactive, look at the content of the special parameter
    `-`, if it has an `"i"`, the shell is interactive:


    ```

    hsoub: ~> echo $ -

    himBH

    ```


    In the non-reactive shell, the `PS1` inductor is not initialized, ie it goes back
    to zero.


    ###### Interactive shell behavior


    - Bash reads startup files.

    - Function control is enabled by default.

    - Inductors are configured, and the `PS2` environment variable is activated for
    multi-line commands, usually set to `<`, which is also what you get when the shell
    assumes that you entered an incomplete command, such as forgetting quotes or one
    or more items that cannot be neglected in a command, etc.

    - By default, commands are read from the command line using `readline`.

    - Bash interprets the `ignoreeof` option when you receive End Of File (or `EOF`
    for short) instead of exiting directly.

    - Command history and log expansion are enabled by default, and the log is saved
    in a file referred to by `HISTFILE` when the shell closes. By default, `HISTFILE`
    refers to `bash_history./~`.

    - Alias expansion is automatically activated.

    - The `SIGTERM` signal is ignored in the absence of traps.

    - In the absence of traps, `SIGINT` is captured and handled, so pressing `Ctrl
    + C`, for example, won''t get you out of the interactive shell you''re in.

    - `SIGHUP` signals can be set to be sent to all functions at exit, with the `huponexit`
    option.

    - The commands are executed as soon as they are read.

    - Periodically inspect mail bash.

    - Bash can be set to close when you encounter unreferenced variables. This behavior
    is disabled in interactive mode.

    - When shell commands encounter redirect errors, they will not cause the shell
    to close or exit.

    - Repeated errors for special built-in commands while using them in POSIX mode
    do not cause an accident. See the commands included in the shell for more on the
    included commands.

    - Failure to `exec` will not cause the exit of chance.

    - Syntactic errors of the Parser will not cause the shell to close.

    - Simple check of arguments `cd` is activated by default.

    - Auto-logoff after a period specified in the `TMOUT` variable has elapsed, is
    also enabled.


    For more explanation, see Variables in Bash, More Bash options, Capture signals
    in Bash for more signals, and Bash expansions that discuss the different expansions
    that occur when you enter an order.


    ### Conditional Expressions


    Conditional expressions are used via the combined `[]` command, the included commands
    and `test`, and the built-in commands. Expressions can be mono or binary.


    There are also text operators (string operators) and numeric comparison operators.
    These two types are binary operators, requiring two elements to perform the operation
    on.


    If the `FILE` argument of an original is `dev / fd / N /`, the file descriptor
    `N` is selected, but if it is in one of those `dev / stdin /` or `dev / stdout
    /` or `dev / stderr /`, the file descriptor `0`, `1`, Or `2` respectively.


    See the detail description for conditional structures for more conditional expressions,
    and see redirection and file descriptions for more file descriptors.


    ### Arithmetic expressions in shell Shell Arithmetic Expressions


    Coincidence allows arithmetic expressions to be evaluated as one of the expansions
    of the shell, or by using the `let` command, and evaluated as fixed width integers
    without overflow, except that dividing by 0 is captured and notified as an error.
    The rules of the C programming language on factors, their precedence and their
    associativity apply to their counterparts here, see bash environment.


    ### Alternative commands


    Alternative commands allow a word to be replaced by a text of several words when
    used as the first word of a simple command. The shell keeps a list of alternative
    commands that can be created or canceled using `alias` and `unalias`.


    Bash reads at least a full line of inputs before executing any commands on that
    line. Alternative commands are also expanded when the command is read and not
    executed, so if the characters of one of the alternate commands on a line match
    the letters of another command in the same line, the command that the alternate
    command holds is only executed when the next line of input is read.


    Similarly, alternative commands are expanded when a function description is read,
    not when executed, because the function description itself is a compound command,
    so alternative commands in a function are only available after the function is
    executed. We will discuss alternative orders in detail in the alternative orders.


    # Chapter One


    # Create and run the Bash program


    ## Writing and naming


    If you have a series of commands that you execute frequently and want to shorten
    the execution time or execute them automatically, you can put them in an empty
    file written in a particular format and read by chance as a program).These programs
    are used to automate tasks using the `cron` tool or in boot and shutdown procedures
    in Unix systems, where daemons and services are defined in init scripts.


    To create a shell program, open an empty file in your favorite text editor.It
    doesn''t matter what type of editor you''re using.Most of them are doing the job
    we want now, writing a shell program.But what might make you use a sophisticated
    editor like VIM or emacs, is that you can configure them to recognize the texts
    you write and highlight them in different colors - including texts and shell commands
    that we will write - and that reduces the mistakes that beginners usually make,
    such as omitting closing parentheses `()` or forget about semicolons`;`.


    ### Highlight texts in VIM


    Use one of the following three commands to highlight Text Highlighting in the
    VIM editor:


    `syntax enable:` or `sy enable:` or `syn enable:`


    It is useful to add that setting to a `vimrc` file. In order to install it by
    default.


    Place the Unix commands in the file you created as if you were going to type those
    commands on the command line (see Execute Commands in Bash). These commands can
    be shell functions, embedded commands, Unix commands, etc. Now give that file
    a name that describes the tasks it executes and make sure that the name does not
    conflict with pre-existing commands.To ensure this, the names of shell programs
    often end in `.sh`, but this does not prevent the presence of other text codes
    in the system with the same name you choose,search in the system for files Or
    text codes with the same name using file and program search commands like `which`
    or `whereis`:


    ```

    which -a script_name


    whereis script_name


    locate script_name

    ```


    ```

    script1.sh

    ```

