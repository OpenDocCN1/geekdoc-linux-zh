    Bash reads at least one full line of inputs before executing any commands on that
    line. Alternative commands are only expanded when a command is read and not executed,
    so defining an alternate command that appears on the same line as another does
    not have effect until the next line of Input. Commands that follow the alternative
    command definition on that line are not affected by the new alternative command.
    This behavior is also a problem when you perform functions. Alternative commands
    are expanded when the definition of a new function is read and not executed, since
    the function itself is a compound command. As a result, alternative commands specified
    in a function are not available even after the function is executed. But to be
    safe, place the alternate command settings on a separate line and do not use the
    `alias` command in bulk commands. Also, sub-processes do not inherit substitute
    commands, and the Bourne shell does not recognize alternative commands.


    ### Faster functions


    Alternative commands are sought after functions, so their resolution is slower,
    although easier to understand, and prefers the shell functions over alternative
    commands in almost every use.


