    TEST\n+ [[test! = * [[: upper:]] *]]\n+ continue\n+ [[Test! = * [[: Upper:]] *]]\n\
    + ORIG = Test\n++ echo Test\n++ tr A-Z a-z\n+ NEW = test\n+ mv -b Test test\n\
    + echo 'new name for Test is test'\nnew name for Test is test\n+ [[TEST! = * [[:\
    \ Upper:]] *]]\n+ ORIG = TEST\n++ echo TEST\n++ tr A-Z a-z\n+ NEW = test\n+ mv\
    \ -b TEST test\n+ echo 'new name for TEST is test'\nnew name for TEST is test\n\
    [wiki @ hsoub ~ / test] ls -a\n./ ../ test test ~\n```\n\n`tr` 命令是 `textutils`\
    \ 软件包的一部分，可以对文件进行各种转换。\n\n# 第六章\n\n## Bash 中的函数\n\n函数为需要重复执行的命令分组提供了一种简单的方法。函数类似于小型脚本，因此它们会生成退出代码或返回代码。\n\
    \n### 什么是函数？\n\nShell 函数是使用单个组名作为整体或例程对命令进行分组以便以后执行的方法。当该函数被当作简单命令调用时，与函数名关联的命令列表将执行，并且函数将在其声明所在的\
    \ Shell 中执行。包含在 Shell 函数之前的特殊命令会在搜索命令时出现，包含的特殊命令有：`break`、:`、`.`、`continue`, `eval`,\
    \ `exec`, `exit`, `export`, `readonly`, `return`, `set`, `shift`, `trap`, `unset`。\n\
    \n### 函数语法\n\n函数使用以下两个规则之一：\n\n```bash\nfunction FUNCTION {COMMANDS; }\n```\n\n\
    或\n\n```bash\nFUNCTION () {COMMANDS; }\n```\n\n这些规则定义了一个名为 `FUNCTION` 的 Shell\
    \ 函数。你不需要使用函数，但如果你不使用它，则需要像你在第二个规则中看到的括号 `()`。\n\n#### 常见错误\n\n大括号 `{}` 必须与其内部的内容之间隔开，否则函数内容将被误解，且函数内容必须以分号或换行结束。\n\
    \n### 函数中的位置系数\n\n函数类似于微型代码，它们可以接受参数，并通过 `local` 命令使用在函数外部无法使用的变量，并可以向其调用的 Shell\
    \ 返回值。函数有一套解释位置系数的系统，尽管传递给函数的位置系数与传递给命令或文本代码的系数并不相同。当函数执行时，它的参数在执行期间变为位置系数，而展开为位置系数数量的特殊参数\
    \ `#` 会进行更新以反映发生的变化。\n\n位置系数不会变为 0，并且在执行期间 `FUNCNAME` 变量会被设置为函数名。如果在函数中执行了 `return`\
    \ 命令，则函数将执行完毕，该命令将在函数被调用后执行。在函数返回完成后，位置系数和特殊参数 `#` 的值将恢复到函数执行前的值。这里是一个简单的示例：\n\
    \n```bash\n[ahmad @ ahmadpc ~ / test] cat showparams.sh\n#! / bin / bash\necho\
    \ \"此脚本演示了函数参数。\"\necho\necho \"脚本的位置参数 1 是 $ 1。\"\necho\ntest ()\n{\necho \"\
    函数中的位置参数 1 是 $ 1。\"\nRETURN_VALUE = $?\necho \"此函数的退出代码是 $ RETURN_VALUE。\"\n}\n\
    test other_param\n```\n\n```bash\n[ahmad @ ahmadpc ~ / test] ./showparams.sh parameter1\n\
    此脚本演示了函数参数。\n脚本的位置参数 1 是 parameter1。\n函数中的位置参数 1 是 other_param。\n此此函数的退出代码是 0。\n\
    ```\n\n注意，函数的返回值或退出代码通常存储在变量中以供稍后探测，你的系统初始化代码在类条件测试中使用 `RETVAL` 变量检查技术：\n\n```bash\n\
    if [$ RETVAL -eq 0]; then\n    <启动守护进程>\n```\n\n或者，如在下面的 `/etc/init.d/amd` 代码示例所示，其中使用了\
    \ bash 配置功能：\n\n```bash\n[$ RETVAL = 0] && touch /var/lock/subsys/amd\n```\n\n\
    `&&` 之后的命令仅在测试成功时执行，这是 `if / then / if` 的简短表达式。函数的返回代码被用作整个代码的退出代码，你会看到许多初始化代码以\
    \ `exit $ RETVAL` 等结尾。\n\n## 显示函数\n\n当前 Shell 的所有已知函数可以使用不带选项的 `set` 命令显示。函数在使用后将仍然存在，除非使用\
    \ `unset` 命令将其删除。\n\n```bash\n[ahmad @ ahmadpc ~] which zless\nzless 是一个函数\nzless\
    \ ()\n{\n  zcat \"$ @\" | \"$ PAGER\"\n}\n[ahmad @ ahmadpc ~] echo $\n```\n\n\
    或者如在下面的 `/etc/init.d/amd` 代码示例所示，其中使用了 bash 配置功能：\n\n```bash\n[$ RETVAL = 0] &&\
    \ touch /var/lock/subsys/amd\n```\n\n`&&` 之后的命令仅在测试成功时执行，这是 `if / then / if` 的简短表达式。函数的返回代码被用作整个代码的退出代码，你会看到许多初始化代码以\
    \ `exit $ RETVAL` 等结尾。\n\n## 显示函数\n\n当前 Shell 的所有已知函数可以使用不带选项的 `set` 命令显示。函数在使用后将仍然存在，除非使用\
