    The user must reconnect to the system when modifying any of the files mentioned
    above in order to activate these modifications, or as another method that uses
    the `source` command on the file he edited. Modifications are applied to the current
    shell session when interpreting Bash in this way:


    Figure 3.1: Different inductors for each user.


    ![](images/00001.jpeg)


    Most Bash programs are implemented in special environments where sub-processes
    do not acquire variables unless the parent shell makes them a source (sourcing).
    Making a file with shell commands a source is one way to apply modifications to
    your environment and adjust variables in the current shell.


    This example also explains the use of different inductors for each user, and in
    our case the `#` sign means that you are now in the root user stage, you should
    be wary of every command you enter as the device will not hesitate to execute
    it even if it means destroying files from the system core, Unlike the `$` prompt
    of the average user who has limited authority to execute the commands he or she
    enters.


    Note that the `source resourcefile` is the same as the `resourcefile`.


    If you suspect these many settings and see settings you don''t know where they
    originate, use the `echo` command just as you do to refine Bash programs (see
    Refine parts of Bash programs). For example, you can add a line like this:


    ```bash

    echo "Now executing .bash_profile .."

    ```


    or


    ```bash

    echo "Now setting PS1 in .bashrc:"

    export PS1 = "[some value]"

    echo "PS1 is now set to $ PS1"

    ```


    ## Variables in Bash


    ### Types of variables


