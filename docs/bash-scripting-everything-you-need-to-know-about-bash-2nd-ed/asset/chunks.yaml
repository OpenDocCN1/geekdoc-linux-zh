    are read as lines as well, and all programs in this explanation will start with
    the following line:


    #! / bin / bash


    The preceding line indicates that the Bash is present in the bin /.


    ## Add comments


    Be aware that your software may be seen and read by others.


    The comments make it easier for you to modify the program and go back to what
    you wrote again. What''s new if you haven''t recorded comments about what you
    did, how you did it, and why you chose those orders or modifications?


    Copy the script1.sh file in the example of creating and running a Bash program
    named commented-script1.sh, and we will modify its content so that the comments
    describe what the commands do. Be aware that anything encountered by chance after
    the # sign in any line is ignored, and only appears when you open the source file.
    For the program:


    #! / bin / bash


    # This program scans peripheral content, greets the user and gives information
    about users


    # Callers at program execution time. The two variables used as examples are formatted
    and presented


    clear # Clear terminal contents immediately


    echo "The script starts now."


    echo "Hi, $ USER!" # The dollar sign is used to fetch the content of a variable


    echo


    echo "I will now fetch you a list of connected users:"


    echo


    w # Show who is signed in and what to do


    echo


    echo "I''m setting two variables now."


    COLOR = "black" # Set a local variable to the shell


    VALUE = "9" # Set a local variable to the shell


    echo "This is a string: $ COLOR" # Display the variable content


    echo "And this is a number: $ VALUE" # View the variable content


    echo


    echo "I''m giving you back your prompt now."


    echo


    The first lines in shell programs are usually comments that explain the nature
    of the tasks the program executes, and then each piece of code is accompanied
    by one or more comments to illustrate. You will find an example in the init.d
    folder of your system, as init codes are well documented because they are readable
    and modified by any Linux user.


    # Chapter II


    # Bash environment


    The Bash environment can be set up at the system level as a whole or for each
    user individually, and various configuration files are used to control shell behavior.
    These files contain shell options, variable settings, function definitions, and
    other Bash shell builders that make it easier for us to create a comfortable and
    fulfilling work environment. .


    You can choose names for variables as you like, with the exception of reserved
    names for Bourne, Bash, and special parameters. Bash uses a quoting system to
    exclude special meanings from one or more characters if no special processing
    is needed, since many characters have two or more meanings depending on the environment.


    Bash also uses multiple methods to extend command-line entries in order to determine
    which commands to execute.


    ## Shell initialization files


    System-wide Configuration files


