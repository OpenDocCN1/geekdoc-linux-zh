- fmt: "\n```\nwiki ~> echo $ MYVAR1 $ first_name $ full_name\n\n<- no output ->\n\
    \nwiki ~>\n```\n\n## Export variables\n\nThe variable that is generated as seen\
    \ in the example above is only available in the current shell, it is a local variable,\
    \ and the sub-processes of the current shell will not recognize this variable.\n\
    \nIn order to pass the variables to the sub-shell, we must export them using the\
    \ `export` command first. The variables that are exported are referred to as environment\
    \ variables.\n\n```bash\nexport VARNAME = \"value\"\n```\n\nThe sub-shell can\
    \ modify the variables you have gained from the parent shell, but these changes\
    \ will not affect the parent shell. Here's an example that explains:\n\n```bash\n\
    wiki ~> full_name = \"Wiki Hsoub\"\n\nwiki ~> bash\n\nwiki ~> echo $ full_name\n\
    \nwiki ~> exit\n\nwiki ~> export full_name\n\nwiki ~> bash\n\nwiki ~> echo $ full_name\n\
    \nWiki Hsoub\n\nwiki ~> export full_name = \"Osama H. Damarany\"\n\nwiki ~> echo\
    \ $ full_name\n\nOsama H. Damarany\n\nwiki ~> exit\n\nwiki ~> echo $ full_name\n\
    \nWiki Hsoub\n```\n\nIn the example above, we have the `full_name` variable with\
    \ a value of `Wiki Hsoub`, and when we try to read that value in a sub-shell,\
    \ we get a null answer (the `echo` command shows a -null string- value).\n\nNow\
    \ we get out of the sub shell and export the `full_name` variable in the parent\
    \ shell, then open a new sub shell and ask for the value of the `full_name` variable\
    \ again, this time we get its value (`Wiki Hsoub`), because the variable is visible\
    \ to the sub shell after it is exported.\n\nWe can change the value of the variable\
    \ inside the sub-shell as you see in the example to (`Osama H. Damarany`), but\
    \ when we get out of that shell and go back to the mother shell to ask for the\
    \ value of the variable itself, we get the first value (`Wiki Hsoub`), did not\
    \ affect its value in the mother shell By changing it inside a sub-shell.\n\n\
    ## The difference between `$` and `@`\n\nUsing `$` can cause bugs or vulnerabilities\
    \ in your programs, and almost every time a programmer uses `$`, it means `@`.\n\
    \nTopical operators are words that follow the name of the shell program. These\
    \ parameters are placed in the variables `$1`, `$2`, `$3`, and so on. The variables\
    \ are added to an internal array as long as needed.\n\n```bash\n#! / bin / bash\n\
    \n# positional.sh\n\n# This script reads 3 positional parameters and prints them\
    \ out.\n\nPOSPAR1 = \"$ 1\"\n\nPOSPAR2 = \"$ 2\"\n\nPOSPAR3 = \"$ 3\"\n\necho\
    \ \"$ 1 is the first positional parameter, \\ $1.\"\n\necho \"$ 2 is the second\
