    ## Classify variables based on their content


    Variables can be categorized according to the type of content the variable holds,
    and accordingly the variables are divided into four types:


    - Text variables.

    - Numerical variables.

    - Static variables.

    - Matrix Variables.


    You''ll find more explanation about these types in more about variables in Bash,
    but now we''ll work with numerical and textual values for our variables.


    ## Create variables


    Variable names are case-sensitive, and the variable is capitalized by default,
    but local variables can be given lowercase names. In any case, you have the freedom
    to use the names you want or put small and large letters within the name of a
    single variable. Variables can also contain numbers provided that the variable
    name does not begin with a number:


    ```bash

    prompt> export 1number = 1

    bash: export: `1number = 1 '': not a valid identifier

    ```


    Use the following code to set the value of a variable in the shell:


    ```bash

    VARNAME = "value"

    ```


    Be careful, however, do not put spaces around the quotation marks as this will
    cause errors, so it''s a good idea to usually acquire text content quotes when
    you assign values to variables, as this will reduce the likelihood of an error.
    Here are some examples of using case, numbers, and spaces:


    ```bash

    wiki ~> MYVAR1 = "2"

    wiki ~> echo $ MYVAR1

    2


    wiki ~> first_name = "Wiki"

    wiki ~> echo $ first_name

    Wiki


    wiki ~> full_name = "Wiki Hsoub"

    wiki ~> echo $ full_name

    Wiki Hsoub


    wiki ~> MYVAR-2 = "2"

    bash: MYVAR-2 = 2: command not found


    wiki ~> MYVAR1 = "2"

    bash: MYVAR1: command not found


    wiki ~> MYVAR1 = "2"

    bash: 2: command not found


    wiki ~> unset MYVAR1 first_name full_name

    ```

