    alias ... = ''cd ../ ..''

    alias .... = ''cd ../../ ..''

    alias PAGER = ''less -r''

    alias Txterm = ''export TERM = xterm''

    alias XARGS = ''xargs -r''

    alias cdrecord = ''cdrecord -dev 0,0,0 -speed = 8''

