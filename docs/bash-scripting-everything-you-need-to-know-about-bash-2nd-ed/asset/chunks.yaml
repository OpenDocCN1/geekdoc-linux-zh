- fmt: "\nIn this example, we will use the `echo` command to print on-screen notifications\
    \ that tell the user what will happen before each task is executed. It is important\
    \ to tell the user what is happening to avoid panic because the user feels that\
    \ the program is \"doing nothing\". See detailed user notification in writing\
    \ interactive Bash programs.\n\n### The `script1.sh` file\n\n```bash\n#! / bin\
    \ / bash\n\nclear\n\necho \"The script starts now.\"\n\necho \"Hi, $USER!\"\n\n\
    echo\n\necho \"I will now fetch you a list of conntected users:\"\n\necho\n\n\
    w\n\necho\n\necho \"I'm setting two variables now.\"\n\nCOLOR = \"black\"\n\n\
    VALUE = \"9\"\n\necho \"This is a string: $COLOR\"\necho \"And this is a number:\
    \ $VALUE\"\n\necho\n\necho \"I'm giving you back your prompt now.\"\n\necho\n\
    ```\n\nYou may have to train yourself to write shell programs by typing this example\
    \ into the image yourself. It is also useful to create a `~/scripts` folder to\
    \ save your text codes in, then add that folder to the contents of the `PATH`\
    \ variable as follows:\n\n```bash\nexport PATH = \"$PATH:~/scripts\"\n```\n\n\
    Use an editor that supports text highlighting for shell commands if you are a\
    \ beginner. This feature is supported in editors such as `VIM`, `gvim`, `(x) emacs`,\
    \ `kwrite` and other editors, so make sure your editor supports Text Highlighting\
    \ by looking at the Document Highlighting feature. That editor.\n\n### Various\
    \ induct\n\nThe inductors used in this explanation may differ to simulate real-life\
    \ situations rather than using the `$inductor`, which is frequently used in explanations.\
    \ However, the root user prompt will remain constant in the annotation, and will\
    \ be `#`.\n\n### Program implementation\n\nThe program is executable for those\
    \ entitled to it, that is, to whom the program owner grants permission to execute\
    \ it, make sure that you get the permissions you want while adjusting the permissions\
    \ of the program, and then you can run the program as you run any command in chance:\n\
    \n```bash\nwiki @ hsoub:~/scripts $ chmod u + x script1.sh\nwiki @ hsoub:~/scripts\
    \ $ ls -l script1.sh\n-rwxrwxr-x 1 wiki wiki 331 Jul 31 03:12 script1.sh\nwiki\
    \ @ hsoub:~/scripts $ script1.sh\n```\n\n```text\nThe script starts now.\nHi,\
    \ wiki!\nI will now fetch you a list of connected users:\n03:12:48 up 3:42, 1\
    \ user, load average: 1.33, 1.51, 1.67\nUSER TTY FROM LOGIN @ IDLE JCPU PCPU WHAT\n\
    wiki tty7: 0 23:30 3: 42m 12:51 0.63s /usr/lib/gnome-session/gnome\nI'm setting\
    \ two variables now.\nThis is a string: black\nAnd this is a number: 9\nI'm giving\
    \ you back your prompt now.\n```\n\n```bash\nwiki @ hsoub:~/scripts $ echo $COLOR\n\
    wiki @ hsoub:~/scripts $ echo $VALUE\nwiki @ hsoub:~/scripts $\n```\n\nThis is\
    \ the most common way to implement a shell script, preferably in a subshell. The\
    \ variables, functions, and aliases that were created in that sub shell will be\
    \ defined for this session from Bash for that sub shell only. As it was when that\
    \ shell closed and control of the mother coincided again, everything is cleaned\
    \ and all changes made by the program to chance are canceled. If you do not put\
    \ the scripts folder in the `PATH` variable and it is not the current folder.\
    \ You can also execute the program with this command - `script_name` indicates\
    \ the name of your program -:\n\n```bash\n./script_name.sh\n```\n\nThe program\
    \ may be implemented in a particular shell, although we do this if we want to\
    \ obtain certain behavior, such as checking if the program is working in another\
    \ shell or printing traces for debugging:\n\n```bash\nrbash script_name.sh\nsh\
    \ script_name.sh\nbash -x script_name.sh\n```\n\nThe shell specified in any of\
    \ the above commands will act as a sub-shell of your current shell and execute\
    \ the program. You may do this when you want the program to run with specific\
    \ options or under circumstances not specified in it. If you want to execute the\
    \ program within the same shell as you are, you must first use the `source` command:\n\
    \n```bash\nsource script_name.sh\n```\n\n### `source = . `\n\nThe `source` command\
    \ included in the Bash shell is synonymous with a command in Bourne coincidence.\
    \ Shell does not need any execute permissions in that case, and commands are executed\
    \ in the current context of the shell, so any changes that occur to your current\
    \ environment will be visible and remaining after the program is finished executing:\n\
    \n```bash\nwiki @ hsoub:~/scripts $ source script1.sh\nwiki @ hsoub:~/scripts\
    \ $ echo $COLOR\nblack\nwiki @ hsoub:~/scripts $ echo $VALUE\n9\nwiki @ hsoub:~/scripts\
    \ $ \n```\n\n## In which coincidence will the program work?\n\nYou must specify\
    \ the shell that will execute the program if you want to execute it in a sub-shell.\
    \ The shell in which you wrote the program may not be the default shell of your\
    \ system, so your program commands may produce errors when executed in the wrong\
    \ shell.\n\nThe first line in the program specifies the type of shell, and the\
    \ first two characters in that line must be `#!`, followed by the path of the\
    \ shell that will execute the program. Also, do not start your program with a\
    \ blank line as blank lines are read as lines as well, and all programs in this\
    \ explanation will start with the following line:\n\n```bash\n#! / bin / bash\n\
    ```\n\nThe preceding line indicates that the Bash is present in `/bin`.\n\n##\
    \ Add comments\n\nBe aware that anything encountered after `#` sign in any line\
    \ is ignored, and only appears when you open the source file. The comments make\
    \ it easier for you to modify what you did, how you did, and why you chose those\
    \ orders.\n"
