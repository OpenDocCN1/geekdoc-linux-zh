    ## Process substitution


    Process substitution is supported in systems that support named pipes (`FIFOs`-
    First In First Out) or the `/dev/fd/file` naming method, with the format: `(LIST)>`
    or `(LIST) <`.


    The `LIST` process is carried out so that its inputs and outputs are connected
    to a named pipe (`FIFO`) or a file in `/dev/fd/`, and the file name is passed
    as an intermediary to the current command as a result of the expansion. If `LIST`
    is used, writing to the file will provide the `LIST` with inputs. If `LIST` is
    used, the file passed as an intermediary must be read in order to obtain the `LIST`
    output. Note that spaces should not appear between the `<or>` tags and the left
    parenthesis, otherwise the structure will be interpreted as a redirect.


    Process substitution is performed in conjunction with coefficient and variable
    expansion, command substitution and computational expansion whenever possible.
    See Forwarding and file descriptions.


    ## Split words


    The coincidence clears the results of transaction expansion, order substitution,
    and arithmetic expansions that do not fall within double quotes in search of a
