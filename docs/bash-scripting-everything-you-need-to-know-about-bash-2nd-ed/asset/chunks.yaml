    pattern list.When it finds a match in a line, it copies the line to the standard
    output by default or to any other output that you require using the options that
    you may add to the command.


    Although the grep command expects to match text, it has no restrictions on the
    length of the input line except for available memory, and can match arbitrary
    characters inside the line, although the last byte of the input file is not a
