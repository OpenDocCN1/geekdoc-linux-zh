    ## Match patterns using Bash features


    ### Character Ranges


    Unlike `grep` and regular expressions, we have many instances of pattern matching
    that you can make directly in the shell without having to use an external program.
    Match any single text or character, respectively, and in order to match these
    two characters specifically, enclose double quotation marks around each:


    ```

    hsoub ~> touch "*"


    hsoub ~> ls "*"


    *

    ```


    You can use square brackets to match any character or character set within those
    brackets if the character pairs are separated by a dash - see the following example,
    which shows all files beginning with one of the following characters: `a`, `b`,
    `c`, `x`, `y`, `z` in the user''s home folder `hsoub` :


    ```

    hsoub ~> ls -ld [a-cx-z] *


    drwxr-xr-x 2 hsoub hsoub 4096 Jul 20 2002 app-defaults /


    drwxrwxr-x 4 hsoub hsoub 4096 May 25 2002 arabic /


    drwxrwxr-x 2 hsoub hsoub 4096 Mar 4 18:30 bin /


    drwxr-xr-x 7 hsoub hsoub 4096 Sep 2 2001 crossover /


    drwxrwxr-x 3 hsoub hsoub 4096 Mar 22 2002 xml /

    ```


    If the first typeface in parentheses is `!` or `^` it will match any character
    that is not in parentheses, and to match the dash `-`, enter it as the first or
    last character in the set, and the classification depends on the current locale
    and the value of the `LC_COLLATE` variable, if set to a value, note that other
    locale may be interpreted `[a-cx-z]` as `[aBbCcXxYyZz]`. If the classification
    is in the dictionary order, and if you want to make sure the range is interpreted
    in the traditional way, set `LC_COLLATE` or `LC_ALL` to `C`.


    ### Character Types


    Character classes can be specified in square brackets according to the linguistic
    structure `[: CLASS:]` where `CLASS` is defined within the POSIX standard and
    has one of the following values: `alnum`, `alpha`, `ascii`, `blank`, `cntrl`,
    `digit`, `graph`, `lower`, `print`, `punct`, `space`, `upper`, `word`, `xdigit`.


    Examples:


    ```

    hsoub ~> ls -ld [[: digit:]] *


    drwxrwxr-x 2 hsoub hsoub 4096 Apr 20 13:45 2 /

    ```

