    ## Match patterns using Bash features


    ### Character Ranges


    Unlike grep and regular expressions, we have many instances of pattern matching
    that you can make directly in the shell without having to use an external program.
    Match any single text or character, respectively, and in order to match these
    two characters specifically, enclose double quotation marks around each:


    hsoub ~> touch "*"


    hsoub ~> ls "*"


    *


    You can use square brackets to match any character or character set within those
    brackets if the character pairs are separated by a dash - see the following example,
    which shows all files beginning with one of the following characters: a, b, c,
    x, y, z in the user''s home folder hsoub :


    hsoub ~> ls -ld [a-cx-z] *


    drwxr-xr-x 2 hsoub hsoub 4096 Jul 20 2002 app-defaults /


    drwxrwxr-x 4 hsoub hsoub 4096 May 25 2002 arabic /


    drwxrwxr-x 2 hsoub hsoub 4096 Mar 4 18:30 bin /


    drwxr-xr-x 7 hsoub hsoub 4096 Sep 2 2001 crossover /


    drwxrwxr-x 3 hsoub hsoub 4096 Mar 22 2002 xml /


    If the first typeface in parentheses is! Or ^ it will match any character that
    is not in parentheses, and to match the dash -, enter it as the first or last
    character in the set, and the classification depends on the current locale and
    the value of the LC_COLLATE variable, if set to a value, note that other locale
    may be interpreted [ a-cx-z] as [aBbCcXxYyZz] If the classification is in the
    dictionary order, and if you want to make sure the range is interpreted in the
    traditional way, set LC_COLLATE or LC_ALL to C.


    Character Types


    Character classes can be specified in square brackets according to the linguistic
    structure [: CLASS:] where CLASS is defined within the POSIX standard and has
    one of the following values: alnum - alpha - ascii - blank - cntrl - digit - graph
    - lower - print - punct - space - upper - word - xdigit.


    Examples:


    hsoub ~> ls -ld [[: digit:]] *


    drwxrwxr-x 2 hsoub hsoub 4096 Apr 20 13:45 2 /


    cathy ~> ls -ld [[: upper:]] *


    drwxrwxr-- 3 hsoub hsoub 4096 Sep 30 2001 Nautilus /


    drwxrwxr-x 4 hsoub hsoub 4096 Jul 11 2002 OpenOffice.org1.0 /


    -rw-rw-r-- 1 hsoub hsoub 997376 Apr 18 15:39 Schedule.sdc


    Several extended pattern matching operators are defined when the extglob option
    is activated using the shopt command, see the info directory pages, basic shell
    features section> shell expansions> filename expansion> Pattern matching.


    # Chapter IV


    # Conditional structures in Bash


    In this chapter, we will learn how to build conditional strings in our programs
    so that we can take different actions based on the success or failure of commands.These
    procedures will be determined using the if statement.This will allow you to perform
    mathematical and textual comparisons, and to test the exit codes, inputs, and
    files needed by the program.


    Commands in shell programs are usually preceded by an if / then / fi test to prevent
    the output from being created for the program to run in the background or through
    the cron tool, and more complex conditions are placed in the case statement.


    The program tells the parent shell when the condition test is successful using
    the exit 0 state


    Another number, and the program in the mother shell then performs the appropriate
    actions according to the return code.


    - Introduction to if in Bash


    Look at the conditional if statement, as well as then, the expressions and commands
    used with each, as well as checking files and shell options.


    - Advanced uses of the conditional if statement


    Detailed explanations of structures using if / then / else and if / then / elif
    / else.


    - Use the case structure in Bash


    A simple explanation of cases where case is used instead of if, with an example
    from an init code.


    D You need to specify different strings of action within shell scripts based on
    the success or failure of the execution of a command, the conditional if tool
    comes for such cases, and the smallest syntax for the if command is the following:


    if TEST-COMMANDS; then CONSEQUENT-COMMANDS; fi


    The TEST-COMMANDS test command list is executed, and the CONSEQUENT-COMMANDS dependent
    command list is executed if its return status is zero. The return status is the
    exit status of the last executed order, or zero if no test order is met.


    The TEST-COMMAND test command often involves numerical or textual comparisons,
    but this does not prevent a command that returns a zero state if it succeeds and
    another case when it fails. Unary Expressions are often used to test the status
    of a file. FILE for a primaries in dev / fd / N format. The file descriptor N
    is inspected. Stdin, stdout, and stderr files and their file descriptions, respectively,
    may also be used in these tests.


    ## Expressions used with if


    The following table contains a summary of the so-called basics that make up the
    TEST-COMMAND test order or the list of test commands in the conditional if structure.
    These basics are enclosed in square brackets to show the conditional expression
    test.


    The [] test command evaluates conditional expressions using a set of rules based
    on the number of arguments. You will find more explanation of this in the Bash
    documentation. Also, the square bracket should be closed after the conditions
    are listed just as if the conditional should be closed with fi.


    ## The commands that follow are then


    CONSEQUENT-COMMANDS commands following the then statement can be any UNIX command,
    executable program, shell script, or shell statement, except of course the fi
    statement that is closed. Perhaps you should remember that then and fi are separate
    phrases in chance, so they are separated by a semicolon; When you type them in
    the command line. Also, the different parts of the if statement within a shell
    program are well separated, you''ll find some examples below.


    ## Scan files


    The first example looks at the existence of the msgcheck.sh file:


    hsoub ~> cat msgcheck.sh


    #! / bin / bash


    echo "This scripts checks the existence of the messages file."


    echo "Checking ..."


    if [-f / var / log / messages]


      then


        echo "/ var / log / messages exists."


    fi


    echo


    echo "... done."


    hsoub ~> ./msgcheck.sh


    This scripts checks the existence of the messages file.


    Checking ...


    / var / log / messages exists.


    ... done.


    ## Check the chance options


    To add your Bash settings files:


    # noclobber These lines will print a message if an option is set:


    if [-o noclobber]


      then'
