    ## Alternative commands in Bash


    ### Utility alternative commands


    The `alias` command allows a single word to be placed in place of a string, if
    used as the first word of a simple command. The shell keeps a list of alternate
    commands that can be set and desensitized by the `alias` and `unalias` commands.
    Type `alias` at the command line to see a list of alternate commands defined for
    the current shell:


    ```

    hsoub: ~> alias


