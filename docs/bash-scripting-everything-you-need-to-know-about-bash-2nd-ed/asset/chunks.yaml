    \n可以通过以下方式获得相同的结果：\n\n```\nhsoub> grep $USER /etc/passwd\nhsoub> if [$? -ne 0];\
    \ then echo \"not a local account\"; fi\nnot a local account\nhsoub>\n```\n\n\
    ### 数值比较\n\n下面的示例使用了数值比较：\n\n```\nhsoub> num = `wc -l work.txt`\nhsoub> echo $num\n\
    201\nhsoub> if [\"$num\" -gt \"150\"]\nMore input> then echo; echo \"you've worked\
    \ hard enough for today.\"\nMore input> echo; fi\nyou've worked hard enough for\
    \ today.\nhsoub>\n```\n\n这段代码会在每个周日通过 `cron` 执行，即使在周数是偶数时，也会提醒你清理垃圾桶：\n\n```bash\n\
    #! /bin/bash\n# date 使用命令计算周数：\nWEEKOFFSET=$[($(date + \"%V\")% 2)]\n# 考虑条件语句：如果有提醒，如果没有（即周数为），则给我们发送一条消息\n\
    # 在任何其他结果情况下，该语句什么都不做。\nif [$WEEKOFFSET -eq \"0\"]; then\n  echo \"Sunday evening,\
    \ put out the garbage cans.\" | mail -s \"Garbage cans out\" your@your_domain.org\n\
    fi\n```\n\n## 文本比较\n\n这是一个测试用户 ID 的文本比较示例：\n\n```bash\nif [\"$(whoami)\" != 'root'];\
    \ then\n  echo \"You have no permission to run $0 as non-root user.\"\n  exit\
    \ 1;\nfi\n```\n\n你可以使用 Bash 简化这种结构，参考下面的示例，它代表了上一个测试中的压缩图像：\n\n```bash\n[\"$(whoami)\"\
    \ != 'root'] && (echo you are using a non-privileged account; exit 1)\n```\n\n\
    指定 `||` - 即当测试失败时该做什么，就像 `&&` 表达式解释了测试成功时该做什么一样。此外，比较中也可以使用通配符：\n\n```\nhsoub>\
    \ gender = \"male\"\nhsoub> if [[\"$gender\" == m*]]\nMore input> then echo \"\
    Pleasure to meet you, Sir.\"; fi\nPleasure to meet you, Sir.\n```\n\n## 真正的程序员\n\
    \n大多数程序员倾向于使用 `test` 命令，这等同于使用方括号进行比较。请参考以下示例：\n\n```bash\ntest \"$(whoami)\"\
    \ != 'root' && (echo you are using a non-privileged account; exit 1)\n```\n\n\
    ### exit 命令\n\n如果你在子 shell 中调用 `exit` 命令，它不会将变量传递给父 shell。如果你不想让 Bash 打开子 shell，请用\
    \ `{}` 代替 `()`。\n\n"
