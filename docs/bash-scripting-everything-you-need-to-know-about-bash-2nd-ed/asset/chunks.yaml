  trans: "\n\n在这个示例中，我们将使用 `echo` 命令在屏幕上打印通知，告知用户在每个任务执行之前将发生什么。告诉用户正在发生的情况是非常重要的，以避免用户因为觉得程序“什么都没做”而产生恐慌。请参阅编写交互式\
    \ Bash 程序中的中的详细用户通知说明。\n\n### `script1.sh` 文件\n\n```bash\n#! / bin / bash\n\n\
    clear\n\necho \"The script starts now.\"\n\necho \"Hi, $USER!\"\n\necho\n\necho\
    \ \"I will now fetch you a list of conntected users:\"\n\necho\n\nw\n\necho\n\n\
    echo \"I'm setting two variables now.\"\n\nCOLOR = \"black\"\n\nVALUE = \"9\"\n\
    \necho \"This is a string: $COLOR\"\necho \"And this is a number: $VALUE\"\n\n\
    echo\n\necho \"I'm giving you back your prompt now.\"\n\necho\n```\n\n你可能需要通过自己在终端输入这个示例来训练自己编写\
    \ shell 程序。创建一个 `~/scripts` 文件夹来保存你的代码也是很有用的，然后如下所示将该文件夹添加到 `PATH` 变量中：\n\n```bash\n\
    export PATH = \"$PATH:~/scripts\"\n```\n\n如果你是新手，请使用支持 shell 命令文本高亮的编辑器。此类功能在\
    \ `VIM`、`gvim`、`(x) emacs`、`kwrite` 等其他编辑器中都支持，因此请通过查看文档高亮功能确保你的编辑器支持文本高亮。\n\n\
    ### 各种指示\n\n说明中使用的指示器可能为了模拟真实情况，而不是使用经常用于说明的 `$inductor`。然而，注释中的 root 用户提示符将保持不变，并为\
    \ `#`。\n\n### 程序实现\n\n程序对于有权的人（即程序所有授予执行权限的人）是可执行的。在调整程序权限时，确保你获得了所需的权限，然后你就可以像运行任何命令一样运行该程序：\n\
    \n```bash\nwiki @ hsoub:~/scripts $ chmod u + x script1.sh\nwiki @ hsoub:~/scripts\
    \ $ ls -l script1.sh\n-rwxrwxr-x 1 wiki wiki 331 Jul 31 03:12 script1.sh\nwiki\
    \ @ hsoub:~/scripts $ script1.sh\n```\n\n```text\nThe script starts now.\nHi,\
    \ wiki!\nI will now fetch you a list of connected users:\n03:12:48 up 3:42, 1\
    \ user, load average: 1.33, 1.51, 1.67\nUSER TTY FROM LOGIN @ IDLE JCPU PCPU WHAT\n\
    wiki tty7: 0 23:30 3: 42m 12:51 0.63s /usr/lib/gnome-session/gnome\nI'm setting\
    \ two variables now.\nThis is a string: black\nAnd this is a number: 9\nI'm giving\
    \ you back your prompt now.\n```\n\n```bash\nwiki @ hsoub:~/scripts $ echo $COLOR\n\
    wiki @ hsoub:~/scripts $ echo $VALUE\nwiki @ hsoub:~/scripts $\n```\n\n这是实现 shell\
    \ 脚本的最常见，最好在子 shell 中进行。在子 shell 中创建的变量、函数和别名仅对该子 shell 的 Bash 会话有效。当该 shell 关闭并控制权重新交回时，一切都会被清理，程序对环境所的所有更改都会被取消。如果你没有将脚本文件夹放入\
    \ `PATH` 变量，且它不是当前目录，你也可以使用此命令执行程序——`script_name` 表示你的程序名称：\n\n```bash\n./script_name.sh\n\
    ```\n\n程序可以在特定的 shell 中实现，尽管我们通常在想要获得某些行为时才这样做，例如检查程序是否在另一个 shell 中运行，或为了调试打印跟踪信息：\n\
    \n```bash\nrbash script_name.sh\nsh script_name.sh\nbash -x script_name.sh\n```\n\
    \n上述任何命令中指定的 shell 都将作为你当前 shell 的子 shell 并执行程序。当你希望程序带有特定选项运行或在程序内未指定的条件下运行时，你可以这样做这样做。如果你想在与当前相同的\
    \ shell 中执行程序，必须先使用 `source` 命令：\n\n```bash\nsource script_name.sh\n```\n\n###\
    \ `source = . `\n\nBash shell 中包含的 `source` 命令与 Bourne 环境中的一个命令同义。在这种情况下，shell\
    \ 不需要任何执行权限，命令在 shell 的当前上下文中执行，因此你的当前环境中发生的任何更改在程序执行完毕后都是可见并保留的：\n\n```bash\n\
    wiki @ hsoub:~/scripts $ source script1.sh\nwiki @ hsoub:~/scripts $ echo $COLOR\n\
    black\nwiki @ hsoub:~/scripts $ echo $VALUE\n9\nwiki @ hsoub:~/scripts $ \n```\n\
    \n## 程序将在什么环境下运行？\n\n如果你想在子 shell 中执行程序，必须指定执行该程序的 shell。你编写程序的 shell 可能不是你系统的默认\
    \ shell，因此当在错误的 shell 中执行时，你的程序可能会产生错误。\n\n程序的第一行指定了 shell 的类型，该行的前两个字符必须是 `#!`，随后是执行该程序的\
    \ shell 路径。此外，不要以空行开始程序，因为空行也会被读取，说明中的所有程序都将以以下行开头：\n\n```bash\n#! / bin / bash\n\
    ```\n\n之前的行表示 Bash 存在于 `/bin`。\n\n## 添加注释\n\n注意，任何行中 `#` 符号之后的内容都会被忽略，并且只有在你打开源文件时才会显示。注释让你能够更容易修改你所做的、如何做以及为什么选择这些顺序。\n\
    \n"
- fmt: "\n`Bash` reads the instructions in `/etc/profile` if invoked interactively\
    \ via the login option - or if called as `sh`, these instructions usually set\
    \ the `PATH`, `USER`, `MAIL`, `HOSTNAME`, `HISTSIZE` variables, which are shell\
    \ variables.\n\nThe `umask` value in `/etc/profile` is also set on some systems;\
    \ in others this file contains pointers to other configuration files such as:\n\
    \n- `/etc/inputrc` file, which is a system-wide configuration file for the `readline`\
    \ command, where you can configure the bell style for the command line.\n- The\
    \ `/etc/profile.d/` folder, which contains files that set the behavior of specific\
    \ programs at the system level.\n\nAll settings you want to apply to all users\
    \ in your system must be present in that `/etc/profile` file, and may look similar\
    \ to the following:\n\n```bash\n# /etc/profile\n\n# System wide environment and\
    \ startup programs, for login setup\n\nPATH = $PATH:/usr/X11R6/bin\n\n# No core\
    \ files by default\n\nulimit -S -c 0> /dev/null 2>&1\n\nUSER=`id -un`\n\nLOGNAME\
    \ = $USER\n\nMAIL = \"/var/spool/mail/$USER\"\n\nHOSTNAME=`bin/hostname`\n\nHISTSIZE\
    \ = 1000\n\n# Keyboard, bell, display style: the readline config file:\n\nif [-z\
    \ \"$INPUTRC\" -a ! -f \"$HOME/.inputrc\" ]; then\n    INPUTRC=/etc/inputrc\n\
    fi\n\nPS1 = \"\\u@\\h \\W\"\n\nexport PATH USER LOGNAME MAIL HOSTNAME HISTSIZE\
    \ INPUTRC PS1\n\n# Source initialization files for specific programs (ls, vim,\
    \ less, ...)\n\nfor i in /etc/profile.d/*.sh; do\n    if [-r \"$i\"]; then\n \
    \       . $i\n    fi\ndone\n\n# Settings for program initialization\n\nsource\
    \ /etc/java.conf\n\nexport NPX_PLUGIN_PATH=\"$JRE_HOME/plugin/ns4plugin:/usr/lib/netscape/plugins\"\
    \n\nPAGER=\"/usr/bin/less\"\n\nunset i\n```\n\nThis configuration file sets some\
    \ basic shell variables in addition to some variables required by any user running\
    \ Java or any Java application in their browser. See variables in `Bash`.\n\n\
    See conditional structures in `Bash` for more if if conditionals used in the previous\
    \ example, and repeating tasks in `Bash` that discuss iterative loops such as\
