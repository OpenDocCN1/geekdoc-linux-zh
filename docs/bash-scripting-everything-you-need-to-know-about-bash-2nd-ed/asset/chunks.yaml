    ## 使用 Bash 特性匹配模式


    ### 字符范围


    与 `grep` 和正则表达式不同，我们有很多模式匹配可以直接在 shell 中完成实例，而无需使用外部程序。分别匹配任何单个文本或字符，为了特地匹配这两个字符，请在每个字符周围加上双引号：


