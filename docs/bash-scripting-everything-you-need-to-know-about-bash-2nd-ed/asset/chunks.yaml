    \n## 编写交互式 Bash 程序\n\n在本节中，我们将学习如何获取用户反馈以及如何用户输入数据（通常使用 `echo` / `read` 结构），并讨论如何使用文件描述符和重定向将文件作为输入和输出，以及如何将其与用户输入相结合。本节还强调了为使用我们\
    \ shell 程序的用户提供详细信息的重要性。与其编写简短的文档，不如提供过的信息。\n\nHere documents 是一种 shell 结构，允许为用户创建列表并保存选项，还可以用于在后台执行交互式任务而不受干扰。\n\
    \n- 在 Bash 中查看用户消息：Bash 中交互式和非交互式程序的区别，`echo` 命令的简单解释。\n- 在 Bash 中获取用户输入：`read`\
    \ 命令的解释、文件描述符、请求用户输入、文档及其用例，以及重定向的各种状态。\n\n## 在 Bash 中查看用户消息\n\n### 交互式或非交互式程序？\n\
    \n某些 shell 脚本无需用户干预即可运行，被称为非交互式程序。这些程序的优点之一是它们以意想不到的方式工作，并且可以在后台运行。然而，其他 shell\
    \ 程序需要用户输入，或者在工作时向用户打印消息。这类程序也有其优点。\n\n在编写交互式程序时，不要懒于写注释。务必放置消息告诉用户，例如，等待输出出现，因为程序正在计算。尽可能，尝试提供过程长度的估算或用户应该等待多久。在从用户输入的情况下，最好提供关于你希望用户输入的数据的清晰透明的信息。你用于向用户打印的命令是\
    \ `echo` 和 `printf`，我们将在下面讨论一些示例，尽管你可能已经习惯使用 `echo`。\n\n### 使用 echo 命令\n\n`echo`\
    \ 命令输出两个空格分隔的参数并以换行符结束，返回状态始终为零。`echo` 命令还接受几个选项：\n- `-e`：允许使用反斜杠转义字符（参见转义字符章节）。\n\
    - `-n`：停止末尾换行符。\n\n这里是一个添加注释的示例，我们在其中使用了命令行参数的两个示例，将条件 `if` 语句的高级用法分开：\n\n```bash\n\
    #!/bin/bash\n# (Tux) 这个程序允许你为企鹅提供食物\n# 只有在给它鱼时企鹅才会开心，我们通过添加其他动物增加了一点趣味\nif [\"\
    $menu\" == \"fish\"]; then\n  if [\"$animal\" == \"penguin\"]; then\n    echo\
    \ -e \"Hmm fish ... Tux is happy!\"\n  elif [\"$animal\" == \"dolphin\"]; then\n\
    \    echo -e \"...\"\n  else\n    echo -e \"...\"\n  fi\nelse\n  if [\"$animal\"\
    \ == \"penguin\"]; then\n    echo -e \"Tux doesn't like that. Tux wants fish!\"\
    \n    exit 1\n  elif [\"$animal\" == \"dolphin\"]; then\n    echo -e \"...\"\n\
    \    exit 2\n  else\n    echo -e \"...\"$...\"\n    exit 3\n  fi\nfi\n```\n\n\
    ```bash\n#!/bin/bash\n# penguin.sh 根据程序给出的退出状态行为\nif [\"#\" != \"2\"]; then\n\
    \  echo -e \"Usage of the feed script: $0 food-on-menu animal-name\"\n  exit 1\n\
    else\n  export menu = \"$1\"\n  export animal = \"$2\"\n  echo -e \"Feeding $menu\
    \ to $animal ...\"\n  feed = \"/nethome/anny/testdir/penguin.sh\"\n  $feed $menu\
    \ $animal\n  result = \"$?\"\n  echo -e \"Done feeding.\"\n  case \"$result\"\
    \ in\n    1)\n      echo -e \"Guard: You'd better give fish, less they get violent...\"\
    \n      ;;\n    2)\n      echo -e \"Guard: No wonder they flee our planet...\"\
    \n      ;;\n    3)\n      echo -e \"Guard: Buy the food that the Zoo provides\
    \ at the entry, you...\"\n      echo -e \"Guard: You want to poison them, do you?\"\
    \n      ;;\n    *)\n      echo -e \"Guard: Don't forget the guide!\"\n      ;;\n\
    \  esac\nfi\necho \"Leaving ...\"\necho -e \"Thanks for visiting the Zoo, hope\
    \ to see you again soon!\"\n```\n\n## 在 Bash 中获取用户输入\n\n### 使用 read 命令\n\n`read`\
    \ 命令是 `echo` 和 `printf` 命令的补充命令，其语法如下：\n\n`read [options] NAME1 NAME2 ... NAMEN`\n\
    \n从标准输入或作为 `u` 选项参数的文件描述符中读取一行，将行的第一个单词分配给第一个名称 `NAME1`，第二个单词分配给第二个名称 `NAME2`，以此类推，并将的单词及其之间的分隔符分配给最后一个名称\
    \ `NAMEN`，但如果从输入流读取的单词少于名称，则为这些名称分配空值。\n\n"
