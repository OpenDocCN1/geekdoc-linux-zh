    \ it is executed and the command completes.\n\nIf `else` is followed by an `ALTERNATE-CONSEQUENT-COMMANDS`\
    \ list and the last order status in the last condition of the `if` or `elif` statement\
    \ is nonzero, the list of substitute orders is executed, and the return status\
    \ is the exit status of the last executed order or zero if no condition is met\
    \ Of the conditions given in the orders.\n\n### Example\n\nHere's an example that\
