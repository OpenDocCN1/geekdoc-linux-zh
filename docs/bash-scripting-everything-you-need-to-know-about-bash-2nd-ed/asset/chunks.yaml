  trans: '


    请注意使用 `rlogin`、`telnet`、`rsh` 和 `rcp` 等不安全工具的危险，因为它们会在网络上明文传输敏感数据。如果需要远程管理系统、传输文件等，请使用安全
    Shell 协议 (`ssh`)，该协议可以从 `http://www.openssh.org` 免费获取。你还可以找到针对非 Unix 类系统的不同程序，请查看你本地的软件镜像。


    当 UID 不等于 EUID 时的调用


    在这种情况下，启动时不会读取任何文件。


    ### 交互式 shell (Interactive shells)


    #### 什么是交互式 shell？


    交互式 shell 按照如下方式在用户的终端上进行读写：


    输入和输出连接到终端。当调用 `bash` 命令且不添加任何非选项参数时，会启动交互式 bash 行为，除非该选项是一个被读取的字符串，或者 shell 被触发读取标准输入。这允许位置参数的初始化，请参阅
    Bash 环境。


    ##### 这种 shell 是交互式的吗？


    要判断 shell 是否为交互式，请查看特殊参数 `-` 的内容，如果它包含 `"i"`，则该 shell 是交互式的：


    ```

    hsoub: ~> echo $ -

    himBH

    ```


    在非交互式 shell 中，`PS1` 提示符不会初始化，即它会回到零。


    ###### 交互式 shell 行为


    - Bash 读取启动文件。

    - 默认启用函数控制。

    - 配置提示符，并激活用于多行命令的 `PS2` 变量，通常设置为 `<`，这与 shell 认为你输入了不完整的命令（例如忘记写引号或命令中不可忽略的一个或多个项目等）时的显示相同。

    - 默认情况下使用 `readline` 从命令行读取命令。

    - 当接收到文件结束符（简称 `EOF`）时，Bash 会解释 `ignoreeof` 选项而不是直接退出。

    - 默认启用命令历史和日志扩展，并在 shell 关闭时将日志保存在 `HISTFILE` 指向的文件中。默认情况下，`HISTFILE` 指向 `/.bash_history`。

    - 自动激活别名扩展。

    - 在没有陷获 (traps) 的情况下，`SIGTERM` 信号会被忽略。

    - 在没有陷获的情况下，`SIGINT` 会被捕获并处理，因此按下 `Ctrl + C` 等不会让你退出当前所在的交互式 shell。

    - 可以通过 `huponexit` 选项设置退出时向所有函数发送 `SIGHUP` 信号。

    - 命令在读取后立即执行。

    - 定期检查邮件 bash。

    - Bash 可以设置为在遇到未定义的变量时关闭。此行为在交互模式下被禁用。

    - 当 shell 命令遇到重定向错误时，不会导致 shell 关闭或退出。

    - 在 POSIX 模式下使用特殊内置命令时，重复错误不会导致意外。更多关于包含命令的信息请参见 shell 包含的命令。

    - `exec` 失败不会导致 shell 退出。

    - 解析器的语法错误不会导致 shell 关闭。

    - 默认激活 `cd` 参数的简单检查。

    - 启用在 `TMOUT` 变量指定的时间超时后自动注销。


    有关更多解释，请参阅 Bash 中的变量、更多 Bash 选项、Bash 中的信号捕获（获取更多信号），以及讨论输入命令时发生的各种不同扩展的 Bash 扩展。


    ### 条件表达式 (Conditional Expressions)


    条件表达式通过组合命令 `[]`、包含的命令和 `test` 以及内置命令使用。表达式可以是单目的的或二目的的。


    还有文本运算符（字符串运算符）和数值比较运算符。这两类运算符都是二元运算符，需要两个元素来执行操作。


    如果原始的 `FILE` 参数是 `dev / fd / N /`，则选择文件描述符 `N`；但如果是 `dev / stdin /`、`dev / stdout
    /` 或 `dev / stderr /` 之一，则分别选择文件描述符 `0`、`1` 或 `2`。


    更多条件表达式请查看条件结构的详细描述，更多文件描述符请查看重定向和文件描述。


    ### Shell 中的算术表达式 Shell Arithmetic Expressions


    shell 允许将算术表达式作为 shell 扩展之一进行求值，或通过 `let` 命令求值，并评估为固定宽整数且不溢出，但除以 0 会被捕获并报告为错误。C
    语言中关于操作数、优先级和结合性的规则适用于此处的对应项，请参阅 bash 环境。


    ### 备选命令 (Alternative commands)


    当作为简单命令的第一个单词使用时，备选命令允许将一个单词替换为多个单词的文本。shell 保留了一个备选命令列表，可以使用 `alias` 和 `unalias`
    创建或取消。


    Bash 在执行该行的任何命令之前，至少读取整行输入。备选命令在命令读取但未执行时也会被扩展，因此如果行中某个备选命令的字符与同一行中另一个命令的字母匹配，则备选命令所持有的命令只有在读取下一行输入时才会执行。


    同样，备选命令在读取函数描述时扩展，而不是在执行时扩展，因为函数描述本身是一个复合命令，所以函数中的备选命令只有在函数执行后才可用。我们将在“备选顺序”中详细讨论备选顺序。


    # 第一章


    # 创建并运行 Bash 程序


    ## 编写与命名


    如果你有一系列经常执行的命令，并想缩短执行时间或自动执行它们，你可以将它们放在一个按特定格式写的空文件中（该文件会被 shell 作为程序读取）。这些程序用于使用
    `cron` 工具自动化任务，或在 Unix 系统的启动和关闭过程中使用（其中守护进程和服务在 init 脚本中定义）。


    要创建一个 shell 程序，请在你喜欢的文本编辑器中打开一个空文件。你使用什么类型的编辑器都没有关系。大多数编辑器都能完成我们现在想要的工作：编写一个 shell
    程序。但可能让你使用像 VIM 或 emacs 这样复杂的编辑器的是，你可以配置它们来识别你编写的文本并用不同的颜色对其进行高亮——包括我们将编写的文本和
    shell 命令——这可以减少学者通常会犯的错误，例如漏掉右括号 `()` 或忘记分号 `;`。


    ### 在 VIM 中高亮文本


    使用以下三个命令之一在 VIM 编辑器中开启高亮：


    `syntax enable:` 或 `sy enable:` 或 `syn enable:`


    将此设置添加到 `vimrc` 文件中很有用，以便默认安装。


    将 Unix 命令置于你创建的文件中，就像你要在命令行输入这些命令一样（参见：在 Bash 中执行命令）。这些命令可以是 shell 函数、嵌入命令、Unix
    命令等。现在给该文件起一个描述其执行任务的名称，并确保该名称不会与已有的命令冲突。为了确保这一点，shell 程序的名称通常以 `.sh` 结尾，但这并阻止系统中存在与你选择的名称相同的其他代码。你可以使用
    `which` 或 `whereis` 等文件和程序搜索命令在系统中搜索具有相同名称的文件或代码：


    ```

    which -a script_name


    whereis script_name


    locate script_name

    ```


    ```

    script1.sh

    ```

