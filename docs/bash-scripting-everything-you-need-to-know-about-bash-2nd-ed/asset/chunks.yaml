    # Chapter VII


    # Writing interactive Bash programs


    In this section we will learn how to enter user feedback and how to ask the user
    to enter data, usually using the echo / read structure, and discuss how files
    can be used as inputs and outputs using file descriptors and redirection, and
    how this can be combined with input from the user. This section also emphasizes
    the importance of providing detailed messages to those who use our shell programs.
    It is better to give too much information than to write a brief documentation.


    Here documents are a type of shell structure that allows creating lists and saving
    options for users, and can also be used to perform interactive tasks in the background
    without interference.


    -View user messages in Bash


    The difference between interactive and non-interactive programs in Bash, a simple
    explanation of the command echo.


    -Get user input in Bash


    An explanation of the read command, file descriptions, requesting user input,
    Here documents and their use cases, as well as redirection and their various states.


    ## View user messages in Bash


    ### Interactive or non-interactive programs?


    Some shell scripts work without any user intervention and are called non-interactive
    programs. Some of the advantages of these programs are that they work unexpectedly
    every time, and can work in the background as well. However, other shell programs
    need user input or you need to print messages to the user while they are working.
    This type of program has advantages as well. Turn it on.


    Do not be lazy about writing comments in your programs while writing interactive
    programs. , So be sure to put messages telling the user, for example, to wait
    for the output to appear because the program is now calculating. Whenever possible,
    try to provide an estimate of the length of the ongoing process or how long the
    user should wait.


    In the case of an input request from the user, it is preferable to give clear
    and transparent information about the data that you would like the user to enter.


    The commands you use to print your comments to the user are echo and printf, and
    we''ll discuss some examples below, although you may already be accustomed to
    using echo.


    ### Use the echo command


    The echo command outputs two arguments separated by spaces and ends with the new
    line character, and the return state is always zero. The echo command also takes
    a few options:


    e-: Explains smuggled characters with a slash character (see escape characters
    in the character quote chapter).


    n-: Trailing new line will eventually stop working.


    Here''s an example of adding comments in which we will use two examples from the
    command-line arguments section, separating the advanced uses of the conditional
    if statement:


    hsoub ~ / test> cat penguin.sh


    #! / bin / bash


    # (Tux) This program allows you to serve food to the penguin


    #The penguin will only be happy when a fish is given, and we''ve added a little
    fun by adding some other animals


    if ["$ menu" == "fish"]; then


      if ["$ animal" == "penguin"]; then


        echo -e "Hmmmmmm fish ... Tux is happy! \ n"


      elif ["$ animal" == "dolphin"]; then


        echo -e "\ a \ a \ aPweetpeettreetppeterdepweet! \ a \ a \ a \ n"


      else


        echo -e "* prrrrrrrt * \ n"


      fi


    else


      if ["$ animal" == "penguin"]; then


        echo -e "Tux doesn''t like that. Tux wants fish! \ n"


        exit 1


      elif ["$ animal" == "dolphin"]; then


        echo -e "\ a \ a \ a \ a \ a \ a \ aPweepwishpeeterdepweet! \ a \ a \ a"


        exit 2


      else


        echo -e "Will you read this sign ?! Don''t feed the" $ animal "s! \ n"


        exit 3


      fi


    fi


    michel ~ / test> cat feed.sh


    #! / bin / bash


    # penguin.sh This program behaves according to the exit status given by a program


    if ["$ #"! = "2"]; then


      echo -e "Usage of the feed script: \ t $ 0 food-on-menu animal-name \ n"


      exit 1


    else


      export menu = "$ 1"


      export animal = "$ 2"


      echo -e "Feeding $ menu to $ animal ... \ n"


      feed = "/ nethome / anny / testdir / penguin.sh"


      $ feed $ menu $ animal


    result = "$?"


      echo -e "Done feeding. \ n"


    case "$ result" in


      1)


        echo -e "Guard: \" You''d better give''m a fish, less they get violent ...
    \ "\ n"


        ;;


      2)


        echo -e "Guard: \" No wonder they flee our planet ... \ "\ n"


        ;;


      3)


        echo -e "Guard: \" Buy the food that the Zoo provides at the entry, you ***
    \ "\ n"


        echo -e "Guard: \" You want to poison them, do you? \ "\ n"


        ;;


      *)


        echo -e "Guard: \" Don''t forget the guide! \ "\ n"


        ;;


      esac


    fi


    echo "Leaving ..."


    echo -e "\ a \ a \ aThanks for visiting the Zoo, hope to see you again soon! \
    n"


    michel ~ / test> feed.sh apple camel


    Feeding apple to camel ...


    Will you read this sign ?! Don''t feed the camels!


    Done feeding.


    Guard: "Buy the food that the Zoo provides at the entry, you ***"


    Guard: "You want to poison them, do you?"


    Leaving ...


    Thanks for visiting the Zoo, hope to see you again soon!


    hsoub ~ / test> feed.sh apple


    Usage of the feed script: ./feed.sh food-on-menu animal-name


    See escape characters for more detailed explanations.


    ## Get user input in Bash


    ### Use the read command


    The read command is the complementary command for the echo and printf commands,
    and its syntax is as follows:


    read [options] NAME1 NAME2 ... NAMEN


    One line is read from the standard input or from a file descriptor entered as
    an argument for the u- option, the first word of the line is assigned to the first
    name NAME1, the second to the second name NAME2 and so on, then the remaining
    words and their intervening seperators are assigned to The last name is NAMEN,
    but if the words read from the income stream are less than the names, null values
    are assigned to those names.


    Characters are used in the value of the IFS variable to separate the input line
    into words or tokens. See Split words in the expansions chapter in Bash. The backslash
    character may be used to follow the line and to remove any special meaning for
    the next character. Also, if no name is entered, the read line is assigned to
    the REPLY variable.'
