    \ shell 传递不同的消息，以便根据子进程的失败或成功采取不同的行动。如果未给 `exit` 命令提供参数，父 shell 将使用当前值作为 `$?`\
    \ 变量。\n\n这是一个 `penguin.sh` 的示例，通过细微修改进行解释，将其退出状态发送到 `feed.sh` 所在的父 shell：\n\n\
