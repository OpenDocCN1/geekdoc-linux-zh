  trans: "\n\n这意味着你与 Shell 之间没有交互，也就是说，它不会等待你输入任何命令，而是执行保存在文件中的命令，并在到达文件末尾时停止工作，这被称为脚本（script）。两个基本概念是：\n\
    \n## 命令 (Commands)\n\n它是一个你可以通过输入其名称并按回车来运行的程序。例如：`date` 命令显示日、日期、小时。注意 `$` 提示符重新出现，这表示程序已执行完毕。\n\
    \n另一个例子是 `who` 命令，它显示系统所有用户的名称，外还包含一些信息。命令有几种类型，即：简单命令、复杂命令。\n\n### 简单命令 (Simple\
    \ commands)\n\n从名字就能很易地看出它是简单的，只包含程序的名称，例如之前的两个 `date`、`who`，以及我之后将提到的很多命令。\n\n\
    ### 复杂命令 (Complex commands)\n\n一个简单的程序名加上一个或多个参数。为了清楚起见举个例子：\n\n如所述，我们为你提供了所有用户及其访问系统时间的信息，但通过输入它：你正在操作的用户名和你访问系统的时间。所以\
    \ `am` 和 `i` 是干扰 `who` 调整其行为的中间环节。大多数现有命令都接受许多改变默认行为的参数，我们稍后会看到。\n\n### 复合命令 (Compound\
    \ commands)\n\n它们是结合了简单命令和复杂命令的命令。通过分号分隔；例如命令：`date;` `who am i;`\n\n这个复合命令先执行简单命令\
    \ `date`，然后执行复杂命令 `who am i`，命令之间使用分号分隔。如果没有放置，即命令写成：`date who am i` 将发生错误……并且不会执行错误消息，因为我认为这个解释器认为\
    \ `date` 是顺序或程序，而 `who am i` 是它的参数，这是错误的。\n\n值得提到的是，你可以在任何命令末尾写分号，无论是复杂命令还是简单命令，例如命令：`date;`\
    \ 结果与 `date` 相同。\n\n关于顺序的最后一点说明：\n\n在编写任何命令并在 shell 执行之前，要确保它执行的命令或程序位于特定的路径 `PATH`\
    \ 中，如果没有，则会给你 `command not found` 的错误。\n\n## 什么是 shell 脚本 (What is shell script?)\n\
    \n它是一个包含一组用于实现特定目的的文件，shell 以交互方式执行它们，你通过以下示例看到定义：例如，工具箱包含工具（螺丝刀、螺丝、木头、锤子……等）。它可以制造椅子、桌子、柜子等。使用相同的工具，但通过特定的组合，它可以制造任何想要的东西。\n\
    \n这个例子与 shell 脚本非常相似。要构建你想要的任何东西，你必须使用正确的工具并调用它们命令或程序，即上面提到的。\n\n编写第一个 shell 脚本：打开任何文档\
    \ - 文本文件 - 输入以下内容：\n\n```\ndate; who;\n```\n\n以任何名称保存文件并将其命名为 `sudanix`\n\n现在你运行这个脚本，输入：\n\
    \n```\n/bin/bash sudanix\n```\n\n现在结果将会出现，即 `date` 命令的输出和 `who` 命令的输出。\n\n将脚本转换为可执行脚本？？\n\
    \n这是为了让文件变得可执行而最重要的步骤之一……任何我们只通过名称执行。如下：\n\n通过命令将文件转换为可执行文件\n\n```\nchmod a +x\
    \ ./sudanix\n```\n\n但我们必须确保将使用哪种 shell。因为我们不能保证所有的 shell 用户都在 `bash` 上工作，我们将在脚本开头添加此行。\n\
    \n```\n#!/bin/bash\n```\n\n注意这一行位于脚本的开头。特别是在第一行！！否则，脚本将如下：\n\n```\n#!/bin/bash\n\
    date; who;\n```\n\n现在要执行此脚本，按以下格式编写它，并注意要在脚本所在的文件夹中。\n\n```\n./sudanix\n```\n\n\
    `bash` shell 是 GNU 系统的默认 shell。\n\nGNU 项目，参考 GNU's Not UNIX（GNU 并不是 Unix），为管理\
    \ Unix 类系统提供工具，这些符合 Unix 标准的免费操作系统。这些工具之一是 `bash`，这种 shell 与 Stephen Bourne 编写的第一个\
    \ `sh` shell 相对应，并具有 Korn shell 和 C shell 的有用属性——它们分别缩写 `ksh` 和 `csh`。它被设计为符合\
    \ IEEE POSIX P1003.2 / ISO 9945.2 的 shell 和软件标准。\n\n它还具有改进的、用于编程和交互式使用的 `sh`，例如命令行编辑、以前命令的无限历史记录、作业控制和\
    \ shell 函数、别名（Aliases）、无限大小的索引数组以及从 2 到 64 任意进制的术整数。`bash` 还可以不经修改地处理大多数 `sh`\
    \ 文本脚本。\n\nBash 倡议与 GNU 的其他项目一样，最初是为了保留使用、研究、复制、修改和重新发布程序的自由，并推广和传播这些权利，因为这些是创造力的催化剂。在任何其他巧合中。\n\
    \n## 优势仅在 bash 中找到\n\n### 调用 (Invocation)\n\n有许多你可以使用的多字符选项，还可以使用 shell 中默认的 `set`\
    \ 命令设置单字符选项。在本文档中，我们将展示一些其他流行的选项，你可以在 info 指南中找到完整列表，在 features 之后是 Invoking。\n\
    \n### Bash 中的启动文件 (Startup files)\n\n启动文件是 Bash 在启动时读取并执行的脚本。以下解释说明了启动 shell 的不同方式，以及相应读取的启动文件。\n\
    \n#### 作为交互式登录 shell 调用 (Invoke as an interactive shell, or with login)\n\n这里的交互式意味着你可以输入命令，shell\
    \ 不会因为激活而工作。“登录 shell”意味着你在通过系统身份验证后进入 shell，通常通过输入用户名和密码。\n\n读取文件：\n\n`/etc/profile`\n\
    `~/.bash_profile`, `~/.bash_login`, 或 `~/.profile`: 读取第一个可读文件。\n`~/.bash_logout`\
    \ 在注销时读取。\n\n如果配置文件存在无法读取，将打印错误消息；如果文件不存在，bash 将查找下一个文件。\n\n#### 作为非登录交互式 shell\
    \ 调用 (Call as an interactive shell without logging in)\n\n非登录 shell 意味着你不需要通过系统，例如通过点击图标或列表项打开终端，它是非登录\
    \ shell。\n\n读取文件：\n\n`~/.bashrc`\n\n此文件通常在 `bash_profile` 中被引用：\n\n```bash\nif\
    \ [ -f ~/.bashrc ]; then\n    . ~/.bashrc\nfi\n```\n\n#### 调用是交互 (The call is\
    \ interactive)\n\n所有的文本代码使用非交互式 shell，并被编程执行特定任务，否则无法编程执行其他任务。\n\n读取文件：\n\n由 `BASH_ENV`\
    \ 选择。PATH 不在此文件中用于搜索。如果你想使用它，请指定完整路径和文件名。\n\n#### 从 sh 内部顺序调用 (Call by order from\
    \ within sh)\n\nBash 尝试表现像 Steve Bourne 编写的旧 sh 软件，同时尝试符合 POSIX 标准。\n\n读取文件：\n\
    \n`/etc/profile`\n`~/.profile`\n\n`ENV` 变量可以引用额外的启动信息。\n\n### POSIX 模式 (POSIX\
    \ mode)\n\n该选项通过 `set` 命令激活：\n\n```bash\nset -o posix\n```\n\n或通过带有 `- posix`\
    \ 选项调用 bash 程序，bash 将尝试符合 shell POSIX 标准。此外，初始化 `POSIXLY_CORRECT` 变量产生相同的结果。\n\
    \n读取文件：\n\n由 `ENV` 变量指定。\n\n### 远程分页 (Remote paging)\n\nbash 使用 `rshd` 命令启动时读取的文件：\n\
    \n`~/.bashrc`\n\n避免使用 r-tools\n\n"
