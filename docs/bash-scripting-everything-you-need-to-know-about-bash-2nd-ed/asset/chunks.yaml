    Bash 文档。


    ### 区域 (Locales)


    当文本前面有一个带有 `$` 符号的双引号时，它将根据区域设置（Locale）进行翻译，翻译后的文本也会放在双引号之间。如果区域为 `C` 或 `POSIX`，则
    `$` 符号被忽略。


    ## Bash 中的扩展


    ### 扩展的大括号 {}


    方括号的扩展是一种可以创建任意字符串的机制。执行方括号扩展的模式是一个可选的前导部分，后跟一系列由逗号分隔的文本。`{}`。接着是一个可选的后缀。初始化置于括号内每个文本的开头——在扩展之后——然后脚注也会从左到右附加到每个文本的末尾。


    大括号扩展可能会重叠，但这并不意味着结果可以排序，但顺序保持从左到右，请参见以下示例进行说明：


    ```

    hsoub ~> echo sp {el, il, al} l

    spell spill spall

    ```


    方括号的扩展在任何其他扩展之前执行，并且结果会保留与其它扩展具有特殊含义的字符，因为这种扩展完全是文本的。此外，为了避免不一致，文本 `} $` 对于扩展方括号是无效的。


    方括号的扩展必须包含互不加引号的方括号和一个逗号，其中至少一个不在引号内，且与该公式不同，任何方括号的扩展将保持原样。


    ### 长度扩展 (~)


    如果一个单词以没有引号的点 `~` 开头，则到第一个没有引号的斜杠 `/` 之前的所有字符（如果没有没有引号的斜杠，则是所有字符）都被视为术语的介绍（波浪前缀）。如果波浪前缀是登录名，如果没有前缀字符包含在引号中，如果该登录名为空，则持续时间替换为
    `HOME` 变量的值；如果 `HOME` 变量未设置任何值，则使用执行 shell 的用户主目录，否则将前景替换为与登录名相关的家目录。


    如果前景是 `+ ~`，则 `PWD` 变量的值被取代。如果前景中点之后的字符是一个数字 `N`（可能）且前面有 `+` 或 `-`，则前景被替换为目录栈（Directory
    Stack）中的相应元素，并将作为前景中点之后的字符调用的 `dirs` 命令的参数显示。如果点之后的字符是一个前面没有正负号的数字，则假设该数字是正数。同样地，如果登录名无效或扩展失败，该单词将保持原样。


    变量赋值在以下之后进行检查：`:` 或 `=` 直接用于未在引号中的前缀，在这些情况下持续时间会被扩展，因此带有持续时间字符的文件名可以用在具有 `PATH`、`MAILPATH`
    和 `CDPATH` 变量的赋值中，并且巧合会设置扩展值。


    示例：


    ```

    hsoub ~> export PATH = "$ PATH: ~ / testdir"

    ```

    `Testdir / ~` 将扩展为 `$ HOME / testdir`，所以如果 `$ HOME` 是 `var / home / hsoub /`，则
    `var / home / hsoub / testdir /` 文件夹将被添加到 `PATH` 变量的内容中。


    系数和变量扩展


    `$` 符号前面是参数扩展、命令替换和算术扩展。要扩展的参数名称或其符号可以位于方括号中且是可选的，但它保护了将被扩展的变量免受后续字符的影响。它是名称的一部分。当使用方括号时，弧的第二个端点是第一个
    `{`（未被反斜杠 `\` 逃入），位于引号文本之间、嵌入的算术扩展内部、替换的命令内部或系数扩展中。


    参数扩展的基础像是 `${PARAMETER}`，`PARAMETER` 的值会被替换，当 `PARAMETER` 后面跟着一个可以操作的字符时，括号是必要的。


    如果 `PARAMETER` 的第一个参数是感叹号，Bash 将使用 `PARAMETER` 的剩余部分作为变量名，而不是 `PARAMETER` 本身。这被称为间接扩展，与在简单情况下发生的直接扩展不同，例如上一个情况：


    ```

    hsoub ~> echo $ SHELL

    / bin / bash

    ```


    以下示例用于间接扩展：


    ```

    hsoub ~> echo $ \! *}

    NNTPPORT NTPSERVER NPX_PATH

    ```


    注意这与 `echo $ N` 不同，`${VAR= value}` `$` 结构允许在变量尚未创建时创建它，请参见以下示例进行说明：


