    fi


    hsoub ~ / test> leaptest.sh


    Type the year that you want to check (4 digits), followed by [ENTER]:


    2000


    2000 is a leap year.


    ### Request user input


    The following example shows how inductors are used to explain what a user should
    enter:


    hsoub ~ / test> cat friends.sh


    #! / bin / bash


    # This program saves your address book up to date


    friends = "/ var / tmp / michel / friends"


    echo "Hello," $ USER ". This script will register you in Hsoub''s friends database."


    echo -n "Enter your name and press [ENTER]:"


    read name


    echo -n "Enter your gender and press [ENTER]:"


    read -n 1 gender


    echo


    grep -i "$ name" "$ friends"


    if [$? == 0]; then


      echo "You are already registered, quitting."


      exit 1


    elif ["$ gender" == "m"]; then


      echo "You are added to Hsoub''s friends list."


      exit 1


    else


      echo -n "How old are you?"


      read age


      if [$ age -lt 25]; then


        echo -n "Which color of hair do you have?"


        read color


        echo "$ name $ age $ color" >> "$ friends"


        echo "You are added to Hsoub''s friends list. Thank you so much!"


      else


        echo "You are added to Hsoub''s friends list."


        exit 1


      fi


    fi


    michel ~ / test> cp friends.sh / var / tmp; cd / var / tmp


    michel ~ / test> touch friends; chmod a + w friends


    michel ~ / test> friends.sh


    Hello, hsoub. This script will register you in Hsoub''s friends database.


    Enter your name and press [ENTER]: michel


    Enter your gender and press [ENTER]: m


    You are added to Hsoub''s friends list.


    hsoub ~ / test> cat friends


    Note that the output is not neglected here, the program only stores information
    about the people that the user is interested in, but it will always tell you that
    you have been added to the list, unless you are already there. Any user can now
    start the program:


    [anny @ octarine tmp] $ friends.sh


    Hello, anny. This script will register you in Hsoub''s friends database.


    Enter your name and press [ENTER]: anny


    Enter your gender and press [ENTER]: f


    How old are you? 22


    Which color of hair do you have? black


    You are added to Hsoub''s friends list.


    Your friends list will look soon after this:


    tille 24 black


    anny 22 black


    katya 22 blonde


    maria 21 black


    --output omitted--


    This situation is not ideal since anyone can modify the user''s computer files
    (but cannot delete them), and you can solve this problem using the special access
    modes on the program file, see SUID and SGID in a guide to Linux.


    ### Redirection and file descriptors


    You may know from the simple use of shell that the input and output of an object
    may be redirected before execution using special characters interpreted by shell
    - redirect operators - and redirection can also be used to open and close files
    for the current shell execution environment.


    Redirection may also occur in a shell script so that it can receive input from
    a file, for example, or send output to it. The user can review the output file
    later, and that output file can be used as input for another program.


    The inputs and outputs of a file can be completed using integer handles that monitor
    all open files of a process. These numerical values are known as file descriptors.
    And 2 respectively, and those numbers and corresponding devices are saved. Bash
    shell can also take TCP and UDP ports on networked hosts as file descriptions.


    The following example demonstrates how saved file attributes point to physical
    devices:


    hsoub ~> ls -l / dev / std *


    lrwxrwxrwx 1 root root 17 Oct 2 07:46 / dev / stderr -> ../proc/self/fd/2


    lrwxrwxrwx 1 root root 17 Oct 2 07:46 / dev / stdin -> ../proc/self/fd/0


    lrwxrwxrwx 1 root root 17 Oct 2 07:46 / dev / stdout -> ../proc/self/fd/1


    hsoub ~> ls -l / proc / self / fd / [0-2]


    lrwx ------ 1 hsoub hsoub 64 Jan 23 12:11 / proc / self / fd / 0 -> / dev / pts
    / 6


    lrwx ------ 1 hsoub hsoub 64 Jan 23 12:11 / proc / self / fd / 1 -> / dev / pts
    / 6


    lrwx ------ 1 hsoub hsoub 64 Jan 23 12:11 / proc / self / fd / 2 -> / dev / pts
    / 6


    Note that each process has its own view of files in proc / self / since it is
    a symbolic link to <proc / <process_ID /, you should probably consider info MAKEDEV
    and info proc for more information about proc / sub folders and how your system
    processes file descriptors Standard for each process underway.


    The following steps are followed in order when you execute an order:


        If the standard output of a previous command is entered into the standard
    input of the current command via a pipe, the file descriptor proc / <current_process_ID>
    / fd / 0 is updated to target the same unknown pipe as proc / <previous_process_ID>
    / fd / 1.


        If the standard output of the current command is entered into the standard
    input of the next command via a pipe, the file descriptor proc / <current_process_ID>
    / fd / 1 is updated to target another unknown pipe.


        The redirection of the current command is handled from left to right.


        Forwarding "N> & M" or "N <& M" after a command has the same effect as creating
    or updating the proc / self / fd / N symbolic link with the same target as the
    proc / self / fd / M link.


        The "N> file" and "N <file" redirects have the effect of creating or updating
    the proc / self / fd / N symbolic link with the target file.


        Closing the file descriptor "- & <N" has the effect of deleting the symbolic
    proc / self / fd / N.


        The current command is only executed now.


    Not many changes occur when you execute a program from the command line because
    the sub-shell will use the same file descriptors as the parent shell. If the parent
    shell does not exist, as in the case of the command using the cron tool, the standard
    file descriptors are pipes or any temporary files unless A redirect image is used.
    See the following example that shows the output of a simple at program:


    hsoub ~> date


    Fri Jan 24 11:05:50 CET 2003


    hsoub ~> at 1107


    warning: commands will be executed using (in order)


    a) $ SHELL b) login shell c) / bin / sh


    at> ls -l / proc / self / fd /> /var/tmp/fdtest.at


    at> <EOT>


    job 10 at 2003-01-24 11:07


    hsoub ~> cat /var/tmp/fdtest.at


    total 0


    lr-x ------ 1 michel michel 64 Jan 24 11:07 0 -> / var / spool / at /! 0000c010959eb
    (deleted)


    l-wx ------ 1 michel michel 64 Jan 24 11:07 1 -> /var/tmp/fdtest.at


    l-wx ------ 1 michel michel 64 Jan 24 11:07 2 -> / var / spool / at / spool /
    a0000c010959eb


    lr-x ------ 1 michel michel 64 Jan 24 11:07 3 -> / proc / 21949 / fd


    ### Redirect errors


    It is clear from the examples above that you can add inputs and outputs to a program
    - see file inputs and outputs below - but some may forget to redirect errors -
    outputs that we may need later. Perhaps if you are lucky you will be sent errors
    to know the reasons for the failure of the program, but if you do not have a share
    in that luck errors cause the failure of your program, but you can not correct
    them because they were not sent to you or picked up elsewhere.


    Note that the order of precedence for error routing is very important, for example,
    this will direct the standard output of the ls command to an unaccessible-in-spool
    file in var / tmp /:


    ls -l * 2> / var / tmp / unaccessible-in-spool


    This will direct both the standard input and output to the spoollist file:


    ls -l *> / var / tmp / spoollist 2> & 1'
