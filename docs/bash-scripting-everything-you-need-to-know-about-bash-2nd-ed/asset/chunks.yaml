    # Introduction


    Is a program that works to receive commands from you and then ask the kernel to
    execute these commands. Ie acts as an intermediary between you and the operating
    system or in other words it represents the outer layer or interface of the system,
    it takes orders from you and gives you the result. Then it shows the inductor
