    In the previous example, $ 1 referred to the first operand, $ 2 to the second,
    and so on, and stored the number of arguments in # $. See Using the exit statement
    with if to better print usage messages.


    Test for a file


    This test is used in many programs to ensure the implementation of these programs.
    There is no point in calling a program if you know it will not be implemented:


    #! / bin / bash


    # This program gives data about a file.'
