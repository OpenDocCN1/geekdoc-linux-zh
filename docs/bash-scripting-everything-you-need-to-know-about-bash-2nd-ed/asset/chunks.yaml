  raw: 'The following command directs the standard output only to the destination
    file because the standard error was copied to the standard output before the output
    was redirected.


    Errors are usually directed to dev / null / when you make sure that the user does
    not need them, you''ll find hundreds of examples in your system''s startup programs.
    Bash allows redirecting both the standard output and the standard error to the
    file whose name is the result of the FILE expansion on this image: File <&, which
    is equivalent to the FILE 2> & 1 <structure used in the previous examples. This
    is also combined with a redirect to dev / null /, for example, when you want to
    execute a command without looking at the errors it will produce or the output
    it will produce.


    File input and output


    Use dev / fd /


    The dev / fd / folder contains entries with names of 0, 1, 2, and so on, and opening
    the dev / fd / N / file is equivalent to repeating the N file descriptor, even
    if your system has dev / stdin /, dev / stdout / and dev / / stderr, you''ll see
    that these are rewarded dev / fd / 0, dev / fd / 1 and dev / fd / 2 respectively.


    The main use of dev / fd / files is a coincidence, and this mechanism allows programs
    that use pathname arguments to handle both standard input and standard output
    in the same way as other path names. If dev / fd / is not available in the system,
    you should find a way to overcome the problem, for example by using a dash - to
    illustrate that the program should read from a tube, see the following example:


    hsoub ~> filter body.txt.gz | cat header.txt - footer.txt


    This text is printed at the beginning of each print job and thanks the sysadmin


    for setting us up such a great printing infrastructure.


    Text to be filtered.


    This text is printed at the end of each print job.


    The Read command in shell programs


    The following example shows how to switch between file and command line entries:


    hsoub ~ / testdir> cat sysnotes.sh


    #! / bin / bash


    # This script makes an index of important config files, puts them together in


    # a backup file and allows for adding comment for each file.


    CONFIG = / var / tmp / sysconfig.out


    rm "$ CONFIG" 2> / dev / null


    echo "Output will be saved in $ CONFIG."


    # create fd 7 with same target as fd 0 (save stdin "value")


    exec 7 <& 0


    # update fd 0 to target file / etc / passwd


    exec </ etc / passwd


    # Read the first line of / etc / passwd


    read rootpasswd


    echo "Saving root account info ..."


    echo "Your root account info:" >> "$ CONFIG"


    echo $ rootpasswd >> "$ CONFIG"


    # update fd 0 to target fd 7 target (old fd 0 target); delete fd 7


    exec 0 <& 7 7 <& -


    echo -n "Enter comment or [ENTER] for no comment:"


    read comment; echo $ comment >> "$ CONFIG"


    echo "Saving hosts information ..."


    # first prepare a hosts file not containing any comments


    TEMP = "/ var / tmp / hosts.tmp"


    cat / etc / hosts | grep -v "^ #"> "$ TEMP"


    exec 7 <& 0


    exec <"$ TEMP"


    read ip1 name1 alias1


    read ip2 name2 alias2


    echo "Your local host configuration:" >> "$ CONFIG"


    echo "$ ip1 $ name1 $ alias1" >> "$ CONFIG"


    echo "$ ip2 $ name2 $ alias2" >> "$ CONFIG"


    exec 0 <& 7 7 <& -


    echo -n "Enter comment or [ENTER] for no comment:"


    read comment; echo $ comment >> "$ CONFIG"


    rm "$ TEMP"


    hsoub ~ / testdir> sysnotes.sh


    Output will be saved in /var/tmp/sysconfig.out.


    Saving root account info ...


    Enter comment or [ENTER] for no comment: hint for password: blue lagoon


    Saving hosts information ...


    Enter comment or [ENTER] for no comment: in central DNS


    hsoub ~ / testdir> cat /var/tmp/sysconfig.out


    Your root account info:


    root: x: 0: 0: root: / root: / bin / bash


    hint for password: blue lagoon


    Your local host configuration:


    127.0.0.1 localhost.localdomain localhost


    192.168.42.1 tintagel.kingarthur.com tintagel


    in central DNS


    ### Close the file descriptors


    It is good to get used to attaching a file descriptor when it is no longer needed,
    since the sub-processes inherit the open file descriptors.


    exec fd <& -


    In the previous example, the file descriptor 7, which was assigned to standard
    input, was closed each time a user needed access to the physical device of the
    standard input, which was often the keyboard. See the following example showing
    only the standard error redirected to a pipe:


    hsoub ~> cat listdirs.sh


    #! / bin / bash


    # This program prints the standard output unchanged, while the standard error
    is drawn


    # awk for processing with


    INPUTDIR = "$ 1"


    # fd 6 targets fd 1 target (console out) in current shell


    exec 6> & 1


    # fd 1 targets pipe, fd 2 targets fd 1 target (pipe),


    # fd 1 targets fd 6 target (console out), fd 6 closed, execute ls


    ls "$ INPUTDIR" / * 2> & 1> & 6 6> & - \


    # Closes fd 6 for awk, but not for ls.


    | awk ''BEGIN {FS = ":"} {print "YOU HAVE NO ACCESS TO" $ 2}'' 6> & -


    # fd 6 closed for current shell


    exec 6> & -


    Documents Here


    Your program may need to address other programs that require input, and the document
    here provides a way to read the shell from the current source until you find the
    line that contains only the search text (with no blank spaces followed by it).
    The result is that you do not need to communicate with separate files, all you
    have to do is use special chars, and the program will look better than if you
    used a series of echo commands:


    hsoub ~> cat startsurf.sh


    #! / bin / bash


    # This program offers an easy way to choose between browsers


    echo "These are the web browsers on this system:"


    # here Start a document


    cat << BROWSERS


    mozilla


    links


    lynx


    konqueror


    opera


    netscape


    BROWSERS


    # here Document finished


    echo -n "Which is your favorite?"


    read browser


    echo "Starting $ browser, please wait ..."


    $ browser &


    hsoub ~> startsurf.sh


    These are the web browsers on this system:


    mozilla


    links


    lynx


    konqueror


    opera


    netscape


    Which is your favorite? opera


    Starting opera, please wait ...


    Although we are talking about "document" here, it should be in the same program
    file. Here''s an example that automatically installs a package, although you often
    have to confirm the installation:


    #! / bin / bash


    # yum This program automatically installs packages using.


    if [$ # -lt 1]; then


            echo "Usage: $ 0 package."


            exit 1


    fi


    yum install $ 1 << CONFIRM


    y


    CONFIRM


    The previous example works like this, where the program answers y automatically
    when [Is this ok [y / N] appears:


    [root @ hsoub bin] # ./install.sh tuxracer


    Gathering header information file (s) from server (s)


    Server: Fedora Linux 2 - i386 - core


    Server: Fedora Linux 2 - i386 - freshrpms


    Server: JPackage 1.5 for Fedora Core 2


    Server: JPackage 1.5, generic


    Server: Fedora Linux 2 - i386 - updates


    Finding updated packages


    Downloading needed headers


    Resolving dependencies


    Dependencies resolved


    I will do the following:


    [install: tuxracer 0.61-26.i386]


    Is this ok [y / N]: EnterDownloading Packages


    Running test transaction:


    Test transaction complete, Success!


    tuxracer 100% done 1/1


    Installed: tuxracer 0.61-26.i386


