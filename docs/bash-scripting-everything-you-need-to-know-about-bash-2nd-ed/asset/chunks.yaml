    ### 双引号


    双引号用于保留其之间所有字符的字面值，但 `$` 符号、单反引号（`` ` ``）和反斜杠除外。


    `$` 美元符号和单反引号 `` ` `` 在双引号内保留它们原有的功能。


    反斜杠在引号内不保留其原有功能，除非它后面跟着 `$`、`"`、`\` 或换行符；如果反斜杠后面跟着其中之一，反斜杠将从输入中省略。它们会被原样保留供解释器处理。


