  trans: "\n\n如果通过登录选项交互式地调用 `Bash`，它会读取 `/etc/profile` 中的指令；如果作为 `sh` 调用，这些指令通常会设置\
    \ `PATH`、`USER`、`MAIL`、`HOSTNAME`、`HISTSIZE` 变量，这些都是 shell 变量。\n\n`/etc/profile`\
    \ 中的 `umask` 值在某些系统中也会设置；在另一些系统中，此文件包含指向其他配置文件的指针，例如：\n\n- `/etc/inputrc` 文件，它是\
    \ `readline` 命令的系统级配置文件，你可以在其中配置命令行的响铃样式（bell style）。\n- `/etc/profile.d/` 文件夹，包含在系统层级设置特定程序行为的文件。\n\
    \n你想要应用到系统中所有用户的设置必须存在于该 `/etc/profile` 文件中，内容可能类似于所示：\n\n```bash\n# /etc/profile\n\
    \n# 全局环境和启动程序，用于登录设置\n\nPATH = $PATH:/usr/X11R6/bin\n\n# 默认不产生核心文件\n\nulimit -S\
    \ -c 0> /dev/null 2>&1\n\nUSER=`id -un`\n\nLOGNAME = $USER\n\nMAIL = \"/var/spool/mail/$USER\"\
    \n\nHOSTNAME=`bin/hostname`\n\nHISTSIZE = 1000\n\n# 键盘、响铃、显示样式：readline 配置文件：\n\
    \nif [-z \"$INPUTRC\" -a ! -f \"$HOME/.inputrc\" ]; then\n    INPUTRC=/etc/inputrc\n\
    fi\n\nPS1 = \"\\u@\\h \\W\"\n\nexport PATH USER LOGNAME MAIL HOSTNAME HISTSIZE\
    \ INPUTRC PS1\n\n# 为特定程序的初始化文件 (ls, vim, less, ...)\n\nfor i in /etc/profile.d/*.sh;\
    \ do\n    if [-r \"$i\"]; then\n        . $i\n    fi\ndone\n\n# 程序初始化设置\n\nsource\
    \ /etc/java.conf\n\nexport NPX_PLUGIN_PATH=\"$JRE_HOME/plugin/ns4plugin:/usr/lib/netscape/plugins\"\
    \n\nPAGER=\"/usr/bin/less\"\n\nunset i\n```\n\n此配置文件除了了一些基础 shell 变量外，还设置了任何运行\
    \ Java 或在浏览器中运行 Java 应用程序的用户所需的变量。请参阅 `Bash` 中的变量。\n\n更多关于上一个示例中使用的 `if` 条件，请参阅\
    \ `Bash` 中的条件结构；关于讨论如 `for` 等迭代循环的任务，请参阅 `Bash` 中的重复任务。\n\n`Bash` 源码包含了通用或个人使用的示例配置文件，这些文件（如上述示例中的文件）在用于你的环境之前，会经过多次更改。\n\
    \n### 文件 `/etc/bashrc/`\n\n如果你在具有不同类型 shell 的系统上工作，将 `Bash` 配置文件放在此文件中可能是最好的，例如，其他\
    \ shell —— Bourne shell 会读取 `/etc/profile` 文件。\n\n通过分离不同类型 shell 的配置文件，可以避免不理解\
    \ `Bash` shell 语法的 shell 产生的错误。在登录时进行 shell 实例化。\n\n你可能会发现系统中的 `/etc/profile`\
    \ 文件仅包含 shell 环境和程序启动设置，而 `/etc/bashrc` 包含了 shell 函数的系统级定义及其替代命令。`/etc/bashrc`\
    \ 文件也可以在 `/etc/profile` 文件或用户的 shell 配置文件中引用。\n\n源码包含了 `bashrc` 文件的示例，你可以在 `/usr/share/doc/bash-2.05b/startup-files/`\
    \ 中找到一个副本。以下是随 `Bash` 文档自带的 `bashrc` 文件部分内容：\n\n```bash\nalias ll='ls -l'\nalias\
    \ dir='ls -ba'\nalias c='clear'\nalias ls='ls --color'\nalias mroe='more'\nalias\
    \ pdw='pwd'\nalias sl='ls --color'\n\npskill ()\n{\n    local pid\n    pid=$(ps\
    \ -ax | grep $1 | grep -v grep | gawk '{print $1}')\n    echo -n \"killing $1\
    \ (process $pid) ...\"\n    kill -9 $pid\n    echo \"slaughtered.\"\n}\n```\n\n\
    它包含了实用的别名以及通用别名，它们确保了即使你拼写错误，输入的命令也会执行，请参阅“创建和删除替代顺序”（Creating and Deleting Alternate\
    \ Orders）。此文件还包含 `pskill` 函数，请参阅 `Bash` 中的函数以获取更多关于函数的解释。\n\n### 用户设置文件\n\n####\
    \ 在我的电脑上找不到这些文件！？\n你可能在你的家目录中找不到这些文件。\n\n#### 文件 `bash_profile/.~`\n如果你设置了个人用户环境，此文件最好用。此处的用户可以添加额外的选项或更改默认设置：\n\
    \n```bash\nwiki ~> cat .bash_profile\n```\n\n```bash\n##########################################################################\n\
    # #\n# .bash_profile 文件 #\n# #\n# 当你登录时从 bash shell 中执行。 #\n# #\n##########################################################################\n\
    \nsource ~/.bashrc\nsource ~/.bash_login\n\ncase \"$OS\" in\n  IRIX)\n    stty\
    \ sane dec\n    stty erase\n    ;;\n  # SunOS)\n  # stty erase\n  # ;;\n  *)\n\
    \    stty sane\n    ;;\nesac\n```\n\n该用户通过上述设置，除了 `bashrc` 文件外，还在不同操作系统上设置了退格键登录。以及\
    \ `bash_login`。已读取了用户特定信息。\n\n######## 文件 `bash_login/.~`\n此文件包含特定的设置，通常只在登录系统时实现。在接下来的示例中，我们将使用它在登录系统时执行。在下面的示例中，我们将使用它设置\
    \ `umask` 值并显示连接的用户列表：\n\n```bash\n##############################################################\n\
    # #\n# Bash_login 文件 #\n# #\n# 当登录时从 bash shell 中执行。 #\n# #\n# (来自 .bash_profile)\
    \ #\n##############################################################\n\n# 文件保护\n\
    umask 002 # 全局\n\n# 杂项\nw\ncal `date +%m`\n```\n\n它将读取 `date +'%Y'`\n\n#### 文件\
    \ `profile/.~`\n`profile/.~` 在不存在 `bash_profile/.~` 和 `bash_login/.~` 时被读取，这些可能包含其他\
    \ shell 访问的设置。\n\n#### `Bash`\n注意这些 shell 可能不理解 `Bash` 的语言结构。\n\n#### 文件 `bashrc/.~`\n\
    现在通常会在非登录 shell 中看到 `bashrc/.~`，因为从图形界面登录时没有发生登录过程，这使得用户不需要在多个文件中输入相同的设置。\n\n\
    在下面的 `bashrc` 文件示例中，在读取 `/etc/bashrc` 后，为特定程序指定了替代命令并设置了变量：\n\n```bash\nwiki ~>\
    \ cat .bashrc\n```\n\n```bash\n# /home/franky/.bashrc\n\n# 来源全局定义\nif [-f /etc/bashrc];\
    \ then\n    . /etc/bashrc\nfi\n\n# shell 选项\nset -o noclobber\n\n# 我的 shell 变量\n\
    export PS1=\"[\\033[1;44m\\]\\u@\\h \\W \\[\\033[0m\\]\"\nexport PATH=\"$PATH:~/bin:~/scripts\"\
    \n\n# 我的别名\nalias cdrecord='cdrecord -dev 0,0,0 -speed 8'\nalias ss='ssh octarine'\n\
    alias ll='ls -la'\n\n# mozilla 修复\nMOZILLA_FIVE_HOME=/usr/lib/mozilla\nLD_LIBRARY_PATH=/usr/lib/mozilla:/usr/lib/mozilla/plugins\n\
    MOZ_DIST_BIN=/usr/lib/mozilla\nMOZ_PROGRAM=/usr/lib/mozilla/mozilla-bin\n\nexport\
    \ MOZILLA_FIVE_HOME LD_LIBRARY_PATH MOZ_DIST_BIN MOZ_PROGRAM\n\n# 字体修复\nalias\
    \ xt='xterm -bg black -fg &'\n\n# BitchX 设置\nexport IRCNAME=\"frnk\"\n\n# 结束\n\
    wiki ~>\n```\n\n#### 文件 `bash_logout/.~`\n`bash_logout/.~` 包含了特定的注销指令。在接下来的示例中，它是一个简单的\
    \ `clear` 语句，用于在关闭后留空窗口，这对于远程连接非常有用：\n\n```bash\nwiki ~> cat .bash_logout\n```\n\
    \n```bash\n##############################################################\n# #\n\
    # Bash_logout 文件 #\n# #\n# 注销时从 bash shell 中执行命令 #\n# #\n##############################################################\n\
    \nclear\n```\n\n"
