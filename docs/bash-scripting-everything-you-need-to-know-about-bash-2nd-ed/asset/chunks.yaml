- fmt: "\nThis program has at least one vulnerability: it replaces existing files,\
    \ and the `noclobber` command is useful only when a redirect occurs. Also, the\
    \ `-b` option for the `mv` command provides more security, but that security is\
    \ useful only in case of unintentional replacement, as you can see in the following\
    \ example:\n\n```bash\n[wiki @ hsoub ~ / test] rm *\n[wiki @ hsoub ~ / test] touch\
    \ test Test TEST\n[wiki @ hsoub ~ / test] bash -x tolower.sh\n++ ls\n+ LIST =\
    \ test\nTest\nTEST\n+ [[test! = * [[: upper:]] *]]\n+ continue\n+ [[Test! = *\
    \ [[: Upper:]] *]]\n+ ORIG = Test\n++ echo Test\n++ tr A-Z a-z\n+ NEW = test\n\
    + mv -b Test test\n+ echo 'new name for Test is test'\nnew name for Test is test\n\
    + [[TEST! = * [[: Upper:]] *]]\n+ ORIG = TEST\n++ echo TEST\n++ tr A-Z a-z\n+\
    \ NEW = test\n+ mv -b TEST test\n+ echo 'new name for TEST is test'\nnew name\
    \ for TEST is test\n[wiki @ hsoub ~ / test] ls -a\n./ ../ test test ~\n```\n\n\
    The `tr` command comes as part of the `textutils` package and can perform all\
    \ kinds of conversions on files.\n\n# Chapter VI\n\n## Functions in Bash\n\nFunctions\
    \ provide an easy way to group commands that need to be executed repeatedly. Functions\
    \ are similar to mini-scripts, so they generate exit codes or return codes.\n\n\
    ### What are functions?\n\nShell functions are a way of grouping commands for\
    \ later execution using a single group name as a whole or routine. The list of\
    \ commands associated with the name of a function is executed when that function\
    \ is called as a simple command, and the function is executed within the shell\
    \ in which it was declared. The special commands that are included before the\
    \ shell functions will appear while searching for commands, and the special commands\
    \ that are included are: `break`, `:`, `.`, `continue`, `eval`, `exec`, `exit`,\
    \ `export`, `readonly`, `return`, `set`, `shift`, `trap`, `unset`.\n\n### Functions\
    \ Syntax\n\nFunctions use one of these two rules:\n\n```bash\nfunction FUNCTION\
    \ {COMMANDS; }\n```\n\nor\n\n```bash\nFUNCTION () {COMMANDS; }\n```\n\nThese rules\
    \ define a shell function called `FUNCTION`. You don't need to use a function,\
    \ but if you don't use it, you will need the parentheses `()` as you see in the\
    \ second rule.\n\n#### Common errors\n\nThe space brackets `{}` must be separated\
    \ from the content of the function between them, otherwise the content of the\
    \ function will be misinterpreted, and the function content must end with a semicolon;\
    \ or a new line.\n\n### Position coefficients in functions\n\nFunctions are similar\
    \ to miniature codes, they can accept parameters and use variables that cannot\
    \ be used outside of functions via the `local` command, and can return values\
    \ to the shell they called. Functions have a system for interpreting position\
    \ coefficients, although the position coefficients that are passed to a function\
    \ are not the same as those passed to a command or text code. When the function\
    \ is executed, its arguments become positional coefficients during execution,\
    \ and the `#` special parameter that expands to the number of position coefficients\
    \ is updated to reflect the change occurring.\n\nThe position coefficient does\
    \ not change to 0, and the `FUNCNAME` variable is set to the function name during\
    \ execution. If a `return` command is executed in a function, the function is\
    \ executed, and the command is executed after the function is called. The values\
    \ of the position coefficients and the special parameter `#` after the completion\
    \ of a function return to the values they were before the function was executed.\
    \ Here's a simple example:\n\n```bash\n[ahmad @ ahmadpc ~ / test] cat showparams.sh\n\
    #! / bin / bash\necho \"This script demonstrates function arguments.\"\necho\n\
    echo \"Positional parameter 1 for the script is $ 1.\"\necho\ntest ()\n{\necho\
    \ \"Positional parameter 1 in the function is $ 1.\"\nRETURN_VALUE = $?\necho\
    \ \"The exit code of this function is $ RETURN_VALUE.\"\n}\ntest other_param\n\
    ```\n\n```bash\n[ahmad @ ahmadpc ~ / test] ./showparams.sh parameter1\nThis script\
    \ demonstrates function arguments.\nPositional parameter 1 for the script is parameter1.\n\
    Positional parameter 1 in the function is other_param.\nThe exit code of this\
    \ function is 0.\n```\n\nNote that the return value or the exit code of a function\
    \ is often stored in a variable for probed later, and your system's init codes\
    \ use the `RETVAL` variable checking technology in such a conditional test:\n\n\
    ```bash\nif [$ RETVAL -eq 0]; then\n    <start the daemon>\n```\n\nOr, as in the\
    \ following example of the `/etc/init.d/amd` code where bash configuration features\
    \ are used:\n\n```bash\n[$ RETVAL = 0] && touch /var/lock/subsys/amd\n```\n\n\
    Commands after `&&` are only executed if the test is successful, a shorter way\
    \ to express `if / then / if`. The return code for the function is used as an\
