    ## Regular Expressions


    Regular Expression is a method that describes a set of strings. These stereotypes
    are constructed analogously to arithmetic expressions using several coefficients
    to combine smaller expressions. The smallest modular structure is the one that
    matches a single character.Most of the characters, including all letters and numbers,
    are only typical expressions that match themselves, and any special character
    (metacharacter) that has a special meaning can be quoted with a backslash.


    ## The difference between basic and extended stereotypes


    The following special characters lose their meaning in Basic Regular Expression:
    , +, {, | , (,), And use the same characters prefixed with a backslash instead?
    \, + \, {\, | \, (\,) \. See your system documentation to see which commands use
    stereotypes that support extended expressions.


    ## Grep command


