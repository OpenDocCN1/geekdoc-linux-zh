    # Chapter VI


    # Functions in Bash


    Functions provide an easy way to group commands that need to be executed repeatedly.


    Functions are similar to mini-scripts, so they generate exit codes or return codes.


    ## What are functions?


    Shell functions are a way of grouping commands for later execution using a single
    group name as a whole or routine.


    The list of commands associated with the name of a function is executed when that
    function is called as a simple command, and the function is executed within the
    shell in which it was declared. The special commands that are included before
    the shell functions will appear while searching for commands, and the special
    commands that are included are:


    break,:,., continue, eval, exec, exit, export, readonly, return, set, shift, trap,
    unset.


    ## Functions Syntax


    Functions use one of these two rules:


    function FUNCTION {COMMANDS; }


    or


    FUNCTION () {COMMANDS; }


    These rules define a shell function called FUNCTION. You don''t need to use a
    function, but if you don''t use it, you will need the parentheses () as you see
    in the second rule.


        Common errors


        The space brackets {} must be separated from the content of the function between
    them, otherwise the content of the function will be misinterpreted, and the function
    content must end with a semicolon; Or a new line.


    ### Position coefficients in functions


    Functions are similar to miniature codes, they can accept parameters and use variables
    that cannot be used outside of functions via the local command, and can return
    values to the shell they called.


    Functions have a system for interpreting position coefficients, although the position
    coefficients that are passed to a function are not the same as those passed to
    a command or text code. When the function is executed, its arguments become positional
    coefficients during execution, and the # special parameter that expands to the
    number of position coefficients is updated to reflect the change occurring.


    The position coefficient does not change to 0, and the FUNCNAME variable is set
    to the function name during execution. If a return command is executed in a function,
    the function is executed, and the command is executed after the function is called.
    The values of the position coefficients and the special parameter # after the
    completion of a function return to the values they were before the function was
    executed. Here''s a simple example:


    [ahmad @ ahmadpc ~ / test] cat showparams.sh


    #! / bin / bash


    echo "This script demonstrates function arguments."


    echo


    echo "Positional parameter 1 for the script is $ 1."


    echo


    test ()


    {


    echo "Positional parameter 1 in the function is $ 1."


    RETURN_VALUE = $?


    echo "The exit code of this function is $ RETURN_VALUE."


    }


    test other_param


    [ahmad @ ahmadpc ~ / test] ./showparams.sh parameter1


    This script demonstrates function arguments.


    Positional parameter 1 for the script is parameter1.


    Positional parameter 1 in the function is other_param.


    The exit code of this function is 0.


    [ahmad @ ahmadpc ~ / test]


    Note that the return value or the exit code of a function is often stored in a
    variable for probed later, and your system''s init codes use the RETVAL variable
    checking technology in such a conditional test:


    if [$ RETVAL -eq 0]; then


            <start the daemon>


    Or, as in the following example of the /etc/init.d/amd code where bash configuration
    features are used:


    [$ RETVAL = 0] && touch / var / lock / subsys / amd


    Commands after && are only executed if the test is successful, a shorter way to
    express if / then / if. The return code for the function is used as an exit code
    from the entire code, and you''ll see many init codes ending with something like
    exit $ RETVAL.


    ## Displaying Functions


    All known functions of the current shell can be displayed using the set command
    without options. The functions remain after they are used unless the unset command
    is used to remove them.


    [ahmad @ ahmadpc ~] which zless


    zless is a function


    zless ()


    {


       zcat "$ @" | "$ PAGER"


    }


    [ahmad @ ahmadpc ~] echo $ PAGER


    less


    This is an example of a function that is configured in a user''s shell resource
    configuration files. In general, functions are more flexible than alternative
    commands and provide a simple and easy way to configure the user environment.
    Here''s one for DOS users:


    dir ()


    {


       ls -F --color = auto -lF --color = always "$ @" | less -r


    }


    ## Recycling


    You will find many programs on your system that use functions as a structured
    way to handle a series of commands. In some Linux systems, for example, you will
    find the etc / rc.d / init / functions / profile referred to as a source in all
    init text codes. In this way you only need to write repetitive tasks once and
    generally, tasks such as checking whether a task is running, turning on or off
    a daemon, and so on. Then if you need to write those tasks back then you need
    only recycle the code and not write it from scratch.


    You can create your own etc / functions / file, which will contain all the functions
    that you use regularly on your system that may be spread over different codes.
    Once you have this file you can refer to it in any script you type by placing
    this line somewhere at the beginning of the program, and then you can rotate the
    functions afterwards:


    . / etc / functions


    ### Adjust the path


    You may find this part you have in your / etc / profile file. Here the pathmung
    function is defined and used to set the path for the root user and the rest of
    the users:


    pathmunge () {


            if! echo $ PATH | / bin / egrep -q "(^ |:) $ 1 ($ | :)"; then


               if ["$ 2" = "after"]; then


                  PATH = $ PATH: $ 1


               else


                  PATH = $ 1: $ PATH


               fi


            fi


    }


    # Path manipulation


    if [`id -u` = 0]; then


            pathmunge / sbin


            pathmunge / usr / sbin


            pathmunge / usr / local / sbin


    fi


    pathmunge / usr / X11R6 / bin after


    ### unset pathmunge


    This function takes its first argument to be the name of the path. This path is
    added to the current path if it does not already exist. The second argument determines
    whether the path will be added before or after the current PATH variable is defined.
    Only usr / X11R6 / bin / is added to the normal user path, and the root user gets
    some additional folders containing system commands. The function is canceled after
    use so that it does not remain present.


    Remote backup


    The following example is used to back up books, and supports SSH keys to open
    the connection remotely. Here you specify two functions, buplinux and bupbash,
    each creating a tar file. It is then compressed and sent to a remote server, and
    the local copy is then erased. The program is set to execute the bupbash function
    only on Sunday.


    # / bin / bash


    LOGFILE = "/ nethome / tille / log / backupscript.log"


    echo "Starting backups for` date` ">>" $ LOGFILE "


    buplinux ()


    {


    DIR = "/ nethome / tille / xml / db / linux-basics /"


    TAR = "Linux.tar"'
