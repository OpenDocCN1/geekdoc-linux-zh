    # Stereotypes in Bash


    This chapter highlights the features included in Bash to match patterns and identify
    character classes and ranges. In addition to a breakdown of the regular expressions
    (Regular Expressions), they are powerful tools for selecting specific lines of
    files or from an output, and are used by many commands in Unix such as vim, perl,
    PotgreSQL database and others, and can be added in any language or application
    using external libraries, You may even find it on non-Unix systems, as Excel uses
    it for tables that come in the Windows Office package.


    You will also learn about grep, which is indispensable in any Unix environment,
    as it has far more possibilities than we will explain in this chapter where we
