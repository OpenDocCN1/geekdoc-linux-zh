  \n## 计算平均值\n\n此程序在执行前会对用户的输入进行计算测试。如果输入超出范围，则会打印消息。如果用户按下 `q` 键，循环将退出：\n\n```bash\n\
  #!/bin/bash\n\n# 计算一组数字的平均值。\n\nSCORE = \"0\"\nAVERAGE = \"0\"\nSUM = \"0\"\nNUM\
  \ = \"0\"\n\nwhile true; do\n  echo -n \"输入你的分数 [0-100%] ('q' 退出):\"; read SCORE\n\
  \  if ((\"$SCORE\" <\"0\")) || ((\"$SCORE\"> \"100\")); then\n    echo \"认真点。来，再试一次：\"\
  \n  elif [\"$SCORE\" == \"q\"]; then\n    echo \"平均分: $AVERAGE%。\"\n    break\n\
  \  else\n    SUM = $[$SUM + $SCORE]\n    NUM = $[$NUM + 1]\n    AVERAGE = $[$SUM\
  \ / $NUM]\n  fi\ndone\necho \"正在退出。\"\n```\n\n注意最后几行中的变量在计算时没有加引号。\n\n## Bash 中的\
  \ Until 循环\n\n### 如何制作一个直到...的循环\n\n这种迭代循环与 while 循环类似，不同之处在于这里的循环一直执行到 `TEST-COMMAND`\
