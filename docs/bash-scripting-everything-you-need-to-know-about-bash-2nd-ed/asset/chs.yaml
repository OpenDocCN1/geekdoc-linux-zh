  \n# 简介\n\n它是一个能够接收你输入的命令并请求内核执行这些命令的程序。也就是说，它和你操作系统之间充当了中间人，换句话说，它代表了系统的外层或接口，它接收你的指令并给你结果。然后它会再次显示提示符，表示已结束，并等待你输入更多命令。这就是为什么\
  \ shell 被称为命令解释器，类似于 Windows 中的 `.com`。它还包含一种类似于高阶语言的编程语言，非常强大，通过它可以解决任何问题。此外，一个重要特性是可以创建一个文件来创建另一个程序，这让你能够产生所谓的脚本。这里有很多类型的\
  \ shell，但最著名和常用的是两种类型：\n\n- Bourne shell 包括 `sh`、`ksh`、`bash`\n- C shell 包括 `csh`、`tcsh`\n\
  \n如果你使用的是 Bourne shell，你的默认提示符是 `$`。\n\n# 什么是 shell 提示符？\n\n提示符（无论是 `%` 还是 `$`）取决于你正在使用的\
  \ shell 类型。当提示符出现时，意味着 shell 正在等待你输入要执行的命令。如果你以 root 身份登录系统，会出现提示符。以下是每种类型 shell\
  \ 的优缺点：\n\n第一类包括：\n- 符号为 `sh` 的 Bourne shell\n- 符号为 `ksh` 的 Korn shell\n- 符号为 `bash`\
  \ 的 Bourne again shell（再次 Bourne 壳）\n\n第二类包括：\n- C shell, TENEX / TOPS C shell，符号为\
  \ `tcsh`\n\nshell 的起源于 Bourne shell，Stephen R. Bourne 在 20 世纪 70 年代中期在 AT&T 实验室的\
  \ unix 系统上编写了它。因此，有些人称它为“The Shell”，因为它最早出现。这个 shell 通常位于 `/bin/sh`。如前提到的，shell\
  \ 是一个命令解释器，同时也包含一种使用 ALGOL 语言的编程语言，包含以下内容：变量、函数、程序控制命令、循环命令、数学表达式等。所有 Bourne 类型都共享这些特征，但这种原始类型的缺点是难以使用。它没有自动补全功能，也没有保存已执行命令的命令。\n\
  \n十年后，1980 年，Bill Joy 编写了 C shell，避免了在类型中发现困难，并将语法公式从 ALGOL 转换为 C 语言。在其中发现的一些特性有：文本补全、保存之前写过的命令。我们通常在\
  \ `/bin/csh` 路径下找到这个 shell。它的缺点是：支持 I/O 操作的能力弱，缺乏函数，因此不建议用于编程，仅供使用。\n\nTENEX / TOPS\
  \ C shell (符号为 `tcsh`) 是 `csh` 的改进版本，增加了许多功能，包括使用箭头（上/下）查看已执行的命令，以及使用箭头（左/右）修改这些命令。此时，在两种类型的\
  \ shell 之后，David Korn 在 AT&T 编写了符号为 `ksh` 的 Korn shell。它结合了 C shell 和 Bourne shell\
  \ 的便利性，使得 `ksh` 成为许多用户的首选。\n\n总的来说，`ksh` 兼容第一类即 `sh`。这种并行关系有 3 个变体：\n- 符号为 `ksh`\
  \ 的官方版本\n- 符号为 `pdksh` 的公共领域版本\n- 最后是符号为 `dtksh` 的桌面版本\n\nshell 程序员经常使用第一和第二版本。第三种\
  \ `dtksh` 是给 shell 用户的。`ksh` 通常位于 `/bin/ksh` 或 `/usr/bin/ksh` 路径下。如果你的系统没有提供，可以从网上下载其他版本。\n\
  \n最后是 Bourne again shell，它目前被用于大多数发行版中，开发者 Brian Fox 收集了之前的特征并将其放入其中，因此它现在很受欢迎，通常位于\
  \ `/bin/bash` 路径或 `/bin/sh` 路径（后者已成为默认 shell）。\n\n# 进程何时开始和结束？\n\n当你登录系统时，`getty`\
  \ 开始工作，要求你输入用户名和密码，然后将其传递给 `login` 程序，该程序通过与 `/etc/passwd` 比对来检查输入的数据，如下：\n\n```\n\
  SudaNix: x: 500: 500: ahmad: /home/SudaNix: /bin/bash\n```\n\n匹配的情况下，将执行文件中的，在此情况下是\
  \ `/bin/bash`，当你退出登录时 Shell 结束工作，可以通过输入命令 `/bin/csh` 更改进程类型，此处切换到 Cshell 并退出\n\n\
  \ 交互式和非交互式进程！！\n\n当你看到提示符时，这意味着进程以交互式方式运行，我的意思是交互式，也就是说，预期你会编写要执行的命令。这是通常正常情况：你进入系统，然后进程开始工作……然后你输入一些命令并退出系统，Shell\
  \ 被挂起。\n\n这与非交互式进程相矛盾：\n\n\n\n\n\n这意味着你与 Shell 之间没有交互，也就是说，它不会等待你输入任何命令，而是执行保存在文件中的命令，并在到达文件末尾时停止工作，这被称为脚本（script）。两个基本概念是：\n\
  \n# 命令 (Commands)\n\n它是一个你可以通过输入其名称并按回车来运行的程序。例如：`date` 命令显示日、日期、小时。注意 `$` 提示符重新出现，这表示程序已执行完毕。\n\
  \n另一个例子是 `who` 命令，它显示系统所有用户的名称，外还包含一些信息。命令有几种类型，即：简单命令、复杂命令。\n\n### 简单命令 (Simple\
  \ commands)\n\n从名字就能很易地看出它是简单的，只包含程序的名称，例如之前的两个 `date`、`who`，以及我之后将提到的很多命令。\n\n\
  ### 复杂命令 (Complex commands)\n\n一个简单的程序名加上一个或多个参数。为了清楚起见举个例子：\n\n如所述，我们为你提供了所有用户及其访问系统时间的信息，但通过输入它：你正在操作的用户名和你访问系统的时间。所以\
  \ `am` 和 `i` 是干扰 `who` 调整其行为的中间环节。大多数现有命令都接受许多改变默认行为的参数，我们稍后会看到。\n\n### 复合命令 (Compound\
  \ commands)\n\n它们是结合了简单命令和复杂命令的命令。通过分号分隔；例如命令：`date;` `who am i;`\n\n这个复合命令先执行简单命令\
  \ `date`，然后执行复杂命令 `who am i`，命令之间使用分号分隔。如果没有放置，即命令写成：`date who am i` 将发生错误……并且不会执行错误消息，因为我认为这个解释器认为\
  \ `date` 是顺序或程序，而 `who am i` 是它的参数，这是错误的。\n\n值得提到的是，你可以在任何命令末尾写分号，无论是复杂命令还是简单命令，例如命令：`date;`\
  \ 结果与 `date` 相同。\n\n关于顺序的最后一点说明：\n\n在编写任何命令并在 shell 执行之前，要确保它执行的命令或程序位于特定的路径 `PATH`\
  \ 中，如果没有，则会给你 `command not found` 的错误。\n\n## 什么是 shell 脚本 (What is shell script?)\n\
  \n它是一个包含一组用于实现特定目的的文件，shell 以交互方式执行它们，你通过以下示例看到定义：例如，工具箱包含工具（螺丝刀、螺丝、木头、锤子……等）。它可以制造椅子、桌子、柜子等。使用相同的工具，但通过特定的组合，它可以制造任何想要的东西。\n\
  \n这个例子与 shell 脚本非常相似。要构建你想要的任何东西，你必须使用正确的工具并调用它们命令或程序，即上面提到的。\n\n编写第一个 shell 脚本：打开任何文档\
  \ - 文本文件 - 输入以下内容：\n\n```\ndate; who;\n```\n\n以任何名称保存文件并将其命名为 `sudanix`\n\n现在你运行这个脚本，输入：\n\
  \n```\n/bin/bash sudanix\n```\n\n现在结果将会出现，即 `date` 命令的输出和 `who` 命令的输出。\n\n将脚本转换为可执行脚本？？\n\
  \n这是为了让文件变得可执行而最重要的步骤之一……任何我们只通过名称执行。如下：\n\n通过命令将文件转换为可执行文件\n\n```\nchmod a +x ./sudanix\n\
  ```\n\n但我们必须确保将使用哪种 shell。因为我们不能保证所有的 shell 用户都在 `bash` 上工作，我们将在脚本开头添加此行。\n\n```\n\
  #!/bin/bash\n```\n\n注意这一行位于脚本的开头。特别是在第一行！！否则，脚本将如下：\n\n```\n#!/bin/bash\ndate; who;\n\
  ```\n\n现在要执行此脚本，按以下格式编写它，并注意要在脚本所在的文件夹中。\n\n```\n./sudanix\n```\n\n`bash` shell\
  \ 是 GNU 系统的默认 shell。\n\nGNU 项目，参考 GNU's Not UNIX（GNU 并不是 Unix），为管理 Unix 类系统提供工具，这些符合\
  \ Unix 标准的免费操作系统。这些工具之一是 `bash`，这种 shell 与 Stephen Bourne 编写的第一个 `sh` shell 相对应，并具有\
  \ Korn shell 和 C shell 的有用属性——它们分别缩写 `ksh` 和 `csh`。它被设计为符合 IEEE POSIX P1003.2 /\
  \ ISO 9945.2 的 shell 和软件标准。\n\n它还具有改进的、用于编程和交互式使用的 `sh`，例如命令行编辑、以前命令的无限历史记录、作业控制和\
  \ shell 函数、别名（Aliases）、无限大小的索引数组以及从 2 到 64 任意进制的术整数。`bash` 还可以不经修改地处理大多数 `sh` 文本脚本。\n\
  \nBash 倡议与 GNU 的其他项目一样，最初是为了保留使用、研究、复制、修改和重新发布程序的自由，并推广和传播这些权利，因为这些是创造力的催化剂。在任何其他巧合中。\n\
  \n## 优势仅在 bash 中找到\n\n### 调用 (Invocation)\n\n有许多你可以使用的多字符选项，还可以使用 shell 中默认的 `set`\
  \ 命令设置单字符选项。在本文档中，我们将展示一些其他流行的选项，你可以在 info 指南中找到完整列表，在 features 之后是 Invoking。\n\n\
  ### Bash 中的启动文件 (Startup files)\n\n启动文件是 Bash 在启动时读取并执行的脚本。以下解释说明了启动 shell 的不同方式，以及相应读取的启动文件。\n\
  \n#### 作为交互式登录 shell 调用 (Invoke as an interactive shell, or with login)\n\n这里的交互式意味着你可以输入命令，shell\
  \ 不会因为激活而工作。“登录 shell”意味着你在通过系统身份验证后进入 shell，通常通过输入用户名和密码。\n\n读取文件：\n\n`/etc/profile`\n\
  `~/.bash_profile`, `~/.bash_login`, 或 `~/.profile`: 读取第一个可读文件。\n`~/.bash_logout`\
  \ 在注销时读取。\n\n如果配置文件存在无法读取，将打印错误消息；如果文件不存在，bash 将查找下一个文件。\n\n#### 作为非登录交互式 shell\
  \ 调用 (Call as an interactive shell without logging in)\n\n非登录 shell 意味着你不需要通过系统，例如通过点击图标或列表项打开终端，它是非登录\
  \ shell。\n\n读取文件：\n\n`~/.bashrc`\n\n此文件通常在 `bash_profile` 中被引用：\n\n```bash\nif [\
  \ -f ~/.bashrc ]; then\n    . ~/.bashrc\nfi\n```\n\n#### 调用是交互 (The call is interactive)\n\
  \n所有的文本代码使用非交互式 shell，并被编程执行特定任务，否则无法编程执行其他任务。\n\n读取文件：\n\n由 `BASH_ENV` 选择。PATH\
  \ 不在此文件中用于搜索。如果你想使用它，请指定完整路径和文件名。\n\n#### 从 sh 内部顺序调用 (Call by order from within\
  \ sh)\n\nBash 尝试表现像 Steve Bourne 编写的旧 sh 软件，同时尝试符合 POSIX 标准。\n\n读取文件：\n\n`/etc/profile`\n\
  `~/.profile`\n\n`ENV` 变量可以引用额外的启动信息。\n\n### POSIX 模式 (POSIX mode)\n\n该选项通过 `set`\
  \ 命令激活：\n\n```bash\nset -o posix\n```\n\n或通过带有 `- posix` 选项调用 bash 程序，bash 将尝试符合\
  \ shell POSIX 标准。此外，初始化 `POSIXLY_CORRECT` 变量产生相同的结果。\n\n读取文件：\n\n由 `ENV` 变量指定。\n\
  \n### 远程分页 (Remote paging)\n\nbash 使用 `rshd` 命令启动时读取的文件：\n\n`~/.bashrc`\n\n避免使用\
  \ r-tools\n\n\n\n\n\n请注意使用 `rlogin`、`telnet`、`rsh` 和 `rcp` 等不安全工具的危险，因为它们会在网络上明文传输敏感数据。如果需要远程管理系统、传输文件等，请使用安全\
  \ Shell 协议 (`ssh`)，该协议可以从 `http://www.openssh.org` 免费获取。你还可以找到针对非 Unix 类系统的不同程序，请查看你本地的软件镜像。\n\
  \n当 UID 不等于 EUID 时的调用\n\n在这种情况下，启动时不会读取任何文件。\n\n### 交互式 shell (Interactive shells)\n\
  \n#### 什么是交互式 shell？\n\n交互式 shell 按照如下方式在用户的终端上进行读写：\n\n输入和输出连接到终端。当调用 `bash` 命令且不添加任何非选项参数时，会启动交互式\
  \ bash 行为，除非该选项是一个被读取的字符串，或者 shell 被触发读取标准输入。这允许位置参数的初始化，请参阅 Bash 环境。\n\n##### 这种\
  \ shell 是交互式的吗？\n\n要判断 shell 是否为交互式，请查看特殊参数 `-` 的内容，如果它包含 `\"i\"`，则该 shell 是交互式的：\n\
  \n```\nhsoub: ~> echo $ -\nhimBH\n```\n\n在非交互式 shell 中，`PS1` 提示符不会初始化，即它会回到零。\n\n\
  ###### 交互式 shell 行为\n\n- Bash 读取启动文件。\n- 默认启用函数控制。\n- 配置提示符，并激活用于多行命令的 `PS2` 变量，通常设置为\
  \ `<`，这与 shell 认为你输入了不完整的命令（例如忘记写引号或命令中不可忽略的一个或多个项目等）时的显示相同。\n- 默认情况下使用 `readline`\
  \ 从命令行读取命令。\n- 当接收到文件结束符（简称 `EOF`）时，Bash 会解释 `ignoreeof` 选项而不是直接退出。\n- 默认启用命令历史和日志扩展，并在\
  \ shell 关闭时将日志保存在 `HISTFILE` 指向的文件中。默认情况下，`HISTFILE` 指向 `/.bash_history`。\n- 自动激活别名扩展。\n\
  - 在没有陷获 (traps) 的情况下，`SIGTERM` 信号会被忽略。\n- 在没有陷获的情况下，`SIGINT` 会被捕获并处理，因此按下 `Ctrl\
  \ + C` 等不会让你退出当前所在的交互式 shell。\n- 可以通过 `huponexit` 选项设置退出时向所有函数发送 `SIGHUP` 信号。\n\
  - 命令在读取后立即执行。\n- 定期检查邮件 bash。\n- Bash 可以设置为在遇到未定义的变量时关闭。此行为在交互模式下被禁用。\n- 当 shell\
  \ 命令遇到重定向错误时，不会导致 shell 关闭或退出。\n- 在 POSIX 模式下使用特殊内置命令时，重复错误不会导致意外。更多关于包含命令的信息请参见\
  \ shell 包含的命令。\n- `exec` 失败不会导致 shell 退出。\n- 解析器的语法错误不会导致 shell 关闭。\n- 默认激活 `cd`\
  \ 参数的简单检查。\n- 启用在 `TMOUT` 变量指定的时间超时后自动注销。\n\n有关更多解释，请参阅 Bash 中的变量、更多 Bash 选项、Bash\
  \ 中的信号捕获（获取更多信号），以及讨论输入命令时发生的各种不同扩展的 Bash 扩展。\n\n### 条件表达式 (Conditional Expressions)\n\
  \n条件表达式通过组合命令 `[]`、包含的命令和 `test` 以及内置命令使用。表达式可以是单目的的或二目的的。\n\n还有文本运算符（字符串运算符）和数值比较运算符。这两类运算符都是二元运算符，需要两个元素来执行操作。\n\
  \n如果原始的 `FILE` 参数是 `dev / fd / N /`，则选择文件描述符 `N`；但如果是 `dev / stdin /`、`dev / stdout\
  \ /` 或 `dev / stderr /` 之一，则分别选择文件描述符 `0`、`1` 或 `2`。\n\n更多条件表达式请查看条件结构的详细描述，更多文件描述符请查看重定向和文件描述。\n\
  \n### Shell 中的算术表达式 Shell Arithmetic Expressions\n\nshell 允许将算术表达式作为 shell 扩展之一进行求值，或通过\
  \ `let` 命令求值，并评估为固定宽整数且不溢出，但除以 0 会被捕获并报告为错误。C 语言中关于操作数、优先级和结合性的规则适用于此处的对应项，请参阅 bash\
  \ 环境。\n\n### 备选命令 (Alternative commands)\n\n当作为简单命令的第一个单词使用时，备选命令允许将一个单词替换为多个单词的文本。shell\
  \ 保留了一个备选命令列表，可以使用 `alias` 和 `unalias` 创建或取消。\n\nBash 在执行该行的任何命令之前，至少读取整行输入。备选命令在命令读取但未执行时也会被扩展，因此如果行中某个备选命令的字符与同一行中另一个命令的字母匹配，则备选命令所持有的命令只有在读取下一行输入时才会执行。\n\
  \n同样，备选命令在读取函数描述时扩展，而不是在执行时扩展，因为函数描述本身是一个复合命令，所以函数中的备选命令只有在函数执行后才可用。我们将在“备选顺序”中详细讨论备选顺序。\n\
  \n# 第一章\n\n## 创建并运行 Bash 程序\n\n### 编写与命名\n\n如果你有一系列经常执行的命令，并想缩短执行时间或自动执行它们，你可以将它们放在一个按特定格式写的空文件中（该文件会被\
  \ shell 作为程序读取）。这些程序用于使用 `cron` 工具自动化任务，或在 Unix 系统的启动和关闭过程中使用（其中守护进程和服务在 init 脚本中定义）。\n\
  \n要创建一个 shell 程序，请在你喜欢的文本编辑器中打开一个空文件。你使用什么类型的编辑器都没有关系。大多数编辑器都能完成我们现在想要的工作：编写一个 shell\
  \ 程序。但可能让你使用像 VIM 或 emacs 这样复杂的编辑器的是，你可以配置它们来识别你编写的文本并用不同的颜色对其进行高亮——包括我们将编写的文本和\
  \ shell 命令——这可以减少学者通常会犯的错误，例如漏掉右括号 `()` 或忘记分号 `;`。\n\n### 在 VIM 中高亮文本\n\n使用以下三个命令之一在\
  \ VIM 编辑器中开启高亮：\n\n`syntax enable:` 或 `sy enable:` 或 `syn enable:`\n\n将此设置添加到 `vimrc`\
  \ 文件中很有用，以便默认安装。\n\n将 Unix 命令置于你创建的文件中，就像你要在命令行输入这些命令一样（参见：在 Bash 中执行命令）。这些命令可以是\
  \ shell 函数、嵌入命令、Unix 命令等。现在给该文件起一个描述其执行任务的名称，并确保该名称不会与已有的命令冲突。为了确保这一点，shell 程序的名称通常以\
  \ `.sh` 结尾，但这并阻止系统中存在与你选择的名称相同的其他代码。你可以使用 `which` 或 `whereis` 等文件和程序搜索命令在系统中搜索具有相同名称的文件或代码：\n\
  \n```\nwhich -a script_name\n\nwhereis script_name\n\nlocate script_name\n```\n\n\
  ```\nscript1.sh\n```\n\n\n\n\n在这个示例中，我们将使用 `echo` 命令在屏幕上打印通知，告知用户在每个任务执行之前将发生什么。告诉用户正在发生的情况是非常重要的，以避免用户因为觉得程序“什么都没做”而产生恐慌。请参阅编写交互式\
  \ Bash 程序中的中的详细用户通知说明。\n\n### `script1.sh` 文件\n\n```bash\n#! / bin / bash\n\nclear\n\
  \necho \"The script starts now.\"\n\necho \"Hi, $USER!\"\n\necho\n\necho \"I will\
  \ now fetch you a list of conntected users:\"\n\necho\n\nw\n\necho\n\necho \"I'm\
  \ setting two variables now.\"\n\nCOLOR = \"black\"\n\nVALUE = \"9\"\n\necho \"\
  This is a string: $COLOR\"\necho \"And this is a number: $VALUE\"\n\necho\n\necho\
  \ \"I'm giving you back your prompt now.\"\n\necho\n```\n\n你可能需要通过自己在终端输入这个示例来训练自己编写\
  \ shell 程序。创建一个 `~/scripts` 文件夹来保存你的代码也是很有用的，然后如下所示将该文件夹添加到 `PATH` 变量中：\n\n```bash\n\
  export PATH = \"$PATH:~/scripts\"\n```\n\n如果你是新手，请使用支持 shell 命令文本高亮的编辑器。此类功能在 `VIM`、`gvim`、`(x)\
  \ emacs`、`kwrite` 等其他编辑器中都支持，因此请通过查看文档高亮功能确保你的编辑器支持文本高亮。\n\n### 各种指示\n\n说明中使用的指示器可能为了模拟真实情况，而不是使用经常用于说明的\
  \ `$inductor`。然而，注释中的 root 用户提示符将保持不变，并为 `#`。\n\n### 程序实现\n\n程序对于有权的人（即程序所有授予执行权限的人）是可执行的。在调整程序权限时，确保你获得了所需的权限，然后你就可以像运行任何命令一样运行该程序：\n\
  \n```bash\nwiki @ hsoub:~/scripts $ chmod u + x script1.sh\nwiki @ hsoub:~/scripts\
  \ $ ls -l script1.sh\n-rwxrwxr-x 1 wiki wiki 331 Jul 31 03:12 script1.sh\nwiki @\
  \ hsoub:~/scripts $ script1.sh\n```\n\n```text\nThe script starts now.\nHi, wiki!\n\
  I will now fetch you a list of connected users:\n03:12:48 up 3:42, 1 user, load\
  \ average: 1.33, 1.51, 1.67\nUSER TTY FROM LOGIN @ IDLE JCPU PCPU WHAT\nwiki tty7:\
  \ 0 23:30 3: 42m 12:51 0.63s /usr/lib/gnome-session/gnome\nI'm setting two variables\
  \ now.\nThis is a string: black\nAnd this is a number: 9\nI'm giving you back your\
  \ prompt now.\n```\n\n```bash\nwiki @ hsoub:~/scripts $ echo $COLOR\nwiki @ hsoub:~/scripts\
  \ $ echo $VALUE\nwiki @ hsoub:~/scripts $\n```\n\n这是实现 shell 脚本的最常见，最好在子 shell 中进行。在子\
  \ shell 中创建的变量、函数和别名仅对该子 shell 的 Bash 会话有效。当该 shell 关闭并控制权重新交回时，一切都会被清理，程序对环境所的所有更改都会被取消。如果你没有将脚本文件夹放入\
  \ `PATH` 变量，且它不是当前目录，你也可以使用此命令执行程序——`script_name` 表示你的程序名称：\n\n```bash\n./script_name.sh\n\
  ```\n\n程序可以在特定的 shell 中实现，尽管我们通常在想要获得某些行为时才这样做，例如检查程序是否在另一个 shell 中运行，或为了调试打印跟踪信息：\n\
  \n```bash\nrbash script_name.sh\nsh script_name.sh\nbash -x script_name.sh\n```\n\
  \n上述任何命令中指定的 shell 都将作为你当前 shell 的子 shell 并执行程序。当你希望程序带有特定选项运行或在程序内未指定的条件下运行时，你可以这样做这样做。如果你想在与当前相同的\
  \ shell 中执行程序，必须先使用 `source` 命令：\n\n```bash\nsource script_name.sh\n```\n\n### `source\
  \ = . `\n\nBash shell 中包含的 `source` 命令与 Bourne 环境中的一个命令同义。在这种情况下，shell 不需要任何执行权限，命令在\
  \ shell 的当前上下文中执行，因此你的当前环境中发生的任何更改在程序执行完毕后都是可见并保留的：\n\n```bash\nwiki @ hsoub:~/scripts\
  \ $ source script1.sh\nwiki @ hsoub:~/scripts $ echo $COLOR\nblack\nwiki @ hsoub:~/scripts\
  \ $ echo $VALUE\n9\nwiki @ hsoub:~/scripts $ \n```\n\n## 程序将在什么环境下运行？\n\n如果你想在子\
  \ shell 中执行程序，必须指定执行该程序的 shell。你编写程序的 shell 可能不是你系统的默认 shell，因此当在错误的 shell 中执行时，你的程序可能会产生错误。\n\
  \n程序的第一行指定了 shell 的类型，该行的前两个字符必须是 `#!`，随后是执行该程序的 shell 路径。此外，不要以空行开始程序，因为空行也会被读取，说明中的所有程序都将以以下行开头：\n\
  \n```bash\n#! / bin / bash\n```\n\n之前的行表示 Bash 存在于 `/bin`。\n\n### 添加注释\n\n注意，任何行中\
  \ `#` 符号之后的内容都会被忽略，并且只有在你打开源文件时才会显示。注释让你能够更容易修改你所做的、如何做以及为什么选择这些顺序。\n\n\n\n\n\n\
  如果通过登录选项交互式地调用 `Bash`，它会读取 `/etc/profile` 中的指令；如果作为 `sh` 调用，这些指令通常会设置 `PATH`、`USER`、`MAIL`、`HOSTNAME`、`HISTSIZE`\
  \ 变量，这些都是 shell 变量。\n\n`/etc/profile` 中的 `umask` 值在某些系统中也会设置；在另一些系统中，此文件包含指向其他配置文件的指针，例如：\n\
  \n- `/etc/inputrc` 文件，它是 `readline` 命令的系统级配置文件，你可以在其中配置命令行的响铃样式（bell style）。\n-\
  \ `/etc/profile.d/` 文件夹，包含在系统层级设置特定程序行为的文件。\n\n你想要应用到系统中所有用户的设置必须存在于该 `/etc/profile`\
  \ 文件中，内容可能类似于所示：\n\n```bash\n# /etc/profile\n\n# 全局环境和启动程序，用于登录设置\n\nPATH = $PATH:/usr/X11R6/bin\n\
  \n# 默认不产生核心文件\n\nulimit -S -c 0> /dev/null 2>&1\n\nUSER=`id -un`\n\nLOGNAME = $USER\n\
  \nMAIL = \"/var/spool/mail/$USER\"\n\nHOSTNAME=`bin/hostname`\n\nHISTSIZE = 1000\n\
  \n# 键盘、响铃、显示样式：readline 配置文件：\n\nif [-z \"$INPUTRC\" -a ! -f \"$HOME/.inputrc\"\
  \ ]; then\n    INPUTRC=/etc/inputrc\nfi\n\nPS1 = \"\\u@\\h \\W\"\n\nexport PATH\
  \ USER LOGNAME MAIL HOSTNAME HISTSIZE INPUTRC PS1\n\n# 为特定程序的初始化文件 (ls, vim, less,\
  \ ...)\n\nfor i in /etc/profile.d/*.sh; do\n    if [-r \"$i\"]; then\n        .\
  \ $i\n    fi\ndone\n\n# 程序初始化设置\n\nsource /etc/java.conf\n\nexport NPX_PLUGIN_PATH=\"\
  $JRE_HOME/plugin/ns4plugin:/usr/lib/netscape/plugins\"\n\nPAGER=\"/usr/bin/less\"\
  \n\nunset i\n```\n\n此配置文件除了了一些基础 shell 变量外，还设置了任何运行 Java 或在浏览器中运行 Java 应用程序的用户所需的变量。请参阅\
  \ `Bash` 中的变量。\n\n更多关于上一个示例中使用的 `if` 条件，请参阅 `Bash` 中的条件结构；关于讨论如 `for` 等迭代循环的任务，请参阅\
  \ `Bash` 中的重复任务。\n\n`Bash` 源码包含了通用或个人使用的示例配置文件，这些文件（如上述示例中的文件）在用于你的环境之前，会经过多次更改。\n\
  \n### 文件 `/etc/bashrc/`\n\n如果你在具有不同类型 shell 的系统上工作，将 `Bash` 配置文件放在此文件中可能是最好的，例如，其他\
  \ shell —— Bourne shell 会读取 `/etc/profile` 文件。\n\n通过分离不同类型 shell 的配置文件，可以避免不理解 `Bash`\
  \ shell 语法的 shell 产生的错误。在登录时进行 shell 实例化。\n\n你可能会发现系统中的 `/etc/profile` 文件仅包含 shell\
  \ 环境和程序启动设置，而 `/etc/bashrc` 包含了 shell 函数的系统级定义及其替代命令。`/etc/bashrc` 文件也可以在 `/etc/profile`\
  \ 文件或用户的 shell 配置文件中引用。\n\n源码包含了 `bashrc` 文件的示例，你可以在 `/usr/share/doc/bash-2.05b/startup-files/`\
  \ 中找到一个副本。以下是随 `Bash` 文档自带的 `bashrc` 文件部分内容：\n\n```bash\nalias ll='ls -l'\nalias\
  \ dir='ls -ba'\nalias c='clear'\nalias ls='ls --color'\nalias mroe='more'\nalias\
  \ pdw='pwd'\nalias sl='ls --color'\n\npskill ()\n{\n    local pid\n    pid=$(ps\
  \ -ax | grep $1 | grep -v grep | gawk '{print $1}')\n    echo -n \"killing $1 (process\
  \ $pid) ...\"\n    kill -9 $pid\n    echo \"slaughtered.\"\n}\n```\n\n它包含了实用的别名以及通用别名，它们确保了即使你拼写错误，输入的命令也会执行，请参阅“创建和删除替代顺序”（Creating\
  \ and Deleting Alternate Orders）。此文件还包含 `pskill` 函数，请参阅 `Bash` 中的函数以获取更多关于函数的解释。\n\
  \n### 用户设置文件\n\n#### 在我的电脑上找不到这些文件！？\n你可能在你的家目录中找不到这些文件。\n\n#### 文件 `bash_profile/.~`\n\
  如果你设置了个人用户环境，此文件最好用。此处的用户可以添加额外的选项或更改默认设置：\n\n```bash\nwiki ~> cat .bash_profile\n\
  ```\n\n```bash\n##########################################################################\n\
  # #\n# .bash_profile 文件 #\n# #\n# 当你登录时从 bash shell 中执行。 #\n# #\n##########################################################################\n\
  \nsource ~/.bashrc\nsource ~/.bash_login\n\ncase \"$OS\" in\n  IRIX)\n    stty sane\
  \ dec\n    stty erase\n    ;;\n  # SunOS)\n  # stty erase\n  # ;;\n  *)\n    stty\
  \ sane\n    ;;\nesac\n```\n\n该用户通过上述设置，除了 `bashrc` 文件外，还在不同操作系统上设置了退格键登录。以及 `bash_login`。已读取了用户特定信息。\n\
  \n######## 文件 `bash_login/.~`\n此文件包含特定的设置，通常只在登录系统时实现。在接下来的示例中，我们将使用它在登录系统时执行。在下面的示例中，我们将使用它设置\
  \ `umask` 值并显示连接的用户列表：\n\n```bash\n##############################################################\n\
  # #\n# Bash_login 文件 #\n# #\n# 当登录时从 bash shell 中执行。 #\n# #\n# (来自 .bash_profile)\
  \ #\n##############################################################\n\n# 文件保护\n\
  umask 002 # 全局\n\n# 杂项\nw\ncal `date +%m`\n```\n\n它将读取 `date +'%Y'`\n\n#### 文件 `profile/.~`\n\
  `profile/.~` 在不存在 `bash_profile/.~` 和 `bash_login/.~` 时被读取，这些可能包含其他 shell 访问的设置。\n\
  \n#### `Bash`\n注意这些 shell 可能不理解 `Bash` 的语言结构。\n\n#### 文件 `bashrc/.~`\n现在通常会在非登录\
  \ shell 中看到 `bashrc/.~`，因为从图形界面登录时没有发生登录过程，这使得用户不需要在多个文件中输入相同的设置。\n\n在下面的 `bashrc`\
  \ 文件示例中，在读取 `/etc/bashrc` 后，为特定程序指定了替代命令并设置了变量：\n\n```bash\nwiki ~> cat .bashrc\n\
  ```\n\n```bash\n# /home/franky/.bashrc\n\n# 来源全局定义\nif [-f /etc/bashrc]; then\n\
  \    . /etc/bashrc\nfi\n\n# shell 选项\nset -o noclobber\n\n# 我的 shell 变量\nexport\
  \ PS1=\"[\\033[1;44m\\]\\u@\\h \\W \\[\\033[0m\\]\"\nexport PATH=\"$PATH:~/bin:~/scripts\"\
  \n\n# 我的别名\nalias cdrecord='cdrecord -dev 0,0,0 -speed 8'\nalias ss='ssh octarine'\n\
  alias ll='ls -la'\n\n# mozilla 修复\nMOZILLA_FIVE_HOME=/usr/lib/mozilla\nLD_LIBRARY_PATH=/usr/lib/mozilla:/usr/lib/mozilla/plugins\n\
  MOZ_DIST_BIN=/usr/lib/mozilla\nMOZ_PROGRAM=/usr/lib/mozilla/mozilla-bin\n\nexport\
  \ MOZILLA_FIVE_HOME LD_LIBRARY_PATH MOZ_DIST_BIN MOZ_PROGRAM\n\n# 字体修复\nalias xt='xterm\
  \ -bg black -fg &'\n\n# BitchX 设置\nexport IRCNAME=\"frnk\"\n\n# 结束\nwiki ~>\n```\n\
  \n#### 文件 `bash_logout/.~`\n`bash_logout/.~` 包含了特定的注销指令。在接下来的示例中，它是一个简单的 `clear`\
  \ 语句，用于在关闭后留空窗口，这对于远程连接非常有用：\n\n```bash\nwiki ~> cat .bash_logout\n```\n\n```bash\n\
  ##############################################################\n# #\n# Bash_logout\
  \ 文件 #\n# #\n# 注销时从 bash shell 中执行命令 #\n# #\n##############################################################\n\
  \nclear\n```\n\n\n\n\n在修改上述提到的任何文件时，用户必须重新连接到系统以激活这些修改，或者使用另一种方法，对他编辑过的文件使用 `source`\
  \ 命令。当以这种方式解释 Bash 时，修改将应用于当前的 shell 会话中：\n\n图 3.1：每个用户的不同感应器。\n\n![](img/00001.jpeg)\n\
  \n大多数 Bash 程序都是在特殊环境中实现的，在这些环境中，除非父 shell 将其源（sourcing），否则子进程不会获取变量。将包含 shell 命令的文件作为源是将修改应用到你的环境并调整当前\
  \ shell 中变量的方法之一。\n\n此示例还解释了每个用户使用不同的感应器，在我们的情况下，`#` 符号意味着你现在处于 root 用户阶段，你应该警惕自己输入的每一个命令，因为设备将毫不犹豫地执行它，即使这意味着破坏系统核心中的文件。这与普通用户的\
  \ `$` 提示符不同，用户执行其输入的命令的权限有限。\n\n请注意 `source resourcefile` 与 `resourcefile` 是同的。\n\
  \n如果你怀疑这些许多设置并看到不知道来源的设置，可以像你精炼 Bash 程序时一样使用 `echo` 命令（参见精炼 Bash 程序部分）。例如，你可以添加如下所示的内容：\n\
  \n```bash\necho \"Now executing .bash_profile ..\"\n```\n\n或者\n\n```bash\necho \"\
  Now setting PS1 in .bashrc:\"\nexport PS1 = \"[some value]\"\necho \"PS1 is now\
  \ set to $ PS1\"\n```\n\n### Bash 中的变量\n\n#### 变量类型\n\nShell 变量是大写的，Bash 维护着两个变量的列表：\n\
  \n#### 全局变量\n\n你会在所有 shell 中找到通用变量或环境变量，可以使用 `env` 或 `printenv` 命令来显示环境变量。这些程序位于\
  \ sh-utils 包中。以下是 `printenv` 命令的输出示例：\n\n```\nwiki ~> printenv\nCC = gcc\nCDPATH\
  \ = .: ~: / usr / local: / usr: /\nCFLAGS = -O2 -fomit-frame-pointer\nCOLORTERM\
