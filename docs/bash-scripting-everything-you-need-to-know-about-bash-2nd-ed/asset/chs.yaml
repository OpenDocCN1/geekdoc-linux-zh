  \n该程序通过 `cron` ，这意味着它在无需用户干预的情况下运行，因此我们将 `scp` 命令的标准错误重定向到 `/dev/null`。有些人可能认为所有这些独立步骤可以合并成如下形式：\n\
  \n`tar c dir_to_backup / | bzip2 | ssh server \"cat> backup.tar.bz2\"`\n\n但如果你想要在程序失败时能够恢复结果，这种快捷方法对你来说无效。\n\
  \n# 第七章\n\n## 编写交互式 Bash 程序\n\n在本节中，我们将学习如何获取用户反馈以及如何用户输入数据（通常使用 `echo` / `read`\
  \ 结构），并讨论如何使用文件描述符和重定向将文件作为输入和输出，以及如何将其与用户输入相结合。本节还强调了为使用我们 shell 程序的用户提供详细信息的重要性。与其编写简短的文档，不如提供过的信息。\n\
  \nHere documents 是一种 shell 结构，允许为用户创建列表并保存选项，还可以用于在后台执行交互式任务而不受干扰。\n\n- 在 Bash 中查看用户消息：Bash\
  \ 中交互式和非交互式程序的区别，`echo` 命令的简单解释。\n- 在 Bash 中获取用户输入：`read` 命令的解释、文件描述符、请求用户输入、文档及其用例，以及重定向的各种状态。\n\
  \n## 在 Bash 中查看用户消息\n\n### 交互式或非交互式程序？\n\n某些 shell 脚本无需用户干预即可运行，被称为非交互式程序。这些程序的优点之一是它们以意想不到的方式工作，并且可以在后台运行。然而，其他\
  \ shell 程序需要用户输入，或者在工作时向用户打印消息。这类程序也有其优点。\n\n在编写交互式程序时，不要懒于写注释。务必放置消息告诉用户，例如，等待输出出现，因为程序正在计算。尽可能，尝试提供过程长度的估算或用户应该等待多久。在从用户输入的情况下，最好提供关于你希望用户输入的数据的清晰透明的信息。你用于向用户打印的命令是\
  \ `echo` 和 `printf`，我们将在下面讨论一些示例，尽管你可能已经习惯使用 `echo`。\n\n### 使用 echo 命令\n\n`echo`\
  \ 命令输出两个空格分隔的参数并以换行符结束，返回状态始终为零。`echo` 命令还接受几个选项：\n- `-e`：允许使用反斜杠转义字符（参见转义字符章节）。\n\
  - `-n`：停止末尾换行符。\n\n这里是一个添加注释的示例，我们在其中使用了命令行参数的两个示例，将条件 `if` 语句的高级用法分开：\n\n```bash\n\
  #!/bin/bash\n# (Tux) 这个程序允许你为企鹅提供食物\n# 只有在给它鱼时企鹅才会开心，我们通过添加其他动物增加了一点趣味\nif [\"$menu\"\
  \ == \"fish\"]; then\n  if [\"$animal\" == \"penguin\"]; then\n    echo -e \"Hmm\
  \ fish ... Tux is happy!\"\n  elif [\"$animal\" == \"dolphin\"]; then\n    echo\
  \ -e \"...\"\n  else\n    echo -e \"...\"\n  fi\nelse\n  if [\"$animal\" == \"penguin\"\
  ]; then\n    echo -e \"Tux doesn't like that. Tux wants fish!\"\n    exit 1\n  elif\
  \ [\"$animal\" == \"dolphin\"]; then\n    echo -e \"...\"\n    exit 2\n  else\n\
  \    echo -e \"...\"$...\"\n    exit 3\n  fi\nfi\n```\n\n```bash\n#!/bin/bash\n\
  # penguin.sh 根据程序给出的退出状态行为\nif [\"#\" != \"2\"]; then\n  echo -e \"Usage of the\
  \ feed script: $0 food-on-menu animal-name\"\n  exit 1\nelse\n  export menu = \"\
  $1\"\n  export animal = \"$2\"\n  echo -e \"Feeding $menu to $animal ...\"\n  feed\
  \ = \"/nethome/anny/testdir/penguin.sh\"\n  $feed $menu $animal\n  result = \"$?\"\
  \n  echo -e \"Done feeding.\"\n  case \"$result\" in\n    1)\n      echo -e \"Guard:\
  \ You'd better give fish, less they get violent...\"\n      ;;\n    2)\n      echo\
  \ -e \"Guard: No wonder they flee our planet...\"\n      ;;\n    3)\n      echo\
  \ -e \"Guard: Buy the food that the Zoo provides at the entry, you...\"\n      echo\
  \ -e \"Guard: You want to poison them, do you?\"\n      ;;\n    *)\n      echo -e\
  \ \"Guard: Don't forget the guide!\"\n      ;;\n  esac\nfi\necho \"Leaving ...\"\
  \necho -e \"Thanks for visiting the Zoo, hope to see you again soon!\"\n```\n\n\
  ### 在 Bash 中获取用户输入\n\n### 使用 read 命令\n\n`read` 命令是 `echo` 和 `printf` 命令的补充命令，其语法如下：\n\
  \n`read [options] NAME1 NAME2 ... NAMEN`\n\n从标准输入或作为 `u` 选项参数的文件描述符中读取一行，将行的第一个单词分配给第一个名称\
  \ `NAME1`，第二个单词分配给第二个名称 `NAME2`，以此类推，并将的单词及其之间的分隔符分配给最后一个名称 `NAMEN`，但如果从输入流读取的单词少于名称，则为这些名称分配空值。\n\
  \n\n\n\n如果 `read` 命令没有遇到文件结束符、命令超时（time out），或者作为 u- 参数输入了无效的文件描述符，则其返回代码为零。\n\n\
  以下是 `testleap.sh` 的改进版本，它消除了嵌套的 `if` 语句，分离了 Bash 中条件 `if` 语句的高级用法：\n\n```bash\n\
  hsoub ~ / test> cat leaptest.sh\n\n#! / bin / bash\n\n# 这个程序将检查今年以判断我们是否处于闰年。\n\n\
  echo \"请输入你想要检查的年份（4 位），并按 [ENTER]:\"\n\nread year\n\nif (((\"$ year\"% 400) ==\
  \ \"0\")) || (((\"$ year\"% 4 == \"0\") && (\"$ year\"% 100 != \"0\"))); then\n\
  \  echo \"$ year is a leap year.\"\nelse\n  echo \"This is not a leap year.\"\n\
  fi\n```\n\n```bash\nhsoub ~ / test> leaptest.sh\n\n请输入你想要检查的年份（4 位），并按 [ENTER]:\n\
  2000\n2000 is a leap year.\n```\n\n### 请求用户输入\n\n下面的示例展示了如何使用提示（prompt）来解释用户应该输入什么：\n\
  \n```bash\nhsoub ~ / test> cat friends.sh\n\n#! / bin / bash\n\n# 此程序将更新你的通讯录\n\
  friends = \"/var/tmp/michel/friends\"\n\necho \"Hello,\" $USER \". 此脚本将会在你注册到 Hsoub\
  \ 的朋友数据库中。\"\necho -n \"输入你的名字并按 [ENTER]:\"\nread name\necho -n \"输入你的性别并按 [ENTER]:\"\
  \nread -n 1 gender\necho\n\ngrep -i \"$ name\" \"$friends\"\n\nif [ $? == 0]; then\n\
  \  echo \"你已经注册过了，退出。\"\n  exit 1\nelif [\"$ gender\" == \"m\"]; then\n  echo \"\
  你已加入 Hsoub 的朋友列表。\"\n  exit 1\nelse\n  echo -n \"你多大大了?\"\n  read age\n  if [$ age\
  \ -lt 25]; then\n    echo -n \"你的头发是什么颜色的?\"\n    read color\n    echo \"$ name\
  \ $ age $ color\" >> \"$friends\"\n    echo \"你已加入 Hsoub 的朋友列表。非常感谢!\"\n  else\n\
  \    echo \"你已加入 Hsoub 的朋友列表。\"\n    exit 1\n  fi\nfi\n```\n\n```bash\nmichel ~\
  \ / test> cp friends.sh /var/tmp; cd /var/tmp\nmichel ~ / test> touch friends; chmod\
  \ a +w friends\nmichel ~ / test> friends.sh\n\nHello, hsoub. 此脚本将会在你注册到 Hsoub 的朋友数据库中。\n\
  输入你的名字并按 [ENTER]: michel\n输入你的性别并按 [ENTER]: m\n你已加入 Hsoub 的朋友列表。\n```\n\n```bash\n\
  hsoub ~ / test> cat friends\n注意，这里并没有忽略输出内容，程序只存储用户感兴趣的人的信息，但它始终会告诉你你已添加到列表中，除非你已经在其中了。现在任何用户都可以启动该程序：\n\
  \n```bash\n[anny @ octarine tmp] $ friends.sh\n\nHello, anny. 此脚本将会在你注册到 Hsoub 的朋友数据库中。\n\
  输入你的名字并按 [ENTER]: anny\n输入你的性别并按 [ENTER]: f\n你多大大了? 22\n你的头发是什么颜色的? black\n你已加入\
  \ Hsoub 的朋友列表。\n```\n\n你的朋友列表很快就会像这样：\ntille 24 black\nanny 22 black\nkatya 22 blonde\n\
  maria 21 black\n--output omitted--\n\n这种情况并不理想，因为任何人都可以修改用户的计算机文件（但不能删除它们），你可以使用程序文件上的特殊访问模式来解决这个问题，请参阅\
  \ Linux 指南中的 SUID 和 SGID。\n\n### 重定向与文件描述符\n\n你可能通过 shell 的简单使用了解到，对象的输入和输出可以在执行之前使用\
  \ shell 解释的特殊字符——重定向操作符进行重定向，重定向也可以用于为当前 shell 执行环境打开和关闭文件。\n\n重定向也可能发生在 shell 脚本中，使其从文件接收输入（例如），或向文件发送输出。用户稍可以查看输出文件，该输出文件可以作为另一个程序的输入。\n\
  \n文件的输入和输出可以使用监控进程所有打开文件的整数句柄来完成。这些数值值被称为文件描述符（file descriptors）。分别是 0、1 和 2，这些数字和相应的设备会被保存。Bash\
  \ shell 还可以将网络主机上的 TCP 和 UDP 端口作为文件描述符。\n\n下面的示例演示了保存的文件属性如何指向物理设备：\n\n```bash\n\
  hsoub ~> ls -l /dev/std*\nlrwxrwxrwx 1 root root 17 Oct 2 07:46 /dev/stderr -> ../proc/self/fd/2\n\
  lrwxrwxrwx 1 root root 17 Oct 2 07:46 /dev/stdin -> ../proc/self/fd/0\nlrwxrwxrwx\
  \ 1 root root 17 Oct 2 07:46 /dev/stdout -> ../proc/self/fd/1\n```\n\n```bash\n\
  hsoub ~> ls -l /proc/self/fd/[0-2]\nlrwx-xr-x 1 root root 64 May 20 10:00 0 -> ../dev/pts/0\n\
  lrwx-xr-x 1 root root 64 May 20 10:00 1 -> ../dev/pts/0\nlrwx-xr-x 1 root root 64\
  \ May 20 10:00 2 -> ../dev/pts/0\n```\n*(注：源文本中的示例输出存在碎片化/损坏；上面的格式反映了标准的 Linux 行为以保持逻辑性).*\n\
  \n\n\n\n以下命令仅将标准输出重定向到目标文件，因为在重定向输出之前，标准错误已经复制到了标准输出中。\n\n当你确定用户不需要错误时，通常会将错误重定向到\
  \ `/dev/null/`，你可以在系统的启动程序中找到成百个这样的示例。Bash 允许将标准输出和标准错误都重定向到以此图中 `FILE` 扩展结果命名的文件：`File\
  \ <&`，这等同于 `FILE 2> & 1`（之前的示例中使用的结构）。这也可以与重定向到 `/dev/null/` 结合使用，例如当你想执行一个命令而不查看它可能产生的错误或输出时。\n\
  \n## 文件输入与输出\n\n### 使用 `/dev/fd/`\n\n`/dev/fd/` 文件夹包含命名为 0、1、2 等数字的条目，打开 `/dev/fd/N/`\
  \ 文件等同于重复 `N` 文件描述符。即使你的系统拥有 `/dev/stdin/`、`/dev/stdout/` 和 `/dev/stderr/`，你会发现它们分别被映射为\
  \ `/dev/fd/0/`、`/dev/fd/1` 和 `/dev/fd/2`。\n\n`/dev/fd/` 文件的主要用途是一个巧合，这种机制允许使用路径名参数的程序像处理其他路径名一样处理标准输入和标准输出。如果系统中不支持\
  \ `/dev/fd/`，你应该找到一种解决问题的方法，例如使用连字符 `-` 来表示程序应该从管道读取，见下面的示例：\n\n```\nhsoub ~> filter\
  \ body.txt.gz | cat header.txt - footer.txt\n```\n\n这段文字会在每个打印任务的开头打印，感谢系统管理员为我们搭建了如此强大的打印基础设施。\n\
  \n待过滤的文本。\n\n这段文字会在每个打印任务的结束打印。\n\n## Shell 程序中的 Read 命令\n\n下面的示例显示了如何在文件和命令行输入之间切换：\n\
  \n```bash\nhsoub ~ /testdir> cat sysnotes.sh\n\n#! /bin/bash\n\n# 此脚本对重要的配置文件文件创建索引，将它们合并到\n\
  # 备份文件中并允许为每个文件添加注释。\n\nCONFIG=/var/tmp/sysconfig.out\n\nrm \"$CONFIG\" 2> /dev/null\n\
  \necho \"Output will be saved in $CONFIG.\"\n\n# 创建一个 fd 7，目标与 fd 0 相同（保存 stdin\
  \ \"value\"）\nexec 7 <& 0\n\n# 更新 fd 0 指目标文件 /etc/passwd\nexec </etc/passwd\n\n\
  # 读取 /etc/passwd 的第一行\nread rootpasswd\n\necho \"Saving root account info ...\"\n\
  echo \"Your root account info:\" >> \"$CONFIG\"\necho $rootpasswd >> \"$CONFIG\"\
  \n\n# 更新 fd 0 指向 fd 7 的目标（旧 fd 0 的目标）；删除 fd 7\nexec 0 <& 7 7 <& -\n\necho -n \"\
  Enter comment or [ENTER] for no comment:\"\nread comment; echo $comment >> \"$CONFIG\"\
  \n\necho \"Saving hosts information ...\"\n\n# 首先准备一个不包含任何注释的 hosts 文件\nTEMP=\"\
  /var/tmp/hosts.tmp\"\ncat /etc/hosts | grep -v \"^ #\" >\"$TEMP\"\nexec 7 <& 0\n\
  exec <\"$TEMP\"\n\nread ip1 name1 alias1\nread ip2 name2 alias2\n\necho \"Your local\
  \ host configuration:\" >> \"$CONFIG\"\necho \"$ip1 $name1 $alias1\" >> \"$CONFIG\"\
  \necho \"$ip2 $name2 $alias2\" >> \"$CONFIG\"\nexec 0 <& 7 7 <& -\n\necho -n \"\
  Enter comment or [ENTER] for no comment:\"\nread comment; echo $comment >> \"$CONFIG\"\
  \nrm \"$TEMP\"\n```\n\n输出：\n```text\nhsoub ~/testdir> sysnotes.sh\nOutput will be\
  \ saved in /var/tmp/sysconfig.out.\nSaving root account info ...\nEnter comment\
  \ or [ENTER] for no comment: hint for password: blue lagoon\nSaving hosts information\
  \ ...\nEnter comment or [ENTER] for no comment: in central DNS\n\nhsoub ~/testdir>\
  \ cat /var/tmp/sysconfig.out\n\nYour root account info:\nroot: x: 0: 0: root: /root/:\
  \ /bin/bash\nhint for password: blue lagoon\n\nYour local host configuration:\n\
  127.0.0.1 localhost.localdomain localhost\n192.168.42.1 tintagel.kingarthur.com\
  \ tintagel\nin central DNS\n```\n\n### 关闭文件描述符\n\n在文件描述符不再需要时将其断开是一个良好的习惯，因为子进程会继承打开的文件描述符。\n\
  \n```\nexec fd <& -\n```\n\n在上一个示例中，分配给标准输入的文件描述符 `7` 在用户每次需要访问标准输入物理设备（通常是键盘）时被关闭。看下面的示例，仅将标准错误重定向到管道：\n\
  \n```bash\nhsoub ~> cat listdirs.sh\n\n#! /bin/bash\n\n# 此程序原封输出标准输出，而标准错误被交给\n\
  # awk 进行处理\nINPUTDIR=\"$1\"\n\n# fd 6 目标是当前 shell 中的 fd 1 目标（控制输出）\nexec 6> & 1\n\
  \n# fd 1 指向管道，fd 2 指向 fd 1 目标（管道），\n# fd 1 指向 fd 6 目标（控制输出），关闭 fd 6，执行 ls\nls \"\
  $INPUTDIR\" /* 2> & 1> & 6 6> & - \\\n# 为 awk 关闭了 fd 6，但没有关闭 ls。\n| awk 'BEGIN {FS=\"\
  :\"}{print \"YOU HAVE TO\"}' 6> & -\n\n# 关闭当前 shell 中的 fd 6\nexec 6> & -\n\n```\n\
  \nDocuments Here\n\n"
