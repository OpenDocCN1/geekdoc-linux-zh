  \ 命令与表达式\n\n替代命令是在函数之后被搜寻的，因此它们的解析速度较慢，尽管更容易理解，并且在几乎所有的用法中都倾向于使用 shell 函数而非替代命令。\n\
  \n### 第三章：Bash 中的模式\n\n### Grep 命令与表达式。\n\nhsoub 用户显示包含 `/etc/passwd` root 文本的行。\n\
  接着显示包含该文本的行号。\n然后查看第三条命令，用户不使用 bash 但使用 nologin shell 的账户不会显示。\n\nhsoub 用户显示包含 `/etc/passwd`\
  \ root 文本的行。\n接着显示包含该文本的行号。\n然后查看第三条命令，用户不使用 bash 但使用 nologin shell 的账户不会显示。\n\n\
  hsoub 用户显示包含 `/etc/passwd` root 文本的行。\n接着显示包含该文本的行号。\n然后查看第三条命令，用户不使用 bash 但使用 nologin\
  \ shell 的账户不会显示。\n\n### 行与单词\n\n从之前的示例中，我们现在显示以 root 开头的行：\n\n```\nhsoub ~> grep\
  \ root / etc / passwd\nroot: x: 0: 0: root: / root: / bin / bash\n```\n\n如果我们想查看任何未分配的\
  \ shell，我们将查找以该字符结尾的行，如下：\n\n### 字符类型：\n\n如果不使用此选项，文件系统表的所有行都将显示。\n\n许多本地化按照字典顺序对字符进行分类，在这些本地化中，[a-d]\
  \ 不等于 [abcd]；它可能等于 [aBbCcDd]。为了对方括号表达式的传统解释，你可以通过将环境变量 LC_ALL 设置为 C 来使用 C 语言环境。\n\
  \n\n\n\n最后，列出的某些字符类别是在方括号表达式中预定义的，有关这些预定义表达式的更多信息，请参阅 `grep` 帮助页或 `man` 目录。此外，查看下面的示例，它将显示所有包含\
  \ `y` 或 `f` 的行：\n\n```\nhsoub ~> grep [yf] /etc/group\n\nsys: x: 3: root, bin, adm\n\
  \ntty: x: 5:\n\nmail: x: 12: mail, postfix\n\nftp: x: 50:\n\nnobody: x: 99:\n\n\
  floppy: x: 19:\n\nxfs: x: 43:\n\nnfsnobody: x: 65534:\n\npostfix: x: 89:\n```\n\n\
  ### 通配符\n\n使用 ``. ``。为了匹配单个字符，如果你想获取所有以 `c` 开头并以 `h` 结尾的五个字母英语单词列表，这里有一个示例 - 这在解决填字游戏时非常有用！：\n\
  \n```\nhsoub ~> grep '\\ <c ... h \\>' /usr/share/dict/words\n\ncatch\n\nclash\n\
  \ncloth\n\ncoach\n\ncouch\n\ncough\n\ncrash\n\ncrush\n```\n\n如果你想显示包含某种字体的行。使用 F\
  \ 选项来获取，并使用 `*` 字符匹配多个字符，参见下面的示例，它从系统字典中选择了所有以 `c` 开头并以 `h` 结尾的单词：\n\n```\nhsoub\
  \ ~> grep '\\ <c. * h \\>' /usr/share/dict/words\n\ncaliph\n\ncash\n\ncatch\n\n\
  cheesecloth\n\ncheetah\n\n--output omitted--\n```\n\n如果你想在文件或输出中查找 `*` 字符，使用单引号将其括起来。在下面的示例中，它尝试在不加引号的情况下查找\
  \ `/etc/profile` 中的星号，它没有返回任何行，但当使用引号时，它获得了输出想要的结果：\n\n```\nhsoub ~> grep * /etc/profile\n\
  \nhsoub ~> grep '*' /etc/profile\n\nfor i in /etc/profile.d/*.sh; do\n```\n\n####\
  \ 使用 Bash 特性匹配模式\n\n#### 字符范围\n\n与 `grep` 和正则表达式不同，我们有很多模式匹配可以直接在 shell 中完成实例，而无需使用外部程序。分别匹配任何单个文本或字符，为了特地匹配这两个字符，请在每个字符周围加上双引号：\n\
  \n```\nhsoub ~> touch \"*\"\n\nhsoub ~> ls \"*\"\n\n*\n```\n\n你可以使用方括号来匹配中括号内的任何字符或字符集，如果字符对是用破折线分隔的\
  \ - 参见下面的示例，它显示了用户主目录 `hsoub` 中所有以以下字符之一 `a`、`b`、`c`、`x`、`y`、`z` 开头的文件：\n\n```\n\
  hsoub ~> ls -ld [a-cx-z] *\n\ndrwxr-xr-x 2 hsoub hsoub 4096 Jul 20 2002 app-defaults\
  \ /\n\ndrwxrwxr-x 4 hsoub hsoub 4096 May 25 2002 arabic /\n\ndrwxrwxr-x 2 hsoub\
  \ hsoub 4096 Mar 4 18:30 bin /\n\ndrwxr-xr-x 7 hsoub hsoub 4096 Sep 2 2001 crossover\
  \ /\n\ndrwxrwxr-x 3 hsoub hsoub 4096 Mar 22 2002 xml /\n```\n\n如果括号中的第一个字符是 `!`\
  \ 或 `^`，它将匹配不在括号内的任何字符；要匹配破折线 `-`，请将其作为集合中的第一个或最后一个字符输入。分类取决于当前的区域（locale）和 `LC_COLLATE`\
  \ 变量的值，如果设置了某个值，请注意其他区域可能会将 `[a-cx-z]` 解释为 `[aBbCcXxYyZz]`。如果分类是字典顺序，且你想确保范围按照传统方式解释，请将\
  \ `LC_COLLATE` 或 `LC_ALL` 设置为 `C`。\n\n### 字符类型\n\n可以语言结构 `[: CLASS:]` 在方括号中指定字符类，其中\
  \ `CLASS` 在 POSIX 标准中定义，并具有以下值之一：`alnum`, `alpha`, `ascii`, `blank`, `cntrl`, `digit`,\
  \ `graph`, `lower`, `print`, `punct`, `space`, `upper`, `word`, `xdigit`。\n\n示例：\n\
  \n```\nhsoub ~> ls -ld [[: digit:]] *\n\ndrwxrwxr-x 2 hsoub hsoub 4096 Apr 20 13:45\
  \ 2 /\n```\n\n\n\n\n\n```bash\necho \"Your files are protected against accidental\
  \ overwriting using redirection.\"\nfi\n```\n\n## 环境\n\n当在命令行中输入上述示例时将执行：\n\n```\n\
  hsoub ~> if [-o noclobber]; then echo; echo \"your files are protected against overwriting.\
  \ \"; echo; fi\nyour files are protected against overwriting.\nhsoub ~>\n```\n\n\
  然而，如果你使用基于环境的测试，在将相同内容插入到 shell 脚本时，可能会得到不同的结果。程序将打开一个新的 shell，在那个 shell 中变量和选项可能不会被自动设置。\n\
  \n## if 语句的简单应用\n\n### 测试退出状态\n\n是否包含变量？根据上一个执行的命令的退出状态（界面中的最后一次操作）进行判断。以下示例展示了一个简单的测试：\n\
  \n```\nhsoub ~> if [$? -eq 0]\nMore input> then echo 'That was a good job!'\nMore\
  \ input> fi\nThat was a good job!\nhsoub ~>\n```\n\n这个示例显示了 `TEST-COMMAND` 可以是任何返回退出状态的\
  \ Unix 命令，如果 `if` 再次返回零退出状态：\n\n```bash\nhsoub ~> if! grep $USER /etc/passwd\nMore\
  \ input> then echo \"your user account is not managed locally\"; fi\nyour user account\
  \ is not managed locally\nhsoub> echo $?\n0\nhsoub>\n```\n\n可以通过以下方式获得相同的结果：\n\n\
  ```\nhsoub> grep $USER /etc/passwd\nhsoub> if [$? -ne 0]; then echo \"not a local\
  \ account\"; fi\nnot a local account\nhsoub>\n```\n\n### 数值比较\n\n下面的示例使用了数值比较：\n\
  \n```\nhsoub> num = `wc -l work.txt`\nhsoub> echo $num\n201\nhsoub> if [\"$num\"\
  \ -gt \"150\"]\nMore input> then echo; echo \"you've worked hard enough for today.\"\
  \nMore input> echo; fi\nyou've worked hard enough for today.\nhsoub>\n```\n\n这段代码会在每个周日通过\
  \ `cron` 执行，即使在周数是偶数时，也会提醒你清理垃圾桶：\n\n```bash\n#! /bin/bash\n# date 使用命令计算周数：\nWEEKOFFSET=$[($(date\
  \ + \"%V\")% 2)]\n# 考虑条件语句：如果有提醒，如果没有（即周数为），则给我们发送一条消息\n# 在任何其他结果情况下，该语句什么都不做。\n\
  if [$WEEKOFFSET -eq \"0\"]; then\n  echo \"Sunday evening, put out the garbage cans.\"\
  \ | mail -s \"Garbage cans out\" your@your_domain.org\nfi\n```\n\n### 文本比较\n\n这是一个测试用户\
  \ ID 的文本比较示例：\n\n```bash\nif [\"$(whoami)\" != 'root']; then\n  echo \"You have\
  \ no permission to run $0 as non-root user.\"\n  exit 1;\nfi\n```\n\n你可以使用 Bash\
  \ 简化这种结构，参考下面的示例，它代表了上一个测试中的压缩图像：\n\n```bash\n[\"$(whoami)\" != 'root'] && (echo\
  \ you are using a non-privileged account; exit 1)\n```\n\n指定 `||` - 即当测试失败时该做什么，就像\
  \ `&&` 表达式解释了测试成功时该做什么一样。此外，比较中也可以使用通配符：\n\n```\nhsoub> gender = \"male\"\nhsoub>\
  \ if [[\"$gender\" == m*]]\nMore input> then echo \"Pleasure to meet you, Sir.\"\
  ; fi\nPleasure to meet you, Sir.\n```\n\n## 真正的程序员\n\n大多数程序员倾向于使用 `test` 命令，这等同于使用方括号进行比较。请参考以下示例：\n\
  \n```bash\ntest \"$(whoami)\" != 'root' && (echo you are using a non-privileged\
  \ account; exit 1)\n```\n\n### exit 命令\n\n如果你在子 shell 中调用 `exit` 命令，它不会将变量传递给父 shell。如果你不想让\
  \ Bash 打开子 shell，请用 `{}` 代替 `()`。\n\n\n\n\n\n```bash\nFILENAME = \"$ 1\"\n\necho\
  \ \"Properties for $ FILENAME:\"\n\nif [-f $ FILENAME]; then\n  echo \"Size is $\
  \ (ls -lh $ FILENAME | awk '{print $ 5}')\"\n  echo \"Type is $ (file $ FILENAME\
  \ | cut -d\": \"-f2 -)\"\n  echo \"Inode number is $ (ls -i $ FILENAME | cut -d\"\
  \ \"-f1 -)\"\n  echo \"$ (df -h $ FILENAME | grep -v Mounted | awk '{print\" On\
  \ \", $ 1\", which is mounted as the \", $ 6,\" partition. '} ')\"\nelse\n  echo\
  \ \"File does not exist.\"\nfi\n```\n\n注意，在这种情况下，使用程序的第一个参数来引用文件。文件位置在程序开始时保存在变量中，通过使用这些变量指示其内容，因此你不需要在程序中多次修改文件名。\n\
  \n#### 包含空格的文件名\n\n如果 `$1` 的值可以解析为多个单词，之前的示例将会失效，但可以通过在文件名周围加上双引号或使用 `[]` 代替 `[]`\
  \ 来修复。\n\n### if then / elif / else\n\n`if` 的完整结构如下：\n\n```bash\nif TEST-COMMANDS;\
  \ then\n  CONSEQUENT-COMMANDS;\nelif MORE-TEST-COMMANDS; then\n  MORE-CONSEQUENT-COMMANDS;\n\
  else\n  ALTERNATE-CONSEQUENT-COMMANDS;\nfi\n```\n\n首先执行 `TEST-COMMANDS` 测试顺序。如果返回状态为零，则执行相关的命令。执行与其伴随的\
  \ `\"MORE-CONSEQUENT-COMMANDS\"` 命令中的一个，然后命令完成。\n\n如果 `else` 后面跟着一个 `ALTERNATE-CONSEQUENT-COMMANDS`\
  \ 列表，且 `if` 或 `elif` 语句中最后一个条件的最后一个执行顺序状态非零，则执行替换顺序列表，返回状态为最后一个执行顺序的退出状态；如果没有满足顺序给出的任何条件，则为零。\n\
  \n如果未给 `exit` 命令提供参数，父 shell 将使用当前值作为 `$?` 变量。\n\n#### 示例\n\n这是一个你可以放入 `crontab`\
  \ 文件中每天执行的示例：\n\n```bash\nhsoub /etc/cron.daily> cat disktest.sh\n\n#! / bin / bash\n\
  \n# This software performs a simple hard drive test.\n\nspace = `df -h | awk '{print\
  \ $ 5}' | grep% | grep -v Use | sort -n | tail -1 | cut -d \"%\" -f1 -`\nalertvalue\
  \ = \"80\"\n\nif [\"$ space\" -ge \"$ alertvalue\"]; then\n  echo \"At least one\
  \ of my disks is nearly full!\" | mail -s \"daily diskcheck\" root\nelse\n  echo\
  \ \"Disk space normal\" | mail -s \"daily diskcheck\" root\nfi\n```\n\n### 嵌套 if\
  \ 语句\n\n`if` 语句可以在任何其他 `if` 中内部嵌套任意深度，只要你可以控制它。这里有一个测试闰年的示例：\n\n```bash\nhsoub ~\
  \ / testdir> cat testleap.sh\n\n#! / bin / bash\n\n# This program will inspect this\
  \ year to see if we are in a leap year.\nyear = `date +% Y`\nif [$ [$ year% 400]\
  \ -eq \"0\"]; then\n  echo \"This is a leap year. February has 29 days.\"\nelif\
  \ [$ [$ year% 4] -eq 0]; then\n  if [$ [$ year% 100] -ne 0]; then\n    echo \"This\
  \ is a leap year, February has 29 days.\"\n  else\n    echo \"This is not a leap\
  \ year. February has 28 days.\"\n  fi\nelse\n  echo \"This is not a leap year. February\
  \ has 28 days.\"\nfi\n\nhsoub ~ / testdir> date\nTue Jan 14 20:37:55 CET 2003\n\
  hsoub ~ / testdir> testleap.sh\nThis is not a leap year.\n```\n\n### 逻辑操作\n\n之前的程序可以使用逻辑运算符与\
  \ (`&&`）和或 (`||`）来总结。\n\n```bash\n#! / bin / bash\n\n# Check this program to know\
  \ if we are in a leap year\nyear = `date +% Y`\n\nif (((\"$ year\"% 400) == \"0\"\
  )) || (((\"$ year\"% 4 == \"0\") && (\"$ year\"% 100! = \"0\"))); then\n  echo \"\
  This is a leap year. Don't forget to charge the extra day!\"\nelse\n  echo \"This\
  \ is not a leap year.\"\nfi\n```\n\n我们在之前的示例中使用双括号来测试数学表达式，请参阅 Bash 分离展开（separation\
  \ of expansions）中的数学展开，这等同于 `let`。不要在此处使用方括号或尝试像 `[400% year $]` 这样的操作，因为这里的方括号并不是真的。你可能还想使用根据你正在编写的语言支持不同颜色方案的文本编辑器，因为它们对于识别代码中的错误很有用，其中一个是\
  \ `gvim`，但你也会发现 `kwrite` 等其他的。\n\n### 在 if 中使用 exit 语句\n\n我们首先识别了 `exit` 语句，它终止程序的整个执行，通常在用户请求错误、语句未被成功执行或发生其他错误时使用。`exit`\
  \ 语句接受一个可选参数，即退出状态的数字符号，该符号被传回父 shell 并存储在 `$?` 变量中。当参数值为零时，意味着程序执行成功，程序员可以使用任何其他值向父\
  \ shell 传递不同的消息，以便根据子进程的失败或成功采取不同的行动。如果未给 `exit` 命令提供参数，父 shell 将使用当前值作为 `$?` 变量。\n\
  \n这是一个 `penguin.sh` 的示例，通过细微修改进行解释，将其退出状态发送到 `feed.sh` 所在的父 shell：\n\n```bash\n\
  hsoub ~ / testdir> cat penguin.sh\n\n#! / bin / bash\n\n# (Tux) This program allows\
  \ you to serve food to the penguin\n# The penguin will only be happy when a fish\
  \ is given\n# We've also added dolphin and camel options.\n\nif [\"$ menu\" == \"\
  fish\"]; then\n  if [\"$ animal\" == \"penguin\"]; then\n    echo \"Hmmmmmm fish\
  \ ... Tux is happy!\"\n  elif [\"$ animal\" == \"dolphin\"]; then\n    echo \"Pweetpeettreetppeterdepweet!\"\
  \n  else\n    echo \"* prrrrrrrt *\"\n  fi\nelse\n  if [\"$ animal\" == \"penguin\"\
  ]; then\n    echo \"Hmmmmmm fish ... Tux is happy!\"\n    exit 1\n  elif [\"$ animal\"\
  \ == \"dolphin\"]; then\n    echo \"Pweetpeettreetppeterdepweet!\"\n    exit 2\n\
  \  else\n    echo \"Wait!\"\n    exit 3\n  fi\nfi\n```\n\n下面的示例通过 `menu` 和 `animal`\
  \ 变量调用 `penguin.sh`:\n\n```bash\nhsoub ~ / testdir> cat feed.sh\n\n#! / bin / bash\n\
  \n# penguin.sh This program follows the status it gives\nexport menu = \"$1\"\n\
  export animal = \"$2\"\n\ncase $menu in\n  fish)\n    if [ \"$animal\" == \"penguin\"\
  \ ]; then\n      echo \"Hmmmmmm fish ... Tux is happy!\"\n    elif [ \"$animal\"\
  \ == \"dolphin\" ]; then\n      echo \"Pweetpeettreetppeterdepweet!\"\n    else\n\
  \      echo \"* prrrrrrrt *\"\n    fi\n    ;;\n  *)\n    echo \"I don't have that\
  \ food.\"\n    ;;\nesac\n```\n\n运行示例：\n\n```bash\nhsoub ~ / testdir> ./feed.sh fish\
  \ penguin\nHmmmmmm fish ... Tux is happy!\n\nhsoub ~ / testdir> ./feed.sh fish dolphin\n\
  Pweetpeettreetppeterdepweet!\n\nhsoub ~ / testdir> ./feed.sh fish camel\n* prrrrrrrt\
  \ *\n\nhsoub ~ / testdir> ./feed.sh meat penguin\nI don't have that food.\n```\n\
  \n退出状态码可以自由选择，如所示，`exit` 命令通常有一系列特定的代码。\n\n### 使用 case 结构\n\n简化 case\n\n使用 `if`\
  \ 语句由于其直观的可能很容易，但当你遇到几种可能的行动选择时，这种便利就会变成混乱。在这种情况下我们使用 `case`，其语言结构如下：\n\n```bash\n\
  case EXPRESSION in\n  CASE1) COMMAND-LIST ;;\n  CASE2) COMMAND-LIST ;;\n  ...\n\
  \  CASEN) COMMAND-LIST ;;\nesac\n```\n\n之前表达式中的每个 `case` 匹配一个模式，执行第一个匹配的 `COMMAND-LIST`\
  \ 列表，并使用管道符号 `|` 分隔多个模式，终止参数（样式列表，每个条目必须以两个分号结束；任何 case 以 `esac` 结束）。参见以下示例，通过 `Case`\
  \ 语句发送更多样化的警告消息：\n\n```bash\nhsoub ~ / testdir> cat disktest.sh\n\n#! / bin / bash\n\
  \n# This program performs a simple hard disk space test.\nspace = `df -h | awk '{print\
  \ $ 5}' | grep% | grep -v Use | sort -n | tail -1 | cut -d \"%\" -f1 -`\n\ncase\
  \ $ space in\n  [1-6] *)\n    Message = \"All is quiet.\"\n    ;;\n  [7-8] *)\n\
  \    Message = \"Start thinking about cleaning out some stuff. There's a partition\
  \ that is $ space% full.\"\n    ;;\n  9 [1-8])\n    Message = \"Critical! Disk space\
  \ is very full!\"\n    ;;\n  99)\n    Message = \"Disk space is completely full!\"\
  \n    ;;\nesac\n\necho $Message\n```\n\n\n\n\n\n```bash\nMessage = \"快点处理那个新磁盘 ...\
  \ 有一个分区的使用率已达到 $ space%。\"\n  ;;\n99)\n  Message = \"我快被淹死了！有一个分区的使用率达到了 $ space%！\"\
  \n  ;;\n*)\n  Message = \"我似乎在某种不存在的磁盘空间上运行 ...\"\n  ;;\nesac\n```\n\n`echo $ Message\
  \ | mail -s \"磁盘报告日期\" \"hsoub\"`\n\n`hsoub ~ / testdir>`\n你有一封新邮件。\n\n`hsoub ~\
  \ / testdir> tail -16 /var / spool / mail / hsoub`\n\n```text\nFrom hsoub @ alaraby\
  \ Tue Jan 14 22:10:47 2003\nReturn-Path: <hsoub @ alaraby>\nReceived: from alaraby\
  \ (localhost [127.0.0.1])\n        by alaraby (8.12.5 / 8.12.5) with ESMTP id h0ELAlBG020414\n\
  \        for <hsoub @ alaraby>; Tue, 14 Jan 2003 22:10:47 +0100\nReceived: (from\
  \ hsoub @ localhost)\n        by alaraby (8.12.5 / 8.12.5 / Submit) id h0ELAltn020413\n\
  \        for hsoub; Tue, 14 Jan 2003 22:10:47 +0100\nDate: Tue, 14 Jan 2003 22:10:47\
  \ +0100\nFrom: Hsoub <hsoub @ alaraby>\nMessage-Id: <200301142110.h0ELAltn020413@alaraby>\n\
  To: hsoub @ alaraby\nSubject: 磁盘报告 Tue Jan 14 22:10:47 CET 2003\n```\n\n开始考虑清理一些东西。有一个分区的使用率已达到\
  \ 87%。\n\n`hsoub ~ / testdir>`\n你可以打开邮件客户端检查结果，但这个示例是为了展示程序会发送包含收件人、主题和发件人的完整邮件信息。你可以在初始化代码文件夹中找到许多使用\
  \ case 语句的示例。启动脚本使用 `start` 和 `stop` 语句来运行或停止系统进程，你可以在下方看到一个理论示例。\n\n### 示例 initscript\n\
  \n初始化代码使用 `case` 语句来启动和停止系统服务，并查询它们。在下面的示例中，它是启动 Anacron 服务程序的一部分，该服务是一个根据天数间隔定期执行命令的守护进程。\n\
  \n```bash\ncase \"$1\" in\n    start)\n        start\n      ;;\n    stop)\n    \
  \    stop\n      ;;\n    status)\n        status anacron\n      ;;\n    restart)\n\
  \        stop\n        start\n      ;;\n    condrestart)\n        if test \"x`pidof\
  \ anacron`\"! = x; then\n            stop\n            start\n        fi\n     \
  \ ;;\n  *)\n        echo \"用法: $0 {start | stop | restart | condrestart | status}\"\
  \n        exit 1\nesac\n```\n\n要执行的任务（例如开启和关闭精灵）定义在函数内部，其源码部分位于 `etc/rc.d/init.d`。\n\
  \n# 第五章：Bash 中的重复任务\n\n在本节中，你将学习如何将重复命令合并为循环，以及如何使用 `for` 或 `while` 语句构建重复循环。`for`\
  \ 循环执行特定次数的任务。`while` 语句指定循环何时停止。循环可以使用 `break` 和 `continue` 语句来中断或重复循环，并且可以使用文件作为循环的输入。循环还可以通过管道从命令中读取输出。你还将学习如何使用\
  \ `select` 结构在交互式脚本中打印列表，以及如何使用 `shift` 语句在迭代中执行命令。\n\n## Bash 中的 for \n\n### 如何制作循环\n\
  \n`for` 循环是三个迭代单元中的第一个，它允许分配值列表，并为每个值执行一组命令列表。该循环的语言结构如下：\n\n```bash\nfor NAME in\
  \ LIST; do\n    COMMANDS\ndone\n```\n\n如果 `LIST` 不存在，`in` 将被 `it` 替换，并为每个设置为值的位置执行一次\
  \ `COMMANDS`。返回状态是最后一个执行命令的退出状态，如果 `LIST` 没有展开为任何元素，则返回状态为零。`NAME` 可以是任何变量（尽管经常使用\
  \ `i`），而 `LIST` 可以由任何单词、文本或数字组成，这些内容可以由任何命令生成。同样，为每个值执行的 `COMMANDS` 可以是任何系统命令、shell\
  \ 语句或脚本。当第一个循环开始时，`NAME` 被设置为 `LIST` 中的第一个项，它的值在第二次运行时变为第二个项，依此类推。当 `NAME` 遍历完列表中的所有值时，迭代循环结束。\n\
  \n#### 示例\n\n#### 使用命令选择项目\n\n第一个示例是一个命令行，显示如何使用 `for` 循环为每个 `.xml` 文件创建备份，在命令发布后你可以安全地处理源文件：\n\
  \n```bash\nfor i in *.xml; do\n    cp \"$i\" \"$i\".bak\ndone\n```\n\n```text\n\
  file1.xml file1.xml.bak\nfile2.xml file2.xml.bak\nfile3.xml file3.xml.bak\n```\n\
  \n这个示例显示了使用 `for` 循环在 `/sbin` 文件夹中处理纯文本文件：\n\n```bash\nfor i in *.xml; do\n    cp\
  \ \"$i\" \"/sbin/$i\"\ndone\n```\n\n#### 使用变量选择项目\n\n以下是一个转换 HTML 文件的特定程序，它通过删除前\
  \ 25 行并添加头部和页脚：\n\n```bash\n#!/bin/bash\n# 转换 html\nLIST=\"$(ls *.html)\"\nfor i\
  \ in \"$LIST\"; do\n    NEWNAME=$(echo \"$i\" | sed 's/.html$/php/')\n    cat begin\
  \ > \"$NEWNAME\"\n    cat footer >> \"$NEWNAME\"\ndone\n```\n（注：此处根据原文逻辑对调了示例中代码的描述顺序，原文中示例代码与描述较为杂乱，此处还原了其逻辑意图）\n\
  \n使用 `tac` 来解决问题，否则我们无法在删除之前知道开始的行号。\n\n### Basename 命令\n\n最好使用 `basename` 命令将 html\
  \ 后缀更改 `php`。更多信息请参见手册页。\n\n### 异常字符\n\n如果你展开带有空格或其他异常字符的文件名列表，解决方案是在 shell 中使用通配符，如下：\n\
  \n```bash\nfor i in PATHNAME/*; do\n    commands\ndone\n```\n\n## Bash 中的 while\
  \ 循环\n\n### 如何制作 while 循环\n\n迭代 `while` 循环允许只要 `while` 循环中的命令执行成功（退出零），就重复执行命令列表。其结构如下：\n\
  \n```bash\nwhile CONTROL-COMMAND; do\n    CONSEQUENT-COMMANDS\ndone\n```\n\n`CONTROL-COMMAND`\
  \ 控制循环，表示任何失败或成功的命令，而将重复的 `CONSEQUENT-COMMANDS` 可以是任何 shell 程序或结构。循环在控制命令失败后立即退出，如果循环在概率程序中，后续命令将在循环结束后执行。返回状态与最后一个执行的命令（`CONSEQUENT-COMMANDS`）的退出状态相同，如果没有执行顺序，则为零。\n\
  \n#### 示例\n\n简单的使用 while\n\n这是一个使用 `while` 循环的简单示例：\n\n```bash\n#!/bin/bash\n# 该程序打开四个终端窗口\n\
  i=\"0\"\nwhile [ $i -lt 4 ]; do\n    xterm &\n    i=$((i + 1))\ndone\n```\n\n###\
  \ 嵌套 while 循环\n\n下面的示例用于将摄像头拍摄的图像复制到网络服务器上的文件夹中。它每五分钟拍摄一张照片，每小时创建一个包含该小时图像的新文件夹，每天创建一个带有\
  \ 24 个子文件夹的文件夹。该程序在后台运行：\n\n```bash\n#!/bin/bash\n# 该程序将文件从我的主目录复制到网络服务器文件夹\n# (使用远程文件夹\
  \ ssh 和 scp 密钥)\n```\n\n\n\n\n\n# 每小时创建一个新文件夹\n\n`PICSDIR = /home/hsoub/pics`\n\n\
  `WEBDIR = /var/www/hsoub/webcam`\n\n```bash\nwhile true; do\n  DATE = `date +%Y%m%d`\n\
  \  HOUR = `date +%H`\n  mkdir $WEBDIR / \"$DATE\"\n  while [$HOUR -ne \"00\"]; do\n\
  \    DESTDIR = $WEBDIR / \"$DATE\" / \"$HOUR\"\n    mkdir \"$DESTDIR\"\n    mv $PICDIR\
  \ / *.jpg \"$DESTDIR\" /\n    sleep 3600\n    HOUR = `date +%H`\n  done\ndone\n\
  ```\n\n注意 `true` 的使用，这意味着：持续执行，直到进程被强制中断（通过 `kill` 命令或 `Ctrl + c`）。接接的示例创建了文件，可以用于模拟测试：\n\
  \n```bash\n#!/bin/bash\n\n# 此程序每五分钟创建一个文件\n\nwhile true; do\n    touch pic-`date\
  \ +%s`.jpg\n    sleep 300\ndone\n```\n\n注意你使用 `date` 命令来创建不同类型的文件和文件夹名称。\n\n使用系统\n\
  \n上面的示例仅用于解释，可以使用 `cron` 工具进行定期检查。当从你的 `crontab` 文件中执行程序时，不要忘记重定向输出和错误信息！\n\n##\
  \ 使用键盘输入控制 while 循环\n\n以下程序在用户输入 `ctrl + c` 时可以被用户解释：\n\n```bash\n#!/bin/bash\n\n\
  # 此程序打印示例和提示\n\nFORTUNE = /usr/games/fortune\n\nwhile true; do\n  echo \"你想听哪个主题的建议？\"\
  \n  cat << topics\npolitics\nstartrek\nkernelnewbies\nsports\nbofh-excuses\nmagic\n\
  love\nliterature\ndrugs\neducation\ntopics\n  echo\n  echo -n \"请做出你的选择:\"\n  read\
