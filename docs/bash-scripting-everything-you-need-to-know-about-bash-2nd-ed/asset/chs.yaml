  \ 35: *. Png = 01; 35: *. Tif = 01; 35:\nMACHINES = hsoub\nMAILCHECK = 60\nMAIL\
  \ = / var / mail / wiki\nMANPATH = / usr / man: / usr / share / man /: / usr / local\
