  \n<- no output ->\n\nwiki ~>\n```\n\n#### 导出变量\n\n如上例生成的变量仅在当前 shell 中可用，它是一个局部变量，当前\
  \ shell 的子进程不会识别此变量。\n\n为了将变量传递给子壳（sub-shell），我们必须先使用 `export` 命令对其进行导出。被导出的变量被称为环境变量。\n\
  \n```bash\nexport VARNAME = \"value\"\n```\n\n子壳 可以修改你从父 shell 获取的变量，但这些更改不会影响父\
  \ shell。这里有一个解释性示例：\n\n```bash\nwiki ~> full_name = \"Wiki Hsoub\"\n\nwiki ~> bash\n\
  \nwiki ~> echo $ full_name\n\nwiki ~> exit\n\nwiki ~> export full_name\n\nwiki ~>\
  \ bash\n\nwiki ~> echo $ full_name\n\nWiki Hsoub\n\nwiki ~> export full_name = \"\
  Osama H. Damarany\"\n\nwiki ~> echo $ full_name\n\nOsama H. Damarany\n\nwiki ~>\
  \ exit\n\nwiki ~> echo $ full_name\n\nWiki Hsoub\n```\n\n在上面的示例中，我们有一个值为 `Wiki Hsoub`\
  \ 的 `full_name` 变量，当我们尝试在子壳中读取该值时，我们得到一个空结果（`echo` 命令显示一个 `-null string` 字符串值）。\n\
  \n现在我们退出子壳并在父 shell 中导出 `full_name` 变量，然后打开一个新的子壳并再次请求 `full_name` 变量的值，这次我们得到了它的值（`Wiki\
  \ Hsoub`），因为该变量在导出后对子壳是可见的。\n\n如示例所示，我们可以在子壳内部更改变量的值为（`Osama H. Damarany`），但当我们退出该\
  \ shell 并返回母 shell 请求变量本身的值时，我们得到的是第一个值（`Wiki Hsoub`），在子壳内部修改并没有影响其在母 shell 中的值。\n\
  \n## `$` 和 `@` 之间的区别\n\n使用 `$` 可能会导致你的程序出现 bug 或漏洞，而且程序员几乎每次使用 `$` 时，它都意味着 `@`。\n\
  \n位置操作符（Topical operators）是跟在 shell 程序名称后面的单词。这些参数被放在变量 `$1`、`$2`、`$3` 等中。变量会根据需要被添加到内部数组中。\n\
  \n```bash\n#! / bin / bash\n\n# positional.sh\n\n# 此脚本读取 3 个位置参数并打印它们。\n\nPOSPAR1\
  \ = \"$ 1\"\n\nPOSPAR2 = \"$ 2\"\n\nPOSPAR3 = \"$ 3\"\n\necho \"$ 1 is the first\
  \ positional parameter, \\ $1.\"\n\necho \"$ 2 is the second positional parameter,\
  \ \\ $2.\"\n\necho \"$ 3 is the third positional parameter, \\ $3.\"\n\necho\n\n\
  echo \"The total number of positional parameters is $ #.\"\n```\n\n执行后，你可以添加任何数量的参数：\n\
  \n```bash\nwiki ~> positional.sh one two three four five\n\none is the first positional\
  \ parameter, $ 1.\ntwo is the second positional parameter, $ 2.\nthree is the third\
  \ positional parameter, $ 3.\nThe total number of positional parameters is 5.\n\n\
  wiki ~> positional.sh one two\n\none is the first positional parameter, $ 1.\ntwo\
  \ is the second positional parameter, $ 2.\nis the third positional parameter, $\
  \ 3.\nThe total number of positional parameters is 2.\n```\n\n在条件结构中评估这些参数，并在 Bash\
  \ 中使用 `Shift` 命令。这里是其他特殊参数的示例：\n\n```bash\nwiki ~> grep dictionary /usr/share/dict/words\n\
  dictionary\nwiki ~> echo $\n/usr/share/dict/words\nwiki ~> echo $$\n1062\nwiki ~>\
  \ mozilla &\n1064\nwiki ~> echo $!\n1064\nwiki ~> echo $0\nbash\nwiki ~> ls doesnotexist\n\
  ls: No file or directory\nwiki ~> echo $?\n```\n\n在上一个示例中，用户首先输入 `grep` 命令，结果值为\
  \ `_`，进程 ID 为 `1062`。它在后台保留了进程 ID，而这里运行的 shell 是 Bash，当发生错误时，会保持一个非 `0` 的退出码。\n\n\
  ## 使用变量回收 shell\n\n变量帮助你在其他环境或其他目的中应用 shell 脚本，并使程序更易读。参考以下示例，这是一个在远程服务器上对用户目录进行备份的简单程序：\n\
  \n```bash\n#! / bin / bash\n# 此程序复制主目录\ncd /home\n# 此命令创建归包\ntar cf /var/tmp/home_wiki.tar\
  \ /dev/null 2>&1\n# 删除旧的 bzip2 文件\n# 重定向错误，因为如果归包不存在将会产生错误，然后创建一个新的 zip 文件。\nrm\
  \ /var/tmp/home_wiki.tar.bz2\nbzip2 /var/tmp/home_wiki.tar\n# 将文件复制到另一个主机 - 我们有\
  \ ssh 密钥来完成，不受干扰。\nscp /var/tmp/home_franky.bz2 /opt/backup/franky /dev/null 2>&1\n\
  # 在日志文件中创建时间戳。\ndate >> /home/wiki/log/home_backup.log\necho backup succeeded >>\
  \ /home/wiki/log/home_backup.log\n```\n\n大文件夹和低带宽网络：任何人都可以适应上述示例，我们在同一个子网内使用了小文件夹。然而，这种方法的速度取决于文件夹大小、互联网速度和服务器位置，创建备份可能花费很长时间。处理大文件夹的解决方案是使用\
  \ `rsync` 保持文件夹同步。\n\n## Bash 中的引号字符\n\n### 引用类型\n\n许多引号和单词在某种形式下具有特殊含义和功能，引号用于消除那种特定的含义或功能。Bash\
  \ 中的引号破坏了对特殊字符的处理，并防止了根据其含义对特殊单词进行扩展。\n\n### 转义字符\n\n转义字符用于取消单个字符的特殊含义，反斜杠 `\\`\
  \ 在 Bash 中用作转义字符。它保留下一个字符的直接含义，换行符除外；如果后面跟着换行符，它指定了超出宽行的完成。\n\n在下面的示例中，我们创建一个名为\
  \ `date` 的变量并给它赋值。每当调用 `date` 变量时，`echo` 命令会显示该值。当我们第二次使用 `\\` 字符时，`$` 标签被忽略，`echo`\
  \ 命令以纯文本形式打印：\n\n```bash\nwiki ~> date = 20021226\nwiki ~> echo $ date\n20021226\n\
  wiki ~> echo \\ $ date\n$ date\n```\n\n#### 单引号\n\n\n\n\n\n单引号 `''` 用于保留引号内每个字符的字面值，且即使在单引号前面有斜杠，两个单引号之间也不会出现单引号。我们继续上一个示例：\n\
  \n```\nhsoub ~> echo '$ date'\n$ date\n```\n\n#### 双引号\n\n双引号用于保留其之间所有字符的字面值，但 `$`\
  \ 符号、单反引号（`` ` ``）和反斜杠除外。\n\n`$` 美元符号和单反引号 `` ` `` 在双引号内保留它们原有的功能。\n\n反斜杠在引号内不保留其原有功能，除非它后面跟着\
  \ `$`、`\"`、`\\` 或换行符；如果反斜杠后面跟着其中之一，反斜杠将从输入中省略。它们会被原样保留供解释器处理。\n\n两个双引号也可以用于两个双引号标签内部，请参见以下示例以进一步说明：\n\
  \n```\nhsoub ~> echo \"$ date\"\n20021226\n\nhsoub ~> echo \"` date``\nSun Apr 20\
  \ 11:22:06 CEST 2003\n\nhsoub ~> echo \"I'd say: \\\" Go for it! \\ \"\"\nI'd say:\
  \ \"Go for it!\"\n\nhsoub ~> echo \"\\\"\nMore input> \"\n\nhsoub ~> echo \"\\\\\
  \"\n\\\n```\n\n### ANSI-C 引用\n\n在 `''` STRING `'$'` 格式中的单词会被特殊处理。该单词会被扩展为文本（字符串），替换\
  \ ANSI-C 标准中定义的被斜杠忽略的字符。有关反斜杠转义序列，请参见 Bash 文档。\n\n### 区域 (Locales)\n\n当文本前面有一个带有\
  \ `$` 符号的双引号时，它将根据区域设置（Locale）进行翻译，翻译后的文本也会放在双引号之间。如果区域为 `C` 或 `POSIX`，则 `$` 符号被忽略。\n\
  \n### Bash 中的扩展\n\n### 扩展的大括号 {}\n\n方括号的扩展是一种可以创建任意字符串的机制。执行方括号扩展的模式是一个可选的前导部分，后跟一系列由逗号分隔的文本。`{}`。接着是一个可选的后缀。初始化置于括号内每个文本的开头——在扩展之后——然后脚注也会从左到右附加到每个文本的末尾。\n\
  \n大括号扩展可能会重叠，但这并不意味着结果可以排序，但顺序保持从左到右，请参见以下示例进行说明：\n\n```\nhsoub ~> echo sp {el,\
  \ il, al} l\nspell spill spall\n```\n\n方括号的扩展在任何其他扩展之前执行，并且结果会保留与其它扩展具有特殊含义的字符，因为这种扩展完全是文本的。此外，为了避免不一致，文本\
  \ `} $` 对于扩展方括号是无效的。\n\n方括号的扩展必须包含互不加引号的方括号和一个逗号，其中至少一个不在引号内，且与该公式不同，任何方括号的扩展将保持原样。\n\
  \n### 长度扩展 (~)\n\n如果一个单词以没有引号的点 `~` 开头，则到第一个没有引号的斜杠 `/` 之前的所有字符（如果没有没有引号的斜杠，则是所有字符）都被视为术语的介绍（波浪前缀）。如果波浪前缀是登录名，如果没有前缀字符包含在引号中，如果该登录名为空，则持续时间替换为\
  \ `HOME` 变量的值；如果 `HOME` 变量未设置任何值，则使用执行 shell 的用户主目录，否则将前景替换为与登录名相关的家目录。\n\n如果前景是\
  \ `+ ~`，则 `PWD` 变量的值被取代。如果前景中点之后的字符是一个数字 `N`（可能）且前面有 `+` 或 `-`，则前景被替换为目录栈（Directory\
  \ Stack）中的相应元素，并将作为前景中点之后的字符调用的 `dirs` 命令的参数显示。如果点之后的字符是一个前面没有正负号的数字，则假设该数字是正数。同样地，如果登录名无效或扩展失败，该单词将保持原样。\n\
  \n变量赋值在以下之后进行检查：`:` 或 `=` 直接用于未在引号中的前缀，在这些情况下持续时间会被扩展，因此带有持续时间字符的文件名可以用在具有 `PATH`、`MAILPATH`\
  \ 和 `CDPATH` 变量的赋值中，并且巧合会设置扩展值。\n\n示例：\n\n```\nhsoub ~> export PATH = \"$ PATH:\
  \ ~ / testdir\"\n```\n`Testdir / ~` 将扩展为 `$ HOME / testdir`，所以如果 `$ HOME` 是 `var\
  \ / home / hsoub /`，则 `var / home / hsoub / testdir /` 文件夹将被添加到 `PATH` 变量的内容中。\n\
  \n系数和变量扩展\n\n`$` 符号前面是参数扩展、命令替换和算术扩展。要扩展的参数名称或其符号可以位于方括号中且是可选的，但它保护了将被扩展的变量免受后续字符的影响。它是名称的一部分。当使用方括号时，弧的第二个端点是第一个\
  \ `{`（未被反斜杠 `\\` 逃入），位于引号文本之间、嵌入的算术扩展内部、替换的命令内部或系数扩展中。\n\n参数扩展的基础像是 `${PARAMETER}`，`PARAMETER`\
  \ 的值会被替换，当 `PARAMETER` 后面跟着一个可以操作的字符时，括号是必要的。\n\n如果 `PARAMETER` 的第一个参数是感叹号，Bash\
  \ 将使用 `PARAMETER` 的剩余部分作为变量名，而不是 `PARAMETER` 本身。这被称为间接扩展，与在简单情况下发生的直接扩展不同，例如上一个情况：\n\
  \n```\nhsoub ~> echo $ SHELL\n/ bin / bash\n```\n\n以下示例用于间接扩展：\n\n```\nhsoub ~>\
  \ echo $ \\! *}\nNNTPPORT NTPSERVER NPX_PATH\n```\n\n注意这与 `echo $ N` 不同，`${VAR=\
  \ value}` `$` 结构允许在变量尚未创建时创建它，请参见以下示例进行说明：\n\n```\nhsoub ~> echo $ HSOUB\nhsoub\
  \ ~> echo $ {HSOUB:= Hsoub}\nHsoub\n```\n\n特殊事务和其他事务不能以这种方式赋值。我们将讨论变量处理中的方括号。\n\n\
  #### 命令替换\n\n命令替换允许命令的输出替换命令本身，命令替换发生在顺序符合以下格式时：`(command) $` 或使用单引号的以下格式：`: command`\n\
  \nBash 通过执行命令并将替换替换为命令的标准输出（删除任何尾随换行）来执行扩展。嵌入的新行不会被删除，但在分割单词时可能会被删除。\n\n```\nhsoub\
  \ ~> echo `date`\nThu Feb 6 10:06:20 CET 2003\n```\n\n在使用旧的反引号形式替换时，反斜杠保留其字面含义，除非它后面跟着\
  \ `$` 或 `` ` `` 符号；并且当使用 `$ COMMAND` 公式时，括号中的所有字符由命令组成，没有一个被特殊处理。\n\n命令覆盖也可以重叠，为了在使用反引号公式时创建重叠，请在斜杠前加上反斜杠。如果替换出现在双引号中，则文件名将根据结果进行扩展。\n\
  \n\n\n\n\n\n算术扩展允许对算术表达式进行求值和算术运算，算术扩展的公式为 `$(arithmetic expression)`。表达式中的所有单位都受到系数扩展、顺序替换和引用移除的影响，且计算替换可以重叠。\n\
  \n算术表达式在固定宽整数中求值，不会丢失溢出，尽管除以零会被捕获并定义为错误，且操作符与 C 编程语言中的几乎相同。\n\n#### 进程替换\n\n支持命名管道（`FIFOs`\
  \ 先进先出）或 `/dev/fd/file` 命名方法的系统支持进程替换，格式为：`(LIST)>` 或 `(LIST) <`。\n\n执行 `LIST` 进程，使其输入和输出连接到命名管道（`FIFO`）或\
  \ `/dev/fd/` 中的文件，结果文件名将作为中间媒介传递给当前命令。如果使用了 `LIST`，向文件写入内容将为 `LIST` 提供输入。如果使用了 `LIST`，必须读取作为中间媒介传递的文件以获取\
  \ `LIST` 的输出。注意，`<or>` 标签与左括号之间不应出现空格，否则该结构将被解释为重定向。\n\n进程替换尽可能与系数扩展、变量扩展、命令替换以及计算扩展结合使用。请参见转发和文件描述。\n\
  \n## 单词拆分\n\n匹配在寻找单词拆分时，会清除未落在双引号内的事务扩展、顺序替换和算术扩展的结果。shell 将每个内部字段分隔符或 `IFS` 字符\
  \ `$` 视为分隔符，并将其他扩展的结果根据这些字符划分为多个单词。`>` `<Table (tab)>` `<new line>`。具体而言，任何 `IFS`\
  \ 字符序列均可用于识别单词。\n\n如果 `IFS` 值不是默认值，则单词开头和结尾的空白字符和 `tab` 将被忽略，只要该空白字符位于 `IFS` 值中（即\
  \ `IFS` 变量的空白字符）。\n\n`IFS` 变量中的任何非空白字符都指定一个字段，以及任何邻近 `IF`（`IF` 内部字段）中的任何空白字符也是，且\
  \ `IFS` 分隔符的空白字符序列也被视为分隔符。如果 `IFS` 值为空，则不发生单词拆分。\n\n显式的空白参数（`''` `''` 或 `'' ''`）会被保留，而非值系数扩展导致的非引号隐式参数会被删除，当不带引号的系数扩展时，会产生并保留空文本。\n\
  \n### 单词的扩展与拆分\n\n如果没有扩展，则不会实现拆分。\n\n#### 扩展文件名\n\nBash 会在单词拆分后清除每个单词，除非字符 `*` 和\
  \ `?` 检查了 `-f` 选项。`)（参见 shell 部分的细化），如果没有出现这些字符中的任何一个，该单词就是一个 `PATTERN` 模式，并替换为与模式字母顺序对应的文件名列表。\n\
  \n如果不存在匹配的名称且禁用了 `nullglob` shell 选项，则单词保持不变。如果设置了 `nullglob` 选项且没有匹配，则单词将被删除。如果启用了\
  \ `nocaseglob` 选项，匹配将不区分字母大小执行。\n\n当使用模式生成文件名时，它是字体的。在文件名开头或斜杠之后，除非选择了 `dotglob`\
  \ 选项，否则必须显式匹配。在匹配文件名时，斜杠必须始终显式匹配。可能无法处理。特别是在某些情况下。\n\n`GLOBIGNORE` 变量可用于限制匹配模式的文件名集，即使\
  \ `GLOBIGNORE` 设置的值在匹配文件名列表中被省略。每个名称都匹配 `GLOBIGNORE` 中的一种样式。\n\n它们被忽略。即使设置了 `GLOBIGNORE`，文件名\
  \ `..` 也会被忽略，但在任何情况下，设置 `GLOBIGNORE` 都会激活 `dotglob` 选项，因此所有其他以 `.` 开头的文件。要恢复旧行为忽略以\
  \ `.` 开头的文件，请使 `*.` 成为 `GLOBIGNORE` 中的一种样式。当未设置 `GLOBIGNORE` 时，`dotglob` 选项被禁用。\n\
  \n## Bash 中的替代命令\n\n#### 实用程序替代命令\n\n`alias` 命令允许在作为简单命令的第一个单词时用单个单词替换字符串。shell\
  \ 保留了一个替代命令列表，可以通过 `alias` 和 `unalias` 命令进行设置和取消别名。在命令行输入 `alias` 可以查看当前 shell 定义的替代命令列表：\n\
  \n```\nhsoub: ~> alias\n\nalias .. = 'cd ..'\nalias ... = 'cd ../ ..'\nalias ....\
  \ = 'cd ../../ ..'\nalias PAGER = 'less -r'\nalias Txterm = 'export TERM = xterm'\n\
  alias XARGS = 'xargs -r'\nalias cdrecord = 'cdrecord -dev 0,0,0 -speed = 8'\nalias\
  \ e = 'vi'\nalias egrep = 'grep -E'\nalias ewformat = 'fdformat -n /dev/fd0u1743;\
  \ ewfsck '\nalias fgrep = 'grep -F'\nalias ftp = 'ncftp -d15'\nalias h = 'history\
  \ 10'\nalias fformat = 'fdformat /dev/fd0H1440'\nalias j = 'jobs -l'\nalias ksane\
  \ = 'setterm -reset'\nalias ls = 'ls -F --color = auto'\nalias m = 'less'\nalias\
  \ md = 'mkdir'\nalias od = 'od -ta'\nalias p = 'pstree -p'\nalias ping = 'ping -vc'\n\
  alias sb = 'ssh blubber'\nalias sl = 'ls'\nalias ss = 'ssh octarine'\nalias tar\
  \ = 'gtar'\nalias tmp = 'cd /tmp'\nalias unaliasall = 'unalias -a'\nalias vi = 'eval\
  \ `'\nalias vt100 = 'export TERM = vt100'\nalias which = 'type'\nalias xt = 'xterm\
  \ -bg'\n```\n\nhsoub ~>\n\n替代命令用于确定系统中多个默认版本，或指定默认选项，并用于纠正拼写。简单命令的第一个单词如果没有加引号则会被检查。替代命令名和替换文本可能包含\
  \ shell 元字符，替代命令名可以包含 `=`。替换文本的第一个单词也会扫描替代命令，但该单词在读取时递归扩展。如果替代命令值的最后一个字符是空格或制表符，则检查下一个单词的替代命令。如果\
  \ shell 不是交互式的，除非使用 `shopt` 设置了 `expand-aliases` 选项，否则不会扩展替代命令。\n\n#### 创建和删除替代命令\n\
  \n使用 `alias` 命令创建替代命令。要永久创建替代命令，请将其输入初始化文件。如果你在命令行输入了替代命令，它只会在当前 shell 中生效。\n\n\
  ```\nhsoub ~> alias dh = 'df -h'\n\nhsoub ~> dh\n\nFilesystem Size Used Avail Use%\
  \ Mounted on\n/ dev / hda7 1.3G 272M 1018M 22% /\n/ dev / hda1 121M 9.4M 105M 9%\
  \ / boot\n/ dev / hda2 13G 8.7G 3.7G 70% / home\n/ dev / hda3 13G 5.3G 7.1G 43%\
  \ / opt\nnone 243M 0 243M 0% / dev / shm\n/ dev / hda6 3.9G 3.2G 572M 85% /usr\n\
  / dev / hda5 5.2G 4.3G 725M 86% /var\n\nhsoub ~> unalias dh\n\nhsoub ~> dh\n\nbash:\
  \ dh: command not found\n\nhsoub ~>\n```\n\n\n\n\nBash 在执行该行上的任何命令之前，会至少读取一整行输入。替代命令（Alternative\
  \ commands）只有在命令被读取但未执行时才会展开，因此，在另一个命令的同一行上定义替代命令，在下一行输入之前不会生效。该行中位于替代命令定义之后的命令不受新替代命令的影响。这种行为在执行函数时也是一个问题。当读取但未执行一个新函数的定义时，替代命令会被展开，因为函数本身是一个复合命令。结果是，函数中指定的替代命令即使在函数执行后也是不可用的。但为了安全起见，请将替代命令设置放在单独的一行，并且不要在批量命令中使用\
  \ `alias` 命令。此外，子进程不会继承替代命令，且 Bourne shell 并不识别替代命令。\n\n#### 更快的函数\n\n替代命令是在函数之后被搜寻的，因此它们的解析速度较慢，尽管更容易理解，并且在几乎所有的用法中都倾向于使用\
  \ shell 函数而非替代命令。\n\n# 第三章：Bash 中的模式（Stereotypes）\n\n本章重点介绍 Bash 中用于匹配模式以及识别字符类和范围的功能。除了对正则表达式（Regular\
  \ Expressions）的详细介绍外，它们还是选择文件特定行或输出内容的强大工具，被 Unix 中的许多命令（如 `vim`、`perl`、`PostgreSQL`\
  \ 数据库等）使用，并可以使用外部库添加到任何语言或应用程序中。你甚至在非 Unix 系统上发现它们，因为 Windows Office 软件包中的 Excel\
  \ 表使用了它们。\n\n你还将学习 `grep`，它在任何 Unix 环境中都是不可或缺的，因为它提供的可能性比本章将解释的要得多，在本章中仅将其作为模式的示例。\n\
  \n### 正则表达式\n\n正则表达式是一种描述字符串集合的方法。这些模式是类似于算术表达式构建的，使用多个系数来组合较小的表达式。最小的模块化结构是匹配单个字符的结构。大多数字符（包括所有字母和数字）只是匹配自身的典型表达式，而任何具有特殊含义的特殊字符（元字符）都可以用反斜杠进行引用。\n\
  \n## 基础模式与扩展模式的区别\n\n以下特殊字符在基础正则表达式（Basic Regular Expression）中失去意义：`,`、`+`、`{`、`|`、`(`、`)`，而是使用带有反斜杠缀的相同字符来代替：`\\\
  `、`\\+`、`\\{`、`\\|`、`\\(`、`\\)`。请查看系统文档以确定哪些命令支持扩展表达式的模式。\n\n## Grep 命令\n\n`grep`\
  \ 命令搜索输入文件中包含特定模式列表匹配的行。当它在某行找到匹配项时，默认将该行复制到标准输出，或者通过你添加到命令的选项输出到所需的任何其他输出。\n\n\
  尽管 `grep` 命令期望匹配文本，但除了可用内存外，它对输入长度没有限制，并且可以匹配内的任意字符，尽管输入文件的最后一个字节不是换行符，`grep` 也会自动添加。此外，文本中的换行字符无法被匹配，因为换行是样式列表的分符。以下是一些示例：\n\
  \n```\nhsoub ~> grep root / etc / passwd\nroot: x: 0: 0: root: / root: / bin / bash\n\
  operator: x: 11: 0: operator: / root: / sbin / nologin\n```\n\n```\nhsoub ~> grep\
  \ -n root / etc / passwd\n1: root: x: 0: 0: root: / root: / bin / bash\n12: operator:\
  \ x: 11: 0: operator: / root: / sbin / nologin\n```\n\n```\nhsoub ~> grep -v bash\
