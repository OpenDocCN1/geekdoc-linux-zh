  \ Windows 应用程序中的“关于”（About）框就是一个模态窗口。 |\n\n## Note\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
