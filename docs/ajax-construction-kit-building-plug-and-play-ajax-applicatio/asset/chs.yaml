  \ |\n\n## 附录 A. Ajax 的过去、现在与未来\n\n也许你完全不在乎 Ajax 从何而来，但以防你真的在意，我想一小小的历史课可能是值得的。通过更多地了解\
  \ Ajax 的起源，希望你能够更有能力地评估它在未来 Web 开发中将扮演的角色。这是一个非常令人兴奋的技术，但在许多方面仍然处于探索阶段。那么，Ajax 究竟从哪里来，又将走向何方呢？让我们揭秘吧。\n\
  \n### Ajax 之路\n\n说到底，Ajax 只是一个用来描述现有技术特定应用的术语。这种特定应用已经存在了几年，但直到 2005 年 2 月才被赋予了一个响亮的名字。这个名字的人是\
  \ Jesse James Garrett，他需要一种更高效的方式向其雇主 Adaptive Path 的客户描述一种 Web 解决方案。Ajax 这个名字某天在洗澡时击中了\
  \ Garrett 的灵感，并固定了下来。人们开始认为 Ajax 实际上是一个缩写（AJAX），代表 Asynchronous JavaScript and XML（异步\
  \ JavaScript 和 XML），但事实并非完全如此。虽然 Ajax 这个名字确实指的是涉及异步 JavaScript 和 XML 的开发方法，但“Ajax”一词严格来说并不是一个缩写。\n\
  \n惊讶的是，通往 Garrett 响亮名字的道路可以追溯到微软的 Remote Scripting（远程脚本）技术，该技术于 1998 年在 Internet\
  \ Explorer 4 和 Netscape Navigator 4 中正式引入。利用微软 Remote Scripting 技术的功能性应用是 Outlook\
  \ Web Access，这在当时绝对是开创性的。再往前回溯几年，`iframe`（Internet Explorer）和 `layer`（Netscape Navigator）元素早在\
  \ 1996 年就支持 Web 内容的异步加载。`iframe` 和 `layer` 元素结合巧妙的 JavaScript 代码，引入了动态 HTML（或 DHTML）的概念，这一概念在\
  \ Ajax 技术出现之前的几几年里非常流行。\n\nAjax 的真正诞生发生在 2000 年，当时微软在 Internet Explorer 5 中添加了 `XMLHTTPRequest`\
  \ 对象。该技术又花了几年时间才成熟到可以一致使用的程度，即便如此，也需要一个突破性的应用才能让每个人真正看到 Ajax 的威力。\n\n\n\n\n\nAjax\
  \ 的真正诞生于 2000 年，当时微软将 `XMLHTTPRequest` 对象添加到 Internet Explorer 5 中。这项技术又过了几年才成熟到可以一致使用的程度，即便如此，也直到一个突破性的应用出现，大家才真正看到了\
  \ Ajax 的威力。\n\n### 第三部分：附录\n\n| 附录 |\n| :--- |\n| [附录 A] Ajax 的过去、现在与未来 |\n| [附录\
  \ B] 快速粗略 XMLHttpRequest 参考 |\n| [附录 C] 使用 Live Linux CD |\n\n## 附录 A. Ajax 的过去、现在与未来\n\
  \n也许你完全不在乎 Ajax 从哪里来，但以防万一你感兴趣，我认为一小段历史可能是值得的。通过进一步了解 Ajax 的起源，你或许能够更有能力地评估它在未来\
  \ Web 开发中将扮演的角色。这是一项非常令人兴奋的技术，但在许多方面它仍然处于探索阶段。那么，Ajax 到底是从哪里来的？它又将走向何方呢？让我们来探究一下。\n\
  \n### Ajax 之路\n\n归结底，Ajax 实际上只是用来描述现有技术特定应用的一种术语。这种特定应用已经存在好几年，但直到 2005 年 2 月才获得了一个朗朗口的名字。起这个名字的人是\
  \ Jesse James Garrett，他需要为他雇主公司 Adaptive Path 的客户用一种更高效的方式描述一种 Web 解决方案。Ajax 这个名字某天在\
  \ Garrett 洗澡时闪过他的脑海，并就固定下来。人们开始认为 Ajax 实际上是一个缩写（AJAX），代表 Asynchronous JavaScript\
  \ and XML（异步 JavaScript 和 XML），但事实并非完全如此。虽然 Ajax 名称确实指的是一种涉及异步 JavaScript 和 XML\
  \ 的开发方法，但“Ajax”这个词严格来说并不是一个缩写。\n\n令人惊讶的是，通往 Garrett 这个响亮名字的道路可以追溯到微软的远程脚本（Remote\
  \ Scripting）技术，该技术于 1998 年在 Internet Explorer 4 和 Netscape Navigator 4 中正式引入。一个利用微软远程脚本技术的实用性应用是\
  \ Outlook Web Access，这在那个时代绝对是开创性的。再往前溯几年，早在 1996 年，`iframe`（Internet Explorer）和\
  \ `layer`（Netscape Navigator）元素就已经支持 Web 内容的异步加载。`iframe` 和 `layer` 元素结合巧妙的 JavaScript\
  \ 编码，引入了动态 HTML（或 DHTML）的概念，这一概念在 Ajax 技术出现之前的几几年里曾非常流行。\n\nAjax 的真正诞生于 2000 年，当时微软将\
  \ `XMLHTTPRequest` 对象添加到 Internet Explorer 5 中。这项技术又过了几年才成熟到可以一致使用的程度，即便如此，也直到一个突破性的应用出现，大家才真正看到了\
  \ Ajax 的威力。\n\n### Ajax 热潮\n\n重大的技术转型很少在抽象中发生。对于 Ajax 来说，需要一个真实的案例来证明这项技术有多么吸引人。这个例子过去是现在也是\
  \ Google Maps。Google Maps 于 2005 年 2 月以测试版向世界发布，让许多 Web 开发者大开眼界，他们惊叹地图竟然可以实时拖动。如此大量的数据怎么传输得这么快？事实证明，正是对\
  \ Ajax 的巧妙使用让 Google Maps 看起来如此灵敏。在实际上，该应用程序尝试预测你的下一步动作并异步预加载地图数据。\n\n**注意**\n\n\
  值得注意的是，社交网站 Orkut 在技术上是 Ajax 的第一个主流应用，但它远未达到 Google Maps 那种震撼效果。Orkut 使用（并继续使用）Ajax\
  \ 允许用户通过星级评分系统对朋友进行评分。\n\n在我看来，Google Maps 正式开启了 Web 应用程序的 Ajax 时代。热潮开始了，现在许多主流应用都具有不可辨认的\
  \ Ajax 风格。Gmail、Flickr 和 Netflix 只是其他许多被大量注入 Ajax 的主流应用，它们再也不会回到“点击、等待、刷新”的时代。凭借这项技术背后的巨大动力，我们毫无疑问将随着时间的推移，看到更多应用变得由\
  \ Ajax 驱动。\n\n### Ajax 的下一步是什么？\n\n鉴于 Ajax 的迅速崛起，在我们规划通未来的道路时，有必要客观地审视这些。。有一点是肯定的，科技行业中的许多人还没有从\
  \ 90 年代末点 com 泡沫的破灭中吸取教训。“非理性狂热”（irrational exuberance）一词被用来描述那个时期导致科技股无限制上涨的心态。问题的很大一部分源于人们紧紧抓住下一个“大想法”，就好像它会改变我们所知的的世界一样。当然，互联网整体在很大程度上改变了世界，但我们中的许多人倾向于过度渲染每一项新进展，仿佛它本身就承载着不可想象的进步、效率、财富等承诺。Ajax\
  \ 就是这些新进展之一。\n\n如果以更开阔的视角观察，就会发现 Ajax 只是 Web 演进中的一项进展。我并不是试图低估这项进展的重要性，我是在警告，我们所有人都不应该被新奇带来的兴奋冲昏头。Ajax\
  \ 确实承诺了一个更快速响应且最终更易用的 Web，这确实值得兴奋。但同时，让我们不要忘记它解决的是一个非常特定的问题，而这个问题并不一定是每个 Web 应用程序都会遇到的。Ajax\
  \ 并不是你为你开发的每一个 Web 页面发射的万灵药。\n\n当我们进入“Web 加 Ajax”的未知未来时，我们限制 Ajax 使用的程度最终可能对 Ajax\
  \ 的持续成功起到关键作用。这涉及到多种原因，其中之一是，尽管传输的信息较少，但 Ajax 实际上可能会给服务器带来更多负载。没错，你消除了每次请求都要发送的整整页数据，但你选择了发送几十个请求而不是一个。取决于特定的服务器配置，多个小请求产生的瓶颈可能比一个大请求要得多。\n\
  \n这一切都是想说，在处理未来的 Web 项目时，你应该意识到 Ajax 是一个极其好手的工具，但它终根结底仍然只是工具。那句“手里有锤子看什么都像钉子”的老话在这里绝对适用。因为你有知识和代码可以将\
  \ Ajax 注入到你所做的每件事中，并不意味着这样做是对。同时，即使是最小的结构良好的 Ajax 应用也可以极具吸引力，并显著提高应用程序的易用性。如果我们都带着一点创造性的克制使用\
  \ Ajax，未来的 Web 将无疑是一个更愉快生活和工作的地方。\n\n## 附录 B. 快速粗略 XMLHttpRequest 参考\n\n\n\n\n\n\
  尽管本书的主旨是让你能够熟练使用 Ajax，而无需沉浸在异步 JavaScript 编码的复杂细节中，但你可能会被示例激发动力，从而深入研究 Ajax 编程。如果是这样，你将需要彻底理解\
  \ `XMLHttpRequest` 对象——该对象包含了负责 Ajax 运行的核心功能。本附录为你提供了一个关于 `XMLHttpRequest` 对象的简要参考，并提供了关于如何最佳使用其方法和属性的若干有用提示。关于核心\
  \ JavaScript 语言支持的所有对象的完整参考信息，请参阅 [`developer.mozilla.org/en/docs/Core_JavaScript_1.5_Reference`](http://developer.mozilla.org/en/docs/Core_JavaScript_1.5_Reference)。\n\
  \n## Methods\n\n`XMLHttpRequest` 对象包含几个方法，用于与 Web 服务器建立连接并发送和接收数据。虽然该对象的现代用法通常涉及异步通信，但该对象完全有能力执行同步操作。你使用对象方法的方式决定了特定请求的性质。\n\
  \n以下是 `XMLHttpRequest` 对象支持的主要方法：\n\n* `open()`\n* `send()`\n* `abort()`\n* `overrideMimeType()`\n\
  * `setRequestHeader()`\n* `getAllResponseHeaders()`\n* `getResponseHeader()`\n\n\
  在这些方法中，前两个是最重要且最常用的。接下来的章节将更详细探讨这些方法。\n\n### open()\n\n```\nopen(method, url[, async[,\
  \ userName[, password]]])\n```\n\n`open()` 方法打开一个服务器请求并为即将到来的通信做好准备。两个必需参数（`method`\
  \ 和 `url`）分别指定请求方法和服务器连接的 URL。请求方法参数可以是 `\"GET\"` 或 `\"POST\"`，取决于你是在进行一个相当简单的数据检索请求（`\"\
  GET\"`），还是需要作为请求的一部分向服务器发送大量数据（`\"POST\"`）。如果你只是发送几条信息，你仍然可以使用 `GET` 方法，但对于较大的数据提交请求（大于\
  \ 512 字节），`POST` 是你的最佳选择。\n\n**Tip**\n\n| | |\n|---|---|\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvcgnqcglzcghnas4vda--.jpg)\
  \ | 另一种判断何时何时使用 `GET` 或 `POST` 作为 Ajax 请求的请求方法的方便方法，是根据请求评估服务器上的数据是否会发生变化。如果服务器的状态因为请求而改变，那么\
  \ `POST` 是答案；否则，使用 `GET`。 |\n\n`url` 参数可以指定为绝对（完整）URL 或相对 URL，但请记住，无论何种情况，URL 必须与生成请求的\
  \ JavaScript 代码匹配。换句话说，Ajax 连接只能在 Ajax 脚本代码本身所在的服务器上发送请求。这是 `XMLHttpRequest` 对象的安全限制，但其目的是保护用户免受恶意\
  \ Ajax 代码的影响。\n\n`open()` 方法的第三个参数 `async` 是可选的布尔值，决定请求是否以异步方式处理。默认值 `true` 表示异步（Ajax）请求，而\
  \ `false` 表示同步请求。在实践中，这意味着同步请求会让你的脚本在执行任何其他操作之前等待响应，而异步请求则在后台进行，仅在完成时报告结果。在极少数情况下，同步请求可能是合理的，例如在允许用户继续执行任务之前等待绝对关键的数据，但在绝大多数情况下，你会希望使用异步请求。此外，异步性正是\
  \ Ajax 如此酷炫的原因。\n\n**Note**\n\n| | |\n|---|---|\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdvdgmucg9zagpwawdll24-.jpg)\
  \ | 大支持 Ajax 的浏览器将 Ajax 请求限制为 HTTP 请求（`http:` 协议），这意味着你无法从本地硬盘使用 `file:` 协议测试 Ajax\
  \ 脚本。当然，你随时可以在本地安装 Web 服务器，此时你可以使用 `http:` 协议打开 Ajax 页面。 |\n\n`open()` 的最后两个参数完全可选，最终取决于你的服务器是否需要用户名和密码来执行请求。\n\
  \n以下创建一个 `XMLHttpRequest` 对象并调用 `open()` 方法建立异步请求的简单示例：\n\n```\nvar request = new\
  \ XMLHttpRequest;\nrequest.open(\"GET\", \"processSomeStuff.php\", true);\n```\n\
  \n`XMLHttpRequest` 对象的两个方面与 `open()` 方法紧密相关：`send()` 方法和 `onreadystatechange` 事件处理器。必须在调用\
  \ `open()` 方法之后调用 `send()` 方法，才能实际执行 Ajax 请求。`onreadystatechange` 事件被分配一个你自定义有的回调方法，该方法会在\
  \ Ajax 请求完成时自动调用。换句话说，你必须编写自己的函数，每当 Ajax 请求完成工作时该函数就会被调用。这个函数就是你处理从完成的 Ajax 请求返回的数据的地方。\n\
  \n### send()\n\n```\nsend(content)\n```\n\n`send()` 方法负责实际向服务器发送请求进行处理。在调用 `send()`\
  \ 之前，必须通过调用 `open()` 准备好连接。`send()` 方法的唯一参数 `content` 是请求的一部分发送到服务器的数据。在许多情况下，你只是发送发送服务器请求而不发送任何数据，在这种情况下，向\
  \ `send()` 方法传递 `null` 是完全可以的，如下：\n\n```\nrequest.send(null);\n```\n\n向 `send()`\
  \ 方法传递 `null` 通常是在使用 `\"GET\"` 请求方法时。相反，`\"POST\"` 方法专门设计用于向服务器传递数据，在这种情况下你需要在 `content`\
  \ 参数中包含有意义的数据。\n\n通过 `content` 参数传递 `send()` 方法的内容可以是字符串、无符号字节数组或 XML DOM 对象。在许多情况下，你只需向方法传递一个字符串，此时它通常接受熟悉的\
  \ `POST` 风格的键值对，如此示例所示：\n\n```\nrequest.send(\"artist=phish&album=rift&track=weigh\"\
  );\n```\n\n需要注意的是，对于异步请求，你需要在调用 `send()` 方法之前设置 `onreadystatechange` 事件处理器。否则，你的事件处理器回调方法将永远不会被调用，Ajax\
  \ 效果将完全丢失。以下是设置该处理器的示例，该设置必须在调用 `send()` 方法之前进行：\n\n```\nrequest.onreadystatechange\
  \ = yourHandler;\n```\n\n请记住，当 Ajax 请求完成时，会自动调用 `yourHandler()` 函数，以便你对请求返回的数据进行一些用的操作。\n\
  \n### abort()\n\n```\nabort()\n```\n\n`abort()` 方法停止服务器请求。在超时情况下，当你选择放弃耗时请求时，这个方法非常有用。你也可以调用\
  \ `abort()` 方法来确保请求对象在重用它执行另一个请求之前被重置。以下是调用 `abort()` 方法终止 Ajax 请求的示例：\n\n```\n\
  request.abort();\n```\n\n### overrideMimeType()\n\n```\noverrideMimeType(type)\n\
  ```\n\n\n\n\n\n`overrideMimeType()` 方法为你提供了一种手段，可以覆盖服务器响应请求时返回的数据的 MIME 类型。当你期望获取\
  \ XML 但由于某些原因无法让服务器配合时，这种方法非常有用。例如，服务器可能因为 XML 数据格式不完美而拒绝它，在这种情况下，服务器将通过 `responseText`\
  \ 属性以原始文本的形式返回数据。如果你调用 `overrideMimeType()` 方法并将 `\"text/xml\"` 指定为 MIME 类型，服务器将尝试在\
  \ `responseXML` 属性中返回 XML 数据：\n\n```\nrequest.overrideMimeType(\"text/xml\");\n\
  ```\n\n## Note\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 应该在调用 `open()` 方法之后、但在调用 `send()` 方法之前调用 `overrideMimeType()` 方法。 |\n\n### setRequestHeader()\n\
  \n```\nsetRequestHeader(label, value)\n```\n\n`setRequestHeader()` 方法用于向请求头中添加标签/值对（label/value\
  \ pair）。对于普通的 `GET` 请求方法并非必需，但在进行 `POST` 请求时是关重要的。例如，下面的请求头设置允许服务器知道 `POST` 请求中的数据将以编码\
  \ URL 的形式存在：\n\n```\nrequest.setRequestHeader(\"Content-Type\",\n  \"application/x-www-form-urlencoded\"\
  );\n```\n\nXML 是另一种用于发布 `POST` 请求的流行数据格式。如果你计划在 `POST` 请求中向服务器传递 XML 数据，那么以下请求头设置是必要的：\n\
  \n```\nrequest.setRequestHeader(\"Content-Type\",\n  \"text/xml\");\n```\n\n设置请求头的需要取决于你的特定请求。如果你的请求是\
  \ `POST`，你应该始终设置它。否则，在 `GET` 请求的情况下，不对请求头设置任何内容通常也没问题。\n\n### getAllResponseHeaders()\n\
  \n```\ngetAllResponseHeaders()\n```\n\n`getAllResponseHeaders()` 方法返回与响应相关的所有响应头，格式为包含一系列换行符分隔的标签/值对的字符串。可能更有用处的是\
  \ `getResponseHeader()` 方法，它返回特定标头标签的单个值。\n\n### getResponseHeader()\n\n```\ngetResponseHeader(headerLabel)\n\
  ```\n\n`getResponseHeader()` 方法接受特定头部的标签，并返回该标签对应的头部字符串值。例如，你可以通过获取 `\"Content-Type\"\
  ` 标签的响应头来确定请求的内容类型，如下：\n\n```\nvar header = request.getResponseHeader(\"Content-Type\"\
  );\n```\n\n在这个示例中，存储在 `header` 变量中的返回值可能是 `text/xml` 或 `text/plain` 之类的，取决于请求返回的数据类型。\n\
  \n## 附录 B. 快速实用的 XMLHttpRequest 参考\n\n虽然本书的大大要言是让你能够使用 Ajax，而无需沉浸在异步 JavaScript\
