  \ 献词\n\n> 献给我的房屋建造导师 David Hill，在我努力兼顾写作事业以及过多的运动与爱好时，他耐心地指导我完成了家园的建造。\n\n## Negus\
  \ Live Linux 系列\n\n您通过免费软件获得真实成果的实战指南\n\n将书附 CD  中的免费软件和示例添加到您的 Windows、Mac OS X\
  \ 或 Linux 系统中，以跟随书中描述的项目。或者直接启动 CD，使用一套完整的、预封装的免费软件工具来玩耍、显示和修改这些项目。从初学者开始，尝试各种示例……最后完成具有启用\
  \ Ajax 的专业 Web 内容！\n\n该系列由 Christopher Negus 监督，他是畅销书《红帽 Linux 经》(Red Hat Linux\
  \ Bible) 系列、《Linux 玩具》系列以及本系列代表作《Live Linux CDs》的作者。\n\n## 致谢\n\n我要感谢 Debra Williams\
  \ Cauley 和 Prentice Hall 的同仁们让这个项目成为现实，还要感谢 Chris Negus 从一开始就给予的热情和支持。\n\n非常感谢我的好朋友\
  \ Stephen Tallent 和 Fletcher Moore，他们在午夜技术支持部门提供了巨大的帮助，更不用说传递了许多好主意并慷慨地分享了时间。\n\n\
  最后，我的妻子理应最大的感谢，因为至少在一个宅男作家谦卑的观点看来，她是地球上最酷的人。\n\n## 关于作者\n\nMichael Morrison 是一位作家、开发者、玩具发明家，并编写过多种涵盖\
  \ `Java`、`Web 脚本`、游戏开发和移动设备等主题书籍。Michael 的一些知名写作项目包括 `JavaScript Bible, 6th Edition\
  \ (Wiley, 2006)`、`Teach Yourself HTML and CSS in 24 Hours, 7th Edition (Sams Publishing,\
  \ 2005)`、《Beginning Mobile Phone Game Programming (Sams Publishing, 2004)` 以及 `Java\
  \ Unleashed (Sams Publishing, 1997)`。Michael 是多门基于 Web 的课程的讲师，包括 DigitalThink 的\
  \ Introduction to Java 2 系列、`JavaBeans` for Programmers 系列以及 `Win32 Programming`\
  \ 系列 ([www.digitalthink.com](http://www.digitalthink.com))。\n\n除了作家和技术顾问的主业外，Michael\
  \ 还是 Stalefish Labs ([www.stalefishlabs.com](http://www.stalefishlabs.com)) 的创始人，这是一家专注于游戏、玩具和交互媒体的娱乐公司。在不盯着电脑、滑板、打冰球或与他的妻子\
  \ Masheed 看电影时，Michael 喜欢待在锦鱼池旁。\n\n## 引言\n\n这整本书的想法源于我和编辑之间的一个赌约，我赌我们无法随机挑选两个技术主题并将它们结成一本书。两支飞镖飞过空中，“Ajax”和“live\
  \ CDs”这两个主题最终成了结果。这本书本可以很容易写成关于基于 Rails 的蓝光光或 iPod 设计模式。所以，你现在拿起一本关于 Ajax 和 live\
  \ CDs 的书纯粹是运气好。\n\n如果你相信这一点，也许我可以让你有兴趣帮助资助我一直在考虑的这家初创公司！事实是，Ajax 和 live CDs 是出奇契合的搭档，因为\
  \ live CDs 为构建 Ajax 应用提供了完美的环境。“live CD”的核心理念是它在单张 CD 上包含了一个完整的操作系统。除了完整的操作系统外，你还可以包含任何想要的应用程序，例如一个可以提供\
  \ Ajax 应用服务的 Web 服务器。\n\nAjax 应用与仅用 `JavaScript` 开发的纯客户端应用相比，独特之处在于它们要求服务器端发生某些事情。换句话说，Ajax\
  \ 的前提是客户端与服务器之间的通信。这意味着你不仅需要一个服务器，还需要一个你拥有一定控制权的服务器。至少，你需要能够快速安装和测试服务器端脚本，这些脚本将处理你\
  \ Ajax 应用的服务器端处理。Live CDs 在提供一个难以置信的可定制平台方面非常契合这一需求。\n\n尽管 live CDs 很酷，但我必须诚实地说，这本书\
  \ 95% 都是关于 Ajax 的。书中 live CD 的方面主要是为了方便起见，因为 Ajax 应用对环境的要求比纯客户端应用苛刻。\n\n好了，这本书主要是关于\
  \ Ajax 的，但这到底意味着什么呢？这意味着在较少的页数内，你学习了如何使用 Ajax 完成以下工作：\n\n*   为 Web 电子书阅读器动态加载电子书章节\
  \ (第 3 章)\n\n*   立即选择并查看实时股票报价 (第 4 章)\n\n\n\n\n\n*   将任何网页转换为能够理解 RSS 新闻源的消息聚合器\
  \ (第 5 章)\n*   为你的网站添加自动补全功能 (第 6 章)\n*   验证表单数据并实时查询位置数据 (第 7 章)\n*   创建一个“Web\
  \ 2.0”图像查看器，使你的页面处理图像的方式更加现代化 (第 8 章)\n*   使用信息弹出窗口动态显示小段性内容 (第 9 章)\n*   为任何链接添加实时天气状况弹出窗\
  \ (第 10 章)\n*   使用美国邮政服务的 Ajax 请求实时计算运费 (第 11 章)\n*   在你的 Web 页面中集成动画五星评分系统 (第 12\
  \ 章)\n\n这些都是 `Ajax` 使可能的动态应用。更重要的是，本书采用了一种构建工具包的方法，引导你向 `Ajax` 应用中添加这些功能。虽然你在探索书中展示的许多示例时，最终会学到很多关于\
  \ `Ajax` 的知识，但本书的重点并不是教你 `Ajax`。重点在于向你展示如何使用 `Ajax` 实现酷炫。有时这需要你学习完全新的东西；而有时只需要复制粘贴代码。要点在于，这本书是关于“实践”的。\n\
  \n在我看来，做就是学，所以你最终在读完这本书后，对 `Ajax` 的理解将比开始时要透彻得多。更重要的是，你离开时将拥有一套属于自己的 `Ajax` 模块，你可以将它们带走并应用到自己的项目中。\n\
  \n### 本书的读者\n\n我不会对你撒谎——这本书本质决定了在介绍各种 `Ajax` 示例时，必须经常涉及 `JavaScript` 和 `PHP`。然而，本书的最初目标是让任何拥有\
  \ `HTML` 和 `CSS`（层叠样式表）知识的人都能读懂，而不一定需要具备脚本背景（无论是客户端 `JavaScript` 还是服务端 `PHP`）。我不完全确定这是否是一个现实的目标，但它对我很有帮助，让我极力尝试提供足够的\
  \ `Ajax` 覆盖以使示例通俗易懂，又不至于多到让脚本初学者被吓跑。\n\n尽管如此，你绝对必须了解一点 `HTML` 才能应付这本书。`CSS` 并不那么关键，但它会偶尔出现，所以你可能可以将基础\
  \ `CSS` 知识视为先决条件。在此基础上，了解一些 `JavaScript` 对你大益，因为它是 `Ajax` 的基础。然而，我相信你即使在 Web 脚本知识有限的情况下，也能在书中的\
  \ `JavaScript` 代码中灵活穿梭，并在离开时带上一满可以随时复用的 `Ajax` 宝 de 工具箱。书中随处出现的 `PHP` 代码非常简单，我会准确解释发生了什么，所以你完全可以在不了解任何\
  \ `PHP` 的情况下应付。\n\n## 引言\n\n整本书的想法源于我与编辑的一个打赌，赌定我们无法随机挑选两个技术主题并将它们结成一本书。两支飞镖飞过空气，结果变成了“Ajax”和“现场版光盘（live\
  \ CDs）”。这本书完全可以是关于 Rails 上的蓝光电影，或者 iPod 设计模式的。所以，你拿起一本关于 `Ajax` 和 live CDs 的书纯属运气好。\n\
