  \ 的真正诀窍在于让大脑理解它能做什么，这比了解它是什么或人们为什么对其如此痴迷要重要得多。`Ajax` 是那些真正罕见的 Web 创新之一，一旦你在正确的语境下看到它的应用，其益处就会立即被理解。就像有时在电视上看到的流行的\
  \ 3M 广告一样，你使用 `Ajax` 不是为了制造东西，而是为了让东西变得更好。这一章将带你进入适量的 `Ajax` 现实主义，重点关注它旨在解决什么类型的问题以及为什么这些问题对你很重要。是的，我也会解释它是什么以及人们为什么对其如此痴迷，但那只是锦上添花。\n\
