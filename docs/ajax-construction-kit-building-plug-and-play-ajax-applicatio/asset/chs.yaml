  \n本章中的 `Forecaster` 使用以下文件，它们位于随书附带的实时 Linux 光盘的 `chap10` 示例代码文件夹中：\n\n* `forecaster.html`—\
  \ 主 Web 页面\n* `forecaster.php`—加载天气预报的服务器脚本\n* `ajaxkit.js`— `Ajax Toolkit` 的核心\
  \ `Ajax` 函数\n* `domkit.js`— `Ajax Toolkit` 的 DOM 相关函数\n* `infowinkit.js`— `Ajax\
  \ Toolkit` 的信息窗口相关函数\n* `infowinkit.css`— 信息窗口的样式表\n* `infowinkit_wait.gif`— 在向信息窗口加载信息时显示的动态“加载”图标\n\
  \n\n\n\n虽然 [Weather.com](http://Weather.com) 在呈现信息的质量方面是无可比拟的，但请记住，你需要在浏览器中导航到那里，然后输入你想要查看天气预报的地点。如果你不想丢失正在查看的页面上下文，而是希望在不离开页面的情况下快速获取天气更新，这个问题就会变得麻烦。这时弹出窗口派上用场了。通过在弹出窗口中显示天气数据，允许用户继续关注当前的任务，而不会通过离开页面来分散他们的注意力。可能重要的是，你消除了用户离开你网站的一个理由。\n\
  \n因此，你的目标不是创建一个比像 [Weather.com](http://Weather.com) 这样的纯天气网站更丰富或更详尽的替代方案。你的目标是将实时天气数据注入到现有网站的上下文中，从而在用户无需离开你的页面的情况下添加一些实用的新内容。信息弹出窗口是显示天气数据且不与正在查看的主页面产生竞争的关键。\n\
  \n此挑战涉及的 `Ajax` 请求必须以某种方式根据特定位置查询天气服务的服务的天气数据。事实证明，`ZIP` 邮编码足以识别一个位置，因此它成为查询天气数据的极佳数据。`Ajax`\
  \ 响应包含了天气数据，你必须对这些数据进行处理，以便在弹出窗口中显示有意义的天气信息。\n\n## 设计：设计天气预报员\n\n你为了应对动态天气挑战而开发的应用程序被称为\
  \ `Forecaster`，它的设计很大程度上围绕书中 `Ajax` 工具包中 `infowinkit.js` 文件中现有的信息窗口支持。事实上，`Forecaster`\
  \ 应用在结构上与第 9 章中开发的 `Informer` 应用非常相似，只是它请求特定地点的实时天气信息，而不是预构建的 HTML 内容文件。图 10.1 让你了解\
  \ `Forecaster` 应用程序用户界面的结构。\n\n### 图 10.1.Forecaster 应用程序的用户界面由一个包含信息链接的 Web 页面组成，这些链接会触发包含实时天气信息的弹出窗口。\n\
  \n![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdbzmghnmmkuawlmms8-.jpg)\n\
  \n该图显示了 `Forecaster` 页面如何由标准文本和点缀其中的城市链接组成。每个城市链接实际上都是一个信息链接，结果是显示一个包含实时天气数据的弹出窗口。这意味着点击城市链接会导致一个\
  \ `Ajax` 请求，检索天气数据，以便其在弹出窗口中显示。\n\n为了使 `Ajax` 天气请求工作，你实际上需要访问结构化格式（如 `XML`）的实时天气数据。事实证明，你可以使用互联网上的多个天气源来完成此任务。我喜欢的一个服务是\
  \ `Yahoo! Weather` 提供的 `RSS` 天气馈送。这些天气数据以 `RSS` 格式提供，这是一种特定的 `XML` 数据格式，传统上用于共享新闻，如第\
  \ 5 章“接入 RSS 新闻源”所示。然而，没有理由认为 `RSS` 馈送不能用于其他类型的数据，在这种情况下，`Yahoo! Weather` 使用 `RSS`\
  \ 来传输天气数据。\n\n### 注意\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | `RSS`（简单简单分发）是一种 `XML` 数据格式，设计用于以一致的方式表示新闻故事。典型的 `RSS` 文档（或馈送）包含多个带有详细信息的新闻故事，如标题、描述、发布日期和在线文章的链接。`RSS`\
  \ 格式实际上可以用于新闻领域之外，事实上对于任何定期变化的文本信息都是用的。有许多被称为 `RSS 阅读器` 的第三方应用程序允许你在单个视图中查看和访问多个\
  \ `RSS` 馈送。 |\n\n图 10.2 显示了 `Yahoo! Weather` 的 `RSS` 馈送 Web 页面 ([`developer.yahoo.com/weather/`](http://developer.yahoo.com/weather/))，它包含了关于天气馈送以及如何自定义以满足你需求的优秀文档。\n\
  \n### 图 10.2.Yahoo! Weather RSS 馈送 Web 页面提供实时 XML 天气馈送。\n\n[[查看完整图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3awcznhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdbzmghqm3auawlnms8-.jpg)\n\
  \n你将在本章剩余部分学习如何从 `Yahoo! Weather` 馈送中挖掘天气数据的基础知识，但也可以随时返回此 Web 页面自行学习更多。\n\n回到 `Forecaster`\
  \ 应用的设计，你现在有了一个可以作为 `Ajax` 天气请求基础的实时天气服务。这些请求中的每一个都是用户点击 Web 页面文本中的城市的结果，而该城市恰好是一个信息链接。这意味着当点击城市时，会显示一个信息窗口，其中包含通过在\
  \ `Yahoo! Weather` 服务器发起的 `Ajax` 请求获取的天气数据。接几节将进一步探讨此 `Ajax` 请求。\n\n#### 客户端请求\n\
  \n如果你是一直按顺序阅读这本书的，你可能已经在想，获取天气数据的 `Ajax` 请求将需要一个服务器端脚本，以处理无法从远程服务器请求数据的安全问题。在这种情况下，`Yahoo!\
  \ Weather` 服务器完全符合远程服务器的定义。因此，你需要一个 `PHP` 脚本作为某种代理，从客户端执行实际的天气查询。\n\n除了服务器上的 `PHP`\
  \ 脚本外，Forecaster` 应用中的客户端请求并不太复杂，因为它必须传递给服务器的唯一信息是地点的 `ZIP` 编码。`ZIP` 编码用于识别位置，幸运的是\
  \ `Yahoo! Weather` 服务能够仅根据 `ZIP` 编码查找天气信息。因此，生成的 `Ajax` 客户端请求涉及一个带有 `ZIP` 参数的 PHP\
  \ 服务器脚本。\n\n#### 服务器响应\n\n天气请求的响应以充满天气数据的 `RSS` 文档形式返回。如果你还记得，`RSS` 格式是一种 `XML`\
  \ 数据格式，这意味着你可以根据标签名称从中提取数据而无需太大麻烦。这很重要，因为你不会使用 `Ajax` 响应中返回的所有信息。\n\n正如你在下一节看到的，`Yahoo!\
  \ Weather` 服务提供的标准 `Ajax` 响应包含的信息比此特定示例所需的要得多。因此，你需要能够使用服务器脚本提取特定信息并仅将该信息返回给客户端。考虑到前面提到的安全变通，服务器脚本已经是必不可少的，因此增加少量代码来提取特定的天气数据不会带来太大的挑战。\n\
  \n#### 理解客户端到服务器的对话\n\n你现在对 `Forecaster` 应用中客户端和服务器的角色已经有了足够的了解，可以可视化单个 `Ajax` 天气请求及其相关的响应。图\
  \ 10.3 显示了针对此请求进行的客户端到服务器的对话。\n\n### 图 10.3.Forecaster 应用涉及从客户端发送 ZIP 编码并从服务器接收\
  \ HTML 天气内容。\n\n![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdbzmghnngkuawlmms8-.jpg)\n\
  \n\n\n\n该图展示了 `Ajax` 请求如何生成响应，并将天气内容回传给浏览器（客户端）。我特意地将这些天气信息称为“内容”（content）而不是“数据”（data），因为它们之间存在细微的区别。“数据”通常指的是未经过任何特定方式编码或格式化的原始信息，而“内容”通常指的是经过过某种处理的数据。在这一特定情况下，天气信息被归类为“内容”，因为它是以\
  \ HTML 代码的形式从服务器返回的，且这些代码已经准备好可以直接在弹出窗口中显示。\n\n回到图中所示的 `Ajax` 请求，你通过将位置的邮政编码封装在\
  \ URL 中的单个参数中随 `Ajax` 请求 一起传递。以下是一个用于向 Forecaster 程序的 `PHP` 脚本传递邮政编码的 URL 示例：\n\n\
  ```\nforecaster.php?zipCode=37205\n```\n\n这段代码显示处理 `Ajax` 天气请求的 `PHP` 脚本位于 `forecaster.php`\
  \ 的文件中。该脚本负责从 Yahoo! Weather 服务器检索 RSS 天气数据，提取所需的特定信息，然后将这些信息返回给客户端。你稍后会在“Forecaster\
  \ 服务器脚本”章节中确切了解到此脚本是如何实现这种“天气魔法”的。\n\n从服务器返回的天气数据实际上比 Forecaster 应用程序所需的详细得多，这就是为什么服务器脚本只提取了部分数据返回给客户端。恰好\
  \ Yahoo! Weather 服务提供了一个预先格式化的天气信息块，可以轻松地从剩余天气数据中单独访问。该块被格式化为 HTML 代码，准备好在弹出窗口中显示。以下是该代码的示例：\n\
  \n```\n<img src=\"http://us.i1.yimg.com/us.yimg.com/i/us/we/52/30.gif\"/>\n<br />\n\
  <b>Current Conditions:</b><br />\nPartly Cloudy, 66 F<br /><br />\n<b>Forecast:</b><br\
  \ />\nWed - Partly Cloudy. High: 69 Low: 42<br />\nThu - Sunny. High: 61 Low: 32<br\
  \ /><br />\n<a href=\"http://weather.yahoo.com/forecast/37205_f.html\">\n  Full\
  \ Forecast at Yahoo! Weather</a><br />\n(provided by The Weather Channel)<br />\n\
  ```\n\n如你所见，得益于几个 HTML 标签，这段代码已经为了显示进行了格式化处理。\n\n预格式化的天气信息在主 RSS 天气源中使用 `<description>`\
  \ 标签标识。换句话说，你刚刚看到的代码被包含在 RSS XML 代码中的 `<description>` 和 `</description>` 标签之间。以下是一个简化的\
  \ RSS 天气源文档，展示了 `<description>` 标签的使用方式：\n\n代码视图：\n\n```\n<rss version=\"2.0\"\n\
  xmlns:yweather=\"http://xml.weather.yahoo.com/ns/rss/1.0\"\n  xmlns:geo=\"http://www.w3.org/2003/01/geo/wgs84_pos#\"\
  >\n  <channel>\n    <title>Yahoo! Weather - Nashville, TN</title>\n    <link>http://weather.yahoo.com/forecast/37205_f.html</link>\n\
  \    <description>Yahoo! Weather for Nashville, TN</description>\n    ...\n    <item>\n\
  \      <title>Conditions for Nashville, TN at 10:53 am CST</title>\n      <geo:lat>36.11</geo:lat>\n\
  \      <geo:long>-86.68</geo:long>\n      ...\n      <description><![CDATA[\n  \
  \      <img src=\"http://us.i1.yimg.com/us.yimg.com/i/us/we/52/\n          30.gif\"\
  \ /><br />\n        <b>Current Conditions:</b><br />\n        Partly Cloudy, 66\
  \ F<br /><br />\n        <b>Forecast:</b><br />\n        Wed - Partly Cloudy. High:\
  \ 69 Low: 42<br />\n        Thu - Sunny. High: 61 Low: 32<br /><br />\n        <a\
  \ href=\"http://weather.yahoo.com/forecast/37205_f.html\">\n          Full Forecast\
  \ at Yahoo! Weather</a><br />\n        (provided by The Weather Channel)<br />\n\
  \      ]]></description>\n      ...\n    </item>\n  </channel>\n</rss> \n```\n\n\
  这段代码揭示了 `<description>` 标签是如何嵌入天气馈源的 RSS 代码中的，以及它是如何存储 HTML 编码版本的天气信息的。Forecaster\
  \ 服务器脚本的工作仅仅是提取 `<description>` 标签的内容并作为 `Ajax` 响应返回给客户端。\n\n### 整合 Forecaster 应用程序\n\
  \n除了 `Ajax` Toolkit 提供的支持功能（如信息弹出窗口）外，Forecaster 应用程序由两个组件组成：\n\n*   HTML 网页 (`forecaster.html`)\n\
  *   PHP 服务器脚本 (`forecaster.php`)\n\n接下来的两个部分将更详细地检查 Forecaster 拼图中的这些部分。希望你已经对它们的作用有了相当了解，甚至可能知道它们是如何实现的。\n\
  \n#### Forecaster 网页\n\nForecaster 应用程序的 HTML 网页包含一段文字，其中散布着天气信息链接（城市名称）。该页面在没有任何控件方面表现得具有欺骗性的简单。然而，点击任何一个链接都会发现\
  \ Forecaster 远比最初看起来的要复杂。图 10.4 显示了 `forecaster.html` 背后的 HTML。\n\n以下是 `forecaster.html`\
  \ 背后的 HTML 代码，代码视图：\n\n```html\n<body onload=\"init(300, 240)\">\n  <div id=\"ajaxState\"\
  \ style=\"display:none\"></div>\n  <h2>Forecaster - Traveling the U.S.</h2>\n  <p>获得完整体验的一种极佳方法是上路并尽可能覆盖尽可能多的地形。例如，假设你的旅行从\
  \ <a href=\"#\" class=\"info\" onclick=\"returnInfoWindow('forecaster.php?zipCode=10001',\
  \ event)\">纽约</a>开始，计划是横跨美国并在加利福尼亚州结束。\n  <p><a href=\"#\" class=\"info\" onclick=\"\
  returnInfoWindow('forecaster.php?zipCode=94129', event)\">旧金山</a></a>。根据季节的不同，你将体验到非常多样的天气。如果你的旅程深入南部，你就会理解为什么\
  \ <a href=\"#\" class=\"info\" onclick=\"returnInfoWindow('forecaster.php?zipCode=30301',\
  \ event)\">亚特兰大</a>被亲切地称为“热亚特兰大”（Hotlanta）。向西行驶时，当你通过俄克拉荷马市时，需要时刻留意龙卷风 <a href=\"\
  #\" class=\"info\" onclick=\"returnInfoWindow('forecaster.php?zipCode=73101', event)\"\
  >俄克拉荷马市</a>。\n  如果你觉得亚特兰大很热，那么在 <a href=\"#\" class=\"info\" onclick=\"returnInfoWindow('forecaster.php?zipCode=85003',\
  \ event)\">菲尼克斯</a>的停留会很快让你知道为什么他们称那里为“阳光之谷”。\n  向北旅行以躲避酷热，在落基山脉脚下的 <a href=\"#\"\
  \ class=\"info\" onclick=\"returnInfoWindow('forecaster.php?zipCode=80012', event)\"\
  >丹佛</a>停留将确保为你通向加利福尼亚的最后冲刺注入能量。</p>\n</</body>\n```\n\n第一行代码负责一项非常重要的任务：初始化信息弹出窗口并建立其默认大小（`300x240`）。页面的其余代码创建了段落并定义了天气信息链接。由于信息链接直接嵌入在段落中，因此有些难以认，请单独查看其中一个链接：\n\
  \n```html\n<a href=\"#\" class=\"info\" onclick=\"returnInfoWindow('forecaster.php?zipCode=94129',\
  \ event)\">旧金山</a>\n```\n\n\n\n\n此链接用于启动弹窗，显示加利福尼亚州旧金山市邮政编码 94129 的当前天气信息。注意，邮政编码作为参数（`zipCode`）传递给\
  \ `forecaster.php` 服务器脚本。服务器脚本的完整 URL 和邮政编码被传入 `showInfoWindow()` 函数，该函数是用于显示信息弹窗的\
  \ Ajax Toolkit 函数。\n\n虽然 Forecaster Web 页面的主体是有趣内容发生的地方，但页面的头部（head）也很重要，因为它导入了所需的\
  \ JavaScript 和 CSS 文件。以下是页面的头部：\n\n```\n<head>\n  <title>Forecaster</title>\n\n\
  \  <link rel=\"stylesheet\" type=\"text/css\" href=\"infowinkit.css\" />\n  <script\
  \ type=\"text/javascript\" src=\"ajaxkit.js\"> </script>\n  <script type=\"text/javascript\"\
  \ src=\"domkit.js\"> </script>\n  <script type=\"text/javascript\" src=\"infowinkit.js\"\
  > </script>\n</head>\n```\n\n该 CSS 文件和三个 JavaScript 文件都是书中 Ajax Toolkit 的一部分，该工具提供了许多有用的\
  \ Ajax 函数。\n\n## Forecaster 服务器脚本\n\n由于 Forecaster 中的天气信息最终从远程服务器（Yahoo! Weather）加载，因此你无法直接从客户端发出\
  \ Ajax 请求。Forecaster 服务器脚本对于规避限制并访问远程服务器上的信息是必要的。不仅如此，服务器脚本还起着额外作用，它必须提取天气数据的特定部分，并仅将该数据返回给客户端。换句话说，客户端不需要\
  \ Yahoo! Weather 订阅的所有内容。\n\nForecaster PHP 服务器脚本期望接收一个邮政编码，然后可以使用该编码请求特定位置的天气数据。以下是\
  \ `forecaster.php` 服务器脚本的代码：\n\n```php\n<?php\nheader('Content-Type: text/xml');\n\
  \n// 将 XML 天气数据解析为结构\n$rawFeed =\nfile_get_contents(\"http://weather.yahooapis.com/forecastrss?p=\"\
  \ .\n  $_REQUEST[\"zipCode\"]);\n$xml = new SimpleXmlElement($rawFeed);\necho \"\
  <div>\" . $xml->channel->item->description . \"</div>\";\n?>\n```\n\n记住，此脚本的任务是从\
  \ Yahoo! Weather 服务检索 XML (RSS) 文档，提取 `<description>` 标签内的内容，然后将该 HTML 代码传递给客户端。客户端需要做的只是在弹窗中显示\
  \ HTML 天气代码。实际上，客户端将这些细节委托给了 Ajax Toolkit 中的信息弹窗支持。\n\n服务器脚本首先确保响应被处理为 XML。脚本中的第二部分代码随后从天气服务加载\
  \ RSS/XML 天气文档，并确保传递 `zipCode` 参数，以便服务知道天气位置。天气服务返回的原始 XML 数据随后被转换为结构化的 XML 对象，以便你可以轻松地访问单个元素。\n\
  \n代码的最后部分是脚本实际返回天气信息的地方，它作为对 Ajax 天气信息请求的响应。格式化的 HTML 天气代码在返回给客户端之前被封装在 HTML `div`\
  \ 元素内部。\n\n在继续测试已完成的 Forecaster 应用程序之前，首先测试 PHP 脚本本身是重要的。你已经在之前的章节中看到过这种操作，但对于任何涉及自定义服务器脚本的\
  \ Ajax 应用程序，这始终是一个重要的步骤。以下是测试 Forecaster 脚本的示例 URL：\n\n```\nhttp://www.yourdomain.com/forecaster.php?zipCode=94129\n\
  ```\n\n假设 `forecaster.php` 文件存储在你的服务器上，请在这行代码中将域名更改为你的域名，然后将 URL 输入 Web 浏览器。你也可以直接在随书附赠的演示盘上尝试此技巧。无论你从哪里访问脚本，图\
  \ 10.5 显示了 PHP 脚本生成的 HTML 响应数据。\n\n### 图 10.5。你可以通过在浏览器中直接打开脚本来检查 Forecaster PHP\
  \ 脚本返回的 HTML 天气信息。\n\n[[查看完整图片]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3awczzhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdbzmghqnnauawlnms8-.jpg)\n\
  \n随意在 Forecaster 脚本的 URL 中尝试不同的邮政编码。这是研究服务器脚本返回数据的极佳方法，可以确保它与你的预期——当你受限于通过客户端 Web\
  \ 页面的视角查看一切时，服务器脚本问题要难追踪得多。\n\n## 测试 Forecaster\n\n测试 Forecaster 应用程序需要大量的技巧和耐心。当然，这还是假设你认为点击几次鼠标是一项困难的工作。说真的，这是一个非常容易测试的应用程序，因为你只需要点击页面上的几个链接。图\
  \ 10.6 显示了 Forecaster 应用程序启动时天气弹窗是隐藏状态的。\n\n### 图 10.6。Forecaster 应用程序启动时天气弹窗是隐藏的，因为还没有点击任何城市。\n\
  \n[[查看完整图片]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3awczzhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdbzmghqnnauawlnms8-.jpg)\n\
  \n*(注：此处由于原文未提供后续文本，翻译根据此处提供的文本结束，后续示例内容已根据逻辑完成翻译)*\n\n\n\n\n所以，华氏度 61 度可能真的不能作为“Hotlanta”（炎热亚兰塔）这个名字的理由，但你必须考虑到我们讨论的是\
  \ 2 月。在 7 月再回来查看 `Forecaster` 应用，你就会明白我在说什么了。\n\n### 为 Forecaster 进行一次极端的 Ajax 大改造\n\
  \n改造 `Forecaster` 应用最快最简单的方法是尝试不同的城市。例如，将网页中的一个城市更改为你的家乡，确保将城市信息链接中的 ZIP 编码替换为你自己的\
  \ ZIP 编码。更具体地说，务必更改传入 `showInfoWindow()` 函数的 URL，使其引用你的邮政编码。例如，如果你的邮政编码是 92024（加利福尼亚州恩西尼塔斯），你需要将信息链接中\
  \ `onclick` 事件处理程序的 `showInfoWindow()` 函数更改为如下所示：\n\n```javascript\nonclick=\"return\
  \ showInfoWindow('forecaster.php?zipCode=92024',\n  event)\"\n```\n\n随后，信息链接将在请求天气数据时将你的邮政编码传递给天气服务器，从而在信息弹出窗口中显示你当地的实时天气状况。\n\
  \n如果你具备一些 PHP 和 JavaScript 技能，并想对 `Forecaster` 应用进行更极端的改造，你可能想要深入研究 Yahoo! Weather\
  \ 返回的 RSS 天气数据。`Forecaster` 应用目前利用了 Yahoo! RSS Feed 包含 `<description>` 标签，它提供了一个整洁且易于\
  \ HTML 的天气视图。该 Feed 实际上包含了多得多的信息，如果你愿意，这为你自定义更详细的天气视图提供了充足的自由。\n\n例如，可以在 Yahoo!\
  \ Weather Feed 中访问以下字段以获取 `<description>` 标签中未显示的信息：\n\n```xml\n<wind chill=\"57\"\
  \ direction=\"230\" speed=\"7\" />\n<atmosphere humidity=\"72\" visibility=\"1609\"\
  \ pressure=\"30.22\"\n  rising=\"0\" />\n<astronomy sunrise=\"6:28 am\" sunset=\"\
  5:38 pm\" />\n```\n\n在这里，你在第一个 `<wind>` 标签中可以看到风寒、风向和风速。第二个标签（`<atmosphere>`）处理了大气状况，如湿度、可见度、气压以及气压上升或下降的程度。最后，第三个标签（`<astronomy>`）提供了该位置的日出和日落时间。为了解释前两个标签，另一个标签指定了天气数据的单位：\n\
  \n```xml\n<units temperature=\"F\" distance=\"mi\" pressure=\"in\" speed=\"mph\"\
  \ />\n```\n\n这行代码让你知道所有温度都以华氏度表示，距离以英里为单位，气压以英寸为单位，风速为每小时英里。在组装天气数据的自定义视图时，你可以提取这些单位并附加到天气数值之后，以提供额外的细节并赋予这些数值更多意义。\n\
  \n### 总结\n\n你无疑已经意识到，互联网上有许多来源可以获取地球上几乎任何地方的实时天气信息。并不那么容易做到的是是将此类信息紧密地关联到你自己的页面中，同时又不损害用户体验。信息弹出窗口提供了一种巧妙的机制，可以在你页面的上下文中显示天气数据，而无需让用户离开页面。`Forecaster`\
  \ 应用很好地演示了在自己的页面中包含特定位置的实时天气数据是多么简单。\n\n## 第 11 章。构建一个 Ajax 运费计算器\n\n### 高海拔的 Ajax\n\
  \n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg) |\
  \ 如果你热衷豪华滑雪，你可能熟悉 Ajax 在山地的应用。阿斯彭山位于科罗拉多州奢华小镇阿斯彭的正南方，是阿斯彭/斯诺马斯滑雪场的所在地。当地人有时将阿斯彭山称为\
  \ Ajax。 |\n\n你难道厌倦在线购物体验中的这种部分吗：你对买某东西感兴趣，但需要知道运费来判断是否真的划算？问题在于，大多数购物车在结账流程的最后一步之前（在你输入姓名、地址、出生日期、母亲母姓、从小最喜爱的宠物以及在完成购买前能从你那里获取的任何个人数据之后）都不会告知你运费。如果在结账过程早期就能获得运费，肯定是在输入信用卡信息之前，最好在不刷新页面的情况下，那该有多好？正如你可能猜到的那样，Ajax\
  \ 提供了一种更好的方法。\n\n本章通过向你展示如何使用 Ajax 在用户毫无察觉的情况下动态确定运费，从而解决了运费问题。不仅如此，运费直接从美国邮政局（USPS）运费\
  \ Web 服务中获取，这意味着你不需要猜测或处理可能过时的查找表——你直接从源头获取信息。本章中的 `Shipper` 示例应用有力地证明了 Ajax 如何优雅地解决常见问题，并悄悄提升任何涉及运费计算的\
  \ Web 应用的体验。\n\n本章中的 `Shipper` 应用使用了以下文件，它们位于随书附带的实时 Linux 光盘的 `chap11` 示例代码文件夹中：\n\
  \n* `shipper.html`——主网页\n* `shipper.php`——加载运费的服务器脚本\n* `ajaxkit.js`——Ajax Toolkit\
  \ 的核心 Ajax 函数\n* `domkit.js`——Ajax Toolkit 的与 DOM 相关的函数\n* `wait.gif`——在加载运费时显示的动画“加载”图标\n\
  \n### 挑战：获取实时运费\n\n本章的挑战在理论上很简单，但在实践中有些棘手。棘手之处源于用于获取运费信息的 Web 服务访问并不像你在整书中看到的其他\
  \ Web 服务那样容易访问。更具体地说，本章中的 `Shipper` 应用使用美国邮政局的 Web Tools 来检索运费。问题在于 USPS 的 Web 服务要求你提交一份相当详细的\
  \ XML 文档才能获取运费。\n\n当然，当你考虑到确定物品运输成本涉及的几处信息时，这不应该太令人惊讶。你需要起点和目的地位置（邮政编码），以及物品本身的细节（如尺寸和重量）。然后你必须从几种可能的运输方案中进行选择，例如包裹邮（Parcel\
  \ Post）或优先邮件（Priority Mail）。所有这些信息必须仔细地封装到 USPS Web 服务能够理解的 XML 文档中。\n\n为了让 `Shipper`\
  \ 应用具有实用感，它的用户界面模拟了一个购物车，你已经选择了一个特定商品进行购买并准备好结账。然而，为了简单起见，你并不控制购物车的内容。换句话说，`Shipper`\
  \ 应用完全专注于接收目的地运输信息，以便能够动态计算运费。构建一个功能完全的购物车超出了本章的范围。\n\n\n\n\n\n尽管在 Shipper 应用程序中用户无法操作购物车的内容，但目的邮政编码（ZIP\
  \ code）和运输方式是可以更改的。这便引入了 Ajax 的用场。每当邮政编码或运输方式发生变化时，就会向 USPS Web 服务发送 Ajax 请求，以获取新的运费并更新购物车。你之所以能够更新购物车，是因为应用程序已经知道购物车中物品的价格。因此，只需将物品价格与运费相加，即可显示购物车的总额。\n\
  \n同样，尽管应用程序给出了功能完备的购物车的错觉，但它实际上所做的只是使用静态购物车数据结合动态运费信息（邮政编码和运输方式），通过 Ajax 获取运费并更新交易总额。这使得挑战紧紧围绕当前主题——即使用\
  \ Ajax 动态从 USPS Web 服务中获取运费。\n\n# 第 11 章：构建一个 Ajax 运费计算器\n\n## 高海拔的 Ajax\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 如果你热衷高端滑雪，你可能对 Ajax 应用于山地并不陌生。阿斯彭山位于科罗拉多州奢华的阿斯彭镇正南方，是阿斯彭/雪松山滑雪场的所在地。当地人有时将阿斯彭山称为\
  \ Ajax。 |\n\n你难道不会对在线购物的某个环节感到厌倦吗？你想买件东西，但需要知道运费来判断是否真的划算？问题在于，大多数购物车在结账流程的最后一步之前都不会告诉你运费，那时你已经输入了姓名、地址、出生日期、母亲母姓、童年最喜欢的宠物，以及在完成购买之前能从你那里获取的任何个人数据。如果能在结账流程早期（肯定是在输入信用卡信息之前）就获得运费，而且最好不需要刷新页面，那该有多好呢？正如你可能猜到的那样，Ajax\
  \ 提供了一种更好的方法。\n\n本章通过向你展示如何使用 Ajax 在用户甚至察觉不到的情况下动态确定运费，从而解决了运费问题。不仅如此，运费是直接从美国邮政局（USPS）运费\
  \ Web 服务获取的，这意味着你不需要猜测或处理可能过时的查找表——你直接从源头获取信息。本章中的 Shipper 示例应用程序明确展示了 Ajax 如何优雅地解决常见问题，并悄悄地提升任何涉及运费计算的\
  \ Web 应用程序的体验。\n\n本章中的 Shipper 应用程序使用了以下文件，它们位于随书附带的 Linux 光盘的 `chap11` 示例代码文件夹中：\n\
  \n* `shipper.html`——主 Web 页面\n* `shipper.php`——加载运费的服务器脚本\n* `ajaxkit.js`——Ajax\
  \ Toolkit 的核心 Ajax 函数\n* `domkit.js`——Ajax Toolkit 的 DOM 相关函数\n* `wait.gif`——在加载运费时显示的动画“加载”图标\n\
  \n## 挑战：获取实时运费\n\n本章的挑战在理论上很简单，但在实践中有些棘手。棘手之处源于用于获取运费信息的 Web 服务并不像你在书中其他地方看到的其他某些\
  \ Web 服务那样容易访问。具体来说，本章中的 Shipper 应用程序使用美国邮政局 Web 工具（Web Tools）来获取运费。问题在于，USPS Web\
  \ 服务要求你提交一份相当详细的 XML 文档才能获得运费。\n\n当然，考虑到确定物品运输成本涉及多项信息，这并不应该太令人惊讶。你有起点和目的地（邮政编码），以及物品本身的具体信息，如尺寸和重量。然后，你必须从几种可能的运输方案中选择，例如邮政\
  \ Parcel Post 或优先邮件 Priority Mail。所有这些信息都必须仔细地封装到 USPS Web 服务能够理解的 XML 文档中。\n\n\
  为了让 Shipper 应用程序具有实用感，它的用户界面模拟了一个购物车，你已经选择了一个特定物品进行购买并准备结账。然而，为了简单起见，你并不提供购物车内容的控制权。换句话说，Shipper\
  \ 应用程序专注于接收目的运输信息，以便它可以动态计算运费。构建一个功能完备的购物车超出了本章的范围。\n\n尽管在 Shipper 应用程序中用户无法操作购物车的内容，但目的邮政编码和运输方式是可以更改的。这便引入了\
  \ Ajax 的应用。每当邮政编码或运输方式发生变化时，就会向 USPS Web 服务发送 Ajax 请求，以获取新的运费并更新购物车。你之所以能够更新购物车，是因为应用程序已经知道购物车中物品的价格。因此，只需将物品价格与运费相加，即可显示购物车的总额。\n\
  \n同样，尽管应用程序给出了功能完备的购物车的错觉，但它实际上所做的只是使用静态购物车数据结合动态运费信息（邮政编码和运输方式），通过 Ajax 获取运费并更新交易总额。这使得挑战紧紧围绕当前主题——即使用\
  \ Ajax 动态从 USPS Web 服务中获取运费。\n\n## 设计：设计 Shipper 应用程序\n\n由于 Shipper 应用程序试图模拟购物车，其的一些用户界面元素纯粹是装饰性的，并不直接影响功能。图\
  \ 11.1 显示了应用程序用户界面的草图，以及哪些字段在检索和显示运费信息中起着直接作用。\n\n### 图 11.1. Shipper 应用程序的用户界面包括输入邮政编码和查看结果运费的字段。\n\
  \n![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjmgkvkvmnncdfzmghnmwkuawlmms8-.jpg)\n\
  \n该图显示了几个输入字段，但只有两个——邮政编码和运输方式直接影响运费的计算。这种运费计算涉及向 USPS Web 服务提交邮政编码、运输方式以及关于运输物品的其他详细信息，以获取国内运费。在从\
  \ USPS 服务器成功获取运费后，Shipper 应用程序通过将物品价格与运费相加计算订单总额。\n\n由于用户完全可能输入无效的邮政编码，从而无法产生运费，邮政编码旁边有一个帮助文本显示字段，告知用户邮政编码是否存在问题。如果服务器返回的运费为\
  \ `0`，则设置此字段，表示邮政编码存在问题。\n\nShipper 应用程序另一个图中未展示的细微之处是使用了动画“加载”图像来指示 Ajax 请求的状态。当在\
  \ USPS 服务器上查询运费时，该图像会出现在运费的位置。图 11.2 显示了这张小图片 `wait.gif` 的样子。\n\n\n\n\n\n### 图 11.2.\
  \ Shipper 应用使用一个小的动画“加载”图像 (`wait.gif`) 来让用户知道 Ajax 请求正在处理中。\n\n![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdfzmghqmnauawlnms8-.jpg)\n\
  \n因为在处理运费请求时，用户可能可能仍在忙于输入信息，因此没有必要让该“加载”图像在页面上变得显眼。这就是为什么它出现在运费显示的位置的原因。当然，这意味着运费字段承担了双重职责，但这并不构成问题。只需知道，在没有进行请求时，该字段存储的是实际运费，而在请求进行期间，它会显示“加载”图像即可。\n\
  \n尽管 Shipper 应用的用户界面中有大量的输入字段，但请记住，只有两个字段（邮政编码和运输方式）直接参与了运费 Ajax 请求。而且只有少数其他字段（运费和订单总额）会影响请求的运费信息的显示。\n\
  \n所以，尽管该应用程序看起来相当复杂，但它实际上只处理了一个 Ajax 请求，这极大地简化了工作。你现在准备好进一步了解一下运费 Ajax 请求了。\n\n\
  ### 客户端请求\n\nShipper 应用的客户端请求是你在书中遇到的最棘手的 Ajax 请求之一，因为它负责向服务器传递大量的信息。然而，在深入研究这些信息的细节之前，让我们先快速说明我们正在处理的是一个远程\
  \ Web 服务器这一事实。\n\n正如你从许多其他示例应用程序中回起来的那样，出于安全考虑，无法直接在第三方（远程）Web 服务器上发出 Ajax 请求。绕过这一限制的方法是使用你自己的服务器脚本作为基础，将请求转发到远程服务器，这是被允许的，因为服务器与服务器之间的通信被认为是完全合法的。事实证明，在这种情况下，出于\
  \ Ajax 安全限制之外的原因，还需要一个服务器脚本，因此你仍然会处理一个 `PHP` 脚本。\n\n我已经提到过，Shipper 应用只需要传递邮政编码和运输方式，即可从\
  \ USPS Web 服务器获取实时运费。虽然从应用程序的角度来看可能是这样，但从 USPS 的角度来看完全不是。为了确定邮寄物品的成本，需要多得的信息。具体来说，USPS\
  \ 国内费率 Web 服务需要以下信息来成功返回运费：\n\n* 用户 ID (User ID)\n* 密码 (Password)\n* 运输方式 (Shipping\
  \ method)\n* 起始邮政编码 (Origin ZIP code)\n* 目的地邮政编码 (Destination ZIP code)\n* 物品重量（磅）\n\
  * 物品重量（盎司）\n* 容器类型（Container type）\n* 尺寸（Size）\n* 可机械（符合正常包裹限制）\n\n前两项信息是你的 USPS\
  \ Web Tools 账户的用户 ID 和密码，这是测试 Shipper 应用的必要条件。事实上，你甚至在运行应用程序之前必须获取自己的用户 ID。正如我之前提到的，USPS\
  \ 对访问其 Web 服务的限制比你在书中遇到的其他服务严格得多。反过来，你可以从服务器脚本安全地引用你的 USPS 用户 ID 和密码，而不是客户端 Web\
  \ 页面，这为 Shipper 应用提供了额外的安全措施。\n\n#### 注意\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 出测试目的，你可能只会被分配用户 ID 而没有密码，这意味着在发送运费请求时，你可以将密码为空。 |\n\n你对接下来的这些信息应该有相当的了解，因为我们已经讨论了很多运输方式和邮政编码。不过，值得指出的是\
  \ Shipper 应用将起始邮政编码硬编码（hard-codes）为 USPS 测试所需的特定测试邮政编码。在生产环境中，你会将此邮政编码更改为你发送包裹的起始邮政编码。\n\
  \n#### 注意\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 当我说应用程序“硬编码”某项信息时，我的意思是应用程序在内部设置了该信息，而不是允许用户选择或输入它。这在 Shipper 应用中主要是一种简化处理，尽管某些硬编码信息即使在生产应用程序中也不可能改变。\
  \ |\n\n传递给 USPS Web 服务的两个重量对于将包裹重量拆分为不同的单位组成部分是必要的。这些重量是结合在一起使用的，这意味着一个重量为 4 磅 3\
  \ 盎司的包裹将产生“磅”值为 4，“盎司”值为 3。换句话说，这并不意味着你提供了不同单位的总重量。另一个例子是，如果包裹重量为 6 磅 0 盎司，那么“磅”值为\
  \ 6，“盎司”值为 0。Shipper 应用再次硬编码了这些值，因为它只是在模拟购物车，并假设你在结账流程的此时已经选择了一个物品。\n\n容器类型描述了盛放包裹的容器，为了测试目的，必须设置为“Flat\
  \ Rate Box”（固定费用箱）。尽管你可能想在生产应用程序中加入其他容器类型，但 Flat Rate Box 涵盖了大量的包裹。这是 Shipper 应用中硬编码的另一个信息。\n\
  \n包裹尺寸必须对应 USPS 标准包裹尺寸标记之一。为了测试目的，你必须将包裹尺寸设置为“Large”（大）。不出意外，这项信息在 Shipper 应用中是硬编码的。\n\
  \n你需要传递给 USPS Web 服务的最后一个信息是包裹是否“可机械”（machinable），这指的是包裹是否符合某些可预测的限制。不可机械的包裹包括巨大的包裹、形状规则的容器以及其他你没有运输合理尺寸的扁平或箱形容器的场景。为了测试目的，你必须指定包裹是可机械的。我确定你猜到了——请求中的可机械信息在\
  \ Shipper 应用中是硬编码的。\n\n我不指你背下 USPS 运费 Ajax 请求所需的各种不同信息。稍后当你探索用于为 USPS 服务器格式化这些信息的特定\
  \ XML 代码时，你会再次看到它们。\n\n### 服务器响应\n\n正如 USPS 国内费率 Web 服务期望一个 XML 文档作为计算费率的基础一样，它也以\
  \ XML 文档的形式返回费率。事实上，它通常用于一次性返回多个费率，在这种情况下，处理请求的应用程序的任务就是提取所需的特定费率。在 Shipper 应用中，`PHP`\
  \ 服务器脚本的任务是接收 USPS XML 响应数据并进行筛选以找到所需的运费。\n\n下一节将深入探讨与 USPS 国内费率 Web 服务往返传递的数据，包括作为\
  \ USPS 服务器响应返回的特定 XML 数据。\n\n### 理解客户端到服务器的对话\n\nShipper 应用中的 Ajax 请求用于将用户输入的邮政编码和运输方式传输到服务器，以及其他几个固定的\
  \ USPS 运输信息。作为回报，`PHP` 服务器脚本向 Shipper 客户端 Web 页面返回单一运费。图 11.3 有助于直观地澄清这种数据传输。\n\n\
  \n\n\n\n### 图 11.3. Shipper 应用涉及向服务器发送几条货运信息，并向客户端返回单个运费率。\n\n![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdfzmghnm2kuawlmms8-.jpg)\n\
  \n在我们进一步研究 Shipping 应用的细节之前，有一点非常重要：在被允许使用生产服务器之前，你必须对任何使用 USPS Web Tools 的应用程序在\
  \ USPS 测试服务器上进行测试。在实际操作中，这意味着你在测试应用程序时，仅限于一组非常特定的测试数据。这意味着你即将看到的用于 Shipper 应用的测试数据并不是随机的——它们是\
  \ USPS 专门为供其测试服务器使用而提供的。\n\n#### 注意事项\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 如果你在继续使用 USPS 测试服务器的同时偏离了标准的 USPS 测试数据，Shipper 应用将无法工作。在获得 USPS 验证并获得其生产服务器的权限之前，你无法尝试全范围的测试数据（邮政编码）。你可以在本章后面的“为\
  \ Shipper 进行极端的 Ajax 改新”部分中了解更多关于如何验证的信息。 |\n\nUSPS 实施的测试数据甚至限制你使用特定的起始邮政编码和特定的目的地邮政编码。以下是一个\
  \ Ajax 请求 URL，它使用标准 USPS 测试数据集来检索 Shipper 应用的运费率数据：\n\n```\nshipper.php?userID=YOURUSPSUSERID&origZip=10022&destZip=20008&\n\
  weightLb=10&weightOz=5&container=Flat%20Rate%20Box%20&\nsize=Large&mailService=Priority%20Mail\n\
  ```\n\n首先，要理解这是一个长 URL，尽管它在页面上跨越了多行。所有的信息应该至少大致熟悉，因为你已经学习了 USPS 国内费率货运请求所需的各个。我还没有完全解释的一点是用户\
  \ ID，你会发现它被设置为 `YOURUSPSUSERID`。你可能还注意到 URL 中没有指定密码。这是怎么回事？\n\n为了访问 USPS Web Tools，你需要拥有一个由\
  \ USPS 发放给你的用户 ID，USPS 对共享用户 ID 要求非常严格。这就是为什么我不能直接把我的 ID 打印在这里给你使用。所以，在继续之前，我鼓励你到\
  \ [`www.usps.com/webtools/`](http://www.usps.com/webtools/) 免费注册自己的 USPS Web Tools\
  \ 用户 ID。获取此 ID 后，你就可以将其插入刚刚看到的 URL 中以完成一个 Shipper Ajax 请求 URL。\n\n在 USPS Web 服务应用的测试阶段，不需要提供密码，这就是为什么\
  \ URL 中没有指定密码。在生产环境中，你肯定会使用密码；`shipper.php` 服务器脚本通过请求 URL 中的 `password` 参数接受密码。\n\
  \n此时，区分在你的服务器上发出的 Ajax 请求 URL 和在 USPS 服务器上发出的 USPS 请求 URL 是非常重要的。前者用于将数据传递给你的 `shipper.php`\
  \ 服务器脚本，而后者用于在你的 `shipper.php` 服务器脚本内部在 USPS 服务器上执行实际的运费率查询。因此，`shipper.php` 脚本驻于你的服务器上，负责通过\
  \ URL 接收货运参数，然后使用它们构建另一个 URL，将查询传递给 USPS 服务器。\n\n你刚刚看到了 Ajax 请求的 URL，现在让我们把关注转向\
  \ USPS 请求，它期望货运信息以 XML 格式化：\n\n```\nhttp://testing.shippingapis.com/ShippingAPITest.dll?API=RateV2&\n\
  XML=<RateV2Request%20 USERID=\"YOURUSPSUSERID\"%20PASSWORD=\"\">\n<Package%20ID=\"\
  0\"><Service>All</Service><ZipOrigination>10022\n</ZipOrigination><ZipDestination>20008</ZipDestination><Pounds>\n\
  10</Pounds><Ounces>5</Ounces><Container>Flat%20Rate%20Box\n</Container><Size>Large</Size><Machinable>true</Machinable>\n\
  </Package></RateV2Request>\n```\n\n哎呀！我知道你在想那是一段看起来很乱的 XML 代码。当它以 URL 的形式挤在一起时，确实确实如此。但让我们添加一些换行和制表符，以更传统的\
  \ XML 视图显示它：\n\n```\nhttp://testing.shippingapis.com/ShippingAPITest.dll?API=RateV2&\n\
  XML=\n<RateV2Request USERID=\"YOURUSPSUSERID\" PASSWORD=\"\">\n  <Package ID=\"\
  0\">\n    <Service>All</Service>\n    <ZipOrigination>10022</ZipOrigination>\n \
  \   <ZipDestination>20008</ZipDestination>\n    <Pounds>10</Pounds>\n    <Ounces>5</Ounces>\n\
  \    <Container>Flat Rate Box</Container>\n    <Size>Large</Size>\n    <Machinable>true</Machinable>\n\
  \  </Package>\n</RateV2Request>\n```\n\n现在 USPS 请求 URL 应该更有意义了。发生的一切仅仅是 Ajax 请求数据现在被格式化为符合\
  \ USPS 国内费率请求格式的 XML 文档。两个没有直接映射到你传递的数据的信息是 `<Service>` 和 `<Machinable>` 标签，它们用于表示你想获取所有货运方式（服务）的运费，并且该包裹确实是可机器处理的（包装方面没有异常）。\n\
  \n当此请求发送到 USPS 服务器后，将返回一个不同的 XML 文档：\n\n代码视图：\n\n```\n<RateV2Response>\n  <Package\
  \ ID=\"0\">\n    <ZipOrigination>10022</ZipOrigination>\n    <ZipDestination>20008</ZipDestination>\n\
  \    <Pounds>10</Pounds>\n    <Ounces>5</Ounces>\n    <Size>LARGE</Size>\n    <Machinable>TRUE</Machinable>\n\
  \    <Zone>3</Zone>\n    <Postage>\n      <MailService>Express Mail to POressee</MailService>\n\
  \      <Rate>39.20</Rate>\n    </Postage>\n    <Postage>\n      <MailService>Priority\
  \ Mail</MailService>\n      <Rate>8.95</Rate>\n    </Postage>\n    <Postage>\n \
  \     <MailService>Parcel Post</MailService>\n      <Rate>7.80</Rate>\n    </Postage>\n\
  \    <Postage>\n      <MailService>Bound Printed Matter</MailService>\n      <Rate>3.53</Rate>\n\
  \    </Postage>\n    <Postage>\n      <MailService>Media Mail</MailService>\n  \
  \    <Rate>5.14</Rate>\n    </Postage>\n    <Postage>\n      <MailService>Library\
  \ Mail</MailService>\n      <Rate>4.91</Rate>\n    </Postage>\n  </Package>\n</RateV2Response>\n\
  ```\n\n这个响应文档重复了部分原始请求信息，但也包含了大量的运费信息。事实上，因为请求指定了 `All` 作为货运方式，响应包含了所有货运方式的运费。而且因为运费是\
  \ XML 格式，在 PHP 代码中提取特定费率一点也不困难。例如，对于查询 Priority Mail 货运方式，`server.php` 脚本将返回以下数据：\n\
  \n```\n8.95\n```\n\n希望你现在开始理解数据在 Shipper 应用中是如何传输的。为了确保你没有在 URL 和 XML 代码的旋风中迷失，这里是该流程的回顾：\n\
  \n1.  你的客户端 Web 页面通过包含货运信息的 URL 向你的 PHP 服务器脚本发出 Ajax 请求。\n2.  你的 PHP 服务器脚本构建另一个包含\
  \ XML 货运信息的 URL，并向 USPS 国内费率 Web 服务发出请求。\n3.  USPS 国内费率 Web 服务返回包含所有货运方式运费的 XML\
  \ 文档。\n4.  你的 PHP 服务器脚本解析出所需货运方式的运费，并将其返回给你的客户端 Web 页面。\n5.  结束。\n\n但这并不是真正的结束，因为你还没有看到实现这一切的代码。显然，现在是将一切整合在一起的时候了。\n\
  \n\n\n\n尽管数据通信模型看起来相当复杂，但 Shipper 应用在组件和部分上非常简单。事实上，除了标准的 Ajax Toolkit 文件外，该应用仅包含两个文件：\n\
  \n* HTML 网页 (`shipper.html`)\n* PHP 服务器脚本 (`shipper.php`)\n\n接下来的几个小节将更详细地探讨 Shipper\
  \ 应用谜题中的这两个部分。\n\n### Shipper 网页\n\nShipper 应用的 HTML 网页由若干个文本输入字段组成，允许用户输入货运信息。这些字段中的大部分是用于支持购物车结账概念的装饰性内容。邮政编码字段显然在应用程序的功能中起着重要作用，运费方式选择框也是如此。图\
  \ 11.4 显示了 Shipper 应用在使用无效邮政编码时，从而显示了邮政编码输入控件右侧的错误消息显示区域。\n\n#### 图 11.4. Shipper\
  \ 网页包含多个输入控件和显示区域，尽管邮政编码输入和运费输出字段恰无疑是最重要的。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3axczrhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdfzmghqnhauawlnms8-.jpg)\n\
  \n结合图中所示的 Shipper 应用布局，请查看 `shipper.html` 网页主体的 HTML 代码：\n\n代码视图：\n\n```\n<body\
  \ onload=\"initForm()\">\n  <div id=\"ajaxState\" style=\"display:none\"></</div>\n\
  \  <br />\n  <table width=\"500px\">\n    <tr>\n      <td class=\"heading\" colspan=\"\
  3\">Shipping Information</td>\n    </tr>\n    <tr>\n      <td class=\"label\">Name:</td>\n\
  \      <td class=\"value\" colspan=\"2\"><input type=\"text\"\n        id=\"name\"\
  \ size=\"30\" /></td>\n    </tr>\n    <tr>\n      <td class=\"label\">Address 1:</td>\n\
  \      <td class=\"value\" colspan=\"2\"><input type=\"text\"\n        id=\"addr1\"\
  \ size=\"30\" /></td>\n    </tr>\n    <tr>\n      <td class=\"label\">Address 2:</td>\n\
  \      <td class=\"value\" colspan=\"2\"><input type=\"text\"\n        id=\"addr2\"\
  \ size=\"30\" /></td>\n    </tr>\n    <tr>\n      <td class=\"label\">City:</td>\n\
  \      <td class=\"value\" colspan=\"2\"><input type=\"text\"\n        id=\"city\"\
  \ size=\"20\" /></td>\n    </tr>\n    <tr>\n      <td class=\"label\">State/Province/Region:</td>\n\
  \      <td class=\"value\" colspan=\"2\"><input type=\"text\"\n        id=\"state\"\
  \ size=\"3\" /></td>\n    </tr>\n    <tr>\n      <td class=\"label\">ZIP/Postal\
  \ Code:</td>\n      <td class=\"value\"><input type=\"text\" id=\"zipCode\" size=\"\
  10\"\n        onchange=\"getShipRate()\" /></td>\n      <td class=\"label\" width=\"\
  50%\"><span id=\"zipCodeErr\"\n        style=\"font-size:80%; color:#BB0000;\"></</span>></td>\n\
  \    </tr>\n    <tr>\n      <td class=\"label\">Country:</td>\n      <td class=\"\
  value\" colspan=\"2\"><input type=\"text\"\n         id=\"country\" size=\"25\"\
  \ value=\"USA\"\n         readonly=\"readonly\" /></td>\n    </tr>\n    <tr>\n \
  \     <td class=\"label\">Phone Number:</td>\n      <td class=\"value\" colspan=\"\
  2\"><input type=\"text\" id=\"phone\"\n        size=\"10\" /></td>\n    </tr>\n\
  \  </table>\n  <br />\n  <table width=\"500px\">\n    <tr>\n      <td colspan=\"\
  3\" class=\"heading\">Order Summary</td>\n   </tr>\n   <tr>\n      <td class=\"\
  label\">Item:</td>\n      <td class=\"label\"><span id=\"item\"></span></td>\n \
  \     <td class=\"label\"><span id=\"price\"></span></td>\n   </tr>\n   <tr>\n \
  \     <td class=\"label\">Shipping & Handling:</td>\n      <td class=\"label\">\n\
  \        <select id=\"mailService\" onchange=\"getShipRate()\">\n          <option\
  \ value=\"Parcel Post\">Parcel Post</option>\n          <option value=\"Priority\
  \ Mail\" selected=\"selected\">\n            Priority Mail</option>\n          <option\
  \ value=\"Express Mail to PO Addressee\">\n            Express Mail</option>\n \
  \       </select>\n       </td>\n       <td class=\"label\"><span id=\"shiprate\"\
  >0.00</span></td>\n   </tr>\n   <tr>\n       <td class=\"label\">Total:</td>\n \
  \      <td class=\"label\"></td>>\n       <td class=\"label\"><span id=\"total\"\
  ></span></td>\n   </tr>\n  </table>\n  <table width=\"500px\">\n    <tr>\n     \
  \  <td class=\"heading\"><input type=\"button\"\n         value=\"Proceed with Checkout\"\
  \ /></td>\n   </tr>\n  </table>\n </body> \n```\n\n这些 `HTML` 代码的很大一部分都用于各种输入字段的标签和文本框。唯一有意义的输入字段是邮政编码输入控件，它在\
  \ `onchange` 事件处理程序中调用了 `getShipRate()` 函数。以防你在长列表中难以查看，这里再次列出该代码：\n\n```\n<input\
  \ type=\"text\" id=\"zipCode\" size=\"10\";\n  onchange=\"getShipRate()\" />\n```\n\
  \n紧随邮政编码 `input` 元素之后是一个 `span` 元素，用于显示邮政编码错误消息。你必须向代码向下跳过一段，才能遇到另一个感兴趣的项目，即邮件服务（运费方式）选择列表。此列表包含三个可能的选项（包裹邮\
  \ Parcel Post、优先信件 Priority Mail 和寄往邮局信箱的快递 Express Mail），并在响应 `onchange` 事件时同样调用\
  \ `getShipRate()` 函数。以下是单独列出的该列表：\n\n```\n<select id=\"mailService\" onchange=\"\
  getShipRate()\">\n  <option value=\"Parcel Post\">Parcel Post</option>\n  <option\
  \ value=\"Priority Mail\" selected=\"selected\">\n    Priority Mail</option>\n \
  \ <option value=\"Express Mail to PO Addressee\">\n    Express Mail</option>\n</select>\n\
  ```\n\n\n\n\n```javascript\nfunction getShipRate() {\n  // Display the wait image\n\
  \  document.getElementById(\"shiprate\").innerHTML =\n    \"<img src='wait.gif'\
  \ alt='Looking up shipping rate...' />\";\n\n  // Assemble the shipping info request\
  \ string\n  var shipInfo = \"userID=YOURUSPSUSERID\" +\n    \"&origZip=\" + encodeURIComponent(origZip)\
  \ +\n    encodeURIComponent(\n    document.getElementById(\"zipCode\").value) +\n\
  \    \"&weightLb=\" + encodeURIComponent(weightLb) +\n    \"&weightOz=\" + encodeURIComponent(weightOz)\
  \ +\n    \"&container=\" + encodeURIComponent(container) +\n    \"&size=\" + encodeURIComponent(size)\
  \ +\n    \"&mailService=\" +\n    encodeURIComponent(\n    document.getElementById(\"\
  mailService\").value);\n  ajaxSendRequest(\"GET\", \"shipper.php?\" + shipInfo,\n\
  \    handleRequest);\n}\n```\n\n该函数的第一个任务是设置 `shiprate` 元素，以便显示“加载”图像（`wait.gif`）。在显示“加载”图像后，函数将开始组装运信息，这些信息以\
  \ URL 的形式存在，并通过 `shipper.php` 服务器脚本通过 `GET` 请求进行提交。非常重要的一点是，你必须修改此代码，在分配 `userID`\
  \ 参数时包含你唯一的用户 ID。换句话说，将 `YOURUSPSUSERID` 更改为注册 USPS Web Tools 时为你提供的 ID。\n\nAjax\
  \ 运费请求由 `handleRequest()` 函数处理，该函数负责从服务器脚本接收单个运费并相应地更新页面。以下是该函数的代码：\n\n```javascript\n\
  function handleRequest() {\n  ajaxUpdateState();\n  if (request.readyState == 4\
  \ && request.status == 200) {\n    var shipRate = request.responseText;\n    if\
  \ (parseFloat(shipRate) != 0.0) {\n      replaceText(document.getElementById(\"\
  zipCodeErr\"), \"\");\n      updateTotal(shipRate);\n    }\n    else {\n      replaceText(document.getElementById(\"\
  zipCodeErr\"),\n        \"Cannot ship to this ZIP code.\");\n      updateTotal(\"\
  0.00\");\n    }\n  }\n}\n```\n\n这个函数对于一个 Ajax 请求处理器来说相当简单，主要涉及将运费转换为浮点数，然后通过调用 `updateTotal()`\
  \ 计算订单总额。页面的错误消息区域也经过设置，如果请求失败则显示消息，如果请求成功则清除消息。\n\n请稍等，因为 Shipper Web 页面的代码快写完了。以下是你需要了解的最后一段代码，即\
  \ `updateTotal()` 函数：\n\n```javascript\nfunction updateTotal(shipRate) {\n  document.getElementById(\"\
  shiprate\").innerHTML = shipRate;\n  var total = itemPrice + parseFloat(shipRate);\n\
  \  replaceText(document.getElementById(\"total\"), \"$\" + total);\n}\n```\n\n`updateTotal()`\
  \ 函数接受一个新的运费作为其唯一参数，然后根据该费率更新页面并计算新的订单总额。此代码中一个初看之下可能令人困惑的细节是 `innerHTML` 与 `replaceText()`\
  \ 函数的用法区别。理想情况下，你应该只使用 `replaceText()`，因为它不会改变底层 HTML 代码的结构。然而，由于运费 `span` 元素兼任了费率显示和“加载”图像显示的双重职责，这意味着你必须使用\
  \ `innerHTML`。这是必要的，因为在文本和图像之间切换确实会改变 HTML 代码的结构，而仅使用 `replaceText()` 函数是无法实现的。\n\
  \n### Shipper 服务器脚本\n\n考虑到 Shipper 应用客户端的需求，现在是将你的注意力转向服务器了。你已经了解到 `shipper.php`\
  \ 脚本的作用是使用传递给它的运费信息来组装一个 XML 文档，以便提交给 USPS 国内费率 Web 服务。然后，它必须获取生成的响应 XML 文档，并从中提取特定的运费。\n\
  \n尽管这听起来可能需要大量的杂乱代码，但 Shipper 应用程序的 PHP 服务器脚本实际上并不复杂，如下代码所示：\n\n```php\n// 为 USPS\
  \ 服务器请求生成 XML 文档\n$uspsRequest =\n  \"http://testing.shippingapis.com/ShippingAPITest.dll?\"\
  ;\n$uspsRequest .= \"API=RateV2&XML=\";\n$uspsRequest .= \"<RateV2Request%20USERID=\\\
  \"\";\n$uspsRequest .= $_REQUEST[\"userID\"];\n$uspsRequest .= \"\\\"%20PASSWORD=\\\
  \"\";\n$uspsRequest .= $_REQUEST[\"password\"] . \"\\\">\";\n$uspsRequest .= \"\
  <Package%20ID=\\\"0\\\"><Service>\" . \"All\";\n$uspsRequest .= \"</Service>\";\n\
  $uspsRequest .= \"<ZipOrigination>\" . $_REQUEST[\"origZip\"];\n$uspsRequest .=\
  \ \"</ZipOrigination>\";\n$uspsRequest .= \"<ZipDestination>\" . $_REQUEST[\"destZip\"\
  ];\n$uspsRequest .= \"</ZipDestination>\";\n$uspsRequest .= \"<Pounds>\" . $_REQUEST[\"\
  weightLb\"] . \"</Pounds>\";\n$uspsRequest .= \"<Ounces>\" . $_REQUEST[\"weightOz\"\
  ] . \"</Ounces>\";\n$uspsRequest .= \"<Container>\" . urlencode($_REQUEST[\"container\"\
  ]);\n$uspsRequest .= \"</Container>\";\n$uspsRequest .= \"<Size>\" . $_REQUEST[\"\
  size\"] . \"</Size>\";\n$uspsRequest .= \"<Machinable>\" . \"true\" . \"</Machinable>\"\
  ;\n$uspsRequest .= \"</Package></RateV2Request>\";\n```\n\n这段代码并不是整个 PHP 脚本，但它是最大的代码块，负责从作为\
  \ PHP 参数传递给脚本的运费信息组装 XML 文档。\n\n当 USPS 请求 XML 文档准备就绪后，脚本将发出请求并返回一个响应 XML 文档：\n\n\
  ```php\n// 将运费响应数据解析为结构\n$rawShipping = file_get_contents($uspsRequest);\n$xml =\
  \ new SimpleXmlElement($rawShipping);\n```\n\n你现在将 XML 响应数据存储在 PHP 变量 `$xml` 中，并准备解析出与\
  \ `mailService` 参数传递的邮件方式匹配的特定运费：\n\n```php\n// 返回对应邮件服务的费率\n$rate = 0;\nif ($xml->Package->Postage\
  \ != null) {\n  foreach ($xml->Package->Postage as $postage) {\n    if ($postage->MailService\
  \ == $_REQUEST['mailService']) {\n      $rate = $postage->Rate;\n      break;\n\
  \    }\n  }\n}\necho $rate;\n```\n\n这段代码遍历响应 XML 文档寻找 `<Postage>` 标签。在每个找到的 `<Postage>`\
  \ 标签中，检查子标签 `<MailService>` 的内容是否与指定的邮件（例如 Priority Mail）匹配。如果匹配，则返回 `<Rate>` 标签的内容供客户端处理。\n\
  \n尽管我知道你已经迫待要离开这些代码并测试 Shipper 应用，但在继续之前，让我们花点时间单独测试 PHP 脚本。在之前的章节中，你已经过直接在浏览器中打开\
  \ PHP 脚本的方法——这里有一个测试脚本的示例 URL：\n\n```\nhttp://www.yourdomain.com/shipper.php?userID=YOURUSPSUSERID&origZip=10022&destZip=20008&weightLb=10&weightOz=5&container=Flat%20Rate%20Box&size=Large&mailService=Priority%20Mail\n\
  ```\n\n假设 `shipper.php` 文件存储在你的服务器上，请将代码中的域名更改为你的域名，将 `YOURUSPSUSERID` 替换为你的用户 ID，然后将\
  \ URL 输入你的 Web 浏览器。或者在随书的光盘上直接使用以下 URL，但仍确保将 `YOURUSPSUSERID` 替换为你自己的用户 ID：\n\n\
  ```\nhttp://localhost/chap11/shipper/shipper.php?\nuserID=YOURUSPSUSERID&origZip=10022&destZip=20008&weightLb=10&\n\
  weightOz=5&container=Flat%20Rate%20Box&size=Large&mailService=\nPriority%20Mail\n\
  ```\n\n图 11.5 显示了 PHP 脚本生成的运费。\n\n##### 图 11.5. Shipper PHP 脚本返回的唯一信息是单一运费。\n\n\n\
  \n\n虽然在 URL 中尝试不同的运输信息（例如不同的起始地和目的地的邮编）会很有趣，但 USPS 测试服务器仅支持你在这里看到的测试数据。你必须获得 USPS\
  \ 的验证并迁移到其生产服务器，才能进行更彻底的测试。你将在本章稍后的“为 Shipper 进行极端的 Ajax 改造”章节了解到如何获取验证。\n\n###\
  \ 测试 Shipper\n\n在尝试测试 Shipper 应用程序之前，请确保你已在 [`www.usps.com/webtools/`](http://www.usps.com/webtools/)\
  \ 注册了你自己的 USPS Web Tools 用户 ID。然后，你需要按照上一节所解释的那样，将此用户 ID 插入到 `shipper.html` 网页的\
  \ HTML 代码中。请记住，除非你注册并将自己的用户 ID 插入应用程序的 HTML 代码中，否则 Shipper 将无法工作。\n\n完成这些准备工作后，请查看图\
  \ 11.6，该图显示了 Shipper 应用程序已打开并准备好进行严谨的运费计算。\n\n#### 图 11.6. Shipper 应用程序启动时，除了默认的国家字段外，整个用户界面都是空白的，该字段无法从\
  \ USA 修改。\n\n[[查看完整图片]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3axczzhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdfzmghqnnauawlnms8-.jpg)\n\
  \n用户界面初始是空白的，因此你可以像在完成在线购买结算一样随意输入信息。或者为了节省时间，你可以直接跳转到页面上的邮编字段。首先尝试输入一个在现实世界中（目前）不存在的邮编，例如\
  \ 20080。图 11.7 显示了应用程序如何显示错误/帮助消息，表明该邮编的运费信息不存在。\n\n#### 图 11.7. 输入无效的邮编会导致邮编字段旁边出现错误/帮助消息。\n\
  \n[[查看完整图片]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3axczdhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdfzmghqn3auawlnms8-.jpg)\n\
  \n实际上，除了 20008（华盛顿特区）之外，你输入的任何邮编在测试目的下都被视为无效，因此你可以输入几乎任何内容并获取错误消息。要查看成功的运费计算，请输入\
  \ 20008 作为邮编并离开邮编字段。图 11.8 显示了动态获取的运费和新计算的订单总额。\n\n#### 图 11.8. 输入有效的邮编会导致运费的成功\
  \ Ajax 请求，这也导致了订单总额的计算。\n\n[[查看完整图片]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3axczhhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdfzmghqohauawlnms8-.jpg)\n\
  \n除非你非常专注，否则你可能会错过了请求进行期间出现在运费位置的“加载”图像。尝试选择不同的运输方式并密切观察运费。图 11.9 显示了“加载”图像的运行。\n\
  \n#### 图 11.9. 在执行 Ajax 请求时，运费位置会出现一个较小的“加载”图像。\n\n[[查看完整图片]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3axczlhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdfzmghqoxauawlnms8-.jpg)\n\
  \n此图显示了“加载”图像如何提供微妙但有效的指示，表明后台正在进行与运费相关的操作。当获得新费率时，图像消失并显示新费率（参见图 11.10）。\n\n####\
  \ 图 11.10. 更改运输方式也会导致请求，从而产生新的运费和订单总额。\n\n[[查看完整图片]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3axczbhadfsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdfzmwhqmhauawlnms8-.jpg)\n\
  \n虽然我想建议你尝试各种不同的邮编以看看应用程序对向全国范围内送物品的响应，但在 USPS 测试服务器上这并不可行。你需要采取额外的步骤来启用应用程序，使其能够访问全范围的运费。下一节将告诉你要做什么。\n\
  \n### 为 Shipper 进行极端的 Ajax 改造\n\n由于 Shipper 应用程序根据美国邮政服务的运输方式设定其运输选项，因此它高度依赖美国邮政服务国内费率计算\
  \ Web 服务，该服务是 USPS Web Tools（[`www.usps.com/webtools/`](http://www.usps.com/webtools/)）的一部分。与书中使用的许多其他第三方\
  \ Web 服务不同，USPS Web Tools 受到严格控制，只有通过与 USPS 精密协调你的开发工作才能使用。\n\n更具体地说，你必须通过验证过程才能超越\
  \ USPS 测试服务器上的有限测试数据，并在 USPS 生产服务器上尝试你的应用程序。此验证由 USPS 互联网客户服务中心 (ICCC) 执行，联系方式为\
  \ icustomercare@usps.com 或拨打 800-344-7779（东部时间上午 7 点至晚上 11 点）。你必须已经是注册 Web Tools\
  \ 用户（拥有 ID），并在联系 ICCC 访问生产服务器之前使用国内费率工具测试应用程序。因此，Shipper 改造的第一部分就是获取访问生产服务器的权限，以便测试全范围的邮编。\n\
  \n**注意**\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvgmucg9zagpw24-.jpg)\
  \ | 你必须联系 ICCC 才能以实际用途使用 Shipper 应用程序，因为它在 USPS 测试服务器运行时仅限于使用指定的测试数据。 |\n\n当你通过\
  \ ICCC 验证并获得国内费率工具生产服务器的 URL 后，确保通过更改 `shipper.php` 文件开头的以下代码行来使 Shipper 应用程序使用生产服务器：\n\
  \n```php\n$uspsRequest =\n  \"http://testing.shippingapis.com/ShippingAPITest.dll?\n\
  \  API=RateV2&\";\n```\n\n代码中 URL 的第一部分 [`testing.shippingapis.com/ShippingAPITest.dll`](http://testing.shippingapis.com/ShippingAPITest.dll)\
  \ 是 USPS 测试服务器的 URL，也是你需要更改为生产 URL 的部分。这是将 Shipper 应用程序移动到生产服务器所需的唯一更改，从而允许你尝试任何邮编来计算运费。\n\
  \n\n\n接着，你需要确保为邮政编码输入字段有一个 `input` 文本元素，并为邮政编码错误消息准备一个 `span` 元素。如果你已经有一个邮政编码 `input`\
  \ 元素，请确保添加一个与 Shipper 应用程序中类似的 `onchange` 事件处理器。以下是 Shipper Web 页面中的相关代码：\n\n```\n\
  <td class=\"value\"><input type=\"text\" id=\"zipCode\" size=\"10\"\n  onchange=\"\
  getShipRate()\" /></td>\n<td class=\"label\" width=\"50%\"><span id=\"zipCodeErr\"\
  \n  style=\"font-size:80%; color:#BB0000;\"></span></td>\n```\n\n注意，邮政编码输入元素调用了\
  \ `getShipRate()` 函数来从 USPS 服务器动态获取运费。你之前已经见过这个函数了，所以我在这里不再重复它。不过，你需要将它的代码复制并粘贴到页面的头部，连同响应处理函数\
  \ `handleRequest()`。\n\n你可能已经有一个用于选择运输方式的 `select` 元素，但如果没有的话，你就需要将其添加到页面中。以下是 Shipper\
  \ 应用程序中用于提供 USPS 运输方式选择的选择列表：\n\n```\n<select id=\"mailService\" onchange=\"getShipRate()\"\
  >\n  <option value=\"Parcel Post\">Parcel Post</option>\n  <option value=\"Priority\
  \ Mail\" selected=\"selected\">\n    Priority Mail</option>\n  <option value=\"\
  Express Mail to PO Addressee\">\n    Express Mail</option>\n</select>\n```\n\n极其重要的一点是，必须注意每个选项的数值设置必须与\
  \ USPS Web Tools 的国内费率（Domestic Rates）文档中指定的运输方法完全匹配。这很重要是因为 Shipper 应用程序将此值作为速率请求的基础，这意味着它必须精确匹配运输方法才能进行查询。换句话说，`value=\"\
  US Priority Mail\"` 是不起的，因为运输方式是 `Priority Mail`，而不是 `US Priority Mail`。\n\n####\
  \ Note\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 支持除 Shipper 应用程序中显示的三个方法之外的其他 USPS 运输方法。要了解所有可用的运输方式，请查看 [`www.usps.com/webtools/technical.htm`](http://www.usps.com/webtools/technical.htm)。如果你想支持如\
  \ FedEx 或 UPS 等不同的快递供应商，你需要深入研究其文档并进行一些工作以支持其请求/响应格式。 |\n\n最后，Shipper 应用程序中有几个“购物车”变量，你需要提供这些变量或将其连接到你现有的购物车字段：\n\
  \n```\nvar origZip = \"10022\"; // 起始邮政编码\nvar itemDesc = \"Popcorn Holiday Feast\"\
  ;\nvar itemPrice = 29.99;\nvar weightLb = \"10\";\nvar weightOz = \"5\";\nvar container\
  \ = \"Flat Rate Box\";\nvar size = \"Large\";\n```\n\n请记住，这些变量大部分将以某种方式与购物车中已输入或选择的真实数据绑定。我在\
  \ Shipper 应用程序中选择将它们设置为静态的，仅仅是为了保持简单；我的目标是展示如何使用 Ajax 计算运费，而不是如何构建整个购物车。\n\n如果你遵循这些通用的设计指南，你应该应该能够轻松地将\
  \ Ajax 动态运费查询集成到你自己的网站中。\n\n### Summary\n\n本章探讨了运费的动态查询，这显然属于需要 Ajax 解决方案的问题领域。为了查找在线购买的运费，在购物车中从一个页面跳转到另一个页面，这本不应该是必要的。不仅如此，为了确定费用，你真正需要提供的只有你的邮政编码。本章中的\
  \ Shipper 应用程序演示了巧妙利用 Ajax 如何对购物车或任何需要实时计算运费并展示给用户的应用程序产生细微但实质性的改进。\n\n## 第 12 章：为你的网站添加一个由\
  \ Ajax 驱动的评分系统\n\n#### 动画中的再次 Ajax\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | MGM 的 Ajax Corporation 并不是 Ajax 在动画中出现的唯一时刻。《Duckman》是 20 世纪 90 年代中期 USA Network\
  \ 上的一部经常剧，剧中有一个名为 Ajax Duckman 的角色，他是剧主角 Eric Duckman 的儿子。Ajax Duckman 由音乐家 Dweezil\
  \ Zappa 配音，在剧中是一个有点无忧无日的青少年。 |\n\n许多流行网站中一个日益受欢迎的组件是对事物的评分功能。Amazon 可能通过提供产品评分和撰写个人评论的功能开启了这一趋势。从那时起，各种网站都提供了某种形式的评分系统，无论是对电影、音乐、照片、博客文章或其他任何内容的评分。只要可以发布到网上，就可以被评分。我心想，我们大多数人内心深处都是评论家，因此能够对任何任何物进行评分的想法在某种程度上触及了我们分享批评（以及在很多情况下是赞美）的需求。诚然，将世界上的一切都简化为五星级评分可能并不公平，但它可以让你快速了解人们是如何感知某件事的。\n\
  \n毫无疑问，在利用 Ajax 为网页上的任何内容添加五星级评分方面，本章是书中野心勃勃的一章。雄心勃勃，是指考虑到 Rater 示例应用程序在 Ajax 的使用上要先进得多，因为它必须能够向服务器上的文件或数据库读写多个评分，同时防止同一用户的重复投票。好消息是，这种复杂性的绝大部分都隐藏在\
  \ Ajax Toolkit 内部，这意味着你的工作主要归结为正确使用 Toolkit，而不是构建你自己的评分代码。\n\n本章中的 Rater 应用程序使用了以下文件，它们位于带有书籍的实时\
  \ Linux 光盘的 `chap12` 示例代码文件夹中：\n\n* `rater.html`—Rater 主 Web 页面\n* `cookiereset.html`—用于模拟唯一用户的\
  \ Cookie 重置 页面\n* `ajaxkit.js`—Ajax Toolkit 的核心 Ajax 函数\n* `domkit.js`—Ajax Toolkit\
  \ 的 DOM 相关函数\n* `ratingkit.js`—Ajax Toolkit 的评分相关函数\n* `ratingkit.php`—用于保存和加载评分的服务器脚本\n\
  * `ratingkit.css`—五星级评分的样式表\n* `star.gif`—用于表示五星评分的星星图像\n* `star_sm.gif`—用于表示较小五星评分的小型星星图像\n\
  \n### 挑战：为网站添加评分\n\n确定物品重要性的一种方便方法是考虑如果你被困在荒岛上，只能带上规定数量的物品，该物品是否能入选。例如，如果你只能带一张音乐\
  \ CD 在可能没有陪伴的多年里听（但希望有足够的电池为你的 CD 播放器供电！），你会选择哪张 CD？\n\n希望你永远不需要真的去做出荒岛 CD 选择。除此之外，你可能会发现在\
  \ [Amazon.com](http://Amazon.com) 上对你喜欢的 CD 评分很有用的，这样其他人就可以做出更有理性的音乐购买决策。[Amazon.com](http://Amazon.com)\
  \ 允许你使用五星评分系统对音乐 CD 以及其销售的所有其他商品进行评分。如果你现在就在电脑旁，花点时间访问 [Amazon.com](http://Amazon.com)\
  \ 查看一张音乐 CD。这将让你了解在线评分系统是如何工作的。\n\n\n\n\n如果你查看艺术家名称和 CD 标题下方的五角星，你会注意到星星旁边有一个发行评分的客户人数计数。这非常重要，因为它让你了解评分可能有多准确准确——如果只有少数个人对该项目进行评分，那么这个评分可能没有太大意义。\n\
  \n提到这个评分示例的真正目的是，为了指出 [Amazon.com](http://Amazon.com) 的评分方法在选择评分时涉及了一个相当平庸的用户界面。我指的是用于选择评分的备选列表，它允许你选择星级评分的文本描述，例如“五星”或“四星”。除了\
  \ [Amazon.com](http://Amazon.com) 还支持在评分时提供文本评论外，你还必须在评分生效之前预览并接受你的评分。如果可以直接点击主项目页面上的五星评分来直接在页上对项目进行评分，那将会直要直观且高效得多。诚然，这不能解决编写评论的需求，但并不是每个人都对写评论感兴趣——有时候，你只需要快速的“击完就走”式评分就足够了。\n\
  \n本章的挑战是使用 Ajax 将交互式五角星评分组件集成到 Web 页面中，使用户无需离开页面即可对项目进行投票。这与你已经学习关于 Ajax 的大部分内容是一致的，即当你只是在微调少量数据时，尽量减少页面重新加载。在这种情况下，你想要做的只是向服务器提交单条评分数据，然后在投票处理后查看总评分计数。这绝对在\
  \ Ajax 可以处理的范范围内。\n\n这个挑战中你可能已经好奇的一个棘手部分是评分投票的持久化存储。如果你回想到目前为止的所有示例 Ajax 应用程序，这是第一个必须记住用户提交内容的程序。具体来说，`Rater`\
  \ 应用程序必须以某种方式在每个投票发出后在服务器上存储每个项目的每次投票。幸运的是，我为你提供了一个预构建的评分组件，它可以处理在服务器 XML 文档中存储评分数据的所有细节。如果你有此意，我还提供了一些关于可能使用数据库代替\
  \ XML 文件的想法。\n\n我所说的的这个评分组件包含在随书附带的 CD-ROM 的 Ajax 工具包中。该组件涉及客户端和服务器端代码，以及几张图像和一个样式表。在后台，一个由\
  \ Ajax 驱动的五角星评分系统比你想象的要复杂一点，这就是为什么需要这么多文件才能实现魔法。\n\n在评分组件的客户端 JavaScript 代码（包含在\
  \ `ratingkit.js` 中）中，使用了两个函数来控制评分系统：\n\n*   `initRatings()`——初始化页面上所有项目的评分\n*  \
  \ `setRating()`——为单个项目发出投票\n\n在 PHP 服务器脚本（`ratingkit.php`）的帮助下，这些函数使得为页面上任意数量的单个项目分配评分成为可能。不仅如此，评分组件足够智能，可以将特定计算机上的投票次数限制为每个用户一次。它是通过巧妙地使用\
  \ cookie 实现这一点的，cookie 为记住用户是否执行过某些操作（如对特定项目进行评分）提供了一种完美的机制。\n\n希望我已经说服了你，通过交给你一个预构建的组件，我已经完成了大部分评分工作。那么对于\
  \ `Rater` 应用程序挑战还留下了什么呢？`Rater` 应用程序的挑战是为可评分项目正确设置 HTML 代码，使其能够连接到评分组件并正确地发出投票。此外，几个\
  \ CSS 评分类是评分组件的一部分，必须仔细地分配给 `Rater` 页面上的元素，评分才能正常工作。\n\n为了保持 `Rater` 应用程序的 HTML\
  \ 代码尽可能简单且不涉及大量额外图像或其他资源，被评分的项目是著名的名言。`Rater` Web 页面由五个著名名言组成，因此有五种不同的评分——每个引言一个。`Rater`\
  \ Web 页面需要为每个引言包含一个唯一的评分组件并正确识别它，以便对该引言的投票存储在服务器上以供日后检索。最后，`Rater` 应用程序将允许整个网络上的无数人对他们喜欢的引言进行投票，所有的投票都在服务器上进行统计，总票数显示在页面上。\n\
  \n在开发 `Rater` 应用程序后，你将获得复用评分组件来为任何类型的 Web 内容评分的能力。\n\n## 第 12 章 为你的网站添加 Ajax 驱动的评分系统\n\
  \n### 动画中的再次 Ajax\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
