  \ 代码的能力。\n\n**注意**\n\n我们并不要求你掌握 `JavaScript` 编程以便在自己的 Web 页面中复用书中的示例。然而，如果不深入研究\
  \ `JavaScript` 代码，就不可能深入探索 Ajax，因此如果你计划将任何示例代码提升到另一个水平，对 `JavaScript` 有概略了解是非常重要的。\n\
  \n#### XML 和 Ajax 数据\n\n\n\n\n\n好的，现在你已经知道 Ajax 页面仍然由 HTML 和 CSS 组成，并且可以使用巧妙的 JavaScript\
  \ 代码通过管理 Ajax 请求和响应来进行动态调整。我还没有解释在 Ajax 请求/响应序列中，客户端和服务器之间传输的数据的性质。部分原因之一是 Ajax\
  \ 事务中的数据格式并不是一成不变的。你可以自由使用多种数据格式来适应每个应用的特定需求。换句话说，你可以为每个 Ajax 应用量身定制数据表示形式。\n\n\
  使用 Ajax 最具说服力的理由之一是利用 XML 数据标准，它提供了一种高度结构化的信息组织方式。XML 特别擅长表示难以呈现的复杂数据，例如具有多层嵌套数据的层级数据库。Ajax\
  \ 在请求/响应等式的双方都完全支持 XML，这意味着你可以以 XML 格式发送和/接收数据。\n\n虽然 XML 是一件很好的工具，但它并不是解决所有 Ajax\
  \ 问题的万灵药。事实上，使用原始文本数据作为 Ajax 数据交换的格式是完全可以的，在很多情况下甚至是理想的。例如，像你在 URL 中经常看到的那，通过简单的键/值对将数据传递给服务器是非常简洁的，如下：\n\
  \n```\nfname=Michael&lname=Morrison\n```\n\n将其与以 XML 结构的相同信息进行对比：\n\n```\n<fname>Michael</fname>\n\
  <lname>Morrison</lname>\n```\n\n在这种情况下，URL 键/值版本的数据要有效得多，因为数据非常简单。\n\n底线是，在 Ajax\
  \ 应用中往返的数据格式完全取决于应用的特定需求。在整本书中，你会遇到使用多种不同数据类型的应用，包括原始文本、XML 和另一种被称为 JSON（`JavaScript\
  \ Object Notation`）的类型。\n\n### PHP 与服务器\n\nAjax 的一个经常被新手误解的方面是：它完全依赖于服务器程序接受请求并以某种方式做出响应。在通常与\
  \ Ajax 术语相关的、熟悉的“异步 JavaScript + XML”配方中，服务器程序是那个隐藏的成分。在实践层面，这意味着你不能仅仅通过一些 JavaScript\
  \ 代码组装一个 Web 页面就写出一个 Ajax 应用——必须有一个服务器端组件来响应客户端的请求。\n\n服务器程序在 Ajax 应用中的作用完全取决于每个具体的\
  \ Ajax 应用，但通常情况下，你会发现大多数 Ajax 服务器程序负责查找某些信息并返回给客户端。例如，一个 Ajax 员工目录应用程序可能会向服务器传递员工\
  \ ID，在这种情况下，服务器程序在数据库中查找该 ID 并返回员工的姓名和联系信息。或者，正如你在上一章中思考的示例那样，待发货的信息可能会被传递给服务器，随后服务器查找运费并返回。\n\
  \n与 Ajax 应用的客户端（那里是 JavaScript 的专属领域）不同，服务器端在使用什么编程语言创建服务器程序方面是完全开放的。幸运的是，有一些被广泛支持且相对容易修改和使用的流行选项。其中之一就是\
  \ `PHP`，它是一种非常流行的服务器脚本语言，在创建 Ajax 应用时非常方便。与运行在浏览器上的 JavaScript 代码类似，`PHP` 代码运行在服务器上。再次参考图\
  \ 2.1，你可以看到服务器上的 `PHP` 程序如何接收来自浏览器的 Ajax 请求（感谢 JavaScript），并在处理请求后响应。\n\n`PHP` 代码以及所有服务器端脚本的有趣之处在于，它们最终都会将数据传回给客户端。在使用\
  \ `PHP` 时，你必须始终记住无论你在做什么，最终都会导致数据传回浏览器。在 Ajax 应用中，一个 `PHP` 脚本会将数据传回一个 Ajax 请求。\n\
  \n### Ajax 请求生命周期\n\n每个 Ajax 请求都会经历一个可预测的生命周期，这在你开始研究 Ajax 应用内部原理之前至关重要。Ajax 生命周期中的中的每个里程碑都对应于\
  \ `XMLHttpRequest` 对象的不同状态，该对象是作为 Ajax 核心的 JavaScript 对象。你即将学习 Ajax 工具包会让你避开 `XMLHttpRequest`\
  \ 对象的大部分内部机制，但熟悉其工作方式的某些方面仍然值得。关于该对象的完整解析，请查看附录 B，“XMLHttpRequest 快速参考”。\n\n以下是\
  \ Ajax 请求从创建到提交到成功响应循环的五个状态：\n\n1. `UNINITIALIZED`——请求未初始化。\n2. `LOADING`——请求已初始化。\n\
  3. `LOADED`——请求已发送，正在等待服务器确认。\n4. `INTERACTIVE`——正在从服务器下载响应数据。\n5. `COMPLETE`——请求/响应周期完成。\n\
  \n生命周期中每个状态的大写名称直接对应 `XMLHttpRequest` 对象的内部状态。关于这个生命周期的好消息是，你通常只需要关心最后一个状态 `COMPLETE`，这是合理的，因为在请求完成且结果数据可用之前，你不需要采取任何操作。然而，从诊断的角度来看，窥视事务并确保它按预期通过生命周期通常是有帮助的。由于这个原因，书中附带的光盘提供的\
  \ Ajax 工具包包含一个诊断功能，可以视觉化地显示 Ajax 请求发生时的每个状态。\n\n### 注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 考虑到 Booker 示例程序的性质，你可能会认为这是一个同步应用的绝佳机会，因为除了等待书籍加载外没什么可做的。但如果你在书籍下载时改变了主意呢？如果用户界面在加载期间没有锁定你无法选择其他选项，将会好得多。通过使用\
  \ Ajax，你可以在某一本书加载时完全自由地选择另一本书。在这种情况下，当前的 Ajax 请求被取消，第二本书将立即开始加载。 |\n\n图 2.2 显示了一个名为\
  \ Booker 的 Ajax 示例应用程序在执行请求过程中的状态。Booker 示例应用程序是一个简单的电子书阅读器。\n\n##### 图 2.2. 页面顶部的诊断条显示了书籍阅读器示例中\
  \ Ajax 请求的状态。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddjsmdjj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnmnawyzi-.jpg)\n\
  \n\n\n\n\n在本示例中，H.G. 威尔斯所著《世界大战》的整本书文本正通过 Ajax 请求进行加载和显示。由于该书的大小有几百 KB，因此请求完成需要一些时间，这当然取决于连接速度。图\
  \ 2.2 显示了应用程序正处于 `INTERACTIVE`（“正在下载响应...”）状态，这意味着服务器响应（书籍文本）正在下载中。请注意，原本显示书籍文本的区域包含“加载...”消息，这表明目前还没有显示内容是有原因的。几秒钟后请求状态变为\
  \ `COMPLETE`（“请求完成！”），书籍文本便出现在页面的主体部分（参见图 2.3）。\n\n### 图 2.3. 请求完成后，电子书的全文显示出来。\n\
  \n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddjsmdnj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnmnawyzm-.jpg)\n\
  \n#### 注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 本示例中使用的所有书籍都是公共领域书籍，由免费电子书的生产者 Project Gutenberg 以电子形式提供。欲了解更多信息，请访问 Project\
  \ Gutenberg 官网：[`www.gutenberg.org/`](http://www.gutenberg.org/)。 |\n\n你可能注意到页面顶部\
  \ Ajax 诊断条正下方有一个电子书选择列表。这不仅让你能够访问不同的书籍，还是观察不同长度的 Ajax 请求发生的良好方法。要测试我所说的内容，请打开附带的实时\
  \ Linux 光盘中 `chap02` 文件夹下的 `booker.html` 页面。查看器中初始加载的第一本书是刘易斯·卡罗尔的《爱丽丝仙仙游记》。点击选择列表并选择《战争与和平》。《战争与和平》被认为是文学史上最厚重的小说之一，列夫·托尔斯泰编写的原始文本重量约为\
  \ 3MB。即使直接从 CD-ROM 执行 Ajax 请求的速度相对快，你仍会注意到 Ajax 诊断条中的状态变化。\n\n#### 注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 随着你阅读书籍，你可以根据自己是否需要监控请求状态，在每个应用程序中开启或关闭 Ajax 诊断条。 |\n\n### 了解 Ajax 工具包\n\n现在我已经多次提到了随书附的光盘提供的\
  \ Ajax 工具包——现在是时候确切了解它是什么以及它是如何工作的了。如果你进行大量的自行 Ajax 开发，最终会发现，市面上真的有几十个甚至上百个 Ajax\
  \ 库，旨在让使用 Ajax 变得更容易、更高效。其中许多库都实现了它们的目标。问题是，其中许多库的学习曲线与 Ajax 本身相当，除非你正在构建一个带有各种华丽功能的巨型\
  \ Ajax 应用，否则并不是件好事。而在那种情况下，你最终可能还是想构建自己的 Ajax 库。\n\n为了尽可能保持简单直接，我选择为本书构建了一个用于本书的自定义\
  \ Ajax 库，它应该作为你将 Ajax 功能整合到 Web 页面的起点。在许多情况下，你可以直接复用我的代码来获得即时结果。除此之外，你可能想要温习 JavaScript\
  \ 和 XML，将我的代码推向另一个水平。无论何种，我的 Ajax 工具包都是 Ajax Web 开发的一个便捷启动器，学习曲线非常低。\n\n我这个实用的 Ajax\
  \ 工具包由几个 JavaScript 文件组成，每个文件都包含 JavaScript 函数和相关的辅助代码：\n\n* `ajaxkit.js`—核心 Ajax\n\
  * `domkit.js`—DOM（文档对象模型）\n* `modalimgkit.js`—模态图像\n* `validatekit.js`—数据验证\n* `infowinkit.js`—信息窗口\n\
  * `ratingkit.js`—五星级评分\n\n我所说的“辅助代码”是指，这些文件提供了预构建的代码，旨在让某些任务变得极其简单。你开发的每个支持 Ajax\
  \ 的 Web 页面并不都包含这些文件——你根据需要使用它们。例如，以下是用于将两个文件导入页面的代码，必须放在页面的 `<head>` 中：\n\n```\n\
  <script type=\"text/javascript\" src=\"ajaxkit.js\"> </script>\n<script type=\"\
  text/javascript\" src=\"domkit.js\"> </script>\n```\n\n一旦这些代码行添加到你的页面中，就可以就可以使用\
  \ Ajax 工具包内文件提供的任何功能。\n\n接下来的几节将更详细地探讨 Ajax 工具包的不同部分。虽然我会快速解释每个工具包文件中的所有不同 JavaScript\
  \ 函数，但你并不需要将它们背记心心中，甚至不需要完全理解它们的作用。目前的目标仅仅是让你大致了解工具包的每个部分提供了什么——书的其余部分将在每个拼图碎片派用场时，更详细地回顾该工具包。\n\
  \n### `ajaxkit.js` 文件\n\n工具包的 `ajaxkit.js` 部分仅由两个 JavaScript 函数组成，分别处理提交 Ajax 请求和更新\
  \ Ajax 诊断条：\n\n```\najaxSendRequest(type, url, handler, postDataType, postData)\n\
  ajaxUpdateState()\n```\n\n如果你不熟悉 JavaScript 函数，只需知道它们是执行特定任务的可重用代码块即可。在这种情况下，`ajaxSendRequest()`\
  \ 函数根据其五个参数提供的信息向服务器发送 Ajax 请求。再次，现在并不需要理解什么是函数参数——当你看到实际示例应用中如何使用 `ajaxSendRequest()`\
  \ 函数时，就会了解它们。现在只需知道这五个参数对应于 Ajax 请求类型（`GET` 或 `POST`）、处理请求的服务器程序地址、你提供的处理服务器响应的自定义函数，以及如果请求是\
  \ `POST` 则可选的数据类型和数据。\n\n#### 注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | Ajax 请求类型（`GET` 或 `POST`）直接源于 Ajax 请求本质上就是一个 HTTP 请求。如果你处理过 HTML 中的表单，应该对 `GET`\
  \ 和 `POST` 请求有些熟悉。通常情况下，想法是：如果你只是从服务器获取信息，就使用 `GET` 请求，而 `POST` 更多用于将信息传递给服务器。 |\n\
  \n为了说明 `ajaxSendRequest()` 函数的使用并不十分困难，这里是 Booker 电子书查看器示例中使用的精确 Ajax 请求：\n\n```\n\
  ajaxSendRequest(\"GET\", \"book_\" + title + \".txt\", handleRequest);\n```\n\n\
  即使不深入研究 JavaScript，也很容易看出第一个参数表示这是一个 `GET` 请求，第二个参数是在为书籍组装一个文件名（例如 `book_alicewonderland.txt`），而最后一个参数是自定义处理函数的名称。你将在本章稍后会回到这段代码。\n\
  \n`ajaxUpdateState()` 函数用于更新你在图 2.2 和图 2.3 中看到的 Ajax 诊断条。你最终会在创建的响应请求的自定义处理中调用此函数，如下所示：\n\
  \n```\najaxUpdateState();\n```\n\n\n\n\n调用 JavaScript 函数意味着你告诉该函数去执行它设计时要完成的任务。处理函数（handler\
  \ function）简单就是响应某些事件而被调用的函数。例如，每当发生鼠标点击时，鼠标事件处理函数就会被调用。同样，每个 Ajax 应用都有一个自定义的请求处理函数，每当请求状态发生变化时它就会被调用。这就是为什么在本章较早之前学习请求状态对你非常重要。在“拆解电子书阅读器”章节中，你将再次回顾请求状态，并发现它们究竟是如何融入\
  \ Ajax 工具箱方程式之中的。\n\n### `domkit.js` 文件\n\n回到 Ajax 工具箱的组件和部分，`domkit.js` 文件包含了几个执行不同\
  \ DOM 任务的函数。例如， `replaceText()` 函数负责更改页面上元素的文本：\n\n```\nreplaceText(elem, text)\n\
  ```\n\n如果你以前做过任何 JavaScript 编程，你可能对大多数 HTML 元素的 `innerHTML` 属性熟悉，它用于更改页面上元素的值。在现代\
  \ Web 标准中，该属性的使用被认为是过时的（passé），现在我们鼓励你在大多数情况下使用较新的 DOM 特性来执行元素内容的更改。然而，这种较新的方法并没有设置单个属性那么简单。为了避免让你重复编写一行行不必要的代码，我选择创建一个名为\
  \ `replaceText()` 的函数来为你完成内容替换。你只需将元素和新内容传递给它，`replaceText()` 函数就会完成其余工作。例如，下面这行代码将存储在\
  \ `firstName` 中的元素内容更改为 `\"Michael\"`：\n\n```\nreplaceText(firstName, \"Michael\"\
  );\n```\n\n将在书后的示例中经常看到这个函数。只要你将 `domkit.js` 文件导入到页面中，你也可以自由使用该函数。别担心，当示例出现时，你会确切看到如何导入该文件以及使用\
  \ `replaceText()` 函数的，因此在现阶段完全理解它并不是关键的。\n\n与 `replaceText()` 类似的是 `getText()` 函数，它使用\
  \ DOM 提取 HTML 元素的内容：\n\n```\ngetText(elem);\n```\n\n你向此函数提供一个 HTML 元素，它会返回该元素的内容。\n\
  \n`domkit.js` 文件还包含了四个用于确定浏览器窗口客户区域（client area）大小的函数，这在页面上仔细放置元素时非常有用：\n\n```\n\
  getClientWidth()\ngetClientHeight()\ngetClientLeft()\ngetClientTop()\n```\n\n这些函数返回浏览器客户区域的宽度、高度、左位置和顶位置，客户区域是页面实际所在的区域。换句话说，它不包括围绕页面的各种工具栏、状态栏和其他控件。\n\
  \n`domkit.js` 文件的最后一个函数用于获取与浏览器已存储的 cookie 关联的数据：\n\n```\ngetCookieData(cookieName)\n\
  ```\n\n此函数接受所述的 cookie 名称，然后向你返回 cookie 值。Cookie 是记住用户在页面上执行过的某些事的方便方式，它们将在本书的第\
  \ 12 章“为你的网站添加 Ajax 驱动的评分系统”中，当你构建五星评分应用时派上用场。\n\n### `modalimgkit.js` 文件\n\n工具箱的\
  \ `modalimgkit.js` 部分由单个 JavaScript 函数组成，该函数为 Web 页面添加模态图像支持：\n\n```\ninitModal()\n\
  ```\n\n你将在第 8 章“杀级的图片查看界面”中学习更多关于模态图像的知识，但其基本思想允许你从缩略图查看全尺寸图像，而无需在浏览器中加载新页面。类似于可能出现在应用程序窗口上的“关于”对话框，模态图像会弹出并出现在当前\
  \ Web 页面之上。\n\n### `validatekit.js` 文件\n\n工具箱的 `validatekit.js` 部分提供了几个实用的函数用于验证不同类型的用户输入：\n\
  \n```\nvalidateNonEmpty(inputControl, helpControl)\nvalidateInteger(inputControl,\
  \ helpControl)\nvalidateNumber(inputControl, helpControl)\nvalidateZipCode(inputControl,\
  \ helpControl)\nvalidatePhone(inputControl, helpControl)\nvalidateEmail(inputControl,\
  \ helpControl)\nvalidateDate(inputControl, helpControl)\n```\n\n这些函数都旨在验证特定的数据类型，并涵盖了你在表单中会遇到的最常见数据类型。这些函数的两个参数是待验证的输入控件，以及在检测到验证问题时显示帮助消息的输出元素。\n\
  \n### `infowinkit.js` 文件\n\n工具箱的 `infowinkit.js` 部分包含了用于向页面添加 Ajax 驱动的信息弹出窗口的函数：\n\
  \n```\ninitInfoWindow(width, height)\nshowInfoWindow(infoURL, evt)\n```\n\n第一个函数最初被调用以设置信息窗口的宽高，而第二个函数则实际显示带有来自指定\
  \ URL 内容的信息窗口。\n\n### `ratingkit.js` 文件\n\n工具箱的 `ratingkit.js` 部分实现了一个可以添加到任何站五星评分系统，包括为多个项目添加评分支持：\n\
  \n```\ninitRatings()\nsetRating(id, rating)\n```\n\n第一个函数用于初始化评分系统，第二个函数用于设置特定项目的评分。评分系统中的每个项目都被分配了一个唯一的\
  \ ID，该 ID 是传递给 `setRating()` 函数的第一个参数。第二个信息是评分本身，其范围在 `1` 到 `5` 之间。\n\n### 拆解电子书阅读器\n\
  \n是时候停止在 Ajax 理论的假设世界里嬉戏，进入一些真实的东西了。本章的剩余部分将探索你在图 2.2 和 2.3 中看到的 Booker 电子书阅读器的内部工作机制，并准确解释它是如何工作的。你可以将这一节看作后续每个章节的微型版本——对一个真实的\
  \ Ajax 应用进行剖析，该应用可以根据你自己的需要随时复用。虽然我无法保证你在没有 JavaScript 经验的情况下理解每一行代码，但我完全可以指引你相关的位置，你可以在那里进行有根据的更改，以定制适合你自己的代码。换句话说，我不一定教你如何成为机械师，但我会告诉你在哪里转动扳手。\n\
  \n\n\n当然，客户端仍然需要一些自定义编程，以响应用户从选择列表中选择一本电子书的操作。这些自定义代码必须异步从服务器加载电子书，并将其显示在页面上。在许多方面，这是所有\
  \ Ajax 请求中最基础的一种，因为你不需要向服务器传递任何信息——你只需要在发起 Ajax 请求时指定电子书文本文件名即可。关于这一细节，稍后会详细介绍；让我们先回顾一下电子书。\n\
  \n### 电子书\n\n在 Booker 示例中，电子书是以原始文本文件的形式提供的，具有熟悉的 `.txt` 文件扩展名。你可以像在 Linux 系统上使用\
  \ `Vi`、`Emacs` 或 `Pico`，在 Windows 系统上使用 `Notepad` 或在 Mac 上使用 `TextEdit` 一样，打开并编辑这些文本文件。示例应用程序包含了以下书籍及其相关的文本文件：\n\
  \n*   《爱丽丝仙游仙境》—`book_alicewonderland.txt`\n*   《弗兰肯斯坦》—`book_frankenstein.txt`\n\
  *   《莫比迪克》—`book_mobydick.txt`\n*   《战争与和平》—`book_warandpeace.txt`\n*   《世界大战记》—`book_warofworlds.txt`\n\
  \n你可能会注意到电子书文本文件命名中有一个非常明显的模式，即它们都遵循 `book_AbbrevTitle.txt` 的格式，其中 `AbbrevTitle`\
  \ 是书籍的缩写标题。通过遵循电子书文件名的标准格式，可以更容易地根据用户在页面选择列表上的选择，通过程序化地加载每本书。具体来说，你可以使用以下公式程序化地构建文件名：\n\
  \n```\n\"book_\" + AbbrevTitle + \".txt\"\n```\n\n正如你稍后看到的，这实际上就是处理响应选择变化以加载电子书的代码工作方式。\n\
  \n### Booker Web 页面\n\nBooker 示例应用程序中的所有繁重工作都在 `booker.html` Web 页面中完成，它包含了 HTML\
  \ 和 JavaScript 代码，以及一些各处的 CSS 样式。不过，在深入研究代码之前，让我们再次查看图 2.4 中运行的应用程序，这次加载的是电子书《弗兰肯斯坦》。\n\
  \n### 图 2.4. 请求完成后，电子书的全文将会出现。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddjsmdrj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnmnawyzq-.jpg)\n\
  \n虽然 JavaScript 代码出现在实际 HTML 文档的开头，但先查看 body 的 HTML 代码更有意义：\n\n代码视图：\n\n```\n<body\
  \ style=\"background:#EEEEEE\"\n  onload=\"document.getElementById('book').selectedIndex\
  \ = 0;\n  loadBook(document.getElementById('book').options[\n  document.getElementById('book').selectedIndex].value)\"\
  >\n  <div id=\"ajaxState\" style=\"display:block\"></div>\n  <br />\n  <div style=\"\
  margin-left:10%\">Select book:\n    <select id=\"book\" onchange=\n      \"loadBook(this.options[this.selectedIndex].value)\"\
  >\n      <option value=\"alicewonderland\">Alice's Adventure's in\n        Wonderland\
  \ by Lewis Carroll</option>\n      <option value=\"frankenstein\">Frankenstein by\
  \ Mary\n        Shelley</option>\n      <option value=\"mobydick\">Moby Dick by\
  \ Herman\n        Melville</option>\n      <option value=\"warandpeace\">War and\
  \ Peace by Leo\n        Tolstoy</option>\n      <option value=\"warofworlds\">The\
  \ War of the Worlds by H.G.\n        Wells</option>\n    </select>\n  </div>\n \
  \ <br />\n  <div id=\"booktext\" style=\"margin-left:10%; margin-right:10%;\n  \
  \  padding:2%; background:#FFFFFF; border:thin solid #333333\">\n    </div></body\
  \ \n```\n\n代码的大部分由电子书选择列表组成，它出现在 `<select>` 标签内。注意，每本书的缩写标题被指定为每个电子书 `<option>`\
  \ 标签的 `value` 属性。这就是 JavaScript 代码从选择列表中的 `value`（`alicewonderland`）组装出书籍文本文件名（`book_alicewonderland.txt`）的方式。\n\
  \n页面向下移动一点，你会看到一个 ID 为 `booktext` 的 `div` 元素。这是通过 Ajax 请求加载后存放电子书文本内容的 `div` 元素。换句话说，这个\
  \ `div` 是页面的主要区域。应用于 `div` 的各种 CSS 样式使其在页面居中，让文本距离边缘留有一定的空间，并给它一个可见的边框。该 `div` 元素的\
  \ ID 用于页面的 JavaScript 代码，在通过 Ajax 请求加载后设置电子书文本。\n\n回过来看选择列表，也许页面中最重要的代码代码是选择列表的\
  \ `onchange` 事件处理器，它包含了以下行 JavaScript 代码：\n\n```\nloadBook(this.options[this.selectedIndex].value)\n\
  ```\n\n这段代码根据选择列表中的选择变化来加载电子书。该代码将当前选中电子书的值传递给自定义的 `loadBook()` 函数。以下是该函数的代码：\n\n\
  ```\nfunction loadBook(title) {\n  replaceText(document.getElementById(\"booktext\"\
  ), \"Loading...\");\n  ajaxSendRequest(\"GET\", \"book_\" + title + \".txt\", handleRequest);\n\
  }\n```\n\n啊，两个熟悉的函数！如果你还记得之前对 Ajax 工具包的讨论，`replaceText()` 和 `ajaxSendRequest()`\
  \ 函数都曾解释过。作为一个复习，`replaceText()` 函数用于设置任何 HTML 元素的内容。在这种情况下，它被用于将主 `div` 元素（`booktext`）设置为文本“Loading...”，以便用户知道电子书正在加载。实际的\
  \ Ajax 请求由 `ajaxSendRequest()` 函数启动，它使用 `GET` 请求方法。`ajaxSendRequest()` 函数的第二个参数是要加载的电子书文件名，格式为\
  \ `book_AbbrevTitle.txt`。最后最后一个参数是自定义的处理函数，它在 Ajax 请求完成（即电子书加载完成）时被调用。\n\n好了，如果最后那段让你觉得像是一次技术上的重击，我诚挚地道歉。我不完全期望你能像我抛给你的速度那样快地理解这段代码的每一个细微差别。当你看到更多的\
  \ Ajax 应用时，这一切都会开始变得非常自然和熟悉。好消息是，在此期间，你只需要理解代码中的几个关键点就可以为了你自己的目的进行定制。我们将在下一节介绍这些。\n\
  \n在这场对 Booker 应用程序的旋风式检查中，下一个大站是 `handleRequest()` 函数，它是当 Ajax 请求完成后调用的自定义函数。以下是它的代码：\n\
  \n```\nfunction handleRequest() {\n  if (request.readyState == 4 && request.status\
  \ == 200) {\n    replaceText(document.getElementById(\"booktext\"),\n      request.responseText);\n\
  \  }\n  ajaxUpdateState();\n}\n```\n希望这段代码比你预想的简单。函数内部的第一行代码检查请求是否成功完成。这涉及到查看 `request`\
  \ 对象的 `readyState` 和 `status` 属性的值。这是非常标准的 Ajax 代码，你会在每个 Ajax 应用中看到它的原样重复。被检查的具体值与标准的\
  \ `XMLHttpRequest` 对象直接相关，它在附录 B 中有详细介绍。你可以研究该附录以了解更多关于 Ajax 工具包底层如何运作的。不过，现在只需知道\
  \ `if` 语句只是在检查请求是否没有问题地完成即可。\n\n\n\n\n\n在 `if` 语句中，调用了 `replaceText()` 函数将页面上的主\
  \ `div` 元素（`booktext`）设置为刚刚加载的电子书文本。这段代码的关键在于请求对象的 `responseText` 属性，它包含了来自请求的响应数据。在处理\
  \ Ajax 请求的结果时，对于原始文本数据，你始终会使用 `responseText` 属性，而对于 XML 数据，则使用 `responseXML` 属性。\n\
  \n`handleRequest()` 函数中最后一行有意义的代码是调用 `ajaxUpdateStatus()` 函数，该函数用于更新 Ajax 诊断栏。确保此函数保持在\
  \ `if` 语句之外是非常重要的，这样每当 `XMLHttpRequest` 对象的状态发生变化时，它都会被调用。我还没有提到的一点是，该函数需要在上放置一个特殊的\
  \ `div` 元素。如果你回看 Booker 应用页面的 HTML 代码，你会看到一个如下所示的 `div` 元素：\n\n```html\n<div id=\"\
  ajaxState\" style=\"display:block\"></div>\n```\n\n`ajaxUpdateStatus()` 函数寻找 ID\
  \ 为 `ajaxState` 的 `div` 元素，然后相应地设置该 `div` 的背景颜色和内容。要隐藏 Ajax 诊断栏，只需将 `div` 元素的 style\
  \ 属性更改为 `display:none`。之后如果需要，可以通过将样式改回 `display:block` 来再次显示诊断栏。当你完成 Ajax 应用开发并准备完全消除诊断栏时，只需完全删除该\
  \ `div` 元素以及对 `ajaxUpdateStatus()` 的调用即可。\n\n我尚未解释的一项后续工作是 `body` 元素的 `onload` 事件处理程序，因为它非常重要，因为它建立了初始选择哪种电子书，并确保书籍能够被正确加载。以下是\
  \ `onload` 事件处理程序中的代码：\n\n```javascript\ndocument.getElementById('book').selectedIndex\
  \ = 0;\nloadBook(document.getElementById('book').options[\n  document.getElementById('book').selectedIndex].value);\n\
  ```\n\n第一行将选择列表中的项目设置为列表中的第一个项目（项目 `0`）。你使用 `0` 作为第一个项目，是因为选择列表的索引是从 `0` 开始并递增的。如果你想选择第二个项目，可以将\
  \ `selectedIndex` 属性设置为 `1`。\n\n第二行和第三行代码实际上是由于长度过长而分成两行的一行代码。因为需要两次使用 `getElementById()`\
  \ 函数来获取选择列表对象，代码看起来变得有些杂乱。如果将 `getElementById()` 函数调用替换为一个名称，代码会更容易理解。以下是由于该选择列表对象重命名为\
  \ `sel` 后的简化代码：\n\n```javascript\nsel.selectedIndex = 0;\nloadBook(sel.options[sel.selectedIndex].value);\n\
  ```\n\n现在，希望你可以看到 `loadBook()` 函数是如何接收当前选中电子书的值的。或者更具体地说，它接收的是当前选中电子书的缩写标题。如果你还记得在讨论的早些时候提到的，`loadBook()`\
  \ 函数使用这个缩写标题为电子书构建文件名，并将其作为 Ajax 请求的一部分传递出去。\n\n### 自定义电子书查看器\n\n我知道，很有可能最后几页的内容让你开始怀疑所有这些\
  \ Ajax 东西，以及它们是否真的值得费这些脑筋。我必须重申强调，这里的目标只是让你初步接触一下，而不是为你提供一个实战演习式的 Ajax 教程。记住，这本书的初衷是为你提供即插即用的\
  \ Ajax 应用和组件，你可以以最小的精力在自己的自己的 Web 页面中复用它们。事实证明，这种最小的精力有时需要一些细微的 JavaScript 调整，这就是为什么我想让你尽早看到一些代码。\n\
  \n谈到在自己的 Web 页面中复用代码，你是否有时间思考 Booker 应用对你自己的任何项目是否有用？可以这样考虑：尽管该应用目前的形式被用作一个原始的电子书查看器，但实际情况是它允许用户动态地选择和加载大型文本文档。因此，任何涉及选择笨重文本文档的应用都是类似\
  \ Ajax 解决方案的理想人选。也许是一个包含许多存档文档的归档网站，或者你的公司将建议、流程或合同以原始文本形式存储，通过这种 Ajax 接口可以更方便地访问。如果是这样，你可能想要考虑根据自己的需求定制\
  \ Booker 示例应用程序。\n\n以下是你可以通过较小精力修改应用程序的方法列表：\n\n*   添加更多内容———— 你可以通过将新的电子书文本文件复制到\
  \ Web 服务器，然后为每本新书添加一个新的选择列表选项，轻松大幅扩展应用程序的内容。只需确保每个 `<option>` 标签的 `value` 属性（例如\
  \ `warofworlds`）与你在文本文件名中使用的书籍缩写标题（如 `book_warofworlds.txt`）匹配即可。\n*   更改电子书内容的渲染——如果你想让电子书对所有读者更易读，你可能想要考虑增大字体，甚至选择一种更适合阅读的字体。由于所有书籍内容都流入\
  \ ID 为 `booktext` 的 `div` 元素，你可以通过向该 `div` 元素添加一些 CSS 字体样式来轻松更改整本书的外观。\n*   关闭 Ajax\
  \ 诊断栏——在向公众发布应用程序之前，不要忘记关闭 Ajax 诊断栏。为此只需从页面的 HTML 部分删除 ID 为 `ajaxState` 的 `div`\
  \ 元素，然后删除 JavaScript `handleRequest()` 函数中调用 `ajaxUpdateState()` 函数的那行代码。\n\n如果你在考虑\
  \ Booker 应用的另一个酷炫调整是每次加载并显示电子书的每一个章节，那么你的思路完全正确，因为下一章将恰好应对这一挑战。\n\n### 总结\n\n确实，这一章很快就进入了快车模式。你起初谨慎地观察\
  \ Ajax 机器的各个部分，学习了关于 Ajax 请求生命周期的一些知识，然后全速冲刺，对 Ajax 工具包进行了快速的介绍，并对你的第一个完整的 Ajax\
  \ 应用进行了相当具有冲击性的介绍。我所能说的只有，从现在开始只会变得。当然，应用程序在构建过程中会在这里那里变得有点复杂，但你会开始在所有 Ajax 应用之间看到一些共同的线索。\n\
  \n# 第二部分：构建真实世界的 Ajax 应用\n\n| | |\n| :--- | :--- |\n| 第 3 章 | 动态加载 Web 数据：XML 电子书\
  \ |\n| 第 4 章 | 使用 Ajax 动态填充列表：股票选择器 |\n| 第 5 章 | 接入 RSS 馈送 |\n| 第 6 章 | 使用自动补全读取用户心思\
  \ |\n| 第 7 章 | 使用实时验证创建响应式 GUI |\n| 第 8 章 | 用于图片的杀手级界面 |\n| 第 9 章 | 使用精美的弹出窗口展示信息\
  \ |\n| 第 10 章 | 使用 Ajax 预测天气 |\n| 第 11 章 | 构建 Ajax 运费计算器 |\n| 第 12 章 | 为你的网站添加 Ajax\
  \ 驱动的评分系统 |\n\n\n\n\n\n# 第 3 章 动态加载 Web 数据：XML 电子书查看器\n\n## 街机中的 Ajax\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | Web 第一次将 Ajax 术语与交互和计算联系起来。1987 年，科乐（Konami）发布了一款同名的纵向卷轴类太空射击视频游戏。在《Ajax》这款电子游戏中，你可以在控制直升升机和战斗机之间进行切换，并发射各种类型的导弹、激光和炸弹。\
  \ |\n\n上一一章探索了使用 Ajax 动态加载数据的基础，但电子书示例的效率相当低，因为你需要等待整本书加载完毕才能阅读任何内容。Booker 应用程序也只演示了如何加载原始文本文件，这在解决\
  \ Ajax 方程中的 XML 部分方面并没有起太大作用。实际上，以 XML 格式处理电子书更有意义，因为这让你能够挑选并选择你想要处理的信息。具体来说，按章节访问\
  \ XML 电子书是非常直观的，从而缩短了每个 Ajax 请求的传输时间，并通过一次只显示一个章节提高了书籍的可读性。\n\n本章在上一章 Booker 示例的基础上，引导你使用\
  \ XML 作为电子书数据格式，对应用程序进行重新设计。除了看到 XML 如何融入实际的 Ajax 应用程序外，你还能感受到当减少每个请求交换的数据量时，应用程序的响应速度会变得快多少。\n\
  \n本章中的 Booker 应用程序使用了以下文件，它们位于实版 Linux 光盘书籍的 `chap03` 示例代码文件夹中：\n\n* `booker.html`—主\
  \ Web 页面\n* `booker.php`—用于从电子书中加载章节的服务器端脚本\n* `ajaxkit.js`—Ajax Toolkit 的核心 Ajax\
  \ 函数\n* `domkit.js`—Ajax Toolkit 的 DOM 相关函数\n* `book_alicewonderland.xml`—《爱丽丝在仙境游记》XML\
  \ 电子书\n* `book_frankenstein.xml`—《弗兰肯斯坦》XML 电子书\n* `book_mobydick.xml`—《莫比迪克》XML\
  \ 电子书\n* `book_warandpeace.xml`—《战争与和平》XML 电子书\n* `book_warofworlds`—《世界大战记》XML\
  \ 电子书\n\n### 挑战：分小块加载数据\n\n如果你在读完上一章后停读了一个月，并打算尝试读《战争与和平》电子书，那么你会很快发现 Booker 示例应用程序在性能上有些缺陷。问题在于，该应用程序将电子书视为一整块原始文本块，当你尝试阅读像《战争与和平》这样真正厚重的书籍（仅超过\
  \ 3MB）时，非常笨拙。我不知道你的网络连接如何，但即使是我的宽带连接在加载一个 3MB 的文本文件时也会非常吃力，并费长时间。\n\n原始 Booker 应用程序不仅传输时间是一个问题，而且试图在单个页面上显示整本书还存在着严重的易用性问题。这样想吧——物理纸质印刷书首先被拆分为章节，然后进一步分为页。这不仅为你提供了一个放置书签以记住在书中的位置的好地方，而且在读完一大段文字后翻页可以作为一种有帮助的心理休息。Booker\
  \ 并非如此。整本 3MB 的小说被挤进浏览器中一个巨大的肥胖虚拟页面里。除非你是某种超人速读者，否则你会立即讨厌这种阅读方式。\n\n因此我们评估认为第一个\
  \ Booker 应用程序存在一些问题，而且根据动态数据加载的精神，Ajax 显然提供了一个解决方案。事实上，借助一点 Ajax 的帮助，可以动态地只加载你需要的内容，对于电子书来说，这只是一个章节。这种改变让你一事双得，因为这种每次加载一个章节书籍数据的新方法由于每个\
  \ Ajax 请求中传输的数据量大幅减少，带来了显著的性能提升。那么挑战就在于开发一个改进后的 Booker 版本，让它每次加载一个章节。\n\n#### 注意\n\
  \n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg) |\
