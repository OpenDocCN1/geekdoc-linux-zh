  \ Ajax 以及它是如何提升整体 Web 体验的。是的，以一种可以说是扭曲的方式，你可以透过汉堡包装纸的油腻镜片来看 Ajax。稍后你就会看到怎么了。\n\n\
  ### 与 Ajax 用餐\n\n\n\n\n\n回到开头提到的快餐类比，这种场景就像一家拥挤的快餐店，你必须在坐下休息之前，先站立在那里等食物。将这种快餐用餐体验与全服务餐厅进行对比：在后者中，在你坐下并点餐后，餐点会被送到你的桌上。坐在桌旁忙于自己的事情，而让人在厨房里忙碌地准备食物，这是一种极大的享受。在快餐的替代方案中，你必须站着等食物才能坐下休息（前提是你认为快餐店的座椅是舒适的的话）。我想说明的是，采用快餐方式意味着准备食物的时间浪费了你的时间，因为在食物准备好之前，你的用餐体验是处于暂停状态的。而在坐式晚餐中，你可以在等待时享用饮品、吃点前菜、读读杂志，或者与同伴聊天。这些是完全不同的体验，如图\
  \ 1.1 所示。\n\n#### 图 1.1. 在全服务晚餐中，准备食物的时间相对不被察觉，因为你可以自由地享受用餐体验。\n\n![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2cwl2suahnmmwkwyze-.jpg)\n\
  \n除了我热爱美食（尤其是外出就餐）之外，讨论的重点在于 `Ajax` 是一种 Web 开发技术，它承诺将你的 Web 页面升级为“坐式用餐体验”。传统的 Web\
  \ 应用程序迫你在服务器上搜索数据或进行其他处理时必须等待。`Ajax` 则不然。一个 `Ajax` Web 应用程序会在后台执行数据处理，让你在此期间继续与\
  \ Web 页面进行交互。这似乎像是一个细微的区别，但事实并非如此。问问自己，你是愿意在一家并不算快的快餐店里排队，还是更愿意在坐式餐厅舒适的餐桌旁放松？\n\n\
  **注意**\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
