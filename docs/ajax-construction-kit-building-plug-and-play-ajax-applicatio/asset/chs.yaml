  \ 3 章：动态加载 Web 数据：XML 电子书阅读器\n\n## 街机中的 Ajax\n\nAjax 这个术语并不是第一次与交互和计算联系在一起。1987\
  \ 年，科乐（Konami）发布了一款同名的纵向滚动太空射击类视频游戏。在《Ajax》游戏中，你需要在直升机和战斗机之间交替进行控制，并发射各种类型的导弹、激光和炸弹。\n\
  \n前一章探讨了使用 Ajax 动态加载数据的基础，但电子书的例子相当低效，因为你必须等待整本书加载完毕才能阅读任何内容。Booker 应用也只演示了如何加载原始文本文件，这在处理\
  \ Ajax 方程中的 XML 部分方面作用有限。实际上，处理 XML 格式的电子书更具意义，因为这让你能够挑选并选择你想要处理的信息。具体来说，按章节访问 XML\
  \ 电子书是相对直接的，从而缩短每个 Ajax 请求的传输时间，并通过一次只显示章节来提高书籍的可读性。\n\n本章将在前一章 Booker 示例的基础上，引导你使用\
  \ XML 作为电子书数据格式对应用程序进行重新设计。除了了解 XML 如何融入实际的 Ajax 应用外，你还能够感受到当减少每个请求交换的数据量时，应用程序的响应速度会提高多少。\n\
  \n本章中的 Booker 应用使用了以下文件，它们位于包含该书的实时 Linux 刻盘的 `chap03` 示例代码文件夹中：\n\n* `booker.html`—主\
  \ Web 页面\n* `booker.php`—用于从电子书中加载章节的服务器脚本\n* `ajaxkit.js`—Ajax Toolkit 的核心 Ajax\
  \ 函数\n* `domkit.js`—Ajax Toolkit 的 DOM 相关函数\n* `book_alicewonderland.xml`—《爱丽丝在仙境游记》XML\
  \ 电子书\n* `book_frankenstein.xml`—《科学怪人王》XML 电子书\n* `book_mobydick.xml`—《白鲸纪记》XML\
  \ 电子书\n* `book_warandpeace.xml`—《战争与和平》XML 电子书\n* `book_warofworlds`—《世界大战》XML 电子书\n\
  \n### 挑战：加载更小分块的数据\n\n如果你在读完最后一章后休息了一个月，试图阅读《战争与和平》电子书，那么你很快就会发现 Booker 示例应用在性能上略有不足。问题在于，该应用程序将电子书视为一个巨大的原始文本块，当你尝试阅读像《战争与和平》这样真正厚重的书（仅略超过\
  \ 3MB）时，这非常麻烦。我不知道你的网络连接如何，但即使是我的宽带连接在加载 3MB 的文本文件时也会感到吃力并耗费长时间。\n\n原始 Booker 应用的问题不仅在于传输时间，在尝试在单个页面上显示整本书时还存在严重的易用性问题。想一下——物理纸质印刷书首先被分为章节，然后进一步分为页。这不仅为你提供了一个放置书签以记录书中位置的好地方，而且在读完一大块文本后翻页，可以作为一种有利的心理休息。Booker\
  \ 并非如此。整本 3MB 的小说被挤进浏览器中一个巨大的虚拟页面里。除非你是某种超人类的速读者，否则你很快就会讨厌这种阅读方式。\n\n因此，我们认为第一个\
  \ Booker 应用存在一些问题，而根据动态数据加载的精神，Ajax 显然提供了一个解决方案。事实上，在少量 Ajax 的帮助下，可以动态地加载你需要的内容，对于电子书来说，这只是一个章节。这种改变让你一事双功，因为一次加载一个章节数据的新方法由于每个\
  \ Ajax 请求中传输的数据量大幅减少，带来了显著的性能提升。那么挑战在于开发一个改进的新版 Booker，让它每次加载一个章节。\n\n> **注意**：考虑将电子书拆分为单独的页面而不仅仅是章节，并不是不可行的。然而，由什么来定义页的长度呢？物理印刷书在以不同的尺寸和字体打印时显然并不遵循相同的页数。Web\
  \ 浏览器在能够显示的信息量方面更具多样性。因此，将章节作为将电子书拆分为组成部分的单位是有意义的。稍后，如果你想通过程序对章节进行分页，以适应特定的浏览器窗口以提高可读性，那是完全可以的。但对于组织和加载\
  \ XML 电子书来说，章节是正确的选择。\n\n在我们进入新电子书阅读器应用程序的设计阶段之前，值得花一点时间退后重新评估原始的 Booker 应用并查看它是如何工作的。通过这样做，你将更准确地了解在设计新应用程序时面临的挑战。\n\
  \n首先，图 3.1 显示主 Booker HTML Web 页面如何包含一个带有可用电子书的选择列表。从选择列表中选择书籍会导致整本书的内容加载到列表下方的区域（`div`），该区域占据了页面的大部分部分。\n\
  \n##### 图 3.1。当用户从列表中选择书籍时，原始 Booker 应用加载电子书的全文。\n\n在后台，Booker Web 页面使用 Ajax 请求根据响应用户在列表中选择书籍来动态加载书籍文本。从\
  \ Ajax 的角度来看，原始 Booker 应用代表可能是所有 Ajax 请求中最简单的，因为它处理的是未格式化的数据（原始文本），且数据直接从服务器上的文件（电子书文本文件）获取；响应请求之前不需要特殊的服务器程序来处理数据。\n\
  \n进入新版 Booker 的挑战在于，首先将电子书重新格式化为高度结构 XML 文档，然后重构 Web 页面以便能够加载单个章节而不是整本书。这将涉及一些用户界面的更改，因为用户现在需要能够在书籍的章节之间导航。事实证明，这种数据格式上看似微妙的变化对\
  \ Booker 应用的设计和实现产生了重大影响。\n\n### 设计：设计一个 XML 电子书阅读器\n\n\n\n\n\n好的，你正在重构 Booker 应用程序，通过\
  \ Ajax 请求使用 XML 数据格式来加载电子书。这意味着你首先需要为书籍设计一种合适的 XML 格式，以便能够逐章节方便地访问。在确定了 XML 格式后，你需要弄清楚在\
  \ Ajax 请求期间服务器和客户端之间具体传输了什么内容。理所当然的是，章节文本会一并发送，但现在由于电子书的格式将更加智能化，你应该能够作为请求的一部分接收到章节标题。然后，你就可以将章节名称作为标题显示在章节文本上方，让页面更具真实书籍的感觉。\n\
  \n### 注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 如果你没有熟悉 XML，不用担心，因为一旦看到它运行起来，它非常容易理解。事实上，当你创建 HTML 网页时，你已经在间接地使用 XML 了。HTML，或者说它更正式的表兄弟\
  \ XHTML，可以被视为 XML 的一种特定应用。 |\n\n### 客户端请求\n\n因此，新改进版 Booker 应用程序的设计很大一部分在于确定确切哪些信息需要在客户端和服务器之间移动，然后从服务器传回客户端。你可能记得每本电子书都存储在自己的文件中。在第一个版本的\
  \ Booker 应用程序中，书籍的缩写标题作为 Ajax 请求的一部分被发送——这就是请求知道要打开哪个文件的方式，而这又决定了加载哪本书。在较新的版本中，你不再请求一整本书，而是请求书的单个章节。出于这个原因，除了缩写标题外，你还需要传递章节信息。为了保持简单高效，章节可以被指定为一个数字，其中\
  \ `0` 是第一章，`1` 是第二章，以此此类推。\n\n### 注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 由于许多书籍包含序言、前言、结语等“章节”，因此在指代从 XML 文档中加载章节的“章节数字”时，使用不同的术语会更好。将此数字称为“章节索引”（chapter\
  \ index）会更有意义。因此，如果一本书在第 1 章之前有一个序言和一个前言，它们的章节索引分别为 `0`、`1` 和 `2`。 |\n\n总结一下，在新版本的\
  \ Booker 应用程序中，必须从客户端发送到服务器以启动电子书请求的以下两个信息：\n\n*   缩写标题（例如 `alicewonderland`）\n\
  *   章节索引（例如 `0`）\n\n现在让我们将转向服务器端，看看它在接收到客户端请求后需要做什么。\n\n### 服务器响应\n\n服务器的工作是获取电子书缩写标题和章节索引，并响应章节文本以及在客户端电子书查看器上下文中可能有任何其他内容。你已经确定知道章节标题会是一个很有用的信息。然而，有些书籍更进了一步，既有章节编号又有章节标题。知道这一点，从服务器接收章节编号可能也是个好主意。这也有助于处理某些不属于正常章节命名的“章节”情况，例如序言或结语。在这种情况下，“章节编号”可能是“序言”而不是“第\
  \ 1 章”。\n\n尽管你可以在此停止，并通向一个支持离散章节的可用电子书查看器，但仍然缺少一个关键信息。为了理解缺少了什么，评估应用程序的用户界面将如何运作至关重要。当你考虑时，实体书的操作理念是翻页。尽管电子书查看器没有将书籍分成页，但像翻页一样在章节移动的概念是一个好主意。这可以通过“上一个”（Previous）和“下一个”（Next）按钮来实现，如图\
  \ 3.2![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawcwl2cuahnmm2kwyzi-.jpg)\n\
  \n注意图中，章节可以被看作是逻辑上一个接一个地出现。“下一个”和“上一个”按钮允许你任方向地从一个章节导航到下一个。但你如何知道何时停止呢？这似乎是一个简单的问题，但它非常，因为它揭示了你必须知道总共有多少章，以便知道禁用“下一个”按钮。“上一个”按钮更容易处理，因为你已经知道哪章是第一章。最后一章是一个棘手的问题，因为你不想将所有章节都加载到应用程序并记住最后一章的名字。更简洁的替代方案是将总章节数作为\
  \ Ajax 请求的一部分返回。\n\n有了总章节数，你可以简单地将当前查看的章节与总章节数进行比较，查看“下一个”按钮是否可用。换句话说，如果读者正在查看最后一章，你需要禁用“下一个”按钮。总章节数是使这种用户界面技巧成为关键信息。\n\
  \n回顾 Booker 应用程序从服务器到客户端的数据传输部分，以下是发送的内容：\n\n*   章节编号（例如 `Chapter I`）\n*   章节标题（例如\
  \ `Down the Rabbit-Hole`）\n*   章节文本（例如 `Alice was beginning to...`）\n*   总章节数（例如\
  \ `12`）\n\n考虑到服务器的响应，现在可以组装整个客户端-服务器对话，并深入研究数据在其中具体是如何表示的。\n\n### 理解客户端-服务器对话\n\n\
  将应用程序的整个数据传输电路整合在一起，你得到了图 3.3，它显示了信息从客户端到服务器再从服务器传回客户端的流，这些都是单个 Ajax 请求的一部分。\n\n\
  #### 图 3.3。Ajax 请求中客户端和服务器之间的数据流是 Booker 应用程序设计的关键部分。\n\n![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawcwl2cuahnmm2kwyzm-.jpg)\n\
  \n图中揭示了多个信息如何在客户端和服务器之间双向传输。你从原始 Booker 应用程序已经知道，将信息作为 Ajax 请求 URL 的一部分发送服务器并不困难。例如，之前版本\
  \ Booker 中的电子书缩写标题使用以下 URL 发送：\n\n```\nbooker.php?title=alicewonderland\n```\n\n\
  你可以通过使用符号 (`&`) 将章节索引与标题分离，将其作为 URL 中的第二个参数添加如下所示：\n\n```\nbooker.php?title=alicewonderland&chapIndex=0\n\
  ```\n\n\n\n\n这涵盖了从客户端到服务器的数据传输。从服务器返回到客户端的数据要棘手得多，因为它包含了整个章节的文本，以及其他书籍信息，包括章节数、章节标题和总章节数。这些数据需要相当复杂的格式，以确保它们可以在客户端被整洁地提取出来。事实证明，XML\
  \ 为这类数据的格式化提供了完美的解决方案。即使你不是 XML 专家，我认为你理解以下代码也不会有太大困难：\n\n```\n<bookData>\n  <chapNum>Chapter\
  \ I</chapNum>\n  <chapTitle>Down the Rabbit-Hole</chapTitle>\n  <chapText>Alice\
  \ was beginning to get very tired of sitting by\n  her sister on the bank, and of\
  \ having nothing to do...\n  </chapText>\n  <totalChapters>12</totalChapters>\n\
  </bookData>\n```\n\n### Note\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 这些 XML 代码中的没有任何部分是标准或官方的。它们纯粹是为了 Booker 应用而创建的。XML 的一个主要优势是它允许你为任何目的创建任何所需的语言。知道这一点，你可以轻松地将\
  \ `<bookData>` 标签重命名为 `<eBookInfo>` 或 `<booker>`，只要你在整个应用程序代码始终使用该标签名称即可。 |\n\n\
  如你所见，服务器响应中包含的章节信息使用 XML 标签编码，这些标签清楚地描述了每条信息。在这个示例中，章节文本被刻意简化了，以便代码更易读。\n\n因此，服务器用\
  \ XML 数据响应客户端的 Ajax 请求，其中包含有关章节的相关信息。随后，解析 XML 数据并显示在页面上就变成了客户端的任务。你将在本章稍后的部分准确了解到具体是如何实现的。在此之前，重要的是涵盖一个额外的设计问题：对服务器脚本的需求。\n\
  \n新 Booker 应用设计的一个关键部分是将每本电子书编码为 XML 文档。由于每本电子书包含许多章节，以及书籍标题和作者等其他信息，理所当然，服务器上必须有某种程序知道如何接收章节请求并返回你刚才看到的\
  \ XML 章节数据。该服务器程序（在本例中为 PHP 脚本）负责解析整个电子书的 XML 数据，提取指定的章节数、章节标题和章节文本，并计算书籍中的总章节数。脚本必须将这些信息封装成它自己的\
  \ XML 代码并返回给浏览器。这就是你之前看到的包含 `<bookData>` 标签相同的代码。\n\n现在你已经有了足够关于新 Booker 应用 Ajax\
  \ 请求/响应的知识，可以开始整合应用程序了。如果你对如此快速上手 XML 感到有些担心，不用担心。加载和理解 XML 数据所需的代码少得令人惊讶。此外，拥有一个\
  \ XML 数据驱动应用程序的酷炫之处在于，一旦构建完成，你不需要（或几乎不需要）大动应用程序代码——你只需通过修改电子书本身的 XML 就可以做出实质性更改。\n\
  \n### 组装电子书查看器\n\n开始构建功能增强的 Booker 应用的最佳方法将其拆解为各个组成部分。以下是组成应用程序的三个主要组件：\n\n*   XML\
  \ 文件 (`book_alicewonderland.xml`, `book_frankenstein.xml` 等)\n*   HTML 网页 (`booker.html`)\n\
  *   PHP 服务器脚本 (`booker.php`)\n\n接下来的几几节将更详细地探索 Booker 拼图的这些部分，揭示让它们运行的代码。\n\n###\
  \ Note\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 哎！又要学习一项新技术了——PHP。其实不是。虽然了解 PHP 确实是一个巨大的优势，但你完全不需要成为 PHP 程序员才能理解并自定义此应用或书中的任何其他应用。我刻意结构了示例应用程序中的任何所有\
  \ PHP 代码，使其极其简单且精简。你遇到的大部分 PHP 代码都是“样板化”代码，这意味着你不需要碰它们来对应用程序进行微调和自定义。当出现机会精调 PHP\
  \ 代码时，我会准确地告诉你在哪里以及为什么这样做。 |\n\n### XML 电子书\n\n在原始的 Booker 示例中，电子书被指定为具有熟悉的 `.txt`\
  \ 扩展名的原始文本文件。应用程序打开并显示每本电子书的所有数据，作为一大块文本。新的 Booker 应用要求电子书以 XML 数据格式编码，该格式能够清晰地界定章节以及书籍标题、书籍作者、章节标题等其他信息。与文本文件类似，XML\
  \ 文件可以在任何文本编辑器中打开和编辑。你可以将 XML 文件 视为与 HTML 网页文件相同，区别在于你处理的是自定义的词汇（标签集），而不是 `<html>`、`<p>`、`<div>`\
  \ 等。XML 文件的扩展名均为 `.xml`。\n\n### Note\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 你经常在关于 XML 的讨论中看到“文件”和“文档”这两个术语交替使用。通常情况下它们指的是同一个东西。它们产生差异的地方在于 XML 代码并不一定对应磁盘上的文件。例如，在这种情况下，使用更抽象的“文档”一词来指代\
  \ XML 代码更合理。那么我们使用什么样的 XML 词汇来表示电子书呢？虽然有一些标准的电子书词汇，但对于本示例来说太复杂且过度设计，所以我认为创建自己的更好。与其给你每个标签的详细解释，不如看看实际书籍的片段：\n\
  \n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<ebook>\n  <title>ALICE'S ADVENTURES\
  \ IN WONDERLAND</title>\n  <author>Lewis Carroll</author>\n  <chapters>\n    <chapter\
  \ num=\"I\" title=\"Down the Rabbit-Hole\">\n    Alice was beginning to get very\
  \ tired of sitting by\n    her sister on the bank, and of having nothing to do...\n\
  \    </chapter>\n    <chapter num=\"II\" title=\"The Pool of Tears\">\n    &#39;Curiouser\
  \ and curiouser!&#39; cried Alice (she was so\n    much surprised, that for the\
  \ moment she forgot how to\n    speak...\n    </chapter>\n    ...\n  </chapters>\n\
  </ebook>\n```\n\n\n\n\n```\n<chapter num=\"Chapter II\" title=\"The Pool of Tears\"\
  >\n&#39;太奇怪了，太了！&#39;爱丽丝喊道（她太惊讶了，以至于一时完全忘记了如何说话……\n</chapter>\n```\n\n章节文本中奇怪的 `&#39;`\
  \ 是一个单引号（'），它经过特殊编码，以防混淆 XML 文档处理器。编码此类元素（在 XML 中也称为实体）的另一种方法是使用 XML 的标准单引号实体，即\
  \ `&apos;`。电子书中的双引号字符也需要进行类似的编码，在这种情况下，你使用 `&#34;` 代替实际的双引号（\"）。\n\n现在你已经理解了电子书\
  \ XML 文档的通用结构以及如何用 XML 编写电子书的每个章节，你可以将两者结合起来，从而更好地理解整本书的代码。以下是 H. G. 威尔斯所著的《世界大战》一书的部分代码：\n\
  \n### 代码视图\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<ebook>\n  <title>The\
  \ War of the Worlds</title>\n  <author>H. G. Wells</author>\n  <chapters>\n  <chapter\
  \ num=\"\" title=\"INTRO\">\n  But who shall dwell in these worlds if they be\n\
  \  inhabited? .  .  .  Are we or they Lords of the\n  World? .  .  .  And how are\
  \ all things made for man?\n  — KEPLER (quoted in The Anatomy of Melancholy)\n \
  \ </chapter>\n  <chapter num=\"BOOK ONE, CHAPTER ONE\"\n  title=\"THE EVE OF THE\
  \ WAR\">\n  THE COMING OF THE MARTIANS\n\n  No one would have believed in the last\
  \ years of the\n  nineteenth century that this world was being watched keenly\n\
  \  and closely by intelligences greater than man&#39; and yet\n  as mortal as his\
  \ own...\n  </chapter>\n  <chapter num=\"BOOK ONE, CHAPTER TWO\"\n  title=\"THE\
  \ FALLING STAR\">\n  Then came the night of the first falling star. It was seen\n\
  \  early in the morning, rushing over Winchester eastward, a\n  line of flame high\
  \ in the atmosphere. Hundreds must have\n  seen it, and taken it for an ordinary\
  \ falling star...\n  </chapter>\n  ...\n </chapters>\n</ebook> \n```\n\n希望在看到了两个本不同书籍使用相同格式编码的部分后，这些\
  \ XML 代码现在看起来更易懂一些了。值得注意的是，《世界大战》有一点不同之处，它被分为两个“卷”。作者没有为了这种指定章节方式细微不同而修改整个数据格式，而是将卷号整合到了章节编号中。与其他一些电子书不同，这本书的有趣之处在于，它同时利用了章节编号和章节标题，这有助于证明这两项信息都是有用的。\n\
  \n尽管我必须承认这一点也不好玩，但我手动将上一章的五个示例电子书转换成了你刚刚学习的 XML 格式。在此之前一直不费力，直到我遇到了那头凶猛的（字面意义上的！）《莫比迪克》，它被分成了\
  \ 102 章！更不用提《战争与和平》了，那是一部规模如此宏大的小说，为 Booker 应用提供了极佳的压力测试。你最终会发现，将电子书编码为 XML 是自定义\
  \ Booker 应用以满足自己需求时最耗时的部分。\n\n在本章前面的部分，我提到过 XML 文件具有 `.xml` 扩展名，尽管它们实际上是文本文件。以下是更新后的\
  \ Booker 应用中使用的电子书及其各自的文件：\n\n*   《爱丽丝仙游记》——`book_alicewonderland.xml`\n*   《弗兰肯斯坦》——`book_frankenstein.xml`\n\
  *   《莫比迪克》——`book_mobydick.xml`\n*   《战争与和平》——`book_warandpeace.xml`\n*   《世界大战》——`book_warofworlds.xml`\n\
  \n电子书使用了和你之前看到的缩写标题进行命名——唯一的变化是它们拥有 `.xml` 文件扩展名而不是 `.txt`。这意味着你可以可以使用公式程序化地构建 XML\
  \ 电子书文件名：\n\n```\n\"book_\" + AbbrevTitle + \".xml\"\n```\n\n下一节将展示 Booker 应用代码如何将此文件名结合章节索引向服务器发送\
  \ Ajax 请求。\n\n### Booker Web 页面\n\n虽然 Booker 应用有一个服务器端组件，但大部分工作在客户端完成，这对应于应用程序的\
  \ HTML Web 页面部分，即 `booker.html`。图 3.4 显示了在网络浏览器中运行的全新版 Booker 应用，它展示了更新后的用户界面，提供了用于导航的按钮。\n\
  \n#### 图 3.4. 现在只显示单个电子书章节，并提供了向前向后导航其他章节的按钮。\n\n[[查看全图]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddnsmdrj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnm3awyzq-.jpg)\n\
  \n**注意**\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 如果你好奇 Booker 应用中的 Ajax 诊断条去哪了，答案是我隐藏了它，以防分散对插图的注意力。事实上，诊断条在书中剩下的任何应用中都不会出现。你仍然可以轻松地通过从网页\
  \ HTML 代码中的 Ajax 状态 `div`（ID 为 `ajaxState`）中删除 `display:none` 样式来在示例中启用诊断条，或者如果你想保留该样式以便以后禁用它，可以将样式更改为\
  \ `display:block`。 |\n\n该图揭示了应用程序的几个新用户界面方面。首先，注意章节标题显示在电子书选择列表下方。该区域实际上能够显示章节编号和章节标题，但在《世界大战》引言的情况下，只出现了章节编号（`INTRO`）。\n\
  \n章节标题（编号 + 标题）下方是两个分别移动第一章和上一章的导航按钮。注意，这些按钮在图中是禁用的，这是一个细微但实用的用户界面提示，说明你正在查看书的第一章。紧接着是章节文本，随后是用于跳转到下一章和最后一章的额外导航按钮。\n\
  \n为了测试，我最初将所有导航按钮都放在章节文本上方靠近的位置，但我认为读完一个章节的末尾然后必须向上滚动才能跳转到下一章并不合理。这就是为什么“下一页”和“末尾”（`>>`）按钮出现在章节文本下方。\n\
  \n好了，我已经绕圈子绕得够久了，让我们来看页面主体部分的代码，它建立了用户界面并将脚本事件连接了一起：\n\n### 代码视图：\n\n\n\n\n\n```html\n\
