  \ 是一个极具侵略性的街头帮派成员的名字，他随时准备好战斗。如果这听起来还不够可怕，那么也许他的露指皮质手套和黑色无袖背心会吓坏你的时尚感！ |\n\n尽管天气在现实世界中只是平庸的谈资话题，但在\
