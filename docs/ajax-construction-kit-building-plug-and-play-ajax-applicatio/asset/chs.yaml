  \n## 概述\n\n### 立即使用 Ajax 增强你的网站……无需脚本知识！\n\n你已经听说过 `Ajax` 有多强大了——它如何帮助你的 Web 变得更易用、更具交互性、响应更快且更成功。`Ajax\
  \ Construction Kit` 让你现在就能让 `Ajax` 运转，即使你从未写过脚本！只需学习几个要点，查看几个示例，然后运行现场 CD，发现所有你所需的快速上手的即插用代码。`Ajax\
  \ Construction Kit` 的内置应用程序开箱即用。在 Michael Morrison 的轻松指导下，你将逐渐加深理解——学习如何定制、扩展和重用这些应用程序——甚至建立创建新应用的技能。成为一名专家而离开。\n\
  \n### 使用 Ajax Construction Kit 的十个完整应用程序来实现：\n* 动态加载 Web 数据\n* 动态填充列表\n* 接入 `RSS`\
  \ 新闻源馈\n* 使用 `AutoComplete` 减少输入错误\n* 创建带有实时验证的更具响应性的 GUI\n* 构建一个强大的图片查看界面\n* 使用精美的弹出窗口展示信息或广告\n\
  * 提供实时的天气预报\n* 构建电子商务产品运费计算器\n* 为你的网站添加评分工具\n* 以及更多……\n\n### CD-ROM 包含：\n* **你完整的\
  \ Ajax 项目**：从你的 `Windows`、`Mac OS X` 或 `Linux` 系统运行 CD 中包含的 `Ajax` 项目（`HTML`、`JavaScript`\
  \ 和 `PHP` 源代码）。\n* **完整的 Ajax 环境**：将 CD 引导为 `Ubuntu Linux` 现场 CD，立即开始处理 `Ajax` 项目（无需安装）。\n\
  * **CD 上的即用即工具包括**：`XAMPP` Web 服务器、`Firefox` 浏览器和 `Bluefish` HTML 编辑器。\n\n### 系统要求：\n\
  * **平台**：`Windows`、`Linux`、`Mac` (OS X 或更高版本)\n* **处理器**：Intel 处理器（Pentium 或更高）\n\
  * **内存**：128 MB RAM 或更多\n* **磁盘空间**：无需；可选 USB 闪盘存储数据\n* **光驱器**：CD 阅读器\n\n## Negus\
  \ Live Linux 系列\n### 你通过免费软件获得真实成果的实操指南\n\n将书籍 CD 中的免费软件和示例添加到你的 `Windows`、`Mac\
