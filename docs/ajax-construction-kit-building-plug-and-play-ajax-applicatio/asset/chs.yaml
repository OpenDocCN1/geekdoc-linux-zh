  \ |\n\n## 设计：设计动态图像查看器\n\n本章中的示例应用程序称为 Imaginator，它的主要任务是演示使用书中附带 Ajax Toolkit 中的模态图像查看器部分是多么地极其简单。Imaginator\
  \ 应用程序实际上只需要展示几张相互链接的缩略图，然后正确地调用 `initModal()` 函数来开启图像查看器。从那时起，一切都是自动的。\n\n你还需要在\
  \ Imaginator 页面中包含 `modalimgkit.js` JavaScript 文件，以及相关的样式表 `modalimgkit.css`。该样式表定义了模态图像窗口使用的样式，以便在屏幕上显示图像时获得整洁的外观。\n\
  \nImaginator 应用程序展示了一系列缩略图作为动态图像查看的基础，这意味着点击这些图像中的任何一张都会加载与缩略图关联的全尺寸图像，并跟踪加载状态。Imaginator\
  \ 页面始终保持可见，尽管在图像查看器显示图像时，它会被隐藏在一个半透明的灰色覆盖层之后。图 8.1 显示了在系列缩略图中，任何时候都只有一张图像可以全尺寸查看。\n\
  \n### 图 8.1。Imaginator 应用程序由一系列相互链接的缩略图组成，这些图像可以逐个全尺寸查看。\n\n![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdhzmghnmwkuawlmmc8-.jpg)\n\
  \n此图中没有显示的是在显示全尺寸图像时，整个 Imaginator Web 页面是如何被图像查看器禁用的。不仅如此，在图像加载期间还会显示一个动画的“加载”图像，以提示用户正在等待图像加载。此图像是图像查看器的一部分，但并没有阻止你将其更改其他内容。图\
  \ 8.2 显示了图像查看器使用的 `modalimgkit_wait.gif` 图像。\n\n### 图 8.2。Imaginator 使用的动态图像查看器利用动画“加载”图像（`modalimgkit_wait.gif`）来告知用户正在加载图像。\n\
  \n![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdhzmghqmnauawlnmc8-.jpg)\n\
  \n动画“加载”图像在图像加载期间取代图像显示。一旦图像加载完成，它就会替换“加载”图像。你可以将“加载”图像认为是在图像加载期间替代图像的占位符。\n\n##\
  \ 组装 Imaginator 应用程序\n\n得益于 Ajax Toolkit 中的图像查看器，组装 Imaginator 应用程序非常简单——该应用程序仅包含一个\
  \ HTML Web 页面和若干图像。具体来说，Web 页面 `imaginator.html` 包含一系列缩略图，这些图链接到每个缩略图的全尺寸版本。图 8.3\
  \ 显示了带有全尺寸模态图像的 Imaginator 应用程序，背景中可以看到系列缩略图。\n\n### 图 8.3。Imaginator Web 页面由一系列缩略图组成，这些图像链接到它们的全尺寸对应项。\n\
  \n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3a4cznhadbsav9pmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdhzmghqm3auawlnmc8-.jpg)\n\
  \nImaginator Web 页面的主体部分负责在页面上排列缩略图并建立到全尺寸图像的链接。以下是页面主体的代码：\n\n代码视图：\n\n```html\n\
  <body onload=\"initModal()\">\n  <p>Following are some pictures from a recent trip\
  \ to the Great\n    Smoky Mountains.</p>\n  <table>\n    <tr>\n      <td><a href=\"\
  smoky1.jpg\">...</a></td>\n```\n*（注：提供的源代码代码段在输入中被截断了，我根据可用文本维护了其结构）*\n\n\n\n\n\n\
  Imaginator 应用中唯一缺失的组件是图片查看器所需的两张图片。你已经见过其中一张，即 `modalimgkit_wait`，它作为一个在图片加载时显示的动画“加载”图像。另一个是\
  \ `modalimgkit_gray.png`，这是一个带有透明度的微小灰色图像，用于在查看图片时将背景窗口变灰。该图像通过在图片背后的图片查看器窗口中重复填充，能够使整个背景变灰。这种视觉效果是通过图片查看器的\
  \ CSS 样式表实现的。你只需要确保这两张图片与 Imaginator Web 页面位于同一个文件夹中即可。\n\n当你点击指向模态图片的链接时，这个微小的灰色透明图像会平铺在背景上，为底层页面提供一种“禁用”的外，同时在模态图片加载期间，动画的“加载”图像会显示在页面中心。一旦模态图片加载完成，它就会替换动画图像。当你点击关闭模态图片时，该图片和灰色透明背景图像都会消失。\n\
  \n## 测试 Imaginator\n\n测试 Imaginator 应用几乎和组装它一样简单，只需点击缩略图并确保它们能以全尺寸正确显示。图 8.4 显示了\
  \ Imaginator 应用初始打开时，可以看到缩略图，但没有显示全尺寸图片。\n\n### 图 8.4. 当 Imaginator 应用首次启动时，你只能看到一系列缩略图。\n\
  \n[[查看全尺寸图片]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3a4czrhadbsav9pmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdhzmghqnhauaunmc8-.jpg)\n\
  \n要查看动态图片查看器的运行效果，请点击其中一张缩略图。图 8.5 显示了在图片加载时出现的“加载”图像。\n\n### 图 8.5. 在加载全尺寸图片时，灰色背景前出现了一个“加载”图像。\n\
  \n[[查看全尺寸图片]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3a4czvhadbsav9pmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdhzmghqnxauawlnmc8-.jpg)\n\
  \n非常重要的是，“加载”图像背后的背景被变灰了，以防止在图片加载期间访问底层页面。这在视觉上强调了图片查看器是模态的，并有助于将注意力完全集中在全尺寸图片上（或者在本例中，专注于它正在加载的事实）。\n\
  \n片刻之后，全尺寸图片将出现在“加载”图像的位置，如图 8.6 所示。\n\n### 图 8.6. 加载完成后，全尺寸图片出现在“加载”图像的位置。\n\n\
  [[查看全尺寸图片]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3a4czzhadbsav9pmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdhzmghqnnauawlnmc8-.jpg)\n\
  \n再次，在查看全尺寸图片时，背景窗口保持变灰。要关闭图片，只需用鼠标点击它或按键盘上的 Enter 键或空格键。你将立即返回原始页面，可以在那里查看其他图片或继续浏览网页。\n\
  \nImaginator 应用的关键在于，为了查看全尺寸图片，你永远不需要离开原始页面。不仅如此，你还会获得一个非常清晰的视觉提示，表明图片正在加载，而不是仅仅等待浏览器在新的“页面”中苦苦运行以打开全尺寸图片。\n\
  \n## 为 Imaginator 进行一次极端的 Ajax 改造\n\n你可能会奇怪，考虑到图片查看器已经专注于解决一个非常特定的问题，Imaginator\
  \ 应用怎么还会有很大的改造空间呢？虽然你完全可以考虑通过支持说明或注释音频片段来增强图片查看器本身，但这只会使事情变得复杂，或者至少需要大量的开发工作。\n\n\
  对 Imaginator 应用来说，更贴切的极端改造是尝试使用你自己的图片。事实上，最好的实验方法是取一个带有缩略图的现有页面，在不做任何其他更改的情况下直接尝试图片查看器。你只需要在页面头部添加两行导入代码，然后在\
  \ body 的 `onload` 事件处理程序中添加 `initModal()` 函数调用。然后确保将源文件（`modalimgkit.css` 和 `modalimgkit.js`）以及图片（`modalimgkit_wait.gif`\
  \ 和 `modalimgkit_gray.png`）复制到包含页面的文件夹中即可。这是一个非常棒的测试，因为它展示了动态图片查看器可以是真正的即插即用。\n\n\
  改造 Imaginator 应用的另一种有趣方法是尝试不同的动画“加载”图像。如果你是一个手巧的平面设计师，你可能自己制作一个。对于我们其他人来说，有一个非常酷的在线工具允许你生成自己的自定义\
  \ Ajax“加载”图像。该网站名为为 `AjaxLoad.info` ([`www.ajaxload.info/`](http://www.ajaxload.info/))，你可以在图\
  \ 8.7 中看到它的效果。\n\n### 图 8.7. AjaxLoad.info 网站允许你为 Ajax 应用生成自定义的动画“加载”图像。\n\n[[查看全尺寸图片]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3a4czdhadbsav9pmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdhzmghq3auawlnmc8-.jpg)\n\
  \n使用该工具，你可以选择指示器类型（图标）以及它的背景和前景颜色，工具会为你生成动画图像。你甚至可以查看预览，在决定下载结果之前对图像进行微调。\n\n一旦你得到了喜欢的动画“加载”图像，只需将其覆盖到\
  \ Imaginator 文件夹中现有的 `modalimgkit_wait.gif`（或你自己的 Web 页面文件夹）。替换 GIF 文件将立即替换图片查看器中的图像，尽管如果你复制图片之前已经打开了\
  \ Imaginator 页面，可能需要刷新浏览器。\n\n### 总结\n\n本书的目标之一是构建实用的 Ajax 示例应用程序，其构建模块尽可能实现即插即用。虽然书中\
  \ Ajax 工具包的一些组件确实比其他组件更具即插即用性，但很少有组件像动态图片查看器这样简单且效果显著——只需在你的 Web 页面中编写几行代码，就能换一个流畅的“Web\
  \ 2.0”风格的图片查看器。我鼓励你通过将其插入自己的页面来利用该查看器的易用性，并且不要回头——在 Web 开发世界中，很少能以如此廉的代价获得如此巨大的回报。\n\
  \n## 第 9 章. 使用精美的弹出窗口展示信息\n\n### 走遍 Ajax\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgvdgmucg9zagpwawdll24-.jpg)\
  \ | 如果你想访问 Ajax，去加拿大安大略省中南部探险，在那里你会发现 Ajax 小镇。Ajax 位于安大湖湖岸，被认为是多伦多的一个郊区。小镇的名称源于二世界大战期间一直在那里的一个弹药工厂。由于其作为二战弹药提供者的角色，该镇以赢得二战期间英国首次主要海军战斗胜利的战舰“阿贾克斯女王号”（HMS\
  \ Ajax）命名。 |\n\n\n\n\n\nAjax 在 Web 上最直观的用途之一是在点击或悬停在链接上时自动出现的弹出窗口。尽管弹出窗口带有负面声誉，但如果使用得当，Ajax\
  \ 弹出窗口技术可以非常方便。例如，这种弹出窗口可以在鼠标悬停在链接上时做出响应，并在用户实际点击链接跳转到该页面之前，为其提供该页面的预览。甚至更好，你可以扩展“链接”的概念，让它直接在弹出窗口中共享信息，而不是链接到一个完全全新的页面。这可以简化网站的导航。除非有足够的页面级信息可用，否则用户不会被带到新页面——碎片化信息可以在弹出窗口中显示。\n\
  \n本章探索了由 Ajax 驱动的信息窗口（或称 info window）的概念，它只是一个通过 Ajax 请求获取并动态填充数据的弹出窗口。信息窗口可以显示几乎任何内容，但其核心思想是显示一段并不一定需要独立完整页面的碎片化信息。通过使用信息窗口，你可以让信息变得更易于获取，并消除了加载新页面和浏览器导航的需要。\n\
  \n本章中的 Informer 程序使用了以下文件，它们位于与书籍同附的 Linux Live 光盘中 `chap09` 示例代码文件夹下：\n\n* `snapper.html`—Snapper\
  \ 主 页面\n* `informer.html`—Informer 主 页面\n* `skateXXX.html`—一系列与滑板相关的示例 Web 页面\n\
  * `skateXXX.jpg`—一系列滑板示例图像\n* `ajaxkit.js`—Ajax Toolkit 的核心 Ajax 函数\n* `domkit.js`—Ajax\
  \ Toolkit 中与 DOM 相关函数\n* `infowinkit.js`—Ajax Toolkit 中与信息窗口相关的函数\n* `infowinkit.css`—信息窗口的样式表\n\
  * `infowinkit_wait.gif`—在向信息窗口加载信息时显示的动态“加载”图标\n\n### 挑战：创建创建链接的弹出窗口\n\n尽管我完全同意弹出窗口已成为\
  \ Web 短暂历史上最负面的“创新”之一的观点，但有时对负面事物进行轻微的重新利用可以化朽为神奇。“有帮助”与“烦人”之间只有微妙的界限。遗憾的是，弹出窗口在很大程度上倾向于后者。Ajax\
  \ 提供了一个以更更有帮助且更少侵入的方式使用弹出窗口的机会。\n\n记住，Ajax 的杀手锏功能是能够向服务器查询零散数据，而不是完整的 Web 页面。本书已经向你展示了许多示例，说明了动态加载电子书章节、股票报价或一段经过验证的用户输入是多么地有效率，而无需在服务器上进行一次完整的往返全页请求。然而，到目前为止的理念一直是从服务器加载一段信息并以某种方式将其显示在当前页面上。但如果使用当前页面进行显示并不符合逻辑，该呢？\n\
  \n在某些情况下，直接在当前页面上显示 Ajax 请求的结果可能会分散注意力。考虑本书书中侧边栏或注释框的类比。侧边栏或注释框旨在提供某种补充信息。然而，它被放置在页面主章节正文的正中间，从而争夺你的注意力。如果你能随心所欲地开启或关闭注释，而不是让它与主讨论在视觉上进行竞争，将要好得多。\n\
  \n#### Note\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 承认这个注释确实有点分散注意力，因为它消耗了打印页面上的宝贵空间，并中断了主章节正文的流。当然，你可以忽略它，但你显然没有忽略，否则你不会在读这句话了。如果你能用手指点一下页面让这个注释框消失就太好了。遗憾的是，我还没有想出如何将\
  \ Ajax 注入到打印页面中！ |\n\n我想表达的点是，当你有一些额外信息要展示，但又不想遮挡当前查看的页面时，弹出窗口会很有用。此外，如果你不需要在前端加载这些额外信息，而是根据需要进行加载，那将是极其方便的。Ajax\
  \ 使得能够按需访问此类信息，然后将其显示在仅临时占用屏幕空间的弹出窗口中。\n\n显而见，由于激进的在线广告商，人们对滥用弹出窗口存在很多恶意。由于这个原因，某些用户对任何形式的弹出窗口都反感。知道这一点，在用弹出窗口时要非常谨慎，即使在合理的情况下，也不要强加给用户。用户真正讨厌的是无法对弹出窗口的显示进行任何控制，这在那些烦人的弹出广告窗口中通常是常。弹出窗口更积极的用法是仅响应点击或可能的悬停时显示它们（在后一种情况下，当鼠标指针离开元素时隐藏弹出窗口很重要）。\n\
  \n一种流行的 Ajax 弹出技术涉及我们提到的悬停方法，即在悬停链接时显示链接内容的弹出窗口。这种技术的良好例子是 Snap Preview ([`www.snap.com/`](http://www.snap.com))，它会在悬停时显示页面预览。尽管你可以编写自定义悬停预览窗口，但没有必要，因为\
  \ Snap Preview 实际上可以处理页面上的所有链接。\n\n#### Note\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 类似于 Snap Preview 的服务是 Kontera ([`www.kontera.com/`](http://www.kontera.com))，它使用弹出窗口显示广告。虽然\
  \ Kontera 链接仍然是广告的，但它们比毫无警告就出现的弹出窗口要少干扰得多。 |\n\n要启用你的页面，你必须先在 [`www.snap.com`](http://www.snap.com)\
  \ 向 Snap 注册你的网站。\n\n除了向 Snap 注册之外，Snap 注册过程还为你提供了将 Snap Preview 功能添加到页面所需的 JavaScript\
  \ 代码。此 Snap Preview JavaScript 代码段位于标准的 `<script>` 标签中。以下是此类片段的示例，它必须放在 Web 页面的\
  \ head 部分以便使用 Snap Preview 功能：\n\n```\n<script defer=\"defer\" id=\"snap_preview_anywhere\"\
  \n  type=\"text/javascript\"\n  src=\"http://spa.snap.com/snap_preview_anywhere.js?\n\
  \  ap=1&amp;key=c6a9f...&amp;\n  sb=0&amp;domain=www.stalefishlabs.com\"></script>\n\
  ```\n\n此代码实际上包含在我制作的一个示例 Web 页面中，用于用于演示使用 Snap Preview 是多么简单。这是页面主体的代码：\n\n```html\n\
  <body>\n  <p>这里有一些链接：</p>\n  <p><a href=\"http://www.usatoday.com/\">USA Today</a></p>\n\
  \  <p><a href=\"http://www.amazon.com/\">Amazon.com</a></p>\n  <p><a href=\"http://www.nhl.com/\"\
  >National Hockey League</a></p>\n  <p><a href=\"http://www.snopes.com/\">Snopes.com</a></p>\n\
  \  <p><a href=\"http://www.michaelmorrison.com/\">Michael's Web site</a></p>\n</body>\n\
  ```\n\n\n\n\n正如你所见，这段代码本身没有任何特定内容将其与 Snap Preview 功能联系起来——Snap Preview 脚本会自动更改页面上的每个链接，以便使用该功能。图\
  \ 9.1 显示了带有预览弹出窗口的页面显示效果。\n\n### 图 9.1. 当你悬停在页面上的链接上时，Snap Preview 弹出窗口就会出现，提供页面的小型预览。\n\
  \n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3a5cznhadbsav9pmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdlzmghqm3auawlnmc8-.jpg)\n\
  \n非常重要的一，Snap Preview 弹出窗口的出现和消失是响应鼠标悬停和离开的，而不是鼠标点击。当你悬停在链接上时，弹出窗口会自动出现；当你移开（离开）链接时，弹出窗口就会消失。有些人认为，即使是这种弹出窗口方式也略显侵入性，因为在页面上移动鼠标时很容易无意中触发预览。一种更不侵略性的方法是将弹出窗口绑定到鼠标点击上。\n\
  \n最后，我们来到了本章的挑战——由鼠标点击启动的信息弹出窗口。我认为 Snap Preview 的弹出窗口方法（这种方法在 Netflix 等网站中也以略有不同的形式采用）非常酷，但我赞同那种抱怨，即当你通过悬停（拖动）链接不小心触发弹出窗口时，它可能会令人烦恼。在我看来，更安全的路线是依靠鼠标点击显示弹出窗口。当然，点击方法在某些情况下行不通，例如\
  \ Snap Preview，因为在发生点击时，确实有一个必须被跳转的链接。\n\n本章的重点是不适用于指向其他页传统链接的信息弹出窗口。这里的想法本质上是创建一个特殊的“弹出窗口链接”或“信息链接”，它只在你想要显示一小块信息时使用。这使得能够通过鼠标点击而非悬停来触发弹出窗口，从而最大限度地减少对页面易用性的任何潜在负面影响。好消息是，我已经写了实现信息弹出窗口的大部分代码。\n\
  \n支持信息弹出窗口的代码是 `infowinkit.js` 文件的一部分，该文件作为随书光盘提供的 Ajax Toolkit 中，它也是 Informer 示例应用程序源代码文件的一部分。正如最初在第\
  \ 2 章“Ajax 应用程序内部”中提到的，`infowinkit.js` 文件提供了两个支持动态信息弹出窗口的 JavaScript 函数：\n\n* `initInfoWindow()`——初始化整个页面的信息弹出窗口\n\
  * `showInfoWindow()`——在弹出窗口中显示特定的动态加载信息\n\n`initInfoWindow()` 函数用于初始化信息弹出窗口，必须在包含信息链接的页面\
  \ `body` 元素的 `onload` 事件处理程序中调用。随后，在每个信息链接的 `onclick` 事件处理程序中调用 `showInfoWindow()`\
  \ 函数；这才是真正导致弹出窗口显示的因素。当你在本章的稍后部分深入研究 Informer 应用程序的细节时，你将了解到更多关于这两个函数的具体细节。\n\n\
  回到与 Informer 应用程序相关的挑战，你知道信息弹出窗口用于共享信息。在这个特定的示例中，你创建了一个关于滑板运动的网页，并使用信息弹出窗口来描述涉及的主要设备。其想法是，页面上的主要内容只需提到每件设备，而每件设备的具体细节则委托给信息链接（弹出窗口）。因此，你将在页面上的几处文本周围包装信息链接，使文本链接到信息弹出窗口。\n\
  \n# 第 9 章：使用精巧的弹出窗口展示信息\n\nAjax 小镇\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmuc9zagpwawdll24-.jpg)\
  \ | 如果你想访问 Ajax，可以前往加拿大安大略省中南部，在那里你可以找到 Ajax 小镇。Ajax 位于安大略湖岸，被认为是多伦多的一个郊区。小镇的名称源于第二次世界大战期间位于那里的一家军药工厂。由于其作为二战弹药提供者的角色，该镇以赢得二战期间首场重大英国海战的战舰\
  \ HMS Ajax 号命名。 |\n\nAjax 在整个 Web 上最可见的用途之一是点击或悬停在链接上时自动出现的弹出窗口。即使弹出窗口带有负面标签，但当使用得当时，Ajax\
  \ 弹出窗口技术可以非常有用。例如，此类弹出窗口可以响应悬停链接而显示，并在用户通过点击实际跳转链接之前提供页面预览。或者更好，你可以扩展“链接”的概念，使其直接在弹出窗口中共享信息，而不是链接到完全不同的新页面。这可以简化网站的导航。除非有足够的整页信息可用，否则用户不会被带到新页面——碎片化信息可以在弹出窗口中显示。\n\
  \n本章探讨了 Ajax 驱动的信息窗口（或 info window）的概念，它只是一个通过 Ajax 请求获取数据动态填充的弹出窗口。信息窗口可以显示几乎任何内容，但通用的想法是显示一小块并不一定需要独立完整页面的信息。通过使用信息窗口，你让信息变得更易获取，并消除了加载新页面和进行浏览器导航的需求。\n\
  \n本章中的 Informer 应用程序使用了以下文件，它们位于随书 Live 版 Linux 光盘的 `chap09` 示例代码文件夹中：\n\n* `snapper.html`——Snapper\
  \ 主网页\n* `informer.html`——Informer 主网页\n* `skateXXX.html`——一系列与滑板相关的示例网页\n* `skateXXX.jpg`——一系列滑板示例图像\n\
  * `ajaxkit.js`——用于 Ajax Toolkit 的核心 Ajax 函数\n* `domkit.js`——用于 Ajax Toolkit 的 DOM\
  \ 相关函数\n* `infowinkit.js`——用于 Ajax Toolkit 的信息窗口相关函数\n* `infowinkit.css`——信息窗口的样式表\n\
  * `infowinkit_wait.gif`——在向信息窗口加载信息时动态“加载”图标\n\n### 挑战：创建链接弹出窗口\n\n尽管我完全同意弹出窗口已成为\
  \ Web 简短历史上最负面的“创新”之一，但有时对负面事物进行轻微的重新利用可以带来积极的转变。“有用”与“烦恼”之间有一条微妙的界限。遗憾的是，弹出窗口在很大程度上倾向于后者。Ajax\
  \ 提供了一个以更有帮助且更少侵入的方式使用弹出窗口的机会。\n\n记住，Ajax 的杀手锏功能是它可以向服务器查询碎片数据，而不是完整的 Web 页面。本书已经向你展示了许多示例，说明了动态加载电子书章节、股票报价或经过验证的用户输入是多么高效得多，而无需在服务器上进行完整的全页往返请求。然而，到目前为止的想法是从服务器加载一块信息并以某种方式将其显示在当前页面上。但如果使用当前页面进行显示并没有意义呢？\n\
  \n\n\n\n在某些情况下，直接在当前页面上显示 `Ajax` 请求的结果可能会分散注意力。考虑一下本书中的侧边栏或注释框。侧边栏或注释框旨在提供某种补充信息。然而，它们通常被放置在主章节正文的中间，从而争夺你的注意力。如果能够某种方式随心所欲地开启关闭注释，而不是让它在视觉上与主要讨论内容相竞争，将要好得多。\n\
  \n### 注释\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 承认这个注释有点分散注意力，因为它占据了打印页面上宝贵的空间，并中断了主章节正文的阅读流。当然，你可以忽略它，但你显然没有忽略，否则你就不会在读这句话了。如果能用手指点一下页面让这个注释框消失就太好了。遗憾的是，我还没有发现如何向打印页面中注入\
  \ `Ajax`！ |\n\n我想表达的观点是，当你有一些额外信息要展示，但又不想干扰当前查看的页面时，弹出窗口会非常有用。此外，如果你不需要在前端加载这些额外信息，而是根据需要才加载，那将极其方便。`Ajax`\
  \ 使得能够根据需要访问此类信息，然后将其显示在仅临时占用屏幕空间的弹出窗口中成为。\n\n显然，由于激进的在线广告商，人们对滥用弹出窗口存在许多敌意。因如此，某些用户反感任何类型的弹出窗口。考虑到这一点，在使用弹出窗口时要非常谨慎，即使在理由合理的情况下，也不要强加给用户。用户真正讨厌的是对弹出窗口的显示没有任何控制权，这在那些恼人的弹出广告窗口中很常见。弹出窗口更积极的用法是仅在响应点击（可能可能的悬停）时显示它们。在后一种情况下，在悬停结束后自动隐藏弹出窗口（即当鼠标指针离开其所悬停的元素时）是非常重要的。\n\
  \n一种被成功的 `Ajax` 弹出窗口技术涉及我刚才提到的悬停方法。我指的是链接预览弹出窗口，当你悬停在链接上时，与链接相关的页面内容会显示在一个小弹出窗口中。\n\
  \n这种技术的一个很好的例子是 Snap Preview 网站（[`www.snap.com/`](http://www.snap.com/)），它会显示一个呈现链接页面预览的弹出窗口。虽然你可以用\
  \ `Ajax` 编写自己的自定义悬停预览窗口，但其实没必要，因为 Snap Preview 实际上是一个自动化该过程的在线服务。Snap Preview 允许你将\
  \ Web 上的所有链接转换为 Snap Preview 链接。\n\n### 注释\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 另一个与 Snap Preview 的服务是 Kontera（[`www.kontera.com/`](http://www.kontera.com/)）），它使用悬停弹出窗口显示与链接相关的广告。虽然\
  \ Kontera 链接仍然是基于广告的弹出窗口，但它们比在没有任何警告的情况下出现的弹出窗口侵入性小得多。 |\n\n要让你自己的页面支持 Snap 功能，你必须先在\
  \ [`www.snap.com`](http://www.snap.com) 向 Snap 注册你的网站。\n\n除了注册之外，Snap 注册过程还为你提供了在页面中添加\
  \ Snap Preview 功能所需的 JavaScript 代码。这段 Snap Preview JavaScript 代码段包含在一个标准的 `<script>`\
  \ 标签中。以下是此类代码段的示例，它必须放在 Web 页面的 `head` 中才能使用 Snap Preview 功能：\n\n```\n<script defer=\"\
  defer\" id=\"snap_preview_anywhere\"\n  type=\"text/javascript\"\n  src=\"http://spa.snap.com/snap_preview_anywhere.js?\n\
  \  ap=1&amp;key=c6a9f...&amp;\n  sb=0&amp;domain=www.stalefishlabs.com\"></script>\n\
  ```\n\n这段代码实际上包含在我整合的一个示例 Web 页面（`snapper.html`）中，用于演示使用 Snap Preview 是多简单。这里是页主体的代码：\n\
  \n```html\n<<body>\n  <p>Here are some links:</p>\n  <p><a href=\"http://www.usatoday.com/\"\
  >USA Today</a></p>\n  <p><a href=\"http://www.amazon.com/\">Amazon.com</a></p>\n\
  \  <p><a href=\"http://www.nhl.com/\">National Hockey League</a></p>\n  <p><a href=\"\
  http://www.snopes.com/\">Snopes.com</a></p>\n  <p><a href=\"http://www.michaelmorrison.com/\"\
  >Michael's Web\nsite</a>a></p>\n</</body>\n```\n\n如你所示，这段代码中没有任何特定内容将其与 Snap Preview\
  \ 功能联系起来——Snap Preview 脚本会自动更改页面上的每个链接，使其使用该功能。图 9.1 显示了带有预览弹出窗口的页面看起来是什么样的。\n\n\
  #### 图 9.1 每当你悬停在页面上的链接上时，Snap Preview 弹出窗口就会出现，提供页面的小型预览。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzzmmuamdwz3a5cznhadbsav9pmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdlzmghqm3auawlnmc8-.jpg)\n\
  \n非常重要的一点是，Snap Preview 弹出窗口是响应鼠标悬停和离开而出现或消失，而不是鼠标点击。当你悬停在链接上时，弹出窗口会自动出现，当你离开（移出）链接时，弹出窗口就会消失。有些人认为即使是这种弹出窗口方法也有一点侵入性，因为在页面上移动鼠标时很容易无意中触发预览。一种更不具攻击性的方法是将信息弹出窗口与鼠标点击绑定。\n\
  \n最后，我们进入了本章的挑战——由鼠标点击启动的信息弹出窗口。我认为 Snap Preview 的弹出窗口方法（这种方法在 Netflix 等网站中也以略有不同的方式采用）非常酷，但我同意这种说法：当你通过悬停（拖动）链接时不小心触发弹出窗口时，它可能会很烦人。在我看来，更安全的路线是依靠鼠标点击。当然，点击方法在某些情况下（如\
  \ Snap Preview）不起作用，因为当点击发生时确实有一个必须跳转的链接。\n\n本章的重点是不适用于指向其他页面的传统链接的信息弹出窗口。这里的想法本质上是创建一个特殊的“弹出链接”或“信息链接”，它仅在你想要显示一条信息碎片时使用。这使得通过鼠标点击而非悬停来触发弹出窗口成为可能，从而最大限度地减少对页面可用性的潜在负面影响。好消息是，我已经写好了大部分实现信息弹出窗口的代码。\n\
  \n支持信息弹出窗口的代码包含在随书 CD-ROM 中 Ajax Toolkit 的 `infowinkit.js` 文件中，它也是 Informer 应用程序源代码文件的一部分。正如在第\
  \ 2 章 “Ajax 应用程序内部”中最初提到的那样，`infowinkit.js` 文件提供了两个 JavaScript 函数，用于支持动态信息弹出窗口：\n\
  \n*   `initInfoWindow()`——初始化整个页的信息弹出窗口\n*   `showInfoWindow()`——在弹出窗口中显示特定的动态加载信息\n\
  \n`initInfoWindow()` 函数用于初始化信息弹出窗口，必须在包含信息链接的页面 `body` 的 `onload` 事件处理程序中调用。随后在每个信息链接的\
  \ `onclick` 事件处理程序中调用 `showInfoWindow()`；这才是导致弹出窗口显示的显示。\n\n\n\n\n回到与 Informer 相关的挑战，你已经知道信息弹出窗被用于共享信息。在这个特定的示例中，你将创建一个关于滑板运动的网页，使用信息弹出窗来描述涉及的主要设备。其核心思想是：页面上的主要内容只需提到每件设备，而每件设备的细节则交给信息链接（弹出窗）。因此，你将为页面上的几段文本封装信息链接，以便这些文本与信息弹出窗关联起来。\n\
  \n## 设计：设计一个信息弹出窗应用程序\n\nInformer 应用程序实际上就是一个普通的网页，带有几个特殊链接，这些链接在信息弹出窗的辅助下变得非常有趣。由于信息链接是通过鼠标点击触发的，相关的弹出窗口会出现在所点击的链接之上。图\
  \ 9.2 显示了 Informer 程序的概念用户界面，包含一个显示在信息链接之上的弹出窗口。\n\n### 图 9.2. Informer 应用程序的用户界面由一个标准网页和一组能够触发弹出窗口的特殊信息链接组成。\n\
  \n![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdlzmghnngkuawlmmc8-.jpg)\n\
  \n该图展示了页面上的链接如何导致显示一个覆盖在链接所在页面上的弹出窗口。虽然驱动弹出窗的代码包含在 Ajax Toolkit 中，但在弹出窗中显示的信息是 HTML\
  \ 代码，这部分最终由你负责。这些 HTML 代码存储在单独的文件中，文件与信息弹出窗之间是一一对应的关系。这使得 Informer 应用程序能够针对每个弹出窗对特定文件发起\
  \ Ajax 请求。因此，你可以将每个弹出窗的内容看作一个微型网页。\n\n因此，应用程序的设计不仅涉及导入适当的 JavaScript 代码，还涉及弹出窗内容的创建。好消息是，这些内容是纯\
  \ HTML 代码，不需要特殊的脚本处理。\n\n尽管 Informer 应用程序中的 Ajax 请求发生在 `infowinkit.js` 文件内部，但评估代表信息弹出窗发送请求所涉及的内容仍然是值得的。接下来的几节将快速探讨与信息弹出窗相关的\
  \ Ajax 请求和响应。\n\n### 客户端请求\n\nInformer 应用程序中弹出窗内显示的信息是从作为微型网页的离散文件中加载的。例如，点击滑板轮的链接将显示出一个弹出窗，其中包含轮子的图片及其描述。这些图片和描述存储在诸如\
  \ `skatewheels.html` 的 HTML 文件中，并在弹出窗显示时通过 Ajax 请求动态加载。因此，针对信息弹出窗的客户端请求仅包含信息 Web\
  \ 页的 URL。\n\n请记住，随客户端请求发送的网页 URL 实际上并没有引用一个完整的网页。这是因为生成的 HTML 内容将被注入到现有的弹出窗中，而不是作为一个真正的网页在浏览器中打开。你可以将信息窗的\
  \ HTML 内容看作是一个 HTML 文档“片段（fragment）”。\n\n### 服务器响应\n\n信息弹出窗的“文档片段”概念应该提示你服务器在响应\
  \ Informer 应用程序发出的请求时返回什么。事实上，服务器仅返回存储在请求 URL 所引用的 HTML 文件中的文档片段。因此，在滑板轮示例中，客户端请求包含文件的\
  \ URL（`skatewheels.html`），而服务器响应则是该微型页的实际 HTML 代码。\n\n由于服务器响应的是完整文件（即使其内容代表 HTML\
  \ 代码的一个片段），因此没有在服务器上进行任何特殊处理。因此，你不需要为 Informer 应用程序编写任何 PHP 脚本。\n\n### 理解客户端到服务器的对话\n\
  \n得益于 Ajax Toolkit，Informer 应用程序使用了非常直接的 Ajax 通信。图 9.3 展示了向信息弹出窗中动态加载内容是如何涉及发送 URL\
  \ 并获取响应 HTML 代码（内容）的。\n\n### 图 9.3. Informer 应用程序使用 URL 作为客户端请求的基础，从而由服务器交付信息内容。\n\
  \n![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdlzmghnnwkuawlmmc8-.jpg)\n\
  \nInformer 应用程序中的客户端请求仅由信息内容的 HTML 文件的 URL。不需要任何参数，因为你只对 HTML 文件感兴趣，所以 Ajax 请求的结果是加载整个文件，在这种情况下，该文件包含信息“页面”的\
  \ HTML 代码。\n\n我在提到信息内容时对“页面”一词加引号，是因为与完整页面相比，它更像是一个 HTML 文档片段。以下是描述滑板轮的信息内容示例：\n\
  \n```html\n<table>\n <tr>\n   <td rowspan=\"2\"><img src='skatewheels.jpg'\n   \
  \  alt='Skateboard wheels' /></td>\n   <td style=\"font-weight:bold; background-color:#CCCCCC\"\
  >\n     Skateboard Wheels</td>\n </tr>\n <tr>\n   <td>Although other materials have\
  \ been used in the past,\n     modern skateboard wheels are all manufactured out\
  \ of\n     urethane. Urethane skateboard wheels come in a variety of\n     different\
  \ sizes and hardnesses for varying terrain.\n   </td>\n </</tr>>\n</table>\n```\n\
  \n该内容存储在 `skatewheels.html` 文件中，由一张图片、一个标题和描述性文本组成。HTML 代码作为服务器响应返回给 Informer，然后插入弹出窗中。\n\
  \n## 组装 Informer 应用程序\n\nInformer 应用程序大量使用了 Ajax Toolkit 中的信息窗支持，该工具包含在附带 CD-ROM\
  \ 中。除了 Ajax Toolkit，Informer 应用程序还需要另外两个组件：\n\n*   HTML 网页 (`informer.html`)\n*\
  \   信息内容页\n\nInformer 的 HTML 网页是包含信息链接的网页，而信息内容页描述特定的内容并用于驱动弹出窗。接下来的几节将更详细地查看 Informer\
  \ 应用程序的这些部分。\n\n### Informer 网页\n\nInformer 应用程序由多个 HTML 文件组成，但只有其中一个作为应用程序的主网页。主\
  \ Informer 页面是包含信息链接的地方，如图 图 9.4 所示。\n\n### 图 9.4. Informer 网页包含一段带有信息链接的文本，点击这些链接会启动信息弹出窗。\n\
  \n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3a5czzhadbsav9pmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlizgftdc9zyzc4cjlnmgkvzmnncdlzmghqnnauawlnmc8-.jpg)\n\
  \n该图展示了在 Informer 网页的文本段落中存在大量的信息链接。点击这些链接中的任何一个都会导致显示一个信息弹出窗，如图所示。虽然弹出窗主要通过 Ajax\
  \ Toolkit 中的 JavaScript 代码控制，但 Informer 页面的正文是在其 HTML 代码中布局的：\n\n\n\n\n```html\n\
  <body onload=\"initInfoWindow(325, 200)\">\n  <div id=\"ajaxState\" style=\"display:none\"\
  ></</div>\n  <br />\n  <h2>Informer - 滑板基础</h2>\n  <p>过去几年中，滑板已成为美国青少年的一项主要运动。尽管滑板涉及的设备相当简单，但对于这项运动的新手来说，仍然需要一定程度的学习。无论你计划进行哪种类型的滑板，你无疑都需要滑板的核心组件，它们由<a\
  \ href=\"#\" class=\"info\" onclick=\"return showInfoWindow('skatedeck.html', event)\"\
  >板面</a>、<a href=\"#\" class=\"info\" onclick=\"return showInfoWindow('skatetrucks.html',\
  \ event)\">支架</a>和<a href=\"#\" class=\"info\" onclick=\"return showInfoWindow('skatewheels.html',\
  \ event)\">轮子</a>组成。此外，考虑使用<a href=\"#\" class=\"info\" onclick=\"return showInfoWindow('skatehelmet.html',\
  \ event)\">头盔</a>和<a href=\"#\" class=\"info\" onclick=\"return showInfoWindow('skatepads.html',\
  \ event)\">护具</a>也是个好主意，特别是如果你计划滑任何高大的障碍，如垂直坡道和混凝土碗池。</p>\n</body> \n```\n\n此列表中第一个重要的代码段是页面\
  \ `body` 的 `onload` 事件处理器，它会调用 Ajax Toolkit 中的 `initInfoWindow()` 函数。注意向此函数传递了两个参数（`325`\
  \ 和 `200`），它们是弹出窗口的宽度（`325`）和高度（`200`），单位为像素。此宽度和高度在整个应用程序周期内是固定的，这意味着一旦设置了宽度和高度，弹出窗口就不会改变大小。\n\
  \n下一段值得再次查看的代码是通过熟悉的锚点标签（`<a>`）创建信息链接的代码。以下是出现在正体 HTML 代码中的其中一个信息链接的示例：\n\n```html\n\
  <a href=\"#\" class=\"info\"\n  onclick=\"return showInfoWindow('skatedeck.html',\
  \ event)\">deck</a>\n```\n\n注意 `href` 属性（它通常指向链接的 URL）被设置为 `\"#\"`。这基本上是告诉链接它并没有链接到任何地方。相反，该链接作为信息弹出窗口的触发器，该窗口通过\
  \ `onclick` 事件处理器中的 `showInfoWindow()` 函数调用来显示。当用户点击链接的文本 \"deck\" 时，就会调用 `showInfoWindow()`\
  \ 函数并显示弹出窗口。\n\n`showInfoWindow()` 函数的第一个参数要显示的页面 URL。如果你还记得早些时候提到的，信息页面实际上是页面片段，因为它们旨在用于显示在现有的弹出窗口中。你将在下一节中了解更多关于这些页面的结构。函数的第二个参数是标准的\
  \ JavaScript `event` 对象，它对于传递鼠标点击的坐标是必需的。\n\n### 注意\n\n| ![](img/ys8wohawzzmxc1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 实际上，“标准的” JavaScript `event` 对象并不完全标准，这意味着它并不在所有浏览器中都得到支持。然而，Ajax Toolkit 足够智能，考虑到浏览器不一致性并相应调整事件处理代码。\
  \ |\n\n请记住，`showInfoWindow()` 函数最终负责加载信息内容的 Ajax 请求。为了更好地理解 `showInfoWindow()` 函数如何产生\
  \ Ajax 请求，请查看以下该函数在 `infowinkit.js` 文件中显示的代码片段：\n\n```javascript\nfunction showInfoWindow(infoURL,\
  \ evt) {\n  ...\n  ajaxSendRequest(\"GET\", infoURL, handleContentRequest);\n  ...\n\
  }\n```\n\n注意，由于 `infoURL` 参数，正在加载的“页面” URL 直接传递给了 Ajax 请求。这证明了信息弹出窗口的 Ajax 请求仅仅涉及加载一个\
  \ HTML 文件。\n\n在 Informer 页面主体 HTML 代码中可以注意的另一个小细节是将信息链接的 `class` 属性设置为 `\"info\"\
  `。`info` 样式类在 `infowinkit.css` 文件中定义，用于使信息链接样式与标准链接略有不同。这些链接提供了一个视觉提示，表明它们的功能稍超普通。具体来说，信息链接显示为双下划线，并且在悬停时会变为高亮。\n\
  \n为了让 `info` 样式类起作用，必须使用以下代码将 `infowinkit.css` 样式表导入到 Informer Web 页面（`informer.html`）的头部中：\n\
  \n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"infowinkit.css\" />\n\
  ```\n\n同样，使用以下代码导入 `infowinkit.js` JavaScript 文件：\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"infowinkit.js\"> </script>\n```\n\n这两行代码都必须出现在页面的 `head` 中。为了澄清如何导入文件，这里是\
  \ Informer Web 页面的完整头部：\n\n```html\n<head>\n  <title>Informer</title>\n\n  <link\
  \ rel=\"stylesheet\" type=\"text/css\" href=\"infowinkit.css\" />\n  <script type=\"\
  text/javascript\" src=\"ajaxkit.js\"> </script>\n  <script type=\"text/javascript\"\
  \ src=\"domkit.js\"> </script>\n  <script type=\"text/javascript\" src=\"infowinkit.js\"\
  > </script>\n</head>\n```\n\n这段代码显示了 Informer Web 页面还包含了 `ajaxkit.js` 和 `domkit.js`\
  \ 文件，它们提供了与 Ajax 和 DOM 相关的若干辅助函数。\n\n在 Informer 应用的框架搭建后，你缺失的是信息弹出窗口的内容。\n\n如果你回到\
  \ Informer 页面主体中的代码，你会注意到与滑板设备相关的五个信息链接。每个链接都引用一个显示在信息弹出窗口中的 HTML 文件：\n\n*   `skatedeck.html`\n\
  *   `skatetrucks.html`\n*   `skatewheels.html`\n*   `skatehelmet.html`\n*   `skatepads.html`\n\
  \n每个文件都代表一个点击链接时显示的微 Web 页面。尽管这些文件是文档片段而不是完整的 Web 页面，但你仍然可以在浏览器中打开并查看它们。图 9.5 显示了在浏览器中直接查看\
  \ `skatedeck.html` 文件。\n\n#### 图 9.5 Informer 应用中的每个信息内容实际上只是微 Web 页面。\n\n[查看大图](ys8wohawzzmxc1mjjlzgftdc9zyzc4cjlnmgkvzmncdlzmghqn3auawlnmc8-.jpg)\n\
  \n图揭示了滑板板面的信息内容由一张图片、一个标题和一段文本组成。在讨论内容文件时，我多次使用了“片段”一词。我这样做是因为普通的 Web 页面中没有 `<html>`、`<head>`\
  \ 或 `<body>` 标签。相反，内容“页面”仅包含描述内容的 HTML 代码。为了让你明白我的意思，请看图 9.5 所示 `skatedeck.html`\
  \ 文件的以下代码：\n\n```html\n<<table>\n <tr>\n   <td rowspan=\"2\"><img src='skatedeck.jpg'\n\
  \     alt='Skateboard deck' /></td>\n   <td style=\"font-weight:bold; background-color:#CCCCCC\"\
  >\n     滑板板面</td>\n </tr>\n <tr>\n   <td>板面是滑板最核心的部分，它通常由七层硬枫木制成。这些层板被胶合并在模具中压制，然后切割并加工成所需的形状。</td>\n\
  \ </tr>\n </table>\n```\n\n\n\n\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 我坦然承认，我违反了“不使用表格进行布局”的黄金法则，但在这种情况下，使用表格来布局滑板内容反而更整洁、更简单。如果你想做一个设计上的纯主义者并放弃表格改用\
  \ CSS，请自便。 |\n\n这段代码揭示了如何使用 HTML 代码片段来描述滑板的微型页面。这之所以行得通，是因为代码最终被插入到信息弹窗中，而不是作为一个独立的\
  \ Web 页面打开的。\n\n我遗漏提到的一个小细节是，我只创建了五个 HTML 内容文件中的三个，故意遗留了 `skatehelmet.html` 和 `skatepads.html`\
  \ 文件。遗留这些文件的目的是测试 Informer 应用程序处理缺失内容的能力，这是你接下来要进行的操作。\n\n### 测试 Informer\n\n测试\
  \ Informer 应用程序只需要在浏览器中打开主页面并点击即可。图 9.6 显示了页面首次加载后的状态，此时尚未点击任何信息链接。\n\n#### 图 9.6.\
  \ 当 Informer 应用程序启动时，信息弹窗是隐藏的，因为尚未点击任何信息链接。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3a5czhhadbsav9pmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdlzmghqohauawlnmc8-.jpg)\n\
  \n要查看信息弹窗并查看有关特定滑板装备的更多细节，只需点击信息链接之一。你看到的第一个东西是一个弹窗，左上角有一个小的动画“加载”图标，让你知道内容正在加载。图\
  \ 9.7 显示了该图标的运行状态。\n\n#### 图 9.7. 动画“加载”图标首先出现在信息弹窗中，告知你内容正在加载。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3a5czlhadbsav9pmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdlzmghqoxauawlnmc8-.jpg)\n\
  \n除非你的连接非常慢，否则内容应该加载得很快，在这种情况下，动画“加载”图标会被实际内容取代。图 9.8 显示了带有弹窗的 Informer 应用程序，窗口正在显示关于滑板的信息。\n\
  \n#### 图 9.8. 当你在 Informer 应用程序中点击信息链接时，会出现带有额外信息的信息弹窗。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3a5czbhadfsav9pmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdlzmwhqmhauawlnmc8-.jpg)\n\
  \n当然，页面上的两个信息链接被刻意设置为会失败，这为 Ajax Toolkit 的错误处理能力提供了一个很好的测试。图 9.9 显示了点击头盔或护垫信息链接时会发生的情况。\n\
  \n#### 图 9.9. 点击没有可用内容内容的信息链接会导致出现一个包含错误信息的弹窗。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3a5czfhadfsav9pmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdlzmwhqmxauawlnmc8-.jpg)\n\
  \n如图所示，信息弹窗以尽可能优雅的方式处理了缺失的内容，仅仅显示了一条找不到内容的消息。\n\n### 为 Informer 进行一次极端的 Ajax 改造\n\
  \n在考虑对 Informer 应用程序进行改造时，脑海中很快浮出的一个想法是先完成应用程序，确保它没有缺失任何内容。这涉及到为滑板头盔（`skatehelmet.html`）和滑板护垫（`skatepads.html`）创建两个缺失的内容文件。目的并不是让你成为滑板专家，而是让你实验向信息窗口添加内容。\n\
  \n创建这两个文件的最佳方法是先复制现有的内容文件之一并作为模板。例如，复制 `skatedeck.html` 并将其作为两个缺失文件的基础。只需稍微搜索，在网上找到滑板头盔和护垫的照片应该不会太困难。只需将图片与标题和一些描述性文字配对，你就能很快为每个缺失的主题创建一个内容文件。\n\
  \n扩展 Informer 应用程序的一种趣方法是完全改变页面的主题。例如，将内容的重心转向你感兴趣的内容，而不是滑板。也许你喜欢钓鱼，在这种情况下，你可以关于这项运动写一两段话，包括你喜欢的钓鱼设备。然后围绕文本中一些可以使用额外描述的有趣部分创建信息链接。\n\
  \n在正文中创建好信息链接后，你就可以准备创建实际显示在弹窗中的内容文件了。可以随意抛弃我的滑板模板，创建你自己的更令人兴奋的东西。改变弹窗感觉的一种方法是修改它们的大小。记住，弹窗的宽度和高度是在你在\
  \ Informer Web 页面的 `onload` 事件处理程序中调用 `initInfoWindow()` 函数时设置的。尝试更改宽度和高度，以获得与你的内容定制的不同尺寸窗口。\n\
  \n关于信息弹窗能做的事情，我仅仅触及了表面。我鼓励你寻找自己的独特应用——只需记住，主要的优势是可以在临时窗口中显示小段 HTML 内容，而不是像传统链接那样打开全新的\
  \ Web 页面。\n\n#### 注意\n\n| ![](img/ys8wohawzzmxcjmmmjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 既然知道信息弹窗窗口的大小在首次初始化后就不会改变，那么尝试让所有内容文件的大小大致相同是一个好主意。这样，它们可以在单个弹窗中显示，且滚动最少。理想情况下，不应该有滚动，但这在所有浏览器中很难保证。\
  \ |\n\n### 总结\n\n本章了 Ajax 开发中一个既流行又充满争议的领域。虽然弹窗在用不当时确实不受人待，但当谨慎且为了有意义而使用时，它们也会非常有帮助。Ajax\
  \ 驱动的弹窗比标准弹窗更有趣，因为它们允许你从服务器动态加载短小的数据，而无需打开一个完全新的 Web 页面。本章引导你开发了一个使用书中 Ajax Toolkit\
  \ 内置信息弹窗支持的示例应用程序。希望你喜欢处理这些信息弹窗，因为这并不是你最后一次看到它们了。\n\n## 第 10 章。使用 Ajax 预测天气\n\n\
  另一个战士阿贾克斯\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 如果你认为希腊战士阿贾克斯强悍，那么纽约街头流氓阿贾克斯呢？在 1979 年的电影《战士》（The Warriors）中，Ajax 是一个特别有攻击性的街帮成员的名字，他总是准备好战斗。如果这听起来还不够可怕，那么也许他的露指皮手套和黑色无袖背心会吓到你的时尚审美！\
  \ |\n\n\n\n\n尽管天气在现实世界中只是平庸的谈资话题，但在 Web 服务领域，它是一份非常有趣的数据。天气是实时 Web 服务的绝佳示例，因为它具有非常实时的感。它总是在变化且难以预测，这使其成为实时查看的理想数据类型。而且天气以非常真实的方式影响着我们所有人的生活，使其成为某些\
  \ Web 应用中非常有价值的实用信息源。\n\n本章深入探讨了一个使用 `Ajax` 查询天气服务器获取实时天气数据，并以有趣方式显示这些数据的应用程序。更具体地说，天气数据显示在一个临时的弹出窗口中，类似于第\
  \ 9 章“使用精美弹出窗口展示信息”中所示的那种。天气数据非常适合在弹出窗口中显示，因为它是简洁的，通常作为特定页面重点的补充。换句话说，它是那种你可能想快速看一眼然后关闭的内容。\n\
  \n本章中的 `Forecaster` 使用了以下文件，它们位于随书附带的实时 Linux 光盘的 `chap10` 示例代码文件夹中：\n\n* `forecaster.html`—\
  \ 主 Web 页面\n* `forecaster.php`—加载天气预报的服务器脚本\n* `ajaxkit.js`— `Ajax Toolkit` 的核心\
  \ `Ajax` 函数\n* `domkit.js`— `Ajax Toolkit` 的 DOM 相关函数\n* `infowinkit.js`— `Ajax\
  \ Toolkit` 的信息窗口相关函数\n* `infowinkit.css`— 信息窗口的样式表\n* `infowinkit_wait.gif`— 在向信息窗口加载信息时显示的动态“加载”图标\n\
  \n## 挑战：收集动态天气信息\n\n本章的挑战涉及使用 `Ajax` 动态加载指定位置的天气数据。实时天气信息在各种场景中都可能有用：旅游网站、体育网站，实际上任何天气可能可能影响网站内容的网站。我个人很喜欢旅游网站这个主意，因为天气在旅行决策中确实起着至关重要的作用。也许你正试图仔细地避开飓风季节热带地区的风暴，或者你可能想在赛季之初出发滑雪之旅之前检查天气是否足够冷。几乎任何涉及旅行的网站都能从实时天气数据中获益。\n\
  \n但已经可以很容易地获取天气状况了，为什么还要费用 `Ajax` 和弹出窗口呢？只需去 [Weather.com](http://Weather.com) 网站查看世界上任何城市的当前天气状况即可。\n\
  \n尽管 [Weather.com](http://Weather.com) 在提供信息的质量方面是无可比拟的，但请记住，你需要在浏览器中导航到它，然后输入你想要的天气报告所在的位置。如果你不想丢失正在查看的页面上下文，而是倾向于在不离开页面的获取快速天气更新，这就是问题。这就是弹出窗口大显身场的地方。通过在弹出窗口中显示天气数据，允许用户继续专注于当前任务，而不会因离开页面而分散注意力。可能重要的是，你消除了他们离开你\
  \ Web 网站的一个理由。\n\n所以，你的目标不是创建一个比 [Weather.com](http://Weather.com) 等纯天气网站更丰富或更详尽的天气替代。你的目标是将实时天气数据注入到现有网站的环境中，从而在用户无需离开你的舒适页面的情况下添加一些实用的新内容。信息弹出窗口是显示天气数据且不与正在查看的主页竞争的关键。\n\
  \n此挑战涉及的 `Ajax` 请求必须以某种方式根据特定位置查询天气服务获取天气数据。事实证明，邮政编码就足以识别一个位置，因此成为查询天气数据的一个极佳数据。`Ajax`\
  \ 响应随后包含天气数据，你必须以某种方式处理这些数据，以便在弹出窗口中显示有意义的天气信息。\n\n## 第 10 章 使用 Ajax 预测天气\n\n另一个战士阿贾克斯\n\
