  \ 方法接受特定头部的标签，并返回该标签对应的头部字符串值。作为示例，你可以通过获取 `\"Content-Type\"` 标签的响应头来确定请求的内容类型，如下：\n\
  \n```\nvar header = request.getResponseHeader(\"Content-Type\");\n```\n在此示例中，存储在\
  \ `header` 变量中的返回值可能是类似于 `text/xml` 或 `text/plain` 的内容，取决于请求返回的数据类型。\n\n### 属性\n\
  \n方法只是 `XMLHttpRequest` 等式中的的一部分。几个属性也发挥了作用，并且对于成功执行 Ajax 请求来说实际上非常重要。以下是 `XMLHttpRequest`\
  \ 对象支持的最重要的属性：\n\n* `readyState`\n* `status`\n* `statusText`\n* `responseText`\n\
  * `responseXML`\n\n这些属性之所以重要，是因为它们提供了有关 Ajax 请求状态和阶段的关键信息，例如请求是否已完成并成功，以及存储 Ajax\
  \ 请求返回的数据。所有这些属性都是只读的，这意味着你不能设置它们的值。前三个属性与请求的状态和阶段有关，而后两个属性用于访问请求返回的实际数据。接几节将深入探讨这些属性的工作原理。\n\
  \n#### `readyState`\n\n`readyState` 属性反映请求的当前状态，是你跟踪请求进度的主要手段。该属性在请求执行时会经历一系列值，其中最后一个值表示请求已完成。以下是\
  \ `readyState` 属性的可能值，按出现顺序排序：\n\n* `0`—未初始化 (Uninitialized)\n* `1`—加载中 (Loading)\n\
  * `2`—已加载 (Loaded)\n* `3`—交互中 (Interactive)\n* `4`—完成 (Complete)\n\n在这些属性值中，你通常只关心最后一个，因为它表示请求的完成。然而，在检测成功的\
  \ Ajax 请求时，`readyState` 属性值为 `4` 并不是故事的结束。你还需要考虑 `status` 属性。\n\n注意\n| | 分配给 `onreadystatechange`\
  \ 事件处理器的自定义回调方法会在 `readyState` 属性值变化时被调用。这就是为什么在回调方法中对请求做出响应之前，检查 `readyState` 属性是否等于\
  \ `4` 是重要的——你需要在执行任何操作之前确认请求已完成。 |\n\n\n\n\n\n`status` 属性记录了当前的 HTTP 服务器状态，它可以是许多不同值之一，包括表示“未找到”的\
  \ `404` 或表示“主成功”的 `200`。从 Ajax 的角度来看，实际上你真正感兴趣的是 `status` 设置为 `200`，这表示请求执行“成功（OK）”。虽然可能会出现其他代码，但你主要感兴趣的是\
  \ `200`，因为任何其他代码都意味着存在问题。\n\n你通常会检查 `status` 属性是否等于 `200` (OK)，同时检查 `readyState`\
  \ 属性是否等于 `4` (Complete)。如果这两个属性都通过了，你就知道请求已成功完成，并可以开始处理请求数据。\n\n### statusText\n\
  \n`statusText` 属性包含一个与当前状态码关联的字符串消息。例如，成功状态码 `200` 的状态文本为 `\"OK\"`。如果请求以 `200` 以外的状态码失败，你可能考虑显示状态文本以用于诊断或错误处理之目的。\n\
  \n### responseText\n`responseText` 属性是存储从 Ajax 请求返回的数据的属性对中的半部分。我称它是属性对的半部分，是因为另一个名为\
  \ `responseXML` 的属性能够返回不同于 `responseText` 格式的数据。如果你计划以原始文本的形式接收请求数据，`responseText`\
  \ 是你想要使用的属性，因为它简单地为你提供了一个包含数据的文本字符串。\n\n### responseXML\n响应数据属性对的另一半是 `responseXML`\
  \ 属性，它将请求的返回数据格式化为与 DOM 的 XML 文档节点对象。由于 `responseXML` 属性提供了一个 DOM 节点对象，你可以使用所有极其强大且灵活的\
  \ DOM 方法和属性来探索和操纵数据。虽然通过 `responseText` 属性作为原始文本处理 Ajax 请求数据完全可行且通常很有用，但正是 `responseXML`\
  \ 提供的 XML 请求数据结构赋予了 Ajax 强大的力量。\n\n需要注意的是，只有当响应的内容类型（content type）被设置为 XML MIME\
  \ 类型 `text/xml` 时，请求数据才会存储在 `responseXML` 属性中。在许多情况下，XML MIME 类型会根据响应中 XML 数据的识别自动正确设置。但并非总是如此，你可能会遇到这样的情况：尽管知道响应正在接收\
  \ XML 数据，但 `responseXML` 属性却为空。解决方案是通过 `overrideMimeType()` 方法显式将请求的 MIME 类型设置为\
  \ `\"text/xml\"`。\n\n### Events\n在任何 Ajax 应用中，背后发挥魔法作用事件是 `onreadystatechange`，它会在请求的就绪状态发生变化时被触发。该事件通常会被分配一个自定义的事件处理方法，根据就绪状态的变化采取行动。你的工作是在此方法内检查并确保请求已完成（`readyState\
  \ == 4`）并且没有错误（`status == 200`）。\n\n## 附录 C. 使用 Live Linux CD\n\nLive CD 是存储在可移动光盘上的整个计算机操作系统。该\
  \ CD 可以在大多数标准 PC 上直接引导，忽略你硬盘的内容，并作为桌面、服务器或其他特殊类型的系统运行。本书附带的 Ajax Construction Kit\
  \ live CD 包含了这三者的元素。通过使用此 live CD，你可以实时运行书中所有的示例，在阅读书籍时跟随代码操作，并修改代码以备后复用。\n\n###\
  \ Live CD 内部\n该 live CD 是一个经过重制的 Ubuntu Linux live CD，它已过调整以包含以下组件：\n\n*   Ajax\
  \ Construction Kit 示例——书中描述的所有示例应用程序都包含在 live CD 中。\n*   Web 服务器——live CD 包含了 XAMPP\
  \ 服务器。只需点击一下，你就可以启动服务器，在本地计算机上或通过网络上的另一个浏览器尝试 Ajax 示例。\n*   工具——live CD 还包含 Firefox\
  \ Web 浏览器（用于显示示例）和 Bluefish 编辑器（用于修改代码）。由于该 CD 是一个功能完备的桌面级 live CD，还有其他命令行工具和应用程序供你使用。\n\
  *   文档——顶部面板中的链接让你能够访问实用的 Ajax、PHP 和 XAMPP 文档，以防你在处理代码时需要参考资料。\n\n将 Ajax Construction\
  \ Kit CD 作为 live CD 使用，意味着在重启 PC 后，你显示、使用和修改 Ajax 项目所需的所有软件都触手可用，无需任何特殊配置。然而，在你不愿意（或被允许）重启正在操作的\
  \ PC 的情况下，live CD 也提供了其他处理代码的方法。\n\n在 CD 上，我们包含了一个 XAMPP Web 服务器软件包版本，它可以轻松安装在 Windows\
  \ 系统上。按照使用该软件的说明并添加 CD 中的代码示例，你就可以从 Windows 桌面运行 Ajax 项目。CD 上包含了你所需的一切。（你只需要做一些额外的设置。）\n\
  \n\n\n\n\n此时，你应该能看到 Firefox 浏览器已打开到索引页，从该页面你可以运行书中的所有代码示例。Live CD 的 Ubuntu 桌面以及\
  \ Ajax 构建工具包组件如图 C.1 所示。\n\n##### 图 C.1. Live CD 能够方便地启动 XAMPP Web 服务器并探索 Ajax 示例应用程序。\n\
  \n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3bjczfhadbsav9pyx.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncgnzmghqmxauawlnys8-.jpg)\n\
  \n如果你想开始修改代码示例，请选择顶部面板中的 Bluefish 图标。Bluefish 编辑器（位于图 C.1 的右上角）在左列显示 Ajax 代码示例文件。你可以随意愿更改任何一个文件。然后通过重新加载页面，在\
  \ Firefox 浏览器中实时查看结果。\n\n除了 Bluefish 编辑器的图标外，顶部面板中还有其他有用图标。面板中的每个小书籍图标都代表指向不同支持信息的链接。它们包括指向\
  \ Ajax 及相关文档的链接，以及指向 XAMPP 服务器信息的链接。\n\n整个 XAMPP 服务器文件存储在 `/opt/lampp` 文件夹中。代码示例存储在\
  \ `/opt/lampp/htdocs` 文件夹中。对代码或服务器设置进行的任何想要保留的更改必须在关机之前保存（我稍后会讨论）。如果不保存这些文件，下次重启时，你的\
  \ live CD 系统的所有内容将恢复到原始状态。\n\n### 设置网络\n\n许多 Ajax 项目需要连接互联网才能正常工作。Linux 中的大多数有线以太网卡将被自动检测并配置。如果线路上可用\
  \ DHCP 服务器，你可能会自动连接并立即访问互联网。\n\n无线连接在 Linux 中可能更具挑战性。由于许多无线网卡需要制造商提供的专有固件，而这些固件无法合法地随\
  \ Linux 分发，因此这些无线网卡在 Linux 中可能需要一些额外工作才能运行。其他无线网卡则完全无法工作（尽管完全不支持的网卡数量在过去几年中已经减少）。\n\
  \n无论是有线还是无线，在 live CD 上尝试设置网络的第一地方是网络设置（Network Setup）窗口。从 live CD 桌面，选择系统（System）、管理（Administration）、网络（Networking）。该窗口会立即显示网络接口硬件是否已检测并配置运行。你可以对显示为可用的接口进行任何手动配置（例如，如果需要，设置静态\
  \ IP 地址）。\n\n如果网络设置窗口告诉你的无线网卡未配置，请打开一个终端（Terminal）窗口（从顶部面板中的终端图标打开）来做一些侦查工作。输入以下命令尝试确定你正在使用的无线网卡类型：\n\
  \n```\n$ lspci -v |grep -i wireless\n```\n\n执行命令后，你可能会看到类似的内容：\n\n```\n02:02.0 Network\
  \ controller: Intel Corporation PRO/Wireless\n2200BG Network Connection (rev 05)\n\
  ```\n\n在这个示例中，无线网卡是 Intel PRO/Wireless 2200BG 网卡。有了这些信息，去你最喜欢的搜索引擎（假设你有一台设备可以上网，或者可以临时连接到有线网络）搜索无线网卡型号和\
  \ Linux 单词（例如“Linux 2200BG”）。这个示例找到了 ipw2200 驱动项目。我将继续该示例。首先，我检查驱动是否已加载：\n\n```\n\
  $ lsmod |grep ipw2200\n```\n\n该命令的匹配结果显示驱动确实已加载：\n\n```\nipw2200     115652   0\n\
  ```\n\n如果驱动没有安装，我必须下载（或通过其他方式获取机器获取驱动），然后使用 `modprobe` 命令加载它（例如 `sudo modprobe ipw2200`）。接下来，我必须获取网卡所需的固件。许多无线网卡的驱动位于\
  \ `/lib/firmware` 文件夹中。\n\n### 备份你的数据\n\n正如我之前提到的，除非备份数据，否则你对 live CD 进行的任何更改都会消失。上述步骤也可以用于将你的项目文件和文件夹复制到另一台计算机（例如\
  \ Windows 机器）上进行处理或运行。如果是这种情况，你可能希望选择 `.zip` 等存档类型，以确保你可以在新系统上提取文件。\n\n#### 注意\n\
  \n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgvdgmuc9zagpwaw24) | 如果你想备份整个服务器（`/opt/lampp`），你可能需要从命令行执行，而不是存档管理器（Archive\
  \ Manager）窗口。这是因为你可能需要 root 权限来访问某些文件。这里有一个可以使用的命令将整个 XAMPP 服务器（包括 Ajax 项目）备份到你的\
  \ USB 磁盘。第二个命令允许你恢复它： \n\n```\n$ sudo tar cvfz /media/usbdisk/lampp-backup.tar.gz\
  \ /opt/lamp\n$ cd / ; sudo tar xvfz /media/usbdisk/lampp-backup.tar.gz\n``` |\n\n\
  ### 在 Windows PC 上直接运行 Live CD\n\n有些人可能希望不要重启电脑来尝试书中的示例。如果是你的这种情况，你可以在 Windows 系统上安装\
  \ XAMPP 服务器软件，并从那里尝试代码示例。你不会获得 live CD 提供的所有工具，但你可以在熟悉的 Windows 环境中工作。\n\n要在你的 Windows\
  \ 系统上安装并运行 XAMPP 服务器以及书中的代码示例，请执行以下操作：\n\n1.  从运行中的 Windows 系统中，插入随书附的 live CD。\n\
  \n2.  在资源管理器窗口中打开 live CD，并导航到 `\\Windows` 文件夹。\n\n\n\n\n\n3. 从 CD 的 `\\Windows`\
  \ 文件夹打开 XAMPP 安装程序 (`xampp-win32-1.6.0a-installer.exe`）并按照安装说明操作。它是为 Windows 2000、NT\
  \ 和 XP 专业版运行设计的。如果你需要帮助，请参考 Windows 版 XAMPP 常见问题解答（[www.apachefriends.org/en/faq-xampp-windows.html](http://www.apachefriends.org/en/faq-xampp-windows.html)）。\n\
  \n4. 如果你选择了所有默认选项，软件将解压，你最终会得到一个 XAMPP 控制面板桌面图标。打开该图标。\n\n5. 当 XAMPP 控制面板窗口出现时，选择\
  \ `Apache` 和 `MySql` 的 Start（启动）按钮。（如果 Windows 提示你解除阻止端口，如果你只想从桌面操作服务器，则无需解除阻止。）\n\
  \n6. 将你的 Ajax Construction Kit CD 插入光驱驱动器，并浏览到 Windows 文件夹（例如 `D:\\Windows`）。\n\n\
  7. 打开 `Examples` 文件夹，选择 `Edit`（编辑）、`Select All`（全选）和 `Copy`（复制）。使用你的资源管理器浏览到 XAMPP\
  \ 窗口上的 `htdocs` 文件夹。此文件夹位于你的硬盘上，路径类似于 `C:\\Program Files\\xampp\\htdocs`。然后选择 `Edit`（编辑，粘贴）。\n\
  \n8. 所有 Ajax 项目就绪后，你就可以开始使用了。从你机器上的任何 Web 浏览器，输入此 Web 地址来打开 Ajax Construction Kit\
  \ 示例：\n\n```\nhttp://localhost/index.html\n```\n\n你可以使用 Windows 系统上的任何文本编辑器或 Web\
  \ 内容管理工具开始处理 Ajax 项目。\n\n### 在 Mac PC 上直接运行 Live CD\n\n如果你有一台基于 Intel 的 Mac 电脑，可以直接运行\
  \ live CD。不过，你也可以选择使用内置的 Apache 软件从 Mac OS X 运行 Ajax 代码示例。\n\nlive CD 可以在较新的基于 Intel\
  \ 的 Mac 电脑（如 Mac Mini）上启动，并按照本附录早之前介绍的方法使用。插入 live CD，按住 `Alt` 键重启，并选择从 CD 启动。（它将被标记为\
  \ Windows CD。）你的有线以太网卡无需任何额外配置即可工作。然而，无线以太网卡可能无法在电脑 Linux 中工作。其他情况下，live CD 的运行将与在任何基于\
  \ Intel 的 PC 上一样。\n\n如果你倾向于在 Mac OS X 中原生运行运行代码示例，那么你很幸运了。新的 Mac 系统自带 Apache，因此你只需要进行一些配置，添加示例并启动服务器。操作方法如下：\n\
  \n1. 打开终端（Terminal）窗口，成为 root 用户 (`su -`)，并使用任何文本编辑器编辑 `/etc/httpd/httpd.conf` 文件。你需要搜索四行，并删除这些每行前面的注释字符（`#`），以便为你的\
  \ Apache 服务器启用 PHP 和 Perl。以下是取消注释后的行内容：\n\n```\nLoadModule perl_module  libexec/httpd/libperl.so\n\
  LoadModule php4_module  libexec/httpd/libphp4.so\nAddModule mod_perl.c\nAddModule\
  \ mod_php4.c\n```\n\n关闭终端窗口并返回 OS X 桌面。\n\n2. 插入 live CD，然后从 CD 中打开 Windows 的 `Examples`\
  \ 文件夹。你应该看到所有的 Ajax 代码示例文件和文件夹。\n\n3. 打开文件浏览器（选择 Macintosh HD 图标）并导航到你的主文件夹。从你的\
  \ `home` 文件夹打开 `Sites` 文件夹。\n\n4. 将 `Sites` 文件夹中现 `index.html` 文件重命名为其他名称（例如 `index-original.html`）。\n\
  \n5. 选择 `Examples` 文件夹中的所有内容，然后将这些内容拖放到你的 Sites 文件夹。\n\n6. 打开 `System Preferences`（系统偏好设置）文件夹并选择\
  \ `Sharing`（共享）文件夹（位于 Internet & Network 下）。\n\n7. 在共享窗口中，选择 `Personal Web Sharing`。这将启动\
  \ Apache Web 服务器并开始提供 Ajax 代码示例服务。\n\n8. 在共享窗口上，选择 \"...your personal website at...\"\
  \ 显示的链接，它看起来应该类似于：\n\n```\nhttp://10.0.0.1/~user\n```\n\n或者你可以在 Web 浏览器地址栏输入类似 `http://localhost/~user`（其中\
  \ `user` 替换为你的用户名）。\n\nAjax 代码示例将出现在浏览器窗口中，准备好运行。\n\n### 运行 live CD 的其他方法\n\n考虑到如今大量的开源和专有软件，人们已经开发了各种在不同环境中运行软件的方法。如果\
  \ live CD 和 Windows 的处理 Ajax Construction Kit CD 的方法不完全适合你，这里有其他你可以从该 CD 设置软件以配合本书使用的方法：\n\
  \n* **带有模拟器的 Windows 桌面**——使用虚拟化软件，如 `VMPlayer`（[www.vmware.com](http://www.vmware.com)）或\
  \ `QEMU`（[www.qemu.org](http://www.qemu.org)），你可以将 live CD 作为虚拟客户端运行。实际上，live CD\
  \ 将在你的 Windows 或 Linux 桌面的窗口中运行。\n* **你当前的 Web 服务器**——你可以将 CD 上 `/Windows/Examples`\
  \ 文件夹中的项目复制到你自己的 Web 服务器，并在那里运行代码。\n* **任何硬盘分区**——如果你在硬盘的 Windows 或 Linux 分区之外有可用空间，你可以将\
  \ live CD 的所有内容安装到电脑的硬盘上。除非你在现有磁盘分区之外有一些可用磁盘空间，或者你不介意清空电脑硬盘的内容，否则过程可能会有点复杂。这是因为你需要调整现有的磁盘分区来实现。\n\
  \n然而，一旦你有了可用磁盘或分区，实际安装 live CD 的过程非常简单。只需选择 live CD 桌面上的 `Install` 图标即可。安装程序将引导你完成\
  \ live CD 的安装过程，让你能够从硬盘处理其内容。\n* **任何 Linux 系统**——完整的 XAMPP 栈和 Ajax 示例包含在 CD 的一个\
  \ tar 包中（`/Linux/xampp-linux-1.6-Ajax.tar.gz`）。你可以将该包的内容解压到几乎任何未运行 Web 服务器的 Linux\
  \ 系统，并使用该系统的项目。作为 root 用户，插入 CD 后，以下命令会将包解压到你的 `/opt` 文件夹并启动服务器：\n\n```\n# cd /opt\
  \ ; tar xvfz /media/disk/Linux/xampp-linux-1.6-Ajax.tar.gz\n# /opt/lampp/lampp start\n\
  ```\n\n请记住 live CD 主要作为学习编写 Ajax 代码的教学工具。虽然 XAMPP 可以用作专业的 Web 服务器，但目前尚未配置配置安全性。在公共网络上使用示例代码或\
