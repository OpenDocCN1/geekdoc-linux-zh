  \ 方法之前调用。 |\n\n### `setRequestHeader()`\n\n```\nsetRequestHeader(label, value)\n\
  ```\n`setRequestHeader()` 方法用于向请求头添加标签/值值对。对于普通的 `GET` 请求，此方法不是必需的，但在进行 `POST` 请求时是至关重要的。例如，下面的头部设置让服务器知道\
