  \ 应用并不更快也不更慢。事实上，它们通常给人一种更快的印象，因为处理通常在你毫无察觉时就在后台进行。 |\n\n### Ajax、Sting 与异步性\n\n\
  1983 年，警察乐队（The Police）发布了专辑《Synchronicity》（同步性），该专辑售出了数百万份，并诞生了如《Every Breath You\
  \ Take》等热门单曲。我打赌斯汀（Sting）从未想过，几十年后他的专辑标题会成为众多技术书籍和文章中的反派。事实证明，同步性是 Web 用户界面的克星，因为它意味着一件事必须完成另一件事才能开始。在同步的\
  \ Web 页面中，在 `Task A` 完全完成之前，你无法启动 `Task B`，即使 `Task A` 需要花费一段时间。例如，一个同步的在线音乐服务不会在它忙于提供歌曲下载时允许你继续浏览音乐。\n\
  \n**注意**\n\n| ![image](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglzwovlmdoc29uy3a-.jpg)\
  \ | 斯汀可能从未将专辑《Synchronicity》与技术世界联系起来，是因为这张专辑实际上指的是由瑞士心理学家卡尔·荣格（Carl Jung）发展的一种心理学原理。在这种背景下，`Synchronicity`\
  \ 指的是“意义上的巧合”，例如当两个看似无关的事情发生时，它们之间的联系不仅仅仅仅是巧合。如果我解释技术计算机话题比解释心理学原理更擅长，请见谅。 |\n\n\
  另一个更贴合 `Ajax` 的例子是在线购物车中的运费，它通常是购物交易的关键部分，在某些情况下甚至可以决定一个物品是否值得购买。听听在网上买过汽车的人的话——运费可能会决定一笔网购的成败。问题在于，许多购物车的的设计是在计算并显示运费之前，先获取你的所有信息，在很多情况下还包括你的信用卡号。我不知道你们怎么想，但如果我还没有承诺购买，我绝不会输入我的信用卡号。\n\
  \n即使对于那些设计在结账流程早期计算运费的购物车，你仍然面临着服务器请求/响应的问题，这可能需要时间，并最终导致页面重新加载以便在页面上显示运费。在进行此服务器请求期间，订单输入用户界面实际上处于冻结状态，这并不是什么好事。如果运费能在你输入收货地址时无缝地计算并显示，那将要有意义得多。由于所购买的物品已经在购物车中，整个购物车应用程序只需要一个\
  \ `ZIP code` 就可以触发服务器请求并开始忙于计算费用。这一动作可以在你填写其他订单信息时在后台进行。与用餐示例类似，计算运费时涉及的等待几乎被消除了，因为在计算发生时，你可以被去做一些其他有用的事情。\n\
  \n### 重载，还是不重载\n\n正如我已经提到的，冻结的用户界面只是传统 Web 应用问题之一。方程式的另一端是：对于每一个服务器响应都必须重新加载页面。具体来说，当服务器从服务器传回运费时，页面必须重新加载以反映变化，因为服务器响应的是整个\
  \ Web 页面。任何基于服务器响应的页面更改都需要刷新页面。这是一个非常恼人的问题，不仅是因为页面重载/刷新需要时间，还因为页面在每次变化时实际上会闪烁。\n\
  \n\n\n\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 对于为整个 Web 应用版本号的观点存在广泛争议。要将这样一个迥异巨大的“大怪兽”归类到一个编号系统中是非常困难的，就像你无法将高速公路系统标记为 Autobahnahn\
  \ 3.0 一样。然而，Web 应用设计中存在离散的、演进的步骤这一观点是绝对正确的。所以，也许公路的类比并不那么遥远——将传统的 Web 应用想象成土路，而由\
  \ Ajax 驱动的 Web 应用则是沥油州际高速公路。 |\n\n此外还存在一个显著的效率问题：每次刷新页面都必须重新发送整个页面内容，即使只更新一小部分数据（例如，运费）。这是带宽的浪费，也是用户时间的浪费。这种类型的\
  \ Web 应用通常被被称为 Web 1.0 应用。`Ajax` 在引导新一代冠以 Web 2.0 名号的应用方面发挥着重要作用，这些应用“感觉”上更像真正的桌面应用程序。\n\
  \n`Ajax` 通过减少服务器请求和响应，使其仅包含所需的确切数据而非整个页面，从而解决了页面刷新的问题。在请求运费的情况下，服务器仅返回一个美元金额，在这种情况下，页面仅使用服务器数据更新页面的运费区域，然后计算购买的新总额。整个页面不需要重新发送，不需要刷新，也不会发生闪烁。插图\
  \ 1.2 Illust 明了 `Ajax` 如何改进运费计算过程。\n\n##### 图 1.2\\. `Ajax` 使得在不中断用户体验的情况下计算运费成为可能。\n\
  \n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmzwawlnywnhmc9rx2hzddfsmdjj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2cwl2suahnmmwkwyzi-.jpg)\n\
  \n### Ajax 到底是什么？\n\n到目前为止，我一直克制详细说明 `Ajax` 是什么的冲动，因为让你理解它能做什么要重要得多。如果你不理解它解决的问题类型，那么说\
  \ `Ajax` 是一项涉及 `JavaScript` 和 `XML` 结合的编程技术是没有意义的。希望基础工作已经做得很充分，让你现在对 `Ajax` 解决的问题有了基本的掌握。\n\
  \n那么，`Ajax` 是什么？`Ajax` 是一种特定的 Web 开发方法，涉及 `JavaScript` 的使用，并且经常使用 `XML`。仅此而已。它不是什么花哨的浏览器插件或时尚的新编程语言。它只是一种涉及已存在已久的编程技术。\n\
  \n`Ajax` 真正的力量是一个单一的 `JavaScript` 对象，它使得与 Web 服务器进行异步通信成为可能。在传统的 Web 应用中，浏览器本身通常是与通信通信的手段，更重要的是，它一次处理一个\
  \ Web 页面。`Ajax` 引入了使用 `JavaScript` 与服务器通信的概念。在后台仍然是浏览器在做工作，但最终效果是你的 `JavaScript`\
  \ 代码能够与 Web 服务器进行对话，发送并接收离散的数据片段。这种通信是异步进行的，这意味着它在后台发生，而不会中断任何其他操作。\n\n目前，你不需要了解关于使\
  \ `Ajax` 可能可能的 `JavaScript` 对象的任何细节，并不重要。下一章将详细介绍 `Ajax` 的内部构造以及如何组装 `Ajax` 代码。\n\
  \n#### 注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 请记住，这本书的重点是为你提供一个即插即用的 `Ajax` 框架，以最大限度地减少代码开发。你只需要对 `Ajax` 代码及其工作原理有少少了解，就能复用书中的代码。不仅如此，你还可以使用附带的实时\
  \ Linux CD 直接在你的 PC 上对许多示例进行实验。 |\n\n### 现实世界中的 Ajax\n\n这本书本质上是非交互的，我可以证明这一点。用你的手指点击这里，你就会明白我的意思。看，没有出现新页面。由于打印页面是相当静态的，我鼓励你花几时间在线摆玩一些真实的\
  \ `Ajax` 应用，以感受它们与传统 Web 应用相比如何。接下来的几节介绍了一些流行且引人入胜的 `Ajax` 应用，并帮助你关注那些最从 `Ajax`\
  \ 中受益的特定功能：\n\n*   Google Suggest\n*   Netflix\n*   Flickr\n*   Google Maps\n\n\
  由于你可能已经在使用这些一些 Web 应用，所以当你发现 `Ajax` 如何让特定功能成为可能时，会更具洞察力。在这次小小的现实世界之旅之后，你将在附带的实时\
  \ Linux CD 提供的真实 `Ajax` 应用背景下，重新审视运费计算器示例。\n\n### Google Suggest\n\n`Google Suggest`\
  \ ([`labs.google.com/suggest/`](http://labs.google.com/suggest/)) 是一个相对简单的 `Ajax`\
  \ 应用的极佳例子，它在背后异常强大。事实证明，“异常强大”是你探索 `Ajax` 及其各种可能性时经常想到的词。`Google Suggest` 是普通的谷歌搜索引擎，但带有建议性的文本输入功能，根据实际搜索数据帮助你缩小搜索范围。\n\
  \n当你在 `Google Suggest` 中输入短语时，会立即出现一个匹配下拉列表。要接受这些建议的短语之一，只需用鼠标点击它。让这个 `Ajax` 应用如此酷的地方在于，每个可能的匹配项旁边都列出了数量。换句话说，你被提供了关于特定搜索词受欢迎的直接线索。\n\
  \n当你尝试 `Google Suggest` 时，从开发角度需要注意的关键点是，每输入一个字符，它都会无缝地与服务器进行往返通信。想想这很不起。多么响应式用户界面！这正是\
  \ `Ajax` 旨在赋予现代 Web 应用的“感觉”。第六章](#ch06.html_ch06)通过自动补全读取用户心思”将重新回顾 `Google Suggest`，向你展示如何使用\
  \ `Ajax` 实现自己的“自动补全”功能。但不要等到第六章，现在就去尝试 Google Suggest 吧。\n\n### Netflix\n\n你可能已经沉浸在\
  \ `Ajax` 舒适的光芒中而却完全不知道。如果你使用 `Netflix` ([`www.netflix.com/`](http://www.netflix.com/))\
  \ 租电影，那么你已经是一个 `Ajax` 老手了，至少在用户端是如此。`Netflix` 使用 `Ajax` 实现一种流行的技巧：当鼠标指针悬停在某些信息上（在本例中是电影图标）时，会自动弹出一个窗口。\n\
  \n如果你只需鼠标悬停在电影的小图标上，就会弹出一个带有完整电影描述和相关电影信息的弹出窗口。所有这些电影数据都在悬停开始时，通过 `Ajax` 从服务器获取。从用户的角度来看，这一切都是顺理成章，因为在结束（弹出窗口出现）之前，你甚至没有意识到正在进行服务器通信。再次，`Ajax`\
  \ 以完全无的方式增加了一项重大的可用性功能。\n\n\n\n\n\n使用 Ajax 制作弹出窗口时，一个有趣的现象是：当鼠标指针移离开目标电影时，Netflix\
  \ 的弹出窗会自动消失。这有助于提升用户的感知，让他们认为弹出窗纯粹是提供信息的，而不是那种你必须点击才能消除的烦人广告弹——对于 Netflix 来说，这些弹出窗确实是用户界面的非常受欢迎的补充。即使你没有\
  \ Netflix 账号，也可以在 Netflix 上体验 Ajax——只需访问 [`www.netflix.com/`](http://www.netflix.com/)\
  \ 并点击“Browse Selection”（浏览选择），找到一些电影进行悬停操作即可。顺便提一下，你可以在第 9 章“使用精美弹出窗口展示信息”（Presenting\
  \ Information with Slick Popups）中学习如何在自己的页面中注入信息弹出窗口。\n\n## Note\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc19lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 关于 Ajax 显示弹出窗口另一个有趣用法，请查看 [`www.theinvisiblead.com/`](http://www.theinvisiblead.com/)\
  \ 上的 Invisible Ad 广告服务。这是一个非常不规的广告概念，涉及一个巨大的小方块网格，你必须将鼠标悬停在上面才能看到广告。这种广告被称为像素广告（pixel\
  \ ads），因为你实际上是为屏幕上的每个像素广告空间付费。突破性的？愚蠢的？由你来判断吧！ |\n\n### Flickr\n\n毫无疑问，这是到目前为止我最喜欢的商业\
  \ Ajax 应用，Flickr ([`www.flickr.com/`](http://www.flickr.com/)) 将 Ajax 发挥到了极致。如果你不熟悉它，Flickr\
  \ 是一个在线照片共享社区。Flickr 之所以如此独特，在于它如此彻底地使用 Ajax，使其具有桌面应用程序的感觉。在 Flickr 中，极少有任务需要刷新页面，或者让你在服务器请求/响应期间无所事事。图\
  \ 1.3 显示了得益于大量 Ajax 的使用，在 Flickr 中编辑照片说明是多么的直观。\n\n### 图 1.3. 编辑 Flickr 照片标题是“原地”完成的且无需任何页面刷新，即使在保存修改后的标题时也是。\n\
  \n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc19lown0mg04as9wlmdwcglqywnhmc9rx2hzddfsmdvj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc19lown0mg04as9wcglhy2owl2suahnnmxawyzuzu-.jpg)\n\
  \n该图显示了我照片集中的一张照片，正在编辑其标题。需要理解的是，当我点击照片标题时，编辑字段及其关联的“保存”和“取消”按钮会自动出现。更改标题后，你只需点击“保存”按钮，更改就会提交到服务器。无需等待新页面打开，没有确认对话框，什么都没有。标题直接从编辑模式变回静态文本。正如我之前提到的，当你考虑到\
  \ Ajax 如何让标题编辑任务变得如此利落时，就会联想到“出奇强大”这个词。\n\nFlickr 对 Ajax 的使用并不仅止于照片标题编辑。Ajax 有各种巧妙的方式渗透到\
  \ Flickr 的用户界面中。我可以多花几页的内容把这些细节喂给你们，也可以直接让你们自己去尝试。你需要创建一个免费的 Flickr 账号才能真正体验该用户界面，但这只需要几个简单的步骤。你可以从\
  \ [`www.flickr.com/`](http://www.flickr.com/) 开始。\n\n### Google Maps\n\n我必须承认，将\
  \ Flickr 封为我最喜欢的商业 Ajax 应用让我有点心疼，因为还有另一个让我魂牵梦萦。我说的是 Google Maps ([`maps.google.com/`](http://maps.google.com/))，在许多方面都是\
  \ Ajax 应用的鼻祖。就在几年前，全球的 Web 开发者还在苦思冥想 Google Maps 是如何做到它所做的事情，而且速度如此快。事实证明，Google\
  \ Maps 兜里的秘诀过去是、现在也是 Ajax。在我看来，Google Maps 仍然是后台处理数据以改善用户体验的终极示例。\n\nGoogle Maps\
  \ 采用的主要技巧是在需要之前不断预测并加载地图数据。换句话说，Google Maps 并不关心你正在查看地图的哪个部分，而是关心你将要查看哪个部分。安全的猜测包括当前查看区域周围的，以及当前区域的放大和缩小版本。事实证明，Google\
  \ Maps 加载数据的速度通常比用户处理的速度快。因此，当你准备探索地图的不同部分时，Google Maps 已经领先于你并预加载了地图数据。最终效果是一个响应速度极其惊快的用户界面，如果没有\
  \ Ajax 在后台加载地图数据方面的帮助，这是不可能的。\n\n当涉及到用自己的信息自定义地图时，Ajax 也进入了 Google Maps。Google 发布了一个特殊的\
  \ API（应用程序接口）来与 Google Maps 交互，它完全基于 Ajax。例如，你可以创建自己的自定义标记（大头针）放置在地图位置，甚至可以将它们链接到自定义弹出窗，显示有关该位置的附加信息。\n\
  \n### Ajax 并非万能\n\n我猜这段对真实世界 Ajax 应用的简要介绍让你对在自己的页面中注入 Ajax 感到兴奋。这是好事。然而，我必须警告你，Ajax\
  \ 并不是一种万能的解决方案。像生活中的大多数事情一样，适度使用可以极大获得 Ajax 的益处。\n\n在本章前面，你已经了解了 Ajax 解决的主要问题。从这些问题反推，可以列出一个\
  \ Ajax 很有意义的场景列表。通过分析这个场景列表，也可以判断 Ajax 何时不是理想解决方案。将此列表作为基础，尝试判断 Ajax 是否真的能帮助你的 Web\
  \ 页面。请理解，该列表并非涵盖所有情况，更多是作为一个通用的指南。如下：\n\n*   首先，Ajax 涉及服务器通信，更具体地说，是数据从服务器流到客户端浏览器。如果你的\
  \ Web 页面由于某种原因不访问 Web 服务器，那么使用 Ajax 就没有意义。你完全可以使用 JavaScript 让页面更具交互性，但 Ajax 并非严格必须。\n\
  \n*   Ajax 的关键点之一是在不需要刷新/重新加载的情况下更新页面。如果你的应用程序本质上需要打开新页面（例如一系列离散页面中指向新页面的链接），那么\
  \ Ajax 可能不是答案。另一方面，也许你可以将几个页面合并到一个不需要重新加载的 Ajax 驱动的页面中。\n\n\n\n\n\n*   Ajax 的另一个关键点是异步通信，这是\
  \ Ajax 在后台传输数据的方式，从而允许其他操作在前台进行。如果你的应用程序特别需要执行某件事之前先执行另一件事，那么 Ajax 可能不是一个好主意。也许在进一步操作之前，必须对某块用户输入数据进行验证，在这种情况下，你可能真的需要打开新页面或在数据验证时让用户等待。无论哪种，Ajax\
  \ 并没有真正提供帮助。\n\n我在这里想说明的观点是，Ajax 使用得当非常强大，但知道何时使用它至关重要。前面的三点可以作为评估在你的应用程序中引入 Ajax\
  \ 是否有意义的指南。此外，你在本书剩余部分中探索的示例将为你为 Ajax 何时以及如何进入你的 Web 页面提供更多线索。\n\n### 重新审视运费计算器\n\
  \n在本章的开头，我重点强调了在在线购物车中，如果必须先披露财务信息或通过一系列 Web 页面才能知道运费是多么令人恼恼。我论证了 Ajax 如何通过改善这种情况：当你输入订单邮寄地的邮政编码后，它可以在后台从服务器获取运费。这样你就可以继续输入订单信息，而无需等待服务器或被页面重载所中断。图\
  \ 1.4 显示了在输入邮寄邮政编码之前这样的购物车可能的样子。\n\n#### 图 1.4.任何在线购物车的结账过程都包括收集运费信息并显示总额。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddfsmddj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnmxawyzc-.jpg)\n\
  \n在这个示例中，结算过程已经进展到选择购买商品的一步；剩下的就是获取运费信息、计算总额并完成支付。这个特定的示例并没有停止完成支付，而是侧重于简化运费的检索，并根据这些费用计算结算总额。\n\
  \n有了 Ajax 的加入，一旦输入邮政编码，就可以直接从运输提供商的服务器（在本例中为美国邮政局 USPS）获取运费。图 1.5 显示了部分输入邮政编码的订单输入页面。注意，此时运费尚未获取，因为我仍在输入邮政编码。\n\
  \n#### 图 1.5. 在输入邮政编码时什么都不会发生，因为你需要完整的邮政编码来请求运费。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddfsmdhj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnmxawyzg-.jpg)\n\
  \n**注**\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | USPS Web Tools API 允许通过 Ajax 获取运费，它还支持运费信息的验证。例如，你可以使用 USPS 服务器根据邮政编码查找城市和州，从而将订单输入提升到全新的水平，消除两项用户输入的信息。在第\
  \ 11 章“构建 Ajax 运费计算器”中，当我们真实的 Ajax 应用背景下更详细地分析运费计算器示例时，你会学更多关于 USPS Web Tools API\
  \ 的知识。 |\n\n一旦完全输入并移动用户界面中的下一个字段（电话号码），运费就会神奇地出现并计算出结算总额（见图 1.6）。该运费是在后台直接从美国邮政局服务器获取的，然后反映在页面上，没有任何明显的延迟或页面中断。\n\
  \n#### 图 1.6. 运费在后台被检索，结算总额被计算，且不受干扰。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddfsmdlj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnmxawyzk-.jpg)\n\
  \n即使 USPS 服务器返回运费时花了很长时间，用户体验也不会受到太大影响，因为用户可以继续输入信息。此外，邮政编码的任何更改都会导致新的服务器请求和新的运费。不仅如此，特定的\
  \ USPS 运输服务（包裹邮政、优先邮件等）也可以被更改，这也会导致检索到新的运费。\n\n这个 Ajax 示例中的最后一个小技巧在你输入一个不支持的邮政编码时显露出来。也许特定物品无法寄到某些地区——或者在本示例中，你为了测试限制了邮政编码。无论动机如何，如果邮政编码没有产生有效的运费，邮政编码旁边就会显示错误提示，如图\
  \ 1.7 所示。\n\n#### 图 1.7. 如果输入的无效的邮政编码，邮政编码旁边会出现一个错误消息。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhms9rx2hzddfsmj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2oxza)\n\
  \n### 总结\n\n我在本章最后不想做的是长篇大论地总结 Ajax 是如何产生的以及是谁实现了它。我意识到你购买这本书的动力是想用它做一些酷东西，而这无疑是长期以来进入\
  \ Web 世界最酷的编程技术之一。本章的目标是让你熟悉 Ajax 能做什么，以及为什么它对你现在的应用程序和 Web 的未来都具有重要意义。\n\n任何为 Web\
  \ 开发应用程序的人都应该考虑如何让自己的应用程序更好：更具交互性、更直观，并且不像旧的 Web。我们正站在一个令人兴奋的新 Web 的边缘，它有潜力消除 Web\
  \ 应用和桌面应用之间的界限。想想，这种区别为什么要重要呢？应用程序只是用计算机做某些有用或有趣的事情的方法，而 Ajax 是一个可以让许多在线应用程序变得好很多的工具。本书的其余部分将向你展示具体如何使用\
  \ Ajax 让你的应用程序更好。\n\n## 第 2 章 Ajax 应用程序内部\n\n公洋上的 Ajax\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 多年来，美国海军有多几艘船命名为 Ajax，第一艘 USS Ajax 于 1864 年下水。最近的 USS Ajax 是一艘曾在二战和越南战争中服役过的修理舰，最终于\
  \ 1986 年退役。 |\n\n\n\n\n\n如果说我最讨厌的一件事，那就是那些前五章都在为后续内容铺垫工作的计算机书籍。太多的书感觉它们必须教你每样一点，而不是专注于当前的主题。因此，在本章的开头，我们只需要进行稍微的准备工作，然后直接切入\
  \ `Ajax` 的核心。如果你觉得需要温习一下 `HTML` 和 `CSS`，或者你可能认为一个快速的 `JavaScript` 或 `XML` 教程会有帮助，那么请务必休息一下去复习它们。只是不要指望我在我们要处理\
  \ `Ajax` 事务时，浪费你的整个下午时间来手把手地教你这些话题。\n\n我并不是想吓跑你；我只是想激发你的热情，让你投入到购买这本书是为了学习的酷内容中。在本章结束时，你将完成第一个功能完整的\
  \ `Ajax` 应用程序。不仅如此，你还将非常熟悉如何自定义该应用程序，让它执行那些可能从未被设计过要做的功能。这是一好事。即兴发挥，发明；这就是这里的精神。现在，让我们开始吧！\n\
  \n本章中的 `Booker` 使用了以下文件，它们位于随书提供的 Live Linux 光盘中 `chap02` 示例代码目录下：\n\n* `booker.html`—主\
  \ 页面\n* `ajaxkit.js`—`Ajax` Toolkit 的核心 `Ajax` 函数\n* `domkit.js`—`Ajax` Toolkit\
  \ 的 `DOM` 相关函数\n* `book_alicewonderland.xml`—《爱丽丝仙仙游》`XML` 电子书\n* `book_frankenstein.xml`—《弗兰肯斯坦》`XML`\
  \ 电子书\n* `book_mobydick.xml`—《摩比迪克》`XML` 电子书\n* `book_warandpeace.xml`—《战争与和平》`XML`\
  \ 电子书\n* `book_warofworlds`—《世界大战》`XML` 电子书\n\n### Ajax 的基础\n\n你可能已经感觉到，`Ajax` 并不是单一技术，而是其他技术的特定应用。了解这些其他技术在\
  \ `Ajax` 应用程序中是如何结合的，对于理解如何构建和修改自己的 `Ajax` 应用程序非常重要。因此，让我们探索让 `Ajax` 运行的组件技术。图 2.1\
  \ 显示了主要的 `Ajax` 技术在典型的 `Ajax` 应用程序中是如何结合的。\n\n#### 图 2.1. HTML、CSS、JavaScript、XML\
  \ 以及像 PHP 这样的服务器程序共同工作，协调 Ajax 请求和响应。\n\n![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawcwl2cuahnmmmkwyze-.jpg)\n\
  \n注意图中，`Ajax` 请求/响应过程是以顺序的方式展开的，从数字 `1` 到 `3` 可而易见。在接下来的几节中学习更多不同 `Ajax` 组件如何结合时，请记住这张图。\n\
  \n#### HTML 和 CSS\n\n如果没有一点 `HTML`，创建任何 Web 页面都是困难的，因为它是 Web 的语言。在 `Ajax` 应用程序中，`HTML`\
  \ 仍然作为内容的结构部分，例如文本、图像、表单字段等。事实上，`Ajax` 应用程序中的大多数 `HTML` 代码并没有特别之处——有趣的内容主要发生在 `JavaScript`\
  \ 代码中，我稍后就会介绍。\n\n如果你在过去几年里做过任何 Web 页面创建，你可能已经理解层级样式表 (`CSS`) 以及它们对于创建具有视觉吸引力的 Web\
  \ 页面有多重要。`CSS` 允许将 Web 页面的外观与其结构清晰地分离，结果是页面更容易维护，更不用说更漂亮了。`CSS` 进入 `Ajax` 领域是因为它为你提供了一种应用样式来动态更改\
  \ `HTML` 内容的外观和感受的方法。例如，当通过 `Ajax` 请求对数据库进行数据验证时，你可能希望高亮显示无效的数据输入字段。此示例中的高亮将通过 `CSS`\
  \ 在 `HTML` 表单元素上实现。\n\n#### JavaScript\n\n`JavaScript` 在 `Ajax` 中的工作是协调方程客户端侧的一切，这包括必须由浏览器执行的任何逻辑。不要忘记，`Ajax`\
  \ 的本质是客户端（浏览器）和服务器（Web 服务器）之间的数据交换，因此在设计和构建 `Ajax` 应用程序时，你始终从客户端/服务器通信的角度考虑。`JavaScript`\
  \ 代码运行在浏览器上，用于启动 `Ajax` 请求并处理服务器返回的结果数据。\n\n你使用 `JavaScript` 将用户数据打包发送到服务器，同时接收服务器的响应并以有意义的方式呈现给用户。当然，这意味着\
  \ `HTML` 和 `CSS` 在 `Ajax` 应用程序的 `JavaScript` 代码中占很大权重，`JavaScript` 经常利用文档对象模型 (`DOM`)\
  \ 根据 `Ajax` 响应动态更改 `HTML` 元素。图 2.1 中的虚线表示 `JavaScript` 利用 `DOM` 动态更改 `HTML` 和 `CSS`\
  \ 代码的能力。\n\n**注意**\n\n我们并不要求你理解如何编写 `JavaScript` 就能在自己的 Web 页面中重用书中的示例。然而，如果不深入研究\
  \ `JavaScript` 代码，就不可能从任何深度探索 `Ajax`，因此如果你计划将示例代码提升到另一个水平，那么粗略了解 `JavaScript` 是重要的。\n\
  \n#### XML 和 Ajax 数据\n\n好了，现在你知道 `Ajax` Web 页面仍然由 `HTML` 和 `CSS` 组成，并且可以使用管理 `Ajax`\
  \ 请求和响应的巧妙 `JavaScript` 代码进行动态调整。我还没有解释在 `Ajax` 请求/响应序列中在客户端和服务器之间发送的数据性质。部分原因之一是因为\
  \ `Ajax` 事务中的数据格式并不是一成不变的。你可以自由使用多种数据格式来适应每个应用的特定需求。换句话说，你可以为每个 `Ajax` 应用程序专门定制数据表示形式。\n\
  \n使用 `Ajax` 的有力理由之一是利用 `XML` 数据标准，它提供了一种高度结构化的信息组织方式。`XML` 特别擅长表示难以表示复杂数据，例如具有多级嵌套数据的层次数据库。`Ajax`\
  \ 在请求/响应方程的两端完全支持 `XML`，这意味着你可以以 `XML` 发送和/接收数据。\n\n虽然 `XML` 是非常好的东西，但它并不是每个 `Ajax`\
  \ 问题的神奇解决方案。事实上，使用原始文本数据作为 `Ajax` 数据交换的格式完全可以接受，在许多情况下也是理想的。例如，通过简单的名称/值对（如你在 URL\
  \ 中经常看到）将数据传递给服务器非常简洁，如下：\n\n```\nfname=Michael&lname=Morrison\n```\n\n与 `XML` 结构化的相同信息进行对比：\n\
  \n```\n<fname>Michael</fname>\n<lname>Morrison</lname>\n```\n\n在这种情况下，URL 名称/值版本的数据要有效得多，因为数据非常简单。\n\
  \n底线是，在 `Ajax` 应用程序中传输的数据格式完全取决于应用程序的特定需求。在整书中你将遇到使用多种不同数据类型的应用程序，包括原始文本、`XML` 和另一种被称为\
  \ `JSON`（JavaScript 对象表示）的类型。\n\n#### PHP 和服务器\n\n`Ajax` 经常被初学者误解的一个方面是，它完全依赖于服务器程序接受请求并以某种方式响应。服务器程序是熟悉的“异步\
  \ JavaScript + XML”配方中隐藏的成分，这个配方通常与术语 `Ajax` 联系在一起。在实践层面，这意味着你不能只用一些 `JavaScript`\
  \ 代码组装 Web 页面就造出一个 `Ajax` 应用程序——必须有一个服务器端组件来响应客户端的请求。\n\n\n\n\n\n服务器程序在 Ajax 应用中的作用完全取决于每个具体的\
  \ Ajax 应用，但总而言之，你会发现大多数 Ajax 服务器程序负责查找某些信息并将其返回给客户端。例如，一个 Ajax 员工目录应用程序可以将员工 ID\
  \ 传递给服务器，在这种情况下，服务器程序会在数据库中查找该 ID 并返回员工的姓名和联系信息。或者，正如你在上一章中思考的示例那样，可能会将待运物品的信息传递给服务器，然后服务器查找运费并返回。\n\
  \n与 Ajax 应用的客户端（这完全是 `JavaScript` 的专属领地）不同，服务器端在创建服务器程序时使用何种编程语言方面几乎是完全开放的。幸运的是，有一些被广泛支持且相对易于修改和使用的流行选项。其中一个选项就是\
  \ `PHP`，它是一种非常流行的服务器脚本语言，在创建 Ajax 应用时非常方便。与运行在浏览器上的 `JavaScript` 代码类似，`PHP` 代码运行在服务器上。再次参考图\
  \ 2.1，你可以看到位于服务器上的 `PHP` 程序如何接收来自浏览器的 Ajax 请求（多亏于 `JavaScript`），并在处理请求后做出响应。\n\n\
  `PHP` 代码（以及所有服务器端脚本）的有趣之处在于，它们最终都会将数据传回客户端。在使用 `PHP` 时，你必须始终记住，无论你在做什么，最终结果都将是数据传回浏览器。在\
  \ Ajax 应用中，`PHP` 脚本正在将数据传回给 Ajax 请求。\n\n## 第 2 章：Ajax 内部机制\n\n### 大洋上的 Ajax\n\n\
