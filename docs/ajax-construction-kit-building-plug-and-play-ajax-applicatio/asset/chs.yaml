  \ Ajax 请求。\n\n本章中的 Imaginator 使用了以下文件，它们位于随书附赠 Linux 光盘的 `chap08` 示例代码文件夹中：\n\n\
  * `imaginator.html`——主 Web 页面\n* `smokiesXX.jpg`——一系列烟雾山（Smoky Mountain）示例图片\n*\
  \ `smokiesXX_thumb.jpg`——一系列烟雾山示例图片的缩略图\n* `domkit.js`——Ajax Toolkit 中与 DOM 相关的函数\n\
  * `modalimgkit.js`——Ajax Toolkit 中与模态图片相关的函数\n* `modalimgkit.css`——模态图片的样式表\n* `modalimgkit_wait.gif`——在加载模态图片时显示的动画“加载中”图标\n\
  * `modalimgkit_gray.png`——在在前层查看模态图片时显示在背景页面上的透明灰色图片\n\n## 挑战：动态加载图片\n\nWeb 页面通常处理缩略图的方式存在一个固有的问题。问题的根源在于你必须通过链接发起一个完整的\
  \ HTTP 请求才能查看全尺寸图片。这意味着图片的加载方式就像是另一个 Web 页面一样，也就是说浏览器会离开带有缩略图的页面跳转到一个包含图片的新“页面”。如果你正在使用缓慢的互联网连接，或者正在查看一张特别大的图片，等待图片加载的时间可能会让你感到困惑，因为没有视觉提示显示图片正在加载，除非你把浏览器冻结视为一种提示。\n\
  \n次要问题是，你必须点击“返回”按钮才能回到带有缩略图的原始页面。这很重要，因为浏览器上的“前进”和“返回”按钮的意图是让你在不同的页面之间切换。换句话说，通过链接离开一个页面应该带你去完全不同的地方，而不仅仅是提供页面上已存在内容的不同视图。全尺寸图片的视图并不构成“新”内容，这就是为什么我非常反感必须向前进查看图片，然后向返回回到原始页面的想法。\n\
  \n那么 Ajax 能帮助解决这个问题吗？并不真的。Ajax 在这种场景下的问题在于，它是基于向服务器查询文本数据的概念设计的。正如你可能已经意识到的，图片是二进制数据，而不是文本。如果你对这种区别好奇，试着将一张图片拖放到你最喜欢的文本编辑器中。你会看到一堆毫无意义的乱码字符，因为图片格式并不是为文本表示设计的。因此，尝试通过\
  \ Ajax 请求图片会遇到很多严重的问题。\n\n我们已经确定 Ajax 不能通过请求动态加载图片，这很遗憾，因为这本可以解决整个“加载新页面来查看图片”的困境。但并不意味着我们没有选择了。事实上，标准\
  \ JavaScript `Image` 对象中的一种机制使得在不发布任何 Ajax 请求的情况下实现 Ajax 的通用效果成为可能。我指的是 `Image`\
  \ 对象中的 `onload` 事件，它在图片加载完成时通知你。这个事件在许多方面的工作原理类似于 Ajax 请求，因为它在图片加载完成时会发出一个通知。\n\n\
  `Image` 对象的另一个辅助 `onload` 事件处理程序的组件是 `complete` 成员变量，它是一个布尔值（`true`/`false`）数据，可以让你知道图片是否已完成加载。当与\
  \ `onload` 事件处理器结合时，`complete` 成员变量为你提供了构建一个“Ajax”图片查看器所需的所有内容。\n\n虽然我确定你可能会喜欢对\
  \ `onload` 事件处理器和 `complete` 成员变量进行迷人的深入讨论（特别是如果你不是 JavaScript 高手的话），但我将免除你的痛苦。相反，我乐意分享的是，我已经编写了一些\
  \ JavaScript 代码，可以让你几乎不需要任何工作就能将流畅的图片查看器注入到你的页面中。说真的，你会对本章示例的极端简单感到惊讶的。\n\n支持图片查看器的代码是\
  \ `modalimgkit.js` 文件的一部分，该文件包含在随书光光的 Ajax Toolkit 中，也是 Imaginator 示例应用程序源代码文件的一部分。正如最初在第\
  \ 2 章“Ajax 应用程序内部”中提到的那样，`modal.js` 文件提供了一个 JavaScript 函数，可以用它自动将整个页面的图片链接转换为 Ajax\
  \ 风格的图片查看器链接。这个函数称为 `initModal()`，它必须在包含图片链接的页面 body 的 `onload` 事件处理器中调用。\n\n\n\n\
