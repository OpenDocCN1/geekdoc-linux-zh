  \ XML 电子书，章节是更好的选择。 |\n\n在我们进入新的电子书阅读器应用的设计阶段之前，值得稍微后退一步，重新评估原始的 Booker 应用并查看它是如何工作的。通过这样做，你将对设计新应用时面临的挑战有一个更准确的认识。\n\
