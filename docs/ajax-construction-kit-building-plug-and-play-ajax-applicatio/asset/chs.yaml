  \ style=\"margin-left:10%\">Select book:\n    <select id=\"book\"\n      onchange=\"\
  loadChapter(this.options[\n      this.selectedIndex].value, 0)\">\n      <option\
  \ value=\"alicewonderland\">Alice's Adventure's in\n        Wonderland by Lewis\
  \ Carroll</option>\n      <option value=\"frankenstein\">Frankenstein by Mary\n\
