  button\" value=\"<<\"\n      style=\"width:60px\"\n      onclick=\"curchapIndex\
  \ = 1; prevChapter()\" />\n    <input id=\"prevButton\" type=\"button\"\n      value=\"\
  < Previous\" style=\"width:120px\"\n      onclick=\"prevChapter()\" />\n  </div>\n\
  \  <br />\n  <div id=\"chaptext\"\n    style=\"margin-left:10%; margin-right:10%;\
  \ padding:2%;\n    background:#FFFFFF; border:thin solid #333333\"></div>\n  <br\
  \ />\n  <div style=\"margin-left:10%\">\n    <input id=\"nextButton\" type=\"button\"\
  \ value=\"Next >\"\n      style=\"width:120px\" onclick=\"nextChapter()\"   />\n\
  \    <input id=\"endButton\" type=\"button\" value=\">>\"\n      style=\"width:60px\"\
  \n      onclick=\"curchapIndex = (totalChapters - 2);\n      nextChapter()\" />\n\
  \  </div>\n</body> \n```\n\n再次，我意识到对于一本声称不需要了解任何 JavaScript 的书来说，这段代码确实包含了大量的 JavaScript。但请记住，重点在于让你能够将此代码复用到自己的应用程序中。在你不一定理解每行代码如何工作的情况下，这是完全可能的。尽管如此，对发生的情况勾勒出一个大致的画面，以便你对如何进行修改有一定的见解。不要忘记，所有这些代码（以及本部分的剩余代码）都位于随书提供的实时\
  \ Linux CD 中的 `booker.html` 文件中。\n\n### 用户界面结构\n\n首先，用户界面由几个 `div` 元素组织，这些元素为清晰地组织章节信息和导航按钮提供了良好的手段。与应用程序的上一个类似，包含电子书的选择列表是使用\
  \ HTML 中的 `<select>` 标签编写的。此版本中更有趣的是导航按钮，它们是用 `<input>` 标签编写的。\n\n### 导航逻辑\n\n“上一页”和“下一页”导航按钮的功能是通过调用\
  \ `prevChapter()` 和 `nextChapter()` JavaScript 函数实现的，你稍后就会看到它们。首页（`<<`）和末（`>>`）按钮也使用了这些函数，但通过\
  \ `curChapIndex` 变量的帮助，该变量跟踪当前的章节索引。当你进入应用程序的 JavaScript 代码时，就会看到这个变量是如何工作的。\n\n\
  Booker Web 页面主体中另一个非常重要的代码段是根据选择列表的变化来加载电子书的代码：\n\n```javascript\nloadChapter(this.options[this.selectedIndex].value,\
  \ 0)\n```\n\n这段代码与应用程序上一个版本的选择更改代码相同，不同在于这段代码在传递当前选择电子书（`this.options[this.selectedIndex].value`）的同时，还传递了章节索引（`0`）。函数名也从\
  \ `loadBook()` 更改为 `loadChapter()`，以指示加载的是单个章节。在 `<body>` 标签的 `onload` 事件处理器中也发生了对\
  \ `loadChapter()` 函数的类似调用，它负责在页面首次打开时加载列表中第一本电子书的第一章。\n\n### loadChapter 函数\n\n\
  这里是 `loadChapter()` 函数的代码，它通过 Ajax 请求根据简写的电子书标题和章节索引加载单个章节：\n\n```javascript\nfunction\
  \ loadChapter(title, chapIndex) {\n  // 可能是一本新书，所以初始化导航按钮\n  if (chapIndex == 0)\
  \ {\n    document.getElementById(\"homeButton\").disabled = true;\n    document.getElementById(\"\
  prevButton\").disabled = true;\n    document.getElementById(\"nextButton\").disabled\
  \ = false;\n    document.getElementById(\"endButton\").disabled = false;\n  }\n\n\
  \  // 设置当前章节索引\n  curchapIndex = chapIndex;\n\n  // 清除之前的章节文本\n  replaceText(document.getElementById(\"\
  chaptext\"),\n    \"Loading...\");\n\n  // 发送 Ajax 请求加载新章节\n  var bookURL = \"booker.php?title=\"\
  \ +\n    encodeURIComponent(title) +\n    \"&chapIndex=\" + encodeURIComponent(chapIndex);\n\
  \  ajaxSendRequest(\"GET\", bookURL, handleRequest);\n}\n```\n\n函数的前几行初始化了导航按钮，以便它们在第一本书的第一章中被相应启用或禁用。然后存储了当前章节索引，因为你需要记住它才能成功地从一个章节导航到另一个章节。章节文本区域具有双重作用，既作为章节加载的状态通知，又在加载期间设置为\
  \ `Loading...`。一旦章节加载，此文本将被替换为实际的章节文本。最后，通过 `GET` 请求方法将简写标题和章节索引封装到 URL 中发送实际的 Ajax\
  \ 请求。注意，熟悉的 `handleRequest()` 函数被指定为请求处理器，这意味着它在请求完成时被调用。\n\n### handleRequest 函数\n\
  \n`handleRequest()` 函数承担了 Booker 应用程序中大部分的工作，在这种情况下，它包括接收 XML 籍数据、提取重要信息并相应地更新页面上的元素。在探索该函数的代码之前，让我们花一点时间回顾一下\
  \ Ajax 响应从服务器返回的 XML 数据格式：\n\n```xml\n<bookData>\n  <chapNum />\n  <chapTitle>INTRO</chapTitle>\n\
  \  <chapText>\n  But who shall dwell in these worlds if they be\n  inhabited? .\
  \  .  .  Are we or they Lords of the\n  World? .  .  .  And how are all things made\
  \ for man?\n  — KEPLER (quoted in The Anatomy of Melancholy)\n  </chapText>\n  <totalChapters>28</totalChapters>\n\
  </bookData>\n```\n\n这是 `handleRequest()` 函数必须处理的 XML 数据示例，其代码如下：\n\n代码视图：\n\n```javascript\n\
  function handleRequest() {\n  if (request.readyState == 4 && request.status == 200)\
  \ {\n    // 存储 XML 响应数据\n    var xmlData = request.responseXML.getElementsByTagName(\n\
  \      \"bookData\")[0];\n\n    // 存储总章节数\n    totalChapters =\ngetText(xmlData.getElementsByTagName(\"\
  totalChapters\")[0]);\n\n    // 显示章节信息\n    var chapNum = getText(xmlData.getElementsByTagName(\n\
  \      \"chapNum\")[0]);\n    var chapTitle =\ngetText(xmlData.getElementsByTagName(\"\
  chapTitle\")[0]);\n    var chapInfo;\n    if (chapNum.length > 0 && chapTitle.length\
  \ > 0)\n      chapInfo = chapNum + \" : \" + chapTitle;\n   else\n     chapInfo\
  \ = chapNum + chapTitle;\n   replaceText(document.getElementById(\"chapinfo\"),\
  \ chapInfo);\n\n   // 显示章节文本\n   replaceText(document.getElementById(\"chaptext\"\
  ),\n     getText(xmlData.getElementsByTagName(\"chapText\")[0]));\n }\n ajaxUpdateState();\n\
  } \n```\n\n代码首先检查 Ajax 请求是否成功完成，然后将 XML 数据精简到第一个 `bookData` 元素（在这种情况下它是唯一的 `bookData`\
  \ 元素）。从那里，使用 JavaScript DOM 函数从 XML 数据中仔细地提取每部分数据。例如，总章节数被获取并存储在 `totalChapters`\
  \ 变量中，使用如下行代码：\n\n\n\n\n\n```javascript\ntotalChapters =\n  getText(xmlData.getElementsByTagName(\"\
  totalChapters\")[0]);\n```\n\n如果章节总数恰好在 XML 中使用了不同的标签名称编码（例如，`<NumberOfChapters>`），那么上一行代码只需更改为如下所示：\n\
  \n```javascript\ntotalChapters =\n  getText(xmlData.getElementsByTagName(\"NumberOfChapters\"\
  )[0]);\n```\n\n这个示例展示了你如何修改应用程序的 XML 处理代码，而不必一定深入研究使其运行的 `DOM` 函数的内部细节。\n\n### 注意\n\
  \n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg) |\
  \ Booker 应用中使用的 `getText()` 和 `replaceText()` 函数不是标准的 JavaScript DOM 函数，而是包含在书籍文件\
  \ `domkit.js` 中的辅助函数的一部分。前一章节解释了这些函数以及 Ajax Toolkit 中其他函数的关联性。 |\n\n`handleRequest()`\
  \ 函数中的剩余代码涉及从 XML 数据中提取信息并将其显示在页面上的每个 `div` 元素中。代码足够智能，可以检查章节编号和标题是否存在，如果两者都存在则将它们合并。否则，仅显示指定的其中一个。这是一种巧妙的方法，考虑到有些书籍有章节编号，有些有章节标题，而有些两者都有。\n\
  \nWeb 页面上你还没看到的唯一部分是两个响应导航按钮点击的函数：`prevChapter()` 和 `nextChapter()`。让我们从 `prevChapter()`\
  \ 函数开始，它的代码如下：\n\n```javascript\nfunction prevChapter() {\n  if (curchapIndex >\
  \ 0) {\n    curchapIndex—;\n    document.getElementById(\"nextButton\").disabled\
  \ = false;\n    document.getElementById(\"endButton\").disabled = false;\n  }\n\
  \  if (curchapIndex == 0) {\n    document.getElementById(\"homeButton\").disabled\
  \ = true;\n    document.getElementById(\"prevButton\").disabled = true;\n  }\n \
  \ loadChapter(document.getElementById('book').options[\n    document.getElementById('book').selectedIndex].value,\n\
  \      curchapIndex);\n}\n```\n\n该函数的大部分代码用于根据当前章节是否为第一章智能地启用和禁用导航按钮。一旦执行了导航按钮逻辑，就会调用\
  \ `loadChapter()` 函数，并使用当前章节索引来指定要加载哪个章节。\n\n`nextChapter()` 函数与 `prevChapter()`\
  \ 非常相似，但角色反转，重点关注最后一章而不是第一章。换句话说，如果当前章节是最后一章，那么 `nextChapter()` 函数禁用“下一页”按钮就很重要。以下代码显示了如何使用\
  \ `totalChapters` 变量作为判断当前章节是否为最后一章的基础：\n\n```javascript\nfunction nextChapter()\
  \ {\n  if (curchapIndex  < (totalChapters - 1)) {\n    curchapIndex++;\n    document.getElementById(\"\
  homeButton\").disabled = false;\n    document.getElementById(\"prevButton\").disabled\
  \ = false;\n  }\n  if (curchapIndex == (totalChapters - 1)) {\n    document.getElementById(\"\
  nextButton\").disabled = true;\n    document.getElementById(\"endButton\").disabled\
  \ = true;\n  }\n  loadChapter(document.getElementById('book').options[\n    document.getElementById('book').selectedIndex].value,\n\
  \      curchapIndex);\n}\n```\n\n这结束了新版 Booker 应用的客户端部分。剩下的就是快速查看服务器脚本，与客户端相比，这是轻而易举的。\n\
  \n### Booker 服务器脚本\n\nBooker 应用服务器端的 PHP 脚本负责读取整个电子书 XML 文件，然后动态生成一个包含 Web 页面所需的特定章节信息的\
  \ XML 文档。这些章节信息通过 Ajax 响应传回客户端。以下是服务器 PHP 脚本 `booker.php` 的代码：\n\n```php\n<?php\n\
  header('Content-Type: text/xml');\n\n// 将电子书 XML 数据解析为结构\n$rawBook = file_get_contents(\"\
  book_\" . $_REQUEST['title'] .\n  \".xml\");\n$xml = new SimpleXmlElement($rawBook);\n\
  \n$chap = $xml->chapters->chapter[intval($_REQUEST['chapIndex'])];\n$xmlChapter\
  \ = '<?xml version=\"1.0\" encoding=\"utf-8\"?>';\n$xmlChapter .= '<bookData>';\n\
  $xmlChapter .= '<chapNum>' . $chap['num'] . '</chapNum>';\n$xmlChapter .= '<chapTitle>'\
  \ . $chap['title'] . '</chapTitle>';\n$xmlChapter .= '<chapText>' . $chap . '</chapText>';\n\
  $count = 0;\nforeach ($xml->chapters->chapter as $chapter) {\n  $count++;\n}\n$xmlChapter\
  \ .= '<totalChapters>' . $count . '</totalChapters>';\n$xmlChapter .= '</bookData>';\n\
  \n// 生成书籍信息 XML 文档\necho $xmlChapter;\n?>\n如果你对 PHP，这段代码看起来可能非常陌生。我不会尝试教你一门新语言（这显然超出了本书的范围和领域），我将充当解释器。代码的开头确定了返回的数据是\
  \ XML 格式；这至关重要，以便服务器对数据进行打包。\n\n\n\n\n\n[`www.yourdomain.com/booker.php?title=warofworlds&chapIndex=0`](http://www.yourdomain.com/booker.php?title=warofworlds&chapIndex=0)\n\
  \n假设 PHP 脚本和 XML 电子书存储在你的服务器上，将此行代码中的域名更改为你的域名，然后将 URL 输入 Web 浏览器。你也可以直接在随书附带的 Linux\
  \ CD 上尝试这个技巧。无论哪种方式，图 3.5(#ch03lev1sec3.html_ch03fig05) 显示了 PHP 脚本生成的 XML 响应数据。\n\
  \n### 图 3.5 直接在浏览器中打开 PHP 脚本可以让你方便地发现它生成的是什么种类型的响应。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddnsmdvj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnm3awyzu-.jpg)\n\
  \n在学习书中其他示例以及你自己的项目时，请记住这个小技巧。我在开发示例应用程序时经常使用它，它好几次揭明了 PHP 脚本中一个在其他情况下无法发现的错误。\n\
  \n### 测试 Booker\n\n在完成所有艰苦的工作后，测试阶段是整个过程中最有趣的部分。图 3.6(#ch03lev1sec4.html_ch03fig06)\
  \ 显示了新的 Booker 应用程序，并打开了《战争与和平》的第一章。若要在自己的浏览器中跟随操作，请打开随书附带 Linux CD 中 `chap03` 示例代码文件夹中的\
  \ `booker.html` 页面。\n\n### 图 3.6 新的 Booker 程序开始加载所选书籍的第一章。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddnsmdzj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnm3awyzy-.jpg)\n\
  \n#### 注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 在某些时刻，你可能想要探索服务器日志，以发现关于 Ajax 请求到底发生了什么。你需要检查你特定的特定 Web 服务器的文档，但所有 Web 服务器都包含日志，以便你发现了哪些请求以及是否发生了错误。你还可以使用如\
  \ Firebug 等 JavaScript 调试器直接在 Web 浏览器中查看与 Ajax 请求特别相关的类似信息。 |\n\n注意图中，章节编号和标题出现在选择列表下方，这有助于让页面具有更多真实书籍的感觉。下方是“首页”（Home）和“上一页”（Previous）导航按钮，它们最初是禁用的，因为无法从书籍的第一章向后移动。\n\
  \n如果你向下滚动到章节底部，你会看到另一对导航按钮，如图 3.7(#ch03lev1sec4.html_ch03fig07) 所示，它们允许你移动到下一章或直接跳转到书籍的最后一章。\n\
  \n### 图 3.7 “下一页”（Next）和“末尾”（End）导航按钮出现在章节底部，允许你在电子书中向前导航。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddnsmddj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnm3awyzc-.jpg)\n\
  \n点击“下一页”按钮将带你进入下一章，如图 3.8(#ch03lev1sec4.html_ch03fig08) 所示。\n\n### 图 3.8 移动到新章节会导致章节标题以及章节文本的更新。\n\
  \n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddnsmdhj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnm3awyzg-.jpg)\n\
  \n此图现在显示“首页”和“上一页”按钮已启用，因为你不再处于第一章。\n\n与应用程序的早早版本一样，你可以从选择列表中选择其他书籍，它们将通过 Ajax 加载。现在的不同在于，每本电子书都是按章节为单位处理的，这在可读性和性能方面都是重大的改进。\n\
  \n### 为 Booker 进行一次极端的 Ajax 改造\n\n很容易看出，新的 Booker 电子书查看器可以成为在线提供电子书的便捷工具。但假设你并不是在经营虚拟\
  \ Web 图书馆，该应用程序还可以被修改以实现什么功能呢？请记住，该应用程序擅长处理任何受益于被拆分为离散部分的纯文本文档。在电子书的情况下，这些部分是章节，但它们实际上可以是任何内容。\n\
  \nBooker 应用程序的一种潜在变形是数据驱动的博客工具。例如，你可以修改现有的应用程序，使每个“书”对应一个博客主题，如商业、体育或政治。然后，每个主题内，“章节”变成了单条博客文章。这种重新利用\
  \ Booker 的酷炫之处在于，你完全不需要对 JavaScript 或 PHP 代码做任何更改即可实现。你需要对选择列表进行一些微小的 HTML 更改，使其显示博客主题而不是书籍，除此之外，所有更改都发生在\
  \ XML 文件中，这是好事。\n\n记住，每本电子书的 XML 文件包含给定章节的三个主要信息：编号、标题和文本。唯一不真正符合博客想法的信息是章节编号，它可以很容易地重新用作博客日期/时间。因此，可以编写一个与电子书完全相同的博客文档，但将博客日期和时间指定为章节编号，博客标题作为章节标题，博客文本作为章节文本。以下是此类文档的示例：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<ebook>\n  <title>Michael\
  \ 的体育博客</title>\n  <author>Michael Morrison</author>\n  <chapters>\n    <chapter\
  \ num=\"01/16/2007 8:00pm\"\n    title=\"掠食者拥有最多的胜利\">\n    在昨晚击败赛区对手卡尔加里后，\n  \
  \  纳什维尔掠食者现在是 NHL 本赛季首支获得 32 场\n    胜利的球队，在整个联盟中仅落后阿纳海姆一分。掠食者队加油！\n    </chapter>\n\
  \    <chapter num=\"12/31/2006 11:30pm\"\n    title=\"泰坦队自我淘汰\">\n    在场将困扰该球队直到下赛季的失败中，\n\
  \    田纳西泰坦队神奇的赛季逆转戛然而止，\n    他们在第 17 周输给了爱国者队，并淘汰出了季后赛。\n    </chapter>\n  </chapters>\n\
  </ebook>\n```\n\n诚然，你可能会认为应该修改 XML 词汇，使得博客 XML 代码不包含 `ebook` 和 `chapter` 等标签，但这并不真正关键。如果你觉得有信心调整\
  \ XML 词汇，尽管去尝试吧。\n\n### 总结\n\n\n\n\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 谁能想到 Ajax 与中东冲突有关联？1953 年，英国和美国合作了一项秘密行动，推翻了伊朗首相穆哈默德·摩萨台格（Mohammed Mossadegh）。阿贾克斯行动（Operation\
  \ Ajax）在短期内取得了成功，但对稳定伊朗与西方之间的关系几乎没有帮助，这正如 1979 年伊斯兰革命及随后的事件所证明的那样。 |\n\nWeb 页面中一种非常常见的用户界面设计是使用多个选择列表，允许用户选择层级数据。一个很好的例子是城市/州/国家选择，其中一个列表中的国家列表决定了另一个列表中可以选择哪些州，而州的选择反过来决定了第三个列表中可以选择哪些城市。这种思想是根据用户在另一个列表中的选择来限制其在另一个列表中的可能选择。虽然仅使用客户端\
  \ JavaScript 代码就可以创建此功能，但为了从从服务器获取的数据动态构建选择列表，Ajax 是必不可少的。\n\n本章将详细探讨这一问题，并准确向你展示如何使用\
  \ Ajax 从服务器数据动态构建选择列表。这是一个实用的 Ajax 设计模式，你可能想在自己的应用程序中重复使用它。此外，在开发另一个实用示例应用程序的过程中，你还将为你快速扩展的技巧库中增加几项\
  \ Ajax 技巧。\n\n本章中的 Picker 应用使用了以下文件，它们位于随书提供的实时 Linux 光盘的 `chap04` 示例代码文件夹中：\n\n\
  * `picker.html`—主 Web 页面\n* `quoter.php`—加载股票报价的服务器脚本\n* `ajaxkit.js`—Ajax Toolkit\
  \ 的核心 Ajax 函数\n* `domkit.js`—Ajax Toolkit 的 DOM 相关函数\n* `stocks.xml`—股票选股的 XML 列表\n\
  \n## 挑战：显示选定的股票信息\n\n挑战在于：使用 Ajax 根据另一个选择列表中的选择来动态填充选择列表。为什么要费此精力呢？因为在许多场景下，这种双管选择方法非常有意义。事实上，在人类最受欢迎的网站之一，每天都会使用数千次四角选择方法。我说的是\
  \ eBay——特别是在发布物品进行拍卖时的类别选择部分。图 4.1 显示了 eBay 如何使用多达四个选择列表允许用户在发布物品时深入到子类别。\n\n####\
  \ 图 4.1. eBay 是使用多个选择列表允许用户在相互的数据之间进行选择的完美示例。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddrsmdfj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnnhawyze-.jpg)\n\
  \n这种选择列表的安排为用户在处理某种层级关系的数据时提供了一种直观的选择方式。如果你可以将一组数据视为一系列决策，或者以某种方式将其组织成向外散开的树形结构（想想家谱），那么你可能就有很好的机会使用两个或多个动态填充的选择列表。\n\
  \n需要澄清的是，你不需要 Ajax 就可以创建允许用户导航层级数据选择列表。你会发现，国家/州/城市的例子随处可见，完全不需要 Ajax 帮助。直接在 Web\
  \ 页面的 JavaScript 代码中硬编码此类数据是完全可能的。问题是，每当你想要更新选择选项时都必须编辑 Web 页面，在某些情况下这是不可能的。Ajax\
  \ 应用程序背后的一个核心概念是让用户界面数据驱动，在一种情况下，这意味着从从服务器获取的数据动态构建选择列表。\n\n**注意**\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 如果你阅读任何其他 Ajax 内容，最终都会遇到使用熟悉的国家/州/城市数据的 Ajax 选择列表示例。虽然数据本身非常适合层级选择用户界面，但从 Ajax\
  \ 的角度来看它并不一定好，因为国家、州和城市很少改变。这又不是阿拉罗巴马州每隔几年就会洗牌变成另一个国家。由于这个原因，我不认为在静态数据上使用数据驱动编程技术有什么意义，除非目标仅仅是为了让应用程序更具维护性，这是一个值得赞赞的目标。我一直努力让书中的示例变得有意义，本章的选择列表示例也不例外。\
  \ |\n\n如果你考虑多选择列表技术的数据驱动本质，会有许多可以使用它的应用。一个可以根据部门或安全分级导航的公司目录就是一种可能。另一个是按部门组织的产品目录，如服装、硬件等。一个引起我注意的应用是一个投资服务，它以“热门”、“冷门”和“安全”股票列表的形式提供建议。这并不是说我迫切急于使用这样的服务，但它提供了在两个方面使用\
  \ Ajax 的机会：\n\n* 动态填充选择列表\n* 获取实时股票报价\n\n第一个任务是本章的真正重点，而第二个任务是创建一个能够通过 Ajax 满足实际需求的应用程序的附带。\n\
  \n你在本章中开发的应用程序名为 Picker，意为股票选股（stock picker），它展示了两个选择列表——一个是股票类型，另一个是实际股票。股票类型包括热门、冷门和安全。股票列表根据股票类型列表中的选择进行动态填充。此类网站的编辑人员可以对服务器上的股票选股进行后端更改，结果会自动同步到数据驱动的页面上。当股票列表中选择了某只股票时，股票报价就会出现。详细信息（包括当前股票价格）将显示在两个选择列表下方。\n\
  \n你在这个应用程序中真正拥有的是两个链式 Ajax 请求：\n\n* 第一个 Ajax 请求根据选定的股票类型（热门、冷门或安全）从服务器抓取股票列表。\n\
  * 第二个 Ajax 请求根据股票列表中的选定股票获取特定股票的最新信息。\n\n如果这听起来像是一项巨大的挑战，不要太担心，因为 Ajax 提供了一条清晰的路径，可以在太大麻烦的情况下完成这些任务。技巧在于设计一个简单的设计，以便代码不会失控。\n\
  \n## 第 4 章。使用 Ajax 动态填充列表：股票选股\n\n### 秘密 Ajax\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 谁能想到 Ajax 与中东冲突有关？1953 年，英国和美国合作了一项秘密行动，推翻了伊朗首相穆哈默德·摩萨台格（Mohammed Mossadegh）。阿贾克斯行动（Operation\
  \ Ajax）在短期内取得了成功，但对稳定伊朗与西方之间的关系几乎没有帮助，这正如 1979 年伊斯兰革命及随后的事件所证明的那样。 |\n\n\n\n\n\n\
  网页页面中一种非常常见的用户界面设计是使用多个选择列表，允许用户选择层级数据。一个很好的例子是城市/州/国家选择，其中一个列表中的国家列表决定了另一个列表中可以选择哪些州，而州的选择又决定了第三个列表中可以选择哪些城市。这种设计的意图是根据用户在另一个列表中的选择，来限制其在当前列表中的可能选择。虽然这个功能完全可以使用仅客户端\
  \ JavaScript 代码来创建，但为了根据从服务器获取的数据动态构建选择列表，Ajax 是必不可少的。\n\n本章将详细探讨这个问题，并向你准确地展示如何使用\
  \ Ajax 从服务器数据动态构建选择列表。这是一个非常实用的 Ajax 设计模式，你可能想在自己的应用程序中重复使用它。此外，在开发另一个实用示例应用程序的过程中，你还将为你快速扩展的技能库中增加几种\
  \ Ajax 技巧。\n\n本章中的 Picker 程序使用了以下文件，它们位于随书附带的 Linux 光盘的 `chap04` 示例代码文件夹中：\n\n*\
  \ `picker.html`—主 Web 页面\n* `quoter.php`—加载股票报价的服务器脚本\n* `ajaxkit.js`—用于 Ajax Toolkit\
  \ 的核心 Ajax 函数\n* `domkit.js`—用于 Ajax Toolkit 的 DOM 相关函数\n* `stocks.xml`—股票选择的 XML\
  \ 列表\n\n### 挑战：显示所选股票信息\n\n这个挑战很简单：使用 Ajax 根据另一个选择列表中的选择来动态填充选择列表。为什么要费此精力呢？因为在许多场景下，这种双管行的选择方法非常有意义。事实上，在人类已知最流行的网站之一上，每天都会使用数次四管齐的方法。我说的是\
  \ eBay——具体来说是在列出拍卖物品时的类别选择部分。图 4.1 显示了 eBay 如何使用多四个选择列表，允许用户在列出项目时深入到子类别。\n\n####\
  \ 图 4.1. eBay 是使用多个选择列表允许用户在相互依赖的数据之间进行选择的完美示例。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddrsmdf.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnnhawyze-.jpg)\n\
  \n这种选择列表的安排为用户在处理以某种层级形式组织的数据时提供了一种直观的选择方式。如果你可以将一组数据看作决策序列，或者以某种方式将其组织成扇散状的树形结构（想想家谱），那么你可能有一个很好的机会使用两个或多个动态填充的选择列表。\n\
  \n需要澄清的是，你不需要 Ajax 就可以创建允许用户导航层级数据的选择列表。你会发现，国家/州/城市的示例随处可见，完全不需要任何 Ajax 帮助。直接将此类数据硬编码在\
  \ Web 页面的 JavaScript 代码中是完全可能的。问题在于，每当你想要更新选择选项时，都必须编辑 Web 页面，在某些情况下这根本是不可能的。Ajax\
  \ 应用程序的一个核心概念是让用户界面数据驱动，在一种情况下，这意味着从从服务器获取的数据动态构建选择列表。\n\n**注意**\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 如果你阅读任何其他 Ajax 文章，最终都会遇到一个使用熟悉的国家/州/城市数据的 Ajax 选择列表示例。虽然数据本身非常适合层级选择用户界面，但从\
  \ Ajax 的角度来看，它并不一定好，因为国家、州和城市很少改变。阿拉巴巴马州并不是每隔几年就会洗牌到另一个国家。由于这个原因，我不认为在静态数据上使用数据驱动编程技术有意义，除非目标仅仅是让应用程序更具可维护性，这是一个值得赞的目标。我一直努力让书中的示例具有价值，本章的选择列表示例也不例外。\
  \ |\n\n如果你思考一下多重选择列表技术的数据驱动特性，你会发现它在许多地方都可以使用。一个可以根据部门或安全分级导航的公司目录就是一种可能。另一个是按部门组织的分类目录，例如服装、五金等。一个引起我注意的应用程序是投资服务，它以热门股、冷门股和安全股列表的形式提供建议。并不是说我一定急于使用这样的服务，但它提供了一个在两个方面使用\
  \ Ajax 的机会：\n\n* 动态填充选择列表\n* 获取实时股票报价\n\n第一个任务是本章的真正重点，而第二个任务则是创建一个可以通过 Ajax 满足实际需求的应用程序所带来的额外收益。\n\
  \n你在本章中开发的应用程序称为 Picker，即股票选择器（stock picker），它展示了两个选择列表——一个是股票类型，另一个是实际股票。股票类型包括热门、冷门和安全。股票列表根据股票类型列表中的选择动态填充。根据股票类型列表中的选择，服务器进行更新。当在股票列表中选择了某只股票时，股票报价进入场景。详细信息显示在两个选择列表下方。\n\
  \n你在应用程序中实际上拥有的是两个递进的 Ajax 请求：\n\n* 第一个 Ajax 请求根据所选股票类型（热门、冷门或安全）从服务器获取股票列表。\n*\
  \ 第二个 Ajax 请求根据股票列表中的特定股票获取最新信息。\n\n如果这听起来像是一项巨大的挑战，不要太担心，因为 Ajax 提供了一条清晰的路径来完成这些任务。关键在于设计要简单，以防代码失控。\n\
  \n## 设计：设计股票选择器\n\n任何 Ajax 应用程序的设计很大程度上取决于对客户端和服务器之间传输数据的仔细分析。在 Picker 程序的案例中会有两个不同的\
  \ Ajax 请求，一个接一个发生，所以设计工作量了一倍。幸运的是，每个请求都不特别复杂，因此设计仍然可以保持。\n\n第一个请求响应于用户从第一个选择列表中选择股票类型。当该类型被选中时，会向服务器发送请求以获取该类型的股票列表。此时，你所做的只是获取基于所选类型的列表。此股票列表用于填充第二个选择列表，而该列表恰好作为第二个\
  \ Ajax 请求的基础。\n\n第二个请求是在用户从第二个选择列表（股票列表）中选择股票时启动的。该请求从提供金融数据的 Web 服务实时查询股票信息。除非你自己运行金融股票报价服务器，否则你将向第三方服务发送请求，而不是像在第一个请求那样提供你自己的数据。服务器返回的最新股票信息随后将显示在\
  \ Web 页面上。图 4.2 显示了应用程序的用户界面转换为 Ajax 请求的粗略表示。\n\n\n\n\n\n##### 图 4.2. Picker 应用程序的用户界面由两个选择列表和一个包含所选股票信息的文本区域组成。\n\
  \n![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawcwl2cuahnmngkwyzi-.jpg)\n\
  \n现在你已经对 Picker 应用程序的整体设计有了了解，让我们更仔细地观察特定的 Ajax 请求和响应，以及它们之间传输的是什么样的数据。\n\n####\
  \ 客户端请求\n\n在 Picker 应用程序中，从客户端发送到服务器的数据极少。事实上，对于初始的股票列表请求，不需要发送任何内容，因为股票列表的 XML\
  \ 数据足够小，直接获取整个文档并在客户端 JavaScript 代码中解析出你所需的内容并不是问题。因此，你不必担心在发送第一个请求时带上任何内容。\n\n\
  第二个请求显然必须至少发送股票的名称，因为它正在金融服务器上执行股票查找。仅仅通过股票的股票代码（ticker symbol）就能获得如此多的信息，这非常令人惊讶。由于这个原因，你向第二个请求中只需要发送股票代码，这通常是一个三个或四个字母的单词，例如\
  \ `SBUX`（星巴克）、`FDX`（联邦快递）、`AMZN`（亚马逊）等。\n\n到从客户端发送到服务器的这些简单数据就此结束。现在我们来讨论服务器返回的内容。\n\
  \n#### 服务器响应\n\n向服务器发出的第一个 Ajax 请求是获取整个股票列表，无论选择了哪种股票类型。你可以认为这个请求应该包含股票类型，并因此在响应中只返回单一类型的股票，但如果你只是抓取整个股票列表，服务器的角色就被简化了。事实上，你根本不需要服务器脚本来请求整个\
  \ XML 文档。\n\n服务器在股票列表响应中返回的 XML 文档是包含所有可能的股票类型的股票列表。那么，责任就落在了 Web 页面上，它需要处理该列表并提取出特定类型的股票，以填充第二个选择列表。你将在下一节中看到股票特定\
  \ XML 数据的示例。\n\n第二个 Ajax 请求会提示服务器返回有关特定股票的信息，包括最新的股票价格。由于这些信息是从第三方服务（在此例中为 `webserviceX.net`）获取的，因此服务器返回的股票信息并不是你直接控制的。不仅如此，尝试使用\
  \ Ajax 从你自己的其他服务器请求数据本身就存在固有问题——这是不允许的！出于安全考虑，你不允许向请求源地其他域名的服务器执行 Ajax 请求。该怎么办？\n\
  \n虽然有其他方法可以绕过 Ajax 安全限制，我们将使用一个 PHP 脚本作为代理从第三方服务器获取数据。它的工作原理是：你的 Ajax 客户端向服务器上的一个\
  \ PHP 脚本发送请求，该脚本转从第三方服务器获取数据。这是被允许的，因为服务器之间的通信不像客户端到服务器通信那样受到限制。正如你在本章稍后学到的，实现这一目标所需的\
  \ PHP 脚本实际上只有几行代码。\n\n现在回到 Picker 应用程序的整体服务器响应图：整个股票列表在第一个 Ajax 响应中返回，该响应由用户从第一个选择列表选择股票类型时触发。第二个请求由从第二个选择列表选择股票引发，结果是一个包含详细股票信息（包括当前价格）的响应。第二个响应间接接收来自第三方\
  \ Web 服务 `webserviceX.net`，该服务提供了几种 XML 格式的便捷手数据馈送。\n\n#### 理解客户端到服务器的对话\n\n现在你已经有了足够的\
  \ Picker 应用程序数据通信方程式，可以将所有内容整合成一个连贯的设计，并考虑两个 Ajax 请求中发送和接收的内容。图 4.3 显示了针对这些请求发生的客户端到服务器的对话。\n\
  \n##### 图 4.3. Picker 应用程序涉及两个不同 Ajax 请求往复流动的数据。\n\n![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawcwl2cuahnmngkwyzm-.jpg)\n\
  \n该图揭示了两个 Ajax 请求如何生成响应，并将股票列表和股票信息回传给浏览器（客户端）。第一个请求没有向服务器发送任何额外数据，而第二个请求仅发送相关股票的股票代码。该代码被封装在\
  \ URL 中作为单个参数。以下是一个用于向 Picker 应用程序的 PHP 脚本传递股票代码的 URL 示例：\n\n```\nquoter.php?symbol=EBAY\n\
  ```\n\n这段代码显示负责处理第二个 Ajax 请求的 PHP 脚本位于名为 `quoter.php` 的文件中。你将在本章稍后学习该脚本是如何工作的。现在，让我们回到第一个\
  \ Ajax 请求以及它期望从服务器返回的数据类型。\n\n第一个 Ajax 请求期望服务器返回一个 XML 文档，其中包含应用程序使用的整个股票列表，包括所有的股票类型。以下是该\
  \ XML 代码的示例：\n\n```\n<stocks>\n  <hot>\n    <stock>AAPL</stock>\n    <stock>LUV</stock>\n\
  \    ...\n  </hot>\n  <cold>\n    <stock>HSY</stock>\n    <stock>WIN</stock>\n \
  \   ...\n  </cold>\n  <safe>\n    <stock>KO</stock>\n    <stock>CAT</stock>\n  \
  \  ...\n  </safe>\n</stocks>\n```\n\n如你所见，股票被组织成由 `<hot>`、`<cold>` 和 `<safe>` 等标签定义的组。在每种股票类型的这些标签组中，你可以找到单个股票，它们使用\
  \ `<stock>` 标签进行编码。需要注意的是，使用股票代码来识别股票，而不是实际的公司名称。这是一个关键的设计决策，因为股票的股票代码是用于查找任何给定股票的，可以被看作是股票的唯一标识符。\n\
  \n在股票列表的实际数据文件中，我为每种不同的股票类型包含了五只股票，但你可以随意包含任何数量的股票。正如你在本章稍后看到的，Picker 应用程序读取给定类型内的所有股票并将它们添加到第二个选择列表，因此对你在股票列表\
  \ XML 数据中包含的股票数量并没有真正的硬性限制。\n\n可能更有趣的是服务器响应第二个 Ajax 请求返回的 XML 数据。该响应数据由详细的股票信息组成，由第三方\
  \ Web 服务 `webserviceX.net` 生成。以下是发送到 `webserviceX.net` 的股票报价请求所生成的此类 XML 数据的示例：\n\
  \n代码视图：\n\n```\n<string>\n  <StockQuotes>\n    <Stock>\n      <Symbol>GOOG</Symbol>\n\
  \      <Last>504.28</Last>\n      <Date>1/16/2007</Date>\n      <Time>4:00pm</Time>\n\
  \      <Change>-0.72</Change>\n      <Open>507.87</Open>\n      <High>513.00</High>\n\
  \      <Low>503.30</Low>\n      <Volume>7579201</Volume>\n      <MktCap>154.4B</MktCap>\n\
  \      <PreviousClose>505.00</PreviousClose>\n      <PercentageChange>-0.14%</PercentageChange>\n\
  \      <AnnRange>331.55 - 513.00</AnnRange>\n      <Earns>7.875</Earns>\n      <P-E>64.13</P-E>\n\
  \      <Name>GOOGLE</Name>\n    </Stock>\n  </StockQuotes>\n</string> \n```\n\n\n\
  \n\n股票信息可能比你预期的要详细得多，而且包含的信息也确实比 Picker 应用真正需要的多得多。然而，既然数据在那里，你大可以尽可能地利用它们。具体来说，Picker\
  \ 应用最终使用了来自 Ajax 响应返回的股票信息中的以下几部分数据：\n\n*   股票名称 (`<Name>`)\n*   最新报价 (`<Last>`)\n\
  *   市值 (`<MktCap>`)\n*   交易成交量 (`<Volume>`)\n*   价格变动百分比 (`<PercentageChange>`)\n\
  *   市盈率 (`<P-E>`)\n*   报价日期和时间 (`<Date>` 和 `<Time>`)\n\n这些都是潜在投资者在对某只推荐的股票时可能想要了解的信息。现在，你只需要弄清楚如何将这些数据整合到应用程序本身中。\n\
  \n# 组装选股器 (Stock Picker)\n\n与书中许多示例 Ajax 应用程序一样，Picker 应用涉及三个主要组件：\n\n*   XML 文件\
  \ (`stocks.xml`)\n*   HTML Web 页面 (`picker.html`)\n*   PHP 服务器脚本 (`quoter.php`)\n\
  \n除了应用程序的这三个部分外，第三方财务 Web 服务负责提供实时股票数据。虽然该服务是应用程序的重要部分，但它不需要独立的组件，除了在 HTML Web 页面中启动\
  \ Ajax 请求的代码以及在 PHP 服务器脚本中处理将响应传回页面的代码之外。这种安排是必要的，因为 Ajax 请求不允许直接访问位于其他域的资源。\n\n\
  让我们更详细地分解 Picker 应用的每个部分，让你完全理解应用程序是如何运行的。\n\n## 股票 XML 文件\n\n股票 XML 文件完全由你生成，负责根据选择的股票类型控制应用程序中显示的股票。以下是示例\
  \ `stocks.xml` 文件的完整代码，它包含了一列表或随机的股票选择：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<stocks>\n  <hot>\n    <stock>AAPL</stock>\n    <stock>LUV</stock>\n\
  \    <stock>GOOG</stock>\n    <stock>FDX</stock>\n    <stock>TM</stock>\n  </hot>\n\
  \  <cold>\n    <stock>HSY</stock>\n    <stock>WIN</stock>\n    <stock>MRK</stock>\n\
  \    <stock>AMGN</stock>\n    <stock>BBY</stock>\n  </cold>\n  <safe>\n    <stock>KO</stock>\n\
  \    <stock>CAT</stock>\n    <stock>DIS</stock>\n    <stock>GE</stock>\n    <stock>MSFT</stock>\n\
  \  </safe>\n</stocks> \n```\n\n### 注意\n\n| ![](img/image) | 我强烈建议你不要在这些股票选择上孤注一掷！股票标记为“热门”、“冷门”或“安全”大部分程度上是随机的，所以如果你把养老钱投入了苹果\
  \ (AAPL) 股票，而 iPhone 最终大获惨利，请不要怪我。 |\n\n你之前在本章的开头看到过这段代码的片段，所以现在对你来说应该不完全陌生。请记住，整个\
  \ XML 文件将作为对第一个 Ajax 请求的响应发送给客户端，该请求是由第一个选择列表中的股票类型选择触发的。\n\n### 提示\n\n| ![](img/image)\
  \ | `stocks.xml` 文件使用股票代码而不是公司名称来指定股票。在组装自己的股票列表时，你可能需要找到它们的股票代码。你可以使用在线工具，例如雅虎的符号查找\
  \ ([`http://finance.yahoo.com/lookup`](http://finance.yahoo.com/lookup))）来确定此类代码。还请记住，Picker\
  \ 应用对于共同基金、交易交易基金 (ETF) 以及几乎任何与主要金融交易所相关的代码都能正常工作；你并不局限于股票。 |\n\n每只股票都使用不带属性的 `<stock>`\
  \ 标签编码，并且 `<stock>` 标签被仔细地安排在指示类型的标签内。例如，要将某只股票指定为“热门”，你只需将其 `<stock>` 标签放在 `<hot>`\
  \ 和 `</hot>` 标签之间。你可以在每个类型中包含任意数量的股票——客户端 JavaScript 代码会自动为给定类型列出的每个股票填充选择列表。\n\n\
  ## Picker 页面\n\nPicker 应用的 HTML Web 页面 (`picker.html`) 在用户界面方面相对简单，主要由两个选择列表以及用于存放详细股票信息的几个\
  \ `div` 和 `span` 元素组成。图 4.4 显示了在 Web 浏览器中打开的 Picker 应用，两个选择列表和股票信息均可见。\n\n### 图\
  \ 4.4. Picker 页面由两个选择列表和一个用于显示股票信息的区域组成。\n\n[[查看全图]](image)\n\n以此图为参考，检查主体的 HTML\
  \ 代码：\n\n代码视图：\n\n```html\n<body onload=\"document.getElementById('stocktype').selectedIndex\
  \ = 0; loadStockList()\">\n  <div id=\"ajaxState\" style=\"display:none\"></div>\n\
  \  <br />\n  <div>选择类型:\n    <select id=\"stocktype\" onchange=\"loadStockList()\"\
  >\n      <option value=\"hot\">热门股票</option>\n      <option value=\"cold\">冷门股票</option>\n\
  \      <option value=\"safe\">安全股票</option>\n    </select>\n  </div>\n  <br />\n\
  \  <div>选择股票:\n    <select id=\"stock\" onchange=\"loadStockInfo(this.selectedIndex);\"\
  >\n    </select>\n  </div>\n  <br />\n  <div id=\"stockname\" style=\"font-size:large;\
  \ font-weight:bold\"></</div>\n  股票价格: <span id=\"stockprice\" style=\"font-weight:bold\"\
  >$</span></span>\n  <br />\n  市值: <span id=\"stockcap\" style=\"font-weight:bold\"\
  ></</span>\n  <br />\n  成交量: <span id=\"stockvolume\" style=\"font-weight:bold\"\
  ></</span>\n  <br />\n  百分比变化: <span id=\"stockchange\" style=\"font-weight:bold\"\
  ></</span>\n  <br />\n  市盈率: <span id=\"stockpe\" style=\"font-weight:bold\"></</span>\n\
  \  <br />\n  <div id=\"stockdatetime\" style=\"font-style:italic\"></div>\n</body>\n\
  ```\n\n第一个选择列表 (`stocktype`) 使用针对不同股票类型的固定选项进行编码。这些股票类型被用作填充第二个选择列表 (`stock`) 的基础，该列表初始时是空的。\n\
  \n页面的最后部分包含几个 `div` 元素和几个 `span` 元素，用于整洁地格式化股票信息。仔细检查代码发现每条信息之前都有一个标签，在某些情况下还有一个格式化字符（如美元符号\
  \ `$`），用以显示该数据是货币值。股票名称和日期/时间是唯一没有标签的元素，因为股票名称元素兼任了 Ajax 请求的状态通知。具体地说，股票名称元素在股票加载时会显示文本\
  \ `\"Loading...\"`。这让用户知道发起了数据请求。页面上日期/时间元素的含义对用户来说应该非常易见，因此那里也没有使用标签。\n\n\n\n\n\
  当用户在第一个选择列表中选择不同的股票类型时，`loadStockList()` 函数也会被调用。此操作会触发 `onchange` 事件，从而导致 `loadStockList()`\
  \ 的调用。当第二个列表发生变化时，也会发生类似的情况，但这次调用的是 `loadStockInfo()` 函数来启动 Ajax 请求，以加载单个股票的详情。当前选中的股票作为唯一参数传递给此函数。\n\
  \n`loadStockList()` 函数的作用仅仅是发送 Ajax 请求以获取 `stocks.xml` 文件的内容：\n\n```javascript\n\
  function loadStockList() {\n  // 发送 Ajax 请求加载新的股票列表\n  ajaxSendRequest(\"GET\",\
  \ \"stocks.xml\", handleStockListRequest);\n}\n```\n\n这段代码中需要注意的关键点是请求处理函数的名称，即\
  \ `handleStockListRequest()`。该函数负责在 Ajax 请求完成后处理处理工作。以下是它的代码：\n\n### 代码视图\n\n```javascript\n\
  function handleStockListRequest() {\n  if (request.readyState == 4 && request.status\
  \ == 200) {\n    // 存储 XML 响应数据\n    var xmlData = request.responseXML.getElementsByTagName(\n\
  \      \"stocks\")[0];\n\n    // 提取当前股票类型的数据\n    var listData = xmlData.getElementsByTagName(\n\
  \      document.getElementById('stocktype').options[\n      document.getElementById('stocktype').selectedIndex].\n\
  \      value);\n\n    // 清空股票列表\n    var stockSel = document.getElementById('stock');\n\
  \    while (stockSel.length > 0)\n      stockSel.remove(0);\n\n    // 用股票代码填充股票列表\n\
  \    for (var i = 0; i  < listData[0].childNodes.length; i++) {\n      if (listData[0].childNodes[i].nodeType\
  \ == 1) {\n        var symbol = getText(listData[0].childNodes[i]);\n        stockSel.add(new\
  \ Option(symbol, symbol, false, false),\n          null);\n      }\n    }\n\n  \
  \  // 选择列表中的第一只股票\n    stockSel.selectedIndex = 0;\n\n    // 加载列表中第一只股票的信息\n   \
  \ loadStockInfo(stockSel[0].value);\n  }\n  ajaxUpdateState();\n} \n```\n\n我意识到这是一个相当笨重的函数，但从其实执行的操作来说，它实际上并不复杂。请参考\
  \ `stocks.xml` 文件以理解该函数正在处理什么类型的数据。该函数的目的是深入分析 `stocks.xml` 数据，并获取与给定股票类型（热门、冷门或安全）相关的股票列表。具体地说，此股票列表出现在特定的股票类型标签（`<hot>`、`<cold>`\
  \ 或 `<safe>`）中。\n\n在从服务器最初获取 XML 数据后，`handleStockListRequest()` 函数会将 XML 数据精简到特定的股票类型。例如，热门股的\
  \ XML 数据子集如下：\n\n```xml\n<hot>\n  <stock>AAPL</stock>\n  <stock>LUV</stock>\n  <stock>GOOG</stock>\n\
  \  <stock>FDX</stock>\n  <stock>TM</stock>\n</hot>\n```\n\n现在代码已经准备好循环遍历 `<hot>`\
  \ 标签内的股票列表，用热门股填充选择列表。但在在此之前，必须清空列表，以确保之前显示的股票已经消失。在清空股票列表后，再用剩余 XML 数据中的股票进行填充。对于此示例，这意味着有五只股票被添加到股票选择列表中。股票列表填充完成后，将选择设置为新列表中的第一只股票。\n\
  \n这里情况变得有点有趣了，因为你已经动态地填充了股票列表，但你还没有任何可以显示的股票信息。你需要显示新列表中第一只股票的信息。这是通过调用 `loadStockInfo()`\
  \ 函数实现的，该函数接受第一只股票的值作为其唯一参数。此函数调用会导致第二个 Ajax 请求的启动，该请求的任务是获取指定股票的信息。\n\n以下是 `loadStockInfo()`\
  \ 函数的代码：\n\n```javascript\nfunction loadStockInfo(stock) {\n  // 清空之前的股票信息文本\n \
  \ replaceText(document.getElementById(\"stockname\"),\n    \"加载中...\");\n  replaceText(document.getElementById(\"\
  stockprice\"), \"\");\n  replaceText(document.getElementById(\"stockcap\"), \"\"\
  );\n  replaceText(document.getElementById(\"stockvolume\"), \"\");\n  replaceText(document.getElementById(\"\
  stockchange\"), \"\");\n  document.getElementById(\"stockchange\").style.color =\
  \ \"#000000\";\n  replaceText(document.getElementById(\"stockpe\"), \"\");\n  replaceText(document.getElementById(\"\
  stockdatetime\"), \"\");\n\n  // 发送 Ajax 请求加载新的股票信息\n  ajaxSendRequest(\"GET\",\
  \ \"quoter.php?symbol=\" +\n    encodeURIComponent(stock), handleStockInfoRequest);\n\
  }\n```\n\n除了清理页面上的股票显示元素以准备接收新的股票信息外，此函数与 `loadStockList()` 一样简单。注意股票名称的 `div` 元素设置为“加载中...”，以便用户知道数据正在传输中。在请求完成之前，所有其他元素都为空。完成后，股票信息\
  \ Ajax 请求将由 `handleStockInfoRequest()` 函数处理，如下所示：\n\n### 代码视图\n\n```javascript\n\
  function handleStockInfoRequest() {\n  if (request.readyState == 4 && request.status\
  \ == 200) {\n    // 存储 XML 响应数据\n    var xmlData = request.responseXML.getElementsByTagName(\n\
  \      \"Stock\")[0];\n\n    // 显示详细的股票信息\n    replaceText(document.getElementById(\"\
  stockname\"),\n      getText(xmlData.getElementsByTagName(\"Name\")[0]) +\n    \
  \  \" (\" +\n      getText(xmlData.getElementsByTagName(\"Symbol\")[0]) +\n    \
  \  \")\");\n    replaceText(document.getElementById(\"stockprice\"),\n      getText(xmlData.getElementsByTagName(\"\
  Last\")[0]));\n    replaceText(document.getElementById(\"stockcap\"),\n      \"\
  $\" + getText(xmlData.getElementsByTagName(\"MktCap\")[0]));\n    replaceText(document.getElementById(\"\
  stockvolume\"),\n      getText(xmlData.getElementsByTagName(\"Volume\")[0]) +\n\
  \      \" shares\");\n    replaceText(document.getElementById(\"stockchange\"),\n\
  \      getText(xmlData.getElementsByTagName(\n        \"PercentageChange\")[0]));\n\
  \    if (getText(\n      xmlData.getElementsByTagName(\n      \"PercentageChange\"\
  )[0]).charAt(0) == '+')\n      document.getElementById(\"stockchange\").style.color\
  \ = \"#009900\";\n    else if (getText(\n      xmlData.getElementsByTagName(\n \
  \     \"PercentageChange\")[0]).charAt(0) == '-')\n      document.getElementById(\"\
  stockchange\").style.color = \"#990000\";\n    replaceText(document.getElementById(\"\
  stockpe\"),\n      getText(xmlData.getElementsByTagName(\"P-E\")[0]));\n    replaceText(document.getElementById(\"\
  stockdatetime\"),\n      getText(xmlData.getElementsByTagName(\"Time\")[0]) + \"\
  \ - \" +\n      getText(xmlData.getElementsByTagName(\"Date\")[0]));\n  }\n  ajaxUpdateState();\n\
  } \n```\n\n记住此函数处理的 XML 数据格式如下：\n\n代码视图\n\n```xml\n<string>\n  <StockQuotes>\n \
  \   <Stock>\n      <Symbol>SBUX</Symbol>\n      <Last>36.29</Last>\n      <Date>1/17/2007</Date>\n\
  \      <Time>2:41pm</Time>\n      <Change>+0.07</Change>\n      <Open>36.26</Open>\n\
  \      <High>36.52</High>\n      <Low>36.20</Low>\n      <Volume>4327880</Volume>\n\
  \      <MktCap>N/A</MktCap>\n      <PreviousClose>36.22</PreviousClose>\n      <PercentageChange>+0.19%</PercentageChange>\n\
  \      <AnnRange>28.72 - 40.01</AnnRange>\n      <Earns>0.00</Earns>\n      <P-E>N/A</P-E>\n\
  \      <Name>STARBUCKS CP</Name>\n    </Stock>\n  </StockQuotes>\n</string> \n```\n\
  \n记住这种数据格式后，你可以更更容易地看到 JavaScript 代码是如何遍历 XML 数据，并根据 XML 标签名称提取相关片段的。例如，以下两行代码被用于获取当前股票价格并将其设置为股票价格\
  \ `span` 元素的值：\n\n```javascript\nreplaceText(document.getElementById(\"stockprice\"\
  ),\n  \"$\" + getText(xmlData.getElementsByTagName(\"Last\")[0]));\n```\n\n\n\n\
  这段代码不仅从 XML 代码中的 `<Last>` 标签中获取股价，还向数值后添加了美元符号（`$`），以明确这是一个货币值。\n\n`handleStockInfoRequest()`\
  \ 函数中另一个有趣的代码段与股票百分比变化的显示方式有关。百分比被涂成绿色或红色，以更清晰地指示百分比变化是盈利还是亏损。以下是根据百分比变化值调整颜色的代码：\n\
  \n```\nif (getText(xmlData.getElementsByTagName(\n  \"PercentageChange\")[0]).charAt(0)\
  \ == '+')\n  document.getElementById(\"stockchange\").style.color = \"#009900\"\
  ;\nelse if (getText(xmlData.getElementsByTagName(\n  \"PercentageChange\")[0]).charAt(0)\
  \ == '-')\n  document.getElementById(\"stockchange\").style.color = \"#990000\"\
  ;\n```\n\n这段代码寻找百分比变化值前的加号（`+`）或减号（`-`），作为将 `stockchange` 元素的颜色改为绿色（`#009900`）或红色（`#990000`）的依据。\n\
  \nPicker Web 页面的代码到此结束，诚然它比之前的示例要复杂一些。不过，请记住，大多数 JavaScript 代码与设置各种股票信息元素有关。如果你想简化应用程序为只显示当前股价，JavaScript\
  \ 代码将变得小得多。但那样还有什么趣呢？\n\n### 报价服务器脚本 (The Quoter Server Script)\n\n在章节前面的部分，我解释了\
  \ Picker 应用程序所需的服务器端脚本来绕过无法向第三方域名发送直接 Ajax 客户端请求的限制。第三方域名很重要，因为 Picker 应用程序依赖它来提供实时股票信息。可以使用\
  \ PHP 脚本作为某种安全代理，通过代表客户端接收 Ajax 请求，从第三方服务器获取股票数据，然后将数据响应给客户端。通过这种方式，Ajax 请求本身完全是针对你自己的域发起的，因此处于\
  \ Ajax 的安全限制之内。\n\n我所说的第三方 Web 服务是 `webserviceX.net`，它提供了多个基于 XML 的数据源。其中一个源是股票报价馈，你可以在其中指定股票代码（ticker\
  \ symbol），服务器将返回一个包含股票详细信息的 XML 文档。在整个章节中你已经多次看到这个 XML 文档中的代码，但你还没有见过实现通过 Ajax 请求接收这些代码的\
  \ PHP 脚本。以下是 `quoter.php` 服务器脚本的代码：\n\n```\n<?php\nheader('Content-Type: text/xml');\n\
  \n// 从服务器加载 XML 股票报价数据\n$xml = html_entity_decode(file_get_contents(\n  \"http://www.webservicex.net/stockquote.asmx/GetQuote?symbol=\"\
  \n  . $_REQUEST['symbol']));\n\n// 返回 XML 股票报价数据\necho $xml;\n?>\n```\n\n记住，此脚本的作用是从\
  \ `webserviceX.net` 的股票报价 Web 服务检索 XML 文档，然后在不进行任何修改的情况下将该数据传递给客户端。然后由客户端对 XML 代码进行一些有用操作，例如在页面上显示它的部分内容。\n\
  \n服务器脚本首先确保响应被视为 XML。脚本中的第二部分代码从股票报价 Web 服务加载 XML 文档，并确保传递了 `symbol` 参数，以便 Web 服务知道要查询哪只股票。代码的最后一段是脚本实际返回\
  \ XML 数据的地方，它作为 Ajax 股票信息请求的响应。\n\n在继续测试完成的应用程序之前，值得花一点时间单独测试一下 PHP 脚本。你已经在上一章通过\
  \ Booker 应用程序看到了如何操作，但这里有一个测试 Quoter 脚本的示例 URL：\n\n`http://www.yourdomain.com/quoter.php?symbol=SBUX`\n\
  \n假设 `quoter.php` 文件存储在你的服务器上，将此行代码中的域名更改为你的域名，然后将 URL 输入 Web 浏览器中。你也可以直接在随书附带的实时\
  \ Linux CD 上尝试这个技巧。无论如何，图 4.5 显示了 PHP 脚本生成的 XML 响应数据。\n\n#### 图 4.5。你可以通过直接在浏览器中打开脚本来检查\
  \ Quoter PHP 脚本返回的 XML 股票信息。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzrsmdvj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnnhawyzu-.jpg)\n\
  \n可以随意在 Quoter 脚本的 URL 中尝试不同的股票代码。这是研究服务器脚本返回数据的极佳方法，以确保它与你的预期一致——当你只看客户端 Web 页面时，诊断服务器脚本问题要困难得多。\n\
  \n### 测试 Picker\n\nPicker 应用程序现在已组装完毕并准备好进行测试。要在你自己的浏览器中尝试，请打开随附的实时 Linux CD 上 `chap04`\
  \ 文件夹中的 `picker.html` 页面。图 4.6 显示了正在正在，并从初始的热股列表中选择了一只股票。\n\n#### 图 4.6。Picker 应用程序最初选择第一种股票类型以及股票列表中的第一只股票。\n\
  \n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzrsmdzj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnnhawyzy-.jpg)\n\
  \n图中显示了 Google 如何最初显示为第一个热门股票。要看到选择列表的动态加载效果，请从第一个列表中选择不同的股票类型。图 4.7 显示了从列表中选择“冷股”（Cold\
  \ Stocks）后的应用程序。\n\n#### 图 4.7。选择不同的股票类型会导致股票列表动态重新加载以及显示新的股票信息。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzddrsmddj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnnhawyzc-.jpg)\n\
  \n尽管我是一个巧克力爱好者，但我还是把好时士公司（Hershey Company）放在了冷股列表中。由于这只股票是列表中的第一个，它的信息会自动加载并显示在选择列表下方。\n\
  \n应用程序的最后一个测试是尝试从股票列表中选择另一只不同的股票。图 4.8 显示了在冷股列表中选择了另一只股票（Amgen）的应用程序。\n\n#### 图\
  \ 4.8。当你选择了不同的股票时，股票列表不会重新加载，但页面上会显示新的股票信息。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqywnhmc9rx2hzrsmdhj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnnhawyzg-.jpg)\n\
  \n\n\n`Picker` 应用在展示用于选择股票推荐的动态用户界面方面做得非常好，并为每种股票选择提供相应的硬数据。该应用程序的双层级选择列表设计在投资之外也可能有许多益处。我喜欢的一个想法是，使用这样的应用程序来跟踪某类收藏，例如电影收藏。\n\
  \n当你从更抽象的角度考虑 `Picker` 应用时，你会开始感觉到它是如何被应用于其他类型的数据的。在电影收藏的案例中，股票类型可以转换为电影类型，如动作、恐怖、喜剧等。在每种电影类型中，你可以使用类似的\
  \ XML 编码方法列出你的具体电影。然而，在这种情况下，并没有像股票代码那样的既定标准来用简写形式唯一地表示某部电影。相反，你可能只想直接列出整个电影名称，因为为每部电影想一个“代码代码”可能很困难。\n\
  \n基于 `Picker` 代码创建电影收藏应用面临的首要挑战是找到一个能够像 `webserviceX.net` 在 `Picker` 中提供股票信息的 Web\
  \ 服务。事实证明，确实有一个 Web 服务可以让你通过极少的工作让电影收藏应用变成非常切实的现实。查看以下 URL 看看我在说什么：\n\nhttp://www.trynt.com/movie-imdb-api/v2/?t=Raising%20Arizona\n\
  \n这个 Web 服务被称为 `TRYNT Movie IMDb Web Service`，它为你提供了通过程序化访问流行的互联网电影数据库 (IMDb) 的功能。如果你从未探索过\
  \ IMDb，欢迎在 http://www.imdb.com/ 上进行尝试。该网站已经解决了许多电影参数问题！关于 `TRYNT` 的更多信息，请查看 http://www.trynt.com/。\n\
  \n回到电影 Web 服务，以下是你刚才看到的 `Raising Arizona` URL 返回的 XML 数据：\n\n代码视图：\n\n```\n<trynt>\n\
  \  <movie-imdb>\n    <search>Raising Arizona</search>\n    <matched-id>tt0093822</matched-id>\n\
  \    <matched-url>http://www.imdb.com/title/tt0093822/\n    </matched-url>\n   \
  \ <matched-title>Raising Arizona (1987)</matched-title>\n    <data>\n       <movie-id>\n\
  \         <data>\n           <id>tt0093822</id>\n           <score>6</score>\n \
  \        </data>\n       </movie-id>\n       <movie-title>\n         <data>\n  \
  \         <id>Raising Arizona (1988)</id>\n           <score>6</score>\n       \
  \  </data>\n       </movie-title>\n    </data>\n  </movie-imdb>\n</trynt> \n```\n\
  \n诚然，除了电影年份外，并没有多少有用信息，遗憾的是，年份与名称包含在同一个字段中，这使得提取变得有些困难。然而，这段代码中极其有用用的是指向 IMDb 中电影的链接。这意味着你可以动态构建一个指向电影的链接，作为电影收藏页面上显示的电影信息的一部分。让你的应用程序点击一下就能获取人们可能想了解电影的任何信息，这对于应用程序来说是一个非常精妙的改进。\n\
  \n要将 `Picker` 应用转换为电影收藏应用，重新设计 `stocks.xml` 文件中的 XML 标签以适应 `movies.xml` 文件绝对不是一个坏主意。只要记住，网页中的每个标签引用也需要随之修改。不过，在你开始拆解代码之前，尝试仅通过将电影数据插入到现有框架中来修改应用程序可能是值得的。不要忘记更改应用程序网页中的第一个选择列表，使其列出电影类型而不是股票类型。\n\
  \n### 总结\n\n本章向你展示了第一个向不同 URL 发起多次 Ajax 请求的示例应用程序。幸运的是，这些请求是接连发生的，而不是同时发生的；否则，`Ajax\
  \ Toolkit` 将需要修改以允许多个请求同时进行。`Picker` 应用也是一个如何绕过无法在请求源域以外域名发送 Ajax 请求的限制的良好示例。通过将此责任交给服务器脚本，你允许客户端网页请求服务器脚本执行与第三方服务器通信的工作。通过使用第三方\
  \ Web 服务，`Picker` 应用是一个很好的例子，展示了你如何将自己的 XML 数据（股票列表）与来自其他处的数据（实时股票报价）结合，而如果没有这样做，这些数据很难甚至无法获取。\n\
  \n## 第 5 章：接入 RSS 新闻订阅\n\n## 古希腊的 Ajax\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 并不是要削弱异步 Web 应用程序的重要性，但 Ajax 在某个时期具有更为重大的意义。我指的是古希腊，那里一位名叫阿贾克斯（Ajax）的传奇希腊英雄在特洛战争中发挥了巨大作用。阿贾克斯传奇的力量和勇气由希腊诗人荷马在史诗《伊利亚特》中被记载过。\
  \ |\n\n作为一名多年来创建并维护过许多网站的人，我不得不说，当我第一次尝试新闻订阅（news feeds）时非常兴奋。它们允许你聚合来自其他地方的内容，你可以将其整合到自己的页面中，效果是你的页面会自动更新并保持新鲜——或者至少新闻订阅是自动的。所以，除非你很有天赋并渴望费尽精力地报道新闻，否则你可能会发现，注入到你网站中的相关新闻订阅可以提供自动刷新的有趣内容。通过少量的研究，你可能就能找到与你的内容完美匹配的订阅。\n\
  \n本章展示了 Ajax 如何实现动态查询新闻订阅以获取新闻项目，并将这些项目显示在页面上。你在本章中探索的示例应用程序提供了一个从多个新闻服务进行选择的简单界面，在这种情况下，新闻项目列表会更新以反映所选源。与通过\
  \ Ajax 动态获取新闻项目一样酷的，是当 Ajax 请求执行期间显示的那个精巧的小“加载”图像。\n\n本章中的 News Feeder 应用程序使用了以下文件，位于带有书籍的发行版\
  \ Linux 光盘的 `chap05` 示例代码文件夹中：\n\n*   `newsfeeder.html`——主 页面\n*   `newsfeeder.php`——加载新闻订阅的服务器脚本\n\
  *   `newsfeeder.css`——格式化新闻订阅的样式表\n*   `ajaxkit.js`——Ajax Toolkit 的核心 Ajax 函数\n\
  *   `domkit.js`——Ajax Toolkit 的 DOM 相关的函数\n*   `newspaper.gif`——显示在每个新闻项目旁边的报纸图标\n\
  *   `wait.gif`——在 Ajax 请求期间显示的动画“加载”图标\n\n### 挑战：动态查询新闻订阅\n\n本章的挑战是使用 Ajax 动态查询新闻订阅\
  \ Web 服务获取数据（新闻项目），并将这些新闻项目显示在页面上。具体来说，新闻项目是新闻故事的标题，因此你实际上需要显示的是作为每个单独新闻故事链接的新闻标题。事实证明，新闻订阅中的每个新闻项目都包含标题和链接（以及其他内容），因此新闻订阅提供了你满足挑战所需的所有数据。\n\
  \n\n\n\n在深入研究挑战本身之前，我们首先需要花一点时间了解新闻源（news feeds）以及它们是如何融入 Web 体系的。让大多数新闻源运行的技术是\
  \ RSS。这项技术允许你聚合 Web 内容，这意味着你可以订阅网站，并在无需实际访问网站的情况下，轻松地发现该网站发布的新内容。尽管对 RSS 缩写有多种解释，但最新且可能最准确的解释是“Really\
  \ Simple Syndication”（真正简单的聚合）。RSS 新闻源实际上是编码新闻信息的 XML 文档；你将在本章稍些时候学习更多关于 RSS 新闻源特定格式的内容。\n\
  \n### 注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | RSS 的历史及其不同版本相当复杂，因此可以说，RSS 2.0 是最新且最常用的 RSS 版本。你可能还会看到 Atom 格式的新闻源，它与 RSS 2.0\
  \ 非常相似。 |\n\n使用称为“新闻聚合器”（news aggregator）的特殊软件，你可以监控来自多个网站的 RSS 新闻，并有效地跟踪广泛的信息，而无需定期访问每个不同的网站。你可以将\
  \ RSS 认为是 Web 内容提供的某种“股票报价器”——它允许你持续关注你喜爱的网站何时发布了新内容。\n\n尽管它们没有独立的新闻聚合器应用程序功能全，但大多数现代\
  \ Web 浏览器都提供了查看新闻源的内置支持。图 5.1 显示了在 Firefox 浏览器中查看的主要 Wired News 源。\n\n#### 图 5.1。你可以直接在大多数\
  \ Web 浏览器中查看 RSS 新闻源，无需任何特殊的插件或软件。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqzmlhmc9nx2hzddvsmdfj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawowl2cuahnnnxawyze-.jpg)\n\
  \n当然，直接在 Web 浏览器中查看新闻源与将其嵌入你自己的页面中并不完全相同。这让我们回到了面临的挑战——使用 Ajax 在页面中动态加载并显示新闻源。因为每个新闻源都有其独特的\
  \ URL，因此挑战中的 Ajax 部分实际上非常简单——它涉及从 URL 获取整个 XML 文档。这意味着你不需要在应用程序服务器端对新闻数据进行任何特殊处理，这极地简化了工作。\n\
  \n由于此应用程序的 Ajax 请求非常简单，我们将通过给用户提供视觉提示（显示数据正在加载）来美化用户界面。这很重要，因为某些新闻源包含的信息足够多，接收数据可能会出现明显的延迟。如果你不知道发生了什么，即使是几秒钟的延迟也可能令人困惑。因此，处理该问题的一种巧妙方法是在请求进行时显示“加载”图像。\n\
  \n挑战的最后一部分是让用户从多个新闻源中进行选择。这不仅为使用不同的数据集对应用程序进行压力测试提供了一种良好方法，还从用户的角度增加了应用程序的灵活性。当然，在将\
  \ RSS 整合你自己的页面时，你也可以选择单个源并放弃选择方法。无论如何，News Feeder 示例应用程序都是你 RSS Ajax 之旅的绝佳起点。\n\n\
  # 第 5 章 接入 RSS 新闻源\n\n## 古希腊的 Ajax\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 这并不是为了减轻异步 Web 应用的重要性，但 Ajax 在过去的某个时期具有远为巨大的意义。我指的是古希腊，那里一位传奇的希腊英雄阿贾克斯（Ajax）在特洛伊战争中发挥了重要作用。阿贾克斯传奇的力量和勇气由希腊诗人荷马在史诗《伊利亚特》中记载。\
  \ |\n\n作为一名多年来创建并维护了许多 Web 网站的人，我必须说，第一次尝试新闻源时我非常兴奋。它们允许你聚合来自其他地方的内容，并将其整合到你自己的页面中，结果是你的页面会自动更新并保持刷新——或者至少新闻源是刷新的。所以，除非你有天赋并渴望费尽心力地报道新闻，否则你可能会发现注入到网站中的相关新闻源可以提供自动刷新的有趣内容。通过少量的研究，你很可能找到与你的内容完美匹配的源。\n\
  \n本章展示了 Ajax 如何让动态查询新闻源以获取新闻项目，然后在页面上显示这些项目。你在本章中探索的示例应用程序提供了一个从多个新闻服务中选择的简单界面，在这种情况下，新闻项目列表会更新以反映所选源。通过\
  \ Ajax 动态检索新闻项目一样酷的，是在 Ajax 请求执行期间显示的精美小“加载”图像。\n\n本章中的 News Feeder 应用程序使用了以下文件，这些文件位于带有书籍的在线\
  \ Linux CD-ROM 的 `chap05` 示例代码文件夹：\n\n* `newsfeeder.html`——主 Web 页面\n* `newsfeeder.php`——加载新闻源的服务器脚本\n\
  * `newsfeeder.css`——用于格式化新闻源的样式表\n* `ajaxkit.js`——Ajax Toolkit 的核心 Ajax 函数\n* `domkit.js`——Ajax\
  \ Toolkit 的 DOM 相关函数\n* `newspaper.gif`——显示在每个新闻项目旁边的报图标\n* `wait.gif`——在 Ajax 请求期间显示的动画“加载”图标\n\
  \n### 挑战：动态查询新闻源\n\n本章的挑战是使用 Ajax 动态查询新闻源 Web 服务获取数据（新闻项目），然后在页面上显示这些新闻项目。具体来说，新闻项目是新闻故事的标题，因此你实际上需要显示的是作为每个单独新闻故事链接的新闻标题。事实证明，新闻源中的每个新闻项目都包含标题和链接等其他内容，因此新闻源提供了满足挑战所需的所有数据。\n\
  \n在深入研究挑战本身之前，我们首先需要花一点时间了解新闻源（news feeds）以及它们是如何融入 Web 体系的。让大多数新闻源运行的技术是 RSS。这项技术允许你聚合\
  \ Web 内容，这意味着你可以订阅网站，并在无需实际访问网站的情况下，轻松地发现该网站发布的新内容。尽管对 RSS 缩写有多种解释，但最新且可能最准确的解释是“Really\
  \ Simple Syndication”（真正简单的聚合）。RSS 新闻源实际上是编码新闻信息的 XML 文档；你将在本章稍些时候学习更多关于 RSS 新闻源特定格式的内容。\n\
  \n### 注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | RSS 的历史及其不同版本相当复杂，因此可以说，RSS 2.0 是最新且最常用的 RSS 版本。你可能还会看到 Atom 格式的新闻源，它与 RSS 2.0\
  \ 非常相似。 |\n\n\n\n\n\n### 图 5.1. 你可以在大多数 Web 浏览器中直接查看 RSS 订阅，无需任何特殊的插件或软件。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqzmlhmc9nx2hzddvsmdfj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawowl2cuahnnnxawyze-.jpg)\n\
  \n当然，在 Web 浏览器中直接查看新闻订阅与将订阅嵌入到你自己的页面中完全不是一回事。这让我们回到了当前面临的挑战——使用 `Ajax` 在页面中动态加载并显示订阅。由于每个新闻订阅都有其独特的\
  \ `URL`，因此该挑战中的 `Ajax` 部分实际上非常简单——它涉及从一个 `URL` 获取整个 `XML` 文档。这意味着你不需要在应用程序的服务器端对新闻数据进行任何特殊处理，这极大地简化了工作。\n\
  \n由于此应用程序的 `Ajax` 请求非常简单，我们将通过给用户提供一个数据正在加载的视觉提示来稍微装饰用户界面。这也很重要，因为某些新闻订阅包含足够的信息，导致接收数据时出现明显的延迟。如果你不知道发生了什么，即使是几秒钟的延迟也会让人困惑。因此，处理此问题的一种巧妙方法是在请求进行期间显示一个“加载中”图像。\n\
  \n挑战的最后一部分是给用户提供从多个新闻订阅中选择的选项。这不仅为使用不同的数据集对应用程序进行压力测试提供了很好的方法，还让应用程序从用户的角度变得更加灵活。当然，在将\
  \ `RSS` 集成到你自己的页面时，你可能会选择单一订阅并放弃选择方法。无论何种，News Feeder 示例应用程序都是你 `RSS Ajax` 冒险之旅的绝佳起点。\n\
  \n## 设计：设计一个新闻订阅应用程序\n\nNews Feeder 应用程序的设计始于从新闻订阅服务器将数据传输到应用程序的 `Ajax` 请求。该请求从订阅服务器的\
  \ `URL` 开始，然后该服务器会返回一个包含新闻订阅详细信息的 `XML` 文档，其中包含带有链接和发布日期的单个新闻项目列表。`Ajax` 请求由用户从选择列表中选择新闻订阅时触发。\n\
  \n鉴于每个新闻订阅都有一个作为 `Ajax` 请求基础的 `URL`，你需要一种方法将订阅 `URL` 与订阅名称绑定，以便允许用户选择订阅。`<option>`\
  \ 标签的 `value` 属性是存储订阅 `URL` 的理想位置，它让你能够轻松地构建新闻订阅选择列表。\n\n新闻订阅选择列表是 News Feeder 用户界面的主要组件。该界面由两部分组成：订阅选择列表以及成功加载后显示订阅数据的区域。在这种情况下，订阅数据由订阅标题和单个订阅项目列表组成，这些项目作为指向每条新闻故事的链接。图\
  \ 5.2 显示了 News Feeder 用户界面是如何结合新闻订阅 `Ajax` 请求的。\n\n### 图 5.2. News Feeder 应用程序的用户界面由一个选择列表和一个包含新闻订阅标题和单个新闻项目链接的区域组成。\n\
  \n![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawcwl2cuahnmnwkwyzi-.jpg)\n\
  \n早些我提到过，应用程序应该使用动态图像让用户知道 `Ajax` 请求正在忙于下载新闻订阅数据。图 5.3 显示了此动态图像 `wait.gif` 的样子。\n\
  \n### 图 5.3. News Feeder 应用程序使用动态“加载中”图像（`wait.gif`）让用户知道 `Ajax` 请求正在处理中。\n\n![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawowl2cuahnnnxawyzm-.jpg)\n\
  \n诚然，在打印的页面上很难看清动画，但图像的移动让用户有一种事情正在发生的感觉，他们并不只是在盯着一个冻结的页面。现在你可能会质疑在异步应用程序中显示“加载中”图像的想法。`Ajax`\
  \ 的意义不不就是永远不让用户等待任何事情吗？是的，但请记住，在请求期间应用程序实际上并没有冻结——用户可以自由选择不同的订阅，在这种情况下，当前的订阅请求会被中断并加载新订阅。动态图像只是为了让用户知道后台正在进行某种工作。\n\
  \n现在你应该对应用程序的总体设计有了足够的了解，可以深入研究 `Ajax` 请求和响应了。\n\n#### 客户端请求\n\n在没有任何安全限制的情况下，News\
  \ Feeder 应用程序中的客户端请求将是 `Ajax` 公式中最可预测的部分，因为它只需对一个 `URL` 执行简单的 `GET` 请求，无需任何特殊参数或其他其他内容。然而，直接在远程\
  \ Web 服务器上发起 `Ajax` 请求是不可能的，这意味着你必须创建自己的服务器脚本来接受并履行 `Ajax` 请求。\n\n获取新闻订阅数据只需要新闻订阅\
  \ Web 服务器的 `URL`。因此，News Feeder 客户端请求必须将新闻订阅的 `URL` 发送到你的服务器脚本，然后由该脚本处理获取数据并作为 `Ajax`\
  \ 响应返回。这一切的关键在于识别合适的 `RSS` 新闻订阅，这意味着找到它们的 `URL`。\n\n如果你开始关注你访问的网站，可能会在主菜单或导航链接附近看到“syndicate”（聚合）链接，甚至可能是\
  \ `RSS` 图标。这就是你寻找新闻订阅 `URL` 的方法，而这个 `URL` 就是你通过 `Ajax` 加载新闻订阅所需的全部。\n\n#### 注意事项\n\
  \n| ![](img/mtizys9yzzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg) |\
  \ 大多数内容驱动的网站（如新闻网站）提供了许多针对不同兴趣的新闻订阅。例如，USA Today 提供了 30 多种不同的体育订阅，从大学冰球到赛马。要访问这些内容，只需滚动到\
  \ USA Today 主页的底部（[http://www.usatoday.com/](http://www.usatoday.com/））并点击小橙色 `XML`\
  \ 图标。这个图标通常取代较新的 `RSS` 图标。 |\n\n#### 服务端响应\n\n在 News Feeder 应用程序的服务器端，服务器仅负责交付包含\
  \ `RSS` 数据格式的新闻订阅信息的 `XML` 文档，这是一种 `XML` 格式。与书中其他示例不同（那些示例依赖服务器端 `PHP` 脚本在返回 `Ajax`\
  \ 响应之前以某种方式处理或操作数据），News Feeder 应用程序只需要 `PHP` 脚本来绕过无法在第三方域名上发布客户端请求的固有限制。这是一种安全限制，防止客户端\
  \ `JavaScript` 代码越出其所属的域名。\n\n因此，News Feeder 应用程序确实需要在服务器上有一个 `PHP` 脚本，但它的唯一作用是从远程服务器获取新闻订阅数据，然后通过\
  \ `Ajax` 响应将其传回客户端。你可以将 News Feeder 的服务器脚本视为一个代理，因为它充当了客户端 `JavaScript` 代码与实际托管新闻订阅的远程服务器之间的中间人。再次，关键在于你的\
  \ `Ajax` 代码只能向你的服务器发送请求，而当你需要从其他地方请求数据时，这是一个大问题。解决方案是允许服务器脚本检索数据，然后让该脚本作为响应 `Ajax`\
  \ 请求的基础。\n\n\n\n\n\n我一直在提到的第三方（远程）服务器可以是任何提供 RSS 格式数据源的服务器。你会发现，如果你稍加探索，大多数主流网站都提供\
  \ RSS 格式的新闻源。当你在发现一个新闻源时，请注意浏览器中的 URL——这就是你在编写发送 RSS Ajax 请求时需要填入代码的 URL。\n\n##\
  \ 理解客户端与服务器的对话\n\n如果你将你所学到的关于在“新闻馈器”（News Feeder）应用上下文中进行的通信的知识整合起来，就会得到如图 5.4 所示的数据流。\n\
  \n### 图 5.4. 新闻馈器应用在响应带有新闻源 URL 的请求时接收 XML 新闻源数据。\n\n![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawcwl2cuahnmnwkwyzu-.jpg)\n\
  \n作为 Ajax 请求参数发送到服务器的数据是新闻数据源的 URL。尽管这些数据始终以 URL 的形式存在，但它可以采取多种形式。例如，以下是与《美国科学》（Scientific\
  \ American）网站相关的新闻源 URL：[`www.sciam.com/xml/sciam.xml`](http://www.sciam.com/xml/sciam.xml)。\n\
  \n注意，这个 URL 引用了一个特定的 XML 文档 `sciam.xml`。考虑到 RSS 源实际上是 XML 文档，这是很合理的，但新闻源 URL 并不总是引用\
  \ XML 文件。例如，以下 URL 是《连线杂志》（Wired）的新源：[`feeds.wired.com/wired/topheadlines`](http://feeds.wired.com/wired/topheadlines)。\n\
  \n在这个例子中，URL 是一个路径而不是文件名。底线是，你不能总是预测新闻源 URL 的准确形式。好消息是，你通常可以直接使用网站为你提供的发布 URL（syndication\
  \ URL）。\n\n一旦你知道了新闻源 Web 服务器的 URL，它就需要被封装成一个更大的 URL，以便作为 Ajax 请求的一部分提交给新闻馈器服务器脚本。以下是这种操作的示例：\n\
  \n```\nnewsfeeder.php?rssurl=http://www.sciam.com/xml/sciam.xml\n```\n\n这段代码揭示了新闻源\
  \ URL 如何被封装成一个 URL 中的单个参数（`rssurl`）。整个 URL 被用作 Ajax 请求的基础，在这种情况下，你的服务器脚本 `newsfeeder.php`\
  \ 将获取 `rssurl` 参数，并使用其中包含的 URL 来获取馈源信息。\n\n说到服务器脚本，你现在理解了它通过 `rssurl` 参数接收新闻源 URL，然后使用该\
  \ URL 获取 RSS 文档。该文档随后将通过 Ajax 响应传回客户端 JavaScript 代码。以下是此类 RSS 代码的真实示例：\n\n代码视图：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<rss version=\"2.0\" xmlns:dc=\"\
  http://purl.org/dc/elements/1.1/\">\n<channel>\n  <title>Scientific American - Official\
  \ RSS Feed</title>\n  <link>http://www.sciam.com/</link>\n  <image>\n    <url>http://www.sciam.com/media/logo/SAlogo_144px.gif</url>\n\
  \    <title>Scientific American.com</title>\n     <link>http://www.sciam.com/</link>\n\
  \    <width>144</width>\n    <height>45</height>\n  </image>\n  <description>Science\
  \ news and technology updates from\n    Scientific American</description>\n  <language>en-us</language>\n\
  \  <managingEditor>editors@sciam.com</managingEditor>\n    <dc:publisher>Scientific\
  \ American</dc:publisher>\n  <copyright>Copyright 1996-2007 Scientific American</copyright>\n\
  \  <item>\n    <title>News: Snake Bites the Toxic Toad that Feeds It—and\n     \
  \ Spreads Its Poison</title>\n    <link>http://www.sciam.com/article.cfm?chanID=sa003&amp;\n\
  \      articleID=6FD96483-E7F2-99DF-3C8A12ACF6BB25D8&amp;\n      ref=rss</link>\n\
  \    <guid>http://www.sciam.com/article.cfm?chanID=sa003&amp;\n      articleID=6FD96483-E7F2-99DF-3C8A12ACF6BB25D8&amp;\n\
  \      ref=rss</guid>\n    <author>JR Minkel &lt;editors@sciam.com&gt;</author>\n\
  \    <dc:date>2007-01-29T17:00:00-05:00</dc:date>\n  </item>\n  <item>\n    <title>News:\
  \ Did Honest Abe Have Nerves of Glass?</title>\n    <link>http://www.sciam.com/article.cfm?chanID=sa003&amp;\n\
  \      articleID=6FD6E124-E7F2-99DF-3E0EDA7A34E03A06&amp;\n      ref=rss</link>\n\
  \    <guid>http://www.sciam.com/article.cfm?chanID=sa003&amp;\n      articleID=6FD6E124-E7F2-99DF-3E0EDA7A34E03A06&amp;\n\
  \      ref=rss</guid>\n    <author>Nikhil Swaminathan &lt;editors@sciam.com&gt;</author>\n\
  \    <dc:date>2007-01-29T17:00:00-05:00</dc:date>\n  </item>\n...\n</channel>\n\
  </rss> \n```\n\n乍看，这段代码看起来有点吓人，但对于我们的目的来说，大部分内容都可以忽略。请记住，新闻馈器应用的挑战是显示一个链接到实际新闻故事的新闻列表。你可以从\
  \ XML 文档中提取这些数据，并忽略许多其他细节。要看看我在说什么，请查看代码并找到 `<item>` 标签。现在紧接着该标签下方，找到名为 `<title>`、`<link>`\
  \ 和 `<dc:date>` 的标签。代码看起来如下：\n\n```\n...\n  <item>\n    <title>News: Snake Bites\
  \ the Toxic Toad that Feeds It—and\n      Spreads Its Poison</title>\n    <link>http://www.sciam.com/article.cfm?chanID=sa003&amp;\n\
  \      articleID=6FD96483-E7F2-99DF-3C8A12ACF6BB25D8&amp;\n      ref=rss</link>\n\
  ...\n    <dc:date>2007-01-29T17:00:00-05:00</dc:date>\n  </item>\n...\n```\n\n`<title>`\
  \ 标签存储单个新闻项目的标题，而 `<link>` 标签存储其关联链接。`<dc:date>` 标签实际上可以简单地视为 `<date>` 标签，因为 `dc`\
  \ 部分是命名空间前缀，在技术上并不是标签名称的一部分。大多数 RSS 源实际上使用 `<pubDate>` 标签来编码。\n\n## 注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc19lown0mg04as9wcglmawcwl2cuahnmnwkwyzu-.jpg)\
  \ | 在 RSS 源中使用两个不同的标签来编码发布日期是复杂的，这涉及到竞争规范以及 RSS 格式快速演变的实。与其给你一个枯燥且必要的 RSS 历史课程，我只需要说你可能会更多地遇到\
  \ `<pubDate>` 标签而不是 `<date>`。 |\n\n当然，你还需要获取新闻源的名称，以及指向其网站的链接。这些信息也包含在 `<title>`\
  \ 和 `<link>` 标签中，但这次标签出现在 `<channel>` 标签下方；独特的新闻源也被称为频道，就像电视频道一样。因此，再次检查《美国科学》的代码，以下是包含新闻源标题和链接的代码：\n\
  \n```\n...\n<channel>\n  <title>Scientific American - Official RSS Feed</title>\n\
  \  <link>http://www.sciam.com/</link>\n...\n```\n\n总结来说，为了新闻馈器应用，必须从 RSS (XML) 新闻源文档中提取以下信息：\n\
  \n*   新闻源标题（`<channel>`内部的 `<title>`）\n*   新闻源链接（`<channel>`内部的 `<link>`）\n*   新闻项目标题（`<item>`内部的\
  \ `<title>`）\n*   新闻项目链接（`<item>`内部的 `<link>`）\n*   新闻项目发布日期（`<item>`内部的 `<pubDate>`\
  \ 或 `<date>`）\n\n前两项信息在任何给定的新闻源文档中只出现一次，而后两项在有多个新闻项目时可以出现多次——而通常是如此的。当有多个新闻项目时，每个项目都有自己的\
  \ `<item>` 标签。\n\n\n\n\n\n虽然我可以花更多时间来揭示 RSS 数据格式的细节，但我不会这样做；这没有必要。你已经掌握了组装新闻馈器（News\
  \ Feeder）应用程序所需的所有知识，所以让我们开始吧！\n\n## 组装新闻馈器应用程序\n\n你可能已经准备好处理新闻馈器应用程序的主要部分：一个网页和一个服务器脚本。然而，还有第三块拼图，即\
  \ CSS 样式表。样式表并不是绝对必需的，但它确实能让显示的新闻信息看起来更加悦目。因此，以下是该应用程序所需的组件：\n\n* HTML 网页 (`newsfeeder.html`)\n\
  * CSS 样式表 (`newsfeeder.css`)\n\n请记住，对于每一个不同的新闻源 URL，都涉及到一个远程服务器。从某种意义上说，这个远程服务器并不是应用程序的一部分，因为你不需要担心任何文件或其他资源，但它对应用程序的运行起着至关重要的作用。因此，在接下来的几节中当你处理应用程序文件时，请理解它们仍然依赖远程服务器来获取实际的新闻源数据。\n\
  \n### 新闻馈器网页\n\n新闻馈器网页 (`newsfeeder.html`) 无疑是应用程序最重要的部分，因为它负责解析 PHP 服务器脚本返回的 RSS\
  \ 数据，并以有意义的方式显示这些数据。如图 5.5 所示，该页面包含一个新闻源选择列表，随后是一个 `div` 元素，该元素包含当前所选新闻源的链接标题，以及每个链接新闻项目的列表。\n\
  \n#### 图 5.5. 新闻馈器网页由新闻源选择列表和随后与当前所选源相关的信息组成。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqzmlhmc9nx2hzddvsmdzj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawowl2cuahnnnxawyzy-.jpg)\n\
  \nHTML 代码在 `<body>` 标签中建立了新闻馈器网页的界面界面，其代码如下：\n\n代码视图：\n\n```html\n<body onload=\"\
  loadFeed()\">\n  <div id=\"ajaxState\" style=\"display:none\"></div>\n  <br />\n\
  \  <div>Choose your news:\n    <select id=\"feed\" onchange=\"loadFeed()\">\n  \
  \    <option value=\"http://feeds.wired.com/wired/topheadlines\">\n        Wired\
  \ News</option>\n      <option value=\n        \"http://feeds.engadget.com/weblogsinc/engadget\"\
  >\n        Engadget</option>\n     <option value=\n       \"http://feeds.ziffdavis.com/ziffdavis/extremetech\"\
  >\n       ExtremeTech</option>\n     <option value=\n       \"http://feeds.feedburner.com/ajaxian\"\
  >Ajaxian</option>\n     <option value=\"http://www.sciam.com/xml/sciam.xml\">\n\
  \       Scientific American</option>\n     <option value=\"http://news.google.com/?output=rss\"\
  >\n       Google News</option>\n     <option value=\n       \"http://www.michaelmorrison.com/mambo/index2.php?\n\
  \       option=com_rss&feed=RSS2.0&no_html=1\">\n       Michael Morrison's Blog</option>\n\
  \   </select>\n </div>\n <br />\n <div id=\"feedcontent\"></</div>\n</body> \n```\n\
  \n如果你排除由 `<select>` 标签创建的选择列表，你会发现这段代码非常简单。事实上，页面上实际上只有两个视觉元素：选择列表 (`feed`) 和用于显示动态加载的新闻源信息的\
  \ `div` 元素 (`feedcontent`)。\n\n网页正文中有一段不应被忽视的`code` 是 `onload` 事件处理程序，它负责通过调用 `loadFeed()`\
  \ 函数为选择列表中的第一个新闻源加载馈送数据。在查看 `loadFeed()` 函数之前，值得指出的是，你可以根据自己找到的新闻源来完全自定义新闻馈器应用程序，而无需处理页面中的任何其他代码。换句话说，你不需要查看任何剩余的\
  \ JavaScript 代码即可完全自定义应用程序——只需添加新的 `<option>` 标签，或用不同的新闻源标题和 URL 修改现有的 `<option>`\
  \ 标签即可。\n\n如果你想更深入地了解应用程序在后台的后的工作原理，那么你当然必须深入研究 JavaScript 代码。以下是 `loadFeed()` 函数的代码，它负责启动加载新闻源数据的\
  \ Ajax 请求：\n\n```javascript\nfunction loadFeed() {\n  // 清除之前的馈送内容\n  document.getElementById(\"\
  feedcontent\").innerHTML =\n    \"<img src='wait.gif' alt='Loading...' />\";\n\n\
  \  // 发送 Ajax 请求加载新的馈送内容\n  ajaxSendRequest(\"GET\", \"newsfeeder.php?rssurl=\"\
  \ +\n    encodeURIComponent(document.getElementById('feed').options[\n    document.getElementById('feed').selectedIndex].value),\n\
  \    handleFeedRequest);\n}\n```\n\n`loadFeed()` 函数执行的第一件事是该应用程序最有趣的特性之一，即在处理请求时显示动画图像\
  \ (`wait.gif`)。此图像在图 5.3 中就出现过，但在语境下看到它会有意义得多——图 5.6。\n\n回到 `loadFeed()` 代码，通过更改\
  \ ID 为 `feedcontent` 的 `div` 使其包含一个 `<img>` 标签来显示“加载”图像。这种变化通过设置 `div` 的 `innerHTML`\
  \ 属性来实现。稍后你将会在显示新闻源标题和新闻项目的代码中再次看到该属性的使用。\n\n`loadFeed()` 中的最后一段代码负责发布 Ajax 请求。这段代码构建了一个用于与\
  \ PHP 服务器脚本 `newsfeeder.php` 通信的 URL，其中包含新闻源 URL 的 `rssurl` 参数。Ajax 处理函数被设置为 `handleFeedRequest()`，而该函数在应用程序中承担了最繁重的工作。\n\
  \n#### 注意\n\n| ![](img/0mg04as9wcgl0zwovlmd29uy3a-.jpg) | 在此点，我必须向你透露一个小秘密——这是我在书中第一次使用\
  \ `innerHTML` 属性来更改网页中的内容。我感到很愧疚，因为该属性没有被世界维网联盟（W3C）正式认可为 Web 标准，这使得它的用法具有某种争议。然而，它非常实用，并且被无数网站的专家开发者使用，这使得该属性不太可能在短期内消失。替代方案是纯通过\
  \ DOM 应用程序编程接口（API）函数来修改页面内容。后一种技术至少从标准的角度来看是更优的，但在大多数情况下它更复杂。我选择了简单优先，因此使用了 `innerHTML`\
  \ 属性。如果你想了解更多关于 `innerHTML` 与 DOM API 的争论，只需在 Web 上搜索“innerHTML”和“DOM”。你不会找不到任何强力的观点的！\
  \ |\n\n在进入 `handleFeedRequest()` 函数的代码之前，还有另一段小代码值得关注。我指的是紧接 `loadFeed()` 函数下方的用于预加载\
  \ `wait.gif` 图像的代码：\n\n```javascript\nvar waitImage = new Image();\nwaitImage.src\
  \ = \"wait.gif\";\n```\n\n\n\n\n这段代码的意义在于，你不希望在加载“加载中”图像时出现任何明显的延迟。这张图片的完全目的是让用户知道后台正在发生某些重要的操作。因此，我们通过在页面渲染之前预加载图像来尽可能快地启动工作。这之所以有效，是因为图像预加载代码出现在任何其他\
  \ JavaScript 函数之外，这意味着它会在页面加载时自动运行。\n\n回到 `handleFeedRequest()` 函数，它的任务是响应 Ajax\
  \ 响应，通过筛选筛选返回的 RSS 数据，然后显示有意义的新闻流信息。以下是该函数的代码：\n\n### 代码视图：\n\n```\nfunction handleFeedRequest()\
  \ {\n  if (request.readyState == 4 && request.status == 200) {\n    // 存储 XML 响应数据\n\
  \    var xmlData = request.responseXML;\n\n    // 从馈流标题开始生成流内容\n    var feedContent\
  \ = \"\";\n    var channelElem = xmlData.getElementsByTagName(\"channel\")[0];\n\
  \    feedContent += \"<div class='feedtitle'><a href='\" +\n      getText(channelElem.getElementsByTagName(\"\
  link\")[0]) +\n      \"'>\" + getText(channelElem.getElementsByTagName(\n      \"\
  title\")[0]) + \"</a></div>\";\n\n    // 现在作为无序列表生成流项目列表\n    feedContent += \"\
  <ul>\";\n    var feedItems = channelElem.getElementsByTagName(\"item\");\n    for\
  \ (var i = 0; i < feedItems.length; i++) {\n      var itemTitle =\ngetText(feedItems[i].getElementsByTagName(\"\
  title\")[0]);\n      var itemLink = getText(feedItems[i].getElementsByTagName(\n\
  \        \"link\")[0]);\n      var itemPubDate =\ngetText(feedItems[i].getElementsByTagName(\"\
  pubDate\")[0]);\n      if (itemPubDate == \"\")\n        itemPubDate = getText(feedItems[i].getElementsByTagName(\n\
  \          \"date\")[0]);\n      if (itemPubDate == \"\")\n        feedContent +=\
  \ \"<li><a href='\" + itemLink + \"'>\" +\n          itemTitle + \"</a></li>\";\n\
  \      else\n        feedContent += \"<li><a href='\" + itemLink + \"'>\" +\n  \
  \        itemTitle + \" <span class='itemdate'>(\" +\n          itemPubDate + \"\
  )</span></a></li>\";\n    }\n    feedContent += \"</ul>\";\n\n    // 显示流内容\n   \
  \ document.getElementById(\"feedcontent\").innerHTML = feedContent;\n  }\n  ajaxUpdateState();\n\
  } \n```\n\n诚然，这里的代码相当多，但理解起来并不太困难。只需记住，它基本上是在动态构建一段 HTML 代码。换句话说，该函数正在构建 Web 页面的部分，以便将其插入到流内容\
  \ `div` 中进行显示。生成的 HTML 代码包含了新闻流的标题，该标题恰好作为通往新闻源网站的链接。HTML 代码还包含一个新闻项目的无序（项目符号）列表，每个项目由一个链接标题和发布日期组成。需要注意的是，生成的\
  \ HTML 代码包含了几个 CSS 样式表类引用，这有助于样式表知道它应用到了哪些内容。\n\n在 `handleFeedRequest()` 函数的末尾，你看到一行代码，它最终将动态生成的\
  \ HTML 代码插入页面中：\n\n```\ndocument.getElementById(\"feedcontent\").innerHTML = feedContent;\n\
  ```\n\n虽然这行代码短小精悍，但考虑到它负责将“加载中”图像替换为经过仔细格式化的新闻流标题和新闻项目，它确实做了很多工作。\n\n新闻生成器页面的外观主要由\
  \ `newsfeeder.css` 样式表提供，该样式表通过以下链接在 Web 页面头部中引用：\n\n```\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"newsfeeder.css\" />\n```\n\n`newsfeeder.css` 样式表与新闻生成器的其他源文件位于同一个\
  \ `chap05` 文件夹中。下一节将快速检查此样式表，并解释它是如何影响新闻生成器程序的最终外观的。\n\n### 新闻生成器样式表\n\n我会第一个承认，我很不情在关于\
  \ Ajax 的书中列出 CSS 样式表代码。然而，新闻生成器应用程序是一个极佳的例子，说明了样式表可以用相对较少的代码为应用程序增添多少魅力。如果你不相信我，请查看图\
  \ 5.7，它显示了没有样式表帮助的新闻生成器应用程序。\n\n#### 图 5.7. 当移除样式表时，新闻生成器应用程序看起来有些枯燥。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqzmlhmc9nx2hzddvsmdhj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawowl2cuahnnnxawyzg-.jpg)\n\
  \n将此图与图 5.5 对比，后者显示了在样式表帮助下完全相同的新闻流。或者直接放入随书提供的 Live Linux CD，并在自己的 Web 浏览器中尝试新闻生成器示例。重点是，尽管\
  \ CSS 与 Ajax 无直接关系，但它可以让几乎任何 Ajax 应用程序看起来都更有吸引力和更专业。\n\n以下是负责新闻生成器应用程序中新闻流标题的 CSS\
  \ 代码：\n\n```\ndiv.feedtitle {\n  padding-left : 5px;\n  background-color : #EEEEEE;\n\
  \  font-size : 22px;\n  font-weight : bold;\n}\n\ndiv.feedtitle a {\n  color : #666677;\n\
  \  text-decoration : none;\n}\n\ndiv.feedtitle a:hover {\n  color : #333344;\n \
  \ text-decoration : none;\n}\n```\n\n新闻流标题生成在 HTML 代码中，该代码具有 `feedtitle` 的 `class`\
  \ 属性，并将代码与这组样式链接起来。左侧边距、背景颜色、字体大小和字体权重首先为整个标题确立。然后设置文本颜色，以及当用户鼠标悬停在标题上时一个略有不同的颜色（如果你还记得，这是一个链接）。`text-decoration`\
  \ 样式用于覆盖 HTML 在链接上显示下划线的默认行为。\n\n类似的 CSS 样式应用于列表中的新闻项目：\n\n```\nli {\n  font-size\
  \ : 18px;\n  padding-left : 25px;\n  background : url(newspaper.gif) no-repeat;\n\
  \  list-style : none;\n}\n```\n\n这些代码负责列表每个项目旁边整齐的小报报图标（参考图 5.5）。每个列表项目也是链接，因此对新闻项目应用与流标题相同的通用“链接悬停”颜色是合理的。这是它的\
  \ CSS 代码：\n\n```\na:link {\n  color : #333344;\n  text-decoration : none;\n}\n\n\
  a:visited {\n  color : #9999AA;\n  text-decoration : none;\n}\n\na:hover, a:active\
  \ {\n  background : #EEEE;\n  text-decoration : none;\n}\n```\n\n最后，你可能注意到每个新闻项目的发布日期是斜体且颜色非常浅，以免与标题竞争。以下是负责新闻项目发布日期外观的\
  \ CSS 样式：\n\n```\nspan.itemdate {\n  font-style : italic;\n  color : #CCCCDD;\n\
  }\n```\n\n这就完成了新闻生成器应用程序的样式表。剩下的只有 PHP 服务器脚本，这个应用程序就完成了。\n\n### 新闻生成器服务器脚本\n\n你见过田径上的接力赛吗，一个跑步者将接棒交给另一个跑步者？这基本上就是\
  \ `newsfeeder.php` 服务器脚本为新闻生成器应用程序所做。它出去从远程服务器获取新闻流 RSS 数据，然后冲回并将该数据交给客户端 JavaScript\
  \ 代码。服务器脚本知道从哪个服务器获取 RSS 数据，这归功于 Ajax 请求传递给它的 URL 参数 (`rssurl`)。以下是该 PHP 脚本的代码：\n\
  \n```php\n<?php\nheader('Content-type: text/xml;');\n\n// 返回 RSS 馈数据\necho file_get_contents($_REQUEST['rssurl']);\n\
  ?>\n```\n\n\n\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 请记住，这个“代理”服务器脚本目的是为了绕过远程服务器无法发送 Ajax 请求的限制。如果不存在这个安全限制，那么服务器脚本将是多余的，客户端可以直接对新闻源\
  \ URL 发起 Ajax 请求。然而，远程请求权限限制在服务器有一个充分的理由：安全！让客户端脚本自由发起远程请求是太危险了，因此必须创建自己的 Ajax 代理是获得更安全的\
  \ Web 环境所付出的出的代价。 |\n\n在设置标头使响应以 XML 格式发送后，这个脚本实际上只包含一行代码。`file_get_contents()`\
  \ 函数从指定的 URL 获取数据，这正是你需要的功能。因此，脚本所做的只是将新闻源 URL 传递给此函数，并将结果回显给客户端。最终结果是一个格式整洁的 RSS\
  \ 新闻文档，作为 Ajax 请求的响应返回给客户端。\n\n### 测试新闻馈送器（News Feeder）\n\n当你第一次打开新闻馈送器 页面时，应用程序最初会加载选择列表中的第一个新闻源，这恰好是\
  \ Wired News 的头条故事。图 5.8 显示了选择了此新闻源的应用程序。\n\n#### 图 5.8. 新闻馈送器应用程序从加载选择列表中的第一个新闻源开始。\n\
  \n[[查看完整图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqzmlhmc9nx2hzddvsmdlj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawowl2cuahnnnxawyzk-.jpg)\n\
  \n当你通过选择选择列表中不同的馈源来切换到另一个新闻源时，在进行 Ajax 请求期间会显示动画化的“加载”图像。图 5.9 显示了馈源从 Wired News\
  \ 切换到 Engadget。\n\n#### 图 5.9. 当你切换新闻源时，会显示动画化的“加载”图像，让你知道页面正在后台处理任务。\n\n[[查看完整图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqzmlhms9nx2hzddvsmdbj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawoxl2cuahnnnxawyza-.jpg)\n\
  \n新闻源的大小并不大，因此新馈源的显示不会花费长时间。当这种情况发生时，新馈源的信息将替换页面上的“加载”图像，如图 5.10![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawoxl2cuahnnnxawyze-.jpg)\n\
  \n需要指出的一点是，你现在创建了一个非常实手的自己的小型新闻聚合器。我的意思是，一旦你理解了新闻馈送器应用程序中 Ajax 运作的直观层面，你可能会发现自己其实喜欢使用该应用程序来获取新闻。只需点击新闻项目即可链接到完整的新闻故事。在此例中，点击新闻项目将带你进入\
  \ Engadget 网站上的新闻故事。\n\n除了有有趣的小摆件新闻外，Engadget 网页版也是一个带有 RSS 新闻源的网站如何让你轻松汇发馈源的绝佳示例。查看\
  \ Engadget 网页页面的右上角，你会看到 RSS 的标准橙色图标。点击此图标，你就会获得 Engadget 新闻源的 URL，我必须补充一下，这是一个非常好的源！\n\
  \n### 为新闻馈送器进行极端的 Ajax 改造\n\n书中的没有任何一个应用程序是真正完全完备的。我的意思是，所有的示例应用程序都是为了作为你自己实验 Ajax\
  \ 的起点。新闻馈送器应用程序也不例外，事实上，它是极具可定制性应用程序的绝佳示例。\n\n也许自定义新闻馈送器应用程序最明显的方法是对馈源本身进行微调。这也是最简单的自定义，因为你只需要操作\
  \ Web 页面中的 `<option>` 标签，更改标题和值使其对应其他新闻源。记住，你可以根据需要添加任意数量的新 `<option>` 标签，最终构建出一个包含许多不同新闻源的选择列表。只需将馈源名称放置在\
  \ `<option>` 和 `</option>` 标签之间，然后将其 URL 粘贴到 `value` 属性中即可。\n\n你可能决定从新闻源列表中进行选择并不完全是你想要的。如果你想限制显示的项目数量，将\
  \ `handleRequest()` 函数中的 `for` 循环改为：\n\n```javascript\nfor (var i = 0; i < feedItems.length\
  \ && i < numItems; i++) {\n```\n\n在这段代码中，`numItems` 变量控制显示多少新闻项目。你可以使用变量，也可以直接编码一个数字，如下：\n\
  \n```javascript\nfor (var i = 0; i < feedItems.length && i < 10; i++) {\n```\n\n\
  这个示例将新闻项目数量限制为十。`for` 循环仍然会检查 `feedItems` 数组的长度，以防新闻源中的项目少于十个（这通常是）。\n\n### 总结\n\
  \n本章向你介绍了 Web 内容管理中一个令人兴奋的领域——新闻源（news feeds），它使用一种基于 XML 的标准数据格式称为 RSS（简单分发）。使用\
  \ RSS，可以在无需实际访问网站的情况下获取网站变化内容的快照。更重要的是，汇发来自另一个网站的内容并使其在你的网站上可用变得可能。这是保持页面内容新的极佳方法，而无需总是构思自己的内容。你在本章中开发的新闻馈送器应用程序演示了\
  \ Ajax 如何能够动态加载 RSS 数据并整洁地呈现在页面上，以便导航和阅读新闻项目。\n\n\n\n\n\n| 如果你在 20 世纪 30 年代在澳大利亚是一个赌徒，你可能会以完全不同的眼光看待\
  \ Ajax。你可以通过赌注澳大利亚冠军纯血马赛马 Ajax 赚得大笔钱，它以连续赢得 18 场比赛而闻名，后来入选澳大利亚赛马名人堂。 |\n\n当 Ajax\
  \ 首次进入 Web 领域时，最直接受益的示例之一就是 Google Suggest，它利用 Ajax 通过尝试补全搜索文本来协助你执行搜索。Google Suggest\
  \ 是一个特别引人注目的 Ajax 示例，因为它既微妙又强大——这是一种很难结合的组合。尽管许多技术性的 Web 改进具有技术优点，但最终都对 Web 体验造成了干扰。Ajax\
  \ 则不然。Google Suggest 的自动补全功能是许多 Ajax 特性之一，它在不干扰体验的情况下极大地了 Web 体验。\n\n本章将引导你设计并开发一个自动补全应用，该应用使用\
  \ `Ajax` 在服务器上动态查找用户输入，并协助完成可能的输入输入。在某些方面，你可以将此应用视为原始的人工 Web 智能，因为它赋予了文本输入控件猜测用户正在输入内容的能力。该应用既简单又强大，是你\
  \ `Ajax` 兵库中一个非常实用的工具。\n\n本章中的 `Completer` 应用使用了以下文件，它们位于随书提供的 Linux 光盘的 `chap06`\
  \ 示例代码文件夹中：\n\n* `completer.html`—主 Web 页面\n* `completer.php`—用于查找补全文本的服务器脚本\n*\
  \ `ajaxkit.js`—Ajax Toolkit 的核心 `Ajax` 函数\n* `domkit.js`—Ajax Toolkit 的 DOM 相关函数\n\
  \n## 挑战：预测数据输入\n\n本章的挑战是创建一个功能与 Google Suggest 普及的自动补全功能类似的应用。在继续之前，快速查看一下 Google\
  \ Suggest 以了解它到底是如何工作的会有帮助。因此，请将浏览器指向 `http://www.google.com/webhp?complete=1&hl=en`\
  \ 并尝试进行搜索。\n\n#### 注意事项\n\n| Google Suggest 仍然被认为是 Google Labs 范围内的一个实验项目，这就是为什么它的\
  \ URL 如此晦涩。如果 Google Suggest 未来被推广到 Google 搜索引擎的主流使用，可能会看到此 URL 变为更易读的内容。 |\n\n\
  Google Suggest 实际上相当复杂，因为它动态显示一个下拉列表供你选择建议的搜索短语。Google Suggest 的有趣之处在于它还显示了每个建议的点击次数，从而为你提供了某种衡量建议重要性的标准。Google\
  \ Suggest 未做的是没有对文本字段本身进行任何操作，除非你确实从下拉列表中选择了其中一个建议。\n\n你在本章中开发的 `Completer` 应用在自动补全功能上采取与\
  \ Google Suggest 略有不同的方法。为了感受它的工作方式，让我们来看看另一个提供自动补全方便网站：`Lyricsfly.com`。欢迎访问 `http://www.lyricsfly.com/`，它在图\
  \ 6.1 中展示了运行效果。\n\n##### 图 6.1. Lyricsfly.com 是一个使用自动补全功能的歌词搜索搜索引擎。\n\n[[查看全图]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqzmlhmc9nx2hzddzsmdjj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawowl2cuahnnnnawyzi-.jpg)\n\
  \n在图中，我点击了 `Song` 链接来专门搜索歌曲。还要注意图中 `Lyricsfly.com` 与 Google Suggest 之间的主要区别——`Lyricsfly.com`\
  \ 在提供建议时实际上会将建议文本直接添加到文本字段中。这意味着如果你不想用，就不需要使用下拉列表。事实上，如果你不在意继续输入并锁定歌曲，那么你根本不需要下拉列表。诚然，下拉列表有很大帮助，而且它确实传达了艺术家等额外信息，但它对于自动补全功能来说并不是必不可少的。图\
  \ 6.2 显示了如果你继续输入歌曲名，`Lyricsfly.com` 中的下拉列表最终如何解析为单首歌曲。\n\n##### 图 6.2. 你在 `Lyricsfly.com`\
  \ 中输入得越多，下拉列表就变得不重要。\n\n[[查看全图]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqzmlhmc9nx2hzddzsmdnj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawowl2cuahnnnnawyzm-.jpg)\n\
  \n在图中，我输入了足够的歌曲名称，使下拉列表减少到单首歌曲。整个想法的核心是防止用户必须输入大量内容，但你可以理解自动补全功能在没有下拉列表的情况下也可以运行得很好。\n\
  \n展示如何在没有下拉列表的情况下实现自动补全的主要点，是为 `Completer` 示例应用设置挑战。动态创建和管理自定义下拉列表具有相当大的复杂性，我想让这个示例尽可能简洁。你将在书的以后遇到\
  \ `Ajax` 驱动的自定义弹出窗口，但现在我想坚持使用简单的、不包含大量棘手开销代码的用户界面。因此，我们将抛弃下拉列表，完全在文本输入控件内创建一个自动补全功能。\n\
  \n这意味着应用在任何给定时间只会建议一个单词或短语，但你会发现即使是单一的建议短语也能让应用程序变得更加实用和直观。\n\n因此，`Completer` 应用当前的任务是仅为文本输入控件提供自动补全功能。就此挑战如何影响\
  \ `Ajax` 而言，应用的客户端负责在用户每输入一个字符时向服务器发送用户输入的文本。服务器获取给定的输入文本，并在可能的补全列表（建议）中找到最匹配的项。然后服务器将补全剩余部分返回给客户端，以便将其添加到文本输入控件并选择。\n\
  \n为了让应用具有一定的教育意义，`Completer` 使用一个名人列表作为自动补全功能的基础。这意味着用户将开始输入一个名字，应用将快速（理想情况下）用其对身份可能的最佳猜测填充文本字段。如果用户对建议满意，他们就不需要再输入任何内容。如果不满意，用户可以选择继续输入，应用将尝试另一次补全尝试。除非用户输入速度快到\
  \ `Ajax` 请求跟不上，否则每次按键都会触发一次请求（实际上是按键释放，但这不是重点）。\n\n总而言之，`Completer` 应用为用户输入的每个字符发出一个\
  \ `Ajax` 请求，尝试自动完成历史人物名称的输入。一旦成功输入了名称，用户就可以点击按钮在 Wikipedia（流行的在线百科全书）上查看该历史人物的传记。应用的\
  \ Wikipedia 部分只是作为成功使用 `Ajax` 输入历史名称的一点小奖励。\n\n\n\n\n\n| 如果你是 20 世纪 30 年代澳大利亚的一位赌徒，你可能会以完全不同的眼光看待\
  \ Ajax。你可以通过对澳大利亚冠军纯血马赛马 Ajax 进行下注来赚取一大笔钱，他因连胜 18 场比赛而闻名，后来入选了澳大利亚赛马名人堂。 |\n\n当\
  \ Ajax 首次进入 Web 世界时，最直接产生收益的例子之一就是 Google Suggest，它利用 Ajax 通过尝试自动补全搜索文本来协助你执行搜索。Google\
  \ Suggest 是 Ajax 一个特别具有吸引力的例子，因为它既细微又强大——这是一种很难结合的组合。尽管许多技术性的 Web 改进在技术上有优点，但往往会对\
  \ Web 体验造成干扰。Ajax 则不同了。Google Suggest 的自动补全功能是许多 Ajax 特性之一，它们在不干扰用户的情况下极大地提高了 Web\
  \ 体验。\n\n本章将引导你设计并开发一个自动补全应用，该应用使用 Ajax 在服务器上动态查找用户输入，并协助完成可能的输入。在某些方面，你可以将此应用视为一种原始的人工\
  \ Web 智能，因为它赋予了文本输入控件猜测用户输入内容的能力。该应用既简单又强大，是你武器库中一个非常实用的工具。\n\n本章中的 `Completer`\
  \ 应用使用了以下文件，这些文件位于书籍附带 CD-ROM 的 `chap06` 文件夹中：\n\n* `completer.html`—主 Web 页面\n\
  * `completer.php`—用于查找自动补的服务器脚本\n* `ajaxkit.js`—Ajax Toolkit 的核心 Ajax 函数\n* `domkit.js`—Ajax\
  \ Toolkit 的 DOM 相关函数\n\n### 挑战：预测数据\n本章的挑战是创建一个功能与 Google Suggest 的自动补全功能类似的应用。在继续操作之前，快速查看\
  \ Google Suggest 以确切了解它的原理会有帮助。因此，请将浏览器指向 `http://www.google.com/webhp?complete=1&hl=en`\
  \ 并尝试进行搜索。\n\nGoogle Suggest 仍然被认为是 Google Labs 区域的一个实验性项目，这就是为什么它的 URL 如此晦涩。如果\
  \ Google Suggest 未来被推广到主流使用，可能会看到此 URL 变为更易于读的内容。\n\nGoogle Suggest 实际上相当复杂，因为它会动态显示一个下拉列表供你选择建议短语。Google\
  \ Suggest 的有趣之处在于它还会显示每个建议的点击次数，从而为你提供某种衡量其重要性的标准。Google Suggest 做的是不会对文本字段进行任何形式的操作，除非你从下拉列表中选择了其中某一个建议。\n\
  \n你在本章中开发的 `Completer` 应用在自动补全功能上的方法与 Google Suggest 略有不同。为了感受它的工作原理，让我们来看看另一个提供自动补全实用网站：`Lyricsfly.com`。欢迎访问\
  \ `http://www.lyricsfly.com/`，该网站在图 6.1 中展示了运行情况。`Lyricsfly.com` 是一个使用自动补全功能的音乐歌词搜索引擎。\n\
  \n在图中，我点击了 `Song` 链接来专门搜索歌曲。请注意图中 `Lyricsfly.com` 与 Google Suggest 之间的主要区别——`Lyricsfly.com`\
  \ 在提供建议时，实际上会将建议的文本直接添加到文本字段中。这意味着如果你不想用，就不需要使用下拉列表。事实上，如果你不介意继续输入并锁定歌曲，你根本不需要下拉列表。诚然，下拉列表有很大帮助，并且确实传达了如艺术家之类的额外信息，但它对于自动补全功能并非必不可少。图\
  \ 6.2 显示了如果你继续输入，`Lyricsfly.com` 中的下拉列表最终将解析为单首歌曲。\n\n在幅图中，我输入了足够的歌曲名称，使下拉列表减少到单首歌曲。当然，整个设计理念是防止用户不得不输入大量内容，但你已经理解自动补全功能在没有下拉列表的情况下也可以运行得相当好。\n\
  \n展示如何在没有下拉列表的情况下实现自动补全的主要点，是为 `Completer` 示例应用设置挑战。动态创建和管理自定义下拉列表具有相当复杂性，我希望保持这个示例尽可能简洁。你将在书的后后的部分学习到\
  \ Ajax 驱动的自定义弹出窗口，但现在我想保持一个简单的用户界面，而不包含一堆棘手的额外开销代码。因此，我们将舍弃下拉列表，完全在文本输入控件内部创建一个自动补全功能。\n\
  \n这意味着应用在任何给定时间内只会建议一个单词或短语，但你会发现，即使是一个建议短语也能对让应用程序更加实用和直观产生很大帮助。\n\n因此，`Completer`\
  \ 应用目前的任务是仅为文本输入控件提供自动补全功能。在这一挑战如何影响 Ajax 方面，应用的客户端部分负责在每输入一个字符时向服务器发送用户输入的文本。服务器获取给定的输入文本，并在可能的补全列表（建议）中找到最匹配的项。然后服务器将补全的剩余部分返回给客户端，以便将其添加到文本输入控件并选中。\n\
  \n为了让应用具有一定的教育意义，`Completer` 使用了一个名人列表作为自动补全功能的依据。这意味着用户将开始输入一个名字，应用将快速（理想情况下）根据对该人物身份的最佳猜测来填充文本字段。如果用户对建议满意，她就不需要再输入任何内容。如果不满意，用户可以选择继续输入，应用将尝试另一次补全。\n\
  \n总结来说，`Completer` 应用针对用户输入的每个字符发出一个 Ajax 请求，尝试自动完成历史人物名称的输入。一旦成功输入名称，用户可以点击按钮在维基百科（流行的在线百科书）上查看该历史人物的传记。应用的\
  \ Wikipedia 部分仅仅是成功使用 Ajax 输入历史名称的一份小奖励。\n\n\n\n\n你已经对 Completer 应用中客户端和服务器之间往返的数据传输有了大致的了解，你甚至知道用户界面主要由一个文本输入控件组成。图\
  \ 6.3 显示了用户界面是如何参与应用程序中每个 Ajax 请求的。\n\n### 图 6.3. 用户的输入的每个字符都会产生一个返回补全字符串的 Ajax\
  \ 请求。\n\n![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawcwl2cuahnmnmkwyzq-.jpg)\n\
  \n图中显示了单个文本输入控件如何同时作为 Ajax 请求的源和目的地。尽管初看起来看起来并不寻常，但当你考虑到文本输入控件扮演着两个角色时，它就完全合理：它既接受用户的输入，又通过猜测用户正在输入的内容尝试向用户提供信息。这里需要注意的关键点是图中补全文本是如何被高亮（选中）的，这意味着如果用户输入另一个字符，将覆盖补全文本。这自然会触发另一个带有新响应和新补全文本的\
  \ Ajax 请求。这种“舞步”一直持续，直到用户得到所需的输入。\n\n关于 Completer 应用 Ajax 请求中的数据，一个值得注意的有趣点是它是如此简单。那里没有任何\
  \ XML，实际上也没有任何数据格式。事实上，你每次实际上只向服务器往回发送几个字符。为了让你理解我的意思，让我们快速过一遍一个涉及美国历史著名人物托马斯·爱迪生（Thomas\
  \ Edison）的示例。你通过在文本框中输入 `t` 或 `T` 开始输入这个名字。此时，文本框包含以下内容：\n\n```\nT\n```\n\n由于你输入了一个字符，会立即发送一个\
  \ Ajax 请求，文本 `ecumseh` 返回到文本框中与你输入的 `T` 一起显示：\n\n```\nTecumseh\n```\n\nTecumseh\
  \ 是死于 1812 年战争的著名肖尼印第安领袖。Completer 应用最初建议了 `Tecumseh` 这个名字，是因为在可能的补全列表中，`Tecumseh`\
  \ 的字母顺序在 `Thomas Edison` 之前。你会在章节稍后的后的部分看到这个列表，但现在你希望能够看到列表的字母属性是如何影响补全过程的。\n\n\
  如果你继续输入另一个字母，这次是 `h`，文本 `ecumseh` 会立即被 `h` 替换，得到如下结果：\n\n```\nTh\n```\n\n发送了另一个\
  \ Ajax 请求，这次返回的是 `eodore Roosevelt`。天哪，我们到底能得到托马斯·爱迪生吗？这里是文本框现在的内容：\n\n```\nTheodore\
  \ Roosevelt\n```\n\n显然，`Theodore Roosevelt` 比 `Thomas Edison` 更近了一步，但在字母顺序上仍然在其之前，这就是为什么会建议这个名字。事实证明，只需多输入一个字符就能最终锁定爱迪生先生：\n\
  \n```\nTho\n```\n\n服务器接收到又一个 Ajax 请求并返回 `mas Edison`，导致文本框内容如下：\n\n```\nThomas Edison\n\
  ```\n\n现在你得到了你想要的名字，总共 13 个字符，但你只需要输入了其中的三个。这就是自动补全功能的威力。希望这个小练习不仅揭明了该功能的实用性，还揭明了实现该功能所需的\
  \ Ajax 请求和响应的本质。\n\n### 客户端请求\n\nCompleter 应用的客户端请求非常简单，它会在用户在文本输入控件中输入时发送用户输入。这些用户输入只是原始的文本字符，没有任何特殊的格式化。在很多情况下，输入只是几个字符，但在没有自动补全匹配且用户继续输入的情况下，字符可能会更多。尽管如此，你谈论的是几十个字符，而不是几百个字符。\n\
  \n| | |\n| :--- | :--- |\n| ![](https://www.blogspot.com/img/2012/03/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 幸运的是，对于 Ajax 请求来说，你发送多少字符实际上并不重要，尽管发送的数据越多，请求传输的时间就越长。然而，从宏观角度来看，你讨论的仍然是非常小量的数据。\
  \ |\n\n在移动服务器响应细节之前，值得解决一个针对像 Completer 这样的 Ajax 应用提出的担忧。我指的是 Completer 能够响应用户输入字符而发出一连串请求。虽然\
  \ Completer 的服务器端脚本简单且快速，仅依赖嵌入在 PHP 代码中的数据，但一个具有较大数据集的应用程序可能会从数据库获取补全文本。这意味着每当用户输入一个字符时，你都会面临一次数据库查询，这可能是一个问题。\n\
  \n这里的问题在于，大量的数据库查询可能会压垮数据库服务器。对于你使用自动补全功能构建的任何 Ajax 应用来说，这可能是问题，也可能不是，但这是一个警告：要让任何频繁调用的\
  \ Ajax 代码极其高效；即对最少的数据进行最少的处理。如果你仍然遇到问题，可能需要探索一种能够为高频率小数据请求产生更好结果的服务器配置。先不要恐慌——将此视为一个留作备后参考的小型提醒即可。可能你不会遇到任何问题。\n\
  \n### 服务器响应\n\nCompleter 应用中的服务器脚本被赋予了根据输入的文本匹配并返回补全文本的任务。与书中的许多其他应用程序（它们返回经过仔细\
  \ XML 格式化的数据）不同，Completer 简单地返回用户已经输入的文本片段。这意味着你可以在客户端获取它并直接使用它，而无需解析任何 XML。\n\n\
  尽管 Completer 应用中的服务器响应很短小，但它们发生的频率高得多，因为它们在用户输入每个字符时都会触发。这不一定是一个问题，但它是不要在列表中使用巨大补全文本的理由。\n\
  \n### 理解客户端到服务器的对话\n\n尽管你可能已经弄明白了这种特定的客户端-服务器交换，图 6.4 显示了 Ajax 请求和随后的响应如何与浏览器（客户端）以及\
  \ Web 服务器关联。\n\nCompleter 应用双方往返发送的文本数据非常小，通常只有几个字符或单词。如果你回顾章节早些时候关于“Thomas Edison”文本补全示例的数据交换，你会注意到每个\
  \ Ajax 请求中都发送了一个用户输入字符序列。这些请求由 `completer.php` 服务器脚本处理。以下是一个 Ajax 请求的 URL 示例，它将字符\
  \ `T` 作为用户输入发送：\n\n```\ncompleter.php?input=T\n```\n\n\n\n\n\n```\ncompleter.php?input=Th\n\
  ```\n\n这一次，文本 `Th` 被发送到服务器脚本，这将产生更准确的补全。服务器的响应是猜测 `Theodore Roosevelt`（西奥·罗斯福），这更接近了但尚未完全。最后，需要一个包含三个字符输入的\
  \ URL 才能获得正确的补全：\n\n```\ncompleter.php?input=Tho\n```\n\n在这个示例中，服务器返回了文本 `mas Edision`，这是名字托马斯·爱迪森（Thomas\
  \ Edison）的补全文本（`Tho` + `mas Edison`）。用户现在可以接受该补全，并点击“了解更多”按钮以获取更多关于托马斯·爱迪森的信息。Completer\
  \ 应用的数据交换实际上仅此此。\n\n## 组装 Completer \n\nCompleter 中的数据交换非常直观，应用程序的结构也相当简单，仅包含两个文件：\n\
  \n* HTML Web 页面 (`completer.html`)\n* PHP 服务器脚本 (`completer.php`)\n\n这两个文件直接对应应用程序的客户端\
  \ (`completer.html`) 和服务器端 (`completer.php`) 部分；没有需要处理的独立数据源或第三方 Web 服务。Completer\
  \ Web 页面发布 Ajax 请求，这些请求由 PHP 服务器脚本直接处理，然后脚本返回由页面中的 JavaScript 代码处理的数据。\n\n在实际上，你稍后在\
  \ `completer.php` 代码中看到的补全单词和短语列表，理想情况下应该存在某种数据库中。某些自动补全列表可能会很大，而真正的数据库在执行大型数据集搜索时可能比纯\
  \ PHP 代码更高效。然而，在这个示例中，我为了简单起见，直接将补全列表编码为 PHP 服务器脚本中的一个数组。只要你的补全列表大小不会变得过于臃肿，你这样做也是没问题的。\n\
  \n### Completer Web 页面\n\nCompleter 应用的 HTML Web 页面 (`completer.html`) 用户界面极其简单，仅包含一个文本输入控件和一个用于查询输入的历史名称的按钮。图\
  \ 6.5 显示了在 Web 浏览器中打开等待用户输入的页面。\n\n##### 图 6.5. Completer Web 页面初始时有一个空的输入框，等待用户输入历史名称。\n\
  \n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqzmlhmc9nx2hzddzsmdzj.jpg)![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawowl2cuahnnnnawyzy-.jpg)\n\
  \n该用户界面主要通过以下 HTML 代码的主体建立：\n\n代码视图：\n\n```html\n<body onload=\"document.getElementById('name').value\
  \ = '';\n  document.getElementById('name').focus()\">\n  <div id=\"ajaxState\" style=\"\
  display:none\"></div>\n  <br />\n  <div>\n    Enter a historical name:\n    <input\
  \ id=\"name\" type=\"text\" size=\"32\"\n      onkeyup=\"getCompletion(this, event)\"\
  \ />\n    <input id=\"learnButton\" type=\"button\" value=\"Learn More...\" onclick=\"\
  showBiography()\" />\n  </div>\n</body> \n```\n\n这段代码揭示了页面如何由两个输入控件组成——一个是一个文本框，另一个是按钮。注意，文本框在体体的\
  \ `onload` 事件处理器中被清空，并且焦点也被设置到了它。对于任何初始动作是用户输入文本的 Web 页面，后操作都是好主意。Google 是这种策略的良好示例——焦点始终设置在搜索文本框上。\n\
  \n同时注意，文本输入控件的 `onkeyup` 事件处理器被设置为调用 `getCompletion()` 函数。该函数负责启动 Ajax 请求以从 Web\
  \ 服务器检索补全建议。以下是该函数的代码：\n\n```javascript\nfunction getCompletion(inputControl, evt)\
  \ {\n  evt = evt ? evt : (event ? event : null);\n  if (evt) {\n    // 忽略不参与文本输入的按键\n\
  \    var key = evt.charCode ? evt.charCode : evt.keyCode;\n    if (key < 32 || (key\
  \ >= 33 && key <= 46) ||\n     (key >= 112 && key <= 123))\n      return;\n\n  \
  \  // 存储当前输入\n    currentInput = inputControl.value;\n\n    // 发送 Ajax 请求加载补全\n\
  \    ajaxSendRequest(\"GET\", \"completer.php?input=\" +\n      encodeURIComponent(inputControl.value),\n\
  \      handleCompletionRequest);\n  }\n}\n```\n\n注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 在章节的前面部分，我提到过与此类 Ajax 请求相关的潜在性能问题，即在响应按键时会发出大量请求。解决此类问题的一种巧妙方法是为发布补全请求设置定时器，而不是在每次按键时都发布请求。例如，你可以每秒检查两次是否有新按键，在这种情况下，补全文本出现方面的效果大致相同，但请求的最大数量被限制为每秒两次。\
  \ |\n\n该函数中的大部分初始代码处理了浏览器在处理处理方式方面的不一致性。在这种情况下，你感兴趣的是获取按键释放的值，这涉及一些技巧以确保代码可以在任何主流浏览器中运行。一旦解析出按键的字符码，就会将其与几个按键范围进行比较，以确保它确实是有效的输入文本。这防止了如\
  \ `Shift` 或 `Enter` 等控制键被解释为有效数据输入，否则它们会触发 Ajax 自动补全请求。\n\n如果用户输入确实有效，它会被存储在一个名为\
  \ `currentInput` 的全局变量中。然后根据文本框中的文本构建 Ajax 请求的服务器 URL，并将请求发送到服务器。注意 `handleCompletionRequest()`\
  \ 函数负责在 Ajax 请求返回响应时处理调用。以下是该函数的代码：\n\n代码视图：\n\n```javascript\nfunction handleCompletionRequest()\
  \ {\n  if (request.readyState == 4 && request.status == 200) {\n    // 获取响应文本并删除任何尾随空格\n\
  \    var completion = request.responseText.replace(/\\s$/$/g, \"\");\n\n    // 只有当输入控件仍包含\n\
  \    // 当前输入时，才发布 Ajax 请求\n    var inputControl = document.getElementById(\"name\"\
  );\n    if (completion && (inputControl.value == currentInput)) {\n      if (inputControl.setSelectionRange)\
  \ {\n        // 为非 IE 浏览器将补全添加到输入控件中\n        var inputLen = inputControl.value.length;\n\
  \        inputControl.value += completion;\n        inputControl.setSelectionRange(inputLen,\n\
  \          inputControl.value.length);\n      }\n      else if (inputControl.createTextRange)\
  \ {\n        // 为 IE 将补全添加到输入控件中\n        var sel = inputControl.createTextRange();\n\
  \        sel.text += completion;\n        sel.moveStart(\"character\", -completion.length);\n\
  \        sel.moveEnd(\"character\", 0);\n        sel.select();\n      }\n    }\n\
  \  }\n  ajaxUpdateState();\n} \n```\n\n`handleCompletionRequest()` 函数接收每个 Ajax 服务器响应，并负责将补全文本小心地插入文本框并选中它。尽管这项任务听起来足够简单，但浏览器的不兼容性再次导致了两个代码分支：一个适应\
  \ IE，另一个适应其他浏览器。在 Web 演进的这个阶段，我们仍然需要处理像在文本框中选择文本这样简单的事情的完全不同的方法，这令人遗憾。但抱怨并不能让这个应用程序运行得更快！\n\
  \n\n\n\n\n回回 `handleCompletionRequest()` 函数的开头，你会看到一行代码，它处理了服务器响应文本并将其存储在 `completion`\
  \ 变量中。这种处理是必要的，因为响应文本在从服务器发送到客户端的过程中拾入了一些额外的字符。这些字符出现在文本的末尾，很可能是 PHP 脚本中 `echo`\
  \ 命令的结果，尽管该命令本不应该在文本末尾添加换行符、新行或其他任何字符。无论如何，在继续执行之前，使用了标准的文本 `replace()` 方法来去除响应文本末尾多余的字符。\n\
  \n`handleCompletionRequest()` 函数的剩余部分包含了两种不同的技术，用于将补全文本添加到文本框中选中它。注意，在代码分支到特定浏览器的代码之前，会对\
  \ `currentInput` 变量与文本框的值进行比对。这是一个重要的检查，因为它确保了 Ajax 请求与触发它的输入相匹配。有人可能打字非常快，输入字符的速度超过了\
  \ Ajax 请求解析的速度。在这种情况下，你只希望最后一次请求生效。这段代码有助于确保这种情况的发生。\n\n尽管这两个特定浏览器的代码分支在细节上有所不同，但它们的作用相同：\n\
  \n*   将补全内容添加到文本框中用户输入的末尾。\n*   选中文本框中的补全内容，这样如果用户输入另一个字符，补全内容将被自动擦除。\n\n到此，自动完成功能的客户端部分结束了，但这并不是\
  \ Completer Web 页的终。如果你查看页面 `body` 的 HTML 代码，会在用户点击“了解更多”（Learn More）按钮时调用一个名为 `showBiography()`\
  \ 的函数。以下是该函数的代码：\n\n```\nfunction showBiography() {\n  // 根据输入的历史名称在维基百科中打开链接\n\
  \  if (document.getElementById(\"name\").value != \"\")\n    window.location = \"\
  http://en.wikipedia.org/wiki/\" +\n      encodeURIComponent(document.getElementById(\"\
  name\").value);\n}\n```\n\n这里的目的是让应用程序对输入的历史名称执行某些有意义的操作。因此，`showBiography()` 函数获取历史名称（文本框的内容），并使用它来构建指向维基百科在线全书的\
  \ URL。该 URL 的格式如下：`http://en.wikipedia.org/wiki/Thomas_Edison`\n\n在这个示例中，Thomas\
  \ Edison 这个名字被简单地接到一个模板 URL 的末尾，你可以在 `showBiography()` 函数的代码中看到这一点。然后，通过将其赋值给 `window.location`\
  \ 属性在当前浏览器实例中打开该 URL，这类似于在浏览器的地址栏中输入。换句话说，当你将 `window.location` 属性设置为特定 URL 时，它会强制浏览器导航到该\
  \ URL。\n\n## Completer 服务器脚本\n\nCompleter 应用程序的服务端涉及一个名为 `completer.php` 的 PHP 服务器脚本。该脚本不仅负责请求并响应补全，还作为可能补全列表的数据仓库。我在本章前面的部分提到过，这个列表存储在真正的数据库中可能会更好，特别是对于使用大型补全列表的应用程序，但为了简单起见，该列表在本应用程序的\
  \ PHP 脚本中运行良好。\n\n以下是 `completer.php` 服务器脚本的简缩代码：\n\n代码视图：\n\n```php\n<?php\n$people\
  \ = array(\n  \"Abraham Lincoln\",\n  \"Adam Smith\",\n  \"Adolf Hitler\",\n  \"\
  Albert Einstein\",\n  \"Alexander Fleming\",\n  \"Alexander Graham Bell\",\n  \"\
  Alexander Hamilton\",\n  \"Alexander the Great\",\n  \"Alfred T. Mahan\",\n...\n\
  \  \"William Harvey\",\n  \"William Shakespeare\",\n  \"William T.G. Morton\",\n\
  \  \"William the Conqueror\",\n  \"Willis Haviland Carrier\",\n  \"Woodrow Wilson\"\
  ,\n  \"Ziryab\"\n);\n$input = strtolower($_GET['input']);\n$inputLen = strlen($input);\n\
  \nif ($inputLen > 0) {\n  for ($i = 0; $i < count($people); $i++) {\n    if (strtolower(substr($people[$i],\
  \ 0, $inputLen)) ==\n      $input) {\n      echo substr($people[$i], $inputLen,\n\
  \        strlen($people[$i]) - $inputLen);\n      break;\n    }\n  }\n}\n?> \n```\n\
  \n该脚本中最重要的代码是历史人物数组，它以引号内字母顺序名称列表的形式列出。注意每个名称都用逗号分隔，且整个列表包含在括号内。这是 PHP 数组的标准格式，我指出这一点是为了让你在修改补全列表或创建自己的列表时保持这种格式。\n\
  \nCompleter 应用程序中我尚未提到的一个微妙细节是，它并不关心用户输入的大小写。换句话说，如果你输入 `tho`、`Tho` 或 `tHo`，它都会匹配\
  \ `Thomas Edison`。负责此代码是补全列表下方调用标准 `strtolower()` 函数的第一行。\n\n服务器脚本中的剩余代码的任务是逐个搜索补全列表，寻找与输入文本的匹配项。如果找到匹配项，则将其输出到客户端，脚本结束。这是一个重要的细节，揭示了为什么补全列表必须按字母顺序排列——输入文本的第一个匹配项总是返回的。因为第一个匹配项总是获胜，获得一致结果的唯一方法是对列表进行字母排序。在本章稍后的位置，我提供了一个小技巧，你可以使用\
  \ Microsoft Word 自动对列表进行字母排序——如果你有一个巨大的乱序的列表，这非常有帮助。\n\n现在你已经把应用程序的两个部分组合在一起，是时候进入最有趣的开发阶段了：测试！\n\
  \n### 测试 Completer\n\nCompleter 应用程序在测试方面非常简单，因为你只需要开始打字并看会发生什么。图 6.6 显示了在文本框中输入字符\
  \ `C` 后的应用程序状态。\n\n#### 图 6.6. 在 Completer 应用程序的文本框中输入单个字符会导致尝试补全。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqzmlhmc9nx2hzddsmmdj.jpg)[](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawowl2cuahnnnnawyzc-.jpg)\n\
  \n找到第一个以 `C` 开头的历史人物是查理曼（Charlemagne），这在图中显而易见。因为补全文本被自动选中，如果该名称不是正确的匹配项，你可以继续输入。继续输入字符\
  \ `o`，如你预期的那样得到了另一个名称（参见图 6.7）。\n\n#### 图 6.7. 随着你继续输入字符，应用程序继续寻找补全的最佳匹配项。\n\n[[查看全尺寸图像]](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wlmdwcglqzmlhmc9nx2hzddzsmdhj.jpg)[](mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawowl2cuahnnnnawyzg-.jpg)\n\
  \n啊，孔子说这就是我要的名字，所以我将停止打字并点击“了解更多”按钮以获取更多关于这位中国哲学家的信息。\n\n只需点击按钮，就能获得关于你通过自动完成功能输入的人物名称的丰富信息。Completer\
  \ 应用程序的维基百科部分在任何方面都不至关重要，但它确实增添了一点实用的趣味。\n\n\n\n\n\nCompleter 应用是书中适用范围最广泛的示例之一，因为它几乎可以应用于任何文本输入，只要能够以某种方式预测用户可能输入的内容。当你考虑在自己的页面上使用自动补全功能时，关键在于隔离出那些预测性足够、能够用单词或短语列表进行建模的文本输入，但其预测性又又不至于到让一个选择列表更符合你的需求。\n\
  \n作为一个自动补全可能属于过度使用的例子，请考虑帮助用户输入美国州名称的情况。由于美国各州的州列表是有限且相对较小的，让用户直接从州名列表中选择可能更有意义。另一方面，也许你可能想使用自动补全来帮助某人输入宠物名称。虽然这最终可能是自动补全的一个可行应用，但可能名称的列表如此庞大且开放，可能并不值得尝试去帮助。点在于，自动补全确实是一个极其实用的用户输入工具，但在假设使用自动补全是有意义之前，你应该确保已经彻底思考具体的输入类型。\n\
  \n### 使用 Completer 应用\n\n在结束完这段小小的吐槽后，让我告诉你，你对 Completer 应用应该尝试的第一件事是完全更换补全列表。考虑其他可以帮助用户的酷文本输入场景。然后更改\
  \ `completer.php` 服务器脚本中的数据集；只需确保列表保持字母顺序排序即可。该应用程序将立即尝试使用你新的补全列表对文本输入进行自动补全。\n\n\
  #### 提示\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglwlnavamhzaxrnyw--.jpg)\
  \ | 如果你正在为 Completer 应用构建单词和/短语列表，且它们尚未按字母顺序排序，我有一个小技巧可以为你节省一些时间和精力的。你需要访问 `Microsoft\
  \ Word`，但考虑到如今 Microsoft Office 的普及程度，这应该不会太困难。在 Word 中创建一个新文档，然后将你的补全列表复制并粘贴进去。选择所有补全项，然后点击\
  \ Word 菜单上的“表格”（Table）。然后从“表格”菜单中选择“排序”（Sort）。会弹对话框。确保选中了“升序”（Ascending）单选框，然后点击“确定”。完成！你的列表现在已经按字母排序了。\
  \ |\n\n将 Completer 应用应用于你自己的网站的另一个实际可能性是为你的网站添加一个上下文敏感的搜索框。例如，假设你经营一个专门从事极限运动的网站。你可以提供一个使用自动补全来建议极限运动术语和人物的搜索框。你已经知道如何通过自动补全帮助用户向文本控件输入文本，所以你只需要将输入文本路由到\
  \ Google 并执行搜索的技巧。\n\n启动 Google 搜索只需将你的 Web 页面重定向到包含搜索字符串的 Google URL 即可。以下是此类 Google\
  \ URL 的示例：[`www.google.com/search?q=tony+hawk`](http://www.google.com/search?q=tony+hawk)\n\
  \n此示例 URL 搜索文本 \"tony hawk\"，这会找到大量职业滑板运动员 Tony Hawk 的匹配项。注意这里使用了加号（`+`）。\n\n```\n\
  var searchText = document.getElementById(\"name\").value.replace(\" \", \"\");\n\
  window.location = \"http://www.google.com/search?q=\" + searchText;\n```\n\n###\
  \ 总结\n\n本章深入探讨了实时验证，并探索了何时以及何地将此类功能注入你自己的应用程序是有意义的。你还暂时离开 Ajax，学习如何验证电话号码、日期和电子邮件地址等数据类型。随后，当你处理一个涉及邮政编码验证的实际示例时（该示例会实时查询相应的城市和州），Ajax\
  \ 将再次上线。\n\n## 第 7 章：创建带有实时验证的响应式 GUI\n\n#### Ajax 洁洁剂\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglwlnavamhzaxrnyw--.jpg)\
  \ | 你知道它迟早会发生，为什么还要再等呢？也许 Ajax 最为人知的用法是高露洁-宝洁民公司（Colgate-Palmolive）于 1947 年推出的全能清洁剂。该清洁剂以这位强大的希腊英雄命名。\n\
  \nAjax 的真正杀手应用之一是实时用户输入验证，这意味着用户在输入数据时就会检查这些数据的有效性。这可以极大地提高用户界面的效率，因为错误在产生时就会被捕获，从而消除了提交整个表单来发现问题的需要。此外，当应用程序给用户提供即时反馈时，感觉更加智能。事实证明，许多实时验证在技术上并不需要\
  \ Ajax，但在某些需要从服务器加载数据的情况下，它仍然起着作用。\n\n本章中的 Validator 应用使用了以下文件，它们位于随书 CD-ROM 中的\
  \ `chap07` 示例代码文件夹中：\n\n*   `validator.html`—主 Web 页面\n*   `ziplookup.php`—根据邮政编码查找城市/州的服务器脚本\n\
  *   `ajaxkit.js`—Ajax Toolkit 的核心 Ajax 函数\n*   `domkit.js`—Ajax Toolkit 的 DOM 相关的函数\n\
  *   `validatekit.js`—Ajax Toolkit 的验证函数\n*   `wait.gif`—在 Ajax 请求期间显示的动画“加载”图标\n\
  \n## 挑战：实时检查用户输入\n\n本章提出的挑战非常广泛——通过在产生错误的时间点立即消除输入错误，来提高从用户处获取信息的效率。如果你使用像 Microsoft\
  \ Word 这样具有实时拼写检查器的文字处理器，那么你就理解这个功能有多么方便了。在许多方面，上一章中的自动补全应用可以被认为大致类似于一个实时验证器。\n\n\
  \n\n\n要查看实用的验证器演示，请访问 Google 的 Gmail 在线邮件服务：[`mail.google.com/`](http://mail.google.com/)。Gmail\
  \ 中的邀请功能允许你向朋友发送邀请加入 Gmail。邀请请求需要朋友的电子邮件地址，这正是你应该在文本框中输入的内容。如果电子邮件地址格式不正确，Gmail\
  \ 会在电子邮件地址文本框下方显示“无效地址”（invalid address）消息。\n\nGmail 在验证方面并不像某些 Ajax 应用那样激进，这一点体现在你必须\
  \ Gmail 执行验证之前，必须先点击“发送邀请”（Send Invite）按钮。一种更激进的方法是在用户离开电子邮件文本框时立即对地址进行验证。这种方法通常用于\
  \ Ajax 应用，并且在大多数情况下被视为一种改进，因为它可以在数据输入后恰好拦截无效数据的输入。\n\n现代用户输入验证方法的通用理念是消除为了通过刷新页面来检查数据有效性的需求。在许多情况下，你可以消除整个与服务器的交互，完全在客户端内部进行验证。严格来说，如果没有涉及服务器，这种验证就不是真正在使用\
  \ Ajax。然而，应用程序仍然可以通过客户端验证获得一种“Ajax 感觉”。本章的挑战既涉及仅客户端的验证，也涉及真正的 Ajax 验证。\n\n说到挑战，本章并没有专注于完成某个核心任务，转而专注于演示如何验证几种不同类型的用户输入。当然，可以构思一些涉及数字、日期、电子邮件地址、电话号码和邮政编码的示例，但额外的开销会分散对真实重点——验证数据的注意力。因此，Validator\
  \ 应用程序的挑战仅仅是展示几个用户输入文本框，每个文本框关联到特定的数据类型，并在用户浏览用户界面时对每个文本框进行实时验证。\n\n以下是 Validator\
  \ 应用程序目标进行验证的数据类型：\n\n* 整数（Integer）\n* 数字（Number）\n* 电话号码（Phone number）\n* 电子邮件地址（Email\
  \ address）\n* 日期（Date）\n* 邮政编码（ZIP code）\n\n验证的关键不仅在于仅仅弹出一个恼人的警报框来告诉用户其输入是错误的。事实上，警报框是通知用户输入问题的糟糕方法。更好的方法是在表单上悄悄提供帮助字段，这些字段在发生验证问题之前是不可见的，一旦发生，你就会为用户显示帮助文本。例如，当用户输入无效日期时，你可以显示帮助文本：\n\
  \n```\n\"请输入日期（例如，01/14/1975）。\"\n```\n\n帮助文本在数据错误时出现，一旦数据被修复，它就会神奇地消失。\n\n当然，这种“魔法”在于支持帮助文本功能的验证代码。该代码是\
  \ `validatekit.js` 文件的一部分，该文件作为随书光盘中 Ajax Toolkit 的一部分，也是 Validator 示例应用程序源代码文件的一部分。正如在第\
  \ 2 章“在 Ajax 应用程序内部”中提到的那样，`validatekit.js` 文件提供了几个你可以使用的 JavaScript 函数，用于验证不同类型的数据。具体来说，`validatekit.js`\
  \ 文件暴露了以下可用于验证用户输入数据的 JavaScript 函数：\n\n* `validateNonEmpty()`——数据是否为空？\n* `validateInteger()`——数据是否为有效整数？\n\
  * `validateNumber()`——数据是否为有效数字？\n* `validateZipCode()`——数据是否为有效邮政编码？\n* `validatePhone()`——数据是否为有效电话号码？\n\
  * `validateEmail()`——数据是否为有效电子邮件地址？\n* `validateDate()`——数据是否为有效日期？\n\n如你所见，这些函数恰好与\
  \ Validator 应用程序目标的数据类型完美匹配。这意味着挑战变得简单得多，因为你现在有了可以使用的标准 JavaScript 函数来验证每种数据类型。挑战主要变成了思考如何将这些函数连接到\
  \ Validator 页面上的 HTML 元素，以便文本框内的数据能够被正确地路由到 JavaScript 函数。此外，你还需要为每个文本框创建显示帮助文本的\
  \ HTML 元素，以便验证函数可以显示帮助文本。\n\n到此时，你可能想知道 Ajax 到底在 Validator 公式中处于什么位置，答案是它并不……至少还没有。应用程序目标的所有数据类型都可以在客户端完美地验证，无需服务器的任何帮助。或者至少数据格式可以在客户端进行验证。邮政编码数据有点特殊，因为你可以在客户端验证邮政编码的格式（例如，精确的五个数字），但你将不知道该邮政编码在现实世界是否真实有效。换句话说，该邮政编码是否在使用？\n\
  \n检查邮政编码有效性的唯一方法是在真实的邮政编码数据库中查找，以查看它是否确实真实。该数据库可以告诉你 90210 确实是一个真实的邮政编码，它代表加州的比弗利山庄（Beverly\
  \ Hills, CA）。事实证明，此类数据库已经存在，可以通过 Ajax 请求访问。更好的是，它们大多数可以使用 XML 格式为你提供数据，方便在你的 Ajax\
  \ 代码中进行排序。因此，Ajax 通过查找邮政编码对应的城市和州来进入 Validator 应用程序，以验证该邮政编码的真实性。\n\n现在你有了一个相当完整的验证挑战，涉及几次客户端数据验证，以及一个涉及邮政编码及其相应城市和州的真正的\
  \ Ajax 验证。你现在可以将注意力转移到 Validator 应用程序的设计上。\n\n## 第 7 章 创建具有实时验证的响应式 GUI\n\n### Ajax\
  \ 清洁剂\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 你知道它迟早会到来，所以为什么要多等呢？也许 Ajax 这个词最为人知的用法是高露洁-宝洁华公司在 1947 年推出的多功能清洁剂。这种清洁剂以强大的希腊英雄阿贾克斯（Ajax）命名的，这导致了\
  \ Ajax 产品的口号：“比污垢更强大！” |\n\nAjax 的真正杀手级应用之一是实时用户输入验证，这意味着用户在输入数据时，系统就会检查其有效性。这可以极大提高用户界面的效率，因为错误在产生时就会被捕获，从而消除了提交整个表单来检查是否存在问题的需求。此外，当应用程序对数据输入提供即时反馈时，感觉会更智能。事实证明，许多实时验证技巧在技术上并不需要\
  \ Ajax，但在某些需要从服务器加载数据作为验证部分的实例中，它仍然起着作用。\n\n本章深入探讨实时验证，并探索在何时以及何地将此类功能注入你自己的应用程序中是合理的。你还将暂时离开\
  \ Ajax，学习如何验证电话号码、日期和电子邮件地址等数据类型。随后，当你处理一个涉及邮政编码验证的实用示例时，Ajax 将再次上线，该示例会对相应的城市和州进行实时查询。这是一个非常实用的\
  \ Ajax 技巧，你可以用它显著简化位置/地址信息的输入。\n\n本章中的 Validator 应用程序使用了以下文件，它们位于随书 Linux 光盘的 `chap07`\
  \ 示例代码文件夹中：\n\n* `validator.html`——主 Web 页面\n\n\n\n\n* `ziplookup.php`—根据邮政编码查找城市/州的服务器脚本\n\
  * `ajaxkit.js`—Ajax Toolkit 的核心 Ajax 函数\n* `domkit.js`—Ajax Toolkit 的与 DOM 相关的函数\n\
  * `validatekit.js`—Ajax Toolkit 的验证函数\n* `wait.gif`—在 Ajax 请求期间显示的动画“加载”图标\n\n##\
  \ 挑战：实时检查用户输入\n\n本章提出的挑战非常广泛——通过在输入错误发生的位点立即消除它们，来改进从用户处获取信息。如果你使用诸如 `Microsoft\
  \ Word` 这样具有实时拼写检查器的文字处理程序，你就能理解这个功能有多么方便了。在很多方面，上一章中的自动补全应用可以被认为大致类似于实时验证器。然而，尽管这两项任务通常密切相关，但自动补全更多是为了提高效率，而不是纠正错误。\n\
  \n为了查看实际验证器的运行情况，请查看位于 [`mail.google.com/`](http://mail.google.com/) 的 `Google's\
  \ Gmail` 在线邮件服务。`Gmail` 的邀请功能允许你向朋友发送邀请加入 `Gmail`。邀请请求需要朋友的电子邮件地址，这就是你应该在文本框中输入的内容。格式不当的电子邮件地址会导致\
  \ `Gmail` 在电子邮件地址文本框下方显示“无效地址”消息。\n\n`Gmail` 在验证方面不像某些 Ajax 应用那样激进，这一点是显而易见的，你必须在\
  \ `Gmail` 执行验证之前点击 `Send Invite`（发送邀请）按钮。一种更激进的方法是在用户离开电子邮件文本框时立即对地址进行验证。这种方法通常用于\
  \ Ajax 应用中，在大多数情况下被视为一种改进，因为可以在无效数据一经输入时就拦截它。\n\n现代用户输入验证方法的通用思想是，消除为了通过刷新页面来检查数据是否有效的需求。在许多情况下，你可以消除整个与服务器的交互，完全在客户端内部执行验证。严格来说，如果没有涉及服务器，验证就不是真正在使用\
  \ `Ajax`。然而，应用程序中具有 `Ajax` “感官”的理念仍然可以通过客户端验证来实现。本章的挑战既涉及纯客户端也涉及真正的 `Ajax` 验证。\n\
  \n说到这个挑战，本章并没有专注于完成某项核心任务，而是专注于演示如何验证几种不同类型的用户输入。当然，可以构思一些涉及数字、日期、电子邮件地址、电话号码和邮政编码的示例，但额外的开销会分散对真实重点——验证数据的注意力。因此，`Validator`\
  \ 应用的挑战仅仅是展示几个用户输入文本框，每个框都与特定的数据类型关联，并在用户穿过用户界面时实时对每一个进行验证。\n\n以下是 `Validator` 应用针对验证的目标的数据类型：\n\
  \n* 整数 (Integer)\n* 数字 (Number)\n* 电话号码 (Phone number)\n* 电子邮件地址 (Email address)\n\
  * 日期 (Date)\n* 邮政编码 (ZIP code)\n\n验证的关键不仅仅是仅仅弹出一个烦人的警框来让用户知道输入是错误的。事实上，警框是通知用户输入问题的最糟糕方法。更好的方法是在表单上悄悄提供帮助字段，这些字段在发生验证问题之前是不可见的，发生问题时你为用户显示帮助文本。例如，你可能会显示帮助文本\n\
  \n```\n\"Please enter a date (for example, 01/14/1975).\"\n```\n\n当用户输入无效日期时，帮助文本会出现，一旦数据被修复，它就会神奇地消失。\n\
  \n当然，这种“魔法”在于支持帮助文本功能的验证代码中。这段代码是随书光盘附带的 `Ajax Toolkit` 中 `validatekit.js` 文件的一部分，也是\
  \ `Validator` 示例应用程序源代码文件的一部分。正如最初第 2 章](#ch02.html_ch02)“Ajax 内部”中所提到的，`validatekit.js`\
  \ 文件提供了几个你可以使用的 JavaScript 函数来验证不同类型的数据。具体来说，`validatekit.js` 文件暴露了以下可用于验证用户输入数据的\
  \ JavaScript 函数：\n\n* `validateNonEmpty()`—数据为空吗？\n* `validateInteger()`—数据是有效的整数吗？\n\
  * `validateNumber()`—数据是有效的数字吗？\n* `validateZipCode()`—数据是有效的邮政编码吗？\n* `validatePhone()`—数据是有效的电话号码吗？\n\
  * `validateEmail()`—数据是有效的电子邮件地址吗？\n* `validateDate()`—数据是有效的日期吗？\n\n如你所示，这些函数恰好与\
  \ `Validator` 应用的目标数据类型匹配。这意味着挑战变得容易得多了，因为你现在可以使用标准的 JavaScript 函数来验证每种数据类型。挑战主要变成了思考如何将这些函数连接到\
  \ `Validator` 页面上的 HTML 元素，以便文本框中的数据被正确路由到 JavaScript 函数中。此外，你还需要为每个文本框创建显示帮助文本的\
  \ HTML 元素，以便验证函数可以显示帮助文本。\n\n此时你可能想知道 `Ajax` 究竟在 `Validator` 的方程式中处于什么位置，答案是它不在……至少目前还没有。应用程序针对的所有数据类型都可以在没有服务器协助的情况下在客户端完美完成验证。或者至少数据的格式可以在客户端进行验证。邮政编码数据有点特殊，因为你可以在客户端验证邮政编码的格式，但你不知道该编码在现实世界是否真实有效。检查邮政编码有效性的唯一方法是在真实的邮政编码数据库中查找，查看它是否真实。这样的数据库能够告诉你\
  \ 90210 确实是一个真实的邮政编码，它代表 `Beverly Hills, CA`。事实证明，这样的数据库已经存在，并且可以通过 `Ajax` 请求访问。更好的是，大多数可以以\
  \ `XML` 格式为你提供数据，便于在你的 `Ajax` 代码中处理。因此，`Ajax` 通过查找邮政编码对应的城市和州进入了 `Validator` 应用。\n\
  \n### 设计：设计一个验证应用程序\n\n`Validator` 应用的设计希望比书中的其他应用程序更直观，主要因为离散的用户输入数据是相互独立验证的。你的设计工作基本上仅仅是为每个用户输入文本框调用相应的\
  \ `validatekit.js` 验证函数。然后通过 `Ajax` 请求，通过从 Web 服务查找城市和州，为邮政编码提供额外的验证层。\n\n图 7.1\
  \ 显示了该应用程序用户界面的大致解释，揭示了帮助字段是如何排列在每个输入文本框旁边的。\n\n##### 图 7.1. Validator 应用界面由几个文本框及其相关的帮助文本字段组成。\n\
  \n![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawcwl2cuahnmn2kwyzi-.jpg)\n\
  \n\n\n\n你可以从图中看到每个文本框如何与特定类型的数据相关，例如电话号码、电子邮件地址等。每个文本框旁边的帮助字段用于传递有关该文本框内数据有效性的帮助信息。唯一的例外是邮政编码（ZIP\
  \ code）的帮助字段，它具有双重职责，作为通过 Ajax 请求检索的城市和州的显示字段。\n\n说到针对邮编字段的 Ajax 请求，显示一个动画“加载”图像会非常方便，可以让用户知道应用程序正忙于根据邮编查找城市和州。此图像\
  \ `wait.gif` 显示在图 7.2 中。\n\n##### 图 7.2. Validator 应用程序使用动画“加载”图像（`wait.gif`）让用户知道\
  \ Ajax 请求正在处理中。\n\n![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglhy2owl2suahnnn3awyzm-.jpg)\n\
  \n“加载”图像显示存储邮编帮助文本的同一个字段中，我假设该字段实际上承担了三重职责。在输入邮编的整个过程中，以下三条信息可以在邮编的帮助字段中于不同时间出现：\n\
  \n- 当邮编无效时，显示帮助文本。\n- 在执行 Ajax 请求时，显示“加载”图像。\n- 在 Ajax 请求成功后，显示动态加载的城市和州。\n\n这似乎看起来邮编及其辅助字段涉及了很多操作，但\
  \ Validator 应用程序在并不复杂的情况下处理了这一切。请记住，应用程序实际上只处理了一个 Ajax 请求，这有助于简化问题。你现在准备好进一步了解有关邮编\
  \ Ajax 请求了。\n\n#### 客户端请求\n\nValidator 应用程序的客户端请求非常基础，它在邮编文本输入控件失去焦点时发送邮编。这种方法与第\
  \ 6 章“通过自动完成读取用户心理”中的 Completer 应用程序不同，后者在每输入一个字符后都会发出 Ajax 请求。逐字符的请求技术对于 Validator\
  \ 并没有意义，因为在 Validator 中输入一段有意义的数据需要多次按键——你必须等待用户完成数据输入后再尝试验证。用户完成在邮编输入控件中输入数据的信号是他们通过\
  \ Tab 键切换或点击其他区域离开该控件。\n\n一旦用户离开邮编文本框，你就可以将输入内容作为 Ajax 请求的一部分发送出去。这些用户输入只是原始文本字符，没有任何特殊格式。虽然已经执行的整数验证确保了邮编文本由五个整数字符组成，但在某种意义上，文本仍然被视为未格式化的，因为它没有被编码为\
  \ XML 或其他标准数据格式。\n\n注意\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | 我意识到还有形式如 `#####-####` 的更长邮编格式，这完全可能出现在这里。为了保持简单，我选择坚持基础的五位邮编，其格式为 `#####`。\
  \ |\n\n关于从客户端向服务器发送用于邮编查询的最少数据，你只需要知道这些。现在让我们处理服务器返回的内容。\n\n#### 服务器响应\n\nValidator\
  \ 应用程序中的 Ajax 服务器响应返回了请求中发送的邮编信息。此响应间接接收来自第三方 Web 服务 `webserviceX.net`，该服务提供了多种\
  \ XML 格式的便捷数据馈。在这种情况下，`webserviceX.net` 服务使用邮编来查找并返回匹配的城市、州、区号和时区。由于 Validator 应用程序中只需要城市和州，因此你可以忽略区号和时区。响应数据格式化为\
  \ XML 代码，这一事实使得访问你所需的特定数据变得非常容易。\n\n你可能从之前的的一些应用程序中记得，你不能在第三方域名上发起 Ajax 请求。因此，技巧是通过从服务器脚本发起第三方数据请求来缓解这种安全限制，然后使用\
  \ Ajax 从位于你服务器上的该脚本中获取数据。这之所以可行通，是因为从服务器脚本请求数据并不存在安全问题。因此，Validator 应用程序需要包含一个 PHP\
  \ 服务器脚本，作为向 `webserviceX.net` 服务发送邮编请求的代理。\n\n#### 理解从客户端到服务器的对话\n\nValidator 应用程序中的\
  \ Ajax 请求用于将用户输入的邮编传输到服务器，然后接收城市和州作为返回。图 7.3 有助于直观地澄清这种数据传输。\n\n##### 图 7.3. Validator\
  \ 应用程序涉及未格式化的邮编和已格式化的城市及州数据在客户端和服务器之间往回流动。\n\n![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcglmawcwl2cuahnmn2kwyzq-.jpg)\n\
  \n作为 Ajax 请求参数发送到服务器的数据是用户输入的邮编。该邮编已经在格式上经过了验证，但尚未检查以确保它确实匹配某个城市和州。邮编请求由 `ziplookup.php`\
  \ 服务器脚本处理。以下是一个 Ajax 请求 URL 的示例，该 URL 将邮编 `85250` 作为唯一参数发送给服务器脚本：\n\n```\nziplookup.php?zipCode=85250\n\
  ```\n\n此代码揭示了邮编如何被封装成 URL 中的单个参数（`zipCode`）。整个 URL 被用作 Ajax 请求的基础，在这种情况下，你的服务器脚本\
  \ `ziplookup.php` 将获取 `zipCode` 参数并使用其包含的 URL 来获取城市和州信息。\n\n城市和州数据以紧凑的 XML 文档形式返回，假设邮编成功匹配，该文档实际上包含了该邮编的城市、州、区号和时区。以下是此类\
  \ XML 文档实际内容的示例：\n\n```xml\n<NewDataSet>\n  <Table>\n    <CITY>Scottsdale</CITY>\n\
  \    <STATE>AZ</STATE>\n    <ZIP>85250</ZIP>\n    <AREA_CODE>602</AREA_CODE>\n \
  \   <TIME_ZONE>M</TIME_ZONE>\n  </Table>\n</NewDataSet>\n```\n\n即使你不是 XML 大师，这段代码也不难理解。你只对\
  \ `<CITY>` 和 `<STATE>` 标签感兴趣，因为它们包含了邮编的城市和州。剩下的任务是在客户端从这些数据中提取城市和州。\n\n#### 构建 Validator\
  \ 应用程序\n\n除了包括 `validatekit.js` 在标准工具包 JavaScript 文件外，Validator 应用程序仅两个组件：\n\n-\
  \ HTML 页面 (`validator.html`)\n- PHP 服务器脚本 (`ziplookup.php`)\n\n当然，应用程序的另一个主要成分是第三方定位\
  \ Web 服务，负责根据邮编提供城市/州数据。尽管该服务是应用程序的重要部分，但除了 HTML 页面中启动 Ajax 请求的代码以及 PHP 服务器脚本中处理响应传回页面的代码外，它不需要单独的组件。这种安排是必要的，因为\
  \ Ajax 请求不允许直接访问位于其他域的资源。\n\n接下来的几节将详细探讨 Validator 页面和服务器脚本，以便完全理解应用程序的工作原理。\n\n\
  #### Validator 页面\n\n\n\n\n\nValidator 程序的 HTML 页面 `validator.html` 由一系列文本框输入字段组成，每个输入字段旁边都有一个非输入的文本字段，作为帮助消息的显示区域。文本框通过\
  \ `input` 元素创建，而帮助消息字段则通过 `span` 元素创建。图 7.4 显示了在 Web 浏览器中打开的 Validator 应用程序，空白的文本框已准备供用户输入，所有帮助消息都指示字段缺失数据。\n\
  \n### 图 7.4. Validator 页面由一系列文本框输入控件和随其后的文本显示区域组成。\n\n[[查看完整图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywmuamdwa3a3czvhadbsav9jmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywnrcddzmghqnxauawnnmc8-.jpg)\n\
  \n#### 注意\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 应用程序最初不会如图所示自动显示帮助消息。相反，只有当你实际上在没有输入任何内容的情况下跳离开输入控件时，“请输入一个值。”这一帮助消息才会出现。 |\n\
  \n结合图中所示 Validator 应用程序的布局，查看 Web 页面 `body` 部分的 HTML 代码：\n\n代码视图：\n\n```\n<body\
  \ onload=\"document.getElementById('something').focus()\">\n  <div id=\"ajaxState\"\
  \ style=\"display:none; font-style:italic\">\n  </</div>\n  <br />\n  <div>\n  \
  \  Enter something:\n    <input id=\"something\" type=\"text\" size=\"32\" onblur=\n\
  \      \"validateNonEmpty(this,\ndocument.getElementById('something_help'))\" />\n\
  \    <span id=\"something_help\" class=\"help\"></span>\n  </div>\n  <div>\n   \
  \ Enter an integer:\n    <input id=\"integer\" type=\"text\" size=\"32\" onblur=\n\
  \      \"validateInteger(this,\n      document.getElementById('integer_help'))\"\
  \ />\n    <span id=\"integer_help\" class=\"help\"></span>\n  </div>\n  <div>\n\
  \    Enter a number:\n    <input id=\"number\" type=\"text\" size=\"32\" onblur=\n\
  \      \"validateNumber(this,\n      document.getElementById('number_help'))\" />\n\
  \    <span id=\"number_help\" class=\"help\"></span>\n  </div>\n  <div>\n    Enter\
  \ a phone number:\n    <input id=\"phone\" type=\"text\" size=\"32\" onblur=\n \
  \     \"validatePhone(this,\n      document.getElementById('phone_help'))\" />\n\
  \    <span id=\"phone_help\" class=\"help\"></span>\n  </div>\n  <div>\n    Enter\
  \ an email address:\n    <input id=\"email\" type=\"text\" size=\"32\" onblur=\n\
  \      \"validateEmail(this,\n      document.getElementById('email_help'))\" />\n\
  \    <span id=\"email_help\" class=\"help\"></span>\n  </div>\n  <div>\n    Enter\
  \ a date:\n    <input id=\"date\" type=\"text\" size=\"32\" onblur=\n      \"validateDate(this,\n\
  \      document.getElementById('date_help'))\" />\n    <span id=\"date_help\" class=\"\
  help\"></span>\n  </div>\n  <div>\n    Enter a ZIP code:\n    <input id=\"zipcode\"\
  \ type=\"text\" size=\"16\"\n      onblur=\"if (validateZipCode(this,\n        document.getElementById('zipcode_help')))\n\
  \        getCityState(this.value);\" />\n    <span id=\"zipcode_help\" class=\"\
  help\"></span>\n  </div>\n</body> \n```\n\n通过 `onload` 事件处理程序将焦点设置到页面上的第一个文本框后，页面的\
  \ `body` 就会开始创建每个文本框 `input` 及其关联的帮助消息 `span` 对。这些代码中没有特别不寻常，除了 `onblur` 事件处理程序外，它会在输入焦点离开输入控件时被调用。因此，当用户从文本框按\
  \ Tab 键或点击页面上的其他地方时，文本框会接收到 `onblur` 事件通知。这正是你调用函数来验证文本框中输入值的地方。\n\nValidator 应用程序中负责验证的函数都是\
  \ `validatekit.js` Ajax 工具包文件的一部分，必须通过以下代码（放在页面头部）导入到 Web 页面：\n\n```\n<script type=\"\
  text/javascript\" src=\"validatekit.js\"> </script>\n```\n\n此文件提供的每个函数都接受相同的两个参数：\n\
  \n* 包含待验证值的输入控件\n* 用于显示帮助文本的帮助控件\n\n要查看这些参数是如何传递到验证函数的，请查看调用整数验证函数的代码：\n\n```\n\
  validateInteger(this, document.getElementById('integer_help'))\n```\n\n由于该函数是在整数文本框的上下文中调用的，因此你可以将\
  \ `this` 作为第一个参数传递给函数。第二个参数使用标准的 `getElementById()` 函数指定，用于获取帮助控件，其 ID 为 `integer_help`。\n\
  \n如果你留意页面上的帮助控件，可能会注意到每个 `span` 元素都被样式化为名为 `help` 的 CSS 样式类。该样式类仅将字体颜色改为红色（`#FF0000`）并将字体样式设置为*斜体*（italic），这使得帮助消息在页面上更加显目。以下是\
  \ Validator 页面内部样式表的代码，其中包含了 `span.help` 样式类：\n\n```\n<style type=\"text/css\">\n\
  \  div { padding-bottom:5px; }\n  span.help { color:#AA0000; font-style:italic;\
  \ }\n</style>\n```\n\n全局 `div` 样式包含在样式表中，纯粹是为了在页面上的输入控件之间提供一些垂直间距。\n\n尽管 Validator\
  \ 内部样式表有助于让页面看起来好看一点，但它在 Ajax 方面帮助并不。启动 Validator 应用程序 Ajax 请求的代码包含在 ZIP 码框的 `onblur`\
  \ 事件处理程序中。虽然这段代码在你刚刚看到的列表里，但将其从 `onblur` 属性中提取出来会更容易理解：\n\n```\nif (validateZipCode(this,\n\
  \  document.getElementById('zipcode_help')))\n  getCityState(this.value);\n```\n\
  \n这段代码首先验证 ZIP 码输入数据，检查它是否真的是五位数字。这是通过调用 `validateZipCode()` 函数实现的。函数的返回值表示数据有效（`true`）还是无效（`false`）。如果数据有效，则调用\
  \ `getCityState()` 函数来启动 Ajax 请求。以下是该函数的代码：\n\n```\nfunction getCityState(zipCode)\
  \ {\n  // 显示等待图像\n  document.getElementById(\"zipcode_help\").innerHTML =\n    \"\
  <img src='wait.gif'\n    alt='Looking up code...' />\";\n\n  // 发送 Ajax 请求加载城市/州\n\
  \  ajaxSendRequest(\"GET\", \"ziplookup.php?zipCode=\" + zipCode,\n    handleStateRequest);\n\
  }\n```\n\n啊，终于看到了让这个应用程序看起来很酷的魔法。`getCityState()` 函数的第一个任务是在帮助控件中显示加载图像 `wait.gif`。此图像将一直显示到\
  \ Ajax 请求完成，从而给用户一个视觉提示，指示后台正在处理。\n\n`getCityState()` 函数的第二个任务是实际提交 Ajax 请求，这涉及到将\
  \ ZIP 封装到 `ziplookup.php` 服务器脚本的 URL 中。`handleStateRequest()` 函数被指定为 ZIP 码 Ajax\
  \ 请求的处理器。以下是它的代码：\n\n```\nfunction handleStateRequest() {\n  if (request.readyState\
  \ == 4 && request.status == 200) {\n    // 存储 XML 响应数据\n    var xmlData = request.responseXML;\n\
  \n    // 显示城市/州结果\n    if (xmlData != null &&\n      getText(xmlData.getElementsByTagName(\"\
  CITY\")[0]) != \"\")\n      document.getElementById(\"zipcode_help\").innerHTML\
  \ =\n        \"<span style='font-weight:bold'>\" +\n        getText(xmlData.getElementsByTagName(\"\
  CITY\")[0]) +\n        \", \" +\n        getText(xmlData.getElementsByTagName(\"\
  STATE\")[0]) +\n        \"</span>\";\n    else\n      document.getElementById(\"\
  zipcode_help\").innerHTML =\n        \"Could not find the ZIP code.\";\n  }\n  ajaxUpdateState();\n\
  }\n```\n\n\n\n\n该函数在 Ajax 请求完成后被调用，其作用是从响应数据中提取城市和州，并将它们显示在页面上，以替换“加载”图像。城市/州数据的提取得益于\
  \ `getText()` Ajax 工具包函数的一点小帮助，该函数位于 `domkit.js` 文件中。请注意，XML 元素名称 `CITY` 和 `STATE`\
  \ 被用作访问城市和州数据的依据。这些数据不仅被提取，还通过动态构建的 HTML 代码进行了仔细的格式重排。如果一切顺利，生成的 HTML 代码看起来如下：\n\
  \n```\n<span style='font-weight:bold'>Scottsdale, AZ</span>\n```\n\n注意，城市和州应用了内联样式，使其以**粗体**字体显示，这有助于它们与普通帮助文本区分来。如果服务器返回的\
  \ XML 数据存在问题，将显示一条帮助信息，指示找不到邮政编码。\n\nValidator 网页的代码到此结束。剩下的就是快速查看负责将邮政编码请求传递给远程服务器的\
  \ PHP 服务器脚本。\n\n### 邮编查询服务器脚本\n\n与第 4 章 中的“使用 Ajax 动态填充列表：股票选择器”应用类似，Validator 需要服务器端脚本来绕过无法在第三方域名发送直接\
  \ Ajax 客户端请求的限制。第三方域名很重要，因为 Validator 应用依赖它来查询邮政编码。Validator PHP 脚本充当了安全代理，代表客户端接受\
  \ Ajax 请求，从第三方服务器检索城市/州数据，然后将数据响应给客户端。通过这种方式，Ajax 请求是在你自己的域名上进行的，考虑到 Ajax 的安全限制，这是完全可以接受的。\n\
  \n我所说的第三方 Web 服务是 `webserviceX.net`，它提供了多个基于 XML 的数据。第 4 章 中的选择器应用使用该服务获取实时股票报价，而\
  \ Validator 使用它获取有关邮政编码的详细信息。在这种情况下，你指定一个邮政编码，服务器返回一个包含其详细信息的 XML 文档，包括与其相关的城市和州。你已经见过此\
  \ XML 文档中的代码，但还没有看到通过 Ajax 请求接收代码的 PHP 脚本。以下是 `ziplookup.php` 服务器脚本的代码：\n\n```php\n\
  <?php\nheader('Content-Type: text/xml');\n\n// 从服务器加载 XML 位置数据\n$xml = html_entity_decode(file_get_contents(\n\
  \  \"http://www.webservicex.net/uszip.asmx/GetInfoByZIP?USZip=\" .\n  $_REQUEST['zipCode']));\n\
  \n// 返回 XML 位置数据\necho $xml;\n?>\n```\n\n请记住，此脚本的作用是从 `webserviceX.net` 的邮政编码 Web\
  \ 服务检索 XML 文档，然后在不进行任何修改的情况下直接将该数据传递给客户端。然后由客户端来对 XML 代码进行有用的操作，例如在页面上显示城市和州。\n\n\
  服务器脚本首先确保响应被处理为 XML。然后它从邮政编码 Web 服务加载 XML 文档，确保传递了 `zipCode` 参数，以便 Web 服务知道要查询哪个邮政编码。脚本通过返回脚本中的\
  \ XML 数据结束，作为 Ajax 邮政编码请求的响应。\n\n尽管我确定你迫不及待想要测试这个应用，但让我们花点时间单独测试 PHP 脚本。你在前面的章节中已经看到如何直接在浏览器中打开\
  \ PHP 脚本来这样做——这里有一个测试 ZIPLookUp 脚本的示例 URL：\n\n```\nhttp://www.yourdomain.com/ziplookup.php?zipCode=94965\n\
  ```\n\n假设 `ziplookup.php` 文件存储在你的服务器上，将此行代码中的域名更改为你的域名，然后将 URL 输入 Web 浏览器。图 7.5\
  \ 显示 PHP 脚本生成的 XML 响应数据。\n\n#### 图 7.5。你可以通过直接在浏览器中打开脚本来检查 `ZIPLookUp` PHP 脚本返回的\
  \ XML 邮政编码信息。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywmuamdwa3a3czzhadbsav9jmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywnrcddzmghqnnauawnnmc8-.jpg)\n\
  \n### 测试 Validator\n\nValidator 应用提供了一个有趣的测试机会，因为在检查验证有效性时，你有几个不同的数据字段可以进行尝试。你会发现，随着页面的移动，数据类型倾向于变得越来越复杂。通过留空输入或输入无效数据，可以很容易生成帮助消息。\n\
  \n#### 6. 输入无效数据后离开控件将产生帮助消息。\n\n#### 图 7.6. 输入无效数据后离开控件将产生帮助消息。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywmuamdwa3a3czzhadbsav9jmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywnrcddzmghqnnauawnnmc8-.jpg)\n\
  \n#### 7. 当你对复杂类型实验数据时，事情变得更有趣。\n\n#### 图 7.7。 当你对复杂类型实验数据时，事情变得更有趣。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywmuamdwa3a3czzhadbsav9jmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywnrcddzmghqnnauawnnmc8-.jpg)\n\
  \n#### 8. 显示“加载”图像代替帮助消息。\n\n显然，1 月份只有 31 天，所以涉及第 32 天的日期是无效的。\n\n#### 图 7.8. 显示“加载”图像代替帮助消息。\n\
  \n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywmuamdwa3a3czzhadbsav9jmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywnrcddzmghqnnauawnnmc8-.jpg)\n\
  \n#### 9. 成功的邮政编码请求将导致显示关联的城市和州。\n\n是的，我知道我没忍住使用地球上最流行的邮政编码来测试这个应用。如果邮政编码数据通过 Ajax\
  \ 请求成功检索，结果城市和州将显示在“加载”图像的位置，如图图 7.9 所示（等等，更正）。\n\n#### 图 7.9. 成功的邮政编码请求将导致显示关联的城市和州。\n\
  \n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywmuamdwa3a3czzhadbsav9jmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywnrcddzmghqnnauawnnmc8-.jpg)\n\
  \n\n\n成功固然很好，但如果找不到邮编（ZIP code）会发生什么？如果你回想应用程序中的代码，会显示一条帮助消息来指示这一点。图 7.10 显示了针对未与真实城市和州关联的邮编而显示的帮助消息。\n\
  \n#### 图 7.10。没有对应真实城市和州的邮编将显示一条帮助消息，提示找不到该邮编。\n\n[[查看完整图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywmuamdwa3a3czfhadfsav9jmhqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvywnrcddzmwhqmxauawnnmc8-.jpg)\n\
  \n需要注意的是，找不到的邮编在严格的数据输入意义上并不意味着它是无效的。是的，它在现实世界中没有被使用，如果你正在输入收货地址，这就是问题，但并不意味着它某天不会是真实的。邮编码不是刻成不变的，事实上，在快速发展的地区，它们会定期地重新创建。这就是依赖第三方服务来处理邮编查询的妙之处——由它负责保持邮编数据库的更新，而不是你。\n\
  \n无论你如何处理邮编在现实世界中未使用的问题，希望你能看到 `Validator` 应用程序在数据验证方面奠定了重要基础，你可以在各种实用的方式对其进行复用和重新开发。\n\
  \n### 为 Validator 进行极速的 Ajax 改造\n\nValidator 应用程序是书中更具直接应用性的示例之一，因为智能数据输入是一个常见需求。`validatekit.js`\
  \ 文件为数据输入表单中常用的常见数据类型提供了函数。扩展 Validator 示例的第一方法是将验证函数应用到你自己的用户输入表单中。只需通过下面的 `<script>`\
  \ 标签将 `validatekit.js` 文件导入你的页面即可，轻松实现：\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"validatekit.js\"> </script>\n```\n\n然后，通过调用相应的验证函数并传递 HTML 元素的 ID 来编写用于验证的\
  \ HTML 元素代码。例如，如果你想验证人的年龄以确保它是一个整数，你可以创建以下文本框和帮助字段：\n\n```html\n<input id=\"age\"\
  \ type=\"text\" size=\"4\"\n  onblur=\"validateInteger(this,\n  document.getElementById('age_help'))\
  \ />\n<span id=\"age_help\" class=\"help\"></span>\n```\n\n你不需要为帮助文本关联样式类，但这确实会让用户界面看起来更好一点。这里有一个你可以用于装饰帮助字段的样式示例：\n\
  \n```css\n<style type=\"text/css\">\n  span.help { color:#AA0000; font-style:italic;\
  \ }\n</style>\n```\n\n请记住，这种样式必须放置在 Web 页面的 `<head>` 中，这也是你刚才看到的 `<script>` 标签必须放置的地方。这种样式只是让帮助文本变为斜体并呈红色。你可以轻松地添加更多样式或调整这些样式以获得不同的外观。\n\
  \n这个年龄验证器的一个问题是，它没有考虑到用户输入了没有意义的年龄。例如，因为验证只检查输入是否为整数，如果用户输入年龄 -5 或 212，就不会显示任何帮助文本。在有人发现永老泉之前，远超\
  \ 100 岁的年龄可能可以被认为是无效的。你可能可以通过创建一个仅允许正整数的全新验证函数来考虑负年龄，但在这种情况下，范围验证更具意义。\n\n年龄范围验证负责首先检查输入值是否为整数，然后进一步检查该整数是否在可接受的范围内（例如\
  \ 1 到 120 之间）。以下是你如何组合一个验证函数来执行此任务的：\n\n```javascript\nfunction validateAge(inputControl,\
  \ helpControl) {\n  // 首先检查输入值是否为整数\n  if (!validateInteger(inputControl, helpControl))\n\
  \    return false;\n  // 然后检查输入值是否在规定的范围内\n  if (inputControl.value < 1 || inputControl.value\
  \ > 120) {\n    if (helpControl != null)\n      helpControl.innerHTML = \"Please\
  \ enter an age in the\n      range 1 - 120.\";\n    return false;\n  }\n  else {\n\
  \    if (helpControl != null)\n      helpControl.innerHTML = \"\";\n    return true;\n\
  \  }\n}\n```\n\n注意，此函数首先调用 `validateInteger()` 函数来检查并确保输入确实是一个有效的整数。如果输入不是整数，就没有必要继续进行范围检查。如果输入是整数，则执行范围检查。范围检查的结果仅仅是设置或清除帮助控件中的文本。在忘记或决定不包含帮助控件的情况下，会检查帮助控件是否为\
  \ `null` 值，在这种情况下你不希望发生错误。\n\n即使你的 JavaScript 经验并不稳固或完全没有，你也应该能够分离出 `validateAge()`\
  \ 函数的关键部分并对其进行修改以适应你的需求。例如，你只需通过更改这行代码就可以更改验证检查的范围：\n\n```javascript\nif (inputControl.value\
  \ < 1 || inputControl.value > 120) {\n```\n\n假设你想验证 NFL（国家橄榄球联盟）四卫员评分，该评分范围必须在 0\
  \ 到 158 之间。以下是你如何更改范围测试代码行的的：\n\n```javascript\nif (inputControl.value < 0 || inputControl.value\
  \ > 158) {\n```\n\n#### 注意\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmuc99pwawdll24-.jpg)\
  \ | 请不要问为什么 NFL 四卫员评分的范围是 0 到 158（实际上是 158.33），而不是 0 到 10 这样更有逻辑的数字。这是一个复杂的计算，考虑了传球完成率、均传码数、均触球数等变量。除非你是一个完全的（美国）橄榄球迷，否则请接受这个范围并继续吧。否则，你可以在\
  \ [`en.wikipedia.org/wiki/Passer_rating`](http://en.wikipedia.org/wiki/Passer_rating)\
  \ 了解更多。 |\n\n希望你能看到，基于我提供的基础集编写自己的验证函数并不困难。\n\n还可以扩展 Validator 应用程序采用的 Ajax 风格验证来查询邮编的城市和州。例如，一种流行的\
  \ Ajax 验证是检查用户名数据库以确保在注册新用户时具有唯一性。在这种情况下，你向服务器脚本发送 Ajax 请求，传递输入的用户名，然后服务器脚本将名称与现有用户名数据库进行比对，以查看其是否唯一。唯一性验证的响应可能只是简单的“是”或“否”。这样，客户端只需要查看此结果并相应地显示帮助消息即可。\n\
  \n这次改造讨论的重点在于，在数据验证和 Ajax 方面，我真的只了冰山一角。取决于你如何利用所学的知识和我提供的代码，来根据需要进一步扩展验证技术。\n\n\
  ### 总结\n\n尽管这本书展示了许多有趣的 Ajax 应用，有些具有引目的视觉效果和实时数据流，但从纯实用的角度来看，很少有像 Validator 应用程序那样可以直接应用。该应用程序有一个非常基础的用户界面，但这里的亮点是易用性。当输入无效数据时出现的帮助文本微妙但引人注目。而且考虑一下，这些帮助信息在不需要提交任何数据的情况下就会立即出现——这就是“Ajax”的方式，即使没有显式地发出\
  \ Ajax 服务器请求。\n\n\n\n\n\n# 第 8 章：一种强大的图片查看器\n\n## Ajax 与早期的管道工程\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 很难相信，但 Ajax 的起源可以追溯到 16 世纪的管道工程。1596 年，约翰·哈灵顿爵士为英国伊丽莎白一世女王发明了一种名为“Ajax”的冲水马桶。Ajax\
  \ 马桶的设计在英国并没有流行，但在法国获得了一些成功。现代 S 型存水桶设计直到近 200 年后才出现。 |\n\n我们都知道“一画胜千言”，尤其是在视觉化程度极高的现代\
  \ Web 领域。然而，目前在 Web 上查看图片的技巧有点原始且无聊。我假设你正在使用小缩略图作为链接到全尺寸版本的图片，对于大多数照片来说，这是合理的，因为你不希望一张巨大的照片占据页面的大部分空间。处理缩略图的传统方法是直接链接到全尺寸图片，在这种情况下浏览器会打开并显示图片，就像它是另一个\
  \ Web 页面一样。这被视为页面导航，意味着你必须点击浏览器的“后退”按钮返回原始页面，并且还可能需要重新加载。这是一种查看图片并不理想的方法，而且涉及过多的加载和重新加载。“Ajax”提供了一个更好的替代方案。\n\
  \n本章将向你展示一个流畅的“Ajax”图片查看器，它消除了在另一个页面中打开缩略图全尺寸版本的需求，从而彻底摆脱“后退”按钮重新加载的问题。我一直引用“Ajax”这个词，是因为从技术上讲，你并不需要\
  \ Ajax 来实现这种图片查看功能。当你深入本章的挑战时，你会发现原因，但请理解，本章展示了一个 Ajax 风格效果的完美示例，该效果在技术上并不涉及 Ajax\
  \ 请求。\n\n本章中的 Imaginator 使用了以下文件，它们位于随书附带 Linux 光盘的 `chap08` 示例代码文件夹中：\n\n* `imaginator.html`——主\
  \ Web 页面\n* `smokiesXX.jpg`——一系列烟雾山示例图片\n* `smokiesXX_thumb.jpg`——一系列烟雾山示例图片的缩略图\n\
  * `domkit.js`——Ajax Toolkit 的 DOM 相关函数\n* `modalimgkit.js`——Ajax Toolkit 的模态图片相关函数\n\
  * `modalimgkit.css`——模态态的样式表\n* `modalimgkit_wait.gif`——在加载模态图片时显示的动态“加载”图标\n* `modalimgkit_gray.png`——在前景查看模态图片时显示在背景页面上的透明灰色图片\n\
  \n## 挑战：动态加载图片\n\nWeb 页面处理缩略图的方式通常存在一个固有问题。问题的根源在于，你必须通过链接发起完整的 HTTP 请求才能查看全尺寸图片。这意味着图片被当作另一个\
  \ Web 页面来加载，意味着浏览器会离开带有缩略图的页面，跳转到包含图片的新“页面”。如果你处于慢速连接或正在查看大图片，等待图片的时间可能会让你感到困惑，因为浏览器没有提供图片正在加载的提示。“Ajax”提供了一个更好的替代方案。\n\
  \n那么 Ajax 能帮助解决这个问题吗？并不完全是。在这种情况下，Ajax 的问题在于你必须点击“后退”按钮才能返回原始页面，这很令人遗憾。处理缩略图的传统方法是直接链接到全尺寸图片，在这种情况下浏览器会打开并显示图片，就像它是另一个\
  \ Web 页面一样。这被视为页面导航，意味着你必须点击浏览器的“后退”按钮返回原始页面，并且还可能需要重新加载。这是一种查看图片并不理想的方法，而且涉及过多的加载和重新加载。\n\
  \n我们已经确定 Ajax 不能用于动态加载图片，但这并不意味着我们没有办法了。事实上，标准的 `Image` 对象使得在不发出任何请求的情况下实现 Ajax\
  \ 效果成为可能。我指的是 `Image` 对象中的 `onload` 事件，它会在图片加载完成后通知你。该事件的作用类似于 Ajax 请求，因为它在图片完成加载时会发出一个通知。\n\
  \n`Image` 对象中另一个辅助 `onload` 事件的组件是 `complete` 变量，它是一个布尔值（`true`/`false`）数据，让你知道图片是否已完成。与\
  \ `onload` 事件处理程序结合，`complete` 变量为你提供了构建“Ajax”图片查看器所需的所有信息。本章向你展示了一个流畅的“Ajax”图片查看器，它消除了在另一个页面中打开缩略图全尺寸版本的需求。\n\
  \n虽然我确定你会很喜欢对 `onload` 事件处理程序和 `complete` 成员变量进行深入有趣的讨论（特别是如果你不是 JavaScript 高手的话），但我将免除你的苦受。相反，我很乐意分享，我已经编写了一些\
  \ JavaScript 代码，可以让你几乎不需要付出任何工作就能将图片查看器注入到你的页面中。真的，你会对本章的极其简单感到惊讶的。\n\n支持图片查看器的代码是\
  \ `modalimgkit.js` 文件的一部分，该文件包含在随书光盘的 Ajax Toolkit 中，也是 Imaginator 示例应用程序源代码文件的一部分。正如在第\
  \ 2 章“在 Ajax 内部”中最初提到的，`modalimgkit.js` 文件提供了一个单一的 JavaScript 函数，你可以自动将整个页面上的图片链接转换为\
  \ Ajax 风格的图片查看器链接。该函数名为 `initModal()`，并且必须在包含图片链接的页面 `body` 的 `onload` 事件处理程序中调用。\n\
  \n`initModal()` 函数的巧妙之处在于，它会自动扫描页面寻找图片链接，然后修改它们以便使用动态的 Ajax 风格图片查看器。由于该函数会自动处理页面上找到每一个图片链接，因此你只需要调用它一次即可激活动态图片查看器。\n\
  \n`modalimgkit.js` 文件中的“modal”（模态）一词是指动态图片查看器使用了模态窗口，模态窗口是一种在显示时防止你与父窗口交互的窗口。模态窗口在大多数现代操作系统中通过对话框被广泛使用。例如，大多数\
  \ Windows 中的“关于”框就是一个模态窗口。动态图片查看器使用模态窗口，这样你在查看图片时就不会意外点击到背景中的窗口。\n\n\n\n\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
