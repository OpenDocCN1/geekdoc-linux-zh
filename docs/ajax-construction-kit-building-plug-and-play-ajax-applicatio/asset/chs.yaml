  \ Ajax 运行的主要功能。本附录为你提供了一个关于 `XMLHttpRequest` 对象的简洁参考，以及关于如何最佳使用其方法和属性的若干有用提示。关于核心\
  \ JavaScript 语言所支持的所有对象的完整参考，请参阅 [`developer.mozilla.org/en/docs/Core_JavaScript_1.5_Reference`](http://developer.mozilla.org/en/docs/Core_JavaScript_1.5_Reference)。\n\
