  \n# 第 3 章 动态加载 Web 数据：XML 电子书阅读器\n\n## 街机中的 Ajax\n\n| ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg)\
  \ | Web 第一次将 Ajax 术语与交互和计算联系在一起。1987 年，科乐（Konami）发布了一款同名的垂直卷轴空间射击类视频游戏。在《Ajax》这款电子游戏中，你可以在控制直升机和战斗机之间交替进行切换，并发射各种类型的导弹、激光和炸弹。\
  \ |\n\n上一章探索了使用 Ajax 动态加载数据的基础，但电子书示例的效率相当低，因为你必须等待整本书加载完毕才能阅读任何内容。Booker 应用也只演示了如何加载原始文本文件，这在解决\
  \ Ajax 方程中的 XML 部分方面并没有什么作用。实际上，以 XML 形式处理电子书更有意义，因为这让你能够根据需求选择想要处理的信息。具体来说，按章节访问\
  \ XML 电子书是相对直接的，从而缩短每个 Ajax 请求的传输时间，并通过一次显示一个章节来提高书籍的可读性。\n\n本章将在上一章的 Booker 示例的基础上，引导你使用\
  \ XML 作为电子书数据格式对应用程序进行重新设计。除了可以看到 XML 如何融入到实际的 Ajax 应用中，你还能感受到，当你减少每个请求交换的数据量时，应用程序的响应速度会变得多么灵快。\n\
  \n本章中的 Booker 应用使用了以下文件，这些文件位于书籍附带的 Linux 光盘 `chap03` 示例代码文件夹中：\n\n* `booker.html`——主\
  \ Web 页面\n* `booker.php`——从电子书中加载章节的服务器脚本\n* `ajaxkit.js`——Ajax 工具包 (Ajax Toolkit)\
  \ 的核心 Ajax 函数\n* `domkit.js`——Ajax 工具包的 DOM 函数\n* `book_alicewonderland.xml`——《爱丽丝在仙仙游》XML\
  \ 电子书\n* `book_frankenstein.xml`——《弗兰肯斯坦》XML 电子书\n* `book_mobydick.xml`——《摩比迪》XML\
  \ 电子书\n* `book_warandpeace.xml`——《战争与和平》XML 电子书\n* `book_warofworlds`——《世界大战》XML\
  \ 电子书\n\n### 挑战：分更小的块加载数据\n\n如果你在读完本书的最后一章后停读一个月，试图去读《战争与和平》电子书，那么你会很快发现 Booker\
  \ 示例应用在性能上略显欠缺。问题在于，该应用程序将电子书视为一个巨大的原始文本块，而当你尝试阅读像《战争与和平》这样真正厚重的书时（它的重量略超过 3MB），这非常笨拙。我不知道你的网络连接如何，但即使是我的宽带连接在加载\
  \ 3MB 的文本文件时也会感到吃力，并耗费很长时间。\n\n原始 Booker 应用的问题不仅在于传输时间，而且尝试在单个页面上显示整本书还存在着严重的易用性问题。这样想一下——物理纸质书首先被拆分为章节，然后进一步拆分为页。这不仅为你提供了一个放置书签以记录你在书中的位置的好地方，而且在读完一大块文本后翻页，还可以作为一种有帮助的心理休息。Booker\
  \ 则并非如此。整本 3MB 的小说被挤进你浏览器中一个巨大肥胖的虚拟页面里。除非你是某种超人类的速读者，否则你很快就会讨厌这种阅读方式。\n\n因此，我们评估认为第一个\
  \ Booker 应用存在一些问题，并且在动态数据加载的精神下，Ajax 显然提供了一个解决方案。事实上，在有一点 Ajax 帮助的情况下，可以动态地加载你需要的内容，对于电子书来说，只需要一个章节。通过这种改变，你一箭双雕，因为这种一次加载一个章节书籍数据的新方法，由于每个\
  \ Ajax 请求传输的数据量大幅减少，带来了显著的性能提升。那么挑战就在于开发一个改进后的 Booker 版本，每次加载一个章节。\n\n**注意**\n\n\
  | ![](img/mtizys9yzdjyzznhzzgwmdc1cy9lown0mg04as9wcgl0zwovlmdoc29uy3a-.jpg) | 考虑将电子书拆分成单独的页而不是仅仅是章节并不是不可行的。然而，由什么来定义页的长度呢？物理纸质书在不同的尺寸和字体下打印时，并不遵循相同的页数。Web\
