  \ `Ajax` 服务的 Web 服务器。\n\n`Ajax` 应用与仅用 `JavaScript` 开发的纯客户端应用相比，独特之处在于它们需要在服务器上发生一些。换句话说，`Ajax`\
  \ 的前提是客户端与服务器之间的通信。这意味着你不仅需要一个服务器，还需要一个你有一定控制权的服务器。至少，你需要能够快速安装和测试服务端脚本的能力，这些脚本将处理你\
  \ `Ajax` 应用的服务端处理。在为你提供一个难以置信的可定制平台以用于构建、测试和托管 `Ajax` 应用方面，live CDs 非常符合要求。\n\n\
  尽管 live CDs 很酷，但我必须诚实地说，这本书的 95% 都是关于 `Ajax` 的。本书中 live CD 的方面主要是为了便利，因为 `Ajax`\
  \ 应用对环境的要求比纯客户端应用更高。\n\n好了，所以这本书主要是关于 `Ajax` 的，但这到底意味着什么？这意味着在相对少的页面内，你学会了如何使用 `Ajax`\
  \ 实现以下事情：\n\n*   为 Web 籍阅读器动态加载电子书章节 (第 3 章)\n*   立即选择并查看实时股票报价 (第 4 章)\n*   将任何网页转换为能够理解\
  \ RSS 新闻源的消息聚合器 (第 5 章)\n*   为你的网站添加自动补全功能 (第 6 章)\n*   验证表单数据并实时查询位置数据 (第 7 章)\n\
  *   创建一个“Web 2.0”图像查看器，使你的页面处理图像的方式更加现代化 (第 8 章)\n*   使用信息弹出窗口动态显示小段性内容 (第 9 章)\n\
  *   为任何链接添加实时天气状况弹出窗 (第 10 章)\n*   使用美国邮政服务的 Ajax 请求实时计算运费 (第 11 章)\n*   在你的 Web\
  \ 页面中集成动画五星评分系统 (第 12 章)\n\n这些都是 `Ajax` 使可能的动态应用。更重要的是，本书采用了一种构建工具包的方法，引导你向 `Ajax`\
  \ 应用中添加这些功能。\n\n\n\n\n综上所述，要读完这本书，你绝对必须了解一点 `HTML`。`CSS` 虽然并不那么关键，但它会经常出现，所以你大可以将掌握\
  \ `CSS` 的基础知识视为一种前提。在此基础上，如果了解一些 `JavaScript` 对你大有裨益，因为它是 `Ajax` 的基础。然而，我相信，即使你对\
  \ Web 脚本的了解有限，也能够灵活地闪避并穿过书中的 `JavaScript` 代码，并且依然能带走满箱可以随时复用的 `Ajax` 宝箱工具。书中随处出现的\
  \ `PHP` 代码非常简单，我会详细解释其中正在发生什么，所以你完全不需要了解任何 `PHP` 也能应付。\n\n# 本书的结构\n\n尽管本书遵循了 Negus\
  \ Live Linux 系列的宗旨，旨在快速提供实践经验，但本书的结构略有些不传统。本书分为三个部分：\n\n*   第一部分，“Ajax 训练营”——本书这部分没有浪费时间，只铺垫了足够的基础，以确保你不会被随后的高强度样本\
  \ Ajax 应用程序所淹没。你将探索几个商业级的真实 Ajax 应用程序，并熟悉随附 CD-ROM 提供的 `Ajax Toolkit`。读完这部分后，你将蓄势待发去观察\
  \ Ajax 的实际运作。\n*   第二部分，“构建真实的 Ajax 应用程序”——这部分构成了本书的剩余，完全专注于使用 `Ajax` 来解决现实世界的问题。从为数据输入表动态将邮政编码转换为城市/州，到向页面中注入交互式五星级评分系统，这部分既不浪费时间也不留情面。不要误会我的意思，它仍然是一本很有趣的读物，但不要指望有一堆教程式的说或关于\
  \ `Ajax` 历史的论文。这部分的核心完全在于实战！\n*   第三部分，“附录”——这部分提供了你可能觉得有用的额外信息。附录 A“Ajax 的过去、现在与未来”描绘了\
  \ Ajax 从何而来以及将走向何处。这对于理解如何为你的 Web 页面添加 Ajax 驱动的功能并非至关重要，但它确实为如今围绕着 Ajax 的热议增加了一些视角。附录\
  \ B“XMLHttpRequest 快速简易参考”正是其名——它是作为 `Ajax` 核心的 `JavaScript` 对象的参考。得益于 `Ajax Toolkit`，这个对象在书中大部分时间都是隐藏的，但如果你以后想深入研究我的代码并修改\
  \ Toolkit 本身，你就需要熟悉 `XMLHttpRequest` 对象。\n\n最后，附录 C](#app03.html_app03)“使用 Live\
  \ Linux CD”可以说是所有附录中最实用的一个，因为它详细解释了如何使用随书附带的 live Linux CD。如果你从未用过甚至没听过 live CD，完全不必担心，也不必认为你必须是\
  \ Linux 专家，甚至不需要安装了 Linux。附录 C 讨论了 live CD 的作用，并指导你如何根据你特定的硬件设置来使用它。\n\n# 关于本书的\
  \ CD-ROM\n\n随书附带的 CD-ROM 是 live CD 进入 Ajax 领域的入口。CD 包含一个可引导的 Ubuntu（Linux 变体）操作系统，其中包含了\
  \ `Apache` Web 服务器以及书中涵盖的所有样本 Ajax 应用程序。也许更有趣的事实是，一旦启动，你可以直接从 CD 上运行这些应用程序，考虑到否则你需要自己启动并运行一个\
  \ Web 服务器，这非常强大。\n\n实际上，有多种不同的方法可以访问和使用 live Linux CD  Ajax 样本应用程序。你不需要在电脑上运行 Linux——你只需要一台带有\
  \ `Pentium III` 或更高处理器的电脑。live CD 可以从 Windows、Mac OS X 或另一个 Linux 变体中运行。要了解更多关于如何使用\
  \ CD 探索示例应用程序的细节，请查看附录 C“使用 Live Linux CD”。\n\n# 使用本书所需的条件\n\nLive Linux CD 可以在多种计算机硬件上运行，例如标准\
  \ PC 架构 (`i386`)、PowerPC (`PPC`) 和 64 位 AMD (`AMD64`)。我建议运行随书附带的 CD 至少需要一台 `Pentium\
  \ III` 级 PC 和至少 `128MB` 内存。至于硬盘要求，运行 live CD 时你甚至不需要电脑里有硬盘。你可以考虑准备一个 USB 闪存盘（有时称为\
  \ pen drive、thumb drive 或 memory stick）。因为 live CD 通常从只读介质运行，如果某个应用程序需要写入数据，USB\
  \ 闪存盘会很有用处，正如在第 12 章“为你的网站添加 Ajax 驱动的评分系统”中那样。再次，请参考附录 C 获取使用 live CD 的详细说明。\n\n\
