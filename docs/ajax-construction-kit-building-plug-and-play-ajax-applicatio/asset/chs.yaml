  \ Ajax Duckman 的角色，他是剧名主角 Eric Duckman 的儿子。Ajax Duckman 由音乐家 Dweezil Zappa 配音，在节目中是一个有点懒散的青少年。\
  \ |\n\n许多热门网站中日益受欢迎的组件之一是对事物进行评分的能力。Amazon 可能在提供对产品进行评分和编写自己的评论的功能时开启了这一趋势。从那时起，各种网站都提供了某种形式的评分系统，无论是对电影、音乐、照片、博客文章或其他任何内容。只要可以发布到网上，就可以被评分。我我想，我们大多数人内心深处都是批评家，因此能够对任何事万物进行评分的想法在某种程度上触及了我们分享批评（以及在很多情况下是赞美）的需求。诚然，将世界上的一切都简化为五星评分可能并不公平，但它可以让你快速一览人们是如何看待某事的。\n\
  \n本章在如何利用 Ajax 为 Web 页面上的任何内容添加五星评分方面，无疑是书中最具野心的一章。所谓野心，我仅仅是指，考虑到 `Rater` 示例应用程序在\
  \ Ajax 的使用上要先进得多，因为它必须能够向服务器上的文件或数据库读写多个评分，同时防止同一用户的重复投票。好消息是，这种复杂性的大部分都隐藏在 Ajax\
  \ 工具包中，这意味着你的工作主要归结为正确使用工具包，而不是构建自己的评分代码。\n\n本章中的 `Rater` 应用程序使用了以下文件，它们位于随书的 Linux\
  \ CD-ROM 的 `chap12` 示例代码文件夹中：\n\n*   `rater.html`——Rater 主 Web 页面\n*   `cookiereset.html`——用于模拟唯一用户的\
  \ Cookie 重置 Web 页面\n*   `ajaxkit.js`——Ajax 工具包的核心 Ajax 函数\n*   `domkit.js`——Ajax\
  \ 工具包的 DOM 相关函数\n*   `ratingkit.js`——Ajax 工具包的评分相关函数\n*   `ratingkit.php`——保存和加载评分的服务器脚本\n\
  *   `ratingkit.css`——五星评分的样式表\n*   `star.gif`——用于表示五星评分的星星图像\n*   `star_sm.gif`——用于表示较小五星评分的较小图像\n\
  \n### 挑战：为网站添加评分\n\n\n\n\n确定一个项目重要性的简便方法，是考虑一下如果你被困在荒岛上且只能带上特定数量的物品，该物品是否会入选。例如，如果你只能带一张音乐\
  \ CD，在可能孤苦无行的多年时间里听音乐（但希望有足够的电池为你的 CD 播放器供电！），你会选择哪张 CD？\n\n希望你永远不需要真的进行这种“荒岛 CD\
  \ 选择”。除了这种极端情况，你可能会发现在 [Amazon.com](http://Amazon.com) 上为你喜爱的 CD 评分很有用，这样其他人就能做出明智的音乐购买决策。[Amazon.com](http://Amazon.com)\
  \ 允许你使用五星评分系统对音乐 CD 以及其销售的几乎所有商品进行评分。如果你现在就在电脑旁，花点时间访问 [Amazon.com](http://Amazon.com)\
  \ 并查看一张音乐 CD。这将让你了解在线评分系统是如何工作的。\n\n如果你查看艺术家名称和 CD 标题下方的五颗星，你会注意到星级旁边有一个评分人数的计数。这非常重要，因为它让你对评分的可靠性有个概念——如果只有少数人对该项目进行评分，那么这个评分可能就没有太大意义。\n\
  \n提到这个评分示例的真正原因是为了指出 [Amazon.com](http://Amazon.com) 的评分方法在选择评分时涉及了一个相当不尽如意的用户界面。我指的是用于选择评分的选择列表，它允许你选择星级评分的文本描述，例如“五星”或“四星”。除了\
  \ [Amazon.com](http://Amazon.com) 还支持带有评分的文本评论外，你还必须在评分生效之前进行预览并接受你的评分。如果可以直接在项目主页上直接点击五星评分来对项目进行评分，将会要直观且高效得多。诚然，这并不能解决写评论的需求，但并不是每个人都对写评论感兴趣——有时，你只需要快速的“点完就走”式评分就足够了。\n\
  \n本章的挑战是使用 Ajax 将一个交互式五星评分组件整合到 Web 页面中，使用户无需离开页面即可对项目进行投票。这与你已经学关于 Ajax 的很多内容是一致的，即当你只是微调少量数据时，尽可能减少页面的重新加载。在这种情况下，你想要的只是向服务器提交单条评分数据，然后在投票处理后查看总评分计数。这绝对在\
  \ Ajax 可以处理的范围之内。\n\n这个挑战中一个你可能好奇的棘手部分是评分投票的持久化存储。回想你迄为止看到的所有示例 Ajax 程序，这是第一个需要记住用户提交内容的程序。具体来说，`Rater`\
  \ 程序必须以某种方式在服务器上存储每个项目在发布后的每个投票。幸运的是，我为你提供了一个预构建的评分组件，它可以处理在服务器 XML 文档中存储评分数据的所有细节。如果你有兴趣，我还为你提供了一些关于可能使用数据库代替\
  \ XML 文件的想法。\n\n我所说的这个评分组件包含在随书光盘中附带的 Ajax Toolkit 中。该组件涉及客户端和服务器端代码，以及几张图像和一个样式表。在后台，一个由\
  \ Ajax 驱动的五星评分系统比你想象的要复杂得多，这就是为什么需要这么多文件才能实现这一神奇效果。\n\n在评分组件的客户端 JavaScript 代码（包含在\
  \ `ratingkit.js` 中）中使用以下两个函数来控制评分系统：\n\n* `initRatings()`——初始化页面上所有项目的评分\n* `setRating()`——为单个项目投出评分票\n\
  \n在 PHP 服务器脚本 (`ratingkit.php`) 的帮助下，这些函数使得你可以为页面上尽可能多的单个项目分配评分。不仅如此，评分组件还足够智能，可以限制特定计算机上的投票次数为每个用户一次票。它是通过巧妙地使用\
  \ Cookie 实现的，Cookie 提供了一个完美的机制，用来记住用户是否已执行了某些操作（例如对特定项目进行评分）。\n\n希望我已经让你信服了：通过提供一个预构建的组件，我已经完成了大部分的评分工作。那么对于\
  \ `Rater` 程序挑战来说还留下了什么呢？`Rater` 程序的挑战是为可评分项目正确设置 HTML 代码，以便它们连接到评分组件并正确投出票。此外，几个\
  \ CSS 评分类是评分组件的一部分，必须仔细地分配给 `Rater` 页面上的元素，评分才能正常工作。\n\n为了保持 `Rater` 程序的 HTML 代码相当简单，且不涉及许多额外的图像或其他资源，被评分的项目是著名的名言。`Rater`\
  \ Web 页面由五个著名名言组成，因此有五个不同的评分——每个名言一个。`Rater` Web 页面需要为每个名言包含一个唯一的评分组件并对其进行正确标识，以便对该名言的投票存储在服务器上以供以后检索。最后，`Rater`\
  \ 程序将允许网络上的无数人对他们喜爱的名言进行投票，所有的评分票都在服务器上汇总，并将总票数显示在页面上。\n\n在开发 `Rater` 程序之后，你将获得复用该评分组件为任何类型的\
  \ Web 内容评分的能力。\n\n## 设计：设计 Rater 程序\n\n`Rater` 程序的设计从名言本身开始，因为它们在这个特定的示例中驱动着评分过程。由于名言只是文本，因此只需将它们封装在\
  \ `div` 中，而不需要任何特殊格式或其他代码。虽然评分立即出现在名言下方，但在 HTML 代码方面，没有东西直接将评分和名言联系在一起。\n\n评分与名言之间的连接与评分的“项目\
  \ ID”（item ID）有关，这是一段用于在其他评分中唯一标识某个评分的文本。如果你将网站上所有的评分看作一个大集合（它们确实是），那么每个评分都有一个唯一的\
  \ ID 允许你区分它们。项目 ID 应该以某种方式给你关于该评分与哪个名言关联的线索。例如，你可以使用名言作者的姓氏作为评分的 ID，这实际上正是 `Rater`\
  \ 程序所使用的。\n\n项目 ID 是至关重要的，因为它与评分票一起存储，因此它被用于将存储的评分与页面上的名言联系起来。提到页面上的名言，图 12.1 显示了\
  \ `Rater` 用户界面的基本布局，包括名言及其相应的评分。\n\n### 图 12.1. Rater 程序的用户界面由几个文本名言组成，每个名言都有一个评分组件。\n\
  \n![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdjzmghnm2kuawlmms8-.jpg)\n\
  \n该图显示了每个名言后面紧跟着一个评分及其相关的辅助文本。辅助文本最初只是指示你点击评分以提交投票。一旦你对评分进行了投票，辅助文本就会改变，显示为该评分已投了多少票。因此，辅助文本兼顾了双重作用：首先作为指令，然后作为显示评分信息的手段。\n\
  \n\n\n\nAjax Toolkit 提供的评分组件处理了 Rater 应用中 Ajax 请求的所有细节。本章的目标不是剖析 rater 组件的内部机制，而是向你展示如何使用它将评分集成到\
  \ Web 中。尽管如此，快速了解 Ajax 在组件中如何以客户端请求和服务器响应的形式运行仍然是有价值的。\n\n## 客户端请求\n\n评分组件涉及两种不同的客户端请求：一个用于初始获取页面上所有评分的评分，另一个用于对特定评分进行投票。第一个请求在页面初始加载时正好发生一次，而如果页面上有多个评分，第二个请求可能会发生多次。当然，评分组件确实使用了\
  \ cookie 来防止你对某个评分进行多次投票。但事实仍然是，对每个评分的每次投票都会产生一个 Ajax 请求。\n\n当对所有评分发出 Ajax 请求时，客户端不需要传递任何信息。换句话说，Ajax\
  \ 请求的 URL 仅包含 PHP 服务器脚本，该脚本从 XML 文件读取评分并返回结果。\n\n与获取评分请求不同，提交投票的 Ajax 请求需要参数。此请求所需的参数是项目\
  \ ID（item ID）和评分本身（一到五星）。这两个参数被传递给服务器并在那里正确地集成到评分数据中，这意味着它们被用于增加票数并重新计算平均分。\n\n\
  ## 服务器响应\n\nAjax Toolkit 中用于评分组件的服务器响应根据请求的不同而异。当为了初始化页面评分而检索所有评分时，服务器会返回所有存储为 XML\
  \ 文档的评分。然后，由客户端代码根据评分 ID 确定哪些评分适用于该页面。\n\n设置评分的服务器响应涉及新计算的平均分以及为指定项目 ID 投出的总票数。这两条信息返回给客户端脚本，脚本随后相应地更新页面上的评分。\n\
  \n## 理解客户端到服务器的对话\n\n为了帮助熟悉 Rater 应用（rater 组件）中客户端和服务器之间的数据流，请查看图 12.2。\n\n### 图\
  \ 12.2. Rater 应用的后台有两个用于初始化评分和提交新评分投票的 Ajax 请求。\n\n![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdjzmghnngkuawlmms8-.jpg)\n\
  \n该图揭示了初始评分请求不涉及从客户端的数据流，但返回了一个包含所有评分的完整 XML 文档。因为提交 Ajax 请求时不需要参数，因此请求的 URL 仅仅是\
  \ PHP 服务器脚本的名称：\n\n```\nratingkit.php\n```\n\n虽然从客户端流向服务器的数据非常少，但反向返回的数据要有趣得多。以下是响应\
  \ XML 文档的示例：\n\n代码视图：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<ratings>\n\
  \  <rating>\n    <id>twain</id>\n    <avg>4.5</avg>\n    <votes>2</votes>\n  </rating>\n\
  \  <rating>\n    <id>ali</id>\n    <avg>3.33333333333</avg>\n    <votes>3</votes>\n\
  \  </rating>\n  <rating>\n    <id>einstein</id>\n    <avg>3</avg>\n    <votes>2</votes>\n\
  \  </rating>\n  <rating>\n    <id>shaw</id>\n    <avg>4</avg>\n    <votes>2</votes>\n\
  \  </rating>\n  <rating>\n    <id>paine</id>\n    <avg>4</avg>\n    <votes>1</votes>\n\
  \  </rating>\n </ratings> \n```\n\n此 XML 文档的结构非常简单，它由评分列表组成，每个评分包含三个不同的数据：\n\n*\
  \ 项目 ID (`<id>`)\n* 评分平均分 (`<avg>`)\n* 票数 (`<votes>`)\n\n这些信息足够描述单个项目的评分。XML 文档中的每个\
  \ `<rating>` 标签对应于单个项目的评分。整个文档作为评分的数据格式，这意味着如果你打开在服务器上生成的 `ratings.xml` 文件，将看到相同的\
  \ XML 代码。需要注意的是，该文件作为你网站上所有评分（可能跨越多个页面）的主数据库。关键在于项目 ID，只要 ID 标识正确，你就可以在网站的任何地方使用评分。\n\
  \n注意\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 正如你在本章稍后在“为 Rater 进行极速 Ajax 改造”部分中发现的，项目 ID 可以是你想想要的任何文本。虽然 Rater 应用使用名称作为 ID，但你同样可以轻松使用数字或字母与数字的组合。重要的是使用唯一且易于与项目关联的项目\
  \ ID。例如，书籍评分的项目 ID 可以书籍的国际标准书号 (ISBN)，这样 ID 保证是唯一的，并且与书籍有明显的关联。 |\n\n如果你想查看存储在你网站上评分的\
  \ XML 数据，只需在浏览器中不带任何参数或内容输入评分组件的 PHP 服务器脚本 (`ratingkit.php`) 即可。图 12.3 显示了直接打开服务器脚本时在浏览器中显示的评分\
  \ XML 代码。\n\n### 图 12.3. 直接输入评分组件 PHP 服务器脚本的 URL 将显示评分 XML 文档。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3ayczvhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdjzmghqnxauawlnms8-.jpg)\n\
  \nRater 应用中使用的另一个 Ajax 请求涉及存储新评分。用于处理此请求的服务器脚本底层代码稍微杂乱一些，因为它必须足够智能，以便在 XML 文件不存在时创建一个新的\
  \ XML 文件 (`ratings.xml`)（即：这是任何项目的第一票票）。假设 XML 文件确实存在，服务器脚本必须搜索 XML 代码并根据项目 ID 找到评分。然后它通过计算新平均分并增加票数来更新评分。\n\
  \n用于发布新评分的 URL 将将项目 ID 和评分作为参数传递给服务器脚本。然而，与你在整书中看到的其他 Ajax 请求不同，此请求是以 `POST` 而不是\
  \ `GET` 发出的，因为请求的意图是更改服务器上的信息。在 `POST` 请求中，URL 仅仅是脚本的名称，而参数（项目 ID 和评分）作为单独参数传递给文件\
  \ `ajaxkit.js` 中 Ajax Toolkit 的 `ajaxSendRequest()` 函数。我意识到陷入了一些你可能并不感兴趣的细节，考虑到这里的重点是代码复用，但我希望你对\
  \ rater 组件的内部机制有足够的了解，以便在需要时对其进行修改。\n\n回到评分提交请求，服务器的响应包含了新计算的评分平均分和投出的总票数。虽然可以使用\
  \ XML 来格式化此返回数据，但并非必要。因此，数据以冒号分隔的对的形式返回，如下：\n\n```\n4.5:2\n```\n\n这是在对你刚刚看到的 XML\
  \ 数据中的第一个引言进行最后一次投票后返回的数据。如果你回看该数据，将看到以下代码：\n\n```xml\n<rating>\n  <id>twain</id>\n\
  \  <avg>4.5</avg>\n  <votes>2</votes>\n</rating>\n```\n\n\n\n\n因此，服务器对已提交评分投票的响应仅仅是返回两个刚写入\
  \ XML 文件的数据：`<avg>` 和 `<votes>` 内容。\n\n### 组装评分应用程序 (Rater Application)\n\n除了随书附带的光盘中包含的\
  \ Ajax Toolkit 的几个文件外，Rater 应用由单个 Web 页面和一个并非严格必需的辅助 Web 页面组成：\n\n* HTML Web 页面\
  \ (`rater.html`)\n* Cookie 重置 Web 页面 (`cookiereset.html`)\n\nRater 应用包含在 Rater Web\
  \ 页面 (`rater.html`) 中，而 Cookie 重置 Web 页面 (`cookiereset.html`) 是一个用于测试清除评分 Cookie\
  \ 的独立辅助页面。接下来的几个章节将详细检查这些文件。\n\n### Rater Web 页面\n\nRater Web 页面使用了五个独立的评分，每个评分都应用于页面上在每个评分之前显示的文本引言。其设计理念是让你能够阅读一段引言，然后立即对其进行评分。图\
  \ 12.4 显示了 Rater Web 页面，其中已经进行了几次评分投票，但仍有几项处于未评分状态。\n\n#### 图 12.4. Rater Web 页面显示了多个引言，每个引言都配有一个五星级评分组件。\n\
  \n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3ayczzhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdjzmghqnnauawlnms8-.jpg)\n\
  \n如果你仔细观察该图，你会发现对穆哈默德·阿里引言的评分使用了更大的星星和文本。这演示了评分组件如何支持两种不同的尺寸。在实践中，评分组件的小大版本之间的区别仅在于对评分使用了不同的\
  \ CSS 样式类。\n\n诚然，Rater Web 页面的实际代码相当冗长，请做好准备。只需记住，代码列表很长的主要原因是页面使用了五个不同的评分，每个评分都需要几行代码。以下是\
  \ Rater 页面主体的缩略代码，所有有趣的内容都发生在这里：\n\n代码视图：\n\n```\n<body onload=\"initRatings()\"\
  >\n  <div id=\"ajaxState\" style=\"display:none\"></</div>\n  <br />\n  <div>银行家就是那种在阳光晴朗时借给你伞，\n\
  \    但在雨刚开始下的那一刻就想把它要回去的人。<br />\n    - Mark Twain</</div>\n  <<div>\n    <span\
  \ class=\"rating-label-small\">Rating:</span>\n    <span class=\"inline-rating\"\
  >\n      <ul class=\"star-rating small-star\">\n        <li id=\"twain-rating\"\
  \ class=\"current-rating\"\nstyle=\"width:0%\">Rating</li>\n        <li><a href=\"\
  javascript:setRating('twain', 1);\"\n          class=\"one-star\">1</a></li>\n \
  \       <li><a href=\"javascript:setRating('twain', 2);\"\n          class=\"two-stars\"\
  >2</a></li>\n        <li><a href=\"javascript:setRating('twain', 3);\"\n       \
  \   class=\"three-stars\">3</a></li>\n        <li><a href=\"javascript:setRating('twain',\
  \ 4);\"\n          class=\"four-stars\">4</a></li>\n        <li><a href=\"javascript:setRating('twain',\
  \ 5);\"\n          class=\"five-stars\">5</a></li>\n     </ul>\n   </span>\n   <span\
  \ id=\"twain-info\" class=\"rating-info-small\">\n     (click to vote)</span>\n\
  \  </div>\n  <hr />\n  <div>从昨天中学习，为今天而活，对明天充满希望。\n   重要的不要停止提问。<br />\n   - Albert\
  \ Einstein</</div>\n  <div>\n    <span class=\"rating-label-small\">Rating:</span>\n\
  \    <span class=\"inline-rating\">\n      <ul class=\"star-rating small-star\"\
  >\n        <li id=\"einstein-rating\" class=\"current-rating\"\n          style=\"\
  width:0%\">Rating</li>\n        <li><a href=\"javascript:setRating('einstein', 1);\"\
  \n          class=\"one-star\">1</a></li>\n        <li><a href=\"javascript:setRating('einstein',\
  \ 2);\"\n          class=\"two-stars\">2</a></li>\n        <li><a href=\"javascript:setRating('einstein',\
  \ 3);\"\n          class=\"three-stars\">3</a></li>\n        <li><a href=\"javascript:setRating('einstein',\
  \ 4);\"\n          class=\"four-stars\">4</a></li>\n        <li><a href=\"javascript:setRating('einstein',\
  \ 5);\"\n          class=\"five-stars\">5</a></li>\n      </ul>\n    </span>\n \
  \   <span id=\"einstein-info\" class=\"rating-info-small\">\n      (click to vote)</span>\n\
  \  </div>\n  ...\n</body> \n```\n\n这段代码的关键在于对评分使用了仔细的 CSS 样式类。这些类定义在 `ratingkit.css`\
  \ 样式表中，负责当你将鼠标悬停在评分星星上时的动画悬停效果。这种实现五星评分的 CSS 方法最初是由 Komodo Media 的 Rogie King 创建的，该网站位于\
  \ [`www.komodomedia.com`](http://www.komodomedia.com)/。这段代码运行得非常好，以我将其作为 Ajax Toolkit\
  \ 中评分组件的基础。\n\nRater Web 页面中的每个评分都是作为一个无序列表创建的，评分中的每个星星都是列表中的项。巧妙之处在于列表项是水平显示而不是垂直显示，这导致了星星水平排列。这看起来像是使用列表的一种奇怪方式，确实如此，但对于评分来说效果非常好。技巧在于对列表应用适当的样式，以便悬停效果按预期工作。\n\
  \n第一步是创建一个包含评分标签的 `span` 元素，该标签只是静态文本：\n\n```\n<span class=\"rating-label-small\"\
  >Rating:</span>\n```\n\n当然，即使是静态文本也必须对其应用相应的 CSS 样式类（`rating-label-small`）。如果你想为较大的评分组件使用更大的标签，请使用\
  \ `rating-label` 而不是 `rating-label-small`。\n\n下一步是创建另一个 `span` 元素，作为评分组件的外壳：\n\n\
  ```\n<span class=\"inline-rating\">\n```\n\n在在这个 `span` 元素中，你添加了无序列表容器元素 `ul`，如下所示：\n\
  \n```\n<ul class=\"star-rating small-star\">\n```\n\n这个 `ul` 元素是为小型评分组件样式化的，这意味着它将使用在\
  \ `star_sm.gif` 图像文件中较小的星星图像。如果你想使用较大的评分组件，只需去掉 `small-star` 类，使代码看起来像这样：\n\n```\n\
  <ul class=\"star-rating\">\n```\n\n到目前为止，评分组件完全是通用的，没有特定于某个项的代码。随着第一个列表项的添加，这种情况即将发生变化，该项是控制可见星星数量的特殊项：\n\
  \n```\n <li id=\"twain-rating\" class=\"current-rating\"\nstyle=\"width:0%\">Rating</li>\n\
  ```\n\n现在你看到了特定评分的第一个证据，项目 ID `twain` 通过其 `id` 属性（twain-rating）被标识。\n\n接下来是星星本身，它们都被编码为\
  \ `li` 列表元素：\n\n```\n <li><a href=\"javascript:setRating('twain', 1);\"\n     class=\"\
  one-star\">1</a></li>\n   <li><a href=\"javascript:setRating('twain', 2);\"\n  \
  \   class=\"two-stars\">2</a></li>\n   <li><a href=\"javascript:setRating('twain',\
  \ 3);\"\n     class=\"three-stars\">3</a></li>\n   <li><a href=\"javascript:setRating('twain',\
  \ 4);\"\n     class=\"four-stars\">4</a></li>\n   <li><a href=\"javascript:setRating('twain',\
  \ 5);\"\n     class=\"five-stars\">5</a></li>\n```\n\n这里的每行代码都代表五星评分中的五颗星星之一。每个星星不仅作为评分的视觉指示，还作为发布评分投票的触发器。这通过响应列表项中的每个链接调用\
  \ `setRating()` 函数是显而易见的。`setRating()` 函数接收项目 ID 作为第一个参数（在此例中为 `twain`），随后是设置的评分。因此，`setRating()`\
  \ 函数的第二个参数是要设置的星星数量。\n\n现在你准备好关闭评分组件的主要部分了，如下：\n\n\n\n\n\n```html\n \n\n\n</span\n\
  ```\n\n最后剩余的代码是最后一个 `span` 元素，用于显示评分右侧的辅助文本：\n\n```html\n<span id=\"twain-info\"\
  \ class=\"rating-info-small\">\n  (click to vote)</span>\n```\n\n注意，这段代码使用了 `rating-info-small`\
  \ CSS 样式类，它对应于小型评分组件。如果你正在创建一个大型评分组件，请将此样式更改 `rating-info`。\n\n此代码在构建元素的 `id` 属性（`twain-info`）时也使用了项目\
  \ ID（`twain`）。请记住，该元素的目的是指导用户如何投票（在投票之前），并显示总票数（在投票之后）。辅助文本扮演的第三个角色是在服务器正在存储投票时显示状态消息。这最后一个角色与你在其他示例中看到的“加载中”（loading）图像非常相似，区别在于这里使用了“加载中”文本代替了图像。\n\
  \n到此，Rater 页面中单个评分组件的拆解就结束了。如果你回顾整个页面使用的评分代码，你会看到五段不同的代码，它们完全遵循了你刚刚检查的结构。\n\nRater\
  \ 应用中唯一遗留的问题是对对 `initRatings()` 函数的调用，这必须在页面 `body` 的 `onload` 事件处理程序中进行。该函数最初设置页面上所有评分的值。如果没有这个函数，将评分写入服务器文件的好处将无复存在。\n\
  \n## Cookie 重置 页面\n\nCookie 重置页面（`cookiereset.html`）是 Rater 应用的一个辅助工具，用于重置 Cookie\
  \ 并允许你对 Rater 页面上的任何引言再次进行投票。这对于测试应用程序以及尝试不同的评分非常有帮助，而无需访问多台不同的计算机。当然，你永远不会发布 Cookie\
  \ 重置页面以便其他用户可以访问；它纯粹只是一个供你自己的测试使用的内部工具。\n\n图 12.5 显示了 Cookie 重置页面的运行情况，承认的是，这一点也不有趣。\n\
  \n### 图 12.5. Cookie 重置页面显示了一条快速消息，让你知道 Rater Cookie 已经重置。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3ayczdhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdjzmghqn3auawlnms8-.jpg)\n\
  \nCookie 重置页面之所以缺乏趣味性，源于它除了清除与五个引言评分相关的五个 Cookie 的值之外，什么都不做的事实。以下是该页面的完整 HTML 代码\
  \ `cookiereset.html`，它应该能说明清除 Cookie 的过程：\n\n```html\n<<html>\n  <head>\n    <title>Rater\
  \ - Cookie Reset</title>\n    <script type=\"text/javascript\">\n      document.cookie\
  \ = \"twain-rating=\";\n      document.cookie = \"einstein-rating=\";\n      document.cookie\
  \ = \"ali-rating=\";\n      document.cookie = \"paine-rating=\";\n      document.cookie\
  \ = \"shaw-rating=\";\n    </script>\n  </head>\n\n <body>\n   <p>The cookies are\
  \ reset.</p>\n </body>\n</</html>\n```\n\n如你所见，五个 Cookie 在页面的 `head` 部分被清除了。清除 Cookie\
  \ 只需将 Cookie 设置为空。正确获取每个 Cookie 的名称极其重要，在这种情况下，我遵循了 Rater 应用中建立的命名规范，即将引言 ID 放在文本——`rating`\
  \ 之前以得到 Cookie 名称。\n\n请记住，Cookie 重置页面实际上只是一个节省时间的工具。你的 Web 浏览器可能包含一个清除它所积累的所有 Cookie\
  \ 的选项。然而，某些浏览器只提供清除所有 Cookie 的选项。即使有清除单个 Cookie 的选项，考虑到你任何时候都可能在浏览器中存储了数百个 Cookie，寻找评分\
  \ Cookie 也会变得极其乏味。\n\n**注意**\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 当你在自己的 Web 页面中复用评分组件时，你可能会使用不同的项目 ID，在这种情况下，你将需要修改 Cookie 重置页面，以便清除你的新 Cookie。\
  \ |\n\n## 测试 Rater\n\nRater 应用是一个相当有趣的测试应用，因为它涉及存储在服务器上的数据，这意味着应用程序维持了某种状态。这是另一种说法，即它记得已经投出的票。还要记住，该应用程序的设计目的是防止来自某台计算机的对特定项目进行多次投票。因此，要在一台计算机上彻底测试应用程序，你需要使用\
  \ `cookiereset.html` 页面来重置创建的评分 Cookie。\n\n图 12.6 显示了处于空白状态的 Rater 应用（即对任何评分尚未投票）。\n\
  \n### 图 12.6. 当你首次启动 Rater 应用时，所有的引言都已准备好进行评分。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3ayczhhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdjzmghqohauawlnms8-.jpg)\n\
  \n由于此时还没有投任何票，因此没有设置 Cookie，因此所有评分都可以投票。将鼠标悬停在其中一个评分上，可以让你通过用深色星星突出亮色星星来查看潜在的评分（参见图\
  \ 12.7）。\n\n### 图 12.7. 用鼠标悬停在评分上可以让你预览你即将进行的评分。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3ayczlhadbsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdjzmghqoxauawlnms8-.jpg)\n\
  \n要完成特定项目的评分，只需点击评分的星级数字。这将导致投票产生，此时星星旁边的辅助文本会变化，以指示正在投票。图 12.8 显示了页面上第一个评分组件的这种效果，它对应于马克·吐温的一句引言。\n\
  \n### 图 12.8. 在发出评分投票后，五星评分旁边的辅助文本会变化，以指示正在投票。\n\n[[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3ayczbhadfsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdjzmwhqmhauawlnms8-.jpg)\n\
  \n一旦投票完成，项目的平均评分将以金星的形式出现。这很有意义，因为在投自己的票之前，是不允许看到平均评分的。该项目收到的总票数也会显示在星星旁边的辅助文本中。图\
  \ 12.9 显示了马克·吐温引言在收到第一张四星票后的状态。\n\n### 图 12.9. 成功提交评分投票后，评分组件将变化以显示平均评分和总票数。\n\n\
  [[查看全尺寸图像]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3ayczfhadfsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdjzmwhqmxauawlnms8-.jpg)\n\
  \n除了演示较小的五星评分组件外，Rater 应用还展示了如何使用带有更大星星图像和相关文本的大型版本。穆哈默德·阿林的引言使用了该组件的大型版本——图 12.10\
  \ 显示了使用该组件投票。\n\n### 图 12.10. 评分组件也支持使用更大星星图像和更大文本的大型版本。\n\n\n\n\n\n[[查看全图]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmmuamdwz3ayczjhadfsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdjzmwhqmnauawlnms8-.jpg)\n\
  \nRater 应用程序和评分组件的真正威力在于许多不同的人能够对项目进行评分。虽然该组件设计为通过 cookie 防止在同一台机器上进行重复投票，但你可以通过加载一个清除评分\
  \ cookie 的特殊 Web 页面来绕过这一限制。如果你在浏览器中打开 `cookiereset.html` Web 页面，它将清除 Rater Web 页面的所有\
  \ cookie，从而让你能够像其他人在他们自己的电脑上看到的那样查看该页面。\n\n### 注意\n\n| ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg)\
  \ | 如果你多次使用 Cookie 重置页面，请务必刷新该页面，并在重置 cookie 后刷新 Rater Web 页面。否则，cookie 的变化将不会生效。\
  \ |\n\n图 12.11 显示了对引言进行多次投票的 Rater 应用程序。事实上，该图显示了所有的平均分，这意味着每个引言都已有投票。\n\n#### 图\
  \ 12.11。通过重置 cookie，你可以再次对项目投票，并绕过每台电脑只能投一次票的限制。\n\n[[查看全图]](ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnkvmuamdwz3aycznhadfsav9pmxqv.jpg)![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvzmnncdjzmwhqm3auawlnms8-.jpg)\n\
  \n评分组件的酷之处在于它存储评分的方式使得在投额外票时，服务器上的 XML 文件不会增长。因此，你可以让尽可能多的人对项目投票，而无需担心评分数据文件增长到失控。\n\
  \n### 为 Rater 进行极速 Ajax 改造\n\n扩展 Rater 应用程序有多种不同的方法，但你最可能想做的首先是将评分组件应用到你自己的 Web\
  \ 页面。我假设你心中已经有一些项目，想为它们添加五星级评分功能。这些项目可以是图片、音乐片段、视频、文本或你想象的任何内容。重点在于你需要在页面上项目附近添加评分组件的\
  \ HTML 代码，以便于访问。\n\n在你自己的页面上添加评分组件的第一步是导入适当的 Ajax Toolkit 文件。以下代码需要添加到包含评分的页面的 `<head>`\
  \ 中：\n\n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"ratingkit.css\" />\n\
  <script type=\"text/javascript\" src=\"ajaxkit.js\"> </script>\n<script type=\"\
  text/javascript\" src=\"domkit.js\"> </script>\n<script type=\"text/javascript\"\
  \ src=\"ratingkit.js\"> </script>\n```\n\n这段代码导入了评分 CSS 样式表以及为了评分组件工作而需要的所有几个 JavaScript\
  \ 文件。接下来的要工作是在 `<body>` 标签的 `onload` 事件处理器中调用 `initRatings()` 函数，如下所示：\n\n```\n\
  <body onload=\"initRatings()\">\n```\n\n这确保了页面上的所有评分都得到正确初始化。\n\n从这里开始，代码在很大程度上取决于你如何组织评分。假设你在线商店中有许多你想要评分的产品。在这种情况下，你可能希望使用一个项目\
  \ ID 进行评分，并将该 ID 以某种方式与现有的产品 ID 关联起来。这可能是某种类型的数字，类似于零售 UPC 代码或 Amazon.com 的 ASIN\
  \ 数字（公司使用这些数字来唯一标识产品）。为了简单起见，我们假设你的产品是从 1 开始递增的简单整数。因此，你的产品编号为 1, 2, 3, 4 等。\n\n\
  现在你有了一个项目 ID 来唯一标识每个项目的评分，这就是你向页面添加评分所需的所有内容。以下是第一个产品（项目 ID 为 1）的小评分代码：\n\n```\n\
  <div>\n  <span class=\"rating-label-small\">Rating:</span>\n  <span class=\"inline-rating\"\
  >\n    <ul class=\"star-rating small-star\">\n      <li id=\"1-rating\" class=\"\
  current-rating\"\n        style=\"width:0%\">Rating</li>\n      <li><a href=\"javascript:setRating('1',\
  \ 1);\"\n        class=\"one-star\">1</a></li>\n      <li><a href=\"javascript:setRating('1',\
  \ 2);\"\n        class=\"two-stars\">2</a></li>\n      <li><a href=\"javascript:setRating('1',\
  \ 3);\"\n        class=\"three-stars\">3</a></li>\n      <li><a href=\"javascript:setRating('1',\
  \ 4);\"\n        class=\"four-stars\">4</a></li>\n      <li><a href=\"javascript:setRating('1',\
  \ 5);\"\n        class=\"five-stars\">5</a></li>\n    </ul>\n  </span>\n  <span\
  \ id=\"1-info\" class=\"rating-info-small\">\n    (click to vote)</span>\n</div\n\
  ```\n\n你看到代码中的模式了吗？项目 ID 恰好出现在七个地方，每一个都至关重要。项目 ID 第一次出现于 `<li>` 列表项标签的 `id` 属性中，设置为\
  \ `1-rating`。接下来的五次出现在对每个可能的投票（一星到五星）的 `setRating()` 函数调用中。在这种情况下，值 `'1'` 作为第一个参数传递给函数；这就是项目\
  \ ID。最后，项目 ID 在代码末尾附近的 `<span>` 元素的 `id` 属性中再次作为 `1-info` 被引用。这正是将评分组件的帮助文本与特定项目关联起来的机制。\n\
  \n对于页面中的每个单独评分，所有这些项目 ID 引用都必须正确设置。为了确保你理解它是如何运作的，让我们快速跳过产品目录，直到到达 ID 为 379 的产品。以下是为该项目添加评分组件的代码：\n\
  \n```\n<div>\n  <span class=\"rating-label-small\">Rating:</span>\n  <span class=\"\
  inline-rating\">\n    <ul class=\"star-rating small-star\">\n      <li id=\"379-rating\"\
  \ class=\"current-rating\"\n        style=\"width:0%\">Rating</li>\n      <li><a\
  \ href=\"javascript:setRating('379', 1);\"\n        class=\"one-star\">1</a></li>\n\
  \      <li><a href=\"javascript:setRating('379', 2);\"\n        class=\"two-stars\"\
  >2</a></li>\n      <li><a href=\"javascript:setRating('379', 3);\"\n        class=\"\
  three-stars\">3</a></li>\n      <li><a href=\"javascript:setRating('379', 4);\"\n\
  \        class=\"four-stars\">4</a></li>\n      <li><a href=\"javascript:setRating('379',\
  \ 5);\"\n        class=\"five-stars\">5</a></li>\n    </ul>\n  </span>\n  <span\
  \ id=\"379-info\" class=\"rating-info-small\">\n    (click to vote)</span>\n</div\n\
  ```\n\n希望这段代码强调了评分代码中项目 ID 的位置。只要你仔细地更改项目 ID，你就可以多次粘贴这段代码块来创建不同的评分。\n\n### 注意\n\n\
  | ![](img/ys8wohawzzmxcjm1mjjlzgftdc9zyzc4cjlnmgkvdgmucg9zagpwawdll24-.jpg) | 另一个容易应用的快速评分改造是用你自己的图像替换星星图像。大星星和小星星的图像分别存储在\
  \ `star.gif` 和 `star_sm.gif` 文件中。这两个文件每个都包含了用于悬停效果的三个不同的星星。星星在 GIF 图像中垂直排列，且尺寸相同（大的为\
  \ 25x25，小的为 10x10）。如果你使用相同的图像并以相同的方式垂直排列，你就可以轻松更改评分组件的外观——只需将自己的星星图像文件覆盖 `star.gif`\
  \ 和/或 `star_sm.gif` 即可。 |\n\n在自己的页面中复用评分组件并不是值得考虑的唯一极端改造。虽然评分组件目前运行良好，但你可能对使用 XML\
  \ 文件在服务器上存储评分数据并不完全满意。我选择这种方法主要是因为不想让应用程序变得比必要的复杂，而引入数据库会增加相当的复杂性。但这并不是一个坏主意。\n\n\
  \n\n\n\n如果你具有一些 MySQL 或或其他数据库的经验，你可以考虑重构 `ratingkit.php` 服务脚本，使其使用数据库读取和写入评分数据，而不是使用\
  \ XML 文件。与其深入探讨 MySQL 实现的具体编码细节，我将为你勾勒出实现这一操作的总体蓝图。\n\n简而言之，要更改 Ajax Toolkit 中的评分组件以便使用\
  \ MySQL 数据库进行评分存储和检索而非 XML 文件，需要以下步骤：\n\n1. 创建一个名为 `rating` 的数据库表，包含以下字段：`id`、`avg`\
  \ 和 `votes`。这些字段与 `ratings.xml` 文件中同名的标签是一一对应的关系。\n2. 修改 `ratingkit.php`，使其建立数据库连接而不是打开\
  \ XML 文件。\n3. 修改 `ratingkit.php`，使其通过数据库查询读取 `rating` 表中的所有行，而不是读取 `ratings.xml`\
  \ 文件。\n4. 修改 `ratingkit.php`，使所有遍历 XML 数据结构中评分的代码改为遍历从数据库查询中返回的行。\n5. 修改 `ratingkit.php`，使其通过修改\
  \ `rating` 表中相应的行来存储评分，而不是写入 XML 文件。\n\n我意识到这些步骤是极其通用的，并且需要相当的 MySQL 经验才能执行。但坦诚地说，这正是重点——如果你没有完成此任务\
  \ MySQL 技能，我宁愿你坚持使用 XML 文件方案。相信我，对于任何具备数据库技能的人来说，这都是非常基础的数据库挑战。如果你缺乏数据库技能（像我们中的许多人那样），只需使用\
  \ XML 版本即可，它应该能够完全满足你的需求。\n\n### 总结\n\n尽管你可能并不总是喜欢收到的反馈，但允许用户对你网站上的内容进行评分的益处是不言而喻的。评分是任何互动在线社区的核心功能之一，帮助人们更有参与感并获取更多信息。你在本章中学习如何使用的\
  \ Ajax 评分组件足够灵活，支持任意数量的单独评分项目，并拥有一个非常直观的用户界面，用于提交一到五星的评分。得益于服务器使用简单的 XML 文件来存储评分，你甚至不需要成为数据库大师即可开始使用评分。然而，如果你确实是一个数据库大师，你可能想要考虑应用极端的\
  \ Ajax 改造想法，将评分存储整合到自己的数据库中。\n\n### 第三部分：附录\n\n| | |\n| :--- | :--- |\n| 附录 A |\
