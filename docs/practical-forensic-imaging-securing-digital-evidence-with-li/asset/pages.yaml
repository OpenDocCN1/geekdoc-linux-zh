    # # Filesystems in Linux


    An often-misunderstood concept is the difference between an attached disk device
    and a mounted disk device. A device does not need to be mounted to acquire or
    access it with forensic analysis tools. Forensic tools that operate directly on
    block devices will have access to attached disks without mounting them through
    the OS.'
