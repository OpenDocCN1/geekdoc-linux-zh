  md: '# Linux and OSS in a Forensic Context


    The growing popularity of open source software (OSS) like Linux has made it important
    as a platform for performing digital forensics. Many researchers have discussed
    the advantages of OSS for satisfying the Daubert guidelines for evidentiary reliability.¹
    Brian Carrier


    The primary advantage of using OSS in a forensic context is transparency. Unlike
    proprietary commercial software, the source code can be reviewed and openly validated.
    In addition, academic researchers can study it and build on the work of others
    in the community. Open source forensic software applications have become the tools
    and building blocks of forensic research. There are also disadvantages to using
    OSS and situations where it doesn''t make sense. In particular, the openness of
    the source community may in some cases conflict with the confidential nature of
    ongoing forensic investigations. Both the advantages and disadvantages of Linux
    and OSS are discussed in the following sections.


    # Advantages of Linux and OSS in Forensic Labs


    The public availability of OSS means it is accessible to everyone. It is not restricted
    to those who have purchased licenses or signed nondisclosure agreements. OSS is
    freely available for download, use, examination, and modification by anyone interested,
    and no licensing fees or use costs are involved.


    Having access to the source code allows you to customize and facilitate integration
    with other software, hardware and processes in a forensic lab. This source-level
    access increases the possibilities for automating and scripting workflows. Automation
    reduces the amount of human interaction needed, which limits the risk of human
    error and frees up these human resources so they can be used elsewhere.


    Automation is essential in labs with high volumes of code to foster optimization
    and process streamlining. Because you can freely modify the source code, OSS can
    be customized to meet the requirements of a particular forensic lab. Command line
    software allows you to link multiple tasks and jobs in pipelines with shell scripts
    to complete an end-to-end process.


    Support for OSS has several advantages. The ad hoc community support can be excellent,
    and mailing lists and chat forums can answer calls for help within minutes. In
    some cases, quick implementation of patches, bug fixes, and feature requests can
    occur.


    +   1. Erin Kennelly, “Gatekeeping of the Box: Open Source Software as a Mechanism
    to Assess Reliability for Digital Evidence," Virginia Journal of Law and Technology
    6, no. 13 (2001).

    2. Brian Carrier, "Open Source Digital Forensic Tools: The Legal Argument" [technical
    report] (Atstake Inc., October 2002).'
