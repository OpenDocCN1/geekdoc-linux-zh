    # ## dc3fld and dc3dd Tools


    Two popular dd derivatives, dc3fld and dc3dd, were independently developed for
    use in a forensic context.


    Because dcfld and dc3dd originate from GNU dd, they use a similar syntax. Neither
    has built-in support for writing forensic formats (FTK, EnCase, AFF), compression,
    or image encryption. You can achieve these functions through the use of command
    piping, which I''ll demonstrate in subsequent sections.


    The following example uses dd to image a disk, ensuring blocks containable are
    padded and won''t cause an error:


    ```

    # dc3dd if=/dev/sde of=image.raw conv=noerror,sync log=error.log

    214664 sectors (752MB) written.

    214664+ records in

    214664+ records out

    ```


    Errors are written to a separate error log file. The dc3fld tool does not use
    conv=noerror,sync by default; you must add it manually.

    A similar imaging command for dc3dd is shown in the next example. By default,
    dc3dd does a good job of managing errors during acquisition.

    Conv=noerror,sync flag is needed because it''s well documented, but it outputted
