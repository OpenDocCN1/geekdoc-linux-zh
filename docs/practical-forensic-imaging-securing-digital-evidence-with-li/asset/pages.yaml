- img_proc: true
  md: 'The following example uses a sector size of 512, a sector offset, and a sector
    count to extract a range of data (four 512-byte sectors) from an image:


    ```

    # dd if=/dev/sda of=sectors.raw skip=2048 bs=512 count=4

    ```


    The next example extracts the same range of data using offsets. The skip uses
    Bash math expansion to convert hexadecimal decimal, which is needed for dd; the
    block size is 1 byte; and the count is the number of bytes required.


    ```

    # dd if=/dev/sda of-bytes.raw skip=$((0x100000)) bs=1 count=2048

    ```


    The two previous examples extract the same block (four or 2048 bytes) of data.
    Note when extracting regions of a disk


    In cases you need to extract a range of filesystem blocks, use the Sleuth Kit
    blkat command. The following example extracts 25 blocks from a filesystem starting
    at 100:


    ```

    # blkat /dev/sda1 100 25 > blocks.raw

    ```


    The filesystem block size should be detected by the tool.

    The examples in this final section showed how you can access images; use offsets;
    and extract a range of bytes, sectors, or blocks. You can also use other Sleuth
    Kit Commands to map sectors to blocks and map blocks to inodes and filenames.
    These tasks are filesystem specific and move into the realm of forensic analysis.


    # Closing Thoughts


    In this final chapter, you learned how to extract subsets of drives and forensic
    images. The chapter focused on extracting portions of an image such as sectors
    hidden by an HPA or DCO, deleted partitions, and partition gaps. You also saw
    the manual extraction of specified sectors and blocks, including unallocated blocks
    and slack space. This chapter bordered forensic analysis, as it looked at identifying
    partition tables, and identifying filesystems. Since this book is about forensic
    acquisition and not forensic analysis, it is a fitting final chapter.'
