    # Microsoft VHD


    A number of methods help you make the Microsoft VHD virtual image accessible.
    For example, you can use the qemu-nbd method or use the libvhdi-utils with vhdinfo
    and vhimount.


    A third method is available using the biktap-utils with the Xen xapi interface.
    Similar to the nbd method, the biktap requires you to insert a kernel module and
    manually allocate a device. A tapdisk process is spawned, attached to the driver,
    and instructed to open a disk image. The manual for tapdisk aren''t very useful,
    but you can find a description on the Xen website at http://wiki.xen.org/wiki/Mounting_a_vhd_image_using_biktap/tapdisk
    and at http://lists.xen.org/archives/xen-api/2012-05/msg001941.html.


    To complete this section, I''ll repeat the process for setting up devices using
    the libvhdi tools. For simplicity, the previous examples used the privileged root
    user. But the following examples demonstrate a nonprivileged user to use sudo.


    To run the FUSE mount and unmount commands as a nonprivileged user, you need to
    set user_allow_other in /etc/fuse.conf.


    You can find information about the image using vhdinfo, and no special privileges
    are required:


    ```

    $ vhdinfo windows.vhd

    ```


    vhdinfo 20160111'
