    # Shell History


    This section discusses how to set up automated logging of shell commands\entered
    by the examiner on the command line. Ideally, this command

    logging should not increase complexity or interfere with the forensic work

    in progress. Using various tools, you can log the examiner’s command line

    activity with automated background processes. This approach is completely

    transparent to the examiner during the course of a forensic investigation.

    The Unix/Linux shell was not originally designed with logging or audit

    trails in mind. In the past, patches have been created to augment the his-

    tory mechanism, hacks have attempted to capture commands as the shell is

    , and commercial products have performed various logging.

    Developing a robust auditing and compliance system to log all commands

    with timestamps, including shell builtins as well as executed programs and

    pelines, is beyond the scope of this book.


    The Bash shell history can be configured to satisfy the following basic

    requirements:


    +   * Record the command entered by the examiner

    * Record a timestamp for each command entered

    * Record all commands, including duplicates, comments, and space-prefixed commands

    * Avoid truncating or overwriting history files

    * Avoid conflicts when using multiple terminal windows on the same system

    * Include root and non-root command history


    Using basic Bash shell history as an audit trail is rudimentary. Important

    information, as the command completion time, the working directory

    where the command was executed, and the return code, are not logged.

    The Bash history is not a tamper-resistant system: the examiner can easily

    modify or delete the history. Securing a secure and tamper-resistant audit

    environment with restricted access is beyond the scope of this book.


    Some shells, as zsh, have additional history features that allow

    for the logging of elapsed time. Other proposed solutions to improve

    shell include the use of PSH, PROMPT_COMMAND, trap and DEBUG, and

    key bindings to modify a command before executing. Using sudo logging:

    aududit logging; or special scripts, as preexec.sh, can also increase

    command line logging. A useful tutorial at http://www.pointsoftware.ch/

    en/howto-bash-audit-command-logger/ discusses this problem at length and'
