    # Linux Kernel and Storage Devices


    Traditional Unix systems, from which Linux inherits its philosophy, were designed
    in a way that everything on them is a file. Each file is designated as a specific
    type, which includes regular files and directories, block devices, character devices,
    named pipes, hard links, and soft/symbolic links (similar to LNK files in Windows).
    On the examiner workstation, files of interest to forensic investigators are the
    block device files of attached disks that potentially contain forensic evidence.
    This section describes Linux devices—in particular, block devices for storage
    media.


    # Kernel Device Detection


    Unix and Linux systems have a special directory called /dev/, which stores special
    files that correspond to devices understood by the kernel. Original Unix and Linux
    systems required manual creation of device files in the /dev directory (using
    the mkdev command) or scripts (MAKDEV) to create devices on boot or when required.
    With the arrival of plug-and-play hardware, a more dynamic approach was needed,
    devfs was created to automatically detect new hardware and create device files.
    The requirement to interact with users space and programs led to the development
    of udev, which replaced devfs. Today, udev has been merged into systemd and runs
    a daemon called systemd-udev.


    When a new device is attached to (or removed from) a host, an interrupt notifies
    the kernel of a hardware change. The kernel informs the udev system, creates appropriate
    devices with proper permissions, executes setup (or removal) scripts and programs,
    and sends messages to other devices (via dbus, for example).


    To observe udev in action, use the udevadm in monitor mode:


    ```

    # udevadm

    monitor will print the received events for:

    UDEV - the event u sends after rule processing

    KERNEL - the kernel event

    ```


    ```

    KERNEL[7661.685277] /devices/pci0000:00/0000:14.0/usb/1-14 (usb)

    KERNEL[7661.680630] /devices/pci0000:00/0000:14.0/usb/1-14/1-14:1.0

    ```'
