    If you detect a valid filesystem, you can use the meta information about it to
    determine the probable size of the partition. Knowing the size and start offset,
    you can extract the discovered partition or further analyze it. You can extract
    it using dd-style tools or more free tools like mls, like this:


    ```

    # mcat /dev/sdb 3 > deleted_partition.raw

