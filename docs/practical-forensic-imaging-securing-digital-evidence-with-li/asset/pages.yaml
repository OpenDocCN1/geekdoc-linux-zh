  md: 'The simple example described in this section was provided for illustration
    purposes. Only Opal disks may behave differently with this tool. In real scenarios,
    the key might not be a simple password but instead be tied to the TPM or other
    enterprise security mechanism. If the wrong commands are given in this situation,
    the data on the disk can be irrevocably destroyed (an instant if the key is destroyed).

    From a forensics perspective, it may be useful to image the shadow MBR for analysis
    well. It could contain interesting artifacts from the time the disk was set up.
    It is also conceivable that data could be hidden in the shadow MBR region of Opal-capable
    drives.


    # Encrypted Flash Thumb Drives


    USB thumb drives as "secure" devices often come with a proprietary software encryption
    solution provided by the vendor. Some drives offer OS-independent encryption with
    authentication using keypads, fingerprint readers, or smartcards (see Figure 5-3).


    ![](img/7fe0d6d164be3169c3098d32371b2eec_158_0.png)


    Figure 5-3: Encrypted USB sticks


    Proprietary solutions might not have a compatible tool to manage access, making
    it difficult to acquire decrypted data with Linux. Devices with an onboard authentication
    mechanism should appear as a normal USB storage device after authentication.


    Secure drives that are locked may behave differently when attached to a host.
    Some don''t provide any indication that they''ve been plugged into the host. Some
    appear as a removable device without media (like a memory card reader). Some will
    appear as a CD-ROM and have software available to run or install, which manages
    the drive.


    Larger hardware-encrypted external drives also exist and may require a pin to
    unlock. An exple of such a drive is described in Chapter 7 (see Figure 7-1 on
    page 216).'
