    # Assess Acquisition Infrastructure Logistics


    Various logistical issues are important when performing forensic acquisition of
    storage media. Managing large acquired forensic images is not a trivial task and
    so planning and foresight. Factors such as disk capacity, time duration, performance,
    and environmental issues need to be considered.


    # Image Sizes and Disk Space Requirements


    Forensic images of storage media are orders of magnitude larger than the small
    file sizes a PC typically handles. Managing disk images of this size takes additional
    thought and planning. You also need to consider certain logistical factors when
    you''re preparing an examination system. Careful preparation and planning for
    an examination will save you time and effort, as well as help you avoid problems
    that might disrupt the process.


    When creating a forensic image of a disk (hundreds of gigabytes or terabytes),
    it is not files that are copied, but the individual sectors. As a ITB disk has
    only a 20KB Word document on it, an uncompressed forensic image will still be
    1TB. As of 100TB disks are now on the market, increasing the challenge for performing
    forensic acquisition.


    When managing disk images, the examiner''s time and the examiner''s disk capacity
    are the main logistical factors that need to be considered. Before beginning a
    forensic acquisition of a subject disk or storage media, you need to ask a number
    of questions:


    +   - What is the *size* of the subject disk?


    +   - What is the available space on the examiner''s machine?'
  merge: -1
  pgno: 110
- img_proc: true
  md: '+   - What is the potential for image compression?

    - How much space do forensic tools need for processing and temporary files?

    - What is the estimated number of files to be extracted for further analysis?

    - How much memory and swap space is available on the examiner''s machine?

    - Is there a possibility of more subject disks being added to the same case or
    incident?

    - Is there an expectation to separately extract all slack or unallocated disk
    space?

    - Are there plans to extract individual partitions (possibly including swap)?

    - Is there a potential need to convert from one forensic format to another?

    - Do disk images need to be prepared for transport to another location?

    - Do subject disks contain virtual images to separately extract and analyze?

    - Do subject disks contain large numbers of compressed and archive files?

    - Are subjects using full-disk encryption?

    - Is there a need to burn images to another disk or DVDs for storage or transport?

    - Is there a need to carve files from a damaged or partially overwritten filesystem?

    - How are backups of the examiner host performed?


    In some situations, it may not be necessary to image a disk. When certain triage
    or searching is conducted, it may be enough to attach the disk to an examiner
    host and operate on the live subject disk. Depending on the triage or search findings,
    you can decide whether not to take a forensic image. In a corporate environment,
    this approach could translate into downtime for an employee, because they must
    wait for a seized disk to be reviewed or analyzed. Corporate environments typically
    have a standard end-user PC build, which is designed without local user data (all
    data is saved to servers or clouds). It could be more economical simply to swap
    the original disk with a new disk. End-user PCs are cheap, and replacing a subject
    disk with a new one could be a cost-saving alternative when factoring in the cost
    of employee downtime and the time needed to image a disk in the field.'
