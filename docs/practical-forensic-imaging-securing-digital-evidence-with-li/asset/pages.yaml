  md: 'include Compiz, Mutter, and OpenBox, and you can use them without a desktop
    environment. Desktop environments provide the link and feel of a distribution
    and operate on top of the window manager. Examples of popular desktops are Gnome,
    KDE, Xfe, and Mate. The graphics environment you choose for your forensic investigator''s
    workstation can be based on your personal preference; it doesn''t have any impact
