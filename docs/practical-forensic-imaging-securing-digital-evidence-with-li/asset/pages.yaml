    # Moving and Copying Forensic Images


    Moving and copying forensic disk images from one place to another requires planning
    and foresight. Don''t think of image files in the same way as typical end-user
    files (even though technically they''re the same).


    Acquiring, copying, and moving large disks may take many hours or even days depending
    on the size and speed of the source disk and other performance factors. Consider
    the following list of typical file and disk sizes and the average amount of time
    needed to copy the file from one to another.


    +   - 5KB size text email: less than 1 second

    - 5MB MP3 music file: less than 1 second

    - 650MB CD ISO image: about 5 seconds

    - 5–6TB DVD or iTunes movie download: about 1 minute

    - 64GB common mobile phone image: about 10 minutes

    - 250GB common notebook disk image: 30-40 minutes

    - 1TB desktop PC image: more than 2 hours

    - 2TB external USB disk image: more than 16 hours


    Once a copy or process has been started, disrupting it could leave the data in
    an incomplete state or require additional time to revert to the original state.
    A copy or move operation could create temporary files or result in two copies
    of the images existing temporarily.


    In general, think carefully beforehand about the copying and moving of large sets,
    and don''t interrupt the process once it has started.


    # Estimated Task Completion Times


    The forensic acquisition process takes time to complete. During this time, people
    and other processes may be waiting. Therefore, it''s important to calculate and
    estimate the time needed for various processes. Also, determine whether you need
    to report estimated completion times to other parties, such as management, legal
    teams, law enforcement, or other investigators. It is important to manage expectations
    regarding the time needed for completion.


    3. Tested on a typical PC with two SATA3 disks using dd.'
