    created, producing a request file with a *.tsq extension:


    ```

    $ openssl ts -query -data hash.log -out hash.log.tsq -cert

    ```


    This timestamp request contains a hash of the hash.log file, not the actual file.
    The file is not sent to the timestamping server. This is important from an information
    security perspective. The timestamp service provider is only trusted with timestamp
    information, not the contents of the files being timestamped.


    The generated request can then be sent to a timestamping service using the tsget
    command included with OpenSSL.⁴ The following uses the FreeTSA service:


    ```

    $ tsget -h https://freetsa.org/tsr hash.log.tsq

    ```


