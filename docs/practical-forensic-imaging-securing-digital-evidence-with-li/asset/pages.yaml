    # Sign an Image with PG/MIME


    The hash value is useful to preserve the integrity of an image over time, but
    anyone can take a cryptographic hash of an image at any time. Consider a disk
    modified by an unauthorized person who creates a new hash for the original disk
    image. Unless the original hash was properly secured it''s difficult to prove
    which hash (the old or the new) is the correct one. Cryptographic signing of forensic
    images binds a person (or that person''s key) to the integrity of the image. The
    forensic examiner, a superior, or an external neutral party can sign the image
    at the time of acquisition.


    Chapter 6'
