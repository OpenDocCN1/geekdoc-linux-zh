- img_proc: true
  md: 'd/d * 9:

    _190875_


    If you need to extract a partition from an existing acquired image into a separate
    file, you can use the dd tools or the Sleuth Kit mmcat command.

    To extract a partition from an acquired image, the initial step is to identify
    the partition and sector details. In the following example, the partition table
    from an acquired disk image shows the partition to be extracted:


    # # mms image.raw

    DOS Partition Table

    Offset Sector: 0

    Units are in 512-byte sectors


    | Slot | Start | End | Length | Description |

    |---|---|---|---|---||

    | 02: | 00:00 | 0000000063 | 0078124094 | 0078124032 | Linux (x83) |


    Extracting a partition from an acquired image file using dc3dd or requires adding
    skip (dc3dd uses skip) and count parameters, which cause the command to jump (skip)
    ahead to the start of the partition and acquire only the size of the partition:


    ```

    $ dcffld if=image.raw partition.raw bs=512 skip=63 count=78124032

    ```


    In this command, the block size is set to 512 bytes to match the sector size,
    the start of the partition is sector 63, 78124032 sectors should be extracted.
    With a little additional calculation, you can improve the performance of this
    command by changing the 512-byte block size to something larger (but don''t forget
    to adjust the skip and count parameters if you do this).

    With Sleuth Kit version 3.0 and later, you can use the mmcat tool to easily extract
    partitions. To recover the first partition in the previous example using mmcat,
    you must specify the mmls slot number (not the DOS partition number). In this
    case, the first partition is located in the mmls slot number two and can be extracted
    as follows:


    ```

    $ mmls image.raw 2 > partition.raw

    ```


    The mmcat tool simply pipes the output to stdout, so you must either redirect
    it to a file or pipe it into a program.


    # Find and Extract Deleted Partitions


    To exhaustively search for partially overwritten or deleted partitions of a forensically
    acquired image, you can use several methods. Sleuth Kit provides a basic tool
    called findif for binary signature strings.'
