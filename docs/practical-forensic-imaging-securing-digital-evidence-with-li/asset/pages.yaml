    Attached drives appear as block devices in the /dev directory where they''re detected
    by the kernel. Raw disk files have a specific naming convention: sd* for SCSI
    and SATA, hd* for IDE, md* for RAID arrays, nvme*n* for NVME drives, and other
    names for less common or proprietary devices.


    Individual partitions discovered by the kernel are represented by numbered devices
    (for example, hda1, hda2, sda1, sda2, and so forth).'
