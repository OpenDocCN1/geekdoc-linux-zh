    Here 16:0:0:0 should be replaced with the relevant SCSI address of the subject
    drive on your acquisition host.

    Relevant dmesg output could also be copied into a text file if desired.

    The examples shown in this section illustrate how to save command output for a
    specific subject drive. For brevity, subsequent chapters will not include examples
    of saving data to files, focusing instead on the construction of commands.


    # Query Disk Capabilities and Features with hdparm


    Many of the tools discussed previously (lsusb, lspci, lsblk, and so on) have queried
    the Linux system and kernel structures for information. However, it''s possible
    to query a drive directly for additional information. The hdparm tool is useful
    for sending commands to most drives attached to a Linux system.'
