    [2016/01/15 23:14:56] nwipe notice: Invoking method ''RCMP TSSIT PPS-I'' on device
    ''/dev/sdj''.

    [2016/01/15 23:14:56] nwipe info: Starting round 1 of 1 on device ''/dev/sdj''.

    [2016/01/15 23:14:56] nwipe notice: Starting pass 1 of 8, on device ''/dev/sdj''.

    [2016/01/15 23:57:00] nwipe notice: 160041885696 bytes written to device ''/dev/sdj''.

    [2016/01/15 23:57:00] nwipe notice: Finished pass 1 of 8, round 1 of 1, on device
    ''/dev/sdj''.

    ..

    ```


    When you''re wiping NVME drives, ensure the DCO and HPA have been removed. With
    NVME drives, make sure each namespace has been wiped (most consumer NVME have
    only a single namespace).


    # ATA Security Erase Unit Commands


    The ATA standard specifies a security erase command that you can issue directly
    to wipe a disk. The SECURITY ERASE UNIT command will


    +   3. I Canadian; the favoritism for the RCMP method. :-)


