    # Convert Between Image Formats


    Converting between forensic image formats can be advantageous for various reasons.
    If a lab has new software or infrastructure and the current format is unsupported
    or less efficient, converting to another format could be an option. If you are
    transferring an image to a third party, they might have a preferred image format.
    If you are receiving an image from a third party, you might want to convert it
    to your preferred format. This section provides examples of converting between
    formats on the command line. Conversion from a few source formats is shown, including
    EnCase, FTK, AFF, and raw. In addition, the examples demonstrate converting various
    formats into SquashFS containers.


    When you’re converting between image formats, it’s preferable to use pipes and
    redirection. Avoid tools that use temporary files. During the conversion process,
    two copies of an image might coexist (one or might be compressed). To prepare
    for the conversion process, do some capacity planning.


    After conversion, check the hash values from the original image and the destination
    to match.


