  md: '# Non-Volatile Memory Express


    Non-Volatile Memory Express (NVME) was designed from the ground up as an alternative
    to the AHCI-based SATA drive interface. It was designed to attach directly to
    the PCI Express bus, eliminating the need for AHCI/SATA host bus adapter and the
    associated SATA physical interfaces and protocol layers. The NVME architecture
    focuses specifically on SSD storage, and a simpler, more efficient command set
    was created. NVME devices can attach directly to a motherboard in a PCIe slot,
    using PCIE NVME mode of an M.2 interface, or with a U.2 (SFF-8639) interface.


    The physical interface is directly attached to the PCIE bus, as shown in Figure
    1-16.


    ![](img/7fe0d6d164be3169c3098d32371b2eec_54_0.png)


    Figure 1-16: NVME SSD with a PCIe interface


    An M.2 or Next Generation Form Factor (NGFF) version is also available. These
    are either directly inscribed into motherboard M.2 slots or using PCIe slot adapter
    cards, with NVME mode (not AHCI/SATA mode). Currently, most M.2 SSD disks are
    AHCI/SATA, not NVME, but this may change because the performance benefits of NVME
    are compelling. Figure 1-17 shows an NVME M.2 disk.


    ![](img/7fe0d6d164be3169c3098d32371b2eec_54_1.png)


    Figure 1-17: NVME SSD with an M.2 interface'
