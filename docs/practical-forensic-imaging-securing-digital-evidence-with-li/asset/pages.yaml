  md: 'output, the file size and the MD5 hash are all identical. However, notice how
    the block size used on the filesystem is very different (7733252 blocks versus
    2600 blocks):


    ```

    # ls -ls image.raw sparse-image.raw

    7733252 -rw-r-- 1 root 7918845952 May 15 08:28 image.raw

    2600 -rw-r-- 1 root 7918845952 May 15 08:30 sparse-image.raw

