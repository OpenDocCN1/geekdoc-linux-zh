    # JBOD and RAID-0 Striped Disks


    Just a Bunch Of Disks (JBOD) is the term used to indicate that a number of disks
    have been concatenated into one logical drive (without any RAID configuration
    for performance or redundancy). To assemble a group of disks into a single JBOD
    device, you can use the dmsetup command.


    When you''re building devices from multiple disks, it''s useful to have a separate
    table to define the device, offsets, and mappings. In this simple text file, you
    can also include comments with information about the disks.


    The following has a JBOD with three disks of different sizes (a characteristic
    of JBOD systems). The device mapper table file (jbod-table.txt in this example)
    defines how they are concatenated. Run the dmsetup command with the file input
    to create the device in /dev/mapper/.


    ```

    # cat jbod-table.txt

    0 15589376 /dev/sdm 0

    15589376 15466496 /dev/sdn 0

    31055872 15728640 /dev/sdo 0

    # dmsetup create jbod < jbod-table.txt

    ```


    This table defines mappings that construct the device file, which will appear
    in /dev/mapper. Each line defines the offset in the mapper device, the number
    of sectors to map, the target type (linear), and the target device with an offset
    (sector here, because we need the whole device). Getting the offsets right can
    be tricky and may require some calculation. Double-check the offsets first if
    there are problems.


    > ⁸ Heinrich Maelshugen, "mdraid - Device-Mapper RAID Tool: Supporting the Generic
    Linux Device-Mapper." Presented at the Linux Symposium, Ottawa, Ontario, July
    22–23, 2005.'
