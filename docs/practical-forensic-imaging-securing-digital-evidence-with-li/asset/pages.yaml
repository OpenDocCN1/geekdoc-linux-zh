  md: 'You can extract files from a tape using dd variants. In the example that follows,
    three tape files are recovered from a tape. The nonrewinding device for tape access
    is chosen, typically /dev/nst0 on Linux, to prevent the drive from rewinding before
    all the files have been copied. The command is run repeatedly, always using the
    same input device (it takes the next file on the tape), until it returns "0+0
    records in, indicating that all files have been extracted:


    ```

    # dd if=/dev/nst0 of=file0.tape hashlog=hash0.log

    0+46 records in

    14+1 records out

    # dd if=/dev/nst0 of=file1.tape hashlog=hash1.log

    22016 blocks (688MB) written

    0+70736 records in

    22105+0 records out

    # dd if=/dev/nst0 of=file2.tape hashlog=hash2.log

    256 blocks (8MB) written

    0+14422 records in

    450+1 records out

    # dd if=/dev/nst0 of=file3.tape hashlog=hash3.log

    0+0 records in

    0+0 records out

    ```


    After the tape files have been recovered, you can analyze the file type. Often,
    you can use a basic file type program to determine which archive or backup file
