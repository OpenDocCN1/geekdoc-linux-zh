    split AFF images, and split EnCase files (though this is not explicitly stated,
    split EnCase files are supported). Some of these image types might need to be
    explicitly included when compiling the Sleuth Kit software.


    In the following example, an EWF image is split into 54 pieces. Running the img_stat
    command on the first file provides information about the complete set of files:


    ```

    $ img_stat image.E01

    IMAGE FILE INFORMATION

    ...................

    ```


    | Image Type: | ewf |

    | Size of data in bytes: | 121332826112 |

    | MD5 hash of data: | ce85c1dff2807a205f49355f4f5a029 |'
