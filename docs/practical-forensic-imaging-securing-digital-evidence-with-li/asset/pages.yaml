    VirtualBox is an open source project maintained by Oracle (formerly Sun

    Micystems). Although it supports multiple VM image formats, VirtualBox

    VDI images are used in the examples that follow. The qemu-nbd com-

    mand is used before and with OpenSolaris image.


    The VirtualBox software package includes a number of utilities; the

    VBoxManage tool is shown, providing information about the VDI

