    # OS-Encrypted Filesystems


    Now''s look at accessing popular encrypted filesystems. The focus is not on key
    recovery (although I do provide couple of suggestions) on accessing the filesystems
    with a known key. It''s assumed the keys and passwords are available from memory
    dumps, escrow/backup in enterprise organizations, individuals legally compelled
    to provide them, victims to help, commercial recovery services/software, or other
    sources.


    You determine the type of filesystem encryption with various partition-analysis
    tools that identify headers, magic numbers, and other artifacts unique to a particular
    encrypted type. You''ll find an overview of identifying filesystem encryption
    in a forensic context at http://encase-forensic-blog.guidancesoft.com/2014/04/version-7-tech-tip-spotting-full-disk.html.


    In this section, you''ll find the information about a particular image needed
    to create an encrypted block device or file that you can access using forensic
    tools or safely mount for local browsing.


    # Microsoft Bitlocker


    Microsoft''s current default filesystem encryption is BitLocker. It encrypts at
    the block level, protecting entire volumes. A variant of BitLocker designed for
    removable media is BitLocker-To-Go, which uses encrypted files on a regular unencrypted
    filesystem. Two open source tools, dislocker and libbde, are shown in the examples
    in this section.


    Written by Romain Collett, you''ll find the dislocker package at https://github.com/Aorim/dislocker/.
    It provides various tools for handling BitLocker volumes, including viewing metadata,
    creating encrypted image files, and FUSE mounting volumes.'
