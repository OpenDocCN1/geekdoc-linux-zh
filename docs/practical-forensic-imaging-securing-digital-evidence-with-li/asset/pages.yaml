    # Linux RAID-5


    If multiple disks are part of a Linux RAID array, you can acquire them individually
    and assemble them using tables. The dmsetup tool provides an interface to mdadm
    the mdadm tool operate on devices that have been mapped or looped. In the following
    example, three acquired images from a Linux MD RAID-5 setup are used.


    An nmls analysis of the individual partition tables reveals a Linux RAID partition
    at sector 2048 of each disk image (sda.raw, sdb.raw, sdc.raw). This sector offset
    is converted (using Bash math expansion) to a byte offset for the losetup command:


    ```

    # mm sda.raw

    DOS Partition Table

    Offset Sector: 0

    Units are in 512-byte sectors

    ```


    | Slot | Start | End | Length | Description |

    |---|---|---|---|---||

    | 00: | Meta | 000000000 | 000000000 | 000000001 | Primary Table (#0) |

    | 01: | | 000000000 | 0000002047 | | Unallocated |

    | 02: | 000000000 | 0000002048 | 0312580095 | 0312587048 | Linux RAID (Oxfd) |

    | 03: | 0312580096 | 0312581807 | 0000001712 | Unallocated |


    ```

    # echo $((2048+512))

    1048576

    ```


    A read-only loop device is created for each of the disks in the array using the
    calculated byte offset (2048 sectors, which is 1048576 bytes):


    ```

    # losetup --read-only --find --show -o 1048576 sda.raw

    /dev/loop0

    # losetup --read-only --find --show -o 1048576 sdb.raw

    /dev/loop1

    # losetup --read-only --find --show -o 1048576 sdc.raw

