  md: '# 3


    # FORENSIC IMAGE FORMATS


    ![](img/7fe0d6d164be3169c3098d32371b2eec_86_0.png)


    This chapter provides an overview of the various acquisition tools, evidence containers,
    and forensic image formats commonly used today. Forensic image formats and evidence
    containers are the structures that store the forensically acquired image together
    with additional case data, such as the time and duration of the acquisition, how
    the image was acquired, size, errors, hashes, and so on. Additional features of
    forensic formats typically include compressed files and encryption. This chapter


    You''ll find an informative introductory paper describing various forensic formats
    on the Digital Forensic Research Workshop (DFRWS) website at http://www.dfrus.org/CDESF/survey-dfrus-cdesf-disking-01.pdf.


    You can identify the commonly used forensic formats described in this chapter
    by the Sleuth Kit command img_stat:


    ```

    # img_stat -i list

    Supported image format types:

    raw (Single or split raw file (dd))

    aff (Advanced Forensic Format)

    ```'
