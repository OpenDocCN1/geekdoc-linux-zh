    Here is a command to view the number of PCI slots, usage, designation,

    and type:


    ```

    # dmidecode -t slot

    ```


    A command to view the storage interfaces (SATA, NVME, SCI,

    and so on), and speed:


    ```

    # lshw -class storage

    ```


    To view the speed, interface, cache, rotation, and other information

    about the attached disks (using device /dev/sda in this example), use this:


    ```

    # hdparm -I /dev/sda

    ```


    To view the speed of the external USB interfaces (and possibly an

    attached write blocker), use this command:


    ```

    # lsusb -v

    ```


    > There are many different methods and commands to get this information. The com-

    mands show here each present one example of getting the desired performance in-\mation.
    Providing an exhaustive list of all possible tools and techniques is beyond the

    scope of this book.


    Reading the vendor documentation and querying a system will identify

    t speeds of various components. To get an accurate measurement, it''s best

    to use tools for hardware benchmarking and software profiling. Some

    for benchmarking include mbw for memory and bonnie++ for disk I/O.

    The health and tuning of the OS is also a performance factor. Monitor-

    the logs (syslog, dmesg) of the examiner hardware can reveal error-

    sages, misconfiguration, and other inefficiency indicators. To monitor

    the performance and load of the live state of an examiner machine include

    thop, iostat, vmstat, free, or nmon.


