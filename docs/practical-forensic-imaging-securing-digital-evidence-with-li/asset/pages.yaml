    ERASE command will write a predefined pattern (defined by the drive manufacturer)
    instead of zeros.


    Running hdparm displays the capabilities and status of security on the drive.
    Also provided is the estimated time needed to securely erase the drive, as shown
    here:


    ```

    # hdparm -I /dev/sdh

    ```


    device size with M = 1000+1000 500107 MBytes (500 GB)


    Security:


    +   Master password revision = 7 supported

    enabled

    not locked

    not frozen

    not expired: security count supported: enhanced erase

    SecuritySecurity level high


    60min for SECURITY ERASE UNIT. 60min for ENHANCED SECURITY ERASE UNIT.


    Some drives will reject the erase command if you don''t explicitly set a password
    first. In the following example, a Western Digital drive was used, and the password
    was first set to dummy before the --security-erase-command was accepted:


    ```

    # hdparm --security-erase dummy /dev/sdh

    security_password="dummy"

    ```


    /dev/sdh:

    Issuing SECURITY_ERASE command, password="dummy", user=user


    The drive has now securely wiped and can be reused. If a drive requires setting
    a password, don''t forget to disable the password after the security erase has
    completed.


    # Destroy Encrypted Disk Keys


    You can securely destroy encrypted disks and filesystems by destroying all known
    copies of the encryption key. If the key was generated on a secure device such
    as a smartcard, a TPM, or an Opal drive, then only one copy of the key will exist.
    If a drive was provisioned in an enterprise environment, there might be backup
    or escrow copies of the key for recovery purposes.


    Key-provisioning procedures for OS-based encrypted drives, such as Microsoft BitLocker,
    Apple FileVault, Linux LUKS/dm-crypt, or TrueCrypt variants, require detailed
    knowledge of where the keys are. Keys might be'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'password/passphrase protected and stored in a file or in a certain block on
    the drive. They might also be stored in a key file elsewhere. If it''s not possible
    to locate and securely destroy all copies of a private key, the alternative is
    to wipe the disk with the drive-wiping method described in a previous section.


    Typically, secure external USB drives have a factory reset function for lost passwords.
    This can be used to destroy the key and contents of the drive. For example, you
    can reset the Corsair Padlock2 thumb drive by holding down both the KEY and 0/1
    buttons for three seconds, followed by holding 911 to reset the key and destroy
    the contents. On istorage datashrive, hold down both the KEY and 2 buttons for
    three seconds and then enter 999 to reset the key.


    Destroying the contents of Opal drives is instantaneous and simply involves destroying
    the encryption key on the drive by entering the Physical ID (PSID). The PSID usually
    has a QR code on the physical cover of the drive that you can scan instead of
    typing it by hand. You cannot get the PSID by querying the drive with ATA commands;
    it''s only visible on the cover of the physical drive.


    The sedutil-cli command has a special option for irrevocably resetting the drive
    using the PSID:


    ```

    # time sedutil-cli --isYouReallywantToERASELmydatausingthePSID

    HT3ENZEBOT0V2LH2UZ87LFCD8U7YGPG /dev/sdi

    22:51:23.78 Info: revert completed successfully

    ```


    ```

    real 0m.541s

    user 0m.000s

    sys 0m.000s

    ```


    The encryption key in the drive is now reset, and the data is effectively destroyed.
    The disk is factory reset, unlocked, and can be reused. The time needed to destroy
    the data on this 120GB drive was half a second.


    # Closing Thoughts


    In this chapter, you learned a variety of techniques for managing forensic images,
    including the use of compression with common Linux tools and built-in compression
    in forensic formats. You saw more examples of the SquashFS filesystem and the
    sfimage script for managing forensic evidence counters. I demonstrated splitting
    and reassembling images, duplicating drives, and converting between image formats.
    You also learned how to verify hashes, signatures, and timestamps and how to protect
    images with encryption during network transfer and storage. Finally, I showed
    the secure disposal of forensic image files and drives.'
  merge: -1
