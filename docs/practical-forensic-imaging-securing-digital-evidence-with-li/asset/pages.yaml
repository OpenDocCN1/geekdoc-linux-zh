  md: "For all examples that follow, the -v flag is used to increase verbosity.\n\
    This makes the output more useful for documentation purposes (both steps in this\
    \ book and for creating forensic reports describing the steps taken).\n\nUsing\
    \ GPG to encrypt an existing image is very simple, as shown here:\n\n```\n$ gpg\
    \ -cv image.raw\ngpg: using cipher AES\ngpg: writing to `image.raw.gpg'\nEnter\
    \ passphrase: \n```\n\nA passphrase is requested, and the image is encrypted with\
    \ the default symmetric encryption algorithm, creating a new file with the extension\
    \ .gpg.\nThe size of the image is smaller because GPG compresses it encrypts.\n\
