- img_proc: true
  md: 'You can also optimize the OS by ensuring minimal processes running in the background
    (including scheduled processes via cron), tuning the kernel (sysctl -a), tuning
    the examiner host''s filesystems (tunesfs), and managing disk swap and caching.
    In addition, ensure the examiner OS is running on native hardware, not as a virtual
    machine.


    When you''re looking for bottlenecks or optimizing, it''s helpful to imagine the
    flow of data from the subject disk to the examiner host''s disk. During an acquisition,
    the data flows through the following hardware interfaces and components:


    +   - Subject disk platters/media (rotation speed? latency?)

    - Subject disk interface (SATA-X)

    - Write blocker logic (added latency?)

    - Write blocker examiner host interface (USB3 with UASP?)

    - Examiner host interface (USB3 sharing bus with other devices?)

    - PCI bus (PCI Express? speed?)

    - CPU/memory and OS kernel (speed? DMA? data width?)


    These components will be traversed twice, once between the subject disk and the
    examiner host, and again between the examiner disk where the acquired image is
    saved.


    Ensure the data flow between the subject disk and the CPU/memory is not using
    the same path as for the data flow between the destination disk on the examiner
    host. For example, if a field imaging system has a write blocker and an external
    disk for the acquired image, and both are connected to local USB ports, it is
    possible they''re sharing a single bus. As a result, the available bandwidth will
    be split between the two disks, suboptimal performance.


    For network performance tuning, the speed of the underlying network becomes a
    primary factor, and performance enhancements include the use of jumbo Ethernet
    frames and TCP checksum offloading with a high-performance network interface card.
    It is also beneficial to assess when programs are accessing the network and for
    what reason (automatic updates, network backups, and so on).


    To summarize, an overall plan or strategy for the acquisition you intend to take.
    Well-tested processes and infrastructure in place. Ensure the right capacity planning
    and optimizing has been done. Be able to monitor the activity while it''s in progress.


    The most common bus speeds relevant for a forensic examination host (in bytes/second)
    are listed in Table 4-1 for comparison. You''ll find a good reference of the bit
    rates for various interfaces and buses at https://en.wikipedia.org/wiki/List_of_device_bit_rates.'
