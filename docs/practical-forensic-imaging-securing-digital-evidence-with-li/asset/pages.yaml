  md: 'proposes a solution. The command line audit trail should be tailored to particular
    lab policies or expectations.


    For basic command logging, the built-in shell functionality can be configured
    to record command line activity. Bash provides some useful functionality, including
    the ability to enable time stamping of the commands entered. You can add the following
    commands to the Linux startup scripts (.bashrc and so on) to enable the basic
    requirements outlined in the previous list:


    ```

    set -o history

    shopt -s histappend

    export HISTCONTROL=

    export HISTIGNORE=

    export HISTFILE=/.bash_history

    export HISTSIZE=1

    export HISTTIMEFORMAT="%F-%m-%d %T "

    ```


    These commands ensure that history is enabled and in append mode (as opposed to
    overwriting with each new login). The variables HISTCONTROL and HISTIGNORE control
    which commands are saved to the history file. A common default setting is to ignore
    duplicates and commands beginning with a space. To ensure complete logging of
    all commands, the HISTCONTROL and HISTIGNORE variables are explicitly set to null.
    The HISTFILE variable is explicitly set to ensure command history in memory is
    saved when a shell exits. HISTSIZE and HISTORYSIZE are set to -1 to ensure history
    is not truncated or overwritten. HISTTIMEFORMAT enables timestamps to be written
    to the history file and allows you to set a time format. The format can include
    regional settings and should include a timestamp, not just the date.


    At the end of the examination, the history can be saved to a text file and included
    in the examination''s supporting data files. The history can be reset and made
    ready for the next examination using the following commands:


    ```

    $ history > examiner_bash_history.txt

    $ history -c; history -w

    ```


    Synchronizing the history across multiple shell instances can be tricky because
    each shell keeps its history in memory and writes to file only on exit. Setting
    the variable PROMPT_COMMAND=''a; history -r'' will write (append) and read new
    commands from the Bash file every time the command prompt is displayed.


    A command logger that is actively developed is Snoopy: it provides a number of
    features, including logging the commands to syslog. Snoopy is a preloaded library
    that functions as a wrapper around the exec() and execve() system calls. It is
    transparent to users, and you can enable and


