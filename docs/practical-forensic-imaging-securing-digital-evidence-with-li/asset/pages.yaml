    # Extract SMART Data with smartctl


    SMART was developed in the early 1990s to monitor hard disk and predict failures.
    It was added to the SCSI-3 standard in 1995(SCSI-3 standard: X3T10/94-190 Rev
    4) and the ATA-3 standard in 1997 (ATA-3 standard: X3.298-1997). Because details
    about the disk hardware may be of value in forensic investigations, in this section,
    you will learn the techniques to extract SMART information about the hard hardware.


    The smartctl command is part of the smartools package and provides access to the
    SMART interface built into nearly all modern hard drives. The smartctl command
    queries attached ATA, SATA, SAS, and SCSI hardware.


    SMART provides a number of variables and statistics about a disk, some of which
    could be of interest to a forensic investigator. For example:


    +   - Statistics about errors on the disk and the overall health of the disk

    - Number of times the disk was powered on

    - Number of hours the disk was in operation

    - Number of bytes read and write (often expressed in gigabytes)

    - Various SMART logs (temperature history, and so on)2


    The following example shows SMART data requested from a drive. The listing is
    annotated with comments relevant to forensic investigators. The -x flag instructs
    smartctl to print all available information. The first block of output is the
    information section, which provides unique


    2. SMART statistics and logs available vary among hard disk vendors.'
