- img_proc: true
  md: 'In this example, the HPA on a 500GB disk is set to duplicate a 120GB drive.
    The original disk reports 234441648 512-byte sectors, which you can use to set
    the maximum viable sectors on the clone drive. Use the following commands:


    ```

    # hdparm -N /dev/sdk


    max sectors = 967773168/967773168, HPA is disabled

    # hdparm --yes-i-know-what-i-am-doing -N 234441648 /dev/sdk

    ```


    ```

    /dev/sdk

    setting max viable sectors to 234441648 (permanent)

    max sectors = 234441648/967773168, HPA is enabled

    # hdparm -I /dev/sdk

    ```


    | LBA user addressable sectors: 234441648 |

    device size with M = 1000+10000: 120034 MBytes (120 GB) |


    The first hdparmN command shows the initial state with 500GB of accessible sectors
    and a disabled HPA. The second hdparm command requires the --yes-i-know-what-i-am-doing
    flag to configure dangerous settings, such as changing the sector size. The -N
    de-fault specifies the number of sectors. It is prefixed with the letter ρ so
    the change is permanent across restarts. The final hdparm command checks whether
    the drive is now reporting the new sector size, which is now the same as that
    of the clone (120GB).


    # Write an Image File to a Clone Disk


    To write an image to a new disk, use the same tools as when you acquire a disk
    but in reverse.

    You create a clone disk directly from the original suspect disk or from a previously
    acquired image file using the standard dd tools. This example shows writing a
    raw image file to a clone disk using dc3dd:


    ```

    # dc3dd if=image.raw=/dev/sdk log=clone.log

    ```


