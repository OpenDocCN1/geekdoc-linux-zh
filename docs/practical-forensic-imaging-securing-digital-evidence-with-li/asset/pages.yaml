    # Hash Windows


    When imaging an older or damaged disk, block read errors can occur. These errors
    can happen in random places during the acquisition, and the frequency can increase
    over time. This creates a challenge when you''re serving the integrity of evidence,
    because a cryptographic hash might be different each time the disk is read (reacquired,
    duplicated, verified, and so on).


    The solution to this problem is to use hash windows, or piecewise hashing. A hash
    window is a separate cryptographic hash taken over a smaller sequence of sectors
    on a disk. For example, a hash window size of 10MB during acquisition will generate
    a separate hash for every 10MB sequence of sectors and generate a list of hashes
    for a disk. If one sector becomes unreachable (or is modified for some reason),
    the hash of that will'
