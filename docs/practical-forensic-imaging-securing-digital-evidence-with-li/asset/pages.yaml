  md: '# # Image Acquisition over a Network


    Imaging a disk over a network can be useful for a number of reasons:


    +   - A disk may be located in a remote location, and it might not be feasible
    to physically seize and ship the disk to a central forensic lab (possibly due
    to disruption of business, lack of resources, or other logistical issues).

    - A time-critical incident might require a remote drive image as soon as possible
    without delays due to shipping (depending on network bandwidth, disk size, and
    shipping times, shipping a disk might still be faster). 6

    - A machine in a local forensic lab may have a disk in a PC that cannot be feasibly
    physically removed. This could be due to the design of the PC, the lack of tools
    needed, or the risk of causing damage or destroying evidence.


    In general, seizing disks does not scale well in large organizations, and having
    a broadly deployed enterprise solution for remote disk triage and acquisition
    is EnCase Enterprise a classic example, with newer firms bringing similar products
    to the market.

    As disk imaging, many possibilities exist to perform forensic acquisition over
    a network. Most solutions involve booting a forensic CD on a remote machine, establishing
    a network connection, and piping the dd output to a local file. You can do this
    by using a combination of dd and netcat. Secure connections can also be made using
    ssh or secure netcat alternatives, such as socat and cryptat.

    This section provides several examples that use ssh for a secure network connection.
    But first, let''s start by looking at rdd, which was specifically designed with
    forensic acquisition in mind.


    # ## Forensic Imaging with rdd


    Designed for acquiring disk images over a network, the rdd tool was developed
    by the Netherlands Forensic Institute (NFI). The rdd tool has a number of useful
    features, including hashing, logging, compression, error handling, file splitting,
    progress indicators, and statistics. Support for EWF output can be included at
    compile time. The rdd tool uses a client-server model, where the subject PC (booted
    from a forensic CD) is the client and the examiner PC is the server. You perform
    an acquisition by starting a listening process on the server (examiner PC) and
    running the acquisition command on the client.

    The rdd tool does not have built-in security; it must be added using a VPN, a
    secure shell, or the equivalent. When you are using rdd over untrusted or hostile
    networks, the network traffic needs to be encrypted.


    > 6. The quote from Andrew S. Tanenbaum is appropriate here: "Never underestimate
    the bandwidth of a station wagon full of tapes hurtling down the highway"'
