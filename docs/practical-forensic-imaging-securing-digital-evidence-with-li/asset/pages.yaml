    The Advanced Forensic Format (AFF) was created by Simson Garinkel as an open,
    peer-reviewed format. It includes all the expected features of a forensic format
    and also additional encryption and signing features using standard X.509 certificates.
    The AFFlib package contains a number of tools for converting and managing the
    AFF format.


