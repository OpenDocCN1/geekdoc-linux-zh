    # SquashFS as a Forensic Evidence Container


    Throughout this book, I''ll demonstrate a technique for creating a hybrid

    forensic container that combines raw imaging and allows storage

    of supporting case information in a similar way as more advanced forensic

    formats. The technique uses SquashFS as a forensic evidence container

    together with a small shell script, sfimage, which manages various aspects

    of the container. This method creates a compressed image combined with

    imaging logs, information about the disk device, and any other information

    (photographs, chain of custody forms, and so on) into a single package. The

    files are contained in a read-only SquashFS filesystem, which you can access

    without any special tools.


    # SquashFS Background


    SquashFS is a highly compressed, read-only filesystem written for Linux.

    It was created by Phillip Lougher in 2002 and was merged into the Linux

    kernel tree in 2009, starting with kernel 2.6.29.


    SquashFS was designed for use with bootable CDs and embedded

    sysystems, but it has a number of features that make it attractive as a forensic

    eidence container:


    +   - SquashFS is a highly compressed filesystem.

    - It is read-only; items can be added but not removed or modified.

    - It stores investigator''s uid/gid and creation timestamps.

    - It supports very large file sizes (theoretically up to 16EiB).

    - It is included in the Linux kernel and trivial to manage as a read-only

    filesystem.

    - The filesystem is an open standard (tools exist for Windows, OS X).

    - The mksquashfs tool uses all available CPUs to create a container.


    The use of SquashFS as a forensic evidence container is a practical alter-

    ative to using other forensic formats, because it facilitates the management

    of compressed raw images acquired with dd. The sfimage tool, described

    next, provides the functionality you need to manage SquashFS forensic evi-

    containers.


    > 2. M.I. Cohen, Simon Garinkle, and Bradley Schatz, "Extending the Advanced Forensic

    Format to Accommodate Multiple Data Sources, Logical Evidence, Arbitrary Information
    and

    Forensic Workflow," Digital Investigation 6 (2009): S57–S68.'
