    -rw-r--r-- 1 root 8001562156544 Jun 27 20:19 bonkers.sfd/bonkers.raw

    ```


    The use of SquashFS is a practical and effective solution for using raw files
    in a compressed way and offers an alternative forensic evidence container.


    # Closing Thoughts


    This chapter introduced you to various forensic image formats. I provided a short
    overview and history of different tools that can be used to forensically acquire
    a drive. You also learned about the SquashFS filesystem and the sfsimage script
    used to create and manage SquashFS forensic evidence containers. The tools and
    formats presented in this chapter will be used in examples throughout the rest
    of the book.'
