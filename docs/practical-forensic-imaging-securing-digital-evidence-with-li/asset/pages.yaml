- img_proc: true
  md: '# SquashFS Evidence Containers


    Recall using SquashFS as a forensic evidence container was described in Chapter
    6. When you''re creating a SquashFS file, you can tune several compression parameters.
    Three compression algorithms (gzip, lzo, xo) are available, various metadata from
    SquashFS can be compressed (table, extended attributes), and other tweaks can
    be made as well. See the squashfs(1) manual page for more information.


    In this example, a raw image file was converted to a compressed SquashFS file:


    ```

    # squashfs image.raw image.fs -comp lzo -noI

    Parallel squashfs: Using 8 processors

    Creating 4.0 filesystem on image.fs, block size 131072.

    ```


    Exportable SquashFS 4.0 filesystem, lzo compressed, data block size 131072

    compressed data, uncompressed metadata, compressed fragments, xattrs


    +   duplicates removed

    Filesystem size 615435.77 Bytes (601.01 Mbytes)

    31.45% of uncompressed filesystem size (195693.96 Kbytes)

    Inode table size 61232 bytes (59.80 Bytes)

    100.0% of uncompressed Inode table size (61232 bytes)

    Directory table size 31 bytes (0.03 Kbytes)

    100.0% of uncompressed directory table size (31 bytes)


    Here, the -comp flag sets the compression algorithm to lzo (gzip is the default),
    and the -noi flag prevents compression of the inodes (of the SquashFS container,
    not the evidence image).

    sfsimage shell script manages the creation of SquashFS forensic evidence containers
    with a few added features.

    The use of compression is fundamental when you''re working with large forensic
    images. However, even compressed images can still be very large to manage. There
    is another method that makes this process easier: you can split forensic images
    into multiple smaller pieces.


    # Manage Split Images


    Managing acquired disk images can be problematic due to their large file sizes.
    Breaking an image into smaller, easier-to-handle pieces can help solve this problem.
    Consider the following examples in when a split image can be beneficial:


    +   Network transfers over unstable connections can be done with multiple smaller
    downloads using split images.

    A large image might exceed the maximum file size for a software tool. Splitting
    the image offers a workaround.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '+   - Storage media, such as tapes, CDs, or DVDs, have a fixed maximum capacity.
    Split images allow you to use a set of these media.


    +   - Some filesystems (notably FAT) have a relatively small maximum file size.


    The most common use of split images in digital forensics is for the transfer and
    storage of evidence. Historically, this has been done by burning the image to
    a set of CDs or DVDs.


    # The GNU split Command


    Standard Unix and Linux systems have the split tool for breaking a large file
    into several smaller files. The following example uses the split command to break
    an image into DVD-sized chunks:


    ```

    $ split -d -b 4G image.raw image.raw

    $ ls

    image.raw.00 image.raw.01 image.raw.02 image.raw.03 image.raw.04

    ...

    ```


    > - -d flag specifies that a numeric extension should be added to image.raw (note
    the trailing dot); -b flag flags the size of the chunks made from the image.raw
    file.


    Using a combination of piping between several tools, you can compress and splitting
    during acquisition to save time and space. Here''s an example of a single command
    acquiring an image with dd, compressing it with gzip, and splitting it into CD-sized
    chunks:


    ```

    # dd if=/dev/sd gzip | split -d -b 640m - image.raw.gz.

    ```


    The split command''s input file is -, which specifies stdin, and it splits the
    compressed byte stream into pieces. It''s important to note that the parts are
    not individually gzipped and cannot be individually uncompressed. The split parts
    must be reassembled before they can be uncompressed.


    # Split Images During Acquisition


    You can split an imaged hard disk into parts during the acquisition process rather
    than in a separate step at a later date. Before acquiring a large disk, consider
    whether you might need a split image in the future and what fragment size would
    make the most sense. Starting with the right split image could save you time and
    disk space during an investigation.


    Split images are common in digital forensics and are therefore well supported
    by forensic acquisition and analysis tools. Typically, flags can set the fragment
    size and customize the extension of a split image.


    The dc3dd tool provides built-in splitting functionality. For example, if you''ll
    later transfer an image to a third party via a set of 16GB USB sticks,'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'you can use dcflddd to acquire an image using the split=16g flag before the
    output file:


    ```

    # dcflddd if=/dev/sdc split=16g of=image.raw

    # ls

    ```


    ```

    image.raw.000 image.raw.001 image.raw.002 image.raw.003 image.raw.004

    ...

    ```


    The default extension is a three-digit number appended to the output filename.

    Using the dc3ddd tool, you can split images during acquisition by specifying the
    output size with ofsz=. The file extensions are numerical, as shown here:


    ```

    # dc3ddd if=/dev/sdh ofsz=640M of=image.raw.000

    # ls

    total 7733284

    -rw-r-- 1 root 67108640 Jan 14 10:59 image.raw.000

    -rw-r-- 1 root 67108640 Jan 14 10:59 image.raw.001

    -rw-r-- 1 root 67108640 Jan 14 10:59 image.raw.002

    ...

    -rw-r-- 1 root 67108640 Jan 14 11:00 image.raw.009

    -rw-r-- 1 root 67108640 Jan 14 11:00 image.raw.010

    -rw-r-- 1 root 536870912 Jan 14 11:00 image.raw.011

    ```


    Be sure the file extension has enough zeros, or de3ddd will fail to complete and
    generate an error message, as [!] file extensions exhausted for image.raw.0. The
    last file in the set will usually be smaller than the others (unless the image
    is perfectly divisible by the split file size).

    EnCase tools typically default to splitting images during acquisition. You can
    acquire a disk to split EnCase image using ewfacquire by specifying a maximum
    segment file size using the -s flag:


    ```

    # ewfacquire -S 2g /dev/sdc

    # ls

    ```


    ```

    image.E01 image.E02 image.E03 image.E04 image.E05 image.E06

    ```


    The commercial EnCase forensic suite can then use these images directly. The ftkimager
    tool provides the --frag flag to save an image into parts during acquisition,
    as shown in this example:


    ```

    # ftkimager /dev/sdk --frag 20GB --s001

    AccessData FTK Imager v3.1.1 CLI (Aug 24 2012)

