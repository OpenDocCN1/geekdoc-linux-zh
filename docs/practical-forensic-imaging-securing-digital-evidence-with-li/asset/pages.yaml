- img_proc: true
  md: 'forensic setting. Write blockers guarantee a read-only method of attaching
    storage media to an examiner’s workstation.

    IST Computer Forensic Tool Testing (CFTT) provides formal requirements for write
    blockers. The Hardware Write Block (HWB) Specification, Version 2.0 is available
    at http://www.cft.nist.gov/hardware_write_block.htm. This specification identifies
    the following top-level tool requirements:


    +   * An HWB device shall not transmit a command to a protected storage device
    that modifies the data on the storage device.

    * An HWB device shall return the data requested by a read operation.

    * An HWB device shall return without modification any access-significant information
    requested from the drive.

    * Any error condition reported by the storage device to the HWB device shall be
    reported to the host.


    Both hardware and software write blockers are available, as stand-alone hardware,
    installable software packages, or bootable forensic CDs. In some cases, media
    might have built-in read-only functionality.


    # Hardware Write Blockers


    The preferred method of write blocking uses hardware devices situated between
    a subject disk and an examiner’s workstation. A hardware write blocker intercepts
    drive commands sent to the disk that might modify the data. A photograph of a
    portable write-blocking device protecting a SATA drive (Tableau by Guidance Software)
    is shown in Figure 4-1.


    ![](img/7fe0d6d164be3169c3098d32371b2eec_121_0.png)


    Figure 4-1: Portable SATA write blocker


    Hardware write blockers usually have a switch or LED to indicate whether write
    blocking functionality is in operation. A photograph of a multifunctional write-blocking
    device designed to be built directly into the examiner workstation (Tableau by
    Guidance Software) is shown in Figure 4-2. It can protect SATA, SAS, IDE, FireWire,
    and USB drives.'
  merge: -1
  pgno: 121
- img_proc: true
