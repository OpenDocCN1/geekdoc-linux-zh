    # Image Transfer and Storage


    Managing the transfer and long-term storage of forensic images safely and successfully
    requires some thought and planning. Often, situations occur in which you need
    to transfer an image to another party, such as another department within a large
    organization, an independent third-party forensics firm, or a law enforcement
    agency.


    Several factors influence how transfers are completed, primarily the size of data
    and the security of that data. In addition, depending on the organization, you
    might have to consider legal and regulatory requirements, as well as organizational
    policy requirements. For example, a global bank might not be able to transfer
    disk images across national borders to banking regulations prohibiting the transfer
    of data outside the country.


    Storing images for the long term also requires thought and planning. If an image
    will reopened several years later, different staff, tools, and infrastructure
    could be in place. It is important to document what has been stored and maintain
    backward compatibility with the software used in the past.


    # Write to Removable Media


    In the past, a stack of CDs or DVDs were used in the transfer of acquired drives
    images. With compression and splitting, using this was a cheap and feasible transfer
    method. Today, 4TB and 6TB disks are common on the consumer market. Optical disks
    are no longer a practical transfer medium for today''s larger image sizes, even
    with compression. However, for completeness, several examples are shown here.


    The following simple example shows burning a SquashFS file to CD-ROM. The mkiso
    command is a symlink to genimage and is used to create the filesystem to be burned
    to a disk with the wim tool.'
