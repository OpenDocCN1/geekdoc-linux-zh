- img_proc: true
  md: 'Filesystems that reside on disk devices in Unix and Linux require explicit
    mounting before being accessible as a regular directory structure. Mounting a
    filesystem simply means it is made available to use with standard file access
    tools (file managers, applications, and so on), similar to drive letters in the
    DOS/Windows world. Linux doesn''t use drive letters; mounted disks become part
    of the local filesystem and are attached to any chosen part of the filesystem
    tree. This is called the filesystem''s mount point. For example, the following
    command mounts a USB stick on an investigator system using (/mnt) as the mount
    point:


    ```

    # mount /dev/sdb1 /mnt

    ```


    To physically remove a disk in Linux, unmount the filesystem first to prevent
    corruption of the filesystem. You can use the command (that is, not mount) with
    either the device name or the mount point. These two commands perform the same
    action to unmount a disk filesystem:


    ```

    # umount /dev/sdb1

    # umount /mnt

    ```


    After the filesystem is unmounted, the raw disk is still visible to the kernel
    and accessible by block device tools, even though the filesystem is not mounted.
    An unmounted disk is safe to physically detach from an investigator''s acquisition
    system.


    Don''t attach or mount drives without a write blocker. There is a high risk of
    modifying, damaging, and destroying digital evidence. Modern OSes will update
    the last-accessed timestamps as the files and directories are accessed. Any userspace
    daemons (search indexers, thumbnail generators, and so on) might write to the
    disk and overwrite evidence, filesystems might attempt repairs, journaling filesystems
    might write out journal data, and other human accidents might occur. You can mount
    a filesystem while using a write blocker, and it will be accessible in the same
    way as a regular filesystem but in a read-only state, ensuring digital evidence
    is protected.


    # Accessing Filesystems with Forensic Tools


    When you''re using forensic tools, such as Sleuth Kit, dcffld, foremost, and others,
    you can access the filesystem (without mounting) by using the block device representing
    the partition where the filesystem resides. In most cases, this will be a numbered
    device, such as /dev/sda1, /dev/sda2, or /dev/sdb1, and so on, as detected by
    the Linux kernel.'
  merge: -1
