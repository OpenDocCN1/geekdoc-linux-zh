  md: '+   Some important questions to consider:

    * Can the acquisition be safely left running overnight while nobody is around?

    * Is the examiner machine unusable during the acquisition process (for performance
    reasons or other reasons)?

    * Can other examination work be done while the forensic image is being acquired?

    * When several tasks be completed in parallel?

    * Are there certain tasks or processes that can only be done sequentially?

    * Are there tasks that will block other tasks until they''re completed?

    * Can the workload be shared, delegated, or distributed across multiple examiners?


    You can calculate an estimated completion time for an acquisition. From previous
    work and processes, you should know the approximate initial setup time. This includes
    factors such as completing paperwork, creating necessary directory structure,
    documenting the hardware, attaching drives to the examiner host, depending on
    the approach for acquisition, and so on. This will give you a time estimate for
    the preacquisition phase.

    You can calculate the expected storage media acquisition time based on the amount
    of data (known) passing through the slowest component in the system (the bottleneck).


    # Performance and Bottlenecks


    To improve the efficiency of a forensic acquisition, you can optimally tune the
    examiner and assess the bottlenecks.

    A performance bottleneck always occurs; this is the slowest component in the system,
    which all other components must wait for. In a forensic setting, the bottleneck
    should ideally be the subject disk. This is the evidence source and is the only
    performance variable that you can (or should) modify.

    You can assess the performance of various system components by reading the vendor
    specifications, querying the system with various tools, or running benchmarking
    and measurement tests.

    Useful tools to check the speed of various components include dmidecode, lshw,
    hdparm, and lsusb. Several command line examples are shown here.


    To check the CPU family and model, current and characteristics, use this command:


    ```

    ```#dmidecode -t processor```

    ```'
