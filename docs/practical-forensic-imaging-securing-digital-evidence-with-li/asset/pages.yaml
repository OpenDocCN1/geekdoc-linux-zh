    # Forensic Formats


    Several issues with raw images have led to the creation of forensic files. When
    imaging storage media as evidence, there is metadata about the investigation,
    the investigator, the drive details, logs/timestamps, cryptographic hashes, and
    so. In addition to metadata, there is often a need to compress or encrypt an acquired
