    # Universal Serial Bus


    USB was created to consolidate and replace external peripheral inter-

    faces, such as RS-232, the parallel printer interface, PS/2 keyboard and

    mouse, and other proprietary PC interfaces. It was designed to accommodate-

    date purpose functionality, such as disks, keyboards, mice, sound,

    network connections, printers and scanners, and connected small devices

    (mobile phones and so on). A growing number of Internet-of-Things (IoT)

    devices can be attached to a PC via USB and may contain data useful as

    forensic evidence. Because the focus of this book is on the forensic acquisition-

    of mass storage devices, I will limit this discussion to USB mass storage

    devices.


    Flash drives, optical drives, some tape drives, and even magnetic hard

    disks (see Figure 1-19) may have a USB interface directly integrated into the

    drive electronics. The most common uses of the USB mass storage class are\he consumer
    USB stick, or thumb drive, and external hard disk enclosures.


    ![](img/7fe0d6d164be3169c3098d32371b2eec_56_0.png)


