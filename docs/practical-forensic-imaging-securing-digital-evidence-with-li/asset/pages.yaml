    ```

    | OFFICE-US123 |

    | USER-123456 |

    | PC1-HDA |

    | CD1 |

    | CD2 |

    | USER-98765 |

    | PC1-HDA |

    | PC1-HDB |

    | NB1-HDA |

    | USB1 |

    | USB2 |

    | DVD1 |

    | OFFICE-UK567 |

    | PC1-HDA |

    ```


    In this example, two office locations are US123 and UK567, in the United States
    and the United Kingdom, respectively. The US office is divided by user workplaces,
    and a directory is used for each piece of storage media under examination. The
    UK office PC is not associated with any particular user (possibly located in a
    meeting room), and this is reflected in the directory structure.


    Instead of using an employee identifier for the storage media, an organization’s
    IT inventory number can be used for the storage media in the directory structure.
    This unique identifier will have additional information associated with it (date
    of purchase, department, office location, user details, software installed, history
    of use, and so on). Confidentiality concerns might require you to omit information
    from the filenames and directory structure. For example, names of suspected or
    targeted individuals should not be embedded into filenames. Rather, you should
    use an identifier, initials, or an employee number. Code names for investigations
    might also be used. They provide a minimal level of protection if the information
    is lost, stolen, or otherwise accessed at a later date.


    # Save Command Output with Redirection


    After creating the directory structure to store the analysis results from various
