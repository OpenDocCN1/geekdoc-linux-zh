- img_proc: true
  md: 'In the previous examples, the sector offset of a Windows volume on the lenovo.raw
    image file was 3868672. You can provide this sector offset to the fsstat tool
    using the -o flag to analyze the filesystem metadata.


    ```

    # fsstat -o 3868672 lenovo.raw

    FILE SYSTEM INFORMATION

    ```


    File System Type: NTFS

    Volume Serial Number: 4038B39F38B39300

    OEM Name: NTFS

    Volume Name: Windows8_OS

    Version: Windows XP


    METADATA INFORMATION

    First Cluster of MFT: 786432


    If the drive is directly attached to your workstation, the Linux kernel will attempt
    to parse the partition table and make the disk and partition devices available
    in /dev/, where you can access them directly.

    However, if you''re examining a raw image file (.raw, .e0f, and so on), there
    will be no device file for the image. The kernel will not interpret the partition
    table and will not create the familiar partition devices (/dev/sda1, /dev/sda2,
    and so on). You must specify an offset when accessing a partition within an image
    file.

    It''s better to use forensic tools to determine the partition details rather than
    trust the kernel. If a disk is corrupted or damaged, the kernel might refuse to
    create the partition devices or create the wrong ones. The examples you saw in
    this section always specified an offset rather than using the kernel. In situations
    that involve malware, antforensics, or other malicious misconduct, using forensic
    tools instead of the kernel should take precedence.


    # Partition Extraction


    This section describes the extraction of individual partitions, inter-partition
    gaps, and other areas of the disk like the DCO and HPA. Let''s begin with some
    basic examples of extracting regular partitions.


    # Extract Individual Partitions


    To access and extract individual partitions rather than the entire hard disk,
    you can use several techniques. I''ll demonstrate a few examples of partition
    extraction using a directly attached drive with a partition mapper device, and
    image files operated by Sleuth Kit''s mmcat- and dd-style tools.'
  merge: -1
  pgno: 291
- img_proc: true
  md: 'If a disk is accessible as an attached device, acquiring the partition similar
    to performing a full acquisition with a raw drive device but uses the partition
    device instead. In the following example, the first partition of /dev/sda is extracted
    to a file:


    ```

    # dcfldiff if=/dev/sda of-partition.raw

    ```


    Extracting partitions requires some capacity planning, because the partition will
    consume disk space (possibly alongside the full drive image). If you need temporary
    access to a partition from an acquired image file, you can attach it as a loop
    device and access it. The following steps demonstrate this method.


    First, use the mmls to identify the partition to be attached as a loop, as follows:


    ```

    # mmls lenovo.raw

    GUID Partition Table (EFI)

    Offset Sector: 0

    Units are in 512-byte sectors

    ```


    ```

    05: 01 000250048 0002582527 0005324880 EFI system partition

    ......

    ```


    Then use Bash math expansion to convert the sector offset and sector length into
    a byte offset and length:


    ```

    # echo $((2050048*512))

    1049624576

    # echo $((532480*512))

    272629760

    ```


    The calculated byte offset and byte length are passed to losetup to create a loop
    device, as follows:


    ```

    # losetup --read-only --find --show --offset 1049624576 --sizelimit 272629760

    lenovo.raw

    /dev/loop2

    ```


    You can access this loop device using forensic tools in the same way you access
    the partition device of an attached disk. An example using Sleuth Kit is shown
    here:


    ```

    # fls /dev/loop2

    r/r 3: SYSTEM_DRV (Volume Label Entry)

    d/d 4: EFI

    d/d 5: BOOT

    d/d * 7: MSIA11f8.tmp

    d/d * 8: _SI2DBB4.TMP

    ```'
