    # Legacy Optical Storage


    A number of legacy optical drives exist, in particular, the cartridge-based Write
    Once, Read Many (WORM) times drive. The legacy optical drives were more commonly
    used in enterprise environments, typically used SCSI interfaces, and were accessible
    as a linear sequence of sectors. If the drive and a compatible controller card
