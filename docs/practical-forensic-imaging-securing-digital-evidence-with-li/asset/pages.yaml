  md: 'Note that the preceding examples were done with root privileges to reduce complexity
    and make them easier to understand. You can perform the same commands as a nonprivileged
    user, as shown here:


    ```

    $ dislocker-metadata -V bitlocker-image.raw

    $ mkdir clear files

    $ dislocker-fuse -u -V bitlocker-image.raw --o allow_root clear

    $ sudo mount -o loop,ro,uid=holmes clear/files

    ...

    n$ sudo umount files

    $ fusermount -u clear

    $ rmdir clear files

    ```


    Here dislocker-fuse passes -o allow_root to the FUSE driver, allowing sudo to
    be used for mounting and unmounting. The uid=holmes ensures that Mr. Holmes can
    access the mounted files without root privileges. It''s assumed that Mr. Holmes
    is a member of the FUSE Unix group, and the /etc/conf file contains the line user_allow_other.


    Using dislocker, you can provide three possible credentials to unlock a BitLocker
    container. -u flag (used in the previous example) specifies that the user''s password
    will be requested. -p flag provides a recovery password (48 digits) and an -f
    flag specifies a key file (BEK file).\ Using a recovery password (-p) instead
    of a user password (-u) requires manually keying the 48-digit recovery password,
    as follows:


    ```

    $ dislocker-fuse -p -V bitlocker-image.raw clear

    ter the recovery password: XXXXX-XXXXX-XXXXX-XXXXX-XXXXX-XXXXX-XXXXX

    Valid password format, continuing.

    ```


    The non-root version of this command passes flags to FUSE, which allows mounting
    with sudo:


    ```

    $ dislocker-fuse -p -V bitlocker-image.raw --o allow_root clear

    ```


    You can also decrypt the BitLocker image and save it separately as a regular filesystem
    (only the specified volume is saved, not the partition table or other partitions).
    This will take some time depending on the size of the BitLocker image, as the
    entire image is decrypted and written to a new image on the disk. You''ll need
    to do some capacity planning, because the two images, encrypted and decrypted,
    will take up space on the acquisition host. You can create a decrypted version
    of the volume as:


    ```

    $ dislocker-file -u -V bitlocker-image.raw bitlocker-image.clear

    ter the user password:

    # ls -hs

    total 15G

    7.4G bitlocker-image.clear 7.4G bitlocker-image.raw

    ```'
