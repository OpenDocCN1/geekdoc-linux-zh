  md: '# About the Author


    Bruce Nikkel is the director of Cyber-Crime / IT Investigation & Forensics at
    UBS AG, a global financial institution based in Switzerland. He has worked for
    the bank’s security and risk departments since 1997 and has managed the IT forensics
    team since 2005. Active in the digital forensics community, Bruce has published
    research papers on various digital forensics topics and is an editor for Digital
    Investigation: The International Journal of Digital Forensics and Incident Response.
    He is also on the organizing committee of DFRWS Europe. Bruce holds a PhD in network
    forensics from Cranfield University. His forensics website is http://digitalforensics.ch/
    and he can be reached at nikkel@digitalforensics.ch.'
