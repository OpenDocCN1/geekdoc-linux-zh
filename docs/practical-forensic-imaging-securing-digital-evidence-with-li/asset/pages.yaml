  md: 'Here, Optional Admin Command Support (OACS) indicates that namespace management
    is not supported on this particular drive. The Number of Namespaces (nn) shows
    the number of namespaces on the controller—one on this particular device. You
    can also check the size of the namespace using nvme-cli and compare it with the
    manufacturer’s specifications, as follows:


    ```

    # nvme id-ns /dev/nvme0

    NVME Identify Namespace 1:

    nsze : 0xe29390b0

    cap : 0xe29390b0

    nuse : 0xe29390b0

    ...

    ```


    Here, nsze refers to the namespace size, ncap is the namespace capacity, and nuse
    is the namespace utilization. If these values match the vendor’s documented size,
    they confirm that a single namespace is being used.

    A third check for the existence of multiple namespace devices can be detected
    by (/dev/nvme2*, /dev/nvme3*, and so on) by the OS.

    As of this writing, there were no consumer drives available for testing that supported
    multiple namespaces. The information in this section is derived from the NVME
    specification and tool documentation.


    # Solid State Hybrid Hybrids


    A hybrid of a solid state and traditional magnetic disk was developed to provide
    larger disk capacities, with performance comparable to SSDs, at an affordable
    price.

    These hybrid drives, known as Solid State Hybrid Disks (SSHDs), provide additional
    solid state caching of frequently used sectors. SSHDs can operate fully independently
    of the OS or accept “hints” from the OS to decide which blocks to cache.

    As of SATA 3.2, a hybrid information feature has been added to allow a host to
    communicate caching information to a hybrid drive using ATA commands.

    To date, little research has been done on the forensics of SSHDs, and the implications
    for acquisition are unclear. SSHs contain a small SSD disk that must perform wear
    leveling. A hybrid drive that does not support TRIM commands is not likely to
    erase data in unallocated blocks.

    The hybrid systems described here are built into the electronics of a single drive.
    It is also possible to have a hybrid system with two separate drives: a smaller
    SSD and a larger magnetic drive. Using OS drivers or proprietary systems like
    Intel’s Smart Response Technology, equivalent hybrid caching is achieved.'
