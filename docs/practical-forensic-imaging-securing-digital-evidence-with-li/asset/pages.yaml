    The dd_rescue tool (note the underscore) was developed by Kurt Garloff in the
    late 1990s, and although the name contains dd, the syntax is completely different
    and it doesn''t perform data conversion (same with ddrescue). But it transfers
    blocks of data similar to dd. Several features make this tool a possible option
    for use in a digital forensic laboratory. The block size is dynamically changed
    when disk errors occur, automatically decreasing to a physical block size. After
    a period without errors, the block size is changed again to improve performance.
    You can also image the disk backwards, from the end to the disk. This technique
    is useful if the drive has difficulty reading a certain point on the disk.

    The myrescue tool is designed to initially avoid unreadable areas (retries) and
    focuses on recovering as much of the readable areas as possible. After the readable
    sectors are copied, it works on the failed regions. The tool documentation recommends
