  md: '15466496+0 records out

    7918845952 bytes (7.9 GB) copied, 130.952 s, 60.5 MB/s


    Here if= specifies the input file, which in this case is a raw disk device attached
    to the acquisition system. The of= parameter is the output file, which is a normal
    file that contains the raw data copied from the disk device.

    On completion, dd reports how many bytes were transferred. You can divide the
    number of bytes transferred by the sector size, and the result should exactly
    match the number of sectors identified when you attached the device.


    There can be challenges when using dd forensically identify a disk. If read errors
    occur in the middle of an acquisition, dd will abort with "Input/output error."
    Address this issue by adding conv=noerror, which will force dd to skip over the
    unreadable block and continue. The problem with skipping unreadable blocks is
    that the sector offset on the destination file changes for filesystem blocks on
    the rest of the disk to appear corrupted. To illustrate consider the pages of
    a book. Suppose page 99 is ripped out. If the table of contents points to a chapter
    starting at page 200, it’s still possible to find it. The book’s page numbers
    are intact, even with the missing page. This is not the case when sector 99 is
    ripped out of a disk image (due to a read error). The rest of the sectors are
    renumbered, and the filesystem’s “table of contents will point to the wrong blocks
    after sector 99.


    The sync parameter corrects this by padding the unreadable output with zeros,
    essentially creating a “fake” sector (full of zeros) to represent the missing
    one. The rest of the disk image will then have the correct sector numbers (offsets)
    expected by the filesystem contains.


    Using the previous example, but this time with protection from unreadable blocks
    (skipping and padding with zeros), this gives this:


    ```

    # dd if=/dev/sda of=image.raw conv=noerror,sync

    15466496+0 records in

    15466496+0 records out

    7918845952 bytes (7.9 GB) copied, 136.702 s, 57.9 MB/s

    ```


    Padding the output impacts the forensic acquisition in that the image is modified
    and new (the zeros) has been added. Cryptographic checksums of the disk will not
    match the original data on the disk (especially if there are new or changing unreadable
    areas of a disk). This problem can be managed by logging hash windows. This is
    discussed in “Hash Windows on on 152.


    Another issue with dd is that the transfer block size can be larger than the physical
    media sector size. This is problematic when a read error occurs, because the remaining
    sectors in the larger block are padded with zeros, not just the one unreadable
    sector. This means some normal sectors might be excluded from the forensic image.
    A block size larger than the sector size could also cause additional padding sectors
    to be added to the'
