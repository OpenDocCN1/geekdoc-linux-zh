    # NVME Namespaces


    The NVME specification introduces the concept of namespaces, which allow you to
    partition a drive at a lower layer, abstracted from the normal OS. Forensic imaging
    of a drive with multiple namespaces must be done separately for each namespace.
    You can determine the number of namespaces in several ways.


    By sending an identify controller admin command using the nvme-cli tool, you can
    check the number of namespaces supported and used. The following example shows
    information about namespace support:


    ```

    # nvme id-ctl /dev/nvme1 -H

    NVME Identify Controller:

    vid : 0x144d

    ssvid : 0x144d

    sn : 2SLGNCA04891H

    mn : Samsung SSD 950 PRO 256GB

    fr : 10BQXX7

    oacs : 0x7

    [3:3] : 0 NS Management and Attachment Not Supported

    ...

    [0:0] : 0x1 SMART/Health Log Page per NS Supported

    ...

    nn : 1

    ```'
