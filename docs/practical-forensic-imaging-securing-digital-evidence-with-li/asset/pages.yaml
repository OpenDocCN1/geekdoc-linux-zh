- img_proc: true
  md: 'In cases where the Linux kernel does not detect the filesystem, you may need
    to explicitly specify it. A filesystem will not be correctly detected for any
    of the following reasons:


    +   - The filesystem is not supported by the host system (missing kernel module
    or unsupported filesystem).


    +   - The partition table is corrupted or missing.


    +   - The partition has been deleted.


    +   - The filesystem offset on the disk is unknown.


    +   - The filesystem needs to be accessible (unlock device, decrypt partition,
    and so on).


    In later sections of the book, I''ll explain techniques that use loop devices
    to access partitions and filesystems that are not automatically detected by the
    Linux kernel or various forensic tools.


    # Linux Distributions and Shells


    When you''re creating an investigator workstation to perform digital forensic
    acquisition or analysis work, it''s useful to understand the basic construction
    or composition of a Linux system.


    # Linux Distributions


    The **Linux** technically refers only to the *kernel*, which is the actual OS.
    The graphical interface, tools and utilities, and even the command line shell
    are not Linux but parts of a Linux **distribution**. A distribution is a functional
    package that typically contains the Linux kernel, installers and package managers
    (usually unique to the distribution), and various additional programs and utilities
    (including standard applications, such as Office suite, web browsers, or email/chat
    clients). There is only one official Linux kernel, but there are many Linux distributions—example,
    Red Hat, Hat, SUSE, Arch, and Debian, among others. There are also derivative
    distributions. For example, Ubuntu is a derivative of Debian, CentOS is based
    on Red Hat, For a comprehensive list of distributions (and other non-Linux, open
    source OS), visit http://distrowatch.com/.


    Multiple components make up the graphic interface of various Linux distributions
    and are useful to understand. The X11 window system is a server that interacts
    with the graphics hardware and provides an interface to the X11 graphics primitives
    (Wayland is a newer alternative to X11). A window manager controls movement, resizing,
    placement, and other windows management on a system. Some examples of window managers


    > There is some naming controversy regarding the inclusion of GNU with Linux,
    https://en.wikipedia.org/wiki/Linux_naming_controversy.'
