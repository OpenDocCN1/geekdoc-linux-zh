    | 05: 003 | 0781231552 | 0234441647 | 0156210096 | Mac OS HFS (0xfaf) |


    When you no longer need a loop device, deminify it as follows:


    ```

    # loopup --detach /dev/loop0

    ```


    Loop devices are flexible and configurable. In the previous mms example, a filesystem
    starts at sector 2048. It''s possible to specify an offset each time you run a
    forensic tool, but it''s easier to have a separate device for each partition (similar
    to /dev/sda for example). You can create a separate loop device using the loopup
    command for that partition by specifying the correct flag (-offset) and size flag
    (-sizelight). However, a more commonly accepted way is to use the device mapper.


    You could do this using dmset and mapping tables as "RAID and Multisk Systems"
    on page 178. However, the kpart tool automates the creation of partitions for
    a particular image file. A forensically acquired image with four partitions is
    used in the following example to demonstrate the kpart tool making mapper devices
    for each partition:


    ```

    # kpart -r -a -v image.raw

    map loop01 (252:0): 058595328 linear /dev/loop0 2048

    map loop02 (252:1): 019531776 linear /dev/loop0 585957376

    map loop03 (252:2): 0102400 linear /dev/loop0 781291552

    map loop04 (252:3): 0156210096 linear /dev/loop0 782315552

    ```


    Here, the kpart tool reads the table on a disk or image file, creates a loop device
    for the whole image, and creates mapper devices for each partition. The -r flag
    ensures the loop and partitions are read-only, and the -a flag instructs kpart
    to map everything. Use the verbose flag -v to document the command output and
    indicate what was just mapped.


    In this example, a loop device is created (/dev/loop0) for the whole image file
    and is accessible as a raw block device. In addition, partition devices are now
    available in the /dev/mapper directory, and you can access'
