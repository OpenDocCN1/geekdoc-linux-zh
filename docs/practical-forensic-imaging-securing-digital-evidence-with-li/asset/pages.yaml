    # Access a Set of Split Image Files


    Forensic tools, as Sleuth Kit, provide support for operating directly on a set
    of split images without needing to reassemble them. To list the supported images
    in Sleuth Kit, use the -i l flag with Sleuth Kit image-processing tool:


    ```

