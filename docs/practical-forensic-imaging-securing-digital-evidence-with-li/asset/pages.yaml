    health, and so on), regulatory bodies may play a larger role in influencing and
    defining standards for evidence collection in the future.


    # Principles Used in This Book


    This book focuses on forensic tasks that the private and public sectors have in
    common. The examples given with a simplified forensic acquisition, further examples
    demonstrate additional features and capabilities of the acquisition process. This
    includes preserving evidence using cryptographic hashing and logging, performance,
    error handling, and securing an acquired image. I also explain several techniques
    for imaging over a network, as well as special topics, as magnetic tapes and RAID
    systems.


    To perform a forensic acquisition, there are several prerequisites:


    +   * The subject drive is attached and recognized by the Linux kernel.

    * Write blocking is established.

    * The subject drive has been positively identified and documented.

    * Full access to the device is possible (HPA, DCO, and ATA security are disabled).

    * Time and storage capacity are available to perform the acquisition.


    The forensic acquisition process and tools testing are well documented within
    the digital forensics community, and certain requirements are expected. A useful
    resource is the CFTT Program instituted by NIST. The top-level forensic-imaging
    requirements from NIST include:


    +   * The tool shall make a bitstream duplicate or an image of an original disk
    or partition.

    * The tool shall not alter the original disk.

    * The tool shall log I/O errors.

    * The tool''s documentation shall be correct.


    These principles, described in a paper published by NIST,³ provide a foundation
    for the rest of the book. They exist to ensure that integrity is preserved, and
    tampering is either prevented or detected.


