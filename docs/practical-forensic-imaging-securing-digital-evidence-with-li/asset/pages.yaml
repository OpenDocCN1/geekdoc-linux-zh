  md: '# Attach Removable Media


    This section covers the attachment of devices that use removable storage media.
    The most common examples of removable media are optical discs, memory cards, and
    magnetic tapes. In a way, attaching removable media to an acquisition host occurs
    twice. The device electronics attached, and then in an additional step, the removable
    media is inserted. Let''s begin with a discussion on optical media drives.


    # Optical Media Drives


    Optical drives are typically attached internally via SATA or externally via USB.
    The drives appear in the Linux device tree but without media. Running forensic
    commands on an empty drive produces obvious results, as shown here:


    ```

    # mm /dev/cdrom

    Error opening image file (raw_open: file "dev/cdrom" - No medium found)

    ```


    Two useful commands provide information about the attached drive and inserted
    discs. The cd-drive command provides details about an attached optical drive (internal
    or external), including various features, supported media, and so on:


    ```

    # cd-drive

    cd-drive version 0.83 x86_64-pc-linux-gnu

    ...

    CD-ROM drive supports MMC 3

    ```


