- img_proc: true
  md: 'Wiping individual files is a complex process and depends on many variables
    related to the OS and filesystem used. There are no guarantees that all fragments
    of a wiped or shredded file have been completely destroyed.


    # Secure Wipe a Storage Device


    Wiping entire physical drives involves writing zeros or random bytes to every
    user-accessible sector on the drive. This does not guarantee that all hidden or
    user-inaccessible areas of a physical drive are wiped. Sectors protected by an
    HPA or DCO (which can be removed), remapped sectors, overprovisioned areas of
    flash drives, and inaccessible system areas of a drive are not user accessible
    and therefore cannot be wiped with normal Linux tools. In spite of this, wiping
    all user-accessible sectors still provides a reasonable level of assurance, so
    this is a diligent method of data disposal for reusing drives within a lab.


    Depending on a particular organization''s risk appetite and policies, data disposal
    might require one or more of the following:


    +   * No wiping at all, just common reformatting

    * Wiping all visible sectors with one pass of zeros

    * Wiping all visible sectors with multiple passes of random data

    * Physically degaussing drives

    * Physically shred drives


    The disposal method required is a risk-based decision that depends on the sensitivity
    of the data on the drive, who might have an interest in recovering the data, cost
    and effort for recovery, and other factors.

    This example uses dc3dd to write zeros to each visible sector on the disk. The
    dc3dd tool has built-in wiping functionality, and you can use it for following:


    ```

    # dc3dd wipe=/dev/sdi


    dc3dd 7.2.641 started at 2016-01-16 00:03:16 +0100

    compiled options:

    command line: dc3dd wipe=/dev/sdi

    device size: 29305206 sectors (probed), 120,034,123,776 bytes

    sector size: 4096 bytes (probed)

    122 G ( i 100 % ), 369 s, 32 M/s

    ```


    input results for pattern ''00'':

    29305206 sectors in


    output results for device `/dev/sdi'':

    29305206 sectors out


    dc3dd completed at 2016-01-16 01:03:35 +0100'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'You could also complete this task using dd with /dev/zero as the input file,
    but dc3cd3 is faster.

    To confirm the disk has been wiped with zeros, you can use dd to read the disk
    into a hexdump program:


    ```

    # dd if=/dev/sda | hd

    ```


    If the entire disk is full of zeros, the hexdump (hd) will display one line of
    zeros followed by an asterisk (*), indicating a repeated pattern across the entire
    disk.


    ```

    000000 000000 000000 000000 000000 000000 000000 000000

    *

    ```


    If the result shows only zeros, the user-accessible sectors of the drive have
    been successfully wiped.

    The following example uses the nwipe tool, a fork of Darik''s Boot and Nuke (dban).
    The nwipe tool can specify different wiping standards, randomness, and rounds,
    and it will provide a log file of activity. The Canadian RCMP TSSIT PPS-I wipe
    version is here:³


    ```

    # nwipe --autonuke --nogui --method-ops2 /dev/sdj

    [2016/01/15 23:14:56] nwipe notice: Opened entropy source ''/dev/urandom''.

    [2016/01/15 23:14:56] nwipe info: Device ''/dev/sdj'' has sector size 512.

    [2016/01/15 23:14:56] nwipe warning: Changing ''/dev/sdj'' block size from 4096
    to 512.

