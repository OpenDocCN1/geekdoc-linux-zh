  md: '# Identify and Unlock ATA Password-Protected Disks


    The ATA/ATAPI commands (http://www.t13.org/) specify a security feature that restricts
    access to a disk using passwords. When this feature is enabled, the firmware prevents
    the execution of certain ATA commands, including access to content, until the
    required password is provided. This is only an access control feature and doesn''t
    use encryption to protect data on the disk.


    The hdparm tool can determine if a disk has the security feature enabled. For
    example:


    ```

    # hdparm -I /dev/sda

    ...

    Commands/features:

    Enabled Supported:

    ...

    * Security Mode feature set

    Security:

    Master password revision code = 1

    supported

    enabled

    locked

    not frozen

    not expired: security count

    supported: enhanced erase level high

    60min for SECURITY ERASE UNIT. 60min for ENHANCED SECURITY ERASE UNIT.

    ```


    The Commands/features information indicates the Security Mode feature set exists,
    and the Security also confirms the feature is supported and enabled.

    If Security has has enabled, a user password has been set, and the drive will
    be locked on boot. If the drive is locked, as in the preceding example, access
    to the drive is prevented until a correct password is provided. The OS may generate
    a device error or failed command error as it tries to access the disk. The T13
    standard outlines which commands are allowed when a disk is locked. Access to
    a number of commands, including to query SMART information, is possible when a
    disk is locked.


    Two passwords can be set, user and master. If the user password is set, security
    is enabled (as shown in the preceding example). Setting the master password alone
    does not enable security.

    If a master password has never been set (it may still have a factory default password
    set), the Master password revision code will be set to 65534. The first time the
    master password is set, this value is set to 1 and incremented each time the master
    password is set again.'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'Two security levels control how correct passwords behave. The Security level
    refers to the MASTER PASSWORD CAPABILITY bit in the T13 standard and can be "high"
    or "maximum". If the security level is set to high, either user or master passwords
    can unlock the drive. If the security level is set to maximum, the master password
    will allow security erase commands but only the user password can unlock the drive.


    Some PCs might issue a security freeze command after booting to prevent further
    commands from being sent (to prevent malicious password-setting attacks). The
    Security output from hdparm will indicate if a drive is frozen. Many USB bridges
    automatically spin up an attached disk in an unfrozen state, but if you still
    have difficulty there are several possibilities to try:


    +   * Checking the BIOS for settings to enable/disable the freeze command

    * Using a forensic boot CD that prevents freeze commands from being issued

    * Attaching the disk to a separate controller card (not built into the mainboard)

    * Hot plugging the disk into the system (if supported)

    * Using a mainboard that does not issue freeze commands


    If you know the user password and the drive security is frozen, you can unlock
    the drive as:


    ```

    # hdparm --security-unlock "mysecret99" /dev/sdb

    security_password="mysecret99"

    ```


    /dev/sdb:

    Issuing SECURITY_UNLOCK command, password="mysecret99", user=


    By default, the user password is provided using hdparm, and the master password
    needs to be explicitly specified with an additional command line parameter. If
    you know the master password and the security level is set to high, you can use
    the master password to unlock the drive as:


    ```

    # hdparm --security-unlock "companysecret22" /dev/sdb

    security_password="companysecret22"

    ```


    /dev/sdb:

    Issuing SECURITY_UNLOCK command, password="companysecret22", user=master


    If no passwords are known, the disk is not accessible with regular tools. The
    password information is stored on the service/system areas of a disk and is generally
    not accessible without special hardware or tools. However, further options are
    available and discussed here.'
  merge: -1
  pgno: 154
- img_proc: true
  md: 'The master password might be set to a factory default and can be used to gain
    access to the drive (if the security level is set to high and not maximum). You
    can easily find factory default passwords on the internet.


    Using brute force to identify the master or user password is insufficient, the
    drive must be reset after five failed attempts. If you have a small set of likely
    passwords, multiple attempts become feasible and may lead to lucky success.


    Specialized data recovery companies provide services and hardware tools that can
    recover or reset ATA Security Set passwords from the service areas of a disk.
    Success is not guaranteed for all disks, but data recovery firms list the disks
    they do support. In some cases, you might have to ship the disk to the firm''s
    laboratory, which may have chain-of-custody implications. See "Drive Service Access"
    on page 122 for more information.


    The hard disk vendor may be able to provide assistance to reset the ATA password.
    This will depend on the cooperation of the drive vendor, the ability to prove
    ownership of the disk and its contents, the authority of the requesting party,
    and the motivation for recovering the data.


    Hardware and firmware hacks and published methods by researchers may may provide
    access for certain hard drive models. The security research community is regularly
    finding innovative ways to access and modify data in hard-to-reach places.


    # Identify and Unlock Opal Self-Encrypting Drives


    Self-encrypting drives (SEDs) are a form of full-disk encryption (FDE). Unlike
    software-based FDE (TrueCrypt, FileVault, LUKS, and so on) where the OS manages
    the encryption, SEDs have encryption capabilities built directly into the drive
    firmware. SEDs are agnostic and based on vendor-independent standards. The international
    body responsible for defining the standard is the Trusted Computing Group (TCG;
    http://www.trustedcomputing.org/). The standard is the TCG Storage Security Subsystem
    Class: Opal, Specification Version 2.0.


    This section identifies drives with Opal encryption and describes how appropriate
    keys can be used to unlock the drive. The recovery of encryption keys is outside
    the scope of this book. The examples shown here assume the key is known.


    A physical examination of the drive can indicate if it is an Opal SED. The existence
    of a *Physical Security ID* (PSID) string printed on the label of the drive is
    shown in Figure 5-2. This string is used for the Opal RevertSP feature, which
    generates a new key securely, destroying all data and resetting the drive to its
    original factory state. PSID cannot be queried from the drive and must be physically
    read or scanned if a QR code exists. The existence of a PSID string does not mean
    the drive is locked and passwords are set; it just indicates the drive supports
    Opal full-disk encryption.'
  merge: -1
