    # Logging Auditing


    Professional labs might want to implement more robust logging or an audit trail
    to satisfy stricter organizational policies or regulatory requirements. One possibility
    to achieve this is through auditd package. Typically, this involves running the
    auditd daemon with pam_tty_audit.so configured as a pam module. You can review
    audit trail using the aureport command.


    Using audit provides several security advantages, especially when used with granular
    access control, as sudo. Audit trails, in particular logging to a central log,
    can be relatively tamper resistant, ensuring an increased level of integrity when
    recording examination work.


    Comprehensive audit trails record all TTY activity (including strokes), as well
    as monitor file access and other events on a system. Setting up audit and audit
    reporting can be a complex process, one beyond the scope of this book.


    You''ll find discussions of other solutions and hacks in various places, including
    http://www.pointsoftware.ch/en/howto-bash-audit-command-logger/ and https://whcmx.com/2011/10/14/auditd-logging-all-commands/


    As of Bash 4.1, a new feature command history logging to syslog has been added
    (it may require recompilation to enable).


    # Organize Collected Evidence and Command Output


    When conducting a forensic examination on the command line, it''s common to save
    output from various tools and utilities to files for future reference and reporting.
    You can do this by redirecting the output of commands to text. Those files can
    be saved with the rest of the examination data collected. During the process of
    collecting and saving large amounts of evidence data, it is important to keep
    your file and directory structure organized and understandable. This section talks
    about various strategies to achieve this goal.


    # Naming Conventions for Files and Directories


    To reduce confusion among all the files, directories, mount points, images, and
    other data collected during an examination, it''s best to follow a naming convention.
    Make it descriptive enough to be intuitive, avoid redundancy in the wording and
    file extensions. Most important, make naming conventions consistent throughout
    an investigation or incident across multiple incidents.'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'Certain unique identifiers are associated with systems, storage media

    devices, and removable media. Such identifiers can be useful when deciding

    of a naming convention:


    +   - Company asset tag or inventory number for PCs

    - Manufacturer serial number for disk drives

    - 64-bit World Wide Name (WWN) for disk drives

    - Block device UUID for filesystems and RAIDs

    - Forensic hash value for disk drive images

    - 48-bit MAC address for network interface cards (NICs)

    - Forensic lab evidence number (possibly a sticker or tag on the drive)

    - Forensic lab evidence bag number (evidence bag containing the disc)


    Whenever possible, start all numbering with 1, not 0. Programmers and

    engineers have a tendency to start at 0, but people who read and review the

    reports may not have a technical background (lawyers, judges,

    managers, and so on) and expect number to 1.


    Raw images use the extension *raw throughout this book.

    commonly used *.raw implies that a tool was used, which might

    be the case. The *raw extension describes the file accurately without

    associating it with the particular tool used to acquire the image.


    Ideally, a raw filename should link a forensic image to a unique

    attribute of the physical object. If a forensic format is used, this unique

    information can be embedded as metadata in the forensic image file. This

    allows you to associate a lone physical disk with an image and associate a\lone
    image with a physical disk. The disk and the image remain linked

    without any dependencies on surrounding context (directory names, evi-

    dences, and so on). This establishes a chain of custody link between

    the physical and digital worlds.


    If large numbers of disks are under analysis, possibly include a series

    number in the filename. You can include varying levels of detail in

    a filename. The filename server12-slot3-seagate-3.5in-disk-500gb-

    raw is very descriptive, it might be too detailed and

    cumbers to work with. A practical naming convention for many basic

    idents could simply be the storage media type with a number, for

    example, disk1, tape1, ssd1, stick1, card1, dvd1, bluray1, floppy1,

    and so on. In cases, using a short description of the disk and the serial

    number might be the most suitable approach, for example, crucial-

    15030E69A241.raw. Often, it''s helpful to create image names that exam-

    ers can easily discuss in conversation, as, "We found the file on

    disk1." used in conversations, raw examination output, and final

    reports should have a consistent nomenclature.


    When extracting files from disk images, archive files, or other

    compound names, add an underscore to indicate it has

    extxtracted. This will prevent you and others from accidentally opening'
  merge: -1
