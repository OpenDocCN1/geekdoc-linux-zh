  md: 'useful tools for comprehensive partition searching as gpart and testdisk.

    These tools implement filesystem recognition algorithms with more intelligence
    to identify lost partitions.

    Running gpart without any options starts a scan for partitions, skipping areas
    identified as allocated. For example:


    # # gpart lenovo.raw


    ```

    Begin scan...

    Possible partition(Windows NT/W2K FS), size(1000mb), offset(1mb)

    Possible partition(Windows NT/W2K FS), size(3mb), offset(1030mb)

    Possible partition(Windows NT/W2K FS), size(3mb), offset(1494mb)

    Possible partition(Windows NT/W2K FS), size(92698mb), offset(18889mb)

    Possible partition(Windows NT/W2K FS), size(25000mb), offset(22869mb)

    End scan.

    ```


    Guessed primary partition table:

    Primary(1)


    ```

    type:(02x07) S(2) HPFS, NTFS, QNX or Advanced UNIX

    size:1000mb f#(204800) s(2048-2050047)

    chs:(0/32/33)-(406/60/28)d(0/32/33)-(406/60/28)r

    ```


    Adding -f flag tells gpart to be exhaustive, looking for partitions in every sector
    of the entire disk, in areas where no partitions are expected to be. This will
    take much longer than the default gpart scan flags.

    The testdisk tool (http://www.cgsecurity.org/), written by Christophe Grenier,
    who also wrote the photoreorec carving tool provides an interactive interface,
    supports multiple layout (DOS, GPT, BSD, and more), detects several dozen partition
    types, generates activity logs, and can extract partitions to a file. You can
    use testdisk on devices, raw image files, and even *.001 files.


    +   * Use the testdisk tool with caution. This tool was designed for repairing
    and partitions, and it could easily modify. Be sure to use a write blocker before
    running this tool on attached subject disks.

    * Also included with the tool is a comprehensive user interface system to define
    options and activities. Here is a batch mode example operating on an attached
    disk:


    # # testdisk /list /dev/sdb


    TestDisk 7.0, Data Recovery Utility, April 2015

    Christophe GRENIER <grenier@cgsecurity.org>

    http://www.cgsecurity.org

    Wait...

    Disk /dev/sdb - 15 GB / 14 GiB CHS 14663 64 32

    Sector size:512'
