- img_proc: true
  md: '# File Compression


    Using compression solves a number of the capacity challenges faced by a forensic
    examiner. You can use a compressed forensic format to store the resulting acquired
    image, but the effectiveness depends on a number of factors.


    The compression algorithms you choose will have some effect on the size and time
    needed to compress a subject disk. A better compression ratio will take more time
    to compress (and subsequently uncompress).


    A relatively new PC disk that contains a large number of untouched sectors (original
    manufacturer’s zero contents) will compress better than an older disk containing
    significant amounts of residual data in the unallocated sectors.


    Disks that contain large amounts of compressed files (*.mp3, *.avi, and so on)
    will not compress much further, and as a result, forensic tools will benefit less
    from added compression.


    Encrypted subject disks or disks with large numbers of encrypted files will not
    compress as well as unencrypted content due to the data''s higher entropy level.


    # Sparse Files


    Sparse files are worth mentioning because they have some advantages; however,
    they can be problematic when calculating disk capacity. Some filesystems use metadata
    to represent a sequence of zeros in a file instead of actually writing all the
    zeros to the disk. Sparse files contain “holes” where a sequence of zeros is known
    to exist. To illustrate, a new drive is acquired with GNU dd,first as a regular
    raw file and then as a sparse file.


    ```

    # dd if=/dev/zero of=image.raw

    1546496+0 records in

    1546496+0 records out

    7918845952 bytes (7.9 GiB, 7.4 GiB) copied, 112.315 s, 70.5 MB/s

    ```


    ```

    # dd if=/dev/sparse of=image.raw conv=sparse

    1546496+0 records in

    1546496+0 records out

    7918845952 bytes (7.9 GiB, 7.4 GiB) copied, 106.622 s, 74.3 MB/s

    ```


    The GNU dd command provides a conv=sparse flag that creates a sparse destination
    file. In these examples, you can see the number of blocks transferred is the same
    for both the normal and sparse files. In the following


    +   2. The GNU cp command also allows for the creation of sparse files during
    copy.'
  merge: -1
  pgno: 112
