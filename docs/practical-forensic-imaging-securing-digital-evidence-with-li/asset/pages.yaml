    # NVME SSDs


    NVME drives compete with SATA Express in the way they attach directly to a PCI
    Express bus. As of this writing, hardware write blockers for NVME drives are very
    new. They are hot-pluggable USB bridges for NVME and SATA Express drives from
    Tableau (Guidance Software). For illustration purposes, the examples show use
    an nvme device directly attached to a Linux system.


    You can use the nvme tool from the nvme-cli package to list the attached nvme
    devices:


    | Node | Model | Version | Namespace |

    | --- | --- | --- | --- |

    | /dev/nvme0n | INTEL SSDPE2M400G4 | 1.0 | 400.09 GB / 400.09 GB ... ... |

    | /dev/nvme1n | Samsung SSD 950 PR0 | 1.1 | 30.01 GB / 256.06 GB ... ... |


    You should also check each NVME drive for multiple namespaces using the nvme tool.
    In this example, only a single namespace exists:


    +   # nvme list-ns /dev/nvme1

    - [0]:01x


    Multiple namespaces may need to be acquired individually. This is a fundamental
    difference from other drives where a single drive is viewed as a linear set of
    sectors, which you can acquire in a single pass. NVME drives with multiple namespaces
    will likely need special consideration.¹

    It''s important to note that the NVME standard was created from scratch without
    backward compatibility with SCSI or ATA standards (AHCI, and so on). It has its
    own command set and operates independently from other disks. For this reason,
    some tools may not work as expected with NVME hardware. Any forensic tool operating
    directly on low-level device drivers, such as SATA or SAS, will not work with
    NVME. However, forensic tools operate on the virtual block layer, they should
    continue to work normally. In addition, PCI forensic blockers may act as a bridge
    and


    At the time of this writing, I did not have testing access to any NVME drives
    with support for multiple namespaces. These conclusions are based on reading the
    standards and documentation.


