- img_proc: true
  md: 'Dc1dd and dc3dd are based on mature and well-tested software, and they were
    designed to forensically acquire raw images with extensive hashing and logging.
    For disks with many bad blocks, GNU dddrescue might be a good choice. For integrated
    hashing, encryption, and compression during acquisition, recent versions of dd_rescue
    might be an interesting alternative. Ultimately, the tool used will depend on
    the forensic lab''s organizational policy, the type of examination, your personal
    preferences, and other circumstances. No particular tool is recommended in this
    book.


    All the examples in this chapter make the following assumptions:


    +   * The subject storage device is physically attached to the forensics workstation.

    * The subject storage device has been positively identified.

    * The appropriate write-blocking mitigation is in place to prevent modification
    of the drive.

    * Disk capacity planning has been performed to ensure disk space is not


