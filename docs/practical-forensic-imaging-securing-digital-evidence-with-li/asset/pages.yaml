    # Software Write Blockers


    Software write blockers have a somewhat controversial history. They’ve become
    increasingly difficult to develop and maintain with modern OSes. System updates
    by the OS vendor, configuration tweaks by the examiner, and additionally installed
    software all create a risk of disabling, overwriting, bypassing, or causing the
    failure of write-blocking functionality implemented in software.


    Software write blockers are difficult to implement. Simply mounting a disk as
    read-only (mount -o ro) will not guarantee that the disk won’t be modified. The
    read-only property in this context refers to the filesystem, the disk device.
    The kernel may still write to the disk for various reasons. Software write blocking
    must be implemented in the kernel, below the'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'virtual filesystem layer and even below the other device drivers that implement
    a particular drive interface (AHCI for example). Several low-level software write-blocking
    methods have been used in Linux but with limited success.


    Tools as hdparm and blockdev can set a disk to read-only by setting a kernel flag.
    For example:


    ```

    # hdparm -r1 /dev/sdk

    ```


    /dev/sdk:

    setting readonly to 1 (on)

    readonly      = 1 (on)


    The same flag can be set with blockdev, like this:


    ```

    # blockdev --setro /dev/sdk

    ```


    The method of setting kernel flags is dependent on properly updating to make newly
    attached drives read-only before any other process has a chance to modify them.


    A kernel patch has also been written to specifically implement forensic write-blocking
    functionality. You will find more information about it at https://github.com/msuhanov/linux-write-blocker/.
    Several forensic boots CDs use Maxim Suhanov''s write-blocking kernel patch. The
    following helper script manages software write blocking on the DEFT Linux forensic
    CD:


    ```

    # cat /usr/bin/wrtblk

    !/bin/sh

    ```


    ```

    # Mark a specified block device as read-only

    [ -eq 1 ] || exit

    [ -z "$1" ] || exit

    dev="$1"

    [ -b /dev/$bddev ] || exit

    [ -z $bddev#loop$ ] || exit

    blockdev --setro /dev/$bddev | logger wrtblk: blockdev --setro /dev/$bddev

    failed!

    ```


    ```

    # Mark a parent block device as read-only

    syspath=$(echo /sys/block/*$bddev)

    [ "$syspath = "/sys/block/*/bddev" ] && exit

    dir=$syspath#*/

    parent=$dir###*/

    [ -b /dev/$parent ] || exit

    blockdev --setro /dev/$parent | logger wrtblk: blockdev --setro /dev/$parent

    failed!

    ```'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'The patch is implemented in the kernel and is turned on (and off) using helper
    scripts. The helper scripts simply use the blockdev command to mark the device
    as read-only.


    NIST CFTT has performed software write blocker tool tests, which you''ll find
    at http://www.cftn.nist.gov/software_write_blocker.htm.


    Hardware write blockers are the safest and recommended method of protecting storage
    media during forensic acquisition.


    # Linux Forensic Boot CDs


    The need to perform incident response and triage in the field has led to the development
    of bootable Linux CDs that contain the required software to perform such tasks.
    These CDs can boot a subject PC and access the locally attached storage using
    various forensic tools. Forensic boot CDs are designed to protect discovered storage
    in the event it needs to be forensically imaged. You can make an attached disk
    writable by a command (like dd shown in the previous example), which is useful
    in acquiring an image when you attach an external destination disk. Forensic boot
    CDs also have network functionality and enable remote analysis and acquisition.


    Forensic boot CDs are useful when:


    +   * A PC is examined without opening it to remove a disk.

    * A write blocker is not available.

    * PCs need to be quickly changed during triage for a certain piece of evidence
    before deciding to image.

    * Linux-based tools (Sleuth Kit, Forensic, and so on) are needed but not otherwise
    available.

    * A forensic technician needs to remotely work via ssh.


    Several popular forensic boot CDs that are currently maintained include:


    +   * Kali Linux (formerly BackTrack), which is based on Debian: https://www.kali.org/

    * Digital Evidence & Forensics Toolkit (DEFT), which is based on Ubuntu Linux:
    http://www.deftlinux.net/

    * Pentoo, a forensic CD based on Gentoo Linux: https://pentoo.ch/

    * C.A.I.N.E., Computer Forensics Linux Live Distro, which is based on Ubuntu Linux:
    http://www.caine-live.net/


    Forensic boot CDs require a lot of work to maintain and test. Many other forensic
    boot CDs have been available in the past. Because of the changing landscape of
    forensic boot CDs, be sure to research and use the latest functional and maintained
    versions.'
  merge: -1
