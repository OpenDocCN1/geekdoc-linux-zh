- img_proc: true
  md: 'Linux and OSS are ideal for an academic forensic lab setting, because they
    use open, published standards rather than closed or proprietary standards. OSS
    development communities work with competing groups instead of against them. Learning
    from others, copying code and ideas from others (with due attribution), and building
    on the work of others are encouraged and are the basis for learning and gaining
    knowledge.


    The vendor independence that OSS offers prevents product lock-in and fosters interoperability
    and compatibility between technologies and organizations. This makes it easier
    to change the software over time, because individual components can be swapped
    out with new or alternative technologies without affecting the systems and processes
    as a whole.


    # Disadvantages of Linux and OSS in Forensics Labs


    The disadvantages of Linux and OSS provide arguments in support of closed proprietary
    software. Commercial tool implementations often provide benefits and advantages
    in this area.


    The open source community support is not guaranteed to be reliable, accurate,
    or trustworthy. The quality of the answers provided by the community can vary
    greatly; some answers are excellent, whereas others might be wrong or even dangerous.
    No formal organization support exists to help. In situations which 24/7 support
    must be guaranteed, commercial providers have an advantage.


    Support in the open source world is as transparent as the software, visible for
    all to see. However, in a forensic lab setting, casework and investigations may
    be sensitive or confidential. Reaching out for support could reveal or compromise
    details of an ongoing investigation. Therefore, information security and privacy
    are issues in the open source support model.


    Interoperability with proprietary technology poses difficulties with open source
    interfaces and APIs. Proprietary technologies that are not public often reverse
    engineered, not licensed. Reverse engineering efforts are often incomplete, at
    risk of incorrectly implementing a particular technology, and may take a long
    time to implement.


    Free OSS is a volunteer effort, and software may be in a perpetual state of development.
    Some projects may be abandoned or die from neglect. Other projects may experience
    forks in the code where some developers decide to copy an existing base code and
    take it in a different direction from the original developers.


    Free OSS can be rough around the edges. It may be buggy or difficult to learn
    or use. It may be poorly documented (the source code might be the only documentation).
    Unlike commercial software, usually no training is provided with the software
    product. It takes time and effort to learn Unix/Linux; in particular, the command
    line is not as intuitive as an all-in environment. Many experience a learning
    curve when they first enter the free, open source world, not just for the software
    but also for the general attitude and mind-set of the surrounding community.'
