    # Remove from HPA


    The HPA was developed to allow PC system manufacturers to store data in a way
    that is normally inaccessible to a customer. Examples of HPA uses include diagnostic
    tools, recovery partitions, and so on. These special areas are often activated
    with BIOS hotkeys during startup.

    You can detect the existence of an HPA using a single hdparm command:


    ```

    # hdparm -N /dev/sd1

    ```


    ```

    /dev/sd1:

    max sectors = 879095852/976773168, HPA is enabled

    ```


    Here HPA is enabled indicates that an HPA exists. The max sectors provides the
    visible sector count followed by the real sector count. In this example, subtracting
    the two sectors reveals a 5GB difference, which is the most protected area.

    You can temporarily remove the HPA using the same command (with the DCO removal,
    a warning message appears, and you need to use the --yes-i-know-what-i-am-doing
    flag):


    ```

    # hdparm --yes-i-know-what-i-am-doing -N 976773168 /dev/sd1

    ```


    ```

    /dev/sd1:

    setting max visible sectors to 976773168 (temporary)

    max sectors = 976773168/976773168, HPA is disabled

    ```


    The result of this command is only temporary; the original HPA will be in place
    next time you cycle the drive''s power. To make the change permanent, add p to
    the sector count number as follows:


    ```

    # hdparm --yes-i-know-what-i-am-doing -N p976773168 /dev/sd1

    ```


