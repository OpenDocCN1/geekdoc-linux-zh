  md: '# Disk Cloning and Duplication


    In some situations, a clone or duplicate copy of a disk is preferred to an image
    file. Each duplicate is an exact sector-by-sector copy of the original disk. A
    newly cloned disk will have a cryptographic checksum that matches the original.
    A cloned disk can be useful for several reasons:


    +   * To use analysis tools and methods that require writing to disk

    * To boot a PC with the disk clone

    * To reconstruct RAID arrays using proprietary controllers


    Cloning disks is a straightforward process; it is basically acquisition in reverse.
    Be sure to exercise caution during the duplication process, because you could
    destroy data if the wrong device is mistakenly used as the destination.


    # Prepare a Clone Disk


    The size (number of sectors) of the destination, or clone, disk must be equal
    to or larger than the original disk. Because cloning involves a sector-by-sector
    copy, the destination disk must have the capacity to hold all sectors of the original
    disk. In some cases, having a larger destination is not a problem, because the
    PC and OS will be limited to what was defined in the partition table and ignore
    the rest of the disk. In other cases, duplicating the exact number of sectors
    of the disk is important, as software and tools may have certain sector number
    expectations. Examples include the analysis of GPT partitions (where a backup
    is stored at the end of a disk) and RAID systems, and the analysis of certain
    systems of malware that partly reside in the final sectors of the disk.


    Securely wiping (with zero sectors) the destination disk before cloning is critical
    to remove traces of previous data and reduce the risk of contaminating the clone.


    # Use HPA to Replicate Sector Size


    The HPA can be used to simulate the same number of sectors on the cloned disk
    as the original.² Setting the HPA on a cloned disk is beneficial if there is an
    expectation of the exact same number of sectors as the original. This is especially
    important when you''re reconstructing a RAID system with a proprietary controller
    or duplicating a disk with data expected in the final sectors of the disk.


    > NOTE You should know the exact sector count of the original drive (this was
    determined when the drive was attached to the examination host) before setting
    the HPA with the hdparm tool.


    ² The sector size could also be replicated using a DCO.'
  merge: -1
