  md: '6GB/s SED 5V 1.7A

    510E69A241

    007 HALOGEN FREE

    NA

    PSID: 54BADE82-5B0B-6578-E100-000089C981B5


    Figure 5-2: Opal SED PSID


    Full-disk encryption has a chicken-and-egg problem. If an entire drive is encrypted,
    including the boot sector, how can the execute master boot record (MBR) and ask
    for a password or other security credentials? The solution was to implement a
    shadow MBR and store it in the system area of a disk (the place where SMART data,
    block lists, and others are stored). When an Opal disk is in a locked state, only
    the shadow MBR is visible to the host. It is a group of unencrypted sectors (can
    be large—150MB in size, for example) that is executed as a normal MBR (the host
    is encrypted). This alternate boot area can execute to request a password, access
    a Trusted Platform Module (TPM) chip or software, or get other credentials. Once
    the disc has unlocked, the proper MBR becomes visible, and a normal boot process
    can begin.


    An open source command line tool was created to manage Opal encryption under Linux.
    Originally called msed, it was available at https://github.com/rn30/msed/, but
    the tool was recently renamed sedutli-cli and moved to https://github.com/Drive-Trust-Alliance/sedutli/.
    This tool is still under development and may not work on all drives. Follow the
    instructions carefully and ensure that libata.allow_tpm is enabled in the kernel.


    The following command scans the local system for Opal-compliant SED drives. Out
