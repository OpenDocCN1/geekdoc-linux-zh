  md: 'When the analysis work is complete, you''ll need to do cleanup:


    ```

    # umount files

    # rmdir files

    # fusermount -u clear

    # rmdir clear

    ```


    Note that the preceding examples were done with root privileges to reduce complexity
    and make them easier to understand. Most of the commands can be done as non-root
    with a few exceptions. Examples in which a command cannot be done when run by
    a unprivileged user are shown here:


    ```

    $ fdevount -o 209735680 -r FKZV....H4PD -e EncryptedRoot.plist.wipekey image.raw

    - X allow root

    $ sudo mount -o loop,ro clear/fde1 files

    $ sudo ls /Users/somebody/private/directory

    $ sudo umount files

    ```


    - X allow root string in the fdevount command allows root to access the FUSE mounted
    directory. The sudo command is needed to mount and unmount the hfsplus filesystem.
    You might also need sudo if filesystem permissions restrict access to files or
    directories.

    Other notable open source tools exist for operating on FileVault images. The VFDcrypt
    tool also provides decryption of FileVault images. Originally written by Ralph-Philipp
    Weinmann, David Halton, and Jacob Appelbaum, it is now maintained by Drake Alregilli.
    You''ll find it at https://github.com/andysvand/VFDcrypt/. It can decrypt an image
    into an unencrypted volume image.

    FileVault Craft was created by the same authors as VFDcrypt; you''ll find it at
    http://openciphers.sourceforge.net/oc/vcrack.php.


    # Linux LUKS


    A number of encryption systems are available in the open source world. Like, eCrypts
    or encfs, are directory based. Others like GPG and variety crypt tools, operate
    on individual files.

    In this section, I mainly focus on the LUKS encryption system, I''ll also touch
    on plain dm-crypt and loop-AES. Using the cryptsetup tool, you can set up all
    three. (You can also use the cryptsetup tool to manage TrueCrypt volumes, which
    I will describe in the following section).

    The examples that follow operate on a forensically acquired image with a LUKS-encrypted
    filesystem. We''ll create a block device representing the decrypted content of
    an encrypted filesystem and show methods to safely mount the filesystem structure
    for browsing with regular tools. The three goals are to get information about
    the encryption, create a device that can be accessed with forensic tools, and
    safely mount the filesystem for regular'
