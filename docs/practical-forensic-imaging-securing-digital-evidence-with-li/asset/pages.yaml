  md: '# "An indisensible reference for anyone responsible for preserving digital
    evidence."

    —Professor Eoghan Casey, University of Lausanne


    Forensic image acquisition is an important part of postmortem incident response
    and evidence collection. Digital forensic investigators acquire, preserve, and
    manage digital evidence to support civil and criminal cases; example organizational
    policy violations; resolve disputes; and analyze cyber attacks.


    Practical Forensic Imaging takes a detailed look at how to secure and manage digital
    evidence using Linux-based command line tools. This essential guide walks you
    through the entire forensic acquisition process and covers a wide range of practical
    scenarios and situations related to the imaging of storage media.


    You''ll learn how to:


    +   - Perform forensic imaging of magnetic hard disks, SSDs and flash drives,
    optical tapes, and legacy technologies

    - Protect attached evidence media from accidental modification

    - Manage large forensic image files, storage capacity, image format, compression,
    duplication, secure transfer and storage, and secure disposal

    - Preserve and verify integrity with cryptographic and piecewise hashing, public
    key signatures, and RFC-3161 timestamping


    +   - Work with newer drive and interface technologies like NVME, SATA Express,
    4k-native sector drives, SSDHs, SAS, UASP/USB3x, and Thunderbolt

    - Manage drive security as ATA passwords; encrypted thumb drives; self-encrypting
    drives; OS-encrypted drives using BitLocker, FileVault, and TrueCrypt;

    - Acquire usable images from more complex or challenging situations as RAID systems,
    virtual machine images, and damaged media


    With its unique focus on digital forensic acquisition and evidence preservation,
    Practical Forensic Imaging is a valuable resource for experienced digital forensic
    investigators wanting to advance their Linux skills and experienced Linux administrators
    to learn digital forensics. This is a must-have reference for every digital forensics
    lab.


    # About the Author


    Bruce Nikkel is the director of Cyber-Crime / IT Investigation & Forensics at
    a global financial institution where he has managed the IT forensics since 2005.
    He is an editor for Digital Investigation and has published research on various
    digital forensic topics. Bruce holds a PhD in network forensics.


