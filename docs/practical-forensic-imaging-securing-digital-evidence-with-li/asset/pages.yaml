    will be of little use. These methods work by spinning down the drive after a period
    of idle time; however, during a sustained imaging operation, there is little or
    no idle time.


    # Establish Forensic Write-Blocking Protection


    A fundamental component of digital evidence collection is performing a forensically
    sound acquisition of storage media. You can achieve this of goal by ensuring a
    write-blocking mechanism is in place before you attach the disk to the forensic
    acquisition host.


    When you attach a disk to a PC running a modern OS, automated processes significantly
    increase the risk of data modification (and therefore evidence destruction). Attempts
    to automatically mount partitions, generate thumbnail images for display in graphical
    file managers, for local search databases, with antivirus software, and more all
    attached disk at risk of modification. Timestamps may be updated, destroying potential
    evidence. Deleted files in unallocated parts of the disk might be overwritten,
    also destroying evidence. Discovered malware or viruses (the very evidence investigator
    might be looking for) could be purged. Purging filesystems could have queued changes
    in the journal written to disk. There may be attempts to repair a broken filesystem
    or assemble/synchronize RAID components.


    In addition to automated potential destruction of evidence, human error poses
    another significant risk. People might accidentally copy or delete files; browse
    around the filesystem (and update last-accessed timestamps); or mistakenly choose
    the wrong device, resulting in a destructive action.


    Write blockers were designed to protect against unwanted data modification on
    storage media. Requiring the use of write blockers in a forensic lab''s standard
    processes and procedures demonstrates due diligence. It is best practice for handling
    storage media as evidence in a digital


    Forensically sound acquisition also deals with data completeness and preserving
    integrity.


    Planning and Preparation 93'
