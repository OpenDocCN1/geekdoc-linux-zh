- img_proc: true
  md: 'Once the examination work is complete, the cleanup process can take place.
    Each step is done in reverse:


    ```

    # mount clear

    # rmdir clear

    # cryptsetup close clear

    # losetup --detach /dev/loop0

    ```


    Note that this is a simplified example of a partition on a single non-bootable
    data disk. A LUKS-encrypted disk with a bootable OS may have an additional Logical
    Volume Manager (LVM) layer. These disks may have additional devices that appear
    in the /dev/mapper directory (root, swap, and on). You can access or mount each
    of these devices individually. During the cleanup process, you need to remove
    the partition devices with dmset before closing the LVM device with cryptsetup.


    For simplicity, the steps shown in this section were performed as a root user.
    To run the examples as a non-root user, losetup, cryptsetup, mount, and mount
    need to execute, as do any tools that access the /dev/mapper partition. Depending
    on the filesystem mounted, additional user options may be useful (uid-holmes for
    examples).


    Images encrypted with plain dm-crypt and loop-AES can also be decrypted using
    the cryptsetup tool. These follow a similar process as the preceding LUKS example.
    The cryptsetup open command needs to have either plain or loopaes specified using
    the --type flag. For example:


    ```

    # cryptsetup -v --readonly open --type plain /dev/loop0 clear

    Enter passphrase:

    Command successful.

    ```


    Using --type loopaes will also require a key file. Specifying --type luks is also
    possible, but unnecessary, because it''s the default.


    You''ll find more information about cryptsetup and LUKS at https://gitlab.com/cryptsetup/cryptsetup/wiki/home/.
    And you''ll find a compatible Windows implementation at https://github.com/ted-k/libvercrypt/


    # TrueCrypt and VeraCrypt


    After development of VeraCrypt was stopped, several forks emerged. The dominating
    fork at the moment is VeraCrypt. It offers backward compatibility as well as new
    extensions.


    The examples of VeraCrypt I will provide are a normal encrypted container and
    a hidden container. I used the standard command line version of VeraCrypt in conjunction
    with familiar tools to make the containers available for further analysis.'
