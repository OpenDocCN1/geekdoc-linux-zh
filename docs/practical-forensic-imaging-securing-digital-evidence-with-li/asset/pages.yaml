  md: '# 1


    # STORAGE MEDIA OVERVIEW


    ![](img/7fe0d6d164be3169c3098d32371b2eec_38_0.png)


    This chapter serves as an overview of PC bus systems, common mass storage media,
    physical connectors and interfaces, and the low-level protocol commands used to
    communicate with attached storage devices. It also provides the background for
    understanding the forensic acquisition of storage media described in the rest
    of the book.


    In general, mass storage technologies are grouped into three broad categories:
    magnetic media, non-volatile memory (flash), and optical media. Storage media
    can be built into a device or be removable. The device also contains the drive
    electronics needed to interface with the media. Storage devices are accessed by
    a system through an internal or external bus


    The chapter begins with overviews of these three storage technologies and touches
    on key points related to digital forensics. The final two sections describe how
    these storage devices attach to and communicate with a Linux system, and I discuss
    items of particular interest to a forensic examiner.'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'This chapter primarily focuses on modern PC architectures and components. Former
    legacy technologies might be mentioned but not covered in depth. I''ve also limited
    this overview to computer equipment used in small server environments and by individuals
    (employees, users, and so on) rather than covering large enterprise technology.
    Storage technologies in large enterprise environments are not always suited for
    traditional data forensic imaging; in some cases, the sheer volume of storage
    space makes traditional acquisition infeasible, and business-critical enterprise
    systems typically can''t be offline like smaller PC-based systems.


    # # Magnetic Storage Media


    Magnetic media is the oldest of the three basic storage technologies (preceded
    by paper and punch cards) and is the current leader in capacity. The two primary
    magnetic storage media types in today are hard disks and tapes; both provide high
    capacity and reliability for online storage and offline archival storage.


    > > The capacity race between magnetic disks and solid state drives (SSDs) is
    heating up. During the writing of this book, a 16TB SSD was announced and, when
    released, could be the largest disk.


    # ## Hard Disks


    Hard disks have consistently provided higher capacities than other media, such
    as SSD or optical. As of this writing, 10TB hard disks are available on the consumer
    market, and higher capacities are expected.


    Hard disks are built with rotating platters coated with magnetized material, as
    shown in Figure 1-1. Multiple platters are stacked on a spindle, and read/write
    heads on a movable arm (the actuator) can read/write data from/to the magnetic
    surface. Common hard disk form factors include 3.5 inch, 2.5 inch, and 1.8 inch.
    Because hard disks are mechanical devices, they are sensitive to shock, dropping,
    dust, moisture, and other environmental factors. Typical hard disk failures involve
    scratched platters, stuck or damaged heads, motor failure, and electronic circuitry.


    The real physical geometry (heads, platters, tracks, sectors per track) of the
    disk is abstracted from the computer and is accessible as a sequence of sectors
    using Logical Block Addresses (LBA). A sector is the smallest addressable disk
    unit for reading and writing data. Historically, the standard hard disk sector
    size was 512 bytes; however, modern disks have transitioned to 4K sector sizes.
    Most current drives provide drives with a native 4Kn sector size (known as 4Kn
    drives) are already on the market. Using 4Kn disks has performance advantages,
    and it''s likely they''ll overtake traditional 512-byte emulation. Refer to "Advanced
    Format 4Kn" on page 41 for more detail about 4Kn disk drives.'
