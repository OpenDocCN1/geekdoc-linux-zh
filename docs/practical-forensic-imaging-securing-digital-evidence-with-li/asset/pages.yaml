    USB interface


    The original USB protocol for the mass storage class of devices is known

    as Bulk-Only Transport (BOT), BOT is the most common USB

    transport protocol; however, with increasing disk speeds and the arrival

    of USB3, the BOT protocol is becoming a bottleneck and may be replaced

    by the USB Attached SCSI Protocol (UASP). Similar to AHCI for SATA,

    USB also has a defined standard for the host controller interface. The

    Extensible Host Controller Interface (xHCI) replaces several older USB

    standards (in particular, OHCI, UHCI, and EHCI).


