    # Secure an Image with Encryption


    An important but often neglected component of digital forensics is security. You
    should consider the information you acquire and extract during an investigation
    as sensitive and adequately protect its security.


    The loss of data confidentiality may have undesired consequences. For example,
    it may violate organizational policy requirements, jeopardize legal and regulatory
    compliance, raise victim privacy issues, and damage to the reputation of the investigating
    organization. Failing to adequately protect acquired evidence could result in
    damage to any of the parties involved, including the investigators and their employer,
    the victim, the defendant, and other participating parties. Leaked information
    could also interfere with compromise an ongoing investigation.


    This section focuses on methods for ensuring that information is protected, maintaining
    security during data transfer and storage (long- and short-term storage). Adding
    security to images increases the complexity and the time needed to encrypt and
    then decrypt images, but the examples you''ll see here attempt to keep this process
    simple and effective as possible. Basic symmetric encryption is used instead of
    more complex PKI or web-of-trust systems.


    In addition to the methods shown in this section, the ZIP archive format could
    be used for encryption. Newer versions with the ZIP64 extensions support port
    file sizes larger than 4GB. ZIP has the advantage of high compatibility with other
    platforms as Windows.


    # GPG Encryption


    Using symmetric encryption, you can easily encrypt disk images for protection
    during network transfer or storage. GNU Privacy Guard (GPG) encryption provides
    a free implementation of the OpenPGP standard defined by RFC-4880. It''s an alternative
    to the traditional PGP encryption created by Phil Zimmermann in the early 1990s.


    It''s useful to start the agent when you''re using GPG. (The agent is started
    automatically when using gpg2.) This is typically done at login with the following
    command:


    ```

    $ eval $(gpg-agent --daemon)

    ```'
