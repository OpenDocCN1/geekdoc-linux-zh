  md: '# FOREWORD


    Practical Forensic Imaging is much needed, and comes at a most opportune time.
    In recent years, preservation of digital evidence has become crucial in corporate
    governance, regulatory compliance, criminal and civil actions, and military operations.
    This trend is not geographically constrained but applies across the majority of
    continents, including developing countries.


    Savvy organizations preserve countless systems when handling human resource complaints,
    policy violations, and termination. Some organizations preserve data proactively,
    particularly for regulatory compliance purposes. This book provides scalable solutions
    that can be implemented across an enterprise for reasonable cost.


    Most criminal cases involve digital evidence, and responsibility to preserve the
    data is increasingly falling on small law enforcement agencies with limited resources
    or training. Practical Forensic Imaging is an invaluable resource for such agencies,
    delivering practical solutions to their everyday problems.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'Civil matters can involve large quantities of data spread across many data
    sources, including computers, servers, removable media, and backup tapes. Efficient
    and effective methods are crucial in such circumstances, and this book satisfies
    these requirements as well.


    Given the increasing importance of preserving digital evidence in a multitude
    of contexts, it is critical to use proper preservation processes. Weaknesses in
    the preservation process can create problems in all phases of a digital investigation,
    whereas evidence has been preserved using forensically sound methods and tools
    provides the foundation to build a solid case.


    Furthermore, the growing need to preserve digital evidence increases the demand
    for tools that are dependable, affordable, and adaptable to different environments
    and use cases.


    Practical Forensic Imaging addresses these requirements by concentrating open
    source technology. Open source tools have these advantages: high transparency,
    low cost, and potential for adaptability. Transparency enables others to evaluate
    the reliability of open source tools more thoroughly. In addition to block test
    using known datasets, the source code can be reviewed.


    Reducing the cost of forensic preservation is important for agencies with limited
    resources and for organizations that have to deal with large quantities of data.


    Being able to adapt open source tools to the needs of a specific environment is
    a major benefit. Some organizations integrate open source tools and preservation
    tools into automated processes within their enterprise and forensic laboratory,
    while others deploy the same tools on portable systems for use in field.


    There is a steep learning curve associated with all digital forensic processes
    and tools, particularly open source tools. Bruce Nickel''s extensive experience
    and knowledge is evident in the impressive clarity of the technical material in
    this book, making it accessible to novices while interesting to experts.


    Starting with the theory and core requirements of forensic imaging, this book
    proceeds to delve into the technical aspects of acquiring forensic images using
    open source tools. The use of SquashFS is simple but quite clever and novel, providing
    a practical open source solution to a core aspect of forensic imaging. The book
    closes with discussion of the important steps of managing forensic images and
    preparing them for forensic examination.


    Practical Forensic Imaging is an indispensable reference for anyone who is responsible
    for preserving digital evidence, including corporations, law enforcement, and
    counter-terrorism organizations.


    Eogan Casey, PhD

    Professor in Cybercrime and Digital Investigations

    School of Law, Criminal Sciences and Public Administration

    University of Lausanne, Switzerland

    August 2016'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# INTRODUCTION


    Welcome to Practical Forensic Imaging: Securing Digital Evidence with Linux Tools.
    This book covers a variety of command line techniques for acquiring and managing
    disk images for digital evidence. Acquiring disk images is the first step in preserving
    digital forensic evidence in preparation for postmortem examination and analysis.


    # Why I Wrote This Book


    Many digital forensics books are available on the market today. But the importance
    of forensic acquisition and evidence preservation tends to receive minimal attention.
    Often, the topic is only briefly covered in smaller chapters or subsections of
    a larger book. I thought that the topic of acquisition and evidence preservation
    was large enough to warrant its own book, and this book addresses this gap in
    the literature.


    Another motivating factor to write this book was my desire to give back to the
    community in some way. After working professionally in a digital forensics lab
    for more than a decade and regularly using open source tools'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'for various tasks (in addition to other commercial tools), I wanted to provide

    an additional resource for my colleagues and other professionals.


    A third motivating factor was the increasing importance of preserving

    nsic evidence in the private sector. Investigating misconduct, fraud,

    malware, cyber attacks, and other abuse is more common across pre-

    rivate industry. But emphasis on the steps needed to acquire and pre-

    serve evidence is often lacking. Law enforcement agencies require properly

    acquired and preserved evidence to prosecute criminals. Cases involving

    ecovery might require the sound acquisition and preservation of disk

    images. Large organizations with internal teams managing human resources

    disputes, policy violations, and whistle-blowing incidents can also benefit

    from following accepted procedures for preserving digital

    devidence.


    # How This Book Is Different


    The book is a technical procedural guide. It explains the use of Linux as a

    platform for performing computer forensics, in particular, forensic image

    acquisition and evidence preservation of storage media. I include examples

    that demonstrate well-known forensic methods using free or open source

    computer forensic tools for acquiring a wide range of target media.


    Unlike Forensic books covering a broad range of application and

    OS analysis topics, this book focuses on a single specific area within-

    puter forensics: forensic acquisition, also known as forensic imaging, of storage

    media. This includes the preparation, acquisition, preservation, and man-

    agement of digital evidence from various types of storage media. The sound

    acquisition of storage media is precisely what this process does "forensic."


    In addition to covering open source tools, this book includes examples

    of several proprietary command line tools that are free to use but not open

    source.


    I discuss some newer hardware topics that have not yet been incorpor-

    ated into other forensic books. For example, NVME and SATA Express,

    4K-native sector drives, Hybrid SSDs, SAS, USB/3, Thunderbolt, and

    more. Some of these are straightforward to manage in a digital forensics

    context; or others are more challenging.


    I introduce a new forensic technique that uses the SquashFS-

    pressed filesystem as a system and practical forensic evidence container.

    With this book, I provide the fsimage shell script, which can preserve evi-

    do SquashFS forensic containers.


    # Why Use the Command Line?


    Why is a book based on the command line even or relevant today?

    The computer command line has been around since the teletype days of

    t1960s, making it more than half a century old. In computing, although'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'age is sometimes viewed as a sign of obsolescence, it can also be a sign of
    maturity and dependability, which is the case with the Linux/Unix command line.
    Even Microsoft has recognized the value and power of the command line by introducing
    and promoting PowerShell as an alter- to the aging DOS prompt.


    There are many reasons why the command line has retained its popularity and continues
    to be relevant for the topics I discuss in this book. Here are some examples:


    +   - Easier scripting and automation possibilities: A GUI interface is designed
    for human use, whereas the command line can be used by either human or machine.
    This makes the command line particularly useful for scripting and automating work.

    - Better understanding of how things work under the hood: Graphical tools are
    often simply friends to command line tools. Learning command line helps you understand
    what is going on under the hood when you''re using the GUI frontend.

    - Flexibility and efficiency: When you execute certain tasks on the command line,
    you have more flexibility, power, and control. For example, piping and redirection
    allow you to combine multiple steps into a single command line.

    - Unix philosophy: The traditional Unix philosophy is to create simple tools that
    do one job well, whereas large programs pack rich and complex functionality into
    one large monolithic.

    - Remote access: Command line activity is secure and easy to perform remotely
    via ssh. In some cases, remote shell access is your only choice, especially when
    you are working with virtual or cloud-based servers or systems located in other
    cities or countries.

    - Headless servers: On Unix and Linux servers an incident has occurred, the command
    line might be your only option, because a GUI might not have been installed.

    - Embedded systems: The increasing popularity of embedded Unix and Linux systems,
    such as Raspberry Pi, Beagleboard, or other Internet-of-Things devices, might
    only have a command line interface available.

    - Knowledge investment: Command line tools do not change over time compared to
    GUI tools. If you invest time learning to use a command line tool, you won''t
    need to relearn everything when the command is updated or new features are added.

    - Personal preference: Some people prefer the command line rather than a GUI and
    would use it if given the option.


    This book provides you with a command line guide for performing digital forensic
    acquisition for investigations and incident response activities. It does not cover
    GUI equivalent tools and frontends.'
  merge: -1
