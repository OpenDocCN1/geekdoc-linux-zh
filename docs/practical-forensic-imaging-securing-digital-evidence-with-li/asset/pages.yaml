  md: 'The table is piped into the dmset create command, specifying the name of the
    mapper device. After the device is created, you can use regular forensic tools
    to operate on it. The following example shows the Sleuth Kit fsstat command being
    used on the newly created device:


    ```

    # fsstat /dev/mapper/jbod

    FILE SYSTEM INFORMATION

    ----------------

    ```


    File System Type: Ext4

    Volume Name:

    Volume ID: cfd74d32abd105b18043840bfd2743b3

    ...


    When you need to remove the mapper device, remove it by using the dmset remove
    command, as follows:


    ```

    # dmset remove /dev/mapper/jbod

    ```


    See the dmset(8) manual page for more information about the different device mapper
    types uses. You can use device mappings for encryption, snapshots, RAID systems,
    and even simulating errors and failing devices (which is useful for testing the
    behavior of forensic tools).


    RAID-0 striped disks are created for performance, not redundancy. A group of disks
    in a RAID-0 configuration has the combined capacity of all the drives, and disk
    access is distributed across the array (performance increases as disks are added).


    If you know the offsets and chunk size of a striped RAID-0 array, the dmset tool
    can create a mapper device to represent the assembled array.


    In the following example, a RAID consisting of two striped disks is attached to
    the acquisition host. It is known that the subject RAID system has 2048 initial
    sectors containing metadata and that the chunk size is 128 sectors. You can assemble
    the RAID as follows:


    ```

    # dmset create striped --table ''0 117243904 striped 2 128 /dev/sda 2048 /dev/sdb
    2048''

    ```


    You can analyze this /dev/mapper device using regular filesystem forensic tools.
    An example using Sleuth Kit''s fls command on the newly created device here:


    ```

    # fls /dev/mapper/striped

    r/r 4-128-4: $AttrDef

    r/r 8-128-2: $BadClus

    r/r 8-128-1: $BadClus:$Bad

    ```


    Don''t forget to remove the device when the tasks are completed.'
