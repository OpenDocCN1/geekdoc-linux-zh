- img_proc: true
  md: 'Using various tools, you can operate on split images directly. Most Sleuth
    Kit commands will work with a set of split raw files when you specify the first
    file of the split image type.

    Recent versions of Sleuth Kit will automatically check for sets of split files:


    ```

    $ mms image.raw.000

    ```


    Earlier versions of Sleuth Kit may require that you specify a split image type:


    ```

    $ fls -o 63 -i split image.000 image.001 image.002

    ```


    To check whether a set of split files is recognized, the img_stat command will
    show the total bytes recognized, and for raw types, the byte offset ranges for
    each piece:


    ```

    $ img_stat image.raw.000

    IMAGE FILE INFORMATION

    ------------------------------------------------------------

    Image Type: raw

    Size in bytes: 2003828736

    ```


    Split Information:

    image.raw.000 (0 to 16777215)

    image.raw.001 (16777216 to 33554431)

    image.raw.002 (33554432 to 50331647)

    image.raw.003 (50331648 to 67108863)

    image.raw.004 (67108864 to 83886079)


    An alternative method for determining whether split files are supported is to
    run the command or tool with strace -e open and see if it opens each of the split
    file pieces.

    Splitting files and working with a set of split files are useful, but sometimes
    you need to reassemble them into a single image. This is shown in the next section.


    # Reassemble a Split Image


    Reassembling split forensic formats is generally not needed, because tools that
    are compatible with a particular forensic format (EWF, SMART, or AFF) shouldshould
    support split files.'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'Because header or meta information is contained in a raw image, reassembly
    is simply a matter of concatenating the set of image fragments into a single image.
    Doing this carefully should be a two-step process, as shown here:


    ```

    $ ls -1 image.raw.*

    image.raw.000

    image.raw.001

    image.raw.002

    image.raw.003

    ...

    ```


    $ cat image.raw.* > image.raw


    The -1 flag will list the files recognized by the shell-globbing pattern. Be sure
    to confirm that this is a complete and ordered list before using it to concatenate
    the files into a single image. If split pieces are missing or the file order is
    wrong, the assembled parts will not create the correct image.

    If you''ve received a stack of DVDs, each containing a fragment of raw image,
    you can reassemble them as follows:


    ```

    $ cat /dvd/image.gz.00 > image.raw.gz

    $ cat /dvd/image.gz.01 >> image.raw.gz

    $ cat /dvd/image.gz.02 >> image.raw.gz

    $ cat /dvd/image.gz.03 >> image.raw.gz

    ...

    ```


    Here, DVDs are repeatedly inserted and mounted on /dvd, and split parts are added
    until the image is restored. Note that > in the initial cat command creates the
    image file, and >> in the subsequent commands append the data (not overwriting
    it). After all parts have been appended to the destination file, the cryptographic
    hash of the uncompressed image should match the one taken during acquisition.

    You can also uncompress and assemble a set of split files from compressed image
    by piping all the split files into zcat and redirecting out to a file:


    $ cat image.raw.* | zcat > image.raw

    nA useful method provided by AFFlib allows for the virtual reassembly of a set
    of fragments using a FUSE filesystem. The affuse tool can present a set of split
    files as a fully assembled raw image file, as follows:


    ```

    $ ls

    image.raw.000 image.raw.011 image.raw.022 image.raw.033 image.raw.044

    image.raw.001 image.raw.012 image.raw.023 image.raw.034 image.raw.045

    ...

    ```'
  merge: -1
  pgno: 223
- img_proc: true
  md: '```

    # affuse image.raw.000 /mnt

    # ls -l /mnt

    total 0

    -r--r--r-- 1 root 801120640 1970-01-01 01:00 image.raw.000.raw

    ```


    Here, a directory full of raw files is represented as a single disk image and
    is found in the /mnt virtual filesystem. You can directly operate on this raw
    file using forensic tools.


    # Verify the Integrity of a Forensic Image


    Verifying the cryptographic hash of an image is fundamental to performing digital
    forensics, and it''s the basis of preserving digital evidence. This section provides
    examples of verifying an image''s cryptographic hashes and signatures.


    Verifying the preservation of evidence involves confirming that a current cryptographic
    hash of an image is identical to a hash taken at an earlier point in time. You
    can use hashing to verify a successful operation on a disk or image (acquisition,
    conversion, transfer, backup, and so on). You can also use it to verify that a
    disk or image has not been tampered over a longer period of time (months or years).


    The requirements for hashing (procedures and algorithms) depend on the legal jurisdiction
    where they are used and on the organizational policies governing a forensic lab.
    Thus, no hashing recommendations are provided here.


    # Verify the Hash Taken During Acquisition


    After acquiring a disk, you need to validate the acquisition hash, it''s a simple
    (possibly time-consuming) task of piping the contents of the disk into a cryptographic
    hashing program. Using a different program to validate a disk''s hash provides
    an independent verification at the tool level. For example:


    ```

    # img_stat_image.E01

    IMAGE FILE INFORMATION


    ----------------------

    Image Type:          ewf


    Size of data bytes: 200382736

    MDS hash of data:    9749f1561dac9ae85acoe08f4e4272e

    # dd if=/dev/sdj | md5sum

    39137280 records out

    9749f1561dac9ae85acoe08f4e4272e -

    200382736 bytes (2.0 GB) copied, 126.639 s, 15.8 MB/s

    ```'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'Here, the img_stat output indicates the MD5 acquisition hash recorded by EnCase
    imaging tool. A second tool, regular dd, is then used to recalculate the hash
    from the raw disk device. In this example, the two MD5 hashes match, confirming
    that the evidence integrity has been preserved.


    # Recalculate the Hash of a Forensic Image


    Each of the forensic formats and the dd-based forensic tools can record or log
    a hash value of a disk image. To validate the recorded hash, you can recalculate
    the disk image''s hash. In the following example, the hash was recorded during
    acquisition with dc3dd and stored in the hashlog.txt. The hash can be verified
    as follows:


    ```

    # grep "md5" hashlog.txt

    5de68597f8ad9f20600a453101ffc57 md5

    # md5sum image.raw

    5de68597f8ad9f20600a453101ffc57 image.raw

    ```


    The hashes match, confirming that the evidence file and the hash log are consistent
    and thus indicating that the evidence integrity has been preserved.

    The following example validates the image stored in the metadata of the EnCase
    format. In this example, a dedicated tool, ewferify, is used to validate the hash:


    ```

    # ewferify.Ex0

    ewferify 20160424

    ```


    Verify started at: May 14, 2016 14:47:32

    This could take a while.

    ...


    MD5 hash stored in file:

    5de68597f8ad9f20600a453101ffc57

    MD5 hash calculated over data:

    5de68597f8ad9f20600a453101ffc57


    ewferify: SUCCESS


    Here, the recalculated hash matches, confirming the consistency of the EWF image
    file. This tool will automatically validate the hash of a set of split files in
    the EnCase forensic format.

    The affinfo tool performs similar validity checking for AFF files. In this example,
    the SHA1 hash is validated:


    ```

    $ affinfo -5 image.aff

    image.aff is A AFF file

    ```


    ...

    Validating SHA1 hash codes.

    computed hash: 9871 0FB5 531E 2ED0 47A7 5BE4 747E 68C1 BDB0

    stored hash: 9871 0FB5 531E 2ED0 47A7 5BE4 747E 68C1 BDB0 MATCH'
