- img_proc: true
  md: '# Media with Physical Read-Only Modes


    Some storage media have a write-protect mechanism that can be useful in a forensic
    context. For example, most tapes have a sliding switch or tab that instructs the
    tape drive to treat them as read-only, as shown on the left of Figure 4-5. On
    the LTO-5 tape (bottom left), a closed tab indicates it is write protected; on
    the DAT160 tape (top left), an open tab indicates it is protected.


    SD memory cards have a lock switch that write protects the memory card, as shown
    on the right of Figure 4-5.


    ![](img/7fe0d6d164be3169c3098d32371b2eec_127_0.png)


    Figure 4-5: Write-protect tabs on tapes and SD cards


    Older USB thumb drives may have a write-protect switch. Some very old IDE hard
    drives have a jumper that you can set to make the drive electronics treat the
    drive as read-only.


    CD-ROMs, DVDs, and Blu-ray discs do not need a writer blocker, because they are
    read-only by default. The simple act of accessing a rewritable disc will not make
    modifications to timestamps or data on the disc; changes to these optical media
    must be explicitly burned to the disc.


    # Closing Thoughts


    In this chapter, you learned how to set up basic auditing, activity logging, and
    task management. I covered topics such as naming conversions and scalable directory
    structures, as well as various challenges with image sizes, drive capacity planning,
    and performance and environmental issues. Finally, this chapter discussed the
    crucial component of forensic write blocking. You are now ready to attach a subject
    drive to the acquisition host in preparation for executing the forensic acquisition
    process.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# 5


    # ATTACHING SUBJECT MEDIA TO AN ACQUISITION HOST


    ![](img/7fe0d6d164be3169c3098d32371b2eec_128_0.png)


    This chapter discusses the physical attachment of subject storage media to an
    examination host, identification of the subject device on the system, and querying
    the device firmware for information. You’ll also learn about methods for removing
    HPA and DCO, unlocking ATA passwords, and decrypting self-encrypting drives. The
    chapter ends with several special storage topics. Let’s start by examining the
    subject PC hardware.


    # Examine Subject PC Hardware


    When a PC or notebook is seized in the field or delivered to a forensic lab for
    examination, more than just the internal disks can be examined. Included in the
    examination should be a complete review of the PC hardware configuration, BIOS
    settings, hardware clock, and so on.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'The scope of this book covers “dead” disk acquisition, that is, drives and
    PCs that are already powered off. Depending on the organization, a triage process
    will exist for arriving at a crime or incident scene with live, running machines.
    This triage process may involve taking photographs of screens, using mouse jigglers
    to prevent password-protected screensavers from activating, or running memory-dumping
    tools. First responder triage of live PCs is outside the scope of this book.


    # Physical PC Examination and Disk Removal


    Before you unplug any drive cables or unscrew any drives from the drive bays,
    take photographs of the subject PC to document the hardware configuration, the
    number of disks it contains, and how the disks are cabled to the motherboard.


    +   Remove disks with care, especially if they’re in old PCs that may not have
    been opened for years. The top of each drive can be photographed to capture the
    serial number and other information on the label. For each disk, note the cable
    location on the motherboard. If a motherboard has multiple SATA ports, note port
    each disk was using.


    Open optical drives to confirm they don’t contain any disks. Most optical drives
    have a pinhole that can manually release the drive door with powering on the drive.


    Examine the PCI slots for PCI SATA Express or PCI NVMe drives. If a motherboard
    has an M.2 or mSATA slot, for SSD circuit boards.


    # Subject PC Hardware Review


    After removing all the drives from the subject PC enclosure, power on the subject
    motherboard and note the BIOS configuration, clock, boot order, potential BIOS
    logs, version, and so forth.


    If you require further information about the subject PC, examine it using a forensic
    CD that contains various hardware analysis tools, such as Ishlw, dmdecode, biodecode,
    Ispice, and so on.


    You might be able to retrieve some vendor-specific information using vendor-tools—for
    example, vpddcode for IBM and Lenovo hardware or ownership for Compaq hardware
    tags.


    Examine and document any additional hardware components as well, such as memory
    modules or PCI cards.


    # Attach Subject Disk to an Acquisition Host


    After physically attaching the subject drive to the examiner workstation (using
    a write-blocking mechanism), you need to identify the block device associated
    with the subject drive. To reliably identify the subject drive on the acquisition
    host, list the storage media devices, confirm any unique identifiers associated
    with the physical drive, and determine the corresponding device file in /dev.
    This section examines these steps in more detail.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# View Acquisition Host Hardware


    Understanding the examination host''s hardware configuration is useful for performance
    tuning, capacity planning, maintaining a stable platform, troubleshooting, isolating
    faults, and reducing the risk of human error. In this section, you''ll see examples
    of tools you can use for listing and viewing PC hardware.


    Using the lshw tool, you can generate a quick overview of the examiner workstation
    hardware:


    ```

    # lshw -businfo

    ```


    The bus describes the device specific addresses, as pci@domain:busslot.function,
    scsi@host.channel.target.lun, and usb@bus:device.

    You can also use lshw to specifically look for an attached device type. For example:


    | Bus info | Device | Description |

    | --- | --- | --- |

    | usb@2:5.2 | scsi22 | storage | Forensic SATA/IDE Bridge |


    ```

    # lshw -businfo -class disk

    ```


    | Bus info | Device | Description |

    | --- | --- | --- |

    | scsi@22:0.0.0 | /dev/sdp | disk | 120GB SSD 850 |


    Note that scsi22 links to scsi22:.0.0.0, which links to /dev/sdp. Identifying
    the Linux device file for an attached physical drive is discussed further in the
    following sections.

    If the drive has been externally attached, it''s likely connected via USB, Thunderbolt,
    FireWire, orSATA (and in rare cases, possibly Fibre Channel).

    If the drive has been internally attached, it''s likely connected via SATA cable,
    a PCI Express slot, an M.2 interface, or SAS cable (or possibly legacy interfaces,
    as parallel SCSI or IDE).

    You can list the devices attached to the PCI bus (including parallel PCI and PCI
    Express) using the lspci tool:


    ```

    # lspci

    ```


    The PCI bus categorizes devices by class (see http://pci-ids.ucw.cz/ for more
    information about PCI IDs and device classes). Devices matching the Mass storage
    controller class (class ID 01) are of interest because they manage attached storage
    media.'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'Newer versions of lspci (as of pciutils 3.30) can list the PCI bus by device
    class, which can be useful to isolate specific hardware of interest. The following
    command lists all SATA mass storage controller (class ID 01, subclass ID 06) devices:


    ```

    # lspci -d ::0106

    ```


    This command enumerates all the SCSI, IDE, RAID, ATA, SAS, and NVME mass storage
    controller devices on a system:


    ```

    # for i in 00 01 04 05 06 07 08; do lspci -d ::01$; done

    ```


    Another PCI class that can manage connected storage media is the serial bus controller
    class (class ID 0C). The following command lists all devices with the USB serial
    bus controller class (class ID 0C, subclass ID 03):


    ```

    # lspci -d ::0C03

    ```


    This command enumerates all FireWire, USB, and Fibre Channel controllers on the
    examiner host:


    ```

    # for i in 00 03 04; do lsusb -d ::0C$; done

    ```


    If the subject drive is attached via USB, it won''t appear on the PCI bus. You
    can list USB devices separately using lsusb. Without options, the command generates
    a list of all attached USB devices:


    ```

    # lsusb

    ```


    +   * Bus 001 Device 005: ID 0951:1665 Kingston Technology

    * Bus 001 Device 002: ID 8007:0024 Intel Corp. Integrated Rate Matching Hub

    * Bus 001 Device 001: ID 1d6b:0002 Linux Foundation 2.0 root hub


    Here a USB thumb drive is attached to USB bus 1 and assigned a USB ID of 5. Running
    lsusb -v will provide more detailed output about the USB device.


    The preceding tools and examples provide an overview of the storage media controllers
    and the hardware attached to an examiner workstation. The lshw(1), lspci(8), and
    lsusb(8) manual pages explain additional parameters and features, which you can
    use to view more detail about the hardware.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Identify the Subject Drive


    Having an understanding of the examiner workstation hardware, especially the available
    bus systems and controllers, will help you locate where a subject disk is attached.
    The next step is to positively confirm the identity of the subject drive using
    some distinct information, such as a serial number, unique model number, or other
    unique property.


    You can use multiple approaches to identify the subject device. If the subject
    disk is attached via the USB bus and with the lusb tool, you can retrieve more
    information by specifying the subject disk''s vendor:productID, as shown here:


    ```

    # lusb -vd 0781:5583

    ```


    Bus 004 Device Device 002: ID 0781:5583 SanDisk Corp.


    | idVendor | 0x0781 SanDisk Corp. |

    | idProduct | 0x5583 |

    | bcdDevice | 1.00 |

    | iManufacturer | 1 SanDisk |

    | iProduct | 2 Ultra Fit |

    | iSerial | 3 AC530001200627113025 |


    ```

    wspeedsSupported 0x00e0

    Device can operate at Full Speed (12Mbps)

    Device can operate at High Speed (480Mbps)

    Device can operate at SuperSpeed (5Gbps)

    ```


    From this output, you can use the unique information (serial number and so on)
    about the device to confirm the identity of the attached device as the subject
    drive. If the serial or other unique properties match the physically attached
    drive, you''ve identified the correct.


    Nearly all drives are accessible via SCSI commands (directly attached NVME drives
    are not a exception). To query for an attached storage device, you can use the
    lscsi tool. It supports a number of transport layer protocols, including SATA,
    USB, SAS, FireWire, SCSI, Fibre Channel, and more. Lscsi is also useful for linking
    kernel device paths with device files in /dev.


    ```

    # lscsi -v

    [6:0:0:0] disk INTEL SSDSA2CW30 0302 /dev/sda

    dir: /sys/bus/scsi/devices/6:0:0:0 [/sys/devices/pci0000:00:1f.0/001f.2/ata7/

    host6/target6:0:0:6:0:0]

