  md: '# Apple Target Disk Mode


    TDM allows Apple computers with OpenBoot firmware or newer firmware to boot into
    a state where the Mac system appears as an external disk enclosure and the internal
    disks are available as SCSI target devices. Earlier TDM implementations used the
    FireWire bus but have moved to Thunderbolt. You activate this mode by holding
    down the T key while powering on the Apple computer.


    A Linux machine without a Thunderbolt adapter can use FireWire to achieve the
    same result with an adapter. Figure 5-4 shows a photo of a Thunderbolt-to-FireWire
    adapter.


    ![](img/7fe0d6d164be3169c3098d32371b2eec_164_0.png)


