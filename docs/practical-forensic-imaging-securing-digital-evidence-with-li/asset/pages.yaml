  md: 'Disk devices can be attached to a PC system through various bus systems and
    bridges. Performance can be increased by attaching the drive as possible to the
    CPU and memory. Today, the closest device can get to the CPU and memory is through
    dedicated lanes of the PCI express 3.0 using the NVME interface (RAM disks are
    faster and more efficient, but they are created by the OS and are not non-volatile
    storage devices). An NVME device can be directly attached to the CPU using a southbridge
    chipset or any traditional disk protocol overhead, such as ATA or SCSI.


    # Bridging, Tunneling, and Pass-Through


    ATA and SCSI are the two most common protocols for interacting with storage media.
    The commands can be sent over a variety of physical layers or transport layers,
    even tunneled or encapsulated within other protocols. This complexity is hidden
    from the user, and attached devices can simply be accessed through standard block
    devices that the Linux kernel makes.


    To illustrate, consider a SATA hard disk plugged into a stand-alone docking station,
    which is plugged into an external port of a USB3 PCI express installed in a PC.
    The communication between the dock is a lower-layer SATA protocol, using SATA
    Frame Information Structures (FIS) packets. The communication between the dock
    and the USB3 card is a lower-layer USB protocol, using BOT or USAP. The communication
    between the USB3 card and the PC is a lower-layer PCI express protocol, using
    PCIe Transaction Layer Packets (TLP) and Data Link Layer Packets (DLLP). Finally,
    the disk is accessed across all these bridges using the SCSI command protocol.
    In this example, multiple physical and link layers are used to connect the disk.
    To the user, the lower protocols are hidden or abstracted from view.


    > FIS are part of the SATA protocol. PCI Express has its own set of protocols,
    which includes TLP and DLLP.


    For each of the physical buses, a device called a PHY (for physical) facilitates
    communication between devices connected to a bus (the PHY on bus work like two
    modems communicating over a WAN cable). The PHY converts the digital ones and
    zeros into compliant electrical signals expected for that bus. After the PHY has
    taken care of the physical, a link layer protocol manages the stream of bits/bytes
    that is being transferred back and forth on the bus. This link layer organizes
    the data stream into frames or discrete packets of information that upper layers
    can process.


    There are physical and link layer descriptions for USB, PCIe, Thunderbolt, SAS,
    SATA, Fibre Channel, and so on. Typically, standards exist that allow generic
    OS drivers to use the physical hardware in a device-independent way. For example,
    USB adapters are defined by the xHCI standard, SATA'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'adapters are defined by the AHCI standard, NVME devices are defined by the
    NVMHCI standard (now simply called the NVME standard), and so on. Compliance with
    these standards allows hardware to be supported without the need for additional
    proprietary drivers.


    While ATA/ATAPI and SCSI are distinct sets, they both support some degree of tunneling
    and pass-through of each other''s commands. ATA uses the ATAPI interface to encapsulate
    SCSI commands for communication with devices, such as optical drives, tape drives,
    and other devices that understand SCSI commands for injecting media and other
    commands not found in the ATA protocol. SCSI supports ATA pass-through, which
    allows ATA commands to be sent over the SCSI protocol. SAT (SCSI-ATA Translation)
    creates a bilateral translation between SCSI and ATA commands where the commands
    interact with storage media. This translation is implemented as a Linux kernel
    API within the libatary. (The libata, provides a number of features for interfacing
    with ATA controllers and drivers.)


    Bridges play an important role in forensic acquisition because they''re the basis
    for implementing hardware write blockers. A hardware blocker is typically a bridge
    capable of intercepting ATA commands sent to the disk, preventing commands from
    modifying sectors on a disk.


    # Special Topics


    This section covers a number of special topics related to mass storage and digital
    forensics. Some areas, such as UASP and SSHD, are briefly commented on their relevance
    to digital forensics. Other areas, such as DCO, HPA, and NVME drives, are introduced
    here and discussed in detail later in the book.


    # DCO and HPA Drive Areas


    As the ATA/ATAPI standards evolved, certain features were created to benefit system
    vendors. The Host Protected Area (HPA) was introduced in the ATA/ATAPI-4 standard
    and allowed system vendors to reserve partitions of the disk for use outside the
    normal OS. For example, the HPA can be used to store persistent data, system recovery
    data, hibernation data, and so on. Access to this data is controlled by the system
    firmware rather than the installed OS. The Device Configuration Overlay (DCO)
    feature was introduced in the ATA/ATAPI-6 standard and provided the ability to
    control reported disk features and capacity. This allowed system vendors to ship
    disks from multiple manufacturers while maintaining identical numbers of user-accessible
    sectors and features across the disks. This facilitated easier support and drive
    replacement. Both the HPA and DCO can coexist; however, the DCO must be created
    first, followed by the HPA.


    The HPA and DCO have been misused by criminals and malicious actors to hide files
    and malware code. I describe how to detect and remove the HPA and DCO, revealing
    sectors hidden from normal user'
