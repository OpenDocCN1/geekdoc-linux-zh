    # Serial Attached SCSI and Fibre Channel


    The parallel SCSI interface has largely disappeared in both consumer and enterprise
    markets. SATA has replaced it in the consumer market, and Serial Attached SCSI
    (SAS) and Fibre Channel (FC) have replaced it in the enterprise market. The physical
    connector on the SAS interface, shown in Figure 1-13, allows both SAS and SATA
    disks to be attached and accessed on a SAS backplane. The physical connector on
    SAS disk drives is slightly different from that on SATA disks, and various fan-out
    connectors are available for attaching multiple disks to the host bus adapter.
    The current speed of SAS-3 disks is 12Gbps, twice that of SATA-3. SAS-4 will provide
    speeds of 22.5Gbps.


    ![](img/7fe0d6d164be3169c3098d32371b2eec_52_1.png)


    Figure 1-13: SAS disk interface'
