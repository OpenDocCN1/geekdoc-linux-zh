    to provide a compact overview of the Bitlocker container.

    Both dislocker and libdecrypt can be given a byte offset for the start of the
    Bitlocker-encrypted volume. But this is unnecessary when working with image volumes
    of partitions/devices without partitions. In this example, an acquired image has
    a partition table, and the Bitlockerencrypted volume (in bytes) must be calculated.


