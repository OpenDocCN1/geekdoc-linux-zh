    # ATA Password Security and Self-Encrypting Drives


    This section covers the standard security features implemented by the disk vendors.
    These features include drive locking, password protection, self-encrypting drives,
    and other security mechanisms. Although some of the features discussed here are
    not widely used, they are still important to understand in a professional forensic
    lab setting.


    Password recovery techniques are not described in detail here. The examples demonstrate
    how to attack password-protected media to an acquisition host in preparation for
    imaging. It is assumed that passwords are already known.


    Methods of acquiring passwords are beyond the scope of this book, but recovery
    techniques may include the following:


    +   - Brute force, exhaustively attempting multiple passwords until the one is
    found.


    +   - Finding passwords hidden or stored in an accessible location.


    +   - Knowledge of password reuse across different accounts or devices. Recovery
    from one location provides access to all.


    +   - Depending on the jurisdiction, a person may be legally compelled to provide
    passwords.


    +   - The password may be volunteered by a friendly or cooperative owner (the
    victim perhaps) or a cooperating accomplice.


    +   - Enterprise IT environments may have key escrow or backups in place.'
