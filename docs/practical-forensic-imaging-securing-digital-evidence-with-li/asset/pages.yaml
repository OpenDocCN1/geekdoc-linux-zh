  md: 'The head is positioned at the second file on the tape (file 1 after file 0).
    The block offset and file offset are useful when you''re forensically acquiring
    individual files from a tape.

    Using mt, you can rewind tapes and take them offline (eject them):


    ```

    # mt -f /dev/nst0 status

    ```


    When a tape device is attached to a Linux system, a number of corresponding devices
    are created.


    ```

    # ls -1 /dev/*st0*

    /dev/nst0

    /dev/nst0a

    /dev/nst0l

    /dev/nst0m

    /dev/sto

    /dev/sto0a

    /dev/sto0l

    /dev/sto0m

    ```


    The st* devices auto-rewind the tape after each command (which is not always desired),
    and the nst* devices are the nonrewinding devices. The a, l and m devices represent
    the same device but with different characteristics (block size, compression).
    When performing a forensic acquisition, you should use the nst* devices (without
    an additional a, l, or m character).'
