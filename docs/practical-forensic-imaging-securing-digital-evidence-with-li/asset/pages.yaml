    # Terminal Recorders


    In some cases, it might be useful to show the work done in the terminal, complete
    with command output (stdout), error messages (stderr), and other messages or activity
    visible in a terminal session. Several tools exist to capture activity and even
    provide playback of the session.


    The most well-known tool is script. In this example, script is started and the
    output appended to a file with timing data for replay. After running script, you
    can execute any normal shell commands, and they’ll be saved for later viewing.


    ```

    $ script -a tscript.timing script.output

    ```


    Script started, file is script.output


    When the recorded session is finished, enter exit or press CTRL-D. You can view
    the recording using the scriptreplay command as follows:


    ```

    $ scriptreplay -mi tscript.timing script.output

    ```


    ...session plays back here]...


    Common issues that make this method challenging are the handling of control characters
    and events such as terminal resizing. Other TTY recorders and sniffers, such as
    tytrec and termrec, are available with similar functionality and features.


    Terminal multiplexers, such as tmux and GNU screen, also pro-vide some level of
    logging that can be useful in certain situations. With screen, you can set up
    logging for a detached session from a session'
