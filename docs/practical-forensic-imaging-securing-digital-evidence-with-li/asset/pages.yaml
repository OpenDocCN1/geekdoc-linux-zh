  md: "This example demonstrates symmetric encryption without signing. You can also\
    \ use GPG public and private keys to encrypt, decrypt, and sign images. The integrity\
    \ is verified by comparing the hash of the GPG-encrypted image with the hash of\
    \ the raw image, as follows:\n\n```\n$ gpg -dv image.raw.gpg | md5sum\ngpg: AES\
    \ encrypted data\nEnter passphrase: \ngpg: encrypted with 1 passphrase\ngpg: original\
    \ file name='image.raw'\n5de685978ad9f2060045310f2fc57\n$ md5sum image.raw\n5de685978ad9f2060045310f2fc57\
    \  image.raw\n```\n\nWhen you're decrypting an image, you need to do some capacity\
    \ planning. After decryption, two copies of the image will exist (one or both\
    \ will be compressed).\nA GPG-encrypted file is not seekable, so you cannot operate\
    \ on its contents with forensic analysis tools.\n\n# OpenSSL Encryption\n\nOther\
    \ cryptographic systems can also provide security for disk images. The OpenSSL\
    \ toolkit (http://www.openssl.org/) provides a number of algorithms you can use\
