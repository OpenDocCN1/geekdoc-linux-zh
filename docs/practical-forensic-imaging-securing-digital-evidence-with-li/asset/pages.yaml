    # VM Images


    With the increasing performance of home computers, hardware virtualization in
    most modern CPUs, and the availability of inexpensive or free virtualization software,
    there is an increased need to analyze the contents of VM images. In some cases,
    you might find many VM images on used PCs. This section focuses on accessing common
    VM image file types as QCOW2, VDI, VMDK, and VHD.


    # QEMU QCOW2


    The QCOW2 format is a common VM image type found on Linux and by the QEMU emulator.
    In this session, I''ll make a QCOW2 image available as a block device and safely
    mount it for browsing.

    libq-utils package (written by Joachim Metz, author of ewflib) contains the qwininfo
    and qcowmount tools. You can use both tools in the same way as you used the ewinfo
    and ewmount tools in previous examples. But the following example shows an alternative
    method using the qemu-img command, the nbd kernel module, and the qemu-nbd tool.
    This method operates in the kernel and saves a few steps because you don''t need
    to use kparts.


    Given a *.qcow2 file, the qemu-img command can provide a summary of the file:


    ```

    # qemu-img info image.qcow2

    image: image.qcow2

    format: qcow2

    virtual size: 5.0G (5368709120 bytes)

    disk size: 141M

    cluster_size: 65536

    Format specific information:

    compat: 1.1

    lazy refcounts: false

    refcount bits: 16

    corrupt: false

    ```


    To access a QCOW2 image in a raw image representation with nbd, you need to load
    the nbd kernel module:


    ```

    # modprobe nbd

    # dmesg | grep nbd

    [16771.003241] nbd: registered device at major 64

    ```'
