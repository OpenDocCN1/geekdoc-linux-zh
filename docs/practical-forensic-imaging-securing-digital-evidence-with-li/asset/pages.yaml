    | Slot | Start | End | Length | Description |

    |---|---|---|---|---||

    | 04: | 00 | 000202048 | 002050047 | 000204800 | |

    | 05: | 01 | 000205048 | 002582527 | 000532480 | EFI system partition |

    | 06: | 02 | 002582528 | 003606527 | 000102400 | |


    ...


    ```

    # blkls -o 2048 lenovo.raw > slack.04

    # blkls -o 2050048 lenovo.raw > slack.05

    # blkls -o 2582528 lenovo.raw > slack.06

    # blkls -o 3868672 lenovo.raw > slack.08

    ```


    The slack space for each recognized filesystem is saved to a file. The blkls command
    -s flag extracts all slack space (and only slack space). It is important to understand
    that slack space does not refer to unallocated blocks or sectors. Slack space
    is the unused area found within allocated blocks and sectors of a filesystem.


    # Extract Filesystem Unallocated Blocks


    This example will gather all unallocated blocks from filesystems on an acquired
    image. Unallocated blocks are filesystem specific, so you need to perform this
    operation separately on each recognized filesystem.


    Here, the mmls command is again used to determine the offsets of each filesystems,
    and the blkls command is used to extract unallocated blocks:


    ```

    # blkls -o 2048 lenovo.raw > unalloc.04

    # blkls -o 2050048 lenovo.raw > unalloc.05

    # blkls -o 2582528 lenovo.raw > unalloc.06

    # blkls -o 3868672 lenovo.raw > unalloc.08

    ```


    The correct blkls flag for extracting unallocated blocks is -A, but because it''s
    the default behavior, you can omit it.

    You can also perform the inverse action of extracting all (and only) allocated
    blocks using the blkls -a command.


    # Manual Extraction Using Offsets


    In certain situations, you might use a hex editor to browse, search, or manually
    analyze the contents of a disk or acquired image. The hex editor may provide a
    byte offset, a sector offset, or both.


    This example uses the console-based hexd tool to analyze a disk:


    ```

    # hexdit -s /dev/sda

    ```'
