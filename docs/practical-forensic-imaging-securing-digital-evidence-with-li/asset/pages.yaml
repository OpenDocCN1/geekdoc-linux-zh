    # Commands, Protocols, and Bridges


    The communication between storage devices and computer systems has some conceptual
    similarities to LAN/WAN layered networking.^3 The communication between storage
    devices and computer systems can be similarly organized into several layers of
    abstraction. There is a physical layer consisting of cables, wires, and electrical
    signals. Above that, there is a link layer whose digital bits and bytes are transmitted
    in an ordered manner using frames or link packets. On top of the link layer, protocols
    and commands are exchanged between a sender and receiver to request and receive
    data. In previous sections, I described the physical connections and disk interfaces.
    Here, I''ll describe the higher-layer command sets for ATA, SCSI, and NVME. Figure
    1-27 puts the layers of abstraction into better perspective.


