    # Drive Service Area Access


    Hard drives need to store information such as SMART logs, ATA passwords, bad sector
    lists, firmware, and other persistent information. This information is typically
    stored on the disk platters in user-inaccessible sectors (also the system area
    (also known as the service area, negative sectors, or maintenance sectors)). Access
    to this area is done through proprietary vendors, which are usually not public.


    There is no common systematic approach to access a disk system. Each drive manufacturer
    implements system areas differently, there are no industry standards, and there
    are few publicly available tools. Special commercial tools exist, such as Ace
    Laboratory''s PC-3000 (http://www.avelaboratory.com/catalog/) or Atola Insight
    Forensic (http://www.atola.com/products/insight-supported-drives.html), which
