    hashes on the rest of the disk are still good; the sectors with mismatched hashes
    have not been forensically preserved. Content (blocks, files, portions of, and
    so on) residing on a hash-mismatched sector range can be excluded from the presented
    evidence at a later stage. If two cryptographic hashes of a full image are match,
    you can assume that all the hashes match also.


    The cryptographic hashes of forensic images preserve the integrity of collected
    evidence. However, the hash values are not protected against malicious or accidental
    modification. Confirming the integrity of the calculated hashes can be preserved
    using cryptographic signing and time-stamping. Confirming the validity of signatures
    and timestamps is shown in the next section.


