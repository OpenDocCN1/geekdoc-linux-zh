- img_proc: true
  md: 'How much information should be embedded into filenames and directory names?
    When is it more sensible to have a corresponding description text file with additional
    information? How should the corresponding file be associated with an image? Consider
    the following examples of representations of the same incident.


    An example of information embedded into filenames looks like this:


    ```

    case42.txt

    image6.case42.raw

    image6.case42.txt

    mmls.image6.case42.txt

    fls.part1.image6.case42.txt

    ```


    An example of that same information embedded into a directory structure looks
    like this:


    +   /.case42/case.txt

    ./case42/image6/image.raw

    ./case42/image6/mmls.raw.txt

    ./case42/image6/mmls/part1/fls.txt


    For manually written notes, further descriptions, caveats, issues, and other random
    commands within a certain context, storing the information in simple notes.txt
    or readme.txt files within working directories. They can provide reminders, hints,
    or warnings for you or other examiners to read at a later date.


    When you''re noting web URLs that might pose a risk if opened, replace http with
    hxxp to prevent others from accidentally clicking them. Such links might take
    you to malware, personal sites monitored by a suspect with tracking bugs, or other
    content that should not be accessed without understanding the consequences.


    # Scalable Examination Directory Structure


    Each incident, case, or investigation should have a single unique directory (for
    example, case42). All collected evidence, images, and analysis work should be
    contained within a hierarchy under that root directory. Having investigations
    scale, a well-planned directory structure is practical when multiple forensic
    examiners are working on the same incident and sharing the directory structure.
    Be prepared to reorganize the directory structure if an incident grows in complexity.
    If a large number of files are being created for individual analysis, consider
    having an export directory (similar to EnCase).'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'Examinations often scale unexpectedly, and a forensic examination that starts
    with a single disk under suspicion might expand into a larger examination involving
    multiple PCs with many disks. For example, someone reports strange or suspicious
    behavior of a PC or employee. A single disk is seized for examination. Preliminary
    examination finds a USB stick is also involved. It is found and examined, and
    a second PC is linked to the incident. That PC has two internal hard disks and
    DVD burner. Further search reveals a box of disks full of data hidden in a closet.
    It turns out that an external USB hard disk and spare notebook are also in the
    incident. The collected evidence has grown from a single hard disk to 16 storage
    media items. This hypothetical incident is not uncommon in large organizations.
    When preparing for an examination, expanded coverage should be anticipated. The
    naming convention should be designed to scale to the size of an investigation
    groups.


    Some PCs are used by multiple people, and some people use multiple PCs. Notebooks
    are not necessarily bound to a physical location. Removable media can be shared
    and attached to multiple PCs and notebooks. Over long periods of time, PC hardware
    will change, offices may change, departments will experience staff turnover, and
    organizational restructuring may occur. Be sure to design file and directory names
    to accommodate these changes.


    As an examination progresses, the number of output grows as more collected data
    is analyzed and output is produced. A good practice is to create a directory structure
    to separate the files and organize the output of the examination. As filenames,
    the directory name should indicate the contents without revealing confidential
    information. Creating a separate directory for each disk or image analyzed segregates
    files and allows an investigation to scale up.


    The smallest examination usually consists of a single disk. A slightly larger
    examination might consist of a PC containing multiple disks; consider the following
    example directory structure:


    ```

    HDD1

    HDD2

    HDD3

    ```


    As another example, consider the examination of an entire workplace that consists
    of a desktop PC (possibly with multiple disks), a notebook, USB drives, multiple
    CD-ROMs and DVDs, and an external disk pack. A convenient directory structure
    would organize each file of storage media where the command output files are stored,
    allowing an examination to easily further. Consider a larger investigation consisting
    of multiple workplaces, across multiple office buildings, spread out across multiple
    countries. In large global organizations, such investigations can occur; therefore,
    having a well-thought naming convention will maintain the organization of the
    examination process.'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'It’s advantageous to rely on a directory structure to separate command output
    from different disks, PCs, users, and locations. As a result, you won’t need to
