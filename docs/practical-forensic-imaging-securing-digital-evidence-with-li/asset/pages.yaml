    # SCSI Commands


    SCSI commands from a host bus adapter to a disk follow a client/server model.
    The host bus adapter (HBA) is the client, initiator, and the disk is the server,
    or target. The initiator sends commands (possibly together with data). SCSI was
    originally designed for use with a variety of devices, including scanners, tapes,
    printers, and so on, not just hard disks. Furthermore, SCSI is a rich command
    set. Commands are sent from the initiator (HBA) to the target (drive) using a
    command descriptor block (CDB), which is a block of data containing the command
    and its parameters. The target receives the CDB, carries out the request, and
    returns a response. The interaction is somewhat similar to a UDP-based request/response
    in a TCP/IP client/server architecture.


    SCSI commands read and write blocks of data from/to disk, control hardware (executing
    CDs or changing tapes), report status and diagnostic information, and so on. These
    are generally hidden from the end user, but various utilities are available to
    issue SCSI commands from user space. It is even possible to submit arbitrary commands
    from the Linux command line using the sg3-utils software package. For example,
    the following command submits a low-level SCSI command to read the first sector
    of a SCSI disk:


    ```

    # sg_raw -i 512 /dev/sda 08 00 00 00 01 00

    SCSI Status: Good

    ```


    ```

    Received 512 bytes of data:

    00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

    10 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

    1a0 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

    1b0 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

    1c0 02 ee ff ff ff 01 00 00 ee ff ff ff ff ff 00

    1d0 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

    1e0 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

    1f0 00 00 00 00 00 00 00 00 00 00 00 05 55 aa ...................U.

    ```


    In this example sg_raw is given a CDB to be sent to /dev/sda, a SAS disk. The
    first byte, 0x08, specifies the 6-byte long SCSI READ command. The subsequent
    zeros specify the LUN and starting sector. The 0x01 specifies'
