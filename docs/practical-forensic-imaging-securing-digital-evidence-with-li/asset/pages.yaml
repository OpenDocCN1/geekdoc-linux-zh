  md: '# Legacy Non-Volatile Memory


    Many legacy memory cards became obsolete as the market lost interest in their
    maximum capacity or proprietary interfaces. Some examples include Sony Memory
    Sticks, Panasonic P2 cards, SmartMedia cards, and other PCM-CIA/PCcard media.
    Typically, these memory cards attach to a Linux system as block devices with a
    linear sequence of sectors, and you can image them using the same techniques as
    for other memory cards (if a physical reader is available).


    # Optical Storage Media


    Optical disc storage media in use today includes CD-ROMs, DVD-ROMs, and Blu-ray
    discs. The different types of optical media vary in their physical and chemical
    properties. Their visible differences are shown in Figure 1-7.


    ![](img/7fe0d6d164be3169c3098d32371b2eec_46_0.png)


    Figure 1-7: Top to bottom: DVD-ROM, Blu-ray, CD-ROM


    Optical discs are usually read-only, write-once, or read-writable. Professionally
    mastered discs are stamped rather than burned. Although they''re slowly becoming
    obsolete, writable optical discs are still a common source of digital evidence.
    Many forensic labs use them for transfer and storage of forensic images.


    An optical disc contains a single spiral track with a sequence of pits and lands
    on a reflective surface, which can be read by a laser and interpreted as data
    bits. Data is written to the surface using a laser to burn points on the surface,
    which affects the reflectivity and causes the burned areas to be interpreted as
    data bits. This sequence of bits is separated into sectors, which after encoding
    and error correction contain 2048 bytes of user-accessible data.'
