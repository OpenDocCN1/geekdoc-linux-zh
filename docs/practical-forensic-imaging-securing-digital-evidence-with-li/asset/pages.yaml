    # Data Recovery Tools


    Several disk block recovery tools are worth mentioning because of their robust
    error handling and aggressive recovery methods. Although these tools were not
    written with forensics in mind, which are useful in situations in which other
    forensic tools failed.

    The ddsqrescue (by Antonio Diaz Diaz) was designed to recover blocks from damaged
    disks. Unlike the dd family of tools, it has a multi-phase recovery algorithm,
    and you can run it against disk multiple times to fill gaps in the image. The
    algorithm includes reading parts of the disk backward to increase the number of
    recovered sectors and forming various operations over multiple passes.

    A completed ddsqrescue operation results in statistics that describe your recovery
    success:


    ```

    # ddsqrescue /dev/sda image.raw image.log

