    proceedings and the presentation of evidence can take months or years, it is useful
    to confirm that evidence has not been modified during that time. This can be viewed
    as somewhat of a digital chain of custody.

    The next sections demonstrate the use of hash windows, signing with PGP and S/MIME,
    and RFC-3161 timestamping to preserve digital evidence. Let''s begin with some
    examples of basic cryptographic hashing.


