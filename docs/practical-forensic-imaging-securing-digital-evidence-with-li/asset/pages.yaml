  md: '# Target Audience and Prerequisites


    I wrote this book with a specific audience in mind. I had some expectations and
    made some assumptions when writing many sections.


    # Who Should Read This Book?


    This book primarily benefits two groups of people. First, it helps experienced
    forensic investigators advance their Linux command line skills for performing
    forensic acquisition work. Second, it''s useful for experienced Unix and Linux
    administrators who want to learn digital forensic acquisition techniques.


    The book targets the growing number of forensic practitioners coming from incident
    response teams; computer forensic investigators within large organizations; forensic
    and e-discovery technicians from legal, audit, and consulting firms; and traditional
    forensic practitioners from law enforcement agencies.


    By the end of this book, you should have a comprehensive picture of the command
    line tool landscape available for performing forensic acquisition of storage media
    and the management of forensic images.


    # Prerequisite Knowledge


    This book assumes that you have a working knowledge of OSes, in particular, the
    Unix and Linux shell environment. The examples in this book use Bash extensively.
    You should also have an understanding of how to run command line programs as well
    as how to do basic piping and redirecting between programs.


    Additionally, you should have a basic understanding of digital forensics principles,
    including write-blocking technology, sector-by-sector acquisition, and preserving
    evidence integrity with cryptographic hashing. This foundational knowledge is
    assumed when the examples presented.


    # Preinstalled Platform and Software


    You should have access to a functioning Linux platform with the relevant tools
    already installed. The book doesn''t cover how to find, download, compile, or
    install tools. If you have a reasonably new machine (within a year of this book''s
    publication date) with a recent distribution of Linux, some of the tools are not
    part of standard Linux distributions but can easily be found on github or for
    them.


    # How the Book Is Organized


    Rather than a chronological list of steps, this book is intended to be more of
    a cookbook of tasks. However, the book follows a logical progression, from setting
    up a platform, planning and preparation, and acquisition to'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'post acquisition activities. In general, the book is designed as a reference,
    so you don''t need to read it from beginning to end. Certain sections assume some
    knowledge and understanding of prior sections, and appropriate cross-references
    to these sections are provided.


    +   - **Chapter 0** is a general introduction to digital forensics. I also cover
    the history and evolution of the field, mentioning significant events that have
    shaped its direction. I give special emphasis on the importance of standards needed
    to produce digital evidence that can be used in a court of law. The overall book
    strives to be international and independent of regional legal jurisdictions. This
    is important today, because more criminal investigations span country borders
    and involve multiple jurisdictions. Also, due to the increase in private sector
    forensics labs, the book will be useful for private forensics labs, especially
    in global firms.

    - **Chapter 1** provides a technical overview of mass storage device, interfaces,
    and the commands and protocols to access the media. It covers the technologies
    a typical forensic investigator I''ve made an effort to help you achieve clear
    understanding of the different storage media interfaces, protocol tunneling, bridging,
    and how storage media attach and interact with a host system.

    - **Chapter 2** provides an overview of Linux as a forensic acquisition platform.
    It briefly touches on the advantages and disadvantages of using Linux and open
    source software. It describes how the Linux kernel acknowledges new devices being
    attached to the system and how you can access those devices. The chapter presents
    an overview of Linux distributions and shell execution. It also explains the use
    of piping and redirection as an important concept throughout the book.

    - **Chapter 3** covers the various raw and forensic formats commonly used in the
    field. These formats are the digital “evidence bags” for acquired storage media.
    The chapter explains raw images; describes forensic formats, such as EnCase and
    FTK; and formats from the research community, such as AFF. It also introduces
    a simple forensic container, based on SquashFS, and a tool for managing it.

    - **Chapter 4** is a transitional point in the book, leaving the theoretical and
    entering more practical and procedural territory. It begins with examples of maintaining
    logs and audits trails and command data for use in forensic reports. It covers
    various planning and logistical issues frequently faced by forensic investigators.
    It ends with a section on setting up a forensically sound, white-blocked working
    environment to prepare for the acquisition process.

    - **Chapter 5** progresses with attaching a disk to the acquisition host and gathering
    data (ATA, SMART, and so on) about the disk. At this stage, media accessibility
    restrictions, such as HPA and DCO, are removed, locked and self-encrypted disks
    are made accessible.'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'chapter also covers several special topics, such as Apple Target Disk Mode.
    At this point, the disk is prepared and ready for you to execute acquisition commands.


    +   **Chapter 6** executes the acquisition, demonstrating multiple forms of forensic
    acquisition using open source as well as proprietary tools. Emphasis is placed
    on preserving evidence during acquisition using hashes, signatures, and timestamp
    services services The chapter also covers handling various scenarios with bad
    blocks and errors, as well as remote acquisition over a network. Special topics
    include the acquisition of tapes and RAID systems.


    +   **Chapter 7** focuses on managing acquired disk images. This chapter assumes
    the forensic image has been successfully made, and typical post acquisition tasks
    are described. These tasks include compressing, splitting, and encrypting images;
    converting between forensic formats; cloning or duplicating images; transferring
    images to other parties; and preparing images for long-term storage. The chapter
    ends with section on data detail.


    +   **Chapter 8** covers a number of special tasks that you can post acquisition
    for examination. These tasks include accessing images via loop devices, accessing
    virtual machines, and accessing OS-encrypted images (BitLocker, FileVault, TrueCrypt/VeraCrypt,
    and so on). The chapter also covers accessing virtual disk containers. These techniques
    enable allow you to safely browse the filesystem using file managers and other
    programs.


    +   **Chapter 9** partly enters the forensic realm and demonstrates extracting
    subsets of data from images. It identifies and extracting partitions (including
    deleted partitions), extracting-partition gaps, extracting slack space, and extracting
    previously hidden areas of the disk (DCO and HPA). The chapter shows several examples
    of piecewise data extraction, including the extraction of individual sectors and
    blocks.


    Each chapter might describe several different tools used to perform the same task.
    Often, multiple tools will be available to perform the same task, and depending
    on the situation, one tool might be more useful than another. In such cases, I
    discuss the advantages and disadvantages of each tool.


    Each section in a chapter roughly follows the same structure. The title provides
    a high-level description of the topic. An introductory paragraph describes the
    motivation for the section and explains why the particular task is useful for
    investigations, digital forensics, or incident response. In many cases, the motivation
    is driven by legal or industry-accepted standards. It is important to know and
    understand these standards, because they support the forensic soundness of the
    work being done. Where necessary, I provide references to the source code of tools,
    additional information, or other articles of interest.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Prior to introducing or demonstrating a new tool, I provide a paragraph that
    describes the function or purpose of the tool and its relevance to digital forensics.
    In some cases, the history of the tool might also be of interest to you, I include
    that as well.


    After a description of the task and tool(s), you will see one or more command
    line examples as well as the command output (displayed in blocks of monospaced
    or fixed-width font). A command might be repeated to show different variations
    or extended forms of use. Each command example is followed by a paragraph that
    describes the command being executed and explains the resulting output.


    A final paragraph might include potential gotchas, caves, risks, and common problems
    or mistakes you might encounter that are relevant to digital forensic investigations.


    # # The Scope of This Book


    This book focuses on the forensic acquisition of common storage media and the
    steps required to preserve evidence. Although some triage and analysis work is,
    in general, forensic analysis of application and OS data is considered the scope
    of this book.


    A number of other areas are also outside the scope of this book, including data
    acquisition from other areas than traditional storage media, for example, network
    forensic acquisition, memory acquisition from live systems, cloud data acquisition,
    and so on.


    In various places, I mention enterprise class storage media and legacy storage
    media, but I don''t provide practical examples. These are less commonly found
    in forensic lab settings. However, many of the methods will generally work with
    enterprise or legacy storage hardware.


    The acquisition of proprietary devices is also beyond the scope of this book.
    Acquiring the latest generation of mobile phones, tablets, or IoT devices might
    be possible with the tools and techniques shown in the book (if they behave as
    block devices in the Linux kernel), but I don''t explicitly cover such devices.


    # # Commands and Format


    Examples of code, commands, and command output are displayed in a monospaced or
    fixed-width font, similar to what you see in some places, irrelevant command output
    might be removed or replaced with an ellipsis (...), and when lines are too long
    for the book''s margins, which are wrapped and indented.


    Commands that you can run without root privilege use a prompt $. Privileged commands
    that typically need to be run as root are prefixed with #. For brevity, the use
    of sudo or other privilege escalation is not always shown. Some sections provide
    more information about running commands as a non-root user.'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'In the computer book industry, it is common practice to change the timestamps
    in blocks of code and command output to a point in the future after release, giving
    the contents a newer appearance. I felt that writing a book about preserving evidence
    integrity and manipulating the very evidence you see in the book (by forward dating
    timestamps) wasn’t appropriate. All the command output you see in this book reflects
    the actual output from the testing and research, including the original dates
    and timestamps. Aside from sniping out less relevant areas with ... and removing
    trailing blank lines, I left the command output unchanged.


    A bibliography is not provided at the end of the book. All references are included
    as footnotes at the bottom of the page where the source is referenced.


    The investigator’s or examiner’s workstation is referred to as the acquisition
    host or examination host. The disk and image that are undergoing acquisition are
    referred to as the subject disk, suspect disk, or evidence disk.


    A number of terms are used interchangeably throughout the book. Disk, drive, media,
    and storage are often used interchangeably when they’re used in a generic sense.
    Forensic investigator, examiner, and analyst are used throughout the book and
    refer to the person (you) using the examination host for various forensic tasks.
    Imaging, acquisition, and acquiring are used interchangeably, but the word copying
    is deliberately excluded to avoid confusion with regular copying outside the forensic
    context.'
  merge: -1
