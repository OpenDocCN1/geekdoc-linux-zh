- img_proc: true
  md: '# 7


    # FORENSIC IMAGE MANAGEMENT


    ![](img/7fe0d6d164be3169c3098d32371b2eec_214_0.png)


    This chapter covers various aspects of managing forensic image files after acquisition.
    Disk images are enormous compared to typical files on a disk, and moving, copying,
    and converting large image files can be cumbersome and time-consuming. You''ll
    learn a number of techniques for managing large image files to help


    overcome various challenges. These techniques include compressing and splitting
    files for easier handling, securing images with encryption, and converting images
    into formats. In addition, I describe procedures for read-only mounting of an
    image for safe local browsing and demonstrate forensic cloning (or disk duplication).
    I also discuss the secure, reliable storage and network transfer of large image
    files. The chapter ends with a description of secure wiping and disposal of images
    and files. I will begin with the topic of managing image compression.


    # Manage Image Compression


    Raw disk images are always the same size as the total number of sectors they contain.
    The number of files or amount of data on the drive is irrelevant and does not
    affect the size of an uncompressed raw image. With the'
  merge: -1
  pgno: 214
- img_proc: true
  md: 'current widespread use of multiterabyte disks, maneuvering images within time
    and disk capacity constraints can be a challenge. Even simply copying an image
    can take many hours to complete. You can reduce this problem somewhat by keeping
    images compressed.


    Compressing images in a forensic context involves sector-by-sector compression
    of the drive (as opposed to compressing each file on the disk). Drives with many
    gigabytes or terabytes of space that have never been written over the life of
    the drive will compress better, because much of the drive consists of untouched
    sectors filled with zeros. Well-used disks will not compress if most sectors on
    the drive have been allocated over the lifetime of the drive and still contain
    residual data. Data images with large numbers of audio and video files will compress
    poorly, because these files are already compressed with their own algorithms.


    It''s important to choose the most appropriate and efficient compression tool
    and technique. Some tools might have size limitations, for the original source
    file or the compression destination. Other tools may be inefficient or use temporary
    files during compression, causing exhaustion or creating disk space. To solve
    some of these problems when you are performing compression activity, you can use
    piping and redirection.


    One of the most useful features of working with a compressed forensic image is
    the ability to use forensic tools without having to decompress the entire image.
    But this is problematic with tools, they''re not able to seek within a compressed
    file. Seeking allows for random access to any point in a file. Forensic formats
    are designed to allow analysis programs on-the-fly, random access to compressed
    images. The popular forensic formats all support image compression, which usually
    occurs during acquisition, although not all tools compress by default.


    # Standard Linux Compression Tools


    Commonly used compression tools in the open source world today are gzip, zip,
    and bzip (version 1 or 2). The examples in this section use gzip, but you can
    use other compression tools as well. To attempt better compression at the expense
    of time and CPU cycles, you can adjust the level of compression.


    Given enough disk space, you can simply compress a disk image in place, like this:


    ```

    $ gzip image.raw

    ```


    This command creates the file image.raw.gz and deletes the original file on completion.
    Enough space needs to be available for the compressed and uncompressed files to
    coexist during the compression process. The same applies for uncompressing files
    using gunzip.'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'You can also compress images on the fly during acquisition using piping\and
    redirection. For example:


    ```

    # dcfld if=/dev/sde | gzip > image.raw.gz

    ```


    Here the input file is a raw disk device. Not specifying an output file

    of dcfld sends the image data stream to stdout, which is piped into gzip,

    which is finally redirected into a compressed file.

    The compressed file can be uncompressed to a raw image file, where you

    y can use forensic tools to directly operate on it. Alternatively, you can

    ipe an compressed stream into some programs using stdout and stdin.

    For example:


    ```

    $ zcat image.raw.gz | sha256sum

    1b5ab2c61ff8f292ca8840acf95f76fb9d3c1beb73e50697a4fbf42dd0

    ```


    Here zcat decompresses the image and pipes it into a program to pro-\uce a sha256
    cryptographic hash. It''s worth noting that the gzip file format

    contains additional metadata, such as a creation timestamp, original file-

    name, and other information. The hash of a gzip container (image.raw.gz)

    will be different each time it''s created, even though the hash of the com-

    pressed file inside will be the.


    # EnCase EWF Compressed Format


    The ewafquire tool provides flags to control compression during the acqui-

    sion. For example:


    ```

    # ewfacase -c bzip2 -f encase-v2 /dev/sdj

    ewfacase 20150126

    ```


    EWF file format: EnCase 7 (.Ex01)

    Compression method: bzip2

    Compression level: best

    MDS hash calculated over data: 9749f1561dac9ae85ac0e08f4e4272e

    ewfacquire: SUCCESS


    In this case, the -c flag can specify a compression algorithm together

    with a compression level. Here, the algorithm was bzip2 configured with

    the best possible compression level. Because only EWfv2 formats support

    bzip2, the format version encase-v2 was specified as a parameter. Note that

    ewftools needs to be compiled with bzip2 support.


    +   1. As of this writing, the most recent version of ewfacquire had bzip2 support
    temporarily

    dabled (see section 20160404 in the ChangeLog file of the libewf software package).


    Forensic Image Management 189'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# FTK SMART Compressed Format


    The command line ftkimager tool supports compressed images during acquisition,
    as the following example shows:


    ```

    # ftkimager --compress 9 --s01 /dev/sdj image

    AccessData FTK Imager v3.1.1 CLI (Aug 24 2012)

    Copyright 2006-2012 AccessData Corp., 384 South 400 West, Lindon, UT 84042

    All rights reserved.

    ```


    Creating image...

    Image creation complete.


    Here the --s01 flag sets the creation of a SMART ew-compressed image, and the
    --compress flag sets the highest compression level. You can use the --help flag
    to get more information about compression options for ftkimager.


    # AFFv3 Built-In Compression


    Although AFFv3 has been deprecated (http://forensicswiki.org/wiki/AFF) and the
    use of imaging is discouraged (http://forensicswiki.org/wiki/Image), image''s
    use of AFFv3 compression is mentioned here for illustration purposes.

    The following example demonstrates imaging a disk using imaging and specifying
    the LZMA compression algorithm (rather than the zip deflate):


    ```

    # lzma_compress --compression=9 /dev/sdj image.aff

    im->outfile=image.aff

    image.aff**************************************************** IMAGING REPORT ************************************

    Input:/dev/sdj

    Model: Nano S/N: 07A40C3C895171A

    Output file: image.aff

    Bytes read: 2,003,828,736

    Bytes written: 628,991,770

    ```


    raw image md5: 9749 F156 1DAC 9DAE 85AC E0E8 F4E4 272E

    raw image sha1: 9871 0FB5 53E1 F390 220D 47A7 5BE4 747E 6BC1 1DB0

    raw image sha256: 85B7 038 D60A 91F6 A0B6 9F65 B2C5 3B09 F7E7 94D4 639C 6F40 B3C4

    0B06 830D A7E5

    Free space remaining on capture drive: 527,524 MB


    The Sleuth Kit forensics software provides integrated support for AFF images.
    AFFv4 introduces the aff4image tool, which adds additional features. This can
    be found at https://github.com/google/aff4/'
