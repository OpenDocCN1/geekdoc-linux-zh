  md: '# 8


    # SPECIAL IMAGE ACCESS TOPICS


    ![](img/7fe0d6d164be3169c3098d32371b2eec_256_0.png)


    This chapter demonstrates techniques for getting information about disk image
    files and making them accessible as block devices and as mounted directories.
    You''ll learn to set up loop devices and create logical devices with device mapper
    tools. You''ll also explore methods to map or convert software-encrypted disk
    images, making them accessible by forensic tools. These methods are useful in
    situations in which the contents of an image cannot be accessed directly and a
    layer of active translation or decryption is needed. Examples of such images include
    encrypted filesystems, virtual machine (VM) images, and other image file formats
    that forensic tools do not directly support.


    Each section also includes examples of safely mounting (read-only) image files
    as regular filesystems on the forensic acquisition host. Then you can easily browse
    and access the filesystem using common programs, such as file managers, office
    suites, file viewers, media players, and so on.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Forensically Acquired Image Files


    The basis for the methods and examples you''ll see in this section is the Linux
    loop device (not to be confused with a loopback device, which is a network interface).
    A loop device is a pseudo device that can be associated with a regular file, making
    the file accessible as a block device in /dev.


    Linux systems typically create eight loop devices by default, which might not
    be enough for a forensic acquisition host, but you can increase number, either
    manually or automatically, up to boot. To create 32 loop devices during boot up,
    add max_loop=32 to the GRUB_CMDLINE_LINUX_DEFAULT line in /etc/default/grub; after
    reboot, 32 unused loop devices will be available. The fsimage script uses loop
    devices to mount SquashFS forensic evidence containers.


    This chapter will cover different VM from common VM systems like QEMU, VirtualBox,
    VMware, and Microsoft Virtual PC. I also describe access to encrypted filesystems,
    including Microsoft''s Bitocker, Apple''s FileVault, Linux LUKS, and VeraCrypt
    (a fork of TrueCrypt). But let''s begin with the simplest form of image: a raw
    disk image acquired using a dd-style tool.


    # Raw Image Files with Loop Devices


    The simplest demonstration of a loop device can be shown using a raw image file
    (possibly acquired from a dd command). The없이 command attaches and detaches loop
    devices from a Linux system. This example creates a block device for an image.raw
    file:


    ```

    # losetup --read-only --find --show image.raw

    /dev/loop0

    ```


    Here, the flags specify that the loop should be read-only (--read-only) and the
    next available loop device should be used (--show) and displayed on completion
    (--show). The filename specified (image.raw) will then become available as an
    attached block device.


    Running losetup without parameters displays the status of all configured loop
    offsets. Here we can see the one created:


    | losetup |

    | NAME | SIZELIMIT OFFSET AUTOCLEAR RO BACK-FILE |

    | /dev/loop0 | 0 0 0 1 /exam/image.raw


    The /dev/loop0 device now points to /exam/image.raw, and you can access it with
    any tools that operate on block devices. For example, here the Sleuth Kit command
    is to see the partition table on the image.raw file using the loop device:


    ```

    # mls /dev/loop0

    DOS Partition Table

    ```'
  merge: -1
  pgno: 257
