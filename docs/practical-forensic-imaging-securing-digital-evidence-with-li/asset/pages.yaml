    # Preserve Digital Evidence with Cryptography


    Preserving the integrity of evidence is fundamental to the digital forensics process.
    Integrity can be maintained using cryptographic hashes and further enhanced with
    cryptographic signatures by the technicians who perform the acquisition. The purpose
    of hashing or signing images is to'
