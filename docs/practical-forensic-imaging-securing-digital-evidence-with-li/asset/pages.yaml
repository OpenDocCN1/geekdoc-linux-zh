    Because Bitocker is the default filesystem encryption on the dominant OS, it''s
    worth providing a second example using a different software package. The libdecrypt
    package (written by Joachim Metz, the author of ewflib) also provides more libraries
    and tools to access previous Bitlocker images.

    The example shown is slightly more complex than the previous one, because it involves
    a notebook disk with a partition table in contrast to a USB drive without a partition
