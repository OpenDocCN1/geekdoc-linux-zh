    The encrypted loop device is opened with the --readonly flag. The verbose (-v)
    flag is also given to provide more information about the success of the decryption
    key. After a successful key has been entered, a new (decrypted) partition device
    will appear in the /dev/mapper directory and can be operated on using standard
    forensic tools. For example, the Sleuth Kit fsstat tool:


    ```

    # fsstat /dev/mapper/clear

