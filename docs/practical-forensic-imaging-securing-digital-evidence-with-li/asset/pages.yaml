  md: 'Extracting sectors hidden by a DCO is identical to the method shown here with
    the HPA. First use hdparm to expose the DCO-protected sectors, then extract them
    using dd or mmcat. This procedure does not need to be repeated with additional
    examples specifically demonstrating sectors from a DCO.


    # Other Piecewise Data Extraction


    In this final section, I describe various additional examples of piecewise data
    extraction. The contents of this section (in fact the contents of most of this
    chapter) blur together with forensic filesystem analysis, which is not the intended
    scope of the book. For this reason, the examples are slightly less descriptive.


    # Extract Filesystem Slack Space


    Slack space is a traditional digital forensics concept referring to allocated
    unused data at the end of disk sectors, filesystem blocks, or filesystems (RAM
    slack, file slack, and partition slack, respectively).

    To visualize slack space; imagine this book as a hard disk, where paragraphs are
    sectors, chapters are files, and the body of the text is the partition. Notice
    that paragraphs do not finish exactly at the end of a line, chapters do not finish
    exactly at the end of a page, and the end of the book might have a couple of additional
    blank pages. These empty spaces are the book’s "slack space." With storage media,
    if the OS or physical drive has not explicitly written zeros to these areas, they
    might still contain data from previously written files.

    Historically, extracting and analyzing slack space has been useful in forensic
    investigations. However, the value of slack space is beginning to decrease due
    to several factors:


    +   - SSDs using TRIM commands to zero unallocated blocks.

    - Modern OSEs are writing back zeros to unused portions of sectors and blocks.

    - Disks with native 4K sectors align with filesystem block size.

    - OSE create partitions and filesystems aligned to block boundaries.


    OSE partitions and filesystems aligned to block boundaries.

    As part of the forensic process, acquiring and analyzing potential slack areas
    are still diligent steps to complete.

    To extract all slack space on a given image, you can use the Sleuth Kit blkls
    command. Slack space is filesystem specific, so you must extract slack space on
    each filesystem separately (you can''t use the entire raw disk). In this example,
    the filesystem offsets of the acquired image are found with mls, and the slack
    space of each one is extracted:


    ```

    # mls lenovo.raw

    GUID Partition Table (EFI)

    Offset Sector: 0

    ```'
