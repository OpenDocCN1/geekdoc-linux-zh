    # Query the Subject Disk for Information


    After attaching the subject drive to the examiner workstation and positively

    identifying the correct Linux device to work with, you can gather additional

    meta information about the device. You can query the device directly for

    information about the drive, the firmware, SMART data, and other config-

    ration details.


    A number of tools are available to query information stored in the hard

    drive. Typically, you access this firmware information using lower-level

    ATA or SCSI interface commands, which interact directly with the drive

    elect.


    # Document Device Identification Details


    At this point, you should have a number of details and technical identifiers

    about the drive attached to the examiner host, including the following:


    +   * Vendor, make, and model

    * Serial number or WWN

    * Linux device name

    * PCI domain:bus.slot.function

    * PCI vendorID:deviceID

    * USB bus:device

    * USB vendorID:productID

    * SCSI host:channel:target:lun


    You can save this information for reporting purposes by redirecting the\various
    tool command output to text files.

    Document evidence for the use of a writer blocker. If you''re using a

    hardware write blocker, such as Tableau, query it and save the results:


    ```

    # tableau-parm /dev/sdc > write-blocked.txt

    ```'
