  md: 'malware, HTML pages with tracking bugs, macros in Office documents, or other
    executables and scripts that might execute on opening. Some examples are shown
    here:


    ```

    $ icat image.raw 68 > photo.jpg_

    $ icat image.raw 34 > customerlist.xls_

    $ icat image.raw 267 > super-updater57.exe_

    ```


    If an extracted file already ends with an underscore, add another one. An appended
    underscore makes obvious that a file has been extracted as evidence from a suspect
    drive.


    When you''re analyzing an extracted file, saving tool output, or making manual
    notes, create a file with the original name and append .txt to it. For example:


    ```

    $ exif photo.jpg > photo.jpg_txt

    $ vi customerlist.xls_txt

    $ objdump -x super-updater57.exe > super-updater57.exe_txt

    ```


    The _txt extension signifies that the file contains notes, tool output, and results
    of forensic analysis work extracted from the file. The filename is associated
    with the file originally extracted from the image. The text file may contain bookmarks
    and examiner annotations that can be searched. Unless it''s otherwise clear where
    an extracted file came (which disk, partition, and so on), it''s good practice
    to have such corresponding text files; they can also indicate why it was chosen
    for extraction.


    A file extension should always indicate the format of the content. For example:


    +   * .txt can be opened and read using a text editor.

    * .raw is a data dump (disk, memory, and so on).

    * .pcap is captured network traffic.

    * .db is a database (possibly a Sleuth Kit file list).

    * .sfs is a SquashFS evidence container.

    * .e01 and .aff are forensic formats.


    Each case, incident, or investigation will have an associated physical storage.
    Storage media will have a corresponding forensic image and associated output from
    various programs (hdpar, smartctl, and so on). Each forensic image will have associated
    output from various programs (mmls, fl, and so on), and each extracted file may
    have associated output from various programs (exif, objdump, and so on). A naming
    convention will help keep everything organized and allow the organizing system
    to scale the investigation data grows.'
