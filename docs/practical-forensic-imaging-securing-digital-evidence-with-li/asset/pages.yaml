  md: 'Some research has challenged views that a complete acquisition can be achieved
    given the restrictions and limitations of the ATA interface used to access the
    physical disk. A theoretically complete acquisition includes all sectors on magnetic
    disks and memory beneath the flash layer of SSDs and flash drives, and it now
    extends to the locked-down mobile devices that can''t be imaged with traditional
    block device methods. It is becoming increasingly difficult to achieve “complete”
    acquisition of all physical storage of a device. For mobile devices, the forensics
    community has already made the distinction between physical and logical acquisition,
    with the latter referring to the copying of files and data rather than the imaging
    of drive sectors.


    For the examples you''ll see in this book, *forensic completeness* is considered
    to be acquiring areas of a disk that can be reliably and repeatedly accessed with
    publicly available software tools through interface specifications. Areas of a
    disk that are accessible only through nonpublic vendor proprietary tools (in-house
    diagnostics, development tools, and so on) or using hardware disassembly (chip
    desoldering, head assembly replacement, disk platter removal, and so on) are not
    within the scope of this book.


    This has been brief introduction to the field of digital forensics. Chapter 1
    continues with an introduction to storage media technologies and the interfaces
    used to attach them to an acquisition host.


