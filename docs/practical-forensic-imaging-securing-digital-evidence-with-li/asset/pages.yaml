    # Optical Disc


    The different types of optical media vary in their physical and chemical properties;
    however, once you insert them into an attached optical drive, they have more similarities
    than differences. The three most common discs (DVD, CD-ROM, and Blu-ray) have
    a 2048-byte sector size and appear as a linear sequence of sectors (to a tape,
    but in a spiral). The primary difference is the density of the data bits (which
    is abstracted by the device hardware) and the disc capacity.


    Imaging data discs is straightforward and similar to imaging hard drives flash
    media. An example of an optical disc being imaged with dc3dd is here:


    ```

    $ dc3dd if=/dev/cdrom of=datacd.raw

    dc3dd 7.2.641 started at 2016-01-13 23:04:31 +0100

