    # # Manage Drive Failure and Errors


    Occasionally, a forensic lab receives a problematic hard disk to analyze.

    The disk might be old, damaged, or failing. It may have interface errors, platter

    read errors, head errors, motor resets, and other errors. In some cases, you

    ill acquire a partial forensic image of the drive. Depending on the disk

    size, the block size, and the number of unreadable sectors, imaging a bad

    disk could take several days.


    It''s important to understand that errors described refer to the

    drive hardware. They don''t refer to software errors such as corrupt file-systems,
    destroyed partition tables, and so on.


