  md: 'command is spelled correctly with only one n) unmount the filesystem, and rmdir
    removes the mount point directory. This is the traditional Unix way to mount and
    unmount a filesystem on a host system.


    When you no longer need the drive loop and partition mappings, you can remove
    them all by using the kpartx device (-d) flag and the name of the image file,
    like this:


    ```

    # kpartx -d image.raw

    loop deleted: /dev/loop0

