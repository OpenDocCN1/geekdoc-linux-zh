    has also outlined the concept of digital evidence bags.¹ Tools to perform acquisition
    into forensic formats are demonstrated in Chapter 6.


    # EnCase EWF


    Guidance Software, one of the oldest forensic software companies, produces its
    EnCase forensic software suite, which uses the Expert Witness Format (EWF). The
    EWF format supports metadata, compression, encryption, hashing, split files, and
    more. A reverse engineered, open source library and tools, libewf was created
    in 2006 by Joachim Metz and can be compiled into Sleuth Kit.


    # FTK SMART


    AccessData''s FTK SMART format is a direct competitor to EnCase EWF. It''s a proprietary
    format that also includes metadata, compression, encryption, hashing, split files,
    and more. The command line ftkimager tool (which is free not open source) is available
    from AccessData and is demonstrated in Chapters 6 and 7.


