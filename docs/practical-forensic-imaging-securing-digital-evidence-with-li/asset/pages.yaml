  md: 'From a forensics perspective, user data on the entire CD can be read. There
    is no equivalent to the EOD found on tapes or DCO/HPA (user-inaccessible areas
    of a hard disk) found on disks. There are filesystem-specific artifacts that might
    require special analysis to interpret.


    Forensic write blockers, which are forensic designed to prevent tampering and
    contaminating evidence on drives, are necessary for CD-ROMs, given their default
    read-only properties. The OS will not update timestamps or modify data on a CD
    by putting it into the CD drive and accessing it.


    CDs do have some unique identifiers that are useful in a forensic context. A Source
    Unique Identifier (SID) is stamped on the disc and contains information about
    the optical disc production facility that produced particular disc. This code
    begins with IFFI and is physically stamped on the inner area of the disc (which
    can be easily read with the human eye). The Recorder Identification Code (RID)
    is written to system sectors of a CD and links a burned CD to that it created.
    The RID is not easily accessible without specialized hardware.


    Other physical attributes, such as indicative of piracy and counterfeit copies,
    are outside the scope of this book, but you can access a guide from the International
    Federation of the Phonographic Industry (IFFI) at http://www.ippi.org/content/library/manual-of-guidance-chap3-english.pdf.


    # Digital Versatile Disc


    DVDs have different physical attributes from but are logically similar to CDs.
    A DVD has a single spiral track of bits split into 2048-byte sectors.


    DVDs can be single sided or double sided. They can also be single layer or double
    layer. Doubling a side or a layer effectively doubles the data capacity. They
    have similar standards as CDs but with some additions, discussed here: http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-382.pdf.
    DVD-Video, DVD-ROM, DVD-R, and DVD-RW correspond to their CD equivalents, but
    an additional DVD-RAM is also available. An alternative set of standards was created
    with DVD+R and DVD+RW, which have the same data capacities as " are incompatible
    (although most modern drives can read both).


    The most common filesystem for DVD drives is the Universal Disk Format (UDF),
    which is designed as a packet-writing replacement for OS9660.


    # Blue-ray Disc


    Blue-ray discs (BDs) use new physical manufacturing processes to increase the
    data capacity of the disc. BD is still similar to CD and DVD in that it uses the
    spiral track of data split into 2048-byte sectors.


    Its standards have close counterparts to CD and DVD and include BD-ROM (Read only),
    BD-R (Recordable), BD-RE (Rewritable), BD-XL (double capacity Rewritable).'
