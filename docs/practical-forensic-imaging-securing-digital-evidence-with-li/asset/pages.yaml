    # Interfaces and Physical Connectors


    In this section, I''ll provide an overview of common drive interfaces from the
    perspective of a forensic examiner. A forensic examiner working in a well-equipped
    laboratory can acquire and analyze storage media using a variety of device interfaces.


    A general trend in computing (especially with storage interfaces) is the shift
    from parallel and shared busses to serial-to-point connections. PATA/IDE, a once-popular
    parallel interface with two disks sharing a single cable, has been replaced by
    SATA, which has one disk on a serial. SCSI was a parallel bus that supported multiple
    disks and has now been replaced by SAS with individual serial connectors for each
    disk. The original PCI bus was parallel and shared by multiple interface cards
    has been replaced by PCI Express, a serial bus with dedicated lanes per interface
    (also used to attach SATA Express and NVM Express drives). The printer interface
    has been replaced by USB (a serial protocol, but using a shared bus). As transmission
    speeds increased, the timing of parallel interfaces became difficult to manage.
    Performing serialization/deserialization of data over dedicated lines enabled
    faster transmission speeds than managing the coordination of multiple data lines.


    # SATA ATA


    The most popular internal storage media interface in today is SATA. Inside PCs,
    most hard drives, SSDs, and optical drives connect to SATA interfaces on the motherboard
    or add-on host bus adapters. The serial architecture of SATA has replaced parallel
    ATA (PATA or IDE), which used to be the dominant consumer disk interface.


    The SATA standard is managed by The Serial ATA International Organization (http://www.sata-io.org/).
    Currently in revision 3, SATA provides speeds up to 6Gbps (revisions 1 and 2 speeds
    of 1.5Gbps and 3.0Gbps, respectively). In addition to the internal interface,
    an external'
