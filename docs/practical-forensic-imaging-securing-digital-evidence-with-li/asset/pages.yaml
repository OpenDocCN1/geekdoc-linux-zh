  md: '# Identify and Extract Inter-Partition Gaps


    In some cases, there may be gaps between partitions that were created accidentally
    due to adjacent partitions meeting on cylinder or block boundaries. There could
    also be intentional gaps created for hiding data. You can identify and recover
    these inter-partition gaps in the same way as you extract a partition. Use mmls
    to determine the size and sector offset of the gap, and then use dd or mmcat to
    extract it.


    The mmls output of a partition table is shown here. The disk contains two partitions,
    and there is a gap between them:


    ```

    # mmls /dev/sdb

    DOS Partition Table

    Offset Sector: 0

    Units are in 512-byte sectors

    ```


    | Slot | Start | End | Length | Description |

    |---|---|---|---||}{

    | 000: | 000000000 | 000000000 | 000000001 | Primary Table (#0) |

    | 001: | 000000000 | 000002047 | 000002048 | Unallocated |

    | 002: | 000:000 | 015626236 | 015624189 | Linux (ox83) |

    | 003: | 001562637 | 015626239 | 000000003 | Unallocated |

    | 004: | 000:001 | 001562640 | 003031249 | 014405010 | Linux (ox83) |


    In this example, the first partition ends on sector 15626236, but the adjacent
    partition starts on sector 15626240, indicating a three-sector gap between them.
    Although you can extract this inter-partition gap using dd, using mmcat is simpler:


    ```

    # mmcat /dev/sdb 3 > gap.raw

    # ls -l gap.raw

    -rw-r--r-- 1 root 1536 May 21 16:11 gap.raw

    ```


    The resulting file is three sectors in size with the gap between the two partitions.
    Larger gaps between partitions that contain partially overwritten, corrupted,
    or identifiable filesystem fragments can be analyzed with carving tools as foremost.


    The gap between the last partition and the end of a disk can also be of interest.
    It may contain artifacts such as content from previously overwritten partitions,
    backup copies of the GPT, or even malware attempting to hide segments of binary
    code.


    # Extract HPA and DCO Sector Ranges


    You have already learned how to identify and recover HPA and DCO restrictions.
    Once removed, these areas of the disk can be extracted for separate analysis.'
