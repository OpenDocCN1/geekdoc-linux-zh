    # Enable Access to Hidden Sectors


    Forensic literature includes handling the HPA and DCO as part of the imaging process.
    Indeed, imaging software has the capability to detect and remove these hidden
    areas at acquisition time. This book positions the detection and removal of the
    HPA/DCO as part of preparation process, not the actual imaging. There is no special
    technique to image these hidden areas once they''ve been made accessible. They
    are disk sectors protected by drive configuration parameters. It is a simple preparatory
    step to make them available for a subsequent imaging process. Removing the HPA
    or DCO modifies the drive’s configuration, but does not modify its contents.


    This section also covers drive maintenance sectors and service areas on a disk,
    but this is mentioned only briefly, because these areas are not easily accessible
    using common open source tools.


    # Remove a DCO


    The DCO was developed to allow PC system manufacturers to make different models
    appear to have the same features. Using DCO, certain features can be disabled,
    and the capacity of a drive (number of usable sectors) can be reduced to a vendor’s
    requirements. Identifying and removing the DCO is standard forensic practice when
    you’re analyzing a suspect drive.


    The DCO is a general configuration overlay, and multiple features can be overwritten.
    It does not only refer to the number of sectors on a drive. Two hard commands
    determine if a DCO exists and provide the number of real sectors available. The
    first command determines the drive has the DCO feature set enabled. In example,
    the current size of the disk is reported to be 474GB or 926773168 sectors (512-byte
    sector size) and the asterisk (*) to Device Configuration Overlay feature indicates
    it is active:


    ```

    # hdparm -I /dev/sd1

    /dev/sd1:

    ```


