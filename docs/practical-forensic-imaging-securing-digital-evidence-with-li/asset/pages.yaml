  md: 'afd (AFF Multiple File)

    afm (AFF with external metadata)

    affflib (All AFFLIB image formats (including beta versions))

    ewf (Expert Witness format (encase))


    In addition to these formats, this chapter introduces an ad hoc method using SquashFS
    as a practical forensic container for use with standard forensic tools.


    **NOTE** An important concept regarding forensic images is that they do not copy
    files; they copy disk sectors, from sector 0 to the last accessible sector on
    the disk. The raw image size will always equal the full disk size independent
    of the number of files residing on the disk''s filesystem.


    # # Raw Images


    Raw images are not a format per se but a chunk of raw data imaged from an evidence
    source. Raw images contain no additional metadata aside the information about
    the image file itself (name, size, timestamps, and other information in the image''s
    own inode).


    Extracting a raw image is technically straightforward: it is simply the transfer
    of a sequence of bytes from a source to a destination file. This is normally done
    without any transformation or translation.


    Disk block copying tools, such as dd and variants, are most commonly used to extract
    raw images. These are discussed in the following sections.


    # # Traditional dd


    To create raw images, the simplest tool available, as well as the oldest, is the
    original Unix dd utility. It was not designed for evidence collection, but its
    simple byte-by-byte transfer is useful for imaging disk devices, because it makes
    a complete low-level copy of individual sectors of a disk (preserving the filesystem
    structure, files, directories, and metadata). However, features such as error
    handling, hashing are inadequate or nonexistent; dd can be used when a better
    alternative is not available. The Computer Forensic Tool Testing (CFTT) Project
    has tested several dd versions. You''ll find the test results on the CFTT website
    at http://www.cft.nist.gov/disk_imaging.htm.


    The dd utility was created in the 1970s on UNIX systems for byte order conversion
    and block copying. It was initially developed to convert EBCDIC-encoded data from
    the mainframe world into ASCII encoding, which was preferable in the UNIX environment.
    The program simply performs a conversion or transformation, and then places the
    blocks of data from a source, the blocks in a specified destination (on another
    device or in a file). Modern versions of dd have enhancements that make it useful
    for performing forensic acquisition of data from devices, such as disks and tapes.'
