  md: '# Legacy Magnetic Storage


    There are many legacy magnetic storage types, especially among removable media.
    Floppy disquettes evolved over several generations before obsolete. A number of
    proprietary storage products, such as Jaz, Zip, Syquest, and so on, were popular
    on the market during the ''80s and ''90s. A large variety of magnetic tapes are
    no longer in use, for example, 4mm DAT, 8mm Exabyte, and QIC. The forensic acquisition
    of these storage types is beyond the scope of this book. However, if functioning
    hardware and interfaces are available, you can acquire the data on these older
    devices using the same techniques described in this book. If the Linux kernel
    recognizes the sector-based media and it''s made available as a block device,
    you can acquire it. If the Linux kernel recognizes tape devices as SCSI tape devices,
    you can access them using standard SCSI tape commands. For proprietary storage,
    kernel drivers or users tools might be available, which can provide you with access
    to legacy storage products.


    # Non-Volatile Memory


    Non-volatile memory, typically using NAND flash technology, is growing in popularity
    and replacing magnetic hard disks in situations where very large capacities are
    not needed.(NAND refers to transistors as a logical NAND gate.) This type of memory
    creates a new set of challenges for forensic investigators because it doesn''t
    exhibit the same low-level properties as generic disks.


    SSD and flash media are typically NAND-based storage and have no moving parts.
    Data is stored in an array of memory cells, and a layer of abstraction, the Flash
    Translation Layer (FTL), makes the drive as a linear sequence of sectors similar
    to a hard disk. Because non-volatile memory disks are implemented in circuitry
    and are not mechanical, they are silent, use less power, and do not suffer from
    the same risk damage as hard disks do. In terms of performance, they can randomly
    access and write data faster because there are no physical heads seeking to locations
    on a disk. (This also means there''s no performance advantage to defragment filesystems.)
    The memory in SSD/flash drives doesn''t have the same longevity as the magnetic
    particles in hard disks. Certain methods, such as wear leveling and over-provisioning,
    are used to prolong the life of SSD media. Wear leveling refers to the mechanism
    used to distribute reads and writes across the drive, ensuring blocks are evenly
    used during the lifetime of the drive. As blocks deteriorate or become unwritable,
    they are removed from use by the FTL and replaced with blocks from a pool of reserved
    (over-provisioned) blocks. These “retired” blocks can be read by removing (desoldering)
    the physical chips and reading the memory. Some forensic laboratories perform
    this process, sometimes called chip-off, for various flash-based storage.


    > 1. Jeff Hedlesley, "Advancements in SSD Forensics" (presentation, CEIC2014,
    Las Vegas, NV, May 19–22, 2014).'
