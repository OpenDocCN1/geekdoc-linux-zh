    ```


    Although sparse files use much less space, the full size is still reported as
    the file size. This can cause confusion when calculating the real available disk
    capacity. Sparse files are used by VM images and can become issue when extracted
    for analysis.


    You can also use sparse files as a method of compacting image files, but using
    forensic formats or SquashFS containers is preferred and recommended. Not all
    programs and utilities can handle sparse files correctly, and the files can become
    problematic when moving between systems and platforms. Some programs may expand
    sparse files when reading them.


    # Reported File and Image Sizes


    Reporting sizes is an important concept to grasp. When you''re working with forensic
    tools, size can refer to bytes, disk sectors, filesystems, or other units of measurement.
    The notation for bytes can be prefixed with a multiplier (such as kilobytes, megabytes,
    gigabytes, terabytes, and so on), and the multiplier can refer to multiples of
    1000 or 1024. Disk sectors could represent size editors of 512 bytes or 4096 bytes.
    The block size depends on the type of filesystem and the parameters used during
    creation. When you''re documenting sizes in a forensic context, it''s important
    to always include descriptive units.


    Many Linux tools support the -h flag to report file sizes in a human readable
    format. For example, you can use -lh, -df and du -h to easily view the size of
    files and partitions. An example 1 output with several file sizes is here:


    ```

    # ls -l

    total 4

    --rw-r-- 1 root 2621440000 Jan 29 14:44 big.file

    --rw-r-- 1 root 104857600 Jan 29 14:42 medium.file

    --rw-r-- 1 root 51200 Jan 29 14:44 small.file

    --rw-r-- 1 root 56 Jan 29 14:44 tiny.file

    # ls -lh

    total 4.0K

    --rw-r-- 1 root 2.5G Jan 29 14:44 big.file

    ```'
