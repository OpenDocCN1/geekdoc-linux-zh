  pgno: 46
- img_proc: true
  md: 'Optical discs have one similarity to magnetic tapes: data is written as a single
    linear string of bytes—files are not fragmented. Unlike tapes, it is possible
    to easily jump to random areas of the disc, making it feasible to mount the disc
    as a read-only filesystem. However, writing to an optical disc is still cumbersome,
    and as with a tape, must be done in a sequential order of bytes.


    # Compact Discs


    The oldest of the three optical discs, CD-ROM/CDR discs, were once the most popular
    optical media for home user backups, personal archives, and exchanging information.
    But as the use of convenient, high-capacity USB flash drives grows, the use of
    CDs for storage has declined.


    A collection of standards called the Rainbow describes various CD specifications,
    and a number of common CD standards exist. The Philips intellectual property page
    at http://www.philips.com/licensing/program/16/ for more information.


    +   - Music CDs, Compact Disc-Digital Audio (CD-DA), are specified in the Red
    Book and IEC 60908 standard. In this format is divided into multiple audio tracks.


    +   - Data CDs, Compact Disc-Read Only Media (CD-ROM), are covered in the Yellow
    Book, ISO/IEC 10149, and ECMA 130 standard (http://www.ecma-international.org/publications/files/ECMA-ST/Ecma-130.pdf).


    +   - Writable CDs, or Compact Disc-Recordable/ReRewritable (CD-R/CD-RW), are
    part of the Orange Book standard and allow data to be written (CD-R) or rewritten
    (CD-RW) to a CD.


    +   - Less common standards include Photo-CD, Video CD (VCD), and other obscure
    variations, extensions, and enhancements of the common standards.


    Every CD has a linear stream of bits (pits and lands) that are abstracted into
    a linear sequence of sectors. Abstracted further, these sectors, sessions, contain
    a lead-in area and a table of contents (TOC) for the session. Multisession CDs
    can exist, and each session has its own TOC.


    Data CDs can have filesystems residing on a session, which can contain files and
    a directory structure. Some examples of CD-ROM filesystems:


    +   **High Sierra** Original standard for PCs (8.3, uppercase)


    +   **ISO9660** Updated High Sierra for cross-platform


    +   **Joliet** ISO9660 extensions; from Microsoft for Win95 and later


    +   **HFS** Macintosh


    +   **Rock Ridge** Extensions to ISO9660 for POSIX


    +   **El Torito** Standard for bootable discs'
