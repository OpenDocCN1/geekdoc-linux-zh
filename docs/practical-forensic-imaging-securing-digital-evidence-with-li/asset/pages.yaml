- img_proc: true
  md: '![](img/7fe0d6d164be3169c3098d32371b2eec_40_0.png)


    Figure 1-1: Magnetic hard disk


    Traditional computer forensics originated from the need to analyze hard disks,
    which continue to be significant evidence sources today. In particular, when an
    OS "deletes" a file, it simply unlinks any references to the data blocks on the
    disk (unlike SSDs, which use a TRIM command to clear unallocated blocks). Those
    blocks are not erased from the magnetic platters, remaining on the disk where
    forensic tools can recover them (until they''re overwritten).


    # Magnetic Tapes


    The use of magnetic tapes in the home user marketplace has disappeared, but small
    business and enterprise environments continue to use magnetic tapes for backups
    and archiving. As shown in Figure 1-2, are one of the earlier forms of digital
    storage and have a reputation as a mature technology, reliable for long-term offline
    storage. Unlike disks, SSD/flash, or optical disks, tapes can only read or write
    data sequentially. Random accessing different blocks on a tape requires to rewind
    or forward the tape to the desired location before it can be read or written.
    This lack of random access prevents tapes from being used as regular filesystems.
    Data is stored on tapes as a sequence of tape files; each file is typically an
    archive containing a filesystem or group of files and directories (using archive
    formats, such as TAR, DUMP, and so on.). Tape drives are controlled using SCSI
    tape commands to read and write data, position or rewind the tape, and eject the
    tape.


    Newer Linear Tape-Open, or LTO, drives can simulate a regular filesystem with
    the Linear Tape File System (LTFS), but this is not random access and files are
    still sequentially read and written.'
