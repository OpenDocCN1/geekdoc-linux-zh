    Once tape archive files are written, an End Of Data (EOD) marker is also written
    to the tape. This informs the drive that the end of the tape data has arrived
    and prevents the drive from reading any further. From a forensics perspective,
    however, any data beyond the EOD marker is interest because it may contain data
