    \ privileges to root in order to read the raw device.\n\nDecrypting a GPG-encrypted\
    \ image is just simple as encrypting one.\nThe only differences are the use of\
    \ the decryption flag and the requirement to specify an output file (by default,\
    \ outputs to stdout). In the following example, a GPG-encrypted image file is\
    \ decrypted to a regular (unprotected) file:\n\n```\n$ gpg -dv -o image.raw image.raw.gpg\n\
    gpg: AES encrypted data\nEnter passphrase:\ngpg: encrypted with 1 passphrase\n\
