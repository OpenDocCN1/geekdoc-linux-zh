    \ password:\n```\n\nOpenSSL is flexible regarding cipher types and modes, providing\
    \ dozens of choices. Also supported by piping and redirection, and you can easily\
    \ perform encryption during acquisition, for example:\n\n```\n# dcffld if=/dev/sd\
