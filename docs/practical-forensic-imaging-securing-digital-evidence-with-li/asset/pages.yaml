    # NVME Commands


    The NVME command set was created from scratch without providing backward compatibility
    for SCSI or ATA command sets. It was designed to support SSD media directly attached
    to the PCI bus and to take advantage of parallelism with multiple CPUs and instant
    SSD seek times (no latency overhead moving disks). The standard''s developers
    also recognized that the drive connected directly to the PCIe bus, much of the
    protocol overhead in ATA or SCSI could be eliminated. A new mini command set was
    created, free of legacy compatibility requirements. The performance and efficiency
    of NVME drives is a significant improvement over SATA or SAS. An extensive command
    system provides up to 64k queues to hold 64k commands each (in contrast, SAS had
    32 queues with one command each).


    A translation between SCSI and NVME commands is available at http://nvmexpress.org/.
    Table 1-2 shows the common examples.


