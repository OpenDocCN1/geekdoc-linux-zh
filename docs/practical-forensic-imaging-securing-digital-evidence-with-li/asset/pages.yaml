  md: '# 6


    # FORENSIC IMAGE ACQUISITION


    ![](img/7fe0d6d164be3169c3098d32371b2eec_168_0.png)


    This chapter explains the forensic imaging of storage media, with an emphasis
    on performing forensically sound image acquisition. This means maximizing the
    amount of data extracted from a particular storage medium, minimizing the disturbance
    to the storage device and medium, preserving the collected evidence, and documenting
    the process (including errors).


    You will read several tools and approaches here, as well as the strengths and
    weaknesses of each. As a result, you will be able to make an informed decision
    about which tool is most appropriate in a particular situation. You will learn
    how to use of free or open source forensic tools, such as dd, dffldld, dc3d, ewfacquire,
    and ftkimager-cli. In addition, I describe the sfimage tool as a script that uses
    existing acquisition tools to create a Squash forensic evidence counter.


    How do you choose which tool to use when imaging a disk? To some extent, it is
    a matter of personal preference. You may know one tool better than another or
    one particular tool based on past experience (or distrust a tool based on past
    experience). Each tool has its strengths and unique features. Forensic labs that
    use EnCase or FTK extensively might choose ewfacquire or ftkimager-cli for compatibility
    and policy reasons.'
  merge: -1
