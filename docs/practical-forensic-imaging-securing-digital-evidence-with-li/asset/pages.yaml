  md: 'This output confirms that the hash of the image contained inside the AFF file
    is the same as the hash recorded in the AFF metadata.


    # Cryptographic Hashes of Split Raw Images


    Calculating the cryptographic hash of a set of raw split files is straightforward,
    and you can do this by piping the concatenated parts into a hashing program. This
    example calculates the sha256 hash of a set of raw split files:


    ```

    $ cat image.raw.* | sha256sum

    12efaf4b2601e3b06d732a341753fd8d6e099b02105ba54d1db3635a232c23d6a

    ```


