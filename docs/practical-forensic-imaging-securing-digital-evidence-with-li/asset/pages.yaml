  md: '# 4


    # # PLANNING AND PREPARATION


    ![](img/7fe0d6d164be3169c3098d32371b2eec_96_0.png)


    This chapter describes the preparatory steps performed prior to imaging a disk
    or storage medium. These include setting up an audit trail of investigator activity,
    saving output for reports, and deciding on naming conventions. In addition, I
    describe various logistical challenges involved in the forensic acquisition of
    storage media and how to establish a protected write-blocking environment.


    The subject of forensic readiness overlaps somewhat with the sections in this
    chapter. However, forensic readiness is a broader topic that includes general
    planning, budgeting, lab infrastructure, staff training, hardware and software
    purchasing, and so on. If you consider the preceding requirements needed as “macro”
    forensic readiness, you can consider the information in this chapter as “micro”
    forensic readiness. The focus is narrower and includes setting up a forensic examiner’s
    workstation environment and the tools and individual tasks needed to analyze a
    disk or storage media.'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'It is worth noting that forensic readiness in a private sector organization
    (in a corporate forensic lab, for example) is different from forensic readiness
    in some public sector organizations, such as law enforcement agencies. Private
    sector organizations, especially large corporate IT environments, can dictate
    how their IT infrastructure is built and operated. Forensic readiness in this
    controlled environment can be built into the IT infrastructure, providing advantages
    for a forensic examiner in the event of an investigation or incident. This chapter
    focuses on preparatory forensic tasks, which the private sector and public sector
    have common.


    # # Maintain an Audit Trail


    An audit trail or log maintains a historical record of actions, events, and tasks.
    It can have various levels of detail and can be either manual or automated. This
    section covers several command line methods for tracking tasks as well as automated
    logging of command line activity.


    # ## Task Management


    During a forensic examination, it''s beneficial to keep a high-level log of pending
    and completed activity. Pending tasks turn into completed tasks, and completed
    tasks make up the examination''s historical record. While working, you''ll think
    of a task that you need to address in the future or a task you''ve completed and
    should note. Making quick notes and more comprehensive task lists becomes valuable
    as the length of the examination grows (possibly to many hours, days, or longer)
    or when more than one examiner is involved.


    Maintaining a list of pending and completed tasks during an examination is important
    for a number of reasons:


    +   - Ensures nothing was forgotten

    - Avoids duplicating work already done

    - Improves collaboration and coordination when working in teams

    - Shows compliance with policies and procedures

    - Facilitates accounting, including billing

    - Helps produce documentation and reports (formal incident reports or)

    - Allows for post-incident review to identify lessons learned and search process
    optimization

    - Helps to maintain a longer-term historical record of completed activity

    - Supports learning and education for new team members

    - Serves as a guide to remember complex procedures

    - Provides information for troubleshooting problems and getting support

    - Maintains a record of work done by external and third-party examiners'
  merge: -1
  pgno: 97
- img_proc: true
  md: 'Many commercial task managers and investigation management tools are available,
    but the focus in this section is simple task management that you can do from the
    command line. Using the command line permits you to quickly track tasks and activity
    without leaving the terminal to access some other graphical or web-based application.


    Many open source command task managers are available and can be used to manage
    a forensic examiner''s activity. The most important criteria include reliable
    task recording and a detailed timestamp (not just).


    # Taskwarrior


    Taskwarrior is a popular task manager with features for managing large task lists
    in a quick and efficient manner. You''ll find more information about Taskwarrior
    at http://taskwarrior.org/. The following examples show Taskwarrior commands in
    practical use in a forensic lab context.


    To add pending tasks:


    ```

    $ task add acquire PC disk and transfer to evidence safe due:friday

    Created task 1.

    ```


    To list the current task list (task info will show times and more detailed information):


    # $ task list


    | ID Date | Age Description |

    |---|---|

    | 1 2015-06-05 im | acquire PC disk and transfer to evidence safe |

    | 2 | 3s have a meeting with investigation team to plan analysis |


    2 tasks


    To complete a task on the task list:


    ```

    $ task 2 done

    Completed task 2 ''have a meeting with investigation team to plan analysis''.

    Completed 1 task.

    ```


    To log a completed task without placing it on the task list:


    ```

    $ task log requested history of PC use at the firm

    Logged task.

    ```


    Taskwarrior is useful for managing large numbers of tasks. It provides reports,
    searching, sorting, and various levels of customizable detail. Taskwarrior maintains
    timestamps and unique identifiers (UUID) for each task, manages prioritization
    of pending tasks, and keeps a history'
  merge: -1
  pgno: 98
- img_proc: true
  md: 'of completed tasks. The ability to create user-defined attributes makes it
    customizable for specific settings, such as a forensics lab or examination process.


    # Todo.txt


    You can also maintain a list of completed tasks and pending by editing a single
    file. An example is the todo.txt file format by Gina Trapani (see http://todotxt.com/
    for more information). The todo.txt system defines a file format for task creation
    and completion dates, priorities, projects, and contexts. It also provides a script
    to manage the todo.txt file. Although the todo.sh script performs all the necessary
    operations on the todo.txt task, the list file can be managed using a regular
    text editor. The notation indicates priority with parentheses (A), (B), and so
    on), context keywords with &, and project keywords with +. Completed tasks are
    prefixed with an x. Here is an example todo.txt file:


    +   (A) Sign of custody forms @receipt

    (B) Start forensic acquisition +Disk_A @imaginationstation

    Discuss analysis with investigation team @meetingroom

    x 2015-05-30 08:45 upgrade ram in imaging PC @imaginationstation


    Todo.txt apps don''t use timestamps, only dates. If you use this system, you must
    include the time with the completed task.


    # Shell Alias


    You can also maintain an examiner log of completed tasks without the use of task
    management software. For example, here is a simple shell alias that redirects
    a short description into a file with a timestamp:


    ```

    $ alias log="echo $2 \+FTSTR\ >> "/examiner.log"

    ```


    You can customize the log filename and date format as desired. Making a quick
    note of activity or viewing past activity takes a simple-line command, which you
    can enter anytime during the examination process. When something significant or
    notable occurs, enter log followed by the short description of the action taken.
    for example:


    ```

    $ log removed hdd from PC and attached to examiner machine

    ```


    ```

    $ log started forensic acquisition of the disk

    ```


    ```

    $ log acquisition, disk sealed in evidence bag

    ```


    ```

    $ cat "/examiner.log"

    2015-05-30T09:14 informed that seized PC was sent to forensic lab

    2015-05-30T10:25 PC acquired, chain of custody forms signed

    2015-05-30T10:47 removed hdd from PC and attached to examiner machine

    2015-05-30T10:55 started forensic acquisition of the disk

    ```


