    The recovery of Compact Disc Digital Audio (CDDA), or music CDs, are different
    from that of data discs. They contain a set of music tracks that are linear streams
    of pulse-code modulation (PCM) encoded bits. Unlike data CDs, there is some tolerance
    for errors. For this reason, tools have been created to animate the recovery of
    CDDA and manage drive issues such as misalignment and frame jitter. Most CD tools
