  md: 'When SquashFS forensic evidence containers, you can access the raw image by
    mounting the *.sfs file with sfimage -m, creating the partition devices, and then
    mounting the desired partition. You can then execute regular commands on the subject
    image filesystem. A complete example is shown here:


    ```

    # sfimage -m image.sfs

    image.sfs/d -v created

    # kpartx -r -a v image.sfs/d/image.raw

    add map loopip1 (252:0): 0 29848707 linear /dev/loop1 63

