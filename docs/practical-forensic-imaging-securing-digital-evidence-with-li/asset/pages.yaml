  md: '# SquashFS Forensic Evidence Containers


    Modern Linux kernels include support for SquashFS filesystems by default. No additional
    kernel modules or recompiling are necessary to mount and access a SquashFS filesystem.
    However, to create a file, append a file, or list the contents of a SquashFS file,
    the squashfstool package is required. Additional forensic software packages for
    imaging (dcflldd, dc3ddd, eqfquire) may be required, depending on your preferred
    imaging tool.


    My sfimage shell script is available at http://digitalforensics.com/sfimage/.
    Running sfimage without any options provides you with some help that describes
    its usage:


    $ sfimage - a script to manage forensic evidence containers with squashfs

    Version: sfimage Version 0.8

    Usage:


    ```

    sfimage -i diskimage container.sfs

    sfimage -a file ... container.sfs

    sfimage -l container.sfs

    sfimage -m container.sfs ...

    sfimage

    sfimage -u container.sfs ...

    ```


    Where:

    diskage is a disk device, regular file, or "-" for stdin container.sfs is a squashfs
    forensic evidence container file a regular file to be added to a container and
    the arguments are as follows:

    - i images a disk into a newly created *.sfs container

    - a adds a file to an existing *.sfs container

    - l lists the contents of an existing *.sfs container

    - m mounts a *.sfs container in the current directory

    - m without options shows all mounted sfs containers

    - u unmounts a *.sfs container


    To configure sfimage, you can edit the script or create separate sfimage.conf
    files for the script to use. The config file is documented with comments and examples,
    and it allows you to define the following parameters:


    +   - Preferred imaging/acquisition command (dd, dcflld, dc3ddd, and so on)

    - Preferred command to query a device (hdparm, tableau-part, and so on)

    - Default directory to mount the evidence container (the current working directory
    is the default)

    - How to manage privileged commands (sudo, su, and so on)

    - Permissions and uid/gid of created files


    3. With Debian-based systems, the package is installed using apt-get install squashfs-tools.'
