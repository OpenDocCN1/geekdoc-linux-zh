    Note that this "delete" has no effect on the disk image''s contents. The loop
    and mappings are not, not the drive image, and the drive image is not modified.


    If raw image has a corrupt or overwritten partition table, you can scan the image
    for filesystems and use dmset to manually map filesystems (using dmset tables)


    When you create, mount, unmount, or detach a loop device, privileges are required.
    They''re also required for operating on the /dev/loopX device with forensic tools.
    The examples shown in this section were run as the root user to reduce the complexity
    of the command lines, making them easier to understand. Prefixing the commands
    with sudo can be used to run non-root user.


    # Forensic Format Image Files


    The ewflib software package includes a tool called ewmount to "mount" the contents
