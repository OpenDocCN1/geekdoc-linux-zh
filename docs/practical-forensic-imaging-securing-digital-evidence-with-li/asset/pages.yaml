  md: 'The preceding commands create loop devices corresponding to the three acquired
    image files. You can assemble an array using mdadm, as follows:


    ```

    # mdadm -A --readonly /dev/md0 /dev/loop0 /dev/loop1 /dev/loop2

    mdadm: /dev/md0 has started with 3 drives.

    ```


    Now you can access and analyze the RAID meta disk device using forensic tools
    on the /dev/md0 device. An example using Sleuth Kit''s fsstat command is shown
    here:


    ```

    # fsstat /dev/md0

    FILE SYSTEM INFORMATION

    ```


    File System Type: Ext4

    Volume Name:

    Volume ID: 3b79d96d8ba240b44689483764412

    ...


    You can also mount the newly created device and access it using regular file tools.
    The normal Linux mount command can be used as follows:


    ```

    # mkdir mnt

    # mount /dev/md0 mnt

    mount: /dev/md0 is write-protected, mounting read-only

    ```


    When you''ve completed the analysis, reverse the steps for the cleanup process,
    including the stop command with the mdadm system:


    ```

    # umount mnt

    # rmdir mnt

    # mdadm --stop /dev/md0

    # loset -d /dev/loop2

    # loset -d /dev/loop1

    # loset -d /dev/loop0

    ```


    Depending on the system configuration, the Linux kernel may automatically attempt
    to reassemble attached RAID devices if they''re detected, possibly starting a
    rebuild operation that could destroy evidence. It''s important to use write blocking
    with live devices and ensure read-only loop devices and arrays are created.


    Many of the techniques described in this chapter apply to loop devices to image
    files. More examples of creating and using loop devices are shown in Chapter 8.'
  merge: -1
