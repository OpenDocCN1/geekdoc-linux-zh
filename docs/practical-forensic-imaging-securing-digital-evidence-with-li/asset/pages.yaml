  md: '# Closing Thoughts


    In this chapter, you learned to make acquired image files available as block devices,
    create partition devices, and safely make them available for use with regular
    filesystem tools. You also learned to use loop devices and became more familiar
    with /dev/mapper devices. I showed tips for booting up suspect images and demonstrated
    methods for accessing VM images from various VM formats. Finally, you learned
    how to make a variety of encrypted filesystems available for access in decrypted
    form.'
