    # RAID and Multidisk Systems


    The forensic acquisition of Redundant Array of Independent Disks (RAID) systems
    brings a number of challenges and might require additional steps to complete.
    Capacity planning is important, because it may involve imaging a large number
    of disks.


    This section assumes the individual disks in a RAID have been imaged separately
    and exist on the acquisition workstation. The goal is to assemble the imaged disks
    and make the meta device accessible as a file or block device, allowing you to
    use forensic tools.


    Typically, RAID systems create their own header information at the beginning of
    a disk (and sometimes at the end of a disk). The header is for unique identifiers
    (UUIDs), array names, timestamps, RAID configuration details, and other housekeeping
    information.


    # Proprietary RAID Acquisition


    In situations where a hardware RAID controller was used and no software exists
    to assemble the RAID offline, you may need to clone the RAID disks and boot an
    examination system with the controller physically installed.


    The examples in this section focus on Linux RAID, but a number of open source
    tools are available that can support acquiring and analyzing proprietary RAID
    systems.


    For example, the following packages contain such tools and are available from
    the Debian repository:


    +   - dpt-i2o-raidutils Adaptec I2O hardware RAID management utilities

    - array-info A command line tool for reporting RAID status for several RAID types

    - csis-volstatus HP SmartArray RAID Volume Status Checker

    - cpqarray A monitoring tool for HP (Compaq) SmartArray controllers

    - dpt-i2o-raidutils Adaptec I2O hardware RAID management utilities

    - mpt-status A tool to get RAID status out of mpt (and other) HW controllers

    - varmon VA RAID monitor


    In addition to these software packages, the dmraid tool is able to identify RAID
    metadata for a number of proprietary formats. You can find a list of supported
    formats by using the -1 flag, as follows:


    ```

    # dmraid -1

    asr : Adaptec HostRAID ASR (0,1,10)

    ddf1 : SNIA DDF1 (0,1,4,5,linear)

    ```'
