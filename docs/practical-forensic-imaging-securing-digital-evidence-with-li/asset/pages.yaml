    #  The Shell


    The shell is a command prompt that humans and/or machines use to command and control
    an OS. The shell starts or stops programs, installs software, shuts down a system,
    and performs other work. Arguably, the command shell offers more powerful features
    and possibilities than graphical environments.


    The examples in this book use the command line environment. GUI equivalents or
    friends to the command line tools may exist, but they are not covered in this
    book.


    The most common shell in use today, and the default in most Linux distributions,
    is Bash. The examples in this book use Bash but may also work on other shells
    (zsh, csh, and so on).


    #  Command Execution


    The shell is simply another program that runs on a system. Human users interface
    with it in the form of typed commands, and machines interface with it in the form
    of executed shell scripts.


    When human users enter commands, they usually type them into the prompt and then
    press ENTER or RETURN. There may be or may not be the output, depending on the
    program run and the configuration of the shell.


    #  Piping and Redirection


    A useful feature of the Unix/Linux command line is the ability to pass streams
    of data to programs and files using piping and redirection. This is somewhat similar
    to drag-and-drop and copy/paste in graphical environments, but with much more
    flexibility.


    A program can receive data from the output of other programs or from files on
    the filesystem. A program can also output data to the input of another program
    or send it to a file on the filesystem.


    The following examples illustrate tool.sh redirecting output into file.txt, receiving
    input from file.txt, and piping output from tool.sh to the input of tool.sh:


    ```

    $ tool.sh > file.txt

    $ tool.sh < file.txt

    $ tool.sh | othertool.sh

    ```


    56 Chapter 2'
