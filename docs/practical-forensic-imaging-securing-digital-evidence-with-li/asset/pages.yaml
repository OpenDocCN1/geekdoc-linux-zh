  md: 'Partition block devices represent entire partitions as a contiguous sequence
    of disk sectors. A partition typically contains a filesystem, which can be mounted
    by the kernel and available to users as a normal part of the directory tree. Most
    forensic tools (and should) examine raw devices and partition devices without
    having to mount the filesystem.


    # Other Special Devices


    Several other devices are useful to know for the examples in this book. The bit
    bucket, `/dev/null`, discards any data written to it. A steady stream of zeros
    is produced when accessing `/dev/zero`. The random number generator, `/dev/random`,
    provides a stream of random data when accessed. Tape devices typically start with
    `/dev/st`, and you can access external media via `/dev/cdrom` or `/dev/vdvd` (these
    are often symbolic links to `/dev/sr*`). In some cases, devices are accessed through
    the generic SCSI device interface `/dev/sg*`.


    Other special pseudo devices include `/dev/loop*` and `/dev/mapper/*`. These devices
    are discussed in more detail throughout the book.


    # Linux Kernel and Filesystems


    Filesystems organize store into a hierarchical structure of directories (folders)
    and files. They provide a layer of abstraction over the block devices.


    # Kernel Filesystem Support


    The Linux kernel supports a large number of filesystems (for a list, see https://en.wikipedia.org/wiki/Category:Linux_kernel_supported_file_systems),
    which can be useful when performing forensics tasks. However, filesystem support
    is not necessary when performing forensic acquisition, because the imaging process
    is operating on the block device below the filesystem and partition scheme.


    To provide a consistent interface for different types of filesystems, the Linux
    kernel implements a Virtual File System (VFS) abstraction layer. This allows mounting
    of regular media filesystems (EXT*, NTFS, FAT, and so on), network-based filesystems
    (nfs, sambfs/smbfs, and so on), users filesystems based on FUSE³, stackable filesystems
    (encrypts, unions, and so on), and other pseudo filesystems (sysfs, proc, and
    so on).


    The Linux Storage Stack Diagram, shown in Figure 2-1, helps you understand the
    relationship among filesystems, devices, device drivers, and hardware devices
    within the Linux kernel.


    > ³ FUSE is a userspace filesystem implementation (see https://en.wikipedia.org/wiki/Filesystem_in_Users).'
