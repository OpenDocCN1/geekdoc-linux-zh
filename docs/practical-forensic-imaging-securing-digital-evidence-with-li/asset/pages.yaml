    # Heat and Environmental Factors


    In a forensic disk acquisition, every accessible sector on the disk is being read,
    and the reading of the disk is sustained and uninterrupted, often for many hours.
    As a result, disk operating temperatures can increase and cause issues. When disks
    become too hot, the risk of failure increases, especially with older disks. Researchers
    at Google have produced an informative paper on hard disk failure at http://research.google.com/archive/disk_failures.pdf.


    To reduce the risk of read errors, bad blocks, or total disk failure, it is worthwhile
    to monitor the disk temperature while it is being acquired. Most vendors publish
    the normal operating temperatures for their drives, including the maximum acceptable
    operating temperature.


    You can also use tools to manually query the temperature of a drive. A simple
    tool that queries the SMART interface for a drive''s temperature is hddemp, as
    shown here:


    ```

    # hddemp /dev/sdb

    /dev/sdb: SAMSUNG HD16003J: 46C

    ```


    The hddemp tool can be run as a daemon and periodically log to system, where you
    can monitor it for certain thresholds.


    For more detailed output on a disk''s temperature, and in some cases a temperature
    history, use the smartctl tool. Here is an example:


    ```

    # smartctl -x /dev/sdb

    ```'
