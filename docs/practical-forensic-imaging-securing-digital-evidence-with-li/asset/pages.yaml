  md: '# Inexpensive Disks for Storage and Transfer


    Creating a stack of optical discs from a set of split and compressed images requires
    a systematic process that can be time-consuming and error prone. The maximum capacity
    of Blu-ray discs is currently 100GB (BD-R XL). The cost per gigabyte of Blu-ray
    discs is more than the cost per gigabyte for cheap hard discs.


    When you factor in human effort, risk of error, time required to burn data to
    optical discs, and cost per gigabyte, simply buying and using cheap disks becomes
    an attractive possibility for offline storage and transfer of forensic images.


    # Perform Large Network Transfers


    Some of the issues concerning acquiring images via a network were already discussed
    in Chapter 6.


    Large network transfers of acquired images may take long periods of time to complete
    and might saturate a corporate internal network or internet link. Dropped connections
    and timeouts might also occur during such long network transfers.


    Transferring large forensic images between hosts on a network is not nearly as
    fast as transferring between disks on a local machine. To put network bandwidth
    speeds into perspective, it helpful to compare them to common disk speeds. Table
    7-1 compares two fast interfaces to two fast network interfaces.


    | Table 7-1: Transfer Speeds of Common Interfaces |

    | Interface | Speed |

    | NVME | 4000MB/s |

    | SATA III | 600MB/s |

    | Gigabit Ethernet | 125MB/s |

    | Fast Ethernet | 12.5MB/s |


    For a more detailed comparison of different bandwidths, see the Wikipedia page
    at https://en.wikipedia.org/wiki/List_of_device_bit_rates.


    Depending on the network bandwidth and the image size, the physical delivery of
    a storage container with the acquired subject image (s) could be faster than a
    network transfer.


    But in some situations, secure data transfer is necessary. Ensuring security during
    a transfer may have certain side effects, such as increased complexity or performance
    penalties. For network data transfer over untrusted or unknown networks, you can
    use several secure protocols, including SSL/TLS, ssh/sftp, or IPSEC.'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'The following simple example shows the transfer of a forensic image file using
    scp (secure copy) from the OpenSSH software package:


    ```

    $ scp image.raw server1.company.com:/data/image.raw

    image.raw      11% 1955MB 37.8MB/s 06:51 ETA

    ```


    Here, an image (image.raw) is copied over an insecure network to a specific data
    directory on a remote server. Using scp has several advantages, including strong
    encryption algorithms, built-in compression, real time progress, estimated completion
    time, and strong authentication possibilities. Most important for forensic investigators,
    scp allows for large file sizes (assuming the software binary was compiled with
    64-bit large file size support) and is easily capable of transferring large images.


    If an image is already encrypted, the underlying security might be less of a concern,
    and you can use traditional file transfer protocols, such as File Transfer Protocol
    (FTP) or Windows Server Message Block (SMB). However, when you''re using insecure
    and weakly authenticated protocols to transfer files, you should confirm the file
    integrity by verifying cryptographic hash after the transfer is complete.


    # Secure Wiping and Data Disposal


    Whenever you discard or reuse a disk, or you no longer need temporary files, delete
    steps to properly erase the contents. Standard command line wiping and secure
    deletion methods are available for this purpose.


    # Dispose of Individual Files


    In some situations, you''ll need to securely erase individual files but not the
    entire disk. For example, you might need to dispose of temporary acquired images
    on the acquisition host. In this scenario, using a file shredder/wiper is sensible
    because it reduces the risk of destroying other data on the examiner''s workstation.


    The standard Linux deutils package includes the shred tool, which


    ```

    $ shred -v confidential-case-notes.txt

    shred: confidential-case-notes.txt: pass 1/3 (random)...

    shred: confidential-case-notes.txt: pass 2/3 (random)...

    shred: confidential-case-notes.txt: pass 3/3 (random)...

    ```


    A software package that calls the secure_deletion toolkit provides a suite of
    tools that attempts to erase swap, cache, memory, inodes, and files. In particular,
    srm will wipe an individual file. Another command line tool called will also erase
    files.'
