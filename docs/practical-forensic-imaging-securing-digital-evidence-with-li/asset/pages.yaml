    # Live Imaging with Copy-On-Write Snapshots


    In general, it doesn''t make sense to acquire a forensic image of a live system

    when the disks are used to acquire contain the running OS. Blocks are

    stantly changing on a live system. During the time needed to acquire a

    sector-by-sector image, the filesystem will change significantly, causing the

    imaged copy to be corrupt and inconsistent.


    Sometimes it may not be feasible to boot a system with a forensic boot

    CD to remotely acquire an image. On live servers that cannot be shut down,

    the same method used to freeze the filesystem for backups might be better-

    age in situations. Systems that have Copy-on-Write (CoW) file-

    systems may be able to do a certain amount of forensic imaging if

    filesystems have associated block devices (Logical Volume Man-

    agerLVM] for example). This will provide a consistent snapshot of the

    filesystems at a certain point in time. If a CoW filesystem has no associ-

    ated block device for a snapshot, the files will be at least for a frozen-level

    acquisition.


    If the subject system is a cloud-based virtual machine, imaging the live

    system over a network might be your only option, unless the cloud provider

    can snapshot images.


