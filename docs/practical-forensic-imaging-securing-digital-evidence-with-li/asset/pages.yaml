- img_proc: true
  md: '# # EXTRACTING SUBSETS OF

    FORENSIC IMAGES


    ![](img/7fe0d6d164be3169c3098d32371b2eec_286_0.png)


    This chapter covers the selective extraction of data regions from an attached
    drive or a forensically acquired image file. You''ll learn to extract whole partitions,
    deleted or partially overwritten partitions, inter-partition gaps, and various
    volume and file slack areas. In addition,


    you''ll see how to extract special areas such as Unified Extensible Firmware Interface
    (UEFI) partitions, the sectors hidden by a DCO or HPA, and hibernation partitions
    such as Intel Rapid Start Technology.


    The final sections demonstrate extraction of data from allocated and unallocated
    (possibly deleted) areas of the disk for further examination and manual extraction
    of sectors using offsets. Let''s begin with determining the partition layout of
    the drive.


    # ## Assess Partition Layout and Filesystems


    Once you''ve attached a disk to your system or have acquired an image file, you
    can perform an analysis of the disk partition scheme. This section explains how
    to identify filesystems, partition tables, and commonly used disk partition schemes.'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'The disk layout, or partition scheme, refers to the method used to organize
    the partitions (or slices) on a hard disk. The most common partition schemes you''ll
    find in consumer computing are DOS, GPT, BSD, and APM (Apple Partition Map, sometimes
    called mac). We''ll start with identifying the partition scheme used on a disk.


    # Partition Scheme


    Each partition or slice on a disk contains a separate filesystem (often used for
    some other special purpose. A small portion of the disk (often the first sector)
    defines the layout of the disk by specifying the starting sector of each partition,
    the partition size, the partition type, labels, and so on.


    To determine the partition scheme, you can examine the initial sectors of the
    disk for indicators. There is no official "Assigned Number" for partition schemes
    (there are only a dozen or so). Don''t confuse this with DOS MBR partition types
    or IDs, which list up to 255 possible filesystems and formats that can reside
    inside a DOS partition. When you attach the subject disk to a workstation, the
    Linux kernel will attempt to detect and interpret the partition scheme used, and
    it will create the devices for each partition it finds.


    You can use the Sleuth Kit mmstat command to identify the most common partition
    schemes. A list of supported partition schemes is shown here:


    ```

    # mmstat -t list

    Supported partition types:

    dos (DOS Partition Table)

    mac (MAC Partition Map)

    bsd (BSD Disk Label)

    sun (Sun Volume Table of Contents (Solaris))

    gpt (QID Partition Table (EFI))

    ```


    > Running mmstat will output the name of the scheme used:


    ```

    # mmstat image.raw

    dos

    ```


    Alternatively, you can use the disktype tool to identify the partition scheme.
    The disktype tool provides more verbose information and supports partitions, filesystems,
    and file and archive containers. The following shows output from disktype:


    ```

    # sudo disktype /dev/sda

    ```


    ```

    --- /dev/sda

    Block device, size 27.96 GiB (30016659456 bytes)

    DOS/MBR partition map

    ```'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'Partition 1: 27.95 GiB (30015610880 bytes, 5862420 sectors from 2048)

    Type 0x83 (Linux)


    You''ll find the original diskype software package at http://diskype-sourceforge.net/.
    Also, you''ll find a fork and multiple patches for diskype at https://github.com/kamwoods/diskype/,
    https://github.com/Pardus-Linux/Packages/tree/master/system/base/diskype/files/,
    and https://github.com/ericpaulbishops/gargoyle/tree/master/package/diskype/patches/

    A storage medium does not require a partition table or a file system. Binary data
    can be written to the raw device and accessed by any program capable of understanding
    it (for example, some databases use raw disks). It''s possible to have disks without
    partition schemes. In such cases, the filesystem starts at sector zero and continues
    to the end of the disk (that is, the whole disk is the partition). This is common
    with older USB sticks and floppy disks. In such cases, partition analysis tools
    will be ineffective and generally report a false or nonexistent partition. If
    a tool cannot detect a partition type, it''s worth checking whether a filesystem
    was written directly to a raw device. In this example, mmstat finds nothing, but
    fsstat identifies a filesystem:


    ```

    # mls /dev/sdj

    Cannot determine partition type

    # diskype /dev/sdj

    ```


    ```

    --- /dev/sdj

    Block device, size 1.406 MiB (1474560 bytes)

    FAT12 file system (hints score 5 of 5)

    Volume size 1.390 MiB (1457664 bytes, 2847 clusters of 512)

    ```


    ```

    # mmstat /dev/sdj

    Cannot determine partition type

    # fsstat /dev/sdj

    FILE SYSTEM INFORMATION

    ```


    File System Type: FAT12


    Some encrypted volumes attempt to hide their existence or information about the
    filesystem used, and they don''t use a recognizable partition scheme.


    # Partition Tables


    A partition scheme will have a disk block or set of blocks describing how it''s
    organized. These are called partition tables (or disklabels for BSD systems),
    and you can query them using various tools.'
