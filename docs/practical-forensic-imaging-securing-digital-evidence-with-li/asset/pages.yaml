  pgno: 135
- img_proc: true
  md: 'The hdparm tool operates by sending requests to the OS disk drivers (using
    ioctls to retrieve information about the disk. From a forensics perspective, a
    number of items may be of interest or useful to document:


    +   * Details about the drive geometry (physical and logical)

    * The disk''s supported standards, features, and capabilities

    * States flags related to the drive configuration

    * Security information

    * Vendor information, such as make, model, and serial number

    * The WWN device identifier (if it exists)

    * Time needed for secure erase (for most disks, this is roughly the acquisition
    time)


    For more detailed information about hdparm''s features, see the hdparm(8) manual
    page.

    The following example shows how to use hdparm to get an overview of the disk using
    the raw disk device. The listing is annotated with comments relevant to forensic
    investigators.

