  md: '# Magnetic Tapes


    Tapes have essentially disappeared from home environments. But they are still
    used in small, medium, and enterprise environments for backup and archiving. On
    rare occasions, you might receive a request to recover data from tapes. In corporate
    forensic labs for example, old tapes are sometimes found when company departments
    are reorganizing or moving locations.


    Historically, popular tapes have used 4mm DAT, 8mm Exabyte, and DLT tapes. Today,
    the most common types used are LTO and 8mm DAT. The maximum native/compressed
    capacities of these tapes are 160GB/320GB for DAT-320 and 6TB/15TB for LTO-7.
    Modern LTO drives also support encrypted tapes.


    Modern tapes are attached to host systems using a SAS or Fibre Channel interface.
    Historically, nearly all tape drives followed the SCSI Stream Command (SSC-5)
    standards (which is the latest).


    Tape technologies use their own convention of "files," which are placed in sequential
    order or a. Typically, a tape file consists of a backup archive created by backing
    or archiving software. Tape files are not accessible like disk drives or optical
    disks. You access them by moving or spacing forward or backward to the beginning
    of a file number and reading logical blocks until the end of the file.


    Tapes have different markers that tell the tape drive information about the position
    of the head on the tape (see Figure 6-2). The interesting markers to understand
    here are as:


    +   * BOT or BOM (Beginning of Tape or Media) Tells the drive where it can start
    or writing data.


    +   * EOF (End of File) Tells the drive that the end of a tape file has reached.


    +   * EOD (End of Data) Tells the drive that the end of the written data has been
    reached (found immediately after the last tape file). This is the logical end
    of the tape.


    +   * PEOT, EOT, or EOM ([Physical] End of Tape or Media) Tells the drive that
    the end of the physical tape length has been reached.


    | BOT Filenames | EOD | EOT |

    | --- | --- | --- | --- |

    | file 0 | file 1 | ... | file n | unused |


    ![](img/7fe0d6d164be3169c3098d32371b2eec_203_0.png)


    When you''re acquiring tapes for forensic purposes, it''s essential to copy every
    file on the tape to the EOD marker (the last readable on the tape). It''s impossible
    to read past the EOD on a tape using standard SCSI commands. Some forensic firms
    offer specialized hardware and services which are able to recover data beyond
    the EOD.'
