    # mkdir dip1

    # mount /dev/mapper/loopip1 loopip1

    mount: /dev/mapper/loopip1 is write-protected, mounting read-only

    # ls -l

    ```


    Once you finished accessing the raw image and its filesystems, clean up with SquashFS
    forensic evidence containers is also in reverse. The sfimage -u command unmounts
    a SquashFS filesystem as shown in this example:


    ```

    # umount p1

    # kpartx -d image.sfs/d/image.raw

    loop deleted : /dev/loop1

    # sfimage -u image.sfs/

    image.sfs.d unmounted

    ```


    This section demonstrated several methods for accessing the contents of forensic
    formats, as both block devices and as regular filesystems. The ewmount tool also
    works with FTK SMART. Afflib has a similar tool called affuse for mounting *.aff
    Both ewmount and affuse operate on single or split files of their respective formats.


    Note that many forensic formats (Sleuth Kit, for example) are able to operate
    directly on forensic formats without the need for a raw block device or raw file.


    # Prepare Boot Images with xmount


    Forensic investigators often want to examine a subject image with non-forensic
    tools, such file managers, office suites, applications, or other file viewer tools.
    This can be done by making the drive contents safely available over a read-only
    mount for the local examiner to access.


    In some cases, it is useful to boot a subject drive in a VM to observe and interact
    directly with the live subject environment. This allows you to view the subject''s
    desktop and use the installed programs of the subject PC. To do this, you can
    use a number of tools described in this section.'
  merge: -1
  pgno: 262
- img_proc: true
  md: 'The xmount (pronounced "crossmount") tool creates a virtual disk image that
    you can boot using VM software, such as VirtualBox or kvm-qemu. The xmount tool
    allows you to simulate a read-write drive, making the VM think the disk is writable,
    but it continues to protect the image in a read-only state. Multiple VM output
    formats are available, including raw, DMG, VDI, VHD, VMDK, and VMDKS.


    The input formats include forensically acquired image files, such as *raw, EnCase
    *raw, and AFF4 *aff.


    Here is an example of a raw image (image.raw) set up with xmount as a VirtualBox
    *vdi file:


    ```

    $ mkdir virtual

    $ xmount --cache xmount.cache --in raw image.raw --out vdi virtual

    $ ls virtual/

    image.info image.vdi

    $ cat virtual/image.info

    ```


    ----> The following values are supplied by the used input library(ies) <-


    --> image.raw <-

    RAW image assembled of 1 piece(s)

    30016659456 bytes in total (27.955 GiB)


    ----> The following values are supplied by the used morphing library <----


    None

    $ virtualbox


    In this example, the directory virtual is created to hold the virtual image file
    (it will be FUSE mounted). From an existing image.raw file, the xmount command
    creates a write-cached VirtualBox VDI image in the /virtual directory. This is
    just a virtual representation of the image file; it is not copied or converted
    (not wasting disk space on the examiner machine). The --in and --out flags specify
    the image format. The input formats must be raw, AFF, or EOF. Multiple output
    formats are possible.


    Booting an OS in a VM can be challenging when the installed OS is expecting a
    different hardware configuration than provided by the VM. Typically, this is less
    of an issue with Linux distributions. To solve this problem, tools, operates and
    openjobs, were created to prepare Windows and OS images for safely booting subject
    disks in a virtual environment. I won''t cover how to use operates and openjobs,
    but you can find more information about them at https://www.penguin.lu/openjobs/
    and https://www.penguin.lu/operates/.


    When you no longer need the VM image, you can clean up by unmounting and removing
    the mount point directory:


    ```

    $ fusermount -u virtual

    $ ls virtual/

    $ rdir virtual

    ```'
  merge: -1
  pgno: 263
- img_proc: true
  md: 'A xmount.cache file containing data written during the use of the VM might
    exist. You can save the file if you need to continue the previous session, or
