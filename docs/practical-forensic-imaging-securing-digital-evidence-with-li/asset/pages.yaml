    # Filesystem Identification


    The typeskit tool, already presented in “Partition Scheme” on page 260, allows
    you to identify partitions and filesystems within partitions. The Sleuth Kit fstat
    tool provides more comprehensive information about a filesystem. The fstat tool
    provides forensically acquired image if you specify the sector offset.'
