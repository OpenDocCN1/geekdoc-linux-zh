    # # Acquire Image with dd Tools


    The resulting image from dd-based tools is not a "format" in the same sense as
    other forensic formats, such as header in EnCase EWF or FTK SMART. Images created
    by dd-based tools do not have a header, a footer, internal markers, or descriptive
    metadata about a case or incident. They are simply a raw image of a chunk of data,
    in this case, a mirror image of a subject disk or other mass storage.


    > Warning: the dd tools are unforgiving if you make any mistakes and will irrevocably
    overwrite any unprotected disk if instructed.


    To reduce the risk of damaging evidence or an examiner workstation, always double-check
    the following:


    +   * A writer blocker is protecting the evidence/subject drive.

    * The serial number of the input device (if=) matches the serial number on the
    physical subject disk label.

    * Confirm the output file (of=) is a regular file located on the examiner system
    or a program that can handle the expected input to stdin.


    # Standard Unix dd and GNU dd

    The command syntax for dd simply specifies an input file and an output file, and
    it may include other options that modify the command''s behavior. The following
    example shows the use of dd to copy a disk device to a file:


    ```

    # dd if=/dev/sde of=image.raw

    15466496+0 records in

    ```'
