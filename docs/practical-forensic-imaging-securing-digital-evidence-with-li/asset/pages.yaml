  md: 'To include regular output and error messages, you need to redirect stdout and
    stderr descriptors to the file. Newer versions of Bash provide an easy-to-remember
    method by adding an ampersand to the redirection (this also applies when piping
    to another program):


    ```

    # fls /dev/sda & fls-parti.txt

    ```


    Other shells and earlier Bash versions might require 2>&1 notation for combining
    stderr and stdin. For example:


    ```

    # fls /dev/sda > fls-parti.txt 2>&1

    ```


    When a file already exists and you need to add additional information to it, you
    can use the >> notation to specify an append operation. For example:


    ```

    # grep clientnames.xls fls-parti.txt >> notes.txt

    ```


    Here, all instances of a known filename are added to the end of the notes.txt
    file. If notes.txt doesn''t exist, it will be created.


    Many tasks performed on the command line are time-consuming and may take many
    hours to complete (disk imaging, performing operations on very large files, and
    so on). Having a timestamp provides the duration of the command can provide functionality.
    There are two common implementations of the time command: one is a shell builtin
    with rudimentary features, and the other is a GNU utility with additional features.
    The primary advantage of the shell builtin version is that it will time an entire
    pipeline of commands, whereas GNU time will only time the first command in a pipeline.


    Here is an example of using the time command to run a disk-imaging program:


    ```

    # time dcffld i=/dev/sdc of=/ssd-image.raw

    390738 blocks (122104Mb) written.

    390738+1 records in

    390738+1 records out

    ```


    ```

    real    28m5.176s

    user    0m11.652s

    sys     2m23.6522s

    ```


    The zsh shell can log the elapsed time of a command as part of the history file.
    This functionality is currently not available in Bash.


    +   1. The dot in this example may be interpreted as a regular expression. This
    is ignored here for simplicity.'
