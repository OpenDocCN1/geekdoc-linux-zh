    Verifying: - enter aes-256-cbc encryption password:\n241664 (7552MB) written.\n\
    241664+ records in\n241664+ records out\n```\n\nDecrypting an OpenSSL-encrypted\
    \ file is also relatively straightforward, provided you know the encryption algorithm,\
    \ as shown here:\n\n```\n# openssl enc -d -aes-256-cbc -in image.raw.aes -out\
