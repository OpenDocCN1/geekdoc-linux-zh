    \ identity column is a numeric column which automatically generates a unique numeric\
    \ value for each inserted row. There can only be one identity column per table.\n\
    \nThere are two ways to generate values for an identity column, depending on how\
    \ it was defined:\n\n+   * Generated always: values are always generated by DB2.\
    \ Applications are not allowed to provide an explicit value.\n\n+   * Generated\
