    # 8.5 Indexes


    An index is an ordered set of keys of each which points to a row in a table. An
    index allows uniqueness, and it also improves performance. Some of the characteristics
    that you can define on indexes:


    +   - The index order can be ascending or descending

    - The index keys can be unique or non-unique

    - Several columns can be used for the index (this is called a compound index)

    - If the index and the physical data are clustered in similar index sequence,
    they are a cluster index


    For example:


    ```

    CREATE UNIQUE INDEX artno_ix ON artists (artno)

    ```


