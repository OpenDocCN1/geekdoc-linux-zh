    # ## 6.4 Summary


    In this chapter we explored the three key aspects of DB2 architecture: the process
    model, the memory model, and the storage model. For the process model, we looked
    at the common processes and threads, including db2sys, without which DB2 could
    not run.


    The storage model was discussed in depth, covering the three most important aspects:
    pages and entries, the butterpool (including creation details) and table spaces.
    Finally, we looked at the various types of table spaces, along with details on
    how they are managed (SMS, DMS, Automatic) and how to create a new table space
    using the Control Center.


