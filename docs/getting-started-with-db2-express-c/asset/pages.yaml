  md: '# 10.2.2.1 Instance-level authorities


    Table 10.2 lists the instance-level authorities


    | Authority | Description |

    |---|---|

    | SYSADM | Manages the instance as a whole |

    | SYSCTL | Administers a database manager instance |

    | SYSMAINT | Maintains databases within an instance |

    | SYSMON | Monitors the instance and its databases |


    Table 10.2 - Instance-level authorities


    To grant SYSADM, SYSCTL, SYSMAINT, or SYSMON authority to a group, the DBM CFG
    parameters SYSADM_GROUP, SYSCTL_GROUP, SYSMAINT_GROUP, and SYSMON_GROUP, respectively,
    can be assigned to an operating system group.


    For example, give SYSADM authority to the operating system group *myadmins*, you
    can issue this command:


    ```

    update dbm cfg SYSADM_GROUP= myadmins

    ```


    Each DB2 instance has its own authority definitions. On Windows, these parameters
    are empty by default, which means the Local Administrators group will have SYSADM
    authority. In DB2 9.7, the DB2ADMNS group (if extended security is enabled) and
    the LocalSystem Account will also have SYSADM authority. The authorization ID
    for the LocalSystem account is SYSTEM. On Linux, the instance owner group is the
    default SYSADM group.


