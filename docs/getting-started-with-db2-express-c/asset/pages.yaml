  md: '# 3.6 Summary


    This chapter covered the details of installing DB2 Express-C. This DB2 edition
    is available on Linux, Solaris and most varieties of Windows, and can run on 32-bit,
    64-bit and Power PC architectures. After discussing the required user authority
    necessary to install DB2 on a system, we did a walkthrough of a straightforward
    installation using the DB2 Installation Wizard GUI. A discussion of post-installation
    activities followed, including running DB2 First Steps and validating the install.
    Finally, we took a look at how to create and execute a silent install using DB2
    response files.


    # 3.7 Exercises


    In this exercise, you will install DB2 Express-C and create the SAMPLE database


    # Objective


    Before you begin exploring all the features and tools that com DB2 Express-C,
    you must install it on your system. In this exercise, you will perform a basic
    installation of DB2 Express-C on Windows. The same installation is available on
    Linux; therefore the steps are very similar on that platform.


    # Procedure


    +   1. Obtain DB2 Express-C images: Download the DB2 Express-C image from the
    DB2 Express-C web site (www.ibm.com/db2/express). Unzip the files into any directory
    you wish.


    +   2. Locate the files: Navigate to the directory (or drive) containing the unzipped
    DB2 product installation files.


    +   3. Run the DB2 Setup Launchpad: Launch the DB2 Setup Launchpad by double-clicking
    on the setup.exe file. On Linux, run the db2setup command as root. From the Launchpad,
    click the Install Product option on the left pane of the window.


    +   4. Run the DB2 setup wizard: The DB2 setup wizard checks that all requirements
    are met and sees if there are any existing DB2 installations. Click New to start
    the wizard, and click Next.


    +   5. Review the license agreement: Read and accept the license agreement (select
    the "I Accept..."radio button) and click the Next button to continue.


    +   6. Choose the installation type: For this exercise, select the Typical option
    (this is the default). The Compact option performs a basic installation, while
    the Custom option allows you to customize the specific features you want to install.
    Click the Next button to continue.


    +   7. Select the installation, response file creation, or both: Leave the default
    so that DB2 is installed, and also a response file is created. Click the Next
    button to continue.'
