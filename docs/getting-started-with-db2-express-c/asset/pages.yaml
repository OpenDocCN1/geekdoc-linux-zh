  md: 'Chapter 6 – DB2 Architecture 113


    # 6.3.1 Pages and Extents


    A page is the minimum unit of storage in DB2. Allowed page sizes are: 4K, 8K,
    16K and 32K. An extent is a grouping of pages. Working with one page at a time
    in DB2 would be costly in terms of performance; therefore, DB2 works with extents
    at a instead. The page size and extent size are defined when working with buffer
    pools and table spaces as we will see in the next sections.


    # 6.3.2 Buffer pools


    A buffer pool is a real memory cache for table and index data. It improves performance
    by reducing sequential I/O and promotes asynchronous reading (pre-fetching) and
    writing. That is to say, DB2 anticipates what pages will be needed and pre-fetches
    them from the disk to the buffer pool so they are ready to use.


    Buffer pools are allocated in memory units of 4K, 8K, 16K, and 32 pages. There
    should be at least one buffer pool per database, and at least one matching buffer
    pool for a table space of a given page.


    # 6.3.2.1 Creating a Buffer Pool


    To create a pool you can use the BUFFERPOOL statement. Alternatively, using the
    Control Center you can right click on the Buffer Pool folder within a database
    and choose Create, as shown in Figure 6.3


    ![](img/5f8d773441634563b766a57e36213cf4_112_0.png)


    Figure 6.3 – Creating a buffer pool


    After clicking on Create, the Create Buffer Pool Dialog will appear as shown in
    Figure 6.4'
  merge: -1
