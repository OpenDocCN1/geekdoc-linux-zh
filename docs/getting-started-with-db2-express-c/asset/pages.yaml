  md: '# 3.5 Silent Install


    There may be situations where you need to install a DB2 client on multiple computers;
    or you need to embed a DB2 data server as part of your application, and would
    like to install it as part of your application installation process. In these
    situations, a silent install is the ideal way to install DB2.


    DB2 enables silent installs through the use of response files which store installation
    information as simple text options. Listing 3.1 shows a snippet of a response
    file.


    ```

    PROD_DB2_EXPRESS_EDITION

    LIC_AGREEMENT=ACCEPT

    FILE=C:\Program Files\IBM\SQLIB\

    INSTALL_TYPE=TYPICAL

    LANG=EN

    INSTANCE=DB2

    DB2.NAME=DB2

    DEFAULT_INSTANCE=DB2

    DB2.SVCENAME=db2cm_DB2

    DB2.DB2COMM=TCPIP

    ...

    ```


    # Listing 3.1 - A sample response file


    There are a number of ways to generate a response file:


    +   Install DB2 Express-C once on a computer using the DB2 installation wizard.
    One of the first wizard options save your install responses (as shown in Figure
    3.3) allows you to select the checkbox to save your install responses to a response
    file. At the end of the installation, the wizard generates a response file into
    a specified directory and filename. This is a text file, so you can manually edit
    it afterwards.


    +   Edit the response file provided with the DB2 Express-C image. This sample
    file (denoted with a .rsp extension) is located in the db2/platform/samples/directory


    +   For Windows, you can also use the response file generator:

    db2rspgn -d <output directory>


    Finally, to silently install DB2 using a response file, issue the following command
    on Windows:


    ```

    setup -u <response filename>

    ```


    On Linux, issue the command:


    ```

    db2setup -r <response filename>

    ```'
  merge: -1
