  md: '# # Chapter 9 – Data Movement Utilities


    The tools or commands described in this section are used to move data within the
    same database or across databases in the same or different platforms. Figure 9.1
    provides an overview of the data movement utilities.


    ![](img/5f8d773441634563b766a57e36213cf4_160_0.png)


    **Figure 9.1 – Data movement utilities**


    In 9.1 there are two databases, database A, and B. Using theing utility, one can
    export the data from a table into a file. The file can have any of these formats:


    +   * ASC = ASCII

    * DEL = Delimited ASCII

    * WSF = Worksheet format

    * IXF = Integrated Exchange Format


    ASC and DEL files are text that can be opened and reviewed in any text editor.
    WSF is a format that can be used to move data to spreadsheets such as Excel or
    Lotus® 1-2-3, IXF is a format that not only includes the Data Definition Language
    (DDL) of the table in question. The IXF format is convenient because when the
    table needs to be reconstructed, can be done directly from a file with an IXF
    formatted export; this is not possible if you use the other formats.


    Once the data has been exported to a file, the IMPORT utility can be used to import
    the data from the file into another table. The table must exist beforehand for
    the ASC, DEL and WSF format, but it does not need to exist for the IXF format.
    Another method to load the data into a table is to use the LOAD utility. The LOAD
    utility is faster as it goes directly to'
  merge: -1
  pgno: 160
