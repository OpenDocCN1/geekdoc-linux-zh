    # 9.1 EXPORT utility


    The EXPORT utility is used to extract data from a table into a file as discussed
    earlier. Behind the scenes, an SQL SELECT operation is what is really being performed.
    The following example exports to the file employee.ixf of IXF format 10 rows from
    the table employee.


    ```

    EXPORT TO employee.ixf IXF

    SELECT * FROM employee

    FETCH FIRST 10 ROWS ONLY

    ```


    We encourage you to try the above example. The employee table is part of the SAMPLE
    database, so you first need to connect to this database created in a previous
    chapter.


    If you prefer to work with GUI tools, the EXPORT utility can also be invoked from
    the Control Center as shown in Figure 9.2.'
