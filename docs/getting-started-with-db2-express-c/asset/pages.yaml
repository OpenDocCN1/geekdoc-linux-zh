    ```


    # 4.1.2 Database manager configuration file (dbm cfg)


    The database manager configuration file (dbm cfg) includes parameters that affect
    the instance and all the databases contained within. The database manager configuration
    file can be viewed or modified using the command line, or through the DB2 Control
    Center.


    To work with the dbm cfg from the Control Center, select the instance object from
    the instance folder of the control center, right-click to reveal the popup menu
    and select Configure Parameters. This is shown in Figure 4.13.'
