  md: '# # Appendix A – Troubleshooting


    This appendix discusses how to troubleshoot problems that may be encountered when
    working with DB2. Figure A.1 provides a brief overview of the actions to take
    should a problem arise.


    ![](img/5f8d773441634563b766a57e36213cf4_292_0.png)


    Figure A.1 – Troubleshooting overview'
  merge: -1
  pgno: 292
- img_proc: true
  md: '294 Getting Started with DB2 Express-C


    > Note:

    For more information about troubleshooting, watch this video:

    http://www.channeldb2.com/video/video/show?id=807741:Video:4462


    # A.1 Finding more information about error codes


    To obtain more information about an error code received, enter the code prefixed
    by a mark in the Command Editor input area and click the Execute button. This
    is shown in Figure A.2.


    ![](img/5f8d773441634563b766a57e36213cf4_293_0.png)


    Figure A.2 – Finding more information about DB2 error codes


    The question mark (?) invokes the DB2 help command. Below are several examples
    of how to invoke it if you receive, for example, the SQL error code "-104". All
    of the examples below are equivalent.


    ```

    db2 ? SQL0104N

    db2 ? SQL104N

    db2 ? SQL-0104

    db2 ? SQL-104

    db2 ? SQL-104N

    ```


    # A.2 SQLCODE and SQLSTATE


    An SQLCODE is a code received after every SQL statement is executed. The meanings
    of the values are summarized below:


    +   - SQLCODE = 0; the command was successful

    - SQLCODE > 0; the command was successful, but returned a warning'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Appendix A - Troubleshooting 295


    +   - SQLCODE < 0; the command was unsuccessful and returned an error


    The SQLSTATE is a five-character string that conforms to the ISO/ANSI SQL92 standard.
    The first two characters are known as the SQLSTATE class code:


    +   - A class code of 00 means the command was successful.

    - A class code of 01 implies a warning.

    - A class code of 02 implies a not found condition.

    - All other class codes are considered errors.


    # A.3 DB2 Administration Notification Log


    The DB2 administration notification log provides diagnostic information about
    errors at the point of failure. On Linux and UNIX platforms, the administration
    notification log is a text file called `<instance>.nfy` (e.g. `db2inst.nfy`).
    On Windows, all administration notification messages are written to the Windows
    Event Log.


    The DBM configuration parameter `notifylevel` allows administrators to specify
    the level of information to be recorded:


    +   - 0 -- No administration notification messages captured (not recommended)

    - 1 -- Immediate action required

    - 3 -- Important information, no immediate action required (the default)

    - 4 -- Informational messages


    # A.4 db2diag.log


    The db2diag.log provides more detailed information than the DB2 Administration
    notification log. It is normally used only by IBM DB2 technical support or experienced
    DBAs. Information in the db2diag.log includes:


    +   - The DB2 code location reporting an error.

    - Application identifiers that allow you to match up entries pertaining to an
    application on the db2diag.logs of servers and clients.

    - A diagnostic message (beginning with "DIA") explaining the reason for the error.

    - Any available supporting data, such as SQLCA data structures and pointers to
    the location of any extra dump or trap files.


    On Windows (other than Vista), the db2diag.log is located by default under the
    directory:'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# Getting Started with DB2 Express-C


    C:\Documents and Settings\All Users\Application

    Data\IBM\DB2COPY1\<instance name>


    On Windows Vista, the db2diag.log is located by default under the directory:


    C:\ProgramData\IBM\DB2COPY1\<instance name>


    On Linux/UNIX, the db2diag.log is located by default under the directory:


    /home/<instance_owner>/sqlib/db2dump


    The verbosity of diagnostic text is determined by the dbm cfg configuration parameter
    DIAGLELEVEL. The range is 0 to 4, where 0 is the least verbose, and 4 is the most.

    default level is 3.


    # A.5 CLI traces


    For CLI, Java, PHP, and Ruby on Rails applications, you may turn on the CLI trace
    facility to troubleshoot your. This can be done by making changes to the db2cli.ini
    file at the server where your application is running. Typical entries in the db2cli.ini
    file are shown below in Listing A.1.


    ```

    [common]

    trace=0

    tracereseshinterval=300

    tracepathname=/path/to/writeable/directory

    traceflush=1

    ```


    Listing A.1 - db2cli.ini file entries to turn on CLI Tracing


    Low level tracing (db2trc) is also available, but this is typically only useful
    for DB2 technical support.


    # A.6 DB2 Defects and Fixes


    Sometimes a problem you encounter may be caused by a defect in DB2. IBM regularly
    releases fix packs which contain code fixes for defects (APARS). The fix pack
    documentation contains a list of the fixes contained in the fix pack. When developing
    applications, we always recommend using the latest fix pack to benefit from the
    latest fixes. To view your current version and fix pack level: from the Control
    Center, select the About option from the Help menu; or from the Command Window,
    type db2level. Note that fix packs and official IBM DB2 technical support are
    not offered with DB2 Express-C. With DB2 Express-C, fixes are incorporated into
    the image itself rather than applied as fix packs.'
