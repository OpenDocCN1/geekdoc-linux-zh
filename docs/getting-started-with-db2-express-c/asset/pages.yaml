  md: '# 13.10 Summary


    In this chapter we looked at maintaining data integrity through transaction control,
    concurrent user access and locking levels. The different concurrency levels all
    have issues that can affect how you access and manage your data.


    We also looked in detail at the role of setting the isolation levels to deal with
    these issues, and how the isolation level can be manipulated to provide the maximum
    flexibility required by your application and data needs.


    We also looked at lock escalation, lock waits and lock monitoring, along with
    the causes, detection and handling of database deadlocks.


    Finally, we looked at some best practice ideas for getting the best possible results
    for your concurrency needs.


