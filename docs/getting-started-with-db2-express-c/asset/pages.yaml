  md: 'Chapter 8 – Working with Database Objects


    # 8.6 Referential integrity


    Referential integrity allows your database to manage relationships between tables.
    You can establish parent-child type of relationships between tables as shown in
    Figure 8.6. In the figure, there are two tables, DEPARTMENT and EMPLOYEE, related
    by the department number. The WORKDEPT column in the EMPLOYEE table can only contain
    department numbers that already exist in the DEPARTMENT table. This is because
    in example, the DEPARTMENT table is the parent table, and the EMPLOYEE table is
    the child, or dependent table. The figure also shows the necessary CREATE TABLE
    statement needed to establish the relationship.


    DEPARTMENT table (Parent table)


    | DEPTNO | DEPARTMENTNAME | MGRNO |

    | --- | --- | --- |

    | (Primary key) or unique constraint | | |


    EMPLOYEE table (Dependent table)


    | EMPNO | FIRSTNAME | LASTNAME | WORKDEPT | PHONENO |

    | --- | --- | --- | --- | --- |

    | (Primary key) | | | (Foreign key) | |


    ```

    create table employee (empno)

    primary key (empno)

    foreign key (workdept)

    references department on delete no action

    in DMS01

    ```


    Figure 8.6 – An example of referential integrity between tables


    In referential integrity, the concepts listed in Table 8.1 are often used.


    | Concept | Description |

    | --- | --- |

    | Parent table | A controlling data table in which the parent key exists |

    | Dependent table | A dependent table on the data in the parent table. It also
    contains a foreign key. For a row to exist in a dependent table, a matching row
    must already exist within a parent table. |

    | Primary Key | Defines the primary key of the table. It cannot contain NULL values
    and values must be unique. A primary key consists of one or more columns within
    a table. |

    | Foreign Key | References the primary key of a parent table |


    Table 8.1 - Referential Integrity key concepts'
  merge: -1
  pgno: 154
- img_proc: true
  md: '156 Getting Started with DB2 Express-C


    Data in tables can be related to data in one or more tables with referential integrity.
    Constraints can be imposed on data values so that they conform to a certain property
    or business rule. For example, if a table stores the char of a person, the constraint
    can enforce that the only values allowed are “M” for male and “F” for female.


    # 8.7 Schema Evolution


    When business needs change, the support information technology (IT) infrastructure
    and systems must also change. What this means in the database world is that new
    tables have to be created, existing tables have to be dropped or modified, trigger
    logic has to change, and so on. These changes seem simple to make, in reality,
    they can be difficult and complex. Long maintenance windows are required, and
    intricate, risky procedures must be performed. One of the reasons that previously
    was that DB2 required all objects to be consistent at all times, and therefore,
    actions affecting objects which depend on the object being changed were not allowed,
    or would cause the dependent objects to be dropped. Figure 8.7 provides a sample
    scenario.


    ![](img/5f8d773441634563b766a57e36213cf4_155_0.png)


    Figure 8.7 –Schema evolution sample scenario


    As an example, in Figure 8.7, the definition of View1 needs to change so that
    it''s not just based on Table1 with the company''s first quarter financial information,
    but on Table1 and Table2 with second quarter information. Normally you would have
    to drop View1 and recreate it with the new definition; however, View2 is dependent
    on View1. To drop DB2 9.7, DB2 would not allow you to drop View1 because of the
    dependent View2. You would have to drop View2 first, so that you could drop View
    and then reconstruct views. With DB2 9.7, rules have been relaxed. Now that affect
    dependent objects are allowed. The dependent object (View2 in the example), is
    known as automatic revalidation. The db2 cfg parameter AUTO_REVAL is used to turn
    on or off automatic revalidation and to determine when revalidation will occur.
    For example, if you set this parameter to DEFERRED_FORCE, revalidation will be
    deferred until the invalid object or dependant objects are accessed, but CREATE
    statements will be allowed (with a warning) on dependant object that don''t yet
    exist.'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Chapter 8 – Working with Database Objects


    Other changes affecting the dependency model include the implementation of features
    like CREATE OR REPLACE syntax for views, functions, procedures, triggers, aliases,
    and so on. For example:


    ```

    create or replace procedure p1 begin ...

    ```


    With this syntax, if an object (for example, procedure P1) didn''t exist, it would
    be created. If it existed before, it would be replaced. This second behavior is
    what is important for object dependency. When P1 is replaced, objects dependent
    on P1 are automatically revalidated. A similar situation happens for new features
    like RENAME COLUMN, and for data type changes with ALTER COLUMN, which has also
    been enhanced to support more data type changes.


    A related concept known as soft invalidation allows users to drop an object as
    other running transactions are using it. Any new transactions will be denied access
    to the dropped object.


    # 8.8 Summary


    In this chapter we took a look at the database objects in DB2: what they are,
    how they are created and how to use them. We introduced database schemas and compared
    them with the new public synonyms, as well as how public synonyms compare to private
    synonyms.


    Next, we discussed tables and their elements in depth: data types (both built-in
    and user-defined), identity columns, sequence objects, and global temporary tables.
    This was followed by looking at views, indexes and using the Design Advisor GUI
    to improve the accessibility and retrievability of the data inside a table.


    Finally, we examined referential integrity to define relationships between tables,
    and the new concept of schema evolution which allows for data objects to be changed
    without unnecessary complication.


