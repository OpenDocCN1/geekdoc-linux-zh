  md: '# Chapter 10 – Database Security 185


    +   - DB2ADMNS: This group and local administrators will have complete access
    to all DB2 objects through the operating system.

    - DB2USERS: This group will have read and execute access to all DB2 objects through
    the operating system.


    ![](img/5f8d773441634563b766a57e36213cf4_184_0.png)


    With DB2 9.7 the members of the DB2ADMNS group will automatically have SYSADM
    authority in DB2 if extended security is enabled and the database configuration
    parameter SYSADM_GROUP is not set.


    # 10.8 Summary


    This chapter covered the security aspects of DB2, beginning with a comprehensive
    discussion of the differences and importance of authentication and authorization.
    From there, we looked at the various authority levels that provide security for
    the instance and the database.


    Next, we covered the new concept of roles and how they can be used to your advantage
    with regard to security and the limitations of setting security through groups.
