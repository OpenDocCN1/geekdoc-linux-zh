    # 5.1 IBM Data Studio


    With DB2.7, IBM Data Studio is the primary tool for database administration, and
    database development. It can run on Linux and Windows, and is part of the IBM
    Data Management portfolio. The development of Data Studio follows a schedule which
    is not tied to the releases of DB2; however the products coordinate their releases
    as often as possible. For example, DB2 9.7 and IBM Data Studio 2.2 were released
    on the same day in June 2019.


    Figure 5.3 how IBM Data Studio looks like.


    ![](img/5f8d773441634563b766a57e36213cf4_82_0.png)


    Figure 5.3 - IBM Data Studio


    If you are familiar with Eclipse, you will note that Data Studio is Eclipse based.
    With Data Studio, typically you will work within the Data perspective view (highlighted
    in the figure'
