    # 12.3 Summary


    This chapter examined the importance of maintenance on your databases, including
    the role of the REORG, RUNSTATS, and REBIND cycle. The REORG command, as its name
    implies, reorganizes your database to eliminate fragmentation and speed data retrieval.
    RUNSTATS updates the statistical information using the DB2 optimization tool to
    improve data performance. The BIND or REBIND process updates the database packages
    with the latest access paths.


    We also looked at the graphical tools provided in the DB2 Control Center to run
    maintenance activities in manual, scripted and automatic modes.


