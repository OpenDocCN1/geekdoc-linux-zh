  md: '# # Chapter 13 – Concurrency and Locking


    This chapter discusses how allow multiple users to access the same database at
    the same time without interfering with each other, and keeping their operations
    consistent. We will discuss the concepts of transactions, concurrency and locking.


    > Note: For more information about concurrency and locking, watch this video:
    http://www.channeldb2.com/video/show?id=807741;Video:4322


    #  13.1 Transactions


    A transaction or unit of work consists of one or more SQL statements which, when
    executed, should be considered as a single unit; that is, if one of the statements
    in the transaction fails, the entire transaction fails, and any statements executed
    up to the point of failure are rolled back. A transaction ends with a COMMIT statement,
    which also signifies the start of a new transaction. Figure 13.1 provides an example
    of a transaction.


    ![](img/5f8d773441634563b766a57e36213cf4_214_0.png)


    Figure 13.1—An example of a transaction'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 216 Getting Started with DB2 Express-C


    In Figure 13.1, for example, you want to transfer 100 dollars from your savings
    account to your checking account. As shown in the figure, the following sequence
    of events may be required to achieve this task:


    +   - Debit $100 from the savings account

    - Credit $100 to the checking account


    If the above sequence of events is not treated as a single unit of work, a transaction,
    imagine what would happen if a power failure occurred after the debit from the
    savings account, but before the checking account is credited. You would lose $100!


    # 13.2 Concurrency


    Concurrency implies that several users can work at the same time on the same database
    objects, DB2 was designed as a multi-user database. Access to data must be coordinated
    properly and transparently using a mechanism to ensure data integrity and consistency.
    Consider Figure 13.2 as an example.


    | ID | Name | Age |

    |---|---|---|

    | 3 | Peter | 33 |

    | 5 | John | 23 |

    | 22 | Mary | 22 |

    | 35 | Ann | 55 |


    Figure 13.2–An example of concurrency, App A, App B, App C, and App D that are
    trying to access the same row (row 2) in a table.


    In Figure 13.2, there are four applications, App A, App B, App C, and App D that
    are trying to access the same row (row 2) in a table. Without any concurrency
    control, all of the applications could perform operations on the same row. Assuming
    all of the applications are updating the Age column for row 2 with different values,
    the application which performs the update will likely be the “winner” in this
    situation. It should be obvious in this example that concurrency control is required
    to guarantee consistent results. This concurrency control is based using locks.


    Locking and concurrency concepts go hand in hand. Locking temporarily stops applications
    from performing their operation until another finishes. The more locking there
    is in a system, the less concurrency is possible. On the other hand, the less
    locking there is in system, the more concurrency is possible.


    Locks are acquired automatically as needed to support a transaction and are released
    when the transaction terminates (using either a COMMIT or ROLLBACK command). Locks
    can be acquired on tables or rows. There are two basic types of locks:


    +   - Share locks (S locks) – acquired when an application wants to read and prevent
    others from updating the same row'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Chapter 13 – Concurrency and Locking 217


    +   - Exclusive locks (X locks) - acquired when an application updates, inserts,
    or deletes a row


    Now consider Figure 13.3, which is similar to Figure 13.2, but it now shows a
    lock.


    | ID | Name | Age |

    |---|---|--|

    | 3 | Peter | 33 |

    | 5 | John | 23 |

    | 22 | Mary | 22 |

    | 35 | Ann | 55 |


    # Figure 13.3–An example of concurrency, and the need for locks


    For example, in Figure 13.2, if App B is the first accessing row 2, and is performing
    an UPDATE, App B holds an X lock on the row. When App A, App C and App D try to
    access the same row, they won''t be able to UPDATE it because of the X lock. This
    allows for consistency and integrity of the data.


    # 13.3 Problems without concurrency control


    Without form of concurrency control, the following problems may be encountered


    +   - Lost update

    - Uncommitted read

    - Non-repeatable read

    - Phantom read


    # 13.3.1 Lost update


    Lost update is a problem similar to the one explained earlier in this section
    where the application performing the last update, will be the "winner".


    | Flight | Seat | P_Name |

    |---|---|--|

    | 512 | 7C | |

    | 512 | 7B | |


    ```

    Update Reservations

    Set P-name = ''Instruct''

    Where Flight = 512 and Seat = ''7C'' and P_name = NULL

    ```


    ```

    Update Reservations

    Set P-name = ''Manager''

    Where Flight = 512 and Seat = ''7C'' and P_Name = NULL

    ```


    | 512 | 7C | Instruct ... |


    | 512 | 7C | Manager ... |'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Figure 13.4 – Lost Update


    In Figure 13.4 there are two applications attempting to update the same row. The
    one on the left is application App1, and the one on the right is App2. The sequence
    of events is then:


    +   1. App1 updates a row

    2. App2 updates the same row

    3. App1 commits

    4. App2 commits


    App1''s update is lost when App2 make its update, hence the term “Lost Update”.


    # 13.3.2 Uncommitted read


    An uncommitted read, or “dirty read” allows for an application to read information
    that has not been committed, and therefore is not necessarily accurate.


    | Flight | Seat | P_Name |

    |--- | --- | --- |

    | 512 | 7C | |

    | 512 | 7B | |


    ① Update Reservations

    Set P-name = ''Instruct''

    Where Flight = 512 and Seat = ''7C''

    and P_Name is NULL


    ② Select seat

    From Reservations

    Where P-name is NULL


    ③ Roll back – Uncommitted Read


    ④ Incorrect results set


    # Figure 13.5 – Uncommitted Read


    Figure 13.5 follows this sequence of events:


    +   1. App1 updates a row

    2. App2 reads the new value from that row

    3. App1 rolls back its changes to that row


    App2 is reading uncommitted data, and hence invalid data, which is why this problem
    is called an “uncommitted read”


    ![](img/5f8d773441634563b766a57e36213cf4_217_0.png)'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# 13.3.3 Non-repeatable read


    A non-repeatable read implies that you cannot obtain the same result after performing
    the same read in the same operation.


    | FLIGHT | SEAT | NAME | DESTINATION | ORIGIN |

    |---|---|---|---|--|

    | 512 | 7B | | DENVER | DALLAS |

    | .... | | | | |

    | .... | | | | |

    | 814 | 8A | | SAN JOSE | DENVER |

    | .... | | | | |

    | 134 | 1C | | HONOLULU | SAN JOSE |

    | .... | | | | |


    Figure 13.6 – Non-repeatable Read


    In Figure 13.6, consider if you are trying to book a flight from Dallas to Honolulu.
    The sequence of events is:


    +   1. App1 opens a cursor (also known as a result set) obtaining what you see
    in Figure 13.6

    2. App2 deletes a row that was qualified for the cursor (for example, the row
    with destination “San Jose")

    3. App1 commits changes

    4. App1 closes and reopens the cursor


    In this case, since App1 would not get the same data on a repeated read, it cannot
    reproduce the data on set; that’s this problem is called “non-repeatable read”.


    # 13.3.4 Phantom read


    The phantom read problem is similar to the non-repeatable read problem, but the
    difference is that on subsequent fetches, you may obtain additional rows than
    fewer rows. Figure 13.7 provides an example of this problem.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# Reservations


    | Flight | Seat | P_Name |

    | --- | --- | --- |

    | 512 | 7B | |

    | 512 | 7A | P Read |

    | ... | ... | ... |


    +   Select seat

    From Reservations

    Where P-name is NULL


    +   Update Reservations

    Set P-name = ''NULL''

    Where Flight = 512

    and Seat = ''7A''

    and P_Name = ''P Read''


    +   Repeat 7C is now available


    Figure 13.7 – Phantom read


    Figure 13.7 shows the following sequence of events:


    +   1. App1 opens a cursor

    2. App2 adds a row to the database that would qualify for the cursor

    3. App2 commits changes

    4. App1 closes and reopens cursor


    In this case, App1 would not get the data on a repeated read, it would get more
    rows, that''s why this problem is called ''phantom read''.


    # 13.4 Isolation Levels


    You can think of isolation level as locking policies, depending on the isolation
    level chosen, you may get different behaviors for database locking with an application.


    DB2 provides different levels of protection to isolate data:


    +   - Uncommitted Read (UR)

    - Cursor Stability (CS)

    - Read Stability (RS)

    - Repeatable Read (RR)


    # 13.4.1 Uncommitted read


    Uncommitted read is also known as dirty read. It is the lowest level of isolation,
    and provides the highest degree of concurrency. No row locks are obtained on read
    operations, unless another application attempts to drop or alter a table; and
    update operations act as if using the cursor isolation level.'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'Problems still possible with this isolation level:


    +   - Uncommitted read

    - Non-repeatable read

    - Phantom read


    Problems prevented with this isolation level:


    +   - Loss of update


    # 13.4.2 Cursor stability


    Cursor stability is the default isolation level. It provides a minimal degree
    of locking. Basically, with this isolation level the "current" row of a cursor
    is locked. If the row is only read, the lock is held until a new row is fetched
    or the unit of work is terminated. If the row is updated, the lock is held until
    the unit of work is terminated.


    Problems still possible with this isolation level:


    +   - Non-repeatable read

    - Phantom read


    Problems prevented with this isolation level:


    +   - Loss of update

    - Uncommitted read


    # 13.4.2.1 Current committed


    Prior to DB2.7 when using cursor stability isolation level, a writer (UPDATE operation)
    would prevent a reader (SELECT operation) from accessing the same row. The logic
    was that since the writer is making changes to the row, the reader would wait
    until the update is finished to the final committed value. In DB2.7, there is
    a new behavior for the cursor stability isolation level for new databases. This
    behavior is implemented using **currently committed** (CC) semantics. With CC,
    a writer will not prevent a reader from accessing the same row. This behaviour
    was possible in the past if you used an isolation level of uncommitted read (UR);
    however, the difference now is that UR the reader retrieves the **uncommitted**
    value, while with CC, the reader retrieves the **currently committed** value.
    The currently committed value is the committed value prior to the start of the
    write operation.


    For example, you have a table T1 with the following contents:


    | FIRSTNAME LASTNAME |

    | Raul Chong |

    | Jin Xie |'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'Now your application AppA issues this statement, but does not commit:


    ```

    update T1 set lastname = ''Smith'' where firstname = ''Raul''

    ```


    Next, application AppB issues this statement:


    ```

    select lastname from T1 where firstname = ''Raul'' with CS

    ```


    Prior to DB2 9.7, this statement would hang because it is waiting for the exclusive
    lock held by the update statement of AppA (the writer) to be released.


    With DB2 9.7 and currently committed (the default for new databases), the statement
    would return the currently committed value which is **Chong**.


    Note that even CS is the default we are including with ''CS'' in the statement
    for clarity. We discuss this clause later in the chapter.


    AppB tries this statement:


    ```

    select lastname from T1 where firstname = ''Raul'' with UR

    ```


    Since UR isolation is used, the result would be **Smith** which is the uncommitted
    value.

    This example shows that CC, which is better concurrency for applications, allowing
    readers to access the row a writer is updating.


    Another scenario that would have caused contention prior to DB2 9.7 is a reader
    preventing a writer to access a row. This scenario was one of the reasons why
    COMMIT was recommended even for read operations, as it would ensure the share
    (S) locks would be released. CC with this is no longer an issue, as a reader will
    not block a writer.


    With respect to INSERT operations that are not committed, the read operation will
    skip by default; the result will not display these rows. For DELETE commands,
    the read operation should also skip (ignore) the affected rows, but the behavior
    depends on the value of the registry variable DB2SKIPPLETED. Other variables and
    properties in BIND and PREPARE can change the default behavior of CC.


    Just remember: Currently committed means it will show currently committed information,
    a non-committed INSERT or DELETE operations will be ignored.


    As mentioned earlier, CC is enabled by default on new databases. If you would
    like to turn it off, enable it for a database created prior to DB2 9.7 and upgraded
    to DB2 9.7, you can update the database configuration value to CUR_COMMIT. For
    example, to turn it off the **SAMPLE** database issue:


    ```

    db2 update db cfg for sample using CUR_COMMIT off

    db2 stop

    db2start

    ```'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# 13.4.3 Read stability


    With read stability, all the rows an application retrieves within a unit of work
    are locked. For a given cursor, it locks all rows that qualify for the result
    set. For example, if you have a table containing 10,000 rows and the query returns
    10 rows, then only those 10 rows are locked. Read stability uses a moderate degree
    of locking.


    Problems still possible with this isolation level:


    +   - Phantom read


    Problems prevented with this isolation level:


    +   - Loss of update

    - Uncommitted read

    - Non-repeatable read


    # 13.4.4 Repeatable read


    Repeatable read is the highest isolation level. It provides the highest degree
    of locking, and the least concurrency. Locks are held on all rows processed to
    build the result set; that is, rows not necessarily in the final result set may
    be locked. No application can update, delete, or insert a row that would affect
    the result set until the unit of work completes. Repeatable read guarantees that
    the same query issued by an application than once in a unit of work will give
    the same result each time.


    Problems still possible with this isolation level:


    +   - none


    Problems prevented with this isolation level:


    +   - Loss of update

    - Uncommitted read

    - Non-repeatable read

    - Phantom read


    # 13.4.5 Comparing isolation levels


    Figure 13.8 compares the different isolation levels for a fetch. In the figure,
    we see that isolation level uncommitted read (UR) takes no locks. Isolation cursor
    stability (CS) takes a lock for row 1 when it is fetching it, but releases it
    as soon as it fetches row 2, and so on. For isolation levels read stability (RS)
    or repeatable read (RR), any row that is fetched will be locked, and the lock
    is not released until the end of the transaction (at a commit point).'
  merge: -1
  pgno: 222
- img_proc: true
  md: '224 Getting Started with DB2 Express-C


    | ID NAME | QTY |

    | --- | --- |

    | 1 DISP | 10 |

    | 2 KEYB | 3 |

    | 3 MOUSE | 15 |

    | 4 CABLE | 18 |

    | 5 CPU | 1 |

    | 6 SOUND | 4 |


    ![](img/5f8d773441634563b766a57e36213cf4_223_0.png)


    Figure 13.8 – Comparing isolation levels for a fetch


    # 13.4.6 Setting the isolation level


    Isolation levels can be specified at many levels:


    +   * Session (application)

    * Connection

    * Statement


    The isolation level is normally defined at the session or Application Level. If
    no isolation level is specified in your application, it defaults to cursor stability.
    For example, Table 13.1 shows the possible isolation levels for a .NET or JDBC
    program and how these properties, when set, match a DB2 isolation level.


    | DB2 | .NET | JDBC |

    | --- | --- | --- |

    | Uncommitted Read (UR) | ReadUncommitted | TRANSACTION_READ_UNCOMMITTED |

    | Cursor Stability (CS) | ReadCommitted | TRANSACTION_READ_COMMITTED |

    | Read Stability (RS) | RepeatableRead | TRANSACTION_REPEATABLE_READ |

    | Repeatable Read (RR) | Serializable | TRANSACTION_SERIALIZABLE |


    Table 13.1 - Comparison of isolation level terminology'
