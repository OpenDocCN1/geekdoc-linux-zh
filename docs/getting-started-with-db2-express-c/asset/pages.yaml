  md: 'Chapter 9 – Data Movement Utilities


    # 9.6 Summary


    In this chapter, we discussed the various export and import functions of DB2.
    Beginning with a look at the various export formats (ASC, DEL, WSF, and IXF),
    we moved onto an in-depth examination of the EX utility. The import utilities
    IMPORT and LOAD were discussed, along with the need SET INTEGRITY statement when
    using LOAD.


    The db2move command provides you with a means to simplify the exporting and importing
    transfer process. A more complex command, db2look, allows you to extract and store
    all the database elements needed to independently recreate the entire database
    if desired.


