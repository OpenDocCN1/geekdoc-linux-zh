  md: "In both cases, DB2 follows international XML standards.\n\n# 15.3.5.1 Querying\
    \ XML data with SQL/XML\n\nUsing regular SQL statements allows you to work with\
    \ rows and columns. An SQL statement can be used to work with full XML documents;\
    \ however, it would not help when attempting to retrieve only part of the document.\
    \ In such cases, you need to use SQL with XML extensions (SQL/XML).\n\nTable 15.6\
    \ describes some of the SQL/XML functions available with the SQL 2006 standard\n\
    \n| Function name | Description |\n|---|---|\n| XMLPARSE | Parses character or\
    \ large binary data, produces XML value |\n| XMLSERIALIZE | Converts an XML value\
    \ into character or large object binary data |\n| XMLVALIDATE | Validates XML\
    \ value against an XML schema and type-annotates the XML value |\n| XMLEXISTS\
    \ | Determines if an XQuery returns a results (i.e. a sequence of one or more\
    \ items) |\n| XMLQUERY | Executes an XQuery and XQuery returns the result sequence\
    \ |\n| XMLTABLE | Executes an XQuery, returns the result sequence as a relational\
    \ table (if possible) |\n| XMLCAST | Cast to or from an XML type |\n\n# Table\
    \ 15.6 – SQL/XML Functions\n\nThe following examples can be tested using the mydb\
    \ database created earlier.\n\n# Example 1\n\nImagine that you need to locate\
    \ the name of all clients who live in a zip code. The clients table stores customer\
    \ addresses, including zip codes, in an XML column. Using XMLEXISTS, you can search\
    \ the XML column for the target zip code and restrict the return result set accordingly.\
    \ Listing 15.7 below illustrates the query required.\n\n```\nSELECT name FROM\
    \ clients\nWHERE xmlexists(\n  '$Client/Address[zip=\"95116\"]'\n  passing clients.contact\
    \ as \"c\"\n```"
  merge: -1
  pgno: 274
- img_proc: true
  md: "# Listing 15.7 - An example using XMLEXISTS\n\nIn Listing 15.7, the first line\
    \ is an SQL clause specifying that you want to retrieve information in the name\
    \ column of the clients table.\n\nThe WHERE clause invokes the XMLEXISTS function,\
    \ specifying the XPath expression that prompts DB2 to navigate to the zip element\
    \ and check for a value of 95116\n\nThe $/Client/Address clause indicates the\
    \ path inside the XML hierarchy where DB2 can locate the zip element. A dollar\
    \ sign ($) is used to specify a variable; therefore \"c\" is a variable. This\
    \ variable is then defined by this line: passing clients.contact as \"c\". clients\
    \ is the name of the table and contact is the name of the column with an XML data\
    \ type. we are passing the XML document to the variable \"c\".\n\nDB2 inspects\
    \ the XML data contained in the contact column, navigates from the client node\
    \ to the Address node, then to the zip node and finally determines if the customer\
    \ lives in the target zip code. The XMLEXISTS function evaluates to \"true\" and\
    \ DB2 returns the name of the client associated with that row.\n\nStarting with\
    \ DB2 9.5, the above query could be simplified in Listing 15.8.\n\n```\nSELECT\
    \ name FROM clients\nWHERE XMLEXISTS(\n  '$CONTACT/Client/Address[zip=\"95116\"\
    ]'\nn)\n```\n\n# Listing 15.8 - Simplified version of the query shown in Listing\
    \ 15.7\n\nA variable with the same name as an XML column is created automatically\
    \ by DB2. In the above example, the variable CONTACT is created automatically\
    \ by DB2. Its name matches the name of the column CONTACT.\n\n# Example 2\n\n\
    Let's consider how to solve the problem of how to create a report list the e-mail\
    \ addresses of \"Gold\" status customers. The query in Listing 15.9 below could\
    \ run for this purpose.\n\n```\nSELECT xmlquery('$/Client/email') passing contact\
    \ as \"c\"\nFROM clients\nWHERE status = 'Gold'\n```\n\n# Listing 15.9 - An example\
    \ using XMLEXQUERY\n\nThe first line indicates that we want to return the email\
    \ address which is an element of the XML document (not a relational column). As\
    \ in the previous example, \"$c\" is a variable that contains the XML document.\
    \ In this example we use the XMLEXQUERY function which can be used after a SELECT,\
    \ the XMLEXISTS function can be used after a WHERE clause."
