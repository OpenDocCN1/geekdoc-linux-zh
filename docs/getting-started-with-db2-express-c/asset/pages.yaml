    \n# 13.8 Deadlock causes and detection\n\nA deadlock occurs when two or more applications\
    \ connected to the same database wait indefinitely for a resource. The waiting\
    \ is never resolved because each application is holding a resource that the other\
    \ needs. Deadlocks are an application design issue most of the time. Figure 13.10\
    \ illustrates a deadlock.\n\n![](img/5f8d773441634563b766a57e36213cf4_227_0.png)\n\
    \nFigure 13.10 - Deadlock scenario\n\nIn Figure 13.10, user A is holding the cereal\
    \ and will not let go until he gets the milk. On the other hand, user B is holding\
    \ the milk, and will not let go until he gets the cereal. Therefore, we have a\
    \ deadlock situation.\n\nWith DB2 9.7, the use of currently committed has considerably\
    \ reduced the occurrence of deadlocks, as one application does not need to wait\
    \ for the other application to release its lock, but instead access the currently\
    \ committed value.\n\nTo simulate a deadlock in DB2, follow these steps:\n\n+\
    \   1. Turn off committed:\n   db2 update db cfg for sample using cur_commit force\n\
    \   db2stop force\n   db2start\n\n+   2. Open two DB2 Command Windows (which we\
    \ will call \"CLP1\" and \"CLP2\", respectively) representing two different applications\
    \ connecting to the database\n\n+   3. From CLP issue the commands:"
