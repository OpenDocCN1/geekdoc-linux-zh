    at the top right corner). You can also switch to the Java perspective, if you
    are developing a Java program. There are two views highlighted in the figure:


    +   - Data Project Explorer (top left)

    - Data Source Explorer (bottom left)


    The Data Project Explorer is used by database developers to work with SQL scripts,
    XQuery, stored procedures, UDFs, and Data Web services.


    The Data Source Explorer is used by database administrators to manage DB2 instances
    and databases. Using this view you can perform more of the functionality previously
    available in the Control Center.


    In the figure, the view with PROCEDURE1 is an editor for the procedure being highlighted
    in the Data Project Explorer. Depending on the task you are executing, editors
    or other windows will appear, allowing you to either code or perform more configurations.


    IBM Data Studio comes in two flavors:


    +   - Stand-alone package

    - IDE package


    The stand-alone package is a lot smaller than the IDE package but does not support
    Data Web services development, and cannot be extended to other Eclipse-based IBM
    products like InfoSphere Data Architect, for example. Other than that, the interface
    and capabilities are the same.


    With IBM Data Studio, you can also work with other data servers, like Informix.
    Companies that work with several data servers and have a small DBA or database
    developer team now have the convenience of working and managing all of them from
    one tool.


    > Note:

    For more information about Data Studio, refer to the Getting Started with IBM
    Data Studio for DB2 free eBook which is part of this book series.


