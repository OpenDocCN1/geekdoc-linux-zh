    # 6.3.3 Table spaces


    Table spaces are a logical interface between logical tables and the system''s
    physical memory (buffer pool) and containers (disks). Use the CREATE TABLESPACE
    statement to create a table space where you specify:


    +   - The page size for the table space (4KB, 8KB, 16KB, or 32KB). The page size
    must correspond to a buffer pool with the same page size.

    - The buffer pool name associated to this table space.

    - An extent size

    - A pre-fetch size.


    # 6.3.3.1 Table space types


    There are three types of table spaces:


    +   - Regular'
  merge: -1
  pgno: 114
- img_proc: true
  md: '116 Getting Started with DB2 Express-C


    These are for user tables. For example, the USERSPACE1 table space created by
    default is a regular table space.


    +   - Large

    These are used to optionally LOB data into its own table space. It is also used
    for storing XML data for databases created with pureXML support using the XML
    data type for columns. Large table spaces are the default.


    +   - Temporary

    There are two types of temporary table spaces:

    - System temporary

    These are used by DB2 for internal operations, such as sorts. For example, the
    TEMPSPACE1 table space, created by default when you create a database, is a system
    temporary table space. There must always be at least one system temporary table
    space.

    - User temporary

    These are used to create user-defined declared Global Temporary Tables (DGTTs)
    which are in-memory tables. They are often confused with system temporary table
    spaces. Users must create a user table space before DGTTs or CGTTs can be used.


    # ### 6.3.2 Table space management


    Table spaces can be classified based on how they are managed. This can be specified
    in the CREATE TABLESPACE statement.


    # Managed by system


    This type of table space is known as System Managed Storage (SMS). This means
    the operating system manages the storage. They are easy to manage, and the containers
    are file system directories. The space is not pre-allocated, but the files grow
    dynamically. Once you specify the containers, these are fixed at creation time
    and other containers cannot be added later, unless a redirected restore is used.
    When using SMS table spaces the table index, and LOB data cannot spread across
    different table spaces.


    # Managed by database


    This type of table space is known as Database Managed Storage (DMS). This means
    that DB2 manages the storage. Management of the space requires more manual intervention
    from a DBA. Containers can be pre-allocated files or raw devices. For raw devices,
    data is written directly without O/S caching.


    Containers can be added, dropped or resized using the ALTER TABLESPACE statement.
    DMS table spaces are best for performance, and table index, and LOB data can be
    split into separate table spaces, which improves performance.'
  merge: -1
  pgno: 115
- img_proc: true
  md: 'Chapter 6 – DB2 Architecture


    # Managed by automatic storage


    This type of table space is managed by automatic storage, and can benefit from
    the ease of use similar to SMS table spaces, but with the best performance and
    flexibility of DMS table spaces. Furthermore, starting with DB2 9, this is the
    default type of table space. For these table spaces, a user first specifies a
    storage path and a logical group of storage devices which DB2 will use to manage
    the storage. No explicit container definitions are provided. Containers are automatically
    created across the storage paths. Growth of existing containers and addition of
    new ones is completely managed by DB2. When a storage path is not specified in
    the CREATE DATABASE command, the database path is used as the storage path. The
    database path is where the main database definition resides. If the database path
    is not specified, it is obtained from the database manager configuration parameter
    DFTDBPATH. On Windows, this can only be a drive, not a path.


    To allow automatic storage, you first need to create a database with automatic
    storage enabled (this is the default behavior) and associate a set of storage
    paths with it. After creation, if needed, you can redefine the storage paths using
    a database REST operation. Then, you can create table spaces to use automatic
    storage (again, this is the default behavior).


    Managed by automatic storage is very similar to DMS table spaces, but operations
    have been automated so they are managed by DB2; this includes the assignment and
    allocation of containers and auto resizing.


    Let''s take a look at an example of Managed by automatic storage table space.
    First create the database with automatic storage enabled, as in these examples:


    Automatic storage is enabled by default:


    ```

    CREATE DATABASE DB1 AUTOMATIC STORAGE YES

    ```


    Automatic storage is enabled by default, the storage paths are indicated. If the
    storage path is a directory, it must be created ahead of time:


    Example on Windows:


    ```

    CREATE DATABASE DB1 ON C:/storagepath1, D:/storagepath2

    ```


    Note that the first item in the list is a drive, because it is representing a
    database path which can only be a drive; not a path on Windows. This item will
    also be used as one of the storage paths. Thus, the database path is C:, C:\storagepath1,
    and D:\storagepath2, where the last two directories must be created ahead of time.


    Example on Linux:'
  merge: -1
  pgno: 116
