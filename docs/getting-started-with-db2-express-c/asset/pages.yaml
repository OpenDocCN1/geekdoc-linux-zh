  md: 'Chapter 2 – Related features and products


    # 2.2.6 Deep compression


    DB2 supports several types of compression:


    +   - NULL and Default Value Compression.


    This type of compression applies to columns where values are normally NULL or
    the system default values such as 0, where no disk storage is consumed


    +   - Multidimensional Clustering


    Multidimensional clustering (MDC) tables where the physical data pages are clustered
    in multiple dimensions. They use block indexes in which a sense is a way to compress
    indexes because they point to a block of records rather than to a single record.


    +   - Database Compression


    This applies to backup images. Indexes and LOB tablespaces are compressed.


    +   - Data Row Compression


    Row compression works by repeating strings within a row of data with a much smaller
    symbol. The mapping of this smaller symbol and the string is kept in a dictionary.
    Row compression can drastically improve performance on I/O bound workloads where
    more rows can be brought back and forth from disk to memory (and versa) because
    the rows are smaller. You can also benefit from storage savings which normally
    account for one of the largest expenses in the IT budget of companies. For CPU-bound
    workloads there can be some extra overhead as compressed rows need to be uncompressed
    before processing. Note as well the log data for compressed records is also in
    compressed format.


    When accessing XML and LOB columns generally DB2 will not use the bufferpool (memory),
    but perform direct I/Os to the disk. This is because XML and LOBs are normally
    large in size; therefore bringing them to memory would cause pages that are needed
    to be moved from memory. With DB2 9.5, inlining for small XML documents (less
    than 32KB) is allowed. This means that small XML documents can be stored with
    the base table, and not in an separate storage object called XDA. The advantages
    of this approach are twofold: First, XML documents can now have access through
    the bufferpool, and second, XML documents could also benefit from data compression.


    New with DB2 9.7 are further enhancements to compression:


    +   - XDA internal objects (where XML is stored) can now also be compressed.


    +   - Indexes and temporal tables (system and user) can be compressed


    +   - LOBs can be inlined in a similar way to XML inlining.


    ![](img/5f8d773441634563b766a57e36213cf4_36_0.png)'
  merge: -1
  pgno: 36
- img_proc: true
  md: "# 2.2.7 SQL Compatibility\n\nWhile many vendors follow the SQL 92 and SQL/PSM\
    \ standards, not all features of the standards are supported, and other features\
    \ not included in the standards are. With DB2 9.7 SQL compatibility feature, DB2\
    \ can now support most PL/SQL syntax which is supported by other RDBMS vendors\
    \ in addition to DB2's own SQL PL. Figure 2.3 summarizes how this works.\n\n![](img/5f8d773441634563b766a57e36213cf4_37_0.png)\n\
    \nFigure 2.3 -PL/SQL support in DB2\n\nFrom the figure you will note that a PL/SQL\
    \ compiler has been developed and built into the DB2 engine.\n\nSQL Compatibility\
    \ feature also supports for a tool called CLPPPlus. CLPPPlus is a command line\
    \ tool that allows you to run SQL and other commands. It is similar to the existing\
    \ DB2 Command Line Processor (CLP). Figure 2.4 illustrates the CLPPPlus.\n\n```\n\
    Command Prompt -clpplus\n>CLPPPlus\nCLP+ Release 1.0\nCopyright (c) 2008, IBM\
    \ CORPORATION. All rights reserved.\nSQL> connect rielau@localhost:50000/stmtnc\n\
    Connected to DB2/NT SQL92.0770 (localhost:50000/stmtnc) AS rielau\nSQL> select\
    \ sysdate from dual;\n  1\n2008-08-02 19:38:34.0\nSQL>\n```\n\nFigure 2.4 -CLPPPlus"
  merge: -1
