    # 4.1 DB2 configuration


    DB2 parameters can be configured using the Configuration Advisor Tool. To access
    the configuration advisor through the Control Center, right click on a database
    and choose *Configuration Advisor*. Based on your answers to some questions about
    your system resources and workload, the configuration advisor will provide a list
    of DB2 parameters that should be changed with suggested values for each. If you
    would like more detail about DB2 configuration, keep reading; otherwise, use the
    Configuration Advisor and you are good to work with DB2!


    A DB2 server can be configured at four different levels:


    +   - Environment variables

    - Database manager configuration file (dbm cfg)

    - Database configuration file (db cfg)

    - DB2 profile registry


    This is also shown in *Figure 4.12*. In the figure, note where each of the boxes
    resides. For example, environment variables are set at the operating system level
    of the server, while database manager configuration file parameters are set at
    the instance level. Database'
