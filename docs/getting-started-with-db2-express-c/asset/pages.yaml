  md: '# 1.10.04 DB2 Text Search


    DB2 Text Search is an optional integrated component of DB2. It is powered by the
    IBM OmniFind™ technology, and it allows you to perform powerful, fast and detailed
    full-text searches in DB2, including any XML documents stored natively in DB2.
    This component uses linguistic logic to find different forms of the search term
    within the text. For example, if you are looking for the word "study", DB2 Text
    Search also finds other forms of the word such as "studies" or "studied".


    To install the DB2 Text Search component, choose a custom installation of DB2
    Express-C, and select the DB2 Text Search feature within the Server support category.


    Note:


    Similar functionality is also available in a DB2 extender called the Net Search
    Extender (NSE). NSE is deprecated in favor of DB2 Text Search,


