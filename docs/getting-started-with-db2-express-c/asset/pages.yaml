- img_proc: true
  md: 'Chapter 2 – Related features and products


    ![](img/5f8d773441634563b766a57e36213cf4_40_0.png)


    Figure 2.6 – InfoSphere Federation Server


    For relational database management systems that are of the IBM family, federation
    support is built into DB2 Express-C. This means that the WebSphere Federation
    Server product is not required when, for example, you want to run a query between
    two different DB2 databases, or between one DB2 database and an Informix database
    (Informix of the IBM family).


    # 2.3.3 InfoSphere Replication Server


    Formerly known as WebSphere Information Integrator (for replication support),
    the InfoSphere Replication Server allows for SQL replication of database records
    when non-IBM data servers are involved. It also includes a feature known as Q-Replication
    for duplicating data using message queues.


    # 2.3.4 Optim Development Studio (ODS)


    Formerly known as Data Studio Developer, ODS is an Eclipse-based tool that can
    be easily integrated with Data Studio, and share the same Eclipse. ODS can help
    you create development databases using copy and paste from existing Oracle or
    DB2 databases.'
  merge: -1
