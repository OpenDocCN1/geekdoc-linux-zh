    the database pages without interacting with the DB2 engine; however, this method
    does not make a check for constraints, and triggers are not fired. To guarantee
    consistency of the data loaded using LOAD, the SET INTEGRITY command is often
    used afterwards.


    The next sections describe the EXPORT, IMPORT, and LOAD utilities in more detail.


    Note:

    For more information about working with data base movement utilities, watch this
