  md: '# 10


    # Chapter 10 – Database Security


    This chapter discusses how security is handled in DB2. Figure 10.1 provides a
    basic overview.


    ![](img/5f8d773441634563b766a57e36213cf4_172_0.png)


    Figure 10.1 – DB2 security overview


    As shown in Figure 10.1, DB2 security consists of two parts:


    +   - Authentication

    It is the process by which the user identity is validated. Authentication is performed
    by a security facility outside of DB2 through a security plug-in. The default
    security plug-in relies on the operating operating system, but you can also use
    plug-ins for Kerberos, LDAP, or you can build your own custom-built authentication
    plug-in. When using the default OS-based authentication plug-in, the user and
    password are sent to the database server (e.g. as part of a connect statement).
    The database server invokes the OS authentication to validate the user and password.


    +   - Authorization

    At this stage, DB2 checks if the authenticated user may perform the requested
    operation. The authorization information is stored in a DB2 catalog and a DBM
    configuration file.


    For example, in Figure 10.1, user bob connects to the SAMPLE database with this
    statement:


    ```

    CONNECT TO sample USER USING pwd

    ```'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Getting Started with DB2 Express-C


    Both bob and pwd are passed to the operating system or external authentication
    facility to perform the authentication approval, verifying that a user named bob
    is already defined, and that the password matches that user. If this part is successful,
    the operating system will return security control to DB2. Next, when bob executes
    a statement such as:


    ```

    SELECT * FROM mytable

    ```


    DB2 takes over security control to perform the authorization check and confirm
    that user bob has privilege on table myfile. If the authorization check fails,
    DB2 will return an error message, otherwise the statement will be executed against
    mytable.


    Note:

    For more information working with DB2 security, watch this video: http://www.channeldb2.com/video/video/show?id=807741:Video:4267


    # 10.1 Authentication


    Although the actual authentication is performed by the operating system through
    the default security plug-in (or another external security facility), DB2 does
    decide at which level authentication occurs.


    The database configuration parameter AUTHENTICATION, set at the DB2 server, has
    a range of possible values. For example, when the parameter is set to SERVER (the
    default), the authentication is performed by the operating system or external
    security facility on the server. However, if AUTHENTICATION is set to CLIENT,
    the authentication is performed by the operating system or external security facility
    at the client. This is shown in Figure 10.2.


    ![](img/5f8d773441634563b766a57e36213cf4_173_0.png)


    ![](img/5f8d773441634563b766a57e36213cf4_173_1.png)


    Figure 10.2 – Where authentication takes place


    The AUTHENTICATION parameter can be set to any of the values listed in Table 10.1'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# Chapter 10 – Database Security 175


    | Command | Description |

    | --- | --- |

    | SERVER (default) | Authentication takes place at the server |

    | CLIENT | Authentication takes place on the client |

    | SERVER_ENCRYPT | Like SERVER except user IDs and passwords are encrypted |

    | KERBEROS | Authentication takes place using a Kerberos security mechanism |

    | SQL_AUTHENTICATION_DATAENC | Server authentication plus connections must use
    data encryption |

    | SQL_AUTHENTICATION_DATAENC_CMP | Like above, except data encryption only when
    available |

    | GSSPLUGIN | Authentication uses an external GSS API-based plug-in security mechanism
    |


    Table 10.1 – Valid AUTHENTICATION parameter values


    # 10.2 Authorization


    Authorization consists of the privileges, authorities, roles, and label-based
    access control (LBAC) credentials that are stored in DB2 system tables and are
    managed by DB2.


    A privilege allows a user to execute a single type of operation against the database,
    as as CREATE, UPDATE, DELETE, INSERT, etc.


    A role allows you to group together different privileges that you can grant to
    a user, group, or other roles.


    An authority is a predefined role consisting of several privileges.


    Label-Based Access Control (LBAC) credentials include policies and labels supporting
    granular access to specific rows and columns by given users. LBAC is not included
    with DB2 Express-C, but you can read more about it in Chapter 2.


    # 10.2.1 Privileges


    Figure 10.3 shows some of the different privileges in DB2.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '176 Getting Started with DB2 Express-C


    ![](img/5f8d773441634563b766a57e36213cf4_175_0.png)


    # Figure 10.3 – Listing of some DB2 privileges


    A user or group receiving CONTROL privileges implies that they can also grant
    the privilege to some other user or group. Refer to the DB2 Information Center
    for details about the other different privileges.


    # 10.2.2 Authorities


    Authorities are classified in two groups:


    +   - Instance-level authorities: These authorities can operate at the instance
    level. For example, SYSADM.

    - Database-level authorities: These authorities can only operate at the database
    level. For example, DBADM.'
  merge: -1
