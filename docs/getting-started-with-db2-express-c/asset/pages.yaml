  md: '# 14.2.2 User-defined functions


    procedures with more complex logic, we recommend you use IBM Data Studio

    includes a debugger.


    A user-defined function (UDF) is a database application object that allows users
    to

    end the SQL language with their own logic. A function always returns a value or
    values

    normal as a result of the business logic included in the function. To invoke a
    function, use

    ithin a SQL statement, or with the values function. In DB2 you can develop UDFs
    in

    several languages including SQL PL, Java, C/C++, OO, CLR.


    This simple example shows how to create and call a SQL UDF from the DB2 Command

    Window or Linux shell:


    ```

    db2 create function F1() returns integer return 1000; end

    db values F1

    ```


    In the example, F1 is a function returning an integer value of 1000. The VALUES

    statement can be used to invoke the function. Like in the case of stored procedures,
    we

    recommend you create functions using IBM Data Studio.


    # 14.2.3 Triggers


    A trigger is an object that automatically performs an operation on a table or
    view.

    trigger action on the object where the trigger is defined causes the trigger to
    be fired. A

    tigger is normally not considered an application object; therefore, database developers

    normally don''t code triggers, but database administrators do. Because some coding
    is

    required, we have included triggers in this section. Below is an example of a
    trigger.


    ```

    create trigger validate no cascade before insert on T1

    referencing NEW as N

    for each row

    begin atomic

    set (N.myxmlcol) = XMLVALIDATE(N.myxmlcol)

    according to xmlschema id myxmlschema);

    end

    ```


    In this example, the trigger is fired before an INSERT operation on table T1.
    The trigger will

    insert the value (which is an XML document), but will invoke the XMLVALIDATE function
    to

    validate this XML document with a given schema. Chapter 15, DB2 pureXML talks
    more

    about XML and XML schemas.'
