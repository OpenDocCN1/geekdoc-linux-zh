  md: '# Chapter 14 - Introduction to DB2 Application Development 245


    Some programming APIs, use JDBC and ODBC, always use dynamic SQL regardless of
    the SQL statement includes known objects or not. For example, the statement SELECT
    lastname, salary FROM employee has all the columns and table names known ahead
    of time, through JDBC or ODBC, you do not precompile the statements. All the access
    plans for the statements are calculated at runtime.


    In general, two statements are used to treat a SQL statement as dynamic:


    +   - PREPARE: This statement prepares or compiles the SQL statement calculating
    the access plan to retrieve the data

    - EXECUTE: This statement executes the SQL


    Alternatively, you can execute a PREPARE and EXECUTE in one single statement:
    EXECUTE IMMEDIATELY


    Listing 14.1 shows an example on an embedded C dynamic statement that is prepared
    and executed.


    ```

    ```

    strcpy(hvStmtDyn, "SELECT name FROM EMP WHERE dept = ?");

    PREPARE StmtDyn FROM:hvStmtDyn;

    EXECUTE StmtDyn USING 1;

    EXECUTE StmtDyn USING 2;

    ```

    ```


    # Listing 14.1 - An embedded C dynamic statement using PREPARE and EXECUTE


    Listing 14.2 shows the same example as Listing 14.1, but using the EXECUTE IMMEDIATELY
    statement


    ```

    ```

    EXECUTE IMMEDIATELY SELECT name FROM EMP where dept = 1

    EXECUTE IMMEDIATELY SELECT name FROM EMP where dept = 2

    ```

    ```


    # Listing 14.2 - An embedded C dynamic SQL statement using EXECUTE IMMEDIATELY


    In many programming languages such as PHP or Ruby on Rails, where SQL is run dynamically,
    programmers need to use the same SQL statements with different values as follows:


    ```

    ```

    SELECT lastname, salary FROM employee where firstname = ''Raul''

    SELECT lastname, salary FROM employee where firstname = ''Jin''

    ```

    ```


    In this example, the statements are identical except for the value of the column
    firstname. DB2 considers these two dynamic SQL statements as different ones, and
    at runtime, it prepares and executes each statement independently. The overhead
    of preparing the same statement twice can cause performance degradation, therefore
    prior to DB2 9.7, the recommendation was to use code statements as follows:


    ```

    ```

    SELECT lastname, salary FROM employee where firstname = =

    ```

    ```'
