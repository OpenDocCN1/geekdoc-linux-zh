    # 5.11 Windows Vista considerations


    The User Access Control (UAC) feature in Windows Vista causes applications to
    start with standard rights, even if your user ID is a local administrator. This
    means that any DB2 tool or command you start in Vista will likely run, but will
    report problems related to access. To avoid this problem, the shortcut called
    "Command window - Administrator" specifically created at installation time for
    Vista. From this, you can run other commands and launch other tools (using the
    commands shown in Table 5.1 at the beginning of the chapter). Alternatively, from
    the Windows Vista start menu or any DB2 tool you want to launch, right-click on
    it, and choose the Run as administrator option.


    If DB2 extended security is enabled, which is the default (Chapter 10, Database
    Security for details), you must also ensure that your userID is a member of the
    DBADMINS group in order to launch graphical tools such as the Control Center.


    # 5.12 Summary


    In this chapter we looked at the wide array of tools available for administering,
    configuring, and managing your DB2 data server.


    The arrival in DB2 9.7 of the IBM Data Studio as the main administration tool
    provides a new dimension to database administration and development work.


    We also discussed a number of now deprecated GUI tools: the Control Center, the
    SQL Assist wizard, the Task Center and Journal, and the Health Agent and Monitor.
    However, the Command Line Processor and Command Window tools will continue to
    be a part of the application in versions after DB2 9.7. Also, the Self Tuning
    Management tool remains a big part of the database optimization process.


    A key component in the toolbox of any database administrator is the use of scripts
    to execute DB2 commands and functions. In this chapter, we took an in-depth look
    at how SQL and operating system (shell) scripts, in particular how they are composed,
    stored and executed.


