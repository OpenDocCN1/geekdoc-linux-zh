  md: "# Chapter 15 - DB2XML 285\n\nIn the above example, linies (1), (2), and (9)\
    \ are part of the SQL syntax. In line (2) the XMLQUERY function is invoked, which\
    \ calls the transform expression in line (4). The transform expression block goes\
    \ from line (4) to line (8), and it is used to insert a new node into the XML\
    \ document containing the ema12 element. Note that updating the elements in an\
    \ XML document which view is not supported.\n\nDeleting xml elements from documents\
    \ is table as straightforward when using the SELECT statement in SQL/XML. Use\
    \ the SQL DELETE statement and specify any necessary WHERE predicate.\n\n# 15.3.9\
    \ XML indexing\n\nIn an XML document, indexes can be created for elements, attributes,\
    \ or for values (text nodes). Assume the table below was created:\n\n```\nCREATE\
    \ TABLE customer(info XML)\n<customerinfo Cid=\"10044\">\n  <name>Matt Foreman</name>\n\
    \  <addr country=\"Canada\">\n    <street>1596 Baseline</street>\n    <city>Toronto</city>\n\
    \    <state>Ontario</state>\n    <pcode>M3E-5H9</pcode>\n  </addr>\n  <phone type=\"\
    work\">905-555-4789</phone>\n  <phone type=\"home\">416-555-3376</phone>\n  <assistant>\n\
    \    <name>Peter Smith</name>\n    <phone type=\"home\">416-555-3426</phone>\n\
    \  </assistant>\n</customerinfo>\n```\n\nAnd the XML document in Listing 15.28\
    \ is one of the documents stored in the table.\n\nListing 15.28 - The XML document\
    \ used in the examples to create XML indexes\n\nThe statement shown in Listing\
    \ 15.29 creates an index on the attribute Cid\n\n```\nCREATE UNIQUE INDEX idx1\
    \ ON customer(info)\nGEN KEY USING\nxmlpattern '/customerinfo/@Cid'\nAS sql DOUBLE\n\
    ```\n\nListing 15.29 - An index on attribute Cid\n\nThe statement shown in Listing\
    \ 15.30 creates an index on the element name\n\n```\nCREATE INDEX idx2 ON customer(info)\n\
    GENERATE KEY USING\nxmlpattern '/customerinfo/name'\n```"
