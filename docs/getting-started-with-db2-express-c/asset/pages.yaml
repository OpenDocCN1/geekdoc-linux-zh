  md: '# Listing 15.2 - A sample XML document


    Then the XQuery statement in Listing 15.3 using the FLWOR expression could be:


    ```

    xquery

    for $d in db2-fn:xmlcolumn(''dept.deptdoc'')/dept

    let $emp := $d/employee/name

    where $d/@bldg > 95

    order by $d/@bldg

    return

    <EmpList>

    {$d@bldg, $emp}

    </EmpList>

    ```


