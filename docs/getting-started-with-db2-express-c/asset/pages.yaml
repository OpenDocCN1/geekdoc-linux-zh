    \ 15.5 – XPath path axis\n\n# 15.3.3 Xquery basics\n\nXquery is a language created\
    \ for XML. Xquery supports path expressions to navigate the XML hierarchical structure.\
    \ In fact, XPath is a subset of Xquery; therefore, everything we learned earlier\
    \ about XPath applies to Xquery too. Xquery supports both typed and untyped data.\
    \ Xquery lacks null values because XML documents omit missing or unknown data.\
    \ Xquery and XPath expressions are sensitive, and Xquery returns sequences of\
    \ XML data.\n\nXquery supports the FLWOR expression. If we use SQL for an analogy,\
    \ it is equivalent to a SELECT-FROM-WHERE expression. The next section describes\
    \ FLWOR in more detail.\n\n# 15.3.3.1 Xquery: FLWOR expression\n\nFLWOR stands\
    \ for:\n\n+   - FOR: iterates through a sequence, binds a variable to them\n-\
    \ LET: binds a variable to a sequence\n- WHERE: eliminates items of the iteration\n\
    - ORDER: reorders items of the iteration\n- RETURN: constructs query results\n\
    \nIt is an expression that allows manipulation of XML documents, enabling you\
    \ to have another expression. For example, assume you have a table with:\n\n```\n\
    CREATE TABLE dept (id CHAR(8), dept-doc XML)\n```\n\nAnd the XML document in Listing\
    \ 15.2 is inserted in the deptdoc column\n\n```\n<dept bld=\"101\">\n  <employee\
    \ id=\"901\">\n    <name>John Doe</name>\n    <phone>408 555 1212</phone>\n  \
    \  <office>344</office>\n  </employee>\n  <employee id=\"902\">\n    <name>Peter\
    \ Pan</name>\n    <phone>408 555 9918</phone>\n    <office>216</office>\n  </employee>\n\
    </dept>\n```"
