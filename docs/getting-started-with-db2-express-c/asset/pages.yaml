    Every years, IBM publishes a new DB2 version. A version includes new features
    and significant improvements to the product. Currently, DB2 Version 9 is officially
    supported by IBM. A version may also have releases which are usually updates that
    include some new functionality but are not enough to warrant a new version. For
    example 9.5 and 9.7 are releases for DB2 Version 9. Over the past few years, IBM
    has come out with a new release of DB2 1-2 years apart; however new versions are
