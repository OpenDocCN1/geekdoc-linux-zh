    # 4.1.1 Environment variables


    Environment variables are set at the operating system level. One key environment
    variable is DB2INSTANCE. This variable indicates the active instance you are working
    on, and for which your DB2 commands would apply. For example, to set the active
    instance to myinst in Windows, you can run this operating system command:


    ```

