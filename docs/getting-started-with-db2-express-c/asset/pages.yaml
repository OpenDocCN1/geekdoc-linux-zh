  md: '# Chapter 11 – Backup and Recovery


    In this chapter, we discuss DB2 database logging, how to make a full or partial
    copy of your database using the BACKUP utility, and how to recover your data using
    the RESTORE utility.


    Note:


    For more information about logging, backup, and recovery, watch this video: http://www.channeldb2.com/video/video/show?id=807741:Video:4282


    # 11.1 Database Logging


    If you are working with a text editor, every time you want to ensure your document
    is saved, you click the save button. In the database world, a COMMIT statement
    does just that. Every time a COMMIT statement is executed, you guarantee that
    changes were made to the data, they will be saved somewhere.


    In a similar way, when you work with a text document, sometimes you will see at
    the bottom right corner a brief message saying “auto-saving”. In the database
    world, this happens as well, any operation you perform against the data, such
    as an UPDATE, INSERT or DELETE, will be saved somewhere as you perform it.


    That "somewhere" in the preceding paragraphs refers to the database logs. The
    database logs are stored on disk and are used to record actions of transactions.
    If there is a system or database crash, logs are used to playback and redo committed
    transactions during a recovery.


    Figure 11.1 provides a graphical overview of what happens when you are working
    with a database in terms of logging.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '![](img/5f8d773441634563b766a57e36213cf4_191_0.png)


    Figure 11.1 – Database logging


    In Figure 11.1, we see a table space and logs. Both of reside on disks, although
    we recommend that are not kept on the same disk. When an UPDATE operation takes
    place for example, the pages for the row(s) in question will be brought to the
    buffer pool (memory). The update changes are performed immediately, and sometimes
    when a log buffer is full. If a COMMIT is issued after the UPDATE, the old and
    new values will be stored in the log files immediately. This process is repeated
    for many other SQL operations that are performed on the database. Only when certain
    conditions are met, such as reaching the change page threshold specified in the
    CHNGPGS_THRES parameter, are the pages in buffer pool “externalized” and written
    to the table space disk. The CHNGPGS_THRES parameter indicates the percentage
    of the buffer pool with “dirty” pages, that is, containing changes.


    From a performance point of view, it does not make sense to perform two writes
    for each COMMIT operation: one to write to the logs, and another to write to the
    table space disk; that’s “externalization” of the data to the table space disk
    only occurs when parameters such as the CHNGPGS_THRES threshold are reached.


    # 11.2 Types of logs


    There are two types of logs:


    +   - **Primary logs**nThese are pre-allocated and the number of primary logs
    available is determined by the LOGPRIMARY database configuration parameter.

    - **Secondary logs**nThese are dynamically allocated as needed by DB2. The maximum
    number of secondary logs is set by the database configuration parameter LOGSECOND.
    Dynamically allocating a log is costly; therefore, for day to day operations,
    stay within your primary log allocation. Secondary logs are deleted when all the
    connections to a database are terminated.'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'Infinite logging is possible if you set LOGSECOND to a value of -1; however,
    this is not recommended as you may run out of file system space.


    # 11.3 Types of logging


    There are two types of logging: circular logging (default) and archive logging.


    # 11.3.1 Circular logging


    Circular logging is the default, and is enabled when both of the LOGARCHMETH1
    and LOGARCHMETH2 database configuration parameters are set to OFF. These parameters
    indicate the method used to archive the logs, but if you turn them off, means
    you do not want to archive the logs, which is how circular logging works. Figure
    11.2 outlines an example circular logging.


    | Primary Log | Primary Log | Primary Log | Secondary Log | Secondary Log |

    |---|---|---|---|--|

    | P1 | P2 | P3 | S1 | S2 |


    Figure 11.2 – Working with primary and secondary logs


    In While there are 3 primary logs, therefore we can assume that the value of the
    LOGPRIMARY parameter is 3. For simplicity, there is only one transaction being
    performed in this example. As the transaction is performed, the log file P1 filling
    up, and then P2. If a commit occurs and the information is later externalized
    to the table space disk, then P1 and P2 can be overwritten, because the information
    is no longer needed for recovery (which will be discussed in more detail in this
    chapter). On the other hand, the transaction is so long that it uses P1, P2, P3,
    and still needs more log space because the transaction has not been committed
    or externalized, then a secondary log (S1 in the figure) is dynamically allocated.
    If the transaction continues, more secondary logs are allocated until the maximum
    LOGSECOND logs are allocated. If more logs are needed, an error message indicating
    a log full condition is reached to the user, and the transaction will be rolled
    back. Alternatively, you can configure DB2 using the BLK_LOG_DSK_FULL parameter
    to continue writing to the logs every 5 minutes while letting some transactions
    hang. This gives the DBA some time to find space, so that the transaction can
    continue.


    Circular logging allows you to recover from crash recovery, but if you want to
    recover the data to a given point in time, the closest available time would be
    when you took your last offline backup.'
  merge: -1
  pgno: 192
- img_proc: true
  md: '194 Getting Started with DB2 Express-C


    # 11.3.2 Archive logging


    Archive logging, also known as retain logging, the log files are not overwritten,
    but are kept, either online or offline. Online archive logs remain with the active
    logs which are still needed for crash recovery. Offline archive logs are moved
    to other media such as tape, and this can be done with USEREXIT routines, Tivoli
    Storage Manager, or other third party products.


    To enable logging set the database configuration parameters LOGARCHMETH1 or LOGARCHMETH2
    (or both) to a value other than OFF. Another way is to set the LOGRETAIN configuration
    parameter to RECOVERY. This will automatically cause LOGARCHMETH1 to be set to
    LOGRETAIN. However, the LOGRETAIN parameter is deprecated and has normally used
    for compatibility with older versions of DB2.


    Archive logging is normally used in production systems; because logs are kept,
    this allows for database recovery to point in time as early as the oldest log
    file. With archive logging, a DBA can recover from errors caused by humans. For
    example, if a user of a system inadvertently starts an incorrect transaction that
    lasts for days, then when the problem is detected, the DBA can restore the system
    to the time before the problem was introduced. However, there may be manual manipulation
    required for the transaction to recover correctly.


    Archive logging is required for forward recovery and on-line backup. Figure 11.3
    depicts the archive logging process.


    ![](img/5f8d773441634563b766a57e36213cf4_193_0.png)


    ONLINE ARCHIVE: Contains information for committed and externalized transactions.
    Stored in the ACTIVE log subdirectory.


    ACTIVE LOGS: Contain information for non-committed or non-externalized transactions.


    OFFLINE ARCHIVE: Archive moved from ACTIVE log subdirectory


    Figure 11.3 – Archive logging'
  merge: -1
  pgno: 193
