  md: '# Chapter 15 - DB2 pureXML 291


    DB2 also supports XML Schema evolution. This means that if your XML Schema changes,
    you can update the XML Schema easily with the UPDATE XMLSCHEMA command. If the
    changes to the XML Schema are too drastic, you are likely to get some errors.


    DB2 XML decomposition or "shredding" is also supported. This is the "old" method
    to store XML in databases, and is what other vendors use to store XML. DB2 still
    supports this method if you wish to use it; but we recommend pureXML. DB2 also
    supports the Extender, using the old method to store XML, this extender will no
    longer be enhanced.


    With 9.7 all the benefits of pureXML have been extended to database partitions
    commonly used for data warehouses. Database Partitioning Feature (DPF) is offered
    by DB2 Enterprise Edition.


    ![](img/5f8d773441634563b766a57e36213cf4_290_0.png)


    # 15.6 Summary


    This chapter introduced you to XML and pureXML technology. XML usage is growing
    exponentially due to Web 2.0 tools and techniques as SCA. By storing XML documents
    in a DB2 database you can take advantage of security, performance, and coding
    flexibility using pureXML. pureXML is a technology that allows you to store the
    XML documents in parsed-hierarchical format, and this is done at database insertion.
    At time, there is no need to parse the XML document in order to build a tree before
    processing. The tree for the XML document was already built and stored in the
    database. In addition, pureXML technology uses a native XML engine that understands
    XQuery; therefore, there is no need to map XQuery to SQL which is done in other
    RDBMS products.


    The chapter also talked about how to insert, delete, update and query XML documents
    using SQL/XML and XQuery. It also discussed XML indexes, XML Schema, and other
    features such as compression and XML Schema evolution.


    # 15.7 Exercises


    Throughout this chapter, you have seen several examples of SQL/XML and XQuery
    syntax and have been introduced to the DB2 Command Editor and IBM Data Studio.
    In this exercise, you will test your SQL/XML and XQuery knowledge while gaining
    experience with these tools. We will use the mydb database created using the table_creation.txt
    script file which was explained earlier in this chapter (Listing 15.5).


    # Procedure


    +   1. Create the mydb database and load the XML data, as discussed earlier in
    the chapter. The file table_creation.txt is included in the accompanying file
    Expressc_book_exercises_9.zip follows. Chapter 2. Run the table_creation.txt script
    file from a DB2 Command Window or Linux shell as:


    ```

    db2 -tvf table_creation.txt

    ```'
