    # 8.3.5 Declared global temporary tables (DGTTs)


    Declared temporary tables are created in memory and used by an application and
    dropped automatically when the application terminates. These tables can only be
    accessed by the application that created them, and they do not exist in any DB2
    catalog tables. Accessing these tables provides very efficient performance because
    there is no catalog content, no locking of rows, no default logging (logging is
    optional), and no authority checking. There is also index support for these temporary
    tables, that is, any standard index can be created on a temporary table. You can
    also run RUNSTATS against these tables.


    Declared temporary tables reside inside a user temporary table, which must be
    defined before creating any declared temporary tables. The statements in Listing
    8.7 provide an example on how to create three declared temporary tables:


    ```

    CREATE USER TEMPORARY TABLESPACE app-temps

    MANAGED BY SYSTEM USING (''apptemps'');


    DECLARE GLOBAL TEMPORARY TABLE employees

    LIKE employee NOT LOGGED;


    DECLARE GLOBAL TEMPORARY TABLE tempdept

    (deptid CHAR(6), deptname CHAR(20))

    ON COMMIT DELETE ROWS NOT LOGGED;


    DECLARE GLOBAL TABLE ( fullselect ) DEFINITION ONLY

    ON COMMIT PRESERVE ROWS NOT LOGGED

    WITH REPLACE IN TABLESPACE app-temps;

    ```


    # Listing 8.7 - Working with DGTTs


    When a declared temporary table is created, its schema is SESSION; this schema
    must be specified when referencing the DGTT. The user ID used to create a temporary
    table will have all privileges on it. Each application that creates a temporary
    table will have its own independent copy as shown in Figure 8.3.'
