  md: '# 7.1.2 Local database directory


    This directory contains information about databases that you can connect to and
    that reside on your machine. To review the contents of this directory, issue the
    command:


    ```

    list db directory on <drive/path>

    ```


    # 7.1.3 Node directory


    This directory includes information about how to connect to a given remote database.
    For example, if the TCP/IP protocol is used, a TCP/IP node entry would include
    the IP address of the server where the DB2 database you are trying to connect
    resides, and the port of the instance where this database resides. To review the
    contents of this directory, issue the command:


    +   - list node directory


