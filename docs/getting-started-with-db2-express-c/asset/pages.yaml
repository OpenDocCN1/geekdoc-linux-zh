    # 5.9 Self-tuning memory manager


    The self-tuning memory manager (STMM) introduced in DB2 9 is one of several autonomic
    features that simplifies the task of memory configuration by automatically setting
    values for several memory configuration parameters. When enabled, the autonomic
    tuner dynamically distributes available memory resources among several memory
    consumers for the database. The memory tuner responds to changes in workload characteristics,
    adjusting the values of memory configuration parameters and the size of buffer
    pools to optimize performance. To turn on STMM update the db cfg SELF_TUNING_MEM
    to ON.


    Other autonomic computing features such as automatic maintenance and storage are
    discussed elsewhere in this book.


