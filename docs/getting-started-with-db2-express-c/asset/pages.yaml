  md: '# Chapter 12 – Maintenance Tasks


    This chapter discusses some of the tasks required to keep your database well maintained.
    The overall direction in DB2 is to automate most of these tasks. DB2 Express-C
    edition, like all current DB2 editions, includes these automated capabilities.
    This self management capability is a great benefit to small and medium size companies
    who cannot hire a full time DBA to manage the data server. On the other hand,
    if a DBA is hired, he or she will have more free time to perform advanced activities
    that will add value to a company''s bottom line.


    > Note:

    For more information about maintenance tasks, watch this video: http://www.channeldb2.com/video/video/show?id=807741:Video:4302


    # 12.1 REORG, RUNSTATS, REBIND


    There are three main maintenance tasks in DB2, as depicted in Figure 12.1: REORG,
    RUNSTATS and REBIND.


    ![](img/5f8d773441634563b766a57e36213cf4_204_0.png)'
  merge: -1
  pgno: 204
- img_proc: true
  md: '206 Getting Started with DB2 Express-C


    Figure 12.1 shows that the maintenance tasks are performed in circular fashion.
    If a REORG is performed, it is recommended to also run a RUNSTATS, followed by
    a REBIND. After some time, the tables in a database will be modified by UPDATE,
    DELETE and INSERT operations. At that time the cycle will start again with a REORG.


    #  12.1.1 The REORG command


    Over time, as you perform INSERT, UPDATE and DELETE operations on your database,
    your data starts getting more and fragmented across the database pages. The REORG
    command claims wasted space and re-organizes data to make retrieval more efficient.
    Tables that are frequently modified will benefit from the most REORG. You can
    REORG indexes as well as tables, and a REORG can be performed online or offline.


    Offline REORG is faster and more efficient, but does not permit access to the
    table, while an online REORG allows access to the table, but can consume a lot
    of system resources; this works best for small tables.


    Syntax:


    ```

    REORG TABLE <tablename>

    ```


    Example:


    ```

    REORG TABLE employee

    ```


    The REORGCHK command can be used before a REORG to determine whether a table or
    index needs to be fixed.


    #  12.1.2 The RUNSTATS command


    The DB2 Optimizer is the "brain" of DB2. It finds the most efficient access paths
    to retrieve data. The optimizer system is cost-aware, and uses statistics of the
    database objects that are stored in catalog tables to maximize the database performance.
    For example, catalog tables has statistics about how many columns are present
    in a table, how many rows are there, and how many type of indexes are available
    for a table, and so forth.


    Statistics information is not updated dynamically. This is by design, as you would
    not want DB2 to be updating statistics constantly for every operation performed
    to the database; this would negatively affect the entire database performance.
    Instead, DB2 provides the RUNSTATS command to update these statistics. It is essential
    to keep database statistics up to date. The DB2 optimizer can make radical changes
    in the access path if it thinks a table has 1 row versus 1 million rows. When
    statistics are up to date, DB2 can choose a better access plan. The frequency
    of statistics gathering should be determined by how often the data in the table
    changes.


    Syntax:


    ```

    RUNSTATS ON TABLE <schema.tablename>

    ```'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'Example:


    ```

    RUNSTATS ON TABLE myschema.employee

    ```


    # 12.1.3 BIND / REBIND


    After successfully running a RUNSTATS command, not all queries will use the latest
    statistics. Static SQL access plans are determined when you first issue a BIND
    command, so the statistics used at that time may not be the same as the current
    ones. Figure 12.2 illustrates this idea.


    ![](img/5f8d773441634563b766a57e36213cf4_206_0.png)


    # Figure 12.2 – Static SQL bind process


    In Figure 12.2 an embedded C program (stored as a file with a "sqc" extension)
    is precompiled. Before pre-compilation, two files are generated, a ".c" file containing
    the C code with all the SQL commented out; and a ".bind" file containing all the
    SQL statements. The C file with the ".c" extension is compiled as usual with a
    C compiler, creating a "library" as a package that is stored in the database.
    Binding is shown in the top right hand of the figure. The "bind" file is similarly
    handled, generating a package by compiling the SQL statements where the best access
    plan is determined based on the statistics available at the time, and storing
    them in the package.


    What happens if 1 million rows are inserted into a table using the SQL for this
    embedded C program? After the insertion, if a RUNSTATS is performed, the statistics
    will be updated; however the package will not be automatically updated to recalculate
    the access path based on the latest statistics. The db2rbind command can be used
    to rebind all the existing packages to take into account the latest stats.


    Syntax:


    ```

    db2rbind database_alias -l <logfile>

    ```'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Getting Started with DB2 Express-C


    Example:


    To rebind all the packages of the SAMPLE database and store the output log in
    the file mylog.txt, use this command:


    ```

    db2bind sample -i mylog.txt

    ```


    # 12.1.4 Maintenance tasks from the Control Center


    From the Control Center you can REORG and RUNSTATS. *Figure 12.3* shows how.


    ![](img/5f8d773441634563b766a57e36213cf4_207_0.png)


    *Figure 12.3* REORG and RUNSTATS from the Control Center


    You choose the task you would like to operate on, right-click on it and choose
    Reorganize (for REORG) or Run Statistics (for RUNSTATS).


    # 12.1.4.1 The database operational view


    When you select a database, the database operational view on the bottom right
    side of the Control Center will provide information about the database, such as
    its size, when it was backed up last, which automatic maintenance is set, etc.
    This view allows you to quickly identify needs for your database. *Figure 12.4*
    shows this information.'
  merge: -1
  pgno: 207
