    \ case sensitive. The above functions are XQuery interface functions so all the\
    \ table and column names should be passed to these functions in uppercase. Passing\
    \ the object names in lowercase may result in an undefined object error.\n\n#\
    \  15.3.6 Joins with SQL/XML\n\nThis section describes how to perform JOIN operations\
    \ between two XML columns of different tables, or between one XML column and one\
    \ relational column. Assume you have created two tables with the statements shown\
    \ in Listing 15.20\n\n```\nCREATE TABLE dept (unitID CHAR(8), dept XML)\nCREATE\
    \ TABLE unit (unitID CHAR(8) primary key not null,\n  name CHAR(20),\n  manager\
    \ VARCHAR(20),\n)\n```\n\n**Listing 15.20** - DDL of tables to use in the JOIN\
    \ examples\n\nYou can perform a JOIN operation in either of two ways. The first\
    \ method is shown in Listing 15.21.\n\n```\nSELECT u.unitID\nFROM dept d, unit\
    \ u\nWHERE XMLEISTS (\n  $//employee[name = $m]\n  passing d.dept as \"e\", u.manager\
    \ as \"m\")\n```\n\n**Listing 15.21** - First method to perform a JOIN with SQL/XML"
