  md: '![](img/5f8d773441634563b766a57e36213cf4_60_0.png)


    Figure 4.3 – The default DB2 instance created


    To create a new DB2 instance, use the command db2icrt <instance name>, where <instance
    name> is replaced with any 8 character name. For example, to create the instance
    `myinst`, we use this command: `db2icrt myinst`.


    Figure 4.4 shows a new instance called `myinst` as a separate green box on the
    right side.


    ![](img/5f8d773441634563b766a57e36213cf4_60_1.png)


    Figure 4.4 – A DB2 server with two instances


    Note that each instance has a unique port number. This helps to distinguish between
    instances when you want to connect to a database in a given instance from a remote
    client using TCP/IP. If you use the DB2 Command Window, you can make any DB2 instance
    the active one by using this operating system command on Windows.


    ```

    set db2instance=myinst

    ```'
