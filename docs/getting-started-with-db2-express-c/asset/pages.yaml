    ![](img/5f8d773441634563b766a57e36213cf4_59_0.png)


    Figure 4.2 – Representation of a DB2 Server after installing DB2 Express-C 9.7


    As part of the installation in Windows, a default instance called DB2 (db2inst1
    on Linux) is created. This is represented by the green box on the left of Figure
    4.3. An instance is simply an independent environment where applications can run,
    and databases can be created. You can create multiple instances on a data server,
    and use them for different purposes. For example, one instance can be used to
    hold databases for production use, another instance can be used for test environment
    databases, and another one for a development environment. All of these instances
    are independent; that, is, performing operations on one instance will not affect
    the other instances.'
