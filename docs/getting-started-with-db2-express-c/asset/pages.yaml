- img_proc: true
  md: '# Chapter 2 – Related features and products 39


    Support for most PL/SQL data types has also been incorporated such as BINARY_INTEGER,
    RAW, and so on. Other Oracle data types such as VARCHAR2 are supported without
    the need for the SQL Compatibility feature, but you need to enable them using
    the DB2_COMPATIBILITY_VECTOR registry variable. There is more explanation about
    Oracle data types and this registry variable later in the book.


    The SQL compatibility features outlined above are currently available with DB2
    9.7 Workgroup and Enterprise editions. They are expected to be available in DB2
    Express edition (including the yearly Subscription option or FTL) in the near
    future.


    While PL/SQL support and CLPPPlus features are not available in DB2-C 9.7, other
    features included to simplify enablement of Oracle applications to DB2. These
    include new data types, new scalar functions, module support, and currently committed
    (CC) semantics for the cursor stability (CS) isolation level. These features are
    discussed later in the book.


    # 2.3 Fee-based products that are related to DB2


    This section provides a brief description of fee-based products and offerings
    that can be used with DB2.


    # 2.3.1 DB2 Connect


    DB2 Connect is fee-based software that allows a DB2 for Linux, UNIX or Windows
    client to connect to a DB2 for z/OS or DB2 for i5/OS server as shown in Figure
    2.5. DB2 Connect is not required when the connection occurs in the opposite direction;
    when you connect from DB2 for z/OS or DB2 for i5/OS to a DB2 for Linux, UNIX or
    Windows server. DB2 Connect comes in two main editions depending on your connection
    needs: A DB2 Connect Personal Edition, and a DB2 Connect Enterprise Edition.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 2.3.2 InfoSphere Federation Server


    Formerly known as WebSphere Information Integrator (for federation support), the
    WebSphere Federation Server allows for federation of databases, meaning that you
    can run database queries that can work with objects from different relational
    database systems. For example, if you buy WebSphere Federation Server, you can
    run the query shown in Listing 2.1 below.


    ```

    SELECT *

    FROM Oracle.Table1 A

    DB2.Table2 B

    SQLServer.Table3 C

    WHERE A.col1 = 1000

    and C.col2 = ''Test''

    ```


    Listing 2.1 - A federated query


    Figure 2.6 provides an illustration where WebSphere Federation Server is used.


    ![](img/5f8d773441634563b766a57e36213cf4_39_0.png)'
  merge: -1
