  md: '# Chapter 6 – DB2 Architecture


    In this chapter we briefly discuss the DB2 architecture. You will learn about:


    +   - The DB2 process model

    - The DB2 memory model

    - The DB2 storage model


    > Note:

    For more information about the DB2 architecture, watch this video:

    http://www.channeldb2.com/video/video/show?id=807741:Video:4482


    # 6.1 DB2 process model


    Figure 6.1 depicts the DB2 Process Model. In this figure, rectangles represent
    processes while ellipses represent threads. The main DB2 process is called db2sysc.
    Under this process there are several threads, the main one is also called db2sysnc.
    This is the main thread that spawns other threads. When a remote application tries
    to connect to the server using an SQL CONNECT statement, the remote listeners
    for the communication protocol will receive this request and contact a DB2 coordinator
    agent (db2agent). A DB2 agent is a little worker that performs operations on behalf
    of DB2. When the application is local, that is, on the same server as DB2, the
    steps are very similar, only that a db2pcm agent handles the request instead of
    the db2pcm thread. As when parallelism is enabled, a db2agent may spawn other
    agents which appear as db2agnit threads. Other agents shown in the figure such
    as db2pichr, db2loggr, db2lock may also be used for different purposes. Most common
    processes are described in Table 6.1, and most common threads are described in
    Table 6.2.'
  merge: -1
  pgno: 108
- img_proc: true
  md: '# Getting Started with DB2 Express-C


    ![](img/5f8d773441634563b766a57e36213cf4_109_0.png)


    Figure 6.1 – The DB2 Process Model


    | Process Name | Description |

    | --- | --- |

    | db2sysc (Linux) | The main DB2 system controller or engine. Starting in DB2
    9.5, there is only one multi-threaded main engine process for the entire partition.
    All Engine Dispatchable Units (EDUs) are threads inside this process. Without
    this process, the database server cannot function. |

    | db2acd | The autonomic daemon. It is used to perform client side automatic tasks,
    such as health monitor, automatic maintenance utilities, and the admin scheduler.
    This process was formerly called db2hmon. |

    | db2wdog | The watchdog is the parent of the main engine process, db2sysc. It
    cleans up resources if the db2sys process abnormally terminates. |

    | db2vend | The fenced vendor process introduced in DB2 9.5 All 3rd party vendor
    code runs in this process outside of the engine. 3rd party vendor applications
    are programs that can interact with DB2; for example, log archiving can be managed
    by a 3rd party vendor code by specifying a user exit routine parameter to point
    to this. |

    | db2fmp | Fenced processes that run user code on the server outside the firewall
    for both stored procedures and defined functions. This process replaces both db2udf
    and db2dari processes that were used in |'
