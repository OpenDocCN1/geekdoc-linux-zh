  md: '# # Chapter 7 – DB2 Client Connectivity


    This chapter covers the setup required to connect from a DB2 client to a DB2 server
    using TCP/IP. Note that a DB2 server comes with a client component, so a DB2 server
    can also behave as a client to connect to another DB2 server. There are several
    ways to set up DB2 client connectivity; however, in this chapter we discuss only
    the easiest method which is still used by the Configuration Assistant.


    Note:


    For more information about the DB2 Client Connectivity, watch this video: http://www.channeldb2.com/video/show?id=807741:Video:4222


    Starting with DB2 9.7, the Configuration Assistant has been deprecated; however,
    it can still be used and is included with the product.


    # ## 7.1 DB2 Directories


    DB2 directories are binary files that store information about which databases
    you can connect to from your machine. There are four directories:


    +   - System database directory

    - Local database directory

    - Node directory

    - DCS directory


    Reviewing and updating the contents of all of these directories can be performed
    through the Configuration Assistant GUI tool.


    # ### 7.1.1 System database directory


