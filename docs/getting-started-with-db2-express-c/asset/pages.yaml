    # 11.6 Database backup


    The DB2 backup command allows you to take a snapshot copy of your database at
    the time the command is executed. The simplest syntax that you can run for this
    command is:


    ```

    BACKUP DATABASE <dbname> [ TO <path> ]

    ```


    Most commands and utilities can be performed online or offline. Online implies
    that other users may be connected and performing operations on the database while
    you execute your command. Offline means that no other users are connected to the
    database while you perform your operation. To allow for an online operation, add
    the keyword ONLINE to the'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 198 Getting Started with DB2 Express-C


    command syntax, otherwise, by default the command will be assuming you are executing
    it offline.


    For example, if you want to back up the database SAMPLE to the path C:\BACKUPS
    you can issue this command from the DB2 Command Window or Linux shell:


    ```

    db2 BACKUP DB SAMPLE TO C:\BACKUPS

    ```


    Note that the C:\BACKUPS directory must exist prior to executing the command.
    Also ensure there are no connections to the database when you execute the command,
    otherwise you will receive an error message since an offline backup cannot be
    performed when there are connections.


    To find out if there are connections to databases in an instance, issue this command
    from the DB2 command window or Linux shell:


    ```

    db2 list applications

    ```


    To force all the connections from all databases in an instance, issue this command
    from the DB2 command window or Linux shell:


    ```

    db2 force applications all

    ```


    You may not want to run this command in a production environment with many users;
    otherwise you would receive many calls from angry co-workers! Note as well that
    the last command runs asynchronously. This means that when you try to run the
    backup command right after, it may still not work. Wait a few seconds, and repeat
    the backup command if you received an error the first time.


    After a successful execution of the backup command, a new file containing the
    backup database image is created. The name of this file follows the convention
    shown in Figure 11.6.


    # Linux/UNIX/Windows


    | Alias Instance Minute Day Sequence |

    | DBALIAS.0.DB2INST.NODE0000.CATN0000.20060314131259.001 |

    | Type Node Catalog Node Month Hour Second |


    Figure 11.6 – Backup image naming convention


    A type of "0" means that the backup is a full backup. A type of "3" means that
    it is a table space backup. The node is fixed to NODE0000 for non-partitioned
    databases, which is the case for all DB2 editions except DB2 Enterprise Edition
    with the DPF feature. The catalog node is also fixed to CATN0000. Refer to the
    DB2 manuals for more details.'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'Chapter 11 – Backup and Recovery


    When several backups are taken and stored in the same path, the timestamp at the
    end of the file name is used to distinguish between the backup images. As we will
    see on the next section, the RESTORE command can use this timestamp to restore
    from a specific backup.


    # ## 11.7 Database recovery


    A database recovery involves restoring your database from a backup and/or logs.
    If you just restore from a backup, you would be recreating the database as it
    existed at the time the backup was taken.


    If archive logging was enabled before the backup, you can not restore only a backup
    image, but as we see in the next section, a roll-forward recovery allows you to
    restore from a backup, and then apply (roll-forward) the logs to the end of the
    logs, or to a specific point in time.


    Note that the term “recovery” is often used in this section, but the command used
    for recovery is called RESTORE.


    # ## 11.7.1 Recovery types


    There are three types of recovery:


    +   * **Crash and restart recovery**

    Assume you are working on a desktop computer running important transactions to
    a DB2 database. Suddenly there is a power outage, or someone accidentally unplugs
    the power cord: what will happen to the database?

    The next time you start your computer, and start DB2, crash recovery will automatically
    be executed. In crash recovery, DB2 will automatically run the command RESTART
    DATABASE and will read/undo the transactions based on the active logs. When this
    command completes, you are guaranteed that your database will be in a consistent
    state, that is, whatever was committed will be saved, and whatever was not committed
    will be rolled back.


    +   * **Version or image recovery**

    This type of recovery implies that you are restoring from a backup image; therefore,
    your database would be put in the state it was at the time the backup was taken.
    Any transactions performed on the database after the backup was taken would be
    lost.


    +   * **Roll-forward recovery**

    With this type of recovery, you not only RESTORE from a backup image, but you
    also run the ROLLFORWARD command to apply the logs on top of the backup so that
    you can recover to a specified point in time. This type of recovery minimizes
    data loss.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# 11.7.2 Database restore


    Use the RESTORE command to recover a database from a backup image. The following
    syntax is the simplest that can be used for this command:


    ```

    RESTORE DATABASE <dbname> [from <path>] [taken at <timestamp>]

    ```


    For example, if you had a backup image file of the sample database with this name:


    | Alias | Instance | Year Day Minute Sequence |

    |---|---|---|---|---||

    | SAMPLE.0.DB2INST.NODE.CATN000.2006031413259.001 | | | | |

    | Type | Node | Catalog Node | Month Hour Second |


    You could perform the following:


    ```

    RESTORE DB sample FROM <path> TAKEN AT 2006031413259

    ```


    # 11.8 Operations with BACKUP and RESTORE


    The following lists some of the things you can also do with the BACKUP and RESTORE
    commands. We encourage you to review the DB2 manuals for additional details.


    +   - Backup a database in a 32-bit instance, and restore it on a 64-bit instance

    - Restore over a redirected instance when restoring into a system where there
    are a different

    number of disks than what was specified in the backup image

    - Backup or restore by table sample, rather than the entire database

    - Perform delta and incremental backups; delta backups record only the changes

    from one backup to next, while incremental backups record all the changes and

    accumulates them on each backup image

    - Backup from flash copy (correct hardware required)

    - Recover dropped tables (if the option was enabled for a given time)

    - Backup from one platform (for example, Windows) and restoring to another platform

    (for example, Linux) is not possible. Use db2look and db2move for this scenario.

    For DB2 2 instances that support UNIX operating systems, be aware that within
    the

    UNIX operating system, some platforms allow for backup and restore from one

    UNIX platform to another.


    # 11.9 Summary


    In this chapter we examined the function of logging in DB2, including the two
    types of logs

    (primary and secondary) and the two types of logging (circular and archive), and
    the'
  merge: -1
