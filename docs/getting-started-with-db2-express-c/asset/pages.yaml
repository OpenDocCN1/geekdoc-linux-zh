  md: '# 4.3 Summary


    In this chapter, we explored the DB2 environment, covering the concept and creation
    of instances and database, along with their common commands. From there, we looked
    at the other key aspects of instances, including table spaces: the three types
    of table space available, the tables, views, and indexes that can be created within
    the table space; bufferpools; and logs.


    Finally, we discussed the DB2 configuration structure, and how it can be changed
    in four different places, via: environment variables; the database manager configuration
    file; and the DB2 profile registry.


    # 4.4 Exercises


    The exercises in this section will allow you to explore the concepts discussed
    in this chapter, and will introduce you to the DB2 tools.


    # Part 1: Create a new database using the Create Database wizard


    In this part, you will create a database using the Create Database Wizard in the
    Control Center.


    Procedure


    +   1. From the Control Center Object View pane on the left side, right-click
    the *All Databases* folder and choose *Create Database -> With Automatic Maintenance*.
    This launches the Create Database Wizard.


    +   2. Specify the database name and location in the *Name* page of the wizard.
    Use the following values:


    ```nDatabase Name:          EXPRESS

    Default Drive (Windows): C:

    Default Path: (Linux):  /home/db2inst1

    Alias:                  This will default to EXPRESS if left blank

    Comment:                This is optional and can be left blank```


    Click on the *Next* button to continue to the next page of the wizard.


    > Note: On Windows, by default you can only create a database on a drive, not
    on a path. If you would like to create a database on a path, set the DB2 registry
    variable DB2_CREATE_DB_ON_PATH


    +   3. In the *Storage* page, do not make any changes, and click *Next*.


    +   4. In the *Maintenance* page, leave the default choice (Yes, I can specify
    an offline ...), and click *Next*.


    ![](img/5f8d773441634563b766a57e36213cf4_74_0.png)'
  merge: -1
  pgno: 74
- img_proc: true
  md: '76 Getting Started with DB2 Express-C


    +   5. Specify the offline maintenance time window in the Timing page of the wizard.
    Configure the window to start at 1AM Monday through Thursday for a 6 hour duration.
    Click the Next.


    +   6. Configure notification on the Mail Server page of the wizard. DB2 can automatically
    page someone, or send an email if a problem or unhealthy condition is detected.
    If you want to choose this, indicate an SMTP server for DB2 to use for sending
    email. For this exercise we don''t have an SMTP server, so leave this blank and
    click Next.


    Review the options selected on the Summary page of the wizard. Click the Finish
    to begin the database creation process. Database creation usually takes a few
    minutes, during which time progress indicator is displayed.


    # Part 2: Working with instances, databases, and configuration


    In this part, you will create a new instance, database, and change configuration
    parameters on a DB2 server on Windows. You can do it either from the Control Center
    or the DB2 Command Window. We provide the instructions using the DB2 Command Window.


    Procedure


    +   1. Open the DB2 Command Window by choosing Start -> Programs -> IBM DB2 ->
    DB2COPY1 (Default) -> Command Line Tools -> Command Window. Alternatively, the
    short way to start it is to choose Start -> Run, and type db2cmd.


    +   2. From the DB2 Command Window, create a new instance called newwininst


    ```

    db2icrt newwininst

    ```


    +   3. Switch to the newwininst instance and verify that it is indeed your current
    instance. Then start it.


    ```

    set db2instance=newwininst (Tip: No spaces before or after=" sign!)

    db2 get instance (This verifies that newwininst is the current instance)

    db2start

    ```


    +   4. Create a database newwindb with default values in instance newwininst.
    This takes a few minutes as DB2 creates internal objects in the database and provides
    some initial configuration.


    ```

    db2 create database newwindb

    ```


    +   5. Connect and disconnect from the new database newwindb. Drop it.


    ```

    db2 connect to newwindb

    db2 terminate

    db2 drop db newwindb

    ```'
