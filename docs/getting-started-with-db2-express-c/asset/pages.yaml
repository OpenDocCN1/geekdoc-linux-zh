  md: '# Getting started with DB2 9.7 couldn''t be easier. Read this book to:


    +   - Discover DB2 using its free edition - Express-C

    - Understand DB2 architecture, tools, security

    - Learn how to administer DB2 databases

    - Write SQL, XQuery, stored procedures

    - Develop database applications for DB2

    - Practice using hands-on exercises


    IBM Express-C is a no-charge edition of DB2 data server for managing relational
    and XML data with ease. No-charge means DB2 Express-C is free to download, free
    to build your applications, free to deploy into production, and free to embed
    and distribute with your solution. And, DB2 does not place any artificial limits
    on the size of databases, number of databases, or number of users.


    DB2 Express-C runs on Windows and Linux systems and provides application drivers
    for a variety of programming languages including C/C++, Java, .NET, PHP, Perl,
    and Ruby. Optional low-cost subscription and support with additional capabilities
    is available. If you require greater scalability or more advanced functionality,
    you can seamlessly deploy applications built using DB2 Express-C to other DB2
    editions such as Workgroup and Enterprise.


    This free edition of DB2 is ideal for developers, consultants, ISVs, DBAs, students,
    or anyone who intends to develop, test, deploy, or distribute database applications.
    Join the growing DB2 Express-C community today and take DB2 Express-C for a test
    drive. Start discovering how you can create next generation applications and deliver
    innovative solutions.


    To learn more or download DB2 Express-C visit:

    ibm.com/db2/express


    To socialize with the DB2 community and watch DB2-related videos and blogs, visit:


    Channeldb2.com


