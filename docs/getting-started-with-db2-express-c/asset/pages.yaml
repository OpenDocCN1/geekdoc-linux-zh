    Figure 13.9 – Lock escalation


    There are two main database configuration parameters related to lock escalation:


    +   - **LOCKLIST** – The amount of memory (in 4k pages) reserved to manage locks
    for all connected applications.

    "- **MAXLOCKS** – Maximum percentage of the entire lock list that a single application
    can use up."


    The default for both parameters is AUTOMATIC, meaning that the self-tuning memory
    manager (STMM) will modify the size. If you don''t enable STMM, and set your value
    self, these values will have an impact on when lock escalation occurs. For example,
    if you set LOCKLIST to 20K and MAXLOCKS to 22%, then lock escalation occurs when
    a single application requires more than 44k of memory (200 K * 22% = 44K). If
    lock escalation occurs Frequently with these settings, increase the value of LOCKLIST
    and MAXLOCKS. Lock escalation is not good for performance as it reduces concurrency.
    The DB2 diagnostic file (db2diag.log) can be used to determine whether lock escalation
    is occurring. See Appendix A to learn more about this article.


