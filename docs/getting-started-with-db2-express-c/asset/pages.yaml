    # 1.8 Moving to another DB2 edition


    As your database needs grow, you may need to upgrade to a DB2 edition that supports
    a larger hardware configuration. If this situation arises, it is easy to upgrade
    to another DB2 edition:


    +   * If you are upgrading from DB2 Express-C to DB2 Express (Fixed Term License)
    on the same computer, all you need to do is apply the license with the db2lic
    command.

    * If you are upgrading to another DB2 edition on the same computer system, uninstall
    DB2 Express-C, and then install the new DB2 edition. When you uninstall DB2 Express-C,
    your databases are not deleted (but a backup is always recommended).

    * If you are upgrading and the new edition will be installed on a different, larger
    computer using the same operating system, then install the new DB2 edition on
    the larger computer, move your databases to the smaller computer, move the backup
    images to the larger computer, and restore the backup images to databases on the
    larger computer. You also need to save the instance configuration (dbm cfg) from
    your smaller computer, and apply this configuration to the larger computer. The
    backup and restore commands are discussed in more details in Chapter 11, Backup
    and Recovery. The dbm cfg is discussed in more detail in Chapter 5, The DB2 Environment.


    +   * In either case, your client application will not need modification.


    # 1.9 Maintenance and updates for DB2 Express-C


    DB2 Express-C installations are refreshed periodically. These refreshes generally
    coincide with availability of new releases or versions or when there are significant
    number of bug fixes accumulated for the product. In the, refreshes for DB2 Express-C
    have typically been made available once a year. However, note that DB2 Express-C,
    being a nocharge unwarranted offering, does not come with any official maintenance
    releases or regularly scheduled fix packs (that are released several times a year).
    When a new or new release of DB2 Express-C is made available, the previous releases
    of DB2 Express-C are no longer maintained.


    As discussed, if you require access to security patches and regularly scheduled
    software updates or fix packs containing bugs, IBM offers the DB2 expressly subscription
    license (FTL). Once you purchase the subscription, the DB2 Express-C installation
    can be updated with the license key for FTL, which entitles you to DB2 technical
    support and access to updates and fix packs during the subscription license is
    valid. The subscription license also entitles you to free version upgrades, or
    if you prefer have the flexibility to stay at a particular version or release,
    and just apply fix packs and security patches for as long as release is supported
    and your yearly subscription is maintained.'
