    # 2.2.5 Workload Manager (WLM)


    The Workload Manager manages workloads across a database based on user and application
    priorities with combined resource availability and workload thresholds. It allows
    you to regulate your database workload and queries that so important and high-priority
    queries can run promptly, and prevent ''rogue'' queries from monopolizing your
    system resources, ensuring that your system runs efficiently. WLM has been further
    enhanced by DB2 9.7 and provides more powerful capabilities than Query Patroller
    and DB2 Governor tools available with previous versions of DB2.


