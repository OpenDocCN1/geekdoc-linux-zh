- img_proc: true
  md: "Line 4 of the statement in the above list showing the JOIN operation occurs\
    \ between\nthe element name, which is a sub-element of the dept XML column in\
    \ table dept, and\nthe manager relational column in the table unit.\n\nListing\
    \ 15.22 shows the method to perform the JOIN.\n\n```\nSELECT u.unitID\nFROM dept\
    \ d, unit u\nWHERE u.manager = XMLCAST(\n  XMLQUERY('$e//employee'\n    passing\
    \ d.deptdoc as \"u\")n  AS char(20));\n```\n\n# Listing 15.22 - Second method\
    \ to perform a JOIN with SQL/XML\n\nIn this second method, the relational column\
    \ is on the left side of the JOIN. If the relational\ncolumn is on the left side\
    \ of, a relational index may be used instead of an XML\nindex.\n\n# 15.3.7 Joins\
    \ with XQuery\n\nAssume the following tables have been created:\n\n```\nCREATE\
    \ TABLE dept (unitID CHAR(8), deptdoc XML)\nCREATE TABLE project (projectDoc XML)\n\
    ```\n\nIf we use SQL/XML, a JOIN would look as shown in Listing 15.23.\n\n```\n\
    SELECT XMLQUERY(\n  '$d/dept/employee' passing d.deptdoc as \"d\"\nFROM dept d,\
    \ project p\nWHERE XMLEXISTS(\n  '$e/dept[deptID=$s/project/deptID]'\n    passing\
    \ d.deptdoc as \"s\", p.projectDoc as \"p\")\n```\n\n# Listing 15.23 - A JOIN\
    \ with SQL/XML\n\nThe equivalent JOIN using XQuery is shown in Listing 15.24.\n\
    \n```\nxquery\nfor $dept in db2-fn:xmlcolumn(\"dept.DEPTDOC\")\nfor $proj in db2-fn:xmlcolumn(\"\
    PROJECT.PROJECTDOC\")\nwhere $dept/deptID = $proj/deptID\nreturn $dept/employee\n\
    ```\n\n# Listing 15.24 - A JOIN with XQuery\n\nThis method is easier to interpret\
    \ -- variable $dept holds the XML document of the\nXML column deptdoc in table\
    \ dept. The variable $proj holds the XML document of the\nXML column projectdoc\
    \ in table project. Then line 4 performs the JOIN operation\nbetween an attribute\
    \ of the first XML document and an element of the second XML\ndocument."
