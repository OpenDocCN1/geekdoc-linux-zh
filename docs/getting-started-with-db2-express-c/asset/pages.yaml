    # 2.2 Features not available with DB2 Express-C


    This section describes some of the features available in other editions of DB2
    but not in DB2 Express-C or the yearly subscription license for DB2 Express.


    # 2.2.1 Database Partitioning


    The database partitioning feature (DPF) provides distributed query processing
    across a cluster of database servers. It is only available with InfoSphere Warehouse
    Editions and allows data to be spread across multiple partitions or nodes which
    can reside in several different servers. DPF is based on a shared-nothing architecture
    where each database partition has a subset of the overall data on its own independent
    disks.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Chapter 2 – Related features and products 35


    Each computer, as it is added to the database cluster, brings additional data
    processing power with its own CPUs, memory, and disks, allowing for large tasks
    and complex queries to be broken down into smaller pieces and distributed across
    the various database nodes to be executed in parallel. This results in higher
    concurrency and faster response times than would be possible if the database resided
    on a single server. DPF is particularly useful in large data warehousing environments
    and business intelligence workloads involving anywhere from a few gigabytes to
    several hundreds of terabytes of data.


    # 2.2.2 Connection Concentrator


    Connection concentrator is a feature that allows for support of a large number
    of concurrently connected users. Previously, every database connection required
    one database agent. The connection concentrator introduces the concept of a “logical
    agent”, allowing one agent to handle several connections. Agents are discussed
    in more detail in Chapter 6, DB2 Architecture.


    # 2.2.3 Geodetic Extender


    DB2 Geodetic Extender is available as priced option for DB2 Enterprise Server
    Edition. This extender makes development for business intelligence and e-government
    applications that require geographical location analysis much easier. DB2 Geodetic
    Extender can construct a virtual globe at any scale. Most location information
    is collected using worldwide systems, such as global positioning satellites (GPS),
    and can be represented in latitude/longitude coordinates (geocode). Business data,
    such as addresses, can be converted to a geocode by DB2 Geodetic Extender and
    enterprise applications work better when they keep the data in this unprojected
    form, leaving map projections (earth to flat map) where they belong: in the presentation
    layer, to display and print maps.


    # 2.2.4 Label-based Access Control (LBAC)


    Label-based access control provides granular security at the row and column level.
    It uses a label that is associated with both user sessions and data rows or columns
    to grant access to data in your table. Figure 2.2 illustrates how LBAC works.'
