  md: "# 15.3.8 Update and delete operations\n\nUpdate and delete operations on XML\
    \ data can be performed in one of ways:\n\n+   - Using SQL UPDATE and DELETE statements\n\
    - Using the TRANSFORM expression\n\nFor the first way using SQL UPDATE and DELETE\
    \ statements, the update or delete occurs at the document level; that is, the\
    \ entire XML document is replaced with the updated one. For example, in the UPDATE\
    \ statement in Listing 15.25 below, if you'd only to change the <state> element,\
    \ the entire XML document is actually replaced.\n\n```\nUPDATE clients SET contact=(\n\
    xmlparse(document)\n  <Client>\n    <address>\n      <street>5401 Julio ave.</street>\n\
    \      <city>San Jose</city>\n      <state>CA</state>\n      <zip>95116</zip>\n\
    \    </address>\n    <phone>\n      <work>4084633000</work>\n      <home>4081111111</home>\n\
    \      <cell>4082222222</cell>\n    </phone>\n    <fax>408776666</fax>\n    <email>newmail@someplace.com</email>\n\
    \  </Client>\n) WHERE ID = 3227\n```\n\nListing 15.25 - An example of an SQL UPDATE\n\
    \nFor the second way, you can perform sub-document updates using the TRANSFORM\
    \ expression, which is a lot more efficient. This allows you to replace, insert,\
    \ delete or rename nodes in an XML document. You can also change the value of\
    \ a node without replacing the node itself, typically to change an element or\
    \ attribute value—which is a very common type of update. This support was added\
    \ in DB2.5.\n\nThe TRANSFORM expression is part of the XQuery language, you can\
    \ use it anywhere you normally use Xquery, for example in a FLWOR expression or\
    \ in the XMLQUERY function in an SQL/XML statement. The most typical use is in\
    \ an SQL UPDATE statement to modify an XML document in an XML column.\n\nListing\
    \ 15.26 shows the syntax of the TRANSFORM expression.\n\n```\n--transform--| copy\
    \ clause |-- modify clause |-- return clause |~|--<\n\ncopy clause\n```"
  merge: -1
  pgno: 282
- img_proc: true
  md: "# Getting Started with DB2 Express-C\n\n```\n-------------------------------------------------------------\n\
    V\n|--copy---$VariableName::=CopySourceExpression+-\nmodify clause\n--modify--ModifyExpression---\n\
    return clause\n--return--ReturnExpression--------------------\n```\n\nListing\
    \ 15.26 - The syntax of the TRANSFORM expression\n\nThe copy clause is used to\
    \ assign to a variable the XML documents you want to process.\nIn the modify clause,\
    \ you can invoke an insert, delete, rename, or replace expression. These expressions\
    \ allow you to perform updates to your XML document.\nFor example:\n\n+   * If\
    \ you want to add new nodes to the document, you would use the insert expression\n\
    * To delete nodes from an XML document, use the delete expression\n* To rename\
    \ an element or attribute in the XML document, use the rename expression\n* To\
    \ replace an existing node with a new node or sequence of nodes, use the replace\
    \ expression. The replace value of the expression can only be used to change the\
    \ value of an element or attribute.\n\nThe return clause returns the result of\
    \ the transform expression.\n\nListing 15.27 shows an example of an UPDATE statement\
    \ using the TRANSFORM expression.\n\n```\n(1)-- UPDATE customers\n(2)-- SET contactinfo\
    \ = xmlquery('declare default element namespace \n      \"http://posample.org\"\
    ;\n(3)--\n(4)-- transform\n(5)-- copy $newinfo := <email>my2email.gm.com</email>\n\
    (6)-- modify do insert\n(7)-- as last into $newinfo/customerinfo\n(8)-- return\
    \ $newinfo passing contactinfo as \"c\"\n(9)-- WHERE id = 100\n```\n\nListing\
    \ 15.27 - An UPDATE using the TRANSFORM expression"
  merge: -1
  pgno: 283
