  md: '# Foreword


    Innovation is the cornerstone of technological progress. At IBM, innovation has
    been an integral part of our data server evolution. Pioneered data management
    techniques in the 1960s and 1970s, IBM continues to deliver innovative information
    management technologies, as reflected in the thousands of management patents authored
    by IBM technologists. As a result, some of the largest organizations in the world
    rely on IBM products, including DB2, to power their most demanding and mission-critical
    data solutions.


    However, DB2 is no longer just for large enterprises. With the release of DB2
    Express-C, award-winning DB2 technology is now available to small and mid-size
    companies – and with no cost! Although there are other free or open-source data
    servers available, DB2 Express-C offers unique advantages over these alternatives.


    There are many technological advances present in DB2 Express-C. These innovations
    provide new capabilities, reduce administrative burdens, improve performance,
    and reduce infrastructure cost.


    DB2 C hybrid technology is capable of managing both relational and XML data in
    their native formats. This makes DB2 ideal for powering the new breed of SOA and
    Web 2.0 applications where XML data flows in abundance. Unlike other "free" data
    servers, DB2 Express-C does not limit the amount of data you store in a database
    or the number of databases you can create on a system. And of course, if you require
    support or assistance from IBM, help is just a click away.


    This book serves as a guide to getting started with using DB2 Express-C. It will
    assist you with understanding DB2 concepts and enable you to develop skills for
    DB2 administration and application development. The skills and knowledge you will
    gain are relevant to the other advanced editions of DB2 on Linux, UNIX, and Windows.


    While DB2 Express-C is not an open-source product, at IBM we much believe in supporting
    and fostering community initiatives. I am delighted that this book is developed
    by DB2 Express-C community members and will be freely available to anyone in the
    community. I encourage you to enrich and update this book with your know-how and
    experiences, and also to assist in translating this into other languages so others
    benefit.


    Arvind Krishna

    Arvind Krishna

    General Manager

    Information Management, IBM Software Group'
