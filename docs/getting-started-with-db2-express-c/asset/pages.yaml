    # 8.3.1 Oracle database server data types


    The following data types used in Oracle database server are now supported with
    DB2 data server: NUMBER, VARCHAR, TIMESTAMP(n), “DATE”, BOOLEAN BY, VARCHAR, Row
    Type, Ref Cursor. For them to work you first need to enable the DB2_COMPATIBILITY_VECTOR
    registry variable as follows:


    ```

    db2set DB2_COMPATIBILITY_VECTOR=FF

    db2stop

    db2start

    ```


    Once this registry variable is enabled, new databases will be able to support
    these data types. Some of these can only be used in the context where SQL PL is
    used.


    > Note:

    If you are using one of DB2 that supports the SQL Compatibility feature (described
    in Chapter 2), you can also use these data types with PL/SQL. If that’s the case,
    the value set for the registry variable DB2_COMPATIBILITY_VECTOR should be ‘FFF’
    instead of ‘FF’ as shown in the example above.


    # 8.3.1.3 Implicit casting or weak typing


    Many dynamic languages like Ruby on Rails or PHP allow for implicit casting. This
    was a problem in DB2 because of its strong typing requirements. With DB2 9.7,
    rules have been relaxed so that implicit casting or weak typing is allowed. What
    this means is, for example, you can now assign or compare strings to numeric types
    as shown below:


    ```

    create table t1 (col int)

    select * from t1 where col = ''42''

    ```


    In the example, ‘42’ can now be compared to the integer col1.

    in addition, with DB2 9.7 you are now allowed to specify untyped parameter markers
    and untyped NULLs in more situations. Previously, you had to explicitly cast them
    to a given data type. For example, the following statement works:


    ```

    select ?, NULL, myDF(?, NULL) from t1

    ```


    # 8.3.1.4 Null Values


    A null value represents an unknown state. The CREATE TABLE statement can define
    a column using the NOT NULL clause to ensure that the column contains a known
    data'
  merge: -1
