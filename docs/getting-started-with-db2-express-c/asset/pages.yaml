  md: '# 15.3.5.2 Querying XML data with XQuery


    In the previous section, we looked at how to query XML data using SQL with XML
    extensions. SQL was always the primary query method, and XPath or XQuery was embedded
    inside SQL. In this section, discuss how to query XML data using XQuery. This
    time, XQuery will be the primary query method, and in some cases, we will use
    SQL embedded inside XQuery (using the db2-fn:sqlquery function). When using XQuery,
    we will invoke a few functions, and will also use the FLWOR expression.


    # Example 1


    This is a simple XQuery to return customer contact data. In the example, CONTACT
    is the name of the XML column, and CLIENTS is the name of the table.


    ```

    xquery db2-fn:xmlcolumn(''CLIENTS.CONTACT'')

    ```


    Always prefix XQuery expression with the xquery command that DB2 knows it how
    to use the XQuery parser, otherwise DB2 will assume you are trying to run an SQL
    expression. The db2-fn:xmlcolumn function is a function that retrieves the XML
    documents from the column specified as the parameter. It is equivalent to the
    following SQL statement,:


    ```

    SELECT contact FROM CLIENTS

    ```


    # Example 2


    In this example shown in Listing 15.15, we use the FLWOR expression to retrieve
    client fax data


    ```

    xquery

    for $y in db2-fn:xmlcolumn(''CLIENTS.CONTACT'')/Client/fax

    return $y

    ```


    # Listing 15.15 - XQuery and the FLWOR expression


    The first line invokes the XQuery parser. The second line instructs DB2 to iterate
    through the fax sub-elements contained in the CLIENTS column. Each fax element
    is bound to the variable. The third line indicates that for each iteration, the
    value "y" is returned.


    The output of this xquery is illustrated in Listing 15.16 (We omit the namespace
    in the output, otherwise would be harder to read as it may span several lines):


    ```

    <fax>40811122222</fax>

    <fax>5559998888</fax>

    ```


    # Listing 15.16 - Output of the query show in Listing 15.15


    # Example 3


    The example in Listing 15.17 queries XML data and returns the results as HTML.'
