    # 15.4 Working with XML Schemas


    DB2 allows you to insert an XML document into the database if it is well-formed.
    If it''s not, you will receive an error at insertion time. On the other hand,
    DB2 does not force you to validate a XML document. If you wish to have an XML
    document validated, you have several alternatives as we will discuss in this section.


    # 15.4.1 Registering your XML Schemas


    XML Schemas are stored in the DB2 databases in what is called an XML Schema repository.
    To add an XML Schema to a repository, you use the REGISTER XMLSCHEMA command.


    For example, let''s say you have an XML document stored in file `order.xml` as
    shown in Figure 15.10'
