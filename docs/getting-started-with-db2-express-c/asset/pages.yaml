    Center URL.


    # 14.7 Other development


    Some users of DB2 Express-C also interact with third party products such as MS
    Excel and MS Access to create simple forms that connect to DB2. In this section
    we describe how to work with these products and DB2 Express-C.


    DB2 Express-C is available also on Mac OS X, so you can use DB2 natively to develop
    database applications on a Mac. This may be especially appealing to the RoR community
    who has embraced the Mac platform.


    # 14.7.1 Working with Microsoft Access and Microsoft Excel


    Microsoft Excel and Microsoft Access are popular tools to generate reports, create
    forms, and develop simple applications that provide some business intelligence
    to your data. DB2 interacts very easily with these tools. A DBA can store the
    company data in a secure DB2 server, and regular users with Access or Excel can
    access this data and generate reports. This is illustrated in Figure 14.9'
