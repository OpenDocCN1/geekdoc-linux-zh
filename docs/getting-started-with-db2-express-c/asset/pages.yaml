- img_proc: true
  md: 'Getting Started with DB2 Express-C


    ![](img/5f8d773441634563b766a57e36213cf4_113_0.png)


    Figure 6.4 – Create a buffer pool dialog box


    Most entries in Figure 6.4 are self explanatory. The fields Non-blocked and Blocked
    refer to the number of pages that should exist as non-blocked and as blocked.
    Blocked-based buffer pools ensure that contiguous pages on disk are moved to the
    buffer pool also contiguously in a blocked area; this may improve performance.
    The number of pages must not be greater than 98 percent of the number of pages
    for the buffer pool. Specifying the value as 0 disables I/O.


    Once the buffer pool has been created, it is displayed in the Control Center,
    as shown in Figure 6.5.'
