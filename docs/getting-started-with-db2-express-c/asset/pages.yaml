    # Figure 10.5 - Database-level authorities and their functions


    Note:

    In DB2 9.7, to provide for better privacy and governance compliance, the authorization
    model has been updated to clearly separate the duties of the system administrator,
    the database administrator, and the security administrator.

    In general, the functional scope of several authorities has been reduced compared
    to previous DB2 versions. For example, a SYSADM no longer has the rights to access
    data from any database. On the other hand, SECADM has gained more functionality
    such as the ability to grant and revoke authorities and privileges to users, roles,
    and groups.

    New authorities have also been created to allow for more granularity and control
    of your system security. This also minimizes the risk of data exposure by granting
    users more than what they need to do their job.

    The DB2 9.7.2 refresh includes improvements that allow for the replay of past
    database activities. For example, if you need to analyze how a given request that
    happened a few years back affected some tables, you can now use the database audit
    information to obtain what you need for that analysis.


    # 10.2.2.3 Enabling SYSADM and DBADM to work the same as versions of DB2 prior
    to 9.7'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Chapter 10 – Database Security 181


    If you would like a SYSADM to behave the same as it did in versions of DB2 prior
    to DB2

    9.7, there are two cases to consider:


    +   - If the SYSADM is the creator of the database, then it automatically receives
    DATAACCESS, ACCESSCTRL, SECADM and DBADM authority for that database. This gives
    the SYSADM the same abilities as in versions of DB2 prior to 9.7.

    - If the SYSADM is not the creator of the database, then obtain the same capabilities
    as in previous versions of DB2 (except SECADM); a SECADM must GRANT DBADM DATAACCESS
    and ACCESSCTRL (which is the default) to the SYSADM on the given database.


    A few cases to consider for a SECADM:


    +   - The default SECADM is the creator of the database.

    - If a user with SECADM authority grants SECADM to a user with SYSADM authority,
    then the SYSADM can grant SECADM to other users.

    - If a user with SECADM authority grants DBADM to a user, the DBADM also receives
    DATAACCESS and ACCESSCTRL by default.


    If you are migrating DB2 9.5, the capabilities of SYSADM and DBADM will not change
    because DB2 automatically grants DBADM, DATAACCESS and ACCESSCTRL to the SYSADM
    group. DB2 also automatically grants DATAACCESS and ACCESSCTRL to every authorization
    ID that holds DBADM upon migration. In addition, DB2 automatically grants SECADM
    to the user ID doing the migration if there is no authorization ID of type USER
    that holds SECADM in the database. SYSADM loses its implicit ability to grant
    or revoke DBADM and SECADM which can now only be performed by SECADM.


    # 10.2.3 Roles


    Roles allow a security administrator to assign privileges or authorities to several
    users or groups. Roles are very similar to groups, but they are defined within
    DB2, and therefore, provide some advantages. For example, the privileges and authorities
    granted to roles are always used when you create objects like views or triggers,
    which is not the case for groups. On the other hand, you cannot assign instance-level
    authorities such as SYSADM to a role, only privileges and database-level authorities;
    while for a group, all privileges and authorities can be assigned.


    Working with roles requires following several steps:


    +   1. A security administrator (SECADM) must first create a role using a command
    like


    ```

    CREATE ROLE TESTER

    ```


    +   2. Next, a DBADM must grant privileges or authorities to the role. For example,
    to grant SELECT privilege on tables STAFF and DEPT in the SAMPLE database to role
    TESTER, issue:'
  merge: -1
  pgno: 180
- img_proc: true
  md: '182 Getting Started with DB2 Express-C


    GRANT SELECT ON TABLE STAFF TO ROLE TESTER

    GRANT SELECT ON TABLE DEPT TO ROLE TESTER


    +   3. Next, the security administrator grants the role TESTER to users RAUL and
    JIN:

    GRANT ROLE TESTER TO USER RAUL, USER JIN


    +   4. Next, if JIN were to leave the TEST department, the security administrator
    revokes the role TESTER from user JIN:

    REVOKE ROLE TESTER FROM USER JIN


    # 10.3 Group privilege considerations


    +   * When a group is granted privileges, members of the group are granted implicit
    inherited through group memberships.

    * When a user is removed from a group, they lose the implicit group privileges,
    but still retain any previous privileges that were explicitly granted. Privileges
    that were explicitly given to a user must be explicitly revoked from the user.


    # 10.4 The PUBLIC group


    DB2 defines an internal group called PUBLIC. Any user identified by the operating
    system or network authentication service is implicitly member of the PUBLIC group.
    When a database is created, certain privileges are granted to PUBLIC automatically:


    +   * CREATAB,

    * IMPLICIT SCHEMA,

    * BINDADD


    For added security, we recommend revoking all privileges from the PUBLIC group
    as shown below:


    ```

    REVOKE CONNECT ON DATABASE FROM PUBLIC

    REVOKE CREATAB ON DATABASE FROM PUBLIC

    REVOKE IMPLICIT_SCHEMA ON DATABASE FROM PUBLIC

    BINDADD ON DATABASE FROM PUBLIC

    ```


    # 10.5 The GRANT and REVOKE statements


    The GRANT and REVOKE statements are part of the SQL standard, and are used to
    give or remove privileges to a user, group or role. The user issuing this command
    must have at least ACCESSCTRL authority. Below are some examples of these statements:


    To grant the SELECT privilege on table T1 to user USER1:'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Chapter 10 – Database Security 183


    GRANT SELECT ON TABLE T1 TO USER user1


    To grant all privileges on T1 to the group GROUP1:


    GRANT ALL ON TABLE T1 TO GROUP group1


    To revoke all privileges on table T1 from group GROUP1:


    REVOKE ALL ON TABLE T1 FROM group group1


    To grant EXECUTE privilege on procedure p1 to user USER1:


    GRANT EXECUTE ON PROCEDURE p1 TO USER user1


    To revoke EXECUTE privilege on procedure p1 from user USER1:


    REVOKE EXECUTE ON PROCEDURE p1 FROM USER user1


    # 10.6 Authorization and privilege checking


    The easiest way to check for authorization and privileges is through the Control
    Center. Figure 10.6 illustrates how to launch the Table privileges for the EMPLOYEE
    table from the Control Center.


    ![](img/5f8d773441634563b766a57e36213cf4_182_0.png)


