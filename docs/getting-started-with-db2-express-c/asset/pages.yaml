    # Chapter 14 – Introduction to DB2 Application Development


    IBM DB2 is powerful data server software for managing both relational and XML
    data. It


    offers flexibility not only to database administrators, but also to database developers.
    No


    matter which language you use to develop your programs, DB2 provides the drivers,


    adapters, and extensions you need to work with databases as part of your application.


    Moreover with DB2 Express-C, you can develop your applications at no cost, with
    no


    database size limits, and with the same level of programming language support
    as the


    other versions of DB2. Develop DB2 Express-C, and you can run on any DB2


    edition without any modification to your application.


    Note:


    This section is only an introduction to DB2 application development. A series
    of more than 25 free online books is being developed as part of the DB2 on Campus
    Book Series including a book specific to DB2 application development. Other books
    in the series include non-DB2 techniques such as Java, PHP, Ruby on Rails, Python,
    Perl, Web 2.0, SOA, Eclipse, Open Source development, Cloud Computing and more!.
    Other books cover IBM as pureQuery, Data Studio, InfoSphere Data Architect in
    more detail. These books will be introduced starting on October of 2009.


    # 14.1 DB2 Application Development: The big picture


    DB2 offers database developers the flexibility to take advantage of server-side
    development features such as stored procedures and user-defined functions, while,


    application developers can develop client applications using the programming language
    of their choice. This flexibility is illustrated in Figure 14.1.'
