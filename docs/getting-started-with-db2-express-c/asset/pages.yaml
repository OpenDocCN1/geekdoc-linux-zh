- img_proc: true
  md: '# 2.3.5 Optim Database Administrator (ODA)


    Formerly known as Data Studio Administrator, ODA is an Eclipse-based tool that
    can be easily integrated with Data Studio and share the same Eclipse. ODA provides
    a change management capability and the ability to automate schema changes more
    easily.


    # 2.4 DB2 Offerings on Amazon Elastic Cloud Cloud


    It is noteworthy to mention that IBM has entered into a partnership with Amazon
    Web Services (AWS) for running DB2 on Amazon''s Elastic Cloud Cloud (EC2). AWS
    delivers a set of integrated services that format a computing platform "in the
    cloud", and is available on a pay-as-you-go model. That is, AWS lets you ''rent''
    compute capacity (virtual servers and storage). For example, let''s say you provision
    one EC2 virtual server for normal database operations, and during peak times or
    seasonal needs you provide an an extra database server for a few hours. In this
    example you would pay AWS only for the extra database server only for the few
    hours that you have it running.


    IBM offers three deployment options for DB2 on Amazon''s cloud platform:


    +   - DB2 Express-C AMIs for evaluation and development

    - Pay-as-you-go Production-ready AMIs with DB2 Express and DB2 Workgroup

    - Ability to create your own AMIs using DB2 licenses you own


    For more information and how to get started with DB2 on Amazon EC2, please visit:
    ibm.com/db2/cloud


    # 2.5 Summary


    DB2 Express-C provides no-charge, easy to use, and robust foundation for developing
    database applications, deploying them into production, and even embedding and
    distributing the applications with third parties. It is ideal if you are comfortable
    with community-based assistance and do not have a need for latest fixes or advanced
    features. However if you require formal support from IBM, regular software updates
    (fixes), or additional resource utilization, and high availability clustering
    support, IBM offers a DB2 Express subscription license (FTL) for a low yearly
    fee. If you require more advanced features for mission-critical workloads and
    massive-scale database applications, IBM offers more scalable DB2 editions and
    related products. This allows you to start small with DB2 Express-C, and scale
    to new heights as your business demands.'
  merge: -1
