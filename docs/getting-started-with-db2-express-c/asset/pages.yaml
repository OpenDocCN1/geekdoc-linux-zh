    <phone>408 555 9918</phone> |


    Table 15.3 – XPath wildcards examples


    # 15.3.2 XPath predicates


    Predicates are encoded in square brackets [ ]. As an analogy, you can think of
    them as the equivalent to the WHERE clause in SQL. For example [@id="902"] can
    be read as: "WHERE attribute id is equal to 902". There can be multiple predicates
    in one XPath expression. To specify a positional predicate, use [n] which means
    the nth child would be selected. For example, employee[2] means that the second
    employee should be selected.


    Table 15.4 provides more examples.


    | XPath | Result |

    |---|---|

    | /dept/employee[@id="902"]/name | <name>Peter Pan</name>

    | /dept/@id="101"]/employee[>300"]/name | <name>John Doe</name>

    | //employee[office="344" office="216"]/@id | OR 901

    902 |

    | /dept/employee[2]/@id | 902 |


    Table 15.4 – XPath predicate examples


    # 15.3.4 The parent axis


    Similar to MS-DOS or Linux/UNIX, you can use a ". (dot) to indicate in the expression
    that you are referring to the current context, and a ". (dot dot) to refer to
    the parent context.


    Table 15.5 provides more examples.


    | XPath | Result |

    |---|---|

    | /dept/employee/name[..@id="902"] | <name>Peter Pan</name>

    | /dept/employee/office[.."300"] | <office>344</office>

    | /dept/employee[office > "300"]/office | <office>344</office> |'
