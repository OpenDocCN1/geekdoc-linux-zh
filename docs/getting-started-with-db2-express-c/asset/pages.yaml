  md: '# Chapter 13 – Concurrency and Locking 229


    ```

    db2 connect to sample

    db2 +c update employee set firstname = ''Mary'' where empno = ''000050''

    ```


    First we are connecting to the SAMPLE database, and then issuing an update statement
    on the row with "empno = 000050" on the employee table. "+c" option in the statement
    indicates that we do not want the DB2 Command Window to automatically commit the
    statement. We are doing this on purpose to hold the locks.


    +   4. From CLP2 the commands:


    ```

    db2 connect to sample

    db2 +c update employee set firstname = ''Tom'' where empno = ''000030''

    ```


    In the CLP2 window, which represents the second application, we are also connecting
    to the SAMPLE database, but are updating another row in the employee table.


    +   5. From CLP1 issue:


    ```

    db2 +c select firstname from employee where empno = ''000030''

    ```


    After pressing Enter to execute the SELECT statement, the SELECT may seem to hang.
    It is actually not hanging, but waiting for the release of the exclusive lock
    that was taken by CLP2 on this row in step 3. At this point, LOCKTIMEOUT has been
    left with its default value of -1, the CLP1 application would wait forever.


    +   6. From CLP2 issue:


    ```

    db2 +c select firstname from employee where empno = ''000050''

    ```


    By issuing the SELECT statement, we are now creating a deadlock. The SELECT statement
    will seem to hang, as it is waiting for the release of the exclusive lock was
    taken by CLP1 on this row in step 2.


    In the above deadlock scenario, DB2 will check for the database configuration
    parameter DLCKHTIME. This parameter sets the interval for checking for deadlocks.
    For example, if it is set to 10 seconds, DB2 will check every 10 seconds if a
    deadlock has occurred. If indeed a deadlock happened, DB2 will use an internal
    algorithm to determine which of the two transactions should be rolled back, and
    which one should continue..


    If you are experiencing deadlocks, you should re-examine your existing transactions
    and see if any re-structuring is possible.


    # 13.9 Concurrency and locking best practices


    The following are some tips to follow in order allow for the best possible concurrency:


    +   1. Ensure you enable currently committed (CC), if your application logic allows
    it'
