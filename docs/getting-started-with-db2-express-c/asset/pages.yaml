    # 8.3.4 System catalog tables


    Each database has its own system catalog tables and views. These store *metadata*
    about the database objects. If these system tables become corrupted, your database
    would be rendered unusable. You can query these tables just like any normal database
    tables. Three schemas are used to identify the system catalog tables:


    +   - SYSIBM: base tables, optimized for DB2 use

