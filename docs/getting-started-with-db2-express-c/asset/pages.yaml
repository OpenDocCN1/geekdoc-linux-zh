    # 9.4 The db2move utility


    The EXPORT, IMPORT, and LOAD utilities work on one table at a time. Though you
    could write a script to generate the commands for each table in a database, another
    utility **db2move** can do this for you. The **db2move** utility can only work
    with IXF files, and the file names will be automatically generated by **db2move**.
    The examples below how to run **db2move** with the export, and import options
    respectively using the **SAMPLE** database.


    ```

    db2move sample export

    db2move sample import

    ```


    The Control Center does not have an option for **db2move**.


    # 9.5 The db2look utility


    While EXPORT, IMPORT, LOAD and **db2move** utilities allow you to move data from
    one table to another, within one database or across several databases, the **db2look**
    utility can be used to extract the DDL statements, database statistics and table
    space characteristics for a database and store them in a script file that can
    later be run on another system. For example, if you want to clone a database from
    a DB2 server running on Linux to a DB2 server running on Windows, you would first
