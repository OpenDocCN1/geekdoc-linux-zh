  md: '# 3

    # Chapter 3 – DB2 installation


    Installing DB2 is fairly straightforward, and in a typical installation, simply
    choosing thendefault options will have a DB2 server up and running in a short
    time.


    First download the appropriate DB2 Express-C image for your platform from the
    DB2

    Express-C Web site (www.ibm.com/db2/express).


    # 3.1 Installation prerequisites


    DB2 Express-C is available on Linux®, Sun Solaris (x64), and Microsoft Windows®
    2003,

    XP, Vista and Windows 7. It is also available as a beta on Mac OS X. The processor

    architectures are 32-bit, 64-bit and PowerPC (Linux). If you need to run DB2 on

    other platform (such as UNIX), you should purchase one of the different server
    server

    editions described earlier in this book. Operating system requirements for all
    DB2 editions

    are also described in this document: www.ibm.com/software/data/db2/udb/sysreqs.html


    In terms of hardware resources, DB2 Express-C can be installed on systems with
    any

    number of CPU cores and memory, however will only utilize up to 2 cores and 2
    GB of

    memory for the free unlicensed license, and up to 4 cores and 4 GB of memory

    for the subscription version of DB2 Express. The systems can be physical systems,
    or

    virtual systems created by partitioning or running virtual machine software. You
    can

    run on smaller systems if you prefer, for example a single processor system

    1GB of memory.


    For the latest information on DB2 Express-C hardware requirements, review the
    DB2

    Express-C web page at www.ibm.com/software/data/db2/express/about.html


    # 3.2 Operating system installation authority


    To install DB2 Express-C on Linux or Windows, you must have an operating system
    user

    s sufficient authority.


    For Linux, you need to be root (the superuser) to install DB2 Express-C. You can
    also

    install DB2 Express-C as a non-root user; however, you will be limited in what
    you can do

    with the product. For example, under a non-root installation, you cannot create
    more

    instances than the default created at installation time.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Getting Started with DB2 Express-C


    For Windows, the user account must belong to the Administrators group on the machine
    where you will perform the installation. Alternatively, on Windows 2008, Windows
    Vista, or higher, a non-administrator can perform an installation, but will be
    prompted for administrative credentials by the DB2 Setup wizard.


    The installation user ID must belong to the Domain Administrators group on the
    domain if the installation requires a domain account to be created or verified.


    You may also use the built-in Local System account to run the installation, though
    it is not recommended. A Local System account does not require a password, but
    cannot access network resources.


    The user account must also have the right to "Access this computer from the network."


    Note:


    See a video presentation about DB2 Express-C installation at this link. Although
    this presentation demonstrates DB2 9.5, it is no different from a DB2 9.7 installation,
    other than the color of the installation panels:

    http://www.channeldb2.com/video/video/show?id=807741:Video:4442


    #  3.3 Installation wizard


    Although there are several methods to install DB2 Express-C, the easiest method
    is to use the GUI-based DB2 Installation wizard. After downloading and uncompressing
    the DB2 Express-C image, you can launch the wizard as follows:


    +   - Windows: Execute the setup.exe file located in the EXP/image/ directory

    - Linux: Execute the db2setup command located in the exp/disk1/ directory


    DB2 Express-C is straightforward to install by following the instructions in the
    DB2 installation wizard. In most cases, the default settings are sufficient, so
    all you need to do is accept the license, click the Next button until the "Finish"
    button is active, and then click the Finish button. After a few minutes, your
    installation is complete and DB2 will be up and running!'
