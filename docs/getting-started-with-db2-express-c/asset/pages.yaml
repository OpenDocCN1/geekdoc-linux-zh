    # 14.3.2 Static SQL vs. Dynamic SQL


    Static SQL statements are the ones where the SQL structure is fully known at precompile

    time. For example:


    ```

    SELECT lastname, salary FROM employee

    ```


    In this example, the names for the columns (lastname, salary) and table (employee)

    referenced in a statement are fully known at precompile time. The following example
    is also

    a static SQL statement:


    ```

    SELECT lastname, salary FROM employee WHERE firstname = :fname

    ```


    In this example, a host variable :fname is used as part of an embedded SQL

    statement. Though the value of the host variable is unknown until runtime, its
    data type is

    from the program, and all the other objects (column names, table names) are fully

    known ahead of time. DB2 estimates for these host variables to calculate the access

    plan ahead of time; this is still considered static SQL.


    Youcompile, bind, and compile statically executed SQL statements before you run

    application. Static SQL is used on databases where statistics do not change a
    great

    dead. Now let''s take a look at one example:


    ```

    SELECT ?, ? FROM

    ```


    In this example, the names for the columns and table referenced by the statement
    are not

    known until runtime. Therefore the access plan is calculated only at runtime and
    using the

    statistics available at the time. These types of statements are considered Dynamic
    SQL

    statements.'
