    # # 15.1 Using XML with databases


    XML documents can be stored in text files, XML repositories, or databases. There
    are two main reasons why many companies opt to store them in databases:


    +   - Managing large volumes of XML data is a database problem. XML is data like
    other data, just in a different overall format. The main reasons to store relational
    data apply to XML data: Databases provide efficient search and retrieval, robust
    support for persistence of data, backup and recovery, transaction support, performance
    and scalability.

    - Integration: By storing relational and XML documents together, you can integrate
    new XML data with existing relational data, and combine SQL with XPath or XQuery
    in one query. Moreover, relational data can be published as XML, and vice versa.
    Through integration, databases can better support Web applications, SOA, and Web
    services.


    # # 15.2 XML databases


    There are two types of databases for storing XML data:


    +   - XML-enabled databases

    - Native XML databases


    # # 15.2.1 XML-enabled databases


    An XML-enabled database uses the relational model as its core data storage model
    to store XML. This requires either mapping between the XML (hierarchical) data
    model and the relational data model, or else storing the XML data as a character
    object. While this can be considered as “old” technology, it is still being used
    by many database vendors. Figure 15.2 explains in more detail the two options
    for XML-enabled databases.'
  merge: -1
  pgno: 261
- img_proc: true
  md: '# CLOB/Varchar


    # Shredding


    ![](img/5f8d773441634563b766a57e36213cf4_262_0.png)


    **Figure 15.2 – Two options to store XML in XML-enabled databases**


    The left side of Figure 15.2 shows the **CLOB** and **varchar** method of storing
    XML documents in a database. Using this method, an XML document is stored as an
    unsigned string in either a CLOB or a varchar column in the database. If the XML
    document is stored as a string, your program will have to retrieve part of the
    XML document, and parse it to find what you want. Thinking as building the XML
    tree in memory so you can navigate through this tree. This method is memory-intensive
    and not very flexible.


    The other option for XML-enabled databases is called **shredding** or **decomposition**
    and is illustrated on the right side of Figure 15.2. Using this method, an entire
    XML document is shredded into smaller parts which are stored in tables. Using
    this method, you are literally forcing an XML document, which is based on the
    hierarchical model, the relational model. This method is not flexible if the XML
    document is changed, this change is not easily propagated into the corresponding
    tables and many other tables may need to be created. This method is also not good
    for performance: if you need to get the original XML document back, you need to
    perform an expensive SQL join operation, which can become even expensive when
    more tables are involved.


    # 15.2. Native XML databases


    **Native XML databases** use the hierarchical XML data model to store and process
    XML internally. The storage format is the same as the processing format: there
    is no mapping to the relational model, and XML documents are not stored as unsigned
    strings (CLOBs or varchars). When XPath or XQuery statements are used, they are
    processed natively by the engine, and not converted to SQL. This is why these
    databases are known as “native” XML databases. DB2 is currently the only commercial
    data server providing this support.'
  merge: -1
  pgno: 262
