- img_proc: true
  md: '# DB2 Server (Linux/Windows)


    | Instance DB2 | Instance myInst |

    |--- |--- |

    | Database MYDB1 | Database MYDB1 |

    | SYSCATSPACE | | |

    | TEMPSP1 | | |

    | USERSPACE1 | |


    **Figure 4.8** Table spaces created by default when a database is created


    Table space SYSCATSPACE contains the System Catalog tables. The System Catalog
    is basically the data dictionary in other relational management systems. It basically
    contains system information that should not be modified or deleted; otherwise
    the database will not work correctly. Table space TEMP is used by DB2 when it
    needs additional space to perform some operations as sorts. Table space USERSPACE1
    is used to store database tables if there is no space specified when creating
    a table.


    You can also create your own tables using the CREATE TABLESPACE statement. **Figure
    4.9** shows the table MYTBS1 created inside database MYDB1 on instance DB2. When
    you create a table, you specify the disk to use and the memory (buffer pool) to
    use. Therefore, if you have a "hot" table, that is, a table that is used very
    often, you can allocate the fastest disk and the most memory by assigning a table
    space with these characteristics.


    In Figure 4.9, we show two objects created by default: A buffer pool IBMDEFAULTP,
    and the log files.


    A buffer pool is basically a memory cache used by the database. You can create
    one or more buffer pools, but there should always be one buffer pool with a page
    size that matches the page size of existing tables. Pages and page size will be
    discussed in more detail in Chapter 6, DB2 Architecture.


    The log files are used for recovery. When you work on a database, not only information
    stored in the disks for the database, but while you are working on the database,
    log files store all the operations executed on the data. Think of logs as temporary
    files where "autosave" operation is performed. Logs are discussed in more detail
    in Chapter 11, Backup and Recovery.'
