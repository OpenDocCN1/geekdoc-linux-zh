    # 9.3 LOAD utility


    The LOAD utility is a faster way to load data from a file into a table. As discussed
    before, the LOAD utility does not go through the DB2 engine, therefore triggers
    are not activated, the bufferpool is not used, and constraints can be enforced
    only as a separate step. On the other hand, a LOAD operation is faster than IMPORT
    as it is a low level data loader directly accessing the data pages on disk. It
    works in three phases: LOAD, BUILD, and DELETE.


    The following example loads all the data from the IXF formatted file employee.ifx
    into the table employee_copy. The REPLACE option is one of the many options available
    with LOAD. It is used to REPLACE all of the contents of the employee_copy table.


    ```

    LOAD FROM employee.ifx OF IXF

    REPLACE INTO employee_copy

    ```


    After executing the above command, the table space where your table resides may
    have been placed in CHECK PENDING state. This means you need to SET the INTEGRITY
    command to check the consistency of your data. The following example shows how
    you:


    ```

    SET INTEGRITY FOR employee_copy

    ```'
