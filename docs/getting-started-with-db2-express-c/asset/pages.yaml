    # 2.1.2 High Availability Disaster Recovery (HADR)


    High Availability Disaster Recovery (HADR) is a database reliability feature that
    provides a high-availability and disaster recovery solution for complete as well
    as partial failures. An HADR environment generally consists of two servers, the
    primary and the secondary (which can be in geographically apart locations). The
    primary server is the source database and accessed by client applications. As
    transactions are processed on the primary database, database log records are automatically
    shipped to the secondary server across the network. The secondary server has a
    cloned copy of the primary database restored by backing up the primary database
    and restoring it on the secondary system. When the primary database logs are received
    they are replayed and applied to the secondary database. Through continuous replay
    of the log records, the secondary database keeps an in-sync replica of the primary
    database that can take over if the primary database fails.

    nA full DB2-supported HADR solution gives you:


    +   - Lightning fast failover, with complete transparency for customers and client
    applications

    - Full transaction atomicity to prevent data loss

    - The ability to upgrade systems or applications without visible service interruption

    - Remote system failover, providing full recovery from local disaster striking
    the data center

    - Easy management with DB2 graphical tools

    - All of this with negative impact on overall system performance


    > Note:

    to view a demonstration of how HADR works, please visit:

    ://www.ibm.com/software/data/db2/express/demo.html


    New with DB2 9.7 will be the ability to allow clients to read on the stand-by-server.
    This ‘read-on-standby’ capability is enabled to be available with DB2 9.7 Fixpack
    1.


    # 2.1.3 Data Replication


    This feature allows for replication of data between a source server where data
    changes are captured, and a target server where data changes are applied. Figure
    2.1 provides an overview of how replication works.'
