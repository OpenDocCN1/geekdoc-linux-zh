    ```


    On Linux, an instance must match a Linux operating system user; therefore, to
    switch between instances you can switch users. This user is known as the instance
    owner. You can logoff and logon with the instance owner of the other instance,
    or use the su command.


    Table 4.1 shows some useful instance level commands.


    | Command | Description |

    |---|---|

    | db2start | Starts the current instance |

    | db2stop | Stops the current instance |

    | db2icrt | Creates a new instance |

    | db2idrop | Drops an instance |

    | db2ilist | Lists the instances you have on your system |

    | db2 get instance | Lists the current active instance |


    Table 4.1 – Useful DB2 commands at the instance level


    Some of the above commands can instead be performed via the Control Center. For
    example, if you expand the Instances folder and right-click the desired instance,
    you can choose Start, which is equivalent to issuing the db2start command from
