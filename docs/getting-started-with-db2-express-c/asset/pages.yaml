  md: '12 Getting Started with DB2 Express-C


    # Who should read this book?


    This book is intended for anyone who works with or intends to work with databases,
    such as database administrators (DBAs), application developers, consultants, software
    architects, product managers, instructors, and students.


    # How is this book structured?


    Part I, Overview and Setup, explains what DB2 Express-C is all about, introduces
    the DB2 family of products and features, assists with installation and creation
    of databases, and explores the tools available with DB2.


    Part II, Learning DB2: Database Administration, is designed to familiarize you
    with the DB2 environment, architecture, remote connectivity, database objects,
    data movement (import/export/load), security, backup and recovery, concurrency
    and locking, and other maintenance tasks.


    Part III - Learning DB2: Application Development, introduces DB2 application development,
    including server-side and client-side development. It also discusses SQL/XML,
    XQuery, and pureXML.


    The Appendix contains information about troubleshooting.


    Exercises are provided for most chapters; and any input files required for these
    labs are provided in the compressed file express_book_exercises_9.zip that accompanies
    this book.


    The materials in this book are also used in courses offered as part of the DB2
    on Campus Program, and closely match the e-learning video presentations available
    at www.channelDB2.com/oncampus. You can read more about the DB2 on Campus program
    at the DB2 Express-C website: www.ibm.com/db2/express/students.html.


    > Note:

    For more information about the DB2 on Campus program, watch the video at:

    ://www.channelDB2.com/video/show?id=807741:Video:3902


    Now in this edition we have made several changes and additions. For those who
    have read the second edition of the book covered DB2 9.5, we are making it easier
    for you to find the changes in the book that correspond to new features or updates
    in version 9.7 of DB2. The changes can be easily identified with this icon:


    ![](img/5f8d773441634563b766a57e36213cf4_11_0.png)'
  merge: -1
  pgno: 11
