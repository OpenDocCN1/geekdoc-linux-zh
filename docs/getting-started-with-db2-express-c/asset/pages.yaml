  md: '# Getting Started with DB2 Express-C


    ```

    CREATE DATABASE DB1 ON /data/path1, /data/path2

    ```


    Automatic storage is disabled explicitly:


    ```

    CREATE DATABASE DB1 AUTOMATIC STORAGE NO

    ```


    Next, create the table space with automatic storage enabled as in these examples:


    Automatic storage for table spaces is also enabled by default:


    ```

    CREATE TEMPORARY TABLESPACE TEMTS

    ```


    Automatic storage is implicitly specified for the table space:


    ```

    CREATE TABLESPACE TS1

    INITIALSIZE 500 K

    INCREASESIZE 100 K

    MAXSIZE 100 M

    ```


    Automatic storage is implicitly specified, the initial size is allocated, along
    with how much it will increase, and the maximum size can increase.


    # 6.3.3.3 How data is stored in table spaces


    By default, DB2 will write to disk extents at a time striped across containers.
    For example, if you have a 4K table space with an extent size of 8 using 3 raw
    containers on a DMS table space, means that 32K of data (4K x 8 pages per extent
    = 32K) will be written to one disk before writing to the next. This is shown in
    Figure 6.6. Note that tables do not share extents.


    ![](img/5f8d773441634563b766a57e36213cf4_117_0.png)


    Figure 6.6 – Writing data in table spaces'
