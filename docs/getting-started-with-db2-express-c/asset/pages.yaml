  md: '# Chapter 8 – Working with Database Objects


    This chapter discusses database objects such as schemas, tables, views, indexes,
    sequences, and so on. Some advanced database application objects such as triggers,
    user defined functions (UDFs) and stored procedures are discussed in Chapter 14,
    Introduction to DB2 Development.


    > Note:

    For more information about working with database objects, watch this video: http://www.channeldb2.com/video/show?id=807741:Video.4242


    # 8.1 Schemes


    Schemes are name spaces for a collection of database objects. They are primarily
    used to:


    +   - Provide an indication of ownership or relationship to an application

    - Logically group related objects together


    All DB2 database objects except public synonyms have a two-part fully qualified
    name; the schema is the first half of that name as shown below:


    ```

    <schema_name>.<object_name>

    ```


    A fully qualified object name must be unique. When you connect to a database and
    create an reference or object without specifying the schema, DB2 uses the user
    ID you connected to the database with the schema name. For example, if you connect
    to the SAMPLE database with user arfzhong, and create the table artists using
    the CREATE TABLE statement:


    ```

    CREATE TABLE artists ...

    ```


    the fully qualified name of the created table is arfzhong.artists.

    You can use the set schema statement to set the schema for a session. Listing
    8.1 provides an example.


    ```

    connect to sample user arfzhong using mypsw

    select * from staff ## This looks for arfzhong.staff

    ```'
  merge: -1
  pgno: 140
- img_proc: true
  md: '142 Getting Started with DB2 Express-C


    ```

    set schema db2admin ## This looks for db2admin.staff

    select * from staff

    ```


    # Listing 8.1 - An example of using the set schema statement


    A "contest system" can be used to illustrate the use of schemas. Say a company
    is running a contest where contestants need to create their own tables and perform
    some SQL operations. All participants are the same user ID to connect to the database,
    and the same script to create tables, where objects are unqualified, that, do
    not have a schema name. After the contestants log on the contest system, the system
    generates the schema name based on a timestamp after connection. This way, contestant
    A will work on a table with the same name as contestant B, but with different
    schemas, and therefore would not be a conflict with their work.


    ![](img/5f8d773441634563b766a57e36213cf4_141_0.png)


    # 8.2 Public synonyms (or aliases)


    New with DB 9.7 is the concept of public synonyms, also known as public aliases.
    Public synonyms allow you to reference other objects without the need to specify
    a schema. Listing 8.2 provides an example.


    ```

    connect to user archjong using myspw

    create public synonym raul for table archjong.staff

    select * from raul

    select * from archjong.raul ## Error

    connect to user db2admin using psw

    select * from raul

    ```


    # Listing 8.2 - An example of a public synonym


    In Listing 8.2, you first connect with user archjong and create the public synonym
    raul which references the table archjong.staff. If you try to use the synonym,
    you will receive an error. Other users like db2admin in the example of Listing
    8.2 can also use synonym raul which is public.


    In the example, if the public is not used, the synonym would be a private synonym.
    In Listing 8.3, let''s see the same example using a private synonym.


    # Listing 8.3 - An example of a private synonym


    In Listing 8.3 you see that because the synonym is private, it cannot be referenced
    connected as another user without specifying the schema.'
  merge: -1
  pgno: 141
