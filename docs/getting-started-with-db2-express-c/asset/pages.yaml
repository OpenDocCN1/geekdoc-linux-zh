    **Figure 4.7 – Database MYDB1 created in instance myInst**


    When a database is created, there are several objects created by default: table
    spaces, tables, a buffer pool and log files. Creating these objects takes a bit
    of time, that''s why the **create database** command requires a few minutes for
    processing. Figure 4.8 shows three table spaces created by default on the left
    side of the figure. Table spaces will be discussed in more detail in *Chapter
    6, DB2 Architecture*, but for now, think of table spaces as a logical layer between
    logical tables and physical resources, such as disks and memory.'
