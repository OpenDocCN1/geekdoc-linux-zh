    \    ${y/CustomerID}\n    ${y/Message}\n  </action>\n}\n```\n\n**Listing 15.19**\
    \ - An example of the db2-fn:sqlquery function embedding SQL within XQuery\n\n\
    In the example, the SQL query filters rows based on the condition that the srp\
    \ column has a value greater than 100. From those rows filtered, it will pick\
