  md: "# Getting Started with DB2 Express-C\n\n+   - Array type\n- Row type\n- Cursor\
    \ type\n\nReference, array, row and cursor types are new with DB2 9.7 and are\
    \ used with SQL PL routines. User-defined distinct data types are based on the\
    \ built-in data types. These UDTs are useful when:\n\n+   - There is a need to\
    \ establish context for values\n- There is a need to have DB2 enforce data typing\
    \ using strong typing\n\nThe SQL statements in Listing 8.5 illustrate an example\
    \ of how and when to use distinct UDTs:\n\n```\nCREATE DISTINCT TYPE POUND AS\
    \ INTEGER WITH COMPARISONS\nCREATE DISTINCT TYPE KILOGRAM AS INTEGER WITH COMPARISONS\n\
    CREATE TABLE person\n  (f_name VARCHAR(30),\n  weight_p POUND NOT NULL,\n  weight_k\
    \ KILOGRAM NOT NULL )\n```\n\n# Listing 8.5 - An example of distinct data types\n\
    \nIn this example, two distinct UDTs are POUND and KILOGRAM. Both are built based\
    \ on the built-in data type INTEGER. The WITH COMPARISON clauses defined as part\
    \ of the syntax casting functions with the same name as the data types will also\
    \ be created.\nThe table uses the two new UDTs in columns weight_p and weight_k,\
    \ respectively. If we issue the following statement:\n\n```\nSELECT F_NAME FROM\
    \ PERSON\nWHERE weight_p > weight_k\n```\n\nYou will receive an error message\
    \ because two columns with different data types are being compared. Even though\
    \ weight_p and weight_k use the POUND and KILOGRAM data types respectively, both\
    \ of which were created based on the INTEGER data type, by creating UDTs, you\
    \ make this type of comparison impossible. This is exactly what you want, in real\
    \ life, a comparison between pounds and kilograms would not make sense.\nin the\
    \ next example, you would like to compare the column weight_p with an integer;\
    \ however, these two data types are different, and therefore you would receive\
    \ an error unless you use a casting function.\nAs can see from the statement below,\
    \ use the casting function POUND() so that this comparison is possible. As indicated\
    \ earlier, the POUND() casting function was created with the UDT using the WITH\
    \ COMPARISONS clause in the CREATE DISTINCT TYPE statement."
  merge: -1
