  md: 'Chapter 7 – DB2 Client Connectivity 137


    # 7.3 Summary


    Connecting from a data client to a server is a core aspect of relational database
    management. In this chapter, we looked at client connectivity, starting with purpose
    and contents of the database and node directories associated with DB2.


    Next, we discussed using the Configuration Assistant GUI to set up the client
    server connection, including what needs to be configured on both sides of the
    connection.


    We also looked how the Add Database Wizard can also be used to make a server connection
    through three methods: using a stored profile, searching the network (also known
    as Discovery), or manually by typing in the server information. Client and server
    profile creation was covered in more detail.


    # 7.4 Exercises


    The Configuration Assistant can be used to quickly and easily configure remote
    database connections. In this exercise, you will catalog a database residing on
    a remote DB2 server (represented by your neighbor''s workstation, using both Search
    and Discover moves). Once the database is cataloged, you will be able to access
    it as if it were on your local system. DB2 performs all the communications "under
    covers".


    This exercise assumes you are working within a network. If this is not the case,
    use your own computer as the client and server machines and follow the instructions
    for configuration below to connect to your own system.


    Procedure


    +   1. Ask your neighbor (instructor) for the following information:

    2. Remote Database Info:

    (PR) Protocol TCPIP

    (IP) IP Address or hostname

    (PN) Instance Port Number

    (DB) Database Name SAMPLE

    Hints:

    To obtain the hostname on Windows, type `hostname` from a command window

    To obtain the IP address on Windows, type `ipconfig` from a command window

    3. Open the Configuration Assistant (Hint: it is accessible through the Start
    menu).

    4. Open the `Selected` menu and select `Add Database Using Wizard`.

    5. On the `Source` page of the wizard, select the `Manually Configure a Connection
    to a Database` option. Click the `Next` button to move to the next page of the
    wizard.

    6. On the `Protocol` page of the wizard, select the `TCP/IP` option. Click the
    `Next` button to move to the next page of the wizard.'
