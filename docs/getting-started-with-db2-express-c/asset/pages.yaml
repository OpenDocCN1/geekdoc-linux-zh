    \ as tables. This is possible with the XMLTABLE function as shown in Listing 15.10\
    \ below.\n\n```\nSELECT t.comment#, i.itemname, t.customerID, Message\nFROM items\
    \ i,\nmtable('$c/Comments/Comment' path i.comments as \"c\"\nColumns# integer\
    \ path 'CommentID',\nCustomerID integer path 'CustomerID',\nMessage varchar path\
    \ 'Message') AS t\n```\n\n# Listing 15.10 - An example using XMLTABLE\n\nThe first\
    \ line specifies the columns to be included in your results set. Columns prefixed\
    \ with the \"i\" variable are based on XML element values.\n\nThe third line invokes\
    \ the XMLTABLE function to specify the DB2 XML column containing the target data\
    \ (i.comments) and the path within the column's XML documents where the elements\
    \ of interest are located.\n\nThe columns clause, spanning lines 4 to 6, identifies\
    \ the specific XML elements that will be mapped to output columns in the SQL result\
    \ set on line 1. Part of this mapping involves specifying the data types to which\
    \ the XML elements will be converted. In this example all XML data is converted\
    \ to traditional SQL data types.\n\n# Example 4\n\nNow let's explore a simple\
    \ example in which you include an XQuery FLWOR expression inside an XMLQUERY SQL/XML\
    \ function. This is illustrated in Listing 15.11.\n\n```\nSELECT name, xmlquery(\n\
    'for $e in $c/Client/email[1] return $e'\n  passing count as \"c\"\n)\nFROM clients\n\
