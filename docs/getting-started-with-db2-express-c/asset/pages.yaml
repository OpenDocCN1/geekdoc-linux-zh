    # 14.2.1 Stored Procedures


    A stored procedure is a database application object that can encapsulate SQL statements
    and business logic. Keeping part of the application logic in the database provides
    performance improvements as the amount of network traffic between the application
    and the database is reduced. In addition, stored procedures provide a centralized
    location to store your code, so other applications can reuse the same stored procedures.
    To call a stored procedure, use the CALL statement. In DB2 you can develop stored
    procedures in several languages including SQL, Java, C++, CLR, OLE, and COBOL.
    A simple example of how to create and call a SQL PL stored procedure from the
    DB2 Command Window or Linux shell is shown below:


    ```

    db2 create procedure P1 begin end

    d2 call P1

    ```


    In the example, procedure P1 is an empty stored procedure which is not doing anything.
    The example illustrates how easy you can create a stored procedure. To develop
    stored'
