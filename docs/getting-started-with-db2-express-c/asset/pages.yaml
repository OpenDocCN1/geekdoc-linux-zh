    # 13.7 Lock wait


    When two or more applications need to perform an operation on the same object,
    one of them may have to wait to obtain the needed lock. By default, an application
    will wait indefinitely. The time application waits for a lock is controlled by
    the database configuration parameter LOCKTIMEOUT. The default value of this parameter
    is -1 (infinite wait).'
