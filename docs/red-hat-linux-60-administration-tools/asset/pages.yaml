    The patched netscape distribution can be found in the updates/netscape-common-4.6-1.i1386.rpm
    and updates/netscape-communicator-4.6-1.i1386.rpm files on the CD-ROM included
    with this text. To install the updated Netscape distribution, enter the following
    commands as root (it might be necessary to add the -- nodes option to RPM to successfully
    install these updates):


    ```

    rpm -Uvh netscape-common-4.6-1.i1386.rpm

    rpm -Uvh netscape-communicator-4.6-1.i1386.rpm

    ```


    Generally, this syntax for RPM is used to upgrade everything except the Kernel.
    Kernel updates are of sufficient complexity that it is preferable to download
    the true kernel source and build kernel images from them. This process is documented
    in Chapter 10,"Rebuilding the Linux Kernel." Also, be advised that the Linux kernel
    source itself is available as an RPM, but kernel source patches commonly will
    not run against these packaged versions because they do not contain all of the
    source files.


    Also, Netscape installations (all versions) crash on Java pages in Red Hat Linux
    6.0. To fix this problem, run the following command as root:


    ```

    chkfontpath --add /usr/X11R/lib/X11/fonts/75dpi

    ```


    # Setting the Time


    It is quite a simple thing to set the clock in the BIOS on a PC. However, synchronizing
    clocks on a large network of PCs can be much more complex.


    Red Hat Linux provides several utilities that set the system time based upon data
    received over the Internet. All must be run by root, as the root is the only user
    allowed to modify the system time. The simplest invocation is as follows:


    ```

    /usr/bin/rdate -s time.nist.gov; /usr/sbin/setclock

    ```


    These commands first set Linux'' time, then set the BIOS time. The two clocks
    are separate; Linux reads the BIOS time only at boot. This command can be automated
    by setting a crontab:'
