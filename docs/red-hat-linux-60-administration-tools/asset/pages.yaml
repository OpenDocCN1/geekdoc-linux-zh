  md: 'The password should not be obvious, especially if the machine is connected
    to the Internet. Mixtures of letters, numbers, and punctuation marks are best.
    The password must be entered twice, and the two entries must be identical. If
    you ever forget it, you can circumvent the root password by entering linux single
    at the LILO boot prompt. In single user mode, you can then remove the encrypted
    password from the file where it is stored (/etc/shadow) and later reset it.

    The format of the system password database can be specified with the dialog shown
    in Figure 1.38. For maximum compatibility with other UNIX installations, disable
    all the options.


