  md: '# Afterword


    You''ve come to the end of the first edition of my little text on Red Hat Linux
    6.0. I hope that with this work I''ve answered more questions than I''ve raised.
    However, it is likely that you will require additional documentation resources
    as your experience with the environment grows.


    Start with the Red Hat manuals in the /doc directory on the CD-ROM included with
    this text. They offer simple installation instructions for a variety of configurations
    not addressed here. These manuals are equivalent to the printed material that
    you will find in the Red Hat Linux retail boxed set.


    As you progress beyond installation, you might find the following Internet sites
    to be helpful:


    +   * http://kernelnotes.org

    (Kernel information and HTML-formatted HOWTOS)


    +   * http://tunelinux.com

    (Suggestions on tuning your Linux system for better performance)


    +   * http://freshmeat.net

    (New software for your Linux system)


    +   * ftp://metalab.unc.edu/pub/Linux/docs

    (One of the more widely used FTP repositories for Linux)'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'I have set up a web site, http://rhadmin.org, where you''ll find information
    about administration of Red Hat Linux, along with the latest updates to this text
    and comments from readers.


    Most RPM packages usually leave documentation in the /usr/doc directory on your
    system as they are installed. You can look there if you have questions about installed
    packages. Also located there are RPM distributions of the HOWTO files and translations
    of these HOWTOs in several languages.


    And with these last bits of advice, our little tour of Linux is done. If you have
    dedicated yourself to the study of this text, then it is certain that you will
    go beyond it soon. You will soon begin many more significant excursions into Linux
    that will make our little journey seem positively pedestrian.


    Be assured, however, that I am profoundly grateful for the opportunity to act
    as your guide throughout these pages. As you now take your leave, understand that
    you disembark with the best wishes of success from all who have participated in
    the production of this book.


    Good luck.'
