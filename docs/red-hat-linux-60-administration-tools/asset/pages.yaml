    # Print Services


    By default, all system printers are shared through Samba. This behavior is controlled
    by the following lines in /etc/smb.conf:


    ```

    # if you want to automatically load your printer list

    # rather than setting them up individually you’ll need this

    printcap name = /etc/printcap

    load printers = yes

    ```


    Remove this section if this is not the desired behavior.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# NetBIOS Client Services for Linux


    If it is removed, the following example from /etc/smb.conf can be used to share
    an individual printer:


    +   # A private printer, usable only by fred. Spool data will be placed in fred''s

    # home directory. Note that fred must have write access to the spool directory,

    # wherever it is.

    [fredsprsn]

    comment = Fred''s Printer

    valid users = fred

    path = /homes/fred

    printer = freds_printer

    public = no

    writable = no

    printable = yes


    You can also specify the print command that should be used.


    +   [laser]

    comment = Laser Printer

    path = /var/pool/samba

    printer driver = "Generic Laser"

    print command - lpr -P lp1 %s

    public = no

    writable = no

    printable = yes


    > It has occasionally been observed with the Red Hat RPM versions of Samba that
    all methods of sharing printers fail except for this last example, where the print
    command is directly specified. If you have trouble, specify the print command
    explicitly as demonstrated here.


    Note


    # NetBIOS Client Services for Linux


    Linux can participate as a client in Windows NT networks. It can access both file
    and printer shares.


    # File Services


    If a remote NT or 95/98 server is running TCP/IP and has available shares, these
    shares can be accessed via the smbmount command (please note that the standard
    mount command is not used for this purpose).'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'The following command, when run by root, mounts a share called data on the
    remote host nthost on the local /mnt directory:


    ```

    smbmount //nthost/data -c ''mount'' /mnt

    ```


    This command will first prompt for a password, then mount the share off /mnt.

    This command assumes there is a "root" user defined on the remote NT system, and
    that nthost is visible on the local network.

    A different remote user name for accessing the remote host can be specified with
    the -U option:


    ```

    smbmount //nthost/data -U luser -c ''mount'' /mnt

    ```


    Should the remote host not be easily visible on the local network, the -I option
    can be used to specify a host name or IP address:


    ```

    smbmount //nthost/data -Inthost.com -c ''mount'' /mnt

    ```


    The file permissions model on NT servers is usually much different from UNIX.
    If the NT server is using a FAT file system, there are no permissions on files.
    If the server is using NTFS, its security model is actually more flexible than
    UNIX, but it is not compatible. Options can be specified that control the user,
    group, file mode, and directory mode that Linux will assign the mounted file file
    system:


    ```

    smbmount //nthost/data -U luser -Inthost.com \

    -c ''mount'' /mnt -u 500 -g 500 -f 644 -d 755

    ```


    An alternate form of the command is sometimes more effective:


    ```

    smbmount //nthost/data /mnt -U luser -Inthost.com \

    -u 500 -g 500 -f 644 -d 755

    ```


    The author has seen the syntax of each example used on Red Hat Linux 6.0.


    # Print Services


    Adding a Windows printer as a Linux system printer is relatively straightforward.
    As the root user under XWindows, run the following command:


    ```

    printtool

    ```'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# Print Services


    The Print System Manager will appear, as shown in Figure 8.7.


    ![](img/7fb45bf48608bf2c3ba3e2d71ee8fcff_228_0.png)


    Figure 8.7 Red Hat Linux Print System Manager.


    Select the “Add” button, and the dialog box in Figure 8.8 will be presented.


    ![](img/7fb45bf48608bf2c3ba3e2d71ee8fcff_228_1.png)


    Figure 8.8 Printer type.


    Select “Lan Manager Printer” and click “OK.” Click “OK” on the warning dialog
    box (Figure 8.9 on page 214) to continue.

    Add the relevant information to the dialogs (Figure 8.10) and click “OK.” The
