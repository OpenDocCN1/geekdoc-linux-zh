  md: '174


    Chapter 07 / Dynamic Content Web Services


    For information systems requiring global visibility, the Web is an obvious choice.
    The Web has achieved such ubiquity that there are no reasonable alternatives.
    The Hypertext Markup Language (HTML), however, has one very serious weakness—its
    static nature. It was intended to be a method for sharing documents, not an interactive
    medium. As demands for increased sophistication mount developers have focussed
    on technologies to overcome the static nature of the Web. Technologies such as
    Java, ActiveX, and XML represent the recent attempts to extend the power of the
    Web.


    Perl is a text processing language that has recently developed database extensions
    and ModPerl—a special version that can be included in the Apache web server. The
    PHP language is deeply rooted in C and Awk and has always had a primary focus
    on the efficient use of SQL databases.


    The information presented within this chapter is intended for Intel-based systems
    running Red Hat Linux 6.0. Much of the information will be applicable to other
    platforms, however, as all of the software discussed here (Sybase, PostgreSQL,
    PHP 3.0) has been ported to a wide variety of UNIX implementations.


    # PHP


    PHP (Professional Home Pages), the successor to PHP/FI, is a web utility that
    has enjoyed a great deal of popularity. It allows a C-like programming language
    with SQL extensions to be directly embedded within HTML documents, transforming
    them into active content. The software has recently been through a complete rewrite
    with a development emphasis upon performance. PHP requires no extensions to the
    browser, as it relies upon the CGI interface.


    PHP supports a number of database servers in addition to Sybase and PostgreSQL.
    These include Adabas, mSQL, MySQL, Oracle, and ODBC. PHP now also supports LDAP
    directory services and the IMAP mail protocol. More information about PHP is available
    in the documentation at the developer''s site—


    http://www.php.net.'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Installing PHP


    PHP is available from the PHP website or in the sybase/php-

    3.0.12.tar.gz file on the CD-ROM included with this text. You

    must use this file, or a later version if one is available.


    There are two ways to configure PHP. It can be set up as a CGI

    binary, or as a module loaded at run-time for a supported Web

    server (Apache, the Netscape servers, and Microsoft IIS).


    Loading PHP as an Apache module has a number of benefits.

    With the CGI approach, the entire PHP parser is loaded, executed

    dan terminated every time a browser accesses PHP on the

    server. When loaded as a module, on the other hand, the PHP

    arser becomes an integrated part of the PHP run-time environ-

    mentment. Because the PHP memory image is not loaded and destroyed

    by each access, the performance of the module configuration is sig-

    nificantly better. A module configuration will also permit much

    greater flexibility in the placement and access of PHP source files

    on the server. When used as a module, no reference to a cgi-bin

    directory is required in a URL; PHP application files can be placed

    anywhere within the web server document root.


    However, there have been a number of security updates to the

    Apache Web server issued by Red Hat. Each time such an update

    occurs, the PHP-enabled Web server must be rebuilt from source.

    Such an arrangement can quickly become tedious. If the system is

    ugraded at a later date to a new version of Red Hat Linux, a

    rebuild of the web server will probably be necessary.


    In compiling PHP as a CGI binary, PHP is built in a way that

    it is entirely separate from Web server installation. Updates to the

    Web server can be applied without fear of disturbing PHP. This conf-

    guration should be appropriate for all but the busiest Web sites.


    Running PHP as a CGI binary, however, allows files (named .htaccess

    default) to limit access to Web pages to specific IP addresses or to

    users who supply a valid username-password combination. The

    CGI version of PHP does *not not honor* .htaccess files. If installed as a'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Chapter 07 / Dynamic Content Web Services


    CGI binary, it can be used to read every Web page under the server''s document
    root or users'' directories (which lie in the public_html directory within the
    users'' home accounts, regardless of the access control that has been specified
    in .htaccess. Luckily, this is not an issue with the Apache module version of
    PHP.


    Ultimately, users who are not overly concerned with the security of their Web
    server''s directory tree and who do not anticipate high volume usage of PHP-enabled
    Web pages, should install the CGI version of the parser. All others should take
    the extra time to install PHP as an Apache module.


    This chapter will assume the safer (if more arduous) approach to the preparation
    of the PHP-enabled web server daemon. The steps required to prepare PHP as an
    Apache module follow. The script in Listing 7.1 it assumes that the PHP binary
    distribution (php-3.0.12_tar.gz) and the source RPM for Apache (apache-1.3.6-7.src.rpm)
    are in the current directory. A good place to start this build is in root''s home
    directory (/root, also known by BASH as ~root). This is a temporary space used
    to build Apache; it can be deleted once the daemon is installed. Both the PHP
    and Apache source files are included on the attached CD-ROM in the sybase directory.
    RPM build methods are not used because they are not as convenient. A binary RPM
    version of mod_php exists, but it lacks Sybase support. The source is built outside
    of RPM to localize the build area.


    There is some importance in the database selection options of the PHP configuration.
    In Listing 7.1, the script includes support for both Sybase and PostgreSQL. To
