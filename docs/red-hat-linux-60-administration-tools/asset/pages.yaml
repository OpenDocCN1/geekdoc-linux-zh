  md: "Take the opportunity to make a boot floppy when it is presented in the initial\
    \ installation. Alternately, create a boot floppy later using the command mkbootdisk.\n\
    A small amount of effort at installation time can save great effort when a system\
    \ won’t boot. Make the boot floppy. \n\n# A Sample Installation\n\nBefore installation\
    \ can begin, the required boot disk images must usually be written to blank floppies.\
    \ This operation is accomplished through either a DOS or UNIX environment.\nThe\
    \ layout of the boot images for Red Hat 6.0 has changed substantially from earlier\
    \ releases. The following boot images are available on the CD-ROM included with\
    \ this text:\n\nboot.img\n\nThis image is used for all types of disk media installs\
    \ (including CD-ROM).\n\nbootnet.img\n\nThis image is used to install Red Hat\
    \ Linux over a network connection. A variety of protocols are supported, including\
    \ NFS, FTP, SMB, and HTTP.\n\npcmcia.img\n\nThis image is required when PCMCIA\
    \ (PC-Card) devices play any role in the installation. Notebook computers often\
    \ require this image.\n\nHowever, if the BIOS of the PC supports the El Torito\
    \ bootable CD format, the creation of boot floppies might not be necessary. Simply\
    \ place the Red Hat CD in the drive, set the BIOS to boot from the CD (if applicable),\
    \ and attempt to boot normally. If LILO boot prompt appears, and PCMCIA services\
    \ are not required, the creation of boot floppies can be safely skipped. If it\
    \ is necessary to create a set of boot floppies, the instructions for both DOS\
    \ and UNIX follow:"
  merge: -1
