- img_proc: true
  md: '# Using an Errata Kernel


    The above mkinitrd command isn''t really important on IDE systems, but it is deadly
    important on SCSI systems. Without the kernel modules in the initrd, the system
    will not boot.


    Once the new kernel is installed, the system is in a precarious state. A reboot
    between the kernel upgrade and LILO reconfiguration could range from inconvenient
    to disastrous. Upgrades for an IDE system are usually as simple as changing the
    name of the kernel image in /etc/lilo.conf, as shown in Listing 10.2.


    # **Listing 10.2** Modifying /etc/lilo.conf for an errata kernel.


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    image=/boot/vmlinuz-2.2.5-22

    label=linux

    root=/dev/hda5

    read-only

    other=/dev/hda1

    label=dos

    table=/dev/hda

    ```


    Alternately, if the "Uvh" option was not used, the old kernel could be set up
    as a backup:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    image=/boot/vmlinuz-2.2.5-22

    label=linux

    root=/dev/hda5

    read-only

    image=/boot/vmlinuz-2.2.5-15

    label=linuxold

    root=/dev/hda5

    read-only

    other=/dev/hda1

    label=dos

    table=/dev/hda

    ```'
