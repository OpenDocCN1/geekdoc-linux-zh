  md: '# Subnets


    This section discusses techniques for subnetting Class IP addresses. Subnetting
    an IP network is a method that can be used to transform a single network into
    many. It is usually employed when multiple networks must be maintained, but multiple
    Class A, B, or C networks are not available.


    Unless you have specific reasons for subnets with a Class C network, it is probably
    a very bad idea. IP masquerading techniques, as discussed in Chapter 4, might
    be a much more convenient method for attaching multiple hosts to the Internet
    with a limited IP address space. It should also be noted that two IP addresses
    will be sacrificed for each subnet formed (one for the network number, and one
    for the broadcast address), and a third will be required for a router.


    Despite these difficulties, let pretend that a system administrator at a branch
    office of some company has been allocated the Class C IP network of 192.168.1.
    Let us further suppose that this single office opens up two additional satellite
    offices close by. The administrator is expected to network the additional offices
    using the Class C already in use (another Class C will not be granted).


    A quick reminder of the powers of 2 might be in order (see Table 2.3).


    Table 2.3 The powers of 2.


    | | |

    |---||

    | $2^0$ | 1 |

    | $2^1$ | 2 |

    | $2^2$ | 4 |

    | $2^3$ | 8 |

    | $2^4$ | 16 |

    | $2^5$ | 32 |

    | $2^6$ | 64 |

    | $2^7$ | 128 |'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'The regular Class C netmask used before the split is shown in Table 2.4, in
    both decimal and binary form:


    # **Table 2.4** A Class C netmask.


    | 255. | 255. | 255. | 0 |

    | 11111111. | 11111111. | 11111111. | 00000000 |


    The administrator decides to expand the netmask two bits beyond the Class C, as
    in Table 2.5.


    # **Table 2.5** A user-defined netmask.


    | 255. | 255. | 255. | 192 |

    | 11111111. | 11111111. | 11111111. | 11000000 |


    In the modified netmask, the final byte has the two leftmost (or most significant)
    bits set. A sequence of two bits can be arranged in four different ways (00, 01,
    10, or 11). Expanding the netmask in this way, will create four new networks.
    Only three are needed, but the fourth must follow because networks can only be
    allocated in powers of two (unless Variable Length Subnet Masking- is in use,
    which is beyond the scope of this text).


    By expanding the subnet mask in this way, four networks have been created (see
    Table 2.6).


    # **Table 2.6** Results of subnetting a Class C network.


    | Network | Netmask | Broadcast | Starting IP | Concluding IP |

    | 192.168.1.0 | 255.255.255.192 | 192.168.1.63 | 192.168.1.1 | 192.168.1.62 |

    | 192.168.1.64 | 255.255.255.192 | 192.168.1.127 | 192.168.1.65 | 192.168.1.126
    |

    | 192.168.1.128 | 255.255.255.192 | 192.168.1.191 | 192.168.1.129 | 192.168.1.190
    |

    | 192.168.1.192 | 255.255.255.192 | 192.168.1.255 | 192.168.1.193 | 192.168.1.254
    |'
