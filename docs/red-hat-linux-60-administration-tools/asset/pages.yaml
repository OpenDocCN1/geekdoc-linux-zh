    # Using INSERT from the Web


    This section assumes you have a firm working knowledge of HTML forms. If this
    is not the case, you might want to review the NCSA Guide to Fill-Out-Forms at
    http://www.ncsa.uiuc.edu/SDG/Software/Docs/fill-out-forms/overview.html.


    There are two main sections of HTML that will be used (in our example) to add
    records to the database. First, an HTML form must be constructed so that the information
    can be easily entered by the browser. Second, the information must be returned
    and processed by PHP in order to add it to the table.


    The implementation of the form, and specifically the vendor field, presents a
    design dilemma. The SELECT form tag is the most obvious HTML form element to present
    a pre-defined vendor list. Should this be hard-coded in the HTML? If another vendor
    is added to the “vendors” table, the HTML will not be automatically updated, and
    users will not be able to enter data against the new vendor. The form elements
    for the SELECT tag could alternately be generated by PHP each time the form is
    accessed. The drawback of this method is that the server load will be increased.


    Another approach would be to generate the HTML for the form whenever the “vendors”
    table is updated. This could be accomplished in a variety of ways, some of which
    stem from the fact that the CGI version of PHP can be called from a Unix shell
    prompt as well as from a CGI environment.


    The second alternative is presented below; each time the page for the data-entry
    form is accessed, PHP uses a SQL select to obtain the data from the “vendors”
    table to build the HTML SELECT list.


    To implement this example, copy the HTML in Listing 7.6 on page 186 into a file
    on your system named /home/http/html/dbform.php'
