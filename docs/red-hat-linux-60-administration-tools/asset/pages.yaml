  md: 'A list of rules similar to the ones above can be entered into the Linux kernel.
    This list is parsed from the top down. If two contradictory commands are entered,
    or if a packet matches several rules, the rule entered first will determine the
    packet''s fate. Using commands of this form, holes can be *punched* through the
    bastion host, opening paths for desired services, but blocking potentially threatening
    traffic.


    If the network on either side of this firewall is connected to the Internet, hosts
    on *both* sides must have valid Internet IP addresses. There is a method, however,
    to use synthetic network addresses on the side of the network not directly connected
    to the Internet. This has the valuable side-effect of conserving Internet IP addresses—only
    a single *real* address will be required. The technique is called *IP masquerading*,
    and an example follows:


    ```

    ipchains -P forward DENY

    ipchains -F

    ipchains -A forward -j MASQ -s 192.168.1.0/24 -d 0.0.0.0/0

    ```


    The *ipfwadm* syntax follows:


    ```

    ipfwadm-wrapper -F -p deny

    ipfwadm-wrapper -F -f

    ipfwadm-wrapper -I -f

    ipfwadm-wrapper -O -f

    ipfwadm-wrapper -A -f

    ipfwadm-wrapper -F -a m -S 192.168.1.0/24 -D 0.0.0.0/0

    ```


    Masquerading specifically requires that routing be disabled by default. This is
    accomplished by the first command in the list above. The last call to *ipchains*
    (or *ipfwadm*) establishes a masquerading rule.


    In this case, it is assumed that one of the network interfaces has an address
    on the 192.168.1 Class C network. Hosts on this network should should be configured
    to use the *masquerade server* network interface IP address as their default gateway.


    Packets traveling through a masquerading route are usually rewritten so their
    source network addresses are the same as the IP address of the network interface
    that lies on the default route of the masquerading server (the source port is
    also changed). The kernel will keep track of all masqueraded connections. When
    a remote server replies to the masquerade server, the kernel rewrites'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Kernel IP Forward and Masquerade Rules


    the return packet with the original (synthetic) IP address and port number, then
    forwards the packet onto the internal network.

    External hosts think the firewall is initiating all traffic, but internal hosts
    never know the difference.


    Masquerade works for most protocols, but not all. FTP (in active mode) specifically
    ceases to function when it runs behind such a network. Masquerade servers for
    some of these protocols, however, are available as kernel modules. The following
    commands load all the additional available masquerade protocols:


    ```

    depmod -a

    modprobe ip_masq_autofw

    modprobe ip_masq_cuseeme

    modprobe ip_masq_ftp

    modprobe ip_masq_irc

    modprobe ip_masq_mfw

    modprobe ip_masq_portfw

    modprobe ip_masq_quake

    modprobe ip_masq_radio

    modprobe ip_masq_user

    modprobe ip_masq_vdolive

    ```


    Obviously, only the masquerade modules that are required should be loaded. The
    others should be omitted. Loading additional kernel modules makes the kernel larger,
    and can open avenues for attack.


    If a network application ceases to function when placed behind a masquerade server,
    it is probably creating a server on some port. If the server is on a random port
    (and not a well-defined port), the odds are slim that the application will work
    easily with masquerade. The use of proxies to access servers on synthetic networks
    is discussed in the next section.


    Masquerade rules can co-exist with other forward rules. They can also apply to
    real Internet IP addresses. In the example below, all external hosts are allowed
    to access web and email services on the 1.2.3.0 network, but all other traffic
    originating from hosts in 1.2.3 is masqueraded:


    ```

    ipchains -P forward DENY

    ipchains -F

    ipchains -A forward -s 0.0.0.0/0 -p TCP -d 1.2.3.0/24 http -j ACCEPT -b

    ipchains -A forward -s 0.0.0.0/0 -p TCP -d 1.2.3.0/24 smtp -j ACCEPT -b

    ipchains -A forward -j MASQ -s 1.2.3.0/24 -d 0.0.0.0/0

    ```'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'The ipfwadm version follows:


    ```

    ipfwadm -F -p deny

    ipfwadm -F -f

    ipfwadm -I -f

    ipfwadm -O -f

    ipfwadm -A -f

    ipfwadm -F -a accept -P S 0.0.0.0/0 -D 1.2.3.0/24 http -b

    ipfwadm -F -a accept -P tcp s 0.0.0.0/0 -D 1.2.3.0/24 smtp -b

    ipfwadm -F -a m -s 1.2.3.0/24 -D 0.0.0.0/0

    ```


    This will open only the HTTP and SMTP ports on servers residing within the internal
    network; all other ports will be blocked. Connections on these ports will use
    the real IP addresses of the internal hosts. Any other outgoing communication
    from the internal network will be masqueraded.


    Please note that the order of the last three commands is important. The sequence
    could be restated in the following manner:


    ```

    ipchains -A forward -j MASQ -s 1.2.3.0/24 -d 0.0.0.0/0

    ipchains -A forward -s 0.0.0.0/0 -p TCP -D 1.2.3.0/24 http -j ACCEPT -b

    ipchains -A forward -s 0.0.0.0/0 -p TCP -D 1.2.3.0/24 smtp -j ACCEPT -b

    ```


    Or, with the other syntax:


    ```

    ipfwadm -F -a m -s 1.2.3.0/24 -D 0.0.0.0/0

    ipfwadm -F -a accept -P tcp -s 0.0.0.0/0 -D 1.2.3.0/24 -b

    ipfwadm -F -a accept -P tcp -s 0.0.0.0/0 -D 1.2.3.0/24 smtp -b

    ```


    This sequence, however, would never allow web or email traffic to get through.
    The rules are parsed top-down, so the connection would always be masqueraded.


    It might also be important to prevent IP spoofing (i.e., when a host misrepresents
    its IP to gain access to something which is normally denied). If so, there is
    a simple configuration directive for the kernel that enables *Source Address Verification*.
    To set up source address verification, and prevent spoofing, place the shell script
    fragment found in Listing 4.1 in a startup file that is executed after the networking
    devices are brought up.'
