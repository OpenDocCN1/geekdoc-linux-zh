- img_proc: true
  md: 'system, therefore, is to compile the driver for the SCSI controller directly
    into the kernel image. This is not a reasonable solution, however, for the generic
    kernel provided by the installation process. In this generic kernel, the SCSI
    drivers are provided as modules, since drivers compiled directly into the kernel
    would make the kernel image extremely large. If the modules are stored on the
    SCSI hard drive, a chicken-and-egg situation develops. The generic kernel uses
    an initial ramdisk to solve this problem. The initrd image holds copies of all
    the SCSI modules. It is loaded by LILO or whatever loader is in use) and is available
    as the kernel boots. In any case, initrd images are inconvenient and it is best
    if custom kernels do not rely upon them.


    In addition to a basic inability to access the hard drive, a few other configuration
    mistakes will result in a system that will boot. Failure to provide support for
    ext2 (Second Extended File System) will clobber a system quite harshly, since
    ext2 is the native file system used in Red Hat Linux at this time (this situation
    may change with the inclusion of the XFS file system in the anticipated Linux
    2.4 kernel). Improper device configuration options passed as arguments to the
    kernel can also lead to a quick death at boot time. It is not difficult to come
    up with a long list of things that can go wrong, so ensure a contingency plan
    is in place (relating to LILO and an emergency diskette).


    Before building a kernel, you should decide on an approach to modules. When building
    a kernel to be used on a large number of machines, you will probably find it very
    convenient to disable modules and (carefully) select drivers for all required
    hardware to compile directly into the kernel. Afterwards, you can copy the kernel
    as a single file to a remote system, run LILO, and reboot in the new kernel environment.
    If you do this static kernel approach, it''s a good idea to comment out the single
    crontab entry in /etc/cron.d/. Otherwise, hourly status messages will be generated
    by cron concerning module manipulation failures. In any case, static kernels are
    much more convenient from an administrative standpoint than kernels that use modules.
    There are size limitations on the kernel binary image, however, and some features
    must be compiled as modules. If circumstances demand it, use modules and be glad
    for them.'
