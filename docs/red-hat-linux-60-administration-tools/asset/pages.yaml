    # DNS


    The Domain Name System (DNS) is the engine that translates names into IP addresses.
    It is a cornerstone of Internet design. No domain with connectivity to the Internet
    can afford to ignore it.


    If a system with Red Hat Linux will ever be connected to the Internet in any way
    except through proxies, it should probably have at least a caching-only DNS server
    installed, and an /etc/resolv.conf points to 127.0.0.1. Such a caching server
    will be loaded at installation time if name is selected from the package list
    in the ntsys menu. This is especially true for PPP-modems, or of transient or
    limited bandwidth connections, as DNS traffic is reduced with an active caching
    server.


    The DNS server and caching-only settings can be loaded at any time after installation
    by issuing the following commands from the RedHat/RPMs directory of the installation
    tree:


    ```

    rpm -Uvh bind-8.2-6.i386.rpm

    rpm -Uvh caching-nameserver-6.0-2.noarch.rpm

    ```


    Installing the Bind package will automatically configure it to be launched at
    boot time through the /etc/rc.init.d/named script. If this isn''t what you want,
    use the ntsys utility to alter the boot status.


    Please note that if Red Hat Linux is installed over a network (with either FTP,
    NFS, or SMB) and a name server is specified, that server will be used in preference
    to any name server running on the local host if the network settings were retained
    at the end of the installation. To specify the local host as the primary name
    server, make sure that the first nameserver directive in /etc/resolv.conf reads
    as follows:


    nameserver 127.0.0.1'
