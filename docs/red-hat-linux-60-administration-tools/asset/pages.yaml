    # Virtual Hosts with JavaScript


    The best method for establishing virtual hosts is to configure the server network
    card with multiple network addresses, because this technique will work with all
    browsers. There is, however, alternative method that can be used with JavaScript-enabled
    browsers.


    Let us imagine that the server network card is configured with a single IP address,
    and the names www.company-a.com and www.company-b.com both resolve to this same
    IP address. Let us further imagine that there is an index.html file in the document
    root of the web server, and that document root must be used to serve different
    pages for the different companies.


    The JavaScript location variable contains the URL to access the current page.
    In addition, if location is modified, the browser will immediately load the new
    URL contained within the variable.


    The JavaScript to exploit this feature for virtual hosts could be as simple as:


    ```

    <script language="JavaScript">

    <!--

    if (location="http://www.company-b.com/")

    location="http://www.company-a.com/company-b/")

    --></script>

    ```


    With this approach, the browser, not the server, makes the decision to which page
    to load.


    JavaScript will clean up the location variable to some extent, insuring it contains
    the http:// and a trailing slash. This method is quite handy for webmasters who
    do not have full administrative control of their machine. It is much easier to
    apply a change to one file than perform extensive reconfiguration of the network
    interfaces.


    The greatest drawback of this approach is that non-JavaScript-aware browsers (such
    as Lynx) will not execute the script and load the new page, nor will JavaScript-aware
    browsers (Netscape 2 and later versions, Internet Explorer 3 and later) if JavaScript
    has been disabled by the user.


    There are also other problems with this approach:'
