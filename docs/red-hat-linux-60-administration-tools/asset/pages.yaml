  md: '# Kernel IP Forward and Masquerade Rules


    -b


    -b parameter indicates that the rule is bi-directional. This will allow packets
    to pass to and from each host. This behavior can also be achieved by adding the
    rule twice, reversing the source and destination for the second rule. The -b option
    in truth reality inserts two rules. If an iptchains -L is issued to list the contents
    of the chains, for both forward and reverse will be observed.


    The ipfwadm syntax is slightly different:


    ```

    ipfwadm -F a accept -P tcp -S 0.0.0.0/0 -D 1.2.3.4/32 http -o

    ```


    The options used in this command are explained below.


    -F


    This argument indicates that the command will affect the forwarding rules (as
    opposed to input, output, or accounting rules).


    -S 0.0.0.0/0


    The -S option denotes a packet source. The network address of 0.0.0.0/0 is a special
    nomenclature indicating that the packet can have any origin.


    -D 1.2.3.4/32


    The -D protocol indicates a destination. The 1.2.3.4/32 is a fully-qualified Internet
    address. A complete network can be specified for either source or destination
    by indicating the number of bits in the netmask. For example, a 1.2.3.0/24 would
    allow traffic over the entire 1.2.3 Class C network.


    http


    This is the name of a protocol from /etc/services. The numerical port number may
    also be used.


    -b


    This argument indicates that the traffic is bi-directional, and the reverse of
    the rule is also allowed.


    -o


    Logging of matching packets to /var/log/messages is activated by this option.'
