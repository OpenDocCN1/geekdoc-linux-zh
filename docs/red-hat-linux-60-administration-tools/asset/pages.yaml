  md: '# Virtual Hosts with and without IP Aliases


    Several of the lines above must be changed to reflect the configuration of your
    web site. The directory used as the document root, the server name, and the names
    of the log files should be customized. The Apache documentation suggests that
    the argument to the VirtualHost directive be an IP address, not a host. If DNS
    should be unavailable for some reason when Apache is started, the VirtualHost
    directives cannot be resolved, they will be ignored. Specifying an IP address
    avoids this potential problem.


    A full discussion of virtual hosting under Linux is available in the IP-Alias-HOWTO.
    This file can be found in a HOWTO RPM distribution on the accompanying CD or from
    any of the online Linux documentation resources (such as http://www.linuxhq.com).


    # Name-based Virtual Hosts


    The HTTP/1.1 protocol supports a mechanism where the web server can obtain the
    name that the browser used to access the site. Apache can be configured to serve
    multiple web sites based upon this retrieved name, even when the DNS resolution
    of the sites all point to the same IP address.


    The Apache configuration for such an arrangement is only slightly different from
    IP aliases (the only difference is the “NameVirtualHost” directive). See Listing
    5.2 on page 125.


    # Listing 5.2 Name Virtual Host.


    NameVirtualHost 1.2.3.4


    ```

    <VirtualHost 1.2.3.4>

    ServerAdmin webmaster@luser.com

    DocumentRoot /home/luser/public_html

    ServerName www.luser.com

    ErrorLog logs/luser-error_log

    TransferLog logs/luser-access_log

    Referrer logs/luser-referer_log

    AgentLog logs/luser-agent_log

    </VirtualHost>

    ```


    There is also a ServerPath directive that can be used to compensate for older
    browsers that are not compliant with HTTP/1.1 (such as MS Explorer 2, which is
    shipped with Windows NT 4). The ServerPath directive takes a directory as an argument.
    This directory is'
