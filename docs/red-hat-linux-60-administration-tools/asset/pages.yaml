  md: '# Advice on Editors


    ```

    cp /usr/doc/vim-common-5.3/tutor ~

    vi ~tutor

    ```


    The behavior of the bash shell can be set to mimic vi if the root user issues
    the following commands:


    ```

    mv /etc/inputrc /etc/inputrc.old

    echo ''set editing-mode vi'' > /etc/inputrc

    ```


    All shells invoked after this point can use vi-style cursor movement commands
    (you must press the escape key, "i" or "k" to cycle through commands, rather than
    using the arrows directly). This affects not only the shell, but also every application
    that uses the GNU Readline library (such as gdb, psql, sqsh, etc).


    If all references to the ININPUTRC environment variable are removed from /etc/profile,
    each user can set an .inputrc file in their home directory with their shell editing
    settings (which was the default behavior in previous versions of Red Hat Linux).
    Additional information on the format of these files is available in the readline
    manual pages.


    However, for those unfortunate miscreants to the audacity to look elsewhere for
    their editing tools, there are a few alternatives.


    For the truly uninitiated, there is the pico editor that is included with the
    pine mail client. In its favor, pico has a very handy justification tool and an
    easy spell checker. It is also almost trivially easy to learn. It is, however,
    sorely lacking in features and flexibility. When using pico to edit important
    system files, it is usually much safer to call it with the single argument pico
    -w, which disables its habit of wrapping long lines.


    The basic XWindows installation also includes xedit, but it is not very powerful.


    The apparent GNU-endorsed editing environment is emacs is extremely powerful,
    but it is also big—very big. It includes a LISP interpreter and modes that run
    in character or XWindows.


    There are many choices in editors, but care should be taken in the final selection.
    Availability and features will soon come to be much more important than ease of
    use.'
