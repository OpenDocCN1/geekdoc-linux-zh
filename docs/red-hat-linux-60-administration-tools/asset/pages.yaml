- img_proc: true
  md: '# The GIMP


    The GNU Image Manipulation Program (GIMP) is a powerful imaging tool that is included
    with Red Hat Linux. One of the intentions of the GIMP is to reproduce most of
    the features and functionality of sophisticated image manipulation software in
    an application that is under the General Public License (GPL). This chapter will
    provide a brief introduction to the GIMP, with demonstrations of layers and selections.'
  merge: -1
  pgno: 232
- img_proc: true
  md: "The GIMP is not a Linux-only application. Far from it, the GIMP runs on most\
    \ other UNIX platforms, and a Win32 port also exists.\n\nWork on the GIMP has\
    \ also spawned other projects with profound influence on the Linux community.\
    \ The GIMP ToolKit (GTK), in particular, has risen out of the GIMP to become the\
    \ head of the GNOME project, which is the strongest contender for the Linux desktop.\n\
    \n# Free Fonts for the GIMP\n\nThe GIMP uses the fonts available with XWindows.\
    \ The X fonts included by Red Hat are complete, but lack many of the stylized\
    \ typefaces that graphic artists have to expect.\n\nInformation is available at\
    \ http://www.gimp.org/fonts.html about font resources for the GIMP. In particular,\
    \ the Freefonts and Sharefonts can be downloaded and added to the Xserver to vastly\
    \ increase the available typefaces. These extra fonts can be downloaded from ftp://ftp.gimp.org/pub/gimp/fonts.\
    \ These fonts can also be found in the /fonts directory on this text's included\
    \ CD-ROM.\n\nAssuming that freefonts-0.10.tar.gz has been stored in the root user's\
    \ home directory, the archive can be loaded into the Xserver with the following\
    \ commands:\n\n```\ncd /usr/X11R6/lib/X11/fonts\nt xzvf ~/freefonts-0.10.tar.gz\n\
    chown -R root.root freefont\ncd /etc/X11/fs\nawk'\n/fonts/Type1/{ print; print\
    \ \n\"/usr/X11R6/lib/X11/fonts/freefont,\"\"}\n! /Type1/\n' config.new\nmv config\
    \ config.without_free\nmv config.new config\n/etc/rc.d/init.d/xfs restart\n```\n\
    \nAfter this script has been executed, enter the following command from within\
    \ XWindows to see all the new available fonts:\n\nxlsfonts | grep free"
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Free Fonts for the GIMP


    Examine the /usr/X11R6/lib/X11/fonts/freefont directory after installation. Read
    the license files for any fonts you use continuously, and follow the instructions
    found there. The share fonts are also easily installed, although they have more
    strenuous licensing issues.


    Assuming that sharefonts-0.10.tar.gz has been stored in the root user''s home
    directory, the archive can be loaded into the Xserver with the following commands:


    ```

    cd /usr/X11R6/lib/X11/fonts

    tar xvzf~/sharefonts-0.10.tar.gz

    chown -R root.root sharefont

    cd /etc/X11/fs

    awk ''

    /fonts/Type1/ { print; print

    "/t/usr/X11R6/lib/X11/fonts/sharefont,"

    !/Type1/

    '' config.new

    mv config config.without_share

    mv config.new config

    /etc/rc.d/init.d/xfs restart

    ```


    After these commands have been executed, enter the following command from within
    XWindows to see all the new available fonts:


    xlsfonts | grep search


    One last font collection that can be installed is the URW collection of standard
    fonts (these are the standard fonts found on many Postscript printers). Assuming
    that urw-fonts.tar.gz has been stored in the root user''s home directory, the
    archive can be loaded into the Xserver with the following commands (there is a
    URW RPM that can be used):


    ```

    cd /usr/X11R6/lib/X11/fonts

    tar xvzf ~/urw-fonts.tar.gz

    chown -R root.root URW

    cd /etc/X11/fs

    awk ''

    /fonts/Type1/ { print; print "/t/usr/X11R6/lib/X11/fonts/URW,"

    !/Type1/

    '' config.new

    mv config config.without_urw

    mv config.new config

    /etc/rc.d/init.d/xfs restart

    ```'
