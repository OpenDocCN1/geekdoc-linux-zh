- img_proc: true
  md: '# Database Servers


    The administration of a Relational Database Management System (RDBMS) is not normally
    viewed as an enjoyable task by the general population of the Computer Science
    profession. The current technology behind such systems is more than twenty years
    old, and the standard database access language is now hindering the development
    of a true object-oriented database design. The World Wide Web, however, is generating
    renewed interest in database systems. In fact, to construct a web application
    that truly interacts with browser clients almost mandates the use of a database
    server.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'An DBMS enables the fast storage and retrieval of large amounts of information.
    The interface used to insert, manipulate, and extract data is called the Structured
    Query Language (SQL), and was developed by IBM for their DB2 database product
    in the 1970s.


    Two database servers will be addressed in this text: PostgreSQL and Sybase. PostgreSQL,
    the successor to the Postgres RDBMS, implements a subset of ANSI-standard SQL
    and runs on a variety of UNIX platforms. Precompiled binaries for PostgreSQL are
    now shipped in Red Hat Linux 6.0. PostgreSQL was developed in a university environment,
    and the performance of the database at high loads is poor.


    Sybase Adaptive Server Enterprise is a commercial RDBMS that has been available
    since 1988. Sybase is very powerful, but its administration is much more complex
    than that of PostgreSQL. It is available freely on Red Hat Linux with few restrictions.
    The RPM binaries for Sybase are on the CD included with this text in the /sybase
    directory. The implementation of a Sybase database will require much more planning
    than is required with PostgreSQL.


    Without an interface to link it to the Web, however, a SQL database will be of
    little use. Middleware is required to melt HTML and SQL into a single format.
    This software will be discussed in the next chapter, which addresses web sites
    with dynamic content.


    # Installing PostgreSQL


    If you are preparing for a fresh installation of Red Hat Linux 6.0, installation
    of PostgreSQL will be simple. Just select the SQL server from the “Components
    to Install” menu at setup time. Then, later in the setup, indicate that the PostgreSQL
    server should be started at boot in the “Services” menu. The software will be
    installed, a postgres user will be added as a Database Administrator (DBA), and
    startup scripts and links will be installed under /etc/rc.d to spawn the database
    server in the appropriate system run levels (supported by the UNIX init utility).


    If the installed copy of Red Hat Linux 6.0 does not include the database components,
    they can be installed at a later time as long as access to the RPMs containing
    PostgreSQL can be obtained. The'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Establishing a PostgreSQL Database


    RPMs can be found on the distribution CD included with this text (under RedHat/RPMs)
    or on the Red Hat FTP site. They can be installed and configured by running the
    following commands as root:


    ```

    - rpm -Uvh postgresql-6.4.2-3.i386.rpm

    - rpm -Uvh postgresql-clients-6.4.2-3.i386.rpm

    - rpm -Uvh postgresql-devel-6.4.2-3.i386.rpm

    tsysv

    ```


    The ntsys command will allow the selection of which system services are started
    at boot time (it creates links from /etc/rc.d/init.d to files in /etc/rc.d/rc.x).
    If you want PostgreSQL to start at boot time, make sure that it is selected. It
    is important to note, however, that critical database system data must be initialized
    before the PostgreSQL subsystem can be used. Without this initialization, the
    postmaster daemon will not start. The steps required to initialize this data can
    be found below.


    # Establishing a PostgreSQL Database


    The best way to learn to set up and use a DBMS is by following a set of consistent
    commands that initialize a database, populate it with some records and then issue
    queries against it. To this end, the following set of commands and some examples
    will create a database that implements a web-enabled shopping list.


    Once PostgreSQL is installed, its system databases must be initialized. This will
    not be necessary on an upgrade installation where PostgreSQL was in active use,
    but it will be required if the database server has never been started before.
    If you are unsure if this step is necessary, startup the Postgres subsystem, as
    root, with the following command:


    ```

    /etc/rc.d/init.d/postgresql restart

    ```


    If this command fails, you will know that the databases were never initialized,
    and the following commands must be run. (Otherwise, they should be skipped).


    ```

    su - postgres

    PGDATA=/var/lib/postgresql PGLIB=/usr/lib/postgresql initdb

    exit

    /etc/rc.d/init.d/postgresql start

    ```'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'Afterward, users should be created that will maintain the databases. These
    users must also be registered with the PostgreSQL server. The commands below will
    add a user named user to a Red Hat system, register both user and nobody with
    the database server. If a different account name for user is desired, substitute
    the name for user in the rest of this chapter.

    As the root user, issue the commands in Listing 6.1.


    # Listing 6.1 Adding Postgres users.


    ```

    useradd user

    su - postgres

    createuser user

    ter user''s postgres ID OR RETURN to use unix user ID:

    500 -> (enter)

    is Is "user" allowed to create databases (y/n) y

    is Is "user" allowed to add users? (y/n) n

    createuser: user was successfully added

    createuser nobody

    ter user''s postgres ID OR RETURN to use unix user ID:

    99 -> (enter)

    is Is "nobody" allowed to create databases (y/n) n

    is Is "nobody" allowed to add users? (y/n) n

    createuser: nobody was successfully added

    don''t forget to create a database for nobody

    exit

    ```


    The useradd command records a new user in the system password database (/etc/passwd).
    The createuser command adds a new PostgreSQL user with the database. Don''t forget
    to set the UNIX password for the user account with the passwd command.

    The user nobody needs to be registered with the database because the web server
    runs under this userid. PostgreSQL makes a strong association between the UNIX
    user and the database user, unlike Sybase where the two are completely separate.
    This action (i.e., adding nobody to the database) will enable the web server to
    run queries against the database server.


    Next, login as user and run the following command:


    # createdb shopping


    This command creates a database. Older DBMS applications (like dBase and its derivatives)
    called tabular collections of data, databases. Relations could be established
    between these databases.'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'This is not so in PostgreSQL. In this new paradigm, databases contain tables,
    and these tables contain the tabular data. Relations are established between tables
    that lie within a database. The previous command (i.e., createdb) creates only
    the database; the tables are created in a later step.


    Now, while logged in as user, enter the following command to initiate the interactive
    SQL interpreter:


    # psql shopping


    The SQL interpreter will print a welcome message:

    Welcome to the POSTGRESQL interactive sql monitor:

    Please read the file COPYRIGHT for copyright terms of POSTGRESQL


    ```

    type \? for help on slash commands

    type \q to quit

    type \g or terminate with semicolon to execute query

    You are currently connected to the database: shopping

    ```


    shopping->nSQL commands may be entered directly at the prompt. They may span many
    lines if necessary. The command is not issued until a semicolon is encountered.


    Enter the following text at the prompt to create a table to hold the shopping
    list:


    # CREATE TABLE list (


    ```

    Item TEXT,

    Vendorcode INT,

    Quantity INT);

    ```


    This command creates a table named list, which is composed of three fields. The
    fields correspond to columns in a spreadsheet (although a PostgreSQL database
    can be orders of magnitude larger than the largest spreadsheets). The names of
    the fields are item, vendorcode, and quantity. The fields have an associated data
    type. For instance, the vendorcode and quantity fields are both defined as type
    integer (they can only contain numbers, not text). The item field is of type text,
    and it can be of any length.'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'SQL is not case-sensitive, so any combination of upper- and lower-case characters
    can be used with its commands. The style used here follows that of most popular
    tutorial texts on database design, which allows one to easily distinguish the
    SQL reserved words from the variable names.


    The following command creates another table "vendors" with two fields: for integers,
    and the other for text.


    ```

    CREATE TABLE vendors (

    Vendorcode INT,

    Vendorname TEXT);

    ```


    At this point, the tables have been created and they are empty. The SQL INSERT
    command can be used to populate the tables with several values, as shown:


    ```

    INSERT INTO vendors VALUES (100, ''Super Grocer'');

    INSERT INTO list VALUES (''Root Beer'', 100, 3);

    ```


    The previous insert syntax is valid and very useful for quicktime jobs. However,
    if columns are added to or removed from the tables, the above insert syntax will
    likely fail because of mismatches between the column and data types. An alternate
    syntax is available that can specify the columns into which data will be inserted.
    Any columns not mentioned will receive NULL values (if such values are allowed).


    ```

    INSERT INTO vendors (vendorcode, vendorname)

    VALUES (101, ''General Department Store'');

    INSERT INTO vendors (vendorcode, vendorname)

    VALUES (102, ''General Auto Parts'');

    INSERT INTO list (item, vendorcode, quantity)

    VALUES (''Ice Cream'', 100, 1);

    INSERT INTO list (item, vendorcode, quantity)

    VALUES (''Napkins'', 101, 50);

    INSERT INTO list (item, vendorcode, quantity)

    VALUES (''Spark Plugs'', 102, 4);

    ```


    The data can be examined with the SQL SELECT command, shown here:


    ```

    SELECT item, vendorcode, quantity FROM list;

    ```


    The SQL interpreter should respond with:'
  merge: -1
