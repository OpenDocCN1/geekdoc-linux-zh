    # Advice on Editors


    Editing text files is a critical operation within UNIX, especially for an administrator.
    For serious aficionados, vi is the one true UNIX editor. It is practically guaranteed
    to be installable on any version of UNIX available.


    However, vi itself is not free software, and it is generally not included with
    open-source versions of UNIX. Other versions of Linux include clones of vi, with
    esoteric names such as vile, elvis, or nvi.


    Red Hat Linux uses vim which is short for “VI Improved,” and improved it. A wonderful
    tutorial for novice users is included in the vim package. Any user can start the
    tutorial by issuing the following commands:'
  merge: -1
