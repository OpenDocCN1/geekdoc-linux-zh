  md: '# Planning for Installation


    This command writes an /etc/X11/XF86Config file for the previously mentioned Mitsubishi
    monitor. The startx command can then be run after installation.


    For the utmost control over the configuration of XWindows, use the x86config utility,
    rather than Xconfigurator. Because of its complexity, x86config is not covered
    in this text.


    Once XWindows has been properly configured, the Xserver can be started with various
    color bit depths with the following commands:


    startx


    This command starts XWindows with the default color bit depth. This is usually
    256-color, 8 bits per pixel. Xconfigurator might choose a different color depth,
    however.


    startx --bpp 8


    This command starts XWindows in 256-color mode, with 8 bits per pixel. This color
    depth is not very good, and most window managers will quickly exhaust the available
    colors.


    startx --bpp 16


    This command starts XWindows in 65,536-color mode, with 16 bits per pixel. This
    is the most popular color depth.


    startx --bpp 24


    This command starts XWindows in 16,777,216-color mode. This mode has much more
    precise color reproduction, but is much more processor-intensive.


    # Warnings for SCSI Systems


    Nearly every Linux kernel has built-in support for IDE devices, including hard
    disks and CD-ROM drives. This is not for SCSI devices.


    Drivers for various brands of SCSI cards are stored as modules, which are loaded
    dynamically by the kernel as it boots. Unless arrangements are made for the module
    to be loaded, the entire SCSI system will be unavailable to a generic kernel.
    The Red Hat Linux installation disks and the kernel installed by this process
    use a special RAM disk to hold modules for SCSI cards. If the kernel or the RAM
    disk become corrupt, the bootdisk will be required. This is why it is so important
    to create boot images for Linux systems with SCSI devices (although it is a good
    idea for all systems in general).'
  merge: -1
