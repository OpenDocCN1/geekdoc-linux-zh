- img_proc: true
  md: 'It is also possible to use a simple shell script to print to remote Windows
    printers. Record the following shell script in the file

    winprint:


    ```

    #!/bin/sh

    SERVER="NHOST"

    SERVICE="PRINTER"

    USER="user"

    PASSWORD="secret"

    echo "print -"

    cat $*"

    )| /usr/bin/smbclient "\\\\$SERVER\\$SERVICE" $PASSWORD -U

    $SERVER -N

    ```


    An example of using the winprint script could be:

    winprint /etc/passwd /etc/group /etc/hosts


    There is one extremely important point to make about these SMB printers. The username
    and passwords that are entered in the Print System Manager dialog boxes are saved
    and then sourced directly into a shell script.


    Because of this, a password of ";rm -rf / could be potentially disastrous. To
    be safe, limit the sharenames, usernames, and passwords to alphanumeric characters
    ([A-Za-z0-9]).'
  merge: -1
