    # TIS Firewall Toolkit


    The FireWall Toolkit (FWTK) from Trusted Information Systems (TIS) is a free package
    containing a set of small programs that can be used for a variety of network functions,
    including firewall design.


    If two hosts communicate across a routing firewall, it should not be necessary
    for either host to be aware of the mechanics of the connection. They generate
    packets for one another that are checked (and perhaps slightly modified) by the
    firewall, but the hosts would be otherwise oblivious to the presence of the bastion
    host.


    A proxy firewall, on the other hand, normally requires that at least one of the
    pair of hosts be aware of the firewall''s location and the methods used to access
    it.


    The FWTK includes small programs that implement proxies for several types of services
    within the TCP/IP suite, including FTP, Telnet, HTTP (web), SMTP, Berkeley login,
    and X. There is also a generic proxy which is extremely useful as a part of firewall
    design and UNIX administration in general.


    Unfortunately, the TIS FWTK is not included with Red Hat Linux. While it is open
    source, its licensing agreement is somewhat more restrictive than the GNU Public
    License (GPL); certain types of commercial use are restricted. The FWTK can be
    obtained from http://www.fwtk.org, but do not download the product unless you
    can abide by the license.


    Network Associates (who recently acquired Trusted Information Systems) also sells
    a commercial firewall called Gauntlet. Gauntlet is very powerful; it contains
    all the proxy features of the FWTK—the same packet masquerading features as the
    Linux kernel—plus a number of advanced features and a graphical administration
    interface. It is not difficult to migrate from the FWTK to Gauntlet.


    However, Gauntlet does not as yet on Red Hat Linux, so a change in platform will
    be required.'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'The latest version of the FWTK (at the time this text was prepared) is fwtk2.1.tar.z.
    By default, the proxy applications and a control file are installed in /usr/local/etc
    (the directory will be created if it does not exist).


    There is a problem with the crypt() library function when building the FWTK on
    Red Hat Linux. Run the following commands as root to overcome this problem and
    compile and install the package:


    ```

    tar xzvf fwtk2.1.tar.gz

    cd fwtk

    sed ''s/^\AUXLIB=*/AUXLIB=-l\crypt/;s/^\COPT=*/COPT=-O2 $(DEFINES)-I\/usr/Include/db1/s/^\LDFL=*/LDFL=-s
    static/'' Makefile.config.linux > Makefile.config

    make

    make install

    ```


    Please note that the above commands enable optimization and stripping (and disable
    debugging) of the toolkit components in addition to setting the usage of the crypt
    library. This is not the default build environment for the kit. Review Makefile.config.linux
    for additional build configuration details.


    These are some of the files that will be installed in /usr/local/etc:


    netperm-table

    This is the master configuration file for the toolkit.


    ftp-gw

    This is the FTP proxy.


    http-gw

    This is the HTTP (web) proxy. It can be configured to block Java and JavaScript,
    it should be necessary. It can also route requests to multiple hosts, depending
    upon the form of the URL.


    netacl

    This is a utility similar to tcpd. It is somewhat more flexible in that it can
    execute different programs depending upon the origin of the network connection.


    plug-gw

    This is the generic proxy. It can allow connections to and from arbitrary TCP
    ports.'
