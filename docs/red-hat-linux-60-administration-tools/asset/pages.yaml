  md: '# Sample Installation


    The daemon will not start without a number of important control files in place.
    An entry for this daemon does not appear in the initial installation, but appears
    later with the ntsysv command if the DHCP subsystem is installed.


    gpm


    General Purpose Mouse—allows the use of the mouse to cut and paste text on the
    console (not XWindows).


    httppd


    Hyper-Text Transport Protocol Daemon—this daemon is the web server.


    inet


    Internet Superuser—this daemon launches many other Internet-related daemons, including
    ftpd, telnetd, pop, etc.


    keytable


    Keytable—this controls the keyboard map.


    linuxconf


    linuxconf—Allows configuration data specified in the linuxconf utility to be loaded.


    lpd


    Line Printer Daemon—the printer spooler.


    named


    Name Server Daemon—the Berkeley Internet Name Server daemon. Installed as a caching-only
    server out-of-the-box.


    netfs


    NetFS—this utility mounts any remote NFS, SMB and NCP volumes specified in /etc/fstab.


    network


    Network—this script brings up networking devices.


    nfs


    Network File System Daemon—launches NFS daemon. It requires portmap.'
  merge: -1
