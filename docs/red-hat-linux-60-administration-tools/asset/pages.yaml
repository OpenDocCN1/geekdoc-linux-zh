    One specific indexing feature should be discussed in the above example. The above
    commands create a clustered index on each table. A clustered index in Sybase orders
    the data in the table in the method specified in the index statement. The important
    thing to think about clustered indexes is that the space released by SQL DELETE
    statements is not reused unless a clustered index is defined. Only a single clustered
    index can be defined for a table (the data can only be organized one way). Clustered
    indexes can be removed from a table with a SQL DROP INDEX command. Normal indexes
    can be created by omitting the CLUSTERED keyword.


    Sybase also has a utility called bcp that can be used to copy database data in
