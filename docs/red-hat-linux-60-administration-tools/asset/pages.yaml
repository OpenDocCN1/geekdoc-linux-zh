  md: '# Rebuilding the Linux Kernel


    Basic to most UNIX environments is the configuration of the kernel, and Red Hat
    Linux is no exception. The Linux kernel used by Red Hat can be manipulated both
    through run-time configuration directives and through a complete rebuild of its
    operating environment. This chapter will concentrate upon the kernel build environment
    and the methods required to generate an operational kernel.'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'The Linux kernel is distinctive among major commercial UNIX variants because
    the complete source code for the kernel is available and generally included in
    most major Linux distributions. If you are curious about a particular Linux implementation
    detail, you can look at the source. If you have a special need that requires modification
    of the kernel, you can apply a patch and build your own special version of Linux.


    This is not to say that building a kernel is a required step in the administration
    of a Linux system. No application mentioned in this text mandates a kernel with
    special features; the generic kernel left on your system by the installer contains
    everything that is required. While older Linux implementations commonly required
    custom kernels (especially in the days before kernel modules) in order to work
    properly, recent improvements in Linux have obviated much of the need for customization.
    A Linux administrator who insists on a custom kernel without a specific reason
    is behind the times. There are times, however, when kernel configurations might
    be needed.


    Since security vulnerabilities were found in the 2.2.5 kernel shortly after Red
    Hat Linux 6.0 was released, any production Linux installation based on the 2.2
    kernel series should be upgraded to a patched kernel. This can be done with a
    complex set of steps involving RPM, or by building a new kernel. Both methods
    are outlined below.


    It is more important to build custom kernels for servers with Internet exposure
    than for workstations. It is also easier, since servers generally do not have
    sound cards or other hardware that increase kernel complexity.


    The Linux kernel is usually stored in a file called vmlinuz, in the root directory
    of the system. Red Hat Linux 6.0, however, puts the kernel in the /boot directory
    under a different name (such as vmlinuz-2.2.5-15). The kernel is loaded at boot
    time. As it boots, the kernel probes the system and configures basic hardware
    settings. It then loads a program called init, which continues the boot process.
    (The boot sequence is not documented in this text.) While portions of the kernel
    can be loaded or removed at will, the only way to switch to a completely different
    kernel image is to reboot.'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Installing the Kernel Source


    Throughout this text, there is an implicit understanding that i386 architecture
    is in use. We now make that assertion explicit—the slight differences in preparing
    and booting kernels for Alpha and Sparc architectures are not discussed here.


    # Installing the Kernel Source


    The Linux kernel is written in C and requires a C compiler in the development
    environment. A copy of the kernel source (version 2.2.12) is included in the /linux
    directory on the CD-ROM that accompanies this book. It is encoded with the bzip2
    compression utility. This bzip2 utility is not installed by default, but an RPM
    package for installing it is available in the standard distribution of Red Hat
    Linux 6.0. If you do not know how to install such packages, you are definitely
    not ready to build a new kernel. Read the RPM section of Chapter 1 for information
    on installation.


    When building a kernel, it is very easy to make a mistake that will prevent a
    system from booting. Kernel builds are not for the inexperienced. An emergency
    boot disk, created at installation time, is mandatory. For an inexperienced administrator,
    it is not a question of whether or not a future kernel build will render the system
    incapable of booting—it is a question of when it will.


    Assuming that the CD-ROM included with this text is mounted on the /cdrom directory,
    the kernel source can be unpacked with the following sequence of commands:


    ```

    cd /usr/src

    rm -f linux

    bzip2 -cd /cdrom/linux/linux-2.2.12.tar.bz2 | tar xvf -

    own -R root.root linux

    cd linux

    ```


    Once the 2.2.12 kernel source is installed, you should check for newer versions
    of the kernel on-line. Two popular Linux kernel sites are http://www.kernel.org
    and http://www.kernelnotes.org. If there are new kernel versions available, download
    and apply the patch files to bring your kernel source up-to-date. The patches
    are applied with a command of the:


    ```

    cd /usr/src/linux; bzip2 -cd ~/patch-2.2.x.bz2 | patch -p1

    ```'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'FTP access to kernel.org is facilitated by the use of country codes. Administrators
    in the United States, for example, should use the ftp.us.kernel.org address to
    download kernel patches from the /pub/linux/kernel/v2.2 directory. Users in the
    United Kingdom should use ftp.uk.kernel.org, and Canadians should use ftp.ca.kernel.org,
    etc.


    # Note


    It should not be necessary to download the entire kernel source package. Use the
    patches, as they are much smaller and accomplish the same thing (i.e., they will
    update your source code to the newer release).


    The kernel source is also available in RPM format in the standard Red Hat distribution,
    but the use of the Linux kernel RPMs is not recommended. The RPM versions do not
    include the entire source distribution. Source patches will commonly fail to work
    properly with these versions.


    # Navigating “make config”


    There is one valuable piece of advice for users considering the use of the make
    config command to configure the kernel—don’t! The make config command has been
    supplanted by the much easier make menuconfig, which is the most flexible of the
    kernel build configuration utilities. make xconfig is also useful, but since it
    requires Windows, it is not covered in this text.


    Enter the following command to configure the build options for the Linux kernel:


    ```

    make menuconfig

    ```


    A menu similar to that in Listing 10.1 will appear. Each menu option composes
    a major subsection of the kernel configuration parameters. Within these subsections,
    individual options can be enabled or disabled. Most options, as they are enabled,
    cause extra code to be compiled into the kernel. This makes the binary kernel
    image larger.


    Most of these options can be built in one of two ways. They can either be compiled
    directly into the kernel binary, or they can be built as modules (which can be
    loaded and removed from the'
  merge: -1
