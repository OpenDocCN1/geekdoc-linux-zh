  md: 'The HTTP proxy also can direct to various servers depending on the form of
    the URL:


    ```

    http-gw* forward /Home* -protocol http -tohost www.tis.com

    http-gw forward /pub/* -protocol ftp -tohost ftp.uu-net

    ```


    Perhaps the most flexible proxy is plug-gw. It allows the redirection of arbitrary
    TCP ports, and has great potential use beyond that of a firewall. For example:


    ```

    pop-3 stream tcp nowait.1024 root /usr/local/etc/plug-gw plug-gw pop-3

    ```


    The above line from /etc/inetd.conf directs the POP mail port to be served by
    plug-gw.


    ```

    plug-gw: port pop-3 * -plug-to mail.remote.com -port 110

    ```


    This configuration directive will automatically establish a connection to a remote
    POP port when a connection on the local POP port is initiated.


    Note that the service name (pop-3) and the port number (110) are used interchangeably
    (the service names are defined in /etc/services). The only place where the name
    must be used is the service definition in /etc/inetd.conf. The final -port 110
    above is also optional, as plug-gw will, by default, redirect to the same numerical
    port from which it originated.


    Note also that either the service name or number must be passed as an argument
    in /etc/inetd.conf. The plug proxy will not work without this argument.


    There are a few other important proxies that are not covered here (Berkeley login,
    x-gw, and smap), but their configuration is either similar enough to the previously
    discussed proxies to be trivial, or their configuration is complex enough to be
    beyond the scope of this text.


    These proxies can also be configured as stand-alone applications, running outside
    of inetd. This configuration is not covered here.


    The use of a proxy firewall (over a routing solution) has both advantages and
    drawbacks. A great advantage is the increased ability to filter both the data
    and the origin/destination. A tremendous drawback is the responsibility placed
    upon those behind the firewall to understand the architecture of the proxy.'
