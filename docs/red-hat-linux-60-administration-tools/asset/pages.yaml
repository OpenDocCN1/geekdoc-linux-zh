  md: '|vendorcode|vendorname|

    -------------------|----------------|

    100|Super Grocer

    101|General Department Store

    102|General Auto Parts


    (3 rows) In the case of these two tables, however, the vendorcode field is not
    very useful. It would be much more appropriate to list the vendorname field from
    the vendors table when printing the list table. Such a thing is possible by establishing
    a *relation:


    ```

    SELECT list.item, vendors.vendorname, list.quantity

    FROM list, vendors

    WHERE list.vendorcode = vendors.vendorcode;

    ```


    |item|vendorname|quantity|

    ------|----------------|----------|

    Root Beer|Super Grocer|3

    Ice Cream|Super Grocer|1

    Napkins|General Department Store|50

    Spark Plugs|General Auto Parts|4


    (4 rows) In the example above, the FROM clause specifies that two tables are to
    be used. The WHERE clause specifies the conditions for the relation. Relations
    such these are called *joins* in SQL.

    When two tables are used in a SELECT statement, such as the one above, the tablename.fieldname
    syntax is used to distinguish between the tables and fields.

    There are many more options to the SQL SELECT statement—so many that SELECT is
    the most powerful command in the SQL language. Here is a slight variation on the
    previous example:


    ```

    SELECT list.item, vendors.vendorname, list.quantity

    FROM list, vendors

    WHERE list.vendorcode = vendors.vendorcode

    ORDER BY item;

    ```


    |item|vendorname|quantity|

    ------|----------------|----------|

    Ice Cream|Super Grocer|1

    Napkins|General Department Store|50

    Root Beer|Super Grocer|3

    Spark Plugs|General Auto Parts|4


    (4 rows)'
