    -s 0.0.0.0/0


    The -s option denotes a packet source. The network address of 0.0.0.0/0 is a special
    nomenclature indicating that the packet can have an origin of any IP address.
    If the -s option is omitted, 0.0.0.0/0 will be assumed.


    -p TCP


    Packets using the TCP protocol, and only those packets, will be passed. User Datagram
    Protocol (UDP) or Internet Control Message Protocol (ICMP) packets will be rejected.


    -d 1.2.3.4/32


    The -d option indicates a destination. The 1.2.3.4/32 is a fully-qualified Internet
    address (i.e., it represents a single host). A complete network can be specified
    for either source or destination by indicating the number of bits in the netmask.
    For example, 1.2.3.0/24 would allow web traffic over the entire 1.2.3 Class network.
    We should note that the address 1.2.3.4 is not really a Class C Internet address
    (it is really a Class A address). We are using it in the context of a Class C
    to make the meaning clear. To emphasize, neither the network 1.2.3 nor any derivative
    of it should ever be used on the Internet.


    http


    This is the name of a protocol from /etc/services. The numerical port number may
    also be used.


    -j ACCEPT


    The argument to the -j parameter is the desired target action for packets matching
    the previous parameters. In this case, the packet is accepted for forwarding.
    The allowable target actions are: ACCEPT, DENY, DENQ, MASQ, REDIRECT, REJECT,
    RETURN are similar, but REJECT generates an ICMP destination unreachable message,
    while DENY discards the packet with no further action. MASQ allows one computer
    to masquerade as another. REDIRECT allows packets destined for a remote machine
    to be received locally (which can be useful for transparent proxies). RETURN indicates
    that the default chain policy should be used for this rule.'
