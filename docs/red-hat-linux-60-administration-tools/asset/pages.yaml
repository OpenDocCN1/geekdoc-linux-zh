  md: '# Virtual Hosts with IP Aliases


    Virtual Hosts with IP Aliases


    Assuming that a Linux system''s eth0 Ethernet interface has been configured with
    IP address 1.2.3.3, the following commands will configure eth0 to respond to 1.2.3.4
    as well (which is central to establishing a virtual host):


    ```

    /sbin/ifconfig eth0:1 1.2.3.4

    /sbin/route add -host 1.2.3.4 dev eth0:1

    ```


    Obviously, no other machine on the network should be using the IP address 1.2.3.4.
    If you''re unsure, do not guess—check with the administrator.


    These commands should be added to the system boot scripts. Be certain that they
    execute after the main ifconfig command(s) (a good place might be /etc/rc.d/init.d/network).


    A sequence of virtual interfaces can begin with eth0:1 and continue with eth0:2,
    eth0:3, eth0:4... Individual IP addresses are then associated with each virtual
    interface. This allows a number of virtual IP addresses on one network interface—up
    to 255.


    Once the additional IP addresses have been added to the interface, DNS entries
    should be added with address records that point to the new entries (discussed
    in Chapter 2, “Configuring TCP/IP”).


    The web server must then be configured to serve a different document root to each
    unique IP address.


    This behavior can be initiated by the Red Hat Linux Apache server by adding a
    set of lines like those shown in Listing 5.1—one for each interface—to the end
    of /etc/httpd/conf/httpd.conf:


    # Listing 5.1 Virtual Host.


    ```

    <VirtualHost 1.2.3.4>

    ServerAdmin webmaster@user.com

    DocumentRoot /home/user/public_html

    ServerName www.user.com

    ErrorLog logs/user-error_log

    TransferLog logs/user-access_log

    ReferrerLog logs/user-referrer_log

    AgentLog logs/user-agent_log

    </VirtualHost>

    ```'
  merge: -1
