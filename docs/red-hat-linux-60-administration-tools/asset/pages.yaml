    This concludes our introduction to the GIMP. There is a great deal more to discover.
    This tutorial is specifically sparse on the subject of selections. We have not
    covered freehand selections, selections with Bezier curves, fuzzy selections,
    intelligent scissors, or selecting by color, nor have additive selections been
    been addressed. The XCF image above can be found in the /fonts directory on the
    CD-ROM included with this text.


    # Other Imaging Tools


    A few other applications can complement the use of the GIMP. *Electric Eyes* is
    an application based upon the GIMP ToolKit (GTK). It is intended for displaying
    large sequences of images. Its image-editing functions are very limited, and it
    has bugs. *ImageMagick* is a much older suite of imaging tools. It has an image-viewing
    tool called display. Type **display** at a shell to start it. A modified version
    of the display tool, called animate, displays a sequence of images quickly. A
    particularly useful component is the convert utility, which allows images to be
    converted between different formats directly from the shell, without starting
    Windows. For example, the command **convert a.jpg GIF:a.gif** converts a JPEG
    file called “a.jpg” into GIF format. The following shell script converts all TIFF
    files in a directory to JPEG images (and was used in the production of this text):


    ```

    for x in *.tif; do convert $x JPG:echo $x | sed ''s/tif$//jpg/''; done

    ```'
