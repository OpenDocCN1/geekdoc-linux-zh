  md: '# RPM Basics and Red Hat Errata


    The Redhat Package Manager (RPM) is a powerful system that allows the software
    installation and upgrades to be applied with a minimum of effort. It is a software
    distribution scheme that allows source code to be distributed in a pristine original
    format. But it also encompasses binary distributions, which allow for extremely
    rapid installation.


    RPM has become so popular that several other Linux distributions have endorsed
    it as their preferred installation method. There are also utilities that convert
    packages between RPM and the competing Debian DEB package format.


    All the RPM packages that make up Red Linux 6.0 are contained in the RedHat/RPM
    directory on the CD-ROM included with this text. For example, one of the packages
    that is included is the samba-1.9.18p10-3.1386.rpm file. The various extensions
    on the RPM file identify the processor architecture for which it was produced
    (alpha, sparc, or i386) or whether it is not a source distribution (src).


    It is assumed in this section (and most of this text) that the Intel 386 architecture
    is the target platform.

    Following is a list of the more common ways that RPM is used:


    +   rpm -Uvh package.i386.rpm


    Causes RPM to either install or upgrade a package file.


    +   rpm -e package


    Removes the installed package from the system. Notice the lack of the .386.rpm
    extension.


    +   rpm -q package


    Queries installed packages. Release numbers can be omitted, so the command rpm
    -q samba might produce the result samba-1.9.18p10-3, if the package is installed.


    +   rpm -qa


    Generates a list of all installed packages on the system. It is sometimes useful
    to pipe the output to either sort, grep, or more.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# rpm -ql package


    Generates a list of all files that have been installed by a package.


    # rpm -qf file


    Generates the name of the package that installed a particular file.


    # rpm -qpl package.i386.rpm


    Generates a list of all files included in a package file.


    # rpm -qi package


    Generates a detailed description of an installed package.


    # rpm -qpi package.i386.rpm


    Generates a detailed description of a package file.


    # rpm2cpio package.src.rpm


    Extracts individual files within a package. It is most useful with source RPMs.
    rpm2cpio package.i386.rpm | cpio -i, which extracts all included files in the
    current directory.


    # rpm --rebuild package.src.rpm


    Unpacks and builds a binary RPM distribution file under /usr/src/redhat.


    One of the most important post-installation uses of the RPM format is for security
    patches issued by Red Hat. Information about the patches can usually be found
    in the support areas of the Red Hat website, and the patches themselves are located
    at ftp://ftp.redhat.com/redhat/updates/6.0/i386 (at the time that this text was
    composed). A partial copy of these updates is included on the CD-ROM (there are
    so many updates that they won''t fit on the distribution CD).


    To give an example, a security vulnerability was found in the Netscape distribution
    that was included with Red Hat Linux 6.0. To quote the information at the Red
    Hat website:


    New netscape packages are available. While they are not specifically security
    updates, among the changes listed are “Fixes to improve security"; therefore it
    is recommended that users update to the new packages.'
