  pgno: 289
- img_proc: true
  md: '# Burning an audio image to a CDR with cdrecord


    only under “disk at once” mode, although TAO mode can make limited use of the
    .inf files created by cda2wav. The proper invocation of cdrecord for DAO mode
    is:


    ```

    /opt/schily/bin/cdrecord -v speed=2 dev=0,0,0 -pad -dao -useinfo -audio *.wav

    ```


    Unfortunately, the author’s drive (a Mitsumi 2801) does not support DAO mode.
    -useinfo will someday have better support for TAO mode.


    Some Linux implementations also suffer from a “read ahead bug” which can corrupt
    CDRs written in TAO mode. This problem is discussed in the AN-1.8a18 file included
    in the cdrecord distribution; the problem can also be corrected by the use of
    padding.


    A data track can also be included, in addition to the audio tracks, in a “mixed-mode”
    CD. The single data track is specified first:


    ```

    /opt/schily/bin/cdrecord -v speed=2 dev=0,0,0 /tmp/cdimage.raw \ -pad -useinfo
    -audio *.wav

    ```'
