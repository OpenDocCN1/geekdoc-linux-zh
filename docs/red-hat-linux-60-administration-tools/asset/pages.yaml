- img_proc: true
  md: 'Any normal network services which run on the first interface (i.e., Telnet,
    FTP, etc.) will run on the second. Some services pay particular attention to IP
    Alias settings, and will modify their behavior for each interface if configured
    to do so (e.g., Apache). Additional interfaces can be created by following the
    sequence


    ```

    /sbin/ifconfig eth0:1 192.168.1.3

    /sbin/route add -host 192.168.1.3 dev eth0:1

    ```


    A computer could provide backup network services for another by issuing ping packets
    at regular intervals. If the remote host does not respond, the first computer
    could automatically execute an IP Alias for the inoperative host''s network address.
    This provides a rudimentary form of fault tolerance.


    # DHCP


    The Dynamic Host Configuration Protocol (DHCP) is a method of allocating IP addresses
    and other relevant parameters for TCP/IP from a centralized repository, rather
    than recording the information statically on each host. A DHCP server should be
    a computer that is operational and attached to its network continuously—it must
    be available whenever clients request its services. If a network has more than
    a few hosts, and it has a Linux system that is in continual operation, it should
    have a DHCP server to ease network administration. The server portion of the protocol
    is implemented by the dhcpd daemon. This server protocol is compatible with the
    DHCP implementations used by other operating systems (e.g., the variants of Microsoft
    Windows). The Linux client port is controlled by dhcped or pump. It is automatically
    configured if DHCP is selected for the TCP/IP configuration at installation time.
    It can be implemented after installation via netcfg.


    The DHCP server is not automatically installed when a Red Hat Linux system is
    prepared. It can be installed by running the following commands as *root* from
    the RedHat/RPMs directory of the CD included with this text:


    ```

    rpm -Uvh dhcp-2.0b1pl6-6.i386.rpm

    touch /etc/dhcpd.leases

    ```'
