  md: '# Sybase Configuration


    Sybase configuration changes are made with the Sybase isql (Interactive SQL) utility—or
    sqsh, if it was installed. isql can be invoked with this command:


    ```

    isql -U sa -S SYBASE

    ```


    If sqsh is used with the same arguments, an interactive SQL session will be initiated
    that is supported by GNU Readline (for command repetition) and XWindows.


    The -U option selects the account under which to login. The -S option selects
    the server (it must be defined in the interfaces file). This option can be omitted
    if the server is named SYBASE, since this server name is assumed by default. If
    the shell cannot find the isql binary, enter its full path (/home/sybase/bin/isql
    or /opt/sybase/bin/isql, or the location for sqsh). You will be prompted for a
    password before the SQL session begins; there is no initial password for the sa
    account, so just press “Return”.


    The version number of the Sybase server can be printed with the following commands:


    ```

    select @version

    go

    ```


    ```

    SQL Server/11.0.3.3/P/Linux Intel/Linux 2.0.36

    1586/1/OPT/Thu Sep 10 13:42:44 CEST 1998

    ```


    The following commands, which will add a new 20MB default device and remove the
    master device from the default device list, should be entered at the isql prompt:


    ```

    disk init name="gendev",nphysname="/home/sybase/gendev.dat",ndevno=2,

    size=10240

    go

    sp_diskdefault master, defaultoff

    go

    sp_diskdefault gendev, defaulton

    go

    ```


    At this point, a password should be set for the sa account, and additional users
    can be created. These users can be granted permission to create databases. Some
    DBAs are hesitant to grant such privileges to their users, and prefer to create
    all databases themselves and transfer ownership afterwards.'
