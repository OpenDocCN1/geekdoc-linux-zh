  md: '![](img/7fb45bf48608bf2c3ba3e2d71ee8fcff_111_0.png)


    **Figure 4.1** *The network configuration utility.*


    This option does not take effect until the system is rebooted.

    While it may seem complex, it involves modifying only a single line

    in the /etc/sysconfig/network file. After the option is set, there will be an
    entry of the form:


    ```

    FORWARD_IPV4=true

    ```


    If an entry of *false* is present, it can be manually changed to *true*

    without the inconvenience of starting XWindows. However, the /etc/sysconfig/network
    file merely runs the following command, which enables forwarding across the network
    interfaces in the kernel, at boot time:


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    This command can be run at any time to enable packet forwarding. Conversely, if
    a "0" is echoed onto the file, packet forwarding will be disabled immediately.

    A similar option to enable packet forwarding is available in the linuxconf utility.

    Setting this option will transform Linux into a simple router. However, the normal
    (and safest) way to configure a firewall is to deny all packet forwarding by default,
    then allow only explicit types of routes to pass. The ipchains administration
    utility is used'
