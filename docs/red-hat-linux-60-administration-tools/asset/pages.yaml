  md: '# CompressionLevel 6


    on fast networks. Use only in limited bandwidth situations

    where every byte counts. Compression can also be enabled by

    passing the -C parameter to ssh.


    The compression level can be set between 1 and 9 (which is similar to the gzip
    utility). 1 is fast, but the data is not compressed

    very well; 9 is very slow but the data is much more thoroughly

    compressed. The default is 6.


    The -g and -L options can be particularly useful to firewall design. These options
    allow TCP ports to be forwarded to the

    remote server over a secure connection. The following command

    will allow remote encrypted telnet connections on port 2300 while the

    remote shell session is active (this behavior is rather similar to

    plug-gw over the TIS FWTK):


    ```

    ssh -L 2300:remotehost.com:23 -g remotehost.com

    ```


    If a user telnets to port 2300 on the local host, this connection is

    encrypted, sent to the remote, then forwarded to the destination

    port specified on the command line (23).


    The last issue for SSH is how to force it not to ask for a password. With the
    Berkeley r-utilities, a properly configured .hosts file

    could allow password-free connections. SSH can use .hosts, but

    this usage is disabled by default. A safer way to support password-free logins
    is with public key cryptography. Setting this up is easy.


    First, run the following command as root on the local host to

    generate a key pair. Accept all the defaults, but do not enter a passphrase. Just
    press enter instead (this does open a security risk, which will be discussed in
    a moment).


