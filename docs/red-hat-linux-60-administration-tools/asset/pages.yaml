  md: '# Name Resolution


    On the Internet, there is no way to reach a host without its IP address. Regardless
    of the structure of a host name (such as host.foo.com), the host is unreachable
    unless the hostname can be converted into an IP address (such as 1.2.3.4, or any
    other real Internet address). This conversion does not happen by magic, but is
    caused by Internet DNS servers (as is discussed in the DNS administration section
    later in this chapter). A few name-IP translations can be entered into the `/etc/hosts`
    file, but a lookup table becomes impractical for large numbers of hosts.


    For a Linux system behind a PPP connection, there are two options for accomplishing
    DNS name resolution: Either rely upon a remote DNS server on the far side of the
    PPP link or run a local DNS server. There are advantages and drawbacks to each
    approach.


    If a remote DNS server is used, configuration of the local Linux host is very
    simple. Traffic will be generated, however, for each hostname lookup, which will
    consume a small portion of the PPP connection bandwidth. If a local DNS server
    is configured and used, host name lookups are cached by the local DNS server.
    There is no further bandwidth consumption of the PPP connection after the first
    lookup of a remote host (until the caching period set by the remote authoritative
    DNS server expires). However, a caching-only name server running at boot time
    with no network access to the Internet can confuse this daemon processes (notably
    the Postgres SQL server, the Apache web server, and Sendmail). Also, the initial
    configuration of the name server is cumbers.


    To configure a Linux system to use remote DNS servers, the IP addresses of the
    servers will be required. These addresses can be obtained from the remote ISP
    or system administrator. Please note that Linux will not accept DNS servers passed
    in the negotiation phase of the PPP connection (MSDN is rejected for security
    reasons).


    When the addresses of the remote servers have been obtained, the `/etc/resolv.conf`
    should be configured as follows:


    ```

    search isp.net

    ameserver 1.2.3.4

    nameserver 5.6.7.8

    nameserver 9.10.11.12

    ```'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'Replace the isp.net entry above with the domain name of your ISP or upstream
    authority. The secondary and tertiary nameserver entries may be omitted, but at
    least one operational server must be entered. Be sure to replace the dummies entries
    above with the correct IP addresses.


    If a local caching-only server is preferred, the server must be loaded and configured.
    The DNS server and caching-only settings can be loaded at any time after installation
    by issuing the following commands from the RedHat/RMP directory of the installation
    tree:


    ```

    rpm -Uvh bind-8.2.6-i386.rpm

    rpm -Uvh caching-nameserver-6.0.2.noarch.rpm

    ```


    Installing the Package will automatically configure it to be launched at boot
    time through the /etc/rc.d/init.d/named startup script. If this is not what you
    want, use the ntsys utility to alter the boot status. The name server can also
    be manually started and stopped with this script.


    Once the server is loaded, Linux must be instructed to use it. To specify the
    local host as the primary name server, make sure that the first nameserver directive
    in /etc/resolv.conf reads as follows:


    ```

    nameserver 127.0.0.1

    ```


    If the file does not exist, create it with permissions of 644. The address 127.0.0.1
    is the universal lookback address. Enter it as shown.


    # Server PPP


    The Linux pppd daemon has flexible configuration options and it can communicate
    with a variety of IP protocol stacks. However, pppd has few options for controlling
    a modem. It does not send modem initialization strings and it does not answer
    telephone lines.


    The various getty implementations are usually responsible for controlling terminal
    hardware, including establishing modem sessions. mingety is used on Red Hat Linux
    to control VGA console logins, but it has no options for manipulating a serial
    port. Some common getty implementations include getty, agetty, and uugetty. However,
    most of these know nothing about PPP network sessions.'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'Two software components will solve these problems: mgety and pppd. mgety can
    be used to control the serial lines and answer the modems. mgety uses the exec()
    system call to spawn pppd if it detects the start of a PPP session (which is a
    unique feature of mgety implementation). pppd then authenticates the user (using
    either the system password database, or its own database of valid users), and
    then starts a network connection if access is granted.


    # Configuring mgety


    mgety is not installed by default in Red Hat Linux. It must be explicitly loaded
    after installation has completed. This can be done by issuing the following command
    from the RedHat/RPMS directory of a Red Hat installation tree (which is on the
    CD-ROM included with this text):


    ```

    rpm -Uvh mgety-1.1.14-8.i386.rpm

    ```


    The above command will install the mgety binary and associated configuration and
    documentation files. For the most common PPP server configuration, modify the
    file /etc/mgety+send-fax/mgety.config so that the top two lines read:


    +   speed 115200

    modem-type data

    rings 1


    If you want to enable fax transmissions with mgety, you might want to use different
    options in this file. If so, consult the documentation at http://www.leo.org/~-doering/mgety/mgety_toc.html
    for further information. (Additional RPM components are required).


    You should also modify the file /etc/mgety+send-fax/login.config so that it contains
    the line:


    ```

    /AutoPPP/- - a_ppp /usr/sbin/pppd 115200

    ```


    There will be another commented AutoPPP line that passes many more options to
    pppd. It is more convenient to configure these switches in /etc/ppp/options (so
    ps aux listings remain cluttered), so these options are removed here.


    When mgety is running, it places log files in /var/log. You may want to either
    clean them out manually from time to time, or put the log files on automatic rotation
    (i.e., removing the older files).'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Options in /etc/ppp


    After you have installed mgetty, run the following command to configure your /etc/ppp/pap-secrets
    file to allow PAM logins:


    ```

    echo ''* * * *'' >> /etc/ppp/pap-secrets

    ```


    At this point, IP addresses must be assigned to each of the modem lines that will
    be providing PPP services. These IP addresses will be recorded in the /etc/ppp/options*
    files. Your /etc/ppp/options file contains control parameters for all pppd sessions
    that on your system. It should contain the following information:


    ```

    auth

    login

    modem

    crtscts

    lock

    proxyarp

    ms-dns x.x.x.x

    ms-dns y.y.y.y

    ```


    All of these options are discussed in the pppd man page, but below is a quick
    synopsis:


    # auth


    Force the remote PPP system to authenticate.


    # login


    Authenticate against the system password database (/etc/password,/etc/shadow or
    whatever else PAM is configured to use), and record the session in the wtmp file.


    # proxyarp


    Configure the Ethernet card to respond to ARP requests for the IP address of the
    remote PPP system.


    # ms-dns x.x.x.x


    Pass the IP address of a DNS server to the client. This works for Windows clients
    only. You should have no more than two of these entries in the options file. This
    option won''t work unless your pppd was compiled with -DUSE_MS_DNS, but it makes
    the configuration of the client much easier.'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'Each serial device that support dialup PPP must have a unique options file.
    If you plan to attach a modem to /dev/tty1 (DOS COM1:), the file /etc/ppp/options.tty1
    will contain parameters specific to modem. For example, a PPP server at IP address
    1.2.3.1 might allocate 1.2.3.4 as the IP address for the PPP dialup. This configuration
    would require the file /etc/ppp/options.tty1 to contain the single line:


    ```

    1.2.3.1:1.2.3.4

    ```


    The first parameter above is the IP address of the dialup server. The second parameter
    is the IP assigned for that line. Each serial line must have a different IP address.

    We should note that the address 1.2.3.4 is not really a Class C Internet address
    (it is a Class A address). We are using it in the context-of a Class C to make
    the meaning clear. To Emphasize, neither the network 1.2.3 nor any derivative
    of it should ever be used on the Internet.


    The proxyarp option listed above deserves greater attention. If proxyarp is excluded,
    the serial devices will be able to transmit network data to the server, but they
    will not be able to communicate with any other machine. (The proxyarp option configures
    the Ethernet devices to answer ARP requests for the PPP IP addresses.) Specific
    dial-up lines that are intended for local access only might require that the proxyarp
    parameter be moved out of /etc/ppp/options and into the device-specific options
    files for the lines that will receive total network access.


    In addition to proxyarp, one other step is required to allow the PPP device to
    exchange data with the LAN device: forwarding of packets across the networking
    interfaces must be enabled. To accomplish this, a modification must be made to
    the /etc/sys/network file. If forwarding is disabled (which is the default), a
    line in the file reads:


    ```

    FORWARD_IPV4=false

    ```


    To enable forwarding, change the line to:


    ```

    FORWARD_IPV4=true

    ```'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'The instructions in this file are executed at boot time only. To enable forwarding
    without rebooting the system, enter the command:

    necho 1 > /proc/sys/net/ipv4/ip_forward


    If no IP addresses are available to allocate for serial devices, considering bogus
    IP addresses in the 192.168.x.x range, and use proxy software, as the free FireWallToolKit
    discussed in Chapter 4. Normally, proxarp cannot be used in such a situation.
    Information on the firewall section (discussed in this chapter) might also be
    helpful.


    # Adding mgetty to /etc/inittab


    Each serial line will be controlled by an entry in /etc/inittab. An entry for
    ttyS1 might look like:


    S1:345:respawn:/sbin/mgetty ttyS1


    Similar lines must be added describing each serial device on the system that is
    participating in the mgetty/pppd arrangement.

    After the changes to /etc/inittab are complete, the Linux system must be rebooted,
    and the shell command init q must be entered while logged in as root. Lights on
    any external modems will flash.

    Inactive modems can be reinitialized at any time by entering the command killall
    mgetty. (Be cautious of this command on non-Red Hat systems.)


    # Additional Logging Information


    Most system services send activity messages to the syslog daemon. The syslog daemon
    records most of this information in /var/log/messages. Mail system log data goes
    to /var/log/maillog. Other logging locations can be found by examining /etc/syslog.conf.


    It is relatively simple to copy this logging information to an inactive console
    so that it can be examined in real time. To do so, enter the following command:

    echo ''.*'' /dev/tty99 >> /etc/syslog.conf


    Reboot the system or send a HUP signal to the syslog daemon (i.e., kill-HUP <pid>).'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'If the CTRL-ALT-F9 keys are pressed simultaneously, virtual console number
    nine should come into view. It should contain the complete output of the syslog
    daemon. Any PPP activity should be immediately logged to this screen, as well
    as activity from other major system services (such as DHCP, the mail transport
    utilities, DNS, etc.).


    To return to the login on virtual console number one, press CTRL-ALT-F1. To return
    to the XWindows session (if one is running), press CTRL-ALT-F7.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '# Firewalls


    One extremely common use for Linux systems is the defense of critical computer
    networks and data. The power of the TCP/IP protocol is its openness and ubiquity.
    Unfortunately, these advantages can become great drawbacks when a computer net-work
    is attacked by a hostile intruder.'
  merge: -1
  pgno: 108
- img_proc: true
  md: 'When a computer is configured in such a way that its primary function is the
    defense of a TCP/IP network, it is commonly called an Internet firewall, or sometimes
    a bastion host. There are two main firewall designs commonly used in Linux. One
    is the proxy approach, where access to external resources can be obtained by contacting
    a specific host that acts as an intermediary (or proxy). The other method involves
    the use of the Linux kernel as a filtering router. In this second approach, the
    kernel will simply forward, modify, or discard network data based upon a set of
    rules defined by the administrator.


    It is far easier to maintain internal hosts where Linux is used as a filtering
    router. The use of a proxy can complicate the configuration of internal hosts
    enormously. The two techniques can be mingled to some extent, but proxies will
    always introduce additional layers of complexity.


    This chapter assumes that one or more networking interfaces are properly configured
    and that routes to these interfaces are defined. A proxy firewall might be designed
    to use a single network interface in conjunction with blocking routers, but a
    firewall relying upon IP forwarding or masquerading will require at least two
    network interfaces. Information on network configuration can be found elsewhere
    in this text.


    While a safe and efficient Linux firewall can be configured on a modest computer
    (an 80386-based system), a high-utilization environment might benefit from more
    powerful hardware. In such a case, ISA-based network cards should be eschewed,
    as well as any cards based upon the NE2000 chipset. Currently, two very popular
    PCI Ethernet designs are the Tulip chipset (i.e., the 21040 and 21140 Ethernet
    chipsets designed by Digital Equipment Corporation), and the 3Com 905 series.
    Some cards based upon the 21140 Tulip design are very inexpensive and implement
    100BaseT fast Ethernet. Each design is usually easy to configure, which is why
    they are mentioned here.


    Dynamic Host Configuration Protocol (DHCP) can also play an extremely productive
    role in a protected network. DHCP should be omitted from a firewall design only
    for sound reasons, because the benefits it extends to centralized administration
    can dramatically'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Fictitious IP Addresses


    reduce the complexity of a network. See “DHCP” on page 72 for more information.

    Several UNIX security issues also have great bearing upon proper firewall design.
    You should pay close attention to the inetd—Internet super server daemon. Its
    configuration file, /etc/inetd.conf, should be examined carefully, and services
    that are not required be removed. In particular, the shell and login services
    should be eliminated unless their presence is absolutely necessary. Serious consideration
    should also be given to the removal of telnet and ftp services, especially if
    ssh will be used. All other services should be studied and, if possible, removed.


    # Fictitious IP Addresses


    It is occasionally necessary to make up IP addresses for positions on internal
    networks—especially real Internet addresses become more difficult to obtain. Should
    this practice be necessary, the synthetic addresses should be selected from those
    shown in Table 4.1.


    Table 4.1 Private IP address ranges.


    | Class | Network |

    | --- | --- |

    | A | 10.0.0.0 |

    | B | 172.16.0.0 through 172.31.0.0 |

    | C | 192.168.0.0 through 192.168.255.0 |


    These addresses are reserved for private use. They will not be routed over the
    Internet.


    # Kernel IP Forward and Masquerade Rules


    Before a routing firewall can be configured on a Linux system, the kernel must
    be instructed to forward packets (i.e., on behalf of other systems) across the
    network interfaces. One way to accomplish this is with the netcfg command, run
    under XWindows. The option to enable forwarding is shown in Figure 4.1 on page
    96.'
