  md: '# 03


    # PPP


    Modem communication under Linux is powerful, but complex. Modems can be run as
    either standard terminal devices, or as network links that are directly maintained
    by the kernel. One way to approach network communications under Linux is with
    the Point to Point Protocol (PPP). PPP can be used to provide support for TCP/IP
    (the protocol associated with the Internet) and IPX (used by Novell Network).'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'The approach to PPP taken in this chapter will be one that is compatible with
    the methods used in Microsoft Windows. The approach used by Windows is not particularly
    secure, but it is ubiquitous.


    # Client PPP


    Establishing a PPP client connection that runs under Linux is rather simple. The
    Control Panel application that runs under Windows can be used to establish PPP
    connections. The shell scripting approach outlined below, however, is much more
    flexible. It can be used in non-X environments, and it does not require root access.
    For completeness, the method utilizing the control panel is addressed later. Regardless
    of the method used to establish PPP, /etc/resolv.conf must be configured to allow
    Internet host names to be resolved. A Linux system can rely upon a remote DNS
    server for these functions, or it can run a caching-only server itself.


    # The Scripting Approach


    To connect to a remote PPP server, the three files—/bin/network, /bin/network.chat
    and /etc/ppp/pap-secrets—should be placed on the local Linux system. The content
    of these files is shown below.


    # The /bin/network file


    ```

    #!/bin/sh

    ```


    ```

    exec /usr/sbin/pppd -detach lock modem crtscts \

    defaultroute route USERNAME /dev/ttyS1 57600 \

    connect "/usr/sbin/chat -f /bin/network.chat"

    ```


    # The /bin/network.chat file


    ```

    ''ABORT'' ''BUSY''

    ''ABORT'' ''ERROR''

    ''ABORT'' ''NO CARRIER''

    ''ABORT'' ''NO DIALTON''

    ''ABORT'' ''Invalid Login''

    ''ABORT'' ''Login incorrect''

    "

    ''ATZ''

    ''OK''

    ''ATDT 1234567''

    ''CONNECT''

    "

    ```'
  merge: -1
  pgno: 95
- img_proc: true
  md: '# /etc/ppp/pap-secrets file


    # Secrets for authentication using PAP

    # client server secret IP addresses

    USERNAME "" PASSWORD


    The changes you must make to configure them for your site as follows:


    +   1. The correct serial port for the modem must be set in /bin/net-work (i.e.,
    replace /dev/ttyS1).


    +   2. Replace 1234567 with your ISP''s telephone number in the /bin/network.chat
    script.


    +   3. Replace the USERNAME and PASSWORD in the /etc/ppp/pap-secrets and /bin/network
    files with the PPP account name and password on the dial-up server.


    +   4. Optionally, place the login o:--login: "" at the end of the /bin/network.chat
    file system to expect the remote server to issue a login message before the PPP
    session commences. If such a message is not received, a carriage return is sent
    in an effort to prompt the remote server to supply it.


    +   5. Run the command chmod 755 /bin/network to enable the net-work script to
    be executed from the shell.


    +   6. Optionally, run the command chmod u+s /usr/sbin/pppd and change the permissions
    of the serial port device in the /dev directory to mode 666 (read and write access
    for everyone). This allows all users on the system to bring the PPP link up or
    down. The root user might also create a ppp group to permit only trusted users
    to administer the interface.


    The demand option in pppd is quite useful in establishing ondemand PPP connections.
    It allows for the link to be initiated only in the event of outbound network traffic,
    and has options for the termination of a PPP connection that is idle for a certain
    amount of time, and the reestablishment of the connection if traffic is generated
    on an inactive link. Finally, with Red Hat Linux 6.0, the shipped kernel contains
    a driver for this option of pppd. (The'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'option has been available nonfunctional since a patch for version 5.0.) Following
    is a modified version of /bin/network that uses the demand-dialing approach:


    ```

    #!/bin/sh

    exec /usr/sbin/pppd demand idle 300 192.168.1.2:192.168.1.1\

    -detach lock modem crtscts \

    defaultroute route user USERNAME /dev/tty1 57600 \

    connect "/usr/sbin/chat -f /bin/network.chat"

    ```


    The above script has the demand option, which will bring the link down after a
    period of inactivity. This period is defined by the argument to the idle parameter.
    This parameter is given in seconds and is set to 5 minutes (300 seconds) in this
    case.


    The main limitation of the demand parameter is that the IP address assigned to
    the device must be known before the connection is made. The manual page for pppd
    indicates that dynamically assigned IP addresses can be handled in a demand-dialing
    arrangement, but tests run by the author of this book did not confirm this assertion.
    If the IP address assigned by the remote PPP server cannot be held constant, the
    dialfd-demand-dialing daemon should be investigated, because it is much more flexible
    in such an arrangement.


    More information on attaching Linux to an ISP is available in the ISP-Hook-HOWTO
    at http://sunsite.unc.edu/pub/Linux/docs/HOWTO/ISP-Hook-HOWTO.


    # From the Control Panel


    To use the graphical PPP controls, Windows must be running correctly. From within
    X, open a terminal window and enter the command control-panel to launch it.


    Before the control panel can launch a PPP session, a symbolic link must be set
    from /dev/modem to the actual serial port device. This can be done manually from
    a shell, or it can be accomplished through the control panel itself. To do so,
    click the Modem Configuration icon (Figure 3.1).


    Select the serial port device for the modem from the list (Figure 3.2), and click
    "OK."'
  merge: -1
  pgno: 97
- img_proc: true
  md: '![](img/7fb45bf48608bf2c3ba3e2d71ee8fcff_98_0.png)


