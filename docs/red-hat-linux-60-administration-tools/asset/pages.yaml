    An asterisk can be very useful when querying a database during interactive sessions.
    However, its use should be avoided in programs, as columns inserted into or removed
    from the database will change the physical order of the data returned. Specifying
    the desired columns will prevent this effect.


    Notice in the previous table that the numerical vendorcodes are printed rather
    than the more useful vendornames. The latter are actually contained within the
    vendors table:


    ```

    SELECT * FROM vendors;

