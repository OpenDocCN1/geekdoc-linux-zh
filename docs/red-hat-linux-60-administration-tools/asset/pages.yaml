  md: 'Apache is a major centerpiece of Red Hat Linux 6.0. The web server, however,
    is configured very differently from a standard Apache installation. This difference
    is so profound that some have begun to describe it as part of the “Red Hat Way.”


    # Basic Apache Configuration


    If Apache is compiled from source, it will usually install to the directory /usr/local/etc/httpd.
    This directory does not even exist in a fresh Red Hat Linux installation.


    Following is a brief description of various Apache files and directories under
    Red Hat Linux:


    /etc/httpd/conf


    This directory contains the three critical Apache configuration files:


    +   httpd.conf

    Main web server configuration


    +   access.conf

    Access restrictions and security


    +   srm.conf

    MIME and file associations


    /var/log/httpd


    The following web server logs reside here:


    +   access_log

    Records all connections to the web server.


    +   error_log

    Reports problems encountered by a running server (CGI, .htaccess misconfigurations,
    etc.).


    The log rotation system renames and deletes these files at regular intervals.


    # Other directories & files


    /etc/mime.types


    Apache uses this file to associate content types with filename extensions.'
