- img_proc: true
  md: 'specified as discrete values, or as a range of frequencies. A Mitsubishi Diamond
    Plus 72, for example, has horizontal frequencies of 30 to 86 KHz, and vertical
    frequencies of 50 to 130 Hz.


    The xconfigurator utility distributed with Red Hat Linux 6.0 contains the scanning
    rates for many monitors (see Appendix A for a complete listing). xconfigurator
    is run as part of the install process, and can also be executed post-installation
    should additional configuration be necessary. If the monitor to be installed is
    in the list provided in Appendix A, installation should be simple. If not, call
    xconfigurator after installation with special parameters.


    If the horizontal and vertical scanning rates absolutely cannot be determined,
    choose either the “Generic Multisync” or the “Generic Monitor.” Before making
    such a choice, however, pay attention to the following warning from XFree86:


    # Warning


    > “It is VERY IMPORTANT that you do not specify a monitor type with a horizontal
    sync range that is beyond the capabilities of your monitor. If in doubt, choose
    a conservative setting.”


    The reason for this warning is that it is actually possible to physically damage
    some older monitors by driving them with scan rates that are beyond the design
    tolerances.


    # Warning


    > Do not configure XFree86 to use scan rates that are higher than your monitor’s
    specifications, or physical damage to the monitor could result.


    The risk surfaces only if the startx command is used at the console, or if the
    system enters init 5 and activates the xdm login console. There is no danger if
    neither of these commands are run. To completely remove any damage, delete the
    /etc/X11/XF86Config file, which prevents XWindows from starting at all (some server
    machines have no need for XWindows).


    In the case of an unknown monitor, the Xconfigurator command can be run by the
    root user with the following arguments:


    ```

    Xconfigurator --kickstart --hync "30-86" --vsync "50-130"

    ```'
