  md: 'You might also notice the annoyingly repetitive go command. Sybase uses go
    in the same way that PostgreSQL uses the semicolon. It is possible to configure
    the sqsh interpreter to use a semicolon if the go becomes intolerable.


    Please note that Sybase users have absolutely nothing to do with UNIX accounts.
    In fact, Sybase runs under many non-UNIX operating systems that have no support
    for UNIX logins. The commands below create a set of users similar to the PostgreSQL
    examples earlier in this chapter:


    ```

    sp_password NULL, sapass

    go

    sp_addlogin luser, luserpass

    go

    sp_adduser luser

    go

    grant create database to luser

    go

    sp_addlogin nobody, nobodypass

    go

    sp_adduser nobody

    go

    ```


    A Sybase database has two main types of storage: data areas and transaction logs.
    Data areas contain the data associated with tables and indexes. Transaction logs
    contain the sequential changes to the database which form a complete audit trail.
    Occasional complete database backups are normally two-phase.


    Database backups are normally two-phase. augmented by more regular backups of
    transactions. In the event that the database must be restored from the backup
    media, the complete database is restored first, then the subsequent incremental
    transactions are restored.


    Making a backup of the transaction log will cause the log to be cleared. If the
    transaction log becomes full, no more changes to the database can take place.
    The transaction log can be immediately cleared by issuing the SQL command dump
    transaction with no_log, but this invalidates all incremental backups; a complete
    database dump must then be performed to ensure data integrity (this will also
    produce a stern warning in the error log). Data backups include data only. A data
    backup will not clear the transaction log.'
