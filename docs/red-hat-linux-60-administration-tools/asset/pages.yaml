  md: '# Installing Sybase


    The pg_dump command is a useful utility that allows easy backup and transport
    of PostgreSQL databases. It generates a text file composed of the SQL commands
    required to recreate a data-base. To dump the shopping database, use the shell
    command line:


    ```

    pg_dump shopping > db.out

    ```


    This file can be manipulated with a normal text editor. To reload the database,
    enter the shell command:


    ```

    psql -e shopping < db.out

    ```


    As a last point, psql uses the GNU Readline library. It is configured by default
    to accept Emacs keystrokes to edit the command line (that is, the up and down
    arrows cycle through the previous and next commands, Control-“A” moves to the
    beginning of the line, and so forth). Readline can be configured to use vi commands,
    if desired. Details can be found at the end of Chapter 1.


    # Installing Sybase


    The Sybase Adaptive Server RDBMS is much faster and more powerful than PostgreSQL,
    but it requires much more planning and effort to install properly.


    The Sybase server is included on the CD-ROM included with this book. It can be
    found in the /sybase directory. Sybase produces an HTML document with extensive
    documentation on the installation of Linux Server, but the document can be confusing,
    so the installation will be fully documented in this chapter.


    The server software will require approximately 110MB of disk space. The documentation,
    if installed, requires another 40MB. Additional space must be allocated for user
    databases (this space must be set aside before the database is even created).


    The RPM will install the server software in the /opt directory. Unless a separate
    file system has been created and mounted as /opt, this will place the Sybase server
    in the root file system. This is not a desirable location.


    The /home directory is usually mounted as a separate file system. If a soft link
    from /opt to /home is placed in the root directory, the Sybase server software
    can be easily installed in /home. This location'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'will also make the preparation of PHP slightly easier, as is explained in the
    next chapter.


    Enter the following commands as the super user to set the link from /opt to /home:


    ```

    cd /; ln -s home opt

    ```


    The Sybase Adaptive Server Enterprise is installed by running the following command
    against the RPM:


    ```

    rpm -Uvh sybase-ase-11.0.3.3-1.i386.rpm

    ```


    The server license agreement will be displayed in the terminal window. The space
    bar can be used to page through the text. At the end of the license, the agreement
    must be accepted before installation can begin. To accept the agreement, enter:


    Yes


    The normal RPM software installation will commence. When it is completed, a prompt
    will be issued to create a sybase user and group. If the user and/or group already
    exists, it will not be affected (it is safe to answer yes if the server is being
    installed a second time). To add the sybase user and group, enter:


    y


    If the sybase group does not exist, a prompt will be issued to create it. To create
    the “sybase” group, enter:


    y


    If the sybase user does not exist, a prompt will be issued to create it. To create
    the sybase user, enter:


    y


    The system will prompt for a UNIX password for the sybase account in the usual
    way. After the password has been set for sybase, the installation of the server
    software is complete. If desired, the Sybase documentation can be installed with
    the following command:


    ```

    rpm -Uvh sybase-doc-11.0.3.3-1.i386.rpm

    ```


