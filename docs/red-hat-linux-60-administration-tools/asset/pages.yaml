- img_proc: true
  md: '# Sample Installation


    UNIX

    Under most UNIX environments, the images can be written with the dd command. The
    CD must be mounted as an active file system. Under Linux, if a /cdrom directory
    exists, one of the fol-mounting commands will usually mount a CD:


    +   - mount /dev/scd0 /cdrom

    - mount /dev/hdc/cdrom

    - mount /dev/hdb/cdrom


    Once the CD is mounted, the following dd commands will write the image to a floppy
    drive:

    dd if=/cdrom/images/boot.img of=/dev/fd0 bs=14400


    (The boot.img file can also be downloaded from a number of FTP sites, if the CD
    is not available.)


    DOS\Under DOS with CD-ROM support, place the CD in the drive.

    Open a DOS shell if a Windows variant is in use. Change the active drive to the
    CD (usually by entering "d:" and pressing enter), then enter the following commands:


    +   - cd dosutils

    - rawwrite


    When prompted, write the \images\boot.img file to the A: drive, or whatever other
    image is required for the local installation.

    Once the images are in hand, boot from the boot floppy. Press "Return" to pass
    the LILO boot prompt.


    As a note for the technically-minded, the boot floppy is in MS-DOS format. The
    vmlinuz file can be replaced with a specially-compiled kernel image as the new
    image fits in the free space available on the floppy. This is one way to build
    specific device support into the installation session, in the unlikely event that
    it is necessary.


    Once the Linux kernel has booted (which may take some time), the welcome message
    shown in Figure 1.1 on page 16 is presented.'
