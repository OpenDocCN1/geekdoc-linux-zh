  pgno: 268
- img_proc: true
  md: 'There are two main reasons why you might not want to use make zlilo, as described
    above. Either you want to follow the Red Hat convention of placing the kernel
    image in the boot directory, or the make zlilo fails, complaining that the kernel
    image is too large.


    If the image is too large, it can be compressed by using make bzimage, which uses
    the bzip2 compression format. You should first make certain that all unnecessary
    drivers, however, have been removed from the kernel image.


    After a successful run of make bzimage, a copy of the compressed kernel will be
    stored in /usr/src/linux/arch/i386/boot/bzimage, and a System.map will be placed
    in /usr/src/linux. Move these files to the desired positions (either the root
    directory or /boot and reconfigure LILO accordingly).


    Do not reboot the system until the modules and the initrd (if required). After
    booting and satisfactory testing of the new kernel, the generic kernel in /boot
    can be removed. Use caution, and do not delete the files required by LILO. Do
    not touch boot.b or map in the /boot directory.


    # Compiling the Modules


    If modules are enabled in the kernel configuration, they must be generated in
    a procedure separate from the kernel preparation. Enter the following command
    from /usr/src/linux:


    ```

    make modules

    ```


    Once the modules have been compiled, they can be installed with:


    ```

    make modules_install

    ```


    This command installs the modules under /lib/modules in a directory that has the
    same name as the kernel release. Moving the kernel to another Linux system, this
    set of directories must be moved as well and placed in the same location on the
    target system.


    # Creating the initrd


    If you are using a SCSI system, and you have made the (unwise) decision to prepare
    support for your SCSI adapter as a module, an initrd will be required. Generate
    it with the following command:


    ```

    mkinitrd initrd 2.2.12

    ```'
