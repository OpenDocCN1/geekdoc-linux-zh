    # Preparing WAV Images of an Audio CD with cdda2wav


    cdda2wav normally encapsulates audio data from a CD in the WAV format (a format
    in common use on the Windows platform). cdda2wav can use a number of other formats.
    Conversion between the formats is often simply an exercise in the options to dd.
    In this text, we will work with WAV.


    +   - cdda2wav can slightly differently if it is used on IDE equipment, rather
    than SCSI. The following command will copy each track on an audio CD from a SCSI
    CD-ROM into separate WAV files (with filenames proceeding upon from audio_01.wav)
    in the current directory:


    ```

    /opt/schily/bin/cdda2wav -D 0,0,5 -S 8 -B

    ```


    If the -B option above is omitted, the data is stored in one big WAV file, rather
    than in separate files (in other words, you will almost always want to use -B).
    The other options, although similar to those for cdrecord, are not identical.
    The argument to -D is the SCSI Bus:ID:LUN as before. -S specifies the speed that
    should be used (the drive used in this case is an 8-speed read, 2-speed write).
    The alternate invocation for IDE drives follows:


    ```

    /opt/schily/bin/cdda2wav -I cooked_ioctl -D /dev/hdc -S 36 -B

    ```


    Above, the -cooked_ioctl option has been added, and the parameter to the -D option
    now points to the device file for the drive. If SCSI host adapter emulation has
    been established for the CD-ROM as well as the CDR, the SCSI syntax rather than
    the cooked_ioctl it is sometimes useful to read only a few tracks. This is accomplished
    with the -t option:


    ```

    /opt/schily/bin/cdda2wav -I cooked_ioctl -D /dev/hdc -S 36 -B -t 3+5

    ```


    The above command tracks 3 through 5 only. Listing 11.2 on page 270 is the output
    that should be expected.'
