    A description of the available services is provided below.


    apmd

    Advanced Power Management Daemon—controls system power consumption.


    atd

    At Daemon—schedules one-time jobs to run at a future date.


    cron

    Cron Daemon—schedules repetitive jobs.


    dhcpd

    Dynamic Host Control Protocol Daemon—assigns IP addresses and associated information
    to other hosts on a local network.'
