  md: 'summarized. When most people think of conventional cryptography, they imagine
    a single key that can be used to unlock or decrypt a message. Public key cryptography
    relies upon not one but a pair of keys—one a public key and the other a private
    key. When either key is used to encrypt a message, only the other key will be
    able to decrypt it. The public key is usually given freely to others; the private
    key is kept secret. When two people exchange messages, they first exchange public
    keys. The person sending the message encrypts it with both their private key and
    the other''s public. This technique allows secure encryption to take place without
    exchanging the data that unlocks the encryption; a design that used only a single
    password could never accomplish this. SSH is actually careful with these sets
    of keys, and a section of the host/server key is actually destroyed and rebuilt
    once an hour to ensure that if the server equipment is seized, the keys cannot
    be obtained. There are several other encryption technologies that may be included
    with SSH, including IDEA, Triple DES, and RSA, but these technologies are mostly
    transparent to the user.


    SSH will also transparently forward communications from remote graphical Window
    clients over the secure connection (it will automatically configure xauth and
    the DISPLAY environment variable). Simply run XWindows applications on the remote
    server, and they will appear on the local display—usually no more configuration
    is required than that. This is a powerful convenience for users of XWindows.


    SSH is not made available in an RPM format from the main distribution site. Only
    the C source code is available in a tar, gzip format. Assuming release 1.2.26
    of SSH has been obtained, the commands shown in Listing 4.3 can be run by root
    to compile and install it on Red Hat Linux 6.0.


    # Listing 4.3 Building SSH.


