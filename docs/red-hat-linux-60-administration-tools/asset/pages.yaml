  md: '# Cloning a Running Red Hat System


    ![](img/7fb45bf48608bf2c3ba3e2d71ee8fcff_62_0.png)


    **Figure 1.49** Final installation screen.


    # “Cloning” a Running Red Hat System


    If your Red Hat Linux system runs only on one hard drive, it is easy to clone
    it onto a second.


    First, unmount extraneous file systems (such as CD-ROMs, DOS FAT file systems,
    NFS connections, and anything else that is not directly related to the local installation).


    Next, obtain a boot disk for the system. The disk created during the installation
    is appropriate. Another can be created with the mkbootdisk utility. On IDE systems,
    the Red Hat Linux boot floppy can be used as a boot disk by passing the parameters
    “linux single root=/dev/hdXX initrd-2” (substitute the partition of the root file
    system for “XX”), but this trick will not work if there are active file systems
    on SCSI devices.


    Next, run the following commands as root:


    ```

    cd /

    ls | grep -v proc > /root/files

    mdir /drive

    ```'
  merge: -1
  pgno: 62
- img_proc: true
  md: "Edit the list of files in /root/files and remove any extra directories that\
    \ should not be copied. The /proc directory should be explicitly omitted.\n\n\
    Next, shutdown the system and attach the new drive. Boot Linux and use the fdisk\
    \ utility to create the partitions, then use mk2fs -c to create the file systems\
    \ on the new drive, and mkswap -c to format the new swap partition. The new (i.e.,\
    \ copied) drive should probably have the same partition layout as the old drive\
    \ (if not, then the /etc/fstab must be modified).\n\n# Warning\n\nBe careful not\
    \ to accidentally wipe out areas on the source drive when running these commands.\n\
    \nTake the system into single user mode by running the following command as root:\n\
    \n```\ninit 1\n```\n\nMount the partitions on the new drive onto the /drive directory.\
    \ Mount them with the same hierarchy with which the source drive is mounted. For\
    \ example, if a file system on the source drive holds /home, then a file system\
    \ on the target drive should be mounted as /drive/home.\n\nTo clone the drive,\
    \ enter the following commands:\n\n```\ncd / \ntar cf -`root/files` | (cd /drive;\
    \ tar xvpf -)\n```\n\nWhen the copy completes, make any necessary modifications\
    \ to /drive/etc/fstab (none should be required unless the partition arrangement\
    \ differs), then shut down the system. Remove the source drive and install the\
    \ target drive as the boot drive (as the primary master on an IDE system, or as\
    \ ID 0 on SCSI). Boot with the boot diskette.\n\nLastly, login to the new system\
    \ as root and run the lilo command. Remove the boot diskette and reboot. The new\
    \ drive should be functionally equivalent to the old one."
