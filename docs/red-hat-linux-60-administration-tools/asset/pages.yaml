    There are times, however, when you will not have this choice.

    One of these involves the storage options which include drivers for SCSI (Small
    Computer Systems Interface) and IDE (Integrated Drive Electronics). If the kernel
    is loaded from a SCSI drive, the driver for the SCSI controller must be available
    to the kernel, or the system will not boot because it does not know how to manipulate
