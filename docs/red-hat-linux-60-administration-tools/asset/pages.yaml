- img_proc: true
  md: '# Creating/Duplicating Data Discs


    Simple data discs are composed of a single data track. The data is held in the
    ISO9660 file system format. ISO9660 supports only 8.3 filenames (i.e., up to 8
    characters, optionally followed by a dot and up to 3 additional characters), but
    longer filenames can be implemented by using extensions to ISO9660. These extensions
    also permit the use of soft links and permissions that are common to UNIX file
    systems.


    # Compiling and Installing cdrecord


    The home page for cdrecord can be found at the following website: http://www.fokus.gmd.de/research/cd/clone/employees/joerg.schilling/private/cdrecord.html


    It is suggested that the latest version be downloaded and installed from this
    location. Should this be impractical, a copy of cdrecord-1.8a24 can be found in
    the cdrecord directory on the CD-ROM included with this text (which will most
    likely be outdated by the time that this chapter goes to print). Use the following
    commands to install the older version:


    ```

    tar xvzf cdrecord-1.8a24.tar.gz

    cd cdrecord-1.8

    ./make.linux

    make install

    ```


    The steps for installing later versions may be different; you may be required
    to improvise.


    # Using dd to Create CD Images


    If a soft link is created from /dev/cdrom pointing to the appropriate CD-ROM device
    (which is usually /dev/hdc or /dev/scd0), a copy of a CD-ROM data disc (called
    `cdimage.raw`) can be sent to the hard drive with the following command:


    ```

    dd if=/dev/cdrom of=/tmp/cdimage.raw

    ```


    CD-ROM images can be very large; make sure there is enough space in the target
    file system to hold the image with which you are working. Use the dd command to
    check the space available in all'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'mounted file systems. Examine the output for lines corresponding to the CDROM
    as well as the target file system.


    # Warning


    > The above command will write the image into the root file system, unless /tmp
    was declared a separate file system at installation time.


    One of the author''s IDE drives does not properly size tracks and causes dd to
    emit dd: /dev/hdc: Input/output error messages each time it is used. While these
    errors are not fatal and result in no corruption of data, the errors are suppressed
    by using the SCSI-emulated CD-R drive to read the track.


    The image created in the previous step can be tested mounting it as a separate
    file system using the loopback device, as is done in the following command:


    ```

    mount/tmp/cdimage.raw -r -o loop /mnt

    ```


    We can omit the iso9660 option to the mount command since this filesystem type
    is automatically detected. However, some configurations might require this option.


    After the mount, the /mnt directory should appear to be an exact duplicate of
    the source CD-ROM.


    Sometimes, dd will fail to properly create an image. This failure is related to
    the “track at once” mode. This problem is documented in the README.copy file contained
    in the ccdrecord distribution, which advises that the scgskeleton program be used
    in lieu of dd if problems arise.


    # Using mkisos to Create CD Images


    The mkisos utility, written by Eric Youngdale, is used to prepare data images
    of an active file system which can be written to a blank CD-Recordable disc. mkisos
    is part of the cdrecord distribution, and these tools are compiled and installed
    together. Do not use older versions of mkisos as they are buggy.


    The mkisos command is analogous to tar, in that it prepares an uncompressed “archive”
    of files in the ISO9660 format. This archive can then be burned directly to a
    blank CD-Recordable disc.'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Using mkisof to Create CD Images


    A simple invocation of mkisof follows:


    /opt/schily/bin/mkisof -o /tmp/cdimage.raw .


    This command stores the current directory, and all of its subdi- rector, in a
    binary ISO9660 image that is suitable for writing to a CD-Recordable. The following
    command mounts the ISO9660 image on the /mnt directory so that it might be engaged
    and veri- fied (the kernel must include loopback device support):


    ```

    mount /tmp/cdimage.raw -r -o loop /mnt

    ```


    If the output file is mounted in this manner, it will soon be dis- covered that
    long file names have been trimmed. The ISO9660 for- supports only 8.3 filenames
    (8 characters, followed by a dot, followed by an optional 3 character extension,
    just like the old days of DOS). The method described above is perfect for creating
    CD- ROMS for use under DOS. However, longer filenames can be accu- rately stored
    within in an ISO9660 image by using “Rock Ridge” extensions with the -r parameter
    to mkisof. A new image using these extensions can be created after the old image
    is unmounted.


    ```

    umount /mnt

    /opt/schily/bin/mkisof -r -o /tmp/cdimage.raw .

    ```


    The above command works well if a CD-ROM is to be used exclusively under Linux,
    but all DOS and Windows variants will trim the file names to 8.3. The best set
    of options to properly record the attributes of long file names and other UNIX
    filesystem particulars in a way which is visible to other operating sys- tems
    is a mkisof with the -T and -J parameters in addition to -r. The -T option records
    additional directory information in a TRANS.TBL file in each directory, and -J
    generates Joliet directory entries, which are useful on Windows platforms. This
    might not be ideal for a CD-ROM made exclusively for Linux as the TRANS.TBL files
    will be added to each directory on the disc. A sample com- mand with the following
    parameters is:


    ```

    /opt/schily/bin/mkisof -r -T -J /tmp/cdimage.raw .

    ```'
  merge: -1
  pgno: 280
- img_proc: true
  md: 'A volume label can be added to the CD image with the -v parameter as shown
    below.


    ```

    /opt/schily/bin/mkisofs -r -T -J -V "Personal Files" -o /tmp/cdimage.raw

    ```


    A CD-Recordable can even be made “bootable” on i386 systems with the additional
    -b and -c arguments as shown in this command:


    ```

    /opt/schily/bin/mkisofs -r -T -J -V "Personal Files" -b boot/boot.img \-c boot/boot.catalog
    -o /tmp/cdimage.raw

    ```


    The boot/boot.img file is an image of a bootable floppy that can be generated
    with dd. The boot/boot.catalog file is created by mkisofs within the source file
    system. (Be careful: it will overwrite any existing file with the same name and
    location.) This bootable CD format, called the “El Toro” extension requires BIOS
    support (That is, older PCs with i386-family processors will probably not be able
    to boot off such CDs because the BIOS is too antiquated to support El Toro.)


    # Burning a data image to a CDR with cdrecord


    A data image, obtained from either dd or mkisofs, can be tested for burning by
    using a command similar to the following:


    ```

    /opt/schily/bin/cdrecord -dummy -v speed=2 dev=0,0,0 /tmp/cdimage.raw

    ```


    The dev=0,0,0 option above indicates the SCSI bus number, SCSI ID, and the LON
    of the CD-Recorder. If the recorder at ID 5 on the third SCSI controller is desired,
    its device specification would be 2,5,0. IDE drives will probably use device 0,0,0
    if no other SCSI peripheral are configured in the Linux environment. The kernel
    will also report the address used by the drive(s) when the SCSI drivers are loaded
    (i.e., when the modprobe ide-scsi command is executed, when the module for a SCSI
    controller is loaded, or at boot, when a SCSI driver that is compiled into the
    kernel is initialized.) Check /var/log/messages if there are doubts as to the
    location of the CD-Recordable drive. The speed=2 option above indicates the speed
    that data should be written to the blank CD-R; use the maximum speed of which
    your drive is capable unless you have problems.


    When the above command is run, cdrecord will simulate a complete write but probably
    take a long time (everything is done except the actual firing of the laser). Do'
