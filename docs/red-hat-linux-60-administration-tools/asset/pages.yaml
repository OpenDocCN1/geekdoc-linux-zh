  md: '# Basic Web Services


    The Apache web server is by far the most popular web server platform in use on
    the Internet today. It has been ported to a plethora of operating systems. Unlike
    any other competing commercial web server, it is entirely open source. Because
    of the openness of the design, many powerful modules have been developed that
    extend Apache functionality enormously.'
