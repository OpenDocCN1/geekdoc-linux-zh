  md: '# Configuring TCP/IP


    Since early days of UNIX, the Transmission Control Protocol/Internet Protocol
    (TCP/IP) has been thoroughly integrated into the heart of most versions of the
    operating system. Linux is no exception. In fact, the Linux TCP/IP stack has been
    redesigned several times. The current version boasts speed and reliability that
    rival any other implementation.'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'It is impossible to have a serious network based upon TCP/IP that is devoid
    of UNIX. If the network is connected in some way to the Internet, it relies on
    the root name servers (which run UNIX). If the network uses the global SMTP mail
    system, changes that UNIX is involved. The network has access to the World Wide
    Web, one of every two accessed web servers runs Apache on UNIX. While it may be
    possible to implement these protocols over other operating systems, UNIX remains
    the preferred implementation.


    This chapter discusses TCP/IP and basic network services. The physical media (usually
    Ethernet) is addressed only tangentially. If it is configured correctly, this
    hardware should be detected automatically during installation. Information on
    cabling is available from many sources, and is mentioned only in passing.


    # Basic IP Configuration


    This section will attempt to explain the three major components of a basic TCP/IP
    configuration: the IP address, the default gateway, and the DNS server.


    If a host computer is being connected to a Class C network (i.e., a TCP/IP LAN
    allowing up to 254 host systems), and no connections are being made to external
    networks and/or the Internet, only a single configuration parameter is required
    (the IP address).


    # IP Address


    Standard IP addresses are unsigned 32-bit integers, but they are normally represented
    as 4 unsigned bytes in decimal notation, separated by dots. For example, the IP
    address COA8101 would normally be represented as 192.168.1.1. Every computer on
    a TCP/IP network (or internetwork) must have a unique IP address. In entering
    the IP address, you must also provide a net-mask and broadcast address, as explained
    below.


    If the computer is connected to a TCP/IP network where routing is required, a
    default gateway address will likely be necessary.


    # Default Gateway


    This is the IP address of a router that is on the local network and connects to
    other networks or to the Internet. On a Class C'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Basic IP Configuration


    IP address, only the last byte of the router''s IP address should be different
    from the IP addresses of any other hosts on the local networks. Be careful. Routers
    always have more than one IP address. Choose only the one on the local network.


    If the computer is being connected to the Internet (or to another TCP/IP network
    where DNS is performed), one last basic parameter is required.


    # DNS Server


    The Domain Name Server (DNS) is a computer that can translate Internet hostnames
    into IP addresses. At the time that this text was composed, one of the IP addresses
    of www.redhat.com was 199.183.24.133. The DNS server provides this translation—it
    does so by sending queries to the distributed, fault-tolerant, domain name system.


    In Class C networks, the netmask parameter is almost always 255.255.255.0. The
    network number is obtained by changing the last digit to a 0 in any IP address
    on the network (i.e., a bitwise and of the IP address and the netmask). The broadcast
    address, if required, is the network number with a 255 as the last byte (the broadcast
    address allows data to be sent to all hosts on the local network - pinging the
    broadcast address will generate replies from up to 254 other hosts).


    For example, let us pretend that small home network is being constructed, and
    this network will not (at least most of the time) be connected to the Internet.
    Good choices for the IP address, network mask, and broadcast are shown in Table
    2.1.


    # Table 2.1 Basic IP configuration.


    | IP Address:| 192.168.1.1 |

    | Netmask: | 255.255.255.0 |

    | Broadcast: | 192.168.1.255 |


    If a second computer were added to this network, it could be given an IP address
    of 192.168.1.2, and so on until 192.168.1.254. All hosts on an IP network must
    share the same network number.'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'the Class C hosts 192.168.1.5 and 192.168.100.5 are connected directly without
    an intervening gateway, they will not be able to communicate because they do not
    share the same network number.


    It might be a good idea to create an /etc/hosts file with pairs of IP addresses
    and hostnames. This would allow network connections to be made without the bother
    of remembering IP addresses. This function is subsumed by a DNS server in larger
    networks.


    Please note that the Class C network number, 192.168.1.0, is an excellent choice
    for a home network (see Chapter 4, "Firewalls",for more details).


    Now, let us imagine that a neighbor also constructs a home network, and he uses
    the network number 192.168.2.0. If a network cable was run between the two homes,
    a router device could be installed that would carry traffic between the two networks.
    The router would require two IP addresses. Two common choices are 192.168.1.254
    and 192.168.2.254. (Host number 254 is commonly assigned as a gateway, and host
    1 is commonly assigned to the DNS server; these are values that Red Hat assumes
    during installation.) Linux be a router if it is explicitly instructed to do so—this
    behavior is controlled by the /etc/sysconfig/network file in Red Hat Linux. This
    file also contains the IP address of the default gateway. Settings for hosts on
    the first network could define their default gateway as 192.168.1.254, and any
    data not bound for hosts on the local network would automatically be sent to the
    remote. If more than two local networks were connected, the default route might
    no longer be used for direct traffic, and a more explicit routing table would
    be required.


    Bearing all of this in mind, see Figure 2.1 and Figure 2.2, which are screenshots
    of the netcfg utility. You can use netcfg to edit network interface configurations
    once they are installed.


    The linuxconf utility can also be used to add network devices. In Listing 2.1,
    a 3Com 509 Ethernet card is configured.'
