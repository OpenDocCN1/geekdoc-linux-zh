  md: "A synthetic network with a 192.168.1 network number will have all outgoing\
    \ packets rewritten with the local IP address that forwards to the default gateway.\
    \ This technique is extremely useful in the conservation of valuable Internet\
    \ IP addresses, and is discussed at some length in Chapter 4, \"Firewalls.\"\n\
    \nIf an advanced development kernel is utilized, it might be necessary to issue\
    \ the following command (although it is not necessary with the kernel distributed\
    \ with Red Hat Linux 6.0):\n\n```\necho 1 >/proc/sys/net/ipv4/ip_boot_agent\n\
    ```\n\nThe last step in binding a Linux DHCP server online is writing an /etc/dhcpcd\
    \ conf file. Listing 2.9 shows an example.\n\n# **Listing 2.9** An example dhcpcd.conf.\n\
    \n```\nsubnet 192.168.1.0 netmask 255.255.255.0 {\n  range 192.168.1.128 192.168.1.254;\n\
    \  default-lease-time 600; max-lease-time 7200;\n  option subnet-mask 255.255.255.0;\n\
    \  option broadcast-address 192.168.1.255;\n  option routers 192.168.1.1;\n  option\
    \ domain-name-servers 192.168.1.1;\n  option domain-name \"fake.com\"\n}\n```\n\
    \nThis configuration is designed for a 192.168.1 network. Each directive is described\
    \ below:\n\nrange 192.168.1.128 192.168.1.254;\nThis command sets the range of\
    \ IP addresses which the server may hand out to clients. The addresses that will\
    \ be dispensed here from 128 to 254.\n\ndefault-lease-time 600; max-lease-time\
    \ 7200;\nThis directive controls how long clients may keep the IP addresses that\
    \ the DHCP server allocates to them. The time is specified in seconds.\n\noption\
    \ subnet-mask 255.255.255.0;\nThe actual subnet mask that is passed to the clients\
    \ is stated here.\n\noption broadcast-address 192.168.1.255;\nThe broadcast address\
