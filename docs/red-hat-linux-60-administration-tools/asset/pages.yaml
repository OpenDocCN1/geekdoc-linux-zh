- img_proc: true
  md: '# Samba Services and Windows Connectivity


    The prevalence of the Microsoft Windows platform is most distressing for UNIX
    enthusiasts. For a long time, UNIX was so much more powerful than Windows that
    the PC platform could be ignored completely; Windows could play no role in enterprise
    computing. But times have changed and powerful applications have made their homes
    on Windows, for better or for worse. The UNIX world must occasionally play a role
    in Windows networking, and Samba over TCP/IP will let you do just that.'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'The NetBIOS networking environment began as a joint project of Microsoft and
    IBM. It originally made use of a non-routable protocol (NetBEUI) that was intended
    only for small computer networks. NetBIOS itself was subsequently reimplemented
    over TCP/IP. NetBIOS over TCP/IP still bears the limitations of its original design
    (i.e., WINS). Its union with TCP/IP could never be described as harmonious. Still,
    Microsoft has promoted this overworked protocol as the “Common Internet File System,”
    and it is rare that NetBIOS can be entirely ignored in the networked enterprise,
    however unfortunate that may.


    Samba is a free implementation of NetBIOS over TCP/IP for UNIX. While there are
    problems with the design (it forks too many processes), Samba has seen enterprise-class
    usage and has withstood the associated challenges. The goal of the Samba project
    is to reproduce the entire network functionality of Windows NT within UNIX (which
    includes the ability to function as a domain controller).


    With RedHat Linux, Samba is an optional component that can be selected during
    system installation. If it is installed, the Linux system will be a fully operational
    NetBIOS file server when the system boots for the first time.


    > The original Samba release in Red Hat 6.0 had a security problem. Be certain
    that you are running the samba-2.0.5a-1.i386.rpm release, or later.


    > If you use Samba, its author would like to send him a pizza.The Samba web site
    at http://www.samba.org has information on how this might be accomplished. It
    can be a challenge; he lives in Australia. (And no, the author of this text has
    not yet sent his pizza, but if he should have the misfortune of working in Windows
    in the future.)


    # Samba and Password Encryption


    Microsoft doesn''t like Samba. They have good reason not to like it. Recent performance
    improvements in Samba have made it faster than the default configuration of Windows
    NT for file and print services on most hardware.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Samba and Password Encryption


    In fact, Microsoft dislikes Samba so much that they made password changes to the
    Windows NT Service Pack 3 to prevent it from sharing unencrypted passwords with
    a Samba server. Samba’s default settings are for unencrypted passwords, but these
    settings can be modified to circumvent this dastardly mischievousness.


    The new encrypted passwords are not compatible with the DES format used in /etc/passwd
    or /etc/shadow, so Samba must have its own distinct password file when encrypted
    passwords are enabled. If connecting with either Windows NT Service Pack 3 or
    higher (or Windows 98 or higher), encrypted passwords must be implemented before
    these clients function. This is done by removing the comments from the following
    two lines (they are lines 65 and 66 in /etc/smb.conf):


    ```

    encrypt passwords - yes

    smb passwd file - /etc/smbpasswd

    ```


    The Samba server must be restarted by running the following command as root:


    ```

    /etc/rc.d/init.d/smb restart

    ```


    When this is done, no users will be allowed to login to the Samba server. Each
    user must be individually added to the new /etc/smbpasswd file by root. The method
    for doing so follows:


    # # smbpasswd -a luser


    New SMB password:

    Retype new SMB password:


    > The username luser must exist in the /etc/passwd when the command is executed.
    When it is executed, the /etc/smbpasswd will be created with contents similar
    to the following:


    ```

    # Samba SMB password file

    luser:500:EDBBAA6F82E9D09AAD3B45B51404EE:

    F908E5FD02D390B2E5ASEDB9792D27D1:

    /home/luser:/bin/bash

    ```


    Once the root user has created the entries in /etc/smbpasswd, individual users
    can change their Samba password by running the smbpasswd command with no arguments.
    This procedure must be executed for each user on the system. On a new system,
    it should be part of the routine to establish a new user account.'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'On an older system where many accounts already exist, however, it might not
    be practical to migrate each individual user in this way. In that case, there
    is a (rather awkward) method to migrate such users en masse. To migrate an existing
    non-encrypted password file into /etc/smbpasswd, do not set the encryption option
    in /etc/smb.conf. First execute the following command as root:


    ```

    cat /etc/smbpasswd | /usr/bin/mksmbppasswd.sh /etc/smbpasswd

    chmod 600 /etc/smbpasswd

    ```


    This operation will create an entry for each user in /etc/smbpasswd. They will
    have the following form:


    1user:500:xxxxxxxxxxxxxxxxxxxx:

    xxxxxxxxxxxxxxxxxxxx:

    :/home/user:/bin/bash


    These entries have no password, and users cannot change them.

    The following options must then be added to /etc/smb.conf:


    +   - update encrypted - yes

    - smb passwd file - /etc/smbpasswd


    The Samba server must then be restarted by running the following command as root:


    ```

    /etc/rc.d/init.d/samba restart

    ```


    At this point, users can login to Samba using older, unencrypted clients (such
    as Windows 95), and the /etc/smbpasswd file will be populated with the encrypted
    passwords as the users connect.

    When the migration is complete, the option contained in /etc/smb.conf can be replaced
    with:


    +   - update encrypted - yes

    - encrypt passwords - yes


    Samba will then switch to the encrypted versions only, and the newer clients can
    login.

    A migration such as the one discussed above will require planning, timing, and
    forethought, especially for a large enterprise. It should be initiated several
    months before these newer clients enter a Samba network.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Mapping Users


    Windows 95 and 98 differ substantially from Windows NT in their ability to make
    use of network resources. Windows NT will allow the user to change his login identity
    for a particular server; Windows 95 and 98 will only allow a single login identity
    for all network resources to be entered at boot/login time. This becomes extremely
    inconvenient when a user logged into a Windows network wishes to connect to their
    account on a Samba system and the names used in each environment are different.


    Because of this, it is sometimes convenient to translate an incoming username
    to a different UNIX user. To do so, uncomment line 79 in /etc/smb.conf:


    ```

    username map - /etc/smusers

    ```


    Then populate /etc/smusers with the translations:


    ```

    # Unix_name - SMB_name1 SMB_name2 ...

    #root - administrator admin

    #nobody - guest pcguest guest

    luser - FunnyWindowsUser

    user2 - WindowsUser2 Otheruserwiewdsdie

    ```


    The root and nobody users are not commented out of the /etc/smbusers file included
    in the standard Samba RPM distribution. It is advisable to remove them, unless
    a valid reason for these user mappings can be demonstrated.


    # Samba and the Master Browser


    In a Windows NT network, a centralized computer is responsible for maintaining
    a list of NetBIOS servers and their browsable shares. This computer is called
    the master browser. If the Windows NT network has a *Domain Controller*, then
    the Domain Controller is the master browser. If there is no Domain Controller,
    the Windows NT Server computers will hold an *election*. The results of the election
    will determine which Windows NT system will be the master browser. If no Windows
    NT systems are available, Windows NT Workstation computers will converse and allocate
    one of their number as the master browser.'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'When improperly configured, Samba can repeatedly force elections upon the network
    in an attempt to become the master browser, causing great contention with the
    true master browser.

    to halt this behavior, append the following to /etc/smb.conf:


    ```

    domain master - no

    local master - no

    preferred master - no

    osos level - 0

    ```


    # Samba Server Components


    The /etc/smb.conf file contains a number of important parameters and example configurations.
    An option that deserves consideration is the workgroup name:

    workgroup - MYGROUP


    This name should be changed to the desired domain name or workgroup name for the
    network.

    It is possible that a client will not be able to see a Samba server because it
    lies on the far side of a router. If you have this problem, create an LMHOSTS
    file to direct queries for a particular IP. The proper location for this file
    depends upon the Windows variant being used; it lies in the \windows directory
    on Windows 95 and 98. For NT, look for the file LMHOSTS.SAM (which is a sample
    LMHOSTS file with demonstrations of many of the common configurations); LMHOSTS
    should be placed in the same directory as the sample file.

    to allow the client to see the Samba server, the LMHOSTS entry would have the
    following form:


    ```

    1.2.3.4 remotehost windows #PRE

    ```


    The #PRE instructs windows to “preload” available before dynamic lookups are performed.
    If the LMHOSTS file is modified, it can be reloaded into Windows by issuing nbtstat
    -R from a DOS prompt. If LMHOSTS files become inconvenient because of a large
    number of clients, the use of a WINS server (either on Samba or NT) should be
    investigated, especially in conjunction with DHCP (See Chapter 2: Basic Networking
    for more details).'
  merge: -1
  pgno: 221
- img_proc: true
  md: "# File Services\n\nSamba has a number of options for WINS services; start with\n\
    smb.conf for details.\n\nIt is also possible that a client will not be able to\
    \ connect to the Samba server because the wrong protocols have been loaded.\n\
    amba requires TCP/IP support on the client, which is not loaded by default on\
    \ some versions of Windows (Windows 95 specifi-ncally). To enable Windows 95 or\
    \ 98 to use Samba resources, one must load Client for Microsoft Networks and TCP/IP\
    \ in the Net-work section of the Control Panel. Consult a Windows networking text\
    \ for more details.\n\n# File Services\n\nBy default, as soon as the Samba server\
    \ is activated, users can mount their home directories as drive letters on their\
    \ Windows sys-ems by using a share of the form\n\n```\n\\\\remotehost\\luser\n\
    ```\n\nwhere remotehost is the remote Red Hat Samba server, and luser is any user\
    \ on that host.\n\nShould this behavior not be desired, remove the following sec-tion\
    \ from /etc/smb.conf:\n\n```\n[homes]\n  comment - Home Directories\nbrowseable\
    \ - no\n  writable - yes\n```\n\nTo create a public browsable area, add an entry\
    \ of the following form:\n\n```\n# A publicly accessible directory, but read only,\
    \ except\nfor people in\n# the \"staff\" group\n[public]\n  comment - Public Stuff\n\
    \  path - /home/samba\n  public - yes\n  writable - yes\n\n  printable - no\n\
    write list - @staff\n```"
  merge: -1
  pgno: 222
- img_proc: true
  md: 'In order to create a set of users able to write to such a directory, an entry
    for staff must be created and populated with the selected users in /etc/group,
    and those users must correspond to user entries in /etc/passwd. Note also that
    the directory permissions must also be writable for the staff group, as UNIX permissions
    will still apply.


    The following example demonstrates the “valid users” directive, an alternative
    to using groups:


    +   # The following two entries demonstrate how to share a directory so that two

    # users can place files there that will be owned by the specific users. In this

    # setup, the directory should be writable by both users and should have the

    sticky bit set on it to prevent abuse. Obviously this could be extended to

    # as many users as required.


    ```

    mshare - Mary''s and Fred''s stuff

    path - /usr/somewhere/shared

    valid users - mary fred

    public - no

    writable - yes

    printable - no

    create mask - 0765

    ```


    Illustrated below is the procedure for mapping these server resources on Windows
    clients. First, in Windows 98 or Windows 95, right-click on the “My Computer”
    icon. From this menu, select “Map Network Drive” (Figure 8.1).


    ![](img/7fb45bf48608bf2c3ba3e2d71ee8fcff_223_0.png)


    Figure 8.1 Windows 95/98 – Map Network Drive.'
  merge: -1
  pgno: 223
- img_proc: true
  md: 'Select an empty virtual drive and enter the share to be mapped

    (Figure 8.2).


    ![](img/7fb45bf48608bf2c3ba3e2d71ee8fcff_224_0.png)


