  md: "Installing the package will automatically configure it to be launched at boot\
    \ time through the /etc/rc.d/init.d/dhcpd startup script. If this is not what\
    \ you want, use the ntsys utility to alter the boot status.\n\nThere is a Linux-specific\
    \ issue in the configuration of the DHCP server. A routing command must be run\
    \ to allow traffic to be sent to the 255.255.255.255 IP address. This issue is\
    \ documented in the file /usr/doc/dhcp-2.0b1pl6/README. The exact command is:\n\
    \n```\n/sbin/route add -host 255.255.255.255 dev eth0\n```\n\nThis command must\
    \ run every time the system is restarted, so it should be placed in one of the\
    \ boot scripts. /etc/rc.d/init.d/dhcpd file. Listing 2.8 shows a fragment of a\
    \ startup script from a running system, which introduces another important DHCP\
    \ issue and some related points.\n\n# Listing 2.8 A modified version of the dhcp\
    \ startup script.\n\n```\n# See how we were called.\ncase \"$1\" in\nstart)\n\
    \  # Start daemons dhcpd:\n  echo -n \"Starting dhcpd:\"\n  /sbin/route add -host\
    \ 255.255.255.255 dev eth1\n  daemon /usr/sbin/dhcpd eth1\n\n  /sbin/ipchains\
    \ -P forward DENY\n  /sbin/ipchains -F\n  /sbin/ipchains -A forward -j MASQ \\\
    \n  -s 192.168.1.0/24 -d 0.0.0.0/0\n  /sbin/modprobe ip_masq_ftp\n  echo\n  touch\
    \ /var/lock/subsys/dhcpd\n  ::\n```\n\nNotice that the route command in the above\
    \ scripts routes not to eth0, but to the eth1 network device. Note further that\
    \ eth1 has been passed as an argument to the dhcpd command line. In a system with\
    \ multiple network devices, dhcpd must be told which device to use.\n\nThe calls\
    \ to ipchains and modprobe are not directly related to DHCP. They configure the\
    \ local system as a masquerading router."
