  md: '# IP Alias and Virtual Hosting


    every six months. If the computer is regularly upgraded with new versions of Red
    Hat Linux, the upgrade of named.ca will be performed automatically.


    # Round-Robin DNS and Clustering


    The version of named distributed with Red Hat Linux supports a simple method of
    server load balancing. Several hosts can be given the same name. When this is
    done, named will automatically cycle through the entire list of IP addresses when
    asked to resolve the name, answering each query with a different IP.


    Obviously, this method of load distribution will not be even across all servers.
    If a firewall''s DNS query resolves to a certain host, it may direct thousands
    of clients for the period that it is allowed to cache the results of the lookup.


    This rotation is configured in the forward lookup files. If records such as the
    following were entered into /var/named/db.acme,


    | www IN A 1.2.3.4 |

    | IN A 1.2.3.5 |

    | IN A 1.2.3.6 |

    | IN A 1.2.3.7 |

    | IN A 1.2.3.8 |


    the first on www.acme.com would be 1.2.3.4, the second would be 1.2.3.5, the third
    would be 1.2.3.6, and so on.


    # IP Alias and Virtual Hosting


    IP Alias is a mechanism which multiple Ethernet interface can respond to multiple
    IP addresses. This has many applications, including the virtual hosting of websites
    and fault-tolerant network services design.


    Let us imagine that the eth0 device has been configured with the standard Class
    C network address of 192.168.1.1. The interface could also be configured to respond
    to 192.168.1.2 with the following sequence of commands (issued by root):


    ```

    /sbin/ifconfig eth0:0 192.168.1.2

    /sbin/route add -host 192.168.1.2 dev eth0:0

    ```'
