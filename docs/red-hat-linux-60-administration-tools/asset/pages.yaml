  md: '# Establishing a PostgreSQL Database


    Here the ORDER BY clause causes the output to be sorted alphabetically-by the
    "item" field.

    It is also possible to use UNIX Regular Expressions in SELECT statements with
    PostgreSQL (a feat that not many commercial database servers can equal):

    SELECT list.item, vendors.vendorname, list.quantity

    ```SELECT list.item, vendors.vendorname, list.quantity

    FROM list, vendors

    WHERE list.vendorcode = vendors.vendorcode

    AND list.item ~ ''^[I-N]''

    ORDER BY item;


    | item | vendorname | quantity |

    |---|---|---|

    | Ice Cream | Super Grocer | 1 |

    | Napkins | General Department Store | 50 |

    | (2 rows) | | |


    One interesting point about SQL join operations is that records in one table will
    not join with records in the other table are omitted (although such records can
    be included with an outer join). If you run the following INSERT command:

    INSERT INTO list (item, vendorcode, quantity)

    VALUES (''African Violet'', 103, 1);\and then immediately follow it with the previous
    SELECT statement:

    SELECT list.item, vendors.vendorname, list.quantity

    FROM list, vendors

    WHERE list.vendorcode = vendors.vendorcode

    ORDER BY item;


    you will notice that the "African Violet" row in the "list" table was not printed.
    However, if you run the following command (and then rerun the SELECT):

    INSERT INTO vendors (vendorcode, vendorname)

    VALUES (103, ''ACME Plant Store'');

    it will appear.

    Records can be modified with the SQL of the following syntax:

    it will appear. Records can be modified with the SQL of the following syntax:\UPDATE
    list set item = ''African Violets'' WHERE vendorcode = 103;

    The above command modifies all records from vendor 103. There is only a single
    item in the table with this vendor, the behavior in this case is correct. A more
    restrictive WHERE clause might be required were there additional records with
    the same vendor.'
