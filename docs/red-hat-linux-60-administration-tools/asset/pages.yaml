- img_proc: true
  md: 'This basic security feature is configured through the use of an .htaccess file.
    The settings in this configuration file apply to all HTML files that lie in its
    directory and subdirectories.


    It is important to understand the limits of this type of protection. It is not
    very secure. In fact, it can be easily abused. Do not trust an .htaccess file
    to protect critical data.


    Web pages protected by an .htaccess file must be readable by the user id of the
    web server—usually userid nobody, group nobody. Unless the author of the web pages
    has configured the web server and the pages to share his own group (which cannot
    be done without the aid of the superuser—assuming the server runs at the standard
    port), the pages must also have world-readable permissions to be visible to the
    web server. If such permissions are set, then any other user on the system with
    shell access can read the pages, regardless of the presence of an .htaccess file.
    Furthermore, CGI applications (specifically PHP, discussed in a later chapter)
    have access to this world-readable data. For the standard Red Hat web server configuration,
    if the web server process itself can read the data, anything this discussion seems
    unclear, simply realize data served by the web daemon is not secure unless there
    are no other users on a system.


    Also, it should be remembered that all standard HTTP data will pass over the intervening
    network in clear text. Unless Secure Sockets Layer (SSL) is configured (which
    is beyond the scope of this text), there is no encryption. This data can be intercepted
    by a packet sniffer (such as sniffit), or siphoned from a proxy cache.


    Bearing these warnings in mind, a cursory discussion of this method of access
    control will follow.


    The default Apache configuration in Red Hat Linux 6.0 does not allow .htaccess
    files to be used. To enable the use of these files for authentication, a change
    must be made to /etc/httpd/conf/access.conf. The change must be applied to a line
    in the <Directory /home/httpd/html> section in the file that begins with the words
    “AllowOverride” and ends with a series of options. At the very least, the line
    you are looking for should contain the following:


    ```

    AllowOverride AuthConfig Limit

    ```'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# Static Password Protection


    Rather than the above permissions (AuthConfig, Limit), the keyword All in can
    be used to enable extensive control with .htaccess. Do not enable the extra features
    activated by the All in setting unless this functionality is actually required.


    The AllowOverride statement occurs three times in the default /etc/httpd/conf/access.conf
    file: for global options, for executing programs from /cgi-bin, and once for all
    pages beneath the document root. Each section is enclosed within a <Directory>
    tag. Modify only the section for which access control is required.


    Once these changes have been made, the web server must be restarted either by
    sending a HUP signal to the master web server, or by cycling the web server with
    the rc files:


    ```

    /etc/rc.d/init.d/httpd restart

    ```


    Once the web server has reread its configuration files through a HUP or a restart,
    the security features will be enabled. To create a sample web page to test these
    features, execute the following commands as root:


    ```

    mkdir /home/httpd/html/restrict

    echo "<hr>" > /home/httpd/html/restrict/test.html

    ```


    This file can be viewed locally with the URL http://127.0.0.1/restrict/test.html.
    (Obviously, a qualified host name will be required for non-local browsers.)


    To protect this file and everything in its directory, create the file shown in
    Listing 5.4 as /home/httpd/html/restrict/.htaccess.


    # Listing 5.4 Access control with .htacces.


    ```

    deny from all

    allow from permitted.com

    AuthType Basic

    AuthUserFile /etc/httpd/passwd

    AuthName "special directory"

    require valid-user

    satisfy any

    ```


    After this file has been created, enter the following command:


    ```

    /usr/bin/htpasswd -c /etc/httpd/passwd bogususer

    ```'
  merge: -1
