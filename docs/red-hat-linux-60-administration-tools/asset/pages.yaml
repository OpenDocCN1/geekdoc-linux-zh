    # The practical guide to system programming and administration using Red Hat Linux
    6.0


    Find out why Red Hat is the #1 vendor for Linux operating systems and tools with
    this insightful, first-of-its kind book.


    # Red Hat Linux

    Tools Utilities


    The functionality, flexibility, Internet-readiness, and cost-effectiveness of
    Linux make it an ideal operating system for small and large businesses alike.
    From this book, Linux and UNIX network and system administrators will gain a practical
    insight to system programming and administration for the latest version of Red
    Hat Linux.


    +   * The Power Pack

    * Installation

    * Network Configuration

    * Firewalls

    * PPP

    * Database Servers

    * Dynamic Content Web Services

    * Samba and Windows Connectivity

    * The GIMP

    * Rebuilding the Linux Kernel


    Beginning with an easy-to-understand explanation of Linux, the book progresses
    to extensive discussions of network configuration, firewalls, and services, including
    dynamic content web and Samba services.


    Plus, you''ll also get a CD-ROM that features Red Hat Linux 6.0 and an extensive
    collection of tools and utilities to make administrating the system a breeze.
    Both Linux and UNIX network and system administrators will find this book to be
    their definitive resource for practical Linux system administration advice.


