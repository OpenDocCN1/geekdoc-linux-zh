    # Apache mod_perl


    mod_perl is a special version of the perl interpreter that can be included within
    the Apache web server. mod_perl enables dramatic speed improvements on the execution
    of Perl scripts from a web environment.


    The RPM version of mod_perl documented here will not work with the Apache-PHP
    configuration documented earlier in this chapter; it must be installed on the
    stock Apache RPM distribution. It would be highly unwise to run both PHP and mod_perl
    at the same time, as the binary image of the web server would be huge. If the
    functionality of both packages is required, it might be preferable to configure
    two separate web servers, running at different ports, with the appropriate modules
    installed in each.


    A mod_perl RPM image is included with Red Hat Linux, but it is not installed by
    default. It can be found in the RedHat/RPMS/mod_perl-1.19-2.i1386.rpm file on
    the CD-ROM included with this text. Enter the commands shown in Listing 7.14 to
    install it.


    Listing 7.14 Installing mod_perl for Apache.


