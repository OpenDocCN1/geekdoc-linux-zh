  md: '# Introduction


    This is a book about Red Hat Linux. Linux is a “UNIX-like” operating system. The
    core software is maintained by Linus Torvalds, while Red Hat Software, Inc., collects
    supporting tools from around the Internet and packages the lot into their Linux
    distribution.


    This is a practical book, and some knowledge of UNIX is assumed. Generalizations
    and theory are avoided to the maximum extent. The unique features of the Linux
    system are demonstrated with little regard to design fundamentals.


    # Who Should Use This Book?


    This is a book mainly for UNIX users and administrators who are curious about
    the specific features of Linux. While this book draws from a number of development
    technologies (such as C, HTML, PHP, Perl, and the shell), the focus is upon system
    maintenance and administration.


    This book is written for two audiences. The first includes technical users who
    have an immediate need for some feature available in Linux. The second includes
    those who are curious about the Red Hat Linux system, and who may someday exploit'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'its features or direct others to do so. Favor is given to the first audience.

    This book is also appropriate for use in a classroom environment, even though
    there are no formal problem sets. The creation of such activities is left as an
    exercise for the instructor.


    # How This Book Is Organized


    An effort has been made to keep each subject entirely contained within a chapter.
    To a large extent, the material is not cumulative. It is conceivable that a reader
    could begin with a later chapter in the text, then return after some time (if
    at all) to the earlier material. There are only a few places within the text where
    this effort has not been maintained.


    # Conventions


    The following conventions are used in this book:


    +   * Code lines, keywords, and any text you see onscreen appear in a special
    monospace typeface.

    * Filenames are also set in a monospace typeface.

    * New terms are in *italics*.

    * Case is very important in Linux administration. Always pay attention to uppercase
    and lowercase in commands and scripts.

    * Commands and any text you must type appears in **boldface**. For example, “Type
    **ls -l**.


    # Linux, UNIX, and the Internet


    Linux is an operating system of dazzling complexity, and it is easy to become
    diverted by its many features. The temptation to include much more in this text
    than reasonable is very great—there is far more to Linux than what is contained
    here.


    It has long been accepted that the Internet is driven by UNIX. Internet and UNIX
    standards have developed coally for the life of both environments. The profound
    influence that the Berkley Software Distribution has had upon UNIX has been continued
    by powerful UNIX utilities such as sendmail, Sun Microsystem’s NFS, NCSA/Apache
    httpd, wu-ftpd, and many other tools.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'The Internet is now causing a vast social revolution. It has made resources
    and information from around around the world available with a single click of
    a mouse. This text is, to some small extent, a point of entry into this broad
    new horizon. By mastering the material presented here, a reader can construct
    and maintain a global communication system.


    You have purchased your ticket, and we are prepared to disembark. Linux awaits.'
  merge: -1
