- img_proc: true
  md: 'To delete rows from the database, use the SQL DELETE command:


    ```

    DELETE FROM list WHERE item = ''African Violet'';

    DELETE FROM list vendors WHERE vendorcode = 103;

    ```


    Be careful. DELETE FROM list would wipe out all the data, leaving the table empty.


    In a production environment, where tables contain a large number of rows, SQL
    operations may be faster if an index is defined. In this case, the commands to
    create the indexes are:


    ```

    CREATE INDEX listtab ON list (vendorcode);

    CREATE UNIQUE INDEX vendortab ON vendors (vendorcode);

    ```


    Notice that a unique index is created on the vendors table, because each vendor
    will have a unique vendor code.


    PostgreSQL keeps copies of modified or deleted rows in a database. This allows
    the database to be restored to the state it had at a previous date. Unfortunately,
    this also means that a large amount of storage could be consumed by inactive data.
    To clean your database of such inactive data, use the commands:


    +   - VACUUM list:

    - VACUUM vendors:


    In the next section, the web server will be connecting to the database to perform
    SELECT operations. Under Red Hat Linux, the web server process runs under userid
    nobody. To grant this user permission to SELECT from the database, run the following
    commands:


    +   - REVOKE ALL ON list FROM nobody;

    - GRANT SELECT ON list TO nobody;

    - GRANT INSERT ON list TO nobody;

    - REVOKE ALL ON vendors FROM nobody;

    - GRANT SELECT ON vendors TO nobody;

    - GRANT ALL ON list TO user;

    - GRANT ALL ON vendors TO user;


    The REVOKE ALL commands above remove all access permissions. Using such a REVOKE
    before a GRANT ensures that no previous permissions remain available to the user.


    If you are finished with the SQL interpreter, you can log out of it by typing:


    ```

    \q

    ```'
