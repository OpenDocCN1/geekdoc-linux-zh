    Next, copy the public key to the remote server using one or the other of the two
    commands. Use this syntax to copy it:


    ```

    scp ~/.ssh/identity.pub remotehost.com:/root/.ssh/authorized_keys

    ```


    Alternately, use this syntax to append the key to a remote

    authorized_keys file:


    ```

    ssh remotehost.com "cat >> ~/.ssh/authorized_keys" < ~/.ssh/identity.pub

    ```'
