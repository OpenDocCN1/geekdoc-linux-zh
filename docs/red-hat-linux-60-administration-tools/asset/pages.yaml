    | item |vendorcode|quantity |

    |---|---|--|

    | Root Beer | 100 | 3 |

    | Ice Cream | 100 | 1 |

    | Napkins | 101 | 50 |

    | Spark Plugs| 102 | 4 |

    | (4 rows)|


    Fields can be rearranged or omitted from the SELECT command by modifying the field
    names:


    ```

    SELECT item, quantity FROM list;

