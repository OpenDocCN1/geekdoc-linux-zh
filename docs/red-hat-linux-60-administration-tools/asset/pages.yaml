    To reiterate, basic network configuration requires the three parameters of IP
    address, netmask, and broadcast address. The network address is determined automatically
    by a bitwise and of the IP address and the netmask.


    The more expansive configuration options of gateway address and DNS server are
    addressed by the /etc/sysconfig/network script and /etc/resol.conf files. These
    files are configured at install time, and, with luck, they should not require
    modification.


    The final point of this section is a trick with 10BaseT cabling used between two
    computers, allowing a home network to be constructed very inexpensively. If 10BaseT
    twisted-pair Ethernet is being used, a hub is required to allow two or more computers
    to communicate. Two 10BaseT devices, however, can communicate without a hub if
    a special cable is constructed (or obtained from a manufacturer). This cable reverses
    the transmit and receive wire pairs from end to end. Table 2.2 is a RJ-45 wiring
    diagram (note that pins 4, 5, 7, and 8 are unused).


    **Table 2.2** Wiring guide for a 10baseT crossover cable.


    | Pair | Host Lead | Remote Lead |

    |---|---|--|

    | TX | 1 | 3 |

    | | 2 | 6 |

    | RX | 3 | 1 |

    | | 6 | 2 |


    Such a crossover cable dramatically reduces the expense of connecting two 10BaseT
    devices, which is useful in cost-conscious installations. These crossover cables
    can also be used to connect multiple 10BaseT hubs, at the cost of consuming one
    port of each hub where they are used.'
