    **Figure 2.2** Using netcfg to configure an interface.


    To accomplish the same operation from the command line, one could enter:


    # modprobe 3c509.o

    eth1:3c509 at 0x300 tag 1, 10baseT port,

    address 00 60 97 a6 b0 e5, IRQ 10.

    3c509.c:1.16 (2.2) 2/3/98 becker@cesedis.gsfc.nasa.gov.

    # ifconfig eth1 192.168.1.1 netmask 255.255.255.0 \

    broadcast 192.168.1.255


    eth1: Setting Rx mode to 1 addresses.


    Adding the device with the command line, however, will not make entries for it
    in the system initialization scripts. When Linux is rebooted, the card definition
    will be left. Cards defined for runtime initialization leave entries in `/etc/conf.modules`
    and the `/etc/sysconfig/network-scripts directories.


    When adding a network device as shown above, a route to the network will automatically
    be added to the routing table, enabling access to the network, which is directly
    attached to the adapter. Access to additional networks (including the default
    route) must be added explicitly.


    The only piece of information that is not immediately clear in the above shell
    commands is the **modprobe 3c509.o** command. This command loads a kernel module.
    This module is a driver for a 3Com509 network card. An experienced Linux administrator
    might be able to pick up a network card, find a Digital 21040 network chip on
    it (for example), and realize that a call to **modprobe tulip.o** would properly
    initialize the card. However, such knowledge normally escapes the novice. For
    more information about kernel module drivers for network cards, install the Linux
