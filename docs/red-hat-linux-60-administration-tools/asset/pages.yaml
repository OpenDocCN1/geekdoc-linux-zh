- img_proc: true
  md: 'The IP address—127.0.0.1—is a special address, called the

    loopback, which always refers to the local host.

    The /etc/resolv.conf file can also be removed to force the local

    nameserver to be used. If the local server fails, however, connect-

    ity to the Internet will essentially be lost. It is preferable to list up to

    three nameserver entries; the local will fail over to the backup(s)

    should the primary server(s) cease responding.


    Be cautious in setting the permissions on the /etc/resolv.conf

    file, as well. If a user does not have read permissions on this file,

    the DNS lookup will fail.


    A name server is normally used in two ways:


    +   - It is asked to provide information about hosts which it knows

    about first hand (over which it is authoritative).


    +   - It is asked about hosts over which it is not authoritative, and it

    must query other (authoritative) nameservers to gain the infor-

    mation, which it caches.


    The caching-only settings for the nameserver create a

    nameserver that is authoritative about nothing, and it must ask

    other nameservers about every host. Even if it is the administrator''s

    intention to create an authoritative nameserver, the installation of

    the caching-only nameserver is recommended; a caching-only

    server is the skeleton of an authoritative server.


    # Files for Forward Lookups


    Before DNS authority records can be created, a domain must be

    obtained from InterNIC. This can be accomplished through their

    website at http://www.internic.net. In order to register a domain,

    two authoritative nameservers for the requested domain must be

    available at the time of the registration.


    The popular whos utility is now included in Red Hat Linux and

    can be used to query the InterNIC databases. (The utility was

    sorely lacking in past releases.) See Listing 2.2 on page 66.'
