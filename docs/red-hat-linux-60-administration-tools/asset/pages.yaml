  md: '22


    Chapter 01 / Installation


    The disk partitions must be created before Red Hat Linux can be installed. A complete
    session with the fdisk utility was covered in a previous section of this chapter.
    From the menu shown in Figure 1.12, choose either disk druid or fdisk. Disk druid
    menus can be confusing but must be used in the next step to establish system mount
    points.


    Red Hat Linux (C) 1999 Red Hat Software Setup filesystems


    ************************* Disk Setup *************************

    * Disk Druid is a tool for partitioning and setting up *

    * mount points. It is designed to be easier to use than *

    * Linux''s traditional disk partitioning software, fdisk, *

    * as well as powerful. However, there are some cases *

    * where fdisk may be preferred.

    *

    * Which tool would you like to use?

    *

    ************************* \*\*\*\*\*\* \*\*\*\*\*\*\*

    * Disk Druid * fdisk * * Back *

    *\*\*\*\*\*\*\*\*\*\*\* \*\*\*\*\*\*\* \*\*\*\*\*\*\*

    *\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*\*


    <Tab>/<Alt-Tab> between elements | <Space> selects | <F12> next screen


    # Figure 1.12 Disk Setup menu.


    After the fdisk session has completed, a mount point must be chosen for each file
    system. This is done by moving the highlight on the disk druid menu (see Figure
    1.13) to a particular partition, using the “Tab” key to move to the “Edit” option,
    then selecting “Edit” and indicating a mount point. The root file system must
    be specified with a “/. The root file system must exist and other file system
    mount points are optional. DOS FAT partitions can also be mounted.


    Warning


    > The entire root file system must lie within the first 1024 cylinders, LILO will
    have great difficulty in booting the Linux system. Please ensure that the ending
    cylinder of the root file system falls below 1024.'
