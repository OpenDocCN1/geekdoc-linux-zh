    Warning


    # Sybase Devices


    Unlike PostgreSQL, Sybase will not natively use space in a Linux file system (no
    matter what type—ext2fs or otherwise). In a'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'UNIX environment, the preferred approach to Sybase data storage is a raw character-mode
    disk partition—effectively a partition made with disk that is formatted and utilized
    directly by Sybase.


    Linux does not support the use of character-mode disk partitions. Fortunately,
    Sybase also supports the use of device files—standard files created anywhere in
    the file system (not to be confused with the I/O device files in the /dev directory).
    Sybase device files are initialized and formatted by Sybase, both in the sybinit
    installer and in the interactive SQL interpreter.


    The drawback of placing Sybase database files within the file system is that write
    operations are buffered. Sybase can write data to its device files and receive
    a confirmation of the write, but then find that Linux has buffered the data and
    the write has not actually taken place at all. In the case of a server crash,
    data that Sybase confirmed as safely committed to the media is actually lost.


    It is possible to use a raw disk partition (such as /dev/sdb1) as a Sybase device
    file, but these partitions are block-mode devices and will be buffered. At this
    time, there is no character-mode storage that would bring higher-reliability to
    Linux Sybase ASE. This situation will be rectified with the latest commercial
    release of Sybase for Linux.


    # Sybase Configuration


    It is unfortunate that Sybase is shipped with default settings that will quickly
    destroy the server if they are not changed.


    Sybase is shipped with a single default device called the master. If the master
    device becomes full, the server will crash. The first thing that the DBA should
    do is create a new set of devices for database storage, select one of the new
    devices as the default storage device, then remove the default storage designation
    from the master device.


    Some recommend that no default devices be selected. This will force an explicit
    device selection when databases are created, and will ensure that those who create
    databases make conscious decisions about the allocation of storage.


    Performance can be greatly improved when devices are created on physically separate
    disk drives, especially in high-utilization environments.


    The size of Sybase devices is specified in 2KB blocks (1MB = 512 blocks).'
  merge: -1
