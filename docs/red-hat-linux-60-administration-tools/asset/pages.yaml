    # NFS/NIS


    The Network File System (NFS) is a protocol designed by Sun Microsystems that
    allow entire file systems or individual directories shared with remote computers.If
    you purchased any books on basic NFS operation for Linux, throw them away. NFS
    is extremely easy to configure and use. The NFS server is configured through the
    /etc/exports file. The simplest (and least'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'secure) configuration simply lists directories that may be shared

    with other servers:


    +   /home

    /usr/local/bin

    /var


    The Red Hat Linux NFS server is started by calling the portmap\and nfs scripts
    in /etc/rc.d/init.d. These can be configured to run

    at boot time, or they can be launched with the following commands:


    ```

    /etc/rc.d/init.d/portmap start

    /etc/rc.d/init.d/nfs start

    ```


    If the server is already active and the /etc/exports file has been

    changed, the server can be instructed to reread the file with the

    command of the form:


    ```

    exports -rv

    ```


    Once the server has been initialized, a client can use the

    exported directories (called *volumes*) when used over NFS) with a

    simple mount command:


    ```

    mount nfs.remotehost.com:/path/to/exported/directory /mnt

    ```


    An IP address can be used instead of a hostname. Several other

    options can be passed to influence performance (particularly

    rsize=8192,wsize=8192). Check the mount man page for more

    information.

    If a hostname is used, rather than an IP address, the system must

    be able to change the name of the remote NFS server into an IP

    address. Since DNS failures can prevent this change from taking

    place, it is always advisable to place entries in /etc/hosts for NFS

    servers whose file systems are mounted at boot time. It might also

    be profitable to examine /etc/nsswitch.conf and /etc/fstab, for

    additional flexibility in boot mounts.

    Once the mount command has been executed, the local host will

    see the file system within the local directory tree, and

    manipulate the files natively. File locking can be a problem; if

    is is great contention over a file, it is best not to place it within an

    NFS volume.'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'Please note that mounting an NFS file system over the Internet is not wise.
    NFS generally uses UDP packets, which are best suited to local networks; UDP packets
    over the Internet can be discarded easily, forcing retransmissions and reduced
    performance. FTP is much more appropriate for Internet usage, and scp with compression
    is even better (scp is discussed in Chapter 4, “Firewalls”).


    Please note that the root user is usually restricted in accessing remote file
    systems through a mechanism called root squash. The root will usually work as
    user nobody on the volume. Every other user is completely vulnerable to whatever
    the remote administrator may do, so not export an NFS volume to a system that
    you do not trust (or at export it as read-only, which is discussed shortly).


    As previously mentioned, /etc/exports can be made more secure. Examine the following:


    ```

    /home remotehost.com

    /usr/local/bin anotherhost.com(no_root_squash)

    /var thelasthost.com(no_root_squash)

    ```


    This file allows remotehost.com to access /home via NFS, and root squash is in
    effect. The /usr/local/bin directory is set for read-only access from anotherhost.com,
    and the /var directory has been completely shared with thelasthost.com;root may
    work natively on on this last remote host with full access to the exported volume.


    NIS presents a different issue entirely. The Network Information System (NIS)
    is a framework that allows several important files to be shared between UNIX hosts
    (/etc/passwd, /etc/group, and /etc/hosts, among others). Unfortunately, NIS has
    a reputation of being rather insecure. It can also be cumbersome to use, because
    the local /etc/passwd file is no longer the authoritative source of local account
    information.


    Several alternatives to NIS exist, including NIS+, the DCE registry, and Hesiod
    Bind. They are all extremely difficult to configure and use.


    A much simpler and better solution would be to use scp to copy these files from
    an arbitrarily-allocated master server to the slave servers whenever the files
    change. The programs that change these files (such as chfn, chsh, passwd, and
    chgrp) should be disabled on the slave servers.'
  merge: -1
