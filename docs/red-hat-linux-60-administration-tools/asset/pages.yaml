  md: '# Using SELECT from the Web


    PHP also has a directive that is similar to Server Side Includes (SSI) which is
    supported by most popular Web Servers. If the command include("/some/path/to/a/file.html")
    is encountered in a PHP block, the specified file will be inserted and parsed
    by PHP. There is even a phpPath variable that can be set that will allow the Web
    developer to dispense with path names. Conventional SSI directives will not be
    processed by CGI version of PHP. URL locations on different hosts can also be
    included, such as include("http://www.redhat.com").


    The CGI version of PHP can load files in users'' home directories with URLs of
    the form


    http://127.0.0.1/cgi-bin/php/~user/dbprint.php3


