  md: '# Installation


    The most difficult step in the use of any significant computer application is
    undoubtedly the initial configuration. This is certainly true of Red Hat Linux.
    Despite a dramatically simplified installation program, the individual acting
    as the installer must provide extensive system information before a working Linux
    system can emerge.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'The two areas that present the greatest difficulty for novice installers are
    disk partitioning and the configuration of the XWindow system. Red Hat has done
    some work to make both of these areas somewhat less daunting, but conditions easily
    arise that require extensive knowledge of these subjects, as well as specialized
    software tools.


    This chapter aims to familiarize a Linux installer with the intricacies of installation,
    with a special focus on the problem areas. Reading through this chapter before
    installation will help you prepare for these problems and alert you to the types
    of information required.


    # # Planning for Installation


    A basic installation of Red Hat Linux requires relatively modest hardware. Red
    Hat Linux can be installed on a computer with an Intel 386 with 16MB of memory,
    a 120MB hard drive, and a 3.5" floppy drive. If a CD-ROM is not available, either
    a network install must be performed, or an image of the installation files must
    be placed on the hard drive. CD-ROM installs are much more straightforward, and
    are strongly recommended for the novice installer—even if it requires disassembly.
    If additional subsystems are installed (such as a web server, database server,
    or electronic mail server), more disk space and/or processor power will be required.


    # # Understanding Disk Partitioning


    A hard disk drive must be cut into partitions before Linux is installed on it.
    Linux requires at least two partitions—one for file space (usually for an extended
    file system), and one for virtual memory (swap).


    There can be up to four *primary* partitions on a hard drive. One of the primary
    partitions can be designated as an *extended* partition, which can then hold additional
    *logical* partitions. Linux can use up to fifteen logical partitions that are
    created within the extended partition.


    On a running Linux system, both the drive as a whole and each partition on the
    drive are represented by Linux as files in the /dev directory. The files differ,
    depending on whether IDE or SCSI drives are in use.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Planning for Installation


    On a SCSI system, multiple drives across multiple controllers should be available.
    The boot drive, or the first available SCSI drive, is known as /dev/sda. Additional
    drives are known as /dev/sdb, /dev/sdc, etc. Additionally, SCSI CD-ROM devices
    are known as /dev/scd0 and above, and SCSI tapes are known as /dev/st0 or /dev/nst0
    and above.


    > If an IDE hard drive is installed as /dev/hda, it must be the boot drive, and
    it will assume precedence over any available SCSI drives. Do not install a device
    at /dev/hda if you intend to boot from a SCSI device. Caution


    This arrangement can be further complicated by IDE CDROMs, which appear on the
    system as hard drives. Most PCs place the IDE CD-ROM drive as the master IDE device
    on the second channel, which makes it /dev/hdc. Attempts to run disk on the CD-ROM
    device will prove ineffective. After installation, it is generally wise to set
    a soft link from /dev/cdrom to /dev/hdc (or whatever IDE device has been used
    for the CD-ROM drive). Many programs require such a link to properly control the
    CD-ROM drive. Programs that play audio CDs specifically require this link, and
    they also require write permission to the device file (which is granted with a
    command of the form chmod 666 /dev/hdc).


    Because of the geometry of modern hard disk drives, partitions near the outer
    edge of a disk provide much better performance than partitions near the center.
    The swap partition should be'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'allocated in such a way that it lies on the outer edge of the disk, since swap
    performance can greatly influence system performance. Other areas of the disk
    that will use high usage should also be located near the outer edge. This is covered
    in more detail in “Using fdisk” on page 6.


    Usually, if DOS or Windows has been previously installed on a computer, there
    is a single partition that spans the drive holding the FAT file system. This partition
    must be split before Linux is installed. This can be done by destroying the single
    partition and repartitioning the drive, or by non-destructively separating an
    unused portion of the partition which can then be used for Linux.


    > The fips tool found in the dosutils directory on the CD-ROM included with this
    text can be used for non-destructive repartitioning, but its use is entirely unsupported
    and it may cause data loss. Other commercial repartitioning tools are available,
    which may be more flexible than fips.


    While Linux can recognize any combination of primary and logical partitions, DOS/Windows
    only allows a single DOS FAT file system to exist in any of the four primary partitions.
    The DOS version of fdisk does not allow the creation of a second DOS FAT file
    system in a primary partition, and DOS will freeze on boot if Linux fdisk is used
    to create multiple DOS FAT file systems in the primary partitions. However, multiple
    DOS FAT file systems are allowed within the logical partitions.


    Also, please note: there can be grave difficulties in using Linux fdisk to mark
    DOS FAT file systems, as this section from the fdisk manual page explains:


    The DOS 6.x format command looks for some information in the first sector of the
    data area of the partition, and treats this information as more reliable than
    the information in the partition table. DOS format expects DOS fdisk to clear
    the first 512 bytes of the data area of a partition whenever a size change occurs.
    DOS format looks at this extra information even if the /U flag is given—we consider
    this a bug in DOS format and DOS fdisk.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Planning for Installation


    The bottom line is that if you use cfdisk or fdisk to change the size of a DOS
    partition table entry, then you must also use dd to zero the first 512 bytes of
    that partition before using DOS FORMAT to format the partition. If you are using
    cfdisk, for example, to make a DOS partition table entry for /dev/hda1, then (after
    exiting fdisk and rebooting Linux so that the partition table information is valid)
    you would use the command dd if=/dev/zero of=/dev/hda1 bs=512 count=1 to zero
    the first 512 bytes of the partition.


    BE EXTREMELY CAREFUL if you use the dd command, since a small typo can make all
    of the data on your disk useless.

    nFor best results, you should always use an OS-specific partition table program.
    For example, you should make DOS partitions with the DOS FDISK program and Linux
    partitions with the Linux fdisk or cfdisk programs.


    # Filesystem Considerations for Partitions


    As has been previously stated, Linux requires at least two partitions at installation
    (one for the root file system, and one for swap). It is usually desirable, however,
    to create additional file systems (and the partitions on which they reside) to
    isolate different areas of the Linux system. Each separate disk partition can
    hold a single native file system.


    For example, it is usually a good idea to prepare the /home directory as. This
    ensures that if /home fills, normal logging activity will continue on the root
    file system and many other system administration options will remain open.


    The following are important directory locations which might do well when configured
    as separate file systems:


    /home


    Creating a separate /home file system isolates the system areas from non-privileged
    users. If more than a few trusted users will be accessing the system, the creation
    of a separate /home file system is highly recommended.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# /opt


    Commercial software is installed in /opt on most major UNIX variants. Red Hat
    does not create an /opt directory in the normal case of installation, but the
    Sybase Adaptive Enterprise SQL Server does create the directory. In this guide,
    however, it is recommended to install Sybase /home to simplify the preparation
    of PHP. It is therefore suggested that /opt not be created as a separate file
    system, but that a soft link be set from /opt to /home at a later time. The installer
    is free to disregard this advice and allow /opt to be created in the root file
    system, or allocate a separate device for it.


    # /usr


    The /usr directory holds binaries that are not critical for system administration.
    This directory can be a part of the root file system, or it can be separate. Some
    UNIX variants share this directory across multiple systems with NFS. This is much
    more difficult to maintain under Red Hat, as such an installation invalidates
    RPM.


    # /var


    The /var directory holds system logs in /var/log. If the relevant subsystems are
    installed, /var will also contain electronic mail in /var/spool/mail, and news
    spools in /var/spool/news. Each of these separate areas of /var might require
    a separate file system, depending on the configuration and use of the system.


    # Using fdisk


    Bearing the previous discussion of disk partitioning in mind, an example of a
    typical workstation fdisk session is shown Listing 1.1.


    This workstation has a 3.5 gigabyte hard disk drive. A Windows operating system
    is installed on the drive, and has been configured to occupy a 2 gigabyte partition
    (which is the maximum allowable size for the older FAT file systems).


    This fdisk session will be used later in the example installation of a new Red
    Hat Linux system. If a new drive were added to the computer, an fdisk partitioning
    session similar to the one below would be required before the new drive could
    be used under Linux.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Planning for Installation


    > Be extremely careful in running fdisk on drives with an installed operating
    system. It is extremely easy to make a mistake that wipes out a partition and
    the operating system on it. The value of backups in such a situation cannot be
    overemphasized.


    # Warning


    Below is the complete fdisk session. The warning concerning the default device
    file is passed as an argument to fdisk (i.e., call “fdisk /dev/hda” rather than
    “fdisk” from the shell).


    **Listing 1.1** The fdisk help menu.


    ```

    fdisk

    Using /dev/hda as default device!


    Command (m for help): **m**nCommand action

    a toggle a bootable flag

    b edit disklabel

    c toggle the dos compatibility flag

    d delete a partition

    l list known partition types

    m print this menu

    n add a new partition

    no create a new empty DOS partition table

    p print the partition table

    q quit without saving changes

    s create a new empty Sun disklabel

    t change a partition''s system id

    u change display/entry units

    v verify the partition table

    w write table to disk and exit

    x extra functionality (experts only)

    ```


    The help command used above displays all the options for fdisk. The first thing
    to do in such a situation is to examine the existing partition table on the drive:


    ```

    Command (m for help): **p**

    ```


    Disk /dev/hda: 128 heads, 63 sectors, 847 cylinders

    Units – cylinders of 8064 * 512 bytes


    | Device Boot | Start | End | Blocks | Id | System |

    | /dev/hda | * | 1 | 520 | 209608+ | 6 | FAT16 |'
