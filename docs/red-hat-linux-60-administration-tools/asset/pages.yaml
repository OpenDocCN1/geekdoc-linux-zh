- img_proc: true
  md: '# Using an Errata Kernel


    Below is an example /etc/lilo.conf demonstrating the use of an initrd. Note that
    the generic kernel put down by the Red Hat installer has been preserved:


    ```

    boot=/dev/sda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    image=/vmlinux

    label=linux

    root=/dev/sdal

    initrd=/initrd

    read-only

    image=/boot/vmlinuz-2.2.5-15smp

    label=linuxold

    root=/dev/sdal

    initrd=/boot/initrd-2.2.5-15smp.img

    read-only

    image=/boot/vmlinuz-2.2.5-15

    label=linux-up

    root=/dev/sdal

    image=/boot/initrd-2.2.5-15.img

    read-only

    ```


    # Using an Errata Kernel


    If you don''t want to go through the trouble of building your own kernel, you
    can apply errata kernels that are posted by Red Hat. At the time of the publication
    of this text, the latest version of the kernel that Red Hat would like you to
    use is 2.2.5, build 22. This version replaces 2.2.5, build 15, which has a bug
    that allows remote users to crash it.


    In previous Linux distributions, Red Hat''s Linux installation included a single
    kernel RPM compiled for an 80386 processor. Starting in Red Hat Linux 6.0, Red
    Hat now includes several kernels for different types of machines. Following are
    the kernel packages in the errata:


    kernel-2.2.5-22.i386.rpm


    For i386, i486 and other non-Pentium systems


    kernel-2.2.5-22.i586.rpm


    For Pentium and most Pentium-class CPUs'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# kernel-smp-2.2.5-22.i586.rpm


    For Pentium SMP boxes


    # kernel-2.2.5-22.i686.rpm


    For i686 (Pentium II, Celeron)


    # kernel-smp-2.2.5-22.i686.rpm


    For i686 SMP


    Red Hat provides a long list of steps to upgrade your kernel, but it really isn''t
    that hard. For this exercise, we will assume that a uni-processor Pentium system
    is to be upgraded. Enter the following commands of:


    ```

    /sbin/modprobe loop.o

    rpm -iv kernel-2.2.5-22.i586.rpm

    /sbin/mkinitrd /boot/initrd-2.2.5-22.img 2.2-25

    ```


    If you are really brave (or crazy), you can use the "Uvh" option of RPM instead.
    It will destroy your present kernel and prevent LILO from booting the system unless
    it is reconfigured:


    ```

    /sbin/modprobe loop.o

    rpm -Uvh kernel-2.2.5-22.i586.rpm

    /sbin/mkinitrd /boot/initrd-2.2.5-22.img 2.2-25

    ```


    The "Uvh" option is probably more realistic for IDE users rather than SCSI users.
    If, for some reason, the loopback device is not available, the mkinitrd will fail.


    In either case, you attempt either of these command sets, make sure that you have
    your boot disk handy. Lost your boot disk? You can create another, *before* your
    upgrade, with the following command:


    ```

    mkbootdisk --device /dev/fd0 2.2-5-15

    ```


    If I have to tell you that /dev/fd0 is the A: drive on your PC, you probably aren''t
    ready to be doing a kernel upgrade. You should also be advised that if you use
    the "Uvh" option to the RPM kernel upgrade command, the loop.o kernel module will
    not be available on your boot disk (if the system crashes). You can get it out
    of an older RPM, don''t use the "Uvh" option, unless you''re *sure* that you can
    get it right the first time. You might set aside a copy of your old kernel before
    you start. (It lives in `/lib/modules` directory.)'
