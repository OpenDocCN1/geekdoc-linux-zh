- img_proc: true
  md: 'An important point to make about the process of writing CD-R discs is the FIFO
    (First-In, First-Out) buffer. The CD-R drive has a small amount of memory which
    is used as a buffer as it writes to the blank CD-R. The buffer is filled as the
    computer writes data to the drive, and emptied as the drive writes the data to
    the CD-R. The buffer *must not* be allowed to go empty until the disc is completely
    written; if the FIFO empties prematurely, the disc will be wasted. For this reason,
    it is imperative that the Linux system be lightly loaded while the recording of
    the blank CD-R is taking place. If cdrecord is forced to compete with other system
    processes for access to the CPU or the I/O system, the CD-R media may be wasted
    (instant coaster!). cdrecord augments the buffer on the CD-Recordable drive with
    another FIFO in system memory, but it is advisable not to tempt fate by using
    cdrecord on a system that is too busy.


    It is also not safe to burn an image that is mounted on an NFS file system, for
    fears of a FIFO underrun. Options are available that will control the FIFO, which
    may allow slower file systems to perform acceptably.


    A data image can be written to a CD-Recordable disc by omitting the dummy option
    to cdrecord. Do not write the image until a successful test run of cdrecord is
    achieved. An example that will perform a write follows:


    ```

    /opt/schily/bin/cdrecord -v speed=2 dev=0,0 /tmp/cdimage.raw

    ```


    There are many more options to cdrecord (more than there are to 1, as the author
    has pointed out). Refer to the online manual page and the distribution notes for
    further information.


