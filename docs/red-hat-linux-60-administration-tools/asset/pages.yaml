- img_proc: true
  md: '# Navigating "make config"


    Before beginning a kernel configuration, it might be appropriate to examine the
    output of the ismod command. ismod will list all loaded modules in the kernel
    image. A list will confirm both planned kernel features and list hardware drivers
    that might have been neglected or forgotten. Obviously, ismod will fail if a static
    kernel is in use.


    Not every kernel configuration option can be covered here. Being aware of the
    specific problem areas, the administrator must build a kernel, boot with it, then
    test to see if all required functionality is still available. If something important
    doesn''t work anymore (e.g., network routing, the CD-ROM drive, etc.), it is likely
    that the kernel wasn''t built with everything it needs.


    Now, a brief synopsis of the options in menuconfig (help is available on any option
    through the menus):


    # Code maturity level options


    This menu allows for experimental drivers and incomplete code to be included in
    the build. Unless you like to live on the wild side, leave this switch off. However,
    the kernel-based NFS server (now the supported NFS server for Red Hat Linux) is
    classed as an experimental feature, so this option must be turned on to provide
    NFS server support.


    # Processor type and features


    Select the type of processor for which the kernel is being built. If the kernel
    obtained from this process will be used on a variety of machines, build for the
    least common denominator. For example, if the processor lacks the “math coprocessor”
    (the 386, 486sx, and NexGen processors do not include them, but all Pentiums do),
    be sure to enable math emulation. If the system has multiple processors, enable
    Symmetric Multi-Processing (SMP). Otherwise leave it off.


    # Loadable module support


    If this option is enabled, extra kernel code will be stored under /lib/modules,
    and kernel features that support it can be loaded as dynamic modules. If modules
    are enabled, enable the kernel module loader (so the old kerneld module loader
    isn''t required). If modules aren''t enabled, remember to comment out the entry'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'in /etc/cron.d/kmod. Otherwise hourly status messages will be generated by
    cron concerning module manipulation failures.


    # General setup


    Basic networking, PCI bus controls (PCI is a hardware standard used in most modern
    PCs, the format of program binaries, and System V IPC are configured here. Make
    sure that most of these features are on. Inter-Process Communication (IPC) is
    used by many applications, especially the Apache web server.


    # Plug and Play support


    Try to avoid plug and play hardware, but if you''ve got it, enable this feature.


    # Block devices


    The IDE disk and CD-ROM support should probably be enabled, even if the system
    is SCSI-only, since IDE equipment is so cheap and plentiful. If the IDE chipset
    can be verified, set it here specifically (turn off the checks for the buggy CMD640
    and RZ1000 if they are not needed). If this kernel will be used to write CD-ROMs,
    it will be useful to enable the loopback device. The mnitrd command also requires
    the loopback device, so it is best to include support for it in any kernel you
    build.


    # Networking options


    Major networking parameters including routing, firewalls and masquerade can be
    configured within this menu (masquerade only appears if "Network Firewalls", "TCP/IP
    Networking," "IP Firewalls," and "always defragment" options are set).


    # SCSI support


    Support for SCSI configurations is available here. CD recorders require SCSI generic
    support. Individual SCSI adapters can be selected from the SCSI low-level drivers
    menu at the bottom. If your root file system is on a SCSI controller, compile
    the driver for the controller directly into the kernel—not as a module—or an initrd
    image will be required.


    # Network device support


    Drivers for networking hardware will be found here, including Ethernet, fdt, etc.
    Support for PPP is also configured within this menu.'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'Navigating “make config”


    # Amateur Radio support


    Configure Linux support for amateur radio here.


    # IrDA subsystem support


    If you have wireless infrared devices on your computer equipment, configure them
    here.


    # ISDN subsystem


    If you have an Integrated Services Digital Network adapter, configure it here.


    # Old CD-ROM drivers (not SCSI, not IDE)


    If you have a really old CD-ROM drive, which is not based on the SCSI or IDE interfaces,
    do us all a favor and buy something newer. IDE CD-ROM drives can be found for
    under $50. If you absolutely must have support for one of these older drives,
    configure it in this menu.


    # Character devices


    The console and virtual terminal options in this menu probably shouldn''t be changed.
    If you have a supported multi-port serial board, a driver for it can be configured
    here. Pseudo-terminal devices are also configured here. Pseudo-terminals are consumed
    by telnet connections, xterms, and other terminal-like services. The default is
    a maximum of 256 devices; increase this limit if necessary. Bus mice and PS/2
    mouse support is included in this menu, as well as QIC tape support.


    # File systems


    The critical entry is the Second extended fs support. This is the native file
    system for Red Hat Linux 6.0. Without it, the system will not boot. CD-ROMs cannot
    be read without the ISO 9660 file system support. DOS file systems will commonly
    require FAT support, plus one of the DOS file system types (such as MSDOS or VFAT);
    for /proc file system is virtually required—its absence will break many programs.
    NFS client and server support can be found under the Network File Systems menu—NFS
    server support requires experimental driver support in the Code Maturity menu.'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# Console drivers


    These include drivers for basic VGA, plus the new frame buffer.


    # Sound


    Sound cards are configured here.


    # Kernel hacking


    The option in this menu is only used in debugging the Linux kernel. Unless you
    are actively modifying code in the kernel, it is safe to leave this option unset.


    # Load/Save alternate configuration file


    It is possible to save the kernel configuration to a file. This file can then
    be moved to another machine and loaded into a separate kernel build environment.
    The kernel configuration from the Red Hat kernel source packages is stored in
    kernel/redhat.config on the CD-ROM included with this text. It can be loaded with
    the above menu options. This configuration requires an initrd, so modify the SCSI
    configuration to compile a driver for your SCSI controller directly into the kernel
    if possible.


    When all options have been properly configured, exit the menu. A prompt will ask
    if the changes to the kernel configuration should be abandoned. Answer “No” if
    everything is correct.


    # Compiling the Kernel


    Once the kernel configuration is complete, run the following two commands to clean
    the source tree and generate the dependency files:


    ```

    make dep

    make clean

    ```


    At this point, one way to generate a new kernel is with the following command:


    ```

    make zlilo

    ```


    This command will generate the files /vmlinuz (the zipped kernel image) and /System.map
    (a table of symbols from the kernel). Because Red Hat Linux installs the kernel
    in the /boot directory, however, this new kernel will not boot. One way to use
    this new kernel is to modify LILO to boot from /vmlinuz. Below is an'
