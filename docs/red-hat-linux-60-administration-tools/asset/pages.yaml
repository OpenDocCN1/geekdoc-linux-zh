  pgno: 121
- img_proc: true
  md: '# TIS Firewall Toolkit


    rlogin-gw

    This is the Berkeley rlogin proxy.


    tn-gw

    This is the telnet proxy.


    x-gw

    This is the proxy for XWindows applications. It will only be built if the XWindows
    development libraries and include files were installed.


    Each proxy application available with the FWTK can be configured to restrict the
    set of hosts that are allowed to access the proxy, the possible destinations that
    might be requested, or both. While the behavior of the proxies is configured with
    netperm-table, their invocation is usually controlled through /etc/inetd.conf.
    Below is an entry in this file that would configure the telnet proxy:


    ```

    telnet tcp nowait.1024 root /usr/local/etc/netacl tn-gw

    ```


    A point of interest is to nowait in the line above. inetd is configured by default
    to allow 40 invocations of any particular service over a 60-second period. Should
    this limit be exceeded, the service will be shut down for a time (inetd cease
    forking), and a note of the fact will be made to /var/log/messages. The 1024 parameter
    to nowait increases this limit. This parameter is extremely important on busy
    firewalls.


    Continuing the example configuration of a telnet proxy, the following lines in
    netperm-table allow use of:


    ```

    netacl-tn-gw: permit-hosts * -exec /usr/local/etc/tn-gw

    tn-gw: permit-hosts * -passok -xok

    ```


    Please note that this configuration will not be activated until inetd has been
    refreshed. This can be accomplished by either rebooting the system or sending
    the HUP signal to the daemon. Conversely, there is no need to refresh inetd or
    any other process when the netperm-table file changes. This is because the proxies
    are re-spawned each time they are invoked. They scan netperm-table at that time.
    inetd, on the other hand, only reads its configuration file when it is started
    up or sent a HUP.


    The netperm-table itself has limitations. The maximum line length allowed in this
    file varies, depending upon the operating'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'system, but usually it is 1,024 characters. Also, no method is pro- voted for
    continuing lines (e.g., a "\" to continue on the next line). Strict observance
    of these rules will allow your netperm-table to be easily ported.


    Once inetd has been refreshed, attempts to telnet to the bastion host will be
    greeted with the following prompt:


    ```

    tn-gw->

    ```


    There are only a few options available at the proxy prompt. The most useful option
    opens a connection to another host:


    ```

    tn-gw-> connect another.host.com

    Trying 1.2.3.4 port 23...

    Connected to another.host.com.

    login:

    ```


    This firewall configuration is not very secure, as it permits any-one to initiate
    connections anywhere. Restricting access, however, is straightforward:


    ```

    netacl-tn-gw: permit-hosts 1.2.3.* 192.168.1.* -exec /usr/local/etc/tn-gw

    tn-gw: permit-hosts 1.2.3.* 192.168.1.* -passok -xok -dest { 1.2.3.4

    *.remotehost.}

    ```


    While it may appear redundant to list the hosts twice (once for netacl, and once
    for tn-gw), it is safer to do so in case netacl is removed from /etc/inetd at
    some later date. netacl in this case is somewhat superfluous. It can be configured,
    however, to run multiple server binaries on a connection based on the remote IP
    address—so it is suggested. Note also that line breaks, such as the one appearing
    for tn-gw, are not allowed, but is used here for clarity.


    > Note that it is possible to allow Telnet connections into the bastion host,
    but it is extremely inadvisable to do so. If shell connections into the firewall
    are required, they should be done via an encrypted protocol such as ssh and careful
    access control.


    Finally, make sure that the proxy can bridge the firewall in both directions.
    This would allow general connections out of the protected network(s) but, at the
    same time, allow restricted access inside.


    The FTP proxy is somewhat similar in operation to tn-gw, though it is not normally
    configured with netacl. Following is a line that might be used in /etc/inetd.conf
    to configure it:


    ```

    ftp stream tcp nowait.1024 root usr/local/etc/ftp-gw ftp-gw

    ```'
