    Execute permissions are not set for this script, so the simplest

    to run it is with:


    ```

    sh rename

    ```


    This script will fail for all but tracks 3 through 5, causing many

    error messages.

    If you intend to immediately write out these WAV files to a

    CD-R, you may not want to run this script. tracknames.pl does

    move not the .inf files that are associated with each WAV file. The.

    .inf files contain pre-gap information that can be used when writ-

    ing the blank CD-R.

    Future versions of the cdrecord distribution will most likely fea-

    ture enhanced CDDB functionality. The programs contained

    within the cdrecord distribution will use www.cdindex.org,

    since the CDDB database is not free. Support will most likely have

    changed by the time you have read this.


    # Burning an audio image to a CDR with cdrecord


    A collection of WAV files (recorded at the proper frequency of 44.1

    kHz with the proper attributes) can be burned to a blank CD-R

    with a call to cdrecord of the following form:


    ```

    /opt/schily/bin/cdrecord -v speed=2 dev=0,0,0 -pad -useinfo \

    -audio *.wav

    ```


    You should probably test the recording by using the -dummy

    option before committing to a write. The -useinfo option above

    will work unless you have preserved the .inf files that were

    generated by cdda2wav. The -pad option above ensures that the

    audio tracks are padded to a multiple of 2352 bytes, as is required

    for storage on an audio CD.

    The -useinfo option above has not been tested under "track at

    once" (TAO) mode. The author of cdrecord suggests -useinfo'
