  md: "# Listing 7.16 An example of Pg Perl.\n\n```\n#!/usr/bin/perl\n\nuse Pg;\n\n\
    $conn = Pg::connectdb(\"dbname - shopping\");\n\n$result = $conn->exec(\"SELECT\
    \ list.item, vendors.vendorname, list.quantity FROM list, vendors\nWHERE list.vendercode\
    \ = vendors.vendercode\nORDER BY list.item\");\n\n$ntuples = $result->ntuples;\n\
    \nfor($i=0; $i < $ntuples; $i++) {\n    $item = $result->getvalue($i, 0);\n  \
    \  $vendorname = $result->getvalue($i, 1);\n    $quantity = $result->getvalue($i,\
    \ 2);\n    print \"$quantity\\t$item\\t$vendorname\\n\";\n}\n```\n\nPlease notice\
    \ that the user running the script is the Postgres user who will attempt to access\
    \ the database. In the examples in the last two chapters, only user and nobody\
    \ have such permissions, so the script will fail for everyone else.\n\n# sybperl\n\
    \nThe preeminent perl connection tool for Sybase databases is the sybperl distribution\
    \ written by Michael Peppler. The sybperl-2.10_02.tar.gz home page can be found\
