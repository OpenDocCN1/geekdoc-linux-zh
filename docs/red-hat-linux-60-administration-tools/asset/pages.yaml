    the price of convenience is risk.


    # Conclusion


    It is not wise for an Internet firewall administrator to consider his secure network
    unimprpregnable. A determined attacker sees firewall security features as mere
    obstacles, not insurmountable obstructions. Only with true vigilance can hostile
    attacks be repelled.


    An administrator should review each of the following system components:


    +   - The function of each service entry in /etc/inetd.conf, and why the service
    cannot be disabled.


    +   - Any running daemons reported by ps aux (although this can be forged by a
    rogue kernel).


    +   - Permitted route origins and destinations, with documentation.


    +   - All unencrypted communication channels passing through the firewall, and
    why they do not compose a security risk.


    +   - The installation status of the Red Hat Errata packages that have been issued
    for the platform.


