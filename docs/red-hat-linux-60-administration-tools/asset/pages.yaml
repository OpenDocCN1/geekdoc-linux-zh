- img_proc: true
  md: 'pcmia

    Personal Computer Memory Card International Association—configures the PCMCIA
    cards usually found in laptop computers.


    portmap

    Portmap—launches the portmapper, which is required for ONC RPC services like NFS
    and NIS.


    postgresql

    Postmaster—this script launches the postmaster for the PostgreSQL database system.
    The postmaster will not launch unless a number of control files are in place.


    random

    Random Number Seed—maintains the status of the random number generator.


    routed

    Routing Daemon—this daemon maintains dynamic routes with RIP. This is not needed
    for static routes.


    rstatd

    Remote Status Daemon—allows performance measurement by remote machines. It requires
    portmap.


    rusersd

    Remote Users Daemon—allows user lookup by remote machines. It requires portmap.


    rwhod

    Remote Who Daemon—allows user lookup by remote machines.


    sendmail

    Sendmail—daemon which acts as an electronic Mail Transfer Agent (MTA).


    smb

    Samba—this script launches smbd and nmbd, which are typically used to share files
    and printers with Windows systems.


    snmpd

    Simple Network Management Protocol Daemon—this daemon is used to monitor and control
    networks.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# A Sample Installation


    sound

    Sound—this script configures a known sound device. The sndcon-fig utility must
    be run successfully before the device will function.


    syslog

    System Logging Daemon—logs status messages in a variety of locations. The most
    important is /var/log/messages. Logs are controlled by the logfile rotation system.


    xfs

    X Font Server—serves fonts for Windows. The XWindow system will not function without
    a font server.


    ypbind

    Network Information Service—allows machines to share the same /etc/passwd, /etc/group,
    /etc/hosts and other files. It requires portmap. More secure password sharing
    (i.e., sharing among hosts) can be implemented with ssh.


