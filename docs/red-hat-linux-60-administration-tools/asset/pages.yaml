- img_proc: true
  md: 'The system will ask for a password. Enter one, then confirm it.

    Now examine the file /etc/httpd/htpasswd. It will be similar to this:

    boguser:TPNWusI5zZdqs


    If all of these steps have been performed correctly, viewing the

    URL http://127.0.0.1/restrict/test.html with a browser will require

    a name and password.


    The file above actually allows unrestricted access from any

    requests originating from permitted.com (which requires reverse

    DNS to function properly). An IP address can also be used in this

    position. If no unrestricted access is to be allowed, simply remove

    the allow line completely.


    The htpasswd file can hold multiple accounts and passwords. To

    add another account and password to the file, enter the following

    command:


    /usr/bin/htpasswd /etc/httpd/htpasswd realuser


    Notice the lack of a -c option in the previous htpasswd comm-mand. The htpasswd
    file already exists; it does not need to be cre-ated again. After entering a password
    for this user,

    /etc/httpd/htpasswd will contain another line:

    boguser:TPNWusI5zZdqs

    realuser:Mv1hxh2ff07k


    A number of users with individual passwords may be added in

    this manner. The Apache documentation warns that access will

    become very slow if an htpasswd file grows large. The problem of

    large authorized users lists can be solved by moving the htpasswd

    data into a database. The Apache documentation recommends

    authentication against a Sybase database is discussed in Chapter 7, “Database

    Servers."


    As a final note, astute users might have noticed the entries

    in an htpasswd file are similar to the /etc/passwd database (or

    /etc/shadow, or the pwconv utility which has been executed) which holds

    information about all users. In fact, the same password encryption

    technique (DES, not MD5) is used in both files, and it is possible to

    move the password hashes freely from one file to the other.'
