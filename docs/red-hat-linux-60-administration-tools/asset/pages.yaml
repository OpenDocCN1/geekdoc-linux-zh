- img_proc: true
  md: '# Recording Compact Discs


    Software for writing CD-Recordables under Linux has been available for some time.
    The cdrecord utility, one of the preeminent tools for writing CDs, is very stable
    despite its current alpha status. Two important companion utilities, mkisofs and
    cdda2wav, have recently been included in the cdrecord distribution. With these
    utilities, cdrecord is now all you need to prepare and write CD-Recordables under
    Linux.'
  merge: -1
  pgno: 274
- img_proc: true
  md: 'cdrecord is maintained by Jörg Schilling. The home page for the utility is
    http://www.focus.gmd.de/research/cc/glone/employees/joerg.schilling/private/cdrecord.html.


    The current release when this text was written was cdrecord-1.8a24. A copy of
    this distribution is on the CD-ROM included with this text in the /cdrecord directory.
    However, you should examine the web site to determine if a newer version is available.


    On Linux, cdrecord works with the SCSI generic devices (/dev/sg7?). However, there
    are several important things to note. For one, support for these devices must
    be enabled in the kernel. For another, cdrecord uses SCSI emulation to address
    IDE devices. Finally, cdrecord requires Inter-Process Communication facilities
    (IPC) to be enabled in the kernel. The standard Red Hat distributions laid down
    by the installer contain all the support for these features that is required.
    Your kernel is fine as is, but the SCSI emulation must be configured through the
    LILO interface, which will require a reboot. For non-x86 architectures (which
    are not really addressed in this text), it may be necessary to raise the default
    shared memory size, which is documented in the READMElinux file contained in the
    distribution.


    Jörg Schilling complains bitterly in the documentation for cdrecord about the
    quality (or lack thereof) of the SCSI implementation in the Linux kernel. Let''s
    hope that this issue is soon resolved to the satisfaction of all concerned.


    # Configuration


    Before cdrecord can be used, the Linux kernel must be properly configured to address
    a CD-Recorder. Extra kernel functionality will be required if you are using an
    IDE CD-Recorder.


    # SCSI Considerations


    SCSI CD-Recorders are ideal for use with cdrecord. The kernel will require support
    for the SCSI generic devices, and the /dev/sg/ devices must exist. Also, if cdrecord
    will be used with an IDE recorder, SCSI emulation must be configured for the drive.


    If the device files in the /dev directory have been damaged, they can be rebuilt
    with the MAKDEV script that is itself in the /dev'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# IDE Considerations


    directory. In this case, the correct syntax to rebuild the SCSI generic devices
    is MAKEDEV sg.


    The kernel will also require basic Inter-Process Communication (IPC) services.
    Loopback device support is also recommended as it allows you to test CD images
    on the hard drive before they are burned on the CD-ROM.


    All of this support is available in the Red Hat distribution kernel. For information
    on kernel options, see Chapter 10, “Rebuilding the Linux Kernel."


    # IDE Considerations


    Starting with Red Hat Linux 6.0, there is no longer a need to build a specialized
    kernel to use an IDE CD recorder (oh joy!). All required functionality is available
    under the standard Red Hat distribution kernel with LILO and kernel modules.


    IDE CD-Recordable drives must use the ide-scsi kernel module to emulate a SCSI
    generic devices. This is accomplished through LILO and the modprobe utility, but
    a quick review of the IDE device names under Linux is in order.


    As a Linux administrator ought to know, there are usually two IDE channels on
    PC motherboards. Each IDE channel can host up to two IDE devices, one master and
    one slave. The /dev entries for these devices are shown below:


    +   Primary Channel Master /dev/hda


    +   Primary Channel Slave /dev/hdb


    +   Secondary Channel Master /dev/hdc


    +   Secondary Channel Slave /dev/hdd


    In most modern PCs, the hard drive is installed as the master on the primary channel
    (/dev/hda), while the CD-ROM (read-only) drive is normally installed as the master
    on the secondary channel (/dev/hdc). It can be disconcerting to have a CD-ROM
    drive referred to as “Hard Drive C,” and there is ample reason to install a soft
    link from /dev/cdrom to /dev/hdc. This is not only for clarity; some programs,
    such as audio CD players, require this link. Normally, a CD-Recordable drive is
    installed in addition to the read-only drive as the slave on the secondary channel
    (/dev/hdd), since'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'CD-Recordable drives are much slower at reading CD-ROMs than the read-only
    drives. Some CD-Recordable drives work better if they are installed as IDE master
    devices. However, in this section, we will assume that the CD-Recordable drive
    is installed as a slave on the secondary channel.


    Given the above configuration, with the CD-Recordable drive as the slave device
    on the secondary channel (/dev/hdd), the first step in configuring the drive with
    SCSI emulation is to pass hdd-ide-scsi as an argument to the kernel at boot time
    (if /dev/hdd is not the CD-Recordable drive, substitute another device name).
    This is normally done through LILO (unless another bootloader is in use, such
    as loadlin, MILO, or SILO, but these configurations are not covered in this text).
    Below is an example /etc/lilo.conf that passes this argument:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    other-/dev/hda

    label-dos

    table=/dev/hda

    image=/boot/vmlinux-2.2.5-22

    label-linux

    root=/dev/hdd5

    read-only

    append="hdd-ide-scsi"

    ```


    This LILO configuration boots a DOS variant by default, but when Linux is booted,
    the hdd-ide-scsi string is passed as an argument to the Linux kernel (with the
    append option on the last line of the file). This is not the only step required
    to convert the IDE drive into a SCSI-emulated drive. After booting Linux with
    the new kernel argument, root must issue the following command to complete the
    emulation:


    # modprobe ide-scsi


    The kernel will then report the status of the SCSI initialization as it probes
    SCSI IDs and LUNs (Logical Unit Numbers). It should identify the manufact and
    model number of the IDE drive as the probe progresses.'
