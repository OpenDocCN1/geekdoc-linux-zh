    # Using find


    The `find` utility implements a brute-force approach to finding files. This program
    finds files by searching through the specified directory tree, checking filenames,
    creation dates, and so on to locate the files that match the specified criteria.
    Because of this operation method, `find` tends to be slow. It''s flexible, however,
    and likely to succeed, assuming the file you seek exists. To use `find`, type
    its name, optionally followed by a directory tree pathname (sometimes called a
    *starting point directory*) and a series of options, some of which use specifications
    that are similar to regular expressions.


    > In practice, you must use a directory tree pathname or a search criterion with
    `find`, and often both.


    You can specify one or more paths in which `find` should operate; the program
    will restrict its operations to these paths. The man page for `find` includes
    information about its search criteria, but Table 8.2 summarizes common criteria.'
