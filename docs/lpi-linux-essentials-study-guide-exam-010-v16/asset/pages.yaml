  md: '# Conventions Used in This Book


    This book uses certain typographic styles in order to help you quickly identify
    important information and to avoid confusion over the meaning of words such as
    onscreen prompts. In particular, look for the following styles:


    +   * *Italicized text* indicates key terms that are described at length for the
    first time in a chapter. (Italics are also used for emphasis.)


    +   * A **monospaced font** indicates the contents of configuration files, messages
    displayed at a text-mode Linux shell prompt, filenames, textmode command names,
    and Internet URLs.


    +   *Italicized monospaced text* indicates a variable—information that differs
    from one system or command run to another, such as the name of a client computer
    or a process ID number.


    +   **Bold monospaced text** is information that you''re to type into the computer,
    usually at a Linux shell prompt. This text can also be italicized to indicate
    that you should substitute an appropriate value for your system. (When isolated
    on their own lines, commands are preceded by non-bold monospaced $ or # command
    prompts, denoting regular user or system administrator use, respectively.)


    In addition to these text conventions, which can apply to individual words or
    entire paragraphs, a few conventions highlight segments of text:


    > A note indicates information that''s useful or interesting but that''s somewhat
    peripheral to the main text. A note might be relevant to a small number of networks,
    for instance, or it may refer to an outdated feature.


    > A tip provides information that can save you time or frustration and that may
    not be entirely obvious. A tip might describe how to get around a limitation or
    how to use a feature to perform an unusual task.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '> Warnings describe potential pitfalls or dangers. If you fail to heed a warning,
    you may end up spending a lot of time recovering from a bug, or you may even end
    up restoring your entire system from scratch.


    # Exercise


    An exercise is a procedure you should try on your own computer to help you learn
    about the material in the chapter. Don''t limit yourself to the procedures described
    in the exercises, though! Try other commands and procedures to really learn about
    Linux.


    # Real World Scenario


    A real-world scenario is a type of sidebar that describes a task or example that''s
    particularly grounded in the real world. This may be a situation I or somebody
    I have encountered, or it may be advice on how to work around problems that are
    common in real, working Linux environments.


