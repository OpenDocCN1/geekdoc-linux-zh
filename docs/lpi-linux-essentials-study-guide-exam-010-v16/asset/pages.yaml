  md: '# CHAPTER 6

    Managing Hardware


    Objectives:


    +   - 4.2 Understanding Computer Hardware


    ![](img/e86102be5e9fa20bd171b445b743f27b_187_0.png)


    Although Linux is software, it relies on hardware to operate. The capabilities
    and limitations of your hardware will influence the capabilities and limitations
    of Linux running on that hardware. Therefore, you should know these features for
    any computer you use extensively or if you plan to buy.


    In this chapter, you''ll learn about and perform basic management tasks with your
    hardware. We begin with low-level issues, such as the nature of your central processing
    unit (CPU) and motherboard. Often overlooked, the power supply can cause problems
    if it''s undersized or misbehaves, so we cover that as well. Next, the chapter
    explores the various types of hard disks commonly found in both workstations and
    servers and discusses the care needed in their setup. After that, the chapter
    focuses on monitors and display drivers, a common sticking point in Linux. Today,
    most external devices attach via the Universal Serial Bus (USB), so this chapter
    explores those types of devices. Finally, this chapter covers the common issue
    of drivers, which are software components that control hardware devices.


    # Learning About Your CPU


    Your CPU (sometimes called the processor) is the “brain” of your computer—it does
    most of the computer''s actual computing. We''ve mentioned CPUs in earlier chapters
    in reference to distribution availability—to run on a given CPU, most software
    must be recompiled for that CPU. Thus,'
  merge: -1
  pgno: 187
- img_proc: true
  md: 'it''s important that you know enough about the different CPU families to know
    their strengths and weaknesses and to identify what type of your computer uses.


    > NOTE Many devices have more specialized computing circuitry. Notably, video
    cards include graphics processing units (GPUs) to do specialized graphics computations.


    # Understanding CPU Families


    CPU manufacturers tend to create products by making regular improvements to their
    products. Improvements range from minor (such as running the CPU at a faster clock
    rate, which is like running an engine at a faster speed) to moderate redesigns
    to improve speed (which is like shifting gears to get better speed) to radical
    designs (which are like using a bigger or more efficient engine, but one based
    on the original design). All types of changes remain within a single CPU family,
    so they can run the same code as their predecessors. Still more radical differences
    exist across CPU families; two CPUs from different families can typically not
    run each''s binary programs, although there are exceptions to this rule, including
    one very important one I describe.


    On desktop computers, two CPU families are common:


    **x86.** This CPU originated with Intel''s 8086 CPU, but the first model capable
    of running Linux was the 80386 (also known as the 386). Development continued
    with the 80486 (also known as the 486), the Pentium, and related Intel CPUs, such
    as the Celeron. AMD, Cyrix, VIA, and others have all released CPUs that are compatible
    with Intel''s designs.


    **x86-64.** Other names for this architecture include AMD64, x64, and EM64T. AMD
    created the x86-64 architecture as a 64-bit extension to the x86 architecture.
    Unusually, x86-64 CPUs can run the earlier 32-bit x86 code, but when in 64-bit
    mode, CPUs have access to additional features that improve speed. Intel has created
    its own x86-64 CPUs. Both Intel and AMD have used the same product line names
    for their x86-64 CPUs. This fact can make it hard to tell whether you''ve got
    a 32-bit x86 CPU or a 64-bit x86-64 CPU, at least based on the CPU''s marketing
    name.'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'For most desktop and laptop computers, you''ll commonly run into one of the
    Intel Core line of processors:


    +   - i3: The cheapest CPU, offers offers low-end speed and processing performance.


    +   - i5: The mid-range CPU, offers medium speed and processing performance as
    well as a medium-level price.


    +   - i7: The high-end CPU, offers advanced speeds and processing performance
    but at a higher price.


    # CPU Bit Depth


    CPUs process data in binary (base 2), meaning that numbers are represented using
    only two digits—0 and 1. CPUs have limits to the sizes of the numbers they can
    process, though, those limits are described in terms of the number of binary digits,
    or bits, the CPU can handle. A 32-bit CPU, for instance, can process numbers up
    to 32 binary digits. Expressed as positive integers, this means that numbers can
    range in size from 0 to 2³² - 1 (4,294,967,295) in the base 10 that people generally
    use. When dealing with larger numbers, the CPU must combine two or more numbers,
    which requires extra code.


    CPUs with large bit depths have an advantage when dealing with lots of memory,
    since memory addresses must fit into the CPU’s basic unit size. In particular,
    a 32-bit CPU has a 4-gibit (GiB) limit on memory—although some architectures,
    including x86, provide tricks to work around this limit. Greater bit depth does
    not improve speed except when dealing with very large numbers; however, the 64-bit
    x86-64 CPU architecture is faster than its 32-bit x86 predecessor for unrelated
    reasons.


    In addition to x86 and x86-64 CPUs, several other model lines are available. Most
    of these CPUs are used in embedded applications or in very high-end servers. Here
    are a few that you might encounter:


    ARM. The Advanced RISC Machine (ARM) processor was introduced in 1985 but has
    just recently taken off as the main processor in small devices, such as tablets
    and embedded computer systems. The RISC acronym in the name stands for Reduced
    Instruction Set Computing, which means it supports fewer instructions, which means
    less transistors are needed in the system, which in turn means less power consumption
    by the CPU chip. This feature'
  merge: -1
  pgno: 189
- img_proc: true
  md: 'is makes ARM processors ideal for small devices that .run Linux.


    PowerPC. This CPU, created as a cooperative effort of Apple, IBM, and Motorola,
    was Apple’s CPU of choice between 1994 and 2006, and is found in Mac computers
    of that vintage. Today, it’s used in some game consoles, embedded devices, and
    servers. Both 32- and 64-bit versions of this architecture are fairly available.
    PPC is a common abbreviation for this architecture.


    Itanium. Intel created the Itanium, or IA-64, architecture as a 64-bit replacement
    for the x86 line; however, it gained little market penetration in the server field.


    Linux can run on ARM, PowerPC, and Itanium, as well as on other CPU families,
    such as the Microprocessor without Interlocked Pipeline Stages (MIPS) and the
    Scalable Processor Architecture (SPARC); however, your choice of distribution
    is likely to be limited. Because software has to be recompiled and tested on new
    architectures, it takes effort to prepare a distribution for each architecture,
    and many distribution maintainers are unwilling or unable to expend this effort
    for more than x86 and x86-64.


    > The Debian Linux distribution is available on many architectures, so if you
    need to support Linux on a wide range of CPUs, using Debian can make sense.


    Many CPUs today are multicore models. These CPUs package the circuitry of two
    or more CPUs into one unit. When plugged into a motherboard, such CPU looks like
    multiple CPUs to the OS. The advantage is that Linux can run as many CPU-intensive
    programs as you have cores and they won’t slow each other down significantly by
    competing for CPU resources.


    > Some high-end motherboards also support multiple CPUs, so you can say, two 4-core
    CPUs to get the performance of a single 8-core CPU system.


    # Identifying Your CPU


    If you’ve got a working Linux system, you can learn a great deal about your'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'CPU by using three text-mode commands at the shell command prompt:\uname -a.
    Typing uname -a displays basic information on the kernel and the CPU. For instance,
    one of my systems returns x86_64 AMD Phenom (tm) II X3 700e Processor, among other
    things, indicating the manufacturer and model of the CPU.


    lscpu returns additional information about 20 lines of output. Much of this information
    is highly technical, such as the sizes of caches the CPU supports. Some of it
    is less technical, such as the architecture and the number of cores or threads
    supports.


    cat /proc/cpuinfo. The cat /proc/cpuinfo command returns more information compared
    to lscpu. Chances are won''t need this information yourself, but a developer or
    technician might want some of this information to help debug a problem.


    One to keep in mind is that modern x86-64 CPUs can run software compiled for the
    older x86 architecture. So, you might be running a 32-bit Linux distribution on
    a 64-bit CPU. The output of these commands can be confusing in such cases. For
    instance, here''s part of what lscpu shows on one system:


    ```

    Architecture:          i686

    CPU op-mode(s):       64-bit

    ```


    The line suggests an x86 CPU (i686 being a specific variant of architecture),
    but the CPU op-mode(s) line indicates that the CPU supports 64-bit operation.
    If you have trouble interpreting this output, you may be able to find something
    by looking up the CPU''s model on the manufacturer''s website. However, manufacturers
    tend to bury information in hard-to-read specification sheets, so be prepared
    to to read carefully.


    # Identifying Motherboard Capabilities


    If the CPU is the computer''s brain, the motherboard is the rest of the computer''s
    central nervous system. The motherboard is a large circuit board inside the computer.
    It''s dominated by a chipset, which is one or more chips that provide key functionality
    for thecomputer—they help the CPU interface with the hard disk interfaces, the
    USB interfaces, the network devices, and so'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'on. Some chipsets include video circuitry for video cards, although this functionality
    is sometimes separate, and sometimes it''s built into the CPU.


    > NOTE Motherboards are sometimes referred to as mainboards.


    In addition to the chipset, motherboards include plug-in interfaces for key components:


    +   - One or more slots for the computer’s CPU(s)

    - Slots for random access memory (RAM)

    - Slots for plug-in Peripheral Component Interconnect (PCI) or other cards

    - Connectors for internal hard disks, such as the Serial Advanced Technology Attachment
    (SATA) interface

    - Back-panel connectors that provide external interfaces for USB devices, keyboards,
    monitors, and so on

    - Connectors for additional external devices, such as front-panel USB plugs; devices
    are attached via short internal cables


    Some motherboards—typically used in larger desktop and server computers—have many
    connectors for many purposes. Such motherboards are highly expandable, but they’re
    physically large enough that they require bulky cases. Other motherboards are
    much smaller and can be used in compact computers, but such computers are not
    expandable. Laptop computers also have motherboards, which are necessarily of
    the small variety, with little opportunity for internal expansion.


    Most of the connectors on a motherboard are managed by its primary chipset. Some
    high-end boards provide connectors for features beyond those of its primary chipset.
    Such features require a secondary chipset, such as an extra Ethernet chipset for
    a second network port or an extra SATA chipset for faster hard disk interfaces.


    Whether the feature is provided by the main or by a secondary chipset, you can
    learn about most of the motherboard’s features with the lspci command, which shows
    information on PCI devices. The output looks something like this shortened example:


    ```

    $ lspci

    ```'
  merge: -1
