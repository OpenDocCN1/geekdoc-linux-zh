  md: '# Understanding Basic Open Source Principles


    Broadly speaking, software can be described as coming in several different forms,
    each with different expectations about payment, redistribution, and users'' rights.
    The number of categories varies depend on the depth of analysis and the prejudices
    of the person doing the categorization. As a starting point, however, four categories
    will do:


    **Commercial Software.** Individuals or companies develop commercial software
    with the intent to sell it for a profit. Developers generally keep the source
    code for commercial source software secret, which means that users can''t normally
    make changes to the software except to alter configuration settings that the software
    supports. In the past, commercial software was sold in stores or by mail order,
    but today''s often sold via downloads from the Internet. Redistributing commercial
    software is generally illegal. Microsoft Windows and Microsoft Office are both
    examples of commercial software.


    **Shareware Software.** From a legal perspective, *shareware* software is similar
    to commercial software in that it''s copyrighted and the author asks for payment.
    The difference is that shareware is distributed on the Internet or in other ways
    and “sold” on an honor system—if you use the software beyond a trial period, you''re
    expected to pay the author. Shareware was common in 1991 and is still available
    today, but it''s much rarer.


    **Freeware.** Freeware, like shareware, is available for free. Unlike shareware
    authors, though, the authors of freeware dont ask for payment. Sometimes, freeware
    is a stripped-down version of a more complete shareware or commercial program.
    At other times, the authors make it available for free to promote another product.
    Examples include Windows drivers for many hardware devices or the Adobe Reader
    program for reading Portable Document Format (PDF) files. As with commercial and
    shareware programs, freeware generally comes without source code.


    > *Freeware should not be confused with free software, which is closely related
    to open source software. Chapter 2, “Understanding Software Licensing,” describes
    free software in more detail.


    **Open Source Software.** Open source software is defined by a set of'
  merge: -1
  pgno: 101
- img_proc: true
  md: '10 principles, available at opensource.org/docs/osd. The most important of
    these principles are: The user has the right to redistribute the program, the
    source code must be made available, and the user has the right to make and distribute
    changed versions of the program. These principles mean that users can alter open
    source programs to suit their own needs, even in ways or for purposes not supported
    by the original author.


    Variants within each of these categories exist, as hybrids that don’t fit into
    any category. For instance, the Open Source Initiative maintains a list of licenses
    that it has approved as fulfilling its criteria (opensource.org/licenses); however,
    developers sometimes release software using obscure licenses or using that imposes
    conditions that run afresh of one of the more obscure Open Source Initiative rules.
    Such software is technically not open source, but it might be closer to open source
    than to another category.


    ![](img/e86102be5e9fa20bd171b445b743f27b_102_0.png)


    The basic idea behind open source software is that software developed in a transparent
    manner is likely to be superior to software developed in a closed manner. This
    superiority (and arguments against it) comes in several ways:


    **Better Code.** Exposing source code to the community at large means that it
    can be reviewed, judged, and improved by any interested party. Obscure bugs might
    be found and squashed when otherwise they might linger and cause problems in a
    closed-source product. The validity of this claim is not well supported by research,
    and smaller projects might not gain much in the way of interest from other programmers,
    they might not benefit from outside code review.


    **More Flexibility.** By providing users with the source code, an open source
    project allows users to customize the software for their own needs. If users submit
    changes back to those individuals who maintain the software or release them as
    a new branch of the project, then everybody can benefit from such changes. Of
    course, critics would argue that this flexibility is only a benefit to those with
    the necessary skill and time to make such changes or to those with the money to
    hire somebody to do it.


    **Lower Cost.** Although the open source definition does not forbid the sale of
    software, the redistribution requirements mean that open source software'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'ends being available free of charge. If you want support, though, you may need
    to purchase a support contract, which can reduce or eliminate the cost benefits.


    **Lack of Vendor Lock-In.** The developers of some proprietary products, and particularly
    very popular ones, can make it difficult for competing products by using proprietary
    file formats or standards and by not supporting open standards. Open source tools
    are less subject to such problems, since they can be modified to support open
    standards, even if they don’t initially do. As a practical matter, though, even
    proprietary file formats and protocols are usually reverse-engineered, vendor
    lock-in ends up being a temporary problem rather than a permanent one.


    Of course, within the Linux community the general consensus is that each of these
    factors is a real point in favor of Linux and open source software in general;
    the downsides noted are generally regarded as minor when compared to the advantages.
    In the end, you’ll need to make up your own mind on matters after using different
    types of software.


    # Linux as a Software Integrator


    Soon after Unix was created, the OS fragmented into a set of loosely affiliated
    OSs. These OSs were incompatible on the binary level but more or less compatible
    on the source code level. This is still true today. You can take the same program
    and compile it for FreeBSD, macOS, and Linux, and it will work the same on all
    three platforms—but the compiled binaries for one platform won’t work on the others.


    There are exceptions to this rule. Some programs rely on features that are available
    on just Unix-like OSs. Others have quirks that make it impossible to compile them
    on some OSs. If a program falls into dispute, it may become unusable on newer
    OSs because it relies on compiler or OS features that have changed. Such problems
    tend to be ironed out over time, but they do crop up periodically.


    Because of Linux’s popularity, most open source Unix programs compile and work
    fine on Linux. Commercial programs for Linux also exist, although most of these
    are obscure or specialized. In any event, Linux has become an OS that most open
    source Unix programs must support. This is so strong that many projects now target
    Linux as the primary platform.'
  merge: -1
  pgno: 103
- img_proc: true
  md: '# Understanding OS Roles


    Computers fill many roles in the world, and as computers have become more common
    and less expensive, those roles have multiplied. Linux can serve as the OS for
    most of these roles, each of which draws on its own subset of support utilities.
    Some of these roles also require tweaking the kernel itself. We briefly describe
    three of these roles: embedded computers, desktop and laptop computers, and server
    computers.


    # Looking At Embedded Computers


    As noted in Chapter 1, embedded computers are specialized devices that fulfill
    a specific purpose. Examples include:


    **Mobile Phones.** Modern mobile phones use computers with OSs that range from
    simple to complex. Linux powers some of these mobile phones, usually in the form
    of the Android OS.


    > NOTE: Apple, Microsoft, and other vendors provide their own OSs for mobile phones.


    **E-book Readers.** These devices, like mobile phones, are specialized computers
    and use an OS to power them. For many current e-book readers—either a custom Linux
    version or Android.


    **IoT Monitors.** The Internet of Things (IoT) consists of small embedded systems
    that monitor physical conditions, such as temperature, humidity, light, or motion,
    and use that data to control motors, switches, cameras, and other devices.


    **DVRs.** Digital video recorders (DVRs), which record TV shows for later viewing,
    are computers with specialized software. Some of these, including the popular
    TiVo models, run Linux.


    > NOTE: The MyTTV package (mythtv.org) can turn an ordinary PC into a Linux-based
    DVR, although you''ll need a TV tuner and other specific hardware to make it work.'
  merge: -1
