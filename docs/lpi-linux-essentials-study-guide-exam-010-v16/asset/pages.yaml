- img_proc: true
  md: '# Real World Scenario


    # The Legalities of Acquiring root Privileges


    If your Linux system is in the workplace, it is important to determine your company’s
    policies concerning acquiring root privileges. Logging directly into the root
    account or using the su command to obtain root privileges sets up what is called
    a repudiation environment. In this environment, a person can deny actions; in
    this case, the person can deny that they logged in as root. This environment could
    allow a root account to perform illegal or troublemaking activity and then legally
    deny being responsible for that activity. This is a potentially dangerous situation.


    Many companies have (or should have) a policy that insists the sudo command is
    used for anyone needing to acquire root privileges. The sudo command tracks and
    logs a user’s activity and therefore sets up what is called a nonudiation environment
    in which actions cannot be legally denied.


    Modern distributions do not let you log into the root account. However, if you
    can acquire root privileges by logging directly as root or by using su-, your
    shell prompt will change:


    ```

    [rey@jakku ~]$ su -

    ```


    ```

    Password:

    [root@jakku ~]#

    ```


    > It’s a good idea to always use su-, instead of just the su command. The dash
    (-) sets up the user account environment correctly. If you don’t use the dash,
    you may experience command problems.


    In this example, the username has changed from rey to a dollar sign ($) to a hash
    mark (#). Because just the last prompt character was used for most examples printed
    on their own lines in this book, such examples implicitly specify whether a command
    requires root privileges by the prompt used. For instance, consider accessing
    the /etc/shadow file mentioned earlier:'
  merge: -1
