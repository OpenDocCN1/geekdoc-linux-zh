  md: '| --gid default-group | -g | Sets the name or GID of the user''s default group.
    The default for this value is a new group named after the user. |

    | --groups group[...] | -G | Sets the names or GIDs of groups to which the user
    belongs—more than one may be specified by separating them with commas. |

    | --login username | -l | Changes the account''s username to the specified value.
    |

    | --lock | -L | Locks the account''s password, preventing logins. |

    | --move-home | -m | When this option is included with --home (-d), usermod moves
    the user''s existing home directory to the new location. |

    | --shell shell | -s | Sets the name of the user''s default shell with this option.
    |

    | --uid UID | -u | Changes the account''s UID number to the specified value. |

    | --unlock | -U | Unlocks a locked account password. |


    For example, consider the following use of usermod:


    ```

    $ sudo usermod -u 1072 -m -d /home2/hwash hwash

    ```


    This command makes three changes to the hwash account:


    +   - It changes the UID value to 1072.

    - It changes the account''s home directory to /home2/hwash.

    - It moves the contents of the account''s original home directory to its new location.


    You might issue a command like this one if you were migrating user accounts to
    an NFS server mounted at /home2. Such a change might require a new home directory
    location and a change in the UID value to match the one used on the NFS server.'
