  md: '# CHAPTER 11

    Creating Scripts


    Objective:


    +   - 3.3-3 Turning Commands into a Script


    ![](img/e86102be5e9fa20bd171b445b743f27b_328_0.png)


    A *script* is a program written in an interpreted language, typically associated
    with a shell or other program whose primary purpose is something other than as
    an interpreted language. In Linux, many shell scripts, which are associated with
    Bash or another shell. (If you''re familiar with *batch files* in DOS or Windows,
    scripts serve a similar purpose.) You can write shell scripts to help automate
    tedious tasks or to perform new and complex tasks. Many of Linux''s startup functions
    are performed by scripts, so mastering scripting will help you manage the startup
    process.


    This chapter covers Bash shell scripts, beginning with the task of creating a
    new script file. It then describes several important scripting features that you
    to perform progressively more complex scripting tasks.


    > Like any programming task, shell scripting can be quite complex. Consequently,
    this chapter barely scratches the surface of what you can accomplish through shell
    scripting. Consult a book on the topic, such as our *Linux Command Line and Shell
    Scripting Bible, Third Edition* (Wiley, 2015), for more information.


    # Beginning a Shell Script


    Shell scripts are plain-text files, so you create them in text editors'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'such as vi, nano, pico, as described in Chapter 10, "Editing Files." You shouldn''t
    use standard word processing programs, such as LibreOffice Writer, to create shell
    scripts by default they embed binary code into the final document to indent fonts,
    font sizes, and special characters. These binary codes confuse the Linux shell.


    A shell script begins with a line that identifies the shell that''s used to run
    it, such as the following:


    ```

    #!/bin/bash

    ```


    The first two characters are a special code that tells the Linux kernel that is
    a script and use the rest of the line as a pathname to the program that interprets
    the script. (This line is sometimes called the shebang, hashbang, haspling, or
    pound bang.) Shell scripting languages use a hash mark (#) as a comment character,
    the script utility ignores this line, although the kernel doesn''t. On most systems,/bin/sh
    is a symbolic link that points to /bin/bash, but it can point to some other shell.
    Specifying the script using /bin/sh guarantees that any Linux system will have
    a shell program to run the script, but if the script uses any features specific
    to a particular shell, you should specify that shell instead—for instance, use
    /bin/bash or /bin/tcsh instead of /bin/sh.


    ![](img/e86102be5e9fa20bd171b445b743f27b_329_0.png)


    When you''re writing the shell script, you should modify it so that''s executable.
    You do this with the chmod command, which is described in detail in Chapter 14,
    "Setting Ownership and Permissions." For now, know that you use the a+x option
    to add execute permissions for all users. For instance, to make a file my-script
    executable, you issue the following command:


    ```

    $ chmod a+x my-script

    ```


    You''ll be able to execute the script by typing its name, possibly preceded by
    ./ to tell Linux to run the script in the current directory rather than searching
    the current path. If you fail to make the script executable, you can'
  merge: -1
