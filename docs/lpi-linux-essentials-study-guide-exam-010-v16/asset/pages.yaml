    # Getting Help Using Info Pages


    The man page system is typical on Unix-like OSs, including Linux, and it''s also
    quite old and is therefore limited. A newer documentation system, known as info
    pages, is also available. The next few pages describe how info pages fill gaps
    in the man system and how to use info pages.


    # Understanding the Purpose of Info Pages


    The basic design of man pages dates decades, so it predates some important developments
    in managing information. Most notably, man pages are not hyperlinked. Although
    a See Also section is common in man pages, you can select one of these items to
    read the relevant man page directly; you must quit the man system and type a new
    man command to read the new page. This lack of hyperlinking also makes navigating
    through a large man page awkward. You can use searches to locate information that
    you desire, but these often find the wrong text—or if you mistype a string, your
    search might fail completely.


    The goal of info pages is to overcome these problems by supporting hyperlinking.
    Each page is known as a node, and the info page system as a whole is an interrelated
    set of nodes, similar to the World Wide Web (WWW) of the Internet. An individual
    program''s documentation may be split across multiple nodes, which can make each
    node easier to locate and search—but if you need to search for information and
    you''re not sure in which node it resides, you may need to search multiple nodes.


    Nodes are organized on levels, which are similar to the levels of organization
    in a book. This book, for instance, has chapters and two levels of headings within
    each chapter. Similarly, the info page for a program is likely to have'
