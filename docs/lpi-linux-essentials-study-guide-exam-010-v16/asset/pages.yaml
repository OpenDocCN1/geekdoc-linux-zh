  md: 'Unix was created in 1969 at AT&T''s Bell Labs. Unix''s history is complex and
    involves multiple forks (that is, splitting of the code into two or more independent
    projects) and even entirely separate code rewrites. Modern Linux systems are,
    by and, the product of open source projects that clone Unix programs, or of original
    open source code projects for Unix generally.


    Open source software is software that you can not only run, modify and redistribute
    yourself. Chapter 3, “Investigating Linux’s Principles and Philosophy,” covers
    the philosophy and legal issues concerning open source software.


    These projects include:


    **The Linux Kernel.** Linus Torvalds created the Linux kernel as a hobby programming
    project in 1991, but it soon grew to be more than that. The Linux kernel was designed
    to be compatible with other Unix kernels in the sense that it used the same software
    interfaces in source code. This made using open source programs for other Unix
    versions with the Linux kernel easy.


    **The GNU Project.** The GNU’s Not Unix (GNU) project is an effort by the Free
    Software Foundation (FSF) to develop open source replacements for all the core
    elements of a Unix OS. In 1991, the FSF had already released the most important
    tools, with the notable exception of the kernel. (The GNU HURD kernel is now available
    but is not as popular as the Linux kernel.) Alternatives to the GNU tools include
    proprietary commercial tools and open source tools developed for the BSD Unix
    variants. The tools used on a Unix-like OS can influence its overall “flavor,”
    but all of these tool sets are similar to give any Unix variety a similar feel
    compared to a non-Unix OS.


    > GNU is an example of a recursive acronym—an acronym whose expansion includes
    the acronym itself. This is an example of geek humor.


    **Xorg-X11.** The X Window System is the GUI environment for most Unix OSs. Most
    Linux distributions today use the Xorg-X11 variety of X. As with we'
