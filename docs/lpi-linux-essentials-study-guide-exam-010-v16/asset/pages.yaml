    # Using Log Files


    Many programs that run in the background (that is, daemons) write information
    about their normal operations to log_files, which are files that record such notes.
    Consulting log files can therefore be an important part of diagnosing problems
    with daemons. The first step in doing this is to locate your log files. In some
    cases, you may need to tell the program to produce verbose output to track down
    the problem, this section provides some pointers on how to do. This section also
    describes the kernel ring buffer, which isn''t technically a log file but can
    fill a similar role for kernel information.


    # Locating Log Files


    Certification Linux stores most log files in the /var/log directory tree. Some
    log files reside in that directory, but some servers create entire subdirectories
    to store their own log files. Table 9.2 summarizes some common log files on many
    Linux systems. In addition, many server programs not described in this book add
    their own log files or subdirectories of /.var/log. If you experience problems
    with such a server, checking its log files can be a good place to start troubleshooting.


    > Log file details vary between distributions, some of the files in Table 9.2
    may not be present on your system, or the files you find may have different names.'
