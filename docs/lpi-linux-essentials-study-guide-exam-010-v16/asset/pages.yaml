  md: '# CHAPTER 8


    # Searching, Extracting, and Archiving Data


    Objectives:


    +   - 3.1 Archiving Files on the Command Line


    +   - 3.2 Searching and Extracting Data from Files


    ![](img/e86102be5e9fa20bd171b445b743f27b_246_0.png)


    An important part of any OS''s job, including Linux, is the storage, management,
    and analysis of data. Data is valuable because of the knowledge that can be gleaned
    from it, so you need to be able to search and extract properly, as well as protect
    it. This chapter covers some of the tools you can use to search, extract, and
    archive data.


    The chapter begins with a look at regular expressions, which are a way to describe
    patterns that you might want to look for in data files. You can use regular expressions
    with many commands, two of which find and grep are described in more detail. This
    chapter also covers tools that you can use to redirect programs'' input and output,
    which is a useful trick in many situations. Finally, tools for creating archive
    files are described, which can be useful in transferring many files over a network
    or in creating backups.


    # Using Regular Expressions


    Many Linux programs employ regular expressions, which are tools for expressing
    patterns in text. Regular expressions are similar in principle to the wildcards
    that can be used to specify multiple filenames, as described in Chapter 7, “Managing
    Files.” At their simplest, regular expressions can be plain text without adornment,
    although certain characters are used to denote patterns.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '> > Documentation sometimes uses the abbreviation regexp to refer to a regular
    expression.


    Two forms of regular expression are common: basic and extended. The form that
    you must use depends on the program. Some accept just one expression form, whereas
    others use either type (depending on the options passed to the program). The differences
    between basic and extended regular expression forms can be complex and subtle,
    but the fundamental principles of both are similar.


    The simplest type of regular expression is an alphabetic or alphanumeric string,
    such as HWaddr or Linux3. These regular expressions match any string of the same
    size or longer that contains the regular expression. For instance, the HWaddr
    regular expression matches HWaddr, This is the HWaddr, and The HWaddr is unknown.
    The real strength of regular expressions comes in the use of nonalphanumeric characters,
    which activate advanced matching rules.


    The most powerful basic regular expression features include the following:


    **Bracket Expressions.** Characters enclosed in square brackets ([]) bracket expressions,
    which match any one character within the brackets. For instance, the regular expression
    b[aeiou] matches the words bag, beg, big, bog, and bug. The brackets represent
    a single character in the word. Thus, the regular expression p[aijn] matches pan
    and pin but not pain. Including a caret (^) after the opening square bracket matches
    against any character except the ones specified. For instance, b[aeiou]g matches
    bbg or bag not or beg.


    **Range Expressions.** A range expression is a variant in a bracket expression.
    Instead of listing every character that matches, range expressions list the start
    and end points separated by a dash (-), as in a[2-4]z. This regular expression
    matches a2z, a3z, and a4z.


    **Any Single Character.** The dot (.) represents any single character except a
    newline. For instance, a.z matches a2z, abz, aQz, or any other three-character
    string that begins with a and ends with z.'
