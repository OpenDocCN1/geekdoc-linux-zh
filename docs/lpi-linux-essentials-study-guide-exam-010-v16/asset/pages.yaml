    password or display a warning message if it deems the password to be too weak.
    Notice in the preceding example that the sudo command is used, indicating that
    the person changing the hwash account’s password has access to super user privileges,
    which are required to complete this command successfully.


    > In addition to setting passwords, the passwd utility enables you to adjust password
    expiration and aging options. Consult its man page for details.


    You can handle most other account modifications by using the usermod program.
    This command works much like useradd, but instead of creating a new account, it
    modifies an existing one. Many usermod options are identical to useradd options.
    Table 13.2 summarizes the most important usermod options.


    # Table 13.2 Options for usermod


    | Option | Option abbreviation | Effect |

    | --- | --- | --- |

    | --append | -a | Used with --groups (-G), causes the specified groups to be added
    to (rather replaced) the existing set of groups for the user. |

    | --comment comment | -c | Specifies the comment field for the user. (GUI tools
    generally describe this as the “full name.") |

    | --home home-dir | -d | Specifies the account’s home directory. It defaults to
    /home/username. |

    | --expiredate .expire-date | -e | Sets the date on which the account will be
    disabled, expressed in the form YYYY-MM-DD. The default is for an account that
    does not expire. |

    | --inactive .inactive-days | -f | Sets the number of days after a password expires,
    after which the account becomes completely disabled. A value of -1 disables the
    feature and is the default |'
  merge: -1
