    affecting it as well as the link. Some programs, though, rename the original file
    and then write a new file with the changes. If a program does this and you''ve
    accessed the file via a link, the linked-to file will be unaffected by your changes.
    If in doubt, test your program to be sure that it does what you expect.


    If you want to create a link to a directory, be aware that you can normally do
    this via symbolic links. Hard links between directories are potentially dangerous
    in terms of low-level filesystem data structures, as the ln utility permits only
    the superuser to create such links. Even then, most filesystems disallow hard
    links between directories, so in practice root usually can''t create them. Any
    user can create symbolic links to a directory, though.


    Linux installations make use of links (mostly symbolic links) in various places.
    For instance, system startup scripts are often referred to via symbolic links
    located in directories dedicated to specific startup conditions, known as runlevels.
    Runlevel management is beyond the scope of this book.


