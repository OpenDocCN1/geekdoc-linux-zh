    # Deleting Accounts


    Deleting accounts can sometimes be as important as adding or modifying them. Unused
    accounts can be abused, either by their former owners or by others who might be
    able to break into an account if it has a weak password. Therefore, you should
    routinely delete unused accounts. Before you do so, though, you should understand
    what happens when you delete an account and decide precisely how to do it, lest
    you create problems by deleting an account in an inappropriate way. With that
    knowledge in hand, you can delete accounts by using either GUI or text-mode tools.


    # Avoiding Deletion Pitfalls


    Deleting an account may sound simple enough, but a mistake can cause problems,
    either immediately or in the future. In addition to obvious issues such as accidentally
    deleting the wrong account, consider these two factors:


    **User File Preservation.** Users’ files may be extremely valuable, either to
    the users themselves or to the organization that owns the computer. You should
    check your company’s file retention policies when considering whether to delete
    the user’s home directory or do something with it, as it moves into another user’s
    home directory and change permissions on the files it contains. The same is true
    of the user’s mail queue (normally stored in `/var/spool/mail/username`, where
    `username` is the account''s username).


    > Consider archiving a deleted account’s home directory to a long-term backup
    medium. This strategy will enable you to recover the files should they become
    valuable in the future.'
  merge: -1
  pgno: 395
- img_proc: true
  md: 'UID and GID Reuse. When an account is deleted, the account''s UID and GID become
    available for reuse. In many cases, these numbers will not be reused, since most
    Linux distributions assign these values based on the highest current value. If
    you delete any but the highest-numbered current user, the user''s old UID and
    GID numbers will be reused unless intervening accounts are also deleted. Nonetheless,
    if a UID is reused, any files previously owned by the old user will suddenly appear
    to be owned by the new user. This may not cause any problems, but it may cause
    confusion about who created the files. In some cases, it can cause suspicion of
    wrongdoing by the new user (if the old files contain information the new user
    shouldn''t have, or if the files reside in directories to which the new user shouldn''t
    have access).


    To avoid any chance of confusion or misbehavior claims failing on new users due
    to UID or GID reuse, you can use the find command (covered in Chapter 8, “Searching,
    Extracting, and Archiving Data") to locate all files with particular UID or GID
    values. You must use the -uid and -gid options, as shown here:


    ```

    $ sudo find / -uid 1004

    ```


    While you can issue this command without using super user privileges, it will
    return errors and may miss some files. Therefore, it''s best to use find in this
    manner with super user privileges.


    Our previous example find all files on the computer with a UID of 1004. (Searching
    on a GID works the same way but using the gid option.) You can reassign ownership
    of these files using the chmod command (covered in Chapter 14) or delete them.
    Ordinarily, you''d use this command only after deleting or reassigning the user''s
    home directory, since that directory will probably contain far too matching files.


    # Deleting Accounts Using GUI Tools


    As with other account management tasks, using a GUI is fairly intuitive, but details
    vary from one distribution to another. As an example, to delete an account from
    Linux Mint''s User and Groups administration utility, after you have the utility
    open, click the account and click the Delete button. The result is a confirmation
    dialog similar to the one shown in Figure 13.6. If you''re certain of the action,
    click the Yes button. The account will be immediately deleted.'
