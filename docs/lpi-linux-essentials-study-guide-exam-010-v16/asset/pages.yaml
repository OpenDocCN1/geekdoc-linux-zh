    # Examining the Kernel Ring Buffer


    The kernel ring buffer is something like a log file for the kernel; however, unlike
    other log files, it’s stored in memory rather than in a disk file. Like regular
    log files, its contents continue to change as the computer runs. To examine the
    kernel ring buffer, you can type dmesg. Doing so creates copious output, though,
    so you’ll typically pipe the output through less:


    > Because the kernel ring buffer has a limited size, its earliest entries can
    be lost if the computer runs for a long time or if something produces many entries.


    ```

    $ dmesg | less

    ```


    Alternatively, if you know that the information you want to be associated with
    a particular string, you can use grep to search for it. For instance, to find
    kernel ring buffer messages about the first hard disk, /dev/sda, you might type
    the following:


    ```

    $ dmesg | grep sda

    ```


    Kernel ring buffer messages can be particularly arcane; however, they can also
    be invaluable in diagnosing hardware and driver problems, since it’s the kernel’s
    job to interface with hardware. You might try searching the kernel ring buffer
    if a hardware device is behaving strangely. Even if you don’t understand a message
    you find, you could try feeding that message into a web search engine or passing
