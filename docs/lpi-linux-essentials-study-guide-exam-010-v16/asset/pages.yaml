    # Using Compression


    In Linux, the `gzip`, `bzip2`, and `xz` programs all compress individual

    files. For instance, you might compress a large graphics file like this:


    ```

    $ xz biggraphics.tiff

    ```


    The result is a file with a name like the original but with a new filename

    extension to a compressed format. In this specific case, the

    result would be `biggraphics.tiff.xz`.


    Most graphics programs won’t read files compressed in this way. Thus, to use,

    a file that’s compressed, you must uncompress it with a matching

    program. To uncompress the `biggraphics.tiff.xz` file compressed in the

    previous example, use this command:


    ```

