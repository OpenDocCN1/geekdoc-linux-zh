    # Linux in the Cloud


    Cloud technology has greatly changed the landscape of the computer world. Moving
    computer resources and applications to a shared network environment changes how
    many companies do business and provide services to customers. Linux plays an important
    role in the cloud world, so it''s a good idea to define just what a cloud is and
    what type of resources it provides. This section covers the basics of cloud computing.


    # What Is Cloud Computing?


    The first mention of the *term cloud* came in documentation for the original ARPANET
    network environment in 1977, the precursor to the modern-day Internet. In that
    documentation, the cloud symbol was commonly used to represent the large network
    of interconnected servers geographically dispersed. However, in this environment
    each server was self-contained and self-sufficient—there was no distributed computing.


    The term *cloud computing* is related to distributed computing. In distributed
    computing, resources are shared among two or more servers to accomplish a single
    task, as run an application. This environment became the precursor to what we
    now know as cloud computing, popularized by companies such as Amazon Web Services
    (AWS), Google Cloud Platform, and Microsoft Azure.


    Cloud computing provides the ability to deliver computing resources across the
    Internet. Now customers can purchase both hardware and software resources as needed
    from cloud computing vendors. This includes servers, storage space, databases,
    networks, operating systems, and even individual applications. Figure 1.4 demonstrates
    the three methods for providing cloud computing services.'
