  md: '# Certification Objective


    # Real World Scenario

    Patents, Trademarks, and Software


    Copyright is one example of intellectual property, but there are many others.
    One of these is *patents*. A copyright protects a single creative work, which
    can be considered an expression of an idea, but a patent protects the *idea* itself.
    Patents typically apply to inventions, such as the proverbial "better mousetrap."


    In the United States, software patents are legal. Although you can''t patent an
    entire program, you can patent the algorithms that the program uses. Such patents
    are both common and controversial. Some open source programs do not use certain
    file formats because the algorithms required to use them are patented and the
    patent-holders have threatened to sue unauthorized users. Critics of software
    patents contend that most patents are trivial or obvious—two things that a patented
    invention must not. Companies sometimes use software patents as a way to block
    another company from selling a product, or to demand payment from a company that
    sells a product.


    In many other countries, software algorithms cannot be patented. Efforts are underway
    to change the relationships between software and patents—both to make software
    patentable in countries where it is not and to restrict or eliminate software
    patents in countries where software can be currently patented.


    Trademarks are another type of intellectual property. These are names, logos,
    and similar identifiers of a specific company or product. Software and the companies
