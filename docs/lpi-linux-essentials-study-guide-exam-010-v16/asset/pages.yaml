    # Modifying Accounts


    As you have learned, when creating an account you can specify many options that
    affect accounts, such as giving an account a specific UID number. Sometimes, though,
    it''s necessary to change account options after an account has been created. Fortunately,
    Linux provides both GUI and text-mode tools to help you do this. Before delving
    into operational details of these tools, though, you should understand when you
    might want to make changes to accounts and how to check whether a user is currently
    logged in.


    # Deciding When to Modify Accounts


    In an ideal world, you will create accounts perfectly every time; however sometimes
    this isn''t possible. You might lack information that is necessary to create a
    flawlessly tuned account (such as the length of time an employee will be with
    a company), or your needs might change after the account has been created. Some
    common causes of account changes include (but are by'
  merge: -1
