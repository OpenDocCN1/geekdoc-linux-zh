    # Using wc


    A file''s size in bytes, as revealed by ls or searched for using find, can be
    a useful metric. This size value isn''t the most useful one for text files, though
    you might need to know how many words or lines are in a text file—say, because
    you want to know how many pages a text document will consume when printed at 52
    lines per page. The wc utility provides this information. For instance, to discover
    the information for a newly created file named newfile.txt in your present working
    directory:


    ```

    $ wc newfile.txt

    ```


    ```

    37 59 1990 newfile.txt

    ```


    This output reveals that the file newfile.txt contains 37 lines, 59 words, and
    1990 bytes. wc displays a count of lines, words, and bytes for each file you pass
    to it.


