    # Exam Essentials


    **Describe how to reach the command line.** Most Linux distributions have default
    GUI programs that allow you to reach the command line. Some distributions let
    you open a terminal application with the GUI by pressing Ctrl+Alt+T, others have
    icons on their desktop or terminal application names within their menu system.
    To reach a virtual terminal, which is not within the desktop environment, press
    Ctrl+Alt+Fn (where Fn is a key typically between F2 and F6), and log in to reach
    the command line. The command-line prompt is provided by the shell and ends in
    a dollar sign ($) for regular users or a hash mark (#) for the root user.


    **Explain how to run programs at the command line.** If an executable program
    resides in a PATH directory, you can run it by typing its name, along with any
    needed options or required arguments. And if the program is not located in a PATH
    directory, you must run it by entering its directory location as well as its name
    and any needed options or required arguments.


    **Outline using basic shell features.** Command completion speeds your way through
    the typing of commands or filenames. To use command completion, you type part
    of a command or filename, and then press the Tab key. As long as there is only
    one file or command whose name begins with what you typed, the Bash shell will
