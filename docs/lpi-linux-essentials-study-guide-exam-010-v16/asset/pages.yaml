  md: 'Directories are just special files—they''re files that hold other files. This
    means you can use most of the file manipulation tools described elsewhere in this
    chapter to manipulate directories. There are some caveats, though:


    +   - You can use touch to update a directory''s time stamps, but you can''t use
    touch to create a directory; mkdir handles that task.


    +   - You can use cp to copy a directory; however, you must use the -r, -R, recursive,
    -a, or --archive option to copy the directory and all its contents.


    +   - You can use mv to move or rename a directory.


    +   - You can use ln with its -s option to create a symbolic link to a directory.
    No common Linux filesystem supports hard links to directories.


    As an example, suppose that you have a directory in your home directory called
    Music/Satchmo, which contains Louis Armstrong music files. You want to reorganize
    this directory so that the files appear under the performer''s last name, but
    you want to retain access to the files under the name Satchmo, since your music
    players refer to them this way. You could type the following commands to achieve
    this goal:


    ```

    $ cd ~/Music

    ```


    ```

    $ mv Satchmo Armstrong

    ```


    ```

    $ ln -s Armstrong Satchmo

    ```


    Alternatively, you could omit the first command and specify the complete path
    to each of the directories or links in the mv and ln commands. As written, the
    first two of these commands rename the ~/Music/Satchmo directory to ~/Music/Armstrong.
    The final command creates a symbolic link, ~/Music/Satchmo, that points to ~/Music/Armstrong.


