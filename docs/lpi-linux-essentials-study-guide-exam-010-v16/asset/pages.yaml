    # Using Wildcards


    A wildcard is a symbol or set of symbols that stands for other characters. You
    can use wildcards to refer to files.(Using wildcards is also sometimes called
    globbing.) Three classes of wildcards are common in Linux:


    ? A question mark (?) stands in a single character. For instance, b??k matches
    book, balk, buck, or any other four-character filename that begins with b and
    ends with k.


    +   * An asterisk (*) matches any character or set of characters, including no
    character. For instance, b*k matches book, balk, and buck just does as b**k. b*k
    also matches bk, bbk, and backtrack.


    Bracketed Values. Characters enclosed in square brackets ([]) normally match any
    character within the set. For instance, b[ao][lo] matches balk and not buck. You
    can also specify a range of values; for instance, b[a-z] matches back, buck, and
    other four-letter filenames of this form whose second character is a lowercase
    letter. This differs from b?-because Linux treats filenames in a case-sensitive
    way and because ? matches any character (not just any letter), b[a-z] doesn’t
    match bAck or b3ck, although b??ck matches both of these filenames.


