- img_proc: true
  md: '> A newline is a hidden special character used in text files. When a text file
    is displayed, a newline character on the end of each line is often what is causing
    each line to display below the previous line.


    **Start and End of Line.** A line (sometimes called a record) consists of all
    the characters before the line is terminated with a newline. When not used inside
    brackets, the caret (^) represents the start of a line. The dollar sign ($) denotes
    the end of a line. For instance, ^bag matches bag only if it is first in a line
    of characters, whereas$ matches bag only if it is last in a line of characters.


    **Repetition.** A full or partial regular expression may be followed by a special
    symbol to denote repetition of the matched item. Specifically, an asterisk (*)
    denotes zero or more matches. The asterisk is often combined with the dot (.*)
    to specify a match with substring. For instance, *Lincoln matches any string that
    contains A and Lincoln, in that order—Abe Lincoln Abraham Lincoln are just possible
    matches.


    **Escaping.** If you want to match one of the special characters, such as a dot,
    you must escape it—that is, precede it with a backslash (\). For instance, to
    match a computer hostname (say, www.sysex.com), you must escape the dots, as in
    www\.sysex\.com.


    Extended regular expressions add more features that you can use to match in additional
    ways:


    **Additional Repetition Operators.** Other repetition operators work like an asterisk,
    but they match only certain numbers of matches. Specifically, a sign (+) matches
    one or more occurrences, and a question mark (?) specifies zero or one match.


    **Multiple Strings.** The vertical bar (|) separates possible matches; for instance,
    car|truck matches either car or truck.


    **Parentheses.** Ordinary parentheses (()) surround subexpressions. Parentheses
    are often used to specify how to apply operators; for example, you can put parentheses
    around a group of words that are concatenated with the vertical bar to ensure
    the words are treated as a group, any one of which may match, without involving
    surrounding parts of the regular expression.'
