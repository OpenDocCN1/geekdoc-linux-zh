    The tar program provides explicit support for all three of these compression standards,
    and tarballs often have their own unique filename extensions that indicate the
    compression used:


    > > Sometimes two extensions are used on a tarball file, resulting in a filename
    such as my-work.tar.bz2.


    +   - .tgz for tarballs compressed with gzip

    - .tbz or.tb2 or.tb2 for tarballs compressed with bzip2

    - .txz for tarballs compressed with xz


    When you use compression to create a tarball (using the z, j, or J option to tar),
    the compression program works on the entire tarball with all of its files rather
    than individually compressing each file within the tarball. This can improve the
    compression ratio compared to compressing individual files and then bundling them
    together. However, it makes harder to extract data from a file if it becomes damaged.'
