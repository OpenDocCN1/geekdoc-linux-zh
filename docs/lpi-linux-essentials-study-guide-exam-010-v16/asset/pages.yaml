    # Measuring Memory Use


    Processes consume a number of system resources, the most important of these being
    CPU time and memory. As already noted, top sorts your processes by CPU time by
    default, so you can identify processes that are consuming the most CPU time. You
    can press the M key within top to have it sort by memory, thus identifying the
    processes that are consuming the most memory. As with CPU time, you can''t say
    that a process is consuming too much memory simply because it is at the top of
    the list; some programs legitimately consume a great deal of memory. Nonetheless,
    sometimes a program consumes too much memory, either because of inefficient coding
    or because of a memory leak—a type of bug in which the program requests memory
    from the kernel and fails to return when it''s done with the memory. A program
    with a memory leak consumes increasing amount of memory, sometimes to the point
    where it interferes with other programs. As a short-term solution, you can usually
    terminate the program and launch it again, which resets the program''s consumption,
    something like draining a sink that''s filled with water from a leaky faucet.
    The problem will recur, but if the memory leak is small enough, you''ll at least
    be able to get useful work done in the meantime.'
