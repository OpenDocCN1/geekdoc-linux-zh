  md: '# Real World Scenario

    Administrator Shell Scripts


    The job of a Linux administrator can be somewhat tedious at times. There are lots
    of different log files the administrator must check daily to ensure things are
    running properly and that no security breaches have occurred on the system. That
    task can take quite long time to accomplish. However, many Linux administrators
    use scripts to help take some of the tediousness of examining pages of log.


    Instead of manually looking through logs, administrators write scripts that use
    Linux text processing tools, such as grep and cut, to search the log files for
    errors and warnings, copy those errors and warnings to a separate text file, and
    then email the resulting file to themselves. They then schedule the scripts to
    run each evening so they have a summary of any system issues first thing in the
    morning when they arrive at work. Then they can focus their energy on resolving
    system issues rather than just looking for them!


    # Setting the Script''s Exit Value


    Ordinarily, a script''s exit status is the same as the last command the script
    called—that is, the script returns $. You can control the exit value, however,
    or exit from the script at any point, by using the exit command. Without any options,
    exit causes immediate termination of the script, with the usual exit value of
    $. This can be useful for error handling or aborting an ongoing operation for
    any reason—if the script detects an error or if the user selects an option to
    terminate, you can call exit to quit.


    If you pass a numeric value between 0 and 255 to exit, the script terminates and
    returns the specified value as the script''s exit value. You can use this feature
    to signal errors to other scripts that might call your script. You may have to
    include extra code to keep track of the causes of abnormal termination, though.
    For instance, you can set a variable (say, $terminate) to hold the cause of the
    script''s termination. Set it to 0 at the start of the script and then, if the
    script detects a problem that will cause termination, reset $terminate to some
    non-0 value. (You can use any numeric'
  merge: -1
