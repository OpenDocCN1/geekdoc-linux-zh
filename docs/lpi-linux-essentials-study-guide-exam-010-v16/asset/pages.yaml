    #  Summary


    Connecting Linux systems to networks can be painless if you have the correct tools.
    To connect the Linux system you''ll need an IP address, a netmask address, a default
    router, a host name, and a DNS server. If you don''t care what IP address is assigned
    to your Linux system, you can obtain those values automatically using DHCP.


    Network Manager is the most popular graphical tool used by Linux distributions
    for configuring network settings. It allows you to configure both wired and wireless
    network settings from a graphical window. If you must configure your network settings
    from the command line, there are a few tools you''ll need to use. For wireless
    connections, use the ifconfig command to set the wireless access point and SSID
    key. For both wireless and wired connections, use the ifconfig or ip command to
    set the IP address and netmask values for the interface. You may also use the
    route command to define the default router for the local network. When your network
    configuration is complete, you may have to do some additional troubleshooting
    for network problems. The ping and ping6 commands allow you to send ICMP packets
    to remote hosts to test connectivity. If you suspect issues with host names, use
    the host and dig commands to query the DNS server for host names. For more advanced
    network troubleshooting, you can use the netstat and ss commands to display what
    applications are using'
