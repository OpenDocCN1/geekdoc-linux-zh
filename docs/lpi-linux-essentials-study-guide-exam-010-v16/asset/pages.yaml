    # Exam Essentials


    **Explain the difference between various Linux accounts.** User accounts generally
    fall into three categories: the root user, standard users, and system accounts.
    The root account has a UID of 0 and is often disabled on many modern Linux distributions
    so that no one can directly log into it. This is due to the fact that root can
    read and write every file on the computer, making it a dangerous user. In addition,
    if multiple individuals use the root account, it sets up an impersonation environment.


    Users are given an account on the system to perform productive work. They typically
    have regular privileges, but those who perform special administrative duties may
    have access to super user privileges through commands such as sudo. These accounts
    have UIDs that start from 0 or 1,000 depending on the distribution configuration.


    System accounts help keep the computer running. You cannot log into these accounts,
    because they lack passwords, and their default shell is often set to /sbin/nolog.
    The UIDs for system accounts are numbers that are lower than the configured base
    for user account UIDs.


    **Describe the files involved in Linux account configuration.** The /etc/passwd
    file has a record for each account on the system. These records consist of the
    following fields: username, password, UID, GID, comment, home directory, and default
    shell.


    The /etc/shadow file has password information and data for each account on the
    system. Each records contains the following fields: username, salted and hashed
    password (if a password is set for the account), the last password'
