    Much of what you do with a computer involves manipulating files. Files hold the
    correspondence, spreadsheets, digital photos, and other documents that you create.
    Files also hold the configuration settings for Linux—information on how to treat
    the network interfaces, how to access hard disks, and what to do as the computer
    starts up. Indeed, even access to most hardware devices and kernel settings is
    ultimately done through files. Knowing where to find the files and how to manage
    them is critically important for administering a Linux computer.


    This chapter begins with a description of the basic layout of Linux stores files.
    It then shows you how to navigate your way around the Linux filesystem to get
    to your files. Finally, it goes through the basic text-mode commands for manipulating
    files and directories.


    # Understanding Where Things Go


    As discussed in Chapter 6, “Managing Hardware.” Linux uses a unified directory
    tree—that is, every partition, removable disk, network file share, and other disk
    or disk-like storage device is accessible as a directory in a single directory
    tree (or filesystem). This filesystem is structured—some directories have a specific
    purpose, whether the directories exist as regular subdirectories on one partition
