  md: 'Variables can help you expand the utility of scripts. A variable is a placeholder
    in a script for a value that will be determined when the script runs. Variables''
    values can be passed as parameters to a script, generated internally or extracted
    from a script''s environment. (An environment is a set of variables that any program
    can access. The environment includes things like the current directory and the
    search path for running programs.)


    Variables that are passed to the script are frequently called parameters or arguments.
    They''re represented in the script by a dollar sign ($) followed by a number fromA—$0
    stands for the name of the script, $1 is the first parameter to the script, $2
    is the second parameter, and so on. To understand how this might be useful, consider
    the task of adding a user. As described in Chapter 13, “Creating Users and Groups,”
    creating an account for a new user typically involves running at least two commands—useradd
    and password. You may also need to run additional site-specific commands, such
    as commands that create unusual user-owned directories aside from the user''s
    home directory.


    As an example of how a script with argument variable can help in situations, consider
    Listing 11.2. When you run the script, you must provide the user account as a
    parameter on the command line. The script retrieves the value using the $1 variable
    and creates an account based on the value with the useradd command (the script
    prompts you to enter the password when you run the script). It creates a directory
    in the /shared directory tree corresponding to the account, and it sets a symbolic
    link to that from the new user''s home directory. It also adjusts ownership and
    permissions in a way that may be useful, depending on your system''s ownership
    and permissions policies.


    Listing 11.2: A script that reduces account-creation tedium


    ```

    #!/bin/bash

    useradd -m $1

    passwd $1

    mdir -p /shared/$1

    chown $1.users /shared/$1

    chmod 775 /shared/$1

    ln -s /shared/$1 /home/$1

    chown $1.users /home/$1

    ```'
