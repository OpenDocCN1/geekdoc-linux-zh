  md: '# Real World Scenario


    # Network Account Databases


    Many networks employ network account databases. Such systems may include the Lightweight
    Directory Access Protocol (LDAP), Kerberos realms, and Active Directory (AD) domains.
    All of these systems move account database management onto a single centralized
    computer (often with one or more backup systems) or distributed across a designated
    system set. The advantage is that users and administrators need not deal with
    maintaining accounts independently on multiple computers. A single-account database
    can handle accounts on dozens (or even hundreds or thousands) of different computers,
    greatly simplifying day-to-day administrative tasks and also simplifying users''
    lives. Using such a system, though, most users accounts won''t appear in `/etc/passwd`
    and `/etc/shadow`, and groups may not appear in `/etc/group (described shortly,
    in “Understanding Groups”). These files will still hold information on local system
    accounts and groups, though.


    Linux can participate in these systems. In fact, some distributions provide options
    to enable such support at OS installation time. Typically, you must know the name
    or IP address of the server that hosts the network account database, and you must
    know what protocol that system uses. You may also need a password or some other
    protocol-specific information, and the server may need to be configured to accept
    accesses from the Linux system that you''re configuring.


    Activating use of network account databases after installing Linux is a complex
    topic that is not covered in this book. Such systems often alter the behavior
    of tools such as `passwd` `usermod` (described in Chapter 13 in subtle or not-so-subtle
    ways). If you need to use such a system, you''ll have to consult documentation
    specific to the service that you intend to use.


    # Understanding Groups


    As noted earlier, groups are collections of accounts that are defined in the `/etc/group`
    file. Like `/etc/passwd`, the `/etc/group` file contains colon-delimited lines
    (records), each defining a single group. An example looks like'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'this:


    ```

    users:x:100:games,christine

    ```


    The fields in /etc/group are as follows:


    **Group Name.** The first field, users in the preceding example, is the name of
    the group. You use it with most commands that access or manipulate group data.


    **Password.** Groups, like users, can have passwords. A value of x means that
    the password is defined elsewhere (but may be disabled), and an empty password
    field means that the group has no password.


    > > NOTE The use and management of group passwords is a topic that''s beyond the
    scope of this book. However, group passwords are typically frowned upon by security
    professionals.


    **GID.** Linux uses GID values, like UID values, internally. Translation to and
    from group names is done by the system for the benefit of users and administrators.


    **User List.** You can specify users who belong to the group in the comma-delimited
    list at the end of the /etc/group record.


    It''s important to recognize that users can be identified as members of the group
    in either of two ways:


    **By Specifying the GID in Users’ /etc/passwd Entries.** Because, /etc/passwd
    has room for only one GID value, only one group can be defined in this way. This
    is the user''s (primary or default) group.


    **By Specifying Usernames in the User List in /etc/group File.** A single user
    can appear multiple times in /etc/group, and a single group can have multiple
    users associated with it in this way but not the user''s. /etc/passwd entry, this
    group association is secondary.


    When you create new files, those files will be associated with your current group.
    When you log in, your current group is set to your primary group. If you want
    to create files that are associated with another group to which you belong, you
    can use the newgrp command, as follows:'
  merge: -1
  pgno: 359
- img_proc: true
  md: '```

    $ newgrp project1

    ```


    This command makes project1 your current group, so that the files you create will
    be associated with that group. Group ownership of files is important in file security,
    which is described in more detail in Chapter 14.


    # Using Account Tools


    A few commands can help you learn about the users and groups on your computer.
    Most notably, the woami and id utilities can tell you about your own identity,
    and the who and w utilities can give you information about who is currently using
    the computer.


    # Discovering Your Own Identity


    If you maintain multiple accounts for yourself and don''t recall which one you
    used to log in, you might become confused about your current status. In such a
    case, the woami command can come in handy. It displays your user ID:


    ```

    $ woami

    ```


    ```

    christine

    ```


    > This example reveals that the current account is christine. If you need more
    information, you can use the id utility:


    ```

    $ id

    ```


    ```

    uid=1002(christine) gid=100(users) groups=100(users)[...]

    ```


    This example shows information on both users and groups:


    +   * Your User ID and Username: uid=1002(christine) in this example

    * Your Current Group: gid=100(users) in this example

    * All Your Group Memberships: the entries following groups= in this example


    The id command displays both the numeric UID and GID values and potentially the
    associated names. The current group is the one''s that, either by default or because
    you used the newgrp command.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '> > On some distributions, the id command provides more information than shown
    in our examples.


    You can limit id''s output by specifying various options, as summarized in Table
    12.1. In addition, you can specify a username, as in id rich, to obtain information
    on that user rather than on yourself.


    # Table 12.1 Options for id


    | Long option | Short option | Effect |

    | --- | --- | --- |

    | --group | -g | Displays only the effective group ID |

    | --groups | -G | Displays all the groups to which you belong |

    | --user | -u | Displays only the user data |

    | --name | -n | Used in conjunction with -g, -G, or -u; displays only the name,
    not the UID or GID |

    | --real | -r | Used in conjunction with -g, -G, or -u; displays only the UID
    or GID, not the name |


    # Learning Who''s Online


    Linux permits multiple users to access the computer simultaneously. Most often,
    this is done by means of remote access servers such as the Secure Shell (SSH);
    however, you can use Linux''s virtual terminal (VT) feature to log in multiple
    times with a single keyboard and monitor. Sometimes, you might want to know who
    is using the computer. You might do this before shutting down the computer, for
    instance, to ensure that you don''t inconvenience another user.


    To learn who is online, you can use a command known as who:


    ```

    $ who

    cristine tty7  2019-08-06 10:14 (:0)

    steph tty2    2019-08-06 10:57

    rich pts/0     2019-08-06 10:56 (192.168.0.102)

    devon tty3     2019-08-06 10:57

    ken tty4      2019-08-06 10:57

    ```'
