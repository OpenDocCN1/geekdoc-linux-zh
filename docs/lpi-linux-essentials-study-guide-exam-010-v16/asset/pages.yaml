  md: '# Manual DNS Configurations


    One topic that the Linux Essentials exam does expect you to know about network
    configuration files is DNS. You can manually define a DNS server so that the system
    can use DNS hostnames. Fortunately, this is a standard that all Linux systems
    follow, which is handled in the /etc/resolv.conf configuration file:


    ```

    domain myydomain.com

    search mytest.com

    nameserver 192.168.1.1

    ```


    The domain entry defines the domain name assigned to the network. By default,
    the system appends this domain to any host names you specify. The search entry
    defines any additional domains to search for host names. The nameserver entry
    is where you specify the DNS server assigned to your network. Some networks can
    have more than one DNS server; just multiple nameserver entries in the file. Be
    careful, though, as this file may reset the next time you use your Linux system,
    depending on how your Linux distribution is configured. To speed up connections
    to commonly used addresses, manually enter their host names and IP addresses in
    the /etc/hosts file on your Linux system. The /etc/nsswitch.conf file defines
    whether the Linux system checks this file or after using DNS to look up the host
    name.


    # Command-Line Tools


    If you''re not working with a graphical desktop client environment, you''ll need
    to use the Linux command-line tools to set the network configuration information.
    Quite a few different command-line tools are at your disposal. This section covers
    the ones you''re most likely to run into (and the ones you''ll most likely see
    on the Linux Essentials exam).


    # Network Manager Command-Line Tools


    Network Manager offers two command-line tools:


    +   - nmtuiProvides a simple text-based menu tool

    - nmcli-Provides a text-only command-line tool'
