  md: 'scripts.


    This section presents basic information on programming languages. It begins by
    describing the differences between compiled and interpreted languages, which are
    important to understand so that you can properly handle program files or choose
    which you want to use. Brief descriptions of some common programming languages
    are also provided so that you can identify and use their source code files or
    choose which language you want to learn to.


    # Choosing a Compiled vs. an Interpreted Language


    At their core, computers understand binary codes—numbers that represent operations,
    such as adding two numbers or choosing which of two actions to take. People, however,
    are much better at handling words and symbols, as + or if. Thus most programming
    involves writing a program in a symbolic programming language and then translating
    symbolic code into the numeric form that computers understand. Dozens, if not
    hundreds, of such programming languages exist, each with its own unique features.


    Among high-level languages, two broad categories exist:


    Compiled Languages. Programs convert (or compile) a program written in a high-level
    language from its original source code into the machine code form. The compilation
    process can take some time—typically a few seconds to hours, depending on the
    size of the program and the speed of the computer. Compilation can also fail because
    of errors in the program. When the compilation succeeds, the resulting machine
    code executes quietly.


    Interpreted Languages. Programs written in interpreted languages are converted
    to machine code at the time they''re run by a program known as an interpreter.
    The conversion happens on a line-by-line basis. That is, the program is never
    completely converted to machine code; the interpreter figures out what each line
    does and then does one thing. This means that interpreted programs run much more
    slowly than compiled programs. The advantage is that interpreted programs are
    easier to develop, since you don''t need to deal with the compilation process.
    Interpreted programs are also easy to modify; just open the program in a text
    editor and save it back. This feature makes interpreted languages useful for helping
    with system startup tasks that system administrators might want to change—administrators
    can make and test changes quickly.'
  merge: -1
  pgno: 139
