  md: '# Real World Scenario


    # Server Programs and Server Computers


    The term server can apply to an entire computer or to a single program running
    on that computer. When applied to a computer as a whole, the term identifies the
    purpose of the computer and the fact that it runs one or more server programs.
    Server computers typically provide services that are used by anywhere from a handful
    to millions of client computers—that is, the computers that use a server’s services.


    In the networking world, a server (computer or program) listens for a connection
    from a client (computer or program) and responds to data transfer requests. Server
    computers are often—but not always—more powerful than their clients.


    When you read the word server (or client, for that matter), it may refer either
    to a computer or to a program. The context usually makes it clear which meaning
    is intended, although sometimes this isn’t the case—in fact, sometimes the speaker
    or writer may not know! For instance, somebody might report “The Samba server
    isn’t working.” In such a case, you need to figure out whether it’s the Samba
    server program or something else on the server computer''s causing problems.


    Sometimes, the client-server lines can get blurred. For instance, in office settings,
    it’s common for many computers to function as file servers running file server
    software such as Samba or NFS. A configuration enables Sam to make her files available
    to Cameron and for Cameron to make his files available to Sam. In this situation,
    both computers function as both client and server run both types of software.
    In any given exchange, though, only one is the client and one is the server.


    # Focusing on Web Servers


    A web server delivers web pages to internal and/or external network users. If
    you have ever used the World Wide Web, you have most likely two popular web servers
    that are offered on Linux:


    Apache HTTPD. The Apache HTTPD server is part of the prevalent Linux, Apache,
    MySQL, PHP (LAMP) stack for web applications. The Original


    ![](img/e86102be5e9fa20bd171b445b743f27b_135_0.png)'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'web server software package was released in 1995. Within less than a year,
    Apache became the most popular web server on the Internet. It has continued to
    maintain this level of popularity due to its stability and dependability. The
    Apache HTTPD server is available not only for Linux, but also for Unix, BSD, Windows,
    and even macOS. You can learn more at httpd.apache.org.


    # NGINX. Released in 2002, the NGINX (pronounced Engine X) server is a relative
    newcomer to the market. NGINX can retrieve resources on behalf of a client from
    one or more servers, as well as a mail server. Because of these features, and
    the fact that it is fast and lightweight, NGINX has won over many major websites,
    such as Netflix. You can learn more at nginx.org.


    The best feature of these two servers is that you don''t have to choose one or
    the other. Many server administrators choose a dual setup, using both Apache HTTPD
    and NGINX. Sometimes a side-by-side architecture is deployed, with each server
    handling what it does best—Apache managing dynamic content and NGINX managing
    static content (the same display for every user). Others deploy an Apache-in-Back
    (or NGINX-in-Front) architecture, allowing NGINX to shine with its resource-retrieval
    services, and the stable Apache still providing dynamic content as needed.


    # Installing and Launching Servers


    The topic of maintaining server programs is beyond the scope of this book, but
    you should be aware of the basics of this task. You can install servers in the
    same way that you install other software, as described later in this chapter and
    in more detail in Chapter 9.


    After the software is installed, you must launch a server. You do this differently
    than the way you launch a desktop application. Instead of clicking an icon or
    menu entry in a GUI, you typically launch a server by configuring the computer
    to run it automatically whenever it boots. Thereafter, the server program runs
    in the background, as a daemon—that is, as a process that runs unattended.'
  merge: -1
  pgno: 136
- img_proc: true
  md: '> The word daemon derives from Greek mythology; daemons were helpful supernatural
    beings, just as Unix and Linux daemons are helpful programs.


    Most servers are started automatically when Linux boots. You can also open a terminal
    program and type a text-mode command with a keyword as start or stop to start
    or stop the server manually. The nature of server program startup has been changing
    with recent distributions, and the topic is beyond the scope of this book. However,
    it is helpful to know that various distributions use a particular initialization
    daemon both to start and manage the various server daemons. Be sure to consult
    your distribution''s documentation to determine which initialization daemon it
    uses from the following list:


    +   - System V init (SysV init)

    - systemd

    - Upstart


    Some servers run via a super server, such as xinetd. These server programs run
    constantly, keeping the servers they manage unloaded except when they''re needed.
    This configuration can minimize the memory impact of running many seldom-used
    servers. The super server can also function as a security feature, like a bouncer,
    and keep out the troublemakers.


    # Securing Servers


    Whenever you run a server, you also run the risk of its being compromised and
    abused. Risks fall into several categories:


    +   - Servers can contain bugs that enable outsiders to abuse the software to
    run programs locally.

    - You can misconfigure a server, granting an outsider greater access to your system
    than you had intended.

    - Users with accounts and remote access via a server can abuse this trust. This
    risk is particularly great if combined with a server bug or misconfiguration.

    - A server can be used as a stepping-stone to attack others, making it'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'appear as if an attack originated from your computer.


    +   - Even without breaking into a computer, an attacker can swamp a server with
    bogus data, shutting it down. This technique is called a denial-of-service (DoS)
    attack.


    Server security is an extremely complex topic, and details vary from one server
    to another. For instance, if you run a server such as a remote login server, Samba,
    a POP or IMAP email server, you probably want to pay careful attention to password
    security, since all of these servers rely on passwords. Passwords are unimportant
    to a DHCP or DNS server program, though. of course, even if a DHCP or DNS server
    program doesn''t use passwords, other server programs running on the same computer
    might.


    Broadly speaking, securing a server requires attention to each of the risk factors
    just just outlined. Specific steps that you can take to secure your servers include
    the following:


    +   - You should keep your server programs up-to-date by using your package management
    tools to upgrade servers whenever upgrades become available. You can also research
    specific servers to pick ones that have good security reputations.


    +   - You should learn enough about server configuration to be sure that you can
    configure your servers properly.


    +   - You should remove unused accounts and audit necessary accounts to ensure
    that they use strong passwords.


    +   - You can use firewall configurations to restrict outsiders'' access to server
    computers that are intended for internal use. You can also use firewalls to minimize
    the risk of one of your computers being used to attack others.


    # Managing Programming Languages


    Many users never need to deal with programming languages; however, basic knowledge
    of what they are and how they differ from one another is important for Linux users
    for a variety of reasons. You might need to install languages for users on systems
    that you manage or for yourself to compile software from source code. You might
    also want to learn about programming, particularly if you want to automate computer
    management tasks using shell'
