    # Copying Files


    If you’re working in a text-mode shell, the cp command copies a file. (Its name
    is short for copy.) To use it, you can pass cp a source filename and a destination
    filename, a destination directory, or both. Table 7.4 outlines these three ways
    to use the command. Although the example filenames in Table 7.4 suggest that the
    original file be in your current working directory, this need not be the case;
    orig.txt could include a directory specification, such as /etc/fstab or ../file.txt.'
