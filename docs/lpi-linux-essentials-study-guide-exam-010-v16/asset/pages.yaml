  md: '# CHAPTER 3

    Investigating Linux’s Principles and Philosophy


    Objectives:


    +   - 1.1 Linux Evolution and Popular Operating Systems

    - 1.3 Open Source Software and Licensing


    ![](img/e86102be5e9fa20bd171b445b743f27b_96_0.png)


    You can frequently select a product or technology on purely pragmatic grounds—what
    OS works well for a given task, which software suite is the least expensive, and
    so on. Sometimes, though, understanding the principles and philosophy that underlie
    a technology can be useful, and knowing these might even guide your choice.


    This is true of some Linux users; the open source model of Linux, which we introduced
    in Chapter 1, “Selecting an Operating System,” has implications that can affect
    how Linux works. Furthermore, some in the Linux world can become passionate about
    these principles. Whether or not you agree with these individuals, understanding
    their point of view can help you appreciate the Linux culture, which you''ll find
    in the workplace, online, at conferences, and so on.


    This chapter covers these issues, beginning with information on Linux’s origins
    and its development over time up to the present. We then describe open source
    principles and how they can affect the way an open source OS works in the real
    world. Finally, we describe the roles in which Linux can work—as an embedded OS,
    as a desktop or laptop OS, and as a server OS.


    # Linux Through the Ages


    Although Linux’s birth date of 1991 is recent by most historical standards, in
    the computer world 25 years is an eternity. Nonetheless, the software and'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'culture in the early 1990s, and even before then, has conveyed quite a legacy
    to today’s software world. After all, what we use today is built atop the foundation
    that was created in the past. Thus, looking at how Linux originated will help
    you understand Linux as it exists today.


    # Understanding Linux’s Origins


    In 1991, as is also true today, computers were classified by their sizes and capabilities.
    Computers could belong to any of a handful of categories, ranging from desktop
    personal computers (PCs) to supercomputers. x86-based computers, which are the
    direct ancestors of today’s PCs, dominated the PC marketplace of 1991; however,
    other types of PCs were available, including Mac computers. Such computers generally
    used different CPUs and ran their own OSs.


    > Computers today can be classified in the much same way as in 1991, although
    some details have changed. A notable addition is embedded computers, as in smartphones.


    In 1991, most PCs ran Microsoft’s Disk Operating System (MS-DOS, PC-DOS, or DOS).
    DOS was extremely limited by today’s standards; it was a singletasking OS (it
    could run only one program at a time) that didn’t even take full advantage of
    the memory or CPUs available at the time. The versions of Microsoft Windows available
    in 1991 on top of DOS. Although the initial versions of Windows helped to work
    around some of DOS’s limitations, they didn’t fundamentally fix any of them. These
    early versions of Windows employed cooperative multitasking, for instance, in
    which programs could voluntarily give CPU time to other processes. The DOS kernel
    could not wrest control from a program that hogged CPU time.


    Above the PC level, Unix was a common OS in 1991. Compared to DOS and the version
    of Windows of that time, Unix was a sophisticated OS. Unix supported multiple
    accounts and provided true preemptive multitasking, in which the kernel could
    schedule CPU time for programs, even if the programs didn’t voluntarily give up
    control. These features were practical necessities for many servers and for multiuser
    computers such as minicomputers and mainframes.'
  merge: -1
  pgno: 97
- img_proc: true
  md: '> Unix was not the only multiuser, multitasking OS in 1991.

    Others, such as Virtual Memory System (VMS), were available. Unix is most relevant
    to Linux''s history, though.


    As time progressed, the capabilities of each class of computer have grown. By
    most measures, today''s PCs have the power of the minicomputers or even the mainframes
    of 1991. The OSs used on the PCs of 1991 didn''t scale well to more powerful hardware,
    and today''s PCs are now powerful enough to run the more sophisticated OSs their
    contemporaries have been largely abandoned in favor of Unix and other alternatives.


    > Today''s versions of Windows are not derived from DOS. Instead, they use a new
    kernel that shares many design features with VMS.


    1991, Linus Torvalds was a student at the University of Helsinki, studying computer
    science. He was interested in learning both Unix and the capabilities of the new
    x86 computer he''d just purchased. Torvalds began the program that would become
    the Linux kernel as a low-level terminal emulator—a program to connect to his
    university''s larger computers. As his program grew, he began adding features
    that turned his terminal program into something that be better described as an
    OS kernel. Eventually, he began writing with the goal of creating a Unix-compatible
    kernel—that is, a kernel that could run the wide range of Unix software that was
    available at the time.


    Unix''s history, in turn, stretched back two more decades, to its origin at AT&T
    in 1969. Because AT&T was a telephone monopoly in the United States at that time,
    it was legally forbidden from selling software. Therefore, when its employees
    created Unix, AT&T basically gave the OS away. Universities particularly enthusiastic
    adopting Unix, and some began modifying it, since AT&T made the source code available.
    Thus, Unix had a two-decade history of open software development to start. Most
    Unix programs were distributed as source code, since Unix ran on a wide variety
    of hardware platforms—binary programs for one machine would seldom run on another.'
