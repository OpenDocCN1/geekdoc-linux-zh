  md: '# Real World Scenario


    # Cross-installation UIDs and GIDs


    You may use multiple Linux installations, either dual-booting on one computer
    or installed on multiple computers. If so, and if you transfer files from one
    installation to another, you may find that the ownership of files seems to change
    as you move them around. The same thing can happen with non-Linux Unix-like OSs,
    such as macOS. The reason is that the filesystems for these OSs store ownership
    and group information using UID and GID numbers, and a single user or group can
    have different UID or GID numbers on different computers, even if the name associated
    with the account or group is identical.


    This problem is likely to occur when using native Linux or Unix filesystems to
    transfer data, including both disk-based filesystems (such as ext4 in Linux or
    HFS+ in macOS) or the Network File System (NFS) for remote file access. This problem
    is less likely to occur if you use a non-Linux/Unix filesystem, such as the File
    Allocation Table (FAT) or the New Technology File System (NTFS) for disks, or
    the Server Message Block/Common Internet File System (SMB/CIFS; handled by Samba
    in Linux) for network access.


    If you run into this problem, several solutions exist, but many of them are beyond
    the scope of this book. One can use, though, to change the UID or GID mappings
    on one or more installations so that they all match. Chapter 13 describes how
    to change a user''s UID number with usermod and how to change a group''s GID number
    with groupmod. When are transferring data via removable disks, using FAT or NTFS
    can be a simple solution, provided you don''t need to preserve Unix-style permissions
    on the files.


    # Setting Permissions


    File ownership is meaningless without some way to specify what particular users
    can do with their own or other users'' files. Linux''s permission structure is
    modeled after that of Unix, and it requires a bit of explanation before you tackle
    the issue. After you understand the basics, you can begin modifying permissions,
    using either'
