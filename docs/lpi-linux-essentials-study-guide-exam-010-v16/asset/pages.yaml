    # Using Commands


    One of the most basic features of shell scripts is the ability to run commands.
    You can use both commands that are built into the shell and external commands—that
    is, you can run other programs as commands. Most of the commands you type in a
    shell prompt are external commands; they''re programs located in `/bin`, `/usr/bin`,
    and other directories on your path. You can run such programs, as well as internal
    commands, including their names in the script. For instance, suppose you want
    a script that launches two `xterm` windows and the KMail mail reader program.
    Listing 11.1 presents a script that achieves this.


    Listing 11.1: A simple script that launches three programs


    ```

    #!/bin/bash

    /usr/bin/xterm &

    /usr/bin/xterm &

    /usr/bin/kmail &

    ```


    Aside from the first line that identifies it as a script, the script looks just
    like the commands you might type to accomplish the task manually, except for one
    fact: the script lists the complete paths to each program. This is usually not
    strictly necessary, but listing the complete path ensures that the script will
    find the programs if the `PATH` environment variable changes. On the other hand,
    if the program files move (say, because you upgrade the package from which they''re
    installed and the packager moves them), scripts that use complete paths will break.
    If a script produces a `No such file or directory` error for a command, typing
    `which command`, where `command` is the offending command, should help you locate
    it.'
