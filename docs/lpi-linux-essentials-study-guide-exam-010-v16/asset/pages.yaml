  md: '# Symbolic Link. A symbolic link (aka soft link) is a file that refers to another
    file by name. That is, the symbolic link is a file that holds another file''s
    name, and when you tell a program to read or write from a symbolic link, Linux
    redirects the access to the original file. Because symbolic links work by filename
    references, they can cross filesystem boundaries. Type ln -s origname to create
    a symbolic link.


    ![](img/e86102be5e9fa20bd171b445b743f27b_235_0.png)


    You can identify links in long directory listings (using the -l option to ls)
    in a couple of ways. The following example illustrates this:


    ```

    $ ln report.odt hardlink.odt

    $ ls -s report.odt softlink.odt

    ```


    ```

    total 192

    -rw-r--r-- 2 users 94720 Sep 10 11:53 hardlink.odt

    -rw-r--r-- 2 users 94720 Sep 10 11:53 report.odt

    lrwxrwxrwx 1 users 0 Sep 10 11:54 softlink.odt -> report.odt

    ```


    This example began with a single file, report.odt. The first two commands created
    two links, a hard link (hardlink.odt) and a symbolic link (softlink.odt). Typing
    ls -l shows all three files. The original file and the hard link can be identified
    by the presence of the value 2 in the second column of the ls -l output; this
    column identifies the number of file entries pointed to, so a value higher than
    1 indicates that a hard link exists. The symbolic link is identified by an 1 (a
    lowercase L, not a digit 1) in the first character of the softlink.odt file''s
    permissions string (lrwxrwxrwx). Furthermore, the symbolic link''s filename specification
    includes an explicit pointer to the linked-file.


    Both types of links are useful for referring to files by multiple names or in
    multiple directories. For instance, if you write a letter that you send to multiple
    recipients, you might want to store copies in directories devoted to each recipient.
    In such a situation, either type of link will probably work fine, but each type
    has implications. Most importantly, if you use symbolic links, deleting the original
    file makes the file completely inaccessible; the symbolic links remain point to
    a nonexistent file. If you use hard links, by,'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'you must delete all copies of the file to delete the file itself. This is because
    hard links are duplicate directory entries that point to the same file, whereas
    symbolic links are separate files that refer to the original file by name.


    If you modify a file by accessing its soft link, or by any hard-linked name, you
    should be sure that the program you use will modify the original file. Some programs
    create a backup of the original file that you can use to recover the original
    in case you find that changes were in error. Most editors do this in such a way
