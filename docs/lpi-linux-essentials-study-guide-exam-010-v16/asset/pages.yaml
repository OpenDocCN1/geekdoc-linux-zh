  md: '# Handling Software Packages


    Installing programs on a Linux distribution has become easier through the years.
    However, how software is packaged, installed, and can vary greatly from distribution
    to distribution. It is important to understand the differences in order to take
    full advantage of the Linux programs discussed in this chapter. This section provides
    brief descriptions. More details on installing and managing software packages
    are provided in Chapter 9.


    # Understanding Software Packages


    On Linux, software programs are bundled into a prebuilt package that has simplified
    their installation and management. Packages are managed on Linux using a package
    management system (PMS), which is discussed in detail in Chapter 9.


    These packages are stored on repositories, which are official software storage
    servers on the Internet. The repositories can be accessed over the Internet via
    your Linux system''s local PMS utilities. The repositories have lots of software
    packages stored on them, ready to be explored or installed. Each Linux distribution''s
    developers work hard to maintain and protect their official repositories’ software
    packages. Thus, in most cases, it’s best to obtain programs from the default distribution
    repositories. Fortunately, your distribution’s PMS typically does this by default.


    # Identifying Common Package Tools


    Each distribution uses its own PMS and package tools, which are discussed in more
    detail in Chapter 9. The following are a few of the primary tools used by the
    major PMSs:


    A low-level package tool used as the foundation of the Debian-based family of
    PMS tools. It can be used directly to install, manage, and remove software packages.
    However, it is limited in function. The dpkg tool cannot download software packages
    from the repositories.


    The rpm tool is also a low-level package tool similar to the dpkg utility. However,
    it is used as the foundation of the Red Hat Linux package management system. Though
    you can use rpm to manage packages, it’s best to use a higher-level PMS utility.'
