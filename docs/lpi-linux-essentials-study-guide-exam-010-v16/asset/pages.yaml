    # Creating Log Files


    Some programs create their own log files; however, most rely on a utility generally
    known as the system log daemon to do this. Your program''s process name is generally
    journald, syslog, or syslogd. Like other daemons, it''s started during the boot
    process by the system startup scripts. Several system log daemon packages are
    available. Some of them provide a separate tool, klog or klogd, to handle logging
    messages from the kernel to ordinary programs.


    You can modify the behavior of the log daemon, including adjusting the files to
    which it logs particular types of messages, The name of this file depends on the
    specific daemon in use, but it''s typically /etc/rsyslog.conf or something similar.
    The details of log file configuration are beyond the scope of this book, but you
    should be aware that such details can be altered. This fact accounts for much
    of the distribution-to-distribution variability in log file features.


    After it''s running, a log daemon accepts messages from other processes using
    a technique called system messaging. It sorts through the messages and directs
    them to a suitable log file depending on the message''s source and priority code.


