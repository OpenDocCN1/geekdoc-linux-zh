    UID. In reality, the username is just a label that the computer displays to us
    numerically challenged humans. The computer employs a user identification (UID)
    to track accounts. UIDs begin with o (which refers to the root account). In most
    distributions, user accounts have UID numbers to 1,000 and above, with lower numbers
    reserved for system accounts.


    > > Some distributions number user accounts starting at 500 rather than 1,000.


    GID. Accounts are tied to one or more groups, which are similar to accounts in
    many ways; however, a group is a collection of accounts. One of the primary purposes
    of groups is to enable users to get other users access to their files, while preventing
    users not in a designated group from accessing them. Each account is tied directly
    to a primary group via a group ID (GID) number (100 in the preceding example).
    By including an account in a group''s definition, accounts can be tied to several
    groups as described in Chapter 13, “Creating Users and Groups."


    > > File ownership and permissions are described in Chapter 14, “Setting Ownership
    and Permissions."


    Comment Field. The comment field normally holds the user’s full name (Richard
    Blum in this example), although this field can hold other information needed of
    or in addition to the user’s name.


    Home Directory. User accounts, and some system accounts, have home directories.(/home/rich
    in this example). A home directory is an account’s “home base.” Normally, ownership
    of an account’s home directory belongs to the account. Certain tools and procedures
    make it easy for users to access their directories; for instance, the tilde (-)
    refers to a user’s home directory when used at the start of a shell.


    Default Shell. A default shell is associated with every account. In Linux, the
    shell is normally bash (/bin/bash), but individual users can change this if they
    like. Most non-root system accounts set the default shell to /usr/sbin/nologin
    (or /sbin/nologin) as an added security measure—'
