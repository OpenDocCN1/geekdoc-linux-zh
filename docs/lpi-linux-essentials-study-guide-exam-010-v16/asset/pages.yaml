  md: '# Multibyte Units


    It''s common to use prefixes from the International System of Units (SI units)—kilo
    (k), mega (M), giga (G), tera (T), and so on—in conjunction with byte (B) to refer
    to large quantities of storage space, as in KB, MB, and so on. Technically, these
    units are defined as base-10 values—kilo means 1,000, mega means 1,000,000, and
    so on. In computers, base-2 values, such as $2^{10}$ (1024) and $2^{20}$ (1,048,576),
    are often more natural, as the SI units have (but not always) been used to mean
    these base-2 values. This practice has led to confusion, since it''s not always
    clear whether base-10 or base-2 units are being used.


    To resolve this conflict, the Institute of Electrical and Electronics Engineers
    (IEEE) defined a new set of prefixes as IEEE-1541. Under this system, new units
    and prefixes describe base-2 values. The first few of these are:


    +   - A kibibyte (KiB) is $2^{10}$ (1024) bytes.

    - A mebibyte (MiB) is $2^{20}$ (1,048,576) bytes.

    - A gibibyte (GiB) is $2^{30}$ (1,073,741,824) bytes.

    - A tebibyte (TiB) is $2^{40}$ (1,099,511,627,776) bytes.


    In this book, we use IEEE-1541 units when describing features that are best expressed
    in this system, as partition table size limits. Most Linux disk utilities use
    SI and IEEE-1541 units correctly, but which depends on the whim of the'' authors.
    Alert to this difference, particularly when dealing with large numbers—note that
    a tebibyte is almost 10 percent larger than a terabyte.


