  md: '# Using Server Programs


    Linux is a powerful OS for running server programs, so it should come as no surprise
    that you can find a wide variety of server programs for Linux. In this section,
    some common server protocols and the programs that use them are described. In
    addition, the process of installing and launching servers is covered as well as
    basic information on server security issues.


    # Identifying Common Server Protocols and Programs


    Networks, including the Internet, function by means of network protocols. Network
    protocols are clearly defined of how two computers should exchange data to achieve
    a particular end, such as transferring email or delivering a file to be printed.
    Most protocols are described in one or more standards documents, known as request
    for comments (RFC) documents, each of which has a name. Typically, one RFC document
    defines the protocol, and over time additional RFC documents define extensions
    or protocol modifications as they become necessary.


    Most network protocols involve transferring data over one or more ports, which
    are numbered resources on a computer. You can think of a port as being something
    like a room number in a building on a college campus—the main number (an Internet
    Protocol, or IP, address) identifies the computer as a whole, and the port number
    identifies the protocol being used. A server program attaches itself to a port
    number and receives all incoming requests on that port.


    Table 4.1 summarizes some common port numbers, the protocols and the Linux programs
    that are often used in conjunction with these protocols. Many ports and protocols
    are associated with more than one program. This is because Linux provides choices
    for many protocols; you can choose which several server programs to use for a
    given protocol, just as you choose which of several word processors or web browsers
    to use.


    > NOTE The /etc/services file links common port numbers to short names that are
    often used in other configuration files.'
  merge: -1
  pgno: 131
