    | messages | A general-purpose log file that contains many daemons that lack their
    own dedicated log files |

    | secure | Security-related messages, including notices of when users employ su,
    sudo, and similar tools to acquire root privileges |

    | Xorg.0.log | Information on the recent startup of the X Windows System (X) |


    Log files are frequently rotated, meaning that the oldest log file is deleted,
    the latest log file is renamed with a date or number, and a new log file is created.
    For instance, if it''s rotated on December 1, 2019, /var/log/messages will become
    /var/log/messages-20191201, /var/log/messages-1.gz, or something similar, and
    a new ./var/log/messages will be created. This practice keeps log files from growing
    out of control.


    > > Log rotation occurs late at night, so it won''t happen if you shut off your
    computer. Learn it running periodically to ensure log files are rotated.


    Most log files are plain-text files, so you can check them using any tool that
    can examine text files, such as less or a text editor. One particularly handy
    command is tail, which displays the last 10 lines of a file (or as many lines
    you specify with the -n option). For instance, typing tail /var/log/messages shows
    you the last 10 lines of file.


