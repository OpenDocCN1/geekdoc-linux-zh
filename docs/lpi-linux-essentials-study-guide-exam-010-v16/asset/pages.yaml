    # Using Pipes


    In a pipe, the standard output from one program is redirected to the standard
    input to a second program. You create a pipe by using a vertical bar (|) between
    the two commands; this key is usually above the Enter key on the keyboard and
    accessed with Shift. Pipelines can be useful when applied in various ways. For
    instance, you might pipe the lengthy output of a program through the less pager,
    enabling you to page up and down through the output. In this example, the cut
