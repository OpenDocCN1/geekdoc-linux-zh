  md: '# Chapter 15

    Managing Network Connections


    Objective:


    ✓4.4 Your Computer on the Network


    ![](img/e86102be5e9fa20bd171b445b743f27b_432_0.png)


    These days it''s almost a necessity to have your Linux system connected to some
    type of network. Whether it''s the need to share files and printers on a local
    network, or the need to connect to the Internet to download updates and security
    patches, most Linux systems have some type of network connection.


    This chapter looks at how to configure your Linux system to connect to a network,
    as well as how to troubleshoot network connections if things go wrong. There are
    a few different methods for configuring network setting in Linux, and you''ll
    need to know them all for the Linux Essentials exam. First, we''ll cover the basic
    settings required for network connectivity. Next, we will examine the different
    tools you have at your disposal that help make configuring the network settings
    easier. After that, this chapter explores simple network troubleshooting techniques
    you can use to help find the problem if anything goes wrong.


    # Configuring Network Features


    You need to configure five main pieces of information in your Linux system to
    interact on a network:


    +   - The host address


    +   - The network subnet address


    +   - The default router (sometimes called gateway)'
  merge: -1
  pgno: 432
- img_proc: true
  md: '+   ■ The system host name


    +   ■ A Domain Name System (DNS) server address for resolving host names


    You have three ways to configure this information in Linux systems:


    +   ■ Manually editing network configuration files


    +   ■ Using a graphical tool included with your Linux distribution


    +   ■ Using command-line tools


    Trying to manually edit the network configuration files is best left for system
    administrators and is beyond the scope of this book. For most typical Linux users,
    you''ll never have to mess with the configuration files; the graphical and command-line
    tools can do all that work for you. The following sections walk through both the
    graphical and command-line tools.


    ![](img/e86102be5e9fa20bd171b445b743f27b_433_0.png)


    > It''s worth noting that there are two types of IP network address schemes in
    use today. The legacy address scheme is technically referred to as IPv4 but commonly
    called IP. It uses 32 bits to represent a host address. These 32 bits are normally
    split into four 8-bit values, represented by decimal values, separated by dots
    (such as 192.168.1.5). Because the world is running out of unique 32-bit addresses
    to assign to hosts on the Internet, IPv6 was created. It uses 128 bits for addresses.
    These values are commonly represented as eight groups of hexadecimal digits, separated
    by colons (such as 2500:1601:ce00:eeb0:e900:aa0a:0410:cf33).


    # Graphical Tools


    The Network Manager tool is a popular program used by many Linux distributions
    to provide a graphical interface for defining network connections. Network Manager
    starts automatically at boot time and in the system tray area of the desktop as
    an icon.


    If your system detects a wired network connection, the icon appears as a mini-network
    with blocks connected together. If your system detects a wireless network connection,
    the icon appears as an empty radio signal.'
  merge: -1
  pgno: 433
- img_proc: true
  md: 'When you click the icon, you''ll see a list of the available wireless networks
    detected by the network card (as shown in Figure 15.1).


    ![](img/e86102be5e9fa20bd171b445b743f27b_434_0.png)


    **Figure 15.1:**- Network Manager showing a wireless network connection


    Click your access point to select it from the list. If your access point is encrypted,
    you''ll be prompted to enter the password to gain access to the network.


    After your system is connected to a wireless access point, the icon appears as
    a radio signal. Click the icon and then select Edit Connections to edit the network
    connection settings for the system, shown in Figure 15.2.'
  merge: -1
  pgno: 434
- img_proc: true
  md: '![](img/e86102be5e9fa20bd171b445b743f27b_435_0.png)


    **Figure 15.2:** The Network Connections dialog


    Select the network connection you want to configure (either wireless or wired),
    and then click the Edit button to change the current configuration.

    Network Manager allows you to specify the host address, network subnet address,
    default router, and DNS server names by using the manual configuration option,
    or you can set the configuration to use Dynamic Host Configuration Protocol (DHCP)
    to determine the settings. Network Manager automatically updates the appropriate
    network configuration files with the updated settings.


    Certification Objective'
