    $ ls -l subdivir/

    total 304

    -rw-r--r-- 1 root root 240268 Oct 14 18:25 report.txt

    $ rm subdivir/report.txt; Operation not permitted

    rm: cannot remove `subdir/report.txt`

    ```


    In this example, although rich still has read/write access to subdivir, rich cannot
    delete another user''s files in directory.


    You can identify a directory with the sticky bit set by a small change in the
    symbolic mode shown by ls -l. The world execute bit is shown as a t rather than
    an x. In this example, the result is that subdivir\ss permission appears as drwxrwxrwx.


    The sticky bit is particularly important for directories that are shared by many
    users. It''s a standard feature on /tmp and /var/tmp, instance, since many users
    store temporary files in these directories, and you wouldn''t want one to be able
    to delete another''s temporary files. If you want users who collaborate on a project
    to be able to write files into each other''s home directories, consider setting
    the sticky bit on those home directories or on the subdirectories in which users
    are sharing files.


    > If you delete /tmp or /var/tmp and need to re-create it, be sure to set the
    sticky bit on your new replacement directory!


    # Using Special Execute Permissions


    As described earlier in this chapter, the execute permission bit enables you to
    identify program files as. Linux then enables you to run these programs. Such
    files run using your own credentials, which is generally a good thing—associating
    running processes with specific users is a key part of Linux''s security model.
    Occasionally, programs need to run with elevated privileges. For instance, the
    password program, which sets users'' passwords, must run as root to write, and
    in some cases to read, the configuration files it handles. Thus, if users are
    to change their own passwords, password must have root privileges even when ordinary
    users run it.


    To accomplish this task, two special permission bits exist, similar to the sticky
    bit described earlier:'
  merge: -1
  pgno: 424
- img_proc: true
  md: '**Set User ID (SUID).** The set user ID (SUID) option tells Linux to run the
    program with the permissions of whoever owns the file rather than with the permissions
    of the user who runs the program. For instance, if a file is owned by root and
    has its SUID bit set, the program runs with root privileges and can reread any
    file on the computer. Some servers and other system programs run this way, which
    is often called SUID root. SUID programs are indicated by an s in the owner''s
    execute bit position in the permission string, as in rwxr-xr-x.


    **Set Group ID (SGID).** The set group ID (SGID) option is similar to the SUID
    option, but it sets the group of the running program to the group of the file.
    It''s identified by an s in the group execute bit position in the permission string,
    as in rwxr-sr-x. When set on a directory, the SGID option ensures that all files
    created in the directory are set to the group of the directory instead of the
    person who created the file.


    You can set these bits using chmod:


    **Using an Octal Code.** In the leading digit of a four-digit octal code, set
    the leading value to 4 to set the SUID bit, to 2 to set the SGID bit, or to 6
    to set both bits. For instance, 4755 sets the SUID bit, but not the SGID, on an
    executable file.


    **Using a Symbolic Code.** Use the s symbolic bit, g to specify the SGID bit,
    or to both to set both bits. For instance, typing, chmod u+s myprog sets the SUID
    bit on myprog, whereas chmod ug-s removes the SUID bit and the SGID bit.


    Ordinarily, you don''t need to set or remove these bits; when necessary, the package
    management program sets these bits correctly when you install or upgrade a program.
    You might need to alter these bits if they''ve mistakenly set or removed on files.
    In some cases you might want or need to adjust these values on program files that
    you compile from source code or if you need to modify the way a program works.
    Be very cautious when doing so, though. If you use the SUID or SGID on a garden-variety
    program, if the program contains bugs, those bugs will then be able to do more
    damage. If you accidentally remove these permissions, the results can be just
    as bad—programs like passwd, sudo, all rely on their SUID bits being set, so removing
    this feature can cause them to stop working.'
  merge: -1
  pgno: 425
- img_proc: true
  md: '# Hiding Files from View


    If you''re used to Windows, you may be familiar with the concept of a hidden bit,
    which hides files from view in file managers, by the Windows DIR command, and
    in most programs. If you''re looking for something analogous in Linux, you won''t
    find it, at least not in the form of a dedicated filesystem feature. Instead,
    Linux uses a file-naming convention to hide files from view; most tools, such
    as ls, hide files and directories from if their names begin with a dot (.). Thus,
    ls shows the file afile.txt but not afile.txt. Most file managers and dialog that
    deal files also hide dot files, as they''re commonly used; however, this practice
    is not universal.


    Many user programs take advantage of this to keep your configuration files from
    cluttering your display. For instance, ~/.bashrc is a Bash user configuration
    file, Evolution''s configuration goes in the ~/.evolution directory, and ~/.fonts
    holds user-specific font configuration information.


    You can view dot files in various ways depending on the program in question. Some
    GUI tools have a check box you can set in their configuration options to force
    the program to display such files. At the command line, you can use the -a option
    to ls:


    ```

    $ ls -l

    total 0

    drwxrxrxrwt 2 root root 80 Dec 14 18:25 subdir

    $ ls -la

    total 305

    drwxr-xr-x 3 kkirk users 104 Dec 14 18:44

    drwxr-xr-x 3 kkirk users 528 Dec 14 18:21 .

    -rw-xr-r-- 1 kkirk users 309580 Dec 14 18:44 .report.txt

    drwxrxrxrwt 2 root root 80 Dec 14 18:25 subdir

    ```


    This example shows the hidden file, .report.txt, in the current directory. It
    also shows hidden directory files. The first, ., refers to the current directory.
    The second, . . , refers to the parent directory.


    > Recall from Chapter 6, “Managing Hardware,” that . . is a relative directory
    reference. This hidden entry is why it works.'
  merge: -1
  pgno: 426
- img_proc: true
  md: 'Note that renaming a file so that it begins with a dot will hide it, but this
    action will also make the file inaccessible to any program that uses the original
    filename. That is, if you rename report.txt to .report.txt, and if another program
    or refers to the file as report.txt, that reference will no longer work. You must
    include the leading dot in any reference to the hidden file.


    # Viewing Directories


    Chapter 6 introduced the ls command, including many of its options.

    One of these deserves elaboration at this point: -d. If you''re working in a directory
    that holds many subdirectories, and if you use a wildcard with ls you may get
    an unexpected result; the output will show the files in the matched subdirectories,
    rather than the information on the subdirectories themselves—for instance, starting
    in a directory with two subdirectories, subdir1 and subdir2:


    ```

    $ ls -1 subdir*

    subdir1:

    total 304

    -rw-r--r-- 1 kirk users 309580 Dec 14 18:54 report.txt


    subdir2:

    total 84

    -rw-r--r-- 1 kirk users 86016 Dec 14 18:54 mypaper.doc

    ```


    If instead you want information on the subdirectories, rather than the contents
    of those subdirectories, you can include the -d option:


    ```

    $ ls -1d subdir*

    drwxr-xr-xr 2 kirk users 80 Dec 14 18:54 subdir1

    drwxr-xr-xr 2 kirk users 80 Dec 14 18:54 subdir2

    ```


    # Summary


    File security is important on a multiuser OS such as Linux, and one of the pieces
    of the puzzle of security is ownership. In Linux, every file has one owner and
    one associated group. The superuser can set the owner with chown, and either the
    superuser or the file’s owner can set the group with chgrp. By itself, ownership
    is useless, as Linux supports the concept of file permissions, which control which
    other users can access a file, and in what'
  merge: -1
  pgno: 427
- img_proc: true
  md: 'ways. You can set permissions with the chmod utility. You can view ownership,
    permissions, and some additional file features using the -l option to the ls command.


    # Exam Essentials


    Describe how Linux tracks file system is assigned one owner and one primary group.
    You can view the owner and group of a file or directory by using the ls command
    with the -l option. You can change the owner and primary group assigned to a file
    or directory using the chown command or just the group by using the chgrp command.


    Explain how Linux tracks file and directory permissions.. Linux assigns permissions
    to files and directories based on a three-level hierarchy—the owner, the primary
    group assigned to the file or directory, and everyone else on the system. To view
    the permissions for a file or directory, use the ls command with the -l option.
    The permissions appear as a set of characters, three sets of r (for read), w (for
    write), and x (for execute), ordered rwx. If a permission is not set, it appears
    as a dash (-). The first set is the owner''s permissions, the second set is the
    group permissions, and the third set is the permissions assigned to all users
    who aren''t the owner or in the primary group of the file or directory. You change
    the permissions assigned to a file or directory using the chmod command. You can
    either use the symbolic r, w, and x characters, or you can use an octal mode,
    where each permission is assigned an octal value.


    Explain how Linux makes files or directories hidden.. Linux flags a file or directory
    as hidden if the file name begins with a period (.). Hidden files and directories
    do not appear in a standard ls listing unless you include the -a option.


    Describe the special bits used for files.. The sticky bit, when assigned to a
    directory, tells Linux to allow only the owners of files contained in the directory
    to delete them, even if another user account has write access to the file. The
    user ID bit tells Linux to run the file with the permissions of the file owner
    instead of the actual user account that runs the file. The group ID bit tells
    Linux to run the file with the permissions of the file’s primary group instead
    of the primary group of the user account that runs the file.'
  merge: -1
