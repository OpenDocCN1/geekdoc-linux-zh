  md: '# Table 7.4 Examples of the use of cp


    | Example command | Effect |

    |---|---|

    | cp orig.txt new.txt | Copies orig.txt to new.txt in the current directory |

    | cp orig.txt /otherdir | Copies orig.txt to the /otherdir directory. The copy
    will be called orig.txt. |

    | cp orig.txt /otherdir/new.txt | Copies orig.txt to the /otherdir directory.
    The copy will be called new.txt. |


    The critical point to understand is how the destination filename is specified.
    This can be less than obvious in some cases, file and directory specifications
    can look alike. For instance, consider the following command:


    ```

    $ cp outline.pdf ~/publication

    ```


    This command can produce any of three results:


    +   - If ~/publication is a directory, the result is a file called ~/publication/outline.pdf.

    - If you follow a directory name with a slash (/), as in ~/publication/, cp returns
    an error message if ~/publication doesn’t exist or is a regular file.

    - If ~/publication is a file, the result is that this file will be replaced by
    the contents of outline.pdf.

    - If ~/publication doesn’t exist yet, the result is a new file, called ~/publication,
    which is identical to the original outline.pdf.


