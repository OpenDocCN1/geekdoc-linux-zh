  md: 'still run the script by running the shell program followed by the script name
    (as in bash my-script), but it''s generally better to make the script executable.
    If the script is one you run regularly, you may want to move it to a location
    on your path, such as `/usr/local/bin`. When you do that, you won''t have to type
    the complete path or `move` to the script''s directory to execute it; you can
