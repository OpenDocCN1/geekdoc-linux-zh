  md: '# CHAPTER 13

    Creating Users and Groups


    Objectives:


    +   - 5.2 Creating Users and Groups


    ![](img/e86102be5e9fa20bd171b445b743f27b_375_0.png)


    Linux is a multiuser OS, meaning that a single Linux computer can support many
    users, each with a unique account. With this capability comes the need to manage
    users’ accounts, and this chapter covers the procedures you’ll use to do so.


    The chapter begins with information on how to create accounts. With the accounts
    created, you then need to know how to modify those accounts and, when necessary,
    delete them. Finally, groups are similar to accounts in many ways, so you will
    learn how to create and manage groups.


    # Creating New Accounts


    In many environments, the task of adding accounts is quite common. Large businesses
    hire new employees, universities recruit new students, charitable organizations
    obtain fresh volunteers, and so on. Therefore, you must know how to create new
    accounts. But first, this section looks at the important issues of deciding how
    to use groups and selecting a good password. You will then learn how to create
    accounts using both GUI and text-mode tools.


    # Deciding on a Group Strategy


    As described in Chapter 12, “Understanding Basic Security,” Linux groups are collections
    of users. You can use groups to control who can access particular files. As will
    be described in Chapter 14, “Setting Ownership and Permissions,” individuals can
    change the group affiliations and group permissions of their own files. Thus,
    the way you use groups can influence'
  merge: -1
  pgno: 375
- img_proc: true
  md: 'your computer''s overall security strategy. Two approaches are common:


    **User Groups.** Each user can have an associated group; for instance, the user
    luke can have a group called luke. This user can set group ownership on his files
    to luke or set group permissions to whatever is desired, and the system administrator
    can add users to the luke group. Thereafter, members of the luke may access files
    in this group by using the permissions determined by the user luke. This approach
    emphasizes controlling access to individual users'' files.


    **Project Groups.** In this method, you create groups based on work projects,
    departmental affiliations, or other real-world groupings of users. For instance,
    you might have a group called sales for users in the sales department. Members
    of this group would assign group ownership and permissions appropriately and store
    files in an agreed-upon location. This approach works best when the computer is
    used by a large number of people who collaborate in easily defined groups.


    These two approaches are not mutually exclusive; you can mix and match or create
    your own approach. You should also realize that users can be of multiple groups.
    In fact, this is required for the user groups approach to work at all—otherwise,
    groups are redundant with accounts.


    > By default, some distributions employ a user groups strategy and others in the
    latter case, most users are in a group called users or something similar by default.


    If you use the project group approach, you should think about which group should
    be a new user''s primary group. This is the group that will be assigned group
    ownership of the user''s files by default.


    # **Selecting a Good Password**


    When you create an account, you typically should create a password for it. Sometimes,
    the user can select the password when the account is created. At other times,
    you''ll need to select a password that the user will use initially. In such cases,
    instruct the user to change the password as soon as possible. In either case,
    it''s important to educate users about selecting a good password.'
  merge: -1
  pgno: 376
- img_proc: true
  md: '> Be sure to follow the advice in this section yourself, especially for the
    root password if you use the root account!


    Poor but common passwords include those based on the following:


    +   - The names of family members, friends, and pets

    - Favorite books, movies, television shows, or the characters in any of these

    - Telephone numbers, street addresses, or Social Security numbers

    - Any other meaningful personal information

    - Any single word that''s found in a dictionary (in any language)

    - Any simple keyboard or alphanumeric combination, such as qwerty 123456


    The best possible passwords are random collections of letters, digits, and punctuation.
    Unfortunately, such passwords are difficult to remember. A reasonable compromise
    is to build a password in two steps:


    +   1. Choose a base that''s easy to remember but difficult to guess.

    2. Modify that base in ways that increase the difficulty of guessing the password.


    One approach to building a base is to use two or more unrelated words, such as
    bun and pen. You can merge these two words (bunpen). Another approach, and one
    that''s arguably better than the first, is to use the first letters of a phrase
    that is meaningful to .user. For instance, the first letters of “yesterday I went
    to the dentist” become yiwttdd. In both cases, the base should not be a word in
    any language. As a general rule, the longer the password, the better.


    > Many distributions place lower limits on password length, such six or eight
    characters.


    With the base in hand, it''s time to modify it to create a password. The user
    should apply at least a couple of several possible modifications:'
  merge: -1
  pgno: 377
- img_proc: true
  md: '# Adding Numbers or Punctuation. One important change is to insert random numbers
    or punctuation in the base. This step might yield, for instance, bu3npe?n or y+9wttd.
    As a general rule, add at least two symbols or numbers.


    Mixing Case. Linux uses case-sensitive passwords, so jumbling the case of letters
    can improve security. Applying this rule might produce Bu3nPE?n and y+iwttD, for
    instance.


    Reversing Order. A change that''s very weak by itself but that can add to security
    when used in conjunction with the others is to reverse the order of some or all
    letters. You might apply this to just one word of a two-word base. This could
    yield Bu3nn?EP DttW91+y, for instance.


    Growing the Haystack. A would-be intruder''s task of discovering a password has
    been likened to finding a needle in a haystack. One way to make this task harder
    is to increase the size of the haystack. In password terms, this means making
    a password larger. You can do this by using larger words or phrases, of course,
    but this can make a password harder to remember and type. Even a increase that
    simply replaces a single character can be helpful. Thus you might turn the passwords
    into Bu3nn?EPiiiiiiii or Dtt!!!!W9iy.


    > The National Institute of Standards and Technology (NIST) is a nonregulatory
    U.S. agency. They publish many commerce recommendations, including business computer
    security. NIST proposals are typically turned into procedures for companies and
    government organizations. In 2017, NIST issued new guidelines regarding secure
    passwords, and surprisingly long complicated passwords are no longer recommended.
    However, it may take a while before the new password guidelines filter down into
    your day-to-day world, if ever.


    Your best tool for getting insights to pick good passwords is to educate them.
    Here are some insights to share with users:


    +   - Passwords can be guessed by malicious individuals who know them or even
    who target them and look up personal information on social media, web-based telephone
    directories, business profiles, and so on.

    - Although Linux salts and hashes its passwords internally, programs exist'
  merge: -1
  pgno: 378
- img_proc: true
  md: 'that feed entire dictionaries through Linux’s password salting/hashing algorithms
    for comparison to a Linux system’s passwords. If a match occurs, the password
    has been found.


    +   * User accounts might be used as a first step toward compromising the entire
    computer or as a launching point for attacks on other computers.


    +   * Users should *never* reveal their passwords to others, even people claiming
    to be system administrators. This is a common scam, because real system administrators
    don''t need users’ passwords.


    +   * The same password should not be used on multiple systems, because doing
    so quickly turns a compromised account on one computer into a compromised account
    on all of them.


    +   * Writing passwords down or emailing them are both risky practices. Writing
    a password on a sticky note stuck to the computer’s monitor is particularly foolish.


    Telling your users these things will help them understand the reasons for your
    concern, and it’s likely to help motivate at least some of them to pick good passwords.'
  merge: -1
  pgno: 379
