  pgno: 330
- img_proc: true
  md: 'The Linux File Hierarchy Standard (FHS) defines specific directories for different
    types of files, such as /usr/bin for local application executable files. Many
    Linux distributions are incorporating the FHS structure in their directory hierarchy.


    Each program-launch line in Listing 11.1 ends in an ampersand (&). This character
    tells the shell to go on to the next line without waiting for the first finish.
    If you omit the ampersands in Listing 11.1, the effect will be that the first
    xterm will open but the second won''t open until the first is closed. Likewise,
    KMail will not start until the second xterm terminates.


    Although launching several programs from one script can save time in startup scripts
    and some other situations, scripts are also frequently used to run a series of
    programs that manipulate data in some way. Such scripts typically do not include
    the ampersands at the ends of the commands because one command must run after
    another or even rely on output from the first. A comprehensive list of such commands
    is impossible because you can run any program you can install in Linux as a command
    in a script—another script. A few commands that are commonly used in scripts include
    the following:


    # Normal File Manipulation Commands.


    The file manipulation commands, such as ls, mv, cp, and rm, are used in scripts.
    You can use these commands to help automate repetitive file maintenance tasks.


    grep The grep command locates files that contain the string in a single file.
    grep is described in detail Chapter 8 (“Searching, Extracting, and Archiving Data.”


    find The find command searches for patterns based filenames, ownership, and similar
    characteristics. Chapter 8 covers this command.


    cut The cut extracts text from files in a field. It''s frequently used to extract
    variable information from a file whose contents are highly patterned. To use it,
    you pass one or more options that specify what information you want, followed
    by one or more filenames. For instance, users’ home directories appear in the
    sixth column-delimited field of the /etc/passwd file. You can type cut -f 6 -d
    ":" /etc/passwd to extract this information. The same command in a script will
    extract this'
  merge: -1
  pgno: 331
- img_proc: true
  md: 'information, which you''ll probably save to a variable or pass to a subsequent
    command.


    The sed program provides many of the capabilities of a conventional text editor
    (such as search-and-replace operations) but via commands that can be typed at
    a command prompt or entered in a script.


    echo. The echo command is the tool to use when a script must provide a message
    to the user. You can pass various options to echo or just a string to be shown
    to the user. For instance, echo "Press the Enter key" causes a script to display
    the specified string. You can also use echo to display the value of variables
    (described later, in “Using Variables”).


    mail. The mail command can be used to send email from a script. Pass it -s subject
    parameter to specify a subject line, and give it an email address as the last
    argument. If it''s used as a command, you type a message and terminate it with
    a Ctrl+D keystroke. If it''s used from a script, you may omit the subject entirely
    or pass an external file as the message using input redirection. You may want
    to use this command to send mail to the superuser about the actions of a startup
    script or a script that runs on an automated.


    > Chapter 8 describes input redirection.


    Many of these commands are extremely complex, and completely describing them is
    beyond the scope of this chapter. You can consult these commands'' pages for more
    information. A few of them are described elsewhere in this book, as noted in their
    descriptions.


    Even if you have a full grasp of how to use some external commands, simply executing
    commands as you would typing them at a command prompt is of limited utility. Many
    administrative tasks require you to modify what you type at a command, or even
    what commands you enter, depending on information from other commands. For this
    reason, scripting languages include additional features to help you make your
    scripts useful.


    # Using Arguments'
