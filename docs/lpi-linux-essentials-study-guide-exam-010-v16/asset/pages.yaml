    usually shared between multiple organizations.

    - **Private**: In the private cloud computing environments, each individual organization
    builds its own cloud computing resources to provide resources internally.

    - **Hybrid**: In hybrid cloud computing environments, computing resources are
    provided internally within the organization but also connected to an external
    public cloud to help supplement resources when needed.


