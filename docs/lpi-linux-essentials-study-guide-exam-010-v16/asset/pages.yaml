  md: '# CHAPTER 14

    Setting Ownership and Permissions


    Objectives:


    +   - 2.3 Using Directories and Listing Files

    - 5.3 Managing File Permissions and Ownership

    - 5.4 Special Directories and Files


    ![](img/e86102be5e9fa20bd171b445b743f27b_408_0.png)


    As a multiuser OS, Linux provides tools to help you secure your files against
    unwanted access—after all, you wouldn’t want another user to accidentally (or
    intentionally) read personal files or even delete yours! Linux handles these tasks
    through two features of files and directories: their ownership and their permissions.
    Every file has an associated owner (that is, an account with which it is linked)
    as well as an associated group. Three sets of permissions define what the file’s
    owner, members of the file’s group, and all other users can do with the file.
    Thus, ownership and permissions are intertwined, although you use different text-mode
    commands to manipulate them. (GUI tools often combine the two, as described in
    this chapter.)


    # Setting Ownership


    The security model for Linux is based on that of Unix, which was designed as a
    multiuser OS. This security model therefore assumes the presence of multiple users
    on the computer and provides the means to associate individual files with the
    users who create them—that is, files have owners. You should thoroughly understand
    this concept, and with that knowledge, you can help protect your files, using
    either a GUI file manager or a text mode shell command.


    Ownership also applies to running programs (that is, processes). Most'
  merge: -1
  pgno: 408
- img_proc: true
  md: 'programs you run are tied to the account you used to launch them. This identity,
    in conjunction with the file’s ownership and permissions, determines whether a
    program may modify a file.


    # Understanding Ownership


    Chapter 12, “Understanding Basic Security,” and Chapter 13, “Creating Users and
    Groups,” described Linux’s system of accounts. These accounts are the basis of
    file ownership. Specifically, every file has an owner—an account with which it
    is associated. The user ID (UID) number associates the file with an owner, whereas
    the group ID (GID) number associates the file with a group.


    As described later, in the section “Setting Permissions,” you control access to
    the file through permissions you set independently for the file’s owner, the file’s
    group, and all other users of the computer. As root, you can change the owner
    and group of any file. The file’s owner can also change the file’s, but only to
    a group to which the user belongs.


    The same principles of ownership apply to directories as they apply to files:
    directories have owners and groups. They can be changed by root or, to a more
    limited extent, by the directory’s owner.


    # Setting Ownership in a File Manager


    As described in Chapter 4, “Using Common Programs,” you can manipulate files with
    a file manager. You’re probably familiar with file managers in Windows or macOS.
    Linux’s ownership and permissions are different from those of Windows, so you
    may want to know how to check on, and perhaps change, ownership features using
    a Linux file manager. As noted in Chapter 4, you have a choice of several file
    managers in Linux. Most are similar in broad strokes but differ in some details.
    In this section we’ll use GNOME Files file manager as an example.


    If you want to change the file’s owner, you must run Files as root, but you can
    change the file’s group to any group to which you belong as an ordinary user.
    The procedure to perform this task as root is as follows:


    +   1. Launch a terminal window.


    +   2. In the terminal window, type su to acquire root privileges.'
