    Cascading Style Sheets (CSS) to provide a majority of the Internet''s web pages.
    Typically dynamic page information, such as animated graphics, scrolling jukeboxes,
    or interactive maps, is driven by JavaScript programs. Nearly all modern web browsers
    support JavaScript programs through built-in interpreters. A JavaScript source
    code file has a .js file extension.'
