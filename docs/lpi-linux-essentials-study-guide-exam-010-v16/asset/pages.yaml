    # Modifying Accounts from the Shell


    One of the most frequent account modifications is to change a user''s password,
    either as part of account creation or because a user has forgotten their password.
    You can make this change with the passwd program. Ordinary users can type passwd
    to change their own passwords, but not other users'' passwords. Those with super
    user privileges, however, can pass a username to the command to change any account''s
    password:


    $ sudo passwd hwash


    ```

    Enter new UNIX password:

    Retype new UNIX password:

    passwd: password updated successfully

    $

    ```


    As a security measure, the password you type does not echo to the screen as you
    type it. If the passwords you type don''t match, the program refuses to accept
    your change and prompts you you again for a fresh pair of passwords. The'
  merge: -1
