    from this output, the Realtek network adapter is built into the motherboard, whereas
    the Intel device resides on a plug-in card.


    # Sizing Your Power Supply


    A computer’s power supply takes the alternating current (AC) from a wall outlet
    and converts it to the direct current (DC) that your motherboard and everything
    you plug into it uses. Laptop computers and some small desktop computers use power
    adapter “bricks” that you can put on the floor. Larger desktop computers have
    internal power supply units. These internal units are larger, both physically
    and in terms of the amount of power they can deliver.


    Every power supply has limits on the amount of DC power it can deliver. This is
    important because every device you plug into the computer consumes a certain amount
    of power. If your computer manufacturer cuts corners, the power supply may be
    barely adequate for the computer as delivered. If you add a hard disk or a power-hungry
    plug-in card, you could exceed the amount of power that the power supply can deliver.
    The result can be unreliable operation—the computer can crash or behave erratically,
    perhaps corrupting'
  merge: -1
  pgno: 193
- img_proc: true
  md: 'data or files. Such problems can be hard to distinguish from other problems,
    such as bad RAM or a failing hard disk.


    If you need to replace your power supply, pay attention to its output in watts.
    You should be able to find the output of your current power supply on a sticker—but
    you''ll need to open your computer, at least for most desktop systems. Be sure
    to get a power supply that''s rated for at least as many watts as the one you''re
    replacing. Also, it will fit—sizes are standardized, but a few variants are available.
    In the case of a laptop or a small desktop computer with an external power supply,
    you must ensure that a replacement provides the right type of connector to the
    computer. Buying a replacement from the computer''s manufacturer is usually the
    best course of action in this case.


    # Understanding Disk Issues


    Disks are a critical part of most Linux installations, so it''s important to know
    how they operate and how Linux interacts with them. This section describes three
    basic disk issues: hardware interfaces, disk partitioning, and filesystems. In
    addition, it describes some of the issues surrounding removable disks, including
    optical (CD-ROM, DVD-ROM, and Blu-ray) discs.


    > You can install Linux in a diskless configuration, in which Linux computer boots
    using files stored on a network server.


    # Disk Interfaces


    Today, three disk interfaces are common:


    PATA. This interface was very common in the past, but it''s fading in popularity.
    It features wide 40- or 80-pin cables that transfer several bits of data simultaneously—hence
    the word parallel in the name Parallel ATA (PATA). A PATA cable can have up to
    three connectors—one for the motherboard or disk controller card and two more
    for up to two hard disks. Alternative names for PATA (or specific variants of
    it) include Integrated Device Electronics (IDE) or Enhanced IDE (EIDE). The ATA
    Packet Interface (ATAPI) standard defines a software interface that helps ATA
    manage'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'other than hard disks. Although in some cases the differences between the technologies
    described by these variant terms are important, today they’re often used synonymously.


    SATA. In 2003, a serial version of the ATA protocol was created, hence Serial
    ATA (SATA). SATA is more or less software compatible with PATA, but it uses thinner
    cables that can handle just one hard disk per cable. In 2012, SATA became the
    dominant disk technology on new computers. An external variant, eSATA, provides
    high-speed connections to external hard disks.


    NVMe. The Non-volatile Memory Express (NVMe) interface was designed specifically
    to support the solid-state drive (SSD) storage standard. SSD devices do not use
    physical platters and mechanical heads to read or write data; instead, data is
    stored electronically just like in memory, but using flash memory chips that retain
    the data after power is removed from the system. Because data is read and written
    electronically magnetically, access speeds are significantly faster, and SSD drives
    are not susceptible to the same failures as PATA and SATA hard drives. SSD drives
    started out small and pricey but gotten larger and cheaper, making them realistic
    alternative to physical hard drives in many environments.


    In addition to these technologies, others exist. The Small Computer System Interface
    (SCSI) is a parallel interface that was once common on servers and high-end interfaces
    but is less common today. The Serial Attached SCSI (SAS) is a serial variant that’s
    quite similar to SATA. Both of these technologies are important because ATAPI
    is modeled after SCSI. The Universal Serial Bus (USB) interface is often used
    for connecting external disks.


    > Most Linux distributions treat SATA, SAS, and USB disks as if they were SCSI
    disks from a software perspective and create a device in the /dev directory that
    begins with sd x, where x is the drive letter, starting at a. However, for systems
    that utilize the new NVMe Linux creates those device files as nvme x.


    # Partitioning a Disk


    You can think of a hard disk as a set of sectors, each of which holds a small
    amount of data—normally 512 bytes, although some disks have larger'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'sectors. The disk hardware itself does little to help organize data on the
    disk, aside from providing a means to read and write specific sectors. On-disk
    data management is left up to the OS. Disk partitions and filesystems are two
    levels of organization imposed on disks to help manage the data they store.


    Partitions are a lot like the drawers in a filing cabinet. Think of a single disk
    as the main filing cabinet, which is split up into multiple partitions, much like
    drawers. This analogy is as good as it goes, but it has its limits. Unlike filing
    cabinet drawers, disk partitions can be created in whatever size and quantity
    are convenient, within the limits of the disk''s size. A typical disk has between
    one and a dozen partitions, although you can create more.


    Disk partitions exist to help subdivide the disk into broadly purposes, such as
    partitions for different OSs or for different types of data within an OS. For
    instance, it can create separate partitions for swap space (which is used by much
    RAM in case you run out of RAM), user data files, and for the OS itself.


    Hard disks and their partitions are frequently represented in diagrams similar
    to Figure 6.1. This diagram displays partitions as subdivisions of the disk, with
    partition sizes in the diagram more or less proportional to their true sizes on
    the disk. Thus, Figure 6.1 you can see that /root is larger compared to the memory
    swap space allocated. As in the figure, partitions are uninterrupted sections
    of a disk—that is, one cannot be inside another partition.


    | /dev/sda |

    | Primary | Extended |

    | /dev/sda1 | /dev/sda2 |

    | root (/) | swap /dev/sda5 |


    **Figure 6.1.** Disk partitions are often visualized as boxes within a hard disk.


    > NOTE Some partitioning tools represent their partitions in a vertical stack
    rather than a horizontal chain. The principle is the same either way.


    The most common partitioning scheme for x86 and x86-64 computers has'
  merge: -1
  pgno: 196
- img_proc: true
  md: 'gone by various names over the years, including master boot record (MBR), MS-DOS,
    and BIOS partitioning. It supports three types of partitions:


    **Primary.** This is the simplest type of partition. A disk can have zero to four
    primary partitions, one of which may be an extended partition.


    **Extended.** This is a special type of primary partition that serves as a placeholder
    for logical partitions. A disk may have at most one extended partition.


    **Logical.** These partitions are contained within an extended partition. In theory,
    a disk can have billions of logical partitions, thus overcoming the limit of four
    primary partitions, but in practice you''re unlikely to see more than a dozen
    of them.


    MBR''s use of three type partitions is awkward and limiting, by inertia has kept
    it in place for three decades. MBR partitions have a hard limit, though: they
    can''t support disks larger than 2 TiB (tebibytes), assuming 512-byte sectors,
    which are nearly universal today.


    The Globally Unique Identifier (GUID) Partition Table (GPT) is the successor to
    MBR. GPT supports disks of up to 8 ZiB (zebibytes), which is about 4 billion times
    as large as MBR''s limit. GPT also supports up to 128 partitions by default, with
    no distinction between primary, extended, and logical partitions. In these respects,
    GPT is a superior partitioning system to MBR; however, its support varies between
    OSs. Linux supports both systems quite well. Windows can boot only from MBR when
    the computer uses the Basic Input/Output System (BIOS), and it can boot only from
    GPT when the computer is based on the Unified Extensible Firmware Interface (UEFI).
    Thus, if you dual-boot with Windows, you may need to select your partitioning
    system with care.'
  merge: -1
