    You may think of the command line as a relic from the 1970s, with not much relevance
    to computing today. Not so! Although Linux has numerous GUI programs, they''re
    mostly just flashy front ends to underlying text-mode tools. By learning those
    command-line tools, you can unlock Linux''s true power, enabling you to get your
    work done more quickly. You''ll also be able to manage the Linux GUI fail entirely,
    or should you need to log in and administer the system remotely. Command-line
    tools can also be scripted, meaning that you can write a simple program that performs
    a task more quickly or more easily than could be achieved using the standard programs
    alone. For these reasons, most chapters in this book describe both the GUI and
    command-line methods of getting things done.


    To begin command-line operations, you must know how to start one. With that task
    in hand, you must know how to run programs and how to get help. You should also
    be familiar with several labor-saving features of Linux command lines.


    # Starting a Command Line


