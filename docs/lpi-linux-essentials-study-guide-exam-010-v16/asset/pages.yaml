    ![](img/e86102be5e9fa20bd171b445b743f27b_76_0.png)


    Software is a type of intellectual property that is governed by copyright laws
    and, in some countries, patent laws. As a general rule, this makes it illegal
    to copy software unless you''re the software''s author. Open source software,
    however, relies on licenses, which are documents that alter the terms under which
    the software is released. As described in this chapter, open source licenses grant
    additional rights to software users.


    In general, open source software owes a great deal to three organizations: the
    Free Software Foundation (FSF), the Open Source Initiative (OSI), and the Creative
    Commons (CC). Each organization has a distinct philosophy and role to play in
    the open source world. There are numerous specific open source licenses, which
    are summarized at the end of this chapter, along with ways that businesses can
    use them.


    # Investigating Software Licenses


    Copyright law has existed for centuries, and as such, it wasn''t designed with
    software in mind. Nonetheless, copyright law does apply to software. Licenses
    that authors apply to their software interact with copyright law to create the
    specific rights that you have—and don''t have—use, modify, and redistribute software.
    Thus you need to understand the basic principles, as well as the differences,
    between proprietary and open source license terms.


    # Exploring Copyright Protection and Software'
