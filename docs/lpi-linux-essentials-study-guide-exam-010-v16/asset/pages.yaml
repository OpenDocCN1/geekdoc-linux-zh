    # Launching Programs


    Most desktop environments provide several ways to launch programs.


    Details can vary considerably from one environment to another. However, useful
    examples include the following:


    **Desktop Menus.** Many desktop environments provide menus along a top, bottom,
    or side edge of the screen. One or more items in these menus can give you access
    to a preselected set of applications.


    **Desktop Icons.** In some desktop environments you can place icons in the main
    area of the desktop. Clicking or double-clicking these icons then launches the
    applications. This approach generally requires customization. Some default configurations
    place a few applications in the main desktop area.


    **Panels.** Some desktop environments provide panels where icons for common applications
    appear; typically panels are on the sides of the screen. GNOME Shell (a version
    of the GNOME desktop environment) uses a configuration by default—although the
    panel appears only when you click the Activity item in the upper-left corner of
    the screen.


    **Context Menus.** You can sometimes right-click in an unused part of the screen
    to obtain a context menu with a variety of options, which may include the option
    to run programs.


    **Searching for Programs.** Some desktop environments provide a search feature
    that you can use to find a program by name. This search feature may be on the
    main screen or within a desktop menu. Typically, you type part of a program’s
    name, and programs whose names match appear in a list. You can then select the
    program that you want to run from that list.


    **Terminals.** You can launch a program called a *terminal*, which provides a
    text-mode user interface inside a window. You can run either text-mode or GUI
    programs by typing, their filenames in this window. This approach is covered in
    more detail in Chapter 5, “Getting to Know the Command Line."


