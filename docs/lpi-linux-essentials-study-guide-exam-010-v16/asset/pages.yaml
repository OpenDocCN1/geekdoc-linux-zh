  md: '# CHAPTER 12

    Understanding Basic Security


    Objectives:


    +   - 5.1 Basic Security and Identifying User Types


    ![](img/e86102be5e9fa20bd171b445b743f27b_349_0.png)


    Linux is a multiuser OS, meaning that it provides features to help multiple individuals
    use the computer. Collectively, these features constitute *accounts*. Previous
    chapters of this book have referred to accounts in passing but haven covered them
    in detail.


    This chapter changes; it describes important account principles and a few commands
    that you can use to begin investigating accounts. Related to accounts are *groups*,
    which are collections of accounts that can be given special permissions on the
    computer, so this chapter also describes groups. One account, known as *root*,
    has special privileges on the computer. Some administrators use this account to
    perform system administration tasks, than is now considered a bad practice. So
    you should understand this account and what to use in its place before tackling
    the administrative tasks described in the last few chapters of this book. These
    important topics are at the foundation of system security.


    # Understanding Accounts


    Accounts enable multiple users to share a single computer without causing one
    another too much. They also enable system administrators to track who is using
    system resources and, sometimes, who is doing things they shouldn''t be doing.
    Account features help users use a computer and administrators administer it. Understanding
    these features is the basis for enabling you to manage accounts.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '> Even a single-user workstation uses multiple accounts. Such a computer may
    have just one user account, but several system accounts to keep the computer running.


    Some account features help you identify accounts and the files and resources associated
    with them. Knowing how to use these features will help you track down account-related
    problems and manage the computer''s users.


    > There are various account types—common user accounts, system accounts, and the
    root account. Common accounts are built for users who do not need special privileges
    to complete their daily tasks, such as creating a word processing document. System
    accounts are set up for special services or programs, such as one that serves
    web pages. The root account was historically (and sometimes still today) used
    for performing system administration tasks. These topics are covered in detail
    in the “Understanding User Types” section later in this chapter.


    # Understanding Account Features


    Most account features are defined in the /etc/passwd file, which consists of colon-delimited
    lines, with each line (record) defining a account. An entry might resemble the
    following:


    ```

    rich:x:1001:1001:Richard Blum:/home/rich:/bin/bash

    ```


    The information contained in the fields of this record includes the following:


    **Username.** An account’s username is its most relevant feature. Most Linux accounts
    consist of lowercase letters, and occasionally numbers, as in rich or thn138.
    Underscores (_) and dashes (-) are also valid characters in some Linux distributions’
    usernames.


    **Password.** User accounts are typically protected by a password, which is required
    to log into the computer. Direct login to system accounts is disabled, so they
    lack passwords. (The root account is an important exception on some distributions;
    it may have a password.) The password field in /etc/passwd file usually contains
    an x, which is a code meaning that the'
  merge: -1
