  md: '# Obtaining Wi-Fi Drivers


    Unfortunately, Linux driver support for Wi-Fi hardware is fairly weak. If you
    don''t see your Wi-Fi hardware when you try to configure it, you may need to track
    suitable drivers. You can begin this task with a tool called lspci, which is described
    in Chapter 6, “Managing Hardware.” Type this command with no options to see a
    list of available hardware and search list for a wireless network adapter. For
    instance, my laptop’s lspci outputs the following line:


    ```

    03:00.0 Network controller: Realtek Semiconductor Co., Ltd.m

    RTBL8191SEvb Wireless LAN Controller (rev 10)

    ```


    This identifies the Wi-Fi adapter as a Realtek RTL8191SEvB. A search on Realtek’s
    website turns up a driver; however, this driver has to be compiled locally, which
    is a topic that’s beyond the scope of this book. You might not be lucky enough
    to find a driver in this way.


    An alternative to a native Linux driver is to use a Windows driver. This unusual
    option is possible using a package called ndiswrapper (http://ndiswrapper.sourceforge.net),
    which enables you to install Windows Wi-Fi drivers in Linux. Not all distributions
    ndiswrapper in their standard package sets, but you can usually find a binary
    package in an add-on repository.


    If all other options fail, you may need to buy new networking hardware. Many USB
    Wi-Fi adapters are available, but you should research them to find one that has
    good Linux support. You can also replace the built-in adapters on some laptops.


    # Basic Network Troubleshooting


    After you have a Linux kernel installed, you can take a few steps to check that
    things are operating properly. This section walks through the commands you should
    know to monitor the network activity, including watching what processes are listening
    on the network and what connections are active from your system.'
  merge: -1
  pgno: 444
- img_proc: true
  md: '# Sending Test Packets


    One way to network connectivity is to send test packets to known hosts. Linux
    provides the ping and ping6 commands to do that. The ping and ping6 commands send
    Internet Control Message Protocol (ICMP) packets to remote hosts using either
    the IP (ping) or IPv6 (ping6) protocols. ICMP packets work behind the scenes to
    track connectivity and provide control messages between systems. If the remote
    host supports ICMP, it will send a reply packet back when it receives a ping packet.


    The basic format for the ping command is to specify the IP address of the remote
    host:


    ```

    $ ping 10.0.2.2

    (10.0.2.2) 56 (84) bytes of data.

    64 bytes from 10.0.2.2: icmp_seq=1 ttl=14.6 ms

    64 bytes from 10.0.2.2: icmp_seq=2 ttl=3.82 ms

    64 bytes from 10.0.2.2: icmp_seq=3 ttl=2.05 ms

    64 bytes from 10.0.2.2: icmp_seq=4 ttl=0.088 ms

    64 bytes from 10.0.2.2: icmp_seq=5 ttl=3.54 ms

    64 bytes from 10.0.2.2: icmp_seq=6 ttl=3.97 ms

    64 bytes from 10.0.2.2: icmp_seq=7 ttl=0.040 ms

    C

    --- 10.0.2.2 ping statistics

    7 packets transmitted, 7 received, 0% packet loss, time 60280ms

    rtt min/avg/mdev = 0.040/4.030/14.696/4.620 ms

    ```


    The ping command continues sending packets until you press Ctrl+C. You can also
    the -c command-line option to specify a set number of packets to send and then
    stop.


    With the ping6 command, things get a little more complicated. If you''re using
    an IPv6 local address, you also need to tell the command interface to send the
    packets to:


