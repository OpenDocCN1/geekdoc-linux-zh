  md: '# CHAPTER 10

    Editing Files


    Objectives:


    +   - 3.3-3 Turning Commands into a Script


    ![](img/e86102be5e9fa20bd171b445b743f27b_304_0.png)


    Computer documents come in many forms, but one of the most basic and flexible
    is a text file. Typically, configuration files and shell scripts are text files.
    Because you will often be modifying configuration files and creating shell scripts,
    you must be able to edit text files. This chapter covers this task with an emphasis
    on the simple text-mode nano and vi editors. A few rules played by text files
    are described first; then how to select a text editor. To edit text files, of
    course, you must be able to start the editor, either on an existing document or
    to create a new one. The nano editor is fairly simple, so its operation is described
    first, followed by vi, which is a more unusual editor, by modern standards.


    # Understanding the Role of Text Files


    A text editor lets you edit documents that are stored in plain-text format. The
    American Standard Code for Information Interchange (ASCII) used to be the common
    form, but now files typically use Unicode formats to support additional characters.


    > NOTE Text files encode the ends of lines by using one or two special ASCII characters.
    End-of-line encoding differs between Unix (or Linux) and Windows, but most programs
    can handle either method.


    These formats store text documents that, by themselves, include no special'
  merge: -1
  pgno: 304
- img_proc: true
  md: formatting or embedded features. Text files cannot include graphics, use multiple
    fonts, emphasize words by italicizing them, or use other features that you probably
    associate with word processors (although markup tools provide a partial exception
    to this rule).
