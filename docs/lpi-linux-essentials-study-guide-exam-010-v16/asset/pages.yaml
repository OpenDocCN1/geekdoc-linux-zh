  md: 'program displays a message stating that the account is not available. Using
    /bin/false works in a similar way, although without the explanatory message.


    You might guess by its name that /etc/passwd holds password information. This
    isn''t normally the case today, although it was many years ago. For historical
    reasons, /etc/passwd must be readable by all users, storing passwords there, even
    as a salted and hashed password, is risky.


    > NOTE: Passwords are stored using a salted hash, a one-way mathematical process
    with random input (salt), that produces what looks like nonsense to humans. When
    a user types a password, it''s salted and hashed, and if the salted hashes matches,
    access is granted.


    Passwords today are stored in another file, /etc/shadow, that ordinary users can''t
    read. This file associates a salted and hashed password, as well as other information,
    with an account. This information can disable an account after a period of time
    or if the user doesn''t change the password within a given period of time. A typical
    /etc/shadow entry looks like this:


    ```

    rich:$6E/mFKeT5UnTQ3KqZuoA4F1l2tPUoIc[...]:18114:5:30:14:-1:-1:

    ```


    The meaning of each colon-delimited field on this line is as follows:


    **Username.** Each line begins with the username. Note that the UID is used in
    /etc/shadow; the username links entries in this file to those /etc/passwd.


    **Password.** The password is stored as a salted hash, so it bears no obvious
    resemblance to the actual password. An asterisk (*) or exclamation mark (!) denotes
    an account with no password (that is, the account doesn''t accept logins–It''s
    locked). This is common for accounts used by the system itself.


    **Last Password Change.** The next field (18114 in this example) is the date of
    the last password change. This date is stored as the number of days since January
    1, 1970.'
