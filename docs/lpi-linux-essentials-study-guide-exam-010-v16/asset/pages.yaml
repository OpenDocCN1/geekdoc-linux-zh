  md: '# Using Special Permission Bits and File Features


    When you investigate the Linux directory tree, you will encounter certain file
    types that require special attention. Sometimes you may just want to be aware
    of how these files are handled, since they deviate from what you might expect
    based on the information presented in Chapter 8. In other cases, you may need
    to adjust how you use ls or other commands to deal with these files and directories.
    These special cases include the "sticky bit", hiding files from view, obtaining
    long listings of directories, and using special execute permissions.


    # Using Sticky Bits


    Before diving into what sticky bits are, it''s easier to start out with explaining
    why we need them. Consider the following commands, typed on a system with a few
    files and subdirectories laid out in a particular way:


    ```

    $ whoami

    rich

    $ ls -l

    total 0

    drwxrwxrwx 2 root root 80 Oct 14 17:58 subdir

    $ ls -l subdir/

    total 2350

    -rw-r--r-- 1 root root 2404268 Oct 14 17:59 report.txt

    ```


    These commands establish the current configuration; the effective user ID is rich
    and the current directory has one subdirectory, called subdir, which owns but
    to which rich, like all the system''s users, has full read/write access. This
    subdirectory has one file, report.txt, which is owned by root and which rich has
    no access. You can verify that rich cannot write to the file by attempting to
    do so with the touch command:


    ```

    $ touch subdir/report.txt

    touch: cannot touch `subdir/report.txt&apos;: Permission denied

    ```


    This error message verifies that rich could not write to subdir/report.txt. The
    file, you might think, is safe from tampering. Not so fast! Try this:


    ```

    $ rm subdir/report.txt

    $ ls -l subdir/

    total 0

    ```'
  merge: -1
  pgno: 422
- img_proc: true
  md: 'The rm command returned no error message, and a subsequent check of subdir
    verifies that it''s now empty—in other words, rich could delete the file even
    without write permission to it! This may seem like a bug—after all, if you can''t
    write to a file, you might think you shouldn''t be able to delete it. Recall,
    however, directories are just a special type of file, one that holds other files''
    names and pointers to their lower-level data structures. Thus, modifying a file
    requires access to the file, but creating or deleting a file requires write access
    to the directory in which it resides. In this example, rich has write to the subdir
    directory but not to the report.txt file within that directory. Thus, rich can
    delete the file but not modify it. Result is not a bug; it''s just a counterintuitive.


    Although Linux filesystems were designed to work this way, such behavior is not
    always desirable. The way to create a more intuitive result is to use a sticky
    bit, which is a special permission that alters this behavior. With the sticky
    bit set on a directory, Linux will permit you to delete a file only if you own
    or the containing directory; write permission to the containing directory is not
    enough. You can set the sticky bit with chmod, in either of ways:


    **Using an Octal Code.** By prefixing the three-digit octal code described earlier
    in this chapter with another digit, you can set any of three special permission
    bits, one of which is the sticky bit. The code for the sticky bit is 1,, so you
    would use an octal code that begins with 1, as 1755, to set the sticky bit. Specifying
    a value of 0, as in 0755, removes the sticky bit.


    > Other odd numbers will set the sticky bit, too, but will also set special permission
    bits, which are described shortly, in “Using Special Execute Permissions.”


    **Using a Symbolic Code.** Pass the symbolic code t for the world permissions,
    as in . chmod o+ subdir, to set the sticky bit on subdir. You can remove the sticky
    bit in a similar way by using a minus sign, as in chmod o-t subdir.


    Restoring the file and setting the sticky bit enables you to see the effect:


    ```

    $ ls -l

    total 0

    drwxrxrwt 2 root root 80 Oct 14 18:25 subdir

    ```'
  merge: -1
  pgno: 423
- img_proc: true
