    # Working as root


    Linux is modeled after Unix, which was designed as a multiuser OS. In principle,
    you can have thousands of accounts on a single Unix (or Linux) computer. At least
    one user, though, needs extraordinary power in order to manage the features of
    the computer as a whole. Historically, this is the root user account, also known
    as the super user or the administrator. Knowing why root exists, how to do things
    as root (if you must), and how to use root privileges safely is important for
    managing a Linux system.


    # Understanding User Types


    Most people use computers to do ordinary day-to-day computer tasks—browse, write
    letters, manage a music collection, and so on. These activities are known collectively
    as user tasks, and they don''t require special privileges. As just noted, a Linux
    computer can have many user accounts, and the users can use the computer from
    these user accounts (also known as unprivileged accounts, unprivileged users,
    or standard users) to perform such user tasks.


    The root account exists to perform administrative tasks. These tasks include installing
    new software, preparing a new disk for'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'use in the computer, and managing ordinary user accounts. Such tasks require
    access to system files that ordinary users do not need to modify or even read.


    Another user type is a system user. These are nonlogin accounts for daemons, services,
    or applications. System user accounts typically have a low UID number; no password
    (so the account is locked); and /usr/sbin/nologin, /sbin/nologin, or /bin/false
    as their default shell.


    To facilitate performing these tasks, root can read and write every file on the
    computer. Since Linux relies on files to store system settings, this effectively
    gives root the power to change any detail of the OS’s operation, which is the
    point of having a super user account. If the computer is a workstation that’s
    used by just one individual, you may wonder why the distinction between root and
    the user account is necessary. The explanation is that the power of the root account
    can lead to accidental damage. For instance, take the rm command. If you mistype
    an rm command as an ordinary user, you can accidentally delete your own files
    but not system files. Make the same mistake as root, however, and you can delete
    system files, making the computer unbootable. Therefore, you should be cautious
    when using the root account (or not at all), a topic covered more thoroughly in
    the upcoming “Using root Privileges Safely” section.


    # Acquiring root Privileges


    When you need to perform a command-line task that requires root privileges, you
    can do so in of three ways:


    Log In as root. You can log directly as root at a text-shell or by using a remote
    login tool like SSH. You can even log into GUI mode some Linux distributions.
    Some distributions don’t allow root to log directly by default it’s dangerous.


    Use su. The su command enables you to change your identity within a specified
    shell. Type . su username to change your identity to that of the specified username.
    If you omit .username, root is assumed, so typing su enables you effectively to
    become root.


    You must, however, know the password for the target account (root or'
  merge: -1
  pgno: 365
- img_proc: true
  md: 'otherwise for this command to work. After you acquire root privileges in this
    way, you can type as many commands as root as you like. When you''re done, type
    exit to relinquish your super user status.


    You can also use su to run a single command as root. Use the -c option, as in
    . su -c to run command as root.


    If you use a dash (-) within the command, as in su - or luke, the program opens
    a login session that runs the target user''s login scripts. This can be important
    because these scripts often set environment variables as $PATH that be important
    for that user.


    > su stands for switch user or substitute user.


    **Use sudo.** The sudo command is similar to su, but it works for just one command
    at a time, which you type after sudo, similar to using su -c. For instance, typing
    sudo cat /etc/shadow enables you to see the contents of the /etc/shadow file,
    which is not readable by ordinary users. You must type either your own password
    or the root password, depending on the sudo configuration, when you use this program.
    (When using su -c, you must always type the root password.) The next command you
    type will be executed using your ordinary account privileges. Some distributions,
    such as Ubuntu and Fedora, rely heavily on sudo and don''t permit direct root
    logins by default.'
