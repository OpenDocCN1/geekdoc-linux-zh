  md: '# The wheel Group


    Linux distributions invariably provide several groups by default. One of these,
    wheel (on some distributions), is particularly important for system administration.
    Members of the wheel group are granted certain special administrative privileges,
    as the right to use the sudo command. The group name comes from the slang big
    wheel, which refers to an important person.


    Not all distributions provide this particular group—for example, Linux Mint uses
    the sudo group to allow access to the sudo command. You can grep wheel /etc/group
    to determine whether the wheel group exists on your distribution. If it does,
    see membership in this group provides access to the sudo command by typing grep
    %wheel ALL=(ALL) wheel /etc/sudoers


    Some distributions enable you to add your primary user account to the wheel group
    when you install the OS. Be aware that this phrasing is not often used; instead,
    the installer asks if you want to add the account to the “administrators group”
    or some _similar term.


    # Managing Groups from the Shell


    You can create groups from the shell by using the groupadd command, which works
    much like useradd for users but takes a smaller set of options, the most important
    of which appear in Table 13.3. Consult the program’s man pages for information
    on more obscure options.'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# Table 13.3 Options for groupadd


    | Option name | Option abbreviation | Effect |

    | --- | --- | --- |

    | --gid | -g | Provide a specific GID. If you omit it, groupadd uses the next
    available GID. |

    | --system | -r | Instruct groupadd to create a system group, which is one with
    a GID of less than 500 or 1,000, depending on the distribution. Nonsystem groups
    are normally used as user private groups. |

    | --force | -f | Normally, if you try to create a group that already exists, groupadd
    returns an error message. This parameter suppresses that error message. |


    Using the groupadd command, including setting an option, looks like this:


    ```

    # groupadd -g 1001 consultants

    ```


    This example creates a group with a GID of 1001 and a group name of consultants.
    Notice in the preceding example that the # prompt is shown, indicating that the
    root account was used to obtain the super user privileges required to complete
    this command successfully.


    After the group is added, new members can be added to the group. This requires
    the use of the usermod command and super user privileges, as follows:


    ```

    # usermod -aG consultants rich

    ```


    ```

    #

    # groups rich

    ```


    ```

    rich: users consultants

    ```


    The -aG options were used together to add the account, rich, to the new consultants
    group. If the -a option was not used, the rich account on some distributions would
