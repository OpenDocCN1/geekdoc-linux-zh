    pass $termcause to exit:


    ```

    exit $termcause

    ```


    # Summary


    Serious Linux users and administrators must have a basic understanding of shell
    scripts. Many configuration and startup files are in fact shell scripts, and being
    able to read them, and perhaps modify them, will help you administer your system.
    Being able to create new shell scripts is also important, because doing so will
    help you simplify tedious tasks and create site-specific tools by gluing together
    multiple programs to accomplish your goals. Shell scripts allow you to combine
    standard shell commands with a few specialized programming commands, such as conditional
    expressions, loops, and functions, to implement logic features often found in
    larger-scale programs.


    # Exam Essentials


    **Describe the format of a basic shell script.** Shell script files are plain-text
    files; they cannot be generated using a word processing application. The first
    line in the shell script should be the shebang combination #!/bin/sh. This indicates
    the shell that should be used to run the script. The remainder of the shell script
    is a list of commands or shell statements arranged in order in which they are
    to be run by the shell. Though not required, it''s common to use the exit statement
    at the end of a shell script to control the exit status generated by the shell,
    especially if the shell exists with any type of error condition.


    **Explain how using variables helps when writing a shell script.** Shell scripts
    use variables to store data or other information for use later in the shell script.
    You assign data to a variable using the equal sign (=). The data can be any type
    of text or numerical data, or if you redirect the output of a command to store
    in a variable by placing backticks around the command. To reference the value
    of a variable inside the shell script, precede the variable with a dollar sign
    ($). You can reference variables in shell commands as well as in shell statements.


    **Explain how to pass data to a shell script.** Shell scripts can use'
