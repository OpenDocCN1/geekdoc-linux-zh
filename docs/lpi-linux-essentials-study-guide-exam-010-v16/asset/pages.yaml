    # Understanding the Process Hierarchy


    The Linux kernel is the core of a Linux installation. The kernel manages memory,
    provides software with a access to the hard disk, does not CPU time, and performs
    other critical low-level tasks. The kernel is loaded early in the boot process,
    and it''s the kernel that''s responsible for managing every piece of software
    on a running Linux computer.


    One way the kernel imposes orders on the potentially chaotic set of running software
    is when it boots, the kernel just runs one program—usually either /lib/systemd
    or /sbin/init. These processes are then responsible for starting all the other
    programs that Linux must run, such as the programs that manage logins and always-up
    servers. Such programs, if launched directly by systemd or init, are called its
    children. The children processes can turn launch their own children. This happens
    when you log into Linux. The process that launched a given process is called its
    parent.


    > You can change which program runs as the first process by adding the init=option
    to your boot loader''s kernel option line, as in init=/bin/bash to run bash.


    The result of this system is a treelike hierarchy of processes, as illustrated
    in Figure 9.3, (“Trees” in computer science are often depicted upside down). Figure
    9.3 shows a small subset of the many processes that run on a typical Linux installation:
    just a few processes associated with a text-mode login, including the login tool
    that manages logins, a couple of bash shells, and a few user programs. A working
    Linux system will likely have dozens or hundreds of running processes. The one
    on which I''m typing words has 213 processes going at once!'
  merge: -1
  pgno: 288
- img_proc: true
  md: '![](img/e86102be5e9fa20bd171b445b743f27b_289_0.png)


    **Figure 9.3** Linux processes are arranged in a hierarchical tree.


    > > NOTE Occasionally, a process will terminate but leave behind children. When
    this happens, `init` “adopts” those child processes.


    Every process has a process ID (PID) number associated with it. These numbers
    begin with 1, `init`''s PID is normally 1. Each process also has a parent process
    ID (PPID) number, which points to its parent. Many of the tools for managing processes
    rely on these numbers, and particularly on the PID number.


    > > NOTE Internally, the kernel maintains process information in the process table.
    Tools such as `ps` and `top` (described shortly) enable you to view and manipulate
    this table.


