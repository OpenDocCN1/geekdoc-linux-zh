  md: 'chapters of this book, you should be familiar with the basics of a Linux shell.
    These include knowing how to start a shell, how to run programs in a shell, and
    how to use a shell''s time-saving features.


    Whether you need to learn more about a program to use it effectively, or solve
    a problem with a misbehaving program, getting help is often necessary. Linux provides
    several documentation resources for such situations. The first of these is the
    man page system, which documents most text-mode commands, configuration files,
    and system calls. The info page system is similar to the man page system, but
    info pages employ a more advanced hyperthreaded file format. If you need more
