    $ rm -r oldstuff/

    ```


    The -i option causes rm to prompt before deleting each file. This is a useful
    safety measure. You can use the -f (--force) option to override this setting,
    if -i is configured as the default. Several other options to rm exist; consult
    its man page to learn about them.


    > Distributions sometimes set the -i option by default for root, not for ordinary
