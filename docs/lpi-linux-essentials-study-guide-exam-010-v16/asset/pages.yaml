  md: '# Don’t Use These Passwords!


    If you do a web search on common passwords or a similar phrase, you''ll quickly
    discover websites that provide surveys showing the most typical and easily guessed
    passwords that security researchers have uncovered. Details vary from one survey
    to another, but typically common passwords include the following:


    +   - 123456

    - password

    - 12345678

    - qwerty

    - 111111

    - sunshine

    - iloveyou

    - princess

    - football

    - password1


    Such passwords are easily discovered by brute-force password-guessing programs
    .and are included in collections of passwords distributed on the Internet. Using
    such a password is barely better than using no password at all. Do yourself a
    favor and create a better one!


