    # # Understanding Case Sensitivity


    Linux''s native filesystems are case-sensitive, which means that filenames that
    differ only in case are distinct files. For instance, a single directory can hold
    files called a.txt, Afile.txt, and AFILE.TXT, and each is a distinct file. This
    case sensitivity also means, if you type a filename, you must enter it with the
    correct case–if a file is called a.txt but you type its name as Afile.txt, the
    program you''re using will tell you that the file doesn''t exist. This is different
    from what happens in Windows or (usually) in macOS, in which filenames that differ
    only in case are treated identically. In these OSs, you can''t have two files
    that differ only in case in the same directory, and you can specify a filename
    using any case variant you like. Windows also creates a short filename (eight
    characters with an optional three-character extension) for every file with a longer
    name in order to help older software that works only with such filenames. Linux
    doesn''t create alternate filenames.


    > > NOTE Apple''s Hierarchical File System (HFS+) supports both case-sensitive
    and case-insensitive variants. Apple uses the case-insensitive mode by default.


    Case sensitivity is primarily a function of the filesystem, not of the operating
    system. Thus if you access a non-Linux filesystem (on a removable disk, a non-Linux
    partition on a dual-boot computer, or using a network filesystem),'
  merge: -1
  pgno: 238
- img_proc: true
  md: 'you may find that case-insensitive rules will apply. This is particularly likely
    when accessing File Allocation Table (FAT) and New Technology File System (NTFS)
    volumes, which are common on Windows computers, external hard disks, and USB flash
    drives. A further twist on this rule is that many Linux programs, such as Bash,
    assume case sensitivity even on case-insensitive filesystems. Features such as
    command completion, described in Chapter 5, “Getting to Know the Command Line”
    may work only if you use the case in which filenames are recorded, even on case-insensitive
    filesystems.


    Ordinarily, case sensitivity creates few real problems, particularly if you use
    GUI programs that enable you to point-and-click to select files. You should be
    aware of these issues, when copying files or directories to FAT, NTFS, HFS+, or
    other case-insensitive filesystems. A directory that you want to copy files with
    names that differ only in case, you’ll end up with a disk that contains just one
    of the offending files.


    # Manipulating Directories


    You are probably familiar with the concept of directories, although you may think
    of them as “folders,” since most GUI managers represent directories using file
    folder icons. Naturally, Linux provides text-mode commands to manipulate directories.
    These include directory-specific commands to delete directories, as well as use
    of the file manipulation commands described earlier to manage directories.


    # Creating Directories


    You can use the mkdir command to create a directory. Ordinarily, you will use
    this by typing the name of one or more directories following the command:


    ```

    $ mkdir newdir

    ```


    ```

    $ mkdir dirone newdir/dirto

    ```


    The first example creates just one new directory, newdir, which will then reside
    in the current directory. The second example creates two directories: dirone and
    newdir/dirto. In this example, mkdir creates dirto inside the newdir directory,
    which was created with the preceding command.'
