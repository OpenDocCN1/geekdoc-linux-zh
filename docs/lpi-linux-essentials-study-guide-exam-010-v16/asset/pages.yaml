    # Exam Essentials


    List the various files involved in account creation and management.. When an account
    is created on a Linux system, the /etc/passwd and /etc/shadow files get new records
    in them for the account. The /etc/group file also receives a new record for a
    newly created account, because by default a group is created with the same name
    as the account. These three files lose records when an account is deleted. By
    the same token, records in the files are changed when certain modifications are
    made to accounts.


    When an account is created, a home directory is also produced, and files from
    the /etc/skel/ directory are copied into it. This home directory is typically
    named /home/ username, but the name can be different based on the distribution''s
    account creation configuration.


    Summarize the tools used for account creation and management.. The tools to create,
