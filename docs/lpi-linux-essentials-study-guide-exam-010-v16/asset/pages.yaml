    # ### Table 9.1 Common top commands


    | Command | Description |

    | --- | --- |

    | h or ? | Display help information. |

    | k | Kill a process. The top program will ask for a PID number, and if it''s
    able to kill the process, it will do so. |

    | q | Quit from top. |

    | r | Change a process''s priority. |

    | s | Changes the display''s update rate, which you then enter in seconds. |

    | p | Set the display to sort by CPU usage, which is the default. |

    | M | Change the display to sort by memory usage. |


    One piece of information provided by top is the load average, which is a measure
    of the demand for CPU time by applications. In Figure 9.4, you can see three load-average
    estimates on the top line; these correspond to the current load average and two
    previous measures. Load averages can be interpreted as follows:


    +   - A system with no programs are demanding CPU time have a load average of
    0.

    - A system with one program running a CPU-intensive task has a load average of
    1.

    - Higher load averages on a single-CPU system reflect programs competing for available
    CPU time.

    - On a computer with multiple CPUs or CPU cores, load averages can reach the number
    of CPUs or cores before competition for CPU time begins. For instance, a load
    average of 4.0 on a system with a four-core CPU reflects processes demanding exactly
    as much CPU time as the computer has available.'
