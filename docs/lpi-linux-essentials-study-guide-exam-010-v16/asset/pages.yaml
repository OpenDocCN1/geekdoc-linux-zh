- img_proc: true
  md: 'destroyed a set of important backups. Everyone makes mistakes—unfortunately,
    some mistakes can be absolutely disastrous for a company. Imagine intruders gaining
    root access to your computer: unintended changes to configuration files, damage
    to some (even if not) of the computer''s system files, and changes to ownership
    or permissions on ordinary user files, rendering them inaccessible to their true
    owners. You should take the following precautions whenever you need root access:


    +   - Ask yourself if you really need root access. Sometimes there''s a way to
    achieve a goal without super privileges or by using privileges in a more limited
    way than you''d originally planned. For instance, you might find that only root
