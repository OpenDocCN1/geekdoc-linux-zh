  md: '# Real World Scenario

    ASCII and Uncode


    ASCII dates to the 1960s. It''s a 7-bit code, meaning that it supports a maximum
    of 2⁷, or 128 characters. (In practice, ASCII uses 8 bits, so an extra 128 characters
    are available for control characters or used in ASCII extensions.) ASCII was created
    to encode the letters used in English, digits, and symbols. This original intent,
    combined with ASCII''s limited character count, makes it rather unhelpful for
    many non-English languages. ASCII just doesn''t have enough characters to handle
    all the requirements of non-English languages.


    Over the years, extensions to, and variants of ASCII, have been used to support
    additional characters and alphabets that ASCII doesn''t support. One way to do
    this is to use a code page to specify an alphabet. Each code page specifies a
    variant of ASCII that''s suitable for a particular alphabet. For instance, code
    page 866 encodes Cyrillic (the alphabet used by Russian and most Slavic languages).
    The problem with code pages is that you can generally use one at a time.


    Unicode is a more modern approach. It provides a much larger character set, allowing
    the encoding of any alphabet in common use on Earth, including the huge logographic
    writing systems used in languages such as Chinese and Japanese. The problem is
    that Unicode requires many more bits, and several ways to encode it efficiently.
    Fortunately, these Unicode Transformation Format (UTF) schemes are limited in
    number compared to code pages. Some, as of UTF-8, map the first characters in
    the same as ASCII, so an ASCII file is also a valid UTF-8 (or other Unicode formats)
    Many editors today handle UTF-8 automatically, so you can use a text editor to
    write files in any language that you like. You may still need to set localization
    options to tell Linux what sort of keyboard use and what code page to use by default
    for programs that still rely on code pages.


    If your text file is encoded in ASCII, it''s encoded in Unicode too. ASCII encoding
    is considered a subset of Unicode.


    Text files consist of lines that can vary in length from 0 characters to the file''s
    entire size and that can hold any number of data types. You might want to'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'create or edit some of these as an ordinary user; others are important for
    administering a Linux system. The main file types include the following:


    +   * Human language files

    * Programming language files

    * Formatted text files

    * Program and system configuration files

    * Program log files


    > Formatted text files encode special formatting using unique character sequences.
    Although you can edit such files with a text editor, specialized editors also
    exist for many of these file types.


    Some files contain elements of multiple categories. Email, for instance, can be
    stored in text files. An email file consists largely of human language, but email
    messages include headers, which describe the origin and destination computers,
    along with information on how the message traveled from one site to the other,
    which is similar to formatted text or log data.


    # Choosing an Editor


    All Linux distributions ship with many text editors. Broadly speaking, text editors
    fall into one of two categories: text-mode and GUI. Beginners are generally more
    comfortable with GUI editors, which can be more convenient to use even for experts.
    When a GUI is not available, you may have to use a text-mode editor. You should
    therefore familiarize yourself with at least one text-mode editor.


    Some popular text-mode editors include the following:


    The vi editor is a Unix staple. It can be fairly certain that it''s present on
    any Linux computer. It is, however, strange by modern standards—it uses multiple
    editing modes, and you must switch between them to accomplish various tasks. Many
    longtime Unix and Linux administrators like vi for its flexibility, and small
    size.'
