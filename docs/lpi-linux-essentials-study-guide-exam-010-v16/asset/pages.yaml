    - UID numbers may need to be synchronized with other computers in order to facilitate
    file sharing across computers or for other reasons.

    - Users'' home directories might change because you''ve added disk space and have
    to move some users'' home directories to a new location.

    - A user might forget a password. The system administrator can change the password
