    # Using Variables


    Another type of variable that can be set from the output of a command is also
    identified by leading dollar signs, which is typically given a name that at least
    begins with a letter, such as $addr or $name. (When values are assigned to variables,
    the dollar sign is omitted, as illustrated.) You can then use these variables
    with normal commands as if they were command parameters, but the value of the
    variable is passed to the command.


    Consider Listing 11.3, which checks to see if the computer''s router is up with
    the help of the ping utility. This script uses two variables. The first is $ip,
    which is extracted from the output of route using the grep, tr, and cut commands.
    When you assign a value to a variable from the output of a command, that command
    should be enclosed in backtick characters (`), which appear on the same key as
    the t (-) on keyboards. These are not ordinary single quotes, which appear on
    the same key as the regular quote character (") on most keyboards. The second
    variable, $ping, simply points to the ping program. It can just easily be omitted,
    with subsequent uses of $ping replaced by the full path to the program or simply
    by ping (relying on the $PATH environment variable to find the program). Variables
    like this are sometimes used to make it easier to modify the script in the future.
    For instance, if you move the ping program, you need to modify only one line of'
