    | chmod o-rwx bigprogram | rwxrwx-x | rwxwx-- |

    | chmod g-w,o-rw report.txt | rw-rw-rw- | rw--rw-- |


    # Setting the umask


    The user mask, or umask, determines the default permissions for new files and
    directories. The umask is the value that is removed from 666 (rw-rw-rw-) permissions
    when creating new files or from 777 (rwxrwxrwx) when creating new directories.
    For instance, if the umask is 022, then the files will be created with 644 permissions
    by default and new directories will have 755 permissions. Note that the removal
    operation is not a simple subtraction but a bitwise operation. That is, a 7 value
    in a umask removes the corresponding rwx permissions, but for files, for which
    the starting point is rw-, the result is --- (o), not -1 (which is meaningless).


    You can adjust the umask with the umask command, which takes the umask value,
    as in umask 022. Typically, this command appears in a system configuration file,
    such as /etc/profile, or in a user configuration file, as ~/.bashrc.'
