    The default shell in Linux distributions is the Bourne Again Shell (Bash), which
    is based on an older shell called the Bourne Shell. Other shells are available.
    Most of these are similar to Bash in broad strokes, although some details differ.
    Each account specifies its own default shell, so individual users can change their
