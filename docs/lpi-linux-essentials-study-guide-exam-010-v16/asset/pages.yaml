  md: '--comment -c Specifies the comment field for the user. (GUI tools generally
    describe this as the “full name.")


    --home home -d Specifies the account''s home directory. It defaults to /home/username.


    --expired -expire-date Sets the date on which the account will be disabled, expressed
    in the form YYYY-MM-DD. The default is an account that does not expire.


    --inactive -f inactive-days Sets the number of days after a password expires,
    after which the account becomes completely disabled. A value of -1 disables the
    feature and is the default.


    --gid default-group -g Sets the name or GID of the user’s default group. The default
    for this value is a new group named after the user.


    --groups group,... -G Sets the names or GIDs of groups to which the user belongs—more
    than one may be specified by separating them with commas.


    --create-home -m When included with useradd, creates a home directory for the
    user. This option is typically enabled by default.


    --skel skeleton-dir -k Normally, default user configuration files are copied from
    /etc/skel, but you may specify another template directory with this option, which
    is valid only in conjunction with -.


    None -M Forces the system not to automatically create a home directory.


    --shell shell -s Sets the name of the user’s default login shell with this option.
    The default is /bin/bash.


    --uid UID -u Creates an account with the specified user ID value (UID).


    --non-unique -o Enables a single UID number to be reused; this option is passed
    when creating the second or subsequent account that reuses a UID.


    --system -r Specifies the creation of a system account.'
