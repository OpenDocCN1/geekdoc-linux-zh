  md: '+   - Allocating memory to individual programs

    - Allocating CPU time to individual programs

    - Enabling programs to interact with one another


    When you use a program (say, a web browser), it relies on the kernel for many
    of its basic functions. The web browser can communicate with the outside world
    only by using network functions provided by the kernel. The kernel allocates memory
    and CPU time to the web browser, without which it couldn''t run. The web browser
    may run on plug-ins to display multimedia content; such programs are launched
    and interact with the web browser through kernel services. Any program you run
    on a computer relies on the kernel in a similar way, although the details vary
    from one OS to another and from one program to another.


    The kernel is the software “glue” that holds the computer together. Without a
    kernel, a modern computer can do very little.


    Kernels are not interchangeable; the Linux kernel is different from the macOS
