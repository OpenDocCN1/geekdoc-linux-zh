  md: '# Automotive Computers. Automobiles have included computers for years. These
    have mostly been tucked out of the way to monitor and control the engine and other
    automotive systems; however, modern cars increasingly come with computers that
    users more readily identify as being computers. They manage global positioning
    system (GPS) navigation systems, manage collision avoidance, regulate emergency
    braking, control the audio system, and even provide Internet access.


    Appliances. Televisions, refrigerators, and other appliances are increasingly
    using computers to download software updates, monitor energy use, and for other
    purposes.


    You might also think of tablet computers as falling into this category as well,
    although they can more closely resemble desktop or laptop computers. The distinction
    is mainly one of how much control the user has over the OS; embedded devices are
    used, not maintained, by end users. The system administration tasks described
    in this book are done at the factory or by using much simpler and more specialized
    user interfaces.


    # Exploring Desktop and Laptop Computers


    Linux began life on a desktop computer, and although Linux doesn’t come to dominating
    that market, desktop computers are a good way to begin learning about Linux. Laptop
    computers are similar to desktop computers from a system administration perspective;
    both types of computers are often used by a small number of people for productivity
    tasks, such as word processing, web browsing, and managing digital photos. For
    brevity, we’ll use the term desktop to refer to both types of computers from on.


    > Desktop computers are similar to another class of computer, known as workstations.
    Workstations tend to be more powerful and specialized, and they often run Unix
    or Linux.


    Linux software for such tasks is widely available and is quite good, although
    some people prefer commercial counterparts, such as Microsoft Office or Adobe
    Photoshop, that aren’t available for Linux. This preference for a few specific
    commercial products is part of why Microsoft Windows continues to'
