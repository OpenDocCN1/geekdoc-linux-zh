  md: '# Programming in Assembly Language


    In addition to compiled and interpreted languages, another option is assembly
    language. This is a language with a simple one-to-one correspondence between machine
    code numbers and the symbols that the programmer uses. Assembly language is very
    low-level, which means that a skilled assembly language programmer can produce
    compact and efficient programs. Assembly language is not very portable, though;
    it takes a lot of effort to convert a program written for, say, the x86-64 CPU
    to run on an ARM processor. Writing assembly language programs is also harder
    than writing programs in most high-level languages. For these reasons, assembly
    language programs have become rarer as computers have become more powerful; the
    speed and size advantages of assembly language just aren''t compelling for most
    purposes in the early 21st century.


    In theory, most languages can be implemented either in compiled or interpreted
    form. In practice, though, most languages are most commonly used in just one language
    or the other.


    Some languages don''t fit neatly into either category. The “Programming in Assembly
    Language” sidebar for one important exception. Some others fall into an in-between
    category, such as Java, which is compiled from source code into a platform-independent
    form that must be interpreted.


    # Identifying Common Programming Languages


    Linux supports a wide range of programming languages, including the:


    **Assembly.** As noted earlier, this low-level language can produce efficient
    programs, but it is difficult to write and is not portable. In fact, referring
    to assembly as if it were one language is a bit misleading, since each CPU architecture
    has its own assembly language.


    C. C is arguably the most important compiled language for Linux, since most of
    the Linux kernel, as well as a huge number of Linux applications, are written
    in C. C can produce fairly efficient code, but it''s easy to write buggy programs
    in C because it lacks some error-checking'
  merge: -1
