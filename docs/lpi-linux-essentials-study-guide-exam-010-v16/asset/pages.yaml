  md: '```

    # chown targetfile.odt

    ```


    This example gives ownership of targetfile.odt to rich. You can change the file’s
    principal owner and its group with a single command by separating the owner and
    group with a colon (:) or a period (.).


    ```

    # chown bob:users targetfile.odt

    ```


    This example gives ownership of targetfile.odt to bob and associates the file
    with the users group. To change the group without changing the owner, you can
    omit the owner, leaving the colon and group name:


    ```

    $ chown :users targetfile.odt

    ```


    Alternatively, you can use the chgrp command, which works in the same way but
    changes only the group and does not require the colon before the group name:


    ```

    $ chgrp users targetfile.odt

    ```


    Note that the commands used to change the owner require root privileges, whereas
    you can change the group as an ordinary user—but only if you own the file and
    belong to the target group.


    The chown and chgrp commands both support a number of options. The most useful
    of these is -R (or --recursive), which causes a change in ownership of all the
    files in an entire directory tree. For instance, suppose that the user christine
    has left a company and an existing employee, rich, must access her files. If christine’s
    home directory is /home/christine, you might type:


    ```

    # chown -R rich /home/christine

    ```


    This command gives rich ownership of the /home/christine directory; all the files
    in /home/christine directory, including all its subdirectories; the files in the
    subdirectories; and so on. To make the transition a bit easier for rich, you might
    also want to move christine’s former home directory into rich’s home directory.'
