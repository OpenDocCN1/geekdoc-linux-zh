  md: '# About the Authors


    **Christine Bresnahan** started working with computers more than 30 years ago
    in the IT industry as a systems administrator. Christine is an adjunct professor
    at Ivy Tech Community College, where she teaches Linux certification and Python
    programming classes. She also writes books and produces instructional resources
    for the classroom.


    **Richard Blum** has also worked in the IT industry for more than 30 years as
    both a system and network administrator, and he has published numerous Linux and
    open source books. Rich is an online instructor for Linux and web programming
    courses that are used by colleges and universities across the United States. When
    he is not being a computer nerd, Rich enjoys spending time with his wife, Barbara,
    and his two daughters, Katie and Jessica.'
