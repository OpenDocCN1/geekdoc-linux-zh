- img_proc: true
  md: 'Early on, Linux began to tap into this reservoir of available software. As
    noted in Chapter 1, early Linux developers were particularly keen on the GNU''s
    Not Unix (GNU) project''s software, so Linux quickly accumulated a collection
    of GNU utilities. Much of this software had been written with workstations and
    more powerful computers in mind, but because computer hardware kept improving,
    it ran fine on the x86 PCs of the early 1990s.


    BSD was a competing Unix-like OS in the early 1990s.


    Today, it has forked into several related OSs: FreeBSD, NetBSD, OpenBSD, Dragonfly
    BSD, and PC-BSD. Linux quickly acquired a devoted following of developers who
    saw its potential to bring workstation-class software to the PC. These people
    worked to improve the Linux kernel, to make the necessary changes in existing
    Unix programs that they would work on Linux, and to write Linux-specific support
    programs. By the mid-1990s, several Linux distributions existed, including some
    that survive today. (Slackware was released in 1993 and Red Hat in 1995, for example.)


    # Real World Scenario


    # The Microkernel Debate


    Linux is an example of a monolithic kernel, which is a kernel that does everything
    a kernel is supposed to do in one big process. In 1991, a competing kernel design,
    known as a microkernel, was all the rage. Microkernels are much smaller than monolithic
    kernels; they move as many tasks as they can into non-kernel processes and manage
    the communications between processes.


    Soon after Linux''s release, Linux Torvalds engaged in a public debate with Andrew
    Tanenbaum, the creator of the Minix OS that Torvalds used as an early development
    platform for Linux. Minix uses a microkernel design, and Tanenbaum considered
    Linux''s monolithic design to be backward.


    As a practical matter for an end user, either design works. Linux and the BSD-derived
    kernels use monolithic designs, whereas modern versions of Windows, the GNU HURD,
    and Minix are examples of microkernels. Some people still get worked up this distinction,
    though.'
