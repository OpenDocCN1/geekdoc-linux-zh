    # Running Programs in the Background


    When you launch a GUI program from a terminal window, the GUI program opens its
    own window or windows. The terminal window remains open but will normally become
    unresponsive. If you want to type commands in this window, you can do so by selecting
    and pressing Ctrl+Z. This suspends the running program—that is, it’s sent to sleep.
    In its sleeping state, the GUI program won''t respond to input or do any work.
    However, you can now use the terminal window to type in commands.


    After you have suspended a program, if you want to run the GUI program and to
    use the terminal from which you launched it, you can type bg (short for background)
    in the terminal. Both programs will now be active.


    If you only want to wake the sleeping GUI program, type fg. This command returns
    the sleeping GUI program to the foreground, enabling it, but once again this makes
    your terminal unresponsive. Note that, in this context, the terms background and
    foreground refer to the program’s relationship to the shell, not to the position
    of the program’s windows in a “stack” of windows on the screen.'
