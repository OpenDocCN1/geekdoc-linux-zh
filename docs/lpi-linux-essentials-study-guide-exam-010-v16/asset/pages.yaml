    Linux supports virtual terminals (VTs), which are virtual screens that can hold
    various types of information—textual or graphical. Most distributions run with
    six or seven VTs. In CentOS and Red Hat, the first VT typically runs the GUI window
    system. Fedora Workstation provides a graphical login screen on VT 1—logging into
    this screen many distributions provide a graphical login screen on VT 1 and replace
    it with a GUI when the user logs in. Other distributions use VT 7 or VT 8 for
    their login screen and GUI, leaving a text-mode display.


    You can switch between VTs by pressing Ctrl+Alt+Fn, where *Fn* is a function key.
    (When switching between text-mode VTs, *Alt+Fn* is sufficient.)


    > The notation Ctrl+Alt+Fn refers to pressing the Ctrl and holding it; pressing
    the Alt key and holding it; and then pressing the desired function key and releasing
    all keys at once. The function keys (F1 through F12) are located at the top of
    the keyboard. You pick the function number that matches the terminal number you
    want to reach. For example, you''d use the Ctrl+Alt+F3 key combination to reach
    VT 3.


