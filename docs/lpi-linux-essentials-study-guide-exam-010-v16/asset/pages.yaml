    programs), you use ex. You enter ex mode from command mode by typing a colon (:),
    typically directly followed by the name of the ex command that you want to use.
    After you run the ex command, vi returns automatically to command mode.


    Insert Mode You enter text in insert mode. Most keystrokes result in text appearing
    on the screen. One important exception is the Esc key, which exits insert mode
    and returns to command mode.


