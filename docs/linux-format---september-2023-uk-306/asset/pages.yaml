    Nearly the same size with the spectacular resolution of its predecessor, a few
    changes have been made to reduce cost - different material for the lid, single
    Z axis and USB port have been repositioned. It still has some of the old models
    are ridiculously hard to pay off the build plate - it''s not fully compatible
    with the popular third-party slicers.

    Its resolution with 22 microns of detail is astonishing - especially when you
    consider that a grain of salt is four times as big. The build plate is the small
    side for a resin printer, making this most suitable for tabletop pieces, jewellery
    and decorative objects.

    It includes everything you need to get started as you unbox the printer. You get
    a metal scraper, a plastic scraper, a disposable funnel, an allen key, a USB thumb
    drive, and 80 grit sandpaper for the build plate.

    Remember: resin is dangerous, so always use gloves and safety glasses.

    The printer comes fully assembled with the build and plate screwed into place.
    Levelling the build plate is straightforward and only takes a few minutes of the
    provided Allen key. The machine displays instructions for leveling, so you don''t
    need to squint at the manual.

    It''s a solid hunk of machinery, which is highly impressive for its construction.
    It has a sturdy build plate and metal vat that feels robust but it''s the dial
    that rails out of costs. There''s no cause for the alarms - from prints this machines
    are spectacular. It would have been nice if Printer had addressed the larger issues
    it had, which were way too much powering. Our case, can be fixed with your bottom
    exposure settings, which were greatly reduced. The plate still has the screws
    that collect resin and require serious cleaning when switches. It''s impossible
    to keep the vat clean from resin unless you are annoying you want to stay pristine.
    The build plate also raises a little too high when it''s finished with a paint,
    which allows the excess resin to splash back into the vat.

    Out of the box, it comes with ChitBox and Lychee


