  md: '# RP2040 ETH Mini Dev


    Les Ponder loves his Pi collection, but sometimes there''s some he simply can''t
    love as much...


    # IN BRIEF


    Squeezing the Raspberry Pi Pico into a smaller factor, while packing in US and
    Ethernet, the Waveshare Mini looks great, but suffers from poor documentation
    and complex steps to get project going. Others have opted to use Ethernet with
    the Pico, and they have come slightly better than this.


    we wanted like this board, truly. Waveshare''s RP2040 ETH Mini limits GPIO to
    the bare minimum, but we''ve never left asking for more: 14 digital/O pins, which
    also provide access to SPI, I2C, UART and three analogue inputs. So, we don''t
    have every pin from the RP2040, but sacrifice them for efficiency. This, is, with
    USB port at one end, Ethernet at the other—


    The board has no header, meaning at the cost of soldering it up to our own pins.
    The board has two buttons: BOOT and Reset. Boot sends the Pico into firmware BOOT
    mode. Reset saves wear and tear on the USB C port when powering the board. The
    Raspberry Pi Pico doesn''t have this, unless you make your own. The RP2040 has
    264KB of SRAM and an ARM Cortex-M0+ dual-core at 133MHz. We got 4MB of flash storage.
    Effectively—


    ![](img/19f01d8418c50f8361fc6069e917f628_41_0.png)


    Dominated by an Ethernet connection, the RP2040 ETH Mini is full of unrealised
    potential.


    Effectively demonstrating that we can control the board. We couldn''t get it to
    work. We''ve done it with a Banana Pi W and a Wiz board using CircuitPython. We
    hacked around, installed MicroPython''s requests module, but importing and running
    it failed in a matter of code. Since RP2040 ETH Mini documentation was as poor
    as we never managed to create our own network demo. We know Ethernet—the supplied
    hardware lacks.


    We''re not happy with this board. The form is excellent, the silicon GPIO pins
    are great, and the castellations mean we can solder it into our own projects.
    The effort was worth a bit of mechanical strain to get the board in place—don''t
    just rely on the shelf! Without sounding like a down, we''re just disappointed
    that the documentation makes it difficult to use. For the Wiz board, it worked.


    There seems to be cause after RP2040 Ethernet documentation, the Waveshare RP2040
    ETH Mini is similarly affected. We tested it using MicroPython to connect to our
    network but getting the networking not down, after all—can we get something working?
    Yes and no. We used the usual GPIO test, blinking LEDs and a simple I2C OLED screen
    test. That went well well, so we tried to build a network example. This is where
    it went wrong.


    Our initial goal was to create a test setup that would allow a URL to control
    an LED LAN. Simple yet—


    ![](img/19f01d8418c50f8361fc6069e917f628_41_1.png)


    # VERDICT


    DEVELOPER: Waveshare


    WEB: www.waveshare.com


    PRICE: £12.40


    | FEATURES | 6/10 | EASE OF USE | 5/10 |

    |---|---|---|--|

