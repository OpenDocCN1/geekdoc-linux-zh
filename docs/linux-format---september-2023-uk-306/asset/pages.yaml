    # Closets and their secrets


    To begin using SafeCloslet, you have to create a closet. You can create as many
    closets as you like, but you must have at least one for each drawer. The actual
    information is stored within drawers. Both closets and drawers are safeclet-protected.


    When using SafeCloslet, if the drawer already exists, SafeCloslet opens it, otherwise
    it creates a new one. For instance, the command safeclet /Documents/ will create
    a drawer within the ~/Documents.


    When you create a closet, SafeCloslet opens the closet and you can then create
    drawers. Press Ctrl+n to enter the mode to create a new drawer. You are required
    to provide a password for the top-level drawer. You can choose any name for it,
    or even leave it blank if you wish.


    If you notice the name of the closet out of place, SafeCloslet does not allow
    you to rename drawers, and it doesn''t move drawers that are inside any closet.
    This is deliberate, to protect your sensitive information. While you can provide
    any name for your closet, you cannot rename or move individual drawers within
    it.


    To open a drawer, press Ctrl+o and enter the password you used to safeclet the
    drawer.


    > If no -p is provided to the safeclet command, the specified password will be
    created in the current working directory. You can end up with multiple closets
    with the same name across different directories. If you are not careful.


    # Searching for entries


    There''s no limit to the number of entries you can create within a drawer. If
    you end up with hundreds of entries, looking for them can be quite a task. SafeCloslet
    offers a powerful search function. Press / to search the name and keys to find
    the entry you''re interested in. It matches entries in the drawer. SafeCloslet
    only looks in the name value field. It also ignores diacritics when performing
    a search, so for Twitter it yields the result.


    When multiple results are displayed, you can use the arrow keys to navigate through
    the list and press Enter to select the item.


    To access help, press ? from the Safe closet. If you directly press Esc, SafeCloslet
    shows all the results. This is optional to use within SafeCloslet.


    There''s a number of operations only available within a drawer, such as creating,
    saving and deleting a drawer, changing a password, and on. You can access to these
    from a menu within the SafeCloslet interface by pressing Esc from inside a drawer.


    To close a search, press / and then enter. If you directly press Esc, SafeCloslet
    opens the menu of the search. To exit SafeCloslet select the option from the menu
    or press Ctrl+q.


    Unlike itself, SafeCloslet doesn''t allow any operation or tweaking by deleting
