  md: '# CODING ACADEMY Breakout


    # PYGAME


    Credit: www.pygame.org


    ![](img/19f01d8418c50f8361fc6069e917f628_89_0.png)


    # Code your own Breakout retro game


    Matt Holder discovers that writing ''70s-style classic game isn''t as simple as
    he first thought.


    ![](img/19f01d8418c50f8361fc6069e917f628_89_1.png)


    +   QUICK THE EXPERT Matt Holder has worked in IT for support over a decade, and
    always tries to utilize Unix along with other installed systems.


    being of a certain age we were hooked by the original Breakout. It''s one of those
    incredibly simple-looking games that we''re going to recreate Breakout, first
    let''s describe the features added to the original. The player moves a paddle
    from left to right. This paddle stays in the same vertical position on the screen
    and is used to ensure a ball can be bounced up on the screen. The ball hits an
    array of bricks. When these bricks are hit by the ball, they disintegrate. A level
    is completed when all bricks have been hit by the ball. It is possible to make
    the game more difficult by speeding up the ball, making the paddle smaller and
    increasing the number of moving objects until they disintegrate.


    ![](img/19f01d8418c50f8361fc6069e917f628_89_2.png)


    We spent many hours on an Archimedes Pygame Friend 2. This game has the same gameplay
    as Breakout, but with extra features such as being able to collect power-ups that
    drop from the bricks and extra balls, as two balls at once; the paddle can even
    move through bricks, without bouncing them off them. There are also power-downs,
    such as reversing the left-right control of the paddle and speeding the ball up
    to an extent.


    represent the various objects on the screen: bricks, lasers and columns we need
    to initialise the sound system to play audio.


    The listing in this tutorial covers the basic data structures. Code is available
    on github.com/mattlow/Pygame Smash to be downloaded and studied, before running
    the game.


    Once the initialise is done, we load in level files. These are stored in a dictionary,
    so they are easy to reference when loading the levels. After each level completed,
    the next one can be selected from the menu.


    We are using Pygame and the Python library to create our game. This game allows
    us to build quickly and provides all the features, such as keyboard and mouse
    functionality, sound control and the ability to draw and move sprites on the screen.


    And when a level is finished, what needs to be done is that the paddle and ball
    are reset on the screen. The next level can then be started.


    Let''s have a look at some of the game mechanics. The first thing we need to do
    is set basic settings, such as the background colour, resolution and whether it
    is full-screen or not. We will need to define some variables and data structures


    # Matt and the Mechanics


    The mechanics of the game are very similar to that of Pong. When we start, the
    ball is given an initial angle, at random, and as an initial velocity. When the
    ball hits a brick, it bounces off and the brick is destroyed. The ball also bounces
    around usually within an area of the screen where the ball can bounce between
    the left, right or off the bricks. The game gets more difficult as more bricks
    disappear.


    Given that levels can be imported, it makes sense to make this as extensible as
    possible. For example, there is no hard limit to the number of rows and columns
    that can be defined for bricks. Now, however, that is bigger


