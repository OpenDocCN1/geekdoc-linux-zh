    # >> MANDBROT MAPS


    The process that we''ve evolved (subdividing a surface, applying a texture to
    it, and displacement to the scale) can be used on other maps too. For many examples,
    fractals can output many variations of the same image. It''s often possible to
    use GIMP to render the fractal image <Colours > Desaturate>. When we found this
    that the brightness was moving along way, with the parts of the map brighter than
    the other using GIMP (Colors).


    The only problem was that this tinted the map was much brighter than black, which
    could we place it at the height radius than the minimum. The solution was to use
    one of these areas with the By Color select. This selects all of the white regions
    in the image. Reapply the invert function to change it from white.


    Some Mandelbrot produced output that was more suitable than others. Xao produced
    output that was too ''bitsy'' and detailed for what we wanted, QFractal produced
    a more suitable output.


    right plane in Blender, use the Object tab. For example, a 1080px image, the scale
    to X and Y is 0.9. This gives the plane a 16-9 ratio.


    Once you have the map texture on the plane, it''s time to add the highlight and
    make the height of the vertices of the surface. To do this use displacement. The
    fractal image (heatmap) affects the shape of an object (the plane).


    Select the Modifier tab in the properties. A modifier alters the way that is rendered
    in the viewport. We found a final result by altering the underlying object. Displace
    should not be concerned if the plane moves upwards within the image.


    In Blender there should be a set of properties to edit the Displace, and the procedure
    of adding the heatmap as a texture is like that adding the map image texture.
    In this case, we need to add a new texture to the Texture tab, Click on add the
    map image texture. You should see that the height of the plane''s surfaces updates
    according to the relative brightness of the displacement. The amount of effect
    that the heatmap applies to the plane''s surface by altering the Strength and
    Blend parameters of the Displace modifier. Most of the Blender parameter sliders
    are very sensitive, double-click and then manually enter the parameter values
    or-drag the sliders for the controls.


    # Improving detail


    If you zoom into the surface of the plane, you notice height variations are roughly
    crudely produced and polygonal in nature. That s hardly surprising, as the vertices
    of the plane''s surface only up to a 100-150 resolution. The first thing to do
    to improve the output of the 3D map to make smooth shading by clicking on the
    plane and setting Shade Mode.


    We can also increase the number of vertices that make up the surface of the plane
    by using


