    ![](img/19f01d8418c50f8361fc6069e917f628_66_0.png)


    ![](img/19f01d8418c50f8361fc6069e917f628_66_1.png)


    The right-hand sidebar is dominated by the Properties editor, where we''re going
    to be spending a lot of time.


    A rendering of Ambleside from data from https://heightmap-skydark.pl. We added
    some extra contrast to the final render in Blender.


    main 3D. This gives us an empty space to work with. To delete the cube, click
    it in the viewport and press Delete.


    Add a plane (Add > Mesh > Plane) in the menu at the top of the viewport. A plane
    will suffice for our map. At the moment, it''s enough for our purpose. Its flat
    shape is defined by four vertices corrected by X and Y coordinates. We can''t
    move it because the 3D map is completely flat, and the only part we can move is
    the position on the Z axis.


    From here, we can be more specific about how we want to subdivide it.


    The parameter we can change in this case is the number of subdivisions. Put 100
    into the return box (double-click to edit it) and press Enter. You should now
    see that our plane is subdivided into squares. Press Tab to go back into object
    mode. Here we can move it back forth along the Z axis. The current mode is indicated
    in the left-corner of the viewport.


    To get rid of the problem of the plane being completely flat, we''ll need to subdivide
    it over. With this our map will be made of thousands of little squares, like a
    piece of paper. Each of these squares can be set to any height to give a 3D terrain.


    Make sure the plane is selected (left-click it) to go from object mode into edit
    mode (Tab). Right-click on the plane and select Subdivide. This only only subdivides
    the plane into four parts.


    When you clicked subdivide, you might notice a small, collapsed dialog box appear
    in the bottom-left. Press the arrow on the side of it to expand


    # A matter of import


    We''ll map the heightmap onto the vertices. The heightmap is a texture, which
    Blender will use to add vertices directly to the object. In scene, we''ll add
    the texture to the object, then apply the material to the object. It might sound
    like Blender is adding something, but it''s worth it because we can tweak the
    overall appearance of surfaces, including the texture, and can have more than
    one texture. See the step-by-step (over the page) for how to map the image to
    the plane''s surface.


    Make sure that the plane you are using for your map has the same aspect ratio
    as your bitmaps.


    # ACQUIRING THE DATA


    Provided the resolution is reasonable, you can use any source as long as you have
    a map that matches our heightmap. We can acquire source bitmaps by simply capturing
    the entire screen, if nothing else. There may be some legal restrictions affecting
    images obtained in this manner, so check the source website for information on
    this. The website at https://heightmap.skydark.pl was designed to provide map
    data for the city-building games like Cities. Skyline.


    ![](img/19f01d8418c50f8361fc6069e917f628_66_2.png)


    OpenStreetMap is tricky to navigate. Some of the best data we can find in the
    Shuttle Radar Topography Map (SRTM GL3) archive by listing datasets on the page.
    Select the OSM for Hillside and Color-Rel.


    ![](img/19f01d8418c50f8361fc6069e917f628_66_3.png)


    +   QUICK TIP

    nYou only need set of controls for this project.

    Move mouse with the middle button to rotate the view, and press the middle mouse
    button to move around.


    Getting right-click and save from the OpenStreetMap site. Don''t worry about the
    images being low resolution as they are simply source data.'
