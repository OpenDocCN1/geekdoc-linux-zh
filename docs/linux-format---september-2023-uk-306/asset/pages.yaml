    there is a yum package switch that may help save the day. Yum is also useful for
    history that is useful for troubleshooting. On RHEL/Rocky RH server, it enables
    administrators to see what command, the issues with packages and what the system
    did during the configuration. What was upgraded or removed? Yum history can tell
    you.


    Unfortunately, yum history is not for deb-based servers. There is no similar functionality
    in Apt package management systems. Apt has commands as apt list but nothing quite
    as good. A list of what was installed and where is available in /var/log/dpkg.log
    if needed, but because that log may get rotated, so long-term information may
    be lost.


    As a real example, a few months ago we had a scenario where a system was being
    upgraded but not completely, but we didn''t know what was causing the issue. Using
    the yum history command, we were able to locate the problem and address it. It
    turned out that it was erasing a package but not replacing the replacement of
    package.


    By itself, yum history command shows what has been happening and the number of
    yum commands implemented. A fresh yum with just an index is installed. Using sudo
    yum history, you can get a detailed list of transactions and a series of letters
    on what the command did: I is installed, U upgraded, E is erased, and D is downgraded.


    If you want to dive deeper into the yum command line and date time, there is a
    parameter to use:


    ![](img/19f01d8418c50f8361fc6069e917f628_70_0.png)


    > Yum undo - a useful but less known command to switch back package installations.


    Info. To see the changes made in the initial system update, for example we can
    use yum history info to get all the details of packages that were upgraded, installed
    or removed, as well.


    Note that the field - user - on an RH-based system, is the value of the who ran
    the command.


    Now that the basics are out, let''s talk about the magic. As part of yum history,
    it is possible to roll back a transaction. If you need to undo an installation
    it can be useful if something doesn''t work well: use yum history undo to remove
    a package. That operation generates a transaction ID that you could use with the
    yum history info.


    This is guaranteed to work in every scenario, except for standards where there
    should be no issue. We would never dream of undoing (reverting) a yum command,
    because there are too many packages and potentially conflicting dependencies.
    That kind of scenario is where yum snapshots help and make a revert to the previous
    state easier.


    With most commands, a break down of the command (the other useful commands) can
    be found using yum history.


    As a perfect example, yum history will show you downgrade. As the name suggests,
    this is used to downgrade the current version of a package to a lower version
    if needed.


    There are many built-in tools built to use Yum/DNF. It''s just a case of knowing
    what is true and how it be used effectively


    ![](img/19f01d8418c50f8361fc6069e917f628_70_1.png)


    ```

    root@local:~ yum history list

    ID  Date                Time    Action  Installed

    6  2023-07-09 08:47:01  install

    5  2023-07-09 08:46:53  install

    4  2023-07-09 08:46:33  install

    3  2023-07-09 23:41:25  install

    2  2023-07-09 23:41:21  install

    1  2023-07-09 23:41:12  install

    ```'
