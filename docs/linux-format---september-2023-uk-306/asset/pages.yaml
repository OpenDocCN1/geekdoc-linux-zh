    # # Creating Flutter apps


    David Bolton shows how to set up a Flutter development environment on Linux and
    how to build a simple sampler in Flutter.


    ![](img/19f01d8418c50f8361fc6069e917f628_93_0.png)


    > I''ve heard of Flutter, probably not as a cross-platform toolkit for mobile
    apps and you''re correct. But its platform extended last year to include developing
    for Linux desktop alongside for single-page apps.


    If Flutter is a toolkit, what language do you use to program it? It''s a modern
    programming language and you can also write purely in Dart. If you''re used to
    a programming language that''s more advanced than C and includes decent string
    handling, however is as complex as C++, Dart is not a mention. If you want to
    find out more, check the official website at flutter.dev or find an online editor
    that you can experiment with and run Dart.


    A way of building the interface of an application is using widgets. A widget is
    a component containing the logic, interaction, and design of a UI element. It
    can be implemented as a class in Dart and you can find out more at https://flutter.dev.


    Flutter apps are different from other types of applications. A Flutter app has
    all its widgets drawn many times per second; as much as 60 frames per second or
    faster. That makes it suitable for games gaming. The single-page web apps are
    really many times per second.


    ![](img/19f01d8418c50f8361fc6069e917f628_93_1.png)


    Flutter opens a file and enables you to create a file, such as examples. Now click
    Terminal > New


    This opens a terminal in the examples folder, where everything is created. In
    the terminal window, type the command and press Enter:


    ```

    $ flutter create myapp

    ```


    If you use any name instead of flutter it must be all lowercase. After a few seconds,
    you will see a bunch of files and folders, in the ( (console):


    If you don''t have iOS, Mac or Windows windows, feel free to delete those folders.
    You leave the web folder you want to target. Type `flutter run` to see the final
