    # A quick cleanup


    It''s worth the heightmap and the map image a quick cleanup up, and for this,
    we''ll use the image GIMP. The source we''re dealing with includes things like
    stray artifacts we wanted deleted here and there. Most of these can be equally
    applied to both the map and heightmap.


    Any elements we need to remove can be removed using the Clone tool. Then we select
    the colour of the map and then remove anything we don''t need with the Paintbrush.
    The Clone tool and the height tool may also be used to remove unwanted elements
    that are the same size of the image, such as the crop or scales. Because we need
    the heightmap and the map to line up perfectly.


    # Acquiring the data


    The first thing we need to do is acquire some map data. For the method we''re
    going to use, we require images to ''draw'' over the heightmap and a second image.
    The great thing about working like this is that it gives us a lot of freedom in
    terms of the images that we can see. The box (opposites) for on suitable heightmap
    and map image files. One to look out: make


