    modifier. as before, the modifier from the Subdivision tab, but this time, select
    Subdivision. Modifiers are processed in order, so the Subdivision modifier so
    that it sits above the Displacement modifier. What the Subdivision modifier does
    is like all modifiers, does not alter the geometry; these simple changes are made
    when the scene is shown in the viewport or rendered to a file. Notice that this
    modifier has two parameters, one to carry out in the viewport and one for the
    final. In both cases, changing this to 2 is sufficient.


    Converting back into the Material editor and tweaking some the parameters as you
    do. The Roughness parameter, which makes surface shiny and even extra shadows.
    As you increase, it becomes more matte.


    ![](img/19f01d8418c50f8361fc6069e917f628_68_0.png)


    # Lights, camera, action


    Now that we have the 3D map on the surface of a plane, we need to get it into
    a state where it is rendered. The first issue is to consider the lighting. Blender
    defaults to using a single light point which gives light to all sides of the object.
    An object like this 3D map will show more contrast and shadows into the scene.
    We need a light that is small and close to the object.


    To see the effect of the lighting, make sure the viewport is in Render mode. Click
    the light icon in top bar of the scene. Click on light to select it either in
    the viewport or in the Collection Panel at the top of the right-hand sidebar,
    and move it with your mouse.


    While you are in Grab mode, constrain the movement to a particular axis by pressing
    X, Y, or Z. To lock an axis, hold Shift to fix the button, then go into Grab mode
    and move the object in another. These shortcuts are useful when moving an object
    at an angle, or when using a pointing device such as mouse.


    You''ll notice that the default light doesn''t have much of an effect on the look
    of the scene, because it is so far away. If the light is overwhelming the area
    of the light, you can turn down its brightness. To do this, click on the light
    to select it and go to the Data tab of the light. Here, you can turn down to a
    lower value.


    If you want a lot of contrast, you can also add shadows. If there are areas of
    the map that have not enough illumination, add a second light and position it
    appropriately.


    # Camera placement and rendering


    Hopefully, the 3D map looks good at this point. If we want to render the scene,
    we need to make sure the camera is pointing in the right place. To see


    the camera at now, Press O on the numeric keypad. The simple way to orient the
    camera is to move it so that it reflects the current viewport. To view the dialog
    by pressing N. Select the Tab on this dialog, and click Camera. You can move the
    camera using the same mouse moves that you would normally use for the scene. Once
    you have got the perfect angle, don''t forget to desclect the Camera to View option.


    +   - Viewing the effect of a highlight highlights the surface of the plane without
    material and texture.


    # Animate


    Blender makes easy to animate a scene, for example, rotating an object. The animation
    timeline is at the bottom, beneath the viewport. Hover over it and press G to
    enlarge it.


    We can control the rotation of the plane object by controlling the Z rotation
    parameter in the Object tab. By default, this parameter should be locked. Click
    the small dot at the end of the parameter, it is keyed to edit.


    Once again, click on the rotation property, which should have changed into a diamond
    shape. This is a keyframe showing the rotation of 360 on frame 250. You can now
    drag the timeline cube to frame the scene. When you play the animation at the
    top of the timeline, it will rotate 360 degrees. Many properties can be animated
    in this way. For example, you can also control the movement of the camera and
    into the map.


    To render this scene as a video file, change the output format from PNG to a video
    format (Output tab). To render it, press Ctrl+F12.


    Hopefully, you''ll use some useful tips for rendering all maps and map-type data
    in Blender. Happy rendering! 2


