  md: '# HOTPICKS


    # APPIMAGE MANAGER


    # Gear Lever


    Version: 1.0.8 Web: https://github.com/mijorus/gearlever


    Appimages, Flatpaks for that matter have streamlined installation across Linux
    distros, taking away the complexities of dealing with different software tools
    and packaging formats.


    But that''s not the only shortcoming. The biggest issue, as far as AppImages are
    concerned, is their inability to integrate with the distro''s Applications menu.
    That''s where Gear Lever comes in, which helps integrate AppImages into your workflow
    with a few clicks.


    Interestingly, Gear Lever is available and can be installed with flatpak install
    flathub.org/gearlever


    AppImages come up with a blank slate. You can either drag and drop an AppImage
    into the interface to manage it or click the + icon to select it from file manager.
    After importing, you have to confirm the installation. Gear Lever also allows
    the MDS checksum of the file to help you verify the appimage''s integrity.


    ![](img/19f01d8418c50f8361fc6069e917f628_81_0.png)


    After you''ve added an app to the Application menu, Gear Lever displays a button
    that enables you to drop the app off from the menu.


    Once an app is added, Gear Lever gives you a choice of buttons: one to launch
    the app and another to add it to the distro''s Applications menu. Use the first
    to check the first one after deb own seamless


    If you''ve also got a bunch of apps, you can use Gear Lever to hold all of them
    in one place. By default, all AppImages are managed via ~/AppImages.


    You can change the location from the app''s Preferences menu. By default, Gear
    Lever helps you save space by copying the original file to a folder, but you can
    choose to keep the original file and create a copy in the destination folder.


    ![](img/19f01d8418c50f8361fc6069e917f628_81_1.png)


    Unlike traditional apt, Nala is more modern and solar. For example, ''sudo nala
    lists all packages that will be installed and upgraded, as well as the scope of
    the upgrade.


    # PACKAGE MANAGER


    # Nala


    Version: 0.13.0 Web: https://gitlab.com/volian/nala


    apt does a nice job of package management on Debian-based distros, but it leaves
    some room for improvement. Nala manages to fill that role.


    Nala, was written by Fedora''s DNF package manager, offers easier-to-read and
    output thanks to parallel downloading.


    In the official Debian Testing and Ubuntu 22.04, it comes preinstalled with apt
    nala.


    If you use an older version of Ubuntu, you can still install Nala successfully
    by using it with third-party repositories. Follow our tutorial to install Nala
    on Ubuntu:


    ```

    $ sudo echo "deb [arch=amd64,arm64,armv7] http://sources.github.com/volian/archive-scar-unstable
    stable" | sudo tee /etc/apt/sources.list.d/volian-archive-scar-unstable.list

    ```


    Get the GPG verification key:


    ```

    $ wget -qO- https://keys.github.com/volian/scar.key | sudo gpg --dearmor -o /etc/apt/gpg.d/volian-archive-scar.gpg

    ```


    ![](img/19f01d8418c50f8361fc6069e917f628_81_2.png)


    And, finally, install Nala''s legacy version:


    ```

    $ sudo apt update

    $ sudo apt install nala-legacy

    ```


    Nala is a front-end for Apt, and is compatible with the majority of apt commands.
    There are also some new commands that it can handle.


    ```

    sudo nala fetch

    ```


    helps you to find the fastest mirror to speed up package installations.


    Furthermore, Nala offers a history (see Fedora DNF package manager history) which
    records the changes made during an update, and lets you roll them back.


    ```

    sudo nala history

    ```


    displays the most recent actions. It is listed with an ID, which you can then
    use to undo the action, as so


    ```

    sudo nala history undo <id>

    ```


