    # BarrraCuda 8TB HDD


    Cheap and cheerful – that’s not how Shaning parties.


    +   SPECS

    Size: 8TB

    Model: ST8000DM04

    Cost per TB: $15.50

    Interface: SATA GB6

    Form: 3.5-inch

    Tech: CMR

    RPM: 5400

    Cache: 256MB

    Workload: 5.3W

    Capacity: 55TB/year

    MTBF: N/A

    Warranty: Two years


    One of the least expensive 8TB drives you can buy on our list of best hard drives,
    but comes at the cost of performance, warranty and reliability. Seagate uses CMR
    technology to boost up to 8TB at a relatively low price, but this has a negative
    impact on performance in write workloads and consistency. The 5,400rpm speed is
    not either. The Barracuda does well in read workloads and is adequate for media
    and backup storage; however, the 8TB WD drive contains about 50% more faster CMR
    technology. It is better and has more storage.

    Seagate''s 7,200rpm FireCuda is the better choice if you want a more robust drive
    with three-year warranty and data recovery services. The FireCuda is also faster
