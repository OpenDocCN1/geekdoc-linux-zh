    # # Render real-world

    3D maps in Blender


    Intrepid Michael Reed explores real-world maps without leaving his home and rendering
    them in Blender using various data sets.


    ![](img/19f01d8418c50f8361fc6069e917f628_65_0.png)


    D graphics editor Blender can adapt to many tasks, so we''re going to use it to
    render 3D maps from real-world data. The process is fairly simple and doesn''t
    require much in the way of Blender elements. You can take the map and height data
    from a variety of sources. When you end up with a 3D terrain, you can zoom, rotate
    and render. With Blender''s facilities, you can animate the resulting object.


    We need a 2D map image of some kind, along with a heightmap. In this case, a heightmap
    is a bitmap where the brightness represents the height of that part of the map.
    When we combine the two, we have a 3D model of map, ready for rendering.


    You can use a variety of free online sources for the map and height data. You''ve
    never been closer to use it for real life because you can use a variety of computer-generated,
    mathematical maps as inputs.


    Zoomed in - before smooth shading and the subdivision modifier, the terrain is
    crude


