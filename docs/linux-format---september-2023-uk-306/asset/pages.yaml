    Both are third-party slicers with free editions - we use Chitubox to slice all
    models. Both slicers are able to handle models, drain holes to save resin, and
    add supports.


    Phzen provided a set 8K formula for testing, which brings out the details on high-resolution
    prints. The resin itself is impressive and only requires a two-second exposure
    time per layer, or opposed to three for ordinary resin.


    We wanted to see how the Sonic Mini 8K handles non-standard resins, so we printed
