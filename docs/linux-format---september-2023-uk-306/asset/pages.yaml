  md: '# # Media-creation distributions ROUNDUP


    # # The verdict

    ## Media-creation distributions


    We''ve chosen the best known media-creation distribution, Ubuntu Studio, as the
    overall winner. KDE Plasma is a good fit for media work as it follows the traditional
    paradigms of high desktops, offering clarity and ease of use. The interface is
    great, the applications selections are seamless and the customisations that have
    been carried out save time, particularly for those new to Linux.

    AV Linux has a good selection of applications and tools, and is well customised.
    The Linux side of things adds enough useful tools to make the stuff work. For
    better or worse, it is for the user who likes to tweak things. We were impressed
    by how it runs on a low-end computer for media work. It is a media-creation distro
    for people who know their way around and aren''t afraid to roll their sleeves
    up when configuring.

    Fedora is similar to Ubuntu Studio, although it is based around another base distro,
    Fedora. It uses KDE Plasma as default. It isn''t as de-conflicted for audio performance
    as some of the others, which might mean extra configuration for the user. Fedora
    is great because it has many applications and no video editor. It is built with
    music in mind that need better media work.

    The Media OS website fails to give us a great deal of confidence about the support
    available. The distro also offers a good set of applications and tools, and has
    an attractive interface.

    Linden Design Suite has a solid base of Ubuntu underneath. We aren''t we with
    the user interface design decisions; it will have to do a lot of clicks to get
    things done. In a media environment, it exacerbates a basic problem that the categories
    aren''t very prominent. As art and design of this distribution, it has few optimisations
    for audio work.


