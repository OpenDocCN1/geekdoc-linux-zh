    # GAME LAUNCHER


    # Cartridges


    Version: 2.0.4 Web: https://github.com/kra-mo/cartridges


    having switch between multiple launchers to start games is a pain, especially
    if you have a large and diverse game library. Cartridges is one of many available
    options to help unify all your games from different launchers.


    It has support for games from popular launchers including Steam, Lutris, and Heroic.
    The tool also has many options to run Windows-games on Linux.


    Cartridges is a Flatpak and you can easily install it on Linux from Flatpak with
    flathub. Once installed, you can launch any game directly from Cartridges.


    By default, the installed apps do not show up in the application list and looks
    barren. To get started, click the + on the top-left and select the Install Games
    to allow the app to scan your computer and add any installed games.


    If, for instance you store your Steam Library at multiple locations, Cartridges
    automatically detects


    them all. You get the option to edit games manually, if you have installed them
    in a custom location.


    The app tries to have the appearance of a video game portal by listing all games
    inside a unified interface. By default, the games are sorted alphabetically, but
    you can also sort them in reverse alphabetical order, or on the basis of when
    they were last played,


    Cartridges gives you a search bar to manage your game library. There is also the
    option to hide a title from the list, as well as a menu to show only the hidden
    games.


    One of Cartridges'' touches is its ability to download games, including animated
    ones, from SteamDB, which makes it work quite speedy.'
