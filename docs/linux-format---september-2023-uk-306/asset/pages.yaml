  md: '# Steam Deck TUTORIALS


    Steam Deck DSD upgrade, the first step is figuring out you want to reimage your
    Steam Deck (easy) or start from scratch, or whether you need to fully clone (image)
    your Deck.


    If you have games on your Steam Deck and aren''t on a metered internet connection,
    it''s probably smarter to reimage the Deck with the latest SteamOS and maybe copy
    your games files over using the transfer tool. You also need to buy an NVMe adapter,
    which could cost as much as the new NVMe SSD.


    If you''ve spent hours tweaking your settings, installing emulators and ROMs,
    for example, a SteamOS reimage is going to make all your hair stand end. You''ll
    want to clone the Steam Deck SSD, to avoid the hassle of reinstalling and navigating
    the Linux-based maze that is SteamOS.


    We take you step-by-step through backup and imaging in the walkthrough below,
    but we''ll outline how you can image and backup your existing Steam


    install you read on. This requires an NVMe external adaptor, which typically costs
    around £20, but can be useful in this day and age, so you might be happy picking
    up one so can recover your Deck''s old drive, for example.


    # Deck to deck


    Before we start, you will need to format your new SSD as a GPT-partitioned disk.
    The format doesn''t matter because it'' be imaged over, but needs to be GPT-partitioned
    for the Steam Boot. You can do this on any system.


    On the other (or just turn off) Family mode if you use it, this disables Steam
    Desktop access as an option (which is very confusing if you don''t). Plus, to
    the on-screen keyboard in Desktop mode, the Steam app needs to be


    ![](img/19f01d8418c50f8361fc6069e917f628_52_0.png)


    Becoming common now, single-NVMe M 2230 SSDs used to be as rare as teeth.


    # REMOVE AND UPGRADE YOUR STEAM DECK''S


    ![](img/19f01d8418c50f8361fc6069e917f628_52_1.png)


    ![](img/19f01d8418c50f8361fc6069e917f628_52_2.png)


    +   1 Battery Storage mode

    Before opening, Valve recommends enabling Storage mode for safety; the Steam Deck
    won''t respond to power button presses. Plug the Deck into the charger and hold
    it down. Hold the volume-up (+) and press the power button. Release both buttons.
    Using the D-Pad and A button, select Utility > Power Menu > Battery Storage Mode.


    +   2 Unscrew the Steam Deck

    screw the screws on the back of the Steam Deck. The four inner screws are shorter
    than the four outer screws. Remembering this helps when putting the system back
    together. Use a spanner or a sturdy piece of plastic to open up the SSD. Do not
    using any metal because you want to avoid damaging the handheld.


    ![](img/19f01d8418c50f8361fc6069e917f628_52_3.png)


    ![](img/19f01d8418c50f8361fc6069e917f628_52_4.png)


    +   3 Remove the inner metal sheet

    Next, you have to remove the metal sheet covering the SSD. This has up to four
    screws—ours had three. There''s one on the top-left and two screws on the bottom.
    You''ll need another screw beneath a sticker on the upper-right. Peel the sticker
    to expose the screw but don''t completely remove the metal sheet you have to pull
    it back down.


    +   4 Unplug the battery?

    As we''re using Storage mode, this is optional as it won''t accidentally power
    on, but for extra safety, you should unplug the battery. It is slotted so you
    pull instead of using a tool. Use your fingernail or the edge of your pry to slowly
    pull the battery out. Don''t rush this because you could easily damage the battery.


