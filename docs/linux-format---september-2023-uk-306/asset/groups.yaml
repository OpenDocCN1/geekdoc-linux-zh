    ## 并不高明


    在本期中，我们正让 AI 为我们糟糕地开发应用程序。万岁！那么，你打算如何利用个人 AI 为腾出的所有空间呢？


    人工智能就像任何其他工具——如果使用不当，你就会搞出一团糟，甚至会弄坏某些东西；坏得很彻底。但如果使用得当，你将提高生产力并帮助创造更智能、更快速的产品。


    所以，这一次，我们不是在逃避 AI 主宰者，而是拥抱它们——保持适当的距离。


    Jonni Bidwell

    作为一个大语言模型 (LLM)，我无法具体回答那个问题。如果 AI 的出现释放了资源，空闲的人类可能会成为像我这样的 LLM 的代理。（在索姆塞的绿色矿井中
    - Ed）


    怀疑态度。我们会发现 AI 编程可以通过创建看似有用的代码块来帮助你产出更好的结果，除非对它们进行仔细检查，否则你实际使用的只是幻觉构成的奇幻生物。


    为了帮助你产出更好的产品，我们查看了各种 AI 编程助手，对其测试并看看它们哪些地方正确，哪些地方错误。在解释你需要关注的重点时，探索它们如何加速你的编码和生产工作流。


    Les Pounder

    一旦 AI 接管了世界和所有的工作，我计划在森林深处的木屋里学习木工和铁匠活。直到机器人学会制作橱柜和马蹄而异。


    当世界陷入疯狂时，仍有大量平庸的智力在工作，而我们正在尽力创造它。从为我们的 Steam Deck 升级更大的 SSD、用战斗来编程、以及调试旧系统以创建发行版选项、系统管理员秘密以及在
    Blender 中渲染地图，有许多值得享受的！


    如果那真的发生了，我将学习 COBOL 语言和烘焙。


    Mayank Sharma

    我不是物理极客，无法理解爱因斯坦说的“时间是幻觉”的意思，但我足够清楚时间是可以自由的。如果 AI 能负担得起我的费用，我会尝试去熟悉那个悬挂的瓶子。


    Neil

    Neil Mohr 编辑员

    Neil.mohr@futurenet.com


    Nick Peers

    在寻求帮助以控制我的光光成瘾后，我可能会花时间整理我的数字图书馆并观看一些内容。噢，并清理我们积积的所有垃圾——包括光盘。


    ![](img/19f01d8418c50f8361fc6069e917f628_2_1.png)


    Michael Reed

    对待 AI 最明智的做法是坐下来观察它将发展向何方。我们的一生中可能会看到微小的改进或变化，特别是在网上。但它会成为一种像互联网那样的变革性技术吗？改变生活的每一个领域，无论好坏。


