    ## What’s going from Plasma?


    Plasma 6 will contain many new bells and whistles, while some existing features
    face the chop.


    ## EURO SCEPTIC


    Work has been proceeding on the upcoming Plasma 6 desktop. According to the KDE
    Wiki, it is built on top of Qt 6 and is slated to be released in early 2024. The
    new desktop won''t be preinstalled on all systems, but KDE explains how to deploy
    the current desktop on operating systems like KDE Neon Unstable.


    Forthcoming features include significant refactor even when resources are low.
    There''s also place for a sound theme in system settings. Still, there are desktop
    features that are being removed for version 6. Speaking on the website on 26 July,
    KDE developer Nate Graham explained that a full list can be found at: community.kde.org/Plasma-6
    @NateGraham


    the removal of Khotkeys, a very handy feature that traditionally enables users
    to create global shortcuts using keys and even mouse gestures. Note that not all
    features work well, and others are buggy because the project hasn''t been active
    for long enough. Plasma 6 will remove Khotkeys altogether in favor of Global Shortcuts,
    which also supports keyboard shortcuts.


    Other features include the Windows Widgets runner, which might appear in search.
    This caused confusion for users, whose widgets were fully featured apps. Plasma
    6 is also removing some ways in which icon size can be changed to the desktop
    interface.


    Joe Boecker

    head of community, Percona.


    It''s hard to argue with the goal of the Cyber Year of new leads to be made, but
    it is important leaves to be made. In the CRA, there is no definition for open
    software beyond free and not-commercialized. However, the definition of "open
    source" includes where someone is paid to work on the project or where support
    is available. This leads to unintended consequences.


    The intended scope of this impact will affect every contributor and disadvantage
    smaller players. Those who want more harm than for European-based developers,
    leading them to consider their position. It could drive development of open source
    in other ways.


