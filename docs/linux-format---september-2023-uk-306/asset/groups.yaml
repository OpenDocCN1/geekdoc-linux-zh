    ## Raspberry Pi GPIO on PC


    PCs don''t have a GPIO header like the Raspberry Pi, but reveals that a low-cost
    add-on is all you need to join the fun. The Raspberry Pi might be poor relation
    to the PC''s performance, but diminutive single-board computer wins hands down
    in one area. While a PC''s interfacing options are limited to USB, video, audio
    and wireless networking, the Pi adds the important GPIO. In turn, it enables you
    to control and monitor external devices, actuators and sensors, and thereby work
    in conjunction with anything.


    Thanks to the board, all an ordinary computer like the Pi needs is external electronics
    and hardware. Here we''re going to show how to use the GPIO, irrespective of whether
    you are a Raspberry Pi user, this board enables you to migrate some of your projects
    to the PC using HATs or add-on boards that plug into the connector. If you''re
    finally in the PC-only world, the GPIO gives you the opportunity to get some experience
    of real-world interfacing. The GPIO is just a few pounds and adds a port similar
    in most respects to the Pi, you can


    ## Add-hardware


    While PCs don''t have a general input/output (GPIO) port as standard, whatever
    hardware solutions are available to add functionality, this is generally referred
    to as data acquisition (DAQ devices), and connect via USB or into the motherboard.
    While they usually provide digital and analog I/O, they are not more powerful
    than the Pi''s GPIO. They don''t offer any level of compatibility with the Pi
    GPIO, so migrating or using HATs is easy. However, the cost is much higher, with
    starts upwards of £100 and rising to several thousands. Lower performance limits
    might be available at hobby use.


    ## PWM BASICS


    > We''ve had a demanding application to put to the test, but did not have online
    postings about the GPIO compared to that of the Pi. We wanted to ensure it won''t
    be an issue for most users'' applications. The Raspberry Pi GPIO header is entirely
    digital, so there are no analog outputs. However, using PWM - which the Pi GPIO
    can provide via software - it''s possible to generate an analog output signal
    on the GPIO with limitations. Given that not all users will be familiar with PWM,
    here''s an intro: PWM stands for pulse modulation and the diagram (right) shows
    how it works. In the Pi, the output pin is set out as a binary 0, so the PWM width
    varies to output an analog voltage of 3.3V. In the middle part, the PWM has a
    50% pulse width, while the output parts show 25%, 75% and other frequencies. If
    the frequency of the pulses is high enough and the requirement isn''t too demanding,
    this works as well as outputting a true voltage. If you use an LC circuit to switch
    the voltage and the frequency is at least 100Hz, it will be flickering on and
    off, so it is suited for dimming the LED. Using an RC circuit (capacitor) to regulate
    the pulses and something more like the dotted red lines, this reduces the spectrum
    and allows the amplitude to change. Using a higher PWM, and a lower value of capacitor
    means the software-based PWM is not as good as the Pi''s hardware PWM. Better
    approximation to a steady voltage.

