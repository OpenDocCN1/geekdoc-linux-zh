    ## REVIEWS Linux distribution


    ## Peppermint OS


    After years of sampling Linux Mint, Mint Drake opts for something spicier in the
    Peppermint OS, which integrates cloud-based apps.


    ### IN BRIEF

    Peppermint OS is visually rich and the Calamares installer makes a setup demo.
    The Welcome Hub also has a good amount of suggested software but it has minimal
    bundled apps.


    I like many great ideas, Peppermint OS was conceived after a mentor, the one that
    you''re wondering about, Ken Devlin, also works on Linux Mint. Mint itself comes
    from the creators'' desire to build on Mint''s success but also add web integration,
    the extra juice that OS needs.


    The project has a history, previously being built on Lubuntu and incorporating
    elements of the Ubuntu desktop environment. There are two main branches of Peppermint:
    one based on Debian, while the version for this review is based on the most stable
    release of Debian (Debian 12) Xfce desktop environment and the Ubuntu thumbnail
    manager.


    With the ISO size at around 1.5GB, you have few pre-installed apps. In this first
    boot you''ll find nearly two pre-installed apps. This lightweight desktop uses
    both cloud and local apps. The OS is assigned to specific cloud-based apps like
    Kurmo, which can be launched via Search (site-specific). This is a dedicated browser
    window.


    The latest version of Kurmo comes with an updated UI and is based on the Universal
    programming language.


    It can sound a little daunting but Peppermint makes an effort to help you navigate
    the live environment. The Welcome Hub has a list of suggested apps to install.
    This lets you download the latest version of each from repositories. If you want
    to install apps from other repositories, you will need to update the Sources file
    manually.


    If you''re happy with what''s on, the latest version of Peppermint has now divided
    this into two sections: Software and Browsers, to make the layout simpler -


    You can also launch the Package manager or download and set up Software Manager.
    The Welcome screen is, in fact, one of the features in the latest version of Peppermint.


    The most recent iteration of the OS, version 2023-07-01, has also updated its
    preferences for users'' home directory. This is where we learned about hblock,
    a super version of the regular hosts file in Debian and its derivatives. It includes
    a list of domains that are known for.


    ### SPECS

    - CPU: 1GHz

    - MEM: 1GB (4GB recommended)

    - HDD: 10GB (recommended)

    - Architecture: x86_64


    Peppermint offers a way to install popular software and web browsers, like Firefox
    ESR, ads, tracking scripts, and prevents the cloud-based apps from connecting
    to them.


    The Pep Docs also includes the bundled XDaily tool, a command-line system updater/upgrade
    that once launched, requires you to answer Y/N to perform tasks such as updates,
    removing old caches and updating icons. You can also access the system using this
    little blue icon in the system tray.


    The help guide points out the different range of packages offered, so though it''s
    down to you to decide what''s best for your needs, the desktop experience of Peppermint
    uses the Metawire theme and Papela icon set. These circular icons are easy to
    find and easily added to the launch bar.


    If you decide to give Peppermint a try, a setup is a breeze via the Calamares
    installer. From there, you''re mostly on your own if you haven''t previously installed
    cloud-based apps. The team maintains a thriving forum, Matrix channel and Mastodon
    page.


