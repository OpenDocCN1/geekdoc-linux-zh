    # ADMINISTERIA


    Stuart Burns is a Linux administrator for Red Hat 500 company, specialising in
    Linux.


    # Docker is dead, long live Docker


    Docker has been the king of containers but could Podman put an end to Docker''s
    dominance?


    # >> ROCKY ROAD AHEAD?


    I was a big fan of Red Hat. Until the announcement that it closed the previously
    public access to the source code of RHEL in favor of CentOS. The only people left
    to obtain or use the exact version of Red Hat are customers. See https://redhat.com


    Everyone knows about Docker. In fact, a lot of users configure containers and
    images with Docker. However, today, there are many alternative choices including
    from Red Hat. Part of Red Hat Podman was allowed to run rootless and daemonless,
    thereby more securely by default (a Docker group has no root privileges). It has
    a Docker-compatible command line for those just checking it out, so there be no
    issues. It also has a free-to-use GUI that has features (in our point of view)
    of Docker Desktop.


    Red Hat is trying to drive this as a good thing because in place of it is telling
    people (including us) to the source to build a 1:1 highly compatible kernel to
    use Red Hat CentOS Stream release. One of the Rocky Linux came into is the changing
    of CentOS from a stable release to beta release which is essentially a rolling
    testing/beta release, making it unsuitable for production since they can''t afford
    RHEL licence fees.


    Just because Red Hat doesn''t mean, leaves other Linux vendors out. In for example,
    performing image search podman on Ubuntu reveals all the default tools to install.
    Podman of new images and so more RH tools (all) but it also includes a GUI for
    container and image management. The containers work the same tasks as the Open
    Initiative, which details interoperability and your requirements.


    Podman is fully open source, and free from constraints around licensing. While
    compatible with Docker, it comes with its own build process tools.


    This will make it very interesting for Rocky, and many people interestingly, Oracle
    put big money to get right containers moved to OCI. Having involved in a migration
    to Oracle Red Hat-compatible offerings at cheaper prices than Red Hat, understanding
    the reason behind why Oracle is best off Red Hat using Red Hat''s code.


    # LXD got bagged by Canonical


    But that is understanding you remember Red Hat''s ultimate under IBM, a company
    seen as of most of the out with red. LXD is transferred to Canonical in the hope
    of making great strides.


    Canonical has taken stewardship of the extension for LXC (Linux Containers). The
    Linux Containers pointed out that everything LXD will remain under stewardship:
    Canonical, the creator and maintainer of the LXD project, has decided that over
    eight years as part of the Linux Communities, the project would now be served
    directly under Canonical''s set of projects.


    As the reason why seem to boil down to the fact that over the last years, has
    been limited development of LXD, and under Canonical''s guidance, it can integrate
    it into versions of Ubuntu, and extend the functionality to handle the whole experience
    on Linux.


    For using LXD, there is no to fret. It is still its open source and free nature.
    The Git repository has been moved over Canonical''s stewardship. Further details
    can be found at: https://linuxcontainers.org/


    I suspect this will cause more heads and back for Red Hat than advantageous ever.


    - LXD is under Canonical''s direction. New features or some old LXD?


    # Who installed?


    Yum is more than a way to install installations - it can do all sorts of interesting
    stuff.


    Red Hat users get yum install it -y or basic installation. when things goes wrong,
    there is a yum package switch that may help save the day. Yum is also useful for
    history that is useful for troubleshooting. On RHEL/Rocky RH server, it enables
    administrators to see what command, the issues with packages and what the system
    did during the configuration. What was upgraded or removed? Yum history can tell
    you.


    Unfortunately, yum history is not for deb-based servers. There is no similar functionality
    in Apt package management systems. Apt has commands as apt list but nothing quite
    as good. A list of what was installed and where is available in /var/log/dpkg.log
    if needed, but because that log may get rotated, so long-term information may
    be lost.


    As a real example, a few months ago we had a scenario where a system was being
    upgraded but not completely, but we didn''t know what was causing the issue. Using
    the yum history command, we were able to locate the problem and address it. It
    turned out that it was erasing a package but not replacing the replacement of
    package.


    By itself, yum history command shows what has been happening and the number of
    yum commands implemented. A fresh yum with just an index is installed. Using sudo
    yum history, you can get a detailed list of transactions and a series of letters
    on what the command did: I is installed, U is upgraded, and D is downgraded.


    If you want to dive deeper into the yum command line and date, there is a parameter
    to use:


    > Yum undo - a useful but less known command to switch back package installations.


    To see changes made in initial system, for example we can use history info to
    get all the details of packages that were upgraded, installed or removed, as well.
    Note that on RH-based system, is value of who ran the command. Now that the basics
    are out, let''s talk about the magic. As part of yum history it is possible to
    roll back transaction. If you need to undo something doesn''t work well: use history
    undo to remove package. That operation generates transaction ID that you could
    use with history info, except for standards where there are potentially conflicting
    dependencies. That kind of scenario help and make revert to the previous state
    easier. With a perfect example, yum history will show you downgrade the current
    version of package to a lower version if needed There are many built-in tools
    built to use Yum/DNF. It''s just a case of knowing what is true and how be used
    effectively.


    ```

    root@local:~ yum history list

    ID  Date                Action  Installed

    1  2023-07-09 23:41:12  install

    2  2023-07-09 23:41:21  install

    3  2023-07-09 23:41:25  install

    4  2023-07-09 23:46:33  install

    5  2023-07-09 23:46:53  install

    6  2023-07-09 08:47:01  install

    ```


