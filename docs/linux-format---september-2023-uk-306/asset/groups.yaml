    # TUTORIALS


    # SAFECOLOST


    Credit: https://github.com/Safelist/safelist


    ## Best kept secrets


    A man who keeps his cards inside his chest, he himself, we struggled to persuade
    Shashank Sharma to reveal how he protects his passwords.


    Everybody''s got something to hide except me and mine. However, the Beatles beat
    us to the day. The correct phrase for the modern world would be ''Everybody''s
    got something to hide, especially me and mine.'' If you''re still keeping your
    passwords and other important information in a draft email, one of the mistakes
    people make is using the same username and password combinations across different
    online services because of unwillingness, unfortunately, to remember multiple
    login credentials. With Safelist, you can store all your login credentials and
    other information protected anywhere. There are many password managers on offer,
    rather than surrendered to the party you choose. With them built into multiple
    desktop browsers, you access your secrets at your fingertips, your service can
    never be compromised.


    ![](img/19f01d8418c50f8361fc6069e917f628_49_0.png)


    | Safelist | additions | changes |

    |---|---|---|

    | class3 | | |

    | leakages@example.com | | |

    | example@gmail.com | | 11/25 2021 08:46 86% |


    You''ll have to check the Safelist GitHub page or the website (safelist.io/) for
    a complete list of features. For now, you''ll appreciate that the project is cross-platform,
    which makes it possible for you to access your secrets from Windows, Mac and Android
    devices.


    Written in Rust and under GPL-3, the license is not available in the software
    repositories of desktop distro. If you have Rust and Cargo installed, you can
    use your distro package manager to install these: sudo dnf install rust cargo
    installs these on RPM-based distros. You can similarly run sudo apt-get install
    rust cargo if you''re running Ubuntu, Debian, or a derivative.


    You can now use Safelist from the source, First clone the Safelist repository
    with git clone https://github.com/Safelist/safelist, then navigate to the safelist/directory
    and run cargo install --path .


    Alternatively, you can use the ZIP file from the Releases. This creates multiple
    copies:


    ## YOUR SECRETS


    When adding to an entry, you can press the Tab key after adding the value to create
    a new entry, or press Enter to create a new entry in the current drawer.


    Safelist''s top bar is deliberately bare so you can see whether there are any
    unsaved changes. To save, press Ctrl+S as creating a new entry, press Ctrl+S to
    close the currently open drawer. Safelist automatically saves changes in the drawer
    before closing. If you want to edit an entry in your drawer, delete it from the
    list and press Ctrl+Down Arrow. When adding the value for an entry in a drawer
    to create a new line:


    You can also use the menu, which is accessed by pressing Esc, to select what you
    want to perform, including the password for the drawer. It''s also possible to
    import data from a drawer in current-drawer or a drawer in another context. Safelist
    will not create an empty secret file. In so, in the example, the ~/secrets/binfiles
    file is not created until we create it with some new entries within it. It''s
    good practice to keep the file empty and as an added safety measure.


    50 LINUX September 2023


    www.lifformat.com


    # Terminal TUTORIAL


    move the suitable safeclet to a directory in your PATH. In this case, use the
    build/x86_64-linux/safeclet file to the ~/Local/bin


    navigate the entries in a drawer using the up and down keys. To view the secret
    for an entry hit enter to be displayed, for other entries stay hidden. If you
    want to keep the passwords and phrases for the entries in a drawer, you can start
    safeclet with the -h command. The switch safeclet /Documents/ will show all the
    entries in the drawer and the values in the values are hidden.


    ## Closets and their secrets


    To begin using SafeCloslet, you have to create a closet. You can create as many
    closets as you like, but you must have at least one for each drawer. The actual
    information is stored within drawers. Both closets and drawers are safeclet-protected.


    When using SafeCloslet, if the drawer already exists, SafeCloslet opens it, otherwise
    it creates a new one. For instance, the command safeclet /Documents/ will create
    a drawer within the ~/Documents.


    When you create a closet, SafeCloslet opens the closet and you can then create
    drawers. Press Ctrl+n to enter the mode to create a new drawer. You are required
    to provide a password for the top-level drawer. You can choose any name for it,
    or even leave it blank if you wish.


    If you notice the name of the closet out of place, SafeCloslet does not allow
    to rename drawers, and it doesn''t move drawers that are inside any closet. This
    is deliberate, to protect your sensitive information. While you can provide any
    name for your closet, you cannot rename or move individual drawers within it.


    To open a drawer, press Ctrl+o and enter the password you used to safeclet the
    drawer.


    > If no -p is provided to the safeclet command, the specified password will be
    created in the current working directory. You can end up with multiple closets
    with the same name across different directories. If you are not careful.


    ## Searching for entries


    There''s no limit to the number of entries you can create within a drawer. If
    you end up with hundreds of entries, looking for them can be a task. SafeCloslet
    offers a powerful search function. Press / to search the name and keys to find
    the entry you''re interested in. It matches entries in the drawer. SafeCloslet
    only looks in the name field. It also ignores diacritics when performing a search,
    so it yields the result.


    When multiple results are displayed, you can use the arrow keys to navigate through
    the list and press Enter to select the item. To access help, press ? from SafeCloslet.
    If you directly press Esc, SafeCloslet shows all the results. This is optional
    to use within SafeCloslet.


    There''s a number of operations only available within drawer, such as creating,
    saving and deleting drawer, changing password, and on. You can access these from
    a menu by pressing Esc from inside drawer. To close search, press / and then enter.
    If you directly press Esc, SafeCloslet opens the menu. To exit select the option
    from menu or press Ctrl+q. Unlike itself, SafeCloslet doesn''t allow any operation
    or tweaking by deleting config files or using commands. For users to perform all
    operations within SafeCloslet''s TUI is yet to integrate.


    After having a number of passwords over the years, you can confidently state that
    your safeclet is favourite. To create a new closet in the current closet, you
    can start relating information to SafeCloslet. To begin, press . The SafeCloslet
    interface splits into two panes. The left provides a name to identify the information
    you wish to store, and on the right pane the actual information is safeguarded.


    | Name | Value |

    |---|---|

    | closet 1 | password |

    | closet 2 | When working in several closets |

    | closet 3 | A good idea to store passwords in secret closet |

    | closet 4 | Passwords and phrases can have spaces |

    | closet 5 | |


    ![](img/19f01d8418c50f8361fc6069e917f628_50_0.png)


    By default, all the secrets stored in the value field are visible. You can see
    Ctrl+h to hide them. Subscribe now at http://bit.ly/LinuxFormat


    www.techradar.com/pro/linux | September 2023


    LXF


    # TUTORIALS Steam Deck


    # STEAM DECK


    ## Upgrade your Steam Deck


    Neil Mohr asked pc gamers and Katie Wickens to upgrade a Linux device – what could
    possibly go wrong?


    > Before start warning: opening your Steam Deck and upgrading it invalidates your
    warranty. Do so entirely at your own risk. Linux cannot hold responsible for any
    damage or anything. On a less level, it is a good idea to wait until your warranty
    has expired, otherwise let''s continue!


    The Steam Deck has transformed into a handheld story. While the base model is
    an affordable £350, you can expand it via the microSD slot, but its speeds are
    much slower than the internal storage.


    ![](img/19f01d8418c50f8361fc6069e917f628_51_0.png)


    The Steam Deck has something of a Linux-powered phenomenon.


    ## OUR EXPERT


    Neil Mohr only gets to see his Deck once in a while through the sweaty grip of
    a six-year-old playing Batman. With solid-state storage costs plummeting, the
    good news is that if you don''t mind opening up Steam Deck (and invalidating any
    warranty), you can easily swap the internal storage for 256GB.


    ## PERFORMANCE OVER


    - Steam Deck

    - 2230

    - NVME SSD

    - Tweezers, plenty of

    - PH1 screwdriver

    - 8GB USB-C drive (or USB-C adapter)

    - NVMe adapter (clone) (option)


    Knowing how to evaluate the performance on the Steam Deck helps you get more out
    of it. Additionally, the Steam Deck shows performance of the desktop version of
    Linux launcher and marketplace. You can measure the performance of any game''s
    frame rate. It is important if you want to see how well a game perform at different
    graphics. Steam Deck also provides additional metrics that could be useful, and
    they can help you figure how to tweak settings to maintain performance or battery
    life than the desktop version. That''s quite easy by bringing up the Quick Access
    Menu (STEAM). Within the Performance section, you can see various metrics. Moving
    to higher levels shows more performance metrics. Each different feature gives
    an excellent job of how a game runs on Steam Deck.


    Click the Q button, which is located on the right-hand side of the screen, tap
    to touch. You can see five different tabs. Scroll down to the icon, which represents
    the performance tab, and press A to enter this menu. You''ll find the performance
    level beneath the battery life counter. Head to Performance Overlay Layer and
    press A to enter this sub.


    You''ll see for four performance-overl on a slider. Move the slider right or left
    to select different levels and see the current frames per second. Higher level
    displays show different things as GPU and CPU performance percentages and more.


    Also Click on View to see what you set. You can set frame rate, limit rate, refresh,
    and manual GPU clock control and more. It can get more granular, but this is one
    of Steam Deck''s main features that is customizable. Click the B button a couple
    of times to hide the screen to exit. To disable metrics, just follow the previous
    steps.

