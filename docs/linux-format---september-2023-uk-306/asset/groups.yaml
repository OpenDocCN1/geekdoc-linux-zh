    # 管理之道


    Stuart Burns 是 Red Hat 500 公司的 Linux 管理员，专攻 Linux 领域。


    # Docker 已经过去，Docker 万岁


    Docker 曾一直是容器领域的霸王，但 Podman 能终结 Docker 的统治地位吗？


    # >> 前路坎坷吗？


    我曾是 Red Hat 的大忠实粉丝。直到他们宣布关闭了此前对 RHEL 源代码的公开访问，转而支持 CentOS。现在，唯一能获取或使用 Red Hat
    精确版本的人只剩下客户了。请访问 https://redhat.com


    每个人都知道 Docker。事实上，很多用户使用 Docker 来配置容器和镜像。然而，今天已经有了许多替代方案，包括来自 Red Hat 的选择。Red
    Hat Podman 的部分功能允许无根权限（rootless）和无守护进程（daemonless）运行，从而在默认情况下更加安全（Docker 组没有 root
    权限）。对于那些刚开始尝试的人，它提供了与 Docker 兼容的命令行，因此不会出现问题。它还提供了一个免费使用的 GUI，其功能（在我们看来）具有 Docker
    Desktop 的特点。


    Red Hat 正在试图将此视为一件好事，因为与之相对的是，它告诉人们（包括我们）去源码构建一个 1:1 的高度兼容内核，以使用 Red Hat CentOS
    Stream 版本。Rocky Linux 的出现原因之一是 CentOS 从稳定版转变为测试版，这在本质上是一个滚动测试/beta 发布版，使其不适用于生产环境，因为他们无法负担
    RHEL 的许可费用。


    仅仅因为 Red Hat 不这么做，并不意味着排除了其他 Linux 供应商。例如，在 Ubuntu 上执行 `sudo podman image search`
    会显示出所有默认的安装工具。Podman 可以获取新镜像以及更多 RH 工具（全部），但它也包含一个用于容器和镜像管理的 GUI。这些容器执行的任务与 Open
    Initiative 相同，该组织详细说明了互操作性以及您的需求。


    Podman 是完全开源的，不受许可限制的影响。虽然它与 Docker 兼容，但它有自己的构建过程工具。


    这会让 Rocky 变得非常有趣，而且很多人很有趣的是，Oracle 投入了巨资将正确的容器迁移到 OCI。由于参与了迁移到比 Red Hat 更便宜的 Oracle
    Red Hat 兼容方案，我们理解了为什么 Oracle 最好是使用 Red Hat 的代码。


    # LXD 被 Canonical 收编


    但请记住 Red Hat 在 IBM 麾下的地位，IBM 一直被视为与红色帽理念不合的公司。LXD 被转移到了 Canonical，希望以此取得巨大进展。


    Canonical 接管了 LXC（Linux 容器）的扩展。Linux Containers 指出，所有 LXD 内容都将留在 Canonical 管理下：作为
    LXD 项目的创建者和维护者，Canonical 决定在作为 Linux 社区的八多年后，该项目现在将直接在 Canonical 的系列项目下服务。


    原因似乎可以归结为事实：在过去的几年里，LXD 的开发有限，而在 Canonical 的指导下，它可以将其集成到 Ubuntu 版本中，并扩展功能以处理 Linux
    上的完整体验。


    使用 LXD 无需担心。它仍然保持着开源和免费的本质。Git 仓库已迁移到 Canonical 管理下。更多细节请参阅：https://linuxcontainers.org/


    我怀疑这给 Red Hat 带来的麻烦将比任何时候都多。


    - LXD 由 Canonical 指导。是新功能还是某些旧的 LXD？


    # 谁安装的？


    Yum 不仅仅是一种安装方法——它还可以做许多有趣的事情。


    Red Hat 用户通过 `yum install -y` 或基础安装来获取它。当出现问题时，有一个 yum 软件包切换功能可能帮上大忙。Yum 的历史记录功能对于故障排除也很有用。在
    RHEL/Rocky RH 服务器上，它允许管理员查看执行了什么命令、软件包问题以及系统在配置期间做了什么。什么被升级或删除了？`yum history`
    可以告诉你。


    遗憾的是，`yum history` 不适用于基于 deb 的系统服务器。在 Apt 软件包管理系统中没有类似的功能。Apt 有诸如 `apt list`
    的命令，但没有完全那么好的。如果需要，安装了什么以及位于何处的列表可以在 `/var/log/dpkg.log` 中找到，但由于该日志可能会轮，所以长期信息可能会丢失。


    作为一个真实的例子，几个月前我们遇到过一种情况：系统正在升级但没有完全完成，我们不知道是什么导致了问题。使用 `yum history` 命令，我们能够定位问题并解决它。结果证明是删除了一个包但没有替换该包。


    `yum history` 命令本身显示了发生了什么以及执行了多少次 yum 命令。安装了一个仅包含索引的全新 yum。使用 `sudo yum history`，你可以获得事务的详细列表以及一系列关于命令操作的字母：I
    表示安装（installed），U 表示升级（updated），D 表示降级（downgraded）。


    如果你想深入研究 yum 命令行和日期，有一个参数：


    > Yum undo - 一个有用但少为人知的命令，用于切回软件包安装。


    要查看初始系统所做的更改，例如我们可以使用 `history info` 获取所有已升级、安装或删除的包详情。注意，在基于 RH 的系统上，该值是运行命令的人。现在基础知识说完了，让我们来聊聊魔法。作为
    `yum history` 的一部分，可以回滚事务。如果你需要撤销某些运行良好的操作：使用 `history undo` 移除包。该操作会生成事务 ID，你可以将其配合
    `history info` 使用，但在存在潜在冲突依赖的标准下例外。那种场景有助于并让恢复到之前的状态变得更容易。有一个完美的例子，如果需要，`yum history`
    将显示你将当前软件包版本降级到较低版本。有很多为了使用 Yum/DNF 的内置工具。这只是一个了解什么是真实的以及如何有效使用的问题。


    ```

    root@local:~ yum history list

    ID  Date                Action  Installed

    1  2023-07-09 23:41:12  install

    2  2023-07-09 23:41:21  install

    3  2023-07-09 23:41:25  install

    4  2023-07-09 23:41:30  install

    ```

    '
