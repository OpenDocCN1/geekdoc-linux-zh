    ## Beyond proxy hosts


    Proxy hosts are specified by web (http/) instead of directing to a specific device
    and port. Redirect for non-web traffic can be configured using Streams (found
    below). Nginx Proxy Manager offers two types of hosts:


    - Redirection from one to another (the domain redirected to your home network)

    - 404 Hosts which allow to redirect traffic at your home network to a customised
    error page


    This proxy is defined under Settings > Default Site - redirecting users to a single
    (and irrelevant) connection to set up, but you can replace it with a 404 error
    page or insert your own HTML code.


    ## STREAMS


    If you want non-web traffic, such as a proxy-to-peer connection or a game, you
    need to set up Streams. These tunnel TCP/UDP traffic from your network to a specified
    device within your LAN. First, you need to configure your router to forward any
    traffic on those ports to the running Nginx Proxy Manager. Once in place, you
    need to shut down and destroy the container:


    ```bash

    docker stop nginx-proxy-manager

    docker remove nginx-proxy-manager

