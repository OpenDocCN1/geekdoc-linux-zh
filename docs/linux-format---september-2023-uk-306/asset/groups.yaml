    # Thoughts on Fortran


    I''ve read consistently that Fortran remains the fastest-executing language, one
    reason why it is so dominant in some aspects of high-end computing to today (not
    widely known among JF membership). Imagine even with C, though both are compiled,
    and C is commonly thought of being closer to the metal.

    Fortran is sometimes developed as function calls in other languages, such as MATLAB;
    C is used in the same way. How many people know that MATLAB was written in Fortran?
    Or that its vector starts with it? 0. Why not over C? It''s as fast as x86, ARM,
    GPUs, and CUDA as other languages? You could talk about the criteria and prospects
    for adding more (like GPL licensing the main barrier, for instance) and offer
    predictions about the implications of this for the future


    ![](img/19f01d8418c50f8361fc6069e917f628_16_1.png)


    way to answer your questions. We''ll be looking at Mureka down the line; it''s
    a complex area and it''s not helped by the fact that some people want a straight
    Android replacement when mobile devices are looking for Linux on mobile devices.


    # Retro Format


    I''m using a Raspberry Pi 4 GB with Raspberry OS on a 64 GB SD, all accessed via
    RealNC, as the RTP didn''t seem like. I''m not planning on using the Pi for emulation
    but rather for hosting lobbies for my friends. I installed the Yuzura emulator
    via Flatpak, which works fine when it works, but I couldn''t get it to work with
    Flatpak or AppImage - even trying an executable, the Snap says isn''t ARM64-compatible.


    Basically, I''ll need to try an N64 emulator with the Agz plugin, and the PSX
    emulator using Netplay, but a Docker setup seems an interesting option - I have
    no idea what that would entail, though.


    Richard Smart


