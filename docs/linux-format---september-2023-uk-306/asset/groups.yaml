    ## 只是在闹 Bug (JUST BUGGININ'')


    Jon Masters 关注着 Linux 内核的所有最新动态，让你无需费自操心。Jon Masters 是一位内核黑客，参与 Linux 超过 20 年，致力于低能
    ARM 系统的工作。


    Linus Torvalds 宣布 Linux 额外的候选版本（即“发布”周期）看起来仍然很早期。现在的事实是，自 6.2 版本发布以来，我们有一个非常规律（特定的）模式；我们在
    6.2、6.3 和 6.5 版本的调用中进行了 32 次未合并的操作。Leerheim 继续维护回归问题，包括一些影响内核的某些板级问题（include/linux/buffer_head）“buffer_head：buffer_head
    曾映射到页内存中的单个（磁盘）缓冲区，当然以及通过文件系统层进行使用。如今，基本单元和 buffer-heads 被用于跟踪块映射（通过 get_block）、以及子块的跟踪（通过页面提交
    page submission）”。


    内核的不同部分正在被修复，但尚未完全修复。现代处理器的速度比它们每次访问必须等待的内存快数千倍，我们的现代时代已变成了一个真正的瓶颈。


    我喜欢谈论各种行为的细微差别，包括关键安全漏洞，特别是推测执行硬件如何通过 Spectre 引起广泛的关注和注意力，允许用户提取他们无权访问的信息。“要移除某些根深蒂固的东西将需要一些时间，Christopher
    最新的补丁允许在不带 buffer_heads 的情况下构建内核。”


    感谢 Christopher Hellwig 对 Linux 和文件系统的贡献，这里还有其他方法。换句话说，存在一种使用块跟踪（1024 字节块）磁盘块的遗留数据结构。Linux
    添加了页缓存（跟踪文件块）。


    访问 https://github.com/kernel 获取更多信息。


    John Pope 发送给 Bob，要求 Wire 修复内核性能以使用非 BKL 锁。Sam James 同意，Gentoo 一直在应用下游补丁以修复“一点”，并推到了某些点。


    我们提到了 RISC-V 版本作为基于 T-H1520 的开发，为了让尝试启动 T-Head 的 OpenBI 固件和低级 RISC-V 系统，已存在多年。它将继续运行内核。Beagle
    V 板（也使用 TH1520）可能，如果那些固件问题得到妥善解决将会很好。


