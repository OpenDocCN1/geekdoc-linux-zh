  mdcn: "\n\n# PiGPIO 在 PC 上的教程\n\n它们连接在一起，并用于电源连接 - (GND) 和 +3.3V 或 +5V，尽管你在使用 Pi\
    \ 或 RTKGPIO 时大部分情况下会使用 +3.3V。同样，垂直列中的孔在内部是连接的，尽管在板的末端可能没有内部连接 - 有孔的地方是蜂鸣器。\n\n\
    ## 树莓派\n\n我们需要解释的第一点是 RTKGPIO 的 GPIO 引脚与 Pi 的引脚有何不同。解释 Pi 不支持哪些 GPIO 相关的功能可能看起来有点奇怪，但如果你是为了防止使用某些你并不需要的功能，那么这里有一个简短的说明。请注意，我们提到的\
    \ Pi 40 脚引脚特指用于较新版本的 Pi，而不是最原始的 26 脚 Pi+。\n\n通常情况下，GPIO 术语是指向一个可以被配置为数字输入或输出的引脚，但这并不完全足够，因为\
    \ Pi 的引脚提供的不仅仅是 GPIO。几个引脚提供了对外部电路的访问 - 特指 +3.3V 和 GND (0)。某些引脚用于输出 PWM 信号。两个引脚用于访问\
    \ UART，它提供串行信号。最后，引头上的某些引脚可以作为各种其他协议接口，特别是 I2C 和 SPI 接口。\n\n![](img/19f01d8418c50f8361fc6069e917f628_61_0.png)\n\
    \n安装好 RTKGPIO 后，你可能想用 LED 尝试一下。示例代码和像这样的板 布局需要手头有一些电子元件。在开始时知道可能需要什么并不显而易见，因此我们建议购买一个入门套装。你可能想要投资的是\
    \ ELEGOO Fun（来自 elegoo.com），价格大约为 13 英镑，它将为你提供构建面包板项目所需的所有物品。\n\n这里显示使用 RTKGPIO\
    \ 的示例，并在图（下方）中显示了它在板上的接线方式。这比示例代码更容易解释和复制，而且我们通过使用三个 LED 代替一个来扩展了它。我们将它们连接到三个\
    \ GPIO 引脚上，如果你选择使用这些连接器，它们可能会交替亮起或持续亮起。完整的代码见下方。\n\n除了板和 RTKGPIO 之外，你会注意到板上只有六个用于连接的元件。两端的\
    \ LED 和电阻，板上的连接是通过将它们插入孔中实现的，但另一端有一个引脚连接到 RTKGPIO，其 GPIO 引脚有更多引脚。\n\n这三个电阻连接到红色\
    \ LED 处。电阻限制了流经它们的电流，防止 LED 烧毁。220Ω 的值对于从 +3.3V 信号（来自 Pi 或 RTKGPIO）取电的红色 LED 来说并不完全合适。注意\
    \ LED 有正极和阴极，它们需要正确地连接；否则它们不会亮起。阴极通过其圆柱形体上的平坦部分识别，也可以通过引脚的长短来识别。\n\n这些内部连接在 Fritzing\
    \ 图中用绿色显示，但在现实世界中你希望将它们可视化。只要你遵循规则，通过简单的电路就可以很容易实现。顶部和底部水平行的孔是连接的。\n\n> 快速提示：如果你喜欢在\
    \ PC 上使用 Arduino 风格的编程，而不是 Pi，你可能会对 Virtual-GPIO 感兴趣 - 访问 https://github.com/m337/virtual-gpio。\n\
    \n![](img/19f01d8418c50f8361fc6069e917f628_61_1.png)\n\nRTKGPIO 意味着我们有 40 个引脚可以访问各种信号，并不像\
    \ Pi 那么多。显然，相同引脚上的 GPIO 都是相同的，它带有提供与 Pi 相同电源的引脚，然而 UART 和 SPI 接口是缺失的；\n\n在 Pi\
    \ UART 和电容器保留的引脚上提供了额外的 GPIO。尽管不在 Pi 的 40 脚引脚上，但使用了一个完全独立的四脚引头：\n\n| 1 | 2 | 3\
