    # RP2040 ETH Mini 开发板


    Les Pounder 喜欢他的 Pi 收藏，但有时有些板子他确实没那么喜欢……


    ## 简要介绍


    Waveshare 将 Raspberry Pi Pico 压缩到更小的尺寸中，同时集成了 USB 和以太网接口，这款 Mini 看起来非常漂亮，但文档匮乏，且启动项目的步骤非常复杂。其他人选择在
    Pico 上使用以太网，他们的体验比这块稍微好一点。


    我们真的想要这样块板子。Waveshare 的 RP2040 ETH Mini 将 GPIO 限制到了最低，但我们从未停止要求更多：14 个数字/O 引脚，这些引脚还提供了
    SPI、I2C、UART 和三个模拟输入的访问。因此，我们没有获得 RP2040 的所有引脚，但为了效率牺牲了它们。这块板子一端是 USB 端口，另一端是以太网——


    板子上没有排针，这意味着必须将其焊接到我们自己的引脚上。板子有两个按钮：BOOT 和 Reset。Boot 键让 Pico 进入固件 BOOT 模式。Reset
    键可以在为板子供电时减少 USB C 端口的磨损。Raspberry Pi Pico 没有这个功能，除非你自己制作一个。RP2040 拥有 264KB SRAM
    和一个频率为 133MHz 的 ARM Cortex-M0+ 双核。我们获得了 4MB 的闪存存储。实际上——


    以以太网连接为主，RP2040 ETH Mini 充满了未开发的潜力。


    这实际上证明了我们可以控制这块板子。但我们没能让它工作。我们曾用 Banana Pi W 和 Wiz 板子使用 CircuitPython 实现过。我们进行了各种尝试，安装了
    MicroPython 的 requests 模块，但在导入和运行几行代码后失败了。由于 RP2040 ETH Mini 的文档同样糟糕，我们一直未能成功创建自己的网络演示。我们了解以太网——提供的硬件缺少了这一点。


    我们对这块板子并不满意。外形非常好，硅胶 GPIO 引脚很棒，锯齿意味着我们可以将其焊接到自己的项目中。为了让板子到位，付出一点机械上的努力是值得的——不要只依赖货架！虽然听起来并不像是在泼冷，我们只是对文档让使用变得如此困难感到失望。对于
    Wiz 板子，它是可以的。


    似乎在 RP2040 以太网文档之后，Waveshare RP2040 ETH Mini 也受到了类似的影响。我们使用 MicroPython 测试连接到我们的网络，但网络并没有连通，毕竟——我们能让某些东西运行吗？是的，也不是。我们使用了常用的
    GPIO 测试，闪烁 LED 和简单的 I2C OLED 屏幕测试。这些进展都很顺利，于是我们尝试构建一个网络示例。就在这里出问题了。


    我们最初的目标是创建一个测试设置，允许 URL 控制 LED LAN。简单却————


    ## 结论


    开发者：Waveshare


    网站：www.waveshare.com


    价格：£12.40


    | 特性 | 6/10 | 易用性 | 5/10 |

    |---|---|---|---|

    | 性能 | 5/10 | 价值 | |


    如果你需要廉价的，Tinyony''s Pico 足够了。如果你需要以太网，Wiz 板子更好。如果你需要很多，那就选 Pico W。


