    # Sonic Mini 8K S


    Denise Bertacci 总是寻找升级产品，如果有折扣，她会加倍喜欢。


    | 规格 | |

    | 类型: 树脂 |

    | 体积: 165x72x170mm |

    | 屏幕: 7.1 英寸单色 |

    | 光: LED |

    | 分辨率: 22 微米 |

    | 曝光: |

    | 控制: 4.5 英寸触摸 |

    | USB: 2.0 |

    | 尺寸: 290x290x430mm |

    | 重量: 10kg |


    Phcubic 发布其第一台 8K 打印机时引起了巨大轰：它将价格削减了近一半，成为另一台普通创作者负担得起的 3D 打印机。


    尺寸与前代产品相似，且拥有惊人的分辨率，但为了降低成本做了一些更改——盖子使用了不同的材料，单 Z 轴和 USB 端口重新调整了位置。它仍然存在旧型号的问题，构建平台清理起来困难得离谱——它并不完全兼容流行的第三方切片软件。


    它 22 微米的细节分辨率令人惊叹——尤其是考虑到一粒盐的直径是它的四倍。构建平台对于树脂打印机来说很小，这使得它最适合桌面模型、珠宝和装饰品。


    拆箱打印机时，包含了启动所需的所有设备。你会得到一个金属刮刀、一个塑料刮刀、一个一次性漏斗、一把六角扳、一个 USB 闪盘和用于构建平台的 80 目数砂纸。


    记住：树脂是有危险的，所以务始终佩戴手套和安全眼镜。


    打印机以完全组装的形式提供，构建平台已螺丝固定。调平构建平台非常简单，使用提供的六角扳只需要几分钟。机器显示调平指令，所以你不需要眯着看说明书。


    这是一台坚固的机器，其构造工艺令人印象深刻。它有一个坚固的构建平台和金属料槽，感觉很结实，但旋钮是成本所在的地方。


    如果厂家能解决更大的问题就好了，比如供电功率太高了。平台上那些收集树脂的螺丝孔需要彻底清理。构建平台在完成涂装后升得稍微太高，导致多余的树脂溅回料槽中。


    开箱即附带了 ChitBox 和 Lychee。两者都是带有免费版的第三方切片软件——我们使用 Chitubox 对所有模型切片。这两种切片软件都能处理排水树脂的孔并添加支撑结构。Phcubic
    提供了一套用于测试的 8K 公式，这能展现出高分辨率打印件的细节。树脂本身令人印象深刻，每层只需要两秒的曝光时间，而普通树脂需要三秒。


    我们想看看 Sonic Mini 8K 如何处理非标准树脂，因此我们以 0.5 的层高和两秒曝光时间打印了 5 分钟。细节到处都有，与层纹相比却非常少。你使用
    Sonic Mini 面临的最大问题将是找不到卓越的材料来支持这台打印机。


    ## 结论


    开发者：Phcubic


    网站：www.phcubic.com


    价格：£30


    | 特性 | 8/10 | 易用性 | 7/10 |

    |---|---|---|---|

    | 性能 | 7/10 | 价值 | 8/10 |

    | | | | 8/10 |


    Phcubic Sonic Mini 8K 树脂 3D 打印机以负担的价格提供了细节。注意其理想游戏微缩模型的精细细节。


