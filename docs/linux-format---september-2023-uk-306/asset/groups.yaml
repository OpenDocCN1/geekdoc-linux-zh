    # CODING ACADEMY Flutter 开发


    ## FLUTTER


    鸣谢：Flutterawesome.com/calculator-create-with-flutter/


    ## 创建 Flutter 应用程序


    David Bolton 展示了如何在 Linux 上设置 Flutter 开发环境，以及如何在 Flutter 中构建一个简单的采样器。


    ![](img/19f01d8418c50f8361fc6069e917f628_93_0.png)


    > 我听过 Flutter，它可能不像你所说的那是用于移动应用的跨平台工具包，你是正确的。但它的平台在去年已经扩展了，现在包含了为 Linux 桌面应用以及单页应用进行开发的能力。


    如果 Flutter 是一个工具包，你用什么语言来编写它？它是一种现代编程语言，你也可以完全用 Dart 编写。然而，如果你习惯了比 C 更高级且包含良好字符串处理功能的编程语言，但它又像
    C++ 一样复杂，那么 Dart 就不值一提了。如果你想了解更多，请查看 flutter.dev 官方网站，或者找一个可以让你尝试和运行 Dart 的在线编辑器。


    构建应用程序界面的方法是使用小组件（widgets）。小组件是一个包含 UI 元素逻辑、交互和设计的组件。它可以在 Dart 中以类的形式实现，你可以在 https://flutter.dev
    了解更多。


    Flutter 应用程序与其他类型的应用程序不同。Flutter 应用程序的所有小组件每秒都会绘制多次；高达每秒 60 帧或更快。这使得它适用于游戏。单页
    Web 应用每秒渲染次数也非常多。


    ![](img/19f01d8418c50f8361fc6069e917f628_93_1.png)


    Flutter 打开一个文件并允许你创建一个文件，例如 examples。现在点击 Terminal（终端）> New（新建）


    这会在 examples 文件夹中打开终端，所有内容都在这里创建。在终端窗口中，输入命令并按回车：


    ```bash

    $ flutter create myapp

    ```


    如果你使用任何名称代替 flutter，必须全部小写。几秒钟后，你将在控制台中看到许多文件和文件夹：


