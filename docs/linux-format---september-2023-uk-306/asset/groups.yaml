    ## NULL POINTS


    You need a reasonable knowledge of the Dart language to write Flutter apps; if
    you know C you''ll find it an object-oriented language and it includes a type
    system. Variables are non-nullable by default, but Dart provides null safety exceptions.
    It means that you must give variables a initial value. For example, you can list:


    - List<String>?

    - List<String>

    - List<Int>


    That flags a compile error. You should use:


    The really good thing is that you can litter with your code with any variable
    `if == null` - check.


    You can declare variables by adding a question mark: `int? name;`


    There are some programming cases, where a value is needed. SQL queries return
    null for instance, or it might be that the parameters are not null if.


    The Dart documentation includes a page on null safety. There may be some packages
    in pub.dev that don''t have null safety but those should not be used. Dart 3 only
    works


