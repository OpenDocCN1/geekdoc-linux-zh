    | UBUNTU STUDIO | AV LINUX | 8/10 |

    | FEDORA JAM | 5/10 | |


    Fedora Design Suite 本应该处于领先，但大多数发行版表现也很好。


    ## 文档与支持


    关于如何运行程序以及克服困难的信息。


    Modia OS 看起来像一本说明书，而且 PDF 手册已经过时。开发团队向捐赠的用户提供支持。简而言之，它不是免费，但如果你想在社区内查看该发行版的文档。


    正如对 Ubuntu Linux 变体的预期那样，Ubuntu 的文档非常详尽，选项丰富。例如，文档包含许多有益章节，包括视频编辑工具的教程以及音频硬件设置。一个问题是，某些文档虽然在那里并没有更新。有使用
    Matrix 和 IRC 的实时聊天板块，你可能需要它们来寻求有关 Ubuntu 发行版的帮助。


    Fedora Jam 包含一个重要的简短 wiki：关于它与 Fedora 比较的特定信息。Fedora Design Suite 有类似的社区形象，但几乎全是。Fedora
    Jam 没多少，但几乎全是通用的图形和设计工具。批评者看起来状态更好，有大约 50 名成员。对于这两个基于 Fedora 的发行版，都有某种程度。


    ![](img/19f01d8418c50f8361fc6069e917f628_29_1.png)


    ```

    在“Documents'' 文件夹中，我们将找到系统上的音频手册列表，通常以及每个手册的文档，这在有许多 ALSA 示例解释如何处理时很有帮助-

    USB 手册

