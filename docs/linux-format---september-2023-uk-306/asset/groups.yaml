  mdcn: "\n\n# 你能帮助启发下一代代码爱好者吗？\n\nCode Club 是一个全国性的志愿者主导网络，为 9-11 岁的儿童提供课后俱乐部服务。\n\
    \n我们一直在寻找具备编程技能的人员来担任志愿者，每周在当地的小学、图书馆或社区中心运营一小时俱乐部。\n\n你可以与同事结伴，会有一位老师在场为你提供支持，而且我们会提供你所需的所有材料，帮助激发孩子们对数字制作的兴趣。\n\
