    ## SECURITY


    ## EU passes Cyber Resilience Act


    EU states have agreed to draft legislation, despite opposition from the Linux
    Foundation and others.


    The Cyber Resilience Act was proposed in September 2022 and mostly seems to target
    interconnected systems among IoT devices. It ensures minimum security for connected
    devices as well as requiring mandatory security standards.


    > “benefit of an established relationship with the co-legislators.”


    Joe Brockmeer, head of community at open source development company Mozilla, points
    out more chilling effects of the legislation for the community: “The CRA wants
    to force projects to report vulnerabilities within 24 hours of discovery to any
    EU institution, which in the face of industry practices is impossible, and others
    have proposed detailed changes.”


    As meaningful as the legislation, the impact on open source development could
    be devastating. More than open source industry bodies, like the Linux Foundation,
    wrote an open letter to EU legislators asking to reconsider the current approach:
    https://www.linuxfoundation.org/news/open-letter-cyber-resilience-act/


    Brockmeer cites the zero-day vulnerability Log4Shell as an example of this. He
    also notes that onerous requirements like these could force open source software
    to develop out of Europe.


    In the theory, the Act covers free and open source projects that are out or outside
    the scope of a commercial activity.


    Amanda Beck, CEO of Open, is a not-for-profit that supports open source: “The
    EU focus on giving carve-outs to SMEs and doing the same for foundations shows
    a lack of understanding of how open source software works. This is extremely short-sighted
    and feeds into cycles of perpetuating the legacy gap.”


    In many practice, open source projects would be considered vulnerable if contributors
    were not employees of a legal entity, as most open source projects are hosted
    on GitHub, pointed out in Annex 1.


    Given over 70% of software used today is based on open source projects, the EU
    hasn''t considered the community. Time will tell if it tweaks the legislation
    to exempt open source software altogether.


    Some aspects of the Act would also mandate a guarantee, which would require software
    to be delivered “without any known vulnerabilities”. The impact on a ‘continuum’
    of risk and new ones being discovered all the time is immense.


    The CRA has been strongly opposed by multiple open source organizations. Open
    Europe and others have also proposed detailed changes to the.


    The open letter points this out, as well making a tongue-in-reference to the fact
    that most open source projects do not have.


    The Log4Shell zero-day vulnerability is a good example of a vulnerability that
    was unforeseen by the developers of the original app Log4j.


