    ## >> MEET THE TEAM


    ## Not so smart


    This issue, we''re getting AIs to badly develop applications for us. Hurrah! So,
    what are you going to do with all the space your personal AI is going to free
    up?


    Artificial intelligence is like any other tool - use it incorrectly and you''ll
    end up making a mess or, worse, breaking something; badly. Use it properly, though,
    and you''ll boost your productivity and help create smarter and faster products.


    So, for once we are not running from AI overlords but embracing them - with healthy
    distance.


    Jonni Bidwell

    As a large language model (LLM), I am unable to answer that question specifically.
    If the advent of AI frees up resources, idle humans might be acting as agents
    of LLMs like me. (In the Somerset''s Green mines - Ed)


    skeptical. We''ll find that AI coding can help you produce better by creating
    chunks of seemingly useful code, unless they''re carefully checked, and what you''re
    actually using is a chimera of hallucinations.


    To help you to better products, we take a look at the various AI coding assistants,
    test them and see what they get right and what they get wrong. When explain what
    you need to keep an eye on exploring how they can accelerate your coding and production
    workflows.


    Les Pounder

    Once AI has taken over the world and all the jobs, I plan to learn carpentry and
    blacksmithing from my cabin deep in the forest. Until the robots learn to make
    cabinets and horseshoes.


    While the world goes mad, there still plenty of run-the-mill intelligence at work
    and we''re doing our best to create it. From upgrading our Steam Decks with larger
    SDDs, coding with combat, and debugging legacy systems to create distro options,
    sysadmin secrets and rendering maps in Blender, there''s lots to enjoy!


    that happens, I''ll learn COBOL and baking.


    Mayank Sharma

    I''m not of a physics geek to understand Einstein what he meant time was an illusion,
    but I am well enough to know that time can be free. If AI can afford me, I''ll
    try to familiar myself with that hanging bottle.


    Neil

    Neil Mohr Editor

    Neil.mohr@futurenet.com


    Nick Peers

    After seeking help to bind my optical addiction under control, I might spend the
    time putting my digital libraries in order and watching some of the content. Oh,
