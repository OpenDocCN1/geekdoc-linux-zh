    首先，连接到 PI 的命令行，输入以下命令以显示用于自助终端的 Ubuntu Frame Web 组件。


    为了澄清和验证这一陈述：智能显示应用自古以来也被称为 Kiosk 模式（自助机模式）。这种遗留可以在手机中找到，例如 —— 过去用于在商店里吸引顾客的显示模式。


    初学者经常困惑为什么没有安装 Dashboard 包。仔细查看架构截图（左侧）可以发现，服务器正在使用 dashboard 框架为其客户端提供数据。


    尽管如此，一旦安装命令运行，树莓派将开始显示 浏览器。这是正常的，有效方法下载了 webkit 组件。


    页面上的下一步可以通过使用以下命令完成，该命令修改了 Snap 暴露的配置：


    输入后，会有几秒钟过去 —— 之后，示例包含在树莓派显示器的发行图中。所示配置需要根据你的本地网络进行调整，以便激活位于 IP 地址 192.168.1.68。


    ## 高级配置


    虽然展示动物和风景对室内设计很好，但本文最初的目标是创建一个用于广告、分析或其他商业价值内容的智能显示系统界面。


    为了实现这一目标，有多种配置途径。第一种是通过编辑 dashboard-config.json —— 默认情况下，配置类似于配置截图（右上）所示。


    可以通过编辑此文件来修改行为；例如可以更改端口变量以便服务器使用不同的 TCP 端口暴露接口。


    此外，还有各种额外的配置选项 —— 通过访问文档获取更多信息：


    ```

    dashboardk.readthedocs.io/env/configuration.json

    ```


    ## 自动设置


    在某些情况下，需要自动设置基础设施，特别是如果停电经常发生，不具备自动意识的工人难以处理命令行任务。如果树莓派在停电后等待启动，执行以下操作：


    ```

    sudo snap set webkit-kiosk-daemon-run true

    sudo snap set webkit-kiosk-daemon-run-webkit-kiosk-url=http://localhost:9400

    ```


    将守护进程设置为 true 会通知 Ubuntu Core 它在设置时必须启动，仪表根据配置自动出现。Ubuntu 与 Dashk 的结合允许使用开源系统实现灵活的智能显示。一旦在此工作中安装了结构，可以使用经典的
    dashboard 框架来生成：


    默认配置已设置为默认。


    '
