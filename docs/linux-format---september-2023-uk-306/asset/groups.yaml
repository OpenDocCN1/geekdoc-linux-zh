    RTX 4060 围绕 AD107 GPU 构建。它采用定制的 TSMC 4N 工艺制造，该工艺针对 Nvidia 进行了调整。RTX 4060 支持具有执行重排序功能的核心的硬件光线追踪、第四代
    Tensor 核心，并支持 AV1，当然还支持带有帧生成技术的 DLSS 3。该卡连接到 PCIe 4.0 插槽。相比 RTX 3060 Ti 提供的全 16
