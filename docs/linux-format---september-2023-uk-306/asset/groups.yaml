    窗口管理是一个复杂的问题。


    2023 年，Gnome 开发者 Tobias Bernard 开始发布关于窗口管理主题的迷人内容。他正确地认为，这个问题自桌面界面发布以来一直存在。无论使用多个窗口进行多任务处理是自动的还是由用户手动移动/缩放，平铺扩展都可以做出许多更改。


    CRA 遭到了多个开源组织的强烈反对。Open Europe 等机构也对该法案提出了详细的修改建议。


    公开信指出了这一点，并幽地提到了大多数开源项目并不具备（相关条件）的事。


