    # TUTORIALS 3D maps


    # IMPORT AN IMAGE


    ![](img/19f01d8418c50f8361fc6069e917f628_67_0.png)


    - 1 Create the material

    The sidebar on the right-hand view is where the properties of object are in a
    Blender view, and it''s filled into tabs that are represented by icons. To find
    out which icon, however, hover over it with the mouse. Select the Material tab.
    Press + New to create a new material.


    - 2 Add the texture

    This material has flat grey colour assigned to it, but we need to assign (our
    map) to it. Click the yellow dot in the Base Color property of Material and select
    Texture. There should be options for adding a texture. Click on the plus button
    and select the map image texture.


    - 3 Switch to Material Preview

    You won''t see anything yet, because the viewport defaults to being in Solid mode,
    and it doesn''t show any materials. Switch the viewport to Preview mode on the
    small icon at the top-right corner of the viewport. You should now see the map
    texture on the surface of the plane.


    # >> MANDBROT MAPS


    The process that we''ve evolved (subdividing a surface, applying a texture to
    it, and displacement to the scale) can be used on other maps too. For many examples,
    fractals can output many variations of the same image. It''s often possible to
    use GIMP to render the fractal image <Col > Desaturate>. When we found this that
    the brightness was moving along way, with the parts of the map brighter than the
    other using GIMP (Colors).


    The only problem was that this tinted map was much brighter than black, which
    we could place it at the height radius than the minimum. The solution was to use
    one of these areas with the By Color select. This selects all of the white regions
    in the image. Reapply the invert function to change it from white.


    Some Mandelbrot produced output that was more suitable than others. Sao produced
    output that was too ''bitsy'' and detailed for what we wanted, QFractal produced
    a more suitable output.


    For the right plane in Blender, use the Object tab. For example, a 1080px image,
    the scale to X and Y is 0.9. This gives the plane a 16-9 ratio.


    Once you have the map texture on the plane, it''s time to add the highlight and
    make the height of the vertices of the surface. To do this use displacement. The
    fractal image (heatmap) affects the shape of an object (the plane).


    Select the Modifier tab in the properties. A modifier alters the way that is rendered
    in the viewport. We found a final result by altering the underlying object. Displace
    should not be concerned if the plane moves upwards within the image.


    In Blender there should be a set of properties to edit the Displace, and the procedure
    of adding the heatmap as a texture is like that adding the map image texture.
    In this case, we need to add a new texture to the Texture tab, Click on add the
    map image texture. You should see that the height of the plane''s surfaces updates
    according to the relative brightness of the displacement. The amount of effect
    that the heatmap applies to the plane''s surface by altering the Strength and
    Blend parameters of the Displace modifier. Most of the Blender parameter sliders
    are very sensitive, double-click and then manually enter the parameter values
    or drag the sliders for the controls.


    # Improving detail


    If you zoom into the surface of the plane, you notice height variations are roughly
    crudely produced and polygonal in nature. That''s hardly surprising, as the vertices
    of the plane''s surface only up to a 100-150 resolution. The first thing to do
    to improve the output of the 3D map is to make smooth shading by clicking on the
    plane and setting Shade Mode.


    We can also increase the number of vertices that make up the surface of the plane
    by using


    ![](img/19f01d8418c50f8361fc6069e917f628_67_1.png)


    # 3D maps TUTORIALS


    modifier. as before, the modifier from the Subdivision tab, but this time, select
    Subdivision. Modifiers are processed in order, so move the Subdivision modifier
    so that it sits above the Displacement modifier. What the Subdivision modifier
    does is like all modifiers, does not alter the geometry; these simple changes
    are made when the scene is shown in the viewport or rendered to a file. Notice
    that this modifier has two parameters, one to carry out in the viewport and one
    for the final. In both cases, changing this to 2 is sufficient.


    Converting back into the Material editor and tweaking some of the parameters as
    you do. The Roughness parameter, which makes surface shiny and even extra shadows.
    As you increase, it becomes more matte.


    ![](img/19f01d8418c50f8361fc6069e917f628_68_0.png)


    # Lights, camera, action


    Now that we have the 3D map on the surface of a plane, we need to get it into
    a state where it is rendered. The first issue is to consider the lighting. Blender
    defaults to using a single light point which gives light to all sides of the object.
    An object like this 3D map will show more contrast and shadows into the scene.
    We need a light that is small and close to the object.


    To see the effect of the lighting, make sure the viewport is in Render mode. Click
    the light icon in top bar of the scene. Click on light to select it either in
    the viewport or in the Collection Panel at the top of the right-hand sidebar,
    and move it with your mouse.


    While you are in Grab mode, constrain the movement to a particular axis by pressing
    X, Y, or Z. To lock an axis, hold Shift to fix the button, then go into Grab mode
    and move the object in another. These shortcuts are useful when moving an object
    at an angle, or when using a pointing device such as mouse.


    You''ll notice that the default light doesn''t have much of an effect on the look
    of the scene, because it is so far away. If the light is overwhelming the area
    of the light, you can turn down its brightness. To do this, click on the light
    to select it and go to the Data tab of the light. Here, you can turn down to a
    lower value.


    If you want a lot of contrast, you can also add shadows. If there are areas of
    the map that have not enough illumination, add a second light and position it
    appropriately.


    # Camera placement and rendering


    Hopefully, the 3D map looks good at this point. If we want to render the scene,
    we need to make sure the camera is pointing in the right place. To see the camera
    at now, Press O on the numeric keypad. The simple way to orient the camera is
    to move it so that it reflects the current viewport. To view the dialog by pressing
    N. Select the Tab on this dialog, and click Camera. You can move the camera using
    the same mouse moves that you would normally use for the scene. Once you have
    got the perfect angle, don''t forget to desclect the Camera to View option.


    - Viewing the effect of a highlight highlights the surface of the plane without
    material and texture.


    # Animate


    Blender makes easy to animate a scene, for example, rotating an object. The animation
    timeline is at the bottom, beneath the viewport. Hover over it and press G to
    enlarge it.


    We can control the rotation of the plane object by controlling the Z rotation
    parameter in the Object tab. By default, this parameter should be locked. Click
    the small dot at the end of the parameter, it is keyed to edit.


    Once again, click on the rotation property, which should have changed into a diamond
    shape. This is a keyframe showing the rotation of 360 on frame 250. You can now
    drag the timeline cube to frame the scene. When you play the animation at the
    top of the timeline, it will rotate 360 degrees. Many properties can be animated
    in this way. For example, you can also control the movement of the camera and
    into the map.


    To render this scene as a video file, change the output format from PNG to a video
    format (Output tab). To render it, press Ctrl+F12.


    > QUICK TIP: For projects, we need to keep everything that we''re working with
    the (plane) scene left-clicking on it. Make sure you''re on the right mode (Edit/Object)
    as well.


