    Web: https://gitlab.gnome.org/neither/g4music


    Old-school aficionados like us have disks full of music that then often choose
    popular players. If you, too, have a large library of music, what you need is
    a simple, straightforward client like G4Music that will lead you through the library
    without any clutter.


    G4Music is lightweight yet rich in features, which makes it ideal for owning offline
    libraries. It is also available as a Flatpak and can be installed from Flatpak
    with `flatpak install flathub`.


    The app has a beautiful and custom interface. On launch, it automatically scans
    and lists all the audio you find in your ~Music directory and all your popular
    audio files. You can point it to another directory in the app. It also supports
    remote locations with help of protocols like Samba and GStreamer.


    G4Music uses gaussian-blurred album art to decorate the currently selected/track
    to decorate the app window, which makes the app look quite slick. You can turn
    this off by tweaking the preferences.


    ![](img/19f01d8418c50f8361fc6069e917f628_79_0.png)


    G4Music plays nicely on Gnome and can integrate with the MPRIS controls in the
    Gnome notification tray.


    By default, the app sorts music in alphabetical order by title. One of the three
    buttons on the interface helps you change your arrangement list to show music
    by genre, artist or title of the song, or just shuffle if you need. There''s also
    a search bar to help you search your library.


    Despite its minimalism, the app has interesting features, such as background playback,
    as well as support for audio visualizer and equalizer. It supports various audio
    servers including PulseAudio, PipeWire, OSS, and others. The app can also normalize
    volumes with Replay.


    ![](img/19f01d8418c50f8361fc6069e917f628_79_1.png)


    By default, the app doesn''t show any visual controls, for a cleaner interface,
    but they can be enabled from the Preferences window.


    ## AUDIO VISUALIZER


    ### Cava


    Version: 2.0.0

    Web: https://github.com/arcaVisualizer/Cava


    We all chose our hearts as audio-visualizers. This giz features animated imagery
    that is generated entirely in real time, sync with the currently playing track
    even when we aren''t looking.


    Back in the days when we were all searching for something to listen to, Cava is
    based on audio visualizer. It''s very versatile and can be installed with `flatpak
    install flathub`.


    Cava doesn''t insist that its app is scientifically accurate, and is designed
    to represent audio. With the same vein, Cava isn''t designed to be used by professionals,
    but it has plenty of bells and whistles to impress audio enthusiasts. The app
    supports modes including waves, bars, and patterns. And you can also draw them
    in one of circles.


    One of the best things about Cava is its plethora of options. You can, for instance,
    set up linear gradients for the background and color bundle to make them pop.
    Because Cava is based on CAVA, you can get to most of the settings that the app
    makes. For instance, you can control the number of bars in the audio channels
    and various levels of noise reduction or smoothing effects. Cava''s main window
    can be resized, and you can also make your configuration by exporting it for everyone
    else.


    ![](img/19f01d8418c50f8361fc6069e917f628_79_2.png)


    September 2023

    www.linuxformat.com


    ## HOTPICKS


    ### VIDEO EDITOR


    ### Footage


    Version: 1.2

    Web: https://github.com/adham10/Footage


    Linux users have access to lots of quality open source video editors, as Kdenlive,
    OpenShot, Shotcut and more. While they are good at what they do, they might be
    overkill when you really just need to reduce the size of your video. If your video-editing
    needs are few and frugal, you can get mileage from Footage.


    Unlike well-known converters, Footage is out of this. You can use it to cut clips,
    change the frame rate, export it in a different format and so on. As you can tell,
    these features aren''t for a professional video editor, but they''re plenty for
    an occasional editor to cut distractions from their footage or to reduce the size
    of their movie so you can send it as an attachment.


    Footage is available as a Flatpak and can be installed from FlatHub with `flatpak
    install github.io/adham3310.Footage`.


    ![](img/19f01d8418c50f8361fc6069e917f628_80_0.png)


    A nifty little video editor that offers some of the most common video-editing
    functions, but simply doesn''t do batch processing.


    ![](img/19f01d8418c50f8361fc6069e917f628_80_1.png)


    True to its nature, the app has a straightforward interface. Use the File button
    to select the video you want to edit. Once it is loaded, you can use the controls
    to edit it as per your needs.


    You can resize your video as well as its length by making changes in the preview
    window and timeline. Similarly, you can reduce the size of the video, by length
    and width, and by pixels. In the same vein, you can also increase or decrease
    the frame rate as per your requirements.


    After making the tweaks, you can export your video in any of the popular container
    formats, including WebM, MP4, MKV or as a GIF.


    ![](img/19f01d8418c50f8361fc6069e917f628_80_2.png)


    Once we tweaked the login manager as needed, you can use the app to fix settings
    and import them into a different Gnome-based distribution.


    ## LOGIN CUSTOMIZER


    ### Login Manager Settings


    Version: 3.2

    Web: https://gdm-settings.github.io


    It took some time, but we''ve got accustomed to the ways of the redesigned Gnome
    Desktop. However, there was one thing that didn''t sit with us: it''s the lack
    of custom options. Sure, the desktop has an extra infrastructure to help us manage
    the desktop as per needs, but the desktop environment leaves it to be desired
    when making one of the tweaks to get your hands on the Login Manager Settings
    app.


    Despite its non-aligned nature, the app is better suited for Gnome and enables
    us to tweak various Gnome settings. You can, for instance, to apply themes, change
    the background of the login screen, change the cursor and icon theme, apply light
    and settings, and more. It is available both as an AppImage and as a Flatpak,
    although the developers themselves say may not work properly under certain conditions.
    This is why it''s better to install the app as a Flatpak with `flatpak install
    github.io/adham3310/Gnome-Login-Settings`.


    The app is fairly intuitive, with customisation organised into nine sections:
    Appearance, Fonts, Background, Sound, and Theme, Login Screen, Screen Preview.
    You can jump through the section and scroll through the options, and tweak them
    as you wish. Some settings are distro-specific, and may not have any impact on
    your distro. After twisting, click Apply. You need to then log in or reboot for
    the changes to come into effect.

