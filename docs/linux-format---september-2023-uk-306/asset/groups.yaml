    ## LXF 冒险之旅\n\n致谢：https://github.com/azuregate\n\n## 文本冒险战斗机制\n\n通常让它看起来像是在玩游戏而不是战争，但这个月\
    \ Nate Drake 将我们的互动式冒险带向了一条黑暗、暴力的道路。\n\n我一直在关注之前关于创建你的 Python 文本冒险的教程，你现在应该已经有一个能够让玩家在任意数量房间之间移动并与物品交互的脚本。\n\
    \n这没问题，但大多数地下城通常包含某些风险元素。当然，代码需要创建一个房间让玩家玩，游戏通常会给你每个属性提供一定数量的生命或分数，你必须保护它们。\n\n\
    子类（subclass）具有相同的属性，但也允许你添加你自己的其他属性。我们将使用这个方便工具创建一个名为 `StatItem` 的新类。\n\n### StatItem(Item):\n\
    \n```python\ndef __init__(self, name, itemdesc, uproomdesc, portable, wearable,\
    \ usedin, us,\nroomadditems, roomusdesc, userodesc,\nself.hp, change):\n    super().__init__(self,\
    \ name, itemdesc, uproomdesc,\nportable, wearable, usedin,\nroomadditems, roomusdesc,\n\
    disposable)\n```\n\n### 击我\n\n为了让我们的英雄足够强大，我们首先需要更新 `Player` 类以引入 HP 属性。\n\n如你所见，这是原始的\
    \ `Item` 类。我们添加了一个新属性 HP。如果 HP 发生变化，游戏将使用 `StatItem`。这表示你的 HP 变化了多少。如果是负值，StatItem\
    \ 同时涵盖了健康和伤害物品（注意，这有点风险）。\n\n### class Player:\n\n```python\ndef __init__(self,\
    \ name, current, keyring, hp):\n    self.name = name\n    self.current = current\n\
    \    self.hp = hp\n    self.inventory = inventory\n```\n\n这意味着我们还需要在脚本开始时为玩家分配攻击次数的变化（现在称为\
    \ HP）：\n\n如果你下载了脚本（见下方的“小贴士”），玩家的背包已更改为 `StatItem` 列表：`['Bread', 'Sabred', 'None',\
    \ 'O']`。现在你可以使用 Sabred 了。这种感觉非常清爽。, None, One, None, True。\n\n```python\nself.inventory\
    \ = [StatItem(name, [0], [1])\n```\n\n在这种情况下，我们决定今天免费为玩家增加 10 点 HP 以改变变化，这并不危险，也取决于你想要让你的冒险变得简单还是困难。\n\
    \n我们的玩家现在拥有一个特别显著的物品，因为游戏中没有东西可以伤害到他们！\n\n我们可以更新 `Item` 类来添加此属性，但除非我们使用它，否则很难区分不同类型的物品。在\
    \ Python 中，我们有一个子类网络可以做到，它允许我们创建子类。一个\n\n# 我们的专家\n\nNate Drake 想要决定这一系列老爸，他们曾告诉他，没有人会付钱让他留下来玩游戏。\n\
    \n# 小贴士 (QUICK TIP)\n\n你可以从 https://github.com/azuregate/pythontext adventure/adventure/script.py\
    \ 下载一个可以更改玩家分数的代码示例\n\n86 LXF 杂志 2023年11月\n\nwww.infformat.com\n\n# 文本冒险编程学院\n\
    \n在修改脚本之前，如果玩家能够创建自己的 HP，可能可能有所帮助。最好的做法是更新背包程序：\n\n```python\ndef inventory():\n\
    \    print(name)\n    print(\"HP:\", hp)\n    print(\"You are carrying:\")\n \
    \   if not inventory:\n        print(\"nothing\")\n```\n\n在后续系列中，你将知道主冒险中这个脚本包含一个大型金属格栅，你无法移动它。这是因为格栅的\
    \ `portable` 属性被设置为 false。不过，并不是让格栅变得不可移动，如果玩家尝试通过拉动它\n\n> 小贴士\n> 在编程圈中，从其他类派生新类的方法被称为“继承”。第一个例子就是我们最初创建的文本冒险。\n\
    \n为了做到这一点，我们需要将格栅更改为静态的（Static）\n\n```python\ngrill = Static(\"grill\", \"格栅很旧且生锈了，但有一些锋利的边缘。\"\
    , None, None, None, 尝试拉并移动格栅，无论你如何努力都会抓伤你的手。它有 3 点 HP, None\n```\n\n花点时间回顾一下。在第一情况下，玩家使用\
    \ `LOOK` 来检查它，它只是警告那里有一些肉。肉也是通过玩家尝试移动格栅时的受伤产生的。在这种情况下，他们损失了 HP。\n\n```python\n\
    if not inventory:\n    print(\"nothing\")\nelse:\n    for item in inventory:\n\
    \        print(item)\n```\n\n现在是时候运行脚本或修改后的脚本了。首先，运行 `inventory` 查看玩家 HP 的输出。看板在玩家的背包里。最后，运行\
    \ `inventory` 看看你的英雄现在有了 HP\n\n# 承担风险 (Taking risks)\n\n到目前为止，脚本会更改玩家的分数。如果 HP\
    \ 发生变化，游戏将使用 `StatItem`。这表示你的 HP 变化了多少。如果是负值，StatItem 同时涵盖了健康和伤害物品（注意，这有点风险）。\n\
    \n```python\nclass Player:\n    def __init__(self, name, currentroom, keyring,\
    \ hp, inventory=[]):\n        self.name = name\n        self.currentroom = currentroom\n\
    \        self.keyring = keyring\n        self.hp = hp\n        self.inventory\
    \ = inventory\n        self.weapon = weapon\n```\n\n不要忘记修改玩家对象，但现在保持无武器状态：\n\n\
    ```python\nplayer = Player(\"name\", room[1], [10], [bread])\n```\n\n由于武器有特殊属性，最好是将它们作为字典列表：\n\
    \n```python\nclass Weapon(Item):\n    def __init__(self, name, itemdesc, updatable,\
    \ portable, realizable, usedin, \n    removesitem, addsroomitem, usable, damage=0):\n\
    \        super().__init__(name, itemdesc, updatable, portable, realizable, usedin,\n\
    \        removesitem, addsroomitem, usable)\n        damage = damage\n       \
    \ self.damage = damage\n```\n\n正如如此，`Weapon` 子类继承了所有的 `Item` 属性，并在伤害的情况下添加了另一个。这是一个非常有用的技巧，你可以将其用于游戏中的其他特殊物品。\n\
    \n现在你已经创建了它，可以创建自己的武器了。如果你需要一些灵感，看看我们在示例脚本中创建的那个：\n`sword = Weapon(\"Sword\",\
    \ \"一把锋利的剑和坚固的刀刃\", True, True, False, 2)`\n\n可以通过 `USE` 命令检查武器。如果你使用 `USE`，就可以看到。\n\
    \n"
