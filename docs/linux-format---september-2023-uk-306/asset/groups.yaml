    ## Linux 发行版评论


    ## Peppermint OS


    在体验了 Linux Mint 多年后，Mint Drake 在 Peppermint OS 中选择了更具风味的尝试，它集成了云应用。


    ### 简述

    Peppermint OS 视觉效果非常丰富，Calamares 安装程序提供了一个安装演示。欢迎中心（Welcome Hub）也提供了许多建议的软件，但捆绑的应用程序很少。


    我喜欢其中很多很棒的构思。Peppermint OS 的构思源于一位导师——你可能好奇的那个 Ken Devlin，他也参与了 Linux Mint 的工作。Mint
    本身源于创建者希望在 Mint 成功的基础上进行开发，同时添加 Web 集成，这是操作系统所需要的“额外动力”。


    该项目有一定的历史，之前构建在 Lubuntu 之上，并融合了 Ubuntu 桌面环境的元素。Peppermint 有两个主分支：一个基于 Debian，而本次评测的版本基于最稳定的
    Debian 版本（Debian 12）Xfce 桌面环境和 Ubuntu 缩略图管理器。


    ISO 大小约为 1.5GB，你几乎没有多少预装应用。在首次启动时，你会发现几乎有两个预装应用。这种轻量级桌面同时使用云应用和本地应用。操作系统被分配给特定的云应用，如
    Kurmo，它可以通过搜索（特定站点）启动。这是一个专用的浏览器窗口。


    最新版本的 Kurmo 带有更新后的 UI，并基于通用编程语言。


    这听起来可能有点吓人，但 Peppermint 努力帮助你导航实时环境。欢迎中心列有一份建议安装的应用程序列表。这允许你从仓库下载每种软件的最新版本。如果你想从其他仓库安装应用，需要手动更新
    `Sources` 文件。


    如果你对现有内容感到满意，Peppermint 的最新版本现在将其分为两个部分：软件和浏览器，以使布局更简单 -。


    你还可以启动软件包管理器，或者下载并设置软件管理器。事实上，欢迎界面实际上是 Peppermint 最新版本中的功能之一。


    该系统的最新迭代版本（2023-07-01）还更新了对用户主目录的偏好设置。在这里我们了解了 `hblock`，它是 Debian 及其衍生版本中普通 hosts
    文件的超级版本。它包含了一个已的恶意域名列表。


    ### 配置

    - CPU: 1GHz

    - MEM: 1GB (建议 4GB)

    - HDD: 10GB (推荐)

    - 架构: x86_64


    Peppermint 提供了一种安装流行软件和网络浏览器的方法（如 Firefox ESR）、广告、跟踪脚本，并防止云应用连接到它们。


    Pep Docs 还包含了捆绑的 XDaily 工具，这是一个命令行系统更新/升级程序，一旦启动，它要求你回答 Y/N 来执行诸如更新、删除旧缓存和更新图标的任务。你也可以通过系统托中的这个小蓝色图标访问系统。


    帮助指南指出了提供的不同软件包范围，因此，尽管什么最适合你的需求取决于你的决定，但 Peppermint 的桌面体验使用了 Metawire 主题和 Papela
    图标集。这些圆形图标很容易找到，并可以轻松地添加到启动栏。


    如果你决定尝试 Peppermint，通过 Calamares 安装程序进行设置轻而易举。从那里开始，如果你以前没有安装过云应用，大部分时间你需要独立操作。该团队维护着活跃的论坛、Matrix
    频道和 Mastodon 页面。


    ### 结论

    - 开发者：Peppermint OS 团队

    - 网站：https://peppermintos.com

    - 许可证：GPL


    Peppermint 非常令人惊艳，并且对于设置 Ubuntu 的任务来说，这对于初学者来说可能非常困难。


    | 特性 | 易用性 | 文档 |

    |---|---|---|

    | 性能 | 8/10 | 7/10 | 7/10 |


    评分 7/10


    ## Fatdog64 Linux 814


    Nate Drake 展示了 Fatdog，这是一个基于 Puppy 并成长为非常有能力的“大狗”的操作系统。


    ### 简述

    Fatdog 是我们长大的小狗。它包含一个优秀的网络浏览器，以及生产力、媒体和编辑工具。它几秒钟即可加载，并有一个出色的管理器。


    每个狗都有风光的时候，对于 Fatdog 团队来说，该项目始于2008年作为 Puppy 的简单扩展。任何有经验的 Linux 用户都会告诉你，Puppy
    轻量且易于使用，但需要更多的自定义和安装额外软件才能成为一个实用的操作系统。Fatdog（正如其名所示）是长大的小狗。它的开发者在一个意味着更多边界的 Puppy
    版本上付出了脚印——这个版本确实令人印象深刻。我们找不到比下载 Fatdog 的最新版本（814）更好的证明了，因为 ISO 仅略大于 300MB。该操作系统比任何
    Intel/AMD 能提供的都要强大得多。我们选择以“丢弃模式”（Throwaway mode）加载系统，它运行在内存中，但如果你愿意，也可以安装到驱动器。然后
    Fatdog 可以使用两个简单文件进行安装——无需分区。


    ### 配置

    - CPU: 600MHz

    - HDD: 600MB

    - 可启动: x86_64, ARM


    （注：后续文本存在大量重复和乱码，已根据提供的唯一内容进行处理。）

