    # >> A REFERENCE TO NCDU


    Disk space is one of those you have plenty of - until you suddenly run out. Disk
    space can disappear for no obvious reason and you need to find what is using it
    up. A disk usage program is standard for this tool, but it is a bit fussy to use
    in this situation.


    ncdu is a terminal program that lists directories sorted by size, and enables
    you to drill through the directories until you find the culprit, using a raw log
    file. It can also delete files or directories, so with care.


    To use ncdu, simply pass the partition you want to examine, it is worth adding
    the -x flag to keep it


    If you are looking at the root, or other file system, you must run it with -x
    to avoid errors and unnecessary information.


    There are other tools, like Gnome''s Disk Usage Analysis and KDE''s Filelight,
    but the benefit is that they are much easier to run: simply effective if you have
    a file system on your disk or if you are troubleshooting system over ssh.


