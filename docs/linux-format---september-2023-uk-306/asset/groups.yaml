    # 3D 地图教程


    # 导入图像


    ![](img/19f01d8418c50f8361fc6069e917f628_67_0.png)


    - 1 创建材质

    右侧视图的侧栏是 Blender 视图中对象属性所在的地方，它填充在图标表示的选项卡中。然而，要找到是哪个图标，请将鼠标悬停在上面。选择“材质”（Material）选项卡。按
    + New（新建）来创建一个新材质。


    - 2 添加纹理

    此材质被分配了平直的灰色，但我们需要为它分配（我们的地图）。点击“材质”（Material）属性中“基础颜色”（Base Color）的黄色圆点，并选择“纹理（Texture）”。应该会有添加纹理的选项。点击加号按钮并选择“图像纹理（map
    image texture）”。


    - 3 切换到材质预览

    你还看不到任何东西，因为视口默认处于“实体”（Solid）模式，它不显示任何材质。点击视口右上角的小图标将视口切换到“预览”（Preview）模式。你现在应该能在平面的面上看到地图纹理。


    # >> 曼德博集合地图


    我们演化出的过程（细分表面、对其应用纹理以及通过位移进行缩放）也可以用于其他地图。对于许多示例，分形可以输出相同图像的许多变体。通常可以使用 GIMP 来渲染分形图像
    <Col > 去色（Desaturate）>。当我们发现亮度正在移动时，使用 GIMP（颜色 Colors）让地图的某些部分比其他部分更亮。


    唯一的问题是这个着色的地图比黑色亮得多，我们可以将其放置在比最小半径的高度。解决方案是使用“按颜色”（By Color）选择这些区域之一。这会选择图像中所有的白色区域。重新应用反转（invert）函数将其从白色变为其他。


    某些曼德博产生的输出比其他的更合适。Sao 产生的输出对于我们的需求来说太“碎片化”且细节了，QFractal 产了更合适的输出。


    对于 Blender 中的右侧平面，使用“对象”（Object）选项卡。例如，对于一张 1080px 的图像，X 和 Y 轴的缩放为 0.9。这使得平面具有
    16:9 的比例。


    一旦你在平面上有了地图纹理，就是时候添加高光并制作表面顶点的高度了。要做到这一点，请使用位移（displacement）。分形图像（热力图）影响对象（平面）的形状。


    在属性中选择“修改器”（Modifier）选项卡。修改器会更改在视口中渲染的方式。我们通过更改底层对象得到了最终结果。如果平面在图像内向上移动，不应担心位移（Displace）。


    在 Blender 中有一组属性可以用于编辑位移（Displace），将热力图作为纹理添加的过程添加地图图像纹理类似。在这种情况下，我们需要在“纹理”（Texture）选项卡中添加新纹理，点击添加地图图像纹理。你应该看到平面表面的高度根据位移的相对亮度进行更新。通过更改位移修改器的“强度”（Strength）和“混合”（Blend）参数，可以控制热力图应用于平面的效果量。Blender
    大多数参数滑块都非常敏感，双击然后手动输入参数值或拖动滑块进行控制。


    # 改进细节


    如果你缩放平面的表面，你会注意到高度变化大致是粗糙生成的且具有多边形特征。这并不意外，因为平面表面的顶点分辨率仅为 100-150。改进 3D 地图输出的第一步是点击平面并设置着色模式（Shade
    Mode）来制作平滑着色。


    我们还可以使用以下方法增加组成平面表面的顶点数量


    ![](img/19f01d8418c50f8361fc6069e917f628_67_1.png)


    # 3D 地图教程


    如之前一样，来自“细分”（Subdivision）选项卡的修改器，但这次选择“细分”（Subdivision）。修改器按顺序处理，因此移动细分修改器，使其位于位移修改器上方。细分修改器的作用与所有修改器一样，不改变几何结构；这些简单的更改是在场景在视口中显示或渲染到文件时完成。注意此修改器有两个参数，一个在视口中执行，一个用于最终。在两种情况下，将此改为
    2 就足够了。


    回到材质编辑器并像你做的那样调整一些参数。“粗糙度”（Roughness）参数使表面发光，甚至产生额外的阴影。随着它的增加，它会变得更哑光。


    ![](img/19f01d8418c50f8361fc6069e917f628_68_0.png)


    # 灯光、摄像、动作


    现在我们在平面上有了 3D 地图，我们需要让它进入渲染状态。第一个问题是考虑光照。Blender 默认使用单点光源为对象的所有侧提供光线。像这样的 3D 地图对象会在场景中显示更多的对比度和阴影。我们需要一个小且靠近对象的光。


    要查看光照效果，确保视口处于“渲染”（Render）模式。点击场景顶部的灯光图标。点击灯光在视口中或右侧边栏顶部的“集合”（Collection）面板中选择它，并用鼠标移动它。


    '
