    # 教程 Pi Pico


    # 多线程


    # 使用 NeoPixels 制作一个酷炫的骰子投掷器


    Les Pounder 正在学习多任务处理，但我们认为他误解了情况。Raspberry Pi Pico 由双核 ARM CPU 驱动，我们可能会学习如何独立运行两个
    MicroPython 线程。核心 0 将等待用户按下按钮，当按下时，代码将选择一个随机数来模拟 d20 投掷。如果用户不确定显示什么，我们可以使用 I2C
    连接到 Raspberry Pi Pico 的 TM1637 七段显示器。


    ## 专家

    Les Pounder 是 Tom''s House 的副编辑，一个天生的自由创作者。他在以下博客中了他的冒险和项目：


    - Pi Pico

    - Pico W

    - TM1637

    - 七段显示器

    - NeoPixels

    - 跳线线

    - 面板

    - Python


    ## 需要


    通过双核编程来显示随机生成器（Raspberry Pi Pico）。在 Thinny 中连接你的 Pico，并设置端口以匹配 Pico 的位置。


    ## 代码


    在项目中创建一个新文件并粘贴此链接：https://github.com/self/LXF306TM1637/ 示例 MicroPython 驱动。我们将该文件保存到
    Raspberry Pi 上，命名为 neopixel.py。从链接复制并粘贴到新文件中。关闭这两个文件。关闭这两个文件。


    创建一个新文件并导入一系列模块（库），从代码开始。使用 pin 控制 TM1637 显示结果。然后导入 random 和 thread（以创建并发运行的线程）##
    设置


    在连接 BOOTSEL 按钮时，连接你的 Raspberry Pi Pico。去 https 安装适用于 Pico 的 MicroPython 版本。我们使用软件包管理器安装。


    ```

    $ sudo install installropy

    ```


    打开 Thinny 并将 Pico 连接到你的机器。进入 Tools > Options 并选择解释器 Table。然后选择导入 MicroPython


    ```python

    import random

    import thread

    from neopixel import neopixel

    ```


    ## 构建代码


    在输入部分，一个按钮连接到 GPIO0 和 GPIO16。输出部分 TM1637 连接到 3V 和两根线（绿色 GP27 和黄色 GP22），这些提供了到
    Pico 的数据连接。显示是 NeoPixels 的输出。我们使用 3V 和 GPIO 连接到 NeoPixels 的数据。请参考图像了解更多细节。


    '
