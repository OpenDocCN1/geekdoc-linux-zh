    ## 深度解析 AWS 对比 Azure


    # 亚马逊 VS AZURE 的对决


    | AWS | Azure |

    |---|---|---|

    | 规模 | 2022年其规模是其他 12 个竞争对手总和的六倍，但其市场份额已从40% 下降到 2023 年的 32%。 | 截至2021年4月报告服务器更多且仍在增长，2023年市场份额为
    23%。 |

    | 大客户（每月支出报告） | Netflix ($300亿), Apple ($90亿), Amazon ($880亿), Twitter ($70亿)
    | Verizon ($500亿), LinkedIn ($410亿), Azure ($400亿，它同时使用两者), Intel ($390亿) |

    | 数据中心位置 | 遍布21个国家的56个区域 | 遍布140个城市的60个区域 |

    | 服务水平 | 退款按区域定义 | 对 SaaS 提供强力支持；在原生计算和虚拟机方面较弱 | 与企业客户建立关系，并通过合作伙伴和专家支持强调项目的成功
    |

    | 定价模型 | 四个不同级别，硬件成本运行独占性 | 基于整体能力的三个定价方案，当需求高涨时可能会暂停或折扣最便宜的方案 |


    在平额固定费率的时间和空间块上，而 Azure 倾向于针对特定任务采用部署解决方案，例如通过 AI 扫描你的整个数据湖以寻找客户内部的趋势。


    总的来说，使用 Azure 管理预算可能会有点复杂，因为它涉及到更广泛的组件和能力。如果你想在私有位置运行机器，并连接回公司办公室以作为运行 Active
    Directory 的网络，那么这不一定是一件坏事。


    亚马逊提供了一种更简单的服务模型 - 足够灵活，并不总是要求你启动一个完整的虚拟机。如果你只需要一个静态或廉价的云配置，这非常合适。


    然而，为了进行连接，你需要在云中准备一些函数——但是，当下一次续约到来时，情况可能会变得有趣（参见第74页的 Jet Off 框）。


    你构建了一个只能在其中一个平台上运行的任务。如果你使用带有系列配置文件和操作系统安全措施的基于 Linux 服务器，你会在亚马逊那里感到如如家——如果你处于
    Windows 环境中，拥有用于将你的各种付费组件以连贯、单一方式连接的解耦活动和脚本，你更有可能在 Azure 上感到舒适。


    ## 客户、供应商与希腊人


    云端为多样性、不同的存储模式和托管模型留下了很大空间。云中最不虚拟化的部分关注的是提供网页和数据，而不是进行奥秘的计算。一个带有许多小容器、箱和蛋的轻量级
    Web 框架非常容易分发到容器化。


    技术通常已成为一种维护平台的方式，并有不同的技术来满足特定需求。对于许多场景（例如 Web 服务器），这些容器可以以廉价的方式运行，而不是全虚拟化。


    技术通常已成为一种维护平台的方式，并有不同的技术来满足特定需求。作为提供资源的方式，编排器可以管理需求和系统健康。估算成本在亚马逊 处是复杂的，而在 Azure
    上，离散的实例可能更容易监控。


    如果你有一个容器化的软件堆栈，在亚马逊和 Azure 之间会有所不同。前者帮助你在黑内部实现容器，但 Azure 在这方面更好，它提供了一个可以在任何地方部署容器的平台。


    不要急于跳跃，尽管对于小型企业来说，使用容器可能没有太大益处，因为他们可能遇到需要快速扩展的突增需求。


    ## 关于成本，开始


    这两大云服务不仅体现了不同的哲学——它们有不同的定价方法。遗憾的是，这些服务并不像支付固定月费那样简单，而是取决于你使用的特定服务及其程度。更重要的是，价格可能会根据不同的市场状况发生巨大变化。


    尽管如此，对于粗略估算，亚马逊提供了一个定价计算器：https://aws.amazon.com/pricing/calculator/，你通常不需要深入挖掘定价惯例，但两者都倾向于将信息推到面前，提供各种优惠活动和包。

    亚马逊可能更偏向于优惠活动


    ## AWS 对比 Azure 的深度解析


    独立 AWS EC2 实例的控制面板——这是运行 Nextcloud 的地方。


    它通常提供了一种你从办公室角落的旧服务器上无法获得的韧性。然而，主主机没有方法操作你的虚拟机——备份和过程通常保留在私有云内部，因此在需要时（无论好坏）可能无法很好。


    Azure 端点管理控制面板的一部分。


    ## 两巨头


    ### Google Cloud

    技术通常已成为一种维护平台的方式，并有不同的技术来满足特定需求。Google Cloud 在安全方面投入了大量资源，利用 AI 系统检测并反网络威胁。它的平台很高，且运行良好。


    ### DigitalOcean

    最低廉的云供应商之一。DigitalOcean 提供的功能没有竞争对手那么多，但它更专注于以负担得起的价格提供简单的云功能，并且良好。


    ### OVHcloud

    作为专注于欧洲客户的法国云提供商，OVHcloud 是欧洲最大的云托管提供商，根据物理服务器数量位全球第三。你可以从 VPS 或专用服务器中选择类型和区域。


