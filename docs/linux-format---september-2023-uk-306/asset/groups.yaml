    # 教程 智能自助终端


    这是为了让常用框架在 Wayland 服务器上正常运行。


    ## 智能基础设施


    在工作站上搭建基于 Ubuntu Frame 的测试环境后，是时候创建一些智能显示架构了。为此，我们将使用 [Dashk](https://dashboardk.readthedocs.io)
    服务，管理员已安装了该产品。Canonical 在官方文档中对此予以。此外，该长期运行的产品已经成熟，并作为可直接部署的 Snapshot 提供。该产品的实际架构见所示（下方）。


    Dashboard 生态系统提供了系列额外的应用，例如 Android 和 ChromeOS，但我们现在不会使用它们。


    现在回到主界面，我们在这里使用 Dashboard 服务器：


    ![](img/19f01d8418c50f8361fc6069e917f628_47_0.png)


    ```

    sudo snap install dashboard

    ```


    运行上述命令后，你将获得 dashboard v2.7.1 —— 在在你回过之前，Snap 可能会更新。


    有趣的是，Dashboard 应用并没有完全集成到命令行中。相反，


    ![](img/19f01d8418c50f8361fc6069e917f628_47_1.png)


    不要恐慌！这是标准行为：一个灰色启动屏幕。


    Wayland。调用会启动显示服务器 —— 它显示一个与（上方）所示类似的符号。


    由于我们将符号附加到 ubuntu-frame，当 Ubuntu Frame 运行时，终端不会阻塞。然而，消息（我们将通过 Ubuntu Frame 查看）将在命令行窗口中显示，只要变量被设置为目标显示，产生的任何输出，任何被调用的
    Wayland 都会显示。


    ```

    sudo snap install gnome-dashboard

    ```


    这是 Dashboard 应用的一个非常良好且标准的安装方式。按照以下命令启动它：


    > gnome-dashboard


    应用程序启动后，Ubuntu Frame 显示状态消息 [2023-07-08 20:52:06]: New: Dashboard。这确认了应用程序与其显示服务器之间的成功连接。


    将应用程序适配到 Ubuntu 系统取决于开发者所使用的框架。某些基于 Qt 的程序在启用 Wayland 连接之前需要输入。


    最后，Canonical 在 https://dashboardk.readthedocs.io/paper 提供了一篇论文。它描述了：


    ### 快速提示

    本文概述的过程对计算机资源非常节约。完全使用进程并无帮助，过度配置是没有必要的，在经济上也是不合算的。


    ## 去中心化的优势


    虽然该过程简化了集群的复杂性，因为节点可以在中心位置进行管理，但请注意这种方法也有缺点。


    如果中央终端故障，整个系统都将离线。此外，这个问题可以通过多种方式解决。例如，高质量的集群（工作站）通过在每个应用中使用廉价组件（理想情况下不是最智能的设备）来限制潜在故障的数量。


    其次，对集群的要求较低是因为它们可以用廉少的钱购买 —— 这样做提供了一种应急处理的能力，即使可以指导不熟练的工人关闭电源并切换到另一台设备来代替。


    如果系统不在同一局域网内，就会产生额外问题 —— 网络运营商可能会进行网络划分，有时会产生灾难性的结果。


    选择最佳方法显然取决于你的情况。但在提交过度集中的解决方案之前，请记住这里列出的问题。


    组件中存在一个服务器用于提供各个接收器，这些接收器都是可显示的内容。


