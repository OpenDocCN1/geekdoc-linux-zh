    # SAFECOLOST


    致谢：https://github.com/Safelist/safelist


    ## 深藏的秘密


    一个总是把底牌藏在胸里的男人，他就是自己，我们费力说服 Shashank Sharma 揭示他是如何保护密码的。


    每个人都有不可隐的事，除了我和我的家人。然而，披头士乐队比我们快了一步。现代世界的正确表述应该是：“每个人都有不可隐的秘密，尤其是我和我的家人。”如果你仍然将密码和其他重要信息保存在草稿邮件中，人们会犯的错误之一就是由于不幸地不愿记住多个登录凭据，而在不同的在线服务中使用相同的用户名和密码组合。使用
    Safelist，你可以安全地存储所有的登录凭据和其他信息。市面上有很多密码管理器可用，而不是完全听命于你选择的第三方。由于这些工具内置在多个桌面浏览器中，你可以在指尖上访问你的秘密，你的服务永远不会被破解。


    ![](img/19f01d8418c50f8361fc6069e917f628_49_0.png)


    | Safelist | 添加 | 更改 |

    |---|---|---|

    | class3 | | |

    | leakages@example.com | | |

    | example@gmail.com | | 2021/11/25 08:46 86% |


    你可能需要检查 Safelist 的 GitHub 页面或网站 (safelist.io/) 以获取完整的功能列表。目前，你会发现该项目是跨平台的，这让你能够从
    Windows、Mac 和 Android 设备访问你的秘密。


    该软件使用 Rust 编写并遵循 GPL-3 协议，桌面发行版的软件仓库中未提供。如果你安装了 Rust 和 Cargo，可以使用你的发行版包管理器安装这些内容：`sudo
    dnf install rust cargo`（这会在基于 RPM 的发行版上安装）。同样，如果你运行的是 Ubuntu、Debian 或其衍生版本，可以运行
    `sudo apt-get install rust cargo`。


    你现在可以从源码使用 Safelist 了。首先使用 `git clone https://github.com/Safelist/safelist` 克隆
    Safelist 仓库，然后进入 `safelist/` 目录并运行 `cargo install --path .`。


    或者，你可以使用 Releases 页面上的 ZIP 文件。这会创建多个副本：


    ## 你的秘密


    在添加条目时，添加值后可以按 Tab 键创建一个新条目，或按 Enter 键在当前抽屉创建一个新条目。


    Safelist 的顶栏故意保持为空，这样你就可以看到是否有未保存的更改。要保存，按 `Ctrl+S` 创建新条目，再次按 `Ctrl+S` 关闭当前打开的抽屉。Safelist
    在关闭之前会自动保存抽屉中的更改。如果你想编辑抽屉中的条目，请从列表中删除它并按 `Ctrl+下方向键`。在为抽屉中的条目添加值以创建新行时：


    你也可以使用按 Esc 键访问菜单来选择想要执行的操作，包括抽屉的密码。还可以从当前抽屉或另一个上下文中的抽屉导入数据。Safelist 不会创建空的秘密文件。因此，在示例中，在我们向其中创建一些新条目之前，`~/secrets/binfiles`
    文件不会被创建。保持文件为空是一个良好的习惯，也可以作为额外的安全措施。


    50 LINUX 2023年9月


    www.lifformat.com


    # 终端教程


    将合适的 safeclet 移动到 PATH 目录中。在这种情况下，使用 `build/x86_64-linux/safeclet` 文件到 `~/Local/bin`。


    使用上、下方向键导航抽屉中的条目。要查看条目的秘密，按回车键显示，其他条目将保持隐藏。如果你想保留抽屉中条目的密码和短语，可以使用 `-h` 命令启动 safeclet。切换
    `safeclet /Documents/` 将显示抽屉中的所有条目，而值将是隐藏的。


    ## 衣柜及其秘密


    要开始使用 SafeCloslet，你必须创建一个柜（closet）。你可以创建任意数量的柜，但每个抽屉至少需要有一个。实际信息存储在抽屉中。柜和抽屉都受
    safeclet 保护。


    使用 SafeCloslet 时，如果抽屉已存在，SafeCloslet 会打开它，否则将创建一个新的。例如，`safeclet /Documents/`
    命令将在 `~/Documents` 内部创建一个抽屉。


    当你创建一个柜时，SafeCloslet 会打开该柜，然后你就可以创建抽屉。按 `Ctrl+n` 进入创建新抽屉的模式。你需要为顶层抽屉提供密码。你可以为它选择任何名称，如果你愿意，甚至可以留空。


    如果你发现柜的名字不对，SafeCloslet 不允许重命名抽屉，也不会移动任何柜内部的抽屉。这是故意设计的，为了保护你的敏感信息。虽然你可以为柜提供任何名称，但无法重命名或移动其中的单个抽屉。


    要打开抽屉，按 `Ctrl+o` 并输入你用于 safeclet 该抽屉的密码。


    > 如果没有向 safeclet 命令提供 `-p`，指定的密码将在当前工作目录中创建。如果你不小心，可能会在不同目录下产生多个同名的柜。


