    Ubuntu is the reverse favourite distros for creating derivatives, and Cubic is
    one of the tools to help you make one of yours. Unlike other tools for the job,
    Cubic is actively maintained and offers a lot of flexibility to run your custom
    Ubuntu-based distro. You can use it to create, edit packages in your distros,
    swap kernels, create a wallpaper, and lot more.


    ![](img/19f01d8418c50f8361fc6069e917f628_83_0.png)


    instance, when you use your custom ISO to have the freshest software, run sudo
    apt update && sudo apt upgrade

    You can also use apt to add or remove software.

    You can also use chroot to update the list of software sources. Similarly, you
    can copy any files and folders inside your custom distro.

    If you''ve installed additional kernels, besides the default one in the ISO, Cubic
    gives you the option to select it as the default for your custom distro, or run
    it through the wizard. Cubic generates the ISO of your custom distro and also
    lets you test it using Qemu.


    Cubic is fairly straightforward to operate, but the project does have a comprehensive
    guide on how to guide your hand through the process


    ![](img/19f01d8418c50f8361fc6069e917f628_83_1.png)


    # # DISK SPACE MANAGER


    # # Filelight


    Version: 2023.04 Web: https://apps.kde.org/filelight/


    a rolling stone gathers no moss, the more you use a distro, the more it accumulates.

    Over time, unnecessary files clog up your partitions and leave disk options.

    Finding space usage is no big deal in Linux, thanks to the du command that can
    summarize and summarize disk usage if you need. But graphical is far better than
    Filelight, which shows disk usage in a visually coloured radial array.

    Filelight is available as a Flatpak, which makes it easy to install even in non-KDE
    distros. You can get it from Flatpak flatpak install flatub filelight

    If you want to explore the complete filesystem or the contents of a specific folder
    to identify hot spots or files and subdirectories that are taking up the most
    space on your drive.

    The app graphically represents the space used by the inside selected folder or
    your filesystem as


    ![](img/19f01d8418c50f8361fc6069e917f628_83_2.png)


    a set of concentric segmented rings. Each segment in the radial is represented
    by different colours. Bright coloured segments are folders, while grey are segments.

    All segments are listed, and you can hover over each of them to view details about
    the specific file. Clicking on click, the app offers to select the selected file.
    You can also right-click on a file, which opens a context menu and what other
    options gives you the ability to open a file in the terminal.

    The app supports several colour schemes, with the default one known as Rainbow.
    You can switch to a different colour scheme by heading to Filelight Configuration
    section and switching to the Appearance tab.


    By default, Filelight only focuses on files that are taking up a large amount
    of disk space, you can also use the app to display small files as well.


    84 | LXForum September 2023


