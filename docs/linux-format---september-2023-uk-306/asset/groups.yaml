    - USB 音频

    ```


    在示例图中我们可以看到它有一个 USB 手册、OS 音频手册，并将关于如何处理音频的音频。


    我们喜欢 AV Linux PDF 手册的外观。它向用户展示了通过 JSAK 使用首选界面的音频基本信息和支持，但在维护媒体资源时你可能需要做更多。


    AV Linux 提供了一个关于该发行版的信息页面。有一个 52 页的 PDF 手册，与当前版本保持同步，并涵盖了包含的工具和配置工具的各个方面。手册是它的亮点。在处理
    AV 时，Linux 资源是支持的首选。


    ## 结论


    | MODIA OS | FEDORA DESIGN SUITE | 6/10 |

    | UBUNTU STUDIO | AV LINUX | 7/10 |

