    Version: 7.71.4 Web: https://alienarena.org


    ![](img/19f01d8418c50f8361fc6069e917f628_82_0.png)


    if you like first-person shooters as much as we do, you''ll love Alien Arena.
    Nearly two decades later, the game''s sci-fi theme and the Quake and Unreal-inspired
    deathmatches are still popular, as it is plethora of characters, tons of maps
    and multiple playable types.


    The game is available in the official repos of several distros, such as Ubuntu,
    but to ensure you have the latest version, download it from Flatpak with `flatpak
