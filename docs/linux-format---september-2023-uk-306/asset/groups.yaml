    Desktop access as an option (which is very confusing if you don''t). Plus, to
    the on-screen keyboard in Desktop mode, the Steam app needs to be running, Accessing
    the on-screen keyboard is done by pressing Steam+. Becoming common now, single-NVMe
    M.2230 SSDs used to be as rare as teeth.


    ## REMOVE AND UPGRADE YOUR STEAM DECK''S SSD


    - 1 Battery Storage mode

    Before opening, Valve recommends enabling Storage mode for safety; the Steam Deck
    won''t respond to power button presses. Plug the Deck into the charger and hold
    it down. Hold the volume-up (+) and press the power button. Release both buttons.
    Using the D-Pad and A button, select Utility > Power Menu > Battery Storage Mode.


    - 2 Unscrew the Steam Deck

    Unscrew the screws on the back of the Steam Deck. The four inner screws are shorter
    than the four outer screws. Remembering this helps when putting the system back
    together. Use a spanner or a sturdy piece of plastic to open up the SSD. Do not
    use any metal because you want to avoid damaging the handheld.


    - 3 Remove the inner metal sheet

    Next, you have to remove the metal sheet covering the SSD. This has up to four
    screws—ours had three. There''s one on the top-left and two screws on the bottom.
    You''ll need another screw beneath a sticker on the upper-right. Peel the sticker
    to expose the screw but don''t completely remove the metal sheet you have to pull
    it back down.


    - 4 Unplug the battery?

    As we''re using Storage mode, this is optional as it won''t accidentally power
    on, but for extra safety, you should unplug the battery. It is slotted so you
    pull instead of using a tool. Use your fingernail or the edge of your pry to slowly
    pull the battery out. Don''t rush this because you could easily damage the battery.


    ## REMOVE AND UPGRADE YOUR DECK''S SSD CONTINUED


    Undo the screw holding the SSD in place, remove the SSD''s covering. Place the
    SSD over the SSD you want to install. Insert the new SSD and screw it into place.
    The final part of the process is to put your Deck back together. Plug the battery
    back in, and screw the screws in.


    ## Replace


    You might want to set a password before you continue as it will ask later, so
    go to the bottom bar and tap the launcher (bottom-left). There go Konsole+, type
    to set a password, or create your Steam Deck profile image at the top of the launcher,
    and Change Password on the right. Picking something simple, because you will type
    to see password at all. It doesn''t even come up asterisks as you type, so choose
    a 20-character-long monster password. Now type label in the Konsole.


    Ensure you format your SSD beforehand and as a GPT-partitioned disk: it''ll be
    ignored but it needs to be GPT-partitioned for the Steam Deck to work. When you
    want to make a note of your NVMe drive''s name, Usually that''s something along
    the lines of nvme0. Make sure the SSD isn''t flagging, battery-wise, and plug
    your new NVMe drive into the Steam Deck using your adapter. Follow the info into
    Konsole - out do `lsblk` and add your ownership with it: `sudo chown /dev/nvme0n1
    $USER`. Depending on how many things you''ve downloaded, it might take a while.
    Then follow these steps to install your new NVMe SSD. Plug it in to boot out of
    Battery mode and, hey presto, it should be no questions asked. Check your storage
    situation and could help you reuse NVMe drives of any size: this adapter cost


    ## Download SteamOS


    Now we need to install SteamOS. On your PC, head to https://deckos.com and click
    Download SteamOS Image. This image needs to be written to the GPT-partitioned
    USB stick. To keep life simple, you can grab Etcher from https://etcher.io, install
    that and get it to the USB stick.


    ## SteamOS on Deck!


    Plug the USB stick into the Deck. Press the power and volume buttons. At startup,
    release the power button but keep holding the volume-down button until the BIOS
    appears. Select your USB device and it should boot to the desktop - we have not
    opted. Click Steam Deck from the desktop and mode from the console instructions.
    The Deck first has to initialise the new drive, but once in, you''ll have a universe
    of space under storage. You can then test your drive. The external SSD probably
    runs at 100MB/s, while your internal 512GB NVMe runs at 3,000MB/s - it''s 10 times
    faster than the internal storage.


    ## Meet the technology experts


    - The world''s most comprehensive technology website

    - An unrivalled mix of news, opinions, reviews and features

    - All-new design, new homepage, new features and special reports

    - Backed by over 300 years of editorial experience


    TORIALS Reverse proxy NGINX


    Credit: http://nginx.org


    ## Access services with Nginx reverse proxy


    Nick Peers discovers how to open your services to the internet with this user-friendly
    implementation of Nginx.


    EXPERT Nick Peers

    Obsessed with self-hosting. From media and jellyfin to Nextcloud and Motioneye,
    he makes everything so much easier to configure for remote access Nginx Proxy
    Manager. He is the life of the party!


    if you''re looking for a way to access self-hosted services from outside your
    home, you have two basic choices. For maximum security, set up a VPN tunnel that
    you''d need to dial every time but if you''d like a simpler option that''s still
    secure, and gives others access, use a reverse proxy.


    One of the best tools for the job is Nginx Proxy (nginx.org), but it''s not the
    most user-friendly, unless wrapped in deployment-friendly containers like LinuxServer''s
    Swag. The ease of dealing with conflicting domains allows you to open up subdomains
    too like hard. Creating subdomains for each of your services makes them easier
    to configure for remote access using Nginx Proxy Manager. work, you''ll love Nginx
    Proxy Manager. It enables you to set up, view, and manage all your connections
    via a simple interface. Like Swag, Nginx Proxy Manager is distributed as a Docker
    container. If we''re assuming you have Docker set up and configured, and have
    some knowledge of how it works. Nginx Proxy Manager can be installed on any machine
    or network, but we''re assuming you''ll need it running 24/7, so you''ll want
    it installed in Docker where it''s likely most other shared services are also
    running, man of which may be running in Docker.


    ## NGINX PROXY MANAGER


    Nginx Proxy Manager can redirect any traffic to any service on your network. If
    you are using other Docker containers, they must all be on the same (custom) bridge
    network as Nginx Proxy Manager.

