    抽屉内可以创建条目的数量没有限制。如果你最后有了几百个条目，查找它们将是一项任务。使用 `/` 搜索键可以查找条目。要查看某个条目的秘密，按回车键显示，其他条目将保持隐藏。如果你想保留抽屉中条目的密码和短语，可以带
    `-h` 命令启动 safeclet。Safelist 不会创建空的秘密文件。因此，在示例中，在我们向其中创建一些新条目之前，`~/secrets/binfiles`
    文件不会被创建。保持文件为空是一个良好的习惯，也可以作为额外的安全措施。


