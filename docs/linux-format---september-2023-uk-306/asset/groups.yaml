    ## Plasma 有什么变化？


    Plasma 6 将包含许多新花样，同时一些现有功能将面临删减。


    ## 欧洲怀疑论


    即将推出的 Plasma 6 桌面工作正在进行中。根据 KDE Wiki，它构建在 Qt 6 之上，计划于 2024 年初发布。新桌面不会预装在所有系统中，但
    KDE 解释了如何在 KDE Neon Unstable 等操作系统上部署当前桌面。


    即将推出的功能包括即使在资源匮乏的情况下的重大重构。系统设置中也留有了音频主题的位置。尽管如此，某些桌面功能将在 6 版本中被移除。KDE 开发者 Nate
    Graham 在 7 月 26 日的网站上解释说，可以在此处找到列表：community.kde.org/Plasma-6 @NateGraham


    移除了 Khotkeys，这是一个非常实用的功能，传统上允许用户使用按键甚至鼠标手势创建全局快捷键。注意，并非所有功能都能良好运行，其他功能由于项目活跃时间不够长而存在
    Bug。Plasma 6 将完全移除 Khotkeys，转而采用支持键盘快捷键的全局快捷键（Global Shortcuts）。


    其他功能包括 Windows 小组件运行器，它可能会出现在搜索中。这导致了用户的困惑，因为他们的组件是功能全的应用程序。Plasma 6 还在移除一些在桌面界面更改图标大小的方法。


    Joe Boecker

    Percona 社区负责人。


    很难反对“产生新线索的网络安全年”这一目标，但留出余地很重要。在 CRA 中，除了免费和非商业化之外，没有对开源软件的定义。然而，“开源”的定义包含了某人付费为该项目工作或提供支持的情况。这导致了意料之外的后果。


    这种影响的预期范围将影响每位贡献者，并使较小的玩家处于不利地位。对于欧洲开发者来说，其伤害大于收益，导致他们考虑自己的处境。这可能会以其他方式驱动开源的发展。


    然而，他还解释了某些主要差异背后的背景。


    吉祥物 Konqi 将不会帮助 Plasma 6 桌面的发布，计划在 2023 年或 2024 年的某个时候。


