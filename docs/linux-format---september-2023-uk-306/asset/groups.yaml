    It takes places in environments set in a futuristic universe


    ![](img/19f01d8418c50f8361fc6069e917f628_82_1.png)


    the several human and alien characters as your avatar. Size, visibility and profile
    of each player character is roughly the same, and there is no advantage over the
    other.


    When you join a server, you have the option to join one of two competing teams
    in the map that''s spawning, while the human and alien look different from each
    other, they are identical in their behaviour.


    Before you begin playing, remember to use the game''s configuration options. From
    both the mouse and the keyboard, you can also alter a variety of settings that
