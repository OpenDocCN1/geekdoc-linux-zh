    # ## Raspberry Pi


    The first thing we need to explain is how the RTKGPIO''s GPIO header differs from
    that of the Pi. It might seem a bit weird to explain which of the Pi''s GPIO-related
    functions it doesn''t support, but if you are preventing something that you won''t
    need, here''s short in brief. Note that our reference to the Pi''s 40-pin header
    refers specifically to the Pi used in more recent versions, not the 26-pin original
    Pi+.


    Commonly, the term GPIO refers to a pin that can be configured as a digital input
    or output, but that isn''t quite enough, because the Pi''s pins provide access
    to more than just GPIOs. Several pins provide access to external circuits - specifically
    +3.3V and GND (0). Some of the pins are used to output PWM signals. The two pins
    are used to access a UART, which provides serial signals. Finally, some of the
    pins on the header can be used as various other protocol interfaces, specifically
    the I2C and SPI interfaces.


