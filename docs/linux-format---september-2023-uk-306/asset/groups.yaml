    Media creation is a very broad spectrum. The requirements for something as drawing
    with a tablet might be very different from those for recording music. For one
    thing, setting up an art station might be good for an older computer; whereas
    audio recording tends to hit the hardware resources to a greater extent.


    Many of the smaller support tools for audio work, such as utilities and plugins,
    can be quite fiddly to get working. For example, there is no universally agreed
    on location for plugins.


    Most Linux installations require a few tweaks to work well for audio creation
    and we to make sure that each of these distros was unexpectedly optimized. It''s
    not really fair to say that a distribution is ready to work with audio in, in
    fact, the playback would glitch and stutter even though applications like Ardour
    could technically run.


    ![](img/19f01d8418c50f8361fc6069e917f628_25_1.png)


    > Linux has become a creative hotbed, from Blender torita and Audacity to Ardour,
    but these packages can be non-trivial. Enter media-creation distros. These are
    already installed and preconfigured applications and utilities. This software
    can cover a range of creative areas, such as graphics, video and music. When you
    use standard Linux distributions, most of the ones we are featuring here all sorts
    of tweaks that make particularly suitable for media. Also, all of these distributions
    function as a line


    distro, making them even more useful when creative juices are flowing but you
    have to use someone else'' setup.

    Ubuntu Studio is, as the name suggests, the official flavour of Ubuntu that''s
    optimized for audio and video apps. Fedora Design Suite is based on Fedora Jam,
    and it is also based on Linux, and it has an emphasis on music and audio apps.
    AV Linux is based on a broad media-creation project, and it''s on MX Linux. Modicia
    OS has flashy and some interesting optimizations, and uses Ubuntu (LTS release)
    as its base.'
- md: '

    ## Customisations & extra features


    How does each distro do?


    All distributions, from Fedora Design Suite, have a JACK server installed and
    configured, which is what most Linux apps offer. Of those four, only few customisations
    allow the user to join the ''audio'' group, something that makes audio much smoother.
    A slight difference is now running on PipeWire, a new audio system for Linux.


    AV Linux uses the Linux Kernel (Real-time), a special build of the Linux kernel
    that is tuned for performance in areas such as usage, processing scheduling and
    CPU frequency. The compromise is that it has lower throughput in some cases. You
    may have to tweak hardware for that performance. Keep in mind that if you are
    on a laptop, a non-standard kernel could throw some unusual problems in cases,
    but rarely ever.


    Having the Linux Kernel installed is a boon for modern workflow. Ubuntu Studio
    comes with all the ALSA tools, a set of configuration tools that covers many areas
    that need to be left for the user to tweak manually in most distros. This includes
    a tool to install various aspects of system and hardware information, also to
    manage iPads and iPhones. Its inclusion adds to the feeling that AV Linux is a
    sweeter distro.


    Ubuntu Studio uses the low-latency kernel. This is an officially supported variant
    of the standard kernel, meaning that there''s a closer to a setup than one uses
    the Liquix Kernel, and it does offer improved performance for real-time multimedia
    tasks. The Ubuntu Studio Installer allows you to add some custom distros for troubleshooting
    and performance. You can also run PipeWire. Ubuntu Studio is the only one of the
    distros with a GUI to help use PipeWire if you prefer to revert to the older-style
    setup until PipeWire is installed.


    Media OS runs the ''generic'' kernel, but the developers have also implemented
    some tweaks in areas such as swap for performance. Windows emulation layer is
    installed and configured.


    ## VERDICT


    | MEDIA OS | 7/10 | FEDORA DESIGN SUITE | 5/10 |

    | UBUNTU STUDIO | 8/10 | AV LINUX | 8/10 |

    | FEDORA JAM | 7/10 |


    Ubuntu Studio has most of the customizations that you need for a media creation
    computer applied in advance.


    ## Base distro and package repro


    We need a solid foundation with access to the latest software.


    Understandably, all of these distros offer 64-bit builds. They all have some capacity
    as a live distro. For some of them, the preferred base distro will come down to
    previous and previous versions. AV Linux based on MX Linux is based on the stable
    branch of Debian. This gives command-line tools that will be largely familiar
    to users of other Debian derivatives, such as Ubuntu and Mint.


    It draws its packages from the MX repositories, which are more updated than what
    Ubuntu Studio has to offer in way of audio software; in other, Ubuntu Studio has
    more up-to-date packages.


    Fedora Design Suite is based on Fedora, and therefore we use the Fedora repositories
    and command-line tools, such as the DNF command-package manager. These repositories
    are slightly ahead when it comes to offering up-to-date music tools. In addition,
    both distros have access to Flatpak packages.


    Making the issue more complicated, the Debian/Ubuntu-based distros can add all
    the KOSUbuntu repositories, which are the most up to date repositories of multimedia
    tools and applications, also a plus. PPAs are another source of up-to-date software.


    Media OS is based on Ubuntu, which might be a disadvantage as cutting-edge media
    tools, particularly requiring bleeding-edge libraries. Ubuntu Studio, on the other
    hand, has LTS and stable release versions.


    ## VERDICT


    | MEDIA OS | 6/10 | FEDORA DESIGN SUITE | 7/10 |

    | UBUNTU STUDIO | 9/10 | AV LINUX | 8/10 |

    | FEDORA JAM | 7/10 |


    It''s a bit messy. Ubuntu Studio has the most up-to-date distros.


    * www.techradar.com/pro/linux


    September 2023 LXF26


    ## ROUNDUP Media-distros


    ## Using the user flow interface


    Creative flow is paramount.


    7/10 AV Linux

    6/10 Fedora Design Suite


    The requirements of all that''s used for media apps are not massively different
    from that of desktop. The interface should be quick and easy, as you often need
    to be on the ball when using Linux as the hub of your desktop. In the case of
    distribution number of tools, the launcher should be convenient and make use of
    categories. Clarity in areas such as search is important.


    The default Linux theme is dark, and it makes some use of transparency and flashy
    looks at the expense of some extra resource usage. Along the top is a large dock,
    with some major features, while at the bottom is a smaller taskbar and dock. On
    the background, there are useful status displays showing real-time updates on
    execution, memory usage and CPU performance. As might expect from Xfce desktop,
    there''s great scope for customization with features spread across out. This is
    largely down to how Xfce works, and the MX theme further duplicates the options.
    However, switching to the light theme might break the session in a nearly unnamed
    environment.


    The desktop here is a rather minimalist implementation of the standard Gnome.
    When you first log in, you''re greeted with a prettyish backdrop and the standard
    Gnome status bar. Gnome''s combined launcher and app switch makes an extra click
    or two, you can switch tasks without losing full-screen mode. We expect customizations
    that are easy to use because when you''re working on something, you often need
    to customise the layout by changing the overall theme and font size, as well as
    adjusting small details or features to the desktop. Options are easy to locate.
    From the launcher, you can find apps by searching, and here you know where they
    are. A snag is that there are few categories and they are in between. The minimalist
    approach might have been designed for a clean environment, but having no dock
    leads to extra steps when using applications. It''s a good-looking tweakable desktop
    that will appeal the technically minded.


    ## System efficiency


    If it''s not a distro that starts gobbling up resources before you''ve even started,
    one of these is the lightest of the distros and none is designed for low-hardware.
    However, if you''re on a fairly well-specified computer, multimedia works to push
    a computer to its limits, so it''s worth noting that it has some heavy composing
    effects such as you might like to disable them to free up CPU/GPU resources. AV
    Linux handles things in quite fashion for Xfce based; fully updated when freshly
    booted it uses 470MB of RAM and 13GB of disk. Fedora Design Suite is a heavyweight,
    eating 1.5GB of RAM but it only uses 8GB of disk space. Fedora Jam is also a KDE-based
    distro, and it manages to boot the desktop consuming less RAM, 533MB. Applications
    themselves do not seem to be space hogs. AV Linux has used fewest resources, but
    Fedora Jam packs in lots for.


    ## VERDICT


    | MODICIA OS | 7/10 | FEDORA DESIGN SUITE | 6/10 |

    | UBUNTU STUDIO | 7/10 | AV LINUX | 9/10 |

    | FEDORA JAM | 8/10 |


    ## Media-creation distros ROUNDUP


    # Fedora Jam 8/10 Ubuntu Studio 9/10 Modicia OS 7/10


    Although it comes from a similar origin, Fedora Jam has a different front-end
    from Fedora Design Suite as KDE Plasma as the desktop environment. The default
    layout is familiar, with a combination of a task switcher/status bar at the bottom
    of the screen. The theme is dark and makes use of transparency, but with Plasma
    a clear background. Sure, it''s quick and easy to change a light version of the
    theme and this also looks good. Generalisation is easy. The application launcher
    may be old but it is easy to browse. Most of the themes with this music-centric
    design are in the Multimedia category, and there are some custom categories. It''s
    a good, if conventional, Plasma desktop.


    The Ubuntu Studio desktop is themed and KDE Plasma panel is boxed and sits at
    the top of the screen. Media tools and functions have been added to the quick
    launcher a bit more, and bumping it up was one of the first changes we made. This
    added clarity, and put some screens near each other. All KDE Plasma widgets are
    customised and searchable. It is easy to change a theme to it is just as clear
    and attractive as the dark one.


    Modicia OS defaults to a dark theme but it gravitates towards midtones than the
    one we''ve used. It''s actually Cinnamon (a desktop that deserves it, but you''d
    need to recognise it at first because it''s highly customized). Along the bottom
    of the screen, there is a dock and we like the fact that it''s a decent size by
    default, however over this one, you''ll be struck by how it stretches and bends.
    Modicia OS makes use of extensive compositor effects, so you aren''t going to
    if you want to save the resources, but you can disable those effects.


    Here we found that Modicia OS sits in the middle world in terms of configurability
    because the options are rationally centred (searchable), but they are manipulated
    from within a variety of application plugins.


    ## Audio, music and plugins


    Show what Linux can do in real and saving installation effort.


    -   Fedora Design Suite ships with a selection that focuses on design and publishing,
    with a few multimedia apps (Figma, Audacity) in for. For free and music work,
    it''s more like a standard Linux distro.

    -   Fedora Jam, Ubuntu Studio and offer a very similar option, in the package
    that they are all packed with music tools, and for free of duplication. Each have
    favoured Arandour. For enough, for the first time we saw Arandour, it could scan
    and discovered a dozen tools around for free. These three distros didn''t offer
    any of the max, but they struggled to put any one ahead of the others. Each of
    them would be an excellent starting point for seeing what Linux has to offer for
    creation and audio editing. Ubuntu differed slightly as it also offered some demos
    of commercial software, such as DAW Reaper, and some commercial plugins. Whether
    you like this comes down to personal preference.

    -   Modicia OS is fully set up for audio and music, but it offers a slimmer selection
    of applications and plugins. The DAW that it is is Qtractor, a more traditional,
    MIDI-oriented sequence. There are some audio effects but we couldn''t find any
    instruments at all. Chances, you would have to do a bit of installing to get any
    real music work.

