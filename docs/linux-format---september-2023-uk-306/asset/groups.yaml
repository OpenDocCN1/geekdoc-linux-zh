    ## 添加硬件


    虽然 PC 并没有通用的通用输入/输出（GPIO）端口，但无论提供何种添加功能的硬件解决方案，这些通常被称为数据采集设备（DAQ 设备），并通过 USB 或插入到主板进行连接。虽然它们通常提供数字和模拟
    I/O，但它们的性能并不比 Pi 的 GPIO 强大。它们不提供与 Pi GPIO 的任何兼容性，因此迁移或使用 HAT 是很容易的。然而，成本高得多，起价
    100 英镑并高达几千英镑。对于爱好者使用，可能有较低的性能限制。


    ## PWM 基础


    > 我们有一个严苛的应用需要测试，但关于它与树莓派 GPIO 相比还没有在线帖子。我们希望确保这对于大多数用户的应用程序不会成为问题。树莓派 GPIO 引脚完全是数字的，因此没有模拟输出。然而，通过
    PWM——树莓派 GPIO 可以通过软件提供——可以在 GPIO 上生成模拟输出信号，但具有局限性。鉴于并非所有用户都熟悉 PWM，这里有一个介绍：PWM
    代表脉冲调制，图（右侧）显示了它的工作原理。在树莓派中，输出引脚被设置为二进制 0，因此 PWM 宽的变化以输出 3.3V 的模拟电压。在中间部分，PWM
    具有 50% 的脉冲宽度，而输出部分显示了 25%、75% 和其他频率。如果脉冲频率足够且要求不严苛，这种效果与输出真实电压一样好。如果您使用 LC 电路来切换电压且频率至少为
    100Hz，它将会闪烁，因此适用于调光 LED。使用 RC 电路（电容器）来调节脉冲并产生更像虚红线的效果，这减少了频谱并允许幅度发生变化。使用较高的 PWM
    且较小的电容值意味着软件 PWM 不如树莓派的硬件 PWM。对稳定电压的更好近似。


