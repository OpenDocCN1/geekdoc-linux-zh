    # 引言


    你好！祝贺你获得了《Kali Linux 黑客攻战：渗透测试》指南书。我们衷心感谢你的选择。


    本指南深入探讨了在 Kali Linux 中启动黑客攻击所需的必要步骤，为进行渗透测试提供了全面的见解。此类测试在预先识别系统漏洞方面极具价值，让我们能够保护个人信息或为企业保护客户数据。


    在整个指南中，我们将探索渗透测试的各个方面，从高效搭建 Kali Linux 环境开始。我们将深入研究配置 Kali Linux 操作系统的各种方法，并强调每种方法的重要性。此外，我们涵盖了基础概念，如使用外部启动驱动器、理解网络基础以及掌握
    Kali Linux 中的核心命令。


    指南的很大一部分用于探索 Tor 和暗网，强调了它们在维护黑客在线匿名性方面的相关相关性。我们还引入了虚拟专用网络（VPN）及其在安全访问目标系统方面的用处。


    指南的后半部分探讨了 Kali Linux 中的高级黑客技术，包括中间人攻击和钓鱼策略。我们详尽涵盖了渗透测试的复杂性，强调了它的益处、各种方法和阶段。进行渗透测试对于确保你的系统安全和保护个人信息受潜在威胁至关重要。


    通过将 Kali Linux 的强大与黑客技术相结合，将开启许多可能。无论你的目标是保护大规模网络还是较小的设置，本指南都能为你提供所需的知识。我们邀请你彻底探索这一资源，它是经过精心设计的，旨在提供丰富的价值信息。


    我们承认关于这一主题有许多书籍，再次感谢你选择本指南。请放心，我们已尽一切努力使本指南成为一份详尽且易读的资源。阅读愉快！


    # 第 1 章：创建理想的黑客环境


    在黑客领域，选择是丰富的。大量的工具、操作系统、编程平台等可供你使用。很快，你就会发现可用的选项非常多。然而，一个真正脱颖而出的选项是 Kali Linux
    系统。


    虽然 Linux 操作系统通常次于于 Windows 和 Mac OS X，但它提供了一个独特且强大的环境，特别适用于黑客攻击和渗透测试。Kali Linux
    拥有专为编程定制的命令提示符，包括评估系统漏洞的工具。尽管它的界面可能与主流操作系统不同，但这正是进行有效渗透测试和黑客攻击所需要的。


    选择 Kali Linux 有充分的理由。它是多用途的，允许与其他操作系统进行多启动或双启动设置。你甚至可以从便携式 USB 驱动器运行它，从而在不同的机器上提供灵活性。无论你的目标是个人系统安全还是专业信息保护，本章将引导你完成设置过程。


    在开启无线黑客之旅之前，我们必须首先准备环境。本章将探索安装 Kali Linux 的各种方法，每种方法满足不同的需求和硬件。这些方法可以分类如下：


    1. 硬件安装：可以根据你的偏好配置为双模式或独立模式。

    2. 虚拟安装：在另一个操作系统的虚拟化软件中设置 Kali Linux。

    3. 外部介质安装：从可启动的 USB 闪盘或 CD-ROM 运行 Kali Linux。


    每种安装方法都有优缺点，选择取决于你的预期用途。Kali Linux 与主流消费软件不同，它主要为渗透测试活动设计。因此，出于实用考虑，可以考虑专门投入一台机器此此。


    此外，Kali Linux 可以在多启动或双启动配置中与其他操作系统共存。这允许你轻松在 Kali Linux 和另一个操作系统之间切换。或者，你可以在现有操作系统的虚拟化软件中安装
    Kali Linux。虽然此选项消耗更多资源，但它为练习虚拟机攻击提供了灵活性。


    最后，Kali Linux 可以从 USB 闪盘等移动外部介质作为现场操作系统运行。这具有在多台机器上使用的优势，而且某些数字取证工具在目标机器的启动结构之外运行效果最好。


    现在我们已经对 Kali Linux 安装方法有了概述，我们将深入每种方法的细节，帮助你选择适合你需求的方法。


    ## 安装到硬盘上


    在硬盘上安装 Kali Linux 时，你的主机应满足某些要求，包括至少 10 GB 的硬盘空间（建议 20 GB）和至少 512 MB 的内存（建议 1
    GB）。你还需要一个 CD-ROM 或 USB 驱动器进行安装。拥有网络接口对于渗透测试期间的软件更新和连接很有用。


    安装过程涉及从 Offensive Security 获取最新的 ISO（符合国际标准组织的磁盘镜像）并将其复制到外部介质。从官方源下载 ISO 以确保代码完整性至关重要。


    下载后，你可以将 ISO 刻录到 CD-ROM 或创建一个可启动的 USB 闪盘。


    ## 独立安装


    Kali Linux 的独立安装将覆盖主机硬盘上的所有现有数据。因此，在继续之前，请备份你想要保留的任何重要文件和设置。安装过程包括：


    1. 确保主机满足硬件要求，例如足够的硬盘空间（10 GB 或更多）和内存（512 MB 或更多）。

    2. 从主机硬盘备份基本文件。

    3. 在 BIOS 设置中调整启动顺序，确保 CD-ROM 或 USB 驱动器是第一个启动选项。

    4. 加载 Kali Linux ISO 并从菜单中选择 `Graphical Install`（图形化安装）选项。


    按照屏幕上的指令操作，根据需要自定义设置，并完成安装。


    ## 多启动安装


    多启动安装允许 Kali Linux 在主机计算机上与其他操作系统共存。确保你有足够的硬盘空间为 Kali Linux 创建一个独立的分区。分区错误可能会导致数据丢失，因此在继续之前请备份重要文件。多启动安装的步骤如下：


    1. 使用你当前操作系统的磁盘管理工具为 Kali Linux 分配约 20 GB 的硬盘空间。

    2. 遵循独立安装过程的第 1 到 4 步，将 Kali Linux ISO 复制到系统。

    3. 从独立安装过程的第 5 步开始，在继续之前选择 `Manual partitioning`（手动分区）选项。

    4. 选择并删除为 Kali Linux 创建的分区。小心不要擦除错误的分区。


    '
