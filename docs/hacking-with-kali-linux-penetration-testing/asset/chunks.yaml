    # 第 6 章：利用虚拟专用网络


    在本节中，我们将深入探讨虚拟专用网络（VPN）的领域。`VPN` 是一种用于将本地网络的范围扩展到外部节点的机制，能够有效地将这些节点集成到本地网络中。这种做法有多种合法应用，例如允许地理位置分散的企业网络进行安全连接并共享资源。然而，对于对于理解如何有效导航此类网络的黑客来说，它提供了一个巨大的优势。


    ## VPN 与隧道技术


    `VPN` 的威力在于一种被称为 `tunneling`（隧道技术）的过程。用户不再通过传统的服务提供商从互联网连接到目标服务器，而是与 `VPN` 服务器建立加密连接。该服务器反过来促进他们连接到所需的终地。虽然互联网服务提供商（ISP）可以检测到用户连接到已知的
    `VPN` 服务器 IP 地址，但它无法解密通过的加密流量。


    当用户向 `VPN` 服务器发送请求时，`VPN` 会解密该请求（包括指示目的地的报头）。然后它通过互联网转发此请求。发往 `VPN` 的入数据包将被加密，并通过已建立的隧道传回用户。


    ## VPN 的类型与应用


    `VPN` 主要分为两类：`site-to-site`（站点到站点）和 `remote access`（远程访问）。`remote access VPNs`
    是最常用的，特别是家庭和个人用户。这些 `VPNs` 具有多种用途，从保护匿名性到规避地区、公司或 ISP 的限制不等。例如，家庭用户可以使用 `remote
    access VPN` 从外部位置访问其局域网。这种设置对于拥有远程办公人员或多个需要集中访问服务和数据库办公室的公司来说特别有价值。


    虽然 `remote access VPNs` 提供了加密连接，但它们封装数据流量的方式类似于标准的互联网流量。相反，`Site-to-site VPNs`
    通过通过路由器到路由器的通信来增强安全性，需要服务器与客户端之间的相互身份验证。


    ## VPN 协议


    `VPN protocol` 的选择取决于服务器的和用户需求。商业 `VPN` 服务通常允许客户端选择最符合其需求的协议，在速度、可靠性和安全性之间取得平衡。


    加密虽然安全至关重要，但可能会稍微降低连接速度，特别是当多个用户共享服务器时，会导致拥塞。访问的内容类型也会影响协议的选择。例如，音频和视频流需要对 `UDP`
    端口的支持，并比标准的 `HTTP` 浏览需要更多的带宽。


    有多种 `VPN protocols` 可用，包括广泛使用的、多功能且开源的 `OpenVPN`，它提供了有效的通信和加密。`PPTP` 是一个旧的协议，仍在在使用但存在显著的安全漏洞。`L2TP`
    用户易用，但缺乏稳健的安全性，需要额外的加密协议来保护数据。


    ## 选择合适的 VPN


    在选择 `VPN` 时，家庭用户通常关注匿名性、安全性和互联网自由等因素，并考虑速度、可靠性、安全性和成本之间的权衡。评估 `VPN` 的日志策略至关重要。`No-logging`
    服务为了运行稳定性维持最少的内部日志，但不会保留超过需要的时间。


    对于黑客来说，在选择 `VPN` 时怀疑精神必不可少，特别是当它声称免费且“无日志”时。阅读细则并理解公司的日志记录做法至关重要。免费服务可能缺乏可靠性，因此进行尽职调查是必要的。


    ## 增强 VPN 安全性


    担心保护匿名性的用户可以使用接受 `bitcoin` 付的商业 `VPNs`。为了增加安全性，`VPN chaining`（VPN 链）涉及将 `VPN`
    连接到主机机器，并在同一台主机的虚拟机内设置不同的 `VPN service`。即使内部 `VPN` 的日志被泄露，它们看起来仍然像是源自外部 `VPN`，增加了额外的安全层。


    某些 `VPN services` 提供了从 `VPN` 服务器通过 `Tor` 网络连接到目的地的选项，这增加了安全性，但可能会降低连接速度。在选择 `VPN`
    以满足特定的安全和匿名需求时，应仔细考虑这些额外的保护层。


    # 第 7 章：探索基础黑客方法


    我们指南的下一个重点是黑客领域以及为了实现所需结果的关键技术。在准备好系统后，是时候深入研究在 `Kali Linux` 帮助下有效使用的实用黑客技术了。让我们直接进入探索一些基础黑客方法：


    ## 黑客技术


    在利用 `Kali Linux` 进行渗透测试的领域，各种黑客技术使黑客能够获取信息。。常用的攻击方法包括：


    ### 拒绝服务 (DoS) 和分布式拒绝服务 (DDoS) 攻击


    一种流行的黑客技术是 `DoS` 和 `DDoS` 攻击。这种方法被从初学者到高级人员的所有水平黑客广泛使用。在这种方法中，黑客用过量的流量淹没目标服务器，使系统过载并停止正常运行。即使是合法用户也可能发现无法访问受影响的网站。


    在 `DDoS` 攻击的情况下，黑客利用假尸计算机或机器人等人工工具向服务器发送大量伪请求，导致过载。结果是目标网页或网站对真实用户变得不可用。这为黑客提供了机会，在其他人挣扎于解决问题时侵入系统，并窃取所需信息。由于解决这些问题可能需要时间（有时甚至是几天），黑客有充足的时间在不被察觉的情况下执行活动。


    ### 键盘记录 (Keylogging)


    `Keylogging` 是一种恶意黑客在目标系统上部署名为 `keyloggers` 软件的技术。`keylogger` 记录目标产生的所有击键并将这些信息存储在日志文件中。黑客随后可以访问此日志以提取宝贵数据。


    黑客可以在他们方便时查看 `keylogger` 记录，旨在寻找各种在线账户的敏感信息，如用户名和密码。虽然他们收集的数据可能比需要的多，但首要目标是获取目标使用的特定网站的关键信息。这种形式的黑客攻击特别危险，因为黑客可以在不被觉的情况下在用户的计算机上植入
    `keyloggers`，持续很长时间，导致身份盗用和财务欺诈。


    为了降低这种风险，用户应该对下载的内容和访问的网站保持谨慎，特别是在输入用户名和密码时。


    ### Cookie 窃取 (Cookie Stealing)


    存储在浏览器中的 `Cookies` 可以提供快速访问经常访问的网站，保存用户名和密码等个人信息。黑客可以通过从你的计算机和这些网站窃取 `cookies`
    来利用这一点，从而获取大量个人数据的访问权限。


