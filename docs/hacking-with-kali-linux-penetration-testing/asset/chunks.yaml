  trans: '


    4. 税务记录审查。

    5. 互联网足迹追踪，涵盖社交网络、用户名和电子邮件地址。

    6. 内部足迹追踪，包括数据嗅探、反向 DNS、端口扫描和 ping 扫描。

    7. 翻垃圾桶搜索。

    8. 尾随（尾随进入）。


    渗透测试人员必须细致地遵循全面的检查清单，以识别组织系统中的开放入口点和漏洞。该框架提供了丰富的信息源，并简化了测试流程。


    ## 3. 威胁建模与漏洞识别


    在侦察阶段收集了初步信息后，是时候将重点转向威胁建模和漏洞识别了。这一阶段比之前的阶段更具动态性，核心在于确定漏洞并制定应对这些漏洞的策略。


    通过吸收侦察阶段收集的数据以及客户提供的任何信息，渗透测试人员应该已经识别出系统中的某些漏洞。然而，他们现在的任务是有系统地评估这些漏洞，并制定缓解计划。


    在此阶段，渗透测试人员扮演恶意黑客的角色，力求尽可能全面地识别访问点和漏洞。目标是模拟试图渗透系统（可能出于不法目的）的黑客行为。其目的是确定访问点和漏洞可以被利用的程度。通过创建网络和正在测试流程的详细地图，可以有效地实现系统弱点的可视化。


    在网络映射期间，重点审查的关键区域通常包括：


    1. 识别并分类组织内部的高价值资产，包括技术、客户和员工数据。

    2. 分类内部和外部威胁，包括员工等内部威胁，以及与网络流量、网络应用程序、协议和端口相关的外部威胁。


    员工和管理者的警惕以及对安全协议的遵守至关重要。不应忽视供应商，因为他们松散的安全标准可能会损害公司的防御。


    可以使用漏洞扫描工具来提供已识别漏洞构成的安全风险全面清单。渗透测试人员验证这些漏洞，以确定它们是否可被利用或已经得到缓解。漏洞列表将在报告阶段共享，该阶段稍后讨论。


    ## 4. 漏洞


    利用阶段标志着下一个阶段，即整合之前阶段收集的信息，以确定系统是否可以如愿地被破解和操纵。虽然恶意黑客会选择性地选择漏洞进行利用，但负责的渗透测试人员旨在评估所有已识别的漏洞，以确保系统的全面安全性。


    在此阶段，渗透测试人员积极尝试渗透系统，无论是渗透他们自己的系统还是在客户许可下进行。所采取的操作模拟了黑帽黑客的行为，以严格评估系统的安全性。在上一阶段已经完成网络映射后，渗透测试人员系统地测试网络、数据和应用程序中识别出的利用程序。


    利用期间的主要目标是确定渗透测试人员渗透环境的程度、识别高价值目标并在不被发现的情况下执行这些操作。测试人员的目标是像恶意黑客一样，尽可能地收集信息并评估漏洞。渗透越深，就能为客户强化其安全措施提供越有价值的见解。


    此阶段的测试范围应遵守与客户合作预定义的范围和限制。如果没有范围限制，测试人员可能会根据情况一直进行。


    在标准利用过程中采用了多种策略，包括：


    1. Web 应用程序攻击。

    2. 网络攻击。

    3. 社会工程。

    4. 物理攻击。

    5. 零日利用。

    6. Wi-Fi 攻击。

    7. 基于内存的攻击。


    采用不同的策略来评估不同的漏洞，增强对客户系统的整体评估和保护。


    此外，渗透测试人员在渗透过程中会详细记录他们的活动，详细说明用于访问高价值目标所使用的技术和策略。这些信息为客户提供了关键的见解。


    ## 5. 风险分析与建议


    利用阶段之后，开始进入后利用过程，包括风险分析和建议。这一阶段可能需要大量时间，取决于系统中发现的漏洞数量。


    后利用过程涉及对渗透测试人员访问客户组织内价值信息的方法进行全面记录。测试人员评估受损系统相关的价值以及在此过程中获取的敏感数据的价值。


    至关重要的是，渗透测试人员在获得访问权限时并没有恶意意，也没有窃取任何信息。然而，如果渗透测试人员能够渗透系统，说明存在潜在漏洞，黑客在有足够的情况下可以利用。此阶段的目的是向客户准确说明渗透测试人员是如何访问系统的，以及他们可以采取哪些行动防止未来发生类似的入侵。


    渗透测试人员提供的建议可能包括实施更强的密码策略、定期更改密码、集成防火墙和强效的反病毒程序、确保电子邮件附件的安全等。其中一些建议需要客户采取行动，而另一些可能需要
    IT 专业人员的干预。


    随后，渗透测试人员投入时间将系统恢复到测试前的状态，消除渗透测试过程中创建的所有临时文件、脚本、可执行文件、根内核程序和用户账户。这种细致的清理对于确保系统安全并防止未来受到未经授权的访问至关重要。


    ## 6. 报告


    渗透测试最后也是最关键的阶段是报告，它在增强客户的安全态势方面起着至关重要的作用。一份全面的报告提供了渗透测试过程、发现和建议的详细说明。这是客户理解已识别的漏洞并采取主动措施增强其系统安全的不可或缺的资源。


    报告详细概述了早期阶段发现的入口点，并勾定了客户如何修复利用阶段阶段揭示的安全问题。通过提供全面的细节，报告使客户能够衡量渗透测试人员评估的深度，并采取具体的步骤防止未来真实的攻击。


    此外，报告还包含一个整体安全风险评分，使用 `DREAD`、`FAIR` 或 `ITIL` 等方法计算。该评分提供了有价值的见解，允许客户有效地优先考虑安全改进。


    总之，报告阶段充当了客户的路线图，引导他们走向更安全的环境。从报告中获得的见解使客户能够做出明智决策，强化其安全措施并保护其系统免受潜在威胁的侵害。


