    需要注意的是，渗透测试工作应根据特定公司及其所属行业进行定制。后续行动应确保在之前的测试中识别出的漏洞得到解决，并且不会在随后的测试中持续存在。


    让我们探索一下用于渗透测试的工具。测试人员经常使用自动化工具来高效地检测常见的应用程序漏洞。这些工具可以扫描代码以识别应用程序中的恶意代码，特别是那些可能导致安全违规的代码。渗透测试工具还可以评估数据加密技术，并发现硬编码值（如密码和用户名），以识别系统中的潜在漏洞。


    选择正确的工具对于进行有效高效的渗透测试至关重要。所选工具应该易于部署、配置和使用。它们应该提供直观的系统扫描功能，并按严重程度对漏洞进行分类，以便于漏洞验证的优先级排序和自动化。此外，它们应该能够重新验证网络上的之前的漏洞，并对已发现的漏洞生成详细报告。


    理解渗透测试的阶段至关重要。虽然下一章将进行更详细的探讨，但在这里有必要进行简要概述。无论何种类型的的渗透测试，都必须仔细安排某些关键阶段以确保系统的安全。这些阶段如下：


    1. **规划与侦察**：在初始阶段，定义测试的范围和目标，并收集有关目标的信息以识别潜在漏洞。

    2. **扫描**：此阶段涉及探测目标以了解其如何对入侵尝试做出响应。它可以包含静态和动态分析，以评估应用程序的行为。

    3. **获取访问**：测试人员对 Web 应用程序模拟各种攻击，如 `SQL injection`、后门和跨站脚本，以利用漏洞并评估潜在损害。

    4. **维持访问**：此阶段评估被利用的漏洞是否可以提供对系统的长期访问，从而模拟持续性威胁。

    5. **分析**：一旦完成测试，分析对于识别漏洞、评估系统受损情况以及制定关闭已识别安全缺的策略至关重要。结果被汇成一份报告，详细说明漏洞、被访问的数据以及系统访问时长。安全人员利用这些信息来配置企业
    Web 应用程序防火墙 (`WAF`）和其他安全解决方案，以修复漏洞并防御未来的威胁。


    接下来，我们将深入各种渗透测试方法。之所以有不同的方法，是因为从多个角度对网络进行测试至关重要，因为黑客通常尝试各种方法来破坏系统。单一方法可能无法发现所有漏洞。需要考虑的一些关键渗透测试方法包括：


    1. **外部测试**：评估在互联网上可见的目标资产，如 Web 应用程序、公司网站以及电子邮件和域名服务器。

    2. **内部测试**：从内部模拟攻击，假设攻击者拥有内部访问权限，这可能通过从 `phishing attack` 获取凭据等方法实现。

    3. **盲测**：为测试人员提供目标企业的名称，在预先不知道目标信息的情况下模拟真实攻击。

    4. **双盲测试**：测试人员对模拟攻击一无预先知，这非常接近现实世界中攻击者是否存在尚未知的情况。

    5. **针对性测试**：安全人员与测试人员之间的协作提供实时反馈，模拟黑客战术以进行价值性培训。


    渗透测试的目标是保护你的网络免受潜在威胁。通过从所有可能的角度全面检查你的系统，你可以在恶意分子利用它们之前发现并解决漏洞。


    最后，渗透测试和 Web 应用程序防火墙 (`WAFs`) 在增强安全性方面相得益。渗透测试经常利用 `WAF` 数据来定位和利用应用程序缺陷，而 `WAF`
    管理员可以利用渗透测试结果来更新配置并解决漏洞。此外，只要使用了经过认证的 `WAF`，渗透测试有助于组织满足安全审计程序的合规性要求。在进行渗透测试的同时，


    # 第 9 章：渗透测试的阶段


    在上一章中，我们深入探讨了渗透测试的基础知识，探索了其在保护我们的计算机系统和网络免受潜在威胁方面的意义。现在，是时候仔细观察渗透测试过程中涉及的各个阶段了。它可能非常复杂，在某些时刻所需的努力可能看起来望而却畏。然而，渗透测试的最终目标是确保系统的安全，这需要从所有可能的角度进行全面检查。毕竟，这正是恶意黑客所做的。通过采用黑客视角并提前识别漏洞，我们可以强化系统并将入侵者拒之门。


    在本章中，我们将渗透测试的六个关键阶段，每个阶段在黑客利用其漏洞之前理解系统内部机制都起着至关重要的作用。进行渗透测试时需要警惕或遵循的关键阶段包括：


    ## 1. 参与前交互


    开始渗透测试的第一步是参与前交互，有时被称为范围阶段。这一阶段经常被忽视，但它是整个过程的基础。在参与前交互期间，渗透测试团队（无论是内部小组还是外部实体）将与客户合作概述测试的后勤安排。这包括设定预期、处理法律考虑、定义目标以及明确客户希望实现的目标。即使你是为了自己系统的安全而进行此操作，也有必要遵循这些步骤以确保计划定义良好并防止疏漏。有效的沟通至关重要，因为它消除了潜在的误解。


    在此阶段，渗透测试人员与客户紧密合作，以了解已知风险、组织文化以及最有效的测试策略。解决所有疑问至关重要，并向所有参与方提交一份全面的测试计划，确保在无冲突的情况下启动。


    ## 2. 侦察


    在完成初始的参与前讨论后，下一阶段是侦察或开源情报收集。这一阶段具有至关重要的意义，因为它要求渗透测试人员深度理解目标系统以及它向外部广播了什么信息。为了有效识别漏洞，预备研究是必不可少的。


    渗透测试人员迅速收集有关客户组织的情报，重点关注恶意黑客为了个人利益可能利用的潜在目标。根据约定的渗透测试类型，测试人员可能已经拥有有关公司的一些信息。尽管如此，他们可能需要进行自己的研究以发现关键信息。无论预先信息如何，彻底的研究始终是有益的，因为它可以揭示此前未知的隐性漏洞。


    侦察阶段采用了多种方法，包括：


    1. 搜索引擎查询。

    2. 域名搜索和 `WHOIS` 查询。

    3. 社会工程学。


