    Working directly with commands enables users to trace errors easily. Hackers,
    being self-reliant individuals, prefer retaining control over their machines,
    making the terminal a perfect solution.


    In this chapter, we’ll explore navigating Linux through the Terminal and introduce
    crucial shell commands:


    # Understanding Linux System Structure


    Before delving into commands, it’s essential to grasp Linux’s basic structure
    and file system. The command library empowers users to control various configuration
    aspects and operations. Let’s explore the Linux system components:


    1. `Kernel`: Linux systems begin with a kernel, a machine-level instruction set
    that loads directly into memory during boot. The kernel interacts directly with
    hardware, including network interfaces, memory, processors, and peripherals.

    2. `Linux Directory System`: Linux maintains an organized directory structure,
    ensuring file stability and security. Directory paths use forward slashes, unlike
    Windows, which uses backslashes.


    # Linux Commands


    Linux boasts a robust set of terminal commands for file management, peripheral
    interaction, software installation, and other tasks, including hacking activities.
    While this book introduces commands contextually, some foundational commands provide
    an overview of Linux terminal usage and format.


    1. **List Files and Directories**: To list files and directories in the root directory,
    use:


    ```

    # ls

    ```


    By default, the terminal directory is usually `/home/username`. The `ls` command
    provides a detailed list of files and folders. Various options can be appended
    to modify the output format.


    2. **Change Directory**: The `cd` command changes the active directory. To change
    to a specific location, provide the path. Paths are case-sensitive in Linux:


    ```

    # cd /desired/path

    ```


    3. **Display Current Directory**: Use the `pwd` command to display the active
    directory’s path:


    ```

    # pwd

    ```


    4. **Delete Files**: The `rm` command deletes files:


    ```

    # rm filename

    ```


    5. **Move Files**: The `mv` command moves a file:


    ```

    # mv source_path destination_path

    ```


    6. **Copy Files**: The `cp` command copies a file:


    ```

    # cp source_path destination_path

    ```


    7. **Delete Empty Directory**: The `rmdir` command deletes an empty directory:


    ```

    # rmdir directoryname

    ```


    8. **Create Directory**: The `mkdir` command creates a new directory:


    ```

    # mkdir newdirectory

    ```


    9. **View Directory Contents**: The `ls` command displays contents in the active
    directory:


    ```

    # ls

    ```


    ### Sudo Command


    Additionally, understanding the `sudo` command is crucial. Short for “superuser
    do,” it executes a command with root access, enabling users to perform tasks requiring
    elevated privileges.


    Learning these commands and gaining proficiency in the Linux command prompt equips
    hackers and programmers with essential skills, making their hacking endeavors
    more efficient and precise.


    # Chapter 4: Understanding Network Fundamentals Before We Begin


    The most direct method of gaining entry to a specific system involves utilizing
    the interface terminal of the target device. This approach, however, poses significant
    challenges for hackers since it necessitates physical access to the target system.
    Even attempting such access can expose the hacker to detection or increase the
    risk of discovery on the system. Fortunately, the interconnected nature of most
    computer and information technology systems provides hackers with a safer and
    often less conspicuous avenue for exploitation, known as the network.


    In a broad sense, the term “network” here refers to any collection of interconnected
    components. Networks can encompass political states, organizations, people, machines,
    and any other entity through which information flows among its members. IT and
    computer networks have evolved over the years, from a handful of personal computing
    devices to large server farms requiring their own power sources to function effectively.
    Whether using networks to exchange contact information between smartphones via
    Bluetooth or streaming movies over the internet from different corners of the
    globe, the fundamentals of networking and communication remain the same. Understanding
    communication protocols and computer networking is crucial for achieving success
    as a hacker.


    # Network Architecture


    In this chapter, our focus turns to the various architectural components that
    define any Linux network. All it takes to create a computer network is two devices
    capable of sharing information. While most networks consist of more devices and
    additional information, this constitutes the fundamental requirement.


    Any device capable of connecting with other devices can serve as a node within
    a network. Traditional user platforms such as tablets, handheld devices, laptops,
    PCs, desktops, and servers are common elements in a network. Additionally, networked
    peripherals and standalone smart appliances, including network cameras, gaming
    platforms, televisions, and more, can be integrated. These devices often connect
    to various others through different communication media. Physical connections
    form the backbone of the global internet, linking most networks to the primary
    access point of a local area network. Local area networks may encompass various
    access points, including physical wiring and Wi-Fi where needed.


    At short ranges, devices can connect using different technologies, including Near-Field
    Communication or Bluetooth. Examining this network architecture reveals the growth
    of the broadband cellular network, which links an array of radio-frequency towers
    to the internet’s backbone and various satellites. As this technology advances,
    it extends beyond phones and becomes the primary internet access method for numerous
    smaller networks and individual devices.


    # Network Models and Protocols


    Regardless of the type of node or communication medium used, devices within a
    network must communicate using common protocols. The adoption of universal standards
    ensures devices do not block each other out and helps prevent miscommunications.


    For instance, the Internet Protocol (`IP`) is a long-standing standard, foundational
    to network communication. While IP’s function and form have evolved, it remains
    a de facto standard for network communication. `IP`, in combination with Transmission
    Control Protocol (`TCP`), forms a layered networking model known as `TCP/IP`.
    This model divides the network into different layers, ranging from the underlying
    hardware to the user-facing applications, constituting a conceptual network communication
    model known as the `TCP/IP` model or `TCP/IP` stack.


    Additionally, an alternate model known as the `OSI` (Open Systems Interconnection)
    model exists, though it is less commonly used. The `OSI` model delves into more
    granular layers compared to other models and is generally used in broader applications.


    Examining the `TCP/IP` model, we find four stacked conceptual layers, each serving
    a distinct role in data preparation and transport across the network. These layers
    are the application, transport, network, and data link (or link) layers.


    The application layer, positioned at the top of the stack, is the most visible
    layer and the most accessible to users. This is where the content or payload of
    communication is created before being transformed into packets for subsequent
    transport. Applications like email clients, web browsers, file-sharing software,
    and video streaming applications operate within this layer. Notably, the application
    layer can execute other protocols used within or above `TCP/IP`, such as `HTTP`
    for web applications, `SMTP` for emails, and `FTP` for file transfers.

