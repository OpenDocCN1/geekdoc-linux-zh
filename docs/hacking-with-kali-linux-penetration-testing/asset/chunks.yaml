    直接操作命令使用户能够轻松地追踪错误。黑客作为自力更生的个体，更倾向于保留对机器的控制权，使得终端成为了完美的解决方案。


    在本章中，我们将探索如何通过终端导航 Linux，并介绍关键的 shell 命令：


    # 理解 Linux 系统结构


    在深入学习命令之前，掌握 Linux 的基本结构和文件系统至关重要。命令行库使用户能够控制各种配置方面和操作。让我们来探索 Linux 系统组件：


    1. `Kernel`：Linux 系统从内核开始，内核是种在启动期间直接加载到内存中的机器级指令集。内核直接与硬件交互，包括网络接口、内存、处理器和外设设备。

    2. `Linux Directory System`：Linux 维护着组织良好的目录结构，确保文件的稳定性和安全性。目录路径使用斜杠，与 Windows
    使用反斜杠不同。


    # Linux 命令


    Linux 拥有一套强大的终端命令，用于文件管理、外设交互、软件安装和其他任务，也包括黑客活动。虽然本书将在语境中介绍命令，但某些基础命令提供了对 Linux
    终端用法和格式的概述。


    1. **列出文件和目录**：要列出根目录下的文件和目录，请使用：


    ```

    # ls

    ```


    默认情况下，终端目录通常是 `/home/username`。`ls` 命令提供了文件和文件夹的详细列表。可以附加各种选项来修改输出格式。


    2. **更改目录**：`cd` 命令更改活动目录。要更改到特定位置，请提供路径。Linux 中的路径是区分大小大小的：


    ```

    # cd /desired/path

    ```


    3. **显示当前目录**：使用 `pwd` 命令显示活动目录的路径：


    ```

    # pwd

    ```


    4. **删除文件**：`rm` 命令删除文件：


    ```

    # rm filename

    ```


    5. **移动文件**：`mv` 命令移动文件：


    ```

    # mv source_path destination_path

    ```


    6. **复制文件**：`cp` 命令复制文件：


    ```

    # cp source_path destination_path

    ```


    7. **删除空目录**：`rmdir` 命令删除空目录：


    ```

    # rmdir directoryname

    ```


    8. **创建目录**：`mkdir` 命令创建一个新目录：


    ```

    # mkdir newdirectory

    ```


    9. **查看目录内容**：`ls` 命令显示活动目录的内容：


    ```

    # ls

    ```


    ### Sudo 命令


    此外，理解 `sudo` 命令至关重要。它是“superuser do”（超级用户执行）的缩写，以 root 权限执行命令，使用户执行需要高权限的任务。


    学习这些命令并熟练使用 Linux 命令行符为黑客和程序员配备了必要的技能，使他们的黑客活动更加高效和精确。


    # 第 4 章：在我们开始之前理解网络基础


    进入特定系统最直接的方法是利用目标设备的接口终端。然而，这种方法对黑客构成了巨大挑战，因为需要对目标系统进行物理访问。即使尝试这种访问可能导致黑客被发现，或增加在系统中被发现的风险。幸运的是，大多数计算机和信息系统的互联特性为黑客提供了一个更安全且通常不显眼的利用途径，被称为网络。


    从广义上说，这里的“网络”术是指任何互联组件的集合。网络可以包括政治国家、组织、人员、机器以及任何在成员之间流传输信息的实体。IT 和计算机网络多年来不断演进，从少数个人计算设备演变为需要独立电源才能有效运行的大型服务器群。无论使用网络通过蓝牙在手机之间交换联系信息，还是通过互联网从全球不同角落流媒体电影，网络和通信的基础原理都是相同的。理解通信协议和计算机网络对于成为一名成功的黑客来说至关重要。


    # 网络架构


    在本章中，我们的重点转向定义任何 Linux 网络的各种架构组件。创建一个计算机网络只需要两个能够共享信息的设备。虽然大多数网络由更多设备和额外信息组成，但这构成了基本要求。


    任何能够与其他设备连接的设备都可以作为网络中的节点。传统的用户平台如平板电脑、手持设备、笔记本电脑、PC、桌面电脑和服务器是网络中的常见元素。此外，网络外设和独立智能设备（包括网络摄像头、游戏平台、电视等）也可以整合。这些设备通常通过不同的通信媒介连接到其他设备。物理连接构成了全球互联网的骨干，将大多数网络连接到局域网的主要接入点。局域网可能包含各种接入点，包括需要时的物理布线和
    Wi-Fi。


    在短范围内，设备可以使用不同的技术连接，包括近场通信或蓝牙。检查这种网络架构可以发现宽带蜂网络的增长，它将一系列无线频率射塔连接到互联网骨干和各种卫星。随着这项技术的进步，它已扩展手机之外，成为许多较小网络和单个设备的主要的互联网接入方式。


    # 网络模型和协议


    无论使用什么类型的节点或通信媒介，网络内的设备必须使用通用协议进行通信。通用标准的采用确保设备之间不会互相阻塞，并有助于防止误解。


    例如，网协议（`IP`）是一项长期标准，是网络通信的基础。虽然 IP 的功能和形式已经演变，但它仍然是网络通信的事实标准。`IP` 与传输控制协议（`TCP`）结合形成了一个被称为
    `TCP/IP` 的分层网络模型。该模型将网络分为不同的层，从底层的硬件到面向用户的应用程序，构成了一个概念性的网络通信模型，被称为 `TCP/IP` 模型或
    `TCP/IP` 栈。


    此外，还存在一种名为 `OSI`（开放系统互连）的模型，尽管它的使用不那么常见。与其他模型相比，`OSI` 模型深入了更细粒度的层级，通常用于更广泛的应用程序。


    检查 `TCP/IP` 模型，我们发现了四个层叠的概念层，每一层在跨网络的数据准备和传输中起着独特的作用。这些层是应用层、传输层、网络层和数据链路层（或链路层）。


    应用层位于栈的最顶部，是最可见且用户最易访问的层。这是通信的内容或负载创建的地方，随后转换为数据包以便后续传输。电子邮件客户端、网络浏览器、文件共享软件和视频流媒体应用等在此层运行。值得注意的是，应用层可以执行
    `TCP/IP` 内部或之其他协议，例如用于 Web 应用的 `HTTP`、用于电子邮件的 `SMTP` 和用于文件传输的 `FTP`。


