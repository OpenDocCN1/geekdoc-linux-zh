- fmt: '

    The `Tor Browser` is readily available at no cost and compatible with Linux, Mac,
    and Windows operating systems. An app designed for mobile devices, named `Orbot`,
    caters to Android users. To download the `Tor Browser`, you can visit the official
    Tor website at `https://www.torproject.org/projects/torbrowser.html.en`.


    When accessing this page, you’ll encounter several options. For Windows and Linux,
    you can opt for either the 32-bit or 64-bit versions, while the Mac system exclusively
    offers the 64-bit variant. Furthermore, the browser supports numerous languages
    and provides access to the latest stable version, alongside a few beta and experimental
    releases.


    Similar to the installation process discussed earlier for `Kali Linux`, the Windows
    version follows a wizard-based installation. If your host machine operates behind
    a firewall or proxy, configuring additional settings is necessary to ensure desired
    functionality. For Mac users, the process involves extracting the `.dmg` file
    and transferring the resulting app to the `Applications` folder.


    Setting up the `Tor Browser` on Linux platforms entails executing terminal commands
    and conducting specific configurations, with the number and nature of these steps
    varying among distributions. The Tor website includes general guidelines for initiating
    the setup process, along with troubleshooting instructions tailored to specific
    platforms, particularly `Kali Linux`.


    # The Dark Web


    Now, having explored the `Tor` application and why it attracts hackers and other
    individuals, it’s time to delve further into the topic of the dark web. While
    the term might sound familiar, it’s essential to understand how it operates and
    why it’s worth considering for your objectives. In this section, we’ll demystify
    the dark web’s functionality and its utility for hackers.


    The dark web, often accessed through anonymizing and routing protocols like `Tor`,
    denotes a realm of the internet that remains hidden from conventional access.
    It’s crucial to differentiate between the dark web and the deep web, as these
    terms are not interchangeable. The deep web refers to websites on the World Wide
    Web that escape indexing by search engines, often due to their obscurity amidst
    a plethora of other sites.


    The anonymity inherent to communication on the dark web triggers significant controversy.
    While this anonymity can safeguard privacy, it can also enable potentially dangerous
    and objectionable activities that evade monitoring. In some instances, the dark
    web serves as a conduit for terrorists to communicate without revealing their
    identities, enabling hackers to operate freely and facilitating the exchange of
    illegal assets like financial information, weapons, and narcotics, all without
    clear ownership attribution.


    However, the dark web presents a dichotomy, as it also serves as a refuge for
    individuals living under oppressive regimes, providing them with access to vital
    information and communication channels. This dual nature of the dark web prompts
    debates about whether and how it should be regulated or left untouched.


    # Accessing Tor


    With this understanding, let’s explore how to utilize the `Tor` system and access
    it to meet your objectives. When launching the `Tor Browser` for the first time,
    it’s prudent to familiarize yourself with the system before venturing into the
    dark web. The `Tor Browser` homepage offers essential manuals and tips to make
    optimal use of the system. As a preliminary step, ensure your browser is correctly
    connected to the `Onion` router by visiting the default home page and clicking
    on “Test Tor Network Settings.” The ensuing page will display the IP address that
    websites perceive when you connect to them, representing the address of the current
    `Tor Circuit`’s exit node.


    To view the other nodes within the circuit, you can click on the green onion icon
    in the browser’s upper left corner. This action unveils the sequence of hops in
    the circuit. Periodically, the path may alter automatically to preserve anonymity,
    but you can manually modify it by selecting “New Tor Circuit for this Site” on
    the same panel.


    Next, it’s vital to examine the exit node’s IP address that websites perceive,
    which should differ from the public IP address assigned to your device by your
    Internet Service Provider (ISP). This discrepancy is pivotal to preserving anonymity.
    To confirm this difference, employ a standard web browser (not the `Tor Browser`)
    and ascertain your computer’s public IP address.


    Notably, numerous ISPs are equipped to detect `Tor` usage and may either block
    the traffic or report it to law enforcement. Although these companies cannot trace
    most actions back to users, the mere detection of `Tor` traffic can draw unwanted
    attention. This detection can be circumvented, albeit temporarily, by using `Tor`
    bridges or bridge relays. Nevertheless, employing `Tor` bridges can be challenging,
    particularly in platforms like `Kali Linux`.


    To configure the `Tor Browser` for bridge relays, navigate to the `Tor Network
    Settings` on the `Onion` and select “My Internet Service Provider blocks connections
    to the Tor network.” Opt for “connect with provided bridges” and choose the `obs4`
    transport type. If you have specific bridge relays in mind, input their locations
    in the “Enter custom bridges” section.


    It’s essential to remember that merely connecting to the `Tor` network is insufficient
    for guaranteed security. The `Tor` organization recommends additional steps to
    enhance anonymity:


    1. Avoid using torrent file sharing applications on the `Tor Browser`.

    2. Refrain from installing plugins or enabling disabled ones in the browser.

    3. Choose URLs with `HTTPS` at the beginning.

    4. Exercise caution with downloaded documents within the `Tor Browser`.

    5. Whenever possible, opt for `Tor` bridge relays over direct connections to enhance
    anonymity.


    # Tor Hidden Services


    Before delving deeper into the dark web, it’s crucial to exercise caution. A substantial
    portion of online content, including indexed websites, might not remain accessible
    for extended periods. Moreover, exploring the dark web can lead to legal repercussions
    based on your country’s laws. Notably, hackers and government agencies continually
    probe the `Tor browser` for vulnerabilities, aiming to unveil user identities
    and dismantle anonymity. Therefore, while `Tor` facilitates anonymity, it does
    not guarantee absolute safety. Be vigilant and stay updated on your legal obligations
    while navigating the dark web.


    Within the `Tor` network, a distinctive virtual domain exists, denoted by the
    `.onion` extension, which remains accessible exclusively through the `Tor Browser`,
    ensuring the user’s anonymity. These sites are known as hidden services and form
    the essence of the dark web. While no central authority manages an official `Hidden
    Wiki`, several independent sites attempt to index current hidden services. One
    such resource is the `Hidden Wiki`, which categorizes links into various categories,
    both hidden and accessible via the `Clearnet`.


    Discovering these `Hidden Wikis`, usually located on the `Clearnet`, involves
    using search engines. However, accessing hidden services without the `Tor Browser`
    compromises anonymity, as it discloses your IP address. Therefore, it is imperative
    to utilize the `Tor Browser` to maintain your anonymity.


    Before concluding this discussion, it’s vital to recognize three types of search
    engines pertinent to the `Tor browser`:


    1. **Hidden-service-based engines**: These engines search the `Clearnet` and are
    beneficial for standard web searches. An example is `DuckDuckGo`, accessible both
    on the `Clearnet` and via its `.onion` domain listed in a `Hidden Wiki`.

    2. **Clearnet-based engines**: These engines search the `Onion` network from the
    `Clearnet`. An example is `Ahmia.fi`, accessible without `Tor`, although it does
    not offer anonymity.

