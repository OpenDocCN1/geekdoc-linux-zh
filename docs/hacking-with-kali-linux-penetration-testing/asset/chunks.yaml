    6. 分区方案选择“所有文件存储在一个分区中”并继续。


    7. 完成分区并将更改写入磁盘。确认你的选择并继续。


    此设置允许你将在启动计算机时，在 Kali Linux 和你的常规操作系统之间进行选择，提供了灵活性并允许同时访问两组文件。


    # 在虚拟机上安装


    在虚拟机上运行 Kali Linux 具有优势，因为它消除了对额外硬件的需求并为测试提供了一个沙箱环境。然而，它可能会竞争宿主机的资源，并且虚拟硬件能力可能受到限制。虚拟化的一种流行选择是
    `VirtualBox`。若要在虚拟机上设置 Kali Linux，请按照以下步骤操作：


    1. 确保你的主机符合最低规格要求（x86 架构、至少 1 GB 内存，以及为虚拟机操作系统提供足够的硬盘空间）。


    2. 在你的 BIOS 设置中启用硬件虚拟化。


    3. 根据你的主机操作系统（Windows、OS X 或 Linux），从官方网站下载 `VirtualBox` 安装文件。


    4. 按照针对你特定操作系统提供的说明安装 `VirtualBox`。


    这些安装选项满足了各种需求和能力，允许你根据黑客需求选择最合适的方法。在选择理想设置时，请考虑你的硬件、空间和偏好。无论你想将 Kali Linux 作为辅助、双启动还是独立的操作系统，还是倾向于在虚拟机中使用，每种方法都有其优势和权衡。做出你的选择并按照相应的步骤开始你的黑客之旅。


    # 3


    # 第 2 章：探索 Kali Linux 启动盘


    在使用 Linux 操作系统时，一个显著优势在于它的构建方式，从内核开始，仅包含必要的软件包和应用程序。这种方法为我们的任务提供了一个轻量但功能完全的发行版。


    最初，制作较小 Linux 发行版的理念是为了满足程序员的需求，即需要一个可以在 USB 闪盘和 CD-ROM 等空间有限的外部介质上运行的完全实用的实时操作系统。这种优化旨在更好地利用旧计算平台上的资源。尽管闪盘在容量和处理能力方面已经显著进化，但
    Linux 开发者（包括专业和业余人员）之间仍然存在，，在保留功能的同时创建更小的发行版。目前，某些发行版甚至小至 12 MB。


    除了性能和驱动器容量考虑外，在某些场景下程序员需要从外部介质启动 Linux。在处理 Debian 发行版时这一点变得至关重要，因为它旨在为多台机器同时提供安全功能和实用程序。数据恢复、密码重置和法医等活动需要超出宿主机引导扇区的工具，因此需要从单独的介质启动。


    此外，某些特殊的 Linux 发行版（如 Kali）可能不适合作为常规使用的主或独立操作系统。虽然它们在我们很快将讨论的特定黑客任务方面表现出色，但可能不适用于日常活动。因此，从外部介质启动并在需要时使用
    Kali 发行版是一种更务实的方法。


    本章深入探讨为 Kali Linux 创建可启动的 USB 闪盘，该闪盘可以作为实时操作系统或安装源。


    # 为 Windows 创建启动盘


    让我们从探索如何从 Windows 操作系统创建启动盘开始。Offensive Security 网站提供了详细的说明，用于创建兼容各种操作系统的实时 Kali
    启动盘，取决于你的喜好。你可以在 `http://docs.kali.org/downloading/kali-linux-live-images` 找到完整指令。


    ## Win32 Imager


    `Win32 Imager` 是一个向可移动介质写入磁盘镜像的有效工具。根据你的电脑设置，可能需要管理员权限运行该软件。


    1. 下载 `Win32 Imager` 安装文件。

    2. 插入你打算使用的 USB 盘。

    3. 按照安装向导启动 `Win32 Imager`。

    4. 在 `Image File` 框中，浏览到 Kali ISO 文件的位置。

    5. 在 `Device` 下，选择你的 USB 盘的驱动器器。确保你选择了正确的介质，因为后续步骤将覆盖数据。

    6. 点击 `Write` 并等待过程完成。


    # Yumi


    虽然之前描述的方法对用户足够，但如果你寻求更高的灵活性，可以使用 `Yumi`。你可以在 `https://www.pendrivelux.com/yumi-multiboot-usb-creator/`
    找到指令。


    1. 下载 `Yumi` 安装文件。

    2. 插入用于创建启动介质的 CD 或 USB 盘。

    3. 启动 `Yumi`；它作为 `.exe` 文件运行，无需安装。

    4. 在 `Select the Drive Letter of your USB Device` 部分，选择你的 USB 盘的驱动器号。确保你选择了正确的介质，因为后续步骤将覆盖数据。

    5. 在 `Select a Distribution to put on...` 下，选择 Kali。

    6. 点击 `Create`。


    # 为 Linux 或 OS X 创建启动盘


    如果你正在运行 Linux 或 Mac 系统的电脑上工作，创建启动盘需要使用命令行。为了确保你遵循正确的指令，请访问 `http://docs.kali.org/downloading/kali-linux-live-images`。Linux
    和 OS X 的过程与我们为 Windows 描述的相似。


    # 第 3 章：你需要掌握的必备终端命令


    在图形界面（GUI）和鼠标等用户友好输入设备之前的时代，计算机用户完全依赖键盘和带有提示符的单色屏幕来完成任务。命令是逐行输入并立即解释或编译成程序的。


    通过遵循这些步骤，你现在应该拥有一个可移动的环境，允许你随时需要启动 Kali Linux。这种方法简化了将操作系统移动到不同计算机的步骤，并且与单台机器上同时运行两个操作系统相比，节省了资源。

