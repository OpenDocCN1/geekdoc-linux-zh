  raw: '5\. Opt for “Automatically partition the free space” on the following screen.


    6\. Choose “All files in one partition” for the partitioning scheme and continue.


    7\. Finish partitioning and write changes to the disk. Confirm your choices and
    proceed.


    This setup enables you to choose between Kali Linux and your regular operating
    system when booting the computer, offering flexibility and access to both sets
    of files.


    # Installing on a Virtual Machine


    Running Kali Linux on a virtual machine is advantageous, as it eliminates the
    need for additional hardware and provides a sandbox environment for testing. However,
    it may compete for resources on the host computer and may have limited virtual
    hardware capabilities. A popular option for virtualization is VirtualBox. To set
    up Kali Linux on a virtual machine, follow these steps:


    1\. Ensure your host machine meets minimum specifications (x86 architecture, at
    least 1 GB of RAM, and sufficient hard drive space for virtual machine operating
    systems).


    2\. Enable hardware virtualization in your BIOS settings.


    3\. Download VirtualBox installation files from the official website based on
    your host operating system (Windows, OS X, or Linux).


    4\. Install VirtualBox following the instructions provided for your specific operating
    system.


    These installation options cater to various needs and capabilities, allowing you
    to select the most suitable method for your hacking requirements. Consider your
    hardware, space, and preferences when choosing the ideal setup. Whether you want
    Kali Linux as a secondary, dual-boot, or standalone operating system, or you prefer
    using it within a virtual machine, each approach has its advantages and trade-offs.
    Make your choice and follow the respective steps to get started on your hacking
    journey.


    # 3


    # Chapter 2: Exploring the Kali Linux Boot Drive


    When working with the Linux operating system, a notable advantage lies in its
    build, starting from the kernel and incorporating only the necessary packages
    and applications. This approach results in a lightweight yet fully functional
    distribution for our tasks.


    Originally, the concept behind crafting smaller Linux distributions was to cater
    to programmers’ needs for a fully operational live OS that could run from limited-space
    external media like USB flash drives and CD-ROMs. This optimization aimed to make
    better use of resources on older computing platforms. Although flash drives have
    significantly evolved in terms of capacity and processing power, there is still
    a competition among Linux developers, both professional and amateur, to create
    smaller distributions while preserving functionality. Presently, some distributions
    are as small as 12 MB.


    Beyond performance and drive capacity considerations, there are scenarios in which
    a programmer needs to boot Linux from external media. This becomes crucial when
    dealing with Debian distributions, designed to provide security functions and
    utilities for multiple machines simultaneously. Activities like data recovery,
    password resets, and forensics require tools that extend beyond the host machine’s
    boot sectors, necessitating booting from separate media.


    Moreover, certain specialized Linux distributions, such as Kali, may not serve
    as a suitable primary or standalone operating system for regular use. While they
    excel at the specific hacking tasks we’ll discuss shortly, they may not be suitable
    for everyday activities. Therefore, booting from an external medium and using
    the Kali distribution when required is a more practical approach.


    This chapter delves into the creation of a bootable USB flash drive for Kali Linux,
    which can function as a live operating system or installation source.


    # Creating the Boot Drive for Windows


    Let’s start by exploring how to create a boot drive from a Windows operating system.
    The Offensive Security website offers detailed instructions for creating a live
    Kali boot drive compatible with various operating systems, depending on your preferences.
    You can find the complete instructions at http://docs.kali.org/downloading/kali-linux-live-usb-install.
    In this section, we’ll summarize the Windows-specific instructions while providing
    additional insights.


    # Win32 Disk Imager


    The Win32 Disk Imager is a valuable tool for writing disk images to removable
    media, allowing you to create a bootable USB drive with the Kali image. You can
    download this program for free from Sourceforge. The following steps guide you
    through the process:


    1.  Download the Win32 Disk Imager installation file. Run the installation wizard,
    following the on-screen instructions.


    2.  Insert the CD-ROM or USB drive you intend to use for booting Kali into your
    computer.


    3.  Launch the Win32 Disk Imager. Depending on your computer’s setup, administrative
    privileges may be required to run the software.


    4.  In the “Image File” box, browse to the location of the Kali Linux ISO file.


    5.  Under “Device,” select the drive letter corresponding to your destination
    medium. Ensure you choose the correct medium to avoid overwriting data.


    6.  Click “Write” and allow the process to complete.


    # Yumi


    While the previously described method is sufficient for most users, if you seek
    more flexibility, you can use the Yumi Multi-boot software. Yumi allows you to
    create a bootable USB drive with Kali Linux and other distributions. You can download
    Yumi and find instructions on how to use it at https://www.pendrivelinux.com/yumi-multiboot-usb-creator/.
    The following steps outline how to install the Kali image using Yumi:


    1.  Download the Yumi installation file.


    2.  Insert the CD or USB drive for creating the bootable medium.


    3.  Launch Yumi; it runs as a .exe file without the need for installation.


    4.  In the “Select the Drive Letter of your USB Device” section, choose the drive
    letter corresponding to your destination USB drive. Ensure you select the correct
    medium as the next steps will overwrite its data.


    5.  Under “Select a Distribution to put on…,” choose Kali, often found in the
    System Tools section. Select the Kali ISO file.


    6.  Click “Create” to complete the process.


    # Creating a Boot Drive for Linux or OS X


    If you’re working with a computer running the Linux or Mac operating system, creating
    a bootable drive requires using the command line. To ensure you follow the correct
    instructions, visit http://docs.kali.org/downloading/kali-linux-live-usb-install.
    The process for Linux and OS X is similar to what we’ve described for Windows,
    ensuring you can successfully run Kali Linux on your computer.


    By following these steps, you should now have a removable environment that allows
    you to boot up Kali Linux whenever needed. This approach simplifies moving the
    operating system to different computers and conserves resources compared to having
    two operating systems simultaneously on a single machine.


    # 4


    # Chapter 3: Essential Terminal Commands You Need to Master


    In the era before graphical user interfaces (GUIs) and user-friendly input devices
    like mice, computer users depended solely on keyboards and monochromatic screens
    with prompts to accomplish tasks. Commands were entered line by line and interpreted
    immediately or compiled into programs. To interact with the file system and peripherals,
    users had to employ specific commands for desired actions.


    Originally, Unix systems booted directly into the command terminal, awaiting user
    input. While most modern Linux distributions boot into a GUI, the underlying operating
    system still relies on Unix terminal commands. Although GUIs offer convenience,
    advanced Linux users, especially hackers, often prefer the terminal for executing
    commands. Manually typing commands in Linux offers efficiency and provides finer
    control over operations. A single command line can replace numerous clicks and
    nested windows.'
