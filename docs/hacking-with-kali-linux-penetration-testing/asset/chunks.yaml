  trans: '

    `Tor Browser` 免费提供，并兼容 Linux、Mac 和 Windows 操作系统。一个为移动设备设计的应用名为 `Orbot`，专为 Android
    用户提供服务。要下载 `Tor Browser`，你可以访问 Tor 官方网站：`https://www.torproject.org/projects/torbrowser.html.en`。


    访问此页面时，你会遇到几个选项。对于 Windows 和 Linux，你可以选择 32 位或 64 位版本，而 Mac 系统则仅提供 64 位版本。此外，该浏览器支持多种语言，并提供最新的稳定版，以及几个测试版（beta）和实验性版本。


    与之前讨论的 `Kali Linux` 安装过程类似，Windows 版本遵循基于向导的安装方式。如果你的宿主机运行在防火墙或代理之后，则需要配置额外设置以确保实现所需功能。对于
    Mac 用户，该过程涉及提取 `.dmg` 文件并将生成的程序传输到 `Applications` 文件夹。


    在 Linux 平台上设置 `Tor Browser` 需要执行终端命令并进行特定配置，这些步骤的数量和性质因发行版而而异。Tor 网站包含了启动设置过程的通用指南，以及针对特定平台（特别是
    `Kali Linux`）的故障排除说明。


    # 暗网


    现在，在探索了 `Tor` 应用以及它为何吸引黑客和其他个人之后，是时候进一步研究暗网这一话题了。虽然这个词听起来很熟悉，但理解它的运行方式以及为什么它对你的目标值得考虑至关重要。在本节中，我们将揭秘暗网的功能及其对黑客的效用。


    暗网通常通过 `Tor` 等匿名化和路由协议访问，代表了互联网中一个对常规访问隐藏的领域。区分暗网和深网（deep web）至关重要，因为这两个术语不可互换。深网指的是广域网上未被搜索引擎索引的网站，通常是因为它们在大量其他网站中显得晦秘。


    暗网通信固有的匿名性引发了巨大争议。虽然这种匿名性可以保护隐私，但也可能允许规避监控的潜在危险和令人反感的活动。在某些情况下，暗网作为分子不泄露身份进行通信的通道，使黑客能够自由操作，并促进财务信息、武器和毒品等非法资产的交换，且均没有明确的所有权归属。


    然而，暗网呈现出双元性，因为它也是生活在压迫政权下的个人的避风港，为他们提供了访问重要信息和通信通道。暗网的这种双重性质引发了关于应该以及如何监管或保持现状的辩。


    # 访问 Tor


    在理解这些之后，让我们探索如何利用 `Tor` 系统并访问它来实现你的目标。首次启动 `Tor Browser` 时，在进入暗网之前，熟悉该系统是明智的。`Tor
    Browser` 首页提供了基本的手册和提示，以帮助优化对系统的使用。作为初步步骤，请通过访问默认首页并点击“测试 Tor 网络设置”，确保你的浏览器已正确连接到
    `Onion` 路由器。随后的页面将显示网站在你连接到它们时感知到的 IP 地址，这代表了当前 `Tor Circuit` 电路出口节点的地址。


    要查看电路中的其他节点，你可以点击浏览器左上角的绿色洋葱图标。此操作将揭示电路中的跳跃序列。路径可能会自动更改以保护匿名性，但你可以通过选择同一面板上的“为此站点使用新的
    Tor 电路”来手动修改。


    接下来，检查网站感知的出口节点 IP 地址至关重要，该地址应与你的互联网服务商（ISP）分配给你设备的公 IP 地址不同。这种差异是保护匿名性的关键。要确认此差异，请使用标准网页浏览器（而非
    `Tor Browser`）并确定你电脑的公 IP 地址。


    值得注意的是，许多 ISP 具备检测 `Tor` 使用的能力，并可能向执法机构报告。虽然通过 `Tor` 访问难以追踪到用户，但这种检测可能会引起关注。尽管如此，通过使用
    `Tor` 代理，可以规避检测，尤其是在 `Kali Linux` 等平台上。


    为了配置 `Tor Browser` 代理中继，请导航 `Torion` 。。必须记住，仅仅连接到 `Tor` 网络不足以保证安全。这些 `Tor` 访问是困难的，尤其是在
    `Kali Linux`。


    为了在暗网中保持中访问，请访问`Tor 网络设置，位于 `Onion`，并选择“连接 Tor 网络”。虽然 Tor 代理可以实现这一点，但它无法提供绝对安全性。`Tor`
    组织建议采取额外步骤以增强匿名性：


    1. 在 `Tor Browser` 中避免使用文件分享应用程序。

    2. 避免在浏览器中安装或启用插件。

    3. 选择带有 `HTTPS` 的 URL。

    4. 对 `Tor Browser` 内下载的文档保持谨慎。

    5. 尽可能选择 `Tor` 代理中继而非直接连接。


    # Tor 隐藏服务


    在深入研究暗网之前，保持谨慎至关重要。互联网上的大部分内容（包括索引的网站）可能无法长期访问。此外，探索暗网可能会根据你所在的国家导致法律后果。值得注意的是，黑客和政府机构不断探测
    `Tor browser` 的漏洞，旨在暴露用户身份并破坏匿名性。因此，尽管 `Tor` 提供了匿名性，但它并不能保证安全。在导航暗网时要警惕并关注法律义务。


    在 `Tor` 网络内部存在一种独特的域名，以 `.onion` 扩展，仅可以通过 `Tor Browser` 访问，从而确保用户的匿名性。这些网站被称为隐藏服务，是暗网的核心。虽然没有中央机构管理官方
    `Hidden Wiki`，但多个独立网站尝试索引当前的隐藏服务。其中一个资源是 `Hidden Wiki`，它将链接分为不同的类别，包括隐藏的和可通过 `Clearnet`
    访问的。


    发现这些通常位于 `Clearnet` 的 `Hidden Wikis` 涉及使用搜索引擎。然而，在没有 `Tor Browser` 的情况下访问隐藏服务会损害匿名性，因为它会暴露你的
    IP 地址。因此，必须使用 `Tor Browser` 来维护你的匿名性。


    在结束本次讨论之前，识别与 `Tor browser` 相关的类型的搜索引擎至关重要：


    1. **基于隐藏服务的搜索引擎**：这些搜索引擎搜索 `Clearnet`，对标准网页搜索有益。例如 `DuckDuckGo`，既可以在 `Clearnet`
    上访问，也可以通过 `Hidden Wiki` 中列出的 `.onion` 域名访问。

    2. **基于清晰网络的搜索引擎**：这些搜索引擎从 `Clearnet` 搜索 `Onion` 网络。例如 `Ahmia.fi`，虽然无需 `Tor` 即可访问，但它不提供匿名性。


