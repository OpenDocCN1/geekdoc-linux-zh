    传输层发挥着更高级的角色，通过检查错误和维护通信质量来确保设备之间的高质量通信。在这一层中，信息从应用程序获取，被划分为数据包，并添加必要的报头。`TCP`
    在此层级运行，但它并非唯一的可用协议。当实时交付优先于所有数据包的保证送达时，会使用`用户数据报协议`（`UDP`），使其适用于视频和音频流媒体。


    网络层也称为互联网层，负责在网络内对数据包进行路由。在这一层，会确定特定数据包的最优路径，并在将数据包继到网络接口硬件之前，更新数据包报头中的源地址和目的
    `IP` 地址。虽然多种协议可以在这一层运行，但 `IP` 是最常用的协议，构成了全球数据通信的基础。在传输的不同阶段操纵 `IP` 报头是许多黑客攻击的基础。


    `TCP/IP` 模型的最底层是硬件层，也称为数据链路层。这一层是数据在离开源机器并通过物理介质进入下一个目的地之前的最终驻留。在这一层，参与数据包中继的网络设备的硬件地址被添加到数据包的报头中。如果一切按计划进行，数据包将遵循标准协议，确保传输的成功。


    # 网络协议


    当网络上的节点尝试与另一个节点通信时，它会将消息划分为较小的、独立的数据包。每个数据包在通过每一层时都会配备一个报头，以便在接收者的设备上将数据数据包重新组装成一个连贯的消息。


    这一过程的底层原理是确保数据包能够准确重组，从而促进高效且忠实的消息传输。该模型的一个显著特征是，单个数据包可以采取不同的路由，并在丢失时进行重传，从而确保消息的高保真度和效率。


    `TCP/IP` 的核心理念是 `IP` 地址的概念。网络上的每个设备都拥有一个唯一的 `IP` 地址，该地址指定了其在主网络以及所属的任何子网络中的位置。理解
    `IP` 路由至关重要，因为它使设备能够准确定自己的通信目标。


    对于黑客来说，可能需要隐藏或操纵他们的 `IP` 地址以避免检测。让 `IP` 地址保持不变会让其他人更容易识别黑客的位置和行为，可能导致法律后果。


    `IP` 寻址的长期标准是 `IPv4`，广泛应用于大多数网络和设备。然而，新标准 `IPv6` 能够容纳更大数量的地址。在局域网内，`IP` 地址中的第一个字节指定了顶层网络，而剩余的字节则提供了关于子网络和单个设备的信息。


    `IP` 寻址的一个关键方面是，设备在局域网内的 `IP` 地址与其与互联网通信时使用的地址不同。这种区分对于防止两个设备之间发生意外或故意的地址冲突是必要的。从黑客的角度来看，`IP`
    地址提供了对单个网络的洞察，有助于识别和区分设备。此外，操纵 `IP` 报头可以辅助各种黑客攻击。


    重要的一点是，`IP` 地址是通过软件（通过用户或自动化过程）分配的逻辑地址。它们位于网络层，并且有时在数据包报头中可以被伪造或欺骗，这是黑客可能采用的策略，用于掩盖电子邮件或恶意载荷的源头，或者为了恶意地重定向数据包。


    然而，`IP` 伪造无法隐藏双向通信。为了交换信息，两个设备都必须拥有有效地址，且数据包必须到达正确的


    # 6


    # 第 5 章：暗网与 Tor 的作用


    在安全与隐私之间寻求平衡的持久斗争是一个不断悬在我们头顶的挑战。当我们考虑到犯罪分子、执法部门以及寻求维护在线匿名性的人之间所涉及的各种动态变化时，这一挑战变得更加复杂。无论一个人的动机是个人隐私还是隐藏恶意活动，对匿名互联网通信的需求催生了各种为此目的而定制的产品、软件和技术。本章我们将深入探讨这一领域，了解如何为了掩盖黑客活动，以及为了维护我们在线的隐身性而利用这些工具和软件。我们的目标是理解这些工具的工作原理，以及我们如何利用它们在系统和在线社区中的互动。


