    # Chapter 9: The Phases of Penetration Testing


    In the previous chapter, we delved into the fundamentals of penetration testing,
    exploring its significance in safeguarding our computer systems and networks against
    potential threats. Now, it’s time to take a closer look at the various stages
    involved in the process of penetration testing. It can be quite intricate, and
    there are moments when the effort required might seem daunting. However, the ultimate
    objective of penetration testing is to ensure the security of our systems, which
    necessitates a comprehensive examination from all possible angles. After all,
    this is precisely what a malicious hacker would do. By adopting a hacker’s perspective
    and identifying vulnerabilities in advance, we can fortify our systems and keep
    intruders at bay.


    In this chapter, we will navigate through the six pivotal phases of penetration
    testing, each of which plays a crucial role in understanding the inner workings
    of a system before a hacker can exploit its weaknesses. The key stages to be vigilant
    about or follow when conducting our penetration testing include:


    ## 1. Pre-engagement Interactions


    The initial step when embarking on penetration testing is pre-engagement interactions,
    sometimes referred to as the scoping stage. This phase is often overlooked, yet
    it serves as the foundation for the entire process. During pre-engagement interactions,
    the penetration testing team, whether an internal group or an external entity,
    collaborates with the client to outline the logistics of the test. This encompasses
    setting expectations, addressing legal considerations, defining objectives, and
    clarifying the goals the client aims to achieve. Even if you’re conducting this
    for your own system’s security, it’s essential to follow these steps to ensure
    a well-defined plan and prevent oversights. Effective communication is paramount,
    as it eradicates potential misunderstandings.


    In this stage, penetration testers work closely with their clients to comprehend
    known risks, the organization’s culture, and the most effective testing strategies.
    It is crucial that all queries are resolved, and a comprehensive testing plan
    is presented to all involved parties, ensuring a conflict-free initiation.


    ## 2. Reconnaissance


    Following the initial pre-engagement discussions, the next phase is reconnaissance
    or open-source intelligence gathering. This phase is of paramount importance as
    it requires penetration testers to gain a deep understanding of the target system
    and what information it broadcasts to the outside world. To effectively identify
    vulnerabilities, preliminary research is essential.


    Penetration testers swiftly commence gathering intelligence on the client organization,
    with a keen focus on potential targets that malicious hackers might exploit for
    personal gain. Depending on the agreed-upon type of penetration test, some information
    about the company might already be available to testers. Nevertheless, they may
    need to conduct their own research to uncover critical information. Regardless
    of the pre-existing information, thorough research is always advantageous as it
    can reveal concealed vulnerabilities that were previously unknown.


    The reconnaissance phase employs various methods, including:


    1. Search engine queries.

    2. Domain name searches and `WHOIS` lookups.

    3. Social engineering.

