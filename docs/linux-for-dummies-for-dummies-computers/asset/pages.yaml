  md: '# Chapter 6: Checking Out Those Desktops 107


    Most distributions come with both KDE and GNOME, so most users simply choose their
    preferred desktop. While it may look from here though KDE is particularly popular
    compared to GNOME, this isn''t necessarily the case. Both are excellent desktops
    with strong fans. It''s a pretty preference, I encourage you to install and experiment
    with both and to see which you like better. The cool thing is that you can run
    KDE programs under GNOME and vice versa. This ability is vital when it comes to
    making it easier on developers (and users) in the Linux community. When you ask
    people why they chose one over another, they really can''t give much of a good
    answer aside from "That''s what I''ve used." Keep this in mind when people try
    to convince you that one or the other is the best since sliced bread!


    I cover how to switch between KDE and GNOME later in this chapter the section
    "Switching between GNOME and KDE."


    # Making the Best of the Command Line


    The Linux command-line interface provides a quick and easy way of entering commands
    and executing actions. If you''re even most "GUI person," after you get the hang
    of using the command line, discover that it''s faster to perform some tasks at
    the command line than with a mouse in a GUI environment. However if you prefer
    to use a GUI interface as your working environment, you can easily open a *terminal
    window*, which is a command-prompt window, to perform your command-driven tasks
    without having to completely leave the point-and-click environment (see Chapter
    14).


    There are some interesting things that you might find to know about using the
    command-line interface. One difference between the Linux command line and other
    command line, such as the Windows MS-DOS prompt, is that Linux commands are sensitive.
    Typing LS is different from *ls*, and in fact, gives you an error because there
    is an *ls* but there is no LS command. The Linux command line also has an autocompletion
    feature. If you know the first characters of a command or filename, you can press
    Tab to complete the rest automatically. For example, if you''re trying to use
    the *less* command to view the contents of the file /home/bob/grocery_list, you
    can type *less /home/bob/gro* and press Tab to complete the filename. If you''re
    under the subdirectory (folder) you hear a beep. You can press the Tab key again,
    like double-clicking a mouse, to see the output:


    ```

    grocery_list group_projects

    ```


    The cool thing here is that the command prompt beneath these items still has the
    text *less* so you don''t have to retype it! You can see that typing a c makes
    it clear that you''re referring to grocery and not group,'
