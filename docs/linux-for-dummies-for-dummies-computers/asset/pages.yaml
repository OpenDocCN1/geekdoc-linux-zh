  md: '# 150 Part II: Internet Now!


    If you have the luxury of dual-booting to Windows, your ISP can help you install
    your broadband connection, and then you can tinker with getting Linux connected
    as you have the time and inclination. I point to some sites that can help you
    configure your broadband connection as you look at the types:


    +   - Cable modems: Many cable television companies have expanded their product
    lines to include Internet access over their cable infrastructure. When you subscribe
    to a cable Internet service, the installation technician can often provide you
    with a special device, called a *cable modem*, along with a standard network adapter
    (like an *Ethernet card*). The technician then installs the network adapter into
    your computer and connects the cable modem to it. As far as speeds go, to get
    the exact speeds you need to talk to your cable provider. The following web page
    provides a document that contains helpful information about various cable providers
    and Linux:


    ```

    www.tdlp.org/HOWTO/Cable-Modem

    ```


    +   - Integrated Services Digital Network (ISDN): Not too long ago, ISDN was one
    of the only reliable high-speed options. It appeared when 28 Kbps (half the speed
    of today''s regular dial-up modems) was all about what you could milk from the
    copper strands that connected your telephone to the telephone company. ISDN is
    still available in some areas and promises a steady 128 Kbps as long as you''re
    within 3.4 miles of the telephone company''s central office. You need two special
    devices to use ISDN: an ISDN modem (typically provided by the ISDN ISP) and a
    network adapter.is used so little these days, not many specific sites are devoted
    to it. The overall modem HOWTO (http://tdlp.org/HOWTO-Modem.html) does contain
    pointers to the latest ISDN information, as well as just plain internet reading.


    +   - Digital Subscriber Line (DSL): DSL works much like ISDN in that it carries
    data to your phone line in a digital format. DSL is popular because it provides
    a faster connection with lower installation and service costs than ISDN, and it
    utilizes the existing copper telephone wiring provided by your telephone company.
    You can even use the same phone line as a regular phone line! A DSL connection
    requires additional communication hardware, and your Internet Service Provider
    (ISP) should provide.


    Note that several variants of DSL exist:


    +   - IDSL (over an ISDN line) ISDN line

    - Symmetric Digital Subscriber Line (DSL)

    - Asymmetric Digital Subscriber Line (ADSL)

    - Generic DSL (XDSL)'
