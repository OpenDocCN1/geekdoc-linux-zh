  md: '# Chapter 3: Installing Fedora


    # Introducing SELinux


    Security-Enhanced Linux (SELinux) was developed by the USA''s NSA (National Security
    Agency, www.nsa.gov/selinux/) and gives you more fine-grained control over everything
    that''s happening on your system than the standard user, group, and owner permissions
    used by default in the Linux world. SELLinux is not limited to Fedora Core; it''s
    available as an extension in a growing number of Linux distributions. In general,
    solid security policies involve giving people only the amount of access that they
    strictly require so those who have a heavy need for limiting what people and software
    can do because they''re


    running mission-critical servers or are operating in a realm that needs for serious
    security measures find that SELinux lets them have far more control over what
    they do on their system. For the average home or small business user''s desktop
    system, SELinux can be overkill, though if you''re looking to play with this technology
    and become familiar with it for your resume or others, your home desktop could
    be an ideal platform for such a purpose. Because SELinux is quite extensive, I
    only touch on it in Chapter 12, but I do give you enough information to get started.


