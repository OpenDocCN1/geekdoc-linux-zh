    As you can see, many paths (in the form of distributions) lead to Linux. It is
    important to note that, regardless of which distribution you choose, you are using
    the same basic ingredients: the GNU tools and the Linux kernel. The major differences
    you''ll encounter among distributions are


    +   **Installation programs:** Each distribution has developed its own installation
    program to help you achieve a running system. Some installation programs are designed
    for the casual computer user (hiding the technical details), whereas others are
    designed with the seasoned system administrator in mind. Some of the simpler ones
    offer an "expert mode" for those who want to have more control right from the
    beginning.


    +   **Software versions:** Different distributions may use different versions
    of the **kernel** (the core of the operating system) and other software packages.
    Open source projects are dynamic and release new versions regularly, as opposed
    to the often sluggish development cycle of traditional commercial software.


    +   **Package managers:** Even though one Linux program should be able to run
    on any distribution, tools called package managers keep track of the'
