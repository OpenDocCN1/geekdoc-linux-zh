  md: '# Chapter 20


    # Ten Troubleshooting Tips


    In This Chapter


    +   - Dealing with frozen installations

    - Changing your boot environment

    - Recovering when you see some black-and-white text screen!

    - Escaping a hung GUI

    - Using multiple resolutions


    Troubleshooting is like reading a mystery novel. You have some facts, symptoms,
    and details, but you don''t know whodunit. You have to take whatever information
    you have, with that data, weigh the various possibilities, and then narrow them
    to a single suspect. Finally, you need to test your theory and prove that your
    suspect is the guilty party.


    Troubleshooting problems in Linux (or any operating system) can encompass many
    hardware and software issues. Whether the problem is the operating system, the
    hardware, or a service giving you fits, you can use some basic troubleshooting
    techniques to sharpen your investigations:


    +   - Document the problem. Write down any and all symptoms that the system is
    showing, including actions you can and can''t do. Jot down information you see
    in error messages.

    - Examine the Linux log files. You can find most of these in the /var/log directory.
    Look for the word "error".

    - Compare your problem system with a working system running the same distribution
    and version. Sometimes, comparing configurations and settings may uncover or narrow
    the possibilities.

    - Check connections. Check to make sure that all the hardware is connected properly
    and powered on. Verify that all cables and connections are attached properly.
    There''s always someone, somewhere, kicking a cable out from a wall connection.

    - Remove new hardware. Remove any hardware that you have changed or added recently
    (before the problem started) and see whether the problem disappears. If so, you
    can conclude that the new or changed hardware (or its driver) is the culprit and
    start researching solutions.'
