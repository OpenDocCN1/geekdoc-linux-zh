  md: '# 178 Part II: Internet Now!


    A multitude of e-mail programs is available for Linux users. The defaults in the
    various distributions discussed in this book are also included


    +   - Knoppix: KMail (http://kmail.kde.org/), although Mozilla Mail is also included

    - Evolution (www.novell.com/products/evolution)

    - Linspire: Mozilla Mail

    - Mandrake: KMail, with Contact and Evolution also installed

    - SuSE: Contact (www.contact.org)

    - Xandros: MailEvolution and Contact should both remind you much of Outlook, so
    if you like being able to integrate your calendar, address book, task manager,
    and e-mail, you should like these programs. Mozilla Mail and KMail are more single-purpose.
    Evolution is the default client in the distribution included with this book (Fedora
    3), I cover this program in the most detail in this chapter. This program should
    also be simple to add (see Chapter 12) to most distributions because it''s popular.


    ![](img/22f96dae18f408076ba0d3209536be6c_195_0.png)


    Another popular mail program is Thunderbird (www.mozilla.org/products/thunderbird),
    which is a spin-off of Mozilla Mail.


    # Setting up Evolution


    The first time you open Evolution, the program walks you through the setup process,
    so be sure to have the following information on hand:


    +   - Your assigned e-mail address, in the format username@example.org.

    - The type of mail server used for incoming mail: for example, POP.

    - The name of the mail server used for incoming mail, in the format servername.example.org.

    - The type of mail server used for outgoing mail: for example, SMTP.

    - The name of the mail server used for outgoing mail, in the format servername.example.org.
    This name may be the same as for the incoming mail server.


    +   - Any special type of authentication required, for both mail coming and going
    out. This authentication is typically just passwords for incoming mail and may
    be nothing for outgoing mail.


    After start Evolution for the first time, the Evolution Setup Assistant launches.'
