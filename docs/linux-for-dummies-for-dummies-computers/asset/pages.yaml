    to install it before you install Linux. Otherwise, during installation, Windows
    will overwrite the partition of your hard drive that Linux boot menu. This can
    create a bit of mess later when you want to boot back into Linux! Those who are
    installing Windows first skip down to the section "Working with Disk Partitions"
    to find out how to set up your Windows installation so that it causes the least
    amount of fuss when it''s time to add Linux.


