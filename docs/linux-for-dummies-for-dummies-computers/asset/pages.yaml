    ```


    One of two things happens:


    +   - If only one matching command is in the search path (directory locations
    for searching for programs; type echo $PATH to find out yours is), your command
    line is completed with that command, and the system waits for you to press Enter
    to execute the command.


    +   - If you hear a beep, it means that more than one command begins with up.
    Simply press Tab a second time, and all the possibilities are displayed. Locate
    the command on the list and continue it until the first letters are unique, at
    which point you press the Tab key to complete the command.


    # Completing a filename


    Command-line completion isn''t just for commands; if you are typing a filename
    on your command line, you only need to type the first few characters and then
    press Tab. The shell searches the current working directory for filenames that
    match what you have typed and subsequently completes the filename on the command
    line. This feature behaves the same way as the command-completion feature in that,
    if more than one file contains the letters you type, you hear a beep and need
    to press Tab to see a list of choices.


    It takes a little getting used to, but after you have control of the Tab key and
    the shell command line completion feature, you may wonder how you ever got along
    without it.


    # Accessing your command history


    It''s nice of the shell to remember what you have done, for better or worse. Having
