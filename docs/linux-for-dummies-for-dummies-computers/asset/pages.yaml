  md: '# # Chapter 7


    # # Configuring Linux


    **In This Chapter**


    +   - Creating user accounts

    - Setting up your printing

    - Finding cool configuration tools


    > The doctor can bury his mistakes but an architect can only advise his client
    to plant vines.

    — Frank Lloyd Wright (1869–1959)


    Unlike both the architect and the doctor, the computer user isn''t stuck with
    configuration mistakes. You can tweak and change things until you''re happy with
    them! Because the first a lot of people to do with a new system is just set it
    up right. I thought I spend this chapter sharing some of the core bits of knowledge
    that can help you do just this. You start by finding out about user accounts and
    why I am so insistent that you create a special one for your own use in Chapter
    3. Then, find out how to set up your machine to talk to your printer. I also show
    you where the cool configuration tools are for your distribution that you can
    get down some serious customization.


    # # Accounts Great and Small


    Linux is a multiuser operating system. It allows everyone to have a unique account
    and allows more than one user to log on at the same time. Typically, even if you''re
    the only user on a system, you need an account of your user that isn''t the root
    user''s. (I explain why in the next section). In addition, having multiple accounts
    is especially fun for experimenting with different user setups. That way, you
    can create a main account to be more careful with goofing around account to completely
    mess around with.'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Avoiding root


    The root user, also known as the superuser or just root, has access to all and
    everything on your machine. There is no blocking root for a directory, file, command,
    or device. Because of this factor, many Linux beginners figure that they may well
    use the root account all the time because it''s so convenient.


    However, for lots of reasons, you shouldn''t use the root account for everyday
    use:


    +   - You don''t always need root-level access.

    - Root-level access is as much a curse as it is a blessing. If you mess up as
    a regular user, you only mess the stuff in your account. If you mess up you can
    wipe out everything—all the files on your entire Linux system! That''s why Linux
    distributions like SuSE give you a nasty red background when you login as root
    (in the GUI) as a dire warning. It doesn''t even give you root one of the options
    to select in the GUI login. SuSE doesn''t give you a graphical option for root,
    but you can type it into the Username box.

    - Don''t think you can wipe out everything? Many Linux administrators tell horror
    stories about the day they made a fatal typo or weren paying attention to what
    they were doing and completely destroyed an installation.

    - If you send email or news posts as root for anything other than serious administrative
    business, people think that you don''t know what you''re doing or are showing
    off.

    - Root comes with too much temptation. The superuser can read other people''s
    email messages and files, which introduces a few "tiny" ethical issues.


    ![](img/22f96dae18f408076ba0d3209536be6c_151_0.png)


    Linsphere has a slightly different philosophy. You have only one account when
    you''re using Linsphere, by default. However, in the next section, I show you
    how to create new accounts so that you don''t have to use root — or let someone
    who''s borrowing your computer for a moment to browse the Web do it under root!


    # Creating user accounts


    Most Linux distributions include a graphical interface application for creating
    and managing user accounts. Here''s how you can find this application for your
    distribution:


    +   - Fedora Core: Choose Applications➔System Settings➔Users And Groups opens
    the User Manager.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Chapter 7: Configuring Linux


    +   - Knoppix: From the main menu, choose System⌃-User to open the KDE User Manager.


    +   - Linspike: From the main menu, choose Settings⌃-User Manager opens the KDE
    User Manager.


    +   - Mandrake: From the main menu, choose System⌃-Configuration⌃-Other⌃-User
    Administration opens the Dراك tool.


    +   - SUSE: From the main menu, choose System-YaST opens up YaST. (See the upcoming
    section “SUSE tools” for more on YaST.) On the left, choose Security and Users.
    Then, on the right, choose Edit And Create Users to open the User And Group Administration
    dialog.


    +   - Xandos: Choose Launch⌃-Control Center opens the Xandos Control Center. From
    here, click the plus next to System Administration to expand it and then click
    User Manager to open the KDE User Manager.


    While these tools are not identical from distribution to distribution, they''re
    quite similar and work in essentially the same way. After all, each application
    has pretty standard steps to creating user accounts. I walk you through how to
    create user accounts in Fedora Core, and most of the same steps apply elsewhere.


    To create a new user account in Fedora:


    +   1. Choose Applications⌃-System Settings⌃-Users And Groups.


    +   Because you''re (hopefully) using a regular user account, the account for
    root dialog appears.


    +   2. Enter the root password and click OK.


    The User Manager window opens, as shown in Figure 7-1. When the application opens,
    the user account you created during installation appears.


    ![](img/22f96dae18f408076ba0d3209536be6c_152_0.png)


