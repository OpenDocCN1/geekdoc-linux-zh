    Most Linux distributions also keep a running history of the most recently used
    commands. To use this list, press the up-arrow key on your keyboard. This action
    pulls up the last command you typed. As you continue to press the up-arrow key,
    you step through the most recently entered commands from the most to least. If
    you accidentally press what you''re looking for, use the down-arrow key to go
    back. When the command you appears at the command prompt, press Enter to execute
    the command, or edit it and then press Enter.


    In Chapter 14, I cover the command-line environment in more detail.


