    # Selecting an Internet Service Provider (ISP)


    Because of the meteoric rise in the popularity of Linux, many ISPs are training
    their support staff in the ways of Linux. If you already have a dial-up service,
    give one of them a call to let them know of your pursuits. Chances are, that person
    already has information pertinent to Linux subscribers and can provide you with
    that information. If you''re shopping for a new ISP, this section offers some
    practical selection advice.'
