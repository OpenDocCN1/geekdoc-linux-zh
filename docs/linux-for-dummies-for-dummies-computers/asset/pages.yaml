  md: 'The syntax for drawing a man page is man <command name>.


    Don''t know the command you''re looking for or need basic information about using
    the man page system? Just type man man to get started. When you''re finished reading
    the man page, press Q to exit.


    # Clearing the screen


    The clear and reset commands are handy to know about when you''re working in a
    shell. The Clear command simply wipes the bash screen clean. Don''t worry; it''s
    not deleting any files or changing any settings — it''s just tidying up so that
    you can start dumping new stuff to the screen again.


    The reset command is a little more interesting. Suppose you try listing a binary
    file to the screen with the cat command. After the computer finishes puking the
    result of executing the cat command on a binary file, you may get lucky and still
    be able to read prompt. More likely, your prompt has keyboard gives you more of
    the same. To get back to normal, just type reset and press Enter. Note that it
    doesn''t look like you''re typing the word reset, but rest assured that the computer
    understands the series of characters and, after a couple seconds, should restore
    your shell environment to your native language.'
