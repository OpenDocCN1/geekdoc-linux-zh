  md: '# Appendix A


    # Common Linux Commands


    In This Appendix


    +   - Archiving and compression commands

    - Communication commands

    - File commands

    - System control commands


    Computing novices often marvel at the keyboard dance Linux experts typically perform.
    Sure, these experts know about modern advances like the mouse and graphical interface,
    but these keyboard musicians prefer the home keys and find that they can work
    faster with the keyboard. It takes some time to reach this level of proficiency,
    but every expert was a novice at one time, and any novice can become an expert
    by delving into the various commands and getting plenty of practice.


    In this appendix, you find the commands listed by themes, according to what they
    actually do for you.


    So, read on — and dazzle your friends with your command-prompt finesse. When they
    ask you and how you figured out all those commands, just smile and mumble something
    about the voices in your head — and, of course, keep this sequence dog-eared and
    within reach of your computer.


    # Linux Commands by Function


    Because every command serves a specific purpose, organizing these tools into groups
    according to their individual functions is not difficult. If you know what you
    need to do but do not know which command does the job, flip through this to start
    your search. From here, you can dig further by referencing pages and other help
    information (online sites and reference books, for example) or by looking in this
    book''s index for further coverage.


    To access a man page, type man command at a command prompt. For example, man ls
    shows you the help information for the file listing command.'
  merge: -1
  pgno: 412
- img_proc: true
  md: '# 396 Part VI: Appendixes


    # # Archiving and compressing


    Although disk space isn''t as much of a premium as it once was, bandwidth and
    backup media still are. Subsequently, this group provides a potpourri of tools
    for compressing and organizing data for storage, as shown in Table A-1.


    | Table A-1 | Archiving and Compressing Tools |

    | --- | --- |

    | bzip2 | Compresses files into .bz2 format. Used mostly for incredibly large
    sets of text files (which is source code actually is). |

    | compress | Compresses files into .Z format. Pretty old and not used much in
    the Linux world. |

    | gunzip | Uncompresses .gz files and .tgz files. |

    | gzip | Compresses files into .gz format. |

    | tar | Packages files together in a group. |

    | uncompress | Uncompresses files from .Z format. |

    | unzip | Uncompresses files from .zip format. |

    | zip | Compresses files into .zip format.


    # # Built-in bash commands


    Some commands don''t even seem to exist if you try to look up their help information
    in the man pages, and the commands don''t show up as files on your system. Remember,
    as you type commands at the prompt, you''re communicating with a type of program
    called a shell. (In my case, it''s bash, the default Linux shell.) The shell has
    a set of commands, included in the following list, that you can use to communicate
    with it, as shown in Table A-2.


    | Table A-2 | Shell Commands |

    | --- | --- |

    | alias | Creates command shortcuts. |

    | env | Lists your current environment variables and their settings. |

    | export | Whenever you''re told to set an environment variable, use this first
    so that the variable will be remembered properly.'
  merge: -1
  pgno: 413
- img_proc: true
  md: '# Appendix A: Common Linux Commands 397


    | Command | Purpose |

    | --- | --- |

    | history | Lists off the last 1,000 commands you''ve typed. |

    | alias | Removes command shortcuts. |


    If you try to view the man page entry for some of these commands, you find instead
    the help information for BASH BUILTINS loads. To search through this massive manual,
    press the forward slash (/) key to open the man search interface and then type
    the name of the command you want to search for. Press Enter to start the search.
    The interface stops in the first spot where the term is found. If you want to
    try again, press the N key to proceed to the next occurrence of the word.


    For example, you might be reading the massive bash man page (type man bash to
    access this page), but perhaps you''re only interested in items related to prompts,
    which are the bits of text that appear to the left of your cursor in a text window.
    An example prompt


    > [@catherine dee]$


    So, you might type /prompt and press Enter to jump down to the first instance
    of this word. If the text around the word doesn''t reflect what you''re looking
