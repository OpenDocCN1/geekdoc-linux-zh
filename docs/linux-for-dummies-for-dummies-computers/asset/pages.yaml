    # Using Redirection and Pipes


    Redirection and pipes facilitate the flow of information. A pipe directs the output
    of one program to the input of another program. A pipeline may consist of several
    utilities bundled together by pipes. At either end of this pipeline is, optionally,
    a redirection.


