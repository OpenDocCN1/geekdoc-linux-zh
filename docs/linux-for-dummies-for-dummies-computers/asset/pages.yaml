  md: '# Chapter 5: Booting and Stopping Linux


    This list shows some symptoms of a missing, incorrect, or corrupt system kernel
    — all would occur after you either make your menu selection and press Enter, or
    just let the boot loader do its thing automatically without choosing anything:


    +   - The system freezes.

    - A few dots appear across the top of the monitor, and then the system freezes.

    - A few messages appear on the screen, and the final message reads panic.

    - The system reboots automatically.


    You know when the kernel is loading because you start to see crazy text like:


    ```

    Uncompress Linux... Ok, booting the kernel.

    audit(109256612,337:0): initialized

    ```


    Recovering from a kernel loading failure (aside from operating system not found”
    — see previous section) is one of the more challenging issues in Linux. This is
    unfortunately not for the faint of heart. On the other hand, the failed kernel
    may be an updated. If you have more than one Linux option in your boot menu, look
    the version numbers for each of the options and choose the second one. Doing so
    lets you into the last working kernel and have a working system. You can open
    up www.google.com and search for the error messages or wait until the next kernel
    update comes and ignore the bad one for now.


    In the case where your original install doesn''t properly start, you unfortunately
    don''t have a fallback kernel option. If this is your problem, recommend identifying
    your distribution''s support address (if you purchased a commercial product) or
    joining the installation or beginner''s help list if you downloaded a free product.
    See Chapter 2 to find out where to locate help for each distribution discussed
    in this book.


    # Step 4: Control is handed over to init


    Once the kernel''s finished loading, it passes off the system initialization to
    a program init. The init program is responsible for starting all services and
    programs. You can see these processes starting as they scroll up the screen with
    [OK] or [FAILED] on the right side of the monitor. If you see these lines, you
    know that your kernel has finished loading.'
  merge: -1
