  md: '# 176 Part II: Internet Now!


    # Subscribing to newsgroups


    To read newsgroups, you first must subscribe to the ones you want to check out,
    and then you have to load their new posts (individual messages). To activate these
    subscriptions:


    +   1. Click your newsgroup server in the list on the left (The Local Folders
    entry beneath it is your e-mail interface).


    The settings and configuration screen appears, as shown in Figure 9-6.


    +   2. Click Manage Newsgroup Subscriptions.


    The Subscribe dialog box appears. The first time you''re in for an index of all
    the newsgroups downloads to your browser. Tens of thousands of newsgroup titles
    are out, so even though the browser is downloading only the newsgroup names, the
    process takes some time. The status bar at the bottom of the dialog box indicates
    progress.


    +   3. After all the newsgroup titles have loaded into your browser, scroll through
    the list for topics of interest. When you find a newsgroup you want to subscribe,
    click in its Subscribe box in the listing to put a checklist in it.


    ![](img/22f96dae18f408076ba0d3209536be6c_193_0.png)


    Figure 9-6: The Mozilla newsgroups settings interface in Knoppix 3.6.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Chapter 9: Using the Internet


    Newsgroups tend to be in hierarchies, so when you see a triangle to a listing''s
    left, click it to expand and see the subgroups inside that group. The section
    comp.os.linux (so that comp.os.linux) contains a number of Linux newsgroups you
    may be interested in.


    +   4. Click OK.


    You''re now back at the Manage Newsgroup Subscriptions dialog box.


    # Reading news


    To read your news after you''ve configured Mozilla for this purpose (by following
    the instructions in the previous section):


    +   1. From the Mail & Newsgroups dialog box or the Manage Newsgroup Subscriptions
    dialog box, click the newsgroup you want to read.


    The Download Headers pops up with a message that needs to load headers (for each
    post, the name of the person who posted and the subject assigned to the post)
    for this group. If it''s a busy newsgroup or it''s the first time you read this
    you may be prompted for the number of message headers you want to download.


    +   2. If you are asked how many headers to download, select either All Headers
    or specify how many headers to download.


    The default of 500 is a good number. If you don''t want to see any of the others
    (not a bad idea when you''re just starting in a group, or you''ll never get to
    the new stuff) click the Mark Remaining Headers as Read checkbox.


    +   3. Click Download.


    The process goes to the news server and grabs the basic information about the
    news posts. You can now scroll through the messages and read to this newsgroup
    by clicking one of the headers. See what your peers are doing around the world
    is educational, if nothing else!


    ![](img/22f96dae18f408076ba0d3209536be6c_194_0.png)


    You need to be aware of the written and unwritten rules for newsgroup etiquette,
    which vary wildly from group to group. I recommend you read the Frequently Asked
    Question (FAQ) page for the newsgroup and lurk for a while before posting questions
    and comments.


    # Evolving into E-Mail


    While most people think of the Web when they think of the Internet, e-mail may,
    in fact, the most used and beloved of Internet applications.'
