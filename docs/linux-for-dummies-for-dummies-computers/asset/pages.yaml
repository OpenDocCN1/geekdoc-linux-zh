    # Starting off with SuSE


    The SuSE ("OO-za", www.suse.com) company and Linux distribution were founded in
    1992 and purchased by Novell (www.novell.com) in 2004. The distribution is named
    after a German acronym for Software and Systementwicklung (Software and System
    Development). One SuSE claim to fame is its international support (most distributions
    provide a level of support for users around the globe, but some have better language
    integration for particular groups than others; SuSE excels in the German and western
    european space).


    SuSE is primarily a commercial distribution, though it has a limited option that
    I discuss in the section "About the various SuSE versions." Rather than a compared
    free version against other people''s full versions, I walk you through the installation
    of the full SuSE Professional 9.2. While, most distributions have one or more
    of integrated configuration setup, SuSE''s YaST is particularly extensive, and
    is equally without an unfortunate rarity. The manuals that come with the boxed
    versions are also nice and thick, serving as a add-on for this book, online help,
    user forums, and so on.


    A Live CD SuSE 9.2 with KDE is included as an ISO file within the distros folder
    on the DVD-ROM that comes with this book. No install is required, so you can just
    burn the ISO onto a CD-ROM, put the CD into your drive, and boot your machine
    to experience this version of SuSE Linux.


