  md: '# 100 Part I: Getting Your Feet Wet


    The problems you may encounter with services (programs that run in the background)
    that fail to start properly, as is indicated by the [FAILED] status shown during
    the boot process. Many of these services don''t keep you from logging in and using
    your system. Services usually fail because misconfigurations or unsupported hardware
    drivers. Sometimes a service takes a long time to start up, so you may need some
    patience while you wait it out. Once installed, you can use the techniques described
    in Chapter 12 to shut off the rescue service if it''s being a pain. If the machine
    can''t boot without this service, you''ll need to access your distribution''s
    rescue mode. Rescue mode is covered in the next section. Entering Rescue Heavy-duty
    system repair tends to happen in rescue mode, which is a special boot selection
    that simulates your hard disk in what is called a RAM disk, holding the files
    entirely in memory. The benefit of this is that you can perform necessary system
    surgery without requiring utilities that are part of the installed system; everything
    is part of the rescue disk. The drawback is that this is a purely command-line
    interface, and you have to know your stuff to find your way around.


    Appendix A contains a list of Linux commands, roadmap to help you out. Chapter
    20 addresses, other things, how to fix your boot loaders from if your problem
    is with the boot loader, and how to track down the error messages your kernel
    might have left behind. You may also be able to find helpful tips by reviewing
    your distribution''s documentation and help forums.


    ![](img/22f96dae18f408076ba0d3209536be6c_117_0.png)


