  md: '# # Chapter 16


    # # Putting the X in Text


    **In This Chapter**


    +   - Viewing the contents of text files

    - Manipulating text files in nano

    - Editing text files with Kate

    - Working with text files in gedit


    From text editors to word processors, Linux offers a wide variety of options for
    working with words. In this chapter, I take a look at different ways to view the
    contents of a text file, using some simple text editors in both the non-GUI and
    GUI environments. In Chapter 17, I take a look at office suites for those who
    would rather do-processing!


    # # Viewing the Contents of a Text File


    Yes, first command is cat, and it''s taken from the word concatenate, which means
    "to bring together to end" — you just use the cat command on multiple text files
    to have their text joined, one file''s contents directly after another''s. Typically,
    you use this command in the Linux world in the format filename, where the contents
    of the file filename are displayed on the screen. For example, if you create the
    short text file greetings and type cat greetings, you see the following:


    ```

    $ cat greetings

    These are the contents of the greetings file.

    Meow!

    $

    ```'
  merge: -1
