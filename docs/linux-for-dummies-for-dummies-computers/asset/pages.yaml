    # "The Linux Installer Freeze"


    When you''re installing Linux, the installation may just freeze. If it does, wait
    and make sure that the installation program really froze. (Sometimes, the software
    just takes a while to process information.) If the software looks like it frozen,
    there''s no harm in rebooting your computer and starting over — just as you would
    do with any operating system installation. Sometimes, you can reboot and never
    have that problem again. At other times, the problem may happen twice in a row
    and then be the third time. several times before giving up.


    If the installation freezes in the same spot or close to the same spot, go to
    the distribution''s support pages (Chapter 2). These pages may talk about some
