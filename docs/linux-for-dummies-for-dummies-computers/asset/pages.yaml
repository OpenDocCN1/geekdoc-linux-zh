    # Adding More Software Repositories


    Did you install Knoppix, but you can''t find all the programs you want to add?
    Because Knoppix is a variant of the Debian distribution (www.debian.org), you
    can add anything to Knoppix that you can add to Debian. So, the trick is to find
    the proper Debian software repositories and add them to your system that so KPackage
    knows where to find them.


    ![](img/22f96dae18f408076ba0d3209536be6c_406_0.png)


    The skills described in this section are useful for those using Linsp and Xandros
    as well, because both of those distributions are based on Debian, then.


    To do so:


