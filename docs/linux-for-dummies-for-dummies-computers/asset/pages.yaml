  md: '# Chapter 9: Using the Internet


    Finally, the bottom section of this dialog box allows you to make a few customization
    tweaks:


    +   - Show Tooltips: When you hover your mouse pointer over a Mozilla option,
    a little tip pops up onto your screen.


    +   - Show Web Site Icons: Grabs and uses the tiny icons some Web sites next to
    their URLs, showing them in your bookmarks next to the labels.


    +   - Smooth Scrolling: Make sure that when you scroll, you''re doing so. Available
    in Fedora Core 3 but not Linscape or Xandros.


    +   - Resize Images To Fit In The Window: Doesn''t force you to scroll around
    a big image to see the whole thing at once, but instead fits it into the window.
    Underneath Appearances, the remaining menu entries are:


    +   - Fonts: Enables you to set your preferred typeface. For desktop resolutions
    of 1024 x 768, and I recommend zooming your font sizes immediately. (Otherwise,
    become very familiar with the key combinations Ctrl+ to make all the fonts in
    the browser bigger, and Ctrl- to make them smaller. Use the + and - on your number
    pad and not your main keyboard.


    +   - Colors: Set your text colors and whether you want to override explicit Web
    pages settings. This setting is an important one for color-blind installation.


    +   - Themes: Allows you to put a custom paint job on your Mozilla installation.


    +   - Languages/Content: Allows you to set the sidebar preferences of your browser
    to a particular locale''s language.


