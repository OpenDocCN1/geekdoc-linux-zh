  md: '# Part III: Getting Up to Speed with Linux


    # Changing GNOME''s Look and Feel


    Change is inevitable, except from a vending machine.


    — Anonymous


    The GNOME desktop environment has an amazing set of features for you to explore.
    Some of these customization features are nice and practical, and others are just
    plain fun. I tried to group the types of changes into related topics so that you
    can peruse them easily. In general (including in Fedora), you can find all the
    GNOME configuration options by going to the main menu’s Preferences menu. Because
    Fedora is the only distribution covered in this book that uses GNOME by default,
    I focus on Fedora in this chapter.


    # How do you like applets?


    Applets are a collection of miniprograms that do anything from displaying the
    time to show system status — some can even see the depressing trickle of your
    battery power running out if you''re using a laptop. Sure, some of these miniprograms
    are more useful than others. Then again, everybody needs a bit of entertainment
    to do, right?


    # Adding an applet icon to the panel


    You can have fun sifting to see what kinds of applets are available to you. To
    look through your options and add an applet to the panel (remember that the panel
    is the bar at the bottom of your screen), follow these steps:


    +   1. Right-click any free space on one of your panels and Choose Add To Panel.

    The Add To (Bottom or Top, accordingly) Panel dialog box appears, as shown in
    Figure 15-1.

    If you don''t see an Add To Panel command, you''re probably looking at the context
    menu for one of the applications on the panel. Try rightclicking elsewhere on
    the panel or closing some programs so that you can free space amongst the minimized
    programs in the middle of your panel.

    2. Browse the available applets.

    3. After you select the applet you want to add to your panel, click Add.

    The applet is now on your panel.


    If you want to move the applet elsewhere on your panel, right-click it and choose
    Move from the shortcut menu. Then you can drag the applet and click after you
    have it where you want to put it.'
