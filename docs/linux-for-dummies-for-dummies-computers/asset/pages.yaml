    # Tweaking the GUI''s Innards


    Behind GNOME and KDE lurks the X Window System, or "X." X provides the skeletal
    GUI structure and functionality; GNOME and KDE make use of this skeleton to provide
    you with a pleasant GUI environment. Whenever you configure hardware or other
    basic GUI features like resolution, you actually work with X, not GNOME or KDE.
    In this section, I introduce you to the critical components of X and point you
    to some useful X configuration tools.


    The /etc/X11/XF86Config,/etc/X11/XF86Config-4, or /etc/X11/xorg conf file contains
    your X configuration. (All three files look the inside.) Although this file is
    just a normal text file, the format is complicated and confusing. Rather than
    make you work with this file by hand, the various Linux distributions provide
    a number of tools. (See Chapter 20 for which tool comes with which distribution)


    ![](img/22f96dae18f408076ba0d3209536be6c_322_0.png)


    If you really enjoy experimenting with GUIs and fiddling with them, you can do
    a number of things. Go to www.linuxdoc.org and read the various X Window System
    and XFree86-related HOWTO files. Some are quite technical, but some are a bit
    friendlier, and you may be surprised by just how much you can tweak the Linux
    GUI. You can also find www.gnome.org and www.kde.org, as well as dozens of other
    useful sites out there.'
