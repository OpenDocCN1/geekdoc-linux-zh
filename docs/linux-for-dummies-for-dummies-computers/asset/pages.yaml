  md: '# 230 Part III: Getting Up to Speed with Linux


    necessary at boot time, taking the need to do this out of your hands. Sometimes,
    however, if something went wrong, you get this unnerving prompt that tells you
    to enter your password or press Ctrl-D to continue. If this prompt appears, type
    your root (administrative) password, press Enter, and follow the these steps.
    Don''t worry; more often than not, you can actually fix this problem:


    ![](img/22f96dae18f408076ba0d3209536be6c_247_0.png)


    Because it''s a bit of an art at trying to figure out which partition may be damaged,
    I walk you through a process where you check the most likely ones to bring you
    to this state and then work the rest in turn.


    +   1. **Type df -h to see a list of all your partitions.**


    The df command lists the mounted partitions and media in addition to some statistics
    about them. You may, for example, see something like the following:


    | Filesystem | Size | Avail | Use% |

    |---|---|---|---||

    | /dev/hde2 | 54G | 27G | 54% / |

    | /dev/hde1 | 99M | 6.0M | 88M | 7% /boot |

    | none | 506M | 0 | 506M | 0% /dev/shm |

    | /dev/hdf3 | 54G | 39G | 136% | /mnt/fci |


    +   2. **Look for an item with /boot in the right column.**


    If you find one, line, Proceed to Step 3. Otherwise, skip to Step 10.


    +   3. **On that line, look at the left column to see what partition /boot is
    on.**


    In this example, /boot is on /dev/hde1.


    +   4. **Type mount.**


    This command gives you even more cryptic looking. It may be by


    ```

    /dev/hde2 on type ext3 (rw)

    none on /proc proc (rw)

    none on /sys type sysfs (rw)

    none on /dev/pts devpts (rw,gid=5,mode=620)

    subdevfs on /proc/bus/usb subdevfs (rw)

    /dev/hde1 on /boot type ext3 (rw)

    none on /dev/sh type tmpfs (rw)

    /dev/hdf3 on /mnt/h1 type ext3 (rw)

    sunprpc on /var/lib/nfs/rpc_pipefs type rpc_pipefs (rw)

    ```


    +   5. **Locate the line with /boot on /dev/hde1 once and look at what “type”
    is being used.**


    In this case, /boot on /dev/hde1 is formatted as ext3. Keep this in mind. You''ll
    need to use this information in Step 8.


    +   6. **Type umount /boot.**


    This command should release the partition.'
