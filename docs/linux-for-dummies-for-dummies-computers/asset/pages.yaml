    how they look in a browser at 800 x 600 or 640 x 480. Your machine is very likely
    already set up to do this, but you just need to know how!


    If your machine is set up for it, you can change resolutions by pressing the key
    combination Ctrl-Alt-Plus, where Plus is the plus (+) sign on your number pad
