  md: '# 174 Part II: Internet Now!


    # # Navigating Newsgroups


    Although e-mail is usually directed at an individual, you can think of newsgroups
    as public-message bulletin boards where people with similar interests come together
    to discuss a topic. Newsgroups (like Web forums) are also great places to find
    technical support.


    > TIP Newsgroup support isn''t included in Firefox, but you can use the information
    in Chapter 12 to install Thunderbird (www.mozilla.org/products/thunderbird, an
    e-mail and newsgroup reader based on Mozilla, so it''s similar to what''s in this
    book) or Pan, which is another popular choice.


    # # Configuring Mozilla to read newssgroups


    With the newsgroup server information that your ISP provides, follow these steps
    to access the world''s largest cork board:


    +   1. **Choose Window:** Mail & Newsgroups (Fedora users, choose Window:Composer).


    The first time you open this menu option, you immediately see the Account Wizard,
    shown in Figure 9-4. After you set up your newssgroups, selecting this option
    brings you to the (mail and news) message center with your Inbox selected by default.


    +   2. **Select the Newsgroup Account radio button and click Next.**


    ![](img/22f96dae18f408076ba0d3209536be6c_191_0.png)


    Figure 9-4: The Mozilla Account Wizard in Knoppix 3.6.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# Chapter 9: Using the Internet


    +   3. Enter your full name or the nickname you want to use into the Your Name
    text box.


    +   4. Enter your e-mail address into the Email Address text box.


    Because spammers harvest (collect) e-mail addresses of people to spam through
    newsgroup posts, many people like to “mangle” their e-mail address in their posts
    so that humans can make changes but a computer cannot easily tell the real e-mail
    address. Typically, you would set your e-mail address to something like meatexample.com
    and leave it at the end of all posts (in your signature, usually) to convert it
    — for this example, it would be meexample.com.


    +   5. Click Next and then enter your newsgroup server address into the Newsgroup
    Server text box.


    If your ISP didn''t give you this information already, check its Web site or contact
    its support team to find out what to use.


    +   6. Click Next and then type a descriptive name in the Account Name text box.


    +   7. Read the summary and verify that it''s correct. If not, click Back and
    fix what''s wrong. If correct, click Finish.


    The Mail & Newsgroups portion of Mozilla opens (see Figure 9-5).


    ![](img/22f96dae18f408076ba0d3209536be6c_192_0.png)


    Figure 9-5: The Mozilla Mail & News groups interface in Knoppix 3.6.'
