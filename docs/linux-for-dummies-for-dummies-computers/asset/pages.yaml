    # Zen and the Art of Linux Configuration


    One of the items that make distribution stand apart from the others is its collection
    of configuration tools. The friendlier the tools, the more likely that folks new
    to Linux will flock to that distribution. Mind you, old timers don''t mind having
    easy tools around either when they''re moving from one distribution to another.
    It saves them from having to re-learn where each distribution keeps their configuration
    files.'
