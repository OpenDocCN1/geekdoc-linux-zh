  md: '# 280 Part III: Getting Up to Speed with Linux


    Okay, when you have grown weary and bored with this little trick, exit (literally,
    type exit) to log out from each VT you may have opened and return to the graphical
    desktop and your bash prompt. Then you can explore all the fuss is about with
    this shell doohickey.


    # Understanding bash Command Syntax and Structure


    Many people happily skip through their Linux use without understanding the fundamentals
    of commands in the bash shell. Note that this approach makes you lose out on some
    cool capabilities available in bash. The more you know about this shell “language”
    works, the more interesting things you can do with.


    The basics of using bash at the command prompt often involves typing a command
    and any of its flags and values. For example, you enter the ls -la command to
    see a long-format listing of all files in your home directory, including that
    start with a dot (.) which are hidden files. That other mysterious character is
    technically called tilde. The tilde is a bash shortcut character that points to
    a user''s home directory. For this example, I merely list the contents of my home
    directory.


    You can break a command into three distinct components:


    +   - The command name

    - The options or flags

    - The arguments


    Consider this example.


    Start with a simple command. The du command lists the contents of the directory
    you are now in, and its subdirectories, and how much hard drive space each item
