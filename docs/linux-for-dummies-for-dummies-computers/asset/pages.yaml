    — you often have the option of running a large tool, or just the small component
    of that tool that you want to deal with. You can find most of the Mandrake tools
    by going to the main menu and choosing System✭Configuration. This submenu contains
    the following options:


    +   - Configure Your Desktop: The KDE Control Center contains many, many options
    for tweaking your desktop settings. Each user on your system can change things
    according to their own preferences.


    +   - KDE: Each individual option maps to one of the choices in the KDE Control
    Center. It''s a handy way to avoid opening up the whole tool to make one change.


    +   - Hardware: A number of the hardware-related settings are available here,
    eliminating the need to always open that tool.


    +   - Packaging: This may be one of your more popular options as you use Mandrake
