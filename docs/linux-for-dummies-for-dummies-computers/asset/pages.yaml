  md: '# Part I: Getting Your Feet Wet


    # Burning your ISOs


    If you end up needing to use the ISO files on the DVD-ROM or that you download
    in order to create distribution CD-ROMs or DVD-ROMs, I have some tips that can
    make this process easier. First, you need CD burning software, such as the Nero
    program (www.nero.com/en). Once you have a CD burning tool, look at the file size
    of the ISO you need to burn. Most ISOs can be burned to a standard 650MB/74 minute:
    CD-R or CD-RW, some are large enough that you need to burn 700MB/80 minutes. Knoppix
    is one that needs the larger CD-RWs. Another is Mandrake.


    having to throw out a lot of CDs to go to the landfills. However, your burner
    has to actually support rewable. Look on its front to see whether it is CD-R (it
    can''t rewrite), or CD-RW (it can rewrite).


    As you prepare to burn your CD or DVD, make sure that your software understands
    that you want to burn an ISO (the word to look for is **image**) and not just
    a file. If you burn your CD or DVD, put it into the drive, open it up, and see
    only one file, you have burned it incorrectly. An ISO should be unpacked onto
    the CD or DVD as a bunch of files and directories.


    Finally, it''s a good idea to burn these types of CDs and DVDs at a speed of four
    or less. You reduce your chance of introducing errors this way.


    When possible, use CD-RWs, because they''re rewritable and you''re able to download
