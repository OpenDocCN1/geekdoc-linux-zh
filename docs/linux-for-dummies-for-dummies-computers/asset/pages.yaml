  md: "# 152 Part II: Internet Now!\n\n# Beware of devices posing as modems\n\nI try\
    \ to save you from some frustration — and your computer from your ball-peen hammer.\
    \ Many Linux newbies have become irritated by not being able to communicate with\
    \ their analog modems. \"After all,\" the newbie reasons \"the same hardware works\
    \ when I was running Microsoft Windows.\"\n\nthese labels can be misleading because\
    \ some manufacturers just don't bother to list other operating systems even though\
    \ their hardware will work with those operating systems.\n\nWell, here's the story:\
    \ Years ago, hardware manufacturers developed a device, called a software modem,\
    \ in an effort to reduce hardware costs. The idea was to trim some responsibility\
    \ from the operating system. The result was an inexpensive modem that operated\
    \ only under Microsoft Windows. In short, these-called modems, also known as WinModems,\
    \ are really modems at all, but rather, are themselves cable interfaces to Windows.\n\
    \nWindows recognizes your modem, but Linux doesn't.\n\nIn short, if you have a\
    \ software modem, Linux simply doesn't work with it. For the adventurous user,\
    \ the LinMod project (linmodems.org) has successfully written Linux drivers to\
    \ work with these of software modems. I encourage you to become involved in this\
    \ type of project, if you're moved. These explorers drive the wonderful world\
    \ of freedom software, which Linux is a prominent part.\n\nThe following list\
    \ shows methods you can use to determine whether you have a software modem:\n\n\
    +   * The model number has a HCF-, HSP-, or NSF- in front of it.\n* The packaging\
    \ refers to the device as a WinModem or designates that it works with only Windows\
    \ (sometimes\n\nThe bummer in all that is, although saved a few bucks by buying\
    \ a machine with a software modem, you likely need a real modem to use with Linux\
    \ (unless you are lucky to have a LinModem). Your best bet is to purchase a real\
    \ modem in place and have the external modem just for Linux (or any other computer\
    \ you may want to move it later).\n\n# Setting Up the Hardware\n\nBefore you get\
    \ too comfortable in your chair, you must physically check some items that may\
    \ require you to do some low-level maneuvers (such as crawling under your desk):\n\
    \n+   * Cable modem, DSL modem, or any other fancy connection: If you have one\
    \ of these basses, you need to make sure that:\n  * An Ethernet cable (like a\
    \ phone cable) is plugged into your computer's Ethernet card and into the special\
    \ cable, DSL, satellite, or ISDN modem your ISP installed."
