  md: '# Chapter 8


    # Connecting to the Internet


    In This Chapter


    +   - Understanding common Internet connection methods

    - Setting up your Internet connection

    - Connecting to your Internet Service Provider (ISP)

    - Understanding enough TCP/IP to be dangerous


    > Every improvement in communication makes the bore more terrible.

    — Frank Moore Colby


    You may already be connected to the Internet if you''re on a machine that''s connected
    to a LAN and configured the networking during installation. To test whether you
    have a connection, open a Web browser and try to go to an outside Web site (like
    www.tinuxworld.com). If it works, you''re up! No need for this chapter. Otherwise,
    read on.


    # Internet Connectivity 101


    A few words regarding the broadband options (DSL and cable) are in order before
    I. The word broadband has a technical definition, but I just use it to mean high-speed
    Internet access. Although a dial-up modem can typically transmit information at
    speeds up to 56 kilobits (thousand bits) per second, broadband connections can
    reach 50 times that speed. Nowadays, the Web contains lots of images and multimedia
    elements, and enjoying these features through a 56 kbps dial-up modem is similar
    to drinking a cold glass of water with an eyedropper when you''re dying of thirst.


    Don''t let high-speed providers discourage you from using Linux with their services.
    Just because they don''t support Linux directly doesn''t mean that the technology
    doesn''t work with Linux. TCP/IP (the set of traffic rules for the Internet) was
    developed for the Unix operating system, from which Linux descends.'
  merge: -1
