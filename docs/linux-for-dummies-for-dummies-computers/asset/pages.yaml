  md: '# Chapter 17


    # # Word-Processing and More

    with OpenOffice.org


    +   In This Chapter

    * Installing the OpenOffice.org suite

    * Word-processing with OpenOffice.org Writer

    * “Spreadshe” with OpenOffice.org Calc

    * Presenting with OpenOffice.org Impress

    * Drawing with OpenOffice.org Draw

    * Formulating with OpenOffice.org Math

    * Configuring printing for the OpenOffice.org suite


    > Words fly, writing remains.

    — Spanish proverb, from Dictionary of Proverbs, by Delfin Carbonell Basset


    These days, just about everyone who has a computer has at least one suite at their
    fingertips. If they''re Microsoft Windows users, this is probably Microsoft Office,
    although it may be another worthy contender, such as Core WordPerfect. In Linux,
    typically the suite is OpenOffice.org. This suite comes with Calc (a spreadsheet),
    Draw (diagrams and figures), Impress (for presentations), Math (a word for writing
    mathematical formulas), and Writer (for word-processing).


    After you figure out how to use one of the programs in this suite, you may be
    happy to find that the others are designed to look and work in very similar ways.
    You can even open and save files in Microsoft Office format, if you need to share
    them with people using it — and you can edit the OpenOffice files people send
    you, too.


    That''s enough about OpenOffice.org. In this chapter, you can actually use it!'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# 318 Part IV: Getting Things Done


    Other office suites available for Linux users are the OpenOffice.org relative
    StarOffice (www.sun.com/staroffice), Appliquare Office (www.vista source.com/products),
    KOOffice (www.koffice.org), and Gnome Office (http://www.gnome.org/gnome-office/).


    # Word-Processing with OpenOffice.Org Writer


    Office processors are almost required equipment these days. Kids use them to write
    letters to their grandparents. Grandparents use them to write letters to their
    grandkids. Whether you''re working on the great American novel or a school book
    report, OpenOffice.org Writer has all the best features you''d expect to find
    these days in a word processor.


    # Starting it up


    To start OpenOffice.org Writer in the distributions covered in this book, see
    the following:


    +   - Fedora Core: Choose Applications-Office-OpenOffice.org Writer. Or you can
    click the OpenOffice.org Writer button on your upper panel.

    - Knopix: From the main menu, choose Office-OpenOffice.org Writer.

    - Linspire: From the main menu, choose Office-Programs-Business & Finance-OpenOffice.org
    1.1-OpenOffice.

    - Mandrake: From the main menu, choose Office-OpenOffice.org Writer.

    - SuSE: Choose Launch-Applications-OpenOffice.org-Word processor.

    - Xandros: Choose Applications-OpenOffice.org-Word Processor. Xandros users who
    purchased the product also have the option to install StarOffice through Xandros
    Networks (see Chapter 12), which is the commercial version of OpenOffice and contains
    additional fonts, templates, and more.


    When you first OpenOffice.org Writer, you may see a Paragraph Styles dialog box.
    Click the X in the upper-right corner to close this box and get out of the way
    for now.


    # A tour of OpenOffice.org Writer


    Before you proceed, take a look at the GUI layout shown in Figure 17-1.'
