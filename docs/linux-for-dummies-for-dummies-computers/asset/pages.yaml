    +   - Dynamic: Your IP address changes each time you connect, or at regular intervals.
    On most desktops, you just''t always need to have the same address, and it makes
    life easier on ISPs. It also makes easier for computer like laptops, which get
    moved around often from network to network. If you''re using dynamic addressing,
    you''re told you need to connect using DHCP.


    With this information, you can establish an Internet connection by your Linux
    system.


    # Hooking Up


    Fortunately, the Linux vendors provide tools that reduce the complexity of hooking
    with Linux. It''s not that networking has changed, but that many of its details
    have been hidden so you just have to click here and press a key. Long ago, configuring
    dial-up networking (in particular) on a Linux machine was nothing short of debugging
    a defective Rube Goldberg contraction.


    The Internet connection configuration tools available in the distributions covered
    within this book are:


    +   - Linspire: Double-click the Internet Connection Tools icon on your desktop
    to open the Connection Tools folder. Double-click the appropriate icon from there.


    +   - Fedora: Choose Applications:System Settings:Network to open the Network
    Configuration dialog box. Click New to start the Configuration wizard.


    +   - Mandrake: From the main menu, choose System:Configuration:Configure Your
    Computer to open the Mandrake Control Center. Choose Network & Internet:New Connection
    to access the Connection Creation wizard.


    +   - SUSE: From the main menu, choose System:YaST configuration tool. On the
    left, select Network Devices. On the right, choose the type of hardware you have
    in order to start configuring your setup.


    +   - Xandros: From the main menu, choose Control Center to open the Xandros Control
    Center. Click the link to Network to expand that menu and then choose Internet
    Connection to open your connection listing — you might need to click the Administrator
    button to enter your root password. Click New to launch the Connection Wizard.'
