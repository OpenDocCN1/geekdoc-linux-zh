    # Watchin'' Movies


    These days, you can watch many kinds of movies on your computer. Whether it''s
    a Flash animation, a DVD, or a movie trailer, you''ve got the tools that you need
    right at your fingertips (or just a click away). You may have installed some already
    while trying to access other multimedia features. Here are some of the tools of
    trade.


    Watching a DVD in Linux is a bit of a legal quagmire if you live in the United
    States. Digital Millennium Copyright Act (DMCA) and other issues make it tricky
    for any open source program to navigate the multimedia maze when it comes to movies
    that are encoded or protected in various fashions. However, not all DVDs have
    such countermeasures: there are DVDs that Americans can watch under Linux with
    no trouble. (Note that I say *watch*, and not copy or pirate).


    ![](img/22f96dae18f408076ba0d3209536be6c_373_0.png)


    For on the DMCA and the problems it causes, see anti-dmca.org.


    To watch a DVD in Linux, first check Chapter 11 to see what your distribution
    will if you just pop a DVD into your drive. Of course, you can also start a program
    by hand, though you may have to download it first:


