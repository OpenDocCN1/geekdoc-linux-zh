  md: '# 10 Part I: Getting Your Feet Wet


    Don''t scratch your head too hard; these concepts are tough to grasp initially,
    especially when you consider the conditioning you''ve received from the marketing
    departments of the commercial software industry. Perhaps you don''t know that
    when you purchase most proprietary, shrink-wrapped software, you don''t actually
    own the software; rather, you''re granted permission to use the software within
    the bounds dictated by the licensor.


    Linux has a license, but the motives and purpose of the license are much different
    from those of most commercial software. Rather than use the license to protect
    ownership of the software, the GNU General Public License (GPL) that Linux is
    licensed under ensures that the software will always be open to anyone. No one
    can ever own or dictate the way in which you use or modify Linux— they can have
    their own individual copyrights and trademarks on their various brands of it,
    like Red Hat. In essence, you already own Linux, and you can use it for anything
    you like, as long as you propagate the GPL freedoms to any further recipient of
    the software.


    # Linux: Revolution or Just Another Operating System?


    > Contrary to popular belief, penguins are not the salvation of modern technology.
    They do not their parties for the urban proletariat.


    — Anonymous


    Before going any further into Linux, I need to get some terminology out of the
    way.


    Tux is the formal name of the mascot penguin that represents Linux. Rumor has
    it that its creator, Linux Torvalds, is rather fond of these dressed inhabitants
    of the Antarctic.


    An operating system is the software that runs your computer, handling all of the
    interactions between you and the hardware. Whether you''re writing a letter, calculating
    a budget, or managing your recipes on your computer, the operating system provides
    the essential air that your computer breathes. Furthermore, an operating system
    isn''t just one program; it consists of hundreds of smaller programs and utilities
    that allow us to use a computer to do something useful. You then run programs
    on top of the operating system, like a word processor, to get everything done.'
