    # VMWare


    If you absolutely *have* to do something under Windows itself but only have one
    computer and it''s running Linux (or vice versa, for that matter), there''s VMware
    (www.vmware.com). This is a popular tool in technical support offices where people
    need access to many different kinds of machines to test things. It''s also popular
    with authors, like myself, because it allows us to grab those tricky screenshots
    of the boot process and installer screens.


    In VMware, you run a full session of another operating system (or even an extra
    session of the one you''re running on the main machine) within your desktop —
    see Figure 19-4. If your machine is powerful enough, you could have five different
    operating systems running in their own windows on a single computer.


    A minus to VMware is that it requires a bit of extra oom in your system. Check
    out its requirements and then try to go as far *above* them as you can. It also
    runs in a self-contained window. A plus, though, is that this program really is
    the next best thing to buying another computer.'
