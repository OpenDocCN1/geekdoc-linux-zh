    (top section, if you already have templates created) or an Empty File.


    The folder or file appears, highlighted.


    +   4. Type the name you want to assign to this folder or file and press Enter.


    The name is assigned to the folder or file.


    # Deleting files and folders


    To use Nautilus to delete a file or a directory from the file system, follow these
    steps:


    +   1. Browse to the file or directory''s location.


    +   2. Select the file(s) or folder().


    You can select the file or folder by doing one of the following:


    +   - Clicking the item to highlight its name.


    +   - Holding Shift down and clicking at the end of the row or column you want
    to select. (These items must all be lined up straight.)


    +   - Holding Ctrl down and clicking each individual item you want to select.


    +   - Clicking and dragging your mouse button so that you make a box that contains
    all the items you want to select.


    +   3. Press the Delete key or right-click and select Move To Trash.


    The file or folder vanishes from view. Keep in mind that the folder contains other
    files or folders, they go right along with it.'
