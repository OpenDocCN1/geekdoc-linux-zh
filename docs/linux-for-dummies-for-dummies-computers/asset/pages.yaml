  md: '# Chapter 14


    # Working without the GUI


    In This Chapter


    +   - Understanding the user shell environment

    - Customizing the bash environment

    - Working with commands

    - Tinkering with variables

    - Using redirection and pipes

    - Using yet more wildcards

    - Using a variety of commands


    > Whom computers would destroy, they must first drive mad.

    >— Anonymous


    Many computing old-timers speak fondly of the command line. Others who developed
    their skills by pointing and clicking refer to the command line as some antiquated
    tool used by crusty old-timers. The truth is that most skilled computing professionals
    recognize the merits of both the graphical user interface (GUI) and the command-line
    interface (CLI). You must understand that the command line provides a powerful
    lever for operating your computer. If you ever watch over the shoulder of a Linux
    geek, you will find that, logging in, he doesn''t take long to start tapping seemingly
    cryptic instructions on a command line.


    In this chapter, I explore the Linux program that provides the CLI, which is called
    the bash shell. While many shells are available for Linux, bash is the most common,
    and for good reason. Basically, the creators of bash rolled many good features
    of other shells into one terrific package.


    Each shell has its own way of handling commands and its own additional set of
    tools. I start by explaining what a shell really is, and when you understand that,
    you''re ready to get down and dirty with bash. I cover specifically what you can
    do with some of the best features of the bash shell. Then, I continue with working
    at the command prompt and get into bash interior decorating.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# Part III: Getting Up to Speed with Linux


    Shells come equipped to perform certain functions. Most of these features have
    evolved over time to assist the command-line jockey with myriad tasks. Although
    I only scratch the surface, you''re encouraged to read the man page for bash because
    it''s likely one of the more complete and read-able man pages in existence. You
    can read all about how to use man pages (the online Help system in Linux) in the
    “Help!” section, in this chapter.


    # # Playing the Shell Game


    You need a way to tell the computer what you want it to do. In Linux, one of the
    ways to communicate with the computer is something called the shell. A shell is
    not a graphical thing; it''s the sum of the commands and syntax you have available
    to you to do your work.


    The shell environment is rather dull and boring by graphical standards. When you
    start the shell, all you see is a short prompt, such as a $, followed by a blinking
    cursor awaiting your keyboard entry. (Later in this, I use a couple of methods
    for accessing the shell)


    The default shell used in Linux is the bash shell. This work environment is based
    on the original Unix shell, which is called the Bourne shell and is sh stands
    for the Bourne again shell. The bash shell comes with most Linux distributions.


    If you installed your Linux distribution to log in to a graphical desktop, such
    as GNOME or the KDE environment, you''re likely not looking at a shell prompt.
    Rather, you interact with your computer via a mouse. You can start a bash session
    from within the GUI desktop in a couple ways.


    The quickest method to activate a bash session is to:


    +   - Fedora: Right-click on your desktop and choose Open Terminal from the context
    menu that pops up.

    - Mandrake: Click the Terminal Program icon on your Panel. (It looks like a computer
    monitor).

    - SuSE: Click the Terminal Program icon on your Panel. (It looks like a computer
    monitor with a shell on it — get it? )


    Notice that not all the distributions covered here offer a shortcut on the panel
    or desktop. You can also choose commands from each program''s main menu unless
    otherwise specified:


    +   - Linuxpire: Choose Programs▸Utilities▸Console.

    - Fedora: Choose Applications▸System Tools▸Terminal.'
