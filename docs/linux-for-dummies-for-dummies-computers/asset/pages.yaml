  md: '# Chapter 2: Prepping Your Computer for Linux


    # Gathering Information about Your Machine


    Most hardware these days works just fine with Linux. Sometimes, if you have the
    latest whiz-bang video card or some other fancy new type of electronics, you may
    run into some trouble, so if you''re an early-opter sort of person, you''ll want
    to go to your distribution''s hardware compatibility list and make sure you''re
    covered. If you want to be organized and check out hardware ahead of any time,
    or if you run into problems and want to do some research to see what''s wrong,
    you can go to three basic places get information:


    +   The most specific is the list for your particular distribution:

    - Fedora: There is no official Fedora hardware list as yet, though the Fedora
    Hardware Project (http://people.ucsc.edu/maxha/) is working to correct this issue.
    In the meantime, you may use the Red Hat listings at http://hardware.redhat.com/hcl/.
    Keep in mind that this list focuses on business equipment rather than home use
    and doesn''t entirely apply to Fedora users.

    - Linspire: Check out www.linspire.com/windows_hsw_compatibility.php.

    - Mandrake: Go to www.mandrake.com/en/hardware.php3

    - SUSE: The place to start is www.suse.com/private/Database/support/online_help/.
    From here, click the Hardware Database link to search.

    - Xandros: Check out http://support.xandros.com/hcl-search.php.


    ![](img/22f96dae18f408076ba0d3209536be6c_50_0.png)


    If you''re new to computers or aren''t familiar with hardware definitions and
    details, you can find lot of information on the Internet. (One good site is www.tomshardware.com.)


    +   If your hardware isn''t listed, check the generic Linux list at www.tld.org/HOWTO/Hardware-HOWTO-.

    If you still can''t find the hardware list, point out your Web browser to www.google.com/linux
    and do a Web search on the make and model of the hardware, plus the word Linux.
    For example, you can search on Innovision DX700 Linux to find out how other people
    are faring with this particular brand and model of hardware (no endorsement of
    any hardware mentioned as examples is implied here, of course).'
