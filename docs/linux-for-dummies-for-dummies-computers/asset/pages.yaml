    you''re most likely to work with.


    | Table 14-1 Commonly Used bash Environment Variables |

    | Environment Variable | Purpose | Value |

    |---|---|---|

    | HISTSIZE | Determines the number of previously typed commands that are stored.
    | Number of commands |

    | HOME | Sets the location of your home directory. | The path to your home directory
    |

    | MAILCHECK | Sets how often the bash checks for new mail in your mailbox. If
    mail has arrived, you see a message similar to You have new mail the next time
    you do something at the command prompt. | Number of seconds to wait between checks
    |

    | PATH | Sets the directories that bash looks in, and the order to look in them
    to find a program name you type at the command prompt. | Colon-separated directories
    |

    | PS1 | Sets your command prompt. | Command and formatting characters used to
    form the prompt |'
