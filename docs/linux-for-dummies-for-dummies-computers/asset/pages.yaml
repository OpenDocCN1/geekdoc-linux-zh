  md: '# Part I: Getting Your Feet Wet


    # Giving Linux the Boot


    Let''s face it: As enjoyable as the experience of staring at a dormant device,
    is the real fun starts when you turn on the computer. As with any electronic device,
    opening the electron floodgate is the first step to fun. A computer, however,
    has much more stuff to do than your toaster oven. Rather than a simple heating
    element, your computer has to check all those gizmos that you (or the manufacturer)
    plugged into your computer''s motherboard. After the initial power-up, the computer
    performs some simple hardware tests (called the POST, or Power-Up Self Test) to
    determine whether those components are working properly.


    Checking all your hardware is just the beginning. Between the time you turn the
    computer on and the moment the glowing phosphor on your monitor prompts for a
    login name, the computer is building itself an empire. If you listen and watch
    carefully, your computer and monitor show signs of the boot process through bleeps,
    buzzes, whirring motors, clicks, messages on the monitor, and blinking lights.


    Although you have heard "Rome wasn''t built in a day," the boot process goes quickly.
    This is pretty amazing, considering that the architecture of an operating system
    makes Rome''s look like a stack of cardboard boxes and each time you power up
    your computer, it must build its whole operating system in memory. (Remember that
    an operating system is the core software that makes your computer work.) This
    process can be broken into four main steps, which I discuss in the following sections.


    # Step 1: Power-On Self-Test (POST) leads to BIOS


    The POST process really has nothing to do with the operating system. Your computer
    performs this step whether you''re running Linux or another operating system such
    Windows XP.


    Some symptoms of a failed POST include


    +   - An unusual series of long and short beeps.

    - Nothing displayed on the monitor.

    - No apparent activity other than the whirring fan on the power supply.

    - A puff of smoke or the pungent smell of burning electrical components from your
    computer case.

    - An error message, displayed on the monitor, indicating a hardware failure.


    If you encounter any of these problems, you have hardware troubles that need to
    be resolved before you proceed. Chances are, if your computer'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Chapter 5: Booting and Stopping Linux 97


    was running properly before you began your Linux installation, your computer would
    be getting through the POST just fine — POST problems don''t tend to be caused
    by installing a new operating system; they''re far more fundamental to the computer
    itself.


    The good news is that if you get to the BIOS at all, the problem may be easier
    to fix than one where the computer fails before you reach the BIOS.


    # Step 2: The BIOS passes the baton to the boot loader


    After the BIOS gives the okey-dokey with a successful POST, the BIOS locates the
    first drive in your system and reads the first sector of disk, which is often
    referred to as the MBR (Master Boot Record). On that first chunk of disk is a
    small program called boot loader. The boot loader doesn''t know much about anything,
    except how to start your operating system.


    Two boot loaders understand how to load a Linux operating system: LILO (Linux
    LOader) and GRUB (GRand Unified Boot loader). LILO has been a tried-and-true boot
    loader for as long as Linux has been a gleam in a geek''s eyeball. GRUB is a newer
    and much more sophisticated boot loader program than LILO. Many distributions
    allow you to choose your boot loader. Typically, most people just stick with the
    defaults, which are as follows for the five distributions discussed in this:


    # Distribution


    | Distribution | Default Boot Loader |

    | --- | --- |

    | Fedora Core | GRUB |

    | Linspin | LILO, with its own special routines on top of it. |

    | Mandrake | LILO |

    | SuSE | GRUB |

    | Xandros | LILO, with its own special routines on top of it |'
  merge: -1
