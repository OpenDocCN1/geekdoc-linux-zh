    You can also open the Accounts dialog by clicking Accounts from the main dialog
    box and then clicking the individual check boxes next to accounts to log into
    them by one. After you connect, you can alter your preferences in the Buddy List
    dialog box by choosing Tools>Preferences. Again, GAIM has more to it than, so
    it''s definitely worth playing around with this tool.


    # Troubleshooting your IM connections


    If you''ve been using most of these IM clients with other operating systems, after
    your Linux system has successfully connected to the IM service, if you''ve never
    used AIM or MSN, you can now set up buddy lists. Buddy lists contain the usernames
    of people you want to communicate with the instant messaging service. Your buddy
    list lets you know when "buddies" are online and available to receive an instant
    message.


    Sometimes, your Linux system is unable to connect to the IM service. When this
    problem happens, an error message pops up on your screen and indicates a failure
    to connect. You may be unable to connect to the IM service for several reasons:


    +   - You may have entered the wrong password for your IM account or chosen the
    incorrect IM account name.


    +   - Your computer may not be connected to the Internet. Try opening your Web
    browser to see whether you can get to a Web site, which tells you whether you''re
    connected to the Internet.'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# 190 Part II: Internet Now!


    +   - If you can open a Web site but can''t get IM to work, the IM system may
    be unavailable. This problem occurs at times because of maintenance of the IM
    service or an excessive amount of traffic on the Internet or on the IM service.


    +   - If you attempt to access the IM service from your computer at work, your
    company or organization may block the IM service for security or productivity
    reasons. Using IM at your work is permitted, check with your network administrator
    to see whether he can help you out.


    +   - Often, companies use firewalls between the company''s network and the Internet
    to keep out unwanted traffic on the company''s network. If the firewall is configured
    to block IM traffic, you cannot use IM across the Internet.


    # Working with Other Internet Tools


    You may want to explore a variety of other types of tools, depending on your needs.
    This section covers some pointers to get you started, so if you go to Chapter
    12 and want to add the appropriate software (or find yourself digging through
    means and wondering what the program may be called), you''re completely lost.


    +   - FTP programs: If you want to FTP, a commonly used program in the Linux world
    is GFTP. This program is available for all five distributions discussed in this
    book, although it''s only installed by default in Mandrake. The KDE equivalent
    is KBear.


    +   - IRC programs: While the IM clients support IRC these days, you may prefer
    a program that''s used only for IRC. Common programs for your purpose are X-Chat
    and KIRC.


    +   - File sharing: LimeWire is a popular if you want to use the Gnutella network.


    +   - RSS readers: Firefox has a number of RSS extensions designed for it. In
    addition, Straw is a popular RSS program.


    In general, if you''re not sure what programs to use, do a Web search on the type
    of thing you want to do (like RSS) and the word Linux. So, to find all the Linux-based
    file-sharing programs that handle BitTorrent (a popular network for distributing,
    among other things, legal copies of Linux distributions), you can search on


    ```

    file sharing bittorrent linux

    ```'
