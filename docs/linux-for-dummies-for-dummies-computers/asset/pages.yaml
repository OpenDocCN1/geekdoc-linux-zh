    Figure 7-2: Create New User dialog box in The User Manager application, in Fedora
    Core 3.


    +   4. Enter a name for your new user in the User Name field.


    In Linux, the case of the user account is important, so note the case as you type
    the information. Typically, people use all lowercase so that they don''t have
    to keep track.


    +   5. Fill in the user''s full name (as you want it to in an e-mail From Header,
    for example) or nickname in the Full Name field.


    +   6. Enter the password in both Password fields.


    # Creating good passwords


    +   Good passwords consist of the following:

    - Six or more characters

    - A combination of numbers, letters, and even punctuation marks

    - No family or pet names, friends'' names, birthdays, anniversaries, or other
    items that someone can easily guess about you

    - Uppercase and lowercase characters

    - No dictionary words'
