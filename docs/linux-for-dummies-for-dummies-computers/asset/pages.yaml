  md: '# Chapter 17: Word-Processing and More with OpenOffice


    This toolbar actually changes depending on what you''re doing. If your cursor
    is within a table, for example, then the object bar contains useful buttons for
    working with tables.


    # Ruler


    Directly below the object bar in a default OpenOffice.org setup is the ruler.
    All modern word processors offer this item, which marks out the margins and tabs,
    of your document in the measuring system of your choice. To change which system
    you want to use, right-click the ruler to open the pop-up dialog box.


    # Your document


    Oh, yeah — that big, blocked-off white space takes up most of the window. That''s
    where you work on documents! Just click there and start typing. You can also access
    a Formatting shortcut menu by right-clicking in the document section.


    OpenOffice.org Writer supports the following file formats (and more): its own
    “text” format that it uses in common with StarWriter (.SXW), Microsoft Word 95,
    6.0, 97, 2000) and XP (.DOC), Rich Text Format (.RTF), Text (.TXT), and Web Page
    (.HTML).


    # Spreadsheets with OpenOffice.org Calc


    Some people like to balance their checkbooks by hand. When I graduated from a
    university, I decided it was time to get hold of my finances, and a spreadsheet
    was the way to do it. These days, I use spreadsheets to keep track of my “time
    card” when I''m doing consulting or contract work, help me manage project teams,
    and complete other tasks. I''m sure you have your favorite uses for spreadsheets.
    The following sections take a look at OpenOffice.org Calc so that you can get
    to work.


    # Starting it up


    Start OpenOffice.org Calc in the distributions I cover in this book, do the following:


    +   - Fedora: Choose Applications➔Office➔OpenOffice.org Calc. Or you can click
    the OpenOffice.org Calc button in the lower panel.


    +   - Knoppix: From the main menu, choose Office➔OpenOffice.org➔Open Office.org.
    Calc.


    +   - Linire: From the main menu, choose Programs➔Business & Finance➔OpenOffice.org
    1.1.0➔OpenOffice Calc.'
