  md: '# Chapter 18


    # Multimedia Wow!


    **In This Chapter


    +   - Listening to music

    - Using, recording to, and ripping from CDs

    - Creating and modifying high-powered graphics with The GIMP

    - Watching movies


    > The price of freedom is responsibility, but it''s a bargain, because freedom
    is priceless.


    > — Hugh Downs


    In these days of computing in noisy Technicolor, it doesn''t feel like a computer
    unless you can make it sing and dance. This used to be a weak point for Linux,
    but these days there''s little that I can''t do on my Linux desktop machine. From
    listening to CDs to watching QuickTime movies, you can do about anything. Sometimes
    it just takes a bit of elbow grease to get things working.


    Time to take a trip on the wild side and get your Linux box doing the Macarena.


    Because legal complications surround a number of multimedia programs and their
    use in countries like the United States of America, some multimedia capabilities
    had to be removed from some Linux distributions. However, these capabilities are
    still available if you know how to look — and if you''re in a legal jurisdiction
    that allows listening to MP3s, watching DVDs, or other touchy subjects under patent
    laws and the DMCA. Chapter 12 shows you how to add many of the features discussed
    throughout this chapter.


