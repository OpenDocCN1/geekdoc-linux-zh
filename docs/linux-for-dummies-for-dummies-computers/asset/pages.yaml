  md: '# Part IV: Getting Done


    # # Checking Your Sound Card


    Before you listen to tunes, you have to make sure that your sound card is working
    properly. After the configuration issues are dealt with, you can move on to the
    fun stuff like listening to CDs and Internet radio and downloading tunes.


    Many distributions allow you to test your sound card as part of the installation
    or immediate post-installation routine. Just in case you skipped this step, the
    first thing to do here is locate the sound-testing program (if one exists) to
    see whether yours is working:


    +   - Fedora: Choose Applications-System Settings-Soundcard Detection to see whether
    the card is correctly detected and play tests.


    +   - Knoppix: From the main menu, choose KNOPPIIX:Configure-Sound Configuration
    to start the sound configuration utility.


    +   - Linspire: From the main menu, choose Settings-Advanced Settings-Information-Sound
    to see whether the card is correctly detected.


    +   - Mandrake: From the main menu, choose System:Configuration Configure Your
    Desktop:Sound:Sound System:Hardware to see whether the card is correctly detected.


    +   - SuSE: From the main menu, choose Control Center-Sound & Multimedia-Sound
    System-Hardware to see what card has been found.


    +   - Xandros: Choose Launcher-Control Center-Hardware Information- to see what
    sound card the operating system found.


    # # Looking into Your Mixer


    If the card seems to be detected properly, then a look at your mixer is the next
    important step. Sometimes cards are picked up right, and yet the mixer for some
    reason has default things muted, or other strange things are. To find the mixer:


    +   - Fedora: Choose Applications-Sound & Video-Volume Control.


    +   - Knoppix: From the main menu, choose Multimedia-KMix.


    +   - Linspire: From the main menu, choose Programs-Audio & MP3-Volume.'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Chapter 18: Multimedia Wow!


    +   - Mandrake: From the main menu, choose Multimedia-Sound KMix.

    - SuSE: From the main menu, choose Multimedia-Volume Control. You may find other
    programs useful in this menu as well.

    - Xandros: Choose Launch-Multimedia-Sound Mixer.


    Mixer terms of interest include the following:


    +   - Lock: When two sliders appear for a setting, this option just makes sure
    that they''re always level with one another.

    - Mute: No sound comes from this section.

    - PCM: Control the volume for audio files as opposed to, say, CDs.

    - Volume: Control the overall volume.


    Finally, many of the distributions have a little volume icon on the panel. If
    everything looks right but you get no sound, click it and make sure it hasn''t
    been pulled down to the bottom.


    # Investigating Troublesome Sound Issues


    If your sound isn''t working, your card may not be supported. The following strategies
    can help you to track a potential solution:


    +   - Proceed to the manufacturer''s Web site and locate the page for the specific
    card you have. This page often has a link to technical support, drivers, and downloads.
    If it does, follow these links and see whether a driver (the piece of software
    that tells your operating system how to talk each piece of hardware) is available
    for your card in Linux. If drivers are listed by kernel version — the version
    of the Linux core that you are using — see your version number and choose the
    closest driver that you can. You may also have to try the central tech support
    page on site if there is not dedicated to the hardware in question.

    - Search on www.google.com for the make and model of your card, plus the word
    Linux: For example, I might search for Yamaha YMF-744B Linux


    You may be lucky to find a nice, simple solution to your problem. Or, you may
    find one that requires you to have a degree in Geekspeak, so, see the Sites that
    I mention in Chapter 1 for where to go for that you can understand.'
