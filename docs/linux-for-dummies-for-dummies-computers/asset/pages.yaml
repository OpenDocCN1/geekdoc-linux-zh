    # Controlling and adjusting your firewall


    Even better (but as essential) as turning off unnecessary services is to make
    sure that you have a firewall in place. A firewall is like putting a bunker around
    your house. You would have openings that only fit people wanting to do certain
    kinds of things. Friends could fit through one door, family another, and package
    deliveries to another.


    In computer networks, each of the services discussed earlier always comes through
    the same door (port, in computer-world). You use firewalls to prevent anyone from
    being able to touch as much as that door, or port, unless you explicitly set it
    up so that they can do. This technique is especially important if you''re on a
    cable network (see Chapter 8), where there''s always some overactive jerk out
    using his computer to knock on every other computer on the network''s doors to
    see where it can get in.


    You probably did some basic firewall setup during installation. If you want to
    make changes, do the following:


    +   - **Fedora**: Choose Applications-System Settings-SecurityLevel (see Figure
    13-2).


    +   - **Knopix**: None. But then, what could you change on a system running from
    CD-ROM? Not much.


    +   - **Linspine**: From the main menu, choose Programs-Utilities-CNR More-Firestarter.
    This tool helps set up your firewall and is installed under the Utilities menu.'
