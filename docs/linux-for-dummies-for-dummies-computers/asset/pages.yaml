    # Working with Variables


    Variables in the bash shell are words or strings of text that computers use to
    represent a piece of data. An example of using a variable is setting the variable
    fruit to contain the apple. A number of standard variables contain information
    about your account and environment settings.


    # Variables versus environment variables


    The first thing I need to make clear is that the bash shell has two classes of
    variables:


    +   - Variables: A variable can be referenced in a program or shell session, but''s
    visible and available to only that session or program.

    - Environment variables: An environment variable can also be referenced by the
    shell or program. However, it has the added behavior of having its value copied
    to to any other program or shell that is created from its environment.'
