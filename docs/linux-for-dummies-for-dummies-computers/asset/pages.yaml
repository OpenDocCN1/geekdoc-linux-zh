  md: '# Chapter 8: Connecting to the Internet


    You can find out your ISP how fast your DSL connection could be, because it varies.
    For an overview of DSL and Linux, visit the following Web page:


    ```

    www.tldp.org/HOWTO/DSL-HOWTO/

    ```


    +   **Satellite modems:** Those who live in particularly low or-infrastructure
    areas might go the route of satellite modems (http://tldp.org/HOWTO/Sat-HOWTO.html).
    You can consider this service equivalent in many ways to cable, in that you get
    it typically through the providers that give you your satellite signals from.
    Satellite has some drawbacks in if your satellite television service is unreliable,
    your Internet service suffers the same fate. The upload and download speeds can
    vary dramatically.


    +   **Dial-up modems:** The dial up is widely used in areas where broadband is
    either available or not affordable. It translates the digital signal from the
    computer into an analog signal required for transmission from the wall to the
    phone company. Because the modem utilizes voice service you don''t need any special
    setup beyond subscribing to an ISP. However you can use the same line for both
    dialup and a conversation at the same time. See the sidebar Beware of devices
    posing as modems for additional concerns if you''re going the dial-up route.


    +   **Wireless:** The realm of wireless networking is Linux today may give you
    the trouble, depending on what kind of wireless you are using. Four major types
    of wireless exist, and they''re often referred to as a group as WiFi:802.11a,
    802.11b, and 802.11g, and Bluetooth, which are also referred to just A, B, and
    G. A and B are the best supported, both better than G, but G is the one most people
    should aim for because the security. A and B are also the best supported in Linux
    so again, they''ve been around the longest. G''s security also adds levels of
    complexity that require more cooperation from the manufacturers of the cards.
    Many wireless cards are too, in fact, capable of doing more than one of these
    types.


    The best advice I can give is here to do a Web search on the make and model of
    your wireless card (or the one you''re thinking of), plus the word Linux, and
    see what you find— and, of course, you can check the hardware compatibility for
    the distributions as well. Because this area is where technology is quickly advancing,
    always check the dates on the resources you find and make sure they''re recent.
    Even six months old can mean you''re getting out-of-date information. Some useful
    links (some are more advanced than others) for this topic the following:


    +   * LAN resources for Linux: www.hpl.com/personal/Jean_Tourriles/Linux/


    +   * A method for using Windows wireless drivers in Linux: www.linuxant.com/driverloader


    +   * Network Topology Guide: www.homenethelp.com/network'
