    # Taking Advantage of Instant Messaging


    Instant messaging between people is like using a telephone — except that you type
    your conversation rather than speak it. In addition, you can simultaneously hold
    instant messaging conversations without the need for additional connections to
    the Internet. America Online (AOL) provides one popular instant messaging service,
    named AOL Instant Messenger, or AIM. Others are ICQ and MSN. A variety of computer
    operating systems, including Linux, support these various services (and, in fact,
    GAIM runs more than just Linux).


    The distributions covered in this book use the following instant messaging programs
    by default:


    +   - Fedora: Gaim (http://gaim.sourceforge.net/)

    - Knoppix: Gaim

    - Linspire: Gaim

    - Mandrake: Kopete (http://kopete.kde.org/)

    - SuSE: Kopete

    - Xandros: Kopete (http://kopete.kde.org/)'
  merge: -1
