    (you must know the details of your hardware before proceeding); testing the installation
    media before proceeding (good option to use if you downloaded the Fedora distribution
    from Red Hat''s Project Web site and burned the software to CDs or a DVD); enabling
    rescue mode (this is also not included in the function of the F5 key); using a
    driver disk, CD, or DVD turn off frame the Linux installation media; and updating
    your Linux installation.


    The F3 function key allows you to set the video options. If you have experienced
    problems installing Fedora 3 with the graphical interface, you may want to try
    a lower resolution. Linux lowers at the boot: prompt to use a lower graphical
    resolution to install Linux. The linux lowres nofb command allows you to turn
    off problems with some video cards.


    The F4 key, labeled Kernel, enables you to enter parameters when you install Linux.
    For example, some help files tell you to do something like "turn off autoprobe
    for your PCI hardware ware." Here is where you find out what you need to.


    The F5 key has two different functions, depending on whether you''re using the
