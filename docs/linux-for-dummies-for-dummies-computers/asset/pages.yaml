- img_proc: true
  md: '# 310 Part IV: Getting Things Done


    Of course, if the file contains more than a screen''s worth of information, cat
    spews it all out at one time like a big hairball, and all but the last screen
    of text scrolls off it. It''s a good thing that you have some other choices. The
    one you''re likely to choose is less, which displays the contents of a full screen
    at a time. Then use the spacebar to continue to the next screen. You can also
    use the arrow keys to move up and down one at a time, if you want.


    An alternative to less is more. The main difference between the two is that with
    more, you can move only forward through the file and see only a screen''s worth
    of information at a time. You can''t back up.


    To use less or more, the format is similar to the format used with the text command:
    nano filename or more filename. When you finish the document, press Q to exit.


    # Editing Text Files with nano


    If you aren''t using (or can''t use) the GUI, you have numerous text editors to
    you. The most powerful of these are vi and emacs, which you''ll hear many people
    go about. However, these programs require a learning curve. For beginners who
    want to edit the dang and move on, I recommend nano and pico. These two editors
    are very similar, and one or the other is typically included with most Linux distribution
    (but unfortunately, not all). The "friendly" text editors included with the distributions
    are


    +   - Fedora: nano

    - Knoppix: None.

    - Linsp: None; see Chapter 12 add one

    - Mandrake: None; see Chapter 12 add one (jed and joe are both available)

    - SuSE: pico

    - Xandros: editor, which has a menu of function keys at the bottom of this screen


    To open a file in nano, type nano filename, nano file1. This action opens the
    file in the nano editor, as shown in Figure 16-1.


    You can then edit or type in that file as as much as you need to.'
