    maybe you''re in /home/jane/documents/invoices and want to go back to /home/jane
    without opening and closing multiple folders). To do so, look at the very bottom
    of the folder window to find the name of the subdirectory you''re in (such as
    invoices). Click that name, and you open a list that has all'
