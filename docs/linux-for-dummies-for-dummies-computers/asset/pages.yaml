  md: '# Chapter 9


    # Using the Internet


    In This Chapter


    +   - Browsing the Web

    - Reading newsgroups

    - Checking and sending e-mail

    - Sending instant messages


    > Give a man a fish and you feed him for a day; teach him to use the Net, and
    he won''t bother you for weeks.

    — Anonymous


    The Internet is a vast network of computers that spans the globe. Many different
    types of computers and operating systems work together to allow you access to
    information across the Internet. Linux, with its related Unix operating system
    — has long supported and worked with the Internet. Practically all the different
    services available on the Internet are available from your Linux desktop.


    When you install Linux (see Chapters 3 and 4), one or more Web browsers, mail
    programs, and instant messaging tools are placed upon your new system. In this
    chapter, I introduce you to tools you can use to access different services on
    the Internet, such as accessing Web sites, using e-mail, investigating newsgroups,
    and utilizing FTP — assuming that your Internet connection is configured (see
    Chapter 8).


    # Meet the Popular Browsers


    Many people attribute the explosive growth of the Internet to the graphical Web
    browser. The Internet has been around for much longer than the invention of the
    browser. It''s just that most of the work done on the Internet was in old text,
    which held little attraction for those people who like pretty pictures.'
