    # # Aargh! I Forgot My Root Password! What Do I Do?


    Fear not. You have a way around this problem! You need to boot into single user
    mode, which you can accomplish by rebooting the machine and doing the following:


    +   - Fedora: If you see a blue screen with the words “Press any key to enter
    the menu,” press a key. At the GRUB boot screen, press E takes you to a configuration
    file. Use the arrow keys to go to the line with kernel, and press E to edit that
    line. At the end of the line, add the word single, press Enter to put the change
    into place, and press B to boot the machine.


    +   - Knopix: You don''t need to because you can just reboot the machine and start
    over.


    +   - Linsphere and SuSE: See Chapter 21 for how to recover your root password.
    In single user/failsafe mode, you will need the root password for these distributions.


    +   - Mandrake: Reboot the computer and at the boot screen, select Configure (Expert).
    When you reach the Root Password For Maintenance prompt, enter your password.


    +   - Xandros: At the Xandros boot screen, select Configure (Expert). When you
    reach the Root Password For Maintenance prompt, enter your password.


    No matter what distribution you''re using, now is your chance to change the root
    password to one you can remember. Type passwd and then enter the new password
    twice as directed. When you''re done, type exit and then boot the machine normally.'
