  md: '# Chapter 10


    # # Manipulating Files and Directories


    +   **In This Chapter**

    * Encountering Linux file types

    * Managing Linux file permissions

    * Maneuvering through the file system contents

    * Working with file system contents

    * Referring to multiple files at once using wildcards


    > There is no need to do any homework at all. After the first four years, the
    dirt doesn''t get any worse. — Quentin Crisp


    here''s no avoiding it. At some point, you have to work with the files and directories
    in your system. Frankly, after you get familiar with the rules and commands, you
    feel more comfortable (even if you find yourself being reminded from time to time
    of working in good old MS-DOS). Because many people find that working at the command
    line is easier when dealing with files, in this chapter I cover both the typed
    commands and the graphical tools you have at your disposal.


    # Working with Files in the GUI


    People who prefer to stay graphical like to work with the GUI file managers offered
    in Linux instead of having to access a command prompt to work with files. A file
    manager is a program, such as Windows Explorer, that enables you'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# 194 Part III: Getting Up to Speed with Linux


    to dig through and manipulate your files and directories with your mouse and sometimes
    just a bit of typing. In this section, I take you on a tour of the file managers
    that, by default, come with popular Linux distributions.


    # Sailor’ with Nautilus


    In the GNOME desktop environment (so in Fedora Core if you’re using the distribution
    defaults), the file manager is Nautilus. To find this program, click the Home
    icon on your desktop. Figure 10-1 shows an example of what you can see with Nautilus
    open in an example directory.


    ![](img/22f96dae18f408076ba0d3209536be6c_211_0.png)


    If you want to play with a more sophisticated version of Nautilus, select Applications⬭
    Browser.


    # Finding your way around


    Moving through the file system in Nautilus involves a couple of different skills.
    In the first place, you need to know where you want to begin. The factor decision
    isn’t as difficult as it sounds, however. In the Places menu, you find the following
    options:


    +   - Your home directory, which is where all (or most of) your files and documents
    go.

    - Computer: Your hard drives, floppy disks, CD and DVD-ROM drives, and other permanent
    and removable storage devices.

    - Templates: Your document templates. Copy or move a document into this section
    (I tell you how in the section “Copying and moving files,” later in this chapter).
    When you right-click on your desktop and choose the items in your Templates folder
    as a basis for the document that you want to make.

    - Trash: The contents of your trash bin. I address how to empty it in the section
    “Taking out the trash,” later in this chapter.

    - CD Creator: Your CD waiting room. If you want to make a CD that contains a bunch
    of files (as opposed to creating an ISO image), move these files to this location.
    You can find out about creating CDs in Chapter 18, because many people create
    CDs in the context of multimedia.


    If you choose one of the preceding commands, a separate window opens, leaving
    the window you were already working in as well. You can close the original window
    if you want by choosing File⬭CloseClose or clicking the X in the window’s upper
    right corner.'
