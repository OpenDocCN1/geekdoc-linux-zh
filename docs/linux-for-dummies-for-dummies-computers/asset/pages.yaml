    # Laying pipes


    Another bash shell feature enables you to connect commands so that the output
    of one becomes the input for the next one. This feature is referred to as a pipe.
    Suppose that you want to look over the details of files in the /etc directory
    in long-listing format. If you do so, massive listing appears, and much of the
    information scrolls right past you. Although you can back up a pipe by pressing
    Shift+PageUp, you may not be able to see everything.


    To see all the information, you can do one of things:


    +   * Send the data to a file with redirection by piping something like ls -la
    /etc > ~etcclisting and review the contents of ~etcclisting with your favorite
    editor.

    * Pipe the output to the more command(see Chapter 16).


    To pipe the output to more, type ls -la directory_path | more, where directory_path
    is the directory for which you want to list the contents. The | symbol (which
    on the keyboard looks like two vertical bars stacked on top of each other rather
    than just one solid line) tells bash that you want to use a pipe.


    # Help!


    The man page system is the electronic manual for Linux (man is short for manual),
    designed to provide users with a convenient reference to all the detailed command
    information. This information includes command prompt options, file formats, and
    program function usage.'
