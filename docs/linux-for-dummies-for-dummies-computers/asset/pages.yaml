  md: '# Files and file system


    No matter which operating system you''re using, it''s hard to do anything without
    being able to find your way through and work with the file system. The following
    utilities help you find your way:


    # File organization


    Boxing, packing, sorting, shipping — I''m always shuffling files around my system.
    File organization commands provide tools for moving files and file units around,
    as shown in Table A-4.


    | Command | Purpose |

    | cd | Changes directories. |

    | cp | Copies a file. |

    | df | Shows partitions and how much space they have. |

    | du | Shows how much disk is being used in the current directory and below. |

    | ln | Creates a shortcut. |

    | ls | Lists the contents of a directory or information about a file. |

    | mkdir | Creates a directory. |

    | mv | Moves or renames a file. |

    | pwd | Shows the path for the directory you''re currently in. |

    | rm | Deletes a file. |

    | rmdir | Deletes an empty directory. |


    # File attributes


    Files are like candy bars. The wrappers provide information about the ingredients,
    size, and package date — all descriptive of the tasty nugget inside. (Perhaps
    the wrapper is even childish.) Files keep all this wrapper information in an *inode*.
    Along with the capability to change file information, these commands can return
    data about the content of the file, as shown in Table A-5.'
  merge: -1
  pgno: 415
- img_proc: true
  md: '# # Appendix A: Common Linux Commands 399


    | Table A-5 File Attributes Commands |

    | Command | Purpose |

    | chgrp | Changes the group associated with a file. |

    | chmod | Changes a file''s permissions. |

    | chown | Changes who owns a file. |

    | file | Shows what type of file you''re dealing with. |

    | stat | Shows some statistics about the file. |

    | touch | Creates an empty file of this name. |

    | wc | Shows how many words, lines, and so on in this file. |


    **File locators**nWhere, oh can my file be? These commands, shown in Table A-6,
    help you locate files in Linux''s monster tree-structure file system:


    | Table A-6 File Locators Commands |

    | Command | Purpose |

    | find | Hard-core filesystem search tool. |

    | locate | Lighter weight filesystem search tool. |

    | which | Tells you the path for the program that would be run if you typed this
    command. |


    **File viewers**nFile browsing is a favorite pastime of many system user. These
    tools provide a variety of utilities for viewing the contents of readable files
    of all sizes. Unlike a full-screen editor, you cannot damage the contents of a
    file with these commands, shown in Table A-7, because they''re read-only tools:


    | Table A-7 File Viewers |

    | Command | Purpose |

    | cat | Dumps the contents of the file to your screen. |

    | head | Shows the first ten lines of a file. |


    (continued)'
