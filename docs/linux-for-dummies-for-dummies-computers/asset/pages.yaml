  md: '# Chapter 21: Ten Cool Uses for Knoppix 387


    are taken care of. After you''re installed and logged into Knoppix using one of
    your accounts, connect to the Internet. Then:


    +   1. **Choose System:: KPackage (Package Manager).**

    The KPackage package management opens.

    2. **In KPackage, choose Special:: Apt: Debian::: Update.**

    A separate KPackage window appears.

    3. **When asked for your root password, type it and Enter.**

    Within the secondary window, you can watch the process. Once you see the text
    RESULT=# (where # stands for any number), the update is complete. You''ll also
    see the word Done bit above it.

    4. **Click Cancel to close the window.**

    It takes a minute or so for KPackage to process the package lists it just downloaded.

    5. **In KPackage, choose Special:: Apt: Debian::: Upgrade.**

    The Update selection just grabbed the latest list of available packages. Choosing
    Upgrade now grabs all the updated software and installs it. A secondary window
    appears, and you can watch what''s happening in first. First, KPackage figures
    out what software needs to update.


    +   6. **When asked whether you want to continue, type Y and Enter.**

    Now, KPackage actively grabs the updates to install them. This process can take
    a while (an hour or longer) the first time you do it, depending on how long your
    version of Knoppix has been available. You can tell how much longer it has to
    go by watching the percentage marker in the bottom left of the window. Once the
    download is complete, KPackage begins configuring the packages for installation.


    +   7. **If you''re asked questions about how to configure packages, as best you
    can and press Enter after your answer.**

    Unfortunately, this process can feel a bit cryptic. You can go back and change
    things if you have to, later. A default is offered, so just pressing Enter if
    you''re not sure what to do. After you''ve answered all the questions, the updating
    begins. The longer your down-load time, the longer your update will take, so again
    be prepared to wait. You also may be asked more configuration questions along
    the way, make sure to at least glance at the screen from time to time.

    The secondary window closes on its own once the update is complete. You can now
    close KPackage.'
