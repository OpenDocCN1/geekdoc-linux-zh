    # Printing


    Unless you live in a paperless environment, you most likely need to print something
    (such as a letter, a picture from your digital camera, or an invoice) from time
    to time. Therefore, you need to set up your Linux system to print. It can be helpful
    to know, before you continue, the make and model of your printer and how it''s
    connected to your computer:


    +   - Is a local printer, meaning that it''s connected directly to your computer
    through a parallel, serial, or USB port?


    +   - Is a network printer, meaning that it doesn''t have to be connected to a
    computer and sits on the network as its own machine?


    +   - Is a remote printer but not a network printer, meaning that it''s connected
    to another computer on your network? If so, is it a Windows, Linux, or OS X computer?


    You can find printer configuration tool by:


    +   - Fedora: Choose Applications:System Settings:Printing to open the Printer
    Configuration tool.


    +   - Knopix: From the main menu, choose KNOPPIX:Configure:Configure Printer(s)
    to open the Configuration - Printers tool.


    +   - Linscape: Double-click the Printers icon to open the KDE Control Module
    and then click the Add Printer/Class button (the icon on the left in the top row)
    to open the Add Printer Wizard.


    +   - Mandrake: From the main menu, choose System:Configuration:Configure Your
    Computer items to open the Mandrake Control Center. Within this dialog box, click
    Hardware and then Mandrake to start Printerderf.


    +   - SuSE: From the main menu, choose System:YaST to open the YaST tool discussed
    later in this chapter, in the section "SuSE tools." From here, select Hardware
    on the left, and then Printer on the right, to open the Printer Configuration
    tool.'
