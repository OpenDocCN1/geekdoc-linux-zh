  md: '# Chapter 3


    # Installing Fedora Core


    In This Chapter


    +   - Considering some last issues before installation

    - Creating a Fedora installer boot disk

    - Installing Fedora as a personal desktop

    - Booting Fedora for the first time


    > Do, or do not. There is no "try."

    — Yoda, The Empire Strikes Back


    No longer are arcane glyphs and complex sorcerer’s spells required to install
    Linux. The graphical installation is now quite easy to perform and will be familiar
    to users coming from another graphical operating system, such as Microsoft Windows.
    This chapter provides the details.


    If you''re installing Linux, Mandrake, SuSE or Xandros, proceed to Chapter 4 —
    do the same if you want to use Knopix without installing any-thing. If you''re
    not using Fedora, however, you can still find out plenty in this chapter, because
    all Linux distributions share common elements.


    # Things to Consider Before You Begin Installation


    You can install Fedora Core by


    +   - Booting with the DVD-ROM included in this book, and when you see the boot
    menu, typing linux and pressing Enter. If, for some reason, you don’t see the
    boot menu, see Appendix B.

    - Booting with the Fedora Core installation CD, which is CD number 1 if you ordered
    the CD set using the included coupons at the back of this'
