    # # The Installer Tested My Graphics Fine, but My GUI Won’t Start”


    If your Linux installation program showed you a GUI test saying that you were
    ready to proceed with the rest of the installation, you probably expected that
    the GUI would start with no problem. Unfortunately, that doesn’t always happen.


    Each distribution has its own set of graphics configuration tools. If you boot
    your machine for the first time and see error messages when you’re trying to enter
    the GUI automatically or when you type startx to start the GUI manual, use the
    following tools to fix the problem:


    +   - In Fedora Core, use system-config-display.

    - In Knoppix, you don''t install. Use the options when you boot it in order to
    tell it specifics about your display.

    - In Linspire, use xf86config.

    - In Mandrake, use drakconf and select the Display option.

    - In SuSE, use sax2.

    - In Xandros, use xf86config.

    - Your last resort is xf86config. This fully text-based tool should be available
    with most distributions. It may be called xf86config4.


