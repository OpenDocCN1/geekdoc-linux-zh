    # # Removable hard drives


    One way to handle multiple operating systems is the removable rack hard drive.
    The installation places a special carriage into your computer''s hard drive bays.
    This setup can be installed in most computers by an experienced world or a qualified
    technician.


    After this component is installed, you can place individual hard drives into the
    carriage, pulling them in and out as you might with a CD-ROM—although you wouldn''t
    want to just yank one out in the middle of doing something on your machine! Using
    a removable drive setup allows you to separate Windows and Linux drives. When
    you''re using Windows and switch to Linux, you shut down Windows and pull the
    drive out. Then you replace it with the Linux drive and boot as the Linux drive
    were always there.


    second hard drive in the machine, a removable hard drive is a great alternative.
    You''ll need to make sure that your existing hard drive can fit in the rack, as
    well as the new one, and it''s wise to buy more than one chassis (used to slide
    the drive into the rack) so that you can just leave your drives in the chassis
    when they''re not in the machine.


    For more information, see PC Hardware in a Nutshell, by Robert Bruce Thompson
    and Barbara Stratton Thompson, from O''Reilly & Associates.


    If you need to configure hardware, I strongly recommend that you seek assistance
    or have a technician install an additional hard drive or removable rack setup
    for. Improper handling of components can damage your computer. In addition, you
    must keep safety in mind when working with electrical components.


    If you''re nervous about managing operating systems and don''t have room for a


    ![](img/22f96dae18f408076ba0d3209536be6c_38_0.png)


    When you install Linux on a system that has Windows already installed, you can
    run only one operating system at a time. In other words, if you''re using Windows
    and want to run Linux, you need to shut down Windows, allow the computer to reboot,
    and then start Linux. However, with additional software, you can run Linux on
    a Windows system at the same time Windows is running. You can also run Windows
    software within Linux itself! See Chapter 19 for more information.


    # # Partitioning from scratch for a dual boot


    If you plan to take a fresh hard drive and install both Windows and Linux on,
    be sure to install Linux first. While you''re going through the Windows installation,
    you will be asked to partition your drives. Your hard drive can have three primary
    partitions and one extended partition. Inside that extended partition, you can
    have up to 12 logical partitions.


    No matter what type of partition you use for Linux, make sure to leave at least
    3GB open for it. Typically, you''ll need even more, because you may like to download
    big files like media stuff.'
