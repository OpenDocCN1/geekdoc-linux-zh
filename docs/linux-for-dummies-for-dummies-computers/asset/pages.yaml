  md: '# Chapter 13: A Secure Linux Box Is a Happy Linux Box


    # Connecting to your Linux box from another Linux box with SSH


    Yes, you can connect from another Linux box, too. This task is a bit less com-plicated.
    Open a terminal window (see Chapter 14) and follow these steps:


    +   1. Type ssh username@ipaddress to open the connection.


    For example, type ssh dee@192.168.1.6. After you do this step, the following text
    appears:


    ```

    The authenticity of host ''192.168.1.6 (192.168.1.6)

    can''t be established.

    RSA key fingerprint is

    ed:68:0f:e3:78:56:c9:d3:6e:25:86:77:a7:66.

    Are you sure you want to continue connecting (yes/no)?

    ```


    +   2. Type yes and Enter.


    You now see lines:


    ```

    Warning: Permanently added ''192.168.1.6'' (RSA) to the

    list of known hosts.

    deee@192.168.1.6''s password:

    ```


    +   3. Enter your login password and press Enter. Now you''re in!


    Close the connection by logging out of the account (type logout).


    # Connecting to your Linux box from a

    Macintosh running OS X with SSH


    The process from a Macintosh is similar to that under Linux. Go to

    Applications:Utilities:Terminal.app, which opens a command line window

    for you.


    ```

    ssh IPAddress

    ```


    to access the user account on the remote machine, or type


    ```

    ssh login@IPAddress

    ```


    if you want to access the account login instead of the same account you

    using on the Mac.


    # Software holes


    When someone is already in your system — whether or they''re allowed

    to be there — you have additional security concerns to keep in mind. One of

    these involves what software you have on the machine. Believe it or not, each

    piece of software is a potential security hole. If someone can get a program to

    crash just the right way, they can get greater access to your system than

    they should. That''s a very bad thing!'
