  md: '# Chapter 1: Getting Acquainted with Linux


    anyone but the copyright holder. When software is licensed under the GPL, recipients
    are bound by copyright law to respect the freedom of anyone else to use the software
    in any way they choose. Software licensed with the GPL is also known as copyleft
    software. Another way to remember the GPL is through its ultimate: Guaranteed
    Public for Life.


    # Who''s in charge of Linux anyway?


    As an open source project evolves, various people emerge as leaders. This leader
    is often known as the project''s benevolent dictator. A person who becomes benevolent
    dictator has probably spent more time than anyone else on a particular problem
    and often has some unique insight. Normally, the words democratic and dictator
    are never paired in the same sentence. but the open source model is a very democratic
    process that endorses the freedom of a benevolent dictator


    Linus Torvalds is still considered the benevolent dictator of the Linux kernel
    (the operating system''s core). He determines what features are added to the kernel
    and what features aren''t. The community trusts his vision and discretion. In
    the event that he loses interest in the project, or the community decides that
    he has gone senile, a new leader will emerge amongst the very competent people
    working with him.


    # Einstein was a volunteer


    Someone who is a volunteer or donates their time to a project isn''t necessarily
    providing a second-rate effort or working on weekends and holidays. In fact, any
    human resource expert will tell you people who choose to do a job of their free
    will will produce the highest quality products.


    The volunteers who contribute to open source projects are often leaders in their
    field who depend on community collaboration to get useful work done. The open
    source concept is no stranger to the scientific community. The impartial peer-review
    process that open source projects foster is critical in validating something as
    technically correct.


    Those who paint the open source community as copyright violators and thieves often
    misunderstand or outrage these vital issues. Source programmers are very proud
    of their work and are also very concerned about their own copyrights, not wanting
    their work to be stolen by others — here licenses such as the GPL. This concern
    creates an atmosphere with the greatest respect for copyright. Those who claim
    they are just being ''open source'' when they steal other people''s hard work
