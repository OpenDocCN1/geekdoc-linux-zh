  md: '# Installing New Software


    In many cases, installing new software isn''t much harder than updating; it just
    depends on the distribution and what tools have been incorporated for this process.
    My focus in this section is on using these tools. Later, in the section "Finding
    More New Software" I address how to add programs that aren''t included in these
    tools. With each distribution''s section, I also tell you how to add many of the
    programs discussed throughout this book.


    Again, Knopix is not included here, so you can''t permanently install new software
    onto a CD!


    # Eating it up with Fedora''s yum


    Fedora doesn''t offer a graphical software installation program, but you can download
    a very cool one from the FedoraNEWS site called GYUM. By down-load and install
    this program:


    +   1. Point your Web browser to a link to fedoranews.org/tchung/gyum/.

    2. Look through the page for a link to this software for "FC3" (Fedora Core 3).

    3. Click through the link. You see something similar to:


    | Directory | |

    | gyum-1.0.fc2.noarch.rpm | 30-Jul-2004 14:49 | 25K |

    | gyum-1.0.fc2.src.rpm | 30-Jul-2004 14:49 | 23K |

    | gyum-1.0.tar.gz | 30-Jul-2004 14:49 | 20K |

    | gyum.spec | 30-Jul-2004 14:49 | 2.8K |


    +   4. Download the file with the word "noarch" in it.


    +   5. Double-click the Desktop icon and then the Downloads icon.


    +   7. Double-click the RPM to install it. If you have this program installed,
    you can add some software sources and discover how to use Yum!


    ![](img/22f96dae18f408076ba0d3209536be6c_264_0.png)


    If, for whatever reason, you prefer to add software from the command line rather
    than gyum (maybe you just don''t like the program), you can use the yum directly
    in text. See the www.fedoranews.org site for helpful articles and tutorials to
    get you through this process.


