  md: '# 234 Part III: Getting Up to Speed with Linux


    WinZip can open tarballs with no problem on a Windows computer.


    Fortately, all you need to know how to double-click a file in order to access
    the many types listed in Table 12-1. Once you double-click the file, your File
    Manager shows you what''s inside.


    While Table 12-1 mentions operating systems, ''it doesn''t contain hard and fast
    rules. People tend to use whatever kind of programs they''re comfortable with
    no matter operating system they''re on.


    | Table 12-1 | Potential Formats for Downloaded Files |

    | Extension | Meaning | Program(s) Involved |

    | .bz | Older form of .bz2. | bzip, bunzip |

    | .bz2 | Extensive Linux and Unix compressed file. | bzip2, bunzip2 |

    | .deb | Not a file to "open"; see theInstalling New Software" section, later
    in this chapter. | apt |

    | .gz | Typical compressed for Linux and Unix. | gzip, gunzip |

    | .iso | A CD-ROM or DVD-ROM "image", which is a single file that contains a CD
    or DVD''s entire contents. You have to tell your CD or DVD burner software that
    this is an image so it knows not to just place a copy of the file onto the media.
    | See Chapter 18. |

    | .rpm | Not a file to "open";see theInstalling New Software" section, later in
    this chapter. | rpm |

    | .tar | A bunch of files bundled together. | tar |

    | .tar.bz | A tarball, which in this case is a .tar file inside a .bz2 file. |
    tar, bzip, bunzip |

    | .tar.gz | A traditional tarball, which is a .tar file inside a .gz file. | tar,
    gzip, gzip |

    | .tgz | A traditional tarball, which is a .tar file inside a .gz file. | tar,
    gzip, gzip |

    | .Z | Old-style Unix compressed file. | compress, uncompress |

    | .zip | Windows ZIP file. | zip, gunzip |


    WinZip (www.winzip.com) can handle .gz, .tgz, and .targz files (along with the.bz
    versions) for Windows users.'
