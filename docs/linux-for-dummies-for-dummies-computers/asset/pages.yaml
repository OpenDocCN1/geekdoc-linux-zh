- img_proc: true
  md: '# Chapter 9: Using the Internet


    Because Gaim is the default in Fedora, that''s what I cover in detail.


    # Using the Gaim Instant Messenger


    You launch Gaim with the following menu selections:


    +   - Fedora: Choose Applications*Internet*IM (GAIM Internet Messenger).

    - Knoppix: From the main menu, choose Internet*Gaim Instant Messenger.

    - Linspire: From the main menu, choose Programs*Internet*Instant Messenger.


