  md: '# 212 Part III: Getting Up to Speed with Linux


    The three triads are read as follows:


    +   - The first triad consists of the second, third, and fourth characters in
    the long format file listing. This triad sets the permissions for the user, or
    owner, of the file. (Owners are discussed in the "Beware of owners" section, later
    in this chapter.)

    - The second triad consists of the fifth, sixth, and seventh characters in the
    long format file listing. This triad sets the permissions for the group that is
    assigned to the file. (Groups are discussed in the "Hanging out in groups" section,
    later in this chapter.)

    - The third triad consists of the eighth, ninth, and tenth characters in the long
    format file listing. This triad sets the permissions for other, or everyone who
    isn''t the file''s owner or a member of the owning group.


    Although each triad is often different from the others, each is made up in the
    same way. Focus specifically on how to read one triad before looking at the set
    them together. Each triad includes three characters:


    +   - The first character is either an r or a dash. The r stands for read permission.
    If r is set, the triad allows the entity stands for (user, group, or other) to
    view the directory or file''s contents.

    - The second character is either w or a dash. The w stands for write permission.
    If w is set, the triad allows the entity stands for to add or edit items to, in
    this directory or file.

    - The third character is either an x or a dash. The x stands for execute permission.
    If x is set, the triad allows the entity stands for to run programs contained
    in that directory or run the particular program


    ![](img/22f96dae18f408076ba0d3209536be6c_229_0.png)


    In all cases, if the dash sits in place of _, w, or x, the triad does not allow
    the entity to read, write, or execute permission.


    The following sections describe owners and groups in detail.


