    # Surfing the Web


    Mozilla is viewing your window into the Wonderful Wide Web. Mozilla''s primary
    purpose is to fetch Web pages on your command, download all your graphics and
    related files into your computer''s memory, and, finally, render the page for
    your interactive viewing pleasure.


    If you''re using Internet Explorer or Netscape, Mozilla should be a snap. It has
    all the familiar navigation tools, such as an address bar; Back, Forward, Reload,
    and Stop buttons; and a feature that stores links to your favorite Web sites (bookmarks).


    Mozilla, like Netscape, also has a Sidebar feature — press F9 to hide it (see
    Figure 9-3) — which you can use to find sites related to the one you''re visiting,
    search for a word or phrase on the Internet, access-marked Web pages, or access
    a Web page you recently visited (through the History option).


    ![](img/22f96dae18f408076ba0d3209536be6c_190_0.png)


    Figure 9-3: Mozilla with the Sidebar, open, in Fedora Core 3.


