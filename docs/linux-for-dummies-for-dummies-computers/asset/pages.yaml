    # Listening to Downloaded Music


    Downloading music from the Internet is a fun activity. A lot of people like to
    pretend that it''s both legal and ethical, when in fact, it''s often theft, depending
    on where you grabbed the music. I leave that ethical issue between you and your
    belief system of choice, but because my ethics say that I''m theft, to focus on
    showing you music that you''re welcome to download — legally and ethically! Take
    a look at strategies for finding such music, along with how to listen to it.


    One place to find such material is on a band''s Web site. Today realizing that
    offering free downloads of their work is a great PR move — if people use the sample
    songs, they''re more likely to go out and buy the album. For example, I use one
    of my favorite bands, Evanescence (www.evanescence.com).


    Evanescence, like many bands, has its page done mostly with Macromedia''s Flash
    tool. (See Chapter 12 for how to add this functionality to your distribution.)
    To listen to music files in general:


