  md: '# Chapter 5: Booting and Stopping Linux


    If you''re plagued with brief power outages or spikes that cause your computer
    to reboot, look into getting a UPS (Uninterruptable Power Supply) for your computer.
    These heavy recharging batteries can not only protect your computer from damage
    — read the box to see what features a particular UPS offers — but also provide
    an extra five minutes or more of power to give you a chance to close your files
    and shut down a machine when the power goes out. Better yet, for those really
    brief spikes, the only inconvenience you''ll have to deal with if you have a UPS
    in place is listening to it beeps. Your computer won''t be affected by the spike
    at all!


    ![](img/22f96dae18f408076ba0d3209536be6c_120_0.png)


    # Removing Linux from Your System


    Although I''d hate to see you go, I''d also hate to see you get trapped in Linux
    if you don''t want to use it! How to easily get rid of Linux depends on what you
    want to do:


    +   - If you want to replace Linux with Windows, just install Windows on the machine.
    It will overwrite all of Linux, including the boot menu.

    - If you want to remove Linux from a dual boot setup, just boot into your Windows
    option, access a command prompt, and type fdisk /mbr. This action removes the
    Linux boot loader. It doesn''t erase Linux, but you can format the Linux drive(s)
    or partition(s) for Windows.


    ![](img/22f96dae18f408076ba0d3209536be6c_120_1.png)


    Windows XP and Xandros users have a special command they can use to remove this
    distribution. Boot your machine using your XP CD-ROM into the Recovery Console.
    Change to the Windows directory and then type fixmbr.'
