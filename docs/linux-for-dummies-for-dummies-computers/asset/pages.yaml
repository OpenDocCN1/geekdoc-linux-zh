  md: '# # Chapter 13


    # # A Secure Linux Box Is A Happy Linux Box


    +   **In This Chapter**

    * Implementing strong passwords

    * Keeping your system up to date

    * Pluggingging security holes

    * Using the System Logs Viewer

    * Securing your system by using best practices


    > I am Inspector Clouseau, and I am on official police business. — Inspector Clouseau


    You don''t leave the front door of your house open when you go to work, how about
    leaving it shut and locked with a few, big windows open? The problem is that many
    people do this every day with their computers, and don''t even know it! In this
    chapter, I take a look at where your open doors and windows are and what you can
    do to secure them.


    Every user''s actions affect your overall system security. If your family members
    or officenames need access to your Linux machine, take the time to sit down and
    explain the facts of secure like to them. They can then apply this information
    to the other computers they use, because these issues aren''t specific to Linux.


    # # Choosing Secure Passwords


    The first line of defense from intruders is the collection of passwords used on
    your system. For each account you have set up on your system, the passwords must
    be strong and difficult to figure out. Even if one of the accounts has a weak
    password, you may be in some trouble. Amazingly, in 70 percent of the cases where
    unauthorized individuals gained access to'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# 264 Part III: Getting Up to Speed with Linux


    systems, the password for an account was the word password itself! When choosing
    good passwords, follow these rules:


    +   - Don''t use any part of your name.

    - Don''t use the names of friends, loved ones, or pets.

    - Don''t use birthdays, anniversaries, or other easily guessed dates.

    - Don''t use dictionary words.

    - Don''t keep your password written down near your computer, unless it''s buried
    in something, such as writing it into an address.

    - Don''t tell anyone your password. If someone needs to access specific files,
    give the person an account and set up permissions and groups properly so they
    can do.

    - Do use a mix of lowercase letters, capital letters, and numbers.

    - Do ensure your password contains a minimum of eight characters.

    - Do acronyms from sentences, such as having the password M8ydnit to stand for
    "My-year-old dog''s name is Tabby."


    Every person on your system needs to follow these rules, including you! Consider
    keeping a sheet of password with these rules on next to the machine.


    I can''t stress this advice: Never give out your password. Make sure that the
    people using your machine understand this rule. You can find alternative methods
    to accomplish a task without giving out your password. If someone wants to use
    your machine, make an account for that person.


    ![](img/22f96dae18f408076ba0d3209536be6c_281_0.png)


    # Updating Software


    All users can download and install software. Of course, the programs they install
    are limited to the user''s permissions. The thing to be careful of here — with
    any operating system — is that you don''t get a version of a program that has
    been tampered with or is even an all-out fake trying to trick folks into installing
    it.


    Most Linux applications and other Linux software programs are distributed by way
    of the Internet. In fact, the development cycle of new (and updates) to Linux
    software revolves around the Internet for file exchange, e-mail, and forum news
    discussions. Make sure that you and other users of your Linux system are comfortable
    with the Web sites that are used and visited. You need to develop a list of trusted
    sites that provide you with the information you need and are not misleading in
    their presentation. As a starting point, you can trust all the sites referenced
    in this book I have accessed all. If you or a user of your Linux system unsure'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Chapter 13: a Secure Linux Box Is a Happy Linux Box 265


    whether you can trust a particular Web site, do some research and perhaps ask
    others for their opinions.


    12 details how to keep your distribution and its software up to date. Please,
    please, please do! After all, the person in charge, your job is to make sure that
    this computer stays intruder-free. In addition to making sure that you do all
    the same things a user would do for both your user accounts and the superuser
    (root) account, no matter which Linux distribution you''re running, you must keep
    up-to-date with security problems.


    # Network holes


    On a Linux server or workstation — or any computer at all, using any operating
    system — you should not have network services running that you don''t intend to
    use. Think of each network program as a glass window or sliding door in your house.
    Each network service is a weak spot, and many nasty folks are there on the Internet
    who like to go up all the houses and make note of how many windows and glass are
    on them, what kinds they are, and how easy they are to breach.


    # Controlling your services


    The more flexible your distribution — as far as its ability to run desktops and
    many types of servers — the more services running in the background by default.
    To open the network service management program for your distribution:


