    # The Log Out tool


    After you choose the Log Out option on the main menu, the screen darkens and Are
    You Sure You To Log Out? dialog opens. To use this dialog box, follow these steps:


    +   1. If you want GNOME to remember which items you have open and you to its
    current state after you log back, make sure that you select the Save Current Setup
    box.


    This feature doesn''t work with all programs, some (mostly the ones that are actually
    part of GNOME).

    2. Click Log Out, Shut Down, or Restart The Computer to set the appropriate action
    into motion or click Cancel if you don''t want to do any of them.


    These options do the following:

    * Log Out: Closes GNOME and returns to a login prompt.

    * Shut Down: Shuts the machine and then off.

    * Restart The Computer: Shuts down the machine and then brings it back up.

    3. Click OK to go through with your choice or Cancel if you change your mind.


    # The Panels


    Along the top and bottom of your GNOME desktop lives a pair of panels. Since these
    bars are neatly divided into sections, take a look at what''s in each section
    from left to right, starting with the top panel. On the far left side of the top
    panel is the Applications button discussed earlier in the section "The menus".
    To its right is the Actions button, also discussed in the same section.


    As you continue your journey to the right, you run into the standard set of Fedora
    tools (refer to Figure 6-1). You can reach all these items through the main menu,
    but they''re placed on the Panel so that you can find them quickly and easily.'
