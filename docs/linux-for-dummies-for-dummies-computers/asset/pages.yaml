  md: '# Chapter 8: Connecting to the Internet


    # It''s All Fun and Games until

    Something Doesn''t Work


    In a perfect world, the dial-up configuration steps in the preceding section would
    work 100 percent of the time. The Linux vendors have truly hidden all the mystery
    that has traditionally surrounded networking. Unfortunately, in many situations
    (mostly related to modems and hardware), a simplified configuration doesn''t work.
    If you can''t connect to the Internet after these steps, an excellent site to
    find is LinuxQuestions.org (www.linuxquestions.org). It is simply impossible for
    me to anticipate the wide range of problems people can run into, and this site
    is well known for its helpful community members.


    Also, go to your favorite Web search site and search on the error message you''re
    getting from the system, or some keywords involved with the error, such as the
    network hardware''s make and model, and the name of your distribution. You can
    use cool tools when you''re trying to figure out what''s wrong with your network
    connection or trying to gather information that can help someone figure out what''s
    wrong; the handy command programs ping and traceroute. Together, you can use these
    commands to figure out where the problem might be when you can''t reach something
    over a network. These commands are discussed in the next sections.


    ![](img/22f96dae18f408076ba0d3209536be6c_178_0.png)


    Some firewalls block the kind of traffic sent with pings and traceroutes, these
    commands don''t always work as expected, even with a good connection.


    # Checking whether you can talk

    to a specific address with ping


    The ping command is akin to a submarine using sonar to detect other objects in
    the ocean. Sonar sends out a ping signal, which reflects off a hard surface. By
    measuring the amount of time between sending the ping and the ping''s return,
    the submarine''s engineer can determine whether an object is out there and how
    far from the submarine the object is.


    The ping command in Linux provides information similar to what sonar provides.
    If you consider the Internet to be your ocean, you can determine, by pinging,
    what other computers exist and also how long it takes for your ping to return.
    You can use this command in the format ping hostname or ping ipaddress, such as
    ping bob.example.com or ping 192.168.1.5. If you can''t ping your computer in
    your house or office (assuming that you have all connected with Ethernet and not
    on separate dial-up connections), then something is wrong with the machine you''re
    pinging. On the'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# 162 Part II: Internet Now!


    other hand, if you can ping another machine in your house or office but you can''t
    ping a machine elsewhere on the Internet, then something may be wrong with your
    connection to your ISP.


    Latency, or the amount of time it takes for a signal to travel on the Internet,
    has little to do with physical distance. Rather, factors such as network traffic,
    bandwidth, and network hardware all contribute to a slow latency. These factors
    determine whether a ping to your neighbor''s computer takes longer than pinging
    at the South Pole.


    For example, try Yahoo! by opening a command prompt (see Chapter 14) and typing
    the following command:


    ```

    ping www.yahoo.com

    ```


    Press Ctrl-C to stop the ping; otherwise, your computer continues to ping the
    target.


    The output, in Figure 8-6, provides information about what ping is doing. If the
    ping can reach the host, you receive a message that the host is unreachable. If
    the ping can reach the host, you receive feedback that provides how long it takes
    — milliseconds (ms) — the signal from your computer to get to the destination
    computer and back again — the numbers, the better. For computers connected through
    Ethernet, a time of 1 ms to 3 ms is an acceptable response time. For dial-up connections,
    expect somewhere around 150 ms. When you start seeing ping times climbing to 900
    ms or higher, the network is likely under heavy use (or you have something wrong
    with your cables).


    # Following in your traffic''s footsteps with traceroute


    Another fun command is traceroute, which allows you to see all the computers your
    data goes on its way to a destination. Simply type the command traceroute hostname,
    as traceroute bob.example.com or traceroute 192.168.1.5. After a few moments,
    you receive a list of all computers between you and the designated hostname and
    how long it takes for the data to travel to each of them, as shown in Figure 8-7.


    Try Yahoo! again as an example. Open a command prompt (see Chapter 14), type traceroute
    hostname, and press Enter. It can take a moment for the data to start filling
    in, but when each line of your traceroute results a hop. Each hop represents a
    physical machine your data must travel through in order to get where it''s going.
    You can identify heavy network congestion and other problems by making note of
    the larger numbers in the list.


    ![](img/22f96dae18f408076ba0d3209536be6c_179_0.png)


    ![](img/22f96dae18f408076ba0d3209536be6c_179_1.png)'
  merge: -1
