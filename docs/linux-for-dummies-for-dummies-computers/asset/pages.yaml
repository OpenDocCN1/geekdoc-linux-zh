  md: '# 92 Part I: Getting Your Feet Wet


    # Using LiveCDs


    As I mentioned throughout this chapter (and book), LiveCDs (or bootable distributions)
    are versions of Linux that you can launch directly by rebooting a computer using
    a CD-ROM (or DVD-ROM). The beauty of these versions, from a Linux newbie''s point
    of view, is that you can try something out without having to install anything
    on your system. Old-timers love LiveCDs, too. If a system is broken, rebooting
    it with a LiveCD is a way of giving yourself a “known good” (undamaged) system
    to work from while repairing the damage on computer itself. Also, many distributions
    offer highly specialized environments for particular tasks ... but I''m getting
    ahead of myself.


    You also need to keep in mind that LiveCDs tend to be slower than a traditionally
    installed system. Everything has to run directly from the CD or DVD-ROM, after
    all.


    Make sure, too, that you''re able to save things if you need. Doing so can require
    some planning, or at least a bit of thought — see Chapter 21 for how to accomplish
    this with e-mail attachments to myself. When all else fails, I quickly configure
    the mail client and just I got those NTFS resizing images (see Chapter 2) from
    Knoix to my Fedora machine! You can also access your real hard drive space from
    a bootable distribution, though it supports NTFS or depends on the version. Knopp
    does support NTFS, though it''s best to use it as read-only.


    Another popular with LiveCDs is to use portable storage like USB keys. That way,
    you can carry around your keychain and your bootable distribution and have access
    to your preferred environment and your data at the same time. The important thing
    to know about USB storage is that Linux sees these items as SCSI drives, so if
    you have access to them manually (see Chapter 11) you''ll access them as SCSI
    partitions. For example, if you''ve got your USB keychain plugged into the first
    SCSI slot, it would probably be /dev/sdal.


    Finally, not all LiveCDs work with all PCs. The cool thing is that if one doesn''t
    work with yours, you just shrug and download another!


    # Finding Even More Linux


    More than 200 different Linux distributions are available today, with new ones
    being created every year while others fade from existence as the initial enthusiasm
    or finding them beneath dwindles away. Many of these distributions are general
    purpose, or at least similar purpose (full desktop, server, and so on), and so
    provide similar base software and surrounding'
