  md: '# Chapter 14: Working without the GUI


    Almost all Linux utilities that require input and output have been plumbed with
    the following common interfaces: stdin (standard input), stdout (standard error).
    By having a common method to feed input to a program or read data from the output
    of a program, you can glue utilities together into sophisticated solutions.


    # Redirecting command output


    I discuss redirect command output here because it''s by far the most common form
    of information detour. One example of output redirection involves telling a command
    to send its results to a file rather than to the screen, which you probably have
    been used to seeing. Start in some familiar territory by typing ls -la and then
    pressing Enter, to produce something like the following:


    ```

    total 20 2 users 4096 Oct 30 06:50:48 -

    drwxr-xr-x 5 root 4096 Oct 30 11:57 -

    -rw-r--r-- 1 users 24 Oct 30 06:50 .bash_logout

    -rw-r--r-- 1 users 124 Oct 30 06:50 .bash_profile

    -rw-r--r-- 1 users 0 Jan 2 07:48 wishlist

    ```


    Want to save this information to a file? Interested? Can you use the > redirection
    operator to tell bash to send the data into a file instead of your screen. Enter
    the following command to send the information to a file named listing:


    ```

    ls -la ~ listing

    ```


    Notice nothing displays on the screen, as you normally would expect. That''s because
    the shell has rerouted the output to a file named listing. To verify that the
    directory listing is there, enter the following command:


    ```

    cat listing

    ```


    The cat (and more) is explained Chapter 16.


    If you use ls -la > listing again, the data is overwritten, meaning that the file''s
    contents are wiped out and replaced with the new output. You can avoid this by
    using >> as your redirection operator, which tells bash to add the command''s
    output to the end of the specified file. If you type ls -la >> listing in the
    same directory after making no changes, the contents of listing are as follows:'
