  md: '# 350 Part IV: Getting Things Done


    of the box. The best way to see what you''re set up to support right now is to
    simply try and listen. After you''re sure your sound is set up properly, you can
    try many Web sites with your default browser.


    +   - SHOUTcast for finding links to thousands of online stations,

    www.shoutcast.com/


    +   - Radio-Locator for finding "regular" stations offering online

    versions, at www.radio-locator.com/


    The first place to try is SHOUTCast. When you find a station that you want to
    listen to:


    +   1. **Click the Tune In! button.**


    If you already have your software up, you can listen automatically. However, you
    probably won''t if you haven''t listened to online radio before. If you have never
    listened to this program''s format before, you will be asked what program to open
    the content with.


    +   2. If a program is suggested, click OK to proceed. Otherwise, you will need
    to navigate through your filesystem to manually choose the program.


    If you have never used this program before, it probably has a setup route it will
