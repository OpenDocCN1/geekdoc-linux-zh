    # Recovering a Root Password with Knoppix


    If you''re using SuSE, Linspread, or another distribution that requires you to
    enter a root password even to enter single user mode, need external tools to help
    you recover when you forget your root password is. This problem is another reason
    that system administrators keep Knoppix on hand. To recover your root password,
    do the following:


    +   1. Place the Knoppix CD or the DVD-ROM that came with this book into your
    CD-ROM or DVD-ROM drive.


    +   2. Reboot the computer.


    If you''re using the DVD-ROM that came with this book, press Enter when you reach
    the boot menu. If, for some reason, the DVD-ROM doesn''t boot, see Appendix B.


    +   3. After the computer successfully boots into Knoppix, determine which partition
    refers to your main Linux installation.


    You''re looking for your root (/) partition. Chapter 11 details what you find
    there if that helps. Basically, open each of the partition icons on your desktop
    and figure out which one looks like the right section of your filesystem.


    +   4. After you find the proper partition, if you currently don''t have a file
    window open anywhere within that partition, click the partition to open the browser
    now.


    For example, if the root partition is /dev/hda3, click the Hard Disk Partition
    [hda3] icon.


    +   5. Click the Terminal Program icon on your panel.


    A terminal window opens.


    +   6. Type su to access the root user''s account.


    You''re prompted for a password.


    +   7. Make sure to click the file browsing that''s accessing your root partition.


    +   8. Type mount -r remount rw /dev/partition to remove the partition and re-add
    it as a full read-write filesystem.


    For example, if your root partition was on /dev/hda3, you type cd/mnt/hda3.'
