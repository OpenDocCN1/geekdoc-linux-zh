  md: '# Chapter 11: Checking Out the Linux Filesystem 227


    If you partitioned your hard drives on your own, you know that you needed to specify
    a mount point for each partition — which is like an empty slot in a puzzle, the
    outside partition or media can be plugged into the rest of the filesystem. In
    the case of a hard drive partition that''s part of your filesystem and at boot
    time, the mount point isn''t in the /mnt /media part of the filesystem. It''s
    an item in the root directory — maybe /boot /or or /usr — anywhere in your directory
    hierarchy (/usr/share). Later, when you''re working on the computer, you don''t
    need to know or care about the directories or files are all on one drive or on
    multiple drives.

    You do just your thing.


    The times you do need to know how Linux sees the hardware are when you''re trying
    to add new hard drives, install the machine when not using automatic partitioning,
    or access temporary media. Table 11-4 lists a common breakdown of popular hardware
    designations. Note that these designations aren''t in /mnt or/media; they''re
    in /dev. They''re the actual device driver shortcuts — which point to the real
    drivers. These names are typically used for convenience so you don''t have to
    remember exactly


    | Designation | Description |

    |---|---|

    | /dev/cdrom | CD-ROM drive; if you have more than one, then you may have /dev/cdrom
    and so on, and you may also see /dev/cdwriter, /dev/dvd, or even a hard drive
    designation as /dev/hda |

    | /dev/fd0 | Floppy drive 1 |

    | /dev/fd1 | Floppy drive 2 |

    | /dev/hda | First IDE hard drive |

    | /dev/hda1 | First IDE hard drive, first primary or extended partition |

    | /dev/hda2 | First IDE hard drive, second primary or extended partition |

    | /dev/hdb | Second IDE hard drive |

    | /dev/db1 | Second IDE hard drive, first primary or extended partition |

    | /dev/db2 | Second IDE hard drive, second primary or extended partition |

    | /dev/sda | First SCSI hard drive |

    | /dev/sda1 | First SCSI hard drive, first primary or extended partition, and
