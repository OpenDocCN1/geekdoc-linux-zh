    +   - Other: A scattering of tools—some available in the Mandrake Control Center
    and some just plain handy by themselves.


    +   - Configure Your Computer: The Mandrake Control Center (see Figure 7-7) is
    usable only by the system administrator (root), who can alter system-settings
    whenever.


