  md: '# 40 Part I: Getting Your Feet Wet


    book, or from a third-party vendor such as those listed on the Fedora Project''s
    vendors page at (http://fedora.redhat.com/download/vendors.html).


    +   - Booting with an installation floppy disk and having the remainder of the
    installation files read from the DVD-ROM or CD.


    To begin the installation from the DVD-ROM or CD-ROM, you must first change your
    system to start, or boot, from a DVD-ROM or CD-ROM. In Chapter 2, I cover how
    to configure a computer to boot from these devices.


    If you want to make the installation floppy disk and have access to a Windows
    system, follow the steps to create the installation floppy in the next section,
    "Making a Boot Floppy (If Needed).",


    After the floppy creation section, the instructions tell you how to follow the
    installation for Fedora Core 3. I concentrate on Fedora Core 3 and its installation
    for two main reasons:


    +   - Fedora Core 3 is included in the DVD with this book, and the CDs you can
    order with your coupon.


    +   - Covering the installation of every Linux distribution in existence would
    make this book into a set of encyclopedias.


    I cover the Personal Desktop installation because it requires little or hard drive
    preparation and doesn''t use unused partitions like other installations. In addition,
    the Personal Desktop installation installs the fun point-and-click stuff that
    is commonly used on desktop and laptop systems. Server or service-type applications,
    such as the Apache web server and FTP server, aren''t installed with the Personal
    Desktop option and aren''t covered in any detail in this book. However, if you
    want to use them, you can add them to your Personal Desktop package selection
    later in the installation process.


    Please note that if you are installing Red Hat Enterprise Linux, a different version
    of Fedora Core, or a different distribution of Linux, yours will look different
    from what is shown in this book (for Linsphere, Mandrake, SuSE, and Xandros, see
    Chapter 4). Each Linux''s installation routine covers the basic tasks, but each
    action may be presented in a different order or be customized to look different
    on the screen. For example, one distribution may present account creation before
    network configuration, and another may have these two tasks reversed.


    ![](img/22f96dae18f408076ba0d3209536be6c_57_0.png)


    With Fedora, until you reach the About To Install (GUI) screen, you can back out
    of the installation without changing anything on your system. None of the configuration
    options you make before the About To Install screen are saved to your disks. If
