- fmt: "\nSelect 'Yes'. Now enter the first amount. If you want 70MB for your boot,\
    \ then type `70`. Now create another one and enter `512` for your swap. Again,\
    \ enter the remaining space which will be your root (`/`).\n\n### Step IV: Formatting\
    \ the drive for Windows\n\nNow, exit from the `fids` menu, put your boot-disk\
    \ back in and reboot. Select option 2 and when arriving at the prompt (`A:\\`)\
    \ type: `format c:`.\n\nThis will format the drive for installation. When finished,\
    \ reboot the computer (make sure you take out the floppy). Go into the BIOS and\
    \ set the first boot to your CD ROM.\n\nNow put your Windows CD in and save the\
    \ changes you have made to the BIOS. Windows will boot and install from the CD.\
    \ After installation, don't worry about installing all your drivers, you can do\
    \ that later.\n\n### Step V: Installing Linux\n\nNow reboot the computer with\
    \ your Linux disk 1 in the CD ROM. Make sure that your first boot device is set\
    \ to CD.\n\nRun the installation program. When prompted to partition, you can\
    \ just use the existing partitions and assign them to `swap`, `boot` and `/`.\
    \ Otherwise you can create the partitions from within the program by manual partitioning.\
    \ Make the partitions to suit you preferred sizes and assign them to their mount\
    \ points. Continue with the installation.\n\nWhen prompted to install a bootloaded,\
    \ choose `GRUB` if it is there. `LILO` will also work fine but `GRUB` is better.\
    \ Make sure you install the bootloader on the Master Boot Record (`MBR`), otherwise\
    \ you will not have a boot option screen to boot Linux and Windows.\n\nWhen prompted\
    \ to make a boot disk, insert a floppy and let it create a boot disk.\n\nWhen\
    \ finished, reboot and you are done.\n\n### Question 37: Confirm PSU status\n\n\
    I had a Redhat installed in my pc. During BIOS boot a battery missing can be seen.\n\
    \nHow can I confirm the battery or psu status in the OS environment?\n\n**A:**\
    \ The information you are after are in the `/proc` directory and under `/proc/acpi`.\
    \ You can do `cat /proc/cpuinfo` to see what is in the file.\n\nI also suggest\
    \ writing down all the information that you see in the BIOS and get a new battery.\
    \ To check the voltage of the CMOS battery, use `lm_sensors`. The voltage will\
    \ not tell you that it is dead. You need a button battery checker to test if it\
    \ is still good or bad.\n\n### Question 38: Disable driver verifier\n\nI’m having\
    \ an error that is related to drivers but I am unable to find any conflicts. I\
    \ have tried disabling all new hardware, but to no avail.\n\nHow can I disable\
    \ the driver verifier?\n\n**A:** To set file signature verification options, you\
    \ can do the ff:\n\n1. Open `System` in Control Panel.\n2. On the `Hardware` tab,\
    \ click `Driver Signing`.\n3. Under `File signature verification`, click one of\
    \ the following:\n   - `Ignore` to allow all device drivers to be installed on\
    \ this computer, regardless of whether they have a digital signature.\n   - `Warn`\
    \ to display a warning message whenever an installation program attempts to install\
    \ a device driver without a digital signature. This is the default behavior for\
    \ Windows.\n   - `Block` to prevent an installation program from installing device\
    \ drivers without a digital signature.\n\nIf you are a logged on as an administrator\
    \ or as a member of the `Administrators` group, under `Administrator` option,\
    \ click `Apply setting as system default` to apply the selected setting as the\
    \ default for all users who log on to this computer.\n\n### Question 39: SCSI\n\
    \nWhat is a SCSI?\n\n**A:** `SCSI` stands for Small Computer System Interface.\
    \ It's a standard for connecting peripherals to your computer via a standard hardware\
    \ interface which uses standard `SCSI` commands. The `SCSI` standard can be divided\
    \ into `SCSI` (`SCSI1`) and `SCSI2` (SCSI wide and SCSI wide and fast) and now\
    \ `SCSI-3` which is made up of at least 14 separate standards documents.\n\n`SCSI2`\
    \ is the most popular version of the `SCSI` command specification and allows for\
    \ scanners, hard disk drives, CD-ROM players, tapes and many other devices. `SCSI-3`\
    \ resolves many \"gray areas\" and adds much new functionality and performance\
    \ improvements. It also adds new types of `SCSI` busses like fiber channel which\
    \ uses a `4` pin copper connection or a pair of glass fiber optic cables instead\
    \ of the familiar ribbon cable connection.\n\n### Question 40: Choosing SCSI Devices\n\
    \nI want to use a `SCSI` interface but how do I choose what devices should I utilize?\n\
    \n**A:** I suggest for you to have devices which use `LVD`, automatic termination\
    \ and `SCAM` (`SCSI Configured Automatically`). Most new devices fit this pattern.\
    \ Also make sure that you consider where these devices are.\n\n### Question 41:\
    \ Setting up a SCSI chain\n\nHow do I set up a SCSI chain?\n\n**A:** Install the\
    \ `SCSI` card. Most cards today are plug_and_play and Windows will find and configure\
    \ them quickly. The next step is to cable the devices together and set the `I.D.`s\
    \ and termination (if necessary). Each device on a `SCSI` chain requires its own\
    \ `I.D.`.\n\nAs an example (example is an 8 device chain):\n\n- `ID#0` - hard\
    \ drive\n- `ID#1` - CD-ROM\n- `ID#2` - CD-R\n- `ID#3` - Internal Jaz\n- `ID#4`\
    \ - Scanner\n- `ID#5` - Hard drive\n- `ID#6` - Zip\n- `ID#7` - SCSI Card\n\nIf\
    \ two devices are set to have the same `I.D.`, the whole chain may not work or\
    \ possibly just the conflicting devices. Always make sure each device has a different\
    \ `I.D.`. Most devices have jumpers or a small dial for setting the `I.D.` number.\
    \ The hard drive at `ID#0` should be your boot drive (if you are booting SCSI),\
    \ and the CD-ROM is set at the lowest available `I.D.#` in order to have it assigned\
    \ a drive letter before the CD-R.\n\nTermination is a separate issue, but it also\
    \ affects your `SCSI` bus a great deal. Each device at the far ends of a `SCSI`\
    \ chain must be terminated. This refers to their physical location on the chain\
    \ and NOT their ID number.\n"
