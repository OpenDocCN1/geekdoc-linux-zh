    [Question 37: Confirm PSU status](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    I had a Redhat installed in my pc. During BIOS boot a battery missing can be seen.


    How can I confirm the battery or psu status in the OS environment?


    A: The information you are after are in the /proc directory and under /proc/acpi.
    You can do cat /proc/cpuinfo to see what is in the file.


    I also suggest writing down all the information that you see in the BIOS and get
    a new battery. To check the voltage of the CMOS battery, use lm_sensors. The voltage
    will not tell you that it is dead. You need a button battery checker to test if
    it is still good or bad.


    [Question 38: Disable driver verifier](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    I’m having an error that is related to drivers but I am unable to find any conflicts.
    I have tried disabling all new hardware, but to no avail.


    How can I disable the driver verifier?


    A: To set file signature verification options, you can do the ff:


    1\. Open System in Control Panel.


    2\. On the Hardware tab, click Driver Signing.


    3\. Under File signature verification, click one of the following:


    Ignore to allow all device drivers to be installed on this computer, regardless
    of whether they have a digital signature.


    Warn to display a warning message whenever an installation program attempts to
    install a device driver without a digital signature. This is the default behavior
    for Windows.


    Block to prevent an installation program from installing device drivers without
    a digital signature.


    If you are a logged on as an administrator or as a member of the Administrators
    group, under Administrator option, click Apply setting as system default to apply
    the selected setting as the default for all users who log on to this computer.


    [Question 39: SCSI](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    What is a SCSI?


    A: SCSI stands for Small Computer System Interface. It''s a standard for connecting
    peripherals to your computer via a standard hardware interface which uses standard
    SCSI commands. The SCSI standard can be divided into SCSI (SCSI1) and SCSI2 (SCSI
    wide and SCSI wide and fast) and now SCSI-3 which is made up of at least 14 separate
    standards documents.


    SCSI2 is the most popular version of the SCSI command specification and allows
    for scanners, hard disk drives, CD-ROM players, tapes and many other devices.
    SCSI-3 resolves many "gray areas" and adds much new functionality and performance
    improvements. It also adds new types of SCSI busses like fiber channel which uses
    a 4 pin copper connection or a pair of glass fiber optic cables instead of the
    familiar ribbon cable connection.


    [Question 40: Choosing SCSI Devices](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    I want to use a SCSI interface but how do I choose what devices should I utilize?


    A: I suggest for you to have devices which use LVD, automatic termination and
    SCAM (SCSI Configured Automatically). Most new devices fit this pattern. Also
    make sure that you consider where these devices are going to go, since you need
    to consider the total length of the cable. And check to see if you will need an
    adapter for an external device (50 to 25 pin or 68 to 50 pin).


    Buy quality SCSI cards and PCI if possible. Make sure it will support the bus
    speed you have in mind (SCSI-3 U2W for example). I recommend Adaptec cards as
    the best on the market but I have also heard good things about the Diamond cards.
    Also make sure you buy high quality cables. Granite Digital makes great cables
    and other accessories and is well known for their quality.


    A SCSI hard drive is set-up just like any other drive. Depending on your BIOS
    settings, you can set the system to boot from the SCSI drive or from an IDE drive.
    There is no problem in using a mixed drive setup. Seagate, IBM and Quantum are
    all well known for their SCSI drives.


    A great number of manufacturers offer SCSI burners (CD-R or CD-RW) but just plain
    CD players are harder to come by.


    A good high-end scanner will be a SCSI scanner. Check around to see what kind
    of results people are getting with the model you have in mind.


    Zip Drives, LS120s, Jaz Drives and many other devices of this type are available
    in the SCSI interface. You can add any SCSI device into your chain as long as
    you have not exceeded the number of devices for your card.


    [Question 41: Setting up a SCSI chain](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    How do I set up a SCSI chain?


    A: Install the SCSI card. Most cards today are plug_and_play and Windows will
    find and configure them quickly and easily. The next step is to cable the devices
    together and set the I.D.s and termination (if necessary). Each device on a SCSI
    chain requires its own I.D.


    As an example (example is an 8 device chain):


    ID#0 - hard drive


    ID#1 - CD-ROM


    ID#2 - CD-R


    ID#3 - Internal Jaz


    ID#4 - Scanner


    ID#5 - Hard drive


    ID#6 - Zip


    ID#7 - SCSI Card


    If two devices are set to have the same I.D., the whole chain may not work or
    possibly just the conflicting devices. Always make sure each device has a different
    I.D. Most devices have jumpers or a small dial for setting the I.D. number. The
    hard drive at ID#0 should be your boot drive (if you are booting SCSI), and the
    CD-ROM is set at the lowest available I.D.# in order to have it assigned a drive
    letter before the CD-R.


    Termination is a separate issue, but it also affects your SCSI bus a great deal.
    Each device at the far ends of a SCSI chain must be terminated. This refers to
    their physical location on the chain and NOT their ID number. In the above example,
    the scanner is probably at one end of the chain and possibly a hard drive is at
    the other with the card in the middle, like so:


    Scanner


    ZIP


    Card


    CD-ROM


    CD-R


    Jaz


    Hard drive


    Hard drive'
