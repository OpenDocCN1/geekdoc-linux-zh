  trans: '


    当我们在安装 Linux 之后安装 `MS Windows` 时，极有可能 `Windows` 已经覆盖了默认的启动管理器。在这种情况下，我们必须恢复启动管理器，以便使我们能够正常启动两个系统。


    解决这个问题有几种可能的方法。最简单的方法之一是将 Linux 发行版的 LiveCD 插入 CD 或 DVD 驱动器，然后使用 `chroot` 工具挂载我们
    Linux 系统的根分区，并 `chroot` 切换到该发行版的根目录。如果我们假设我们的 Linux 系统安装在 `hda5` 分区上，且文件系统为 `reiserfs`，那么我们应该执行以下系列命令：


    ```bash

    cd /tmp

    mkdir our_root_dir

    mount -t reiserfs /dev/hda5 our_root_dir

    chroot our_root_dir

    ```


    现在，我们可以像登录到 Linux 系统一样进行操作。最后一步是安装被 `MS Windows` 抹除的启动管理器。如果你决定将其作为下一步，请根据我们安装的启动管理器——`grub`
    或 `lilo` 遵循相应的后续步骤：


    ```bash

    update-grub

    or

    lilo -v

    ```


    ## 问题 60：准备工作


    我如何准备安装？


    答：Linux 对 PC 硬件的使用比 `MS-DOS`、`Windows` 或 `NT` 更有效，因此对硬件配置错误的容忍度也较低。在开始之前，你应该做几件事，以减少被此类问题阻的概率。


    第一步是收集你所有的硬件说明书；主板、显卡、显示器、调制解调器等，并将它们放在手可及的地方。


    下一步是收集硬件配置的详细信息。如果你运行 `MS-DOS` 5.0 或更高版本，实现此点的简单方法是从微软诊断工具 `msd.exe` 打印报告（你可以忽略
    `TSR`、`driver`、`memory-map`、`environment-strings` 和 `OS-version` 部分）。这将确保你获得显卡和鼠标类型的完整正确信息，这对以后配置
    `X` 有帮助。


    第三，检查你的机器是否存在支持硬件的配置问题，这些问题可能会在 Linux 安装期间导致无法恢复的死机。


    使用 IDE 硬盘和 CD-ROM 的 `DOS/Windows` 系统即使在硬盘上的主/从跳线设置错误的情况下也可能是正常运行。Linux 不会这样。如果有疑问，请检查你的主/从跳线。


    如果你的任何外设硬件既没有配置跳线，也没有非易失性配置内存，那么它可能需要通过 `MS-DOS` 工具在启动时进行初始化，并且在 Linux 中可能无法访问。CD-ROM、声卡、以太网卡和低磁带驱动器可能有这个问题。如果是这样，你可能可以通过启动提示符的参数来绕过这个问题，详情请在
    Google 上搜索 `Linux`。


    其他某些操作系统允许总线鼠标与其他设备共享 `IRQ`。Linux 不支持这一点，尝试这样做可能会导致你的机器死机。我建议你对将使用的总线鼠标要有详尽的信息。


    ## 问题 61：使用 Fips 或 Loadlin 在 Windows 上安装 Linux


    我如何能以磁盘镜像的形式在 Windows 分区上安装 Linux？


    答：现在可以使用所谓的回环文件系统（loopback filesystem）在 Windows 分区上作为磁盘镜像安装 Linux。`Red Hat` 和
    `Mandrake` 这种这种，但由于 `Windows` 处理文件的方式，这是一个极其糟糕的主意。系统碎片整理将变成一场噩梦，Linux 本身会运行极其缓慢，并且会破坏你的
    `Windows` 和 Linux 体验。`Umsdos` 文件系统也是如此，尽管 Linux 不会变慢，最好的做法是将 Linux 安装在它自己的分区上。假设：


    - 你正在使用 `Windows` 98 或更高版本。

    - 你熟悉电脑，知道如何使用软盘或 CD-ROM 启动系统。

    - 你熟悉 `DOS` 以及 `Windows`。

    - 你知道什么是分区，并想在它自己的分区上安装 Linux。

    - 你有一个大于 4GB 的硬盘——目前存有 `Windows`——并打算在上面安装 Linux（由于主板最多只能放置 4 个 IDE 设备）。


    要做的第一件事是为 Linux 在空空间创建一个分区，这通常是 `Windows` 的 `C` 盘。你可以在这个空间内为 Linux 建立一个独立的分区（这通常会被标记为
    `D:`）。你可以使用 `Windows Fdisk`（Windows Fdisk 不会在硬盘上创建超过一个主分区）在不丢失数据的情况下，从头创建分区，一个用于
    Windows，一个用于 Linux，或者使用一个更简单、更方便的非破坏性分区工具 `Fips`。`Fips` 的特殊之处在于它可以在你的 `C` 分区的空空间创建新的主分区而不会丢失任何数据。`Fips`
    的最新版本 (2.0) 可在其主页获取，大多数 Linux 发行版都将其放在 `/dostools` 或 `/dosutils` 目录下。


    我们将专注于使用 `Fips`，而不是使用 `Windows Fdisk`（这实际上完全没有必要，除非你买了一台新系统，即使如此，更好的做法是在上面安装 Windows，然后使用
    `Fips` 进行拆分，原因将在后解释）。


    硬盘最多可以有 4 个主分区。除了主分区，硬盘还可以有一个所谓的扩展分区，扩展分区可以包含多个逻辑分区。扩展分区不像主分区或逻辑分区的地方在于它们不存储数据，而是逻辑分区的容器，数据实际上存储在逻辑分区中。因此在
    Windows 中，`C:` 是主分区，如果你使用了 `Windows Fdisk`（Windows Fdisk 不会在硬盘上创建超过一个主分区），`D:`
    通常是扩展分区的第一个逻辑分区。`E:` 是第二个逻辑分区，依此类推。Linux 的情况略有不同。第一个主分区被称为 `/dev/hda1`，第二个主分区为
    `/dev/hda2`，直到第四个主分区 `/dev/hda4`。Linux 将扩展分区称为（在只有一个主分区和一个扩展分区的磁盘情况下）主分区为 `/dev/hda1`，扩展分区为
    `/dev/hda2`。扩展分区的逻辑分区被称为 `/dev/hda5`、`/dev/hda6` 等等此类推。第二个硬盘被称为 `/dev/hdb`，第三个为
    `/dev/hdc`（如果设置为从主，通常是光驱驱动器），第四个也是最后一个硬盘为 `/dev/hdd`（最后是因为主板最多只能放置 4 个 IDE 设备）。SCSI
    设备被称为 `/dev/sda`。


    `Fips` 在你硬盘的空空间创建一个新的主分区。这本质上是一项危险的操作，如果发生任何问题，备份所有重要数据是个好主意。除非硬盘本身就有问题，否则 `Fips`
    基本上是成功的。


    '
- fmt: '

    Next step is for you to decide how you want to boot into Linux. The default and
    most common method is to use `Lilo`. It’s a simple and basic bootloader program
    that overwrites (after saving) your hard disk''s `MBR` (Master Boot Record) and
    on booting the system gives you a choice between booting either Windows or Linux.
    If you select Windows it boots Windows and you are met with the familiar windows
    screen or if you select Linux it boots Linux and if you don''t make a choice in
    the stipulated time, it boots the default operating system, Windows or Linux,
    depending on how you set it up. You can restore your original MBR anytime, when
    uninstalling Linux for instance, either by typing `/sbin/lilo -u` within Linux
    or typing `fdisk /MBR` in DOS (this will overwrite the MBR with the original Windows
    MBR).


    ### The Problem with Lilo

    The problem with using `Lilo` especially for those with large disks is you would
    have to give up a substantial chunk of your disk space to Linux. This is not a
    flexible solution since while you can access your Windows partition from within
    Linux; the large MPEG files can be stored in Windows and accessed by both operating
    systems. Do know that BIOS cannot access data that is beyond this 1024 cylinder
    limit and `Lilo` is dependent on the BIOS to boot the OS. So if you want to use
    `Lilo` to boot Linux, make sure that the Linux partition is well below the 1024
    cylinder limit. Most modern hard disks have more than 1024 cylinders and using
    `Lilo` means making the Linux partition at about the 1000 or 1010 cylinder mark
    which translates into a whopping 5.2Gb of 12.9Gb to Linux.


    ### Loadlin as an Alternative

    An underrated alternative to `Lilo` is to use `Loadlin`, especially for those
    with large hard-disks. It''s an excellent alternative as you don''t have to worry
    about the 1024 cylinder limit. Even better you can launch Linux from your Windows
    desktop and modify your `autoexec.bat` file to give you an option to boot into
    either of the OS''s during boot time not unlike `Lilo`. You are then free to size
    your partitions as you please. For example, a 2.2Gb extended partition with 3
    logical partitions. It''s normal to make three partitions, one for the Kernel
    boot files, one for the root partition and one for the swap partition.


    ### Preparing the Hard Disk

    Now we are ready to actually partition the hard disk. First make a DOS boot disk
    (type `format a: /s` at the DOS prompt or in DOS). Put the following three files
    in the disk, `fips.exe`, `restorrb.exe` and `errors.txt`. Defrag your hard disk;
    this puts all the data at the beginning leaving enough space for `Fips` to create
    a new partition from. If you use `Norton Speed Disk`, select the un-fragmented
    free space option. Norton usually puts data at the end of the disk and this will
    prevent `Fips` from creating a new partition. Run `Scandisk` and reboot using
    the boot disk you just created.


    ### Using Fips for Partition

    Type `fips` at the prompt and `Fips` will show you your partition table with a
    warning about partition table inconsistency. If your disk has more than 1024 cylinders
    it’s usually safe to ignore this warning. Next `Fips` will ask you is you want
    to proceed, the program is extremely detailed; answer yes and when prompted to
    save a backup of your partition table and boot sector answer yes. This step is
    absolutely vital as it allows you to restore your hard disk to its un-partitioned
    single partition state should anything go wrong. It also comes in handy if you
    want to uninstall Linux or resize your Linux partition. It doesn''t matter what
    happens to the new partition in the meantime, if you have the back you can restore
    your hard disk to its original un-partitioned state. This reversible operation
    will work in all circumstances but one; if you format your original (Windows)
    partition which was split to make space for Linux in the meantime, the original
    FAT is overwritten with a new and smaller one and the restore operation will not
    work.


    ### Resizing the Partition

    After making the backup you will be presented with a screen with 3 numbers, the
    first represents your original partition (it’s the smallest size), `Fips` has
    allocated all free space in the hard disk to the new partition as this is the
    default behavior. The second column shows the cylinder info which will be the
    guide for those who plan to use `Lilo`. The third shows the size of the new partition
    you are going to create. Use the arrow keys to resize the partition; you would
    just have to reduce the size of the new partition since it is at its maximum to
    a size you want. For `Lilo` users, the new partition has to be below the 1024
    cylinder mark, 1000 is a reasonable beginning for the new partition. After you
    are satisfied with the size of your new partition press enter, `Fips` will ask
    you to confirm and write the new partition table.


    ### Final Steps

    Reboot your system. Remember to change the BIOS settings to boot from the hard
    disk or you will end up rebooting with the floppy. Double click My Computer and
    you will see the result of all the hard work, there will be a new drive labeled
    D alongside the original C. Don''t touch D, run `scandisk` on your original partition
    (C). If there are no errors, then you are ready to install Linux.


    Some of the Linux documentation mistakenly asks you to delete the newly created
    partition using Windows `Fdisk`. Do not commit that mistake because if you do,
    the Linux partitions will show up in My Computer when you reboot after installing
    Linux and since Windows obviously cannot read these drives and the ext2 file system,
    using Explorer and accessing your hard disk in Windows will become a time consuming
    and tedious effort.


    ### Linux Installation

    Reboot using your Linux Installation CD (let’s focus on Redhat 6.2 which I find
    fairly straight forward). Most Linux distributions have really worked on their
    installation programs and you shouldn''t have a problem. Just have the details
    about your hardware in hand, the horizontal and vertical refresh rate of your
    monitor in case the installation program doesn''t automatically detect it ( you
    will find the exact figures in the manual ), the video card, its memory type (
    SDRAM or SGRAM ) and size, and your mouse type – PS2 or Serial. As mentioned earlier,
    you will have to make about 3 partitions for Linux (3 is the recommended number).
    There are 3 main installation types, Workstation, Server and Custom. The Server
    class install erases everything in the hard disk so be careful. The workstation
    and custom installs have sub-classes but that''s for you to explore.


    `Loadlin` users have to select custom installation and dump `Lilo` when given
    the opportunity because the other types of installations install `Lilo` by default
    without asking. `Lilo` users have no restrictions; you can opt for whichever install
    type you like.


    `Lilo` fans can use `Disk Druid` which is Red Hat’s default partitioning utility.
    First, delete the second partition which will show up in `Disk Druid`''s screen
    as `/dev/hda2`. Then create a new partition, set its mount point to `/boot` and
    size to 16Mb. Create the second partition and set its mount point to `/` (that''s
    called the root partition) and size to expandable. This tells `Disk Druid` to
    reclaim all free space after you have finished partitioning. Create the third
    partition and set its mount point to `swap` and size to about 127Mb presuming
    you have 64Mb RAM, those with less can make a 64Mb swap partition.

    '
