  raw: 'If you don''t have xfs then you will need to install Type 1 fonts by adding
    to their XFree86 font path and using xset. using xset. XFree86 3.x users should
    install TrueType fonts via xfstt, while XFree86 4.x users can add them to the
    X font path. You should install TrueType fonts via xfstt.


    The font path:


    XFree86 finds your fonts by searching a font path, a list of directories containing
    fonts. When an application requests a font, it searches through the directories
    in your font path one at a time until the font is found. To make fonts available
    requires you to set your font path. You can add a directory to your font path
    with the command xset fp+ directory Once you have done this; you need to ask the
    X server to re-scan for available fonts with the command:xset fp rehash


    Since you will want these commands to run automatically, you should put them in
    your .xinitrc file or possibly your .Xclients or .xsession file. This depends
    on how you start X. It''s convenient to make two of these files symlinks to the
    other to avoid confusion.


    Another way to have the commands set automatically is edit XF86Config. For example,
    to add /usr/share/fonts/myfonts to the font path when X is started, edit XF86Config
    like this:


    Section "Files"


    FontPath /usr/share/fonts/myfonts


    EndSection


    The advantage of editing XF86Config is that the resulting changes are system wide.


    Installing Type 1 Fonts:


    The easiest way to make Type 1 fonts available to X is with the help of the Type1inst
    utility. This is a Perl script that automatically creates the fonts.dir and fonts.scale
    files that you need for X to use the fonts. Simply cd to the directory, and run
    type1inst. cd directory type1inst


    Now you need to add the fonts to your font path. If you already have the stand-alone
    Section 4.4 running, you do this by editing your xfs configuration file. RedHat
    users can just use chkfontpath. Te format is chkfontpath --add directory


    Your fonts will be available to X after you restart xfs or tell it to reload by
    sending a SIGHUP. You may need to run xset fp rehash as well.


    Your fonts should now be available to X. Now run xset fp rehash and X will be
    able to find the new fonts.


    If you don''t have the xfs package, you need to add the directory containing your
    new fonts to the font path, as described previously.


    Adding TrueType fonts is a little more difficult because you need to have a font
    server that is capable of serving TrueType fonts. Two font servers that do this
    are xfstt and xfs.


    xfstt is a TrueType font server. While it''s easy to configure and quite useful,
    it appears that xfs is becoming more popular. The main advantage of xfs over xfstt
    is that it supports both Type 1 and TrueType fonts.


    To set up xfstt, just download it and install it. Once you install it, you need
    to do the following:


    Install fonts into the appropriate directory (read the documentation that comes
    with the package).


    cd to that directory and run xfstt --sync. This causes it to look for the fonts
    and create the fonts.dir file.


    Now add unix/:7100 to your font path.


    Your TrueType fonts should now display and be available to applications such as
    GIMP and Netscape. You may want to configure it to start every time your system
    starts up. Check to see if there''s a startup file included (if you are using
    RPM, you can use rpm -ql xfstt |grep init and look for the file with a name like
    this: /etc/rc.d/init.d/xfstt). If you don''t have an init script, just put two
    lines in /etc/rc.local like this:


    /usr/X11R6/bin/xfstt --sync


    /usr/X11R6/bin/xfstt &


    Some of the newer Linux distributions ship with the X font server xfs configured
    to run as a stand alone program. Redhat and all the Redhat based distributions
    use xfs with TrueType compiled in. Debian also ship xfs, but the version they
    ship in doesn''t have built in TrueType support.


    Running xfs as a stand alone server has several benefits, especially if it is
    compiled with TrueType support. The main advantage is that since the font server
    is no longer attached to the X server, it is possible to serve fonts to remote
    displays. Also, it is easier to modify the font path.


    As a font server, xfs has its own font path. You can place the xfs font server
    in XFree86''s font path, by adding unix/:port to the XFree86 font path. Once you
    do this, any font in the xfs font path automatically becomes available to XFree86.


    The xfs font path is determined by the xfs configuration file, which is /etc/X11/fs/config
    on Redhat, and /etc/X11/xfs/config on Debian. Redhat users do not need to explicitly
    edit this file; they can use the chkfontpath utility. The syntax is simple: chkfontpath
    --add directory


    Users of other distributions can edit the configuration file as follows:


    catalogue = /usr/X11R6/lib/X11/fonts/misc:unscaled,


    ...


    /usr/share/fonts/my_new_fonts/,


    ...


    /usr/share/fonts/some_other_directory


    # in 12 points, decipoints


    default-point-size = 120


    ...


    The above would add /usr/share/fonts/my_new_fonts/ to the xfs font path. Note
    that the last line of the list of directories doesn''t have a comma at the end.
    For these modifications to the font path to become effective, xfs must be told
    to reload by running /etc/init.d/xfs reload or sending it a SIGHUP with "kill
    -HUP [pid]" or "killall -HUP xfs". Alternately you can just re-start xfs, though
    if you do that it would be a good idea to re-start your X session too.


    To prepare a font for xfs, you need to follow the following steps:


    If you don''t have xfs installed, you need to install it.


    Put the new fonts in a directory.


    If you are installing Type 1 fonts, prepare the new directory for the server by
    running type1inst in the directory.


    If you are installing TrueType fonts, (remember, not all distributions can do
    TrueType via xfs ! ), prepare the new directory for the server by running ttmkfdir
    -o fonts.scale mkfontdir in the directory containing your new fonts. If you created
    a new directory for the fonts you may need to copy fonts.scale to fonts.dir or
    create a symbolic link. ttmkfdir is part of the free type package.


    Now you can add the new directory to your xfs search path. Users of Redhat-like
    distributions can do this with the chkfontpath utility: Other users can do this
    by editing their xfs configuration file.


    if xfs is already installed on your system, you should see which port it is running
    on. You can do this as follows: ps ax|grep xfs


    Then check your XFree86 font path. xset –q


    If your font path includes something like unix:/port_number were port_number is
    the port which the server is running on, then you already have xfs set up properly.
    Otherwise, you should add it to your XFree86 font path. xset fp+ unix/:port_number
    xset fp rehash You can add it permanently by editing your .xinitrc as explained
    previously. To add it system wide, edit your XF86Config file (probably either
    /etc/X11/XF86Config, /etc/XF86Config or /usr/X11R6/lib/X11/XF86Config), by adding
    a line FontPath "unix:/port_number" in the Files section.


    If xfs is already properly installed, then you can tell it to reload, as described
    above, or restart it like this: /etc/rc.d/init.d/xfs restart. After restarting
    xfs, it''s best to restart your X-session.


    [Question 104: XDM](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    How do I log-in to a graphical terminal for Debian Linux 1.3 distribution?


    A: XDM is the most common way to log in to a graphical terminal. In directory
    /etc/X11/xdm there are configuration files that are executed on different login
    phases. Xstartup (and Xstartup_0 especially for screen 0) contains commands to
    be run after the user has logged in (commands are run as user root).


    The path that is set for users is in /etc/X11/xdm/xdm-config. There are lines:


    DisplayManager*userPath:


    /usr/local/bin:/usr/bin:/bin:/usr/bin/X11:/usr/games


    DisplayManager*systemPath:


    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/bin/X11'
