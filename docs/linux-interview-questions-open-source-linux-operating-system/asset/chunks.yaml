    [Question 100: Start X client on another system](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    How to Start an X Client on another display?


    A: To start an X client on another system that has a running X server, use the
    following commands:


    Use xhost on the server system to allow the client system use the display. If
    the server''s IP address is 192.168.20.1, enter the command:


    $ xhost + 192.168.20.1


    On the client system, open a telnet connection to the server system.


    In the telnet session, start xterm in the background with the -display and -e
    options. For example, if the IP address of the machine running the server is 192.168.20.1
    and the client program name is named clientapp, use the following command:


    $ xterm -display 192.168.20.1 -e clientapp &


    [Question 101: Mouse problem](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    I used the xf86config program to set up my mouse configuration and then started
    a desktop. Everything seems to work fine but my mouse cursor is stuck in the upper
    left corner and cannot be moved.


    What steps should I make to check this problem?


    A: Before using the xf86config program to set up mouse configuration, you must
    identify the interface type, the device name and the protocol type of your mouse.


    The first thing you need to know is the interface type of the mouse you are going
    to use. It can be determined by looking at the connector of the mouse. The serial
    mouse has a D-Sub female 9- or 25-pin connector. The bus mice have either a D-Sub
    male 9-pin connector or a round DIN 9-pin connector. The PS/2 mouse is equipped
    with a small, round DIN 6-pin connector. Some mice come with adapters with which
    the connector can be converted to another. If you are to use such an adapter,
    remember that the connector at the very end of the mouse/adapter pair is what
    matters.


    The next thing to decide is a device node to use for the given interface. For
    the bus and PS/2 mice, there is little choice; your OS most possibly offers just
    one device node each for the bus mouse and PS/2 mouse. There may be more than
    one serial port to which the serial mouse can be attached.'
