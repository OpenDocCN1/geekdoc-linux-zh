    # 问题 18：基础 vi 命令


    什么是基础 vi 命令？


    答：`vi` 编辑器是 UNIX 系统中一种常用的编辑器，因为它使用带有转义键（escape key）的普通键盘。在 DECstation 上，转义键是 `F11`
    键。因此，它适用于所有 UNIX 计算机。在 UNIX 提示符下输入 `man vi` 可查看完整文档。


    ### 开始编辑会话


    要启动 `vi`，只需在操作系统提示符处输入 `vi`。你会看到屏幕左侧有一列波浪号（~`）。这表示一个空的工作区域。要编辑文件，只需在后面加上文件名，例如
    `vi filename`。你将看到所包含的文件内容。此时 vi 进入命令模式。进入插入模式的最基本命令是 `i`，它允许你在光标左侧插入文本。


    在插入模式下，你输入的字符将插入到文档中。你可以使用退格键删除当前输入行上的任何打字错误。转义键（`<esc>`）带你退出插入模式并返回命令模式。如果你不确定自己处于哪种模式，只需反复按下
    `<esc>` 直到 `vi` 开始报错。此时你就知道自己处于命令模式了。


    命令模式是你进行所有非插入模式操作的地方。在命令模式下，那些在插入模式中导致屏幕上出现字母的相同按键现在代表完全不同的功能。


    以下是一些常用命令：


    ### 撤销命令

    - `U` - 撤销上一个命令。


    ### 屏幕命令

    - `CTL/l` - 重打印当前屏幕。

    - `CTL/L` - 在屏幕顶部显示一行。

    - `CTL/E` - 在屏幕底部显示一行。

    - `CTL/F` - 向前翻一页。

    - `CTL/B` - 向后翻一页。

    - `CTL/D` - 向下翻半屏。

    - `CTL/U` - 向上半屏。


    ### 光标定位命令

    - `j` - 光标向下移动一行，同列。

    - `k` - 光标向上移动一行，同列。

    - `h` - 光标向左移动一个字符。

    - `l` - 光标向右移动一个字符。

    - `RET` - 光标移动到下一行开头。

    - `0` - 光标移动到当前行开头。

    - `$` - 光标移动到当前行结尾。

    - `SPACE` - 光标向右移动一个字符。

    - `nG` - 光标移动到第 n 行开头。默认是文件最后一行。

    - `0` - 光标移动到行的第一个字符。

    - `:n` - 光标移动到第 n 行开头。

    - `b` - 光标向后移动到上一个单词的开头。

    - `e` - 光标向后移动到上一个单词的结尾。

    - `w` - 光标向前移动到下一个单词。

    - `/pattern` - 光标向前移动到模式下次出现处。

    - `?pattern` - 光标向后移动到模式出现处。

    - `N` - 重复上一次 `/` 或 `?` 模式搜索。


    如果你尝试移动到 vi 不允许的地方（例如当光标在最左侧列时按下 `h`），你的终端会通过蜂响或屏幕闪烁来报错。


    ### 文本插入命令

    - `a` - 在光标后追加文本。按转义键结束。

    - `A` - 在行尾追加文本。按转义键结束。

    - `i` - 在光标前插入文本。按转义键结束。

    - `I` - 在行首插入文本。按转义键结束。

    - `o` - 在当前行下方打开新行插入文本。按转义键结束。

    - `O` - 在当前行上方打开新行插入文本。按转义键结束。

    - `DEL` - 在文本插入期间覆盖上一个字符。

    - `ESC` - 停止文本插入。DECstations 上的转义键是 `F11` 键。


    ### 文本删除命令

    - `x` - 删除当前字符。

    - `dd` - 删除当前行。

    - `dw` - 删除当前单词。

    - `d)` - 删除当前句子的剩余部分。

    - `D, d$` - 从光标删除到行尾。

    - `P` - 还原上次删除的文本。


    ### 修改命令

    - `cw` - 修改当前单词字符，直到按转义键停止。

    - `c$` - 修改到行尾的文本。

    - `C, cc` - 修改当前行的剩余文本，直到按转义键停止。

    - `~` - 切换当前字符的大小写。

    - `xp` - 交换当前字符和后续字符。

    - `J` - 将当前行与下一行合并。

    - `s` - 删除当前字符并进入插入模式。

    - `rx` - 将当前字符替换为 `x`。

    - `R` - 替换后续字符直到按转义键停止。


    ### 剪切和粘贴命令

    - `yy` - 将当前行放入缓冲区。不从当前位置删除该行。

    - `p` - 将缓冲区行放在光标当前位置之后。


    ### 将文件追加到当前文件

    - `:R filename` - 在光标之前的位置插入文件 `filename`。


    ### 退出 vi

    - `ZZ` - 保存并退出 vi。

    - `:wq` - 更改并退出。

    - `:q!` - 退出（不保存）。


    # 问题 19：wc 统计


    我想查找字节数和单词。


    答：使用 `wc`（word count），它是 UNIX 系统中的一个命令。它可以读取标准输入或文件列表，并生成统计信息：字节数、行数、单词数。例如：


    ```

    wc ideas.txt

    40 149 22

    ```


    第一列显示行数，第二列显示单词数。新版本的 `wc` 可以区分字节和字符计数。这通过 `-c` 或 `-m` 开关选择。


    ### 描述

    - -c, --bytes: 打印字节数

    - -m, --chars: 打印字符数

    - -l, --lines: 打印行数

    - -L, --max-line-length: 打印最行长度

    - -w, --words: 打印单词数

    - --help: 显示帮助信息

    - --version: 输出版本信息


    '
- fmt: '

    `REPEAT` copies of `CHAR`, `REPEAT` octal if starting with 0


    `[:alnum:]` all letters and digits


    `[:alpha:]` all letters


    `[:blank:]` all horizontal whitespace


    `[:cntrl:]` all control characters


    `[:digit:]` all digits


    `[:graph:]` all printable characters, not including space


    `[:lower:]` all lower case letters


    `[:print:]` all printable characters, including space


    `[:punct:]` all punctuation characters


    `[:space:]` all horizontal or vertical whitespace


    `[:upper:]` all upper case letters


    `[:xdigit:]` all hexadecimal digits


    `[=CHAR=]` all characters which are equivalent to `CHAR`


    Translation occurs if `-d` is not given and both `SET1` and `SET2` appear. `-t`
    may be used only when translating. `SET2` is extended to length of `SET1` by repeating
    its last character as necessary. Excess characters of `SET2` are ignored. Only
    `[:lower:]` and `[:upper:]` are guaranteed to expand in ascending order; used
    in `SET2` while translating, they may only be used in pairs to specify case conversion.
    `-s` uses `SET1` if not translating nor deleting; else squeezing uses `SET2` and
    occurs after translation or deletion.


    ## Question 21: nice


    Is there a way to control or facilitate processes executing quickly so that the
    processes execute slowly so as not to interfere with other system activities?


    **A:** UNIX processes have an associated system `nice` value which is used by
    the kernel to determine when it should be scheduled to run. This value can be
    increased to facilitate processes executing quickly or decreased so that the processes
    execute slowly and thus do not interfere with other system activities.


    ### SYNOPSIS

    ```

    nice [OPTION] [COMMAND [ARG]...]

    ```


    ### DESCRIPTION

    Run `COMMAND` with an adjusted scheduling priority. With no `COMMAND`, print the
    current scheduling priority. `ADJUST` is 10 by default. Range goes from -20 (highest
    priority) to 19 (lowest).


    - `-n, --adjustment=ADJUST`: increment priority by `ADJUST` first

    - `--help`: display this help and exit

    - `--version`: output version information and exit


    ## Question 22: join


    I want to merge the lines of two sorted files based on the presence of a common
    field.


    How do I accomplish that?


    **A:** The command `join` is Unix-like operating system that merges the lines
    of two sorted text files based on the presence of a common field. It is a sort
    of implementation of the `join` operator used in relational databases but operating
    on text files.


    The `join` command takes as input two text files and a number of options. If no
    command-line argument is given, this command looks for a pair of lines from the
    two files having the same first field (a sequence of characters that are different
    from space), and outputs a line composed of the first field followed by the rest
    of the two lines.


    The program arguments specify which character to be used in place of space to
    separate the fields of the line, which field to use when looking for matching
    lines, and whether to output lines that do not match. The output can be stored
    to another file rather than printing using redirection.


    ### SYNOPSIS

    ```

    join [OPTION]... FILE1 FILE2

    ```


    ### DESCRIPTION

    For each pair of input lines with identical join fields, write a line to standard
    output. The default join field is the first, delimited by whitespace. When `FILE1`
    or `FILE2` (not both) `-`, read standard input.


    - `-a SIDE`: print unpairable lines coming from file `SIDE`

