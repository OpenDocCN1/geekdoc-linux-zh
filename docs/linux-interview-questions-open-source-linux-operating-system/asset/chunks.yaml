    ## Question 54: Uninstalling


    I want to uninstall the programs I compiled by myself, what is the method for
    doing this?


    A: Uninstalling the programs you''ve compiled yourself is not as easy as uninstalling
    programs you''ve installed with a package manager, like `rpm`.


    The first step is to read the documentation that came with your software package
    and see if it says anything about uninstalling. If you didn''t delete your `Makefile`,
    you may be able to remove the program by doing a `make uninstall`:


    ```bash

    root@puter: /home/me/dls/pkg# make uninstall

    ```


    If you see weird text scrolling on your screen that''s a good sign. If `make`
    starts complaining, that''s a bad sign. Then you''ll have to remove the program
    files manually.


    If you know where the program was installed, you''ll have to manually delete the
    installed files or the directory where your program is. If you have no idea where
    all the files are, you''ll have to read the `Makefile` and see where all the files
    got installed and then delete them.


    ## Chapter IV: Linux Installation, Package Management


    ## Question 55: Pre-Installation


    What should I know before I install Linux?


    A: If you have a Live-CD version of your system (most of the modern distros have
    it), download it and run it before installing the system on your hard drive. This
    may help you identify possible problems with your hardware (some of it may be
    unsupported under Linux) and just have an impression about the general usability
    of the selected distro without the need of installing it on your disk and without
    losing any data.


    You have to know that Linux requires a free partition on your disk to be installed
    properly. If you have Windows installed and have only one system partition (just
    the `C:` drive), then you can either resize your partition or completely remove
    Windows. Some installers support Windows partitions resizing, but not all. If
    you wish to install a distro which doesn’t support it, you have to do it manually
    before the installation. There are many tools for changing the partition size.
    One of the most popular is a commercial app called `Partition Magic`. You don’t
    have to use it though, because most Linux Live-CDs include a partitioning program
    (`qtparted` or `GParted`) capable of resizing Windows partitions.


    Be warned that in many installers, the default value for partitioning is to completely
    format your hard drive removing all your data (if any) and create the Linux partitions
    on the clean space. This is not the desired behavior if you have another system
    or some important data on your disk. In this case you should not agree to clean
    the disk, but choose either the option “Use the free space” or “format manually”.
    It is absolutely necessary to read the installer tips carefully to avoid problems
    later on.


    Some distros (the minority) do not have any partitioning program (they can only
    install on already existing partitions). In this case you also have to partition
    your hard drive manually beforehand.


    Once upon a time, the installer may crash or refuse to continue working properly.
    This may be due to a badly burned CD-ROM or due to some installer bug. It may
    be be that some uncommon piece of hardware is causing the installer to behave
    in an unstable way. There may be many reasons for crashing. It happens pretty
    rarely nowadays on the desktop machines, more often on laptops. In case you’re
    installing on a mobile computer, you can read the laptop tips which may help you
    to diagnose the problem and install Linux on your machine.


    ## Question 56: Sharing Disk


    Is it possible for GNU/Linux and MS Windows to share disk?


    A: When we talk about GNU/Linux and Microsoft Windows in terms of co-existence
    on the same physical machine or to be more precise - on the same hard drive, one
    should be aware that it is not very difficult to achieve that goal. In most cases
    it is being done automatically by the Linux installation process itself.


    Software responsible for choosing correct operation system during computer boot
    sequence is called `boot manager`. In most cases that small program is positioned
    in master boot record (`MBR`) of the hard drive or alternatively in the very first
    sector of one of existing partitions on the disk. Microsoft has embedded his own
    boot manager into Windows but unfortunately it is not capable of running any other
    systems then those from Microsoft Windows family. That is why, in most cases,
    our choice of boot manager will be limited to Linux system (e.g., `LILO` or `Grub`).


    ## Question 57: Bootloader


    What does a bootloader do?


    A: The program which loads the kernel into memory at boot time is called `bootloader`.
    The bootloaders that come with Linux are `LILO` and `GRUB`. If you want change
    LILO configuration, you have to open the file `/etc/lilo.conf` using your favorite
    editor. In this file each line has its meaning:


    ```

    boot=/dev/hda

    prompt

    timeout=50

    default=linux

    image=/boot/vmlinuz-x.x

    label=Linux

    read-only

    root=/dev/hda3

    other=/dev/hdaX

    label=windows

    ```


    ## Question 58: safe place for boot manager


    Where is the best place to install boot manager?


    A: The best and the safest place to install boot manager is a first sector of
    master boot record (`MBR`) and in most cases that is a default option. That gives
    us a list of mostly all systems to be booted. There are more options worth our
    consideration:


    1. Have the boot manager installed on a floppy disk or a Flash memory. This is
    very useful in case of loosing the `MBR` from the hard drive or any other reason.

    2. Have the boot manager installed on the first sector of any portion of your
    drive, in this case we will have to point our main boot manager to any other boot
    manager located on our drive. That way we can gain ability to run from one boot
    manager other boot managers. This would be useful in case of having boot managers
    for particular systems, e.g., having compiled different kernels for the same system
    and still having different operation systems on our computer. This case allows
    us to write a boot menu in our `MBR` with up to four systems.


    ## Question 59: Recover boot manager


    What will happen when Windows had already removed boot manager?


    A: When we want to have two systems on our hard drive, it is more comfortable
    to install MS Windows first. There is a known problem with Microsoft’s operation
    systems which do not see anything except itself. Linux systems are friendlier
    and are more able to co-exist with systems already installed on a hard drive.
    During installation user is being asked a question whether new Linux system should
    be installed on the whole available space or should occupy only unused part of
    the hard drive. If that is the option chosen by us, Linux will create new partition
    for itself and get installed without interfering with other systems.

