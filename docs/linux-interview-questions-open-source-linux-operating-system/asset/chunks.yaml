    ## Question 21: nice


    是否有一种方法可以控制或促进快速执行的进程，使其运行缓慢，从而不干扰其他系统活动？


    **A:** UNIX 进程有一个关联的系统 `nice` 值，内核利用该值来决定何时调度运行。可以增加此值以促进进程快速执行，或减小它可以使进程运行缓慢，从而不干扰其他系统活动。


    ### 语法概要

    ```

    nice [OPTION] [COMMAND [ARG]...]

    ```


    ### 描述

    使用调整后的调度优先级运行 `COMMAND`。如果没有指定 `COMMAND`，则打印当前的调度优先级。`ADJUST` 默认值为 10。范围从 -20（最高优先级）到
    19（最低优先级）。


    - `-n, --adjustment=ADJUST`: 首先将优先级增加 `ADJUST`

    - `--help`: 显示此帮助信息并退出

    - `--version`: 输出版本信息并退出


    ## Question 22: join


    我想根据公共字段的存在合并两个排序后的文件的行。


    我该如何实现这一点？


    **A:** `join` 命令是 Unix 类操作系统中的一个工具，用于根据公共字段的存在合并两个排序文本文件的行。它是关系型数据库中使用的 `join`
    操作符的一种实现，但操作对象是文本文件。


    `join` 命令接受两个文本文件和若干选项作为输入。如果没有给出命令行参数，该命令将查找两个文件中具有相同第一个字段（一个与空格不同的字符序列）的行对，并输出一个由第一个字段以及另外两行的剩余部分组成的行。


    程序参数指定了使用哪个字符代替空格来分隔行的字段、在查找匹配行时使用哪个字段，以及是否输出不匹配的行。输出可以通过重定向存储到另一个文件中，而不是打印到屏幕。


    ### 语法概要

    ```

    join [OPTION]... FILE1 FILE2

    ```


    ### 描述

    对于每一对具有相同连接字段的输入行，向标准输出写入一行。默认连接字段第一个，由空白分隔。当 `FILE1` 或 `FILE2`（但不是两者）为 `-` 时，从标准输入读取。


    - `-a SIDE`: 打印来自文件 `SIDE` 的不可配行

    - `-e EMPTY`: 用 `EMPTY` 替换缺失的输入字段

    - `-i, --ignore-case`: 比较字段时忽略大小差异

    - `-j FIELD`:（过时）等同于 `-1 FIELD -2 FIELD`

    - `-j1 FIELD`:（过时）等同于 `-1 FIELD`

    - `-j2 FIELD`:（过时）等同于 `-2 FIELD`

    - `-o FORMAT`: 构建输出行时遵循 `FORMAT`

    - `-t CHAR`: 使用 `CHAR` 作为输入输出字段分隔符

    - `-v SIDE`: 类似于 `-a SIDE`，但抑制连接输出行

    - `-1 FIELD`: 根据文件 1 的 `FIELD` 连接

    - `-2 FIELD`: 根据文件 2 的 `FIELD` 连接

    - `--help`: 显示此帮助信息并退出

    - `--version`: 输出版本信息并退出


    除非给出 `-t CHAR`，否则领先空格分隔字段并忽略，否则字段由 `CHAR` 分隔。任何 `FIELD` 都是从 1 开始计数的字段编号。`FORMAT`
    是一个或多个由逗号或空白分隔的规范，每个规范为 `SIDE.FIELD` 或 `0`。默认 `FORMAT` 输出连接字段、来自 `FILE1` 的剩余字段、来自
    `FILE2` 的剩余字段，全部由 `CHAR` 分隔。


    例如，以下文件列了一些人的父亲和母亲：

    ```

    wayne nico

    terry solo

    solo krisha

    wayne kristel

    ```

    这两个文件的连接（不带参数）将产生：

    ```

    wayne nico kristel

    ```

    事实上，只有 "wayne" 是两个文件中共同的单词。


    ## Question 23: Xargs


    `xargs` 是什么？


    **A:** `xargs` 命令从标准输入读取参数，由空格（可以用双引号保护）或换行符分隔，并带有参数执行一次或多次命令，参数后跟标准输入。如果标准输入确实包含任何非空白内容。通常情况下，即使没有输入，命令也会运行一次。


    ### 选项：

    - `--null, -0`: 输入文件名以空字符而非空白符终止。禁用引号和反斜杠。此选项产生适用于此模式的输入。

    - `--eof[=eof-str], -e[eof-str]`: 将文件结束字符串设置为 `eof-str`。如果文件结束字符串作为输入行出现，则忽略剩余输入。如果省略
    `eof-str`，则没有文件结束字符串。默认值为 `_`。

    - `--help`: 打印 `xargs` 选项摘要并退出。

    - `--replace[=replace-str], -i[replace-str]`: 将初始参数中 `replace-str` 出现的地方替换为从标准输入读取的名称。如果省略
    `replace-str`，默认为 `"{}"`（类似于 `find -exec`）。它隐含 `-x` 和 `-l 1`。

    - `--max-lines[=max-lines], -l[max-lines]`: 每行命令行最多使用 `max-lines` 行非空白输入行；如果省略，`max-lines`
    默认为 1。末尾空白会导致输入行在逻辑上延续到下一行。隐含 `-x`。

    - `--max-args[=max-args], -n max-args`: 每行命令行最多使用 `max-args` 个参数。如果超过大小（参见 `-s`
    选项），将使用少于 `max-args` 的参数，除非给出了 `-x` 选项，此时 `xargs` 将退出。

    - `--interactive, -p`: 提示用户是否运行每个命令行并从终端读取一行。只有当响应以 `y` 或 `Y` 开头时运行命令行。隐含 `-t`。

    - `--max-chars[=max-chars], -s max-chars`: 每行命令行最多使用 `max-chars` 个字符，包括命令和初始参数以及字符串结尾的终止空。默认值为尽可能大，上限为
    20k 字符。

    - `--verbose, -t`: 在执行之前向标准错误输出打印命令行。

    - `--version`: 输出 `xargs` 的版本号并退出。

    - `--exit, -x`: 当超过大小（参见 `-s` 选项）时退出。

