    what is the device or partition and what is the mount point. The mount point specified
    for a device in `/etc/fstab` is its default mount point. That is the directory
    where the device will be mounted if you don''t specify any other mount point when
    mounting the device.


    Most Linux distros create special directories for mount points. Most distros create
    them under `/mnt`. If you type the following command:


    ```bash

    mount /dev/fd0

    ```


    Your floppy will be mounted in `/media/floppy`, because that''s the default mount
    point specified in `/etc/fstab`. If there is no entry for `/dev/fd0` in `fstab`
    when you issue the command above, `mount` gets very confused because it doesn''t
    know where to mount the floppy.


    You can freely change the default mount points listed in `/etc/fstab` if you''re
    not satisfied with the defaults your distro has given you. Just make sure the
    mount point is a directory that already exists on your system. If not, you can
    simply create it.


    Some partitions and devices are also automatically mounted when your Linux system
    boots up. For example, have a look at the example fstab above. There are lines
    that look like this:


    ```

    /dev/hda2 / ext2 defaults 1 1

    /dev/hdb1 /home ext2 defaults 1 2

    ```


    These lines mean that `/dev/hda2` will be mounted to `/` and `/dev/hdb1` to `/home`.
    This is done automatically when your Linux system boots up. If it doesn’t, you’ll
    have a hard time using your Linux system because all the programs you use are
    in `/` and you wouldn''t be able to run them if `/` wasn''t mounted. The system
    knows where you want to mount `/dev/hda2` and `/dev/hdb1` by looking at the `/etc/fstab`
    file.


    The third column in `/etc/fstab` specifies the filesystem type of the device or
    partition. Many different filesystems are supported but we''ll take a look at
    the most common ones only.


    Most likely your Linux partitions are `Ext3`. `Ext2` used to be the standard filesystem
    for Linux, but these days, `Ext3` and `ReiserFS` are usually the default filesystems
    for almost every new Linux distro. `Ext3` is a newer filesystem type that differs
    from `Ext2` in that it''s journaled, meaning that if you turn the computer off
    without properly shutting down, you shouldn''t lose any data and your system shouldn''t
    spend ages doing filesystem checks the next time you boot up.


    Your Linux partitions may very well be formatted as `ReiserFS`. Like `Ext3`, `ReiserFS`
    is a journaled filesystem, but it''s much more advanced than `Ext3`. Many Linux
    distros (including SuSE) have started using `ReiserFS` as their default filesystem
    for Linux partitions.


    The filesystem name is self-explanatory. The filesystem type `swap` is used in
    your swap partitions.


    Your Windows partitions are probably either `Vfat` or `NTFS`. The 9x series (95,
    98, ME) all use `Vfat` (more widely known as `FAT32`), and the NT series (NT,
    2000, XP) use `NTFS`. In 2000 and XP you can choose the filesystem type, so 2000
    and XP partitions may be formatted as `Vfat`, too. If you want to be able to write
    to your Windows partitions from Linux, I suggest formatting them as `Vfat`, because
    Linux''s support for writing to `NTFS` partitions is a bit shabby at this moment.


    The option `auto` simply means that the filesystem type is detected automatically.
    If you take a look at the example fstab above, you''ll see that the floppy and
    CD-ROM both have `auto` as their filesystem type. Their filesystem type may vary.
    One floppy might be formatted for Windows and the other for Linux''s `Ext2`. That''s
    why it''s wise to let the system automatically detect the filesystem type of media
    such as floppies and cdroms.


    The fourth column in `fstab` lists all the mount options for the device or partition.
    For more information, check out the man page of `mount`.


    With the `auto` option, the device will be mounted automatically at bootup or
    when you issue the `mount -a` command. `auto` is the default option. If you don''t
    want the device to be mounted automatically, use the `noauto` option in `/etc/fstab`.
    With `noauto`, the device can be mounted only explicitly.


    The `user` and `nouser` are very useful options. The `user` option allows normal
    users to mount the device, while `nouser` lets only the root to mount the device.
    `nouser` is the default, which is a major cause of headache for new Linux users.
    If you''re not able to mount your cdrom, floppy, Windows partition, or something
    else as a normal user, add the `user` option into `/etc/fstab`.


    The `exec` lets you execute binaries that are on that partition, while `noexec`
    doesn''t let you do that. `noexec` might be useful for a partition that contains
    binaries you don''t want to execute on your system or that can''t even be executed
    on your system. This might be the case of a Windows partition. `exec` is the default
    option.


    `ro` Mount the filesystem read-only.


    `rw` Mount the filesystem read-write. Again, using this option might cure the
    headache of many new Linux users who can''t write to their floppies, Windows partitions,
    or something else.


    `sync` means it''s done synchronously. If you look at the example fstab, you''ll
    notice that this is the option used with the floppy. This means that when you
    copy a file to the floppy, the changes are physically written to the floppy at
    the same time you issue the copy command.


    Then it''s done asynchronously. If you look at the example fstab, you''ll notice
    this is `rw`, `exec`, `auto`, `nouser` and `async`.


    `dump` is a backup utility and `fsck` is a filesystem check utility.


    The 5th column in `/etc/fstab` is the `dump` option. `dump` checks it and uses
    the number to decide if a filesystem should be backed up. If it''s zero, `dump`
    will ignore that filesystem. If you take a look at the example fstab, you''ll
    notice that 5th column is zero.


    The 6th column is an `fsck` option. `fsck` looks at the number in 6th column to
    determine in which order the filesystems should be checked. If it''s zero, `fsck`
    won''t check the filesystem.


    ### Question 88: special characters in a file name


    #### Why do some file names causes’ trouble?


    You can have weird file names on your Linux system if you want, like for example,
    having spaces in a file name. You can also use some strange characters in a file
    name like `&`, `*`, `\`, and `?`. The problems start when you try to use these
    files names at the command line.


    When you type commands at the prompt, spaces are often used for separating different
    commands, the command''s arguments, or different files. The shell doesn''t know
    that the bunch of text that follows your command is in fact one single file name.
    However, there''s an easy way to tell the shell that the bunch of text is just
    one file name, so having spaces in a file name usually isn''t a big problem.


    A more difficult thing is the special characters in file names. There are some
    characters that have a special meaning to the bash shell. For example, `*` and
    `?` are wildcards and `$` means a variable. Avoid using these characters in normal
    file names.


    If you have files with spaces or special characters in their names, you have two
    ways of dealing with them: quoting the file name or escaping the confusing characters.


    Quoting: Put the file name in single quotes ( '' '' ) so spaces or special characters
    won''t bother you anymore, for example:


    ```bash

    cat ''File With Spaces.txt''

    ```

