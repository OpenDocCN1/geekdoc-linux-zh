    All absolute file names start with a slash because the slash indicates the root
    directory. For example, there''s a directory called `/usr/X11R6/bin` on your system.
    The path here means that you start from the root directory (`/`), go to its subdirectory
    `"usr"`, which contains a directory called `"X11R6"`, which in turn contains the
    `"bin"` directory. As you noticed, you use the slash not only for indicating the
    root directory but also for separating the directories on the path. This is different
    from Windows where you use a backslash for separating the directories. To change
    the working directory, use the `cd` command and give the desired directory as
    an argument to it. Now, change your working directory to `/usr/X11R6`:


    ```

    me@puter: ~$ cd /usr/X11R6

    ```


    Now check if your new working directory really is what you wanted:


    ```

    you@puter: /usr/X11R6$ pwd

    /usr/X11R6

    you@puter: /usr/X11R6$

    ```


    Take note that the command prompt has changed. Usually it''s configured to display
    the name of the working directory. Now you don''t have to type `pwd` all the time.


    You already know that an absolute pathname starts from the root directory. However,
    a relative pathname starts from the working directory. This is why you need some
    special symbols for indicating the relative positions in the filesystem. These
    symbols are a dot (`.`) and two dots (`..`) and they mean the working directory
    and the parent directory, respectively.


    Let''s see how these things work. Now your current working directory should be
    `/usr/X11R6/`. List the contents of it:


    ```

    you@puter: /usr/X11R6$ ls

    bin include lib man

    you@puter: /usr/X11R6$

    ```


    There should be a directory called `"lib"` and you want to find out what it contains
    but you don''t want to change the working directory. There are two ways of doing
    this. Use the absolute pathname:


    ```

    you@puter: /usr/X11R6$ ls /usr/X11R6/lib

    ```


    Or use the relative pathname:


    ```

    you@puter: /usr/X11R6$ ls ./lib

    ```


    Here, the dot in the path `./lib` refers to the working directory which is `/usr/X11R6/`.
    You will save some more typing if you omit the leading dot. In most cases you
    don''t need it, so this would''ve been the same as the above:


    ```

    you@puter: /usr/X11R6$ ls lib

    ```


    Now let''s change the working directory to `/usr/X11R6/bin`. There are also two
    ways of doing this. You can use absolute pathname:


    ```

    you@puter: /usr/X11R6$ cd /usr/X11R6/bin

    ```


    Or use relative pathname (omit the dot):


    ```

    you@puter: /usr/X11R6$ cd bin

    ```


    Now your current working directory is `/usr/X11R6/bin`. To change it to `/usr/X11R6`
    which is the parent directory, use the absolute pathname:


    ```

    you@puter: /usr/X11R6/bin$ cd /usr/X11R6

    ```


    However, it''s faster to use the two dots (parent directory):


    ```

    you@puter: /usr/X11R6/bin$ cd ..

    ```


    Note the space between `cd` and the dots. In many cases using relative pathnames
    instead of absolute ones saves some typing.


    ### Question 69: Determine the type of a file


    How do I determine the type of an unfamiliar file on the Linux system?


    A: If you see a strange file on your system and don''t know what it is, it''s
    often helpful to determine its type. If the file has a file name extension, you
    probably can determine its type easily, but if you don''t recognize the extension
    or if the file doesn''t have one, you need different ways of finding out what
    sort of a file it is. This is where the `file` command comes in handy. The `file`
    command examines a file''s contents and tells you what kind of a file it is:


    ```

    you@puter: ~$ file examine.html

    examine.html: HTML document text

    you@puter: ~$

    ```


    You can also give multiple files as arguments to `file`, if you want:


    ```

    you@puter: ~$ file view_this picture.gif

    view_this: ASCII English text

    picture.gif: GIF image data, version 89a, 88 x 31

    you@puter: ~$

    ```


    Just give the file name as an argument to `file` and then it tells you the type
    of the file and maybe some additional information about it.


    ### Question 70: Permissions and ownership


    I’m the only user in my Linux and I cannot access some of my files. Have I misconfigured
    file access permissions?


    A: Linux is designed to be a multi-user environment. It is necessary to have a
    secure system for deciding which files are yours and who can fiddle with them.
    Even if you''re the only user on an ordinary desktop system, file permissions
    helps you keep your important files.


    User: The owner of the file.

    Group: The group the file belongs to.

    Other: Everyone else.


    There are three types of access on Linux: read, write, and execute.


    - **Read permission**: On a regular file, the read bit means the file can be opened
    and read. On a directory, the read permission means you can list the contents.

    - **Write permission**: On a regular file, the write bit means you can modify
    the file. On a directory, the write permission means you can add, remove, and
    rename files.

    - **Execute permission**: In the case of a regular file, this means you can execute
    the file as a program or a shell script. On a directory, the execute permission
    allows you to access files.


    ### Question 71: View file permissions


    How can I view file permissions?


    A: You can view the access permissions of a file by doing the long directory listing
    with the `ls -l` command. For example, it may look like this:


    ```

    you@puter: /home/writers$ ls -l

    total 10

    drwxr-xr-x 3 dan writers 180 2005-10-05 21:37 dir

    -rw-r----- 2 dan writers 818 2005-09-04 13:35 file

    -rwxr-xr-x 1 dan writers 1348 2005-08-03 20:31 otherfile

    ```


    The first column shows the file type and permissions. The second column shows
    the number of links or directory entries that refer to the file, the third shows
    the owner of the file and the fourth one shows the group the file belongs to.
    The other columns show the file''s size in bytes, date and time of last modification
    and the filename.


    The first column shows the files’ permissions is arranged into four separate groups.
    The first group consists of only one character and it shows the file''s type.
    For example, `d` means a directory and `-` means a normal file.


    The first character can be any of these:


    - `d` = directory

    - `-` = regular file

    - `l` = symbolic link

