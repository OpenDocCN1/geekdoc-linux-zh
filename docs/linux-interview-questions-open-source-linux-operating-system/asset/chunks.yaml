- fmt: '

    As mentioned, Linux is becoming one of the “hottest” software systems. Virtually
    all of the major companies—IBM, HP, Sun Microsystems, etc.—are promoting it and
    Linux is a leading corporate choice for Web servers. Linux is the main operating
    system used.


    Linux is also starting to make inroads in large desktop markets, such as businesses,
    schools and so on, due to its high reliability, lower rate of infection by viruses
    and the like, and its low cost.


    The Linux community shares. That means that people online are much more willing
    to help you and more open source software is available. If you are a university
    computer science student, there are some very important additional advantages:


    Many CS courses make specific use of UNIX, and thus their work cannot be done
    on Windows platforms. Since it is a full UNIX system, Linux allows students to
    do their homework in the comfort of their own homes.


    In installing and using Linux, students learn many practical things about computers
    which they do not learn in coursework. This practical experience can also help
    you in job interviews, both for permanent jobs after graduation and for summer
    jobs and co-ops during your college years. Even if the job you interview for does
    not involve UNIX, you will definitely impress the interviewer if, for example,
    you discuss various things you have done to use and customize your Linux system.


    # Chapter I: Linux Basics


    ## Question 01: Shells


    What is a shell?


    A: A shell can best be described as a language to communicate with a computer.
    Most users operate with the point-and-click language of the desktop but the computer
    is leading the conversation in this kind of language. The user has the passive
    role of picking tasks from the choice presented by the computer. It is very difficult
    for a programmer to include all options and possible uses of a command in the
    Graphical User Interface (GUI) format. Thus, GUIs are almost always less capable
    than the command or commands that form the backend.


    Shell is an advanced way of communicating with the system because it allows for
    two-way conversation. Interactions in the communication are equal so that new
    ideas can be tested. The shell allows the user to handle a system in a very flexible
    way and allows for task automation.


    When you mess around in the Linux command line, there''s always a program called
    `shell` running. When you type commands, it''s the `shell` that reads the commands
    from your keyboard, processes them and finally gives them to the operating system.
    There are many different shell programs available but on most Linux systems, `bash`
    (Bourne Again Shell) is the default shell. When you start a shell on your Linux
    system, it''s most likely `bash`.


    ## Question 02: Virtual Terminal and Terminal Emulator


    I’m in the X Window System (the GUI) right now. How do I get to the Command Line
    Interfaces (CLI)?


    A: You can start playing with the CLI by switching to another virtual terminal
    or you can start a terminal emulator.


    A terminal emulator is a program that opens up a window and then runs a `shell`
    in that window. Start a terminal emulator like any other X program, so it means
    that you can have a command line while you''re still safely in the GUI. Now browse
    the programs menu that you normally use for launching programs and look for applications
    that seem like a terminal emulator (`xterm`, `rxvt`, `gnome-terminal`, `konsole`,
    `kvt`, `eterm`, etc…). You can launch as many of them as you want and try all
    of them. They all basically do the same thing; it lets you use the `shell`. The
    different terminal emulators run the same shell program `bash`, in each of them.


    Another way of getting to the CLI is to switch to another virtual terminal while
    the X Window System is still running. By default, Linux usually has six virtual
    terminals and the seventh one is where X is running. You can switch the virtual
    terminals by pressing `Ctrl+Alt` and the function key with the number of the desired
    terminal. Pressing `Ctrl+Alt+F1` takes you to the first virtual terminal, `Ctrl+Alt+F2`
    takes you to the second virtual terminal and so on.


    When you''re in the virtual terminals, you''re not in the GUI (X Window System)
    anymore but in the CLI. The GUI is still running in the seventh virtual terminal
    so you can just switch back there normally with `Ctrl+Alt+F7`.


    When the terminal displays the `login:` prompt, you can now type in your user
    name and log in normally in the terminal. Maybe doing things in X with a terminal
    emulator would be easier at first but it doesn''t matter because the result is
    the same: you have a `bash` prompt in front of you. The prompt will wait for you
    to type a command or a name of a program. For example, try typing `ls`. As you
    can see from the output, the command `ls` list the contents of your current directory.
    All the commands in Linux are little programs themselves and you can run the programs
    by typing their name.


    ## Question 03: Linux directory structure


    How is the Linux system structured?


    A: The following are some list of directories that will show you the most interesting
    places.


    `/`: The root directory is the starting point of your directory. Every other file
    and directory on your system is under the root. Usually the root directory contains
    only subdirectories and it is not advisable to store single files directly under
    root.


    `/boot`: This is where Linux keeps information that it needs when booting. If
    you list the contents of `/boot`, you''ll see a file called `vmlinuz` - that''s
    the kernel.


    `/etc`: This is the configuration files for the Linux system. Most of these files
    are text files and can be edited manually. Here are some contents of this directory:


    `/etc/inittab`: A text file that describes what processes are started at system
    boot and during normal operation. Here you can determine if you want the X Window
    System to start automatically at bootup and configure what happens a user presses
    `Ctrl+Alt+Del`.


    `/etc/fstab`: This file contains descriptive information about the various file
    systems and their mount points, like floppies, cdroms, etc.


    `/etc/passwd`: A file that contains various pieces of information for each user
    account. This is where the users are defined.


    `/bin`, `/usr/bin`: These two directories contain a lot of programs for the system.
    The `/bin` directory contains the most important programs that the system needs
    to operate, such as the shells, `ls`, `grep`, and other essential things. `/usr/bin`
    in turn contains applications for the system''s users.


    `/sbin`, `/usr/sbin`: Most system administration programs are stored in these
    directories. In many cases you must run these programs as the root user.


    `/usr`: This directory contains user applications and a variety of other things
    for them, like their source codes, pictures, docs, or config files they use. `/usr`
    is the largest directory on a Linux system and some people like to have it on
    a separate partition. Here are some contents of the `/usr`:


    `/usr/doc`: Documentation for the user apps in many files formats.


    `/usr/share`: Config files and graphics for many user apps.


    `/usr/src`: Source code files for the system''s software including the Linux kernel.


    `/usr/include`: Header files for the C compiler. The header files define structures
    and constants that are needed for building most standard programs. A subdirectory
    under `/usr/include` contains headers for the C++ compiler.

