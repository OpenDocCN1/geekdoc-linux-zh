  trans: '

    然而，打算使用 `Loadlin` 的用户无法使用 `Disk Druid`，他们必须使用 `Linux Fdisk`，虽然它的名声可能人生畏，但实际上非常简单。在出现安装类型界面，选择
    `custom` 并使用 `fdisk`（你会在屏幕顶部找到一个带有 `fdisk` 字样的按钮）。由于某种原因，如果你的 `/boot` 分区超过了 `1024`
    扇限制，`Disk Druid` 不让你继续安装，因此如果你尝试用它创建分区，安装程序将拒绝继续。


    `Fdisk` 是一个非常直观且易于使用的程序。首先，你必须使用 `Fips` 删除刚刚创建的分区。很多人不理解为什么要冒着风险删除刚刚创建的分区。这个新分区实际上是一个
    `FAT32` 分区，Linux 无法使用，当你删除它时，它不会变回 `C`盘的一部分，而是变为 `UNPARTITIONED FREE SPACE`（未分区空闲），你可以用它创建新分区。


    ### Fdisk 操作

    你必须理解几个 `Fdisk` 操作：

    - 输入 `m` 列出所有选项；

    - 在提示符处输入 `p` 显示当前分区表；

    - `d` 删除分区；

    - `n` 创建分区；

    - `q` 退出且不保存更改（所以如果你犯了任何错误，无用担心，只需输入 `q` 重新开始即可）；

    - `w` 将更改写入分区表（仅在确认后使用）；

    - `L` 显示不同分区类型的十六进制数（你只需要知道两个：`Linux native` 的十六进制数是 `83`，`Linux swap` 的十六进制数是
    `82`）。


    虽然 `Disk Druid` 允许你在不进入十六进制的情况下挂载交换分区，但在 `Fdisk` 中，创建交换分区的唯一方法是给它分配正确的十六进制数，即
    `82`。


    ### 分区过程

    让我们开始吧，在 `Fdisk` 提示符处输入 `p`，你将看到当前分区表。输入 `d` 并选择你想删除的分区，在这种情况下是 `/dev/hda2`（直接输入
    `2`），再次输入 `p`，你将看到分区表中反映了变化。


    现在将只有一个 `FAT32` 分区 `/dev/hda1`（实际上是 `C` 盘）。输入 `n` 创建新分区，分区类型在 `primary` 或 `extended`
    之间选择 `e`。这方面没有硬性规定。例如，你可以为 `/boot` 设置一个主分区，并设置包含两个逻辑分区 `/` 和 `swap` 的扩展分区。我建议设置一个包含三个逻辑分区的扩展分区。


    现在你必须正确调整扩展分区的大小，因为它是三个逻辑分区的容器。从现在起你只需要响应 `Fdisk` 的提示。它会要求你设置要创建的扩展分区的大小。该分区将从你的
    Windows 分区结束处开始，到磁盘末尾结束。你可以以 `M`（兆字节）扇区数或 `K`（千字节）提供大小。接受分区起始位置的默认值，并选择结束扇区号——`Fdisk`
    会给你提供结束扇区号。


    对三个逻辑分区重复此操作，但这次你必须选择 `logical` 而不是 `extended` 以及适当的大小：

    - 引导分区使用 `16Mb`；

    - 交换分区使用 `127Mb`（交换分区的大小取决于安装的内存，建议为内存的两倍）；

    - 剩余空空间用于根 (`/`) 分区。


    创建完三个分区后，输入 `p`，你将看到刚刚创建的分区。将会有 `/dev/hda2`（扩展）、`/dev/hda5`（逻辑）、`/dev/hda6`（逻辑）和
    `/dev/hda7`（逻辑）。只剩最后一件事：为交换分区设置十六进制数。输入 `t` 并选择你创建的 `127Mb` 分区（即 `/dev/hda6`），输入分区号
    `6` 和十六进制数 `82`（系统会提示你输入），你就完成了分区。在确认无误后输入 `w`，`Fdisk` 将写入新的分区表并退出。


    ### 完成安装

    下一个屏幕将是 `Lilo` 朋友们已经见过的 `Disk Druid` 界面，你只需要用 `Disk Druid` 挂载分区。选择 `/dev/hda5`（`16Mb`
    分区）并将其挂载为 `/boot`。选择 `/dev/hda7` 并将其挂载为 `/`（根分区）。


    其余安装步骤非常直观。选择你需要的软件包，在有机会时选择启动磁盘（这对 `Loadlin` 用户来说绝对关重要），并重启系统。`Lilo` 用户应在 `Lilo`
    提示符处按 `dos` 进入 Windows。`Lilo` 用户这次应重启系统，并在 `Lilo` 提示符处输入 `linux` 进入 Linux，根据你所做的选择，你将进入控制台或
    `gnome`/`kde` 桌面。先登录控制台而不是图形界面启动 `X` 始终是个好主意，因为如果 `X` 崩溃，你仍然可以访问系统进行补救。


    `Lilo` 设置为启动进入 Linux。在 `Lilo` 提示符处输入 `linux`，根据你的选择，你将进入控制台或 `gnome` 或 `kde` 桌面。

