    ## Question 98: XF86Config File


    Where is XF86Config file used?


    A: The configuration file `XF86Config` of the X Window System is used by the X
    server to set necessary configuration parameters. It is a plain text file ordered
    into sections and subsections. Important sections are `Files`, `Input Device`,
    `Monitor`, `Modes`, `Screen`, `Device`, and `Server Layout`.


    Sections can appear in any order and there may be more than one section of each
    kind, for example, if you have more than one monitor, say a video projector and
    an on board LCD of a notebook.


    The `Monitor` sections are for the physical displaying devices, the `Screen` sections
    are for the logical displays, so you can have two monitors displaying the same
    content or entirely different information.


    The option `"SWCursor"` in the `Device` section for example controls whether the
    mouse pointer is mirrored on an external monitor or suppressed. On typical Unix
    like systems the file often is found in `/etc/X11` and a log file is in `/var/log`,
    typically named `XFree86.0.log` for the last start of X and `XFree86.0.log.old`
    for the previous one.


    Inappropriate editing of this file may result in a black or illegible screen or
    might even damage the monitor, especially if it is a CRT. If you need to change
    the configuration, be sure to know how to start the computer in text mode so you
    can undo any changes to the last working configuration.


    ## Question 99: Configuration Files


    Where can I find the configuration files in Xfree86?


    A: The configuration file for `XFree86` is usually located at `/etc/X11/XF86Config`
    (but sometimes also called `XF86Config-4` to avoid confusing it with the XFree86
    3.x.x version). Many GUIs have been created to ease the configuration, this is
    usually distribution dependent (e.g. Suse uses `sax2`, Debian uses `debconf` to
    generete it).


    The configuration file is split into sections (not all sections are required and
    some sections can exist multiple times):


    - **Files**: The `XF86Config` or `XF86Config-4` is located in `/etc/X11`. Note
    that new distributions now are using `xorg.conf` instead of `XF86Config`. `xorg.conf`
    is in the same location and has the same settings and style.

    - **ServerFlags**: General server configuration options;

    - **Module**: Configure which modules are loaded;

    - **InputDevice**: Configure input devices like mouse and keyboards; To get mousewheel
    working: Change mouse protocol to `"IMPS/2"`. Option `"ZAxisMapping" "4 5"`

    - **Device**: Configure graphic devices/video cards. For Example (an nVidia GeForce
    TwinView Setup with the proprietary drivers):


    ```text

    Section "Device"

    Identifier"GeForce 4 Ti 4600"

    Driver "nvidia"

    Option "TwinView"

    Option "MetaModes""1024x768, 1024x768; 800x600, 800x600"

    Option "SecondMonitorHorizSync" "30-70"

    Option "SecondMonitorVertRefresh""50-120"

    Option "ConnectedMonitor" "CRT, CRT"

    End Section

    ```


    The `''Section "Device"''` and `''EndSection''` are part of the Syntax and must
    be present. The `Driver` is what driver your card requires. The `Option` lines
    are passed to the driver to get wanted functionality.


    - **Monitor**: Configure monitors. Change `Identifier` to whatever you want (the
    name and model of your monitor) but remember to change it also under `"monitor"`
    in the screens section. Don’t forget that entering the wrong values can damage
    your monitor.

    - **Modes**: Define special modelines

    - **Screen**: Define viewing screens. For example:


    ```text

    Section "Screen"

    Identifier"Default Screen"

    Device "Generic Video Card"

    Monitor"Generic Monitor"

    DefaultDepth 24

    SubSection "Display"

    Depth 1

    Modes "2048"

    ```

