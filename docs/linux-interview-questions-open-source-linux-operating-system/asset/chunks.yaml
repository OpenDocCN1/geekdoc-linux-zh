    root directory you can place it in another directory or give it another name.
    Add the following line to your autoexec.bat file c:\linux . The main thing if
    you are using a .bat file is to tell Loadlin where to find the kernel image file
    (vmlinuz). The above .bat file gives you the option to boot into Linux before
    Windows loads by typing y (for Linux) or n (for Windows) within five seconds at
    which point it boots Windows.


    [Question 62: Remove Linux and restore Windows partition](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    How do I remove Linux and restore Windows to its original state using Lilo or
    Loadlin?


    A: Removing Linux depends whether you are using Lilo or Loadlin. Lilo users have
    to first restore their original MBR either by typing /sbin/lilo -u within Linux
    or typing fdisk /MBR in DOS. The next steps are common for both Loadlin and Lilo
    users. These are not really necessary but just to be on the safe side, try to
    do them.


    Boot using the Linux installation CD and type Linux expert at the first prompt,
    answer whatever you wish to the next questions until you get to the install selection
    screen. Here, select Install and With Fdisk and use Fdisk to delete all Linux
    partitions. Write the changes to disk and Ctrl–Alt–Delete your way out of the
    installation program or reset your system to reboot. Remember to change the BIOS
    settings to boot from the hard disk or else you will reboot from the CDROM again.


    Reboot once again, this time with the fips disk that has the backup of your partition
    table and boot sector and type restorrb at the prompt. Answer yes to the question,
    the program will restore your partition table and boot sector. Now you have reclaimed
    the lost partition space. This is the more reason for making sure that the crucial
    backup file (Rootboot.000) is saved in at least several different locations. It’s
    better to be safe than sorry. Reboot back into Windows and run scandisk on the
    newly increased C drive. It will report one error in the fsinfo sector which is
    just a used and free space accounting error. Your Linux data is now naturally
    lost for ever. Hopefully this procedure won''t be necessary unless you are increasing
    space allocated to Linux or getting rid of Windows.


    [Question 63: Choosing a package](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    Which package should I install?


    A: Linux software comes in "packages". For example, Linux Mandrake 7.0 installation
    CD contained 1002 packages. Mandrake 7.2 packs 2 CDs of software will put 1123
    packages on the hard drive. Mandrake tends to pack more software than RedHat.


    No matter what distribution or version, the CD contains packages that make the
    base operating system (kernel, libraries, a selection of command-line configuration
    and maintenance tools, etc) a rich selection of networking "clients" and servers"
    with appropriate configuration and monitoring tools, some end-user text mode applications,
    base X-windowing system and at least one GUI desktop and it’s applications.


    The installation program (either RedHat or Mandrake) will ask you which packages
    to install. If you select "workstation installation", then the packages normally
    found on servers will be omitted from your installation. If you choose "server
    installation", then typically the end-user desktop applications will not be installed.
    You can also choose to install "everything" and this is a popular option for a
    home computer installation. If you are a newbie, it pays to trust the defaults
    selected by your distribution creator.


    I suggest for you to stay away from the tempting installation option "expert install--select
    packages manually" unless you wish to install everything anyway. For starters,
    I like the safe "max default installation", however this installation option is
    called on your CD.


    You can easily install a package that you may find need for it later.


    [Question 64: KDE or GNOME](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    Which GUI desktop should I install, KDE or GNOME?


    A: If you have enough disk space, definitely install both. You can later decide
    if you prefer KDE, GNOME or another desktop but whatever your choice, you definitely
    want both the KDE and the GNOME libraries installed. Once you have the libraries
    installed, KDE programs can be run under GNOME and vice versa, which is great
    because there are nice applications written using either library. As far as the
    amount of disk space is concerned, the "desktop" is only a small part of the KDE
    and GNOME systems so you don''t save much space by omitting the desktop and trying
    to install "libraries only". Both GNOME and KDE come with a set of nice programs
    and tools, so it is definitely worth it to install both desktops in full. I never
    heard that the two adversely interfered with each other. For every day work, use
    the KDE desktop because it feels more solid than GNOME.


    You can also install the other "alternative windows managers". They hardly take
    any space and can be useful under some situation. You can run any KDE or GNOME
    application from under any of them as long as KDE and GNOME libraries are installed.


    KDE is more power hungry. On older hardware (e.g., 133 MHz Pentium), GNOME is
    preferable to KDE. Other windows managers are lighter than either KDE or GNOME.
    Hence on a really modest hardware, choose one of the "alternative" windows managers.


    [Question 65: Log-in as root](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    I finished the installation. How do I log-in for the very first time?


    A: Log-in as root. "root" is the only account that exists after the initial installation
    (newer installation programs do prompt you to create a regular user account during
    the installation). Example text mode login:


    my_machine_name login: root


    Password: my_password


    In the example above, I typed the word "root" at the login prompt. After that,
    I entered the password that I chose during the initial Linux installation. The
    password did not appear on the screen when I typed it (for security reasons).
    After I login, I find myself in a text-mode terminal.


    If you installed the GUI login screen, the login procedure looks similar but occurs
    on an X-window screen (if you occasionally have problems typing there, perhaps
    remember that your mouse cursor must be above the dialog box. The X login screen
    implements the "focus-follows-mouse" policy). After a successful login, my default
    GUI desktop is launched.


    "root" is a special account with an absolute power over the system, and it is
    used for system administration. You surely want to create at least one more "user"
    account later to do regular work.


