    I’m migrating to Linux from Microsoft Windows. I inserted my floppy and CD into
    the drive and I was not able to access it.


    Why did this happen?


    A: If you''re migrating to Linux from Microsoft Windows, you''re probably used
    to accessing all your file systems very easily. However, this isn''t the case
    in Linux. Your floppies, CDs, hard disk partitions and other storage devices must
    be attached to some existing directory on your system before they can be accessed.
    This attaching is called mounting and the directory where the device is attached
    is called a mount point.


    After the device is mounted, you can access the files on that device by accessing
    the directory where the device is attached. When you''re done and want to remove
    the floppy or CD or other device, you need to detach, unmount it before removing
    it.


    Mounting is done with the mount command.


    When mounting, you must tell the mount command what is the device or partition
    you want to mount and what is the mount point. The mount point must be a directory
    that already exists on your system. For example, to mount your floppy:


    $ mount /dev/fd0 /mnt/floppy


    In this example, /dev/fd0 is your floppy drive, and /mnt/floppy is the mount point.
    Now when you access /mnt/floppy, you''ll actually access the files on your floppy.


    Usually /dev/fd0 is your floppy drive, although some distros are configured so
    that /dev/floppy is the same thing as /dev/fd0\. Usually your CD-ROM is configured
    the same way: /dev/cdrom is your CD-ROM device (or, more specifically, /dev/floppy
    is a symbolic link to your actual floppy drive and /dev/cdrom is a symbolic link
    to your CD-ROM drive).


    Although many Linux distros have directories like /mnt/floppy or /floppy created
    by default so you can mount your floppies there, you''re not forced to use these
    directories. You can mount your devices or partitions into any existing directory
    you want usint the mount command.


    Usually your Linux distro is configured so that one particular directory is the
    default mount point for one particular device. In most distros it''s /mnt/floppy
    or /floppy for floppies, and /mnt/cdrom or /cdrom for CD-ROMs. When this is the
    case, you don''t need to tell mount the whole device name: just give either the
    device or mount point. For example, if /mnt/ floppy is the default mount point
    for /dev/fd0, this would mount your floppy:


    $ mount /mnt/floppy


    The default mount points for different devices are configured in a file called
    /etc/fstab. The root user can freely edit the mount points configured in that
    file.


    In Mandriva Linux, you can just stick in your floppy or CD-ROM and immediately
    access the files on them without mounting them first. After you''re done, you
    can just remove them from the drive without unmounting them first. This can be
    done because of a tool called automount, where it automatically mounts all the
    partitions and devices listed in /etc/fstab, no matter if the devices are physically
    there or not. This way you can access devices in Mandriva without mounting and
    unmounting them yourself.


    [Question 86: Unmounting files](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    How do I safely unmount then?


    A: Unmounting is done with the unmount command.


    When unmounting, you''ll need to tell unmount what mounted device to unmount,
    either by telling what''s the device or the mount point. For example, if /dev/fd0
    is mounted to /mnt/floppy, you''ll unmount it with:


    $ umount /mnt/floppy


    or


    $ umount /dev/fd0


    It''s not wise to remove the floppy from the floppy drive without unmounting it
    first. In the worst case the data you were writing to the floppy wasn''t written
    into it yet. With CD-ROMs you can''t do this: the tray won''t even open if you
    haven''t unmounted the CD first.


    [Question 87: fstab](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    What is fstab and why is it useful?


    A: fstab is a configuration file that contains information of all the partitions
    and storage devices in your computer. The file is located under /etc, so the full
    path to this file is /etc/fstab.


    /etc/fstab contains information of where your partitions and storage devices should
    be mounted and how. If you can''t access your Windows partition from Linux, aren''t
    able to mount your CD or write to your floppy as a normal user, or have problems
    with your CD-RW, you probably have a misconfigured /etc/fstab file. You can usually
    fix your mounting problems by editing your fstab file.


    /etc/fstab is just a plain text file, so you can open and edit it with any text
    editor you''re familiar with. However, note that you must have the root privileges
    before editing fstab. So, in order to edit the file, you must either log in as
    root or use the su command to become root.


    Everybody has a bit different /etc/fstab file because the partitions, devices
    and their properties are different on different systems. But the basic structure
    of fstab is always the same. Here''s an example of the contents of /etc/fstab:


    /dev/hda2 / ext2 defaults1 1


    /dev/hdb1 /home ext2 defaults1 2


    /dev/cdrom /media/cdrom auto ro,noauto,user,exec0 0


    /dev/fd0 /media/floppy auto rw,noauto,user,sync0 0


    proc/proc proc defaults0 0


    /dev/hda1 swap swap pri=420 0


    Every line (or row) contains the information of one device or partition. The first
    column contains the device name, the second one its mount point, third its filesystem
    type, fourth the mount options, fifth (a number) dump options, and sixth (another
    number) filesystem check options.'
