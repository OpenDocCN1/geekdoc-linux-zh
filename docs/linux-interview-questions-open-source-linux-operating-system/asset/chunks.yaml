    # Question 27: The /proc file system


    What exactly is `/proc` file system in LINUX? How does it work?


    A: Under Linux, `/proc` provides information on any running process at `/proc/PID`.
    It also includes the ff:


    - A symbolic link to the current (traversing) process at `/proc/self`

    - Information on hardware, kernel, and module configuration

    - Access to dynamically-configurable kernel options under `/proc/sys`

    - Information about the system as a whole, such as `/proc/meminfo`, which provides
    memory statistics.


    The basic utilities that use `/proc` can be located in the `procps` package. It
    is required that `/proc` is mounted in order to function.


    The `procfs` plays an important role in moving functionality from kernel mode
    to user mode. For example, the GNU version of `ps` operates entirely in user mode,
    using the `procfs` to obtain its data.


    The `/proc` filesystem contains an illusionary filesystem. It does not exist on
    a disk. Instead, the kernel creates it in memory. It is used to provide information
    about the system (originally about processes, hence the name). Some of the more
    important files and directories are explained below. The `/proc` filesystem is
    described in more detail in the `proc` manual page.


    ### `/proc/1`

    A directory with information about process number 1. Each process has a directory
    below `/proc` with the name being its process identification number.


    ### `/proc/cpuinfo`

    Information about the processor, such as its type, make, model, and performance.


    ### `/proc/devices`

    List of device drivers configured into the currently running kernel.


    ### `/proc/dma`

    Shows which DMA channels are being used at the moment.


    ### `/proc/filesystems`

    Filesystems configured into the kernel.


    ### `/proc/interrupts`

    Shows which interrupts are in use, and how many of each there has been.


    ### `/proc/kcore`

    This represents an image of the physical memory of the system. This is exactly
    the same size as your physical memory but does not really take up that much memory;
    it is generated on the fly as programs access it. (Remember: unless you copy it
    elsewhere, nothing under `/proc` takes up any disk space at all.)


    ### `/proc/kmsg`

    Messages output by the kernel. These are also routed to syslog.


    ### `/proc/ksyms`

    Symbol table for the kernel.


    ### `/proc/loadavg`

    The `load average` of the system; three meaningless indicators of how much work
    the system has to do at the moment.


    ### `/proc/meminfo`

    Information about memory usage, both physical and swap.


    ### `/proc/modules`

    Which kernel modules are loaded at the moment.


    ### `/proc/net`

    Status information about network protocols.


    ### `/proc/self`

    A symbolic link to the process directory of the program that is looking at `/proc`.
    When two processes look at `/proc`, they get different links. This is mainly a
    convenience to make it easier for programs to get at their process directory.


    ### `/proc/stat`

    Various statistics about the system, such as the number of page faults since the
    system was booted.


    ### `/proc/uptime`

    The time the system has been up.


    ### `/proc/version`

    The kernel version.


    Please take note that while the above files tend to be easily readable text files,
    they can sometimes be formatted in a way that is not easily digestible. There
    are many commands that do little more than read the above files and format them
    for easier understanding.


    # Question 28: OpenGL - hardware acceleration


    I have installed all drivers and I have a problem with Open GL, Quake 3 fps is
    too low but in Windows 2K it runs fine.


    What is the proper procedure to accelerate my hardware?


    A: Try to check if 3D hardware acceleration is working for openGL by using the
    following command:


    ```

    glxinfo |grep rendering

    ```


    This should output "direct rendering: Yes". If it gives the same but then with
    "No", hardware 3d acceleration is disabled and all rendering will be done on the
    CPU.


    If it''s a ''No'', check the following:


    Rerun `glxinfo` with debugging output: In a bash shell this can be done by running:


    ```bash

    LIBGL_DEBUG=verbose glxinfo

    ```


    This should give some extra info at the top of the output. The common error shown
    is “permission denied” messages on the `drm` device. This is often caused by not
    having loaded the `drm` kernel module for your video card or there could be some
    error message in the kernel log when you tried loading it. Another cause can be
    the permissions set on the `drm` device. This can be configured in the ''DRI''
    section of the `XF86Config`.


    Another common error is having multiple `libGL` library files installed on the
    system (often caused by installing different drivers and XFree86 versions on top
    of a current XFree86 install). Check to which `libGL` `glxinfo` is linked with:


    ```bash

    ldd `which glxinfo`

    ```


    This will output a list of libraries then look for a line similar to this one:


    `libGL.so.1 => /usr/X11R6/lib/libGL.so.1 (0x400a2000)`


    Check the file that it''s pointing to (this of often a symlink itself, keep following
    it until you reach the real file). Make sure this `libGL` library matches your
    XFree86 version or your card driver. Also check your system of more (non-symlink)
    `libGL` files. It often happens that there is one in `/usr/lib` and another in
    `/usr/X11R6/lib`. There should only be one real file and the rest should all be
    symlinks pointing the correct one.


    # Question 29: Scan ide devices


    I installed a brand new hard drive and issuing the `fdisk -l` command shows the
    drive as `/dev/hdb`.


    Is there a way to list the file system?


    A: You have to create a partition table and then create a file system in the partition/s.


    Enter the `cfdisk /dev/hdb` command either in your `cfdisk` (if you have one)
    or enter the `fdisk /dev/hdb` command.


    Now create a partition and make it type 83. Write the partition table back onto
    the disk. Exit the `cfdisk` or `fdisk` utility.


    Next you have to create a file system. This is the same as you format a partition
    in Windows. In Linux we use the `mkfs` command. Do this to create an ext2 file
    system on `/dev/hdb1` if you want to use ext2.


    ```bash

    mkfs -t ext2 -cv /dev/hdb1

    ```


    This command will take some time to end because it also checks the partition for
    bad blocks as it creates the file system.


    Once it’s done, then you can mount the file system. Assume you want to mount this
    file system at `/mnt/hdb1`. Then you have to create the directory where you want
    to mount it after which you mount the file system. Note that you only have to
    create the directory/mount point once.


    ```bash

    mkdir /mnt/hdb1

    mount /dev/hdb1 /mnt/hdb1

    ```


    Now you can enter the following line in your `/etc/fstab` file to mount the file
    system automatically when you restart Linux.


    If you don’t want people from running programs that are on this partition, do
    this using the `noexec` option. This would go next to the word `defaults` in the
    fstab entry as in:


    ```

    /dev/hdb1 /mnt/hdb1 ext2 defaults 0 0

    /dev/hdb1 /mnt/hdb1 ext2 defaults,noexec 0 0

    ```


    You can look up all of the mount options by looking at the man page for the `mount`
    command and the man page for the `fstab` file.


    # Question 30: Partition Table


    What does a partition table look like?


    A: One may have an arbitrary number of partitions on a disk. However, the Master
    Boot Record (MBR, sector 0 of the disk) only holds descriptors for 4 partitions,
    called the primary partitions. Usually the BIOS can boot only from a primary partition.
    (Of course it can boot a boot loader that itself is able to access non-primary
    partitions or other disks.) The descriptors for the remaining partitions, called
    logical partitions, are scattered along the disk in a linked list of partition
    table sectors, starting with the MBR.

    '
