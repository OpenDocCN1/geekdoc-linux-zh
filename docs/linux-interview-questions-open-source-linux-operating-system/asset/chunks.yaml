  trans: '

    下一步是为鼠标猜测合适的协议类型。在某些情况下，X 服务器可能自动为指定的鼠标选择协议类型。否则，用户必须手动选择。请遵循以下指南。


    ### 总线鼠标 (Bus mouse)

    无论鼠标品牌如何，总线鼠标和 `InPort` 鼠标始终使用 `BusMouse` 协议。某些操作系统可能允许你将 `Auto` 指定为总线鼠标的协议类型。


    ### PS/2 鼠标

    无论品牌如何，对于 `PS/2` 鼠标应始终首先尝试 `PS/2` 协议。任何 `PS/2` 鼠标都兼容此协议类型，尽管 X 服务器无法使用滚轮和其他额外功能。


    在验证鼠标可以使用此协议工作后，你可以选择指定 `xxxPS/2` 协议中的一种，以便在 X 服务器中可用额外功能。然而，对这些 PS/2 鼠标的支持假设了底层操作系统的某些行为，并不总是能按预期方式工作。由于这个原因，某些操作系统平台可能会完全禁用某些
    PS/2 鼠标型号。某些操作系统可能允许你将 `Auto` 指定为 PS/2 鼠标的协议类型，X 服务器将自动进行调整。


    ### 串口鼠标 (Serial mouse)

    XFree86 服务器支持广泛的新旧型号鼠标。如果你的鼠标是较新的型号，它可能符合 PnP COM 设备规范，X 服务器可能能够自动检测到合适的鼠标协议类型。将
    `Auto` 指定为协议类型并启动 X 服务器。如果鼠标不是 PnP 鼠标，或者 X 服务器无法确定合适的协议类型，服务器将打印以下错误信息并终止。


    ```

    <mousename>: cannot determine the mouse protocol

    ```


    如果 X 服务器生成了上述错误信息，你需要手动为鼠标指定一种协议类型。请从以下列表中选择一个：


    * GlidePoint

    * IntelliMouse

    * Logitech

    * Microsoft

    * MMHittab

    * MMSeries

    * MouseMan

    * MouseSystems

    * ThinkingMouse


    **在选择时，请遵守以下规则：**


    * `Logitech` 协议用于罗技的旧款串口鼠标型号。现代罗技鼠标使用 `MouseMan` 或 `Microsoft` 协议。

    * 大多数 2 键串口鼠标支持 `Microsoft` 协议。

    * 3 键串口鼠标可能兼容 `Mousesystems` 协议。如果不支持，它也可以兼容 `Microsoft` 协议，尽管第三键（中间键）将无法工作。3
    键串口鼠标也可以兼容 `Mouseman` 协议，在这种情况下第三键可能按预期工作。

    * 3 键串口鼠标底部可能有一个小开关，用于在 `MS` 和 `PC` 或 `2` 和 `3` 之间选择。`MS` 或 `2` 通常意味着 `Microsoft`
    协议。`PC` 或 `3` 将选择 `MouseSystems` 协议。

    * 如果串口鼠标带有滚轮，它可能兼容 `IntelliMouse` 协议。

    * 如果串口鼠标带有滚轮，但它无法通过 `IntelliMouse` 协议工作，你必须将其作为普通的 2 键或 3 键串口鼠标使用。

    * 如果指定了 `Auto` 协议且鼠标看起来正常，但你发现鼠标的所有功能都不可用，那是因为 X 服务器对该型号鼠标没有原生支持，并且根据 PnP 信息使用了
    `compatible` 协议。


    ### USB 鼠标

    如果你的鼠标连接到 USB 端口，它可以由 `Auto` 协议支持，或者由特定于操作系统的协议（见下文）支持，或者通过 `usb` 协议作为通用的人机接口（HID）支持。


    ### 标准化协议

    无论鼠标的型号或类别，你操作系统中的鼠标设备驱动程序都可能使用标准化协议。例如，SVR4 系统可能支持 `Xqueue` 协议。在 FreeBSD 中，系统鼠标设备
    `/dev/sysmouse` 使用 `SysMouse` 协议。


    ### 问题 102：X 服务器配置

    如何更改 X 服务器配置？


    **答案：** 你可以通过以下步骤更改 X 服务器配置。


    1. Linux 操作系统使用一个名为 `XFree` 的图形用户界面（GUI），这仅仅是因为 X 窗口系统的免费版本，由 X.org 网站的成员开发，并获得了来自
    IBM 的贡献。今天，X 服务器配置完全是自动的，因此在你新的 Linux 系统安装结束时，如果你足够幸运，可以直接重启而无需进行任何操作。尽管如此，经常会出现，尽管安装了很多软件包，它仍然显示一条信息说你无法启动
    X 服务器。发生这种情况的原因是你的显示器或显卡没有被正确检测。因此你只需要更新整个安装过程直到摘要（Summary）。在这里，你可以更改图形界面设置，但在被询问时，禁用重启后自动启动
    X 服务器的选项。这允许你在文本模式下使用电脑，所以如果你想启动 X 服务器，必须手动运行 `startx` 命令。


    2. 如果 X 服务器仍然无法工作，尝试使用：


    #### XFdrake

    它允许以最小限制更改当前设置：

    * 显示器：SVGA (非隔行) 1024 x 768

    * 频率：60 Hz

    * 显卡：VGA 标准

    * 分辨率：640 x 480

    * 颜色深度：8 bpp


    你可以逐渐增加这些值，但不要超频频率。这可能会损坏你的显示器。当你准备好后，再次运行 `Xfdrake` 并选择在启动时运行 X。


    ### 问题 103：X 字体

    如何让 X 可用字体？


    **答案：** 有多种方法可以将字体添加到 X 中。首先，XFree86 有一个字体路径（font path），它在多个目录或字体服务器中搜索字体。字体服务器只是让
    X 使用字体的后台进程。字体服务器的一个优势是可以将字体发送到远程显示。


    最近，`xfs`（X 字体服务器）经过修订以支持 TrueType 并作为独立程序运行。该修订版本随 RedHat 和基于 RedHat 的发行版发布，并包含在
    XFree86 4.0 及更高版本中。`xfs` 实际上是自带的标准字体服务器。其源代码是 XFree86 源树的一部分。然而，发行版一直在提供独立模式运行的版本。独立的
    X 字体服务器配合 TrueType 支持（通过名为 `xfst` 的字体服务器实现）可能是目前最好的字体管理解决方案。它的优势包括：

    * 支持不同类型的字体，包括 Type 1、TrueType 和位图。

    * 使远程显示可用。

    * 极大地简化了字体路径的编辑——你可以通过命令行工具 `chkfontpath` 进行，而不是编辑配置文件。这不仅让用户生活更方便，也让打包更安全且易于脚本化。


    由于发行版配置不同，并非一律如此。我们可以将用户分为三组：


    * 你的发行版带有独立的 `xfs` 且已经过修订以支持 TrueType。这一组包括 Redhat 用户以及 Redhat 衍生版的用户（如 Mandrake
    和 TurboLinux）。Debian 3.0 也包含目前测试中的修订版 xfs。对于这组用户，最明智的策略是通过 `xfs` 同时安装 TrueType
    和 Type 1 字体。

    * 某些发行版带有独立的 `xfs` 软件包，但没有 TrueType 支持。注意 XFree86 从 4.0 版本开始支持 TrueType。这包括 Debian
    稳定版（potato）。对于这些用户，最好的做法是使用 `xfs` 安装 Type 1 字体，并通过 `xfstt` 安装 TrueType 字体。Debian
    用户可以参考《TrueType Fonts in Debian》微型 HOWTO 获取有关在 Debian 中安装 TrueType 字体的信息。

    '
- fmt: '

    If you don''t have `xfs` then you will need to install Type 1 fonts by adding
    to their XFree86 font path and using `xset`. `XFree86 3.x` users should install
    TrueType fonts via `xfisst`, while `XFree86 4.x` users can add them to the X font
    path. You should install TrueType fonts via `xfisst`.


    ## The font path


    `XFree86` finds your fonts by searching a font path, a list of directories containing
    fonts. When an application requests a font, it searches through the directories
    in your font path one at a time until the font is found. To make fonts available
    requires you to set your font path. You can add a directory to your font path
    with the command `xset fp+ directory` Once you have done this; you need to ask
    the X server to re-scan for available fonts with the command: `xset fp rehash`.


    Since you will want these commands to run automatically, you should put them in
    your `.xinitrc` file or possibly your `.Xclients` or `.xsession` file. This depends
    on how you start X. It''s convenient to make two of these files symlinks to the
    other to avoid confusion.


    Another way to have the commands set automatically is edit `XF86Config`. For example,
    to add `/usr/share/fonts/myfonts` to the font path when X is started, edit `XF86Config`
    like this:


    ```

    Section "Files"

    FontPath /usr/share/fonts/myfonts

    EndSection

    ```


    The advantage of editing `XF86Config` is that the resulting changes are system
    wide.


    ## Installing Type 1 Fonts


    The easiest way to make Type 1 fonts available to X is with the help of the `Type1inst`
    utility. This is a Perl script that automatically creates the `fonts.dir` and
    `fonts.scale` files that you need for X to use the fonts. Simply `cd` to the directory,
    and run `type1inst`.


    ```

    cd directory type1inst

    ```


    Now you need to add the fonts to your font path. If you already have the stand-alone
    Section 4.4 running, you do this by editing your `xfs` configuration file. RedHat
    users can just use `chkfontpath`. Te format is `chkfontpath --add directory`.


    Your fonts will be available to X after you restart `xfs` or tell it to reload
    by sending a `SIGHUP`. You may need to run `xset fp rehash` as well. Your fonts
    should now be available to X. Now run `xset fp rehash` and X will be able to find
    the new fonts.


    If you don''t have the `xfs` package, you need to add the directory containing
    your new fonts to the font path, as described previously.


    ## Adding TrueType fonts


    Adding TrueType fonts is a little more difficult because you need to have a font
    server that is capable of serving TrueType fonts. Two font servers that do this
    are `xfisst` and `xfs`.


    `xfstt` is a TrueType font server. While it''s easy to configure and quite useful,
    it appears that `xfs` is becoming more popular. The main advantage of `xfs` over
    `xfisst` is that it supports both Type 1 and TrueType fonts.


    To set up `xfisst`, just download it and install it. Once you install it, you
    need to do the following:


    1. Install fonts into the appropriate directory (read the documentation that comes
    with the package).

    2. `cd` to that directory and run `xfisst --sync`. This causes it to look for
    the fonts and create the `fonts.dir` file.

    3. Now add `unix/:7100` to your font path.


    Your TrueType fonts should now display and be available to applications such as
    `GIMP` and `Netscape`. You may want to configure it to start every time your system
    starts up. Check to see if there''s a startup file included (if you are using
    `RPM`, you can use `rpm -ql xfisst|grep init` and look for the file with a name
    like this: `/etc/rc.d/init.d/xfisst`). If you don''t have an init script, just
    put two lines in `/etc/rc.local` like this:


    ```

    /usr/X11R6/bin/xfisst --sync

    /usr/X11R6/bin/xfisst &

    ```


    Some of the newer Linux distributions ship with the X font server `xfs` configured
    to run as a stand alone program. Redhat and all the Redhat based distributions
    use `xfs` with TrueType compiled in. Debian also ship `xfs`, but the version they
    ship in doesn''t have built in TrueType support.


    Running `xfs` as a stand alone server has several benefits, especially if it is
    compiled with TrueType support. The main advantage is that since the font server
    is no longer attached to the X server, it is possible to serve fonts to remote
    displays. Also, it is easier to modify the font path.


    As a font server, `xfs` has its own font path. You can place the `xfs` font server
    in XFree86''s font path, by adding `unix/:port` to the XFree86 font path. Once
    you do this, any font in the `xfs` font path automatically becomes available to
    XFree86.


    The `xfs` font path is determined by the `xfs` configuration file, which is `/etc/X11/fs/config`
    on Redhat, and `/etc/X11/xfs/config` on Debian. Redhat users do not need to explicitly
    edit this file; they can use the `chkfontpath` utility. The syntax is simple:
    `chkfontpath --add directory`.


    Users of other distributions can edit the configuration file as follows:


    ```

    catalogue = /usr/X11R6/lib/X11/fonts/misc:unscaled,

    ...

    /usr/share/fonts/my_new_fonts/,

    ...

    /usr/share/fonts/some_other_fonts/,

    ...

    ```

    `catalogue = /usr/X11R6/lib/X11/fonts/misc:unscaled,`

    ...

    `/usr/share/fonts/my_new_fonts/`,

    ...

    `/usr/share/fonts/some_other_fonts/`,

    ...

    `catalogue = /usr/X11R6/lib/X11/fonts/misc:unscaled,`

    ...

    `/usr/share/fonts/my_new_fonts/`,

    ...

    `/usr/share/fonts/some_other_fonts/`,

    ...

    `catalogue = /usr/X11R6/lib/X`


