  trans: '

    这将分别是普通用户和 root 用户的默认路径。确保 `/usr/bin/X11` 对 X 用户可用是非常重要的。如果 X 用户登录到另一台机器上并启动 X
    客户端应用程序，即使他看起来不是直接从 X 终端来的，也应该将 `/usr/bin/X11` 添加到他的路径中。运行 `Xstartup` 后，`XDM`
    会运行 `/etc/X11/Xsession`，该进程以最终用户的身份运行。本地配置旨在在 `/etc/environment` 中完成，如果该文件存在，它会被
    `Xsession` 加载（包含）（由于 `Xsession` 使用 `/bin/sh` 运行，因此 `/etc/environment` 必须是 sh 文件）。这与
    `ssh` 冲突，`ssh` 假设 `/etc/environment` 是仅包含 `VAR=VALUE` 格式行的文件。


