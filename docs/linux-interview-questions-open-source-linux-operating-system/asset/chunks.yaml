    whole desktop, but it''s still the window manager''s job to control the windows.
    One of the biggest differences between KDE and GNOME is the way they play with
    window managers. KDE has its own window manager, so if you use KDE, it''ll be
    really painful to change the window manager you use with it. However, GNOME doesn''t
    come with its own window manager, so you can freely choose what window manager
    to use with it.


    [Question 92: Change default manager](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    I have just installed a new window manager. I’m booting to command line and start
    X manually with the start X command.


    How can I make the new window manager as my default manager?


    A: Changing the default window manager or desktop in Linux is not that hard. You
    simply need to edit a little config file with any text editor you''re familiar
    with.


    If you use the startx command for starting up the X Window System, you''ll need
    to edit a file called .xinitrc that is located in your home directory. If the
    file already is there, just open it with your favorite text editor. If you want
    to make a backup of this file, rename it to something like .xinitrc.backup (or
    whatever you choose).


    If you don''t have such a file in your home directory, create a new file with
    that name. Be aware of the dot in the file name, this means that the file is a
    hidden file and doesn''t show when you do a normal directory listing.


    Now you can use your text editor for creating a new, blank .xinitrc file. Although
    the file may be a complicated it just contains a single line with the name of
    your new window manager. So, add a line like this to your file: exec windowmanager


    Where windowmanager is the command that starts the window manager you want to
    be your default. For example, to make Window Maker your default window manager,
    you''d have a line like this: exec wmaker


    The commands for starting some popular window managers and desktop environments
    are:


    KDE = startkde


    Gnome = gnome-session


    Blackbox = blackbox


    FVWM = fvwm (or, for FVWM2 it''s fvwm2)


    Window Maker = wmaker


    IceWM = icewm


    Save your changes after editing the .xinitrc file. The next time you do a startx,
    the new window manager will be your default.


    [Question 93: Change from text login to graphical login](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    I want to start the X Window System automatically when my Linux boots to have
    a graphical log-in.


    How can I do this?


    A: You can disable the X Window System from starting at boot up so you''ll have
    a text login or you can boot to X Windows so you can have a graphical login in
    Linux by simply editing the /etc/inittab file. This works on any Linux distro.


    You need to be root in order to edit this file. If you''re logged in as a normal
    user, get the root privileges with the su command: type the command and then the
    root password.


    $ su


    password:


    Now you can open the /etc/inittab file with your favorite text editor.


    The /etc/inittab file is usually commented well, so the file itself explains what
    the lines in the file mean. Look for a line like this: id:3:initdefault:


    The line is usually at the beginning of the /etc/inittab file, and the number
    doesn''t necessarily have to be 3\. The number in that line tells the default
    run level of your system. The default run level in turn specifies what processes
    are started when your Linux system boots up. You need to change the number that
    indicates your default run level in order to specify if you want to start the
    X Windows when your Linux system boots up.


    The number of the runlevel that starts X isn''t always the same in all Linux distros.
    That''s why you''ll have to read the /etc/inittab file a bit more. It explains
    what number and what runlevel is used for graphical and text login. If you want
    to boot to X Windows, you''ll choose a "full multi-user with xdm" or "full multi-user
    with graphical login" or something similar. If you want to boot to the command
    line, you''ll choose a runlevel that says something like "full multi-user" or
    "full multi-user with text login" or "full multi-user with no graphical login"
    or something alike.


    In Red Hat, the runlevel for booting to X Windows is 5, and for a text login it''s
    3 by default. In older SuSE''s it was 2 for a text login, and 3 for a graphical
    login. So, for example, if you want a graphical login in a Red Hat based distro,
    you''ll change


    id:3:initdefault:


    to


    id:5:initdefault:


    Check out your inittab file to see the number of the runlevel in your distro and
    then replace the number in the line to indicate the runlevel you want. Then save
    the changes and you’re done.


    If you''re booting to X Windows, you''ll need a display manager. It''s a graphical
    program that takes care of your login: it shows you a graphical login screen,
    lets you type in your username and password and starts your window manager after
    you''ve logged in.


    In most modern Linux distros you don''t have to worry about this. Usually they
    install a display manager by default, so all you have to do is change the runlevel
    and the next time you boot your system, it automatically starts the display manager.


    However, if something goes wrong and the X Window System doesn''t start and you
    end up with a text login, you probably don''t have a display manager installed.
    Then you''ll have to install and configure one of the display managers, like the
    KDE display manager kdm, Gnome display manager gdm, the xdm, etc.


    If you just disabled the graphical login, you''ll need to start X manually when
    you want the GUI. Just type the startx command and the X Window System starts
    up.


    If X tries to start up but throws you back to the command line, the reason probably
    is that X doesn''t know what window manager you wish to use. Or if X starts up
    just fine but you get a way different desktop than usually, you also need to tell
    X what window manager you want to use.


    [Question 94: Running multiple X sessions](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    Is it possible to run two or more sessions of the X Window System at the same
    time?'
  toc: []
  trans: '

    不同的窗口管理器具有不同的特性，但今天大多数窗口管理器都提供一个或多个启动应用程序的菜单。许多窗口管理器提供虚拟桌面——你可以像切换窗口几乎相同的方式在多个屏幕之间进行切换，但你不仅仅是在应用程序之间切换，而是在整个桌面之间切换。某些窗口管理器可能还提供图形化配置程序，以便于进行此类配置。


    由于市上有几十种不同的窗口管理器，你可以通过更换窗口管理器来完全改变桌面的外观和感受。MS Windows 允许你使用不同的桌面主题，但在 Linux 中，你可以改变一切。


    ### 桌面环境

    窗口管理器提供了你控制桌面上的窗口所需的所有功能。然而，你可能想要一些额外的功能，并可能希望窗口管理器处理整个桌面，但提供这些额外功能并不是窗口管理器的职责。这正是你需要桌面管理器（desktop
    manager）或桌面环境（desktop environment）的地方。


    桌面管理器通过提供和控制不直接处理窗口的其他有用功能来管理你的整个桌面。例如，桌面环境可以为你提供任务栏或多个任务栏、额外的菜单、桌面图标、屏幕保护程序以及许多小型实用型程序，如图形化文件管理器、搜索工具、文本编辑器等。


    桌面管理器领域的两个大主角是 KDE (K Desktop Environment) 和 GNOME (GNU Network Object Model Environment)。它们之间有很多不同之处，但它们有一个共同点：你在使用桌面环境的同时必须使用一个窗口管理器。桌面环境负责整个桌面，但控制窗口仍然是窗口管理器的工作。KDE
    和 GNOME 之间最大的区别之一是它们使用窗口管理器的方式。KDE 有它自己的窗口管理器，所以如果你使用 KDE，更改与其配合使用的窗口管理器将非常痛苦。然而，GNOME
    并不自带自己的窗口管理器，因此你可以自由选择使用哪种窗口管理器与其配合。


    ### 问题 92：更改默认管理器

    我刚刚安装了一个新的窗口管理器。我正启动到命令行，并使用 `startx` 命令手动启动 X。


    我该如何让新的窗口管理器成为我的默认管理器？


    答：在 Linux 中更改默认窗口管理器或桌面并不困难。你只需要用任何你熟悉的文本编辑器编辑一个配置文件即可。


    如果你使用 `startx` 命令启动 X 窗口系统，你需要编辑位于家目录下的一个名为 `.xinitrc` 的文件。如果该文件已经存在，只需用你喜欢的文本编辑器打开它。如果你想对该文件进行备份，将其重命名为类似
    `.xinitrc.backup`（或你选择的任何名称）。


    如果你在家目录中没有这样的文件，请创建一个同名的新文件。注意文件名中的点，这意味着该文件是一个隐藏文件，当你进行常规目录列出时不会显示它。


    现在你可以使用你的文本编辑器创建一个新的、空的 `.xinitrc` 文件。虽然该文件可能看起来复杂，但它只包含一行，你新窗口管理器的名称。因此，在你的文件中添加如下所示的一行：


    ```

    exec windowmanager

    ```


    其中 `windowmanager` 是启动你想作为默认的窗口管理器的命令。例如，要让 Window Maker 成为你的默认窗口管理器，你会有这样的一行：`exec
    wmaker`


    启动一些流行的窗口管理器和桌面环境命令为：


    - KDE = `startkde`

    - Gnome = `gnome-session`

    - Blackbox = `blackbox`

    - FVWM = `fvwm`（或者，对于 FVWM2，它是 `fvwm2`）

    - Window Maker = `wmaker`

    - IceWM = `icewm`


    在编辑 `.xinitrc` 文件后保存更改。下次你执行 `startx` 时，新的窗口管理器将成为你的默认。


    ### 问题 93：从文本登录改为图形化登录

    我希望在 Linux 启动时自动启动 X 窗口系统以便以便图形化登录。


    我该如何实现？


    答：你可以通过编辑 `/etc/inittab` 文件来禁用 X 窗口系统在启动时的启动以获得文本登录，或者启动到 X Windows 以便在 Linux
    中拥有图形化登录。这适用于任何 Linux 发行版。


    你需要 root 权限才能编辑此文件。如果你以普通用户身份登录，请使用 `su` 命令获取 root 权限：输入命令，然后输入 root 密码。


    ```

    $ su

    password:

    ```


    现在你可以用你喜欢的文本编辑器打开 `/etc/inittab` 文件。


    `/etc/inittab` 文件通常有良好的注释，因此文件本身就解释了文件中每一行的含义。寻找类似这样的一行：`id:3:initdefault:`


    该行通常位于 `/etc/inittab` 文件的开头，数字并不一定是 `3`。该行中的数字告诉你系统的默认运行级别（run level）。默认运行级别反过来指定了当你的
    Linux 系统启动时启动哪些进程。你需要更改运行级别来指定是否想要启动 X。


    启动 X 的运行级别在所有发行版中并不总是相同的。因此你必须仔细阅读 `/etc/inittab`。如果你想要图形化登录，你会选择类似 `full-user
    with xdm` 或 `full-user with graphical login` 的选项。如果你想启动到命令行，你会选择 `full-user`。


    在 Red Hat 中，启动 X 的运行级别是 5，而文本登录默认是 3。例如，如果你在 Red Hat 中想要图形化登录，你需要将


    ```

    id:3:initdefault:

    ```


    改为


    ```

    id:5:initdefault:

    ```


    然后保存更改即可。完成。


    如果你启动到 X Windows，你需要一个显示管理器。它是一个处理登录的图形化程序：它显示图形登录界面，让你输入用户名和密码，并在登录后启动你的窗口管理器。


    在大多数现代 Linux 发行版中，你不需要担心这个问题。它们通常默认安装显示管理器，因此你只需要更改运行级别，下次启动系统时，它就会启动显示管理器。

