    The first line shows the geometry of your hard drive. It may not be physically
    accurate, but you can accept it as though it were. The hard drive in this example
    is made of 32 double-sided platters with one head on each side (probably not true).
    Each platter has 621 concentric tracks. A 3-dimensional track (the same track
    on all disks) is called a cylinder. Each track is divided into 63 sectors. Each
    sector contains 512 bytes of data. Therefore the block size in the partition table
    is `64 heads * 63 sectors * 512 bytes`...divided by `1024`. The start and end
    values are cylinders.


    Decide on the size of your swap space and where it ought to go. Divide up the
    remaining space for the three other partitions.


    ### Example


    To start `fdisk` from the shell prompt:


    ```bash

    fdisk /dev/hdb

    ```


    That indicates that you are using the second drive on IDE controller. When you
    print the (empty) partition table, you’ll get configuration information.


    Command (m for help): `p`


    ```text

    Disk /dev/hdb: 64 heads, 63 sectors, 621 cylinders

    Units = cylinders of 4032 * 512 bytes

    You had a 1.2 GB drive, but now you really know: `64 * 63 * 512 * 621 = 1281982464
    bytes`. Reserve 128Mb of that space for swap, leaving `1153982464`. If you use
    one of the primary partitions for swap, which means you have three left for ext2
    partitions. Divided equally, that makes for 384Mb per partition.

    ```


    Command (m for help): `n`


    #### Command action

    ```text

    extended

    pprimary partition (1-4)

    Partition number (1-4): 1

    First cylinder (1-621, default 1):<RETURN>

    Using default value 1

    Last cylinder or +size or +sizeM or +sizeK (1-621, default 621): +384M

    ```


    Next, set up the partition you want to use for swap:


    Command (m for help): `n`


    #### Command action

    ```text

    extended

