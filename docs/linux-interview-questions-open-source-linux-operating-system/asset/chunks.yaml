    [Question 29: Scan ide devices](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    I installed a brand new hard drive and issuing the fdisk -l command shows the
    drive as /dev/hdb.


    Is there a way to list the file system?


    A: You have to create a partition table and then create a file system in the partition/s.


    Enter the cfdisk /dev/hdb command either in your cfdisk (if you have one) or enter
    the fdisk /dev/hdb command.


    Now create a partition and make it type 83\. Write the partition table back onto
    the disk. Exit the cfdisk or fdisk utility.


    Next you have to create a file system. This is the same as when you format a partition
    in Windows. In Linux we use the mkfs command. Do this to create an ext2 file system
    on /dev/hdb1 if you want to use ext2 file system.


    root> mkfs -t ext2 -cv /dev/hdb1


    This command will take some time to end because it also checks the partition for
    bad blocks as it creates the file system.


    Once it’s done, then you can mount the file system. Assume you want to mount this
    file system at /mnt/hdb1\. Then you have to create the directory where you want
    to mount it after which you mount the file system. Note that you only have to
    create the directory/mount point once.


    root> mkdir /mnt/hdb1 root> mount /dev/hdb1 /mnt/hdb1


    Now you can enter the following line in your /etc/fstab file to mount the file
    system automatically when you restart Linux.


    If you don’t want people from running programs that are on this partition, do
    this using the noexec option. This would go next to the word defaults in the fstab
    entry as in:


    /dev/hdb1 /mnt/hdb1 ext2 defaults 0 0


    /dev/hdb1 /mnt/hdb1 ext2 defaults,noexec 0 0


    You can look up all of the mount options by looking at the man page for the mount
    command and the man page for the fstab file.


    [Question 30: Partition Table](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    What does a partition table look like?


    A: One may have an arbitrary number of partitions on a disk. However, the Master
    Boot Record (MBR, sector 0 of the disk) only holds descriptors for 4 partitions,
    called the primary partitions. Usually the BIOS can boot only from a primary partition.
    (Of course it can boot a boot loader that itself is able to access non-primary
    partitions or other disks.) The descriptors for the remaining partitions, called
    logical partitions, are scattered along the disk in a linked list of partition
    table sectors, starting with the MBR.'
