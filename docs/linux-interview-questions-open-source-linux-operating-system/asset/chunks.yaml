    X 会话，那么七号终端之后的所有终端都是空的。


    第二个 X 会话运行在第八虚拟终端，第三个会话运行在第九个虚拟终端，以此此类推。你切换 X 屏幕的方法与切换虚拟终端相同：按下 `Ctrl`、Alt 以及带有目标终端数字的
    `F` 键。


    例如，要从屏幕 0 切换到屏幕 1（从第一个 X 会话切换到第二个），你需要按下 `Ctrl + Alt + F8`。要返回第一个 X 会话，请使用 `Ctrl
    + Alt + F7`。


    在使用 `startx` 启动多个 X 会话时，请确保你的主目录下有一个名为 `.xinitrc` 的文件。该文件用于控制启动哪个窗口管理器等设置。


