    什么是 `pstree`？它是如何工作的？


    A: `pstree` 是一个 UNIX 命令，以树的形式显示运行中的进程。它的根是 `init` 进程或给定 `PID` 的进程。如果指定了用户名，则显示所有以该用户拥有的进程为根的树。它是
