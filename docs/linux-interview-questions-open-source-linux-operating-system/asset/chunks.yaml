    `-h'' option is given, the job is not removed from the table, but is marked so
    that SIGHUP is not sent to the job if the shell receives a SIGHUP. If jobspec
    is not present, and neither the `-a'' nor `-r'' option is supplied, the current
    job is used. If no jobspec is supplied, the `-a'' option means to remove or mark
    all jobs; the `-r'' option without a jobspec argument restricts operation to running
    jobs.


    suspend


    suspend [-f]


    Suspend the execution of this shell until it receives a SIGCONT signal. The `-f''
    option means to suspend even if the shell is a login shell.


    When job control is not active, the kill and wait built-ins do not accept jobspec
    arguments. They must be supplied process IDs.


    [Question 26: man pages](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    How should I view and search in the man pages?


    A: If you want to know how some command is used or if you want more info about
    a particular command, you don''t usually have to search for some text file that
    contains the help you need. You can read the reference manual for a command by
    simply typing man, and giving the name of the desired command as an argument to
    it. Almost every command on a Linux system has a manual page. For example, if
    you want more info about the ls command, you just type: $ man ls


    Many X programs have man pages too. For example, the following gives you the man
    page for xterm which is a terminal emulator: $ man xterm


    Use the following keys and commands for moving around in the manual page:


    Command / key Action


    e, j, Enter, or Down move forward one line


    y, k, or Up move backward one line


    f, Space, or Page Down move forward one page


    b, or Page Up move backward one page


    /characters search the manual page for the


    specified characters


    q quit


    There are manual pages for different programs, utilities, functions and even for
    some configuration files. The man pages are a very quick and easy way of getting
    help. The man command itself has a manual page entry, so if you want more info
    about the man command itself: $ man man


    Man pages reference are manual pages and they are usually very brief and technical.
    The man pages are great if you already know how to use the command and need only
    a reference or some extra info. They are definitely not tutorials and sometimes
    they''re hard to understand. However, the man pages are very useful because they''re
    always there, only a command away so you should try to learn to use them. The
    more man pages you read, the more you start to understand them.


    Now, what if you need to do a specific task but don''t know what program or command
    to use for the task? Every man page entry contains a short description of the
    program but the problem is that you don''t know what program to use and what man
    page to read. With the apropos command you can search those descriptions and find
    the right tool for the job. You can use keywords to search both program names
    and their descriptions.


    Suppose you have a compressed gzip file and you want to uncompress it. You probably
    want to use a program whose description or name contains the word "gzip". You
    can use apropos for finding such a program:


    $ apropos gzip


    gzip (1) - compress or expand files


    zforce (1) - force a ''.gz'' extension on all gzip files


    $


    Now when you look at the output of apropos, you probably see that gzip might be
    what you''re looking for. Now you know the command name, and can go read its man
    page:


    $ man gzip


    Although you can do very simple searches with apropos, it''s a very powerful tool
    and you can do advanced searches. For example, you can use the shell wildcards
    in your searches with the -w option. For more info about apropos, read its man
    page.


    While apropos searches for the descriptions in the man pages, whatis displays
    the description. It answers the question what is. Of course you can just take
    a look at the man page of a program to see what the purpose of it is, but if you''re
    only interested in knowing what the program does, you can just use the whatis
    command for a quick answer:


    $ whatis apropos


    apropos (1) - search the manual page names and descriptions


    $ whatis man


    man (1) - an interface to the on-line reference manuals


    man (7) - macros to format man pages


    $ whatis whatis


    whatis (1) - display manual page descriptions


    $


    Read the manual page for the man command for more information about whatis.


