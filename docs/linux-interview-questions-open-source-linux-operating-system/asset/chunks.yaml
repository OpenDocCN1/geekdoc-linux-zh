    [Question 36: An easy way to dual boot Windows and Linux](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    Is there an easy way to dual boot Windows and Linux?


    A: The following procedure is applicable if you have a newer pc. This method will
    not work with older BIOS due to the 1024 cylinder boot limit.


    It is assumed that you have an Intel-compatible desktop or notebook with a bootable
    CD-ROM or DVD drive. You should have at least 128M of RAM. I recommend that you
    have at least 10G of disk space available for Linux, though 5G would probably
    be enough.


    The latter condition should hold for almost any machine bought in the last five
    or six years. One other point, though, is that the boot priority should be set
    so that the machine tries to boot from CD-ROM or DVD before trying to boot from
    the hard drive. Your machine probably already does this but if not, you can reset
    the BIOS to do so. Consult your manual on this, or ask at any computer store.


    This example will use a 20G HDD and will be installing Windows and Linux Red Hat
    for concreteness of discussion but the principles should be similar for most other
    distributions.


    Here is our planned partition layout:


    1\. Windows


    2\. /boot


    3\. /swap


    4\. /


    Step I: You will need three things:


    1\. A Windows 98SE boot disk. This can be created on Windows 98 (control panel
    > add/remove programs > startup > create boot disk) or alternatively you can search
    on the internet for one.


    2\. Microsoft Fdisk. This is again available from Windows 98\. Just do a Find
    Files and folders for ''fdisk'' (I think it is in c:\windows\com) and copy the
    file to floppy


    3\. A bootable Windows disk and Linux installation disksStep II: Partitioning


    Before you do the partitioning, I recommend that you run Windows’ chkdsk command
    first in case you have any bad sectors on your hard drive.


    Insert your boot disk and boot the PC. Go into your BIOS and set the first boot
    to Floppy. Save changes and exit.


    Your PC should boot and eventually prompt you to make a selection of three options.
    Choose 2 - Start without the CD ROM support. You can choose 1, but you don''t
    need CD ROM support.


    It will take a minute or so and you will end up at the command prompt (A:\).  Now
    insert your disk with ''fdisk'' on it and type: fdisk.  You will then be prompted
    whether you want large disk support. Select ''Yes''


    Now you will be presented with some options.


    Select option 1: Create a DOS partition of logical dos drive.


    The next screen will give you three options.


    Select option 1 again: Create Primary DOS partition. Now you’re going to create
    a Primary partition. If asked to use *all* space, answer ''No'' and enter the
    amount you wish for the C: drive. If you want 12Gigs, enter: 12000


    You can also go back and delete it if you made the wrong choice.


    There are two things you can do from here. You can create the other partitions
    or continue and create the other partitions when installing Linux. If you want
    to create the partitions now, read the next step otherwise skip to Step V.


    Step III: Create extended and logical partitions:


    After creating the first partition, we now go back to the main menu and select
    option 1 again: Create a DOS partition of logical dos drive.


    Now we select option 2: Create Extended DOS partition. This partition will hold
    the swap, /boot and root.


    When prompted to enter the amount, use *all* the space left. If you don''t, you''ll
    wind up with unused space on your hard drive.


    After doing so, FDISK should automatically advance to the next step -> creating
    Logical DOS drives. It should give you a message that says something like “This
    drive has no Logical DOS drives. Would you like to create some now?”


    The logical DOS drives are just all the partitions within the extended partition.'
