    ## Question 12: pstree


    What is a `pstree`? How does it work?


    A: A `pstree` is a UNIX command that shows the running processes as a tree. Its
    root is either `init` process or process for given `PID`. If a user name is specified,
    all process trees rooted at processes owned by that user are shown. It is used
    alternative to `ps` command.


    The command `pstree` visually merges identical branches by putting them in square
    brackets and prefixing them with the repetition count, e.g.


    ```text

    init-+-getty

    |-getty

    |-getty

    `-getty

    ```

    becomes

    ```text

    init---4*[getty]

    ```


    ## OPTIONS


    - `-a`: Show command line arguments. If the command line of a process is swapped
    out, that process is shown in parentheses. `-a` implicitly disables compaction.

    - `-c`: Use raw CPU time for `%CPU` instead of decaying average.

    - `-G`: Disable compaction.

    - `-h`: Highlight the current process.

    - `-H`: Show process hierarchy (forest).

    - `-l`: Display long format.

    - `-m`: All threads.

    - `-n`: Numeric output for `WCHAN` and `USER`.

    - `-O`: Sorting order.

    - `-p`: Show PIDs.

    - `-s`: Security ID.

    - `-x`: Show security context.

    - `-u`: Show uid transitions.

    - `-U`: Use UTF-8 (Unicode).

    - `-V`: Display version info.

    - `--a`: Show command line arguments.

    - `--columns`: Set screen width.

    - `--cumulative`: Include some dead child process data.

    - `--forest`: ASCII art process tree.

    - `--html`: HTML escaped output.

    - `--headers`: Repeat header lines.

    - `--help`: Print help message.

    - `--info`: Print debugging info.

    - `--line`: Set screen height.

    - `--no-headers`: Print no header line at all.

    - `--null`: Unjustified output with NULs.

    - `--rows`: Set screen height.

    - `--sort`: Specify sorting order.

    - `--user`: Effective user name or ID.

    - `--version`: Print version.

    - `--width`: Set screen width.

    - `--zero`: Unjustified output with NULs.


    ## Question 13: Standard Input/Output


    Many CLI programs use a feature called input/output redirection.


    How do they work?


    A: The input/output redirection feature of CLI programs allows you to attach or
    fuse simple commands together in to construct a more complex.


    ### STANDARD OUTPUT


    Many Linux commands print their output to screen. For example, `cat` does this
    when it lists the contents of a file and makes you see the output on your screen.
    However, the screen isn''t the only place where the commands can print their output
    because you can redirect the output of several commands to files, devices and
    even to the input of other commands.


    The CLI programs that display their results do so usually by sending the results
    to standard output or `stdout` for short. By default, standard output directs
    its contents to the screen as you can see with the `cat` command but if you want
    to direct the output to somewhere else, you can use the `>` character, e.g.


    ```bash

    ls > dir_listing.txt

    ```

    The above redirects the output of the ls command to a file called `dir_listing.txt`.
    You won’t see any results of `ls` on your screen since the output is redirected
    to a file.


    Each time you repeat `ls > dir_listing.txt` command, the file `dir_listing.txt`
    is overwritten with the results of the `ls` command. If you want to append the
    new results to the file instead of rewriting it, you can use `>>` instead:


    ```bash

    ls >> dir_listing.txt

    ```

    The new output of `ls` is added at the end of the `dir_listing.txt` file instead
    of overwriting the file each time you repeat it.


    The following adds the contents of `File1` at the end of `File8`:


    ```bash

    cat File1 >> File8

    ```


    You can also redirect it to devices using:


    ```bash

    cat sound.wav > /dev/audio

    ```

