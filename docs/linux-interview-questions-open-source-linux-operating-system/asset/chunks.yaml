    0, xargs will


    run as many processes as possible at a time. Use the -n option with -P; otherwise


    chances are that only one exec will be done.


    xargs is often used in conjunction with the Unix commands find, locate and grep.


    For example:


    1. * find . -name "*.foo" | xargs grep bar


    In practice does the same as grep bar:


    `find . -name "*.foo"`


    This will work even if there are so many files to search that they will not all
    fit on a single command line. It searches in all files in the current directory
    and its subdirectories which end in .foo for occurrences of the string bar.


    2. * find . -name "*.foo" -print0 | xargs -0 grep bar


    This does the same thing but uses GNU specific extensions to find and xargs to
    separate filenames using the null character; this will work even if there are
    whitespace characters, including newlines, in the filenames.


    [Question 24: SED](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    What is SED and how is it used?


    A: A Stream Editor (sed) is a simple and powerful computer program used to apply
    various pre-specified textual transformations to a sequential stream of text data.
    It reads input files line by line, edits each line according to rules specified
    in its simple language (sed script) and then outputs the line.


    Sed is often thought of as a non-interactive text editor. It differs from conventional
    text editors in that the processing of the two inputs is inverted. Instead of
    iterating once through a list of edit commands applying each one to the whole
    text file in memory, sed iterates once through the text file applying the whole
    list of edit commands to each line. Because only one line at a time is in memory,
    sed can process text files with an arbitrarily-large number of lines. Some implementations
    of sed can only process lines of limited lengths.


    Most people use sed first for its substitution features. Sed is often used as
    a find-and-replace tool.


    sed ''s/Wayne/Nico/g'' oldfile >newfile


    It will replace every occurrence of "Wayne" with the word "Nico", wherever it
    occurs in the file. The "find" portion is a regular expression ("RE"), which can
    be a simple word or may contain special characters to allow greater flexibility
    (for example, to prevent "Wayne" from also matching "Wayneme").


    sed can be used to add 8 spaces to the left side of a file, the printing wouldn''t
    begin at the absolute left edge of a piece of paper.


    sed ''s/^/ /'' myfile >newfile# sed script


    sed ''s/^/ /'' myfile | lp # next sed script


    sed could display only one paragraph of a file, beginning at the phrase "once
    upon a time" and ending at the phrase "happily ever after". The script looked
    like this:


    sed -n ''/once upon a time/,/happily ever after/p'' myfile


    Sed''s normal behavior is to print (i.e., display or show on screen) the entire
    file, including the parts that haven''t been altered, unless you use the -n switch.
    The "-n" stands for "no output". This switch is almost always used in conjunction
    with a ''p'' command somewhere, which says to print only the sections of the file
    that have been specified. The


    -n switch with the ''p'' command allow for parts of a file to be printed (i.e.,
    sent to the console).


    [Question 25: Job Control](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    I want to carry out a lengthy task in the background while using the terminal
    for another purpose. Is it possible to selectively stop or suspend the execution
    of some processes?


    A: Most tasks (directory listing, editing files, etc.) can easily be accomplished
    by letting the program take control of the terminal and returning control to the
    shell when the program exits; however, sometimes the user will wish to carry out
    a lengthy task in the background while using the terminal for another purpose.
    Job control is a facility developed to make this possible. It allows the user
    to start programs in the background, send programs into the background, bring
    background programs into the foreground, and start and stop running programs.
    Programs under the influence of a job control facility are referred to as jobs.


    The shell associates a job with each pipeline. It keeps a table of currently executing
    jobs, which may be listed with the jobs command. When Bash starts a job asynchronously,
    it prints a line that looks like:


    [1] 12345


    Thus, indicating that this job is job number 1 and that the process ID of the
    last process in the pipeline associated with this job is 12345\. All of the processes
    in a single pipeline are members of the same job. Bash uses the job abstraction
    as the basis for job control.


    To facilitate the implementation of the user interface to job control, the operating
    system maintains the notion of a current terminal process group ID. Members of
    this process group (processes whose process group ID is equal to the current terminal
    process group ID) receive keyboard-generated signals such as SIGINT. These processes
    are said to be in the foreground. Background processes are those whose process
    group ID differs from the terminal''s; such processes are immune to keyboard-generated
    signals. Only foreground processes are allowed to read from or write to the terminal.
    Background processes which attempt to read from (write to) the terminals are sent
    a SIGTTIN (SIGTTOU) signal by the terminal driver, which, unless caught, suspends
    the process.


    If the operating system on which Bash is running supports job control, Bash contains
    facilities to use it. Typing the suspend character (typically `^Z'', Control-Z)
    while a process is running causes that process to be stopped and returns control
    to Bash. Typing the delayed suspend character (typically `^Y'', Control-Y) causes
    the process to be stopped when it attempts to read input from the terminal, and
    control to be returned to Bash. The user then manipulates the state of this job,
    using the bg command to continue it in the background, the fg command to continue
    it in the foreground, or the kill command to kill it. A `^Z'' takes effect immediately,
    and has the additional side effect of causing pending output and type ahead to
    be discarded.


    There are a number of ways to refer to a job in the shell. The character `%''
    introduces a job name.


    Job number n may be referred to as `%n''. The symbols `%%'' and `%+'' refer to
    the shell''s notion of the current job, which is the last job stopped while it
    was in the foreground or started in the background. A single `%'' (with no accompanying
    job specification) also refers to the current job. The previous job may be referenced
    using `%-''. In output pertaining to jobs (e.g., the output of the jobs command),
    the current job is always flagged with a `+'', and the previous job with a `-''.


    A job may also be referred to using a prefix of the name used to start it, or
    using a substring that appears in its command line. For example, `%ab'' refers
    to a stopped ab job. Using `%?ab'', on the other hand, refers to any job containing
    the string `ab'' in its command line. If the prefix or substring matches more
    than one job, Bash reports an error.


    Simply naming a job can be used to bring it into the foreground: `%1'' is a synonym
    for `fg %1'', bringing job 1 from the background into the foreground. Similarly,
    `%1 &'' resumes job 1 in the background, equivalent to `bg %1''


    The shell learns immediately whenever a job changes state. Normally, Bash waits
    until it is about to print a prompt before reporting changes in a job''s status
    so as to not interrupt any other output. If the `-b'' option to the set built-in
    is enabled, Bash reports such changes immediately. Any trap on SIGCHLD is executed
    for each child process that exits.'
