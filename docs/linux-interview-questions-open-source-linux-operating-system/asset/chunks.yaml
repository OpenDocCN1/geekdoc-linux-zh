    drwxrwxrwx 2 jim jim1111 Jan 11 11: 11 archive/


    If you want to create directories and subdirectories in one step, this can be
    done using the -p option:


    jim:~> cd archive


    jim:~/archive> mkdir 20004 20005 20006


    richard:~/archive> ls


    2004/ 2005/ 2006/


    richard:~/archive> mkdir 2004/reports/Books/


    mkdir: cannot create directory `2004/reports/Books/'':


    No such file or directory


    jim:~/archive> mkdir -p 2004/reports/Books/


    richard:~/archive> ls 2004/reports


    /Books/


    If the new file needs other permissions than the default file creation permissions,
    the new access rights can be set in one move, still using the mkdir command.


    The name of a directory has to comply with the same rules as those applied on
    regular file names. One of the most important restrictions is that you can''t
    have two files with the same name in one directory. There are virtually no limits
    on the length of a file name, but it is usually kept shorter than 80 characters,
    so it can fit on one line of a terminal. You can use any character you want in
    a file name, although it is advised to exclude characters that have a special
    meaning to the shell.'
