    [Question 83: fsck command](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    How do I check and repair files for inconsistencies?


    A: The fsck command ("file system check" or "file system consistency check") is
    a tool for checking the consistency of a file system. The file system can become
    inconsistent due to several reasons and the most common is abnormal shutdown due
    to hardware failure, power failure or switching off the system without proper
    shutdown. Due to these reasons, the super block in a file system is not updated
    and has mismatched information relating to system data blocks, free blocks and
    inodes .


    Typically, fsck utilities provide options for interactively repairing damaged
    file systems (the user must decide how to fix specific problems), allowing fsck
    to decide how to fix specific problems or reviewing the problems that need to
    be resolved without actually fixing them.


    Fsck can also be run manually by the system administrator if there is believed
    to be a problem with the file system.


    Modes of operation: fsck operates in two modes interactive and non-interactive:


    interactive : the fsck examines the file system and stops at each error it finds
    in the file system and gives the problem description and ask for user response
    usually whether to correct the problem or continue without making any change to
    the file system.


    Non-interactive :fsck tries to repair all the problems it finds in a file system
    without stopping for user response useful in case of a large number of inconsistencies
    in a file system but has the disadvantage of removing some useful files which
    are detected to be corrupt .


    If file system is found to have problem at the booting time non interactive fsck
    is run and all errors which are considered safe to correct are corrected. But
    if still file system has problems the system boots in single user mode asking
    for user to manually run the fsck to correct the problems in file system


    fsck should always be run in a single user mode which ensures proper repair of
    file system. If it is run in a busy system where the file system is changing constantly
    fsck may see the changes as inconsistencies and may corrupt the file system.


    If the system can not be brought in a single user mode, fsck should be run on
    the partitions, other than root & usr , after unmounting them. Root & usr partitions
    can not be unmounted. If the system fails to come up due to root/usr files system
    corruption, the system can booted with CD and root/usr partitions can be repaired
    using fsck.


    Command syntax:


    fsck [ -F fstype] [-V] [-yY] [-o options] special


    -F fstype type of file system to be repaired ( ufs , vxfs etc)


    -V verify the command line syntax but do not run the command


    -y or -Y Run the command in non interactive mode - repair all errors encountered
    without waiting for user response.


    -o options Three options can be specified with -o flag


    b=nwhere n is the number of next super block if primary super block is corrupted
    in a file system.


    The p option is used to make safe repair options during the booting process.


    “f” forces the file system check regardless of its clean flag.


    “special” - Block or character device name of the file system to be checked/repaired
    - for example /dev/rdsk/c0t3d0s4. Character device should be used for consistencies
    check & repair


    Phases:


    fsck checks the file system in a series of 5 pages and checks a specific functionality
    of file system in each phase.


    Phase 1 - Check Blocks and Sizes


    Phase 2 - Check Pathnames


    Phase 3 - Check Connectivity


    Phase 4 - Check Reference Counts


    Phase 5 - Check Cylinder Groups


    Error messages & corrective action:


    1\. Corrupted superblock - fsck fails to run


    If the superblock is corrupted the file system still can be repaired using alternate
    superblock which are formed while making new file system .


    The first alternate superblock number is 32 and others superblock numbers can
    be found using the following command:


    newfs -N /dev/rdsk/c0t0d0s6


    For example, to run fsck using first alternate superblock following command is
    used:


    fsck -F ufs -o b=32 /dev/rdsk/c0t0d0s6


    2\. Link counter adjustment: fsck finds mismatch between directory inode link
    counts and actual directory links and prompts for adjustment in case of interactive
    operation. Link count adjustments are considered to be a safe operation in a file
    system and should be repaired by giving ''y'' response to the “adjust?” prompt
    during fsck.'
