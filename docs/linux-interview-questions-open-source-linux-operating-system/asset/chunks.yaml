    如果在作业处于停止状态时尝试退出 `Bash`，shell 将打印一条消息，警告有已停止的作业。此时可以使用 `jobs` 命令来检查这些作业的状态。如果在没有中间插入命令的情况下进行第二次退出尝试，`Bash`
    将不会再次打印警告，并且已停止的作业将被终止。


    ## 作业控制内置命令 (Job Control Built-ins)


    ### `bg`

    `bg [jobspec ...]`

    在后台恢复每个挂起的作业 `jobspec`，就像当初使用 `&` 启动它一样。如果未提供 `jobspec`，则使用当前作业。返回状态为零，除非在未启用作业控制的情况下运行，或者在启用作业控制的情况下运行时，未找到任何
    `jobspec` 或 `jobspec` 指定了一个未在作业控制下启动的作业。


    ### `fg`

    `fg [jobspec]`

    在前台恢复作业 `jobspec` 并将其变为当前作业。如果未提供 `jobspec`，则使用当前作业。返回状态为置于前台的命令的状态，或者在禁用作业控制的情况下运行时为非零；或者在启用作业控制的情况下运行时，`jobspec`
    未指定有效作业，或 `jobspec` 指定了一个未在作业控制下启动的作业。


    ### `jobs`

    `jobs [-lnprs] [jobspec]`

    `jobs -x command [arguments]`


    第一种形式列出活动作业。选项的含义如下：


    - `-l`: 除普通信息外，列出进程 ID (PID)。

    - `-n`: 仅显示自上次通知用户状态以来状态发生变化的作业信息。

    - `-p`: 列出作业进程组首的进程 ID。

    - `-r`: 限制输出为运行中的作业。

    - `-s`: 限制输出为已停止的作业。


    如果给了 `jobspec`，输出将限制为该作业的信息。如果未提供 `jobspec`，则列出所有作业的状态。


    如果提供了 `-x` 选项，`jobs` 将 `command` 或 `arguments` 中找到的任何 `jobspec` 替换为相应的进程组 ID，并执行
    `command`，传递 `arguments`，返回其退出状态。


    ### `kill`

    `kill [-s sigspec] [-n signum] [-sigspec] jobspec or pid`

    `kill -l [exit_status]`


    向由作业规范 `jobspec` 或进程 ID `pid` 指定的进程发送由 `sigspec` 或 `signum` 指定的信号。`sigspec` 是不区分大小写的信号名称（如
    `SIGINT`，带或不带 `SIG` 前缀）或信号数字；`signum` 是信号数字。如果 `sigspec` 和 `signum` 均不存在，则使用 `SIGTERM`。`-l`
    选项列出信号名称。如果在给出 `-l` 时提供了任何参数，则列出对应参数的信号名称，返回状态为零。`exit_status` 是一个数字，指定信号数字或由信号终止的进程的退出状态。如果成功发送了至少一个信号，返回零；如果发生错误或遇到无效选项，则返回非零。


    ### `wait`

    `wait [jobspec or pid ...]`

    等待由每个进程 ID `pid` 或作业规范 `jobspec` 指定的子进程退出，并返回最后等待的命令的退出状态。如果给了作业规范，则等待该作业中的所有进程。如果没有提供任何参数，则等待所有当前活动子进程，返回状态为零。如果
    `jobspec` 和 `pid` 都没有指定 shell 的活动子进程，返回状态为 127。


    ### `disown`

    `disown [-ar] [jobspec]`

    从 shell 的活动列表中移除作业。如果给了 `jobspec`，则移除移除作业。如果未提供 `jobspec`，则移除所有活动作业。作业将继续运行，但
    shell 在退出时不会向它们发送信号。


    ### `suspend`

    `suspend [-f] [jobspec]`

    暂停作业的执行。如果给了 `jobspec`，则仅暂停该作业。如果未提供 `jobspec`，则暂停所有正在运行的作业。


    ---


    ## 常见问题


    如果在作业处于停止状态时尝试退出 `Bash`，shell 将打印一条消息，警告有已停止的作业。此时可以使用 `jobs` 命令来检查这些作业的状态。如果在没有中间插入命令的情况下进行第二次退出尝试，`Bash`
    将不会再次打印警告，并且已停止的作业将被终止。


    我应该如何查看手册页 (manual pages)？

    由于系统上的几乎每个命令都有手册。如果你想知道如何使用它，只需输入 `man` 后跟命令名称即可。例如，如果你想获取更多关于 `ls` 的信息，只需输入：`man
    ls`


    `man` 页是命令的参考。如果你想获取某个命令的更多信息，可以使用 `man` 命令快速获取。`man` 页适用于不同的程序。例如，如果你想查看终端模拟器的手册页：`man
    xterm`


    使用以下按键在 `man` 中移动：

    - `e`: 向前移动一行

    - `j`: 向后移动一行

    - `f`: 向前翻一页

    - `k`: 向后翻一页

    - `b`: 向下翻

    - `y`: 向上翻

    - `q`: 退出


    `man` 页通常是技术性的，有时难以理解。然而，手册页非常有用，因为它们一直在那里，只需一个命令即可到达。你阅读的手册页越多，就越能理解它们。


    现在，如果你需要执行某个特定任务但不知道使用什么程序怎么办？每个手册页条目都包含程序的简短描述，但问题在于你不知道用哪种程序。通过 `apropos` 命令你可以搜索这些描述。你可以使用关键词同时搜索程序名称和描述。


    假设你有一个压缩的 gzip 文件并想解压它。你可能想使用一个描述或名称包含 "gzip" 字样的程序。你可以使用 `apropos` 来寻找这样的程序：

    `apropos gzip`

    `gzip (1)` - 压缩或压缩文件

    `zforce (1)` - 对 gzip 文件强制使用 .gz 扩展


    现在查看 `apropos` 的输出时，你可能发现 `gzip` 就是你要找的。现在你知道了命令名称，可以去阅读它的手册页：`man gzip`


    虽然你可以通过 `apropos` 进行非常简单的搜索，但它是一个非常强大的工具，你可以进行高级搜索。例如，可以在搜索中使用 `-w` 选项使用 shell
    通配符。有关 `apropos` 的更多信息，请阅读其手册页。


    当 `apropos` 搜索手册页中的描述时，`whatis` 显示描述。它回答“这是什么”的问题。当然，你可以直接查看程序的手册页来看它的用途，但如果你只感兴趣程序是做什么的，可以使用
    `whatis` 命令快速获取答案：

    `whatis apropos`

    `apropos (1)` - 搜索手册页名称和描述

    `whatis man`

    `man (1)` -联机手册的接口

    `man (7)` - 用于格式化手册页的宏

    `whatis whatis`

    `whatis (1)` - 显示手册描述


    阅读 `man` 命令的手册页以获取关于 `whatis` 的更多信息。


