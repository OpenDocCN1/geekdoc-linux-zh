    # 问题 27: /proc 文件系统


    LINUX 中的 `/proc` 文件系统到底是什么？它是如何工作的？


    答：在 Linux 下，`/proc` 在 `/proc/PID` 处提供任何运行进程的信息。它还包括：


    - 指向当前（正在遍历的）进程的符号链接：`/proc/self`

    - 关于硬件、内核和模块配置的信息

    - 在 `/proc/sys` 下可动态配置的内核选项

    - 关于系统的整体信息，例如 `/proc/meminfo`，它提供了内存统计数据。


    使用 `/proc` 的基本实用程序位于 `procps` 软件包中。为了使之能够工作，必须挂载 `/proc`。


    `procfs` 在将功能从内核模式移动到用户模式的过程中起着重要作用。例如，GNU 版本的 `ps` 完全在用户模式下运行，使用 `procfs` 获取数据。


    `/proc` 文件系统包含一个虚拟文件系统。它并不存在于磁盘上。相反，内核在内存中创建它。它用于提供有关系统的信息（最初是关于进程的，因此得名）。下面解释了一些较重要的文件和目录。`/proc`
    文件系统在 `proc` 手册页中有更详细的描述。


    ### `/proc/1`

    一个包含 1 号进程信息的目录。每个进程在 `/proc` 下都有一个目录，名称为其进程标识符。


    ### `/proc/cpuinfo`

    关于处理器的信息，例如其类型、制造商、型号和性能。


    ### `/proc/devices`

    配置到当前运行内核中的设备驱动程序列表。


    ### `/proc/dma`

    显示当前正在哪些 DMA 通道。


    ### `/proc/filesystems`

    配置到内核中的文件系统。


    ### `/proc/interrupts`

    显示哪些中断正在使用中，以及每个中断发生了多少次。


    ### `/proc/kcore`

    这代表系统物理内存的映像。它的大小与你的物理内存完全相同，但实际上并没有占用那么多内存；它是在程序访问它时动态生成的。（记住：除非你将其复制到别处，否则 `/proc`
    下任何内容都不会占用任何磁盘空间。）


    ### `/proc/kmsg`

    内核输出的消息。这些消息也会路由到 syslog。


    ### `/proc/ksyms`

    内核的符号表。


    ### `/proc/loadavg`

    系统的 `load average`（负载平均）；衡量系统目前需要做多少工作的三个无意义的指标。


    ### `/proc/meminfo`

    关于内存使用的信息，包括物理内存和交换分区（swap）。


    ### `/proc/modules`

    当前加载了哪些内核模块。


    ### `/proc/net`

    关于网络协议的状态信息。


    ### `/proc/self`

    指向查看 `/proc` 的程序进程目录的符号链接。当两个进程查看 `/proc` 时，它们会得到不同的链接。这主要是为了方便程序获取自己的进程目录。


    ### `/proc/stat`

    关于系统的各种统计数据，例如自系统启动以来的页错误次数。


    ### `/proc/uptime`

    系统运行的时间。


    ### `/proc/version`

    内核版本。


    请注意，虽然上述文件通常是易读的文本文件，但有时它们的格式化可能不易于理解。有很多命令的作用无非读取上述文件并对其进行格式化，以便更易理解。


    # 问题 28: OpenGL - 硬件加速


    我已经安装了所有驱动程序，但在 OpenGL 上遇到了问题，Quake 3 的帧率太低，但在 Windows 2K 上运行良好。


    加速我的硬件的正确步骤是什么？


    答：尝试使用以下命令检查 OpenGL 的 3D 硬件加速是否正常工作：


    ```

    glxinfo |grep rendering

    ```


    这应该输出 "direct rendering: Yes"。如果它输出相同的内容但后面跟着 "No"，则硬件 3D 加速已禁用，所有渲染将由 CPU 完成。


    如果是 "No"，请检查以下内容：


    带有调试输出重新运行 `glxinfo`：在 bash shell 中可以通过运行以下实现：


    ```bash

    LIBGL_DEBUG=verbose glxinfo

    ```


    这应该会在输出的顶部提供一些额外信息。显示的常见错误是 `drm` 设备上的“permission denied”（权限拒绝）消息。这通常是因为没有为你的显卡加载
    `drm` 内核模块，或者在你尝试加载它时，内核日志中存在某些错误消息。另一个原因是设置在 `drm` 设备上的权限。这可以在 `XF86Config` 的
    ''DRI'' 部分进行配置。


    另一个常见错误是系统上安装了多个 `libGL` 库文件（通常是因为在当前的 XFree86 安装之上安装了不同的驱动程序和 XFree86 版本）。检查
    `glxinfo` 链接到哪个 `libGL`：


    ```bash

    ldd `which glxinfo`

    ```


    这将输出库列表，然后寻找类似下面这一行的内容：


    `libGL.so.1 => /usr/X11R6/lib/libGL.so.1 (0x400a2000)`


    检查它指向的文件（这通常本身就是一个符号链接，继续跟踪它直到到达真实文件）。确保此 `libGL` 库与你的 XFree86 版本或显卡驱动程序匹配。还要检查系统是否有更多（非符号链接的）`libGL`
    文件。经常发生在 `/usr/` 下有一个，而 `/usr/X11` 下有另一个。


    # 问题 29: 扫描 ide 设备


    我安装了一个新硬盘，执行 `fdisk -l` 命令显示磁盘为 `/dev/hdb`。


    列出文件系统的方法是什么？


    答：你必须创建一个分区表，然后在分区上创建文件系统。


    在 `cfdisk /dev/hdb` 中（如果你有的话）或运行 `fdisk /dev/hdb` 命令，创建一个分区表。


    现在创建一个分区并将其类型设置为 83。将分区表写回磁盘。退出 `cfdisk` 或 `fdisk` 工具。


    接下来你需要创建一个文件系统。这与 Windows 中格式化分区相同。在 Linux 中使用 `mkfs` 命令。如果你想在 `/dev/hdb1` 上创建
    ext2 文件系统，执行：


    ```bash

    mkfs -t ext2 -cv /dev/hdb1

    ```


    此命令需要一些时间，因为它在创建文件系统时还会检查分区坏块。


    完成后，你可以挂载文件系统。假设你想将其挂载到 `/mnt/hdb1`。然后创建挂载点目录，之后挂载文件系统。


    ```bash

    mkdir /mnt/hdb1

    mount /dev/hdb1 /mnt/hdb1

    ```


    现在你可以在 `/etc/fstab` 文件中输入以下行，以便在重启 Linux 时自动挂载文件系统。


    如果你不想人们运行此分区上的程序，请使用 `noexec` 选项。这应该放在 fstab 条目的 `defaults` 单词旁边，例如：


    ```

    /dev/hdb1 /mnt/hdb1 ext2 defaults 0 0

    /dev/hdb1 /mnt/hdb1 ext2 defaults,noexec 0 0

    ```


    你可以通过查看 `mount` 命令的手册页和 `fstab` 文件的手册页来查询所有的挂载选项。


    # 问题 30: 分区表


    分区表是什么样的？


    答：磁盘上可能有任意数量的分区。然而，主引导记录（MBR，磁盘的第一个扇区）仅包含 4 个分区的描述符，称为主分区。通常 BIOS 只能从主分区启动。（当然，它可以启动一个引导加载程序，该加载程序本身能够访问非主分区或其他磁盘。）剩余分区（称为逻辑分区）的描述符以分区表扇区链的形式散布在磁盘上，从
    MBR 开始。


    '
- fmt: '

    Each partition table sector contains 4 partition descriptors. A partition descriptor
    may be of type `05` (DOS extended partition), `0f` (W95 extended partition), `85`
    (Linux extended partition), or `c5` (DRDOS/secured extended partition), in which
    case it points to another partition table sector. In this way, we obtain a quaternary
    tree of partitions. Linux accepts `85` as a synonym for `05` - this is useful
    if one wants to have extended partitions past the 1024 cylinder limit (to prevent
    DOS `fdisk` from crashing or hanging). Windows 95 uses `0f` for LBA mapped extended
    partitions. Thus, an extended partition is not a partition containing data, but
    is a box containing other partitions. Nevertheless, the partition table sector
    that starts an extended partition has enough room left to contain a boot loader
    like `LILO`, so that it is possible to boot an extended partition.


    Most operating systems severely restrict the accepted trees. Usually branching
    is not allowed, and one gets a linear chain of partition table sectors. Linux
    will accept several extended primary partitions.


    ### Question 31: Advantage of partition


    What is the advantage of partitioning my disk?


    A: The partition table of a disk cuts it into ''logical disks''. There are several
    reasons for wanting to do this. DOS does not support filesystems larger than 2
    GB, so partitioning is required to break this ''2 GB barrier''. Different partitions
    may carry different operating systems or different filesystems (FAT, HPFS, NTFS,
    ext2, ...) to be used by one operating system. Sometimes small partitions are
    used for special purposes (OS/2 Boot Manager uses a small partition for itself;
    various laptops have a ''hibernation'' partition where the state of the system
    is stored when it goes asleep). Some ''reliable'' systems have backup partitions.
    For backup purposes, say to tape, it is often convenient to have partitions of
    a size such that the entire partition can be written to a single tape.


    It is a good idea to keep your own things (say under `/home`) and privately installed
    packages (say under `/usr/local`) separate from the software installed from a
    distribution. In case these are on a different partition, it is easier to do a
    complete reinstall (or switch to a different distribution) without losing your
    own stuff.


    For well-designed systems it is often possible to have all basic system software
    on a read-only partition, thus diminishing the probability of corruption and saving
    backup time. There is also a security aspect; for example on a Unix system one
    might mount all file systems other than the root file system ''nosuid,nodev'',
    and have `/tmp`, `/home`, `/var` not on the root file system, to minimize the
    possibility that some suid program is tricked into overwriting a vital system
    file via a hard link to it.


    Finally there is the old BIOS problem that can make it impossible to boot a system
    that lives past cylinder 1024. This may mean that one has to have a partition
    that ends before the 1024 cylinder limit where the stuff needed at boot time is
    stored.


    ### Question 32: FDISK/MBR


    What do FDISK /MBR do?


    A: People often recommend the undocumented DOS command `FDISK /MBR` to solve problems
    with the MBR. This command however does not rewrite the entire MBR - it just rewrites
    the boot code, the first 446 bytes of the MBR, but leaves the 64-byte partition
    information alone. Thus, it won''t help when the partition table has problems.
    Moreover, it can be dangerous to restore the boot code to its original state:
    if the cause of the problems was a boot sector virus, then vital information may
    have been stored elsewhere by the virus and killing the virus may mean killing
    access to this information. (For example, the `stoned.empire.monkey` virus encrypts
    the original MBR to sector 0/0/3.) However, people who want to uninstall `LILO`,
    and do not know that `LILO` has a `-u` option, can use `FDISK /MBR` for this purpose.


    In a Linux environment, one can wipe all of the MBR with a command like `dd if=/dev/zero
    of=/dev/hda count=1 bs=512`. If only the boot code must be removed, but not the
    partition table, then `dd if=/dev/zero of=/dev/hda count=1 bs=446` will do. Be
    very careful with such commands. Usually one regrets them later.


    ### Question 33: Hard drive partitioning


    What is hard drive partitioning?


    A: Hard disk drive partitioning is the creation of logical divisions upon a hard
    disk that allows one to apply operating system-specific logical formatting. In
    simple terms, partitioning a hard drive makes it appear to be more than one hard
    drive, especially in how each partition is formatted for different operating systems
    and in how files are copied from one partition to another.


    Partitioning allows the creation of several file systems on a single hard disk.
    This has many benefits:

    - creation of several file systems on a single hard disk

    - allowing for dual boot setups (e.g., Windows and Linux)

    - protection of data via read-only partitions

    - isolation of file systems to prevent damage from affecting others


    Linux allows only 4 primary partitions. You can have a much larger number of logical
    partitions by sub-dividing one of the primary partitions. Only one of the primary
    partitions can be sub-divided. In Linux terminology, your first drive is `/dev/hda`,
    and partitions are `/dev/hda1`, `/dev/hda2`. Your second drive, if you have one,
    will be `/dev/hdb`, with partitions within it named `/dev/hdb1`, `/dev/hdb2`.
    Your first disk, if any, is `/dev/sda`.


    There are two types of partition:

    1. **Primary partition**: Contains one file system. In MS-DOS and earlier versions
    of Windows systems, the first partition (C:) must be a primary partition. Other
    operating systems may not share this limitation.

    2. **Extended partition**: Able to contain several file systems, known as logical
    disks.


    ### Question 34: Partition with fdisk


    How can I partition my hard drive with the fdisk utility?


    A: The following answer shows you how to actually partition your hard drive with
    the `fdisk` utility. The utility is started by typing (as root) `fdisk device`
    at the command prompt. The device might be something like `/dev/hda` or `/dev/sda`.
    The basic fdisk commands you need are:

    - `p`: print the partition table

    - `n`: create a new partition

    - `d`: delete a partition

    - `q`: quit without saving changes

    - `w`: write the new partition table and exit


    Changes you make to the partition table do not take effect until you issue the
    write (`w`) command. Here is a sample partition table:


    ```

    Disk /dev/hdb: 64 heads, 63 sectors, 621 cylinders

    Units = cylinders of 4032 * 512 bytes


    Device Boot Start End Blocks Id System

    /dev/hdb1* 1184 370912+ 83 Linux

    /dev/hdb2 185 368 370944 83 Linux (Note: example values)

    ```

    '
