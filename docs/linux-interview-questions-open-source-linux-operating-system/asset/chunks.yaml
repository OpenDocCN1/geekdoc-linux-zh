    现在，你应该准备好播放一个简单的音频文件。获取一个音频样本文件，并将其发送到音频设备，作为声音输出的基本检查，例如：


    ```

    cat endoftheworld >/dev/dsp

    cat crash.au >/dev/audio

    ```


    （确保你没有漏掉上述命令中的 `>`）。


    请注意，使用 `cat` 播放音频文件的正确方法；它只是一个快速检查。你需要获取一个合适的音频播放器程序，它可以提供更好的效果。


    如果上述命令返回“I/O error”，你应该查看使用 `dmesg` 命令列出的内核消息末尾。那里很可能打印了错误信息。很多情况下信息是“Sound: DMA
    (output) timed out - IRQ/DRQ config error?”。该信息意味着驱动程序没有收到声卡预期的中断。在大多数情况下，这意味着配置给驱动程序的
    `IRQ` 或 `DMA` 通道无法工作。让其运行的最佳方法是尝试设备支持的所有可能的 `DMAs` 和 `IRQs`。


    另一个可能原因是设备与驱动程序所配置的设备不兼容。当一个所谓的“兼容 SoundBlaster (Pro/16)”的声卡无法与 SoundBlaster 驱动程序配合时，情况几乎肯定如此。在这种情况下，你应该尝试找出你的声卡兼容的设备。


    如果你具有音频输入能力，可以使用如下命令进行此快速测试：


    ```

    # 从麦克风录制 4 秒音频

    dd bs=8k count=4 </dev/audio >sample.au

    4+0 records in

    4+0 records out


    # 播放声音

    cat sample.au >/dev/audio

    ```


    显然，为了让此生效，你需要将麦克风连接到声卡并对着它说话。你可能还需要获取一个混合器程序将麦克风设置为输入设备并调整录音增益水平。


    如果这些测试通过，你就可以完全相信声音 D/A 或 A/D 硬件和软件工作正常。


    某些 Linux 发行版提供了声卡驱动配置实用程序，它可以检测你的声卡并设置所有必要的配置文件，为你的声卡加载相应的音频驱动程序。例如，Red Hat Linux
    提供了 `sndconfig` 工具。如果你的发行版提供了此类工具，我建议你尝试使用它。


    ## 第三章：安装软件


    ## 问题 47：Red Hat 软件包管理器


    ### 什么是 RPM？


    答：RPM 代表 Red Hat Package Manager（红帽软件包管理器）。然而，在如今，RPM 不仅是红帽特有的，因为许多其他 Linux 发行版也使用
    `RPM` 管理它们的软件。例如，Mandriva 和 SuSE 都使用 `RPM` 进行软件管理。通过 `RPM`，你可以在 Linux 上安装、升级和卸载软件，并跟踪系统中已安装的
    `RPM` 软件包。之所以可以实现，是因为 RPM 保留了所有通过它安装的软件的数据库。


    RPM 使用扩展名为 `.rpm` 的软件包。一个 `RPM` 软件包包含了要安装的实际软件、可能还有软件的一些额外文件、关于软件及其文件安装位置何的信息，以及为了运行该特定软件你需要在系统中拥有的其他文件列表。


    当你使用 `RPM` 安装软件包包时，`RPM` 会检查你的系统是否适合该 `RPM` 软件包包含的软件，确定包所提供的文件的安装位置，将它们安装到你的系统中，并将该软件加入其已安装的
    `RPM` 软件包数据库中。


    不同的 Linux 发行版可能会将软件及其相关文件存放在不同的目录中。这就是为什么使用为该发行版制作的 `RPM` 软件包至关重要。当一个所谓的“兼容 SoundBlaster
    (Pro/16)”的声卡无法与 SoundBlaster 驱动程序配合时，情况几乎肯定如此。在这种情况下，你应该尝试找出你的声卡兼容的设备。


    如果你具有音频输入能力，可以使用如下命令进行此快速测试。


    显然，为了让此生效，你需要将麦克风连接到声卡并对着它说话。你可能还需要获取一个混合器程序将麦克风设置为输入设备并调整录音增益水平。


    如果这些测试通过，你就可以完全相信声音 D/A 或 A/D 硬件和软件工作正常。


    ## 问题 48：安装和升级 RPM 软件包


    ### 安装 RPM 软件包的程序是什么？


    答：使用 `rpm` 命令配合 `-i` 选项（代表 install）来安装软件包。例如，要安装名为 `software-2.3.4` 的 RPM 软件包：


    ```

    rpm -i software-2.3.4

    ```


    如果你已经在系统中安装了某个版本并想升级到新版本，使用 `-U` 选项（代表 upgrade）。例如，如果你有 `software-2.3.3`：


    ```bash

    rpm -U software-2.3.3

    ```


    不同的 Linux 发行版可能会将软件及其相关文件存放在不同的目录中。这就是为什么使用为该发行版制作的 `RPM` 软件包至关重要。当你在 Linux 上安装软件时，需要
    root 权限。


    ## 问题 49：依赖项错误


    ### RPM 停止安装，我遇到了依赖错误。我该如何继续安装？


    答：许多 Linux 程序需要其他文件或程序才能正常工作。某个软件依赖于其他软件。当你尝试安装 RPM 软件包时，`RPM` 会自动检查其数据库以软件所需的其他文件。如果
    `RPM` 在数据库中找不到这些文件，它就会停止安装软件并报告依赖项错误。


    当你遇到依赖错误时，RPM 会列出程序需要的文件列表。列表中的文件可能是你系统中没有的，或者是你已经拥有但版本不对的文件。你必须找到 RPM 报错的那些，安装或升级这些文件，然后重新尝试安装你正在安装的包。


    如果所需文件已存在但仍然遇到依赖错误，使用 `--nodeps` 选项。这告诉 `RPM` 在安装包之前不要检查任何依赖关系：


    ```

    rpm -i software-2.3.4.rpm --nodeps

    ```


    这将强制 `RPM` 忽略依赖错误并安装软件，但如果所需文件不存在，程序将无法正常工作或完全无法工作。只有在你确定所需文件存在时才使用 `--nodeps`
    选项。


    ## 问题 50：卸载通过 RPM 安装的软件


    ### 卸载通过 RPM 安装的软件的正确方法是什么？


    答：卸载通过 `RPM` 安装的软件，使用 `-e` 选项（代表 erase）：


    ```

    rpm -e software-2.3.4

    ```


    卸载时不需要输入包含该软件的软件包完整名称，也不输入 `.rpm` 扩展名。可能你不需要输入版本号，所以这样做与 `-e` 选项的效果完全相同：


    ```bash

    rpm -e software

    ```


