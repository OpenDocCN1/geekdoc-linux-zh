    解决此问题的快速方法是使用重置按钮或电源循环来进行完全重启，而不是软重启（例如 `Ctrl-Alt-Del`）。


    正确的解决方案是确保在 MS-DOS 和 Linux 中使用相同的 `IRQ` 和 `DMA` 设置（或者根本不使用 DOS）。


    ## 问题 46：配置 Linux 以支持音频


    配置 Linux 支持音频的正确步骤是什么？


    A: 请遵循以下步骤：


    1. **安装声卡**：按照制造商的说明书安装硬件，或让您的经销商进行安装。旧的声卡通常具有针对 `IRQ`、`DMA` 通道的开关或跳线设置；请下所使用的值。如果不确定，请使用出厂默认值。尽量避免与其他设备（例如以太网卡、SCSI
    主适配器、串口和并行口）发生冲突。通常，您应该使用在 DOS 下有效的 I/O 端口、`IRQ` 和 `DMA` 设置。在某些情况下，您可能需要使用不同的设置才能在
    Linux 下正常工作。可能需要反复尝试。


    2. **如果适用，配置即插即用（Plug and Play）**：某些声卡使用 ISA 即插即用协议来配置 I/O 地址、中断和 `DMA` 通道的设置。如果您使用的是较新的
    PCI 总线类型声卡，或者使用固定设置或跳线的极旧 ISA 声卡，则可以跳过此步骤。配置即插即用卡的首选方法是使用大多数 Linux 发行版自带的 `isapnp`
    工具，或从 Red Hat 网站 [http://www.redhat.com/] 下载它们。


    首先检查您使用的 Linux 发行版的文档。它可能已经为您设置好了即插即用支持，或者工作方式与此处描述的略有不同。如果您需要自己配置，可以在 `isapnp`
    工具的帮助手册（man pages）中找到详细信息。通常您通常会遵循的流程如下：


    - 使用 `pnpdump` 所有即插即用设备的可能设置，并将结果保存到文件 `/etc/isapnp.conf`。

    - 选择与系统中任何其他设备不冲突的声卡设置，并取消 `/etc/isapnp.conf` 中相应的行。不要忘记取消结尾附近的 `(ACT Y)` 命令注释。

    - 确保在系统启动时运行 `isapnp`，通常由一个启动脚本完成。重启您的系统或手动运行 `isapnp`。


    由于某些原因您无法或不愿使用 `isapnp` 工具，还有其他选项。如果您在 Microsoft Windows 95 或 98 下使用该声卡，可以使用设备管理器设置声卡，然后使用
    `LOADLIN` 程序软启动进入 Linux。确保 Windows 和 Linux 使用相同的声卡设置参数。如果您在 DOS 下使用该声卡，可以使用 SoundBlaster16
    PnP 声卡附带的 `icu` 工具在 DOS 下对其进行配置，然后使用 `LOADLIN` 程序软启动进入 Linux。再次，确保 DOS 和 Linux
    使用相同的声卡设置参数。真正的 ISA PnP 支持在 2.4 及更高内核中实现。某些声卡驱动程序现在支持自动检测并配置声卡，而无需 `isapnp` 工具。详情请查看声卡驱动程序的文档。


    3. **为音频支持配置并构建内核**：您需要在内核存在适用于您的声卡的设备驱动程序。运行您系统上的内核可能已经包含了您的声卡的驱动程序。大多数情况下，驱动程序会被构建为内核可加载模块。您可以通过查看
    `/lib/modules` 目录来检查哪些驱动程序作为模块可用。对于 2.4.4 内核，音频驱动程序通常出现在 `/lib/modules/2.4.4/kernel/drivers/sound/`。如果您看到了您声卡的驱动程序，可以尝试使用模块目录并跳过重新编译内核。


    如果音频驱动程序尚未构建，您需要配置并构建新内核。您可以将音频驱动程序构建到内核中，也可以将其构建为内核可加载模块。大多数情况下优选构建为模块，因为允许您在不确定使用哪种驱动程序时轻松尝试加载不同的驱动程序，并且在不需要时卸载驱动程序以释放内存。如果您不熟悉内核模块并想要更简单的解决方案，将驱动程序构建到内核本身可能是可能的。


    如果您以前从未配置过内核支持音频，最好阅读内核音频驱动程序带的相关文档，特别是针对您的卡类型的特定信息。这些文件可以在内核文档目录中找到，通常安装在 `/usr/src/linux/Documentation/sound`。如果该目录不存在，您可能使用的是非常旧的内核版本，或者没有安装内核源码。按照通常程序构建内核。目前配置过程有三个接口。在
    X11 下运行的图形用户界面可以通过 `make xconfig` 调用。仅需要文本显示的菜单系统可以通过 `make menuconfig` 获得。原始方法使用
    `make config` 提供了一个基于文本的界面。


    在配置内核时，会有许多选项来选择您拥有的声卡类型和要使用的驱动程序选项。配置工具中的在线帮助应提供每个选项用途的说明。根据您的知识选择合适的选项。配置好选项后，您应该编译并安装新内核。


    4. **创建设备文件**：为了正常运行，必须为音频设备创建设备文件。这些文件通常在安装 Linux 系统期间为您创建。可以使用下面的命令对设备文件进行快速检查。如果输出所示（时间戳会有不同），则设备文件基本正常。


    ```

    ls -l /dev/dsp

    crw-rw-rw-1 root 14,3 Jan 25 1997

    ```


    注意，拥有正确的设备文件并不保证一切。内核驱动必须先加载或编译。少数情况下，如果您认为设备文件错误，可以重新创建。大多数 Linux 发行版都有一个用于此目的的
    `MAKEDEV` 脚本。注意，如果您在 2.4 内核中使用 devfs 系统，音频设备文件实际上位于 `/dev/sound`，但会有指向旧设备（如 `/dev/dsp`）的符号链接。


    5. **启动 Linux 内核并测试**：现在现在可以启动新内核并测试音频了。按照通常的程序安装并重启新内核。


    如果您使用内核模块处理音频，则需要使用 `modprobe` 命令加载相应的驱动程序，例如为 SoundBlaster 卡运行 `modprobe sb`。


    启动或加载内核模块后，使用 `dmesg` 命令检查是否有如下消息：


    ```

    Soundblaster audio driver Copyright (C) by Hannu Savolainen 1993-1996

    sb: AWE64 PnP detected

    sb: ISAPnP reports ''Creative AWE64 PnP'' at i/o 0x220, irq 5, dma 1, 5

    SB 4.16 detected OK (220)

    sb: 1 Soundblaster PnP card(s) found.

    Crystal 4280/46xx + AC97 Audio, version 1.22.32, 10:28:40 Apr 28 2001

    cs46xx: Card found at 0xf4100000 and 0xf4000000, IRQ 11

    cs46xx: Thinkpad 600X/A20/T20 (1014:0153) at 0xf4100000/0xf4000000, IRQ 11

    ac97_codec: AC97 Audio codec, id: 0x4352:0x5914 (Cirrus Logic CS4297A rev B)

    ```


    该消息指示已找到声卡，并匹配您的声卡类型和跳线设置（如果有）。如果您错误配置错误或选择了错误的驱动程序，驱动程序可能会显示一些错误信息和警告。


    '
- fmt: '

    Previous versions of this HOWTO suggested checking the output of `/dev/sndstat`.
    This is no longer supported in the 2.4 and later kernels.


    Now you should be ready to play a simple sound file. Get hold of a sound sample
    file, and send it to the sound device as a basic check of sound output, e.g.


    ```

    cat endoftheworld >/dev/dsp

    cat crash.au >/dev/audio

    ```


    (Make sure you don''t omit the `>` in the commands above).


    Note that using `cat` is not the proper way to play audio files; it''s just a
    quick check. You''ll want to get a proper sound player program that will do a
    better job.


    If the above commands return "I/O error", you should look at the end of the kernel
    messages listed using the `dmesg` command. It''s likely that an error message
    is printed there. Very often the message is "Sound: DMA (output) timed out - IRQ/DRQ
    config error?” The message means that the driver didn''t get the expected interrupt
    from the sound card. In most cases it means that the `IRQ` or the `DMA` channel
    configured to the driver doesn''t work. The best way to get it working is to try
    with all possible `DMAs` and `IRQs` supported by the device.


    Another possible reason is that the device is not compatible with the device the
    driver is configured for. This is almost certainly the case when a supposedly
    "SoundBlaster (Pro/16) compatible" sound card doesn''t work with the SoundBlaster
    driver. In this case you should try to find out the device your sound card is
    compatible with.


    If you have sound input capability, you can do a quick test of this using command
    such as the following:


    ```

    # record 4 seconds of audio from microphone

    dd bs=8k count=4 </dev/audio >sample.au

    4+0 records in

    4+0 records out


    # play back sound

    cat sample.au >/dev/audio

    ```


    Obviously for this to work you need a microphone connected to the sound card and
    you should speak into it. You may also need to obtain a mixer program to set the
    microphone as the input device and adjust the recording gain level.


    If these tests pass, you can be reasonably confident that the sound D/A or A/D
    hardware and software are working.


    Some Linux distributions provide a sound driver configuration utility that will
    detect your sound card and set up the entire necessary configuration files to
    load the appropriate sound drivers for your card. Red Hat Linux, for example,
    provides the `sndconfig` utility. If your distribution provides such a tool I
    suggest you try using it.


    ## Chapter III: Installing Software


    ## Question 47: Red Hat Package manager


    ### What is RPM?


    A: RPM stands for Red Hat Package Manager. However, these days RPM isn''t only
    Red Hat specific because many other Linux distros use `RPM` for managing their
    software. For example, both Mandriva and SuSE use `RPM` for software management.
    With `RPM`, you can install, upgrade and uninstall software on Linux, as well
    as keep track of already installed `RPM` packages on your system. This can be
    done because RPM keeps a database of all software that was installed with it.


    RPM uses software packages that have the `.rpm` extension. An `RPM` package contains
    the actual software that gets installed, maybe some additional files for the software,
    information on where the software and its files get installed and a list of other
    files you need to have on your system in order to run this specific piece of software.


    When you use `RPM` for installing the software package, `RPM` checks if your system
    is suitable for the software the `RPM` package contains, figures out where to
    install the files the package provides, installs them on your system and adds
    that piece of software into its database of installed `RPM` packages.


    Different Linux distros may keep their software and the files related to that
    software in different directories. That''s why it''s important to use the `RPM`
    package that was made for your distribution. For example, if you install a SuSE
    specific software package on a Red Hat system, `RPM` may put the files from that
    package into wrong directories. In the worst case the result is that the program
    doesn''t find all the files it needs and doesn''t work properly.


    Note that you need to be root when installing software in Linux. When you''ve
    got the root privileges, you use the `rpm` command with appropriate options to
    manage your `RPM` software packages.


    ## Question 48: Installing and upgrading RPM packages


    ### What is the proper procedure tin install and upgrade RPM packages?


    A: Use the `rpm` command with `-i` option (which stands for "install") for installing
    a software package. For example, to install an RPM package called `software-2.3.4.rpm`:


    ```

    rpm -i software-2.3.4.rpm

    ```


    If you already have some version installed on your system and want to upgrade
    it to the new version, use `-U` option (which stands for "upgrade"). For example,
    if you have `software-2.3.3.rpm` and wants to upgrade it:


    ```bash

    rpm -U software-2.3.3.rpm

    ```


    If nothing goes wrong, the files from the package get installed into appropriate
    directories. Executable programs go into `/bin`, `/usr/bin`, `/usr/X11/bin` after
    installing with `rpm`. Sometimes you don''t have to know the path where the program
    was installed because you don''t have to type the whole path when running the
    program, only the program''s name is needed.


    ## Question 49: Error: failed dependencies


    ### RPM stopped installing and I’m getting a dependency error. How do I resume
    installation?


    A: Many Linux programs need other files or programs in order to work properly.
    A piece of software depends on other software. When you try to install an RPM
    package, `RPM` automatically checks its database for other files that the software
    needs. If `RPM` can''t find those files in its database, it stops installing the
    software and complains about failed dependencies.


    RPM gives out a list of files the program needs when you get a dependency error.
    The files in the list are probably ones you don''t have on your system or files
    that you have but are the wrong versions. You will have to find the files RPM
    complains about, install or upgrade those files and then try to install the package
    you were installing.


    If the needed files are there and still get a dependency error, use the `--nodeps`
    option. This tells `RPM` not to check any dependencies before installing the package:


    ```bash

    rpm -i software-2.3.4.rpm --nodeps

    ```


    This forces `RPM` to ignore dependency errors and install software anyway but
    if the needed files are not there, the program won''t work well or won''t work
    at all. Use the `--nodeps` option only when you know that the needed files are
    there.


    ## Question 50: Removing software installed with RPM


    ### What is the correct method to remove software installed with RPM?


    A: To remove software that was installed with `RPM`, use the `-e` option (erase):


    ```bash

    rpm -e software-2.3.4

    ```


    You don''t have to type the whole name of the package that contained the software
    and you don''t have to type the `.rpm` extension when removing software. Probably,
    you don''t have to type the version number either, so this would do exactly the
    same as the `-e` option:


    ```bash

    rpm -e software

    ```

