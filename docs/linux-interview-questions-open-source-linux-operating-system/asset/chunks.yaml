  trans: "\n\n# 问题 80：删除目录\n\n我想删除空目录。最好的方法是什么？\n\n答：你可以使用两个命令来删除目录。如果目录是空目录，可以使用\
    \ `rmdir`：\n\n```bash\nrmdir dir1\n```\n\n如果你想删除一个包含所有内容的目录，可以使用带有 `-r` 选项的 `rm`。`-r`\
    \ 选项告诉 `rm` 递归删除目录：\n\n```bash\nrm -r dir1\n```\n\n删除包含内容的目录时，最好使用 `-i` 选项，这样在处理目录中的每个文件之前系统都会提示你。\n\
    \n```bash\nrm -ir dir1\n```\n\n# 问题 81：复制和移动目录\n\n我如何在 Linux 中复制和移动选定的目录？\n\n\
    答：对于目录的复制和移动，你可以像处理文件一样使用 `cp` 和 `mv` 命令。你可能已经注意到，如果你尝试直接用 `cp` 复制目录，它会向你报错。如果你想复制一个目录及其内容，`cp`\
    \ 命令要求你使用 `-r` 选项。`-r` 意味着“递归复制”：\n\n```bash\ncp -r dir1 dir2\n```\n\n上述操作会创建一个名为\
    \ `dir2` 的目录，其内容与 `dir1` 完全相同。然而，如果 `dir2` 已经存在，则内容不会被覆盖：目录 `dir1` 将复制到 `dir2`\
    \ 目录下，命名为 `dir2/dir1`。\n\n在重命名目录时，使用与处理文件完全相同的 `mv` 命令：\n\n```bash\nmv dir1 dir2\n\
    ```\n\n在处理目录时，`mv` 的工作方式与 `cp` 类似。如果 `dir2` 不存在，上述操作将 `dir1` 重命名为 `dir2`；但如果 `dir2`\
    \ 存在，目录 `dir1` 将移动到 `dir2` 目录下，命名为 `dir2/dir1`。\n\n# 问题 82：df 命令\n\n我可以使用什么工具查看磁盘使用情况？\n\
    \n答：获取文件和文件系统信息的主要工具都相对简单且易用。`df`（显示磁盘使用情况）还会显示 inode 使用情况，`df –i`（inode 包含有关文件的信息，例如在磁盘驱动器上的位置，如果你有很多小文件，可能会在耗尽磁盘空间之前就耗尽这些\
    \ inode）。这会导致“磁盘已满”的错误信息，而实际上 `df` 会显示有可用空间（但 `df –i` 会显示 inode 已用尽）。这与 Windows\
    \ 中的文件分配项类似，在 `vfat` 中它实际上以 `8.3` 格式存储名称，使用多个条目处理长文件名，每个目录最多 512 个条目，长文件名过多时目录就“满了”。\n\
    \n只需输入 `df`，即可显示所有挂载文件系统的以 1K 块的磁盘使用情况。例如：\n\n```text\nuser@server:~> df\nFilesystem\
    \ 1K-blocks Used Available Use% Mounted on\n/dev/hda3 5242904 75969244832121 5%\
    \ /\ntmpfs 127876 8001 27868 1% /dev/shm\n/dev/hda1 127351 33047 8772928% /boot\n\
    /dev/hda9 10485816 33508 104523081%/home\n/dev/hda8 5242904 932468 431043618%\
    \ /srv\n/dev/hda7 3145816 32964311285222%/tmp\n/dev/hda5 5160416 474336 4423928\
    \ 10%/usr\n/dev/hda6 3145816412132 2733684 14% /var\n```\n\n# 问题 83：fsck 命令\n\n\
    我如何检查并修复文件的不一致性？\n\n答：`fsck` 命令（“文件系统检查”或“文件系统一致性检查”）是一个检查文件系统一致性的工具。文件系统可能由于多种原因变得不一致，最常见的是由于硬件故障、断电或在没有正常关机的情况下关闭系统导致的异常关闭。由于这些原因，文件系统中的超级块（super\
    \ block）没有更新，并且与系统数据块、空块和 inode 的相关信息不匹配。\n\n由于这些原因，文件系统中的超级块没有更新，并且与系统数据块、空块和\
    \ inode 的相关信息不匹配。\n\n### 运行模式\n`fsck` 以两种模式运行：交互式和非交互式：\n\n-   **交互式 (interactive)**：`fsck`\
    \ 检查文件系统并在每个错误处停止，询问用户是否纠正。\n-   **非交互式 (Non-interactive)**：`fsck` 尝试修复所有发现的错误，而不等待用户响应。\n\
    \n### 命令语法\n```\nfsck [-F fstype] [-V] [-yY] [-o options] special\n```\n `-F fstype`：要修复的文件系统类型（例如\
    \ `ufs`、`vxfs`）\n `-V`：验证命令语法但不运行命令\n- `-y` 或 `-Y`：以非交互模式运行命令 - 所有遇到的错误。\n- `-o\
    \ options`：可以通过 `-o` 指定三个选项：\n    - `b=n`：其中 `n` 是主超级块损坏时的下一个超级块编号。\n- `f`：无论清理标志如何都强制检查文件系统。\n\
    - `special`：要检查的文件系统的块或字符设备名称 - 例如 `/dev/rdsk/c0t0s4`。\n\n### 阶段\n`fsck` 分 5 个阶段检查文件系统，每个阶段检查文件系统的特定功能：\n\
    1. **第 1 阶段**：检查块和大小\n2. **第 2 阶段**：检查路径\n3. **第 3 阶段**：检查连接性\n4. **第 4 阶段**：检查引用计数\n\
    5. **第 5 阶段**：检查柱组\n\n### 错误信息与修复措施\n1. **超级块损坏**：`fsck` 无法运行。如果超级块损坏，仍可以使用创建新文件系统时生成的备用超级块进行修复。第一个备用超级块编号为\
    \ 32，其他超级块编号可以通过命令找到：\n```bash\nnewfs -N /dev/rdsk/c0t0d0s6\n```\n例如，使用第一个备用超级块运行\
    \ `fsck` 的命令如下：\n```bash\nfsck -F ufs -o b=32 /dev/rdsk/c0t0d0s6\n```\n\n2. **链接计数调整**：`fsck`\
    \ 发现目录 inode 链接计数与实际目录链接之间不匹配，并在交互式操作时提示调整。链接计数调整被认为是文件系统中的安全操作，应该通过对 `adjust?`\
