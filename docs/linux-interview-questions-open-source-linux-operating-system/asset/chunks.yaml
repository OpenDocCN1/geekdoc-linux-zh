    每个分区表扇区包含 4 个分区描述符。分区描述符的类型可能可能是 `05`（DOS 扩展分区）、`0f`（W95 扩展分区）、`85`（Linux 扩展分区）或
    `c5`（DRDOS/安全扩展分区），在这种情况下，它指向另一个分区表扇区。通过这种方式，我们获得了一个分区的四元树。Linux 接受 `85` 作为 `05`
    的同义词——这对于想要创建超过 1024 柱面限制的扩展分区的用户（以防止 DOS `fdisk` 崩溃或挂起）非常有用。Windows 95 使用 `0f`
    用于 LBA 映射扩展分区。因此，扩展分区并不是一个包含数据的分区，而是一个包含其他分区的“盒子”。尽管如此，起始扩展分区的分区表扇区留有足够的空间来包含如
    `LILO` 这样的引导程序，因此启动扩展分区是可能的。


    大多数操作系统都严格限制了接受的树形结构。通常不允许分支，用户得到的是分区表扇区的线性链。Linux 允许接受多个扩展主分区。


    ### 问题 31：分区的优势


    对我的磁盘进行分区有什么好处？


    A：磁盘的分区表将磁盘分割成“逻辑磁盘”。想要这样做有几个原因。DOS 不支持大于 2 GB 的文件系统，因此需要分区来打破这个“2 GB 屏障”。不同的分区可以携带不同的操作系统或不同的文件系统（FAT,
    HPFS, NTFS, ext2, ...）供一个操作系统使用。有时，小分区被用于特殊目的（OS/2 引导管理器使用一个小分区用于自身；各种笔记本电脑都有一个“休眠”分区，当系统进入睡眠时将状态存储其中）。某些“可靠”的系统具有备份分区。为了备份目的（例如备份到磁带），拥有一个大小合适的分区，使得整个分区可以写入单个磁带是非常方便的。


    将自己的东西（例如在 `/home` 下）和私有安装的包（例如在 `/usr/local` 下）与从发行版安装的软件分开是一个好主意。如果这些位于不同的分区上，则更容易进行完全重新安装（或切换到不同的发行版），而不会丢失自己的数据。


    对于设计良好的系统，通常可以将所有基础系统软件放在只读分区上，从而降低损坏的概率并节省备份时间。还有安全方面；例如，在 Unix 系统上，可以将根文件系统以外的所有文件系统挂载为
    ''nosuid,nodev''，并将 `/tmp`、`/home`、`/var` 不放在根文件系统中，以尽可能减少某些 suid 程序通过硬链接欺骗覆盖重要系统文件的可能性。


    最后是旧的 BIOS 问题，可能导致无法启动位于 1024 柱面之后的系统。这可能意味着必须有一个在 1024 柱面限制之前结束的分区，用于存储启动时所需的内容。


    ### 问题 32：FDISK/MBR


    FDISK /MBR 的作用是什么？


    A：人们经常使用未定义的 DOS 命令 `FDISK /MBR` 来解决 MBR 问题。然而，此命令并没有重写整个 MBR——它只是重写引导代码（MBR 的前
    446 字节），而保留 64 字节的分区信息。因此，当分区表出现问题时，它没有帮助。此外，将引导代码恢复到原始状态可能是危险的：如果问题源是引导区病毒，那么病毒可能将重要信息存储在其他地方，而杀死病毒可能意味着丢失访问这些信息的。（例如，`stoned.empire.monkey`
    病毒会将原始 MBR 加密到扇区 0/0/3。）然而，想要卸载 `LILO` 且不知道 `LILO` 有 `-u` 选项的人可以使用 `FDISK /MBR`
    实现此。


    在 Linux 环境中，可以使用类似 `dd if=/dev/zero of=/dev/hda count=1 bs=512` 的命令擦除整个 MBR。如果只需要移除引导代码而不是分区表，则使用
    `dd if=/dev/zero of=/dev/hda count=1 bs=446` 即可。使用此类命令时要非常小心。通常人们以后会后悔。


    ### 问题 33：硬盘分区


    什么是硬盘分区？


    A：硬盘分区是在硬盘上创建逻辑划分，允许对其应用特定于操作系统的逻辑格式化。简单来说，硬盘分区使其看起来像是多个硬盘，特别体现在每个分区如何为不同的操作系统进行格式化，以及文件如何从一个分区复制到另一个分区。


    对硬盘进行分区允许在单个硬盘上创建多个文件系统。这有许多优点：

    - 在单个硬盘上创建多个文件系统

    - 允许双启动设置（例如 Windows 和 Linux）

    - 通过只读分区保护数据

    - 隔离文件系统以防止损坏影响其他分区


    Linux 仅允许 4 个主分区。你可以通过细分其中一个主分区来获得数量更多的逻辑分区。只有一个主分区可以被细分。在 Linux 术语中，第一个硬盘是 `/dev/hda`，分区为
    `/dev/hda1`、`/dev/hda2`。如果有第二个硬盘，将是 `/dev/hdb`，其内部分区为 `/dev/hdb1`、`/dev/hdb2`。


    分区有两种类型：

    1. **主分区**：包含一个文件系统。在 MS-DOS 和早版本的 Windows 系统中，第一个分区（C:）必须是主分区。其他操作系统不受此限制。

    2. **扩展分区**：能够包含多个文件系统，称为逻辑磁盘。


    ### 问题 34：使用 fdisk 分区


    我如何使用 fdisk 工具对硬盘进行分区？


    A：以下回答将向你展示如何使用 `fdisk` 工具对硬盘进行分区。在命令行提示符下，以 root 身份输入 `fdisk device` 启动该工具。设备可能是
    `/dev/hda` 或 `/dev/sda`。你需要的基础 fdisk 命令有：

    - `p`：打印分区表

    - `n`：新建分区

    - `d`：删除分区

    - `q`：退出不保存更改

    - `w`：写入新分区表并退出


    对分区表进行的更改在执行写入 (`w`) 命令之前不会生效。这是一个示例分区表：


    ```

    Disk /dev/hdb: 64 heads, 63 sectors, 621 cylinders

    Units = cylinders of 4032 * 512 bytes


    Device Boot Start End Blocks Id System

    /dev/hdb1* 1184 370912+ 83 Linux

    /dev/hdb2 185 368 370944 83 Linux (注：示例值)

    ```

