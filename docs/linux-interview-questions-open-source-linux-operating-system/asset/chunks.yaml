    As you can see, `chown` nicely reports to you what it did to each file.


    ## Use of chgrp: change the group ownership of a file.


    You can also use the `chgrp` command to change the group of a file or a directory.
    Also as with `chown`, you must be either the root user or the owner of the file
    in order to change the group ownership.


    The command `chgrp` works pretty much the same way as `chown` does, except it
    changes the file''s user group instead of the owner.


    ```bash

    $ chgrp usergroup redfile

    ```


    After issuing this command, the file `redfile` will be owned by a user group `usergroup`.
    Although the file''s group has changed to `usergroup`, the file''s owner will
    still be the same.


    The options of using `chgrp` are the same as using `chown`. So, for example, the
    `-R` and `-v` options will work with it just like they worked with `chown`:


    ```bash

    $ chgrp -Rv usergroup somedir

    ```


    ```

    changed group of ''somedir/'' to usergroup

    changed group of ''somedir/bluefile'' to usergroup

    changed group of ''somedir/redfile'' to usergroup

    ```


    The command `chown` nicely reports to you what it did to each file.


    ## Question 75: View text files


    I want to see or read the files in my Linux file system. What command do I use?


    A: You can view and edit text files with `cat` and `less`.


    The `cat` is a simple little program that displays the contents of a text file
    when you give the file name as an argument to it:


    ```bash

    $ cat view_this

    ```


    This is a nice way of viewing short files that fit on your screen. If the file
    is long and its contents cannot be displayed on your screen all at once, use `less`
    instead.


    The `less` is a program that lets you view long text files. You use `less` by
    giving the file name as an argument to it:


    ```bash

    $ less view_this

    ```


    When viewing the file, you can use Page Up and Page Down keys to move through
    the file and typing `q` will exit.


    It is also possible to open several files at the same time so you can navigate
    from one file to next without closing it first. If you want to open several files,
    just give all the file names at once:


    ```bash

    $ less file1 file2 file3

    ```


    When viewing several files at the same time, you can use `:n` for examining the
    next file and `:p` for the previous file.


    Here are some widely used commands in `less`:


    | Command / key | Action |

    | :--- | :--- |

    | `e`, `j`, `Down`, or `Enter` | move forward one line |

    | `y`, `k`, or `Up` | move backward one line |

    | `f`, `Space`, or `Page Down` | move forward one page |

    | `b`, or `Page Up` | move backward one page |

    | `/characters` | search forward in the file for lines containing the specified
    characters |

    | `N` | repeat the previous search |

    | `e file_name` | examine a new file |

    | `:n` | examine the next file |

    | `:p` | examine the previous file |

    | `h`, or `?` | display help |

    | `q` | quit |


    ## Question 76: File manipulation mv command


    I have already created a directory for my files, how can I clean up my unclassified
    files?


    A: The `mv` command can be used for moving or renaming files. To rename a file,
    you can use it like this:


    ```bash

    $ mv file file2

    ```


    If `file2` doesn''t exist, it''ll be created but if it exists, it''ll be overwritten.
    If you want to be prompted before overwriting files, you can use the `-i` option
    the same way as with `cp`:


    ```bash

    $ mv -i file file2

    ```


    ```

    mv: overwrite ''file2''? y

    $

    ```


    To move the file into another directory:


    ```bash

    $ mv file dir1

    ```


    If you want to rename the file to `file2` and move it into another directory:


    ```bash

    $ mv file dir1/file2

    ```


    Detailed information about the syntax and features of the `mv` command can be
    found in the `man` or `Info` pages. The use of this documentation should always
    be your first reflex when confronted with a problem. Even experienced users read
    `man` pages every day, so beginning users should read them all the time. After
    a while, you will get to know the most common options to the common commands,
    but you will still need the documentation as a primary source of information.


    ## Question 77: File manipulation cp command


    How can I copy files?


    A: You can use the `cp` command to copy files. The following will copy `file`
    to `file2`. Note that if `file2` doesn''t exist, it''ll be created but if it exists,
    it''ll be overwritten:


    ```bash

    $ cp file file2

    ```


    There is no undo command in the Linux CLI, so be very carefull to as you might
    accidentally overwrite an important file. The risk of doing so is smaller if you
    use the `-i` option ("interactive") with `cp`. The following does the same as
    the above, but if `file2` exists, it''ll be prompted:


    ```bash

    $ cp -i file file2

    ```


    ## Question 78: File manipulation rm command


    How can I remove files or directories?


    A: The `rm` command is used for removing files and directories. To remove a file:


    ```bash

    $ rm file

    ```


    You can also delete more files at once:


    ```bash

    rm file1 file2

    ```


    To remind you again, Linux doesn''t have any undo commands and it doesn''t put
    files into Trash where you can save them. To protect beginners from “damage”,
    the interactive behavior of `rm`, `cp` and `mv` commands can be activated using
    the `-i` option. In this case, the system won''t immediately act upon request.
    Instead it will ask for confirmation:


    ```bash

    $ rm -i archive/

    ```


    ## Question 79: Creating a directory


    I want to create directories and subdirectories for my files. How can I do this?


    A: That can be done with the `mkdir` command:


    ```bash

    $ mkdir archive

    $ ls -ld archive

    ```


    ```

    drwxrwxrwx 2 jim jim1111 Jan 11 11:11 archive

    ```


    If you want to create directories and subdirectories in one step, this can be
    done using the `-p` option:


    ```bash

    $ cd archive

    $ mkdir 2004 2005 2006

    $ ls

    ```


    ```

    2004/ 2005/ 2006/

    ```


    ```bash

    $ mkdir 2004/reports/Books/

    mkdir: cannot create directory ''2004/reports/Books/'': No such file or directory

    ```


    ```bash

    $ mkdir -p 2004/reports/Books/

    ```

