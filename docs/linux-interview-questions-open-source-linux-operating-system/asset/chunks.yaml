    # Question 18: Basic vi commands


    What are the basic vi commands?


    A: The `vi` editor is a common editor for UNIX systems in that it makes use of
    a regular keyboard with an escape key. On the DECstation, the escape key is the
    `F11` key. It therefore works on all UNIX computers. Complete documentation is
    available by typing `man vi` at the UNIX prompt.


    ### Starting an Editing Session


    To start `vi` just type `vi` at the operating system prompt. You will see a screen
    with a column of tildes (`~`) down the left side of the screen. This signifies
    an empty workspace. To edit a file, just include the filename after it, e.g. `vi
    filename`. You will see the text of the file you included. Vi is now in command
    mode. The most basic command to enter insert mode is `i` which lets you insert
    text to the left of the cursor.


    In insert mode the characters you type are inserted into your document. You can
    use the backspace key to delete any typing mistakes you have made on the current
    input line. The escape key (`<esc>`) takes you out of insert mode and back to
    the command mode. If you are ever in doubt about what mode you are in, just press
    `<esc>` a few times until `vi` starts complaining. You will then know that you
    are in the command mode.


    Command mode is where you do everything that isn''t done in insert mode. In command
    mode the same keys that caused letters to appear on your screen in insert mode
    now represent totally different functions.


    Here are some popular commands:


    ### Undo Command

    - `U` - undo the last command.


    ### Screen Commands

    - `CTL/l` - Reprints current screen.

    - `CTL/L` - Exposes one more line at top of screen.

    - `CTL/E` - Exposes one more line at bottom of screen.

    - `CTL/F` - Pages forward one screen.

    - `CTL/B` - Pages back one screen.

    - `CTL/D` - Pages down half screen.

    - `CTL/U` - Pages up half screen.


    ### Cursor Positioning Commands

    - `j` - Moves cursor down one line, same column.

    - `k` - Moves cursor up one line, same column.

    - `h` -Moves cursor back one character.

    - `l` - Moves cursor forward one character.

    - `RET` - Moves cursor to beginning of next line.

    - `0` - Moves cursor to beginning of current line.

    - `$` - Moves cursor to end of current line.

    - `SPACE` - Moves cursor forward one character.

    - `nG` - Moves cursor to beginning of line n. Default is last line of file.

    - `0` - Moves the cursor to the first character of the line.

    - `:n` - Moves cursor to beginning of line n.

    - `b` - Moves the cursor backward to the beginning of the previous word.

    - `e` - Moves the cursor backward to the end of the previous word.

    - `w` - Moves cursor forward to the next word.

    - `/pattern` - Moves cursor forward to next occurrence of pattern.

    - `?pattern` - Moves cursor backward to next occurrence of pattern.

    - `N` - Repeats last `/` or `?` pattern search.


    If you try to move somewhere that `vi` doesn''t want to go, e.g. pressing `h`
    when the cursor is in the left-most column, your terminal will complain by either
    beeping or flashing the screen.


    ### Text Insertion Commands

    - `a` - Appends text after cursor. Terminated by escape key.

    - `A` - Appends text at the end of the line. Terminated the escape key.

    - `i` - Inserts text before cursor. Terminated by the escape key.

    - `I` - Inserts text at the beginning of the line. Terminated by the escape key.

    - `o` - Opens new line below the current line for text insertion. Terminated by
    the escape key.

    - `O` - Opens new line above the current line for text insertion. Terminated by
    the escape key.

    - `DEL` - Overwrites last character during text insertion.

    - `ESC` - Stops text insertion. The escape key on the DECstations is the `F11`
    key.


    ### Text Deletion Commands

    - `x` - Deletes current character.

    - `dd` - Deletes current line.

    - `dw` - Deletes the current word.

    - `d)` - Deletes the rest of the current sentence.

    - `D, d$` - Deletes from cursor to end of line.

    - `P` - Puts back text from the previous delete.


    ### Changing Commands

    - `cw` - Changes characters of current word until stopped with escape key.

    - `c$` - Changes text up to the end of the line.

    - `C, cc` - Changes remaining text on current line until stopped by pressing the
    escape key.

    - `~` - Changes case of current character.

    - `xp` - Transposes current and following characters.

    - `J` - Joins current line with next line.

    - `s` - Deletes the current character and goes into the insertion mode.

    - `rx` - Replaces current character with `x`.

    - `R` - Replaces the following characters until terminated with the escape key.


    ### Cut and Paste Commands

    - `yy` - Puts the current line in a buffer. Does not delete the line from its
    current position.

    - `p` - Places the line in the buffer after the current position of the cursor.


    ### Appending Files into Current File

    - `:R filename` - inserts the file `filename` where the cursor was before the
    `:` was typed.


    ### Exiting vi

    - `ZZ` - Exits vi and saves changes.

    - `:wq` - Writes changes to current file and quits edit session.

    - `:q!` - Quits edit session (no changes made).


    # Question 19: Word count


    I want to find the number of bytes and words in my file. How can I do?


    A: Use `wc` (short for word count), this is a command in UNIX systems. The program
    reads either standard input or a list of files and generates one or more statistics:
    number of bytes, number of words. For example:


    ```

    wc ideas.txt

    40 149 22 excerpt.txt

    ```


    The first column shows the number of lines, the second column shows number of
    words and the last column characters. Newer versions of `wc` can differentiate
    between byte and character count. This difference arises with Unicode which includes
    multi-byte characters. The desired behavior is selected with the `-c` or `-m`
    switch.


    ### Description

    - `-c, --bytes`: print byte counts

    - `-m, --chars`: print the character counts

    - `-l, --lines`: print the newline counts

    - `-L, --max-line-length`: print the length of the longest line

    - `-w, --words`: print the word counts

    - `--help`: display this help and exit

    - `--version`: output version information and exit


    # Question 20: tr


    How can I translate and/or delete characters from a standard input?


    A: Use `tr` (abbreviated from translate or transliterate), it is a command in
    UNIX-like operating. When executed, the program reads from the standard input
    and writes to the standard output. It takes as parameters two sets of characters,
    and replaces occurrences of the characters in the first set with the corresponding
    elements from the other set. The following inputs, for instance, shift the input
    letters of the alphabet back by one character.


    ```

    echo "ibm 9000" >computer.txt

    tr a-z za-y <computer.txt

    hal 9000

    ```


    ### Description

    - `-c, --complement`: first complement SET1

    - `-d, --delete`: delete characters in SET1, do not translate

    - `-s, --squeeze-repeats`: replace each input sequence of a repeated character
    that is listed in SET1 with a single occurrence of that character

    - `-t, --truncate-set1`: first truncate SET1 to length of SET2

    - `--help`: display this help and exit

    - `--version`: output version information and exit


    SETs are specified as strings of characters. Most represent themselves. Interpreted
    sequences are:

    - `\NNN`: character with octal value NNN (1 to 3 octal digits)

    - `\\`: backslash

    - `\a`: audible BEL

    - `\b`: backspace

    - `\f`: form feed

    - `\n`: new line

    - `\r`: return

    - `\t`: horizontal tab

    - `\v`: vertical tab

    - `CHAR1-CHAR2`: all characters from CHAR1 to CHAR2 in ascending order

    - `[CHAR*]`: in SET2, copies of CHAR until length of SET1

    - `[CHAR*REPEAT]`

