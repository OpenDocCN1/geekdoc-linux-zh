    So, unless the devices are auto-terminating, that hard drive and the scanner must
    be set to terminate usually by jumpers or a switch on the device. In older devices,
    this might actually require placing a terminator on the end of the chain. Generally,
    that is no longer necessary. All items between the ends must have their termination
    disabled or the chain will not operate properly. If you have all internal devices
    or all external devices, then the card itself will be an end device and must be
    terminated. If you have a couple of auto termination devices, and a few which
    are not, you can try to set the auto termination devices at the ends of the chain
    to make setup easier.


    Despite the reputation of being difficult to configure, I have found that `SCSI`
    is extremely easy to get up and running. Pay attention to the issues above and
    you should be fine. Just in case, here are a few troubleshooting tips:


    - Check Termination First. Then check it again.

    - Check ID numbers.

    - Use quality cables. If you have a problem especially with a fast hard drive,
    try changing the cable.

    - Use the shortest connections possible. Pay attention to the maximum total length.

    - Make sure you have the newest `ASPI` drivers (Adaptec site if you have an Adaptec
    card).

    - Make sure the cables are plugged in correctly and firmly: `pin 1` to `pin 1`.

    - If you are not sure your devices are `SCAM` compliant, turn it off.

    - Check for IRQ conflicts.


    ### Question 42: Changing screen resolution


    I installed `mdv 2006` and it works fine at `1024X768`. I wanted to raise the
    resolution but when I do, the window is larger than my screen. I have to drag
    the mouse pointer to see the top or bottom of the screen or left and right.


    What is the best way to change the screen resolution?


    A: There are a couple of things you can do:


    1. Install all the updates available. There are several updates to the graphical
    system called `X` or `xorg`. `Mdv2006` shipped with a developmental version of
    `xorg` that caused problems with some `nvidia` based cards. Later updates fixed
    that.

    2. The configuration file for your graphical system is `/etc/X11/xorg.conf`. This
    is a fairly lengthy file divided into sections.

    3. After you installing all the updates, rerun the graphical configuration utility.
    You can do so by opening a console and run:


    ```bash

    $ su

    <enter root password>

    # XFdrake

    ```


    A window will pop up with `XFdrake`, the mandriva graphics setup utility. Check
    that you have the right card selected and double check your monitor setting. There
    is a button you can press to test the configuration changes you make before committing
    them. Keep trying until you get something that tests out properly. Actually, you
    might want to try running `XFdrake` before doing anything else. By the way, `XFdrake`
    automatically edits `xorg.conf` for you thus simplifying the graphics setup process.

    4. Mandriva ships with the open source driver for your `nvidia` based graphics
    card called `nv`. That''s probably what you will see in your `xorg.conf` `Device`
    section for the driver. Nvidia makes an excellent closed source Linux driver but
    the installation is a little daunting for newbie’s. You need the `nvidia` driver
    for 3d acceleration necessary to run many games. After you get things running
    properly with the open source driver, you may want to consider installing the
    `nvidia` closed source driver.


    ### Question 43: Modem


    What is a Modem?


    A: A modem is a device that lets one send digital signals over an ordinary telephone
    line not designed for digital signals. If all telephone lines are digital, then
    you wouldn''t need a modem. But sometimes, a substitute for an analog modem, connected
    to a digital phone line is inaccurately called a "digital modem". A modem permits
    your computer to connect to and communicate with the rest of the world. When you
    use a modem, you normally use a communication program or web browser to utilize
    the modem and dial-out on a telephone line. Advanced modem users can set things
    up so that others may phone in to them and use the computer remotely. This is
    called "dial-in".


    Oversimplified, there are four basic types of analog modems for a PC: external
    serial (`RS-232`), `USB` (= external USB), internal, and built-in. The external
    serial and `USB` set on your desk outside the PC while the other two types are
    not visible since they''re inside the PC. The external serial modem plugs into
    a connector on the back of the PC known as a "serial port". The `USB` modem plugs
    into a `USB` cable. The internal modem is a card that is inserted inside the computer.
    The built-in modem is a chip on the motherboard used primarily in laptops. Internal
    modems will generally apply also to built-in modems. Internal modems are further
    subdivided into `PCI`, `ISA`, and `AMR` depending on whether they are designed
    for the `PCI` or `ISA` bus or for an `AMR` slot.


    When you get an internal or built-in modem, you also get a dedicated serial port
    (which can only be used with the modem and not with anything else such as an external
    modem or console terminal). In Linux, the common serial ports are named `ttyS0`,
    `ttyS1`, etc. (or `tts/0`, `tts/1` for the device system `devfs`). Modems usually
    include the ability to send Faxes while "Voice" modems can like an automatic answering
    machine.


    ### Question 44: Identify software modem


    How do you determine if an internal modem is a software modem?


    A: First see if the name, description or even the name of the MS Windows indicates
    it''s a software modem: `HSP` (Host Signal Processor), `HCF` (Host Controlled
    Family), `HSF` (Host Signal Family), controller less, host-controlled, host-based.
    If it''s one of these modems, it will only work for the cases where a Linux driver
    is available. Since software modems cost less, a low price is a clue that it''s
    a software modem.


    If you don''t know the model of the modem and you also have Windows on your Linux,
    click on the "Modem" icon in the "Control Panel". Then see the modem list. If
    the above doesn''t work, you can look at the package the modem came in. Read the
    section on the package that says something like "Minimum System Requirements"
    or just "System Requirements".


    A hardware modem will work fine on old CPUs (such as the `386` or better). So
    if it requires a modern CPU (such as a `Pentium` or other "high speed" CPU of
    say over `150 MHz`) this is a clue that it''s an all-software modem. If it requires
    a `486` CPU (or better) then it''s likely a host-controlled software modem.


    You may have a hardware modem if it fails to state explicitly that you must have
    Windows. By saying its "designed for Windows" it may only mean that it fully supports
    Microsoft''s plug-and-play which is okay since Linux uses the same plug-and-play
    specs. Being "designed for Windows" thus gives no clue as to whether or not it
    will work under Linux. You might check the Website of the manufacturer or inquire
    via email. Some manufacturers are specifically stating that certain models work
    under Linux. Sometimes they are `linmodems` that require you to obtain and install
    a certain `linmodem` driver.


    ### Question 45: sound application error


    The sound applications do not work properly when I run Linux then boot DOS. Why
    does this happen?


    A. That happens after a soft reboot to DOS. Sometimes the error message misleadingly
    refers to a bad `CONFIG.SYS` file. Most of the current sound cards have software
    programmable `IRQ` and `DMA` settings. If you use different settings between Linux
    and MS-DOS/Windows, this may cause problems. Some sound cards don''t accept new
    parameters without a complete reset.

