- fmt: '

    Different window managers have different features, but most window managers today
    provide a menu or menus for launching apps. Many window managers provide virtual
    desktops - multiple screens you can switch between pretty much the same way as
    you switch between windows, but instead of switching between apps only, you switch
    between whole desktops. Some window managers may also provide graphical configuration
    programs in order to make configuring them easy.


    Since there are dozens of different window managers out there, you can change
    your desktop''s look and feel completely by changing the window manager. MS Windows
    lets you have different desktop themes but in Linux, you can change everything.


    ### Desktop environments

    The window manager provides everything you need for controlling the windows on
    your desktop. However, you may want some additional features and may want the
    window manager to take care of the whole desktop, but providing these additional
    features isn''t a window manager''s problem. This is where you need a desktop
    manager or a desktop environment.


    A desktop manager takes care of your whole desktop by providing and controlling
    additional helpful features that don''t directly deal with handling the windows.
    For example, a desktop environment may provide you with a taskbar or many taskbars,
    additional menus, icons on the desktop, screen savers, and many little utility
    programs like a graphical file manager, search tool, text editor, and so on.


    The two big players in the desktop manager field are KDE (K Desktop Environment)
    and GNOME (GNU Network Object Model Environment). There are a lot of differences
    between them, but they have one thing in common: you must use a window manager
    in addition to a desktop environment. A desktop environment takes care of the
    whole desktop, but it''s still the window manager''s job to control the windows.
    One of the biggest differences between KDE and GNOME is the way they play with
    window managers. KDE has its own window manager, so if you use KDE, it''ll be
    really painful to change the window manager you use with it. However, GNOME doesn''t
    come with its own window manager, so you can freely choose what window manager
    to use with it.


    ### Question 92: Change default manager

    I have just installed a new window manager. I’m booting to command line and start
    X manually with the `startx` command.


    How can I make the new window manager as my default manager?


    A: Changing the default window manager or desktop in Linux is not that hard. You
    simply need to edit a little config file with any text editor you''re familiar
    with.


    If you use the `startx` command for starting up the X Window System, you''ll need
    to edit a file called `.xinitrc` that is located in your home directory. If the
    file already is there, just open it with your favorite text editor. If you want
    to make a backup of this file, rename it to something like `.xinitrc.backup` (or
    whatever you choose).


    If you don''t have such a file in your home directory, create a new file with
    that name. Be aware of the dot in the file name, this means that the file is a
    hidden file and doesn''t show when you do a normal directory listing.


    Now you can use your text editor for creating a new, blank `.xinitrc` file. Although
    the file may be a complicated it just contains a single line with the name of
    your new window manager. So, add a line like this to your file:


    ```

    exec windowmanager

    ```


    Where `windowmanager` is the command that starts the window manager you want to
    be your default. For example, to make Window Maker your default window manager,
    you''d have a line like this: `exec wmaker`


    The commands for starting some popular window managers and desktop environments
    are:


    - KDE = `startkde`

    - Gnome = `gnome-session`

    - Blackbox = `blackbox`

    - FVWM = `fvwm` (or, for FVWM2 it''s `fvwm2`)

    - Window Maker = `wmaker`

    - IceWM = `icewm`


    Save your changes after editing the `.xinitrc` file. The next time you do a `startx`,
    the new window manager will be your default.


    ### Question 93: Change from text login to graphical login

    I want to start the X Window System automatically when my Linux boots to have
    a graphical log-in.


    How can I do this?


    A: You can disable the X Window System from starting at boot up so you''ll have
    a text login or you can boot to X Windows so you can have a graphical login in
    Linux by simply editing the `/etc/inittab` file. This works on any Linux distro.


    You need to be root in order to edit this file. If you''re logged in as a normal
    user, get the root privileges with the `su` command: type the command and then
    the root password.


    ```

    $ su

    password:

    ```


    Now you can open the `/etc/inittab` file with your favorite text editor.


    The `/etc/inittab` file is usually commented well, so the file itself explains
    what the lines in the file mean. Look for a line like this: `id:3:initdefault:`


    The line is usually at the beginning of the `/etc/inittab` file, and the number
    doesn''t necessarily have to be `3`. The number in that line tells the default
    run level of your system. The default run level in turn specifies what processes
    are started when your Linux system boots up. You need to change the runlevel to
    specify if you want to start X.


    The runlevel that starts X isn''t always the same in all distros. So you''ll have
    to read `/etc/inittab` a bit more. If you want graphical login, you''ll choose
    something that says like `full-user with xdm` or `full-user with graphical login`.
    If you want to boot to the command line, you''ll choose a runlevel that says `full-user`
    or `full-user with text login`.


    In Red Hat, the runlevel for booting to X is 5, and for text login it''s 3 by
    default. In older SuSE''s it was 2 for text login, and 3 for graphical login.
    So, for example, if you want graphical login in a Red Hat based distro, you''ll
    change


    ```

    id:3:initdefault:

    ```


    to


    ```

    id:5:initdefault:

    ```


    Then save the changes and you’re done.


    If you''re booting to X Windows, you''ll need a display manager. It''s a graphical
    program that takes care of your login: it shows you graphical login screen, lets
    you type in your username and password and starts your window manager after you''ve
    logged in.


    In most modern Linux distros you don''t have to worry about this. Usually they
    install a display manager by default, so all you have to do is change the runlevel
    and the next time you boot your system, it starts the display manager.


    However, if something goes wrong and the X Window System doesn''t start and you
    end up with a text login, you probably don''t have a display manager installed.
    Then you''ll have to install and configure one of the display managers, like the
    KDE display manager `kdm`, Gnome display manager `gdm`, the `xdm`, etc.


    If you just disabled the graphical login, you''ll need to start X manually when
    you want the GUI. Just type the `startx` command and the X Window System starts
    up.


    If X tries to start up but throws you back to the command line, the reason probably
    is that X doesn''t know what window manager you wish to use. Or if X starts up
    just fine but you get a way different desktop than usually, you also need to tell
    X what window manager you want to use.


    ### Question 94: Running multiple X sessions

    Is it possible to run two or more sessions of the X Window System at the same
    time?

