    将此文本保存为 `linux.bat`，如果你的 Windows 根目录下已经存在 `linux.bat`，你可以将其放在其他目录中或为其重命名。在你的 `autoexec.bat`
    文件中添加以下行：`c:\linux`。如果你使用 `.bat` 文件，关键点在于告诉 `Loadlin` 在哪里寻找内核镜像文件（`vmlinuz`）。上面的
    `.bat` 文件让你拥有一个选项：通过在五秒内输入 `y`（代表 Linux）或 `n`（代表 Windows），在 Windows 加载之前进入 Linux，否则它将启动
    Windows。


    ## 问题 62：移除 Linux 并恢复 Windows 分区


    我如何使用 Lilo 或 Loadlin 移除 Linux 并将 Windows 恢复到原始状态？


    答：移除 Linux 取决于你使用的是 `Lilo` 还是 `Loadlin`。`Lilo` 用户必须先恢复原始的 MBR，可以在 Linux 中输入 `/sbin/lilo
    -u` 或者在 DOS 中输入 `fdisk /MBR`。接下来的步骤对于 `Loadlin` 和 `Lilo` 用户都是通用的。这些步骤并不是绝对必要的，但为了保险起见，请尝试执行。


    使用 Linux 安装光盘启动，并在第一个提示处输入 `Linux expert`，对后续问题回答你的任何内容，直到进入安装选择界面。在这里，选择 `Install`
    和 `With Fdisk`，并使用 `Fdisk` 删除所有 Linux 分区。将更改写入磁盘，然后通过 `Ctrl–Alt–Delete` 退出安装程序或重置系统重启。记得更改
    BIOS 设置为从硬盘启动，否则你将再次从光驱启动。


    再次重启，这次使用带有你的分区表和引导扇区备份的 `fips` 磁盘，并在提示处输入 `restorrb`。在问题上回答 `yes`，程序将恢复你的分区表和引导扇区。现在你已经找回了丢失的分区空间。这正是为了确保将关键备份文件（`Rootboot.000`）保在至少几个不同的位置的原因。有患于未然。重启回到
    Windows 并在新扩展的 `C` 盘上运行 `scandisk`。它会报告 `fsinfo` 扇区有一个错误，这只是一个使用空间和可用空间的统计错误。你的
    Linux 数据现在自然已经永久丢失了。希望除非你正在增加分配给 Linux 的空间或准备放弃 Windows，否则不需要这个步骤。


    ## 问题 63：选择软件包


    我应该安装哪个软件包？


    答：Linux 软件是以“软件包”形式提供的。例如，Linux Mandrake 7.0 安装光盘包含了 1002 个软件包。Mandrake 7.2 封装了
    2 张软件 `CDs`，会在硬盘上放置 1123 个软件包。`Mandrake` 倾向于比 `RedHat` 封装更多的软件。


    无论什么种发行版或版本，光盘包含的软件包可以让基础操作系统（`kernel`、`libraries`、一组命令行配置和维护工具等）成为丰富的网络“客户端”和服务器选择，并带有适当的配置和监控工具、一些用户端文本模式应用程序、基础
    X 窗口系统以及至少一个 GUI 桌面及其应用程序。


    安装程序（无论是 `RedHat` 还是 `Mandrake`）都会询问你想安装哪些软件包。如果你选择“workstation installation”（工作站安装），那么通常在服务器上找到的软件包将从你的安装中省略。如果你选择“server
    installation”（服务器安装），则通常不会安装用户端桌面应用程序。你也可以选择安装“everything”（所有内容），这是家庭计算机安装的一个流行选项。如果你是新手，信任发行版创建者所选择的默认值是有价值的。


    我建议你避开那个诱人的安装选项“expert install--select packages manually”（专家安装——手动选择软件包），除非你确实想安装所有内容。起初，我喜欢安全的“max
    default installation”（最大默认安装），尽管这个安装选项在你的 `CD` 上被称为其他的。


    你可以轻松安装以后可能发现需要的软件包。


    ## 问题 64：KDE 还是 GNOME


    我应该安装哪种 GUI 桌面，KDE 还是 GNOME？


    答：如果你有足够的磁盘空间，绝对两个都安装。你之后可以决定偏好 `KDE`、`GNOME` 还是其他桌面，但无论你的选择是什么，你都绝对希望安装好 `KDE`
    和 `GNOME` 库。一旦安装了这些库，`KDE` 程序可以在 `GNOME` 下运行，反之亦然，这非常棒，因为有很多使用任一库编写的优良应用程序。至于磁盘空间，“桌面”只是
    `KDE` 和 `GNOME` 系统的一小部分，所以你通过省略桌面并尝试只安装“库”并不会多少空间。`GNOME` 和 `KDE` 都带有一组很好的程序和工具，因此完整安装两个桌面绝对值得。我从未听说过两者会互相产生负面干扰。对于日常工作，使用
    `KDE` 桌面，因为它感觉比 `GNOME` 更稳固。


    你也可以安装其他的“替代窗口管理器”。它们几乎不占空间，在某些情况下可能很有用。只要安装了 `KDE` 和 `GNOME` 库，`KDE` 更消耗资源。在旧硬件上（例如
    133 MHz），`GNOME` 优于 `KDE`。因此在非常有限的硬件上，请选择一个。


    ## 问题 65：以 root 登录


    我完成了安装。第一次如何登录？


    答：以 `root` 登录。“root”是初始安装后唯一账户（较新的安装程序会提示你创建一个普通用户账户）。文本模式示例：


    ```

    my_machine_name login: root

    Password: my_password

    ```


    在上面的示例中，我在提示处输入了单词 `root`。之后，我输入了初始安装时选择的密码。当我输入时，屏幕上没有显示密码（出于安全考虑）。登录后，我发现自己处于文本模式终端。


    如果你安装了登录界面，登录过程类似，但在 X 窗口屏幕上进行（如果你在那里遇到问题，可能要记住鼠标光标必须在对话框上方。X 登录屏幕实现了鼠标跟随焦点策略）。成功登录后，我的默认
    GUI 桌面启动。


    “root”是一个对系统拥有绝对权限的特殊账户，用于系统管理。你以后一定要再创建一个“用户”账户来进行日常工作。


    ## 第五章 设备、Linux 文件系统、文件层次标准


    ## 问题 66：根文件系统


    根文件系统的特点是什么？它是如何工作的？


    答：根文件系统通常应该很小，因为它包含了非常关键的文件，较小且不经常修改的文件损坏的概率较低。根文件系统损坏通常意味着系统除非采取特殊措施（例如从软盘），否则无法启动，因此你不想冒这个风险。


    根目录通常不包含任何文件，除非在旧系统上，系统的标准启动镜像（通常称为 `/vmlinuz`）保存在那里。（大多数发行版已将这些文件移动到 `/boot`
    目录。否则，所有文件都保存在根文件系统的子目录下：


    `/bin` - 启动期间需要且普通用户可能使用的命令（可能在启动后）。


    '
- fmt: '

    - `/sbin` - Like `/bin`, but the commands are not intended for normal users, although
    they may use them if necessary and allowed. `/sbin` is not usually in the default
    path of normal users, but will be in root''s default path.

    - `/etc` - Configuration files specific to the machine.

    - `/root` - The home directory for user root. This is usually not accessible to
    other users on the system.

    - `/lib` - Shared libraries needed by the programs on the root filesystem.

    - `/lib/modules` - Loadable kernel modules, especially those that are needed to
    boot the system when recovering from disasters (e.g., network and filesystem drivers).

    - `/dev` - Device files. These are special files that help the user interface
    with the various devices on the system.

    - `/tmp` - Temporary files. As the name suggests, programs running often store
    temporary files in here.

    - `/boot` - Files used by the bootstrap loader, e.g., LILO or GRUB. Kernel images
    are often kept here instead of in the root directory. If there are many kernel
    images, the directory can easily grow rather big, and it might be better to keep
    it in a separate filesystem. Another reason would be to make sure the kernel images
    are within the first 1024 cylinders of an IDE disk. This 1024 cylinder limit is
    no longer true in most cases. With modern BIOS and later versions of LILO (the
    Linux Loader) the 1024 cylinder limit can be passed with logical block addressing
    (LBA). See the lilo manual page for more details.

    - `/mnt` - Mount point for temporary mounts by the system administrator. Programs
    aren''t supposed to mount on `/mnt` automatically. `/mnt` might be divided into
    subdirectories (e.g., `/mnt/dosa` might be the floppy drive using an MS-DOS filesystem,
    and `/mnt/exta` might be the same with an ext2 filesystem).

    - `/proc`, `/usr`, `/var`, `/home` - Mount points for the other filesystems. Although
    `/proc` does not reside on any disk in reality it is still mentioned here.


    ## Question 67: files on Linux


    How does Linux treat file names? What are hidden files and directories?


    **A:** Always keep in mind that file names are case sensitive. This means that
    `PFile` isn''t the same thing as `pfile` or `PFILE`.


    Linux doesn''t use file name extensions like MS Windows does. You can name all
    your files the way you want because the type and purpose of the file are determined
    in different ways. Surely you can use file name extensions if it helps you determine
    faster what type your files are and it''s a good practice to use the extensions.


    There are more files on your system than you can see, these are hidden files.
    For example, change to your home directory and list the contents of it with `ls`.
    You see some files and directories there but you don''t see all of them because
    some files are hidden. The `-a` option is used when you want to display all files
    and that includes hidden ones:

    ```bash

    $ ls -a

    ```


    When a file name starts with a dot, it''s a hidden file and you don''t see it
    when you do a normal directory listing. Directories can also be hidden the same
    way; put a dot in front of the directory name and you won''t see the directory
    or its contents when you do a normal directory listing.


    Usually these hidden files are configuration files and most of them were placed
    into your home directory when your user account was created. They''re used for
    configuring different things related to your account and some apps also store
    their configuration and setting files in your home directory as hidden files or
    in hidden directories. It is an advantage to hide configuration files because
    they won’t muddle up your home directory and so you''ll find the rest of your
    files more easily.


    ## Question 68: Linux file system


    How do I move around the Linux file system?


    **A:** The files on Linux system are arranged in a hierarchal directory structure
    like in MS Windows. This means that the files are organized in a tree-like pattern
    of directories (or folders in windows). Those directories may contain files or
    other directories, which in turn may contain more files or directories and so
    on.


    On a Linux system, all the files and directories are under the very same tree
    unlike in Windows. The first directory in this system, the one where the tree
    starts from, is called the root directory. Everything, every single file and directory
    on a Linux system, is under this root directory.


    Like in a graphical file manager, you''re always working in a single directory
    when you''re at the CLI, and the directory can be anywhere in the file system
    tree. The directory contains files and a way to go to its parent directory and
    its subdirectories. The directory where you''re currently working in, is called
    the working directory. To find out where the working directory is, use the `pwd`
    command that stands for print working directory. Now type it and see where you
    are.


    ```bash

    you@puter: ~$pwd

    /home/you

    you@puter: ~$

    ```


    You will be in your home directory now. This is where you put your personal files
    and usually the working directory is set to your home directory when you log in
    to your Linux system. The home directories of users are located under `/home`
    and usually the name of your home directory is `/home/your_user`.


    Now that you know where you are, try to know what there is. For finding it out,
    type the `ls` command. You will get a list of all the files and subdirectories
    your working directory contains.


    You have a way of controlling what the `ls` command displays and how. Just like
    every Linux command, `ls` can have additional options. For example, try typing
    this:

    ```bash

    you@puter: ~$ls -l

    ```


    You will get again a list of the files in working directory but the output of
    `ls` is now different with the `-l` option. You get additional info about the
    files your directory contains. This option told `ls` to display more information
    about the files in the current directory. These additions to commands are often
    called parameters or arguments or options. So in this case, `ls` was the command
    and `-l` was the option.


    You can separate the command from its options with a space and you can also add
    more options and separate them from each other with a space as well. For example,
    the `-r` option tells `ls` to display the files in reverse order. If you want
    to display both the files in reverse order and get more info about the files,
    you could do it with:

    ```bash

    you@puter: ~$ls -l -r

    ```


    In some cases, you can use a shorter form when using multiple options. The following
    does the same thing:

    ```bash

    you@puter: ~$ls -lr

    ```


    Many commands accept a lot of arguments and some commands also accept file or
    directory names as arguments. For example, when you give the `ls` command without
    any arguments, it displays the contents of the current directory. If you want
    to display the contents of some other directory, you can give the pathname of
    the desired directory as an argument to `ls`. A pathname is the path you take
    along the directories to the destination directory. There are two kinds of pathnames;
    absolute pathnames and relative pathnames.


    An absolute pathname simply tells you what the complete path to a certain file
    or directory is. Because all the files on Linux are under the root directory,
    an absolute pathname must start from the root directory and then follow the filesystem
    tree directory by directory until you get to the desired file or directory.

    '
