- fmt: '

    # A: It’s possible. You can have multiple X sessions running on different virtual
    terminals.


    There are two ways to start the first X session: you either start the X Window
    System manually after logging in or X starts automatically when your Linux system
    boots up. If your system is configured to starts X automatically, you don’t have
    to worry about the first X session: it''s already running.


    If you don''t have a graphical login, you probably start X with the `startx` command
    after logging in: `startx`


    The first X session you start runs on screen 0. It does this by default, so when
    you start an X session, you don''t have to specifically tell it to run on screen
    0. However, you can run the second X session on screen 1, the third on screen
    2, and so on. This is how you tell X to run on screen 1: `startx -- :1`


    To run X on screen 2, you''d use the command: `startx -- :2`, and so on.


    You probably know you have several virtual terminals. On a default Linux configuration,
    you have command line sessions running on your first six virtual terminals. Your
    first X session is running on the seventh virtual terminal (screen 0). If you''re
    running only one X session, all the terminals after terminal seven are empty.


    The second X session runs in virtual terminal eight, the third session in virtual
    terminal nine, and so on. You switch between X screens the same way you switch
    between virtual terminals: Press Ctrl, Alt and the F key with the desired terminal''s
    number.


    For example, to switch from screen 0 to screen 1 (from the first X session to
    the second one), you''d press `Ctrl + Alt + F8`. To go back to the first X session,
    you use `Ctrl + Alt + F7`.


    When starting multiple X sessions with `startx`, make sure you have a file called
    `.xinitrc` in your home directory. It''s the file that controls things like what
    window manager is started.


    Because the default screen is 0, some graphical applications may get a bit confused
    when using other screens. If you type an application''s name at the command line
    of a terminal emulator, the application may run on screen 0 although you launch
    it from another screen. This isn''t a problem, though. Many applications have
    a command line option for specifying the screen it runs on. For example, to run
    Gimp on screen 2, you''d start it with:


    ```

    gimp --display :2

    ```


    This is actually an advantage. You can launch the application from any X session
    or virtual terminal you want and send it to any X screen you like.


    To have an X session with another color depth than the default one, you''d use
    the `-depth` option. For example, to run a second X session with an 8 bpp color
    depth, you''d type:


    ```bash

    startx -- :1 -depth 8

    ```


    As always, check out the manual page: `man startx` for more help and for more
    options.


    ## Question 95: Move the mouse cursor with keyboard


    Is there a way to use the keyboard for moving the mouse cursor in the X Window
    System?


    A: Yes, after running X Window System, press `Shift + NumLock` to turn the feature
    on.


    Move the mouse using the 1, 2, 3, 4, 6, 7, 8, and 9 keys in your number pad. Take
    a look at your number pad, and you''ll quite quickly figure out which key moves
    the mouse in which direction.


    Click by hitting the `5` key on your number pad. Double click by hitting it twice.


    Click and hold by hitting the `0` key. To release, hit `5`.


    By default, hitting the `5` key will do a left click. You can select what button
    to click with the `/`, `*`, and `-` keys on your number pad:


    - `/` Left click

    - `*` Middle click

    - `-` Right click


    Note that these just select the mouse button. You still need to use 5 to click
    it.


    Press `Shift + NumLock` again to turn this feature off.


    ## Question 96: Xfree86


    What is Xfree86?


    A: XFree86 is an implementation of the X Window System. It was originally written
    for Unix-like operating systems on IBM PC compatibles and is now available for
    many other operating systems and platforms. It is free and open source software
    under the XFree86 License version 1.1. It is developed by the XFree86 Project,
    Inc.; the lead developer is David Dawes.


    In February 2004, with version 4.4.0, The XFree86 Project adopted a license change
    that the Free Software Foundation considered GPL incompatible. Most Linux distributions
    found the potential GPL legal issues unacceptable and made plans to move to a
    fork from before the license change. At first there were multiple forks, but the
    X.Org fork soon took over as the dominant one. Most of the developers who were
    already annoyed at other issues in the project also moved to X.org.


    XFree86 consists of client libraries used to write X applications ("clients"),
    and an X server responsible for the display. Clients and servers communicate via
    the X protocol, which allows them.


    ## Question 97: Installing Xfree86 4.6 over an old installation


    How do I install Xfree86 4.6 over an old installation?


    A: If you have an existing installation of X, you should make a backup copy of
    it before installing the new version over the top of it.


    Before doing anything else, make sure the `extract` command is executable, and
    also link it to the name `gnu-tar` so that it can be used as a regular tar command:


    ```bash

    chmod +x extract

    rm -f gnu-tar

    ln extract gnu-tar

    ```


    The first part of the procedure is to move the old run-time config files from
    `/usr/X11R6/lib/X11` to `/etc/X11`. Create `/etc/X11` if it doesn''t already exist.
    For each of the following sub-directories (`app-defaults`, `fs`, `lbxproxy`, `proxymngr`,
    `rstart`, `twm`, `xdm`, `xinit`, `xsm`, `xserver`) that you want to move, check
    that there is a sub-directory of this name in `/usr/X11R6/lib/X11`. Create a sub-directory
    of the same name under `/etc/X11`, then copy the files over by running:


    ```bash

    ./gnu-tar -C /usr/X11R6/lib/X11/subdir -c -f - | \

    ./gnu-tar -C /etc/X11/subdir -v -x -p -U -f -

    ```


    For each subdirectory that is moved, remove the one under `/usr/X11R6/lib/X11`
    and create a symbolic link to the new location:


    ```bash

    rm -fr /usr/X11R6/lib/X11/subdir

    ln -s /etc/X11/subdir /usr/X11R6/lib/X11

    ```


    For those subdirectories that didn''t already exist under `/usr/X11R6/lib/X11`,
    create one under `/etc/X11` and create the symbolic link to it:


    ```bash

    mkdir /etc/X11/subdir

    ln -s /etc/X11/subdir /usr/X11R6/lib/X11

    ```


    Once that is done, extract the config files from the `Xetc.tgz` and `Xrc.tgz`
    tarballs into a temporary directory:


    ```bash

    mkdir tmpdir

    ./extract -C tmpdir Xetc.tgz

    ./extract -C tmpdir Xrc.tgz

    ```


    Then copy each sub-directory over to the installed location:


    ```bash

    ./gnu-tar -C tmpdir/subdir -c -f - .

    ```

