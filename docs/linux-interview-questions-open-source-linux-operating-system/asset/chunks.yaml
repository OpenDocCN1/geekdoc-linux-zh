- fmt: '

    `/usr/X11R6`: The subdirectories under `/usr/X11R6` may contain some X binaries
    themselves as well as documentation, header files, config files, icons, sounds
    and things related to the graphical programs.


    ` /usr/local`: This is where you install apps and other files for use on the local
    machine. If you find interesting apps that aren''t officially a part of your distro,
    you should install them in `/usr/local`. For example, if the app would normally
    go to `/usr/bin` but it isn''t a part of your distro, you should install it in
    `/usr/local/bin` instead. Keep your own programs away from the programs that are
    included in your distro, to confusion and keep things in order.


    `/lib`: The shared libraries for programs that are dynamically linked.


    `/home`: This is where users keep their personal files. Every user has their own
    directory under `/home`, and usually it''s the only place where normal users are
    allowed to write files. You can configure a Linux system so that normal users
    can''t even list the contents of other users'' home directories.


    `/root`: The superuser''s (root''s) home directory. You should not confuse this
    with the root directory (`/`) of a Linux system.


    `/var`: This directory contains variable data that changes constantly when the
    system is running. Some interesting subdirectories:


    `/var/log`: A directory that contains system log files. These are updated when
    the system runs and if something in your system suddenly goes wrong, the log files
    may contain some info about the situation.


    `/var/mail`: Incoming and outgoing mail is stored in this directory.


    `/var/spool`: This directory holds files that are queued for some process like
    printing.


    `/tmp`: Programs can write their temporary files here.


    `/dev`: The devices that are available to a Linux system. In Linux, devices are
    treated like files and you can read and write devices like they were files.


    `/mnt`: This directory is used for mount points. The different physical storage
    devices must be attached to some directory in the file system tree before they
    can be accessed. This attaching is called mounting and the directory where the
    device is attached is called the mount point. The `/mnt` directory contains mount
    points for different devices, like `/mnt/floppy` for the floppy drive, `/mnt/cdrom`
    for the CD-ROM and so on. However, you''re not forced to use the `/mnt` directory
    for this purpose, you can use whatever directory you wish. Actually in some distros,
    like Debian and SUSE, the default is to use `/floppy` and `/cdrom` as mount points
    instead of directories under `/mnt`.


    `/proc`: This is a special directory. Actually `/proc` is just a virtual directory
    because it doesn''t exist at all. It contains some info about the kernel itself.
    There''s a bunch of numbered entries that correspond to all processes running
    on the system and there are also named entries that permit access to the current
    configuration of the system. Many of these entries can be viewed.


    `/lost+found`: This is where Linux keeps the files that it restores after a system
    crash or when a partition hasn''t been uncounted before a system shutdown. This
    way you can recover files that would otherwise have been lost.


    ### Question 04: Command-line history


    What are functions of the `history` command?


    A: The `history` command can be used to list Bash''s logs of the commands you
    have typed. This log is called the "history". To access it type:


    The `history n` will only list the last `n` commands. You can type `history` (without
    options) to see the entire history list.


    You can also type `!n` to execute command number `n`. Use `!!` to execute the
    last command you typed.


    The `!-n` will execute the command `n` times before (ie. `!-1` is equivalent to
    `!!`).


    The `!string` will execute the last command starting with that string and `!?string?`
    will execute the last command containing the word "string".


    For example:


    `!cd` will re-run the command that you last typed starting with "cd".


    `commandName !*` will execute the `commandName` with any arguments you used on
    your last command. This maybe useful useful if you make a spelling mistake, for
    example. If you typed: `emasc /home/fred/mywork.java /tmp/testme.java`


    In an attempt to execute `emacs` on the above two files this will obviously fail.
    So what you can do is type:


    `emacs !*` will execute `emacs` with the arguments that you last typed on the
    command line. In other words this is equivalent to typing: `emacs /home/fred/mywork.java
    /tmp/testme.java`


    To search through the Command History ( CTRL-R ) : sse the `CTRL-R` key to perform
    a "reverse-i-search". For example, if you wanted to use the command you used the
    last time you used `snort`, you would type: `CTRL-R` then type "snort".


    What you will see in the console window is: (reverse-i-search)`'':


    After you have typed what you are looking for, use the `CTRL-R` key combination
    to scroll backward through the history.


    Use `CTRL-R` repeatedly to find every reference to the string you have entered.
    Once you''ve found the command you''re looking for, use `[Enter]` to execute it.


    Alternatively, using the right or left arrow keys will place the command on the.


    ### Question 05: Linux keyboard shortcuts


    In MS Windows, there are a lot of keyboard shortcuts that is used to make life
    easier. Does Linux have this also?


    A: There are several keyboard shortcuts in Linux and here are some of them:


    #### VIRTUAL TERMINALS


    - `Ctrl + Alt + F1`: Switch to the first virtual terminal. In Linux, you can have
    several virtual terminals at the same. The default is 6.

    - `Ctrl + Alt + Fn`: Switch to the `n`th virtual terminal. Because the number
    of virtual terminals is 6, `n=1...6`.

    - `tty`: Typing the `tty` command tells you what virtual terminal you''re currently
    working in.

    - `Ctrl + Alt + F7`: Switch to the GUI. If you have X Window System running, it
    runs in the seventh terminal by default. If X isn''t running this terminal is
    empty.


    #### X WINDOW SYSTEM


    - `Ctrl + Alt + +`: Switch to the next resolution in the X Window System. This
    works if you''ve configured more than one resolution for your X server. You must
    use the `+` in your numpad.

    - `Ctrl + Alt + -`: Switch to the previous X resolution. Use the `-` in your numpad.

    - `MiddleMouseButton`: Paste the highlighted text. You can highlight the text
    with your left mouse button (or with some other highlighting method, depending
    on the application you''re using) and then press the middle mouse button to paste.
    This is the traditional way of copying and pasting in the X Window System, but
    may not work in some X applications.

    If you have a two-button mouse, pressing both of the buttons at the same time
    has the same effect as pressing the middle one. If it doesn''t, you must enable
    3-mouse-button emulation. This works also in text terminals if you enable the
    `gpm` service.

    - `Ctrl + Alt + Backspace`: Kill the X server. Use this if X crashes and you can''t
    exit it normally. If you''ve configured your X Window System to start automatically
    at boot up, this restarts the server and throws you back to the graphical login
    screen.


    #### COMMAND LINE INPUT


    - `Home` or `Ctrl + a`: Moves the cursor to the beginning of the current line.

    - `End` or `Ctrl + e`: Moves the cursor to the end of the current.

    - `Alt + b`: Moves the cursor to the beginning of the current or previous word.
    Note that while this works in virtual terminals, it may not work in all graphical
    terminal emulators because many graphical applications already use this as a menu
    shortcut by default.

    - `Alt + f`: Moves the cursor to the end of the next word. Again, like with all
    shortcuts that use Alt as the modifier, this may not work in all graphical terminal
    emulators.

