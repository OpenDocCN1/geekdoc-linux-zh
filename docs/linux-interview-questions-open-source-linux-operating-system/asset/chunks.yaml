  trans: '

    下一步是让你决定如何启动进入 Linux。默认且最常用的方法是使用 `Lilo`。它是一个简单且基础的引导加载程序，它会在（保存后）覆盖你硬硬盘的 `MBR`（主引导记录），并在系统启动时允许你在这启动
    Windows 或 Linux 之间进行选择。如果你选择 Windows，它就会启动 Windows，你将看到熟悉的 Windows 界面；如果你选择 Linux，它就会启动
    Linux，且如果你在规定时间内没有做出选择，它将启动默认操作系统（Windows 或 Linux，取决于你是如何设置的）。你可以随时恢复原始的 MBR，例如在卸载
    Linux 时，可以通过在 Linux 中输入 `/sbin/lilo -u`，或者在 DOS 中输入 `fdisk /MBR`（这将用原始的 Windows
    MBR 覆盖 MBR）。


    ### Lilo 的问题

    使用 `Lilo` 的问题在于，特别是对于那些拥有大硬盘的用户来说，你必须为 Linux 放弃很大一部分的磁盘空间。这不是一个灵活的解决方案，因为虽然你可以在
    Linux 内部访问你的 Windows 分区，但大型 MPEG 文件可以存储在 Windows 中并被两个操作系统访问。请注意，BIOS 无法访问超出这
    1024 柱道限制的数据，而 `Lilo` 依赖 BIOS 来启动操作系统。因此，如果你想使用 `Lilo` 启动 Linux，请确保 Linux 分区远低于
    1024 柱道限制。大多数现代硬盘的柱道超过 1024，使用 `Lilo` 意味着将 Linux 分区设置在大约 1000 或 1010 柱道处，这相当于给
    Linux 分配了 12.9Gb 中的巨大 5.2Gb。


    ### Loadlin 作为替代方案

    `Lilo` 一个被低估的替代方案是使用 `Loadlin`，特别是对于大硬盘用户。这是一个极佳的替代方案，因为你不需要担心 1024 柱道限制。更好的是你可以从
    Windows 桌面启动 Linux，并修改你的 `autoexec.bat` 文件，让你在启动时获得进入任一系统的选项，这与 `Lilo` 类似。你就可以随心所欲地调整分区大小。例如，带有
    3 个逻辑分区的 2.2Gb 扩展分区。创建三个分区是正常的：一个用于内核引导文件，一个用于根分区，一个用于交换分区。


    ### 准备硬盘

    现在我们准备好实际对硬盘进行分区了。首先制作一个 DOS 启动盘（在 DOS 提示符下或 DOS 中输入 `format a: /s`）。将以下三个文件放入磁盘：`fips.exe`、`restorrb.exe`
    和 `errors.txt`。对你的硬盘进行碎片整理；这将所有数据放在开头，为 `Fips` 创建新分区留出足够的空间。如果你使用 `Norton Speed
    Disk`，选择未碎片的空空间选项。Norton 通常将数据放在磁盘末尾，这将防止 `Fips` 创建新分区。运行 `Scandisk` 并使用你刚刚创建的启动盘重启。


    ### 使用 Fips 进行分区

    在提示符处输入 `fips`，`Fips` 将向你显示分区表，并附带一个关于分区表不一致的警告。如果你的硬盘超过了 1024 柱道，通常可以忽略此警告。接下来
    `Fips` 将询问你是否继续，该程序非常详尽；回答 yes，并在提示保存分区表和引导扇区的备份时回答 yes。这一步至关重要，因为它允许在发生任何故障时将你的硬盘恢复到未分区的单分区状态。如果你想卸载
    Linux 或调整 Linux 分区大小，它也十分有用。在此期间新分区发生了什么都没关系，只要你有备份，就可以将硬盘恢复到原始的未分区状态。这种可逆的操作在所有情况下都有效，除非你格式化了为了给
    Linux 腾空间而分割的原始（Windows）分区，原始 FAT 会被新的较 FAT 覆盖，恢复操作将无法进行。


    ### 调整分区大小

    制作备份后，你将看到一个显示三个数字的屏幕，第一个代表你的原始分区（尺寸最小），`Fips` 将硬盘中的所有空闲空间分配给了新分区，因为这是默认行为。第二列显示柱道信息，这将为计划使用
    `Lilo` 的用户提供指南。第三列显示你将创建的新分区的大小。使用方向键来调整分区大小；你只需要将处于最大值的的新分区尺寸减小到你想要的大小即可。对于 `Lilo`
    用户，新分区必须在 1024 柱道标记以下，1000 是新分区的合理起始点。在你对新分区的大小满意后按回车键，`Fips` 将要求你确认并写入新的分区表。


    ### 最后步骤

    重启你的系统。记得更改 BIOS 设置为从硬盘启动，否则你最终将用软盘重启。双击“我的电脑”，你将看到所有努力的结果，在原始 C 盘旁边会有一个标记为 D
    的新驱动器。不要碰 D，在你的原始分区（C）上运行 `scandisk`。如果没有错误，你就可以准备安装 Linux 了。


    某些 Linux 文档错误地要求你使用 Windows `Fdisk` 删除新创建的分区。不要犯这个错误，因为如果你这样做，在安装 Linux 后重启时，Linux
    分区将出现在“我的电脑”中，由于 Windows 显然无法读取这些驱动器的 ext2 文件系统，在 Windows 中访问它们将变成一项耗时且费力的工作。


    ### Linux 安装

    使用你的 Linux 安装光盘重启（我们专注于我觉得相当 Redhat 6.2）。大多数 Linux 发行版都对安装程序做了很好的改进，你不遇到问题。只需准备好有关硬件的细节：显示器的水平和垂直刷新率（以防安装程序自动检测）、显卡、其内存类型（SDRAM
    或 SGRAM）以及大小，以及你的鼠标类型——PS2 或串口。如之前提到的，你必须为 Linux 创建大约 3 个分区（3 是推荐数量）。有三种主要的安装类型：工作站（Workstation）、服务器（Server）和自定义（Custom）。服务器类安装会擦除硬盘上的所有内容，所以要小心。工作站和自定义安装有子类，但那是供你探索的。


    `Loadlin` 用户必须自定义安装并在有机会时放弃 `Lilo`，因为其他类型的安装默认安装 `Lilo` 而不询问。`Lilo` 用户没有限制；你可以选择任何喜欢的安装类型。

    '
- fmt: '

    Those who intend to use `Loadlin` however cannot use `Disk Druid`, they will have
    to use `Linux Fdisk` which may have an intimidating reputation but is actually
    pretty simple. When presented with the installation type screen, select `custom`
    and with `fdisk` (you will find a small button with `fdisk` on it at the top of
    the screen). For some reason `Disk Druid` doesn''t let you proceed with the installation
    if your `/boot` partition is above the `1024` cylinder limit, so if you try to
    use it to create the partitions, the install program will refuse to proceed.


    `Fdisk` is a pretty straight forward program and easy to use too. First you have
    to delete the partition you just created using `Fips`. Many people don''t understand
    why they have to delete the partition they just created at considerable risk.
    This new partition is actually a `FAT32` partition which Linux cannot use and
    when you delete it it doesn''t revert to being a part of `C` but is actually `UNPARTITIONED
    FREE SPACE` which you can use to create new partitions.


    ### Fdisk Operations

    You have to understand a few `Fdisk` operations:

    - typing `m` lists all the options;

    - typing `p` at the prompt shows you the current partition table;

    - `d` deletes a partition;

    - `n` creates a partition;

    - `q` quits without saving changes (so if you make any mistakes there is nothing
    to worry about, just type `q` and start all over again);

    - `w` writes changes to the partition table (use only after you are sure);

    - `L` shows you the hex numbers for different partition types (you only need to
    know two: `Linux native` is hex number `83` and `Linux swap` is hex number `82`).


    While `Disk Druid` allows you to mount a swap partition without going into the
    hex numbers, in `Fdisk` the only way to make a swap partition is to give it its
    correct hex number which is `82`.


    ### Partitioning Process

    Let''s start, in `Fdisk` type `p` at the prompt and you will see the current partition
    table. Type `d` and select the partition you want to delete which in this case
    would be `/dev/hda2` (just type `2`), type `p` again and you will see the change
    reflected in the partition table.


    There will now be a single `FAT32` partition `/dev/hda1` (which is actually `C`).
    Type `n` to create a new partition and for type of partition the choices being
    `primary` or `extended` select `e`. There is no hard and fast rule about this.
    For instance, you could have a primary partition for `/boot` and an extended partition
    holding two logical partitions `/` and `swap`. I recommend an extended partition
    that holds three logical partitions.


    Now you have to size your extended partition properly since it''s a container
    for the three logical partitions. From now on you just have to respond to `Fdisk`.
    It will ask you to set the size of the extended partition that you want to create.
    This partition will start where your Windows partition ends and ends at the end
    of the disk. You can either give the size in `M` (megabytes) in cylinder numbers
    or in `K` (kilobytes). Just accept the default for the start of the partition
    and select the end cylinder number for the end – `Fdisk` will give you the end
    cylinder number.


    Repeat the operation for the three logical partitions, only this time you would
    have to select `logical` instead of `extended` and the appropriate sizes:

    - `16Mb` for the boot partition;

    - `127Mb` for the swap partition (the size of the swap partition is variable depending
    on installed RAM, double your RAM is recommended);

    - the rest of the free space for the root (`/`) partition.


    After creating the three partitions, type `p` and you will see the partitions
    you just created. There will be `/dev/hda2` (extended), `/dev/hda5` (logical),
    `/dev/hda6` (logical) and `/dev/hda7` (logical). There is just one thing left
    to do, set the hex number for the swap partition. Type `t` and select the `127Mb`
    partition you created which would be `/dev/hda6`, enter `6` for the partition
    number and `82` for the hex number (you will be prompted) and you have just finished
    with partitioning. Type `w` after making sure and `Fdisk` will write the new partition
    table and exit.


    ### Finalizing Installation

    The next screen will be the `Disk Druid` screen our `Lilo` friends have already
    seen and you just have to mount the partitions with `Disk Druid`. Select `/dev/hda5`
    (the `16Mb` partition) and mount it as `/boot`. Select `/dev/hda7` and mount it
    as `/` (the root partition).


    The rest of the installation is straight forward. Select the packages you want,
    the boot disk when given the opportunity to (absolutely essential especially for
    `Loadlin` users) and reboot the system. `Lilo` users should press `dos` at the
    `Lilo` prompt to boot into Windows. `Lilo` users should reboot the system and
    boot into Linux this time by typing `linux` at the `Lilo` prompt and depending
    on the choices you made you will either be at the console or the `gnome` or `kde`
    desktop. It''s always a good idea to log into the console first and not graphically
    and then starting `X` because if `X` crashes, you can still have access to the
    system to make up for.


    `Lilo` is set to boot into Linux by default after a gap of 5 seconds, you can
    change the default to Windows by editing the `lilo` file in `/etc`. Look for the
    line that says `default=linux` and change it to `dos`. Alternative launch `lilo`
    from an `xterm` and change the asterisk from `linux` to `dos` (use the arrow buttons,
    dummy). That''s set now for `Lilo` users.


    ### Loadlin Configuration

    `Loadlin` users still have a little work to do. First boot into Linux with the
    floppy. If you logged in graphically start a terminal emulator like `xterm`. There
    are always a couple of these under the utilities menu.


    ```bash

    mkdir /mnt/dosc

    ```


    This is the first step to make your Windows partition accessible to Linux and
    this is particularly important for `Loadlin` users as it is the easiest way to
    transfer the Linux kernel to your Windows partition.


    Alternatively you can edit the `fstab` file in `/etc` in a text editor (`gedit`
    is a good choice) and add the following line:


    ```

    /dev/hda1 /mnt/dosc vfat defaults 0 0

    ```


    Copy the kernel to your Windows partition and rename it to `vmlinuz`. You will
    find it in `/boot` and probably called `vmlinuz` followed by your version number.
    Do not copy `vmlinuz` with an arrow in it, it’s a symbolic link. Reboot into windows,
    get the `loadlin` package from the Linux `cd`, it will be in the `/dostools/utils`
    subdirectory. Unzip it and place `Loadlin.exe` in the `C` directory. `Loadlin`
    and the kernel can be anywhere on your windows partition but for the time being
    we will leave it in root directory of Windows. Now it’s up to you how you want
    to boot into Linux. Read the `loadlin` documentation for the details. The roundabout
    way is to restart the system in DOS mode and type:


    ```bash

    C:> loadlin vmlinuz root=/dev/hda7 ro

    ```


    The easier way is to make a `.bat` file with the same information and placing
    it on your desktop. Open `notepad` type `c:\loadlin c:\vmlinuz root=/dev/hda7
    ro` and save the file as `linux.bat`, right click the file, select advanced, and
    check the `MS-DOS mode` and `warn` settings. Make a shortcut to this file and
    put it on your desktop. The next time you want to boot into Linux just double
    click this file.


    If you want to be prompted to boot into linux before Windows boots like the `Lilo`
    guys, you have to make another `.bat` file and call it from your `autoexec.bat`
    file. It''s very simple and the details are available in the `Loadlin` documentation.
    The file looks a bit like this:


    ```batch

    @echo off

    cls

    echo.

    echo.

    echo.

    echo.

    choice /t:n,5 "Do you wish to boot Linux?"

    if errorlevel 2 goto End

    c:\loadlin c:\vmlinuz root=/dev/hda6 ro

    End

    ```

