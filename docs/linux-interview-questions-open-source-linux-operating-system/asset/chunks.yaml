    How can I copy files?


    A: You can use the cp command to copy files. The following will copy file to file2\.
    Note that if file2 doesn''t exist, it''ll be created but if it exists, it''ll
    be overwritten:


    $ cp file file2


    There is no undo command in the Linux CLI, so be very carefull to as you might
    accidentally overwrite an important file. The risk of doing so is smaller if you
    use the -i option ("interactive") with cp. The following does the same as the
    above, but if file2 exists, you''ll be prompted before overwriting:


    $ cp -i file file2


    cp: overwrite `file2''? n


    $


    It’s a best use the -i option whenever you''re dealing with important files.


    If you want to copy file into directory dir1:


    $ cp file dir1


