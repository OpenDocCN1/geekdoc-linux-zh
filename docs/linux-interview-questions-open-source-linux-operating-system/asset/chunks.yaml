    [Introduction](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    Linux is a form of the UNIX operating system. Though originally UNIX was used
    mainly by engineers and scientists and thus was not well known to the general
    public. A lot of what you take for granted on computer systems today began in
    UNIX. A notable example is the Internet, the first major operating system to implement
    the TCP/IP protocol at the heart of the Internet was UNIX and that led to the
    general acceptance of the protocol.


    In the early 1990s, computer science student Linus Torvalds decided to write his
    own version of UNIX, which he called Linux. Other “homegrown” versions of UNIX
    had been written, such as MINIX, but what distinguished Linux was the scale of
    worldwide participation involved. Torvalds innocently put a message on the Internet
    asking if anyone wanted to help and he got an avalanche of responses. There are
    a several reasons why Linux is the mainstream today. First, it became known as
    a very reliable, stable operating system, with one result being that Linux has
    become a major platform for large corporate Web servers. Another reason is that
    it, and the software associated with it developed elsewhere, is free. Many companies
    have found that it is cheaper to run Linux on their PCs, both for this reason
    and because of reduced maintenance costs.


    Linux has historically been used mainly as a server operating system, but its
    low cost, flexibility, and UNIX background make it suitable for a wide range of
    applications. Linux is the cornerstone of the "LAMP" server-software combination
    (Linux, Apache, MySQL, Perl/PHP/Python) which has achieved popularity among developers,
    and which is one of the more common platforms for website hosting.


    Due to its low cost and its high configurability, Linux is often used in embedded
    systems such as television set-top boxes, mobile phones, and handheld devices.
    Linux has become a major competitor to the proprietary Symbian OS found in many
    mobile phones, and it is an alternative to the dominant Windows CE and Palm OS
    operating systems on handheld devices. The popular TiVo digital video recorder
    uses a customized version of Linux. Several network firewall and router standalone
    products, including several from Linksys, use Linux internally, using its advanced
    firewalling and routing capabilities. Linux is increasingly common as an operating
    system for supercomputers. In the November 2005 TOP500 list of supercomputers,
    the two fastest supercomputers in the world ran Linux. Of the 500 systems, 371
    (74.2%) ran some version of Linux, including seven of the top ten.


    Clusters of Linux machines are used in the creation of movies such as "Titanic",
    "Shrek" and others. In post offices, they are the nerve centers that route mail
    and in large search engine, clusters are used to perform internet searches. These
    are only a few of the thousands of heavy-duty jobs that Linux is performing day-to-day
    across the world.


    The Sony PlayStation 3 video game console, scheduled to be released in November
    2006, will run Linux by default. Sony has previously released a PS2 Linux do-it-yourself
    kit for their PlayStation 2 video game console. Game developers like Atari and
    id Software have released titles to the Linux desktop. Linux Game Publishing also
    produces games for Linux, licensing and porting them from their Windows source
    code. The One Laptop per Child project, which aims to provide computing devices
    to all children in developing nations, uses Linux as the devices'' operating system.


    It is also worth to note that modern Linux not only runs on workstations, mid-
    and high-end servers, but also on "gadgets" like PDA''s, mobiles, a shipload of
    embedded applications and even on experimental wristwatches. This makes Linux
    the only operating system in the world covering such a wide range of hardware.


    Linux is an open source operating system which is free as in freedom, so that
    the source code is available for anybody to view, distribute, use, and edit. Everybody
    is allowed to edit the program to suit his or her own needs, or give it away.
    This is in contrast to Windows, where the source code can be edited and reviewed
    only by Microsoft employees and people who agree to sign a non-disclosure agreement.
    Linux advocates claim that their openness means that code can be reviewed by many
    people, who can submit bug fixes or new features.


    At first a computer running Minix was necessary in order to configure and install
    Linux. Initial versions of Linux also required another operating system to be
    present in order to boot from a hard disk, but soon there were independent boot
    loaders such as LILO. The Linux system quickly surpassed Minix in functionality;
    Torvalds and other early Linux kernel developers adapted their work for the GNU
    components and user-space programs to create a complete, fully functional, and
    free operating system.


    Today, Torvalds continues to direct the development of the kernel, while other
    subsystems such as the GNU components continue to be developed separately (Linux
    kernel development is not part of the GNU Project). Other groups and companies
    combine and distribute these components with additional application software in
    the form of Linux distributions.


    Linux is predominantly used as part of a Linux distribution (commonly called a
    "distro"). These are compiled by individuals, loose-knit teams, and commercial
    and volunteer organizations. They commonly include additional system and application
    software, an installer system to ease initial system setup, and integrated management
    of software installation and upgrading. Distributions are created for many different
    purposes, including computer architecture support, localization to a specific
    region or language, real-time applications, and embedded systems, and many deliberately
    include only free software. Currently, over three hundred distributions are actively
    developed, with about a dozen distributions being most popular for general-purpose
    use.


    A typical general-purpose distribution includes the Linux kernel, some GNU libraries
    and tools, command-line shells, the graphical X Window System and an accompanying
    desktop environment such as KDE or GNOME, together with thousands of application
    software packages, from office suites to compilers, text editors, and scientific
    tools


    Linux is a combination of several different technologies. The Linux Kernel was
    started in 1991 (based on earlier kernels), while the X Window System, which provides
    graphics in Linux, and the GNU project, which is a set of command-line based tools
    similar to MS-DOS, were both started in 1984.


    There are several good reasons for you to use Linux:'
