    [Question 70: Permissions and ownership](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    I’m the only user in my Linux and I cannot access some of my files.


    Have I misconfigured file access permissions?


    A: Linux is designed to be a multi-user environment. It is necessary to have a
    secure system for deciding which files are yours and who can fiddle with them.
    Even if you''re the only user on an ordinary desktop system, file permissions
    helps you keep your important files safe from outsiders.


    Every file on your Linux system, including directories, is owned by a specific
    user and group. Therefore, file permissions are defined separately for users,
    groups, and others.


    User: The username of the person who owns the file. By default, the user who creates
    the file will become its owner.


    Group: The usergroup that owns the file. All users who belong into the group that
    owns the file will have the same access permissions to the file. This is useful
    if, for example, you have a project that requires a bunch of different users to
    be able to access certain files, while others can''t. In that case, you''ll add
    all the users into the same group, make sure the required files are owned by that
    group and set the file''s group permissions accordingly.


    Other: A user who isn''t the owner of the file and doesn''t belong in the same
    group the file does. Hence, if you set permission for the "other" category, it
    will affect everyone else by default. For this reason, people often talk about
    setting the "world" permission bit when they mean setting the permissions for
    "other."


    There are three types of access permissions on Linux: read, write, and execute.
    These permissions are defined separately for the file''s owner, group and all
    other users.


    Read permission: On a regular file, the read permission bit means the file can
    be opened and read. On a directory, the read permission means you can list the
    contents of the directory.


    Write permission: On a regular file, this means you can modify the file or write
    new data to the file. In the case of a directory, the write permission means you
    can add, remove, and rename files in the directory. This means that if a file
    has the write permission bit, you are allowed to modify the file''s contents,
    but you''re allowed to rename or delete the file only if the permissions of the
    file''s directory allow you to do so.


    Execute permission: In the case of a regular file, this means you can execute
    the file as a program or a shell script. On a directory, the execute permission
    allows you to access files in the directory. Although the execute bit lets you
    enter the directory, you''re not allowed to list its contents unless you also
    have the read permissions to that directory.


    [Question 71: View file permissions](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    How can I view file permissions?


    A: You can view the access permissions of a file by doing the long directory listing
    with the ls -l command. For example, it may look like this:


    you@puter: /home/writers$ ls -l


    total 10


    drwxr-xr-x 3 dan writers 180 2005-10-05 21:37 dir


    -rw-r----- 2 dan writers 818 2005-09-04 13:35 file


