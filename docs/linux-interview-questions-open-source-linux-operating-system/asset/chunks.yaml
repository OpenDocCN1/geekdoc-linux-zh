    ### 3. Free Block count salvage

    During `fsck` the number of free blocks listed in a super block and actual unallocated
    free blocks count does not match. `fsck` inform this mismatch and asks to salvage
    free block count to synchronize the superblock count. This error can be corrected
    without any potential problem to the file system or files.


    ### 4. Unreferenced file reconnection

    While checking connectivity `fsck` finds some inodes which are allocated but not
    referenced -not attached to any directory. Answering `y` to reconnect message
    by `fsck` links these files to the `lost+found` directory with their inode number
    as their name.


    To get more info about the files in `lost+found` the `file` command can be used
    to see the type of files and subsequently they can be opened in their applications
    or text editors to find out about their contents. If the file is found to be correct
    it can be used after copying to some other directory and renaming it.


