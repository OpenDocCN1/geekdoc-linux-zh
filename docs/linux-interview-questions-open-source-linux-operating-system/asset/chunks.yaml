    [Question 96: Xfree86](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    What is Xfree86?


    A: XFree86 is an implementation of the X Window System. It was originally written
    for Unix-like operating systems on IBM PC compatibles and is now available for
    many other operating systems and platforms. It is free and open source software
    under the XFree86 License version 1.1\. It is developed by the XFree86 Project,
    Inc.; the lead developer is David Dawes.


    In February 2004, with version 4.4.0, The XFree86 Project adopted a license change
    that the Free Software Foundation considered GPL incompatible. Most Linux distributions
    found the potential GPL legal issues unacceptable and made plans to move to a
    fork from before the license change. At first there were multiple forks, but the
    X.Org fork soon took over as the dominant one. Most of the developers who were
    already annoyed at other issues in the project also moved to X.org.


    XFree86 consists of client libraries used to write X applications ("clients"),
    and an X server responsible for the display. Clients and servers communicate via
    the X protocol, which allows them to run on different computers.


    The XFree86 server communicates with the host operating system''s kernel to drive
    input and output devices, with the exception of graphics cards. These are generally
    managed directly by XFree86, so it includes its own drivers for all graphic cards
    a user might have. Some cards are supported by vendors themselves via binary-only
    drivers.


    Since version 4.0, XFree86 has supported (some) accelerated 3D graphics cards
    via the GLX and DRI extensions. Because the server usually needs low level access
    to graphics hardware, on many configurations it needs to run as the superuser,
    or a user with UID 0. However, on some systems and configurations it is possible
    to run the server as a normal user.


    It is also possible to use XFree86 in a framebuffer device, which in turn uses
    a kernel graphics card driver.


    As Linux grew in popularity, XFree86 rose with it, as the main X project with
    drivers for PC video cards. By the late 1990s, official X development past its
    best. Most technical advancement was happening in the XFree86 project. In 1999,
    XFree86 was sponsored onto X.Org (the official industry consortium) by various
    hardware companies interested in its use with Linux and its status as the most
    popular version of X.


    [Question 97: Installing over an old installation](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    How do I install Xfree86 4.6.0 over an old installation?


    A: If you have an existing installation of X, you should make a backup copy of
    it before installing the new version over the top of it.


    Before doing anything else, make sure the extract command is executable, and also
    link it to the name "gnu-tar" so that it can be used as a regular tar command:


    chmod +x extract


    rm -f gnu-tar


    ln extract gnu-tar


    The first part of the procedure is to move the old run-time config files from
    /usr/X11R6/lib/X11 to /etc/X11\. Create /etc/X11 if it doesn''t already exist.
    For each of the following sub-directories (app-defaults, fs, lbxproxy, proxymngr,
    rstart, twm, xdm, xinit, xsm, xserver) that you want to move, check that there
    is a sub-directory of this name in /usr/X11R6/lib/X11\. Create a sub-directory
    of the same name under /etc/X11, then copy the files over by running:


    ./gnu-tar -C /usr/X11R6/lib/X11/subdir -c -f - . | \


    ./gnu-tar -C /etc/X11/subdir -v -x -p -U -f -


    For each subdirectory that is moved, remove the one under /usr/X11R6/lib/X11 and
    create a symbolic link to the new location:


    rm -fr /usr/X11R6/lib/X11/subdir


    ln -s /etc/X11/subdir /usr/X11R6/lib/X11


    For those subdirectories that didn''t already exist under /usr/X11R6/lib/X11,
    create one under /etc/X11 and create the symbolic link to it:


    mkdir /etc/X11/subdir


    ln -s /etc/X11/subdir /usr/X11R6/lib/X11


    Once that is done, extract the config files from the Xetc.tgz and Xrc.tgz tarballs
    into a temporary directory:


    mkdir tmpdir


    ./extract -C tmpdir Xetc.tgz


    ./extract -C tmpdir Xrc.tgz


    Then copy each sub-directory over to the installed location:


    ./gnu-tar -C tmpdir/subdir -c -f - . | \'
