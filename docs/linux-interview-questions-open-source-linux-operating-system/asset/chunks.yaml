    ### Question 35: Dual booting


    I recently installed Fedora Core - dual booting with Windows 2000. I plan to buy
    a new hard drive and install Fedora on it and then just connect the cables to
    boot into Linux every time I need to use it.


    Is this feasible?


    **A:** You can easily achieve dual booting by setting your current drive to master
    and the new one to slave. To be safe, disconnect the power from the master. Install
    Linux to the slave drive. Once you''re done installing, reboot, test, then re-connect
    the power to the master drive. Change the setting in the BIOS of your computer
    rather than switching cables every time you want to change to Linux.


    Change the initial boot drive from `HDD0` to `HDD1` (look at how your BIOS lists
    them). Windows has to be the first hard drive but Linux will know that it is not
    "hda"; it will be "hdb" in the case. Also by using this method, you can mount
    the windows drive into the running Linux install and share files.


    Also by using this method, you can mount the windows drive into the running Linux
    install and share files.


    ### Question 36: An there is an easy way to boot


    **A:** You can easily achieve dual booting by setting your current drive to master
    and the new one to slave. To be safe, disconnect the power from the master. Install
    Linux to the slave drive. Once you''re done installing, reboot, test, then re-connect
    the power to the master drive. Change the setting in the BIOS of your computer
    rather than switching cables every time you want to change to Linux.


    Change the initial boot drive from `HDD0` to `HDD1` (look at how your BIOS lists
    them). Windows has to be the first hard drive but Linux will know that it is not
    "hda"; it will be "hdb" in the case. Also by using this method, you can mount
    the windows drive into the running Linux install and share files.


    ### Step II: Partitioning


    Before you do the partitioning, I recommend you run `chkdsk` first in case you
    have bad sectors on your drive.


    Insert your boot disk and boot. Go into your BIOS and set the first boot to Floppy.
    Save changes and exit.


    Your PC should boot and eventually prompt you to make a selection of three. Choose
    2 - Start without the CD support.


    It will take a minute or so and you will end up at the command prompt (`A:\`).
    Now insert your disk with `fdisk` on it and type: `fdisk`. You will then be prompted
    whether you want large disk support. Select Yes.


    Now you will be presented with some options.


    Select 1: Create a DOS partition of logical drive.


    The next screen will give you three options.


    Select 1 again: Create Primary DOS partition. Now you’re going to create a Primary
    partition. If asked to use *all* space, answer ''No'' and enter the amount you
    wish for the C: drive. If you want 12Gigs, enter `12000`.


    You can also go back and delete it if you made the wrong choice.


    There are two things you can do from here. You can create the other partitions
    or continue and create the other partitions when installing Linux. If you want
    to create the partitions now, read the next step otherwise skip to Step V.


    ### Step III: Create extended and logical partitions


    After creating the first partition, we now go back to the main menu and select
    1 again: Create a DOS partition of logical drive.


    Now we select 2: Create Extended DOS partition. This partition will hold the swap,
    /boot and root.


    When prompted to enter the amount, use *all* the space left. If you don''t, you''ll
    wind up with unused space on your hard drive.


    After doing so, FDISK should automatically advance to the next step -> creating
    Logical DOS drives. It should give you a message that says “This drive has no
    Logical DOS drives. Would you like to create some now?”


    The logical DOS drives are just all the partitions within the extended partition.

