  trans: "\n选择“Yes”。现在输入第一个金额。如果你想为启动分区分配 70MB，请输入 `70`。现在创建另一个分区并为你的交换分区（swap）输入\
    \ `512`。再次输入剩余空间作为根目录 (`/`)。\n\n### 第四步：为 Windows 格式化驱动器\n\n现在退出 `fids` 菜单，插回启动盘并重启。选择选项\
    \ 2，并在提示符 (`A:\\`) 下输入：`format c:`。\n\n这将格式化驱动器以便安装。完成后，重启电脑（确保已取出软盘）。进入 BIOS，将第一启动项设置为\
    \ CD ROM。\n\n现在放入 Windows CD 并保存你对 BIOS 所做的更改。Windows 将从 CD 启动并安装。安装完成后，不必安装所有驱动程序，你可以以后再做。\n\
    \n### 第五步：安装 Linux\n\n现在将带有 Linux 系统的磁盘放入 CD ROM 并重启电脑。确保你的第一启动设备已设置为 CD。\n\n\
    运行安装程序。当被提示进行分区时，你可以直接使用现有分区并将它们分配给 `swap`、`boot` 和 `/`。否则，你可以在程序内通过手动分区创建分区。根据你偏好的尺寸创建分区并将它们分配到相应的挂载点。继续安装。\n\
    \n当被提示安装引导加载程序时，如果有，选择 `GRUB`。`LILO` 也可以良好工作，但 `GRUB` 更好。确保将引导加载程序安装在主引导记录 (`MBR`)\
    \ 上，否则你将没有启动 Linux 和 Windows 的选项屏幕。\n\n当被提示制作启动盘时，插入一张软盘并让它创建启动盘。\n\n完成后，重启，你就完成了。\n\
    \n### 问题 37：确认 PSU 状态\n\n我的电脑上安装了 Redhat。在 BIOS 启动期间，可以看到电池缺失的提示。\n\n如何在操作系统环境中确认电池或\
    \ PSU 状态？\n\n**A：** 你想要的信息在 `/proc` 目录以及 `/proc/acpi` 下。你可以执行 `cat /proc/cpuinfo`\
    \ 来查看文件内容。\n\n我还建议记录下你在 BIOS 中看到的所有信息，并买一个新电池。要检查 CMOS 电池的电压，请使用 `lm_sensors`。电压并无法告诉你它是否已经没电。你需要一个纽扣电池测试来测试它是好是坏。\n\
    \n### 问题 38：禁用驱动程序验证\n\n我遇到了一个与驱动程序相关的错误，但我找不到任何冲突。我尝试过禁用所有新硬件，但没有效果。\n\n如何禁用驱动程序验证？\n\
    \n**A：** 要设置文件签名验证选项，你可以执行以下操作：\n\n1. 打开控制面板中的 `System`。\n2. 在 `Hardware` 选项卡上，点击\
    \ `Driver Signing`。\n3. 在 `File signature verification` 下，点击以下项之一：\n   - `Ignore`：允许在此计算机上安装所有设备驱动程序，无论它们是否具有数字签名。\n\
    \   - `Warn`：当安装程序尝试安装没有数字签名的设备驱动程序时显示警告消息。这是 Windows 的默认行为。\n   - `Block`：防止安装程序安装没有数字签名的设备驱动程序。\n\
    \n如果你以管理员或 `Administrators` 组成员身份登录，在 `Administrator` 选项下，点击 `Apply setting as\
    \ system default` 将所选设置作为所有登录到此计算机的用户的默认设置。\n\n### 问题 39：SCSI\n\n什么是 SCSI？\n\n\
    **A：** `SCSI` 代表小型计算机系统接口（Small Computer System Interface）。它是一种标准，通过使用标准的硬件接口将外设备连接到计算机，该接口使用标准的\
    \ `SCSI` 命令。`SCSI` 标准可以分为 `SCSI` (`SCSI1`)、`SCSI2`（SCSI wide 和 SCSI wide fast）以及现在的\
    \ `SCSI-3`，后者由至少 14 独立标准文档组成。\n\n`SCSI2` 是 SCSI 命令规范最流行的版本，允许扫描仪、硬盘驱动器、CD-ROM\
    \ 播放器、磁带等许多设备。`SCSI-3` 解决了许多“灰色地带”，增加了许多新功能和性能改进。它还添加了新类型的 `SCSI` 总线，例如光纤（fiber\
    \ channel），它使用 4 针铜线连接或对光纤电缆，而不是常见的排线连接。\n\n### 问题 40：选择 SCSI 设备\n\n我想使用 `SCSI`\
    \ 接口，但我该如何选择利用哪些设备？\n\n**A：** 我建议你使用支持 `LVD`、自动终止和 `SCAM`（SCSI Configured Automatically）的设备。大多数新设备都符合这种模式。此外，确保考虑这些设备所在的位置。\n\
    \n### 问题 41：设置 SCSI 链\n\n我如何设置 SCSI 链？\n\n**A：** 安装 `SCSI` 卡。现在的大多数卡都是即插即用的，Windows\
    \ 会快速找到并配置它们。下一步是将设备用电缆连接起来，并设置 `I.D.` 和终止（如有必要）。`SCSI` 链上的每个设备都需要它自己的 `I.D.`。\n\
    \n例如（示例为 8 设备设备链）：\n\n- `ID#0` - 硬盘\n- `ID#1` - CD-ROM\n- `ID#2` - CD-R\n- `ID#3`\
    \ - 内部 Jaz\n- `ID#4` - 扫描仪\n- `ID#5` - 硬盘\n- `ID#6` - Zip 盘\n- `ID#7` - SCSI 卡\n\
    \n如果两个设备被设置为相同的 `I.D.`，整个链可能可能无法工作，或者可能只是冲突的设备无法工作。始终确保每个设备都有不同的 `I.D.`。大多数设备都有跳线帽或小旋钮来设置\
    \ `I.D.` 数字。位于 `ID#0` 的硬盘应该是你的启动驱动器（如果你从 SCSI 启动），而 CD-ROM 设置在最低可用的 `I.D.#`，以便在\
    \ CD-R 之前为其分配驱动器号。\n\n终止是一个独立的问题，但它极大影响你的 `SCSI` 总线。`SCSI` 链末端的每个设备都必须终止。这指的是它们在链上的物理位置，而不是它们的\
    \ ID 数字。\n\n"
