  trans: '


    如果你没有 `xfs`，那么你需要通过将字体添加到 XFree86 字体路径并使用 `xset` 来安装 Type 1 字体。`XFree86 3.x` 用户应该通过
    `xfisst` 安装 TrueType 字体，而 `XFree86 4.x` 用户可以将它们添加到 X 字体路径。你应该通过 `xfisst` 安装 TrueType
    字体。


    ## 字体路径


    `XFree86` 通过搜索字体路径（一个包含字体的目录列表）来查找你的字体。当应用程序请求字体时，它会逐个搜索你字体路径中的目录，直到找到该字体为止。要使字体可用，你需要设置你的字体路径。你可以使用命令
    `xset fp+ directory` 将目录添加到你的字体路径中。一旦完成此操作，你只需要使用命令 `xset fp rehash` 请求 X 重新重新扫描可用字体。


    由于你希望这些命令自动运行，因此你应该将它们放在你的 `.xinitrc` 文件中，或者可能放在你的 `.Xclients` 或 `.xsession` 文件中。这取决于你如何启动
    X。将这两个文件设为彼此的符号链接很方便，可以避免混淆。


    另一种自动设置命令的方法是编辑 `XF86Config`。例如，在 X 启动时将 `/usr/share/fonts/myfonts` 添加到字体路径，可以如下编辑
    `XF86Config`：


    ```

    Section "Files"

    FontPath /usr/share/fonts/myfonts

    EndSection

    ```


    编辑 `XF86Config` 的优点是产生的更改是全系统范围。


    ## 安装 Type 1 字体


    让 X 支持 Type 1 字体最简单的方法是借助 `Type1inst` 实用。这是一个 Perl 脚本，它会自动创建 X 使用字体时所需的 `fonts.dir`
    和 `fonts.scale` 文件。只需 `cd` 进入该目录并运行 `type1inst` 即可。


    ```

    cd directory type1inst

    ```


    现在，你需要将字体添加到字体路径中。如果你已经运行了独立的第 4.4 节，则通过编辑你的 `xfs` 配置文件来实现。RedHat 用户可以直接使用 `chkfontpath`。格式为
    `chkfontpath --add directory`。


    在你重启 `xfs` 或通过发送 `SIGHUP` 让其重新加载后，你的字体将对 X 可用。你可能还需要运行 `xset fp rehash`。你的字体现在应该对
    X 可用了。现在运行 `xset fp rehash`，X 就能找到新字体了。


    如果你没有 `xfs` 包，你需要按照之前描述的，将包含新字体的目录添加到字体路径。


    ## 添加 TrueType 字体


    添加 TrueType 字体稍微困难一些，因为你需要一个能够提供 TrueType 字体的字体服务器。实现此点的字体服务器是 `xfisst` 和 `xfs`。


    `xfisst` 是 TrueType 字体服务器。虽然它很容易配置且非常有用，但似乎 `xfs` 变得越来越流行。`xfs` 相比 `xfisst` 的主要优势是它同时支持
    Type 1 和 TrueType 字体。


    设置 `xfisst`只需下载并安装。一旦安装，你需要执行以下操作：


    1. 将字体安装到相应的目录（阅读随包附的文档）。

    2. `cd` 进入该目录并运行 `xfisst --sync`。这会导致它查找字体并创建 `fonts.dir` 文件。

    3. 现在将 `unix/:7100` 添加到你的字体路径。


    你的 TrueType 字体现在应该可以显示并供 `GIMP` 和 `Netscape` 等应用程序使用。你可能希望配置它在每次系统启动时启动。检查是否包含了启动文件（如果你使用
    `RPM`，可以使用 `rpm -ql xfisst|grep init` 并查找类似此类名称的文件：`/etc/rc.d/init.d/xfisst`）。如果你没有初始化脚本，只需在
    `/etc/rc.local` 中放入如下两行内容：


    ```

    /usr/X11R6/bin/xfisst --sync

    /usr/X11R6/bin/xfisst &

    ```


    一些较新的 Linux 发行版自带了 X 字体服务器 `xfs`，并配置为独立程序运行。Redhat 和所有基于 Redhat 的发行版都使用了编译了 TrueType
    支持的 `xfs`。Debian 同样提供了 `xfs`，但他们提供的版本没有内置的 TrueType 支持。


    将 `xfs` 作为独立服务器运行有几个优点，特别是当它编译了 TrueType 支持时。主要优势是，由于字体服务器不再附加到 X 服务器，因此可以为远程显示提供字体。此外，修改字体路径也更容易。


    作为字体服务器，`xfs` 有它自己的字体路径。你可以通过将 `unix/:port` 添加到 XFree86 字体路径，将 `xfs` 字体服务器放在 XFree86
    的字体路径中。一旦这样做，`xfs` 字体路径中的任何字体都会自动对 XFree86 可用。


    `xfs` 字体路径由 `xfs` 配置文件决定，在 Redhat 上为 `/etc/X11/fs/config`，在 Debian 上为 `/etc/X11/xfs/config`。Redhat
    用户不需要显式编辑此文件；他们可以使用 `chkfontpath` 工具。语法简单：`chkfontpath --add directory`。


    其他发行版的用户可以如下编辑配置文件：


    ```

    catalogue = /usr/X11R6/lib/X11/fonts/misc:unscaled,

    ...

    /usr/share/fonts/my_new_fonts/,

    ...

    /usr/share/fonts/some_other_fonts/,

    ...

    ```

    （注：此处原文存在大量重复的配置示例内容，已按要求进行清理）


    编辑 `XF86Config` 的优点是产生的更改是全系统范围。


    '
- fmt: "\nThat will be a default path for normal and root users respectively. It is\
    \ very important that `/usr/bin/X11` is available for X users. If X user logs\
    \ in to another machine to start and X client application, he should get `/usr/bin/X11`\
    \ to his path even he don't seem to come directly from X terminal. After running\
    \ `Xstartup` the `XDM` runs `/etc/X11/Xsession` that is run as the final user.\
    \ Local configuration is meant to be done in `/etc/environment` that is sourced\
    \ (included) from `Xsession` if available (`Xsession` is run with `/bin/sh` and\
    \ thus `/etc/environment` must be sh file). This clashes with `ssh` that supposes\
    \ that `/etc/environment` is a file that contains just lines of form `VAR=VALUE`.\
