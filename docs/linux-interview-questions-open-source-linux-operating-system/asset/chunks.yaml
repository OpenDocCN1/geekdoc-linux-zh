  trans: '


    如所述，Linux 正在成为最“热门”软件系统之一。几乎所有主要公司——IBM、HP、Sun 微型系统等——都在推广它，并且 Linux 已成为企业 Web
    服务器的首选。Linux 是目前被最广泛使用的操作系统。


    由于其具有高可靠性、较低的病毒等程序感染率以及低廉的成本，Linux 也开始进入大型桌面市场，例如企业、学校等。


    Linux 社区是共享的。这意味着在线的人们更愿意为你提供帮助，而且有更多的开源软件可供。如果你是一名大学计算机科学专业的学生，还有一些非常重要的额外优势：


    许多计算机科学课程专门使用 UNIX，因此它们的工作无法在 Windows 平台上完成。由于它是一个完整的 UNIX 系统，Linux 允许学生在舒适的家里完成作业。


    在安装和使用 Linux 的过程中，学生可以学习到许多在课程中无法学到的计算机实用知识。这种实践经验也可以在工作面试中帮助你，无论是毕业后的正式工作，还是大学期间的暑期工作和实习。。即使你面试的工作不涉及
    UNIX，如果你能讨论例如你为使用和自定义 Linux 系统所做的各种尝试，你也绝对会给面试官留下深刻印象。


    # 第一章：Linux 基础


    ## 问题 01：Shell（壳）


    什么是 Shell？


    答：Shell 最好的描述是用来与计算机通信的语言。大多数用户使用桌面的点点击式语言进行操作，但在这种语言中是由计算机引导对话的。用户扮演的是被动角色，从计算机提供的选项中选择任务。对于程序员来说，要在图形用户界面（GUI）格式中包含命令的所有选项和可能的用途是非常困难的。因此，GUI
    的能力通常低于后端的命令或命令。


    Shell 是一种与系统通信的高级方式，因为它允许双向对话。通信中的交互是平等的，这样就可以测试新的想法。Shell 允许用户以非常灵活的方式处理系统，并实现任务自动化。


    当你在 Linux 命令行中忙碌时，总有一个名为 `shell` 的程序在运行。当你输入命令时，是 `shell` 从你的键盘读取命令、处理它们并最后将它们交给操作系统。有很多不同的
    shell 程序可用，但在大多数 Linux 系统上，`bash`（Bourne Again Shell）是默认 shell。当你在 Linux 系统上启动
    shell 时，它很可能是 `bash`。


    ## 问题 02：虚拟终端与终端模拟器


    我现在处于 X Window 系统（GUI）中。我该如何进入命令行界面（CLI）？


    答：你可以通过切换到另一个虚拟终端来开始使用 CLI，或者你可以启动一个终端模拟器。


    终端模拟器是一个打开窗口并在该窗口中运行 `shell` 的程序。像启动其他 X 程序一样启动终端模拟器，这意味着即使你仍然安全地处于 GUI 中，也可以拥有命令行。现在，浏览你通常用于启动程序的程序菜单，寻找看起来像终端模拟器的应用程序（`xterm`,
    `rxvt`, `gnome-terminal`, `konsole`, `kvt`, `eterm` 等等）。你可以根据需要启动任意数量的程序并尝试所有每一个。它们基本上做的是相同的事情：让你可以使用
    `shell`。不同的终端模拟器在每一个程序中都运行相同的 shell 程序 `bash`。


    进入 CLI 的另一种方法是在 X Windows 系统仍在运行的同时，切换到另一个虚拟终端。默认情况下，Linux 通常有六个虚拟终端，而第七个是 X 运行的地方。你可以通过按下
    `Ctrl+Alt` 加上目标终端数字的功能键来切换虚拟终端。按下 `Ctrl+Alt+F1` 将你带到第一个虚拟终端，`Ctrl+Alt+F2` 将你带到第二个虚拟终端，依此类推。


    当你处于虚拟终端时，你不再在 GUI（X Window 系统）中，而是在 CLI 中。GUI 仍在第七个虚拟终端中运行，所以你可以正常地通过 `Ctrl+Alt+F7`
    切换回去。


    当终端显示 `login:` 提示符时，你现在可以在终端中输入用户名并正常登录。也许起初在 X 中使用终端模拟器做事情会更简单，但这并不重要，因为结果是一样的：你面前有一个
    `bash` 提示符。该提示符会等待你输入命令或程序名称。例如，尝试输入 `ls`。正如你从输出中看到的，`ls` 命令列出了你当前目录的内容。Linux
    中的所有命令本身都是小程序，你可以通过输入它们的名称来运行这些程序。


    ## 问题 03：Linux 目录结构


    Linux 系统是如何结构的？


    答：以下是一些目录列表，它们将向你展示最有趣的地方。


    `/`：根目录是你的目录结构的起点。系统中的所有其他文件和目录都在根目录下。通常，根目录只包含子目录，不建议将单个文件直接存储在根目录下。


    `/boot`：这是 Linux 保留启动所需信息的地方。如果你列出 `/boot` 的内容，你会看到一个名为 `vmlinuz` 的文件——那是内核。


    `/etc`：这是 Linux 系统的配置文件。这些文件大部分是文本文件，可以手动编辑。以下是该目录的一些内容：


    `/etc/inittab`：一个描述在系统启动和正常运行期间启动哪些进程的文本文件。在这里决定是否希望在启动时自动启动 X Window 系统，并配置当按下
    `Ctrl+Alt+Del` 时发生什么。


    `/etc/fstab`：此文件包含关于各种文件系统及其挂载点的描述性信息，如软盘、光驱等等。


    `/etc/passwd`：一个包含每个用户账户各种信息的文件。这里是定义用户的地方。


    `/bin`, `/usr/bin`：这两个目录包含了许多系统程序。`/bin` 目录包含系统运行所需最重要的程序，例如 shell、`ls`、`grep`
    和其他基本程序。`/usr/bin` 则包含系统用户的应用程序。


    `/sbin`, `/usr/sbin`：大多数系统管理程序存储在这些目录中。在许多情况下，你必须以 root 用户运行这些程序。


    `/usr`：此目录包含用户应用程序以及它们的各种其他内容，如源代码、图片、文档或它们使用的配置文件。`/usr` 是 Linux 系统中最大的目录，有些人喜欢将其放在单独的分区上。以下是
    `/usr` 的一些内容：


    `/usr/doc`：多种文件格式的用户应用程序文档。


    `/usr/share`：许多应用程序的配置和图形。


    `/usr/src`：系统软件源代码，包括 Linux 内核。


    `/usr/include`：C 编译器的头文件。头文件定义了构建大多数标准程序所需的结构和常量。`/usr/include` 下的子目录包含 C++ 编译器的头文件。


