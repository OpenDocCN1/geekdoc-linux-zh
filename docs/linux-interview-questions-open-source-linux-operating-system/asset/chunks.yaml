  raw: 'Quotes are very important. If you don''t use them, cat will view three different
    files: File, With and Spaces.txt.


    Escaping the characters is another way to deal with special characters in a file
    name. You put a backslash ( \ ) in front of the special character or space. This
    makes the bash shell treat the special character like a normal character. For
    example:


    $ cat File\ With\ Spaces.txt


    Or:


    $ rm File\*.txt


    If the file name contains the \ character, you escape it too!


    $ rm File\\.txt


    Or, you can also use the quotes:


    $ rm ''File\.txt''


    It''s a matter of choice which method you will use; quoting or escaping. However,
    quoting doesn''t always work. For example, if you want to use shell wildcards
    with a file that has special characters in its name, it''s impossible to use quoting
    because that would escape the wildcards as well, so in these cases it''s necessary
    to escape the special characters with a backslash.


    [Question 89: Automatic file name completion](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    I was told that automatic file completion is one of the most useful features of
    the Linux command line. How does it work?


    A: Working at the Linux command line requires a lot of typing. It would get very
    frustrating with long commands and file names but your Tab key can make your life
    a lot easier.


    You have to type only the beginning of a command, directory, or a file name, hit
    the Tab key and the shell completes the rest. For example, if you want to view
    a file called unDENIABLYVERYVERYLONG.FileName.txt, all you have to type is: $
    less un and hit the Tab key. The rest of the file name is completed automatically.


    There may be several files that start with the same letters but have different
    endings. How the shell behaves when you press the Tab key in this case may differ
    depending on the shell and how it''s configured. Usually with a default bash configuration,
    when you''ve typed the first letters of a file name and hit the Tab key, the shell
    completes as much as it can and beeps. When you press the Tab key again, the shell
    shows you all the alternatives. Sometimes you''ll have to hit Tab twice before
    it shows you the alternatives. Now you can either type the whole file name or
    type a couple more letters and hit Tab again.


    You can complete anything: commands, program names, directories, and file names.
    For example, to issue the command umount /mnt/floppy, you can first type um, hit
    Tab, then type /mn, hit Tab, then type f, hit Tab. Automatic file name completion
    makes life easier.


    [Question 90: Shell wildcards](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    What are shell wildcards?


    A: Wildcards are a shell feature that makes the command line much more powerful
    than any GUI file managers. These are special characters that allow you to select
    filenames that match certain patterns of characters. This helps you to select
    even a big group of files with typing just a few characters and in most cases
    it''s easier than selecting the files with a mouse.


    Here''s a list of the most commonly used wildcards in bash:


    Wildcard Matches


    * zero or more characters


    ? exactly one character


    [abcde] exactly one character listed


    [a-e] exactly one character in the given range


    [!abcde] any character that is not listed


    [!a-e] any character that is not in the given range


    {debian,linux} exactly one entire word in the options given


    You can use wildcards with any command that accepts file names as arguments.


    For example: Probably the * character is already familiar to you, because it''s
    widely used in many other places and not just in Linux. The following removes
    every file from the current directory: $ rm *


    The following command moves all the HTML files, that have the word "linux" in
    their names, from the working directory into a directory named dir1: $ mv *linux*.html
    dir1


    Hence, moving multiple files can be just as simple as moving only one file.


    The following displays all files that begin with d and end with .txt: $ less d*.txt


    The following command removes all files whose names begin with junk, followed
    by exactly three characters: $ rm junk.???


    With this command you list all files or directories whose names begin with hda,
    followed by exactly one numeral: $ ls hda[0-9]


    This lists all files or directories beginning with hda, followed by exactly two
    numerals:


    $ ls hda[0-9][0-9]


    The following lists all files or directories whose name starts with either hd
    or sd, followed by any single character between a and c: $ ls {hd,sd}[a-c]


    This command copies all files that begin with an uppercase letter, to directory
    dir2:


    $ cp [A-Z]* dir2


    This deletes all files that don''t end with c, e, h or g: $ rm *[!cehg]


    You can use simple patterns or combine different wildcards and construct very
    complex patterns. Also, you can use them with any commands that accept file names
    as arguments.


    [Chapter VI: X Window System](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    [Question 91: Windows manager](#tmp_a444e16f01478d5da970f8ad1ff8f7ca_YvfFuV.ch.fixed.fc.tidied.stylehacked.xfixed_split_002.html_ToC)


    What is a windows manager? How is it different from an X Window system and a Desktop
    Environment?


    A: Microsoft Windows is based on a graphical user interface (GUI for short) where
    you can control the applications by pointing and clicking. Linux, just like UNIX
    or MS-DOS, is completely text based and can be done without any GUI. Using Linux
    as a server is an advantage because computer resources are not wasted in running
    a GUI. On the other hand most home users or ordinary users want a pretty GUI where
    we can use graphical apps and point and click to.


    Because Linux is text based, you run the GUI on top of it. In UNIX the GUI is
    called X Window System or X for short. The X Window System makes it possible to
    run graphical apps on Linux. X is responsible for the hardware related settings
    as it controls the mouse, keyboard, the monitor settings, etc. The graphical apps
    themselves don''t need to care for the hardware they''re running on. The apps
    just talk to X and tell it what they want to display. X listens to the apps and
    converts the apps'' display commands into something that the graphics hardware
    can display. Therefore, X makes it possible for the graphical apps to display
    their interface on the screen but doesn''t control the windows where the apps
    are displayed.


    The Linux version of X used to be XFree86, but these days, most new distros use
    X.org. X.org is a fork of XFree86 that was created because of some licensing issues.
    So, if you want a GUI in Linux, you must run X.org on top of it.


    Windows manager: Because X provides the place to put the windows on but doesn''t
    control them, you need additional software that takes care of handling the windows.
    The piece of software dealing with the windows is the window manager. The window
    manager is just an X program itself, and like the other graphical apps, it also
    needs the X Windows in order to work. It''s just a special piece of X software
    because all it does is take care of the windows.


    The window manager controls the way your desktop works, on how the windows look
    and act. It''s the window manager''s job to provide ways of controlling the windows,
    like moving, hiding, resizing, or closing them. The window manager decides what
    window at the moment accepts input from you and what window is on the top. The
    window manager also controls the ways you do these tasks: what mouse buttons you
    click or what keys you press in order to accomplish these window management tasks.'
