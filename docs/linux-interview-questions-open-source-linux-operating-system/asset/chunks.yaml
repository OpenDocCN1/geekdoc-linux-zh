    or power cycle rather than a soft reboot (e.g. `Ctrl-Alt-Del`).


    The correct solution is to ensure that you use the same `IRQ` and `DMA` settings
    with MS-DOS and Linux (or not to use DOS).


    ## Question 46: Configure Linux to support sound


    What are the correct steps to configure Linux to support sound?


    A: Follow these steps:


    1. **Installing the sound card**: Follow the manufacturer''s instructions for
    installing the hardware or have your dealer perform the installation. Older sound
    cards usually have switch or jumper settings for `IRQ`, `DMA` channel, etc; note
    down the values used. Use the factory defaults if you are not sure. Try to avoid
    conflicts with other devices (e.g. Ethernet cards, SCSI host adaptors, serial
    and parallel ports) if possible. Usually you should use the same I/O port, `IRQ`,
    and `DMA` settings that work under DOS. In some cases, you may need to use different
    settings to get things to work under Linux. A trial and error may be needed.


    2. **Configuring Plug and Play if applicable**: Some sound cards use the ISA Plug
    and Play protocol to configure settings for I/O addresses, interrupts, and `DMA`
    channels. If you have a newer PCI-bus type of sound card or one of the very old
    ISA sound cards that uses fixed settings or jumpers, then you can skip this procedure.
    The preferred way to configure Plug and Play cards is to use the `isapnp` tools
    which ship with most Linux distributions or download them from Red Hat''s web
    site [http://www.redhat.com/].


    First check the documentation for your Linux distribution. It may already have
    Plug and Play support set up for you or it may work slightly differently than
    described here. If you need to configure it yourself, the details can be found
    in the man pages for the `isapnp` tools. Briefly the process you would normally
    follow is:


    - Use `pnpdump` to capture the possible settings for all your Plug and Play devices,
    saving the result to the file `/etc/isapnp.conf`.

    - Choose settings for the sound card that do not conflict with any other devices
    in your system and uncomment the appropriate lines in `/etc/isapnp.conf`. Don''t
    forget to uncomment the `(ACT Y)` command near the end.

    - Make sure that `isapnp` is run when your system boots up, normally done by one
    of the startup scripts. Reboot your system or run `isapnp` manually.


    If for some reason you cannot or do not wish to use the `isapnp` tools, there
    are a couple of other options. If you use the card under Microsoft Windows 95
    or 98, you can use the device manager to set up the card, then soft boot into
    Linux using the `LOADLIN` program. Make sure Windows and Linux use the same card
    setup parameters. If you use the card under DOS, you can use the `icu` utility
    that comes with SoundBlaster16 PnP cards to configure it under DOS, then soft
    boot into Linux using the `LOADLIN` program. Again, make sure DOS and Linux use
    the same card setup parameters. True ISA PnP support is implemented in the 2.4
    and later kernels. Some of the sound card drivers now support automatically detecting
    and configuring the cards without the `isapnp` tools. Check the documentation
    for the card''s driver for details.


    3. **Configuring and building the kernel for sound support**: You need the appropriate
    device drivers for your sound card to be present in the kernel. The kernel running
    on your system may already include the drivers for your sound card. In most cases
    the drivers would have been built as kernel loadable modules. You can check which
    drivers are available as modules by looking in the `/lib/modules` directories.
    For the 2.4.4 kernel, the sound drivers would normally appear in `/lib/modules/2.4.4/kernel/drivers/sound/`.
    If you see the driver(s) for your sound card, you can try using the module directory
    and skip recompiling the kernel.


    If the sound drivers are not already built, you will need to configure and build
    a new kernel. You can either build the sound drivers into the kernel or build
    them as kernel loadable modules. In most cases building as modules is preferred,
    as it allows you to easily experiment with loading different drivers if unsure
    which one to use and the drivers can be unloaded when not needed, freeing up memory.
    Building the drivers into the kernel itself may be desirable if you are unfamiliar
    with kernel modules and want a simpler solution.


    If you have never configured the kernel for sound support before it is a good
    idea to read the relevant documentation included with the kernel sound drivers,
    particularly information specific to your card type. The files can be found in
    the kernel documentation directory and usually installed in `/usr/src/linux/Documentation/sound`.
    If this directory is missing, you likely either have a very old kernel version
    or you have not installed the kernel source code. Follow the usual procedure for
    building the kernel. There are currently three interfaces to the configuration
    process. A graphical user interface that runs under X11 can be invoked using `make
    xconfig`. A menu-based system that only requires text displays is available as
    `make menuconfig`. The original method, using `make config`, offers a simple text-based
    interface.


    When configuring the kernel there will be many choices for selecting the type
    of sound card you have and the driver options to use. The on-line help within
    the configuration tool should provide an explanation of what each option is for.
    Select the appropriate options to the best of your knowledge. After configuring
    the options you should compile and install the new kernel.


    4. **Creating the device files**: For proper operation, device file must be created
    for the sound devices. These are normally created for you during installation
    of your Linux system. A quick check can be made using the command below. If the
    output is as shown (the date stamp will vary) then the device files are almost
    okay.


    ```

    ls -l /dev/dsp

    crw-rw-rw-1 root root 14,3 Jan 25 1997

    ```


    Note that having the right device files doesn''t guarantee anything. The kernel
    driver must also be loaded or compiled before the devices work. In rare cases,
    if you believe the device files are wrong, you can recreate them. Most Linux distributions
    have a `MAKEDEV` script which can be used for this purpose. Take note that if
    you are using the devfs filesystem in 2.4 kernels, the sound device files are
    actually found in `/dev/sound`, but there will be symbolic links to the older
    devices, such as `/dev/dsp`.


    5. **Booting the Linux kernel and testing the installation**: You should now be
    ready to boot the new kernel and test the sound. Follow your usual procedure for
    installing and rebooting the new kernel.


    If you are using loadable kernel modules for sound, you will need to load them
    using the `modprobe` command for the appropriate drivers, e.g. run the command
    `modprobe sb` for a SoundBlaster card.


    After booting or loading the kernel modules, check for a message such as the following
    using the `dmesg` command:


    ```

    Soundblaster audio driver Copyright (C) by Hannu Savolainen 1993-1996

    sb: SB AWE64 PnP detected

    sb: ISAPnP reports ''Creative AWE64 PnP'' at i/o 0x220, irq 5, dma 1, 5

    SB 4.16 detected OK (220)

    sb: 1 Soundblaster PnP card(s) found.

    Crystal 4280/46xx + AC97 Audio, version 1.22.32, 10:28:40 Apr 28 2001

    cs46xx: Card found at 0xf4100000 and 0xf4000000, IRQ 11

    cs46xx: Thinkpad 600X/A20/T20 (1014:0153) at 0xf4100000/0xf4000000, IRQ 11

    ac97_codec: AC97 Audio codec, id: 0x4352:0x5914 (Cirrus Logic CS4297A rev B)

    ```


    The message should indicate that a sound card was found and match your sound card
    type and jumper settings (if any). The driver may also display some error messages
    and warnings if you have incorrectly configured the driver or chosen the wrong
    one.

