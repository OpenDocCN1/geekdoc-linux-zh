    ## 问题 98：XF86Config 文件


    XF86Config 文件用于何处？


    答：X Window 系统的配置文件 `XF86Config` 用于 X 服务器来设置必要的配置参数。它是一个纯文本文件，被划分为若干节和子节。重要的节包括
    `Files`、`Input Device`、`Monitor`、`Modes`、`Screen`、`Device` 和 `Server Layout`。


    节可以任何顺序出现，且每种类型可能有多个，例如，如果您有多个显示器，比如一个视频投影仪和一个笔记本电脑的内置 LCD 屏幕。


    `Monitor`节用于物理显示设备，`Screen`节用于逻辑显示器，因此您可以让两个显示器显示相同的内容或完全不同的信息。


    例如，`Device`节中的 `"SWCursor"` 选项控制鼠标指针是在外部显示器上镜像显示还是被抑制。在典型的 Unix 类系统中，该文件通常位于 `/etc/X11`，日志文件位于
    `/var/log`，通常将最后一次 X 启动日志命名为 `XFree86.0.log`，上一次的命名为 `XFree86.0.log.old`。


    对此文件进行不当编辑可能会导致黑屏或无法读取的屏幕，甚至可能损坏显示器，特别是 CRT 显示器。如果您需要更改配置，务必知道如何以文本模式启动计算机，以便撤销对上一个可用配置的任何更改。


    ## 问题 99：配置文件


    我可以在哪里找到 Xfree86 的配置文件？


    答：`XFree86` 的配置文件通常位于 `/etc/X11/XF86Config`（但有时也称为 `XF86Config-4`，以避免与 XFree86
    3.x.x 版本混淆）。已经创建了许多 GUI 来简化配置，这通常取决于发行版（例如，Suse 使用 `sax2`，Debian 使用 `debconf`
    来生成它）。


    配置文件被划分为若干节（并非所有节都是必须的，某些节可以出现多次）：


    - **Files**：`XF86Config` 或 `XF86Config-4` 位于 `/etc/X11`。请注意，新的发行版正在使用 `xorg.conf`
    代替 `XF86Config`。`xorg.conf` 位于相同位置，并具有相同的设置和样式。

    - **ServerFlags**：通用服务器配置选项；

    - **Module**：配置加载哪些模块；

    - **InputDevice**：配置鼠标和键盘等输入设备；要使滚轮工作：将鼠标协议更改为 `"IMPS/2"`。选项 `"ZAxisMapping" "4
    5"`。

    - **Device**：配置图形设备/显卡。例如（带有专有驱动程序的的 nVidia GeForce TwinView 设置）：


    ```text

    Section "Device"

    Identifier"GeForce 4 Ti 4600"

    Driver "nvidia"

    Option "TwinView"

    Option "MetaModes""1024x768, 1024x768; 800x600, 800x600"

    Option "SecondMonitorHorizSync" "30-70"

    Option "SecondMonitorVertRefresh""50-120"

    Option "ConnectedMonitor" "CRT, CRT"

    End Section

    ```


    `''Section "Device"''` 和 `''EndSection''` 是语法的一部分，必须存在。`Driver` 是您的显卡所需的驱动。`Option`
    行被传递给驱动程序以获取所需的功能。


    - **Monitor**：配置显示器。将 `Identifier` 更改为您想要的任何内容（显示器的名称和模型），但请记住同时在屏幕节下的 `"monitor"`
    中进行更改。不要忘记输入错误的值可能会损坏您的显示器。

    - **Modes**：定义特殊的模式行（modelines）。

    - **Screen**：定义查看屏幕。例如：


    ```text

    Section "Screen"

    Identifier"Default Screen"

    Device "Generic Video Card"

    Monitor"Generic Monitor"

    DefaultDepth 24

    SubSection "Display"

    Depth 1

    Modes "2048"

    ```


