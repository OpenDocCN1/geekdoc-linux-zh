    `s` = Unix domain socket


    `p` = named pipe


    `c` = character device file


    `b` = block device file


    The next nine characters show the file''s permissions, divided into three groups,
    each consisting of three characters. The first group of three characters shows
    the read, write, and execute permissions for user, the owner of the file. The
    next group shows the read, write, and execute permissions for the group of the
    file. Similarly, the last group of three characters shows the permissions for
    other, everyone else. In each group, the first character means the read permission,
    the second one write permission, and the third one executes permission.


    The characters are pretty easy to remember.


    `r` = read permission


    `w` = write permission


    `x` = execute permission


    `-` = no permission


    Now let’s go back to our sample output above. You already know that `dir` is a
    directory, because the first column begins with a `d`. The owner of this directory
    is user `dan` and the group owner is `writers`. The first three characters, `rwx`,
    indicate the directory''s owner, `dan` and in this case, has full access to the
    directory. The user `dan` is able to access, view, and modify the files in that
    directory. The next three characters, `r-x`, indicate that all users belonging
    to group `writers` have read and execute permissions to the directory. They can
    change into the directory, execute files, and view its contents. However, because
    they don''t have write permissions, they can''t make any changes to the directory
    content. Finally, the last three characters, `r-x`, indicate that all the users
    who are not `dan` or don''t belong into group `writers`, have read and execute
    permissions in the directory.


    Also, the first column that begins with a `-` is a regular file, owned by user
    `dan` and group `writers`, just like the directory in our example. The first three
    characters, `rw-`, indicate the owner has read and write access to the file. According
    to the next three characters, `r--`, the users belonging to group `writers` can
    view the file but not modify or execute it. The final three characters, `---`,
    indicate no one else has any access to the file.


    Similarly, you can see `otherfile` is a regular file and its owner has full access
    to it, while everyone else can read and execute the file but not modify it.


    ### Question 72: file permissions in symbolic mode


    Can the root user and the file’s owner set file permissions?


    A: The root user and the file’s owner can set file permissions. It is done with
    the `chmod` command. `chmod` has two modes – symbolic and numeric.


    The symbolic mode is easy to perform. First, you decide if you set permissions
    for the user (`u`), the group (`g`), others (`o`), or all of the three (`a`).
    Then, you either add a permission (`+`), remove it (`-`), or wipe out the previous
    permissions and add a new one (`=`). Next, you decide if you set the read permission
    (`r`), write permission (`w`), or execute permission (`x`). Lastly, you''ll tell
    `chmod` which file''s permissions you want to change.


    Suppose we have a regular file called `redfile`, and the file has full access
    permissions for all the groups (long directory listing would show `-rwxrwxrwx`
    as the file''s permissions).


    Wipe out all the permissions but add read permission for everybody:


    ```

    $ chmod a=r redfile

    ```


    After the command, the file''s permissions would be `-r--r--r--`.


    Add execute permissions for group:


    ```bash

    $ chmod g+x redfile

    ```


    Now, the file''s permissions would be `-r--r-xr--`.


    Add both write and execute permissions for the file''s owner. Note how you can
    set more than one permission at the same time:


    ```

    $ chmod u+wx redfile

    ```


    After this, the file permissions will be `-rwxr-xr--`.


    Remove the execute permission from both the file''s owner and group. Note, again,
    how you can set them both at once:


    ```bash

    $ chmod ug-x redfile

    ```


    Now, the permissions are `-rw-r--r--`.


    The following is the summary for setting file permissions in symbolic mode:


    **Which user?**

    - `u` user/owner

    - `g` group

    - `o` other

    - `a` all


    **What to do?**

    - `+` add this permission

    - `-` remove this permission

    - `=` set exactly this permission


    **Which permissions?**

    - `r` read

    - `w` write

    - `x` execute


    ### Question 73: set file permissions in numeric mode


    Now that I know how to set file permissions in symbolic mode, how about in numeric
    mode?


    A: In the numeric mode, the file permissions aren''t represented by characters.
    Instead, they are represented by a three-digit octal number.


    - `4` = read (`r`)

    - `2` = write (`w`)

    - `1` = execute (`x`)

    - `0` = no permission (`-`)


    To get the permission bits you want, you add up the numbers accordingly. For example,
    the `rwx` permissions would be `4+2+1=7`, `rx` would be `4+1=5`, and `rw` would
    be `4+2=6`. Because you set separate permissions for the owner, group, and others,
    you''ll need a three-digit number representing the permissions of all these groups.


    Here’s an example:


    ```bash

    $ chmod 755 redfile

    ```


    This would change the permissions to `rwxr-xr-x`.


    ```bash

    $ chmod 640 redfile

    ```


    In this case, redfile''s permissions would be `-rw-r-----`. The numeric mode may
    not be as straightforward as the symbolic mode, but with the numeric mode, you
    can more quickly and efficiently set the permissions.


    Here is a quick reference for setting file permissions in numeric mode:


    Which number?

    - `0` ---

    - `1` `--x`

    - `2` `-w-`

    - `3` `-wx`

    - `4` `r--`

    - `5` `r-x`

    - `6` `rw-`

    - `7` `rwx`


    ### Question 74: Change file and group ownership


    How can I change a file''s owner and group in Linux?


    A: You can change the owner and group ownership of files and directories with
    `chown` and `chgrp` commands.


    Use of `chown`:


    You can change the owner and group of a file or directory with the `chown` command
    if you are the root user or the owner of the file.


    Set the file''s owner:


    ```bash

    $ chown clark redfile

    ```


    After giving this command, the new owner of a file called redfile will be the
    user `clark`. The file''s group owner will not change. Instead of a user name,
    you can also give the user''s numeric ID here if you want.


    You can also set the file''s group at the same time. If the user name is followed
    by a colon and a group name, the file''s group will be changed as well.


    ```bash

    $ chown clark:clarkgroup somefile

    ```


    After giving this command, redfile''s new owner would be user `clark` and the
    group `clarkgroup`.


    You can set the owner of a directory the same way you set the owner of a file:


    ```bash

    $ chown username somedir

    ```


    Note that after giving this command, only the owner of the directory will change.
    The owner of the files inside of the directory won''t change.


    In order to set the ownership of a directory and all the files in that directory,
    you''ll need the `-R` option:


    ```bash

    $ chown -R username somedir

    ```


    Here, `R` stands for recursive because this command will recursively change the
    ownership of directories and their contents. After issuing this example command,
    the user `username` will be the owner of the directory `somedir`, as well as every
    file in that directory.


    If:


    ```

    $ chown -v username somefile

    ```

    changed ownership of ''somefile'' to username


    Here, `v` stands for verbose. If you use the `-v` option, `chown` will list what
    it did (or didn''t do) to the file.


    The verbose mode is especially useful if you change the ownership of several files
    at once. For example, this could happen when you do it recursively:


    ```bash

    $ chown -Rv username somedir

    ```


    changed ownership of ''somedir/'' to username


    changed ownership of ''somedir/bluefile'' to username


    changed ownership of ''somedir/redfile'' to username

