- fmt: '

    - `Tab`: Autocomplete commands and file names. Type the first letter(s) of a command,
    directory or file name, press `Tab` and the rest is completed automatically. If
    there are more commands starting with the same letters, the shell completes as
    much as it can and beeps. If you then press `Tab` again, it shows you all the
    alternatives.


    This shortcut is really helpful and saves a lot of typing. It even works at the
    `lilo` prompt and in some X applications.


    - `Ctrl + u`: Erases the current line.

    - `Ctrl + k`: Deletes the line from the position of the cursor to the end of the
    line.

    - `Ctrl + w`: Deletes the word before the cursor.


    ### COMMAND LINE OUTPUT


    - `Shift + PageUp`: Scroll terminal output up.

    - `Shift + PageDown`: Scroll terminal output down.

    - `Ctrl + l`: The `clear` command clears all previously executed commands and
    their output from the current terminal.

    - `reset`: If you mess up your terminal, use the `reset` command. Note that you
    may not be able to see the command when you''re typing it.


    ### COMMAND LINE HISTORY


    - `history`: This gives you a list of the commands you previously executed when
    you type this command.

    - `ArrowUp` or `Ctrl + p`: Scroll up in the history and edit the previously executed
    commands.

    - `ArrowDown` or `Ctrl + n`: Scroll down in the history and edit the next commands.

    - `Ctrl + r`: This shortcut finds the last command that contained the letters
    you''re typing. For example, if you want to find out the last parameters you gave
    to the `cp` command, you''ll press `Ctrl + r` and type in `"cp"`.


    ### MISCELLANEOUS COMMAND LINE


    - `Ctrl + c`: Kills the current process.

    - `Ctrl + z`: This sends the current process to background. It is useful if you
    have a program running and you need the terminal for awhile but don''t want to
    exit the program completely. Type the command `fg` to get the process back.

    - `Ctrl + d`: Log out from the current terminal. If you use this in a terminal
    emulator under X, this usually shuts down the terminal emulator after logging
    you out.

    - `Ctrl + Alt + Del`: Reboot the system. You can change this behavior by editing
    `/etc/inittab` if you want the system to shut down instead of rebooting.


    ### Question 06: Same path for all the users


    Is there an easy procedure to get the same path for all the users?


    A: The most important settings are possible to set in the global shell initialization
    files for login shells: `/etc/csh.login` for `tcsh` and `/etc/profile` for `bash`.


    Exceptions that do not get the right path from these files are `rsh` commands,
    `ssh` commands, menu items from X window manager that do not explicitly start
    login shell, commands invoked from `inittab`, `cron` jobs, daemons jobs like magic
    filters started from `lprd`, `WWW CGI` scripts, and so on.


    If the path is set in `/etc/csh.cshrc`, the path is right even when `rsh` or `ssh`
    execute command in remote machine with account using `tcsh/csh`. However, it is
    not possible to set path if account uses `bash/sh`.


    It is possible to combine the path setting to one file, for example to a file
    `/etc/environment-common`. There we write:


    `${EXPORT}PATH${EQ}/bin:/usr/bin:/sbin:/usr/sbin:/usr/bin/X11:/usr/local/bin:/usr/games:.`


    This can be used from `/etc/csh.login` (for `tcsh` and `csh`):


    ```

    set EQ=" " set EXPORT="setenv " source /etc/environment-common

    ```


    And from `/etc/profile` (for `bash`, doesn''t work for ordinary `sh`):


    ```bash

    EQ=''='' EXPORT="export " . /etc/environment-common

    ```


    And from `/etc/environment` (for `XDM`):


    ```bash

    EQ="=" EXPORT="export " . /etc/environment-common

    ```


    This strategy works mostly but `ssh` will complain of the lines in `/etc/environment`
    (and defined environment variables `EQ` and `EXPORT`). And still, `rsh` commands
    executed with `bash` won''t get this path.


    ### Question 07: Recover root password


    How can I recover the root password on RH Linux AS?


    A: If you are using `Lilo`: Type at `lilo`: `linux 1` and it will let you in Single
    User Mode.


    If you are using `Grub`: Press `e` when `grub` menu shows. There is line which
    starts with `kernel`, then highlight that line and type `e` again and then put
    `-s` and press `escape` and press `b` to boot your System. This procedure will
    let you in Single User Mode.


    Change your password by `passwd` command.


    ### Question 08: Init


    What is initialization?


    A: The term `init` (short for "initialization") is the program on Unix and Unix-like
    systems which spawns all other processes. It runs as a daemon and typically has
    `PID 1`.


    The functionality diverged considerably between BSD and System V. `init` is the
    parent of all processes. Note that `init` path is fixed:


    `/usr/local/sbin:/sbin:/bin:/usr/sbin`


    All programs started from `/etc/inittab` have: `/etc/init.d`.


    The `init` path does not contain `/etc/init`. The `init` path is fixed:


    `/usr/local/sbin:/sbin:/bin:/usr/sbin`


    The `init` path does not contain `/etc/init`. The `init` path is fixed:


    `/usr/local/sbin:/sbin:/bin:/usr/sbin`


    ### Question 09: Change user ID


    How do I change user?


    A: Command `su` sets a new user ID to use. If no user ID is given, root is used.


    Usually, `su` invokes a subshell with a different user ID. With argument `-` (more
    recent `--login`) `su` invokes shell like login. However, it does not use login
    program to do this but uses built-in path.


    For:

    normal users: `/usr/local/bin:/usr/bin:/bin:/usr/bin/X11`

    root user: `/sbin:/bin:/usr/sbin:/usr/bin`


    There is a group of commands that make use of super commands safer. They allow
    better logging, user-based restrictions and usage of individual passwords. The
    most widely used is `sudo`:


    ```bash

    sudo env

    ```


    This command modifies the search path so that the current directory is always
    the last one but does not modify `PATH` environment variable. `sudo env` and `env`
    give the same value for `PATH` variable. `sudo` just adds a couple of environment
    variables like `SUDO_USER`.


    ### Question 10: Head and Tail


    How does head and tail function?


    A: These two commands display the n first/last lines of a file respectively. To
    see the last ten commands entered:


    ```bash

    tail -10 .bash_history

    locate configure | grep bin

    man bash

    cd

    xawtv &

    grep usable /usr/share/dict/words

    grep advisable /usr/share/dict/words

    info quota

    ```


    The command `head` works similarly. The `tail` command has a handy feature to
    continuously show the last n lines of a file that changes all the time.


