    Assume that the `cat` command concatenates a file named `sound.wav` and the results
    are sent to a device called `/dev/audio`. The above command plays the file `sound.wav`
    if your sound is properly configured.


    ### Standard Input


    Many commands accept input from standard input, or `stdin` for short. By default,
    standard input reads information from your keyboard and just like standard output,
    it can be redirected. To give you a clear idea, we can use a little program called
    `tac` when experimenting. This program reads standard input and then displays
    it to you with all the lines reversed. See how `tac` works when it reads the input
    from your keyboard. Give the command `tac` and type a few lines of text, using
    `Enter` for starting new lines. Then press `Ctrl+D` when you''re done, `tac` then
    displays the text with all the lines reversed.


    ```

    me@puter: ~$ tac

    gorgeous me

    also you

    also you

    gorgeous me

    me@puter: ~$

    ```


    You can redirect the input so that `tac` gets it from a file instead of the keyboard.
    You can do it with the `<` character, like this:


    ```

    $ tac < list_abc.txt

    ```


    The above reads the input from a file called `list_abc.txt` and sends the results
    to standard output. Since the output isn''t redirected anywhere, it will be displayed
    on your screen where you see the lines of `list_abc.txt` in reverse order.


    You can also redirect both a command''s input and output:


    ```bash

    $ tac < list_abc.txt > list_cba.txt

    ```


    The above does the same thing as the previous command, only this time the results
    aren''t displayed on your screen. Since the output is redirected, the results
    are written to a file called `list_cba.txt` which then contains the same lines
    as `list_abc.txt` but in the reverse order.


    ### Question 14: Pipes


    Can I take the output of one program and send it as the input of another one?


    A: Yes and it is called piping. Pipes let you use the output of a program as the
    input of another one. For example, a simple pipe with `sed`:


    ```bash

    ls -l | sed -e "s/[aeio]/u/g"

    ```


    What happens here is that the command `ls -l` is executed and it''s output. Instead
    of being printed, it is sent or piped to the `sed` program which in turn prints
    what it has to.


    You can use pipes with many commands and one of the most commonly used is `grep`.
    It is a program that examines every line of the standard input it gets and searches
    for a specified pattern of characters. Then it sends to standard output every
    line that contains those characters.


    Assume we have a text file called `list.txt` and we want to find out what lines
    of it contain the word "peace". It can be done easily with pipes. List the contents
    of the file `list.txt` and send the results to `grep`, which in turn filters all
    lines containing the desired word "peace" and displays those lines on your screen:


    ```bash

    $ cat list.txt | grep peace

    ```


    Like many Linux commands, `grep` is case sensitive. This means that the above
    matches only "peace", not "Peace" or "PEACE". With the `-i` option, the search
    is case insensitive:


    ```bash

    $ cat applist.txt | grep -i desktop

    ```


    A pipe is a very useful feature. Once you get more familiar with the CLI and learn
    more commands then you''ll start to appreciate this feature each time you use
    it.


    ### Question 15: Command substitution


    What is a command substitution? How does it function?


    A: Command substitution is basically another way to do a pipe. You can use pipes
    and command substitution interchangeably. Command substitution can be done in
    two distinct ways.


    Simply type: `command_1 `command_2 -options``


    This will execute `command_2` and its output will become the input to `command_1`.


    The back-quote key is usually located at the same place as the tilde, above the
    `Tab` key.


    Or type: `command_1 $(command_2)`


    This will execute `command_2` and its output will become the input to `command_1`.


    You can of course use pipes to perform the same thing. For example, instead of
    doing:


    ```bash

    less $cat file1.txt file2.txt

    ```


    Do:

    ```bash

    cat file1.txt file2.txt | less

    ```


    This way, you will end up with exactly the same result.


    ### Question 16: Top command


    How important is it for an administrator to monitor the performance of their system?


    A: One of the most important responsibilities a system administrator is to monitor
    their systems. If system resources become too low, it can cause a lot of problems.
    System resources can be taken up by individual users or by services your system
    may host such as email or web pages. The ability to know what is happening can
    help determine whether system upgrades are needed or if some services need to
    be moved to another machine.


    The most common of these commands is `top`. The `top` command provides an ongoing
    look at activity, displays a listing of the most-intensive tasks and can be better
    configured than the standard `ps` suite. You can modify `top` while it is running.
    Hitting `I` will no longer display idle processes. Hitting `M` will sort by memory
    usage, `S` will sort by how long processes have been running and `P` will sort
    by CPU usage.


    In addition to viewing options, you can modify processes from within `top`. You
    can use `u` to view processes owned by a specific user, `k` to kill processes
    and `r` to remise them.


    For more in-depth information about processes you can look in the `/proc` file
    system. In the `/proc` file system you will find a series of sub-directories with
    numeric names. These directories are associated with the processes and contain
    files with information about the process.


    ### Question 17: vi editor


    Why should I opt to use vi editor?


    A: Despite its age, `vi` is still an important tool today. This is demonstrated
    by the fact that every UNIX and Linux distribution released over the last twenty
    years is likely to have a copy installed by default. Since the original release
    of `vi`, many derivatives have been written (such as `vim`, `vile`, and `elvis`),
    with usability and functionality added along the way. Because of this, `vi` is
    probably one of the most evolved and stable text editors in the world.


    Many of the more recent vi clones are also intelligent enough to know the type
    of document you are editing and will help you out by automatically indenting your
    text (in the case of HTML or C, for example) or by highlighting the syntax to
    make your work much clearer. In the great Unix tradition, features that bug you
    or help you can be turned on and off at your preference, and spending a few minutes
    customizing `vi` to your liking can save you hours of work in the long run.


    The `vi` editor is a very powerful tool and has a very extensive built-in manual,
    which you can activate using the `help` command when the program is started. What
    makes `vi` confusing to the beginner is that it can operate in two modes: command
    mode and insert mode. The editor always starts in command mode. Commands move
    you through the text, search, replace, mark blocks and perform other editing tasks
    and some of them switch the editor to insert mode. This means that each key has
    not one but likely two meanings: it can either represent a command for the editor
    in command mode or a character that you want in a text when in insert mode.

