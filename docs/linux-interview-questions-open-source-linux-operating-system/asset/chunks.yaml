    # ps command


    A: The `ps` command will provide you a list of processes currently running. Use
    the `ps –ef` command and you will be able to see exactly what is running on your
    system and kill run-away processes or those that are causing problems.


    Another use of the `ps` command is to see what users are currently doing. Use
    `ps –u user` (e.g. `jim`) will give you a sample output of:


    ```bash

    user@server:~> ps -u jim


    20876 pts/100:00:00 bash

    20904 pts/200:00:00 bash

    20951 pts/200:00:00 ssh

    21012 pts/100:00:00 ps

    ```


    From this we can see that the user is doing `ps ssh`.


    ## COMMAND-LINE OPTIONS


    This version of `ps` accepts several kinds of options.


    - Unix98 options may be grouped and must be preceeded by a dash `-`.

    - BSD options may be grouped and must not be used with a dash `-`.

    - GNU long options are preceeded by two dashes `--`.

    - Options of different types may be freely mixed.


    Set the `I_WANT_A_BROKEN_PS` environment variable to force BSD syntax even when
    options are preceeded by a dash. The `PS_PERSONALITY` environment variable (described
    below) provides more detailed control of `ps` behavior.


    ## SIMPLE PROCESS SELECTION


    | Switch | Description |

    | :--- | :--- |

    | `-A` | select all processes |

    | `-N` | negate selection |

    | `-a` | select all with a tty except session leaders |

    | `-d` | select all, but omit session leaders |

    | `-e` | select all processes |

    | `-T` | select all processes on this terminal |

    | `-a` | select all processes on a terminal, including those of other users |

    | `-g` | really all, even group leaders (does nothing w/o SunOS settings) |

    | `-r` | restrict output to running processes |

    | `-x` | select processes without controlling ttys |

    | `--deselect` | negate selection |


    ## PROCESS SELECTION BY LIST


    | Switch | Description |

    | :--- | :--- |

    | `-C` | select by command name |

    | `-G` | select by RGID (supports names) |

    | `-U` | select by RUID (supports names) |

    | `-g` | select by session leader OR by group name |

    | `-p` | select by PID |

    | `-s` | select processes belonging to the sessions given |

    | `-t` | select by tty |

    | `-u` | select by effective user ID (supports names) |

    | `-U` | select processes for specified users |

    | `-p` | select by process ID |

    | `-t` | select by tty |

    | `--group` | select by real group name or ID |

    | `--User` | select by real user name or ID |

    | `--group` | select by effective group name or ID |

