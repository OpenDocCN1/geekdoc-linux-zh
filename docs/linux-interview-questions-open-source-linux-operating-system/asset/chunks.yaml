  raw: 'That will be a default path for normal and root users respectively. It is
    very important that /usr/bin/X11 is available for X users. If X user logs in to
    another machine to start and X client application, he should get /usr/bin/X11
    to his path even he don''t seem to come directly from X terminal. After running
    Xstartup the XDM runs /etc/X11/Xsession that is run as the final user. Local configuration
    is meant to be done in /etc/environment that is sourced (included) from Xsession
    if available (Xsession is run with /bin/sh and thus /etc/environment must be sh
    file). This clashes with ssh that supposes that /etc/environment is a file that
    contains just lines of form VAR=VALUE.


