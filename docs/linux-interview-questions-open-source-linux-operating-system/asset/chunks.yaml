- fmt: '

    The next step is to guess the appropriate protocol type for the mouse. The X server
    may be able to select a protocol type for the given mouse automatically in some
    cases. Otherwise, the user has to choose one manually. Follow the guidelines below.


    ### Bus mouse

    The bus and `InPort` mice always use `BusMouse` protocol regardless of the brand
    of the mouse. Some OS may allow you to specify `Auto` as the protocol type for
    the bus mouse.


    ### PS/2 mouse

    The `PS/2` protocol should always be tried first for the `PS/2` mouse regardless
    of the brand of the mouse. Any `PS/2` mouse should work with this protocol type,
    although wheels and other additional features are unavailable in the X server.


    After verifying the mouse works with this protocol, you may choose to specify
    one of `xxxPS/2` protocols so that extra features are made available in the X
    server. However, support for these PS/2 mice assumes certain behavior of the underlying
    OS and may not always work as expected. Support for some PS/2 mouse models may
    be disabled all together for some OS platforms for this reason. Some OS may allow
    you to specify `Auto` as the protocol type for the PS/2 mouse and the X server
    will automatically adjust it.


    ### Serial mouse

    The XFree86 server supports a wide range of mice, both old and new. If your mouse
    is of a relatively new model, it may conform to the PnP COM device specification
    and the X server may be able to detect an appropriate protocol type for the mouse
    automatically. Specify `Auto` as the protocol type and start the X server. If
    the mouse is not a PnP mouse, or the X server cannot determine a suitable protocol
    type, the server will print the following error message and abort.


    ```

    <mousename>: cannot determine the mouse protocol

    ```


    If the X server generates the above error message, you need to manually specify
    a protocol type for your mouse. Choose one from the following list:


    * GlidePoint

    * IntelliMouse

    * Logitech

    * Microsoft

    * MMHittab

    * MMSeries

    * MouseMan

    * MouseSystems

    * ThinkingMouse


    **When you choose, observe the following rules:**


    * `Logitech` protocol is for old serial mouse models from Logitech. Modern Logitech
    mice use either `MouseMan` or `Microsoft` protocol.

    * Most 2-button serial mice support the `Microsoft` protocol.

    * 3-button serial mice may work with the `Mousesystems` protocol. If it doesn''t,
    it may work instead with the `Microsoft` protocol although the third (middle)
    button won''t function. 3-button serial mice may also work with the `Mouseman`
    protocol under which the third button may function as expected.

    * 3-button serial mice may have a small switch at the bottom of the mouse to choose
    between `MS` and `PC`, or `2` and `3`. `MS` or `2` usually mean the `Microsoft`
    protocol. `PC` or `3` will choose the `MouseSystems` protocol.

    * If the serial mouse has a roller or a wheel, it may be compatible with the `IntelliMouse`
    protocol.

    * If the serial mouse has a roller or a wheel and it doesn''t work with the `IntelliMouse`
    protocol, you have to use it as a regular 2- or 3-button serial mouse.

    * If the `Auto` protocol is specified and the mouse seems working, but you find
    that not all features of the mouse is available, that is because the X server
    does not have native support for that model of mouse and is using a `compatible`
    protocol according to PnP information.


    ### USB mouse

    If your mouse is connected to the USB port, it can either be supported by the
    `Auto` protocol, or by an OS-specific protocol (see below), or as a generic Human
    Interface Device by the `usb` protocol.


    ### Standardized protocols

    Mouse device drivers in your OS may use the standardized protocol regardless of
    the model or the class of the mouse. For example, SVR4 systems may support `Xqueue`
    protocol. In FreeBSD, the system mouse device `/dev/sysmouse` uses the `SysMouse`
    protocol.


    ### Question 102: X server configuration

    How can you change X server configuration?


    **A:** You can change X server configuration through the following steps.


    1. Linux operating system uses a Graphical User Interface (GUI) called `XFree`,
    just because it is a free version of X windows system, which was developed by
    X.org website members, also getting some IBM contributions. Today, X server configuration
    is totally automatic, so in the end of your new Linux system installation, if
    you are lucky, you can reboot, without having anything to do. Nevertheless, often
    it happens that, in spite of an installation of a lot of packages, it display
    a message saying that you are not able to start X server. The reason why this
    happens is that your monitor, or your graphic card, is not rightly detected. So
    you have only to update the whole installation, until to the Summary. Here, you
    can change your graphical interface settings but when ask, disable the automatic
    starting Option for X server after the reboot. This allows using your PC in text
    mode, so if you want to start X server, you have manually to run `startx` command.


    2. If X server doesn''t work yet, try with:


    #### XFdrake

    It allows changing current settings with minimal ones:

    * Monitor: SVGA (not interlaced) 1024 x 768

    * Frequency: 60 Hz

    * Graphic card: VGA standard

    * Resolution: 640 x 480

    * Colors dept.:8 bpp


    You can increase these values, by degrees, but without over clocking frequency.
    It may damage your monitor. When you are ready, run `Xfdrake` again and select
    to start Xfree upon booting.


    ### Question 103: X Fonts

    How do I make fonts available to X?


    **A:** There are a number of ways fonts can be added to X. Firstly, XFree86 has
    a font path which is just a list of several directories or font servers where
    it searches for fonts. A font server is just a background process that makes fonts
    available to X. An advantage of font servers is that they can send fonts to remote
    displays.


    Recently, `xfs` (X font server) has been patched to support TrueType and run as
    a stand-alone program. The patched version ships with RedHat and RedHat-based
    distributions, and is included in XFree86 4.0 and newer. `xfs` is actually the
    standard font server that comes with XFree86\. Its source code is part of the
    XFree86 source tree. However, distributions have recently been shipping a version
    that runs in stand-alone mode. The stand-alone X font server, with the TrueType
    support (the TrueType support takes place via a font server called `xfst`) is
    probably the nicest font management solution currently available. Its advantages
    include:

    * Support for different types of fonts, including Type 1, TrueType and bitmap.

    * Makes fonts available to remote displays.

    * Greatly simplifies editing the fontpath -- you can do it via the command line
    utility `chkfontpath`, as opposed to having to edit configuration files. This
    not only makes life easier for users, it makes packaging safer and more scriptable
    for packagers


    Because different distributions ship with different configurations, it is not
    true that one size fits all. We can split users up into three groups:


    * Your distribution ships with a stand-alone `xfs` and it has been patched to
    support TrueType. This group includes Redhat users and users of derivatives of
    Redhat such as Mandrake, and TurboLinux. Debian 3.0 will also include the patched
    xfs, currently in testing. For this group, the wisest strategy is to install both
    TrueType and Type 1 fonts through `xfs`.

    * Some distributions ship with a stand-alone `xfs` package, but no TrueType support.
    Note that XFree86 supports TrueType as of version 4.0\. This includes Debian stable
    ("potato"). For these users, the best thing to do is use `xfs` to install Type
    1 fonts, and install TrueType fonts via `xfstt`. Debian users can seek out the
    TrueType Fonts in Debian mini-HOWTO for information about installing TrueType
    fonts in Debian.

    '
