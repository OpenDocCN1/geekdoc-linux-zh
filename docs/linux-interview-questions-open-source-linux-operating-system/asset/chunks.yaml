- fmt: '

    When we installed `MS Windows` after Linux installation, it is more than probable
    that `Windows` had already overwritten default boot manager. In that case, we
    have to recover boot manager in a way allowing us to normally boot both systems.


    There are few possibilities available to be able to cope with that problem. One
    of the easiest ways is to insert a LiveCD of our distribution into CD or DVD drive
    and then mount root partition of our Linux system using `chroot` tool, changing
    for root directory of our distribution. If we assume that our Linux system is
    installed on `hda5` partition and file system is `reiserfs` then we should issue
    a sequence of following commands:


    ```bash

    cd /tmp

    mkdir our_root_dir

    mount -t reiserfs /dev/hda5 our_root_dir

    chroot our_root_dir

    ```


    Now, we can act the same way as if we were logged in into our Linux system. The
    final step is to install boot manager, which was wiped out by `MS Windows`. Should
    you decide to make it our next step, follow the steps below accordingly to the
    boot manager that we have installed - `grub` or `lilo`:


    ```bash

    update-grub

    or

    lilo -v

    ```


    ## Question 60: Preparation


    How do I prepare for installation?


    A: Linux makes more effective use of PC hardware than `MS-DOS`, `Windows` or `NT`,
    and is accordingly less tolerant of mis-configured hardware. There are few things
    you should do before you start so as to lessen your chances of being stopped by
    this kind of problem.


    First step is to collect any manuals you have on your hardware; motherboard, video
    card, monitor, modem, etc., and have them within your reach.


    Next step is to gather detailed information on your hardware configuration. One
    easy way to do this, if you''re running `MS-DOS` 5.0, or up, is to print a report
    from the Microsoft diagnostic utility `msd.exe` (you can leave out the `TSR`,
    `driver`, `memory-map`, `environment-strings` and `OS-version` parts). This will
    guarantee you full and correct information on your video card and mouse type which
    will be helpful in configuring `X` later on.


    Third, check your machine for configuration problems with supported hardware that
    could cause an un-recoverable lockup during Linux installation.


    It is possible for a `DOS/Windows` system using IDE hard drive(s) and CD ROM to
    be functional even with the master/slave jumpers on the drives incorrectly set.
    Linux won''t fly this way. If in doubt, check your master-slave jumpers.


    If any of your peripheral hardware is designed with neither configuration jumpers
    nor non-volatile configuration memory, then it may require boot-time initialization
    via an `MS-DOS` utility to start up, and may not be easily accessible from Linux.
    CD-ROMs, sound cards, Ethernet cards and low-end tape drives can have this problem.
    If so, you may be able to work around this with an argument to the boot prompt;
    Google over `Linux` for details.


    Some other operating systems will allow a bus mouse to share an `IRQ` with other
    devices. Linux doesn''t support this, trying it may lock up your machine. I suggest
    for you to have thorough information on the bus mouse you are going to use.


    ## Question 61: Linux Installation on Windows using Fips or Loadlin


    How can I install Linux on a Windows partition as a disk image?


    A: It is now possible to install Linux on a Windows partition as a disk image
    with what is known as the loopback filesystem. `Red Hat` and `Mandrake` offer
    this but it''s an extremely bad idea because of the way `Windows` handles files.
    Defragging the system will become a nightmare and Linux itself will crawl and
    it will ruin both your `Windows` and Linux experience. The same applies to the
    `Umsdos` filesystem though Linux won''t crawl and it''s best to install Linux
    on a partition of its own. It is presumed that:


    - You are using `Windows 98` or higher.

    - You are familiar with computers, at least know how to boot the system using
    the floppy or CD ROM drive.

    - You know your way around `DOS` and `Windows`.

    - You know what a partition is and want to install Linux on a partition of its
    own.

    - You have a large hard disk – upward of 8.4GB – which currently holds `Windows`
    and on which you intend to install Linux (even those who with smaller disks can
    read on).


    The first thing to do is to make space for Linux as you don’t want to get stuck
    with a huge single partition with Windows on it. This would be your `C` drive.
    You have to make a separate partition for Linux out of this space (which would
    then be labeled as `D`). You can either use `Windows Fdisk` which really is not
    a good idea as it would entail losing all your data and making new partitions
    from scratch, one for Windows and one for Linux, or you can take the easier and
    far more convenient way out and use a free and excellent non-destructive partitioning
    utility called `Fips`. What makes `Fips` special is its ability to create a new
    partition out of the free space in your `C` partition without any loss of data.
    The latest version of `Fips` (2.0) is available at its homepage and most Linux
    distributions carry it under the `/dostools` or `/dosutils` directory in the primary
    cd.


    We are going to concentrate on using `Fips` so if you are going to use `Windows
    Fdisk`, which actually is totally unnecessary unless you just bought a new system
    and even then it''s a better idea to make a single partition with `Windows Fdisk`,
    install Windows on it and then use `Fips` to split it for reasons that will be
    explained.


    A hard disk can have a maximum of 4 primary partitions. Apart from primary partitions
    a hard disk can also have what is known as an extended partition which in turn
    can hold a number of logical partitions. The extended partitions are not real
    partitions like primary or logical partitions in that they don''t store data but
    are actually containers for logical partitions which is where data is actually
    stored. Thus in Windows, `C:` is a primary partition and if you used `Windows
    Fdisk` (Windows Fdisk will not make more than one primary partition to partition
    your hard disk) and `D:` is usually the first logical partition of the extended
    partition. `E:` would be the second logical partition and so on. In Linux things
    are slightly different. The first primary partition is called `/dev/hda1`, the
    second primary partition `/dev/hda2` up to the fourth which is `/dev/hda4`. Linux
    refers to an extended partition as in the case of a disk with 1 primary and one
    extended partition as `/dev/hda1` for the primary and `/dev/hda2` for the extended.
    The logical partitions of the extended partitions are referred to as `/dev/hda5`,
    `/dev/hda6` and so on. The second hard disk would be referred to as `/dev/hdb`,
    the third `/dev/hdc` (usually the cdrom drive if set as secondary master) and
    the fourth and last hard disk as `/dev/hdd` (last because the motherboard has
    place for a maximum of 4 IDE devices). SCSI devices are referred to as `/dev/sda`.


    `Fips` makes a new primary partition out of the free space in your hard disk.
    This is an inherently dangerous operation and it''s a good idea to back up all
    your important data if something go wrong. `Fips` has been largely successful
    unless there is something already wrong with your hard disk.

