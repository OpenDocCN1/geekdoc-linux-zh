    一次运行多达 `max-procs` 个进程；默认值为 `1`。如果 `max-procs` 为 `0`，则 `xargs` 将尽可能运行数量的进程。使用
    `-P` 时请配合 `-n` 选项；否则可能只会执行一次 `exec`。


    `xargs` 经常与 Unix 命令 `find`、`locate` 和 `grep` 配合使用。


    例如：


    1. `find . -name "*.foo" | xargs grep bar`


    在实践中的效果与 `grep bar` 相同：

    ```bash

    find . -name "*.foo"

    ```

    即使要搜索的文件多到无法全部放入单条命令行，该方法依然有效。它会在当前目录及其子目录下所有以 `.foo` 结尾的文件中搜索字符串 `bar` 的出现情况。


    2. `find . -name "*.foo" -print0 | xargs -0 grep bar`


    此的作用相同，但使用了 `find` 和 `xargs` 的 GNU 特有扩展，使用空字符（null character）来分隔文件名；即使文件名包含空白字符（包括换行符），这种方法也有效。


    ## 问题 24: SED


    什么是 SED？它是如何使用的？


    答：流 编辑器（`sed`）是一种简单且强大的计算机程序，用于对顺序文本数据流应用各种预设的文本转换。它逐行读取输入文件，根据其简单语言（sed 脚本）中指定的规则编辑每行，然后输出该行。


    `sed` 通常被认为是一种非交互式文本编辑器。它与传统文本编辑器的区别在于，对两个输入的处理方式是反转的。传统编辑器是循环遍历一次编辑命令列表，并将每个命令应用到内存中的整个文本文件，而
    `sed` 是遍历一次文本文件，并将整个编辑命令列表应用到每一行。由于内存中一次只有一行，`sed` 可以处理具有任意行数的文本文件。某些 `sed` 的实现只能处理长度有限的行。


    大多数人首次使用 `sed` 是为了它的替换功能。`sed` 经常被用作查找和替换工具。


    ```bash

    sed ''s/Wayne/Nico/g'' oldfile >newfile

    ```

    它会将文件中出现的每一个 "Wayne" 替换为单词 "Nico"。“查找”部分是一个正则表达式（"RE"），它可以是一个简单的单词，也可以包含特殊字符以提供更大的灵活性（例如，防止
    "Wayne" 也匹配到 "Wayneme"）。


    `sed` 可用于在文件的左侧添加 8 个空格，打印就不会从纸张的绝对左边缘开始。


    ```bash

    sed ''s/^/ /'' myfile >newfile # sed 脚本

    sed ''s/^/ /'' myfile | lp # 下一个 sed 脚本

    ```


    `sed` 可以只显示文件的一段，从 "once upon a time" 开始，到 "happily ever after" 结束。脚本看起来如下：


    ```bash

    sed -n ''/once upon a time/,/happily ever after/p'' myfile

    ```

    `Sed` 的正常行为是打印（即在屏幕上显示）整个文件，包括未更改的部分，除非你使用 `-n` 开关。`"-n"` 表示“不输出（no output）”。该开关几乎总是与某处的
    `''p''` 命令配合使用，表示只打印文件中指定的章节。`-n` 开关配合 `''p''` 命令允许打印文件的部分内容（即发送到控制台）。


    ## 问题 25: 作业控制 (Job Control)


    我想在后台执行一项耗长时间的任务，同时使用终端进行其他操作。是否可以选择性地停止或暂停某些进程的执行？


    答：大多数任务（列出目录、编辑文件等）都可以通过程序接管终端并在程序退出时将控制权还给 shell 来完成；然而，有时用户希望在使用终端进行其他操作的同时在后台执行耗长时间的任务。作业控制是一种为此而开发的机制。它允许用户在后台启动程序、将程序发送到后台、将后台程序调至前台，以及启动和停止运行中的程序。受作业控制机制影响下的程序被称为作业（jobs）。


    shell 将作业与每个管道关联。它维护了一个当前正在执行的作业表，可以通过 `jobs` 命令列出。当 `Bash` 异步启动一个作业时，它会打印如下的一行：


    ```

    [1] 12345

    ```

    因此，表示该作业是作业号 1，且该作业相关的管道中最后一个进程的进程 ID 为 `12345`。单个管道中的所有进程都是同一个作业的成员。`Bash` 使用作业抽象作为作业控制的基础。


    为了便于作业控制用户界面的实现，操作系统维护了当前终端进程组 ID 的概念。该进程组的成员（进程组 ID 等于当前终端进程组 ID 的进程）接收如 `SIGINT`
    等键盘生成的信号。这些进程被称为前台进程。后台进程是那些进程组 ID 与终端不同的进程；此类进程对键盘生成的信号产生免疫。只有前台进程允许从终端读取或写入终端。尝试从终端读取（写入）的后台进程将收到终端驱动程序发送的
    `SIGTTIN`（`SIGTOU`）信号，除非被捕获，否则进程将被暂停。


    '
- fmt: '

    If an attempt to exit `Bash` is made while jobs are stopped, the shell prints
    a message warning that there are stopped jobs. The `jobs` command may then be
    used to inspect their status. If a second attempt to exit is made without an intervening
    command, `Bash` does not print another warning, and the stopped jobs are terminated.


    ## Job Control Built-ins


    ### `bg`

    `bg [jobspec ...]`

    Resume each suspended job `jobspec` in the background, as if it had been started
    with `&`. If `jobspec` is not supplied, the current job is used. The return status
    is zero unless it is run when job control is not enabled, or, when run with job
    control enabled, any `jobspec` was not found or specifies a job that was started
    without job control.


    ### `fg`

    `fg [jobspec]`

    Resume the job `jobspec` in the foreground and make it the current job. If `jobspec`
    is not supplied, the current job is used. The return status is that of the command
    placed into the foreground, or non-zero if run when job control is disabled or,
    when run with job control enabled, `jobspec` does not specify a valid job or `jobspec`
    specifies a job that was started without job control.


    ### `jobs`

    `jobs [-lnprs] [jobspec]`

    `jobs -x command [arguments]`


    The first form lists the active jobs. The options have the following meanings:


    - `-l`: List process IDs in addition to the normal information.

    - `-n`: Display information only about jobs that have changed status since the
    user was last notified of their status.

    - `-p`: List only the process ID of the job''s process group leader.

    - `-r`: Restrict output to running jobs.

    - `-s`: Restrict output to stopped jobs.


    If `jobspec` is given, output is restricted to information about that job. If
    `jobspec` is not supplied, the status of all jobs is listed.


    If the `-x` option is supplied, `jobs` replaces any `jobspec` found in `command`
    or `arguments` with the corresponding process group ID and execute `command`,
    passing it `arguments`, returning its exit status.


    ### `kill`

    `kill [-s sigspec] [-n signum] [-sigspec] jobspec or pid`

    `kill -l [exit_status]`


    Send a signal specified by `sigspec` or `signum` to the process named by job specification
    `jobspec` or process ID `pid`. `sigspec` is either a case-insensitive signal name
    such as `SIGINT` (with or without the `SIG` prefix) or a signal number; `signum`
    is a signal number. If `sigspec` and `signum` are not present, `SIGTERM` is used.
    The `-l` option lists the signal names. If any arguments are supplied when `-l`
    is given, the names of the signals corresponding to the arguments are listed,
    and the return status is zero. `exit_status` is a number specifying a signal number
    or the exit status of a process terminated by a signal. The return status is zero
    if at least one signal was successfully sent, or non-zero if an error occurs or
    an invalid option is encountered.


    ### `wait`

    `wait [jobspec or pid ...]`

    Wait until the child process specified by each process ID `pid` or job specification
    `jobspec` exits and return the exit status of the last command waited for. If
    a job spec is given, all processes in the job are waited for. If no arguments
    are given, all currently active child processes are waited for, and the return
    status is zero. If neither `jobspec` nor `pid` specifies an active child process
    of the shell, the return status is 127.


    ### `disown`

    `disown [-ar] [jobspec]`

    Remove a job from the shell''s active list. If `jobspec` is given, only that job
    is removed. If `jobspec` is not supplied, all active jobs are removed. The jobs
    will continue to run, but the shell will not send signals to them upon exit.


    ### `suspend`

    `suspend [-f] [jobspec]`

    Suspend the execution of a job. If `jobspec` is given, only that job is suspended.
    If `jobspec` is not supplied, all currently running jobs are suspended.


    ---


    ## Important Questions


    If an attempt to exit `Bash` is made while jobs are stopped, the shell prints
    a message warning that there are stopped jobs. The `jobs` command may then be
    used to inspect their status. If a second attempt to exit is made without an intervening
    command, `Bash` does not print another warning, and the stopped jobs are terminated.


    How should I view manual pages?

    Almost every command on the system has a manual. If you want to know how to use
    it, just type `man` followed by the name of the command. For example, if you want
    more info about `ls`, just type: `man ls`


    The `man` pages are a reference for the commands. If you want more info about
    a command, you can use the `man` command for a quick answer. The `man` pages are
    for different programs. For example, if you want the manual page for a terminal
    emulator: `man xterm`


    Use the following keys for moving around in `man`:

    - `e`: Move forward line

    - `j`: Move backward line

    - `f`: Move forward page

    - `k`: Move backward page

    - `b`: Page down

    - `y`: Page up

    - `q`: Quit


    The `man` pages are usually technical and sometimes hard to understand. However,
    the man pages are very useful because they are always there, a command away. The
    more man pages you read, the more you start to understand them.


    Now, what if you need to do a specific task but don''t know what program to use?
    Every man page entry contains a short description of the program but the problem
    is that you don''t know what program to use. With the `apropos` command you can
    search those descriptions. You can use keywords to search both program names and
    their descriptions.


    Suppose you have a compressed gzip file and you want to uncompress it. You probably
    want to use a program whose description or name contains the word "gzip". You
    can use `apropos` for finding such a program:

    `apropos gzip`

    `gzip (1)` - compress or expand files

    `zforce (1)` - force a ''.gz'' extension on all gzip files


    Now when you look at the output of `apropos`, you probably see that `gzip` might
    be what you''re looking for. Now you know the command name, and can go read its
    man page: `man gzip`


    Although you can do very simple searches with apropos, it''s a very powerful tool
    and you can do advanced searches. For example, you can use the shell wildcards
    in your searches with the `-w` option. For more info about `apropos`, read its
    man page.


    While `apropos` searches for the descriptions in the man pages, `whatis` displays
    the description. It answers the question what is. Of course you can just take
    a look at the man page of a program to see what the purpose of it is, but if you''re
    only interested in knowing what the program does, you can just use the `whatis`
    command for a quick answer:

    `whatis apropos`

    `apropos (1)` - search the manual page names and descriptions

    `whatis man`

    `man (1)` - an interface to the on-line reference manuals

    `man (7)` - macros to format man pages

    `whatis whatis`

    `whatis (1)` - display manual page descriptions


    Read the manual page for the `man` command for more information about `whatis`.

