- fmt: "\n# Question 80: Remove directories\n\nI want to remove empty directories.\
    \ What is the best way to do this?\n\nA: There are two commands you can use for\
    \ removing directories. If the directory is empty, you can use `rmdir`:\n\n```bash\n\
    rmdir dir1\n```\n\nIf you want to remove a directory with all its contents, you\
    \ can use `rm` with the `-r` option. The `-r` option tells `rm` to remove a directory\
    \ recursively:\n\n```bash\nrm -r dir1\n```\n\nIt is best to use the `-i` option\
    \ when deleting a directory with its contents so that you'd be prompted before\
    \ each file in the directory.\n\n```bash\nrm -ir dir1\n```\n\n# Question 81: Copy\
    \ and move directories\n\nHow do I copy and move selected directories in Linux?\n\
    \nA: For copying and moving directories you can use the `cp` and `mv` commands\
    \ just like you use them with files. You've probably noticed that `cp` just complains\
    \ at you if you've already tried to copy a directory with `cp`. The `cp` command\
    \ wants you to use the `-r` option if you want to copy a directory with its contents.\
    \ The `-r` means \"copy recursively\":\n\n```bash\ncp -r dir1 dir2\n```\n\nThe\
    \ above creates a directory named `dir2` whose contents will be identical to `dir1`.\
    \ However, if `dir2` already exists, nothing will be overwritten: the directory\
    \ `dir1` will be copied into the `dir2` directory under the name `dir2/dir1`.\n\
    \nWhen renaming directories, use the `mv` command exactly the same way as with\
    \ files:\n\n```bash\nmv dir1 dir2\n```\n\nWhen dealing with directories, `mv`\
    \ works a bit like `cp` does. If `dir2` doesn't exist, the above will rename `dir1`\
    \ to `dir2`, but if `dir2` exists, the directory `dir1` will be moved into the\
    \ `dir2` directory under the name `dir2/dir1`.\n\n# Question 82: df command\n\n\
    What tool can I use to view disk usage?\n\nA: The primary tools for getting information\
    \ about files and file systems are all relatively simple and easy to use. `df`\
    \ (shows disk usage) will also show inode usage, `df –i` (inodes contain information\
    \ about files such as their location on the disk drive, and you can run out of\
    \ these before you run out of disk space if you have many small files. This results\
    \ in error messages of \"disk full\" when in fact `df` will show there is free\
    \ space (`df –i` however would show the inodes are all used). This is similar\
    \ to file allocation entries in Windows, with `vfat` it actually stores names\
    \ in `8.3` formats, using multiple entries for long filenames, with a maximum\
    \ of 512 entries per directory, to many long filenames, and the directory is 'full'.\n\
    \nSimply type in `df` and you'll be shown disk usage for all your mounted file\
    \ systems in 1K blocks. For example:\n\n```text\nuser@server:~> df\nFilesystem\
    \ 1K-blocks Used Available Use% Mounted on\n/dev/hda3 5242904 75969244832121 5%\
    \ /\ntmpfs 127876 8001 27868 1% /dev/shm\n/dev/hda1 127351 33047 8772928% /boot\n\
    /dev/hda9 10485816 33508 104523081%/home\n/dev/hda8 5242904 932468 431043618%\
    \ /srv\n/dev/hda7 3145816 32964311285222%/tmp\n/dev/hda5 5160416 474336 4423928\
    \ 10%/usr\n/dev/hda6 3145816412132 2733684 14% /var\n```\n\n# Question 83: fsck\
    \ command\n\nHow do I check and repair files for inconsistencies?\n\nA: The `fsck`\
    \ command (\"file system check\" or \"file system consistency check\") is a tool\
    \ for checking the consistency of a file system. The file system can become inconsistent\
    \ due to several reasons and the most common is abnormal shutdown due to hardware\
    \ failure, power failure or switching off the system without proper shutdown.\
    \ Due to these reasons, the super block in a file system is not updated and has\
    \ mismatched information relating to system data blocks, free blocks and inodes.\n\
    \nDue to these reasons, the super block in a file system is not updated and has\
    \ mismatched information relating to system data blocks, free blocks and inodes.\n\
    \n### Modes of operation\n`fsck` operates in two modes interactive and non-interactive:\n\
    \n- **interactive**: `fsck` examines the file system and stops at each error,\
    \ asking for user response whether to correct.\n- **Non-interactive**: `fsck`\
    \ tries to repair all errors found without waiting for user response.\n\n### Command\
    \ syntax\n```\nfsck [-F fstype] [-V] [-yY] [-o options] special\n```\n `-F fstype`:\
    \ type of file system to be repaired (e.g., `ufs`, `vxfs`)\n- `-V`: verify the\
    \ command syntax but do not run the command\n- `-y` or `-Y`: Run the command in\
    \ non interactive mode - repair all errors encountered.\n- `-o options`: Three\
    \ options can be specified with `-o`:\n    - `b=n`: where `n` is the number of\
    \ next super block if primary super block is corrupted.\n- `f`: forces the file\
    \ system check regardless of its clean flag.\n- `special`: Block or character\
    \ device name of the file system to be checked - for example `/dev/rdsk/c0t30s4`.\n\
    \n### Phases\n`fsck` checks the file system in a series of 5 phases and checks\
    \ a specific functionality of file system in each:\n1. **Phase 1**: Check Blocks\
    \ and Sizes\n2. **Phase 2**: Check Pathnames\n3. **Phase 3**: Check Connectivity\n\
    4. **Phase 4**: Check Reference Counts\n5. **Phase 5**: Check Cylinder Groups\n\
    \n### Error messages & corrective action\n1. **Corrupted superblock**: `fsck`\
    \ fails to run. If the superblock is corrupted the file system still can be repaired\
    \ using alternate superblock which are formed while making new file system. The\
    \ first alternate superblock number is 32 and others superblock numbers can be\
    \ found using the following command:\n```bash\nnewfs -N /dev/rdsk/c0t0d0s6\n```\n\
    For example, to run `fsck` using first alternate superblock following command\
    \ is used:\n```bash\nfsck -F ufs -o b=32 /dev/rdsk/c0t0d0s6\n```\n\n2. **Link\
    \ counter adjustment**: `fsck` finds mismatch between directory inode link counts\
    \ and actual directory links and prompts for adjustment in case of interactive\
    \ operation. Link count adjustments are considered to be a safe operation in a\
    \ file system and should be repaired by giving 'y' response to the `adjust?` prompt.\n"
