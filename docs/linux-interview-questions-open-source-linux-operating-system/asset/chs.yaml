- "# Linux 面试题：开源 Linux 操作系统面试题、答案与解析\n\n\n\n![cover](img/cover.jpg)\n\n\n\n\n# 问题\
  \ 104：XDM\n# 致谢\n\n## 引言\n\nLinux 是 `UNIX` 操作系统的一种形式。虽然最初 `UNIX` 主要由工程师和科学家使用，普通大众并不熟悉，但你今天在计算机系统中认为理所当然的很多东西都始于\
  \ `UNIX`。一个著名的例子是互联网，第一个在核心实现 `TCP/IP` 协议的大型操作系统是 `UNIX`，这导致了该协议的广泛接受。20 世纪 90 年代初，计算机科学学生\
  \ Linus Torvalds 决定编写自己版本的 `UNIX`，他将其命名为 Linux。当时已经有了其他“自产”的 `UNIX` 版本，例如 `MINIX`，但\
  \ Linux 的独特之处在于全球参与的规模。Torvalds 天真地在网上发了一条信息询问是否有人愿意帮助，结果收到了雪崩般的响应。Linux 如今成为主流有几个原因：首先，它被认为是一个非常可靠、稳定的操作系统，结果是\
  \ Linux 已成为大型企业服务器的主要平台。另一个原因是它以及在其他地方开发的软件是免费的。许多公司发现，由于这个原因以及维护成本的降低，在他们的 PC 上运行\
  \ Linux 更加廉价。Linux 在历史上主要用作服务器操作系统，但其低成本、灵活性和 `UNIX` 背景使其适用于广泛的应用。Linux 是“LAMP”服务器软件组合（`Linux`、`Apache`、`MySQL`、`Perl/PHP/Python`）的基石，该组合在开发者中广受欢迎，并且是网站托管最常见的平台之一。\n\
  \n由于其低成本和高可配置性，Linux 常用于嵌入式系统，如电视顶顶盒、手机和手持设备。Linux 已成为许多手机中使用的专有 `Symbian OS` 的主要竞争对手，它是主导性的\
  \ `Windows CE` 和 `Palm OS` 操作系统的替代方案。流行的 `TiVo` 数字视频录制机使用了自定义版本的 Linux。包括几款来自 `Linksys`\
  \ 的产品在内的多个网络防火墙和路由器内部使用 Linux，利用其先进的防火墙和路由功能。Linux 作为超级计算机操作系统日益常见。在 2005 年 11 月的\
  \ `TOP500` 超级计算机列表中，世界上最快的两个超级计算机运行的是 Linux。在 500 个系统中，371 个（74.2%）运行着某些版本的 Linux，其中包括前十名集群中的七个。Linux\
  \ 机器集群被用于制作《泰坦尼克号》、《史瑞克》等电影。在邮政局，它们是路由邮件的神经中枢；在大型搜索引擎集群中，它们被用于执行互联网搜索。这些只是 Linux\
  \ 全范围内每天执行的成千上万项重型任务中的几个。计划于 2006 年 11 月发布的 Sony PlayStation 3 游戏机将默认运行 Linux。索尼此前为他们的\
  \ PlayStation 2 游戏机发布过一个 `PS2 Linux` DIY 制作套件。像 `Atari` 和 `id Software` 这样的游戏开发者已为\
  \ Linux 桌面发布了作品。`Linux Game Publishing` 也为 Linux 制作游戏，并从他们的 `Windows` 源代码进行许可和移植。“每个孩子一台电脑”项目旨在为发展中国家的所有儿童提供计算设备，该项目使用\
  \ Linux 作为设备的操作系统。值得注意的是，现代 Linux 不仅运行在工作站、中高级服务器上，还运行在如 `PDA's`、手机、大量的嵌入式应用，甚至在实验性手表上。这使得\
  \ Linux 成为世界上唯一覆盖如此广泛硬件的操作系统。\n\nLinux 是一个开源操作系统，它的“免费”是指“自由（freedom）”，源代码可供任何人查看、分发、使用和编辑。每个人都允许根据自己的需要编辑程序，或将其送给他人。这与\
  \ Windows 形成对比，在 Windows 中，源代码只能由微软员工和签署了保密协议的人编辑。Linux 倡导者声称，他们的开放性意味着代码可以被许多人审查，他们可以提交\
  \ 修复程序或新功能。最初，需要一台运行 `Minix` 的计算机来配置和安装 Linux。Linux 的初始版本还需要另一个操作系统存在，以便从硬盘启动，但很快出现了诸如\
  \ `LILO` 的独立引导加载器。Linux 系统在功能上迅速超越了 `Minix`；Torvalds 和其他 Linux 内核开发者将他们的工作适配到 GNU\
  \ 组件和用户空间程序，创建了一个完整、功能完备且免费的操作系统。今天，Torvalds 继续指导内核的开发，而其他子系统如 GNU 组件继续独立开发（Linux\
  \ 内核开发不是 GNU 项目的一部分）。其他小组和公司以 Linux 发行版的形式将这些组件与其他软件结合并分发。Linux 主要作为 Linux 发行版（通常称为“distro”）的一部分使用。这些由个人、松散的团队以及商业和志愿者组织编译。它们通常包含额外的系统和应用软件、一个便于初始系统设置的安装系统，以及软件安装和升级的集成管理。发行版的创建出于许多不同的目的，包括计算机架构支持、特定区域或语言的本地化、实时应用和嵌入式系统，许多版本还刻意只包含免费软件。目前有三百多个发行版正在活跃开发，其中十几个发行版在通用用途上最受欢迎。\n\
  \n\n\n\n\n如所述，Linux 正在成为最“热门”软件系统之一。几乎所有主要公司——IBM、HP、Sun 微型系统等——都在推广它，并且 Linux 已成为企业\
  \ Web 服务器的首选。Linux 是目前被最广泛使用的操作系统。\n\n由于其具有高可靠性、较低的病毒等程序感染率以及低廉的成本，Linux 也开始进入大型桌面市场，例如企业、学校等。\n\
  \nLinux 社区是共享的。这意味着在线的人们更愿意为你提供帮助，而且有更多的开源软件可供。如果你是一名大学计算机科学专业的学生，还有一些非常重要的额外优势：\n\
  \n许多计算机科学课程专门使用 UNIX，因此它们的工作无法在 Windows 平台上完成。由于它是一个完整的 UNIX 系统，Linux 允许学生在舒适的家里完成作业。\n\
  \n在安装和使用 Linux 的过程中，学生可以学习到许多在课程中无法学到的计算机实用知识。这种实践经验也可以在工作面试中帮助你，无论是毕业后的正式工作，还是大学期间的暑期工作和实习。。即使你面试的工作不涉及\
  \ UNIX，如果你能讨论例如你为使用和自定义 Linux 系统所做的各种尝试，你也绝对会给面试官留下深刻印象。\n\n# 第一章：Linux 基础\n\n##\
  \ 问题 01：Shell（壳）\n\n什么是 Shell？\n\n答：Shell 最好的描述是用来与计算机通信的语言。大多数用户使用桌面的点点击式语言进行操作，但在这种语言中是由计算机引导对话的。用户扮演的是被动角色，从计算机提供的选项中选择任务。对于程序员来说，要在图形用户界面（GUI）格式中包含命令的所有选项和可能的用途是非常困难的。因此，GUI\
  \ 的能力通常低于后端的命令或命令。\n\nShell 是一种与系统通信的高级方式，因为它允许双向对话。通信中的交互是平等的，这样就可以测试新的想法。Shell\
  \ 允许用户以非常灵活的方式处理系统，并实现任务自动化。\n\n当你在 Linux 命令行中忙碌时，总有一个名为 `shell` 的程序在运行。当你输入命令时，是\
  \ `shell` 从你的键盘读取命令、处理它们并最后将它们交给操作系统。有很多不同的 shell 程序可用，但在大多数 Linux 系统上，`bash`（Bourne\
  \ Again Shell）是默认 shell。当你在 Linux 系统上启动 shell 时，它很可能是 `bash`。\n\n## 问题 02：虚拟终端与终端模拟器\n\
  \n我现在处于 X Window 系统（GUI）中。我该如何进入命令行界面（CLI）？\n\n答：你可以通过切换到另一个虚拟终端来开始使用 CLI，或者你可以启动一个终端模拟器。\n\
  \n终端模拟器是一个打开窗口并在该窗口中运行 `shell` 的程序。像启动其他 X 程序一样启动终端模拟器，这意味着即使你仍然安全地处于 GUI 中，也可以拥有命令行。现在，浏览你通常用于启动程序的程序菜单，寻找看起来像终端模拟器的应用程序（`xterm`,\
  \ `rxvt`, `gnome-terminal`, `konsole`, `kvt`, `eterm` 等等）。你可以根据需要启动任意数量的程序并尝试所有每一个。它们基本上做的是相同的事情：让你可以使用\
  \ `shell`。不同的终端模拟器在每一个程序中都运行相同的 shell 程序 `bash`。\n\n进入 CLI 的另一种方法是在 X Windows 系统仍在运行的同时，切换到另一个虚拟终端。默认情况下，Linux\
  \ 通常有六个虚拟终端，而第七个是 X 运行的地方。你可以通过按下 `Ctrl+Alt` 加上目标终端数字的功能键来切换虚拟终端。按下 `Ctrl+Alt+F1`\
  \ 将你带到第一个虚拟终端，`Ctrl+Alt+F2` 将你带到第二个虚拟终端，依此类推。\n\n当你处于虚拟终端时，你不再在 GUI（X Window 系统）中，而是在\
  \ CLI 中。GUI 仍在第七个虚拟终端中运行，所以你可以正常地通过 `Ctrl+Alt+F7` 切换回去。\n\n当终端显示 `login:` 提示符时，你现在可以在终端中输入用户名并正常登录。也许起初在\
  \ X 中使用终端模拟器做事情会更简单，但这并不重要，因为结果是一样的：你面前有一个 `bash` 提示符。该提示符会等待你输入命令或程序名称。例如，尝试输入\
  \ `ls`。正如你从输出中看到的，`ls` 命令列出了你当前目录的内容。Linux 中的所有命令本身都是小程序，你可以通过输入它们的名称来运行这些程序。\n\n\
  ## 问题 03：Linux 目录结构\n\nLinux 系统是如何结构的？\n\n答：以下是一些目录列表，它们将向你展示最有趣的地方。\n\n`/`：根目录是你的目录结构的起点。系统中的所有其他文件和目录都在根目录下。通常，根目录只包含子目录，不建议将单个文件直接存储在根目录下。\n\
  \n`/boot`：这是 Linux 保留启动所需信息的地方。如果你列出 `/boot` 的内容，你会看到一个名为 `vmlinuz` 的文件——那是内核。\n\
  \n`/etc`：这是 Linux 系统的配置文件。这些文件大部分是文本文件，可以手动编辑。以下是该目录的一些内容：\n\n`/etc/inittab`：一个描述在系统启动和正常运行期间启动哪些进程的文本文件。在这里决定是否希望在启动时自动启动\
  \ X Window 系统，并配置当按下 `Ctrl+Alt+Del` 时发生什么。\n\n`/etc/fstab`：此文件包含关于各种文件系统及其挂载点的描述性信息，如软盘、光驱等等。\n\
  \n`/etc/passwd`：一个包含每个用户账户各种信息的文件。这里是定义用户的地方。\n\n`/bin`, `/usr/bin`：这两个目录包含了许多系统程序。`/bin`\
  \ 目录包含系统运行所需最重要的程序，例如 shell、`ls`、`grep` 和其他基本程序。`/usr/bin` 则包含系统用户的应用程序。\n\n`/sbin`,\
  \ `/usr/sbin`：大多数系统管理程序存储在这些目录中。在许多情况下，你必须以 root 用户运行这些程序。\n\n`/usr`：此目录包含用户应用程序以及它们的各种其他内容，如源代码、图片、文档或它们使用的配置文件。`/usr`\
  \ 是 Linux 系统中最大的目录，有些人喜欢将其放在单独的分区上。以下是 `/usr` 的一些内容：\n\n`/usr/doc`：多种文件格式的用户应用程序文档。\n\
  \n`/usr/share`：许多应用程序的配置和图形。\n\n`/usr/src`：系统软件源代码，包括 Linux 内核。\n\n`/usr/include`：C\
  \ 编译器的头文件。头文件定义了构建大多数标准程序所需的结构和常量。`/usr/include` 下的子目录包含 C++ 编译器的头文件。\n\n\n\n\n\n\
  `/usr/X11R6`: `/usr/X11R6` 下的子目录可能包含一些 X 二进制文件，以及文档、头文件、配置文件、图标、声音和其他与图形程序相关的内容。\n\
  \n` /usr/local`: 这是你为本地机器安装应用程序和其他文件的地方。如果你发现了一些不属于你发行版官方自带的有趣应用，应该将它们安装在 `/usr/local`\
  \ 中。例如，如果某个程序通常应该进入 `/usr/bin` 但它不是你发行版的一部分，那么你应该将其安装在 `/usr/local/bin` 中。将你自己的程序与发行版中包含的程序分开，以避免混淆并保持条理。\n\
  \n`/lib`: 动态链接程序所需的共享库。\n\n`/home`: 它是用户存放个人文件的地方。每个用户在 `/home` 下都有自己的目录，通常这里是普通用户允许写入文件的唯一地方。你可以配置\
  \ Linux 系统，让普通用户甚至无法列出其他用户家目录的内容。\n\n`/root`: 超级用户（root）的家目录。你不应该将其与 Linux 系统的根目录（`/`）混淆。\n\
  \n`/var`: 该目录包含系统运行时不断变化的变量数据。一些有趣的子目录有：\n\n`/var/log`: 包含系统日志文件的目录。这些文件在系统运行时会更新，如果你的系统突然出现问题，日志文件可能包含关于该情况的信息。\n\
  \n`/var/mail`: 传入和发出的邮件存储在此中。\n\n`/var/spool`: 该目录存放为某些进程（如打印）排队的文件。\n\n`/tmp`:\
  \ 程序可以在这里写入它们的临时文件。\n\n`/dev`: Linux 系统可用的设备。在 Linux 中，设备被视为文件，你可以像读写文件一样读写设备。\n\
  \n`/mnt`: 该目录用于挂载点。在访问不同的物理存储设备之前，必须将它们附加到文件系统树中的某个目录上。这种附加操作被称为挂载（mounting），设备被附加的目录称为挂载点。`/mnt`\
  \ 目录包含不同设备的挂载点，例如用于软驱的 `/mnt/floppy`、用于 CD-ROM 的 `/mnt/cdrom` 等。然而，你并不被强制为此目的使用\
  \ `/mnt` 目录，可以使用任何你需要的目录。实际上，在某些发行版中（如 Debian 和 SUSE），默认使用 `/floppy` 和 `/cdrom`\
  \ 作为挂载点，而不是 `/mnt` 下的目录。\n\n`/proc`: 这是一个特殊目录。实际上，`/proc` 只是一个虚拟目录，因为它根本不存在。它包含了一些关于内核本身的信息。它有一系列数字条目，对应系统上运行的所有进程，还有一些命名的条目，允许访问系统的当前配置。其中许多条目是可以查看的。\n\
  \n`/lost+found`: 这是 Linux 在系统崩溃或分区在关机前未卸载时恢复的文件存放处。通过这种方式，你可以找回原本会丢失的文件。\n\n###\
  \ Question 04: 命令行历史\n\n`history` 命令的作用是什么？\n\nA: `history` 命令可以列出 Bash 记录的你输入的命令日志。这个日志被称为“历史”（history）。要访问它，请输入：\n\
  \n`history n` 将只列出最后 `n` 条命令。你可以输入 `history`（不带选项）来查看整个历史列表。\n\n你还可以输入 `!n` 来执行编号为\
  \ `n` 的命令。使用 `!!` 执行你输入的输入的命令。\n\n`!-n` 将执行之前的 `n` 次命令（例如 `!-1` 等同于 `!!`）。\n\n`!string`\
  \ 将执行最后一个以该字符串开头的命令，而 `!?string?` 将执行最后一个包含单词 \"string\" 的命令。\n\n例如：\n\n`!cd` 将重新运行你上一次输入的、以\
  \ \"cd\" 开头的命令。\n\n`commandName !*` 将执行 `commandName`，并带上你上一条命令中使用的任何参数。如果你犯了拼写错误（例如下文所示），这可能非常用用。假设你输入了：`emasc\
  \ /home/fred/mywork.java /tmp/testme.java`\n\n尝试对上述两个文件执行 `emacs`，这显然会失败。因此，你可以输入：\n\
  \n`emacs !*` 将带有你上次在命令行上输入的参数来执行 `emacs`。换句话说，这等同于输入：`emacs /home/fred/mywork.java\
  \ /tmp/testme.java`\n\n搜索命令历史 ( CTRL-R )：按下 `CTRL-R` 键执行“反向搜索”（reverse-i-search）。例如，如果你想使用上次使用\
  \ `snort` 时的命令，只需输入 `CTRL-R` 然后输入 \"snort\"。\n\n你会在控制台窗口中看到：(reverse-i-search)`':\n\
  \n在你输入完要查找的内容后，使用 `CTRL_R` 组合键向后滚动历史记录。\n\n重复使用 `CTRL-R` 来查找你输入的字符串的所有引用。一旦你找到了需要的命令，使用\
  \ `[Enter]` 执行它。\n\n或者，使用右方向或左方向箭头键会将命令放置在命令行上。\n\n### Question 05: Linux 键盘快捷键\n\
  \n在 MS Windows 中，有很多让生活更方便的键盘快捷键。Linux 也有吗？\n\nA: Linux 中有很多快捷键，以下是其中一些：\n\n####\
  \ 虚拟终端 (VIRTUAL TERMINALS)\n\n- `Ctrl + Alt + F1`: 切换到第一个虚拟终端。在 Linux 中，你可以有多个虚拟终端。\n\
  - `Ctrl + Alt + Fn`: 切换到第 `n` 个虚拟终端。由于 Linux 虚拟终端的数量为 6，`n=1...6`。\n- `tty`: 输入该命令可以告诉你当前位于哪个虚拟终端。\n\
  - `Ctrl + Alt + F7`: 切换到图形界面。如果你运行了 X Window 系统，它默认在第七个终端运行。如果没有运行，这个终端是空的。\n\n\
  #### X 窗口系统 (X WINDOW SYSTEM)\n\n- `Ctrl + Alt + +`: 切换到 X 窗口系统中的下一个分辨率。这在你配置了多个分辨率时有效。你必须使用数字键盘上的\
  \ `+` 号。\n- `Ctrl + Alt + -`: 切换到上一个 X 节点。使用数字键盘上的 `-` 号。\n- `MiddleMouseButton`:\
  \ 粘贴高亮文本。你可以用左鼠标键高亮文本（或根据应用程序使用其他高亮方法），然后按下鼠标中间键粘贴。这是 X 系统中复制粘贴的传统方式，但在某些 X 应用中可能不起作用。\n\
  如果你使用的是双键鼠标，同时按下这两个键的效果等同于按下中间键。如果无效，你必须启用三键模拟。在开启了 `gpm` 服务的情况下，这在文本终端中也有效。\n-\
  \ `Ctrl + Alt + Backspace`: 杀死 X 服务器。如果 X 崩溃且你无法正常退出，请使用此操作。如果你配置了 X Window 系统在启动时自动运行，这将重启服务器并将你带回图形登录界面。\n\
  \n#### 命令行输入 (COMMAND LINE INPUT)\n\n- `Home` 或 `Ctrl + a`: 将光标移动到行首。\n- `End` 或\
  \ `Ctrl + e`: 将光标移动到行尾。\n- `Alt + b`: 将光标移动到当前或上一个单词的开头。注意，虽然这在虚拟终端中有效，但在所有图形终端模拟器中可能不起作用，因为许多图形应用程序默认将此作为菜单快捷键。\n\
  - `Alt + f`: 将光标移动到下一个单词的结尾。同样，对于所有使用 Alt 作为修饰键的快捷键，这在所有图形终端模拟器中可能都不起作用。\n\n\n\n\
  \n\n- `Tab`: 自动补全命令和文件名。输入命令、目录或文件名的第一个字母，按下 `Tab` 即可自动补全。如果有多个以相同字母开头的命令，shell\
  \ 将尽可能完成补全并发出蜂鸣声。如果你再次按下 `Tab`，它将显示所有备选方案。\n\n这个快捷键非常有用，可以节省大量的输入时间。它在 `lilo` 提示符和某些\
  \ X 应用中也有效。\n\n- `Ctrl + u`: 清除当前行。\n- `Ctrl + k`: 删除从光标位置到行尾的字符。\n- `Ctrl + w`:\
  \ 删除光标前的单词。\n\n### 命令行输出\n\n- `Shift + PageUp`: 向上滚动终端输出。\n- `Shift + PageDown`:\
  \ 向下滚动终端输出。\n- `Ctrl + l`: `clear` 命令可以清除当前终端中所有之前执行的命令及其输出。\n- `reset`: 如果你弄乱了终端，请使用\
  \ `reset` 命令。注意，在你输入命令时，可能看不到该命令。\n\n### 命令行历史\n\n- `history`: 输入此命令时，它会列出你之前执行过的命令列表。\n\
  - `ArrowUp` 或 `Ctrl + p`: 在历史记录向上滚动并编辑之前执行过的命令。\n- `ArrowDown` 或 `Ctrl + n`: 在历史记录向下滚动并编辑下一个命令。\n\
  - `Ctrl + r`: 这个快捷键可以查找包含你输入的字母的最后一条命令。例如，如果你想找到最后传给 `cp` 命令的参数，可以按下 `Ctrl + r`\
  \ 并输入 `\"cp\"`。\n\n### 杂杂命令行\n\n- `Ctrl + c`: 杀死当前进程。\n- `Ctrl + z`: 将当前进程发送到后台。如果你运行了一个程序并需要临时使用终端，但不想完全退出该程序，这非常有用。输入命令\
  \ `fg` 可以返回进程。\n- `Ctrl + d`: 退出当前终端。如果你在 X 下的终端模拟器中使用此操作，通常会在注销后关闭终端模拟器。\n- `Ctrl\
  \ + Alt + Del`: 重启系统。如果你希望系统关机而不是重启，可以通过编辑 `/etc/inittab` 来更改此行为。\n\n### 问题 06:\
  \ 所有用户使用相同的路径\n\n是否有简单的方法让所有用户都获得相同的路径？\n\nA: 最重要的设置可以在登录 shell 的全局 shell 初始化文件中进行设置：`tcsh`\
  \ 使用 `/etc/csh.login`，`bash` 使用 `/etc/profile`。\n\n无法从这些文件中获取正确路径的例外是：`rsh` 命令、`ssh`\
  \ 命令、未显式启动登录 shell 的 X 管理器菜单项、从 `inittab` 调命令、`cron` 任务、如从 `lprd` 启动的魔法过滤器守护进程、`WWW\
  \ CGI` 脚本等。\n\n如果路径设置在 `/etc/csh.cshrc` 中，即使 `rsh` 或 `ssh` 在远程机器上使用 `tcsh/csh` 账户执行命令，路径也是正确的。然而，如果账户使用\
  \ `bash/sh`，则无法设置路径。\n\n可以将路径设置合并到一个文件中，例如文件 `/etc/environment-common`。在文件中我们写入：\n\
  \n`${EXPORT}PATH${EQ}/bin:/usr/bin:/sbin:/usr/sbin:/usr/bin/X11:/usr/local/bin:/usr/games:.`\n\
  \n这可以从 `/etc/csh.login`（针对 `tcsh` 和 `csh`）调用：\n\n```\nset EQ=\" \" set EXPORT=\"\
  setenv \" source /etc/environment-common\n```\n\n以及 `/etc/profile`（针对 `bash`，对普通\
  \ `sh` 不起）：\n\n```bash\nEQ='=' EXPORT=\"export \" . /etc/environment-common\n```\n\
  \n以及 `/etc/environment`（针对 `XDM`）：\n\n```bash\nEQ=\"=\" EXPORT=\"export \" . /etc/environment-common\n\
  ```\n\n这种策略大部分情况下有效，但 `ssh` 会对 `/etc/environment` 中的行（以及定义的环境变量 `EQ` 和 `EXPORT`）报错。此外，使用\
  \ `bash` 执行的 `rsh` 命令不会获得此路径。\n\n### 问题 07: 恢复 root 密码\n\n我如何在 RH Linux AS 上恢复 root\
  \ 密码？\n\nA: 如果你使用 `Lilo`：在 `lilo` 处输入 `linux 1`，它将让你进入单用户模式。\n\n如果你使用 `Grub`：在 `grub`\
  \ 菜单显示时按下 `e`。有一行以 `kernel` 开头，选中该行并再次按下 `e`，然后输入 `-s` 并按下 `escape`，最后按下 `b` 启动系统。此过程将让你进入单用户模式。\n\
  \n通过 `passwd` 命令更改密码。\n\n### 问题 08: Init\n\n什么是初始化？\n\nA: `init` 术语（initialization\
  \ 的缩写）是 Unix 和类 Unix 系统中产生所有其他进程的程序。它作为守护进程运行，通常 `PID 1`。\n\n其功能在 BSD 和 System V\
  \ 之间差异很大。`init` 是所有进程的父进程。注意 `init` 路径是固定的：\n\n`/usr/local/sbin:/sbin:/bin:/usr/sbin`\n\
  \n所有从 `/etc/inittab` 启动的程序都有：`/etc/init.d`。\n\n`init` 路径不包含 `/etc/init`.`init` 路径是固定的：\n\
  \n`/usr/local/sbin:/sbin:/bin:/usr/sbin`\n\n`init` 路径不包含 `/etc/init`.`init` 路径是固定的：\n\
  \n`/usr/local/sbin:/sbin:/bin:/usr/sbin`\n\n### 问题 09: 更改用户 ID\n\n我如何切换用户？\n\nA:\
  \ 命令 `su` 设置一个新的要使用的用户 ID。如果没有给出用户 ID，则使用 root。\n\n通常，`su` 调用一个具有不同用户 ID 的子 shell。带有参数\
  \ `-`（较新的为 `--login`）时`su` 像登录一样调用 shell。然而，它并不使用登录程序，而是使用内置路径。\n\n对于：\n普通用户：`/usr/local/bin:/usr/bin:/bin:/usr/bin/X11`\n\
  root 用户：`/sbin:/bin:/usr/sbin:/usr/bin`\n\n有一组命令可以使超级命令更安全。它们允许更好的日志记录、基于用户的限制以及使用单独的密码。最常用的是\
  \ `sudo`：\n\n```bash\nsudo env\n```\n\n此命令修改搜索路径，使得当前目录始终是最后一个，但不会修改 `PATH` 环境变量。`sudo\
  \ env` 和 `env` 提供的 `PATH` 变量相同。`sudo` 仅添加几个如 `SUDO_USER` 等环境变量。\n\n### 问题 10: Head\
  \ 和 Tail\n\nhead 和 tail 是如何工作的？\n\nA: 这两个命令分别显示文件的前 n 行或后 n 行。查看最后输入的十条命令：\n\n```bash\n\
  tail -10 .bash_history\nlocate configure | grep bin\nman bash\ncd\nxawtv &\ngrep\
  \ usable /usr/share/dict/words\ngrep advisable /usr/share/dict/words\ninfo quota\n\
  ```\n\n`head` 命令的功能类似。`tail` 命令有一个实用的功能，可以持续显示不断变化文件的最后 n 行。\n\n\n\n\n\n# ps 命令\n\
  \nA: `ps` 命令将为你提供当前正在运行的进程列表。使用 `ps –ef` 命令，你可以确切地看到系统上运行了什么，并杀死失控的进程或导致问题的进程。\n\
  \n`ps` 命令的另一个用途是查看用户当前正在做什么。使用 `ps –u user`（例如 `jim`）将给你提供如下示例输出：\n\n```bash\nuser@server:~>\
  \ ps -u jim\n\n20876 pts/100:00:00 bash\n20904 pts/200:00:00 bash\n20951 pts/200:00:00\
  \ ssh\n21012 pts/100:00:00 ps\n```\n\n通过此我们可以看到该用户正在执行 `ps ssh`。\n\n## 命令行选项\n\n\
  此版本的 `ps` 接受多种选项。\n\n- Unix98 选项可以分组，并且以破折号 `-` 前头。\n- BSD 选项可以分组，但不能使用破折号 `-`。\n\
  - GNU 长选项以两个破折号 `--` 前头。\n- 不同类型的选项可以自由混合。\n\n设置环境变量 `I_WANT_A_BROKEN_PS` 可强制在选项以破折号为前头时也使用\
  \ BSD 语法。环境变量 `PS_PERSONALITY`（详见下文描述）提供了对 `ps` 行为更详细的控制。\n\n## 简单进程选择\n\n| 选项 |\
  \ 说明 |\n| :--- | :--- |\n| `-A` | 选择所有进程 |\n| `-N` | 取反选择 |\n| `-a` | 选择所有带有 tty\
  \ 的进程，排除会话首进程 |\n| `-d` | 选择所有，但省略会话首进程 |\n| `-e` | 选择所有进程 |\n| `-T` | 选择此终端上的所有进程\
  \ |\n| `-a` | 选择终端上的所有进程，包括其他用户的进程 |\n| `-g` | 所有的，甚至包括组组（在没有 SunOS 设置的情况下无效） |\n\
  | `-r` | 将输出限制为运行中的进程 |\n| `-x` | 选择没有控制 tty 的进程 |\n| `--deselect` | 取反选择 |\n\n\
  ## 通过列表选择进程\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `-C` | 按命令名选择 |\n| `-G` | 按 RGID\
  \ 选择（支持名称） |\n| `-U` | 按 RUID 选择（支持名称） |\n| `-g` | 按会话首进程或组名选择 |\n| `-p` | 按 PID\
  \ 选择 |\n| `-s` | 选择属于给定会话的进程 |\n| `-t` | 按 tty 选择 |\n| `-u` | 按有效用户 ID 选择（支持名称）\
  \ |\n| `-U` | 为指定的用户选择进程 |\n| `-p` | 按进程 ID 选择 |\n| `-t` | 按 tty 选择 |\n| `--group`\
  \ | 按组名或 ID 选择 |\n| `--User` | 按真实用户名或 ID 选择 |\n| `--group` | 按有效组名或 ID 选择 |\n|\
  \ `--pid` | 按进程 ID 选择 |\n| `--sid` | 按会话 ID 选择 |\n| `--tty` | 按终端选择 |\n| `--user`\
  \ | 按有效用户名或 ID 选择 |\n| `-123` | 隐含的 `--sid` |\n| `123` | 隐含的 `--pid` |\n\n## 输出格式控制\n\
  \n| 选项 | 说明 |\n| :--- | :--- |\n| `-O` | 预加载的 `-o` |\n| `-c` | 为 `-l` 提供不同的调度器信息\
  \ |\n| `-f` | 执行完整列表 |\n| `-j` | 任务格式 |\n| `-l` | 长格式 |\n| `-o` | 用户自定义格式 |\n| `-y`\
  \ | 不显示标志位；用 rss 代替 addr |\n| `O` | 预加载的 `o`（覆盖加载） |\n| `X` | 旧 Linux i386 寄存器格式\
  \ |\n| `j` | 任务控制格式 |\n| `l` | 显示长格式 |\n| `o` | 指定用户自定义格式 |\n| `s` | 显示信号格式 |\n\
  | `u` | 显示用户导向的格式 |\n| `v` | 显示虚拟内存格式 |\n| `--format` | 用户自定义格式 |\n\n## 输出修饰符\n\n\
  | 选项 | 说明 |\n| :--- | :--- |\n| `-H` | 显示进程层次结构（森林） |\n| `-m` | 显示所有线程 |\n| `-n`\
  \ | 设置名称列表文件 |\n| `-w` | 宽输出 |\n| `-C` | 使用原始 CPU 时间用于 `%CPU` 而非衰减平均值 |\n| `-N`\
  \ | 指定名称列表文件 |\n| `-O` | 排序顺序（覆盖） |\n| `-S` | 包含某些死子进程数据（与父进程求和） |\n| `-c` | 真实命令名\
  \ |\n| `-e` | 命令后显示环境 |\n| `-f` | ASCII 艺术进程层次结构（森林） |\n| `-h` | 不打印表头行（BSD 模式下重复表头）\
  \ |\n| `-m` | 所有线程 |\n| `-n` | `WCHAN` 和 `USER` 的数值输出 |\n| `-w` | 宽输出 |\n| `--cols`\
  \ | 设置屏幕宽度 |\n| `--columns` | 设置屏幕宽度 |\n| `--cumulative` | 包含某些死子进程数据（与父进程求和） |\n\
  | `--forest` | ASCII 艺术进程树 |\n| `--html` | HTML 转义输出 |\n| `--headers` | 重复表头行 |\n\
  | `--no-headers` | 完全不打印表头行 |\n| `--line` | 设置屏幕高度 |\n| `--null` | 使用 NUL 的不对齐输出\
  \ |\n| `--null` | 使用 NUL 的不对齐输出 |\n| `--rows` | 设置屏幕高度 |\n| `--sort` | 指定排序顺序 |\n\
  | `--width` | 设置屏幕宽度 |\n| `--zero` | 使用 NUL 的不对齐输出 |\n\n## 信息\n\n| 选项 | 说明 |\n|\
  \ :--- | :--- |\n| `-V` | 打印版本 |\n| `-L` | 列出所有格式指定符 |\n| `V` | 显示版本信息 |\n| `--help`\
  \ | 打印帮助信息 |\n| `--info` | 打印调试信息 |\n| `--version` | 打印版本 |\n\n## 问题 12: pstree\n\
  \n什么是 `pstree`？它是如何工作的？\n\nA: `pstree` 是一个 UNIX 命令，以树的形式显示运行中的进程。它的根是 `init` 进程或给定\
  \ `PID` 的进程。如果指定了用户名，则显示所有以该用户拥有的进程为根的树。它是 `ps` 命令的替代方案。\n\n`pstree` 命令通过将相同的分支放在方括号中并在前面加上重复次数，在视觉上合并这些分支，例如：\n\
  \n```text\ninit-+-getty\n|-getty\n|-getty\n`-getty\n```\n变为\n```text\ninit---4*[getty]\n\
  ```\n\n## 选项\n\n- `-a`: 显示命令行参数。如果进程的命令行被交换出，则在括号中显示该进程。`-a` 隐式禁用压缩。\n- `-c`: 使用原始\
  \ CPU 时间用于 `%CPU` 而非衰减平均值。\n- `-G`: 禁用压缩。\n- `-h`: 高亮当前进程。\n- `-H`: 显示进程层次结构（森林）。\n\
  - `-l`: 显示长格式。\n- `-m`: 所有线程。\n- `-n`: `WCHAN` 和 `USER` 的数值输出。\n- `-O`: 排序顺序。\n\
  - `-p`: 显示 PIDs。\n- `-s`: 安全 ID。\n- `-x`: 显示安全上下文。\n- `-u`: 显示 uid 转换。\n- `-U`:\
  \ 使用 UTF-8。\n- `-V`: 显示版本信息。\n- `-a`: 显示命令行参数。\n- `--columns`: 设置屏幕宽度。\n- `--cumulative`:\
  \ 包含某些死子进程数据（与父进程求和）。\n- `--forest`: ASCII 艺术进程树。\n- `--html`: HTML 转义输出。\n- `--headers`:\
  \ 重复表头行。\n- `-h`: 打印帮助信息。\n- `--info`: 打印调试信息。\n- `--line`: 设置屏幕高度。\n- `--no-headers`:\
  \ 完全不打印表头行。\n- `--null`: 使用 NUL 的不对齐输出。\n- `--rows`: 设置屏幕高度。\n- `--sort`: 指定排序顺序。\n\
  - `--user`: 有效用户名或 ID。\n- `--version`: 打印版本。\n- `--width`: 设置屏幕宽度。\n- `--zero`:\
  \ 使用 NUL 的不对齐输出。\n\n## 问题 13: 标准输入输出\n\n许多 CLI 程序使用名为输入输出重定向的功能。\n\n它们是如何工作的？\n\n\
  A: CLI 的输入输出重定向功能允许你连接或融合简单命令以构建更复杂的。\n\n### 标准输出\n\n许多 Linux 命令将输出打印到屏幕。例如，`cat`\
  \ 在列出文件内容时会这样做并在你的屏幕上看到输出。然而，屏幕并不是命令打印输出的唯一地方，因为你可以将命令的输出重定向到文件、设备甚至是其他命令的输入。\n\n\
  显示结果的 CLI 程序通常通过将结果发送到标准输出或 `stdout` 来。默认情况下，标准输出指向屏幕，正如你通过 `cat` 命令看到的，但如果你想将输出重定向到其他地方，可以使用\
  \ `>` 字符，例如：\n\n```bash\nls > dir_listing.txt\n```\n上述命令将 ls 的输出重定向到名为 `dir_listing.txt`\
  \ 的文件中。你不会屏幕上看不到任何 ls 的结果，因为输出被重定向到了文件中。\n\n每次你重复 `ls > dir_listing.txt` 命令时，文件\
  \ `dir_listing.txt` 都会被 ls 命令的结果覆盖。如果你想追加到文件中而不是重写，可以使用 `>>`：\n\n```bash\nls >>\
  \ dir_listing.txt\n```\nls 的新输出将添加到 `dir_listing.txt` 文件的末尾，而不是每次重复时都覆盖文件。\n\n以下命令将\
  \ File1 的内容添加到 File8 的末尾：\n\n```bash\ncat File1 >> File8\n```\n\n你也可以使用以下将其重定向到设备：\n\
  \n```bash\ncat sound.wav > /dev/audio\n```\n\n\n\n\n假设 `cat` 命令拼接了一个名为 `sound.wav`\
  \ 的文件，并将结果发送到名为 `/dev/audio` 的设备。如果你的声音设备配置恰当，上述命令将播放 `sound.wav` 文件。\n\n### 标准输入\n\
  \n许多命令接受来自标准输入的输入，简称为 `stdin`。默认情况下，标准输入从你的键盘读取信息，并且和标准输出一样，它是可以重定向的。为了让你有一个清晰的认识，我们可以在实验时使用名为\
  \ `tac` 的小程序。该程序读取标准输入，然后以行反行的顺序将其显示给你。看看 `tac` 是如何从你的键盘读取输入并工作的。输入 `tac` 命令并输入几行文本，使用\
  \ `Enter` 键换行。完成后按下 `Ctrl+D`，`tac` 就会就会反转所有行的顺序显示文本。\n\n```\nme@puter: ~$ tac\n\
  gorgeous me\nalso you\nalso you\ngorgeous me\nme@puter: ~$\n```\n\n你可以重定向输入，让 `tac`\
  \ 从文件而不是键盘获取输入。你可以使用 `<` 字符来实现，如下：\n\n```\n$ tac < list_abc.txt\n```\n\n上述命令从名为\
  \ `list_abc.txt` 的文件中读取输入并将结果发送到标准输出。由于输出没有重定向到任何地方，它将显示在你的屏幕上，你会看到相反顺序的 `list_abc.txt`\
  \ 行。\n\n你也可以同时重定向命令的输入和输出：\n\n```bash\n$ tac < list_abc.txt > list_cba.txt\n```\n\
  \n上述操作与之前的命令相同，只不过这次结果没有显示在屏幕上。由于输出被重定向，结果被写入名为 `list_cba.txt` 的文件中，该文件包含与 `list_abc.txt`\
  \ 相同的行，但顺序相反。\n\n## 问题 14：管道 (Pipes)\n\n我可以获取一个程序的输出并作为另一个程序的输入吗？\n\n答：可以，这被称为管道（piping）。管道允许你将一个程序的输出作为另一个程序的输入。例如，使用\
  \ `sed` 的简单管道：\n\n```bash\nls -l | sed -e \"s/[aeio]/u/g\"\n```\n\n这里发生的是执行了 `ls\
  \ -l` 命令并获取了输出。输出没有打印到屏幕上，而是被发送或通过管道传给了 `sed` 程序，而该程序随后打印了它的处理结果。\n\n你可以在许多命令中使用管道，其中最常用的之一是\
  \ `grep`。它是一个检查接收到的标准输入每一行并搜索指定字符模式的程序。然后将包含这些字符的每一行发送到标准输出。\n\n假设我们名为 `list.txt`\
  \ 的文本文件，我们想找到其中包含单词 \"peace\" 的行。这可以通过管道轻松实现。列出文件 `list.txt` 的内容并将结果发送给 `grep`，`grep`\
  \ 过滤所有包含目标单词 \"peace\" 的行并将这些行显示在你的屏幕上：\n\n```bash\n$ cat list.txt | grep peace\n\
  ```\n\n与许多 Linux 命令一样，`grep` 是区分大小写的。这意味着上述命令只匹配 \"peace\"，而不匹配 \"Peace\" 或 \"PEACE\"\
  。使用 `-i` 选项可以进行不区分大小写的搜索：\n\n```bash\n$ cat applist.txt | grep -i desktop\n```\n\
  \n管道是一个非常有用的功能。一旦你熟悉了 CLI（命令行界面）并学习了更多命令，你会在每次使用它时开始体会这个功能的价值。\n\n### 问题 15：命令替换\
  \ (Command substitution)\n\n什么是命令替换？它是如何工作的？\n\n答：命令替换基本上是实现管道的另一种方式。你可以交替使用管道和命令替换。命令替换可以通过两种不同的方式完成。\n\
  \n简单输入：`command_1 `command_2 -options``\n\n这将执行 `command_2` 并且它的输出将成为 `command_1`\
  \ 的输入。\n\n反引号键（back-quote key）通常位于波浪号（tilde）所在的位置，在 `Tab` 键上方。\n\n或者输入：`command_1\
  \ $(command_2)`\n\n这将执行 `command_2` 并且它的输出将成为 `command_1` 的输入。\n\n你当然可以使用管道来执行相同的操作。例如，与其这样做：\n\
  \n```bash\nless $cat file1.txt file2.txt\n```\n\n不如这样做：\n```bash\ncat file1.txt\
  \ file2.txt | less\n```\n\n通过这种方式，你将得到相同的结果。\n\n### 问题 16：top 命令\n\n管理员监控系统性能有多重要？\n\
  \n答：系统管理员最重要的职责之一就是监控他们的系统。如果系统资源变得过低，可能会导致许多问题。系统资源可能会被单个用户或系统可能托管的服务（如电子邮件或网页）占用。了解正在发生的情况有助于判断是否需要升级系统，或者某些服务是否需要迁移到另一台机器。\n\
  \n这些命令中最常用的是 `top`。`top` 命令提供了对活动的持续观察，显示最密集任务列表，并且比标准的 `ps` 套件更便于配置。你可以在 `top`\
  \ 运行时对其进行修改。按下 `I` 将不再显示空闲进程。按下 `M` 将按内存占用排序，`S` 将按进程运行时间排序，`P` 将按 CPU 使用率排序。\n\n\
  除了查看选项外，你还可以在 `top` 内部修改进程。你可以使用 `u` 查看特定用户拥有的进程，使用 `k` 杀死进程以及 `r` 刷新它们。\n\n关于进程的更深入的信息，你可以查看\
  \ `/proc` 文件系统。在 `/proc` 文件系统中你会发现一系列以数字命名的子目录。这些目录与进程关联并包含有关进程的文件。\n\n### 问题 17：vi\
  \ 编辑器\n\n我为什么要选择使用 vi 编辑器？\n\n答：尽管历史悠久，`vi` 在今天仍然是一个重要的工具。这一点从一个事实得到了证明：过去二十年发布的每一个\
  \ UNIX 和 Linux 发行版可能都默认安装了它。自原始 `vi` 发布以来，出现了许多衍生版本（如 `vim`、`vile` 和 `elvis`），并在此过程中增加了可用性和功能。正因如此，`vi`\
  \ 可能是世界上最进化且最稳定的文本编辑器之一。\n\n许多较新的 vi 克隆版本也足够智能，能够识别你正在编辑的文件类型，并通过自动缩进（例如 HTML 或\
  \ C）或高亮语法来帮助你工作得更清晰。在 Unix 的传统中，困扰你或帮助你的功能可以根据你的喜好开启或关闭，长期来看，花几分钟自定义 `vi` 可以节省大量工作。\n\
  \n`vi` 编辑器是一个非常强大的工具，拥有非常详尽的内置手册，你可以在启动程序时使用 `help` 命令激活它。让初学者感到困惑的是它可以以两种模式运行：命令模式和插入模式。编辑器始终从命令模式开始。命令允许你在文本中移动、搜索、替换、标记块并执行其他编辑任务，某些命令会将编辑器切换到插入模式。\n\
  \n\n\n\n# 问题 18：基础 vi 命令\n\n什么是基础 vi 命令？\n\n答：`vi` 编辑器是 UNIX 系统中一种常用的编辑器，因为它使用带有转义键（escape\
  \ key）的普通键盘。在 DECstation 上，转义键是 `F11` 键。因此，它适用于所有 UNIX 计算机。在 UNIX 提示符下输入 `man vi`\
  \ 可查看完整文档。\n\n### 开始编辑会话\n\n要启动 `vi`，只需在操作系统提示符处输入 `vi`。你会看到屏幕左侧有一列波浪号（~`）。这表示一个空的工作区域。要编辑文件，只需在后面加上文件名，例如\
  \ `vi filename`。你将看到所包含的文件内容。此时 vi 进入命令模式。进入插入模式的最基本命令是 `i`，它允许你在光标左侧插入文本。\n\n在插入模式下，你输入的字符将插入到文档中。你可以使用退格键删除当前输入行上的任何打字错误。转义键（`<esc>`）带你退出插入模式并返回命令模式。如果你不确定自己处于哪种模式，只需反复按下\
  \ `<esc>` 直到 `vi` 开始报错。此时你就知道自己处于命令模式了。\n\n命令模式是你进行所有非插入模式操作的地方。在命令模式下，那些在插入模式中导致屏幕上出现字母的相同按键现在代表完全不同的功能。\n\
  \n以下是一些常用命令：\n\n### 撤销命令\n- `U` - 撤销上一个命令。\n\n### 屏幕命令\n- `CTL/l` - 重打印当前屏幕。\n-\
  \ `CTL/L` - 在屏幕顶部显示一行。\n- `CTL/E` - 在屏幕底部显示一行。\n- `CTL/F` - 向前翻一页。\n- `CTL/B` -\
  \ 向后翻一页。\n- `CTL/D` - 向下翻半屏。\n- `CTL/U` - 向上半屏。\n\n### 光标定位命令\n- `j` - 光标向下移动一行，同列。\n\
  - `k` - 光标向上移动一行，同列。\n- `h` - 光标向左移动一个字符。\n- `l` - 光标向右移动一个字符。\n- `RET` - 光标移动到下一行开头。\n\
  - `0` - 光标移动到当前行开头。\n- `$` - 光标移动到当前行结尾。\n- `SPACE` - 光标向右移动一个字符。\n- `nG` - 光标移动到第\
  \ n 行开头。默认是文件最后一行。\n- `0` - 光标移动到行的第一个字符。\n- `:n` - 光标移动到第 n 行开头。\n- `b` - 光标向后移动到上一个单词的开头。\n\
  - `e` - 光标向后移动到上一个单词的结尾。\n- `w` - 光标向前移动到下一个单词。\n- `/pattern` - 光标向前移动到模式下次出现处。\n\
  - `?pattern` - 光标向后移动到模式出现处。\n- `N` - 重复上一次 `/` 或 `?` 模式搜索。\n\n如果你尝试移动到 vi 不允许的地方（例如当光标在最左侧列时按下\
  \ `h`），你的终端会通过蜂响或屏幕闪烁来报错。\n\n### 文本插入命令\n- `a` - 在光标后追加文本。按转义键结束。\n- `A` - 在行尾追加文本。按转义键结束。\n\
  - `i` - 在光标前插入文本。按转义键结束。\n- `I` - 在行首插入文本。按转义键结束。\n- `o` - 在当前行下方打开新行插入文本。按转义键结束。\n\
  - `O` - 在当前行上方打开新行插入文本。按转义键结束。\n- `DEL` - 在文本插入期间覆盖上一个字符。\n- `ESC` - 停止文本插入。DECstations\
  \ 上的转义键是 `F11` 键。\n\n### 文本删除命令\n- `x` - 删除当前字符。\n- `dd` - 删除当前行。\n- `dw` - 删除当前单词。\n\
  - `d)` - 删除当前句子的剩余部分。\n- `D, d$` - 从光标删除到行尾。\n- `P` - 还原上次删除的文本。\n\n### 修改命令\n-\
  \ `cw` - 修改当前单词字符，直到按转义键停止。\n- `c$` - 修改到行尾的文本。\n- `C, cc` - 修改当前行的剩余文本，直到按转义键停止。\n\
  - `~` - 切换当前字符的大小写。\n- `xp` - 交换当前字符和后续字符。\n- `J` - 将当前行与下一行合并。\n- `s` - 删除当前字符并进入插入模式。\n\
  - `rx` - 将当前字符替换为 `x`。\n- `R` - 替换后续字符直到按转义键停止。\n\n### 剪切和粘贴命令\n- `yy` - 将当前行放入缓冲区。不从当前位置删除该行。\n\
  - `p` - 将缓冲区行放在光标当前位置之后。\n\n### 将文件追加到当前文件\n- `:R filename` - 在光标之前的位置插入文件 `filename`。\n\
  \n### 退出 vi\n- `ZZ` - 保存并退出 vi。\n- `:wq` - 更改并退出。\n- `:q!` - 退出（不保存）。\n\n# 问题 19：wc\
  \ 统计\n\n我想查找字节数和单词。\n\n答：使用 `wc`（word count），它是 UNIX 系统中的一个命令。它可以读取标准输入或文件列表，并生成统计信息：字节数、行数、单词数。例如：\n\
  \n```\nwc ideas.txt\n40 149 22\n```\n\n第一列显示行数，第二列显示单词数。新版本的 `wc` 可以区分字节和字符计数。这通过\
  \ `-c` 或 `-m` 开关选择。\n\n### 描述\n- -c, --bytes: 打印字节数\n- -m, --chars: 打印字符数\n- -l,\
  \ --lines: 打印行数\n- -L, --max-line-length: 打印最行长度\n- -w, --words: 打印单词数\n- --help:\
  \ 显示帮助信息\n- --version: 输出版本信息\n\n\n\n\n\n`REPEAT` 次 `CHAR` 的拷贝，如果以 0 开头则为 8 进制\n\
  \n`[:alnum:]` 所有字母和数字\n\n`[:alpha:]` 所有字母\n\n`[:blank:]` 所有水平空白符\n\n`[:cntrl:]`\
  \ 所有控制字符\n\n`[:digit:]` 所有数字\n\n`[:graph:]` 所有可打印字符，不包括空格\n\n`[:lower:]` 所有小写字母\n\
  \n`[:print:]` 所有可打印字符，包括空格\n\n`[:punct:]` 所有标点符号\n\n`[:space:]` 所有水平或垂直空白符\n\n`[:upper:]`\
  \ 所有大写字母\n\n`[:xdigit:]` 所有十六进制数字\n\n`[=CHAR=]` 所有与 `CHAR` 等等的字符\n\n如果未给出 `-d` 选项且\
  \ `SET1` 和 `SET2` 同时出现，则进行翻译。`-t` 选项仅在进行翻译时可用。`SET2` 会通过在需要时重复其最后一个字符来扩展到 `SET1`\
  \ 的长度。`SET2` 多余的字符将被忽略。只有 `[:lower:]` 和 `[:upper:]` 保证按升序扩展；在翻译时用于 `SET2` 时，它们只能成对使用以指定大小转换。在不进行翻译或删除时，`-s`\
  \ 使用 `SET1`；否则压缩（squeezing）使用 `SET2` 并在翻译或删除后发生。\n\n## Question 21: nice\n\n是否有一种方法可以控制或促进快速执行的进程，使其运行缓慢，从而不干扰其他系统活动？\n\
  \n**A:** UNIX 进程有一个关联的系统 `nice` 值，内核利用该值来决定何时调度运行。可以增加此值以促进进程快速执行，或减小它可以使进程运行缓慢，从而不干扰其他系统活动。\n\
  \n### 语法概要\n```\nnice [OPTION] [COMMAND [ARG]...]\n```\n\n### 描述\n使用调整后的调度优先级运行\
  \ `COMMAND`。如果没有指定 `COMMAND`，则打印当前的调度优先级。`ADJUST` 默认值为 10。范围从 -20（最高优先级）到 19（最低优先级）。\n\
  \n- `-n, --adjustment=ADJUST`: 首先将优先级增加 `ADJUST`\n- `--help`: 显示此帮助信息并退出\n- `--version`:\
  \ 输出版本信息并退出\n\n## Question 22: join\n\n我想根据公共字段的存在合并两个排序后的文件的行。\n\n我该如何实现这一点？\n\n\
  **A:** `join` 命令是 Unix 类操作系统中的一个工具，用于根据公共字段的存在合并两个排序文本文件的行。它是关系型数据库中使用的 `join` 操作符的一种实现，但操作对象是文本文件。\n\
  \n`join` 命令接受两个文本文件和若干选项作为输入。如果没有给出命令行参数，该命令将查找两个文件中具有相同第一个字段（一个与空格不同的字符序列）的行对，并输出一个由第一个字段以及另外两行的剩余部分组成的行。\n\
  \n程序参数指定了使用哪个字符代替空格来分隔行的字段、在查找匹配行时使用哪个字段，以及是否输出不匹配的行。输出可以通过重定向存储到另一个文件中，而不是打印到屏幕。\n\
  \n### 语法概要\n```\njoin [OPTION]... FILE1 FILE2\n```\n\n### 描述\n对于每一对具有相同连接字段的输入行，向标准输出写入一行。默认连接字段第一个，由空白分隔。当\
  \ `FILE1` 或 `FILE2`（但不是两者）为 `-` 时，从标准输入读取。\n\n- `-a SIDE`: 打印来自文件 `SIDE` 的不可配行\n\
  - `-e EMPTY`: 用 `EMPTY` 替换缺失的输入字段\n- `-i, --ignore-case`: 比较字段时忽略大小差异\n- `-j FIELD`:（过时）等同于\
  \ `-1 FIELD -2 FIELD`\n- `-j1 FIELD`:（过时）等同于 `-1 FIELD`\n- `-j2 FIELD`:（过时）等同于 `-2\
  \ FIELD`\n- `-o FORMAT`: 构建输出行时遵循 `FORMAT`\n- `-t CHAR`: 使用 `CHAR` 作为输入输出字段分隔符\n\
  - `-v SIDE`: 类似于 `-a SIDE`，但抑制连接输出行\n- `-1 FIELD`: 根据文件 1 的 `FIELD` 连接\n- `-2 FIELD`:\
  \ 根据文件 2 的 `FIELD` 连接\n- `--help`: 显示此帮助信息并退出\n- `--version`: 输出版本信息并退出\n\n除非给出\
  \ `-t CHAR`，否则领先空格分隔字段并忽略，否则字段由 `CHAR` 分隔。任何 `FIELD` 都是从 1 开始计数的字段编号。`FORMAT` 是一个或多个由逗号或空白分隔的规范，每个规范为\
  \ `SIDE.FIELD` 或 `0`。默认 `FORMAT` 输出连接字段、来自 `FILE1` 的剩余字段、来自 `FILE2` 的剩余字段，全部由 `CHAR`\
  \ 分隔。\n\n例如，以下文件列了一些人的父亲和母亲：\n```\nwayne nico\nterry solo\nsolo krisha\nwayne kristel\n\
  ```\n这两个文件的连接（不带参数）将产生：\n```\nwayne nico kristel\n```\n事实上，只有 \"wayne\" 是两个文件中共同的单词。\n\
  \n## Question 23: Xargs\n\n`xargs` 是什么？\n\n**A:** `xargs` 命令从标准输入读取参数，由空格（可以用双引号保护）或换行符分隔，并带有参数执行一次或多次命令，参数后跟标准输入。如果标准输入确实包含任何非空白内容。通常情况下，即使没有输入，命令也会运行一次。\n\
  \n### 选项：\n- `--null, -0`: 输入文件名以空字符而非空白符终止。禁用引号和反斜杠。此选项产生适用于此模式的输入。\n- `--eof[=eof-str],\
  \ -e[eof-str]`: 将文件结束字符串设置为 `eof-str`。如果文件结束字符串作为输入行出现，则忽略剩余输入。如果省略 `eof-str`，则没有文件结束字符串。默认值为\
  \ `_`。\n- `--help`: 打印 `xargs` 选项摘要并退出。\n- `--replace[=replace-str], -i[replace-str]`:\
  \ 将初始参数中 `replace-str` 出现的地方替换为从标准输入读取的名称。如果省略 `replace-str`，默认为 `\"{}\"`（类似于 `find\
  \ -exec`）。它隐含 `-x` 和 `-l 1`。\n- `--max-lines[=max-lines], -l[max-lines]`: 每行命令行最多使用\
  \ `max-lines` 行非空白输入行；如果省略，`max-lines` 默认为 1。末尾空白会导致输入行在逻辑上延续到下一行。隐含 `-x`。\n- `--max-args[=max-args],\
  \ -n max-args`: 每行命令行最多使用 `max-args` 个参数。如果超过大小（参见 `-s` 选项），将使用少于 `max-args` 的参数，除非给出了\
  \ `-x` 选项，此时 `xargs` 将退出。\n- `--interactive, -p`: 提示用户是否运行每个命令行并从终端读取一行。只有当响应以 `y`\
  \ 或 `Y` 开头时运行命令行。隐含 `-t`。\n- `--max-chars[=max-chars], -s max-chars`: 每行命令行最多使用\
  \ `max-chars` 个字符，包括命令和初始参数以及字符串结尾的终止空。默认值为尽可能大，上限为 20k 字符。\n- `--verbose, -t`:\
  \ 在执行之前向标准错误输出打印命令行。\n- `--version`: 输出 `xargs` 的版本号并退出。\n- `--exit, -x`: 当超过大小（参见\
  \ `-s` 选项）时退出。\n- `--max-procs=max-procs, -P max-procs`\n\n\n\n\n\n一次运行多达 `max-procs`\
  \ 个进程；默认值为 `1`。如果 `max-procs` 为 `0`，则 `xargs` 将尽可能运行数量的进程。使用 `-P` 时请配合 `-n` 选项；否则可能只会执行一次\
  \ `exec`。\n\n`xargs` 经常与 Unix 命令 `find`、`locate` 和 `grep` 配合使用。\n\n例如：\n\n1. `find\
  \ . -name \"*.foo\" | xargs grep bar`\n\n在实践中的效果与 `grep bar` 相同：\n```bash\nfind\
  \ . -name \"*.foo\"\n```\n即使要搜索的文件多到无法全部放入单条命令行，该方法依然有效。它会在当前目录及其子目录下所有以 `.foo`\
  \ 结尾的文件中搜索字符串 `bar` 的出现情况。\n\n2. `find . -name \"*.foo\" -print0 | xargs -0 grep\
  \ bar`\n\n此的作用相同，但使用了 `find` 和 `xargs` 的 GNU 特有扩展，使用空字符（null character）来分隔文件名；即使文件名包含空白字符（包括换行符），这种方法也有效。\n\
  \n## 问题 24: SED\n\n什么是 SED？它是如何使用的？\n\n答：流 编辑器（`sed`）是一种简单且强大的计算机程序，用于对顺序文本数据流应用各种预设的文本转换。它逐行读取输入文件，根据其简单语言（sed\
  \ 脚本）中指定的规则编辑每行，然后输出该行。\n\n`sed` 通常被认为是一种非交互式文本编辑器。它与传统文本编辑器的区别在于，对两个输入的处理方式是反转的。传统编辑器是循环遍历一次编辑命令列表，并将每个命令应用到内存中的整个文本文件，而\
  \ `sed` 是遍历一次文本文件，并将整个编辑命令列表应用到每一行。由于内存中一次只有一行，`sed` 可以处理具有任意行数的文本文件。某些 `sed` 的实现只能处理长度有限的行。\n\
  \n大多数人首次使用 `sed` 是为了它的替换功能。`sed` 经常被用作查找和替换工具。\n\n```bash\nsed 's/Wayne/Nico/g'\
  \ oldfile >newfile\n```\n它会将文件中出现的每一个 \"Wayne\" 替换为单词 \"Nico\"。“查找”部分是一个正则表达式（\"\
  RE\"），它可以是一个简单的单词，也可以包含特殊字符以提供更大的灵活性（例如，防止 \"Wayne\" 也匹配到 \"Wayneme\"）。\n\n`sed`\
  \ 可用于在文件的左侧添加 8 个空格，打印就不会从纸张的绝对左边缘开始。\n\n```bash\nsed 's/^/ /' myfile >newfile #\
  \ sed 脚本\nsed 's/^/ /' myfile | lp # 下一个 sed 脚本\n```\n\n`sed` 可以只显示文件的一段，从 \"once\
  \ upon a time\" 开始，到 \"happily ever after\" 结束。脚本看起来如下：\n\n```bash\nsed -n '/once\
  \ upon a time/,/happily ever after/p' myfile\n```\n`Sed` 的正常行为是打印（即在屏幕上显示）整个文件，包括未更改的部分，除非你使用\
  \ `-n` 开关。`\"-n\"` 表示“不输出（no output）”。该开关几乎总是与某处的 `'p'` 命令配合使用，表示只打印文件中指定的章节。`-n`\
  \ 开关配合 `'p'` 命令允许打印文件的部分内容（即发送到控制台）。\n\n## 问题 25: 作业控制 (Job Control)\n\n我想在后台执行一项耗长时间的任务，同时使用终端进行其他操作。是否可以选择性地停止或暂停某些进程的执行？\n\
  \n答：大多数任务（列出目录、编辑文件等）都可以通过程序接管终端并在程序退出时将控制权还给 shell 来完成；然而，有时用户希望在使用终端进行其他操作的同时在后台执行耗长时间的任务。作业控制是一种为此而开发的机制。它允许用户在后台启动程序、将程序发送到后台、将后台程序调至前台，以及启动和停止运行中的程序。受作业控制机制影响下的程序被称为作业（jobs）。\n\
  \nshell 将作业与每个管道关联。它维护了一个当前正在执行的作业表，可以通过 `jobs` 命令列出。当 `Bash` 异步启动一个作业时，它会打印如下的一行：\n\
  \n```\n[1] 12345\n```\n因此，表示该作业是作业号 1，且该作业相关的管道中最后一个进程的进程 ID 为 `12345`。单个管道中的所有进程都是同一个作业的成员。`Bash`\
  \ 使用作业抽象作为作业控制的基础。\n\n为了便于作业控制用户界面的实现，操作系统维护了当前终端进程组 ID 的概念。该进程组的成员（进程组 ID 等于当前终端进程组\
  \ ID 的进程）接收如 `SIGINT` 等键盘生成的信号。这些进程被称为前台进程。后台进程是那些进程组 ID 与终端不同的进程；此类进程对键盘生成的信号产生免疫。只有前台进程允许从终端读取或写入终端。尝试从终端读取（写入）的后台进程将收到终端驱动程序发送的\
  \ `SIGTTIN`（`SIGTOU`）信号，除非被捕获，否则进程将被暂停。\n\n\n\n\n\n如果在作业处于停止状态时尝试退出 `Bash`，shell\
  \ 将打印一条消息，警告有已停止的作业。此时可以使用 `jobs` 命令来检查这些作业的状态。如果在没有中间插入命令的情况下进行第二次退出尝试，`Bash` 将不会再次打印警告，并且已停止的作业将被终止。\n\
  \n## 作业控制内置命令 (Job Control Built-ins)\n\n### `bg`\n`bg [jobspec ...]`\n在后台恢复每个挂起的作业\
  \ `jobspec`，就像当初使用 `&` 启动它一样。如果未提供 `jobspec`，则使用当前作业。返回状态为零，除非在未启用作业控制的情况下运行，或者在启用作业控制的情况下运行时，未找到任何\
  \ `jobspec` 或 `jobspec` 指定了一个未在作业控制下启动的作业。\n\n### `fg`\n`fg [jobspec]`\n在前台恢复作业\
  \ `jobspec` 并将其变为当前作业。如果未提供 `jobspec`，则使用当前作业。返回状态为置于前台的命令的状态，或者在禁用作业控制的情况下运行时为非零；或者在启用作业控制的情况下运行时，`jobspec`\
  \ 未指定有效作业，或 `jobspec` 指定了一个未在作业控制下启动的作业。\n\n### `jobs`\n`jobs [-lnprs] [jobspec]`\n\
  `jobs -x command [arguments]`\n\n第一种形式列出活动作业。选项的含义如下：\n\n- `-l`: 除普通信息外，列出进程 ID\
  \ (PID)。\n- `-n`: 仅显示自上次通知用户状态以来状态发生变化的作业信息。\n- `-p`: 列出作业进程组首的进程 ID。\n- `-r`: 限制输出为运行中的作业。\n\
  - `-s`: 限制输出为已停止的作业。\n\n如果给了 `jobspec`，输出将限制为该作业的信息。如果未提供 `jobspec`，则列出所有作业的状态。\n\
  \n如果提供了 `-x` 选项，`jobs` 将 `command` 或 `arguments` 中找到的任何 `jobspec` 替换为相应的进程组 ID，并执行\
  \ `command`，传递 `arguments`，返回其退出状态。\n\n### `kill`\n`kill [-s sigspec] [-n signum]\
  \ [-sigspec] jobspec or pid`\n`kill -l [exit_status]`\n\n向由作业规范 `jobspec` 或进程 ID\
  \ `pid` 指定的进程发送由 `sigspec` 或 `signum` 指定的信号。`sigspec` 是不区分大小写的信号名称（如 `SIGINT`，带或不带\
  \ `SIG` 前缀）或信号数字；`signum` 是信号数字。如果 `sigspec` 和 `signum` 均不存在，则使用 `SIGTERM`。`-l`\
  \ 选项列出信号名称。如果在给出 `-l` 时提供了任何参数，则列出对应参数的信号名称，返回状态为零。`exit_status` 是一个数字，指定信号数字或由信号终止的进程的退出状态。如果成功发送了至少一个信号，返回零；如果发生错误或遇到无效选项，则返回非零。\n\
  \n### `wait`\n`wait [jobspec or pid ...]`\n等待由每个进程 ID `pid` 或作业规范 `jobspec` 指定的子进程退出，并返回最后等待的命令的退出状态。如果给了作业规范，则等待该作业中的所有进程。如果没有提供任何参数，则等待所有当前活动子进程，返回状态为零。如果\
  \ `jobspec` 和 `pid` 都没有指定 shell 的活动子进程，返回状态为 127。\n\n### `disown`\n`disown [-ar]\
  \ [jobspec]`\n从 shell 的活动列表中移除作业。如果给了 `jobspec`，则移除移除作业。如果未提供 `jobspec`，则移除所有活动作业。作业将继续运行，但\
  \ shell 在退出时不会向它们发送信号。\n\n### `suspend`\n`suspend [-f] [jobspec]`\n暂停作业的执行。如果给了\
  \ `jobspec`，则仅暂停该作业。如果未提供 `jobspec`，则暂停所有正在运行的作业。\n\n---\n\n## 常见问题\n\n如果在作业处于停止状态时尝试退出\
  \ `Bash`，shell 将打印一条消息，警告有已停止的作业。此时可以使用 `jobs` 命令来检查这些作业的状态。如果在没有中间插入命令的情况下进行第二次退出尝试，`Bash`\
  \ 将不会再次打印警告，并且已停止的作业将被终止。\n\n我应该如何查看手册页 (manual pages)？\n由于系统上的几乎每个命令都有手册。如果你想知道如何使用它，只需输入\
  \ `man` 后跟命令名称即可。例如，如果你想获取更多关于 `ls` 的信息，只需输入：`man ls`\n\n`man` 页是命令的参考。如果你想获取某个命令的更多信息，可以使用\
  \ `man` 命令快速获取。`man` 页适用于不同的程序。例如，如果你想查看终端模拟器的手册页：`man xterm`\n\n使用以下按键在 `man` 中移动：\n\
  - `e`: 向前移动一行\n- `j`: 向后移动一行\n- `f`: 向前翻一页\n- `k`: 向后翻一页\n- `b`: 向下翻\n- `y`: 向上翻\n\
  - `q`: 退出\n\n`man` 页通常是技术性的，有时难以理解。然而，手册页非常有用，因为它们一直在那里，只需一个命令即可到达。你阅读的手册页越多，就越能理解它们。\n\
  \n现在，如果你需要执行某个特定任务但不知道使用什么程序怎么办？每个手册页条目都包含程序的简短描述，但问题在于你不知道用哪种程序。通过 `apropos` 命令你可以搜索这些描述。你可以使用关键词同时搜索程序名称和描述。\n\
  \n假设你有一个压缩的 gzip 文件并想解压它。你可能想使用一个描述或名称包含 \"gzip\" 字样的程序。你可以使用 `apropos` 来寻找这样的程序：\n\
  `apropos gzip`\n`gzip (1)` - 压缩或压缩文件\n`zforce (1)` - 对 gzip 文件强制使用 .gz 扩展\n\n现在查看\
  \ `apropos` 的输出时，你可能发现 `gzip` 就是你要找的。现在你知道了命令名称，可以去阅读它的手册页：`man gzip`\n\n虽然你可以通过\
  \ `apropos` 进行非常简单的搜索，但它是一个非常强大的工具，你可以进行高级搜索。例如，可以在搜索中使用 `-w` 选项使用 shell 通配符。有关\
  \ `apropos` 的更多信息，请阅读其手册页。\n\n当 `apropos` 搜索手册页中的描述时，`whatis` 显示描述。它回答“这是什么”的问题。当然，你可以直接查看程序的手册页来看它的用途，但如果你只感兴趣程序是做什么的，可以使用\
  \ `whatis` 命令快速获取答案：\n`whatis apropos`\n`apropos (1)` - 搜索手册页名称和描述\n`whatis man`\n\
  `man (1)` -联机手册的接口\n`man (7)` - 用于格式化手册页的宏\n`whatis whatis`\n`whatis (1)` - 显示手册描述\n\
  \n阅读 `man` 命令的手册页以获取关于 `whatis` 的更多信息。\n\n\n\n\n\n# 问题 27: /proc 文件系统\n\nLINUX 中的\
  \ `/proc` 文件系统到底是什么？它是如何工作的？\n\n答：在 Linux 下，`/proc` 在 `/proc/PID` 处提供任何运行进程的信息。它还包括：\n\
  \n- 指向当前（正在遍历的）进程的符号链接：`/proc/self`\n- 关于硬件、内核和模块配置的信息\n- 在 `/proc/sys` 下可动态配置的内核选项\n\
  - 关于系统的整体信息，例如 `/proc/meminfo`，它提供了内存统计数据。\n\n使用 `/proc` 的基本实用程序位于 `procps` 软件包中。为了使之能够工作，必须挂载\
  \ `/proc`。\n\n`procfs` 在将功能从内核模式移动到用户模式的过程中起着重要作用。例如，GNU 版本的 `ps` 完全在用户模式下运行，使用\
  \ `procfs` 获取数据。\n\n`/proc` 文件系统包含一个虚拟文件系统。它并不存在于磁盘上。相反，内核在内存中创建它。它用于提供有关系统的信息（最初是关于进程的，因此得名）。下面解释了一些较重要的文件和目录。`/proc`\
  \ 文件系统在 `proc` 手册页中有更详细的描述。\n\n### `/proc/1`\n一个包含 1 号进程信息的目录。每个进程在 `/proc` 下都有一个目录，名称为其进程标识符。\n\
  \n### `/proc/cpuinfo`\n关于处理器的信息，例如其类型、制造商、型号和性能。\n\n### `/proc/devices`\n配置到当前运行内核中的设备驱动程序列表。\n\
  \n### `/proc/dma`\n显示当前正在哪些 DMA 通道。\n\n### `/proc/filesystems`\n配置到内核中的文件系统。\n\n\
  ### `/proc/interrupts`\n显示哪些中断正在使用中，以及每个中断发生了多少次。\n\n### `/proc/kcore`\n这代表系统物理内存的映像。它的大小与你的物理内存完全相同，但实际上并没有占用那么多内存；它是在程序访问它时动态生成的。（记住：除非你将其复制到别处，否则\
  \ `/proc` 下任何内容都不会占用任何磁盘空间。）\n\n### `/proc/kmsg`\n内核输出的消息。这些消息也会路由到 syslog。\n\n\
  ### `/proc/ksyms`\n内核的符号表。\n\n### `/proc/loadavg`\n系统的 `load average`（负载平均）；衡量系统目前需要做多少工作的三个无意义的指标。\n\
  \n### `/proc/meminfo`\n关于内存使用的信息，包括物理内存和交换分区（swap）。\n\n### `/proc/modules`\n当前加载了哪些内核模块。\n\
  \n### `/proc/net`\n关于网络协议的状态信息。\n\n### `/proc/self`\n指向查看 `/proc` 的程序进程目录的符号链接。当两个进程查看\
  \ `/proc` 时，它们会得到不同的链接。这主要是为了方便程序获取自己的进程目录。\n\n### `/proc/stat`\n关于系统的各种统计数据，例如自系统启动以来的页错误次数。\n\
  \n### `/proc/uptime`\n系统运行的时间。\n\n### `/proc/version`\n内核版本。\n\n请注意，虽然上述文件通常是易读的文本文件，但有时它们的格式化可能不易于理解。有很多命令的作用无非读取上述文件并对其进行格式化，以便更易理解。\n\
  \n# 问题 28: OpenGL - 硬件加速\n\n我已经安装了所有驱动程序，但在 OpenGL 上遇到了问题，Quake 3 的帧率太低，但在 Windows\
  \ 2K 上运行良好。\n\n加速我的硬件的正确步骤是什么？\n\n答：尝试使用以下命令检查 OpenGL 的 3D 硬件加速是否正常工作：\n\n```\n\
  glxinfo |grep rendering\n```\n\n这应该输出 \"direct rendering: Yes\"。如果它输出相同的内容但后面跟着\
  \ \"No\"，则硬件 3D 加速已禁用，所有渲染将由 CPU 完成。\n\n如果是 \"No\"，请检查以下内容：\n\n带有调试输出重新运行 `glxinfo`：在\
  \ bash shell 中可以通过运行以下实现：\n\n```bash\nLIBGL_DEBUG=verbose glxinfo\n```\n\n这应该会在输出的顶部提供一些额外信息。显示的常见错误是\
  \ `drm` 设备上的“permission denied”（权限拒绝）消息。这通常是因为没有为你的显卡加载 `drm` 内核模块，或者在你尝试加载它时，内核日志中存在某些错误消息。另一个原因是设置在\
  \ `drm` 设备上的权限。这可以在 `XF86Config` 的 'DRI' 部分进行配置。\n\n另一个常见错误是系统上安装了多个 `libGL` 库文件（通常是因为在当前的\
  \ XFree86 安装之上安装了不同的驱动程序和 XFree86 版本）。检查 `glxinfo` 链接到哪个 `libGL`：\n\n```bash\nldd\
  \ `which glxinfo`\n```\n\n这将输出库列表，然后寻找类似下面这一行的内容：\n\n`libGL.so.1 => /usr/X11R6/lib/libGL.so.1\
  \ (0x400a2000)`\n\n检查它指向的文件（这通常本身就是一个符号链接，继续跟踪它直到到达真实文件）。确保此 `libGL` 库与你的 XFree86\
  \ 版本或显卡驱动程序匹配。还要检查系统是否有更多（非符号链接的）`libGL` 文件。经常发生在 `/usr/` 下有一个，而 `/usr/X11` 下有另一个。\n\
  \n# 问题 29: 扫描 ide 设备\n\n我安装了一个新硬盘，执行 `fdisk -l` 命令显示磁盘为 `/dev/hdb`。\n\n列出文件系统的方法是什么？\n\
  \n答：你必须创建一个分区表，然后在分区上创建文件系统。\n\n在 `cfdisk /dev/hdb` 中（如果你有的话）或运行 `fdisk /dev/hdb`\
  \ 命令，创建一个分区表。\n\n现在创建一个分区并将其类型设置为 83。将分区表写回磁盘。退出 `cfdisk` 或 `fdisk` 工具。\n\n接下来你需要创建一个文件系统。这与\
  \ Windows 中格式化分区相同。在 Linux 中使用 `mkfs` 命令。如果你想在 `/dev/hdb1` 上创建 ext2 文件系统，执行：\n\n\
  ```bash\nmkfs -t ext2 -cv /dev/hdb1\n```\n\n此命令需要一些时间，因为它在创建文件系统时还会检查分区坏块。\n\n完成后，你可以挂载文件系统。假设你想将其挂载到\
  \ `/mnt/hdb1`。然后创建挂载点目录，之后挂载文件系统。\n\n```bash\nmkdir /mnt/hdb1\nmount /dev/hdb1 /mnt/hdb1\n\
  ```\n\n现在你可以在 `/etc/fstab` 文件中输入以下行，以便在重启 Linux 时自动挂载文件系统。\n\n如果你不想人们运行此分区上的程序，请使用\
  \ `noexec` 选项。这应该放在 fstab 条目的 `defaults` 单词旁边，例如：\n\n```\n/dev/hdb1 /mnt/hdb1 ext2\
  \ defaults 0 0\n/dev/hdb1 /mnt/hdb1 ext2 defaults,noexec 0 0\n```\n\n你可以通过查看 `mount`\
  \ 命令的手册页和 `fstab` 文件的手册页来查询所有的挂载选项。\n\n# 问题 30: 分区表\n\n分区表是什么样的？\n\n答：磁盘上可能有任意数量的分区。然而，主引导记录（MBR，磁盘的第一个扇区）仅包含\
  \ 4 个分区的描述符，称为主分区。通常 BIOS 只能从主分区启动。（当然，它可以启动一个引导加载程序，该加载程序本身能够访问非主分区或其他磁盘。）剩余分区（称为逻辑分区）的描述符以分区表扇区链的形式散布在磁盘上，从\
  \ MBR 开始。\n\n\n\n\n每个分区表扇区包含 4 个分区描述符。分区描述符的类型可能可能是 `05`（DOS 扩展分区）、`0f`（W95 扩展分区）、`85`（Linux\
  \ 扩展分区）或 `c5`（DRDOS/安全扩展分区），在这种情况下，它指向另一个分区表扇区。通过这种方式，我们获得了一个分区的四元树。Linux 接受 `85`\
  \ 作为 `05` 的同义词——这对于想要创建超过 1024 柱面限制的扩展分区的用户（以防止 DOS `fdisk` 崩溃或挂起）非常有用。Windows 95\
  \ 使用 `0f` 用于 LBA 映射扩展分区。因此，扩展分区并不是一个包含数据的分区，而是一个包含其他分区的“盒子”。尽管如此，起始扩展分区的分区表扇区留有足够的空间来包含如\
  \ `LILO` 这样的引导程序，因此启动扩展分区是可能的。\n\n大多数操作系统都严格限制了接受的树形结构。通常不允许分支，用户得到的是分区表扇区的线性链。Linux\
  \ 允许接受多个扩展主分区。\n\n### 问题 31：分区的优势\n\n对我的磁盘进行分区有什么好处？\n\nA：磁盘的分区表将磁盘分割成“逻辑磁盘”。想要这样做有几个原因。DOS\
  \ 不支持大于 2 GB 的文件系统，因此需要分区来打破这个“2 GB 屏障”。不同的分区可以携带不同的操作系统或不同的文件系统（FAT, HPFS, NTFS,\
  \ ext2, ...）供一个操作系统使用。有时，小分区被用于特殊目的（OS/2 引导管理器使用一个小分区用于自身；各种笔记本电脑都有一个“休眠”分区，当系统进入睡眠时将状态存储其中）。某些“可靠”的系统具有备份分区。为了备份目的（例如备份到磁带），拥有一个大小合适的分区，使得整个分区可以写入单个磁带是非常方便的。\n\
  \n将自己的东西（例如在 `/home` 下）和私有安装的包（例如在 `/usr/local` 下）与从发行版安装的软件分开是一个好主意。如果这些位于不同的分区上，则更容易进行完全重新安装（或切换到不同的发行版），而不会丢失自己的数据。\n\
  \n对于设计良好的系统，通常可以将所有基础系统软件放在只读分区上，从而降低损坏的概率并节省备份时间。还有安全方面；例如，在 Unix 系统上，可以将根文件系统以外的所有文件系统挂载为\
  \ 'nosuid,nodev'，并将 `/tmp`、`/home`、`/var` 不放在根文件系统中，以尽可能减少某些 suid 程序通过硬链接欺骗覆盖重要系统文件的可能性。\n\
  \n最后是旧的 BIOS 问题，可能导致无法启动位于 1024 柱面之后的系统。这可能意味着必须有一个在 1024 柱面限制之前结束的分区，用于存储启动时所需的内容。\n\
  \n### 问题 32：FDISK/MBR\n\nFDISK /MBR 的作用是什么？\n\nA：人们经常使用未定义的 DOS 命令 `FDISK /MBR`\
  \ 来解决 MBR 问题。然而，此命令并没有重写整个 MBR——它只是重写引导代码（MBR 的前 446 字节），而保留 64 字节的分区信息。因此，当分区表出现问题时，它没有帮助。此外，将引导代码恢复到原始状态可能是危险的：如果问题源是引导区病毒，那么病毒可能将重要信息存储在其他地方，而杀死病毒可能意味着丢失访问这些信息的。（例如，`stoned.empire.monkey`\
  \ 病毒会将原始 MBR 加密到扇区 0/0/3。）然而，想要卸载 `LILO` 且不知道 `LILO` 有 `-u` 选项的人可以使用 `FDISK /MBR`\
  \ 实现此。\n\n在 Linux 环境中，可以使用类似 `dd if=/dev/zero of=/dev/hda count=1 bs=512` 的命令擦除整个\
  \ MBR。如果只需要移除引导代码而不是分区表，则使用 `dd if=/dev/zero of=/dev/hda count=1 bs=446` 即可。使用此类命令时要非常小心。通常人们以后会后悔。\n\
  \n### 问题 33：硬盘分区\n\n什么是硬盘分区？\n\nA：硬盘分区是在硬盘上创建逻辑划分，允许对其应用特定于操作系统的逻辑格式化。简单来说，硬盘分区使其看起来像是多个硬盘，特别体现在每个分区如何为不同的操作系统进行格式化，以及文件如何从一个分区复制到另一个分区。\n\
  \n对硬盘进行分区允许在单个硬盘上创建多个文件系统。这有许多优点：\n- 在单个硬盘上创建多个文件系统\n- 允许双启动设置（例如 Windows 和 Linux）\n\
  - 通过只读分区保护数据\n- 隔离文件系统以防止损坏影响其他分区\n\nLinux 仅允许 4 个主分区。你可以通过细分其中一个主分区来获得数量更多的逻辑分区。只有一个主分区可以被细分。在\
  \ Linux 术语中，第一个硬盘是 `/dev/hda`，分区为 `/dev/hda1`、`/dev/hda2`。如果有第二个硬盘，将是 `/dev/hdb`，其内部分区为\
  \ `/dev/hdb1`、`/dev/hdb2`。\n\n分区有两种类型：\n1. **主分区**：包含一个文件系统。在 MS-DOS 和早版本的 Windows\
  \ 系统中，第一个分区（C:）必须是主分区。其他操作系统不受此限制。\n2. **扩展分区**：能够包含多个文件系统，称为逻辑磁盘。\n\n### 问题 34：使用\
  \ fdisk 分区\n\n我如何使用 fdisk 工具对硬盘进行分区？\n\nA：以下回答将向你展示如何使用 `fdisk` 工具对硬盘进行分区。在命令行提示符下，以\
  \ root 身份输入 `fdisk device` 启动该工具。设备可能是 `/dev/hda` 或 `/dev/sda`。你需要的基础 fdisk 命令有：\n\
  - `p`：打印分区表\n- `n`：新建分区\n- `d`：删除分区\n- `q`：退出不保存更改\n- `w`：写入新分区表并退出\n\n对分区表进行的更改在执行写入\
  \ (`w`) 命令之前不会生效。这是一个示例分区表：\n\n```\nDisk /dev/hdb: 64 heads, 63 sectors, 621 cylinders\n\
  Units = cylinders of 4032 * 512 bytes\n\nDevice Boot Start End Blocks Id System\n\
  /dev/hdb1* 1184 370912+ 83 Linux\n/dev/hdb2 185 368 370944 83 Linux (注：示例值)\n```\n\
  \n\n\n\n```text\n/dev/hdb3 369 552 370944 83 Linux\n/dev/hdb4 553 621139104 82 Linux\
  \ swap\n```\n\n第一行显示了你硬盘的几何结构。它在物理上可能并不完全准确，但你可以像接受事实一样接受它。示例中的硬盘由 32 个双面盘片组成，每面有一个磁头（这可能并非如此）。每个盘片有\
  \ 621 条同心轨道。三维轨道（所有磁盘上的同一条轨道）被称为柱面。每个轨道被划分为 63 个扇区。每个扇区包含 512 字节的数据。因此，分区表中的块大小为\
  \ `64 heads * 63 sectors * 512 bytes`……然后除以 `1024`。起始和结束值是柱面号。\n\n决定你的交换空间的大小以及它应该的位置。将剩余空间划分给其他三个分区。\n\
  \n### 示例\n\n从 shell 提示符启动 `fdisk`：\n\n```bash\nfdisk /dev/hdb\n```\n\n这表示你正在使用 IDE\
  \ 控制器上的第二个驱动器。当你打印（空）分区表时，将获得配置信息。\n\n命令（m 获得帮助）：`p`\n\n```text\nDisk /dev/hdb:\
  \ 64 heads, 63 sectors, 621 cylinders\nUnits = cylinders of 4032 * 512 bytes\n你原本有一个\
  \ 1.2 GB 的硬盘，但现在你真的清楚了：`64 * 63 * 512 * 621 = 1281982464 bytes`。为该空间预留 128Mb 用于交换空间，剩余\
  \ `1153982464`。如果你将其中一个主分区用于交换，意味着你还剩下三个分区用于 ext2 分区。平均分配的话，每个分区 384Mb。\n```\n\n\
  命令（m 获得帮助）：`n`\n\n#### 命令操作\n```text\nextended\npprimary partition (1-4)\nPartition\
  \ number (1-4): 1\nFirst cylinder (1-621, default 1):<RETURN>\nUsing default value\
  \ 1\nLast cylinder or +size or +sizeM or +sizeK (1-621, default 621): +384M\n```\n\
  \n接下来，设置你想要用于交换空间的分区：\n\n命令（m 获得帮助）：`n`\n\n#### 命令操作\n```text\nextended\npprimary\
  \ partition (1-4)\nPartition number (1-4): 2\nFirst cylinder (197-621, default 197):<RETURN>\n\
  Using default value 197\nLast cylinder or +size or +sizeM or +sizeK (197-621, default\
  \ 621): +128M\n```\n\n现在，分区表看起来将像所示：\n\n```text\nDevice Boot Start EndBlocks Id\
  \ System\n/dev/hdb1 1 196 39510483 Linux\n/dev/hdb2 197 26213305683 Linux\n```\n\
  \n最后，将第一个分区设为可启动：\n\n命令（m 获得帮助）：`a`\n\nPartition number (1-4): `1`\n\n并将第二个分区类型设为\
  \ swap：\n\n命令（m 获得帮助）：`t`\n\nPartition number (1-4): `2`\n\n十六进制代码（按 L 列出代码）：`82`\n\
  \n已将分区 2 的系统类型更改为 `82` (Linux swap)\n\n命令（m 获得帮助）：`p`\n\n#### 结果：\n```text\nDisk\
  \ /dev/hdb: 64 heads, 63 sectors, 621 cylinders\nUnits = cylinders of 4032 * 512\
  \ bytes\nDevice Boot Start End BlocksId System\n/dev/hdb1*1 196 395104+ 83 Linux\n\
  /dev/hdb2 197 262 13305682 Linux swap\n/dev/hdb3 263 458 39513683 Linux\n/dev/hdb4\
  \ 459 621 32860883 Linux\n```\n\n最后，发出写入命令（`w`）将表写入磁盘。\n\n### 问题 35：双启动\n\n我最近安装了\
  \ Fedora Core - 与 Windows 2000 双启动。我计划买一个新硬盘并在上面安装 Fedora，然后每次需要使用 Linux 时只需连接电缆即可进入\
  \ Linux。\n\n这可行吗？\n\n**A：** 你可以通过将当前硬盘设置为主盘（master）并将新硬盘设置为从盘（slave）来轻松实现双启动。为了安全起见，断开主盘电源。将\
  \ Linux 安装到从盘驱动器上。安装完成后，重启、测试，然后重新连接主盘电源。在电脑的 BIOS 中更改设置，而不是每次想切换到 Linux 时切换电缆。\n\
  \n将启动启动器从 `HDD0` 更改为 `HDD1`（查看 BIOS 如何列出它们）。Windows 必须是第一个硬盘，但 Linux 会知道它不是 \"hda\"\
  ；在这种情况下它将是 \"hdb\"。此外，通过这种方法，你可以将 Windows 硬盘挂载到运行中的 Linux 安装中并共享文件。\n\n此外，通过这种方法，你可以将\
  \ Windows 硬盘挂载到运行中的 Linux 安装中并共享文件。\n\n### 问题 36：有一种简单的方法可以启动\n\n**A：** 你可以通过将当前硬盘设置为主盘并将新硬盘设置为从盘来轻松实现双启动。为了安全起见，断开主盘电源。将\
  \ Linux 安装到从盘驱动器上。安装完成后，重启、测试，然后重新连接主盘电源。在电脑的 BIOS 中更改设置，而不是每次想切换到 Linux 时切换电缆。\n\
  \n将启动启动器从 `HDD0` 更改为 `HDD1`（查看 BIOS 如何列出它们）。Windows 必须是第一个硬盘，但 Linux 会知道它不是 \"hda\"\
  ；在这种情况下它将是 \"hdb\"。此外，通过这种方法，你可以将 Windows 硬盘挂载到运行中的 Linux 安装中并共享文件。\n\n### 第二步：分区\n\
  \n在进行分区之前，我建议你先运行 `chkdsk` 以防有坏道。\n\n插入启动盘并启动。进入 BIOS 将第一启动项设置为软盘。保存更改并退出。\n\n你的电脑应该启动并最终提示你进行选择。选择\
  \ 2 - 不带 CD 支持。\n\n运行一段时间后你会到达命令行提示符 (`A:\\`)。现在插入带有 `fdisk` 的磁盘并输入：`fdisk`。系统将提示你是否想要大磁盘支持。选择\
  \ Yes。\n\n现在你将看到一些选项。\n\n选择 1：创建逻辑分区。\n\n下一个屏幕将给出三个选项。\n\n再次选择 1：创建主分区。现在我们要创建一个主分区。如果询问使用所有空间，回答否并输入你需要的大小。如果你想要\
  \ 12G，输入 `12000`。\n\n如果你选错了，也可以返回并删除它。\n\n在这里你有两个选择。创建其他分区，或者继续并在安装 Linux 时创建其他分区。如果你想现在创建分区，请阅读下一步，否则跳到步骤\
  \ V。\n\n### 第三步：创建扩展和逻辑分区\n\n创建第一个分区后，现在返回主菜单再次选择 1：创建逻辑分区。\n\n现在我们选择 2：创建扩展分区。此分区将包含\
  \ swap、boot 和 root。\n\n在提示输入大小时，使用所有剩余空间。如果不这样做，硬盘上将出现未使用的空间。\n\n操作后，FFDISK 应该自动跳转到下一步\
  \ -> 创建逻辑分区。它会给你一条消息：“此驱动器没有逻辑分区。现在要创建一些吗？”\n\n逻辑分区就是扩展分区内的所有分区。\n\n\n\n\n选择“Yes”。现在输入第一个金额。如果你想为启动分区分配\
  \ 70MB，请输入 `70`。现在创建另一个分区并为你的交换分区（swap）输入 `512`。再次输入剩余空间作为根目录 (`/`)。\n\n### 第四步：为\
  \ Windows 格式化驱动器\n\n现在退出 `fids` 菜单，插回启动盘并重启。选择选项 2，并在提示符 (`A:\\`) 下输入：`format c:`。\n\
  \n这将格式化驱动器以便安装。完成后，重启电脑（确保已取出软盘）。进入 BIOS，将第一启动项设置为 CD ROM。\n\n现在放入 Windows CD 并保存你对\
  \ BIOS 所做的更改。Windows 将从 CD 启动并安装。安装完成后，不必安装所有驱动程序，你可以以后再做。\n\n### 第五步：安装 Linux\n\
  \n现在将带有 Linux 系统的磁盘放入 CD ROM 并重启电脑。确保你的第一启动设备已设置为 CD。\n\n运行安装程序。当被提示进行分区时，你可以直接使用现有分区并将它们分配给\
  \ `swap`、`boot` 和 `/`。否则，你可以在程序内通过手动分区创建分区。根据你偏好的尺寸创建分区并将它们分配到相应的挂载点。继续安装。\n\n当被提示安装引导加载程序时，如果有，选择\
  \ `GRUB`。`LILO` 也可以良好工作，但 `GRUB` 更好。确保将引导加载程序安装在主引导记录 (`MBR`) 上，否则你将没有启动 Linux 和\
  \ Windows 的选项屏幕。\n\n当被提示制作启动盘时，插入一张软盘并让它创建启动盘。\n\n完成后，重启，你就完成了。\n\n### 问题 37：确认\
  \ PSU 状态\n\n我的电脑上安装了 Redhat。在 BIOS 启动期间，可以看到电池缺失的提示。\n\n如何在操作系统环境中确认电池或 PSU 状态？\n\
  \n**A：** 你想要的信息在 `/proc` 目录以及 `/proc/acpi` 下。你可以执行 `cat /proc/cpuinfo` 来查看文件内容。\n\
  \n我还建议记录下你在 BIOS 中看到的所有信息，并买一个新电池。要检查 CMOS 电池的电压，请使用 `lm_sensors`。电压并无法告诉你它是否已经没电。你需要一个纽扣电池测试来测试它是好是坏。\n\
  \n### 问题 38：禁用驱动程序验证\n\n我遇到了一个与驱动程序相关的错误，但我找不到任何冲突。我尝试过禁用所有新硬件，但没有效果。\n\n如何禁用驱动程序验证？\n\
  \n**A：** 要设置文件签名验证选项，你可以执行以下操作：\n\n1. 打开控制面板中的 `System`。\n2. 在 `Hardware` 选项卡上，点击\
  \ `Driver Signing`。\n3. 在 `File signature verification` 下，点击以下项之一：\n   - `Ignore`：允许在此计算机上安装所有设备驱动程序，无论它们是否具有数字签名。\n\
  \   - `Warn`：当安装程序尝试安装没有数字签名的设备驱动程序时显示警告消息。这是 Windows 的默认行为。\n   - `Block`：防止安装程序安装没有数字签名的设备驱动程序。\n\
  \n如果你以管理员或 `Administrators` 组成员身份登录，在 `Administrator` 选项下，点击 `Apply setting as system\
  \ default` 将所选设置作为所有登录到此计算机的用户的默认设置。\n\n### 问题 39：SCSI\n\n什么是 SCSI？\n\n**A：** `SCSI`\
  \ 代表小型计算机系统接口（Small Computer System Interface）。它是一种标准，通过使用标准的硬件接口将外设备连接到计算机，该接口使用标准的\
  \ `SCSI` 命令。`SCSI` 标准可以分为 `SCSI` (`SCSI1`)、`SCSI2`（SCSI wide 和 SCSI wide fast）以及现在的\
  \ `SCSI-3`，后者由至少 14 独立标准文档组成。\n\n`SCSI2` 是 SCSI 命令规范最流行的版本，允许扫描仪、硬盘驱动器、CD-ROM 播放器、磁带等许多设备。`SCSI-3`\
  \ 解决了许多“灰色地带”，增加了许多新功能和性能改进。它还添加了新类型的 `SCSI` 总线，例如光纤（fiber channel），它使用 4 针铜线连接或对光纤电缆，而不是常见的排线连接。\n\
  \n### 问题 40：选择 SCSI 设备\n\n我想使用 `SCSI` 接口，但我该如何选择利用哪些设备？\n\n**A：** 我建议你使用支持 `LVD`、自动终止和\
  \ `SCAM`（SCSI Configured Automatically）的设备。大多数新设备都符合这种模式。此外，确保考虑这些设备所在的位置。\n\n###\
  \ 问题 41：设置 SCSI 链\n\n我如何设置 SCSI 链？\n\n**A：** 安装 `SCSI` 卡。现在的大多数卡都是即插即用的，Windows\
  \ 会快速找到并配置它们。下一步是将设备用电缆连接起来，并设置 `I.D.` 和终止（如有必要）。`SCSI` 链上的每个设备都需要它自己的 `I.D.`。\n\
  \n例如（示例为 8 设备设备链）：\n\n- `ID#0` - 硬盘\n- `ID#1` - CD-ROM\n- `ID#2` - CD-R\n- `ID#3`\
  \ - 内部 Jaz\n- `ID#4` - 扫描仪\n- `ID#5` - 硬盘\n- `ID#6` - Zip 盘\n- `ID#7` - SCSI 卡\n\
  \n如果两个设备被设置为相同的 `I.D.`，整个链可能可能无法工作，或者可能只是冲突的设备无法工作。始终确保每个设备都有不同的 `I.D.`。大多数设备都有跳线帽或小旋钮来设置\
  \ `I.D.` 数字。位于 `ID#0` 的硬盘应该是你的启动驱动器（如果你从 SCSI 启动），而 CD-ROM 设置在最低可用的 `I.D.#`，以便在\
  \ CD-R 之前为其分配驱动器号。\n\n终止是一个独立的问题，但它极大影响你的 `SCSI` 总线。`SCSI` 链末端的每个设备都必须终止。这指的是它们在链上的物理位置，而不是它们的\
  \ ID 数字。\n\n\n\n\n\n因此，除非设备支持自动终止，否则该硬盘和扫描仪必须通过设备上的跳线帽或开关设置为在通常情况下终止。在较旧的设备中，这可能实际上需要在链的末端放置一个终止器。通常情况下，这不再需要了。末端之间的所有项目都必须禁用终止功能，否则链将无法正常工作。如果你所有的都是内部设备或都是外部设备，那么卡本身本身就是一个末端设备，必须被终止。如果你有几个支持自动终止的设备和几个不支持的，你可以尝试将自动终止的设备设置在链的末端，以简化设置。\n\
  \n尽管 `SCSI` 以配置困难而闻名，但我发现它运行起来非常容易。注意上述问题，你应该就没问题了。以防万一，这里有几条故障排除提示：\n\n- 首先检查终止情况（Termination）。然后再次检查一遍。\n\
  - 检查 ID 编号。\n- 使用高质量的电缆。如果你在使用快速硬盘时遇到问题，请尝试更换电缆。\n- 尽可能使用最短的连接。注意最大总长度。\n- 确保你拥有最新的\
  \ `ASPI` 驱动程序（如果你有 Adaptec 卡，请访问 Adaptec 网站）。\n- 确保电缆插得正确且牢固：`pin 1` 对 `pin 1`。\n\
  - 如果你不确定设备是否符合 `SCAM` 标准，请将其关闭。\n- 检查 IRQ 冲突。\n\n噬 问题 42：更改屏幕分辨率\n\n我安装了 `mdv 2006`，它在\
  \ `1024X768` 下运行良好。我想提高分辨率，但当我这样做时，窗口比我的屏幕大。我必须拖动鼠标指针才能看到屏幕的顶部、底部或左、右。\n\n更改屏幕分辨率的最佳方法是什么？\n\
  \nA：你可以做以下几点：\n\n1. 安装所有可用的更新。图形系统 `X` 或 `xorg` 有好几次更新。`Mdv2006` 附带了一个 `xorg` 的开发版本，这导致了某些基于\
  \ `nvidia` 的显卡出现问题。随后的更新修复了这个问题。\n2. 你的图形系统配置文件是 `/etc/X11/xorg.conf`。这是一个相当长的文件，分为多个章节。\n\
  3. 在安装完所有更新后，重新运行图形配置实用程序。你可以打开控制台并运行：\n\n```bash\n$ su\n<enter root password>\n\
  #### XFdrake\n```\n\n会弹出一个带有 `XFdrake` 的窗口，这是 Mandriva 的图形设置实用程序。检查你是否选择了正确的显卡，并双击检查显示器设置。有一个按钮可以让你在提交更改之前测试你所做的配置。不断尝试，直到你得到可以正常测试的结果。实际上，你可能想在做其他事情之前尝试运行\
  \ `XFdrake`。顺便说一下，`XFdrake` 会自动为你编辑 `xorg.conf`，从而简化图形设置过程。\n4. Mandriva 自带了适用于你的\
  \ `nvidia` 显卡的开源驱动，名为 `nv`。那可能就是你在 `xorg.conf` 的 `Device` 章节中看到的驱动程序。Nvidia 制造了出色的闭源\
  \ Linux 驱动，但对新手来说，安装过程有点令畏。你需要 `nvidia` 驱动程序来实现运行许多游戏所需的 3d 加速。当你使用开源驱动让一切正常运行后，你可能想考虑安装\
  \ `nvidia` 闭源驱动。\n\n### 问题 43：调制解调器\n\n什么是调制解调器（Modem）？\n\nA：调制解调器是一种允许通过并非为数字设计的普通电话线发送数字信号的设备。如果所有电话线都是数字的，你就不需要调制解调器了。但有时，连接到数字电话线的模拟调制解调器替代品被错误地称为“数字调制解调器”。允许你的计算机连接并与世界其他部分通信。当你使用调制解调器时，通常使用通信程序或浏览器来利用它并在电话线上拨号。高级调制解调器用户可以设置让别人拨入他们那里并远程使用计算机。这被称为“拨入”（dial-in）。\n\
  \n简单来说，PC 有四种基本的模拟调制解调器：外部串口 (`RS-232`)、`USB` (= 外部 USB)、内部和内置。外部串口和 `USB` 设在 PC\
  \ 之外的桌子上，而另外两种类型是不可见的，因为它们在 PC 内部。串口调制解调器插在 PC 背面的称为“串口”的接口上。`USB` 调制解调器插在 `USB`\
  \ 线上。内部调制解调器是插入电脑内部的卡。内置调制解调器是主板上的芯片，主要用于笔记本电脑。内部调制解调器通常也适用于内置调制解调器。内部调制解调器根据其是为\
  \ `PCI` 或 `ISA` 总线还是 `AMR` 插槽设计进一步分为 `PCI`、`ISA` 和 `AMR`。\n\n当你获得内部或内置调制解调器时，还会获得一个专用的串口（只能用于调制解调器，而不能用于外部调制解调器或控制终端等设备）。在\
  \ Linux 中，常见的串口命名为 `ttyS0`、`ttyS1` 等（或设备系统 `devfs` 中的 `tts/0`、`tts/1`）。调制解调器通常包括发送传真的能力，而“语音”调制解调器可以像自动应答机一样。\n\
  \n### 问题 44：识别软件调制解调器\n\n如何确定内部调制解调器是否为软件调制解调器？\n\nA：首先看一眼指示它是软件调制解调器的名称、描述甚至 MS\
  \ Windows 的名称：`HSP` (主机信号处理器)、`HCF` (主机控制家族)、`HSF` (主机信号家族)、无控制器、主机控制、基于主机的。如果是这些调制解调器之一，它们仅在可用\
  \ Linux 驱动的情况下工作。由于软件调制解调器更便宜，低价格是它是软件调制解调器的线。\n\n如果你不知道调制解调器的型号且你的 Linux 上也有 Windows，请点击控制面板中的“调制解调器”图标。然后查看列表。如果上述方法不起，你可以查看调制解调器的包装包。阅读包装上写有类似“最低系统要求”或“系统要求”的部分。\n\
  \n硬件调制解调器通常在旧 CPU（如 `386` 或更高）上运行良好。因此，如果它需要现代 CPU（如 `Pentium` 或其他“高速” CPU，例如超过\
  \ `150 MHz`），这就是它是全软件调制解调器的线。如果它需要 `486` CPU（或更高），那么它很可能是一个主机控制软件调制解调器。\n\n如果它没有明确说明必须使用\
  \ Windows，你可能拥有硬件调制解调器。通过说它是“为 Windows 设计的”，可能意味着它完全支持微软的即插即用，由于 Linux 使用相同的即插即用规范，这没问题。因此，“为\
  \ Windows 设计”并不能提供关于它是否在 Linux 下工作的线索。你可能需要检查制造商网站或通过电子邮件咨询。某些制造商正在专门说明某些型号在 Linux\
  \ 下工作。有时它们是 `linmodems`，需要你获取并安装特定的 `linmodem` 驱动。\n\n### 问题 45：声音应用程序错误\n\n当我运行\
  \ Linux 然后再启动 DOS 时，声音应用程序无法正常工作。为什么会发生这种情况？\n\nA. 这发生在软重启到 DOS 之后。有时错误信息会误导性地指向一个错误的\
  \ `CONFIG.SYS` 文件。大多数目前的声卡都有软件可编程的 `IRQ` 和 `DMA` 设置。如果你在 Linux 和 MS-DOS/Windows\
  \ 之间使用不同的设置，可能会导致问题。某些声卡在不完全重置的情况下不会接受新参数。\n\n\n\n\n\n解决此问题的快速方法是使用重置按钮或电源循环来进行完全重启，而不是软重启（例如\
  \ `Ctrl-Alt-Del`）。\n\n正确的解决方案是确保在 MS-DOS 和 Linux 中使用相同的 `IRQ` 和 `DMA` 设置（或者根本不使用\
  \ DOS）。\n\n## 问题 46：配置 Linux 以支持音频\n\n配置 Linux 支持音频的正确步骤是什么？\n\nA: 请遵循以下步骤：\n\n\
  1. **安装声卡**：按照制造商的说明书安装硬件，或让您的经销商进行安装。旧的声卡通常具有针对 `IRQ`、`DMA` 通道的开关或跳线设置；请下所使用的值。如果不确定，请使用出厂默认值。尽量避免与其他设备（例如以太网卡、SCSI\
  \ 主适配器、串口和并行口）发生冲突。通常，您应该使用在 DOS 下有效的 I/O 端口、`IRQ` 和 `DMA` 设置。在某些情况下，您可能需要使用不同的设置才能在\
  \ Linux 下正常工作。可能需要反复尝试。\n\n2. **如果适用，配置即插即用（Plug and Play）**：某些声卡使用 ISA 即插即用协议来配置\
  \ I/O 地址、中断和 `DMA` 通道的设置。如果您使用的是较新的 PCI 总线类型声卡，或者使用固定设置或跳线的极旧 ISA 声卡，则可以跳过此步骤。配置即插即用卡的首选方法是使用大多数\
  \ Linux 发行版自带的 `isapnp` 工具，或从 Red Hat 网站 [http://www.redhat.com/] 下载它们。\n\n首先检查您使用的\
  \ Linux 发行版的文档。它可能已经为您设置好了即插即用支持，或者工作方式与此处描述的略有不同。如果您需要自己配置，可以在 `isapnp` 工具的帮助手册（man\
  \ pages）中找到详细信息。通常您通常会遵循的流程如下：\n\n- 使用 `pnpdump` 所有即插即用设备的可能设置，并将结果保存到文件 `/etc/isapnp.conf`。\n\
  - 选择与系统中任何其他设备不冲突的声卡设置，并取消 `/etc/isapnp.conf` 中相应的行。不要忘记取消结尾附近的 `(ACT Y)` 命令注释。\n\
  - 确保在系统启动时运行 `isapnp`，通常由一个启动脚本完成。重启您的系统或手动运行 `isapnp`。\n\n由于某些原因您无法或不愿使用 `isapnp`\
  \ 工具，还有其他选项。如果您在 Microsoft Windows 95 或 98 下使用该声卡，可以使用设备管理器设置声卡，然后使用 `LOADLIN` 程序软启动进入\
  \ Linux。确保 Windows 和 Linux 使用相同的声卡设置参数。如果您在 DOS 下使用该声卡，可以使用 SoundBlaster16 PnP 声卡附带的\
  \ `icu` 工具在 DOS 下对其进行配置，然后使用 `LOADLIN` 程序软启动进入 Linux。再次，确保 DOS 和 Linux 使用相同的声卡设置参数。真正的\
  \ ISA PnP 支持在 2.4 及更高内核中实现。某些声卡驱动程序现在支持自动检测并配置声卡，而无需 `isapnp` 工具。详情请查看声卡驱动程序的文档。\n\
  \n3. **为音频支持配置并构建内核**：您需要在内核存在适用于您的声卡的设备驱动程序。运行您系统上的内核可能已经包含了您的声卡的驱动程序。大多数情况下，驱动程序会被构建为内核可加载模块。您可以通过查看\
  \ `/lib/modules` 目录来检查哪些驱动程序作为模块可用。对于 2.4.4 内核，音频驱动程序通常出现在 `/lib/modules/2.4.4/kernel/drivers/sound/`。如果您看到了您声卡的驱动程序，可以尝试使用模块目录并跳过重新编译内核。\n\
  \n如果音频驱动程序尚未构建，您需要配置并构建新内核。您可以将音频驱动程序构建到内核中，也可以将其构建为内核可加载模块。大多数情况下优选构建为模块，因为允许您在不确定使用哪种驱动程序时轻松尝试加载不同的驱动程序，并且在不需要时卸载驱动程序以释放内存。如果您不熟悉内核模块并想要更简单的解决方案，将驱动程序构建到内核本身可能是可能的。\n\
  \n如果您以前从未配置过内核支持音频，最好阅读内核音频驱动程序带的相关文档，特别是针对您的卡类型的特定信息。这些文件可以在内核文档目录中找到，通常安装在 `/usr/src/linux/Documentation/sound`。如果该目录不存在，您可能使用的是非常旧的内核版本，或者没有安装内核源码。按照通常程序构建内核。目前配置过程有三个接口。在\
  \ X11 下运行的图形用户界面可以通过 `make xconfig` 调用。仅需要文本显示的菜单系统可以通过 `make menuconfig` 获得。原始方法使用\
  \ `make config` 提供了一个基于文本的界面。\n\n在配置内核时，会有许多选项来选择您拥有的声卡类型和要使用的驱动程序选项。配置工具中的在线帮助应提供每个选项用途的说明。根据您的知识选择合适的选项。配置好选项后，您应该编译并安装新内核。\n\
  \n4. **创建设备文件**：为了正常运行，必须为音频设备创建设备文件。这些文件通常在安装 Linux 系统期间为您创建。可以使用下面的命令对设备文件进行快速检查。如果输出所示（时间戳会有不同），则设备文件基本正常。\n\
  \n```\nls -l /dev/dsp\ncrw-rw-rw-1 root 14,3 Jan 25 1997\n```\n\n注意，拥有正确的设备文件并不保证一切。内核驱动必须先加载或编译。少数情况下，如果您认为设备文件错误，可以重新创建。大多数\
  \ Linux 发行版都有一个用于此目的的 `MAKEDEV` 脚本。注意，如果您在 2.4 内核中使用 devfs 系统，音频设备文件实际上位于 `/dev/sound`，但会有指向旧设备（如\
  \ `/dev/dsp`）的符号链接。\n\n5. **启动 Linux 内核并测试**：现在现在可以启动新内核并测试音频了。按照通常的程序安装并重启新内核。\n\
  \n如果您使用内核模块处理音频，则需要使用 `modprobe` 命令加载相应的驱动程序，例如为 SoundBlaster 卡运行 `modprobe sb`。\n\
  \n启动或加载内核模块后，使用 `dmesg` 命令检查是否有如下消息：\n\n```\nSoundblaster audio driver Copyright\
  \ (C) by Hannu Savolainen 1993-1996\nsb: AWE64 PnP detected\nsb: ISAPnP reports\
  \ 'Creative AWE64 PnP' at i/o 0x220, irq 5, dma 1, 5\nSB 4.16 detected OK (220)\n\
  sb: 1 Soundblaster PnP card(s) found.\nCrystal 4280/46xx + AC97 Audio, version 1.22.32,\
  \ 10:28:40 Apr 28 2001\ncs46xx: Card found at 0xf4100000 and 0xf4000000, IRQ 11\n\
  cs46xx: Thinkpad 600X/A20/T20 (1014:0153) at 0xf4100000/0xf4000000, IRQ 11\nac97_codec:\
  \ AC97 Audio codec, id: 0x4352:0x5914 (Cirrus Logic CS4297A rev B)\n```\n\n该消息指示已找到声卡，并匹配您的声卡类型和跳线设置（如果有）。如果您错误配置错误或选择了错误的驱动程序，驱动程序可能会显示一些错误信息和警告。\n\
  \n\n\n\n\n之前的版本的 HOWTO 建议检查 `/dev/sndstat` 的输出。在 2.4 及以后的内核中已不再支持此操作。\n\n现在，你应该准备好播放一个简单的音频文件。获取一个音频样本文件，并将其发送到音频设备，作为声音输出的基本检查，例如：\n\
  \n```\ncat endoftheworld >/dev/dsp\ncat crash.au >/dev/audio\n```\n\n（确保你没有漏掉上述命令中的\
  \ `>`）。\n\n请注意，使用 `cat` 播放音频文件的正确方法；它只是一个快速检查。你需要获取一个合适的音频播放器程序，它可以提供更好的效果。\n\n\
  如果上述命令返回“I/O error”，你应该查看使用 `dmesg` 命令列出的内核消息末尾。那里很可能打印了错误信息。很多情况下信息是“Sound: DMA\
  \ (output) timed out - IRQ/DRQ config error?”。该信息意味着驱动程序没有收到声卡预期的中断。在大多数情况下，这意味着配置给驱动程序的\
  \ `IRQ` 或 `DMA` 通道无法工作。让其运行的最佳方法是尝试设备支持的所有可能的 `DMAs` 和 `IRQs`。\n\n另一个可能原因是设备与驱动程序所配置的设备不兼容。当一个所谓的“兼容\
  \ SoundBlaster (Pro/16)”的声卡无法与 SoundBlaster 驱动程序配合时，情况几乎肯定如此。在这种情况下，你应该尝试找出你的声卡兼容的设备。\n\
  \n如果你具有音频输入能力，可以使用如下命令进行此快速测试：\n\n```\n# 从麦克风录制 4 秒音频\ndd bs=8k count=4 </dev/audio\
  \ >sample.au\n4+0 records in\n4+0 records out\n\n# 播放声音\ncat sample.au >/dev/audio\n\
  ```\n\n显然，为了让此生效，你需要将麦克风连接到声卡并对着它说话。你可能还需要获取一个混合器程序将麦克风设置为输入设备并调整录音增益水平。\n\n如果这些测试通过，你就可以完全相信声音\
  \ D/A 或 A/D 硬件和软件工作正常。\n\n某些 Linux 发行版提供了声卡驱动配置实用程序，它可以检测你的声卡并设置所有必要的配置文件，为你的声卡加载相应的音频驱动程序。例如，Red\
  \ Hat Linux 提供了 `sndconfig` 工具。如果你的发行版提供了此类工具，我建议你尝试使用它。\n\n## 第三章：安装软件\n\n## 问题\
  \ 47：Red Hat 软件包管理器\n\n### 什么是 RPM？\n\n答：RPM 代表 Red Hat Package Manager（红帽软件包管理器）。然而，在如今，RPM\
  \ 不仅是红帽特有的，因为许多其他 Linux 发行版也使用 `RPM` 管理它们的软件。例如，Mandriva 和 SuSE 都使用 `RPM` 进行软件管理。通过\
  \ `RPM`，你可以在 Linux 上安装、升级和卸载软件，并跟踪系统中已安装的 `RPM` 软件包。之所以可以实现，是因为 RPM 保留了所有通过它安装的软件的数据库。\n\
  \nRPM 使用扩展名为 `.rpm` 的软件包。一个 `RPM` 软件包包含了要安装的实际软件、可能还有软件的一些额外文件、关于软件及其文件安装位置何的信息，以及为了运行该特定软件你需要在系统中拥有的其他文件列表。\n\
  \n当你使用 `RPM` 安装软件包包时，`RPM` 会检查你的系统是否适合该 `RPM` 软件包包含的软件，确定包所提供的文件的安装位置，将它们安装到你的系统中，并将该软件加入其已安装的\
  \ `RPM` 软件包数据库中。\n\n不同的 Linux 发行版可能会将软件及其相关文件存放在不同的目录中。这就是为什么使用为该发行版制作的 `RPM` 软件包至关重要。当一个所谓的“兼容\
  \ SoundBlaster (Pro/16)”的声卡无法与 SoundBlaster 驱动程序配合时，情况几乎肯定如此。在这种情况下，你应该尝试找出你的声卡兼容的设备。\n\
  \n如果你具有音频输入能力，可以使用如下命令进行此快速测试。\n\n显然，为了让此生效，你需要将麦克风连接到声卡并对着它说话。你可能还需要获取一个混合器程序将麦克风设置为输入设备并调整录音增益水平。\n\
  \n如果这些测试通过，你就可以完全相信声音 D/A 或 A/D 硬件和软件工作正常。\n\n## 问题 48：安装和升级 RPM 软件包\n\n### 安装 RPM\
  \ 软件包的程序是什么？\n\n答：使用 `rpm` 命令配合 `-i` 选项（代表 install）来安装软件包。例如，要安装名为 `software-2.3.4`\
  \ 的 RPM 软件包：\n\n```\nrpm -i software-2.3.4\n```\n\n如果你已经在系统中安装了某个版本并想升级到新版本，使用 `-U`\
  \ 选项（代表 upgrade）。例如，如果你有 `software-2.3.3`：\n\n```bash\nrpm -U software-2.3.3\n```\n\
  \n不同的 Linux 发行版可能会将软件及其相关文件存放在不同的目录中。这就是为什么使用为该发行版制作的 `RPM` 软件包至关重要。当你在 Linux 上安装软件时，需要\
  \ root 权限。\n\n## 问题 49：依赖项错误\n\n### RPM 停止安装，我遇到了依赖错误。我该如何继续安装？\n\n答：许多 Linux 程序需要其他文件或程序才能正常工作。某个软件依赖于其他软件。当你尝试安装\
  \ RPM 软件包时，`RPM` 会自动检查其数据库以软件所需的其他文件。如果 `RPM` 在数据库中找不到这些文件，它就会停止安装软件并报告依赖项错误。\n\n\
  当你遇到依赖错误时，RPM 会列出程序需要的文件列表。列表中的文件可能是你系统中没有的，或者是你已经拥有但版本不对的文件。你必须找到 RPM 报错的那些，安装或升级这些文件，然后重新尝试安装你正在安装的包。\n\
  \n如果所需文件已存在但仍然遇到依赖错误，使用 `--nodeps` 选项。这告诉 `RPM` 在安装包之前不要检查任何依赖关系：\n\n```\nrpm -i\
  \ software-2.3.4.rpm --nodeps\n```\n\n这将强制 `RPM` 忽略依赖错误并安装软件，但如果所需文件不存在，程序将无法正常工作或完全无法工作。只有在你确定所需文件存在时才使用\
  \ `--nodeps` 选项。\n\n## 问题 50：卸载通过 RPM 安装的软件\n\n### 卸载通过 RPM 安装的软件的正确方法是什么？\n\n答：卸载通过\
  \ `RPM` 安装的软件，使用 `-e` 选项（代表 erase）：\n\n```\nrpm -e software-2.3.4\n```\n\n卸载时不需要输入包含该软件的软件包完整名称，也不输入\
  \ `.rpm` 扩展名。可能你不需要输入版本号，所以这样做与 `-e` 选项的效果完全相同：\n\n```bash\nrpm -e software\n```\n\
  \n\n\n\n\n此 `rpm -e` 命令使用 RPM 数据库检查与此软件相关的所有文件的安装位置，然后自动删除所有这些文件。在删除程序文件后，它还会从已安装软件数据库中删除该程序。\n\
  \n非常重要的一点是，你永远不要手动删除 RPM 软件（例如，使用 `rm` 删除单个文件）。如果你只是在系统中随机删除通过 RPM 安装的文件，你虽然删除了软件，但\
  \ RPM 并不知道这一点，因此它不会从其数据库中移除该软件包。结果是，RPM 仍然认为该程序已安装在你的系统上，你之后可能会遇到依赖问题。\n\n如果你使用\
  \ RPM 安装了某个软件，请也使用 RPM 来卸载该软件。\n\n## 问题 51：查询 RPM 数据库\n\n我如何列出 RPM 数据库中的软件包列表？\n\
  \n答：你可以查询 RPM 数据库以获取你 Linux 系统上软件包的信息。要查询单个软件包，请使用 `-q` 选项。例如，查询名为 \"software\"\
  \ 的包：\n\n```bash\nrpm -q software\n```\n\n执行此命令后，rpm 会 true 你该包的版本，或者提示该包未安装。\n\n\
  如果你想获取系统上安装的所有软件包列表，你必须使用 `-qa` 查询所有包：\n\n```bash\nrpm -qa\n```\n\n如果给你的是很长的列表，你需要一种方法来滚动查看。最好的方法是将列表传递给\
  \ `less`：\n\n```bash\nrpm -qa | less\n```\n\n如果你正在寻找名称包含特定单词的软件包，可以使用 `grep` 来查找这些包。例如，要获取所有名称包含单词\
  \ \"kde\" 的已安装 RPM 软件包的列表，可以执行如下操作：\n\n```bash\nrpm -qa | grep kde\n```\n\n上述命令让\
  \ rpm 列出其数据库中的所有包，并将列表传递给 `grep`。然后 `grep` 检查每一行是否包含 \"kde\"，最后向你显示所有包含单词 \"kde\"\
  \ 的行。\n\n## 问题 52：在 Linux 中从源码安装软件\n\n在 Linux 中从源码编译并安装软件容易吗？\n\n答：是的，很容易。在 Linux\
  \ 中从源码编译和安装软件并没有听起来那么困难。\n\n对于 `tar.gz` 和 `tar.bz2` 包格式软件，其安装过程并不总是相同的，但通常如下：\n\n\
  ```bash\ntar xvzf package.tar.gz (or tar xvjf package.tar.bz2)\ncd package\n./configure\n\
  make\nmake install\n```\n\n通过执行这些简单的命令，你就可以解压、配置、编译并安装软件包，你甚至不需要知道自己在做什么。然而，最好对安装过程有一个清晰的理解，并查看这些步骤代表什么。\n\
  \n### 步骤 1. 解包\n\n包含程序源码的包具有 `.tar.gz` 或 `.tar.bz2` 扩展。这意味着该包是一个压缩的 tar 归档，也称为 tarball（tar\
  \ 包）。在制作包时，源代码和其他需要的文件堆叠在一个 tar 归档中，因此有了 `tar` 扩展。在将它们全部堆在 tar 归档后，使用 `gzip` 进行压缩，因此有了\
  \ `gz` 扩展。\n\n有些人想用用 `bzip2` 而不是 `gzip` 来压缩 tar 归档。在这种情况下，包具有 `.tar.bz2` 扩展。你可以完全按照安装\
  \ `.tar.gz` 包的方式安装这些包，但在解压时使用略有不同的命令。\n\n你将从互联网下载的 tarball 放在哪里并不重要，但我建议为下载的 tarball\
  \ 创建一个特殊目录。你可以将下载的 `.tar.gz` 或 `.tar.bz2` 软件包放在任何你喜欢的目录。在这个示例中，我假设你的用户名是 Larry，并且你下载了一个名为\
  \ `pkg.tar.gz` 的包。\n\n你可以将下载的 `.tar.gz` 或 `.tar.bz2` 软件包放在任何你喜欢的目录。在这个示例中，我假设你的用户名是\
  \ Larry，并且你下载了一个名为 `pkg.tar.gz` 的包。\n\n```bash\ntar xvzf package.tar.gz\n```\n\n\
  \n\n你将从互联网下载的 tarball 放在哪里并不重要，但我建议为下载的 tarball 创建一个特殊目录。你可以将下载的 `.tar.gz` 或 `.tar.bz2`\
  \ 软件包放在任何你喜欢的目录。\n\n```bash\ntar xvzf package.tar.gz\ncd package\n./```gz\n```\n\
  \n你将从互联网下载的 tarball 放在哪里并不重要，但我建议为下载的 tarball 创建一个特殊目录。你可以将下载的 `.tar.gz` 或 `.tar.bz2`\
  \ 软件包放在任何你喜欢的目录。在这个示例中，我假设你的用户名是 Larry，并且你下载了一个名为 `pkg.tar.gz` 的包。\n\n```bash\n\
  tar xvzf package.tar.gz\ncd package\n./configure\nmake\nmake install\n```\n\n通过执行这些简单的命令，你就可以解压、配置、编译并安装软件包，你甚至不需要知道自己在做什么。然而，最好对安装过程有一个清晰的理解，并查看这些步骤代表什么。\n\
