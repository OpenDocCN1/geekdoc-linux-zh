  \n[content]\n此 `rpm -e` 命令使用 RPM 数据库检查与此软件相关的所有文件的安装位置，然后自动删除所有这些文件。在删除程序文件后，它还会从已安装软件数据库中删除该程序。\n\
  \n非常重要的一点是，你永远不要手动删除 RPM 软件（例如，使用 `rm` 删除单个文件）。如果你只是在系统中随机删除通过 RPM 安装的文件，你虽然删除了软件，但\
  \ RPM 并不知道这一点，因此它不会从数据库中移除该软件包。结果是，RPM 仍然认为该程序已安装在你的系统上，你之后可能会遇到依赖问题。\n\n如果你使用 RPM\
  \ 安装了某个软件，请也使用 RPM 来卸载该软件。\n\n## 问题 51：查询 RPM 数据库\n\n我如何列出 RPM 数据库中的软件包列表？\n\n答：你可以查询\
  \ RPM 数据库以获取你 Linux 系统上软件包的信息。要查询单个软件包，请使用 `-q` 选项。例如，查询名为 \"software\" 的包：\n\n\
  ```bash\nrpm -q software\n```\n\n执行此命令后，rpm 会告诉你该包的版本，或者提示该包未安装。\n\n如果你想获取系统上安装的所有软件包列表，你必须使用\
  \ `-qa` 查询所有包：\n\n```bash\nrpm -qa\n```\n\n如果给你的是很长的列表，你需要一种方法来滚动查看。最好的方法是将列表传递给\
  \ `less`：\n\n```bash\nrpm -qa | less\n```\n\n如果你正在寻找名称包含特定单词的软件包，可以使用 `grep` 来查找这些包。例如，要获取所有名称包含单词\
  \ \"kde\" 的已安装 RPM 软件包的列表，可以执行如下操作：\n\n```bash\nrpm -qa | grep kde\n```\n\n上述命令让\
  \ rpm 列出其数据库中的所有包，并将列表传递给 `grep`。然后 `grep` 检查每一行是否包含 \"kde\"，最后向你显示所有包含单词 \"kde\"\
  \ 的行。\n\n## 问题 52：在 Linux 中从源码安装软件\n\n在 Linux 中从源码编译并安装软件容易吗？\n\n答：是的，很容易。在 Linux\
  \ 中从源码编译和安装软件并没有听起来那么困难。\n\n对于 `tar.gz` 和 `tar.bz2` 包格式的软件，其安装过程并不总是相同的，但通常如下：\n\
  \n```bash\ntar xvzf package.tar.gz (or tar xvjf package.tar.bz2)\ncd package\n./configure\n\
  make\nmake install\n```\n\n通过执行这些简单的命令，你就可以解压、配置、编译并安装软件包，你甚至不需要知道自己在做什么。然而，最好对安装过程有一个清晰的理解，并查看这些步骤代表什么。\n\
  \n### 步骤 1. 解包\n\n包含程序源码的包具有 `.tar.gz` 或 `.tar.bz2` 扩展。这意味着该包是一个压缩的 tar 归档，也称为 tarball（tar\
  \ 包）。在制作包时，源代码和其他需要的文件堆叠在一个 tar 归档中，因此有了 `tar` 扩展。在将它们全部堆在 tar 归档后，使用 `gzip` 进行压缩，因此有了\
  \ `gz` 扩展。\n\n有些人想用 `bzip2` 而不是 `gzip` 来压缩 tar 归档。在这种情况下，包具有 `.tar.bz2` 扩展。你可以完全按照安装\
  \ `.tar.gz` 包的方式安装这些包，但在解压时使用略有不同的命令。\n\n你将从互联网下载的 tarball 放在哪里并不重要，但我建议为下载的 tarball\
  \ 创建一个特殊目录。你可以将下载的 `.tar.gz` 或 `.tar.bz2` 软件包放在任何你喜欢的目录。在这个示例中，我假设你的用户名是 Larry，并且你下载了一个名为\
  \ `pkg.tar.gz` 的包。\n\n### 步骤 2. 配置\n\n在你进入包所在的目录后，是时候进行配置了。通常情况下，通过运行该脚本完成：\n\n\
  ```bash\n./configure\n```\n\n如果 `configure` 发现错误，它会报错并退出。然而，如果一切正常，`configure` 会检查系统并分配系统相关变量。\n\
  \n### 步骤 3. 编译\n\n现在是时候从源码构建二进制文件（即程序）。这是通过运行 `make` 完成的：\n\n```bash\nmake\n```\n\
  \n注意，`make` 需要 `Makefile` 来知道该做什么。当你运行 `make` 时，你会看到大量信息填充屏幕。\n\n### 步骤 4. 安装\n\n\
  现在最后一步是安装程序。执行此操作时必须是 root 用户。如果你是以普通用户身份操作的，可以通过 `su` 命令获取 root 权限。\n\n当你是 root\
  \ 用户时，你可以通过 `make install` 命令安装程序：\n\n```bash\nmake install\n```\n\n再次，你将看到一些奇怪的消息在屏幕上滚动。在它停止后，你就成功安装了软件。\n\
  \n## 问题 53：清理杂物\n\n在 Linux 中从源码安装软件后，如何删除不需要的文件？\n\n答：当你运行 `make` 时，它创建了许多编译过程中需要的文件，但现在它们是没用了且占用了磁盘空间。这就是为什么你会想要运行\
  \ `make clean`。\n\n\n\n\n\n```bash\nme@puter: ~/dls/pkg$ make clean\n```\n\n然而，请务必保留你的\
  \ `Makefile`。如果你以后决定卸载该程序并希望尽可能减少麻烦地完成操作，那么它是必须的。\n\n## 问题 54: 卸载\n\n我想卸载我自己编译的程序，有什么方法可以实现？\n\
  \n答: 卸载你自己编译的程序并不像卸载通过如 `rpm` 等包管理器安装的程序那样简单。\n\n第一步是阅读软件软件包附带的文档，看看其中是否提到任何关于卸载的内容。如果你没有删除\
  \ `Makefile`，你可能可以通过执行 `make uninstall` 来移除程序：\n\n```bash\nroot@puter: /home/me/dls/pkg#\
  \ make uninstall\n```\n\n如果你看到屏幕上快速滚动着奇怪的文本，这是一个积极的迹象。如果 `make` 开始报错，那就是一个不妙的迹象。这时，你就必须手动删除程序文件。\n\
  \n如果你知道程序的安装位置，就必须手动删除已安装的文件或程序所在的目录。如果你不知道所有文件在哪里，你就必须阅读 `Makefile` 查看所有文件被安装到了哪里，然后将它们删除。\n\
  \n## 第四章：Linux 安装与包管理\n\n## 问题 55: 安装前准备\n\n在安装 Linux 之前我应该知道些什么？\n\n答: 如果你有该系统的\
  \ Live-CD 版本（大多数现代发行版都提供），请在硬盘上安装系统之前先下载并运行它。这可以帮助你识别硬件上可能存在的问题（某些硬件在 Linux 下可能不受支持），并让你对所选发行版的整体可用性有一个初步印象，而无需将其安装到磁盘，也不会丢失任何数据。\n\
  \n你必须知道，Linux 需要在磁盘上有一个空分区才能正确安装。如果你安装了 Windows 且只有一个系统分区（仅 `C:` 盘），那么你可以调整分区大小，或者完全删除\
  \ Windows。某些安装程序支持调整 Windows 分区大小，但并非所有程序都支持。如果你想安装一个不支持该功能的发行版，你必须在安装之前手动进行。有很多可以更改分区大小的工具，最流行的之一是名为\
  \ `Partition Magic` 的商业应用程序。不过你不必使用它，因为大多数 Linux Live-CD 都包含一个分区程序（`qtparted` 或\
  \ `GParted`），它们能够调整 Windows 分区的大小。\n\n请注意，在许多安装程序中，分区的默认值是完全格式化你的硬盘，移除所有数据（如果有的话），并在空白空间上创建\
  \ Linux 分区。如果你在磁盘上还有其他系统或重要数据，这并不是你想要的行为。在这种情况下，你不应该同意清理磁盘，而应该选择“使用空空间”或“手动格式化”选项。仔细阅读安装程序的提示以避免以后出现问题是绝对必要的。\n\
  \n某些发行版（少数）没有任何分区程序（它们只能安装在已存在的分区上）。在这种情况下，你也必须事先手动对硬盘进行分区。\n\n在某些，安装程序可能会崩溃或拒绝继续正常工作。这可能是由于\
  \ CD-ROM 刻录不当或由于安装程序的某些 Bug。也可能是某些不常见的硬件导致安装程序运行不稳定。崩溃的原因有很多。这种情况在现在的桌面机器上很少见，但在笔记本电脑上更为常见。如果你在移动电脑上安装，可以阅读笔记本电脑提示，这可能帮助你诊断问题并在机器上安装\
  \ Linux。\n\n## 问题 56: 共享磁盘\n\nGNU/Linux 和 MS Windows 可以共享磁盘吗？\n\n答: 当我们谈论 GNU/Linux\
  \ 和微软 Windows 在同一台物理机器上共存，更准确地说——在同一块硬盘上共存时，应该意识到实现这一目标并不困难。在大多数情况下，这是由 Linux 安装过程自动完成的。\n\
  \n负责在计算机启动期间选择正确操作系统的程序被称为 `boot manager`（启动管理器）。在大多数情况下，那个小型程序位于硬盘的主引导记录 (`MBR`)\
  \ 中，或者存放在磁盘上某个现有分区的第一个扇区。微软已将其自己的启动管理器嵌入 Windows 中，但遗憾的是，它无法运行微软 Windows 家族之外的任何系统。这就是为什么在大多数情况下，我们对启动管理器的选择将限于\
  \ Linux 系统（例如 `LILO` 或 `Grub`）。\n\n## 问题 57: 引导加载程序\n\n引导加载程序的作用是什么？\n\n答: 在启动时将内核加载到内存中的程序被称为\
  \ `bootloader`（引导程序）。Linux 自带的引导加载程序有 `LILO` 和 `GRUB`。如果你想更改 LILO 配置，必须使用你喜欢的编辑器打开\
  \ `/etc/lilo.conf` 文件。在该文件中，每一行都有其含义：\n\n```\nboot=/dev/hda\nprompt\ntimeout=50\n\
  default=linux\nimage=/boot/vmlinuz-x.x\nlabel=Linux\nread-only\nroot=/dev/hda3\n\
  other=/dev/hdaX\nlabel=windows\n```\n\n## 问题 58: 启动管理器的安全位置\n\n安装启动器的最佳位置在哪里？\n\n\
  答: 安装启动器的最好且安全的地方是主引导记录 (`MBR`) 的第一个扇区，在大多数情况下这是默认选项。这为我们提供了几乎所有要启动的系统列表。还有更多值得考虑的选项：\n\
  \n1. 将启动管理器安装在软磁盘或闪存内存上。在硬盘丢失 `MBR` 或由于其他原因时，这非常有用。\n2. 将启动管理器安装在磁盘上任何分区的第一个扇区，在在这种情况下，我们必须让主启动管理器指向磁盘上的任何其他启动管理器。通过这种方式，我们获得了从一个启动管理器运行其他引导程序的能力。这对于为特定系统拥有引导程序的情况非常有用，例如为同一系统编译了不同的内核，且我们的电脑上还有不同的操作系统。这种情况允许我们在\
  \ `MBR` 中编写一个包含多达四个系统的启动菜单。\n\n## 问题 59: 恢复启动管理器\n\n当 Windows 已经删除了启动管理器时会发生什么情况？\n\
  \n答: 当我们想在硬盘上拥有两个系统时，先安装 MS Windows 会更方便。微软操作系统存在一个已知问题，它们除了自己之外看不见任何东西。Linux 系统更加友好，并且能够与已安装在硬盘上的系统共存。在安装过程中，用户会被询问新的\
  \ Linux 系统是应该安装在整个可用空间上，还是只占用硬盘的未用部分。如果选择了该选项，Linux 将为自己创建一个新分区并进行安装，而不会干扰其他系统。\n\
  \n\n\n\n\n当我们在安装 Linux 之后安装 `MS Windows` 时，极有可能 `Windows` 已经覆盖了默认的启动管理器。在这种情况下，我们必须恢复启动管理器，以便使我们能够正常启动两个系统。\n\
  \n解决这个问题有几种可能的方法。最简单的方法之一是将 Linux 发行版的 LiveCD 插入 CD 或 DVD 驱动器，然后使用 `chroot` 工具挂载我们\
  \ Linux 系统的根分区，并 `chroot` 切换到该发行版的根目录。如果我们假设我们的 Linux 系统安装在 `hda5` 分区上，且文件系统为 `reiserfs`，那么我们应该执行以下系列命令：\n\
  \n```bash\ncd /tmp\nmkdir our_root_dir\nmount -t reiserfs /dev/hda5 our_root_dir\n\
  chroot our_root_dir\n```\n\n现在，我们可以像登录到 Linux 系统一样进行操作。最后一步是安装被 `MS Windows` 抹除的启动管理器。如果你决定将其作为下一步，请根据我们安装的启动管理器——`grub`\
  \ 或 `lilo` 遵循相应的后续步骤：\n\n```bash\nupdate-grub\nor\nlilo -v\n```\n\n## 问题 60：准备工作\n\
  \n我如何准备安装？\n\n答：Linux 对 PC 硬件的使用比 `MS-DOS`、`Windows` 或 `NT` 更有效，因此对硬件配置错误的容忍度也较低。在开始之前，你应该做几件事，以减少被此类问题阻的概率。\n\
  \n第一步是收集你所有的硬件说明书；主板、显卡、显示器、调制解调器等，并将它们放在手可及的地方。\n\n下一步是收集硬件配置的详细信息。如果你运行 `MS-DOS`\
  \ 5.0 或更高版本，实现此点的简单方法是从微软诊断工具 `msd.exe` 打印报告（你可以忽略 `TSR`、`driver`、`memory-map`、`environment-strings`\
  \ 和 `OS-version` 部分）。这将确保你获得显卡和鼠标类型的完整正确信息，这对以后配置 `X` 有帮助。\n\n第三，检查你的机器是否存在支持硬件的配置问题，这些问题可能会在\
  \ Linux 安装期间导致无法恢复的死机。\n\n使用 IDE 硬盘和 CD-ROM 的 `DOS/Windows` 系统即使在硬盘上的主/从跳线设置错误的情况下也可能是正常运行。Linux\
  \ 不会这样。如果有疑问，请检查你的主/从跳线。\n\n如果你的任何外设硬件既没有配置跳线，也没有非易失性配置内存，那么它可能需要通过 `MS-DOS` 工具在启动时进行初始化，并且在\
  \ Linux 中可能无法访问。CD-ROM、声卡、以太网卡和低磁带驱动器可能有这个问题。如果是这样，你可能可以通过启动提示符的参数来绕过这个问题，详情请在 Google\
  \ 上搜索 `Linux`。\n\n其他某些操作系统允许总线鼠标与其他设备共享 `IRQ`。Linux 不支持这一点，尝试这样做可能会导致你的机器死机。我建议你对将使用的总线鼠标要有详尽的信息。\n\
  \n## 问题 61：使用 Fips 或 Loadlin 在 Windows 上安装 Linux\n\n我如何能以磁盘镜像的形式在 Windows 分区上安装\
  \ Linux？\n\n答：现在可以使用所谓的回环文件系统（loopback filesystem）在 Windows 分区上作为磁盘镜像安装 Linux。`Red\
  \ Hat` 和 `Mandrake` 这种这种，但由于 `Windows` 处理文件的方式，这是一个极其糟糕的主意。系统碎片整理将变成一场噩梦，Linux 本身会运行极其缓慢，并且会破坏你的\
  \ `Windows` 和 Linux 体验。`Umsdos` 文件系统也是如此，尽管 Linux 不会变慢，最好的做法是将 Linux 安装在它自己的分区上。假设：\n\
  \n- 你正在使用 `Windows` 98 或更高版本。\n- 你熟悉电脑，知道如何使用软盘或 CD-ROM 启动系统。\n- 你熟悉 `DOS` 以及 `Windows`。\n\
  - 你知道什么是分区，并想在它自己的分区上安装 Linux。\n- 你有一个大于 4GB 的硬盘——目前存有 `Windows`——并打算在上面安装 Linux（由于主板最多只能放置\
  \ 4 个 IDE 设备）。\n\n要做的第一件事是为 Linux 在空空间创建一个分区，这通常是 `Windows` 的 `C` 盘。你可以在这个空间内为 Linux\
  \ 建立一个独立的分区（这通常会被标记为 `D:`）。你可以使用 `Windows Fdisk`（Windows Fdisk 不会在硬盘上创建超过一个主分区）在不丢失数据的情况下，从头创建分区，一个用于\
  \ Windows，一个用于 Linux，或者使用一个更简单、更方便的非破坏性分区工具 `Fips`。`Fips` 的特殊之处在于它可以在你的 `C` 分区的空空间创建新的主分区而不会丢失任何数据。`Fips`\
  \ 的最新版本 (2.0) 可在其主页获取，大多数 Linux 发行版都将其放在 `/dostools` 或 `/dosutils` 目录下。\n\n我们将专注于使用\
  \ `Fips`，而不是使用 `Windows Fdisk`（这实际上完全没有必要，除非你买了一台新系统，即使如此，更好的做法是在上面安装 Windows，然后使用\
  \ `Fips` 进行拆分，原因将在后解释）。\n\n硬盘最多可以有 4 个主分区。除了主分区，硬盘还可以有一个所谓的扩展分区，扩展分区可以包含多个逻辑分区。扩展分区不像主分区或逻辑分区的地方在于它们不存储数据，而是逻辑分区的容器，数据实际上存储在逻辑分区中。因此在\
  \ Windows 中，`C:` 是主分区，如果你使用了 `Windows Fdisk`（Windows Fdisk 不会在硬盘上创建超过一个主分区），`D:`\
  \ 通常是扩展分区的第一个逻辑分区。`E:` 是第二个逻辑分区，依此类推。Linux 的情况略有不同。第一个主分区被称为 `/dev/hda1`，第二个主分区为\
  \ `/dev/hda2`，直到第四个主分区 `/dev/hda4`。Linux 将扩展分区称为（在只有一个主分区和一个扩展分区的磁盘情况下）主分区为 `/dev/hda1`，扩展分区为\
  \ `/dev/hda2`。扩展分区的逻辑分区被称为 `/dev/hda5`、`/dev/hda6` 等等此类推。第二个硬盘被称为 `/dev/hdb`，第三个为\
  \ `/dev/hdc`（如果设置为从主，通常是光驱驱动器），第四个也是最后一个硬盘为 `/dev/hdd`（最后是因为主板最多只能放置 4 个 IDE 设备）。SCSI\
  \ 设备被称为 `/dev/sda`。\n\n`Fips` 在你硬盘的空空间创建一个新的主分区。这本质上是一项危险的操作，如果发生任何问题，备份所有重要数据是个好主意。除非硬盘本身就有问题，否则\
  \ `Fips` 基本上是成功的。\n\n\n\n\n下一步是让你决定如何启动进入 Linux。默认且最常用的方法是使用 `Lilo`。它是一个简单且基础的引导加载程序，它会在（保存后）覆盖你硬硬盘的\
  \ `MBR`（主引导记录），并在系统启动时允许你在这启动 Windows 或 Linux 之间进行选择。如果你选择 Windows，它就会启动 Windows，你将看到熟悉的\
  \ Windows 界面；如果你选择 Linux，它就会启动 Linux，且如果你在规定时间内没有做出选择，它将启动默认操作系统（Windows 或 Linux，取决于你是如何设置的）。你可以随时恢复原始的\
  \ MBR，例如在卸载 Linux 时，可以通过在 Linux 中输入 `/sbin/lilo -u`，或者在 DOS 中输入 `fdisk /MBR`（这将用原始的\
  \ Windows MBR 覆盖 MBR）。\n\n### Lilo 的问题\n使用 `Lilo` 的问题在于，特别是对于那些拥有大硬盘的用户来说，你必须为 Linux\
  \ 放弃很大一部分的磁盘空间。这不是一个灵活的解决方案，因为虽然你可以在 Linux 内部访问你的 Windows 分区，但大型 MPEG 文件可以存储在 Windows\
  \ 中并被两个操作系统访问。请注意，BIOS 无法访问超出这 1024 柱道限制的数据，而 `Lilo` 依赖 BIOS 来启动操作系统。因此，如果你想使用 `Lilo`\
  \ 启动 Linux，请确保 Linux 分区远低于 1024 柱道限制。大多数现代硬盘的柱道超过 1024，使用 `Lilo` 意味着将 Linux 分区设置在大约\
  \ 1000 或 1010 柱道处，这相当于给 Linux 分配了 12.9Gb 中的巨大 5.2Gb。\n\n### Loadlin 作为替代方案\n`Lilo`\
  \ 一个被低估的替代方案是使用 `Loadlin`，特别是对于大硬盘用户。这是一个极佳的替代方案，因为你不需要担心 1024 柱道限制。更好的是你可以从 Windows\
  \ 桌面启动 Linux，并修改你的 `autoexec.bat` 文件，让你在启动时获得进入任一系统的选项，这与 `Lilo` 类似。你就可以随心所欲地调整分区大小。例如，带有\
  \ 3 个逻辑分区的 2.2Gb 扩展分区。创建三个分区是正常的：一个用于内核引导文件，一个用于根分区，一个用于交换分区。\n\n### 准备硬盘\n现在我们准备好实际对硬盘进行分区了。首先制作一个\
  \ DOS 启动盘（在 DOS 提示符下或 DOS 中输入 `format a: /s`）。将以下三个文件放入磁盘：`fips.exe`、`restorrb.exe`\
  \ 和 `errors.txt`。对你的硬盘进行碎片整理；这将所有数据放在开头，为 `Fips` 创建新分区留出足够的空间。如果你使用 `Norton Speed\
  \ Disk`，选择未碎片的空空间选项。Norton 通常将数据放在磁盘末尾，这将防止 `Fips` 创建新分区。运行 `Scandisk` 并使用你刚刚创建的启动盘重启。\n\
  \n### 使用 Fips 进行分区\n在提示符处输入 `fips`，`Fips` 将向你显示分区表，并附带一个关于分区表不一致的警告。如果你的硬盘超过了 1024\
  \ 柱道，通常可以忽略此警告。接下来 `Fips` 将询问你是否继续，该程序非常详尽；回答 yes，并在提示保存分区表和引导扇区的备份时回答 yes。这一步至关重要，因为它允许在发生任何故障时将你的硬盘恢复到未分区的单分区状态。如果你想卸载\
  \ Linux 或调整 Linux 分区大小，它也十分有用。在此期间新分区发生了什么都没关系，只要你有备份，就可以将硬盘恢复到原始的未分区状态。这种可逆的操作在所有情况下都有效，除非你格式化了为了给\
  \ Linux 腾空间而分割的原始（Windows）分区，原始 FAT 会被新的较 FAT 覆盖，恢复操作将无法进行。\n\n### 调整分区大小\n制作备份后，你将看到一个显示三个数字的屏幕，第一个代表你的原始分区（尺寸最小），`Fips`\
  \ 将硬盘中的所有空闲空间分配给了新分区，因为这是默认行为。第二列显示柱道信息，这将为计划使用 `Lilo` 的用户提供指南。第三列显示你将创建的新分区的大小。使用方向键来调整分区大小；你只需要将处于最大值的的新分区尺寸减小到你想要的大小即可。对于\
  \ `Lilo` 用户，新分区必须在 1024 柱道标记以下，1000 是新分区的合理起始点。在你对新分区的大小满意后按回车键，`Fips` 将要求你确认并写入新的分区表。\n\
  \n### 最后步骤\n重启你的系统。记得更改 BIOS 设置为从硬盘启动，否则你最终将用软盘重启。双击“我的电脑”，你将看到所有努力的结果，在原始 C 盘旁边会有一个标记为\
  \ D 的新驱动器。不要碰 D，在你的原始分区（C）上运行 `scandisk`。如果没有错误，你就可以准备安装 Linux 了。\n\n某些 Linux 文档错误地要求你使用\
  \ Windows `Fdisk` 删除新创建的分区。不要犯这个错误，因为如果你这样做，在安装 Linux 后重启时，Linux 分区将出现在“我的电脑”中，由于\
  \ Windows 显然无法读取这些驱动器的 ext2 文件系统，在 Windows 中访问它们将变成一项耗时且费力的工作。\n\n### Linux 安装\n\
  使用你的 Linux 安装光盘重启（我们专注于我觉得相当 Redhat 6.2）。大多数 Linux 发行版都对安装程序做了很好的改进，你不遇到问题。只需准备好有关硬件的细节：显示器的水平和垂直刷新率（以防安装程序自动检测）、显卡、其内存类型（SDRAM\
  \ 或 SGRAM）以及大小，以及你的鼠标类型——PS2 或串口。如之前提到的，你必须为 Linux 创建大约 3 个分区（3 是推荐数量）。有三种主要的安装类型：工作站（Workstation）、服务器（Server）和自定义（Custom）。服务器类安装会擦除硬盘上的所有内容，所以要小心。工作站和自定义安装有子类，但那是供你探索的。\n\
  \n`Loadlin` 用户必须自定义安装并在有机会时放弃 `Lilo`，因为其他类型的安装默认安装 `Lilo` 而不询问。`Lilo` 用户没有限制；你可以选择任何喜欢的安装类型。\n\
  \n\n\n然而，打算使用 `Loadlin` 的用户无法使用 `Disk Druid`，他们必须使用 `Linux Fdisk`，虽然它的名声可能人生畏，但实际上非常简单。在出现安装类型界面，选择\
  \ `custom` 并使用 `fdisk`（你会在屏幕顶部找到一个带有 `fdisk` 字样的按钮）。由于某种原因，如果你的 `/boot` 分区超过了 `1024`\
  \ 扇限制，`Disk Druid` 不让你继续安装，因此如果你尝试用它创建分区，安装程序将拒绝继续。\n\n`Fdisk` 是一个非常直观且易于使用的程序。首先，你必须使用\
  \ `Fips` 删除刚刚创建的分区。很多人不理解为什么要冒着风险删除刚刚创建的分区。这个新分区实际上是一个 `FAT32` 分区，Linux 无法使用，当你删除它时，它不会变回\
  \ `C`盘的一部分，而是变为 `UNPARTITIONED FREE SPACE`（未分区空闲），你可以用它创建新分区。\n\n### Fdisk 操作\n\
  你必须理解几个 `Fdisk` 操作：\n- 输入 `m` 列出所有选项；\n- 在提示符处输入 `p` 显示当前分区表；\n- `d` 删除分区；\n- `n`\
  \ 创建分区；\n- `q` 退出且不保存更改（所以如果你犯了任何错误，无用担心，只需输入 `q` 重新开始即可）；\n- `w` 将更改写入分区表（仅在确认后使用）；\n\
  - `L` 显示不同分区类型的十六进制数（你只需要知道两个：`Linux native` 的十六进制数是 `83`，`Linux swap` 的十六进制数是 `82`）。\n\
  \n虽然 `Disk Druid` 允许你在不进入十六进制的情况下挂载交换分区，但在 `Fdisk` 中，创建交换分区的唯一方法是给它分配正确的十六进制数，即\
  \ `82`。\n\n### 分区过程\n让我们开始吧，在 `Fdisk` 提示符处输入 `p`，你将看到当前分区表。输入 `d` 并选择你想删除的分区，在这种情况下是\
  \ `/dev/hda2`（直接输入 `2`），再次输入 `p`，你将看到分区表中反映了变化。\n\n现在将只有一个 `FAT32` 分区 `/dev/hda1`（实际上是\
  \ `C` 盘）。输入 `n` 创建新分区，分区类型在 `primary` 或 `extended` 之间选择 `e`。这方面没有硬性规定。例如，你可以为 `/boot`\
  \ 设置一个主分区，并设置包含两个逻辑分区 `/` 和 `swap` 的扩展分区。我建议设置一个包含三个逻辑分区的扩展分区。\n\n现在你必须正确调整扩展分区的大小，因为它是三个逻辑分区的容器。从现在起你只需要响应\
  \ `Fdisk` 的提示。它会要求你设置要创建的扩展分区的大小。该分区将从你的 Windows 分区结束处开始，到磁盘末尾结束。你可以以 `M`（兆字节）扇区数或\
  \ `K`（千字节）提供大小。接受分区起始位置的默认值，并选择结束扇区号——`Fdisk` 会给你提供结束扇区号。\n\n对三个逻辑分区重复此操作，但这次你必须选择\
  \ `logical` 而不是 `extended` 以及适当的大小：\n- 引导分区使用 `16Mb`；\n- 交换分区使用 `127Mb`（交换分区的大小取决于安装的内存，建议为内存的两倍）；\n\
  - 剩余空空间用于根 (`/`) 分区。\n\n创建完三个分区后，输入 `p`，你将看到刚刚创建的分区。将会有 `/dev/hda2`（扩展）、`/dev/hda5`（逻辑）、`/dev/hda6`（逻辑）和\
  \ `/dev/hda7`（逻辑）。只剩最后一件事：为交换分区设置十六进制数。输入 `t` 并选择你创建的 `127Mb` 分区（即 `/dev/hda6`），输入分区号\
  \ `6` 和十六进制数 `82`（系统会提示你输入），你就完成了分区。在确认无误后输入 `w`，`Fdisk` 将写入新的分区表并退出。\n\n### 完成安装\n\
  下一个屏幕将是 `Lilo` 朋友们已经见过的 `Disk Druid` 界面，你只需要用 `Disk Druid` 挂载分区。选择 `/dev/hda5`（`16Mb`\
  \ 分区）并将其挂载为 `/boot`。选择 `/dev/hda7` 并将其挂载为 `/`（根分区）。\n\n其余安装步骤非常直观。选择你需要的软件包，在有机会时选择启动磁盘（这对\
  \ `Loadlin` 用户来说绝对关重要），并重启系统。`Lilo` 用户应在 `Lilo` 提示符处按 `dos` 进入 Windows。`Lilo` 用户这次应重启系统，并在\
  \ `Lilo` 提示符处输入 `linux` 进入 Linux，根据你所做的选择，你将进入控制台或 `gnome`/`kde` 桌面。先登录控制台而不是图形界面启动\
  \ `X` 始终是个好主意，因为如果 `X` 崩溃，你仍然可以访问系统进行补救。\n\n`Lilo` 设置为启动进入 Linux。在 `Lilo` 提示符处输入\
  \ `linux`，根据你的选择，你将进入控制台或 `gnome` 或 `kde` 桌面。\n\n\n\n将此文本保存为 `linux.bat`，如果你的 Windows\
  \ 根目录下已经存在 `linux.bat`，你可以将其放在其他目录中或为其重命名。在你的 `autoexec.bat` 文件中添加以下行：`c:\\linux`。如果你使用\
  \ `.bat` 文件，关键点在于告诉 `Loadlin` 在哪里寻找内核镜像文件（`vmlinuz`）。上面的 `.bat` 文件让你拥有一个选项：通过在五秒内输入\
  \ `y`（代表 Linux）或 `n`（代表 Windows），在 Windows 加载之前进入 Linux，否则它将启动 Windows。\n\n## 问题\
  \ 62：移除 Linux 并恢复 Windows 分区\n\n我如何使用 Lilo 或 Loadlin 移除 Linux 并将 Windows 恢复到原始状态？\n\
  \n答：移除 Linux 取决于你使用的是 `Lilo` 还是 `Loadlin`。`Lilo` 用户必须先恢复原始的 MBR，可以在 Linux 中输入 `/sbin/lilo\
  \ -u` 或者在 DOS 中输入 `fdisk /MBR`。接下来的步骤对于 `Loadlin` 和 `Lilo` 用户都是通用的。这些步骤并不是绝对必要的，但为了保险起见，请尝试执行。\n\
  \n使用 Linux 安装光盘启动，并在第一个提示处输入 `Linux expert`，对后续问题回答你的任何内容，直到进入安装选择界面。在这里，选择 `Install`\
  \ 和 `With Fdisk`，并使用 `Fdisk` 删除所有 Linux 分区。将更改写入磁盘，然后通过 `Ctrl–Alt–Delete` 退出安装程序或重置系统重启。记得更改\
  \ BIOS 设置为从硬盘启动，否则你将再次从光驱启动。\n\n再次重启，这次使用带有你的分区表和引导扇区备份的 `fips` 磁盘，并在提示处输入 `restorrb`。在问题上回答\
  \ `yes`，程序将恢复你的分区表和引导扇区。现在你已经找回了丢失的分区空间。这正是为了确保将关键备份文件（`Rootboot.000`）保在至少几个不同的位置的原因。有患于未然。重启回到\
  \ Windows 并在新扩展的 `C` 盘上运行 `scandisk`。它会报告 `fsinfo` 扇区有一个错误，这只是一个使用空间和可用空间的统计错误。你的\
  \ Linux 数据现在自然已经永久丢失了。希望除非你正在增加分配给 Linux 的空间或准备放弃 Windows，否则不需要这个步骤。\n\n## 问题 63：选择软件包\n\
  \n我应该安装哪个软件包？\n\n答：Linux 软件是以“软件包”形式提供的。例如，Linux Mandrake 7.0 安装光盘包含了 1002 个软件包。Mandrake\
  \ 7.2 封装了 2 张软件 `CDs`，会在硬盘上放置 1123 个软件包。`Mandrake` 倾向于比 `RedHat` 封装更多的软件。\n\n无论什么种发行版或版本，光盘包含的软件包可以让基础操作系统（`kernel`、`libraries`、一组命令行配置和维护工具等）成为丰富的网络“客户端”和服务器选择，并带有适当的配置和监控工具、一些用户端文本模式应用程序、基础\
  \ X 窗口系统以及至少一个 GUI 桌面及其应用程序。\n\n安装程序（无论是 `RedHat` 还是 `Mandrake`）都会询问你想安装哪些软件包。如果你选择“workstation\
  \ installation”（工作站安装），那么通常在服务器上找到的软件包将从你的安装中省略。如果你选择“server installation”（服务器安装），则通常不会安装用户端桌面应用程序。你也可以选择安装“everything”（所有内容），这是家庭计算机安装的一个流行选项。如果你是新手，信任发行版创建者所选择的默认值是有价值的。\n\
  \n我建议你避开那个诱人的安装选项“expert install--select packages manually”（专家安装——手动选择软件包），除非你确实想安装所有内容。起初，我喜欢安全的“max\
  \ default installation”（最大默认安装），尽管这个安装选项在你的 `CD` 上被称为其他的。\n\n你可以轻松安装以后可能发现需要的软件包。\n\
  \n## 问题 64：KDE 还是 GNOME\n\n我应该安装哪种 GUI 桌面，KDE 还是 GNOME？\n\n答：如果你有足够的磁盘空间，绝对两个都安装。你之后可以决定偏好\
  \ `KDE`、`GNOME` 还是其他桌面，但无论你的选择是什么，你都绝对希望安装好 `KDE` 和 `GNOME` 库。一旦安装了这些库，`KDE` 程序可以在\
  \ `GNOME` 下运行，反之亦然，这非常棒，因为有很多使用任一库编写的优良应用程序。至于磁盘空间，“桌面”只是 `KDE` 和 `GNOME` 系统的一小部分，所以你通过省略桌面并尝试只安装“库”并不会多少空间。`GNOME`\
  \ 和 `KDE` 都带有一组很好的程序和工具，因此完整安装两个桌面绝对值得。我从未听说过两者会互相产生负面干扰。对于日常工作，使用 `KDE` 桌面，因为它感觉比\
  \ `GNOME` 更稳固。\n\n你也可以安装其他的“替代窗口管理器”。它们几乎不占空间，在某些情况下可能很有用。只要安装了 `KDE` 和 `GNOME`\
  \ 库，`KDE` 更消耗资源。在旧硬件上（例如 133 MHz），`GNOME` 优于 `KDE`。因此在非常有限的硬件上，请选择一个。\n\n## 问题 65：以\
  \ root 登录\n\n我完成了安装。第一次如何登录？\n\n答：以 `root` 登录。“root”是初始安装后唯一账户（较新的安装程序会提示你创建一个普通用户账户）。文本模式示例：\n\
  \n```\nmy_machine_name login: root\nPassword: my_password\n```\n\n在上面的示例中，我在提示处输入了单词\
  \ `root`。之后，我输入了初始安装时选择的密码。当我输入时，屏幕上没有显示密码（出于安全考虑）。登录后，我发现自己处于文本模式终端。\n\n如果你安装了登录界面，登录过程类似，但在\
  \ X 窗口屏幕上进行（如果你在那里遇到问题，可能要记住鼠标光标必须在对话框上方。X 登录屏幕实现了鼠标跟随焦点策略）。成功登录后，我的默认 GUI 桌面启动。\n\
  \n“root”是一个对系统拥有绝对权限的特殊账户，用于系统管理。你以后一定要再创建一个“用户”账户来进行日常工作。\n\n## 第五章 设备、Linux 文件系统、文件层次标准\n\
  \n## 问题 66：根文件系统\n\n根文件系统的特点是什么？它是如何工作的？\n\n答：根文件系统通常应该很小，因为它包含了非常关键的文件，较小且不经常修改的文件损坏的概率较低。根文件系统损坏通常意味着系统除非采取特殊措施（例如从软盘），否则无法启动，因此你不想冒这个风险。\n\
  \n根目录通常不包含任何文件，除非在旧系统上，系统的标准启动镜像（通常称为 `/vmlinuz`）保存在那里。（大多数发行版已将这些文件移动到 `/boot`\
  \ 目录。否则，所有文件都保存在根文件系统的子目录下：\n\n`/bin` - 启动期间需要且普通用户可能使用的命令（可能在启动后）。\n\n\n\n\n\n\
  - `/sbin` - 类似于 `/bin`，但其中的命令并非为普通用户设计，尽管他们在必要且允许的情况下可以使用这些命令。`/sbin` 通常不在普通用户的默认路径中，但会在\
  \ root 用户的默认路径中。\n- `/etc` - 机器特定的配置文件。\n- `/root` - 用户 root 的家目录。通常系统上的其他用户无法访问此目录。\n\
  - `/lib` - 根文件系统上的程序所需的共享库。\n- `/lib/modules` - 可加载内核模块，特别是那些在从灾难中恢复时启动系统所需的模块（例如网络和文件系统驱动程序）。\n\
  - `/dev` - 设备文件。这些是特殊文件，帮助用户与系统上的各种设备交互。\n- `/tmp` - 临时文件。如名所示，运行中的程序经常将临时文件存储在此处。\n\
  - `/boot` - 引导加载器（例如 LILO 或 GRUB）使用的文件。内核镜像通常保存在这里而不是在根目录下。如果有很多内核镜像，该目录可能会变得非常大，可能最好将其放在单独的文件系统中。另一个原因是确保内核镜像位于\
  \ IDE 磁盘的前 1024 个柱面内。在大多数情况下，这 1024 柱面的限制已不再适用。通过现代 BIOS 和更高版本的 LILO（Linux 加载器），可以使用逻辑块寻址（LBA）突破\
  \ 1024 柱面限制。更多细节请参见 lilo 手页。\n- `/mnt` - 系统管理员临时挂载的点。程序不应自动挂载到 `/mnt`。`/mnt` 可能被分为子目录（例如\
  \ `/mnt/dosa` 可能是使用 MS-DOS 文件系统的软磁盘，而 `/mnt/exta` 可能是使用 ext2 系统的磁盘）。\n- `/proc`,\
  \ `/usr`, `/var`, `/home` - 其他文件系统的挂载点。尽管 `/proc` 实际上并不存在于任何磁盘上，但仍在此提及。\n\n## 问题\
  \ 67：Linux 中的文件\n\nLinux 如何处理文件名？什么是隐藏文件和隐藏目录？\n\n**答:** 请务必记住文件名是区分大小大小的。这意味着 `PFile`\
  \ 与 `pfile` 或 `PFILE` 不是同一个东西。\n\nLinux 不像 MS Windows 那样使用文件扩展名。你可以按照喜好命名所有文件，因为文件的类型和用途是通过其他方式确定的。当然，如果你觉得文件名扩展名有助于你更快地判断文件类型，那么可以使用扩展名，这也是一种良好的习惯。\n\
  \n你系统上的文件比你能看到的要多，这些就是隐藏文件。例如，进入你的家目录并使用 `ls` 列出内容。你会在那里看到一些文件和目录，但并没有看到所有文件，因为某些文件是隐藏的。当你想要显示所有文件（包括隐藏文件）时，使用\
  \ `-a` 选项：\n```bash\n$ ls -a\n```\n\n当文件名以点开头时，它就是一个隐藏文件，当你进行常规目录列表时是看不到它的。目录也可以以同样的方式隐藏；在目录名称前加一个点，当你进行常规目录列表时，就看不到该目录或其内容。\n\
  \n通常这些隐藏文件是配置文件，大多数在你创建用户账户时被放置在你的家目录中。它们用于配置与你的账户相关的不同内容，某些应用程序也会将配置和设置文件以隐藏文件的形式存储在你的家目录或隐藏目录。隐藏配置文件是一个优势，因为它们不会弄乱你的家目录，这样你就能更容易找到其他文件。\n\
  \n## 问题 68：Linux 文件系统\n\n我如何在 Linux 文件系统中移动？\n\n**答:** Linux 系统上的文件按照类似于 MS Windows\
  \ 的分级目录结构排列。这意味着文件是按树状的目录（或 Windows 中的文件夹）模式组织的。这些目录可能包含文件或其他目录，而这些目录目录又可能包含更多文件或目录，依此类推。\n\
  \n在 Linux 系统中，所有的文件和目录都位于同一棵树下，这与 Windows 不同。系统中的第一个目录（即树开始的地方）被称为根目录。Linux 系统上的每一个、每一个文件和目录都在这个根目录下。\n\
  \n就像图形化文件管理器一样，你在命令行界面（CLI）时始终在一个目录中工作，该目录可以位于文件系统树的任何位置。目录包含文件，以及进入其父目录及其子目录的方法。你当前所在的目录被称为工作目录。要查找工作目录的位置，请使用\
  \ `pwd` 命令，它的含义是“打印工作目录”。现在输入它并看看你在哪里。\n\n```bash\nyou@puter: ~$pwd\n/home/you\n\
  you@puter: ~$\n```\n\n你现在处于你的家目录中。这是你存放个人文件的地方，通常在你登录 Linux 系统时，工作目录会被设置为你的家目录。用户的家目录位于\
  \ `/home` 下，通常你的家目录的名称为 `/home/your_user`。\n\n现在你已经知道自己在哪里，尝试了解那里有什么。要找出它们，输入 `ls`\
  \ 命令。你将获得你的工作目录包含的所有文件和子目录的列表。\n\n你有方法控制 `ls` 命令显示的内容以及显示方式。就像每个 Linux 命令一样，`ls`\
  \ 可以有额外的选项。例如，尝试输入这个：\n```bash\nyou@puter: ~$ls -l\n```\n\n你再次获得了工作目录的文件列表，但由于使用了\
  \ `-l` 选项，`ls` 的输出发生了变化。你获得了关于目录文件的更多信息。此选项告诉 `ls` 显示当前目录文件的更多信息。这些命令的附加内容通常被称为参数、参数或选项。在这种情况下，`ls`\
  \ 是命令，而 `-l` 是选项。\n\n你可以用空格将命令与其选项分开，也可以添加更多选项并用空格将它们分开。例如，`-r` 选项告诉 `ls` 按倒序显示文件。如果你想既倒序显示文件又获取文件的更多信息，可以这样做：\n\
  ```bash\nyou@puter: ~$ls -l -r\n```\n\n在某些情况下，使用多个选项时可以使用更短的形式。以下操作的效果相同：\n```bash\n\
  you@puter: ~$ls -lr\n```\n\n许多命令接受很多参数，某些命令也接受文件或目录名称作为参数。例如，当你不带任何参数提供 `ls` 命令时，它会显示当前目录的内容。如果你想显示另一个目录的内容，可以将目标目录的路径作为参数交给\
  \ `ls`。路径是你通往目标目录所经过的目录路径。路径有两种：绝对路径和相对路径。\n\n绝对路径直接告诉你某个文件或目录的完整路径。因为 Linux 上的所有文件都在根目录下，所以绝对路径必须从根目录开始，然后逐级跟随文件系统树，直到到达所需的文件或目录。\n\
  \n\n\n\n\n所有的绝对文件名都以斜杠开头，因为斜杠表示根目录。例如，你的系统上有一个名为 `/usr/X11R6/bin` 的目录。这里的路径意味着你从根目录（`/`）开始，进入子目录\
  \ `\"usr\"`，该子目录包含一个名为 `\"X11R6\"` 的目录，该目录又包含 `\"bin\"` 目录。正如你所注意到的，你使用斜杠不仅指示根目录，还用于分隔路径上的目录。这与\
  \ Windows 不同，在 Windows 中你使用反斜杠来分隔目录。要更改工作目录，请使用 `cd` 命令并将所需的目录作为参数传递。现在，将你的工作目录更改为\
  \ `/usr/X11R6`：\n\n```\nme@puter: ~$ cd /usr/X11R6\n```\n\n现在检查你的新工作目录是否确实是你想要的：\n\
  \n```\nyou@puter: /usr/X11R6$ pwd\n/usr/X11R6\nyou@puter: /usr/X11R6$\n```\n\n请注意命令提示符已经发生了。通常它被配置为显示工作目录的名字。现在你不需要一直输入\
  \ `pwd` 了。\n\n你已经知道绝对路径是从根目录开始的。然而，相对路径是从工作目录开始的。这就是为什么一些特殊符号来指示文件系统中的相对位置。这些符号是点（`.`）和两个点（`..`），它们分别表示工作目录和父目录。\n\
  \n让我们看看这些是如何运作的。现在你当前的工作目录应该是 `/usr/X11R6/`。列出它的内容：\n\n```\nyou@puter: /usr/X11R6$\
  \ ls\nbin include lib man\nyou@puter: /usr/X11R6$\n```\n\n应该有一个名为 `\"lib\"` 的目录，你想知道它包含什么，但你不想更改工作目录。有两种方法可以实现这一点。使用绝对路径：\n\
  \n```\nyou@puter: /usr/X11R6$ ls /usr/X11R6/lib\n```\n\n或者使用相对路径：\n\n```\nyou@puter:\
  \ /usr/X11R6$ ls ./lib\n```\n\n在这里，路径 `./lib` 中的点指向工作目录 `/usr/X11R6/`。如果你省略开头的点，将节省一些输入工作。在大多数情况下，你不需要它，所以这与上面是一样的：\n\
  \n```\nyou@puter: /usr/X11R6$ ls lib\n```\n\n现在让我们将工作目录更改为 `/usr/X11R6/bin`。同样有两种方法。你可以使用绝对路径：\n\
  \n```\nyou@puter: /usr/X11R6$ cd /usr/X11R6/bin\n```\n\n或者使用相对路径（省略点）：\n\n```\n\
  you@puter: /usr/X11R6$ cd bin\n```\n\n现在你当前的工作目录是 `/usr/X11R6/bin`。要将其更改为父目录 `/usr/X11R6`，请使用绝对路径：\n\
  \n```\nyou@puter: /usr/X11R6/bin$ cd /usr/X11R6\n```\n\n然而，使用两个点（父目录）会更快：\n\n```\n\
  you@puter: /usr/X11R6/bin$ cd ..\n```\n\n注意 `cd` 和点之间的空格。在很多情况下，使用相对路径而不是绝对路径可以节省一些输入工作。\n\
  \n### 问题 69：确定文件类型\n\n我如何在 Linux 系统上确定一个不熟悉的文件的类型？\n\n答：如果你在系统上看到一个奇怪的文件且不知道它是什么，确定它的类型通常很有帮助。如果文件有文件扩展名，你可能可以很容易地确定它的类型，但如果你不认识该扩展名或者文件没有扩展名，你就需要不同的方法来找出它是哪种文件。这时\
  \ `file` 命令就派上用场了。`file` 命令检查文件的内容并告诉你是什么类型的文件：\n\n```\nyou@puter: ~$ file examine.html\n\
  examine.html: HTML document text\nyou@puter: ~$\n```\n\n如果你愿意，也可以向 `file` 传递多个文件作为参数：\n\
  \n```\nyou@puter: ~$ file view_this picture.gif\nview_this: ASCII English text\n\
  picture.gif: GIF image data, version 89a, 88 x 31\nyou@puter: ~$\n```\n\n只需将文件名作为\
  \ `file` 的参数，它就会告诉你文件的类型以及可能关于它的一些额外信息。\n\n### 问题 70：权限和所有权\n\n我是我 Linux 上的唯一用户，但我无法访问我的某些文件。是我误配置了文件访问权限吗？\n\
  \n答：Linux 被设计为多用户环境。需要一个安全的系统来决定哪些文件是你的，以及谁可以操作它们。即使你是普通桌面系统上的唯一用户，文件权限也能帮助你保护重要文件。\n\
  \n用户（User）：文件的所有者。\n组（Group）：文件所属的组。\n其他（Other）：其他人。\n\nLinux 上有三种访问类型：读、写、执行。\n\
  \n- **读取权限**：在普通文件上，读取位意味着文件可以被打开和读取。在目录上，读取权限意味着你可以列出内容。\n- **写入权限**：在普通文件上，写入位意味着你可以修改文件。在目录上，写入权限意味着你可以添加、删除和重命名文件。\n\
  - **执行权限**：对于普通文件，这意味着你可以作为程序或脚本执行它。对于目录，执行权限允许你访问文件。\n\n### 问题 71：查看文件权限\n\n我如何查看文件权限？\n\
  \n答：你可以通过执行 `ls -l` 命令的长目录列表来查看文件的权限。例如，它可能看起来这样：\n\n```\nyou@puter: /home/writers$\
  \ ls -l\ntotal 10\ndrwxr-xr-x 3 dan writers 180 2005-10-05 21:37 dir\n-rw-r-----\
  \ 2 dan writers 818 2005-09-04 13:35 file\n-rwxr-xr-x 1 dan writers 1348 2005-08-03\
  \ 20:31 otherfile\n```\n\n第一列显示文件类型和权限。第二列显示引用文件的链接或目录项数量，第三列显示文件所有者，第四列显示文件所属组。其他列显示文件大小（字节）、最后修改日期以及文件名。\n\
  \n第一列的文件权限分为四个独立的组。第一组仅由一个字符组成，显示文件的类型。例如，`d` 表示目录，`-` 表示普通文件。\n\n第一个字符可以是以下任何一个：\n\
  \n- `d` = 目录\n- `-` = 普通文件\n- `l` = 符号链接\n\n\n\n\n\n`s` = Unix 域套字\n\n`p` = 命名管道\n\
  \n`c` = 字符设备文件\n\n`b` = 设备文件\n\n接下来的九字符显示文件的权限，分为三组，每组由三个字符组成。第一组三个字符显示所有者（user）的读、写、执行权限。下一组显示文件组（group）的读、写、执行权限。同样，最后一组三个字符显示其他用户（other，即所有人）的权限。在每组中，第一个字符表示读权限，第二个字符表示写权限，第三个字符表示执行权限。\n\
  \n这些字符很容易记忆。\n\n`r` = 读权限\n\n`w` = 写权限\n\n`x` = 执行权限\n\n`-` = 无权限\n\n现在让我们回到上面的示例输出。你已经知道\
  \ `dir` 是一个目录，因为第一列以 `d` 开头。该目录的所有者是用户 `dan`，组所有者是 `writers`。前三个字符 `rwx` 表示该目录的所有者\
  \ `dan` 在这种情况下对该目录具有完全访问权限。用户 `dan` 能够访问、查看和修改该目录中的文件。接下来三个字符 `r-x` 表示所有属于 `writers`\
  \ 组的用户对该目录具有读和执行权限。他们可以进入目录、执行文件并查看其内容。然而，由于他们没有写权限，他们无法对目录内容进行任何更改。最后三个字符 `r-x`\
  \ 表示所有既不是 `dan` 不属于 `writers` 组的用户对该目录具有读和执行权限。\n\n此外，以 `-` 开头的第一列是一个普通文件，由用户 `dan`\
  \ 和组 `writers` 所有，就像我们示例中的目录一样。前三个字符 `rw-` 表示所有者对该文件具有读和写访问权限。根据接下来的三个字符 `r--`，属于\
  \ `writers` 组的用户可以查看文件，但不能修改或执行它。最后的三个字符 `---` 表示其他人都对该文件没有任何访问权限。\n\n同样，你可以看到 `otherfile`\
  \ 是一个普通文件，其所有者对其具有完全访问权限，而其他人可以读取和执行该文件，但不能修改它。\n\n### 问题 72：符号模式下的文件权限\n\nroot\
  \ 用户和文件所有者可以设置文件权限吗？\n\n答：root 用户和文件所有者可以设置文件权限。这是通过 `chmod` 命令完成的。`chmod` 有两种模式——符号模式和数字模式。\n\
  \n符号模式很容易执行。首先，你决定是为用户 (`u`)、组 (`g`)、其他人 (`o`) 还是三者全部 (`a`) 设置权限。然后，你要添加权限 (`+`)、删除权限\
  \ (`-`)，或者清除之前的权限并添加新权限 (`=`)。接下来，你决定设置读权限 (`r`)、写权限 (`w`) 还是执行权限 (`x`)。最后，你告诉 `chmod`\
  \ 你想要更改哪个文件的权限。\n\n假设我们有一个名为 `redfile` 的普通文件，该文件对所有组都有完全访问权限（长格式目录列表将显示 `-rwxrwxrwx`\
  \ 为文件的权限）。\n\n清除所有权限但为所有人添加读权限：\n\n```\n$ chmod a=r redfile\n```\n\n执行命令后，文件的权限将变为\
  \ `-r--r--r--`。\n\n为组添加执行权限：\n\n```bash\n$ chmod g+x redfile\n```\n\n现在，文件的权限将变为\
  \ `-r--r-xr--`。\n\n为文件所有者同时添加写和执行权限。注意你如何可以同时设置多个权限：\n\n```\n$ chmod u+wx redfile\n\
  ```\n\n此之后，文件权限将变为 `-rwxr-xr--`。\n\n从文件所有者和组中移除执行权限。再次注意你如何可以同时设置它们：\n\n```bash\n\
  $ chmod ug-x redfile\n```\n\n现在，权限为 `-rw-r--r--`。\n\n以下是符号模式下设置文件权限的总结：\n\n**哪个用户？**\n\
  - `u` 用户/所有者\n- `g` 组\n- `o` 其他人\n- `a` 全部\n\n**执行什么？**\n- `+` 添加此权限\n- `-` 删除此权限\n\
  - `=` 恰好设置此权限\n\n**哪些权限？**\n- `r` 读\n- `w` 写\n- `x` 执行\n\n### 问题 73：数字模式下设置文件权限\n\
  \n既然我已经知道了如何在符号模式下设置文件权限，那么数字模式呢？\n\n答：在数字模式下，文件权限不是用字符表示。相反，它们由一个三位八进制数表示。\n\n\
  - `4` = 读 (`r`)\n- `2` = 写 (`w`)\n- `1` = 执行 (`x`)\n- `0` = 无权限 (`-`)\n\n为了得到你需要的权限位，你需要相应地相加数字。例如，`rwx`\
  \ 权限为 `4+2+1=7`，`rx` 为 `4+1=5`，而 `rw` 为 `4+2=6`。因为你为所有者、组和其他人设置了单独的权限，你需要一个代表所有组权限的三位数字。\n\
  \n这是一个示例：\n\n```bash\n$ chmod 755 redfile\n```\n\n这将权限更改为 `rwxr-xr-x`。\n\n```bash\n\
  $ chmod 640 redfile\n```\n\n在这种，redfile 的权限将变为 `-rw-----`。数字模式可能没有符号模式那么直观，但通过数字模式你可以更快速更高效地设置。\n\
  \n以下是数字模式设置权限的快速参考：\n\n数字？\n- `0` `---`\n- `1` `--x`\n- `2` `-w-`\n- `3` `-wx`\n\
  - `4` `r--`\n- `5` `r-x`\n- `6` `rw-`\n- `7` `rwx`\n\n### 问题 74：更改文件所有权\n\n如何在 Linux\
  \ 中更改文件的所有者和组？\n\n答：你可以通过 `chown` 和 `chgrp` 命令更改文件和目录的所有权。\n\n使用 `chown`：\n\n如果你是\
  \ root 用户或文件的所有者，可以使用 `chown` 设置所有者：\n\n```\n$ chown clark redfile\n```\n\n执行此命令后，redfile\
  \ 的所有者将变为 `clark`。文件的组不会更改。除了用户名，你也可以在这里提供用户的数字 ID。你还可以同时设置文件的组。如果用户名后面跟着冒号和组名，文件的组也会更改。\n\
  \n```bash\n$ chown clark:clgroup somefile\n```\n\n执行此命令后，redfile 的新所有者将是用户 `clark`组为\
  \ `clgroup`。\n\n你可以以设置文件相同的方式设置目录的所有者：\n\n```bash\n$ chown username somdir\n```\n\
  \n注意执行此命令后，只有目录的所有者会更改。目录内部文件的所有者不会更改。\n\n为了设置目录及其所有文件的所有权，你需要 `-R` 选项：\n\n```bash\n\
  $ chown -R username somdir\n```\n\n这里，`R` 代表递归，因为此命令会递归更改目录及其内容的所有权。发布此示例命令后，用户\
  \ `username` 将是目录 `somdir` 以及该目录内每个文件的所有者。\n\n如果：\n\n```\n$ chown -v username somefile\n\
  ```\n更改 'somefile' 的所有权为 username\n\n这里，`v` 代表详细（verbose）。如果你使用 `-v` 选项，`chown`\
  \ 将列出它对文件做了什么（或没做什么）。\n\n详细模式在一次更改多个文件的所有权时特别有用。例如，当你递归操作时可能会发生这种情况：\n\n```bash\n\
  $ chown -Rv username somdir\n```\n\n更改 'somdir/' 的所有权为 username\n\n更改 'somdir/bluefile'\
  \ 的所有权为 username\n\n更改 'somdir/redfile' 的所有权为 username\n```\n\n\n\n\n如你所见，`chown`\
  \ 很好地报告了它对每个文件进行的操作。\n\n## chgrp 的用法：更改文件的组所有权。\n\n你也可以使用 `chgrp` 命令来更改文件或目录的所属组。同样与\
  \ `chown` 一样，你必须是 root 用户或文件的所有者才能更改组所有权。\n\n`chgrp` 命令的工作方式与 `chown` 几乎相同，但它更改的是文件的用户组而不是所有者。\n\
  \n```bash\n$ chgrp usergroup redfile\n```\n\n执行此命令后，文件 `redfile` 将由用户组 `usergroup`\
  \ 所有。尽管文件的组已更改为 `usergroup`，但文件的所有者仍保持不变。\n\n使用 `chgrp` 的选项与使用 `chown` 相同。例如，`-R`\
  \ 和 `-v` 选项的作用与它们在 `chown` 中完全一样：\n\n```bash\n$ chgrp -Rv usergroup somedir\n```\n\
  \n```\nchanged group of 'somedir/' to usergroup\nchanged group of 'somedir/bluefile'\
  \ to usergroup\nchanged group of 'somedir/redfile' to usergroup\n```\n\n`chown`\
  \ 命令很好地报告了它对每个文件进行的操作。\n\n## 问题 75：查看文本文件\n\n我想查看或读取我的 Linux 文件系统中的文件。我应该使用什么命令？\n\
  \n答：你可以使用 `cat` 和 `less` 查看和编辑文本文件。\n\n`cat` 是一个简单的程序，当你将文件名作为参数传递给它时，它会显示文本文件的内容：\n\
  \n```bash\n$ cat view_this\n```\n\n这是查看适合屏幕显示的短文件的一种很好的方法。如果文件很长，内容无法一次显示在屏幕上，请改用\
  \ `less`。\n\n`less` 是一个让你查看长文本文件的程序。你通过将文件名作为参数传递给它来使用它：\n\n```bash\n$ less view_this\n\
  ```\n\n在查看文件时，可以使用 Page Up 和 Page Down 键在文件中移动，输入 `q` 即可退出。\n\n你也可以同时打开多个文件，这样就可以可以在不先关闭的情况下从一个文件导航到下一个。如果你想打开多个文件，只需一次提供所有文件名：\n\
  \n```bash\n$ less file1 file2 file3\n```\n\n在同时查看多个文件时，你可以使用 `:n` 查看下一个文件，使用 `:p`\
  \ 查看上一个文件。\n\n以下是 `less` 中一些常用的命令：\n\n| 命令 / 键 | 动作 |\n| :--- | :--- |\n| `e`, `j`,\
  \ `Down`, 或 `Enter` | 向前移动一行 |\n| `y`, `k`, 或 `Up` | 向后移动一行 |\n| `f`, `Space`, 或\
  \ `Page Down` | 向前移动一页 |\n| `b`, 或 `Page Up` | 向后移动一页 |\n| `/characters` | 向文件中搜索包含指定字符的行\
  \ |\n| `N` | 重复上一次搜索 |\n| `e file_name` | 查看新文件 |\n| `:n` | 查看下一个文件 |\n| `:p` |\
  \ 查看上一个文件 |\n| `h`, 或 `?` | 显示帮助 |\n| `q` | 退出 |\n\n## 问题 76：文件操作 mv 命令\n\n我已经为我的文件创建了一个目录，该如何清理我未分类的文件？\n\
  \n答：`mv` 命令可移动或重命名文件。要重命名文件，你可以像这样使用：\n\n```bash\n$ mv file file2\n```\n\n如果 `file2`\
  \ 不存在，它将被创建；但如果它存在，它将被覆盖。如果你想在覆盖文件之前收到提示，可以像使用 `cp` 一样使用 `-i` 选项：\n\n```bash\n$\
  \ mv -i file file2\n```\n\n```\nmv: overwrite 'file2'? y\n$\n```\n\n将文件移动到另一个目录：\n\
  \n```bash\n$ mv file dir1\n```\n\n如果你想将文件重命名为 `file2` 并移动到另一个目录：\n\n```bash\n$ mv\
  \ file dir1/file2\n```\n\n关于 `mv` 命令语法和特性的详细信息可以在 `man` 或 `Info` 页面中找到。遇到问题时，使用这些文档应该是你的第一反应。即使是经验丰富的用户每天也会阅读\
  \ `man` 页面，因此初学者也应该一直阅读它们。一段时间后，你会熟悉常用命令的最常用选项，但你仍然需要文档作为主要信息来源。\n\n## 问题 77：文件操作\
  \ cp 命令\n\n我该如何复制文件？\n\n答：你可以使用 `cp` 命令复制文件。以下操作将 `file` 复制到 `file2`。注意，如果 `file2`\
  \ 不存在，它将被创建；如果它存在，它将被覆盖：\n\n```bash\n$ cp file file2\n```\n\nLinux 命令行中没有撤销命令，所以要非常小心，以免意外覆盖重要文件。如果你在使用\
  \ `cp` 时使用 `-i`（交互式）选项，这种风险会更小。以下操作与上面相同，但如果 `file2` 存在，会提示：\n\n```bash\n$ cp -i\
  \ file file2\n```\n\n## 问题 78：文件操作 rm 命令\n\n我该如何删除文件或目录？\n\n答：`rm` 命令用于删除文件和目录。删除文件：\n\
  \n```bash\n$ rm file\n```\n\n你也可以一次删除多个文件：\n\n```bash\nrm file1 file2\n```\n\n再次提醒你，Linux\
  \ 没有撤销命令，也不会将文件放入回收站保存。为了防止初学者造成“损坏”，可以使用 `-i` 选项激活 `rm`、`cp` 和 `mv` 命令的交互行为。在这种情况下，系统不会立即执行请求，而是会确认：\n\
  \n```bash\n$ rm -i archive/\n```\n\n## 问题 79：创建目录\n\n我想为我的文件创建目录和子目录。我该如何做？\n\n\
  答：可以使用 `mkdir` 命令完成：\n\n```bash\n$ mkdir archive\n$ ls -ld archive\n```\n\n```\n\
  drwxrwxrwx 2 jim jim1111 Jan 11 11:11 archive\n```\n\n如果你想一步到位创建目录和子目录，可以使用 `-p`\
  \ 选项：\n\n```bash\n$ cd archive\n$ mkdir 2004 2005 2006\n$ ls\n```\n\n```\n2004/\
  \ 2005/ 2006/\n```\n\n```bash\n$ mkdir 2004/reports/Books/\nmkdir: cannot create\
  \ directory '2004/reports/Books/': No such file or directory\n```\n\n```bash\n$\
  \ mkdir -p 2004/reports/Books/\n```\n\n\n\n\n\n# 问题 80：删除目录\n\n我想删除空目录。最好的方法是什么？\n\
  \n答：你可以使用两个命令来删除目录。如果目录是空目录，可以使用 `rmdir`：\n\n```bash\nrmdir dir1\n```\n\n如果你想删除一个包含所有内容的目录，可以使用带有\
  \ `-r` 选项的 `rm`。`-r` 选项告诉 `rm` 递归删除目录：\n\n```bash\nrm -r dir1\n```\n\n删除包含内容的目录时，最好使用\
  \ `-i` 选项，这样在处理目录中的每个文件之前系统都会提示你。\n\n```bash\nrm -ir dir1\n```\n\n# 问题 81：复制和移动目录\n\
  \n我如何在 Linux 中复制和移动选定的目录？\n\n答：对于目录的复制和移动，你可以像处理文件一样使用 `cp` 和 `mv` 命令。你可能已经注意到，如果你尝试直接用\
  \ `cp` 复制目录，它会向你报错。如果你想复制一个目录及其内容，`cp` 命令要求你使用 `-r` 选项。`-r` 意味着“递归复制”：\n\n```bash\n\
  cp -r dir1 dir2\n```\n\n上述操作会创建一个名为 `dir2` 的目录，其内容与 `dir1` 完全相同。然而，如果 `dir2` 已经存在，则内容不会被覆盖：目录\
  \ `dir1` 将复制到 `dir2` 目录下，命名为 `dir2/dir1`。\n\n在重命名目录时，使用与处理文件完全相同的 `mv` 命令：\n\n```bash\n\
  mv dir1 dir2\n```\n\n在处理目录时，`mv` 的工作方式与 `cp` 类似。如果 `dir2` 不存在，上述操作将 `dir1` 重命名为\
  \ `dir2`；但如果 `dir2` 存在，目录 `dir1` 将移动到 `dir2` 目录下，命名为 `dir2/dir1`。\n\n# 问题 82：df\
  \ 命令\n\n我可以使用什么工具查看磁盘使用情况？\n\n答：获取文件和文件系统信息的主要工具都相对简单且易用。`df`（显示磁盘使用情况）还会显示 inode\
  \ 使用情况，`df –i`（inode 包含有关文件的信息，例如在磁盘驱动器上的位置，如果你有很多小文件，可能会在耗尽磁盘空间之前就耗尽这些 inode）。这会导致“磁盘已满”的错误信息，而实际上\
  \ `df` 会显示有可用空间（但 `df –i` 会显示 inode 已用尽）。这与 Windows 中的文件分配项类似，在 `vfat` 中它实际上以 `8.3`\
  \ 格式存储名称，使用多个条目处理长文件名，每个目录最多 512 个条目，长文件名过多时目录就“满了”。\n\n只需输入 `df`，即可显示所有挂载文件系统的以\
  \ 1K 块的磁盘使用情况。例如：\n\n```text\nuser@server:~> df\nFilesystem 1K-blocks Used Available\
  \ Use% Mounted on\n/dev/hda3 5242904 75969244832121 5% /\ntmpfs 127876 8001 27868\
  \ 1% /dev/shm\n/dev/hda1 127351 33047 8772928% /boot\n/dev/hda9 10485816 33508 104523081%/home\n\
  /dev/hda8 5242904 932468 431043618% /srv\n/dev/hda7 3145816 32964311285222%/tmp\n\
  /dev/hda5 5160416 474336 4423928 10%/usr\n/dev/hda6 3145816412132 2733684 14% /var\n\
  ```\n\n# 问题 83：fsck 命令\n\n我如何检查并修复文件的不一致性？\n\n答：`fsck` 命令（“文件系统检查”或“文件系统一致性检查”）是一个检查文件系统一致性的工具。文件系统可能由于多种原因变得不一致，最常见的是由于硬件故障、断电或在没有正常关机的情况下关闭系统导致的异常关闭。由于这些原因，文件系统中的超级块（super\
  \ block）没有更新，并且与系统数据块、空块和 inode 的相关信息不匹配。\n\n由于这些原因，文件系统中的超级块没有更新，并且与系统数据块、空块和 inode\
  \ 的相关信息不匹配。\n\n### 运行模式\n`fsck` 以两种模式运行：交互式和非交互式：\n\n-   **交互式 (interactive)**：`fsck`\
  \ 检查文件系统并在每个错误处停止，询问用户是否纠正。\n-   **非交互式 (Non-interactive)**：`fsck` 尝试修复所有发现的错误，而不等待用户响应。\n\
  \n### 命令语法\n```\nfsck [-F fstype] [-V] [-yY] [-o options] special\n```\n `-F fstype`：要修复的文件系统类型（例如\
  \ `ufs`、`vxfs`）\n `-V`：验证命令语法但不运行命令\n- `-y` 或 `-Y`：以非交互模式运行命令 - 所有遇到的错误。\n- `-o\
  \ options`：可以通过 `-o` 指定三个选项：\n    - `b=n`：其中 `n` 是主超级块损坏时的下一个超级块编号。\n- `f`：无论清理标志如何都强制检查文件系统。\n\
  - `special`：要检查的文件系统的块或字符设备名称 - 例如 `/dev/rdsk/c0t0s4`。\n\n### 阶段\n`fsck` 分 5 个阶段检查文件系统，每个阶段检查文件系统的特定功能：\n\
  1. **第 1 阶段**：检查块和大小\n2. **第 2 阶段**：检查路径\n3. **第 3 阶段**：检查连接性\n4. **第 4 阶段**：检查引用计数\n\
  5. **第 5 阶段**：检查柱组\n\n### 错误信息与修复措施\n1. **超级块损坏**：`fsck` 无法运行。如果超级块损坏，仍可以使用创建新文件系统时生成的备用超级块进行修复。第一个备用超级块编号为\
  \ 32，其他超级块编号可以通过命令找到：\n```bash\nnewfs -N /dev/rdsk/c0t0d0s6\n```\n例如，使用第一个备用超级块运行\
  \ `fsck` 的命令如下：\n```bash\nfsck -F ufs -o b=32 /dev/rdsk/c0t0d0s6\n```\n\n2. **链接计数调整**：`fsck`\
  \ 发现目录 inode 链接计数与实际目录链接之间不匹配，并在交互式操作时提示调整。链接计数调整被认为是文件系统中的安全操作，应该通过对 `adjust?`\
  \ 提示给出 'y' 响应来修复。\n\n\n\n\n\n### 3. 修复空块计数\n在执行 `fsck` 期间，超级块中列出的空块数量与实际未分配的空块计数不符。`fsck`\
  \ 会通知此不匹配，并询问是否修复空块计数以同步超级块计数。此错误可以修正，不会对文件系统或文件产生任何潜在问题。\n\n### 4. 未引用文件的重新连接\n\
  在检查连接性时，`fsck` 会发现一些已分配但未被引用的 inode —— 即未挂载到任何目录。对 `fsck` 的重连消息回答 `y`，会将这些文件链接到\
  \ `lost+found` 目录，并以它们的 inode 号作为文件名。\n\n要获取有关 `lost+found` 中文件的更多信息，可以使用 `file`\
  \ 命令查看文件类型，随后可以在相应的应用程序或文本编辑器中打开它们以查看内容。如果发现文件是正确的，可以将其复制到其他目录并重命名后使用。\n\n### 问题\
  \ 84: du 命令\n**`du` 命令的作用是什么？**\n\n答: 要查看目录或文件的空间占用情况，可以使用 `du`。除非指定文件名，否则 `du`\
  \ 将采取递归操作。例如：\n\n```\nuser@server:~> du file.txt\n1300 file.txt\n```\n\n除非指定文件名，否则\
  \ `du` 将采取递归。\n\n```bash\nuser@server:~> du -h /usr/local\n4.0K /usr/local/games\n\
  16K /usr/local/include/nessus/net\n180K /usr/local/include/nessus\n208K /usr/local/include\n\
  62M /usr/local/lib/nessus/plugins/.desc\n97M /usr/local/lib/nessus/plugins\n164K\
  \ /usr/local/lib/nessus/plugins_factory\n97M /usr/local/lib/nessus\n12K /usr/local/lib/pkgconfig\n\
  2.7M /usr/local/lib/ladspa\n104M /usr/local/lib\n112K /usr/local/man/man1\n4.0K\
  \ /usr/local/man/man2\n4.0K /usr/local/man/man3\n4.0K /usr/local/man/man4\n```\n\
  \n如果你只想该目录的摘要，可以使用 `-s` 选项。\n\n```bash\nuser@server:~> du -hs /usr/local\n210M /usr/local\n\
  ```\n\n### 问题 85: 挂载文件\n我正在从微软 Windows 迁移到 Linux。我将软盘和 CD 插入驱动器，但无法访问它们。\n\n**为什么会发生这种情况？**\n\
  \n答: 如果你是从微软 Windows 迁移到 Linux，你可能习惯了非常方便地访问所有文件系统。但在 Linux 中，情况并非如此。你的软盘、CD、硬盘分区和其他存储设备在访问之前，必须挂载到系统中的某个现有目录上。这种连接过程被称为“挂载”（mounting），而设备挂载的目录称为“挂载点”（mount\
  \ point）。\n\n设备挂载后，你可以通过访问挂载设备的目录来访问该设备上的文件。当你完成并想要移除软盘、CD 或或其他设备时，需要在移除之前将其分离并卸载（unmount）。\n\
  \n挂载是通过 `mount` 命令完成的。\n\n挂载时，你必须告诉 `mount` 命令你想要挂载的设备或分区以及挂载点是什么。挂载点必须是系统中已经存在的目录。例如，挂载你的软盘：\n\
  \n```bash\n$ mount /dev/fd0 /mnt/floppy\n```\n\n在此示例中，`/dev/fd0` 是你的软盘驱动器，`/mnt/floppy`\
  \ 是挂载点。现在当你访问 `/mnt/floppy` 时，实际上是在访问软盘上的文件。\n\n通常 `/dev/fd0` 是你的软盘驱动器，但某些发行版配置为\
  \ `/dev/floppy` 与 `/dev/fd0` 相同。通常你的 CD-ROM 配置也相同：`/dev/cdrom` 是你的 CD-ROM 设备（更具体地说，`/dev/floppy`\
  \ 是指向实际软盘驱动器的符号链接，`/dev/cdrom` 是指向 CD-ROM 驱动器的符号链接）。\n\n尽管许多 Linux 发行版默认创建了 `/mnt/floppy`\
  \ 或 `/floppy` 等目录以便你那里挂载软盘，但并不强制你使用这些目录。你可以使用 `mount` 命令将你的设备或分区挂载到任何你现有目录。\n\n\
  通常，你的 Linux 发行版被配置为一个特定目录作为特定设备的默认挂载点。在大多数发行版中，软盘默认是 `/mnt/floppy` 或 `/floppy`，CD-ROM\
  \ 是 `/mnt/cdrom` 或 `/cdrom`。在这种情况下，你不需要告诉 `mount` 完整的设备名称：只需提供设备或挂载点即可。例如，如果 `/mnt/floppy`\
  \ 是 `/dev/fd0` 的默认挂载点，以下命令将挂载你的软盘：\n\n```bash\n$ mount /mnt/floppy\n```\n\n不同设备的默认挂载点配置在名为\
  \ `/etc/fstab` 的文件中。root 用户可以编辑此文件。（此处省略重复文本，保持格式一致）\n\n### 问题 86: 卸载\n**那么如何安全地卸载呢？**\n\
  \n答: 卸载是通过 `umount` 命令完成的。\n\n...位于 `/etc/fstab`。root 用户可以编辑此文件。（此处省略重复文本，保持格式一致）\n\
  \n### 问题 87: fstab\n**什么是 `fstab`？它有什么用？**\n\n答: `fstab` 是一个配置文件，包含了你计算机中所有分区和存储设备的信息。该文件位于\
  \ `/etc` 目录下，因此完整路径为 `/etc/fstab`。\n\n\n\n\n第一列和第二列应该非常直观。它们告诉 `mount` 命令与你手动挂载设备时告诉\
  \ `mount` 的信息完全相同：设备或分区是什么，以及挂载点是什么。在 `/etc/fstab` 中为设备指定的挂载点是它的默认挂载点。也就是说，如果你挂载设备时没有指定其他挂载点，该设备将被挂载到的目录。\n\
  \n大多数 Linux 发行版都会为挂载点创建特殊目录。大多数发行版在 `/mnt` 下创建它们。如果你输入以下命令：\n\n```bash\nmount /dev/fd0\n\
  ```\n\n你的软磁盘将被挂载到 `/media/floppy`，因为那是 `/etc/fstab` 中指定的默认挂载点。当你执行上述命令时，如果 `fstab`\
  \ 中没有 `/dev/fd0` 条目，`mount` 就会非常困惑，因为不知道该将软磁盘挂载到哪里。\n\n如果你对发行版提供的默认挂载点不满，可以自由更改\
  \ `/etc/fstab` 中列出的默认挂载点。只需确保挂载点是系统中已经存在的目录即可。如果不是，你可以直接创建它。\n\n某些分区和设备在 Linux 系统启动时也会自动挂载。例如，看看上面的\
  \ fstab 示例。有像下面这样的行：\n\n```\n/dev/hda2 / ext2 defaults 1 1\n/dev/hdb1 /home ext2\
  \ defaults 1 2\n```\n\n这些行意味着 `/dev/hda2` 将挂载到 `/`，`/dev/hdb1` 将挂载到 `/home`。这是在你的\
  \ Linux 系统启动时自动完成的。如果没有这样做，你使用 Linux 系统将变得很困难，因为你使用的所有程序都在 `/` 中，如果 `/` 没有被挂载，你将无法运行它们。系统通过查看\
  \ `/etc/fstab` 文件来知道你想挂载 `/dev/hda2` 和 `/dev/hdb1` 到。\n\n`/etc/fstab` 中的第三列指定了设备或分区的文件系统类型。支持许多不同的文件系统，但我们只查看常见的几种。\n\
  \n你的 Linux 分区很可能是 `Ext3`。`Ext2` 曾是 Linux 的标准文件系统，但现在，`Ext3` 和 `ReiserFS` 通常是几乎每个新\
  \ Linux 发行版的默认文件系统。`Ext3` 是一种较新的文件系统类型，与 `Ext2` 的不同在于它是日志型的（journaled），这意味着如果你在没有正常关机的情况下关闭电脑，你不丢失任何数据，而且系统在下次启动时不需要花费长时间进行文件系统检查。\n\
  \n你的 Linux 分区可能被格式化为 `ReiserFS`。像 `Ext3` 一样，`ReiserFS` 也是日志文件系统，但它比 `Ext3` 高得多。许多\
  \ Linux 发行版（包括 SuSE）已开始使用 `ReiserFS` 作为 Linux 分区的默认文件系统。\n\n文件系统的名称是不言自明的。`swap`\
  \ 文件系统类型用于你的交换空间分区。\n\n你的 Windows 分区可能是 `Vfat` 或 `NTFS`。9x 系列（95, 98, ME）都使用 `Vfat`（更广为人知的是\
  \ FAT32），而 NT 系列（NT, 2000, XP）使用 `NTFS`。在 2000 和 XP 中，你可以选择文件系统类型，因此 2000 和 XP 分区也可能被格式化为\
  \ `Vfat`。如果你想从 Linux 写入你的 Windows 分区，我建议将它们格式化为 `Vfat`，因为 Linux 目前对写入 `NTFS` 分区的支持还有些。\n\
  \n`auto` 选项简单意味着文件系统类型是自动检测的。如果你查看上面的 fstab 示例，你会发现软磁盘和 CD-ROM 都具有 `auto` 作为它们的文件系统类型。它们的文件系统类型可能不同。一个软磁盘可能是为\
  \ Windows 格式化的，另一个可能是为 Linux 的 `Ext2` 化的。这就是为什么让系统自动检测软磁盘和光驱等介质的文件系统类型是明智的。\n\n\
  `fstab` 中的第四列列出了设备或分区的所有挂载选项。有关更多信息，请查看 `mount` 的手册页。\n\n使用 `auto` 选项，设备将在启动时或当你执行\
  \ `mount -a` 命令时自动挂载。`auto` 是默认选项。如果你不想让设备自动挂载，在 `/etc/fstab` 中使用 `noauto` 选项。使用\
  \ `noauto` 后，设备只能显式地挂载。\n\n`user` 和 `nouser` 是非常有用的选项。`user` 选项允许普通用户挂载设备，而 `nouser`\
  \ 只允许 root 用户挂载设备。`nouser` 是默认选项，这是新 Linux 用户头疼的主要原因之一。如果你无法作为普通用户挂载光驱、软磁盘、Windows\
  \ 分区或其他，请在 `/etc/fstab` 中添加 `user` 选项。\n\n`exec` 允许你执行该分区上的二进制文件，而 `noexec` 不允许你这样做。`noexec`\
  \ 对于包含你不想在系统上执行或甚至无法在系统上执行的二进制文件的分区可能有用。这可能是 Windows 分区的情况。`exec` 是默认选项。\n\n`ro`\
  \ 以只读模式挂载文件系统。\n\n`rw` 以读写模式挂载文件系统。再次使用此选项可能会解决许多无法写入软磁盘、Windows 分区或其他内容的新 Linux\
  \ 用户的烦恼。\n\n`sync` 意味着同步完成。如果你查看 fstab 示例，你会注意到这是用于软磁盘的选项。这意味着当你将文件复制到软磁盘时，更改会在你执行复制命令的同时物理地写入软磁盘中。\n\
  \n然后是异步完成的。如果你查看 fstab 示例，你会发现这是 `rw`、`exec`、`auto`、`nouser` 和 `async`。\n\n`dump`\
  \ 是一个备份工具，`fsck` 是文件系统检查工具。\n\n`/etc/fstab` 中的第五列是 `dump` 选项。`dump` 检查它并使用该数字决定是否应该备份文件系统。如果是零，`dump`\
  \ 将忽略该文件系统。如果你查看 fstab 示例，你会注意到第五列是零。\n\n第六列是 `fsck` 选项。`fsck` 查看第六列中的数字来确定检查文件系统的顺序。\n\
  \n\n\n引号非常重要。如果你不使用，`cat` 将查看三个不同的文件：`File`、`With` 和 `Spaces.txt`。\n\n转义字符是处理文件名中特殊字符的另一种方法。你可以在特殊字符或空格前面加上一个反斜杠（`\\\
  `）。这会让 `bash` 壳将特殊字符视为普通字符。例如：\n\n```\n$ cat File\\ With\\ Spaces.txt\n```\n\n或者：\n\
  \n```bash\n$ rm File\\*.txt\n```\n\n如果文件名中包含 `\\` 字符，你也需要对其进行转义！\n\n```bash\n$ rm\
  \ File\\\\.txt\n```\n\n或者，你也可以使用引号：\n\n```bash\n$ rm 'File\\.txt'\n```\n\n使用哪种方法——使用引号还是转义——取决于你的选择。然而，引号并不总是有效。例如，如果你想在一个名称中带有特殊字符的文件上使用\
  \ shell 通配符，是无法使用引号的，因为这会将通配符也转义掉，所以在这些情况下，必须用反斜杠来转义特殊字符。\n\n## 问题 89：自动文件名补全\n\n\
  我听说自动文件补全是 Linux 命令行最实用的功能之一。它是如何工作的？\n\n答：在 Linux 命令行工作需要大量的输入。对于长命令和文件名来说，这会变得非常沮丧，但你的\
  \ `Tab` 键可以让你的生活变得简单得多。\n\n你只需要输入命令、目录或文件名的开头，按下 `Tab` 键，shell 就会完成剩余部分。例如，如果你想查看名为\
  \ `unDENIABLYVERYVERYLONG.FileName.txt` 的文件，你只需要输入：$ less un` 并按下 `Tab` 键。文件名的其余部分将自动完成。\n\
  \n可能有多个文件以相同的字母开头但结尾不同。在这种情况下，当你按下 `Tab` 键时 shell 的行为可能取决于 shell 的类型及其配置。通常在默认的\
  \ `bash` 配置下，当你输入文件名的首几个字母并按下 `Tab` 键时，shell 会尽可能完成补全并发出嘟声。当你再次按下 `Tab` 键时，shell\
  \ 会向你显示所有备选项。有时你必须按两次 `Tab` 才会显示备选项。现在，你可以输入整个文件名，或者再输入几个字母并再次按下 `Tab`。\n\n你可以补全任何内容：命令、程序名、目录和文件名。例如，要执行\
  \ `umount /mnt/floppy` 命令，你可以先输入 `um`，按下 `Tab`，然后输入 `/mn`，按下 `Tab`，然后输入 `f`，按下 `Tab`。自动文件名补全让生活变得更容易。\n\
  \n## 问题 90：shell 通配符\n\n什么是 shell 通配符？\n\n答：通配符是一种 shell 功能，它让命令行比任何 GUI 文件管理器都强大得多。这些是特殊字符允许你选择匹配某些字符模式的文件名。这帮助你只需输入几个字符就能选择大量文件，在大多数情况下，这比用鼠标选择文件更简单。\n\
  \n以下是 `bash` 中常用的通配符列表：\n\n| 通配符 | 匹配项 |\n| :--- | :--- |\n| `*` | 零或多个字符 |\n| `?`\
  \ | 恰好一个字符 |\n| `[abcde]` | 恰好列表中的一个字符 |\n| `[a-e]` | 恰好给定范围内的一个字符 |\n| `[!abcde]`\
  \ | 任何不在列表中的字符 |\n| `[!a-e]` | 任何不在给定范围内的字符 |\n| `{debian,linux}` | 在给定的选项中恰好一个完整的单词\
  \ |\n\n你可以在任何接受文件名作为参数的命令中使用通配符。\n\n例如：可能你对 `*` 字符已经熟悉，因为它在许多其他地方被广泛使用，而不仅仅是 Linux。以下命令删除当前目录下的所有文件：\n\
  \n```\n$ rm *\n```\n\n以下命令将所有名称中包含 \"linux\" 字样的 HTML 文件从工作目录移动到名为 `dir1` 的目录：\n\
  \n```\n$ mv *linux*.html dir1\n```\n\n因此，移动多个文件可以和移动单个文件一样简单。\n\n以下命令显示所有以 `d` 开头并以\
  \ `.txt` 结尾的文件：\n\n```\n$ less d*.txt\n```\n\n以下命令删除所有以 `junk` 开头后接恰好三个字符的文件：\n\n\
  ```\n$ rm junk.???\n```\n\n使用此命令，你列出了所有以 `hda` 开头后接恰好一个数字的文件或目录：\n\n```\n$ ls hda[0-9]\n\
  ```\n\n这列出了所有以 `hda` 开头后接恰好两个数字的文件或目录：\n\n```\n$ ls hda[0-9][0-9]\n```\n\n以下命令列出了所有以\
  \ `hd` 或 `sd` 开头后接 `a` 到 `c` 之间任意单个字符的文件或目录：\n\n```\n$ ls {hd,sd}[a-c]\n```\n\n\
  此命令将所有以大写字母开头的文件复制到目录 `dir2`：\n\n```\n$ cp [A-Z]* dir2\n```\n\n这删除所有不以 `c`、`e`、`h`\
  \ 或 `g` 结尾的文件：\n\n```\n$ rm *[!cehg]\n```\n\n你可以使用简单的模式或组合不同的通配符来构建非常复杂的模式。此外，你可以在任何接受文件名作为参数的命令中使用它们。\n\
  \n# 第六章：X 系统\n\n## 问题 91：窗口管理器\n\n什么是窗口管理器？它和桌面环境有什么区别？\n\n答：Microsoft Windows 基于图形用户界面（简称\
  \ GUI），你可以通过点击来控制应用程序。Linux 像 UNIX 或 MS-DOS 一样完全基于文本，可以在没有 GUI 的情况下运行。将 Linux 作为服务器是一个优势，因为计算机资源不会浪费在运行\
  \ GUI 上。另一方面，大多数家庭用户想要一个漂亮的 GUI，让我们可以使用图形程序并点击。\n\n由于 Linux 是基于文本的，因此在其之上运行 GUI。在\
  \ UNIX 中，GUI 被称为 X Window System（简称 X）。X 系统让在 Linux 上运行图形程序成为可能。X 负责硬件……图形程序本身不需要关心它们运行的硬件。应用程序只需要与\
  \ X 通信并告诉它想要显示什么。因此，X 让图形程序能够在屏幕上显示界面，但不控制窗口。\n\n窗口管理器：因为 X 提供了放置窗口的地方但不控制它们，所以你需要额外的软件来处理窗口。处理窗口的软件就是窗口管理器。窗口管理器控制你的桌面工作方式，即窗口的外观和行为。窗口管理器的工作提供控制窗口的方法，如移动、隐藏、缩放或关闭。窗口管理器决定当前哪个窗口接受你的输入，以及哪个窗口在最上方。窗口管理器还控制你执行这些任务的方式：点击哪些鼠标按钮或按下哪些键来完成这些窗口管理任务。\n\
  \n\n\n不同的窗口管理器具有不同的特性，但今天大多数窗口管理器都提供一个或多个启动应用程序的菜单。许多窗口管理器提供虚拟桌面——你可以像切换窗口几乎相同的方式在多个屏幕之间进行切换，但你不仅仅是在应用程序之间切换，而是在整个桌面之间切换。某些窗口管理器可能还提供图形化配置程序，以便于进行此类配置。\n\
  \n由于市上有几十种不同的窗口管理器，你可以通过更换窗口管理器来完全改变桌面的外观和感受。MS Windows 允许你使用不同的桌面主题，但在 Linux 中，你可以改变一切。\n\
  \n### 桌面环境\n窗口管理器提供了你控制桌面上的窗口所需的所有功能。然而，你可能想要一些额外的功能，并可能希望窗口管理器处理整个桌面，但提供这些额外功能并不是窗口管理器的职责。这正是你需要桌面管理器（desktop\
  \ manager）或桌面环境（desktop environment）的地方。\n\n桌面管理器通过提供和控制不直接处理窗口的其他有用功能来管理你的整个桌面。例如，桌面环境可以为你提供任务栏或多个任务栏、额外的菜单、桌面图标、屏幕保护程序以及许多小型实用型程序，如图形化文件管理器、搜索工具、文本编辑器等。\n\
  \n桌面管理器领域的两个大主角是 KDE (K Desktop Environment) 和 GNOME (GNU Network Object Model Environment)。它们之间有很多不同之处，但它们有一个共同点：你在使用桌面环境的同时必须使用一个窗口管理器。桌面环境负责整个桌面，但控制窗口仍然是窗口管理器的工作。KDE\
  \ 和 GNOME 之间最大的区别之一是它们使用窗口管理器的方式。KDE 有它自己的窗口管理器，所以如果你使用 KDE，更改与其配合使用的窗口管理器将非常痛苦。然而，GNOME\
  \ 并不自带自己的窗口管理器，因此你可以自由选择使用哪种窗口管理器与其配合。\n\n### 问题 92：更改默认管理器\n我刚刚安装了一个新的窗口管理器。我正启动到命令行，并使用\
  \ `startx` 命令手动启动 X。\n\n我该如何让新的窗口管理器成为我的默认管理器？\n\n答：在 Linux 中更改默认窗口管理器或桌面并不困难。你只需要用任何你熟悉的文本编辑器编辑一个配置文件即可。\n\
  \n如果你使用 `startx` 命令启动 X 窗口系统，你需要编辑位于家目录下的一个名为 `.xinitrc` 的文件。如果该文件已经存在，只需用你喜欢的文本编辑器打开它。如果你想对该文件进行备份，将其重命名为类似\
  \ `.xinitrc.backup`（或你选择的任何名称）。\n\n如果你在家目录中没有这样的文件，请创建一个同名的新文件。注意文件名中的点，这意味着该文件是一个隐藏文件，当你进行常规目录列出时不会显示它。\n\
  \n现在你可以使用你的文本编辑器创建一个新的、空的 `.xinitrc` 文件。虽然该文件可能看起来复杂，但它只包含一行，你新窗口管理器的名称。因此，在你的文件中添加如下所示的一行：\n\
  \n```\nexec windowmanager\n```\n\n其中 `windowmanager` 是启动你想作为默认的窗口管理器的命令。例如，要让 Window\
  \ Maker 成为你的默认窗口管理器，你会有这样的一行：`exec wmaker`\n\n启动一些流行的窗口管理器和桌面环境命令为：\n\n- KDE = `startkde`\n\
  - Gnome = `gnome-session`\n- Blackbox = `blackbox`\n- FVWM = `fvwm`（或者，对于 FVWM2，它是\
  \ `fvwm2`）\n- Window Maker = `wmaker`\n- IceWM = `icewm`\n\n在编辑 `.xinitrc` 文件后保存更改。下次你执行\
  \ `startx` 时，新的窗口管理器将成为你的默认。\n\n### 问题 93：从文本登录改为图形化登录\n我希望在 Linux 启动时自动启动 X 窗口系统以便以便图形化登录。\n\
  \n我该如何实现？\n\n答：你可以通过编辑 `/etc/inittab` 文件来禁用 X 窗口系统在启动时的启动以获得文本登录，或者启动到 X Windows\
  \ 以便在 Linux 中拥有图形化登录。这适用于任何 Linux 发行版。\n\n你需要 root 权限才能编辑此文件。如果你以普通用户身份登录，请使用 `su`\
  \ 命令获取 root 权限：输入命令，然后输入 root 密码。\n\n```\n$ su\npassword:\n```\n\n现在你可以用你喜欢的文本编辑器打开\
  \ `/etc/inittab` 文件。\n\n`/etc/inittab` 文件通常有良好的注释，因此文件本身就解释了文件中每一行的含义。寻找类似这样的一行：`id:3:initdefault:`\n\
  \n该行通常位于 `/etc/inittab` 文件的开头，数字并不一定是 `3`。该行中的数字告诉你系统的默认运行级别（run level）。默认运行级别反过来指定了当你的\
  \ Linux 系统启动时启动哪些进程。你需要更改运行级别来指定是否想要启动 X。\n\n启动 X 的运行级别在所有发行版中并不总是相同的。因此你必须仔细阅读\
  \ `/etc/inittab`。如果你想要图形化登录，你会选择类似 `full-user with xdm` 或 `full-user with graphical\
  \ login` 的选项。如果你想启动到命令行，你会选择 `full-user`。\n\n在 Red Hat 中，启动 X 的运行级别是 5，而文本登录默认是\
  \ 3。例如，如果你在 Red Hat 中想要图形化登录，你需要将\n\n```\nid:3:initdefault:\n```\n\n改为\n\n```\n\
  id:5:initdefault:\n```\n\n然后保存更改即可。完成。\n\n如果你启动到 X Windows，你需要一个显示管理器。它是一个处理登录的图形化程序：它显示图形登录界面，让你输入用户名和密码，并在登录后启动你的窗口管理器。\n\
  \n在大多数现代 Linux 发行版中，你不需要担心这个问题。它们通常默认安装显示管理器，因此你只需要更改运行级别，下次启动系统时，它就会启动显示管理器。\n\n\
  \n\n\n# A: 这是可能的。你可以在不同的虚拟终端上运行多个 X 会话。\n\n启动第一个 X 会话有两种方法：你可以在登录后手动启动 X 窗口系统，或者在你的\
  \ Linux 系统启动时自动启动 X。如果你的系统配置为自动启动 X，你就不需要担心第一个 X 会话了：它已经在运行了。\n\n如果你没有图形化登录界面，可能需要在登录后使用\
  \ `startx` 命令启动 X：`startx`\n\n你启动的第一个 X 会话运行在屏幕 0 上。这是默认设置，所以当你启动一个 X 会话时，不需要特意地告诉它运行在屏幕\
  \ 0 上。然而，你可以让第二个 X 会话运行在屏幕 1 上，第三个运行在屏幕 2 上，以此此类推。以下是让你告诉 X 运行在屏幕 1 的命令：`startx\
  \ -- :1`\n\n要在屏幕 2 上运行 X，你会使用命令：`startx -- :2`，以此此类推。\n\n你可能知道你有好几个虚拟终端。在默认的 Linux\
  \ 配置中，你的前六个虚拟终端上运行着命令行会话。你的第一个 X 会话运行在第七个虚拟终端（屏幕 0）上。如果你只运行了一个 X 会话，那么七号终端之后的所有终端都是空的。\n\
  \n第二个 X 会话运行在第八虚拟终端，第三个会话运行在第九个虚拟终端，以此此类推。你切换 X 屏幕的方法与切换虚拟终端相同：按下 `Ctrl`、Alt 以及带有目标终端数字的\
  \ `F` 键。\n\n例如，要从屏幕 0 切换到屏幕 1（从第一个 X 会话切换到第二个），你需要按下 `Ctrl + Alt + F8`。要返回第一个 X\
  \ 会话，请使用 `Ctrl + Alt + F7`。\n\n在使用 `startx` 启动多个 X 会话时，请确保你的主目录下有一个名为 `.xinitrc`\
  \ 的文件。该文件用于控制启动哪个窗口管理器等设置。\n\n由于默认屏幕是 0，某些图形化应用程序在使用其他屏幕时可能会感到有些困惑。如果你在终端模拟器的命令行中输入应用程序名称，尽管你从另一个屏幕启动它，该程序也可能运行在屏幕\
  \ 0 上。不过，这并不是问题。许多应用程序都有命令行选项来指定它们运行的屏幕。例如，要在屏幕 2 上运行 Gimp，你可以这样启动它：\n\n```\ngimp\
  \ --display :2\n```\n\n这实际上是一个优势。你可以从任何想要的 X 会话或虚拟终端启动应用程序，并将其发送到你喜欢的任何 X 屏幕。\n\n\
  要让 X 会话的颜色深度与默认不同，你需要使用 `-depth` 选项。例如，要运行一个具有 8 bpp 颜色深的第二个 X 会话，你会输入：\n\n```bash\n\
  startx -- :1 -depth 8\n```\n\n一如既往，请查看手册页 `man startx` 以获取更多帮助和更多选项。\n\n## Question\
  \ 95：使用键盘移动鼠标光标\n\n在 X 窗口系统中可以使用键盘移动鼠标光标的方法吗？\n\nA: 可以，在运行 X 窗口系统后，按下 `Shift + NumLock`\
  \ 开启此功能。\n\n使用数字键盘上的 1, 2, 3, 4, 6, 7, 8 和 9 键移动鼠标。看看你的数字键盘，你会很快就能发现哪个键可以向哪个方向移动鼠标。\n\
  \n按数字键盘上的 `5` 键进行点击。按两次 `5` 键进行双击。\n\n按住数字键盘上的 `0` 键进行点击。按下 `5` 释放。\n\n默认情况下，按下\
  \ `5` 键将执行左单击。你可以通过数字键盘上的 `/`、`*` 和 `-` 键来选择点击哪个按钮：\n\n- `/` 左键点击\n- `*` 中键点击\n\
  - `-` 右键点击\n\n注意，这些只是选择鼠标按钮。你仍然需要使用 5 来执行点击。\n\n再次按下 `Shift + NumLock` 关闭此功能。\n\n\
  ## Question 96：Xfree86\n\n什么是 Xfree86？\n\nA: XFree86 是 X 窗口系统的一种实现。它最初是为 IBM PC\
  \ 兼容机上的 Unix 类操作系统编写的，现在已适用于许多其他操作系统和平台。它是 XFree86 许可证 1.1 版本下的免费开源软件。它由 XFree86\
  \ 项目公司开发；首席开发人员是 David Dawes。\n\n2004 年 2 月，随着 4.4.0 版本的发布，XFree86 项目采用了一项自由软件基金认为与\
  \ GPL 不兼容的许可证更改。大多数 Linux 发行版认为潜在的 GPL 法律问题不可接受，并计划迁移到许可证更改之前的分支（fork）。最初有多个分支，但\
  \ X.Org 分支很快就成为了主导地位。许多对项目中其他问题感到不满的开发者也迁移到了 X.org。\n\nXFree86 由一个用于编写 X 应用程序（“客户端”）的客户端库以及一个负责显示的\
  \ X 终端组成。客户端和服务器通过 X 协议进行通信，该协议允许它们相互协作。\n\n## Question 97：在旧安装上安装 Xfree86 4.6\n\
  \n我如何在旧安装上安装 Xfree86 4.6？\n\nA: 如果你已经安装了 X，在覆盖旧版本安装新版本之前，你应该先为它创建一个备份副本。\n\n在进行任何其他操作之前，确保\
  \ `extract` 命令是可执行的，并将其链接到名称 `gnu-tar`，以便它可以像普通的 tar 命令一样使用：\n\n```bash\nchmod +x\
  \ extract\nrm -f gnu-tar\nln extract gnu-tar\n```\n\n（注：由于文本在此处中断，后续翻译基于您提供的示例逻辑进行了推断）\n\
  \n\n\n\n\n```bash\n./gnu-tar -C /usr/X11R6/lib/X11/subdir -v -x -p -U -f -\n```\n\
  \n如果您在旧安装中自定义了任何配置文件，您可能想要跳过这些子目录，或者手动拷贝选定的文件。\n\n完成后，即可进行安装的主要部分：\n\n```bash\n\
  ./extract -C /usr/X11R6 `pwd`/X[a-df-qs-uw-z]*.tgz\n\n./extract -C /usr/X11R6 Xvfb.tgz\
  \ # 如果您正在安装 Xvfb\n\n./extract -C /var Xvar.tgz\n\nchmod ug-w /usr/X11R6/lib # 确保权限正确\n\
  \n/sbin/ldconfig /usr/X11R6/lib # 用于 Linux\n\n/sbin/ldconfig -m /usr/X11R6/lib #\
  \ 用于 FreeBSD, NetBSD, OpenBSD\n\n/usr/X11R6/bin/mkfontdir /usr/X11R6/lib/X11/fonts/misc\n\
  ```\n\n## 问题 98：XF86Config 文件\n\nXF86Config 文件用于何处？\n\n答：X Window 系统的配置文件 `XF86Config`\
  \ 用于 X 服务器来设置必要的配置参数。它是一个纯文本文件，被划分为若干节和子节。重要的节包括 `Files`、`Input Device`、`Monitor`、`Modes`、`Screen`、`Device`\
  \ 和 `Server Layout`。\n\n节可以任何顺序出现，且每种类型可能有多个，例如，如果您有多个显示器，比如一个视频投影仪和一个笔记本电脑的内置 LCD\
  \ 屏幕。\n\n`Monitor`节用于物理显示设备，`Screen`节用于逻辑显示器，因此您可以让两个显示器显示相同的内容或完全不同的信息。\n\n例如，`Device`节中的\
  \ `\"SWCursor\"` 选项控制鼠标指针是在外部显示器上镜像显示还是被抑制。在典型的 Unix 类系统中，该文件通常位于 `/etc/X11`，日志文件位于\
  \ `/var/log`，通常将最后一次 X 启动日志命名为 `XFree86.0.log`，上一次的命名为 `XFree86.0.log.old`。\n\n\
  对此文件进行不当编辑可能会导致黑屏或无法读取的屏幕，甚至可能损坏显示器，特别是 CRT 显示器。如果您需要更改配置，务必知道如何以文本模式启动计算机，以便撤销对上一个可用配置的任何更改。\n\
  \n## 问题 99：配置文件\n\n我可以在哪里找到 Xfree86 的配置文件？\n\n答：`XFree86` 的配置文件通常位于 `/etc/X11/XF86Config`（但有时也称为\
  \ `XF86Config-4`，以避免与 XFree86 3.x.x 版本混淆）。已经创建了许多 GUI 来简化配置，这通常取决于发行版（例如，Suse 使用\
  \ `sax2`，Debian 使用 `debconf` 来生成它）。\n\n配置文件被划分为若干节（并非所有节都是必须的，某些节可以出现多次）：\n\n- **Files**：`XF86Config`\
  \ 或 `XF86Config-4` 位于 `/etc/X11`。请注意，新的发行版正在使用 `xorg.conf` 代替 `XF86Config`。`xorg.conf`\
  \ 位于相同位置，并具有相同的设置和样式。\n- **ServerFlags**：通用服务器配置选项；\n- **Module**：配置加载哪些模块；\n- **InputDevice**：配置鼠标和键盘等输入设备；要使滚轮工作：将鼠标协议更改为\
  \ `\"IMPS/2\"`。选项 `\"ZAxisMapping\" \"4 5\"`。\n- **Device**：配置图形设备/显卡。例如（带有专有驱动程序的的\
  \ nVidia GeForce TwinView 设置）：\n\n```text\nSection \"Device\"\nIdentifier\"GeForce\
  \ 4 Ti 4600\"\nDriver \"nvidia\"\nOption \"TwinView\"\nOption \"MetaModes\"\"1024x768,\
  \ 1024x768; 800x600, 800x600\"\nOption \"SecondMonitorHorizSync\" \"30-70\"\nOption\
  \ \"SecondMonitorVertRefresh\"\"50-120\"\nOption \"ConnectedMonitor\" \"CRT, CRT\"\
  \nEnd Section\n```\n\n`'Section \"Device\"'` 和 `'EndSection'` 是语法的一部分，必须存在。`Driver`\
  \ 是您的显卡所需的驱动。`Option` 行被传递给驱动程序以获取所需的功能。\n\n- **Monitor**：配置显示器。将 `Identifier` 更改为您想要的任何内容（显示器的名称和模型），但请记住同时在屏幕节下的\
  \ `\"monitor\"` 中进行更改。不要忘记输入错误的值可能会损坏您的显示器。\n- **Modes**：定义特殊的模式行（modelines）。\n\
  - **Screen**：定义查看屏幕。例如：\n\n```text\nSection \"Screen\"\nIdentifier\"Default Screen\"\
  \nDevice \"Generic Video Card\"\nMonitor\"Generic Monitor\"\nDefaultDepth 24\nSubSection\
  \ \"Display\"\nDepth 1\nModes \"2048\"\n```\n\n\n\n\n下一步是为鼠标猜测合适的协议类型。在某些情况下，X 服务器可能自动为指定的鼠标选择协议类型。否则，用户必须手动选择。请遵循以下指南。\n\
  \n### 总线鼠标 (Bus mouse)\n无论鼠标品牌如何，总线鼠标和 `InPort` 鼠标始终使用 `BusMouse` 协议。某些操作系统可能允许你将\
  \ `Auto` 指定为总线鼠标的协议类型。\n\n### PS/2 鼠标\n无论品牌如何，对于 `PS/2` 鼠标应始终首先尝试 `PS/2` 协议。任何 `PS/2`\
  \ 鼠标都兼容此协议类型，尽管 X 服务器无法使用滚轮和其他额外功能。\n\n在验证鼠标可以使用此协议工作后，你可以选择指定 `xxxPS/2` 协议中的一种，以便在\
  \ X 服务器中可用额外功能。然而，对这些 PS/2 鼠标的支持假设了底层操作系统的某些行为，并不总是能按预期方式工作。由于这个原因，某些操作系统平台可能会完全禁用某些\
  \ PS/2 鼠标型号。某些操作系统可能允许你将 `Auto` 指定为 PS/2 鼠标的协议类型，X 服务器将自动进行调整。\n\n### 串口鼠标 (Serial\
  \ mouse)\nXFree86 服务器支持广泛的新旧型号鼠标。如果你的鼠标是较新的型号，它可能符合 PnP COM 设备规范，X 服务器可能能够自动检测到合适的鼠标协议类型。将\
  \ `Auto` 指定为协议类型并启动 X 服务器。如果鼠标不是 PnP 鼠标，或者 X 服务器无法确定合适的协议类型，服务器将打印以下错误信息并终止。\n\n\
  ```\n<mousename>: cannot determine the mouse protocol\n```\n\n如果 X 服务器生成了上述错误信息，你需要手动为鼠标指定一种协议类型。请从以下列表中选择一个：\n\
  \n* GlidePoint\n* IntelliMouse\n* Logitech\n* Microsoft\n* MMHittab\n* MMSeries\n\
  * MouseMan\n* MouseSystems\n* ThinkingMouse\n\n**在选择时，请遵守以下规则：**\n\n* `Logitech`\
  \ 协议用于罗技的旧款串口鼠标型号。现代罗技鼠标使用 `MouseMan` 或 `Microsoft` 协议。\n* 大多数 2 键串口鼠标支持 `Microsoft`\
  \ 协议。\n* 3 键串口鼠标可能兼容 `Mousesystems` 协议。如果不支持，它也可以兼容 `Microsoft` 协议，尽管第三键（中间键）将无法工作。3\
  \ 键串口鼠标也可以兼容 `Mouseman` 协议，在这种情况下第三键可能按预期工作。\n* 3 键串口鼠标底部可能有一个小开关，用于在 `MS` 和 `PC`\
  \ 或 `2` 和 `3` 之间选择。`MS` 或 `2` 通常意味着 `Microsoft` 协议。`PC` 或 `3` 将选择 `MouseSystems`\
  \ 协议。\n* 如果串口鼠标带有滚轮，它可能兼容 `IntelliMouse` 协议。\n* 如果串口鼠标带有滚轮，但它无法通过 `IntelliMouse`\
  \ 协议工作，你必须将其作为普通的 2 键或 3 键串口鼠标使用。\n* 如果指定了 `Auto` 协议且鼠标看起来正常，但你发现鼠标的所有功能都不可用，那是因为\
  \ X 服务器对该型号鼠标没有原生支持，并且根据 PnP 信息使用了 `compatible` 协议。\n\n### USB 鼠标\n如果你的鼠标连接到 USB\
  \ 端口，它可以由 `Auto` 协议支持，或者由特定于操作系统的协议（见下文）支持，或者通过 `usb` 协议作为通用的人机接口（HID）支持。\n\n###\
  \ 标准化协议\n无论鼠标的型号或类别，你操作系统中的鼠标设备驱动程序都可能使用标准化协议。例如，SVR4 系统可能支持 `Xqueue` 协议。在 FreeBSD\
  \ 中，系统鼠标设备 `/dev/sysmouse` 使用 `SysMouse` 协议。\n\n### 问题 102：X 服务器配置\n如何更改 X 服务器配置？\n\
  \n**答案：** 你可以通过以下步骤更改 X 服务器配置。\n\n1. Linux 操作系统使用一个名为 `XFree` 的图形用户界面（GUI），这仅仅是因为\
  \ X 窗口系统的免费版本，由 X.org 网站的成员开发，并获得了来自 IBM 的贡献。今天，X 服务器配置完全是自动的，因此在你新的 Linux 系统安装结束时，如果你足够幸运，可以直接重启而无需进行任何操作。尽管如此，经常会出现，尽管安装了很多软件包，它仍然显示一条信息说你无法启动\
  \ X 服务器。发生这种情况的原因是你的显示器或显卡没有被正确检测。因此你只需要更新整个安装过程直到摘要（Summary）。在这里，你可以更改图形界面设置，但在被询问时，禁用重启后自动启动\
  \ X 服务器的选项。这允许你在文本模式下使用电脑，所以如果你想启动 X 服务器，必须手动运行 `startx` 命令。\n\n2. 如果 X 服务器仍然无法工作，尝试使用：\n\
  \n#### XFdrake\n它允许以最小限制更改当前设置：\n* 显示器：SVGA (非隔行) 1024 x 768\n* 频率：60 Hz\n* 显卡：VGA\
  \ 标准\n* 分辨率：640 x 480\n* 颜色深度：8 bpp\n\n你可以逐渐增加这些值，但不要超频频率。这可能会损坏你的显示器。当你准备好后，再次运行\
  \ `Xfdrake` 并选择在启动时运行 X。\n\n### 问题 103：X 字体\n如何让 X 可用字体？\n\n**答案：** 有多种方法可以将字体添加到\
  \ X 中。首先，XFree86 有一个字体路径（font path），它在多个目录或字体服务器中搜索字体。字体服务器只是让 X 使用字体的后台进程。字体服务器的一个优势是可以将字体发送到远程显示。\n\
  \n最近，`xfs`（X 字体服务器）经过修订以支持 TrueType 并作为独立程序运行。该修订版本随 RedHat 和基于 RedHat 的发行版发布，并包含在\
  \ XFree86 4.0 及更高版本中。`xfs` 实际上是自带的标准字体服务器。其源代码是 XFree86 源树的一部分。然而，发行版一直在提供独立模式运行的版本。独立的\
  \ X 字体服务器配合 TrueType 支持（通过名为 `xfst` 的字体服务器实现）可能是目前最好的字体管理解决方案。它的优势包括：\n* 支持不同类型的字体，包括\
  \ Type 1、TrueType 和位图。\n* 使远程显示可用。\n* 极大地简化了字体路径的编辑——你可以通过命令行工具 `chkfontpath` 进行，而不是编辑配置文件。这不仅让用户生活更方便，也让打包更安全且易于脚本化。\n\
  \n由于发行版配置不同，并非一律如此。我们可以将用户分为三组：\n\n* 你的发行版带有独立的 `xfs` 且已经过修订以支持 TrueType。这一组包括 Redhat\
  \ 用户以及 Redhat 衍生版的用户（如 Mandrake 和 TurboLinux）。Debian 3.0 也包含目前测试中的修订版 xfs。对于这组用户，最明智的策略是通过\
  \ `xfs` 同时安装 TrueType 和 Type 1 字体。\n* 某些发行版带有独立的 `xfs` 软件包，但没有 TrueType 支持。注意 XFree86\
  \ 从 4.0 版本开始支持 TrueType。这包括 Debian 稳定版（potato）。对于这些用户，最好的做法是使用 `xfs` 安装 Type 1 字体，并通过\
  \ `xfstt` 安装 TrueType 字体。Debian 用户可以参考《TrueType Fonts in Debian》微型 HOWTO 获取有关在 Debian\
  \ 中安装 TrueType 字体的信息。\n\n\n\n\n如果你没有 `xfs`，那么你需要通过将字体添加到 XFree86 字体路径并使用 `xset`\
  \ 来安装 Type 1 字体。`XFree86 3.x` 用户应该通过 `xfisst` 安装 TrueType 字体，而 `XFree86 4.x` 用户可以将它们添加到\
  \ X 字体路径。你应该通过 `xfisst` 安装 TrueType 字体。\n\n## 字体路径\n\n`XFree86` 通过搜索字体路径（一个包含字体的目录列表）来查找你的字体。当应用程序请求字体时，它会逐个搜索你字体路径中的目录，直到找到该字体为止。要使字体可用，你需要设置你的字体路径。你可以使用命令\
  \ `xset fp+ directory` 将目录添加到你的字体路径中。一旦完成此操作，你只需要使用命令 `xset fp rehash` 请求 X 重新重新扫描可用字体。\n\
  \n由于你希望这些命令自动运行，因此你应该将它们放在你的 `.xinitrc` 文件中，或者可能放在你的 `.Xclients` 或 `.xsession` 文件中。这取决于你如何启动\
  \ X。将这两个文件设为彼此的符号链接很方便，可以避免混淆。\n\n另一种自动设置命令的方法是编辑 `XF86Config`。例如，在 X 启动时将 `/usr/share/fonts/myfonts`\
  \ 添加到字体路径，可以如下编辑 `XF86Config`：\n\n```\nSection \"Files\"\nFontPath /usr/share/fonts/myfonts\n\
  EndSection\n```\n\n编辑 `XF86Config` 的优点是产生的更改是全系统范围。\n\n## 安装 Type 1 字体\n\n让 X 支持\
  \ Type 1 字体最简单的方法是借助 `Type1inst` 实用。这是一个 Perl 脚本，它会自动创建 X 使用字体时所需的 `fonts.dir` 和\
  \ `fonts.scale` 文件。只需 `cd` 进入该目录并运行 `type1inst` 即可。\n\n```\ncd directory type1inst\n\
  ```\n\n现在，你需要将字体添加到字体路径中。如果你已经运行了独立的第 4.4 节，则通过编辑你的 `xfs` 配置文件来实现。RedHat 用户可以直接使用\
  \ `chkfontpath`。格式为 `chkfontpath --add directory`。\n\n在你重启 `xfs` 或通过发送 `SIGHUP`\
  \ 让其重新加载后，你的字体将对 X 可用。你可能还需要运行 `xset fp rehash`。你的字体现在应该对 X 可用了。现在运行 `xset fp rehash`，X\
  \ 就能找到新字体了。\n\n如果你没有 `xfs` 包，你需要按照之前描述的，将包含新字体的目录添加到字体路径。\n\n## 添加 TrueType 字体\n\
  \n添加 TrueType 字体稍微困难一些，因为你需要一个能够提供 TrueType 字体的字体服务器。实现此点的字体服务器是 `xfisst` 和 `xfs`。\n\
  \n`xfisst` 是 TrueType 字体服务器。虽然它很容易配置且非常有用，但似乎 `xfs` 变得越来越流行。`xfs` 相比 `xfisst` 的主要优势是它同时支持\
  \ Type 1 和 TrueType 字体。\n\n设置 `xfisst`只需下载并安装。一旦安装，你需要执行以下操作：\n\n1. 将字体安装到相应的目录（阅读随包附的文档）。\n\
  2. `cd` 进入该目录并运行 `xfisst --sync`。这会导致它查找字体并创建 `fonts.dir` 文件。\n3. 现在将 `unix/:7100`\
  \ 添加到你的字体路径。\n\n你的 TrueType 字体现在应该可以显示并供 `GIMP` 和 `Netscape` 等应用程序使用。你可能希望配置它在每次系统启动时启动。检查是否包含了启动文件（如果你使用\
  \ `RPM`，可以使用 `rpm -ql xfisst|grep init` 并查找类似此类名称的文件：`/etc/rc.d/init.d/xfisst`）。如果你没有初始化脚本，只需在\
  \ `/etc/rc.local` 中放入如下两行内容：\n\n```\n/usr/X11R6/bin/xfisst --sync\n/usr/X11R6/bin/xfisst\
  \ &\n```\n\n一些较新的 Linux 发行版自带了 X 字体服务器 `xfs`，并配置为独立程序运行。Redhat 和所有基于 Redhat 的发行版都使用了编译了\
  \ TrueType 支持的 `xfs`。Debian 同样提供了 `xfs`，但他们提供的版本没有内置的 TrueType 支持。\n\n将 `xfs` 作为独立服务器运行有几个优点，特别是当它编译了\
  \ TrueType 支持时。主要优势是，由于字体服务器不再附加到 X 服务器，因此可以为远程显示提供字体。此外，修改字体路径也更容易。\n\n作为字体服务器，`xfs`\
  \ 有它自己的字体路径。你可以通过将 `unix/:port` 添加到 XFree86 字体路径，将 `xfs` 字体服务器放在 XFree86 的字体路径中。一旦这样做，`xfs`\
  \ 字体路径中的任何字体都会自动对 XFree86 可用。\n\n`xfs` 字体路径由 `xfs` 配置文件决定，在 Redhat 上为 `/etc/X11/fs/config`，在\
  \ Debian 上为 `/etc/X11/xfs/config`。Redhat 用户不需要显式编辑此文件；他们可以使用 `chkfontpath` 工具。语法简单：`chkfontpath\
  \ --add directory`。\n\n其他发行版的用户可以如下编辑配置文件：\n\n```\ncatalogue = /usr/X11R6/lib/X11/fonts/misc:unscaled,\n\
  ...\n/usr/share/fonts/my_new_fonts/,\n...\n/usr/share/fonts/some_other_fonts/,\n\
  ...\n```\n（注：此处原文存在大量重复的配置示例内容，已按要求进行清理）\n\n编辑 `XF86Config` 的优点是产生的更改是全系统范围。\n\n\
  \n\n\n这将分别是普通用户和 root 用户的默认路径。确保 `/usr/bin/X11` 对 X 用户可用是非常重要的。如果 X 用户登录到另一台机器上并启动\
  \ X 客户端应用程序，即使他看起来不是直接从 X 终端来的，也应该将 `/usr/bin/X11` 添加到他的路径中。运行 `Xstartup` 后，`XDM`\
  \ 会运行 `/etc/X11/Xsession`，该进程以最终用户的身份运行。本地配置旨在在 `/etc/environment` 中完成，如果该文件存在，它会被\
  \ `Xsession` 加载（包含）（由于 `Xsession` 使用 `/bin/sh` 运行，因此 `/etc/environment` 必须是 sh 文件）。这与\
  \ `ssh` 冲突，`ssh` 假设 `/etc/environment` 是仅包含 `VAR=VALUE` 格式行的文件。\n\n# 致谢\n\n- [`en.wikipedia.org`](http://en.wikipedia.org/)\n\
  - [`linux.about.com`](http://linux.about.com/)\n- 关于字体：[`linux.about.com/od/howtos/l/blfont4.htm`](http://linux.about.com/od/howtos/l/blfont4.htm)\n\
