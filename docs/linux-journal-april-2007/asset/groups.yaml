  mdcn: "\n\n## 使用 Inkscape 和 XSLT 创建跨平台报表和表单\n\n**查德·法伊尔斯（CHAD FILES）**\n\n我就职于一家医疗保健公司，负责开发应用软件。我和我的同事负责编写用于处理医疗索赔、管理工作流程并使公司尽可能高效的软件。我们最近决定替换一款第三方软件，该软件原本用于获取医疗索赔数据并将其叠加到标准的\
    \ HIPAA（《健康保险流通与责任法案》）索赔表单上。该软件会将数据转换为 PDF 文件，我们将其存储在一台大型文件服务器上。每个 PDF 包含一份在其对应表单上的索赔。我们决定替换该软件是因为我们需要一个更敏捷的方案。我们希望它能动态创建索赔图像，而不是占用我们服务器的空间。\n\
    \n医疗索赔非常复杂（图 1）。需要绘制许多方框和样板文本。使用软件应用程序执行此操作的常规方法是通过坐标和长度绘制一系列线条，然后将静态和动态内容覆盖在\
    \ newly 绘制的线条上方。编写此类应用程序的过程漫长且枯燥，更不用说容易出错了。我们希望找到一种更容易创建和维护的方案。我们的需求如下：\n\n- 我们必须能够打印高质量的索赔版本。\n\
    - 索赔必须可以从 Web 浏览器访问。\n- 解决方案必须与编程语言无关。我们使用 Python、PHP、Perl 和 Java。图像需要使用这些语言中的任意一种创建。\n\
    - 我们必须能够将索赔数据和表单转换为几种不同的文件格式，特别是 PDF 和 PNG。\n- 整个解决方案必须是平台无关的。\n\n在审查需求后，我们考察了几种不同的开源和闭源选项。没有一个满足我们的所有需求，因此我们转向创建自己的解决方案。我们尝试扫描一份空白索赔表单，并使用\
    \ ImageMagick 将索赔数据放置其上。这几乎给了我们想要的结果。问题在于，在所有要求的语言中创建解决方案将是枯燥且冗余的。接下来，我们转向 FOP（格式化对象处理器）。这个解决方案接近我们要的效果。然而，创建索赔表单需要太长时间。此外，该解决方案实际上也不是语言无关的（FOP\
    \ 是一个 Java 库）。我们可以为 FOP 命令行接口编写包装器，但我们确信还有更好的解决方案。\n\n在探索 FOP 解决方案时，我们产生了使用可缩放矢量图形（SVGs）的想法。基本上，我们会将索赔表单的\
    \ SVG 图像转换为 XSLT（可扩展样式表语言转换），因为 SVG 格式是一种特殊的 XML 格式。然后，我们会从数据库中调取索赔数据并将其转换为 XML\
    \ 字符串。使用我们的任何语言，我们都可以将 XSLT 和 XML 结合起来创建索赔的 SVG 图像。此解决方案满足了我们的所有需求。它是语言和平台无关的。我们可以打印\
    \ SVG 图像并将其嵌入到 Web 页面中。此外，SVG 图像可以轻松转换为不同的文件格式。此解决方案的另一个优点是 SVG 图像的文件大小很小。如果我们想归档图像，它们将仅占用旧方案所需空间的一小部分。由于\
    \ SVG 图像是文本而非压缩的二进制文件，文件可以进行压缩以节省更多空间。\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_87_0.png)\n\
    图 1. 健康保险 HCFA 1500 索赔表单\n\n## 创建主 SVG\n\n使 SVG 解决方案如此吸引人的因素之一是创建和维护表单主 SVG 图像非常容易。为此，我们将使用\
    \ Inkscape。Inkscape 是一款 SVG 创建工具，适用于 Linux、Mac OS X、Windows 和其他类 UNIX 操作系统。市面上有其他\
    \ SVG 创建工具，但我们选择 Inkscape，因为它是开源的，并且包含在大多数 Linux 发行版的软件包管理器中。\n\n创建主 SVG 时做的第一件事是在\
    \ Inkscape 中打开一个新文档，尺寸为美国 Letter 大小。为了保持井井有条，我们在新文档中创建了四个图层：扫描、覆盖层、样板和动态文本。使用扫描图层，我们导入了索赔的扫描副本。这样做使我们可以无需测量任何内容即可在\
    \ Inkscape 舞台上对齐所有内容。导入图像后，我们锁定该图层，以防意外修改。实际上，在完成 SVG 上的每个图层后，我们都会锁定它，以确保其未被篡改。\n\
    \n接下来，我们使用覆盖层描摹导入的原始索赔中的所有线条和方框。这一步稍微有点棘手。当我们扫描的图像最初创建时，由于某种原因，线条间距并不均匀。我们决定在版本中正确排列各项内容。幸运的是，Inkscape\
    \ 有工具可以自动完成此操作。通过选择需要间隔的所有对象（Shift+左击）并使用“对齐和分布”对话框（菜单中的“对象”→“对齐和分布”），Inkscape\
    \ 修复了间距问题。完成后，我们得到了类似图 2 的结果。\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_88_0.png)\n\
    图 2. 描摹自索赔表单的线条和方框\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_88_1.png)\n图 3.\
    \ 完成的空白索赔表单\n\n画完所有线条后，是时候添加所有样板文本了。为此，我们使用了名字很贴切的“样板”图层。开始之前，我们决定完全移除扫描图层，因为我们不再需要它。为了正确对齐文本，我们使用了\
    \ Inkscape 中的参考线（Guides）。参考线正如名字所暗示的那样——仅存在于 Inkscape 内部用于对齐对象的参考线。要使用参考线，只需点击顶部或左侧边距，将线条拖到指定位置。为了充分利用参考线，我们启用了“吸附到参考线”功能（“文件”→“文档偏好设置”→“参考线”）。这样做使我们可以将所有文本精确地对齐。图\
    \ 3 显示了此步骤后 SVG 的样子。\n\n最后，我们切换到“动态文本”图层，并在索赔数据所在位置添加占位符。再次，我们使用参考线来对齐所有内容。对于文本占位符，我们每个文本块使用一个\
    \ $。然后，为了方便日后操作，我们将每个动态文本对象重命名为相关内容。我们通过左击对象并进入菜单中的“对象”→“对象属性”来完成此操作。图 4 显示了带有参考线的最终主\
    \ SVG。\n\n创建主 SVG 大约花了四个完整的工作小时。我敢打赌，以编程方式完成这需要几天时间。\n\n## 将 SVG 转换为 XSLT\n\n\
    一旦主 SVG 完成，是时候将其转换为 XSLT 了。由于 SVG 图像只是 XML 文件，我们用文本编辑器添加了所有 XSLT 标记。将 SVG 转换是一件相当简单的事情。要使其成为真正的\
    \ XSLT，只需在头部添加几行代码即可。清单 1 显示了修改前 SVG 中的几行。清单 2 显示了带有 XSLT 标记的同一组行。\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_89_0.png)\n\
    图 4. 带有动态文本图层的最终主 SVG\n\n如您所见，有四个新行。第一行新行将此文件声明为 XSLT。第二行新行包含一个 XPath（XML 路径语言）表达式，匹配我们索赔数据\
    \ XML 中的根元素。此行告知 XML 转换引擎从哪里开始读取 XML 以执行转换。最后两行新行简单地闭合了未关闭的 xml 标签。\n\n此时，XSLT\
    \ 可以与我们的索赔数据 XML 结合使用以生成 SVG。然而，生成的 SVG 将看起来与我们修改前的 SVG 完全一样。要使其实际显示索赔数据，我们必须进入\
    \ XSLT 并添加所有 XPath 表达式以填充 SVG。由于我们将 SVG 对象分为图层，因此只需修改动态文本图层即可。在 SVG XML 中，动态文本图层不过是一系列文本标签。清单\
    \ 3 显示了索赔表单上“患者城市”框的文本标签。\n\n当 XSLT 应用于索赔数据 XML 时，/claim/patient/address/city\
    \ 的值将在此处替换。我们遍历了整个 XSLT，并在适当的位置添加了相应的 XPath 表达式。在特殊情况下，我们还添加了 XPath 条件逻辑和格式规则。\n\
    \n## 索赔数据 XML\n\n如前所述，我们的所有索赔数据都在一个数据库中——更具体地说，是一个 Postgres 数据库。由于我们需要一个与语言无关的解决方案，我们必须想出一种方法，在不依赖特定编程语言的情况下将索赔数据从数据库中取出并放入\
    \ XML 格式。我的一位同事开发者提出了编写一系列 PLuGSQL 函数以返回包含索赔数据的单个 XML 字符串的想法。他的解决方案非常巧妙，完全符合要求。我们只需运行一个带有索赔\
    \ ID 的小型查询（清单 4）即可获取索赔数据。结果是格式良好的 XML，我们用它来制作索赔图像。\n\n### 清单 1. 修改前的 SVG 的几行\n\
    \n```xml\n<xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\">\n<!-- Created\
    \ with Inkscape (http://www.inkscape.org) -->\n<svg\n...\n</svg>\n```\n\n### 清单\
    \ 2. 带有 XSLT 标记的同一组行\n\n```xml\n<xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"\
    no\">\n<!-- Created with Inkscape (http://www.inkscape.org) -->\n<xsl:stylesheet\
    \ version=\"1.0\"\nxmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\">\n<xsl:template\
    \ match=\"/claim\">\n<svg\n...\n</svg>\n</xsl:template>\n</xsl:stylesheet>\n```\n\
    \n### 清单 3. 索赔表单上患者城市框的文本标签\n\n```xml\n<text\n xml:space=\"preserve\"\n style=\"\
    ...\"\n x=\"33.237278\"\n y=\"231.77995\"\nid=\"textPatientCity\"\n sodipodi:linespacing=\"\
    125.00000%\"\n inkscape:label=\"ttext7272\">\n<tspan\n sodipodi:role=\"line\"\n\
    \ d=\"tspan7274\"\n x=\"33.237278\"\n y=\"231.77995\"><xsl:value-of select=\"\
    patient/address/city\"/></tspan></text>\n```\n\n### 清单 4. 带有索赔 ID 的查询\n\n```sql\n\
    SELECT xml_to_string('01592008a5226');\n```\n\n"
