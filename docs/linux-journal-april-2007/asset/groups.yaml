  - "[PAGE 82]\n\n-d 198.168.9.1 -i lport 53 -j ACCEPT\n\nNote that the interface\
    \ used here is eth1, as the packets from the public network will be received at\
    \ eth1. (We have not used -s 0/0, as it is added by default.) Also, keep in mind\
    \ that DNS lookup will succeed only because we already have appended the rule\
    \ for allowing ESTABLISHED connections to the FORWARD list (yes, UDP traffic also\
    \ has an associated ESTABLISHED state).\n\nSo far, we have blocked every protocol\
    \ except SSH and DNS. It is a common practice for a new system administrator to\
    \ block ICMP packets. This is not a good idea, as ICMP packets are useful for\
    \ many purposes, such as for learning the routes between different interconnected\
    \ networks in a large LAN, to see if a machine is up, for Path MTU discovery and\
    \ so on. So, assuming we are sensible administrators, let's allow ICMP packets\
    \ through the firewall:\n\n```\n```\necho \"Allowing ICMP packets\"\n/sbin/iptables\
    \ -A FORWARD -p ICMP -j ACCEPT\n```\n\n```\n\nEarlier, we had blocked any packet\
    \ to and from the firewall box (using INPUT and OUTPUT chains). For diagnostic\
    \ purposes, we can allow ICMP packets through both chains—that is, allow ICMP\
    \ packets to and from the firewall:\n\n```\n```\necho \"Allowing ICMP packets\
    \ to the firewall\"\n/sbin/iptables -A INPUT -p ICMP -j ACCEPT\n\necho \"Allowing\
    \ packets from the firewall\"\n/sbin/iptables -A OUTPUT -p ICMP -j ACCEPT\n```\n\
    \n```\n\nThe ICMP packets also can be rate-limited (as a precaution against ICMP-based\
    \ attacks):\n\n```\n```\necho \"Limit ICMP requests to 5 per second\"\n/sbin/iptables\
    \ -A FORWARD -p icmp --icmp-type \\\n    echo-request -m limit --limit 5/s -j\
    \ ACCEPT\n```\n\n```\n\nWe also might choose to ignore ping broadcasts—that is,\
    \ ICMP packets to broadcast addresses, such as ping 192.168.9.255 (ICMP broadcast\
    \ requests are used in Snort attacks):\n\n```\n```\necho \"Ignoring ICMP broadcast\
    \ requests\"\necho 1 > /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts\n```\n\n\
    ```\n\nAll these rules (commands) will be lost once the system is rebooted; however,\
    \ iptables has options for saving and restoring these rules. But, a better approach\
    \ is to save the rules in a file (say, firewall.sh), give it executable permission\
    \ and append the script name to the end of /etc/rc.d/rc.local. This way, you always\
    \ can edit and make modifications to the firewall script.\n\n\n\n# # Advertiser\
