    Okay, so it''s a darn cool computer with some terrific capabilities hiding in
    a sleek black shell, but is it really just useful for playing video games or can
    you do something else with it—can you turn it into a Linux system?


    Perhaps the most obvious question to ask is why bother? I mean, if you buy a PlayStation
