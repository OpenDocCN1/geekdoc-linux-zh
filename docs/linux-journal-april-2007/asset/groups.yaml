    Because all messages are encrypted and integrity protected, nobody can interpret
    the messages. There is a special LMSG_IGNORE message type that can be used for
    defaulting traffic analysis attacks. These are the kinds of attacks that figure
    out when data is going over the wire and how much data is being transferred.


    SSH, of course, comes with many other niceties for sending secure KEEPALIVE messages,
    redirecting stdin to /dev/null for specialized X window applications and many
    more.


