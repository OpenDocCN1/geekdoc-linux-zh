    \ & EXPO**<br>www.linuxworldexpo.com | 95 | | |\n\n## Asterisk 时区处理（第二部分）\n\n\
    这是我们关于 Asterisk 时区处理系列的第二部分。\n**马修·加斯特（MATTHEW GAST）**\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_83_0.png)\n\
    \n**上个月**，我写了一个关于使用 Asterisk 处理电话呼叫的系统，该系统根据远程位置的时间自动处理呼叫。然而，该系统的使用依赖于用户执行关键任务：通过电话设置远程位置的时间。如果不依赖用户手动发起电话呼叫，如果呼叫能自动发生，那就更简单了。\n\
    \n如果设置呼叫自动发生，用户就不会忘记做这件事。初始的 SIP 注册可能在家庭所在地非常奇怪的时段发生，但 SIP 注册的发生是因为用户插上了某个东西。因此，我们知道用户是清醒的，并且可以接听一个短暂的电话。Asterisk\
    \ 提供了一个管理接口，可以报告 SIP 注册发生的时间，并可用于基于此采取行动。通过一些额外的处理，与管理器交互的脚本可以仅在 SIP 注册是“新”的时候发起呼叫。\n\
    \n### Asterisk 管理器简介\n\nAsterisk 管理器报告 Asterisk 处理的事件，并接受接口上的命令。该接口的形式是基于文本的协议，将事件报告和命令分隔为以键：值格式排列的行簇。例如，使用\
    \ SIP 协议注册分机 300 看起来像这样：\n\n```\nEvent: PeerStatus\nPeerStatus: Registered\nPeer:\
    \ SIP/380\n```\n\n在获得 Asterisk 管理器的访问权限之前，客户端必须针对存储在 /etc/asterisk/manager.conf\
    \ 中的管理员用户列表进行身份验证。登录之后，客户端可以发出命令或通过一组以 Action: 开头的行来查询变量的值，后跟一个命令。对命令的响应通常以 Response:\
    \ Success 开头。对协议的响应是基于文本的，可以使用诸如 Expect 之类的语言进行脚本化。Perl 对象环境（POE）还有一个可用的组件，POE\
    \ 是一个在 Perl 中构建事件驱动程序的框架。免费提供的组件提供了基础级别的响应解析，这在 Expect 中需要编写，因此它是控制 Asterisk 管理器的程序更易于扩展的基础。\n\
    \n### 程序核心和内联状态\n\n程序的主代码很简单。POE 设置了一个系统，在该系统中，状态处理器根据程序状态被调用。状态可以由程序员或外部事件定义。程序的典型流程是注意到\
    \ SIP 注册，检查它是否有时区注册，如果没有，则发起配置呼叫。\n\n为了响应事件执行代码，POE 框架使用一个名为 CallBacks 的哈希。CallBacks\
    \ 中的每个条目都根据从管理器接收的事件定义一个状态。当事件匹配回调时，为该状态定义的处理器会被触发。要使用 CallBacks 子句设置触发器，请识别事件中的每一行，并设置一个哈希，使得事件每行的左侧作为哈希一行的键值。作为一个例子，考虑前面\
    \ SIP 注册事件的回调定义：\n\n```\nEvent:  PeerStatus     register -> { 'Event' => 'PeerStatus',\n\
    Peer:  SIP/380                    'PeerStatus' => 'Registered', }\n```\n\n```\n\
    \       inline_states => {\n   input      => \\&input_state_handler,\n   response\
    \   => \\&response_state_handler,\n   dresponse  => \\&db_response_state_handler,\n\
    \   register   => \\&register_state_handler,\n   call       => \\&call_state_handler,\n\
    \   unregister => \\&unregister_state_handler,\n       },\n  );\n```\n\n要将回调链接到处理器，`inline_states`\
    \ 哈希包含一个状态列表和指向相应代码的引用。虽然可以内联事件处理器代码，但为了可读性，我将代码分离到了外部过程中。响应 CallBack 调用的代码不能传递参数：\n\
    \n```\n123456789*123456789*123456789*123456789*123456789*12\ninline_states =>\
    \ {\n   register => \\&register_state_handler,\n},\n```\n\n```\nPOE::Kernels->run();\n\
    exit(0);\n```\n\n根据程序的流程，有三个事件是感兴趣的。首先，SIP 注册事件用于启动整个过程。SIP 注册通常每小时发生一次，因此重要的是仅在注册是“第一次”注册时发起呼叫。为了防止重复发起电话呼叫，程序将请求来自\
    \ Asterisk 内部数据库 AstDB 以及 SIP 对端信息的数据。第二个和第三个事件分别处理对命令和数据库查询的响应。第四个事件将在从队列接收数据后处理发起电话呼叫。我当前使用的代码还定义了一个用于\
    \ unregister 事件的状态，尽管这是我当前未使用的事件的存根。\n\n两个状态处理器仅仅是存根。input 状态处理器如果设置了调试标志，会打印出它收到的任何内容，它是为开发目的存在的。它捕获来自管理器的任何未识别的事件，在测试回调是否捕获重要事件时可能很有用。unregister\
    \ 状态处理器目前什么也不做，但它作为一个钩子存在，如果我在未来选择基于它采取任何行动，可以扩展它。\n\n程序的核心只有 35 行，其中大部分定义了程序事件状态并显示将使用哪些代码来响应这些状态。请注意，call\
    \ 状态是由程序定义的，而不是由回调定义的，因此 call 状态只能由程序本身进入，而不能作为对管理器事件的响应。（程序的完整列表可在 *Linux Journal*\
    \ 的 FTP 站点上获取；参见资源。）\n\n有了程序的核心，让我们按照典型程序执行流程中调用的顺序查看每个状态。\n\n### 注册事件处理\n\n每当从新分机接收到\
    \ SIP 注册事件时，register 状态处理器就会被调用。它的主要目的是获取设置新分机出现时配置电话呼叫所需的数据。是否进行呼叫取决于扩展的时区处理状态，因此此例程请求信息以确定扩展是否已注册、其\
    \ IP 地址和其他组件。要获取扩展，我们必须获取通道名称，该名称以技术和斜杠（例如 SIP）为前缀，并去掉前面的部分。\n\n```\nPOE::Component::Client::Asterisk->new(\n\
    \  Alias             => 'monitor',\n  RemoteHost        => 'localhost',\n  RemotePort\
    \        => 5138,\n  Username          => 'autozcaller',\n  Password         \
    \ => 'secretspassword',\n  Callbacks => {\n    input    => { },\n    response\
    \ => {\n                 'Response' => 'Success',\n               },\n    dresponse\
    \ => {\n                 'Event' => 'DDebugResponse',\n               },\n   \
    \ register => {\n                 'Event' => 'PeerStatus',\n                 'PeerStatus'\
    \ => 'Registered',\n               },\n    unregister => {\n                 'Event'\
    \ => 'PeerStatus',\n                 'PeerStatus' => 'Unregistered',\n       \
    \        },\n  },\n```\n\n事件处理器的一个棘手之处是 POE 处理器会运行到完成。当处理器运行时，没有方法可以中断它。子程序 getTZchannelVars\
    \ 将请求时区偏移量和 IP 地址的信息，但该信息只有在注册处理器完成并且响应通过管理器返回后才会可用。\n\n在过程结束时，注册处理器使用 delay_set\
    \ POE 方法将 call 状态排队等待未来的延迟，以便在该时间点之前请求将返回其信息。延迟由程序中的全局变量设置。我发现对于只有一个需要设置的未决扩展的单用户\
    \ PBX，一秒绰绰有余，但为了安全起见，延迟设置为三秒。\n\n状态处理器之间的通信与过程驱动程序略有不同。POE 状态处理器传递 POE 内核的引用，用于调度，以及\
    \ POE 堆，用于向 Asterisk 管理器发出命令。POE 定义常量，使堆和内核可以很容易地通过 `$_[HEAP]` 和 `$_[KERNEL]`\
    \ 访问事件处理器。任何其他可用信息都位于 `$_[ARG0]`，这是一个以这种方式定义的常量，使其成为第一个参数。\n\n定义状态的中的任何行都将作为哈希\
    \ `$_[ARG0]` 传递，并通过请求所需行左侧出现的哈希键来访问。在注册响应中，可以通过以下方式访问对端扩展\n\n"
  merge: 0
- raw:
  - "[PAGE 85]\n\n# The Asterisk Manager reports events processed by Asterisk and\
    \ accepts commands over the interface.\n\nreferring to `_ [ARG6] -> ( Peer )`,\
    \ which returns `SIP/300`:\n\n> ```\n> Event: PeerStatus\n> PeerStatus: Registered\n\
    > Peer: SIP/300\n> ```\n\nOn SIP registration, the program needs to identify the\
    \ extension, request information about it and then set up further processing of\
    \ the extension data after a delay. When an event is called through the delay_set\
    \ method, it is possible to pass an extension to the state handler, such as the\
    \ extension number used here:\n\n```\n```perl\nsub register_state_handler {\n\
    \    my $kernel = _ [KERNEL] ;\n    # Split peer extension off from technology\n\
    \    my $peer = $ [ ARG6] -> ( Peer ) ;\n    debug_print(\" Extension is @$peer\
    \ \");\n    my $extn_parts = split('/', @$peer);\n    my $ext = $extn_parts[1];\n\
    \    debug_print(\"Extension number is @$ext\\n\");\n    getTZChannelVars(_ [\
    \ HEAP ], @$ext );\n    debug_print(\" Queueing call event for * \");\n    debug_print(\"\
    SREG_CALL_DELAY seconds\\n \");\n    $kernel ->delay_set(\"CALL\", $REG_CALL_DELAY,\
    \ @$ext );\n} # register_state_handler\n```\n```\n\nAs part of the extension registration\
    \ process, we collect variables about the state of the channel in the getTZChannelVars\
    \ procedure. The POE heap, which is passed as the first argument, can be used\
    \ to issue commands to the manager. For example, the put argument to the server\
    \ can be used to issue commands. To get the SIP peer data, which includes the\
    \ current IP address of the peer, the command looks like this:\n\n```\n```perl\n\
    $heap -> (server) -> put ( { Action => 'SIPShowPeers',\n                     \
    \       Peer => @$ext } );\n```\n```\n\nTo get a database variable, the action\
    \ in the put command is a DBget. The time-zone data is stored as keys in the tz\
    \ family, so it is necessary to specify both the family and assemble the correct\
    \ key name, which is of the form 300-TIMEZONE or similar:\n\n```\n```perl\n$heap\
    \ -> (server) -> put ( { Action => 'DBGet',\n                            Family\
    \ => 'tz',\n                            Key => \"$ext . -TIMEZONE\" } );\n```\n\
    ```\n\nFour database requests and the SIP peer data are requested by getTZChannelVars.\
    \ Because this function is called by an event handler, it also is not interruptible.\
    \ Therefore, it sends four database query events to the manager, but it does not\
    \ process responses directly. (Complete code for the five requests within the\
    \ full procedure is available on the *Linux Journal* FTP site.)\n\n# Command and\
    \ Database Responses\n\nIn the gap between issuing requests and the time the call\
    \ state is scheduled, responses flow in from the SIP data request and the database\
    \ queries. From the SIP data request, we need to pick out the peer IP address,\
    \ which appears on a line in the manager response reading `Address-IP: 192.168.1.5`.\
    \ Conveniently, the POE module parses out the lines in the response, so all we\
    \ need to do is look for the Address-IP line by getting the value of the Address-IP\
    \ hash element in one of the arguments passed to the handler. The POE heap is\
    \ accessible across events, so adding the value of the SIP peer IP address to\
    \ the heap makes it accessible to other event handlers:\n\n```\n```perl\nsub response_state_handler\
    \ {\n    my $peer_ip = $ [ ARG0] -> ( Address-IP ) ;\n    if (defined($peer_ip)\
    \ ) {\n        debug_print(\"SIP context found: Peer IP address \");\n       \
    \ debug_print ( \" is @$peer_ip\\n \");\n        _ [ HEAP ] -> ( 'SIP-Peer-IP\
    \ ')=$peer_ip;\n    } # response_state_handler\n}\n```\n```\n\nAfter the SIP data\
    \ response comes back, the four database queries should return responses. Responses\
    \ to the queries look like this:\n\n> ```\n> DBGetResponse: Success\n> Family:\
    \ tz\n> Key: 300-TIMEZONE\n> Val: -8\n> ```\n\nThe callback handler is triggered\
    \ whenever there is a DBGetResponse: Success event from the manager, with an argument\
    \ of a hash that has each of the lines in the packet. Our interest is in the key\
    \ and value lines, which can be retrieved from the arguments passed to the state\
    \ handler. As with the previous handler, responses are stored in the POE task\
    \ heap to make it available to other handlers:\n\n```\n```perl\nsub db_response_state_handler\
    \ {\n    my $family = _ [ ARG0 ] -> ( Family ) ;\n    my $key = _ [ ARG0 ] ->\
    \ ( Key ) ;\n    my $value = _ [ ARG0 ] -> ( Val ) ;\n    if (defined($family))\
    \ {\n        debug_print ( \"Key stored in DB family $family \");\n        debug_print\
    \ ( \" is $value\\n \");\n        # Store in heap\n        _ [ HEAP ] -> ( $key\
    \ ) = $value;\n    } # db_response_state_handler\n}\n```\n```\n\n# Making the\
    \ Call\n\nEvery registration event triggers a \"call\" event to happen after a\
    \ delay. The delay is used to collect information used to determine whether to\
    \ initiate a call. The setup telephone call should be"
  - "[PAGE 86]\n\ntriggerred only if the time-zone setup has expired or the SIP device\
    \ has changed its IP address and the record is no longer valid.\n\nBecause the\
    \ call_state handler is placed in the queue for execution by the registration\
    \ handler, it does have one argument, the extension number of the call in question.\
    \ The extension can be retrieved as $_[ARG0]. All the data we have added to the\
    \ heap by processing the database responses and SIP data request is also readily\
    \ available:\n\n```\nsub call_state_handler {\n\n\t# Get extension out of arguments\
    \ to function\n\tmy $exten = $_[ARG0];\n\n\tmy $hp = $_[HEAP];\n\n\t# Variables\
    \ we use to determine if the call is required\n\tmy $skev = $hp->{$exten.'-TIMESKEW'};\n\
    \tmy $skev_addr = $hp->{$exten.'-TIMESKEW_ADDR'};\n\tmy $skev_start = $hp->{$exten.'-TIMESKEW_START'};\n\
    \tmy $skev_end = $hp->{$exten.'-TIMESKEW_END'};\n\tmy $sip_peer_ip = $hp->{'SIP-Peer-IP'};\n\
    \tmy $now = time();\n\tmy $now = time();\n```\n\nTo determine whether the call\
    \ is required, the handler compares the current time with the expiration of the\
    \ time-zone offset record and the IP address of the SIP device against the IP\
    \ address stored in the time-zone offset record. If the IP addresses match and\
    \ the offset has not expired, no call is required. Otherwise, a call is needed\
    \ and made with the makeTZSetupCall function:\n\n```\nif ($now > $skev_end) {\n\
    \tdebug_print(\"Make call -- offset has expired.\\n\");\n\tmakeTZSetupCall($_[HEAP],\
    \ $exten);\n} elsif ((!$skev_addr eq $sip_peer_ip)) {\n\tdebug_print(\"Make call\
    \ -- SIP IP addr changed\\n\");\n\tmakeTZSetupCall($_[HEAP], $exten);\n} else\
    \ {\n\tdebug_print(\"No call -- record OK & same IP\\n\");\n}\n```\n\nAs a final\
    \ step, the handler needs to remove the variables placed on the heap. The heap\
    \ is used only to pass variables between state handlers, and the variables are\
    \ not needed once that function is complete. Each of the variables can be undefined\
    \ with the undef function:\n\n```\n# Need to clean up heap\nundef $_[HEAP]->{$exten.'-TIMESKEW'};\n\
    undef $_[HEAP]->{$exten.'-TIMESKEW_ADDR'};\nundef $_[HEAP]->{$exten.'-TIMESKEW_START'};\n\
    undef $_[HEAP]->{$exten.'-TIMESKEW_END'};\nundef $_[HEAP]->{'SIP-Peer-IP'};\n\n\
    } # call_state_handler\n```\n\nMaking the setup call uses the Asterisk Manager's\
    \ Originate command, but it is protected by one final check. I've defined a set\
    \ of extensions as the remote channel list. Only extensions on the remote channel\
    \ list will have time-zone setup calls made to them. Initially, the list consists\n\
    \nof my softphone and an analog telephone adapter, but I may need to add more\
    \ in the future. Before originating the call, I ensure that the number is on a\
    \ remote channel list, which is defined in the global array REMOTE_CHANNEL_LIST.\
    \ The Originate command can take several arguments as well. The extension, priority\
    \ and context must refer to where the setup menu is defined. In my case, these\
    \ values are extension *89 (for ^4-TZ), priority 1 and the context from-internal.\
    \ I also can supply the caller-ID text of “Time Zone Setup” to the phone I am\
