    `echo \"Route to 192.168.9.0/24 is through eth0\"\n    /sbin/route add -net 192.168.9.0/24\
    \ eth0`\n```\n\n```\n`echo \"The default gateway is eth1\"\n    /sbin/route add\
    \ default eth1`\n```\n\nSimilarly, you have to tell all machines in your network\
    \ to use 192.168.9.253 as the default gateway (because you have to go through\
    \ the gateway to access any machine outside your network). LAN machines can be\
    \ accessed directly. Do the following on all machines (except the firewall, obviously)\
    \ in your network:\n\n```\n`echo \"Add default route through the gateway\"\n \
    \   /sbin/route add default gw 192.168.9.253 eth0`\n```\n\n```\n`echo \"192.168.9.0/24\
    \ is directly reachable\"\n    /sbin/route add -net 192.168.9.0/24 eth0`\n```\n\
    \nNext comes the firewall rules—rules that protect a network. Rules are written\
    \ using the iptables tool. This is a very useful tool, although a bit complex,\
    \ with a detailed man page on the various options. The iptables Netfilter uses\
    \ three different built-in chains: INPUT, FORWARD and OUTPUT. Packets traverse\
    \ through the chains, and therefore, the rules are written for specific chains.\
    \ With respect to your firewall, any packet destined to your firewall (192.168.9.253\
    \ or 192.168.9.254) goes to the INPUT chain. If the packet is meant to be forwarded\
    \ (that is, it is not for your firewall, and there is a route in your firewall\
    \ to the destination), it goes through the FORWARD chain. Any packet generated\
    \ by your firewall will go out from the box through the OUTPUT chain. (This brief\
    \ explanation is applicable to any Linux box.) Although you would never want the\
    \ firewall to forward every packet passing through it, you might want to test\
    \ whether the functionality of the gateway is working with the above configuration.\
    \ To do this, make the default policy of the FORWARD chain as ACCEPT (using the\
    \ -P option)—that is, any packet going through the forward chain is accepted:\n\
    \nA ping request from any machine in the network 192.168.9.0/24 (save, the firewall)\
    \ to any (live) machine outside the network will now return with the ICMP echo\
    \ reply packet. If the external machine is not reachable, there may be some problem\
    \ with the cable or network card, or you might have misconfigured something.\n\
    \nNow, let’s build the “wall”. The easiest way of setting up a firewall is by\
    \ rejecting (DROP) every kind of packet, and then writing rules to allow (ACCEPT)\
    \ those packets that you want to see go through. So, let’s make the default policy\
    \ in each of the chains to drop packets.\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_80_0.png)"
