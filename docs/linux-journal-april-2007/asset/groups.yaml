  - "[PAGE 83]\n\n# ## Time-Zone Processing  \nwith Asterisk, Part II\n\nPart II of\
    \ our series on time-zone processing with Asterisk.  MATTHEW GAST\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_83_0.png)\n\
    \n**Last month**, I wrote about a system for handling telephone calls with Asterisk\
    \ that automatically handled the call depending on the time of day at a remote\
    \ location. Use of the system, however, depended on the user performing the critical\
    \ task of setting up the remote location's time with a telephone call. Rather\
    \ than rely on the user to initiate the telephone call manually, it would be easier\
    \ if the call occurred automatically.\n\nIf the setup call occurs automatically,\
    \ the user won't forget to do it. The initial SIP registration may occur at a\
    \ very strange hour in the home location, but the SIP registration occurs because\
    \ a user has plugged something in. Therefore, we know the user is awake and can\
    \ take a short call. Asterisk provides a management interface that reports when\
    \ SIP registrations occur and can be used to take action based on it. With a bit\
    \ of additional processing, a script talking to the manager can initiate calls\
    \ only when the SIP registration is “new”.\n\n# **Introduction to the Asterisk\
    \ Manager**\n\nThe Asterisk Manager reports events processed by Asterisk and accepts\
    \ commands over the interface. The form of the interface is a text-based protocol\
    \ that separates event reports and commands into clusters of lines with a key:\
    \ value format. For example, the registration of extension 300 using the SIP protocol\
    \ looks like this:\n\n```\n```\nEvent: PeerStatus\nPeerStatus: Registered\nPeer:\
    \ SIP/380\n```\n```\n\nBefore gaining access to the Asterisk manager, clients\
    \ must authenticate against the list of administrative users stored in /etc/asterisk/manager.conf.\
    \ Once logged in, a client can issue commands or query the value of variables\
    \ with a set of lines that starts with a first line of Action:, followed by a\
    \ command. Responses to commands typically start with Response: Success. Responses\
    \ to the protocol is text-based, it can be scripted in a language like Expect.\
    \ A component is also available for the Perl Object Environment (POE), a framework\
    \ that builds event-driven programs in Perl. The freely available component provides\
    \ the base-level response parsing that would need to be written in Expect, so\
    \ it is a much more extensible foundation for programs controlling the Asterisk\
    \ manager.\n\n# **The Program Core and Inline States**\n\nThe main code for the\
    \ program is simple. POE sets up a system where state handlers are called in response\
    \ to program states. A state can be defined by the programmer or by an external\
    \ event. The typical flow through the program is to notice a SIP registration,\
    \ check to see whether it has an active time-zone registration and if not, to\
    \ initiate a configuration call.\n\nTo execute code in response to an event, the\
    \ POE framework uses a hash called CallBacks. Every entry in CallBacks defines\
    \ a state based on the event received from the manager. When an event matches\
    \ a callback, the handler defined for the state is triggered. To set up a trigger\
    \ with the CallBacks clause, identify every line in the event and set up a hash\
    \ so that the left-hand side of each line of the event is the key value for a\
    \ line of the hash. As an example, consider the callback definition for the SIP\
    \ registration event earlier:"
  - "[PAGE 84]\n\n```\nEvent:  PeerStatus     register -> { 'Event' => 'PeerStatus',\n\
    Peer:  SIP/380                    'PeerStatus' => 'Registered', }\n```\n\n```\n\
    \       inline_states => {\n   input      => \\&input_state_handler,\n   response\
    \   => \\&response_state_handler,\n   dresponse  => \\&db_response_state_handler,\n\
    \   register   => \\&register_state_handler,\n   call       => \\&call_state_handler,\n\
    \   unregister => \\&unregister_state_handler,\n       },\n  );\n```\n\nTo link\
    \ the callback to a handler, the `inline_states` hash has a list of states and\
    \ references to the corresponding code to call. Although it is possible to inline\
    \ event-handler code, for readability I have separated the code out into external\
    \ procedures. Code called in response to a CallBack cannot be passed arguments:\n\
    \n```\n123456789*123456789*123456789*123456789*123456789*12\ninline_states =>\
    \ {\n   register => \\&register_state_handler,\n},\n```\n\n```\nPOE::Kernels->run();\n\
    exit(0);\n```\n\nBased on the flow of the program, three events are of interest.\
    \ First, SIP registration events are used to start the entire process. SIP registrations\
    \ typically occur hourly, so it is important to initiate the call only when a\
    \ registration is the \"first\" registration. To prevent duplicate telephone calls\
    \ from being initiated, the program will request data from both the Asterisk internal\
    \ database AstDB as well as the SIP peer information. The second and third events\
    \ will handle responses to commands and database queries, respectively. A fourth\
    \ event will handle initiating the telephone call after receiving data back from\
    \ the queues. The code I am currently using also has a state defined for unregister\
    \ events, though it is a stub for an event that I am not currently using.\n\n\
    Two of the state handlers are only stubs. The input state handler prints out whatever\
    \ it gets if a debug flag is set, and it is there for development purposes. It\
    \ catches any unrecognized events that come from the manager, and can be useful\
    \ when testing that callbacks are catching the important events. The unregister\
    \ state handler currently doesn't do anything, but it is there as a hook to expand\
    \ if I choose in the future to take any action based on that.\n\nThe core of the\
    \ program is only 35 lines, most of which defines the program event states and\
    \ shows what code will be used in response to those states. Note that the state\
    \ of call is defined by the program and not by a callback, so the call state can\
    \ be entered only by the program itself and not in response to an event from the\
    \ manager. (A full listing of the program is available on the *Linux Journal*\
    \ FTP site; see Resources.)\n\nWith the core of the program in place, let's look\
    \ at each of the states in the order they will be called through a typical program\
    \ execution flow.\n\n# ## Registration Event Handling\n\nThe register state handler\
    \ is called whenever a SIP registration event is received from a new extension.\
    \ Its main purpose is to get the data required for setting up the configuration\
    \ telephone call when a new extension pops up. Whether a call is made depends\
    \ on the state of the extension as far as time-zone processing, so this routine\
    \ requests information to determine whether the extension is registered, its IP\
    \ address and other components. To get the extension, we have to take the channel\
    \ name, which is prefaced with the technology and a slash (for example SIP) and\
    \ strip the leading part away.\n\n```\nPOE::Component::Client::Asterisk->new(\n\
    \  Alias             => 'monitor',\n  RemoteHost        => 'localhost',\n  RemotePort\
    \        => 5138,\n  Username          => 'autozcaller',\n  Password         \
    \ => 'secretspassword',\n  Callbacks => {\n    input    => { },\n    response\
    \ => {\n                 'Response' => 'Success',\n               },\n    dresponse\
    \ => {\n                 'Event' => 'DDebugResponse',\n               },\n   \
    \ register => {\n                 'Event' => 'PeerStatus',\n                 'PeerStatus'\
    \ => 'Registered',\n               },\n    unregister => {\n                 'Event'\
    \ => 'PeerStatus',\n                 'PeerStatus' => 'Unregistered',\n       \
    \        },\n  },\n```\n\nOne wrinkle of the event handler is that POE handlers\
    \ run to completion. There is no way to interrupt a handler when it is running.\
    \ The subprocedure getTZchannelVars will request information on the time-zone\
    \ offset and IP address, but that information will not become available until\
    \ the registration handler completes and the response return via the manager.\n\
    \nAt the end of the procedure, the registration handler uses the delay_set POE\
    \ method to queue up the call state for a delay in the future so that the requests\
    \ will have returned their information by that point. The delay is set by a global\
    \ variable in the program. I have found that one second is more than adequate\
    \ for a single-user PBX with only one outstanding extension requiring setup, but\
    \ the delay is set to three seconds for safety.\n\nCommunication between state\
    \ handlers is a bit different from that in a procedure-driven program. POE state\
    \ handlers pass references to the POE kernel, which is used in scheduling, as\
    \ well as the POE heap, which is needed to issue commands to the Asterisk Manager.\
    \ POE defines constants so the heap and kernel are easily accessible to event\
    \ handlers as `$_[HEAP]` and `$_[KERNEL]`. Any other information available is\
    \ located at `$_[ARG0]`, which is a constant defined in such a way that it is\
    \ the first argument.\n\nAny lines in the event that defines the state will be\
    \ passed as the hash `$_[ARG0]` and are accessible by asking for the hash key\
    \ that appears on the left-hand side of the desired line. In the registration\
    \ response, it is possible to get at the peer extension by"
