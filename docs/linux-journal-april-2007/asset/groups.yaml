    \ 解析器将整个文件读入内存，因此提供了更好的选项来导航和操作 XML 节点。\n\n让我们看看使用 SAX 和 DOM 的例子，这样你可以看到哪一个适合你的目的。SAX\
    \ 示例展示了如何从 XML 文件中提取唯一的节点名称。DOM 示例说明了当文件完全读入内存后，如何从特定节点内部读取值。\n\n首先，让我们使用 SAX\
    \ 解析器来看看 content.xml 文件中有哪些节点。该代码简单地打印文件中找到的每种节点名称。请注意，对于不同类型的文件，你可能会得到不同的节点名称（参见列表\
    \ 4）。\n\nSAX 程序需要一个从 `ContentHandler` 派生的类，并重写函数以处理每个节点的开始、中间和结束。列表 4 中显示的 `tagHandler`\
    \ 类主要用于跟踪每个节点的开始并忽略其内容。这里使用 `keys()` 方法将名称列到一个列表中，该列表也可以排序。我经常使用这种技术快速获取唯一成员的排序，因为\
    \ Python 字典中的哈希函数非常快。以下是该程序的输出：\n\n- office:automatic-styles\n- office:styles\n\
    - office:document-content\n- office:font-face-decls\n- office:forms\n- office:text\n\
    - style:font-face\n- style:list-level-properties\n- style:paragraph-properties\n\
    - style:style\n- style:text-properties\n- text:a\n- text:line-break\n- text:list\n\
    - text:list-item\n- text:list-level-style-bullet\n- text:list-style\n- text:p\n\
    - text:s\n- text:sequence-decl\n\n## 列表 4. 列出唯一的标签名称\n\n```python\n#\n# This program\
    \ will list out the uniq tag\n# names in a XML document.\n# Author: Kamran Mousin\n\
    #\n\nimport sys\nfrom xml.sax import parse, ContentHandler\n\nclass tagHandler(ContentHandler):\n\
    \    def __init__(self, tagname=None):\n        self.tag = tagname\n        self.uniq\
    \ = {}\n\n    def startElement(self, name, atr):\n        if self.tag == None:\n\
    \            self.uniq[name] = 1\n        elif self.tag == name:\n           \
    \ self.uniq[name] = name\n            # ignore attributes for now\n\n    def getNames(self):\n\
    \        return self.uniq.keys()\n\nif __name__ == '__main__':\n    mytagHandler\
    \ = tagHandler()\n    parse(sys.argv[1], mytagHandler)\n    myNames = [str(x)\
    \ for x in mytagHandler.getNames()]\n    myNames.sort()\n    for x in myNames:\n\
    \        print x\n```\n\n"
