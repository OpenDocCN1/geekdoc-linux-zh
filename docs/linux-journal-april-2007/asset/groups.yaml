    \ 的许多方面对我来说也很有吸引力。特别是，Dojo 广泛的小部件集，以及这些小部件如何通过事件系统相互连接，提供了一种丰富的功能集，所有 JavaScript\
    \ 开发人员都可以享受。即使你计划不使用 Dojo，你也应该考虑安装并尝试它，只是为了了解它是如何工作的。\n\n> Reven M. Lerner，一位资深的\
    \ Web/数据库顾问，是伊利诺伊州埃文斯顿西北大学学习科学的博士候选人。他目前与他的妻子和三个孩子住在伊利诺伊州斯科基。你可以在 revenandlerner.com\
    \ 阅读他的网络日志。\n\n## 资源\n\n关于 Dojo 的主要信息来源以及 Dojo 软件发布是 **dojotoolkit.org**。工具包的文档仍然有点稀疏，但在过去几个月里有了显著改善，并且随着\
    \ Dojo 日益增长的人气，似乎继续改善的可能性很大。Dojo 文档的主要 URL 在 **dojotoolkit.org/docs**，而 Dojo 书籍（基于\
    \ Wiki 的 Dojo 文档）在 **manual.dojotoolkit.org/index.html**。\n\n关于 JavaScript 工具包（包括\
    \ Dojo）的一些好文章位于 **www.sitepoint.com/article/javascript-library**。\n\n最后，关于 Dojo\
    \ 事件的引人注目的介绍位于 **www.dojotoolkit.org/docs/dojo_event_system.html**。\n\n# 保护您的数据安全——这绝对是超赞的！\n\
    \n安全对不同的人来说意味着不同的东西。在你的 Linux 系统中，安全不仅仅是把人拒之门外，它还关乎知道你可以恢复你误删的电子邮件文件夹。\n\n**我为什么不能**\
    \ 登录我们的主服务器，François？你试图提高安全性？没有跟我讨论？是的，当然，我感激你的初衷，但现在完全无法远程访问系统了。事实上，我甚至无法在主控制台上登录。你改了密码？并加密了文件系统？天哪，François，这确实有点过火了。好吧，告诉我新密码，我会把事情恢复原样。你是什么意思，你不能？你忘了你加密文件系统时使用的密码短语？\n\
    \n幸运的是，*亲爱的朋友*，我们的客人已经到了，而且我们有备份。去酒窖取回西班牙 2001 年的 Ma La Plana 赤霞珠。还有，既然你在那下面，不要锁任何门或更改任何密码组合。\n\
    \n欢迎来到 Marcel 的小屋，在这里，卓越的年份葡萄酒与卓越的 Linux 和开源软件搭配。请入座，自便吧。我忠实的侍者正在酒窖取酒。在你到达之前，François\
    \ 令人钦佩地证明了拥有一个可靠的备份系统的重要性。备份可以是简单的文件集合烧录到 CD，也可以是存储在远程系统上的 tar 归档包，或者是在单独驱动器上的数据副本。事实上，创建备份的方法有成千上万种，对我们许多人来说，通常只涉及备份那些我们珍视的文件。在多-tier\
    \ 环境或大型繁忙系统中，东捡西捡文件可能是不够的。你需要所有东西。\n\n啊，François，你回来了。*请，为客人倒酒吧。* 享受吧，*我的朋友们*，这是一款美妙的葡萄酒，拥有一些*精致*的葡萄，深黑色的水果复杂度和一丝巧克力风味。\n\
    \n尽管葡萄酒可能很出色（确实如此），但今晚菜单的真正主角是一个名为 Mondo Rescue 的强大备份和系统恢复程序。Mondo Rescue 的精神在于一种没有人想要设想的场景，即灾难性的系统故障。我说的不是丢失你的电子邮件文件夹（尽管我也会将其视为灾难）。Mondo\
    \ Rescue 关注的是“硬盘没了，机器爆炸了，我们需要从头开始”这类灾难。或者，就像 François 的情况，安全增强措施彻底搞砸了。Mondo Rescue\
    \ 支持多种备份介质，它可以创建可启动的备份，让你能够恢复灾难发生前系统的镜像。\n\n为了开始，请访问 Mondo Rescue 网站获取软件副本（参见*资源*）。你需要一些东西才能开始，因为并没有单一的、包罗万象的\
    \ Mondo Rescue 软件包。别担心；清单很短，而且 Mondo Rescue 为众多令人印象深刻的发行版和发布级别提供了软件包。你需要的软件包还有\
    \ buffer、mini、mindi、mini-busybox、syslinux 和主要软件包，即名字很贴切的 mondo。由于我觉得有必要使用“贴切”（aptly）这个词，这里是\
    \ Debian 和 Ubuntu 用户可以夸耀的地方，因为他们可以通过输入 `apt-get install mondo` 来安装他们需要的一切。\n\n\
    Mondo Rescue 当然有两面：灾难准备和从灾难中恢复。备份程序称为 *mondoarchive*，恢复程序称为 *mondorestore*。让我们从备份程序开始。*mondoarchive*\
    \ 程序默认以交互模式运行，拥有一个时尚（按照 curses 标准）且易于使用的界面。你通过使用键盘并按 Tab 键从一个菜单选项导航到另一个选项来操作界面。从\
    \ shell 中启动 *mondoarchive*\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_27_0.png)\n\
    \n"
