    Finally, we''re getting somewhere, because now we can differentiate between the
    files that actually are images, and the files that are other sorts of data.


    One last refinement before I wrap this up: instead of just showing the links as
    clickable, let''s actually output clickable links for non-images, and make the
    images themselves clickable. This can be done as follows:


    ```

    for fname in *

    do

    if [ ! -z "`$file $name | grep ''image data''`" ]; then

    echo "<a href=$name>img"

    echo "$src=$name</a><br>$name<br>"

    else

    echo "<a href=$name>$name</a><br>"

    fi

    done

    ```


    If the images aren''t too large, this starts to look pretty nice, as you can see
    in Figure 1. If they are big images, however, it doesn''t work quite as well.
    So, next month I''ll show you some refinements to this script, including how we
    can have more than one image appear on a line.




