    ## 图 2. OpenSSH 协议流程图


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_76_1.png)


    ## 图 3. OpenSSH 数据包处理


    ```

    string    TERM 环境变量值 (例如, vt100)

    uint32    终端宽度, 字符数 (例如, 80)

    uint32    终端高度, 行数 (例如, 24)

    uint32    终端宽度, 像素 (例如, 640)

    uint32    终端高度, 像素 (例如, 480)

    string    编码的终端模式

    ```


    大多数字段都是不言自明的。前两个字段始终存在于所有消息中。有效载荷数据包（用户输入的内容以及来自服务器的响应）都通过 `SSH_MSG_DATA` 消息类型进行承载。


    每个数据包都有一个头部，该头部描述了有效载荷的内容（消息类型）以及其目标通道。


    某些消息不需要对方的响应，因为底层协议不仅是可靠的，而且具有防篡改能力。但是，来自客户端的大多数请求都有来自服务器的相应响应。


    现在，让我们深入了解 SSH 密钥交换协议的细节，因为这是决定 SSH 安全性和普及度的最关键组件。图 3 展示了为加密、压缩和完整性保护所必需的数据操作。当然，我们还需要保护自己免受重放攻击。为此，每个数据包都有一个隐式的序列号，它从
    0 开始递增，直到达到 $2^{32}$ 后回绕。由于序列号经过哈希处理，它可以是连续的，且攻击者永远无法猜测什么输入会导致什么哈希值。


    OpenSSH 密钥的主要组件包括：


    - 哈希值：H。

    - 共享密钥：K。

    - 会话 ID：session_id。


    SSH 使用上述组件推导以下加密向量和密钥：


    - 客户端到服务器的初始化向量。

    - 服务器到客户端的初始化向量。

    - 客户端到服务器的加密密钥。

    - 服务器到客户端的加密密钥。

    - 客户端到服务器的 MAC 密钥。

    - 服务器到客户端的 MAC 密钥。


    推导上述向量和密钥所使用的方程取自 RFC 4253。在以下内容中，$\parallel$ 符号表示连接，K 编码为整数，"A" 编码为字节，session_id
    为原始数据。任何字母，如带引号的 "A"，表示单个字符 A，即 ASCII 码 65。


    - 客户端到服务器的初始 IV：HASH(K $\parallel$ H $\parallel$ "A" $\parallel$ session_id)。

    - 服务器到客户端的初始 IV：HASH(K $\parallel$ H $\parallel$ "B" $\parallel$ session_id)。

    - 客户端到服务器的加密密钥：HASH(K $\parallel$ H $\parallel$ "C" $\parallel$ session_id)。

    - 服务器到客户端的加密密钥：HASH(K $\parallel$ H $\parallel$ "D" $\parallel$ session_id)。

    - 客户端到服务器的完整性密钥：HASH(K $\parallel$ H $\parallel$ "E" $\parallel$ session_id)。

    - 服务器到客户端的完整性密钥：HASH(K $\parallel$ H $\parallel$ "F" $\parallel$ session_id)。


    很简单，对吧？然而，并不简单的是如何确定 K 和 H 参数。HASH 通常指 SHA1 哈希机制，但也可能是其他机制。典型的加密算法使用的是 AES 或 DES3
    的 CBC 模式。MAC 是 MD5 或 SHA1 哈希算法与秘密密钥的组合。这里有四种选择：


    - hmac-sha1

    - hmac-md5

    - hmac-sha1-96

    - hmac-md5-96


    实际上，在当今世界中 sha1 稍显薄弱，因为碰撞攻击是可能的。当今哈希领域的趋势是 sha512，但通过适当的重新密钥生成和其他智能机制的内置，这应该不成问题。请记住，哈希值具有固定长度，因此
    hmac-sha1 的长度为 20 字节，hmac-md5 为 16 字节，而另外两种各为固定的 12 字节。


    好的，现在进入密钥阶段的数学和密码学体操部分。只要使用上述简单方程推导基本参数，我们就知道如何计算单独的加密密钥和 MAC 密钥。但是，我们如何以安全、经过认证的方式获取这些参数呢？


    现在，我们需要查看 OpenSSH 如何使用 `diffie-hellman-group14` 和 `diffie-hellman-group1` 字段来推导用于匿名密钥协商的
    DH 生成元和 DH 模数。然而，这使得我们容易受到多种中间人和其他主动攻击的影响。为了阻止这些攻击，我们使用已知且可信的服务器公钥来认证密钥交换。密钥交换数据的认证无非就是使用私钥进行签名。OpenSSH
    通常使用 `ssh-dsa` 或 `ssh-rsa` 密钥来执行此操作。


    换句话说，DH 与 RSA/DSA 密钥的组合用于认证以及推导秘密参数 K、H 和 session_id。session_id 仅仅是第一次密钥交换的哈希值。还使用一个
    16 字节的随机 cookie 来保护免受重放和其他中间人攻击。


    以下是推导 H 的方程：


    H = hash(V_C $\parallel$ V_S $\parallel$ I_C $\parallel$ I_S $\parallel$ K_S $\parallel$
    e $\parallel$ f $\parallel$ K)


    - hash 通常指 SHA1 哈希算法。

    - V_C 和 V_S 分别是客户端和服务器识别字符串。

    - I_C 和 I_S 是刚刚交换的客户端和服务器的 `SSH_MSG_KEXINIT` 消息。


    现在，剩下需要计算的是 e、f 和 K；e 和 f 是用于指数运算的 DH 参数：


    - e = $g^x \bmod p$

    - f = $g^y \bmod p$

    - K = $e^y \bmod p$


    这里，p 是来自 DH 生成元域的质数。x 和 y 由客户端和服务器任意选择。请记住，DH 基于一个简单的数学原理 $a^{xy} = (a^x)^y =
    (a^y)^x$ 工作。


    现在，我们拥有计算秘密密钥所需的一切。关于所有这些密码学参数的好处在于，它们在每次会话后都会被丢弃。唯一重用的参数是服务器 RSA/DSA 密钥，但由于我们在计算中添加了随机
    cookie，攻击者很难在密码学上破解 SSH。


    ## 各组件描述


    在我们继续之前，让我们先看看 OpenSSH 家族。


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_78_0.png)


    ### 图 4. OpenSSH 星系中的明星


    如图 4 所示，在大局中有很多可执行文件和参与者。然而，它们之间的相互作用并不复杂。我上面讨论的所有内容实际上都是由 SSH 和 sshd 组件（分别是客户端和服务器）实现的。其他组件很少用于密钥生成、代理转发等。


    `sftp-server` 是 SSH 的子系统。这是一种类似 FTP 的协议，但与破碎的 FTP 协议不同，它具有高度的安全性和效率。


    `scp` 是一种基于 SSH 基础设施构建的、流行且方便的文件传输机制。由于完整性保护内置于 SSH 线路协议中，文件完整性得到保证。然而，它没有为中断的传输提供恢复功能，因此你需要与
    `rsync` 一起使用才能获得该功能。


    ## 安全分析与攻击


    现在，让我们看看 SSH 帮助我们防御的攻击类型和威胁模型。


    任何密码协议中最关键的组件之一是随机数生成器的质量。由于计算机是确定性设备，获取真正的随机数据是一项挑战。常见的熵源包括磁盘访问、键盘和鼠标输入、进程生命周期等。大量传统
    UNIX 程序依赖于 `gettimeofday(2)` 系统调用。SSH 也使用可靠的机制来检查数据池的随机性。


    一种特定于 SSH 的有趣攻击是使用控制字符序列来终止会话并干扰 pty 交互，因此我们必须过滤掉可疑的字符序列。


    SSH 最关键且不幸的是最薄弱的环节是服务器/主机认证。现实情况和典型的用户疏忽证明，每当新主机密钥被添加到我们的可信列表时，我们往往只是说“是”。目前正在努力使这一过程更加安全和便捷。如果未能确保这一点，各种类型的中间人攻击都是可能的。


    Girish Venkatachalam 是一位密码学家，拥有近十年的现代 UNIX 系统工作经验。他曾从头开始为路由器在 Nucleus OS 上开发 IPsec，并深入研究过
    Apache、OpenSSL 和 SSH 的核心。他的联系方式是 girish729@gmail.com。


