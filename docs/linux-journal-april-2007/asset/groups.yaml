    # Common Criteria—Early Standard for Security


    Many government agencies worldwide require IT vendors to adhere to Common Criteria
    security certification standards. The Common Criteria is recognized internationally
    by IT professionals as the ISO standard (ISO/EC 15408) used by the United States
    government and other organizations to assess security and assurance of technology
    products. The world’s largest Linux enterprise server distribution vendors, Novell
    and Red Hat, for instance, have achieved three levels of security certification
    that enable Linux to be adopted by governments and government agencies running
    on multiple IBM software and hardware platforms.


    a customer. This same talent pool quickly addresses emerging security concerns,
    plugging holes and releasing patches before a company’s infrastructure is ever
    compromised. With other operating systems, bug fixes and security patches are
    more likely to be lumped together and released based on specific timelines that
    accommodate the vendor, not the users.


    But as citizen applications become the norm, the user role the root. Citizens
    are becoming more accustomed to self-service applications, such as renewing a
    driving license on-line or paying a citation. As the number of citizens accessing
    information on-line grows, so does the incidence of cyber crimes. Crackers, fraudsters
    and identity thieves keep abreast of technology advances, increasing their sophistication.


    This now poses significant new threats to governments where the chief concern
    includes safeguarding national security and information privacy. As citizens share
    sensitive information, including names, date of birth, addresses and social security
    numbers with e-government systems, there needs to be a check in place to ensure
    this information is guarded by the highest levels of security.


    As a result, advances in Linux security continue to improve, especially in the
    affordability of implementing higher-level security architectures. Open-source
    software provides more transparency and user control, allowing users to identify
    and fix security vulnerabilities as and when they happen, as compared to waiting
    for vendors to fix the security flaws.


    # UK Cabinet Office Pioneers Security-Enhanced Linux


    Advances in security continue to improve, especially in the affordability of implementing
    higher-level security architectures. For use within governments, one resource
    has been the use of Security-Enhanced (SE) Linux. The Mandatory Access Control
    provides access to information on a need-to-know basis, protecting governments
    better from potential cracker and virus threats.


    IBM has been a key enabler, consistently supporting the growth of SELinux while
    simultaneously ensuring that security within the platform is hardened, maintained
    and enhanced without compromising access and ease of use. IBM recently worked
    with the UK Cabinet Office and partners Treshes and Belim Group on the first pilot
    for Mandatory Access Control through Security-Enhanced Linux in an e-government
    application at a National Health Service hospital trust in England. Through the
    use of this technology, any organization will have the ability to contain crackers,
    provide the necessary containment for its applications and minimize damage to
    the enterprise.


    For years, customers have demanded secure, open, interoperable platforms that
    are easier to manage and more flexible in running different workloads in a heterogeneous
    architecture that often comprises disparate products from multiple IT vendors.
    This trend is particularly pervasive in emerging markets.


    # India: A Shining Star for Linux and Open Source


    India has been a shining star for open-source Linux software, with growth rates
    for sales doubling in the past year alone. The government and defense sectors
    have been one of the key drivers for Linux adoption in India, which combined accounted
    for 38% of the Linux market during 2005–2006 according to Datapiexus. In India,
    customers are flocking to Linux because it provides a low-cost, highly secure
    and customizable alternative to closed systems and vendor lock-in.


    Just this month (January 2007), it was reported that Tamil Nadu, one of the largest
    and most industrialized states in India with a population the size of the UK,
    is moving away from a closed system in favor of open source. They also are training
    30,000 government officials on Linux, a key move because technical skills have
    been one of the barriers to further adoption of open-source software. Recently,
    the state of Kerala, which boasts a 100% literacy rate, announced it was migrating
    to Linux as well.


    # Project Higgins and User-Centric Management


    With the growth of on-line government services, citizens are benefiting from new
    open-source software security initiatives that are aimed at helping protect their
    personal information. IBM, Harvard Law School’s Berkman Center for Internet and
    Society, Novell and Party Communications are working on an open-source initiative,
    code-named Higgins, that will spawn a new generation of security software, giving
    people more control over personal on-line information.


    The Higgins initiative is developing software for user-centric identity management,
    an emerging trend in security software. User-centric identity management enables
    individuals to manage and control their on-line personal information actively,
    such as bank account numbers, medical records, telephone numbers and credit card
    numbers—rather as institutions managing that information as they do today. People
    will decide what information they want to share with trusted on-line Web sites
    that use the software.


    The user will play a key role in the future in helping enterprises and institutions
    comply with various e-governance regulations. As users have more and more access
    to e-citizen services, user-centric management will help in identifying the information
    individuals want to share, for instance to their healthcare provider. A healthcare
    provider does not necessarily need to know the user’s personal information and
    will have access to information relevant to the patient’s medical history, thus
    limiting the exposure to data loss.


    The Higgins initiative moves on-line security to the next stage by creating an
    open, highly secure and flexible software platform that essentially puts the user
    in the center of the identity management cosmos.


    Linux is continuing to become an unstoppable force in the public sector, helping
    provide government agencies and the citizens they serve worldwide a computer operating
    system both can trust.


    —DANIEL FRYE'
  md: "\n## Experience, Imagination, and Support.\n### Pogo Linux is Hardware Solutions\
    \ Built for Linux, Built for You.\nTo get started, contact us at 888.828.POGO\
    \ or inquiries06@pogolinux.com  \nPogo Linux, Inc. 701 Fifth Ave. Suite 6850,\
    \ Seattle, WA 98104\n\nIntel, Intel logo, Intel Inside logo, Pentium, Xeon, and\
    \ Xeon Inside are trademarks or registered trademarks of Intel corporation or\
    \ its subsidiaries in the United States and other countries. For additional terms\
    \ and conditions please visit www.pogolinux.com.\n\n---\n\n## UPFRONT\n### NEWS\
    \ + FUN\n### diff -u\n\n### WHAT'S NEW IN KERNEL DEVELOPMENT\nThe kernel may soon\
    \ support a larger compiled binary size, if a few remaining problems can be sorted\
    \ out. **Eric Biederman** has had some patches to accomplish this floating around\
    \ for a while, and **Vivek Goyal** at **IBM** has been testing them out. According\
    \ to Vivek, the time is now ripe to give Eric's patches (with modifications included)\
    \ to a wider audience and include them in **Andrew Morton's** -mm tree. A lot\
    \ of folks seem happy to see these patches, and much additional work is going\
    \ into them from various kernel people. Some of that work is in the form of cleanups,\
    \ but some folks also are working on the tricky interactions between this code\
    \ and the **swapoff software suspend code**. It does seem as though these patches,\
    \ sooner or later, will be complete and accepted into the official tree.\n\nThe\
    \ open-source **ar5k wireless driver** has been cleared of any copyright problems,\
    \ at least according to the **Software Freedom Law Center** (SFLC). The driver,\
    \ developed for OpenBSD, primarily by **Reyk Floeter**, had lived under a cloud\
    \ of suspicion by **Atheros**, the maker of the wireless chipsets it supported.\
    \ And, although nothing was ever proven against the ar5k developers, the \"scandal\"\
    \ was enough to prevent Linux folks from incorporating the driver into the Linux\
    \ kernel. With the SFLC opinion, the worst objections have been set aside, if\
    \ not entirely eliminated, and now the biggest complaint from kernel folks is\
    \ that the ar5k driver may just be badly written or take the wrong approach. Currently,\
    \ some folks support incorporating ar5k into the kernel in its current form or\
    \ with slight modifications, and some think the whole driver should be scrapped\
    \ and just used as a hardware reference for an entirely new driver. Whatever way\
    \ that debate falls, it's clear that Atheros wireless chips will soon have a free\
    \ alternative to Atheros' own freely available through proprietary MadWiFi driver.\n\
    \nA lot of patches have come along to remove broken or unmaintained parts of the\
    \ kernel or schedule their removal after a period of deprecation. **Andrew Morton**\
    \ has scheduled **FUTEX_FD** for removal in June 2007, saying the code has \"\
    unfixable races\"—exactly the charge levied against DevFS in the old days. **Rusty\
    \ Russell**, who originally wrote the patch, has no interest in fighting to keep\
    \ the code. However, he says that once it's removed, the futex code could be made\
    \ a lot simpler. With friends like these, FUTEX_FD needs no enemies, and it is\
    \ doubtful the code will last even as long as Andrew has given it.\n\nAt the same\
    \ time, **Adrian Bunk** has posted patches to remove a bunch of old drivers that\
    \ have been marked as broken for several years. These include the **VIDEO_ZR36120**\
    \ and **SKMC** drivers, and the **MAC89x0**, **ATARI_BIONET** and **ATARI_PAMSTER**\
    \ drivers. Of these latter, **Geert Uytterhoeven** may have a patch, by **Matthias\
    \ Urlichs**, to fix the MAC89x0 driver. But the patch still needs to be tested\
    \ and signed off on. Meanwhile, Adrian has posted more patches to remove the **FB_CYBER_FB**,\
    \ **FB_VIRGE**, **FB_RETINA23**, **FB_ATARI**, **FB_SUN3** and **FB_PM3** drivers,\
    \ but it looks as though **James Simmons** might take over maintaining them, and,\
    \ GEERT may already have a patch to fix the FB_ATARI driver. So, those framebuffer\
    \ drivers may not be taken out after all.\n\nAt the same time, the **sysctl code**,\
    \ which to all appearances was on the chopping block for real, seems to have found\
    \ a reprieve. Eric Biederman, who had scheduled the code for removal, found some\
    \ legitimate sysctl users. As a result, not only is the code no longer marked\
    \ as deprecated, but it will also be compiled into all kernels by default for\
    \ the near future. Eric will work with the various distributions to eliminate\
    \ the sysctl uses gradually and, in perhaps a year or two, will once again consider\
    \ removing the code.\n\nThe **Sparse C code parser** never had an official release\
    \ since its original maintainer, so it becomes one of a very small group of projects\
    \ to have an initial release only after changing hands. **Linus Torvalds** originally\
    \ created the tool in 2003 for his own use to help spot bugs in kernel patches.\
    \ And, he made the tool available for download without ever giving it a version\
    \ number or doing any kind of organized release. When users started asking for\
    \ features that Linus didn't himself desire, he suggested that someone else might\
    \ take over the project. **Josh Triplett** stepped up, officially releasing Sparse\
    \ version 0.1 with several feature enhancements. A version 0.2 followed closely\
    \ after that, this time mainly adding bug fixes. Is the project old, having begun\
    \ in 2003, or new, having just put out its first release? You decide.\n\n—ZACK\
    \ BROWN\n\n## Governments Vote for Linux Security\nLinux is the fastest growing\
    \ operating system in the world, in large part because customers in every industry\
    \ are demanding highly secure information technology environments, particularly\
    \ those customers in the public sector.\n\nWorldwide, more than 225 IBM government\
    \ customers are embracing Linux to lower the total cost of computing, consolidate\
    \ workloads, increase efficiency and enact e-government transformation. But, it's\
    \ the inherent higher level of security that is proving to be the biggest draw,\
    \ providing government agencies the confidence to expand Linux beyond edge-of-network\
    \ applications into the heart of the enterprise to run mission-critical applications.\n\
    \nToday, thousands of developers and members of the open community worldwide work\
    \ on Linux, constantly making it better and more secure. IBM, for instance, supports\
    \ the growth of Linux through the work of IBM's Linux Technology Center, made\
    \ up of more than 600 engineers in 40 locations worldwide, of whom more than 300\
    \ work full-time on Linux as part of the Open Source community.\n\n### Open Community\
    \ Committed to Security\nThe inherent Linux security advantage is the added layer\
    \ of community approval, which closed systems are unable to provide as they rely\
    \ completely on internal teams to avert security breaches. Only after close examination\
    \ and approval by a body of peers does a Linux solution reach a customer. This\
    \ same talent pool quickly addresses emerging security concerns, plugging holes\
    \ and releasing patches before a company’s infrastructure is ever compromised.\
    \ With other operating systems, bug fixes and security patches are more likely\
    \ to be lumped together and released based on specific timelines that accommodate\
    \ the vendor, not the users.\n\nBut as citizen applications become the norm, the\
    \ user role grows. Citizens are becoming more accustomed to self-service applications,\
    \ such as renewing a driving license on-line or paying a citation. As the number\
    \ of citizens accessing information on-line grows, so does the incidence of cyber\
    \ crimes. Crackers, fraudsters and identity thieves keep abreast of technology\
    \ advances, increasing their sophistication.\n\nThis now poses significant new\
    \ threats to governments where the chief concern includes safeguarding national\
    \ security and information privacy. As citizens share sensitive information, including\
    \ names, date of birth, addresses and social security numbers with e-government\
    \ systems, there needs to be a check in place to ensure this information is guarded\
    \ by the highest levels of security.\n\nAs a result, advances in Linux security\
    \ continue to improve, especially in the affordability of implementing higher-level\
    \ security architectures. Open-source software provides more transparency and\
    \ user control, allowing users to identify and fix security vulnerabilities as\
    \ and when they happen, as compared to waiting for vendors to fix the security\
    \ flaws.\n\n## Common Criteria—Early Standard for Security\nMany government agencies\
    \ worldwide require IT vendors to adhere to Common Criteria security certification\
    \ standards. The Common Criteria is recognized internationally by IT professionals\
    \ as the ISO standard (ISO/IEC 15408) used by the United States government and\
    \ other organizations to assess security and assurance of technology products.\
    \ The world’s largest Linux enterprise server distribution vendors, Novell and\
    \ Red Hat, for instance, have achieved three levels of security certification\
    \ that enable Linux to be adopted by governments and government agencies running\
    \ on multiple IBM software and hardware platforms.\n\n### UK Cabinet Office Pioneers\
    \ Security-Enhanced Linux\nAdvances in security continue to improve, especially\
    \ in the affordability of implementing higher-level security architectures. For\
    \ use within governments, one resource has been the use of Security-Enhanced (SE)\
    \ Linux. The Mandatory Access Control provides access to information on a need-to-know\
    \ basis, protecting governments better from potential cracker and virus threats.\n\
    \nIBM has been a key enabler, consistently supporting the growth of SELinux while\
    \ simultaneously ensuring that security within the platform is hardened, maintained\
    \ and enhanced without compromising access and ease of use. IBM recently worked\
    \ with the UK Cabinet Office and partners Treshes and Belim Group on the first\
    \ pilot for Mandatory Access Control through Security-Enhanced Linux in an e-government\
    \ application at a National Health Service hospital trust in England. Through\
    \ the use of this technology, any organization will have the ability to contain\
    \ crackers, provide the necessary containment for its applications and minimize\
    \ damage to the enterprise.\n\nFor years, customers have demanded secure, open,\
    \ interoperable platforms that are easier to manage and more flexible in running\
    \ different workloads in a heterogeneous architecture that often comprises disparate\
    \ products from multiple IT vendors. This trend is particularly pervasive in emerging\
    \ markets.\n\n## India: A Shining Star for Linux and Open Source\nIndia has been\
    \ a shining star for open-source Linux software, with growth rates for sales doubling\
    \ in the past year alone. The government and defense sectors have been one of\
    \ the key drivers for Linux adoption in India, which combined accounted for 38%\
    \ of the Linux market during 2005–2006 according to Datapiexus. In India, customers\
    \ are flocking to Linux because it provides a low-cost, highly secure and customizable\
    \ alternative to closed systems and vendor lock-in.\n\nJust this month (January\
    \ 2007), it was reported that Tamil Nadu, one of the largest and most industrialized\
    \ states in India with a population the size of the UK, is moving away from a\
    \ closed system in favor of open source. They also are training 30,000 government\
    \ officials on Linux, a key move because technical skills have been one of the\
    \ barriers to further adoption of open-source software. Recently, the state of\
    \ Kerala, which boasts a 100% literacy rate, announced it was migrating to Linux\
    \ as well.\n\n## Project Higgins and User-Centric Management\nWith the growth\
    \ of on-line government services, citizens are benefiting from new open-source\
    \ software security initiatives that are aimed at helping protect their personal\
    \ information. IBM, Harvard Law School’s Berkman Center for Internet and Society,\
    \ Novell and Party Communications are working on an open-source initiative, code-named\
    \ Higgins, that will spawn a new generation of security software, giving people\
    \ more control over personal on-line information.\n\nThe Higgins initiative is\
    \ developing software for user-centric identity management, an emerging trend\
    \ in security software. User-centric identity management enables individuals to\
    \ manage and control their on-line personal information actively, such as bank\
    \ account numbers, medical records, telephone numbers and credit card numbers—rather\
    \ as institutions managing that information as they do today. People will decide\
    \ what information they want to share with trusted on-line Web sites that use\
    \ the software.\n\nThe user will play a key role in the future in helping enterprises\
    \ and institutions comply with various e-governance regulations. As users have\
    \ more and more access to e-citizen services, user-centric management will help\
    \ in identifying the information individuals want to share, for instance to their\
    \ healthcare provider. A healthcare provider does not necessarily need to know\
    \ the user’s personal information and will have access to information relevant\
    \ to the patient’s medical history, thus limiting the exposure to data loss.\n\
    \nThe Higgins initiative moves on-line security to the next stage by creating\
    \ an open, highly secure and flexible software platform that essentially puts\
    \ the user in the center of the identity management cosmos.\n\nLinux is continuing\
    \ to become an unstoppable force in the public sector, helping provide government\
    \ agencies and the citizens they serve worldwide a computer operating system both\
    \ can trust.\n\n—DANIEL FRYE\n\n---\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_12_0.png)\n\
    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_12_1.png)\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_12_2.png)\n\
    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_12_3.png)\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_12_4.png)\n\
    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_14_0.png)\n"
  mdcn: "\n\n## 经验、想象力与支持。\n### Pogo Linux 是为 Linux 构建的硬件解决方案，也是为您构建的。\n如需开始使用，请拨打\
    \ 888.828.POGO 或发送电子邮件至 inquiries06@pogolinux.com 与我们联系。  \nPogo Linux, Inc. 701\
    \ Fifth Ave. Suite 6850, Seattle, WA 98104\n\nIntel、Intel 标志、Intel Inside 标志、Pentium、Xeon\
    \ 以及 Xeon Inside 是 Intel 公司或其子公司在美国和其他国家的商标或注册商标。有关更多条款和条件，请访问 www.pogolinux.com。\n\
    \n---\n\n## 前沿\n### 新闻 + 趣味\n### diff -u\n\n### 内核开发中的新动态\n如果几个遗留问题能够解决，内核很快将支持更大的编译二进制文件大小。**Eric\
    \ Biederman** 已经有一些用于实现这一目标的补丁流传了一段时间，**IBM** 的 **Vivek Goyal** 一直在测试这些补丁。根据 Vivek\
    \ 的说法，现在是时候将 Eric 的补丁（包含修改内容）展示给更广泛的受众，并将其纳入 **Andrew Morton** 的 -mm 树中。许多人似乎很高兴看到这些补丁，并且来自内核各方的人员正在投入大量额外工作。其中一些工作以清理的形式出现，但也有人正在处理这段代码与\
    \ **swapoff 软件挂起代码** 之间复杂的交互关系。看起来这些补丁迟早会完成并被接受进官方树中。\n\n开源的 **ar5k 无线驱动程序** 已经排除了所有版权问题，至少根据\
    \ **软件自由法律中心** (SFLC) 的说法是这样。该驱动程序主要为 OpenBSD 开发，主要由 **Reyk Floeter** 开发，长期以来一直笼罩在\
    \ **Atheros**（支持其无线芯片组的制造商）的怀疑之下。尽管从未有证据表明 ar5k 开发人员存在问题，但“丑闻”足以阻止 Linux 人士将该驱动程序纳入\
    \ Linux 内核。随着 SFLC 的意见出台，最强烈的反对意见已被搁置，甚至完全消除，如今内核人士最大的抱怨是 ar5k 驱动程序可能写得不好或方法不当。目前，一些人支持将\
    \ ar5k 以当前形式或稍作修改后纳入内核，而另一些人则认为应该彻底废弃该驱动程序，仅将其作为全新驱动程序的硬件参考。无论辩论结果如何，可以明确的是，Atheros\
    \ 无线芯片将很快拥有 Atheros 自家专有 MadWiFi 驱动之外的免费替代方案。\n\n许多补丁已经出现，旨在移除内核中损坏或无人维护的部分，或在弃用期后计划移除它们。**Andrew\
    \ Morton** 已计划在 2007 年 6 月移除 **FUTEX_FD**，并称该代码存在“无法修复的竞争条件”——这正是早年 DevFS 受到的指责。**Rusty\
    \ Russell** 最初编写了该补丁，他对保留该代码没有兴趣。然而，他表示一旦移除，futex 代码可以简化很多。有了这样的一些朋友，FUTEX_FD\
    \ 不需要敌人，而且很有可能连 Andrew 给它预留的时间都撑不到。\n\n与此同时，**Adrian Bunk** 已提交补丁，移除一系列多年来被标记为损坏的旧驱动程序。这些包括\
    \ **VIDEO_ZR36120** 和 **SKMC** 驱动程序，以及 **MAC89x0**、**ATARI_BIONET** 和 **ATARI_PAMSTER**\
    \ 驱动程序。对于后三者，**Geert Uytterhoeven** 可能有一个由 **Matthias Urlichs** 编写的补丁，用于修复 MAC89x0\
    \ 驱动程序。但该补丁仍需测试和签署。与此同时，Adrian 已提交更多补丁，移除 **FB_CYBER_FB**、**FB_VIRGE**、**FB_RETINA23**、**FB_ATARI**、**FB_SUN3**\
    \ 和 **FB_PM3** 驱动程序，但看起来 **James Simmons** 可能会接管维护它们，而且 GEERT 可能已经有一个修复 FB_ATARI\
    \ 驱动程序的补丁。因此，这些帧缓冲驱动程序可能最终不会被移除。\n\n同时，**sysctl 代码** 原本看似真的要被砍掉，但现在似乎得到了宽限。曾计划移除该代码的\
    \ Eric Biederman 发现了一些合法的 sysctl 用户。因此，该代码不仅不再被标记为弃用，而且在不久的将来还会默认编译到所有内核中。Eric\
    \ 将与各个发行版合作，逐步消除 sysctl 的使用，并在一年或两年后再次考虑移除该代码。\n\n**Sparse C 代码解析器** 自其原始维护者之后从未有过正式发布，因此它成为了极少数仅在换帅后才推出首个版本的项目之一。**Linus\
    \ Torvalds** 最初在 2003 年创建了该工具，用于个人使用，以帮助发现内核补丁中的错误。他使该工具可供下载，但从未赋予其版本号或进行任何有组织的发布。当用户开始要求\
    \ Linus 本人并不想要的功能时，他建议其他人可以接管该项目。**Josh Triplett** 站了出来，正式发布包含多项功能增强的 Sparse 0.1\
    \ 版本。随后不久发布了 0.2 版本，这次主要增加了错误修复。该项目是旧的，因为它始于 2003 年，还是新的，因为它刚刚发布了第一个版本？由你决定。\n\
    \n—ZACK BROWN\n\n## 政府投票支持 Linux 安全\nLinux 是世界上增长最快的操作系统，这在很大程度上是因为各行各业的客户都在要求高度安全的信息技术环境，尤其是公共部门的客户。\n\
    \n在全球范围内，超过 225 家 IBM 政府客户正在拥抱 Linux，以降低计算总成本、整合工作负载、提高效率并实施电子政务转型。但正是其固有的更高安全级别被证明是最大吸引力，使政府机构有信心将\
    \ Linux 扩展到网络边缘应用之外，深入企业核心以运行关键任务应用。\n\n如今，全球成千上万的开发人员和开源社区成员致力于 Linux 开发，不断使其变得更好、更安全。例如，IBM\
    \ 通过其 Linux 技术中心的工作支持 Linux 的增长，该中心由全球 40 个地点的 600 多名工程师组成，其中超过 300 名全职人员作为开源社区的一部分致力于\
    \ Linux 工作。\n\n### 致力于安全的开源社区\nLinux 固有的安全优势在于增加的同行评审层，这是封闭系统无法提供的，因为它们完全依赖内部团队来避免安全漏洞。只有在经过同行的仔细检查和批准后，Linux\
    \ 解决方案才能到达客户手中。同样的人才库迅速解决新兴的安全问题，在公司的基础设施受到任何损害之前就堵住漏洞并发布补丁。对于其他操作系统，错误修复和安全补丁更可能捆绑在一起，并基于适应供应商而非用户的具体时间表发布。\n\
    \n但随着公民应用成为常态，用户角色日益增长。公民越来越习惯于使用自助服务应用程序，如在线更新驾驶执照或缴纳罚单。随着在线访问信息的公民数量增加，网络犯罪的发病率也随之上升。黑客、诈骗犯和身份盗窃者紧跟技术进步的步骤，提高其专业化程度。\n\
    \n这对政府构成了重大的新威胁，主要关切包括保护国家安全和信息隐私。当公民与电子政务系统分享敏感信息，包括姓名、出生日期、地址和社会安全号码时，需要建立机制确保这些信息受到最高级别的安全保护。\n\
    \n因此，Linux 安全方面的进步持续改善，特别是在实施更高级别安全架构的可负担性方面。开源软件提供了更多的透明度和用户控制，允许用户随时识别和修复安全漏洞，而无需等待供应商修复安全缺陷。\n\
    \n## 通用准则——早期安全标准\n全球许多政府机构要求 IT 供应商遵守通用准则安全认证标准。通用准则被国际 IT 专业人士认可为 ISO 标准 (ISO/IEC\
    \ 15408)，用于评估美国政府和组织的技术产品的安全性和保障性。例如，世界上最大的 Linux 企业服务器发行版供应商 Novell 和 Red Hat\
    \ 已获得三个级别的安全认证，使 Linux 能够被运行在多个 IBM 软件和硬件平台上的政府和政府机构采用。\n\n### 英国内阁办公室率先采用安全增强型\
    \ Linux\n安全方面的进步持续改善，特别是在实施更高级别安全架构的可负担性方面。在政府内部使用，一种资源是采用安全增强型 (SE) Linux。强制访问控制基于“需知”原则提供信息访问，更好地保护政府免受潜在黑客和病毒威胁。\n\
    \nIBM 一直是关键推动者，始终支持 SELinux 的增长，同时确保平台内的安全得到加强、维护和增强，而不损害访问和易用性。IBM 最近与英国内阁办公室及合作伙伴\
    \ Treshes 和 Belim Group 合作，在英格兰一家国家医疗服务体系医院信托中，通过安全增强型 Linux 在电子政务应用中实施了首次强制访问控制试点。通过使用该技术，任何组织都将能够遏制黑客，为其应用程序提供必要的遏制措施，并将对企业造成的损害降至最低。\n\
    \n多年来，客户要求安全、开放、互操作的平台，这些平台更容易管理，并在异构架构中运行不同工作负载时更加灵活，这些架构通常由来自多个 IT 供应商的独立产品组成。这种趋势在新兴市场中尤为普遍。\n\
    \n## 印度：Linux 和开源的明星\n印度一直是开源 Linux 软件的明星，仅在过去一年里，销售额增长率就翻了一番。根据 Datapiexus 的数据，政府和国防部门是印度\
    \ Linux 采用的关键驱动力之一，2005–2006 年间合计占 Linux 市场的 38%。在印度，客户涌向 Linux，因为它提供了低成本、高安全性和可定制的替代方案，以取代封闭系统和供应商锁定。\n\
    \n就在本月（2007 年 1 月），据报道，泰米尔纳德邦——印度最大、工业化程度最高的州之一，人口规模相当于英国——正从封闭系统转向开源。他们还在培训 30,000\
    \ 名政府官员使用 Linux，这是一项关键举措，因为技术技能一直是阻碍开源软件进一步采用的障碍之一。最近，识字率达到 100% 的喀拉拉邦也宣布正在迁移到\
    \ Linux。\n\n## Project Higgins 和用户中心管理\n随着在线政府服务的增长，公民正受益于新的开源软件安全倡议，这些旨在帮助保护其个人信息。IBM、哈佛大学伯克曼互联网与社会中心、Novell\
    \ 和 Party Communications 正在合作一个开源倡议，代号 Higgins，它将催生新一代安全软件，使人们对个人在线信息拥有更多控制权。\n\
    \nHiggins 倡议正在开发用于用户中心身份管理的软件，这是安全软件中的一个新兴趋势。用户中心身份管理使个人能够积极管理和控制其在线个人信息，如银行账户号码、医疗记录、电话号码和信用卡号码——而不是像今天机构管理这些信息那样。人们将决定他们希望与使用该软件的可信在线网站共享哪些信息。\n\
    \n用户将在未来帮助企业和机构遵守各种电子政务法规方面发挥关键作用。随着用户越来越多地访问电子公民服务，用户中心管理将帮助识别个人希望共享的信息，例如与其医疗保健提供商共享。医疗保健提供商不一定需要了解用户的个人信息，将只能访问与患者病史相关的信息，从而限制数据泄露的风险。\n\
    \nHiggins 倡议通过创建一个开放、高度安全和灵活的软件平台，将在线安全提升到下一阶段，该平台本质上将用户置于身份管理宇宙的中心。\n\nLinux\
    \ 正在公共部门成为一股不可阻挡的力量，帮助为政府机构及其服务全球公民提供双方都可以信任的计算机操作系统。\n\n—DANIEL FRYE\n\n---\n\
    \n![](img/3c4d8a97b5d96c835281dc0dacbc8551_12_0.png)\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_12_1.png)\n\
