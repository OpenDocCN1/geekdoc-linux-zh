    # # 3Com’s Open Services Networking Platform


    Doc Searls’ and the Linux Community’s call for open architectures all over is
    gaining nice momentum. A case in point is 3Com’s Open Services Networking (OSN)
    Platform, the firm’s strategy to base its network solutions on an open, interoperable,
    multivendor architecture. The idea is to “let organizations, rather than their
    networking vendors, select the applications that best match business requirements
    and implement them with timeliness and efficiency”, say the 3Com-ers. Lucky for
    us, a key component of OSN is the Open Source Service Monitoring bundle, which
    leverages a number of pretested and supported open-source-based network and service
    management applications, such as MRTG, NTOP, TShark and Nagios. The open-source
    bundle is currently available for download from 3Com’s Web site. www.3.com.com/osn


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_45_1.png)


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_45_2.png)


    # # John Brosnan and Kyle Copeland’s Beginning TiVo Programming (Wrox Press)


    To the delight of hackers far and near, TiVo made it possible to create applications
    for its popular digital video recorder (DVR) product. *Beginning TiVo Programming*
    by John Brosnan and Kyle Copeland is targeted at programmers who want to gain
    a “complete understanding of all the pieces that make up a TiVo application”.
    The book uses real-life code examples to guide the reader through the steps needed
    to implement an application. The team of Brosnan and Copeland designed its own
    application for HME, which is the code name for TiVo’s powerful new open platform
    for applications. The latest SDK for HME can be found at **tivohme.sourceforge.net**.
    www.wrox.com


    # # Digiium’s Asterisk-Based Solutions


    By the time you read this, Digiium will have three new Asterisk-based solutions
    for your telephony-based enjoyment. The first of these is Digiium’s TDM800P, an
    eight-port analog telephone interface card with Digiium’s VoiceBus technology,
    which is built on a single PCI bracket for universal PCI compatibility. Together
    with Digiium’s Asterisk software and a standard PC or server, users can create
    an inexpensive and scalable telephony solution comparable to a high-end PBX platform.
    The second item is the TE120P, a single span, selectable T1 (24-channel), E1 (32-channel),
    or J1 (24-channel) card that routes voice and data simultaneously, eliminating
    the need for an external router. The TE120P also delivers PBX and IVR services
    including voice mail, call conferencing, three-way calling and VoIP gateways.
    Last but not least is the software-based, G.168-compliant High Performance Echo
    Canceller (HPEC) for 32-bit and 64-bit Linux platforms. The HPEC provides echo
    cancellation for configurable tail lengths of 16ms (128 taps), 32ms (256 taps),
    64ms (512 taps) and 128ms (1,024 taps), on a per-channel basis. www.digiium.com'
