    MICK BAUER


    # Linux Firewalls for Everyone


    Need a personal firewall, an enterprise Internet gateway or something in between?
    iptables does it all!


    The Linux kernel includes some of the most powerful and flexible firewall code
    in any general-purpose operating system. This code is called Netfilter, though
    most of us refer to it by the name of its user-space command, iptables. Netfilter/iptables
    allows your Linux kernel to inspect all network traffic that passes through your
    system, deciding what to do with that traffic based on a very rich set of criteria.


    Building Linux firewalls with iptables is a big topic—entire books have been written
    about it (see Resources). In fact, firewall engineering is a profession unto itself
    (my profession, in fact). So, alas, nobody can tell you everything you need to
    know about building firewalls with iptables in one magazine article.


    I can, however, provide an overview of the things iptables can do, some sound
    principles for Linux firewall design, descriptions of some handy tools for building
    different types of Linux firewalls and pointers to more detailed information on
    Linux firewalls.


    # Types of Linux Firewalls


    Firewalling, or more precisely, packet filtering, can be used for many things.
    It can be used locally on individual servers and desktop systems for host-level
    protection from network-based attacks. It can be used at the network infrastructure
    level to protect entire networks from other networks, and it can be used to redirect,
    or even alter, network packets in various ways.


    A Linux firewall can be a dedicated hardware appliance based on Linux, a PC with
    multiple network interfaces, or it even can be an ordinary, single-interfaced
    workstation or server. Many commercial firewall appliances are Linux/iptables-based.
    Contrary to what you might think, PC-based Linux firewalls can perform and scale
    quite well, if deployed on sufficiently powerful hardware.


    Those are the form factors Linux firewalls take, and they serve in two different
    roles. Firewall appliances and multi-interface PC-based firewalls are used as
    what I call network firewalls. They serve as dedicated network devices, logically
    equivalent to IP routers that regulate traffic between different networks. (Technically,
    firewalls are routers; they’re just fussier about what they route than ordinary
    routers.) Network firewalls also often perform Network Address Translation (NAT),
    typically to allow hosts with non-Internet-routable IP addresses to communicate
    with the Internet.


    Then, there are what I call local firewalls—workstations or servers whose primary
    function isn’t firewalling at all, but the hosts to protect themselves. In my
    opinion, any computer connected to the Internet, whether server or workstation,
    should run a local firewall policy. In the case of Linux systems, we have no excuse
    for not taking advantage of Linux’s built-in Netfilter/iptables functionality.
    Furthermore, this is the easiest type of firewall script to create, as I show
    later in this article.


    # Firewall Design Principles


    Before we discuss Linux firewall tools, we should cover some general firewall
    design principles. Most of these principles are (or should be) equally valid whether
    you’re using firewalls to protect a single host or entire networks.


    +   First, here are some terms:

    +   - Packet filtering: the practice of inspecting individual network packets,
    comparing against a set of rules and processing them accordingly.

    +   - Firewall policy: either a specific set of iptables commands or a higher-level
    set of design goals that your iptables commands enforce.

    +   - Firewall rules or packet-filtering rules: the individual components of a
    firewall policy—that is, individual iptables command iterations.


    The first step in building any set of packet-filtering rules is to decide precisely
    what you want your firewall to do—that is, to formulate your high-level firewall
    policy. For example, if I’m creating a local firewall script for a workstation,
    my logical policy might look like this:


    +   1. Allow outbound DNS queries, Web surfing via HTTP and HTTPS, e-mail retrieval
    via IMAP, outbound SSH and outbound FTP transactions from the local system to
    the entire outside world.

    +   2. Allow inbound SSH connections to this system from the other workstation
    in my basement.

    +   3. Block everything else.


    Skipping this crucial step of defining your high-level policy is akin to writing
    a software application without first defining'
