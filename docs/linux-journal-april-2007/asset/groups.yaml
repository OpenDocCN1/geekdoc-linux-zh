    # Security for Your Data— It’s Totally Mondo!


    Security means different things to different people. On your Linux system, security
    isn''t only about keeping people out, it''s also about knowing you can restore
    the e-mail folder you deleted accidentally.


    **Why can''t I** log in to our main server, François? You were trying to improve
    the security? Without discussing it with me? Yes, of course, I appreciate the
    spirit of your intentions, but now there''s no way to access the system remotely
    at all. In fact, I can''t even log in on the main console. You changed the passwords?
    and encrypted the filesystems? Mon Dieu, François, that is certainly a little
    over the top. Well, just tell me the new password, and I''ll put things back to
    the way they were. What do you mean, you can''t? You''ve forgotten the passphrase
    you used when you encrypted the filesystems?


    Luckily for you, *mon ami*, our guests are already here, and we have backups.
    Head to the wine cellar and bring back the 2001 Ma La Plana Cabernet from Spain.
    And, while you are down there, don''t lock any doors or change any combinations.


    Welcome, *mes amis*, to Chez Marcel, where exceptional vintages are paired with
    exceptional Linux and open-source software. Please, take your seats and make yourselves
    comfortable. My faithful waiter is in the cellar fetching the wine. Before you
    arrived, François demonstrated admirably why it is important to have a reliable
    backup system. Backups can be simple collections of files burned to a CD, a tarred
    bundle stored on a remote system or a copy of your data on a separate drive. There
    are, in fact, thousands of ways to create a backup, and for many of us, it usually
    involves backing up only those files that are near and dear to our hearts. In
    a multitier environment or on a large, busy system, picking up files here and
    there may not be enough. You need everything.


    Ah, François, you have returned. *Please, pour for our guests.* Enjoy, *mes amis*,
    this is a wonderful wine with some *fine* grapes, dark fruit complexity and just
    a hint of chocolate.


    As excellent as the wine might be (and it is), the real star of tonight''s menu
    is a powerful backup and system recovery program called Mondo Rescue. The spirit
    of Mondo Rescue resides in a scenario no one wants to envisi- on, a catastrophic
    system failure. I''m not talking about losing your e-mail folder (although I would
    consider this a catastrophe as well). Mondo Rescue is concerned with “the hard
    disk is gone, the machine has exploded, and we need to start from scratch” kind
    of catastrophe. Or, as in François'' case, security enhancements gone terribly
    wrong. Mondo Rescue works with a variety of backup media, and it can create bootable
    backups that let you restore a mirror image of your system prior to the disaster.


    To get started, visit the Mondo Rescue Web site to pick up your copy of the software
    (see *Resources*). You''ll need a few things to get started, because there isn''t
    a sin- gle, all-inclusive Mondo Rescue package. Don''t worry; it''s a short list,
    and Mondo Rescue provides packages for an impressive number of distributions and
    release levels. The packages you need are also, buffer, mini, mindi, mini-busybox,
    syslinux and the main package, the aptly named mondo. As I felt it necessary to
    use the word “aptly”, this is where Debian and Ubuntu users can claim bragging
    rights, because they can install everything they need by typing `apt-get install
    mondo`.


    Mondo Rescue has, of course, two sides: preparation for disaster and recovery
    from that disaster. The backup program is called *mondoarchive*, and the restore
    program is called *mondorestore*. Let''s start with the backup program. The *mondoarchive*
    program runs in interactive mode by default, with a stylish (by curses standards)
    and easy- to-use interface. You navigate the interface by using your keyboard
    and pressing the Tab key to go from one menu option to another. Start *mondoarchive*
    from a shell


