    UI, Austin 攻读计算机科学硕士学位。过去，他维护了 openCrypto PKCS#11 应用程序，为 Linux 的通用标准 CAPPEL 安全认证工作做出了贡献，并编写了随早期
    Linux 内核版本发布的 BSI 安全级别 Linux 安全模块 (LSM)。


