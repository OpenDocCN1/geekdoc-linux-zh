  - '[PAGE 15]


    # [ UPFRONT ]


    # Just Say No to OpenXML


    A couple of months ago, Microsoft and another software company, Novell, signed
    a technical cooperation agreement. A part of this agreement may turn out as highly
    dangerous for almost all citizens, but it is not the one that the majority of
    critics addressed.


    # Summary of the Previous Season


    With this agreement, Microsoft commits not to sue, for patent infringement and
    other “intellectual property” violations, the users of the specific version of
    Linux packaged and distributed by Novell. One second after the announcement, Linux
    and Free Software supporters worldwide started to explain to each other how absurd
    and laughable it would be to believe, even for a single moment, that such violations
    actually exist or that any court could ever sentence Linux end users for them.
    This week, a handful of public statements (not even from Microsoft) quickly showed
    how little such arguments matter in the real, nongeel world. Wal-Mart''s Chief
    Technology Officer announced that the company finally will be able to use Linux
    to expand its global Web presence, because “questions over intellectual property
    are a ''huge problem'',” but “the intellectual property protections in the Novell
    deal give Wal-Mart more confidence in using Linux more broadly.” After such a
    confirmation from Wal-Mart, which business owner (or Wal-Mart supplier) is going
    to listen to geeks swearing that Linux has no hidden legal bombs?


    Regardless of Wal-Mart, the worst, most dangerous part of this deal may not be
    the patent suits part, but something else with an even bigger impact on the culture,
    economy and ownership of public documents.


    # Interoperability, Please!


    Interoperability is enormously important in the computer world. If the documents
    produced with a computer program are not completely and surely readable with any
    other program of the same category, those documents cannot be exchanged, become
    unusable after only a few years or remain available only by paying much more than
    would be fair to the producer of the original software.


    In order to avoid this, it is necessary to store and exchange documents in a nonproprietary
    file format. As explained in “Everybody’s Guide to OpenDocument”, “if computer
    programs are pens, then think of file formats as alphabets. There is nothing wrong
    in selling overpriced pens, as long as cheap models also exist. But the whole
    thing is contingent on everybody using the same alphabet, without needing to pay
    fees or learn special secrets.”


    Today, two file formats are competing for all our office files. One is the nonproprietary,
    completely open by design, internationally ratified standard called OpenDocument.
    The other is OpenXML, the format used in the next version of Microsoft Office,
    which aims to reach the same status but already has been defined by several experts
    as something explicitly created to be usable only in Microsoft Office.


    # Here Comes the Real Trap


    In spite of all this, the file format part of the agreement explicitly says that
    it is “designed to ensure that customers using OpenOffice.org will continue to
    be able to read and write documents using future Microsoft Office file formats...[Novell
    will ensure that] file formats used by future versions of Microsoft Office are
    well specified and available to all to implement.” Can you see the problem now?
    First, the agreement lasts five years—it cannot ensure anything after 2011. Next,
    it is officially not meant to make OpenDocument usable in Microsoft Office. Instead,
    it is going to make sure that OpenOffice.org users can continue to be slaves to
    a proprietary format that is very hard to support completely in other software
    programs.


    99% of existing office files are Microsoft-locked, and almost all current desktops
    are Microsoft Office. The agreement will actively work to preserve this situation,
    practically making OpenDocument (and the very concept of nonproprietary formats)
    irrelevant and unused in any large organization, no matter what its technical
    and openness merits and certifications are.


    Think of all the large companies and public administrations where most of the
    existing partners, customers or suppliers use Microsoft


    # Resources


    +   - Statement from Wal-Mart CTO: news.com.com/Wal-Mart+eyes+Microsoft+for+W+eb+build-out/2100-1017_3-6152247.html


    +   - Why Redmond feels so threatened by ODF: computerworld.co.nz/news/nst/tech/CBE41F838EABA40C25717AA01A0EC9


    +   - “Everybody''s Guide to OpenDocument”: www.linuxjournal.com/article/8616


    +   - Introduction to OpenDocument: opendocumentfellowship.org/introduction


    +   - How to hire Guillaume Portes: www.rbweier.com/blog/2006/01/ how-to-hire-guillaume-portes.html


    +   - Novell statement on file formats for office applications: www.novell.com/products/desktop/
    fileformats.html


    +   - Is Office OpenXML A One-Way Standard? Ask Microsoft: blogs.adobe.com/shebanation/
    2006/12/open_xml_one-way.html


    +   - Is OpenXML a one-way specification for most people? www.sutor.com/newsite/blog/open/?p=1145


    +   - A game of Zendo: www.rbweier.com/blog/2006/07/game-of-zendo.html


    +   - Microsoft Office to get a dose of OpenDocument: news.com.com/Microsoft-Office+to+get+a+dose+of+OpenDocument/2100-1013_3-6069188.html?tag=neft.top


    +   - OpenDocument Viewer: opendocumentfellowship.org/odfviewer'
