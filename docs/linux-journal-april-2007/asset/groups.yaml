    ```

    ```


    Nessus, on the other hand, is an active vulnerability scanner—meaning that it
    generates connections to the hosts you want to test for vulnerabilities. You have
    to register with Tenable Network Security, the owner of Nessus, in order to receive
    the available plugins. Install Nessus by downloading version 2.2.9 for Linux and
    executing:


    ```

