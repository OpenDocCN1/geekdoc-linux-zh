  md: "\n## The Asterisk Manager reports events processed by Asterisk and accepts\
    \ commands over the interface.\n\nreferring to `_ [ARG6] -> ( Peer )`, which returns\
    \ `SIP/300`:\n\n> ```\n> Event: PeerStatus\n> PeerStatus: Registered\n> Peer:\
    \ SIP/300\n> ```\n\nOn SIP registration, the program needs to identify the extension,\
    \ request information about it and then set up further processing of the extension\
    \ data after a delay. When an event is called through the `delay_set` method,\
    \ it is possible to pass an extension to the state handler, such as the extension\
    \ number used here:\n\n```perl\nsub register_state_handler {\n    my $kernel =\
    \ _ [KERNEL];\n    # Split peer extension off from technology\n    my $peer =\
    \ $ [ ARG6] -> ( Peer );\n    debug_print(\" Extension is @$peer \");\n    my\
    \ $extn_parts = split('/', @$peer);\n    my $ext = $extn_parts[1];\n    debug_print(\"\
    Extension number is @$ext\\n\");\n    getTZChannelVars(_ [ HEAP ], @$ext );\n\
    \    debug_print(\" Queueing call event for * \");\n    debug_print(\"SREG_CALL_DELAY\
    \ seconds\\n \");\n    $kernel ->delay_set(\"CALL\", $REG_CALL_DELAY, @$ext );\n\
    } # register_state_handler\n```\n\nAs part of the extension registration process,\
    \ we collect variables about the state of the channel in the `getTZChannelVars`\
    \ procedure. The POE heap, which is passed as the first argument, can be used\
    \ to issue commands to the manager. For example, the `put` argument to the server\
    \ can be used to issue commands. To get the SIP peer data, which includes the\
    \ current IP address of the peer, the command looks like this:\n\n```perl\n$heap\
    \ -> (server) -> put ( { Action => 'SIPShowPeers',\n                         \
    \   Peer => @$ext } );\n```\n\nTo get a database variable, the action in the `put`\
    \ command is a `DBGet`. The time-zone data is stored as keys in the `tz` family,\
    \ so it is necessary to specify both the family and assemble the correct key name,\
    \ which is of the form `300-TIMEZONE` or similar:\n\n```perl\n$heap -> (server)\
    \ -> put ( { Action => 'DBGet',\n                            Family => 'tz',\n\
    \                            Key => \"$ext . -TIMEZONE\" } );\n```\n\nFour database\
    \ requests and the SIP peer data are requested by `getTZChannelVars`. Because\
    \ this function is called by an event handler, it also is not interruptible. Therefore,\
    \ it sends four database query events to the manager, but it does not process\
    \ responses directly. (Complete code for the five requests within the full procedure\
    \ is available on the *Linux Journal* FTP site.)\n\n## Command and Database Responses\n\
    \nIn the gap between issuing requests and the time the call state is scheduled,\
    \ responses flow in from the SIP data request and the database queries. From the\
    \ SIP data request, we need to pick out the peer IP address, which appears on\
    \ a line in the manager response reading `Address-IP: 192.168.1.5`. Conveniently,\
    \ the POE module parses out the lines in the response, so all we need to do is\
    \ look for the `Address-IP` line by getting the value of the `Address-IP` hash\
    \ element in one of the arguments passed to the handler. The POE heap is accessible\
    \ across events, so adding the value of the SIP peer IP address to the heap makes\
    \ it accessible to other event handlers:\n\n```perl\nsub response_state_handler\
    \ {\n    my $peer_ip = $ [ ARG0] -> ( Address-IP ) ;\n    if (defined($peer_ip)\
    \ ) {\n        debug_print(\"SIP context found: Peer IP address \");\n       \
    \ debug_print ( \" is @$peer_ip\\n \");\n        _ [ HEAP ] -> ( 'SIP-Peer-IP\
    \ ')=$peer_ip;\n    } # response_state_handler\n}\n```\n\nAfter the SIP data response\
    \ comes back, the four database queries should return responses. Responses to\
    \ the queries look like this:\n\n> ```\n> DBGetResponse: Success\n> Family: tz\n\
    > Key: 300-TIMEZONE\n> Val: -8\n> ```\n\nThe callback handler is triggered whenever\
    \ there is a `DBGetResponse: Success` event from the manager, with an argument\
    \ of a hash that has each of the lines in the packet. Our interest is in the key\
    \ and value lines, which can be retrieved from the arguments passed to the state\
    \ handler. As with the previous handler, responses are stored in the POE task\
    \ heap to make it available to other handlers:\n\n```perl\nsub db_response_state_handler\
    \ {\n    my $family = _ [ ARG0 ] -> ( Family ) ;\n    my $key = _ [ ARG0 ] ->\
    \ ( Key ) ;\n    my $value = _ [ ARG0 ] -> ( Val ) ;\n    if (defined($family))\
    \ {\n        debug_print ( \"Key stored in DB family $family \");\n        debug_print\
    \ ( \" is $value\\n \");\n        # Store in heap\n        _ [ HEAP ] -> ( $key\
    \ ) = $value;\n    } # db_response_state_handler\n}\n```\n\n## Making the Call\n\
    \nEvery registration event triggers a \"call\" event to happen after a delay.\
    \ The delay is used to collect information used to determine whether to initiate\
    \ a call. The setup telephone call should be triggered only if the time-zone setup\
    \ has expired or the SIP device has changed its IP address and the record is no\
    \ longer valid.\n\nBecause the `call_state` handler is placed in the queue for\
    \ execution by the registration handler, it does have one argument, the extension\
    \ number of the call in question. The extension can be retrieved as `$_[ARG0]`.\
    \ All the data we have added to the heap by processing the database responses\
    \ and SIP data request is also readily available:\n\n```perl\nsub call_state_handler\
    \ {\n\n\t# Get extension out of arguments to function\n\tmy $exten = $_[ARG0];\n\
    \n\tmy $hp = $_[HEAP];\n\n\t# Variables we use to determine if the call is required\n\
    \tmy $skev = $hp->{$exten.'-TIMESKEW'};\n\tmy $skev_addr = $hp->{$exten.'-TIMESKEW_ADDR'};\n\
    \tmy $skev_start = $hp->{$exten.'-TIMESKEW_START'};\n\tmy $skev_end = $hp->{$exten.'-TIMESKEW_END'};\n\
    \tmy $sip_peer_ip = $hp->{'SIP-Peer-IP'};\n\tmy $now = time();\n\tmy $now = time();\n\
    }\n```\n\nTo determine whether the call is required, the handler compares the\
    \ current time with the expiration of the time-zone offset record and the IP address\
    \ of the SIP device against the IP address stored in the time-zone offset record.\
    \ If the IP addresses match and the offset has not expired, no call is required.\
    \ Otherwise, a call is needed and made with the `makeTZSetupCall` function:\n\n\
    ```perl\nif ($now > $skev_end) {\n\tdebug_print(\"Make call -- offset has expired.\\\
    n\");\n\tmakeTZSetupCall($_[HEAP], $exten);\n} elsif ((!$skev_addr eq $sip_peer_ip))\
    \ {\n\tdebug_print(\"Make call -- SIP IP addr changed\\n\");\n\tmakeTZSetupCall($_[HEAP],\
    \ $exten);\n} else {\n\tdebug_print(\"No call -- record OK & same IP\\n\");\n\
    }\n```\n\nAs a final step, the handler needs to remove the variables placed on\
    \ the heap. The heap is used only to pass variables between state handlers, and\
    \ the variables are not needed once that function is complete. Each of the variables\
    \ can be undefined with the `undef` function:\n\n```perl\n# Need to clean up heap\n\
    undef $_[HEAP]->{$exten.'-TIMESKEW'};\nundef $_[HEAP]->{$exten.'-TIMESKEW_ADDR'};\n\
    undef $_[HEAP]->{$exten.'-TIMESKEW_START'};\nundef $_[HEAP]->{$exten.'-TIMESKEW_END'};\n\
    undef $_[HEAP]->{'SIP-Peer-IP'};\n\n} # call_state_handler\n```\n\nMaking the\
    \ setup call uses the Asterisk Manager's `Originate` command, but it is protected\
    \ by one final check. I've defined a set of extensions as the remote channel list.\
    \ Only extensions on the remote channel list will have time-zone setup calls made\
    \ to them. Initially, the list consists of my softphone and an analog telephone\
    \ adapter, but I may need to add more in the future. Before originating the call,\
    \ I ensure that the number is on a remote channel list, which is defined in the\
    \ global array `REMOTE_CHANNEL_LIST`. The `Originate` command can take several\
    \ arguments as well. The extension, priority and context must refer to where the\
    \ setup menu is defined. In my case, these values are extension `*89` (for `^4-TZ`),\
    \ priority `1` and the context `from-internal`. I also can supply the caller-ID\
    \ text of “Time Zone Setup” to the phone I am calling:\n\n```perl\nsub makeTZSetupCall\
    \ {\n\n\tmy $heap = $_[0];\n\tmy $exten = $_[1];\n\tmy $callOK = 0;\n\n\t# Check\
    \ that extension to call is a remote channel\n\tforeach $number (REMOTE_CHANNEL_LIST)\
    \ {\n\t\tif ($number == $exten) {\n\t\t\t$callOK = 1;\n\t\t}\n\t}\n\n\tif ($callOK)\
    \ {\n\t\t$heap->{server}->put(\n\t\t\t'Action' => 'Originate',\n\t\t\t'Channel'\
    \ => 'SIP/' . $exten,\n\t\t\t'Context' => $TZ_CONTEXT,\n\t\t\t'Extlen' => $TZ_EXTEN,\n\
    \t\t\t'Priority' => $TZ_PRIORITY,\n\t\t\t'CallenId' => $CALLERID,\n\t\t\t);\n\t\
    \t# makeTZSetupCall\n\t}\n}\n```\n\nIf the `Originate` command is triggered, the\
    \ newly registered telephone rings, and I go through the voice menu described\
    \ in last month's article.\n\n> Matthew East is the author of the leading technical\
    \ book on wireless LANs, *802.11 Wireless Networks: The Definitive Guide* (O'Reilly\
    \ Media). He can be reached at matthew.east@gmail.com, but only when he is close\
    \ to sea level.\n\n## Resources\n\n- Full Source Listing of Perl Script: ftp.linuxjournal.com/pub/lj/sti\
    \ stings/issue156/9284.tgz\n- Information on the Asterisk Manager API: www.voip-info.org/w\
    \ ki-Asterisk-manager+API\n- Perl POE Framework: poe-perl.org\n- Perl Asterisk\
    \ Manager Component: search.cpan.org/~xantus/ POE-Component-Client-Asterisk-Manager-0.06/Manager.pm\n"
  mdcn: "\n\n## Asterisk Manager 会报告由 Asterisk 处理的事件，并通过该接口接受命令。\n\n引用 `_ [ARG6] ->\
    \ ( Peer )`，该引用返回 `SIP/300`：\n\n> ```\n> Event: PeerStatus\n> PeerStatus: Registered\n\
    > Peer: SIP/300\n> ```\n\n当 SIP 注册发生时，程序需要识别分机号，请求相关信息，然后在延迟后设置对该分机数据的进一步处理。当通过\
    \ `delay_set` 方法调用事件时，可以传递分机号给状态处理器，例如这里使用的分机号：\n\n```perl\nsub register_state_handler\
    \ {\n    my $kernel = _ [KERNEL];\n    # Split peer extension off from technology\n\
    \    my $peer = $ [ ARG6] -> ( Peer );\n    debug_print(\" Extension is @$peer\
    \ \");\n    my $extn_parts = split('/', @$peer);\n    my $ext = $extn_parts[1];\n\
    \    debug_print(\"Extension number is @$ext\\n\");\n    getTZChannelVars(_ [\
    \ HEAP ], @$ext );\n    debug_print(\" Queueing call event for * \");\n    debug_print(\"\
    SREG_CALL_DELAY seconds\\n \");\n    $kernel ->delay_set(\"CALL\", $REG_CALL_DELAY,\
    \ @$ext );\n} # register_state_handler\n```\n\n作为分机注册过程的一部分，我们在 `getTZChannelVars`\
    \ 例程中收集有关通道状态的变量。作为第一个参数传递的 POE 堆（heap）可用于向管理器发出命令。例如，可以针对服务器的 `put` 参数用于发出命令。要获取包含该对端当前\
    \ IP 地址的 SIP 对端数据，命令如下所示：\n\n```perl\n$heap -> (server) -> put ( { Action => 'SIPShowPeers',\n\
    \                            Peer => @$ext } );\n```\n\n要获取数据库变量，`put` 命令中的操作是\
    \ `DBGet`。时区数据以键的形式存储在 `tz` 族中，因此有必要指定族并组装正确的键名，其形式为 `300-TIMEZONE` 或类似形式：\n\n\
    ```perl\n$heap -> (server) -> put ( { Action => 'DBGet',\n                   \
    \         Family => 'tz',\n                            Key => \"$ext . -TIMEZONE\"\
    \ } );\n```\n\n四个数据库请求和 SIP 对端数据由 `getTZChannelVars` 请求。由于此函数由事件处理器调用，因此它也是不可中断的。因此，它向管理器发送四个数据库查询事件，但不直接处理响应。（完整过程内的五个请求的完整代码可在\
    \ *Linux Journal* FTP 站点上获取。）\n\n## 命令和数据库响应\n\n在发出请求和呼叫状态被调度之间的间隙，响应从 SIP 数据请求和数据库查询流入。从\
    \ SIP 数据请求中，我们需要挑出对端 IP 地址，它出现在管理器响应中读取为 `Address-IP: 192.168.1.5` 的一行上。幸运的是，POE\
    \ 模块会解析响应中的行，因此我们只需要通过获取传递给处理器参数之一的 `Address-IP` 哈希元素的值来寻找 `Address-IP` 行即可。POE\
    \ 堆在事件之间可访问，因此将 SIP 对端 IP 地址的值添加到堆中可使其对其他事件处理器可访问：\n\n```perl\nsub response_state_handler\
    \ {\n    my $peer_ip = $ [ ARG0] -> ( Address-IP ) ;\n    if (defined($peer_ip)\
    \ ) {\n        debug_print(\"SIP context found: Peer IP address \");\n       \
    \ debug_print ( \" is @$peer_ip\\n \");\n        _ [ HEAP ] -> ( 'SIP-Peer-IP\
    \ ')=$peer_ip;\n    } # response_state_handler\n}\n```\n\n在 SIP 数据响应返回之后，四个数据库查询应返回响应。查询的响应看起来像这样：\n\
    \n> ```\n> DBGetResponse: Success\n> Family: tz\n> Key: 300-TIMEZONE\n> Val: -8\n\
    > ```\n\n每当有来自管理器的 `DBGetResponse: Success` 事件时，回调处理器都会触发，参数是一个包含数据包中每行内容的哈希。我们要感兴趣的是键和值行，可以从传递给状态处理器的参数中检索到。与之前的处理器一样，响应存储在\
    \ POE 任务堆中，使其可供其他处理器使用：\n\n```perl\nsub db_response_state_handler {\n    my $family\
    \ = _ [ ARG0 ] -> ( Family ) ;\n    my $key = _ [ ARG0 ] -> ( Key ) ;\n    my\
    \ $value = _ [ ARG0 ] -> ( Val ) ;\n    if (defined($family)) {\n        debug_print\
    \ ( \"Key stored in DB family $family \");\n        debug_print ( \" is $value\\\
    n \");\n        # Store in heap\n        _ [ HEAP ] -> ( $key ) = $value;\n  \
    \  } # db_response_state_handler\n}\n```\n\n## 发起呼叫\n\n每个注册事件都会触发在延迟后发生“呼叫”事件。该延迟用于收集用于确定是否发起呼叫的信息。只有当时区设置已过期或\
    \ SIP 设备更改其 IP 地址且记录不再有效时，才应触发设置电话呼叫。\n\n由于 `call_state` 处理器由注册处理器放入队列中执行，因此它确实拥有一个参数，即所讨论呼叫的分机号。分机号可以\
    \ `$_[ARG0]` 获取。我们通过处理数据库响应和 SIP 数据请求而添加到堆中的所有数据也都立即可用：\n\n```perl\nsub call_state_handler\
    \ {\n\n\t# Get extension out of arguments to function\n\tmy $exten = $_[ARG0];\n\
    \n\tmy $hp = $_[HEAP];\n\n\t# Variables we use to determine if the call is required\n\
    \tmy $skev = $hp->{$exten.'-TIMESKEW'};\n\tmy $skev_addr = $hp->{$exten.'-TIMESKEW_ADDR'};\n\
    \tmy $skev_start = $hp->{$exten.'-TIMESKEW_START'};\n\tmy $skev_end = $hp->{$exten.'-TIMESKEW_END'};\n\
    \tmy $sip_peer_ip = $hp->{'SIP-Peer-IP'};\n\tmy $now = time();\n\tmy $now = time();\n\
    }\n```\n\n要确定是否需要呼叫，该处理器将当前时间与时间偏移记录的过期时间进行比较，并将 SIP 设备的 IP 地址与存储时偏移记录中的 IP 地址进行比较。如果\
    \ IP 地址匹配且偏移未过期，则无需呼叫。否则，需要进行呼叫，并使用 `makeTZSetupCall` 函数执行：\n\n```perl\nif ($now\
    \ > $skev_end) {\n\tdebug_print(\"Make call -- offset has expired.\\n\");\n\t\
    makeTZSetupCall($_[HEAP], $exten);\n} elsif ((!$skev_addr eq $sip_peer_ip)) {\n\
    \tdebug_print(\"Make call -- SIP IP addr changed\\n\");\n\tmakeTZSetupCall($_[HEAP],\
    \ $exten);\n} else {\n\tdebug_print(\"No call -- record OK & same IP\\n\");\n\
    }\n```\n\n最后一步，处理器需要移除放置在堆上的变量。堆仅用于在状态处理器之间传递变量，一旦该函数完成，这些变量就不再需要。可以使用 `undef`\
    \ 函数将每个变量定义为无定义：\n\n```perl\n# Need to clean up heap\nundef $_[HEAP]->{$exten.'-TIMESKEW'};\n\
    undef $_[HEAP]->{$exten.'-TIMESKEW_ADDR'};\nundef $_[HEAP]->{$exten.'-TIMESKEW_START'};\n\
    undef $_[HEAP]->{$exten.'-TIMESKEW_END'};\nundef $_[HEAP]->{'SIP-Peer-IP'};\n\n\
    } # call_state_handler\n```\n\n发起设置呼叫使用 Asterisk Manager 的 `Originate` 命令，但受最后一次检查保护。我定义了一组分机作为远程通道列表。只有远程通道列表上的分机才会向其发起时区设置呼叫。最初，该列表包括我的软电话和一个模拟电话适配器，但我可能需要在未来添加更多。在发起呼叫之前，我确保该号码在远程通道列表上，该列表在全局数组\
    \ `REMOTE_CHANNEL_LIST` 中定义。`Originate` 命令还可以接受多个参数。分机、优先级和上下文必须引用设置菜单定义的位置。在我的情况下，这些值是分机\
    \ `*89`（对于 `^4-TZ`）、优先级 `1` 和上下文 `from-internal`。我还可以向我要呼叫的电话提供“Time Zone Setup”作为来电显示文本：\n\
    \n```perl\nsub makeTZSetupCall {\n\n\tmy $heap = $_[0];\n\tmy $exten = $_[1];\n\
    \tmy $callOK = 0;\n\n\t# Check that extension to call is a remote channel\n\t\
    foreach $number (REMOTE_CHANNEL_LIST) {\n\t\tif ($number == $exten) {\n\t\t\t\
    $callOK = 1;\n\t\t}\n\t}\n\n\tif ($callOK) {\n\t\t$heap->{server}->put(\n\t\t\t\
    'Action' => 'Originate',\n\t\t\t'Channel' => 'SIP/' . $exten,\n\t\t\t'Context'\
    \ => $TZ_CONTEXT,\n\t\t\t'Extlen' => $TZ_EXTEN,\n\t\t\t'Priority' => $TZ_PRIORITY,\n\
    \t\t\t'CallenId' => $CALLERID,\n\t\t\t);\n\t\t# makeTZSetupCall\n\t}\n}\n```\n\
    \n如果触发了 `Originate` 命令，新注册的电话就会响铃，我将按照上个月文章中描述的语音菜单进行操作。\n\n> Matthew East 是无线网络领域领先技术书籍\
    \ *802.11 无线网络：权威指南*（O'Reilly Media 出版）的作者。可以通过 matthew.east@gmail.com 联系到他，但仅限于他靠近海平面时。\n\
    \n## 资源\n\n- [Perl 脚本完整源代码列表](ftp.linuxjournal.com/pub/lj/sti stings/issue156/9284.tgz)\n\
    - [有关 Asterisk Manager API 的信息](www.voip-info.org/w ki-Asterisk-manager+API)\n\
    - [Perl POE 框架](poe-perl.org)\n- [Perl Asterisk Manager 组件](search.cpan.org/~xantus/\
    \ POE-Component-Client-Asterisk-Manager-0.06/Manager.pm)\n\n"
