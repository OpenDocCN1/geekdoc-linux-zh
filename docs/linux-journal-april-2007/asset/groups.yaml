    \ Tab 键选择 OK，然后转到下一个屏幕。ISO 映像的名称为 `monde rescue-1.iso`、`monde rescue-2.iso`\n\n\
    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_28_0.png)\n\n图 2. 压缩可能会极大地影响备份的性能。\n\n\
    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_28_1.png)\n\n依此类推。现在，你可以通过选择其他名称来覆盖该命名约定。如果你对默认设置满意，请按\
    \ Enter 继续。\n\n接下来是备份路径屏幕。默认情况下，从根目录（`/`）开始向下备份所有内容。大多数人对此感到满意，可以安全地转到下一个屏幕。顺便提一下，如果你碰巧有一个包含\
    \ NTFS 分区（例如带有 Windows 的双启动系统）的系统，Mondo Rescue 会提供备份这些分区的选项，并告知你它们的存在。你可以接受这些或从备份分区列表中移除它们。\n\
    \n提到备份整个系统是有意义的，但我承认你可能并不真的想备份所有内容。在我的系统中，我经常有完整的文件系统，用于下载 Linux 发行版以便在虚拟机上进行实验。我不想备份这些。我还有充满了只能被称为临时垃圾的文件夹——这些东西在当时看来是个好主意，但我还没来得及清理，也肯定不想备份它们。只需列出你想要从备份中排除的所有文件夹，用空格分隔即可。\n\
    \n此时，你几乎已经准备好了。`mondearchive` 程序会询问你是否想要验证你的备份，然后它会提出一个非常奇怪的问题：“你是否确信你的内核是一个健全、合理、标准的\
    \ Linux 内核？如果你使用的是 Gentoo < 1.4 或 Debian < 3.0，请回答‘否’。” Mondo Rescue 希望确保用于启动\
    \ CD（或 DVD）的内核具有正确启动的智能。如果你有任何疑虑，或者你喜欢自己编译内核，请说“否”，Mondo Rescue 将使用它自己的内核。一旦你做出了选择，`mondearchive`\
    \ 程序会提醒你已准备好开始。这是你改变主意的最后机会。\n\n备份开始，同样以 ncurses 图形模式进行，首先创建要备份的文件名目录（图 4）。接下来发生的事情只在头几次有趣——主要因为你可能还有更重要的事情要做。屏幕显示备份报告，分为文件集、创建启动软盘等。此时，Mondo\
    \ Rescue 已准备好备份你的数据，并显示一个美观的进度条，告诉你哪个 ISO 正在写入、完成多少以及预计整个过程需要多长时间（图 5）。\n\n说到更好的事情，现在可能是补充红酒的好时机。Francois，请确保我们的客人的酒杯都斟满了。\n\
    \n这一切都很好，但大多数时候，坐在终端会话前运行备份并不是人们想要做的。因此，所有这些都可以在命令行中完成，这正是如果你要从 cron 作业中运行程序时所需要的。例如，看看以下命令：\n\
    \n```\nmondoparchive -o/d /mnt/bigdrive -i -l GRUB -f -v -3 -N\n```\n\n该命令表示创建\
    \ `mondoparchive` 备份（`-o`），创建 ISO 映像（`-i`），使用磁盘上的位置（`-d`），引导加载程序是 GRUB（`-l`），跳过创建启动软盘（`-f`），验证备份（`-v`），使用中等压缩（`-3`）并忽略\
    \ NFS 挂载的分区（`-N`）。我在这里将重点介绍备份的交互模式，但我邀请你在命令行提示符下输入 `man mondoparchive` 来检查各种选项。\n\
    \n最终，你将拥有一个完整的备份，在这种情况下，是你可以刻录到 CD 或 DVD 的一个或多个 ISO 映像。系列中的第一张光盘是你希望从中启动的那张。几秒钟后，你将看到类似图\
    \ 6 中所示的菜单（当前在 QEMU 虚拟机中运行）。\n\n在恢复系统时，你有几个选项（核爆、交互和专家），包括不恢复系统（比较）。如果你选择核爆选项，你的系统将恢复原状，计算机上现有的任何文件系统都将被销毁并从备份中重新创建。请谨慎使用此选项。你也可能想恢复一个或多个文件和文件夹。为此，请使用交互模式。最后，专家模式会带你到命令行提示符。你也可以简单地等待几秒钟，恢复盘将正常启动，然后带你进入\
    \ `mondrestore` 程序的图形（ncurses）界面（图 7）。\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_28_2.png)\n\
    \n![](img/3c4d8a97b5d96c835281dc0dacbc8551_29_0.png)\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_29_1.png)\n\
    \n![](img/3c4d8a97b5d96c835281dc0dacbc8551_29_2.png)\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_29_3.png)\n\
    \n![](img/3c4d8a97b5d96c835281dc0dacbc8551_30_0.png)\n\n# **专栏**\n# 使用 LINUX 进行烹饪\n\
    \n**PGI 统一二进制™**\n\n现在，PGI™ 编译器可以生成单个 PGI 统一二进制可执行文件，该文件针对 Intel EM64T 和 AMD64\
    \ 处理器进行了全面优化，在提供单一 x64 平台的所有优势的同时，使您能够利用 Intel 和 AMD 的最新创新。作为一套集成且支持多核的软件开发工具的一部分，PGI\
    \ Fortran、C 和 C++ 编译器在 Linux 和 Windows 之间提供世界级的性能和统一的开发环境。访问 [www.pgroup.com](http://www.pgroup.com)\
    \ 看看为什么结构分析、计算化学、计算流体动力学和汽车碰撞测试领域领先的独立软件供应商选择 PGI 编译器工具和来构建和优化他们的 64 位应用程序。\n\n\
    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_30_1.png)\n\n**The Portland Group™**\
    \  \n[www.pgroup.com](http://www.pgroup.com)  ++ 01 (503) 682-2806\n\nThe Portland\
    \ Group, Inc. 是一家 STMicroelectronics 公司。PGI、The Portland Group、PGI Unified Binary\
    \ 是 STMicroelectronics 的商标或注册商标。其他品牌和名称是其各自所有者的财产。\n\n"
