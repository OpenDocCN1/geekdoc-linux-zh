    ## 外海群岛


    软件开发者应该知道，即使极客有时也希望像对待社区小企业主一样被照顾。


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_39_0.png)


    **乔恩·“疯狗”·霍尔**


    许多程序通常编写得非常好，在人们使用它们的99.999%的时间里表现卓越。或者，它们对想要使用它们的95%的人表现很好。但是，对于那些功能或那些处于“外海群岛”边缘的人群来说，往往没有给予足够的关注，也没有编写足够的文档来满足他们的需求。


    在航海传说中，外海群岛总是带有一丝神秘和冒险色彩。作为通常最偏远的陆地或捕鱼区域，它们是最难到达的，提供的挑战最大，但往往回报也最高。我从互联网上喜欢这样一个定义，称外海群岛是“变幻莫测的”、“受海洋
    whims（变幻无常）支配的”以及“要求苛刻的环境”。


    有时候，软件给人的感觉也是如此。


    我参与的一项业务提议基于使用一个与我过去四年一直在使用的发行版不同的系统，因此我决定切换到这个新的（对我而言是新的）发行版。我有一种哲学信念：如果你无法使用自己的产品，就不应强迫他人使用它们。


    在迁移过程中，我不得不做一些尽职调查。我在笔记本上以实时CD的方式运行了新发行版，所有设备都被正确发现并配置好了。与我之前的发行版不同，我不必去寻找无线网卡驱动程序，而且其他各个方面基本上设置成了我想要的样子。起初，我印象非常深刻。与我之前的发行版不同，这个发行版采取了一种呈现较少应用程序给最终用户的菜单哲学。该发行版的开发者进行了分析，并基于他们自己使用的以及他们认为客户可能使用的内容做出了决策。理解这一哲学后，我决定使用他们的默认邮件界面，它比我用过15年的那个更加集成，且更像Windows风格。我可以说，我过去使用的那个程序并没有什么问题，但它没有我现在使用的主流，因此与其他应用程序的集成不如现在这么顺畅。我也希望践行上述“种瓜得瓜，种豆得豆”的哲学。


    总的来说，我喜欢新的邮件界面。与旧界面相比，它做事的方式不同，但它确实有一些不错的功能。它组织良好，响应迅速，并且支持许多嵌套文件夹——由于我有将所有电子邮件历史记录保留在笔记本上的习惯以便随时离线工作的习惯，这是我所需要的。（是的，我经常做备份。）


    幸运的是，新的邮件界面具备将旧邮件存储迁移到新格式的功能。我在邮件安装文档中看到了这一点，我很高兴我的邮件可以轻松地“转换”为新格式。不幸的是，当到了执行这一关键步骤时，转换程序不起作用。这就引出了本月文章的主题。


    在撰写电子邮件方面，我的需求相对简单，我相信当我习惯后，这个新界面能满足大部分这些需求。但是，我一开始真正需要的就是导入机制实际上能够工作。不仅这个机制不工作，而且是以一种令人印象深刻的方式不工作——让我怀疑程序员在将其自豪地列为“功能”之前是否甚至尝试过一次。或者，也许他们在很久以前就尝试过，随着时间推移（当它停止工作时），他们没有注意到它已经停止工作了。


    当然，导入旧邮件通常是用户（除非他们是系统管理员）只做一次的事情。一旦用户整合了他们的邮件，他们就会继续“只管使用”。程序员要对整合旧邮件进行回归测试，需要花费时间和努力来搭建测试床或测试这些旧系统的方法论，以确保系统在未来仍能正常工作。或者，他们必须不断寻找愿意测试将邮件整合到新系统中的人。或者，他们必须等到某人的系统失败，然后再试图让它恢复工作。


    不幸的是，最后这种策略通常会给软件带来不良名声。本应使用该软件的人从未使用它，因为*本应首先正常工作的事情*并没有正常工作。大多数人不会像我这么固执地试图让某样东西工作。他们只是停止使用它。


    幸运的是，我不是“社区小企业主”。我可以超越电子邮件整合未能正常工作的事实，并迅速形成了一个变通方案来解决这个问题。现在，我正在使用新的邮件界面并会继续使用它，并且我会提交一份关于整合问题的错误报告。


    我故意没有在本篇文章中提到我正在使用的旧或新界面。认识我的人都知道我使用了大约15年的邮件界面。而那些看到我使用电脑的人会猜到新的那个。但存在足够多的项目和软件在95%的时间里都能正常工作，使这篇文章适用于其中的许多情况，只以这两个为例是不公平的。


    新界面仍然存在一些问题，我怀念旧界面中的一些东西。我打算与集成界面的开发者合作，将那些在“社区小企业主”世界中有意义的内容整合进去，并记录那些对大多数人没有意义但对“外海群岛”中可能有用处的操作方法。我知道我会在“变幻莫测且要求苛刻的环境”中见到你们中的一些人。■


    **乔恩·“疯狗”·霍尔**是Linux国际（www.li.org）的执行主任，这是一个由希望支持和推广Linux操作系统的最终用户组成的非营利协会。在他始于1969年的商业计算职业生涯中，霍尔先生曾担任程序员、系统设计人员、系统管理员、产品经理、技术营销经理和教育者。他曾在西方电气公司、Aetna人寿和意外险公司、贝尔实验室、数字设备公司、VA
    Linux Systems和SGI等公司工作。他现在是自由开源软件（FOSS）业务和技术问题的独立顾问。


    ---


