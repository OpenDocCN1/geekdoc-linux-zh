    ## 既然我们可以制作自己的开放手机，为什么还要用iPhone？


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_41_0.png)


    **DOC SEARLS**


    **让我们打破手机的孤岛，为了每个人的利益。**


    我在2007年消费电子展（CES）之后写下这篇文章。我每年都参加CES，因为它总是充满有趣的Linux故事和用例（其中一些出现在本月*LJ*的UpFront版块），而且，看到一个大型老行业发生的变化远比年度炒作所暗示的要慢，总是很有趣的。许多消费电子“革命”其实并不是如此。今年苹果新iPhone的到来可能也是这种情况。我不知道MacWorld和CES安排在同一周是巧合还是有意为之，但效果是可以预见的：史蒂夫·乔布斯在MacWorld上惯常魅力十足且新闻满满的开场主旨演讲超过了所有CES的内容——CES是一个规模仅略小于欧洲CeBIT的行业展会。


    史蒂夫·乔布斯演讲中最大的新闻是iPhone。他称其为“一个革命性的产品……改变一切”。他说它将在2001年的iPod和1984年的Macintosh层面上引发革命。他甚至说iPhone符合这三个“革命性产品”的标准：这些是1)“带触控操作的大屏iPod”，2)“革命性的移动电话”和3)“突破性的互联网通信设备”。他将iPhone与“智能手机”（如Trio、Blackberry、Nokia
    E62和Moto Q）进行了对比，所有这些设备都具有“无论你是否想要，它们都存在”的键盘。


    iPhone配备了一个大型、高分辨率的彩色屏幕和一个名为MultiTouch的专利指点系统，让你可以用多根手指做各种事情。（当然，除了不看屏幕就拨号，因为所有数字都显示在一层透明的触觉伪装层后面。）按照苹果的传统，控制是极简的：正面只有一个按钮，其他地方也只有少数几个。


    在CES上，技术圈讨论的热潮是关于这款手机将运行基于苹果BSD的OS X并支持“桌面级”应用程序的消息。这一声明，以及关于iPhone是“革命性互联网通信设备”的说法，激起了人们希望苹果能帮助打破手机制造业/运营商孤岛的希望，这些孤岛将客户困在内部，并将独立开发者拒之门外，直到最后。在Linux
    Journal网站上的一篇文章中，我写道：


    你可以尽情抨击iPhone封闭的一面；它仍然是一台带有麦克风、屏幕、扬声器和其他一堆输入/输出端口的计算机，这些端口邀请着各类开发者。这就是为什么我认为iPhone将使手机市场变得更大。它将鼓励那些迄今为止被迫应对手机行业远不能满足其需求的开发者和客户参与进来。其中包括苹果现在合作或竞争的所有传统手机玩家。


    我本应更清楚这一点。事实上，我知道，但忽视了我内心的愤世嫉俗者。1997年，史蒂夫·乔布斯在长期缺席后回到苹果时，他的第一个行动之一就是淘汰公司硬件的克隆品。在随之而来的抗议声中，我给戴夫·威纳（Dave
    Winer）写了这段话，他将其发布在自己的网站上[www.scripting.com/davenet/stories/DocSearlsonSteveJobs.html](www.scripting.com/davenet/stories/DocSearlsonSteveJobs.html)。


    所以，史蒂夫·乔布斯刚刚枪毙了克隆者，间接地对越来越多的偏好克隆Mac系统而非苹果自家系统的Mac用户做了同样的事。因此，他对所有人的信息与第一天没有不同：我对你们其他人想要的，只有你们的钱和对我艺术的欣赏。


    这是一个残酷的举动，但祝他好运：史蒂夫的艺术一直是一流的，定价也是如此。它没有任何平凡之处。史蒂夫谈论的Mac“生态系统”是源于那种艺术，而非市场需求或其他更明显的力量。而且，那种艺术与开发者、客户和用户的关系，不比梵高与苏富比、佳士得和收藏家们的关系更紧密。


    你看，史蒂夫是一个精英主义者和创新者，两者他都做得非常出色。他最伟大的成就是新颖的美学和风格作品。Apple I和II是沃兹尼阿克的作品；但Lisa、Macintosh、NeXT和Pixar都是乔布斯的作品。无论它们的

