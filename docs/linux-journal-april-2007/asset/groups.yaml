  - "[PAGE 21]\n\n# TECH TIPS\n\n# Make USB/MIDI work, turn your existing soundcard\
    \ into a high-quality synthesizer, and exploit the power of X.\n\n# How to Make\
    \ Your USB/MIDI Connection Work with Your Custom-Compiled Kernel\n\nMany of us\
    \ like to compile our own kernels. In my case, I compile my own kernels for two\
    \ reasons. First, stock kernels include in-tree images that tend to discover my\
    \ SCSI devices in the wrong order. You can fix the intent to discover devices\
    \ properly (I explained how to do that with Ubuntu/Kubuntu in a previous instalment\
    \ of Tech Tips). But, I prefer to avoid the problem by compiling the drivers into\
    \ the kernel rather than loading them as modules. Second, I just like to run the\
    \ latest stable kernel available.\n\nI've been playing with synthesizers with\
    \ a USB/MIDI connection. Much to my dismay, I couldn't see to make the USB/MIDI\
    \ connection work with my own compiled kernel. I couldn't find any information\
    \ on the Web that would point me to the problem, but I eventually stumbled on\
    \ the answer quite by accident.\n\nThe solution turns out to be quite simple and\
    \ obvious once you look through enough of the kernel configuration options. One\
    \ problem is that the kernel drivers are organized in such a way that it wasn't\
    \ obvious (at least it wasn't obvious to me) which drivers to include to make\
    \ this work. I picked all the MIDI sequencer drivers, so why wasn't it working?\
    \ The USB driver you need actually resides within the tree for sound drivers,\
    \ not USB drivers. Select the following from \"make menuconfig\" (or whichever\
    \ method you prefer for kernel configuration): Device Drivers→Sound→Advanced Linux\
    \ Sound Architecture→USB Devices→USB Audio/MIDI driver.\n\nAlthough, as I said,\
    \ I generally compile my drivers directly into the kernel, I recommend that you\
    \ compile this particular one as a module, instead. There's no point in having\
    \ the module loaded during those times when you're not using the synthesizer keyboard.\n\
    \nSelect the above driver as a module, and it creates a module called snd-usb-audio.\
    \ The module name was the source of my confusion. I found the snd-usb-audio module\
    \ when I tried to track down what made the stock kernel work, but I dismissed\
    \ this module as a possible candidate for fixing this problem due to its name.\
    \ It didn't occur to me that snd-usb-audio had anything to do with MIDI until\
    \ I stumbled across the label \"USB Audio/MIDI\" in the kernel configuration.\
    \ The module name itself makes it seem like the module is meant for an external\
    \ sound source, not an external MIDI source.\n\nBy the way, I was inspired to\
    \ set this up after getting my daughter a Korg X50, a very affordable and excellent\
    \ synthesizer keyboard. The latest Korg keyboards don't seem to require any special\
    \ configuration in order to connect the USB/MIDI port. However, I later discovered\
    \ that the Yamaha keyboards aren't quite as friendly. You have to change some\
    \ MIDI settings on the Yamaha Motif ES keyboards to make the keyboard work with\
    \ the computer via the USB port.\n\nThis may seem self-evident, but the trick\
    \ is to follow the instructions in the Yamaha Motif ES manual for connecting the\
    \ USB/MIDI to the computer. Well, duh, right?\n\nRTFM, or more politely, read\
    \ the fine manual. But when you encounter problems, it's sometimes tempting to\
    \ look for tips on the Web to make the keyboard work. Be warned that you should\
    \ not follow many of the instructions you'll find on the Web. These instructions\
    \ are generally for Windows and the Mac, and they'll tell you how to configure\
    \ the Yamaha keyboard to send the MIDI signals through the computer and echo them\
    \ back to the keyboard. It's probably possible to set up the Linux driver and/or\
    \ patch daemons (such as jackd) to make Linux applications work with this configuration,\
    \ but that's not how Linux behaves by default. So, this is definitely a case where\
    \ you should avoid the Web and RTFM instead.  \n—Nicholas Peteley\n\n# Turn Your\
    \ Computer into a High-Quality Synthesizer\n\nMaybe you can't afford even the\
    \ Korg X50, but you want to try your hand at composing music or even just playing\
    \ MIDI files. The problem is most soundcards that work with Linux do not come\
    \ with a very impressive collection of MIDI sounds (such collections are usually\
    \ referred to as soundfonts). Free soundfonts are available, but they don't sound\
    \ as professional as some of the ones you can purchase. For example, SONIVOX MI\
    \ sells a fantastic General MIDI (GM) soundfont, and its available for just under\
    \ $100 US. If you want to use a key board to record MIDI sequences, you can purchase\
    \ one of many cheap MIDI keyboards that do nothing but send MIDI signals (they\
    \ have no synthesizer included). These keyboards sell for well under $100 US depending\
    \ on the quality that you'll find satisfactory.\n\nHere's how to use the SONIVOX\
    \ soundfont. First, purchase the font from the URL listed below. It has been too\
    \ long since I've purchased my copy for me to recall whether the file you download\
    \ is a ZIP file or a Windows executable. Even if it's a Windows EXE file, you\
    \ should be able to unpack it with Wine.\n\nNow, download and install fluidsynth\
    \ and the qsynth front end (its as simple as an apt-get install fluidsynth qsynth\
    \ from Debian and many Debian-based distros). You may have to load the ALSA sequencer\
    \ drivers manually or specify the module in a file like/etc/modules. The module\
    \ you want to load is snd-seq, and the command to load it is modprobe snd-seq.\n\
    \n![](img/3c4d8a97b5d96c835281dc0dacbc8551_21_0.png)\n\nFigure 1. The Qsynth Front\
    \ End to fludisynth"
