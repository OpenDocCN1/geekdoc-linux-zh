    # PacketFence


    ## 如何设置和使用功能强大的开源网络访问控制解决方案。


    **LUDOVIC MARCOTTE 和 DOMINIK GEHL**


    随着对网络的攻击数量不断增加——无论是来自匿名访问者，还是从网络中发起非法活动——拥有出色的安全工具至关重要。虽然良好的防火墙以及 Snort 和 Nessus
    等工具可以提高安全性，但网络管理员正在寻求能够自动响应网络使用策略违规情况的解决方案，以补充这些安全工具。这些工具被称为网络访问控制（NAC）解决方案。存在许多此类工具——尤其是来自
    Cisco 等大型供应商的专有工具——但一项开源解决方案 PacketFence 值得关注。


    PacketFence 是一个免费且开源的解决方案，提供网络访问控制功能，包括以下标准特性：


    - 注册网络端点（台式机、笔记本电脑、打印机等），并在获得完整网络访问权限之前，可选地在注册时接受网络使用策略。

    - 基于对所有连接节点进行被动和主动网络扫描，检测网络使用策略违规。

    - 隔离违规节点。

    - 基于网络使用策略违规的通知（电子邮件、弹窗等）。

    - 修复措施，使网络组件在违规后能够重新获得网络访问权限。


    PacketFence 使用 Perl 编写，并利用常见的开源组件，如 MySQL、Apache、Snort 和 Nessus。它不需要在安装访问网络的计算机上安装用户代理。其部署是非侵入式的，并且与用户的所有交互都通过一个被所有
    Web 浏览器可访问的强制门户进行。


    PacketFence 目前支持 ARP、DHCP/DNS 和 VLAN 隔离技术。选择正确的隔离方法取决于您的网络规模以及您拥有的网络设备。在本文中，我们介绍基于
    ARP 的隔离技术，该技术在任何类型的网络设备上都能正常工作。


    ### 基于 ARP 的隔离


    基于 ARP 的隔离通过污染连接到网络的任何设备的 ARP 缓存来实现。如您所知，ARP 是一种用于将 IP 地址映射到 MAC 地址的协议。从根本上说，以太网
    ARP 中存在四种对 PacketFence 感兴趣的基本消息类型：


    1. ARP 请求：请求目标 MAC。

    2. ARP 响应：包含 MAC 的响应。

    3. RARP 请求：从 MAC 请求 IP。

    4. RARP 响应：包含 IP 的响应。


    ARP 的问题在于，当客户端发出 ARP 请求时，它简单地信任传入的响应并将其存储到其缓存中。污染 ARP 缓存就像向客户端发送 ARP 响应一样简单，即使它没有请求。操作系统很可能在接收到此类数据包时更新缓存，或者当它决定更新缓存时使用我们发送的污染数据。


    ### 安装和配置


    PacketFence 在 Red Hat Enterprise Linux 4、CentOS 4 和 Fedora Core 上开发。许多人已成功在不同发行版上运行它，但为了简化您的首次安装，最好坚持使用其中一个官方支持的发行版。由于
    PacketFence 是一种 NAC 解决方案，安装它将影响您当前的局域网，请确保与您的网络管理员协调测试。


    #### 准备工作


    PacketFence 使用 MySQL 数据库来存储关于连接到网络的节点的信息、它们属于谁以及是否存在任何指定的网络策略违规。因此，如果您还没有一个专门用于此目的的
    MySQL 服务器，请通过运行 `yum install mysql-server` 安装 MySQL 服务器。


    如前所述，PacketFence 可以使用 Snort 和 Nessus，下面我们将描述如何将这两个工具与 PacketFence 集成。


    Snort 是一个开源网络入侵检测系统，它使用签名来分析网络流量。一旦给定数据包匹配某个签名，Snort 就可以生成警报。签名不仅针对许多计算机病毒和间谍软件存在，还针对网络流量，如
    BitTorrent、ICQ、Skype 甚至 Hotmail 访问。它们可以通过 SourceForge, Inc.、Snort 网站以及 Bleeding
    Edge Threats（参见资源）获取。PacketFence 还附带一个 OinkMaster 配置，以自动获取规则集并将其裁剪为 PacketFence
    所需的内容。由于 PacketFence 对 Snort 2.6 的支持仍在开发中，请从 www.snort.org/lib/linux/old 下载 Snort
    2.4.5，然后执行以下命令安装 RPM：


    ```bash

    rpm -ivh snort-2.4.5-1.RHEL4.1386.rpm

    ```


    另一方面，Nessus 是一个主动漏洞扫描器——这意味着它会生成到您想要测试漏洞的主机的连接。您必须注册 Nessus 的所有者 Tenable Network
    Security 才能获得可用的插件。通过下载 Linux 版本的 2.2.9 并执行以下命令安装 Nessus：


    ```bash

    sh nessus-installer-2.2.9.sh

    ```


    Nessus 3 尚未得到很好的支持，并且由于围绕它的许可问题，请坚持使用 2.2.9。

    安装完成后，使用以下命令启动 Nessus：


    ```bash

    /opt/nessus/sbin/nessusd -D

    ```


    并使用作为单独下载提供的 NessusClient 测试连接。


    #### 安装


    从 SourceForge 仓库下载 PacketFence RPM，并使用以下命令安装：


    ```bash

    rpm -ivh packetfence-1.8.2-0.1386.rpm

    ```


    在 /usr/local/pf 中，您将找到两个有助于完成必要配置步骤的 Perl 脚本：`installer.pl` 和 `configurator.pl`。将当前目录更改为
    /usr/local/pf，并执行 `installer.pl`。该脚本除了其他功能外，还设置 PacketFence 数据库，安装所有必要的 Perl 模块（数量相当多），并为
    Web GUI 创建一个用户帐户。


    #### 配置步骤


    现在，真正的配置工作开始了。首先，执行 `configurator.pl`，您将看到几个选项。根据测试模式选择模板配置。您将需要提供几个网络参数（DHCP
    服务器、DNS 服务器等），并将创建一个基本配置文件 /usr/local/pf/conf/pf.conf。此配置文件仅包含您对保存在 /usr/local/pf/conf/pf.conf.defaults
    中的默认配置参数所做的更改。查看 conf/pf.conf.defaults 以了解可用的选项。为了帮助您了解 PacketFence 内部正在发生的事情，请将以下行添加到
    /usr/local/pf/conf/pf.conf 以提高日志记录级别：


    ```ini

    [logging]

    verbose=8

    ```


    #### 基本用法


    使用 `service packetfence start` 启动 PacketFence。查看 /var/log/messages，您应该看到 PacketFence
    开始创建网络上所有节点的清单，如下例所示：


    ```text

    Jan 3 16:05:28 pf pf: update_hashes(5): UPDATE

    New node 00:07:e9:05:4c:f2 (192.168.0.1)

    Jan 3 16:05:28 pf pf: update_hashes(5): UPDATE

    New node 00:90:27:6a:71:ea (192.168.0.2)

    ```


    /usr/local/pf/bin/pfcmd 是 PacketFence 命令行界面。不带任何额外参数执行它会显示一个带有可用选项的帮助屏幕。为了显示数据库中的所有节点，执行：


    ```bash

    #/usr/local/pf/bin/pfcmd node view

    mac|pid|detect_date|regdate|lastseendate|pid|status|

    user_agent|computername|last_agent|last_dhcp|switch|

    port|vlan|dhcp_fingerprint

    00:e7:e9:05:4c:f2|1|2007-01-03 16:05:28|||unreg|||

    2007-01-03 16:10:11||||||||

    00:90:27:6a:71:ea|1|2007-01-03 16:05:28|||unreg|||

    2007-01-03 16:10:12||||||||

    ```


    手动注册节点可以使用以下命令完成：


    ```bash

    /usr/local/pf/bin/pfcmd

    ~node edit 00:07:e9:05:4c:f2 status="reg" pid=1

    ```


    您还可以使用 pfcmd 访问每个配置参数的文档。要查看 [general] 部分中 logo 参数的文档：


    ```bash

    #/usr/local/pf/bin/pfcmd config help general.logo

    GENERAL LOGO

    Default: //common/packetfence.gif

    Logo displayed on Web pages.

    ```


    使用以下命令查看可用的报告：


    ```bash

    /usr/local/pf/bin/pfcmd help report

    ```


    os 和 osclass 报告使用 PacketFence 的 DHCP 指纹识别功能，该功能试图确定每个 DHCP 请求（包括由打印机、VoIP 电话、交换机等发出的请求）的操作系统。运行：


    ```bash

    /usr/local/pf/bin/pfcmd report os

    ```


    将显示网络上每个检测到的操作系统的节点数量和百分比。请注意，DHCP 指纹识别功能可以轻松用于禁止运行特定操作系统的计算机访问您的网络。


    PacketFence 还具备一个管理 Web GUI，默认情况下在安全端口 1443 上可用。将您的浏览器指向 `https://pf-host:1443/`。一旦输入您在安装期间定义的登录/密码，您就可以开始通过
    GUI 监控和配置 PacketFence。


    当您开始强制执行使用 PacketFence 注册节点时，网络上的所有节点都必须先注册才能获得完整的网络访问权限。此注册要求适用于所有具有网络访问权限的设备，包括无线接入点和打印机。因此，在实际激活配置文件中的此选项之前，明智的做法是手动预先注册这些类型的设备。


    另一方面，对于具有 Web 浏览器的计算机，用户可以通过 PacketFence 强制门户完成注册。该门户可以通过 RADIUS 文件、Radius 或 LDAP
    验证登录/密码信息，我们在示例中使用了 LDAP。为此，您需要调整提供的模板 /usr/local/pf/conf/templates/ldap.conf
    以适合您的 LDAP 结构。由于所有用户都将被重定向到注册屏幕，此时明智的做法是将显示在 Web 页面上的默认 PacketFence 徽标更改为您自己的公司徽标。这可以通过在
    /usr/local/pf/conf/pf.conf 的 [general] 部分添加 `/logo/` 到 `/common/mylogo.gif`，并将文件
    mylogo.gif 复制到目录 /usr/local/pf/html/common/ 来实现。


    要激活注册，请将以下参数合并到 /usr/local/pf/conf/pf.conf 中：


    ```ini

    [trapping]

    testing=disabled

    detection=disabled

    [registration]

    aup=enabled

    auth=ldap

    ```


    现在，使用 `service packetfence restart` 重启 PacketFence。您应该在 /var/log/messages 中看到
    PacketFence 正在通过 ARP 欺骗您的网络网关来捕获未注册的节点。从客户端角度来看，打开 Web 浏览器并访问任何外部网站都会导致重定向到 PacketFence
    强制门户，允许您注册计算机。您也可以通过在客户端上执行 `arp -n -a`（在 Linux 下）并检查为您的网络网关保存的 ARP 缓存中的 MAC 地址来确定客户端是否已被
    ARP 欺骗。


    #### 集成 Snort 和 Nessus


    您可以通过将 Snort 警报添加到您的 PacketFence 安装中来更进一步。假设在您的环境中禁止使用 BitTorrent 客户端，您希望配置 PacketFence
    来强制执行此策略。编辑 /usr/local/pf/conf/violations.conf，使包含 BitTorrent 的部分如下所示：


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_65_0.png)


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_66_0.png)


    Shane 的客户总是在推动技术的极限。这就是为什么他是 Rackform iSvr R2020 的粉丝，这是一款创新的、iU、双计算节点系统，旨在提高计算密度的同时降低成本、能源和空间需求。通过支持每个计算节点两个
    Quad-Core Intel® Xeon® 5300 系列处理器，iSvr R2020 将 Intel 经过验证的可靠性与业界领先的每 iU 16 核密度相结合。此外，每个计算节点中的
    8 个完全缓冲 DIMM 插槽、2 个热插拔 SATA 硬盘和 PCI-Express 插槽使 Shane 相信 iSvr R2020 提供了应对最具挑战性的计算任务所需的密度、灵活性和成本效益。


    当与 Silicon Mechanics 合作时，您获得的不仅仅是强大的 Intel 解决方案——您还获得像 Shane 这样的专家。


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_66_1.png)


    请访问 www.siliconmechanics.com

    或致电 866-352-1173（免费）


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_66_2.png)


