    - 提供 X60s 笔记本电脑\n- 起价 $2300\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_32_3.png)\n\
    \nwww.EmperorLinux.com 1-888-651-6686\n\n# 在 Apache 中显示图像目录\n\n迈向基于 Web 的图像管理\
    \ Shell 脚本的第一步。\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_33_0.png)\n\nDAVE\
    \ TAYLOR\n\n坦白说，由 Apache 和其他 Web 服务器生成的目录列表很糟糕。\n\n大多数时候，我编写 shell 脚本是为了解决我认为的轻量级问题。是的，我承认，如果你需要预测天气、对\
    \ 50,000 个数据点进行地理映射或创建一个在线购物车，shell 脚本可能不是最佳工具！\n\n尽管如此，当我在日常工作中遇到简化问题的困难或机会时，我首先想到的工具就是\
    \ shell 脚本。对你们中的一些人来说，可能是 Perl 或一些花哨的 PHP 代码，但由于任何能在 Linux 命令行上输入命令的人都可以开始编写脚本，我必须说我仍然认为\
    \ shell 脚本是一个好的起点。\n\n令人惊讶的是，在短短一段代码中能完成多少工作，这个月我分享了一个拼凑起来的脚本，旨在解决你 Web 服务器上的一个常见问题——一个巨大的“Images”目录。\n\
    \n## Apache 目录列表\n\n坦白说，由 Apache 和其他 Web 服务器生成的目录列表很糟糕。它们基本上就是 `ls -l`，没有额外信息，没有预览，什么都没有。大多数时候这并不重要，因为你的网站大部分可能是无缝的，用户不会接触到后端。\n\
    \n但是，你收集网站上所有图像、图形和照片的那个目录很可能情况不同。无论它被称为“Images”、“Graphics”、“Photos”、“Art”还是别的什么，你的目录很可能和我的一样：拥有\
    \ 1,400 个图形文件。\n\n如果文件名具有高度助记性，基于文本的列表功能是有用的，但展示所有图像的缩略图及其名称，而不仅仅是文件大小和最后修改日期，岂不是很实用？\n\
    \n这就是这个脚本的作用，和所有实际作为 CGI 脚本运行的脚本一样，它必须首先立即推送适当的头部信息：\n\n```sh\n#!/bin/sh\n\necho\
    \ \"Content-type: text/html\"\necho \"\"\n```\n\n既然头部信息已经处理完毕，其余的内容可以在循环中生成。事实上，脚本的初始骨架版本只是重复了你\
    \ Web 服务器中已有的文件列表功能：\n\n```sh\nfor name in *\ndo\n    echo \"$name <br>\"\ndone\n\
    ```\n\n当然，这个输出并不是很有趣。至少，你可以更改它使文件名可点击：\n\n```html\necho \"<a href=$name>$name</a><br>\"\
    \n```\n\n但即使那样也并不是特别有趣。让我们添加一些条件代码，使图像显示出来，而其他内容仅生成链接。不过，与其测试文件名，不如做点更有趣的事情，使用不为人知的命令\
    \ `file`。\n\n当你遍历典型图像目录的内容时，你期望得到类似以下的输出：\n\n```text\n$ file *\n\naol-safety-menu.png:\
    \       PNG image data, 161 x 230, 8-bit/color RGB, non-interlaced\napple-ipod-enter-code.png:\
    \ PNG image data, 268 x 202, 8-bit/color RGB, non-interlaced\narchos-av700.png:\
    \          PNG image data, 567 x 294, 8-bit/color RGB, non-interlaced\nempty.jpg:\
    \                 empty\nhentai-manga-example.gif:  GIF image data, version 89a,\
    \ 358 x 313\nindex.cgi:                 Bourne shell script, text executable\n\
    teenage1.jpg:              JPEG image data, JFIF standard 1.02, aspect ratio,\
    \ 100 x 100\n```\n\n不错的命令，不是吗？它包括图像类型、尺寸、深度以及它能确定的其他特性。\n\n最重要的是，请注意“XX image\
    \ data”（XX 图像数据）在这些图像中一致出现，无论是 PNG、JPG 还是 GIF 图像。通过使用这一点，我们可以避免 JPG 与 JPEG、JPG\
    \ 与 jpg、GIF 与 Gif 等所有麻烦。\n\n现在，这个小循环看起来像这样：\n\n```sh\nfor name in *\ndo\n    if\
    \ [ ! -z \"$(file $name | grep 'image data')\" ] ; then\n        echo \"$name\
    \ <br>\"\n```\n\n"
