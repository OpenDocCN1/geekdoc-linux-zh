    # **WHY AN iPhone WHEN WE CAN MAKE OUR OWN OPEN PHONE?**


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_41_0.png)


    **DOC SEARLS**


    **Let''s break up the cell-phone silos, for everybody''s good.**


    **I''m writing this** in the aftermath of the 2007 Consumer Electronics Show.
    I attend CES every year, because it''s always a treasure trove of interesting
    Linux stories and use cases (a few of which appear in the UpFront section of *LJ*
    this month), and also because it''s always fun to see what''s happening with a
