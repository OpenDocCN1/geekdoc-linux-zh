    \n## 适用于所有人的 Linux 防火墙\n\n你需要个人防火墙、企业互联网网关还是介于两者之间的东西？iptables 一应俱全！\n\nLinux\
    \ 内核包含了任何通用操作系统中最强大且灵活的防火墙代码之一。这段代码被称为 Netfilter，尽管我们大多数人通过其用户空间命令的名称 iptables\
    \ 来称呼它。Netfilter/iptables 允许你的 Linux 内核检查通过你系统的所有网络流量，并根据一套非常丰富的标准决定如何处理这些流量。\n\
    \n使用 iptables 构建 Linux 防火墙是一个很大的话题——甚至有人为此编写了整个书籍（参见资源部分）。事实上，防火墙工程本身就是一个职业（实际上是我的职业）。因此，很遗憾，没有人能在单本杂志文章中告诉你关于使用\
    \ iptables 构建防火墙所需知道的一切。\n\n不过，我可以提供 iptables 功能的概述、一些 Linux 防火墙设计的合理原则、关于构建不同类型\
    \ Linux 防火墙的实用工具的描述，以及指向更详细的 Linux 防火墙信息的指引。\n\n### Linux 防火墙的类型\n\n防火墙，或者更准确地说，包过滤，可以用于很多用途。它可以用于单个服务器和桌面系统的本地层面，以提供基于网络攻击的主机级保护。它可以用于网络基础设施层面，以保护整个网络免受其他网络的威胁，还可以用于以各种方式重定向甚至修改网络数据包。\n\
    \nLinux 防火墙可以是基于 Linux 的专用硬件设备、具有多个网络接口的 PC，甚至可以是普通的单接口工作站或服务器。许多商业防火墙设备都是基于 Linux/iptables\
    \ 的。与你可能认为的相反，如果部署在足够强大的硬件上，基于 PC 的 Linux 防火墙可以表现出相当好的性能并扩展得非常好。\n\n这是 Linux 防火墙采取的形态，它们在两个不同的角色中发挥作用。防火墙设备和多接口基于\
    \ PC 的防火墙被用作我所说的网络防火墙。它们作为专用的网络设备，逻辑上等同于调节不同网络之间流量的 IP 路由器。（从技术上讲，防火墙就是路由器；只是它们对路由内容的挑剔程度比普通路由器高得多。）网络防火墙通常还执行网络地址转换（NAT），通常是允许具有不可路由\
    \ IP 地址的主机与互联网通信。\n\n然后，还有我所说的本地防火墙——其主要功能根本不是防火墙，而是保护自身的主机的工作站或服务器。在我看来，任何连接到互联网的计算机，无论是服务器还是工作站，都应该运行本地防火墙策略。就\
    \ Linux 系统而言，我们没有理由不利用 Linux 内置的 Netfilter/iptables 功能。此外，这是最容易创建的防火墙脚本类型，正如我在本文后面所展示的那样。\n\
    \n### 防火墙设计原则\n\n在我们讨论 Linux 防火墙工具之前，我们应该介绍一些通用的防火墙设计原则。无论你是使用防火墙来保护单个主机还是整个网络，这些原则中的大多数（或应该如此）都是同样有效的。\n\
    \n- 首先，这里有一些术语：\n  - **包过滤**：检查单个网络数据包、将其与一组规则进行比较并相应处理的实践。\n  - **防火墙策略**：要么是一组特定的\
    \ iptables 命令，要么是你的 iptables 命令执行的高层级设计目标。\n  - **防火墙规则或包过滤规则**：防火墙策略的单独组成部分——即单个的\
    \ iptables 命令迭代。\n\n构建任何一组包过滤规则的第一步是确切地决定你希望防火墙做什么——也就是说，制定你的高层防火墙策略。例如，如果我为工作站创建一个本地防火墙脚本，我的逻辑策略可能看起来像这样：\n\
    \n1. 允许出站 DNS 查询、通过 HTTP 和 HTTPS 进行网页浏览、通过 IMAP 检索电子邮件，以及从本地系统到整个外部世界的出站 SSH 和出站\
    \ FTP 事务。\n2. 允许来自我地下室另一台工作站的入站 SSH 连接到该系统。\n3. 阻止其他所有流量。\n\n跳过这一步定义高层策略的关键步骤，就像在编写软件应用之前不先定义需求一样。你冒着浪费时间在不需要规则上的风险，并且可能遗漏了你需要的规则。\n\
    \n我进一步建议，无论你有什么样的政策，只要可行，就让它尽可能具有限制性。Marcus Ranum 多年前非常简练地阐述了防火墙设计的指导原则：“未被明确允许即禁止”。原因很简单；仅仅因为你想不到一个允许但不必要的网络事务如何被滥用，并不意味着某些攻击者不能滥用它。\n\
    \n因此，每个防火墙策略在逻辑上必须以阻止所有未在前面指定的内容的规则结束。\n\n这不仅适用于网络/企业防火墙策略，也适用于个人/本地防火墙策略。个人防火墙上常见的错误是允许所有“出站”事务，假设所有本地进程都是“可信的”。然而，如果你的系统感染了蠕虫、木马或病毒，这个假设就会崩塌。\n\
    \n在这种情况下，你很可能不希望恶意软件能够使用你的系统发送垃圾邮件、参与分布式拒绝服务攻击等。因此，最好不仅限制“入站”（源自外部）网络事务，还限制出站（源自内部/本地）事务，即使在桌面系统和服务器的本地防火墙策略中也是如此。\n\
    \n另一个重要的防火墙设计原则是，只要可能，就将相似的风险分组。换句话说，具有不同信任级别和不同风险暴露级别的系统和网络应该通过网络防火墙彼此隔离。\n\n\
    这一原则的经典示例是 DMZ 或非军事区，这是一个包含组织所有可访问互联网的系统的网络。图 1 显示了这样的 DMZ、包含组织工作组和其他非面向公众的网络资源的“内部”网络以及互联网之间的关系。\n\
    \n通过防火墙将 DMZ 网络与互联网和内部（可信）网络隔离开来，你可以编写规则，以非常细致的方式指定这三个区域中的主机如何相互交互。\n\n在制定此类规则时，你应该假设，由于暴露于通过互联网几乎无限范围的潜在攻击者，DMZ\
    \ 中的主机充其量应被视为半可信——也就是说，你应该假设 DMZ 中的任何主机在某个时刻都可能被妥协。\n\n因此，你应允许尽可能少的事务从 DMZ 发起至内部网络。\n\
    \n![图 1: DMZ 架构](img/3c4d8a97b5d96c835281dc0dacbc8551_36_0.png)\n\n你还应该考虑被妥协的\
    \ DMZ 主机可能对外部世界构成的威胁。例如，如果基于互联网的攻击者妥协了你的 DNS 服务器，即使攻击者潜入内部网络的尝试被防火墙规则阻止，如果该被妥协的服务器能够任意（即随心所欲地）连接到互联网上的其他系统，该攻击者仍可能给你的组织带来尴尬甚至法律问题。我无法强调得足够频繁或强烈：防火墙策略只应允许用户和系统完成工作所需的最基本的网络事务集合。不必要的数据流迟早会被滥用。\n\
    \n你可能注意到，在图 1 中，使用了两个防火墙。这是经典的防火墙夹心 DMZ 架构，但许多组织选择使用更经济的多宿主防火墙 DMZ 架构（图 2），在这种架构中，一个具有多个网络接口的单个防火墙互连并限制不同网络之间的流量。虽然三明治拓扑提供了对例如外部防火墙本身以某种方式被妥协（假设另一个防火墙不受完全相同漏洞影响）的更大保护，但单多宿主防火墙方法同样有效，只要你仔细编写规则即可。\n\
    \n![图 2: 多宿主防火墙 DMZ 架构](img/3c4d8a97b5d96c835281dc0dacbc8551_36_1.png)\n\n另外，无论你是使用单个多宿主防火墙还是一对防火墙，每个网络区域（内部、外部/互联网和\
    \ DMZ）都连接到防火墙上的专用物理网络接口这一点至关重要。是的，这确实使你的防火墙成为潜在的单一故障点。然而，如果一个网络区域中的主机可以不经过防火墙而将数据包路由到其他网络区域，那么你的防火墙将几乎没有实际价值！\n\
    \n我现在提到的最后一个通用防火墙设计原则仅适用于多接口防火墙（即不适用于本地/个人防火墙）：始终使用防环路规则。\n\n考虑图 1 中面向互联网的防火墙。它有两个网络接口：内部（面向\
    \ DMZ）和外部（面向互联网）。假设图 1 中的内部网络使用 C 类网络空间 192.168.55.0/24 中的 IP 地址，并且 DMZ\n\n"
