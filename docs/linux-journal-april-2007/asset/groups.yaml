    # ## Next Month


    # ### AJAX/WEB SERVICES


    Next month, we''ll have everything you need to help you graduate to Web 2.0, or
    for the more experienced, take Web 2.0 to the max. Haven''t got your feet wet
    yet? We''ll introduce you to the raw basics of Ajax in one article, and then take
    you deeper in another.


    Already swimming in the deep end? We''ll tell you about the new IDE Aptana, the
    development tool MochiKit, and get you working with four great Ajax plugins for
    Wordpress. And, wait until you get a glimpse of Zimbra, which takes Ajax to the
    max.


    As always, there''s much more. We''ll get you working with Single Packet Authorization
    in part two of our series on the topic and give you the lowdown on PostgreSQL.'
