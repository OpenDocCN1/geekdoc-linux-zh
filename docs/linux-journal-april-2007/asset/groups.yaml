    # # Levanta’s Intrepid X Linux Management Appliance


    The Levanta folks recently launched a new Linux management appliance, called Intrepid
    X. Targeted at “large Linux departments and data centers with high scalability
    and mission criticality requirements”, Intrepid X offers “on-demand functionality,
    disaster recovery, system portability, complete change control, unattended active/passive
    fail-over, and interoperability with iSCSI or Fibre-Channel SANs for RPM-based
    Linux environments.” Levanta says that customers who already preside over virtual
    storage and want to leverage their SANs to get the increased speed, portability,
    manageability and disaster recovery advantages found in Linux will benefit. The
    Intrepid X can be paired with different types of SAN storage, including products
    from EMC, HDS, IBM and others. In addition, one can manage Linux running in VMware
    virtual machines, as well as both physical and virtual environments from one interface.


    www.levanta.com


    # # The KDevelopment Team’s KDevelop


    The ambitious KDevelopment Team has released version 3.4 of KDevelop, a powerful,
    language-independent, user-friendly integrated development environment—that’s
    not just for programming KDE apps. Version 3.4 is the first new release in more
    than a year, closing more than 500 bugs and adding several new features. New features
    include improved Qt 4 support, new debugging capabilities, an enhanced default
    user interface layout, improvements for C++, and Ruby and PHP support. Official
    KDevelop packages are available for Kubuntu and OpenSUSE; unofficial builds also
    are available for other distros. One of our fellow Linux media outlets recently
    called KDevelop one of the top “killer apps” on the Linux platform.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_46_1.png)


    www.kdevelop.org


    # # Fluento’s Media Codecs for Open Source Systems


    The mellifluously named firm Fluento of Spain recently released proprietary codecs
    for Windows Media Player (audio, video, MMS streaming protocol), MPEG-2 and MPEG-4
    for the Linux and Solars desktop and server platforms. Fluento says that “agreements
    with Microsoft and MPEG LA” take the solution out of the legal limbo in which
    other codecs are entangled. Fluento’s codecs are closely integrated with the GStreamer
    multimedia framework, supporting applications such as Totem, Elisa, Jokosher,
    Rhythmbox and Banshee. Fluento will release further codecs during 2007; existing
    codecs are available for purchase from Fluento’s Web site.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_46_2.png)


    www.fluento.com


    # # Netfirms’ Business/Enterprise Web Hosting Accounts


    Although many Web hosting companies let you choose whether to host your Web site
    on Linux or Windows, Netfirms says it’s the first to unite the two platforms under
    the umbrella of a single account. With its Business and Enterprise lines of hosting
    accounts, Netfirms has Windows-based applications executed natively on a Windows
    Server 2003 grid and Linux-based applications natively on a Linux server grid.
    “The two platforms are unified through proprietary clustered technology,” says
    Netfirms, “allowing customers to manage both transparently through a single control.”
    The Netfirms multipartner server technology offers Windows-based functionality
    via the Microsoft Hosting Partner Program, including ASP.NET, Classic ASP and
    Microsoft SQL Server. On the Linux side, the full LAMP stack (Linux, Apache, MySQL
    and PHP) is available. The two lines encompass a wide range of hosting options
    depending on the client’s needs.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_46_3.png)


    www.netfirms.com'
