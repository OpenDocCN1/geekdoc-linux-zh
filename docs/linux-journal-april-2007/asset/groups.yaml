    Blu-ray already has more than a hundred movies in retail channels, so the PS3
    is also quite a capable HD video player.


    The Cell processor itself is a pretty amazing piece of hardware, sufficiently
    so that Terra Soft Solutions (Loveland, Colorado) has worked with Sony to create
    a PS3-based supercomputer center. Imagine, hundreds of rackmounted PS3 devices
    running complex weather simulations rather than WWII games. The Cell processor
    runs at speeds greater than 4GHz and can handle 256 billion calculations per second,
    with 2.5MB of memory on the chip itself, squeezed in with a processor design that
    uses 234 million transistors (www.ibm.com/developerworks/power/cell).


