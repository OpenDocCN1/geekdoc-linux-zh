    # Fedora Core 5 中 SELinux 的多类别安全性


    ## 如何设置和使用 SELinux 多类别安全性。


    **拉塞尔·科克（RUSSELL COKER）**


    Fedora Core 5 的发布为 SELinux 增加了多项新功能，其中之一是多类别安全性（MCS）。MCS 的目的是保护数据机密性，即防止机密数据被泄露，但它并非旨在防止系统被攻破。你在之前的
    Fedora 版本中可能熟悉的 SELinux 功能（称为域类型模型）仍用于保护系统完整性。MCS 是一项额外功能，用于防止机密数据被意外或故意泄露。


    早期版本的 SELinux 仅使用域类型模型进行访问控制。在域类型模型中，每个进程都有一个域，而每个进程可能访问的对象（文件、目录等）都有一个类型。系统维护一组规则，以指定每个域可以访问哪些类型以及应该具有哪种类型的访问权限。


    虽然域类型模型可用于实现系统完整性和数据机密性的所有控制（过去也曾这样使用过），但将完整性和机密性目标分离起来会使设计更加清晰。MCS 旨在保护数据机密性，从而允许策略中的域类型部分专注于保护系统完整性。MCS
    基于多级安全性（MLS）的一些设计特性。MLS 是为军事用途设计的，不适合大多数用户，因此本文不涉及它。


    过去，MLS 很少得到支持，因为它难以使用且成本高昂。MCS 是 Fedora Core 5 及以上版本的默认功能，因此会得到应用程序开发人员和系统管理员的良好支持。预计所有为
    Fedora Core 5 及以上版本编写的应用程序都将支持 MCS，并且在大多数情况下，MCS 支持也将允许这些应用程序支持 MLS。这意味着需要 MLS
    功能的组织将比在专有 UNIX 系统上有更多的应用程序选择。


    MCS 为每个安全上下文添加了一个敏感度标签（本文其余部分我将将其称为 MCS 标签）。安全上下文是进程或进程可能访问的资源（文件）的完整 SELinux
    标签。要访问文件，进程必须具有支配该文件 MCS 标签的 MCS 标签。MCS 标签由一组类别组成。进程可以具有两个级别的 MCS 标签，称为高级别和低级别；高级别具有低级别类别的超集。


    一个文件的 MCS 标签可能是 s0:c0,c10。s0 在 MCS 策略中没有任何含义，该字段由 MLS 策略使用，并且 MLS 和 MCS 使用相同的内核代码，因此格式无法更改。重要的部分是
    c0,c10，它表示从 c0 到 c10（含）的类别集合（, 字符表示类别范围）。在 Fedora Core 5 中，有 256 个编号从 c0 到 c255
    的类别。在 Fedora Core 6 中，将有 1,024 个编号从 c0 到 c1023 的类别。


    一个进程的 MCS 标签可能是 s0:c0,c100，这意味着标签（或范围）的低级别是 s0（无类别），高级别是 s0:c0,c100，这意味着从 c0 到
    c100 的所有类别。不相交的类别集合也是允许的。标签 s0:c3,c5 s0:c3,c5 s0:c0,c10,c20,c30 意味着低级别包含类别 c3
    和 c5，而高级别包含从 c0 到 c10（含）以及从 c20 到 c30（含）的类别。


    类别必须命名，预计大多数用户都会为所有使用的类别命名。在 Fedora Core 5 中，你必须编辑文件 /etc/selinux/targeted/setrans.conf
    来更改 MCS 标签的人类可读名称。以下是默认 setrans.conf 文件的一部分：


    ```

    # s0:c8=CompanyConfidential

    # s0:c1=PatientRecord

    # s0:c2=Unclassified

    # s0:c3=TopSecret

    # s0:c1,c3=CompanyConfidentialRedHat

    s0:

    s0-s0:c0,c255=SystemLow-SystemHigh

    s0:c0=SystemHigh

    ```


    此外，以下是使用 semanage 更改 Fedora Core 6 中 MCS 标签的人类可读翻译的示例：


    ```

    # semanage translation -a -T ProjectA s0:c8

    # semanage translation -l

    ```


    | 级别 | 翻译 |

    | :--- | :--- |

    | s0 | |

    | s0-s0:c0.c1023 | SystemLow-SystemHigh |

    | s0:c0 | ProjectA |

    | s0:c0.c1023 | SystemHigh |


    图 1 展示了针对 HR 和财务类别的所有组合，进程被授权访问文件的情况。


    MCS 的设计以易用性为主要关注点。目前，其设计仅控制文件访问。它还控制隐私（系统接口，如 strace、Tracer 和调试器），以防止非特权进程使用调试器从特权更高的进程中捕获机密数据。


    MCS 仅控制文件访问这一事实允许通过文件名发生信息泄露，并且协作进程可以使用 TCP、UDP、UNIX 域套接字或命名管道来传输数据。这是有意这样设计的，因为限制所有形式的进程间通信会破坏许多程序并使整个系统更难使用。MLS
    策略（在 Fedora Core 5 及以上版本中可用，但默认未启用）限制了此类通信方法，这是它被认为对大多数人来说太难使用的原因之一。


    在设计 MCS 时，我们决定不尝试阻止两个协作用户不当地共享数据。我们还决定不阻止用户读取具有机密数据的文件，然后将该数据写入具有较低机密性标签的文件。再次说明，MLS
    策略限制了这些操作，但它对大多数人来说太难使用。


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_62_0.png)


    MCS 和 MLS 旨在保护数据机密性；它们依靠域类型模型来保护系统完整性。FCS 附带三种策略。默认的是 targeted，它提供了与 FC4 中几乎相同的完整性保护，但增加了
    MCS 来保护数据机密性。下一个选项是 strict 策略，同样与 FC4 中的情况几乎相同，但增加了 MCS。最后，FCS 中有一种名为 mls 的新策略；顾名思义，它包括用于保护数据机密性的
    MLS 系统。mls 策略的域类型部分基于 strict 策略（虽然并非 strict 策略中的所有守护程序都受支持 - 仅支持 SPP 认证评估列表中的那些）。


    可以编译不支持 MLS 或 MCS 功能的 SELinux 策略，但到目前为止，还没有人选择这样做。这可以节省非常少的内存，并且仅值得为最小的嵌入式机器考虑。同样，也可以使用
    MLS 代替 targeted 策略中的 MCS，但没有人这样做，因为它不会带来太多好处。系统完整性是数据机密性的前提条件。因此，将 MLS 等强大的机密性保护系统与除最佳系统完整性保护以外的任何组合都没有好处。strict
    策略限制所有进程并显著限制其中大多数。这是充分利用 MLS 所需的完整性保护级别。


    在 MCS 中，进程具有一个范围。范围的高级别确定授予文件的访问权限，低级别确定创建文件的默认级别（范围仅适用于 MCS 中的进程）。


    要使一个 MCS 级别支配另一个级别，它必须拥有被支配 MCS 级别类别的超集。可能存在两个敏感度级别，其中没有一个支配另一个（例如，不相交的类别集合）。这被称为不可比较级别，读和写访问都将被拒绝。


    要使用 MCS，首先需要为用户分配敏感度级别。在之前版本的 SELinux 中，必须编辑策略源代码并重新编译策略以设置用户登录时分配的安全上下文，这既不方便又容易出错。FCS
    中 SELinux 的新功能之一是 semanage 策略管理工具。它支持更改用户的安全上下文（以及添加和删除用户），而无需编译策略。


    Fedora 的默认配置使用 targeted 策略，该策略在所有用户登录会话中都在 unconfined_t 域中运行（在域类型模型中没有访问限制），因此
    MCS 为用户提供唯一的 SELinux 访问控制。然而，Fedora Core 5 的默认安装需要在 MCS 正常工作之前应用更新。MCS 的开发在 Fedora
    Core 5 发布后才完成。


    配置使用 MCS 的 SELinux 系统时，必须做的第一件事是创建 SELinux 标识和登录记录，将它们映射到 UNIX 账户。


    清单 1 是使用 semanage 添加具有低级别 s0:c1（这意味着用户创建的每个文件默认具有类别 c1）和高级别 SystemHigh 的 SELinux
    标识 rjc 的示例。SystemHigh 映射到 s0:c0.c1023（在 Fedora Core 6 中是从 c0 到 c1023（含）的所有类别范围
    - MCS 访问的最高级别，在 Fedora Core 5 中是 s0:c0.c255）。-L 参数指定默认级别。使用 MCS 时，应始终将默认级别设为范围的低端，以避免混淆。-R
    选项独立于范围


