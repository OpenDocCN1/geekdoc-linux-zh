    \ processes traffic in terms of pre-routing, forwarding and post-routing. For\
    \ example, the following rule is one of many that precludes various attempts to\
    \ access the Web through DansGuardian. I have many such rules, and they’re more\
    \ specific (they specify the source IP address of various computers), but I’ll\
    \ list a simplified version of the obvious one:\n\n```\niptables -t nat -A PREROUTING\
    \ -i eth1 -p tcp --dport 80 -j REDIRECT --to-port 8080\n```\n\nBeyond the intuitive\
    \ knowledge of syntax, that’s almost an English expression. It says to redirect\
    \ the NAT traffic coming in through eth1 from port 80 to port 8080. If your kids\
    \ or employees are clever enough to try to access the Web through an external\
    \ proxy, simply redirect those ports to port 8080 too. You can use DansGuardian\
    \ to block most other attempts to sneak around this protection.\n\nOur article\
    \ “Starting a Linux Firewall from Scratch”, on page T80 should help you get started\
    \ with iptables. There are far more comprehensive iptables tutorials on the Web,\
    \ one being [iptables-tutorial.frozontuf.net/iptables-tutorial.html](http://iptables-tutorial.frozontuf.net/iptables-tutorial.html).\
    \ But most of them explore the complexities of iptables that only a security expert\
    \ would need. If your needs are light, like mine, don’t be afraid to explore iptables\
    \ and take a shot at writing your own rules. You’ll find iptables much more friendly\
    \ than you’ve ever imagined, and they’re indispensable as part of your security\
    \ framework.\n\n**Nicholas Petreley is Editor in Chief of Linux Journal and a\
    \ former programmer, teacher, analyst and consultant who has been working with\
    \ and writing about Linux for more than ten years.**\n"
