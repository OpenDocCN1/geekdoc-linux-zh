    ## 内部的 OpenSSH 协议


    OpenSSH 是什么以及为什么它无处不在的细枝末节详情。


    GRISH VENKATACHALAM


    有没有比 SSH 更常用于日常 Linux 计算的程序？我怀疑没有。它不仅坚固、安全且多功能，而且使用起来极其简单且功能丰富。由于其算法和协议都是最先进的，且其实现是开放供同行审查的，我们可以放心
    SSH 的密码完整性。然而，SSH 确实存在弱点，尽管其中大部分源于社会工程学，绕过如 X11 等损坏的协议也是一个巨大挑战。


    SSH 在几行 C 代码中就能创造奇迹——这要归功于 UNIX 哲学，即以通用方式将强大的工具串联起来。


    SSH 充当安全通道，使远程系统看起来像本地系统，使本地系统看起来像在远程端。它可以用于远程命令执行，无论是否使用 pty，也可以用于多路复用多个 TCP
    和 X11 会话。它还可以用于通过安全的 SSH 隧道隧道化不安全协议，如 POP3 或 SMTP。此外，它也可以用于以有限的条件安全地隧道 FTP。


    ## OpenSSH 架构


    让我们从整体方案开始。


    如图 1 所示，OpenSSH 由三个关键层组成。底层 ssh-transport 是参与所有加密操作的最关键组件，例如密钥交换、定期重新密钥化、以多种方式防御攻击等等。


    位于 ssh-userauth 之上的层，负责向服务器端运行的 sshd 守护进程认证最终用户。请记住，SSH 进行双向认证。客户端 SSH 程序使用 ssh-transport
    协议认证 sshd 服务器守护进程。认证完成后，密钥交换完成，并建立了安全连接。随后，用户认证发生。


    ssh-userauth 提供了很大的灵活性，因为用户可以通过多种方式向服务器认证——从智能卡上的私钥到简单的用户名/密码认证。一旦通过，ssh-connection
    层建立一个安全通道，用于执行远程命令或获取交互式登录 shell。


    ssh-connection 层能够通过在单一的 ssh-userauth 层及其下方的传输栈层上多路复用任意数量的同时独立安全会话，如图 1 所示。SSH
    的所有魔力——将任意 TCP 端口从本地到远程和从远程到本地转发，充当 SOCKS 代理，转发 X11 连接，建立 VPN 隧道，使用和不使用 pty 执行远程命令——都是通过
    ssh-connection 层完成的。


    SSH 在协议中内置了流量控制。每个安全通道分配了一个单独的大小窗口。由于 SSH 在可靠的 TCP 层之上运行，这并没有太多作用。至少，它不像 TCP 窗口机制那样关键。大多数关键的通道打开/关闭消息和其他终止消息不消耗任何窗口空间。


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_75_0.png)


    由于所有消息都经过加密和完整性保护，没有人可以解读这些消息。有一种特殊的 LMSG_IGNORE 消息类型，可用于默认应对流量分析攻击。这些是那种能发现数据何时在网络上传输以及传输了多少数据的攻击。


    当然，SSH 还附带了许多其他便利功能，如发送安全的 KEEPALIVE 消息，将 stdin 重定向到 /dev/null 用于专门的 X 窗口应用程序等。


    现在，让我们看一下一个典型的 SSH 会话和典型的消息交换（图 2）。


    这里是一个典型的未加密 SSH 数据包：


    | 字节 | 描述 | 类型 | 接收者通道 | 值 |

    | :--- | :--- | :--- | :--- | :--- |

    | 1 | 类型 | SSH_MSG_CHANNEL_REQUEST | | |

    | 4 | 接收者通道 | uint32 | | |

    | 1 | 请求类型 | string | "pty-req" | |

    | 1 | 需要回复 | boolean | | |

