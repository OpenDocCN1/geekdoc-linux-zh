    +   - Server to client initialization vector.

    +   - Client to server encryption key.

    +   - Server to client encryption key.

    +   - Client to server MAC key.

    +   - Server to client MAC key.


    The equations used for deriving the above vectors and keys are taken from RFC
    4253. In the following, the ∥ symbol stands for concatenation, K is encoded as
