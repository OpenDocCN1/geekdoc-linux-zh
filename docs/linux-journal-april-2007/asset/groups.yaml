    如果你使用口令，请在选择和保护口令时遵循常见的最佳实践（例如，参见 **www.usenix.com/security/passphrase**）。只要可能，我建议尽量使用公钥操作模式而不是口令模式。使用公钥模块时，请对密钥文件进行备份并将副本存储在物理安全的位置。如果你丢失了密钥文件，任何人都无法恢复你的数据。请勿在存储加密数据的同一介质上存储未受保护的口令副本或公钥文件。


    你可以自由选择通过 Linux 内核加密 API 提供的对称加密算法。eCryptfs 推荐将 AES-128 作为默认加密算法。如果你的机器上有硬件加速支持，并且内核加密
    API 中选择的加密算法支持该硬件加速，eCryptfs 的加密和解密操作将自动进行硬件加速。你应该采取措施确保敏感数据不以未加密形式写入二级存储。写入敏感临时数据的应用程序应配置为仅在
    eCryptfs 挂载点下写入。你还应使用 dm-crypt 随密密钥加密交换空间。详情超出了本文的范围，但设置命令的形式如下：


    ```

    # cryptsetup -c aes-cbc-plain -d /dev/random create \

    swap /dev/SWAPDEV

    # mkswap /dev/mapper/swap

    # swapon -p 1 /dev/mapper/swap

    ```


    SWAPDEV 是你机器上的交换块设备（如果不清楚当前用于交换的设备是哪个，请参阅 /etc/fstab 文件）。你可以创建简单的启动脚本来自动设置加密交换空间、运行
    encryptfsd 并执行 eCryptfs 挂载。有关编写启动脚本以及使用随密密钥通过 dm-crypt 加密交换空间的更多细节，请咨询你的发行版文档。


    请注意，当前版本的 eCryptfs 仅加密文件内容。关于文件的元数据——例如大小、名称、权限和扩展属性——所有有权访问底层文件系统的人都可以读取。eCryptfs
    的后续工作将包括对部分这些元数据进行加密或混淆。


    将块设备加密与 eCryptfs 结合使用可以结合两种机制提供的安全性，同时提供对单个加密底层文件进行无缝访问的灵活性，尽管这大致将数据加密和解密的处理开销增加了一倍。如果仅需保护二级存储上文件内容的机密性，eCryptfs
    本身在大多数情况下就足够了。


    ## 未来工作


    eCryptfs 被设计用于支持一系列高级密钥管理和策略功能。eCryptfs 的开发路线图包括每个文件多个密钥、根据不同创建文件的应用程序和文件写入位置为不同文件使用不同的密钥和加密算法、完整性强制以及更好地与现有密钥基础设施和密钥管理设备互操作性等功能。随着这些功能在未来版本的
    Linux 内核中实现，它们将变为可用。


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_59_0.png)


    纽约州立大学石溪分校（SUNY）文件系统和存储实验室（FSL）（**filesystems.org**）开发了一个名为 FiST 的堆叠文件系统框架。eCryptfs
    源自 FiST，它是 FiST 中实现的示例文件系统之一。Unionfs 是 SUNY FSL 编写的另一个流行的堆叠文件系统。


    ## 结论


    eCryptfs 是一个灵活的内核原生解决方案，在二级存储设备上通过密码学方式强制实施数据机密性。


    eCryptfs 可以以最小的努力部署在现有文件系统上。单个加密文件可以传输到其他运行 eCryptfs 的主机，并使用正确的密钥透明地访问。eCryptfs
    的密钥管理机制具有高度可扩展性。eCryptfs 适合作为强大且便捷的数据机密性执行组件，有助于保护在 Linux 环境中管理的数据。


