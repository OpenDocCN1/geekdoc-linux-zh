    \ data. When the storage devices fall into the wrong hands, attackers can access\
    \ the data directly, completely bypassing the access control mechanisms in place\
    \ in the organization's network. Reports indicate that millions of people already\
    \ have been affected by such compromises. As a result, customers and citizens\
    \ are at an increasing risk of identity fraud and loss of privacy.\n\nAlthough\
    \ the cryptographic technology to protect data confidentiality has existed for\
    \ decades, many organizations have failed to integrate this technology into their\
    \ processes for handling sensitive data. In cases where cryptography is included\
    \ in that process, it is frequently obtrusive, costly and complicated. Organizations\
    \ sometimes neglect to establish data encryption policies, and employees often\
    \ ignore such policies once they are in place.\n\nIn cases where employees attempt\
    \ to utilize cryptography, they often use it ineffectively. For instance, they\
    \ often select weak keys, and it is easy to save or transfer data inadvertently\
    \ in unencrypted form through insecure media (such as Web e-mail or a USB Flash\
    \ drive). Security strategies that depend on individual applications performing\
    \ their own encryption often fail when the user copies and pastes sensitive information\
    \ to other applications that do not have cryptographic capability.\n\nData encryption\
    \ needs to be made ubiquitous, transparent, flexible, easily deployable, integrated\
    \ into the data handling process and, of course, secure enough to counter sophisticated\
    \ attacks. These properties need to be in effect regardless of the particular\
    \ applications accessing the data. To make encryption services application-agnostic,\
    \ the operating system kernel itself should provide a system-wide data encryption\
    \ service for sensitive information written to secondary storage.\n\n### Popular\
    \ Cryptographic Filesystem Solutions\n\nPopular options exist for filesystem encryption\
    \ under Linux, all with various advantages and disadvantages. Device mapper crypt\
    \ (dm-crypt) ships with the Linux kernel and provides block device layer encryption.\
    \ Loop-AES and TrueCrypt, which must be obtained separately from the official\
    \ Linux kernel, also provide encryption at the block device layer. With block\
    \ device layer encryption, the user creates the filesystem on the block device,\
    \ and the encryption layer transparently encrypts the data before writing it to\
    \ the actual lower block device.\n\nThe main advantage of block device layer encryption\
    \ is that it is simple in concept and implementation. Another advantage of block\
    \ device layer encryption is that attackers learn nothing about the filesystem\
    \ unless they have the key; for instance, attackers will not even know the type\
    \ of filesystem or the directory structure. Sparse files can be securely and efficiently\
    \ supported in filesystems on encrypted block devices.\n\nBlock device encryption\
    \ can have disadvantages that stem from the lack of integration with the filesystem\
    \ itself:\n\n- A fixed region of storage must be pre-allocated for the entire\
    \ filesystem. Resizing the partition later is often an inconvenient process.\n\
    - It can be difficult to change encryption keys or ciphers.\n- There is no flexibility\
    \ for the block device encryption mechanism to encrypt different files with different\
    \ keys or ciphers.\n- Applications such as incremental backup utilities need access\
    \ to the unencrypted data.\n- All content in the filesystem incurs the overhead\
    \ of encryption and decryption, including data that does not require secrecy.\n\
    - Files must be re-encrypted with a user-space application before they are transmitted\
    \ through another medium.\n\nEncFS is a user-space cryptographic filesystem that\
    \ operates via FUSE. User-space filesystems are easier to implement than kernel-native\
    \ filesystems, and they have the advantage of being able to utilize user-space\
    \ libraries easily. This makes it simple to implement feature-rich filesystems\
    \ with less time and effort on the part of the developer. Unlike block device\
    \ encryption solutions, EncFS operates as an actual filesystem. EncFS encrypts\
    \ and decrypts individual files. Disadvantages of user-space filesystems based\
    \ on FUSE include performance overhead from frequent kernel/userspace context\
    \ switches and a current lack of support for shared writable memory mappings.\n\
    \n### eCryptfs\n\neCryptfs is a kernel-native stacked cryptographic filesystem\
    \ for Linux. Stacked filesystems layer on top of existing mounted filesystems\
    \ that are referred to as lower filesystems. eCryptfs is a stacked filesystem\
    \ that encrypts and decrypts the files as they are written to or read from the\
    \ lower filesystem.\n\nApplications in user space make filesystem system calls\
    \ that go through the kernel Virtual Filesystem (VFS). Both eCryptfs and the lower\
    \ filesystem (for example, ext3, JFS, NFS and so on) are registered in the kernel\
    \ VFS. The operations under the eCryptfs mountpoint first go to eCryptfs. eCryptfs\
    \ retrieves key material from the user session key ring and uses the kernel cryptographic\
    \ API to perform encryption and decryption of file contents. eCryptfs may make\
    \ key management requests with the user-space eCryptfs daemon (ecryptfsd). eCryptfs\
    \ reads and writes encrypted content stored in files in the lower filesystem (Figure\
    \ 1).\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_56_0.png)\n\n*Application file\
    \ operations go through eCryptfs, which communicates with the kernel Crypto API,\
    \ the kernel key ring and the user-space eCryptfs daemon to perform encryption\
    \ and decryption. eCryptfs manipulates files in lower filesystems, such as JFS\
    \ or ext3.*\n\neCryptfs aims to provide the flexibility of a Pretty Good Privacy\
    \ (PGP) application as a transparent kernel service. For that reason, the OpenPGP\
    \ (RFC 2440) specification inspires the basic key handling techniques in eCryptfs.\
    \ This includes the common procedure of using a hierarchy of keys when performing\
    \ cryptographic operations (Figure 2).\n\neCryptfs encrypts and decrypts individual\
    \ data extents in each file using a unique randomly generated File Encryption\
    \ Key (FEK). The FEK is encrypted with the File Encryption Key Encryption Key\
    \ (FEKEK), and the resulting Encrypted File Encryption Key (EFEK) is stored in\
    \ the header of each lower file.\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_56_1.png)\n\
    \n*The cryptographic metadata is in the header region of the encrypted lower file.\
    \ Users can transmit the lower file as is to other users, and the recipients can\
    \ access the decrypted contents of the file through eCryptfs, so long as they\
    \ have the proper key. This provides a high degree of flexibility in how the files\
    \ can be handled while maintaining strong security.*\n\n### Using eCryptfs\n\n\
    eCryptfs requires a kernel component and a user-space component. The kernel component\
    \ ships in the current mainline Linux kernel. See Listing 1 for the minimum kernel\
    \ options necessary to enable eCryptfs. By default, eCryptfs uses the AES cipher.\
    \ eCryptfs can use other ciphers available in the kernel if you build them.\n\n\
    **Listing 1. Kernel Options Needed for eCryptfs**\n\n```\nCode maturity level\
    \ options  --->\n[*]  Prompt for development and/or incomplete code/drivers\n\n\
    Security options  --->\n<*>  Enable access key retention support\n\nCryptographic\
    \ options  --->\n<*>  RMD digest algorithm\n<*>  AES cipher algorithms\n\nFile\
    \ systems  --->\nMiscellaneous filesystems  --->\n<*>  eCrypt filesystem layer\
    \ support  (EXPERIMENTAL)\n```\n\nNewer versions of the Linux kernel contain more\
    \ feature-rich versions of eCryptfs. For instance, Linux kernel version 2.6.19\
    \ is the first official kernel version that contains eCryptfs, and only passphrase\
    \ mode of operation is available at that kernel. At the time of this writing,\
    \ the development kernel branch version 2.6.20-mm contains public key support,\
    \ so that feature may be now available in more recent mainline kernel versions.\
    \ You can determine the features available in your kernel by loading the eCryptfs\
    \ module and viewing the contents of /sys/encryptfs/version_str under your sysfs\
    \ mountpoint.\n\nPopular Linux distributions carry the eCryptfs user-space packages;\
    \ follow the software package installation procedure for your distribution to\
    \ install the eCryptfs-utils package. If the eCryptfs user-space tools are not\
    \ yet available from your distribution, you can download, build and install the\
    \ source tarball. You can obtain the user-space components from the eCryptfs SourceForge\
    \ site (eCryptfs.sourceforge.net).\n\nIf eCryptfs is built as a kernel module,\
    \ you need to load the module:\n\n```bash\n# modprobe eCryptfs\n```\n\nAt this\
    \ point, you can begin using eCryptfs with whatever filesystem you are currently\
    \ using. To mount eCryptfs, specify the lower directory for the encrypted files\
    \ and the eCryptfs mountpoint for the decrypted view of the files:\n\n```bash\n\
    # mount -t eCryptfs /secret /secret\n```\n\nThe first path is the lower directory,\
    \ and the second path is the eCryptfs mountpoint. Note that the lower directory\
    \ and the mountpoint have the same path in this example. These paths can be different,\
    \ but I recommend doing a layer mount in order to help ensure that only eCryptfs\
    \ has access to the files in the lower filesystem. This command transforms the\
    \ given path from the lower directory into the eCryptfs mountpoint for the duration\
    \ of the mount.\n\nWhen performing a mount, the eCryptfs mount helper first attempts\
    \ to read in options from the eCryptfsFile.ini in the current user home directory,\
    \ and then it reads options provided via the command line. The mount helper interactively\
    \ prompts for any mandatory options that are not specified in the eCryptfsFile.ini\
    \ or the command line. For instance, you may be asked to choose a passphrase and\
    \ a cipher.\n\nOnce the mount has completed successfully, files written to the\
    \ /secret mountpoint will be encrypted transparently and written to the /secret\
    \ directory in the lower filesystem. Encrypted files that exist in the lower /secret\
    \ directory and that are able to be decrypted with the key specified at the time\
    \ of the mount will be accessible in their unencrypted form when read from the\
    \ /secret eCryptfs mountpoint.\n\nWhen you unmount eCryptfs and look in /secret,\
    \ you will see the encrypted lower files. You may first notice that the lower\
    \ files are larger than the files viewed under the eCryptfs mountpoint. The exact\
    \ size of the lower files depends on the page size of your host and on the amount\
    \ of data written. In general, the minimum lower file size is either 12KB or your\
    \ host page size plus 4KB, whichever is larger. This helps ensure page alignment\
    \ between the eCryptfs file and the lower file, which helps performance. The lower\
    \ file then grows in 4KB increments as data spills into new 4KB data extents.\n\
    \nThe extra space at the front of each lower file contains cryptographic metadata\
    \ about the file, such as attribute flags and an encrypted file encryption key.\
    \ Having this information in the file contents makes it convenient to transfer\
    \ or back up the files while preserving all the information necessary to access\
    \ the files later. However, the headers can take up a disproportionately large\
    \ amount of space if there are many small files. Newer releases of eCryptfs can\
    \ store the data in the extended attribute region instead, reducing the size of\
    \ the lower encrypted files; refer to eCryptfs on-line documentation at eCryptfs.sourceforge.net\
    \ (for more information on using this feature).\n\nIf your kernel has public key\
    \ support, you can utilize one of the eCryptfs key modules to manage your key.\
    \ You can check for support in the version of eCryptfs in your kernel by viewing\
    \ the contents of /sys/encryptfs/version_str under your sysfs mountpoint. If there\
    \ is support, you will see pubkey listed as one of the supported features.\n\n\
    Key modules can be selected and parameterized via mount options. If you want to\
    \ use the OpenSSL key module, you first need to generate a public/private key\
    \ pair to use in eCryptfs. To generate a key pair, do the following:\n\n- Run\
    \ eCryptfs-Manager.\n- Select menu option 3.\n- Select the openssl key module.\n\
    \nYou also need to run the eCryptfs daemon in order to manage kernel-user-space\
    \ communications; the daemon can be started simply by running the executable:\n\
    \n```bash\n# eCryptfsd\n```\n\nNote that running the daemon is not necessary if\
    \ you are using only the passphrase mode of operation. Then, assuming you created\
    \ your key in /usr/local/mykey.pem, you would mount with the following options:\n\
    \n```bash\n# mount -t eCryptfs \\\n  -o key=openssl:keyfile=/usr/local/mykey.pem\
    \ \\\n  /secret /secret\n```\n\nGiven these options, the eCryptfs mount helper\
    \ prompts you for a passphrase that protects the private key contained in the\
    \ key file. You can mount the same lower directory with many different combinations\
    \ of keys and ciphers (known as a mount context), and that particular context\
    \ will apply to any new files created under the mountpoint. For current versions\
    \ of eCryptfs, files created under any given mount context will be accessible\
    \ only when the mount is performed with that same context.\n\n### Notes on Security\n\
    \nAs with any filesystem, you should make regular backups of your data when using\
    \ eCryptfs. This is done easily and securely by unmounting\n"
  mdcn: "\n## eCryptfs：一个堆叠式加密文件系统\n\nLinux 内核中一个新的加密文件系统采用了堆叠技术。\n\n**MIKE HALCROW（迈克·哈尔克劳）**\n\
    \n媒体一直在报道来自政府和机构设施的丢失或被盗笔记本电脑、备份磁带、硬盘和服务器等设备的报告。这些设备通常包含医疗、金融和其他敏感数据。当存储设备落入错误的人手中时，攻击者可以直接访问数据，完全绕过组织网络中实施的访问控制机制。报告表明，数百万人已经受到此类安全泄露的影响。因此，客户和公民面临越来越大的身份欺诈和隐私丢失风险。\n\
    \n尽管保护数据机密性的加密技术已经存在了几十年，但许多组织未能将这项技术整合到其处理敏感数据的流程中。在加密被纳入该流程的情况下，它通常具有侵入性、成本高且复杂的特点。组织有时会忽视制定数据加密策略，而员工一旦这些策略制定到位，往往会忽略它们。\n\
    \n当员工尝试使用加密时，他们通常使用得无效。例如，他们经常选择弱密钥，并且很容易通过不安全的介质（如网络电子邮件或 USB 闪存盘）无意保存或传输未加密形式的数据。依赖单个应用程序自行执行加密的安全策略，当用户将敏感信息复制粘贴到不具备加密能力的其他应用程序时，往往失败。\n\
    \n数据加密需要成为普遍存在的、透明的、灵活的、易于部署的，并集成到数据处理流程中，当然，它必须足够安全以抵御复杂的攻击。无论访问数据的特定应用程序是什么，这些属性都需要生效。为了使加密服务与应用无关，操作系统内核本身应为写入二级存储的敏感信息提供系统级的数据加密服务。\n\
    \n### 流行的加密文件系统解决方案\n\nLinux 下有流行的文件系统加密选项，它们各有优缺点。设备映射加密（dm-crypt）随 Linux 内核附带，提供块设备层加密。Loop-AES\
    \ 和 TrueCrypt 必须从官方 Linux 内核单独获取，它们也在块设备层提供加密。在块设备层加密中，用户在块设备上创建文件系统，加密层在将数据写入实际下层块设备之前透明地加密数据。\n\
    \n块设备层加密的主要优点是概念和实现简单。块设备层加密的另一个优点是，除非攻击者拥有密钥，否则他们无法了解任何关于文件系统的信息；例如，攻击者甚至不知道文件系统的类型或目录结构。在加密块设备上的文件系统中，稀疏文件可以得到安全且高效的支持。\n\
    \n块设备加密可能存在源自于未与文件系统本身集成的缺点：\n\n- 必须预先为整个文件系统分配固定大小的存储区域。随后调整分区大小往往是一个不便的过程。\n\
    - 更改加密密钥或密码可能很困难。\n- 块设备加密机制缺乏灵活性，无法使用不同的密钥或密码加密不同的文件。\n- 诸如增量备份实用程序之类的应用程序需要访问未加密的数据。\n\
    - 文件系统中的所有内容都产生加密和解密的开销，包括不需要保密的数据。\n- 文件在通过另一种介质传输之前必须使用用户空间应用程序重新加密。\n\nEncFS\
    \ 是一个通过 FUSE 操作的用户空间加密文件系统。用户空间文件系统比内核原生文件系统更容易实现，并且具有易于利用用户空间库的优势。这使得开发者能够以更少的时间和精力实现功能丰富的文件系统。与块设备加密解决方案不同，EncFS\
    \ 作为一个实际的文件系统运行。EncFS 对单个文件进行加密和解密。基于 FUSE 的用户空间文件的缺点包括由于频繁的内核/用户空间上下文切换而产生的性能开销，以及目前不支持共享可写内存映射。\n\
    \n### eCryptfs\n\neCryptfs 是 Linux 的一个内核原生堆叠式加密文件系统。堆叠文件系统位于现有已挂载文件系统（称为下层文件系统）之上。eCryptfs\
    \ 是一个堆叠文件系统，它在文件写入下层文件系统或从中读取时对其进行加密和解密。\n\n用户空间中的应用通过内核虚拟文件系统（VFS）发起文件系统系统调用。eCryptfs\
    \ 和下层文件系统（例如 ext3、JFS、NFS 等）都注册在内核 VFS 中。在 eCryptfs 挂载点下的操作首先发送到 eCryptfs。eCryptfs\
    \ 从用户会话密钥环中检索密钥材料，并使用内核加密 API 执行文件内容的加密和解密。eCryptfs 可以向用户空间 eCryptfs 守护进程（ecryptfsd）发出密钥管理请求。eCryptfs\
    \ 读取和写入存储在下层文件系统文件中的加密内容（图 1）。\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_56_0.png)\n\
    \n*应用程序文件操作通过 eCryptfs，它通过与内核 Crypto API、内核密钥环和用户空间 eCryptfs 守护进程通信来执行加密和解密。eCryptfs\
    \ 操作下层文件系统（如 JFS 或 ext3）中的文件。*\n\neCryptfs 旨在将一种透明内核服务具备类似于 PGP（Pretty Good Privacy，良好隐私）应用程序的灵活性。为此，OpenPGP（RFC\
    \ 2440）规范启发了 eCryptfs 中的基本密钥处理技术。这包括执行加密操作时使用密钥层级的通用程序（图 2）。\n\neCryptfs 使用唯一随机生成的文件加密密钥（FEK）对每个文件中的单个数据扩展进行加密和解密。FEK\
    \ 使用文件加密密钥加密密钥（FEKEK）进行加密，结果生成的加密文件加密密钥（EFEK）存储在每个下层文件的头部中。\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_56_1.png)\n\
    \n*加密元数据位于加密下层文件的头部区域。用户可以原封不动地将下层文件传输给其他用户，只要他们拥有适当的密钥，接收者就可以通过 eCryptfs 访问文件的解密内容。这在保持强大安全性的同时，提供了文件处理方式的高度灵活性。*\n\
    \n### 使用 eCryptfs\n\neCryptfs 需要一个内核组件和一个用户空间组件。内核组件随当前主线 Linux 内核附带。请参考列表 1 了解启用\
    \ eCryptfs 所需的最小内核选项。默认情况下，eCryptfs 使用 AES 密码算法。如果你编译了内核中可用的其他密码算法，eCryptfs 可以使用它们。\n\
    \n**列表 1. eCryptfs 所需的内核选项**\n\n```\nCode maturity level options  --->\n[*]  Prompt\
    \ for development and/or incomplete code/drivers\n\nSecurity options  --->\n<*>\
    \  Enable access key retention support\n\nCryptographic options  --->\n<*>  RMD\
    \ digest algorithm\n<*>  AES cipher algorithms\n\nFile systems  --->\nMiscellaneous\
    \ filesystems  --->\n<*>  eCrypt filesystem layer support  (EXPERIMENTAL)\n```\n\
    \n较新版本的 Linux 内核包含功能更丰富的 eCryptfs 版本。例如，Linux 内核版本 2.6.19 是第一个包含 eCryptfs 的官方内核版本，而该内核仅支持口令模式操作。在本文写作时，开发内核分支版本\
    \ 2.6.20-mm 包含公钥支持，因此该功能可能在较新的主线内核版本中可用。你可以通过加载 eCryptfs 模块并查看 sysfs 挂载点下 /sys/encryptfs/version_str\
    \ 的内容来确定内核中可用的功能。\n\n流行的 Linux 发行版附带 eCryptfs 用户空间包；请遵循你的发行版的软件包安装程序来安装 eCryptfs-utils\
    \ 包。如果 eCryptfs 用户空间工具尚未在你的发行版中提供，你可以下载、构建并安装源码 tarball。你可以从 eCryptfs SourceForge\
    \ 站点（eCryptfs.sourceforge.net）获取用户空间组件。\n\n如果 eCryptfs 作为内核模块构建，你需要加载该模块：\n\n\
    ```bash\n# modprobe eCryptfs\n```\n\n此时，你可以开始使用 eCryptfs 配合你当前正在使用的任何文件系统。要挂载\
    \ eCryptfs，请指定加密文件的下层目录和 eCryptfs 挂载点（用于文件的解密视图）：\n\n```bash\n# mount -t eCryptfs\
    \ /secret /secret\n```\n\n第一个路径是下层目录，第二个路径是 eCryptfs 挂载点。注意，在此示例中，下层目录和挂载点具有相同的路径。这些路径可以不同，但我建议进行层挂载，以帮助确保只有\
    \ eCryptfs 可以访问下层文件系统文件中的文件。此命令在挂载期间将给定路径从下层目录转换为 eCryptfs 挂载点。\n\n执行挂载时，eCryptfs\
    \ 挂载帮助程序首先尝试从当前用户主目录中的 eCryptfsFile.ini 读取选项，然后读取通过命令行提供的选项。对于未在 eCryptfsFile.ini\
    \ 或命令行中指定的任何强制选项，挂载帮助程序会交互式提示用户输入。例如，你可能会被要求选择一个口令和一个密码算法。\n\n一旦挂载成功完成，写入 /secret\
    \ 挂载点的文件将被透明加密并写入下层文件系统中的 /secret 目录。存在于下层 /secret 目录中的加密文件，如果在挂载时指定的密钥能够解密，则在从\
    \ /secret eCryptfs 挂载点读取时将以未加密形式可访问。\n\n当你卸载 eCryptfs 并查看 /secret 时，你会看到加密的下层文件。你首先可能会注意到，下层文件比在\
    \ eCryptfs 挂载点下查看的文件更大。下层文件的确切大小取决于主机页面大小和写入的数据量。通常，最小下层文件大小为 12KB 或主机页面大小加 4KB，取较大者。这有助于确保\
    \ eCryptfs 文件和下层文件之间的页面对齐，从而提高性能。随着数据溢出到新的 4KB 数据扩展，下层文件会以 4KB 的增量增长。\n\n每个下层文件前端的额外空间包含有关文件的加密元数据，例如属性标志和加密的文件加密密钥。在文件内容中包含这些信息使得在保留稍后访问文件所需的所有信息的同时，转移或备份文件变得方便。然而，如果有很多小文件，头部可能会占用不成比例的大量空间。eCryptfs\
    \ 的较新版本可以将数据存储扩展到属性区域，从而减小下层加密文件的大小；请参阅 eCryptfs.sourceforge.net 上的 eCryptfs 在线文档（有关使用此功能的更多信息）。\n\
    \n如果你的内核支持公钥，你可以利用 eCryptfs 密钥模块之一来管理你的密钥。你可以通过查看 sysfs 挂载点下 /sys/encryptfs/version_str\
    \ 的内容来检查内核中 eCryptfs 版本的公钥支持情况。如果有支持，你会看到公钥列出的受支持功能之一。\n\n密钥模块可以通过挂载选项选择和参数化。如果你想使用\
    \ OpenSSL 密钥模块，首先需要生成要在 eCryptfs 中使用的公钥/私钥对。要生成密钥对，请执行以下操作：\n\n- 运行 eCryptfs-Manager。\n\
    - 选择菜单选项 3。\n- 选择 OpenSSL 密钥模块。\n\n你还需要运行 eCryptfs 守护进程来管理内核与用户空间之间的通信；只需运行可执行文件即可启动守护进程：\n\
    \n```bash\n# eCryptfsd\n```\n\n注意，如果你仅使用口令操作模式，则运行守护进程不是必需的。然后，假设你在 /usr/local/mykey.pem\
    \ 中创建了密钥，你将使用以下选项进行挂载：\n\n```bash\n# mount -t eCryptfs \\\n  -o key=openssl:keyfile=/usr/local/mykey.pem\
    \ \\\n  /secret /secret\n```\n\n给定这些选项，eCryptfs 挂载帮助程序会提示你输入一个保护密钥文件中包含的私钥的口令。你可以使用许多不同的密钥和密码组合（称为挂载上下文）挂载相同的下层目录，并且该特定上下文将应用于在挂载点下创建的任何新文件。对于当前版本的\
    \ eCryptfs，在任何给定挂载上下文下创建的文件仅在使用相同上下文进行挂载时才可访问。\n\n### 安全注意事项\n\n与任何文件系统一样，在使用\
    \ eCryptfs 时，你应该定期备份数据。这可以通过卸载来轻松且安全地完成\n\n"
