    # 安全性


    ```

    [2000334]

    desc=P2P (BitTorrent)

    priority=8

    url=/content//index.php?template=p2p

    disable=4

    max_enable=1

    actions=trap, email_log

    trigger-Detect::2000334.Detect::2000357.

    =>Detect::2000369

    ```


    这告诉 PackETFence：


    - BitTorrent 违规行为可以由 Snort 警报 2000334、2000357 和 2000369 生成（trigger 参数）。

    - 系统必须对该违规行为做出反应，方法是隔离用户、向管理员发送电子邮件警报并将违规记录到 /var/log/messages（actions 参数）。

    - 用户被允许重新启用网络访问一次（max_enable 参数）。


    最后，你需要通过在 confp.conf 中包含以下内容来从内部激活 PackETFence 中的 Snort：


    ```

    [trapping]

    detection=enabled


    [interface eth0]

    type=internal, managed, monitor

    ```


    并重启 PackETFence 服务。请注意，如果你使用交换机，你需要将网络流量的副本重定向到 eth0（即 PackETFence 监控接口——Snort
    用于监听数据包的接口）。在 PackETFence 中生成违规现在变得非常简单，只需启动你喜欢的 BitTorrent 客户端，例如 Azureus。做到这一点，打开一个
    torrent 文件以开始下载。一旦网络上交换了几个数据包，Snort 应该会捕获到其中一些，并与 2000334、2000357 或 2000369 规则匹配。这些规则来自
    Bleeding Edge Threats 规则集，分别对应 BitTorrent 对等同步、流量和通告。一旦 Snort 记录了这种异常活动，PackETFence
    就会通过创建违规来做出反应。


    作为管理员，你可以使用以下命令查看违规列表：


    ```

    /usr/local/pt/bin/pfncd violation view all

    ```


    作为用户，在你的计算机上，启动你喜欢的 Web 浏览器并尝试打开任何外部网站。你会被重定向到


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_69_0.png)


    PackETFence 系统会自动显示点对点（peer-to-peer）模板，如 figure 2 所示。


    停止 BitTorrent 客户端可以让重新获得网络访问权限。现在，尝试第二次使用 BitTorrent。和之前一样，会生成警报，你的浏览器会被重定向到 PackETFence
    门户。但这次，你不会再有机会重新启用你的访问权限。在现实生活中，违规用户将不得不联系其网络管理员以重新启用网络访问。


    要激活 Nessus 对尝试注册 PackETFence 的主机的扫描，请将以下部分添加到 /usr/local/pf/conf/p.conf：


    ```

    [scan]

    s11=enabled

    pass=<nessus_passwd>

    user=<nessus_user>

    port=1241

    host=127.0.0.1

    registration=enabled

    ```


    并重启 PackETFence 服务。尝试添加一台运行未修补版本 Microsoft Windows 的计算机现在会立即生成违规。你还可以使用管理 Web
    GUI（Scan 选项卡）来定义每晚应执行完整的 Nessus 扫描。


    # 结论


    在您的网络中部署具有基于 ARP 隔离功能的 PackETFence 非常简单。虽然这种隔离技术部署容易，但它不一定具有良好的可扩展性，并且可能被具有静态
    ARP 缓存条目的熟练用户绕过。


    PackETFence 中还存在其他隔离技术，例如 DHCP/DNS，它们具有良好的可扩展性。在 Inverse，我们还为 PackETFence 添加了基于
    VLAN 的隔离，这使得该解决方案更安全，并使其对大型网络更具吸引力。PackETFence 是保护校园网络或甚至网络一部分（VLAN 或子网）的理想解决方案。最后，一个高质量的
    NAC 解决方案已从自由开源软件（FOSS）社区中涌现，PackETFence 的演进前景光明。


