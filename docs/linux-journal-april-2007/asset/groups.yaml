    \ MTU 发现等。因此，假设我们是明智的管理员，让我们允许 ICMP 报文通过防火墙：\n\n```bash\necho \"Allowing ICMP\
    \ packets\"\n/sbin/iptables -A FORWARD -p ICMP -j ACCEPT\n```\n\n之前，我们阻止了发往防火墙盒子以及从防火墙盒子发出的任何报文（使用\
