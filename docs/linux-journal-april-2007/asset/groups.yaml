  - '[PAGE 43]


    # Still, whether or not Jobs is bogus on the subject of apps and networks, he
    clearly wants to keep the iPhone closed from outside developers.


    (and its contributions are not trivial), the company always has played closed
    games with customers and developers. The original Macintosh was so closed to customers
    that opening it required a long-shaft torx screwdriver and a special case squarer.
    And, developers have rarely had much choice other than to work exclusively in
    Apple''s development environments.


    Now, in the case of the iPhone, there won''t be a development environment. Apparently,
    I do know a number of people who think Apple is just stalling at this point, because
    the phone isn''t due out until June, and it isn''t in a position yet to produce
    an SDK. But, even if that''s the case, the facts on the face of this thing make
    one thing very clear: Apple isn''t going to bust any phone-maker/carrier silos.
    On the contrary, it''s going to build a new silo of its own with Cingular—the
    carrier with which it signed an exclusive partnership deal. So, it''s just another
    jail with a prettier lock.


    Now, what to do?


    A hint came in the form of a story in the *New York Times*, about how passengers
    in Japan use cell phones to speed check-in at airports. The airline ANA is using
    a system called skip in Japan and is working with Star Alliance partners (which
    include United, Lufthansa, and British Airways) on extending the service, which
    does away with paper boarding passes. What''s interesting about this isn''t the
    system, but the fact that airlines use it for relating directly to customers,
    regardless of phone-maker or cell system carrier. In other words, it''s not about
    a deal between ANA and Nokia/Verizon or Motorola/Sprint. It''s a way for ANA to
    relate directly with customers.


    This hint encourages development of apps that disintermediate phone-makers and
    pipe-controllers for putting customers and vendors into direct contact, to the
    good of everybody involved.


    Cell phones are much more personal than computers. In fact, they may be the most
    personal technology ever created—as well as the most social. Why should the market
    benefits of cell phones'' personal and social powers be restricted to phone-maker/carrier
    silo partners? In the long run, they can''t. There are simply too many benefits
    for too many businesses—as well as customers—once these silos open up.


    Can we get a sense of how many more market categories there can be, and how much
    more business will grow around cell phones, once the silos open up? Yes—by looking
    at vertical market examples. A good one is the university-student cell-phone market.
    Here, a company called Rave Wireless (disclosure: I consult them) works with universities
    to replace their once-located-or now-dead airline phone business with their own
    cell systems. The phones might be made by Nokia (or anybody) and the carrier might
    be Cingular (or anybody), but the system is independent of both. Instead, it exists
    for the purpose of serving relationships within the university community—between
    teachers and students, students and each other, students and local businesses,
    sports teams


    and fans. Rave not only provides a raft of handy (even essential) applications
    for its phone users, but it also provides a platform where students (or anybody
    using Rave phones) can write their own applications.


    Students can form "entourage"s of groups around classes, fraternities, dorm floors
    or whatever social collections they like. Teachers can text students with schedule
    changes. Students can text local businesses to see, for example, which pizza parlor
    can set a table for nine right after a game is over. They can check bus schedules
    or use built-in GPS monitoring when sending an emergency message to campus police.
    The list of applications developed by both Rave and students is long and growing.
    This is made possible not only by Rave''s entrepreneurial starts, but by freedom
    from restrictions imposed by the customary phone-maker/carrier silo agreements
    as well.


    Rave can drive system-opening deals with both phone-makers and carriers, because
    it comes to both with a large base of ready customers. It turns out that phone-makers
    will make a custom phone if the order is big enough. And, it also turns out that
    carriers will open their systems for the same reason. Both still make money—but
    not just with each other and their co-captive customers. Instead, they open a
    whole new market ecosystem that gets bigger for everybody.


    I normally avoid writing about companies I consult, but the example Rave Wireless
    provides is too important to overlook. And, I''m not hawking them. Instead, I''m
    hawking something Rave''s example encourages us to think about: an open-phone
    marketplace, populated by rapidly evolving and differentiating phone gear—with
    a proliferation of applications on run on it and services to support it. In the
    long run, that''s where we''re headed anyway. So, I''ll like us to shorten the
    distance.


    Where can we start? One place is with phones. I''m familiar with two open Linux-based
    phone platforms: Trolltech''s Greenphone and the OpenMoko (profiled in the February
    2007 issue of *Linux Journal*). There can be many more, including gear from the
    familiar makers.


    But, let''s go beyond that. Let''s find whole communities that already exist and
    could relate much better with cell phones equipped with community- and commerce-supporting
    applications. These could be locations (towns, for example), professions (firemen,
    teachers, educators, health-care or service workers) or organizations (professional
    or lifestyle associations, unions, political parties). Or, hey, how about Free
    Software and Open Source Development communities? And why not?


    We not only have strength in numbers, we have the power to produce a plethora
    of useful applications. (Try saying that fast!)


    Again, it''s going to happen anyway. Won''t it be a lot more fun to *make* it
    happen? And, isn''t that what we''re about?


    Doc Searls is Senior Editor of *Linux Journal*. He is also a Visiting Scholar
    at the University of California at Santa Barbara and a Fellow with the Berkman
    Center for Internet and Society at Harvard University.'
