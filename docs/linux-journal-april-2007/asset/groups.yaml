    \n# 不要忘记人们获取的内容\n\n> 强大的 iptables 足够直观，即使懒惰的极客也能编写自己的规则。\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_97_0.png)\n\
    \nNick Petreley, 编辑主任\n\n让我们来谈谈如何保护你的网络免受人们获取内容的影响。我将走一条弯路来达到这个目的，请跟我一起。\n\n我撰写了一份长篇报告，发布在\
    \ [www.theregister.co.uk/security/ security_report_windows_vs_linux](http://www.theregister.co.uk/security/security_report_windows_vs_linux)，你可能想要阅读一下。允许我有两点免责声明。该报告比较老旧，日期为\
    \ 2004 年 10 月。请不要因文中那些我从未回头修复的小编辑错误给我发邮件。它们不影响报告的核心论点。\n\n无论如何，我希望你阅读了整份报告，但我主要引用它来阐明一个观点。2004\
    \ 年夏季的 Evans Data Linux 开发人员调查显示，78% 的 Linux 开发人员从未遭遇过 Linux 机器被入侵的情况。Evans 的调查没有探讨极少数确实发生的\
    \ Linux 事件的性质。例如，有些可能是 Apache 蠕虫的受害者。Apache 运行在 Linux 和 Windows 上，因此这些事件并非 Linux\
    \ 独有。更重要的是，多年前流传的那个 Apache 蠕虫在 Windows 上造成的破坏可能比在 Linux 上大得多。\n\n这是有原因的。不需要火箭科学家也能看出，Windows\
    \ 比 Linux 更容易遭受严重的安全漏洞攻击。Vista 不会改善这一情况。微软似乎更专注于防止用户绕过 DRM 限制，而不是防止黑客入侵 Windows。\n\
    \n你通常只需将 Windows 和 Linux 用户放置在支持 NAT 的路由器后面，就可以保护他们免受外部攻击。基于 Linux 的路由器甚至便宜的现成盒子通常都可以胜任。问题在于，许多安全漏洞并非由于传入的攻击引起，而是因为人们获取了染病的网页、下载了受感染的软件或获取了其他许多嵌入代码的文件类型，这些代码利用了\
    \ Windows 中允许用户提升权限并完全攻陷整个 Windows 机器的大量漏洞。如果每个人都使用 Linux，这可能不是一个很大的问题。但并非每个人都使用\
    \ Linux。我的孩子使用 Linux，但他们也使用 Windows。但这不仅是一个家庭问题。你可能负责一个员工运行 Windows 的网络。\n\n以下是我为保护孩子所做的事。首先，我费尽心思将他们的网络浏览限制在\
    \ Firefox，将电子邮件往来限制在 Thunderbird。这避免了常见的 IE 和 Outlook 漏洞。其次，尽管他们通过无线 NAT 启用的路由器访问互联网，但该路由器连接到一个\
    \ Linux 服务器，该服务器在将流量传递到互联网之前检查和过滤通过的内容。我使用 Linuxbox 配合 DansGuardian 来阻止内容。我使用\
    \ MIME 过滤器以防止潜在危险的电子邮件附件进入。但是，致命一击（coup de grâce）是我可以使用 iptables 做的事情。\n\n在我继续之前，让我补充一点背景。我从不认为自己有足够的能力成为\
    \ Linux 内核开发人员，但我确实向内核贡献过几行代码，并且我修补过自己的内核以解决诸如顽固的 ASUS 主板拒绝关机之类的问题（该补丁太粗糙，不值得纳入内核，但它对我有效）。我还以各种语言向\
    \ Xoops、Lphoto 等项目贡献过代码。我的意思是，我不仅是一名编辑；我还是一名程序员和无可救药的极客。\n\n然而，我是一名懒惰的极客。我宁愿依赖\
    \ GUI 程序来生成防火墙规则，也不愿意自己编写。但 iptables 已经变得如此直观，即使懒惰的极客也能编写自己的规则。我只需要理解 iptables\
    \ 如何以预路由、转发和后路由来处理流量。例如，以下规则是阻止通过各种尝试通过 DansGuardian 访问网络的众多规则之一。我有许多这样的规则，它们更具体（它们指定了各种计算机的源\
    \ IP 地址），但我会列出一个简化版本，这是显而易见的：\n\n```\niptables -t nat -A PREROUTING -i eth1 -p\
    \ tcp --dport 80 -j REDIRECT --to-port 8080\n```\n\n除了对语法的直观了解外，这几乎就是一个英语表达。它表示将通过\
    \ eth1 进入的 NAT 流量从端口 80 重定向到端口 8080。如果你的孩子或员工足够聪明，试图通过外部代理访问网络，只需将这些端口也重定向到端口\
    \ 8080。你可以使用 DansGuardian 来阻止其他大多数试图绕过此保护的行为。\n\n我们第 T80 页的文章“从零开始搭建 Linux 防火墙”应该有助于你开始使用\
    \ iptables。网上有更全面的 iptables 教程，其中之一是 [iptables-tutorial.frozontuf.net/iptables-tutorial.html](http://iptables-tutorial.frozontuf.net/iptables-tutorial.html)。但其中大多数都探讨了只有安全专家才需要的\
    \ iptables 复杂性。如果你的需求较轻，像我一样，不要害怕探索 iptables 并尝试编写自己的规则。你会发现 iptables 比你想象的要友好得多，并且它们是你安全框架中不可或缺的一部分。\n\
    \n**Nicholas Petreley 是 Linux Journal 的编辑主任，也是一名前程序员、教师、分析师和顾问，从事 Linux 工作和写作已超过十年。**\n\
    \n"
