    limits most of them. This is the level of integrity protection that is needed
    to take full advantage of MLS.


    In MCS, a process has a range. The high level of the range determines the access
    granted to files, and the low level determines the default level of files that
    are created (ranges apply only to processes in MCS).


    For an MCS level to dominate another, it must have a set of categories that is
    a superset of the MCS level that is being dominated. It is possible to have two
    sensitivity levels for which neither dominates the other (for example, disjoint
    sets of categories). This is referred to as incomparable levels, and both read
    and write access will be denied.


    To use MCS, first you need to assign sensitivity levels to users. In previous
    releases of SELinux, it was necessary to edit the policy source and recompile
    the policy to set the security context that is assigned to users when they log
    in, which was inconvenient and error-prone. One of the new SELinux features in
    FCS is the semanage policy management tool. This supports changing the security
    contexts of users (and adding and removing users) without compiling the policy.


    The default configuration of Fedora has the targeted policy that runs all user
    login sessions in the unconfined_t domain (no access restrictions in the domain-type
    model), so MCS provides the only SELinux access controls for users. However, a
    default install of Fedora Core 5 needs to have updates applied before MCS will
    work correctly. The development of MCS was not complete until after the release
    of Fedora Core 5.


    The first thing you must do when configuring an SELinux system to use MCS is create
    SELinux identities and login records to map them to UNIX accounts.


    Listing 1 is an example of using semanage to add the SELinux identity rjc with
    a low level of s0:c1 (which means every file the user creates will have category
    c1 by default) and a high level of SystemHigh, which maps to s0:c0.c1023 (the
    range of all categories from c0 to c1023 inclusive - the highest level of MCS
    access) in Fedora Core 6 and to s0:c0.c255 in Fedora Core 5. The -L parameter
    specifies the default level. When using MCS, you always should make the default
    level the low end of the range to avoid confusion. The -R option is separate from
