    \ \"Enabling IP forwarding\"\n    echo \"1\" > /proc/sys/net/ipv4/ip_forward`\n\
    ```\n\nEarlier, we said the firewall also should act as a proxy for ARP requests.\
    \ This means the firewall will reply to the ARP requests querying for the Ethernet\
    \ address of any machines in your network (192.168.9.0/24). Will the firewall\
    \ send the MAC address of the machine for which the query was broadcasted (say\
    \ 192.168.9.8)? No. Instead, it will send its own MAC address, and later, when\
    \ it receives a packet for 192.168.9.8, it will forward the packet to 192.168.9.8\
    \ (of course, only if the rules allow the packet to pass through). Enabling proxy\
    \ ARP is quite easy in new distributions:\n\n```\n`echo \"Enabling Proxy ARP\"\
    \n    echo \"1\" > /proc/sys/net/ipv4/conf/eth1/proxy_arp`\n```\n\nNext, set up\
    \ the routing entries in the firewall. The private network is reachable through\
