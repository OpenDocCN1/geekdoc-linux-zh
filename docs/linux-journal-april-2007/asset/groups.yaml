    +   - Initial IV client to server: HASH(K ∥ H ∥ \"A\" ∥ session_id).

    +   - Initial IV server to client: HASH(K ∥ H ∥ \"B\" ∥ session_id).

    +   - Encryption key client to server: HASH(K ∥ H ∥ \"C\" ∥ session_id).

    +   - Encryption key server to client: HASH(K ∥ H ∥ \"D\" ∥ session_id).

    +   - Integrity key client to server: HASH(K ∥ H ∥ \"E\" ∥ session_id).

    +   - Integrity key server to client: HASH(K ∥ H ∥ \"F\" ∥ session_id).


    Simple, right?

    What is not simple, however, is figuring out the K and H parameters.

    HASH is usually a SHA1 hash mechanism, but it can be something else as well.

    The typical cipher algorithm used is AES or DES3 in CBC mode.

    The MAC is a combination of MD5 or the SHA1 hash algorithm with a secret key.
    There are four choices here:


    +   - hmac-sha1

    +   - hmac-md5

    +   - hmac-sha1-96

    +   - hmac-md5-96


    Actually, sha1 is a little weak in today’s world, because collision attacks are
    possible. The zeitgeist in hashing today is sha512, but with proper re-keying
    and other smart bits built in, it should not be a problem.

    Remember that hashes are of a constant length, so hmac-sha1 is 20 bytes long,
    hmac-md5 is 16 bytes, and the other two have a fixed length of 12 bytes each.


    Okay, now for some mathematical and crypto gymnastics of the key stage.

    We know how to compute the individual encryption and MAC keys provided that we
    derive the basic parameters using the simple equation above. But, how do we get
    the parameters to begin with, in a secure, authenticated manner?

    Now, we need to look at how OpenSSH uses diffie-hellman-group14 and diffie-hellman-group1
    fields to derive the DH generator and DH moduli for an anonymous key agreement.
    However, this leaves us open to several man-in-the-middle and other active attacks.

    To thwart this, we use a known and trusted server public key to authenticate key
    exchanges. Authentication of key exchange data is nothing more than signing with
    a private key. And, OpenSSH typically uses ssh-dsa or ssh-rsa keys for this purpose.

    In other words, a combination of DH and RSA/DSA keys are used for authentication
    and to derive the secret parameters K, H and session_id. session_id is simply
    the hash of the first key exchange. A 16-byte random cookie also is used to protect
    against replay and other man-in-the-middle attacks.


    Here is the equation for deriving H:

    H = hash(V_C ∥ V_S ∥ I_C ∣ I_S ∣ K_S ∣ e ∥ f ∥ K)


    +   - hash is usually the SHA1 hash algorithm.

    +   - V_C and V_S are the client and server identification strings.

    +   - I_C and I_S are the client and server SSH_MSG_KEXINIT messages just exchanged.


    Now, we are left with computing e, f and K; e and f are the DH parameters used
    for exponentiation:


    +   - e = g^x modulo p

    +   - f = g^y modulo p

    +   - K = e^y modulo p


    Here, p is a prime number from the DH generator field. And, x and y are chosen
    arbitrarily by client and server. Remember that DH works using the simple mathematical
    principle that ab^x = ab^y = ab^2.

    Now, we have everything required for computing the secret keys.

    The nice thing about all of these cryptographic parameters is that they are thrown
    away after every session. The only reused parameter is the server RSA/DSA key,
    but because we add a random cookie in our calculations, it’s difficult for attackers
    to break SSH cryptographically.


