    \ work.\n\nYes, this is arguable, but I’d like to reference something else in\
    \ your magazine, page 14, \"They Said It\" (February 2007), the third quotation,\
    \ “Coding up the simplest thing…”\n\nOver time, I’ve learned that as “The next\
    \ guy\", trying to read and understand code written by “the guy before me”, that\
    \ breaking a sequence of steps like this down into the constituent parts makes\
    \ maintainability and supportability significantly easier.\n\nWhile the original\
    \ state is “easy enough” to work with, especially for a demonstration, in the\
    \ work place, we should encourage everyone to remember “the next guy” (and there\
    \ will always be a next guy) when we write scripts.\n\nI would, in an environment\
    \ where this might be used by someone else and not run every five minutes, rewrite\
    \ this script with these additions:\n\n```\n# Comment this line out for debugging.\n\
    trap '/bin/rm -f $tmp1 $tmp2 $tmp3 $tmp4' EXIT\n```\n\n```\ntmp1=/tmp/tmp.1.5\n\
    tmp2=/tmp/tmp.2.5\ntmp3=/tmp/tmp.3.5\ntmp4=/tmp/tmp.4.5\n```\n\n```\ngrep 'google.com/search'\
    \ $ACCESSLOG | \\ \nawk '{print $11}' > $tmp1\n```\n\n```\n< $tmp1 cut -d':' -f2\
    \ | cut -d':' -f1\n> $tmp2\nsed 's/\\*/ /g;s/N\\*/2/g;s/q//s//`' < $tmp2\n> $tmp3\n\
    ```\n\n```\nsort $tmp3 | uniq -c > $tmp4\nsort -rn $tmp4 | head -5\n```\n\nYes,\
    \ this seems wasteful. (I mention the five minutes above to point out that if\
    \ run more than, say every half hour on a moderately busy box, the methods may\
