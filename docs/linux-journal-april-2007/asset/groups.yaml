    \n# 总有一天别人可能要 decipher（破译）你的代码\n\n我此前已经对 Dave Taylor 的专栏发表过评论，你知道我支持他开设此专栏及其教学价值。我的评论并非针对该专栏的批评，而是希望被视为对其的补充。\n\
    \n将一整个操作序列放在“一行”上（通过管道连接在一起）的冲动是高尚的，并且当人们“赶时间”或做“快速粗糙”的工作时是可以理解的。但这对于初学者或“半生产”工作来说并不是最明智的选择。\n\
