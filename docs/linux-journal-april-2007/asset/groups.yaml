    \ Tablet by Lenovo\n- 12.1\" SXGA+ w/ Xg@1400x1050\n- 1667–1833 MHz Core Duo\n\
    - 1–4 GB RAM\n- 80–120 GB hard drive\n- 4 pounds\n- Pen/stylus input to screen\n\
    - Dynamic screen rotation\n- Handwriting recognition\n- X60s laptops available\n\
    - Starts at $2300\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_32_3.png)\n\nwww.EmperorLinux.com\
    \ 1-888-651-6686\n\n# Displaying Image Directories in Apache\n\nStep one toward\
    \ a shell script for Web-based image management.\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_33_0.png)\n\
    \nDAVE TAYLOR\n\nTo be perfectly candid, the directory listings that are generated\
    \ by Apache and other Web servers stink.\n\nMost of the time when I write shell\
    \ scripts, it's to solve what I consider a lightweight problem. Yes, I admit it,\
    \ if you need to forecast weather, geomap 50,000 data points or create an on-line\
    \ shopping cart, a shell script is probably not the optimal tool!\n\nNonetheless,\
    \ when I encounter problems or opportunities for simplification in my daily work,\
    \ the first tool out of the box is a shell script. For some of you, it might be\
    \ Perl or some fancy PHP coding, but because anyone who can type commands on the\
    \ Linux command line is ready to start scripting, I have to say I still believe\
    \ shell scripts are a good starting point.\n\nWhat's surprising is just how much\
    \ you can accomplish in a short segment, and this month I share a script I cobbled\
    \ together to address what might be a common problem on your Web server toa—a\
    \ huge \"Images\" directory.\n\n## Apache Directory Listings\n\nTo be perfectly\
    \ candid, the directory listings that are generated by Apache and other Web servers\
    \ stink. They're basically `ls -l` with no additional information, no previews,\
    \ nothing. Most of the time it doesn't really matter, because most of your site\
    \ is probably seamless, and people aren't exposed to the back end.\n\nBut, the\
    \ directory where you might collect all the images, graphics and photos on your\
    \ site is most likely a different story. Whether it's called \"Images\", \"Graphics\"\
    , \"Photos\", \"Art\" or what have you, odds are that your directory is like my\
    \ own: 1,400 graphics files.\n\nA text-based listing capability is useful if the\
    \ files have highly mnemonic names, but wouldn't it be far more useful to have\
    \ thumbnails of all the images shown along with their names, rather than only\
    \ file size and last-modified dates?\n\nThat's what this script does, and like\
    \ all scripts that are actually working as CGI scripts, it has to start out by\
    \ pushing the appropriate header information immediately:\n\n```sh\n#!/bin/sh\n\
    \necho \"Content-type: text/html\"\necho \"\"\n```\n\nNow that's out of the way,\
    \ the rest of the content can be generated in a loop. In fact, the first skeletal\
    \ version of the script just duplicates the file listing capability already in\
    \ your Web server:\n\n```sh\nfor name in *\ndo\n    echo \"$name <br>\"\ndone\n\
    ```\n\nOf course, this output isn't all that interesting. At a minimum, you can\
    \ change it so that the filenames are clickable:\n\n```html\necho \"<a href=$name>$name</a><br>\"\
    \n```\n\nBut, even that's not particularly interesting. Let's add some conditional\
    \ code so that images are displayed while everything else just garners a link.\
    \ Rather than testing the filename though, let's do something more interesting\
    \ and use the unsung command `file`.\n\nWhen you're running across the contents\
    \ of a typical image directory, here's the kind of output you can expect:\n\n\
    ```text\n$ file *\n\naol-safety-menu.png:       PNG image data, 161 x 230, 8-bit/color\
    \ RGB, non-interlaced\napple-ipod-enter-code.png: PNG image data, 268 x 202, 8-bit/color\
    \ RGB, non-interlaced\narchos-av700.png:          PNG image data, 567 x 294, 8-bit/color\
    \ RGB, non-interlaced\nempty.jpg:                 empty\nhentai-manga-example.gif:\
    \  GIF image data, version 89a, 358 x 313\nindex.cgi:                 Bourne shell\
    \ script, text executable\nteenage1.jpg:              JPEG image data, JFIF standard\
    \ 1.02, aspect ratio, 100 x 100\n```\n\nNice command, eh? It includes the type\
    \ of the image, dimensions, depth and any other characteristics it can ascertain.\n\
    \nMost important, notice that \"XX image data\" appears consistently with these\
    \ images, whether they're PNG, JPG or GIF images. By using this, we can avoid\
    \ all the hassles with JPG vs. JPEG, JPG vs. jpg, GIF vs. Gif and on and on.\n\
    \nNow, the little loop looks like this:\n\n```sh\nfor name in *\ndo\n    if [\
    \ ! -z \"$(file $name | grep 'image data')\" ] ; then\n        echo \"$name <br>\"\
    \n```\n"
