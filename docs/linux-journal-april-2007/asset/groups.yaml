    For computers with Web browsers, on the other hand, the registration can be done
    by the user through the PacketFence captive portal. The portal can verify login/password
    information through a RADIUS file, Radius or LDAP, which we use in our example.
    In order to do this, you need to adapt the provided template /usr/local/pf/conf/templates/ldap.conf
    to fit your LDAP structure. Because all your users will be redirected to the registration
    screen, it also is wise at this point to change the default PacketFence logo,
    which is shown on the Web pages, to your own company logo. This can be done by
    adding `/logo/` to `/common/mylogo.gif` to the [general] section in /usr/local/pf/conf/pf.conf
    and copying the file mylogo.gif into the directory /usr/local/pf/html/common/.


    To activate the registration, incorporate the following parameters into /usr/local/pf/conf/pf.conf:


    ```ini

    [trapping]

    testing=disabled

    detection=disabled

    [registration]

    aup=enabled

    auth=ldap

    ```


    Now, restart PacketFence with `service packetfence restart`. You should see in
    /var/log/messages that PacketFence is trapping unregistered nodes by ARP-spoofing
    your network''s gateway. From the client side, opening a Web browser and accessing
    any outside Web site should lead to a redirection to the PacketFence captive portal,
    which allows you to register the computer. You also can determine whether a client
    has been ARP-spoofed by executing `arp -n -a` (under Linux) on the client and
    checking which MAC is saved in the ARP cache for your network''s gateway.


    #### Incorporating Snort and Nessus


    You can take it a step further by adding Snort alerts to your PacketFence installation.
    Let''s assume that using BitTorrent clients is prohibited in your environment
    and you want to configure PacketFence to enforce this policy. Edit /usr/local/pf/conf/violations.conf
    so that the section containing BitTorrent reads as follows:


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_65_0.png)


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_66_0.png)


    Shane’s customers are always pushing the limits of technology. That’s why he is
    a fan of the Rackform iSvr R2020, an innovative, iU, two-compute-node system designed
    to increase computing density while reducing cost, energy, and space requirements.
    With support for two Quad-Core Intel® Xeon® Processors 5300 Series per compute
    node, the iSvr R2020 combines Intel’s proven reliability with industry-leading
    16-core-per-iU density. Additionally, 8 Fully Buffered DIMM sockets, 2 hot-swap
    SATA hard drives, and a PCI-Express slot in each compute node convince Shane that
    the iSvr R2020 provides the density, flexibility, and cost effectiveness needed
    to tackle even the most demanding computing challenges.


    When you partner with Silicon Mechanics, you get more than a powerful Intel Solution
    — you get an expert like Shane.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_66_1.png)


