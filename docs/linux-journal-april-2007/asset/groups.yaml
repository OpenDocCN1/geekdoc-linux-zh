    but this easily can be changed from the command line; see the --Server-port argument.
    *(fwknop offers many configuration options--- see Resources for a link to the
    documentation and man pages.)* For a graphical representation of SPA in action,
    see Figure 2.


    So, what are all the fields for? First, the 16 bytes of random data allows one
    of the highest priority limitations in port knocking to be solved---the replay
    problem. Every SPA packet is prepended with 16 bytes of random data before being
    encrypted, and then upon a successful decrypt by the fwknop server, the MD5 sum
    of the entire packet is cached. The random data allows every SPA packet to be
    different (even when the same access directive is sent), so the MD5 sum of every
    packet also has a high probability of being different. If the MD5 sum of any new
    packet matches the sum of a previous packet, the fwknop server takes no action
    and writes a warning message to syslog. Hence, any SPA packet that is intercepted
    by a third party cannot be replayed on the network in an effort to get access
    through the default-drop packet filter. The client username and timestamp are
    placed within the packet by fwknop and the username is used to maintain different
    authorization levels for remote users by the fwknop server. fwknop can be installed
    on a multiserver system, and each user can be authorized to connect to different
    services by a remote fwknop server. The fwknop version field is used to maintain
    backward compatibility. Fields can be added or deleted in new releases of fwknop,
    but by using the version number, the fwknop server can remain compatible with
    the manner in which older clients build SPA packets. The mode field tells the
    fwknop server whether the client wants to access a service or execute a command
    (with the specific access control directive or command in the next field). For
    example, to gain access to TCP port 22, the Access field would contain the string
    `<IP>.tcp/22` where `<IP>` is whatever IP address the client chose to put in the
    packet. Finally, the MD5 sum field contains the MD5 sum of the unencrypted packet
    before the client transmits it. This is used by the server to verify message integrity
    after decryption. We already have seen how the increased amount of data that can
    be transmitted via an SPA packet has solved the replay problem and


    the extremely low data transmission rate in port knocking schemes. We have two
    remaining limitations in port knocking that need to be addressed. First, the single
    packet nature of the SPA protocol means that a malicious third party cannot break
    the authentication scheme just by spoofing a packet to the same port over which
    a monitored SPA packet is sent. Finally, because the SPA protocol requires only
    a single packet, it does not appear to any intermediate IDS like a port scan.
    All that any IDS can see is an unrecognizable blob of data seemingly spuriously
    sent to some IP address.


    # Conclusion


    Single Packet Authorization provides similar security benefits to port knocking
    in terms of protecting services with a packet filter that is configured in a default-drop
    stance. Anyone scanning for a target service that is protected in this way will
    be unable to detect such a service is listening, and this makes even the exploitation
    of zero-day vulnerabilities much more difficult. SPA offers elegant solutions
    to many limitations in port knocking implementations. These allow SPA to solve
    the replay problem, achieve a data transmission rate that makes the use of asymmetric
    encryption possible, thwart simple spoofing attacks and remain under the radar
    of intrusion detection systems that are monitoring networks for port scans. See
    next month''s *LI* for Part II to this article, which will show exactly how to
    use SPA.


