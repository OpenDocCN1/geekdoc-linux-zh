    \ ESTABLISHED 连接的规则（是的，UDP 流量也有关联的 ESTABLISHED 状态）。\n\n到目前为止，除了 SSH 和 DNS 之外，我们已经阻止了所有协议。对于新的系统管理员来说，阻止\
