    To summarize, an ODF file is a zipped archive of several XML files. One of these
    files contains contents in known tags. Each type of ODF file can have different
    tags based on stored information. By using introspection and the XML parsing capabilities
    in Python, you can list the types of nodes in a file and read them into a tree
    structure. Once read, you can extract data only from those nodes in the tree that
    are of interest to you.


