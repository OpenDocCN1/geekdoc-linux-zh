    # 单包授权


    单包授权填补了端口敲击的空白。**迈克尔·拉什**


    无数的软件、协议和复杂的相互依赖性共同构成了一个系统，很难保证其具有任何特定属性——尤其是安全性。即使是专门设计用于增强安全的软件，在拥有详细知识的聪明人指使下，也可能对其造成损害。从防火墙到
    Secure Shell (SSH) 协议实现的各种安全软件中都已发现漏洞。例如，OpenSSH 是由世界上最具安全意识的一些开发人员开发的，但它偶尔也会包含可远程利用的漏洞。这是一个值得注意的重要事实，因为它似乎表明实现安全性是困难的，因此加强了对纵深防御方法的论据。本文探讨了单包授权
    (SPA) 的概念，将其作为超越端口敲击的下一代被动身份验证技术。


    当伺机而动的攻击者尝试利用服务器软件（而非客户端软件）中的漏洞时，第一步是侦察；攻击者需要定位目标。Nmap 已经出色地自动化了这一过程，因此很容易构建出可能被攻破的目标系统列表。如果攻击者找到了您正在运行的服务器软件中的零日漏洞，您不希望出现在这个目标列表中！端口敲击和单包授权都使用配置为默认拒绝状态的包过滤器，同时仅向那些能够通过被动机制证明其身份的
    IP 地址提供服务。通过这种被动方式认证远程 IP 地址不需要访问 TCP/IP 协议栈。即使受此方式保护，Nmap 甚至无法检测到服务器正在运行，即使攻击者拥有零日漏洞也无济于事。


    本文是关于单包授权的两部分系列文章的第一篇，它为单包授权奠定了理论基础，并解释了为什么它是超越端口敲击的下一代被动授权技术。下一篇文章将详细介绍如何使用 Finkpop
    为您的 SSH 守护进程提供单包授权保护。


    ## 端口敲击简介


    端口敲击是一种第一代技术，它使用 TCP 和 UDP 数据包头部中的端口字段来传输信息。通常，这些协议用于封装应用层数据，但端口敲击通过使用端口号本身作为字段来传输数据，从而在发往各个端口的数据包序列中编码信息。这些数据包通常是通过防火墙日志监控或通过数据包捕获机制（如
    libpcap）进行监控的。通常，存在一个端口敲击客户端和一个端口敲击服务器。在这种情况下（除非另有说明，本文其余部分亦然），术语客户端和服务器分别指发送和监控数据包软件组件。客户端负责生成端口序列，服务器负责被动收集序列，并在收到有效序列后重新配置包过滤器以允许连接到受保护的服务。


    典型的端口敲击场景是端口敲击服务器配置包过滤器，阻止对服务（如 SSH）的所有访问，直到端口敲击客户端发送特定的端口敲击序列。例如，服务器可能要求客户端按以下顺序向以下端口发送
    TCP SYN 包：


    - 23400

    - 1001

    - 2003

    - 65501


    如果服务器监控到这个敲击序列，包过滤器将重新配置以允许来自发送该序列的 IP 地址的 SSH 连接。通过利用包过滤器提供的连接跟踪机制（例如 Netfilter
    中的 conntrack 模块），在敲击服务器创建的初始规则在超时后被移除之后，SSH 会话可以保持建立状态。端口敲击序列可以加密，并在 **www.portknocking.org**
    上列出了许多实现。关于端口敲击操作的图形表示，请参阅图 1。


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_52_0.png)


    ## 端口敲击的局限性


    端口敲击在限制对服务的访问方面提供了一些实际好处，但局限性在哪里潜伏？首先，很明显加密敲击序列很重要，而这反过来意味着必须传输几个字节的信 息。对于对称密码系统，加密数据至少与块大小一样大（对于为高级加密标准选择的
    Rijndael 对称分组密码为 128 位）。对于非对称密码系统，加密数据将大得多。


    例如，GnuPG 使用的原始 ElGamal 算法在加密数据时会加倍明文大小。尽管 GnuPG 还利用压缩（有时可以将密文大小减小到低于明文原始大小），但
    GnuPG 密钥通常较大的密钥大小意味着即使是最小消息的密文也将达到数百字节。


    '
