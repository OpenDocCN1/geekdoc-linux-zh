    # **LETTERS**


    the people who have to figure out what the he** I did can quickly get to the root
    of the problem. Now, all they have to do is comment over the trap line and look
    at the temp files’ output to see what is happening and how to fix it. The trap
    line executes the rm of the temp files when the script exits (that is, it cleans
    up after itself). They also can see the flow of the process better and gain quicker
    understanding.


    Thank you for the great articles and helpful insights!


    - Michael C. Tiernan


    # **Now You See Them, Now You Don’t**


    In *Antropicon* [February 2007], Nick Petreley suggests tactics to move further
    into the mass desktop market. Among other things, he says, “don’t remove features”.


    I heartily agree. KDE has seen a steady stream of added features, but unfortunately
    some odd ones were removed. It is no longer possible to move a maximised window
    partly out of the viewport. You have to de-maximise it first, just like Microsoft.
    Nor can you double-click on the bar at the top and reduce it to just the bar,
    as used to be possible. Konqueror no longer allows you to right-click on a file
    and see an option to delete it, merely one to move it to trash. (Fortunately,
    there is a way to do this: select the file and press Shift-Delete.)


    Presumably the strategy is to converge on Microsoft—up to a point. If desktop-level
    Linux becomes identical, why should people buy it rather than the ready-installed
    Microsoft product?


    When Microsoft moved from command-line (MS-DOS) to Windows, Linux expanded in
    the same direction, retaining the old facilities. This is part of its strength.
    The same logic applies to desktop Linux: if we remove features, we play to lose.


    - Chris Trayner


    As far as I can tell, you’re right about moving files to the trash. But, I just
    moved a maximized window partially out of the virtual desktop, and I also shared
    (reduced a window to its title) by double-clicking on the title bar. I obtained
    KDE 3.5.6 from a KDE mirror and run it on Kubuntu 6.10 AMD64.—*Ed.*


