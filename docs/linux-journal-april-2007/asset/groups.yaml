  - '[PAGE 31]


    Your four choices, although worded differently, are the same as those you saw
    earlier at boot time. If you choose Interactive, you''ll be prompted for the source
    of your backups. Before we go any further, it''s worth noting that the idea behind
    Mondo Rescue is to provide a means of disaster recovery when everything is gone,
    which is why backups are created to be bootable (tapes, CDs and so forth). This
    is fantastic if major disaster strikes, but what if it''s a minor disaster, such
    as accidentally deleting your boss'' e-mail folder? You certainly don''t want
    to take down a running production system, even if the only important information
    in his e-mail folder are stats from a football pool. Luckily, you can restore
    a file or folder to a live system, interactively. This is how you do it.


    From the command line, type monderestore. An ncurses-based display appears asking
    for your boot disk, CD or floppy. Simply press Enter, and you''ll find yourself
    at the file catalog.


    It may take a few seconds for the program to extract the file catalog, but soon
    you''ll be presented with a list of files and folders starting from the root directory.
    Using the arrow keys, you can navigate up and down through the list. Along the
    bottom of this screen are text buttons labeled Less, More, Toggle, RegEx, Cancel
    and OK (Figure 8). To expand a folder or directory, cursor to the right, go to
    the More button, and press Enter. To select a file or folder for restoring, cursor
    right again to the Toggle button, and press Enter. An asterisk appears to the
    left of the filename you''ve selected. Press Enter again to deselect it. To continue
    searching through the file list, cursor left past the Less button, and you can
    scroll up and down through the list again.


    Before you ask, the reason I didn''t mention the RegEx button is that this is
    still a feature under development, and it really doesn''t do anything at this
    time.


    Once you have selected everything you want to restore, cursor over to the OK button,
    and press Enter. An alert pops up asking whether you are happy with your selection.
    Press Yes to continue with the restore. On the next screen, select a restore path.
    If you want to restore in place (and overwrites any current files), accept the
    default, which is the root direc-


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_31_0.png)


    tory. Often, you''ll want to restore a file into an alternate location and move
    it back when you are satisfied with its content. If that is the case, enter an
    alternate path, and press Enter. The next screen (Figure 9), boasts “Restoring
    from archives” and provides a nice report of the restore process.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_31_1.png)


    The dialog displays the tarball in which it is currently searching, on which disc,
    a percentage of completion and an estimated time remaining before all your files
    are restored. That''s it. Your all-important files (and, they are all important
    when lost) have been restored.


    Once again, mes amis, the clock indicates that it is indeed closing time. I trust
    you are feeling satisfied and relaxed from the wire. While François refills your
    glasses a final time, I should point out that development on Mondo Rescue is ongoing,
    and there is a helpful and enthusiastic user base, ready to help with any issues
    you might encounter. Take a moment to visit the support page and join the mailing
    list on the Mondo Rescue site, and you''ll not only be more relaxed, you also
    will sleep soundly knowing your data can be restored. Please raise your glasses,
    mes amis, and let us all drink to one another''s health. A votre santé! Bon appétit!


    Marcel Gagné is an award-winning writer living in Waterloo, Ontario. He is the
    author of the all-new Moving in Free Software, his sixth book from Addison-Wesley.
    He also makes regular television appearances as Call for Help''s Linux guy. Marcel
    is also a pilot, a past Top-40 dice jerk, writes science fiction and fantasy,
    and holds a mean Origami T-Rex. He can be reached via e-mail at mgagne@56siam.com.
    You can discover lots of other things (including great Wine tricks) from his Web
    site at www.marcelgagne.com.


    # Resources


    +   *   Mondo Rescue: [www.mondorescue.com](http://www.mondorescue.com)

    +   *   Marcel''s Web Site: [www.marcelgagne.com](http://www.marcelgagne.com)

    +   *   The WFL-LUG, Marcel''s Online Linux User Group: [www.marcelgagne.com/wfltlugform.html](http://www.marcelgagne.com/wfltlugform.html)'
