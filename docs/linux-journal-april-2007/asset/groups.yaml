    ```\n\nOne of the problems with the above table is that it lacks a unique primary\
    \ key. This makes it difficult to refer to the Classes table from another table.\
    \ We could use the name assigned to the class by the university's registration\
    \ system, but there is no guarantee that this will be unique. Moreover, what will\
    \ we do next year, when a class of the same name is offered? For this reason (among\
    \ others), it's the norm to create an \"artificial\" primary key, one whose purpose\
    \ is to identify a row within the database uniquely.\n\nIn MySQL, we can do this\
    \ most easily with the AUTO_INCREMENT keyword. For example:\n\n```\nCREATE TABLE\
    \ Classes {\n    class_id INTEGER AUTO_INCREMENT,\n```\n\nIf we want, we can INSERT\
    \ a row into Classes with an explicit integer value for class_id. The fact that\
    \ class_id is defined as a primary key means that it is both indexed and guaranteed\
    \ to be unique. But, if we fail to enter an explicit value for class_id, MySQL\
    \ inserts a new value into the column, giving us a primary key value for the new\
    \ class without having to calculate it ourselves.\n\nThe above table definition\
    \ shows a few of the many data types MySQL offers. MySQL offers many traditional\
    \ data types, such as NUMERIC and VARCHAR, but it also includes a number of signed\
    \ and unsigned numeric types (for example, TINYINT, SMALLINT, MEDIUMINT, INT and\
    \ BIGINT), a number of CLOB/BLOB types (such as, CHAR, BINARY, BLOB and TEXT),\
    \ and several having to do with dates and times (DATE, DATETIME and TIMESTAMP).\
    \ There are also ENUM and SET types, allowing you to work with nonstandard sets\
    \ of enumerated data. MySQL also offers a wide variety of operators, from simple\
    \ string-concatenation, to date extraction, to one of my favorites, the CASE statement,\
    \ which lets you place if-then logic inside of a query.\n\nIn addition, MySQL\
    \ offers a system for full-text search. This means you can store text inside of\
    \ TEXT columns in your tables, and then identify the column (and retrieve the\
    \ text) without having to index it yourself.\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_48_0.png)\n\
    \nIf the included suite of functions doesn't suit your needs, you can always write\
    \ one of your own. Recent versions of MySQL also offer the ability to create a\
    \ stored procedure or function, which provides both increased speed and centralized\
    \ control over commonly used functions. Stored procedures also can be invoked\
    \ automatically when particular events occur, known as a trigger in database parlance.\
    \ You also can write new functions in C or C++, loading them into MySQL at runtime.\n\
    \n### Table Types\n\nSo far, MySQL sounds like a nice, flexible relational database.\
    \ You might be surprised, however, to find that there is a huge amount of pent-up\
    \ frustration, and even hostility, toward MySQL in the Open Source and Database\
    \ communities. Just look for a recent story on Slashdot about MySQL, and you will\
    \ see many comments indicating that PostgreSQL, Firebird or nearly any other option\
    \ would be a better solution.\n\nPart of this stems from a time-honored tradition\
    \ of rivalry in the computer world, and particularly in the Open Source community.\
    \ Over the years, we have seen fights between Emacs and vi, Perl and Python, Linux\
    \ and BSD, and countless other pairings.\n\nBut, part of the animosity toward\
    \ MySQL stems from several design decisions that the authors made early on. For\
    \ example, documentation for an old version of MySQL said that foreign keys are\
    \ really unnecessary, and that such integrity checks could (and should) be handled\
    \ in the application, rather than in the database. Many experienced database people\
    \ see this and don't know whether to laugh or cry. The primary reason for using\
    \ a database is for its reliability, not speed, and adding foreign-key checks\
    \ is an easy way to increase the reliability of inserted data.\n\nSimilarly, old\
    \ versions of MySQL failed to lock tables. If you wanted to be sure that no one\
    \ would write to a table from which you were reading (or to which you were writing),\
    \ you needed to lock the table explicitly at the application layer. Given the\
    \ many years of research that has gone into row-level locking (and even more-advanced\
    \ systems, such as multiversion concurrency control), this seemed to many like\
    \ a step backward. MySQL's solution to these problems has been a novel one. Rather\
    \ than add these features to the existing (MyISAM) table structure, it made it\
    \ possible to choose from a number of different table structures, each with its\
    \ own set of trade-offs. Much as Linux system administrators can choose from a\
    \ variety of filesystems, MySQL administrators and programmers can choose from\
    \ several different storage engines.\n\nThis approach has some problems, of course.\
    \ The biggest problem from my perspective is that MyISAM remains the default storage\
    \ engine, which means that many users effectively choose to go without foreign\
    \ keys and sophisticated locking due to ignorance. Many other storage engines\
    \ seem to be of more limited use or for particular applications, such as MEMORY\
    \ (for in-memory databases), BDB (Berkeley DB-based) tables and even FEDERATED\
    \ (for tables on remote servers).\n\nA very popular storage engine, InnoDB, has\
    \ a different problem associated with it---the company that develops InnoDB was\
    \ purchased by Oracle earlier this year. This may have no effect on MySQL's open-source\
    \ distribution, because Oracle continues to make InnoDB available under the GPL.\
    \ But, it has raised some questions regarding MySQL's commercial version, given\
    \ that an essential part of the commercial-grade toolbox is now owned by a major\
    \ database rival.\n\nMuch has been made about MySQL's fast performance over the\
    \ years, with little or no tuning of the server. The truth is a bit hazier than\
    \ that, although MySQL is undoubtedly a fast database, many of those tests were\
    \ made using MyISAM tables, which are inherently faster because of their lack\
    \ of locks and integrity checks. (As an analogy, I often say that it's faster\
    \ to leave your house without locking the door, but the extra speed is usually\
    \ not worth the risk.)\n\n### Scalability\n\nMany of the features in recent versions\
    \ of MySQL have been aimed at corporate customers, whose license purchases are\
    \ helping drive MySQL development forward. One of the biggest bottlenecks that\
    \ a database administrator can face, particularly as the data grows in size, is\
    \ disk speed. Recent versions of MySQL thus provide both tablespaces (that is,\
    \ allocation of disk space on a per-table basis) and partitions (that is, division\
    \ of a table across several filesystems). Tablespaces are available only with\
    \ InnoDB tables, but partitions are available for all storage engines. Moreover,\
    \ tables can be partitioned based on column values, using a hash function to decide\
    \ into which partition a particular row should be placed.\n\nAnother important\
    \ aspect of MySQL has been replication and backup. These are crucial features\
    \ for enterprise clients, who need their data to be available all the time and\
    \ to have backups available at a moment's notice. The latest mode of MySQL has\
    \ improved the replication engine and made it more flexible, making it possible\
    \ to replicate tables even on a per-row basis.\n\nAnother feature I have been\
    \ waiting to see for some time is Unicode support. Although not all string and\
    \ regexp operations work with Unicode, this is a big boon to those who work with\
    \ multiple languages.\n\n### Community\n\nPerhaps the biggest asset that MySQL\
    \ has going for it is a very large, very active community of users and developers.\
    \ The sheer number of books, Web sites, mailing lists, help forums and code snippets\
    \ for MySQL is overwhelming.\n\nFor its part, MySQL AB has been doing an admirable\
    \ job of updating the documentation on a regular basis and of moving forward with\
    \ new features at an impressive rate. (This demonstrates that although open-source\
    \ software can often be written by volunteers, having paid professionals work\
    \ on a project can speed it up immensely.) In particular, I am impressed by the\
    \ on-line documentation, which includes not only numerous examples, but also intelligently\
    \ placed links to related subjects.\n\n### Conclusion\n\nMySQL has grown up quite\
    \ a bit since I first began to use it more than ten years ago. Some of its quirks,\
    \ such as using MyISAM tables by default, continue to rankle serious database\
    \ users who would like to see transactions and foreign keys everywhere. But, especially\
    \ with versions 5.0 and 5.1, MySQL is looking like a database that can advertise\
    \ its depth of serious features, rather than claim its main advantage is speed.\n\
    \n*Reuven M. Lerner, a longtime Web database consultant, is a PhD candidate in\
    \ Learning Sciences at Northwestern University in Evanston, Illinois. He currently\
    \ lives with his wife and three children in Skokie, Illinois. You can read his\
    \ Weblog at allread.me/lerner.cu.*\n"
  mdcn: "\n\n# 快评\n\n# MySQL 值得再次审视\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_47_0.png)\n\
    \n你对 MySQL 的无知可能会伤害到你。REUVEN M. LERNER\n\n1995 年初，当 Windows 95 还只是纸上谈兵，而 Red Hat\
    \ 还是作为 Slackware 的用户友好型替代方案的新兴力量时，我在媒体巨头时代华纳的“Pathfinder”网站工作。和所有媒体公司一样，时代华纳意识到网络即将腾飞，但不确定具体会以何种方式发生。\n\
    \n因此，公司聘请了一群程序员和设计师，并给了我们机会去尝试不同类型的设计和应用程序。这是一份很棒的工作，那里有一些富有创意、聪明且有趣的人。在我在那里的期间，我创建了各种各样的应用程序——测验、邮件自动回复器、游戏、搜索引擎，甚至还有一个个性化的《金钱》杂志“最佳城市”排行榜。\n\
    \n随着我构建的应用程序变得越来越复杂，很明显，我经常用于数据存储和检索的文本文件对于像我们这样庞大且受欢迎的网站来说，既不够高效也不够灵活。最终，有人向我介绍了我们新雇用的数据库专家，他教会了我关系型数据库和\
    \ SQL 的奥妙。我迷上了它，并享受着与已安装的数据库服务器合作。\n\n当我想在我家里的 Linux 机器上享受 SQL 带来的好处时，不幸的是，我的选择有限。我找到了许多被放弃的开源数据库项目，但没有一个像时代华纳的\
    \ Sybase 服务器那样强大，甚至不在同一级别。所以，你可以想象当我发现 MySQL 时的喜悦。不，它并没有做 Sybase 所做的所有事情，而且它不是在开源许可下发布的。但是，它是免费的，易于安装，并且拥有足够多的功能让像我这样的人来说基本满意。\n\
    \n互联网服务提供商也有类似的感觉，并开始将其安装到他们的系统中——最初是作为相对于竞争对手的优势，然后是因为其他所有人都在基本配置中包含了它。快进十多年，MySQL\
    \ 是目前广为人知的开源关系型数据库。我曾在他们还是仅有的两名全职 MySQL 程序员时见过蒙蒂·维德纽斯（Monty Widenius）和大卫·阿克马克（David\
    \ Axmark），如今他们位于大型企业金字塔的顶端。\n\nMySQL AB 现在在 GNU 通用公共许可证（GPL）下分发其产品，同时也为有需要的人提供闭源许可。一如既往，它运行在大量不同的操作环境上。并且，它仍然由世界各地的人们以狂热的发展速度进行开发，这些人提交补丁和建议。这是关于开源数据库系列文章中的第一篇。\n\
    \n在这个月里，我讨论 MySQL，包括其使用、功能和问题。下一篇文章将包含对 PostgreSQL 的类似分析，而该系列的第三篇文章将比较这两种数据库。\n\
    \nMySQL 的近期版本还提供了创建存储过程或函数的能力，这既提高了速度，又对常用函数提供了集中控制。\n\n## 从 MySQL 开始\n\nMySQL\
    \ 的著名特点之一是人们可以轻松地开始使用它。事实上，当你将 MySQL 与许多商业数据库进行比较时，它出奇地简单。你安装它（通常使用 RPM 或 Deb\
    \ 包，但从源代码编译也很简单），并使用 **safe\\_mysql** 启动数据库服务器。（你也可以使用普通的 mysqld 命令，但那样你就无法享受\
    \ safe\\_mysql 提供的一些幕后维护功能。）\n\n一旦启动服务器，你可以创建一个或多个数据库。（我承认，称 MySQL 为数据库有点令人困惑，因为它实际上是一个数据库服务器，允许你创建一个或多个数据库。每个数据库包含一个或多个二维表格。）要创建数据库，请使用\
    \ mysqladmin 程序：\n\n```\nmysqladmin create testdb\n```\n\n根据你的配置，上面的命令很可能顺利执行——特别是如果你以\
    \ Linux 下的 root 用户身份登录。但是，你的系统管理员可能（明智地）决定为 MySQL root 用户设置密码，在这种情况下，你需要键入：\n\n\
    ```\nmysqladmin -p create testdb\n```\n\n-p 选项告诉 mysqladmin 你想为该账户输入密码。你也可以使用\
    \ -u 选项指定 root 用户或任何其他用户，例如：\n\n```\nmysqladmin -u mysqlroot -p create testdb\n\
    ```\n\n创建数据库后，你就可以使用 mysql 客户端程序连接到它：\n\n```\nmysql -u mysqlroot -p testdb\n```\n\
    \n注意，我又一次指定了用户名并且希望输入密码。我将在下面回到权限的主题；目前，我们假设这种组合有效。\n\n在客户端中，你可以发出任何你想要的 SQL 命令，它将立即执行。例如，我们可以创建一个新表：\n\
    \n```\nCREATE TABLE Classes {\n    class_name TEXT NOT NULL,\n    room_number\
    \ INTEGER NOT NULL,\n    starting_date DATE NOT NULL,\n    ending_date DATE NOT\
    \ NULL,\n    instructor TEXT NOT NULL,\n    PRIMARY KEY(class_id)\n};\n```\n\n\
    上述表的一个问题是它缺乏唯一的主键。这使得从另一个表引用 Classes 表变得困难。我们可以使用大学注册系统分配给班级的名称，但没有保证这是唯一的。此外，明年提供同名班级时，我们将怎么办？因此（出于其他原因之一），创建“人工”主键是惯例，其目的是在数据库中唯一地标识一行。\n\
    \n在 MySQL 中，使用 AUTO_INCREMENT 关键字可以最简单地实现这一点。例如：\n\n```\nCREATE TABLE Classes\
    \ {\n    class_id INTEGER AUTO_INCREMENT,\n```\n\n如果我们愿意，我们可以向 Classes 插入一行，其中\
    \ class_id 具有显式的整数值。class_id 被定义为主键的事实意味着它既被索引又保证唯一。但是，如果我们未输入 class_id 的显式值，MySQL\
    \ 会向该列插入一个新值，为我们提供新班级的主键值，而无需我们自己计算。\n\n上面的表定义展示了 MySQL 提供的众多数据类型中的几种。MySQL 提供许多传统的数据类型，如\
    \ NUMERIC 和 VARCHAR，但也包含一些有符号和无符号的数字类型（例如，TINYINT, SMALLINT, MEDIUMINT, INT 和\
    \ BIGINT），一些 CLOB/BLOB 类型（如，CHAR, BINARY, BLOB 和 TEXT），以及几个与日期和时间有关的类型（DATE, DATETIME\
    \ 和 TIMESTAMP）。还有 ENUM 和 SET 类型，允许你处理非标准的枚举数据集。MySQL 还提供了各种运算符，从简单的字符串连接，到日期提取，再到我最喜欢的之一，CASE\
    \ 语句，它允许你在查询内部放置 if-then 逻辑。\n\n此外，MySQL 提供全文搜索系统。这意味着你可以在表的 TEXT 列中存储文本，然后识别该列（并检索文本），而无需自己建立索引。\n\
    \n![](img/3c4d8a97b5d96c835281dc0dacbc8551_48_0.png)\n\n如果内置的函数套件不适合你的需求，你始终可以编写自己的。MySQL\
    \ 的近期版本也提供了创建存储过程或函数的能力，这既提高了速度，又对常用函数提供了集中控制。存储过程也可以在特定事件发生时自动调用，这在数据库术语中称为触发器。你还可以用\
    \ C 或 C++ 编写新的函数，在运行时加载到 MySQL 中。\n\n### 表类型\n\n到目前为止，MySQL 听起来像是一个很好的、灵活的关系型数据库。然而，你可能会惊讶地发现，在开源和数据库社区中存在大量的压抑已久的沮丧，甚至对\
    \ MySQL 的敌意。只需查找 Slashdot 上关于 MySQL 的最近故事，你就会看到许多评论表明 PostgreSQL、Firebird 或几乎任何其他选择都会是更好的解决方案。\n\
    \n这部分源于计算机世界悠久的竞争传统，特别是在开源社区。多年来，我们见证了 Emacs 和 vi、Perl 和 Python、Linux 和 BSD 以及无数其他配对之间的斗争。\n\
    \n但是，对 MySQL 的敌意部分源于作者早期做出的几个设计决策。例如，旧版本 MySQL 的文档说外键其实是不必要的，这种完整性检查可以（也应该）在处理层而不是数据库中处理。许多有经验的数据库专家看到这一点，不知道该笑还是该哭。使用数据库的主要原因是其可靠性，而不是速度，添加外键检查是提高插入数据可靠性的简单方法。\n\
    \n同样，旧版本的 MySQL 未能锁定表。如果你想确保没有人向你正在读取的表（或你正在写入的表）写入，你需要在应用层显式锁定表。鉴于多年来对行级锁定的研究（以及更先进的系统，如多版本并发控制），这使许多人认为这是一步倒退。MySQL\
    \ 解决这些问题的方法很新颖。它没有将这些功能添加到现有（MyISAM）表结构中，而是使其能够从多种不同的表结构中进行选择，每种结构都有自己独特的权衡。正如\
    \ Linux 系统管理员可以从各种文件系统中进行选择一样，MySQL 管理员和程序员也可以从几种不同的存储引擎中进行选择。\n\n当然，这种方法有一些问题。从我的角度来看，最大的问题是\
    \ MyISAM 仍然是默认存储引擎，这意味着许多用户实际上因为无知而选择没有外键和复杂锁定。许多其他存储引擎似乎用途有限或针对特定应用，如 MEMORY（用于内存数据库）、BDB（基于\
    \ Berkeley DB）的表，甚至 FEDERATED（用于远程服务器上的表）。\n\n一个非常流行的存储引擎 InnoDB 与其相关的一个不同问题——开发\
    \ InnoDB 的公司今年早些时候被 Oracle 收购。由于 Oracle 继续以 GPL 提供 InnoDB，这可能会使 MySQL 的开源分发不受影响。但是，鉴于商业级工具箱的重要部分现在由主要数据库竞争对手拥有，这引发了一些关于\
    \ MySQL 商业版本的问题。\n\n多年来，人们一直称赞 MySQL 在服务器几乎或没有调优的情况下的高速性能。事实比那更模糊，虽然 MySQL 无疑是一个快速的数据库，许多测试是使用\
    \ MyISAM 表进行的，由于缺乏锁定和完整性检查，它们本质上更快。（作为一个类比，我经常说，不锁门就离开家会更快，但额外的速度通常不值得冒这个风险。）\n\
    \n### 可扩展性\n\nMySQL 近期版本的许多功能都旨在面向企业客户，其许可购买正在推动 MySQL 的发展。数据库管理员面临的最大瓶颈之一，特别是随着数据增长，是磁盘速度。因此，MySQL\
    \ 的近期版本提供了表空间（即按表分配磁盘空间）和分区（即将表划分到多个文件系统上）。表空间仅适用于 InnoDB 表，但分区适用于所有存储引擎。此外，可以根据列值对表进行分区，使用哈希函数决定特定行应放置在哪个分区中。\n\
    \nMySQL 的另一个重要方面是复制和备份。这些是企业客户至关重要的功能，他们需要数据始终可用，并能在通知后即时获取备份。最新版本的 MySQL 改进了复制引擎，使其更加灵活，甚至可能按行复制表。\n\
    \n另一个我期待已久的功能是 Unicode 支持。虽然并非所有字符串和正则表达式操作都支持 Unicode，但对于从事多语言工作的人来说，这是一个巨大的福音。\n\
    \n### 社区\n\nMySQL 最大的资产或许是一个非常大且非常活跃的用户和开发者社区。MySQL 相关的书籍、网站、邮件列表、帮助论坛和代码片段的数量令人震惊。\n\
    \nMySQL AB 本身一直在做令人钦佩的工作，定期更新文档，并以惊人的速度推进新功能。（这表明虽然开源软件通常可以由志愿者编写，但让有偿专业人士参与项目可以大大加快其进程。）特别是，我对在线文档印象深刻，它不仅包含大量示例，还巧妙地放置了相关主题的链接。\n\
    \n### 结论\n\n自十多年前我开始使用 MySQL 以来，它已经成长了很多。它的一些怪癖，如默认使用 MyISAM 表，继续惹恼希望看到到处都有事务和外键的严肃数据库用户。但是，特别是随着\
    \ 5.0 和 5.1 版本，MySQL 看起来像一个可以宣传其严肃功能深度，而不是仅仅宣称其主要优势是速度的数据库。\n\n*Reuven M. Lerner，资深网络数据库顾问，是西北大学学习科学博士候选人，位于伊利诺伊州埃文斯顿。他目前与妻子和三个孩子住在伊利诺伊州斯科基。你可以在\
    \ allread.me/lerner.cu 阅读他的网志。*\n\n"
