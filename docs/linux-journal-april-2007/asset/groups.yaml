    ## 安全性


    MCS 旨在保护数据的机密性，从而允许策略中的类型部分专注于保护系统完整性。


    因此，这不会成为一个问题。

    创建文件后，可以使用 `chcon -l` 命令将标签更改为不同的级别。以下是使用方法示例：


    ### 列表 1. `semanage` 使用示例


    ```bash

    # semanage user -a -P user -R user_r -L s0:c1 -r s0:c1:SystemHigh rjc

    # semanage user -l

    ```


    | SELinux 用户 | 标签前缀 | MLS/MCS 级别 | MLS/MCS 范围 | SELinux 角色 |

    | :--- | :--- | :--- | :--- | :--- |

    | rjc | user | s0:c1 | s0:c1:SystemHigh | user_r |

    | root | user | s0 | SystemLow:SystemHigh | system_r, sysadm_r |

    | system_u | user | s0 | SystemLow:SystemHigh | system_r, user_r |

    | user_u | user | s0 | SystemLow:SystemHigh | user_r, sysadm_r |


    ```bash

    $ touch foo

    $ ls -lZ foo

    -rw-r--r-- rjc rjc rjc:object_r::t:tmp_t foo

    $ chcon -l s0:c8 foo

    $ ls -lZ foo

    -rw-r--r-- rjc rjc rjc:object_r::t:tmp_t:ProjectA foo

    ```


    请注意，级别 s0:c0 被转换为了 ProjectA；这是我之前创建的转换。

    可以使用不同的范围来运行进程。

    以下是使用 `id -Z` 命令显示 SELinux 上下文（包括末尾的 MCS 范围）的示例，用户 rjc 使用 `runcon -l` 命令在不同范围内运行
    bash 实例：


    ```bash

    $ id -Z

    rjc:system_r:unconfined_t:SystemLow:SystemHigh

    ```


    ```bash

    $ runcon -l s0:c0:c10:c20 bash

    $ id -Z

    rjc:system_r:unconfined_t:s0:c0:c10:c20

    $ runcon -l s0:c9:c20 bash

    execvp: Permission denied

    ```


    以支持 MLS 策略的需求。

    Fedora Core 5 使用范围的低端来确定进程的文件默认上下文。范围参数通过 `-r` 开关指定。在使用 Fedora Core 5 时，通常只有范围的高端部分具有实际意义，它指定了访问权限。在创建用户时，如果使用目标策略（这是
    Fedora Core 5 安装的默认策略），应使用参数 `-P user -R user_r`。严格策略在 MCS 方面与目标策略非常相似。本文的大部分内容都适用于严格策略，尽管
    `semanage` 命令的 `-P` 和 `-R` 选项需要不同的参数。


    添加身份后，必须添加登录条目以将 UNIX 账户分配给该身份。登录配置还允许您指定 MCS 范围，因为您可能拥有许多具有相同 SELinux 身份但登录时分配了不同
    MCS 范围的 UNIX 账户。必须使用 `-s` 参数来指定已存在的 SELinux 身份名称。如果未使用 `-r` 选项指定范围，则默认的登录条目将不使用任何类别（这可能无效，具体取决于该身份范围的低级别）。


    以下是添加登录条目的示例：


    ```bash

    # semanage login -a -s rjc -r s0:c1:SystemHigh rjc

    # semanage login -l

    ```


    ## 总结


    | 登录名称 | SELinux 用户 | MLS/MCS 范围 |

    | :--- | :--- | :--- |

    | __default__ | user_u | s0 |

    | rjc | user_u | s0:c1:SystemHigh |

    | root | root | SystemLow:SystemHigh |


    MLS 是通过策略语言灵活实现的。这使我们能够随后使用相同的语言特性开发 MCS 策略，并允许在不更改内核代码的情况下开发其他基于类别和级别的机密性控制。这方面的一个例子是我的新开发成果：强制性
    MCS（MMCS）。


    强制性访问控制（MAC）系统是一种访问控制由系统管理员确定并由操作系统强制执行的系统。用户不允许通过授予自身数据文件过高的访问权限来覆盖此访问控制。在 UNIX
    权限中，可以在 /tmp 目录中创建 mode 777 文件，从而授予所有用户完全访问权限。在 MMCS 中，我希望防止授予此类访问权限。在 MMCS 策略中，不允许写入级别低于进程级别的文件。这意味着通过为用户设置低级别，管理员可以确定读取该用户创建的文件所需的最小访问权限。


    MCS 和 MLS 策略有几个显著差异。在 MLS 中，访问基于范围的低级别（有效清除级别），而范围的高级别主要用于通过 newrole 程序确定访问权限。在
    MCS 中，读取和写入的访问都基于范围的高级别，而低级别仅用于限制写入访问。另一个区别是 MCS 仅设计用于保护文件内容，而 MLS 限制所有数据传输方式。另一个主要区别是，在
    MCS 中，进程可以启动具有不同范围的最小限制的子进程。


    请注意，登录条目的范围必须是 SELinux 用户身份范围的子集。这意味着登录范围的低端不能低于用户身份范围的低端，登录范围的高端不能高于用户身份范围的高端。在大多数情况下，您会创建一个与用户身份范围相同的登录条目。


    Russell Kaler 自 2001 年起一直致力于安全增强型 Linux（SELinux）。他是一名专注于 SELinux 和 ISP 管理的独立顾问。


