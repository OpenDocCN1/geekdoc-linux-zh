    \ (locally originating) network transactions.\n\nBut wait! That third command\
    \ violates Runnem's principle (deny all that is not explicitly permitted), doesn't\
    \ it? Yes, it does. That's why I write my own iptables scripts even for local\
    \ firewall policies. You need to decide for yourself in any given situation whether\
    \ you can live with the \"allow some inbound, allow all outbound\" compromise,\
    \ which is undeniably the simplest approach to local firewalls, or whether you're\
    \ worried enough about the threat of malware mischief to write a more restrictive\
    \ script, either manually or using a more sophisticated firewall tool than your\
    \ Linux distribution's installer.\n\nNote that as with other functions of Linux\
    \ installers, these firewall wizards usually can be run again later, for example,\
    \ in SUSE via YaST's Security and Users > Firewall module.\n\n## Two Tools for\
    \ Network Firewalls\n\nWe've discussed the hard way (writing your own iptables\
    \ startup script) and the easy way (letting your Linux installer generate a local\
    \ firewall script). These, however, missed two other tools for generating and\
    \ managing sophisticated firewall scripts. Two of the most popular are Shorewall\
    \ and Firewall Builder (see Resources).\n\nShorewall is, essentially, a script/macro\
    \ environment that lets you create firewall policies in the form of text files,\
    \ which are then \"compiled\" into iptables scripts. Shorewall's strengths are\
    \ its flexibility, its ability to insulate users from needing to learn iptables\
    \ syntax and its convenience in automatically generating startup scripts. If you\
    \ understand networking, however, learning to use Shorewall isn't necessarily\
    \ that much less time consuming than learning iptables.\n\nFor this reason, I've\
    \ personally not used Shorewall very much. Friends of mine, however, who know\
    \ less than me about networking but more about system administration, swear by\
    \ it.\n\nFirewall Builder, which I covered several years ago in the May and June\
    \ 2003 issues of *Linux Journal*, is something else altogether. It's the firewall\
    \ equivalent of an Integrated Development Environment—that is, a graphical, object-oriented\
    \ interface for generating iptables scripts (among other firewall types).\n\n\
    Conceptually, Firewall Builder is very similar to the policy editor in Check Point\
    \ firewalls. You create “objects” for the networks and hosts you want to use in\
    \ rules, and then you arrange those objects and pre-defined “service” objects\
    \ (HTTP, IMAP, FTP and so forth) into graphical rules statements. Firewall Builder\
    \ not only generates these into iptables scripts, but it also can install them\
    \ on other systems via SSH.\n\nIn my experience, the main strike against Firewall\
    \ Builder is its somewhat lengthy list of dependencies, chief among them the Qt\
    \ libraries for GUI development. However, many of the things Firewall Builder\
    \ needs are now standard Linux packages included on typical distributions, so\
    \ this is less of a problem than it used to be. See the Firewall Builder home\
    \ page for detailed installation instructions.\n\nOther graphical iptables utilities\
    \ include Firestarter and Guarddog (see Resources).\n\n## Conclusions\n\nA couple\
    \ years ago, *Linux Journal* named iptables its Security Tool of the year. It\
    \ really is a remarkable achievement. If you're serious about network security,\
    \ you'll want to explore iptables’ power in much greater detail than we've done\
    \ in this article, starting with the iptables(8) man page and progressing through\
    \ the how-tos available on the Netfilter home page (see Resources).\n\nWhether\
    \ you use iptables to protect your laptop or your entire enterprise network, I\
    \ hope you've found this introduction useful. Be safe!■\n\n> Mick Bauer (MickBauer@curewiremonkeys.org)\
    \ is Network Security Architect for one of the US's largest banks. He is the author\
    \ of the O'Reilly book *Linux Server Security, 2nd edition* (formerly called *Building\
    \ Secure Web With Linux*), an occasional presenter at information security conferences\
    \ and composer of the “Network Engineering Poll”.\n\n## Resources\n\n- The Netfilter\
    \ home page, where you can find the most current iptables-related how-tos: **www.netfilter.org**\n\
    - Home page for Firewall Builder, an object-oriented GUI for generating and managing\
    \ rules for several different types of firewalls, including iptables: **www.fwbuilder.org**\n\
    - The Shorewall (Shoreline Firewall) home page: **www.shorewall.net**\n- Suehring,\
    \ S., and Ziegler, R. *Linux Firewalls*, 3rd edition. Upper Saddle River, NJ:\
    \ Novell Press, 2005.\n- Home page for Firestarter, an iptables GUI: **www.fs-security.com**\n\
    - Home page for the Guarddog iptables GUI: **www.simonzone.com/software/guarddog**\n\
