  - "[PAGE 26]\n\nFinally, Dojo events are used to give functionality to widgets—Dojo’s\
    \ name for GUI elements made up of HTML and CSS.\n\n# ## Ajax in Dojo\n\nNow that\
    \ we understand how to create and use Dojo events, we can look at how to perform\
    \ Ajax queries using Dojo. As you may recall, Ajax (which stands for Asynchronous\
    \ JavaScript and XML) is a paradigm for Web development that uses the browser’s\
    \ ability to make HTTP requests behind the scenes. Combining such background HTTP\
    \ requests with JavaScript, the DOM and CSS makes it possible to create more intuitive\
    \ and aesthetic Web applications. We could create Ajax applications without Dojo\
    \ or another toolkit, but it’s much easier and more expressive to use a toolkit,\
    \ if only because it means we can avoid browser differences and incompatibilities.\n\
    \nListing 2 shows dojo-ajax.html, a page that contains only a single button marked\
    \ “Press here”. When the button is pressed, the user sees an alert box, much as\
    \ in Listing 1. But, in this version of the program, the contents of the alert\
    \ box have come from a server-side program, defined in this case to be the very\
    \ short hello.php (Listing 3).\n\n+   **Listing 3. hello.php**\n+   \n+   ```php\n\
    +   <? echo “Hello from the server!”; ?>\n+   ```\n\nThe button itself is defined\
    \ as we might do with any button to which we expect to attach an event, with an\
    \ id attribute. It sits inside of a very small HTML form, named “theform”:\n\n\
    ```\n```\n<form id=“theform”>\n    <input type=“button” id=“theButton” value=“Press\
    \ here” />\n</form>\n```\n```\n\nUsing Dojo events, we connect the button to a\
    \ function (ajaxAlert):\n\n```\n```\n<script type=“text/javascript”>\n    var\
    \ theButton = dojo.byId(“theButton”);\n    dojo.event.connect(theButton, “onclick”,\
    \ ajaxAlert);\n</script>\n```\n```\n\nThe only remaining question is what the\
    \ ajaxAlert function does. First, it creates a JavaScript object literal and assigns\
    \ it to the local variable ajaxArgs. This object literal assigns several names\
    \ that will help our Ajax call work: url is the URL of the server-side program\
    \ that will respond to our Ajax call, error indicates which function should be\
    \ invoked if an error occurs, load indicates what function should be invoked if\
    \ the call to url is successful and mimetype defines the MIME type we expect to\n\
    \nreceive from the server.\n\nOne of the annoying aspects of some other JavaScript\
    \ toolkits is that they require you to create your own list of name-value pairs\
    \ to be submitted in the AjaxRequest. This is not the case with Dojo. By setting\
    \ the formNode name in our object literal to a form node, we can rest assured\
    \ that all the form elements will be passed to the server. In this particular\
    \ case, that is not necessarily useful or interesting, but it certainly saves\
    \ some programmer time and increases program readability.\n\nFinally, our ajaxArgs\
    \ object is bound, and we’re off and running. Clicking on the button means the\
    \ associated Dojo event is invoked, which is ajaxAlert. That function, thanks\
    \ to doio.io.bind, then sends its arguments to the defined URL and invokes the\
    \ load function upon successful completion. This is surprisingly straightforward\
    \ and opens up many possible avenues for using Ajax in applications.\n\n# ## Conclusion\n\
    \nDojo, which we explored over the last two installments of this column, and Prototype,\
    \ which we looked at in the January 2007 issue, are both strong libraries for\
    \ Web developers looking to improve the quality of their JavaScript. Each has\
    \ a different style associated with it. I tend to be more of a Prototype kind\
    \ of guy, but many aspects of Dojo are also quite appealing to me. In particular,\
    \ Dojo’s extensive set of widgets, and the way those widgets can be connected\
    \ to one another via the event system, provides a rich set of functionality that\
    \ all JavaScript developers can enjoy. Even if you don’t plan to use Dojo, you\
    \ should consider installing and trying it, just to understand how it works.■\n\
    \n> Reven M. Lerner, a longtime Web/database consultant, is a PhD candidate in\
    \ Learning Sciences at Northwestern University in Evanston, Illinois. He currently\
    \ lives with his wife and three children in Skokie, Illinois. You can read his\
    \ Weblog at revenandlerner.com.\n\n# ## Resources\n\nThe main source for information\
    \ about Dojo, as well as Dojo software releases, is **dojotoolkit.org**. Documentation\
    \ for the toolkit is still a bit sparse, but it has improved significantly in\
    \ the last few months, and continued improvements seem likely, given Dojo’s growing\
    \ popularity. The main URL for Dojo documentation is at **dojotoolkit.org/docs**,\
    \ and Dojo book (the Wiki-based Dojo documentation) is at **manual.dojotoolkit.org/index.html**.\n\
    \nSome good articles about JavaScript toolkits, including Dojo, are at **www.sitepoint.com/article/javascript-library**.\n\
    \nFinally, a noteworthy introduction to Dojo events is at **www.dojotoolkit.org/docs/dojo_event_system.html**."
