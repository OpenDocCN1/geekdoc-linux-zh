    ## 安全性


    这远远超出了通过端口敲门所能实现的数据传输速率，并且能够轻松访问如此大量的数据包数据，开启了海量的可能性。


    传输数据。然而，即使使用其他字段，其数据传输量仍远不及使用数据包载荷。因此，对于块密码而言，加密序列必须至少包含 $(B/2 \times 8)$ 个数据包，其中
    $B$ 是以位为单位的块大小。单独来看，考虑到当今网络的一般速度和可靠性，这并不算太糟糕，但真正的问题在于乱序交付。


    对混乱的数据进行解密会导致混乱的结果，并且由于端口敲门客户端和服务器之间没有“连接”（TCP 意义上的连接）的概念，服务器无法对乱序数据包进行重新排序。


    数据包可能会经过不同的路由路径，其中一些路径可能很慢。因此，客户端必须依赖一种人工机制来尽量减少乱序交付的可能性：时间。通过在敲门序列中的每个数据包之间引入时间延迟，例如大约半秒，当数据包到达服务器时，通常可以保持数据包顺序。现在，对于
    128 位的块大小，对应的端口敲门序列为 $128/(2^8) = 8$ 个数据包。如果计入半秒的延迟，仅传输该序列就需要四秒钟。对于更长的消息，例如非对称密码生成的消息，这种数据传输速率根本不具备实用性。


    数据传输能力有限引入了端口敲门方案的另一个限制。很难有效防止重放攻击。任何能够监控从客户端发送到服务器的敲门序列的人，都可以自由地将该序列重放给服务器，以试图获得相同的访问权限。如果序列通过
    NAT 设备发送，并且服务器端数据包过滤器允许通过的源 IP 是外部 NAT 地址，那么这个问题尤为重要。例如，如果端口敲门客户端位于 RFC 1918 子网（例如
    10.10.1.0/24），而端口敲门服务器位于仅可通过公开互联网访问的远程网络上，服务器必须允许访问该 NAT IP 地址。同一子网上任何能够重放序列的人都将被授予相同级别的访问权限。此外，只要该规则存在，同一子网上的任何人在规则实例化以接受来自
    NAT 地址的连接后，都将获得相同级别的访问权限（在这种情况下不需要重放序列，这一点对于 SPA 同样适用）。


    关于传统端口敲门的文献资料已经提出了各种试图解决重放问题的方案，例如将时间作为重要因素、使用 Skey 风格的哈希函数迭代，甚至在每次使用后更改加密密钥。然而，这些方法中的每一种都需要端口敲门客户端和服务器维护某些状态，当涉及多个用户时，扩展性较差。


    端口敲门的另一个限制是，恶意第三方极其容易通过伪造一个额外的数据包到端口序列中，从而破坏敲门序列，当该序列由客户端通过网络发送时。攻击者只需将数据包的源地址设置为与真实客户端相同的地址，并选择与客户端发送的最后一个数据包相同的端口号即可。这个额外的数据包会破坏敲门序列，因此服务器不会允许合法客户端获得额外访问权限。虽然实际有人这样做的可能性相对较小（他们仍需能够监控从客户端发出的数据包），但主要问题在于这种攻击极其容易执行。只需一个数据包就足够了，而且攻击者甚至不需要位于原始数据包路径的中间。


    最后，任何能够监控客户端和服务器之间流量的入侵检测系统（IDS）都可以轻松地将敲门序列检测为端口扫描。这对于加密的敲门序列尤为如此，因为它们往往比简单的共享序列更长。对于
    IDS 来说，端口敲门看起来就像在相对短的时间内从单个 IP 地址对各个端口进行的一系列探测，这完美符合端口扫描的定义。


    ## 单包授权


    上述讨论的最终结果是，端口敲门提供了一些增强安全性的实际好处，但也需要解决一些严重的限制。单包授权（SPA）是一种相对较新的协议，它保留了端口敲门的所有优点，但修复了上述提到的限制。第一个公开可用的
    SPA 实现是 2005 年 5 月发布的名为 fwknop（www.cipherdine.org/fwknop）的软件。fwknop 最初创建于 2004
    年，是第一个结合被动 OS 指纹识别和端口敲门的实现（这使得可以做到诸如“仅接受来自 Linux-2.4 系统的敲门序列”之类的事情），但目前 SPA 方法是
    fwknop 提供的最流行（且默认）的认证方法。请注意，fwknop 提供认证和授权。关于这两者之间区别的详细讨论超出了本文的范围。


    单包授权强制采用与端口敲门类似的架构。客户端和服务器组件都由服务器管理，服务器控制一个默认丢弃的数据包过滤器，并且服务器被动地监控数据包。然而，端口敲门和
    SPA 在架构上的相似性到此为止。


    单包授权将数据传输移到了其应有的位置——应用层。这意味着，与端口敲门只能每包发送两个字节数据不同，SPA 能够在每个数据包中在客户端和服务器之间发送多达最小
    MTU 的数据（在以太网网络上是 1,500 字节）。这远远超出了端口敲门所能实现的数据传输速率，并且能够轻松访问如此大量的数据包数据，开启了海量的可能性。本文的其余部分讨论
    fwknop 实现的单包授权。


    fwknop 在应用层定义了以下数据包格式：


    - 16 字节随机数据

    - 客户端用户名

    - 客户端时间戳

    - fwknop 版本

    - 模式（访问或命令）

    - 访问（或命令字符串）

    - MD5 校验和


    SPA 数据包格式中的许多字段长度是可变的，但由 `:` 字符分隔（字段是 base64 编码的，因此嵌入的冒号不会破坏此语法）。一旦 fwknop 客户端构建了上述数据包格式，整个数据包将使用两种加密算法之一进行加密：使用
    128 位共享密钥的 Rijndael 对称块密码，或由 GnuPG 生成的最多 2,048 位公钥/私钥对的非对称 ElGamal 算法。默认情况下，fwknop
    客户端通过 UDP 端口 62201 发送 SPA 数据包，但这可以轻松地从命令行更改；请参阅 --Server-port 参数。（fwknop 提供许多配置选项——请参阅“资源”部分以获取文档和手册页的链接。）要了解
    SPA 操作的图形表示，请参见图 2。


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_54_0.png)


    那么，所有这些字段是做什么用的？首先，16 字节的随机数据解决了端口敲门中优先级最高的限制之一——重放问题。每个 SPA 数据包在加密前都会在其前面添加 16
    字节随机数据，然后在 fwknop 服务器成功解密后，整个数据包的 MD5 校验和会被缓存。随机数据确保每个 SPA 数据包都不同（即使发送相同的访问指令），因此每个数据包的
    MD5 校验和也有很大的概率不同。如果新数据包的 MD5 校验和与之前数据包的校验和匹配，fwknop 服务器将不采取任何行动，并将一条警告消息写入 syslog。因此，被第三方截获的任何
    SPA 数据包都无法在网络中重放，以试图通过默认丢弃的数据包过滤器获得访问权限。客户端用户名和时间戳由 fwknop 放入数据包中，用户名被 fwknop
    服务器用于为远程用户维护不同的授权级别。fwknop 可以安装在多服务器系统上，并且每个用户可以由远程 fwknop 服务器授权连接到不同的服务。fwknop
    版本字段用于维护向后兼容性。fwknop 的新版本中可以增加或删除字段，但通过使用版本号，fwknop 服务器可以保持与旧客户端构建 SPA 数据包方式 的兼容性。模式字段告诉
    fwknop 服务器客户端是想要访问服务还是执行命令（具体的访问控制指令或命令在下一个字段中）。例如，要获得 TCP 端口 22 的访问权限，访问字段将包含字符串
    `<IP>.tcp/22`，其中 `<IP>` 是客户端选择放入数据包的任何 IP 地址。最后，MD5 校验和字段包含客户端传输前未加密数据包的 MD5 校验和。服务器在解密后使用此值来验证消息完整性。


    我们已经看到，通过 SPA 数据包传输的数据量增加解决了重放问题以及端口敲门方案中极低的数据传输速率。我们需要解决端口敲门的另外两个限制。首先，SPA 协议的单包特性意味着恶意第三方无法仅通过向正在监控
    SPA 数据包发送的相同端口伪造一个数据包来破坏认证方案。最后，由于 SPA 协议只需要一个数据包，它对于任何中间 IDS 都不像端口扫描。任何 IDS 所能看到的只是一个看似随意发送到某个
    IP 地址的不可识别的数据块。


    ## 结论


    单包授权在保护通过配置为默认丢弃模式的数据包过滤器保护的服务方面，提供了与端口敲门相似的安全好处。扫描以此方式保护的目标服务的任何人将无法检测到该服务正在监听，这使得即使是利用零日漏洞也变得更加困难。SPA
    为端口敲门实现中的许多限制提供了优雅的解决方案。这使得 SPA 能够解决重放问题，实现使非对称加密成为可能的数据传输速率，挫败简单的欺骗攻击，并保持不被监控网络以进行端口扫描的入侵检测系统发现。下个月的
    *Linux Magazine* 将刊登本文的第二部分，详细展示如何使用 SPA。


    Michael Rash 拥有马里兰大学应用数学硕士学位，专攻计算机安全。Michael 是 cipherdyne.org 的创始人，该网站致力于 Linux
    系统的开源安全软件，他担任 Linux 网络 Dragon 入侵检测系统的安全架构师。他即将出版的书籍 *Linux Firewalls: Attack Detection
    and Response* 将由 No Starch Press 出版。


    ## 资源


    Krysinski, M. 2003. “Port Knocking: Network Authentication Across Closed Ports”.
    *SysAdmin Magazine* 12: 12–17.


    ElGamal 加密：[en.wikipedia.org/wiki/ElGamal_encryption](en.wikipedia.org/wiki/ElGamal_encryption)


    据我所知，截至本文撰写时，只有一个其他的 SPA 实现，可在 [www.unspecific.com/spa](www.unspecific.com/spa)
    获取。


    另一个名为 Tumbler 的实现（[tumbler.sourceforge.net](tumbler.sourceforge.net)）使用单个数据包，但它使用哈希负载而不是加密负载，这导致了显著不同的架构。


    fwknop 文档和手册页：[www.cipherdyne.org/fwknop/docs](www.cipherdyne.org/fwknop/docs)


