  mdcn: "\n## 橡树岭国家实验室\n由UT-BATTELLE为能源部管理\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_18_0.png)\n\
    \n## 领导级计算领域的机遇\n\n> 位于田纳西州东部的橡树岭国家实验室正联合一支世界一流的团队，以推动重大技术进步——开展新能力并开发新机遇，使其应用于高端科学和高性能计算。\n\
    \n## 解决现有技术难以触及的问题\n\n21世纪的科学研究要求计算能力远超现有水平。橡树岭国家实验室（ORNL）与美国能源部科学办公室旨在利用计算科学与工程工具引领前沿科学发现，为世界提供新的见解和重大突破，对美国科学领导地位、工业竞争力和国家安全产生广泛深远的影响。\n\
    \nORNL将拥有实现这些目标的丰富资源：\n\n- 国家计算科学中心（NCCS）\n- 能源部领导计算设施（LCF）\n- 高级科学计算研究（ASCR）\n\
    - 区域科学信息基础架构\n- 涉密计算（用于国家安全和能源保障）\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_18_1.png)\n\
    \n## 领导级计算能力\n\n计算能力是基础能源科学、生物和环境科学、聚变能源、高能物理和核物理领域实现科学领导地位的关键。NCCS内的高性能计算平台对研究计划至关重要，并将为许多我们最紧迫的国家挑战提供解决方案。这些能力将使ORNL成为国家最强大的开放能力计算资源，其可持续路径将维持并扩大联邦政府和广大科学界的国家领导地位，内容将包括计算机科学、数学、建模、模拟、知识提取和发现，以及数值方法。\n\
    \n## 加入橡树岭国家实验室\n\n国家的持续成功需要T级和P级计算的卓越领导地位。ORNL正在寻找世界一流的科学技术人才，目前在以下领域提供机遇：\n\n\
    - 系统编程\n  - 内核\n  - 网络\n  - 并行文件系统\n  - 层次存储\n- 早期状态研究（新型计算技术与体系结构）\n- IT基础设施的设计、开发、维护和运营\n\
    - 编译、调试和下一代工具开发\n- 项目管理与控制\n- 系统管理与运维\n- HPC用户支持与推广\n- 科学应用研发\n- 未来计算架构\n- 性能分析\n\
    \n![](img/3c4d8a97b5d96c835281dc0dacbc8551_18_2.png)\n\n如需了解并申请这些及其他相关机遇，请访问 http://computing.ornl.gov/Employment。如有疑问或需更多信息，请发送电子邮件至\
    \ CCSD_Staffing@ornl.gov。\n\nORNL是由UT-Battelle, LLC代表美国能源部管理的多项目研究设施，是一家致力于建设并维持多元化工作环境的平等机会雇主。\n\
    \n## 前沿资讯\n\n### 少即是多\n\n如果你想将小型低成本计算系统组合起来，来自台湾、由美国运营的e-Way公司的产品绝不可错过。e-Way专精于销售硬件——无论是单件还是批量购买——价格都低到一次普通的ATM取现即可覆盖。他们提供各种微型CPU板和机箱，价格从90到189美元不等，屏幕及其他组件价格最低仅8美元。在消费电子展上，e-Way总裁Steve\
    \ Freiburger甚至在一个极度紧凑的桌面Linux系统上运行了幻灯片演示。该发行版和50个应用——包括幻灯片软件——可以全部装入一张128Mb的CF卡中。可在\
    \ [ewayco.com](http://ewayco.com) 上了解更多信息。\n\n——DOC SEARLS\n\n### 市场门槛打开\n\n电影级35毫米胶片摄像机一直极其昂贵，它们的数字版本也是如此。原因之一是它们结构复杂，生产昂贵。另一个原因是制造商总是在不同层级的客户群之间保持距离。专业设备不仅具有远超“消费级”设备的功能和能力，而且价格也要昂贵得多。\n\
    \n![](img/3c4d8a97b5d96c835281dc0dacbc8551_19_0.png)\n\n这种状况正在视频设备领域开始改变。RED数字摄像机（[red.com](https://red.com)）是第一款能以独立制片人负担得起的价格，以数字形式提供35毫米级电影摄影的专业摄像机。它使用1200万像素Mysterium\
    \ CMOS传感器，以4096 x 2304分辨率（2048逐行）每秒60帧的RAW格式拍摄。它灵活、对格式不敏感，价格为17,500美元。对于如此出色的设备而言，这非常便宜。\n\
    \nLinux已成为好莱坞众多电影制作的首选平台。像RED这样的摄像机的普及是否意味着电影制作世界的其他部分也需要更多地使用Linux？我们将拭目以待。\n\
    \n——DOC SEARLS\n\n### 名言录\n\n> 不要做小计划；它们没有激发人们热血的魔力，而且本身可能也无法实现。要做大计划；在希望与工作中追求卓越，要记住，一张高尚而逻辑严密的图纸一旦记录下来便不会消亡。\n\
    > \n> ——Daniel Burnham\n\n> 获得资金的最佳方法并不是找几家风险投资公司去求、借或偷；获得资金的最佳方法是做出人们愿意付费的东西。\n\
    > \n> ——Giles Bowkett, [gilesbowkett.blogspot.com/2006/12/tale-of-two-startups.html](https://gilesbowkett.blogspot.com/2006/12/tale-of-two-startups.html)\n\
    \n> 大多数嵌入式设备供应商不发布任何源代码。然后，社区的某人会找供应商的法务部门纠缠六个月，最终得到一个无法编译的部分源代码树。我的印象是，公司不把合规性视为硬性要求，而是将其视为风险管理练习；如果\
    \ (GPL诉讼成本) * (GPL诉讼概率) < (VxWorks许可成本) * (设备数量)，就使用Linux。\n> \n> ——Wes Felter,\
    \ [www.linuxjournal.com/comment/reply/1000164/209612](https://www.linuxjournal.com/comment/reply/1000164/209612)\n\
    \n> 罗斯伯格定律：“软件很容易制作，除非你希望它做点新东西。” 罗斯伯格推论：“唯一值得制作的软件是做新东西的软件。”\n> \n> ——Scott Rosenberg，摘自《Dreaming\
    \ in Code》，Cwen出版社，2007年\n\n> 开源化是我们七年Second Life开发过程中做出的最重要决定。虽然我们主动决定开源代码对我们来说显然是一个大胆的步骤，但这完全符合Second\
    \ Life的社区创建理念。\n> \n> ——Linden Lab的CTO Cory Ondrejka\n\n> 如果冰箱里没有足够的食物，你会说“商店一定关门了吗？”\n\
    > \n> ——Greg Elin，在一次会议上\n\n### 目录，2007年4月\n\n1. 截至2007年1月1日Second Life居民数量（百万）：**2.28**\n\
    2. 截至2007年1月1日Second Life每日消费（千美元）：**803.79**\n3. Linden Lab开源Second Life查看器源代码的天数（2007年）：**8**\n\
    4. 2006年消费电子销售额（十亿美元）：**145.7**\n5. 接受调查的德国居民中阅读博客的比例：**15%**\n6. 接受调查的德国“影响者”中阅读博客的比例：**27%**\n\
    7. 接受调查的美国居民中阅读博客的比例：**27%**\n8. 接受调查的美国“影响者”中阅读博客的比例：**34%**\n9. 接受调查的日本居民中阅读博客的比例：**74%**\n\
    10. 接受调查的日本“影响者”中阅读博客的比例：**91%**\n11. 所有博客中使用英语的比例：**39%**\n12. 所有博客中使用日语的比例：**33%**\n\
    13. 1950年未与配偶居住的美国女性比例：**35%**\n14. 2000年未与配偶居住的美国女性比例：**49%**\n15. 2005年未与配偶居住的美国女性比例：**51%**\n\
