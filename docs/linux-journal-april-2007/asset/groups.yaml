    方面表示，其理念是“让组织而非其网络供应商来选择最符合业务要求的应用，并以时效性和效率实施它们”。幸运的是，OSN 的一个关键组件是开源服务监控捆绑包，它利用了许多经过预测试和支持的基于开源的网络和服务管理应用程序，例如
