    # 深度解析


    # 极速需求：PS3 上的 Linux！


    将你的 PS3 变成双启动游戏机和 Linux 盒子 DAVE TAYLOR


    - 我们能拿到

    - 我承认，我喜欢 WebTV


    2006 年圣诞节最火爆的视频游戏系统，并将其变成一台 Linux 机器吗？当然可以！


    如果你仍然认为视频游戏系统只是比老式的 Coleco 或 Atari 800 稍微先进一点的技术，那么当你第一次打开引擎盖时，会有一个大惊喜在等着你。虽然新的任天堂
    Wii（读音为“we”，奇的是）拥有一些时尚硬件，微软 Xbox 360 设备也是如此，但在技术竞赛中真正的赢家是令人惊叹的索尼 PlayStation 3
    系统。


    PS3 围绕 IBM Cell 宽带引擎处理器构建，包括高清蓝光驱动器、四个 USB 2.0 端口、具有 256MB 独立显存的 NVIDIA 图形处理器、对
    CompactFlash、SD 和记忆棒设备的支持、以太网、内置 802.11b 和 g、蓝牙、HDMI 端口，以及支持你能想象到的所有视频分辨率，包括 480i、480p、720p、1080i
    和圣杯 1080p。听起来像是一台计算机，而不是视频游戏系统，不是吗？


    蓝光光盘系统还支持大多数旧的光盘格式，包括 CD-ROM、CD-R、CDR+W、DVD、DVD-ROM、DVD-R 和 DVD+R。如果你不熟悉高清视频战场，蓝光每张光盘可支持高达
    54GB 的数据，如果你仍在使用 CD 烧录器，这相当惊人。另一种高清光盘格式是 HD-DVD，但不支持。另一方面，蓝光在零售渠道中已有超过一百部电影，因此
    PS3 也是一台功能相当强大的高清视频播放器。


    Cell 处理器本身是一件相当惊人的硬件，足以让 Terra Soft Solutions（位于科罗拉多州 Loveland）与索尼合作，基于 PS3 创建超级计算中心。想象一下，成百上千台机架式
    PS3 设备在运行复杂的气象模拟，而不是二战游戏。Cell 处理器的运行速度超过 4GHz，每秒可处理 2560 亿次计算，芯片本身拥有 2.5MB 内存，挤在一个使用
    2.34 亿个晶体管的处理器设计中（www.ibm.com/developerworks/power/cell）。


    还有一个重要的规格：包含 60GB 硬盘的 PS3 在大多数零售店的价格约为 599 美元，如果他们有 PS3 库存的话。至于游戏？目前有几款可用的，平均价格约为
    60 美元，标准的游戏租赁渠道（GameFly、Hollywood Video 等）在你读到这篇文章时应该已经提供 PS3 游戏租赁服务。


    好吧，它是一台隐藏在外形时尚黑色外壳中的顶级酷炫计算机，具有出色的功能，但它真的只是用于玩电子游戏吗？你可以用它做其他事情吗——你能把它变成一台 Linux
    系统吗？


    也许最明显的问题是为什么要费这个劲？我是说，如果你买了一台 PlayStation 3，你就投资了地球上最快的下一代游戏控制台。你为什么要启动到一个贫瘠的
    Linux 环境呢？


    嗯，答案并不是因为如果你是个极客，PS3 会取代你的常规 Linux 盒子。对我来说，在 PS3 上运行 Linux 的问题更多地涉及是否基本上可以为没有计算机的家庭增加
    PS3 的功能。如果你可以运行所有 PS3 游戏，观看蓝光高清电影，并完全与互联网交互会怎样？


    这是对晚期、被低估的 WebTV 设备的 21 世纪回答。科技极客从未完全理解，一个带有无线键盘并连接到常规电视的轻量级设备是


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_71_0.png)


