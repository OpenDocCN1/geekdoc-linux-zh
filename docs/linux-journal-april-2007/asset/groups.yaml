  mdcn: '

    ## 对 OpenXML 说不


    几个月前，微软和另一家软件公司 Novell 签署了一项技术合作协议。这项协议的一部分可能对几乎所有公民都构成高度危险，但这并不是大多数批评者所关注的那部分。


    ### 前一阶段总结


    根据这项协议，微软承诺不就专利侵权和其他“知识产权”违规行为对使用 Novell 打包和分发的特定版本 Linux 的用户提起诉讼。在宣布后的下一秒，全球的
    Linux 和自由软件支持者就开始互相解释，相信这些违规行为实际存在，或者任何法院会对 Linux 最终用户就此作出判决，是多么荒谬和可笑。本周，少数几份公开声明（甚至没有来自微软的）迅速表明，在现实的、非极客的世界里，这类论点是多么无足轻重。沃尔玛的首席技术官宣布，该公司最终将能够使用
    Linux 来扩展其全球网络存在，因为“关于知识产权的问题是‘巨大障碍’”，但“Novell 协议中的知识产权保护使沃尔玛更有信心更广泛地使用 Linux。”
    在得到沃尔玛的这样的确认后，哪位企业主（或沃尔玛供应商）会去听极客们发毒誓说 Linux 没有隐藏的法律炸弹呢？


    无论沃尔玛如何，这项协议中最糟糕、最危险的部分可能不是专利诉讼部分，而是对公共文件的文化、经济和所有权产生更大影响的其他方面。


    ### 请实现互操作性！


    互操作性在计算机世界中极其重要。如果由计算机程序生成的文档不能被同类其他程序完全且确定地读取，那么这些文档就无法交换，在几年后就会变得不可用，或者只能通过支付远高于原始软件生产者公平费用的方式来获得。


    为了避免这种情况，必须以非专有的文件格式来存储和交换文档。正如《每个人的 OpenDocument 指南》中解释的那样：“如果计算机程序是笔，那么就把文件格式想象成字母表。只要存在便宜的型号，出售高价笔并无不妥。但这一切都取决于每个人都使用相同的字母表，而无需支付费用或学习特殊秘密。”


    如今，两种文件格式正在争夺我们所有的办公文件。一种是非专有的、设计完全开放的、经国际批准的标准，称为 OpenDocument。另一种是 OpenXML，它是下一版
    Microsoft Office 使用的格式，旨在达到相同地位，但已被几位专家明确定义为专门创建用于 Microsoft Office 的格式。


    ### 真正的陷阱出现了


    尽管有这些情况，协议中的文件格式部分明确说明，它是“为了确保使用 OpenOffice.org 的客户能够继续读写使用未来 Microsoft Office
    文件格式的文档……[Novell 将确保] 未来版本 Microsoft Office 使用的文件格式有良好规范，并对所有人开放以实现。” 你现在看出问题所在了吗？首先，协议为期五年——在
    2011 年之后它无法确保任何东西。其次，它正式旨在使 OpenDocument 在 Microsoft Office 中不可用。相反，它将确保 OpenOffice.org
    用户可以继续成为专有格式的奴隶，这种格式很难在其他软件程序中完全支持。


    99% 的现有办公文件被 Microsoft 锁定，几乎所有当前的桌面都是 Microsoft Office。该协议将积极致力于维持这种状况，实际上使 OpenDocument（以及非专有格式的概念本身）在任何大型组织中变得无关紧要且未被使用，无论其技术优势、开放性和认证如何。


    想想那些大多数现有合作伙伴、客户或供应商都使用 Microsoft Office 格式的大型公司和公共管理机构。懒惰以及忽视软件现状的愿望非常强大。在这种情况下，当经理第一次带着“我打不开这个”的便条将员工或供应商发送的
    OpenDocument 文件退回时，发送者就会将 OpenOffice.org 的默认文件格式设置为 OpenXML，并且不再回头。为什么要以这种方式惹恼人，从而危及职业生涯或销售，尤其是当“我仍然可以使用这个很棒的免费软件，不是吗？”
    当然可以——直到协议到期，下一版 OpenXML 打破兼容性。


    这才是真正的危险；将无需就使用 Linux 起诉任何人，因为数以百万计的商业和公共文件将保留在一种单向格式中，这是专门为 Microsoft Office
    定做的。


    这不是互操作性。OpenDocument 是可互操作的。在 OpenOffice.org 中支持 OpenXML 也使其看起来像是多个应用程序将支持此格式。这是
    ISO 标准化的先决条件——即政府接受的条件。政府施压要求/迁移到 OpenDocument 也会更容易战斗或忽视：“既然我们的（当前）格式是 ISO 标准，甚至
    Linux 都能成功打开 99.999% 的现有办公文件，为什么还要在培训、软件迁移等方面花费公共资金？看看我们鼓励竞争和给你选择的善意有多大？” 所有这一切可能会合理地拖延
    OpenDocument 的采用（不是永远，别担心：只是四或五年）。这不是第一次某些事物因为 Microsoft 表示将以某种方式支持它，然后以“没有市场需求”为由而将其搁置，从而陷入僵局。


    ### 解决方案


    即使你完全不在乎计算机，OpenDocument 也是一个不容错过的重大机会——即使只是为了节省税收。请拒绝分发或接受 OpenXML 格式的办公文件。风险太大。使用你最喜欢的任何软件，但对
    OpenXML 说不，并要求你的朋友、同事和政府这样做。这将比过去容易得多。正在积极开发用于在 Microsoft Office 中读取和保存 OpenDocument
    文件的插件，以及一个跨平台查看器（类似于 OpenDocument 的 Acrobat Reader）。很快，将不再有任何正当理由不使用 OpenDocument。不要错过这个机会。——MARCO
    FIORETTI


    ## 资源


    - 沃尔玛 CTO 声明：news.com.com/Wal-Mart+eyes+Microsoft+for+W+eb+build-out/2100-1017_3-6152247.html

    - 为什么 Redmond 感到如此受 ODF 威胁：computerworld.co.nz/news/nst/tech/CBE41F838EABA40C25717AA01A0EC9

    - 《每个人的 OpenDocument 指南》：www.linuxjournal.com/article/8616

    - OpenDocument 入门：opendocumentfellowship.org/introduction

    - 如何雇用 Guillaume Portes：www.rbweier.com/blog/2006/01/ how-to-hire-guillaume-portes.html

    - Novell 关于办公应用程序文件格式的声明：www.novell.com/products/desktop/ fileformats.html

    - Office OpenXML 是单向标准吗？问问 Microsoft：blogs.adobe.com/shebanation/ 2006/12/open_xml_one-way.html

    - 对大多数人来说，OpenXML 是单向规范吗？www.sutor.com/newsite/blog/open/?p=1145

    - 一场 Zendo 游戏：www.rbweier.com/blog/2006/07/game-of-zendo.html

    - Microsoft Office 将得到一剂 OpenDocument：news.com.com/Microsoft-Office+to+get+a+dose+of+OpenDocument/2100-1013_3-6069188.html?tag=neft.top

    - OpenDocument 查看器：opendocumentfellowship.org/odfviewer


    ### 扩大模拟漏洞


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_17_0.png)


    娱乐产业通过让数字商品像模拟商品那样运作——即稀缺且难以复制——来拥抱数字革命。它将其“内容”的可复制性缩小，直到只剩下它讽刺地称之为“模拟漏洞”的部分。只有通过模拟漏洞，牺牲的数字商品才能相对容易地转移，而不被
    DRM 警察阻止。转移的商品不会具有相同的数字质量，但它们有看起来和听起来足够好的风险，以令用户满意。


    自然，用户需求已将模拟漏洞变成了一个市场。走在最前面的是基于芝加哥的 Neuros 的产品，它热爱 Linux，致力于将自由和开放的 Linux 价值体系带入媒体制作和复制的世界。


    Neuros Recorder 2 是一款 MPEG-4 录制器，“工作起来像一个迷你数字 VCR”。它通过 RCA 线缆连接到源设备，并实时记录在标准的可移动闪存卡上。内容可以手动或通过
    USB 2.0 连接传输到其他设备。


    该公司的最新产品是 Neuros OSD，“第一个基于开源 Linux 的嵌入式媒体中心”。它让你可以通过 RCA 或 S-Video 线缆从有线电视、卫星电视、DVD、电视/oDVR、摄像机或
    VCR 进行录制，并通过局域网（以太网）、内存卡、USB 或 RCA 线缆分发或回放录影。架构完全开放，并不断由 Neuros 和不断增长的开发者与用户社区改进。价格为
    229 美元。


    在 neurostechnology.com 上查看它们。——DOC SEARLS


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_17_1.png)


