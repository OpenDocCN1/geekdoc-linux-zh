    firewall policies. A common blunder on personal firewalls is to allow all “outbound”
    transactions, on the assumption that all local processes are “trusted”. If your
    system is infected with a worm, trojan or virus, however, this assumption breaks
    down.


    In the event of such an infection, you probably don’t want the malware to be able
