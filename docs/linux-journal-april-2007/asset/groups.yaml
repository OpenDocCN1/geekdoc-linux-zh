    # Sing1e Packet Authorization


    Sing1e Packet Authorization fills the gaps in port knocking. **MICHAEL RASH**


    Countless pieces of software, protocols and complex interdependencies together
    form a system for which it is difficult to guarantee any particular property—particularly
    security. Even software specifically designed to enhance security can, at the
    behest of clever individuals armed with detailed knowledge, work to its detriment.
    Vulnerabilities have been discovered in all sorts of security software from firewalls
    to implementations of the Secure Shell (SSH) Protocol. For example, OpenSSH is
    developed by some of the most security-conscious developers in the world, and
    yet it occasionally contains a remotely exploitable vulnerability. This is an
    important fact to note because it seems to indicate that security is hard to achieve
    and, therefore, bolsters the case for a defense-in-depth approach. This article
    explores the concept of Single Packet Authorization (SPA) as a next-generation
    passive authentication technology beyond port knocking.


    When an attacker on the prowl is an attempt to exploit a vulnerability in server
    software (as opposed to client software), the first step is reconnaissance; the
    attacker needs to locate a target. This process has been brilliantly automated
    by Nmap, so it is easy to construct a list of target systems that may be ripe
    for compromise. If the attacker has found a zero-day vulnerability in server software
    that you happen to be running, you don''t want to appear in this list of targets!
    Both port knocking and Single Packet Authorization use a packet filter configured
    in a default-drop stance and simultaneously provide service only to those IP addresses
    that can prove their identity via a passive mechanism. No TCP/IP stack access
    is required to authenticate remote IP addresses via this passive means. Nmap cannot
    even tell that a server is running when protected in this way, and it does not
    matter even if the attacker has a zero-day exploit.


    This article is the first of a two-part series on Single Packet Authorization,
    and it lays the theoretical foundation for Single Packet Authorization and why
    it is a next-generation passive authorization technology beyond port knocking.
    The next article will provide a hands-on look at using Finkpop to provide Single
    Packet Authorization protection for your SSH daemon.


    # Introduction to Port Knocking


    Port knocking is a first-generation technology that uses the port fields within
    TCP and UDP packet headers to communicate information. Normally, these protocols
    are used to encapsulate application layer data, but port knocking encodes information
    in sequences of packets to various ports by using the port numbers themselves
    as fields to transmit data. These packets are typically either monitored out of
    a firewall log or via a packet capture mechanism, such as libpcap. Typically,
    there is a port knocking client and a port knocking server. The terms client and
    server, in this case (and throughout the remainder of this article unless otherwise
    noted), refer to the software components that send and monitor packets, respectively.
    The client is responsible for generating the port sequences, and the server is
    responsible for passively collecting the sequences and reconfiguring the packet
    filter to allow connections to protected services upon receipt of a valid sequence.


    The typical port knocking scenario is for a port knocking server to configure
    a packet filter to block all access to a service, such as SSH, until a specific
    port knock sequence is sent by a port knocking client. For example, the server
    could require the client to send TCP SYN packets to the following ports in order:


    +   > 23400

    +   > 1001

    +   > 2003

    +   > 65501


    If the server monitors this knock sequence, the packet filter reconfigures to
    allow an SSH connection from the IP address that sent it. By making use of a connection
    tracking mechanism provided by the packet filter (such as the conntrack module
    in Netfilter), an SSH session can remain established after the initial rule created
    by the knock server is removed after a timeout. Port knock sequences can be encrypted,
    and there are many implementations listed at **www.portknocking.org**. For a graphical
    representation of port knocking in action, see Figure 1.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_52_0.png)


    # Port Knocking Limitations


    Port knocking offers some real benefits for limiting access to services, but where
    do the limitations lurk? First, it is clear that encrypting knock sequences is
    important, and this, in turn, implies that several bytes of information must be
    transmitted. For symmetric crypto systems, the encrypted data will be at least
    as large as the block size (128 bits for the Rijndael symmetric block cipher chosen
    for the Advanced Encryption Standard). For asymmetric crypto systems, the encrypted
    data will be substantially larger.


    For instance, the raw ElGamal algorithm used by GnuPG doubles the plain-text size
    when encrypted data. Even though GnuPG also utilizes compression (which can sometimes
    reduce the size of the cipher text to below the original size of the plain text),
    the typically large key size of GnuPG keys implies that the cipher text for even
    the smallest messages will be in the hundreds of bytes.'
