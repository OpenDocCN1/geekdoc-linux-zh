    decryption, including data that does not require secrecy.


    Files must be re-encrypted with a user-space application before they are transmitted
    through another medium.


    EncFS is a user-space cryptographic filesystem that operates via FUSE. User-space
    filesystems are easier to implement than kernel-native filesystems, and they have
    the advantage of being able to utilize user-space libraries easily. This makes
    it simple to implement feature-rich filesystems with less time and effort on the
    part of the developer. Unlike block device encryption solutions, EncFS operates
    as an actual filesystem. EncFS encrypts and decrypts individual files. Disadvantages
    of user-space filesystems based on FUSE include performance overhead from frequent
    kernel/userspace context switches and a current lack of support for shared writable
    memory mappings.


    # eCryptfs


    eCryptfs is a kernel-native stacked cryptographic filesystem for Linux. Stacked
    filesystems layer on top of existing mounted filesystems that are referred to
    as lower filesystems. eCryptfs is a stacked filesystem that encrypts and decrypts
    the files as they are written to or read from the lower filesystem.


    Applications in user space make filesystem system calls that go through the kernel
    Virtual Filesystem (VFS). Both eCryptfs and the lower filesystem (for example,
    ext3, JFS, NFS and so on) are registered in the kernel VFS. The operations under
    the eCryptfs mountpoint first go to eCryptfs. eCryptfs retrieves key material
    from the user session key ring and uses the kernel cryptographic API to perform
    encryption and decryption of file contents. eCryptfs may make key management requests
    with the user-space eCryptfs daemon (ecryptfsd). eCryptfs reads and writes encrypted
    content stored in files in the lower filesystem (Figure 1).


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_56_0.png)


    Application file operations go through eCryptfs, which communicates with the kernel
    Crypto API, the kernel key ring and the user-space eCryptfs daemon to perform
    encryption and decryption. eCryptfs manipulates files in lower filesystems, such
    as JFS or ext3.


    eCryptfs aims to provide the flexibility of a Pretty Good Privacy (PGP) application
    as a transparent kernel service. For that reason, the OpenPGP (RFC 2440) specification
    inspires the basic key handling techniques in eCryptfs. This includes the common
    procedure of using a hierarchy of keys when performing cryptographic operations
    (Figure 2).


    eCryptfs encrypts and decrypts individual data extents in each file using a unique
    randomly generated File Encryption Key (FEK). The FEK is encrypted with the File
    Encryption Key Encryption Key (FEKEK), and the resulting Encrypted File Encryption
    Key (EFEK) is stored in the header of each lower file.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_56_1.png)


    The cryptographic metadata is in the header region of the encrypted lower file.
    Users can transmit the lower file as is to other users, and the recipients can
    access the decrypted contents of the file through eCryptfs, so long as they have
    the proper key. This provides a high degree of flexibility in how the files can
    be handled while maintaining strong security.


    # Using eCryptfs


    eCryptfs requires a kernel component and a user-space component. The kernel component
    ships in the current mainline Linux kernel. See Listing 1 for the minimum kernel
    options necessary to enable eCryptfs. By default, eCryptfs uses the AES cipher.
    eCryptfs can use other ciphers available in the kernel if you build them.


    # Listing 1. Kernel Options Needed for eCryptfs


    ```

    """

    Code maturity level options  ---\>

    [*]  Prompt for development and/or

    incomplete code/drivers


    Security options  ---\>

    <*>  Enable access key retention support


    Cryptographic options  ---\>

    <*>  RMD digest algorithm

    <*>  AES cipher algorithms


    File systems  ---\>

    Miscellaneous filesystems  ---\>

    <*>  eCrypt filesystem layer support  (EXPERIMENTAL)

    """

    ```'
