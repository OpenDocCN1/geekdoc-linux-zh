  mdcn: "\n\n最后，Dojo 事件用于为小部件（widget）提供功能——小部件是 Dojo 对由 HTML 和 CSS 构成的图形用户界面元素的称呼。\n\
    \n## Dojo 中的 Ajax\n\n既然我们已经理解了如何创建和使用 Dojo 事件，接下来就可以看看如何使用 Dojo 执行 Ajax 查询。正如你可能记得的，Ajax（异步\
    \ JavaScript 和 XML）是一种 Web 开发范式，它利用浏览器在后台发起 HTTP 请求的能力。将这种后台 HTTP 请求与 JavaScript、DOM\
    \ 和 CSS 结合，使得创建更具直观性和美观性的 Web 应用程序成为可能。我们可以在没有 Dojo 或其他工具包的情况下创建 Ajax 应用程序，但使用工具包会更容易且更具表现力，仅仅因为它意味着我们可以避免浏览器的差异和不兼容性。\n\
    \n列表 2 展示了 dojo-ajax.html，该页面仅包含一个标记为“按这里”的按钮。当按钮被按下时，用户会看到一个警报框，这与列表 1 中的情况非常相似。但是，在这个版本的程序中，警报框的内容来自一个服务器端程序，在这种情况下定义为非常简短的\
    \ hello.php（列表 3）。\n\n**列表 3. hello.php**\n\n```php\n<? echo “Hello from the server!”;\
    \ ?>\n```\n\n按钮本身的定义方式与我们可能为任何期望附加事件的按钮所做的一样，具有一个 id 属性。它位于一个非常小的 HTML 表单内，该表单命名为\
    \ “theform”：\n\n```html\n<form id=\"theform\">\n    <input type=\"button\" id=\"\
    theButton\" value=\"Press here\" />\n</form>\n```\n\n使用 Dojo 事件，我们将该按钮连接到一个函数（ajaxAlert）：\n\
    \n```javascript\n<script type=\"text/javascript\">\n    var theButton = dojo.byId(\"\
    theButton\");\n    dojo.event.connect(theButton, \"onclick\", ajaxAlert);\n</script>\n\
    ```\n\n剩下的唯一问题是 ajaxAlert 函数做了什么。首先，它创建一个 JavaScript 对象字面量，并将其赋值给局部变量 ajaxArgs。这个对象字面量分配了几个名称，以帮助我们的\
    \ Ajax 调用正常工作：url 是响应我们 Ajax 调用的服务器端程序的 URL，error 指示如果发生错误应调用哪个函数，load 指示如果对 url\
    \ 的调用成功应调用哪个函数，mimetype 定义了我们要从服务器接收的 MIME 类型。\n\n其他一些 JavaScript 工具包的一个恼人之处在于，它们要求你创建自己的名称-值对列表以在\
    \ AjaxRequest 中提交。Dojo 并非如此。通过在我们对象字面量中设置 formNode 名称为一个表单节点，我们可以放心地认为所有表单元素都会被传递给服务器。在此特定情况下，这并不一定有用或有趣，但它确实节省了程序员的一些时间并提高了程序的可读性。\n\
    \n最后，我们的 ajaxArgs 对象被绑定，我们开始运行。点击按钮意味着相关的 Dojo 事件被调用，即 ajaxAlert。该函数由于 dojo.io.bind\
    \ 的存在，然后将其参数发送到定义的 URL，并在成功完成后调用 load 函数。这 surprisingly straightforward（令人惊讶地简单直接），并开辟了使用\
    \ Ajax 的许多可能途径。\n\n## 结论\n\nDojo（我们在本专栏前两期中探讨过的）和 Prototype（我们在 2007 年 1 月刊中看过的）都是\
