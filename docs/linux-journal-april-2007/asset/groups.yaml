  md: "\n# Dojo Events and Ajax\n\nThe quality of your Dojo depends upon your connections.\n\
    \n**REUVEN M. LERNER**\n\nLast month, we began looking at Dojo, one of the most\
    \ popular open-source JavaScript toolkits to emerge in the last year or two. Although\
    \ using a toolkit is not required if you want to include Ajax or sophisticated\
    \ client-side functionality in your Web application, it certainly makes things\
    \ a great deal easier. In particular, such toolkits typically know how to handle\
    \ the many subtle differences in JavaScript implementations on different browsers.\
    \ JavaScript is far more standardized than used to be the case, but a number of\
    \ traps still exist when trying to work with multiple platforms, and using a toolkit\
    \ can relieve you of having to handle them yourself.\n\nIn last month’s article,\
    \ we looked at Dojo’s packaging system, some of its enhancements to the JavaScript\
    \ language and its rich-text editor. This month, we look at some of Dojo’s other\
    \ capabilities that might interest modern Web developers, including support for\
    \ events and Ajax.\n\n## Event Handlers\n\nOne of the cornerstones of JavaScript\
    \ programming is the use of event handlers—functions that are invoked when a particular\
    \ event occurs. For example, we can define a function that opens an alert box:\n\
    \n```javascript\n<script type=\"text/javascript\">\n function openAlert() {\n\
    \ alert('Hello! This is an alert!');\n }\n</script>\n```\n\nWe can then tell the\
    \ user’s browser to invoke our openAlert function whenever someone clicks on a\
    \ paragraph of text:\n\n```html\n<p onclick=\"openAlert();\">This is a paragraph.</p>\n\
    ```\n\nThere are several interesting things to notice in this short example. First,\
    \ we have set the onclick event handler in this case. About a half-dozen other\
    \ event handlers exist from which we could choose. In many cases, we might set\
    \ more than one event handler. This was particularly prevalent in the pre-CSS\
    \ days, when JavaScript event handlers would be used to change the look of an\
    \ icon when the mouse was hovering over it.\n\nSecond, event handlers sometimes\
    \ can be used in contexts you might not expect. For example, the above <p> tag\
    \ has an onclick handler. You normally wouldn’t think of clicking on a paragraph\
    \ of text, but we can do that. This is the basis for some of the modern drag-and-drop\
    \ events.\n\nThird, although JavaScript does make it pretty easy to attach handlers\
    \ to particular events, some messiness still is involved. We cannot define multiple\
    \ event handlers easily or disconnect handlers that have been defined.\n\n## Dojo\
    \ Events\n\nBy this point, you might be wondering what JavaScript event handlers\
    \ have to do with using Dojo for Ajax and modern Web applications. The answer\
    \ is that much of Dojo’s functionality, across all of its many packages, depends\
    \ on the event system. If you want to use Dojo’s Ajax package, for example, you\
    \ need to connect it using Dojo events. This might seem restrictive at first glance;\
    \ however, Dojo events are surprisingly easy to understand.\n\nAs a simple example,\
    \ let's see how we might implement our onclick handler from before using Dojo\
    \ events. First, we need to modify our event-handling function so that it takes\
    \ one argument, the event itself:\n\n```javascript\n<script type=\"text/javascript\"\
    >\n\tfunction openAlert(e evt) {\n\t\talert(\"Hello! This is an alert from Dojo!\"\
    );\n\t}\n</script>\n```\n\nNext, we must connect the paragraph to the event. Rather\
    \ than doing this directly, by setting the onconnect handler, we give our paragraph\
    \ an id tag:\n\n```html\n<p id=\"para\">This is a paragraph.</p>\n```\n\nNow,\
    \ we can use Dojo's dojo.byId function—similar in some ways to Prototype's $()\
    \ function—to get the node itself:\n\n```javascript\nvar para = dojo.byId('para');\n\
    ```\n\nFinally, we connect our paragraph to the handler function we created:\n\
    \n```javascript\ndojo.event.connect(para, 'onclick', openAlert);\n```\n\nIf we\
    \ put it all together, we get the program shown in Listing 1, which I have called\
    \ test-dojo.html.\n\n### Listing 1. test-dojo.html\n\n```html\n<html>\n<head>\n\
    <title>Testing JavaScript with Dojo</title>\n<script type=\"text/javascript\"\
    \ src=\"/javascript/dojo.js\"></script>\n<script type=\"text/javascript\">\ndojo.require(\"\
    dojo.event\");\n</script>\n\nfunction openAlert(evt) {\nalert('Hello! This is\
    \ an alert from Dojo!');\n}\n</script>\n</head>\n<body>\n<p id=\"para\">This is\
    \ a paragraph.</p>\n<script type=\"text/javascript\">\nvar para = dojo.byId(\"\
    para\");\ndojo.event.connect(para, \"onclick\", openAlert);\n</script>\n</body>\n\
    </html>\n```\n\nOne thing you might notice is the three `<script>` tags in the\
    \ file. The first, in the head of the document, downloads dojo.js, the main Dojo\
    \ source file, from the server. The second, also in the head of the document,\
    \ imports the Dojo package for events and defines our event-handling function,\
    \ openAlert. The third and final piece of JavaScript, which attaches the node\
    \ to the event, is in the body of the document, right after our p tag is defined.\
    \ This is because we can set an event handler only for an object that already\
    \ exists, which means after the p tag itself.\n\nIf you load the page into a browser\
    \ window, you will see that it works just like the previous version. Given that\
    \ this version is more complex, it might not seem obvious how it is better:\n\n\
    ### Advanced Dojo Events\n\nHere, then, is one example. Suppose you want to invoke\
    \ one particular object method, rather than a simple function call, in an event\
    \ handler. JavaScript makes it difficult to do this directly from an event handler.\
    \ However, dojo.event.connect handles this quite simply, in its four-parameter\
    \ version. As before, the first two parameters are the node and event that will\
    \ trigger the handler. The third and fourth arguments are the object and function\
    \ that will be invoked. For example:\n\n```javascript\ndojo.event.connect(eventObject,\
    \ \"onclick\", handlerObject, \"handlerMethod\");\n```\n\nDojo also makes it possible\
    \ to connect more than one handler to an event. In non-Dojo JavaScript, you could\
    \ accomplish this only by making your event handler a function that then invokes\
    \ other functions. Using Dojo events, you can connect any number of methods:\n\
    \n```javascript\ndojo.event.connect(para, \"onclick\", testFormContents);\ndojo.event.connect(para,\
    \ \"onlick\", submitFormContents);\n```\n\nEvents are fired in the order that\
    \ they are connected. So, in the above example, testFormContents would be invoked\
    \ before submitFormContents.\n\nNote that Dojo allows you to add the same event\
    \ handler twice, if you want. So, be careful to invoke dojo.event.connect only\
    \ once for each event-handler combination to avoid potentially odd and hard-to-debug\
    \ problems.\n\nThere is even a topic mechanism for Dojo events, which lets you\
    \ create multiple channels for event notifications.\n\nLet's say you want to provide\
    \ an expert mode to your users, so they don't have to see all of the annoying\
    \ alert boxes we're generating. We could create a button that, when pressed, removes\
    \ the event handler from the object—ooh, but now that's getting kind of tricky,\
    \ especially if we have multiple events to deal with.\n\nThe solution is to use\
    \ dojo.event.disconnect, which does what you might expect:\n\n```javascript\n\
    dojo.event.disconnect(para, \"onlick\", testFormContents);\n```\n\ndojo.event.disconnect\
    \ requires that the parameters be completely identical to those used in dojo.event.connect.\
    \ Once it is invoked, however, the event is disconnected. An advanced piece of\
    \ the event system is known as advice, a term that always has confused me, but\
    \ which is common in the worlds of Lisp and aspect-oriented programming. The basic\
    \ idea behind advice is that you can tell the system to invoke a function before\
    \ or after another function. (If you have used Ruby on Rails, this is analogous\
    \ to a filter.) This is admittedly an advanced feature, but it might help when\
    \ debugging an application—rather than inserting logging statements into a problematic\
    \ function manually, you simply can add advice to the function, invoking the logger\
    \ before or after the function is invoked. There is even a topic mechanism for\
    \ Dojo events, which lets you create multiple channels for event notifications.\
    \ (This is similar in some ways to the syslog facility in Linux and UNIX.) Thus,\
    \ a particular object might register its interest when particular events happen\
    \ on another object.\n\n### Listing 2 dojo-ajax.html\n\n```html\n<html>\n<head>\n\
    \  <title>Testing Ajax with Dojo</title>\n  <script type=\"text/javascript\" src=\"\
    /javascript/dojo.js\"></script>\n  <script type=\"text/javascript\"> \n    dojo.require(\"\
    dojo.io.*\");\n    dojo.require(\"dojo.event.*\");\n    function ajaxAlert(evt)\
    \ {\n      var ajaxArgs = {\n        url: \"hello.php\",\n        error: function(type,\
    \ data, evt){\n          alert(\"An error occurred\");\n        },\n        load:\
    \ function(type, data, evt){\n          alert(data);\n        },\n        mimeType:\
    \ \"text/plain\",\n        formNode: document.getElementById(\"myForm\")\n   \
    \   };\n      dojo.io.bind(ajaxArgs);\n    }\n  </script>\n</head>\n<body>\n \
    \ <form id=\"theForm\">\n    <input type=\"button\" id=\"theButton\"\n       \
    \    value=\"Press here\" />\n  </form>\n  <script type=\"text/javascript\">\n\
    \    var theButton = dojo.byId(\"theButton\");\n    dojo.event.connect(theButton,\
    \ \"onlick\", ajaxAlert);\n  </script>\n</body>\n</html>\n```\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_24_0.png)\n\
    \n# Expert Included.\n\nOur product development team constantly juggles multiple\
    \ projects with tight deadlines.\nAs an integral part of this team, Patrick is\
    \ responsible for hardware compatibility, power and performance testing, and operating\
    \ system validation, just to list a few things.\nHe is a fan of the Rackform nSery\
    \ AA43, loaded with four Next-Generation AMD Opteron™ processors, because he appreciates\
    \ the advantages of AMD's Direct Connect Architecture in spreading workload across\
    \ multiple processors. Patrick has a lot to do, which is why he likes a server\
    \ designed to do a lot.\n\nWhen you partner with Silicon Mechanics, you get more\
    \ than an enterprise-quality server—you get an expert like Patrick.\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_24_1.png)\n\
    \nvisit us at www.siliconmechanics.com\nor call us toll free at 866-352-1173\n"
  mdcn: "\n\n# Dojo 事件与 Ajax\n\n你的 Dojo 项目质量取决于你所建立的连接。\n\n**Reuven M. Lerner**\n\n\
    上个月，我们开始探讨 Dojo，这是过去一两年间出现的最流行的开源 JavaScript 工具包之一。尽管如果你希望在 Web 应用程序中包含 Ajax 或复杂的客户端功能，使用工具包并非强制性要求，但它确实让事情变得更加轻松。特别是，这类工具包通常知道如何处理不同浏览器上\
    \ JavaScript 实现之间的许多细微差异。JavaScript 的标准化程度远高于过去，但在尝试跨多个平台工作时，仍然存在一些陷阱，而使用工具包可以免去你自己处理这些问题的麻烦。\n\
    \n在上个月的文章中，我们探讨了 Dojo 的打包系统、其对 JavaScript 语言的一些增强功能以及其富文本编辑器。本月，我们将探讨 Dojo 的其他一些功能，这些功能可能会引起现代\
    \ Web 开发者的兴趣，包括对事件和 Ajax 的支持。\n\n## 事件处理器\n\nJavaScript 编程的基石之一是使用事件处理器——即当特定事件发生时被调用的函数。例如，我们可以定义一个打开警报框的函数：\n\
    \n```javascript\n<script type=\"text/javascript\">\n function openAlert() {\n\
    \ alert('Hello! This is an alert!');\n }\n</script>\n```\n\n然后，我们可以告诉用户的浏览器，每当有人点击一段文本时，就调用我们的\
    \ openAlert 函数：\n\n```html\n<p onclick=\"openAlert();\">This is a paragraph.</p>\n\
    ```\n\n在这个简短的示例中，有几个有趣的点需要注意。首先，在这种情况下，我们设置了 onclick 事件处理器。还有大约六个其他可选的事件处理器。在许多情况下，我们可能会设置多个事件处理器。这在\
    \ CSS 普及之前的日子里尤为普遍，当时 JavaScript 事件处理器常用于在鼠标悬停时改变图标的样式。\n\n其次，事件处理器有时可以用在你意想不到的上下文中。例如，上面的\
    \ `<p>` 标签有一个 onclick 处理器。通常你不会想到点击一段文本，但我们可以这样做。这是现代一些拖放事件的基础。\n\n第三，虽然 JavaScript\
    \ 使得将处理器附加到特定事件变得相当容易，但仍存在一些繁琐之处。我们无法轻松定义多个事件处理器，也无法断开已定义的处理器连接。\n\n## Dojo 事件\n\
    \n读到这里，你可能会好奇 JavaScript 事件处理器与使用 Dojo 进行 Ajax 和现代 Web 应用程序开发有什么关系。答案是，Dojo 在其众多包中的大部分功能都依赖于事件系统。例如，如果你想要使用\
    \ Dojo 的 Ajax 包，你需要使用 Dojo 事件将其连接起来。乍一看，这似乎有些限制；然而，Dojo 事件意外地容易理解。\n\n作为一个简单的例子，让我们看看如何使用\
    \ Dojo 事件实现之前的 onclick 处理器。首先，我们需要修改事件处理函数，使其接受一个参数，即事件本身：\n\n```javascript\n\
    <script type=\"text/javascript\">\n\tfunction openAlert(e evt) {\n\t\talert(\"\
    Hello! This is an alert from Dojo!\");\n\t}\n</script>\n```\n\n接下来，我们必须将段落连接到该事件。而不是直接通过设置\
    \ onconnect 处理器来完成，我们为段落赋予一个 id 标签：\n\n```html\n<p id=\"para\">This is a paragraph.</p>\n\
    ```\n\n现在，我们可以使用 Dojo 的 dojo.byId 函数——在某些方面类似于 Prototype 的 `$()` 函数——来获取节点本身：\n\
    \n```javascript\nvar para = dojo.byId('para');\n```\n\n最后，我们将段落连接到我们创建的处理器函数：\n\
    \n```javascript\ndojo.event.connect(para, 'onclick', openAlert);\n```\n\n如果我们把所有内容组合在一起，就得到了清单\
    \ 1 中所示的程序，我将其命名为 test-dojo.html。\n\n### 清单 1. test-dojo.html\n\n```html\n<html>\n\
    <head>\n<title>Testing JavaScript with Dojo</title>\n<script type=\"text/javascript\"\
    \ src=\"/javascript/dojo.js\"></script>\n<script type=\"text/javascript\">\ndojo.require(\"\
    dojo.event\");\n</script>\n\nfunction openAlert(evt) {\nalert('Hello! This is\
    \ an alert from Dojo!');\n}\n</script>\n</head>\n<body>\n<p id=\"para\">This is\
    \ a paragraph.</p>\n<script type=\"text/javascript\">\nvar para = dojo.byId(\"\
    para\");\ndojo.event.connect(para, \"onclick\", openAlert);\n</script>\n</body>\n\
    </html>\n```\n\n你可能会注意到的一件事是该文件中有三个 `<script>` 标签。第一个位于文档头部，从服务器下载 dojo.js（Dojo\
    \ 的主源文件）。第二个也位于文档头部，导入 Dojo 的事件包并定义我们的事件处理函数 openAlert。第三个也是最后一部分 JavaScript，用于将节点附加到事件，位于文档主体部分，紧跟在我们的\
    \ `<p>` 标签定义之后。这是因为我们只能为已经存在的对象设置事件处理器，这意味着必须在 `<p>` 标签本身之后。\n\n如果你将该页面加载到浏览器窗口中，你会发现它的运行方式与之前的版本完全相同。鉴于这个版本更复杂，它为何更好可能并不显而易见：\n\
    \n### 高级 Dojo 事件\n\n那么，这里有一个例子。假设你希望在事件处理器中调用某个特定对象的方法，而不是简单的函数调用。JavaScript 使得直接从事件处理器执行此操作变得困难。然而，dojo.event.connect\
    \ 处理得相当简单，其四参数版本可以做到这一点。与之前一样，前两个参数是触发处理器的节点和事件。第三和第四个参数是被调用的对象和函数。例如：\n\n```javascript\n\
    dojo.event.connect(eventObject, \"onclick\", handlerObject, \"handlerMethod\"\
    );\n```\n\nDojo 还允许将一个事件连接到多个处理器。在非 Dojo 的 JavaScript 中，你只能通过使事件处理器成为一个进而调用其他函数的函数来实现这一点。使用\
    \ Dojo 事件，你可以连接任意数量的方法：\n\n```javascript\ndojo.event.connect(para, \"onclick\"\
    , testFormContents);\ndojo.event.connect(para, \"onlick\", submitFormContents);\n\
    ```\n\n事件按照连接顺序触发。因此，在上述例子中，testFormContents 将在 submitFormContents 之前被调用。\n\n\
    请注意，Dojo 允许你根据需要添加相同的事件处理器两次。因此，请确保对于每个事件-处理器组合只调用一次 dojo.event.connect，以避免潜在奇怪且难以调试的问题。\n\
    \nDojo 事件甚至有一种主题机制，允许你为事件通知创建多个通道。\n\n假设你想为用户提供专家模式，这样他们就不必看到我们生成的所有烦人的警报框了。我们可以创建一个按钮，按下时从对象中移除事件处理器——哦，但这变得有点棘手了，特别是当我们有多个事件需要处理时。\n\
    \n解决方案是使用 dojo.event.disconnect，它的作用正如你预期的那样：\n\n```javascript\ndojo.event.disconnect(para,\
    \ \"onlick\", testFormContents);\n```\n\ndojo.event.disconnect 要求参数与在 dojo.event.connect\
    \ 中使用的参数完全相同。然而，一旦调用，该事件即被断开连接。事件系统的一个高级部分称为 advice（建议/切面），这个术语一直让我困惑，但在 Lisp\
    \ 和面向切面编程的世界中很常见。Advice 的基本思想是你可以告诉系统在另一个函数之前或之后调用某个函数。（如果你使用过 Ruby on Rails，这就类似于过滤器。）这确实是一个高级功能，但在调试应用程序时可能很有用——而不是手动将有问题的函数中插入日志语句，你可以简单地为该函数添加\
    \ advice，在函数调用之前或之后调用记录器。甚至有一种针对 Dojo 事件的主题机制，允许你为事件通知创建多个通道。（这在某些方面类似于 Linux\
    \ 和 UNIX 中的 syslog 设施。）因此，当特定事件在另一个对象上发生时，特定对象可以注册其兴趣。\n\n### 清单 2 dojo-ajax.html\n\
    \n```html\n<html>\n<head>\n  <title>Testing Ajax with Dojo</title>\n  <script\
    \ type=\"text/javascript\" src=\"/javascript/dojo.js\"></script>\n  <script type=\"\
    text/javascript\"> \n    dojo.require(\"dojo.io.*\");\n    dojo.require(\"dojo.event.*\"\
    );\n    function ajaxAlert(evt) {\n      var ajaxArgs = {\n        url: \"hello.php\"\
    ,\n        error: function(type, data, evt){\n          alert(\"An error occurred\"\
    );\n        },\n        load: function(type, data, evt){\n          alert(data);\n\
    \        },\n        mimeType: \"text/plain\",\n        formNode: document.getElementById(\"\
    myForm\")\n      };\n      dojo.io.bind(ajaxArgs);\n    }\n  </script>\n</head>\n\
    <body>\n  <form id=\"theForm\">\n    <input type=\"button\" id=\"theButton\"\n\
    \           value=\"Press here\" />\n  </form>\n  <script type=\"text/javascript\"\
    >\n    var theButton = dojo.byId(\"theButton\");\n    dojo.event.connect(theButton,\
    \ \"onlick\", ajaxAlert);\n  </script>\n</body>\n</html>\n```\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_24_0.png)\n\
    \n# 专家随行。\n\n我们的产品开发团队不断同时处理多个截止日期紧张的项目。\n作为团队的重要组成部分，Patrick 负责硬件兼容性、电源和性能测试以及操作系统验证，仅仅举几个例子而已。\n\
    他是 Rackform nSery AA43 的粉丝，该服务器配备了四颗下一代 AMD Opteron™ 处理器，因为他欣赏 AMD 的 Direct Connect\
    \ Architecture（直接连接架构）在跨多个处理器分发工作负载方面的优势。Patrick 有许多工作要做，这就是他喜欢一款能处理大量工作的服务器的原因。\n\
    \n当你与 Silicon Mechanics 合作时，你获得的不仅仅是一台企业级质量的服务器——你还获得了一位像 Patrick 这样的专家。\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_24_1.png)\n\
    \n请访问 www.siliconmechanics.com\n或拨打免费电话 866-352-1173\n\n"
