  md: '# The OpenSSH Protocol under the Hood


    The nitty-gritty details as to what OpenSSH is and why it is ubiquitous.


    GRISH VENKATACHALAM


    Is there a program more commonly used in day-to-day Linux computing than SSH?
    I doubt it. Not only is it rock-solid, secure and versatile, but it also is extremely
    simple to use and feature-rich. Because its algorithms and protocols are both
    state of the art and their implementation is open for peer review, we can rest
    assured on the cryptographic integrity of SSH. SSH does have weaknesses, however,
    although most of them stem from social engineering, and working around broken
    protocols, such as X11, pose a big challenge.


    SSH can do wonders in only a few lines of C code—thanks to the UNIX philosophy
    of stringing together powerful tools in generic ways.


    SSH acts as a secure channel, and it makes a remote system appear local, and a
    local one appear at the remote side. It can be used either for remote command
    execution, with or without a pty, and it can be used for multiplexing several
    TCP and X11 sessions. It also can be used for tunneling insecure protocols, such
    as POP3 or SMTP, through secure SSH tunnels. In addition, it can be used with
    some limitations to tunnel FTP securely.


    # The OpenSSH Architecture


    Let’s begin with the overall scheme of things.


    As shown in Figure 1, OpenSSH is composed of three key layers. The bottom layer,
    ssh-transport, is the most critical component involved in all the crypto operations,
    such as key exchange, re-keying at intervals, protecting against attacks in various
    ways and so on.


    The layer on top of ssh-userauth, is responsible for authenticating end users
    to the sshd daemon that runs at the server end. Remember that SSH authenticates
    both ways. The client SSH program authenticates the sshd server daemon using the
    ssh-transport protocol. After authentication, key exchange is completed, and a
    secure connection is established. Subsequent to that, user authentication takes
    place.


    ssh-userauth provides a lot of flexibility, because users can authenticate to
    the server in various ways—from a private key on a smart card to simple user name/password
    authentication. Once it goes through, the ssh-connection layer establishes a secure
    channel, either for executing a remote command or to obtain an interactive login
    shell.


    The ssh-connection layer is capable of multiplexing any number of simultaneous
    independent secure sessions over a single ssh-userauth layer with the transport
    stack layer below it, as shown in Figure 1. All of SSH’s magic—forwarding arbitrary
    TCP ports from local to remote and remote to local, acting as a SOCKS proxy, forwarding
    X11 connections, establishing VPN tunnels, executing remote commands with and
    without a pty—is done with the ssh-connection layer.


    SSH has flow control built in to the protocol. Each secure channel has a separate
    window size allocated. Because SSH operates above a reliable TCP layer, this does
    not have much of a role. At least, it is not as critical as the TCP windowing
    mechanism. Most of the critical channel open/close messages and other termination
    messages don’t consume any window space.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_75_0.png)


    Because all messages are encrypted and integrity protected, nobody can interpret
    the messages. There is a special LMSG_IGNORE message type that can be used for
    defaulting traffic analysis attacks. These are the kinds of attacks that figure
    out when data is going over the wire and how much data is being transferred.


    SSH, of course, comes with many other niceties for sending secure KEEPALIVE messages,
    redirecting stdin to /dev/null for specialized X window applications and many
    more.


    Now, let’s take a look at a sample SSH session and typical message exchanges (Figure
    2).


    Here is a typical unencrypted SSH packet:


    | byte | SSH_MSG_CHANNEL_REQUEST | recipient channel | uint32 | | string | "pty-req"
    | boolean | want_reply |'
