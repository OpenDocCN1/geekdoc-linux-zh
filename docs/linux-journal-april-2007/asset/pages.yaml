    )\n\n// write the SVG to a file\nf = open(\"/tmp/\" + claim + \".svg\", \"w\"\
    )\nf.write(result)\nf.close()\n\n// print the image on the default printer\nos.system(\"\
    inkscape /tmp/\" + claim + \".svg -p | lpr\")\n```\n```\n\ntion. Listing 6 shows\
    \ how we did the same transform we did in Listing 5, except now in Python. The\
    \ example also shows how we called Inkscape to print our claim images.\n\nEarlier,\
    \ I mentioned we often have multiple pages per claim. When printing, this was\
    \ not an issue; we simply would send each page to the printer as a separate job.\
    \ When it came to archiving, we had to do something different. As with the Web\
    \ interface, we had to group the pages, this time into a file, with a Web browser.\
    \ When archiving, we had to store the files in PDF format, because that is what\
    \ our clients wanted. To get the images into a PDF and combine the multiple page\
    \ claims, we used Inkscape and Ghostscript.\n\nAs with printing, Inkscape has\
    \ an option to export a file into PostScript format. Instead of using -p, we use\
    \ -P and pass Inkscape the desired output filename. After all of the pages of\
    \ a claim have been written to files, we use the following Ghostscript command\
    \ to put the pages into a single PDF and archive them:\n\n```\n```\ngs -dBRATCH\
    \ -dNOPAUSE -q -sDEVICE=pdfwrite -sOutputFile=out.pdftmp/foo1.ps\n/tmp/foo2.ps\n\
    ```\n```\n\n# Maintaining the Forms\n\nShortly after we finished the project,\
    \ we were faced with making two rounds of changes to the layout of the form. The\
    \ first round of changes dealt with the positioning of text objects. The second\
    \ round was far more extensive—we had to draw a series of new boxes on the form\
    \ to accommodate a new identification system. Because we could not open the modified\
    \ SVG in Inkscape, we had to make our changes to the master SVG and then apply\
    \ them manually to the XSLT version.\n\nAt first, we thought making the changes\
    \ would be hard and tedious, but it turned out that the process was simple. For\
    \ the first round, we simply made the changes in the master using Inkscape, careful\
    \ to keep a note of the objects we changed. Then, using a text editor, we replaced\
    \ the old portions of XML with the new ones in the XSLT. Because the second batch\
    \ of changes was additions only, we decided simply to make another layer in the\
    \ master to which to add the boxes. When we finished adding the new boxes, we\
    \ simply copied the new layer into the XSLT using a text editor.\n\n# Conclusion\n\
    \nFrom start to finish, our project took a little more than a month to design,\
    \ build, test and publish. Our solution has made all of our applications more\
    \ agile and effective. We have also saved ‘terabytes’ worth of storage space on\
    \ our servers.\n\nCurrently, the SVG adaptation rate is rather slow. We are looking\
    \ forward to seeing what other tools will be built that utilize the versatile\
    \ SVG file format."
  merge: -1
  img_proc: true
- pgno: 92
  md: "# Extract and Parse ODF Files with Python\n\nUse Python to demystify Open Document\
    \ Format files.\n\nKAMRAN HUSAIN\n\nThe Open Document Format (ODF) Alliance is\
    \ designed for sharing information between different word processing applications.\
    \ This article highlights the basic structure of ODF files, some internals of\
    \ the underlying XML files and shows how to use Python to read the contents to\
    \ perform a simple search for keywords. The code also can be the basis for more-advanced\
    \ operations. In the spirit of openness, we use open-source software to read the\
    \ ODF world, which in this case are Python and the OpenOffice.org package.\n\n\
    If you are running a recent version of Linux or OS X, you already should have\
    \ Python and OpenOffice.org installed on your machine. If you need the latest\
    \ versions, Python is available for free from www.python.org for both the Windows\
    \ and Linux platforms.\n\nThe OpenOffice.org package also is available for free\
    \ from www.openoffice.org. Installing OpenOffice.org on an XP desktop is relatively\
    \ painless. Download the packages from their respective sites and run the installer.\
    \ Once installed, simply run the application from the desktop with a click on\
    \ the installed icons.\n\n> Tip  \n> Most folks do have Microsoft Office installed.\
    \ If that’s the case, the solution is to use a plugin for Microsoft Word (sourceforge.net/projects/odf-converter).\
    \ You can install both the OpenOffice.org and Microsoft packages on the same machine\
    \ without causing any conflicts.\n> \n> Please read the Bugs section on the SourceForge\
    \ site for any incompatibilities before you install the plugin. I used the OpenOffice.org\
    \ suite to save the files for this article, because it was easier.\n\nOnce you\
    \ have confirmed that you have the prerequisites, you can create an ODF file.\
    \ Open up the Writer, type some text in a document and save it. You can read in\
    \ a file and save it as an .odf file.\n\nA quick look at extensions in the Save\
    \ dialog reveals a lot. An ODF file can have many extensions, which provide a\
    \ clue as to the type of information stored in it and the application that stored\
    \ it. See Table 1.\n\nSo, what’s in an ODF file? An ODF file is basically a zipped\
    \ archive with several XML files. The actual files and directories in a file will\
    \ vary depending on the type of information and the system on which the document\
    \ was created.\n\nThe first step in picking out the names of the files in an ODF\
    \ file requires unzipping the file itself. Fortunately, Python has built-in support\
    \ for dealing with this endeavor with the zipfile module.\n\nTable 1. ODF File\
    \ Types and Their Extensions  \n| Document Format | File Extension |\n| OpenDocument\
    \ Text | \\*.odt |\n| OpenDocument Text Template | \\*.ott |\n| OpenDocument Master\
    \ Document | \\*.odm |\n| HTML Document | \\*.html |\n| HTML Document Template\
    \ | \\*.oth |\n| OpenDocument Spreadsheet | \\*.ods |\n| OpenDocument Spreadsheet\
    \ Template | \\*.ots |\n| OpenDocument Drawing | \\*.odg |\n| OpenDocument Drawing\
    \ Template | \\*.otg |\n| OpenDocument Presentation | \\*.odp |\n| OpenDocument\
    \ Presentation Template | \\*.otp |\n| OpenDocument Formula | \\*.odf |\n| OpenDocument\
    \ Database | \\*.odb |\n\nType py then on the command line to run an interactive\
    \ shell. Running a shell allows you to examine the contents of objects returned\
    \ from the modules. Because you’ll probably be doing this only once per type of\
    \ data, there is really no need to write and execute a script at this time. If\
    \ you want to preserve the work for future use, it’s better to write a script\
    \ in a text editor or use the IDLE editor that comes with Python and save the\
    \ script. See Listing 1 on how to show the member functions in a class or module.\n\
    \nThe infosplit() command from the Python documentation returns a list the objects\
    \ of a zipped archive. Run the dir() command on the first object from this list\
    \ to get more information stored for each zipped file (Listing 2). This nice feature\
    \ of looking at members in an object is called introspection.\n\nAn iteration\
    \ on the list of objects displays relevant information"
  merge: -1
