    \ new cryptographic filesystem in the Linux kernel uses stacking technology.\n\
    \nMIKE HALCROW\n\nThe media has been delivering a seemingly endless stream of\
    \ reports of lost or stolen laptops, backup tapes, hard drives and servers from\
    \ government and corporate facilities. These devices often contain medical, financial\
    \ and other sensitive data. When the storage devices fall into the wrong hands,\
    \ attackers can access the data directly, completely bypassing the access control\
    \ mechanisms in place in the organization's network. Reports indicate that millions\
    \ of people already have been affected by such compromises. As a result, customers\
    \ and citizens are at an increasing risk of identity fraud and loss of privacy.\n\
    \nAlthough the cryptographic technology to protect data confidentiality has existed\
    \ for decades, many organizations have failed to integrate this technology into\
    \ their processes for handling sensitive data. In cases where cryptography is\
    \ included in that process, it is frequently obtrusive, costly and complicated.\
    \ Organizations sometimes neglect to establish data encryption policies, and employees\
    \ often ignore such policies once they are in place.\n\nIn cases where employees\
    \ attempt to utilize cryptography, they often use it ineffectively. For instance,\
    \ they often select weak keys, and it is easy to save or transfer data inadvertently\
    \ in unencrypted form through insecure media (such as Web e-mail or a USB Flash\
    \ drive). Security strategies that depend on individual applications performing\
    \ their own encryption often fail when the user copies and pastes sensitive information\
    \ to other applications that do not have cryptographic capability.\n\nData encryption\
    \ needs to be made ubiquitous, transparent, flexible, easily deployable, integrated\
    \ into the data handling process and, of course, secure enough to counter sophisticated\
    \ attacks. These properties need to be in effect regardless of the particular\
    \ applications accessing the data. To make encryption services application-agnostic,\
    \ the operating system kernel itself should provide a system-wide\n\ndata encryption\
    \ service for sensitive information written to secondary storage.\n\nPopular Cryptographic\
    \ Filesystem Solutions\nPopular options exist for filesystem encryption under\
    \ Linux, all with various advantages and disadvantages. Device mapper crypt (dm-crypt)\
    \ ships with the Linux kernel and provides block device layer encryption. Loop-AES\
    \ and TrueCrypt, which must be obtained separately from the official Linux kernel,\
    \ also provide encryption at the block device layer. With block device layer encryption,\
    \ the user creates the filesystem on the block device, and the encryption layer\
    \ transparently encrypts the data before writing it to the actual lower block\
    \ device.\n\nThe main advantage of block device layer encryption is that it is\
    \ simple in concept and implementation. Another advantage of block device layer\
    \ encryption is that attackers learn nothing about the filesystem unless they\
    \ have the key; for instance, attackers will not even know the type of filesystem\
    \ or the directory structure. Sparse files can be securely and efficiently supported\
    \ in filesystems on encrypted block devices.\n\nBlock device encryption can have\
    \ disadvantages that stem from the lack of integration with the filesystem itself.\n\
    \n+   ► A fixed region of storage must be pre-allocated for the entire filesystem.\
    \ Resizing the partition later is often an inconvenient process.\n+   \n+   ►\
    \ It can be difficult to change encryption keys or ciphers.\n+   \n+   ► There\
    \ is no flexibility for the block device encryption mechanism to encrypt different\
    \ files with different keys or ciphers.\n+   \n+   ► Applications such as incremental\
