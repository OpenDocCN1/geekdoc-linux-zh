    2006/12/open_xml_one-way.html


    +   - Is OpenXML a one-way specification for most people? www.sutor.com/newsite/blog/open/?p=1145


    +   - A game of Zendo: www.rbweier.com/blog/2006/07/game-of-zendo.html


