  md: "# SECURITY\n\n# This far outstrips the data transmission rate possible with\
    \ port knocking, and having easy access to this amount of packet data opens up\
    \ a huge range of possibilities.\n\ntransmit data. However, even if other fields\
    \ are used, this still cannot result in nearly as much data transmission as using\
    \ packet payloads.) Hence, for a block cipher, an encrypted sequence must contain\
    \ at least (B/2*8) packets, where B is the block size in bits. By itself (would\
    \ not be so bad when considering the general speed and reliability of today's\
    \ networks, but the real issue is out-of-order delivery.\n\nDecrypting garbled\
    \ data results in garbled data, and because there is no notion of a \"connection\"\
    \ (in the TCP sense) between the port knock client and server, the server has\
    \ no ability to re-order out-of-order packets.\n\nPackets may take different routing\
    \ paths, some of which may be slow. Hence, the client must resort to an artificial\
    \ mechanism to try to reduce the potential for out-of-order delivery, time. By\
    \ introducing a time delay between each packet in a knock sequence, say on the\
    \ order of a half second, packet order usually can be maintained by the time the\
    \ packets reach the server. Now, for a block size of 128 bits, the corresponding\
    \ port knock sequence is 128/(2^8) = 8 packets. By factoring in the half-second\
    \ delay, it takes four seconds just to transmit the sequence. For a much longer\
    \ message, such as those would be generated by an asymmetric cipher, this data\
    \ transmission rate is simply not practical.\n\nHaving a limited ability to transmit\
    \ data introduces another limitation in port knocking schemes. It is difficult\
    \ to guard against a replay attack effectively. Anyone who can monitor a knock\
    \ sequence as it is sent from the client to the server is free to replay the sequence\
    \ against the server in an effort to gain the same access. This is an especially\
    \ important issue if the sequence is sent through a NAT device, and the source\
    \ IP that is allowed through the packet filter at the server side is the external\
    \ NAT address. For example, if the port knock client is on an RFC 1918 subnet,\
    \ say 10.10.1.0/24, and the port knock server is on a remote network that is accessible\
    \ only over the open internet, the server must allow access to the NAT IP address.\
    \ Anyone on the same subnet who can replay the sequence will be granted the same\
    \ level of access. Also, anyone on the same subnet has the same level of access\
    \ once a rule is instantiated to accept connections from the NAT address as long\
    \ as the rule exists (no sequence replay is required in this case, and this remains\
    \ true for SPA as well).\n\nThere have been various media on traditional port\
    \ knocking to try to provide a solution for the replay problem, such as making\
    \ time a significant factor, using Skey-style hash function iteration and even\
    \ simply changing the encryption key after each use. However, each of these methods\
    \ requires some state to be maintained by both the port knock client and server\
    \ and does not scale very well when multiple users become involved.\n\nAn additional\
    \ port knocking limitation is that it is extremely easy for a malicious third\
    \ party to bust a knock sequence just by spoofing an additional packet to the\
    \ port sequence as it is sent over the wire by the client. The attacker would\
    \ simply set the source address on the packet to be the same as that of the real\
    \ client and chose the same port number as the last packet sent by the client.\
    \ This extra packet would break the knock sequence, so the server would not allow\
    \ the legitimate client any additional access. Although the chances that people\
    \ would actually do this are relatively small (they still need to be able to monitor\
    \ packets emanating from the client), the main issue is that such\n\n(IDS) that\
    \ is able to monitor traffic between the client and server. This is particularly\
    \ true for encrypted knock sequences, which tend to be longer than simple shared\
    \ sequences. To an IDS, port knocking looks just like a series of probes to various\
    \ ports from a single IP address within a relatively short period of time, and\
    \ this fits the definition of a port scan quite nicely.\n\nAn attack is so trivially\
    \ easy to perform. A single packet is all that is required, and the attacker doesn't\
    \ even need to be inline to the original packet data path.\n\nFinally, knock sequences\
    \ are easily detectable as port scans by any intrusion detection system\n\n# Single\
    \ Packet Authorization\n\nThe end result of the above discussion is that port\
    \ knocking provides some real benefits that enhance security, but some serious\
    \ limitations also need to be addressed. Single Packet Authorization is a relatively\
    \ new protocol that retains all of the benefits of port knocking, but fixes the\
    \ limitations discussed above. The first publicly available SPA implementation\
    \ was released in May 2005 as a piece of software called fwknop (www.cipherdine.org/fwknop).\
    \ fwknop was originally created in 2004 as the first port knocking implementation\
    \ to combine passive OS fingerprinting and port knocking (this made it possible\
    \ to do things like \"accept knock sequences only from Linux-2.4 systems\"), but\
    \ the SPA method is now the most popular (and default) authentication method offered\
    \ by fwknop. Note that fwknop provides both authentication and authorization.\
    \ So, and a full discussion of the difference between the two is beyond the scope\
    \ of this article.\n\nSingle Packet Authorization mandates a similar architecture\
    \ to port knocking. Both the client and server components, the server maintains\
    \ control of a default-drop packet filter, and the server monitors packets passively.\
    \ However, this is where the architectural similarities between port knocking\
    \ and SPA diverge.\n\nSingle Packet Authorization moves the data transmission\
    \ to where it belongs—the application layer. This implies that instead of being\
    \ able to send only two bytes of data per packet, as in the case of port knocking,\
    \ SPA is able to send up to the minimum MTU worth of data (1,500 bytes on Ethernet\
    \ networks) between the client and the server in each packet. This far outstrips\
    \ the data transmission rate possible with port knocking, and having easy access\
    \ to this amount of packet data opens up a huge range of possibilities. The remainder\
    \ of this article discusses Single Packet Authorization as implemented by fwknop.\n\
    \nfwknop defines the following packet format at the application layer:\n\n+  \
    \ > 16 bytes of random data\n+   \n+   > Client username\n+   \n+   > Client timestamp\n\
    +   \n+   > fwknop version\n+   \n+   > Mode (access or command)\n+   \n+   >\
    \ Access (or command string)\n+   \n+   > MDS sum\n\nMany of the fields in the\
    \ SPA packet format have a variable length, but are separated by a : character\
    \ (fields are base64-encoded, so embedded colons cannot break this syntax). Once\
    \ the fwknop client builds the packet format above, the entire packet is encrypted\
    \ using one of two encryption algorithms: the Rijndael symmetric block cipher\
    \ with a 128-bit shared key or the asymmetric ElGamal algorithm with up to a 2,048-bit\
    \ public/private key pair generated by GnuPG. By default, the fwknop client sends\
    \ SPA packets over UDP port 62201,"
