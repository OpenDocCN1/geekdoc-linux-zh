    cluelessness and constant mistakes was the legacy of Steve''s original Art. That
    legacy was not just an OS that was ten years ahead of the rest of the world, but
    a Cause that induced a righteousness of purpose centered around a will to innovate—to
    perpetuate the original artistic achievements. And in Steve''s absence, Apple
    did some righteous innovation too. Eventually, though, the flywheels lost mass
