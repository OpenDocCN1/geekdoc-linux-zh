    managing rules for several different types of firewalls, including iptables: **www.fwbuilder.org**

    +   - The Shorewall (Shoreline Firewall) home page: **www.shorewall.net**

    +   - Suehring, S., and Ziegler, R. *Linux Firewalls*, 3rd edition. Upper Saddle
    River, NJ: Novell Press, 2005.

    +   - Home page for Firestarter, an iptables GUI: **www.fs-security.com**

    +   - Home page for the Guadogod iptables GUI: **www.simonzone.com/software/guarddog**


