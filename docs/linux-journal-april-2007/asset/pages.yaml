  md: "![](img/3c4d8a97b5d96c835281dc0dacbc8551_9_0.png)\n\nwith respect to more desktop-type\
    \ issues) and the professional (which I am, with respect to the development and\
    \ server issues).\n\nIn summary, I have never, in ten years of sub-\nscription,\
    \ been so happy with the diversity,\nscope, depth and accuracy of *Linux Journal*.\n\
    Keep up the excellent work.\n\n–\nSean C. McCord\n\n# What's a Few Zeros\nbetween\
    \ Friends?\n\nQuote from Linux for Suits, February 2007.\n\"The 15Mbps they reserve\
    \ for their Internet\nservice is less than 1% of that capacity.\"\n15 kilobits\
    \ per second really is pathetic.\n\n–\nIan Stirling\n\n# What's a Few Letters\n\
    between Friends?\n\nIn “White Box Phone” (February 2007), you\nsaid that the OpenMoko\
    \ phone came from\nFunambol. I think you meant to say FiC.\n\nFunambol is the\
    \ company behind SyncML\nand push mobile e-mail.\n\n–\nBill Weinberger\n\n# Someone\
    \ Else May Have to\nDecipher Your Code Someday\n\nI’ve already made comments about\
    \ Dave\nTaylor’s column, and you know I’m behind his\ndoing this column and what\
    \ it teaches. My\ncomment is not a criticism of that column but\nwhat I hope is\
    \ viewed as an addendum to it.\n\nThe urge to put an entire sequence of opera-\n\
    tions on “one line” (chained together via\npipes) is noble and quite understandable\n\
    when one is “in a hurry” or doing something\n“quick and dirty.” It isn’t the wisest\
    \ of choic-\nes for beginners or “semi-production” work.\n\nYes, this is arguable,\
    \ but I’d like to reference\nsomething else in your magazine, page 14,\n\"They\
    \ Said It\" (February 2007), the third\nquotation, “Coding up the simplest thing…”\n\
    \nOver time, I’ve learned that as “The next\n\nguy\", trying to read and understand\
    \ code\nwritten by “the guy before me”, that break-\ning a sequence of steps like\
    \ this down into\nthe constituent parts makes maintainability\nand supportability\
    \ significantly easier.\n\nWhile the original state is “easy enough” to\nwork\
    \ with, especially for a demonstration, in\nthe work place, we should encourage\
    \ everyone\nto remember “the next guy” (and there will\nalways be a next guy)\
    \ when we write scripts.\n\nI would, in an environment where this might be\nused\
    \ by someone else and not run every five\nminutes, rewrite this script with these\
    \ additions:\n\n```\n# Comment this line out for debugging.\ntrap '/bin/rm -f\
    \ $tmp1 $tmp2 $tmp3 $tmp4' EXIT\n```\n\n```\ntmp1=/tmp/tmp.1.5\ntmp2=/tmp/tmp.2.5\n\
    tmp3=/tmp/tmp.3.5\ntmp4=/tmp/tmp.4.5\n```\n\n```\ngrep 'google.com/search' $ACCESSLOG\
    \ | \\ \nawk '{print $11}' > $tmp1\n```\n\n```\n< $tmp1 cut -d':' -f2 | cut -d':'\
    \ -f1\n> $tmp2\nsed 's/\\*/ /g;s/N\\*/2/g;s/q//s//`' < $tmp2\n> $tmp3\n```\n\n\
    ```\nsort $tmp3 | uniq -c > $tmp4\nsort -rn $tmp4 | head -5\n```\n\nYes, this\
    \ seems wasteful. (I mention the five\nminutes above to point out that if run\
    \ more\nthan, say every half hour on a moderately busy\nbox, the methods may need\
    \ to be adjusted.)\nMany people will point out a number of issues\nwith this method\
    \ of operation, and one of them\nis going to be “writing to disk so much\ntastes\
    \ a lot of time.” Yes, it does. I’ve never\nbeen a member of the “save the PID”\
    \ crowd\nor the “make it hard to troubleshoot for job\nsecurity” group either.\
    \ Writing to disk a lot is\nmuch cheaper than the rate I get paid. If it\ntakes\
    \ an extra 20% to run, who cares as long\nas it gives the right answer reliably?\n\
    \nUsing the sequence of steps I show above,\n\n# Regarding the Golden Age\nof\
    \ *Linux Journal*\n\nAfter having seen in the past few issues of *LI*\nreaders\
    \ who are disillusioned with the maga-\nnine’s content, I feel I must give counterpoint.\n\
    \nMuch like Mr. Silverton’s setup in the January\n2007 issue, I began using Linux\
    \ in 1995, failing\nfirst to install Red Hat and settling in on the\nastounding\
    \ Slackware distribution from untold\nnumbers of hit-or-miss floppies. Likewise,\
    \ I used\nLinux in a rather amateur fashion for a number\nof years. At that time,\
    \ I subscribed to *Linux*\n*Journal* but found only one or two articles that\n\
    grab my attention. Later, I started a Linux-based\ncompany, designing Linux-based\
    \ solutions for a\nnumber of types of businesses. Even after\nbecoming a Linux\
    \ “professional,” I was no more\ndrawn to the overall quality of *Linux Journal*.\n\
    \nFor many months now, however, I have been\nsimply astonished by the quality\
    \ of most\nevery article. I now read the magazine cover\nto cover. Even the articles\
    \ that are “beneath”\nme often have a gem of information that I\nmay find intriguing.\n\
    \nEven more appealing is the uncanny timeli-\nness of recent issue themes. I have\
    \ never real-\nly been reading edge. After all, it is a\nmonthly publication.\
    \ Recently, though, I have\nhad several issues in a row that have matched\nvery\
    \ closely my personal contemporary inter-\nesta, and I have been delighted by\
    \ the\nbreadth of your coverage. You cover amply\nthe needs of both the amateur\
    \ (which I am,"
  merge: -1
