  md: 'solution is the small file size of the SVG images. If we wanted to archive
    the images, they would take a fraction of the space the old solution did. Because
    SVG images are text, not compressed binary, the files can be compressed and save
    even more space.


    # **Creating the Master SVG**


    One of the things that made the SVG solution so appealing was how easy it would
    be to create and maintain the master SVG image of the form. To do this, we would
    use Inkscape. Inkscape is an SVG-authoring tool that works on Linux, Mac OS X,
    Windows and other UNIX-like operating systems. Other SVG-authoring tools are available,
    but we chose Inkscape because it is open, and it is in the package manager for
    most Linux distributions.


    The first thing we did to create the master SVG was open Inkscape and create a
    new US Letter size document. To keep things organized, we created four layers
    in the new document: scan, overlay, boilerplate and dynamic text. Using the scan
    layer, we imported a scan of a claim. Doing this allowed us to line up everything
    on the Inkscape stage without having to measure anything. After importing the
    image, we locked the layer so that it could not be modified accidentally. Actually,
    after we were finished with each layer on the SVG, we would lock it to ensure
    it was not tampered with.


    Next, we used the overlay layer to trace all the lines and boxes from the original
    claim that we imported. This step was a little tricky. When the image we scanned
    was originally created, the lines were not spaced evenly for one reason or another.
    We decided to line up things correctly on our version. Fortunatley, Inkscape has
    tools to do this automatically. By selecting all of the objects that needed to
    be spaced out (Shift+left-click) and using the Align and Distribute dialog


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_88_0.png)


    (Object→Align and Distribute in the menu), Inkscape fixed the spacing issues.
    When finished, we had something that looked like Figure 2.


    After drawing all of the lines, it was time to add all the boilerplate text. For
    this, we used the aptly named boilerplate layer. Before we got started, we decided
    to remove the scan layer completely, because we no longer needed it. To align
    the text properly, we used the Guides in Inkscape. Guides are exactly what the
    name suggests—guide lines that exist only inside of Inkscape for the purpose of
    aligning objects. To use a guide line, simply click the top or left-hand margin
    and drag the line into place. To get the most out of the guide lines, we enabled
    the Snap points to guides feature (File→Document Preferences→Guides). Doing this
    allowed us to place all of the text exactly in alignment. Figure 3 shows what
    the SVG looked like after this step.


    Finally, we switched to the dynamic text layer and added placeholders where the
    claim data would be located. Again, we used the guides to align everything. For
    the text placeholders, we used a single $ for each block of text. Then, to make
    life easier down the road, we renamed each of the dynamic text objects to something
    relevant. We did this by left-clicking on the object and going to Object→Object
    Properties in the menu. Figure 4 shows the final master SVG with the guide lines.


    Creating the master SVG took about four full hours of work. I would venture to
    guess that it would have taken several days to do this programmatically.


    # **Converting the SVG to an XSLT**


    Once we had the master SVG finished, it was time to convert it into an XSLT. Because
    SVG images are just XML files, we added all of the


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_88_1.png)


    Figure 2. A Trace of the Lines and Boxes from the Claim Form


    Figure 3. The Blank Claim Form Completed'
