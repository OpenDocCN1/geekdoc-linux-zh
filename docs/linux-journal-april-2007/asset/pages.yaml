    # Figure 2. OpenSSH Protocol Flow Diagram


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_76_1.png)


    # Figure 3. OpenSSH Packet Processing


    ```

    string    TERM environment variable value (e.g., vt100)

    uint32    terminal width, characters (e.g., 80)

    uint32    terminal height, rows (e.g., 24)

    uint32    terminal width, pixels (e.g., 640)

    uint32    terminal height, pixels (e.g., 480)

    string    encoded terminal modes

    ```


    Most fields are self-explanatory. The top two fields are always present in all
    messages. The payload packets (what the user types and the responses from the
    server) are all carried with the SSH_MSG_DATA message type.


    Every packet has a header that describes the contents of the payload (message
    type) and the channel for which it is destined.


    Some of the messages do not need a response from the other side, as the underlying
    layer is not only reliable but also tamper-resistant. But, most requests from
    the client have a corresponding response from the server.


    Now, let''s get to the gory details of the SSH key exchange protocol, because
    that is the most critical component that accounts for the security and popularity
    of SSH.

    Figure 3 shows the data manipulations that are necessary to encrypt, compress
    and integrity-protect. Of course, we need to protect ourselves against replay
    attacks as well. For that, there is an implicit sequence number for each packet,
    and it starts at 0 and goes to 232 before wrapping around. Because the sequence
    number is hashed, it can be sequential, and attackers never can guess what input
    will lead to what hash.


    The key components of OpenSSH keys are:


    +   - Hash: H.

    +   - Shared secret: K.

    +   - Session ID: session_id.


    SSH uses the above components to derive the following encryption'
