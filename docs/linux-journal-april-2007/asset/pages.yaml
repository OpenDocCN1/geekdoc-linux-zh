- pgno: 94
  md: "# Listing 3. Extracting files for the ODT Archive\n\n```\n```python\nimport\
    \ sys, zipfile\nif len(sys.argv) < 2:\n    print 'Usage: extract odf-filename\
    \ outputfilename\n    sys.exit(0)\n\nmyfile = zipfile.ZipFile(sys.argv[1])\nlistoffiles\
    \ = myfile.infolist()\nfor s in listoffiles:\n    if s.orig_filename == 'META-INF/manifest.xml':\n\
    \        fd = open(sys.argv[2], 'w')\n        bh = myfile.read(s.orig_filename)\n\
    \        fd.write(bh)\n        fd.close()\n```\n```\n\ndisk as an independent\
    \ file. Listing 3 shows how to extract the manifest.xml file.\n\nFor more than\
    \ one file, you can use a list instead of the if clause:\n\n```\n```python\nif\
    \ s.orig_filename in ['content.xml', 'styles.xml']:\n```\n```\n\nThis way, you\
    \ can extract whatever files you need to look at simply by reading in their contents\
    \ and either manipulating them or writing them off to disk.\n\nThe contents of\
    \ an XML file are best suited for manipulation as a tree structure. Use the XML\
    \ parsing capabilities in Python to get a tree of all the nodes within an XML\
    \ file. Once you have the tree in a content file, you easily can get to the `<text:p>`\
    \ nodes. You don't really have to extract the file to disk, because you also can\
    \ run an XML parser on the string just as well as reading from a file.\n\nThere\
    \ are two types of XML parsers, SAX and DOM. The SAX parser is faster but less\
    \ memory-intensive, because it reads and parses an input file one tag at a time.\
    \ You can only one tag at a time to work with and must track data yourself. In\
    \ contrast, the DOM parser reads the entire file into memory and therefore provides\
    \ better options for navigating and manipulating the XML nodes.\n\nLet's look\
    \ at examples of using both SAX and DOM, so you can see which one suits your purpose.\
    \ The SAX example shows how to extract unique node names from an XML file. The\
    \ DOM example illustrates how to read values from within specific nodes once the\
    \ file has been read completely into memory.\n\nFirst, let's use the SAX parser\
    \ to see what node are available in the content.xml file. The code simply prints\
    \ the name of each type node found in the file. Note that for different types\
    \ of files you may get different node names (see Listing 4).\n\nA SAX program\
    \ requires a class derived from `ContentHandler` and overriding functions to handle\
    \ the start, middle and end of each node. The `tagHandler` class shown in Listing\
    \ 4 is used primarily to track the start of each node and ignore the contents.\
    \ Here use the `keys()` method to list the names into a list that you also can\
    \ sort(). I use this technique quite often to get a sorting of unique members\
    \ quickly, because the hashing functions in Python dicto-\n\n# Listing 4. List\
    \ uniq Tag Numbers\n\n```\n```python\n#\n# This program will list out the uniq\
    \ tag\n# names in a XML document.\n# Author: Kamran Mousin\n#\n\nimport sys\n\
    from xml.sax import parse, ContentHandler\n\nclass tagHandler(ContentHandler):\n\
    \    def __init__(self, tagname = None):\n        self.tag = tagname\n       \
    \ self.uniq = {}\n\n    def startElement(self, name, atr):\n        if self.tag\
    \ == None:\n            self.uniq[name] = 1;\n        elif self.tag == name:\n\
    \            self.uniq[name] = name\n            # ignore attributes for now\n\
    \n    def getNames(self):\n        return self.uniq.keys()\n\nif __name__ == '__main__':\n\
    \    mytagHandler = tagHandler()\n    parse(sys.argv[1], mytagHandler)\n    myNames\
    \ = [str(x) for x in mytagHandler.getNames()]\n    myNames.sort()\n    for x in\
    \ myNames: print x\n```\n```\n\nnaries are very fast. Here's the output from the\
    \ program:\n\n+   - office:automatic-styles\n+   - office:styles\n+   - office:document-content\n\
    +   - office:font-face-decls\n+   - office:forms\n+   - office:text\n+   - style:font-face\n\
    +   - style:list-level-properties\n+   - style:paragraph-properties\n+   - style:style\n\
    +   - style:text-properties\n+   - text:a\n+   - text:line-break\n+   - text:list\n\
    +   - text:list-item\n+   - text:list-level-style-bullet\n+   - text:list-style\n\
    +   - text:p\n+   - text:s\n+   - text:sequence-decl"
