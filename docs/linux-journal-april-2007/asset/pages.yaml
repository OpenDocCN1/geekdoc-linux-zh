    +   - Statement from Wal-Mart CTO: news.com.com/Wal-Mart+eyes+Microsoft+for+W+eb+build-out/2100-1017_3-6152247.html


    +   - Why Redmond feels so threatened by ODF: computerworld.co.nz/news/nst/tech/CBE41F838EABA40C25717AA01A0EC9


