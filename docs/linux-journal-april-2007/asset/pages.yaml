  md: "# **IN-DEPTH**\n\ntext:sequence-decls  \ntext:span\n\nI sorted the list of\
    \ keys and printed only the types of tags found. You will have many tags, and\
    \ the order of the listed tags is not the way they are found in the XML files.\
    \ The tag you most likely will be concerned with is <ctext:p>, which has the text\
    \ in each paragraph. In this example, I want to search for keywords in the text\
    \ for one or more paragraphs in a document.\n\nAlthough I can use the SAX version\
    \ of the program to search for the text, I use the DOM libraries, because the\
    \ code will be a little easier to write (and subsequently, easier to maintain),\
    \ and I promised an example of this earlier.\n\nThe xml.dom and xml.dom.minidom\
    \ packages in Python allow for reading in XML files as DOM trees. Both packages\
    \ come with a standard Python installation. Use the minidom package as it has\
    \ a smaller footprint and is easier to use than the dom package. The minidom package\
    \ is sufficient for almost all my XML work, and I have never really needed the\
    \ heavyweight xml.dom package. See Resources for more information.\n\nUse the\
    \ minidom packages to read the elements of an XML file into a tree-like structure.\
    \ The nodes of the tree are objects based on the Node class in Python. The output\
    \ from Listing 4 provides the names of nodes.\n\nUp to this point, you have been\
    \ using simple programs to list and extract data from the archive. Now, the next\
    \ example runs a search operation on the file you’ve just read in. Look at the\
    \ program in Listing 5.\n\nThe program is designed to work as a class that reads\
    \ and searches for text in an ODF file. Declaring a class for the ODF reader helps\
    \ in organizing the code for searching text within a node. The showManifest()\
    \ member function simply tells me what files exist in the ODF file. In this particular\
    \ program, I collect all the text as a list of paragraphs, and then I search for\
    \ the keywords passed in from the command line. If the searched word matches,\
    \ the paragraph is printed out.\n\nThe text found in each <text:p> is Unicode\
    \ text. You have to convert this to normal text in order to print correctly and/or\
    \ use in a widget. The encode() command translates the Unicode to a printable\
    \ string.\n\nUnicode provides a unique number for every character, regardless\
    \ of the platform, program and language being used. The ability to work seamlessly\
    \ with the same text across multiple platforms is a great feature for Unicode-enabled\
    \ applications. Such features do come with a price for some legacy operations.\
    \ Each Unicode character can have flags as bits set for special printing and so\
    \ on, which causes a normal print statement to interpret each character as a number\
    \ instead of text. In Python, the encode() member function of a Unicode string\
    \ returns a printable version of the string. Here is an example code snippet for\
    \ that:\n\n```\n```python\ndef findIt(self,name):\n    for s in self.text_in_paras:\n\
    \        if name in s:\n            print s.encode('utf-8')\n```\n```\n\nThe code\
    \ in Listing 5 is not limited to an ODF file. You can\n\n# **Listing 5. Reading\
    \ and Parsing the ODF in Python**\n\n```\n```python\nimport os, sys\nimport zipfile\n\
    import xml.dom.minidom\n\nclass ODFReader:\n    def __init__(self, filename):\n\
    \        \"\"\"\n        Open an ODF file.\n        \"\"\"\n        self.filename\
    \ = filename\n        self.m_odf = zipfile.ZipFile(filename)\n        self.filelist\
    \ = self.m_odf.infolist()\n\n    def showManifest(self):\n        \"\"\"\n   \
    \     Just tell me what files exist in the ODF file.\n        \"\"\"\n       \
    \ for s in self.filelist:\n            s.doc_time, \\\n            s.filename,\
    \ s.file_size, s.compress_size, \\\n            print s.orig_filename\n\n    def\
    \ getContents(self):\n        \"\"\"\n        Just read the paragraphs from an\
    \ XML file.\n        \"\"\"\n        ostr = self.m_odf.read('content.xml')\n \
    \       doc = xml.dom.minidom.parseString(ostr)\n        paras = doc.getElementsByTagName('text:p')\n\
    \        print \"I have \", len(paras), \" paragraphs \"\n        self.text_in_paras\
    \ = []\n        for p in paras:\n            for ch in p.childNodes:\n       \
    \         if ch.nodeType == ch.TEXT_NODE:\n                    self.text_in_paras.append(ch.data)\n\
    \n    def findIt(self,name):\n        for s in self.text_in_paras:\n         \
    \   if name in s:\n                print s.encode('utf-8')\n\nif __name__ == '__main__':\n\
    \    \"\"\"\n    Pass in the name of the incoming file and the\n    phrase as\
    \ command line arguments. Use sys.argv[]\n    \"\"\"\n    filename = sys.argv[0]\n\
    \    phrase = sys.argv[1]\n    if zipfile.is_zipfile(filename):\n        myodf\
    \ = ODFReader(filename)     # Create object.\n        myodf.showManifest()   \
    \        # Tell me what files\n                                       # we have\
    \ here\n        myodf.getContents()            # Get the raw\n               \
    \                        # paragraph text.\n        myodf.findIt(phrase)     \
    \      # Find the phrase ... \n```\n```"
  merge: -1
  img_proc: true
