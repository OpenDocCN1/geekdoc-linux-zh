    styles.xml\nmeta.xml\nThumbnails/thumbnail.png\nsettings.xml\nMETA-INF/manifest.xml\n\
    ```\n```\n\n# Listing 2. List the Files in the ODT Archive\n\n```\n```\nimport\
    \ sys, zipfile\nmyfile = zipfile.ZipFile(sys.argv[1])\nlistoffiles = myfile.infolist()\n\
    for s in listoffiles: print s.orig_filename\n```\n```\n\nThe most important file\
    \ in the archive is the content.xml file, because it contains the data for the\
    \ document itself. I discuss this file here; however, for detailed information\
    \ on each tag and so on, take a look at the specification in the 2,000+-page PDF\
    \ file from the OASIS Web site (see Resources).\n\nBasically, the content.xml\
    \ file looks like a DHTML file with tags for all the contents. The tag I was concerned\
    \ with most for my search operation was the <text:p> tag and its closing tag </text:p>,\
    \ which wraps paragraphs in a document. I'll show you how to get this tag from\
    \ a content file later in this article.\n\nabout each file, such as when it was\
    \ created, its extracted size, its compressed size and so on. It's better at this\
    \ point to write a Python script and run it rather than work at the command line\
    \ of an interactive Python shell. This way, you can preserve the script for later\
    \ use. So, open up a text editor and type in the script.\n\nOther files of interest\
    \ in the archive are the META-INF/manifest.xml, mimetype, meta.xml and styles.xml\
    \ files. Other files simply contain data for configurations for the word processors\
    \ reading and displaying the contents file.\n\nThe import statement allows you\
    \ to use the sys module for getting a command-line argument of the file, and the\
    \ zipfile module loads in the functionality for reading and unzipping files. As\
    \ you saw from the Python shell, the infolist() method on the zipfile archive\
    \ lists the files in it. So iterating over the items from the infolist() and then\
    \ calling an orig_filename member function gives you a list of all files in the\
    \ archive.\n\nThe manifest is simply a XML file with a listing of all the files\
    \ in the zipped archive. The mimetype file is a single line containing the mimetype\
    \ of the content file. The meta.xml contains information about the author, creation\
    \ date and so on. The styles file contains all the formatting styles for displaying\
    \ the file.\n\nFor more detailed information, try something like this:\n\nYou\
    \ can extract any of these files from the ODF file with the read() method on the\
    \ zip object to get it as a very long string. Once read, you can modify, view\
    \ and write the whole string to"
