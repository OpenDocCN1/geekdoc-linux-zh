  md: 'market impact (which in the cases of Lisa and NeXT were disappoint-ing), all
    four were remarkable artis-tic achievements. They were also inventions intended
    to mother necessity—and reasonably so. That''s how all radical innovations work.
    (Less forward marketers, including Bill Gates, wait for necessity to mother invention,
