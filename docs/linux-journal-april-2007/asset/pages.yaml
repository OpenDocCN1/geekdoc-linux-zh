  md: '# QUICK TAKES


    # MySQL Deserves a Double Take


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_47_0.png)


    What you don’t know about MySQL could hurt you.  REUVEN M. LERNER


    **In early 1995**, when Windows 95 was still vaporware and Red Hat was the upstart,
    user-friendly alternative to Slackware, I worked for the “Pathfinder” site at
    media giant Time Warner. Like all media companies, Time Warner realized that the
    Web was going to take off, but wasn’t sure just how that would happen.


    So, it hired a bunch of programmers and designers, and gave us the opportunity
    to experiment with different types of designs and applications. It was a wonderful
    job, with some creative, smart and interesting people. And, during my time there,
    I created all sorts of applications—quizzes, mail auto-responders, games, search
    engines and even a personalized version of Money magazine’s “Best Cities” rankings.


    As the applications I built became increasingly sophisticated, it became obvious
    that the text files I often used for data storage and retrieval were neither efficient
    nor flexible enough for a site as large and popular as ours. Finally, someone
    introduced me to our newly hired database guru, who taught me about the wonders
    of relational databases and SQL. I was hooked, and I enjoyed working with the
    database server that we had installed.


    When I wanted to reap the benefits of SQL on my Linux box at home, my options
    were, unfortunately, limited. I found a number of abandoned open-source database
    projects, but, nothing that was as powerful as Time Warner’s Sybase server or
    even in the same league. So, you can imagine my delight when I discovered MySQL.
    No, it didn’t do all the things that Sybase did, and it wasn’t released under
    an open-source license. But, it was free of charge, it was easy to install and
    it had enough features to keep people like me relatively happy.


    Internet service providers felt similarly, and began to install it on their systems—first
    as a competitive advantage over their rivals, and then because everyone else was
    including it in the base configuration. Fast-forward more than a decade, and MySQL
    is by far the best-known open-source relational database. Monty Widenius and David
    Axmark, whom I met back when they were the only full-time MySQL programmers, are
    now at the top of a large corporate pyramid.


    MySQL AB now distributes its products under the GNU General Public License (GPL),
    with a closed-source license available to those who require it. It runs, as always,
    on a very large number of different operating environments. And, it is still developed
    at a feverish pace by people around the world, who submit patches and suggestions.
    This is the first of three articles on open-source databases.


    # Recent versions of MySQL also offer the ability to create a stored procedure
    or function, which provides both increased speed and centralized control over
    commonly used functions.


    month, I discuss MySQL, including its use, features and problems. The next article
    will include a similar analysis of PostgreSQL, and the third article in the series
    will compare the two databases.


    # Starting with MySQL


    One of MySQL’s claims to fame is the ease with which people can get started using
    it. And, indeed, when you compare MySQL with many commercial databases, it is
    strikingly simple. You install it (typically with an RPM or Deb, but compiling
    it from source is also straightforward), and start up the database server with
    **safe\_mysql**. (You also could use the plain mysqld command, but then you wouldn’t
    benefit from some of the behind-the-scenes housekeeping that safe\_mysql offers.)


    Once you have started the server, you can create one or more databases. (I admit
    it is somewhat confusing that MySQL is often referred to as a database when, in
    fact, it is a database server, offering you the chance to create one or more databases.
    Each database contains one or more two-dimensional tables.) To create a database,
    use the mysqladmin program:


    ```

    mysqladmin create testdb

    ```


    It is quite possible, depending on your configuration, that the above command
    worked without a hitch—particularly if you are logged in as the root user under
    Linux. However, your system administrator might have (wisely) decided to set a
    password for the MySQL root user, in which case, you need to type:


    ```

    mysqladmin -p create testdb

    ```


    The -p option tells mysqladmin that you want to enter a password for this account.
    You also can specify the root user, or any other user, with the -u option, as
    in:


    ```

    mysqladmin -u mysqlroot -p create testdb

    ```


    Once you have created a database, you then can connect to it with the mysql client
    program:


    ```

    mysql -u mysqlroot -p testdb

    ```'
