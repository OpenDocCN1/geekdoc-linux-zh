  md: '# **WHY AN iPhone WHEN WE CAN MAKE OUR OWN OPEN PHONE?**


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_41_0.png)


    **DOC SEARLS**


    **Let''s break up the cell-phone silos, for everybody''s good.**


    **I''m writing this** in the aftermath of the 2007 Consumer Electronics Show.
    I attend CES every year, because it''s always a treasure trove of interesting
    Linux stories and use cases (a few of which appear in the UpFront section of *LJ*
    this month), and also because it''s always fun to see what''s happening with a
    large old industry that''s changing a lot more slowly than the annual hype suggests.
    Many consumer electronics “revolutions” aren''t. Such will likely be case this
    year with the arrival of Apple''s new iPhone. I don''t know if scheduling MacWorld
    and CES for the same week happened by accident or intent, but the effect was predictable:
    Steve Jobs'' customarily charismatic and news-packed opening keynote at MacWorld/Charisumic
    outpaced all of CES—a tradeshow exceeded in size only by Europe''s CeBIT.


    The biggest news in Steve Jobs'' speech was the iPhone. He called it “a revolutionary
    product…that changes everything”. He said it would cause a revolution on the scale
    of the Macintosh in 1984 and a iPod in 2001. He even said the iPhone qualified
    as one both “three revolutionary products”: These were 1) “a wide-screen iPod
    with touch controls”, 2) “a revolutionary mobile phone” and 3) “a breakthrough
    Internet communications device”. He contrasted it with “smartphones”, such as
    the Trio, Blackberry, Nokia E62 and Moto Q, all of which feature keyboards that
    “are there whether you want them or not”.


    The iPhone is faced with a large, sharp color screen and a patented pointing system
    called MultiTouch that lets you use multiple fingers to do all kinds of stuff.
    (Except, of course, punching phone numbers without looking at them, because all
    the numbers are displayed behind a layer of clear tactile camouflage.) In the
    Apple tradition, controls are minimal: there''s a single button on the front and
    few others elsewhere.


    At the top of techie conversation at CES was news that the phone would run on
    Apple''s BSD-based OS X and support “desktop class” applications. That claim,
    and the one about iPhone being a “revolutionary Internet communications device”,
    fueled hope that Apple would help break the cell-phone industry out of the phone-maker/carrier
    silos that have trapped customers inside and kept independent developers outside
    for the duration. In a post on the Linux Journal Web site, I wrote:


    Knock what''s closed about the iPhone all you want; it''s still a computer with
    a mike, a screen, a speaker and a pile of other input and output openings that
    invite developers of many kinds. That''s why I think iPhone is going make the
    cell-phone market a lot bigger. It will encourage participation by developers
    and customers that have until now been forced to cope with far less than they''ve
    wanted from the cell-phone industry. And that includes all the legacy cell-phone
    players with which Apple now partners or competes.


    I should have known better. In fact, I did, but ignored my inner cynic. Back in
    1997, when Steve Jobs returned to Apple after a long hiatus, one of his first
    moves was to kill off clones of the company''s hardware. In the midst of the outcry
    that followed, I wrote this to Dave Winer, who published it on his own site [www.scripting.com/davenet/stories/
    DocSearlsonSteveJobs.html](www.scripting.com/davenet/stories/ DocSearlsonSteveJobs.html).


    So Steve Jobs just shot the cloners in the head, indirectly doing the same to
    the growing percent-age of Mac users who preferred cloned Mac sys-tems to Apple''s
    own. So his message to everybody was no different than it was at Day One: all
    I want from the rest of you is your money and your appre-ciation for my Art.


    It was a nasty move, but bless his ass: Steve''s Art has always been first class,
    and priced accordingly. There was nothing ordinary about it. The Mac “ecosystem”
    Steve talks about is one that rises from that Art, not from market demand or other
    more obvious forces. And that Art has no more to do with developers, customers
    and users than Van Gogh''s has to do with Sotheby''s, Christie''s and art collectors.


    See, Steve is an elitist and an innovator, and damn good at both. His greatest
    achievements are novel works of beauty and style. The Apple I and II were Works
    of Woz; but Lisa, Macintosh, NeXT and Pixar were all Works of Jobs. Regardless
    of their'
  merge: -1
