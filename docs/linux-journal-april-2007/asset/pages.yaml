- pgno: 36
  md: 'requirements. You run the risk of wasting time on rules you don’t need and
    of overlooking rules that you do need.


    I further recommend that whatever policy you decide on, you make it as restrictive
    as is feasible. Marcus Ranum very succinctly stated the guiding principle for
    firewall design many years ago: “that which is not expressly permitted is forbidden”.
    The reason for this is quite simple; just because you can’t think of how an allowed
    but unnecessary network transaction can’t be abused, doesn’t mean some attacker
    can’t abuse it nonetheless.


    Every firewall policy, therefore, must logically end with a rule that blocks everything
    not specified earlier.


    This is true not only for network/enterprise firewall policies, but also of personal/local
    firewall policies. A common blunder on personal firewalls is to allow all “outbound”
    transactions, on the assumption that all local processes are “trusted”. If your
    system is infected with a worm, trojan or virus, however, this assumption breaks
    down.


    In the event of such an infection, you probably don’t want the malware to be able
    to use your system to send spam, participate in distributed denial-of-service
    attacks and so forth. Therefore, it’s preferable to restrict not only “inbound”
    (externally originated) network transactions, but also outbound (internally/locally
    originated) transactions, even on the local firewall policies of desktop systems
    and servers.


    Another important firewall design principle is, whenever possible, to group similar
    risks together. In other words, systems and networks with different levels of
    trust and different levels of exposure to risk should be isolated from each other
    by network firewalls.


    The classic example of this principle in action is the DMZ or de-militarized zone,
    which is a network containing all of an organization’s Internet-accessible systems.
    Figure 1 shows the relationship between such a DMZ: the “internal” network containing
    an organization’s workgroups and other non-public-facing network resources and
    the Internet.


    With firewalls separating the DMZ network from both the Internet and the internal
    (trusted) network, you can write rules that specify, in a very granular way, how
    hosts in these three zones can interact with each other.


    In formulating such rules, you should assume that, being exposed to a nearly infinite
    range of possible attackers (via the Internet), the hosts in your DMZ should be
    treated as semi-trusted at best—that is, you should assume that any host in the
    DMZ may be compromised at some point.


    Accordingly, you should allow as few transactions as possible to be initiated
    from the DMZ to the internal network.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_36_0.png)


    You also should take into consideration the threat a compromised DMZ host could
    pose to the outside world. If an Internet-based attacker compromises your DNS
    server, for example, even if the attacker’s attempts to hack into your internal
    network are blocked by firewall rules, that attacker can still cause your organization
    embarrassment or even legal problems if the compromised server is able to connect
    arbitrarily (that is, atflick) to other systems on the Internet. I can’t state
    this often or strongly enough: firewall policies should allow only the bare minimum
    set of network transactions necessary for your users and systems to do their jobs.
    Unnecessary dataflows can and will be abused, sooner or later.


    You probably noticed that in Figure 1, two firewalls are used. This is the classic
    firewall sandwich DMZ architecture, but many organizations opt instead for a more
    economical multi-homed-firewall DMZ architecture (Figure 2), in which a single
    firewall with multiple network interfaces interconnects and restricts traffic
    between different networks. Although the sandwich topology provides greater protection
    against, for example, the external firewall itself being compromised in some way
    (assuming the other firewall isn’t subject to the exact same vulnerability), the
    non-homed-firewall approach can be equally effective, so long as you write your
    rules carefully enough.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_36_1.png)


    Also, regardless of whether you use a single multi-homed firewall or a pair of
    firewalls, it’s extremely important that each network zone (inside, outside/internet
    and DMZ) be connected to a dedicated physical network interface on a firewall.
    Yes, this does make your firewall a potential single point of failure. However,
    if it’s possible for hosts in one network zone to route packets to other network
    zones without traversing the firewall, your firewall will have little practical
    value!


    The last general firewall design principle I mention for now applies only to multi-interface
    firewalls (that is, not to local/personal firewalls): always use anti-looping
    rules.


    Consider the Internet-facing firewall in Figure 1. It has two network interfaces:
    inside (which faces the DMZ) and outside (which faces the Internet). Suppose that
    the internal network in Figure 1 uses IP addresses in the Class C network space
    192.168.55.0/24, and the DMZ'
