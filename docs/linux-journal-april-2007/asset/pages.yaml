  md: '# **IN-DEPTH**


    Listing 5. A Portion of the PHP Script That Transforms the Claim XML into an SVG
    and Displays It in a Browser


    ```

    // import the SVG XSLT

    $xs1 = new XSLTProcessor();

    $xs1->importStyleSheet(DOMDocument::load("svg_xslt.xsl"));


    // load the claim data XML

    // $claim is the database result from Listing 4

    $doc = new DOMDocument();

    $doc->loadXML($claim);


    // tell the browser this is a SVG document

    header("Content-Type: image/svg+xml");


    // print the SVG to the browser

    echo $xs1->transformToXML($doc);

    ```


    Firefox has built-in support for SVG images starting with version 1.5. However,
    Firefox does not support several aspects of SVG images, such as scaling and grouped
    objects. Fortunately for us, all of our users use an up-to-date version of Firefox.


    That is all there is to it. Figure 5 shows a claim image with all of the data
    filled in.


    # ## Printing and Archiving the SVG Images


    Once we finished the Web end of our solution, we turned our sights toward the
    rest of our integration. This meant we had to print the SVG images and find a
    way to archive them. Some clients request that we send them copies of the claims
    printed and/or electronically. Because all of our back-end software is written
    in Python, it also meant we had to do the XML transformation in a different language.
    To do all of the XML work, we used the 4Suite XML API.


    To print the images, we again turned to Inkscape, because our PostScript printer
    drivers would not print the SVG images. Inkscape has a handful of command-line
    options that tell Inkscape to run in command-line mode, thus suppressing the graphical
    interface. The one we used to print is the `-o` option. This, combined with the
    `lp` command, allowed us to print our images without any user interaction.


    # ## Displaying the Final SVG in a Browser


    At first, the primary point of creating this solution was to display claims in
    our Web interface. All of our Web applications are written in PHP5 and run in
    an Apache/mod_php environment. To do the XSLT transformation, we used the XSL
    functions in PHP. This set of functions comes as an extension to PHP. The extension
    is as front end to the libxslt C library.


    The XSLT extension makes doing the translation easy. Listing 5 shows a portion
    of a PHP script that transforms the claim XML into an SVG and displays it in the
    browser.


    Listing 5 is a simplified version of our solution. In our solution, there is the
    possibility of having multiple pages for a single claim. To fix this, we had to
    do multiple transformations, one for each page. To get the multiple-page claims
    to display in the same browser window, we had to embed them. This can be done
    using the embed and object HTML tags. Note that there are several issues with
    browser compatibility when using these tags. To solve the compatibility issues,
    we wrote a script that checks the user''s browser and decides which tag to use.
    Then, we set the target object/embedded source to a script similar to the one
    in Listing 5. This allowed the Web browser to display multiple SVG images in the
    same window.


    Other considerations must be made when using SVG images in a Web browser environment.
    Internet Explorer does not have native support for SVG images. The user is forced
    to use a third-party plugin to display the images. Adobe provides one of these
    for free. Mozilla


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_90_0.png)'
