    file. Run the program in Listing 3 to get the contents.xml file out, and then
    run the second program (shown in Listing 4) to list the types of nodes. Below
    is a sample .ods file; note that this file also has paragraphs in addition to
    the table tags:


    ```

    office: automatic-styles

    office:body

    office:document-content

    office:font-face-decls

    office:scripts

