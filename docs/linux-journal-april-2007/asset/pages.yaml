- pgno: 29
  md: '# **COLUMNS**

    # COOKING WITH LINUX


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_29_0.png)


    up (Figure 4). What follows next is interesting only the first few times—mostly
    because you probably have better things to do with your time. The screen shows
    a report of the backup broken up into file sets, the creation of boot disksettes
    and so on. At this point, Mondo Rescue is ready to back up your data and displays
    a nice progress bar, telling you which ISO is being written, how much of it is
    done and how long you can expect the whole process to take (Figure 5).


    Speaking of better things to do with our time, this is probably a good time for
    a wine refill. Francois, please make sure our guests’ glasses are topped up.


    This is all well and good, but sitting in front of a terminal session running
    a backup isn’t what most people want to do most of the time. Consequently, all
    of this can be done from the command line, which is exactly what you want if you
    are going to run the program from a cron job. For example, take a look at the
    following command:


    ```

    mondoparchive -0/d /mnt/bigdrive 1 GRUB -f -3 -N

    ```


    That command says to create a mondoparchive backup (-0), to create ISO images
    (-i), to use a location on disk (-d), that the bootloader is GRUB (-l), to skip
    the creation of boot diskettes (-f), to verify the backup (-v), to use moderate
    compression (-3) and to ignore NFS-mounted partitions (-N). I’m going to concentrate
    on the interactive mode of the backup here, but I invite you to examine the various
    options by typing man mondoparchive at a command prompt.


    Eventually, you will have a complete backup and, in this case, one or more ISO
    images that you can burn to a CD or DVD. The first disk in the set is the one
    from which you’ll want to boot. In a few seconds, you’ll see a menu like the one
    shown in Figure 6 (currently running in a QEMU virtual machine).


    You have several options when it comes to restoring your system (nuke, interactive,
    and expert), including not restoring your system (compare). If you choose the
    nuke option, your system is restored as it was, and any filesystems currently
    on your computer are destroyed and re-created from the backup. Use this option
    with extreme care. You also might want to restore one or more files and folders.
    For this, use interactive mode. Finally, expert mode drops you to a command prompt.
    You also can simply wait a few seconds, and the restore disk boots normally and
    then takes you to a graphical (ncurses) interface for the mondre store program
    (Figure 7).


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_29_1.png)


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_29_2.png)


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_29_3.png)'
