  md: '# INDEPTH


    # Starting a Linux Firewall from Scratch


    The first steps in getting started with iptables.  **DINIL DIVAKARAN**


    *Building a firewall* is something that easily can be done using a Linux machine.
    This article describes the basic steps involved in developing a firewall from
    scratch, using tools in Linux. It is intended for newbies interested in learning
    about (Linux) firewalls. More important, this article is for all new administrators
    who would like to dirty their hands and get a firewall up and running as soon
    as possible, but without missing the important concepts en route. My experience
    in working on a Linux-based firewall at the DON (Distributed and Optical Networking)
    lab, in the department of Computer Science and Engineering at the Indian Institute
    of Technology (IIT) Madras, is the most motivating factor behind writing this
    article.


    In this article, we examine developing a firewall that will sit on the edge, separating
    your private network from the rest of the world; therefore, the firewall also
    will act as a gateway.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_79_0.png)


    First of all, why do you need such a firewall? Most important, you need to restrict
    access to machines in your network, a network that might consist of various servers.
    One of them might be a mail server, and another might be a DNS server, but only
    those particular services (*provided by these servers*) need to be accessed, not
    anything and everything on the network. Putting it simply, firewalls are used
    to protect a private network from the rest of the world —call it a public network
    (which is the Internet in most scenarios).


    One less obvious reason for having a firewall is that it is necessary to block
    all unwanted traffic flowing into or through your network, which might otherwise
    throttle the bandwidth. Such traffic should ideally stop at the gate (gateway
    or firewall). One good example is when there are many subnetworks, such as at
    a college or university campus. One of the machines in such a subnetwork could
    become infected with a virus and might flood or broadcast ARP packets. Similarly,
    some Windows PCs from outside the private network might be broadcasting netbios
    (netbios-ns/netbios-dgm) packets, which are meaningless to your network and, therefore,
    should be blocked by the firewall.


    But, some of the ARP packets might be legitimate requests for machines in your
    network (or subnet). If you block such legitimate ARP broadcast requests, no packet
    (good or bad) will reach your network; as machines outside the private network
    will not be able to obtain the Ethernet address corresponding to the IP address
    of the machine in your network. To solve this problem, you should configure your
    firewall to act as a proxy for ARP requests—that is, your firewall should reply
    to the ARP requests.


    Now, let’s get into the implementation details. Assume that your private network
    is 192.168.9.0/24. Your firewall, which is also a gateway, must have two interfaces:
    one pointing to your network (eth0) and the other connecting to the public network
    (eth1).


    First, configure the IPs for both interfaces. This can be done using the network
    configuration tool or with the ifconfig command. Ideally, it is better to use
    the system network configuration tool (*system-config-network* in Fedora Core
    2–5) or edit the configuration files (*at /etc/sysconfig/network-scripts* in FC
    2–5), so that the configurations are retained even when the network is started
    (as part of the boot process) or restarted (manually). You also can configure
    the IP by appending the ifconfig command at the end of */etc/rc.d/rc.local* (as
    this file is executed at the end of the boot process). If you do this, however,
    ensure that these commands are executed when the network is restarted manually.


    We use ifconfig to be distribution-independent (for lack of a better term).


    There is no hard and fast rule on the IP addresses to be used for the interfaces,
    but generally, the last two IP addresses in the subnet are used for such purposes.
    Now, assign 192.168.9.253 to eth0 and 192.168.9.254 to eth1:


    ```

    echo "Configuring eth0"

    /sbin/ifconfig eth0 192.168.9.253 up


    echo "Configuring eth1"

    /sbin/ifconfig eth1 192.168.9.254 up

    ```


    The most important function of a firewall that takes the role of a'
