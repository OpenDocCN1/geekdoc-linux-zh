- pgno: 25
  md: "# COLUMNS\n\n\n\nin an event handler. JavaScript makes it difficult to do this\
    \ directly from an event handler. However, dojo.event.connect handles this quite\
    \ simply, in its four-parameter version. As before, the first two parameters are\
    \ the node and event that will trigger the handler. The third and fourth arguments\
    \ are the object and function that will be invoked. For example:\n\n```\ndojo.event.connect(eventObject,\
    \ \"onclick\", handlerObject, \"handlerMethod\");\n```\n\nDojo also makes it possible\
    \ to connect more than one handler to an event. In non-Dojo JavaScript, you could\
    \ accomplish this only by making your event handler a function that then invokes\
    \ other functions. Using Dojo events, you can connect any number of methods:\n\
    \n```\ndojo.event.connect(para, \"onclick\", testFormContents);\ndojо.event.connect(para,\
    \ \"onlick\", submitFormContents);\n```\n\nEvents are fired in the order that\
    \ they are connected. So, in the above example, testFormContents would be invoked\
    \ before submitFormContents.\n\nNote that Dojo allows you to add the same event\
    \ handler twice, if you want. So, be careful to invoke doio.event.connect only\
    \ once for each event-handler combination to avoid potentially odd and hard-to-debug\
    \ problems.\n\n# There is even a topic mechanism for Dojo events, which lets you\
    \ create multiple channels for event notifications\n\nLet's say you want to provide\
    \ an expert mode to your users, so they don't have to see all of the annoying\
    \ alert boxes we're generating. We could create a button that, when pressed, removes\
    \ the event handler from the object—ooh, but now that's getting kind of tricky,\
    \ especially if we have multiple events to deal with.\n\nThe solution is to use\
    \ doio.event.disconnect, which does what you might expect:\n\n```\ndoio.event.disconnect(para,\
    \ \"onlick\", testFormContents);\n```\n\ndoio.event.disconnect requires that the\
    \ parameters be completely identical to those used in doio.event.connect. Once\
    \ it is invoked, however, the event is disconnected. An advanced piece of the\
    \ event system is known as advice, a term that always has confused me, but which\
    \ is common in the worlds of Lisp and aspect-oriented programming. The basic idea\
    \ behind advice is that you can tell the system to invoke a function before or\
    \ after another function. (If you have used Ruby on Rails, this is analogous to\
    \ a filter.) This is admittedly an advanced feature, but it might help when debugging\
    \ an application—rather than inserting logging statements into a problematic function\n\
    \nmanually, you simply can add advice to the function, invoking the logger before\
    \ or after the function is invoked. There is even a topic mechanism for Dojo events,\
    \ which lets you create multiple channels for event notifications. (This is similar\
    \ in some ways to the syslog facility in Linux and UNIX.) Thus, a particular object\
    \ might register its interest when particular events happen on another object.\n\
    \n# Listing 2 dojo-ajax.html\n\n```\n<html>\n<head>\n  <title>Testing Ajax with\
    \ Dojo</title>\n  <script type=\"text/javascript\" src=\"/javascript/dojo.js\"\
    ></script>\n  <script type=\"text/javascript\"> \n    dojo.require(\"dojo.io.*\"\
    );\n    dojo.require(\"dojo.event.*\");\n    function ajaxAlert(evt) {\n     \
    \ var ajaxArgs = {\n        url: \"hello.php\",\n        error: function(type,\
    \ data, evt){\n          alert(\"An error occurred\");\n        },\n        load:\
    \ function(type, data, evt){\n          alert(data);\n        },\n        mimeType:\
    \ \"text/plain\",\n        formNode: document.getElementById(\"myForm\")\n   \
    \   };\n      doio.io.bind(ajaxArgs);\n    }\n  </script>\n</head>\n<body>\n \
    \ <form id=\"theForm\">\n    <input type=\"button\" id=\"theButton\"\n       \
    \    value=\"Press here\" />\n  </form>\n  <script type=\"text/javascript\">\n\
    \    var theButton = doio.byId(\"theButton\");\n    doio.event.connect(theButton,\
    \ \"onlick\", ajaxAlert);\n  </script>\n</body>\n</html>\n```"
  merge: -1
  img_proc: true
- pgno: 26
  md: "Finally, Dojo events are used to give functionality to widgets—Dojo’s name\
    \ for GUI elements made up of HTML and CSS.\n\n# ## Ajax in Dojo\n\nNow that we\
    \ understand how to create and use Dojo events, we can look at how to perform\
    \ Ajax queries using Dojo. As you may recall, Ajax (which stands for Asynchronous\
    \ JavaScript and XML) is a paradigm for Web development that uses the browser’s\
    \ ability to make HTTP requests behind the scenes. Combining such background HTTP\
    \ requests with JavaScript, the DOM and CSS makes it possible to create more intuitive\
    \ and aesthetic Web applications. We could create Ajax applications without Dojo\
    \ or another toolkit, but it’s much easier and more expressive to use a toolkit,\
    \ if only because it means we can avoid browser differences and incompatibilities.\n\
    \nListing 2 shows dojo-ajax.html, a page that contains only a single button marked\
    \ “Press here”. When the button is pressed, the user sees an alert box, much as\
    \ in Listing 1. But, in this version of the program, the contents of the alert\
    \ box have come from a server-side program, defined in this case to be the very\
    \ short hello.php (Listing 3).\n\n+   **Listing 3. hello.php**\n+   \n+   ```php\n\
    +   <? echo “Hello from the server!”; ?>\n+   ```\n\nThe button itself is defined\
    \ as we might do with any button to which we expect to attach an event, with an\
    \ id attribute. It sits inside of a very small HTML form, named “theform”:\n\n\
    ```\n```\n<form id=“theform”>\n    <input type=“button” id=“theButton” value=“Press\
    \ here” />\n</form>\n```\n```\n\nUsing Dojo events, we connect the button to a\
    \ function (ajaxAlert):\n\n```\n```\n<script type=“text/javascript”>\n    var\
    \ theButton = dojo.byId(“theButton”);\n    dojo.event.connect(theButton, “onclick”,\
    \ ajaxAlert);\n</script>\n```\n```\n\nThe only remaining question is what the\
    \ ajaxAlert function does. First, it creates a JavaScript object literal and assigns\
    \ it to the local variable ajaxArgs. This object literal assigns several names\
    \ that will help our Ajax call work: url is the URL of the server-side program\
    \ that will respond to our Ajax call, error indicates which function should be\
    \ invoked if an error occurs, load indicates what function should be invoked if\
    \ the call to url is successful and mimetype defines the MIME type we expect to\n\
    \nreceive from the server.\n\nOne of the annoying aspects of some other JavaScript\
    \ toolkits is that they require you to create your own list of name-value pairs\
    \ to be submitted in the AjaxRequest. This is not the case with Dojo. By setting\
    \ the formNode name in our object literal to a form node, we can rest assured\
    \ that all the form elements will be passed to the server. In this particular\
    \ case, that is not necessarily useful or interesting, but it certainly saves\
    \ some programmer time and increases program readability.\n\nFinally, our ajaxArgs\
    \ object is bound, and we’re off and running. Clicking on the button means the\
    \ associated Dojo event is invoked, which is ajaxAlert. That function, thanks\
    \ to doio.io.bind, then sends its arguments to the defined URL and invokes the\
    \ load function upon successful completion. This is surprisingly straightforward\
    \ and opens up many possible avenues for using Ajax in applications.\n\n# ## Conclusion\n\
    \nDojo, which we explored over the last two installments of this column, and Prototype,\
    \ which we looked at in the January 2007 issue, are both strong libraries for\
    \ Web developers looking to improve the quality of their JavaScript. Each has\
    \ a different style associated with it. I tend to be more of a Prototype kind\
    \ of guy, but many aspects of Dojo are also quite appealing to me. In particular,\
    \ Dojo’s extensive set of widgets, and the way those widgets can be connected\
    \ to one another via the event system, provides a rich set of functionality that\
    \ all JavaScript developers can enjoy. Even if you don’t plan to use Dojo, you\
    \ should consider installing and trying it, just to understand how it works.■\n\
    \n> Reven M. Lerner, a longtime Web/database consultant, is a PhD candidate in\
    \ Learning Sciences at Northwestern University in Evanston, Illinois. He currently\
    \ lives with his wife and three children in Skokie, Illinois. You can read his\
    \ Weblog at revenandlerner.com.\n\n# ## Resources\n\nThe main source for information\
    \ about Dojo, as well as Dojo software releases, is **dojotoolkit.org**. Documentation\
    \ for the toolkit is still a bit sparse, but it has improved significantly in\
    \ the last few months, and continued improvements seem likely, given Dojo’s growing\
    \ popularity. The main URL for Dojo documentation is at **dojotoolkit.org/docs**,\
    \ and Dojo book (the Wiki-based Dojo documentation) is at **manual.dojotoolkit.org/index.html**.\n\
    \nSome good articles about JavaScript toolkits, including Dojo, are at **www.sitepoint.com/article/javascript-library**.\n\
    \nFinally, a noteworthy introduction to Dojo events is at **www.dojotoolkit.org/docs/dojo_event_system.html**."
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Security for Your Data— It’s Totally Mondo!


    Security means different things to different people. On your Linux system, security
    isn''t only about keeping people out, it''s also about knowing you can restore
    the e-mail folder you deleted accidentally.


    **Why can''t I** log in to our main server, François? You were trying to improve
    the security? Without discussing it with me? Yes, of course, I appreciate the
    spirit of your intentions, but now there''s no way to access the system remotely
    at all. In fact, I can''t even log in on the main console. You changed the passwords?
    and encrypted the filesystems? Mon Dieu, François, that is certainly a little
    over the top. Well, just tell me the new password, and I''ll put things back to
    the way they were. What do you mean, you can''t? You''ve forgotten the passphrase
    you used when you encrypted the filesystems?


    Luckily for you, *mon ami*, our guests are already here, and we have backups.
    Head to the wine cellar and bring back the 2001 Ma La Plana Cabernet from Spain.
    And, while you are down there, don''t lock any doors or change any combinations.


    Welcome, *mes amis*, to Chez Marcel, where exceptional vintages are paired with
    exceptional Linux and open-source software. Please, take your seats and make yourselves
    comfortable. My faithful waiter is in the cellar fetching the wine. Before you
    arrived, François demonstrated admirably why it is important to have a reliable
    backup system. Backups can be simple collections of files burned to a CD, a tarred
    bundle stored on a remote system or a copy of your data on a separate drive. There
    are, in fact, thousands of ways to create a backup, and for many of us, it usually
    involves backing up only those files that are near and dear to our hearts. In
    a multitier environment or on a large, busy system, picking up files here and
    there may not be enough. You need everything.


    Ah, François, you have returned. *Please, pour for our guests.* Enjoy, *mes amis*,
    this is a wonderful wine with some *fine* grapes, dark fruit complexity and just
    a hint of chocolate.


    As excellent as the wine might be (and it is), the real star of tonight''s menu
    is a powerful backup and system recovery program called Mondo Rescue. The spirit
    of Mondo Rescue resides in a scenario no one wants to envisi- on, a catastrophic
    system failure. I''m not talking about losing your e-mail folder (although I would
    consider this a catastrophe as well). Mondo Rescue is concerned with “the hard
    disk is gone, the machine has exploded, and we need to start from scratch” kind
    of catastrophe. Or, as in François'' case, security enhancements gone terribly
    wrong. Mondo Rescue works with a variety of backup media, and it can create bootable
    backups that let you restore a mirror image of your system prior to the disaster.


    To get started, visit the Mondo Rescue Web site to pick up your copy of the software
    (see *Resources*). You''ll need a few things to get started, because there isn''t
    a sin- gle, all-inclusive Mondo Rescue package. Don''t worry; it''s a short list,
    and Mondo Rescue provides packages for an impressive number of distributions and
    release levels. The packages you need are also, buffer, mini, mindi, mini-busybox,
    syslinux and the main package, the aptly named mondo. As I felt it necessary to
    use the word “aptly”, this is where Debian and Ubuntu users can claim bragging
    rights, because they can install everything they need by typing `apt-get install
    mondo`.


    Mondo Rescue has, of course, two sides: preparation for disaster and recovery
    from that disaster. The backup program is called *mondoarchive*, and the restore
    program is called *mondorestore*. Let''s start with the backup program. The *mondoarchive*
    program runs in interactive mode by default, with a stylish (by curses standards)
    and easy- to-use interface. You navigate the interface by using your keyboard
    and pressing the Tab key to go from one menu option to another. Start *mondoarchive*
    from a shell


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_27_0.png)'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'prompt. You also need to be running as root, so something like sudo mondearchive
    or su -c ''mondearchive'' should work well.


    The Welcome screen (Figure 1) also is the selection screen for your backup medium.
    You can choose from CD-R or DVD-R disks, tapes, an NFS-mounted directory, a location
    somewhere else on disk and more. Given the nature of a catastrophic disaster,
    somewhere on your local disk may not appear to be the best choice, but you also
    can use Mondo Rescue to generate bootable CD or DVD ISO images from which you
    can boot and restore your system. Because many home users have access to a CD
    or DVD writer to which they can burn these images, but not necessarily a tape
    drive, let''s use that as our example.


    By the way, this isn''t the same as backing up directly to a CD- or DVD-recordable
    drive. If you chose that option, you are asked to insert blank disks at various
    points in the process.


    Tab to the Hard disk option, and press Enter. You''ll be asked for the pathname
    to the disk location you want to use for your backup (Mondo Rescue will provide
    a suggestion). If you choose a tape-drive backup, Mondo Rescue would try to guess
    the location of your tape drive—normally successfully.


    The next screen (Figure 2) is worth thinking about, because it seriously affects
    the performance of your backup. This is the compression screen. To minimize the
    space in which backups are stored, the mondearchive program can compress files
    on the fly. You can elect to skip compression or select minimum, average or maximum
    compression. The higher the compression, the more impact on speed and performance.


    Those of you following along with my example will be writing bootable-ISO image
    backups to disk, but what kind of images? CD-Rs can store 650MB–700MB of data
    (depending on the type you bought), and DVDs can store roughly 4GB. Enter the
    information in megabytes, press Tab to select OK, and then move on to the next
    screen. The ISO images are called monde rescue-1.iso, monde rescue-2.iso


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_28_0.png)


    Figure 2. Compression can affect the performance of your backups dramatically.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_28_1.png)


    and so on. You now have the opportunity to override that naming convention by
    selecting a different name. If you''re happy with the default, press Enter to
    continue.


    Next, is the Backup Paths screen. By default, everything is backed up from the
    root (/, on down. Most people will be happy with this and can safely move on to
    the next screen. Incidentally, should you happen to have a system with NTFS partitions
    (such as on dual-boot systems with Windows), Mondo Rescue offers to back up those
    as well and informs you of their presence. You can accept these or remove them
    from the list of backed-up partitions.


    Having mentioned that it makes sense to back up the whole system, I recognize
    you probably really don''t want everything. On my system, I often have entire
    filesystems where I download Linux distributions so I can experiment with them
    on virtual machines. I don''t want to back these up. I also have folders filled
    with what can be described only as ephemeral junk—things that seemed like a good
    idea at the time, but that I haven''t gotten around to cleaning up, and certainly
    don''t want to back up. Simply list all the folders you want to exclude from backup,
    separated by spaces.


    At this point, you are almost ready to roll. The monde archive program asks whether
    you want to verify your backup, and then it follows up with a very strange question:
    “Are you confident that your kernel is a sane, sensible, standard Linux kernel?
    Say ‘no’ if you are using Gentoo < 1.4 or Debian < 3.0, please.” Mondo Rescue
    wants to make sure the kernel it uses to boot the CD (or DVD) has the smarts to
    boot properly. If you have any doubts, or you like to spin your own kernels, say
    no, and Mondo Rescue will use its own. Once you have made a choice, the monde
    archive program alerts you that it is ready to start. This is your last chance
    to change your mind.


    The backup begins, also in ncurse graphic mode, starting with the creation of
    a catalog of filenames to back


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_28_2.png)'
