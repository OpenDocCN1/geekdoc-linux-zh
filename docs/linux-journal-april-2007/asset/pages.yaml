    # WHAT''S NEW IN KERNEL DEVELOPMENT


    The kernel may soon support a larger compiled binary size, if a few remaining
    problems can be sorted out. **Eric Biederman** has had some patches to accomplish
    this floating around for a while, and **Vivek Goyal** at **IBM** has been testing
    them out. According to Vivel, the time is now ripe to give Eric''s patches (with
    modifications and include their in) to a wider audience and include them in **Andrew
    Morton''s** -mm tree. A lot of folks seem happy to see these patches, and much
    additional work is going into them from various kernel people. Some of that work
    is in the form of cleanups, but some folks also are working on the tricky interactions
    between this code and the **swapoff software suspend code**. It does seem as though
    these patches, sooner or later, will be complete and accepted into the official
    tree.


    The open-source **ar5k wireless driver** has been cleared of any copyright problems,
    at least according to the **Software Freedom Law Center** (SFLC). The driver,
    developed for OpenBSD, primarily by **Reyk Floeter**, had lived under a cloud
    of suspicion by **Atheros**, the maker of the wireless chipsets it supported.
    And, although nothing was ever proven against the ar5k developers, the "scandal"
    was enough to prevent Linux folks from incorporating the driver into the Linux
    kernel. With the SFLC opinion, the worst objections have been set aside, if not
    entirely eliminated, and now the biggest complaint from kernel folks is that the
    ar5k driver may just be badly written or take the wrong approach. Currently, some
    folks support incorporating ar5k into the kernel in its current form or with slight
    modifications, and some think the whole driver should be scrapped and just used
    as a hardware reference for an entirely new driver. Whatever way that debate falls,
    it''s clear that Atheros wireless chips will soon have a free alternative to Atheros''
    own freely available through proprietary MadWiFi driver.


    A lot of patches have come along to remove broken or unmaintained parts of the
    kernel or schedule their removal after a period of deprecation. **Andrew Morton**
    has scheduled **FUTEX_FD** for removal in June 2007, saying the code has "unfixable
    races"—exactly the charge levied against DevFS in the old days. **Rusty Russell**,
    who originally wrote the patch, has no interest in fighting to keep the code.
    However, he says that once it''s removed, the futex code could be made a lot simpler.
    With friends like these, FUTEX_FD needs no enemies, and it is doubtful the code
    will last even as long as Andrew has given it.


    At the same time, **Adrian Bunk** has posted patches to remove a bunch of old
    drivers that have been marked as broken for several years. These include the **VIDEO_ZR36120**
    and **SKMC** drivers, and the **MAC89x0**, **ATARI_BIONET** and **ATARI_PAMSTER**
    drivers. Of these latter, **Geert Uytterhoeven** may have a patch, by **Matthias
    Urlichs**, to fix the MAC89x0 driver. But the patch still needs to be tested and
    signed off on. Meanwhile, Adrian has posted more patches to remove the **FB_CYBER_FB**,
    **FB_VIRGE**, **FB_RETINA23**, **FB_ATARI**, **FB_SUN3** and **FB_PM3** drivers,
    but it looks as though **James Simmons** might take over maintaining them, and,
    GERT may already have a patch to fix the FB_ATARI driver. So, those framebuffer
    drivers may not be taken out after all.


    At the same time, the **sysctl code**, which to all appearances was on the chopping
    block for real, seems to have found a reprieve. Eric Biederman, who had scheduled
    the code for removal, found some legitimate sysctl users. As a result, not only
    is the code no longer marked as deprecated, but it will also be compiled into
    all kernels by default for the near future. Eric will work with the various distributions
    to eliminate the sysctl uses gradually and, in perhaps a year or two, will once
    again consider removing the code.


    The **Sparse C code parser** never had an official release since its original
    maintainer, so it becomes one of a very small group of projects to have an initial
    release only after changing hands. **Linus Torvalds** originally created the tool
    in 2003 for his own use to help spot bugs in kernel patches. And, he made the
    tool available for download without ever giving it a version number or doing any
    kind of organized release. When users started asking for features that Linus didn''t
    himself desire, he suggested that someone else might take over the project. **Josh
    Triplett** stepped up, officially releasing Sparse version 0.1 with several feature
    enhancements. A version 0.2 followed closely after that, this time mainly adding
    bug fixes. Is the project old, having begun in 2003, or new, having just put out
    its first release? You decide.


    -ZACK BROWN


