  md: "# INDEPTH\n\n# Need for Speed: PS3 Linux!\n\nTurn your PS3 into a dual-boot\
    \ game machine and Linux box  DAVE TAYLOR\n\n+   * Can we get\n+   * I Admit,\
    \ I Liked WebTV\n\nthe hottest video game system from Christmas 2006 and turn\
    \ it into a Linux box? You bet!  \nIf you're still thinking about video game systems\
    \ as being just a wee bit more technologically advanced than an old Coleco or\
    \ Atari 800, you've got quite a surprise coming the first time you crack open\
    \ the proverbial hood. Although the new Nintendo Wii (pronounced “we”, oddly enough)\
    \ has some slick hardware, as does the Microsoft Xbox 360 device, the real winner\
    \ in the technology race is the rather amazing Sony PlayStation 3 system.  \n\
    Built around an IBM Cell Broadband Engine processor, the PS3 includes a high-def\
    \ Blu-ray drive, four USB 2.0 ports, an NVIDIA graphics processor with 256MB of\
    \ separate video RAM, support for CompexFlash, SD and memory stick devices, Ethernet,\
    \ built-in 802.11b and g, Bluetooth, an HDMI port and support for all the video\
    \ resolutions you can imagine, including 480p, 480p, 720p, 1080i and the holy\
    \ grail, 1080p. Sounds like a computer, not a video game system, doesn't it? \
    \ \nThe Blu-ray optical drive system boasts support for most of the older disc\
    \ formats too, including CD-ROM, CDR+W, DVD, DVD-ROM, DVD-R and DVD+R. If you're\
    \ not familiar with the battlefield of HD video, Blu-ray can support up to 54GB\
    \ of data per disk, which is pretty amazing if you're still using a CD burner!\
    \ The other HD disk format is HD-DVD, but that's not supported. On the other hand,\
    \ Blu-ray already has more than a hundred movies in retail channels, so the PS3\
    \ is also quite a capable HD video player.  \nThe Cell processor itself is a pretty\
    \ amazing piece of hardware, sufficiently so that Terra Soft Solutions (Loveland,\
    \ Colorado) has worked with Sony to create a PS3-based supercomputer center. Imagine,\
    \ hundreds of rackmounted PS3 devices running complex weather simulations rather\
    \ than WWII games. The Cell processor runs at speeds greater than 4GHz and can\
    \ handle 256 billion calculations per second, with 2.5MB of memory on the chip\
    \ itself, squeezed in with a processor design that uses 234 million transistors\
    \ (www.ibm.com/developerworks/power/cell).  \nOne more important spec: with a\
    \ 60GB hard drive included, the PS3 will run you about $599 US at most retail\
    \ outlets, if they even have PS3 units in stock. And games? Well, there are a\
    \ few dozen available at this point with an average price of about $60 US, and\
    \ the standard game rental channels (GameFly, Hollywood Video and so on) should\
    \ have PS3 games available for rent by the time you read this article.  \nOkay,\
    \ so it's a darn cool computer with some terrific capabilities hiding in a sleek\
    \ black shell, but is it really just useful for playing video games or can you\
    \ do something else with it—can you turn it into a Linux system?\n\nPerhaps the\
    \ most obvious question to ask is why bother? I mean, if you buy a PlayStation\
    \ 3, you're going to be investing in the fastest next-generation gaming console\
    \ on the planet. Why the heck would you want to boot in to a sterile Linux environment\
    \ instead?  \nWell, the answer isn't because the PS3 replaces your regular Linux\
    \ box if you're a geek. To me, the question of running Linux on the PS3 revolves\
    \ much more around whether you can essentially add functionality to the PS3 for\
    \ households that don't have a computer. What if you could run all the PS3 games,\
    \ watch Blu-ray HD movies and gain full interactivity with the Internet too? \
    \ \nIt's the 21st-century answer to the late, underappreciated WebTV device. Tech\
    \ geeks never quite got the point that a lightweight device with a wireless keyboard\
    \ that hooked up to a regular TV was\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_71_0.png)\n\
    \n> SOURCES: COURTESY OF SONY"
  merge: -1
  img_proc: true
- pgno: 72
  md: "never intended to compete with a $5,000 Alienware Gaming PC. But WebTV still\
    \ had great utility to those people who didn’t want—or couldn-t’t figure out—a\
    \ personal computer, be it a Mac or PC. Simple, we could- simple, WebTV offered\
    \ a Web browser and e-mail system and not much else, and for many people, that\
    \ was just fine.\n\nThink along these lines, and Linux on the PS3 suddenly seems\
    \ like something that’s worth doing, because the PS3 hardware is so darn powerful\
    \ and capable. The target audience isn’t people who could easily run Windows Vista,\
    \ Mac OS X Leopard or Linux on a separate computer, but those people who would\
    \ find the lightweight solution just fine. As a result, my primary testing for\
    \ this solution are those two killer apps: Firefox for Web surfing and Thunderbird\
    \ for e-mail.\n\n# First, Configuration Requirements\n\nSony actually contracted\
    \ with Terra Soft Solutions to produce a version of its Yellow Dog Linux (henceforth\
    \ YDL) for the PlayStation 3, a smart move considering that Linux people were\
    \ going to cobble together a solution anyway. Terra Soft initially produced YDL\
    \ for the IBM- chip-based Mac PowerPC systems, offering up a quite capable Linux\
    \ alternative to Mac OS X.\n\nThe PS3 doesn’t include any useful input devices\
    \ (other than a game controller), so you need to buy a USB keyboard and mouse\
    \ or, perhaps, just dig one out of your closet like I did. You’ll also want a\
    \ USB Flash drive for a temporary boot drive. Fortunately, I have a 2GB SanDisk\
    \ Flash drive that worked just fine. They’re about $70 US at your local computer\
    \ shop. Ironically, my Flash disk came from Microsoft, with Vista promotional\
    \ materials pre-installed—not anymore!\n\nStart by partitioning the hard disk\
    \ in your PS3 so you have space to install Linux. This is pretty easy. Boot up\
    \ the PS3, then go to Settings→System Settings→Format Utility, choose Format Hard\
    \ Disk, say yes to the questions about reformatting the entire disk, and then\
    \ eventually you’ll be able to choose a Custom partition. Choose the Alien 10GB\
    \ in the other OS, which gives you 50GB in the bigger unit or 20GB in the smaller\
    \ unit (the 30GB model of the PS3) for games and other PS3 stuff. We’ve come a\
    \ long way from Pong, somehow……\n\nNow, it’s time to turn to your removable drive,\
    \ whether you’re going to use a Flash drive like I did or try a CompactFlash,\
    \ SD card or similar. You need to create a directory p33, and then a subdirectory\
    \ therein called others, and download two files, one from the Sony Web site ([www.playstation.com/ps3-openplatform](http://www.playstation.com/ps3-openplatform),\
