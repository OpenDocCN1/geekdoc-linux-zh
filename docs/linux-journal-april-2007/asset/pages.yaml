  md: "# UPFRONT\n\n# More of Less\n\nIf you're looking to put together combinations\
    \ of small low-cost computing systems, it's hard to overlook the goods coming\
    \ from e-Way, an American-run Taipei-based company. e-Way specializes in hardware\
    \ that sells—in single units or in quantities—at prices you could cover with the\
    \ average ATM withdrawal. They have a variety of tiny CPU boards and boxes ranging\
    \ from $90–$189 US, plus screens and other components at prices as low as $8 US.\
    \ At the Consumer Electronics Show, e-Way President Steve Freiburger even ran\
    \ a slideshow off an extremely compact desktop Linux. The distro and 50 apps—including\
    \ the slideshow software—will fit inside a 128Mb CompactFlash memory card. Check\
    \ them out at [ewayco.com](http://ewayco.com). ——DOC SEARLS\n\n# The Market Aperature\
    \ Opens\n\nCinema-grade 35mm film cameras always have been brutally expensive,\
    \ and the same goes for their digital counterparts. One reason is just that they're\
    \ complex and expensive to produce. Another is that the manufacturers always have\
    \ maintained a distance between castes of customers. Professional gear not only\
    \ has features and abilities far beyond those of \"consumer\" gear, but it is\
    \ far more expensive as well.\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_19_0.png)\n\
    \nThis is starting to change with video gear. The RED digital camera ([red.com](https://red.com))\
    \ is the first professional video camera that makes 35mm-grade cinematography\
    \ available in digital form at prices independent producers can afford. It shoots\
    \ with a 4.520 x 2.540 resolution (2.540 progressive) at 60 frames per second\
    \ RAW, using a 12-megapixel Mysterium CMOS sensor. It's flexible, format-agnostic\
    \ and costs $17,500. For something this good, that's cheap.\n\nLinux has become\
    \ the platform of choice for much of Hollywood's cinema production. Does the availability\
    \ of cameras like RED's beg for more Linux in the rest of the cine production\
    \ world? We'll see. ——DOC SEARLS\n\n# They Said It\n\n> Make no little plans;\
    \ they have no magic to stir men's blood and probably will themselves not be realized.\
    \ Make big plans; aim high in hope and work, remembering that a noble, logical\
    \ diagram once recorded will not die.\n> \n> ——Daniel Burnham\n\n> The best way\
    \ to get money isn't to find some VCs to beg, borrow, or steal from; the best\
    \ way to get money is to make something people will pay for.\n> \n> ——Giles Bowkett,\
    \ [gilesbowkett.blogspot.com/2006/12/tale-of-two-startups.html](https://gilesbowkett.blogspot.com/2006/12/tale-of-two-startups.html)\n\
    \n> Most embedded device vendors don't release any source. Then someone from the\
    \ community nags the vendor's legal department for six months and eventually gets\
    \ a partial source tree that doesn't compile. My impression is that companies\
    \ treat legal compliance not as a hard requirement but as a risk management exercise;\
    \ if (cost of GPL lawsuit) \\* (probability of GPL lawsuit) \\< (cost of VxWorks\
    \ license) \\* (number of units), use Linux.\n> \n> ——Wes Felter, [www.linixjournal.com/comment/reply/1000164/209612](https://www.linixjournal.com/comment/reply/1000164/209612)\n\
    \n> Rosenberg's Law: \"Software is easy to make, except when you want it to do\
    \ something new.\" Rosenberg's Corollary: \"The only software we worth making\
    \ is software that does something new.\"\n> \n> ——Scott Rosenberg, from *Dreaming\
    \ in Code*, Cwen Publishing, 2007\n\n> Open sourcing is the most important decision\
    \ we've made in seven years of Second Life development. While it is clearly a\
    \ bold step for us to proactively decide to open source our code, it is entirely\
    \ in keeping with the community-creation approach of Second Life.\n> \n> ——Cory\
    \ Ondrejka, CTO of Linden Lab\n\n> If there isn't enough food in the fridge, do\
    \ you say \"the store must be down?\"\n> \n> ——Greg Elin, at a conference\n\n\
    # Index, April 2007\n\n+   1. Millions of Second Life Residents as of January\
    \ 1, 2007: **2.28T**\n+   2. Thousands of US dollars spent per day in Second Life\
