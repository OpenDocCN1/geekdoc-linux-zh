  md: "# TECH TIPS\n\n# Make USB/MIDI work, turn your existing soundcard into a high-quality\
    \ synthesizer, and exploit the power of X.\n\n# How to Make Your USB/MIDI Connection\
    \ Work with Your Custom-Compiled Kernel\n\nMany of us like to compile our own\
    \ kernels. In my case, I compile my own kernels for two reasons. First, stock\
    \ kernels include in-tree images that tend to discover my SCSI devices in the\
    \ wrong order. You can fix the intent to discover devices properly (I explained\
    \ how to do that with Ubuntu/Kubuntu in a previous instalment of Tech Tips). But,\
    \ I prefer to avoid the problem by compiling the drivers into the kernel rather\
    \ than loading them as modules. Second, I just like to run the latest stable kernel\
    \ available.\n\nI've been playing with synthesizers with a USB/MIDI connection.\
    \ Much to my dismay, I couldn't see to make the USB/MIDI connection work with\
    \ my own compiled kernel. I couldn't find any information on the Web that would\
    \ point me to the problem, but I eventually stumbled on the answer quite by accident.\n\
    \nThe solution turns out to be quite simple and obvious once you look through\
    \ enough of the kernel configuration options. One problem is that the kernel drivers\
    \ are organized in such a way that it wasn't obvious (at least it wasn't obvious\
    \ to me) which drivers to include to make this work. I picked all the MIDI sequencer\
    \ drivers, so why wasn't it working? The USB driver you need actually resides\
    \ within the tree for sound drivers, not USB drivers. Select the following from\
    \ \"make menuconfig\" (or whichever method you prefer for kernel configuration):\
    \ Device Drivers→Sound→Advanced Linux Sound Architecture→USB Devices→USB Audio/MIDI\
    \ driver.\n\nAlthough, as I said, I generally compile my drivers directly into\
    \ the kernel, I recommend that you compile this particular one as a module, instead.\
    \ There's no point in having the module loaded during those times when you're\
    \ not using the synthesizer keyboard.\n\nSelect the above driver as a module,\
    \ and it creates a module called snd-usb-audio. The module name was the source\
    \ of my confusion. I found the snd-usb-audio module when I tried to track down\
    \ what made the stock kernel work, but I dismissed this module as a possible candidate\
    \ for fixing this problem due to its name. It didn't occur to me that snd-usb-audio\
    \ had anything to do with MIDI until I stumbled across the label \"USB Audio/MIDI\"\
    \ in the kernel configuration. The module name itself makes it seem like the module\
    \ is meant for an external sound source, not an external MIDI source.\n\nBy the\
    \ way, I was inspired to set this up after getting my daughter a Korg X50, a very\
    \ affordable and excellent synthesizer keyboard. The latest Korg keyboards don't\
    \ seem to require any special configuration in order to connect the USB/MIDI port.\
    \ However, I later discovered that the Yamaha keyboards aren't quite as friendly.\
    \ You have to change some MIDI settings on the Yamaha Motif ES keyboards to make\
    \ the keyboard work with the computer via the USB port.\n\nThis may seem self-evident,\
    \ but the trick is to follow the instructions in the Yamaha Motif ES manual for\
    \ connecting the USB/MIDI to the computer. Well, duh, right?\n\nRTFM, or more\
    \ politely, read the fine manual. But when you encounter problems, it's sometimes\
    \ tempting to look for tips on the Web to make the keyboard work. Be warned that\
    \ you should not follow many of the instructions you'll find on the Web. These\
    \ instructions are generally for Windows and the Mac, and they'll tell you how\
    \ to configure the Yamaha keyboard to send the MIDI signals through the computer\
    \ and echo them back to the keyboard. It's probably possible to set up the Linux\
    \ driver and/or patch daemons (such as jackd) to make Linux applications work\
    \ with this configuration, but that's not how Linux behaves by default. So, this\
    \ is definitely a case where you should avoid the Web and RTFM instead.  \n—Nicholas\
    \ Peteley\n\n# Turn Your Computer into a High-Quality Synthesizer\n\nMaybe you\
    \ can't afford even the Korg X50, but you want to try your hand at composing music\
    \ or even just playing MIDI files. The problem is most soundcards that work with\
    \ Linux do not come with a very impressive collection of MIDI sounds (such collections\
    \ are usually referred to as soundfonts). Free soundfonts are available, but they\
    \ don't sound as professional as some of the ones you can purchase. For example,\
    \ SONIVOX MI sells a fantastic General MIDI (GM) soundfont, and its available\
    \ for just under $100 US. If you want to use a key board to record MIDI sequences,\
    \ you can purchase one of many cheap MIDI keyboards that do nothing but send MIDI\
    \ signals (they have no synthesizer included). These keyboards sell for well under\
    \ $100 US depending on the quality that you'll find satisfactory.\n\nHere's how\
    \ to use the SONIVOX soundfont. First, purchase the font from the URL listed below.\
    \ It has been too long since I've purchased my copy for me to recall whether the\
    \ file you download is a ZIP file or a Windows executable. Even if it's a Windows\
    \ EXE file, you should be able to unpack it with Wine.\n\nNow, download and install\
    \ fluidsynth and the qsynth front end (its as simple as an apt-get install fluidsynth\
    \ qsynth from Debian and many Debian-based distros). You may have to load the\
    \ ALSA sequencer drivers manually or specify the module in a file like/etc/modules.\
    \ The module you want to load is snd-seq, and the command to load it is modprobe\
    \ snd-seq.\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_21_0.png)\n\nFigure 1.\
    \ The Qsynth Front End to fludisynth"
  merge: -1
  img_proc: true
- pgno: 22
  md: '# **In addition, just playing with X in this way makes you understand the interrelationships
    between X, your window manager and your applications.**


    Start up Qsynth, and you’ll see a window like the one shown in Figure 1.


    Press the Setup button. You may have to configure Qsynth with the MIDI and Audio
    tabs depending on the distribution and setup you use.


    Now, click on the Soundfonts tab (Figure 2), and click the Open button to navigate
    to the SONiVOX soundfont you downloaded and installed. Click the Open button in
    the file picker, and you’re done. Click OK on the window, and you should be ready
    to go.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_22_0.png)


    Figure 2. The Soundfont Setup Tab in Qsynth


    SONiVOX 250MB GM Soundfont: **www.sonivoxmi.com/ProductDetail.asp?Item=GMWavetable250Meg**


    > —Nicholas Petreley


    # **Run Multiple X Sessions Simultaneously**


    On most PCs, you can start more than one X session and switch between them with
    Ctrl-Alt-F7 and Ctrl-Alt-F6, for example. Why would you do this? Well, some X
    applications don’t really need a full-blown window manager gobbled up your precious
    RAM and CPU. For example, VTDware Workstation and Stellarium are two applications
    that I use (rarely simultaneously, by the way) that don’t need anything but a
    display. (I don’t need cut and paste with Stellarium, and VTDware is basically
    a display manager in itself. In addition, just playing with X in this way makes
    you understand the interrelationships between X, your window manager and your
    applications.)


    Start your X engine (aka implicit xinit). You probably just use startx, and it
    reads your ~/.xinitrc file and, doing what it’s told, thereby launches X on the
    first available console, complete with window manager. This is probably display
    :0.


    Start your X2 engine (aka explicit xinit). From a terminal, you can launch another
    X server on your machine:


    ```

    ```bash

    xinit /opt/vtdware-workstation/bin/vtdware

    display :1 -- :1 &

    ```

    ```


    The first argument taken by xinit is the path for the client that will be launched.
    It must be an absolute path starting at /. Everything after the -- is passed to
    the X server. Read the xinit(1) man page a bit for more fine examples.


    > —Bill Longman


    # **Don’t Do Things the Hard Way; Run Remote Applications Using the Power of X**


    It’s often extremely frustrating or time consuming to run an xterm on a remote
    host just to fork your programs from that remote machine. Why not simply run your
    window manager there, even though you’re not on its console? The window manager
    is just another X application after all, isn’t it?


    Fire off your local X server:


    ```

    ```bash

    xinit /usr/bin/xterm -- :1 &

    ```

    ```


    This yields a vanilla X session with merely an xterm running—no window manager.
    Now, you need to add permissions to this window session for the remote host. You
    can tunnel the connection through SSH if your network is insecure, but there’s
    a distinct performance hit. If your network is secure, you can simply do **xhost
    \+remoteghost** and spray directly to your X server.


    For tunneled SSH:


    ```

    ```bash

    ssh -fy remotehost /usr/bin/xvmake

    ```

    ```


    For spray directly:


    ```

    ```bash

    xhost +remoteghost

    ssh -f remotehost /usr/bin/xvmake

    display localhost:1

    ```

    ```


    The first option, if your remote SSH server supports it, uses a locally defined
    DISPLAY that then gets tunneled to your local side over SSH. The second option
    allows remoteghost to send X data directly to your local display, then runs Window
    Maker there but displays it locally. Now, all your desktop actions are done on
    the remote machine, not locally.


    > —Bill Longman


    # **Credits**


    +   - Nicholas Petreley is Editor in Chief of *Linux Journal*.


    +   - Bill Longman is NIS Manager at Sharp Laboratories of America.□


    > Linux Journal pays $100 for reader-contributed tech tips we publish. Send your
    tips and contact information to techtips@linuxjournal.com.'
  merge: -1
  img_proc: true
- pgno: 23
  md: "![](img/3c4d8a97b5d96c835281dc0dacbc8551_23_0.png)\n\n# Dojo Events and Ajax\n\
    \nThe quality of your Dojo depends upon your connections.\n\n**REUVEN M. LERNER**\n\
    \n*Last month*, we began looking at Dojo, one of the most popular open-source\
    \ JavaScript toolkits to emerge in the last year or two. Although using a toolkit\
    \ is not required if you want to include Ajax or sophisticated client-side functionality\
    \ in your Web application, it certainly makes things a great deal easier. In particular,\
    \ such toolkits typically know how to handle the many subtle differences in JavaScript\
    \ implementations on different browsers. JavaScript is far more standardized than\
    \ used to be the case, but a number of traps still exist when trying to work with\
    \ multiple platforms, and using a toolkit can relieve you of having to handle\
    \ them yourself.\n\nIn last month’s article, we looked at Dojo’s packaging system,\
    \ some of its enhancements to the JavaScript language and its rich-text editor.\
    \ This month, we look at some of Dojo’s other capabilities that might interest\
    \ modern Web developers, including support for events and Ajax.\n\n# Event Handlers\n\
    \nOne of the cornerstones of JavaScript programming is the use of event handlers—functions\
    \ that are invoked when a particular event occurs. For example, we can define\
    \ a function that opens an alert box:\n\n```\n<script type=\"text/javascript\"\
    >\n function openAlert() {\n alert('Hello! This is an alert!');\n }\n</script>\n\
    ```\n\n> > JavaScript is far more standardized than used to be the case, but a\
    \ number of traps still exist when trying to work with multiple platforms, and\
    \ using a toolkit can relieve you of having to handle them yourself.\n\nListing\
    \ 1. test-dojo.html\n\n<html>\n\n<head>\n\n<title>Testing JavaScript with Dojo</title>\n\
    \n<script type=\"text/javascript\"\nsrc=\"/javascript/dojo.js\"></script>\n<script\
    \ type=\"text/javascript\">\ndojo.require(\"dojo.event\");\n</script>\n\nfunction\
    \ openAlert(evt) {\nalert('Hello! This is an alert from Dojo!');\n}\n</script>\n\
    \n</head>\n\n<body>\n\n<p id=\"para\">This is a paragraph.</p>\n<script type=\"\
    text/javascript\">\nvar para = dojo.byId(\"para\");\ndojo.event.connect(para,\
    \ \"onclick\", openAlert);\n</script>\n\n</body>\n\n</html>\n\nWe can then tell\
    \ the user’s browser to invoke our openAlert function whenever someone clicks\
    \ on a paragraph of text:\n\n```\n<p onclick=\"openAlert();\">This is a paragraph.</p>\n\
    ```\n\nThere are several interesting things to notice in this short example. First,\
    \ we have set the onclick event handler in this case. About a half-dozen other\
    \ event handlers exist from which we could choose. In many cases, we might set\
    \ more than one event handler. This was particularly prevalent in the pre-CSS\
    \ days, when JavaScript event handlers would be used to change the look of an\
    \ icon when the mouse was hovering over it.\n\nSecond, event handlers sometimes\
    \ can be used in contexts you might not expect. For example, the above <p> tag\
    \ has an onclick handler. You normally wouldn’t think of clicking on a paragraph\
    \ of text, but we can do that. This is the basis for some of the modern drag-and-drop\
    \ events.\n\nThird, although JavaScript does make it pretty easy to attach handlers\
    \ to particular events, some messiness still is involved. We cannot define multiple\
    \ event handlers easily or disconnect handlers that have been defined.\n\n# Dojo\
    \ Events\n\nBy this point, you might be wondering what JavaScript event handlers\
    \ have to do with using Dojo for Ajax and modern Web applications. The answer\
    \ is that much of Dojo’s functionality, across all of its many packages, depends\
    \ on the event system. If you want to use Dojo’s Ajax package, for example, you\
    \ need to connect it using Dojo events. This might seem restrictive at first glance;"
  merge: -1
  img_proc: true
- pgno: 24
  md: "however, Dojo events are surprisingly easy to understand.\nAs a simple example,\
    \ let's see how we might implement our onclick handler from before using Dojo\
    \ events. First, we need to modify our event-handling function so that it takes\
    \ one argument, the event itself:\n\n```\n<script type=\"text/javascript\">\n\t\
    function openAlert(e evt) {\n\t\talert(\"Hello! This is an alert from Dojo!\"\
    );\n\t}\n</script>\n```\n\nNext, we must connect the paragraph to the event. Rather\
    \ than doing this directly, by setting the onconnect handler, we give our paragraph\
    \ an id tag:\n\n```\n<p id=\"para\">This is a paragraph.</p>\n```\n\nNow, we can\
    \ use Dojo's dojo.byId function—similar in some ways to Prototype's $() function—to\
    \ get the node itself:\n\n```\nvar para = dojo.byId('para');\n```\n\nFinally,\
    \ we connect our paragraph to the handler function we created:\n\n```\ndojo.event.connect(para,\
    \ 'onclick', openAlert);\n```\n\nIf we put it all together, we get the program\
    \ shown in Listing 1, which I have called test-dojo.html.\nOne thing you might\
    \ notice is the three `<script>` tags in the file. The first, in the head of the\
    \ document, downloads dojo.js, the main Dojo source file, from the server. The\
    \ second, also in the head of the document, imports the Dojo package for events\
    \ and defines our event-handling function, openAlert. The third and final piece\
    \ of JavaScript, which attaches the node to the event, is in the body of the document,\
    \ right after our p tag is defined. This is because we can set an event handler\
    \ only for an object that already exists, which means after the p tag itself.\n\
    If you load the page into a browser window, you will see that it works just like\
    \ the previous version. Given that this version is more complex, it might not\
    \ seem obvious how it is better:\n\n# ## Advanced Dojo Events\n\nHere, then, is\
    \ one example. Suppose you want to invoke one particular object method, rather\
    \ than a simple function call,\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_24_0.png)\n\
    \n# # Expert Included.\n\nOur product development team constantly juggles multiple\
    \ projects with tight deadlines.\nAs an integral part of this team, Patrick is\
    \ responsible for hardware compatibility, power and performance testing, and operating\
    \ system validation, just to list a few things.\nHe is a fan of the Rackform nSery\
    \ AA43, loaded with four Next-Generation AMD Opteron™ processors, because he appreciates\
    \ the advantages of AMD's Direct Connect Architecture in spreading workload across\
    \ multiple processors. Patrick has a lot to do, which is why he likes a server\
    \ designed to do a lot.\n\nWhen you partner with Silicon Mechanics, you get more\
    \ than an enterprise-quality server—you get an expert like Patrick.\n\n![](img/3c4d8a97b5d96c835281dc0dacbc8551_24_1.png)\n\
    \nvisit us at www.siliconmechanics.com\nor call us toll free at 866-352-1173"
