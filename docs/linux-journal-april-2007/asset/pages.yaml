  md: "# SECURITY\n\n```\n[2000334]\ndesc=P2P (BitTorrent)\npriority=8\nurl=/content//index.php?template=p2p\n\
    disable=4\nmax_enable=1\nactions=trap, email_log\ntrigger-Detect::2000334.Detect::2000357.\n\
    =>Detect::2000369\n```\n\nThis tells PackETFence that:\n\n+   > The BitTorrent\
    \ violation can be generated by the Snort alerts 2000334, 2000357 and 2000369\
    \ (the trigger parameter).\n+   > The system has to act upon this violation by\
    \ isolating the user, sending an e-mail alert to the administrator and logging\
    \ the violation to /var/log/messages (the actions parameter).\n+   > The user\
    \ is allowed to re-enable network access once (the max_enable parameter).\n\n\
    Finally, you need to activate Snort from inside PackETFence by incorporating the\
    \ following into confp.conf:\n\n```\n[trapping]\ndetection=enabled\n\n[interface\
    \ eth0]\ntype=internal, managed, monitor\n```\n\nand restarting the PackETFence\
    \ service. Note that if you are using switches, you have to redirect a copy of\
    \ your network traffic to eth0 (the PackETFence monitor—that is, the interface\
    \ Snort listens to for packets). Generating a violation in PackETFence is now\
    \ as simple as launching your favorite BitTorrent client, such as Azureus. Do\
    \ so, and open a torrent file to start a download. Once a couple of packets are\
    \ exchanged on the network, Snort should catch some and match them with the 2000334,\
    \ 2000357 or 2000369 rules. Those rules, which come from the Bleeding Edge Threats\
    \ ruleset, correspond to BitTorrent peer sync, traffic and announce, respectively.\
    \ Once Snort logs such unusual activity, PackETFence reacts by creating a violation.\n\
    \nAs an administrator, you can see the list of violations with:\n\n```\n/usr/local/pt/bin/pfncd\
    \ violation view all\n```\n\nAs a user, on your computer, launch your favorite\
    \ Web browser and try to open any outside Web site. You'll be redirected to the\n\
    \n![](img/3c4d8a97b5d96c835281dc0dacbc8551_69_0.png)\n\nPackETFence system automatically,\
    \ which will display the peer-to-peer template, as shown in Figure 2.\n\nStopping\
    \ the BitTorrent client lets you regain network access. Now, try to use BitTorrent\
    \ a second time. As before, an alert is generated, and your browser is redirected\
    \ to the PackETFence portal. But this time, however, you won't get another chance\
    \ to re-enable your access. In real life, offending users would have to call their\
    \ network administrator to re-enable network access.\n\nTo activate the Nessus\
    \ scanning of hosts trying to register with PackETFence, add the following section\
    \ to /usr/local/pf/conf/p.conf:\n\n```\n[scan]\ns11=enabled\npass=<nessus_passwd>\n\
    user=<nessus_user>\nport=1241\nhost=127.0.0.1\nregistration=enabled\n```\n\nand\
    \ restart the PackETFence service. Trying to add a computer running an unpatched\
    \ version of Microsoft Windows now generates an immediate violation. You also\
    \ can use the administrative Web GUI (the Scan tab) to define that complete Nessus\
    \ scans should be executed every night.\n\n# Conclusion\n\nDeploying PackETFence\
    \ in your network with ARP-based isolation is simple. Although this isolation\
    \ technique is easy to deploy, it doesn't necessarily scale well and could be\
    \ bypassed by wise users with static ARP-cache entries.\n\nOther isolation techniques\
    \ exist in PackETFence, such as DHCP/DNS, which scales well. At Inverse, we also\
    \ added VLAN-based isolation to PackETFence, which makes this solution more secure\
    \ and appealing for large networks. PackETFence is an ideal solution for securing\
    \ campus networks or even a part of your network (a VLAN or subnet). Finally,\
    \ a high-quality NAC solution has emerged from the FOSS community, and the evolution\
    \ of PackETFence is promising.\n\n> Ludovic Marcatite | ludovic@inverse.ca holds\
    \ a Bachelor's degree in Computer Science from the University of Montréal. He\
    \ is currently a senior systems architect for Inverse, Inc., an IT consulting\
    \ company located in downtown Montréal that specializes in the deployment of infrastructures\
    \ based on free and open-source components.\n\n> Dominic Gehl | dgehl@inverse.ca\
    \ holds a Master's degree in Computer Science from the University of Montréal.\
    \ He is currently a systems architect for Inverse, Inc., an IT consulting company\
    \ located in downtown Montréal that specializes in the deployment of infrastructures\
    \ based on free and open-source components.\n\n# Resources\n\n+   PackETFence:\
    \ www.packetfence.org\n+   \n+   Snort: www.snort.org\n+   \n+   Bleeding Edge\
    \ Threats: www.bleedingsnort.com\n+   \n+   Oinkmaster: oinkmaster.sourceforge.net\n\
    +   \n+   Nessus: www.nessus.org\n+   \n+   Azureus: azureus.sourceforge.net"
