    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_18_0.png)


    # OPPORTUNITIES IN LEADERSHIP COMPUTING


    > The Oak Ridge National Laboratory in East Tennessee is engaging a world-class
    team to make dramatic advancements— fielding new capabilities and new opportunities
    for application to high-end science and high performance computing.


    # Solving Problems Beyond the Reach of Today''s Technology


    The science of the 21st century demands computational capability well beyond what
    is available today. Oak Ridge National Laboratory (ORNL) and the Department of
    Energy''s Office of Science intend to lead the world in computational science
    and engineering as a tool for frontier scientific discovery to deliver new insights
    and significant break-throughs with far-reaching impact for U.S. scientific leadership,
    industrial competitiveness, and national security.


    ORNL will be home to a wealth of resources to accomplish these goals:


    +   *   National Center for Computational Sciences (NCCS)

    +   *   DOE Leadership Computing Facility (LCF)

    +   *   Advanced Scientific Computing Research (ASCR)

    +   *   Regional Cyber Infrastructure for Science

    +   *   Classified Computing (for national security and energy assurance)


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_18_1.png)


    # Leadership Computing Capabilities


    Computing power is key to scientific leadership in basic energy sciences, biological
    and environmental sciences, fusion energy, high-energy and nuclear physics. The
    high performance computing platforms housed within the NCCS are vital to research
    programs and will provide solutions to many of our most pressing national challenges.
    These capabilities will make ORNL the nation''s most powerful open resource for
    capability computing, with a sustainable path that will maintain and extend national
    leadership for the Federal government and the scientific community at large, and
    will include computer science, mathematics, modeling, simulation, knowledge extraction
    and discovery, and numerical methods.


    # Join the Oak Ridge National Laboratory


    The continued success of the nation requires world-class leadership in terascale
    and petascale computing. ORNL is in search of world-class scientific and technical
    staff and currently has opportunities in the following areas:


    +   *   System Programming

