    # Basic Usage


    Start PacketFence with service packetfence start. Have a look at /var/log/messages,
    and you should see that PacketFence started creating an inventory of all nodes
    on your network, as in the following example:


    ```

    Jan 3 16:05:28 pf pf: update_hashes(5): UPDATE

    New node 00:07:e9:05:4c:f2 (192.168.0.1)

    Jan 3 16:05:28 pf pf: update_hashes(5): UPDATE

    New node 00:90:27:6a:71:ea (192.168.0.2)

    ```


    ```

    /usr/local/pt/bin/pfcmd is the PacketFence command-line inter-

    face. Executing it without any further parameters shows a help

    screen with the available options. In order to show all nodes in

    the database, execute:

    ```


    ```

    #/usr/local/pt/bin/pfcmd node view

    mac|pid|detect_date|regdate|lastksx|pid|status|

    user_agent|computername|last_arg|last_dhcp|switch

    port|vlan|dhcp_fingerprint

    00:e7:e9:05:4c:f2|1|2007-01-03 16:05:28|||unreg|||

    2007-01 03 16:10:11||||||||

    00:90:27:6a:71:ea|1|2007-01-03 16:05:28|||unreg|||

    2007-01 03 16:10:12||||||||

    ```


    Manually registering a node can be done with:


    ```

    /usr/local/pt/bin/pfcmd

    ~node edit 00:07:e9:05:4c:f2 status="reg"_pid=1

    ```


    You can also use pfcmd to access the documentation for every configuration parameter.
    To see the documentation for the logo parameter from the [general] section:


    ```

    #/usr/local/pt/bin/pfcmd config help general.logo

    GENERAL LOGO

    Default: //common/packetfence.gif

    Logo displayed on Web pages.

    ```


    Have a look at the available reports using:


    ```

    /usr/local/pt/bin/pfcmd help report

    ```


    The os and osclass reports use PacketFence''s DHCP fingerprinting feature, which
    tries to determine the operating system of every DHCP request (including the ones
    made by printers, VoIP phones, switches and so on). Running:


    ```

    /usr/local/pt/bin/pfcmd report os

    ```


    shows the number and percentage of nodes on your network for every detected operating
    system. Note that the DHCP fingerprinting feature easily can be used to disallow
    access to your network by computers running specific operating systems.


    PacketFence also features an administrative Web GUI, which, by default, is available
    on the secured port 1443. Direct your browser to https://-cpf-host/:1443/. Once
    you enter the login/password you defined during the installation, you can start
    monitoring and configuring PacketFence through the GUI.


    When you start enforcing the registration of nodes with PacketFence, all nodes
    on the network have to be registered before they can gain complete network access.
    This registration requirement applies to all gear with network access, including
    wireless access points and printers. So, before actually activating this option
    in the configuration file, it is wise to pre-register those types of devices manually.


    For computers with Web browsers, on the other hand, the registration can be done
    by the user through the PacketFence captive portal. The portal can verify login/password
    information through a RADIUS file, Radius or LDAP, which we use in our example.
    In order to do this, you need to adapt the provided template /usr/local/pt/conf/templates/ladp.conf
    to fit your LDAP structure. Because all your users will be redirected to the registration
    screen, it also is wise at this point to change the default PacketFence logo,
    which is shown on the Web pages, to your own company logo. This can be done by
    adding /logo/ to /common/mylogo.gif to the [default] section in /usr/local/pt/conf/pt.conf
    and copying the file mylogo.gif into the directory /usr/local/pt/html/common/.


    To activate the registration, incorporate the following parameters into /usr/local/pt/conf/pt.conf:


    ```

    [trapping]

    testing=disabled

    detection=disabled

    [registration]

    aup=disabled

    auth=ldap

    ```


    Now, restart PacketFence with service packetfence restart. You should see in /var/log/messages
    that PacketFence is trapping unregistered nodes by ARP-spoofing your network''s
    gateway. From the client side, opening a Web browser and accessing any outside
    Web site should lead to a redirection to the PacketFence captive portal, which
    allows you to register the computer. You also can determine whether a client has
    been ARP-spoofed by executing arp -n -a (under Linux) on the client and checking
    which MAC is saved in the ARP cache for your network''s gateway.


    # Incorporating Snort and Nessus


    You can take it a step further by adding Snort alerts to your PacketFence installation.
    Let''s assume that using BitTorrent clients is prohibited in your environment
    and you want to configure PacketFence to enforce this policy. Edit /usr/local/pt/conf/violations.conf
    so that the section containing BitTorrent reads as follows:'
