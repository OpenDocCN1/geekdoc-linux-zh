  md: '# UPFRONT


    > Office formats. Laziness and the wish to ignore what software are very powerful.
    In such a scenario, the first time a manager sends an OpenDocument file from an
    employee or supplier back with an "I can''t open this" note, the sender will set
    the default file format of OpenOffice.org to OpenXML and never go back. Why compromise
    a career or a sale annoying people in this way, especially if "I can still use
    this cool free software, can''t I?" Sure—until the agreement expires and the next
    version of OpenXML breaks compatibility.


    This is the real danger; there won''t be any need to sue anybody for using Linux,
    because millions of business and public files will remain in a one-way format,
    made to order for Microsoft Office.


    This is not interoperability. OpenDocument is interoperable. Working on OpenXML
    support in OpenOffice.org also makes it look like multiple applications are going
    to support this format. It is a prerequisite to ISO standardization—that is, for
    government acceptance. Government pressure to require/migrate to OpenDocument
    also would be much easier to fight or ignore: "Why spend public money on training,
    software migration and so on, now that our (current) format is an ISO standard
    and even Linux can open the formats of 99.999% of the existing office files successfully?
    See how good we were to encourage competition and give you choice?" All this could
    sensibly delay the adoption of OpenDocument (not forever, don''t worry: just four
    or five years). It wouldn''t be the first time that something goes into limbo
    because Microsoft says that it will support it in some way and then drops it because
    "there is no market demand".


    # The Solution


    Even if you don''t care at all about computers, OpenDocument is an occasion too
    important to miss—to save tax money if for nothing else. Please refuse to distribute
    or accept office files in OpenXML formats. It''s too risky. Use whatever software
    you like best, but just say no to OpenXML, and ask your friends, coworkers and
    government to do the same. This is going to be immensely easier to do than in
    the past. A plugin to read and save OpenDocument files in Microsoft Office and
    a cross-platform viewer (similar to an Acrobat Reader for OpenDocument) are being
    actively developed. Very soon, there won''t be any valid excuse not to use OpenDocument.
    Don''t miss this opportunity.—MARCO FIORETTI


    # Widening the Analog Hole


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_17_0.png)


    The entertainment industry embraced the digital revolution by making digital goods
    behave like analog ones—that is, scarce and hard to reproduce. It narrowed reproducibility
    of its "content" until all that remained was what it ironically called "the analog
    hole." Only through the analog hole could sacrificial digital goods still be moved
    with relative ease, and without being stopped by the DRM police. The moved goods
    would not be of identical digital quality, but they risked looking and sounding
    good enough to please the user.


    Naturally, user demand has turned the analog hole into a marketplace. Front and
    center are the products by Chicago-based Neuros, which loves Linux and works to
    bring the free and open Linux value system to the world of media production and
    reproduction.


    The Neuros Recorder 2 is an MPEG-4 recorder that "works like a mini-digital VCR."
    It connects to sources over RCA cables and records in real time on standard removable
    Flash memory cards. Content can be transferred to other devices manually or over
    a USB 2.0 connection.


    The company''s latest product is the Neuros OSD, "the first open-source Linux-based
    embedded media center." It lets you record from cable, satellite TV, DVD, TV/oDVR,
    camcorder or VCR over RCR or S-Video cables, and to distribute or play back recordings
    over LAN (Ethernet), memory card, USB or RCA cables. The architecture is wide
    open, and it''s constantly improved by Neuros and a growing community of developers
    and users. The price is $229 US.


    Check them out at neurostechnology.com.—DOC SEARLS


