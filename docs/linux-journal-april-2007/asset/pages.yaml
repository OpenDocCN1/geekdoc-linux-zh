- pgno: 39
  md: '# The Outer Banks


    Software developers should know that even geeks sometimes want to be treated like
    Mom & Pop.


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_39_0.png)


    JON "MADDOG" HALL


    **Many programs** often are written that work great for 99.999% of the time that
