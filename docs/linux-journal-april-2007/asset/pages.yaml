- pgno: 87
  md: '# # Use Inkscape and XSLT to Create Cross-Platform Reports and Forms


    A way to create platform-independent dynamic forms and reports. CHAD FILES


    I work for a health-care company developing application software. My colleagues
    and I are responsible for writing software to process health-care claims, manage
    work flow and make the company as efficient as possible. We recently decided to
    replace a piece of third-party software that took health-care claim data and overlaid
    it on standard HIPAA (Health Insurance Portability and Accountability Act) claim
    forms. The software would take the data and transpose it into PDF files that we
    stored on a large file server. Each PDF contained one claim on its proper form.
    We made the decision to replace the software because we needed something more
    agile. We wanted something that would create the claim image dynamically and not
    consume space on our servers.


    Health-care claims are very intricate (Figure 1). Many boxes and boilerplate text
    have to be drawn. The conventional way to do this with a software application
    is to draw a series of lines using coordinates and lengths, and then lay the static
    and dynamic content on top of the newly drawn lines. The process of programming
    an application like this is long and tedious, not to mention error-prone. We wanted
    something that was easier to create and maintain. Our requirements were as follows:


    +   * We must be able to print high-quality versions of the claims.

    +   * Claims must be accessible from a Web browser.

    +   * The solution has to be programming language-independent. We use Python,
    PHP, Perl and Java. The images need to be created using any of these languages.

    +   * We must be able to convert the claim data and form into several different
    file formats, specifically PDF and PNG.

    +   * The entire solution must be platform-independent.


    After reviewing the requirements, we looked at several different open- and closed-source
    options. None of them met all of our requirements, so we turned to creating our
    own solution. We tried scanning a blank claim form and using ImageMagick to put
    the claim data on it. This almost gave us what we wanted. The problem with that
    it was going to be tedious and redundant to create the solution in all of the
    required languages. Next, we turned to FOP (Formatting Objects Processor). This
    solution was close to what we wanted. However, it would take too long create the
    claim forms. Plus, the solution was not really language-independent either (FOP
    is a Java library). We could have written wrappers for the FOP command-line interface,
    but we were convinced that there was still a better solution.


    While exploring the FOP solution, we had the idea of using Scalable Vector Graphics
    (SVGs). Basically, we would take an SVG image of the claim form and make it into
    an XSLT (eXtensible Stylesheet Language Transformation), because the SVG format
    is a special XML format. Then, we would pull the claim data from our database
    and convert it into an XML string. Using any of our languages, we could then take
    the XSLT and the XML and create an SVG image of the claim. This solution met all
    of our requirements. It was language- and platform-independent. We could print
    the SVG images and embed them into Web pages. Furthermore, SVG images can be converted
    into different file formats easily. Another nice feature of this


    ![](img/3c4d8a97b5d96c835281dc0dacbc8551_87_0.png)


    Figure 1. Health Insurance HCFA 1500 Claim Form'
