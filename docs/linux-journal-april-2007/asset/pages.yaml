- pgno: 85
  md: "# The Asterisk Manager reports events processed by Asterisk and accepts commands\
    \ over the interface.\n\nreferring to `_ [ARG6] -> ( Peer )`, which returns `SIP/300`:\n\
    \n> ```\n> Event: PeerStatus\n> PeerStatus: Registered\n> Peer: SIP/300\n> ```\n\
    \nOn SIP registration, the program needs to identify the extension, request information\
    \ about it and then set up further processing of the extension data after a delay.\
    \ When an event is called through the delay_set method, it is possible to pass\
    \ an extension to the state handler, such as the extension number used here:\n\
    \n```\n```perl\nsub register_state_handler {\n    my $kernel = _ [KERNEL] ;\n\
    \    # Split peer extension off from technology\n    my $peer = $ [ ARG6] -> (\
    \ Peer ) ;\n    debug_print(\" Extension is @$peer \");\n    my $extn_parts =\
    \ split('/', @$peer);\n    my $ext = $extn_parts[1];\n    debug_print(\"Extension\
    \ number is @$ext\\n\");\n    getTZChannelVars(_ [ HEAP ], @$ext );\n    debug_print(\"\
    \ Queueing call event for * \");\n    debug_print(\"SREG_CALL_DELAY seconds\\\
    n \");\n    $kernel ->delay_set(\"CALL\", $REG_CALL_DELAY, @$ext );\n} # register_state_handler\n\
    ```\n```\n\nAs part of the extension registration process, we collect variables\
    \ about the state of the channel in the getTZChannelVars procedure. The POE heap,\
    \ which is passed as the first argument, can be used to issue commands to the\
    \ manager. For example, the put argument to the server can be used to issue commands.\
    \ To get the SIP peer data, which includes the current IP address of the peer,\
    \ the command looks like this:\n\n```\n```perl\n$heap -> (server) -> put ( { Action\
    \ => 'SIPShowPeers',\n                            Peer => @$ext } );\n```\n```\n\
    \nTo get a database variable, the action in the put command is a DBget. The time-zone\
    \ data is stored as keys in the tz family, so it is necessary to specify both\
    \ the family and assemble the correct key name, which is of the form 300-TIMEZONE\
    \ or similar:\n\n```\n```perl\n$heap -> (server) -> put ( { Action => 'DBGet',\n\
    \                            Family => 'tz',\n                            Key\
    \ => \"$ext . -TIMEZONE\" } );\n```\n```\n\nFour database requests and the SIP\
    \ peer data are requested by getTZChannelVars. Because this function is called\
    \ by an event handler, it also is not interruptible. Therefore, it sends four\
    \ database query events to the manager, but it does not process responses directly.\
    \ (Complete code for the five requests within the full procedure is available\
    \ on the *Linux Journal* FTP site.)\n\n# Command and Database Responses\n\nIn\
    \ the gap between issuing requests and the time the call state is scheduled, responses\
    \ flow in from the SIP data request and the database queries. From the SIP data\
    \ request, we need to pick out the peer IP address, which appears on a line in\
    \ the manager response reading `Address-IP: 192.168.1.5`. Conveniently, the POE\
    \ module parses out the lines in the response, so all we need to do is look for\
    \ the Address-IP line by getting the value of the Address-IP hash element in one\
    \ of the arguments passed to the handler. The POE heap is accessible across events,\
    \ so adding the value of the SIP peer IP address to the heap makes it accessible\
    \ to other event handlers:\n\n```\n```perl\nsub response_state_handler {\n   \
    \ my $peer_ip = $ [ ARG0] -> ( Address-IP ) ;\n    if (defined($peer_ip) ) {\n\
    \        debug_print(\"SIP context found: Peer IP address \");\n        debug_print\
    \ ( \" is @$peer_ip\\n \");\n        _ [ HEAP ] -> ( 'SIP-Peer-IP ')=$peer_ip;\n\
    \    } # response_state_handler\n}\n```\n```\n\nAfter the SIP data response comes\
    \ back, the four database queries should return responses. Responses to the queries\
    \ look like this:\n\n> ```\n> DBGetResponse: Success\n> Family: tz\n> Key: 300-TIMEZONE\n\
    > Val: -8\n> ```\n\nThe callback handler is triggered whenever there is a DBGetResponse:\
    \ Success event from the manager, with an argument of a hash that has each of\
    \ the lines in the packet. Our interest is in the key and value lines, which can\
    \ be retrieved from the arguments passed to the state handler. As with the previous\
    \ handler, responses are stored in the POE task heap to make it available to other\
    \ handlers:\n\n```\n```perl\nsub db_response_state_handler {\n    my $family =\
    \ _ [ ARG0 ] -> ( Family ) ;\n    my $key = _ [ ARG0 ] -> ( Key ) ;\n    my $value\
    \ = _ [ ARG0 ] -> ( Val ) ;\n    if (defined($family)) {\n        debug_print\
    \ ( \"Key stored in DB family $family \");\n        debug_print ( \" is $value\\\
    n \");\n        # Store in heap\n        _ [ HEAP ] -> ( $key ) = $value;\n  \
    \  } # db_response_state_handler\n}\n```\n```\n\n# Making the Call\n\nEvery registration\
    \ event triggers a \"call\" event to happen after a delay. The delay is used to\
    \ collect information used to determine whether to initiate a call. The setup\
    \ telephone call should be"
