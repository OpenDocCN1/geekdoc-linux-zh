- pgno: 38
  md: 'Firewall Builder, which I covered several years ago in the May and June 2003
    issues of *Linux Journal*, is something else altogether. It''s the firewall equivalent
    of an Integrated Development Environment—that is, a graphical, object-oriented
    interface for generating iptables scripts (among other firewall types).


    Conceptually, Firewall Builder is very similar to the policy editor in Check Point
    firewalls. You create “objects” for the networks and hosts you want to use in
    rules, and then you arrange those objects and pre-defined “service” objects (HTTP,
    IMAP, FTP and so forth) into graphical rules statements. Firewall Builder not
    only generates these into iptables scripts, but it also can install them on other
    systems via SSH.


    In my experience, the main strike against Firewall Builder is its somewhat lengthy
    list of dependencies, chief among them the Qt libraries for GUI development. However,
    many of the things Firewall Builder needs are now standard Linux packages included
    on typical distributions, so this is less of a problem than it used to be. See
    the Firewall Builder home page for detailed installation instructions.


    Other graphical iptables utilities include Firestarter and Guadogod (see Resources).


    # # Conclusions


    A couple years ago, *Linux Journal* named iptables its Security Tool of the year.
    It really is a remarkable achievement. If you''re serious about network security,
    you''ll want to explore iptables’ power in much greater detail than we''ve done
    in this article, starting with the iptables(8) man page and progressing through
    the how-tos available on the Netfilter home page (see Resources).


    Whether you use iptables to protect your laptop or your entire enterprise network,
    I hope you''ve found this introduction useful. Be safe!■


    > Mick Bauer (Iardrh@curewiremonkeys.org) is Network Security Architect for one
    of the US''s largest banks. He is the author of the O''Reilly book *Linux Server
    Security, 2nd edition* (formerly called *Building Secure Web With Linux*), an
    occasional presenter at information security conferences and composer of the “Network
    Engineering Poll”.


    # # Resources


    +   - The Netfilter home page, where you can find the most current iptables-related
    how-tos: **www.netfilter.org**

