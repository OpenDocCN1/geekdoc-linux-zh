    当你登录时，你始终处于你的家目录。该目录的名字与你的用户名相同，它是你所有个人文件和子目录存放的地方。要查看家目录的内容，请输入：


    ```

    % ls

    ```


    你可能在家目录中没有看到任何文件；如果没有文件，系统将直接返回提示符。请注意，使用 `ls` 命令时，你只能看到名称不以点`..`开头的内容。以点开头的文件是隐藏文件，它们通常包含一些重要的配置信息。它们之所以被隐藏是因为你不应该碰它们。


    要查看家目录中的所有文件（包括以点开头的的文件），请输入：


    ```bash

    % ls -a

    ```


    你现在可以看到所有文件，包括隐藏文件。`ls` 是可以接受选项的命令之一，而上面的 `-a` 只是其中一个选项。这些选项会改变命令的工作方式。


    ## 创建目录


    `mkdir`


    为了在家目录下创建一个子目录来存放你创建的文件（为了演示目的，我们将将其命名为 `linuxstuff`），请在当前目录下输入：


    ```bash

    % mkdir linuxstuff

    ```


    要查看该目录，请输入：


    ```bash

    % ls

    ```


    ## 切换另一个目录


    `cd`


    `cd` 表示从当前目录切换到目录。因此，要切换到你刚刚创建的目录，你需要输入：


    ```bash

    % cd linuxstuff

    ```


    要查看内容（现在应该还没有内容），输入 `ls`。


    ## 练习


    进入 `linuxstuff` 目录，然后再次创建一个名为 `backups` 的目录。


    ## . 和 .. 目录


    留在 `linuxstuff` 目录，输入：


    ```bash

    % ls -a

    ```


    你会看到（这在所有目录都是如此）两个名为 `.` 和 `..` 的目录。


    在 Linux 中，单点（`.`）表示当前目录，所以如果你输入（确保 `cd` 和单点之间留有空格）：


    ```bash

    % cd .

    ```


    你将停留在 `linuxstuff` 目录的当前位置。虽然初看起来这似乎没什么用，但你很快就会发现，通过输入点作为当前目录名可以节省大量的打字工作。


    `..` 表示父目录，即你当前所在目录的父级。如果你输入：


    ```bash

    % cd ..

    ```


    你将返回上一级目录，在这种情况下，是回到你的家目录。


    注意——如果你在文件系统中迷路了，只需在提示符处输入 `cd`，你就会直接返回家目录。


    ## 路径名


    `pwd`


    `pwd` 代表打印工作目录（print working directory），使用路径名可以让你确定自己在文件系统中的准确位置。例如，如果你想知道家目录对应的绝对路径，你可以输入
    `cd` 返回家目录，然后输入：


    ```bash

    % pwd

    ```


    你应该能看到类似这样的路径名：


    `/home/its/ug1/ee51vn`


    这意味着家目录位于名为 `ug1` 的子目录中（这是一个组目录），它又位于名为 `its` 的子目录中，而该子目录位于根目录 `/` 顶层下的家子目录中。


    ## 练习


    使用 `cd`、`pwd` 和 `ls` 命令探索你的文件系统。不要忘记，输入 `cd` 会带你回到家目录。


    ## 理解路径名


    如果你不在家目录，请返回家目录并输入：


    ```bash

    % ls linuxstuff

    ```


    这将列出家目录的内容。现在输入：


    ```bash

    % ls backups

    ```


    你会看到一条类似这样的信息：


    `backups: No such file or directory`


    为什么？你之前确实创建了同名的目录，但你并没有在工作目录下创建它。所以，要进入 backups 目录，你必须使用 `cd` 并指定目录，或者必须使用路径名：


    ```bash

    % ls linuxstuff/backups

    ```


    我们还可以使用波浪字符（`~`）来引用家目录并指定从家目录开始的路径。因此，如果你输入：


    ```bash

    % ls ~/linuxstuff

    ```


    你将看到 `linuxstuff` 目录的内容列表，无论你当前位于文件系统的哪个位置。


    ## 练习


    查看以下命令，并思考输入它们后会列出什么：


    ```bash

    % ls ~

    % ls ~/..

    ```


    ## 章节总结


    | 命令 | 含义 |

    | :--- | :--- |

    | `ls` | 列出文件和目录 |

    | `ls -a` | 列出所有目录和文件，包括隐藏文件 |

    | `mkdir` | 创建新目录 |

    | `cd directory` | 切换到指定的目录 |

    | `cd` | 回到家目录 |

    | `cd ~` | 回到家目录 |

    | `cd ..` | 切换到父目录 |

    | `pwd` | 显示当前目录的路径名 |


    ## 复制文件


    `cp`


    如果你想复制工作目录下的 `file1` 并将其命名为 `file2`，你需要输入：


    ```bash

    cp file1 file2

    ```


    首先，访问[这个网站](http://www.ee.surrey.ac.uk/Teaching/Unix/science.txt)并将文本复制到文件中。将其命名为
    `science.txt` 并保存到你的 `linuxstuff` 目录中。


    现在，我们将把一个位于文件系统开放区域的文件复制到 `linuxstuff` 目录。首先，你通过输入命令回到 `linuxstuff` 目录：


    ```bash

    % cd ~/linuxstuff

    ```


    然后在提示符后输入内容：


    ```bash

    % cp /vol/examples/tutorial/science.txt .

    ```


    注意——不要忘记在末尾添加点。该命令的意思是我们将名为 `science.txt` 的文件复制到 `linuxstuff` 中，但保持文件名不变。上面的命令意味着将文件
    `science.txt` 复制到当前目录并保持同名。为了下一个示例，你必须在你的 `linuxstuff` 目录下创建一个名为 `science.txt`
    的文件。


    ## 移动文件


    `mv`


    `mv file1 file2` 将 `file1` 移动或重命名为 `file2`。


    当你使用 `mv` 命令时，移动的是文件而不是复制，这确保你只有一个文件而不是两个。我们也可以用它来给文件起新名字，方法是将其移动到它所在的相同目录但使用不同的名称。


    回到你的 `linuxstuff` 目录并输入以下内容：


    ```bash

    % mv science.bak backups/.

    ```


    现在输入 `ls` 和 `ls backups` 看看发生了什么。


    ## 删除文件或目录


    `rm`


    `rmdir`


    要删除文件，我们使用 `rm` 命令。让我们为 `science.txt` 创建一个副本，然后将其删除。


    在你的 `linuxstuff` 目录下，输入：


    ```bash

    % cp science.txt tempfile.txt

    % ls

    % rm tempfile.txt

    % ls

    ```


    如果你想删除整个目录，首先确保其中没有文件，然后使用 `rmdir` 命令。尝试删除名为 `Backups` 的目录——Linux 不允许这样做，因为里面有内容。


    ## 练习


    使用 `mkdir` 创建一个名为 `tempstuff` 的目录，然后使用 `rmdir` 命令将其删除。


    ## 在屏幕上显示文件内容


    `clear`


    在继续之前，让我们清除终端窗口中已有的命令，以便我们更好地理解后续命令的输出。这样做只需输入：


    ```bash

    % clear

    ```


    所有文本都将被移除，只剩下提示符。现在，让我们来看下一个命令。


    `cat`


    `cat` 用于合并并将文件内容显示在屏幕上。输入：


    ```bash

    % cat science.txt

    ```


    你会发现文件大于窗口尺寸，它会滚动，导致内容难以阅读。


    `less`


    此命令每次页将文件内容写入屏幕，所以输入：


    ```bash

    % less science.txt

    ```


    需要查看下一页时按下空格键；如果阅读足够，输入 `q`。


    注意——如果你有长文件，请使用 `less` 命令而不是 `cat` 命令。


    `head`


    此命令将指定文件的前十行写入你的屏幕中。清除屏幕并输入：


    ```bash

    % head science.txt

    ```


    现在输入：


    ```bash

    % head -5 science.txt

    ```


    观察结果并判断添加 `-5` 对命令做了什么。


    `tail`


    与 `head` 命令相反，`tail` 命令将指定文件的最后十行写入屏幕。清除屏幕并输入：


    ```bash

    % tail science.txt

    ```


    '
- fmt: '

    Using the `less` command, you can search for a keyword pattern in a text file.
    For example, if you wanted to find all the instances of science in the `science.txt`
    file, you would type in


    ```bash

    % less science.txt

    ```


    And then, staying in `less`, you type a forward slash and the work you want to
    search:


    ```

    /science

    ```


    All the instances of the word are highlighted; to find the next instance, type
    in


    ```bash

    grep

    ```


    `grep` is one the standard utilities on Linux and it is used to search for specific
    patterns or words. Clear your screen and type in


    ```bash

    % grep science science.txt

    ```


    Now you can see that the command `grep` prints each of the lines that have the
    word science in it. Or has it?


    Now type in


    ```bash

    % grep Science science.txt

    ```


    `grep` is case sensitive and will distinguish between `science` and `Science`.
    If you want to ignore this case sensitivity, use `-i`. For example, type in


    ```bash

    % grep -i science science.txt

    ```


    If you want to search for a specific pattern or phrase, it must be inside single
    quote marks. To search for spinning top, you would type in


    ```bash

    % grep -i ''spinning top'' science.txt

    ```


    Other options with the `grep` command are:


    - `-v` will display the lines that don’t match the specified text

    - `-n` will precede each of the matching lines with the correct line number

    - `-c` will only print out the total number of the matched lines


    Have a go at these and see what the results are. You can use more than one of
    these in one command so, to show the number of lines that do not include Science
    or science, you would type in


    ```bash

    % grep -ivc science science.txt

    ```


    ### `wc`


    This is a neat utility and is short for word count. If you wanted to do a total
    word count on the `science.txt` file, you would type


    ```bash

    % wc -w science.txt

    ```


    If you want to know how many lines are in the file, type:


    ```bash

    % wc -l science.txt

    ```


    ### Section Summary


    | Command | Meaning |

    | :--- | :--- |

    | `cp file1 file2` | copies file 1 and names it file2 |

    | `mv file1 file2` | moves or renames file1 to file2 |

    | `rm file` | removes a file |

    | `rmdir` | removes a directory |

    | `cat file` | displays a file |

    | `less file` | shows one page of a file at a time |

    | `head file` | displays just the first 10 lines of a file (or however many specified)
    |

    | `tail file` | displays the last 10 lines (or however many specified) of a file
    |

    | `grep “keyword” file` | searches for a specific keyword in a file |

    | `wc “keyword” file` | counts how many characters or words are in a file |


    ### Redirection


    Most of the processes that are initiated by Linux commands will write to the terminal
    screen, which is the standard output. Many of them also take their input from
    the keyboard. As well as that, there are also those that write error messages
    to the terminal screen. Already, we have used the `cat` command to write a file’s
    contents to the terminal so now type the following, without specifying any file


    ```bash

    % cat

    ```


    Type a few words in using the keyboard, anything will do, and then press return.
    Hold down `CTRL` and press the `d` key – this will finish the input. When you
    run the `cat` command without a file, it will read the keyboard input and, when
    it receives the end of the file, the `d`, it will copy it to your terminal. In
    Linux, we are able to redirect input and output.


    #### Redirecting Output


    The `.` symbol is used to redirect command output. For example, if we wanted to
    create a file with a name of `list1`, that had a list of fruits in it, we would
    type:


    ```bash

    % cat > list1

    ```


    Then you type the names of a few fruits and, after each one, press return. For
    example:


    ```

    apple

    pear

    banana

    ```


    then press `CTRL+d`. The `cat` command will read what was input from the keyboard
    and `>` will redirect it to the output, the screen, in a file named as `list1`.
    If you wanted to read what the file had in it, you would type


    ```bash

    % cat list1

    ```


    ### Exercise


    Now, using the same method, create a file named `list2`, with these fruits in
    it – `plum`, `orange`, `grapefruit`, `mango`. Now read the file contents.


    #### Appending to Files


    `>>` will append the standard output to a file so, if we wanted to add some more
    items to `list1`, we would type


    ```bash

    % cat >> list1

    ```


    And then the names of more fruits:


    ```

    grape

    peach

    orange

    ```


    then press `CTRL+d` to stop. To read the file contents, type


    ```bash

    % cat list1

    ```


    You should, by now, have two files, one containing six fruits and one containing
    four fruits. Now we will join the two lists using the `cat` command into one file
    named `biglist`. Type in


    ```bash

    % cat list1 list2 > biglist

    ```


    This will read the contents of both lists, in turn, and then output the text from
    each into a new file called `biglist`. To read the contents of `biglist`, type
    in


    ```bash

    % cat biglist

    ```


    #### Redirecting Input


    To redirect command input we use the `<` symbol. This will sort a list in numerical
    or alphabetical order. Type in


    ```bash

    % sort

    ```


    Now type some animal names in and press return after each of them:


    ```

    ape

    cat

    dog

    bird

    ```


    then press `CTRL+d` to stop. The output would be:


    ```

    ape

    bird

    cat

    dog

    ```


    When you use `<` you can redirect input from a file instead of from the keyboard.
    For example, if you wanted a list of fruits sorted, you would type


    ```bash

    % sort < biglist

    ```


    The list will be sorted and output on the screen. If you wanted the sorted list
    to be output to a file, you would type


    ```bash

    % sort < biglist > slist

    ```


    The `cat` command is used for reading the contents of `slist`.


    ### Pipes


    If you want to redirect command input we use the `<` symbol. (Wait, the context
    implies pipes here). If you want to use the output of one command as input for
    another, we use the pipe `|`. symbol. If you want to use the output of one command
    as input for another, we use the pipe `|` symbol. (Actually, the text says: pipes).


    The symbol for the pipe is a vertical bar (`|`). For example, if you typed


    ```bash

    % who | sort

    ```


    You would get the same result but it would be much faster. If you wanted to find
    out how many users have logged in, type


    ```bash

    % who | wc -l

    ```


    ### Exercise


    Use pipes to show all the lines in `list1` and `list2` that have the letter `p`
    in them and then sort the results.


    ### Answer


    As this is a little complex, I have opted to show you the answer this:


    ```bash

    % cat list1 list2 | grep p | sort

    ```


    ### Section Summary


    | Command | Meaning |

    | :--- | :--- |

    | `command > file` | redirects standard output to a file |

    | `command >> file` | appends the standard output to a file |

    | `command < file` | redirects the standard input from a file |

    | `command1 \| command2` | pipes `command1` output to `command2` input |

    | `cat file1 file2 > file0` | concatenates or joins files 1 and 2 to file0 |

    | `sort` | sorts the data |

    | `who` | shows you who is logged on to the system |


    ### Wildcards


    `*` is a wildcard character and it will match with none or more characters in
    a directory or name. For example, go to your `linuxstuff` directory and type in


    ```bash

    % ls list*

    ```


    This shows you all of the files that are in the current directory, beginning with
    `list`. Now type in


    ```bash

    % ls *list

    ```


    This shows all the files that end with `list` in the current directory.


    `?` is another wildcard character and it is used to match one character only.
    So, for example, if you were to type `?ouse`, it would match with files like `mouse`
    or `house`, but it’t match with `grouse`. Type in


    ```bash

    % ls ?list

    ```


    And see what happens


    ### Filename Conventions


    It is worth noting that directories are special file types so the naming conventions
    for files will also apply to a directory. When you name a file, you cannot use
    special characters, such as `*`, `/`, `%` and `&`. You also cannot use spaces
    so, when you name a file use numbers and letters, along with the underscore and
    the dot.


    | Good names | Bad names |

    | :--- | :--- |

    | `project.txt` | `project` |

    | `my_big_program.c` | `my big program c` |

    | `bob_billy.doc` | `bob and billy.doc` |


    File names begin with lowercase letters and end with a dot and a file extension
    that indicates the file contents. For example, if you have files that have C code
    in them, they may have the `.c` ending, such as `prog1.c`.


    To list all the files that have C code in the home directory, all you need to
    type at the command prompt is `ls*c`. from within the home directory.

