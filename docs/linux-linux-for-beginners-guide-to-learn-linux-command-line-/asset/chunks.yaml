    # 引言


    我想感谢并祝贺你购买了这本书《Linux：Linux 初学者指南：学习 Linux 命令行、Linux 操作系统和 Linux 命令》。


    这本书包含了关于学习 Linux 是什么以及如何使用它的经过验证的步骤和策略。毫无疑问，Linux 是最好且最常用的开源操作系统。它运行在你计算机上所有其他软件之下，接收应用程序和程序的请求并将其传递给硬件。


    Linux 由 Linus Torvalds 于 1991 年创建。当时，他正在于赫尔辛基大学学习，他创建 Linux 是为了作为 `Minix`（一种在学术界使用的
    Unix 克隆版本）的开源且免费的替代方案。起初，他本想把它命名为 `Freax`，但由于 Torvalds 用于发布代码的服务器管理员将目录命名为 `Linux`（这是
    `Linus` 和 `Unix` 的混合），从以后这个名字就流传了下来。


    大多数人都在使用 Linux，无论他们是否意识到这一点。为什么呢？因为你今天在互联网上看到的许多网页都是运行在 Linux 服务器上的。这些服务器是安全的，这就是为什么许多公司选择使用
    Linux，而且还有一个大型用户和贡献者社区组成的优秀支持系统。如果你拥有安卓设备、个人视频录制机、相机、数字存储设备，甚至是一个汽车，你就在使用 Linux。


    与 Mac OS 和 Windows 不同，Linux 有许多不同的格式，被称为发行版（distros）。这些是基于原始 Linux 内核制作成操作系统的软件集合——Linux
    是开源的意味着任何人都可以获取源代码并为了自己的使用对其进行重塑。


    在整本书中，我将为你提供大量的实践示例和一些练习供你尝试。这些内容将帮助巩固你所学的知识。此外，在每一章的末尾，我都包含了一个快速测验——你可以在书末找到答案。


    再次感谢你购买这本书，希望你喜欢！


    # 第 1 章：安装虚拟机


    `VirtualBox` 是一种虚拟机，最初由 Sun MicroSystems 开发，现归 Oracle 所有。它模拟了一台计算机，每个虚拟机都可以有自己的应用程序、操作系统。`VirtualBox`
    是测试操作系统的理想选择，可以在 Windows 或 Mac 上运行。我们将如何在 Windows 或 Mac 上安装 `VirtualBox`。通过这种方法，你不需要对当前系统进行任何永久更改。


    ### Windows


    - 前往 VirtualBox 页面并找到最新版本；点击它。

    - 在下一页，寻找以 `.exe` 结尾的文件并下载它——记住你保存的位置。

    - 安装程序下载完成后，双击 `.exe` 文件并按照屏幕指示安装到 Windows——注意安装期间可能会丢失网络连接，因为正在安装虚拟网络适配器。

    - 现在你必须重启电脑，你应该会在应用程序中找到 `VirtualBox`。在这里，你可以运行并安装任何你想尝试的操作系统。


    ### Mac


    - 前往 VirtualBox 下载页面并下载 Mac 的最新版本。

    - 将 `.dmg` 保存到你记得的位置——确保下载的是 OS X hosts 版本。

    - 找到该文件并使用执行文件进行安装。

    - 重启电脑，即可开始使用 `VirtualBox`。


    # 使用镜像安装 Linux


    在你按照上述步骤将 `VirtualBox` 安装到计算机后，你需要下载 Ubuntu Linux 的磁盘镜像。


    ### Windows


    - 首先，如果你的计算机上尚未安装 BitTorrent 客户端，请现在下载一个——BitTorrent 是一种从其他用户下载内容的 P2P ，可以显著减轻
    Ubuntu 服务器的负载。

    - 现在前往 Ubuntu 发布网站下载最新发布版本——不要点击任何 Desktop CD 的链接。你会在页面底部找到完整的链接列表，并确保点击扩展名为 `.iso.torrent`
    的一个——将其下载到你记得的位置。

    - 现在将其拷贝到可启动的 USB 盘中。


    这里有一个注意——如果你安装了 `WinRAR`，它会自动关联你下载的文件，并询问你是否要使用 `WinRAR` 提取内容——不要使用 `WinRAR`，也不要提取
    `.iso`。


    **重要**——在开始下一步之前，请将你硬盘的内容备份到安全的地方！如果不这样做，你将丢失所有数据！


    - 从开始菜单打开 `VirtualBox` 并点击 `新建`——这会打开新建虚拟机向导。

    - 点击 `下一步` 并为你的虚拟机命名——建议命名为 Ubuntu 或 Linux 以于识别。


