    ### Mac OS


    当 `VirtualBox` 安装完成后，你需要下载 `iso`

    * 转到 `Ubuntu` 下载页面并点击 Mac 版 `iso` 镜像——选择你的地理位置然后点击 `Begin Download`（开始下载）。确保保存该文件，不要打开或挂载它

    * 打开 `VirtualBox` 并注册它

    * 现在你可以创建一个新的虚拟机——点击 `New`（新建）打开向导

    * 点击 `Next`（下一步）并为虚拟机输入名称

    * 从操作系统菜单中选择 `Linux Ubuntu` 并点击 `Next`

    * 将你的基础内存设置为 `384 MB` 并点击 `Next`

    * 现在你需要点击创建一个新硬盘，这只是一个在现有驱动器上占用空间的磁盘——确保你有足够的空间进行操作！接受所有默认设置并点击 `Next`

    * 将出现 `Create New Virtual Disk`（创建新虚拟磁盘）向导，点击 `Next`

    * 点击 `Dynamically Expanding Storage`（动态扩展存储）并点击 `Next`

    * 选择你想让硬盘所在的位置以及大小——`2 TB` 是最大的，尽管 `8 GB` 已经足够了

    * 点击 `Next`（下一步）然后点击 `Finish`（完成）

    * 框架已就绪，确保你已将 `iso` 复制到可启动的 `USB` 或 `DVD` 磁盘


    `VirtualBox` 现在将向你显示有一个名为 `Ubuntu Linux` 的虚拟机

    * 插入你的 `DVD` 或 `USB`

    * 点击 `CD/DVD` 然后勾选 `Mount CD/DVD drive`（挂载 CD/DVD 驱动器）框

    * 点击 `ISO Image File`（ISO 文件）

    * 点击 `No Media`（无媒体）旁边的文件夹，将你的 `.iso` 文件拖入其中

    * 点击 `Select`（选择）然后点击 `OK`（确定）

    * 点击 `Start`（启动），将屏幕黑屏幕——这是新的会话，你现在做的一切都将在虚拟机上进行——如果你想切换回 Mac，只需按下空格键左侧的 `Command`
    键

    * 点击 `OK`（确定）

    * 当 `Ubuntu` 屏幕出现时，双击 `Install`（安装）并回答屏幕上出现的问题

    * 完成后点击 `Forward`（下一步）

    * 现在接受 `Ubuntu` 的默认值并点击 `Forward`（下一步）

    * 输入你的个人信息，包括新密码和你的机器名称

    * 选择自动登录还是使用密码，并点击 `Forward`（下一步）

    * 点击 `Install`（安装）并等待

    * 安装完成后，你会被要求使用密码进入，或者将自动进入 `Linux` 桌面，取决于你选择了哪个选项

    * `Ubuntu` 现在将检查更新，请点击 `Install Updates`（安装更新）并等待

    * 需要重启你的 Mac，你就准备好了


    ### 如何从零安装 CentOS


    `CentOS` 是一个 `Linux` 发行版，以下是安装方法：

    * 转到 `CentOS` 下载页面并下载 `iso`

    * 现在制作一个格式化的驱动器，将 `iso` 传输到 `USB` 盘。要这样做，插入你的 `USB` 并打开命令行窗口。输入以下

    ```bash

    dd if=/iso/CentOS.iso of=/devdb

    ```

    * 在桌面点击 `Install to Drive`（安装到驱动器）

    * 选择键盘类型和语言——确保你选择了正确的，否则某些键会乱码

    * 安装程序的默认选项是 `Automatic Partitioning`（自动分区）你的硬盘——点击 `Installation Destination`（安装目标）并改为
    `Custom Partitioning`（自定义分区）

    * 选择要安装 `CentOS` 的硬盘并点击 `Other Storage Options`

    * 点击 `Standard Partition`

    * 在你的分区上创建 `Swap Space`，选择该分的 `File System` 并命名为 `swap`，点击 `Reformat`（格式化）

    * 现在你需要创建一个挂载点——这是 `root` 分区安装的位置。设置你的挂载点，然后根据需要设置 `Label`（标签）和 `Capacity`（容量）

    * 点击 `ext4` 设置文件系统，然后点击 `Reformat`（格式化）

    * 点击 `Done`（完成）并接受你所做的更改

    * 点击时钟设置时区；点击 `Done`

    * 点击 `Begin Installation`（开始安装）；在此过程中遵循屏幕指令，设置你的用户账户和 `root` 密码。要这样做，点击 `Root
    Password` 并输入两次密码；点击 `Done`

    * 创建用户账户时输入详细信息，如果是管理员账户，请勾选 `Make This User Administrator`（将此用户设管理员）和 `Require
    a Password`（需要密码）

    * 安装完成后，你会看到一条提示成功的消息；点击 `Quit`（退出）

    * 注销然后登录你新的 `CentOS` 安装

    * 接受 `EULA`（用户许可许可协议），你就准备好了


