    * 如果你打算在虚拟 Linux 中添加软件或安装可能的大文件，请留出一些缓冲区；点击 `Create`（创建）

    * 虚拟硬盘创建完成后，你需要添加下载的 `.iso` 镜像。点击 `Settings`（设置）>``Storage`（存储）>`CD/DVD Device`

