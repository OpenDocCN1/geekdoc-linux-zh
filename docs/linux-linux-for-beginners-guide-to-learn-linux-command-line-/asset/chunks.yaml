  raw: 'Above we used a command called set and this uses quotes to make sure that
    Master Noodle is treated as just one argument. If Master and Noodle had been separate
    arguments, name would have had a value of list length 2\. In fish, all variables
    are classed as lists and they can contain no values or any number of values.


    Some variables will have just one value, $PWD being one of them. Conventionally,
    we would talk about the value of that variable but, in reality, it is the only
    value it has. Other variables have several values, like $PATH. During the expansion
    of the variable, it will extend into several arguments:


    > echo $PATH


    /usr/bin /bin /usr/sbin /sbin /usr/local/bin


    A list is not able to contain any other list; there is no such thing as recursion
    here. A variable contains a list of strings and that is it. If you wanted to get
    a list length, you would use count:


    > count $PATH


    5


    You can append to any list by setting that list to itself with some extra arguments.
    In this example, we are going to append /usr/local/bin to $PATH:


    > set PATH $PATH /usr/local/bin


    Use square brackets to access each individual element. Indexing begins at 1 from
    the start and -1 from the end:


    > echo $PATH


    /usr/bin /bin /usr/sbin /sbin /usr/local/bin


    > echo $PATH[1]


    /usr/bin


    > echo $PATH[-1]


    /usr/local/bin


    Fish also allows you to access slices, which are ranges of elements


    > echo $PATH[1..2]


    /usr/bin /bin


    > echo $PATH[-1..2]


    /usr/local/bin /sbin /usr/sbin /bin


    And, just like with any other computer programming language, you can use for loops
    to iterate over lists:


    > for val in $PATH


        echo "entry: $val"


      end


    entry: /usr/bin/


    entry: /bin


    entry: /usr/sbin


    entry: /sbin


    entry: /usr/local/bin


    Command Substitutions


    A command substitution is when the output of a command is then used as an argument
    to a different command. Unlike many of the other shells, there are no backticks
    in fish for this; instead, parentheses are used:


    > echo In (pwd), running (uname)


    In /home/tutorial, running FreeBSD


    One of the more common idioms is to use a variable to capture the output from
    a command:


    > set os (uname)


    > echo $os


    Linux


    A command substitution is not expanded inside quote marks. Instead, the quotes
    can be closed temporarily, the command substitution added in and then the quotes
    re-opened, all in one argument


    > touch "testing_"(date +%s)".txt"


    > ls *.txt


    testing_1360099791.txt


    Combiners


    There is no special syntax in fish for combining commands; instead, there are
    three commands used – and, not, or


    > cp file1.txt file1_bak.txt; and echo "Backup successful"; or echo "Backup failed"


    Backup failed


    Conditionals


    Likewise, for the conditional execution of code, we use if, else and else if,
    depending on how a command is exited.


    if grep fish /etc/shells


        echo Found fish


    else if grep bash /etc/shells


        echo Found bash


    else


        echo Got nothing


    end


    And we have the command, switch


    switch (uname)


    case Linux


        echo Hi Bix!


    case Darwin


        echo Hi Hester!


    case FreeBSD NetBSD DragonFly


        echo Hi Bobby!


    case ''*''


        echo Hi, stranger!


    end


    Functions


    In fish, functions are lists of commands, which may or may not take arguments.
    We don’t pass arguments as numbered variables in fish, like $1 but in single lists
    instead. There are built-in functions in fish which you can use to create functions:


    > function say_hello


         echo Hello $argv


      end


    > say_hello


    Hello


    > say_hello everybody!


    Hello everybody!


    And there is no special syntax for prompt or no aliases in fish. Functions have
    their own place and you can use the functions keyword to list the names of all
    functions, of which fish already has a large number:


    Unlike other shells, fish does not have aliases or special prompt syntax. Functions
    take their place.


    > functions


    alias, cd, delete-or-exit, dirh, dirs, down-or-search, eval, export, fish_command_not_found_setup,
    fish_config, fish_default_key_bindings, fish_prompt, fish_right_prompt, fish_sigtrap_handler,
    fish_update_completions, funced, funcsave, grep, help, history, isatty, ls, man,
    math, nextd, nextd-or-forward-word, open, popd, prevd, prevd-or-backward-word,
    prompt_pwd, psub, pushd, seq, setenv, trap, type, umask, up-or-search, vared


    To find the source for a function, you pass its name to functions


    > functions ls


    function ls --description ''List contents of directory''


        command ls -G $argv


    end


    Loops


    These are similar to other shells and to many computer programming languages:


    While loops:


    > while true


        echo "Loop forever"


    end


    Loop forever


    Loop forever


    Loop forever


    ...


    For Loops:


    For loops are used for iterating over lists, i.e. lists of files:


    > for file in *.txt


        cp $file $file.bak


    end


    We use seq to iterate over lists of numbers:


    > for x in (seq 5)


        touch file_$x.txt


    end


    Prompt


    Fish does not have a prompt variable so, to display it, fish will execute a function
    that goes by the name of fish_prompt and the output from that function is the
    prompt. You are able to define your own if you want:


    > function fish_prompt


        echo "New Prompt % "


    end


    New Prompt % 


    You can have multiple lines if you want and  you can set the color using set_color,
    passing it as hex RGB or ANSI colors:


    > function fish_prompt


          set_color blue


          date "+%m/%d/%y"


          set_color FF0


          echo (pwd) ''>''


          set_color normal


      end


    02/06/13


    /home/tutorial >


    If you run fish_config prompt, you can choose from several sample prompts


    $PATH


    $PATH is one of the environment variables in fish and it is home to the directories
    that fish uses for commands. $PATH is not delimited string; it is a list. If you
    wanted to prepend /usr/local/bin and /usr/sbin to $PATH, you would write:


    > set PATH /usr/local/bin /usr/sbin $PATH


    You can do this in config_fish or you can modify the universal variable, $fish_user_paths
    – this is prepended to $PATH automatically. For example, if you wanted to add
    /usr/local/bin permanently to $PATH, you would write:


    > set -U fish_user_paths /usr/local/bin $fish_user_paths


    The major advantage to doing it this way is that there is no need to mess around
    with files; all you do is run that once on the command line and the changes will
    happen in the current session and in future ones. NOTE – do NOT add that code
    line to config_fish – if you do, the variable will just grow in size every time
    you use fish!


    Startup


    When fish starts up it begins executing the commands in ~/.config/fish/config.fish.
    If that does not exist, you can create it. You can also create functions or variables
    directly in config_fish with the commands shown above, i.e.


    > cat ~/.config/fish/config.fish


    set -x PATH $PATH /sbin/


    function ll


        ls -lh $argv


    end


    That said, the more efficient way to do it is to use universal variables and autoloading
    functions.


    Autoloading Functions


    When fish comes across a command, it will try to autoload a function for it, looking
    for a file that has the same name as the command in it. It will look in ~/.config/fish/functions/.
    For example, if you wanted a function called ll, you would add a text file called
    ll.fish to ~/.config/fish/functions:


    > cat ~/.config/fish/functions/ll.fish


    function ll


        ls -lh $argv


    end


    The would be the best way of defining a prompt:


    > cat ~/.config/fish/functions/fish_prompt.fish


    function fish_prompt


        echo (pwd) "> "


    end


    Universal Variables


    Universal variables are those whose value is shared over all fish instances, now
    and forever, even after rebooting. You can use set -U to make a universal variable:


    > set -U EDITOR vim


    Now in another shell:


    > echo $EDITOR


    Vim


    Quick Quiz 5


    1.  What is fish?


    2.  How do you add a literal space into an argument?


    3.  What is the help command?


    4.  What sign is used for variable substitution?


    5.  What are the three combiners?


    6.  What are the three conditionals?


    7.  If syntax is highlighted in red, what does it mean?


