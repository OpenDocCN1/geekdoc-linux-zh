  raw: "On Linux, normally we would have two users who could change the file or directory\
    \ permissions – the owner and the root or superuser. The root user is able to\
    \ do everything in the system like a system administrator can. Normal users can\
    \ generally only access directories and files that are held in their home directories\
    \ and perhaps one or two others for collaboration and sharing purposes – this\
    \ how the Linux system is kept stable and secure.\n\nBasic Security\n\nYour space\
    \ on the Linux system is the home directory and it’s up to you to make sure that’s\
    \ the way it stays. Some users will give themselves full permissions for read,\
    \ write, and execute but will give no permission for others or groups. However,\
    \ everyone has their own setup.\n\nFor the best security, you should not give\
    \ group or others any write access to your own home directory but you can give\
    \ execute permissions without adding on read permissions. If you do this, other\
    \ users can access your home directory but they cannot see what is there and a\
    \ prime example of this would be a personal web page. Some systems run web servers\
    \ and give each of their users a web space of their own; the most common setup\
    \ is to create a directory in the home directory and call it public_html, allowing\
    \ the server to read it and to display what is in it. However, because the web\
    \ server is not the same user as you are, it cannot get in and it can’t read the\
    \ files. In this situation, it is necessary for permission to execute to be granted\
    \ on the home directory, allowing the web server user to get to the resources\
    \ it needs.\n\nExercises\n\nHave a look at the permissions you have on your home\
    \ directory and then explore the files inside and see what their permissions are\n\
    \nNext, change some of the permissions, using long and shorthand methods, and\
    \ both absolute and relative paths, just so you get the hang of them. As a start,\
    \ remove the read permission from one file and then try reading it to see what\
    \ happens.\n\nNext, create a new directory and add some files in. Now have a go\
    \ at removing permissions from you on the directory and see what can and can’t\
    \ be done\n\nLastly, just explore the system and have a look at permissions in\
    \ system directories\n\nQuick Quiz\n\n1.  Which permission, when applied to a\
    \ directory in the file system, will allow a user to enter the directory?\n\n\
    *   Read\n\n*   Write\n\n*   Execute\n\n*   Access Control\n\n2.  A user needs\
    \ to open a file, edit it, and then save the changes. What permissions does he\
    \ need to do this? (Choose two.)\n\n*   Read\n\n*   Write\n\n*   Execute\n\n*\
    \   Modify\n\n3.  A file named staff.odt has a mode of rw-r- -r- -. If rbob is\
    \ the file's owner, what can he do with it?\n\n*   He can open the file and view\
    \ its contents, but he can't save any changes.\n\n*   He can open the file, make\
    \ changes, and save the file.\n\n*   He can change ownership of the file.\n\n\
    *   He can run the file if it's an executable.\n\n4.  A file named staff.odt has\
    \ a mode of rw-r- -r- -. If mhuman is not the file's owner but is a member of\
    \ the group that owns this file, what can he do with it?\n\n*   He can open the\
    \ file and view its contents, but he can't save any changes.\n\n*   He can open\
    \ the file, make changes, and save the file.\n\n*   He can change ownership of\
    \ the file.\n\n*   He can run the file if it's an executable.\n\n# \n\nChapter\
    \ 7: Getting to Grips with Editors\n\nThe code in this chapter is courtesy of\
    \ [http://ryanstutorials.net/linuxtutorial/vi.php](http://ryanstutorials.net/linuxtutorial/vi.php)\n\
    \nThere are so many text editors to choose from for Linux that it can easily become\
    \ confusing. In this chapter, we are going to look at nano and vi, two very simple\
    \ editors for Linux.\n\nNano\n\nNano is already installed in many of the Linux\
    \ distributions and it works very well with Sudo. Here’s an overview of how to\
    \ use it.\n\nRunning Nano\n\nThere are two ways to run nano:\n\n*   At the command\
    \ prompt, type in nano\n\n*   Or input the following command -  nano/name of file\
    \ – insert the name of the file and nano will look for it; if it finds it, it\
    \ will open it, if not you will get an empty buffer with the filename as its name\n\
    \nAt the top of the screen you will see information about the file you are working\
    \ on or, if none, it will say New Buffer. Following that is the content of your\
    \ document in the form of text. Then is a system message that gives you information\
    \ about the program that is executing a function and it will likely say “new file”.\
    \ Lastly, you will see the shortcut lines.\n\nNano is a WYSIWYG editor, or “what\
    \ you see is what you get”. Unless you used a key to modify your text, what you\
    \ type in is what goes into the text input. Type something into it now so that\
    \ we have something to play around with.\n\nShortcuts\n\nShortcuts are program\
    \ functions, like exiting, saving, etc. and you will see the commonest ones at\
