  raw: 'Using the less command, you can search for a keyword pattern in a text file.
    For example, if you wanted to find all the instances of science in the science.txt
    file, you would type in 


    % less science.txt


    And then, staying in less, you type a forward slash and the work you want to search:


    /science


    All the instances of the word are highlighted; to find the next instance, type
    in


    grep


    grep is one the standard utilities on Linux and it is used to search for specific
    patterns or words. Clear your screen and type in


    % grep science science.txt


    Now you can see that the command grep prints each of the lines that have the word
    science in it


    Or has it?


    Now type in


    % grep Science science.txt


    grep is case sensitive and will distinguish between science and Science. If you
    want to ignore this case sensitivity, use -i. For example, type in


    % grep -i science science.txt


    If you want to search for a specific pattern or phrase, it must be inside single
    quote marks. To search for spinning top, you would type in


    % grep -i ''spinning top'' science.txt


    Other options with the grep command are:


    -v will display the lines that don’t match the specified text 


    -n will precede each of the matching lines with the correct line number 


    -c will only print out the total number of the matched lines 


    Have a go at these and see what the results are. You can use more than one of
    these in one command so, to show the number of lines that do not include Science
    or science, you would type in


    % grep -ivc science science.txt


    wc


    This is a neat utility and is short for word count. If you wanted to do a total
    word count on the science.txt file, you would type


    % wc -w science.txt


    If you want to know how many lines are in the file, type:


    % wc -l science.txt


    Section Summary


    CommandMeaning


    cp file1 file2copies file 1 and names it file2


    mv file1 file2moves or renames file1 to file2


    rm fileremoves a file


    rmdirremoves a directory


    cat filedisplays a file


    less fileshows one page of a file at a time


    head filedisplays just the first 10 lines of a file (or however many specified)


    tail filedisplays the last 10 lines) or however many specified) of a file


    grep “keyword” filesearch for a specific keyword in a file


    wc “keyword” filecounts how many characters or words are in a file


    Redirection


    Most of the processes that are initiated by Linux commands will write to the terminal
    screen, which is the standard output. Many of them also take their input from
    the keyboard. As well as that, there are also those that write error messages
    to the terminal screen. Already, we have used the cat command to write a file’s
    contents to the terminal so now type the following, without specifying any file


    % cat


    Type a few words in using the keyboard, anything will do, and then press return


    Hold down CTRL and press the d key – this will finish the input


    When you run the cat command without a file, it will read the keyboard input and,
    when it receives the end of the file, the d, it will copy it to your terminal


    In Linux, we are able to redirect input and output.


    Redirecting Output


    The . symbol is used to redirect command output. For example, if we wanted to
    create a file with a name of list1, that had a list of fruits in it, we would
    type:


    % cat > list1


    Then you type the names of a few fruits and, after each one, press return. For
    example


    apple


    pear


    banana


    then press ctrl+d


    The cat command will read what was input from the keyboard and > will redirect
    it to the output, the screen, in a file named as list1\. If you wanted to read
    what the file had in it, you would type


    % cat list1


    Exercise


    Now, using the same method, create a file named list2, with these fruits in it
    – plum, orange, grapefruit, mango. Now read the file contents


    Appending to Files


    >> will append the standard output to a file so, if we wanted to add some more
    items to list1, we would type


    % cat >> list1


    And then the names of more fruits


    grape


    peach


    orange


    Then press CTRL+d to stop


    To read the file contents, type


    % cat list1


    You should, by now, have two files, one containing six fruits and one containing
    four fruits. Now we will join the two lists using the cat command into one file
    named biglist. Type in


    % cat list1 list2 > biglist


    This will read the contents of both lists, in turn, and then output the text from
    each into a new file called biglist


    To read the contents of biglist, type in


    % cat biglist


    Redirecting Input


    To redirect command input we use the < symbol. This will sort a list in numerical
    or alphabetical order. Type in


    % sort


    Now type some animal names in and press return after each of them:


    ape


    cat


    dog


    bird


    then press CTRL+d to stop


    The output would be


    ape


    bird


    cat


    dog


    When you use < you can redirect input from a file instead of from the keyboard.
    For example, if you wanted a list of fruits sorted, you would type


    % sort < biglist


    The list will be sorted and output on the screen


    If you wanted the sorted list to be output to a file, you would type


    % sort < biglist > slist


    The cat command is used for reading the contents of slist


    Pipes


    If you want to know who is on the same system as you, you would type in


    % who


    One way to get a list of names that has been sorted would be to type


    % who > names.txt


    % sort < names.txt


    This is a rather slow method and you would need to remember that the temporary
    names file has to be removed when you are done. Really, what you are looking to
    do is connect


    the output from the who command straight to the input of the command called sort.
    This is what pipes are for and the symbol for the pipe is a vertical bar (|).
    For example, if you typed in


    % who | sort


    You would get the same result but it would be much quicker


    If you wanted to find out how many other users have logged in, type in


    % who | wc -l


    Exercise


    Use pipes to show all of the lines in list1 and list2 that have the letter p in
    them and then sort the results


    Answer


    As this is a little more complex, I have opted to show you the answer this time:


    % cat list1 list2 | grep p | sort


    Section Summary


    CommandMeaning


    command > filewill redirect the standard output to a specified file


    command >> filewill append the standard output to a specified file


    command < filewill redirect the standard input from a specified file


    command1 | command2will pipe command1 output to command2 input


    cat file1 file 2 > file0will concatenate or join files 1 and 2 to file0


    sortwill sort the data


    whowill show you who is logged on to the system with you


    Wildcards


    * is a wildcard character and it will match with none or more characters in a
    directory or file name. For example, go to your linuxstuff directory and type
    in


    % ls list*


    This shows you all of the files that are in the current directory, beginning with
    list…


    Now type in


    % ls *list


    This shows all the files that end with …list in the current directory


    ? is another wildcard character and it is used to match one character only. So,
    for example, if you were to type ?ouse, it would match with files like mouse or
    house, but it wouldn’t match with grouse. Type in


    % ls ?list


    And see what happens


