- fmt: "\nCode in this chapter is courtesy of [http://ryanstutorials.net/linuxtutorial/permissions.php](http://ryanstutorials.net/linuxtutorial/permissions.php)\n\
    \nNow we are going to look at setting file and directory permissions. A permission\
    \ is used to specify what a user can and cannot do with a directory or a file.\
    \ This makes permissions very important for creating a working environment that\
    \ is secure. You wouldn’t want anyone to be messing about and making changes to\
    \ your files and your system files also have to be kept safe from deliberate or\
    \ accidental damage. Linux permissions are actually very easy to get to grips\
    \ with.\n\n Permissions\n\nPermissions dictate that you can read, write and/or\
    \ execute specific files and directories. These are referred to by a single letter\
    \ for each of them:\n\n- `r` – read, allowing you to read file contents\n- `w`\
    \ – write, allowing you to edit the contents of a file\n- `x` – execute, allowing\
    \ you to run a file as if it were a script or a program\n\nFor each file, three\
    \ sets of users are defined:\n\n- `owner` – one user who is the file owner, usually\
    \ the person who was responsible for creating the file but not always\n- `group`\
    \ – each file will belong to one specific group\n- `others` – anyone who doesn’t\
    \ fall into one of the above two sets\n\nSo, there are three permissions and three\
    \ sets of users and that, in a nutshell, is what permissions are. Now let’s look\
    \ at how to see and to edit them:\n\n### Viewing Permissions\n\nTo view the permissions\
    \ on a file, we use the command `ls`, with the long listing option:\n\n```\nls\
    \ -l [path]\nls -l /home/ryan/linuxtutorialwork/frog.png\n-rwxr----x 1 harry users\
    \ 2.7K Jan 4 07:32 /home/ryan/linuxtutorialwork/frog.png\n```\n\nIn this example,\
    \ to identify the permissions we are looking at the first 10 characters in the\
    \ output.\n\n- Character 1 tells you what the file type is. If it is `d`, it is\
    \ a directory, `–` and it is an ordinary file\n- The next 3 tell you what the\
    \ file permissions are for the file owner. A letter tells you that there is a\
    \ permission and identifies which one and the `–` is telling you that there are\
    \ no permissions. In the above example, the owner of this file has permissions\
    \ to read, write to and execute the file.\n- The next 3 tell you which permissions\
    \ a group has and, for this one, the group can read the file but cannot write\
    \ to it or execute it. Note that the permissions always go in the same order –\
    \ read, write, execute\n- The last 3 characters are representative of the permissions\
    \ for everyone else, or others. For this, they only the permissions to execute\
    \ the file, not to read or write to it.\n\n### Changing Permissions\n\nIf you\
    \ want to change the file or directory permissions, a command named `chmod` is\
    \ used. `chmod` stands for change file mode bits, something of a mouthful but\
    \ really, all you need to remember is the mode bits as these are the permission\
    \ indicators:\n\n```\nchmod [permissions] [path]\n```\n\nThe permissions arguments\
    \ for `chmod` have three separate components:\n\n- Who the permission is being\
    \ changed for – `ugoa` – User or owner, group, others and all\n- Is the permission\
    \ being granted or being revoked? A `+` or a `–` sign is used to indicate this\n\
    - Which permission is being set? `rwx` – read, write, execute\n\nLook at these\
    \ examples:\nFirst, we grant the group execute permission then we take write permission\
    \ away from the owner:\n\n```\nls -l frog.png\n-rwxr----x 1 harry users 2.7K Jan\
    \ 4 07:32 frog.png\nchmod g+x frog.png\nls -l frog.png\n-rwxr-x--x 1 harry users\
    \ 2.7K Jan 4 07:32 frog.png\nchmod u-w frog.png\nls -l frog.png\n-r-xr-x--x 1\
    \ harry users 2.7K Jan 4 07:32 frog.png\n```\n\nIf you’t want to go about the\
    \ business of individually assigning permissions, you can do multiple ones at\
    \ the same time:\n\n```\nls -l frog.png\n-rwxr----x 1 harry users 2.7K Jan 4 07:32\
    \ frog.png\nchmod g+wx frog.png\nls -l frog.png\n-rwxrwx--x 1 harry users 2.7K\
    \ Jan 4 07:32 frog.png\nchmod go-x frog.png\nls -l frog.png\n-rwxrw---- 1 harry\
    \ users 2.7K Jan 4 07:32 frog.png\n```\n\nSo, it probably seems a little strange\
    \ that the owner of a file can take away their own ability to read, to write or\
    \ to execute a file but there are good reasons why this might happen. You could\
    \ have a file that has data in it that you’t want accidentally changed for example.\
    \ While these permissions can be removed, the owner may not remove their ability\
    \ to set the permissions and that leaves control of the file with the owner.\n\
    \n### Shorthand Method of Setting Permissions\n\nWhile the above method for setting\
    \ permissions isn’t difficult, can be a little long-handed if you need to set\
    \ specific permissions to specific files. For that, we have a shorter version\
    \ of doing it. To understand this, you need to understand the number systems in\
    \ Linux. The normal number system is a decimal system with base 10 – numbers 0\
    \ to 9. We also have octal number system which is base 8 – numbers 0 to 7. There\
    \ are three permissions and each is either on or it is off and as such, there\
    \ are 8 combinations. We can also use binary to represent the numbers and there\
    \ are only two options with this – 0 and 1. The following shows how octal numbers\
    \ are mapped to binary:\n\n| Octal | Binary |\n| :--- | :--- |\n| 0 | 0000 |\n\
    | 1 | 0001 |\n| 2 | 0010 |\n| 3 | 0011 |\n| 4 | 0100 |\n| 5 | 0101 |\n| 6 | 0110\
    \ |\n| 7 | 0111 |\n\nWhat is interesting is that we can use just binary values\
    \ to represent the 8 octal numbers, with every possible combination of 1 and 0\
    \ included. So, there are three bits and there are three permissions. 1 can represent\
    \ on and 0 can represent off and that means that one octal number can be used\
    \ as a way of representing a permission set for a set of users. If we use three\
    \ numbers, we can represent permissions of all three – owner, group, and others.\
    \ Let’s look at a few examples:\n\n```\nls -l frog.png\n-rw-r----x 1 harry users\
    \ 2.7K Jan 4 07:32 frog.png\nchmod 751 frog.png\nls -l frog.png\n-rwxr-x--x 1\
    \ harry users 2.7K Jan 4 07:32 frog.png\nchmod 240 frog.png\nls -l frog.png\n\
    --w-r----- 1 harry users 2.7K Jan 4 07:32 frog.png\n```\n\n### Permissions for\
    \ Directories\n\nThe above permissions were for files but we can use the same\
    \ ones for directories. However, they will behave a little differently:\n\n- `r`\
    \ – read, give the ability to read a directory’s contents\n- `w` – write, gives\
    \ the ability to create directories and files in the directory\n- `x` – execute,\
    \ gives you the ability to get into a directory\n\nLet’s have a look at how these\
    \ work:\n\n```\nls testdir\nfile1 file2 file3\nchmod 400 testdir\nls -ld testdir\n\
    -r-------- 1 ryan users 2.7K Jan 4 07:32 testdir\ncd testdir\ncd: testdir: Permission\
    \ denied\nls testdir\nfile1 file2 file3\nchmod 100 testdir\nls -ld testdir\n---x------\
    \ 1 ryan users 2.7K Jan 4 07:32 testdir\ncd testdir\nls testdir\nls: cannot open\
    \ directory testdir/: Permission denied\n```\n\nNote that, when we ran `ls` on\
    \ lines 5 and 14, we used the `-d` which is used to reference directory. Normally,\
    \ if `ls` is given a directory as an argument, the contents of the dictionary\
    \ will be listed. However, in this case, what we want to see is the direct permissions\
    \ for that directory and using the `-d` option lets us do that.\n\nThese permissions\
    \ might seem somewhat confusing to start with but all you need to remember is\
    \ they are only for the directory, not for the files that are contained inside.\
    \ For example, you could have a directory that you don’t have permission to read\
    \ even though it has files in it that you do have permission to read. Provide\
    \ you are aware that the file is there and you know what its name is, you are\
    \ still able to read it.\n\n```\nls -ld testdir\n--x------- 1 ryan users 2.7K\
    \ Jan 4 07:32 testdir\ncd testdir\nls testdir\nls: cannot open directory .: Permission\
    \ denied\n```\n"
  raw: 'Code in this chapter is courtesy of [http://ryanstutorials.net/linuxtutorial/permissions.php](http://ryanstutorials.net/linuxtutorial/permissions.php)


    Now we are going to look at setting file and directory permissions. A permission
    is used to specify what a user can and cannot do with a directory or a file. This
    makes permissions very important for creating a working environment that is secure.
    You wouldn’t want anyone to be messing about and making changes to your files
    and your system files also have to be kept safe from deliberate or accidental
    damage. Linux permissions are actually very easy to get to grips with.


    Permissions dictate that you can read, write and/or execute specific files and
    directories. These are referred to by a single letter for each of them:


    *   r – read, allowing you to read file contents


    *   w – write, allowing you to edit the contents of a file


    *   x – execute, allowing you to run a file as if it were a script or a program


    For each file, three sets of users are defined:


    *   owner – one user who is the file owner, usually the person who was responsible
    for creating the file but not always


    *   group – each file will belong to one specific group


    *   others – anyone who doesn’t fall into one of the above two sets


    So, there are three permissions and three sets of users and that, in a nutshell,
    is what permissions are. Now let’s look at how to see and to edit them:


    Viewing Permissions


    To view the permissions on a file, we use the command, ls, with the long listing
    option:


    ls -l [path]


    ls -l /home/ryan/linuxtutorialwork/frog.png


    -rwxr----x 1 harry users 2.7K Jan 4 07:32 /home/ryan/linuxtutorialwork/frog.png


    In this example, to identify the permissions we are looking at the first 10 characters
    in the output.


    *   Character 1 tells you what the file type is. If it is d, it is a directory,
    – and it is an ordinary file


    *   The next 3 tell you what the file permissions are for the file owner. A letter
    tells you that there is a permission and identifies which one and the – is telling
    you that there are no permissions. In the above example, the owner of this file
    has permissions to read, write to and execute the file.


    *   The next 3 tell you which permissions a group has and, for this one, the group
    can read the file but cannot write to it or execute it. Note that the permissions
    always go in the same order – read, write, execute


    *   The last 3 characters are representative of the permissions for everyone else,
    or others. For this, they only the permissions to execute the file, not to read
    or write to it.


    Changing Permissions


    If you want to change the file or directory permissions, a command named chmod
    is used. Chmod stands for change file mode bits, something of a mouthful but really,
    all you need to remember is the mode bits as these are the permission indicators:


    chmod [permissions] [path]


    The permissions arguments for chmod have three separate components:


    *   Who the permission is being changed for – ugoa – User or owner, group, others
    and all


    *   Is the permission being granted or being revoked? A + or a – sign is used
    to indicate this


    *   Which permission is being set?  - rwx – read, write, excite


    Look at these examples:


    First, we grant the group execute permission and then we take write permission
    away from the owner:


    ls -l frog.png


    -rwxr----x 1 harry users 2.7K Jan 4 07:32 frog.png


    chmod g+x frog.png


    ls -l frog.png


    -rwxr-x--x 1 harry users 2.7K Jan 4 07:32 frog.png


    chmod u-w frog.png


    ls -l frog.png


    -r-xr-x--x 1 harry users 2.7K Jan 4 07:32 frog.png


    If you don’t want to go about the business of individually assigning permissions,
    you can do multiple ones at the same time:


    ls -l frog.png


    -rwxr----x 1 harry users 2.7K Jan 4 07:32 frog.png


    chmod g+wx frog.png


    ls -l frog.png


    -rwxrwx--x 1 harry users 2.7K Jan 4 07:32 frog.png


    chmod go-x frog.png


    ls -l frog.png


    -rwxrw---- 1 harry users 2.7K Jan 4 07:32 frog.png


    So, it probably seems a little strange that the owner of a file can take away
    their own ability to read, to write to or to execute a file but there are some
    good reasons why this might happen.  You could have a file that has data in it
    that you don’t want accidentally changed for example. While these permissions
    can be removed, the owner may not remove their ability to set the permissions
    and that leaves control of the file with the owner.


    The Shorthand Method of Setting Permissions


    While the above method for setting permissions isn’t difficult, it can be a little
    long-handed if you need to set specific permissions to specific files on a regular
    basis. For that, we have a shorter version of doing it. To understand this, you
    need to understand the number systems in Linux. The normal number system is a
    decimal system with a base 10 number – numbers 0 to 9\. We also have the octal
    number system which is base 8 system – 0 to 7\. There are three permissions and
    each is either on or it is off and, as such, there are 8 combinations. We can
    also use binary to represent the numbers and there are only two options with this
    – o and 1.  The following shows you how octal numbers are mapped to binary:


    OctalBinary


    0000


    1001


    2010


    3011


    4100


    5101


    6110


    7111


    What is interesting is that we can use just three binary values to represent the
    8 octal numbers, with every possible combination of the 1 and 0 included. So,
    there are three bits and there are three permissions. 1 can represent on and 0
    can represent off and that means that one octal number can be used as a way of
    representing a permission set for a set of users. If we use three numbers, we
    can represent permissions of all three - owner/user, group, and others. Let’s
    look at a few examples:


    ls -l frog.png


    -rw-r----x 1 harry users 2.7K Jan 4 07:32 frog.png


    chmod 751 frog.png


    ls -l frog.png


    -rwxr-x--x 1 harry users 2.7K Jan 4 07:32 frog.png


    chmod 240 frog.png


    ls -l frog.png


    --w-r----- 1 harry users 2.7K Jan 4 07:32 frog.png


    Permissions for Directories


    The above permissions were for files but ewe can use the same ones for directories.
    However, they will behave a little differently:


    *   r – read, give the ability to read a directory’s contents


    *   w – write, gives the ability to create directories and files in the directory


    *   x – execute, gives you the ability to get into a directory


    Let’s have a look at how these work:


    ls testdir


    file1 file2 file3


    chmod 400 testdir


    ls -ld testdir


    -r-------- 1 ryan users 2.7K Jan 4 07:32 testdir


    cd testdir


    cd: testdir: Permission denied


    ls testdir


    file1 file2 file3


    chmod 100 testdir


    ls -ld testdir


    ---x------ 1 ryan users 2.7K Jan 4 07:32 testdir


    cd testdir


    ls testdir


    ls: cannot open directory testdir/: Permission denied


    Note that, when we ran ls on lines 5 and 14, we used the -d which is used to reference
    directory. Normally, if ls is given a directory as an argument, the contents of
    the dictionary will be listed. However, in this case, what we want to see is the
    direct permissions for that directory and using the -d option lets us do that.


    These permissions might seem somewhat confusing to start with but all you need
    to remember is they are only for the directory, not for the files that are contained
    inside.  For example, you could have a directory that you don’t have permission
    to read even though it has files in it that you do have permission to read. Provide
    you are aware that the file is there and you know what its name is, you are still
    able to read it.


    ls -ld testdir


    --x------- 1 ryan users 2.7K Jan 4 07:32 testdir


    cd testdir


    ls testdir


    ls: cannot open directory .: Permission denied


    cat samplefile.txt


    Kyle 20


    Stan 11


    Kenny 37


    The Root User'
