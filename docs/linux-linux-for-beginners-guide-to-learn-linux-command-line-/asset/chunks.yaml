    # 第 2 章：Linux 目录结构


    如果你是从 Windows 系统转到 Linux 的，目录结构看起来会有些奇怪。这里不再有任何驱动器号，它们被 `a/` 和一些听起来很奇怪的目录名称所取代，其中大多数名称只有三个字母。FHS（即文件层次结构系统）定义了
    Linux 上的文件系统结构，但还有几个目录尚未在该标准下获得定义：


    ### / – 根目录 (Root Directory)


    在 Linux 上，所有内容都位于 `/` 目录下，这也称为根目录。这类似于 Windows 上的 `C:/`，但没有任何驱动器号。


    ### /bin – 核心用户二进制文件


    该目录包含了对于在单用户模式下挂载的系统至关重要的二进制文件或程序。像 Firefox 这样的程序将存储在名为 `/usr/bin` 的目录中，而像 `bash`
    shell 这样的工具和系统程序则位于 `/bin` 中。


    ### /boot – 静态启动文件


    这是启动系统所需文件所在的位置，例如 GRUB 引导加载程序和内核文件。然而，配置文件位于 `/etc` 中。


    ### /cdrom – CD-ROM 挂载点


    此目录不属于 FHS 标准，但在大多数操作系统中仍然可以找到。它是当你向电脑插入 CD-ROM 时的临时位置。


    ### /dev – 设备文件


    在 Linux 中，设备以文件的形式呈现，该目录包含若干个代表设备的特殊文件。这些并不是你所理解的那种意义的文件，但它们看起来很像。例如，如果你看到 `/dev/sda`，它代表你系统中的初始
    SATA 驱动器。你还在此处找到伪设备，即不对应于任何硬件的虚拟设备。


    ### /etc – 配置文件


    这里是存放配置文件的地方，可以在任何文本编辑器中对其进行编辑。然而，这里只包含系统配置；如果你有用户特定的配置，它们将在用户的家目录中找到。


    ### /home – 用户目录


    在这里你会为每个用户找到一个家目录。它包含了特定于该用户的数据文件和配置文件，每个用户都只能向自己的家目录进行写入。如果你想修改他人的，你需要提升权限，即成为
    `root` 用户。


    ### /lib – 核心共享库


    它包含了 `/bin` 和 `/sbin` 中的二进制文件运行所需的所有库。


    ### /lost+found – 恢复的文件


    每个文件系统都有一个“丢失和找回”目录；如果你的系统崩溃，在下次启动时会执行文件系统检查。如果发现损坏的文件，它们会被放入该目录，让你有机会尽可能多地恢复它们。


    ### /media – 可移动介质


    在这里你会找到子目录，这是连接到系统的可移动介质挂载的地方。例如，BD、DVD 或 USB。当每个介质被挂载时，会出现一个新驱动器，允许你访问介质内容。


    ### /mnt – 临时挂载点


    这是管理员在在使用临时文件系统时将它们挂载到此的地方。


    ### /opt – 可选软件包


    在这里你会找到可选软件软件包的子目录。它通常用于不遵循标准 FSH 规则的软件。


    ### /proc – 内核与进程文件


    这类似于 `/dev` 目录，因为它不包含任何标准文件；相反，它包含代表进程和系统信息的特殊文件。


    ### /root – root 家目录


    这是 root 用户的家目录。注意，它位于 `/root` 而不是 `/home/root`，这与系统的根目录 `/` 区分开来。


    ### /run – 状态文件


    这是一个非常新的目录，它为应用程序提供了一个存储临时文件的地方，如进程 ID 和套接字。这些没有存储在 `/tmp` 中，因为可能会从那里被删除。


    ### /sbin – 系统管理二进制文件


    与 `/bin` 类似，包含了 `root` 用户用于系统管理二进制二进制文件。


    ### /selinux – SELinux 虚拟文件系统


    你会看到你特定的 Linux 发行版使用了 SELinux 作为安全。该目录将包含 SELinux 需要的文件。如果你在使用 Ubuntu 并看到此目录，那么这是一个错误，因为
    Ubuntu 不使用 SELinux。


    ### /srv – 服务数据


    在这里你会找到“为服务提供的数据”。例如，如果你为网站使用 Apache HTTP 服务器，该网站的文件将存储在此处。


    ### /tmp – 临时文件


    这里存储临时应用程序文件，并且在系统重启时会被删除。


    ### /var – 可变数据文件


    当 `/usr` 是只读的时，`/var` 是可写的。在这里你会找到日志文件以及其他通常写入到 `/usr` 的内容。


    ## 快速测验 2


    问题与答案


    1. 哪个目录包含程序运行所需的大量文件。该目录用于控制操作系统。

    *   `/bin`

    *   `/tmp`

    *   `/proc`

    *   `/lib`


    2. 哪个目录用于启动启动所需的内核信息？

    *   `/dev`

    *   `/proc`

    *   `/etc`

    *   `/boot`


    3. `/` 目录代表什么？

    *   根目录

    *   空目录


