    `>>` 将标准输出追加到文件，所以，如果我们想向 `list1` 添加更多项，我们会输入：


    ```bash

    % cat >> list1

    ```


    然后输入更多水果的名字：


    ```

    grape

    peach

    orange

    ```


    然后按 `CTRL+d` 停止。要读取文件内容，输入：


    ```bash

    % cat list1

    ```


    到为止，你应该有两个文件，一个包含六种水果，一个包含四种水果。现在我们将使用 `cat` 命令将两个列表合并成一个名为 `biglist` 的文件。输入：


    ```bash

    % cat list1 list2 > biglist

    ```


    这将相继读取两个列表的内容，然后将每个列表的文本输出到一个名为 `biglist` 的新文件中。

