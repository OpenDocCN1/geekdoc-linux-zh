  trans: "\n\n有很多在线手册提供了有关命令的信息。这些页面将告诉你是某个命令可以做什么、它可以接受哪些选项，以及这些每个选项将如何修改命令。如果你想阅读特定命令的页面，可以输入\
    \ `man`。例如，如果你想了解更多关于 `wc` 命令的信息，可以输入：\n\n```\n% man wc\n```\n\n或者你可以输入\n\n```bash\n\
    % whatis wc\n```\n\n这个命令会提供该命令的简短描述，但不会提供任何关于选项或其他任何其他信息。\n\n### Apropos\n\n当你不确定命令的确切名称时，可以输入：\n\
    \n```\n% apropos keyword\n```\n\n这将为你提供帮助手册中页眉中包含 `keyword` 单词的所有命令。尝试输入：\n\n\
    ```\n% apropos copy\n```\n\n### 章节总结\n\n| 命令 | 含义 |\n| :--- | :--- |\n| `*` |\
    \ 匹配任意数量的字符 |\n| `?` | 仅匹配单个字符 |\n| `man command` | 读取特定命令的在线手册页面 |\n| `whatis\
    \ command` | 给出指定命令的简短描述 |\n| `apropos keyword` | 匹配 man 页面中带有关键词的命令 |\n\n###\
    \ 快速测试 4\n\n1. 使用什么命令加上目录名称可以访问该特定目录？\n- `Cp`\n- `Cd`\n- `Access`\n- `Acs`\n-\
    \ `Cdr`\n\n2. 使用什么命令来清除命令提示符窗口？\n- `Clr`\n- `Clrwin`\n- `Cd`\n- `Clear`\n- `Clearit`\n\
    \n3. 如何显示当前目录内部的文件和目录列表？\n- `List`\n- `Listfiles`\n- `Ls`\n- `Lst`\n- `Listout`\n\
    \n4. 哪个命令显示你当前所在的目录？\n- `Pwd`\n- `Dir`\n- `Directory`\n- `Showdir`\n- `Dirpwd`\n\
    \n# 第 5 章：自学 Fish\n\n本章中使用的代码由 [`fishshell.com`](https://fishshell.com) 提供。\n\n\
    Fish 是一个命令行 shell，类似于 Bash，但它非常用户友好。它支持各种非常强大的功能，例如语法高亮、制 补全和自动建议，无需任何配置，学习成本极低。如果你正在寻找一个更高效、更有趣且绝对更有用的命令行，fish\
    \ 可能是你的首选。\n\n### 学习 Fish\n\n我假设你现在已经对 shell 和 Linux 命令有了基本的了解。下载 fish shell 并让我们开始吧。当你打开\
    \ fish 时，你应该会看到一条消息：\n\n```\nWelcome to fish, the friendly interactive shell\n\
    Type help for instructions on how to use fish\nyou@hostname ~>\n```\n\nFish 内部包含一个默认提示符，会显示你的详细信息——用户名、主机名和当前工作目录。稍后我会教你如何更改提示符，但现在我们假设它是\
    \ `>`。\n\n### 在 Fish 中运行命令\n\n在 fish 中运行命令与任何其他 shell 都是相同的；你输入命令以及随它的任何参数，使用空格作为分隔符。输入：\n\
    \n```bash\n> echo hello world\n```\n\n输出将是\n\n```\nhello world\n```\n\n要在参数中添加字面量空格，请使用反斜杠或使用单引号、双引号：\n\
    \n```bash\n> mkdir My\\ Files\n> cp ~/Some\\ File 'My Files'\n> ls \"My Files\"\
    \n```\n\n### 帮助\n\nFish 了一些非常好的 man 页面和帮助页面。只需运行 `help`，它就会在浏览器中打开；或者如果你运行 `man`，帮助文件将在\
    \ man 页面中打开。你也可以找到特定命令的帮助。例如，如果你想通过 `man set` 在终端查看帮助：\n\n```bash\n> man set\n\
    set - handle shell variables\nSynopsis...\n```\n\n### 语法高亮\n\n你可能已经注意到 fish 在你输入时会高亮语法。如果你看到红色的高亮，说明它是一个无效的命令：\n\
    \n```bash\n> /bin/mkd\n```\n\n这可能是因为该命令不存在，或者是因为它引用了一个无法执行的文件。当命令有效时，它会改变颜色：\n\
    \n```bash\n> /bin/mkdir\n```\n\n有效的文件路径在输入时会带有下划线\n\n```bash\n> cat ~/somefi\n\
    ```\n\n这将告诉你有一个有一个名称以 `somefi` 开头的文件，这在你输入时非常有用。\n\n### 通配符\n\nfish 支持通配符 `*`。如果你想查看所有的\
    \ JPEG 文件列表，可以输入：\n\n```bash\n> ls *.jpg\n```\n\n```\nleno.jpg\nmoona.jpg\nsanta\
    \ margarita.jpg\n```\n\n你可以使用多个通配符：\n\n```bash\n> ls l*.p*\n```\n\n```\nleno.png\n\
    lesson.pdf\n```\n\n递归通配符是最强大的功能之一，因为它会递归搜索目录：\n\n```bash\n> ls /var/**.log\n```\n\
    \n```\n/var/log/system.log\n/var/run/sntp.log\n```\n\n如果你发现遍历目录花费时间过长，只需使用 CTRL+C\
    \ 退出即可\n\n### 管道和重定向\n\nFish 支持使用竖线 (`|`) 作为管道命令，你可以用它在命令之间进行管道：\n\n```bash\n\
    > echo hello world | wc\n      1         2\n```\n\n我们可以使用 `<` 和 `>` 重定向标准输出和标准输入。与其他\
    \ shell 不同，我们使用脱号 (`^`) 来重定向标准错误：\n\n```bash\n> grep fish < /etc/shells > ~/output.txt\
    \ ^errors.txt\n```\n\n### 自动建议\n\n当你输入时，fish 会自动建议命令，建议显示在光标右侧并以灰色高亮。例如：\n\n```bash\n\
    > /bin/hostname\n```\n\nfish 还能识别选项和路径：\n\n```bash\n> grep --ignore\n```\n\n它还识别历史记录。输入一个命令，完整路径就会出现：\n\
    \n变量...\n\n### Tab 补全\n\nfish 有许多无需任何配置即可工作的 Tab 补全。只需输入命令、路径或参数并按 Tab 键即可完成：\n\
    \n```\n> /pri/\n```\n\n如果有两个或多个建议，它们将列出来：\n\n```bash\n> ~/stuff/s\n```\n\n```\n\
    ~/stuff/script.sh (Executable, 4.8kB)\n~/stuff/sources/ (Directory)\n```\n\n按\
    \ Tab 键遍历每个建议，直到找到你想要的。\n\n### 变量\n\n与其他 shell 一样，美元符号用于进行变量替换：\n\n...但是没有专门用于设置变量的语法。相反，fish\
    \ 使用一个名为 `set` 的普通命令——它将接收变量名以及变量的值：\n\n```\n> set name 'Master Noodle'\n> echo\
    \ $name\n```\n\n### 退出状态\n\nFish 将上一个命令的退出状态存储在 `$status` 中，而不是像其他 shell 那样存储在\
    \ `$` 中：\n\n```bash\n> false\n> echo $status\n1\n```\n\n### 导出\n\nFish 也没有其他 shell\
    \ 提供的 `export` 命令。相反，使用 `set` 命令配合 `-x` 或 `--export` 来导出变量：\n\n```bash\n> set\
    \ -x MyVariable SomeValue\n> env | grep MyVariable\n```\n\n"
