    \nTo insert the contents from another file into the one you are working on, type\
    \ in CTRL+R and to cancel both commands, simply press CTRL+C. If you have any\
    \ trouble using the CTRL key just press ESC twice. And, if you see commands that\
    \ require you to use the Meta key, this is the Alt key on your keyboard.\n\nTo\
    \ exit nano, press CTRL+X\n\nNavigating Nano\n\nTo navigate a text file you can\
    \ use the arrow keys, home, page up, page down and end keys if you want but there\
    \ is also another way:\n\n*   CTRL+F – move the cursor forward\n\n*   CTRL+B –\
    \ move the cursor backward\n\n*   CTRL+P – move the cursor up one line\n\n*  \
