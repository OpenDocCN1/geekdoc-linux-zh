- fmt: "\nThere are plenty of online manuals providing information about commands.\
    \ The pages will tell you what a command can do, the options that it can take\
    \ and how each of those options will modify the command. If you wanted to read\
    \ the page for a specific command, you would type in `man`. For example, if you\
    \ wanted to know more about the `wc` command, you would type in\n\n```\n% man\
    \ wc\n```\n\nOr you could type\n\n```bash\n% whatis wc\n```\n\nThis one would\
    \ provide a short description of the command but wouldn’t give you any other information\
    \ about options, or anything else.\n\n### Apropos\n\nWhen you do not know the\
    \ name of the command exactly, you would type in\n\n```\n% apropos keyword\n```\n\
    \nThis will provide you all the commands with the word `keyword` in the page header\
    \ in the help manual. Try typing:\n\n```\n% apropos copy\n```\n\n### Section Summary\n\
    \n| Command | Meaning |\n| :--- | :--- |\n| `*` | matches any amount of characters\
    \ |\n| `?` | matches just one character |\n| `man command` | will read the page\
    \ in the online manual for a specific command |\n| `whatis command` | gives a\
    \ short description of a specified command |\n| `apropos keyword` | will match\
    \ a command with a keyword in the man page |\n\n### Quick Quiz 4\n\n1. What command,\
    \ followed by the directory name is used to access that specific directory?\n\
    - `Cp`\n- `Cd`\n- `Access`\n- `Acs`\n- `Cdr`\n\n2. What command is used to clear\
    \ up the command prompt window?\n- `Clr`\n- `Clrwin`\n- `Cd`\n- `Clear`\n- `Clearit`\n\
    \n3. How would you show a list of files and directories that are inside the current\
    \ directory?\n- `List`\n- `Listfiles`\n- `Ls`\n- `Lst`\n- `Listout`\n\n4. What\
    \ command shows the directory you are in?\n- `Pwd`\n- `Dir`\n- `Directory`\n-\
    \ `Showdir`\n- `Dirpwd`\n\n# Chapter 5: Teach Yourself Fish\n\nThe code used in\
    \ this chapter is courtesy of [https://fishshell.com](https://fishshell.com)\n\
    \nFish is a command line shell, similar to Bash, that is incredibly user-friendly.\
    \ It supports all sorts of very powerful features, such as syntax highlighting,\
    \ tab completions, and autosuggestions, with no configuration needed and very\
    \ little to learn. If you are looking for a command line that is more productive,\
    \ a good deal more fun and definitely more useful, fish could be just the thing\
    \ for you.\n\n### Learning Fish\n\nI am going to assume that, by now, you have\
    \ a basic understanding of shells and Linux commands. Download fish shell and\
    \ let’s get started. When you open fish, you should see a message the says:\n\n\
    ```\nWelcome to fish, the friendly interactive shell\nType help for instructions\
    \ on how to use fish\nyou@hostname ~>\n```\n\nFish already has a default prompt\
    \ in it that will show your details – username, hostname and the current working\
    \ directory. Later on, I will show you how to change the prompt but, for now,\
    \ we will assume it is `>`.\n\n### Running Commands in Fish\n\nRunning commands\
    \ in fish is the same as in any other shell; you type the command and any arguments\
    \ that go with it, using spaces as separators. Type in:\n\n```bash\n> echo hello\
    \ world\n```\n\nAnd the output will be\n\n```\nhello world\n```\n\nTo add a literal\
    \ space in an argument, use a backslash or use single quotes or double quotes:\n\
    \n```bash\n> mkdir My\\ Files\n> cp ~/Some\\ File 'My Files'\n> ls \"My Files\"\
    \n```\n\n### Help\n\nFish contains some very good man and help pages. Simply run\
    \ `help` and it will open in a web browser, or if you run `man`, the help file\
    \ will open in a man page. You can also find help on specific commands. For example,\
    \ if you want `man set` to see help in the terminal:\n\n```bash\n> man set\nset\
    \ - handle shell variables\nSynopsis...\n```\n\n### Syntax Highlighting\n\nYou\
    \ may already have noticed that fish highlights the syntax as you are typing it.\
    \ If you see something highlighted in red, it is an invalid command:\n\n```bash\n\
    > /bin/mkd\n```\n\nThis may be because the command doesn't exist or because it\
    \ is referencing a file that cannot be executed. When the command is valid, it\
    \ will change color:\n\n```bash\n> /bin/mkdir\n```\n\nValid file paths are underlined\
    \ as they are typed\n\n```bash\n> cat ~/somefi\n```\n\nThis will tell you that\
    \ there is a file with the name beginning `somefi`, which is useful to you as\
    \ you are typing.\n\n### Wildcards\n\nThe wildcard `*` is supported in fish. If\
    \ you wanted to see a list of all the JPEG files, you would type\n\n```bash\n\
    > ls *.jpg\n```\n\n```\nleno.jpg\nmoona.jpg\nsanta margarita.jpg\n```\n\nYou can\
    \ use several wildcards:\n\n```bash\n> ls l*.p*\n```\n\n```\nleno.png\nlesson.pdf\n\
    ```\n\nThe recursive wildcard is one of the most powerful as it will recursively\
    \ search directories:\n\n```bash\n> ls /var/**.log\n```\n\n```\n/var/log/system.log\n\
    /var/run/sntp.log\n```\n\nIf you find it is taking too long to traverse the directory,\
    \ simply use CTRL+C to get out of it\n\n### Pipes and Redirections\n\nFish supports\
    \ the use of the vertical bar (`|`) as the pipe command and you can use it for\
    \ piping between commands:\n\n```bash\n> echo hello world | wc\n      1      \
    \   2       12\n```\n\nWe can redirect stdout and stdin using the `<` and the\
    \ `>`. Unlike the other shells, we use the caret (`^`) to redirect stderr:\n\n\
    ```bash\n> grep fish < /etc/shells > ~/output.txt ^ ~/errors.txt\n```\n\n### Autosuggestions\n\
    \nAs you type, fish will automatically suggest commands and this suggestion will\
    \ be shown to the right of your cursor, highlighted in gray. For example:\n\n\
    ```bash\n> /bin/hostname\n```\n\nFish also knows about options and paths:\n\n\
    ```bash\n> grep --ignore\n```\n\nAnd it knows about history. Type in a command\
    \ and the full path will appear:\n\n### Variables...\n\n### Tab Completions\n\n\
    There are a lot of tab completions in fish that work without any configuration\
    \ whatsoever. Simply start typing a command, path or argument and press the tab\
    \ key to complete it:\n\n```bash\n> /pri/\n```\n\nIf there are two or more suggestions,\
    \ they will be listed:\n\n```bash\n> ~/stuff/s\n```\n\n```\n~/stuff/script.sh\
    \ (Executable, 4.8kB)\n~/stuff/sources/ (Directory)\n```\n\nPress the tab key\
    \ to go through each suggestion until you get to the one you want.\n\n### Variables\n\
    \nAs with other shells, the dollar sign is used to perform variable substitution:\n\
    \n```bash\n> echo My home directory is $HOME\n```\n\n...However, there is no syntax\
    \ dedicated to setting a variable. Instead fish uses an ordinary command called\
    \ `set` – this will take the variable name and then the value of the variable:\n\
    \n```bash\n> set name 'Master Noodle'\n> echo $name\n```\n\n### Exit Status\n\n\
    Fish will store the exit status of the previous command in `$status`, rather than\
    \ in `$` as it does in other shells:\n\n```bash\n> false\n> echo $status\n1\n\
    ```\n\n### Exports\n\nFish also doesn't have the `export` command that other shells\
    \ have. Instead, variables are exported using the options `set`, followed by either\
    \ `-x` or `--export`:\n\n```bash\n> set -x MyVariable SomeValue\n> env | grep\
    \ MyVariable\n```\n"
