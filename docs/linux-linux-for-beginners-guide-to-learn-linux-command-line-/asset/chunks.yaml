    \ shell of the user. This may not be the shell that is currently in use but the\
    \ variable is set by Bash on startup\n\n*   TERM\n\nThis contains the type of\
    \ terminal running, for example, xterm-256color. This tends to be used by programs\
    \ that run in the terminal and need capabilities that are terminal-specific.\n\
    \n*   PAGER\n\nThis has the command that runs the program that is used to list\
    \ file contents, i.e. /bin/less\n\n*   EDITOR\n\nThis has the command used for\
    \ running the light program for file editing, i.e. /usr/bin/nano. For example,\
    \ you could write a switch that is interactive between nano or gedit under X:\n\
    \nexport EDITOR=\"$(if [[ -n $DISPLAY ]]; then echo 'gedit'; else echo 'nano';\
    \ fi)\"\n\n*   VISUAL\n\nThis is where you will find the command that runs the\
    \ full editor used for tasks that are somewhat more demanding, like mail editing\n\
    \n*   MAIL\n\nThis is where you will find the location of incoming mail and the\
    \ setting traditionally used is /var/spool/mail/$LOGNAME\n\n*   BROWSER\n\nThis\
    \ is where you find the path that leads to the web browser. It is very useful\
    \ for when you want an interactive configuration file set for the shell as it\
    \ can be altered dynamically, dependent on how available a graphic environment\
    \ is:\n\nif [ -n \"$DISPLAY\" ]; then\n\n    export BROWSER=firefox\n\nelse\n\n\
        export BROWSER=links\n\nfi\n\n*   ftp_proxy and http_proxy \n\nThese contain\
    \ the HTTP and the FTP servers:\n\nftp_proxy=\"ftp://192.168.0.1:21\"\n\nhttp_proxy=\"\
    http://192.168.0.1:80\"\n\n*   MANPATH\n\nThis is where you find a list of directories,\
    \ each separated by a colon and this is where man will search for man pages.\n\
    \nNOTE – in etc/profile, you will find a comment that says “Man is much better\
    \ than us at figuring this out” so leave this variable as a default, for example,\
    \ /usr/share/man:usr/local/share/man\n\n*   INFODIR\n\nThis has a list of directories,\
    \ separated by colons, and this is where the info command will look for info pages,\
    \ for example, /usr/share/info:usr/local/share/info\n\n*   TZ\n\nThis is used\
    \ for setting time zones that are different to the one used in the system. If\
    \ you look in usr/share/zoneinfo, you can see zones that can be used as references\n\
    \nUsing pam_env\n\nThe PAM module is used for loading variables that need to be\
    \ set into the environment and these come from the following files:\n\n*   /etc/security/pam_env.conf\n\
    \n*   /etc/environment\n\n*   ~/.pam_environment.\n\n/etc/environment must be\
    \ made up of VARIABLE=VALUE pairs, each on a separate line\n\n/etc/security/pam_env.conf and ~/.pam_environment both\
    \ have exactly the same format:\n\nVARIABLE [DEFAULT=[value]] [OVERRIDE=[value]]\n\
    \nIt is this format that allows for the expansion of variables that are already\
    \ defined within other variable values, using ${VARIABLE}. @{SHELL} and @{HOME}\
    \ are both special variables that will expand as per the definition in etc/passwd.\n\
    \nThe following is an example of the configuration of a basic user directory:\n\
    \n~/.pam_environment\n\n# Setting the variables that reuse your $HOME\n\nXDG_CACHE_HOME  \
    \ DEFAULT=@{HOME}/.cache\n\nXDG_CONFIG_HOME  DEFAULT=@{HOME}/.config\n\nXDG_DATA_HOME   \
    \ DEFAULT=@{HOME}/.local/share\n\n# You may reuse XDG_RUNTIME_DIR for runtime\
    \ files\n\nICEAUTHORITY     DEFAULT=${XDG_RUNTIME_DIR}/ICEauthority\n\n# You may\
    \ reuse variables you have already defined\n\nGNUPGHOME        DEFAULT=${XDG_CONFIG_HOME}/gnupg\n\
    \n# You may define variables as VARIABLE=VALUE pair\n\nEDITOR=nano\n\n# Same as\
    \ above\n\nEDITOR           DEFAULT=nano\n\n#Incorrect: you may not reuse other\
    \ variables in VARIABLE=VALUE pair\n\n#GNUPGHOME=${XDG_CONFIG_HOME}/gnupg\n\n\
    #Incorrect: missing {}\n\n#GNUPGHOME        DEFAULT=$XDG_CONFIG_HOME/gnupg\n\n\
    Note: This file will be read first, before anything else, even ~/.{,bash_,z}profile and ~/.zshenv.\n\
    \nQuick Quiz\n\n1.  What does \"../..\" stand for ?\n\n*   Current directory\n\
    \n*   Up one directory\n\n*   Up two directories\n\n*   None of Above\n\n2.  What\
    \ does cd/ mean in Linux?\n\n*   Current directory\n\n*   Root directory\n\n*\
    \   Up one directory\n\n*   None of the above\n\n3.  Which variable gives the\
    \ exit status of the last command executed in the shell?\n\n*   $*\n\n*   $!\n\
    \n*   $?\n\n*   $@\n\n4.  How will you assign the value of variable var2 to var1?\n\
    \n*   Var1=var2\n\n*   $var1=$var2\n\n*   Var1=$var2\n\n*   $var1=var2\n\n# \n\
    \nConclusion\n\nThank you again for purchasing this book! \n\nI hope this book\
    \ was able to help you to understand Linux and what it is all about, as well as\
    \ how to use it.\n\nThe next step is to practice. There is plenty of information\
    \ on the internet, plenty of Linux forums and lots of courses you can take, some\
    \ paid, some free, all of which will take you deeper into Linux and teach you\
    \ more about how it works and what you can do with it."
