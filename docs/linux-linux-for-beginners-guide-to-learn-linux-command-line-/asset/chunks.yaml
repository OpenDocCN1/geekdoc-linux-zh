    最后，如果你喜欢这本书，我想请你帮个忙，你可以在 Amazon 上给这本书留个评价吗？我将不胜感激！


    感谢你并祝你好运！


    # 答案


    ## 快速测验 1

    1. `VirtualBox` 是一款可以为你提供虚拟机的软件，允许你在计算机上运行其他操作系统，而不会影响你的主系统。

    2. `CentOS` 是 Linux 的一种发行版之一。

    3. `ssh` 代表 Secure Shell（安全壳）。

    4. 若要访问 `BIOS` 设置，在电脑启动时根据你的系统按下 `F1`、`F2`、`F12` 或 `ESC`。


