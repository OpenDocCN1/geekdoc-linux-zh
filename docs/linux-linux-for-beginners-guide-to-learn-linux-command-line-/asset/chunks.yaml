    # Introduction


    I want to thank you and congratulate you for purchasing the book, “Linux: Linux
    For Beginners Guide to Learn Linux Command Line, Linux Operating System, And Linux
    Commands.”


    This book contains proven steps and strategies on learning what Linux is and how
    to use it. Linux is, without a doubt, the best and most often used operating system
    that is open-source. It sits beneath all the other software that is on your computer,
    getting requests from applications and programs and relaying them on to the hardware.


    Linux was created by Linus Torvalds in 1991. At the time, he was studying at the
    University of Helsinki and he created Linux as an open-source and free alternative
    to `Minix`, a Unix clone used in academia. Originally, he was going to call it
    `Freax` but the administrator of the server that Torvalds was using to distribute
    his code names the directory `Linux`, a mix up of `Linus` and `Unix` and that
    name has stuck ever since.


    Most people use Linux, whether they are aware of the fact or not. How? Because
    many of the web pages you find on the internet today are run from Linux servers.
    These servers are secure which is why many companies opt to use Linux and there
    is also an excellent support system in the form of a large user and contributor
    community. If you own an Android device, a personal video recorder, a camera,
    a digital storage device, even a car, you are using Linux.


    Unlike Mac OS and Windows, Linux comes in many different formats, known as distributions
    or distros. These are collections of software made into an operating system that
    is based on the original Linux kernel – the fact that Linux is open-source means
    that anyone can take the source code and remold it for their own use.


    Throughout this book, I will be providing you with plenty of hands-on examples
    and a few exercises for you to try your hand at. These will help compound what
    you learn. Also at the end of each of the chapters, I have included a quick quiz
    – you will find the answers at the end of the book.


    Thanks again for purchasing this book, I hope you enjoy it!


    # Chapter 1: Installing Virtual Machines


    `VirtualBox` is a virtual machine that, first developed by Sun MicroSystems, is
    now under the ownership of Oracle. It simulates a separate computer and each virtual
    machine can have its own applications, operating system, and a whole of other
    things. `VirtualBox` is ideal for testing out operating systems, in this case,
    Linux on a Windows or Mac. By using this way, you don’t need to make any permanent
    changes to your current system. We’re going to look at how to install `VirtualBox`
    on Windows and Mac.


    ### Windows


    - Go to the VirtualBox page and find the latest version; click on it.

    - On the next page, look for the file that ends `.exe` and download it – remember
    the location you saved it to.

    - Once the installer has been downloaded, double-click the `.exe` file and follow
    the instructions on the screen to install it onto Windows – be aware that you
    may lose your network connection for a while during the installation because virtual
    network adaptors are being installed.

    - Now you must reboot your computer and you should find `VirtualBox` in your apps.
    From here, you can run it and install any other operating system that you want
    to try.


    ### Mac OS


    - Go the VirtualBox download page and download the latest version of the app for
    the Mac.

    - Save the `.dmg` to a file location that you will remember – make sure you download
    the OS X hosts version.

    - Locate the file and install it using the executable file.

    - Reboot your computer and you can start using `VirtualBox`.


    # Installing Linux Using an Image for VirtualBox


    After you have followed the above steps to install `VirtualBox` to your computer,
    you need to download the disk image for Ubuntu Linux.


    ### Windows


    - First, if you haven''t already got a BitTorrent client installed on your computer,
    download one now – BitTorrent is a P2P application that allows downloads from
    other users, significantly easing the loading in the Ubuntu servers.

    - Now head to the Ubuntu release website and download the latest release version
    – do NOT click on any links for Desktop CD. You will find a full list of links
    at the bottom of the page and make sure you click one with the `.iso.torrent`
    extension – download it to a location you will remember.

    - Now copy that to a bootable USB.


    A note of caution here – if you have got `WinRAR` installed, it will automatically
    associate itself with the file you downloaded and will ask you if you want to
    use `WinRAR` to extract the contents – do NOT use `WinRAR` and do NOT extract
    the `.iso`.


    **IMPORTANT** – Before you start the next step back up the contents of your hard
    drive somewhere safe! If you don’t you will lose everything!


    - Open `VirtualBox` from your Start menu and click `New` – this will open the
    New Virtual Machine Wizard.

    - Click on `Next` and give your virtual machine a name – stick with Ubuntu or
    Linux for ease.

