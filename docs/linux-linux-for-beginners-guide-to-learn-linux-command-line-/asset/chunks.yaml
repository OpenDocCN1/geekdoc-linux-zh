    * 你将看到一个屏幕，除了底部的几个 Logo 外，是空白的

    * 按任意键将出现一个新屏幕——选择你想要的语言

    * 现在点击 `Install Ubuntu`（安装 Ubuntu）

    * 安装程序将启动，你可能会被要求再次选择语言

    * 勾选安装闭源软件的选项

    * 如果你还没有连接，现在会要求你连接到 `Wi-Fi`——你现在不需要这样做，这会让你的安装时间变长，所以请忽略它

    * 这里有三个选项——选择第一个，然后拖动块选择 `Windows` 和 `Ubuntu` 的硬盘大小。你的硬盘现在将进行分区

    * 按照屏幕上出现的问题回答问题——这些都是一言自明的的

    * 现在你只需等待 `Ubuntu` 安装——取决于你电脑的速度，这可能需要花费一小时

    * 重启电脑并移除你的 `USB` 盘——当你再次启动时，你将处于一个运行中的 `Ubuntu` 环境


