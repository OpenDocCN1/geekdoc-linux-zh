    在 Linux 上，通常有两个用户可以更改文件或目录权限——所有者（owner）和 root 或超级用户（superuser）。root 用户可以像系统管理员一样执行系统中的所有操作。普通用户只能访问其家目录（home
    directories）中的目录和文件，可能为了协作和共享目的访问其他一两个目录——这就是 Linux 系统保持稳定和安全的方式。


    ## 基础安全


    你在 Linux 系统上的空间是家目录，确保它保持这种状态取决于你。有些用户会给自己赋予读、写、执行的完全权限，但不会给其他人或其他组提供任何权限。然而，每个人都有自己的设置。


    为了获得最好的安全性，你不应该赋予组或其他人对你自己的家目录的任何写入权限，但你可以在不添加读取权限的情况下赋予执行权限。如果你这样做，其他用户可以访问你的家目录，但他们看不到里面有什么，这的一个典型例子就是个人网页。有些系统运行
    Web 服务器，并为每个用户提供他们自己的 Web 空间；最常见的设置是在家目录下创建一个目录并命名为 `public_html`，允许服务器读取它并显示其中的内容。然而，由于
    Web 服务器与你不是同一个用户，它无法进入也无法读取文件。在这种情况下，必须在家目录上授予执行权限，允许 Web 服务器用户获取它所需的资源。


    ## 练习


    查看你家目录上拥有的权限，然后探索内部的文件并查看它们的权限是什么。


    接下来，使用长格式和简写方法，以及绝对路径和相对路径来更改某些权限，以便你熟悉它们。作为一个开始，从一个文件中删除读取权限，然后尝试读取它看看会发生什么。


    接下来，创建一个新目录并向其中添加一些文件。现在尝试移除你对该目录的权限，看看可以做什么以及哪些不能做。


    最后，只需探索系统并查看系统目录中的权限。


    ## 快速测验


    1. 应用到文件系统的目录时，哪种权限将允许用户进入目录？

    * 读

    * 写

    * 执行

    * 访问控制


    2. 用户需要打开一个文件，编辑它，然后保存更改。他需要哪些权限来这样做？（选择两个。）

    * 读

    * 写

    * 执行

    * 修改


    3. 一个名为 `staff.odt` 的文件模式为 `rw-r- -r-`。如果 `rbob` 是该文件的所有者，他可以对它做什么？

    * 他可以打开文件并查看内容，但不能保存任何更改。

    * 他可以打开文件进行更改并保存文件。

    * 他可以更改文件的所有权。

    * 如果它是可执行文件，他可以运行它。


    4. 一个名为 `staff.odt` 的文件模式为 `rw-r- -r-`。如果 `mhuman` 不是该文件的所有者，但是拥有该文件的组的成员，他可以对它做什么？

    * 他可以打开文件并查看内容，但不能保存任何更改。

    * 他可以打开文件进行更改并保存文件。

    * 他可以更改文件的所有权。

    * 如果它是可执行文件，他可以运行它。


    # 第 7 章：掌握编辑器


    本章中的代码感谢 [`ryanstutorials.net/linuxtutorial/vi.php`](http://ryanstutorials.net/linuxtutorial/vi.php)。


    Linux 有许多文本编辑器可以选择，这很容易让人感到困惑。在本章中，我们将查看 `nano` 和 `vi`，这是 Linux 两个两个非常简单的编辑器。


    ## Nano


    `nano` 已经安装在许多 Linux 发行版中，并且与 `Sudo` 配合得很好。以下是如何使用它的概述。


    ### 运行 Nano


    运行 `nano` 有两种方法：

    * 在命令提示符输入 `nano`

    * 或者输入以下命令 - `nano 文件名` – 插入文件名，`nano` 将查找它；如果找到了，它将打开它；如果没有找到，你将得到一个以文件名命名的空缓冲区


    在屏幕顶部，你将看到关于你正在处理的文件的信息，如果没有，它将显示 `New Buffer`（新缓冲区）。之后是以文本形式显示的文档内容。然后是系统消息，提供有关正在执行函数的程序的信息，它可能会显示“new
    file”。最后，你会看到快捷键行。


    `nano` 是一个 WYSIWYG 编辑器，即“所见即所得”。除非你使用键修改文本，否则你输入的内容就会进入文本输入。现在向其中输入一些内容，这样我们就有可以可以了。


    ### 快捷键


    快捷键是程序功能，如退出、保存等，你将在屏幕底部看到常见的快捷键。在使用快捷键时不需要使用 `SHIFT`，它们都是小写且未修改的数字格式。如果你按下 `CTRL+G`，你将看到你可以使用的所有快捷键列表；看一眼，然后按下
    `CTRL+X` 退出。


    保存文件被称为“写入”（writing out），你通过按下 `CTRL+O` 来执行。接下来，系统会要求输入名称，快捷键将变为显示你可以输入什么来完成。


    保存文件后，你会被要求一个名称，快捷键将显示你可以输入什么。


    要将另一个文件的内容插入到你正在处理的文件，输入 `CTRL+R`。如果你遇到任何问题，只需按下 `Esc`。


    退出 nano，按下 `CTRL+X`。


    ### 导航


    要导航文件，可以使用方向键、首页和结束键，但还有其他方法：

    * `CTRL+F` –向前移动

    * `CTRL+B` – 向后移动

    * `CTRL+P` – 向上移动

    * `CTRL+N` – 向下移动

    * `CTRL+A` – 首页键

    * `CTRL+E` – 结束键

    * `CTRL+V` – 向下翻页

    * `CTRL+Y` – 向上翻页

    * `CTRL+SPACE` – 向前移动一个单词

    * `ALT+SPACE` – 向后移动一个单词

    * `CTRL+C` – 指示光标所在位置


    ### 复制、剪切和粘贴


    要复制文本，将光标移动到你想开始的地方并使用 `CTRL` 高亮它。

    * `ALT` – 复制高亮文本

    * `CTRL+K` – 切切高亮文本

    * `CTRL+U` – 在光标指定的位置粘贴文本


    要删除整行，使用 `CTRL+K` 但不要高亮文本。


    ## 使用 Vi


    `vi` 也是一个命令行编辑器，而且非常强大。它是一个纯文本编辑器，类似于 Windows 记事本，使用它时只需使用键盘，不需要鼠标。`vi` 有两种操作模式——插入模式（Insert）或编辑模式（Edit）。在插入模式下，你可以向当前文件插入内容；在编辑模式下，你在文件中导航，执行搜索、复制、删除、替换、保存等操作。运行
    `vi`，只需输入一个包含要编辑的文件名的命令行参数：


    如果你没有指定文件名，可以从内部打开它，但简单得多是直接关闭 `vi` 并重新开始。与其长篇大论地解释 `vi` 如何工作，我将通过一些输入指令来简化它。进入你之前创建的
    Linuxstuff 目录。


    在 `vi` 中输入


    ```

    vi firstfile

    ```


    如果你有一个名为 `firstfile` 的文件，它将被打开；如果没有，`vi` 将为你创建并打开它。你现在应该看到类似的内容：


    ```

    ~

    ~

    ~

    "firstfile" [New File]

    ```


    由于你现在处于编辑模式中，你现在需要进入插入模式，只需按下键盘上的 `i`：


    ```

    ~

    ~

    ~

    ~

    ~

    -- INSERT --

    ```


    输入几行文本，然后按下 `Esc` 键；这让你回到编辑模式。


    ### 保存和编辑


