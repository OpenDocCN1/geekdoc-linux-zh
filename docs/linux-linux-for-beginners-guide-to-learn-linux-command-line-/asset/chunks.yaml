- fmt: "\nYou can do this in a few ways but they all do the same so go with what works\
    \ for you. First, ensure you are still in `Edit` mode then use one of these:\n\
    \n*   `ZZ` (use capital letters) – save and exit\n*   `:q!` – exit, discarding\
    \ any changes made since the file was last saved\n*   `:w` – save but do not exit\n\
    *   `:wq` – save and exit\n\nMost `vi` commands will be expected as soon as the\
    \ key sequence is input. However, any command that starts with the colon `:` requires\
    \ that you press enter after inputting the command.\n\nSave the file that you\
    \ are working on now and exit out of it.\n\n# Viewing Files\n\n`vi` is, essentially,\
    \ a text editor but you can view files with it as well. However, there are two\
    \ more commands that you can use which are better. The first is `cat`, short for\
    \ concatenate and it is used for joining files together; in its basic form, you\
    \ can view files with it. Type in the following using the name of the file you\
    \ just created.\n\n```bash\ncat <filename>\n```\n\nyou should now see the contents\
    \ of that file on your screen followed by a prompt. This will only happen if you\
    \ run `cat` with a single argument. If you run it without any arguments, the cursor\
    \ will move on to the following line and nothing else will happen.\n\nThis command\
    \ is fine when you don’t have a large file but if you do, you won’t be able to\
    \ read the contents very easily so we use a different command; `less`\n\n```bash\n\
    less <filename>\n```\n\nThis lets you move around a file using the up and down\
    \ arrow keys or by using the spacebar to move on a page or pressing `b` to go\
    \ back. Pressing `q` will exit you out of the file.\n\n`less` allows you to move\
    \ up and down within a file using the arrow keys. You may go forward a whole page\
    \ using the `Spacebar` or back a page by pressing `b`. When you are done, you\
    \ can press `q` for quit. Tyr this on the file you created.\n\n# Navigating in\
    \ vi\n\nOpen the file again and go into insert mode. Enter a couple of paragraphs\
    \ and then press `Esc` so you go back into edit mode. To navigate around the file,\
    \ use the following commands. Do this now and see how they work:\n\n*   The arrow\
    \ keys – move the cursor\n*   `j` – move the cursor down\n*   `k` – move the cursor\
    \ up\n*   `h` – move the cursor right\n*   `l` – move the cursor left\n*   `$`\
    \ – move the cursor to the end of the line you are on\n*   `^` – move the cursor\
    \ to the start of the line you are on\n*   `nG` – move to the nth line, for example,\
    \ `6G` will take you to line 6\n*   `G` – move to the final line in the text\n\
    *   `w` – move to the start of the next word\n*   `nw` – move forwards an amount\
    \ of words, for example, `4w` will move forward 4 words\n*   `b` – go back to\
    \ the start of the last word\n*   `nb` – go back to the specified word\n*   `{-`\
    \ – go back a paragraph\n*   `}` – go forward a paragraph\n\n# Delete Content\n\
    \nThere are loads of ways to navigate `vi` and some of then, the `n` commands,\
    \ let you specify a number. Deleting works the same way and there are a few delete\
    \ commands that let us add in movement commands so that we can specify what is\
    \ to be deleted. Using the following commands you can delete:\n\n*   `x` – deletes\
    \ one character\n*   `nx` – deletes n characters\n*   `dd` – deletes the line\n\
    *   `dw` – deletes a word\n\n# Undo\n\nTo undo a change in `vi`, it is easy:\n\
    \n*   `u` (lower case) – undo action\n*   `U` (capital case) – undo all changes\n\
    \n# Exercises\n\n1.  Create a new file and add content\n2.  Save the file and\
    \ exit\n3.  Use `cat` to view content\n4.  Use `less` to navigate the file\n5.\
    \  Practice navigation with arrow keys and h-commands\n\n# Quick Quiz\n\n1.  How\
    \ do you list environment variables?\n2.  Which files are used for defining environment\
    \ variables?\n3.  How do you set an environment variable?\n4.  How do you save\
    \ environment variables in vi?\n5.  Which files are used for global environment\
    \ variables?\n\n# Chapter 8: Environment Variables\n\nEnvironment variables are\
    \ objects that have names and contain data. They are used by at least one process.\
    \ \n\n## Utilities\n\nThe package `coreutils` is home to `printenv`. In order\
    \ to list all environment variables, you simply type:\n\n```bash\nprintenv\n```\n\
    \nSome of these variables are user-specific. The utility `env` is used to run\
    \ commands with a modified environment. For example\n\nEach different process\
    \ will store its own environments in `/proc/$PID/environ`.\n\n# Defining a Variable\n\
    \n### Global Variables\n\nMost of the distributions advise you to change or add\
    \ variables in `/etc/profile`. However, you do need to bear in mind that some\
    \ configuration files are package specific. The following are the files that are\
    \ to be used:\n\n*   `/etc/environment` – the `pam_env` module uses this and this\
    \ is shell-agnostic. This means that you cannot use glob expansion or scripting.\
    \ This file will only take variable-value pairs.\n*   `/etc/profile` and any shell-specific\
    \ configuration file\n\nIn the next example, we are adding `~/bin` directory to\
    \ the `PATH` for the respective user. All you do is add this line to the configuration\
    \ file of the chosen environment variable (`/etc/profile` or `/etc/bash.bashrc`):\n\
    \n```bash\n# If the user ID is greater than or equal to 1000 & if ~/bin exists\
    \ and is a directory & if ~/bin is not in your $PATH\n# then export ~/bin to your\
    \ $PATH\nif [[ $UID -ge 1000 && -d $HOME/bin && -z $(echo $PATH | grep -o $HOME/bin)\
    \ ]]\nthen\n    export PATH=\"${PATH}:$HOME/bin\"\nfi\n```\n\n### Per user\n\n\
    Note - the user instance of `systemd` and `dbusdaemon` will not inherit the variables\
    \ that are in places such as `~/.bashrc` etc. As such, any program that is `dbus`\
    \ activates, like `Gnome Files`, will not use them unless told to.\n"
  raw: "You can do this in a few ways but they all do the same so go with what works\
    \ for you. First, ensure you are still in Edit mode then use one of these:\n\n\
    *   ZZ (use capital letters) – save and exit\n\n*   :q! – exit, discarding any\
    \ changes made since the file was last saved\n\n*   :w – save but do not exit\n\
    \n*   :wq – save and exit\n\nMost vi commands will be expected as soon as the\
    \ key sequence is input. However, any command that starts with the colon requires\
    \ that you press enter after inputting the command.\n\nSave the file that you\
    \ are working on now and exit out of it.\n\nViewing Files\n\nvi is, essentially,\
    \ a text editor but you can view files with it as well. However, there are two\
    \ more commands that you can use which are better. The first is cat, short for\
    \ concatenate and it is used for joining files together; in its basic form, you\
    \ can view files with it. Type in the following using the name of the file you\
    \ just created.\n\ncat<filename>\n\nyou should now see the contents of that file\
    \ on your screen followed by a prompt. This will only happen if you run cat with\
    \ a single argument. If you run it without any arguments, the cursor will move\
    \ on to the following line and nothing else will happen.\n\nThis command is fine\
    \ when you don’t have a large file but if you do, you won’t be able to read the\
    \ contents very easily so we use a different command; less\n\nless <filename>\n\
    \nThis lets you move around a file using the up and down arrow keys or by using\
    \ the spacebar to move on a page or pressing b to go back. Pressing q will exit\
    \ you out of the file.\n\nless allows you to move up and down within a file using\
    \ the arrow keys. You may go forward a whole page using the Spacebar or back a\
    \ page by pressing b. When you are done, you can press q for quit. Tyr this on\
    \ the file you created.\n\nNavigating in vi\n\nOpen the file again and go into\
    \ insert mode. Enter a couple of paragraphs and then press Esc so you go back\
    \ into edit mode. To navigate around the file, use the following commands. Do\
    \ this now and see how they work:\n\n*   The arrow keys – move the cursor\n\n\
    *   j – move the cursor down\n\n*   k – move the cursor up\n\n*   h – move the\
    \ cursor right\n\n*   l – move the cursor left\n\n*   $ - move the cursor to the\
    \ end of the line you are on\n\n*   ^ - move the cursor to the start of the line\
    \ you are on\n\n*   nG – move to the nth line, for example, 6G will take you to\
    \ line 6\n\n*   G – move to the final line in the text\n\n*   w – move to the\
    \ start of the next word\n\n*   nw – move forwards an amount of words, for example,\
    \ 4w will move forward 4 words\n\n*   b – go back to the start of the last word\n\
    \n*   nb – go back to the specified word\n\n*   {- - go back a paragraph\n\n*\
    \   }- go forward a paragraph\n\nDelete Content\n\nThere are loads of ways to\
    \ navigate vi and some of then, the n commands, let you specify a number. Deleting\
    \ works the same way and there are a few delete commands that let us add in movement\
    \ commands so that we can specify what is to be deleted. Using your open file,\
    \ play around with the following delete commands and see how they work:\n\n* \
    \  x – deletes one character\n\n*   nx – deletes the number of characters specified\n\
    \n*   dd – deletes the line you are on\n\n*   dn – delete to where the n command\
    \ would take you, i.e. d6w will delete 6 words\n\nUndo\n\nTo undo a change in\
    \ vi, including a deletion, is easy:\n\n*   u (lower case) – undoes the previous\
    \ action and you can keep pressing it to undo several actions\n\n*   U (capital)\
    \ – undoes all the changes to the line you are on\n\nExercises\n\n1.  Create a\
    \ new file and add some content to it\n\n2.  Save the file and then try to view\
    \ it using cat and less\n\n3.  Access the file in vi and add more content\n\n\
    4.  Use all the movement commands to navigate around your file\n\n5.  Play with\
    \ the delete commands, seeing how they all work\n\n6.  Undo one or more of the\
    \ changes you have made\n\nQuick Quiz\n\n1.  How do you run nano?\n\n2.  How do\
    \ you bring up a list of shortcuts in nano?\n\n3.  When navigating text in Nano,\
    \ how do you move forward one word at a time?\n\n4.  How do you go form Edit mode\
    \ to Insert mode in vi?\n\n5.  How do you save and exit a file in vi?\n\n6.  Which\
    \ two commands are used for viewing files in vi?\n\n# \n\nChapter 8: Environment\
    \ Variables\n\nThe code in this chapter is courtesy of [https://wiki.archlinux.org/index.php/environment_variables](https://wiki.archlinux.org/index.php/environment_variables)\n\
    \nEnvironment variables are objects that are given names and contain data that\
    \ is used by at least one, usually more applications. Put simply, an environment\
    \ variable is nothing more than a variable that has a name and a value. Environment\
    \ variable values could be the default editor that is to be used, the location\
    \ of all files that can be executed in the system or the locale settings for the\
    \ system, for example. Newbies to Linux might find this a bit cumbersome but the\
    \ environment variable is a very good way of sharing the configuration settings\
    \ between several processes and applications.\n\nUtilities\n\nThe package called\
    \ coreutils is home to the printenv and env programs. In order to list all the\
    \ current environment variables that have a value, you would simply type:\n\n\
    $ printenv\n\nSome of these variables are user-specific and you can check them\
    \ by comparing what is output from printenv as a root user and a normal user.\n\
    \nThe utility called env is used to run commands in an environment that has been\
    \ modified. The following code example runs xterm with EDITOR, the environment\
    \ variable, set to vim. This will have no effect on the global version of the\
    \ same environment variable:\n\n$ env EDITOR=vim xterm\n\nEach different process\
    \ will store their own environments in a file called /proc/$PID/environ. Contained\
    \ in this file will be key value pairs, delimited with null characters (\\x0).\n\
    \nDefining a Variable\n\nGlobal variables\n\nMost of the distributions of Linux\
    \ advise you to change or add the variable definitions in /etc/profile or in another\
    \ location. However, you do need to bear in mind that some configuration files\
    \ are package specific and these contain some of the variable settings, like /etc/locale.config.\
    \ These environment variables must be managed and maintained and you must pay\
    \ special attention to all the files that may contain an environment variable.\
    \ In principle, any of the shell scripts can initialize an environment variable\
    \ but, under the traditional conventions, those statements should be only in some\
    \ files. The following are the files that are to be used for defining a global\
    \ environment variable:\n\n*   /etc/environment, /etc/profile and any shell-specific\
    \ configuration file. These all have their own set limitations so only choose\
    \ the right one for the purpose it is needed for\n\n*   /etc/environment – the\
    \ pam_env module uses this and this is shell-agnostic. This means that you cannot\
    \ use glob expansion or scripting. This file will only take variable-value pairs.\n\
    \nIn the next example, we are adding ~/bin directory to the PATH for the respective\
    \ user. All you do is add this line to the configuration file of the chosen environment\
    \ variable (/etc/profile or /etc/bash.bashrc):\n\n# If the user ID is greater\
    \ than or equal to 1000 & if ~/bin exists and is a directory & if ~/bin is not\
    \ in your $PATH\n\n# then export ~/bin to your $PATH.\n\nif [[ $UID -ge 1000 &&\
    \ -d $HOME/bin && -z $(echo $PATH | grep -o $HOME/bin) ]]\n\nthen\n\n    export\
    \ PATH=\"${PATH}:$HOME/bin\"\n\nfi\n\nPer user\n\nNote - the user instance of\
    \ systemd and the dbusdaemon will not inherit the variables that are in places\
    \ such as ~/.bashrc etc. As such, any program that is dbus activates, like Gnome\
    \ Files, will not use them unless told to.\n\nIt isn’t always the right thing\
    \ to define environment variables globally. On occasion, for example, you may\
    \ want to add /home/my_user/bin to the variable called PATH but not for all the\
    \ users. This is where locally defined variables come in and these can be defined\
    \ in many files:\n\n*   ~/.pam_environment is the user equivalent of /etc/security/pam_env.conf,\
    \ used by pam_env module."
