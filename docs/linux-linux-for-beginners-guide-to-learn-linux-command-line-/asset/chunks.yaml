    # Chapter 3: All About the Shell


    Our computers are programmed so that they understand a specific language. That
    language is called binary and it is comprised of zeros and ones. When computing
    first began, instructions would be provided in this language and that caused difficulty
    because it isn''t a language that we can all read or write. To get around this,
    we have the shell and there is one in every operating system. The shell is what
    takes human commands and interprets them in a way that the kernel is able to read
    them and process them.


    ## What is the Shell?


    The shell is an environment or a user program for user interaction. Basically,
    it is an interpreter that translates the command language and executes the commands
    that are read from input devices like keyboards, or from a file. The shell is
    started when you open a terminal or when you log into your system. It is not a
    part of the Linux system kernel but it does make use of the kernel for creating
    files, executing programs, and lots of other activities. There are a number of
    shells that Linux users can make use of, including:


    * `BASH` - free, open-source and the most common one in Linux

    * `CSH` – with usage and syntax similar to C program language

    * `KSH` – base of the standard specifications for the POSIX shell


    Each shell does exactly the same but each will understand different syntax and
    will provide different functions.


    ## The Shell Prompt


    There are several ways to get shell access:


    * Terminal – Linux has a GUI login system and, once you have logged in you can
    run one of several commands in the terminal to get access to shell – `XTerm`,
    `Gterm` or `Kterm`

    * SSH – as soon as you log into a remote workstation or server, you will be given
    a shell prompt

    * Console – Some Linux systems have a login system that is text-based and this
    will give you a shell prompt when you are logged in


    To find out the name of your current shell or to find out which shells are available
    on your system, type in this command at the terminal prompt:


    ```bash

    cat /etc/shells

    ```


    If there is more than one shell listed, there is more than one that is supported
    by your particular platform.


    ## Command Line Interface (CLI)


    The shell gives you an interface with Linux where you can input commands with
    your keyboard and this is known as the CLI or command line interface. To find
    the type of the current shell in your system, input the following command:


    ```bash

    echo $SHELL

    ps $$

    ps -p $$

    ```


    ## Basic Command Line Editing


    There are several key combinations that you can use to edit commands and to recall
    them:


    * `CTRL + L`: Clear screen.

    * `CTRL + W`: Delete the word that starts at the cursor.

    * `CTRL + U`: Clear line of all words

    * `Up/Down arrow keys`: Recall commands

    * `Tab`: use to autocomplete the name of files, directories, commands, etc

    * `CTRL + R`: Search commands you have used previously

    * `CTRL + C`: Cancel any commands that are running

    * `CTRL + T`: swap around the two characters that immediately precede the cursor

    * `ESC + T`: Swap around the last two words that immediately precede the cursor

    * `CTRL + H`: Delete the letter that starts at the cursor.


    ## Executing A Command


    Simply type your command in and press the enter key. For example, if you wanted
    to know the date, simply type in `date` and hit enter.


    ## Command and File Completion


    `Bash` is able to automatically complete the names of commands and files when
    it can or when you tell it to. For example, type in `sle` and then press the `tab`
    key – the shell will complete the command automatically.


    ## Getting Help in Linux


    Most of the Linux commands have their own documentation with them and you can
    use the `info` or `man` command to view that documentation. For example, use the
    `date` command to open the manpage:


    ```bash

    man date

    ```


    You can also use the `ls` command to read information documentation:


    ```bash

    info ls

    ```


    Many of the commands will accept `-h` or `--help` as a command line option. For
    example, you can use the following to show the `date` command help options:


    ```bash

    date --help

    ```


    Basically, you can use any of the following to find out information about a Linux
    command:


    * `man commandName`

    * `info commandName`

    * `commandName -h`

    * `commandName --help`


    ## Super User


    Every Linux system has a `root` account, which is for the administrator. Many
    tasks require you to log on as administrator or execute commands using `root`
    privileges. If you do need to do this, be sure that you understand what commands
    you are running and the consequences each has. One careless command run under
    root privileges can have far-reaching effects, even going so far as to render
    your operating system useless and unusable.


    ### Logging in as root


    In many ways, the `root` account is the same as any user account in that you need
    a username and password to get into it. If you know the password for the `root`
    account you can use it to get into the `root` account via the command line. A
    special command that allows you to switch from normal to root user and the command
    is `su` – it stands for switch user or super user. Just type at the command line:


    ```bash

    su

    ```


    Input the password and, if it is correct, you will be switched over to root user.


    ### Running a Command as Root with No Password


    Sometimes it is better not to log in as root but still run commands as root and
    we do this by using another command, `sudo`. This means superuser do. If you put
    this in front of any command, you will be asked for your own password and then
    your details will be checked against a `sudoers` file. If you are in there, you
    can run commands with root privileges.


