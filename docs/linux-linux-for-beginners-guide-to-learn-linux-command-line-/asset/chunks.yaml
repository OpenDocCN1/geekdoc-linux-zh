    When your login, you will always be in your home directory. This will have the
    same name as you have for your username and it is where all your personal files
    and subdirectories will be saved. To find out the contents of your home directory,
    type in:


    ```

    % ls

    ```


    You may not see any files in the home directory; if there aren’t any, you will
    be returned to the prompt. Be aware that, using the `ls` command, you will only
    see the contents whose name does not start with a dot. The files that start with
    the dot are hidden files and will normally have some important configuration information
    in them. The reason they are hidden is because you should not be touching them.


    To see all the files, including those with the dot, in your home directory, type
    in


    ```bash

    % ls -a

    ```


    You will now see all files including those that are hidden. `ls` is one of those
    commands that is able to take options, and the above one, `-a`, is just one of
    those options. These will change how the command works,


    ## Making a Directory


    `mkdir`


    To make a subdirectory of the home directory, to hold the files you create (for
    the purposes of this, we will call it `linuxstuff`), type in this in your current
    directory:


    ```bash

    % mkdir linuxstuff

    ```


    To see that directory, type in


    ```bash

    % ls

    ```


    ## Changing to Another Directory


    `cd`


    `cd` means change directory from the current one to directory so, to change to
    the directory you just created, you would type in:


    ```bash

    % cd linuxstuff

    ```


    To see the content, of which there shouldn’t be any right now, type `ls`


    ## Exercise


    Go into the `linuxstuff` directory and then make another one called `backups`.


    ## . and .. Directories


    Staying in the `linuxstuff` directory, type this in


    ```bash

    % ls -a

    ```


    You will see, and this is in all directories, two directories that are called
    `.` and `..`.


    In Linux, a single dot (`.`) signifies the current directory so if you were to
    type in (making sure to leave a space between `cd` and the single dot)


    ```bash

    % cd .

    ```


    you would stay exactly where you are in the `linuxstuff` directory. While this
    might not seem to have much use at first look, you will soon find that by typing
    a dot as the current directory name will save you quite a bit of typing.


    `..` signifies the parent directory, which is the parent of the directory you
    are already in so if you were to type


    ```bash

    % cd ..

    ```


    you would go back one directory, in this case, to your home directory.


    Note – if you get lost in your file system, simply type `cd` at the prompt and
    you will be returned straight to your home directory.


    ## Pathnames


    `pwd`


    `pwd` stands for print working directory and using a pathname lets you work out
    exactly where you are in the file system. For example, if you wanted to know the
    absolute pathname that goes with your home directory, you would type in `cd`,
    so you go back to the home directory, and then type in


    ```bash

    % pwd

    ```


    You should see something like this as the pathname


    `/home/its/ug1/ee51vn`


    And this means that the home directory is in a subdirectory called `ug1`, which
    is a group directory and this is located in the subdirectory called `its`, which
    is located in the home subdirectory, in the top level of the root directory named
    `/`.


    ## Exercise


    Explore your file system with the commands `cd`, `pwd` and `ls`. Don’t forget,
    typing `cd` will take you back to the home directory.


    ## Understanding Pathnames


    Go back to your home directory if you aren’t already there and type in


    ```bash

    % ls linuxstuff

    ```


    This will list the contents of the home directory. Now type in


    ```bash

    % ls backups

    ```


    You will see a message that says something like this:


    `backups: No such file or directory`


    Why? You created a directory with that name earlier but you didn’t create it in
    the working directory. So, to get to backups directory, you either must use `cd`
    and specify the directory or you must use the pathname


    ```bash

    % ls linuxstuff/backups

    ```


    We can also use the tilde character (`~`) to refer to the home directory and to
    specify a path that starts at the home directory. So, if you typed in


    ```bash

    % ls ~/linuxstuff

    ```


    You would see a list of what is in the `linuxstuff` directory, irrelevant of where
    you currently are in the file system.


    ## Exercise


    Look at the following commands and work out what would be listed if you typed
    them:


    ```bash

    % ls ~

    % ls ~/..

    ```


    ## Section Summary


    | Command | Meaning |

    | :--- | :--- |

    | `ls` | lists the files and the directories |

    | `ls -a` | lists all directories and files including those hidden |

    | `mkdir` | makes a new directory |

    | `cd directory` | change to the directory named |

    | `cd` | change back to the home directory |

    | `cd ~` | change back to the home directory |

    | `cd ..` | change to the parent directory |

    | `pwd` | shows the pathname for the current directory |


    ## Copying Files


    `cp`


    If you wanted to copy `file1` in the working directory and name it `file2`, you
    would type in


    ```bash

    cp file1 file2

    ```


    First, go to [this website](http://www.ee.surrey.ac.uk/Teaching/Unix/science.txt)
    and copy the text into a file. Name it `science.txt` and save it to your `linuxstuff`
    directory.


    So, now we are going to copy a file that is to be found in an open access part
    of the file system to the `linuxstuff` directory. First, you would get back to
    your `linuxstuff` directory by typing


    ```bash

    % cd ~/linuxstuff

    ```


    Then you would type the following at the prompt


    ```bash

    % cp /vol/examples/tutorial/science.txt .

    ```


    Note – do not forget to add the dot at the end. The command is saying that we
    are going to copy the file called `science.txt` to `linuxstuff` but we will keep
    the name the same. The above command means copy the file `science.txt` to the
    current directory, keeping the name the same. For the purposes of the next example,
    you must create a file named `science.txt` in your `linuxstuff` directory.


    ## Moving Files


    `mv`


    `mv file1 file2` will move or rename `file1` to `file2`.


    When you use the `mv` command, you will move the file and not copy it, ensuring
    that you still have just one file and not two. We can also use it to give a file
    a new name and we do this by moving it to the same directory it is already in
    but with a different name.


    Go back to your `linuxstuff` directory and type in the following


    ```bash

    % mv science.bak backups/.

    ```


    Now type in `ls` and the `ls backups` and see what has happened.


    ## Removing a File or Directory


    `rm`


    `rmdir`


    To delete a file, or remove it, we use the `rm` command. Let’s make a copy of
    `science.txt` and then we will delete it.


    From your `linuxstuff` directory, type in


    ```bash

    % cp science.txt tempfile.txt

    % ls

    % rm tempfile.txt

    % ls

    ```


    If you want to remove an entire directory, first make sure there are no files
    in it and then use the `rmdir` command. Have a go at removing the directory called
    `Backups` – Linux won’t allow it because it something in it.


    ## Exercise


    Use `mkdir` to create a new directory named `tempstuff` and then use the `rmdir`
    command to remove it.


    ## Displaying File Contents on the Screen


    `clear`


    Before we move on, lets clear our terminal window of all the commands already
    in so that we can better understand what the output of the next commands are.
    To do this, type


    ```bash

    % clear

    ```


    All the text will be removed and you will be left with the prompt. So, let’s move
    on to the next command.


    `cat`


    `cat` is used to concatenate and display a file’s content on your screen. Type
    in


    ```bash

    % cat science.txt

    ```


    You will see that the file is bigger than the window size so it will scroll, making
    the contents hard to read.


    `less`


    This command will write the file contents to the screen one page at a time so
    type in


    ```bash

    % less science.txt

    ```


    Press on your space bar if you need to see the next page and, if you have read
    enough, type in `q`.


    Note – if you have long files, use the command `less` rather than the command
    `cat`.


    `head`


    This command will write the first ten lines of the specified file to your screen.
    Clear your screen and type in


    ```bash

    % head science.txt

    ```


    Now type


    ```bash

    % head -5 science.txt

    ```


    Look at what you go and decide what adding `-5` did to the command.


    `tail`


    As opposed to the `head` command, the `tail` command will write the last ten lines
    of the specified file to the screen. Clear your screen and type in


    ```bash

    % tail science.txt

    ```

