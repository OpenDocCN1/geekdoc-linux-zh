    Finally, if you enjoyed this book, then I’d like to ask you for a favor, would
    you be kind enough to leave a review for this book on Amazon? It’d be greatly
    appreciated!


    Thank you and good luck!


    # Answers


    ## Quick Quiz 1

    1. `VirtualBox` is a piece of software that provides you with a virtual machine,
    allowing you to run other operating systems on your computer without interfering
    with your main system.

    2. `CentOS` is one of the Linux distributions.

    3. `ssh` stands for Secure Shell.

    4. To access the `BIOS` settings, when your computer starts up press `F1`, `F2`,
    `F12` or `ESC`, depending on your system.


    ## Quick Quiz 2

    1. `/bin`

    2. `/boot`

    3. `/root`

    4. `/dev`

    5. `/etc`

    6. `/home`


    ## Quick Quiz 3

    1. `env`

    2. `$$`

    3. Files that begin with ‘a’

    4. A command interpreter.


    ## Quick Quiz 4

    1. `cd`

    2. `clear`

    3. `ls`

    4. `pwd`


    ## Quick Quiz 5

    1. A command line interpreter like `BASH`.

    2. `/` or `''''` or `“”`

    3. `man`

    4. `$`

    5. `and`, `not`, `or`

    6. `if`, `else`, `else if`

    7. Invalid command.


    ## Quick Quiz 6

    1. `execute`

    2. read and write permissions.

    3. he can open the file, make changes and save the file.

    4. he can open the file, and view the contents but cannot save the file.


    ## Quick Quiz 7

    1. `nano` or `nano/name` of file.

    2. `CTRL+G`

    3. `CTRL+SPACE`

    4. `i`

    5. `ZZ`

    6. `cat` and `less`.


    ## Quick Quiz 8

    1. up two directories.

    2. root directory.

    3. `$?`

    4. `Var1=$var2`


