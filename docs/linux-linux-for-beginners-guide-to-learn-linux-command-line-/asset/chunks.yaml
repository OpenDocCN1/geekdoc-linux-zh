    \ 3: All About the Shell\n\nOur computers are programmed so that they understand\
    \ a specific language. That language is called binary and it is comprised of zeros\
    \ and ones. When computing first began, instructions would be provided in this\
    \ language and that caused difficulty because it isn't a language that we can\
    \ all read or write. To get around this, we have the shell and there is one in\
    \ every operating system. The shell is what takes human commands and interprets\
    \ them in a way that the kernel is able to read them and process them.\n\nWhat\
    \ is the Shell?\n\nThe shell is an environment or a user program for user interaction.\
    \ Basically, it is an interpreter that translates the command language and executes\
    \ the commands that are read from input devices like keyboards, or from a file.\
    \ The shell is started when you open a terminal or when you log into your system.\
    \ It is not a part of the Linux system kernel but it does make use of the kernel\
    \ for creating files, executing programs, and lots of other activities. There\
    \ are a number of shells that Linux users can make use of, including:\n\n*   BASH\
    \ - free, open-source and the most common one in Linux\n\n*   CSH – with usage\
    \ and syntax similar to C program language\n\n*   KSH – base of the standard specifications\
    \ for the POSIX shell\n\nEach shell does exactly the same but each will understand\
    \ different syntax and will provide different functions.\n\nThe Shell Prompt\n\
    \nThere are several ways to get shell access:\n\n*   Terminal – Linux has a GUI\
    \ login system and, once you have logged in you can run one of several commands\
    \ in the terminal to get access to shell – XTerm, Gterm or Kterm\n\n*   SSH –\
    \ as soon as you log into a remote workstation or server, you will be given a\
    \ shell prompt\n\n*   Console – Some Linux systems have a login system that is\
    \ text-based and this will give you a shell prompt when you are logged in\n\n\
    To find out the name of your current shell or to find out which shells are available\
    \ on your system, type in this command at the terminal prompt:\n\ncat /etc/shells\n\
    \nIf there is more than one shell listed, there is more than one that is supported\
    \ by your particular platform.\n\nCommand Line Interface (CLI)\n\nThe shell gives\
    \ you an interface with Linux where you can input commands with your keyboard\
    \ and this is known as the CLI or command line interface. To find the type of\
    \ the current shell in your system, input the following command:\n\necho $SHELL\n\
    \nps $$\n\nps -p $$\n\nBasic Command Line Editing\n\nThere are several key combinations\
    \ that you can use to edit commands and to recall them:\n\n*   CTRL + L: Clear\
    \ screen.\n\n*   CTRL + W: Delete the word that starts at the cursor.\n\n*   CTRL\
    \ + U: Clear line of all words\n\n*   Up/Down arrow keys: Recall commands\n\n\
    *   Tab: use to autocomplete the name of files, directories, commands, etc\n\n\
    *   CTRL + R: Search commands you have used previously\n\n*   CTRL + C: Cancel\
    \ any commands that are running\n\n*   CTRL + T: swap around the two characters\
    \ that immediately precede the cursor\n\n*   ESC + T: Swap around the last two\
    \ words that immediately precede the cursor\n\n*   CTRL + H: Delete the letter\
    \ that starts at the cursor.\n\nExecuting A Command\n\nSimply type your command\
    \ in and press the enter key. For example, if you wanted to know the date, simply\
    \ type in date and hit enter.\n\nCommand and File Completion\n\nBash Shell is\
    \ able to automatically complete the names of commands and files when it can or\
    \ when you tell it to. For example, type in sle and then press the tab key – the\
    \ shell will complete the command automatically.\n\nGetting Help in Linux\n\n\
    Most of the Linux commands have their own documentation with them and you can\
    \ use the info or man command to view that documentation. For example, use the\
    \ date command to open the manpage:\n\nman date\n\nYou can also use the ls command\
    \ to read information documentation:\n\ninfo ls\n\nMany of the commands will accept\
    \ -h or –help as a command line option. For example, you can use the following\
    \ to show the date command help options:\n\ndate --help\n\nBasically, you can\
    \ use any of the following to find out information about a Linux command:\n\n\
    *   man commandName\n\n*   info commandName\n\n*   commandName -h\n\n*   commandName\
    \ --help\n\nSuper User\n\nEvery Linux system has a root account, which is for\
    \ the administrator. Many tasks require you to log on as administrator or execute\
    \ commands using root privileges. If you do need to do this, be sure that you\
    \ understand what commands you are running and the consequences each has. One\
    \ careless command run under root privileges can have far-reaching effects, even\
    \ going so far as to render your operating system useless and unusable.\n\nLogging\
    \ in as root\n\nIn many ways, the root account is the same as any user account\
    \ in that you need a username and password to get into it. If you know the password\
    \ for the root account you can use it to get into the root account via the command\
    \ line. A special command that allows you to switch from normal to root user and\
    \ the command is su – it stands for switch user or super user. Just type at the\
    \ command line:\n\nsu\n\nInput the password and, if it is correct, you will be\
    \ switched over to the root user and will have system privileges to run commands.\
    \ Always make sure you are aware that you are logged in as a root user – running\
    \ some commands as root when you think you are logged in as a normal user, might\
    \ cause damage to your system. Get into the habit of checking the command prompt\
    \ – if you see a dollar sign, you are in as a normal user, a # and you are logged\
    \ in as root. When you are done with the admin tasks, simply type in exit or logout\
    \ and you will go back to your normal account.\n\nRunning a Command as Root with\
    \ No Password\n\nSometimes it is better not to log in as root but still run commands\
    \ as the root and we do this by using another command, sudo. This means superuser\
    \ do. If you put this in front of any command, you will be asked for your own\
    \ password and then your details will be checked against a sudoers file. If you\
    \ are in there, you can run commands with root privileges.\n\nWhen you use sudo,\
    \ it is more difficult to forget that you are acting as root because you won't\
    \ be logged into the root account – this means never having to forget to log yourself\
    \ out again. Also, if you have to type sudo before you type every command, especially\
    \ ones that have the potential to do some serious damage, you are unlikely to\
    \ run these commands without thinking.\n\nQuick Quiz 3\n\n1.  Which of the following\
    \ commands allows definition and assignment of environment variables under bash\n\
    \n*   Env\n\n*   Export\n\n*   environ\n\n*   setenviron\n\n2.  Which variable\
    \ contains current shell process id\n\n*   $*\n\n*   $?\n\n*   $$\n\n*   $!\n\n\
    3.  Hidden files are\n\n*   Those whose ‘read’ bit is set to ‘h’\n\n*   Permitted\
    \ for (can be accessed) only superusers\n\n*   Files that begin with a ‘.’\n\n\
    *   Files that cannot be opened by ordinary user for writing\n\n4.  What is shell?\n\
    \n*   Command Interpreter\n\n*   Interface between Kernel and Hardware\n\n*  \
    \ Interface between user and applications\n\n*   Command Compiler\n\n# \n\nChapter\
    \ 4: Basic Linux Commands\n\nThis chapter is dedicated to some of the more essential\
    \ but basic Linux commands that you need to know so fire up Linux and play along.\
    \ There will be exercises to test your knowledge along the way, although I won’t\
    \ be providing answers to all of them because you should be able to work it out\
    \ from the section you just read:\n\nListing Directories and Files\n\nls"
