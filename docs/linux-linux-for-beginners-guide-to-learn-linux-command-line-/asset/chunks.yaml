- fmt: "\nOn Linux, normally we would have two users who could change the file or\
    \ directory permissions – the owner and the root or superuser. The root user is\
    \ able to do everything in the system like a system administrator can. Normal\
    \ users can generally only access directories and files that are held in their\
    \ home directories and perhaps one or two others for collaboration and sharing\
    \ purposes – this how the Linux system is kept stable and secure.\n\n## Basic\
    \ Security\n\nYour space on the Linux system is the home directory and it’s up\
    \ to you to make sure that that’s the way it stays. Some users will give themselves\
    \ full permissions for read, write, and execute but will give no permission for\
    \ others or groups. However, everyone has their own setup.\n\nFor the best security,\
    \ you should not give group or others any write access to your own home directory\
    \ but you can give execute permissions without adding on read permissions. If\
    \ you do this, other users can access your home directory but they cannot see\
    \ what is there and a prime example of this would be a personal web page. Some\
    \ systems run web servers and give each of their users a web space of their own;\
    \ the most common setup is to create a directory in the home directory and call\
    \ it `public_html`, allowing the server to read it and to display what is in it.\
    \ However, because the web server is not the same user as you are, it cannot get\
    \ in and it can’t read the files. In this situation, it is necessary for permission\
    \ to execute to be granted on the home directory, allowing the web server user\
    \ to get to the resources it needs.\n\n## Exercises\n\nHave a look at the permissions\
    \ you have on your home directory and then explore the files inside and see what\
    \ their permissions are.\n\nNext, change some of the permissions, using long and\
    \ shorthand methods, and both absolute and relative paths, just so you get the\
    \ hang of them. As a start, remove the read permission from one file and then\
    \ try reading it to see what happens.\n\nNext, create a new directory and add\
    \ some files in. Now have a go at removing permissions from you on the directory\
    \ and see what can and can’t be done.\n\nLastly, just explore the system and have\
    \ a look at permissions in system directories.\n\n## Quick Quiz\n\n1. Which permission,\
    \ when applied to a directory in the file system, will allow a user to enter the\
    \ directory?\n* Read\n* Write\n* Execute\n* Access Control\n\n2. A user needs\
    \ to open a file, edit it, and then save the changes. What permissions does he\
    \ need to do this? (Choose two.)\n* Read\n* Write\n* Execute\n* Modify\n\n3. A\
    \ file named `staff.odt` has a mode of `rw-r- -r-`. If `rbob` is the file's owner,\
    \ what can he do with it?\n* He can open the file and view its contents, but he\
    \ can't save any changes.\n* He can open the file, make changes, and save the\
    \ file.\n* He can change ownership of the file.\n* He can run the file if it's\
    \ an executable.\n\n4. A file named `staff.odt` has a mode of `rw-r- -r-`. If\
    \ `mhuman` is not the file's owner but is a member of the group that owns this\
    \ file, what can he do with it?\n* He can open the file and view its contents,\
    \ but he can't save any changes.\n* He can open the file, make changes, and save\
    \ the file.\n* He can change ownership of the file.\n* He can run the file if\
    \ it's an executable.\n\n# Chapter 7: Getting to Grips with Editors\n\nThe code\
    \ in this chapter is courtesy of [http://ryanstutorials.net/linuxtutorial/vi.php](http://ryanstutorials.net/linuxtutorial/vi.php).\n\
    \nThere are so many text editors to choose from for Linux that it can easily become\
    \ confusing. In this chapter, we are going to look at `nano` and `vi`, two very\
    \ simple editors for Linux.\n\n## Nano\n\n`nano` is already installed in many\
    \ of the Linux distributions and it works very well with `Sudo`. Here’s an overview\
    \ of how to use it.\n\n### Running Nano\n\nThere are two ways to run `nano`:\n\
    * At the command prompt, type in `nano`\n* Or input the following command - `nano\
    \ name of file` – insert the name of the file and `nano` will look for it; if\
    \ it finds it, it will open it, if not you will get an empty buffer with the filename\
    \ as its name\n\nAt the top of the screen you will see information about the file\
    \ you are working on or, if none, it will say `New Buffer`. Following that is\
    \ the content of your document in the form of text. Then is a system message that\
    \ gives you information about the program that is executing a function and it\
    \ will likely say “new file”. Lastly, you will see the shortcut lines.\n\n`nano`\
    \ is a WYSIWYG editor, or “what you see is what you get”. Unless you used a key\
    \ to modify your text, what you type in is what goes into the text input. Type\
    \ something into it now so that we have something to play around with.\n\n###\
    \ Shortcuts\n\nShortcuts are program functions, like exiting, saving, etc. and\
    \ you will see the commonest ones at the bottom of the screen. You do not need\
    \ to use `SHIFT` when you are using the shortcuts and they are all in lowercase\
    \ and unmodified number format. If you press on `CTRL+G` you will see a list of\
    \ all the shortcuts you can use; have a look and then press `CTRL+X` to come out\
    \ of it.\n\nSaving a file is known as “writing out” and you do this by pressing\
    \ `CTRL+O`. Next, you are asked for a name and the shortcuts will change to show\
    \ what you can input to finish this command.\n\nTo insert contents from another\
    \ file into the one you are working on, type `CTRL+R`. If you have any trouble\
    \ using the key simply press `ESC`.\n\nTo exit nano, press `CTRL+X`.\n\n### Navigating\
    \ Nano\n\nTo navigate a text file you can use the arrow keys, home, page down\
    \ and end keys if you want but there is also another way:\n* `CTRL+F` – move the\
    \ cursor forward\n* `CTRL+B` – move the cursor backward\n* `CTRL+P` – move the\
    \ cursor up line\n\n `CTRL+N` – move the cursor down one line\n* `CTRL+A` – takes\
    \ the place of Home key\n* `CTRL+E` – takes the place of End key\n* `CTRL+V` –\
    \ moves down one page\n* `CTRL+Y` – moves up one page\n* `CTRL+SPACE` – move forward\
    \ one word at a time\n* `ALT+SPACE` – move backward one word at a time\n* `CTRL+C`\
    \ – indicates where the cursor is at any time\n\n### Copy, Cut and Paste\n\nTo\
    \ copy text, you move the cursor to where you want to start and highlight it using\
    \ `CTRL+` all text between the start point and the cursor will be highlighted.\n\
    * `ALT+` - copies the highlighted text\n* `CTRL+K` – cuts the highlighted text\n\
    * `CTRL+U` – pastes the text where you specify with your cursor\n\nTo delete a\
    \ whole line, use `CTRL+K` but do not highlight the text.\n\n## Working with Vi\n\
    \n`vi` is also a command line editor and is a very powerful one to boot. It is\
    \ a plain text editor, like Notepad on Windows and, to use it, you use only your\
    \ keyboard, not the mouse. `vi` has two operating modes – Insert or Input mode\
    \ and Edit. In the Insert mode, you can insert content into the current working\
    \ file and in Edit mode, you navigate around the file, performing things like\
