- fmt: '

    * If you have more than 1 GB of RAM on your computer, allocate one-quarter maximum
    to the virtual machine – if you have less, stick with what VirtualBox recommends.
    Click `Next`

    * Click on `Create New Hard Disk` and then on `Next`

    * Click on `Next` again and you will come to a screen where you set the type of
    hard drive. Choose `Fixed-Size Storage`

    * If you are intending to add software or to install potentially large files in
    virtual Linux, add on some buffer; click `Create`

    * Once the virtual hard drive has been created, you need to add the `.iso` image
    you downloaded. Click `Settings`>`Storage`>`CD/DVD Device`

    * Where it says `Empty`, there is a folder icon so click on it

    * Choose the `.iso` that you already downloaded and click on `OK`

    * Now double-click on the virtual machine so it starts

    * You will more than likely get a load of instructions and warnings about using
    guest operating systems –– read them and then mark them so they don’t come up
    again.

    * Wait while `Ubuntu` loads

    * Before you can install Linux, you must first change your BIOS settings on your
    computer – usually, when you start your computer, you hit `F1`, `F2`, `F12`, `Escape`
    or `Delete`. Restart your computer now and get into the BIOS settings and change
    the boot option to boot from `USB` first

    * Now plug your `USB` stick in and reboot your computer again

    * You will see a screen that is blank except for a few logos at the bottom

    * Press any key and a new screen will appear – choose the language you want

    * Now click on `Install Ubuntu`

    * The installer will start and you may be asked to choose your language again

    * Tick the option for installing closed source software

    * Now you will be asked to connect to your `Wi-Fi` if you aren’t connected already
    – you don’t need to do this right now and it will make your installation take
    longer so ignore it

    * There are three options here – choose the first one and then drag the slider
    to choose the hard drive sizes for `Windows` and for `Ubuntu`. Your hard drive
    will now be partitioned

    * Answer the questions that appear on your screen as they appear – these are self-explanatory

    * Now you just wait for `Ubuntu` to be installed – depending on the speed of your
    computer this can take up to one hour

    * Reboot your computer and remove your `USB` stick – when you boot up again you
    will be in a working `Ubuntu` environment


    If you changed the size of your partition for `Windows`, you will be asked to
    do a disk check – this is not necessary. Go back to `Settings`>`Storage`>`CD/DVD`
    and check that it has the `Empty` entry again – this will eliminate the need to
    use your `USB` every time you boot your computer.


    ### Mac OS


    When the `VirtualBox` installation has completed, you need to download the `iso`

    * Go to the `Ubuntu` download page and click on the Mac `iso` image – choose your
    geographical location and then click on `Begin Download`. Make sure you save the
    file and not open or mount it

    * Open `VirtualBox` and register it

    * Now you can create a new virtual machine – click on `New` to open the wizard

    * Click `Next` and type in a name for the virtual machine

    * Choose `Linux Ubuntu` from the operating system menu and click on `Next`

    * Set your base memory as `384 MB` and click on `Next`

    * Now you need to click to create a new hard disk which is just a disk that takes
    up space on your existing drive – make sure you have enough to do this! Accept
    all the default settings and click on `Next`

    * The `Create New Virtual Disk` wizard will appear, click on `Next`

    * Click on `Dynamically Expanding Storage` and click on `Next`

    * Choose where you want your hard drive to be and how big – `2 TB` is the maximum
    although `8 GB` is more than sufficient

    * Click on `Next` and then on `Finish`

    * The framework is ready so make sure you have copied the `iso` to a bootable
    `USB` or `DVD` disk


    `VirtualBox` will now show you that you have a virtual machine with the name of
    `Ubuntu Linux`.

    * Insert your `DVD` or `USB`

    * Click on `CD/DVD` and then tick the box for `Mount CD/DVD drive`

    * Click on `ISO Image File`

    * Click the folder beside `No Media` and then drag your `iso` file into it

    * Click on `Select` and then on `OK`

    * Click on `Start` and black screen will appear – this is the new session and
    everything you do now will be done on the virtual machine – if you want to change
    that back to your Mac just press the `Command` key on the left side of the space
    bar

    * Click `OK`

    * When the `Ubuntu` screen appears, double click on `Install` and answer the questions
    that appear on the screen

    * When finished click on `Forward`

    * Now accept the default values for where `Ubuntu` is going and click on `Forward`

    * Input your personal information, including a new password and a name for your
    machine

    * Choose whether to log in automatically or use a password and click on `Forward`

    * Click `Install` and wait

    * When the installation has finished, you will either be asked to use your password
    to go in or you will automatically be at the `Linux` desktop, depending on what
    option you chose

    * `Ubuntu` will now check for updates so click on `Install Updates` and wait

    * Reboot your Mac is needed and you are ready to go


    ### How to Install CentOS from Scratch


    `CentOS` is a stable `Linux` distribution and here’s how to install it:

    * Go to the download page for `CentOS` and download the `ISO`

    * Now make a bootable drive, transferring the `ISO` to a formatted `USB` stick.
    To do this, plug your `USB` in and open a command prompt window. Type the following
    in -

    ```bash

    dd if=/iso/CentOS.iso of=/devdb

    ```

    * On the desktop, click `Install to Drive`

    * Choose your keyboard type and preferred language – make sure you pick the right
    keyboard or some of your keys will be scrambled

    * The default for the installer is to choose `Automatic Partitioning` of your
    hard drive – click the `Installation Destination` and change that to `Custom Partitioning`

    * Choose the hard drive to install `CentOS` to and click on `Other Storage Options`

    * Click `Standard Partition`

    * To create `Swap Space` on one of your partitions, select the `File System` for
    the swap space and name it as `swap` and click on `Reformat`

    * Now you need to create your mount point – this is where the `root` partition
    is going to be installed. Set your `mount point` and then set `Label` and `Capacity`
    to whatever you require.

    * Click on `ext4` to set the file system and then on `Reformat`

    * Click on `Done` and accept the changes you have made

    * Click the clock and set your time zone; click `Done`

    * Click on `Begin Installation`; as it goes through, follow all the onscreen instructions,
    setting up your user account and the `root password`. To do this, click `Root
    Password` and type in the password twice; click `Done`

    * To create your user account, input the details and, if this is going to be an
    administrator account, ensure that you tick the options for `Make This User Administrator`
    and `Require a Password`

    * Once the installation is complete, you will see a message telling you it was
    successful; click `Quit`

    * Log out and then log in to your new `CentOS` installation

    * Accept the `EULA` and you are ready to go


    ### Connecting Your Linux System over the Network


    If you are looking to connect your `Linux` system over your network, you must
    use something like `SSH`. This is an acronym for `Secure Shell` and it is one
    of the most well-known of the network protocols. The purpose of `SSH` is to let
    you connect securely to remote machines on your network. To connect your `Linux`
    system over your network:

    * Windows – use `PuTTY`

    * Mac and Linux – use `ssh` on the command line


    #### Windows

    * Open your web browser and download `PuTTY`

    * Open `PuTTY` and type in the `IP address` or `Hostname` into the correct box.

    * If you had no port number provided, leave it as the default of `22`

