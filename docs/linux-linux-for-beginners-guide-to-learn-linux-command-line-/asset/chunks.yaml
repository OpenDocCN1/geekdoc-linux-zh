  trans: "\n\n- `~/.profile` 被多个 shell 作为回退方案使用。\n\n如果你想为 `PATH` 添加一个本地使用的的目录，请将以下内容添加到\
    \ `~/.bash_profile` 中：\n\n```bash\nexport PATH=\"${PATH}:/home/my_user/bin\"\n\
    ```\n\n如果你想更新该变量，必须重新登录或执行源：`source ~/.bash_profile`。\n\n## 图形化应用程序\n\n如果你想为图形用户界面应用程序使用环境变量，可以将变量置于\
    \ `xinitrc` 中，或者如果你在使用显示管理器，则可以放在 `xprofile` 中。参考此示例：\n\n`~/.xinitrc`\n\n```bash\n\
    export PATH=\"${PATH}:~/scripts\"\nexport GUIVAR=value\n```\n\n## 按会话划分\n\n有时，你可能需要更严格的定义。例如，你可能希望临时从指定目录运行一个可执行文件，而无需每次都输入绝对路径，也不需要为了短时间需要而编辑\
    \ shell 配置文件。在这种情况下，你可以在当前会话中定义 `PATH` 变量，并结合 `export` 命令使用。只要你保持登录状态，`PATH` 变量将继续使用临时设置。如果你想向\
    \ `PATH` 添加一个会话特定的特定的目录，可以输入：\n\n```bash\nexport PATH=\"${PATH}:/home/my_user/tmp/usr/bin\"\
    \n```\n\n## 示例\n\n在本节中，我们将查看一些常见的 Linux 环境变量并讨论它们的值。\n\n### DE\n\n这表示桌面环境（Desktop\
    \ Environment），具体指当前正在使用的环境。`xdg-open` 使用 `DE` 来选择一个比 `DE` 提供的更符合用户习惯的文件打开器。某些软件包也必须使用\
    \ `DE` 安装，该变量的可识别值为如下：\n\n- `gnome`\n- `kde`\n- `lxde`\n- `xfce`\n- `mate`\n\n\
    在启动窗口管理器之前必须导出该变量，例如：\n\n`~/.xinitrc`\n\n```bash\nexport DE=\"xfce\"\nexec openbox\n\
    ```\n\n这将强制 `xdg-open` 使用 `exo-open`，它更符合用户习惯，因为它会自动假设自己处于 `xfce` 中。对于配置，应该使用\
    \ `exo-preferred` 应用程序。\n\n### DESKTOP_SESSION\n\n这类似于 `DE`，但在 LXDE 环境内部使用。例如，当\
    \ `DESKTOP_SESSION` 被设置为 `LXDE` 时，`xdg-open` 将自动为文件使用 `pcmanfm` 关联。\n\n### PATH\n\
    \n`PATH` 包含一个由冒号分隔的目录列表，系统将在此处查找任何可执行文件。当 shell 解析普通命令（如 `ls`）时，它会在列出的目录中查找任何与命令同名的可执行文件，然后执行它。如果你想运行未放入\
    \ `PATH` 的可执行文件，需要使用该特定可执行文件的绝对路径。\n\n### HOME\n\n你可以在这里找到指向当前登录用户主目录的路径。`HOME`\
    \ 可以被多个应用程序使用，作为将配置文件与当前运行该变量的用户关联起来的方法。\n\n### PWD\n\n你可以在这里找到指向当前工作目录的路径。\n\n\
    ### OLDPWD\n\n你可以在这里找到指向上一个工作目录的路径，即 `PWD` 在上一次执行 `cd` 之前所具有的值。\n\n### SHELL\n\
    \n你可以在这里找到指向用户首选 shell 的路径。这可能不是当前正在使用的 shell，但该变量是由 `Bash` 在启动时设置的。\n\n### TERM\n\
    \n这包含正在运行的终端类型，例如 `xterm-256color`。这通常被在终端运行并需要终端特定功能的程序使用。\n\n### PAGER\n\n这包含了用于列出文件内容的命令，例如\
    \ `/bin/less`。\n\n### EDITOR\n\n这包含了用于运行文件编辑轻量级程序的命令，例如 `/usr/bin/nano`。例如，你可以在\
    \ X 下写一个在 `nano` 或 `gedit` 之间切换的交互开关：\n\n```bash\nexport EDITOR=\"$(if [[ -n $DISPLAY\
    \ ]]; then echo 'gedit'; else echo 'nano'; fi)\"\n```\n\n### VISUAL\n\n你可以在这里找到用于运行执行某些要求要求较高的任务（如编辑邮件）的全功能编辑器命令。\n\
    \n### MAIL\n\n你可以在这里找到入站邮件的位置，传统上使用的设置为 `/var/spool/mail/$LOGNAME`。\n\n### BROWSER\n\
    \n你可以在这里找到指向网络浏览器的路径。当你想要为 shell 设置交互式配置文件时它非常有用，因为它可以根据图形环境的可用性进行动态更改：\n\n```bash\n\
    if [ -n \"$DISPLAY\" ]; then\n    export BROWSER=firefox\nelse\n    export BROWSER=links\n\
    fi\n```\n\n### ftp_proxy and http_proxy\n\n这些包含了 HTTP 和 FTP 服务器：\n\n```bash\n\
    ftp_proxy=\"ftp://192.168.0.1:21\"\nhttp_proxy=\"http://192.168.0.1:80\"\n```\n\
    \n### MANPATH\n\n你可以在这里找到一个由冒号分隔的目录列表，`man` 将在此处搜索 man 手页。\n\n注意 – 在 `etc/profile`\
    \ 中，你会发现一条注释说“Man 比我们更擅长处理这些问题”，因此请保留该变量的默认值，例如 `/usr/share/man:usr/local/share/man`。\n\
    \n### INFODIR\n\n这包含目录列表...\n\n### TZ\n\n这用于设置与当前使用的不同的时区。\n\n"
