    # 第 3 章：关于 Shell 的一切


    计算机的程序设定使得它们能够理解一种特定的语言。这种语言被称为二进制，由 0 和 1 组成。在计算之初，指令是以这种语言提供的，这导致了许多困难，因为它不是一种我们所有人都能读懂或写的语言。为了解决这个问题，我们有了
    Shell，每个操作系统中都有一个。Shell 负责接收人类命令并将其转换为内核能够读取和处理的方式进行解释。


    ## 什么是 Shell？


    Shell 是一个用于用户交互的环境或用户程序。本质上，它是一个解释器，用于翻译命令语言并执行从键盘等输入设备或从文件中读取的命令。当你打开终端或登录系统时，Shell
    就会启动。它不是 Linux 系统内核的一部分，但它确实利用内核来创建文件、执行程序以及许多其他活动。Linux 用户可以使用多种 Shell，包括：


    * `BASH` - 免费、开源且是 Linux 中常用的 Shell

    * `CSH` – 使用方法和语法与 C 语言相似

    * `KSH` – POSIX shell 标准规范的基础


    每个 Shell 的功能完全相同，但每个 Shell 都会理解不同的语法并提供不同的函数。


    ## 终端 提示符 (Shell Prompt)


    有几种方法可以获取 Shell 访问：


    * 终端（Terminal） – Linux 拥有 GUI 登录系统，一旦登录，你就可以在终端中运行几个命令之一来获取 Shell 访问—— `XTerm`、`Gterm`
    或 `Kterm`

    * SSH – 只要你登录到远程工作站或服务器，你就会获得一个 Shell 提示符

    * 控制台（Console） – 某些 Linux 系统拥有基于文本的登录系统，登录后它将为你提供一个 Shell 提示符


    要查找你当前 Shell 的名称或查找系统中有哪些可用的 Shell，请在终端提示符处输入此命令：


    ```bash

    cat /etc/shells

    ```


    如果列出了多个 Shell，则说明你的特定平台支持多个 Shell。


    ## 命令行界面 (CLI)


    Shell 为你提供了与 Linux 交互的界面，你可以在可以使用键盘输入命令，这被称为 CLI 或命令行界面。要查找你系统中当前 Shell 的类型，请输入以下命令：


    ```bash

    echo $SHELL

    ps $$

    ps -p $$

    ```


    ## 基础命令行编辑


    你可以使用几个快捷键组合来编辑命令并回溯它们：


    * `CTRL + L`: 清屏。

    * `CTRL + W`: 删除从光标开始的单词。

    * `CTRL + U`: 清空整行所有单词。

    * `上/下方向键`: 回溯之前的命令

    * `Tab`: 用于自动补全文件名、目录、命令等

    * `CTRL + R`: 搜索之前使用过的命令

    * `CTRL + C`: 取消任何正在运行的命令

    * `CTRL + T`: 交换光标紧之前的两个字符

    * `ESC + T`: 交换光标紧之前的最后两个单词

    * `CTRL + H`: 删除从光标开始的字母。


    ## 执行命令


    只需输入你的命令并按回车键。例如，如果你想知道日期，只需输入 `date` 并按回车。


    ## 命令和文件补全


    当 `Bash` 能够自动完成命令和文件名称时，或者当你要求它这样做时，它可以自动完成。例如，输入 `sle` 然后按 `tab` 键—— Shell 将自动完成命令。


    ## 在 Linux 中获取帮助


    大多数 Linux 命令自带文档，可以使用 `info` 或 `man` 命令来查看这些文档。例如，使用 `date` 命令打开帮助页（manpage）：


    ```bash

    man date

    ```


    你也可以使用 `ls` 命令读取信息文档：


    ```bash

    info ls

    ```


    许多命令接受 `-h` 或 `--help` 作为命令行选项。例如，你可以使用以下命令显示 `date` 命令的帮助选项：


    ```bash

    date --help

    ```


    基本上，你可以使用以下任何一种方法来查找关于某个 Linux 命令的信息：


    * `man commandName`

    * `info commandName`

    * `commandName -h`

    * `commandName --help`


    ## 超级用户


    每个 Linux 系统都有一个 `root` 账户，用于管理员。许多任务需要你以管理员身份登录或使用 `root` 权限执行命令。如果你确实需要这样做，请务必理解你正在运行的命令以及每个命令的后果。在
    root 权限下运行一个疏忽的命令就可能产生深远的影响，甚至导致你的操作系统失效且无法使用。


    ### 以 root 身份登录


    在很多方面，`root` 账户与任何用户账户相同，你需要用户名和密码才能进入。如果你知道 `root` 账户的密码，就可以用它进入 `root` 账户。有一个允许从普通用户切换到
    root 用户的特殊命令，该命令是 `su`。在命令行输入：


    ```bash

    su

    ```


    输入密码，如果正确，你将切换到 root 用户。


    ### 免密以 root 身份运行命令


    有时最好不登录 root 但仍然以 root 身份运行命令，我们通过另一个命令 `sudo` 实现这一点。它的意思是“超级执行”。如果你在任何命令前加上它，系统会要求你输入自己的密码，然后根据
    `sudoers` 文件检查你的详细信息。如果你在文件中，就可以以超级权限运行命令。


