    2. 哪个变量包含当前 shell 进程 ID：

    * `$`

    * `$?`

    * `$$`

    * `$!`


    3. 隐藏文件是：

    * “读”位被设置为“h”的文件

    * 仅限超级用户许可（访问）的文件

    * 以“.”开头的文件

    * 普通用户无法打开写入的文件


    4. Shell 是：

    * 命令解释器

    * 内核与硬件之间的接口

    * 用户与应用程序之间的接口

    * 命令编译器


    # 第 4 章：基础 Linux 命令


    本章专门介绍你需要了解的一些重要但基础的 Linux 命令，请打开 Linux 并一起操作。过程中会有一些练习来测试你的知识，但我不会提供所有练习的答案，因为你应该从刚读过的章节中推出来：


    列出目录和文件


    ```bash

    ls

    ```


