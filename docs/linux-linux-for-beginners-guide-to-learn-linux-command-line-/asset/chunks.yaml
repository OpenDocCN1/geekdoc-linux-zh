    # Chapter 2: The Linux Directory Structure


    If you are coming to Linux from a Windows system, the directory structure will
    seem somewhat strange. There are no longer any drive letters, these are replaced
    with `a/` and some strange sounding directory names, most of which are just three
    letters. The FHS, or File Hierarchy System, is what defines the file system structure
    on Linux but there are also a few directories that have not yet got a definition
    under this standard:


    ### / – The Root Directory


    On Linux, everything is found under the directory `/` which is also called the
    root directory. This is like the `C:/` on Windows but without any drive letters.


    ### /bin – Essential User Binaries


    This directory is home to the binaries or programs that are essential to the system
    being mounted in single-user mode. Things like Firefox would be stored in the
    directory called `/usr/bin`, while the utilities and system programs, like `bash`
    shell, are found in `/bin`.


    ### /boot – Static Boot Files


    This is where the files needed to boot up your system are located, such as the
    GRUB boot loader and the kernel files. The configuration files, however, are in
    `/etc`.


    ### /cdrom – Mount Point for CD-ROMs


    This directory doesn’t come under the FHS standard but is still to be found in
    most operating systems. It is a temporary location for when you insert a CD-ROM
    into your computer


    ### /dev – Device Files


    Devices are exposed as files on Linus and this directory has several special files
    that are representative of devices. These are not files in the way you know them
    but they look like they are. For example, if you see `/dev/sda`, it is representing
    the initial SATA drive in your system. You will also find pseudo devices here,
    virtual devices that don’t correspond to any hardware.


    ### /etc – Configuration Files


    This is where the configuration files are found and these can be edited in any
    text editor. However, only the configurations of the system are found here; if
    you have user-specific ones, they will be found in the user’s home directory


    ### /home – Home Folders


    This is where you will find a home folder for each of the users. This contains
    the data files and configuration files specific to the user and each user can
    only write to their own home folder. If you want to modify others, you need elevated
    permissions, i.e. to become the `root` user


    ### /lib – Essential Shared Libraries


    This contains all the libraries that the binaries located in `/bin` and `/sbin`
    need.


    ### /lost+found – Recovered Files


    Every file system has a lost and found directory; if your system were to crash,
    at the next bootup, a file system check is performed. If corrupted files are found,
    they are put into the directory, giving you the chance to recover as much as you
    can.


    ### /media – Removable Media


    Here you will find subdirectories and this is where removable media that is connected
    to the system is mounted. For example, a BD, DVD or USB. When each is mounted,
    a new drive will appear, allowing you to access the media contents.


    ### /mnt – Temporary Mount Points


    This is where administrators mount temp file systems while they are using them


    ### /opt – Optional Packages


    Here you will find subdirectories for software packages that are optional. It
    is generally used by software that doesn''t follow the rules of the standard FSH


    ### /proc – Kernel & Process Files


    This is like the `/dev` directory as it contains no files that are standard; instead,
    it has special files that are representative of process and system information


    ### /root – Root Home Directory


    This is the root user’s home directory. Note it is not located in `/home/root`,
    only at `/root`, distinguishing itself from `/`, which is the root directory for
    the system


    ### /run – Application State Files


    This is quite new and it provides a place for applications to store their transient
    files, like process IDs and sockets. These are not stored in `/tmp` because they
    may be deleted from there


    ### /sbin – System Administration Binaries


    Similar to `/bin` and contains binaries that are used for system administration
    by the `root` user


    ### /selinux – SELinux Virtual File System


    You will see this is your particular Linux distro used SELinux as security. The
    directory will contain the files needed by SELinux. If you are using Ubuntu and
    you see this directory, it is a bug because Ubuntu does not use SELinux


    ### /srv – Service Data


    This is where you will find the “data for services provided by the system”. If,
    for example, you were using the Apache HTTP server for your website, the files
    for the website would be stored in this


    ### /tmp – Temporary Files


    This is where temporary application files are stored and are deleted when the
    system rebooted


    ### /usr – User Binaries & Read-Only Data


    Here you will find files and applications that are used by users and not by the
    system. For example, you would find applications that are not essential here,
    with binaries that are not essential


    ### /var – Variable Data Files


    Where `/usr` is only readable, `/var` is writable. Her you will find log files
    and anything else that is normally written to `/usr


    The Linux system is composed of three main code bodies:


    1. The Kernel – this is in charge of the maintenance of all the abstractions of
    the Linux operating system, as well as processes and virtual memory. This is the
    center point for the operating system, the spine if you like, and is responsible
    for the functionality that is required to run any process, as well as providing
    system services that give protected access to your hardware resources. Anything
    that is required for the operating system to run is implemented by the kernel

    2. System Libraries – these are a set of functions that allow interrelation between
    applications and the kernel. These also apply a good deal of the functionality
    of the operating system that doesn''t need the privileges or rights of the kernel
    code

    3. System Utilities – these are the programs that execute specific managing tasks,
    those that are specialized. Some utilities may be invoked only once just to initialize
    features of your system and configure them. Others will run constantly, carrying
    out tasks like responding to network connections, both incoming and outgoing,
    accepting requests for logging on or updating files and log records.


