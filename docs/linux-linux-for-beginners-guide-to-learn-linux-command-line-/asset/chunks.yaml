    ```


    然后，在 `less` 界面中，输入一个正斜杠 `/` 和你想要搜索的单词：


    ```

    /science

    ```


    该单词的所有实例都会被高亮显示；要找到下一个实例，输入：


    ```bash

    grep

    ```


    `grep` 是 Linux 标准实用程序之一，用于搜索特定的模式或单词。清除屏幕并输入：


    ```bash

    % grep science science.txt

    ```


    现在你可以看到 `grep` 命令打印了每一行包含 `science` 单词的行。真的如此吗？


    现在输入：


    ```bash

    % grep Science science.txt

    ```


    `grep` 是区分大小写的，它会区分 `science` 和 `Science`。如果你想忽略这种大小写敏感性，使用 `-i`。例如，输入：


    ```bash

    % grep -i science science.txt

    ```


    如果你想搜索特定的模式或短语，必须将其放在单引号内。要搜索 `spinning top`（陀螺），你会输入：


    ```bash

    % grep -i ''spinning top'' science.txt

    ```


    `grep` 命令的其他选项有：


    - `-v` 将显示不匹配指定文本的行

    - `-n` 将在每个匹配行前加上正确的行号

    - `-c` 将仅打印匹配行的总数


    尝试一下这些命令并看看结果如何。你可以在一个命令中使用多个这些选项，例如，要显示不包含 `Science` 或 `science` 的行数，你会输入：


    ```bash

    % grep -ivc science science.txt

    ```


    ### `wc`


    这是一个非常实用的工具，是 `word count`（单词计数）的缩写。如果你想对 `science.txt` 文件进行总单词数计数，你会输入：


    ```bash

    % wc -w science.txt

    ```


    如果你想知道文件中有多少行，输入：


    ```bash

    % wc -l science.txt

    ```


    ### 章节总结


    | 命令 | 含义 |

    | :--- | :--- |

    | `cp file1 file2` | 复制文件 1 并将其命名为 file2 |

    | `mv file1 file2` | 将 file1 移动或重命名为 file2 |

    | `rm file` | 删除文件 |

    | `rmdir` | 删除目录 |

    | `cat file` | 显示文件 |

    | `less file` | 一次显示文件的一页 |

    | `head file` | 仅显示文件的前 10 行（或指定的行） |

    | `tail file` | 显示文件的最后 10 行（或指定的行） |

    | `grep “keyword” file` | 在文件中搜索特定的关键词 |

    | `wc “keyword” file` | 统计文件中有多少个字符或单词 |


    ### 重定向


    大多数由 Linux 命令启动的进程将把内容写入终端屏幕，即标准输出。其中许多进程还从键盘获取输入。此外，还有一些进程会将错误信息写入终端屏幕。我们已经使用过
    `cat` 命令将文件内容写入终端，现在输入以下内容，且不指定任何文件：


    ```bash

    % cat

    ```


    使用键盘输入几个单词，任何内容都可以，然后按回车键。按住 `CTRL` 并按 `d` 键——这将完成输入。当你运行带没有文件的 `cat` 命令时，它会读取键盘输入，当接收到文件结束符
    `d` 时，它将其复制到你的终端。在 Linux 中，我们能够重定向输入和输出。


    #### 重定向输出


    `>` 用于重定向命令输出。例如，如果我们想创建一个名为 `list1` 的文件，其中包含水果列表，我们会输入：


    ```bash

    % cat > list1

    ```


    然后输入几个水果的名字，并在每个名字后按回车键。例如：


    ```

    apple

    pear

    banana

    ```


    然后按 `CTRL+d`。`cat` 命令将读取从键盘输入的内容，`>` 将其重定向到输出（屏幕），到一个名为 `list1` 的文件中。如果你想读取文件内容，你会输入：


    ```bash

    % cat list1

    ```


