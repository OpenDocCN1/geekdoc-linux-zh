  trans: "\n你可以通过几种方式实现此操作，但它们的效果是相同的，因此选择适合你的方法即可。首先，确保你仍处于 `Edit` 模式，然后使用以下命令之一：\n\
    \n*   `ZZ`（使用大写字母） – 保存并退出\n*   `:q!` – 退出并丢弃自上次保存以来进行的所有更改\n*   `:w` – 保存但不退出\n\
    *   `:wq` – 保存并退出\n\n大多数 `vi` 命令在输入键序列后会立即执行。然而，任何以冒号 `:` 开头的命令都需要你在输入命令后按回车键。\n\
    \n保存你正在编写的文件并退出。\n\n# 查看文件\n\n`vi` 本质上是一个文本编辑器，你也可以用它查看文件。不过，还有两个更好的命令可以使用。第一个是\
    \ `cat`，它是 concatenate 的缩写，用于合并文件；在基本形式下，可以用它查看文件。使用你刚刚创建的文件输入以下内容：\n\n```bash\n\
    cat <filename>\n```\n\n你现在应该能在屏幕上看到该文件的内容，随后显示一个提示符。只有在你运行 `cat` 并带有一个参数时，才会发生这种情况。如果你在不带任何参数的情况下运行它，光标将移动到下一行，什么都不会发生。\n\
    \n当你没有大文件时，这个命令很好用但如果有大文件，你将无法轻松阅读内容，因此我们使用另一个命令；`less`\n\n```bash\nless <filename>\n\
    ```\n\n这允许你使用上下方向键或使用空格键翻页（或按 `b` 返回）来在文件中移动。按 `q` 将退出文件。\n\n`less` 允许你使用方向键在文件中上下移动。你可以使用\
    \ `Spacebar` 向进一页，或按 `b` 返回一页。完成后，你可以按 `q` 退出。在你创建的文件上尝试一下。\n\n# 在 vi 中导航\n\n\
    再次打开文件并进入插入模式。输入几段文字，然后按 `Esc` 返回编辑模式。要在文件中进行导航，请使用以下命令。现在试一下并看看它们是如何工作的：\n\n\
    *   箭头键 – 移动光标\n*   `j` – 光标向下移动\n*   `k` – 光标向上移动\n*   `h` – 光标向右移动\n*   `l`\
    \ – 光标向左移动\n*   `$` – 将光标移动到当前行尾\n*   `^` – 将光标移动到当前行首\n*   `nG` – 移动到第 n 行，例如\
    \ `6G` 将带你到第 6 行\n*   `G` – 移动到文本最后一行\n*   `w` – 移动到下一个单词开头\n*   `nw` – 向前移动单词，例如\
    \ `4w` 将向前移动 4 个单词\n*   `b` – 返回上一个单词开头\n*   `nb` – 返回指定的单词\n*   `{-` – 返回上一个段落\n\
    *   `}` – 前一个段落\n\n# 删除内容\n\n导航 `vi` 有很多方法，其中一些以 `n` 开头的命令允许你指定数字。删除的操作也是类似的，有几个删除命令允许我们添加移动命令以便指定要删除的内容。使用以下命令可以删除：\n\
    \n*   `x` – 删除一个字符\n*   `nx` – 删除 n 个字符\n*   `dd` – 删除行\n*   `dw` – 删除一个单词\n\n\
    # 撤销\n\n在 `vi` 中撤销更改非常简单：\n\n*   `u`（小写） – 撤销操作\n*   `U`（大写） – 撤销所有更改\n\n# 练习\n\
    \n1.  创建一个新文件并添加内容\n2.  保存文件并退出\n3.  使用 `cat` 查看内容\n4.  使用 `less` 导航文件\n5.  练习使用箭头和\
    \ h 命令的导航\n\n# 快速问答\n\n1. 如何列出环境变量？\n2. 哪些文件用于定义环境变量？\n3. 如何设置环境变量？\n4. 如何在 vi\
    \ 中保存环境变量？\n5. 哪些文件用于全局环境变量？\n\n# 第 8 章：环境变量\n\n环境变量是具有名称并包含数据的对象。它们至少被一个进程使用。\n\
    \n## 工具程序\n\n`coreutils` 软件包包含了 `printenv`。要列出所有环境变量，你只需输入：\n\n```bash\nprintenv\n\
    ```\n\n这些变量某些是用户特定的。工具 `env` 用于在修改后的环境中运行命令。例如\n\n每个不同的进程都会在 `/proc/$PID/environ`\
    \ 中存储自己的环境。\n\n# 定义变量\n\n### 全局变量\n\n大多数发行版都建议你在 `/etc/profile` 中更改或添加变量。然而，你需要记住，某些配置文件是特定于包的。以下应该使用的文件：\n\
    \n*   `/etc/environment` – `pam_env` 模块使用此文件，且它是 shell 无关的。这意味着你不能使用通配符扩展或脚本。此文件只接受变量-值对。\n\
    *   `/etc/profile` 以及任何特定 shell 的配置文件\n\n在下一个示例中，我们正为相应的用户将 `~/bin` 目录添加到 `PATH`。你只需要将此行添加到所选环境变量的配置文件中（`/etc/profile`\
    \ 或 `/etc/bash.bashrc`）：\n\n```bash\n# 如果用户 ID 大于或等于 1000 且 ~/bin 存在且是一个目录 且 ~/bin\
    \ 不在你的 $PATH 中\n# 则将 ~/bin 导出到你的 $PATH\nif [[ $UID -ge 1000 && -d $HOME/bin &&\
    \ -z $(echo $PATH | grep -o $HOME/bin) ]]\nthen\n    export PATH=\"${PATH}:$HOME/bin\"\
    \nfi\n```\n\n### 每个用户\n\n注意 - `systemd` 和 `dbusdaemon` 的用户实例将不会继承位于 `~/.bashrc`\
    \ 等位置的变量。因此，任何由 `dbus` 激活的程序（如 `Gnome Files`）除非被告知，否则不会使用它们。\n"
- fmt: "\n- `~/.profile` is used by several shells as a fallback.\n\nIf you want to\
    \ add a directory for local use to `PATH`, add the following into the `~/.bash_profile`:\n\
    \n```bash\nexport PATH=\"${PATH}:/home/my_user/bin\"\n```\n\nIf you want to update\
    \ that variable, you must either log back in or source: `source ~/.bash_profile`.\n\
    \n## Graphical applications\n\nIf you want to use an environmental variable for\
    \ a graphical user interface application, your variables can be placed in `xinitrc`\
    \ or, if you are using a display manager, in `xprofile`. Look at this example:\n\
    \n`~/.xinitrc`\n\n```bash\nexport PATH=\"${PATH}:~/scripts\"\nexport GUIVAR=value\n\
    ```\n\n## Per session\n\nOn occasion, you may even need definitions that are much\
    \ stricter. For example, you may want to run an executable file from a specified\
    \ directory on a temporary basis without needing to input the absolute path for\
    \ each one or without having to edit the shell config files just for the short\
    \ time needed. In this case, you would define the `PATH` variable in the session\
    \ you are currently in and combine with the command for `export`. Provided you\
    \ stay logged in, the `PATH` variable will continue to use the temporary settings.\
    \ If you wanted to add a directory that is session-specific to `PATH`, you would\
    \ type:\n\n```bash\nexport PATH=\"${PATH}:/home/my_user/tmp/usr/bin\"\n```\n\n\
    ## Examples\n\nIn this section, we are going to look at some of the more common\
    \ of the Linux environment variables and talk about their values.\n\n### DE\n\n\
    This is indicative of Desktop Environment, specifically the one in use. `xdg-open`\
    \ uses `DE` to pick a file-opener application that is user-friendly than the one\
    \ provided by `DE`. Some packages must also be installed using `DE` and the recognized\
    \ values of the variable are:\n\n- `gnome`\n- `kde`\n- `lxde`\n- `xfce`\n- `mate`\n\
    \nThe variable has to be exported before the window manager can be started, for\
    \ example:\n\n`~/.xinitrc`\n\n```bash\nexport DE=\"xfce\"\nexec openbox\n```\n\
    \nThis forces `xdg-open` to use `exo-open`, which is more user-friendly, because\
    \ it automatically assumes it is in `xfce`. For configuration, `exo-preferred`\
    \ applications should be used.\n\n### DESKTOP_SESSION\n\nThis is like `DE` but\
    \ is used inside the LXDE environment. For example, when `DESKTOP_SESSION` has\
    \ been set to `LXDE`, `xdg-open` will automatically use the `pcmanfm` associations\
    \ for files.\n\n### PATH\n\n`PATH` is home to a list of directories, separated\
    \ by colons, and this is where the system will look for any executable files.\
    \ When the shell interprets a regular command, such as `ls`, it will look for\
    \ any executable file that has the same name as the command that is in the listed\
    \ directories and it will then execute it. If you want to run executables that\
    \ have not been put into `PATH`, you need to use the absolute path to the specific\
    \ executable.\n\n### HOME\n\nThis is where you will find the path that leads to\
    \ the home directory of the user currently logged in. `HOME` can be used by several\
    \ applications as a way of associating configuration files with the user that\
    \ is currently running the variable.\n\n### PWD\n\nThis is where you will find\
    \ the path that leads to the working directory.\n\n### OLDPWD\n\nThis is where\
    \ you will find the path that leads to the previous working directory, i.e., the\
    \ value that `PWD` had before the last execution of `cd`.\n\n### SHELL\n\nThis\
    \ is where we find the path that leads to the preferred shell of the user. This\
    \ may not be the shell that is currently in use but the variable is set by `Bash`\
    \ on startup.\n\n### TERM\n\nThis contains the type of terminal running, for example,\
    \ `xterm-256color`. This tends to be used by programs that run in the terminal\
    \ and need capabilities that are terminal-specific.\n\n### PAGER\n\nThis has the\
    \ command that runs the program that is used to list file contents, i.e., `/bin/less`.\n\
    \n### EDITOR\n\nThis has the command used for running the light program for file\
    \ editing, i.e., `/usr/bin/nano`. For example, you could write a switch that is\
    \ interactive between `nano` or `gedit` under X:\n\n```bash\nexport EDITOR=\"\
    $(if [[ -n $DISPLAY ]]; then echo 'gedit'; else echo 'nano'; fi)\"\n```\n\n###\
    \ VISUAL\n\nThis is where you will find the command that runs the full editor\
    \ used for tasks that are somewhat more demanding, like mail editing.\n\n### MAIL\n\
    \nThis is where you will find the location of incoming mail and the setting traditionally\
    \ used is `/var/spool/mail/$LOGNAME`.\n\n### BROWSER\n\nThis is where you find\
    \ the path that leads to the web browser. It is very useful for when you want\
    \ an interactive configuration file set for the shell as it can be altered dynamically,\
    \ dependent on how available a graphic environment is:\n\n```bash\nif [ -n \"\
    $DISPLAY\" ]; then\n    export BROWSER=firefox\nelse\n    export BROWSER=links\n\
    fi\n```\n\n### ftp_proxy and http_proxy\n\nThese contain the HTTP and the FTP\
    \ servers:\n\n```bash\nftp_proxy=\"ftp://192.168.0.1:21\"\nhttp_proxy=\"http://192.168.0.1:80\"\
    \n```\n\n### MANPATH\n\nThis is where you find a list of directories, each separated\
    \ by a colon and this is where `man` will search for man pages.\n\nNOTE – in `etc/profile`,\
    \ you will find a comment that says “Man is much better than us at figuring this\
    \ out” so leave this variable as a default, for example, `/usr/share/man:usr/local/share/man`.\n\
    \n### INFODIR\n\nThis has a list of directories...\n\n### TZ\n\nThis is used for\
    \ setting time zones that are different from the one used.\n"
