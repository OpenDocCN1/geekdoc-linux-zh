    \ it using CTRL+^ all text between the start point and the cursor will be highlighted.\n\
    \n*   ALT+^ - copies the highlighted text\n\n*   CTRL+K – cuts the highlighted\
    \ text\n\n*   CTRL+U – pastes the text where you specify with your cursor\n\n\
    To delete a whole line, use CTRL+K but do not highlight the text\n\nWorking with\
    \ Vi\n\nVi is also a command line editor and is a very powerful one to boot. It\
    \ is a plain text editor, like Notepad on Windows and, to use it, you use only\
    \ your keyboard, not the mouse. Vi has two operating modes – Insert or Input mode\
    \ and Edit. In the Insert mode, you can insert content into the current working\
