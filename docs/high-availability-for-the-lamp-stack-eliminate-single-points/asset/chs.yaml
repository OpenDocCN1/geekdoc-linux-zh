  \n```\n\n\n\n\n\n`wsrep_sst_auth=\"sstuser:sstuser\"`\n\n## db03 私有 IP 地址\n\n`wsrep_node_address=192.168.12.63`\n\
  \n### 引导集群 (Bootstrapping)\n\n接下来，我们需要引导集群。我们将在 `db01` 上执行此操作。\n\n```bash\nvagrant@db01:~$\
  \ sudo service mysql bootstrap-pxc\n```\n\n我们需要创建一个用于执行状态快照传输 (`SST`) 的用户。当节点加入或重新加入集群时，会发生\
  \ `SST`。此过程会将数据从集群中的一个活动节点（称为 `donor`）复制到正在加入的节点（称为 `joiner`）上。以下是创建该数据库用户的命令。\n\
  \n```bash\nvagrant@db01:~$ sudo mysql -e \"CREATE USER 'sstuser'@'localhost' IDENTIFIED\
  \ BY 'sstuser';\"\nvagrant@db01:~$ sudo mysql -e \"GRANT RELOAD, LOCK TABLES, REPLICATION\
  \ CLIENT ON *.* TO 'sstuser'@'localhost';\"\nvagrant@db01:~$ sudo mysql -e 'FLUSH\
  \ PRIVILEGES;'\n```\n\n此时，集群已以单节点运行启动。你可以使用以下命令检查节点数量。\n\n```bash\nvagrant@db01:~$\
  \ sudo mysql -e \"show status like 'wsrep_cluster_size';\"\n```\n```\n+--------------------+-------+\n\
  | Variable_name      | Value |\n+--------------------+-------+\n| wsrep_cluster_size\
  \ | 1     |\n+--------------------+-------+\n```\n\n接下来，我们可以将另外两个节点引入集群。在剩余的节点上启动\
  \ MySQL (`Percona XtraDB Cluster`)。\n\n```bash\nvagrant@db02:~$ sudo service mysql\
  \ start\nvagrant@db03:~$ sudo service mysql start\n```\n\n从任何节点，你都可以查询集群大小以确认所有三个节点现在都是成员。\n\
  \n```bash\nvagrant@db02:~$ sudo mysql -e \"show status like 'wsrep_cluster_size';\"\
  \n```\n```\n+--------------------+-------+\n| Variable_name      | Value |\n+--------------------+-------+\n\
  | wsrep_cluster_size | 3     |\n+--------------------+-------+\n```\n\n### 配置集群检查工具\n\
  \n`Percona XtraDB Cluster` 包含一个 `clustercheck` 工具。这允许通过端口 `9200` 上的 HTTP 请求检查集群状态。如果你查看之前的\
  \ `HAProxy` 配置，将看到以下内容。\n\n```text\nbackend dbservers\n               balance leastconn\n\
  \               option httpchk\n               server db01 192.168.12.61:3306 check\
  \ port 9200 inter 12000 rise 3 fall 3\n               server db02 192.168.12.62:3306\
  \ check port 9200 inter 12000 rise 3 fall 3 backup\n               server db03 192.168.12.63:3306\
  \ check port 9200 inter 12000 rise 3 fall 3 backup\n```\n\n为了允许该工具处理请求，我们需要在 `/etc/services`\
  \ 文件中为其添加一个条目并启用 `xinetd`。在数据库集群中的所有节点上执行这些操作。\n\n```bash\nvagrant@db01:~$ echo\
  \ 'mysqlchk 9200/tcp # mysqlchk' | sudo tee -a /etc/services\nvagrant@db01:~$ sudo\
  \ apt-get install -y xinetd\nvagrant@db02:~$ echo 'mysqlchk 9200/tcp # mysqlchk'\
  \ | sudo tee -a /etc/services\nvagrant@db02:~$ sudo apt-get install -y xinetd\n\
  vagrant@db03:~$ echo 'mysqlchk 9200/tcp # mysqlchk' | sudo tee -a /etc/services\n\
  vagrant@db03:~$ sudo apt-get install -y xinetd\n```\n\n最后，让我们配置一个数据库用户，以便该工具连接到集群并验证其运行状态。由于这是一个集群，你只需要其中一个数据库节点上创建该用户。注意密码为\
  \ `\"clustercheckpassword!\"`，但你可能需要像下面的示例那样转义感叹号 (`\\!`)。\n\n```bash\nvagrant@db01:~$\
  \ sudo mysql -e \"GRANT PROCESS ON *.* TO 'clustercheckuser'@'localhost' IDENTIFIED\
  \ BY 'clustercheckpassword\\!';\"\nvagrant@db01:~$ sudo mysql -e 'FLUSH PRIVILEGES;'\n\
  ```\n\n现在，当向端口 `9200` 发送 HTTP 请求时，`clustercheck` 工具将响应。\n\n```bash\nvagrant@db01:~$\
  \ curl localhost:9200\nPercona XtraDB Node is synced.\nvagrant@db01:~$ curl 192.168.12.62:9200\n\
  Percona XtraDB Node is synced.\nvagrant@db01:~$ curl 192.168.12.63:9200\nPercona\
  \ XtraDB Node is synced.\nvagrant@server01:~$ curl db01-private:9200\nPercona XtraDB\
  \ Node is synced.\n```\n\n如果其中一个节点未同步，`clustercheck` 工具将返回 `\"not synced.\"`。\n\n\
  ```bash\nvagrant@server01:~$ curl db02-private:9200\nPercona XtraDB Node is not\
  \ synced.\n```\n\n### 安装 WordPress\n\n现在，让我们配置一个数据库用户，以便工具能够连接到集群并验证其运行状态。由于这是一个集群，你只需要在其中一个数据库节点上创建该用户。注意密码为\
