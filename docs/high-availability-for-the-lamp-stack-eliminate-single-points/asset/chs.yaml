  \n\n\n\n无论情况下，所有这些云负载均衡器的功能都非常相似。当你创建一个负载均衡器时，它会关联一个 IP 地址。你将使用该 IP 地址作为你网站的 DNS\
  \ 名称。配置负载均衡器以在 80 端口接受 HTTP 流量，并将该流量转发到你每个 Web 服务器节点上的 8080 端口。此配置绕过了 `HAProxy`\
  \ 并直接与你的 Web 服务器通信。出于这个原因，请确保在你的云负载均衡器上启用了健康检查。你不希望将流量路由到已经宕线的 Web 服务器。同时请记住，你需要在每个\
  \ Web 服务器上仍然运行 `HAProxy` 以连接到你的后端数据库服务器。这里是该解决方案的图。\n\n![cloud-http-load-balancer-book.jpg](img/00004.jpeg)\n\
  \n如果你愿意，可以将 Web 服务器切换为在标准端口 80 上，并移除针对 HTTP 流量的 `HAProxy` 配置。你也可以完全消除 `HAProxy`，并创建另一个负载均衡器来处理数据库流量。如果这样做，请记住更新你的应用程序配置以指向负载均衡器。\n\
  \n![cloud-http-and-mysql-load-balancer-book.jpg](img/00005.jpeg)\n\n# 扩展\n\n## Web\
  \ 服务器\n\n要添加另一个 Web 服务器，我们需要安装 `apache`，将其配置为 `Gluster` 客户端，并更新负载均衡器配置。\n\n安装 `apache`，配置其监听\
  \ 8080 端口，并添加你网站的配置。\n\n```bash\nvagrant@server03:~$ sudo apt-get install -y apache2\
  \ php5 php5-mysql\n```\n\n这里是 `/etc/apache2/ports.conf` 的内容。\n\n```conf\n# 如果你在这里更改了端口或添加了更多端口，你可能也\n\
  # 需要更改 /etc/apache2/sites-enabled/000-default.conf 中的\n# VirtualHost 语句\n\n#Listen\
  \ 80\n\nListen 8080\n\n<IfModule ssl_module>\n               Listen 443\n</IfModule>\n\
  \n<IfModule mod_gnutls.c>\n                Listen 443\n</IfModule>\n```\n\n创建 `/etc/apache2/sites-available/wordpress.conf`\
  \ 内容如下。\n\n```conf\nLogFormat \"%{X-Forwarded-For}i %l %u %t \\\"%r\\\" %>s %b \\\
  \"%{Referer}i\\\" \\\"%{User-Agent}i\\\"\" haproxy_combined\n\n<virtualhost *:8080>\n\
  \  DocumentRoot /var/www/wordpress\n  <Location />\n               Options -Indexes\n\
  \  </Location>\n  ErrorLog ${APACHE_LOG_DIR}/wordpress_error.log\n  LogLevel warn\n\
  \  CustomLog ${APACHE_LOG_DIR}/wordpress_access.log haproxy_combined\n</virtualhost>\n\
  ```\n\n启用此配置并禁用默认配置。此外，让我们为 `Wordpress` 启用 `mod_rewrite`。\n\n```bash\nvagrant@server03:~$\
  \ sudo a2ensite wordpress\nvagrant@server03:~$ sudo a2dissite 000-default\nvagrant@server03:~$\
  \ sudo a2enmod rewrite\nvagrant@server03:~$ sudo service apache2 reload\n```\n\n\
  安装 `gluster` 客户端。\n\n```bash\nvagrant@server03:~$ sudo apt-get install -y glusterfs-client\n\
  ```\n\n将存储服务器条目添加到 `/etc/hosts`。\n\n```bash\nvagrant@server03:~$echo '192.168.12.51\
  \ server01-private' | sudo tee -a /etc/hosts\nvagrant@server03:~$echo '192.168.12.52\
  \ server02-private' | sudo tee -a /etc/hosts\n```\n\n向 `/etc/fstab` 添加一个条目并挂载 `Gluster`\
  \ 卷。注意，对于挂载点指定哪个存储服务器其实并不重要，因为 `Gluster` 原生客户端会直接从该服务器检索卷文件。卷文件包含了存储集群的其他成员，`Gluster`\
  \ 将找到最佳的通信路径。\n\n```bash\nvagrant@server03:~$ echo \"server01-private:/var-www /var/www\
  \ glusterfs defaults,_netdev,fetch-attempts=5 0 0\" | sudo tee -a /etc/fstab\nvagrant@server03:~$\
  \ sudo mv /var/www{,.orig}\nvagrant@server03:~$ sudo mkdir /var/www\nvagrant@server03:~$\
  \ sudo mount /var/www\n```\n\n安装并启用 `haproxy`。我们需要它来代理请求到数据库集群。\n\n```bash\nvagrant@server03:~$\
  \ sudo apt-get install -y haproxy\nvagrant@server03:~$ sudo sed -i.orig 's/ENABLED=.*/ENABLED=1/'\
  \ /etc/default/haproxy\n```\n\n获取现有的 `haproxy` 配置并将此服务器的信息添加到 Web 服务器部分。在负载均衡器和此节点上该配置。如果你使用的是云服务，请遵循你的云提供商的文档。如果你在使用\
  \ `HAProxy`，这是 `/etc/haproxy/haproxy.cfg`文件的内容。\n\n```conf\nglobal\n           \
  \    log 127.0.0.1 local0 notice\n               user haproxy\n               group\
  \ haproxy\ndefaults\n               log             global\n               option\
  \  dontlognull\n               retries 3\n               option  redispatch\n  \
  \             timeout connect  5000\n               timeout client  5000\n     \
  \          timeout server  5000\nfrontend http\n               bind *:80\n     \
  \          mode http\n               option httplog\n               default_backend\
  \ webservers\nbackend webservers\n               mode http\n               stats\
  \ enable\n               stats uri /haproxy/stats\n               stats auth admin:admin\n\
  \               stats hide-version\n               balance roundrobin\n        \
  \       option httpclose\n               option forwardfor\n               cookie\
  \ SRVNAME insert\n               server server01 192.168.12.51:8080 cookie server01\n\
  \               server server02 192.168.12.52:8080 cookie server02\n           \
  \    server server03 192.168.12.53:8080 cookie server03\nfrontend sql\n        \
  \       bind *:3306\n               mode tcp\n               option tcplog\n   \
  \            default_backend dbservers\nbackend dbservers\n               balance\
  \ leastconn\n               option httpchk\n               server db01 192.168.12.61:3306\
  \ check port 9200 inter 12000 rise 3 3\n               server db02 192.168.12.62:3306\
  \ check port 9200 inter 12000 rise 3 3 backup\n               server db03 192.168.12.63:3306\
  \ check port 9200 inter 12000 rise 3 3 backup\n```\n\n在每个节点上重载 `HAProxy` 配置。（如果你正在使用外部负载均衡器，则在新节点上重启\
  \ `HAProxy`。）\n\n```bash\nvagrant@server01:~$ sudo service haproxy reload\nvagrant@server02:~$\
  \ sudo service haproxy reload\nvagrant@server03:~$ sudo service haproxy reload\n\
  ```\n\n## 数据库服务器\n\n记住，你的数据库集群需要奇数的法定人数投票。这意味着数据库节点的总数需要是奇数，或者你需要使用 `Galera` 仲裁器\
  \ `garbd`。在许多情况下，对数据库进行垂直扩展可能更有意义。关掉一个节点，增加其资源，然后重新启动让它重新加入集群。\n\n要向数据库层添加另一个节点，安装\
  \ `Percona XtraDB Cluster`，创建 `my.cnf` 文件并启动数据库。就这么简单。还要记住将此新节点添加到你的负载均衡器中，无论是 `HAProxy`\
  \ 还是你云提供商的解决方案。\n\n```bash\nvagrant@db04:~$ sudo apt-get install -y percona-xtradb-cluster-server\
  \ percona-xtradb-cluster-galera-2.x\nvagrant@db04:~$ sudo service mysql stop\n```\n\
  \n`/etc/mysql/my.cnf` 内容在所有节点上几乎相同。唯一的区别是 `wsrep_node_address` 的值。它应该被设置为节点的私有 IP。将此节点的私有\
  \ IP 添加到所有数据库节点的 `wsrep_cluster_address` 行中。这里是 `db04` 的 `my.cnf`。\n\n```ini\n[mysqld]\n\
  datadir=/var/lib/mysql\nuser=mysql\n### Galera 库路径。\nwsrep_provider=/usr/lib/libgalera_smm.so\n\
  ### 集群连接 URL 包含所有节点的私有 IP。\nwsrep_cluster_address=gcomm://192.168.12.61,192.168.12.62,192.168.12.63,192.168.12.64\n\
  ### 为了让 Galera 正常工作，binlog 格式应为 ROW。\nbinlog_format=ROW\n### MyISAM 存储引擎仅有实验支持\n\
  default_storage_engine=InnoDB\n### 这更改了 InnoDB 自增锁的管理方式，是 Galera 的要求。\ninnodb_autoinc_lock_mode=2\n\
  ### SST 方法\nwsrep_sst_method=xtrabackup\n### 集群名称\nwsrep_cluster_name=my_lamp_cluster\n\
  ### SST 方法的身份验证\nwsrep_sst_auth=\"sstuser:sstuser\"\n## db04 私有 IP 地址\nwsrep_node_address=192.168.12.64\n\
  ```\n\n\n\n\n\n在新节点上启动数据库进程。\n\n```\nvagrant@db04:/etc/mysql$ sudo service mysql\
  \ start\n```\n\n确保节点已加入集群。集群规模应该增加一倍。\n\n```bash\nvagrant@db04:/etc/mysql$ sudo\
  \ mysql -e \"show status like 'wsrep_cluster_size';\"\n```\n\n通过向 `/etc/services`\
  \ 添加一行并安装 `xinetd` 来设置 `clustercheck` 实用。\n\n```bash\nvagrant@db04:~$ echo 'mysqlchk\
  \ 9200/tcp # mysqlchk' | sudo tee -a /etc/services\nvagrant@db04:~$ sudo apt-get\
  \ install -y xinetd\n```\n\n在每个 Web 服务器节点上，将此新数据库添加到数据库后端。以下是放入 `/etc/haproxy/haproxy.cfg`\
  \ 的数据库部分 HAProxy 配置。\n\n```text\nfrontend sql\n             bind *:3306\n      \
  \       mode tcp\n             option tcplog\n             default_backend dbservers\n\
  backend dbservers\n             balance leastconn\n             option httpchk\n\
  \             server db01 192.168.12.61:3306 check port 9200 inter 12000 rise 3\
  \ fall 3\n             server db02 192.168.12.62:3306 check port 9200 inter 12000\
  \ rise 3 fall 3 backup\n             server db03 192.168.12.63:3306 check port 9200\
  \ inter 12000 rise 3 fall 3 backup\n  server db04 192.168.12.64:3306 check port\
  \ 9200 inter 12000 rise 3 fall 3 backup\n```\n\n记得在更改 HAProxy 配置后重新加载它。\n\n```bash\n\
  vagrant@server01:~$ sudo service haproxy reload\nvagrant@server02:~$ sudo service\
  \ haproxy reload\nvagrant@serverNN:~$ sudo service haproxy reload\n```\n\n## 存储\n\
  \n扩展 Gluster 集群的一种方法是增加现有 `var-www` 卷的可用空间。要要此操作，请创建新的砖（bricks）并将其添加到卷中。由于卷中的数据是复制的（`replica\
  \ = 2`），您需要每次添加两个砖。首先，为每个存储节点提供一个新磁盘作为砖。接下来，使用以下命令在这些磁盘上创建文件系统。\n\n```bash\nvagrant@server01:~$\
  \ sudo mkfs.xfs -i size=512 -f /dev/sdc\nvagrant@server02:~$ sudo mkfs.xfs -i size=512\
  \ -f /dev/sdc\n```\n\n为我们的 Gluster 磁盘创建一个挂载点，在 `/etc/fstab` 中添加条目并挂载它。\n\n```bash\n\
  vagrant@server01:~$ echo \"/dev/sdc /data/glusterfs/var-www/brick02 xfs defaults\
  \ 0 0\" | sudo tee -a /etc/fstab\nvagrant@server01:~$ sudo mkdir -p /data/glusterfs/var-www/brick02\n\
  vagrant@server01:~$ sudo mount /data/glusterfs/var-www/brick02\nvagrant@server02:~$\
  \ echo \"/dev/sdc /data/glusterfs/var-www/brick02 xfs defaults 0 0\" | sudo tee\
  \ -a /etc/fstab\nvagrant@server02:~$ sudo mkdir -p /data/glusterfs/var-www/brick02\n\
  vagrant@server02:~$ sudo mount /data/glusterfs/var-www/brick02\n```\n\n最后，将砖添加到我们的现有卷中。您只需要在一个存储节点上运行此命令。添加砖后，您将看到卷的大小增加。执行此操作不需要停机。如果需要更多空间，只需添加更多砖。\n\
  \n```bash\nvagrant@server01:~$ sudo gluster volume add-brick var-www server01-private:/data/glusterfs/var-www/brick02/brick\
  \ server02-private:/data/glusterfs/var-www/brick02/brick\n```\n\n不需要在相同的服务器上添加砖。您可以将存储放在两个专门提供服务的的新节点上，或者在另一对\
  \ Web 服务器节点上安装 Gluster 服务器软件。首先，将存储集群中的每个节点的新节点 IP 信息添加到 `/etc/hosts` 中。`/etc/hosts`\
  \ 文件应包含：\n\n```text\n192.168.12.51 server01-private\n192.168.12.52 server02-private\n\
  192.168.12.53 server03-private\n192.168.12.54 server04-private\n```\n\n在新的存储节点上安装\
  \ Gluster 服务器软件。\n\n```bash\nvagrant@server03:~$ sudo apt-get install -y xfsprogs\n\
  vagrant@server03:~$ sudo apt-get install -y glusterfs-server\nvagrant@server04:~$\
  \ sudo apt-get install -y xfsprogs\nvagrant@server04:~$ sudo apt-get install -y\
  \ glusterfs-server\n```\n\n使用存储集群现有成员的 `gluster peer probe` 命令来增加集群规模。\n\n```bash\n\
  vagrant@server01:~$ sudo gluster peer probe server03-private\nvagrant@server01:~$\
  \ sudo gluster peer probe server04-private\nvagrant@server01:~$ sudo gluster peer\
  \ status\n```\n\n```text\nNumber of Peers: 3\nHostname: server02-private\nUuid:\
  \ 67bd33ae-4db4-476b-a135-b6e806d8bcb9\nState: Peer in Cluster (Connected)\nHostname:\
  \ server03-private\nUuid: c355c874-194a-48d1-be33-c0e83d127d7d\nState: Peer in Cluster\
  \ (Connected)\nHostname: server04-private\nUuid: 0e0bf8df-a107-4df8-8a1e-af274e21cfe8\n\
  State: Peer in Cluster (Connected)\n```\n\n现在您像以前一样在新存储节点上添加砖。以下是如何操作的简要回顾。\n\n\
  ```bash\nvagrant@server03:~$ sudo mkfs.xfs -i size=512 -f /dev/sdc\nvagrant@server03:~$\
  \ echo \"/dev/sdc /data/glusterfs/var-www/brick02 xfs defaults 0 0\" | sudo tee\
  \ -a /etc/fstab\nvagrant@server03:~$ sudo mkdir -p /data/glusterfs/var-www/brick02\n\
  vagrant@server03:~$ sudo mount /data/glusterfs/var-www/brick02\nvagrant@server04:~$\
  \ sudo mkfs.xfs -i size=512 -f /dev/sdc\nvagrant@server04:~$ echo \"/dev/sdc /data/glusterfs/var-www/brick02\
  \ xfs defaults 0 0\" | sudo tee -a /etc/fstab\nvagrant@server04:~$ sudo mkdir -p\
  \ /data/glusterfs/var-www/brick02\nvagrant@server04:~$ sudo mount /data/glusterfs/var-www/brick02\n\
  ```\n\n\n\n\n\n# LAMP 栈的高可用性\n\n- [`www.linuxtrainingacademy.com/ha-lamp-stack/`](http://www.linuxtrainingacademy.com/ha-lamp-stack/)\n\
