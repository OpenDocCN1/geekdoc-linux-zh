    [jason@localbox ~/my-first-test-box]$


    For more information about Vagrant, visit the Vagrant documentation website at
    [https://docs.vagrantup.com](https://docs.vagrantup.com/).


    To download a copy of the Vagrantfiles used in this book visit: [http://www.linuxtrainingacademy.com/ha-lamp](http://www.linuxtrainingacademy.com/ha-lamp)


    # The Design


    Before we start to eliminate single points of failure in a system we need to identify
    all the components that make up that system.  Since our goal is to make the LAMP
    stack highly available we already know that we need to account for Linux, Apache,
    MySQL, and PHP.  However, there are other less obvious components that need to
    be accounted for in the architecture.  Let''s start out by looking at the LAMP
    stack on a single server.


    ## Typical Web Application Residing on a Single Server


    A typical web application request looks like this.  A user types a web address
    or URL into a web browser and hits enter.  The domain name of the website is translated
    into an IP address using DNS resolution.  The browser then connects to that IP
    address and requests a web page.  The connection is received by the web server. 
    If the website is a static website, the web server reads the HTML file off of
    the storage device and sends that data back over the network to the requestor. 
    If the website is a dynamic web site or web application, then the web server will
    do some sort of processing in order to create or build a web page to send back. 
    This processing could include performing computations, requesting data from a
    database, and/or reading data from a disk in order to create the content that
    will be delivered back over the network to the requestor.


    ![lamp-stack-on-a-single-node-01-book.jpg](images/00001.jpeg)


    Let''s say the service we are deploying is a website powered by WordPress and
    a user wants to read our latest blog post.  The user would request the web page
    for the blog post which would cause the web server to execute the WordPress PHP
    code.  That would trigger a query to the database to get the content of the blog
    post as well as any associated comments.  The PHP code would then build an HTML
    document that contained that information and send it to the requestor via the
    web server.  The user''s web browser would parse the response and make additional
    requests to the web server to display the page.  For example, if that blog post
    had a picture of a cat in it, the web browser would request that image causing
    the web server to read the image data from disk and deliver it back over the network
    to the web browser.


    ![lamp-stack-on-a-single-node-02-book.jpg](images/00002.jpeg)


    If a single server is performing all of this work, it will have an IP address
    that corresponds to the website name.  It will also be running a web server, a
    database server, and storing files on some sort of storage device.  By examining
    how a typical request takes place you can see that we will not only need to eliminate
    the single points of failure for Linux, Apache, MySQL, and PHP, but we will also
    need to eliminate single points of failure for storage and networking.


    But before we get into how to do that, let''s look at availability and scalability.


    ## Scaling VS Availability


    ### Vertical Scaling


    You can scale without increasing availability or uptime.  Let''s say you want
    to handle more users, more traffic, and more load for your web application.  If
    it''s a physical server, you could power off the server, install more memory and
    upgrade the CPUs, for instance.  You could also copy all of your data from a single
    small server to a larger server that has more memory, more CPUs, and faster storage. 
    If you''re running a virtual server you could stop the server, allocate more resources
    to it and start it up again.  If your server is running in the cloud you could
    change your instance type to one that has more resources.  This is called vertical
    scaling, or scaling up.  There is nothing wrong with this method of scaling, especially
    if you have an application where downtime is acceptable.


    ### Horizontal Scaling'
