    \ `Vagrantfile` 中的注释以及 `vagrantup.com` 上的文档以获取有关使用 Vagrant 的更多信息。\n\n```bash\n\
    [jason@localbox ~/my-first-test-box]$ vagrant up\nBringing machine 'default' up\
    \ with 'virtualbox' provider...\n==> default: Importing base box 'ubuntu/trusty64'...\n\
