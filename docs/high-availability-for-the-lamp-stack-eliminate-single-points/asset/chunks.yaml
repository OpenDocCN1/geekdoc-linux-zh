  trans: "\n另一种扩展方法是添加更多服务器，你有时会听到人们称之为节点（nodes）。这被称为水平扩展（horizontal scaling）或向外扩展（scaling\
    \ out）。为了进行水平扩展，你需要做一些准备工作并进行设计。例如，为了从一台 Web 服务器扩展到两台，你需要一种方法将流量路由到额外的节点，并且最好将负载分布在两台服务器之间。如果你需要更多资源，可以添加第三台或第四台服务器。当你只有一台服务器且它宕机时，会导致服务中断；但如果你有几台执行相同功能的服务器，且其中一台宕机，最坏的情况是服务降级，性能无法达到通常水平。理想的情况是单点故障几乎无法被察觉。\n\
    \n## 兼得有者\n\n在许多情况下，对 Web 服务器进行水平扩展，同时对数据库服务器进行垂直扩展是有意义的。接下来，我们将介绍如何兼得两者的优势，同时消除或至少大幅减少服务的停机时间。\n\
    \n## 高可用架构\n\n此图显示了部署在五台服务器上的架构。三台服务器将作为数据库集群，另外两台服务器将运行剩余的服务。在单个节点上运行多个服务有时被称为“堆叠”（pancaking）。我们首先在两个节点上部署多个服务，然后讨论如何拆分这些服务、跨越不同数量的服务器运行以及如何扩展。\n\
    \n![ha-design-book.jpg](img/00003.jpeg)\n\n### 构建服务器 (Vagrant 配置)\n\n要创建本地测试环境并部署此架构的服务器，请使用以下\
    \ `Vagrantfile`。记住为此 `Vagrantfile` 专门创建一个目录，并在该目录内运行相关的 `vagrant` 命令。\n\n要下载这些以及书中贯穿使用的其他配置文件，请访问：[`www.linuxtrainingacademy.com/ha-lamp`](http://www.linuxtrainingacademy.com/ha-lamp)\n\
    \n此配置创建了以下虚拟机：\n\n| 服务器名称 | 公网 IP | 私有 IP |\n| :--- | :--- | :--- |\n| server01\
    \ | 10.11.12.51 | 192.168.12.51 |\n| server02 | 10.11.12.52 | 192.168.12.52 |\n\
    | db01 | 10.11.12.61 | 192.168.12.61 |\n| db02 | 10.11.12.62 | 192.168.12.62 |\n\
    | db03 | 10.11.12.63 | 192.168.12.63 |\n\n```ruby\nVAGRANTFILE_API_VERSION = \"\
    2\"\n\nVagrant.configure(VAGRANTFILE_API_VERSION) do |config|\n  config.vm.define\
    \ \"server01\" do |server01|\n    server01.vm.box = \"ubuntu/trusty64\"\n    server01.vm.hostname\
    \ = \"server01\"\n    server01.vm.network :private_network, ip: \"10.11.12.51\"\
    \n    server01.vm.network :private_network, ip: \"192.168.12.51\", virtualbox__intnet:\
    \ true\n  end\n  config.vm.define \"server02\" do |server02|\n    server02.vm.box\
    \ = \"ubuntu/trusty64\"\n    server02.vm.hostname = \"server02\"\n    server02.vm.network\
    \ :private_network, ip: \"10.11.12.52\"\n    server02.vm.network :private_network,\
    \ ip: \"192.168.12.52\", virtualbox__intnet: true\n  end\n  config.vm.define \"\
    db01\" do |db01|\n    db01.vm.box = \"ubuntu/trusty64\"\n    db01.vm.hostname\
    \ = \"db01\"\n    db01.vm.network :private_network, ip: \"10.11.12.61\"\n    db01.vm.network\
    \ :private_network, ip: \"192.168.12.61\", virtualbox__intnet: true\n  end\n \
    \ config.vm.define \"db02\" do |db02|\n    db02.vm.box = \"ubuntu/trusty64\"\n\
    \    db02.vm.hostname = \"db02\"\n    db02.vm.network :private_network, ip: \"\
    10.11.12.62\"\n    db02.vm.network :private_network, ip: \"192.168.12.62\", virtualbox__intnet:\
    \ true\n  end\n  config.vm.define \"db03\" do |db03|\n    db03.vm.box = \"ubuntu/trusty64\"\
    \n    db03.vm.hostname = \"db03\"\n    db03.vm.network :private_network, ip: \"\
    10.11.12.63\"\n    db03.vm.network :private_network, ip: \"192.168.12.63\", virtualbox__intnet:\
    \ true\n  end\nend\n```\n"
- fmt: "\nLet's start the service on each of the nodes and check to see if the VIP\
    \ is assigned to `server01` like we expect.\n\n```bash\nvagrant@server01:~$ sudo\
    \ service keepalived start\n```\n\n```bash\nvagrant@server02:~$ sudo service keepalived\
    \ start\n```\n\nAt this point you should be able to ping the VIP, or floating\
    \ IP, and it should be assigned to the primary server.\n\n```bash\nvagrant@server01:~$\
    \ ip addr show eth1\n3: eth1: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc\
    \ pfifo_fast state UP group default qlen 1000\n              link/ether 08:00:27:b8:c7:c9\
    \ brd ff:ff:ff:ff:ff:ff\n              inet 10.11.12.51/24 brd 10.11.12.255 scope\
    \ global eth1\n                   valid_lft forever preferred_lft forever\n  \
    \            inet 10.11.12.50/32 scope global eth1:vip1\n                   valid_lft\
    \ forever preferred_lft forever\n              inet6 fe80::a00:27ff:feb8:c7c9/64\
    \ scope link\n                   valid_lft forever preferred_lft forever\n```\n\
    \nYou can verify connectivity to the VIP by pinging it from your workstation.\n\
    \n```bash\n[jason@localbox]$ ping -c 3 10.11.12.50\nPING 10.11.12.50 (10.11.12.50)\
    \ 56(84) bytes of data.\n64 bytes from 10.11.12.50: icmp_seq=1 ttl=64 time=0.305\
    \ ms\n64 bytes from 10.11.12.50: icmp_seq=2 ttl=64 time=0.380 ms\n64 bytes from\
    \ 10.11.12.50: icmp_seq=3 ttl=64 time=0.427 ms\n--- 10.11.12.50 ping statistics\
    \ ---\n3 packets transmitted, 3 received, 0% packet loss, time 2000ms\nrtt min/avg/max/mdev\
    \ = 0.305/0.370/0.427/0.054 ms\n```\n\nNote, the `ping` command will look like\
    \ the following on a Windows machine: `ping 10.11.12.50`.\n\nTo ensure that the\
    \ failover is working properly we can simulate a failure on the primary server\
    \ by downing (stopping) the network interface the VIP is associated with. You\
    \ can start a ping to the VIP in another terminal or window while you simulate\
    \ the failure if you'd like.\n\n```bash\n[jason@localbox]$ ping 10.11.12.50\n\
    PING 10.11.12.50 (10.11.12.50) 56(84) bytes of data.\n64 bytes from 10.11.12.50:\
    \ icmp_seq=1 ttl=64 time=0.305 ms\n...\n```\n\n```bash\n$ vagrant ssh server01\n\
    vagrant@server01:~$ ip link set eth1 down\n```\n\nOn `server01` you will see something\
    \ like this in `/var/log/syslog`:\n\n```\nDec  4 04:57:58 server01 Keepalived_vrrp[2227]:\
    \ Kernel is reporting: interface eth1 DOWN\nDec  4 04:57:58 server01 Keepalived_vrrp[2227]:\
    \ VRRP_Instance(VI_1) Entering FAULT STATE\nDec  4 04:57:58 server01 Keepalived_vrrp[2227]:\
    \ VRRP_Instance(VI_1) Now in FAULT state\n```\n\nOn `server02` you will see something\
    \ like this in `/var/log/syslog`:\n\n```\nDec  4 05:00:02 vagrant-ubuntu-trusty-64\
    \ Keepalived_vrrp[4071]: VRRP_Instance(VI_1) Transition to MASTER STATE\nDec \
    \ 4 05:00:03 vagrant-ubuntu-trusty-64 Keepalived_vrrp[4071]: VRRP_Instance(VI_1)\
    \ Entering MASTER STATE\n```\n\nIf you have a `ping` command running in the background\
    \ it still should be responding to pings. You could also start a new ping to ensure\
    \ the VIP is reachable.\n\n```bash\n[jason@localbox]$ ping -c 3 10.11.12.50\n\
    PING 10.11.12.50 (10.11.12.50) 56(84) bytes of data.\n64 bytes from 10.11.12.50:\
    \ icmp_seq=1 ttl=64 time=0.305 ms\n64 bytes from 10.11.12.50: icmp_seq=2 ttl=64\
    \ time=0.380 ms\n64 bytes from 10.11.12.50: icmp_seq=3 ttl=64 time=0.427 ms\n\
    --- 10.11.12.50 ping statistics ---\n3 packets transmitted, 3 received, 0% packet\
    \ loss, time 2000ms\nrtt min/avg/max/mdev = 0.305/0.370/0.427/0.054 ms\n```\n\n\
    When you bring the network interface back up on the primary server back it will\
    \ take back the VIP. If you want to prevent this behavior use the `preempt_option`\
    \ in `keepalived.conf`.\n\n```bash\nvagrant@server01:~$ ip link set eth1 up\n\
    ```\n\nOn `server01` you will see something like this in `/var/log/syslog`:\n\n\
    ```\nDec  4 05:01:08 server01 Keepalived_vrrp[2227]: VRRP_Instance(VI_1) prio\
    \ is higher than received advert\nDec  4 05:01:08 server01 Keepalived_vrrp[2227]:\
    \ VRRP_Instance(VI_1) Transition to MASTER STATE\nDec  4 05:01:09 server01 Keepalived_vrrp[2227]:\
    \ VRRP_Instance(VI_1) Entering MASTER STATE\n```\n\nOn `server02` you will see\
    \ something like this in `/var/log/syslog`:\n\n```\nDec  4 05:03:15 vagrant-ubuntu-trusty-64\
    \ Keepalived_vrrp[4071]: VRRP_Instance(VI_1) Received higher prio advert\nDec\
    \  4 05:03:15 vagrant-ubuntu-trusty-64 Keepalived_vrrp[4071]: VRRP_Instance(VI_1)\
    \ Entering BACKUP STATE\n```\n\n### Installing and Configuring a Load Balancer\n\
    \nHAProxy will act as the load balancer. We will install it on the front end nodes\
    \ using the following commands.\n\n```bash\nvagrant@server01:~$ sudo apt-get install\
    \ -y haproxy\nvagrant@server02:~$ sudo apt-get install -y haproxy\n```\n\nUse\
    \ the following configuration in `/etc/haproxy/haproxy.cfg` on both of the front\
    \ end nodes.\n\n```\nglobal\n    log 127.0.0.1 local0 notice\n    user haproxy\n\
    \    group haproxy\n\ndefaults\n    log\n    option default\n    retries 3\n \
    \   timeout connect 5s\n    timeout client 50s\n    timeout server 50s\n\nfrontend\
    \ http\n    bind *:80\n    mode http\n    option httog\n    default_backend webservers\n\
    \nbackend webservers\n    mode http\n    stats enable\n    stats uri /haproxy/stats\n\
    \    stats auth admin\n    stats version\n    balance roundrobin\n    option close\n\
    \    option forward insert SRV\n    server01 10.11.12.51:8080 check\n    server02\
    \ 10.11.12.52:8080 check\n    server03 10.11.12.53:8080 check\n```\n*(Note: The\
    \ configuration block in the source was heavily fragmented with whitespace; I\
    \ have cleaned the structure to reflect standard HAProxy syntax logic implied\
    \ by the text content.)*\n\n"
  raw: 'Let''s start the service on each of the nodes and check to see if the VIP
    is assigned to server01 like we expect.


    vagrant@server01:~$ sudo service keepalived start


    vagrant@server02:~$ sudo service keepalived start


    At this point you should be able to ping the VIP, or floating IP, and it should
    be assigned to the primary server.


    vagrant@server01:~$ ip addr show eth1


    3: eth1: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state UP
    group default qlen 1000


                  link/ether 08:00:27:b8:c7:c9 brd ff:ff:ff:ff:ff:ff


                  inet 10.11.12.51/24 brd 10.11.12.255 scope global eth1


                     valid_lft forever preferred_lft forever


                  inet 10.11.12.50/32 scope global eth1:vip1


                     valid_lft forever preferred_lft forever


                  inet6 fe80::a00:27ff:feb8:c7c9/64 scope link


                     valid_lft forever preferred_lft forever


    You can verify connectivity to the VIP by pinging it from your workstation.


    [jason@localbox]$ ping -c 3 10.11.12.50


    PING 10.11.12.50 (10.11.12.50) 56(84) bytes of data.


    64 bytes from 10.11.12.50: icmp_seq=1 ttl=64 time=0.305 ms


    64 bytes from 10.11.12.50: icmp_seq=2 ttl=64 time=0.380 ms


    64 bytes from 10.11.12.50: icmp_seq=3 ttl=64 time=0.427 ms


    --- 10.11.12.50 ping statistics ---


    3 packets transmitted, 3 received, 0% packet loss, time 2000ms


    rtt min/avg/max/mdev = 0.305/0.370/0.427/0.054 ms


    Note, thepingcommand will look like the following on a Windows machine. ping 10.11.12.50


    To ensure that the failover is working properly we can simulate a failure on the
    primary server by downing (stopping) the network interface the VIP is associated
    with.  You can start a ping to the VIP in another terminal or window while you
    simulate the failure if you''d like.


    [jason@localbox]$ ping 10.11.12.50


    PING 10.11.12.50 (10.11.12.50) 56(84) bytes of data.


    64 bytes from 10.11.12.50: icmp_seq=1 ttl=64 time=0.305 ms


    ...


    $ vagrant ssh server01


    vagrant@server01:~$ ip link set eth1 down


    On server01 you will see something like this in/var/log/syslog.


    Dec  4 04:57:58 server01 Keepalived_vrrp[2227]: Kernel is reporting: interface
    eth1 DOWN


    Dec  4 04:57:58 server01 Keepalived_vrrp[2227]: VRRP_Instance(VI_1) Entering FAULT
    STATE


    Dec  4 04:57:58 server01 Keepalived_vrrp[2227]: VRRP_Instance(VI_1) Now in FAULT
    state


    On server02 you will see something like this in/var/log/syslog:


    Dec  4 05:00:02 vagrant-ubuntu-trusty-64 Keepalived_vrrp[4071]: VRRP_Instance(VI_1)
    Transition to MASTER STATE


    Dec  4 05:00:03 vagrant-ubuntu-trusty-64 Keepalived_vrrp[4071]: VRRP_Instance(VI_1)
    Entering MASTER STATE


    If you have a ping command running in the background it still should be responding
    to pings.  You could also start a new ping to ensure the VIP is reachable.


    [jason@localbox]$ ping -c 3 10.11.12.50


    PING 10.11.12.50 (10.11.12.50) 56(84) bytes of data.


    64 bytes from 10.11.12.50: icmp_seq=1 ttl=64 time=0.305 ms


    64 bytes from 10.11.12.50: icmp_seq=2 ttl=64 time=0.380 ms


    64 bytes from 10.11.12.50: icmp_seq=3 ttl=64 time=0.427 ms


    --- 10.11.12.50 ping statistics ---


    3 packets transmitted, 3 received, 0% packet loss, time 2000ms


    rtt min/avg/max/mdev = 0.305/0.370/0.427/0.054 ms


    When you bring the network interface back up on the primary server back it will
    take back the VIP.  If you want to prevent this behavior use thenopreemptoption
    inkeepalived.conf.


    vagrant@server01:~$ ip link set eth1 up


    On server01 you will see something like this in/var/log/syslog:


    Dec  4 05:01:08 server01 Keepalived_vrrp[2227]: VRRP_Instance(VI_1) prio is higher
    than received advert


    Dec  4 05:01:08 server01 Keepalived_vrrp[2227]: VRRP_Instance(VI_1) Transition
    to MASTER STATE


    Dec  4 05:01:09 server01 Keepalived_vrrp[2227]: VRRP_Instance(VI_1) Entering MASTER
    STATE


    On server02 you will see something like this in/var/log/syslog:


    Dec  4 05:03:15 vagrant-ubuntu-trusty-64 Keepalived_vrrp[4071]: VRRP_Instance(VI_1)
    Received higher prio advert


    Dec  4 05:03:15 vagrant-ubuntu-trusty-64 Keepalived_vrrp[4071]: VRRP_Instance(VI_1)
    Entering BACKUP STATE


    ### Installing and Configuring a Load Balancer


    HAProxy will act as the load balancer.  We will install it on the front end nodes
    using the following commands.


    vagrant@server01:~$ sudo apt-get install -y haproxy


    vagrant@server02:~$ sudo apt-get install -y haproxy


    Use the following configuration in/etc/haproxy/haproxy.cfg on both of the front
    end nodes.


    global


                  log 127.0.0.1 local0 notice


                  user haproxy


                  group haproxy


    defaults


                  log               global


                  option  dontlognull


                  retries 3


                  option redispatch


                  timeout connect  5000


                  timeout client  50000


                  timeout server  50000


    frontend http


                  bind *:80


                  mode http


                  option httplog


                  default_backend webservers


    backend webservers


                  mode http


                  stats enable


                  stats uri /haproxy/stats


                  stats auth admin:admin


                  stats hide-version


                  balance roundrobin


                  option httpclose


                  option forwardfor


                  cookie SRVNAME insert


                  server server01 192.168.12.51:8080 check cookie server01


                  server server02 192.168.12.52:8080 check cookie server02


    frontend sql


                  bind *:3306


                  mode tcp


                  option tcplog


                  default_backend dbservers


    backend dbservers


                  balance leastconn


                  option httpchk


                  server db01 192.168.12.61:3306 check port 9200 inter 12000 rise
    3 fall 3


                  server db02 192.168.12.62:3306 check port 9200 inter 12000 rise
    3 fall 3 backup


                  server db03 192.168.12.63:3306 check port 9200 inter 12000 rise
    3 fall 3 backup


    This configuration accepts traffic on the default HTTP port of 80 and proxies
    it to one of the web servers over the private network.  In some cases this will
    be the same node as the VIP is associated with and the HAProxy process handling
    the request.  In other instances, it will not.  It''s important to note that one
    HAProxy instance can handle many backend servers.  If we want to add more web
    servers we can bring them online, add their information into thehaproxy.cfg file,
    and reload HAProxy.


    For the web traffic we are using the round robin balancing algorithm with sticky
    sessions.  If we were just using round robin the first web request would be routed
    to the first web server (server01), the second request routed to the second web
    server (server02), the third request routed to the first web server (server01),
    etc.  This can cause problems for web applications that do not share session information,
    for example.


    Instead of strictly using round robin for each request we use round robin for
    each session. For example, if Jane visits our website she will get routed to server01. 
    HAProxy will set a cookie containing the web server it routed the initial request
    to.  This cookie will be sent back in subsequent requests from Jane, letting HAProxy
    know which server to send her requests to.  Next, John visits our website and
    is routed to server02 since it''s next in the round robin.  The cookie is set
    and John continues to get routed to server02.  The next user will be routed to
    server01, and so on.  Of course, if server01 were to die Jane''s requests would
    be routed to another available server, in this case server02, and the cookie would
    be reassigned.'
