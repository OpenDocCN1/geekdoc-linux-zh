- fmt: "\n`wsrep_sst_auth=\"sstuser:sstuser\"`\n\n# db03 private IP address\n\n`wsrep_node_address=192.168.12.63`\n\
    \n### Bootstrapping the Cluster\n\nNext, we need to bootstrap the cluster. We'll\
    \ do this on `db01`.\n\n```bash\nvagrant@db01:~$ sudo service mysql bootstrap-pxc\n\
    ```\n\nWe need to create a user that will perform the state snapshot transfers\
    \ (`SST`). A `SST` occurs when a node joins, or rejoins, the cluster. This process\
    \ copies the data from one active node in the cluster, called a `donor`, to the\
    \ joining node, called a `joiner`. Here are the commands to create that database\
    \ user.\n\n```bash\nvagrant@db01:~$ sudo mysql -e \"CREATE USER 'sstuser'@'localhost'\
    \ IDENTIFIED BY 'sstuser';\"\nvagrant@db01:~$ sudo mysql -e \"GRANT RELOAD, LOCK\
    \ TABLES, REPLICATION CLIENT ON *.* TO 'sstuser'@'localhost';\"\nvagrant@db01:~$\
    \ sudo mysql -e 'FLUSH PRIVILEGES;'\n```\n\nAt this point the cluster is up with\
    \ a single node. You can check the node count using the following command.\n\n\
    ```bash\nvagrant@db01:~$ sudo mysql -e \"show status like 'wsrep_cluster_size';\"\
    \n```\n```\n+--------------------+-------+\n| Variable_name      | Value |\n+--------------------+-------+\n\
    | wsrep_cluster_size | 1     |\n+--------------------+-------+\n```\n\nNext we\
    \ can bring the other two nodes into the cluster. Let's start MySQL (`Percona\
    \ XtraDB Cluster`) on the remaining nodes.\n\n```bash\nvagrant@db02:~$ sudo service\
    \ mysql start\nvagrant@db03:~$ sudo service mysql start\n```\n\nFrom any node\
    \ you can query the cluster size to see that all three nodes are now members.\n\
    \n```bash\nvagrant@db02:~$ sudo mysql -e \"show status like 'wsrep_cluster_size';\"\
    \n```\n```\n+--------------------+-------+\n| Variable_name      | Value |\n+--------------------+-------+\n\
    | wsrep_cluster_size | 3     |\n+--------------------+-------+\n```\n\n### Configuring\
    \ the Cluster Check Utility\n\nA `clustercheck` utility is included with `Percona\
    \ XtraDB Cluster`. This allows the status of the cluster to be checked using an\
    \ HTTP request on port `9200`. If you look back at the `HAProxy` configuration\
    \ you will see the following.\n\n```text\nbackend dbservers\n               balance\
    \ leastconn\n               option httpchk\n               server db01 192.168.12.61:3306\
    \ check port 9200 inter 12000 rise 3 fall 3\n               server db02 192.168.12.62:3306\
    \ check port 9200 inter 12000 rise 3 fall 3 backup\n               server db03\
    \ 192.168.12.63:3306 check port 9200 inter 12000 rise 3 fall 3 backup\n```\n\n\
    In order to allow requests to be processed by the utility we need to add an entry\
    \ into the `/etc/services` file for it and enable `xinetd`. Perform these actions\
    \ on all nodes in the database cluster.\n\n```bash\nvagrant@db01:~$ echo 'mysqlchk\
    \ 9200/tcp # mysqlchk' | sudo tee -a /etc/services\nvagrant@db01:~$ sudo apt-get\
    \ install -y xinetd\nvagrant@db02:~$ echo 'mysqlchk 9200/tcp # mysqlchk' | sudo\
    \ tee -a /etc/services\nvagrant@db02:~$ sudo apt-get install -y xinetd\nvagrant@db03:~$\
    \ echo 'mysqlchk 9200/tcp # mysqlchk' | sudo tee -a /etc/services\nvagrant@db03:~$\
    \ sudo apt-get install -y xinetd\n```\n\nFinally, let's configure a database user\
    \ so the utility can connect to the cluster and verify its operational status.\
    \ Since this is a cluster you only have to create the user on one of the database\
    \ nodes. Note that the password is `\"clustercheckpassword!\"` but you may need\
    \ to escape the exclamation mark (`\\!`) as in the following example.\n\n```bash\n\
    vagrant@db01:~$ sudo mysql -e \"GRANT PROCESS ON *.* TO 'clustercheckuser'@'localhost'\
    \ IDENTIFIED BY 'clustercheckpassword\\!';\"\nvagrant@db01:~$ sudo mysql -e 'FLUSH\
    \ PRIVILEGES;'\n```\n\nNow the `clustercheck` utility will respond when an HTTP\
    \ request is sent to port `9200`.\n\n```bash\nvagrant@db01:~$ curl localhost:9200\n\
    Percona XtraDB Node is synced.\nvagrant@db01:~$ curl 192.168.12.62:9200\nPercona\
    \ XtraDB Node is synced.\nvagrant@db01:~$ curl 192.168.12.63:9200\nPercona XtraDB\
    \ Node is synced.\nvagrant@server01:~$ curl db01-private:9200\nPercona XtraDB\
    \ Node is synced.\n```\n\nIn the event one of the nodes is not synced, the `clustercheck`\
    \ utility will return `\"not synced.\"`.\n\n```bash\nvagrant@server01:~$ curl\
    \ db02-private:9200\nPercona XtraDB Node is not synced.\n```\n\nIf you look at\
    \ `HAProxy` stats page you should see the database nodes are indeed ready to accept\
    \ traffic.\n\n### Installing and Configuring WordPress\n\nNow that the database\
    \ cluster is configured we can create a user that will be used by our application.\
    \ Run the following commands on one of the database nodes.\n\n```bash\nvagrant@db01:~$\
    \ sudo mysql -e 'CREATE DATABASE wordpress;'\nvagrant@db01:~$ sudo mysql -e 'CREATE\
    \ USER wordpress IDENTIFIED BY \"wordpress\";'\nvagrant@db01:~$ sudo mysql -e\
    \ 'GRANT ALL PRIVILEGES ON wordpress.* TO wordpress';\n```\n\nNext, choose one\
    \ of the web servers to install the application files for WordPress. Remember\
    \ that the storage is shared and synced across our nodes.\n\n```bash\nvagrant@server01:~$\
    \ cd /var/tmp\nvagrant@server01:~$ wget -q https://wordpress.org/latest.tar.gz\n\
    vagrant@server01:~$ tar xf /var/tmp/latest.tar.gz -C /var/www\nvagrant@server01:~$\
    \ chown -R www-data:www-data /var/www/wordpress\nvagrant@server01:~$ cd /var/www/wordpress\n\
    ```\n\nSpecify the database connection in `/var/www/wordpress/wp-config.php`.\
    \ Remember that the local `HAProxy` process is configured to accept traffic and\
    \ proxy it to an available database node. This means you should set the `DB_HOST`\
    \ to `127.0.0.1`.\n\n```bash\nvagrant@server01:~$ cp -p wp-config-sample.php wp-config.php\n\
    vagrant@server01:~$ vi wp-config.php # And set the following:\ndefine('DB_NAME',\
    \ 'wordpress');\ndefine('DB_USER', 'wordpress');\ndefine('DB_PASSWORD', 'wordpress');\n\
    define('DB_HOST', '127.0.0.1');\n```\n\nTo complete the WordPress installation,\
    \ open a web browser to the VIP address (`http://10.11.12.50`). Follow the normal\
    \ process by answering a few questions. If you connect to any of the database\
    \ instances you will now see that database has been populated and our database\
    \ cluster is functioning.\n\n```bash\nvagrant@db01:~$ mysql -e 'show tables;'\
    \ -u wordpress -pwordpress\n```\n```\n+-----------------------+\n| Tables_in_wordpress\
    \  |\n+-----------------------+\n| wp_commentmeta        |\n| wp_comments    \
    \       |\n| wp_links             |\n| wp_options           |\n| wp_postmeta \
    \          |\n| wp_posts             |\n| wp_term_relationships |\n| wp_term_taxonomy\
    \      |\n| wp_terms              |\n| wp_usermeta           |\n| wp_users   \
    \           |\n+-----------------------+\n```\n\nNow let's make sure our file\
    \ system is working as expected. Log into WordPress using the username and password\
    \ you created. Go to the Media Library and upload a picture. I'm going to upload\
    \ `cat-picture.jpg`. If you look on each of your web server nodes you'll find\
    \ that picture on the filesystem.\n\n```bash\nvagrant@server01:~$ find /var/www/wordpress\
    \ -name cat-picture.jpg\n/var/www/wordpress/wp-content/uploads/2014/12/cat-picture.jpg\n\
    \nvagrant@server02:~$ find /var/www/wordpress -name cat-picture.jpg\n/var/www/wordpress/wp-content/uploads/2014/12/cat-picture.jpg\n\
    ```\n\n### Considerations for the Cloud\n\nIf you are going to be deploying this\
    \ architecture in the cloud you will need to offload the work performed by `Keepalived`\
    \ to your cloud provider. Instead of implementing a floating IP solution running\
    \ on your servers you will need to use the cloud provider's load balancing service.\
    \ For Amazon Web Services this is called an `Elastic Load Balancer`. Rackspace\
    \ calls their service `Cloud Load Balancers` while Linode brands their solution\
    \ `NodeBalancers`.\n"
