    a Vagrant environment and creates the Vagrant configuration fileVagrantfile.


    vagrant up- This command creates, configures, and starts the virtual machine defined
    in theVagrantfile.  If the virtual machine already exists, it simply starts it.


    vagrant halt - Stops a virtual machine.


    vagrant destroy - Deletes the virtual machine.


    vagrant ssh - Connects to the virtual machine via SSH.


    In the following example I am going to create a directory, or folder, for my Vagrant
    project.  Next I am going to initialize that project, configure a virtual machine,
    launch it, and finally connect to it.


    The following commands will create a virtual machine that runs Ubuntu 14.04. 


    Note that the first time you run these series of commands an image of the Ubuntu
    operating system will be downloaded from the Internet.  This can take several
    minutes to complete.  On subsequent runs this process is much quicker as the image
    used to create the virtual machines will already be stored on your system.


    Summary:


    vagrant init ubuntu/trusty64


    vagrant up


    vagrant ssh


    Example:


    [jason@localbox ~]$ mkdir my-first-test-box


    [jason@localbox ~]$ cd my-first-test-box


    [jason@localbox ~/my-first-test-box]$ vagrant init ubuntu/trusty64


