    # Installing and Configuring Highly Available Storage


    If your web application only contains static files and no data is written to disk
    you can populate the file system on each web server with the exact same contents.
    However, in the case of WordPress it uses the file system to store uploaded media,
    plugins, and themes. You don''t want to create a blog post featuring your favorite
    picture of your cat only to get stored on the web server you were connected to
    at the time you created the post. If this were to happen some of the website visitors
    would get to see your lovely cat while others would not. An ever worse scenario
    would be that you installed a plugin and your website would only function for
    the users that got routed to the web server with that plugin on the file system.


    To get around these problems we need to ensure the contents of the file system
    for the web application and its data are synced across all the web server nodes.
    We also need to implement a solution that eliminates single points of failure.
    `GlusterFS` is a distributed file system that is scalable, redundant, and easy
    to manage. Also, it''s fairly easy to add additional storage on the fly so you
    don''t have to worry about running out of space or taking downtime.


    ## Storage Preparation


    First, let''s prepare some storage to be used by `Gluster`. In this example we
    are going to be using disks presented to our servers specifically for `Gluster`
    data storage. By default `Gluster` will not allow you to store data on the same
    disk as the operating system, but this can be overridden if you want.


    To attach a new disk to your VirtualBox virtual machine, first power off the machine.
    Go to the settings for the virtual machine and navigate to the storage section.
    Click the "Add Hard Disk" button. Choose, "Create a new disk." Fill out the fields
    to create the disk. When you power on the virtual machine the newly created disk
    will be available to Linux.


    `Gluster` recommends using `XFS` for the file system of the disks it will use.
    So, let''s install support for that.


    ```bash

    vagrant@server01:~$ sudo apt-get install -y xfsprogs

    vagrant@server02:~$ sudo apt-get install -y xfsprogs

    ```


    Next we''ll need to create an `XFS` file system on the disk we will be using for
    `Gluster` data. Since `Gluster` relies heavily on extended attributes we need
    to increase the inode size to `512`. In this example the operating system is installed
    on `/dev/sda` and `/dev/sdb` is available to be used.


    ```bash

    vagrant@server01:~$ sudo mkfs.xfs -i size=512 -f /dev/sdb

    vagrant@server02:~$ sudo mkfs.xfs -i size=512 -f /dev/sdb

    ```


    Let''s create a mount point for our `Gluster` disk, add an entry for it in `/etc/fstab`,
    and mount it.


    ```bash

    vagrant@server01:~$ echo "/dev/sdb /data/glusterfs/var-www/brick01 xfs defaults
    0 0" | sudo tee -a /etc/fstab

    vagrant@server01:~$ sudo mkdir -p /data/glusterfs/var-www/brick01

    vagrant@server01:~$ sudo mount /data/glusterfs/var-www/brick01

    vagrant@server02:~$ echo "/dev/sdb /data/glusterfs/var-www/brick02 xfs defaults
    0 0" | sudo tee -a /etc/fstab

    vagrant@server02:~$ sudo mkdir -p /data/glusterfs/var-www/brick02

    vagrant@server02:~$ sudo mount /data/glusterfs/var-www/brick02

    ```


    You''ll notice that I used `"var-www"` in the path. That will be the name of our
    `Gluster` volume. We will mount the gluster volume on each of our web servers.
    You''ll also notice that I used the word `"brick"` in the path. `Gluster` calls
    the file systems it uses for storage bricks. Volumes are made up of one or more
    bricks. If you want to increase the amount of available space in a volume simply
    add more bricks.


    ## Cluster Configuration


    Before we create our `Gluster` cluster, let''s configure the `/etc/hosts` file
    of each of our nodes so we can communicate with them by name. This is optional,
    but for me it can be easier to remember `server01-private` than it is to remember
    `192.168.12.51`. Append the following to the `/etc/hosts` file.


    ```text

    # Floating IP

    10.11.12.50 vip


    # Public Addresses

    10.11.12.51 server01

    10.11.12.52 server02

    10.11.12.61 db01

    10.11.12.62 db02

    10.11.12.63 db03


    # Private Addresses

    192.168.12.51 server01-private

    192.168.12.52 server02-private

    192.168.12.61 db01-private

    192.168.12.62 db02-private

    192.168.12.63 db03-private

    ```


    Let''s install the `Gluster` server software on both of our front end nodes.


    ```bash

    vagrant@server01:~$ sudo apt-get install -y glusterfs-server

    vagrant@server01:~$ sudo apt-get install -y glusterfs-server

    ```


    To create a `Gluster` cluster simply peer with the other server or servers you
    want to be in your cluster. You''ll only need to run the `gluster peer probe`
    command from one of your servers. To check the status of your cluster use the
    `gluster peer status` command. When you run that command it will tell you about
    the other peer(s) in the cluster.


    ```bash

    vagrant@server01:~$ sudo gluster peer probe server02-private

    vagrant@server01:~$ sudo gluster peer status

    Number of Peers: 1

    Hostname: server02-private

    Uuid: 17d644e3-2b2c-4509-987d-9793b46a4a60

    State: Peer in Cluster (Connected)


    vagrant@server02:~$ sudo gluster peer status

    Number of Peers: 1

    Hostname: server01-private

    Port: 24007

    Uuid: 032d946d-e131-455e-a53a-bbc30bc4a3e3

    State: Peer in Cluster (Connected)

    ```


    ## Volume Creation


    Now that we have a cluster and some bricks, we can create a volume. We want to
    be able to survive a single failure, so we''ll need two copies of our data. We
    do that by creating a replicated volume and telling `Gluster` what bricks we want
    to use for that volume. We''ll use one brick on `server01` and another brick on
    `server02`. You can use two different bricks attached to the same server, but
    this would not protect us from an entire server going down. If you attempt to
    do that `Gluster` reminds of you this fact and gives you the option to proceed
    or cancel.


    When you create a volume on one of the nodes in the `Gluster` cluster the other
    nodes will become aware of it as well, so you only need to run this command once.


    ```bash

    vagrant@server01:~$ sudo gluster volume create var-www replica 2 transport tcp
    server01-private:/data/glusterfs/var-www/brick01/brick server02-private:/data/glusterfs/var-www/brick02/brick

    ```


    You might have noticed that I used a subdirectory of `brick` within each file
    system. This will cause the brick to fail if the file system is not mounted. We
    would rather correctly mark the brick as unavailable instead of possibly writing
    data to the root volume of the operating system.


    After the volume is created you can start it with the following command.


    ```bash

    vagrant@server01:~$ sudo gluster volume start var-www

    ```


    You can check the configuration by running this command.


    ```bash

    vagrant@server01:~$ sudo gluster volume info

    Volume Name: var-www

    Type: Replicate

    Volume ID: d4817936-695c-49ca-88a5-78527ddec8fc

    Status: Started

    Number of Bricks: 1 x 2 = 2

    Transport-type: tcp

    Bricks:

    Brick1: server01-private:/data/glusterfs/var-www/brick01/brick

    Brick2: server02-private:/data/glusterfs/var-www/brick02/brick

    ```


    We want to mount the volume at boot time, so we''ll need to add an entry into
    the `/etc/fstab` file on each of the front end nodes. For `server01`, use this
    entry:


    `server01-private:/var-www /var/www glusterfs defaults,_netdev,fetch-attempts=5
    0 0`


    On `server02`, use this entry:


    `server02-private:/var-www /var/www glusterfs defaults,_netdev,fetch-attempts=5
    0 0`

