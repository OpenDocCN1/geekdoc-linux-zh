- fmt: '

    Note that even though we specified the host itself in the `/etc/fstab`, Gluster
    knows about all the members of the cluster that have the data for that volume.
    Gluster stores this data on the client in something called a volume file. In this
    configuration our Gluster servers are also Gluster clients, but this doesn''t
    have to be the case and it still works in the same manner. If the disk used to
    host the brick on `server01` fails, `server01` will seamless get its data for
    `/var/www` from `server02` since it knows it is part of the cluster and has the
    data. The `fetch-attempts=5` option tells Gluster to repeatedly attempt to fetch
    the volume file(s). It is typically used when there are multiple IP addresses
    on a server as in our example. Also, `_netdev` signals that networking needs to
    be started before the file system mount is even attempted.


    Before we start using our Gluster volume, let''s stop Apache and move the original
    `/var/www` directory out of the way. If we don''t, we will mount over the existing
    data. You could also remove the contents of this directory or even copy the contents
    to the volume if you wanted to preserve the data. We''ll run these commands on
    both of the nodes.


    ```

    vagrant@server01:~$ sudo service apache2 stop

    vagrant@server01:~$ sudo mv /var/www{,.orig}

    vagrant@server01:~$ sudo mkdir /var/www

    vagrant@server01:~$ sudo mount /var/www

    vagrant@server01:~$ sudo service apache2 start


    vagrant@server02:~$ sudo service apache2 stop

    vagrant@server02:~$ sudo mv /var/www{,.orig}

    vagrant@server02:~$ sudo mkdir /var/www

    vagrant@server02:~$ sudo mount /var/www

    vagrant@server02:~$ sudo service apache2 start

    ```


    Now the contents of `/var/www` will be the same on each of the servers. We can
    quickly test this by creating a file from each of the servers and checking for
    their existence.


    ```

    vagrant@server01:~$ sudo touch /var/www/from-server01

    vagrant@server02:~$ sudo touch /var/www/from-server02

    vagrant@server01:~$ ls -l /var/www

    total 0

    -rw-r--r-- 1 root root 0 Dec  6 22:56 from-server01

    -rw-r--r-- 1 root root 0 Dec  6 22:56 from-server02

    ```


    ### Installing and Configuring the Database


    We are going to use Percona XtraDB Cluster to provide the high availability for
    the database layer. It''s based on Percona Server which is a drop-in replacement
    for MySQL that provides better performance than MySQL. Percona XtraDB Cluster
    also incorporates Percona XtraBackup which allows for non-blocking backups of
    your databases. Finally, Galera is used to provide the multimaster (active/active)
    clustering capabilities.


    In most MySQL high availability designs there will be a master server and one
    or more slaves. Scalability is achieved by adding more slaves, but those slaves
    are read only copies. Only the master server can accept and process write requests.
    This means that your web application needs to send database reads to one location
    and database writes to another. If you''re using a custom written application
    you''ll have to do this yourself. Some existing web applications already provide
    this functionality so it''s not an issue. For example, to do this with WordPress
    you would install and configure the HyperDB plugin. In any case, using Percona
    XtraDB Cluster avoids this complication altogether.


    We are going to use three nodes for the database cluster so it can determine a
    quorum. If a node in the cluster cannot be reached it means that the node failed
    or it''s still functioning but there is a network connectivity issue. If you were
    to have a two node cluster and had a network connectivity failure between those
    nodes, but network connectivity to the clients was still in place and they both
    committed updates you would end up with diverged data sets. One node would have
    some data and the other node would have other data. This is called split brain.


    Percona XtraDB Cluster guards you against split brain and network partitioning
    events. If it cannot determine a majority then no nodes in the cluster will process
    requests. That''s better than split brain, but it''s effectively a single point
    of failure. Remember this when you want to horizontally scale your database cluster.
    Always use an odd number of nodes. There is another option, however. You can use
    `garbd`, the Galera Arbitrator, to act as a lightweight member of the cluster.
    It does not process database requests, but it can act as a tie breaker during
    a network partitioning event. If you use `garbd` do not run it on one of the database
    nodes, place it on another server. A good place to run it is on one of the servers
    that is acting as a load balancer.


    To install Percona XtraDB Cluster run the following commands on each of the database
    nodes. You will be asked to specify a password for the MySQL `root` user during
    installation. After we install the software, let''s ensure it''s before we update
    the default configuration and setup the cluster.


    ```

    vagrant@db01:~$ sudo apt-get install -y percona-xtradb-cluster-server percona-xtradb-cluster-galera-2.x

    vagrant@db01:~$ sudo service mysql stop

    vagrant@db02:~$ sudo apt-get install -y percona-xtradb-cluster-server percona-xtradb-cluster-galera-2.x

    vagrant@db02:~$ sudo service mysql stop

    vagrant@db03:~$ sudo apt-get install -y percona-xtradb-cluster-server percona-xtradb-cluster-galera-2.x

    vagrant@db03:~$ sudo service mysql stop

    ```


    The contents of `/etc/mysql/my.cnf` will be almost identical on all of the nodes.
    The only difference will be the value of `wsrep_node_address`. It should be set
    to the private IP of the node. Remember, you can download these configuration
    files from [http://www.linuxtrainingacademy.com/ha-lamp](http://www.linuxtrainingacademy.com/ha-lamp).
    Here is the `my.cnf` for `db01`.


    ```ini

    [mysqld]

    datadir=/var/lib/mysql

    user=mysql

    # Path to the Galera library.

    wsrep_provider=/usr/lib/libgalera_smm.so

    # Cluster connection URL contains the private IPs all nodes.

    wsrep_cluster_address=gcomm://192.168.12.61,192.168.12.62,192.168.12.63

    # In order for Galera to work correctly binlog format should be ROW.

    binlog_format=ROW

    # MyISAM storage engine has only experimental support

    default_storage_engine=InnoDB

    # This changes how InnoDB autoincrement locks are managed and is a requirement
    for Galera

    innodb_autoinc_lock_mode=2

    # SST method

    wsrep_sst_method=xtrabackup

    # Cluster name

    wsrep_cluster_name=my_lamp_cluster

    # Authentication for SST method

    wsrep_sst_auth="sstuser:sstuser"

    # db01 private IP address

    wsrep_node_address=192.168.12.61

    ```


    Here is the `my.cnf` file for `db02`.


    ```ini

    [mysqld]

    datadir=/var/lib/mysql

    user=mysql

    # Path to the Galera library.

    wsrep_provider=/usr/lib/libgalera_smm.so

    # Cluster connection URL contains the private IPs of all nodes.

    wsrep_cluster_address=gcomm://192.168.12.61,192.168.12.62,192.168.12.63

    # In order for Galera to work correctly the binlog format should be ROW.

    binlog_format=ROW

    # MyISAM storage engine has only experimental support

    default_storage_engine=InnoDB

    # This changes how InnoDB autoincrement locks are managed and is a requirement
    for Galera

    innodb_autoinc_lock_mode=2

    # SST method

    wsrep_sst_method=xtrabackup

    # Cluster name

    wsrep_cluster_name=my_lamp_cluster

    # Authentication for SST method

    wsrep_sst_auth="sstuser:sstuser"

    # db02 private IP address

    wsrep_node_address=192.168.12.62

    ```


    Here is the `my.cnf` file for `db03`.


    ```ini

    [mysqld]

    datadir=/var/lib/mysql

    user=mysql

    # Path to the Galera library.

    wsrep_provider=/usr/lib/libgalera_smm.so

    # Cluster connection URL contains the private IPs of all nodes.

    wsrep_cluster_address=gcomm://192.168.12.61,192.168.12.62,192.168.12.63

    # In order for Galera to work correctly the binlog format should be ROW.

    binlog_format=ROW

    # MyISAM storage engine has only experimental support

    default_storage_engine=InnoDB

    # This changes how InnoDB autoincrement locks are managed and is a requirement
    for Galera

    innodb_autoinc_lock_mode=2

    # SST method

    wsrep_sst_method=xtrabackup

    # Cluster name

    wsrep_cluster_name=my_lamp_cluster

    # Authentication for SST method

    wsrep_sst_auth="sstuser:sstuser"

    ```

