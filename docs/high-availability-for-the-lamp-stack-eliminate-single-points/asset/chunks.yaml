  trans: "\n\n在新节点上启动数据库进程。\n\n```\nvagrant@db04:/etc/mysql$ sudo service mysql start\n\
    ```\n\n确保节点已加入集群。集群规模应该增加一倍。\n\n```bash\nvagrant@db04:/etc/mysql$ sudo mysql -e\
    \ \"show status like 'wsrep_cluster_size';\"\n```\n\n通过向 `/etc/services` 添加一行并安装\
    \ `xinetd` 来设置 `clustercheck` 实用。\n\n```bash\nvagrant@db04:~$ echo 'mysqlchk 9200/tcp\
    \ # mysqlchk' | sudo tee -a /etc/services\nvagrant@db04:~$ sudo apt-get install\
    \ -y xinetd\n```\n\n在每个 Web 服务器节点上，将此新数据库添加到数据库后端。以下是放入 `/etc/haproxy/haproxy.cfg`\
    \ 的数据库部分 HAProxy 配置。\n\n```text\nfrontend sql\n             bind *:3306\n    \
    \         mode tcp\n             option tcplog\n             default_backend dbservers\n\
    backend dbservers\n             balance leastconn\n             option httpchk\n\
    \             server db01 192.168.12.61:3306 check port 9200 inter 12000 rise\
    \ 3 fall 3\n             server db02 192.168.12.62:3306 check port 9200 inter\
    \ 12000 rise 3 fall 3 backup\n             server db03 192.168.12.63:3306 check\
    \ port 9200 inter 12000 rise 3 fall 3 backup\n  server db04 192.168.12.64:3306\
    \ check port 9200 inter 12000 rise 3 fall 3 backup\n```\n\n记得在更改 HAProxy 配置后重新加载它。\n\
    \n```bash\nvagrant@server01:~$ sudo service haproxy reload\nvagrant@server02:~$\
    \ sudo service haproxy reload\nvagrant@serverNN:~$ sudo service haproxy reload\n\
    ```\n\n## 存储\n\n扩展 Gluster 集群的一种方法是增加现有 `var-www` 卷的可用空间。要要此操作，请创建新的砖（bricks）并将其添加到卷中。由于卷中的数据是复制的（`replica\
    \ = 2`），您需要每次添加两个砖。首先，为每个存储节点提供一个新磁盘作为砖。接下来，使用以下命令在这些磁盘上创建文件系统。\n\n```bash\nvagrant@server01:~$\
    \ sudo mkfs.xfs -i size=512 -f /dev/sdc\nvagrant@server02:~$ sudo mkfs.xfs -i\
    \ size=512 -f /dev/sdc\n```\n\n为我们的 Gluster 磁盘创建一个挂载点，在 `/etc/fstab` 中添加条目并挂载它。\n\
    \n```bash\nvagrant@server01:~$ echo \"/dev/sdc /data/glusterfs/var-www/brick02\
    \ xfs defaults 0 0\" | sudo tee -a /etc/fstab\nvagrant@server01:~$ sudo mkdir\
    \ -p /data/glusterfs/var-www/brick02\nvagrant@server01:~$ sudo mount /data/glusterfs/var-www/brick02\n\
    vagrant@server02:~$ echo \"/dev/sdc /data/glusterfs/var-www/brick02 xfs defaults\
    \ 0 0\" | sudo tee -a /etc/fstab\nvagrant@server02:~$ sudo mkdir -p /data/glusterfs/var-www/brick02\n\
    vagrant@server02:~$ sudo mount /data/glusterfs/var-www/brick02\n```\n\n最后，将砖添加到我们的现有卷中。您只需要在一个存储节点上运行此命令。添加砖后，您将看到卷的大小增加。执行此操作不需要停机。如果需要更多空间，只需添加更多砖。\n\
    \n```bash\nvagrant@server01:~$ sudo gluster volume add-brick var-www server01-private:/data/glusterfs/var-www/brick02/brick\
    \ server02-private:/data/glusterfs/var-www/brick02/brick\n```\n\n不需要在相同的服务器上添加砖。您可以将存储放在两个专门提供服务的的新节点上，或者在另一对\
    \ Web 服务器节点上安装 Gluster 服务器软件。首先，将存储集群中的每个节点的新节点 IP 信息添加到 `/etc/hosts` 中。`/etc/hosts`\
    \ 文件应包含：\n\n```text\n192.168.12.51 server01-private\n192.168.12.52 server02-private\n\
    192.168.12.53 server03-private\n192.168.12.54 server04-private\n```\n\n在新的存储节点上安装\
    \ Gluster 服务器软件。\n\n```bash\nvagrant@server03:~$ sudo apt-get install -y xfsprogs\n\
    vagrant@server03:~$ sudo apt-get install -y glusterfs-server\nvagrant@server04:~$\
    \ sudo apt-get install -y xfsprogs\nvagrant@server04:~$ sudo apt-get install -y\
    \ glusterfs-server\n```\n\n使用存储集群现有成员的 `gluster peer probe` 命令来增加集群规模。\n\n```bash\n\
    vagrant@server01:~$ sudo gluster peer probe server03-private\nvagrant@server01:~$\
    \ sudo gluster peer probe server04-private\nvagrant@server01:~$ sudo gluster peer\
    \ status\n```\n\n```text\nNumber of Peers: 3\nHostname: server02-private\nUuid:\
    \ 67bd33ae-4db4-476b-a135-b6e806d8bcb9\nState: Peer in Cluster (Connected)\nHostname:\
    \ server03-private\nUuid: c355c874-194a-48d1-be33-c0e83d127d7d\nState: Peer in\
    \ Cluster (Connected)\nHostname: server04-private\nUuid: 0e0bf8df-a107-4df8-8a1e-af274e21cfe8\n\
    State: Peer in Cluster (Connected)\n```\n\n现在您像以前一样在新存储节点上添加砖。以下是如何操作的简要回顾。\n\n\
    ```bash\nvagrant@server03:~$ sudo mkfs.xfs -i size=512 -f /dev/sdc\nvagrant@server03:~$\
    \ echo \"/dev/sdc /data/glusterfs/var-www/brick02 xfs defaults 0 0\" | sudo tee\
    \ -a /etc/fstab\nvagrant@server03:~$ sudo mkdir -p /data/glusterfs/var-www/brick02\n\
    vagrant@server03:~$ sudo mount /data/glusterfs/var-www/brick02\nvagrant@server04:~$\
    \ sudo mkfs.xfs -i size=512 -f /dev/sdc\nvagrant@server04:~$ echo \"/dev/sdc /data/glusterfs/var-www/brick02\
    \ xfs defaults 0 0\" | sudo tee -a /etc/fstab\nvagrant@server04:~$ sudo mkdir\
    \ -p /data/glusterfs/var-www/brick02\nvagrant@server04:~$ sudo mount /data/glusterfs/var-www/brick02\n\
    ```\n\n"
