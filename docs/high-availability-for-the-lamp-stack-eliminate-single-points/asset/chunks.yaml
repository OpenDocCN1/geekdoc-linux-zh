    vagrant@db03:~$ echo ''mysqlchk 9200/tcp # mysqlchk'' | sudo tee -a /etc/services


    vagrant@db03:~$ sudo apt-get install -y xinetd


    Finally, let''s configure a database user so the utility can connect to the cluster
    and verify its operational status.  Since this is a cluster you only have to create
    the user on one of the database nodes.  Note that the password is "clustercheckpassword!"
    but you may need to escape the exclamation mark (\!) as in the following example.


    vagrant@db01:~$ sudo mysql -e "GRANT PROCESS ON *.* TO ''clustercheckuser''@''localhost''
    IDENTIFIED BY ''clustercheckpassword\!'';"


    vagrant@db01:~$ sudo mysql -e ''FLUSH PRIVILEGES;''


    Now theclustercheck utility will respond when an HTTP request is sent to port
    9200.


    vagrant@db01:~$ curl localhost:9200


    Percona XtraDB Cluster Node is synced.


    vagrant@db01:~$ curl 192.168.12.62:9200


    Percona XtraDB Cluster Node is synced.


    vagrant@db01:~$ curl 192.168.12.63:9200


