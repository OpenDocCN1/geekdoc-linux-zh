- fmt: "\nIn any case, all of these cloud load balancers function very similarly.\
    \ When you create a load balancer it will have a IP address associated with it.\
    \ You will use that IP address as the DNS name for your web site. Configure the\
    \ load balancer to accept HTTP traffic on port 80 and forward that traffic to\
    \ port 8080 on each of your web server nodes. This configuration bypasses `HAProxy`\
    \ and talks directly to your web servers. For this reason make sure you have health\
    \ checks enabled on your cloud load balancer. You don't want to route traffic\
    \ to a web server that is down. Also remember that you still need a `HAProxy`\
    \ running on each of your web servers to connect to your backend database servers.\
    \ Here's a diagram of what this solution looks like.\n\n![cloud-http-load-balancer-book.jpg](images/00004.jpeg)\n\
    \nIf you wanted, you could shift the web server to listen on the standard port\
    \ of 80 and remove the `HAProxy` configuration for HTTP traffic. You could also\
    \ eliminate `HAProxy` altogether and create another load balancer to serve database\
    \ traffic. If you do, remember to update your application's configuration to point\
    \ to the load balancer.\n\n![cloud-http-and-mysql-load-balancer-book.jpg](images/00005.jpeg)\n\
    \n# Scaling\n\n## Web Servers\n\nTo add another web server we will need to install\
    \ `apache`, configure it as a `Gluster` client, and update the load balancer configuration.\n\
    \nInstall `apache`, configure it to listen on port 8080, and add the configuration\
    \ for your web site.\n\n```bash\nvagrant@server03:~$ sudo apt-get install -y apache2\
    \ php5 php5-mysql\n```\n\nHere are the contents of `/etc/apache2/ports.conf`.\n\
    \n```conf\n# If you just change the port or add more ports here, you will likely\
    \ also\n# have to change the VirtualHost statement in\n# /etc/apache2/sites-enabled/000-default.conf\n\
    \n#Listen 80\n\nListen 8080\n\n<IfModule ssl_module>\n               Listen 443\n\
    </IfModule>\n\n<IfModule mod_gnutls.c>\n                Listen 443\n</IfModule>\n\
    ```\n\nCreate `/etc/apache2/sites-available/wordpress.conf` with the following\
    \ contents.\n\n```conf\nLogFormat \"%{X-Forwarded-For}i %l %u %t \\\"%r\\\" %>s\
    \ %b \\\"%{Referer}i\\\" \\\"%{User-Agent}i\\\"\" haproxy_combined\n\n<virtualhost\
    \ *:8080>\n  DocumentRoot /var/www/wordpress\n  <Location />\n               Options\
    \ -Indexes\n  </Location>\n  ErrorLog ${APACHE_LOG_DIR}/wordpress_error.log\n\
    \  LogLevel warn\n  CustomLog ${APACHE_LOG_DIR}/wordpress_access.log haproxy_combined\n\
    </virtualhost>\n```\n\nEnable this configuration and disable the default configuration.\
    \ Also let's enable `mod_rewrite` for `Wordpress`.\n\n```bash\nvagrant@server03:~$\
    \ sudo a2ensite wordpress\nvagrant@server03:~$ sudo a2dissite 000-default\nvagrant@server03:~$\
    \ sudo a2enmod rewrite\nvagrant@server03:~$ sudo service apache2 reload\n```\n\
    \nInstall the `gluster` client.\n\n```bash\nvagrant@server03:~$ sudo apt-get install\
    \ -y glusterfs-client\n```\n\nAdd the entries of the storage servers to `/etc/hosts`.\n\
    \n```bash\nvagrant@server03:~$echo '192.168.12.51 server01-private' | sudo tee\
    \ -a /etc/hosts\nvagrant@server03:~$echo '192.168.12.52 server02-private' | sudo\
    \ tee -a /etc/hosts\n```\n\nAdd an entry to `/etc/fstab` and mount the `Gluster`\
    \ volume. Note that it doesn't really matter which storage server you specify\
    \ for the mount point as the `Gluster` native client simply retrieves the volume\
    \ file from that server. The volume file contains the other members of the storage\
    \ cluster and `Gluster` will the best communication path.\n\n```bash\nvagrant@server03:~$\
    \ echo \"server01-private:/var-www /var/www glusterfs defaults,_netdev,fetch-attempts=5\
    \ 0 0\" | sudo tee -a /etc/fstab\nvagrant@server03:~$ sudo mv /var/www{,.orig}\n\
    vagrant@server03:~$ sudo mkdir /var/www\nvagrant@server03:~$ sudo mount /var/www\n\
    ```\n\nInstall and enable `haproxy`. We'll need it to proxy requests to the database\
    \ cluster.\n\n```bash\nvagrant@server03:~$ sudo apt-get install -y haproxy\nvagrant@server03:~$\
    \ sudo sed -i.orig 's/ENABLED=.*/ENABLED=1/' /etc/default/haproxy\n```\n\nTake\
    \ the existing `haproxy` configuration and append this server's information to\
    \ the web server section. Use that configuration on the load balancers and this\
    \ node. If you're using the cloud then follow your cloud providers documentation.\
    \ If you are using `HAProxy`, here is what the `/etc/haproxy/haproxy.cfg` file\
    \ will look like.\n\n```conf\nglobal\n               log 127.0.0.1 local0 notice\n\
    \               user haproxy\n               group haproxy\ndefaults\n       \
    \        log             global\n               option  dontlognull\n        \
    \       retries 3\n               option  redispatch\n               timeout connect\
    \  5000\n               timeout client  5000\n               timeout server  5000\n\
    frontend http\n               bind *:80\n               mode http\n          \
    \     option httplog\n               default_backend webservers\nbackend webservers\n\
    \               mode http\n               stats enable\n               stats uri\
    \ /haproxy/stats\n               stats auth admin:admin\n               stats\
    \ hide-version\n               balance roundrobin\n               option httpclose\n\
    \               option forwardfor\n               cookie SRVNAME insert\n    \
    \           server server01 192.168.12.51:8080 cookie server01\n             \
    \  server server02 192.168.12.52:8080 cookie server02\n               server server03\
    \ 192.168.12.53:8080 cookie server03\nfrontend sql\n               bind *:3306\n\
    \               mode tcp\n               option tcplog\n               default_backend\
    \ dbservers\nbackend dbservers\n               balance leastconn\n           \
    \    option httpchk\n               server db01 192.168.12.61:3306 check port\
    \ 9200 inter 12000 rise 3 3\n               server db02 192.168.12.62:3306 check\
    \ port 9200 inter 12000 rise 3 3 backup\n               server db03 192.168.12.63:3306\
    \ check port 9200 inter 12000 rise 3 3 backup\n```\n\nReload the `HAProxy` configuration\
    \ on each of the nodes. (Or restart `HAProxy` on the new node if you are using\
    \ an external load balancer.)\n\n```bash\nvagrant@server01:~$ sudo service haproxy\
    \ reload\nvagrant@server02:~$ sudo service haproxy reload\nvagrant@server03:~$\
    \ sudo service haproxy reload\n```\n\n## Database Servers\n\nRemember that you\
    \ need an odd number of quorum votes for your database cluster. This means the\
    \ total number of database nodes needs to be an odd number or you need to use\
    \ the `Galera` arbitrator, `garbd`. In many causes it might make more sense to\
    \ scale the databases vertically. Take one node down, increase its resources,\
    \ and bring it back up and let it rejoin the cluster.\n\nTo add another node to\
    \ the database tier install `Percona XtraDB Cluster`, create the `my.cnf` file,\
    \ and start the database. It's that simple. Also, remember to add this new node\
    \ to your load balancer, be that `HAProxy` or your cloud provider's solution.\n\
    \n```bash\nvagrant@db04:~$ sudo apt-get install -y percona-xtradb-cluster-server\
    \ percona-xtradb-cluster-galera-2.x\nvagrant@db04:~$ sudo service mysql stop\n\
    ```\n\nThe contents of `/etc/mysql/my.cnf`will almost identical on all of the\
    \ nodes. The only difference will be the value of `wsrep_node_address`. It should\
    \ be set to the private IP of the node. Add the private IP address of this node\
    \ to the `wsrep_cluster_address`line on all the database nodes. Here is themmy.cnf`\
    \ for `db04`.\n\n```ini\n[mysqld]\ndatadir=/var/lib/mysql\nuser=mysql\n# Path\
    \ to the Galera library.\nwsrep_provider=/usr/lib/libgalera_smm.so\n# Cluster\
    \ connection URL contains the private IPs all nodes.\nwsrep_cluster_address=gcomm://192.168.12.61,192.168.12.62,192.168.12.63,192.168.12.64\n\
    # In order for Galera to work correctly binlog format should be ROW.\nbinlog_format=ROW\n\
    # MyISAM storage engine has only experimental support\ndefault_storage_engine=InnoDB\n\
    # This changes how InnoDB autoincrement locks are managed and is a requirement\
    \ for Galera\ninnodb_autoinc_lock_mode=2\n# SST method\nwsrep_sst_method=xtrabackup\n\
    # Cluster name\nwsrep_cluster_name=my_lamp_cluster\n# Authentication for SST method\n\
    wsrep_sst_auth=\"sstuser:sstuser\"\n# db04 private IP address\nwsrep_node_address=192.168.12.64\n\
    ```\n"
  raw: 'In any case, all of these cloud load balancers function very similarly.  When
    you create a load balancer it will have a IP address associated with it.  You
    will use that IP address as the DNS name for your web site.  Configure the load
    balancer to accept HTTP traffic on port 80 and forward that traffic to port 8080
    on each of your web server nodes.  This configuration bypasses HAProxy and talks
    directly to your web servers.  For this reason make sure you have health checks
    enabled on your cloud load balancer.  You don''t want to route traffic to a web
    server that is down.  Also remember that you still need a HAProxy running on each
    of your web servers to connect to your backend database servers.  Here''s a diagram
    of what this solution looks like.


    ![cloud-http-load-balancer-book.jpg](images/00004.jpeg)


    If you wanted, you could shift the web server to listen on the standard port of
    80 and remove the HAProxy configuration for HTTP traffic.  You could also eliminate
    HAProxy altogether and create another load balancer to serve database traffic. 
    If you do, remember to update your application''s configuration to point to the
    load balancer.


    ![cloud-http-and-mysql-load-balancer-book.jpg](images/00005.jpeg)


    # Scaling


    ## Web Servers


    To add another web server we will need to install apache, configure it as a Gluster
    client, and update the load balancer configuration.


    Install apache, configure it to listen on port 8080, and add the configuration
    for your web site.


    vagrant@server03:~$ sudo apt-get install -y apache2 php5 php5-mysql


    Here are the contents of/etc/apache2/ports.conf.


    # If you just change the port or add more ports here, you will likely also


    # have to change the VirtualHost statement in


    # /etc/apache2/sites-enabled/000-default.conf


    #Listen 80


    Listen 8080


    <IfModule ssl_module>


                      Listen 443


    </IfModule>


    <IfModule mod_gnutls.c>


                      Listen 443


    </IfModule>


    Create/etc/apache2/sites-available/wordpress.conf with the following contents.


    LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
    haproxy_combined


    <virtualhost *:8080>


      DocumentRoot /var/www/wordpress


      <Location />


                  Options -Indexes


      </Location>


      ErrorLog ${APACHE_LOG_DIR}/wordpress_error.log


      LogLevel warn


      CustomLog ${APACHE_LOG_DIR}/wordpress_access.log haproxy_combined


    </virtualhost>


    Enable this configuration and disable the default configuration.  Also let''s
    enable mod_rewrite for Wordpress.


    vagrant@server03:~$ sudo a2ensite wordpress


    vagrant@server03:~$ sudo a2dissite 000-default


    vagrant@server03:~$ sudo a2enmod rewrite


    vagrant@server03:~$ sudo service apache2 reload


    Install the gluster client.


    vagrant@server03:~$ sudo apt-get install -y glusterfs-client


    Add the entries of the storage servers to/etc/hosts.


    vagrant@server03:~$echo ''192.168.12.51 server01-private'' | sudo tee -a /etc/hosts


    vagrant@server03:~$echo ''192.168.12.52 server02-private'' | sudo tee -a /etc/hosts


    Add an entry to/etc/fstab and mount the Gluster volume.  Note that it doesn''t
    really matter which storage server you specify for the mount point as the Gluster
    native client simply retrieves the volume file from that server.  The volume file
    contains the other members of the storage cluster and Gluster will the best communication
    path.


    vagrant@server03:~$ echo "server01-private:/var-www /var/www glusterfs defaults,_netdev,fetch-attempts=5
    0 0" | sudo tee -a /etc/fstab


    vagrant@server03:~$ sudo mv /var/www{,.orig}


    vagrant@server03:~$ sudo mkdir /var/www


    vagrant@server03:~$ sudo mount /var/www


    Install and enable haproxy.  We''ll need it to proxy requests to the database
    cluster.


    vagrant@server03:~$ sudo apt-get install -y haproxy


    vagrant@server03:~$ sudo sed -i.orig ''s/ENABLED=.*/ENABLED=1/'' /etc/default/haproxy


    Take the existing haproxy configuration and append this server''s information
    to the web server section.  Use that configuration on the load balancers and this
    node.  If you''re using the cloud then follow your cloud providers documentation. 
    If you are using HAProxy, here is what the/etc/haproxy/haproxy.cfg file will look
    like.


    global


                  log 127.0.0.1 local0 notice


                  user haproxy


                  group haproxy


    defaults


                  log               global


                  option  dontlognull


                  retries 3


                  option redispatch


                  timeout connect  5000


                  timeout client  50000


                  timeout server  50000


    frontend http


                  bind *:80


                  mode http


                  option httplog


                  default_backend webservers


    backend webservers


                  mode http


                  stats enable


                  stats uri /haproxy/stats


                  stats auth admin:admin


                  stats hide-version


                  balance roundrobin


                  option httpclose


                  option forwardfor


                  cookie SRVNAME insert


                  server server01 192.168.12.51:8080 check cookie server01


                  server server02 192.168.12.52:8080 check cookie server02


                  server server03 192.168.12.53:8080 check cookie server03


    frontend sql


                  bind *:3306


                  mode tcp


                  option tcplog


                  default_backend dbservers


    backend dbservers


                  balance leastconn


                  option httpchk


                  server db01 192.168.12.61:3306 check port 9200 inter 12000 rise
    3 fall 3


                  server db02 192.168.12.62:3306 check port 9200 inter 12000 rise
    3 fall 3 backup


                  server db03 192.168.12.63:3306 check port 9200 inter 12000 rise
    3 fall 3 backup


    Reload the HAProxy configuration on each of the nodes.  (Or restart HAProxy on
    the new node if you are using an external load balancer.)


    vagrant@server01:~$ sudo service haproxy reload


    vagrant@server02:~$ sudo service haproxy reload


    vagrant@server03:~$ sudo service haproxy reload


    ## Database Servers


    Remember that you need an odd number of quorum votes for your database cluster. 
    This means the total number of database nodes needs to be an odd number or you
    need to use the Galera arbitrator, garbd.  In many causes it might make more sense
    to scale the databases vertically.  Take one node down, increase its resources,
    and bring it back up and let it rejoin the cluster.  You could also take one node
    down and replace it with another node that has more resources.


    To add another node to the database tier install Percona XtraDB Cluster, create
    the my.cnf file, and start the database.  It''s that simple.  Also, remember to
    add this new node to your load balancer, be that HAProxy or your cloud provider''s
    solution.


    vagrant@db04:~$ sudo apt-get install -y percona-xtradb-cluster-server percona-xtradb-cluster-galera-2.x


    vagrant@db04:~$ sudo service mysql stop


    The contents of/etc/mysql/my.cnfwill be almost identical on all of the nodes. 
    The only difference will be the value ofwsrep_node_address.  It should be set
    to the private IP of the node.  Add the private IP address of this node to thewsrep_cluster_addressline
    on all the database nodes. Here is themy.cnf for db04.


    [mysqld]


    datadir=/var/lib/mysql


    user=mysql


    # Path to the Galera library.


    wsrep_provider=/usr/lib/libgalera_smm.so


    # Cluster connection URL contains the private IPs all nodes.


    wsrep_cluster_address=gcomm://192.168.12.61,192.168.12.62,192.168.12.63,192.168.12.64


    # In order for Galera to work correctly binlog format should be ROW.


    binlog_format=ROW


    # MyISAM storage engine has only experimental support


    default_storage_engine=InnoDB


    # This changes how InnoDB autoincrement locks are managed and is a requirement
    for Galera


    innodb_autoinc_lock_mode=2


    # SST method


    wsrep_sst_method=xtrabackup


    # Cluster name


    wsrep_cluster_name=my_lamp_cluster


    # Authentication for SST method


    wsrep_sst_auth="sstuser:sstuser"


    # db04 private IP address


    wsrep_node_address=192.168.12.64'
