  trans: "\n在每个节点上启动服务，并检查 VIP 是否如我们预期分配给了 `server01`。\n\n```bash\nvagrant@server01:~$\
    \ sudo service keepalived start\n```\n\n```bash\nvagrant@server02:~$ sudo service\
    \ keepalived start\n```\n\n此时，你应该能够 ping 通 VIP（浮动 IP），它应该被分配到主服务器。\n\n```bash\n\
    vagrant@server01:~$ ip addr show eth1\n3: eth1: <BROADCAST,MULTICAST,UP,LOWER_UP>\
    \ mtu 1500 qdisc pfifo_fast state UP group default qlen 1000\n              link/ether\
    \ 08:00:27:b8:c7:c9 brd ff:ff:ff:ff:ff:ff\n              inet 10.11.12.51/24 brd\
    \ 10.11.12.255 scope global eth1\n                   valid_lft forever preferred_lft\
    \ forever\n              inet 10.11.12.50/32 scope global eth1:vip1\n        \
    \           valid_lft forever preferred_lft forever\n              inet6 fe80::a00:27ff:feb8:c7c9/64\
    \ scope link\n                   valid_lft forever preferred_lft forever\n```\n\
    \n你可以通过从工作站 ping VIP 来验证连通性。\n\n```bash\n[jason@localbox]$ ping -c 3 10.11.12.50\n\
    PING 10.11.12.50 (10.11.12.50) 56(84) bytes of data.\n64 bytes from 10.11.12.50:\
    \ icmp_seq=1 ttl=64 time=0.305 ms\n64 bytes from 10.11.12.50: icmp_seq=2 ttl=64\
    \ time=0.380 ms\n64 bytes from 10.11.12.50: icmp_seq=3 ttl=64 time=0.427 ms\n\
    --- 10.11.12.50 ping statistics ---\n3 packets transmitted, 3 received, 0% packet\
    \ loss, time 2000ms\nrtt min/avg/max/mdev = 0.305/0.370/0.427/0.054 ms\n```\n\n\
    注意，`ping` 命令在 Windows 机器上的形式如下：`ping 10.11.12.50`。\n\n为了确保故障转移正常工作，我们可以通过禁用（停止）VIP\
    \ 关联的网络接口来模拟主服务器故障。如果你愿意，可以在模拟故障时在另一个终端或窗口中开始 ping VIP。\n\n```bash\n[jason@localbox]$\
    \ ping 10.11.12.50\nPING 10.11.12.50 (10.11.12.50) 56(84) bytes of data.\n64 bytes\
    \ from 10.11.12.50: icmp_seq=1 ttl=64 time=0.305 ms\n...\n```\n\n```bash\n$ vagrant\
    \ ssh server01\nvagrant@server01:~$ ip link set eth1 down\n```\n\n在 `server01`\
    \ 的 `/var/log/syslog` 中，你会看到类似的内容：\n\n```\nDec  4 04:57:58 server01 Keepalived_vrrp[2227]:\
    \ Kernel is reporting: interface eth1 DOWN\nDec  4 04:57:58 server01 Keepalived_vrrp[2227]:\
    \ VRRP_Instance(VI_1) Entering FAULT STATE\nDec  4 04:57:58 server01 Keepalived_vrrp[2227]:\
    \ VRRP_Instance(VI_1) Now in FAULT state\n```\n\n在 `server02` 的 `/var/log/syslog`\
    \ 中，你会看到类似的内容：\n\n```\nDec  4 05:00:02 vagrant-ubuntu-trusty-64 Keepalived_vrrp[4071]:\
    \ VRRP_Instance(VI_1) Transition to MASTER STATE\nDec  4 05:00:03 vagrant-ubuntu-trusty-64\
    \ Keepalived_vrrp[4071]: VRRP_Instance(VI_1) Entering MASTER STATE\n```\n\n如果你在后台运行着\
    \ `ping` 命令，它仍然应该响应 ping 请求。你也可以启动一个新的 ping 来确保 VIP 可可的。\n\n```bash\n[jason@localbox]$\
    \ ping -c 3 10.11.12.50\nPING 10.11.12.50 (10.11.12.50) 56(84) bytes of data.\n\
    64 bytes from 10.11.12.50: icmp_seq=1 ttl=64 time=0.305 ms\n64 bytes from 10.11.12.50:\
    \ icmp_seq=2 ttl=64 time=0.380 ms\n64 bytes from 10.11.12.50: icmp_seq=3 ttl=64\
    \ time=0.427 ms\n--- 10.11.12.50 ping statistics ---\n3 packets transmitted, 3\
    \ received, 0% packet loss, time 2000ms\nrtt min/avg/max/mdev = 0.305/0.370/0.427/0.054\
    \ ms\n```\n\n当你重新启用主服务器上的网络接口时，它将重新夺回 VIP。如果你想防止这种行为，可以在 `keepalived.conf` 中使用\
    \ `preempt_option`。\n\n```bash\nvagrant@server01:~$ ip link set eth1 up\n```\n\
    \n在 `server01` 的 `/var/log/syslog` 中，你会看到类似的内容：\n\n```\nDec  4 05:01:08 server01\
    \ Keepalived_vrrp[2227]: VRRP_Instance(VI_1) prio is higher than received advert\n\
    Dec  4 05:01:08 server01 Keepalived_vrrp[2227]: VRRP_Instance(VI_1) Transition\
    \ to MASTER STATE\nDec  4 05:01:09 server01 Keepalived_vrrp[2227]: VRRP_Instance(VI_1)\
    \ Entering MASTER STATE\n```\n\n在 `server02` 的 `/var/log/syslog` 中，你会看到类似的内容：\n\
    \n```\nDec  4 05:03:15 vagrant-ubuntu-trusty-64 Keepalived_vrrp[4071]: VRRP_Instance(VI_1)\
    \ Received higher prio advert\nDec  4 05:03:15 vagrant-ubuntu-trusty-64 Keepalived_vrrp[4071]:\
    \ VRRP_Instance(VI_1) Entering BACKUP STATE\n```\n\n### 安装和配置负载均衡器\n\nHAProxy\
    \ 将作为负载均衡器。我们将使用以下命令在前端节点上安装它。\n\n```bash\nvagrant@server01:~$ sudo apt-get install\
    \ -y haproxy\nvagrant@server02:~$ sudo apt-get install -y haproxy\n```\n\n在两个前端节点的\
    \ `/etc/haproxy/haproxy.cfg` 中使用以下配置。\n\n```\nglobal\n    log 127.0.0.1 local0\
    \ notice\n    user haproxy\n    group haproxy\n\ndefaults\n    log\n    option\
    \ default\n    retries 3\n    timeout connect 5s\n    timeout client 50s\n   \
    \ timeout server 50s\n\nfrontend http\n    bind *:80\n    mode http\n    option\
    \ httog\n    default_backend webservers\n\nbackend webservers\n    mode http\n\
    \    stats enable\n    stats uri /haproxy/stats\n    stats auth admin\n    stats\
    \ version\n    balance roundrobin\n    option close\n    option forward insert\
    \ SRV\n    server01 10.11.12.51:8080 check\n    server02 10.11.12.52:8080 check\n\
    \    server03 10.11.12.53:8080 check\n```\n"
- fmt: "\nIn addition to web traffic we'll be using `HAProxy` to route requests to\
    \ the database servers. To do this we will have `HAProxy` listening on the default\
    \ `MySQL` port of `3306`. It will route requests based on the `leastconn` algorithm.\
    \ This means that whichever database server has the least number of connections\
    \ at the time a request is made is the database server that request is routed\
    \ to. If all of the database servers have the same number of connections then\
    \ round robin is used to select the database server. The `leastconn` algorithm\
    \ is recommended for \"long\" sessions that you will encounter when using `SQL`,\
    \ `LDAP`, etc. We'll get into how the health checks work when we configure the\
    \ database servers.\n\nTo enable `HAProxy` set `ENABLED=1` in `/etc/default/haproxy`.\
    \ Feel free to use your favorite editor to make that change or use the following\
    \ one-liner which creates a backup of the file named `haproxy.orig` and makes\
    \ the change.\n\n```bash\nvagrant@server01:~$ sudo sed -i.orig 's/ENABLED=.*/ENABLED=1/'\
    \ /etc/default/haproxy\nvagrant@server01:~$ sudo sed -i.orig 's/ENABLED=.*/ENABLED=1/'\
    \ /etc/default/haproxy\n```\n\nWe have configured `HAProxy` to log to the `localhost`.\
    \ Now we need to configure `rsyslog` to accept those log messages by listening\
    \ on `UDP:514`. Create `/etc/rsyslog.d/udp-localhost.conf` and add the following\
    \ lines to that file.\n\n```text\n$ModLoad imudp\n$UDPServerRun 514\n$UDPServerAddress\
    \ 127.0.0.1\n```\n\nLet's reload `rsyslog` so that it picks up this new configuration.\n\
    \n```bash\nvagrant@server01:~$ sudo service rsyslog restart\nvagrant@server02:~$\
    \ sudo service rsyslog restart\n```\n\nWe're ready to start `haproxy`.\n\n```bash\n\
    vagrant@server01:~$ sudo service haproxy start\nvagrant@server02:~$ sudo service\
    \ haproxy start\n```\n\nYou can now view the `HAProxy` stats of `server01` by\
    \ visiting `http://10.11.12.51/haproxy/stats` and the stats of `server02` by visiting\
    \ `http://10.11.12.52/haproxy/stats`. I used a rather insecure username and password\
    \ of `admin:admin`, so feel free to update the `haproxy.cfg` and change those\
    \ values. Also, you can access the status page using the `VIP` and whichever server\
    \ is associated with the `VIP` will respond. At this point the web servers and\
    \ database servers will be correctly reported as `DOWN` since we haven't configured\
    \ them yet.\n\n### Installing and Configuring Apache and PHP\n\nNow that `HAProxy`\
    \ is poised to accept web requests, let's install the `Apache` web server and\
    \ `PHP` programming language. Since we'll be connecting to `MySQL`, we'll need\
    \ the `MySQL` module for `PHP`.\n\n```bash\nvagrant@server01:~$ sudo apt-get install\
    \ -y apache2 php5 php5-mysql\nvagrant@server02:~$ sudo apt-get install -y apache2\
    \ php5 php5-mysql\n```\n\nWhen you perform the installation you'll likely seen\
    \ an error like the following one when Apache is started.\n\n`(98)Address already\
    \ in use: AH00073: make_sock: unable to listen for connections on address 0.0.0.0:80`\n\
    \nThis error occurs because `HAProxy` is already using port `80`. If we want to\
    \ run `Apache` and `HAProxy` on the same host we'll need to configure `Apache`\
    \ to use a different port. To do that, edit `/etc/apache2/ports.conf` change `Listen\
    \ 80` to `Listen 8080`. Here are the contents of `/etc/apache2/ports.conf` after\
    \ this change.\n\n```apache\n# If you just change the port or add more ports here,\
    \ you will likely\n# have to change the VirtualHost statement in\n# /etc/apache2/sites-enabled/000-default.conf\n\
    #Listen 80\nListen 8080\n<IfModule ssl_module>\n    Listen 443\n</IfModule>\n\
    <IfModule mod_gnls>\n    Listen 443\n</IfModule>\n```\n\nLet's start `apache`\
    \ on this new port.\n\n```bash\nvagrant@server01:~$ sudo service apache2 start\n\
    vagrant@server02:~$ sudo service apache2 start\n```\n\nWe can now see that `HAProxy`\
    \ is listening on ports `80` and `3306` while `apache` is listening on port `8080`.\n\
    \n```bash\nvagrant@server01:~$ sudo netstat -ntlp | egrep 'haproxy|apache'\ntcp\
    \ 0-0 0.0.0.0:80 0.0.0.0:* LISTEN haproxy\ntcp 0-0 0.0.0.0:3306 0.0.0.0:* LISTEN\
    \ haproxy\ntcp 0-0 0.0.0.0:8080 0.0.0.0:* LISTEN apache\n```\n\nAt this point\
    \ the `HAProxy` stats page will show that it can communicate to the web servers\
    \ and that they are up. We can demonstrate that `HAProxy` is performing the round\
    \ robin by making HTTP requests. The first request (`session`) will go to `server01`\
    \ and `HAProxy` will set the `SRVNAME` cookie to `server01`. The second request\
    \ (`session`) will go to `server02` and `HAProxy` will set the `SRVNAME` cookie\
    \ to `server02`. Using `-I` with `curl` just displays the HTTP header. We're not\
    \ interested in the actual HTML content for this. In this example `curl` doesn't\
    \ act like your normal graphical web browser in the sense that when a cookie is\
    \ set `curl` doesn't save it and reuse it for subsequent requests. This is why\
    \ repeated `curl` requests will demonstrate the round robin in action.\n\n```bash\n\
    jason@localbox ~]$ curl -I http://10.11.12.50\nHTTP/1.1 200 OK\nDate: Sat, 06\
    \ Dec 2014 16:22:15 GMT\nServer: Apache/2.4.7 (Ubuntu)\nConnection: close\nContent-Type:\
    \ text/html; charset=UTF-8\nSet-Cookie: SRVNAME=server01; path=/\n\njason@localbox\
    \ ~]$ curl -I http://10.11.12.50\nHTTP/1.1 200 OK\nDate: Sat, 06 Dec 2014 16:22:17\
    \ GMT\nServer: Apache/2.4.7 (Ubuntu)\nConnection: close\nContent-Type: text/html;\
    \ charset=UTF-8\nSet-Cookie: SRVNAME=server02; path=/\n```\n\nNow let's make `curl`\
    \ behave like a typical user's web browser and send back the cookie. We'll make\
    \ an initial request to get the value of the cookie and then make all the subsequent\
    \ requests with that cookie value. To make `curl` send a cookie use `-b \"cookie-name:cookie-value\"\
    `. If you look at the `HAProxy` stats page using the `VIP` you'll see the total\
    \ sessions number increment each time a request is made.\n\n```bash\njason@localbox\
    \ ~]$ curl -I http://10.11.12.50\nHTTP/1.1 200 OK\nDate: Sat, 06 Dec 2014 16:23:15\
    \ GMT\nServer: Apache/2.4.7 (Ubuntu)\nConnection: close\nContent-Type: text/html;\
    \ charset=UTF-8\nSet-Cookie: SRVNAME=server01; path=/\n\njason@localbox ~]$ curl\
    \ -b \"SRVNAME=server01\" -I http://10.11.12.50\nHTTP/1.1 200 OK\nDate: Sat, 06\
    \ Dec 2014 16:23:17 GMT\nServer: Apache/2.4.7 (Ubuntu)\nConnection: close\nContent-Type:\
    \ text/html; charset=UTF-8\n\njason@localbox ~]$ curl -b \"SRVNAME=server01\"\
    \ -I http://10.11.12.50\nHTTP/1.1 200 OK\nDate: Sat, 06 Dec 2014 16:23:19 GMT\n\
    Server: Apache/2.4.7 (Ubuntu)\nConnection: close\nContent-Type: text/html; charset=UTF-8\n\
    ```\n\n`HAProxy` is routing requests properly and Apache is responding. Now let's\
    \ create an Apache configuration file for our web application. In this example\
    \ we will use WordPress. Create `/etc/apache2/sites-available/wordpress.conf`\
    \ with the following contents.\n\n```apache\nLogFormat \"%{X-Forwarded-For}i %l\
    \ %u %t \\\"%r\\\" %>s %b \\\"%{Referer}i\\\" \\\"%{User-Agent}i\\\"\" haproxy_combined\n\
    \n<virtualhost *:8080>\n  DocumentRoot /var/www/wordpress\n  <Location />\n  \
    \  Options -Indexes\n  </Location>\n  ErrorLog ${APACHE_LOG_DIR}/wordpress_error.log\n\
    \  LogLevel warn\n  CustomLog ${APACHE_LOG_DIR}/wordpress_access.log haproxy_combined\n\
    </virtualhost>\n```\n\nThe configuration takes into account that `HAProxy` will\
    \ always be making requests to Apache. In this architecture the end users do not\
    \ and should not make requests directly to a particular web server. If we used\
    \ the default logging configuration the web server logs would only contain the\
    \ IP addresses of the `HAProxy` servers and we would have no idea where the connections\
    \ actually originated from. `HAProxy`, and most other proxies, set an `X-Forwarded-For`\
    \ header that contains the IP address of the original requestor. We update the\
    \ Apache log format to use that IP instead of the IP of the proxies.\n\nLet's\
    \ enable this configuration and disable the default configuration. Also let's\
    \ enable `mod_rewrite` for WordPress.\n\n```bash\nvagrant@server01:~$ sudo a2ensite\
    \ wordpress\nvagrant@server01:~$ sudo a2dissite 000-default\nvagrant@server01:~$\
    \ sudo a2enmod rewrite\n\nvagrant@server02:~$ sudo a2ensite wordpress\nvagrant@server02:~$\
    \ sudo a2dissite 000-default\nvagrant@server02:~$ sudo a2enmod rewrite\n```\n"
  raw: 'In addition to web traffic we''ll be using HAProxy to route requests to the
    database servers.  To do this we will have HAProxy listening on the default MySQL
    port of 3306.  It will route requests based on the leastconn algorithm.  This
    means that whichever database server has the least number of connections at the
    time a request is made is the database server that request is routed to.  If all
    of the database servers have the same number of connections then round robin is
    used to select the database server.  The leastconn algorithm is recommended for
    "long" sessions that you will encounter when using SQL, LDAP, etc.  We''ll get
    into how the health checks work when we configure the database servers.


    To enable HAProxy set ENABLED=1 in/etc/default/haproxy.  Feel free to use your
    favorite editor to make that change or use the following one-liner which creates
    a backup of the file namedhaproxy.orig and makes the change.


    vagrant@server01:~$ sudo sed -i.orig ''s/ENABLED=.*/ENABLED=1/'' /etc/default/haproxy


    vagrant@server01:~$ sudo sed -i.orig ''s/ENABLED=.*/ENABLED=1/'' /etc/default/haproxy


    We have configured HAProxy to log to the localhost.  Now we need to configure
    rsyslog to accept those log messages by listening on UDP:514.  Create/etc/rsyslog.d/udp-localhost.conf
    and add the following lines to that file.


    $ModLoad imudp


    $UDPServerRun 514


    $UDPServerAddress 127.0.0.1


    Let''s reload rsyslog so that it picks up this new configuration.


    vagrant@server01:~$ sudo service rsyslog restart


    vagrant@server02:~$ sudo service rsyslog restart


    We''re ready to start HAproxy.


    vagrant@server01:~$ sudo service haproxy start


    vagrant@server02:~$ sudo service haproxy start


    You can now view the HAProxy stats of server01 by visiting http://10.11.12.51/haproxy/stats
    and the stats of server02 by visiting http://10.11.12.52/haproxy/stats.  I used
    a rather insecure username and password of admin:admin, so feel free to update
    the haproxy.cfg and change those values.  Also, you can access the status page
    using the VIP and whichever server is associated with the VIP will respond.  At
    this point the web servers and database servers will be correctly reported as
    DOWN since we haven''t configured them yet.


    ### Installing and Configuring Apache and PHP


    Now that HAProxy is poised to accept web requests, let''s install the Apache web
    server and PHP programming language. Since we''ll be connecting to MySQL, we''ll
    need the MySQL module for PHP.


    vagrant@server01:~$ sudo apt-get install -y apache2 php5 php5-mysql


    vagrant@server02:~$ sudo apt-get install -y apache2 php5 php5-mysql


    When you perform the installation you''ll likely seen an error like the following
    one when Apache is started.


    (98)Address already in use: AH00073: make_sock: unable to listen for connections
    on address 0.0.0.0:80


    This error occurs because HAProxy is already using port 80.  If we want to run
    Apache and HAProxy on the same host we''ll need to configure Apache to use a different
    port.  To do that, edit/etc/apache2/ports.confand change Listen 80 to Listen 8080. 
    Here are the contents of/etc/apache2/ports.conf after this change.


    # If you just change the port or add more ports here, you will likely also


    # have to change the VirtualHost statement in


    # /etc/apache2/sites-enabled/000-default.conf


    #Listen 80


    Listen 8080


    <IfModule ssl_module>


                      Listen 443


    </IfModule>


    <IfModule mod_gnutls.c>


                      Listen 443


    </IfModule>


    Let''s start apache on this new port.


    vagrant@server01:~$ sudo service apache2 start


    vagrant@server02:~$ sudo service apache2 start


    We can now see that HAProxy is listening on ports 80 and 3306 while apache is
    listening on port 8080.


    vagrant@server01:~$ sudo netstat -ntlp | egrep ''haproxy|apache''


    tcp    0                0 0.0.0.0:3306   0.0.0.0:*   LISTEN                1178/haproxy   


    tcp    0                0 0.0.0.0:80     0.0.0.0:*   LISTEN                1178/haproxy   


    tcp6   0                0 :::8080        :::*        LISTEN                2679/apache2 


    At this point the HAProxy stats page will show that it can communicate to the
    web servers and that they are up.  We can demonstrate that HAProxy is performing
    the round robin by making HTTP requests.  The first request (session) will go
    to server01 and HAProxy will set the SRVNAME cookie to server01.  The second request
    (session) will go to server02 and HAProxy will set the SRVNAME cookie to server02. 
    Using the-Ioption tocurl just displays the HTTP header information.  We''re not
    interested in the actual HTML content for this test.


    In this example curl doesn''t act like your normal graphical web browser in the
    sense that when a cookie is set curl doesn''t save it and reuse it for subsequent
    requests.  This is why repeated curl requests will demonstrate the round robin
    in action.


    [jason@localbox ~]$ curl -I http://10.11.12.50


    HTTP/1.1 200 OK


    Date: Sat, 06 Dec 2014 16:22:15 GMT


    Server: Apache/2.4.7 (Ubuntu)


    Connection: close


    Content-Type: text/html; charset=UTF-8


    Set-Cookie: SRVNAME=server01; path=/


    [jason@localbox ~]$ curl -I http://10.11.12.50


    HTTP/1.1 200 OK


    Date: Sat, 06 Dec 2014 16:22:17 GMT


    Server: Apache/2.4.7 (Ubuntu)


    Connection: close


    Content-Type: text/html;charset=UTF-8


    Set-Cookie: SRVNAME=server02; path=/


    Now let''s make curl behave like a typical user''s web browser and send back the
    cookie.  We''ll make an initial request to get the value of the cookie and then
    make all the subsequent requests with that cookie value.  To make curl send a
    cookie use-b "cookie-name:cookie-value".  If you look at the HAProxy stats page
    using the VIP you''ll see the total sessions number increment each time a request
    is made.


    [jason@localbox ~]$ curl -I http://10.11.12.50


    HTTP/1.1 200 OK


    Date: Sat, 06 Dec 2014 16:23:15 GMT


    Server: Apache/2.4.7 (Ubuntu)


    Connection: close


    Content-Type: text/html; charset=UTF-8


    Set-Cookie: SRVNAME=server01; path=/


    [jason@localbox ~]$ curl -b "SRVNAME=server01" -I http://10.11.12.50


    HTTP/1.1 200 OK


    Date: Sat, 06 Dec 2014 16:23:17 GMT


    Server: Apache/2.4.7 (Ubuntu)


    Connection: close


    Content-Type: text/html; charset=UTF-8


    [jason@localbox ~]$ curl -b "SRVNAME=server01" -I http://10.11.12.50


    HTTP/1.1 200 OK


    Date: Sat, 06 Dec 2014 16:23:19 GMT


    Server: Apache/2.4.7 (Ubuntu)


    Connection: close


    Content-Type: text/html; charset=UTF-8


    HAProxy is routing requests properly and Apache is responding.  Now let''s create
    an Apache configuration file for our web application.  In this example we will
    use WordPress.  Create/etc/apache2/sites-available/wordpress.conf with the following
    contents.


    LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
    haproxy_combined


    <virtualhost *:8080>


      DocumentRoot /var/www/wordpress


      <Location />


                  Options -Indexes


      </Location>


      ErrorLog ${APACHE_LOG_DIR}/wordpress_error.log


      LogLevel warn


      CustomLog ${APACHE_LOG_DIR}/wordpress_access.log haproxy_combined


    </virtualhost>


    The configuration takes into account that HAProxy will always be making requests
    to Apache.  In this architecture the end users do not and should not make requests
    directly to a particular web server.  If we used the default logging configuration
    the web server logs would only contain the IP addresses of the HAProxy servers
    and we would have no idea where the connections actually originated from.  HAProxy,
    and most other proxies, set an X-Forwarded-For header that contains the IP address
    of the original requestor.  We update the Apache log format to use that instead
    IP instead of the IP of the proxies.


    Let''s enable this configuration and disable the default configuration.  Also
    let''s enable mod_rewrite for Wordpress.


    vagrant@server01:~$ sudo a2ensite wordpress


    vagrant@server01:~$ sudo a2dissite 000-default


    vagrant@server01:~$ sudo a2enmod rewrite


    vagrant@server02:~$ sudo a2ensite wordpress


    vagrant@server02:~$ sudo a2dissite 000-default


    vagrant@server02:~$ sudo a2enmod rewrite'
