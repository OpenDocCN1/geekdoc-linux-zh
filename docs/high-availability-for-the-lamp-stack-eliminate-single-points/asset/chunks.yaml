    ### Installing and Configuring WordPress


    Now that the database cluster is configured we can create a user that will be
    used by our web application.  Run the following commands on one of the database
    nodes.


    vagrant@db01:~$ sudo mysql -e ''CREATE DATABASE wordpress;''


    vagrant@db01:~$ sudo mysql -e ''CREATE USER wordpress IDENTIFIED BY "wordpress";''


    vagrant@db01:~$ sudo mysql -e ''GRANT ALL PRIVILEGES ON wordpress.* TO "wordpress";''


    Next, choose one of the web servers to install the application files for WordPress. 
    Remember that the storage is shared and synced across our nodes.


    vagrant@server01:~$ cd /var/tmp


    vagrant@server01:~$ wget -q https://wordpress.org/latest.tar.gz


    vagrant@server01:~$ tar xf /var/tmp/latest.tar.gz -C /var/www


    vagrant@server01:~$ chown -R www-data:www-data /var/www/wordpress


    vagrant@server01:~$ cd /var/www/wordpress


    Specify the database connection information in/var/www/wordpress/wp-config.php. 
    Remember that the local HAProxy process is configured to accept MySQL traffic
    and proxy it to an available database node.  This means you should set the DB_HOST
    to 127.0.0.1.


    vagrant@server01:~$ cp -p wp-config-sample.php wp-config.php


    vagrant@server01:~$ vi wp-config.php # And set the following:


    define(''DB_NAME'', ''wordpress'');


    define(''DB_USER'', ''wordpress'');


    define(''DB_PASSWORD'', ''wordpress'');


    define(''DB_HOST'', ''127.0.0.1'');


    To complete the WordPress installation, open a web browser to the VIP address
    (http://10.11.12.50).  Follow the normal installation process by answering a few
    questions.  If you connect to any of the database instances you will now see that
    WordPress database has been populated and our database cluster is functioning.


    vagrant@db01:~$ mysql -e ''show tables;'' -u wordpress -pwordpress wordpress


    +-----------------------+


    | Tables_in_wordpress   |


    +-----------------------+


    | wp_commentmeta                  |


    | wp_comments                     |


    | wp_links                        |


    | wp_options                      |


    | wp_postmeta                     |


    | wp_posts                        |


    | wp_term_relationships |


    | wp_term_taxonomy                |


    | wp_terms                        |


    | wp_usermeta                     |


    | wp_users                        |


    +-----------------------+


    Now let''s make sure our file system is working as expected.  Log into WordPress
    using the username and password you created.  Go to the Media Library and upload
    a picture.  I''m going to uploadcat-picture.jpg.  If you look on each of your
    web server nodes you''ll find that picture on the filesystem.


    vagrant@server01:~$ find /var/www/wordpress -name cat-picture.jpg


    /var/www/wordpress/wp-content/uploads/2014/12/cat-picture.jpg


    vagrant@server02:~$ find /var/www/wordpress -name cat-picture.jpg


    /var/www/wordpress/wp-content/uploads/2014/12/cat-picture.jpg


    ## Considerations for the Cloud


    If you are going to be deploying this architecture in the cloud you will need
    to offload the work performed by Keepalived to your cloud provider.  Instead of
    implementing a floating IP solution running on your servers you will need to use
    the cloud provider''s load balancing service.  For Amazon Web Services this is
    called an Elastic Load Balancer.  Rackspace calls their service Cloud Load Balancers
    while Linode brands their solution NodeBalancers.'
