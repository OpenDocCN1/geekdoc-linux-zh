    ```\n\n```bash\n[jason@localbox ~/my-first-test-box]$ vagrant ssh\nWelcome to\
    \ Ubuntu 14.04.1 LTS (GNU/Linux 3.13.0-40-generic x86_64)\n* Documentation:  https://help.ubuntu.com/\n\
    \  System information as of Sat Dec  6 03:23:33 UTC 2014\n  System load:  0.66\
    \                           Processes:                   90\n  Usage of /:   2.7%\
    \ of 39.34GB   Users logged in:                0\n  Memory usage: 16%        \
