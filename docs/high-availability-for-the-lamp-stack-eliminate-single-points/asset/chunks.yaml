  trans: "\n\n除了 Web 流量，我们还将使用 `HAProxy` 来将请求路由到数据库服务器。为了实现这一点，我们将让 `HAProxy` 监听在\
    \ `MySQL` 的默认端口 `3306` 上。它将根据 `leastconn` 算法路由请求。这意味着在发起请求时，哪一个数据库服务器的连接数最少，请求就会路由到该服务器。如果所有数据库服务器的连接数相同，则使用轮询（round\
    \ robin）算法来选择数据库服务器。对于在使用 `SQL`、`LDAP` 等时会遇到的“长”话，建议使用 `leastconn` 算法。我们将在配置数据库服务器时详细介绍健康检查的工作原理。\n\
    \n要启用 `HAProxy`，请在 `/etc/default/haproxy` 中设置 `ENABLED=1`。可以随时使用你喜欢的编辑器进行该更改，或者使用下方的单行命令，它会创建一个名为\
    \ `haproxy.orig` 的备份文件并进行修改。\n\n```bash\nvagrant@server01:~$ sudo sed -i.orig\
    \ 's/ENABLED=.*/ENABLED=1/' /etc/default/haproxy\nvagrant@server01:~$ sudo sed\
    \ -i.orig 's/ENABLED=.*/ENABLED=1/' /etc/default/haproxy\n```\n\n我们已经配置了 `HAProxy`\
    \ 将日志记录到 `localhost`。现在我们需要配置 `rsyslog`，通过监听 `UDP:514` 来接收这些日志消息。创建 `/etc/rsyslog.d/udp-localhost.conf`\
    \ 并向文件中添加以下行。\n\n```text\n$ModLoad imudp\n$UDPServerRun 514\n$UDPServerAddress\
    \ 127.0.0.1\n```\n\n让我们加载 `rsyslog` 以使其读取新配置。\n\n```bash\nvagrant@server01:~$\
    \ sudo service rsyslog restart\nvagrant@server02:~$ sudo service rsyslog restart\n\
    ```\n\n我们已经准备好启动 `haproxy` 了。\n\n```bash\nvagrant@server01:~$ sudo service haproxy\
    \ start\nvagrant@server02:~$ sudo service haproxy start\n```\n\n你现在可以通过访问 `http://10.11.12.51/haproxy/stats`\
    \ 查看 `server01` 的 `HAProxy` 统计信息，通过 `http://10.11.12.52/haproxy/stats` 查看 `server02`\
    \ 的统计信息。我使用了相当不安全的用户名和密码 `admin:admin`，所以请随时更新 `haproxy.cfg` 并更改这些值。此外，你可以使用 `VIP`\
    \ 访问状态页面，任何与 `VIP` 关联的服务器都会响应。此时，Web 服务器和数据库服务器将被正确地报告为 `DOWN`，因为我们还没有配置它们。\n\n\
    ### 安装和配置 Apache 和 PHP\n\n现在 `HAProxy` 已经准备好接受 Web 请求，让我们安装 `Apache` Web 服务器和\
    \ `PHP` 编程语言。由于我们需要连接到 `MySQL`，我们需要 `PHP` 的 `MySQL` 模块。\n\n```bash\nvagrant@server01:~$\
    \ sudo apt-get install -y apache2 php5 php5-mysql\nvagrant@server02:~$ sudo apt-get\
    \ install -y apache2 php5 php5-mysql\n```\n\n在执行安装时，你可能会在 Apache 启动时遇到如下错误。\n\n\
    `(98)Address already in use: AH00073: make_sock: unable to listen for connections\
    \ on address 0.0.0.0:80`\n\n发生此错误是因为 `HAProxy` 已经在使用端口 `80`。如果我们想在同一台主机上运行 `Apache`\
    \ 和 `HAProxy`，我们需要配置 `Apache` 使用不同的端口。为此，编辑 `/etc/apache2/ports.conf`，将 `Listen\
    \ 80` 更改为 `Listen 8080`。以下是更改后 `/etc/apache2/ports.conf` 的内容。\n\n```apache\n#\
    \ 如果你更改了端口或在这里添加了更多端口，你可能\n# 需要更改 /etc/apache2/sites-enabled/000-default.conf\n\
    # 中的 VirtualHost 语句\n#Listen 80\nListen 8080\n<IfModule ssl_module>\n    Listen\
    \ 443\n</IfModule>\n<IfModule mod_gnls>\n    Listen 443\n</IfModule>\n```\n\n\
    让我们在这个新端口启动 `apache`。\n\n```bash\nvagrant@server01:~$ sudo service apache2 start\n\
    vagrant@server02:~$ sudo service apache2 start\n```\n\n我们现在可以看到 `HAProxy` 正在监听\
    \ `80` 和 `3306` 端口，而 `apache` 正在监听 `8080` 端口。\n\n```bash\nvagrant@server01:~$\
    \ sudo netstat -ntlp | egrep 'haproxy|apache'\ntcp 0-0 0.0.0.0:80 0.0.0.0:* LISTEN\
    \ haproxy\ntcp 0-0 0.0.0.0:3306 0.0.0.0:* LISTEN haproxy\ntcp 0-0 0.0.0.0:8080\
    \ 0.0.0.0:* LISTEN apache\n```\n\n此时，`HAProxy` 统计页面将显示它可以与 Web 服务器通信，并且它们处于开启状态。我们可以通过发送\
    \ HTTP 请求来演示 `HAProxy` 正在执行轮询。第一个请求（`session`）将发送到 `server01`，`HAProxy` 将 `SRVNAME`\
    \ cookie 设置为 `server01`。第二个请求（`session`）将发送到 `server02`，`HAProxy` 将 `SRVNAME`\
    \ cookie 设置为 `server02`。使用 `curl` 配合 `-I` 仅显示 HTTP 头部。我们对实际的 HTML 内容感兴趣。在这个示例中，`curl`\
    \ 的行为不像普通的图形化 Web 浏览器，因为当设置 cookie 时，`curl` 不会保存并在后续请求中重用它。这就是为什么重复的 `curl` 请求将演示轮询的生效。\n\
    \n```bash\njason@localbox ~]$ curl -I http://10.11.12.50\nHTTP/1.1 200 OK\nDate:\
    \ Sat, 06 Dec 2014 16:22:15 GMT\nServer: Apache/2.4.7 (Ubuntu)\nConnection: close\n\
    Content-Type: text/html; charset=UTF-8\nSet-Cookie: SRVNAME=server01; path=/\n\
    \njason@localbox ~]$ curl -I http://10.11.12.50\nHTTP/1.1 200 OK\nDate: Sat, 06\
    \ Dec 2014 16:22:17 GMT\nServer: Apache/2.4.7 (Ubuntu)\nConnection: close\nContent-Type:\
    \ text/html; charset=UTF-8\nSet-Cookie: SRVNAME=server02; path=/\n```\n\n现在让我们让\
    \ `curl` 的行为像典型用户的 Web 浏览器并返回 cookie。我们将发送一个初始请求来获取 cookie 值，然后使用该 cookie 值发送所有后续请求。要让\
    \ `curl` 发送 cookie，使用 `-b \"cookie-name:cookie-value\"`。如果你使用 `VIP` 查看 `HAProxy`\
    \ 统计页面，你会发现每次发起请求时，总会话数都会递增。\n\n```bash\njason@localbox ~]$ curl -I http://10.11.12.50\n\
    HTTP/1.1 200 OK\nDate: Sat, 06 Dec 2014 16:23:15 GMT\nServer: Apache/2.4.7 (Ubuntu)\n\
    Connection: close\nContent-Type: text/html; charset=UTF-8\nSet-Cookie: SRVNAME=server01;\
    \ path=/\n\njason@localbox ~]$ curl -b \"SRVNAME=server01\" -I http://10.11.12.50\n\
    HTTP/1.1 200 OK\nDate: Sat, 06 Dec 2014 16:23:17 GMT\nServer: Apache/2.4.7 (Ubuntu)\n\
    Connection: close\nContent-Type: text/html; charset=UTF-8\n\njason@localbox ~]$\
    \ curl -b \"SRVNAME=server01\" -I http://10.11.12.50\nHTTP/1.1 200 OK\nDate: Sat,\
    \ 06 Dec 2014 16:23:19 GMT\nServer: Apache/2.4.7 (Ubuntu)\nConnection: close\n\
    Content-Type: text/html; charset=UTF-8\n```\n\n`HAProxy` 正在正确路由请求，Apache 正在响应。现在让我们为\
    \ Web 应用创建一个 Apache 配置文件。在示例中我们将使用 WordPress。创建 `/etc/apache2/sites-available/wordpress.conf`，内容如下。\n\
    \n```apache\nLogFormat \"%{X-Forwarded-For}i %l %u %t \\\"%r\\\" %>s %b \\\"%{Referer}i\\\
    \" \\\"%{User-Agent}i\\\"\" haproxy_combined\n\n<virtualhost *:8080>\n  DocumentRoot\
    \ /var/www/wordpress\n  <Location />\n    Options -Indexes\n  </Location>\n  ErrorLog\
    \ ${APACHE_LOG_DIR}/wordpress_error.log\n  LogLevel warn\n  CustomLog ${APACHE_LOG_DIR}/wordpress_access.log\
    \ haproxy_combined\n</virtualhost>\n```\n\n该配置考虑了 `HAProxy` 将始终向 Apache 发起请求。在这种架构中，终端用户不直接请求特定的\
    \ Web 服务器。如果我们使用默认日志配置，Web 服务器日志将只包含 `HAProxy` 服务器的 IP 地址，我们不知道连接实际来自哪里。`HAProxy`\
    \ 以及大多数代理都会设置 `X-Forwarded-For` Header，包含原始请求者的 IP 地址。我们更新 Apache 日志格式使用该 IP 而不是代理的\
    \ IP。\n\n让我们启用此配置并禁用默认配置。此外，让我们为 WordPress 启用 `mod_rewrite`。\n\n```bash\nvagrant@server01:~$\
    \ sudo a2ensite wordpress\nvagrant@server01:~$ sudo a2dissite 000-default\nvagrant@server01:~$\
    \ sudo a2enmod rewrite\n\nvagrant@server02:~$ sudo a2ensite wordpress\nvagrant@server02:~$\
    \ sudo a2dissite 000-default\nvagrant@server02:~$ sudo a2enmod rewrite\n```\n\n"
