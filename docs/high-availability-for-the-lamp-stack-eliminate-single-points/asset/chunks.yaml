    # 引言


    交付 Web 应用程序最常见的方法是通过使用 LAMP 栈。`LAMP` 是 Linux、Apache、MySQL 和 PHP 的缩写。在这一设计中，Linux
    是操作系统，`Apache` 是 Web 服务器，`MySQL` 作为数据库，而 `PHP` 用作编程语言。这种架构可以用于托管开源应用程序或自定义编写的
    Web 应用。Facebook、Wikipedia 和 Yahoo 等热门网站都使用这种设计为全球数百万用户提供服务。WordPress、Drupal、Joomla!、MediaWiki
    和 SugarCRM 等开源应用程序也依赖于 LAMP 栈。


    无论你是在部署或支持自定义编写的应用程序，还是使用开源解决方案，你都希望采用一种能够最大化该应用程序可用性、消除单点故障、允许在无停机时间的情况下进行扩展，并且相对容易实现和支持的架构。预先花时间考虑你所实现的服务的需求和长期目标，要比在如预期流量激增或停机等紧急情况下做出架构决策要好。紧急情况下不是设计解决方案的良时机。


    每个项目可能都有不同的需求，但通常至少有几个需要考虑的要点。它们是冗余、扩展性、性能和可管理性。`冗余`是指如何容忍故障。`扩展性`是指如何服务增加或减少的用户群。`性能`是指如何确保每个用户的体验达到或超过可接受水平。如果一个服务是冗余、可扩展、高性能的但不可管理或不可支持，那么它毫无意义，因此，可管理性是一项关键考虑因素。谁来执行该设计？谁来支持它？按照设计中规定的方式进行扩展是否可行？有时由于缺乏可用资金和专业人员等资源，可能会排除更复杂的解决方案。此外，旨在减少停机时间的复杂解决方案，由于在发生意外情况时所需的故障排除水平较高，实际上可能会增加停机时间。


    本书列出了几种解决上述所有点的设计。所提的设计消除了单点故障，并可以扩展以以可接受的性能服务日益增加的用户。书中将介绍可以在物理硬件、虚拟机和云端运行的设计。它们是满足所有要求的要求的简单设计，使其易于实现、管理和支持。


    要下载书中使用的示例配置文件、脚本和图表，请访问：


    `http://www.linuxtrainingacademy.com/ha-lamp`


    # 准备本地测试环境


    如果你想在尝试其他地方之前，在自己的本地工作站上测试书中介绍的设计，我建议安装 `VirtualBox` 和 `Vagrant`。`VirtualBox`
    是一种虚拟化软件，允许你创建虚拟机，你可以在当前操作系统（主机）内部运行操作系统（客机）。`VirtualBox` 支持 Windows、Mac 和 Linux。要安装它，请访问位于
    `https://www.virtualbox.org/wiki/Downloads` 的 VirtualBox 下载页面并获取适用于当前操作系统的安装程序。点击安装屏幕并接受默认设置。


    `Vagrant` 是一种允许创建虚拟测试和开发环境软件。你可以将其视为 `VirtualBox` 等虚拟化软件的封装。它还支持其他虚拟化软件和供应商，如
    `VMware`、`Docker` 和亚马逊云服务 (AWS)。要安装 `Vagrant`，首先从 `https://www.vagrantup.com/downloads.html`
    为你的操作系统下载相应的安装包。接下来，启动安装程序并接受默认设置。安装 `Vagrant` 后，你将能够从命令行访问 `vagrant` 命令。


    如果你将使用 Windows 作为你的主机操作系统，可以选择安装一个命令行 SSH 客户端。如果 `Vagrant` 可以访问 SSH 实用程序，它可以轻松连接到它创建的虚拟机。Mac
    和 Linux 用户已经内置了命令行客户端。如果你没有为 Windows 安装一个，则必须手动连接到它创建的虚拟机。你可以为此目的使用 `Putty` (`http://www.linuxtrainingacademy.com/putty/`)
    或任何你需要的 SSH 客户端。如果你确实想为 Windows 一个命令行 SSH 客户端，可以下载并安装 `git` (`http://www.git-scm.com`)。在安装期间务必选择“在
    Windows 命令提示符中使用 Git 和可选的 Unix 工具”。你的其他选项是从 `https://www.cygwin.com` 安装 Cygwin。


    # Vagrant 快速入门课程


    以下是常用 vagrant 命令列表。


    '
- fmt: "\n`vagrant init [box-name] [box-url]` - Initializes the current directory\
    \ to be a Vagrant environment and creates the Vagrant configuration file `Vagrantfile`.\n\
    \n`vagrant up` - This command creates, configures, and starts the virtual machine\
    \ defined in the `Vagrantfile`. If the virtual machine already exists, it simply\
    \ starts it.\n\n`vagrant halt` - Stops a virtual machine.\n\n`vagrant destroy`\
    \ - Deletes the virtual machine.\n\n`vagrant ssh` - Connects to the virtual machine\
    \ via SSH.\n\nIn the following example I am going to create a directory, or folder,\
    \ for my Vagrant project. Next I am going to initialize that project, configure\
    \ a virtual machine, launch it, and finally connect to it.\n\nThe following commands\
    \ will create a virtual machine that runs Ubuntu 14.04.\n\nNote that the first\
    \ time you run these series of commands an image of the Ubuntu operating system\
    \ will be downloaded from the Internet. This can take several minutes to complete.\
    \ On subsequent runs this process is much quicker as the image used to create\
    \ the virtual machines will already be stored on your system.\n\n## Summary\n\n\
    ```bash\nvagrant init ubuntu/trusty64\nvagrant up\nvagrant ssh\n```\n\n## Example\n\
    \n```bash\n[jason@localbox ~]$ mkdir my-first-test-box\n[jason@localbox ~]$ cd\
    \ my-first-test-box\n[jason@localbox ~/my-first-test-box]$ vagrant init ubuntu/trusty64\n\
    ```\n\nA `Vagrantfile` has been placed in this directory. You are now ready to\
    \ `vagrant up` your first virtual environment! Please read the comments in the\
    \ `Vagrantfile` as well as documentation on `vagrantup.com` for more information\
    \ on using Vagrant.\n\n```bash\n[jason@localbox ~/my-first-test-box]$ vagrant\
    \ up\nBringing machine 'default' up with 'virtualbox' provider...\n==> default:\
    \ Importing base box 'ubuntu/trusty64'...\n==> default: Matching MAC address for\
    \ NAT networking...\n==> default: Checking if box 'ubuntu/trusty64' is up to date...\n\
    ==> default: Setting the name of the VM: my-first-test-box_default_1417836197327_31478\n\
    ==> default: Clearing any previously set forwarded ports...\n==> default: Fixed\
    \ port collision for 22 => 2222\\. Now on port 2204.\n==> default: Clearing any\
    \ previously set network interfaces...\n==> default: Preparing network interfaces\
    \ based on configuration...\n              default: Adapter 1: nat\n==> default:\
    \ Forwarding ports...\n              default: 22 => 2204 (adapter 1)\n==> default:\
    \ Booting VM...\n==> default: Waiting for machine to boot. This may take a few\
    \ minutes...\n              default: SSH address: 127.0.0.1:2204\n           \
    \   default: SSH username: vagrant\n              default: SSH auth method: private\
    \ key\n              default: Warning: Connection timeout. Retrying...\n==> default:\
    \ Machine booted and ready!\n==> default: Checking for guest additions in VM...\n\
    ==> default: Mounting shared folders...\n              default: /vagrant => /home/jason/my-first-test-box\n\
    ```\n\n```bash\n[jason@localbox ~/my-first-test-box]$ vagrant ssh\nWelcome to\
    \ Ubuntu 14.04.1 LTS (GNU/Linux 3.13.0-40-generic x86_64)\n* Documentation:  https://help.ubuntu.com/\n\
    \  System information as of Sat Dec  6 03:23:33 UTC 2014\n  System load:  0.66\
    \                           Processes:                   90\n  Usage of /:   2.7%\
    \ of 39.34GB   Users logged in:                0\n  Memory usage: 16%        \
    \                      IP address for eth0: 10.0.2.15\n  Swap usage:   0%\n```\n\
    \n# The Design\n\nImagine you are designing a system. Before we start we need\
    \ to identify all components that make up the. Let's say our goal is to make the\
    \ stack highly available we need to account for Linux, Apache, MySQL, and PHP.\
    \ There are other points of failure for: [https://www.ubuntu.com/architecture](https://www.ubuntu.com/architecture)\n\
    \n## Typical Application on a Single Server\n\nA typical request looks like this.\
    \ A user types a URL into the browser and hits enter. The website is translated\
    \ into an IP address and the browser connects to the server. If the website is\
    \ static, the web server reads the file and sends it back over the network. If\
    \ the website is dynamic, the web server would query the database to get the content\
    \ as well as any comments. For example, if that blog post had a picture in it,\
    \ the web browser would request that image causing the web server to read.\n\n\
    If a single server is performing all of this work, it will have an IP address\
    \ that corresponds to the website. It will also be running a web server, a database\
    \ server, and storing files on some sort of storage device. By examining how a\
    \ typical request takes place you can see that we will not only need to eliminate\
    \ the single points of failure for Linux, Apache, MySQL, and PHP, but we will\
    \ also need to eliminate single points for storage and networking.\n\n## Scaling\
    \ VS Availability\n\n### Vertical Scaling\n\nYou can scale without increasing\
    \ availability or uptime. Let's say you want to handle more users, more traffic,\
    \ and more load for your web application. If it's a physical server, you could\
    \ power off the server, install more memory and upgrade the CPUs, for instance.\
    \ You could also copy all of your data from a single small server to a larger\
    \ server that has more memory, more CPUs, and faster storage. If you're running\
    \ a virtual server you could stop the server, allocate more resources to it and\
    \ start it up again. If your server is running in the cloud you could change your\
    \ instance type to one that has more resources. This is called vertical scaling,\
    \ or scaling up.\n\n### Horizontal Scaling\n"
