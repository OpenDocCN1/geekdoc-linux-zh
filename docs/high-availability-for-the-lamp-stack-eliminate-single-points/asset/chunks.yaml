    #### Configuring the Cluster Check Utility


    Aclustercheck utility is included with Percona XtraDB Cluster.  This allows the
    status of the cluster to be checked using an HTTP request on port 9200.  If you
    look back at the HAProxy configuration you will see the following.


    backend dbservers


                  balance leastconn


                  option httpchk


                  server db01 192.168.12.61:3306 check port 9200 inter 12000 rise
    3 fall 3


                  server db02 192.168.12.62:3306 check port 9200 inter 12000 rise
    3 fall 3 backup


                  server db03 192.168.12.63:3306 check port 9200 inter 12000 rise
    3 fall 3 backup


    In order to allow requests to be processed by the utility we need to add an entry
    into the/etc/servicesfile for it and enablexinetd.  Perform these actions on all
    nodes in the database cluster.


    vagrant@db01:~$ echo ''mysqlchk 9200/tcp # mysqlchk'' | sudo tee -a /etc/services


