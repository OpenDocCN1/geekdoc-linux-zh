    # Introduction


    One of the most common ways to deliver web applications is through the use of
    the LAMP stack. `LAMP` is an acronym that stands for Linux, Apache, MySQL, and
    PHP. In this design Linux is the operating system, `Apache` is the web server,
    `MySQL` acts as the database, and `PHP` is used as the programming language. This
    architecture can be used to host open source applications or custom written web
    apps. Popular websites like Facebook, Wikipedia, and Yahoo use this design to
    serve millions of users worldwide. Open source applications such as WordPress,
    Drupal, Joomla!, MediaWiki, and SugarCRM also rely on the LAMP stack.


    Whether you are deploying or supporting a custom written application or using
    an open source solution, you''ll want to employ an architecture that maximizes
    the availability of that application, eliminates single points of failure, allows
    you to scale without downtime, and is relatively easy to implement and support.
    It''s better to take the time upfront to account for the requirements and long
    term goals of the service you''re implementing than it is to make architectural
    decisions during an emergency situation like an expected surge of traffic or an
    outage. During an emergency is not the best time to be designing solutions.


    Each project may have varying requirements, but in general there are few important
    points to at least consider. They are redundancy, scalability, performance, and
    manageability. `Redundancy` is how to tolerate failures. `Scalability` is how
    to serve an increasing or decreasing user base. `Performance` is how to ensure
    each user''s experience is at or beyond an acceptable level. Having a redundant,
    scalable, performant service means nothing if it''s unmanageable or unsupportable,
    therefore manageability is a key consideration. Who is going to implement the
    design? Who is going to support it? Is it feasible to scale in the manner laid
    out in the design? Sometimes more complex solutions can be ruled out due to the
    lack of resources such as available finances and specialized staff. Also, complex
    solutions that were designed to decrease downtime can actually increase downtime
    due to the level of troubleshooting required when something unexpected occurs.


    This book lays out a couple of designs that address all the previous points. The
    designs proposed eliminate single points of failure and can be scaled to serve
    an increasing number of users with acceptable performance. Designs will be presented
    that work on physical hardware, virtual servers, and in the cloud. They are relatively
    simple designs that meet all of those requirements, making them easy to implement,
    manage, and support.


    To download the example configuration files, scripts, and diagrams used in this
    book visit:


    `http://www.linuxtrainingacademy.com/ha-lamp`


    # Preparing a Local Test Environment


    If you would like to test the designs presented in this book on your own local
    workstation before trying them elsewhere, I recommend installing `VirtualBox`
    and `Vagrant`. `VirtualBox` is virtualization software that allows you to create
    virtual machines where you can run an operating system (guest) inside your current
    operating system (host). `VirtualBox` is supported on Windows, Mac, and Linux.
    To install it, visit the VirtualBox download page located at `https://www.virtualbox.org/wiki/Downloads`
    and grab the installer for your current operating system. Click through the install
    screens and accept the defaults.


    `Vagrant` is software that allows you to easily create virtual test and development
    environments. You can think of it as a wrapper around virtualization software
    such as `VirtualBox`. It also supports other virtualization software and providers
    such as `VMware`, `Docker`, and Amazon Web Services (AWS). To install `Vagrant`,
    first download the appropriate installer package for your operating system from
    `https://www.vagrantup.com/downloads.html`. Next, launch the installer and accept
    the defaults. After `Vagrant` is installed you will be able to access the `vagrant`
    command from the command line.


    If you are going to be using Windows as your host operating system you can optionally
    install a command line SSH client. `Vagrant` can easily connect you to the virtual
    machines it creates if it has access to an SSH utility. Mac and Linux users already
    have a built in command line client. If you don''t install one for Windows you
    will have to manually connect to the virtual machines it creates. You can use
    `Putty` (`http://www.linuxtrainingacademy.com/putty/`) or any other SSH client
    that you desire for this purpose. If you do want a command line SSH client for
    windows you can download and install `git` (`http://www.git-scm.com`). Be sure
    to select "Use Git and optional Unix tools from the Windows Command Prompt" during
    the install. Your other option is to install Cygwin from `https://www.cygwin.com`.


