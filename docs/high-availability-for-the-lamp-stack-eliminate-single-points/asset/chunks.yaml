    \n# 设计\n\n想象你正在设计一个系统。在我们开始之前，我们需要识别组成系统的所有组件。假设我们的目标是使技术栈具有高可用性，我们需要考虑 Linux、Apache、MySQL\
    \ 和 PHP。其他故障点还有：[`www.ubuntu.com/architecture`](https://www.ubuntu.com/architecture)\n\
    \n## 单机服务器上的典型应用\n\n一个典型的请求如下：用户在浏览器中输入 URL 并按回车。网站被解析为 IP 地址，浏览器连接到服务器。如果网站是静态的，Web\
    \ 服务器读取文件并通过网络将其回传。如果网站是动态的，Web 服务器将查询数据库以获取内容以及任何评论。例如，如果那篇博客文章有一张图片，网络浏览器将请求该图片，导致\
    \ Web 服务器进行读取。\n\n如果由单台服务器执行所有这些工作，它将有一个与网站对应的 IP 地址。它还将运行一个 Web 服务器、数据库服务器，并在某种存储设备上存储文件。通过检查典型请求的发生过程，你可以发现我们不仅需要消除\
    \ Linux、Apache、MySQL 和 PHP 的单点故障，还需要消除存储和网络的单点故障。\n\n## 扩展性 VS 可用性\n\n### 垂直扩展\n\
    \n你可以在不增加可用性或运行时间的情况下进行扩展。假设你想为你的 Web 应用程序处理更多的用户、更多的流量和更大的负载。如果是物理服务器，你可以关闭服务器、安装更多内存并升级\
    \ CPU 等。你还可以将所有数据从单台小服务器复制到一台具有更多内存、更多 CPU 和更快存储的大型服务器上。如果你运行的是虚拟机，可以停止服务器，为其分配更多资源并重新启动。如果你的服务器运行在云端，你可以将实例类型更改为具有更多资源的类型。这被称为垂直扩展，或向上扩展。\n\
    \n### 水平扩展\n\n"
- fmt: "\nAnother way to scale is to add more servers, which you'll sometimes hear\
    \ referred to as nodes. This is called horizontal scaling or scaling out. In order\
    \ to scale horizontally you'll need to do a bit of upfront work and design for\
    \ it. In order to go from one web server, for instance, to two web servers you'll\
    \ need a way to route traffic to the additional node and preferably spread that\
    \ load between the two servers. If you need more resources, add a third or fourth\
    \ server. When you only have one server and it goes down you have a service outage,\
    \ but if you have several servers performing the same function and one of them\
    \ goes down the worst case scenario is that the service is degraded and doesn't\
    \ perform as well as it typically does. The best case scenario is having a single\
    \ failure be practically unnoticeable.\n\n## The Best of Both Worlds\n\nIn many\
    \ cases it makes sense to scale your web servers horizontally while you scale\
    \ your database servers vertically. Next, we'll cover how to get the best of both\
    \ worlds while eliminating, or at least greatly reducing, the downtime for your\
    \ service.\n\n## The High Availability Architecture\n\nThis diagram shows the\
    \ architecture deployed on a total of five servers. Three servers will act as\
    \ a database cluster while the other two servers will run the remaining services.\
    \ Running multiple services on a single node is sometimes referred to as pancaking.\
    \ We'll first deploy the multiple services on two nodes and afterwards discuss\
    \ how these services can be broken up, run across various numbers of servers,\
    \ and scaled.\n\n![ha-design-book.jpg](images/00003.jpeg)\n\n### Building the\
    \ Servers (Vagrant Configuration)\n\nTo create a local test environment and deploy\
    \ the servers for this architecture, use the following `Vagrantfile`. Remember\
    \ to create a directory specifically for this `Vagrantfile` and run the associated\
    \ `vagrant` commands from within that directory.\n\nTo download these as well\
    \ as the other configuration files used throughout this book visit: [http://www.linuxtrainingacademy.com/ha-lamp](http://www.linuxtrainingacademy.com/ha-lamp)\n\
    \nThis configuration creates the following virtual machines:\n\n| Server Name\
    \ | Public IP | Private IP |\n| :--- | :--- | :--- |\n| server01 | 10.11.12.51\
    \ | 192.168.12.51 |\n| server02 | 10.11.12.52 | 192.168.12.52 |\n| db01 | 10.11.12.61\
    \ | 192.168.12.61 |\n| db02 | 10.11.12.62 | 192.168.12.62 |\n| db03 | 10.11.12.63\
    \ | 192.168.12.63 |\n\n```ruby\nVAGRANTFILE_API_VERSION = \"2\"\n\nVagrant.configure(VAGRANTFILE_API_VERSION)\
    \ do |config|\n  config.vm.define \"server01\" do |server01|\n    server01.vm.box\
    \ = \"ubuntu/trusty64\"\n    server01.vm.hostname = \"server01\"\n    server01.vm.network\
    \ :private_network, ip: \"10.11.12.51\"\n    server01.vm.network :private_network,\
    \ ip: \"192.168.12.51\", virtualbox__intnet: true\n  end\n  config.vm.define \"\
    server02\" do |server02|\n    server02.vm.box = \"ubuntu/trusty64\"\n    server02.vm.hostname\
    \ = \"server02\"\n    server02.vm.network :private_network, ip: \"10.11.12.52\"\
    \n    server02.vm.network :private_network, ip: \"192.168.12.52\", virtualbox__intnet:\
    \ true\n  end\n  config.vm.define \"db01\" do |db01|\n    db01.vm.box = \"ubuntu/trusty64\"\
    \n    db01.vm.hostname = \"db01\"\n    db01.vm.network :private_network, ip: \"\
    10.11.12.61\"\n    db01.vm.network :private_network, ip: \"192.168.12.61\", virtualbox__intnet:\
    \ true\n  end\n  config.vm.define \"db02\" do |db02|\n    db02.vm.box = \"ubuntu/trusty64\"\
    \n    db02.vm.hostname = \"db02\"\n    db02.vm.network :private_network, ip: \"\
    10.11.12.62\"\n    db02.vm.network :private_network, ip: \"192.168.12.62\", virtualbox__intnet:\
    \ true\n  end\n  config.vm.define \"db03\" do |db03|\n    db03.vm.box = \"ubuntu/trusty64\"\
    \n    db03.vm.hostname = \"db03\"\n    db03.vm.network :private_network, ip: \"\
    10.11.12.63\"\n    db03.vm.network :private_network, ip: \"192.168.12.63\", virtualbox__intnet:\
    \ true\n  end\n  config.vm.provider :virtualbox do |vb|\n    vb.customize [\"\
    modifyvm\", :id, \"--memory\", \"320\"]\n  end\nend\n```\n\nRun the following\
    \ commands to create the virtual machines.\n\n```bash\n$ mkdir halamp\n$ cd halamp\n\
    $ vi Vagrantfile  # Use your favorite editor\n$ vagrant up\n```\n\nTo connect\
    \ to a specific virtual machine supply it's name after the `vagrant ssh` command.\
    \ Here are a couple of examples:\n\n```bash\n$ vagrant ssh server01\n$ vagrant\
    \ ssh db02\n```\n\n### Configuring High Availability for the IP Address\n\nTo\
    \ eliminate the single point of failure for the DNS name of the website we will\
    \ create a floating IP, or virtual IP (`VIP`), that can be assigned to either\
    \ of the front end servers. It will only be associated with one server at a time.\
    \ If the server fails, the IP will \"float\" to the other server. We will use\
    \ Keepalived and `VRRP` (Virtual Router Redundancy Protocol) to control the `VIP`.\
    \ This works well when you are using physical or virtual servers. We'll cover\
    \ how to handle this point of failure in the bit.\n\nYou need to perform these\
    \ actions on both the end servers to install Keepalived.\n\n```bash\nvagrant@server01:~\
    \ sudo apt-get -y keepalived\nvagrant@server02:~ sudo apt-get -y keepalived\n\
    ```\n\nOn `server01`, use the following configuration in `/etc/keepalived/keepalived.conf`:\n\
    \n```conf\nvrr_script chk_hapxy {\n    script \"killall haproxy\"\n    interval\
    \ 2\n}\n\nvrr_instance VI_1 {\n    state MASTER\n    interface eth1\n    router_id\
    \ 5\n    priority 101\n    vrr_unicast_bind 192.168.12.51\n    vrr_unicast_peer\
    \ 192.168.12.52\n    virtual_ip {\n        address 10.11.12.50\n    }\n    track_script\
    \ {\n        chk_hapxy\n    }\n}\n```\n\nOn `server02`, use the following configuration\
    \ in `/etc/keepalived/keepalived.conf`:\n\n```conf\nvrr_script chk_hapxy {\n \
    \   script \"killall haproxy\"\n    interval 2\n}\n\nvrr_instance VI_1 {\n   \
    \ state BACKUP\n    interface eth1\n    router_id 5\n    priority 100\n    vrr_unicast_bind\
    \ 192.168.12.52\n    vrr_unicast_peer 192.168.12.51\n    virtual_ip {\n      \
    \  address 10.11.12.50\n    }\n    track_script {\n        chk_hapxy\n    }\n\
    }\n```\n"
