      end


      config.vm.define "db02" do |db02|


                  db02.vm.box = "ubuntu/trusty64"


                  db02.vm.hostname = "db02"


                  db02.vm.network :private_network, ip: "10.11.12.62"


                  db02.vm.network :private_network, ip: "192.168.12.62", virtualbox__intnet:
    true


      end


      config.vm.define "db03" do |db03|


                  db03.vm.box = "ubuntu/trusty64"


                  db03.vm.hostname = "db03"


                  db03.vm.network :private_network, ip: "10.11.12.63"


                  db03.vm.network :private_network, ip: "192.168.12.63", virtualbox__intnet:
    true


      end


      config.vm.provider :virtualbox do |vb|


                  vb.customize ["modifyvm", :id, "--memory", "320"]


      end


    end


    Run the following commands to create the virtual machines.


    $ mkdir halamp


    $ cd halamp


    $ vi Vagrantfile   # Use your favorite editor


    $ vagrant up


    To connect to a specific virtual machine supply it''s name after the vagrant ssh
    command.  Here are a couple of examples:


    $ vagrant ssh server01


    $ vagrant ssh db02


    ### Configuring High Availability for the IP Address


    To eliminate the single point of failure for the DNS name of the website we will
    create a floating IP, or virtual IP (VIP), that can be assigned to either of the
    front end servers.  It will only be associated with one server at a time.  If
    the server it is associated with fails, the IP will "float" over to the other
    server.  We will use Keepalived to implement the floating IP.  Keepalived uses
    VRRP (Virtual Router Redundancy Protocol) to control the VIP.  This design works
    well when you are using physical or virtual servers.  We''ll cover how to handle
    this single point of failure in the cloud in the a bit later.


    You will need to perform these actions on both of the front end servers in order
    to install Keepalived.


    vagrant@server01:~$ sudo apt-get install -y keepalived


    vagrant@server02:~$ sudo apt-get install -y keepalived


    On server01, use the following configuration in the/etc/keepalived/keepalived.conf
    file.


    vrrp_script chk_haproxy {


                  script "killall -0 haproxy"


                  interval 2                                # check every 2 seconds


    }


    vrrp_instance VI_1 {


                  state MASTER


                  interface eth1


                  virtual_router_id 51


                  priority 101


                  vrrp_unicast_bind 192.168.12.51   # Internal IP of this machine


                  vrrp_unicast_peer 192.168.12.52   # Internal IP of peer


                  virtual_ipaddress {


                                    10.11.12.50 dev eth1 label eth1:vip1


                  }


                  track_script {


                                    chk_haproxy weight 2


                  }


    }


    On server02, use the following configuration in the/etc/keepalived/keepalived.conf
    file.


    vrrp_script chk_haproxy {


                  script "killall -0 haproxy"


                  interval 2                                # check every 2 seconds


    }


    vrrp_instance VI_1 {


                  state BACKUP


                  interface eth1


                  virtual_router_id 51


                  priority 100


                  vrrp_unicast_bind 192.168.12.52   # Internal IP of this machine


                  vrrp_unicast_peer 192.168.12.51   # Internal IP of peer


                  virtual_ipaddress {


                                    10.11.12.50 dev eth1 label eth1:vip1


                  }


                  track_script {


                                    chk_haproxy weight 2


                  }


    }


    This configuration uses unicast for VRRP instead of the default multicast.  This
    configuration will work where multicast is not enabled, reliable, or supported. 
    This type of situation is common in virtual environments.  Assign the private
    IP of the server tovrrp_unicast_bind and the private IP of the other server tovrrp_unicast_peer. 
    The virtual IP in this example is 10.11.12.50.


    Also be aware that the router ID needs to be the same on all the nodes.  The priority
    of the master server should be higher than the backup server.  The server with
    the highest priority will be assigned the VIP.  In this configuration we used
    a priority of 101 for the master and 100 for the backup node.  If HAProxy is functioning
    properly the priority is adjusted by its weight.  If both nodes are functioning
    normally server01 will have a priority of 103 (101 + 2), while server02 will have
    a priority of 102 (100 + 2).  If HAProxy were to die on server01 it''s priority
    would go down to 100, making server02''s priority higher.  In this situation the
    VIP would be removed from server01 and associated to server02.'
