    #### Bootstrapping the Cluster


    Next, we need to bootstrap the cluster.  We''ll do this on db01.


    vagrant@db01:~$ sudo service mysql bootstrap-pxc


    We need to create a user that will perform the state snapshot transfers (SST). 
    A SST occurs when a node joins, or rejoins, the cluster.  This process copies
    the data from one active node in the cluster, called a donor, to the joining node,
    called a joiner.  Here are the commands to create that database user.


    vagrant@db01:~$ sudo mysql -e "CREATE USER ''sstuser''@''localhost'' IDENTIFIED
    BY ''sstuser'';"


    vagrant@db01:~$ sudo mysql -e "GRANT RELOAD, LOCK TABLES, REPLICATION CLIENT ON
    *.* TO ''sstuser''@''localhost'';"


    vagrant@db01:~$ sudo mysql -e ''FLUSH PRIVILEGES;''


    At this point the cluster is up with a single node.  You can check the node count
    using the following command.


    vagrant@db01:~$ sudo mysql -e "show status like ''wsrep_cluster_size'';"


    +--------------------+-------+


    | Variable_name                | Value |


    +--------------------+-------+


    | wsrep_cluster_size | 1     |


    +--------------------+-------+


    Next we can bring the other two nodes into the cluster.  Let''s start MySQL (Percona
    XtraDB Cluster) on the remaining nodes.


    vagrant@db02:~$ sudo service mysql start


    vagrant@db03:~$ sudo service mysql start


    From any node you can query the cluster size to see that all three nodes are now
    members.


    vagrant@db02:~$ sudo mysql -e "show status like ''wsrep_cluster_size'';"


    +--------------------+-------+


    | Variable_name                | Value |


    +--------------------+-------+


    | wsrep_cluster_size | 3                  |


