    # Sequence diagrams


    A sequence diagram describes interactions how things are carried out. They''re
    great when you want to describe sequences that depend on many factors.


    A sequence diagram begins with the sequenceDiagram followed by the list of participants,
    which are defined using (each participant is defined in a separate line). After
    that, you need to define the connections between participants, which in Mermaid
    terminology are called Messages.


    This Mermaid code produces a sequence - it''s part of seq_diagram.md Markdown
    file:


    ```

    ```sequenceDiagram

    participant User

    participant CTC

    participant CSV

    participant Auth as Authorization

    loop Every minute

    CTC->>CSV: Keep updating!

    User->>Auth: Send authorization

    Auth->>User: Get authentication token

    ```

