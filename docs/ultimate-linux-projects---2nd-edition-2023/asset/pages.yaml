    # DAST


    # Build a dynamic app security pipeline pipeline


    Dynamic Analysis Security Testing takes centre in this coding tutorial with Tim
    Armstrong


    ![](img/66a411423a4efb7292729654aedb4820_77_0.png)


    he battle between developers and malicious hackers is one that developers have
    been losing. At the end of time, it comes down to mentality and priorities. Hackers,
    like burglars, need to find a single open or unlocked door only once while you
    have to lock every door in range of 3,000-30,000, depending on your approach.


    ![](img/66a411423a4efb7292729654aedb4820_77_1.png)


    ![](img/66a411423a4efb7292729654aedb4820_77_2.png)


    Tim Armstrong is a Lead Engineer specialising in networking, software development.
    You can find him on Twitter @omatchatru or via his website at www.testmores.com.


    Dynamic Analysis Security Testing (DAST) is perhaps the most important type of
    security testing, frequently requested to be every six months by an consultancy
    that does an automated scan with Burp Suite or Zero Attack Proxy (ZAP) and provides
    you with a list of vulnerabilities found. In most cases, the consultants don''t
    go further than the automated scan can do at that point they only identify vulnerabilities.


    But here''s the thing: when the malicious actors hack your app via site or API,
    they are not checking if your code is normally formed, they''re essentially looking
    for a place where you''ve unvalidated the input, an endpoint that you''ve forgotten
    to protect, a vulnerable login system, leaked credentials and unauthorized data
    access to detect. By running a test on every six months you don''t get your security
    reports that you''re out of date.


    Building DAST into CI/CD takes a few minutes and gives you effectively that that
    you''ve got from a pen-test where they were run as an automated scanner. This
    means instead of only occurring every six months it happens sometime to merge
    in the main branch – meaning you find out about the vulnerability when it gets
    merged. Ultimately this means that when you do it in the correct pipeline month-check,
    you actually get your money''s worth!


    In this tutorial, you''ll be adding DAST to a GitLab CI/CD pipeline. We have covered
    this in Linux format (LXFX 270), if you have to manage them, and it''s a good
    idea to check out first, but if


    Adding an scan in StackHawk is pretty straightforward, with a clean workflow and


    you just to dive in at this point, then you can pick up a copy of the progress
    so far at Github://github.com/stackhawk/web-app-security-tutorial v2.


    # Too many concerns


    When it comes to DAST there are a growing number of solutions on the market. Most
    of them use scanners on a periodic schedule, so however you need to expose a test
    environment to the internet and have the app that you need to set up it is a bit
    tricky which can lead to the instability of the environment.


    The goal here is, as when you added analysis and software analysis composition
    to the pipeline, to know about vulnerabilities before the code goes live so you
    can fix them before they gets deployed.


    When you need something, then you can run it test the service on commit. What
    are your options? Could you build your code around an open-source tool like ZAP,
    or pick up an off-the-shelf solution? Unfortunately, most DAST scanners are hard
    to integrate directly into your pipeline, with the leaders in this space being
    StackHawk and GitLab.


    StackHawk''s scanner, HawkScan, is more advanced than GitLab''s version and has
    support for multiple authentication methods and is easy to customise the scanner.
    While StackHawk holds the lead in scanning capabilities, GitLab is ahead in pricing
    for


