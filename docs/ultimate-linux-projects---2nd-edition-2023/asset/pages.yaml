    # MAKING OF THRESHOLD COMMANDS


    In the s-tui config file, /s-tui.conf directory also contains a directory called
    hooks-d. You can place custom scripts you wish to execute when a certain threshold,
    such as CPU temperature or frequency is exceeded. The name of the script must
    be -name=source, where -name is the name of the source source. You can use S-TUI
    to track running scripts based on CPU temperature threshold setting.


    The default threshold value for the CPU temperature is 80. To change this


    you must modify the value in s-tui -t threshold=value. You can then save the new
    threshold value in the =~/s-tui/s-tui.conf file by saving the settings within
    S-TUI.


    If you make any changes to the settings within the S-TUI interface, and wish to
