    # # Build a custom digital signage system


    Discover how to create a digital signage display for an open-source conference
    using Xibo digital signage and the help of Matt Holder.


    ![](img/66a411423a4efb7292729654aedb4820_29_1.png)


    Most Linux aficionados have noticed an increase in the number of large-format
    screens in public places, displaying a range of information. This is digital signage.
    In this tutorial we''ll be looking at Xibo, a flexible system that can be used
    to show images, mapping data, tables of information, videos, weather data, embedded
    HTML and more. We''ll demonstrate how to set up a server and client, finally designing
    a layout and selecting content.


    ![](img/66a411423a4efb7292729654aedb4820_29_2.png)


    The system comprises a server component, which is open source, and an unlimited
    number of clients for different display types. The Windows and Linux clients are
    free and open source, whereas the other platforms are paid-for, licensed clients.
    The server can be self-hosted, or hosted by your team members.


    Before going any, let''s talk about the terminology used in these. The display
    is the name of the devices which run the player and client software. This could
    be a PC, Android device or large-screen TV. Embedded software displays can be
    grouped to group multiple displays and content can be scheduled to run at specific
    times. Regions are used to define what content should appear on.


    Layouts are defined by the user to define what content should be displayed on
    specific areas of the display. You can split it into Regions, which explains the
    basic concepts of the Xibo digital signage system.


    > QUICK TIP Using PHP functions, many advanced projects can be carried out. For
    example, if information is held in a database about meeting room, the current
    date and time can be used by the CMS to serve relevant content to the players.
    See https://community.xibo.org/getting-started-datasets/14469/


    ![](img/66a411423a4efb7292729654aedb4820_29_3.png)


    +   - Enter your username and password at the login.


    Each Region can display a number of pieces of content within it themselves. These
    concepts will become clearer as we work through this tutorial.


