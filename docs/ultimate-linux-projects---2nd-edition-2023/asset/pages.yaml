  md: '# Ultimate Linux Projects


    # GAMING


    # Connect, configure and use gamepads


    Planning some Raspberry Pi gaming? Christian Cawley shows you how to set up a
    game controller with or without an emulator.


    Lanning to play some games on your Raspberry Pi? Minecraft Pi is far easier to
    play with a game controller, but if you have eyes on Doom or other action classics,
    alternatively, you could be using a controller to your Raspberry Pi-based retro
    gaming system.


    A good selection of game controllers can be connected to your Raspberry Pi using
    USB. However, some can also be linked up using Bluetooth.


    In all theory, Raspberry Pi supports everything from generic USB joysticks and
    keyboards to Bluetooth devices. So, you can expect to connect an Xbox controller
    and a PS4 controller to your Raspberry Pi. Xbox 360 will also work, as will Nintendo
    games.


    Own a PlayStation 5? The new Sony console features a major revision of the well-known
    game controller. But in 2020, the Raspberry Pi will easily connect to the new
    controller, just like its predecessor.


    Meanwhile, Xbox Series S and X backward controllers have also been used on an
    Xbox One console. The new controller design should also work with your Raspberry
    Pi.


    In this tutorial, we will look at what you need to do to connect the most widely
    used game controllers to a Raspberry Pi: those intended for Xbox One, Xbox 360
    and PS3 consoles. We will begin with the Xbox One, which boasts of the most popular
    game controllers available. Also compatible with PC games.


    ![](img/66a411423a4efb7292729654aedb4820_125_0.png)


    +   YOU NEED

    > Raspberry Pi 3 or later

    > game controller

    > Raspberry Pi OS

    > USB cable


    Most controllers will connect to the Raspberry Pi using Bluetooth or USB. For
    wireless Xbox controllers, however, you''ll need a USB receiver device.


    ```

    [bluetooth] - agent on

    Agent is already registered

    [bluetooth] - default agent

    Default agent: scan failed

    ```


    Configure Bluetooth to accept connections from Bluetooth game controllers, then
    change the MAC address to enable easy connection.


    This is a well-designed, multi-controller that can be connected to your Raspberry
    Pi, either using USB or Bluetooth.


    Connect the Xbox controller to your Raspberry Pi by starting and upgrading Raspberry
    OS:


    ```

    sudo apt update

    sudo apt upgrade

    sudo apt install

    ```


    Now connect the controller. Try it out with a game. controllers will be built
    in - if not use


    Follow the steps to install the driver, reboot the Raspberry Pi, and try.


    Using a Xbox controller with Raspberry Pi is a little complicado. Two of wireless
    controllers have been released, however, while the others are wired. How can you
    use them?


    If your Xbox controller has Wi-Fi, the back button is the same colour as the controller
    where the triggers and shoulder/buttons are. Xbox controllers, meanwhile, have
    a single-coloured face. So, around the Raspberry Pi it is the same colour as of
    the controller face.


    To go deep in one compartment, the model number is: 1697 If it is a wireless controller,
    you''ll need to connect the official Microsoft Xbox adapter to your Raspberry
    Pi using USB dongle. This is a simple thing that should work out of the box. Simply
    plugging the buttons on the adapter and the Xbox One controller to yours, sync,
    then pair.


    For the 1708 controller, you''ll need the xboxdrv driver, as described earlier.
    You''ll need to


