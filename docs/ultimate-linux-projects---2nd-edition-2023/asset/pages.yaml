  md: '# Connect, configure and use gamepads TUTORIAL


    disable ERTM (Enhanced Re-Transmission Mode) when enabled this prevents bluetooth
    syncing between the Xbox controller and your Raspberry Pi.


    ```

    echo ''options bluetooth disable, ertm=Y'' | sudo tee -a /etc/modprobe.d/bluetooth.conf

    ```


    Follow this by rebooting the Raspberry Pi

    sudo reboot


    # Start Bluetooth tools


    At the Bluetooth# prompt, enable the agent and set it as follows:


    ```

    agent on

    dault-agent

    ```


    Next up Xbox One controller and hold the scan button quickly.


    ```

    scan on

    ```


    to search for the MAC address, comparing several pairs of addresses and numbers
    by "Wireless Controller". Use the MAC address that connects your Xbox


    ```

    connect [YOUR MAC ADDRESS]

    ```


    When you''re connected you will be able to play. To save time connecting the controller
    manually in future


    ```

    trust [YOUR MAC ADDRESS]

    ```


    But what if you prefer to use a PS4 controller with Raspberry Pi? The steps described
    above for Xbox also apply, and you can connect via USB or Bluetooth.


    # Using other or different controllers


    If you don''t have a controller (or you need to buy them because they can be pricey
    these days), it might be easier to use a gamepad from an older generation of consoles,
    such as the Xbox 360 or PlayStation 3.


    Connecting any Xbox controller will work out of the box, but the Xbox model will
    require a dedicated wireless receiver. This option is straightforward, but Bluetooth
    requires some configuration.


    After updating and restarting the Raspberry Pi, install this software. The PS3
    can communicate with the Raspberry Pi over Bluetooth:


    ```

    sudo apt install libusb-dev

    ```


    Next, create a folder for the software, then compile and make it executable:


    ```

    mkdir ~/sixpair

    cd ~/sixpair

    git clone https://github.com/pi-retro/sixpair.git

    make

    chmod +x sixpair-sixpair

    ```


    Now you need to connect the controller to the Raspberry Pi and run sixpair to
    configure the Bluetooth


    ```

    sudo ~/sixpair/sixpair

    ```


    ![](img/66a411423a4efb7292729654aedb4820_126_0.png)


    Xbox game work out of the box, but if you''re not using RetroArch, RetroPie you
    will need to install the driver.


    +   QUICK TIP

    Don''t use an old Raspberry Pi Model 8/ B+ with Bluetooth - it will be slow down.
    Connect Bluetooth controllers to Raspberry Pi 3 or later. For the best results
    use Raspberry Pi 4.


    Make note of the MAC code, disconnect the PS3 controller. You''re ready to start
    bluetooth as explained in the instructions for the Xbox.


    Note that you''re not limited to console controllers -almost any controller can
    be connected to a Raspberry Pi. If you have a top-end USB controller for PC, there''s
    a suitable USB driver available as well. The advantage of this is that if you''re
    building a gaming system, you can use your controller over USB for whatever.


    For other controllers, wireless means should work easily. Any bluetooth gamepad
    can be connected via bluetooth and no special setup may be required.


    Whatever you''ve connected, you may need to test it. by simply using the tool
    in the Linux kernel:


    ```

    sudo apt install joystick

    ```


    Then run


    ```

    sudo test /dev/input/js0

    ```


    This will help you test unresponsive buttons and thumbs sticks for troubleshooting


    # CONTROLLERS AND RETRO GAMING


    While you need to manually install drivers on the Raspberry Pi for gaming controllers,
    with RetroPie, RetroArch it is so easy. If you''re using a USB controller or have
    already installed the gamepad runtime setting on your system, the drivers are
    installed.


    Start by connecting the USB controller. If you''re using Bluetooth, put the gamepad
    into pairing mode, then with a USB controller navigate to Settings -> Bluetooth
    Controller. Select the controller from the list, then


    Once detected, RetroArch will prompt the button mapping for each option. For instance,
    press the button you want to use. If you make a mistake, you''ll need to restart
    the process for the controller in question.


    Usually this doesn''t take too long -once buttons and controls you''ll be ready
    to start playing games.


