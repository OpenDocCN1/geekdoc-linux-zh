    # Coding a Space Invaders clone


    Calvin Robinson will always extend the hand of friendship – unless menacing aliens
    are descending from the skies, in which case... blast ''em!


    Space Invaders is probably the most famous space shooter of all time, released
    back in 1978 for arcade. Designed by Tomoh Nishikado for Taito in Japan, Space
    Invaders was an fixed shooter where the player controlled a ship. The player controlled
    the screen and it was their job to move left and right to avoid enemies, while
    shooting down the screen to destroy them. Nice and simple fun, so we''ve got an
    idea of creating our own take on this classic.


    ![](img/66a411423a4efb7292729654aedb4820_73_0.png)


    around, but it''s a module worth exploring further. To install pygame, open a
    terminal and run `pip3 install pygame`. Let''s get started by importing random
    module and then declare and initialize all of our global variables:


    Calvin Robinson is a former assistant principal and computer science teacher who
    has a degree in Computer Games Design and Programming.


    We''ll be using Pygame to create our game, since Python is an accessible, high-level
    programming language that is completely free and should be installed on most systems.
    By default, there are multiple versions of Python, so let''s make sure we''re
    using the correct version. Check this by typing `python --version`.


    Once installed, we can use any text editor or the built-in IDLE editor. We''ll
    need to remember File->New File to save our script document because Pygame IDLE
    opens a blank window, which wont save any changes. If you''re using another text
    editor, just sure to save the file with the .py extension, and then run it from
    the terminal command:


    An intro screen, ready for the game to begin.


    ```

    import pygame

    pygame.init()


    s = pygame.display.set_mode((800, 600))

    pygame.display.set_caption(''Space Invaders'')


    clock = pygame.time.Clock()


    font = pygame.font.SysFont(''Arial'', 60)


    text = font.render(''START SCREEN'', True, ''white'')

    # PRESS ENTER

    ```


    We''ve set up some placeholders and settings which are most of self-explanatory.
    We have values for points, the player, ammo and our enemies. With setting back
    this way, we''ll be using Oriented Programming to support this tutorial. Not only
    will we be using classes from pygame, but we''ll be creating our own classes and
    functions to repeat code. OOP is the most efficient way of writing programming
    video games.


    Let''s get out started for drawing, updated and erasing lists, since everything
    in the game will be run through arrays we declared and initialised:


