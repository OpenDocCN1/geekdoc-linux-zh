    ![](img/66a411423a4efb7292729654aedb4820_89_0.png)


    subject of this tutorial is Mermaid, which is a Markdown dialect. Simply put,
    Mermaid code looks like Markdown and enables you to create flows, charts and more.
    Based on JavaScript script that renders the Markdown as code because Markdown
    doesn''t offer support for drawing. Mermaid is supported by many editors using
    Microsoft Visual Code, typora and online editors


    ![](img/66a411423a4efb7292729654aedb4820_89_1.png)


    ![](img/66a411423a4efb7292729654aedb4820_89_2.png)


    Mermaid is delivered in blocks. The first line of a Mermaid block specifies the
    type of plot. Values include graph, pie, sequence diagram and flowchart. Each
    type has its own syntax, and it''s built using Markdown files that use the md
    file extension (filename.md), which is what we''ll use for the examples in this
    tutorial.


    ![](img/66a411423a4efb7292729654aedb4820_89_3.png)


    A2


    This diagram shows the output of a simple Mermaid code that creates a graph with
    nodes and is embedded in Markdown. Mermaid enables you to add content to the nodes.


    ![](img/66a411423a4efb7292729654aedb4820_89_4.png)


    A Markdown block begins with ```mermaid and ends with ```. This is the way of
    telling the block what property this is in Mermaid. Mermaid code can also be saved
    in files that use the md file extension (filename.md).


    A3


    ![](img/66a411423a4efb7292729654aedb4820_89_5.png)


    You can find the source code for this tutorial at https://www.mermaid.live/includes/config?PDF=XF2.chart


