  md: '# Raspberry Pi projects


    # Get your kit ready


    Prepare your USB sticks, CD cards and a cup of tea. It’s Raspberry Pi project
    time –


    With more than 34 million units sold, the Raspberry Pi is not only one of the
    world''s most popular computers – it’s also one of the most important. Originally
    designed to help kids learn technology, this impressive single-board system is
    the leading choice for makers, developers and hobbyists who want to do everything
    from building robots to setting up retro machines. Whether you''re aged eight
    or 80, the Raspberry Pi is made for you – and there are models ranging from £5
    to £65 to suit budget.


    When you do work with your Raspberry Pi, you''ll need to get an SD card with an
    operating system on it. The official Raspberry Pi OS is a popular choice and in
    many cases it is a great start for many projects, available at www.raspberrypi.org/software/operating-systems.
    There''s also an official Raspberry Pi Imager that you can use to write (or other
    OS) to an SD card, or use NOOBS. Our tool has the advantage of being able to handle
    compressed images.


    ![](img/66a411423a4efb7292729654aedb4820_100_0.png)


    For older models there is another cause of errors. Cheap power supplies are a
    bit of a problem, the Pi 3 need a good 5V or they will switch their power to CPU
    throttling. The Pi 4 switched power input from micro to USB-C, and unfortunately
    this port isn''t USB-C compliant. If you use a fancy smart charger, it won''t
    power the device properly, or it might even damage it.


    You won''t run into these issues if you use the official SD card, so that. If
    you''re opposed to that, we''ll recommend using USB-C cables (the ones that last
    much longer). Cheap chargers should work well, but they may not be so reliable,
    so caveat empir.


    We''ve highlighted some fun, useful and interesting projects to showcase the tremendous
    scope of things that can be achieved with the humble Pi. From remote gaming to
    machine learning and Bitcoin, the possibilities are endless...


    > The Pi 400 model embeds a Pi 4, pictured within a keyboard.


    # Troubleshooting


    Throughout this feature we''ll use a few different OS images, so we''ve made a
    handy guide to writing them below. If you run into issues, it''s worth mentioning
    that a faulty SD might be to blame. It''s worth trying a different one if thing
    goes wrong.


    # WRITING SD CARDS WITH ETCHER


    ![](img/66a411423a4efb7292729654aedb4820_100_1.png)


    ![](img/66a411423a4efb7292729654aedb4820_100_2.png)


    ![](img/66a411423a4efb7292729654aedb4820_100_3.png)


    +   1 Download Etcher

    You''ll find Linux, macOS and Windows at https://etcher.io. On Linux it''s a zipped
    appimage, so once downloaded, run it. chmod 755 on the file (see Properties*)

    Permissions and check the box to allow execution). You can now double-click the
    Appimage to run it (or so from the CL).


    +   2 Prepare the target

    Insert your SD card, select file and navigate to your downloaded image. Select
    target and the mean available drives. Hard drives are hidden to prevent you from
    accidentally overwriting them. Select your SD card, and check to make sure there''s
    nothing important on the card.


    +   3 Write the image

    Hit Flash, enter your password and wait for the progress bar to run. You''ll be
    offered to choose the same name again, which you might want to do if you''re preparing
    a few Pis. Once your SD card is ready for action. Move it from your PC to your
    Pi, power on and let the adventures begin!'
