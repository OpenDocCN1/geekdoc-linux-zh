    In the past few years Linux Format magazine, we introduced a blend of powerful
    and robust as well as nifty tools that help us perform a variety of tasks. From
    everyday text editing, to remote monitors, backups and other administration tasks
    all can be done from the terminal.


    A key metric for maintaining the vitality of a Linux distro, or hardware that
    it runs on, is system performance. Depending on your purpose, you can choose from
    a variety of desktop tools to monitor different components such as CPU frequency
    and temperature and utilisation. But if you prefer the CLI, you will enjoy working
    with S-TUI.


    With S-TUI, which is a Stress-Terminal UI, you can view information graphically
    and monitor frequency, power and utilization. The utility allows you to export
    the data as CSV files. You can configure S-TUI to monitor the values of any components
    being the defined threshold values. When coupled with stress, another command-line
    utility, S-TUI can be used to stress-test your system.


    ![](img/66a411423a4efb7292729654aedb4820_19_1.png)


    Some sensors, such as Power, are only available when you run S-TUI, and not as
    a regular user.


    Installing the tool is straightforward, and the GitHub page describes various
    installation techniques. If your Linux distribution is available, you can also
    install S-TUI with the


    ```

    sudo pip install s-tui

    ```


    For other methodologies, such as installing it from Git, you will have to ensure
    all the dependencies are installed. This could include apt and powbuild. If you
    decide to use S-TUI to stress-test your CPU, you can also install or stress-ng;
    Thankfully, these are available in the repositories of most desktop distributions.


    # Don''t over install


