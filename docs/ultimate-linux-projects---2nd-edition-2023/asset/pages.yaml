    The second command makes the script executable, and as long as /usr/local/bin
    is in your PATH, you can run it anywhere. We use the Docker Examples from the
    official page, as they are two which we''ll need to match that:


    +   - mkdir -nextcloud-proxy

    - wget https://github.com/nextcloud/docker/master/examples/docker-compose-with-nextcloud-proxy/mariadb/docker-compose.yml


    We modify the reverse proxy to allow large uploads. The example also needs buffering,
    so let''s create a /nextcloud-proxy/compose.yml with the following contents:


    ```

    client_max_body_size 0G;

    proxy_set_buffering off;

    ```


    In the same directory we create another Docker Compose file for Nextcloud source:

    FROM widower/nextcloud-g::latest

    COPY upload.conf /etc/nginx/conf.d/upload.conf


    Before we compose all these images, we need to edit the YAML file for the machine
