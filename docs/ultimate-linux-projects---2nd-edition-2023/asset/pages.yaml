  md: "# Coding for micro:bit radio walkie-talkies with Python CODING ACADEMY\n\n\
    To get started, we'll need to import the micro:bit module and the specific functions\
    \ for displaying images and the two buttons, labeled 'a' and 'b'.\n\nFrom microbit\
    \ import display, button_a, button_b\nnNow to display text, we can either 'scroll'\
    \ or 'show' a string of text. The display function offers two options, scroll\
    \ and show, which will display the text accurately – scroll from left to right,\
    \ or one letter at a time:\n\ndisplay.scroll('Hello')\ndisplay.show('World')\n\
    Displaying images is similar to that. The micro:bit will recognize them, but using\
    \ emojis.\n\ndisplay.show(Image.HAPPY)\nsleep(1000)\ndisplay.show(Image.SAD)\n\
    To draw our images we'll need to precisely which LEDs we'd like to use, and how\
    \ bright we'd like them on a scale of 0–9 – 0 off and 9 being bright.\n\n```\n\
    i=image(\"00000\")\n\"22222\"\n\"66666\"\n\"88888\"\ndisplay.show(i)\nsleep(1000)\n\
    ```\n\nFor an easy life, or to save space, we can shrink the window down to a\
    \ single line. The columns remain in place between lines, but by name we can control\
    \ the color of each LED mark.\n\n```\nLEDS=image(\"00000:01111:22222:33333:44444\"\
    )\ndisplay.show(LEDS)\nsleep(1000)\n```\n\nWe used a slightly brighter LED on\
    \ each line to highlight the difference in the tune.\nSince this was originally\
    \ written in December in a festive mood, why not draw a Christmas tree for our\
    \ friends to send to our new micro:bit later?\n\n```\nxmatrix=image(\"00000:00000:05555:00550:00005\"\
    )\ndisplay.show(button_a)\n```\n\nIt's all well good to display our images on\
    \ the micro:bit before we're able to send to another device to receive via the\
    \ buttons. Here's a basic counter that can be used as an example of how functions\
    \ work. We've used an infinite loop, with a small pause (sleep) so as not to overtax\
    \ the processor.\n\n```\nfrom microbit import *\n\ncounter = 0\nnew_value = 0\n\
    ```\n\n```\nwhile True:\n    # decrease by 1 if button A was pressed\n    if button_a.pressed():\n\
    \        new_value = counter - 1\n\n    # increase by 1 if button B was\n```\n\
    \n![](img/66a411423a4efb7292729654aedb4820_94_0.png)\n\nLighting up the image\
    \ and LEDs, row by row.\n\n```\nif button_b.pressed():\n    new_value = counter\
    \ + 1\n\n# reset to 0 if you touch pin\nif pin0.touched():\n    new_value = 0\n\
    \n# stop counter going less than 0\nif new_value < 0:\n    new_value = 0\n\n#\
    \ scroll text if it's less than\nif new_value < 10:\n    display.scroll(str(counter))\n\
    ```\n\n```\nsleep(50)\n```\n\n# MORSE CODE\n\nMicro-bits are for Morse code communication.\
    \ Using images or strings to LEDs, we can use the flash to light up the entire\
    \ LED for a set amount of time. The following code will display a flash for tens:\n\
    \n```\ndisplay.show(flash, 10-wait)\nfor flash in different lengths, depending\
    \ on what we want to represent. We represent dots with short flashes and dashes\
    \ with longer ones. For the purposes of this example, a dot\n```\n\n```\nif flash\
    \ == 'A':\n    display.show(flash, 5-wait)\n    display.show(flash, 10-wait)\n\
    elif flash == 'B':\n    display.show(flash, 5-wait)\ndisplay.show(flash, 5-wait)\n\
    display.show(flash, 10-wait)\ndisplay.show(flash, 5-wait)\ndisplay.show(flash,\
    \ 5-wait)\n```\n\nAfter developing Morse code statements for each letter, we can\
    \ then set up a loop to recognize each letter at a time. We have two buttons on\
    \ the micro:bit, perhaps use one to rotate the 26 letters of the alphabet, showing\
    \ them on the LEDs, and the other button to send the letter. We'd be able to send\
    \ messages to friends, without having to re-program the micro:bit every time we\
    \ want to send something."
