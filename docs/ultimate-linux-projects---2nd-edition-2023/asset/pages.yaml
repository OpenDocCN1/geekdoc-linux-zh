  md: '# Ultimate Linux Projects


    # Image recognition


    Get into machine learning and train Pi to recognize and classify other Pis, without
    having to write a single line of code.


    We''re going to train our Raspberry Pi to identify Raspberry Pis (or other objects)
    with machine learning (ML). Is this important? An example of an application for
    this type of ML is to identify defects in circuit boards. As circuit boards exit
    the assembly line, a machine can then be performed on an Edge Pi to identify a
    defective circuit for troubleshooting needs.


    +   * Raspberry Pi 3, 4 or 0

    * 8GB (or larger) microSD card

    * Raspberry Pi Camera or a USB webcam

