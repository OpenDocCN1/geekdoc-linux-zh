    Get your Raspberry Pi in sync, audible throughout your home.


    Multi-room audio systems can cost a pretty, but who needs to buy an expensive
    set of speakers to achieve the same effect? We''ll use our Raspberry Pi and 3.5mm
    wired speakers/speakers (with 3.5mm audio inputs) to play music from a streaming
    service in sync via Bluetooth from your phone, tablet or computer. We will show
    how to do this with a single speaker and Raspberry Pi and then replicate it in
    others. It is an excellent project for reusing old equipment. If you have a non-Bluetooth
    receiver, just jack in, connect your speakers to your Raspberry Pi.


    Create an account at https://balena.cloud to get the BalenaSound application page.
