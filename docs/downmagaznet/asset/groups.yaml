- md: "# SHELL HACKS\n\n## 88\n\nWe've looked at several terminal-based web browsers\
    \ over the years, and can trace their origins back to when a terminal was a necessity\
    \ rather than choice, because desktops didn't exist. Their main focus was on getting\
    \ access to a website and allowing you to navigate without much difficulty, rather\
    \ than emulating a nonexistent browser. Those apps are still brilliant if you\
    \ need to download a graphics driver in an emergency.\n\nInstallation is easy\
    \ with npm, and there's a Docker image, for simple cloud deployments. The compatibility\
    \ and rendering from a hidden Chromium-based renderer, the results are remarkable.\
    \ Video previews perfectly, drop-down text is rendered, and web browsers are almost\
    \ as easy as they are on the desktop, especially if you're familiar with them.\
    \ Every just works, from SSL-sending element to almost 3D WebGL. It runs smooth\
    \ at 60 frames per second and takes very few resources when needed. CPU, however,\
    \ there are too many keyboard bindings to remove for a mouse, which seems inconvenient\
    \ with the command line. It's alerting an ad blocker. These are all small issues\
    \ that some things to seem single-handedly a decades-old problem but even command-line\
    \ web browsing to the desktop for coolness and readability factors.\n\n## Carbonyl:\
    \ Terminal Browser\n\nCarbonyl renders pages so beautifully that your terminal\
    \ looks like a low-resolution screen green pixel.\n\nYou can search the web for\
    \ instructions on setting a Wayland session.\n\nBut for accessing the modern JavaScript-ridden\
    \ interactive web, they're less ideal. Carbonyl, however, is a terminal browser\
    \ that takes the terminal experience to a new level. Its output is a mixture of\
    \ desktop Fmpeg-to-ASCI.\n\nBy Graham Morrison\nhttps://github.com/fatyb/carbonyl\n\
    \n## 89 Clipboard: Copy and Paste\n\nOn the desktop, the clipboard is entirely\
    \ taken for granted. Many of us use Ctrl+C to copy and Ctrl+V to copy from one\
    \ to the next without even thinking. Those commands, along with Ctrl-X, have become\
    \ muscle memory. But it's not quite simple to use the command line. Historically,\
    \ the command line didn't read this kind of copy and paste it was nearly impossible\
    \ without streams of data. Real hackers were supposed to pipe and filter output\
    \ with commands rather than copy and paste without automation.\n\nThe clipboard\
    \ tool can copy and paste files text.\n\n```\n$cd ~/scripts/\n$ chmod +x *.sh\n\
    $ ./copy-text.sh\n$ ./pbcopy.sh\n$ ./file-to-clipboard.sh\n$ ./file-to-file.sh\n\
    $ ./merge-files.sh\n$ ./pb-to-clipboard.sh\n$ ./pb-to-file.sh\n$ ./copy-text.sh\n\
    $ ./copy-paste.sh\n$ ./Cool Linux Hacks.sh\n$ ./clipboard with content.sh\n```\n\
    \nBy Graham Morrison\nhttps://github.com/Slackclads/clipboard\n\n## HACK 90\n\n\
    ## just: Command Runner\n\nCommand runners are curious things because there are\
    \ many ways to automate the running of commands. Shell commands are the simplest\
    \ and most widely used. If you can type commands into a shell, you can run them\
