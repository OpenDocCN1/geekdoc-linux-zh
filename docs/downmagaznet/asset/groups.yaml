    # Create an SSH Bast with Warpgate


    # HACK

    45


    A bastion host is a server that lives just outside your network, either in a DMZ
    or where it can carry forward services from your network to others. Its location
    makes it a point of attack, bastion servers are typically hardened and audited
    to ensure they cannot breach their security policies. Warpgate is a bastion service
    provided as a single binary that you should build and run on your own hardware.
    It can authenticate and forward-specified SSH, HTTP, TLS and MySQL connections,
    which can be fully logged and recorded for future auditing. This is an essential
    part of making sure a server hasn''t been compromised, and what differentiates
    Warpgate from setting up your own SSH proxy. To set up, the warp command takes
    a simple setup that will step you through its configuration. This includes the
    logic to store the credentials, the SSH listening port, and the port for the admin
    web interface. The service can be used without authentication for either SSH or
    HTTP targets. This starts with registering the SSH keys from the web interface
    or command line adding them to your local user id/.known_hosts file, which is
    what you might with any other SSH server. A target needs to be added to the warp
    configuration file simply by specifying the address, port, and user. It is optional
    for adding MySQL and HTTP targets. Correct configuration can be fetched through
    both the command line and the interface, and you now connect to your network host
    by connecting to Warpgate. The connection is forwarded automatically. While there
    is some text to show the target is working, it is otherwise transparent to the
    client.


    Warpgate sits in your danger zone so that your local clients are better protected
    from the dangers of system-access to the Internet.


