    # GAMING


    # Qonquest 2


    Many games have taken their inspiration from the classic board game Risk. It is
    the original boundary dispute and resource-management game, where players take
    to roll dice to capture neighboring territories, with the decide each army loses
    until one side dominates the territory. Many games have used variations of this
    concept deis and resource management, and it''s particularly common in real-time
    strategy games. But relatively few have come as closely to the original recipe
    Qonquest 2, a strategy game based on the original rules. While things differ slightly
    and take particular advantage of computer being able to make the game more complex
    and unfamiliar.


    # Thorium Nova


    When you read that command is a "bridge simulator," your first thought might be
    that it''s a recreation of the tricky card game. It''s not, a game like Bridge
    Constructor, where you''re tasked with traversing some kind of chaos or river.
    This bridge simulator takes inspiration from Star Trek, rather than structural
    engineering, and the game is in space. Thorium Nova is a spacel sequel to Thorium,
    which was the developers'' first attempt at a space-bridge simulator. True to
    a space bridge command, there are differences controlling aspects of the game,
    including captain, navigation, planning, and engineering communications. Each
    role has its own interface, its own skill set, and set of choices. This multiplayer
    game, with a different player controlling a different state, and everyone needs
    to work together to make the ship yours.


    Unique version of the game, Qonquest is a colorfield strategy game built around
    a map of Europe and its surrounding islands. One difference between this and the
    original is that every territory is independent and not a part of countries. This
    makes the gameplay more interesting and unfamiliar, while the game itself is colorful.
    You can select one of these countries and perform actions to move troops or deploy
    troops into a neighboring territory. It is then that the virtual mouse are erased.
    Another difference between this and the original is in the use of dice: the attacker
    gets to roll dice to decide how many troop units are destroyed, while the defender
    gets two.


    The game itself runs on a server and other players connect through a web browser.
    By default, all of this is automatically set when you run the game. One of the
    main aims of the game is to be accessible and beginner-friendly, and as before-anyone
    can join. Players may join, choose their own state, or be assigned by the flight
    director controlling the server part of the game. Due to the alpha state of the
    game, there are currently no missions, but it''s the flight director and the team
    that set objectives. The navigation station is fully developed, letting you navigate
    to space bodies and align your ship to targets. You can also move inventory holds,
    but the game is still a work in progress, and this is an ideal time to get involved
