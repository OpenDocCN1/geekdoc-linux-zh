    # Kavita: Collection Manager


    There are many ways to track and manage a collection of things, in a simple file
    in your Documents folder or an open source database handcrafted from SQL to desktop
    applications or even spreadsheets. There''s nothing better than finding a tool
    that''s built by someone with the same passion for a specific kind of collection.
    What is Kavita? It''s a self-hosted, web-based collection manager specifically
    for manga, comics. It is not easy, and you can create a collection of anything,
    but text-based graphics will be able to take advantage of integrated bookmarks,
    browser-reading, and the search functionality, plus the image thumbnail used to
    view a collection will look more uniform.


    The project has been built with the Angular framework using the Angular CLI. It
    is an interesting project, originally developed by


    Google to enable good-looking and complex web applications. Kavita includes a
    Linux installer to handle all these dependencies, and many people run the server
    within Docker. Whichichever you choose, it''s easy to get up. The web UI allows
    you to create a user account and ensures that you can then start your own library
    by importing your own titles. Kavita can consume manga as CBR, CBZ, ZIPAR, 7-zip,
    image files, and books from the web.


    Kavita is designed to manage and collect your book and manga while also collecting
    you from the same web interface.


    You can view and read your titles from the web interface, and continue a time
    from where you left off, even from a new session or different computer. You can
    also add them to lists and categories, and easily search across classes and collections
    for phrases you might be looking for. It works especially well on a tablet-where
    you can use it just like an ebook-accessible anywhere from your network-and leaves
    you to start a collection when you need nothing other than.


    ![](img/399caf126e037f28be04b36f402dd3c4_68_0.png)


    By Graham Morrison


    https://github.com/Kareadita/Kavita


