    ## 使用 horcux 安全地拆分文件


    在世界网出现之前，当 BBS 流行时，如果你足够幸运，可以通过拨号上网上网，下载大文件非常困难。当时有几种方法可以实现，但最重要的是很难保持。由于在 Usenet
    上共享文件的流行，将大文件拆分成较小的文件夹以后可以存储在几张软盘上。命名巧妙的 horcux 是一个现代版本，专门设计用于通过加密保护你的文件安全。


    Horcux 使用沙门秘密共享（SSS）在不需要密钥或密码的情况下将文件拆分成多个部分。冗余度允许你从少于总数的文件中还原原始文件。你可以选择将个人数据拆分成
    10 个部分，例如，但设置冗余度。这种想法是，这些位置中的每一个部分让你在需要访问文件时记住密码密码。这些位置可以是物理的（如 U 盘或硬盘），也可以是云存储或远程服务器。只需要两个命令即可完成操作，然而，horcux
    会创建一个绑定，并在你准备好时提示部分数量和冗余度。这是一个棒的主意，与哈利·波特中的同名事物相似，但希望在它们被毁时不会产生同样的后果。


    Boxxy 更好。


