    # SECURITY & PRIVACY


    # HACK 19


    # Parrot OS Desktop Security


    The Parrot OS home page lists four major concerns: security, software freedom,
    a lightweight system, and cross-platform portability. To these concerns, it also
    adds a focus on development stack and the goal to get newbies into good habits.
    Of all these concerns, Parrot is best known for security conscious. However, it
    succeeds in all of these concerns to a degree. By making privacy and security
    tools part of the standard install, Parrot is probably most successful in pushing
    all users - not just newbies into better security habits.


    Based on Debian Testing, Parrot OS is a rolling release, with packages updated
    as soon as they have been tested, although official releases are periodically
    released as well. It also offers a choice of MATE or KDE as a development environment.
    Parrot provides 256MB of RAM, making it lightweight by modern standards and suitable
    for older systems as well as new ones. Its goal of cross-platform portability
    is seen in the number of downloads available. The Home Edition is for penetration
    and other security work programming (Figure 2). Both the Home and Security Edition
    run virtually in Boxes and includes images for VMware and VirtualBox. The Security
    Edition includes variants for x86 without appliances, and also offers a Freebox
    version that runs in a web browser and an ARM7 architecture version. In addition,
    the installation images include a Live Version. Installation is via the Calamares
    installer, one of the simplest installation methods available for.


    Figure 1: The Parrot’s MATE-based desktop.


    ![](img/399caf126e037f28be04b36f402dd3c4_27_0.png)


    Figure 2: The Security Edition contains dozens of scripts and apps, also by the
    extensive menu for penetration testing.


    # Available Applications


    Parrot OS’s most notable feature is its software selection. Only a handful of
    applications are available, such as LibreOffice and Gimp, in keeping with the
    basic principle of installing the minimum software required to reduce the opportunities
    for possible attacks. After these basics, users should install only the security
    they require. Even the game menu includes a chess game - also, for the intellectual
    users that Parrot expects to attract.


    Both editions have the MATE system tools, such as BleachBit for cleaning installed
    software and GParted for partitioning, but only the Security Edition includes
    means for starting an security services. Similarly, both editions include Vim
    and Neovim. However, the Home Edition includes three dedicated programming tools:
    Gean, the programming text editor; likes VSCode, a GUI code editor and ZED site
    for for development, the Security Edition includes an additional five applications
    and links, among them Col, a GUI for Git; Meld, and git-ged; a graphical depiction
    of git history. From the selection of tools available in the two editions, the
    assumption is that the hobbyist programmer will use the Home Edition, and administrators
    and more advanced programmers working on projects, with often remote repositories,
    will install the Security Edition.


