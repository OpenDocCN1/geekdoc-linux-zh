    There has been a steady influx of new audio software for Linux over the past few
    years, and PipeWire looks to make the Linux audio stack professionally performant
    and flexible. When it comes to digital audio, there''s one particular rule that
    rules them all, and that''s Ardour. Ardour is 20 years old now, and it has time
    it becomes the most powerful open source digital audio workstation you can use.
    It''s installed on macOS, Windows, and Linux everywhere, from recording studios
    in America to bedroom studios in South America. It''s powerful because it''s flexible,
    and (like Blender) this power comes from its modality. But if you''re interested
    in recording more than one thing at a time, this might scare you off. In Ardour,
    routing inputs and outputs can be freely patched into other tracks and channels,
    routed through software effects, or to provide surround sound. With a single input
    and only headphones for output, you can create MIDI and audio tracks with virtual
    synthesizers or software machines, arranging them together across the horizontal
    timeline freely. In many ways, this flexibility mimics creativity


    studio with infinite audio sources and destinations to rewire, reconfigure, and
    experiment with. The recording studio metaphor has also helped Ardour an excellent
    tool for professional recording engineers and students, especially because it''s
    a way of crafting music that''s already established in software such as Tools.


    The release of Ableton 20 years ago, changed music and what musicians and recording
    engineers could do with their work workflows. Rather than attempting to emulate
    a mixer and multitrack track recorder, Ableton focused on creating from "clips."
    Clips are blocks of audio, such as bars of a drum loop, a repeating melody, sequence
    of chords, which you place in a grid with variations of the same clip or column.
    That each clip are arranged in rows across neighboring columns, and the row is
    as a sequence. With a single clip, live performance, the piece of music can change
    notes seamlessly between beats. The magic sauce is that Ableton keeps everything
    alive, regardless of the clip''s original tempo, pitch, or even groove.


    +   1. Clips: Ardour now supports clips for creative loops, live performance,
    and recording.

    2. Scenes: All clips in the same row can be played, and everything that is used
    in the background, including their insert effects, are active.

    5. Context Help: Hover over an area to get help on selection. Clip clips and regions
    to access other regions.

    6. Monality: Clips coexist with the standard Ardour functionality.

    7. Properties: Select length, stretches, position, and clip triggers from the
    new properties panel.


    Ableton still dominates the clip-launching DAWs, but it has some serious competition
    from Bitwig Studio (which offers native Live support, like Ableton) and Apple''s
    Logic, which has been augmented with it. Ardour can also be used for clip launching,
    because clip launching is a tool to change the timing alignment built into a four-year
    project to the instruments used by Ardour. The clip handler brings a new "Cue"
    into a place where you can drag and drop clips from the timeline to outside the
    application entry. Each drag and drop will create a new channel, aligned vertically.
    This can be edited from a new panel to set the trigger and release modes, as well
    as the option to trigger another clip from the current one. A horizontal strip
    of clips can be triggered as a scene, and can seen as the more traditional timeline
    view. It works extremely well and feels like a natural extension to the recording,
    editing, and mixing views which are only a single click away, finally bringing
    Ableton into the 21st century.


