    ## 可运行代码


    ![](img/399caf126e037f28be04b36f402dd3c4_81_0.png)


    ## elfcat: 二进制探索器


    elfcat 是一个非常非常小的终端命令。它可爱的名字也隐藏了它的功能；它是一个以人类可读方式输出 (cats) 二进制文件（s）内容的命令，允许你从命令行探索你喜爱的应用程序的隐藏秘密。将二进制文件名作为参数会产生该二进制文件的输出。结果不是人类可读的，也不特别容易访问，因此使用
    elfcat 查看二进制文件更好。输出被合并到一个 HTML 文件中（这在）放入 浏览器中看起来最好。这是一个绝妙的主意，因为输出的 HTML 用于描述二进制文件的。如果你愿意，可以从命令行查看。


    它比使用其他工具反编译和运行可执行文件简单得多，特别是如果你只想找到某些文本或可执行文件在原始文件中的差异所在位置。功能包括内存可视化，这会很有用。


    > 作者：Graham Morrison


    https://github.com/ruslashev/elfcat


    使用 elfcat 快速概述并理解 Linux 可执行文件。


    当加载到 浏览器时，主页面显示二进制文件的原始输出、任何 ASCII 解码值，即一个十六进制块。它提供了有关可执行文件的信息，如其大小、对象类和类型。当你开始将光标悬停在代码的十六进制块上时，类型就会出现。由于注释作为文本出现在链接代码块的右侧，除非你具备汇编知识，否则很难理解，但这是对二进制文件迷人的洞察。


    | 字段 | 值 |

    | :--- | :--- |

    | File name | /bin/elfcat |

    | Type | ELF 32-bit LSB executable |

    | Object class | executable |

    | Endianness | little |

    | ABI | System |

    | Data | object |

    | Architecture | 386 |

    | Entry point | unknown |

    | Programs | 12 at 0x400024 |


    ```

    00000000000000000000000000000000

    00000000000000000000000000000000

    00000000000000000000000000000000

    00000000000000000000000000000000

    00000000000000000000000000000000

    00000000000000000000000000000000

    00000000000000000000000000000000

    00000000000000000000000000000000

    00000000000000000000000000000000

    ```


    ![](img/399caf126e037f28be04b36f402dd3c4_81_1.png)


    ## GNU poke: 二进制编辑器


    我们可以使用十六进制编辑器来查看这些页面，它们对于查看二进制文件很有用，但我们没有一个像 GNU poke 那样真正的二进制编辑器。它的名字源于 DEC-系统和
    Commodore 64 上的两个古老命令。PEEK 命令用于查看内存内容，而 POKE 命令用于更改其值。这两个命令虽然很可爱，但也允许我们在内存中进行任何想要的操作。


    老派的（中年黑客），但也适用于任何对钻研二进制文件感兴趣的人。它描述自己为“极简的”(spartan)，这在语境下意味着没有任何杂质。当你运行它时，感觉像一个十六进制编辑器，但对于它无法识别的任何文档，它都会为你提供提示和一些帮助。


