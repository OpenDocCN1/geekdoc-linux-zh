    # KZones: 用于 KDE 的平铺


    # 桌面定制


    KDE 桌面的优点之一是，虽然它是一种极佳的体验，但它也是一个出色的构建工具。这意味着你可以几乎无限地使用内置设置来定制和增强布局，或者通过创建自己的脚本。这在各种行为的脚本中有所体现。例如，有一些
    KWin 脚本可以将你的桌面变成平铺窗口管理器。


    作者：Hans-Görg Eiber


    KZones 与真正的平铺管理器之间的主要区别在于它没有主窗口的概念。遗憾的是，Tiling 扩展不再进行开发，该项目已被我们查看过的许多替代方案所取代，这是一个非常好的解决方案。


    让 Exquisite 成为窗口管理良好入门在于这种组合将向你展示各种布局，并让你选择移动当前选中的窗口。布局很容易创建，并且可以修改，甚至可以通过简单的脚本创建以适应你的需求。面板保持显示并通常允许其他窗口移动，它也可以配置为在全屏或一段时间后自动隐藏，这是进入平铺布局的极佳方法，而且不需要移除很多键盘快捷键。


