  mdcn: "\n\n## Chafa: 图像查看器技巧\n\n### 文件格式\n\n如果说传统命令行缺少了什么，那就是动画。不是闪烁的颜色或伪装的字符，而是你可能在桌面应用程序中看到的实际移动物体。考虑到文本界面的局限性，你认为这是不可能实现的，但\
    \ Chafa 成功地让变得简单。Chafa 并不处理动画，但它可以显示你提供给它的任何图像，无论分辨率如何。它通过直接将图像转换为 ANSI X3.64\
    \ 指令和 ANSI/Unicode 字符完美地实现了这一点。\n\n尽可能地使用图像或动画。只有当你开始使用 Chafa 时，你才会意识到命令行中的图像有多么用，同样出色的是，你还可以以你在桌面上期待的质量查看图像。如果你一天的大部分时间都在使用命令行界面，这就是一个必不可少的工具。\n\
    \nGraham Morrison 编写\n\n生成的图像和动画分辨率比你对命令线的预期要得多，而且可以在不切换回桌面的情况下查看文件通常是非常独特的体验。\n\
    \nChafa 的名称是“character ascii”的缩写，它可以在终端上显示静态图像和动画。\n\n在简单的情况下，chafa 接收图像或动画文件作为参数。这将作为输出与你的终端对齐显示。色彩重现取决于你终端的能力，并可以通过额外的参数轻松地降低为\
