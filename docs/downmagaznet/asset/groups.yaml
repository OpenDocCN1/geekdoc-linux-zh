    ### 时空之链 (The Link to the Past)


    《塞尔达传说》是史上制作最好的游戏之一。它最初由任天堂于 1991 年为其超级任天堂（SNES）发布，现在最新的 Switch 主机上仍然可以玩。在这个经常被忽视或超越的行业中，该游戏是第一个将精彩故事、挑战性谜题和直观战斗机制结合的游戏之一。


    该项目将原始游戏重新工程变为数千行 C 代码，且没有侵犯任何原始游戏资产。如果你想将游戏构建为可运行的原始版本，将需要原始游戏来获取原始资产。然而，该项目简单且快速，使用
    Python 脚本提取表格并将其组合成项目今天可以使用的格式。整个构建版本可以在现代硬件上运行，它是运行在现代硬件上的《时空之链》。更令人印象深刻的是，新版本可以包含像素着色器、宽屏比例、更高质量的地图、更好的音频以及货舱中的额外物品。它还包含了无限生命值/魔法、卢金币和箭矢的作弊快捷键。


    谁能想到几十年后，塞尔达会被反向工程并重建，以便在 64 位 ARM CPU 上以 60 FPS 的速度运行？


    (img/399caf12e037f28be04b36f402ddc4_86_0.png)


    这款游戏的知识产权显然受到任天堂保护，但它也是一个包含不可否认的成功基因、且随处可见怀旧陈词和细节的游戏。。塞尔达项目的意义重大，以至于……


    这是一种玩旧游戏的趣味方式，但代码才是最重要的。它包含了对原始游戏的直接、现代诠释，并针对原始版本进行了逐帧和逐状态的对比测试。


    作者：Graham Morrison

