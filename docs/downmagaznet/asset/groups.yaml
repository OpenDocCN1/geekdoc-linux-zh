    # # Mass Conversion: Conversen


    After you have edited a collection of vacation pics or snapshots from a party,
    you may want to scale them for emailing. This doesn''t seem like a big deal at
    first, but if you have to edit each image individually for series of photos, this
    monotonous task can consume a huge amount of time. The remedy is basically ImageMagick
    (1), which batch-processes files, but can be used individually.


    If you feel more comfortable with a graphical user interface, it might be worth
    a look at Conversen (2), which is based on ImageMagick. For the install (3), you
    have a choice between an Affiliate and Snap package across versions. Some distributions
    also let you pick up Conversen via the package manager, and source code (4) is
    available on GitHub if you prefer.


    After setting up, launch by selecting the entry in the desktop menu, or the convers
    command in the shell.

    The main window of the application is divided into two areas. On one side there
    an (initially empty) list of all the images. You can add new files using the File
    | Add images or by matching patterns. When you click on one of the entries, Conversen
    displays a sidebar on the left, with information about the file type, size size,
    and resolution (5). Checking individual images to be edited, Edit | Select all
    or the Check button in the toolbar lets you select all entries.


    # Processing PDF files


    Conversen can do more than just edit image files. File | Import PDF files lets
    you read PDF documents and convert their pages into images. But for this to work,
    Ghostscript (5) must be available on the system, and you need to let ImageMagick
    access it.


    In chapter 7 of ImageMagick, open the /etc/ImageMagick-7/policy.xml with a text
    editor and comment out the code for the policy:delegate the PDF domain there,
    as shown in line 2 of List 1.


    # Scale and Rotate


    After selecting the desired image, turn to the Actions Panel on the left (Figure
    2). Scroll down, and below the preview you will see the selected images.

    To change the size, click Scale. The selection box decides whether you want to
    specify the size in absolute values (pixels) or as a relative value (percent).


    # List 1: ImageMagick Configuration


    ```

    01 << In /etc/ImageMagick-7/policy.xml:

    02 <-- policy domain="delegate" rights="none" pattern="gs* /" -->

    03 << In /etc/ImageMagick-7/policy.xml:

    04 <-- policy domain="coder" rights="none" pattern="PDF* /" -->

    05 <-- policy domain="coder" rights="readwrite" pattern="PDF* /">

    ```


    > Figure 1: The main window lists all the files you can edit. If you click on
    one, you will see a preview of the image on the left with many detail options.


