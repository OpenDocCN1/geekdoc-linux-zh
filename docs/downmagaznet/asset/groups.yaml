    \ click on Enable. Then change the Mouse tracking to Cursor pushes contains: That\
    \ way moves will not change when you see the screen - until you reach the boundaries.\
    \ Double tap Left to hold Left press and use the scroll wheel to zoom into your\
    \ desktop and out.\n\nGnome has a preconfigured feature; it is one of the best\
    \ features of the environment, with Alt+8 to zoom in, and Alt+Minus to zoom out.\
    \ However, you cannot configure it to zoom in the small steps, and you cannot\
    \ use the mouse. If you want that to happen, check on the next page - it is mentioned\
