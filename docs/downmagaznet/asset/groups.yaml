    ## Manage Your Photography Workflow with darktable


    There are several powerful open source photo editors that you can use on Linux,
    including digikam, RawTherapie, Gimp, and Krita. One such tool is darktable. We
    used to use Adobe Lightroom for features and capabilities, but since we last used
    darktable a few years ago, we think it has finally surpassed its inspiration and
    become a powerful photo manipulation and management platform for photographers
    in our field. We used darktable for our photography in Linux Voice magazine and
    it saved us from a complete lack of skill and ability on many occasions, when
    it came to under or over-exposed photos where darktable can magically turn a black
    smudge into something we could print. This is all thanks to the RAW image formats
    darktable supports, because these files often contain more proper detail from
    the camera sensors than any JPEG, for example, and every camera.


    To be able to support new cameras and their RAW images, darktable is asking users
    to contribute their own photos under a CC license.


    Coming from Gimp or Krita, darktable can be intimidating to get your head around.
    There are two main configurations which you can switch between selecting either
    lighttable or darkroom mode in the right corner. Each is for digital processes,
    where you''d look at images through light to see which ones you wanted to process,
    before doing the process in a dark (red-lit) room. In lighttable mode, you can
    organize your photos into collections, give them a rating, add categories for
    easy storage and retrieval. In darkroom mode, you can edit the photos by enabling
    one or more processing modules that can do anything from cropping an image to
    compensating for specific lens distortion can be miraculous and utterly professional.
    Version 4 is a major update and includes over 1,600 separate changes from the
    3.8 release, let the countless updates darktable has received since we first installed
    it properly with the version 2.2.0 in 2016. The most important new features all
    you can control: You create a new exposure or color profile, for example, and
    apply these to a collection of images. Fix one photo, and then use it to match
    the rest. The filmic module introduced in 3.8 to make the highly dynamic range
    color response of film and derived from Blender, is now far more flexible and
    allows for more saturated colors. Similarly, highlights can be reconstructed with
    ''guided placement'' method preserving more natural results from regions close
    to the highlight. All of these might sound deeply technical, and unlikely to be
    useful to smartphones, for instance, but this isn''t true. Many people can save
    their photos as RAW images, which can be processed with darktable. It''s ideal
    if you ever need to print something out, create a photo frame of an image, or
    share something for publication. Darktable is ideal if, like, you never properly
    lit a scene or change the exposure settings on your camera to compensate for poor
    or bright lighting. Simply trust in darktable for things.


    The user interface has been completely rewritten for this release to look and
    consistency.


    By Graham Morrison


    https://www.darktable.org/


    ## LosslessCut


    Regardless of the incredible advances we''ve made over the past two decades, video
    editing can feel as slow as editing with Media 100 on PowerMacintosh in 1995 and
    writing to a tape drive. This is for few reasons, but it''s mostly because our
    methods fail to scale to it. Video resolution, color depth and frame rate have
    failed to accommodate all that processing, and files rarely need to be transcoded
    from one format to another. This latest breakthrough that LosslessCut manages
    to mitigate. By using versatile FFmpeg, LosslessCut can edit videos and vitally,
    can export quickly with no loss of quality. It accomplishes this by only letting
    you edit at your own speed.


    This is the perfect solution. We''re not looking for the perfect edit, but instead
    a way of cutting quickly to the action, chopping the preamble or beginnings and
    ends of our videos. With LosslessCut, you can drag-and-drop into the main application,
    locate the "edit-in" point, locate the "edit-out" point, and save the segment
    as a new video. This means you can perform any other kind of editing, such as
    crop, reorder, and processing, which would require frame and keyframe recalculation,
    and a lossless-identity transformation. You can edit at the exact point you want
    to edit or split point. Fortunately, with keyframe icons in the UI that automatically
    move the cursor to keyframes and edit points. With these limitations removed,
    the performance bottleneck becomes storage access rather than reconstructing the
    video.


    Between editors is being worked on, with a new development release capable of
    reconstructing the frames before a keyframe enabling anywhere with some processing
    and you for the reconstructed point. The editing of the video will be effortless,
    which is still a big improvement over how most video editors work. The rest of
    it is simple but effective. An advanced version enables you to turn the thumbnail,
    see the timeline, take a single image, and see the resolution and frame rate for
    your clip. You can also import multiple clips, although currently they have to
    be edited separately rather than different tracks as you might in Kdenlive—although
    that feature is too coming.


    1. Tracks: Multiple video files can be deleted, split, and connected.

    2. Audio: Audio tracks can be separated, deleted, and replaced.

    3. Output formats: LosslessCut can edit its own format or export via FFmpeg to
    many file formats.

    4. Thumbnails: Thumbnail and audio can be optionally enabled for clips.

    5. Segments: Video is cut into segments that can be exported as an audio or a
    single file.

    6. Keyframe edits: Skip between points with buttons and navigation controls.

    7. Export: Segments can be labeled, re-ordered, and listed in a separate panel
    on the right.


    By Graham Morton


    github.com/lossless-cut


