    首先，我们需要在文件名（之前）自动添加一个 *_s* 后缀。我们可以使用 shell 内置的字符串处理工具在点之前将名称拆分为点前后的部分。如果文件名存储在变量
    $f 中，那么 `${f%.*}` 将移除扩展名，而 `${f##*.}` 则只给出文件名：


    ```bash

    $ f=my.test; echo "${f%.*}" "${f##*.}"

    my.test test

    ```


