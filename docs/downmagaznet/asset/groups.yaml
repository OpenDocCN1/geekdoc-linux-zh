    You find yourself using inappropriate swear words when you''ve mistyped a command
    and the computer doesn''t do what you intended? Now you turn your swearing into
    productivity - simply type fuck after a mistake, and the shell will suggest...


    That will only work once you''ve installed "The Fuck" [1]. On Ubuntu, use:


    ```bash

    sudo apt install fuck

    ```


    and on openSUSE, use Python''s installer pip and run


    ```bash

    pip install fuck

    ```


    which should also work on other distributions. You will also need to add a line
    to your Bash start script that defines a function fuck: just add


    ```bash

    eval $(fuck --alias)

    ```


    at the end of ~/.bashrc. Now you''re ready to go: Close and reopen the terminal
    window and type something that''s slightly wrong, for example:


    ```bash

    apt install llc

    ```


    Command misses an "a" in the word "install", apt will complain. Just type fuck,
    and your new helper suggests the correct command - all you need to do is hit Return
    to run. If you had planned for something else, try the cursor keys to see some
    auto-corrections. If nothing is right, use the tool with Ctrl-.


    ### A little swearing can solve your problems.


    If you prefer to be vulgar, you can use another name for the function - for example,
    change the line in ~/.bashrc


    ```bash

    eval $(fuck --alias)

    ```


    and the magic command will turn to touch.


    > By Hans-Georg Ebler


    ## HACK 86: Record Your Shell Session


    Imagine you want to explain to a friend or colleague how to perform a specific
    task on the command line, or maybe you''re having trouble with a shell command
    to request help.


    In some cases you will often copy and paste command lines, with the outputs you
    generate to an email. Or you take a screenshot or a short video. If you don''t
    need to show outside terminal window, there is a better option: Use script, a
    classical program that was introduced by 3.0.BSD in 1992.


    It follows to capture input and output in recording, and the timing information
    (when did you press key?) in recording, time:


    ```bash

    script --timing-recording recordingsc

    ```


    Now perform all that you recorded, and when you''re done, exit the shell, and
    the recording stop.


    ```bash

    scriptplay --timing-recording recordingsc

    ```


    and the session repeats itself. All keys pressed (including corrections, movements,
    etc.) are visible in the speed at which you did that.


    Recording and playback will work nicely when you use a pseudo-graph program such
    as the Midnight Commander. You only need to make sure that the terminal is at
    as large as lines (column) as playback was during recording. The background may
    look weird when you use a larger window for playback (see figure).


