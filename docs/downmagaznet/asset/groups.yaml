    # 桌面定制


    ![](img/399caf126e037f28be04b36f402dd3c4_9_0.png)


    # 什么时间，什么日期？


    KDE 的任务栏在右角显示时钟。它将时间与日期合并并堆叠在一起。虽然这节省了空间，但也让难以快速阅读字体很小的日期。Better Inline Clock（更好的内联时钟）是一个替代小部件，它可以并排显示时间和日期。


    右键点击桌面，选择“添加部件”（Add Widgets），然后点击“获取部件”（Get Widgets）/ “下载新的 Plasma 部件”（Download
    New Plasma Widgets）。在搜索框中输入“inline clock”，或者悬停在搜索结果中的“Better inline clock”选项上，点击出现的“安装”按钮。


    右键点击任务栏中的时钟组件并选择“配置选项”（Select Options）。你会在列表中找到时钟组件。选择并点击“切换”（Switch）来更改你的时钟组件。你可以立即看到日期和时间以大字体显示，这会更容易阅读。


    时钟是可以配置的：右键点击选择“配置内联时钟”（Configure Inline Clock）。大部分情况下：你可以更改显示的日期和时间。如果你更偏于数字格式，还可以创建自己的格式字符串：选择“格式”（Format）并输入编辑代码，将日期打印为
    31.05/2023 而不是 31 May 2023。如果你喜欢，可以使用 24 小时制。


    # 禁用自动锁屏


    自动锁屏让你抓狂吗？大多数桌面都预配置为：当你几分钟内没有输入或移动鼠标时，会自动锁定你的当前会话。要解锁此屏幕，你可以按任意键停止操作，但如果你等得太久，就需要输入密码。对于公共和共享区域的设备，这是一项重要功能；如果你禁用了自动锁屏就没有意义——你仍然可以手动锁定屏幕。


    KDE 用户打开“设置”（Settings / System Settings）并搜索“lock”，选择“屏幕隐私偏好”（Screen Privacy Preferences）找到搜索结果，并禁用“自动锁屏”（Automatic
    Screen Lock）选项。就像 KDE 一样，“在 N 分钟后锁定屏幕”。有一个“从睡眠唤醒后”的选框，这并不经常发生，如果你不需要测试，倾向于保持关闭。你仍然可以使用
    Alt+L 手动锁定。


    Gnome 用户打开“设置”，搜索“lock”，选择“屏幕隐私偏好”（Screen Privacy Preferences），然后决定是否开启名为“挂起时锁定屏幕”（Lock
    Screen on Suspend）的独立选项。要手动锁定屏幕，点击全局菜单栏上的电源按钮并选择“锁定”。


    > 作者 Hans Geeger


    ![](img/399caf126e037f28be04b36f402dd3c4_9_1.png)


    在 KDE 设置中禁用屏幕锁定。Gnome 提供了类似的对话框。


    在红线下方，你可以看到替代的时钟组件，它让日期和时间更容易阅读。


    ![](img/399caf126e037f28be04b36f402dd3c4_9_2.png)


    酷酷 LINUX 技巧 – 2023 版


    10


    # 治愈大写锁定症


    # 桌面定制


    我们已经老到可以说“这些问题是从 IBM 将功能键从左侧（图 1）移动到顶部开始的”了吗？那发生在 1988 年，当时 IBM PC 取代了 PC XT，当时领先的个人电脑制造商推出了新的键盘，那并不是我们所知的标准布局。Windows
    95 让键盘制造商增加了三个新键，某些现代笔记本键盘也根据此类请求配备了 *Fn* 键。


    但键盘最糟糕的问题是旧的和新的吗？在我看来，是大写锁定键（Caps Lock）。它的目的是在你不看屏幕打字时，弄乱你在文档或行中输入的文本。一旦它将每个小写字母转为大写，反之亦然。当你发现乱套了时，你需要删除所有输入的文本并修复它（再次使用大写锁定）。只有网络工具会有帮助，它不会授予非字母键的次级绑定的权限。相反，如果你使用辅助功能工具来帮助自己，只需要使用
    Shift、Ctrl 和 Alt 键即可。


    如果你正在运行 Linux，xkbmap 可以告诉你有关大写锁定键的信息：


    ```

    $ xkbmap -p | grep -u 66

    66 = xkbmap_NocapShift_Lock

    ```


    罪祸首是大写锁定键。有几种方法可以去掉它：一种是桌面环境配置（图 2 显示了在 Ubuntu 上通过 apt 安装 gnome-tweaks 软件包后如何配置大写锁定键），但我将向你展示两个需要简单命令的快速解决方案。


    # 图 1


    ![](img/399caf126e037f28be04b36f402dd3c4_10_0.png)


    （CC 公有领域领域）


    # 图 2


    ![](img/399caf126e037f28be04b36f402dd3c4_10_1.png)


    对“大写锁定症”的保守治疗是将该键转换为第二个左 Shift（Left Shift）。这样，如果防止了大写锁定键进行切换，你仍然会得到大写字母。如果你愿意，可以使用
    xkbmap 更改键的行为：


    ```

    $ xkbmap --option ''66=Shift_Left''

    ```


    如果你想完全禁用该键，再次使用以下命令。更改后，大写锁定键将失效。注意这如何影响 X 会话。你可以看到它是如何影响 X 会话的。


    大写锁定键是罪祸首。有几种方法可以去掉它：一种是桌面环境配置（图 2 显示了在 Ubuntu 上通过 apt 安装 gnome-tweaks 软件包后如何配置大写锁定键），但我将向你展示两个需要简单命令的快速解决方案。


    '
