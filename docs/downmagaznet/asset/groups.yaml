    # 酷炫的 Linux 技巧


    本《Linux Magazine》特刊向你承诺“酷炫的 Linux 技巧”，我们一定会兑现——请查看下一页的目录，了解我们在内部呈现的所有精华。但究竟什么是“技巧
    (hack)”呢？


    在当今世界，Windows 是主导的桌面操作系统，选择使用 Linux 是第一个也是最重要的技巧。此外：


    - 如果我可以用它来解决问题，或比以前更快地完成工作，那么它就是一个技巧。

    - 如果它的工作方式出乎意料，那么它肯定是一个技巧。

    - 如果它教了我使用 Linux 机器的一种新而有趣的方法，它就是一个技巧。

    - 当它让我感到抓狂，因为这种方法明显到只有极客级别的 Unix 用户才会想到这样这样做时，我会把它加入我的轶事列表（是的，这确实是一个技巧）。


    “技巧”的定义取决于个人口味，我们为本合选择的技巧也是如此：许多作者做出了贡献，我们共同汇集了一系列新工具、经典工具的强大替代品，以及你以前以不同方式使用的软件有趣案例。我们将技巧分为了
    10 个类别，方便你以后回过搜索时找到它们。


    对于“游戏”类别，我们选择了一些酷炫的 Linux 游戏，你可以在休息时运行它们；我们还展示了如何在 DOSemu 中运行大量的经典 DOS 游戏集。虽然我们的大多数技巧可以提高你的效率或解决技术问题，但在无需启动另一个操作系统的情况下获得一些乐趣也是很好的。如果我们工作得当，当你尝试我们的其他技巧时，会有更多乐趣。我们希望你喜欢！


    Hans-Georg Eßer

    主编


