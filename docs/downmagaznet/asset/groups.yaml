    # qpgraph: Audio Router HACK 23 corrscope: Music Visualizer HACK 24


    PipeWire, the audio handling system to replace PulseAudio, is now in many distributions
    - including Pop!OS, Fedora and Ubuntu - to be considered the new standard. It
    works incredibly well and offers much better performance and configuration over
    the olds. However, PipeWire lacks the desktop controls and smooth integration
    that you come from being the daemon, which is why it is still better than PulseAudio
    until fully integrated. It''s also noted that many distributions will PipeWire
    directly into a PulseAudio layer with long-established control panels and applications,
    but this misses some of the advantages you get directly from PulseAudio.


    The Internet is full of videos containing just music with some simple visualization
    to help provide feedback while you''re listening. They''re easy to create and
    use if you want to share your music or create an easily playlist, but it''s not
    difficult to create a meaningful visualization. The biggest problem is generating
    something that can be synchronized to the audio. One approach is to render the
    video from a music player such as Project (see the following hack). Another approach
    is to use coroscope, which takes one or more audio files and generates an oscilloscope
    view of those inputs. When changing the frequency of the audio, it can be notoriously
    difficult to sync to the sound.


    qpgraph is a qgraph GUI with an intuitive interface. If you use Cava or Guvget
    to access qpgraph when it launched, you''ll already be familiar with its interconnectivity.
    Every detected input and output is shown in a graph, with connections to show
    where audio data flow out. If you use Firefox and use it to play sound, for example
    qpgraph makes it easy to connect nodes and adapt to show the new audio path. You
    can drag and drop any connection to change the path, which is easy if you want
    to run some effects, or route the audio to a recording application. qpgraph does
    this naturally, without any other configuration. If you''re a Gnome user, the
    equally brilliant Helvum presents the same graph view interface within GtkWindow
    that integrates perfectly with your desktop. Both applications are gateway to
    the wonderful world of PipeWire that don''t require any system-wide components
    or the them.


    Coroscope solves the sync problem in the same way as oscilloscope does, triggering
    points from the waveform upwards or downwards of a square of the audio. The waveforms
    can be changed as they are on the real hardware, although the default values themselves
    can be customized by changing the color, line width, the background, and vertical
    or horizontal lines. Most importantly, you can generate more than one input and
    split these into separate oscilloscopes. This works well for stereo tracks but
    best with chipune music. This is because each channel is separated by the composition
    software and each channel consists of simple oscilloscopes. Any changes you make
    in the graph can be previewed by clicking Preview. This fires up FFmpeg, the only
    dependency, and if you like this high quality vision it is rendered at your chosen
    resolution as you prefer.


    By Graham Morrison


    https://github.com/mrcbc/qpgraph


    The Qt interface is atomic, if you prefer Gnome, Helvum does PipeWire interconnectivity
    for Gnome users.


    https://github.com/corrscope/


    With coroscope, you can construct oscilloscope visualizations of your multi-channel
    audio files, which are brilliant for video.


