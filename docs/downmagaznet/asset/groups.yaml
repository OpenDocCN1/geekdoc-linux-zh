    ## Limitations


    Linux has other tools besides dict. For the desktop, you can choose such applications
    as GoldenDict, Artha, the WordNet browser, and Gnome Dict. However, so far as
    I can determine, dict is the only one available that is complete and far more
    readable and thorough. In fact, it is so great that its documentation and examples
    is irksome, if often surmountable. It is not unclear whether dict is being actively
    developed. Still, with patience, an envoy is available so that no user on Linux
    should be without it.


    ```bash

    dict -m thesaurus results

    ```


    will return only synonyms (Figure 2). Similarly, if you want to look up the Old
    Testament character Jesus, use Easton''s Bible Dictionary (2019) (Figure 3) –
    an encyclopedia, rather than a dictionary definition.


    Another alternative for limiting results is to choose a strategy from those displayed.
    These strategies are not documented, but they are self-explanatory if you specify
    the prefix, suffix, or strings. However, for those that are not documented, you
    may have to do more than one test before finding the one you prefer.


