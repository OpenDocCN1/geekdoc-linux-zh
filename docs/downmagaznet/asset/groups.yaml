    KDE 允许你通过类似应用商店的配置向右键菜单添加服务：打开 Dolphin 设置（通过 Shift+Ctrl，或“配置 Dolphin”），并在左列中选择“Context
    Menu”（或“Services”）条目——然后你将看到已安装的服务列表，并可以启用或禁用图标。如果你点击 Dolphin，你将找到来自 KDE 商店的一些插件
    (1)。


    但不需要依赖别人的工作，你可以像我们之前在 Gnome 中做过的那样，轻松地添加你自己的右键菜单。我们假设你已经创建了一个小型的 Bash 脚本，它可以将参数格式化为文件并对它们执行某些操作，就像
    shrink 脚本创建较小版本的图片一样。将其存储在主目录的 bin 文件夹中（你可能需要先创建此文件夹）。


