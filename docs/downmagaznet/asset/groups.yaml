  mdcn: "\n# SHELL 技巧\n\n## 88\n\n多年来，我们查看了多种基于终端的 Web 浏览器，可以将它们的起源追溯到终端是必需品而非选择的时代，因为那时桌面并不存在。它们的主要重点是访问网站并让你能够不费力地进行导航，而不是模拟一个并不存在的浏览器。如果你在紧急情况下需要下载显卡驱动程序，这些程序仍然非常出色。\n\
    \n使用 npm 安装非常简单，还有一个 Docker 镜像用于简单的云端部署。得益于隐藏的 Chromium 渲染器的兼容性和渲染能力，结果非常惊人。视频预览完美，下拉文本可以渲染，Web\
    \ 浏览器的体验几乎像桌面端一样简单，特别是如果你熟悉它们的话。从 SSL 发送元素到几乎所有的 3D WebGL，一切都能正常工作。它以每秒 60 帧的速度流畅运行，在需要时消耗的资源极少。然而，由于有太多的键盘绑定无法为了鼠标而移除，这在命令行中似乎有些不方便。它还会提醒广告拦截器。这些都是小问题，让某些事情看起来像像是一个几十年前的老问题，但即使是命令行\
    \ Web 浏览，为了酷炫和可读性因素，也正在走向桌面。\n\n## Carbonyl：终端浏览器\n\nCarbonyl 渲染页面非常漂亮，以至于你的终端看起来就像低分辨率屏幕上的绿色像素。\n\
    \n你可以上网搜索设置 Wayland 会话的指令。\n\n但对于访问充满现代 JavaScript 的交互式 Web，它们并不那么理想。然而，Carbonyl\
    \ 是一个将终端体验提升新高度的终端浏览器。它的输出是桌面级 Fmpeg 转 ASCII 的混合体。\n\n作者：Graham Morrison\nhttps://github.com/fatyb/carbonyl\n\
    \n## 89 剪贴板：复制与粘贴\n\n在桌面上，剪贴板是完全理所当然的。我们许多人使用 Ctrl+C 复制，使用 Ctrl+V 从一个地方复制到另一个，甚至不需要思考。这些命令同\
    \ Ctrl-X 一起已经变成了肌肉记忆。但在命令行中使用并不简单。从历史上看，命令行并不读取这种复制和粘贴，如果没有数据流，这几乎是不可能的。真正的黑客应该通过命令进行管道和过滤输出，而不是在没有自动化的情况下复制粘贴。\n\
    \n剪贴板工具可以复制和粘贴文件文本。\n\n```\n$cd ~/scripts/\n$ chmod +x *.sh\n$ ./copy-text.sh\n\
    $ ./pbcopy.sh\n$ ./file-to-clipboard.sh\n$ ./file-to-file.sh\n$ ./merge-files.sh\n\
    $ ./pb-to-clipboard.sh\n$ ./pb-to-file.sh\n$ ./copy-text.sh\n$ ./copy-paste.sh\n\
    $ ./Cool Linux Hacks.sh\n$ ./clipboard with content.sh\n```\n\n作者：Graham Morrison\n\
    https://github.com/Slackclads/clipboard\n\n## 技巧 90\n\n## just：命令运行器\n\n命令运行器是奇特的东西，因为有很多种自动化运行命令的方法。Shell\
    \ 命令是最简单且应用广泛的。如果你可以在 shell 中输入命令，你就可以单独运行它们。但这样你也很出错，特别是在更改环境、位置或系统时。这种规模的 shell\
    \ 可能有它自己用于运行和控制命令的语法。`just` 器是另一个例子，它兼顾了这两者的优点。命令自动化既简单，又作为一个项目具有管理性。\n\n命令被组合在一个名为\
    \ recipe（配方）的类 YAML 文件中。这些配方容易构建和阅读，但也极具欺骗性的强大：在简单的情况下，你执行一个命令，随其后的行命令将运行该命令。所有输出都被捕获为注释和其他反馈。但这只是开始。配方可以包含设置、变量等。你还可以包含条件，这些条件在解析和输出方面通常比\
    \ shell 替代方案更有用。所有内容在项目中都有精美的文档记录，使其易于找到函数、选项或易于使用。与在开始之前需要百科全书知识的 shell 不同，如果你发现自己在不同的发行版上反复运行相同的命令，`just`\
    \ 就能提供非常实用的且愉快的体验。\n\n作者：Graham Morrison\nhttps://github.com/casey/just\n\n##\
    \ 历史改进\n\n尽管听起来像是一个老生常谈，但“just”值得你的关注。它更新了终端交互中最重要方面的功能。我们大多数人通过上下方向键访问历史记录，并配合几次\
    \ Ctrl+R 来搜索之前的命令。默认历史记录的问题是，当你输入时，它就作为文本丢失了。一个可以跟随你进入远程会话的历史（即使作为不同环境下的用户），仍然可以通过历史记录可用。改进命令历史的最佳方法是记录你想要运行的每一个命令。你可以记住退出状态，即命令是否成功。这看起来可能不是什么大事，但如果你曾经搜索历史记录却发现全是拼写错误和糟糕的争论，这正是\
    \ `just` 派上用场的地方。它支持之前提到的命令并用额外的功能替换它们。它允许搜索匹配特定字符串的命令、返回特定的退出代码，甚至在特定日期后运行。历史记录存储在本地，并可以在设备间同步。\n\
    \n```\n# cat recipe\n# python to execute lines and backtrace\nset shell: \"python\"\
    , \"-c\"\n\n# use print to capture result of evaluation\nfoo:\n  print(\"foo =\
    \ %s\")\n  print(\"snake\")\n\n## 为我们撰稿\n\n我们一直在寻找关于 Linux 和环境工具的好文章。尽管我们会考虑任何主题，但以下主题令我们特别感兴趣：\n\
    \n- 系统管理\n- 有用的技巧和工具\n- 安全性，包括新闻和技术\n- 产品评测，尤其是来自真实体验\n- 社区新闻\n\n如果你有想法，请附带大纲、预计长度以及背景信息发送至\
    \ edit@linux-magazine.com。欢迎提供截图和其他支持材料。更多信息请访问：http://www.linux-magazine.com/contact/write_us。\n\
    \n| 联系信息 |\n| :--- | :--- |\n| 主编 | Hans-Geer Eeler |\n| 高级编辑 | Lori White |\n\
    | 执行编辑 | Joe Casad |\n| 本地化与翻译 | Ian Travitz |\n| 排版 | Amy Petle, 插画来自 Viktoriya\
    \ Sukhanova, 1234RF.com |\n| 广告 | Brian Foster, brian@linux-magazine.com, +49\
