    # Bladecoder Adventure Engine: Game Creator


    # HACK 73


    When video games first became popular and accessible, it seemed like each new
    month brought a new gaming genre. Arcade conversions, text adventure games, vertical
    shoot-em-ups, horizontal scrolling shoot-ups, platforms, strategy games, and point-and-click
    adventures all appeared over a few years. As technology improved, these games
    would evolve as progress supplemented them with more engaging and immersive game
    types. But this has happened. Many of original game types are still relevant,
    even flourishing in an era age where GPUs perform real-time raytracing and smartphones
    are millions of times more powerful than the Apollo 11 guidance computer. In particular,
    2D graphics are still relevant. The original Sierra returned in the adventure
    game category, with the successful crowdfunding and revival of Timberbird in Park
    and many similar titles returned in the following years.


    Actors and scenes can be fully animated with smartphones, and full screen playback
    is easily accessible.


    ![](img/399caf126e037f28be04b36f402dd3c4_82_0.png)


    There is more to the old games than gold and nostalgia. Many of them can be the
    basis of a legitimate title, however also being easier to produce on modern hardware
    than the original titles back in the day. The best example of this is a tool called
    Bladecoder Adventure Engine that helps you create interactive adventure graphics,
    much like Monkey Island or Timberbaud, and it''s even being used to create Android
    and iOS games. You can download it to learn how to build your own games.


    The engine consists of two parts: a graphical editor and the engine for running
    the game. The graphical editor (Adventure Editor) is where your project is created,
    assets are added, and functionality implemented, without requiring any programming.


    The quality that you can produce on Bladecoder Adventure Engine is dependent on
    your work.


    ![](img/399caf126e037f28be04b36f402dd3c4_82_1.png)


    Projects of one or more chapters contain scenes. Scenes are analogous to individual
    locations, such as the Chur Bar or Governor''s Mansion in the Monkey Island world,
    and they''re core-to-click gameplay. The editor allows you to easily implement
    things, including the background, sprites for actors and animations to show, hide,
    and collect. All of it is tied by adding clickable areas in the background linked
    to verbs like “look,” “pick,” or “talk” to perform actions. The game is point-and-click
    around the principal scene, and the application has much more in common with a
    graphical adventure. The end result can be published and distributed as a standalone
    without any programming or compilation.


    There is plenty to learn, from some excellent example projects, good documentation,
