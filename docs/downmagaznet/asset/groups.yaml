    \ user, or an ML training run. So focus is SCI/CR, where CR can be subdivided\
    \ into more specific sources, such as O (operational emissions) and M (embodied\
    \ emissions). O is the energy required by the software itself, and M is the hardware\
    \ required.\n\nThe Carbon AWARD [10], on the other hand helps developers integrate\
    \ into their applications to take advantage of fluctuating energy prices. The\
    \ Carbon AWARD SDK can use with either the command line or web API, which is used\
    \ for non-time critical machine learning jobs. The SDK moves work to other cloud\
    \ regions where renewable energy is cheaper. Alternatively, it thrills to throttle\
    \ back operations as a function of the type of energy.\n\n#\n\n The tools of the\
    \ GSF are available to everyone, but the foundation is based in the US and is\
    \ funded by users-corporations. However, several efforts are taking place in Europe.\
    \ Green Coding, for example, is a Berlin that believes will only have a positive\
    \ impact if it is sustainable. Green Coding is looking to develop source measurement\
    \ tools that determine the requirements of software and infrastructure. The aim\
    \ is to center around green software. To end, Green Coding cooperates with the\
    \ Sustainable Digital Infrastructure Alliance (ASIA) [13], an alliance of companies\
    \ with a roadmap for a sustainable digital infrastructure.\n\nGreen Coding offers\
    \ the Green Metrics Tool [14], a container-based utility that is currently intended\
    \ for experimentation and testing. Green Metrics can help you measure the storage\
    \ space per container, the CPU utilization as a percentage, and the system-wide\n"
  mdcn: "\n\n# 使用 Godot 引擎创建游戏\n\nGodot 引擎自2014 年以来一直在开发——它最近完成了从 3x 到 4x 的版本跨越，自从\
    \ 4.0 发布以来，有大量工作要做。Epic 提供了 250 美元的开发资助，俄罗斯游戏开发者 Kefer 提供了 120 美元的资助，Ubisoft 和\
    \ Embark Studios 也提供了慷慨捐赠。这些都是针对开源项目的，说明了该项目已变得多么重要。这比他们时期某些基础基础设施缺少缩放位置的故事要好听得多。\n\
    \nGodot 受到关注是因为它填补了一个重要的角色，就像 Linux 一样。它是一个帮助开发者创建游戏的引擎，也是除 Unity 和 Unreal Engine\
    \ (UE)之外最广泛使用的开源引擎（这两者都是令人遗憾的专有软件，甚至对可移植性持有敌意）。使用任何一个系统开发游戏的成本与你在 20 世纪 90 年代中期开发时一样，不同的是这是开源开发，你不会被锁定，不会被强制安装升级，而且不会获得游戏销售额的百分比。更重要的是，它将通过持续的开放性和相关性，回报你投入学习的任何努力，就像我们投入学习\
    \ Linux 的精力一样。\n\n- 1. 节点和场景：所有游戏都有元素，可以通过简单设计和组织它们来创建游戏节点。\n- 2. 视口：创建视图以查看和定位游戏中的节点，并创建玩家看到的内容。\n\
    - 3. 标签：可以同时打开多个视图并像在 Blender 中一样通过 X、Y、Z 手柄进行操作。\n- 5. 属性：同样在编辑器中，无需编写任何代码即可编辑属性。\n\
    - 6. 检查器：在属性、节点和编辑历史之间切换。\n- 7. 输出页面：查看游戏各个部分的调试信息。\n- 8. 资源：游戏所需的所有内容都列在这里，包括代码和着色器文件。\n\
    \n第4 版本是一个巨大的升级，它标志着 Godot 从业余原型设计转变为可以直接与 Unity 和 UE 的统治地位竞争的专业游戏开发引擎。你一眼看编辑器就能看出这一点。中心视图、检查器、场景资源器和资源库都整合在了一起。在后台，3D\
    \ 引擎有了巨大的改进，不仅是在低渲染的 OpenGL 游戏中，而且在它的能力上。新的 Vulkan 渲染器对场景开发将非常有帮助，它还将支持更更好的动画选项，包括体素全局光照。还有高级的阴影着色器、新的天空着色器以及带有\
    \ Godot 的资源导入功能。最终结果是惊人的，Godot 的输出已经达到了 AAA 级别。很明显，随着发布，3D 周围面板将表现出色。\n\n对于维度较低的游戏，有一个神奇的新地图编辑器。这本身就是一个独立的评论，尽管基本的外部绘图工具包含了层、瓦片、自动平铺、元数据和动画等强大功能。瓦片被扩展以移除游戏，结合引擎的\
    \ 2D 渲染输出，Godot 简化了创建 2D 游戏的整个过程。渲染输出包括多采样抗锯齿、定向 2D 照明和阴影。为了帮助编程逻辑，新的 Godot 引擎从版本\
    \ 2 开始构建，C# 和 .NET 现在已获得原生支持。这些改进已经取得了成效，不是体现在 Godot 游戏的质量上，而是体现在社区扩张的速度上。这意味着文档也在改进，有了更多的教程和更多的视频覆盖，这将有助于项目的成功，并开启我们所希望的开源游戏开发的新时代。\n\
    \nhttps://godotengine.com\n\n> 作者 Graham Morrison\n\n# IT 亮点一览\n\n# LeanCreator:\
    \ Qt IDE\n\nQt 项目在许可和业务模式方面有着很长的冲突历史。它有时会与 Linux 社区产生冲突，例如它早期的专有许可为 Gnome 奠定了基础。它一直保持开源，但随着\
    \ Qt 项目尝试新模型，各种新开发和组件不断地被纳入或排除。最近，Qt 项目（即 Qt 公司）宣布将只发布 Qt 6 的 LTS 版本，而不发布中间补丁，以便\
    \ KDE 项目维护我们所有的版本。这导致它的子项目（例如出色的平台无关的 Qt Creator）陷入了它们无法控制的风暴中心，并让用户无法知道哪些是这样的子项目。\n\
    \nQt Creator 是根据 GPL 条款发布的，但它也与 Qt 框架及其优先事项结合得更加紧密。促使 LeanCreator 创建的动力是，它是 Qt\
    \ Creator 的一个分支，试图让 Qt 开源并具有适应性。它是基于自身（即 Qt 的一个分支）构建的，是一个名为 LeanQt 的项目，这是在 LGPL\
