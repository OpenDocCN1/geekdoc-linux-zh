  - "[PAGE 23]\n\n# SECURITY & PRIVACY\n\n# # HACK OpenSnitch Application Firewall\n\
    \nAn application connecting to the Internet is a normal procedure and typically\
    \ completely legitimate, but there are programs – even open source applications\
    \ – that phone home track the user. On Linux Firefox offers an opt-in service\
    \ to actively deny data collection. Often, the collected data relates to telemetry\
    \ functions and gives the developers information about user's interaction with\
    \ their program. However, open source does not protect you against being tracked.\
    \ In Firefox, you can find out by sending telemetry if you do not want this to\
    \ happen.\n\nAn application firewall will reveal what's going on behind the user's\
    \ back.\n\nexamine the data flow packets to and from the CPU, an application firewall\
    \ takes an application-specific view when monitoring the outgoing data. (Do not\
    \ confuse an application firewall with a web firewall [11]). Example of application\
    \ firewall includes LittleFilter [2] for Linux and GlassWire for Windows. Here,\
    \ let's take a look at an open source application firewall: OpenSnitch (4), a\
    \ Python port of Little Snitch [5] personal firewall for macOS. OpenSnitch development\
    \ began in 2017.\n\nFigure 1: A pop-up window notifies you that Firefox is requesting\
    \ a connection to update its version. You can allow, deny or restrict access via\
    \ various parameters at the bottom of the dialog.\n\n![](img/399caf126e037f28be04b36f402dd3c4_23_0.png)\n\
    \n# Snitch\n\nWith \"snitch\" in its name, you can tell much more about OpenSnitch\
    \ working: Snitch analyzes exactly what this firewall does. OpenSnitch analyzes\
    \ applications' outgoing traffic and exposes similar unpleasant issues if configured,\
    \ allowing you intervene if necessary. If an application tries to connect to the\
    \ network, OpenSnitch first it and asks if you want to allow it. You can grant\
    \ permission by defining a rule for the application.\n\nOpenSnitch is not typically\
    \ found in the package archives of the popular repositories. On Arch Linux, up\
    \ to Ubuntu 20.04 contain OpenSnitch 1.5.6. The latest stable OpenSnitch v1.5.2\
    \ can be downloaded as a binary package from GitHub. Besides deb and RPM packages\
    \ for 32 and 64-bit systems, you will also find the source code on GitHub if you\
    \ want to build OpenSnitch yourself. Packages are available for the armhf and\
    \ arm64 architectures.\n\nFigure 2: OpenSnitch rules can be created and edited\
    \ – using a file in JSON format., but also in the interface at the bottom\n\n\
    ```\nftau@:~/Downloads$ cp /etc/opensnitch/rules\nftau@:/etc/opensnitch/rules\
