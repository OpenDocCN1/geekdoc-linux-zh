    ## HACK 87: dict: A Command-Line Dictionary Tool


    As a writer, I rarely need to up the definition of a word. However, if I don''t
    know a word exactly, I turn to a thesaurus to search for a closer alternative.
    Unfortunately, a regular dictionary is next to useless for these purposes-which
    is why I was pleased to deliver this amount of information running from the command
    line for added efficiency. The databases supported by dict include a number of
    dictionaries, a collection of resources, the Jargon File, the CIA Factbook, and
    other languages besides English - far more than the average dictionary offers.
    The results include not only literal meanings, but numerous contexts as well.
    Some default results for the word "red" from my current installation are shown
    in Table 1.


