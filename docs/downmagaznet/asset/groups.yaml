    \ placed between double quotation marks, the third line is the same but in views_zoom_out.\
    \ Lines 2 and 4 hold the mouse/key combinations: alt it will work with both the\
    \ left and right keys; b+4 and b+5 are Scroll Up and Scroll Down on the mouse\
