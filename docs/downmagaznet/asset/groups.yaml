    # Installation


    I tested OpenSnitch v1.5.0, but when this magazine reaches the weekend, version
    1.6.0 will be available. I installed the packages for the daemon and the GUI on
    Debian Sid ("sid") and Debian 11 ("bullseye").


    +   - On Siction, there was a problem with some Python dependencies, but I might
    be able to fix this by typing


    ```

    `sudo apt --fix-broken install`

    ```


    In Debian 11, it installed without any hits. Debian and its derivatives enable
    the OpenSnitch service automatically after installing the software. With other
    distributions you might have to do this manually (see Listing 1).


    After the first launch, you will find OpenSnitch in the system section of the
    control bar. Clicking on the OpenSnitch icon opens the main window. Right-clicking
    does the same thing when Selecting Statistics also lets you disable or close the
    firewall and gives you access to the help documentation.


    # Blockade


    Initially, OpenSnitch blocks all connections to the outside world. If an application
    does not have a rule tries to access the Internet, OpenSnitch pops up a dialog.
    Before you get around to it, the excessive pop-up windows will already be blocking
    applications on your system you are trying to contact hosts outside their network
    (Figure 1).


    If you grant permission for an application to connect the outside world in the
    pop-up window will be applied until you restart. However, you can also make a
    new rule or limit its validity to a specific period of time. Optionally, you can
    define which rule should apply to the running process only, to the targeted URL,
    or the domain to be contacted.


    OpenSnitch saves the rules you create in the format in `/etc/opensnitch/rules.file`,
