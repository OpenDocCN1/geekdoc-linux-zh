    # Mount ISO Images with a Mouse Click


    In the past, we used to download ISO files and burn them to a CD-ROM or DVD-ROM.
    While that''s possible today, a more typical use is to write them to a USB stick
    and boot from that.


    Also, Linux lets you access the files on ISO images by simply mounting them to
    a folder. Traditionally you would type a command as


    If you work with KDE on openSUSE, you can install the late-disk-image-ounter package
    which contains basically the same tool, and after manually adding it as the default
    app for *.iso files in Dolphin, it works just like Gnome.


    ```bash

    sudo mount -o loop,some-image.iso /mnt/

    ```


    In a terminal window, modern Linux distributions let you do this with a simple
    mouse click. In the Gnome file manager you can simply double-click an iso-image
    to mount it. You can also run this manually from the command line - it opens a
    file chooser and you pick a ISO image to mount. Gnome and the image manager have
