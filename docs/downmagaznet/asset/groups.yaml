    ## DNS 技巧：主机名解析


    当你访问网站时，使用一个包含主机名的 URL，例如 www.example.com。浏览器随后会连接到托管它的服务器。在之前，操作系统首先需要将主机名解析为地址（Internet
    协议 IP 地址），无论是 IPv4 还是 IPv6。解析过程可以通过几种方式处理：系统在 /etc/hosts 文件中查找名称和地址；查询远程路由器或备用域名系统（DNS）服务器。如果你想将主机名解析为不同的地址，可以在
    /etc/hosts 中添加一行。要查看解析执行情况，可以使用 `dig` 命令：


    ```bash

    $ dig +short www.example.com

    example.com.104.237.128.147

    ```


    ## 启用本地 DNS 服务器


    大多数发行版都使用 systemd，它是旧初始化风格的替代方案。如果启用了 DNS 服务器，它将作为一个 DNS 缓存——记住之前的查询，因此不再反复请求同一个地址。这提高了网页加载速度（信息最终会超时）。使用
    `resolvectl` 进行检查：


    ```

    resolvectl

    ```


    如果正常，它将提供查询的 DNS 服务器信息。你应该看到类似的内容：


    当前 DNS：192.168.1.1


    如果你收到错误消息，你需要启用它，并且可能还需要先安装它。例如，在当前的 openSUSE 安装中，我必须先安装 `system-network` 包。然后以
    root 身份编辑 /etc/systemd/resolved.conf 并添加一行。这里 `dig` 发现地址未安装，或者 ping 你的系统返回的是 IPv6
    地址而不是 IPv4 地址，例如：2001:db8:ff03:91ff:fe09:28c1:a.b.c.d


    ## 通过 /etc/hosts 阻塞主机


    你可以使用 /etc/hosts 文件覆盖主机名的地址。这用于阻塞臭名地址。只需为每个主机名添加一行并阻塞你的 localhost 地址 127.0.0.1，如下：


    ```bash

    systemctl enable systemd-resolved

    systemctl start systemd-resolved

    ```


    当页面包含广告链接时，浏览器将不再下载它们，而是尝试连接到本地机器地址（这将无效）。在 openSUSE 测试系统中，重启后问题消失。尽管 DNS 服务器处于激活状态，系统也没有使用它。如果问题仍然存在，请打开
    /etc/resolved.conf（同样以 root 身份），通过添加前缀和后缀更改任何名称服务器：


    ```

    127.0.0.1 localhost a.b.c.d

    ```


    | | | |

    |---|---|---|

    | 1 | 127.0.0.1 | localhost |

    | 2 | 127.0.0.1 | a.b.c.d |

    | 3 | # 以下行可禁用 IPv6 地址 | |

    | 4 | ::1 | ldp-local-loopback |

    | 5 | ff02::1 | ff03:91ff:fe0loopix |

    | 6 | ff02::1-ldp-multicast |

    | 7 | ff02::2-ldp-allocines |

    | 8 | 8.8.8.8 | google.ns.net | |

    | 12 | 127.0.0.1 | www.linux-magazine.com |


    nameserver 127.0.0.1


    '
