- md: "\n# Whipper: CD Ripper\n\nThe name of this command line application seems reminiscent\
    \ of Devo's 1980s song, \"Whip It.\" This isn't far surprising we're dealing with\
    \ a 1980s piece of technology, the audio compact disc. But it's more likely, and\
    \ less interesting, that the name comes from the act of ripping - copying the\
    \ data from an audio CD to your computer. You might be right that CD ripping is\
    \ still relevant in the third decade of the 20s, and there are two things to tell.\
    \ The first is that a plethora of streaming services, very few offer audio at\
    \ CD quality. Most offer only via lossy compression, and CD audio delivers a quality\
    \ uncompressed 16-bit 44kHz. This means you can't always stream or buy everything\
    \ that was available on CD. Even if you can, it's probably remained by recognition.\
    \ This makes many of the original CD recordings the definitive article and still\
    \ worth ripping.\n\nThe second is that CD ripping is complicated. This is because\
    \ the audio data is digitally encoded on the disc, the optical diodes used to\
    \ read the data are analog and can introduce errors. While there is some error\
    \ correction, it's not always enough to guarantee the integrity of the audio data,\
    \ which means multiple readings and averaging are often required. This is what\
    \ Whipper does, \"aiming for accuracy over speed.\"\n\nIf you can find a CD driver,\
    \ Whipper can rip your favorite CD recording.\n\n```\n$ whipper b.\nusage: whipper\
    \ [-h] [-v] [-s (over,failure,success,always)]\n  --drive DRIVE_NAME\n\nWhipper\
    \ is a CD ripping utility focusing accuracy over speed.\nYou can get more subcommands\
    \ by using the -h option to the command.\n\nwhipper -h\n  record          record\
    \ API for playback\n  list            list available tracks on CD\n  info    \
    \        show metadata information\n  -s (over,failure,success,always) - (over,failure,success,always)\n\
    \  --close         whether to close the drive's reading before starting\n  --drive-offsets\n\
    ```\n\nIf it detects hidden tracks, it also re-encodes, and rectify name and tags\
    \ the extracted music files. It can also use AccurateRip's drive offsets values\
    \ to set drive alignment, which might be needed and is likely to be the biggest\
    \ problem if you want to finally rip your audio collection – finding a modern\
    \ computer with an optical drive that can read audio discs.\n\nBy Graham Morrison\n\
    \nhttps://github.com/whipper-team/whipper\n\n# What?! I can get my issues SOONER?\n\
    \n![](img/399caf126e037f28be04b36f402dd3c4_31_0.png)\n\n![](img/399caf126e037f28be04b36f402dd3c4_31_1.png)\n\
    \n# Available anywhere, anytime!\n\nSign up for a digital subscription to improve\
    \ our admin skills with practical articles on network security, cloud computing,\
    \ DevOps, HPC, storage and more!\n\nSubscribe to the PDF: bit.ly/ADMIN-digitalsub\n\
    \n![](img/399caf126e037f28be04b36f402dd3c4_31_2.png)\n\n# MULTIMEDIA\n\n## HACK\
    \ 22\n\nThere has been a steady influx of new audio software for Linux over the\
    \ past few years, and PipeWire looks to make the Linux audio stack professionally\
    \ performant and flexible. When it comes to digital audio, there's one particular\
    \ rule that rules them all, and that's Ardour. Ardour is 20 years old now, and\
    \ it has taken time to become the most powerful open source digital audio workstation\
    \ you can use. It's installed on macOS, Windows, and Linux everywhere, from recording\
    \ studios in America to bedroom studios in South America. It's powerful because\
    \ it's flexible, and (like Blender) this power comes from its modality. But if\
    \ you're interested in recording more than one thing at a time, this might scare\
    \ you off. In Ardour, routing inputs and outputs can be freely patched into other\
    \ tracks and channels, routed through software effects, or to provide surround\
    \ sound. With a single input and only headphones for output, you can create MIDI\
    \ and audio tracks with virtual synthesizers or software machines, arranging them\
    \ together across the horizontal timeline freely. In many ways, this flexibility\
    \ mimics creativity in a studio with infinite audio sources and destinations to\
    \ rewire, reconfigure, and experiment with. The recording studio metaphor has\
    \ also helped Ardour become an excellent tool for professional recording engineers\
    \ and students, especially because it's a way of crafting music that's already\
    \ established in software such as Pro Tools.\n\nThe release of Ableton 20 years\
    \ ago changed music and what musicians and recording engineers could do with their\
    \ work workflows. Rather than attempting to emulate a mixer and multitrack track\
    \ recorder, Ableton focused on creating from \"clips.\" Clips are blocks of audio,\
    \ such as bars of a drum loop, a repeating melody, sequence of chords, which you\
    \ place in a grid with variations of the same clip or column. Each clip is arranged\
    \ in rows across neighboring columns, and the row is as a sequence. With a single\
    \ clip, in live performance, the piece of music can change notes seamlessly between\
    \ beats. The magic sauce is that Ableton keeps everything alive, regardless of\
    \ the clip's original tempo, pitch, or even groove.\n\n- 1. Clips: Ardour now\
    \ supports clips for creative loops, live performance, and recording.\n- 2. Scenes:\
    \ All clips in the same row can be played, and everything that is used in the\
    \ background, including their insert effects, are active.\n- 5. Context Help:\
    \ Hover over an area to get help on selection. Clip and copy regions to access\
    \ other regions.\n- 6. Modality: Clips coexist with the standard Ardour functionality.\n\
    - 7. Properties: Select length, stretches, position, and clip triggers from the\
    \ new properties panel.\n\nAbleton still dominates the clip-launching DAWs, but\
    \ it has some serious competition from Bitwig Studio (which offers native Live\
    \ support, like Ableton) and Apple's Logic, which has been augmented with it.\
    \ Ardour can also be used for clip launching, because clip launching is a tool\
    \ to change the timing alignment built into a four-year project to the instruments\
    \ used by Ardour. The clip handler brings a new \"Cue\" into a place where you\
    \ can drag and drop clips from the timeline to outside the application entry.\
    \ Each drag and drop will create a new channel, aligned vertically. This can be\
    \ edited from a new panel to set the trigger and release modes, as well as the\
    \ option to trigger another clip from the current one. A horizontal strip of clips\
    \ can be triggered as a scene, and can be seen as the more traditional timeline\
    \ view. It works extremely well and feels like a natural extension to the recording,\
    \ editing, and mixing views which are only a single click away, finally bringing\
    \ Ableton into the 21st century.\n\n![](img/399caf126e037f28be04b36f402dd3c4_32_0.png)\n\
    \n> https://ardour.org/\n\nBy Graham Morrison\n\nCOOL LINUX – 2023 EDITION\n\n\
    # qpgraph: Audio Router HACK 23 / corrscope: Music Visualizer HACK 24\n\nPipeWire,\
    \ the audio handling system to replace PulseAudio, is now in many distributions\
    \ - including Pop!OS, Fedora and Ubuntu - to be considered the new standard. It\
    \ works incredibly well and offers much better performance and configuration over\
    \ the old. However, PipeWire lacks the desktop controls and smooth integration\
    \ that you come from being the daemon, which is why it is still better than PulseAudio\
    \ until fully integrated. It's also noted that many distributions will wrap PipeWire\
    \ directly into a PulseAudio layer with long-established control panels and applications,\
    \ but this misses some of the advantages you get directly from PulseAudio.\n\n\
    The Internet is full of videos containing just music with some simple visualization\
    \ to help provide feedback while you're listening. They're easy to create and\
    \ use if you want to share your music or create an easily playlist, but it's not\
    \ difficult to create a meaningful visualization. The biggest problem is generating\
    \ something that can be synchronized to the audio. One approach is to use coroscope,\
    \ which takes one or more audio files and generates an oscilloscope of those inputs.\
    \ When changing the frequency of the audio, coroscope solves the sync problem\
    \ in the same way as oscilloscope does, triggering points from the waveform upwards\
    \ or downwards of a square. The default values themselves can be customized by\
    \ changing the color, line width, the background, and vertical or horizontal lines.\
    \ Most importantly, you can generate more than one input and split these into\
    \ separate oscilloscopes. This works well for stereo tracks but best with chipune\
    \ music. This is because each channel is separated by the composition software\
    \ and each channel consists of simple oscilloscopes.\n\nqpgraph is a graph GUI\
    \ with an intuitive interface. Every detected input and output is shown in a graph,\
    \ with connections to show where audio data flows. If you use Firefox and use\
    \ it to play sound, for example qpgraph makes it easy to connect nodes and route\
    \ the audio to a recording application. qpgraph does this naturally, without any\
    \ other configuration. If you're a Gnome user, the equally brilliant Helvum presents\
    \ the same graph view within GtkWindow that integrates perfectly with your desktop.\
    \ Both applications are gateway to the wonderful world of PipeWire that don't\
    \ require any system-wide components. Any changes you make in the graph can be\
    \ previewed by clicking Preview. This fires up FFmpeg, the only dependency, and\
    \ if you like this high quality vision it is rendered at your chosen resolution\
    \ as you prefer.\n"
  mdcn: "\n\n# Whipper: CD 刻录器\n\n这个命令行应用程序的名字似乎让人想起 Devo 乐队 20 世纪 80 年代的歌曲《Whip It》。考虑到正在处理的是\
    \ 80 年代的技术——音频紧凑光盘，这并不意外。但更有可能也更无趣的是，这个名字来源于“刻录”（ripping）这一动作——将数据从音频 CD 复制到你的计算机上。你可能认为\
    \ CD 刻录在 20 年代的第三十年仍然具有意义，这里有两点需要说明。第一，尽管有很多流媒体服务，但极少数提供 CD 音质的音频。大多数只提供有损压缩音频，而\
    \ CD 音频提供的是未压缩的 16 位 44kHz 音质。这意味着你并不总是能流媒体或购买到 CD 上提供的所有内容。即使你可以，它们可能只是因为怀旧而留存。这使得许多原始\
    \ CD 录音成为了决定性的标准，依然值得刻录。\n\n其次，CD 刻录是复杂的。这是因为音频数据是以数字形式编码在光盘上的，用于读取数据的光二极管是模拟的，可能会引入错误。虽然有一定的纠错机制，但并不总是足以保证音频数据的完整性，这意味着通常需要多次读取并取平均值。这就是\
    \ Whipper 所做的的，“追求准确性而非速度”。\n\n如果你能找到 CD 驱动器，Whipper 就可以为你刻录你喜欢的 CD 录音。\n\n```\n\
    $ whipper b.\nusage: whipper [-h] [-v] [-s (over,failure,success,always)]\n  --drive\
    \ DRIVE_NAME\n\nWhipper 是一个专注于准确性而非速度的 CD 刻录工具。\n你可以通过使用命令 -h 选项获取更多子命令。\n\nwhipper\
    \ -h\n  record          录制播放 API\n  list            列出 CD 上可用的轨道\n  info     \
    \       显示元数据信息\n  -s (over,failure,success,always) - (over,failure,success,always)\n\
    \  --close         在开始前是否关闭驱动器读取\n  --drive-offsets\n```\n\n如果它检测到隐藏轨道，它还会重新编码，并纠正提取出的音乐文件的名称和标记标签。它还可以使用\
    \ AccurateRip 的驱动器偏移值来设置驱动器对齐，如果你最终想刻录你的音频收藏，这可能是需要的，而且可能是最大的问题——找到一台带有可以读取音频盘的光驱的现代计算机。\n\
    \n作者 Graham Morrison\n\nhttps://github.com/whipper-team/whipper\n\n# 什么？！我可以**早**拿到我的问题吗？\n\
    \n![](img/399caf126e037f28be04b36f402dd3c4_31_0.png)\n\n![](img/399caf126e037f28be04b36f402dd3c4_31_1.png)\n\
    \n# 随时随地，随处可用！\n\n订阅数字订阅，通过关于网络安全、云计算、DevOps、HPC、存储等实用文章来提高我们的管理技能！\n\n订阅 PDF：bit.ly/ADMIN-digitalsub\n\
    \n![](img/399caf126e037f28be04b36f402dd3c4_31_2.png)\n\n# 多媒体\n\n## HACK 22\n\n\
    在过去的几年里，Linux 上的新音频软件不断涌入，PipeWire 旨在让 Linux 音频栈具有专业级的性能和灵活性。涉及到数字音频时，有一条特定的规则主宰一切，那就是\
    \ Ardour。Ardour 现在已经 20 年历史了，它花费了很长时间成为你可以使用的最强大的开源数字音频工作站。它安装在 macOS、Windows\
    \ 和 Linux 的各个地方，从美国的录音室到南美的卧室录音室。它之所以强大是因为因为它很灵活，而且（像 Blender 一样）这种力量源于它的模态（modality）。但如果你感兴趣同时录制多一个东西，这可能会让你望而却步。在\
    \ Ardour 中，输入和输出的路由可以自由地连接到其他轨道和通道，通过软件效果路由，或提供环绕声。只需一个输入并仅使用耳机作为输出，你就可以使用虚拟合成器或软件机器创建\
    \ MIDI 和音频轨道，并在水平时间轴上自由地排列它们。在许多方面，这种灵活性模拟了在拥有无限音频源和目的地的录音室中创作的过程，可以对其进行重新布线、重新配置和实验。录音室的隐喻也帮助\
