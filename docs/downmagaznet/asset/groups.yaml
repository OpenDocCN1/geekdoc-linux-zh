    ## ImageMagick: convert


    ## 技巧 38


    你可以使用多功能的 `convert` 命令来将图像转换为另一种文件格式、重命名、裁剪和调整大小，例如：


    ```

    convert SOURCE TARGET

    ```


    这将创建一个新的目标文件，而保持原始图像不变。对应的 `mogify` 命令使用几乎完全相同的语法，但它会直接处理源文件。


    如果需要，你可以同时从一种文件格式转换为另一种格式并重命名文件。若要更改唯一格式：


    ```

    convert image.jpg image.png

    ```


    如果你只想更改文件名，请输入：


    ```

    convert image.jpg photo.jpg

    ```


    组合使用时命令为：


    ```

    convert image.jpg *.png

    ```


    如果需要，你可以在一个操作中转换特定类型的所有文件。有几种方法可以选择。这


    ```

    convert *.jpg *.png

    ```


    | 列表 1: 批量重命名 |

    | --- |

    | $0 for i in *.jpg; do convert "$1.jpg".png"; |

    | done |


    | 列表 2: 创建缩略图 |

    | --- |

    | 01 $ convert *.jpg -resize 200x200 preview.jpg |

    | 02 $ for i in *.jpg; do convert "$i.jpg" -resize 200x200 "thumbs/$i-thumbs.jpg";
    done |

    | 03 $ convert *.jpg -thumbnail 200x200 preview.jpg |

    | 04 $ convert -delay 100 *.jpg animation.gif |


    将所有 JPEG 文件转换为 PNG 目标格式，但不使用原始名称。这些文件将被命名为 **-1.png*、**-2.png* 等。然而，你可以轻松地使用终端命令（列表
    1）更改这一点。


    如果你想旋转或调整图像大小，`mogify` 通常非常有用，因为它直接转换源文件。例如，如果所有图像都是纵向的但应该以横向格式显示，你可以使用命令一次性将它们顺时针旋转：


    ```

    mogify -rotate "90" *.png

    ```


    或者反之


    ```

    mogify -rotate "-90" *.png

    ```


    诸如 `resize 800x600` 或 `-resize 50` 等参数用于减小图像尺寸。


    你可以使用类似列表 2 第 1 行的命令创建文件夹中 JPEG 的缩略图。它会将目标文件命名为 *preview-1.jpg*、*preview-2.jpg*
    等。如果你想获取名称并保存到单独的文件夹（thumbs/）中，命令可能就像列表 2 第 2 行。要这样做，如果你只想编辑图像文件的 `thumbs/`，例如
    200 或 x200 —— `--resize 200x200`，`convert:`会自动从元数据 (3) 中删除元数据和颜色配置文件。


    你可以类似地将图像转换为动画。你可以从一组 JPEG 文件创建动画 GIF，请使用列表 2 第 4 行的命令。

    在 `-delay` 之后输入值，单位是图像之间间隔的百分之一秒。如果你在示例中指定 188，则每秒会出现一张新图像。


    作者：Claudius Grier


    ## 技巧 39


    ## ImageMagick: 版权与其它


    一旦你使用 ImageMagick 工具创建了自定义形状、在图像上标记数据或图片致谢，或为在线预览添加水印，复杂性就会稍微增加。


    列表 1 中的命令在源图像中添加了版权标签（注意方位词的大写）。这里使用的字体是 150 像素大小的白色 DejaVu Sans：紧随 `DejaVu Sans`
    之后的 `xy` 值可以在需要时用于按像素移动字体（例如 `-20`）。在示例中，我们将其留在原始位置 (0)。已安装字体的正确拼写由以下命令提供：


    ```

    -list font

    ```


    要设置水印，最好使用 ImageMagick 的 `composite` 程序将源图像与具有 Alpha 通道（即透明背景）的现有图像混合（见图）。以下值
    `''-alpha''` 范围介于 0（透明）和 100（不透明）之间。列表 2 示例中的 50 意味着 50% 的透明度。该命令与其他所有使用星号代替文件名的命令一样，可以应用于特定类型的所有文件。


    作者：Claudius Grier


    | 列表 1: 标记图像 |

    | --- |

    | $ convert Image.jpg -gravity Southwest -pointsize 150 -fill white -font DejaVu-Sans
    -annotate 8 "(©) COPY FROM XYZ / 2022" target.jpg |


    | 列表 2: 水印 |

    | --- |

    | composite -watermark 50 -gravity Center WATERMARK.png SOURCE.jpg TARGET.jpg
    |


    > 水印可以帮助你在网上保护图像。


    ![](img/399caf126e037f28be04b36f402dd3c4_48_0.png)


    ## Stable Diffusion (AI 图像生成器)


    在过去的几个月里，我们被人工智能生成的无限图像所淹没，甚至感到无味。图像通过提示词中输入的一两行文本就完全形成，通常伴有对齐不齐和“恐怖谷效应”。OpenAI
    的 DALL-E 是第一个获得头条的，随后是 Discord 的 Midjourney，现在 Meta 也在加入战。这些工具的工作原理是从网上抓取图像并将其作为机器学习的输入。


