    # Conclusions


    While OpenSnitch is annoying at first, this means it is doing its job. You can
    temporarily disable the firewall and deny requests by defining more rules when
    it suits you. Starting with OpenSnitch is quite easy thanks to the documentation.


    OpenSnitch is interesting for browser plugins, web apps, or third-party applications
    in general. It helps you keep an eye on these applications and make adjustments
    to rules as you need. You will be surprised about what some apps try to do. In
    conclusion, OpenSnitch definitely improves the security of your system without
    asking much of you beyond the initial setup.


