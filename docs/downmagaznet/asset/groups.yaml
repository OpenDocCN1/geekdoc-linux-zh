- md: "\n# Create Games with the Godot Engine\n\nThe Godot engine has been under development\
    \ since 2014 - it has recently made a version leap from 3x to 4x, and a lot has\
    \ been going to do since the release of 4.0. There was a $250 development grant\
    \ from Epic, a $120 grant from the Russian game developer Kefer, and significant\
    \ donations from Ubisoft and Embark Studios. These are for open source projects,\
    \ and illustrate how important the project has become. It's a better story than\
    \ the one where a scale position was missing on some essential infrastructure\
    \ in their time.\n\nGodot has garnered interest because it fills an important\
    \ role, in much the same way Linux does. It's an engine that helps developers\
    \ create games, and is the most widely used open source besides Unity and Unreal\
    \ Engine (UE), both of which are ashamedly proprietary and even hostile towards\
    \ portability. Developing a game with either system costs the same as it did when\
    \ you were developing in the mid-1990s, except it is open source development that\
    \ you won't be locked in, won't force you to install upgrades, and you won't get\
    \ a percentage of whatever you sell your game. More importantly, it will reward\
    \ whatever you put into the learning with continued openness and relevance, much\
    \ like the effort we've invested in learning Linux.\n\n- 1. Nodes and scenes:\
    \ All games have elements, a node of game can be created by simply designing and\
    \ organizing them.\n- 2. Viewport: Create views to see and position nodes within\
    \ your game, and create what the player sees.\n- 3. Tabs: Multiple views can be\
    \ opened at once and can be manipulated like in Blender, with X, Y, and Z handles.\n\
    - 5. Properties: Also as in Editor, edit properties without resorting to any code.\n\
    - 6. Inspector: Switch between properties, nodes, and editing history.\n- 7. Output\
    \ page: See debugging information for various parts of your game.\n- 8. Resources:\
    \ Everything needed for your game is listed here, including code and shader files.\n\
    \nVersion 4 is a huge upgrade, and one that demarcates Godot's transition from\
    \ an amateur's prototyping to a professional game development engine that can\
    \ compete directly with Unity and UE dominance. You can see this from your first\
    \ glance over the editor. The central view, the inspector, the scene explorer,\
    \ and the asset library are all consolidated. Behind the scenes, the 3D engine\
    \ has seen great improvement, not just in low-rendered OpenGL games, but in its\
    \ capabilities. A new Vulkan renderer, which will be great for Scene Development,\
    \ as will support even better animation options, including voxel global illumination.\
    \ There are advanced shadow shaders, a new sky shader, and asset import capabilities\
    \ with Godot. The end results are amazing, and Godot's output is down to the AAA\
    \ league. It is clear that these features will excel that come with the release,\
    \ and for the panels around the 3D.\n\nFor games with fewer dimensions, there's\
    \ an amazing new map editor. This is a standalone review of its own, although\
    \ the essential outside drawing tools include powerful features such as layers,\
    \ tiles, auto-tiling, metadata, and animations. Tiles are expanded to remove games,\
    \ and when paired with the engine's 2D rendering output, Godot has streamlined\
    \ the whole process of creating 2D games. Rendering output includes multi-sample\
    \ anti-aliasing, directional 2D lighting, and shadows. To help with programming\
    \ logic, the new Godot engine has been built from version 2, and C# and .NET have\
    \ now first-party support. All of these improvements are already delivering results,\
    \ not in the quality of the games by Godot, but in the rate the community is expanding.\
    \ It means the documentation is also improving, with more tutorials, and more\
    \ video coverage, which will help back into the success of the project and the\
    \ being of what we hope is a new era in open source game development.\n\nhttps://godotengine.com\n\
    \n> By Graham Morrison\n\n# IT Highlights at a Glance\n\n# LeanCreator: Qt IDE\n\
    \nThe Qt project has a long history of differing with licenses and business models.\
    \ It has sometimes brought into conflict with the Linux community, with its early\
    \ proprietary licensing the foundations of Gnome, for instance. It has remained\
    \ open source, but various new developments and components have drifted into and\
    \ out of inclusion as the Qt project experimented with new models. Recently, the\
    \ Qt project, the Qt Company, announced it would only release LTS versions of\
    \ Qt 6 and not intermediate patches, for the KDE project to maintain all ours.\
    \ This leaves its sub-projects, such as the brilliant platform-agnostic Qt Creator,\
    \ stuck in the middle of a storm they have no control over, and for users to know\
    \ which such sub-projects.\n\nQt Creator has been released under the terms of\
    \ the GPL, but it has also become more interwoven with the Qt framework and its\
    \ priorities. What motivated the creation of LeanCreator, a fork of Qt Creator\
    \ that's attempting to make Qt open, and adaptable. It is built from itself, a\
    \ fork of Qt itself, in the shape of a project called LeanQt, which was the last\
    \ version released under LGPL v2.1. Both Lean-projects help at extracting only\
    \ what they need from their respective codebases, and LeanCreator builds into\
    \ a single executable without further dependencies or shared libraries. It's a\
    \ brilliant application, with powerful highlighting, autocompletion, and GDB support,\
    \ but these features have also been dropped, including Python, JavaScript, CML,\
    \ CMake, and make support, integrated version control.\n\n> By Graham Morrison\n\
