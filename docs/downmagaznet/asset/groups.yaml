    JupyterLab is a web-based program, and it supports several (interpreted) languages,
    including of— Python; the full list of languages is available online (2). When
    you launch a Jupyter session you''ll get a new browser tab from which you can
    use the software.


    In a Jupyter session you can create one or more notebooks, and each notebook can
    use a different "kernel". The kernel does the programming'
