    initially because you need some time to define rules for all the applications
    that need to contact the outside world. Use this button to break up the task into
    convenient chunks of time.


    In the menu below, you will find eight tabs. The Events list contains all the
    connections to the world in real time. Nodes typically show only one socket per


    Figure 5: The Events tab lists all connections in real time. You can see connection
