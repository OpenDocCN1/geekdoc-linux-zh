    \ to get them organized. Connecting one or more monitors would improve the space\
    \ on your desk as you need.\n\nInstead of fairly, for Linux environments like\
    \ KDE, Gnome, and most others have a feature called virtual desktop. You can have\
    \ two or more independent areas where you can place your windows. There no need\
    \ to minimize them; just spread them out as many as you need.\n\n# KDE\n\nOn KDE,\
    \ press Ctrl+Alt+F2 to go to a second (empty) desktop; Ctrl+Alt+F1 brings you\
    \ back to the original one. This is simple. If it doesn't work, virtual desktops\
    \ are disabled. Use the start menu, virtual, and select the Virtual desktop configuration\
    \ menu. Then click on the number of desktops you want (Figure 1). KDE absolutely\
    \ makes it to have at least four more hotkeys (KDE Ctrl, F3, F4, etc.).\n\n![](img/399caf126e037f28be04b36f402dd3c4_13_0.png)\n\
    \nAdd the Workspace Switcher to your panel so that you can switch the desktop\
    \ with a single click.\n\nIf you would prefer to use Ctrl+F1, F2, etc. on Cinnamon\
    \ (Open Preferences) Keyboard from the menu, switch to the desktop using the task\
    \ bar, and press the Workspaces | Direct Navigation: you will let you switch to\
    \ the desktop directly.\n\n# Gnome\n\nWith a Gnome installation, Alt+Right will\
    \ bring you to a new, desktop but only after you've opened one on the current\
    \ desktop. Ctrl+Alt-Left (or Win-PageUp) will go back to the previous desktop.\n\
    \nBy default, Gnome only has a shortcut for the first desktop (Win-Home), but\
    \ when you open the settings and go to Devices, Keyboard, you can add hotkeys\
    \ for further desktops. Gnome applications use it to show the shortcuts available\
    \ in the program.\n\nIn all desktop environments, your window will let you move\
    \ to a different workspace, and there may even be hotkeys for doing with the mouse.\
    \ The developers have come up with multiple ways to configure your desktop' behavior\
    \ (e.g., some program may always open the second desktop).\n\nIt takes some time\
    \ to use multiple desktops, but once you know the most important hotkeys by heart,\
    \ you'll do things much faster than before. If you switch between KDE, Gnome,\
    \ and other environments or managers often, it might make sense to change the\
    \ settings so that working with virtual desktops feels the same in every environment—or\
    \ if you've already chosen your favorite desktop, simply get to know their default\
    \ hotkeys. \n\nRename the they (for example: Desktop 2, Desktop 3, or something\
    \ that reminds you of the activities you want to perform on a desktop) and arrange\
    \ them in colors. (By default, KDE puts all them in a single row, which will cause\
    \ too much space in the taskbar).\n\n![](img/399caf126e037f28be04b36f402dd3c4_13_1.png)\n\
    \n> By Hans-Georg Ebeer\n\n# Cinnamon\n\nIf you run Cinnamon, press Ctrl+Alt+Right\
    \ to move to the next desktop. Cinnamon calls them “workspaces,” but the concept\
    \ is the same. Press Ctrl+Alt+Up to view a summary of all desktop contents (Figure\
    \ 2). This is also the right place if you want to add more desktops.\n\n![](img/399caf126e037f28be04b36f402dd3c4_13_2.png)\n\
    \n14\n\nCOOL LINUX HACKS – 2023 EDITION"
