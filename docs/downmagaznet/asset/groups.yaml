    from one format to another. This latest breakthrough that LosslessCut manages
    to mitigate. By using versatile FFmpeg, LosslessCut can edit videos and vitally,
    can export quickly with no loss of quality. It accomplishes this by only letting
    you edit at your own speed.


    like this is the perfect solution. We''re not looking for the perfect edit, but
    instead a way of cutting quickly to the action, chopping the preamble or beginnings
    and ends of our videos. With LosslessCut, you can drag-and-drop into the main
    application, locate the "edit-in" point, locate the "edit-out" point, and save
    the segment as a new video. This means you can perform any other kind of editing,
    such as crop, reorder, and processing, which would require frame and keyframe
    recalculation, and a lossless-identity transformation. That only you can always
    edit at the exact point you want to edit or split point. Fortunately, with keyframe
    icons in the UI that automatically move the cursor to keyframes and edit points.
    With these limitations removed, the performance bottleneck becomes storage access
    rather than reconstructing the video.


    Between editors is being worked on, with a new development release capable of
    reconstructing the frames before a keyframe enabling anywhere with some processing
    and you for the reconstructed point. The editing of the video will be effortless,
