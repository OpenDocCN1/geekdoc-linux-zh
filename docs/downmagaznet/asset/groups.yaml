    \n使用 `-i`，你可以查看文件中的对象，如果可用还可以查看文件创建的详情（图 4）。其中任何内容都可能是敏感的——例如，元数据可以作为文件已更改的证明，或者创建者可能对内容承担责任。为了避免这种情况，你可以使用\
    \ `-s` 擦除所有信息。\n\n## pdf-redact 工具\n\n### PDF 现代化\n\n脱敏（Redaction）是在向公众发布文档之前删除隐私或敏感信息。随着政府官方文件的发布，脱敏表现为被黑色遮盖的单词或模式。在商业领域，脱敏也是必要的，尤其是当内部文档向公众公开时。`pdf-redact`\
    \ 工具允许通过选项进行脱敏。你可以将 PDF 在任何方向转换为 PNG，这也可以通过将 PDF 转换为多页 TIFF 文件来实现。\n\nPDF 是一个三十年前的遗迹。虽然数百万人使用它的默认设置，但这些权限对于最基础的隐私和安全来说已经不再足够。今天，PDF\
    \ 的加密级别已经提高。如果你对隐私或安全有要求，你应该对你的 PDF 使用其他工具之一。这样做是在安全感下的工作。\n\n使用 `--sanitize size\
    \ (FILE)`，脚本会清理敏感名称，类似于文件脱敏器。然而，最常用的选项是 `--raster PDF (FILE)`，它将颜色覆盖为黑色，将白色覆盖为白色，以阻止打印机在使用通用打印机时进行绘图——这是众所周知但并不广为人知的。近期亮点\
    \ [7]\n\n作者：Brucefield\n\n此选项也可以在 Gimp 等图形编辑器中完成。然而，如果所有这些脱敏工具都能半自动并由单个命令执行，总是总是更好。\n\
    \n- [1] PDF 不安全：https://www.locklard.com/password-pdf/\n- [2] pdfrack: https://sourceforge.org/projects/pdfrack/\n\
    - [3] poppler-utils: https://github.com/download/poppler-utils\n- [4] PDF: https://sourceforge.io/\n\
    - [5] PDF 选项：https://readthe.org/en/stable/\n- [6] PDF 工具：https://github.com/firstlookebook/pdf-redact-tools\n\
    - [7] 打印工具：https://www.bbc.com/future/article/20170607-hyp-pdfs-secret-redacting-tracking-tools\n\
    - [8] pdfrefactor: https://github.com/endorf/pdfrefactor\n\n使用 `pdf-redact-tools`，不再在网上搜索其他\
    \ Linux 脱敏工具。\n\n> 图 4：由 pdfrefactor 生成的某些版本数据。\n\n```\nunencrypted.pdf: --A Version\
    \ 1\nunencrypted.pdf: --A Version 1 Object 73 (Unknown)\nunencrypted.pdf: --A\
    \ Version 1 Object 74 (Unknown)\nunencrypted.pdf: --A Version 1 Object 75 (Unknown)\n\
    unencrypted.pdf: --A Version 1 Object 76 (Unknown)\n--A unencrypted.pdf\n```\n\
    \n## pdfrefsubset\n\n```\nVersions: 1 -- 77 objects\nPDF: 1.3\nTitle: (Microsoft\
    \ Word - Document)\nSubject: \nKeywords: \nCreator: (Word)\nProducer: (Quartz)\n\
    Context: macOS 10.14.6 (Build 1895)\nCreationDate: 2019-09-18 12:30\nModDate:\
    \ 2019-09-18 12:30\n```\n\n`pdfrefsubset` 的主要用途是查看文件的版本——`-q` 返回已有的版本数量。\n\n##\
    \ Kavita：收藏管理器\n\n跟踪和管理物品收藏有许多方法，从文件夹中的简单文件到开源数据库，甚至是电子表格。没有什么比找到一个由对特定类型收藏有相同热情的人构建的工具更好的了。Kavita\
    \ 是什么？它是一个自托管的基于 Web 的收藏管理器，专门为漫画、漫画书设计。它并不容易，你可以创建任何东西的收藏，但基于文本的图形将利用集成的书签、浏览器阅读和搜索功能，此外用于查看收藏的图像缩略图将看起来统一。\n\
    \n该项目使用 Angular 框架构建，Kavita 包含一个 Linux 安装程序来处理所有依赖项，许多人在 Docker 内部运行服务器。无论你选择哪种，都很上手。Web\
    \ UI 允许你创建用户账户，并确保你可以通过导入自己的标题开始建立库。Kavita 可以消费作为 CBR、CBZ、ZIP、图像文件的漫画以及网络上的书籍。Kavita\
    \ 设计用于管理和收集你的书籍，同时也收集你的界面。你可以从 Web 界面查看和阅读你的标题，并从离开的地方继续，即使是在新的会话或不同的计算机上。你还可以将其添加到列表和类别中，并轻松跨收藏搜索你可能寻找的短语。它在平板电脑上运行效果非常好——你可以像使用它一样使用它。\n\
    \n作者：Graham Morrison\nhttps://github.com/Karekita\n\n## 使用 grep 搜索 Office 文件\n\
    \n如果你喜欢在命令行中工作，你可能知道 grep 工具可以搜索文件内容。你可以使用简单的模式（例如单词或数字），可以使用正则表达式，它们非常强大以至于有专门的书籍介绍它们。例如，正则表达式\n\
    \n```\n^[0-9]{1,3}-[a-z]+$\n```\n\n将匹配以下行：\n\n```\n12-abc-12\n9-zzxx-9\n13-aaaa-13\n\
    ```\n\n如果你熟悉正则表达式，O'Reilly 在他们的网站上有很好的介绍 [1]。\n\n## 二进制文件问题\n\n虽然 grep 可以搜索文件，但许多应用程序创建无法被\
    \ grep 的二进制文件。例如，LibreOffice 将文档存储在 ZIP 存档中。尽管它们具有 .odt（文本）、.ods（电子表格）或 .ppt（演示文稿）等扩展名，所有这些文件都是\
    \ ZIP 存档。你可以将这种类型的文件重命名为 .zip 并默认程序打开——你会发现某些存档管理器显示文件夹结构。\n\n图 1 显示了 LibreOffice\
    \ (.odt) 内部。ZIP 存档中最重要的文件是 content.xml。在 Writer 中分配 Heading 1 标签的示例“Heading 1”内部以文本形式存储（不包含行）：\n\
    \n```xml\n<text name=\"Heading_1\">\n<outline-level=\"1\">\nExample Heading 1\n\
    </outline-level>\n</text>\n```\n\n随后的段落以类似的方式存储：\n\n```xml\n<text name=\"P\">\n\
    This is a sample document to show the structure of LibreOffice document files.\
    \ This is a sample document to show the structure of LibreOffice document files.\n\
    </text>\n```\n\n由于 XML 文件也是文本，因此可以使用 grep 进行搜索。每次你搜索内容时，重命名你的 office 文件、提取内容并访问它是一项费力的工作。\n\
    \n## 通用 grep\n\n我写了一个工具来自动化此过程：grep（“通用 grep”）。它能够搜索 LibreOffice 和 Microsoft Office\
    \ 文件、PDF 以及普通文本文件。\n\n- xllint 可以解析和格式化 XML 文件，这对于 LibreOffice 文件是必要的，它们倾向于包含长行——当你期望只看到一点上下文而不是几乎整个文档的内容时\n\
    - pdfgrep 是一个独立的工具，用于检查 PDF 文件。grep 使用它来搜索 PDF 内部的内容，并在某些情况下搜索 office 文件。\n- xllint\
    \ 和 pdfgrep 工具默认未安装；在 Ubuntu 上\n\n"
