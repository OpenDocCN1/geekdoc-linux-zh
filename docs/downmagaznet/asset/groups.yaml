    ## Plasma 系统监控器


    Linux 拥有 CPU、内存、存储、网络和进程监控器：这对于大多数开发者来说是非常受欢迎的“入门项目”。对于新的编程框架或工具，尝试新方法比依赖层层使用
    `top` 或 `topo` 获益更多。


    该类别中最好的工具之一是一个多年来不断改进的成熟系统监控器：我们指的是 KDE 使用 Kirigami 框架的 System Monitor。这些特效和设计团队的卓越工作是你首先注意到的。Plasma
    Monitor 看起来非常精美。所有内容都使用矢量绘制，无论窗口大小或占据屏幕的比例如何，都能完美响应。它在智能手机上运行良好。在 Ubuntu 上，我们使用


    ```bash

    sudo apt install plasma-systemmonitor-kde-desktop

    ```


    来安装该应用程序。启动后，默认概述页显示内存、存储和使用率的三张图表；窗口大小会根据其尺寸实时调整。每个图表动态更新内容；每个元素都包含尽可能丰富的细节，而不会让人眼目缭乱。应用程序列表信息丰富：例如，每个运行的应用程序、其
    CPU 和 RAM 开销，均显示其入站和出站网络使用情况以及读写吞吐量。


    默认配置中的其他页面显示更多任务管理器信息，包括一个列出运行进程的页面，其细节与应用程序视图相同，并带有父进程和子进程的视图、特定用户拥有的进程视图，以及向列出进程发送任何信号的能力。还有一个精美的
    CPU、内存和网络使用率直方图。除了默认设置外，Plasma 系统监控器完全可编辑，允许你添加和删除页面、创建水平和垂直容器，并添加任意数量的传感器来创建自己的仪表板。传感器列表非常丰富，从单个
    CPU 和 GPU 核心到操作系统统计数据、内存和网络细节。所有这些内容都可以多种显示方式渲染，包括饼图和直方图、表格、线条、图表、文本，甚至可以可以添加到桌面或任务栏的桌面小部件。


    这让人想起了另一个优秀的监控工具 KSysGuard，它仍在维护中。KSysGuard 类似，但它可以监控每一个事件，相比之下，Plasma System
    Monitor 显得更加敏捷。它的感觉更像是一个用于现代桌面和手机框架（如 Home Assistant 的仪表板）的 IDE，而不是任务管理器，而这正是
    Plasma System Monitor 的定位：


    - 1. **多页面：** 你不能更改少数几个页面，但可以添加许多新页面。

    - 2. **任务管理器：** 合并并以不同方式查看传感器的意义。

    - 3. **编辑模式：** 将传感器分组在一起并进行垂直或水平对齐。

    - 4. **显示样式：** 以直方图、饼图、线条等形式查看数据。

    - 5. **聚合数据：** 关联并合并各种传感器。

    - 6. **小部件：** 面板和桌面小部件提供所有相同的功能，包括 CPU、内存、网络速度和使用率。


    > 作者：Graham Morrison


    ## 使用 fswatch 进行系统监控


    大多数 Linux 用户可能使用过 `cron` 或 `at` 来计划运行命令。两者在各自领域都有用处：`cron` 用于调度事件，`at` 用于调度循环事件。然而，两者都缺乏在不特定脚本的情况下获取更好系统信息并做出响应的能力。使用
    `watch` [1] 和 `fswatch` [2] 来做这些事情要简单得多。虽然两者都可以用于收集可能的安全入侵信息，但都可以经过微调，像调度器一样工作，且每次命令运行之间的影响很小——间隔显然是为即时故障排除而选择的。然而，在始终始终运行的计算机上，将间隔设置为
    86400 将意味着每天运行一次，将间隔设置为 604800 将意味着每周运行一次。可以使用命令或周期来编写大时间间隔；最小间隔为 1 秒。`watch`
    与其他工具的区别在于，如果计算机关闭，你需要重新启动 `watch`，这是 `cron` 没有的问题。由于某些不明确的原因，间隔可以用 `--precise
    (-p)` 进行补充，以确保间隔需要精确度。


    ## watch


    `watch` 的目的是跟踪命令输出随时间的变化（图 1）。这可以用于故障排除，也可以在安装或更新新软件包时保持某个常规或用户项目打开状态。有限的变化也可以作为某些任务的更简单替代方案。表
    1 显示了几个示例。但 `watch` 每隔两秒运行一次，直到被清除或中断。基本结构是：


    `watch` 同时也支持控制和退出行为的选项。使用 `--line (-l)` 会高亮行，使用 `--diff (-d)` 会高亮与之前不同的输出。你还可以通过
    `--title (-t)` 更改显示当前命令和时间的标题。退出选项多种。使用 `--check (-g)` 在输出变化时退出，这可以是一个明显且实用的指示。使用
    `--error (-e)` 在发生错误后发出响声表示 `watch` 已带错误退出，并等待按下任意键。


    WATCH 选项


    根据命令的内容，`watch` 可能包含在引号内。例如，如果命令使用了管道，则可以运行 `watch`，或者使用 `--exec (--x)`。或者，当命令包含多个命令时，不需要新进程。


    有两个选项设置了 `watch` 的行为。最重要的是 `--interval SECONDS`。`--interval` 选项覆盖了默认的 2 秒。


    ## fswatch


    `fswatch` 监控目录或文件的更改。Ubuntu 用户可以使用 `fswatch` 安装它。使用它最简单的方法是运行 `fswatch`。在 macOS
    上，它使用 FSEvents，效率非常高。在 Linux 上，它使用 inotify。当你启动 `fswatch` 时，它会报告文件和目录的变化。


    ### 表 1：WATCH 选项


    | 命令 | 描述 |

    | :--- | :--- |

    | --line (-l) | 高亮行 |

    | --diff (-d) | 高亮与之前不同的输出 |

    | --title (-t) | 更改显示当前命令时间的标题 |

    | --check (-g) | 在输出变化时退出 |

    | --error (-e) | 在发生错误后发出响声表示 watch 已错误退出 |

    | --interval (-n) | 设置更新之间的间隔 |


    ### 表 2：FSWATCH 动作


    | 动作 | 描述 |

    | :--- | :--- |

    | --format (-f) | 显示绝对路径 |

    | --recursive (-r) | 包含子目录 |

    | --include (-i) | 包含模式 |

    | --exclude (-e) | 排除特定模式 |

    | --interval (-i) | 设置事件之间的间隔 |

    | --event (-e) | 在一个事件后退出 |

    | --format (-f) | 使用 strftime 代码格式化输出 |

    | --timestamp (-t) | 在输出中添加本地时间 |

    | --utf-time (-u) | 获取 UTC 时间 |

    | --links (-L) | 跟踪符号链接 |


    #### 以下事件类型包含：


    - 创建

    - 更新

    - 删除

    - 重命名

    - 属性修改

    - 移动来源

    - 移动目标

    - 文件

    - 链接


