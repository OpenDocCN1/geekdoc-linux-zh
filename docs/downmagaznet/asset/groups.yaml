    the data is /tmp/oui.sock.

    The Rules tab, as expected, lists the application rules that have been created
    (Figure 6). The Hosts tab lists the remote sites that applications have attempted
    to contact and how and when it occurred. The Applications tab lists all the applications
    that have made contact and shows the frequency of those attempts.

    The Addresses tab keeps track of the rules and the frequency of contact attempts.
    Ports does the same in terms of the contacted hosts, while the Users tab lists
    involved users and records the number of connections initiated by the users. Any
    of these tabs, you can edit entries for editing by right-clicking on them.


    To avoid losing when faced with many entries, you can also sort or filter the
    entries in list. At the bottom of the window, you can see the number of connections
    during the current uptime and how many were rejected (dropped).


    # FAQs


    OpenSitch can manage anything that connects to a host from a Linux system. For
    multi-user systems, the rules can also be defined individually for each user.
    According to the developers, OpenSitch occasionally misses an app connection attempt;
    the wiki [7] on GitHub gives the possible reasons for this. However I do not find
    any such inquiries in it. An FAQ [8] answers frequently asked questions regarding
    the application firewall. Once you have your rules, OpenSitch runs unobtrusively
    in the background. A notification will only appear if you install a new app that
