  - "[PAGE 93]\n\n# SHELL HACKS\n\n# HACK 87\n\n# dict: A Command-Line Dictionary\
    \ Tool\n\nAs a writer, I rarely need to up the definition of a word. I don't know\
    \ a word, I'm not going to risk using it. However, I freely check that a word\
    \ has the exact nuance I want. If it does not, I turn to a thesaurus to search\
    \ for a closer alternative. Unfortunately, a regular dictionary is next to useless\
    \ for these purposes-which is why I was pleased to deliver dict [1], which not\
    \ only\n\nThis amount of information makes for intensive scrolling\n\nFigure 1:\
    \ A list of dict's installed databases.\n\n| The Collaborative International Dictionary\
    \ of English v0.4.48 |\n|---||\n| Any |\n First match |\n The Collaborative International\
    \ Dictionary of English v0.4.48 |\n Wordnet (r) 3.0 (2009) |\nMoby Thesaurus II\
    \ by Grady Ward, 1.0 |\n The Elements (276950) |\nV.E.R.A. - Virtual Entity of\
    \ Relevant Acronyms (February 2016) |\nThe Jargon File (version 4.4.7, 29 Dec\
    \ 2003) |\nThe Free On-line Dictionary of Computing (30 December 2018) Easton's\
    \ 1897 Bible Dictionary Hitchcock's Bible Names Dictionary (late 1800s) Brewer's\
    \ Law Dictionary, Revised 6th Ed (1856) The Devil's Dictionary (18811990) CIA\
    \ World Factbook 2002 U.S. Gazetteer Counties (2000)\n\nhas the information running\
    \ from the command line for added efficiency. A client for dict [2] dictionary\
    \ protocol, which searches dozens databases and returns comprehensive results\
    \ in seconds. It is available for loading in a separate registry stores or must\
    \ be installed separately from the basic command. The option --list will show\
    \ a list of these databases, as well as the version [3] of dict (Figure 1). The\
    \ databases supported by dict include a number of dictionaries, a collection of\
    \ resources, the Jargon File, the CIA World Factbook, and 34 other languages besides\
    \ English - far more than the average dictionary offers. The results include not\
    \ only literal meanings, but numerous contexts as well. Some default results for\
