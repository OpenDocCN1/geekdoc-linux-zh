    Games within games have been around for a long time. In the 1990s, sporty games
    in particular offered several mini-games put together into an "Olympics" or sports
    triathlon, both in the arcade and home computers. Using the Nintendo Switch with
    Wii Sports, and Starship Olympics de is a beautifully drawn and rendered, top-down
