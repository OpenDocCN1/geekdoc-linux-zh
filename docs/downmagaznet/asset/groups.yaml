    ## Stable Diffusion (AI Image Generator)


    Over the past months, we''ve been inundated, and even bored by endless images
    generated by artificial intelligence. Images arrive fully formed from a single
    line or two of text entered into prompts, often with misaligned lines and uncanny
    valleys. OpenAI''s DALL-E was the first to grab the headlines, quickly followed
    by Discord''s Midjourney, and now Meta are taking on their own. These tools work
    by scraping images from the internet and using them as inputs for a machine-learning
    model that can generate images from natural language inputs. But they''re also
    closed source, at least for now, with one exception, a piece of software called
    Stable Diffusion.


    Stable Diffusion is a (non-OSI compliant) open source project that generates exactly
    the kind of images from its own model, which can be installed on your local hardware
    and without sharing any information or being online. The model won''t take you
    weeks to download it.


    This the cutting edge of technology is itself complex, but the results are astounding.
    Fortunately, you can get these results without understanding the first thing about
    machine learning or neural networks. Stable Diffusion is now available as an API,
    which means its features needs to be accessible via a client. There are a few
    different front ends, but the project also includes a simple command-driven client.
    All of them is easy to install, and the fully trained model containing "visual
    information" is a 5GB download.


    > The input text to generate this image was "A photograph of Graham Morrison,
    an old fat man having a life crisis caused by money he doesn''t have on synthesizers."


    and it is installed locally, with no requirement for a stable network connection.
    Stable Diffusion is running, although you do realistically need a modern GPU with
    CUDA support to reduce rendering times to less than a minute, or even less than
    10 seconds on the best hardware.

    The two most scripts in the project are txt2img.py and img2img.py. These will
    transform either text into an image, or another image into an AI-generated image,
    and the first one''s been grabbing attention. This takes text from a -prompt argument
    to generate an image,


    > "A patented application for a mouth-operated instrument of the future."


    and text can be anything. Providing a style, such as "photographic," or "impressionistic,"
    you''ll need a subject and understanding. You might want to produce a "renaissance-style
    image of a flying car in a sunset cityscape in the year 2040" or "an explosion
    with no rules and expression." There are other options for the resolution, downsampling,
    and scale, but the default values work. The well-known parameter can be used to
    generate the same image from the same input; however image you generate even from
    the same text will be different.


    Stable Diffusion builds images from noise, using its neural network to synthesize
    images from the lower-dimensional sources. The text you use as input when images
    are taken from the noise serves as a guide to what an image should consist of.
    The output is both fascinating and terrifying, and is sure a sharer of home for
    creative artists and designers (ultimately, all of us) for ideas and planning.
    It''s especially empowering if you can generate any kind of image because now
    you can generate any kind of image and take credit for its creation. With just
    the final output it is difficult to define whether an image is a composite. But
    the lighting, perspective, style, and subject are all utterly unique to the generated
    image, and it''s something that really needs to be played with to be believed.


    By Graham Morrison


