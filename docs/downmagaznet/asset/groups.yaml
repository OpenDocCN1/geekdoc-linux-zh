    # 安全与隐私


    # HACK 19


    # Parrot OS 桌面安全


    Parrot OS 的主页列出了四个主要关注点：安全、软件自由、轻量级系统和跨平台移植性。除了这些关注点，它还特别关注开发栈以及让新手养成良好习惯的目标。在所有关注点中，Parrot
    以其安全意识最为闻名。然而，它在这些方面在很大程度上都取得了成功。通过将隐私和安全工具作为标准安装的一部分，Parrot 可能在推动所有用户（而不仅仅是新手）养成更好的安全习惯方面最为成功。


    Parrot OS 基于 Debian Testing，是一个滚动发布版本，软件包在经过测试后会更新，尽管官方也会定期发布正式版本。它还提供 MATE 或
    KDE 作为开发环境的选择。Parrot 提供 256MB 内存，按照现代标准来看，它是轻量级的，既适用于旧系统也适用于新系统。其跨平台移植性的目标体现在可用下载的数量上。家庭版（Home
    Edition）用于渗透测试和其他安全工作编程（图 2）。家庭版和安全版（Security Edition）都可以在 Boxes 中虚拟运行，并包含了 VMware
    和 VirtualBox 的镜像。安全版包含了不含硬件设备的 x86 变体，还提供了可以在浏览器中运行的 Freebox 版本以及 ARM7 架构版本。此外，安装镜像包含现场版本（Live
    Version）。安装通过 Calamares 安装程序进行，这是可用最简单的安装方法之一。


    图 1：基于 MATE 的 Parrot 桌面。


    ![](img/399caf126e037f28be04b36f402dd3c4_27_0.png)


    图 2：安全版包含数十个脚本和应用，从其丰富的渗透测试菜单也可以看出。


    # 可用应用程序


    Parrot OS 最显著的特征是它的软件选择。可用应用程序只有少数几个，例如 LibreOffice 和 Gimp，这符合“安装最少软件以减少可能攻击机会”的基本原则。在这些基础软件之后，用户应仅安装他们需要的安全工具。甚至游戏菜单也包含了一个国际象棋——同样是为了吸引
    Parrot 期望吸引的智力型用户设计的。


    两个版本都包含 MATE 系统工具，例如清理已安装软件的 BleachBit 和用于分区的 GParted，但只有安全版包含了启动安全服务的手段。同样地，两个版本都包含了
    Vim 和 Neovim。然而，家庭版包含了三个专用的编程工具：编程文本编辑器 Gean；类似于 VSCode 的图形界面代码编辑器；以及用于开发的 ZED
    站点；安全版则额外包含了五个应用程序和链接，其中包含 Col（Git 的图形界面）、Meld，以及 git-ged（git 历史的图形化表示）。从两个版本提供的工具选择中可以看出，假设爱好者程序员将使用家庭版，而处理项目（通常带有远程仓库）的管理员和更高级的程序员将安装安全版。


    ![](img/399caf126e037f28be04b36f402dd3c4_27_1.png)


    28


    酷 Linux 黑客技巧 – 2023 版


    # 安全与隐私


    图 3：Parrot OS 使用 Calamres 安装程序。


    ![](img/399caf126e037f28be04b36f402dd3c4_28_0.png)


    挤满了脚本和应用，二级菜单包含 14 个项目，包括常用项目、信息收集、漏洞分析、利用工具、密码攻击、偏移与欺骗以及逆向工程，更不用说三级和四级菜单了，有些甚至更。仅仅这些条目就是教育的开始——谁知道呢，例如
    Linux 在我们使用的汽车行业中是多么重要的。


    汽车选项？


    这一切仅仅是一个概述。列出 Parrot OS 中包含的脚本和应用至少需要 5000 字，而完整记录所有内容将需要一本关于 Parrot 的书。


    然而，Parrot OS 真正在隐私和安全方面脱颖而出。某些工具，例如 Electron 比特钱包、Ricochet 聊天和 GNU 隐私助手是由其他项目开发的；而
    OnionShare 或 AnSurf 等工具则由 Parrot 项目本身开发。每种可用工具，例如，Parrot OS 同时提供 Tor 和代理用于匿名浏览，让用户选择哪一个本质上是提供了一系列精选的隐私和安全工具。在一个地方拥有所有这些资源意味着学习安全变得简单。


    家庭版的特点是匿名化所有系统通信，通过关闭漏洞通道并用一个按钮保护您的 IP 地址（AnonSurf）。它配有五种不同的工具，如元数据清理器和安全文件删除器。家庭版中的许多工具具有图形界面和嵌入式帮助，可以帮助只有少量先验知识的用户。当一个工具看起来很复杂时，Parrot
    OS 在此处提供了一个菜单。


    # 安全可访问性


    安全意味着与便利之间的权衡，Parrot OS 例外。KDE 的 Plasma 几乎不乏内容，其目标是任何桌面环境只是一个可能出错的地方。由于某些原因，许多安全专家倾向于完全从命令行工作。此外，据说
    Debian Torn 比其他发行版更可靠，但 Debian 仍然是一个非常稳定的基础。


    图 4：AnonSurf 是 Parrot 项目设计的应用程序效率的示例。


    如果 Parrot 没有提供最安全的发行版，它提供的也比大多数发行版多。Parrot OS 安装了广泛的隐私和安全工具，其中许多工具易于访问且随插随用。很多时候，Parrot
    提供了便捷的隐私和安全访问。Parrot 可能比大多数发行版更安全，它最大的成就就是安全教育，尽管多年来一直关注且需求日益增长，但遗憾的是这一点缺失。Parrot
    OS 同时提供了一套课程和一套实用的工具。


    结果，应该鼓励更多用户使用这些工具，也许他们会有足够的信心去学习它们背后的原理。


    ![](img/399caf126e037f28be04b36f402dd3c4_28_1.png)


    该版本以渗透测试（Pentesting）顶层菜单为主，用于取证调查。该菜单如此：


    > 作者：Bruce Field


    https://parrotsec.org/


    酷 Linux 黑客技巧 - 2023


    # 多媒体


    你的 Linux PC 是一台强大的多媒体机器。我们从 MythTV 开始这一部分：使用它录制和观看电视节目，并播放本地视频和音乐文件。


