    ## 图 3：一个典型的正向结果：使用标准测试找到了一个进程。


    ```

    Found HIDDEN PID: 3026068

    Cmdline: "<none>

    Executable: "<no link>

    "<none> ... maybe a transitory process

    ```


    基础测试与标准测试之间的区别在于细节。所有测试都具有相似的结构。它们会报告从一个阶段到另一个阶段的时间，并列出正向结果。如果没有发现任何正向结果，命令将退出且不显示任何信息。如果发现了隐藏进程，输出将提供
    PID，并说明它是从命令行运行的（这使其具有潜在危险）、还是可执行文件（这更加危险），或者它是否是一个隐藏进程（见图 3）。请注意，某些进程可能是隐藏的，并且可以通过较少的在线信息被识别为有害的。


    所有测试都会显示额外信息 `-v`，同时运行 `-d` 和 `-v` 可能会很有用。


    ## 其他版本


    在使用 `unhide` 时，有几种你可能想要探索的命令变体：


    - unhide-tcp：识别已列出但未被列出的 TCP/UDP 端口。其结构与 `unhide` 类似。

    - unhide-posix：适用于 Unix 类系统的 `unhide` 版本，与 Linux 不同，不像 Linux 版本那样彻底。

    - unhide-gui：`unhide` 的最新桌面版本，仅出现在 Debian Testing 中，但在我撰写此文章时无法运行它，也没有找到示例。`unhide-gui`
    在下一个通用发行版 Debian 12 中将非常有用。此外，`unhide` 也捆绑在其他安全工具中，如 Rootkit Hunter (`rkhunter`)。


    ## 选项


    选项放置在命令的末尾。在有说明的地方，大多数测试将接受大多数选项。为了进行彻底测试，你应该运行所有可能的选项。选项包括：


    - -d：在测试中，这自动化了你可能想要手动执行的操作。如果你收到正向结果，`unhide` 执行的第一件事是显示该测试的 PID，这正是 `-d` 的作用。如果两个测试给出的结果相同很好，但如果结果不同，你应该运行其他测试以获得更清晰的视图。

    - -f：写入一个名为 `unhide-YYYY-MM-DD` 的日志，显示测试的结构和时间以及当天的任何结果。如果你在运行 `unhide` 后尝试寻找隐藏进程，你可能需要读取此日志的一部分赖以跟踪你的调查（图
    4）。

    - -c：针对 `procs`、`for`、`checkowned` 和 `unchecked` 进程运行所有四项测试，尽管文档不足。

    - -v：提供更详细的输出（详细模式）。这些细节在测试期间默认不显示，但在测试运行时可以使用。如果设置了 `-v` 选项，测试将显示额外信息的排序情况，但不会发现任何新内容。


    ## 处理结果


    运行 `unhide` 时，结果并不总是确定的。请通过运行测试和 `unhide` 以及使用某些命令选项来确认你的结果。此外，请注意测试中的不确定性，以及系统上流量的增加。如果你能够通过搜索识别
    PID，那么它就是合法的。


    如果你发现某个进程已被破解，请立即隔离。不要尝试从该机器上检查某些注入，因为你无论如何都一无所获。从 Live 系统启动到受感染的机器。遗憾的是，这是一个缓慢的过程，涉及长时间的会话。最后，最快的恢复方法是重启备份。最终，`unhide`
    不是一个警报，因此对一台受感染机器的分析可能帮助你更严谨地恢复一台新机器。


    https://www.unhide-forensics.info/


    By Bruce Bylance


