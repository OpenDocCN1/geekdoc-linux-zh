    # DESKTOP MODDING


    ![](img/399caf126e037f28be04b36f402dd3c4_6_0.png)


    # Create Your Own Gnome Context Menu Entry


    Some distributions configure the Gnome file manager in a way that it provides
    shortcuts to actions in the context menu: For example, they may let you right-click
    an image and then convert it to TIFF, PNG, or JPG formats. You can add your own
    actions and most of your daily tasks from the context menu instead of using a
    shell. This example shows how to do it in KOME.


    What you need is a command that accepts a list of filenames. Also if you want
    to create smaller versions of pictures you''ve captured from your smartphone.
    If the file is named image_s.jpg and you want to transform it into image_s.jpg
    with a maximum resolution of 1000x1000 pixels, you can use the tool that is part
    of the ImageMagick package:


    ```bash

    convert image.jpg -resize 1000x1000 image_s.jpg

    ```


    Next you need to install the For Nautilus package [1] and run it from the list
    of installed applications (it will show up as Actions For Nautilus configurator.
    The web-based app will open a browser tab and show the current configuration -
    it with some pre-defined entries (such as Open in edit).


    First we need to automatically add a _s suffix to the filename (before). We can
    use the shell''s built-in string manipulation tools to strip the name into parts
    before and after the dot. If the filename is stored in a variable $f, then `${f%.*}`
    will remove the extension while `${f##*.}` gives us the just:


    ```bash

    $ f=my.test; echo "${f%.*}" "${f##*.}"

    my.test test

    ```


    Click on Action, Enter "shrink to 1000x1000" in the Label for the command field
    and /home/USER/bin/shrink in your user name. Also, set Min Items to 1 and save
    the configuration. Open a new window, navigate to the folder with images, select
    few of them, and right-click into the selection to open the context menu - you
    should now see a Shrink to 1000x1000 option which will create 1000x1000 versions
    of all selected pictures.


    Create a folder named shrink in your directory and then a new file /bin/shrink
    in that folder by putting the lines from List 1 inside, make the file executable,
    for example view:


    - [1] Actions For Nautilus: https://github.com/bassmanitrac/actions-nautilus


    ```bash

    chmod +x /bin/shrink

    ```


    Test the new script on the command line:

    If you have a sample.jpg in your Downloads/ folder, run /bin/shrink and check
    whether a new file sample_s.jpg has been created. If it works, you''re ready for
    the next step.

    Also, create shell scripts for other tasks. The script uses a for loop to convert
    several images to a list of filenames.


    By Hans-Görg Eiber


    # Actions For Nautilus configuration


    ![](img/399caf126e037f28be04b36f402dd3c4_6_1.png)


    COOL LINUX HACKS – 2023 EDITION


    7


    # New Service Entries for KDE


    KDE lets you add services to the context menu via appstore-like configuration:
    Open Dolphin settings (via Shift+Ctrl, or Configure Configure Dolphin) and select
    the Context Menu (or Services) entry in the left column - you then see a list
    of installed services and can enable or disable icons. If you click Dolphin you''ll
    find some add-ons from the KDE store (1).


    But there''s no need to rely on the work of others, you can easily add your own
    context menu just like we''ve done on Gnome in the previous has. We assume that
    you''ve already created a small Bash script that formats arguments as files and
    will perform some action on them, just like the shrink script creates smaller
    versions of images. Store it in the bin folder of your home directory (you may
    have to create this folder first).


    First, let''s find out where KDE stores services. Open a terminal and use the
    KDE frameworks kconfig to query the:


    ```bash

    $ k5config --path services

    /home/user/.local/share/kservice5/usr/share/

    ```


    In this case, Dolphin will show both the system-wide folder (/usr/local/share/kservice5/)
    and your user account''s folder (~/.local/share/kservice5/). Create a subfolder
    Services in your user account''s folder:


    ```bash

    $ mkdir -p ~/.local/share/kservice5/Services

    ```


    and then create a new, *.desktop file inside that folder and open it in Kate or
    some other text editor:


    Figure 1: Dolphin lets you access a special section in the KDE store where you
    can find new services for the context menu.


    ![](img/399caf126e037f28be04b36f402dd3c4_7_0.png)


    ```bash

    cd ~/.local/share/kservice5/Services

    touch shrink.desktop

    ```


    Enter the lines from Listing 1 and save the file. The first menu entry [Desktop
    Entry] declares that this file creates a context menu entry that appears when
    right-clicking any file - the KDE Type Name popup is a reminder from the times
    Konquer was KDE''s default manager. For example, /image/* is the MIME type. The
    action name must be repeated in the Name field of the section. If you give the
    action a name, an icon (any icon in one of the subfolders of /usr/share/icons/;
    don''t add a file extension), and most important - the Exec line command should
    be shrink.desktop for a list of files.


    The new entry will appear at once: Right-click on an image, and it will be visible
    in the list (2). If you want to move it to the Actions menu, delete the line X-KDE-Priority=TopLevel
    from the .desktop file.


    By Hans-Geörg Eber


    Figure 2: Shrink your pictures via the ''Shrink to 1000x1000''


    ![](img/399caf126e037f28be04b36f402dd3c4_7_1.png)


    # Listing 1: shrink.desktop


    | Line | Content |

    | :--- | :--- |

    | 01 | [Desktop Entry] |

    | 02 | X-KDE-ServiceTypes=PopupMenu/Plugin,Image/* |

    | 04 | Actions-shrink |

    | 05 | X-KDE-Priority=TopLevel |

    | 06 | |

    | 07 | [Desktop action] |

    | 08 | Name=shrink to 1000x1000 |

    | 09 | Icon=shrink |

    | 10 | Exec=/bin/shrink |

    | 11 | Type=Application |


    ![](img/399caf126e037f28be04b36f402dd3c4_7_2.png)


    # KZones: Plasma Tiling for KDE


    # DESKTOP MODDING


    One of the best things about the KDE desktop is that, while it''s a great experience
    in its own, it''s also a brilliant construction tool. This means you can customize
    and augment the layout exactly using the built-in settings in almost limitless
    ways, by KDE or by creating your own scripts. This is seen in the variety of scripts
    that change the behavior. For example, there are KWin scripts that turn your desktop
    into a tiling window manager with its own rules.


    By Hans-Görg Eiber


    The main difference between KZones and a real tiling manager is that there''s
    no concept of master window. Unfortunately, the Tiling Extension is no longer
    being developed, and the project has been replaced by a lot of alternatives we
    looked at, which is a brilliant solution.


    What makes Exquisite a good introduction to window management is that this combination
    will show you a variety of layouts, and let you choose which one to move the currently
    selected window. The layouts are easy to create, and they can be modified, and
    even created with simple scripts, to suit your needs. The panel stays and usually
    lets you other windows to move, and it can be configured to hide itself when the
    screen is full or after a period of time this is a great way to get into tiling
    and much easier to remove many keyboard shortcuts.


    ![](img/399caf126e037f28be04b36f402dd3c4_8_0.png)


    # Exquisite: Plasma Layout Manager


    # HACK 4


    Exquisite, an easy-to-use window for KDE desktops, is a great introduction to
    tiling in layouts. Exquisite is another one, designed to mimic the good bits of
    Windows 11 window management. Its a great option for users who want to experiment
    with different styles of window management but may lack the freedom to go all-in
    on something that requires keyboard shortcuts. Exquisite is installed via the
    Get New Scripts, or by installing the KWin scripts gallery. Typically, it''s triggered
    by a brilliant shortcut that can be configured by KDE''s global shortcuts and
    bound to Ctrl+Alt-D.


    ![](img/399caf126e037f28be04b36f402dd3c4_8_1.png)

