    \ traditional command line is missing: animation. Not flashing colors or pretending\
    \ characters but actual moving things you might expect from a desktop application.\
    \ Considering the limitations of a text-based interface, you think this is impossible\
    \ to achieve, but Chafa has managed to make it easy. And Chafa doesn't handle\
    \ animations, but it can also display any image you can throw at it, all in any\
    \ resolution. It does this perfectly, directly by converting images into ANSI\
    \ X3.64 commands and ANSI/Unicode characters.\n\nAn image or animation to use\
    \ as much as it can be. It's only when you start using Chafa that you realize\
    \ how useful images in the command line are, and it's equally brilliant that you\
    \ can also view images at the same quality that you expect on the desktop. If\
    \ you use most of your day with the command-line interface, this is an essential\
    \ tool.\n\nBy Graham Morrison\n\nThe resulting images and animations are of much\
    \ higher resolution than you might expect from the command line and it's generally\
    \ unique to be able to view files without switching back to the desktop.\n\nChafa's\
    \ name is an acronym of \"character ascii,\" and it can display both static images\
    \ and animation on the terminal.\n\nAt its simplest, chafa takes a command as\
    \ argument to the image or animation file. This will be displayed as the output,\
    \ inline with your terminal. Color reproduction will depend on your terminal's\
    \ capabilities, and can be easily reduced to 24-bit output with an additional\
    \ argument. There are other options to help you get the most out of a limited\
    \ palette. Changing the font won't change the size of the image, but the font-to-image\
    \ ratio can be adjusted to stretch an image in the output horizontally or vertically.\
    \ There are, of course, further options to scale an image manually or to\n\n![](img/399caf126e037f28be04b36f402dd3c4_64_0.png)\n\
    \n# HACK 56 Sieyek: PDF Viewer with vi-like shortcuts\n\nThere are many PDF viewers\
    \ for Linux and several of them are not exceptional. In particular, sieyek is\
    \ one of the best we've ever used; it's one of the few that can open PDFs, offers\
    \ scaling, multiple page views, and also import PDFs in a way that can be shared\
    \ with other people. If you need to manage a library of PDFs, then the ebook editor\
    \ and,\n\nCalibre is another excellent and more ambitious. It's particularly good\
    \ when you're researching a subject and need to search several publications, although\
    \ Calibre's PDF-viewing capabilities are less than perfect - which is where Sieyek\
    \ can help. Sieyek is a new PDF viewer that provides specific shortcuts for easy\
    \ navigation and access bookmarks, but it's equally adept at beautifully rendering\
    \ PDF content, especially if the file contains formulas, and for searching a collection.\n\
    \nLike a Vim PDF viewer, Sieyek is controlled entirely from the keyboard with\
    \ some clever shortcuts. You can quickly search across any file you've previously\
    \ opened, as well as the table of contents, and referenced figures and bibliographies\
    \ when they're not in the table of contents. There are commands for inserting\
    \ a bookmark, quickly jumping after another reference, and a more formal bookmark\
    \ manager which can be used in any document. You can highlight a section of text,\
    \ and then open another reference while the original document is still open. It's\
    \ an excellent application with light and dark modes. It's ideal for academic\
    \ searches, it's also perfect for your PDF reader.\n\nSieyek is a PDF reader designed\
    \ primarily for accessing a library of academic papers, but it's also excellent\
    \ as a general reader.\n\n![](img/399caf126e037f28be04b36f402dd3c4_64_1.png)\n\
    \nBy Graham Morrison\n\n> https://github.com/ahirm/sieyek\n\n| Category | Command\
