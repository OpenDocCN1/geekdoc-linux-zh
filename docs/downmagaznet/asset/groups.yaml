    Ambermoon 于 1993 年在 Amiga 1200 发布一年后推出，是一款非常出色的角色扮演游戏，能够充分利用 Amiga 的性能和成熟度。它具有精美的手绘图形，并且既有用于冒险的俯视角模式，也有用于地下城和城市的第一人称模式。它执行得非常好，非常完整。当然，这以前从未被重写过，可以认为它的游戏性、声音以及时间方面现在比
    20 世纪 80 年代和 90 年代更受欢迎。为了为我们现代的 Linux 系统重写原始的 Ambermoon，顺便称为“Ambermoon.net”：


    小时候，我们许多人喜欢玩玩具火车轨道或组装自己的电力驱动道路。事实上，这并不是我们随着年龄增长就就不能继续享受这些消遣的理由，特别是如果其中一些乐趣可以在软件中重现的话。但
    Simutrans 所做的（一种感觉像《城市模拟》的方式）是将设定在旧版《城市模拟 2000》中的管理游戏进行现代化——这是一种像旧版《城市模拟》的环境，然而，因为当你选择想要开始的年份时，这显然会影响你使用的技术类型。与
    Simutrans 不同的是，游戏生成的地图已经包含了城市。


    下载内容包含一份手册的 PDF、一张符文图表和一张 PDF 版本的地图。这些都是原版的数字副本，但开发者竟然包含了它们，这种做法非常不寻常，这让你感觉有点像在
    1993 年打开实体游戏时的感受。这款游戏仍然很值得玩，它融合了（对于当时而言）2D 版《塞尔达》风格的村庄与地下城和城市的纹理映射第一人称视角。后者部分特别聪明，其位位图图形看起来几乎像
    Commodore 64 上的高品质多边形。有一个很棒的故事将与该系列中更早期的游戏联系起来，你被带入了一场冒险，去探索、收集物品、施法术、管理资源，并最终击败任何控制你命运的恶意软件。


    该游戏通过连接郊区与城市来运行。例如，你可以选择合适的路线并绘制道路、桥梁、信号和其他元素，以及其他交通工具。每件物品都有成本并增加你运输系统的复杂性，但这就像在旧版《城市模拟》中加载了世界上最大的地图，并且变得相当复杂。如果你想要更简单、更直接的东西，可以使用集成面板下载并运行预设场景，你可以从那里解决交通问题。这是一个非常棒的以任务为导向的入门方式，而不会让沙箱的复杂性淹没，在时间有限的情况下让游戏非常有趣。


