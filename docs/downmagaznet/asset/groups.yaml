  - '[PAGE 7]


    # # New Service Entries for KDE


    KDE lets you add services to the context menu via appstore-like configuration:
    Open Dolphin settings (via Shift+Ctrl, or Configure / Configure Dolphin) and select
    the Context Menu (or Services) entry in the left column - you then see a list
    of installed services and can enable or disable icons. If you click Dolphin you''ll
    find some add-ons from the KDE store (1).


    But there''s no need to rely on the work of others, you can easily add your own
    context menu just like we''ve done on Gnome in the previous has. We assume that
    you''ve already created a small Bash script that formats arguments as files and
    will perform some action on them, just like the shrink script creates smaller
    versions of images. Store it in the bin folder of your home directory (you may
    have to create this folder first).


    First, let''s find out where KDE stores services. Open a terminal and use the
    KDE frameworks kconfig to query the


    ```

    $ k5config --path services

    /home/user/.local/share/kservice5/usr/share//

    ```


    In this case, Dolphin will show both the system-wide folder (/usr/local/share/kservice5/)
    and your user account''s folder (~/.local/share/kservice5/). Create a subfolder
    Services in your user account''s folder:


    ```

    $ mkdir -p ~/.local/share/kservice5/Services

    ```


    and then create a new, *.desktop file inside that folder and open it in Kate or
    some other text editor:


    Figure 1: Dolphin lets you access a special section in the KDE store where you
    can find new services for the context menu.


    ![](img/399caf126e037f28be04b36f402dd3c4_7_0.png)


    cd ~/local/share/kservice5/Services

    touch shrink.desktop


    Enter the lines from Listing 1 and save the file. The first menu entry [Desktop
    Entry] declares that this file creates a context menu entry that appear when right-clicking
    any file - the KDE Type Name popup is a reminder from the times Konquer was KDE''s
    default manager. For example, /image/* is the MIME type. The action name must
    be repeated in the Name field of the section. If you give the action a name, an
    icon (any icon in one of the subfolders of /usr/share/icons/; don''t add a file
    extension), and most important - delete the Exec line command should be be shrink.desktop
    for a list of files.


    The new entry will appear at once: Right-click on an image, and it will be visible
    in the list (2). If you want to move it to the Actions menu, delete the line X-KDE-Priority=TopLevel
    from the .desktop file.


    By Hans-Geörg Eber


    Figure 2: Shrink your pictures via the ''Shrink to 1000x1000''


    ![](img/399caf126e037f28be04b36f402dd3c4_7_1.png)


    # Listing 1: shrink.desktop


    | 01 [Desktop Entry]

    | 02 X-KDE-ServiceTypes=PopupMenu/Plugin,Image/*

    | 04 Actions-shrink

    | 05 X-KDE-Priority=TopLevel

    | 06

    | 07 [Desktop action]

    | 08 Name=shrink to 1000x1000

    | 09 Icon-arrow-down

    | 10 Exec=/bin/shrink

    | 11 Type-Application


    ![](img/399caf126e037f28be04b36f402dd3c4_7_2.png)'
  - '[PAGE 8]


    # KZones: KDE Plasma Tiling


    # DESKTOP MODDING


    The KDE Plasma desktop has become fertile territory for people wantinging to experiment
    with tiling window managers. This is because KDE is a fully modern desktop that
    will feel familiar to anyone, it is also premente configurable. Its KWin window
    manager can be scripted to almost anything, and there are several high-profile
    and easy-to-use scripts that will change the default window behavior. We''ve looked
    at a couple in fact, with one we named "Tiling Extension". With this script entry,
    your application would automatically snap and move to one of several layouts,
    filling your entire and removing window borders. It is not as fast as the native
    window manager I3 and was a brilliant solution for those of us wishing to give
    up all modernity in the search for tiling efficiency.


    Shortcuts can be assigned via KDE''s global settings. It is the easiest-on-ramp
    tiling we''ve seen and a brilliant option for KDE Plasma users who want to make
    the most of their desktop space without committing to tiling.


    By Graham Morrison


    The main difference between KZones and a real tiling window manager is that there''s
    no concept of a master window that moves around every panel itself.


    Unfortunately, the Tiling Extension is no longer being developed or supported,
    and the project has been replaced by a lot of alternatives to win its base, including
    Exclusive (See the next hack), which we looked at, and KZones, a brilliant solution
    that includes graphical configuration, on-screen prompts, editable zones and keyboard
    shortcuts. All of this is accessible from its System panel, which lets you define
    how zones are triggered and how you drag windows into zones to activate them.
    The layouts are easy to create yourself and include positions for each column
    or row you want.


    ![](img/399caf126e037f28be04b36f402dd3c4_8_0.png)


    # Exquisite: Plasma Layout Manager


    # HACK 4


    One of the best things about the KDE Plasma desktop is that, while it''s a great
    experience in its own right, it''s also a brilliant construction tool. This means
    you can customize and augment the layout exactly using the built-in settings in
    almost limitless ways, by KDE or by creating your own scripts to add more functionality.
    This is seen in the variety of scripts that change the window''s behavior arrangement.
    For example, there are KWin scripts that turn your desktop into a tiling window
    manager with its own rules and Krhnite (which performs a role with similar mechanism


    Exquisite, an easy-to-use window for KDE desktops, is a great introduction to
    tiling in.


    layouts. Exquisite is another one, designed to mimic the good bits of Windows
    11 window management. Its a great option for users who want to experiment with
    different styles of window management but may lack the freedom to go all-in on
    something that requires keyboard shortcuts. Exquisite is installed via the Get
    New Scripts, or by installing the KWin scripts gallery. Typically, it''s triggered
    by a brilliant shortcut that can be configured by KDE''s global shortcuts and
    bound to Ctrl+Alt-D. What makes Exquisite a good introduction to window management
    is that this combination will show you a variety of layouts, and let you choose
    which one to move the currently selected window. There are 10 layouts to choose
    from, and they can be modified, and even created with simple scripts, to suit
    your needs. The panel stays and usually lets you other windows to move, and it
    can be configured to hide itself when the screen is full or after a period of
    time this is a great way to get into tiling and much easier to remove many keyboard
    shortcuts.


    By Graham Morrison


    ![](img/399caf126e037f28be04b36f402dd3c4_8_1.png)


