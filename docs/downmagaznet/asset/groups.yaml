  - "[PAGE 92]\n\n# HACK 85\n\n# SHELL HACKS\n\n# HACK 86\n\n# Improve Shell\nPerformance\
    \ by Swearing\n\nYou find yourself using inappropriate swear\nwords when you've\
    \ mistyped a command and the\ncomputer doesn't do what you intended? Now you\n\
    turn your swearing into productivity - simply\ntype fuck after a mistake, and\
    \ the shell will suggest\n\nThat will only work once you've installed \"The\n\
    Fuck\" [1]. On Ubuntu, ubuntu shell\n\n```\nsudo apt install jeff\n```\n\nand\
    \ on openSUSE, use Python's installer pip and run\n\n```\npip install jeff\n```\n\
    \nwhich should also work on other distributions.\nYou will also need to add a\
    \ line to your Bash start script\nthat defines a function fuck: just add\n\n```\n\
    eval $(fuck --alias)\n```\n\nat the end of -/.bashrc. Now you're ready to go:\
    \ Close\n reopen the terminal window and type something\nthat's slightly wrong,\
    \ for example:\n\n```\napt install llc\n```\n\nCommand misses an \"a\" in the\
    \ word \"install,\\napt will complain. Just type fuck, and your new helper\nsuggests\
    \ the correct command - all you need to do is\nhit Return to run. If you had planned\
    \ for something\nelse, try the cursor keys to see some auto cor-\nctions. If nothing\
    \ is right, use the tool with Ctrl+-.\n\n# A little swearing can solve your problems.\n\
    \nIf you prefer to be vulgar, you can use another\nname for the function - for\
    \ example, change the line\nin ~/.bashrc\n\n```\neval $(fuck --alias)\n```\n\n\
    and the magic command will turn to touch.\n\n> By Hans-Georg Ebler\n\n# Record\
    \ Your Shell Session\n\nImagine you want to explain to a friend or colleague\n\
    h to perform a specific task on the command line,\nor maybe you're having trouble\
    \ with a shell com-\nmand to request help.\nIn some case you will often copy and\
    \ paste a\ncommand lines, with the outputs you generate-\nate to an email. Or\
    \ you take a screenshot or\ns a short video. If you don't need to show out-\n\
    side terminal window, there is a better option:\nUse script, a classical program\
    \ that was introduced\nby 3.0.BSD in 1992.\n\nIt run follows to capture input\
    \ and output\ninrecording, and the timing information (when did\nyou press key?)\
    \ in recording, time:\n\n```\nscript --timing-recording recordingsc\n```\n\nNow\
    \ perform all that you recorded, and\nwhen you're done, exit the shell, and the\
    \ recording\nstop.\n\n```\nscriptplay --timing-recording recordingsc\n```\n\n\
    and the session repeats itself. All keys pressed (includ-\ning corrections, movements,\
    \ etc.) are visible in\nthe speed at which you did that.\nRecording and playback\
    \ will work nicely when you\nyou use a pseudo-graph program such as the\nMidnight\
