    # Sniffnet is a User-Friendly Traffic Monitor


    Monitoring network traffic is part of the admin''s daily grind. Most admins use
    the graphical Wireshark tool because of its wealth of functions as well as its
    availability. Wireshark is primarily used at professional users, who need in-depth
    knowledge to use it. The new Sniffnet projects less experienced users, providing
    meaningful results in a simple, intuitive, and clear-cut interface.


    If you are using a Linux distribution with a DEB package manager, you can install
    the precompiled DEB package [2] from the project''s GitHub page instead; this
    removes the need to implement Rust first (line 6).


    For the program to work correctly, you will definitely resolve some dependencies
    [3] (line 8), regardless of the installation path. When done, call sniffnet with
    the sudo command.


    ## Installation


    Sniffnet is a cross-platform application (1). If you don''t have it on your system,
    first set it up with the command from line 2 of Listing 1. The installation requires
    some interactive input and prints messages at the prompt. You will install sniffnet
    itself in the terminal using the Rust package manager (line 4).


    ### Listing 1: Install Sniffnet

    | Line | Command |

    |---|---|

    | 01 | *** curl --proto ''=https'' --tlsv1.2 -sSf https://sh.rustup.rs \| sh |

    | 02 | |

    | 03 | Set up install sniffnet via Rust |

    | 04 | cargo install sniffnet |

    | 05 | *** install sniffnet as a DEB |

    | 06 | sudo apt install .../Sniffnet_Linux_DEB_amd64.deb |

    | 07 | *** install dependencies |

    | 08 | sudo apt install libpcap-dev libfontconfig libfontconfig-dev |


    Sniffnet summarizes all network traffic information in a single window.


    ![](img/399caf126e037f28be04b36f402dd3c4_56_0.png)


    # NETWORKING


    The start-up window opens with the filter options.

    On the right, you can specify the desired Internet protocol and transport protocols
    by enabling the appropriate radio buttons. In both cases, available versions are
    enabled by default (e.g., IPv4 and IPv6). On the right, select the protocol from
    a drop-down list.


    On the left of the window, you will find the network interfaces available on the
    system. Sniffnet lists both the physical and virtual interfaces; configure to
    the desired interface if this doesn''t meet your needs. After configuring the
    basic settings, click the rocket icon.


    Sniffnet takes moments to acquire data and then shows the actual window. At the
    top, you will constantly see the traffic rate in bytes per second. This display
    uses colors to differentiate between incoming and outgoing packets. In a small
    box to the left, you will find statistical data about the network connection,
    number of filtered packets and their size in megabytes.


    In the lower part you will see a list of all hosts to which your machine has been
    connected since you started monitoring, and the list is sorted by traffic. The
    color codes which represent value are, too. If you want to see details about a
    specific host, simply click it. That will bring you to the individual packet information
    about the used protocols. The current Sniffnet version 2.1.1 has problems with
    IPv6 addresses: it doesn''t expect them, and the columns which display these addresses
    are too narrow which disturbs the alignment with the column headings.


    You can sort the packet list by three criteria: most-recent (default), most bytes
    and most packets. When you click the document icon to the right, Sniffnet opens
    the report file (~/.config/sniffnet/report.txt) in the default editor. It contains
    the full log, not just for the currently seen host, which is a usability bug.
    Sniffnet will continue to write to file until you end the current monitoring session,
    but the editor will not save the file.


    Conclusions

    If you want to see what''s happening with your network, the self-explanatory Sniffnet
    provides a simple solution for all levels of users. The tool lacks analysis capabilities;
    if you are trouble-shooting with your network connection, you will need to check
    the logs manually.


