- md: '

    ## Zoom into the Gnome Desktop


    ### HACK


    Gnome''s built-in function zoom, which you can enable with Win+Alt+8, lets zoom
    in very large steps: from a 1.0 zoom factor to 2.0, then 3.0 and so on (see figure).
    You have to enable the Accessibility Menu (a little human icon in the right corner)
    and then enable the option to use it. While you can make things quite quickly,
    it lacks the smooth transition helpful in presentation.


    Luckily, Gnome''s control for the command line, gsettings, lets you query and
    set the zoom factor with fine precision.


    ```bash

    gsettings org.gnome.desktop.all zoom-factor 1.15

    ```


    The command-above will set the zoom to 110 percent. (Note: that is "a-one-y",
    not "a-el-el-y" in the command). If you want to query the current value, get and
    drop to query the current value, say (as) in the number. Now, adjusting the current
    value, say (to add or subtract 0.1) is not so simple. I created two Bash scripts
    to do the job; they use the calculator to perform the floating-point additions,
    subtractions, and comparisons - the shell can only work with integers.


    Put the code from Lists 1 and 2 into files "zoom-in" and "zoom-out", respectively,
    and make executable (chmod +x /bin/zoom-*). (Depending on your Linux distribution,
    you may have to create the /bin folder.) Then put the three configuration lines


    ```bash

    ZOOM_MIN=1.00

    ZOOM_MAX=2.00

    ZOOM_ADJUST=-0.85

    ```


    into a new file ./zoom-config. Here you''ll be able to change the behavior of
    your zoom factor: THE ZOOM_ADJUST will be added or subtracted until you hit the
    minimum or maximum value.


    ## Default Keys for Zoom


    Gnome already has hotkeys Alt-Windows+ and Alt-Windows- for zooming in, but as
    already mentioned, these changes work in huge stages. You can add two new hotkeys
    which will run your scripts, listed above.


    Open the Settings, navigate to Keyboard/Shortcuts, Click View and Custom Shortcuts,
    then scroll down and click Shortcuts in the new window. Here you add a shortcut:
    click the + symbol, give the short name "Zoom in", "Zoom out", (the command /home/user/bin/zoom-in
    and /home/user/bin/zoom-out), then Set Shortcut and press the key combination.
    I found that Ctrl-Alt+- and Ctrl-Alt- with a mouse worked perfectly for me. Click
    on Add to close the dialog. Now you have both new shortcuts in the list, close
    and try it out.


    ## Negative Zoom


    By the way, it''s also possible to use zoom factors below 1.0 (Change ZOOM_MIN
    to 0.5 to try this out), it doesn''t make much sense - the desktop will shrink
    and fill up the left corner of the screen, and the monitor gets filled with gray.


    > By Hans-Georg Ebel


    ![](img/399caf126e037f28be04b36f402dd3c4_12_0.png)


    Listing 2: zoom-out


    ```bash

    #!/bin/bash

    [ -f ./zoom-config ] && source ./zoom-config

    ZOOM_MAX=2.00

    ZOOM_ADJUST=-0.81

    SCHEMA=org.gnome.desktop.all

    zoom=$(gsettings get $SCHEMA zoom-factor)

    check=$(echo "zoom > 1" | bc)

    if [ $check -eq 1 ]; then

    zoom=$(echo "scale=2; $zoom + $ZOOM_ADJUST" | bc)

    gsettings set $SCHEMA zoom-factor $zoom

    fi

    ```


    COOL LINUX HACKS - 2023

    13


    ## DESKTOP MODDING


    ### Use Virtual Desktops, Memorize the Hotkeys


    Do you work with virtual desktops? If not, try them. Assuming that you use your
    Linux machine to run a browser, a mail client, and LibreOffice, it is likely that
    your desktop becomes cluttered with windows. You might be unsure of how to get
    them organized. Connecting one or more monitors would improve the space on your
    desk as you need.


    Instead of fairly, for Linux environments like KDE, Gnome, and most others have
    a feature called virtual desktop. You can have two or more independent areas where
    you can place your windows. There is no need to minimize them; just spread them
    out as many as you need.


    ## KDE


    On KDE, press Ctrl+Alt+F2 to go to a second (empty) desktop; Ctrl+Alt+F1 brings
    you back to the original one. This is simple. If it doesn''t work, virtual desktops
    are disabled. Use the start menu, virtual, and select the Virtual desktop configuration
    menu. Then click on the number of desktops you want (Figure 1). KDE absolutely
    makes it to have at least four more hotkeys (KDE Ctrl, F3, F4, etc.).


    ![](img/399caf126e037f28be04b36f402dd3c4_13_0.png)


    Add the Workspace Switcher to your panel so that you can switch the desktop with
    a single click.


    If you would prefer to use Ctrl+F1, F2, etc. on Cinnamon (Open Preferences) Keyboard
    from the menu, switch to the desktop using the task bar, and press the Workspaces
    | Direct Navigation: you will let you switch to the desktop directly.


    ## Gnome


    With a Gnome installation, Alt+Right will bring you to a new, desktop but only
    after you''ve opened one on the current desktop. Ctrl+Alt-Left (or Win-PageUp)
    will go back to the previous desktop.


    By default, Gnome only has a shortcut for the first desktop (Win-Home), but when
    you open the settings and go to Devices, Keyboard, you can add hotkeys for further
    desktops. Gnome applications use it to show the shortcuts available in the program.


    In all desktop environments, your window will let you move to a different workspace,
    and there may even be hotkeys for doing with the mouse. The developers have come
    up with multiple ways to configure your desktop behavior (e.g., some program may
    always open the second desktop).


    It takes some time to use multiple desktops, but once you know the most important
    hotkeys by heart, you''ll do things much faster than before. If you switch between
    KDE, Gnome, and other environments or managers often, it might make sense to change
    the settings so that working with virtual desktops feels the same in every environment—or
    if you''ve already chosen your favorite desktop, simply get to know their default
    hotkeys.


    Rename them (for example: Desktop 2, Desktop 3, or something that reminds you
    of the activities you want to perform on a desktop) and arrange them in colors.
    (By default, KDE puts all them in a single row, which will cause too much space
    in the taskbar).


    ![](img/399caf126e037f28be04b36f402dd3c4_13_1.png)


    > By Hans-Georg Ebel


    ## Cinnamon


    If you run Cinnamon, press Ctrl+Alt+Right to move to the next desktop. Cinnamon
    calls them “workspaces,” but the concept is the same. Press Ctrl+Alt+Up to view
    a summary of all desktop contents (Figure 2). This is also the right place if
    you want to add more.


    ![](img/399caf126e037f28be04b36f402dd3c4_13_2.png)


    14


    COOL LINUX HACKS – 2023 EDITION


    ## Security & Privacy


    The Internet is no longer the friendly environment that it was a few decades ago.
    While there are a number of security and privacy threats, Linux users are especially
    well-prepared to stay safe. We have some suggestions for improving the situation.


    For example, you might want to strip metadata from files before you share them
    online.


    ![](img/399caf126e037f28be04b36f402dd3c4_15_0.png)

