    ## System Monitoring with fswatch


    Most users favor Linux have probably used cron or at schedule the running of commands.
    Both can be useful in their place: cron for scheduling events and at for scheduling
    recurring events. However, what both lacks the ability to get better system information
    and respond to it unless using a specific script. It is much easier to use watch
    [1] and fswatch [2] to do these things. While both can be used to gather information
    for possible security incursions, both can be tweaked to act like a scheduler
    with little effort and impact between each time the command is run – interval
    obviously chosen for immediate troubleshooting. However, on a computer that is
    always running, setting the interval to 86400 would make run once per day, and
    setting the interval to 604800 would make run once per week. Either a command
    or a period can be used to write large intervals; the minimal interval is 1 second.
    The difference between watch and other is that you need to restart watch if the
    computer was shut down, which is a problem that at cron do not have. For reasons
    that are not clear, the interval can be supplemented with --precise (-p) to make
    sure that the interval requires precision.


    ## watch


    The purpose of watch is to follow how a command''s output over time (Figure 1).
    This can be used for troubleshooting, as well as keeping a regular or user item
    open as new packages are installed or updated. Limited changes could also be used
    as a simpler replacement for certain tasks. Several examples are shown in Table
    1. But watch runs every two seconds until cleared or interrupted. The basic structure
    is:


    watch also supports options to control and exit behavior. With --line (-l) lines
    are highlighted, with difference (-d) highlights the output that differs from
    previous. You can also change the header showing the current command, and time
    with --title (-t). Exit options are varied. With --check (-g) exits when the output
    changes, which can be an obvious and handy indicator. With --error (-e) makes
    a noise to indicate that watch has exited with an error after a occurs occurs
    and waits until any key is pressed.


    WATCH OPTIONS COMMAND


    Depending on the command''s contents, watch may be inside quotation marks. For
    example, a command could run watch if it uses a pipe in order to run or --exec
    (--x). Alternatively, instead of that, a new process is not needed when the command
    contains multiple commands.


    Two options are set to watch''s behavior. The most important is --interval SECONDS
    (SECONDS). The --interval option overrides the default -2 seconds.


    ## fswatch


    fswatch monitors changes to directories or files. Ubuntu users can install it
    using fswatch. The simplest way to use it is to run fswatch. On macOS, it uses
    FSEvents, which is very efficient,. On Linux, it uses inotify. When you start
    fswatch, it reports changes to files and directories.


    ### Table 1: WATCH OPTIONS


    | Command | Description |

    | :--- | :--- |

    | --line (-l) | lines are highlighted |

    | --diff (-d) | highlights the output that differs from previous |

    | --title (-t) | change the header showing the current command and time |

    | --check (-g) | exits when the output changes |

    | --error (-e) | makes a noise to indicate that watch has exited with an error
    |

    | --interval (-n) | sets the interval between updates |


    ### Table 2: FSWATCH ACTIONS


    | Action | Description |

    | :--- | :--- |

    | --format (-f) | displays the absolute paths |

    | --recursive (-r) | includes subdirectories |

    | --include (-i) | includes patterns |

    | --exclude (-e) | excludes specific patterns |

    | --interval (-i) | sets the interval between events |

    | --event (-e) | exits after one event |

