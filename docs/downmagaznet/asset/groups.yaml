    是一种堡垒服务，以单二进制文件的形式提供，你应该在自己的硬件上对其进行构建和运行。它可以验证并转发指定的 SSH、HTTP、TLS 和 MySQL 连接，这些连接可以被完全记录和记录以备未来审计。这是确保服务器未被入侵的关键部分，也是
    Warpgate 与自建 SSH 代理的区别所在。要进行设置，`warp` 命令通过一个简单的设置引导你完成配置。这包括存储凭据的逻辑、SSH 监听端口以及管理
    Web 界面的端口。该服务可以在无需身份验证的情况下用于 SSH 或 HTTP 目标。这从 Web 界面注册 SSH 密钥，或通过命令行将其添加到本地用户
    `id/.known_hosts` 文件开始，这与你使用任何其他 SSH 服务器时所做的类似。只需指定地址、端口和用户，即可将目标添加到 warp 配置文件中。添加
    MySQL 和 HTTP 目标是可选的。可以通过命令行和界面获取正确的配置，现在你通过连接到 Warpgate 来连接你的网络主机。连接会自动转发。虽然会有一些文本显示目标正在工作，但对客户端来说它是透明的。


