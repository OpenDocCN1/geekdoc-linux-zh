    ## 游戏


    ### Qonquest 2


    许多游戏都灵感源自经典棋游《风险王国》（Risk）。它是最初的边界争端和资源管理游戏，玩家通过掷骰子来占领邻近领土，并决定军队的损失，直到一方主宰领土。许多游戏都使用了这种骰子和资源管理的概念变体，这在实时策略游戏中尤为常见。但很少有游戏能如此接近原始配方：Qonquest
    2，这是一款基于原始规则的策略游戏。虽然细节略有不同，并特别利用了计算机能够让游戏变得复杂且新颖的优势。


    ### Bridge Nova


    当你看到指令是“桥梁模拟器”时，你的第一反应可能是它是对某种棘手游戏的重刻。它并不是像《桥梁建造者》（Bridge Constructor）那样要求你穿越某种混乱的游戏。《桥梁模拟器》灵感源于《星际迷航》，而非结构工程，而且游戏发生在太空。Bridge
    Nova 是《Bridge》的续作，那是开发者对太空模拟器的首次尝试。正如《星际穿越》一样，控制游戏的各个方面存在差异，包括导航、规划和工程。每个角色都有自己的界面、技能组和选择范围。这是一款多人游戏，不同的玩家控制不同的状态，所有人都需要通力让飞船属于你们。Qonquest
    是该游戏的一个独特版本，是一个围绕欧洲地图及其周围岛屿构建的策略游戏。它与原始版的一个区别是，每个领土都是独立的，不属于某个国家。这使得游戏变得更有趣，同时游戏本身色彩斑斓。你可以选择其中一个国家并执行行动来移动或将部队部署到邻近领土。它与原始版的另一个区别在于骰子的使用：攻击者掷骰子来决定摧毁多少单位，而防守者获得两次。游戏本身运行在服务器上，其他玩家通过网络浏览器连接。默认情况下，当你运行游戏时，这一切会自动设置。游戏的主要目标之一是易于访问且对新手友好，任何人都可以加入。玩家可以选择自己的状态，或由飞行主管分配控制游戏的服务器部分。由于游戏处于
    Alpha 阶段，目前没有任务，但目标由飞行主管和团队设定。导航站已完全开发，让你导航到太空天体并使你的飞船对准目标。你还可以移动物品，但游戏仍在开发中，如果你喜欢这类内容，现在是参与的理想时机。


    作者：Graham Morrison

