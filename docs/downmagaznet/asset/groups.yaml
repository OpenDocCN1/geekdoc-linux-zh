    # Figure 3: A typical positive result: One was found using the standard test.


    ```

    Found HIDDEN PID: 3026068

    Cmdline: "<none>

    Executable: "<no link>

    "<none> ... maybe a transitory process

    ```


    The difference between elementary and standard tests is in the details. All tests
    have a similar structure. They report when from one stage to another, and list
    positive results. If no positive results are found, the command exits with no
    message. If a hidden process is found, the output gives a PID, whether it runs
    from the command line (which makes it potentially dangerous) or it is executable
    (more dangerous still), or whether it unhide''s process (Figure 3). Note that
    some processes may be hidden and can be identified as harmful with less online.


    all tests will display additional information -v, when running -d and -v together
    may be useful.


    # Other Versions


    When working with unhide, there are several variants of the command you might
    want to explore:


    +   - unhide-tcp: identifies TCP/UDP ports that are listed, but not. The structure
    is somewhat like those of unhide.

    - unhide-posix: A version of unhide for Unix-like systems unlike Linux, it is
    not as thorough as the Linux version.

    - unhide-gui: A recent desktop of unhide, which only appeared in Debian Testing,
    but I could not get to run while researching this article, nor find an example.
    unhide-gui will be useful in Debian 12, the next general release. In addition,
    unhide is bundled in other security tools like Rootkit Hunter (hunter).


    # Options


    Options are placed at the end of the command. Most tests will take most options,
    where noted. To test thoroughly, you should run all possible options. The options
    include:


    +   - -d: In a test, this automates what you would want to do manually. If you
    receive a positive result, the first thing unhide does show the PID of the test,
    which is precisely what -d does. Does both of the test give the same result, but
    if results differ, you should run others for a clearer picture.

    - -f: Writes a log named unhide-YYYY-MM-DD, showing the structure and time of
    the test, as well as any results to the current day. If you are trying to find
    hidden processes after running unhide, you may want to read part of this log to
    keep track of your investigation (Figure 4).

    - -c: Procs, for, checkowned, and unchecked processes, running all four of the
    tests, although documentation is lacking.

    - -v: Gives more detailed output (verbose). These details are not displayed by
    default during a test, but may be used when a test is a run. If the -v option
    is set, a test will reveal sorts for additional information, but not find any.


    # Working with Results


    When running unhide, the result is not always definitive. If you confirm your
    results by running tests and uniding, as well as using some of the command options.
    Notice, also, of the tentative in the test, and for an increase in traffic on
    the system. If you are able to identify the PID by a search it is a legitimate
    one.


    If you find that a process has been cracked, isolate immediately. Do not attempt
    to examine some injections from the machine, because you will not get anywhere
    only way. Boot from a Live system to the compromised machine. Unfortunately, this
    is to be a slow process, involving long running sessions. In the end, the fastest
    way to recover is to restart a backup. In the end, unhide is not an alert, so
    only an analysis of one compromised machine might help you recover a new machine
    more rigorously.


    > https://www.unhide-forensics.info/?


    By Bruce Bylance


