    # Luxtorpeda (Steam compatibility tool)


    Valve''s Steam Deck is bringing a lot of new users to Linux, and this is reinvigorating
    some older projects that might otherwise have left to languish. Luxtorpeda is
    one of these. While it''s very useful for people playing old games on a Steam
    Deck, Luxtorpeda is just a tool for all people playing old games on the Steam
    Deck through Steam. It calls itself a "compatibility tool" for Steam, but what
    it does is vastly simplify your Steam configuration for the huge selection of
    games and titles that the Steam ecosystem offers. We all have them, and often
    want them to be incorporated into Steam to a single place for game launching and
    also to help with such titles streaming.


    Luxtorpeda is closely related to Boxtron and Roberta, which each help provide
    native Linux support for DOS and SVMM integration, with Steam, respectively. This
    is even more important on the Steam Deck when the default view only runs the Steam
    client by.


    Adding external games manually takes a lot of time and research. You need to understand
    how those games are launched and what tools you require before you even into the
    Steam properties page and add it manually. Luxtorpeda does all this for you by
    coming the tool to run for any of the games'' compatibility. This includes Jet
    Kidd, Hextner, Morrowind, Doom, Doom 2, and Doom III. You don''t need to install
    and configure Linux-native clients for all these games to get the best absolute
    performance and output. After installation, your Steam properties simply need
    to be configured and then they work. (On Ubuntu we used the binary archive for
    the alternative luxtorpeda-dev repo) we then create the optimum install and configuration
    for your game, regardless of whether you''re on a Linux desktop or the Steam Deck,
    and it works brilliantly.


    > By Graham Morrison


