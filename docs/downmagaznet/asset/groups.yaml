    # Write about Jupyter Notebooks


    If you want to embed documentation in your code that goes beyond simple code comments
    or if you plan to give a presentation that includes some highlighting, try JupyterLab
    (1) and create "notebooks" that can display and execute your code. The Jupyter
    team explain in documentation, a "notebook is a shareable document that contains
    computer code, program language explanations, data, rich visualizations, charts,
    graphs and interactive controls.


    Working with a notebook is similar to using an interpreter interactively: you
    can type in commands and have them executed directly. In the notebook, however,
    every output, variable, and documentation lives in a cell. Cells are code by default,
    but you can also use cells that accept documentation in Markdown syntax. Depending
    on which cells you add, you can use LaTeX in the code and handle formulas properly
    (Figure 1).


    Figure 1: Mix code and documentation in a Jupyter notebook. Here, the markdown
    text extends some formulas.


    ![](img/399caf126e037f28be04b36f402dd3c4_72_0.png)


    language that you can use in the cells. You''ll get syntax highlighting, and when
    you press Shift+Return, the cell content is run through an interpreter. Cells
    are not isolated from one another. You are using one interpreter that will execute
    whatever code you send to it, so variables and functions remain defined. Of course,
    there''s a reset option that lets you start a fresh interpreter.


    You can save the notebooks as *.ipynb files and pass them around, or put them,
    for example, on GitHub or GitLab. A notebook file contains both the code cells
    and the outputs generated by running them. You don''t have all the cells, so you
    can send a notebook to a colleague or a student (if you''re teaching) and ask
    them to run the cells to discover what the code does.


    +   - Creating graphs, easy too: in Python, just import the plt module and use
    the plot function to draw dots. There are various ways to visualize data. A normal
    Python session would open a window to display the graphs, Jupyter embeds it in
    the notebook (Figure 2).


    For installing Lab, use Python''s own package manager pip or sudo install Jupyter.
    On OPEN-SOURCE, you can also use Jupyter in jupyter-jupyter also.


    > By Hans-Georg Eeer


    +   [1] jupyter.org/

    [2] https://github.com/jupyter/wiki/

