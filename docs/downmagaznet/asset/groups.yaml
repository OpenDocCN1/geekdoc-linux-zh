  - '[PAGE 15]


    # Security

    & Privacy


    The Internet is no longer the friendly environment that it was a few decades ago.
    While there are a number of security and privacy threats, Linux users are especially
    well-prepared to stay safe. We have have some suggestions for improving the situation.


    For example, you might want to strip metadata from files before you share them
    online.


    ![](img/399caf126e037f28be04b36f402dd3c4_15_0.png)


    | HACK 11 | 17 |

    | Check Your Downloads | |

    | HACK 12 | 17 |

    | Secure Your Notebook | |

    | HACK 13 | 18 |

    | Strip Metadata from Your Files | |

    | HACK 14 | 20 |

    | Detect Hidden Processes | |

    | HACK 15 | 22 |

    | Run Apps in Boxed Mode with Boxxy | |

    | HACK 16 | 22 |

    | Securely Split Your Files with horcrux | |

    | HACK 17 | 23 |

    | Age: Master of the Keys | |

    | HACK 18 | 24 |

    | OpenSnitch Application Firewall | |

    | HACK 19 | 28 |

    | Parrot OS Desktop Security |'
- md: "\n# HACK\n\n# SECURITY & PRIVACY\n\n## Check Your Downloads\n\nWhen you download\
    \ Linux distribution images from the Internet, you will often get those files\
    \ from a mirror or from the official project's web server. This introduces some\
    \ risk as attackers might take over a mirror and exchange the image with a modified\
    \ version that contains a rootkit or other form of malware.\n\nOn the official\
    \ projects, you'll typically find one or more files whose checksum was based on\
    \ the official website/filename mappings.\n\n```\n73957b31c88932bc2cd8fb97e8bf9d1fc96a488dd1739d8f2df32b5copenSUSE-15-4_CR-D86_647f2-Build131.0-Media.iso\n\
    ```\n\nThe long string that is made of hexadecimal digits (numbers 0-9 and a to\
    \ f) is a large numerical value, a checksum calculated on the contents of the\
    \ file which was stored in the official website. When you download the ISO, you\
    \ can open a terminal window, cd into the download folder, and run the checksum\
    \ tool to verify the calculation. In openSUSE, the checksum generator uses the\
    \ cryptographical hash function SHA-256 (one):\n\n```\nsha256sum openSUSE-15-*.iso\n\
    ```\n\nto calculate the checksum of this ISO image - if you get the same value\
    \ that was stored in the official file, it's perfectly safe to assume that the\
    \ file was not tampered with (see figure).\n\nYou might find a checksum that was\
    \ created with a different tool; until years ago, md5sum (which calculates the\
    \ MD5 hash function) was the most popular choice, but it is obsolete because today's\
    \ machines are powerful enough to break its protection (i.e., modify a file that\
    \ has the same MD5 checksum).\n\n> By Hans-Geörg Geiger\n\n- [1] https://en.wikipedia.org/wiki/SHA-256\n\
    \nWhat should it be (cat .sha256) and what is sha256sum (...) - this ISO is ok,\
    \ because the checksums match.\n\n## Secure Your Notebook\n\n![](img/399caf126e037f28be04b36f402dd3c4_16_0.png)\n\
    \nIf you use Linux on servers and at least one of them is a notebook, you may\
    \ find yourself logging into remote computers via SSH. That typically requires\
    \ entering a password which is why many users use public-key authentication.\n\
    \nAfter creating an SSH key pair, copy the public key to the server's ~/.authorized_keys\
    \ file (leave it manually or fully with ssh-copy-id). This allows you to log in\
    \ without the password. The passphrase you make for the private key is then used\
    \ to encrypt the key on the source computer.\n\nMaximum comfort, the passphrase\
    \ is then left empty so that it is possible to simply issue a single command on\
    \ the machine without any interruption.\n\nIf you configure your notebook that\
    \ way you lose or someone steals your SSH keys and can no longer access all the\
    \ target machines without the entries for the compromised keys.\n\nHowever, it\
    \ is better to encrypt your keys with a passphrase instead of leaving them in\
    \ cleartext. Run ssh-keygen -p: the p option modifies the passphrase of existing\
    \ key (creating a new one). The tool will also work for the key (file) suggest\
    \ the default location - ~/.ssh/id_rsa, which is what you get if you did not specify\
    \ one at the time of key generation.\n\nIf you have several keys (pair, RSA and\
    \ DSA), the check of your ~/.ssh folder works on the correct key. Then, enter\
    \ a new passphrase (twice), and you'll be prompted for the new passphrase every\
    \ time you want to use the key to log to a remote machine. Run ssh-keygen -p and\
    \ just Enter when prompted for the new passphrase to change it. You'll need the\
    \ old passphrase last to remove it.\n\n> By Hans-Geörg Geiger\n\n![](img/399caf126e037f28be04b36f402dd3c4_16_1.png)\n\
    \n![](img/399caf126e037f28be04b36f402dd3c4_16_2.png)\n\n![](img/399caf126e037f28be04b36f402dd3c4_16_3.png)\n\
    \nCOOL LINUX HACKS - 2023 EDITION\n\nEnter passphrase (press Enter for no passphrase):\
    \ \nEnter new passphrase (press Enter for no passphrase): \nEnter passphrase again:\
    \ \n\nYour identification has been saved with the new passphrase.\nEnter passphrase\
    \ for key /home/user/.ssh/id_rsa: \nEnter new passphrase (press Enter for no passphrase):\
    \ \nEnter new passphrase (press Enter for no passphrase): \nEnter passphrase again:\
    \ \n\nYour identification has been saved with the new passphrase.\n\n# SECURITY\
    \ & PRIVACY\n\n# HACK 13\n\n## Strip Metadata from Your Files\n\nWhen you share\
    \ a file on social media or send it to a group of people, you may not be aware\
    \ that all kinds of metadata can be deleted. Pictures store when and where they\
    \ were taken (Figure 1) and what camera and settings were used, PDF and Office\
    \ files remember creation and modification dates of authors and editors. You can\
    \ remove them manually. For example, in LibreOffice you can edit the file properties\
    \ and remove the name, and the command-line tool exif lets you remove metadata\
    \ from photographs.\n\nfile and selecting the **Remove metadata**. It creates\
    \ a copy of metadata cleaned.pdf (when the original is document.pdf). Figure 2\
    \ shows how to run mat2 from Gnome's file manager. In the terminal, you see the\
    \ effect of stripping metadata from Word and PDF files.\n\n### Alternative\n\n\
    If you cannot install mat2 on your system or it won't start properly, there is\
    \ an alternative tool Metadata Cleaner [3] which uses the same library as mat2\
    \ and is available as a Flatpak package. To try out, install Flatpak on your Linux\
    \ system (if it is not already in-installed) and run the following commands:\n\
    \n```\nflatpak remote --if-exists flathub\nhttps://github.org/flathub/flathub.repo\n\
    flatpak install fr.roinvigier.MetadataCleaner\n```\n\nIf you use Ubuntu or other\
    \ Debian-based distribution, you must install mat2 with sudo apt install mat2.\
    \ I have also tested an OPENSE package (python3-mat2) which is software search\
    \ engine (2), but it produced fewer results with the files in my Git repository.\n\
    \nMat2 integrates into KDE and Gnome's file managers and lets you to remove metadata\
    \ by right-clicking\n\n> Figure 1: exiftool shows a list of metadata that was\
    \ filtered for the GPS position. It is in Google Maps and you find the address,\
    \ in this case Düsseldorf in Germany.\n\n![](img/399caf126e037f28be04b36f402dd3c4_17_0.png)\n\
    \nYou should be able to select a number of files in the file manager and open\
    \ them in Metadata Cleaner (search \"clean\" in the application picker). The program\
    \ starts and shows how many fields it found (Figure 3). You can click on an entry\
    \ to see details or click Clear to start the process.\n\nIf you don't find the\
    \ program in the list of applications, start it manually\n\n```\nflatpak fr.roinvigier.MetadataCleaner\n\
    ```\n\nBy Hans-Geörg Eber\n\n- [1] https://github.com/joisin/mat2\n- [2] https://software.opensuse.org/package/python3-mat2\n\
    - [3] https://metadatacleaner.roinvigier/\n\nFigure 3: Metadata Cleaner is based\
    \ on Mat2's library and provides its own graphical interface.\n\n![](img/399caf126e037f28be04b36f402dd3c4_17_1.png)\n\
    \nFigure 2: Mat2 shows how to strip metadata from Word and PDF files. It shows\
    \ the effect of stripping metadata from the document.\n\n![](img/399caf126e037f28be04b36f402dd3c4_17_2.png)\n\
    \nCOOL LINUX HACKS - 2023 EDITION\n"
  mdcn: "\n\n# 极客技巧\n\n# 安全与隐私\n\n## 检查你的下载\n\n当你从互联网下载 Linux 发行版镜像时，通常会从镜像站或官方项目的服务器获取这些文件。这引入了一些风险，因为攻击者可能会接管镜像站，并将镜像替换为包含\
    \ rootkit（根内核）或其他恶意软件的修改版本。\n\n在官方项目中，你通常会找到一个或多个文件，它们的校验和基于官方网站/文件名的映射。\n\n```\n\
    73957b31c88932bc2cd8fb97e8bf9d1fc96a488dd1739d8f2df32b5copenSUSE-15-4_CR-D86_647f2-Build131.0-Media.iso\n\
    ```\n\n这个由十六进制数字（数字 0-9 和 a 到 f）组成的长字符串是一个很大的数值，它是存储在官方网站上的文件内容计算出的校验和。当你下载 ISO\
    \ 时，可以打开终端窗口，`cd` 进入下载文件夹，并运行校验工具来验证计算结果。在 openSUSE 中，校验和生成器使用加密哈希函数 SHA-256：\n\
    \n```\nsha256sum openSUSE-15-*.iso\n```\n\n用此计算此 ISO 镜像的校验和——如果你得到的数值与存储在官方文件中相同，就可以完全地假设该文件没有被篡改过（见图）。\n\
    \n你可能会发现使用不同工具创建的校验和；直到几年前，`md5sum`（计算 MD5 哈希函数）是最流行的选择，但它已经过时了，因为现在的机器足够强大，可以破解它的保护（即修改一个具有相同\
    \ MD5 校验和的文件）。\n\n> 作者：Hans-Geörg Geiger\n\n- [1] https://en.wikipedia.org/wiki/SHA-256\n\
    \n内容应该是（`cat .sha256`）以及 `sha256sum (...)` 是什么——这个 ISO 是好的，因为校验和匹配。\n\n## 保护你的笔记本电脑\n\
    \n![](img/399caf126e037f28be04b36f402dd3c4_16_0.png)\n\n如果你在服务器上使用 Linux 且至少有一台是笔记本电脑，你可能会发现自己正在通过\
    \ SSH 登录远程计算机。这通常需要输入密码，这就是为什么许多用户使用公钥认证。\n\n创建 SSH 密钥对后，将公钥复制到服务器的 `~/.authorized_keys`\
    \ 文件中（手动保留或完全通过 `ssh-copy-id` 完成）。这允许你无需密码即可登录。你为私钥设置的短语随后将用于加密源计算机上的密钥。\n\n为了获得最大的舒适度，可以将短语留空，这样就可以在机器上直接发布单条命令而无需任何中断。\n\
    \n如果你那样配置你的笔记本电脑，一旦你丢失或他人偷窃了 SSH 密钥，在没有受损密钥条目的情况下，你将无法访问所有目标机器。\n\n然而，使用短语加密你的密钥比将它们明文存储要好。运行\
    \ `ssh-keygen -p`：`-p` 选项修改现有密钥的短语（创建一个新的）。该工具也会为密钥（文件）建议默认位置——`~/.ssh/id_rsa`，这是当你在生成密钥时没有指定位置时会得到的结果。\n\
    \n如果你有多个密钥（对，RSA 和 DSA），对 `~/.ssh` 文件夹的检查将作用于正确的密钥。然后，输入一个新的短语（两次），每当你想要使用该密钥登录远程机器时，系统都会提示你输入新短语。运行\
    \ `ssh-keygen -p` 并在提示新短语时直接按回车来更改它。你最后需要旧短语来移除它。\n\n> 作者：Hans-Geörg Geiger\n\n\
    ![](img/399caf126e037f28be04b36f402dd3c4_16_1.png)\n\n![](img/399caf126e037f28be04b36f402dd3c4_16_2.png)\n\
    \n![](img/399caf126e037f28be04b36f402dd3c4_16_3.png)\n\n酷炫 LINUX 技巧 - 2023版\n\n\
    输入短语 (按回车表示无短语): \n输入新短语 (按回车表示无短语): \n再次输入短语: \n\n你的身份信息已用新短语保存。\n为密钥 /home/user/.ssh/id_rsa\
    \ 输入短语: \n输入新短语 (按回车表示无短语): \n输入新短语 (按回车表示无短语): \n再次输入短语: \n\n你的身份信息已用新短语保存。\n\
    \n# 安全与隐私\n\n# 极客技巧 13\n\n## 从文件中提取元数据\n\n当你在社交媒体上分享文件或将其发送给一群人时，你可能没有意识到各种元数据都可以被删除。图片存储了拍摄的时间和地点（图\
    \ 1）以及使用了什么相机和设置，PDF 和 Office 文件记录了作者和编辑的创建和修改日期。你可以手动删除它们。例如，在 LibreOffice 中，你可以编辑文件属性并移除名称，而命令行工具\
    \ `exif` 允许你从照片中移除元数据。\n\n文件并选择**移除元数据**。它会创建一个清理后的 `metadata.pdf` 副本（当原始文件为 `document.pdf`\
    \ 时）。图 2 显示了如何运行 `mat2`。\n\n### 替代方案\n\n如果你无法在系统上安装 `mat2` 或者它无法正常启动，有一个替代工具 Metadata\
    \ Cleaner [3]，它使用与 mat2 相同的库并以 Flatpak 包的形式提供。要尝试，请在你的 Linux 系统上安装 Flatpak（如果尚未安装）并运行以下命令：\n\
    \n```\nflatpak remote --if-exists flathub\nhttps://github.com/flathub/flathub.repo\n\
    flatpak install fr.roinvigier.MetadataCleaner\n```\n\n如果你使用 Ubuntu 或基于 Debian\
    \ 的发行版，必须通过 `sudo apt install mat2` 安装 `mat2`。我也测试了 OPENSESE 包 (python3-mat2)，但它对我的文件产生的结果较少。\n\
    \n`mat2` 集成在 KDE 和 Gnome 文件管理器中，允许你通过右键移除元数据。\n\n> 图 1：exiftool 显示了过滤后的 GPS 位置元数据列表。在\
    \ Google 地图上你可以找到地址，此处是德国的杜塞尔多夫夫。\n\n![](img/399caf126e037f28be04b36f402dd3c4_17_0.png)\n\
    \n你应该能够在文件管理器中选择若干文件并在 Metadata Cleaner 中打开（在应用程序选择器中搜索“clean”）。程序启动并显示它发现了多少个字段（图\
    \ 3）。你可以点击条目查看详情，或点击“清除”开始处理。\n\n如果你在应用程序列表中没有找到该程序，请手动启动它：\n\n```\nflatpak fr.roinvigier.MetadataCleaner\n\
    ```\n\n作者：Hans-Geörg Eber\n\n- [1] https://github.com/joisin/mat2\n- [2] https://software.opensuse.org/package/python3-mat2\n\
    - [3] https://metadatacleaner.roinvigier/\n\n图 3：Metadata Cleaner 基于 Mat2 的库并提供了自己的图形化界面。\n\
    \n![](img/399caf126e037f28be04b36f402dd3c4_17_1.png)\n\n图 2：Mat2 显示了如何从 Word 和\
    \ PDF 文件中提取元数据。它显示了从文档中提取元数据的效果。\n\n"
