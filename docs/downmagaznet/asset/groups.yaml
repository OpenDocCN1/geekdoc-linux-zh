    ## HACK 25 多媒体


    没有什么能像音乐和音频视觉化器那样既浪费时间又让人倍感满足的工具了。虽然它们可以将纯粹的听觉体验变成一场贪婪的、甚至可能引发偏头痛的视听盛宴，但它们同样可以提升听觉体验，特别是在派对或现场表演中。即使在简陋的桌面上，它们也非常好玩，而
    projectM 是我们多年来遇到的最好的视觉化器。


    音乐视觉化器是指任何对音乐做出反应的视觉化器，以图形化的方式与通过它的声音产生共鸣。它涉及许多随节拍跳动的线条；或者颜色在彼此之间相互转换的脉冲，所有元素组合在一起。它可以是一个老式的
    Demo，也可以是完全全新的技术，还是一场关于你的 GPU 能向屏幕上推入多少像素的实验。它的成功完全取决于主观感受，并与使用的时机和动机有关。这就是为什么它的配置性非常高，projectM
