    ## ImageMagick: convert


    ## HACK 38


    You can use the versatile convert command for converting images to another file
    format, renaming, cropping, and resizing, as in:


    ```

    convert SOURCE TARGET

    ```


    This creates a new target file, leaving the original image untouched. The counterpart
    mogify uses almost identical syntax, but processes the source file directly.


    If needed, you can convert from one file format to another and rename the file
    at the same time. To change the only format:


    ```

    convert image.jpg image.png

    ```


    If you only want to change the file name, type:


    ```

    convert image.jpg photo.jpg

    ```


    In combination the command would be:


    ```

    convert image.jpg *.png

    ```


    If needed, you can convert all files of a certain type in a single action. There
    are several approaches to choose this. The


    ```

    convert *.jpg *.png

    ```


    | List 1: Mass Rename |

    | --- |

    | $0 for i in *.jpg; do convert "$1.jpg".png"; |

    | done |


    | List 2: Create Thumbnails |

    | --- |

    | 01 $ convert *.jpg -resize 200x200 preview.jpg |

    | 02 $ for i in *.jpg; do convert "$i.jpg" -resize 200x200 "thumbs/$i-thumbs.jpg";
    done |

    | 03 $ convert *.jpg -thumbnail 200x200 preview.jpg |

    | 04 $ convert -delay 100 *.jpg animation.gif |


    converts all JPEG files to the PNG target format, but without using the names.
    The files are then named *-1.png, *-2.png, and so on. However, you can easily
    change this with terminal commands (Listing 1).


    If you want to rotate resize images, mogify often proves useful because it converts
    the source file directly. For example, if all the images in a portrait but should
    be displayed in landscape format, you can rotate them all clockwise in one sweep
    using the command


    ```

    mogify -rotate "90" *.png

    ```


    or the other way around


    ```

    mogify -rotate "-90" *.png

    ```


    Parameters such as resize 800x600 or -resize 50 are used to reduce the size of
    the images.


    You can create thumbnails of the JPEGs in a folder using a command such as the
    one in line 1 of Listing 2. It names the target files preview-1.jpg, preview-2.jpg,
    and so on. If you want to take the name and save in a separate folder (thumbs/),
    the command might look like the one in line 2. To do this, if you only want to
    edit the thumbs/ of an image file, say, 200 or x200 --resize 200x200 convert:
    automatically deletes metadata and color profiles from the metadata (3)


    You can convert images into animations in a similar way. You can create an animated
    GIF from a set of JPEGs files, use the command from line 4 of Listing 2.

    Enter the value after -delay in hundredths of a second between images. If you
    specify 188, in the example, a new image appears every second.


    By Claudius Grier


    ## HACK 39


    ## ImageMagick: Copyright and Co


    A little more complexity comes into play once you create custom shapes using ImageMagick''s
    tools, mark images with data or image credit, or add a watermark for online preview.


    The command in List 1 adds a copyright label in the source image (note the capitalization
    of the cardinal directions). The font used here is 150-pixel-sized DejaVu Sans
    in white: the xy values that follow DejaVu Sans can be used to move the font by
    pixel if necessary (e.g., -20). In the example we left it at the original position
    (0). The correct spelling of the installed fonts is provided by the command:


    ```

    -list font

    ```


    To set a watermark, it''s best to use ImageMagick''s composite program to blend
    the source image with an existing image that has an alpha channel (i.e., a transparent
    background) (see figure). The following value ''-alpha'' can be between 0 (transparent)
    and 100 (opaque). The 50 in the example from Listing 2 means 50 percent opacity.
    The command, like all others with an asterisk instead of the filename, can be
    applied to all files of a certain type.


    By Claudius Grier


    | Listing 1: Label Images |

    | --- |

    | $ convert Image.jpg -gravity Southwest -pointsize 150 -fill white -font DejaVu-Sans
    -annotate 8 "(©) COPY FROM XYZ / 2022" target.jpg |


    | Listing 2: Watermark |

    | --- |

    | composite -watermark 50 -gravity Center WATERMARK.png SOURCE.jpg TARGET.jpg
    |


    > Watermarks help you protect your images online.


