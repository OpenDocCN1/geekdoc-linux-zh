    ## 使用 darktable 管理你的摄影工作流


    在 Linux 上，有几款强大的开源照片编辑器可以使用，包括 digikam、RawTherapie、Gimp 和 Krita。其中一个工具就是 darktable。我们曾为了其功能和特性使用
    Adobe Lightroom，但自从我们几年前上次使用 darktable 以来，我们认为它终于超越了它的灵感来源，并为我们领域的摄影师成为了一个功能强大的图像处理和管理平台。在《Linux
    Voice》杂志中，我们使用 darktable 进行摄影，它在很多时候使我们免于技能和能力的完全匮乏，特别是在处理欠曝光或过曝光的照片时，darktable
    可以魔术地将一个黑斑点变成我们可以打印的东西。这完全归功于 darktable 支持的 RAW 图像格式，因为这些文件通常比任何 JPEG 文件（例如，任何相机）都包含来自相机传感器更丰富的细节。


    为了支持新相机及其 RAW 图像，darktable 请求用户在 CC 许可下贡献自己的照片。


    对于从 Gimp 或 Krita 转过来的用户来说，darktable 可能会让你无从下手。它有两个主要的配置，你可以通过选择右上角的“明片工作台”（lighttable）或“暗室”（darkroom）模式之间进行切换。每种模式都用于数字处理：你通过光线查看图像以决定想处理哪些图像，然后在黑暗（红光）的房间里进行处理。在明片工作台模式下，你可以将照片组织成集合，给它们评分，添加类别以便于存储和取回。在暗室模式下，你可以通过启用一个或多个处理模块来编辑照片，这些模块可以完成从裁剪图像到补偿特定镜头畸变的任何工作，其效果可能是神奇且完全专业的。版本
    4 是一个重大更新，包含了自 3.8 版本发布以来 1600 多处的独立更改，自我们 2016 年首次安装 2.2.0 版本以来，darktable 接收到的无数更新。最重要的新功能是你你都可以控制的：例如，你可以创建一个新的曝光或色彩配置文件，并将这些应用于一组图像。修复一张照片，然后使用它来匹配其他照片。3.8
    版本引入的胶片模块（filmic module）源于 Blender，用于实现胶片的高动态色彩响应，现在更加灵活，并允许具有更高饱和度的色彩。同样，可以使用“引导放置”方法重建高光，从而保留靠近高光区域更自然的结果。所有这些听起来可能非常有技术性，并且对智能手机等可能没用，但事实并非如此。许多人可以将照片保存为
    RAW 图像，并用 darktable 进行处理。如果你需要打印某些东西、为图像创建相框或分享以发布，darktable 是理想的。如果你像我们一样，从未对场景进行适当的光照，或从未更改相机的曝光设置来补偿昏暗或明亮的光线，那么
    darktable 就是你的理想之选。


    此版本完全重写了用户界面，以保持外观的统一性。


    作者：Graham Morrison


    https://www.darktable.org/


    ## LosslessCut


    尽管我们在过去的二十年里取得了惊人的进步，视频编辑的感觉可能仍然像 1995 年在 PowerMacintosh 上使用 Media 100 进行编辑并写入磁带一样缓慢。这出于几个原因，但主要由于我们的方法无法扩展到这种程度。视频分辨率、色彩深度和帧率未能适应所有的处理，而且文件很少需要从一种格式转码为另一种格式。LosslessCut
    成功缓解了这一最新瓶颈。通过使用万能的 FFmpeg，LosslessCut 可以编辑视频，并且至关重要的是，它可以在无质量损失的情况下快速导出。它通过只让你按照自己的速度进行编辑来实现。


    这是一个完美的解决方案。我们寻找的完美的编辑，而是一种快速剪切到动作的方法，剪掉视频的前序、开头或结尾。通过 LosslessCut，你可以将视频拖入主应用程序，定位“编辑入点”（edit-in），定位“编辑出点”（edit-out），并将片段保存为新视频。这意味着你可以执行任何其他类型的编辑，如裁剪、重排序和处理，这些操作需要帧和关键帧的重新计算以及无损等同变换。你可以在想要编辑的精确点或分割点进行编辑。幸运的是，UI
    中的关键帧图标可以自动将光标移动到关键帧和编辑点。在消除这些限制后，性能瓶颈变成了存储访问，而非重建视频。


    编辑器之间的切换功能正在开发中，一个新的开发发布版本能够在关键帧之前重建帧，允许你在任何地方进行某些处理并针对重建点进行操作。视频的编辑将变得轻而易举，这与大多数视频编辑器的工作方式相比是一个巨大的改进。其余部分简单但有效。高级版本允许你查看缩略图、查看时间线、拍摄单帧，并查看片段的分辨率和帧率。你还可以导入多个片段，尽管目前它们必须分别编辑，而不是像在
    Kdenlive 中那样使用不同的轨道——尽管该功能也即将到来。


    1. 轨道：可以对多个视频文件进行删除、分割和连接。

    2. 音频：音频轨道可以分离、删除和替换。

    3. 输出格式：LosslessCut 可以编辑自己的格式，或通过 FFmpeg 导出为许多文件格式。

    4. 缩略图：片段可以选择性地开启缩略图和音频。

    5. 片段：视频被剪成片段，可以导出为音频或单个文件。

    6. 关键帧编辑：使用按钮和导航控制在点之间跳转。

    7. 导出：片段可以标记标签、重新排序并在右侧的独立面板中列出。


    作者：Graham Morton


    github.com/lossless-cut


