    \ eliminating concerns about the supported formats and files that are exactly\
    \ as the user intended and available on the recipient's word processor. For all\
    \ these advantages, the PDF format comes with ease, speed and security. It does\
    \ include privacy and security permissions, but these are primitive by modern\
    \ standards. In fact, these tools have failed several times, PDF exist in one\
    \ of two states: compromised and to be compromised. Fortunately, the means exist\
    \ to address issues that the PDF format itself does not. In addition to the countless\
    \ scripts available for editing PDF content and there are also a growing number\
    \ that enhance privacy and security.\n\nPDF protection continues to be used for\
    \ the simple reason that it is widely available. LibreOffice, for example, can\
    \ be set by Selecting | Export As | Export As... | Security. From this path, a\
    \ password can be set to open a PDF file, with well as grant permission for and\
    \ how the file can be printed, edited, or copied. These settings will work for\
    \ unauthorized users, but they are no match for cracked scripts or the laxity\
    \ with which many users handle security, if the file is in an environment where\
