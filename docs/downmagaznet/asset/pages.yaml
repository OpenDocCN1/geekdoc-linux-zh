  md: '# Curing the Caps Lock Disease


    # DESKTOP MODDING


    We are old enough to say "the problems started when IBM moved the function keys
    from the left (Figure 1) to the top"? That happened in 1988 when the IBM PC replaced
    the PC XT and the then leading personal manufacturer introduced the new keyboard,
    which is not the standard layout we know. Windows 95 made keyboard producers three
    new keys, and some modern keyboards have a *Fin* key by such requests on notebook
    keyboards.


    But the worst problem with keyboards are both old and new? In my view, it is the
    Caps Lock. Its purpose is to mess up the text you enter in an document or on the
    line when you type without looking at the screen. Once it transforms every lowercase
    into uppercase and vice versa. When you detect the mess, you need to get rid of
    all the entered text and fix it (again with Caps Lock). Only network tools will
    help, it does not grant access to the secondary bindings of non-letter keys. Instead,
    if you use accessibility tools to help you, you can use Shift, Ctrl, and Alt keys
    just do.


    The xbodap can inform you about the Caps Lock key, if you''re running Linux:


    ```

    $ xbodap -p | grep -u 66

    66 = xbodap_NocapShift_Lock

    ```


    the culprit is Caps Lock. There are several ways to get rid of it: One is the
    desktop environment configuration (Figure 2 shows how to configure Caps Lock after
    installing the gnome-tweaks-package on Ubuntu''s Ubuntu with apt), but I will
    show you two quick solutions that require simple commands.


    # Figure 1


    ![](img/399caf126e037f28be04b36f402dd3c4_10_0.png)


    (CC public domain)


    # Figure 2


    ![](img/399caf126e037f28be04b36f402dd3c4_10_1.png)


    The conservative treatment of the "Caps Lock disease" is to transform the key
    into a second Left Shift. That, if you prevent Caps Lock from shifting, you will
    still get a capitalized letter. If you want, use xbodap to change the key''s behavior:


    ```

    $ xbodap --option ''66=Shift_Left''

    ```


    If you want to completely disable the key, use the following command again. After
    changing, Caps Lock will have no effect. Notice how this affects the X session.
    To make it work, you need to use your desktop environment''s restart mechanism.
    Adding the line to .bashrc will not work for graphical users, because both commands
    expect a working server and a preset DISPLAY variable; they fail when in mode
    (see the "Caps Lock in Text Mode"). Here is how to make it properly:


    +   - Use Tweaks to create a file called lock.sh in ~/bin/ and write the command
    into that file. From the start menu, search for ''startup'', pick Auto-start,
    then click Add and enter the path to lock.sh.

    - Use users to run the gnome-properties command. Click on Add, then provide an
    informative title in the Field name, and the command in the Command field.

    - Under Custom, then click the + button, and choose Custom Command. Provide an
    informative title in the Field name, and the command in the Command field. Now
    the future looks bright: Caps Lock won''t trouble you.


    # Killing Caps Lock in Text Mode


    If you have in a text mode session (without Xi), the xbodap and setkbmap commands
    will useless - because they affect keyboard settings in the console. Mode, what
    you need is loadsmap. This program is used to switch local keyboard layouts, as:


    ```

    sudo loadsmap -q us layout

    sudo loadsmap -q uk UK layout

    sudo loadsmap -q de = German layout

    ```


    Also, you can use it to change a single key setting. Using the following command
    to make Caps Lock behave like:


    ```

    echo -e "keycode 0-27:keycode 58= Shift" | sudo loadsmap

    ```


    > By Hans-Georg Elger


    11'
