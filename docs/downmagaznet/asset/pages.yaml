    edit mode and a command mode. Like Vim, the command palette is opened with the
    key <; with Lapce, you can tell it what to do, including opening files, creating
    buffers, and changing the theme (both light and dark), and when configuring it.
    But Lapce does enough to make it a good option for fast editing and it''s likely
