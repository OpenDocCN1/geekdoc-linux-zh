  md: '# Write about Jupyter Notebooks


    If you want to embed documentation in your code that goes beyond simple code comments
    or if you plan to give a presentation that includes some highlighting, try JupyterLab
    (1) and create "notebooks" that can display and execute your code. The Jupyter
    team explain in documentation, a "notebook is a shareable document that contains
    computer code, program language explanations, data, rich visualizations, charts,
    graphs and interactive controls.


    Working with a notebook is similar to using an interpreter interactively: you
    can type in commands and have them executed directly. In the notebook, however,
    every output, variable, and documentation lives in a cell. Cells are code by default,
    but you can also use cells that accept documentation in Markdown syntax. Depending
    on which cells you add, you can use LaTeX in the code and handle formulas properly
    (Figure 1).


