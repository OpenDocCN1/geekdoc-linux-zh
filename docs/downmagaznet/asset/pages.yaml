  md: '# Virtual Machine Detection


    Of the systems I work on, about 90 percent are virtualized and 10 percent are
    legacy hardware servers. For many jobs, this makes no difference, but when I write
    scripts that can or change hardware-related functions, I need information


    If I have root privileges on the system and also allowed to retroactively install
    software, the problem can be solved very easily Factor [1] or virt-what [2]. Factor
    provides extensive information about the system''s hardware, which I know, and
    is usually overkill for assessing the "virtual" or not virtualization platform,
    as when with vmare or kva. The same result is returned by a call to virt-what.
    If I don''t have the power of Factor itself, I prefer the leaner virt-what.


    If I have root privileges but not allowed to install software (perhaps because
    of restricted repositories), there is another possibility.


    ```

    dmidecode -t system

    ```


    gives me the desired information (see figure)

    But if I don''t have root privileges on the system?\ There are solutions for that,
    even though several of them. The first is the command:


    ```

    dmeg | grep dmi

    ```


    dmidecode lets me quickly discover whether I''m working on a virtual machine.


    ```

    # dmidecode -t 1

    Getting SMBIOS data from sysfs.

    SMBIOS 2.4 present.


    Handle 0x0001, DMI type 1, 27 bytes

    Manufacturer: VMware, Inc.

    System Information

    Product Name: VMware Virtual Platform

    Version: None

    Serial Number: VMware-42 c13 14 d6 32 c2 f11 fd-87 c5 3c 82 c6b789f2

    UUID: 4213c0d2-c211-4BFD-B87C-3C82C6b789f2

    Power Switch: Not Specified

    Family: Not Specified

    ```


    On a VMware guest, the output looks like second line of Listing 1. If I run the
    same command on a physical server, I usually see some information about the server
    at this point (line 4).

    Another possibility is the command:


    ```

    cat /proc/scsi/scsi

    ```


    01 $ dmeg | grep dmi

    02 [ 0.000000 ] DMI: VMware, Inc. VMware Virtual Platform/4400X Desktop Reference,
    BIOS 6.00 05/28/2020

    03 [ ]

    04 [ 0.000000 ] DMI: HP ProLiant DL320e Gen8, BIOS 10.5 10/12/2012

    05

    06 $ cat /proc/scsi/scsi

    07 Attached devices:

    08 Host: scsi2channel: 00 Id: 00 Lun: 00

    09 Vendor: GEMU Model: GEMU HARDDISK Rev: 2.5+

    10 Type: Direct-Access ANSI SCSI revision: 05

    11 [...]

    12 Attached devices:

    13 Host: scsi2channel: 00 Id: 00 Lun: 00

    14 Vendor: Model: SanDisk SSD PLUS Rev: 00RL

    15 Type: Direct-Access ANSI SCSI revision: 05


    # Listing 1: Virtual or Physical?


    On a virtualized system, I would see output that shown in lines 7 to 10 of Listing
    1. The physical system, on the other hand, responds with information about the
    starting (line 12).

    There are quite a few other possibilities, but when it is technically possible,
    I use virt-what. It doesn''t get faster or easier than that.


    +   - [1]: Factor: https://github.com/puppetlabs/factor

    - [2]: virt-what: https://people.redhat.com/~jones/virt-what/


    > By Karla Kühnst'
