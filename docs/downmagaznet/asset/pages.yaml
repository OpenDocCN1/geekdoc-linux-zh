    # # Strip Metadata from Your Files


    When you share a file on social media or send it to a group of people, you may
    not be aware that all kinds of metadata can be deleted. Pictures store when and
    where they were taken (Figure 1) and what camera and settings were used, PDF and
    Office files remember creation and modification dates of authors and editors.
    You can remove them manually. For example, in LibreOffice you can edit the file
    properties and remove the name, and the command-line tool exif lets you remove
    metadata from photographs.


