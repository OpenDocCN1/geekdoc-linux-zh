  md: '# # Stable Diffusion (AI Image Generator)


    Over the past months, we''ve been inundated, and even bored by endless images
    generated by artificial intelligence. Images arrive fully formed from a single
    line or two of text entered into prompts, often with misaligned lines and uncanny
    valleys. OpenAI''s DALL-E was the first to grab the headlines, quickly followed
    by Discord''s Midjourney, and now Meta are taking on their own. These tools work
    by scraping images from the internet and using them as inputs for a machine-learning
    model that can generate images from natural language inputs. But they''re also
    closed source, at least for now, with one exception, a piece of software called
    Stable Diffusion.


    Stable Diffusion is a (non-OSI compliant) open source project that generates exactly
    the kind of images from its own model, which can be installed on your local hardware
    and without sharing any information or being online. The model won''t take you
    weeks to download it.


