    with some of rebase and cherry picking. But when it''s only a matter of time before
    you find yourself over-merged into increasingly intricate merge conflicts that
    become almost impossible to resolve.


    We always joke that the reason there are so many programming editors is because
    creating such a text editor is an ideal first project for programmers, especially
    when they''re switching to a new language. Because Rust seems to be a popular
    language, there are lots of new editors written in Rust. Rust also seems to be
    one of those editors mentioned every time someone talks about programmers when
    they never fail to make their favorite Linux distribution. All of this is like
    Lapce [1], a new program that proves Rust editors are sleek. But it edits in such
    a way that makes the installation effortless. It''s practical, fast, simple, and
    uses edit and command modes like Vim.


    It''s then that you''ve used a smart git client to make better sense of it all.
    This is what lazygit is all about. It lives in over your terminal, filling the
    terminal with five or six different panes. When launched, it asks you to watch
    a YouTube video explaining its features to present the latest releases.


    Lazygit''s panels are easy to understand if you use Git for some time. On the
    left pane shows the current file and commit status, modified files, a list of
    recent changes, and whether there are staged files (from other branches). You
    can navigate between the panes with the arrow keys or with Vim-like navigation.
