    # Play DOS Games in DOS Emulator –


    Many classic games have been released for MS-DOS – think of first-person shooter
    minions like Queer and Doom or adventure games such as the Monkey Island series.
    Many of these games are available from the Internet Archive software library (Figure
    1), but how can you play them today?


    Of course, it''s perfectly possible to install MS-DOS or its clone freeDOS, either
    on a real computer or in a virtual machine. But with a tool that can simplify
    the task: DOSBox is a combined PC and DOS emulator that can map any file from
    your Linux box to it:


    As an example, run Doom 2, released in 1994. First, download the Zip archive (Doom2.zip)
    from the Internet Archive. Create a Doom2 folder and extract the Zip file into:


    ```

    cd ~/Downloads

    mkdir Doom2

    cd Doom2

    unzip Doom2.zip

    ```


    which were available for free). If you own a copy of the full Doom 2 game, you
    can copy the WAD files to this folder:


    You can exit the emulation by closing the window (which will work even when Doom
    2 or other games you are playing are active). Alternatively, leave the game and
    type the exit command. If you play a sophplicated game that will save your game
    state, that''s the better option.


    If you want skip entering a DOS command, you can make the game auto-start by using
    the -c option and the command that will start it. For the Doom 2 example, try
    this:


    ```

    dosbox -c doom2

    ```


    Now run the DOSBox binary with the folder name (a single dot) as an argument:
    This will make the folder accessible via the C: drive of enveloped DOS.


    dosbox.

    A new window appears and boots; the familiar C: command prompt appears immediately.
    You can now explore the environment a little: ver will show you that DOS aims
    at MS DOS 5.0 compatibility, and will give you access to your shared folder (Figure
    2). To run Doom 2, enter doom. The game (Figure 3) is fully playable (but of course
    only has the demos


