    This will tell you to switch window mode via Alt + R.


    # DOSBox-X


    You can get better using DOSBox-X, which is a successor to DOSBox. The project
    offers Flatpak and RPM packages for Linux (as well as Windows and macOS). Install
    it on Ubuntu with


    ![](img/399caf126e037f28be04b36f402dd3c4_90_0.png)


    sudo apt install flatpak


    ```

    flatpak install flub com.dosbox.dosbox-DOSBox-X

    ```


    and then run the binary by


    ```

    flatpak run com.dosbox.dosbox-X _x

    ```


    Alternatively, you can compile DOSBox-X from source. You need to provide dependencies
    (C build-essential package, libsdl2-dev), and after running the build script in
    the archive and typing sudo make install, you can start the DOSBox via command
    line. The website has detailed instructions for Ubuntu and Fedora, and it''s okay
    if it takes a few minutes to complete).


    When you resize the DOSBox-X window, you can change the aspect ratio when you
    do. Luckily there''s a Video menu and click on Fit to aspect ratio (Figure 4).
    This will make that the screen appears in 4:3 ratio as you wish.


    DOSBox-X contains some other features. The Drive entry feels particularly useful
    because it lets you mount a floppy disk image or a Zip archive on DOS. When you
    want to install software that was distributed on 1.44MB or 720KB floppy in the
    day, you can use this software as a bundle of image files. DOSBox-X option lets
    you choose disks while the installer is running (Figure 5).


