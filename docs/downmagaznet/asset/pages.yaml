  md: "# Zoom Everything on Your Screen\n\nMany applications let you zoom the content\
    \ they display; for example, in Firefox and LibreOffice, you can press the Ctrl\
    \ and move the mouse wheel to increase or decrease the zoom.\n\nBut sometimes\
    \ you might need a different kind of zooming. Imagine if you want to show a LibreOffice\
    \ Imp presentation to your audience, and there's a detail you want to draw attention\
    \ to on your slide. You'd want to leave presentation mode and zoom, which is not\
    \ really professional. Luckily, it is possible to zoom the whole desktop. Depending\
    \ on your environment, you might want to activate the feature.\n\n# Cinnamon Do\
    \ It, Gnome Almost\n\nIf you use Cinnamon, open Preferences | Accessibility and\
    \ click on Enable. Then change the Mouse tracking to Cursor pushes contains: That\
    \ way moves will not change when you see the screen - until you reach the boundaries.\
    \ Double tap Left to hold Left press and use the scroll wheel to zoom into your\
