  md: '# # Call Home with DWS Remote Control


    The use of remote software has grown massively in recent years. Users increasingly
    experience situations where they need to access the desktop on a remote computer
    – whether to work from the home office, to help family or friends with computer
    problems, or to quickly access the home desktop system. Linux offers many possibilities
    for remote control.

    Tools such as Virtual Network Computing (VNC) [1] or Remmina [2], which supports
    RDP, Spice, NX, XDMCP, and SSH protocols in addition to VNC, provide access to
    Linux, macOS, and Windows computers. Chrome Remote Desktop is available for users
    of Google''s Chrome browser. TeamViewer and AnyDesk are the kind of thing. In
    the commercial world, however, they are increasingly seeing competition from the
    fledging open source tool, RustDesk [3]. Another free, but little known, application
    for remote control provided by the Italian company DWService.


    Figure 1: A click on the Screen reveal the 1:1 view of the remote desktop usually
    seen with remote maintenance software.


    ![](img/399caf126e037f28be04b36f402dd3c4_58_0.png)


    For a permanent installation, enter the agent code previously shown on the web
    page setup and continue on the Agents tab of the web page by clicking Online.
    After accessing, you will not see the desktop image of the remote computer. Instead
    you will be presented with a screen with buttons: Files and Folders, Text editor,
    Log watch, Resources, Screen, and Shell.

    DWS Remote Control with Debian 11, Ubuntu 23.04, and Fedora 37. With Ubuntu and
    Fedora, when I tried to access the target computer''s interface directly I found
    that the software does not support Wayland. To use DWS Remote Control with default
    it launches a Wayland session, by default you need to run X under Wayland on box.


    DWS Remote Control, as the service, requires you to install an agent on the target
    computer. You can access it in any browser from the source computer. You need
    to register on the DWS Remote [4] website. After doing so, download the agent,
    which is available for Linux, macOS, Windows, and Android. DWS Remote Control
    is a Windows installer that offers source licenses, and the source code is open
    [6].

    As first step after registering and logging into the DWS website, you will be
    prompted to enter a name and description of your computer to manage remotely.
    After finishing, you will receive a code to install the agent on your computer
    to be controlled.

    During the download, DWS tells you that it does not store any data and the connection
    is encrypted. The package is stored as dagent.sh on your machine. First, make
    the script executable


    ```

    chmod +x dagent.sh

    ```


    and then trigger the script with sh dagent.sh.


    # Agents at Work


    # Different Operating Principle


    DWS Remote Control uses an abstraction to represent the remote system desktop.
    Each remote computer can be controlled in the same way. Only one of the buttons
    shows you the remote desktop.


    # Graphical Approach


    The next steps take the GUI: In the first window, you have the choice of installing
    the agent permanently or activating for one session only. If you want to install
    it permanently, start the script. If you decide to use it for only one session,
    the next window will provide you the information you need to access the remote
    computer on the source computer on the DWervice website. After entering the information,
    the other end needs to allow unattended access was selected when the session was
    initialized. You can also set a password for this.


    # DWS Remote Control on Ubuntu


    It is impossible to access the graphical desktop of a target computer that runs
    Wayland – if you will get an error (“Wayland is not supported”). The GitHub hub
    page for this mentions a “fix” for this problem, but it is just an explanation
    of how to change the settings of the login manager GDM so it starts a X session
    instead of Wayland. (They instruct to edit /etc/gdm3/custom.conf and remove the
    character # from that line).

    While that works, it is not a fix if you''ve decided to use Wayland for a reason.
    Also this only works with GDM.'
