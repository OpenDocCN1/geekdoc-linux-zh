  md: '# Green Coding Initiatives


    Word is starting to say: Software often unnecessarily wastes a huge amount of
    energy. Several open source projects are developing tools for studying and measuring
    exactly how much. This article tours some of the most promising tools.


    # Taking a Tour


    The Green Software Foundation (GSF) [1], which the Linux Foundation launched in
    2022, has the stated mission to "Build a trusted ecosystem of people, standards,
    tools, and best practices for building green software." For this purpose, the
    GSF, which includes companies such as Microsoft, Intel, and Accenture, is organizing
    working groups. There are already several repositories, tools, and documents available
    at https://github.com/Green-Software-Foundation.


    For example, the Open Source Working Group (ongoing) maintains a repository called
    Energy Tracker [2], which includes a whole host of tools and research on energy
    conservation, as well as links to free software. On top of this, you will find
    an overview of climate organizations, as well as access to their articles, papers,
    and books.


    The GSF also highlights tools for code and machine learning. For example, there
    is a link to the Green Cost Explorer [3], a JavaScript tool that takes into account
    AWS Cloud footprints but also takes into account the energy types of the AWS regions
    as well as the costs. It ultimately tells you how much renewable (Green) energy
    your application is running on.


    Kepler [4], the Kubernetes Power Exporter, uses eBPF to report power-related statistics
    from Kubernetes. The Experiment Tracker [5] and the Carbon Tracker [6] measure
    the energy overhead for machine and deep learning. The GitHub repository also
    tracks operating-system metrics. For example, the Linux entries takes you to PowerAPI
    [7] and TOP8 [8].


    # Green Patterns


    Anyone who is looking to make their IT greener will find what they are looking
    for in the Green Patterns repository [9]. The GSF Projects collect and share practices
    for different fields of IT (AI, cloud, web). The spectrum ranges from various
    generic types (e.g., run geographically as close to the user as possible) to concrete
    recommendations for action (e.g., compressed data). The patterns reference the
    Software Carbon Intensity (SCI) [11]


    specification formulas for how admins and developers can efficiently implement
    their recommendations.


    The specification helps to attach an SCI to an application based on CO2 emissions.
    The value, the less-carbon gas the software uses. The score measures CO2 emissions
    per unit, where a unit can be an operational user, or an ML training run. So focus
    is SCI/CR, where CR can be subdivided into more specific sources, such as O (operational
    emissions) and M (embodied emissions). O is the energy required by the software
    itself, and M is the hardware required.


    The Carbon AWARD [10], on the other hand helps developers integrate into their
    applications to take advantage of fluctuating energy prices. The Carbon AWARD
    SDK can use with either the command line or web API, which is used for non-time
    critical machine learning jobs. The SDK moves work to other cloud regions where
    renewable energy is cheaper. Alternatively, it thrills to throttle back operations
    as a function of the type of energy. The people behind the project care for CO2
    reductions in the double-digit percentage range.


    # Green Coding


    The tools of the GSF are available to everyone, but the foundation is based in
    the US and is funded by users-corporations. However, several efforts are taking
    place in Europe. Green Coding, for example, is a Berlin that believes will only
    have a positive impact if it is sustainable. Green Coding is looking to develop
    source measurement tools that determine the requirements of software and infrastructure.
    The aim is to center around green software. To end, Green Coding cooperates with
    the Sustainable Digital Infrastructure Alliance (ASIA) [13], an alliance of companies
    with a roadmap for a sustainable digital infrastructure.


    Green Coding offers the Green Metrics Tool [14], a container-based utility that
    is currently intended for experimentation and testing. Green Metrics can help
    you measure the storage space per container, the CPU utilization as a percentage,
    and the system-wide


