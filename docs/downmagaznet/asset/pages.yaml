    # ssh-audit: Security Tool


    On a recent podcast episode, we ran an informal survey of what most listeners
    thought was their most essential open tool. The overwhelming winner was the humble
    shell, SSH, the remote command-line client and server that may have been used
    for decades. SSH is super secure and easy to use, often configured at a level
    that can be intimidating to beginners to start their machines remotely. But SSH
    can also be a victim of its own success. Its ubiqu makes it a common attack vector,
    as anyone who runs a server and happens to look at the logs can attempt to guess
    your username and password combinations, not helped when even distributions such
    as older versions of Raspberry OS used default usernames.


    If KDE Plasma''s System Monitor is the most beautiful monitoring tool we''ve looked
    at, then Guider is a good candidate for the most comprehensive. It doesn''t consider
    itself a monitoring tool, preferring the term "integrated performance analyzer,"
    which is a fair description. List of features includes monitoring, profiling,
    tracing, visualization, control, logging, networking, and all of which can be
    configured. Guider is written in Python and is easily installed. Just run `guider
    top` to launch the tool as a simple process viewer, though simple isn''t quite
    the right word. Every monitoring tool generates a huge amount of data which can
    easily overwhelm your term. The top limitation is listing statistics for every
    process alongside a table and general system overview.


    All mitigated by configured ssh, swapping passwords for encryption keys, and changing
    the default ports. But if you''re not an expert, it''s difficult to know whether
    you''ve exchanged one of problems with another. Where is the answer? It''s a tool
    that lets you check your ssh configuration by analyzing the connection rather
    than parsing the configuration file. This allows you to detect whether it is actually
    happening, as well as monitor for control channel-side vulnerabilities when coming
    and going connections, even when you don''t control the server.


    Other means can be used to analyze processes, measure execution time of specific
    functions, inspect the call stack, and perform signaling. You can reconfigure
    the scheduler for a process to get more or less CPU time, or limit it which sometimes
    depends on your kernel configuration. The output can easily be piped into a JSON-formatted
    file or viewed from a web browser.


    Threads can also be traced, recorded, and their history played back and directly
    from history however you want with your favorite browser or image viewer. There''s
    a lot to learn, but the tool is also straightforward and easy to use for simple
    monitoring, making it ideal for someone who needs something that will grow with
    their knowledge.


    By Graham Morrison


    https://github.com/jesta/ssh-audit


    https://lisspace.github.io/docs/guider.html


    Guider is a monitoring tool that goes from simple process monitoring to threading
    and profiling.


    While ssh-audit gives you a lot of detail, you can find an excellent guide on
    their website if you need advice on how to configure your SSH.


