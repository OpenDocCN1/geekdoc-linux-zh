    language that you can use in the cells. You''ll get syntax highlighting, and when
    you press Shift+Return, the cell content is run through an interpreter. Cells
    are not isolated from one another. You are using one interpreter that will execute
    whatever code you send to it, so variables and functions remain defined. Of course,
    there''s a reset option that lets you start a fresh interpreter.


    You can save the notebooks as *.ipynb files and pass them around, or put them,
    for example, on GitHub or GitLab. A notebook file contains both the code cells
    and the outputs generated by running them. You don''t have all the cells, so you
    can send a notebook to a colleague or a student (if you''re teaching) and ask
    them to run the cells to discover what the code does.


