  md: '# DESKTOP MODDING


    ![](img/399caf126e037f28be04b36f402dd3c4_9_0.png)


    # What Time, What Date?


    KDE''s task bar shows a clock in the right corner. It combines time and date and
    stacks on top of one another. While that saves space, it also makes it hard to
    quickly read the date which is in a tiny font. Better Inline Clock is an alternative
    widget that shows time and date by side.


    Right-click on the desktop, Add Widgets, then click Get Widgets / Download New
    Plasma Widgets. In the search box, type "inline clock", or hover over the Better
    inline clock entry in the search results, and click on the Install button that
    shows up.


    Right-click the clock widget in the task bar and Select Options. You will find
    the clock widget in the list. Select and click Switch to change your clock widget
    in one. You can see immediately how both date and time display in a large font
    makes it easier.


    The clock is configurable: Right-click to Select Configure Inline Clock. Most:
    you can change the date and time displayed. If you prefer a numeric format, you
    can also create your own format string: Select Format and enter edit code to print
    the date as 31.05/2023 instead of 31 May 2023. Use the 24-hour clock if you like
    this.


    # Disable automatic screen locking


    Does automatic screen-locking drive you mad? Most desktops are pre-configured
    to lock you out of your current session when you''re not typing or moving the
    mouse for a few minutes. To unlock this screen, you can press a key to stop the
    action, but if you wait too long, you need to enter your password. This is an
    important feature for machines in public and shared spaces, there''s no point
    if you disable auto-locking—you will still be able to lock the screen.


    KDE users open the Settings (Settings / System Settings) and search for "lock,"
    Select / Screen Privacy Preferences to find the search results, and disable the
    Automatic Screen Lock option. Just like KDE, Lock screen after N minutes. There
    is a box for after waking from sleep which doesn''t happen often, so tend to leave
    it off if you don''t need it test. You can still manually lock it with Alt+L.


    Gnome users open the Settings, search for "lock," Select / Screen Privacy Preferences,
    and then decide on a separate option named Lock Screen on Suspend. To manually
    lock the screen, click on the power-off in the global menu bar and select Lock.


    > By Hans Geeger


    ![](img/399caf126e037f28be04b36f402dd3c4_9_1.png)


    Disable the screen locking in the KDE settings. Gnome offers a similar dialog.


    Below the red line you see the alternative clock widget that makes it easier to
    read and date.


    ![](img/399caf126e037f28be04b36f402dd3c4_9_2.png)


    COOL LINUX HACKS – 2023 EDITION


