    its early proprietary licensing the foundations of Gnome, for instance. It has
    remained open source, but various new developments and components have drifted
    into and out of inclusion as the Qt project experimented with new models. Recently,
    the Qt project, the Qt Company, announced it would only release LTS versions of
    Qt 6 and not intermediate patches, for the KDE project to maintain all ours. This
    leaves its sub-projects, such as the brilliant platform-agnostic Qt Creator, stuck
    in the middle of a storm they have no control over, and for users to know which
    such sub-projects.


    Qt Creator has been released under the terms of the GPL, but it has also become
    more interwoven with the Qt framework and its priorities. What motivated the creation
    of LeanCreator, a fork of Qt Creator that''s attempting to make Qt open, and adaptable.
    It is built from itself, a fork of Qt itself, in the shape of a project called
    LeanQt, which was the last version released under LGPL v2.1. Both Lean-projects
    help at extracting only what they need from their respective codebases, and LeanCreator
    builds into a single executable without further dependencies or shared libraries.
    It''s a brilliant application, with powerful highlighting, autocompletion, and
