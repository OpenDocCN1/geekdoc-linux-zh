  md: '# DNS Tricks: Improve Hostname Resolution


    # HACK 43


    When you access a website, you use a URL that contains a hostname, for example
    www.linux-magazine.com. The browser will then connect to the server that hosts
    it, which normally means it will try to establish an HTTP connection to the HTTPS
    port (443) but before that, it may every www.linux-magazine.com, the operating
    system first needs to resolve that name to an address (Internet protocol IP) numeric
    addresses, either IPv4 or IPv6.


    overwriting can be disabled in /etc/hosts, where you will typically find a line
    order hosts, that makes Linux look in the hosts first.


    Address resolution (from a hostname to an IP address) can be handled in several
    ways: The system may find the name and address in a hosts file (/etc/hosts), ask
    a remote router (which will query your ISP), or ask an alternative Domain Name
    System (DNS) server that you''ve configured. DNS handles address resolution in
    a hierarchical fashion.


    If you want to resolve your hostname to a different method, add a line to /etc/hosts.


    To see resolution in action, you can use the dig command:


    ```

    $ dig +short www.linux-magazine.com

    linux-magazine.com.

    104.237.128.147

    ```


    # Enable Local DNS Server


    Most distributions use systemd, which provide a list of servers: it is much more
    than a replacement for the old SysInit-style initialization. If the DNS server
    is enabled, it will act as a DNS cache - it will ask another DNS server if needed
    and cache the address, but will remember previous lookups, so it won''t ask for
    the same address again and again. This speeds up loading web pages. (The information
    will time out eventually.) If you check it in use:


    ```

    resolvectl

    ```


    If it is working, it will provide information about the DNS server to which it
    is queried. You should see something like


    Current DNS: 192.168.178.1


    If you get an error message, you will need to enable the server, and you may also
    have to install it first. For example, on a current openSUSE installation, I had
    to install the system-network package with Zipper first. Then edit /etc/system/resolved.conf
    (as root) and add a line


    Here dig has found that the address is not installed, or ping; your system is
    returning an IPv6 address instead of an IPv4 address, for example: 2001:db8:ff03:91ff:fe09:28c1.


    a.b.c.d


    where a.b.c.d is the IP address of the DNS server that you''ve used before - that
    will be your router. Run


    # Block Hosts via /etc/hosts


    You can use the /etc/hosts file to overwrite the addresses of hostnames. This
    is used to block notorious addresses. Just add a line for each hostname and block
    your localhost IP address 127.0.0.1, like this:


    ```

    systemctl enable systemd-resolved

    systemctl start systemd-resolved

    ```


    When a page contains links to ads, the browser will no longer download them but
    try to connect to your local machine address (which won''t work). The figure shows
    how dig gives a different answer if you insert a line: www.linux-magazine.com.


    to enable the server. On the openSUSE test system, resolved timed out after these
    steps; the problem went away after a reboot. Even though the DNS server was active,
    the system did not use it. If the problem persists, then open /etc/resolved.conf
    (again, as root), and change any nameserver by adding a prefix and suffix


    ```

    127.0.0.1 localhost a.b.c.d

    ```


    | | | |

    |---|---||

    | 1 | 127.0.0.1 | localhost |

    | 2 | 127.0.0.1 | a.b.c.d |

    | 3 | # The following lines are disableable for IPv6 addresses |

    | 4 | ::1 | ldp-local-loopback |

    | 5 | ff02::1 | ff03:91ff:fe0loopix |

    | 6 | ff02::1-ldp-multicastream |

    | 7 | ff02::2-ldp-allocines |

    | 8 | 8.8.8.8 | google.ns.net | |

    | 12 | 127.0.0.1 | www.linux-magazine.com |


    nameserver 127.0.0.1


    This address, 127.0.0.1, points to your computer.


    By Hans-Georg Eber


    LINUX HACKS - 2023


