    # ntopng: Browser-based tntop


    It''s remarkable how most home networks provide very little analysis of the network
    traffic they are carrying, or their details on what they''re sending and receiving
    from the Internet. But most home routers can manage network usage with a pie chart
    split into basic categories for video, file transfers, and more. One of the reasons
    we don''t have access to deeper analytics is likely because users today can''t
    even see their routers, let alone over the higher layers of the OS or local interface
    between UDP and TCP. But there could be a middle option for us, and as name might
    say, ntopng is the "next-generation" of the network traffic analysis tool ntop,
    which was itself developed to show network status in the same way the top did
    for process status.


    If you have a FRITZ!Box router, ntopng can grab packets from your entire network
    for further analysis on another flows of connectivity, and geolocation analysis.
    It can get much deeper, but most average Linux users will be able to deliver a
    lot from these charts alone. The only downside is that stopping is only an open
    source code project, which means there are iterations in the downloadable version.
    This version is called the "community" version, and its limitations won''t affect
    home users wanting to add a missing feature to their router to understand their
    networks better, but may temper what others consider be an otherwise welcoming
    recommendation.


