    # Run Apps in Boxed Mode with Boxxy


    Linux has become good at containers, virtual machines, and isolated packages that
    you''re probably running more instances of Linux in containers than you are natively.
    But often you don''t need a full-blown container to keep a few things separated
    from your day-to-day system. For those occasions, Boxxy is the perfect solution.
    A clever, low-resource tool that controls directories and files to isolate a location
    to you, specifying the circumstances around it.


    Boxxy configuration allows a Linux kernel feature all of namespaces without using
    symlinks, which are typically used all the time for ad hoc hinch locations. But
    synonyms make it difficult to understand your files.


    configuration can be as simple as source target (such as ~/tmux.conf) and a destination
    rewrite (~/config/tmux/tmux.conf), with a mode setting for simple file redirect,
    or directory, which is the default. A context can be optionally set so that rule
    only applies to one location, where you can build a set of rules for different
    locations with. With that out of the way, you need to launch and run commands
    with that configuration.


    Boxxy takes advantage of low-level features to create an accessible and useful
    tool to install apps you want.


    Each command will be accessing resources whether path developers have hardcoded
    the executable while redirecting input and output to a location of your choice.
    It is a brilliant way to clean up whatever configuration, or a home directory
    cluttered with dozens of files that have no regard for Marie Kondo''s philosophy.


    Boxxy is better.


    Boxxy compartmentalizes all its separate namespace for configuration you create.


    By Graham Morrison


    https://github.com/queer/boxxy


    # Securely Split Files with horcux


    In the days before the World Wide Web, back when BBS were common, and if you were
    lucky, the Internet was accessible via dial-up downloading large files was difficult.
    There were several methods for this, but the most important was it was hard to
    keep a connection for a long period of time. Combine this with the popularity
    of sharing files on Usenet, and common split large files into smaller folders
    could later be reconstructed or stored across several floppy disks. The brilliantly
    named horcux is a modern version of the script that has been specifically designed
    to help keep your files safe with encryption.


    Horcux is designed to ensure a form of encryption without the need for a key or
    password by splitting a file into multiple pieces with a selectable degree of
    redundancy. The redundancy lets you reconstruct the original file from a set of
    files less than the total. You may choose to split your personal data into 10
    pieces, for example, but make the reconstruction from just. The idea is that each
    of these pieces to locations allows you to remember the password passphrase, besides
    if you ever need to access the files. The locations can be physical, such as a
    USB stick or disk drive, or a cloud storage or a remote server. Only two commands
    are needed to do this, however, horcux creates a bind, and is prompted for the
    numbers of pieces and redundancy when you''re ready. It''s a great idea, and not
    unlike its namesakesakes in the Harry Potter books, but hopefully without the
    same consequences if they''re ever destroyed.


    Horcux uses Sham''s Secret Sharing (SSS) to encrypt a file split into pieces.


    On the project website you can find an archive file that contains a static binary
    for all Linux distributions.


    By Graham Morrison


    https://github.com/jesseduffedord/horcux


    ![](img/399caf126e037f28be04b36f402dd3c4_21_0.png)


