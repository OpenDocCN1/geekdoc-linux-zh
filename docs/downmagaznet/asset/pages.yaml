  md: "# HACK 90\n\n# SHELL HACKS HACK 91\n\n# just: Command Runner\n\nCommand runners\
    \ are curious things because there are so many ways to automate the running of\
    \ commands. Shell commands are the simplest and the most widely used. If you can\
    \ type commands into a shell, you can run them separately. But then you are also\
    \ prone to errors, and not particularly when changing environments, locations,\
    \ or systems. A shell of this scale may have a syntax of its own for running and\
    \ controlling the commands. The vastly runner is just another example, and it\
    \ provides the best of both worlds. Command automation is easy, but also potentially\
    \ manageable as a project.\n\nThe commands are grouped together in a YAML-like\
    \ text file called a recipe. These recipes are easy to build and read but are\
    \ also deceptively powerful: at their simplest, you execute a command, and the\
    \ command followed by line will run that command. All output is captured as comments\
    \ and other feedback from the recipe. But this is just the beginning. Recipes\
    \ can include settings, variables, dependencies, and more. You can also include\
    \ conditions, and these are useful for parsing and outputting generally more generic\
    \ than their shell alternatives. All of it is beautifully documented in the project\
    \ README, making it easy to find functions, options, or it's easy to understand\
    \ and use yourself. Unlike a shell, which requires encyclopedic knowledge of the\
    \ syntax before you ever start, just a function is easy to use. If you find yourself\
    \ running the same commands over and over, or over different machines on different\
    \ distributions, just can be a much more practical and pleasant experience.\n\n\
    > By Graham Morrison\n\nhttps://github.com/casey/just\n\nCreate batch scripts,\
    \ conditional scripts, text scripts, and run and parse Python commands with just.\n\
    \n# hiSHT: History Improvements\n\nDespite sounding like it's been after since\
    \ a lecturer saying, \"hiSHT\" is worthy of your attention. It updates the functionality\
    \ of one of the most important aspects of the shell or terminal interactions:\
    \ command history. Most of us access history with up and down cursor keys, with\
    \ a few elite Ctrl+R to search through your previous commands. The problem with\
    \ this default terminal history is that while you type, it is lost as text. A\
    \ history that can follow you into a remote session, even as a user, in a different\
    \ environment or location on your filesystem, and it will still be available through\
    \ your history. The best way to improve your command history is to record every\
    \ command you wish to run. When you move to a different machine? What happens?\n\
    \nhiSHT improves on this by recording the context of each command. You can remember\
    \ the run exit status, whether the command was successful or not. This might not\
    \ seem like a big deal, but if you've ever searched through your history only\
    \ to find typos and badly argued, you'll find they all have equal importance alongside\
    \ the one successful command you're looking for. This is precisely where hiSHT\
    \ helps. It supports the two previously mentioned history access commands and\
    \ replaces them with additional functionality. It allows searching for commands\
    \ matching a specific string, hostname commands that return a certain exit code,\
    \ or even runs after a certain date. The history is stored locally and can be\
    \ synced across devices with end-to-end encryption, so you have access to your\
    \ latest types. It's brilliant and should ideally become the default history behavior.\n\
    \n> By Graham Morrison\n\nhttps://github.com/ddwwork/history\n\nhiSHT replaces\
    \ your terminal's functionality history with a history that can be shared across\
    \ machines.\n\n```\n# cat recipefile\n# python to execute recipe lines and backtrace\n\
    set shell: \"python\", \"-c\"\n\n# use print to capture result of evaluation\n\
    foo:\n  print(\"foo = %s\")\n  print(\"snake snake snake.\")\n  print(\"foooutput\"\
    )\n\nprint(\"snake snake snake.\")\nsnake snake snake.\nprint(\"foooutput\")\n\
    \n```\n\nCOOL LINUX HACKS - EDITION 2023\n\n97"
