    Green Coding collaborates with KDE Eco [15], a fledgling KDE initiative that aims
    to bring more sustainability to free and open software. The initial aim is to
    measure the energy requirements of free and open source software with a view helping
    developers optimize software later. The KDE Eco project offers two central repositories
    [16].


    The FOSS Energy Efficiency Project (FEET) [17] is fundamentally based on the Blue
    methodology. (Blue Angel is a German initiative that signs a special label to
    designate environmentally products.)


    The FEEP report describes a measurement setup [18] that uses a reference computer,
    an energy meter, and software. This equipment helps to automate the execution
    of the software test conditions and to record and process the measure data.


    The BE4ROSS repository [19] collects Blue Angel information and free workshops
    and manuals. Anyone thinking of creating their own software with the Blue Angel
    label can find here in the Blue Angel Application [20].


