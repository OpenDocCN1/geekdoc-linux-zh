  md: '# ImageMagick: convert


    # HACK 38


    You can use the versatile convert command for convert-ing images to another file
    format, renaming, cropping, and resizing, as in:


    ```

    convert SOURCE TARGET

    ```


    This creates a new target file, leaving the orig-inal image untouched. The counterpart
    mogify uses al-most identical syntax, but processes the source file directly.


    If needed, you can convert from one file format to an-other and rename the file
    at the same time. To change the only format:


    ```

    convert image.jpg image.png

    ```


    If you only want to change the file name, type:


    ```

    convert image.jpg photo.jpg

    ```


    In combination the command would be:


    ```

    convert image.jpg *.png

    ```


    If needed, you can convert all files of a certain type in a single action. There
    are several app-proaches to choose this. The


    ```

    convert *.jpg *.png

    ```


    | List 1: Mass Rename |

    | --- |

    | $0 for i in *.jpg; do convert "$1.jpg".png"; |

    | done |


    | List 2: Create Thumbnails |

    | --- |

    | 01 $ convert *.jpg -resize 200x200 preview.jpg |

    | 02 $ for i in *.jpg; do convert "$i.jpg" -resize 200x200 "thumbs/$i-thumbs.jpg";
    done |

    | 03 $ convert *.jpg -thumbnail 200x200 preview.jpg |

    | 04 $ convert -delay 100 *.jpg animation.gif |


    converts all JPEG files to the PNG target format, but without using the names.
    The files are then named *-1.png, *-2.png, and so on. However, you can easily
