    \ packets to and from the CPU, an application firewall takes an application-specific\
    \ view when monitoring the outgoing data. (Do not confuse an application firewall\
    \ with a web firewall [11]). Example of application firewall includes LittleFilter\
    \ [2] for Linux and GlassWire for Windows. Here, let's take a look at an open\
    \ source application firewall: OpenSnitch (4), a Python port of Little Snitch\
