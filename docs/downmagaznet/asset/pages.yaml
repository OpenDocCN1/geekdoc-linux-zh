    # Age: Master of the Keys


    Age (think "aghe" in "spaghetti") promises an unanticipated approach to encrypting
    and decrypting files. Written in Go, both the source code and precompiled binaries
    for various platforms can be found on GitHub [1]. Tried Age on PC, macOS, and
    Windows, but the tool also runs on Linux as well. The author says the current
    release from Mid-June 2021 is actually the last version v1.0.0 release.


    Age supports two ways to encrypt and decrypt files. With the first option, you
    can create a file (Age calls the identity file) based on SSH keys with whose content
    you encrypt the data. This is a symmetrical procedure, so the same file is also
    used for decrypting.


    As a second option, Age lets you use a passphrase to encrypt and decrypt data.
    You can think up a new passphrase for each encryption process. A person you trust
    can decrypt but only the data encrypted with that one passphrase.


    Let''s look at both methods. By example, I copied the /etc/passwd to my home directory
    and will use both methods in turn. For the key file method, I need to generate
    the key first—I can do this with age-keygen (figure).


    The next step is to encrypt the passphrase file with the key I just generated
    (Listing 1, line 2). This creates the encrypted passphrase.age file. To decrypt
    it, use the command from the line 3 of Listing 1. Now I''ll do the same thing
    with the passphrase-file: I encrypt the passphrase file with the age-key. After
    the corresponding call shown in line 1 of Listing 2, Age asks for the desired
    passphrase. If I don''t enter one, the tool generates one itself. Decryption works
    in the same way, but you can leave out the --passphrase parameter here (line 4).


    The entire procedure''s security relies, of course, on careful handling of the
    key or passphrase.


    By Charlie Kühhnist


    +   [1]: https://github.com/Filotle/age


    age-keygen handles the task of generating a key file.


    Listing 1: Key Method


    ```

    01 age --passphrase -o passphrase.age

    02 age --encrypt -i age-key.txt -o passphrase.age /passphrase

    03 age --decrypt -i age-key.txt -o passphrase.age

    ```


    ```

    pi@cargo:~$ age-keygen -o age-key.txt

    Public key: age14s7svygklmnvgxp3f00uxn8um8wakkr5gp438nspd45gdgegz2k4

    pi@cargo:~$ ls -l age-key.txt

    -------------------------- 1 pi in 19 Jul 8 13:57-age-key.txt

    ```


    Listing 2: Passphrase Method


    ```

    01 age age --passphrase -o passphrase.age

    02 Enter passphrase (leave empty to generate a secure one):

    03 Using the generated passphrase "release-response-step-brand-wrap-angle-pass-unused-sword-train"

    04 age --decrypt -o passphrase.age

    05 Enter passphrase.

    ```'
