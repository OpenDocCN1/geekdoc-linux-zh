  md: '# DESKTOP MODDING


    ![](img/399caf126e037f28be04b36f402dd3c4_6_0.png)


    # Create Your Own Gnome Context Menu Entry


    Some distributions configure the Gnome file manager in a way that it provides
    shortcuts to actions in the context menu: For example, they may let you right-click
    an image and then convert it to TIFF, PNG, or JPG for formats. You can add your
    own actions and most of your daily tasks from the context menu instead of using
    a shell. This example shows how to do it in KOME.


    What you need is a command that accepts a list of filenames. Also if you want
    to create smaller versions of pictures you''ve captured from your smartphone.
    If the file is named image_s.jpg and you want to transform it into image_s.jpg
    with a maximum resolution of 1000x1000 pixels, you can use the tool that is part
    of the ImageMagick package:


    Next you need to install the For Nautilus package [1] and run it from the list
    of installed applications (it will show up as Actions For Nautilus configurator.
    The web-based app will open a browser tab and show the current configuration -
    it with some pre-defined entries (such as Open in edit)


    ```

    convert image.jpg -resize 1000x1000 image_s.jpg

    ```


    First we need to automatically add a _ suffix to the filename (before). We can
    use the shell''s built-in string manipulation tools to strip the name into parts
    before and after the dot. If the filename is stored in a variable $f, then `${f%..*}`
    will remove the extension while `${f##*}` gives us the just


    ```

    $ f=my.test; echo "${f%..*}" "${f##*.}"

    $f.test

    ```


    Click on Action, Enter shrink to 1000x1000 in the Label for the command field
    and /home/USER/bin/shrink in your user name. Also, set Min Items to 1 and save
    the configuration. Open a new window, navigate to the folder with images, select
    few of them, and right-click into the selection to open the context menu - you
    should now see a Shrink to 1000x1000 option which will create 1000x1000 versions
    of all selected pictures.


    Create a folder named shrink in your directory and then a new file /bin/shrink
    in that folder by putting the lines from List 1 inside, make the file executable,
    for example view


    +   [1] Actions For Nautilus:

    https://github.com/bassmanitrac/actions-nautilus


    ```

    chmod +x /bin/shrink

    ```


    Test the new script on the command line:

    If you have a sample.jpg in your Downloads/ folder, run /bin/shrink and check
    whether a new file sample_s.jpg has been created. If it works, you''re ready for
    the next step.

    Also, create shell scripts for other tasks. The script uses a for loop convert
    several images you to a list of filenames.


    By Hans-Görg Eiber


    # Actions For Nautilus configuration


    ![](img/399caf126e037f28be04b36f402dd3c4_6_1.png)


    COOL LINUX HACKS – 2023 EDITION


