  md: "# HACK\n\n# SECURITY & PRIVACY\n\n# # Check Your Downloads\n\nWhen you download\
    \ Linux distribution images from the Internet, you will often get those files\
    \ from a mirror or from the official project's web server. This introduces some\
    \ risk as attackers might take over a mirror and exchange the image with a modified\
    \ version that contains a rootkit or other form of malware.\n\nOn the official\
    \ projects, you'll typically find one or more files whose checksum was based on\
    \ the official website/filename mappings.\n\n```\n73957b31c88932bc2cd8fb97e8bf9d1fc96a488dd1739d8f2df32b5copenSUSE-15-4_CR-D86_647f2-Build131.0-Media.iso\n\
    ```\n\nThe long string that is made of hexadecimal digits (numbers 0-9 and a to\
    \ f) is a large numerical value, a checksum calculated on the contents of the\
    \ file which was stored in the official website. When you download the ISO, you\
    \ can open a terminal window, cd into the download folder, and run the checksum\
    \ tool to verify the calculation. In openSUSE, the checksum generator uses the\
    \ cryptographical hash function SHA-256 (one):\n\n```\nsha256sum openSUSE-15-*.iso\n\
    ```\n\nto calculate the checksum of this ISO image - if you get the same value\
    \ that was stored in the official file, it's perfectly safe to assume that the\
    \ file was not tampered with (see figure).\n\nYou might find a checksum that was\
    \ created with a different tool; until years ago, md5sum (which calculates the\
    \ MD5 hash function) was the most popular choice, but it is obsolete because today's\
    \ machines are powerful enough to break its protection (i.e., modify a file that\
    \ has the same MD5 checksum).\n\n> By Hans-Geörg Geiger\n\n+   [1] https://en.wikipedia.org/wiki/SHA-2\n\
    \nWhat should it be (cat .sha256) and what is sha256sum (...) - this ISO is ok,\
    \ because the checksums match.\n\n# # Secure Your Notebook\n\n![](img/399caf126e037f28be04b36f402dd3c4_16_0.png)\n\
    \nIf you use Linux on servers and at least one of them is a notebook, you may\
    \ find yourself logging into remote computers via SSH. That typically requires\
    \ entering a password which is why many users use public-key authentication.\n\
    \nAfter creating an SSH key pair, copy the public key to the server's ~/.authorized_keys\
    \ file (leave it manually or fully with ssh-copy-id). This allows you to log in\
    \ without the password. The passphrase you make for the private key is then used\
    \ to encrypt the key on the source computer.\n\nMaximum comfort, the passphrase\
    \ is then left empty so that it is possible to simply issue a single command on\
    \ the machine without any interruption.\n\nIf you configure your notebook that\
    \ way you lose or someone steals your SSH keys and can no longer access all the\
    \ target machines without the entries for the compromised keys.\n\nHowever, it\
    \ is better to encrypt your keys with a passphrase instead of leaving them in\
    \ cleartext. Run ssh-keygen -p: the p option modifies the passphrase of existing\
    \ key (creating a new one). The tool will also work for the key (file) suggest\
    \ the default location - ~/.ssh/id_rsa, which is what you get if you did not specify\
    \ one at the time of key generation.\n\nIf you have several keys (pair, RSA and\
    \ DSA), the check of your ~/.ssh folder works on the correct key. Then, enter\
    \ a new passphrase (twice), and you'll be prompted for the new passphrase every\
    \ time you want to use the key to log to a remote machine. Run ssh-keygen -p and\
    \ just Enter when prompted for the new passphrase to change it. You'll need the\
    \ old passphrase last to remove it.\n\n> By Hans-Geörg Geiger\n\n![](img/399caf126e037f28be04b36f402dd3c4_16_1.png)\n\
    \n![](img/399caf126e037f28be04b36f402dd3c4_16_2.png)\n\n![](img/399caf126e037f28be04b36f402dd3c4_16_3.png)\n\
    \nCOOL LINUX HACKS - 2023 EDITION\n\nEnter passphrase (press Enter for no passphrase):\
    \ \nEnternew passphrase (press Enter for no passphrase): \nEnter passphrase again:\
    \ \n\nYour identification has been saved with the new passphrase.\nEnter passphrase\
    \ for key /home/user/.ssh/id_rsa: \nEnternew passphrase (press Enter for no passphrase):\
    \ \nEnternew passphrase (press Enter for no passphrase): \nEnter passphrase again:\
    \ \n\nYour identification has been saved with the new passphrase."
