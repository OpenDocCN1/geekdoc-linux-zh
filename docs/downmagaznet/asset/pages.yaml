  md: '# Cool Linux Hacks


    This Linux Magazine special edition promises you “Cool Linux Hacks,” and we’ll
    certainly deliver – check the table of contents on the following page for a list
    of all the gems we present inside. But what exactly is a “hack”?


    In today''s world Windows is the dominant desktop operating system, the decision
    to use Linux is the first and most important hack. In addition to that:


    +   * If I can use it to solve a problem or get some work done faster than before,
    then it''s a hack.


    +   * If the way it works is unexpected, it''s very certainly a hack.


    +   * If it teaches me a new and interesting way to use my Linux machine, it''s
    a hack.


    +   * When it makes me grind because it''s so obvious that only a geeky Unix person
    would ever think of doing this way, I add it to my list of anecdotes (and yes,
    it''s a hack).


    The definition of a hack is a matter of taste and so is our choice of hacks for
    this collection: Many authors have contributed, and together we have assembled
    a mix of new tools, powerful replacements for classic tools, and interesting cases
    for software that you''ve used differently before. We''ve organized our hacks
    into 10 categories that you''ll find them when you go back to search for them.


    For our “Gaming” category we''ve selected some cool Linux games that you can run
    when you need a break; we also show how to run the huge collection of classical
    DOS games in DOSemu. While so most of our hacks can improve your productivity
    or solve technical problems, it''s nice to have some fun without booting into
    another operating system. If we''ve done our job right, there''s even more fun
    to be had when you try our other hacks. We hope you do!


    Hans-Georg Eßer

    Editor-in-Chief


    ![](img/399caf126e037f28be04b36f402dd3c4_2_0.png)


    # 2023 Edition

    All hacks tested on

    Ubuntu 23.04!'
