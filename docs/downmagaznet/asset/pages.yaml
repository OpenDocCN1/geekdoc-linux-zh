  md: '# SECURITY & PRIVACY


    ![](img/399caf126e037f28be04b36f402dd3c4_19_0.png)


    # Detect Hidden Processes


    Linux systems can be compromised by the installation of hidden processes visible
    only from the kernel. Unhide is a generic name for series of related commands
    designed to detect such processes through a toolkit of over 30 tests, most involving
    examining and various elements of the system. Of all the versions, the one for
    Linux is the far most developed. Originally, the Linux version called unhide,
    in bin repositories, is generally used only. The unhide command works by scanning
    inconsistencies within the parts of a Linux operating system that are dealing.
    Many elements compare proc, the source of static information displayed by the
    running system, and /bin/ps, which contains processes currently running on the
    system. Others compare bin/ps with links between the kernel and proc, which contains
    data about processes. Another compares the structures of process IDs. Other sources
    of information operate independently of each other, so differences between them
    reveal an illegal intrusion. Most of them are not used by ordinary users, and
    root should generally view them. Consistency checks provide a safe glimpse into
    what future steps to take that can help in detecting them.


    set of related elementary tests). A standard test lasts longer, but gives a more
    thorough investigation of the system. (Figure 2) for running any test is:


    unhide TEST OPTIONS


    # The Standard Tests


    The elementary tests offered by unhide''s man are grouped into seven standard
    tests:


    +   - Brute-Fororce or runs all techniques. This process can take 5-10 minutes,
    even on a recent computer, but it is extremely thorough.

    - Comes: Compare proc/proc with the output of /bin/ps.

    - profs: Compare information gathered from /bin/ps with that gathered by proc.

    - proall: Combine the proc and procs techniques.

    - quick: Compare the proc, profs, and sys techniques, and is 20 times faster than
    the running search. It may give false positives if the system is rooted. However,
    a positive result is answer, test to be confirm.

    - Reverse: Check that all threads are also seen in proc and sys calls. Its purpose
    is to verify if a rootkit has not disabled a security tool and forced ps to show
    a false process.

    - Sys: /bin/ps with system calls.


    Figure 1: A view of the elementary tests offered by unhide. See the man page for
    a complete list.


    # Elementary Tests


    The first test unhide consists of breeding all the process IDs. This test is only
    available with version unhide-linux.


    The checkproc consists of comparing information gathered from /bin/ps with the
    result of calling child(1) with the -m option


    The checkprofs consists of comparing information gathered from /bin/ps with the
    result of the call to getproc(). This test is only available with version unhide-linux.


    The checkuid consists of comparing information gathered from /bin/ps with the
    result of the call to getuid(). This test is only available with version unhide-linux.


    The checkgetpid consists of comparing information gathered from /bin/ps with the
    result of the call to the getpid(). This test is only available with version unhide-linux.


    Figure 2: All unhide tests have a similar structure. In this case, the standard
    test identified by poses.


    You will unhide a standard package in the repositories of most distributions,
    and it will fail if it is not part of another security utility.


    Running the bare command gives a list of elementary tests, which are individual
    tests; you will find them listed in the main page (Figure 1). Running elementary
    tests can give fast results, but unless you have a specific reason, you will probably
    choose to run a standard test the


    ```

    root@~linux: # check

    unhide-linux 2.3 or

    ```


    NOTE : Not this version of unhide is for using Linux >> 2.6


    used options:


    [*]Searching for hidden processes through comparison of system calls, proc, dir
    and mem


    20


