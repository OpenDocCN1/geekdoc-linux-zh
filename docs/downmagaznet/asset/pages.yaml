    The start-up window opens with the filter options.

    On the right, you can specify the desired Internet protocol and transport protocols
    by enabling the appropriate radio buttons. In both cases, available versions are
    enabled by default (e.g., IPv4 and IPv6, as well as TCP and UDP). On the right
    fact, select the protocol from more than a dozens options in a drop-down list.
    After, Sniff takes all protocols into account except those you set.


    On the left of the window, you will find the network interfaces available on the
    system. Sniffnet lists both the physical and virtual interfaces; Sniffnet always
    defaults to the physical interface. Configure to the desired interface if this
    doesn''t meet your needs. After configuring the basic settings, click the rocket
    icon.


    Sniffnet takes moments to acquire data and then shows the actual monitoring window.
    At the top, you will constantly see updated graphical displaying the traffic rate
    in bytes per second. This display uses colors to differentiate between incoming
    and outgoing packets. In a small box to the left display, you will find some statistical
    data about the network connection, number of filtered packets and their size in
    megabytes.


    In the lower part you will see a list of all hosts to which your machine has been
    connected since you started monitoring, and the list is sorted by traffic. The
    color codes which represent what value are, too. If you want to see details about
    a specific host, simply click it. That will bring you to the individual packet
    information about the used protocols. The current Sniffnet version 2.1.1 has problems
    with IPv6 addresses: it doesn''t expect them, and the columns which display these
    addresses are too narrow which-


    turbs the alignment with the column headings.

    You can sort the packet list by three criteria: most-recent (default), most bytes
    and most packets. When you click the document icon to the right of the list, Sniffnet
    opens the report file (~/.config/sniffnet/report.txt) in the default editor. It
    contains the full log, not just for the currently seen host, which is a usability
    bug. Sniffnet will continue to write to file until you end the current monitoring
    session, but the editor will not save the file.


    Conclusions

    If you want to see what''s happening with your network, the self-explanatory Sniffnet
    provides a simple solution for all levels of users. The tool lacks analysis capabilities;
