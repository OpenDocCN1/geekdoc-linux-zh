    # What File Format Is That?


    File managers like Dolphin and Nautilus look at the file extension to decide what
    kind of file they are dealing with, and more importantly, application to open
    it. But there''s a different way of finding file type, and it uses actual magic.


    Well, not the magic of witches and wizards, but the command line tool follows
    a set of recipes for "magic" file (which are stored in magic file); the magic
    file to check specific bytes in a file to recognize the type with high probability.
    By a simple example, the first six bytes of a PNG image are always 0x89, ''P'',
    ''N'', ''G'', 0x0D, and 0x0A:


    ```

    # hexdump -c test.png

    00000000 89 50 4e 47 0d 0a 0a |PNG..

    ```


    So, if you find a file with these bytes, it is safe to assume it is a PNG file.
    The file tool uses these kinds, but can do more. For many types it knows where
    to find interesting metadata. Here''s a typical output of file when you run it
    on a PNG:


