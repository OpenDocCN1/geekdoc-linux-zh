    17:59:20 INFO Accept HTTP connections

    17:59:20 INFO Do you want to use user sessions?

    17:59:20 INFO Set target hosts in the config file.

    17:59:20 INFO Generated configuration

    ```


    ```

    warp user

    alldow

    --warpgate: admin

    ```


