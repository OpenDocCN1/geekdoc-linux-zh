    # Get Information about ISO Images


    Mounting an ISO image is simple enough, but sometimes that''s not necessary when
    you want to look at an image''s metadata: What is in that image, who made it,
    and what are the properties? You can use iso to query information.


    The command-line tool has a list of options. Another option is -i, you use to
    select the image file.


    With isoinfo you can extract information from images without mounting.


    you add more options to ask for specific information, for example -d displays
    the image''s metadata, and -l will show a file list with attributes. Linux images
    will have Rockridge extensions for long filenames with uppercase/lowercase characters
    and File attributes which include owner, group, and permissions so, -r to try
    to reset them.


    For automation purposes it is better to produce an output that''s generated by
    -f. The output shows all files with their full path. Make sure -fr for Rockridge
    extensions, and you can quickly search for files in several images. Use your Ubuntu
    ISO images to search all images using the following command:


    ```

    for image in ubuntu-iso*; do isoinfo -fR -i "$image" 2>/dev/null | grep "make_4.3.1.ubuntu_04_amd64.deb"

    done

    ```


    It displays the ISO filename name and if it contains the file - the path to the
    file inside that image.


    By Hans-Geer Ebert


