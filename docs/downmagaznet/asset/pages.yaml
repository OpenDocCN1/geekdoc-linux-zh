  md: '# FILE FORMATS


    # Search Office Files with grep


    If you like to work on the command line, you may be aware of the grep tool, which
    lets you search for content in files. You can use simple search patterns (such
    as words or numbers), to make the tool ignore case andor you can use regular expressions,
    which are so powerful that whole books have been written about them. For example,
    the regular expression


    ```

    ```\^[0-9]{1,3}-[a-z]+\$```

    ```


    will match lines with this pattern:


    ```

    ```12-abc-12

    9-zzxx-9

    13-aaaa-13```

    ```


    That is, the line starts with a number that has between one and three digits,
    followed by a hyphen, then another string of lowercase letters (at least one),
    another hyphen, and then repeats the number from the beginning. The regular expression
    handles the backwards reference by declaring a group with the round brackets and
    referencing it with \1. If there are more groups, then it could be referenced
    with \2, \3, and so on.

    If you are unfamiliar with regular expressions, O''Reilly a good introduction
    on their website [1].


    # Problem with Binaries


    While grep lets you search in files, many applications create binary files that
    cannot be "grepped". For example, LibreOffice stores your documents in ZIP archives.
    Even though they have file extensions such as .odt (text), .ods (spreadsheet),


    ![](img/399caf126e037f28be04b36f402dd3c4_69_0.png)


    or .ppt (presentation), all of these files are just ZIP archives. You can rename
    this type of file to document.zip and open it with the default program – you will
    find that some archive managers start and display a folder structure.


    Figure 1 shows what you can find inside LibreOffice (.odt). The most important
    file in the ZIP archive is content.xml. The example "Heading 1" that was assigned
    the Heading 1 tag paragraph in Writer is internally stored as text (without the
    line:


    ```

    ```<text name="Heading_20_1">

    <outline-level="1">

    Example Heading 1

    </text>

    ```

    ```


    and the following paragraph is stored in a similar way:


    ```

    ```<text name="P">

    This is a sample document to show the structure of LibreOffice document files.
    This is a sample document to show the structure of LibreOffice document files.

    </text>

    ```

    ```


    Because XML files are also text, they can be searched with grep. It is a lot of
    effort to rename your office files, extract the content, and access it every time
    you search for something.


    # Universal grep


    I''ve written a tool thatates the process: grep ("universal grep"). It can search
    LibreOffice and Microsoft Office files, PDFs, and normal text files. You can download
    it from GitHub [2], but you will also need a few helper programs:


    +   * xllint can parse and format XML files, which is necessary for LibreOffice
    files they tend to contain long lines – when you expect to see just a bit of context
    instead almost all of the document''s contents

    * pdfgrep is a separate tool that inspects PDF files. Gre uses it to search for
    something inside PDF, and office files with one occasion.

    * xllint and pdfgrep tools are not installed by default; on Ubuntu to


