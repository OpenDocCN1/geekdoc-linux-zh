    At this point, the repository should be up and running.


    To quickly review the steps for installing CVS:


    +   1. Install the CVS application (RPM or source code)

    2. Create CVS user and group

    3. Create CVS repositories

    4. Change the owner and group of the repositories

    5. Add users to $CVSROOT/$CVSROOT/passwd

    6. Change file permissions on the password file

    7. Edit /etc/services to ensure cvpserver is present

    8. Configure /etc/xinetd.d to acknowledge CVS requests

    9. Restart xinetd


    # 6.3.2 Importing a Project into the Repository


    Once you have CVS installed and configured, the next step is to import a project
    into the repository. This creates a directory for the project, copies the files
    into the repository and sets up the information that will be used to track the
    project as it gets modified during the development process.

    Assuming that the directory /home/lcp/fuzion holds the source code and the files
    of the project, the project you need to import to that directory and use the CVS
    import command.

    The options for the import command include the name of the project, the vendor
    tag, and the release tag(s). The vendor tag is not currently used by CVS, and
    can contain any information that you care to put in. The release tag can be used
    to designate specific releases, but the source code can also be checked out by
    the numeric designation. Any information that you care to put in these fields,
    must be used with the import command.


    ```

    # cd /home/lcp/fuzion

    # cvs import Fuzion OSS_Software release_0_1

    ```'
