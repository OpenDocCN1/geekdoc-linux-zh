    # 2.3 Jed


    Jed was designed as a small, lightweight editor. It has many of the functions
    required by application programmers and can be set up with one of several different
    key bindings to aid people transitioning from other editors.


    The main Jed configuration file is in JEDROOT/lib/jed.rc (/usr/share/jed/lib/jed.rc
    if the RedHat RPM was used to install the application). This file contains the
    default values for all users, but is only read if the user does not have a local
    configuration file present in the home directory.'
