  md: "# 3.3.7.3 Compiling Java Code\n\nInformation about the GCC compiler gcj is\
    \ available at http://gcc.gnu.org/java/. Before you can build Java programs, you\
    \ also need to have libgccj installed. With old compilers, you had to install\
    \ it separately from source code. When you build and install new versions of GCC,\
    \ libgccj is installed automatically. If you are still using an old compiler and\
    \ want to have libgccj installed, information is available at http://gcc.gnu.org/java/libgccj.html.\
    \ Briefly the process is as follows:\n\nDownload libgccj from ftp://sourceware.cygnus.org/pub/java/\
    \ or another web site on the Internet. Untar it in /opt directory and a new directory\
    \ will be created under /opt which will contain source code for libgccj. Create\
    \ a directory /opt/libgccj-build and move into this directory. After that you\
    \ have to perform the following sequence of commands:\n\n+   - /libgccj/configure\n\
    - make\n- make install\n\nNote that your new compiler must be in PATH before you\
    \ build libgccj.\n\nNow let us use to compile a Java program. Consider the simple\
    \ Java program that prints the message \"Hello World\". The source code filename\
    \ is hello.java.\n\n```\nclass HelloWorld {\n    public static void main(String\
    \ args[]) {\n        System.out.print(\"Hello World \");\n    }\n}\n```\n\nTraditionally\
    \ you have to invoke the javac program to build a byte code. After that you have\
    \ to run the code using the java program on Linux. However if you use gccj, you\
    \ can create a binary output file gccj-main=HelloWorld -o hello hello.java using\
    \ the following command:\n\n```\ngccj-main=HelloWorld -o hello hello.java\n```\n\
    \nThe output file is hello, which is an executable binary. The -main switch is\
    \ used for the entry point when the program is executed.\nThe compiler uses some\
    \ information to build Java code. This information includes reading the gccj specification\
    \ file and libraries. The following command displays this information:\n\n```\n\
    [rr@conformix4] gccj -v\nReading specs from /opt/gcc-3.0.4/lib/gcc-lib/i686-pc-linux-gnu/3.0.4/specs\n\
    Reading specs from /opt/gcc-3.0.4/lib/gcc-lib/i686-pc-linux-gnu/3.0.4/.../libgccj.spec\n\
    rename spec to liborig\nrename spec startfile to startfileorig\n```"
