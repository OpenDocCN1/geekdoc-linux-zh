    # 4.2.4 Explicit Rules


    There are two types of rules: explicit and implicit rules. All of the rules that
    we have been using in this chapter until now are explicit rules. An explicit rule
    has three parts: dependencies and commands. Explicit rules are defined in detail
    and they perform exactly as they are written. In general, all rules in amakefile
    are explicit rules.


    # 4.2.5 Implicit Rules


    Implicit rules are used by make to build certain targets by itself. These rules
    are usually language-specific and operate depending upon file extension. For example,
    make can build from .c files using an implicit rule for C language compilation.
    Consider the basic make-file we used in this chapter as shown below:


    ```

    # Variable definition

    OBJS = ftp.o common.a

    HDRS = ftp.h common.h

    CFLAGS = -g -O2

    TARGETS = ftp

    CC = gcc

    ```


    ```

    # Default Target

    ftp: $(OBJS) $(HDRS)

    $(CC) $(OBJS) -o ftp

    ```


    ```

    ftp.o: ftp.c $(HDRS)

    $(CC) $(CFLAGS) -c ftp

    ```


    ```

    common.o: common.c common.h

    $(CC) $(CFLAGS) -c common.o

    ```


    ```

    clean:

    rm -f $(TARGETS) $(OBJS)

    ```'
