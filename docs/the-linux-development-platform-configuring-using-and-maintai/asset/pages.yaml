    Breakpoint 1 at 0x0804866: file sumopt.c, line 10.

    (gdb) run

    Starting program: /home/rr/5/sumopt


    Breakpoint 1, main () at sumopt.c:10

    10 printf("nt sum is : %d\n", total);

    (gdb) n


    The sum is : 10

    11 )

    (gdb) n


    Program exited with code 021.

    (gdb)

    ```


    This is quite different from what you have expected. The first difference is setting

    up the break point. We used the same command to set up the break point but now
    gdb set it up at

    line number 10 instead of line number 6 as it had done before. When we started
    execution of the

    program, it jumped to line number 10 and did not go to any line before. This is
    because

    when we optimized code at compile time, the compiler was smart enough to know
    that all

    values are static so there is no need to assign two static variables to numbers
    at the run time

    and calculate their sum. All of this can be done at the compile time, which results
    in shorter code

    and better execution time.


    The bottom line is that if you find that gdb is not executing some lines when
    you debug

    a program, it may be due to the optimization level used when compiling a program.
    A fun

    trick might be to look at the variable values during such a debug session as well,
    but it''s not

    necessary!'
