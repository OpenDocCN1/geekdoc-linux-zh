- img_proc: true
  md: '# 4.1.5 Shell to Execute Commands


    All commands in a makefile are executed in a subshell invoked by the make command.
    It is important to know which shell will be used to execute commands using the
    makefile. By default the shell name is sh. However this can be changed using the
    SHELL variable in the makefile. Please note that this is not the environment variable
    SHELL, but is within the makefile. This to avoid conflict with someone''s personal
    preference of using a particular shell.


    Each line that starts with TAB character represents a command and is executed
    by a single instance of shell. So, for example, the following line will cause
    a directory change to tftp and the command rm -o to be executed from that directory.
    After executing this command, the next command is executed in the original directory
    because a new subshell is invoked and the effect of the cd tftp command is gone.


    ```

    tftp:Makefile

    cd tftp; rm *.o

    echo "Rebuilding ..."

    ```


    As mentioned earlier, one line can be split into multiple lines by placing a backslash
    at the end of the line. The above three lines can be written as follows without
    any change in the result:


    ```

    tftp:Makefile

    cd tftp:

    rm **

    echo "Makefile changed. Rebuilding ..."

    ```


    # 4.1.6 Include Files


    In large projects, makefiles can be split into many lines. These smaller files
    can be included into a makefile: when the make utility is scanning through the
    makefile and it finds an include file, it will go through the include file before
    going to the next line in the makefile. Logically, you can think of contents of
    the include file being inserted into the makefile at the place where the file
    is included.


    Files can be included using the include directive inside a makefile. The following
    line includes a file myrules.in in a makefile:


    ```

    include myrules.in

    ```


    Multiple files can be included into a makefile on the same line. The following
    line includes two files myrules.in and bootarules.in into a makefile:


    ```

    include myrules.in include bootarules.in

    ```


    When multiple files are included, these are read in the order they are present
    in the makefile. In the above example, first myrules.in will be read by the make
    utility and then bootarules.in will be read.'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'You can also use wildcards and variables to specify file names with the include
    directives.

    The following include directive includes all files with last part as ".in" and
    files specified by the variable MKINCS.


    ```

    include *.in $(MKINCS)

    ```


    # 4.2 The make Rules


    Rules are the most important part of a makefile. Rules control how a project should
    be built. Each rule has a common structure which is discussed in this section.
    A typical makefile is introduced as an example to show how rules are written in
    makefiles.


    # 4.2.1 Anatomy of a Rule


    As mentioned earlier, a typical rule looks like the following:


    ```

    Target: Dependencies

    Commands

    ```


    A target is the objective of the rule that depends upon a list of dependencies.
    Commands are used to build the target. The target name is followed by a colon:
    a TAB character.


    > CAUTION Each line containing commands starts with a TAB character. The TAB character
    distinguishes command lines from other lines. A common error is to replace the
    TAB character with a multiple space character. The result is that commands on
    this line are not executed.


    # Multiple Commands in the Same Line


    A rule can have multiple commands to build target. These commands can be listed
    in multiple lines or in a single line. If commands are listed in a single line,
    they are separated by a semicolon. It should be noted that the difference is whether
    or not they are executed in the same subshell. Commands listed in one line are
    executed in the same subshell. If each command is listed in a separate line, each
    line starts with a TAB character in the start of the line. The following rule,
    used to remove some files from the current directory, has two commands. The first
    is echo and the second is the rm command.


    ```

    clean:

    @echo "Deleting files ..."

    rm -f $(OBJS) ~

    ```


    These commands can also be listed as follows:


    ```

    clean:

    @echo "Deleting files ..."; rm -f $(OBJS) ~

    ```'
