    In order to begin work on a project contained in a CVS repository, you must first
    check the package out. This brings your working directory up-to-date (creating
    it if necessary) and creates a CVS directory in your working directory where CVS
    keeps information about the project locally.


    To check a project that is in the repository, simply use the cvs command with
    the checkout option and the name of the project. For example, to check out the
    Fuzion project that was imported into the repository early, type:


    ```

