  md: "# Command Echoing\n\nBy default all commands in the makefile are echoed to\
    \ standard output as these are executed. This provides information about the activity\
    \ of make as it is going through the makefile. However you can suppress the command\
    \ echo by starting commands with the character @. This is especially useful in\
    \ printing information from within the makefile using the echo command. For example,\
    \ you can create a makefile that prints information before it executes. A typical\
    \ rule in the makefile displays information about the object before executing\
    \ any other command follows. It displays a line showing that make is going to\
    \ build FTP:\n\n```\nftp: $(SRCS) $(HDRS)\n  @echo \"Building FTP\"\n  @$(CC)\
    \ $(CFLAGS) $(INCLUDES) ftp.c\n  @$(CC) $(COMMON) $(OBJS) -lcommon -o ftp\n```\n\
    \nWhen make reads this file, it displays the following output:\n\n```\n[root@conformix\
    \ ftp-dir]# make ftp\nBuilding FTP\n[root@conformix ftp-dir]#\n```\n\nIf you don't\
    \ insert the command in this file, the result will be as follows. You can find\
    \ the difference between this and the earlier output of the make command.\n\n\
    ```\n[root@conformix ftp-dir]# make ftp\necho \"Building FTP\"\nBuilding FTP\n\
    gcc -g -O2 -c -I..//common-dir ftp.c\ngcc -static -L..//common-dir ftp.o -lcommon\
    \ -o ftp\n[root@conformix ftp-dir]#\n```\n\n> NOTE There are other ways to suppress\
    \ the command echo. One of these is the use of -s or -silent flag on the command\
    \ line. However the most common method is the use of the @ character.\n\n# Rules\
    \ with no Dependencies\n\nMany rules are used with no dependencies. These rules\
    \ are used to execute commands without looking into any dependencies. Commands\
    \ in these rules are guaranteed to be executed.\n\n# 4.2.2 A Basic Makefile\n\n\
    Let us start with a simple makefile shown below. This makefile is used to build\
    \ ftp. which is the default target."
