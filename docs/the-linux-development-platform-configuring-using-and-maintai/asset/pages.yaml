  md: '# Miscellaneous Tools


    In addition to the standard development tools used in software development projects,
    many other utilities are also helpful. Most of the time these utilities are not
    directly related to the software development process but are used as helping aids.
    This chapter provides an introduction to some of these utilities that are extremely
    helpful in the software development process. Some of the more common uses of these
    utilities are presented and readers are encouraged to experiment with them. If
    properly utilized, they may save time and increase productivity.


    The indent utility is helpful in implementing a common programming style scheme
    to all source code files in a project. The sed utility is useful for searching
    and replacing text across multiple files. The diff command is used to display
    difference between two or more files. The cscope and cbrowser are used to locate
    symbols in a software source code tree. The trace and ltrace utilities are useful
    to find out system and library calls when a program is executed. GNU binary utilities
    are a set of utilities that is often used for different needs. Information about
    GNU utilities is presented in this chapter as well.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# 7.1 Using indent Utility


    One major objective of every software development project is that the code be
    well organized, structured and easy to understand for other members of the team.
    Proper indentation plays an important role in achieving these objectives. Most
    of the editors used in software development do automatic indentation if they are
    configured to do so. The Emacs editor is the best example as it understands different
    programming languages and does indentation according to language and style. However
    you can come across code written by others that is poorly indented and you may
    like to re-indent it according to your requirements or preferences. In large software
    development projects you may need to enforce a particular coding style, but be
    assured that not will follow it. The indent program is your tool to handle the
    situation and reformat all files in the project according to the style adopted
    for the project. You can do it by creating a script that goes into each directory
    of project and reformats all files. In this section we shall explain some of its
    features and how to utilize it.


    By default, the indent program uses the GNU style of coding and applies these
    rules to input files. It creates a backup file with original contents of the file.
    The reformatted file is created with the same name. The backup file ends with
    a tilde ~. Note that the same scheme of creating backup files is used by the Emacs
    editor.


    Let us see how indent works. We will take a poorly indented file and apply the
    indent program to it. Following is a listing of the poorly indented hello.c.


    ```

    1 **********************************

    2 * hello.c

    3 *

    4 * This file is used to demonstrate use

    5 * of indent utility

    6 *********************************/

    7 #include <stdio.h>

    8

    9 main {

    10 char string[25];

    11 printf("Enter a string of characters : ");

    12 scanf("%s", string);

    13 printf("The entered string is %s\n", string);

    14 }

    ```


    Line numbers are added to the listing using the -cat hello.c" command to explain
    changes. They are not part of the hello.c file. To properly indent the hello.c
    file, the following command is executed:


    indent hello.c


    The resulting hello.c file is shown below. Note how the indent program has modified
    the file. Lines 10 to 14 are indented to two characters (depending upon default
    settings).'
  merge: -1
  pgno: 227
