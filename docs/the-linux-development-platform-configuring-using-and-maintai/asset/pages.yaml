  md: 'with a list of matching functions from which to choose. When you type in the
    appropriate number from the left-hand column, that function will be opened in
    the buffer.


    # 2.4.4 Folding Code


    VIM can use several methods for folding code. The most useful of these for application
    programming is the indent method. The variable fold determines how the folding
    will take place. To indent set the mode by typing:


    ```

    :set foldmethod=indent

    ```


    This command can also be set as a default by entering it in the ~/.vimrc configuration
    file. When this option is unset in a section, and a file is opened, VIM will parse
    the file looking for initial tab sequences in order to determine the various indent
    levels and fold the file automatically. In order to open or unfold a section,
    use zo to close or refold a section, use z.


    The commands zm and z can also be used to increase and decrease the amount of
    folding currently being done. By issuing the zm command, the amount of folding
    being done is reduced by one shiftwidth level. That is to say, one level of tabbing
    is revealed in the code. The zm command reverses this and folds up one level of
    indentation every time that it is used.


