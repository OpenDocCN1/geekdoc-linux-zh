    # 7.7.2 Using the ranlib Utility


    The ranlib command is used to create index entries inside an archive file. This
    can also be done using -s command with the ar while creating or updating an library
    file. The following command creates index inside libcommon.a file. Note that these
    index entries are stored inside the archive file and no other file is created.


    ```

    ranlib libcommon.a

    ```


    Most of the time you don''t need to run ranlib, as the latest version of the ar
    command creates an index by itself. Index entries can be displayed using the nm
    command.


    # 7.7.3 Using the nm Utility


    The nm utility is used to list symbols used in an object file. If no object file
    is provided on the command line, the utility assumes the a.out file in the current
    directory as the default object file and lists its symbols. A common use of the
    utility is listing functions defined in a library. The following command displays
    file names and functions defined in the library created with ar in the previous
    section.


    ```

    [root@boota]# nm -s libcommon.a

    ```


    Archive index:

    msg in common.o

    main in ftp.o'
