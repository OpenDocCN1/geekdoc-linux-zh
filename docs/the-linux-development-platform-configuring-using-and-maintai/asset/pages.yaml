  md: '# 3.2 Installing GNU Compiler


    In most cases, GCC comes with all Linux distributions. However you can download
    the latest version, and build and install it according to your requirements. You
    may also need to build your compiler if you are building a cross-compiling development
    system. The best way to build a new version of the compiler if the compiler is
    to have some pre-installed and pre-configured Linux distribution on your system
    that will be used to build the new compiler. For the purpose of writing this book,
    we used Red Hat 7.1 but the process is the same on any distribution of Linux.


    The installation process is done in multiple steps. After downloading, you have
    to untar the source code and build it in a directory. This directory should be
    separate from the source directory tree. The building process includes configuration
    / compilation stages. Once you have successfully created the new compiler, you
    can install it in a directory of your choice. It is advised to keep this installation
    directory separate from the location where the original compiler is installed.


    # 3.2.1 Downloading


    You can download the latest version of GCC from ftp://www.gnu.org/gcc/ . I downloaded
    GCC 3.0.4 and it is about 17.5 MB. You can also find a mirror site near you get
    to GCC. A list of mirror sites is available on http://www.gnu.org/order/ftp.html.


    # 3.2.2 Building and Installing GCC


    The GCC installation process can be divided into four steps for simplicity and
    understanding.


    +   1. Download and extract

    2. Configure

    3. Build

    4. Install


    # 3.2.2.1 Download and Extract


    First create a directory where you will unpack the source code. Use the tar command
    to unpack the code. For our purpose, I have created a directory /gcc3 to compile
    and build the GCC compiler. The untar process looks like the following and it
    creates a directory gcc-3.0.4 under /gcc3.


    ```

    [root@~/gcc3] # tar xvvf gcc-3.0.4.tar.gz

    gcc-3.0.4/

    gcc-3.0.4/INSTALL/

    gcc-3.0.4/INSTALL/index.html

    gcc-3.0.4/INSTALL/README

    gcc-3.0.4/INSTALL/specific.html

    gcc-3.0.4/INSTALL/download.html

    gcc-3.0.4/INSTALL/configure.html

    ```'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Installing GNU Compiler


    ```

    gcc-3.0.4/INSTALL/build.html

    gcc-3.0.4/INSTALL/test.html

    gcc-3.0.4/INSTALL/finalinstall.html

    gcc-3.0.4/INSTALL/binaries.html

    gcc-3.0.4/INSTALL/gfdl.html

    gcc-3.0.4/.cvsignore

    gcc-3.0.4/COPYING

    gcc-3.0.4/COPYING_LIB

    gcc-3.0.4/ChangeLog

    gcc-3.0.4/MAINTAINERS

    gcc-3.0.4/Makefile.in

    gcc-3.0.4/README

    ```


    This is a partial output of the command. Most of the output is truncated to save
    space.


    # 3.2.2.2 Running configure Script


    After uncompressing the source code, the first thing is to run the configure script.
    This script is found in /gcc3/gcc-3.0.4 directory. You can specify three major
    things when you run the configure script.


    +   1. Build machine. This is the machine where you compile and build the compiler.

    2. Host machine. This is the machine where compiler will be installed. This is
    usually the same as the build machine.

    3. Target machine. This is the machine for which the newly built compiler will
    generate executable code. If you are building a native compiler, this is the same
    as the host machine. If you are building a cross-compiler, this machine will be
    different than the host machine.


    Each of these machines are named in the following format:


    . CPUname-CompanyName-SystemName


    For example, if you want to build a compiler that will run on a sparc processor
    made by Sun Microsystems and on SunOS 4.1 operating system, the command line for
    configure script will be as follows:


    ```

    /configure --host=sparc-sun-sunos4.1

    ```


    Please see a list of supported systems at http://gcc.gnu.org/linedocs/gcc-3.0.4/gcc_4.html.


    For a native compiler (a compiler that runs on the same machine where it is built
    and generates code for the same machine), you don''t need to specify any options
    on the command line when you run the configure script. However, if you are building
    a cross-compiler, you must specify the target machine. Similarly, if you are building
    a compiler that will be installed on some other machine, you have to specify the
