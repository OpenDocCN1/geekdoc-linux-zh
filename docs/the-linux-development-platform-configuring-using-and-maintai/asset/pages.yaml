  md: "# 4.3.1 Defining Variables\n\nVariables can be defined in a usual way by typing\
    \ in the variable name, followed by an equal sign. The equal sign is followed\
    \ by the value that is assigned to the variable. Note that there may be space\
    \ characters on one or both sides of the equal sign. A typical variable assignment\
    \ be as follows:\n\n```\nCFLAGS = -g -02\n```\n\nAnother example of defining the\
    \ C compiler name is as follows:\n\n```\nCC = gcc\n```\n\nThis variable can be\
    \ used in other parts of the makefile by placing a $ and a pair of parenthesis\
    \ or braces. The following line in a makefile is used to compile a file tftp.c\
    \ and create an object file tftp.o with the help of two variables:\n\n```\n$(CC)\
    \ $(CFLAGS) -o tftp.o tftp.c\n```\n\nThis line can also be written as:\n\n```\n\
    $(CC) $(CFLAGS) -o tftp.o tftp.c\n```\n\n> NOTE Variables are case sensitive in\
    \ makefiles. A variable (OUTFILES) is different from a variable $ (OutFiles).\n\
    \n# 4.3.2 Types of Variables\n\nThere are two types of variables. Variables defined\
    \ using the = sign are recursively expanded variables. This means that a variable\
    \ may be expanded depending upon value of a variable at a later stage in the makefile.\
    \ Consider the following lines in a makefile:\n\n```\nOBJ1 = tftp.o\nOBJ2 = common.o\n\
    OBJS = $(OBJ1) $(OBJ2)\nprintobjects:\n  @echo $(OBJS)\nOBJ1 = tftp.o tftp.o\n\
    ```\n\nVariable OBJS will contain a list of three files, tftp.o, tftp.o and common.o,\
    \ although tftp.o was added after the echo command. Output of this makefile is\
    \ as follows:\n\n```\n[root@conformix make]#\nftftp.o tftp.o common.o\n[root@conformix\
    \ make]#\n```\n\nThis is because make used the default target rule and executed\
    \ the echo command. Before printing out the value of the OBJS variable, it scanned\
    \ the makefile to the end to re-evaluate the value of the OBJ1 variable and hence\
    \ the OBJS variable.\nTheOther types of variables are simply expanded variables\
    \ and the value of these variables is determined at the time of their definition.\
    \ These variables are defined using the := symbol"
