    Figure 8-1 Flow chart of cross-platform development.


    During the development phase, most of the time you compile code with debug information
    enabled. The size of the output files is usually quite large but this is acceptable.
    A different approach is to create multiple files, one built without debug information
    or stripped and at least one file containing all symbols information. You can
    load the latter into the debugger before connecting the debugger to the executable.


    # 8.1.4.3 Transfer to the Target Machine


    After building executable code for a cross-platform development project, you have
    to transfer it to the target machine. There are several ways to do so depending
    upon the target machine. If the machine has a JTAG interface, you can use that
    interface to transfer the file'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# What are Embedded Systems?


    and then use the same interface to debug it. If the target does not have a JTAG
    interface, you can transfer using a serial or Ethernet link. Sometimes the target
    machine is already running an operating system and you have to transfer an application
    to the target machine. In some other circumstances you may have to build and transfer
    a single packaged file that contains the operating system as applications. If
    the target system is already running the operating system, you can transfer application
    using a network interface very easily. If you have a single packaged file, you
    can have a boot routine on the target machine that may download this file from
    TFTP server.


    The bottom line is that there are many methods used by developers depending upon
    the nature of the files to be transferred, availability of special hardware on
    the target machine, availability of boot routines on the target machine and the
    operating system used. You can select a method that best suits your needs.


    # 8.1.4.4 Remote Debugging


    In the case of cross-platform development and embedded systems, you have to debug
    your code remotely. There are multiple reasons for that including:


    +   - The target machine is different from the host machine so that you can''t
    execute the code on your host machine.


    +   - The target system is connected to some special hardware and the software
    interacts with that special hardware. To debug in a real-world situation, you
    have to debug it remotely.


    +   - The target system itself has special hardware that is different from the
    host machine. For example, the target system may have the same CPU as the host
    machine but has different hardware interrupts.


    There may be other reasons in addition to the ones mentioned here. In this chapter
    you will learn how to attach to a process running on a target machine using GNU
    debugger. You will use a local file that contains all of the symbol information.
    Before you connect to the target machine, you will load this symbol table information
    into gdb and then start a debug session remotely on the target machine.


    # 8.2 What are Embedded Systems?


    There are many definitions of embedded system but all of these can be combined
    into a single concept. An embedded system is a special-purpose computer system
    that is used for a particular task. The special computer system is usually less
    powerful than general-purpose systems, although some exceptions exist where embedded
    systems are very powerful and complicated. Usually a low power consumption CPU
    with a limited amount of memory is used in embedded systems. Many embedded systems
    use very small operating systems; most of provide very limited operating capabilities.
    However as memory and CPU power is becoming cheap,'
  merge: -1
  pgno: 266
- img_proc: true
  md: 'many modern operating systems are also being used in embedded systems these
    days. Embedded Linux products are becoming more and more popular.


    Since embedded systems are used for special purpose tasks, there is usually no
    need to add new applications to the system once it is built. Therefore programs
    and operating systems are usually loaded only once into read-only memory. The
    read-only memory is available in many forms these days and includes some type
    of ROM, flash chips and flash cards. In case an upgrade is required, a new ROM
    chip replaces the old one.


    If you look at your surroundings, you will find tiny computers everywhere. They
    are present even in places where you rarely notice them. Some of the most common
    embedded systems used in everyday life are:


    +   * Refrigerators

    * Microwave ovens

    * TV, VCR, DVD players

    * Cameras

    * Cars (Antilock brakes, engine control, sun roof, climate control, automatic
    transmission and so on)

    * Personal digital assistants

    * Printers


    Complicated and more sophisticated embedded systems include routers and switches
    where high performance CPUs are used.


    # 8.2.1 Embedded Systems and Moving Parts


    Most of the embedded systems are supposed to be used for a long period of time
    and without any maintenance. This is the very nature of embedded systems applications,
    to manufacture a system and then let it run independently for its intended life.
    For this reason, most embedded systems usually don''t have moving components because
    any moving or mechanical parts experiences wear and tear and needs replacement
    periodically. Typical examples of moving components include fans, disk drives
    and so on. Fans are used for cooling power supplies and CPU heat sinks in desktop
    computers. Disk drives (both floppy and hard disk drives) are used as a storage
    medium for operating systems, applications and data.


    In embedded systems, ROM is used for storage of operating system and application
    data. These days, flash cards are also common and you can update a system just
    by replacing the flash memory card. In embedded systems you have to use special
    types of power supplies that don''t need any fan for cooling. Many different types
    of power supplies are available on the market that don''t heat up when used continuously
    for long periods of time.'
  merge: -1
  pgno: 267
- img_proc: true
  md: '# Embedded Systems and Power Consumption


    Power consumption is also an important issue in embedded systems. This is also
    related to the moving parts issue in a sense. Components that consume more power
    need cooling, so some type of fan must be attached to the system. For this reason
    people always prefer CPUs and other components that use less power and generate
    less heat. It is also beneficial for systems that run on batteries to use less
    power. High-consuming components drain batteries quickly.


    # Embedded Operating Systems


    Since embedded systems are usually not general-purpose systems, they need not
    to be as sophisticated as commercial general-purpose systems. These operating
    systems are smaller in size. Most of these operating systems also offer real-time
    capabilities, which are missing in general-purpose systems. Although there are
    hundreds of operating systems available for the embedded market, some of the most
    commonly used ones are:


    +   * VxWorks

    * pSOS

    * Embedded Linux

    * QNX

    * Windows CE


    When you use Linux as an embedded operating system, you can take out many parts
    of the kernel that are required in the general-purpose Linux systems. Which parts
    should be excluded from the kernel depends on the requirements of a particular
    system. For example, you can take out the entire networking code if the embedded
    system is not going to be networked. Similarly, you can take out most of the secondary
    storage related drivers and file systems support. Kernel parts are the most likely
    candidates for removal from the embedded Linux:


    +   * Disk drivers

    * CD-ROM drivers

    * Most of the networking code. Even if an embedded system is intended to be networked,
    you may not need all of the routing code and drivers for all types of network
    adapters.

    * Sound and multimedia related drivers and components. However you may need these
    components if the embedded system is used as a game computer.

    * Most of the file system support

    * Any other thing that is not required. You can go through the kernel configuration
    process to determine what is not necessary.


    The trimmed version of the Linux kernel will be much smaller compared to the kernels
    you find in most Linux distributions.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# 8.2.4 Software Applications for Embedded Systems


    Embedded applications are tightly integrated with each other and often with the
    operating system as well. In many cases you find only one big file that is loaded
    by the system at the time you power it up that contains all of the operating and
    applications data. Since resources are sparse on embedded systems, applications
    are usually highly optimized to take the least amount of memory and storage space.
    Embedded systems programmers don''t have the luxury of even one extra line of
    code. In addition, software needs to be solid because there is nobody to restart
    a crashed application. Watchdog timers are used to recover from any system lock.


    # 8.3 Development Systems Differ for Embedded Systems


    Development for embedded systems is different from common practices in many ways.
    For developers in the embedded systems world, there is a learning curve to understand
    which conventional practices are no longer valid in this new environment. To be
    an embedded systems developer, you need to know many things about the hardware
    on which your software will be executed. Often embedded systems are connected
    to some sort of control system (wheel rotation in an automobile anti-lock braking
    system, for example) and the developer also needs knowledge of that system as
    well. If the CPU and/or the operating system are different on the target embedded
    platform, you have to do cross-platform development which has its own issues.
    There are different testing techniques as well because most of the embedded systems
    you don''t have a monitor screen where you can display error messages or test
    results. All of these issues make embedded systems development much more complicated
    than writing a program on a UNIX machine and executing it.


    This section provides information on some of these issues but should not be considered
    comprehensive. This is just a starting point to give you an idea that you should
    expect new challenges when you started systems programming.


    # 8.3.1 Knowledge of Target System Hardware


    The embedded system is usually different from the system on which you develop
    software (the host machine). For example, usually the target computer has many
    input and output lines, different interrupts and probably a different type of
    CPU. It may also have memory constraints because these systems usually have a
    low amount of RAM and no virtual memory because of the absence of secondary storage
    media. To develop software for the target, you need to know all of these things.


    As mentioned earlier, most of the embedded systems are connected to some other
    sort of hardware. The main job of these systems is to connect the connected hardware
    or systems using some policy. As an embedded system programmer, if you don''t
    have knowledge of these additional system or hardware, you will not be able to
    program the embedded system well. Usually embedded systems have some sort of digital
    and analog I/O connected to this external hardware where you have to exchange
    data.'
  merge: -1
  pgno: 269
- img_proc: true
  md: '# Cross Compilations


    # 8.3.2 Is the Target running a real-time operating system?


    If the target system is a real-time operating system, you have to keep in mind
    many other issues as well. Usually these issues don''t come into the picture when
    you are developing for general-purpose machines. System scheduling is important
    and you need to know what kind of scheduling is available on the target system.
    Almost all real-time systems have priority-based scheduling. However, if two processes
    have the same priority, then scheduling may be different depending upon the operating
    system. Some systems implement round-robin scheduling for equal priority tasks.
    On the other hand some systems run a task to completion. You need to know what
    happens when a process or task is scheduled on a particular real-time scheduler.
    Time slices for running equal priority processes on round-robin schedulers can
    also be changed on some real-time schedulers.


    To complicate the situation, some systems also allow processes to increase or
    decrease their priority levels at run time.


    Interrupts and their service routine are usually critical in real-time systems.
    If your embedded target platform is real-time, you should keep in mind limitations
    in this area and tolerance of critical tasks in constrained environment. You should
    not miss a critical event in a real-time system because if a packet is dropped
    in a router, it may be later, but if a robot reacts to some event late, it may
    result in major loss. Even dropped packets aren''t particularly acceptable in
    modern routers.


    # 8.3.3 Testing Methodology


    The testing methodology is also different in the case of embedded systems. In
    typical cases, an embedded system is connected to some other device or system
    for control purposes. These connections are not available on the host system where
    you are developing the software. This is true even if the operating system and
    CPU on the host and target systems are the same. For example, a Linux-based embedded
    system running an x86 family of processors may be controlling some security system.
    It is difficult to simulate that security on a PC and test your software. Even
    if the platform is the same, you have to test and debug your programs on the target
    system.


    In some cases testing of embedded systems may be quite complicated as you need
    to get results of the functionality test sent somewhere. In small embedded systems,
    not connected to a network or a user-friendly output device, these results are
    difficult. In such circumstances you may need to build special testing techniques
    or special code in your embedded system to produce test results. I recommend a
    thorough knowledge of how to write testable.


    # 8.4 Cross Compilations


    Cross compilation tools are very important for successful product development.
    Selection of these tools should be made based upon the embedded system as well
    as features to test and debug software remotely. Since you are developing software
    on a Linux platform, your cross-'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# Chapter 8 · Cross-Platform and Embedded Systems Development


    platform development tools should be compatible with Linux as a host machine.
    Depending upon CPU family used for the target system, your toolset must be capable
    of generating code for the target machine. In the case of GNU development tools,
    you you need to have a number of things to work together to generate executable
    code for the target. For example, you must have at least the following available
    on your Linux machine.


    +   * Cross compiler

    * Cross assembler

    * Cross linker

    * Cross debugger

    * Cross-compiled libraries for the target host.

    * Operating system-dependent libraries and header files for the target system


    These components will enable you to compile, link and debug code for the target
    environment. In this section, you will learn how to develop a cross-compilation
    environment on your Linux machine.


    You have already built a native GCC compiler in Chapter 3. Conceptually, building
    a cross compiler is not much different from building a native compiler. However
    there are additional things that you should keep in mind while building a cross
    compiler. The most significant of these is the command line listing of the target
    when running the configure script. The whole process may be slightly depending
    upon targets. The best resource to find out detailed information about how to
    build a cross compiler is the CrossGCC FAQ and mailing list. The FAQ is found
    at http://www.objsw.com/CrossGCC/ and using information in this FAQ, you can subscribe
    to and search the CrossGCC mailing list. I would suggest getting a cross compiler
    from a vendor instead of building yourself. Many companies, including RedHat (http://www.redhat.com)
    and Monta Vista Inc. (http://www.mvista.com), provide development tools for embedded
    Linux development of different CPU families.


    8.4.1 Cross Debugging

    There are multiple methods of debugging that you can use in the cross-platform
    development environment. Most commonly you can use emulators, JTAG, and remote
    debugging over serial or network links. Some of these methods are discussed in
    this section.


    # 8.4.1 Software Emulators


    Software emulators are software tools that can emulate a particular CPU. Using
    a software emulator you can debug through your code and find CPU register values,
    stack pointers and other information without having a real CPU. Software emulators
    are useful when you don''t have the real hardware available for testing and debugging
    and want to see how the CPU will behave when a program is run on it. Keep in mind
    that these are not useful tools to simulate real hardware because there are many
    other hardware components that are built into the target machine.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# 8.4.2 In-circuit emulators


    In-circuit emulators are devices that are used to emulate a CPU. You can plug
    this in device in place of a CPU on your circuit board. The device has the same
    number of pins and the same package type as the CPU and fits into the CPU socket.
    The other side is connected to a PC or a workstation where a debugger is running.
    Using an in-circuit emulator, you can start and stop execution of a program as
    you wish. This is in contrast to a software emulator, where the CPU emulator is
    a program running on your machine, isolated from the circuit board on which you
    want to test your software. An in-circuit emulator provides you access to real
    hardware for testing purpose.


    Usual arrangement of in-circuit emulator is shown in Figure 8-2. The emulator
    is plugged into the actual embedded system on one side and connected to your PC
    on the other side.


    ![](img/6c7a25ca6f0486ebfea1f3a198ad7957_272_0.png)


    Figure 8-2 In-circuit emulator connection diagram.


    # 8.4.3 Introduction to JTAG and BDM


    JTAG or Joint Test Action Group is a method of accessing memory and CPU resources
    without having an application running on the test. BDM or background debugging
    mode also achieves this objective. Many CPUs provide JTAG or BDM port/connection
    to connect a serial or parallel port on your host to the target CPU board using
    a cable. There are a few open source projects that give you information, utilities
    and hardware diagrams about the procedure.


    Using JTAG or BDM, you don''t need an in-circuit emulator and a debugger running
    on your host machine can connect to a target board. But keep in mind that not
    all CPUs provide this facility. Most Motorola controllers and PowerPC CPUs have
    this interface.'
