  md: '# Cross-Platform and Embedded Systems Development


    As you have already learned in Chapter 3, development systems consist of many
    tools. The discussion in Chapter 3 was about native software development, which
    means that the host system on which the software is developed and the target system
    it runs are the same. This chapter provides information about embedded and cross-platform
    software development where the host system and the target system are different.
    The issues in this type of development are slightly different although basic programming
    methods and techniques remain the same.


    In this chapter I have used a single board computer from Arcom (www.arcomcontrols.com)
    and a processor mezzanine card from Artesyn (www.artesen.com). I am thankful to
    both of these vendors, The Arcom board is based upon a x86 compatible CPU and
    has four serial ports, an Ethernet port and a number of other ports. The Artesyn
    board is PowerPC based and it can be plugged into a Compact PCI career card. Information
    about these boards can be obtained from the respective company web site. I have
    listed some features at the end of this chapter.


    Before reading this chapter, you should become familiar with a few concepts related
    to cross-platform development. The most important terms used in this chapter are
    cross and native. The term cross is used for tools'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Chapter 8 · Cross-Platform and Embedded Systems Development


    that run on one type of machine but are used to carry out some service for another
    type of machine. For example, a cross compiler is a compiler that creates executable
    code for a machine which is different from the machine on which the compiler is
    running. Similar is the case with cross assemblers, debuggers and so on. On the
    other hand, a native tool provides a service to the same machine on which it is
    running. For example, a native compiler generates output code that is executable
    on the same machine on which the compiler runs.


    # 8.1 Introduction to the Cross-Platform Development Process


    You need a general-purpose computer for software development. This computer hosts
    development tools. In most cases, the computer also hosts some debugging tools.
    The executable code may be generated for the same computer on which you develop
    software or for some other machine that is not capable of running development
    tools (editors, compilers, assemblers, debuggers etc.). Most of the time host
    and target machines differ so that programs built on the host machine cannot run
    on the target machine. These differences may take many forms. Common differences
    between host and target machines are different operating system, different system
    boards or a different CPU.


    It''s necessary to understand some basic concepts and terminology related to cross-platform
    development. These basic concepts are explained in the following subsections.


    # 8.1.1 Host Machine


    The host machine is the machine on which you write and compile programs. Ali of
    the development tools are installed on this machine. Most of the time is your
    PC or workstation. Your compiler is built to run on this machine. When you are
    satisfied with your code, the executables are built and transferred to the target
    machine. If the host and target machines are different, the final executable can''t
    be executed on the host machine where you built it.


    # 8.1.2 Target Machine


    A target machine may be another general-purpose computer, a special-purpose device
    employing a single-board computer or any other intelligent device. Usually the
    target machine is not able to host all the development tools. This is why host
    computer is used to complete development work.


    Debugging is an important issue in cross-platform development. Since you are usually
    not able to execute the binary files on the host machine, they must be run on
    the target machine. The debugger, which is running on the host machine, has to
    talk to the program running on the target machine. GNU debugger is capable of
    connecting to remote processes. Some CPUs have a JTAG or BDM connector, which
    can also be used to connect to processes on remote systems.'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Introduction to the Cross-Platform Development Process


    # 8.1.3 Native and Cross Compilers


    A native compiler generates code for the same machine on which it is running.
    A cross compiler generates code for a machine different from the one on which
    it is running.


    # 8.1.4 Cross Platform Development Cycle


    The cross-platform development cycle consists of at least four stages. These stages
    are:


    +   - Writing code

    - Cross compilation

    - Transferring binaries to the target

    - Debugging


    The steps may be different in some cases depending upon the type of product you
    are building. Figure 8-1 shows these processes and machines on which a particular
    process is carried out.

    Let us take a closer look at these steps.


    # 8.1.4.1 Writing Code


    When you write code for cross compilation, you have to keep few things in mind.
    The CPU architecture of the target machine may be different from that of the host
    machine. This means that you have to consider word lengths, byte order and so
    on. For example, length of integer may be different on the target machine. Similarly,
    organization of memory bytes inside a 32-bit integer is different in Intel CPUs
    as to Motorola CPUs. This is a typical network-order problem and must be considered
    when developing network protocols.


    Some libraries'' routines may be different for cross compilers than for native
    compilers.


    # 8.1.4.2 Building on the Host Machine


    After writing the code, you need to compile it on the host machine. In addition
    to a cross compiler and assembler that can generate code for the target machine,
    you need libraries libraries that are linked to you. These libraries are usually
    specific to the target machine and are cross-compiled.


    If you are writing code according to some standard, your porting process is usually
    very quick. For example, if you have written libraries strictly using the ANSI
    standard, it will be relatively easy for you to port these libraries from one
    platform to another. In large software development projects, it is important that
    you stick to this standard. This is because you may wish to port and sell the
    product for many platforms.


    You have learned the difference between static and dynamic linking earlier in
    this book. Usually in cross compiling, you will have to build the executable code
    with static linking because you may not have shared libraries available on the
    target system. This is especially true for embedded systems where you usually
    don''t have a large secondary storage device.'
  merge: -1
  pgno: 264
