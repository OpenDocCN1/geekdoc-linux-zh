  md: '# LINUX APPLICATION DEVELOPMENT


    # The Linux DEVELOPMENT PLATFORM


    RAFEEQ UR REHMAN CHRISTOPHER PAUL


    Tools for Linux developers have access to an extraordinary array of GNU and open
    source tools. Now, leading Linux developers show how to choose the best tools
    for your specific needs, and integrate them into a complete development environment
    that maximizes your effectiveness in any project-no matter large or complex. This
    book''s example-rich coverage includes:


    high-efficiency


    The software development process: research, requirements, coding, debugging, deployment,
    maintenance, and beyond


    Linux development


    Choosing and implementing editors, compilers, assemblers, debuggers, version control
    systems, utilities, and more


    in enterprise


    environments


    Using Linux Standard Base (LSB) to deliver applications that reliably run on a
    wide range of Linux systems


    Comparing Java development options for Linux platforms


    Using Linux in cross-platform, and embedded development environments


    Whatever your environment, The Linux Development Platform will help you find,
    configure, and maintain the right tools—and use them to deliver outstanding Linux
    software.


    # CD-ROM INCLUDED


    The accompanying CD-ROM contains all the accompanying open source software you
    need to build and customize your own Linux development environment.


    # ABOUT THE AUTHORS


    RAFEEQ UR REHMAN, author of HP Certified: HP-UX System Administration and Solaris
    8 Network Administrator Certification Guide, has extensive experience in UNIX,
    Linux, C and database programming, Internet protocols, and security. CHRISTOPHER
    PAUL is Open Systems Engineer II in the UNIX Production Engineering Group for
    Bank in Columbus, OH.


    Bruce Perens'' Open Source Series is a definitive series of Linux and Open Source
    books by the world''s leading Linux software developers. Bruce Perens is the primary
    author of The Open Source Definition, the formative document of the open source
    movement, and the former Debian GNU/Linux Project Leader. The text of this book
    is Open Source licensed.


