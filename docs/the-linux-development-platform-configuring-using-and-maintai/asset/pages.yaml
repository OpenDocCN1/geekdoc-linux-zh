  md: '# 3.3.4 Compilation with Debug Support


    If you want to debug a program after compiling with gcc, you have to include debug
    in the compiled program. The debug information is included in object file using
    the -g command line switch with gcc. The following command creates the hello.o
    file that contains debug information.


    ```

    [rr@conformix 4]$ gcc gcc -c hello.c

    [rr@conformix 4]$

    ```


    Note that when you compile a program with debug information, the size may be quite
    large as compared to a file compiled without debug information. In the example
    of hello.c, the size of hello.o is 908 bytes when compiled without debug information.
    The size of hello.o is 10780 bytes when it is compiled with debug information.


    You can use multiple debug levels with -g option. The default debug level is 2
    which is equivalent to using -g2 command line option. If you use -g3 command line
    option, information about macros is also included which makes it easier to debug.


    > Note You can use the debug option with optimization options. Optimization options
    are discussed later in this chapter.


    With the -a option on the command line, you can also include profiling information
    in the object code.

    You can also use some command line switches to provide extra information. For
    example, one useful thing is to print out a list of directories the gcc command
    searches to find files. The following command will print all directories that
    gcc uses to libraries, programs and so on.


    ```

    [rr@conformix 4]$ gcc -print-search-dirs hello.c -o hello

