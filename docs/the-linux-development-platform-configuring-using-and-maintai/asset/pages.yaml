    # 3.4 Linking a program


    As mentioned earlier, building an executable binary from a source code file is
    a multi-stage process.


    The gcc compiler usually carries all these steps for you by default. However you
    can stop at any of these stages for various reasons. You have already seen how
    to create assembler from a source code file. In most software projects, output
    binaries are built from many source code files. For this purpose you have compile
    these source code files to object files before you generate the output binary
    file. After creating these object files, you can link these files using gcc to
    the final executable.


    The linker gets help from different programs during the four steps earlier in
    this chapter. In the linking part, the linker is invoked with appropriate arguments
    to link one or more object files with libraries to generate an executable. Command
    line switches with -ld can be found using manual pages. You can down-


    load linker is part of GNU binary utilities package also known as binutils. You
    can download and install the latest version of GNU linker if you need to do so.


    # 3.5 Assembling a program


    GNU assembler is part of GNU binary utilities package. To get the latest binutils-packages,
    you can download it from http://ftp.gnu.org/binutils/. After downloading you have
    to use the tar command to extract source code. The latest version at the time
    of writing of this chapter is 2.12 and the tar will create a directory binutils-2.12.
    I automatically created it in the opt directory, so the source code directory
    is /opt/binutils-2.12. I created another directory /opt/binutils-build to build
    the package. Running the config-script is the first step towards building binary
    utilities package. The following sequence of commands does all of these steps.


    ```

    root@conform /opt]# cd /opt

    root@conform /opt]# tar zxvff binutils-2.12.tar.gz

    root@conform /opt]# mkdir binutils-build

    root@conform /opt]# cd binutils-build/

    root@conform binutils-build]# ../binutils-2.12/configure --nprefix=/opt/gcc-3.0.4
    --enable-shared

    ```'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# 3.6 Handling Warning and Error messages


    ```

    [root@conformix /opt#]# make LFLAGS=-all-static tooldir=/opt/

    gcc-3.0.4

    [root@conformix /opt#]# make tooldir=/opt/gcc-3.0.4 install

    ```


    Since that we have used /opt/gcc/3.0.4 as a prefix and tooldir for installation,
    the binary utilities will be installed in /opt/gcc-3.0.4/bin directory. As you
    may have noted, I have installed all software under /opt/gcc-3.0.4 so that I can
    use one directory for all of my tools.


    The GNU compiler generates two types of messages when compiling source code. Warning
    messages are non-critical messages and the compiler can build the code even if
    there are warning messages. Error messages are fatal messages and the compiler
    is not able to generate files when an error occurs. By default, the compiler does
    not display many messages, for example, when you want to get a release of a software
    package. Usually the release version of software should be compiled without any
    warning message. Using options that start with -W, you can control which types
    of messages should be displayed. It is a good idea to use -Wall in your Makefiles.
    The reason is that warnings often signify problems in code that you will want
    to see. Please see gcc pages to get a feel of options controlling warning messages.


    # 3.7 Include files


    During the compilation process, the compiler should know where include files will
    be located. This can be done in different ways. The compiler looks into some default
    locations when searching for include files and you have already seen in this chapter
    how to display that information. You can also the -I command line switch with
    gcc command to set additional paths to include files. The third method is the
    use of environment variables. Please see the environment variables earlier in
    this chapter for more information.


    # 3.8 Creating Libraries


    Libraries are files containing commonly used functions needed for all programs.
    For example, printf() is a function used in most of the C programs. When the program
    is linked, the linker must know where the code for the printf() function is located.
    Knowledge of location of library files is a must at this stage. The location can
    be passed to the linker using command line options or environment variables. In
    large software projects, this is done inside Makefiles. The environment variable
    that shows the location of library files is LD_LIBRARY_PATH. Please see the list
    of command line options in this chapter or use manual pages to find out which
    options are appropriate.'
