    # 8.5.2 Attaching to a Running Process Using gdbserver


    Using the gdbserver program, you can also connect to a running process on the
    target. For example, the following command can be executed on the target to connect
    to a process with ID equal to 375.


    ```

    gdbserver /dev/ttyS1 375

    ```


    You can also use the TCP/IP connection by replacing the /dev/ttyS1 with host-port
    number as you have seen earlier.'
