  md: '# Hardware Used for Cross-Platform and Embedded Development


    A complete list of features can be found in the accompanying Arcom CD. The CPU
    on the board I received has a clock speed of 333 MHz with no fans or requirement
    of any other cooling method. This is a cool CPU board.


    The Arcom board has the following features that make it suitable for many applications.
    All of this is integrated to a small sized board.


    +   - Floppy disk controller

    - Hard disk controller to which you can connect hard drives or CD/DVD drives.

    - Sound Blaster

    - Four serial ports

    - Parallel port

    - VGA connector for CRT monitors

    - Interface for flat panel monitor

    - PC/104 bus

    - PCI bus

    - 16 MB flash that can be used as a disk

    - 64 MB RAM

    - Ethernet controller to connect to a LAN

    - PS/2 mouse and keyboard connectors

    - Compact flash socket that can be used to increase storage space in case you
    need large applications


    The board comes with Linux kernel 2.4.4 pre-installed with many features that
    are important for embedded systems. Arcom embedded Linux is optimized for space
    but has all of the commonly used applications and utilities. These include:


    +   - A Telnet server and client

    - NFS support

    - FTP server and client that can be used to transfer files from host computer
    to the target computer

    - HTTP server. You can start the HTTP server right from the beginning. A default
    page is already present on the board.

    - X-Windows support

    - The inetd daemon that can be used to launch network applications on demand


    In addition to these, Arcom embedded Linux has the following features that may
    be of interest to the developers of embedded applications.


    +   - Kernel 2.2.4

    - Journaling Flash File System (JFFS2), which is a compressed file system used
    on flash storage.'
