    Type "help" followed by a class name for a list of commands in that class.


    Type "help" followed by command name for full documentation.

    Command name abbreviations are allowed if unambiguous.

    (gdb)

    You stop gdb using quit command on (gdb) prompt. You can also stop gdb or the
    current running program by pressing the Ctrl and C keys simultaneously.


    You need to open a file for debugging after starting gdb using file command. You
    can also start gdb by providing a file name on the command line. The following
    command starts gdb and uses a, out file for debugging purpose.


    ```

    gdb a.out

    ```


    Please note that a.out must be compiled with the -g command line switch with gcc
    compiler. If you do not use the command switch -g, no debug information will be
    stored in the a.out file. The typical command line to compile a file with debug
    support is as follows:


    ```

    gcc -g hello.c -o hello

    ```


    The above command creates an output file hello that can be used to debug hello.c
    program using the following command:


    ```

    gdb hello

    ```


    If you have started gdb without any command line argument, you can load a file
    into gdb at any time using file command at the (gdb) prompt.


