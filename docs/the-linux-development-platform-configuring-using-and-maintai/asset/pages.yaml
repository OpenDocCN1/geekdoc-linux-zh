  md: '# Typical Hardware Requirements for a Linux Development Workstation


    There are many factors that go into selecting an appropriate hardware specification
    for any given task, and the final specification will vary greatly depending on
    a particular environment, budget and time available to accomplish the task. In
    general, however, the things that need to be considered are: the speed of the
    processor, the amount of memory, size of the local hard drives, network connectivity,
    the video card and the display. Depending on the development projects to be undertaken,
    additional devices such as modems, sounds cards and the like will also need to
    be considered.


    The three situations that we will consider are a single developer working on a
    project alone, a distributed environment in which multiple developers are accessing
    a single machine via remote-log (telnet, ssh or X-Windows), and a distributed
    environment utilizing a software repository.


    # A.1 Parts of a Workstation


    Computers consist of many parts working in conjunction with each other to turn
    current into meaningful output on the display screen. Much of the work of the
    computer takes place using the motherboard, the processor(s) and the computer''s
    memory. These components provide the "horsepower" that largely determines how
    fast the computer runs


    Working in conjunction with these parts are things like the hard disk drive that
    provides the internal long-term storage. There is also the video card that is
    used to convert the information in the computer into something that is readily
    usable to us mortals and the modem or network interface card that permit computers
    to communicate with one another.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# Appendix A · Typical Hardware Requirements for a Linux Development Workstation


    Externally there are things such as the keyboard and the mouse that permit the
    user to enter data into the system, and the monitor which enables the computer
    to present information in a way that the operator can easily understand.


    When evaluating a new computer system, remember that the motherboard, the processor
    and the memory determine how fast your computer will be able to perform the tasks
    required of it.


    The hard disk drives, the network and video cards, etc. determine what and how
    much your computer will be able to do. However, speed of hard drive is also a
    major factor in overall speed of compilation in case your computer is low on memory.


    Lastly, the input and output devices determine how style your computer will have
    when it goes about doing whatever it was told to.


    While there is some overlap in function, these definitions provide a general outline
    of the parts of the computer and give us a basis for determining a base-line system.


    # A.2 Section 1—The Processor and Memory


    Systems are available with one or multiple processors. Random Access Memory (RAM)
    is easily cheap and to find. Processor speed seems to double every eighteen months
    and almost as soon as a new system is purchased, it becomes obsolete.


    The speed and the number of processors will determine the sheer raw power that
    a computer has. Speed is measured in megahertz (MHz) and is always better.


    The memory that a system has installed will also effect the overall speed of the
    computer. If the system runs out of physical memory, if the space has been set
    aside for it, paging memory to disk. This is the process of writing a portion
    of memory that has not been used recently (in computer terms that mean milliseconds)
    to the disk in order to free the memory for immediate usage. When the information
    on the disk is required again, the computer frees up physical memory and reads
    the data from that disk into area.


    As the hard drive is several orders of magnitude slower than simply reading the
    information from memory, this slows down the entire computer as it waits for the
    information to be written and read from drive. If your computer sits idle while
    there are large amounts of access to the disk, it is possible that the computer
    is low on memory and swapping to the disk. Adding more memory to the system should
    speed it up.


    # A.3 Section 2—The Disk Drive


    At present, there are two types of drives available on the market for personal
    computers: IDE and SCSI (pronounced "scuzzy"). The first and most common is the
    IDE drive. This is the type with most off-the-shelf workstations. A standard computer
    will be able to support up to four IDE drives at a time. These drives may hard
    drives, CD-ROMs, DVD drives or tape drives. Once the maximum of four devices has
    been installed into the computer, no more may be added until one is removed. This
    and the fact that IDE drives have traditionally been slower than'
  merge: -1
