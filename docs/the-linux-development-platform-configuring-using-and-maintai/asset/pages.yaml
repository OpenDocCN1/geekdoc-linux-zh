  md: '# Using GNU make


    All serious software projects are built in pieces by many developers. These pieces
    consist of source code and header files, libraries and different tools. To combine
    these pieces into a product is a process commonly known as a build. The GNU make
    utility is one of the many available utilities used to build these software projects.
    Large software projects often have hundreds and thousands of files. Compiling
    these files and linking them into final executable product files is done by a
    careful and well-defined automated process. This automated process, also known
    as the software build process, is controlled by make through makefiles. The make
    utility reads one or more of these makefiles containing information about how
    to build a project. Makefile contain different types of information, including
    variables, control structures and rules to compile and link source files, build
    libraries and so on. In the most common makefiles, rules are present to remove
    object and executable files from the source code directory to clean it up, if
    required. These rules are enforced based upon on different files. For example,
    if an existing object file is newer than the corresponding source code file, it
    is not recompiled. However if the object file is older than the source code file,
    it shows that someone modified the source file after the object file was last
    built. In such a case, make detects it and rebuilds the object file. Depending
    upon the requirements of a project, someone can create different types of rules
    and commands to build software projects.'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'This chapter contains information on how to write makefiles for software projects
    and provides sufficient information for a reader to write makefiles for fairly
    complex projects. You can also refer to the reference at the end of this chapter
    for more comprehensive information about the make utility.


    To demonstrate the use of make, several examples are presented in this chapter
    demonstrate how make can be used for different objectives. These examples are
    simple and easy to understand and are explained in the text. However you may write
    makefiles in many different ways for the same object. Features of make that are
    discussed in this chapter are most commonly used. Make has many additional, less
    commonly used, features that are not covered here and you may want to use these
    as well when designing your makefiles.


    # 4.1 Introduction to GNU make


    The make utility has been used for a very long time in all types of software development
    projects. There are open-source as well as commercial variants available from
    many vendors. The most common and popular distribution of make is the GNU make,
    which is open source and is available for all Unix and Microsoft Windows platforms.
    All of the Linux distributions have the GNU make as a standard package with the
    development system. If you have installed development software from a distribution,
    you don''t need to install any additional software for make to. The version of
    make currently installed can be displayed using the following command.


    ```

    [root@conformix make]#$ make -v

    GNU Make version 3.79.1, by Richard Stallman and Roland

    McGrath.

    Built for i386-redhat-linux-gnu

    Copyright (C) 1988, 89, 90, 91, 92, 93, 94, 95, 96, 97, 98,

    99,

    2000

    ```


    > Free Software Foundation, Inc.

    This is free software; see the source for copying conditions.

    There is NO warranty; not even for MERCHANTABILITY or FITNESS

    FOR A PARTICULAR PURPOSE.


    Report bugs to <bug-make@gnu.org>.


    ```

    [root@conformix make]#

    ```'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'Since this is one of the most widely used software packages in the development
    community, there is a wealth of information available about it on the Internet.
    This chapter is intended to provide sufficient information to use make in all
    types of software projects.


    Simply put, make reads a text input file that contains information about how to
    compile, link and build target files. Make uses commands and rules specified in
    this file to carry out its operation. We shall discuss in detail the contents
    of these files, commonly known as makefiles.


    # 4.1.1 Basic Terminology


    Before we move ahead with more information about make and how to use it, let us
    get familiar with some basic terminology about software build process and the
    make utility. The terms defined below will be used throughout this chapter as
    well as in the chapters that follow.


    # Input Files


    The make utility uses input files to build software projects. These input files,
    also known as makefiles, contain information about when and how to compile, assemble
    or link files. Input files also contain commands and rules to carry out these
    tasks.


    # Rules


    A rule in an input file provides information about how to build an individual
    target (defined next). A rule has three parts:


    +   1. The target

    2. Dependencies

    3. Commands


    A target is rebuilt whenever a dependency file has a timestamp that is newer than
    the target. A target may have no dependency, in which case it is always rebuilt.
    The commands in the rule are executed to build the target from dependencies. The
    general format of a rule is as follows:


    ```

    Target: Dependencies

    Commands

    ```


    The commands part always starts with a TAB character. There are two types of rules
    that will be explained later in this chapter. These are types are:


    +   1. The explicit rules

    2. The implicit rules


    The rules defined above fall into explicit rules category. Implicit rules are
    predefined rules that make uses when it does not find an implicit rule to build
    a target.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Target


    A target is usually a file or set of files that is the result of some operation
    on one or more other files. A target may be an object file, a final executable
    file or some intermediate file. Targets may be fake or phony, in which case no
    files are actually rebuilt. One such example is the phony target to remove all
    object and executable files from the source directory. This process is often called
    a cleaning process. As a convention, makefiles have a rule to clean the source
    code so that everything can be rebuilt freshly.


    # Dependency


    The dependencies are files that determine when to build a target. The decision
    to rebuild a target is made if the timestamp on any dependency is newer than the
    target. This shows that a dependency file has been modified after the target was
    built the last time. Consider the example of an object file that was built from
    a C source file. After building the object file, if someone modifies the source
    file, we need to rebuild the object file because it is no longer current. When
    the make utility scans the input files, it verifies this and builds the object
    file automatically if it finds a change in the source file. If multiple files
    are used, they need to be in sync.


    A target may have multiple dependencies separated by space characters. In case
    of multiple dependencies, the target is rebuilt if any of the dependencies has
    changed. If the list of dependencies is very long, you can write multiple lines
    for dependencies by using a backslash character at the end of a line to continue
    to the next line. For example, the following lines show that tftp.o has dependencies
    three lines.


    ```

    tftp.o: tftp.c file1.c file2.c file3.c file4.c\nfile5.c file6.c file7.c file1.h
    file2.h file3.h\nfile4.h file5.h

    ```


    Note that the starting character in the second and third line should not be a
    TAB character; otherwise make will consider these lines as command lines and will
    try to execute them.


    # Default Goal


    An input file (makefile) usually contains many rules. Each of these rules has
    a target. However the make utility does not build all of these. It only tries
    to build the first target specified in the input makefile. This target is called
    the default goal of the makefile. However note that if dependencies to this default
    goal are targets of other rules, the make utility can also build those targets
    in an effort to build the default goal. This happens when dependencies of the
    default goal are out of date.


    If you want to build a target that is not the default goal, you have to specify
    the target at the command line when starting make. This will be explained later
    in this chapter.


    # Phony Target


    Some targets may have no dependencies. A common example is the clean target that
    removes some files from the source directory. A typical clean target is shown
    below:'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Introduction to GNU make


    clean:

    rm *.o


    Whenever you invoke make to build this target, the rm command is always executed.
    This is because the target has no dependency. These types of targets are called
    phony targets.


    However there is a problem with such targets. Sometimes if there is a file with
    the same name as the phony target, the make utility may get confused while building
    it execute the command in the phony target when it is not required to do. To avoid
    this problem, you can specify which targets are phony targets in the makefile.
    The following line in the makefile defines clean as a phony target.


    ```

    .PHONY: clean

    clean:

    rm *.o

    ```


    # 4.1.2 Input Files


    The make command, when invoked without a command line argument, expects certain
    file names as input. These file names are searched in the current directory in
    the following order.


    +   1. GNUmakefile

    2. makefile

    3. Makefile


    If none of these files is present, make will not take any action and displays
    the following error message:


    ```

    [root@conformix]# make

    make: *** No targets specified and no makefile found.  Stop.

    [root@conformix]#

    ```


    However there is a way to specify files with non-standard names as explained later.
    The common practice is to use "Makefile" as the name of the input file because
    it is easy to distinguish from other files due to upper M.


    > NOTE If you have multiple input files in the same directory with GNUmakefile,
    makefile and Makefile, only the GNUmakefile will be used. As a rule of thumb,
    make will use only the first available file in its priority list to build a project.
    This means that if we have two files named make-file and Makefile, only the file
    named makefile will be used.'
  merge: -1
  pgno: 128
- img_proc: true
  md: 'You can specify any other filename using command switch -f with the make command.
    For example, if you have a file named myrules.make, you can use it as input file
    to the make utility as follows:


    ```

    make -f myrules.make

    ```


    From now on in this book, we will use only "Makefile" as the name of the input
    file for the make command. This is a usual convention in most of the software
    development projects. Input files with any other name will be used as includes
    in the Makefile. The common conventional name for include file is Makefile.in.


    # 4.1.3 Typical Contents of the Makefile


    The makefiles that are used as input to the make command have similar types of
    contents. Some of the typical contents of a myfile are as follows.


    # Variables


    Variables are usually the first part of any myfile. Variables are used to associate
    a name to a text string in the makefiles. These variables are then substituted
    into other targets, dependencies or commands in the myfile. A simple equal sign
    can associate a text string to a name. The following line define a variable targets
    in the myfile. This variable is equal to two target files tfftp.o and fto.o.


    ```

    targets = tfftp.o fto.o

    ```


    To use this variable later on, enclose the variable name in parentheses and use
    a dollar sign with it. The targets variable will be used as $(targets) building
    in the myfile to refer to these two object files. A typical use of this variable
    is shown in the following three lines.


    ```

    $(targets): tfftp.h tfftp.c tfftp.h

    gcc -c tfftp.c

    gcc -c fto.c

    ```


    This rule tells make that if any of the four dependency files (tfftp.c, tfftp.h,
    fto.c, fto.h) has a timestamp newer than the object files, the object files should
    be rebuilt.


    Now you may have noticed that this is not a wise rule. If only tfftp.c is changed,
    we need to build only tfftp.c but with this we are also building which may not
    be required. However this type of rule may be useful when a single dependency
    may affect many targets. For example, both fto.o and tfftp.o may be dependent
    on common.h file and the following rule will make sense.


    ```

    $(targets): common.h

    gcc -c tfftp.c

    gcc -c fto.c

    ```


    We will discuss more these things and how to write more comprehensive rules in
    makefiles later in this chapter.'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Rule to Build the Default Goal


    After defining the variables, the first rule defines the default goal. This is
    usually used to build one or more final executable from all of the source, object
    and library files.


    # Rules to Build Other Goals


    After defining the default goal, you can define as many other rules as you like.
    These other rules are used to build individual parts of a big project. For example,
    if a project consists of three parts: the FTP server, the TFTP server and the
    DNS resolver, you can have three rules for all of these individual parts. The
    default goal may be used to build all of these three targets in a single step.


    # Rules to Build Individual Objects


    In addition to rules to build goals, you may have to define rules to build individual
    objects or intermediate files. One example of these rules is to build object files
    from the source files. These object files may then be used to build executable
    or library files.


    # Rules to Install


    Some rules may be required to install the files into appropriate directories created
    by other rules. For example, after building library files, you may want to install
    them into /lib or /usr. Similarly, after building executable files, you may want
    to install them into /bin or any other directory of your choice. For this reason,
    one or more rules may be defined in the makefiles so that make copies the appropriate
    files into their target location.


    # Rules to Clean Previous Builds


    As mentioned earlier, the rule to clean previous builds is usually a phony rule
    to clean up the source code tree from the previously built intermediate and target
    files. This is useful when you want to hand over a clean directory to someone
    or to force everything to be rebuilt, with new options.


    # Comments and Blank Lines


    As a good convention, you can insert comment lines in makefiles so that others
    can make sense of what is there. All comments start with a hash (#) symbol. You
    can also put a comment after a command. The rule of thumb is that anything after
    the hash character will be considered a comment. If this character is the first
    character in a line, all of the line is a comment line.


    > CAUTION Any empty line that begins with a TAB is not really an empty line. It
    is considered an empty command. Empty commands are sometimes useful when you don''t
    want to take any action for a particular dependency.'
  merge: -1
  pgno: 130
- img_proc: true
  md: '# 4.1.4 Running make


    In its basic and most widely used form, simply entering “make” on the command
    line invokes the make program. Upon invocation, it reads its input file, in a
    priority order as explained earlier, and executes different commands in it to
    build the default goal. In this chapter, we are using a hypothetical project that
    builds three applications: ftp, tftp and dns-resolver. Reference to this project
    will be used in many parts of the remaining chapter. See section 4.4 for a complete
    listing of the makefiles used.


    # Building a Default Goal


    If we have a Makefile in the current directory and the default goal is to build
    all of the ftp, tftp, and dnsresolver, by “all” rule, a typical session will be
    as follows:


    ```

    [root@rr2 test#] make

    gcc -g -o2 -c ftp.c

    gcc -g -o2 -c common.c

    gcc -static ftp.o common.o -o ftp

    gcc -g -o2 -c tftp.c

    gcc -static tftp.o common.o -o tftp

    gcc -g -o2 -c dnsresolver.c

    gcc -static dnsresolver.o common.o -o dnsresolver

    [root@rr2 test#]

    ```


    # Building a Non-Default Goal


    If we have multiple goals in a Makefile and you don’t want to build a default
    goal, you have to specify the goal you want to build on the command line. The
    following line builds only the ftp server:


    ```

    [root@rr2 test#] make ftp

    gcc -g -o2 -c ftp.c

    gcc -g -o2 -c common.c

    gcc -static ftp.o common.o -o ftp

    [root@rr2 test#]

    ```


    # When a Target is Updated


    There are certain rules about when a target will be built or rebuilt. These are
    listed below.


    +   * Target is not present. If a target is not present and a rule is executed,
    the target will always be rebuilt.

    * Target is outdated. This means that one or more dependencies of a target are
    newer than the target. This happens when someone changed a dependency after the
    target was built last time.

    * Target is forced to be rebuilt. You can define rules to force a target to be
    rebuilt whether a dependency has changed or not. This is also true for phony targets.'
