  md: 'Glibc 2.1.3, which allows dynamically linked programs to run on the embedded
    platform.


    +   - X-Free version 4.0.2

    - Ncurses library

    - Bash shell

    - Busybox which is a Swiss army knife of generally used UNIX utilities

    - Networking suite and utilities

    - Use management utilities

    - Modules handling utilities

    - Syslog/klogd

    - Terminal handling


    Onboard flash memory is divided into three parts. Partition mounted on / is read-only
    at the boot time and contains Linux system. Two other file systems /var and /var/tmp
    are mounted as read-write at the boot time and can be used to store temporary
    files. In addition to that, you can also use the removable flash card to store
    files. Bundled utilities on accompanying disks can be used to re-install the operating
    system or add new components. In networked systems, you can also use a NFS server
    to add more storage space.


    Arcom provides RedHat 62 CD that you can use to install Linux on a PC. This PC
    will be used as the development system or a host machine. The Arcom Embedded board
    will act as the target system. This means that in addition to the single board
    computer with Embedded Linux installed on it, you also get the Linux operating
    system to use as a development-platform.


    # 8.6.2 Artesyn PM/PPC Mezzanine Card


    The other embedded system used in the development of this book is Artesyn PM/PPC
    mezzanine card that can be plugged into a carrier card. Artesyn also supplied
    the carrier card for this purpose. It is a PowerPC 750 base card and provides
    the Ethernet and serial interfaces to the outside world directly from the PMC
    (PPC Mezzanine Card). It contains 64 Megabytes of RAM, I²C bus, general purpose
    timers, real-time clock, LEDs and on. The board also contains flash memory that
    can be used to store the operating system and utilities. It has a real-time clock
    and PLD used to setup memory map The CPU runs at 333 MHz. Boot flash is used to
    store the operating system. The optional JTAG connector can be used to download
    and debug code.


    As mentioned earlier, you will need a carrier card to power up the PMC and Artesyn
    provides you with a CC1000 PMC carrier card that can host up to two PMC. CC1000
    can be placed into a Compact PCI chassis that allows 6 U cards to be plugged in.


    More information can be found on the Artesyn web site http://www.artesyncp.com
    or by sending an email to info@artesyncp.com.'
