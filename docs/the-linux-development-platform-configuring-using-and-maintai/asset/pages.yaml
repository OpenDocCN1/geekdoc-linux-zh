    +   * The info frame command shows more information about the current frame, including
    some register values. It also shows the stack pointer for the previous frame.
    These values are taken from the stack.

    * The info args command displays arguments passed to this frame. This is also
    taken from the stack.

    * The info locals command displays the values of local variables. These variable
    have a scope limited to the current frame.

    * The info reg command displays register values, including math registers.

    * The info all-reg command displays register values, in the stack. This means
    if you are inside a function call, the up command will take you to the function
    that called the current function. The down command is opposite to the up command.

    * You can use backtrace, up and down commands to move around in different frames.
    These commands are useful for looking into stack data.


    A combination of these commands used with other execution control command can
    be used to display a lot of information. If you want to effectively use GNU debugger,
    knowledge of commands related to stack is a must.


    # ## 5.5 Displaying Variables


    Using the GDB debugger, you can display environment variables as well as your
    program variables during the program execution. You can control display of some
    variables so that the value of these variables is displayed with each command.
