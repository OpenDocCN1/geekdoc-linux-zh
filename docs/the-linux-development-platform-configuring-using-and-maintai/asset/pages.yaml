    Note that the first two lines of the output create object files using implicit
    rules. You may also have noted that the CFLAGS variable is also used in this process.
    Like CFLAGS, implicit rules use other variables while building targets. For a
    more detailed discussion, please see the reference at the end of this chapter.


    While using implicit rules, you should be careful about the process, because make
    can build a target using explicit depending upon upon source files are available.
    For example, make can produce an object file from a C source code as well as Pascal
    source code. In the above example, if common.c file is not present but common.p
    (Pascal source code) is present in the current directory, make will invoke Pascal
    compiler to create common.o file, which may be wrong. You also have less control
    over options in implicit rules.


    # 4.3 Using Variables


    Variables are an important part of all makefiles in a project. Variables are used
