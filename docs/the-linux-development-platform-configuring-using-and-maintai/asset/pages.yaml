  md: '# 2.2.4 Language Modes


    Emacs recognizes a number of different programming language files based on their
    extensions. When you load a recognized source code file, Emacs will assume certain
    defaults and enter the appropriate mode for editing that file.


    For example, when you load a file with a .c extension for editing, Emacs sets
    the appropriate mode and enables commands used to automatically and manually indent
    code, quickly move through functions and insert comments.


    When a mode is on, Emacs can automatically indent code as you type. To turn this
    mode off, type ^CA. The same command is used to turn this mode back off.


    With this mode active, auto-indenting takes place when certain characters are
    entered from the keyboard. These characters are the semi-colon, curly braces,
    and under certain circumstances, the comma and colon.


    For example, if auto-indent (or technically c-toggle-auto-state) is on and the
    following code is typed into the buffer:


    ```

    void main ( int argc, char **argv) { while (


    it will be formatted by Emacs as:


    void main ( int argc, char **argv)

    {

    while (

