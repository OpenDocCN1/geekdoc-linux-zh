  md: 'VIM


    # 2.4 VIM


    VIM stands for Vi Improved menus was developed by Bram Moolenaar. It is based
    on the functionality of the original, non-open source vi editor. While most open
    source software is also free, VIM is distributed as Charityware. In exchange for
    using the program, the authors request that users consider donating to the Kibaale
    Children''s Center (KCC), a charity providing, health care and education for the
    children in the area. For further information regarding this donation program
    and the KCC, within VIM, type :help ifcc or visit http://www.vim.org/


    # 2.4.1 Using VIM


    VIM is available in both text-based and graphical modes. The graphical version,
    shown in Figure 2-11, has the same functionality as the text-based version, but
    also provides easy access to many functions through pull-down menus and a button
    bar. To start the text-based version, use the command vim. The graphical version
    is started by typing gvim. For example, VIM and edit the file main.c, type the
    following:


    ```

    $ vim main.c

    ```


    Or, for the graphical version, type:


    ```

    $ gvim main.c

    ```


    ![](img/6c7a25ca6f0486ebfea1f3a198ad7957_60_0.png)


    Figure 2-11 gvim.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# 2.4.1 VIM Concepts


    There are two basic modes within VIM that determine VIM''s behavior. These two
    modes are Normal and Insert. In Insert mode, the editor expects the user to enter
    commands to perform a number of functions. In Insert mode, the editor inserts
    typed characters into the current document.


    The editor starts in Normal mode. To return to that mode from Insert mode, press
    the ESC key.


    # 2.4.2 Basic Editing


    As previously noted, VIM is based on the vi editor and anyone familiar with vi''s
    editing keys will immediately be at home with VIM.


    vim uses two methods of entering commands into the application. Simple commands
    such as those used for navigation and entering Insert mode are one- or two-letter
    commands that are case sensitive and do not echo as they are typed. More complex
    commands such as those used to perform searches and utilize the tags by the ctags
    program are entered and echoed into the last line of the application screen. A
    colon, slash or question mark is used to activate the last line mode and enter
    the command. The character used depend upon which command is being issued.


    Most simple commands can be preceded by a number. When this occurs, the command
    entered is treated as if it had entered that many times. For example, the command
    to delete a line in a buffer is dd. This command preceded by the number 15, as
    in 15dd, the next 15 lines in the buffer will be deleted.


    To exit VIM, type :q if the text has not been changed, :q! to abandon all changes
    made to the file, or :wq to save all changes and exit.


    For help any function, type:help <name> where <name> is the name of the function.
    Typing


    ```

    :help tutor

    ```


    will bring up information about Vims built in tutor file. This file will walk
    you through the basics of using VIM.


    # Navigation


    If the terminal that is used is set up correctly, the arrow keys on the keyboard
    will often work for simple navigation commands that move the cursor around the
    screen. If the terminal type is not properly configured, alternate keys may be
    used to navigate through the text.


    The "h", "j", "k", and "l" keys can be used in place of the left, up and right
    arrow respectively. Additionally, the cursor may be moved one word, sentence or
    paragraph at a time by using the keys listed in Table 2-13.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Table 2-13 Navigating VIM


    | Action | Command |

    | --- | --- |

    | Hjkl | Left, down, up, right |

    | W | Move one word forward |

    | E | Move one word backward |

    | () | Move to previous, next sentence |

    | [] | Move to previous, next paragraph |


    It is also possible to scroll the text on the screen without moving the cursor
    from its current position. Table 2-14 lists some of the more common commands.


    # Table 2-14 Folding Mode Commands


    | Action | Command |

    | --- | --- |

    | ^F ^B | Scroll one screen forward, backward |

    | ^U ^D | Scroll one half screen up, down |

    | ^E ^Y | Scroll one line up, down |


    # Insert Mode


    Pressing “I” will insert characters at the beginning of the line, and “A” will
    append characters to the end of the current line. The “o” character opens the
    line after the current one for inserting text, and the “O” key creates a new line
    above the current one and positions the cursor to enter new text.


    Table 2-15 lists these commands.'
