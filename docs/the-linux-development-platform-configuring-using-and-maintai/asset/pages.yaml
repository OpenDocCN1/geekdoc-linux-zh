  md: "This is sometimes useful if you just want to test the behavior of indent without\
    \ modifying a file.\n\nThe most efficient use of indent is through a shell script\
    \ that goes into each directory of the source code tree and indents each file\
    \ in the project. You may also create a rule in the makefile of a project to indent\
    \ all files in one or all directories. A typical makefile may look like the following:\n\
    \n```\nindent:\n  indent *.c\n  indent *.cpp\n  indent *.h\n```\n\nIn the case\
    \ of a project with multiple subdirectories, you can have a more sophisticated\
    \ rule. Taking an example from Chapter 4, where we have four subdirectories, you\
    \ can use the following rule to go into each directory and indent all C source\
    \ files.\n\n```\nSUBDIRS = $(COMDIR) $(FTPDIR) $(TFTPDIR) $(DNSDIR)\nindent:\n\
    \  for i in $(SUBDIRS); do \\\n    cd $$1; indent *.c \\\\n  done\n```\n\nKeep\
    \ in mind that indenting all of the files, you may have to build the whole project\
    \ source code files have been modified. In big projects this process may take\
    \ a while.\n\nIndent uses a configuration file called .indent.pro, which should\
    \ be present in the current directory or in your home directory. You can use this\
    \ to set options that you always use. If the file is present in the current directory,\
    \ it is used instead of the file in the home directory of the user. By creating\
    \ a different .indent.pro file in different directories of a project, you can\
    \ apply different indentation rules in different directories. This is especially\
    \ useful when a project uses multiple languages. For example, indentation rules\
    \ may be different for C, C++ and assembly language.\n\n# 7.1.2 Selecting Coding\
