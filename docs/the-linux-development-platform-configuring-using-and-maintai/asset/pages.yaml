    # 5.6.1 Continuing from Break Point


    You can continue execution of your program when you reach a break point in many
    ways. You can start tracing the program by line using next or step commands. You
    can also use the continue command that will run the program from its current location
    until the program reaches its end or you find another break point on the way.
    You have already seen how to use the step and next commands. The following session
    creates a break point in the start of the main function and then uses the continue
    command to start execution from there.


