    find out if a program fails during a particular system call. This may be especially
    helpful when testing device drivers and reading or writing to drivers for some
    reason.

    The common options used with this utility are shown in Table 7-4.


    # Table 7-4 Common options with the ltrace utility


    | Option | Description |

    |---|---|

    | -d | Debug. Displays extra information about trace. |

    | -f | Trace child processes. |

    | -S | Display system calls and library calls. |

    | -r | Display time difference between successive lines. |

    | -tt | Display time stamp with each line with a resolution to microseconds. |

    | -o filename | Record output to a file. |

    | -V | Display version. |

    | -h | Display help. |


    The command can also read options from its configuration file /etc/ltrace.conf
    or .ltrace in the home directory of the user.

    ltrace utility is a more comprehensive tool and can be used to separate different
    system calls. For example, it can be used to display information about network
    related system'
