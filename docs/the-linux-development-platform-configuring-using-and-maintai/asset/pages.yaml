    # 5.4 Working with the Stack


    One of the most important tasks during the debugging process is to deal with the
    stack. The stack provides a lot of information about what happened in the past.
    You can backtrack to higher levels in the stack using gdb. Using the backtrack
    feature, you can move step-by-step backward to find out how you reached the current
    position. To demonstrate some of the commands used with stack, let us take the
    example of sum.c program that you used in the last section. The program takes
    two numbers as input and then calls a function to sum() to add these two numbers.
    The function returns the result back to the main function.


    When you start debugging this program, first set up a break point at the beginning
    of the function and use the next command repeatedly until you reach the line where
    the function is called. At this point you use the step command instead of the
    next command to move into the function code. After entering the function code,
    some other commands related to stack are used in the following gdb session. These
    commands are explained at the end of this session listing.'
