- img_proc: true
  md: "# 2.3.1 Configuring Jed\n\nIndividual users may change their default setting\
    \ by copying JEDROOT/lib/jed.rc to .jedrc in their home directory:\n\n```\n$ cp\
    \ /usr/share/jed/lib/jed.rc ~/.jedrc\n```\n\nThis file may be edited to change\
    \ the initial values and behavior of Jed. Lines beginning with a percent symbol\
    \ (%) are comments and are ignored when the file is read. Other than conditional\
    \ statements, all entries must end in a semi-colon (;).\n\nOne of the first options\
    \ that a user may wish to change is the emulation mode of editor. By default Jed\
    \ uses Emacs-like key bindings for entering commands. Some other emulation modes\
    \ are IDE, CUA and WordStar. To select a new emulation, edit the .jedrc in the\
    \ user's home directory, comment out the current emulation and uncomment the one\
    \ that you wish to use.\n\nBelow, the user has changed the application to use\
    \ the IDE instead of the default. These key bindings resemble those used in Borland's\
    \ IDE.\n\n```\nif (BATCH == 0)\n{\n    () = evalife(\"emacs\") % Emacs-like bindings\n\
    \    () = evalife(\"edt\") % EDT emulation\n    () = evalife(\"ide\") % Borland\
    \ IDE\n    () = evalife(\"brief\") % Brief Keybindings\n    () = evalife(\"wordstar\"\
    ) % Wordstar (use ide instead)\n    () = evalife(\"cua\") % CUA-like key bindings\n\
    }\n```\n\nYou will also notice that there is a conditional statement in the example\
    \ above. This is because Jed may also run in batch mode for processing files unattended.\
    \ Statements within this block will only be processed if the application is run\
    \ in interactive mode, not when run in batch mode. While having the statements\
    \ outside of this block would not affect the application when run in batch mode,\
    \ having them separated speeds up the load time of the application when they are\
    \ needed.\n\nThere are many other configuration options available in the .jedrc\
    \ file that control how the program operates. Some of them are generic to all\
    \ modes and others are only in one mode. For example, the variable CASE_SEARCH\
    \ may be set to force case sensitivity in searches, or C_BRA_NEWLINE may be set\
    \ to force a newline character to be inserted prior to a curly-bracket in C mode.\n\
    \nJed also has the capability of calling a compiler directly and examining the\
    \ output. The standard compiler is assumed to be gcc. If you are using a different\
    \ compiler, you will need to set the Compile_Default_Compiler variable in the\
    \ .jedrc file."
