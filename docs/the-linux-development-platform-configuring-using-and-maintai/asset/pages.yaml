  md: '# Introduction to Software Development


    Software development is a complicated process. It requires careful planning and
    execution to meet the goals. Sometimes a developer must react quickly and aggressively
    to meet everchanging market demands. Maintaining software quality hinders fast-paced
    software development, as many testing cycles are necessary to ensure quality products.


    This chapter provides an introduction to the software development process. As
    you will learn, there are many stages of any software development project. A commercial
    software product is usually derived from market demands. Sales and marketing people
    have first-hand knowledge of their customers'' requirements. Based upon these
    market requirements, senior software developers create an architecture for the
    products along functional and design specifications. Then the development process
    starts. After the initial development phase, software testing begins, and many
    times it is done in parallel with the development process. Documentation is also
    part of the development process because a product cannot be brought to market
    without manuals. Once development and testing are done, the software is released
    and the support cycle begins. This phase may include bug fixes and new releases.


    After reading this chapter, you should understand how software development is
    done and the components of a software development system. At'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'Chapter 1 • Introduction to Software Development


    the end of the chapter, you will find an introduction to Linux Standard Base.
    This chapter is not specific to a particular hardware platform or tools. You will
    start learning about components of an actual software development platform in
    the next chapter.


    # 1.1 Life Cycle of a Software Development Project


    Software development is a complicated process comprising many stages. Each stage
    requires a lot of paperwork and documentation in addition to the development and
    planning process. This is in contrast to the common thinking of newcomers to the
    software industry who believe that software development is just "writing code."
    Each software development project has to go through at least the following stages:


    +   * Requirement gathering

    * Writing functional specifications

    * Creating architecture and design documents

    * Implementation and coding

    * Testing and quality assurance

    * Software release

    * Documentation

    * Support and new features


    Figure 1-1 shows a typical development process for a new product.

    There may be many additional stages and steps depending on the nature of the software
    product. You may have to go through multiple cycles during the testing phase as
    software testers finds problems and bugs and developers fix them before a software
    product is officially released. Let us go into some detail of these stages.


    # 1.1.1 Requirement Gathering


    Requirement gathering is usually the first part of any software product. This
    stage starts when you are thinking about developing software. In this phase, you
    meet customers or prospective, analyzing market requirements and features that
    are in demand. You also find out if there is a real need in the market for the
    software product you are trying to develop.


    In this stage, marketing and sales people or people who have direct contact with
    customers do most of the work. These people talk to the customers and try to understand
    what they need. A comprehensive understanding of the customers'' needs and writing
    features of the proposed software product are the keys to success in this phase.
    This phase is actually a base for the whole development effort. If the base is
    not laid correctly, the product will not find a place in the market. If you develop
    a very good software product which is not required in the market, it does not
    matter how well you build it. You can find many stories about software products
    that failed in the market because the customers did not require them. The marketing
    people'
  merge: -1
  pgno: 25
- img_proc: true
  md: '![](img/6c7a25ca6f0486ebfea1f3a198ad7957_26_0.png)


    Figure 1-1 Typical processes for software development projects.


    usually create a Marketing Requirement Document or MRD that contains formal data
    representation of market data gathered.


    Spend some time doing market research and analysis. Consider your competitors''
    products (if any), a process called competitive analysis. List the features required
    by the product. You should also think about the economics of software creation
    at this point. Is there a market? Can I make money? Will the revenue justify the
    cost of development?'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# 1.1.2 Writing Functional Specifications


    Functional specifications may consist of one or more documents. Functional specifications
    show the behavior or functionality of a software product on an abstract level.
    Assuming the product is a black box, the functional specifications define its
    input/output behavior. Functional specifications are based on the product requirements
    documentation put forward by people who have contact with the enduser of the product
    or the customers.


    In larger products, functional specifications may consist of separate documents
    for each feature of the product. For example, in a router product, you may have
    a functional specification document for RIP (Routing Information Protocol), another
    for security features, and so on.


    Functional specifications are important because developers use them to create
    design documents. The documentation people also use them when they create manuals
    for end users. If different groups are working in different physical places, functional
    specifications and architecture documents (discussed next) are also a means to
    communicate among them. Keep in mind that sometimes during the product development
    phase you may need to amend functional specifications keeping in view market requirements.


    # 1.1.3 Creating Architecture and Design Documents


    When you have all the requirements collected and arranged, it is the turn of the
    architecture team, consisting of highly qualified technical specialists, to create
    the architecture of the product. The architecture defines different components
    of the product and how they interact with each other. In many cases the architecture
    also defines the technologies used to build the product. While creating the architecture
    documents of the project, the team also needs to consider the timelines of the
    project. This refers to the date when the product is required to be on the market.
    Many excellent products fail because they are either too early or late to market.
    Marketing and sales people usually decide a suitable time frame to bring the product
    to market. Based on the timeline, the architecture team may drop some features
    of the product if it is not possible to bring it within the required time limits.


    Once components of the product have been decided and their functionality defined,
    interfaces are designed for these components to work together. In most cases,
    no component works in isolation; each one has to coordinate with other components
    of the product. Interfaces are the rules and regulations that define how these
    components will interact with each other. There may be major problems down the
    road if these interfaces are not designed properly and in a detailed way. Different
    people will work on different components of any large software development project
    and if they don''t fully understand how a particular component will communicate
    with others, integration becomes a major problem.


    For some products, new hardware is also required to make use of technology advancements.
    The architects of the product also need to consider this aspect of the product.


    After defining architecture, software components and their interfaces, the next
    phase of development is the creation of design documents. At the architecture
    level, a component is defined as a black box that provides certain functionality.
    At the design documents stage, you'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Life Cycle of a Software Development Project


    have to define what is in that black box. Senior software developers usually create
    design documents and these documents define individual software components to
    the level of functions and procedures. The design document is the last document
    completed before development of the software begins. These design documents are
    passed on to software developers and their starting coding. Architecture documents
    and MRDs typically need to stay in sync, as sales and marketing work from MRDs
    while engineering works from engineering documents.


    # 1.1.4 Implementation and Coding


    The software developers take the design documents and development tools (editors,
    developers etc.) and start writing software. This is usually the longest phase
    in the product life cycle. Each developer has to write his/her own code and collaborate
    with other developers to make sure that different components canate with each
    other. A revision control system such as CVS (Concurrent Versions System) is needed
    in this phase. There are a few other source version control systems as well as
    commercial options. The version control system provides a central repository to
    store individual files. A typical software project may contain anywhere from hundreds
    to thousands of files. In large and complex projects, someone needs to decide
    directory hierarchy where files are stored in appropriate locations. During the
    development cycle, multiple persons may modify files. If everyone is not following
    the rules, this may easily break the whole compilation and building process. For
    example, duplicate definitions of the same variables may cause problems. Similarly,
    if included files are not written properly, you can easily create the creation
    of loops. Other problems pop up when multiple files are included in a single file
    with conflicting definitions of variables and functions.


    Coding guidelines should also be defined by architects or senior software developers.
    For example, if software is needed to be ported to some other platform as well,
    it should be written on a standard like ANSI.


    During the implementation phase, developers must write enough comments inside
    the code so that if anybody starts working on the code later, he/she is able to
    understand what has already been written. Writing good comments is very important
    as all other documents, no matter how good they are, will be eventually lost.
    Ten years after the initial work, you may find only that information is present
    in the code of comments.


    Development tools also play an important role in this phase of the project. Good
    development tools save a lot of time for the developers, as well as saving money
    in terms of improved productivity. The most important development tools for time
    saving are editors and debuggers. A good editor allows a developer to write code
    quickly. A good debugger helps the written code operational in a short period
    of time. Before starting the coding process, you should spend some time choosing
    good tools.


    Review meetings during the development phase also provide help. Potential problems
    are caught early in the development. These meeting are also helpful to keep track
    of whether the product is on time or if more effort is needed to complete it in
    the required time. Sometimes you may also need to make some changes in the design
    of some components because of new'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'requirements from the marketing and sales people. Review meetings are a great
    tool to convey these new requirements. Again, architecture documents and MRDs
    are kept in sync with any changes/problems encountered during development.


    # 1.1.5 Testing


    Testing is possibly the most important phase for long-term support as well as
    for the reputation of the company. If you don''t control the quality of the software,
    it will not be able to compete with other products on the market. If software
    crashes at the customer site, your customer loses productivity as well money and
    you lose credibility. Sometimes these losses are huge. Unhappy customers will
    not buy your products and will not refer other customers to you. You can avoid
    this situation by doing extensive testing. This testing is referred to as Quality
    Assurance, or QA, in most of the software world.


    Usually testing starts as soon as the initial parts of the software are available.
    There are multiple types of testing and these are explained in this section. Each
    of these has its own importance.


    # 1.1.5.1 Unit Testing


    Unit testing is testing one or one component of the product. The developer usually
    does this when he/she has completed writing code for that part of the product.
    This makes sure that the component is doing what it is intended to do. This saves
    a lot of time for testers as well as developers by eliminating many cycles of
    software being passed back and forth between the developer and the tester.


    When a developer is confident that a particular part of the software is ready,
    he/she can write test cases to test functionality of this part of the software.
    The component is forwarded to the software testing people who run test cases to
    make sure that the unit is working properly.


    # 1.1.5.2 Sanity Testing


    Testing is a very basic check to see if all software components compile with each
    other without a problem. This is just to make sure that developers have not defined
    conflicting or multiple functions or global variable definitions.


    # 1.1.5.3 Regression or Stress Testing


    Regression or stress testing is a process done in some projects to carry out a
    test for a longer period of time. This type of testing is used to determine behavior
    of a product when used continuously over a period of time. It can reveal some
    bugs in software related to memory leakage. In some cases developers allocate
    memory but forget to release it. This problem is known as memory leakage. When
    a test is conducted for many days or weeks, this problem results in allocation
    of all the available memory until no memory is left. This is the point where your
    software starting abnormal behavior.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Life Cycle of a Software Development Project


    Another potential problem in long-term operation is counter overflow. This occurs
    when you increment a counter but forget to decrement, resulting in an overflow
    when the product is used for longer periods.


    The regression testing may be started as soon as some components are ready. This
    testing testing process requires a very long period of time by its very nature.
    The process should be continued as more components of the product are integrated.
    The integration process and communication through interfaces may create new bugs
    in the code.


    # 1.1.5.4 Functional Testing


    Functional testing is carried out to make sure that the software is doing exactly
    what it is supposed to. This type of testing is a must before any software is
    released to customers. Functional testing is done by people whose primary job
    is software testing, not the developers themselves. In small projects where a
    company cannot afford dedicated testers, others may do functional testing also.
    The key point to keep in mind is that the person who wrote a software component
    should not be the person who tested it. A developer will tend to test the software
    the way he/she wrote it. He/she may easily miss any problems in the software.


    The software testers need to prepare a testing plan for each component of the
    software. A testing plan consists of test cases that are run on the software.
    The software tester can prepare these test cases using functional specifications
    documents. The tester may also get help from the developer to create test cases.
    Each test case should include methodology used for testing and expected results.


    In addition to test cases, the tester may also need to create a certain environment
    to test the functionality of a piece of code. For example, you may simulate a
    network to test routing algorithms that may be part of a protocol.


    The next important job of the tester is to create a service request if an anomaly
    is found. The tester should include as much information in the service request
    as possible. Typical information in reporting bugs includes:


    +   * Test case description

    * How the test was carried out

    * Expected results

    * Results obtained

    * A particular environment was created for testing, a description of that environment


    The service request should be forwarded to the developer so that the developer
    may recover the problem. Many software packages are available in the market to
    track bugs and fix problems in software. There are many web-based tools as well.
    For a list of freely available open source projects, you can go to http://www.osdn.org
    or http://www.sourceforge.net and search for “bug track”. OSDN (Open Source Developers
    Network) hosts many open source software development projects. You can find software
    packages that work with CVS also. CVS is explained in Chapter 6 of this book.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# 1.1.6 Software Releases


    Before you start selling any software product, it is officially released. This
    means that you create a state of the software in your repository, make sure that
    it has been tested for functionality and freeze the code. A version number is
    assigned to released software. After releasing the software, development may continue
    but it will not make any change in the released software. The development is usually
    carried on in a new branch and it may contain new features of the product. The
    released software is updated only if a bug fix is released.


    Usually companies assign incremental version numbers following some scheme when
    the next release of the software is sent to market. The change in version number
    depends on whether the new software contains a major change to the previous version
    or it contains bug fixes and enhancement to existing functionality. Releases are
    also important because they are typically compiled versions of a particular version
    of the code, and thus provide a stable set of binaries for testing.


    # 1.1.6.1 Branches


    In almost all software development projects, a revision or version control system
    is used. This version control system keeps a record of changes in source code
    files and is built in a tree-like structure. When software is released, the state
    of each file that is part of the release should be recorded. Future developments
    are made by creating branches to this state. Sometimes special branches may also
    be created that are solely used for bug fixing. CVS is discussed in detail in
    Chapter 6.


    # 1.1.6.2 Release Notes


    Every software version contains release notes. These release notes are prepared
    by people releasing the software version with the help of developers. Release
    notes show what happened in this software version. Typically the information includes:


    +   - Bug fixes

    - New functionality

    - Detail of new features added to the software

    - Any bugs that are not yet fixed

    - Future enhancements

    - If a user needs a change in the configuration process, it is also mentioned
    in the release notes


    Typically a user should be given enough information to understand the new release
    enhancements and decide whether an upgrade is required or not.


    # 1.1.7 Documentation


    There are three broad categories of documentation related to software development
    processes.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Life Cycle of a Software Development Project


    +   1. Technical documentation developed during the development process. This
    includes architecture, functional and design documents.

    2. Technical documentation prepared for technical support staff. This includes
    technical manuals that support staff use to provide customer support.

    3. End-user manuals and guides. This is the documentation for the end user to
    assist the user getting started with the product and using it.


    All types of documents are necessary for different aspects of product support.
    Technical documents are necessary for future development, bug fixes, and adding
    new features. Technical documentation for technical support staff contains information
    that is too complicated for the end user to understand and use. The support staff
    needs this information in addition to use manuals to better support customers.
    Finally each product must contain user manuals.


    Technical writers usually develop manuals which are based on functional specifications.
    In the timelines of most software development projects, functional specifications
    are prepared before code development starts. So the technical writers can start
    writing user manuals while developers are writing code. By the time the product
    is ready, most of the work on user manuals has already been completed.


    # 1.1.8 Support and New Features


    Your customers need support when you start selling a product. This is true regardless
    of the size of the product, and even for products that are not software related.
    Most common support requests from customers are related to one of the following:


    +   - The customer needs help in installation and getting started.

    - The customer finds a bug and you need to release a patch or update to the whole
    product.

    - The product does not fulfill customer requirements and a new feature is required
    by the customer.


    In addition to that, you may also want to add new features to the product for
    the next release because competitor products have other features. Better support
    will increase your customer loyalty and will create business for you.


    You may adopt two strategies to add new features. You may provide an upgrade to
    the current release as a patch, or wait until you have compiled and developed
    a list of new features and make a new version. Both of these strategies are useful
    depending on how urgent the requirement for new features is.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# 1.2 Components of a Development System


    Like any other system, a development system is composed of many components that
    work together to provide services to the developer for the software development
    task. Depending upon the requirements of a project, different types of components
    can be chosen. Many commercial companies also sell comprehensive development tools.
    On Linux systems, all are available and you can choose some of these depending
    upon your level of expertise with these tools and your requirements. Typically
    each development platform consists of the following components:


    +   * Hardware platform

    * Operating system

    * Editors

    * Compilers and assemblers

    * Debuggers

    * Version control system

    * Collaboration and bug tracking


    Let us take a closer look on these components and what role they play in the development
    cycle.


    # 1.2.1 Hardware Platform


    This is the tangible part of the development system. A hardware platform is the
    choice of your hardware, PC or workstation, for the development system. You can
    choose a particular hardware platform depending upon different factors as listed
    below:


    Cost: Depending upon budget, you may choose different types of hardware. Usually
    UNIX workstations are costly to buy and maintain. On the other hand, PC-based
    workstations are cheap and the maintenance cost is also low.


    Performance: Usually UNIX workstations have high performance and stability compared
    to PC-based solutions.


    Tools: You also need to keep in mind availability of development tools on a particular
    platform.


    Development Type: If the target system is the same as the host system on which
    development is done, the development is relatively easy and native tools are cheap
    as well, compared to cross-platform development tools.


    Depending upon these factors, you may make a choice from the available hardware
    platforms for development.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'If hardware is part of the final product, selection of hardware platform also
    depends upon customer/market requirement.


    # 1.2.2  Operating System


    Choice of a particular operating system may be made depending upon:


    +   - Cost

    - Availability of development tools

    - Hardware platform

    - Native or cross compiling


    Some operating systems are cheaper than others. Linux is an excellent choice,
    as far as is concerned. Linux is also a very good operating system as it has all
    of the development tools available. Now you can install Linux on high-end workstations
    on Sun Microsystems, HP. and IBM as well as commodity hardware available everywhere.
    It provides stability and most of the people are familiar with development tools.
    You can also use the operating system for cross-platform development using GNU
    tools.


    # 1.2.3  Editors


    Editors play an important role in the development work. Easy-to-use and feature
    rich editors, like Emacs, increase developers'' productivity. You should look
    at a few things while selecting editors. These features include:


    +   - Understanding syntax of language

    - Collapsing of context

    - Support of tags

    - Opening multiple files

    - Easy editing for generally used editing functions like cut, copy, paste, search,
    replace and so on

    - Multiple windows

    - Support of defined functions and macros


    If you look at the open source community, you can find a lot of good editors available
    to developers. The most commonly used editors are Jed, Emacs and Xemacs. However,
    many other variants of these editors are also available. You can use X-Windows-based
    editors available on Linux platform. A lot of people also edit in vi or vim, both
    of these have been very popular historically.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# 1.2.4 Compilers and Assemblers


    Compilers and assemblers are the core development tools because they convert source
    code to executable form. Quality of compilers affect the output code. For example,
    some compilers can do much better code optimization compared to others. If you
    are doing some cross-platform development, then your compiler should support code
    generation for the target machine well.


    GNU compilers collection, more commonly called GCC, is a comprehensive set of
    compilers for commonly used languages including the following:


    +   * C

    * C++

    * Java

    * Fortran


    In addition to GCC, you can find a lot of other open source compilers available
    for Linux. Some of these are introduced in Chapter 3.


    GNU utilities, also known as binutils, includes GNU assembler and other utilities
    that can be used for many tasks. GNU assembler is used whenever you compile a
    program using GNU compiler.


    # 1.2.5 Debuggers


    Debuggers are also an important part of all development systems. You can''t write
    a program that is free of bugs. Debugging is a continuous part of software development
    and you need good tools for this purpose. GNU debugger, more commonly known as
    GDB, is a common debugger. Many other debuggers are also built on this debugger.
    The GNU debugger and some other debuggers will be introduced later in this book.


    # 1.2.6 Version Control Systems


    The revision control system is a must for any serious development effort where
    multiple developers work on a software product. The most popular version control
    system on Linux is known as Concurrent Versions System or CVS. CVS allows many
    people to work on files at the same time and provides a central repository to
    store files. Developers can check out files from this repository, make changes
    and check the files back into the repository. CVS also works with editors like
    GNU Emacs.


    When multiple developers are modifying the same file at the same time, conflict
    may occur between different changes made by multiple developers. When a conflict
    is detected in the files being checked in, CVS provides a mechanism to merge the
    files appropriately.


    CVS can be used over secure links as well. This is required when developers are
    not physically located at the same place. A server on the Internet can be used
    to provide secure access to the central software repository.'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# Selection Criteria for Hardware Platform


    There are other version control systems as well which are popular in the software
    development community. Examples are Aegis, PRCS, RCS and SCCS.


    # 1.2.7 E-mail and Collaboration


    In any software development project, collaboration among developers, designers
    and architects as well as marketing people is a must. The objective can be achieved
    in many ways. Probably e-mail is the most efficient and cheapest way. Some collaboration
    tools provide more functionality than just e-mailing.


    # 1.2.8 X-Windows


    X-Windows is much more than just a GUI interface on Linux, but for development
    purposes, it provides a very good user interface. This is especially useful for
    editors like Emacs.


    # 1.2.9 Miscellaneous Tools


    Many miscellaneous tools are also important during the development process. Some
    of these tools are listed below:


    +   * The make utility

    * The ar program

    * The ranlib utility

    * The hexdump utility


    Information about these tools is provided later in this book.


    # 1.3 Selection Criteria for Hardware Platform


    The development process needs computers, networks, storage, printing and other
    hardware components. However the important hardware decision is the selection
    of PCs and workstations for developers. There is no hard and fast rule about how
    to select a particular hardware platform. It depends upon the requirements of
    a development project. Some factors that you may keep in mind as follows:


    +   * Cost of the hardware.

    * Availability of desired operating system on the hardware. For example, you can''t
    run HP-UX on PCs.

    * Availability of development tools.

    * Maintenance cost.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'There may be other factors as well and you are the best person to judge what
    you need. However, keep in mind that reliability of hardware is one major factor
    that people usually overlook. If you buy cheap systems that decrease productivity
    of developers, you lose a lot of money.


    # 1.4 Selection Criteria for Software Development Tools


    After selecting the hardware, software development tools are the next major initial
    expense in terms of money and time to set these up. Selection of software development
    tools depends upon the choice of hardware and operating system. In many cases
    GNU tools are very well suited. Selection of development tools also has a major
    effect on the productivity of the whole development team.


    # 1.5 Managing Development Process


    In large software development projects, management of the development process
    is a big task and a dedicated person may need to take care of this aspect of the
    project. A development manager usually acts as a binding and coordinating force
    among different parties with conflict-interests. These parties include:


    +   * Marketing and sales people who put forward requirements, change requirements
    and come up with new requirements, usually when much of the work is already done!

    * Architecture and design people.

    * Software developers who think that they always have less amount of time.

    * Release management people.

    * Software testers.

    * Documentation writers.

    * Senior managers who often push to complete the project earlier than the deadline.


    Considering all of these parties is not an easy task. The manager has to convince
    senior management that a new feature needs much time for development. At the same
    time he has to push developers to meet the deadlines. Some of the important tasks
    of software management in a real-life project are as follows.


    # 1.5.1 Creating Deadlines


    The manager usually coordinates with the software developers to set reasonable
    deadlines for certain features. These deadlines must conform to the product delivery
    time lines. The manager may have to arrange additional resources to complete feature
    development in the allotted time.


    Project management software can help a manager to set and meet deadlines and track
    completion of different components.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# 1.5.2 Managing the Development Team


    The manager has to keep track of how development among different parts of the
    software is going on. If part of the product is behind schedule, she has to re-arrange
    resources to get it back track.. She may also need to hire new people to finish
    the development of a particular component on schedule.


    # 1.5.3 Resolving Dependencies


    Usually software components are dependent on one another. If the development of
    one component is lagging behind, it may affect development of other components.
    The developer-manager needs to keep an eye on these dependencies and how these
    may affect the overall progress of the project. Well-known project management
    methods are usually helpful for this task.


    # 1.6 Linux Development Platform Specifications (LDPS) and Linux Standard Base
    (LSB)


    Linux Development Platform Specifications or LDPS was an effort to design a common
    specification so that programs developed on one distribution could be easily ported
    to other distributions. The specifications define components and packages that
    must be present on Linux development workstations. The latest version of the specifications
    at the time of writing this book is available at http://www.freestandards.org/ldps/1.1/ldps-1.1.html
    web site.


    Linux Standard Base or LSB (http://www.linuxbase.org/) is the new forum to standardize
    Linux distributions. LSB specifications 1.1.0 is available at the time of writing
    this book. LSB compliant applications can run on any LSB compliant distribution
    without any modification or recompilation process. Specifications are detailed
    and the latest version can be found at http://www.linuxbase.org/spec/


    # 1.6.1 Libraries


    The following libraries will be available on LSB compliant systems. While developing
    applications for Linux, the developer can assume presence of these libraries on
    target machines, provided the target is LSB compliant.


    +   - libX11

    - libXt

    - libGL

    - libXext

    - libICE

    - libSM

    - libdl

    - libcrypt'
