  md: "# 2.3.3 Folding Code\n\nThe ability to fold buffers in order to view only the\
    \ parts of a file that are necessary at the time is quite useful when trying to\
    \ understand program flow and how the application is put together at a very high\
    \ level.\n\nIn order for folding to be used, special markers must be put in the\
    \ file at the appropriate points. There are two markers, one to denote the beginning\
    \ of a section to be folded and one to denote the end. In plain text files, these\
    \ markers must be in the leftmost column; but when an application language that\
    \ is recognized by Jed is, these markers may be inserted in anywhere.\n\nThe opening\
    \ marker is three left braces \"{{\" and the closing is three of the right \"\
    }}\". To insert marker into a C-language program, place the markers directly after\
    \ the /** that begins the comment:\n\n```\n/* Deep magic begins here. */\nnx =\
    \ n[i];\na = ((a<<19)^(a>>13)) + n[(i+128)&255];\nn[i] = y = n[x&255] + a + b;\n\
    r[i] = d = n[(y>>8)&255] + x;\n*/\n```\n\nWhen the file is folded up, the above\
    \ section of code will appear as follows:\n\n```\n/* Deep magic begins here. ...\
    \ */\n```\n\nThe ellipsis at the end of the line indicates that this section of\
    \ Perl code with the fold markers in place may be unfolded.\n\nFigure 2-10 shows\
    \ the same folded file.\n\n| F10 key >> | Edit | Search Buffers | Windows System\
    \ | Help |\n|---|---|---|---|---|---||\n| i-1: | | | | | |\n| ### // Seed in awesome.conf\
    \ file and parse it\n| open(SOURCE, \"source.conf\") or die(\"Can't open input\
    \ file: $!\");\n| chop($source = <SOURCE>);\n| close(SOURCE);\n| @defs=grep(\"\
    /define*/, $source);\n| foreach (@defs) {\n|  ($var, $key, $val) = split(/\\s*/,,\
    \ 3);\n  $DEF[$var] = $val;\n}\n| ### Print out the HTML HEADER\n| HEADER: print\
    \ \"<HEADER><TITLE><$title></TITLE></HEADER>\\n\";\n| print \"<BODY BACKGROUND=\\\
    $bg[background1]\\>\\n\";\n| print \"<center>\\n\";\n| print \"<table padding=\\\
    $cell[padding] border=\\$border[border]>\\n\";\n| ### Main body of the page\n\
    | ----------*ed (0,99,12) Emacs: gallery.pl (perl) 14/94 11:04pm------|\n\nFigure\
    \ 2-9 shows the folding markers in place."
  merge: -1
