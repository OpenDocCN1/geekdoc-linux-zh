    # 6.4.2 Remote Repositories


    As mentioned earlier, there are several methods of accessing a remote CVS server.
    The first one we will discuss is the built-in functionality. This method utilizes
    a network connection from the developer''s desktop to port 2401/tcp on the server.
    It requires that all of the intermediate networking equipment (routers, firewalls,
    etc.) permit this traffic to pass.


    Accessing a repository using the pserver method requires additional information
    when compared to the local access in order to determine the name of the remote
    host, the user name to be used, and the remote connection method.


    For example, in order to log into a remote CVS repository, you would need to specify
    the following:


    ```

    # export CVSROOT=:pserver:user@hostname:/usr/local/cvsroot

    ```


    Where your CVS username is on the machine host. This may be used in the CVSROOT
    variable or on the command line with the -d option.


    Prior to checking out, committing, or performing any other actions against a CVS
    server, the user is required to authenticate himself by issuing a login command.
    With the $CVSROOT variable set as indicated, type the:


    ```

    # cvs login

    Logging in :pserver:user@hostname:2401/usr/local/cvs

    CVS password:

    ```


    Type in your CVS password, which will then be stored in a file in your home directory
    (.cvpass).


    At that point you should be able to check out and commit software from the repository.


