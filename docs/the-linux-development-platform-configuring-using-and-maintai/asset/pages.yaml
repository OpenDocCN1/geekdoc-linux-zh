  md: '# Special Features of make


    In addition to the normal use of the make utility, it has some special features.
    Two of these features are discussed here that may be of interest for a common
    use of make. These features are running make commands in parallel and running
    make in non-stop mode.


    Running multiple commands in parallel enhances the efficiency of make. Running
    make in non-stop mode is useful for very large projects where you want to go through
    everything while running a command without stopping, even in case of errors. You
    can redirect the output of make to a log file which can be viewed later to find
    out what occurred during the make processes of the whole project.


    # Running Commands in Parallel


    Usually make runs commands in serial fashion. This means that one command is executed
    and when that command is finished, the next command is executed. You can ask make
    to run many commands in parallel. This is especially useful in multi-processor
    systems to make execution fast. The only problem with this is when multiple commands
    are running in parallel, output from different commands is displayed simultaneously
    and can get mixed up. To run multiple commands in parallel, use the -j (jobs)
    command switch with make.


    If you want to specify a maximum number of concurrent commands, a number with
    the -j switch may be specified. For example, -j5 on the command line will force
    make to invoke the maximum five commands simultaneously. It is useful to note
    that in general the most efficient builds can be done with -j equal to one or
    two times the number of processes on the system. Also note that make rules are
    followed such that all dependencies are satisfied before a target is built. This
    means you will not always have the maximum number of jobs running simultaneously,
    depending upon how the makefile is written.


    # Non-Stop Execution


    The make utility executes each command while building a target. After executing
    the command, it checks the result of that command. If the command was executed
    successfully, it goes to the next command and executes. However if the command
    does not execute successfully, make exits without executing any further commands.
    It displays an error message to show that the target can''t be built.


    Sometimes, however, it is not important that each command should succeed. As an
    example, look at the following lines in the clean rule:


    ```

    clean:

    rm ftp

    rm ftp.o common.o

    ```


    If the ftp file is not there, the rm command will return a failure code. However
    we want to remove other files using the rm command in the next line. If the rule
    is listed in this way and the ftp file is not present, the output of the make
    clean will be as follows:'
  merge: -1
  pgno: 153
- img_proc: true
  md: '# Control Structures and Directives


    ```

    [root@conformix make]# make clean

    rm ftp

    rm: cannot remove `ftp`: No such file or directory

    make: *** [clean] Error 1

    [root@conformix make]#

    ```


    Now you can see that make did not attempt to execute the rm command. To overcome
    this situation, you can use a hyphen at the start of the command whose result
    code should not be checked. This way make displays an error message but continues
    to the next command. The same rule with hyphen added to the first rm command will
    be as follows:


    ```

    clean:

    -rm ftp

    rm ftp.o common.o

    ```


    Now when you invoke this rule and ftp file is not present, make will do something
    like the following:


    ```

    [root@conformix make]# make clean

    rm ftp

    rm: cannot remove `ftp`: No such file or directory

    make: [clean] Error 1 (ignored)

    rm ftp.o common.o

    [root@conformix make]#

    ```


    As you can see from the above output, make ignored the error and continued to
    the next line to remove object files.


    There are other ways to ignore errors during the make process. You can also use
    the -i command line switch to ignore errors during the make process. Another method
    is to use .IGNORE special built-in rule to ignore errors.


    # 4.6 Control Structures and Directives


    Control structures inside makefiles enable you to make some logical decisions
    depending on certain conditions. Make supports four types of decision-making directives
    as listed below:


    +   1. The ifeq directive

    2. The ifneq directive

    3. The ifdef directive

    4. The ifndef directive


    These directives are explained next. In addition to these directives, you can
    use the for control structure to execute a loop a specified number of times. Let
    us have a look at each of these.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# 4.6.1 The ifeq Directive


    The ifeq directive is used to compare two values and make a decision based upon
    thenresult. The general format of this directive is as follows:


    ```

    ifeq (value1, value2)

    block if value 1 is equal to value2

    else

    block if value 1 is not equal to value2

    endif

    ```


    The else part is optional and may not be present. This structure is useful if
    you want to

    make a decision on the basis of some criteria. For example, based upon the value
    of type of build

    (temporary or final) you want to use different levels of optimization. The following
    code in a

    makefile does that.


    ```

    ifeq ($(BUILD), final)

    $(CC) -c -02 ftp.c

    else

    $(CC) -c -01 ftp.c

    endif

    ```


    Please note that there is no TAB character before ifeq, else and endif.


    # 4.6.2 The ifneq Directive


    The ifneq directive is similar to ifeq directive. The only difference is that
    sense of

    equality is reversed. The general syntax is as follows:


    ```

    ifneq (value1, value2)

    block if value 1 is not equal to value2

    else

    block if value 1 is equal to value2

    endif

    ```


    # 4.6.3 The ifdef Directive


    The ifdef directive checks if the value of the variable is empty or not. If the
    variable is

    not empty, the ifdef part is executed, otherwise the else part is executed. The
    general strucnture of the directive is as follows:


    ```

    ifdef variable

    block if variable is non-empty

    else

    block if variable is empty

    endif

    ```


    This directive is useful to verify if a variable is defined or not. The else part
    is optional.'
  merge: -1
  pgno: 155
