- img_proc: true
  md: '# Chapter 6 • Introduction to CVS


    +   1. Have a shell account on the CVS server.

    2. Create a public/private key pair on the client.

    3. Transfer the public portion of the key to the CVS server.

    4. Set up the CVS client to use this new method.


    Depending on how the CVS server is configured, it may be possible to set up ssh
    to bypass the requirement of typing in your password every time that you interact
    with the CVS repository.


    > NOTE The key to logging without having to type in the passphrase each time is
    to specify a blank password during the key generation process. While this does
    permit you to log into the server without supplying a passphrase, anyone who has
    access to your account will be able to do the same. Make sure never to leave your
    workstation unlocked and unattended.


    Assuming the accounts have already been set up on the CVS server, the next step
    is to generate the public/private key pair. This is accomplished by using the
    ssh-keygen program.

    To generate the key pair, issue the following command (which may result in a DSA
    key with openssh.3):


    ```

    # ssh-keygen -N ""

    Generating public/private rsa key pair.

    Enter file in which to save the key (/root/.ssh/identity):

    <CR>

    ```


    Your identification has been saved in /root/.ssh/identity.

    Your public key has been saved in /root/.ssh/identity.pub.

    The key fingerprint is:

    32:66:ea:74:4a:73:28:57:bc:90:12:a3:da:78:20 lcp@client

    The -N " option uses null passphrase to protect the keys.

    As indicated by the program messages, this creates two files in the user''s $HOME/.ssh
    directory. The first one, is your private key. This should be kept secure and
    not be shared. The second, identity.pub, as you may have guessed, is the public
    key. The contents of this file need to be distributed to every machine that you
    wish to log into and access via ssh.


    To accomplish this, you can use ssh to copy the file between machines as follows:


    ```

    # cd -/.ssh

    # sc identity.pub user@cvsserver:.ssh/hostname`.pub

    ```


    Replace user@cvsserver with your username on the CVS server. For example if your
    username is dev the you would replace this with jon@dev. You could also use the
    FQDN or IP address of cvsserver. Note that the punctuation marks surrounding the
    hostname are backticks.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# References and Resources


    Next, you need to log into the CVS server and append the newly created .pub files
    to a file called authorized_keys. The authorized_keys holds the authentication
    keys for each user/machine combination that is permitted to use RSA Authentication
    to log in.


    ```

    # ssh -l username cvsserver

    # cd .ssh

    # cat client.pub >> authorized_keys

    ```


    While username and cvsserver are the same as before, client.pub should be replaced
    with the name of the machine that you generated the keys.


    At this point ssh should be set up and you should be able to move ssh into the
    CVS repository without having to enter a password or passphrase.

    The next step is to set up CVS using this new method of connecting to the repository.
    This is accomplished by set environment variables. The first you should already
    be familiar with: CVSROOT.


    When using ssh accessing the server locally or via server, the command to set
    up the CVSROOT variable should look something like this:


    ```

    # export CVSROOT=:ext:user@hostname:/usr/local/cvsroot

    ```


    The second environment variable needs to be set up as CVS_RSH. This is used with
    the :ext method to specify which command should be used to log into the remote
    server. It should be set to ssh. You may need to specify the full path to the
    ssh application if ssh is not in your PATH.


    ```

    # export CVS_RSH=ssh

    ```


    At this point you should be able to use CVS via ssh.

    You should be aware that each project, when it is checked out, keeps track of
    the method that it used to check out that project. This is in the CVS directory
    of the file called Root. If you have any projects checked out when switching access
    methods, you will want to check the projects back in and release them before switching;
    or manually edit the files for each project to inform CVS of the change in access.

    Supplying the -d option on the command line to change the access method would


