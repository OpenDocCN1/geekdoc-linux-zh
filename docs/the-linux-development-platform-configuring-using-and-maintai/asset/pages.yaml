  md: "# Chapter 3 • Compilers and Assemblers\n\nTo create static binaries, you have\
    \ to use -static command line option with gcc. To create dynamically linked output\
    \ binary files, use -shared on the command line.\n\nFor example, if we compile\
    \ the hello.c program used earlier in this chapter with shared libraries, size\
    \ of the output executable file is 1364 bytes (this can be further reduced using\
    \ the strip utility discussed in Chapter 7 of this book). However, if you compile\
    \ it statically, the size of the output binary file is 162521 bytes, which is\
    \ very large compared to the shared binary. Note that this size can also be reduced\
    \ using the strip utility.\n\nTo identify the dependencies of a dynamically linked\
    \ binary file, you can use the ldd command. The following command shows that linked\
    \ file hello depends upon two dynamic libraries.\n\n```\n[@conformix 4]$ $ ldd\
    \ hello\n  libc.so.6 => /lib/i386/libc.so.6 (0x4002c000)\n  lib/ld-linux.so.2\
    \ => /lib/ld-linux.so.2 (0x40000000)\n[@conformix 4]$\n```\n\nIf you copy hello\
    \ to some other host, you also need to make sure that libc.so.6 and ld-linux.so.2\
    \ exist on the target system.\n\nOn most of the Linux systems, dynamic linking\
    \ is done by default.\n\n# 3.3.7 Compiling Source Code for Other Languages\n\n\
    As mentioned, the GCC set of compilers supports many languages. It can be used\
    \ to compile programs other than C language. Following is an introduction to compiling\
    \ programs from other languages.\n\n# 3.3.7.1 Compiling C++ Code\n\nC++ source\
    \ files have suffixes as .c, .cpp, .cc, .c++, .cxx or .cp. The gcc compiler recognizes\
    \ these extensions and can compile C++ code. However you can also use g++ or c++\
    \ compilers, which are part of the GCC family and are installed with it. These\
    \ programs invoke gcc with appropriate options to compile C++ source code and\
    \ location of class files. do not have the standard suffixes listed earlier.\n\
    \n# 3.3.7.2 Compiling Objective C Code\n\nObjective files have suffixes as .m\
    \ and gcc recognizes Objective C files with suffix. When you compile Objective\
    \ C code, you have to pass an option to the linker. This is done using lobjc.\
    \ By this option, the linker uses Objective C libraries during the linking process.\
    \ Consider the following sample Objective C code (stored in hello.m file) to print\
    \ \"Hello World\" to the standard output.\n\n```\n#include \"objc/Object.h\"\n\
    \n@interface HelloWorld : Object\n```"
