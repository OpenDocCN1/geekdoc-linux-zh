  md: "# 5.3 Controlling Execution\n\nYou are already familiar with some of the gdb\
    \ commands used for controlling execution of a program. The commands you have\
    \ already used are run, quit and next commands. In this section you will learn\
    \ some more commands that can be used to control execution of the program. The\
    \ most commonly used commands to control execution of a program in gdb are as\
    \ follows:\n\n+   - The run command is used to start execution of a program. If\
    \ the program is already running, you can restart the execution right from the\
    \ beginning using the run command.\n- The quit command will quit the debugger.\n\
    - The kill command stops debugging but does not quit the debugger.\n- The continue\
    \ command starts executing program from the current position. The difference between\
    \ the continue and run commands is that the run commands starts execution from\
    \ the entry point of the program while the continue commands starts from the current\
    \ location.\n- The next command goes to the next line in the code. If the current\
    \ line is a function, it calls the function without going into the function code.\n\
    - The step command goes to the next line in the code. If the current line is a\
    \ function, it goes to the first line inside that.\n- The finish command takes\
    \ you out of the function call, if you are already inside one.\n- The return command\
    \ returns to the caller of the current frame in the stack. This means that you\
    \ can return from a function without actually completing the function execution.\n\
    \nThere are many ways to control execution of a program. Mastery of these methods\
    \ is necessary to debug a program more efficiently.\n\n# 5.3.1 The step and finish\
    \ Commands\n\nHere we have a short demonstration of how to use finish and step\
    \ commands when you are dealing with a function. Consider the following sum.c\
    \ program that adds two numbers and returns the result of addition. The addition\
    \ is completed inside a function called sum().\n\n```\n#include <stdio.h>\n\n\
    int sum(int num1, int num2);\n\nmain ()\n{\n    int num1, num2, total;\n\n   \
    \ printf(\"Enter first number : \",\");\n    scanf(\"%d\", &num1);\n```"
