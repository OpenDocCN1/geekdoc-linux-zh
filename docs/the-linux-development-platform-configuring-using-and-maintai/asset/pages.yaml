  md: '# 2.3.2 Using Jed


    Jed is called from the command line with an argument telling it which file you
    would like to edit. If Jed is called without an argument, it will prompt you for
    the name of the file before you may do any editing. This behavior may be changed
    by modifying the Startup_With_File variable in jedre to have a value of 0.


    Jed may be called with one or more command line arguments. A -n argument forces
    Jed to ignore the users'' local jedfile as well as the jedrec file. There is also
    an X version of Jed that allows you to use the menu to select text and options
    from the menu. To start Jed, simply type:


    ```

    $ jed <filename>

    ```


    ```

    or

    $ xjed <filename>

    ```


    Figure 2-8 shows the initial-based Jed display when no command-line argument is
    given. The menu across the top is accessed by pressing the F-10 key. This scratch
    buffer will appear when you begin to type and if a filename is given on the command
    line you will be taken immediately to begin editing.


    The basic editing features of Jed will be dependent on the emulation mode that
