- img_proc: true
  md: '# Table 2-15 Entering Insert mode


    | Action | Command |

    |---|---|

    | i a | Begin inserting characters at the cursor, after the cursor |

    | I A | Begin inserting characters at the beginning, end of the line |

    | o O | Open a new line after, before the current line |


    In addition to simply entering text into the buffer, vim can change text already
    in the document. Table 2-16 lists the commands for changing text and their function.


    # Table 2-16 Commands to change text


    | Action | Command |

    |---|---|

    | cw | Change from the current cursor position to the end of the word |

    | cc | Change the current line |

    | r | Replace the letter at the cursor |

    | R | Replace from cursor on |


    Also of the deletion commands. They are entered from Normal mode and may be used
    to delete a character; a word or a line at a time. These commands are listed in
    Table 2-17.


    # Table 2-17 Deletion commands


    | Action | Command |

    |---|---|

    | x X | Delete the character at, before the cursor |

    | dw | Delete from the cursor to the end of the current word |

    | dd | Delete the current line |

    | D | Delete from cursor to end of the current line |


    Automatic Indentation

    There are several indenting options available with VIM. They are autindent, smartindent
    and indent. The first, autindent, simply copies the indentation from the previous
    line and uses as the default for all new lines entered into the buffer. Smartindent
    and indent are similar, but indent is stricter in the way that it handles formatting
    and may not be suitable for programming languages other than C.'
