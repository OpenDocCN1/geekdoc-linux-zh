  md: "# 2.2.6 Compiling\n\nEmacs has the facility to call external compilers, parse\
    \ their output and display the results in a buffer. As the results are displayed,\
    \ the programmer can then move forward and backward through any error or warnings.\
    \ Each error or warning is displayed, the appropriate line in the code is displayed\
    \ and may be edited.\n\nTo invoke the compiler from Emacs, type M-X compile; in\
    \ response, Emacs will ask you for the command to use the compiler for the application.\
    \ You can either specify make or the command line compiler with all the options.\
    \ The default is to invoke make with the -k option in order to continue as far\
    \ into the make as it can when encountering errors.\n\nFor example, assume that\
    \ the following (broken) bit of code is in a buffer entitled ‘main.c'.\n\n```\n\
    #include <stdio.h>\n\nint main ()\n{\n    printf('Hello World\\n');\n}\n```\n\n\
    The compiler may be invoked by typing:\n\n```\nM-X compile\nCompile command: gcc\
    \ -o main.c\n```\n\nIf the buffer has been compiled not not saved, the editor\
    \ will prompt you to save it. The results of the compilation will appear in the\
    \ *compilation* buffer as seen in Figure 2-5.\n\n![](img/6c7a25ca6f0486ebfea1f3a198ad7957_53_0.png)\n\
