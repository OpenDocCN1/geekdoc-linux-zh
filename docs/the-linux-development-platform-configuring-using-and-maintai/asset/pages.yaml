- img_proc: true
  md: '![](img/6c7a25ca6f0486ebfea1f3a198ad7957_59_0.png)


    # Figure 2-10 The same file folded.


    The entire program can be folded and unfolded at once, or individual sections
    of the file may be unfolded. Several sections from different parts of the program
    may be unfolded at once.

    Jed treats each folded section as a subroutine and it can be edited as such. By
    moving the pointer to a folded section and pressing <C-c> only that section of
    the program is displayed for editing.


    In order to use the folding mode, it must be activated from within Jed. In order
    to do this, type M-X folding-mode <RETURN>. This will turn the folding mode on
    and immediately fold up the current buffer.

    See Table 2-12 for a list of the available commands in this mode.


    # Table 2-12 Folding Mode Commands


    | Action | Command |

    |---|---|

    | ^C-W | Fold current buffer |

    | ^C-O | Unfold current buffer |

    | ^C-X | Fold current marked section |

    | ^C-S | Unfold current marked section |

    | ^C-F | Fold highlighted section |

    | ^C-> | Edit folded section |

    | ^C-< | Exit current section being edited |'
