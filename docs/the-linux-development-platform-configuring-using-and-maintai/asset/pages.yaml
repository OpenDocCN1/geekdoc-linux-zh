  md: "# Compiling Program\n\nThis is because the compiler can easily determine that\
    \ all of the variables are static and there is no need to assign values and then\
    \ calculate the sum at the run. All of this can be done at the compile time. You\
    \ can also verify this fact in a debugger. The optimized code will skip over assignment\
    \ lines (lines 6 to 8) and will directly jump to the printf statement when you\
    \ step through.\n\nHowever in the following code, the compiler can't make such\
    \ decisions because the numbers a and b are interactively.\n\n```\n1 #include\
    \ <stdio.h>\n2 main() {\n3 \n4 int a, b, sum;\n5 \n6 printf(\"Enter first number:\
    \ % \");\n7 scanf(\"%d\", &a);\n8 printf(\"Enter second number: % \");\n9 scanf(\"\
    %d\", &b);\n10 \n11 sum = a+b;\n12 \n13 printf(\"The sum is: %d\\n\", sum);\n\
    14 }\n```\n\nIf you compile this code with different levels of optimization (e.g.,\
    \ -O1 and -O2), and then trace it through a debugger, you will see a difference\
    \ in execution sequence because of the way the compiler makes decisions at the\
    \ compile time. For example, code optimization changes timings or clock cycles\
    \ when the code is executed.\n\nIt may be mentioned that optimization is not always\
    \ beneficial. This especially may create problems on embedded systems if you have\
    \ debugged your code by compiling without optimization. The rule of thumb is that\
    \ you should create optimized code instead of relying on the compiler to make\
    \ optimization for you.\n\nFor a detailed list of optimization options, please\
    \ see all options starting with -O command line. However options starting with\
    \ - are the most commonly used in the optimization process.\n\n# 3.3.6 Static\
    \ and Dynamic Linking\n\nA compiler can generate static or dynamic code depending\
    \ on how you proceed with the linking process. If you create static object code,\
    \ the output files are larger but they can be used as stand-alone binaries. This\
    \ means that you can copy the file to another system and it does not depend on\
    \ shared libraries when it is executed. On the other hand, if you choose dynamic\
    \ linking, the final executable code is much smaller but it depends heavily on\
    \ shared libraries. If you copy the final executable program to another system,\
    \ you have to make sure that the shared libraries are present on the system where\
    \ your application is executed. Please note that version inconsistencies in dynamic\
    \ libraries can also cause problems."
