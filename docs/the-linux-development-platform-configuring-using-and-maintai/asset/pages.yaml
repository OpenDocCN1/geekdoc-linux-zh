  md: '# 8.5.3 Using Stubs with GNU Debugger


    Stubs are software routines that you can link with your program. Using a stub,
    you can connect the program to the GNU debugger from a remote target, eliminating
    the need for the gdbserver program.


    Stubs are different for different targets. The GNU debugger contains some stubs
    by default in the source code tree. For example, the i386-stub.c file can be used
    for targets that use Intel CPUs. However you have to customize your stubbing on
    the target. Some instructions are included in the example source code files for
    the stub.


    # 8.5.4 Debugging the Debug Session


    If you are not successful in connecting to the target machine using GDB, you can
    get help from the remote debug mode of GNU debugger. After turning this mode ON,
    you will see a lot of information on your screen when gdb establishes or tries
    to establish a connection to a remote target. This information shows packets sent
    and received by gdb. The following session shows how we set the baud to 9600 using
    the remotead command, turn the remote debug mode ON and then connect to the remote
    target on serial /dev/ttyS0.


