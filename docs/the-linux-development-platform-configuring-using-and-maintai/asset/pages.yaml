    # 6.4 Using the CVS Client


    There are several methods of accessing a CVS repository. The first is local access.
    This can be accomplished by a user logging in at the terminal or logging remotely
    over the network. Either way, the developer must have a local account on the machine,
    a home directory, and the repository to be accessed via the local session.'
