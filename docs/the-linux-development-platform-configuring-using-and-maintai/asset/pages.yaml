    # 6.4.12 Tags and Releases


    One of the strengths of CVS is its ability to create a release of a particular
    project. A release is a snapshot of a project at a specific point in time and
    is generally referred to by a numeric designation. When we refer to CVS version
    1.1.11pl, we are talking about a specific release of the application that will
    always remain the same. If changes are made to that version of the software, the
    version number will change by indicating either a patch level or an increment
    or minor version number.


    This designation can be accomplished by CVS by assigning a tag to a project. Tags
    may be named in any fashion, symbolically with a numerical system as mentioned,
    or by code names. It is important, that, once a methodology for naming releases
    is established it be abide by in order to prevent confusion in the future.


    To apply a tag to a project, follow the following command within the project directory:


    ```

    # cvs tag Release_1_1

    csvs server: Tagging

    T 1.0.fuzion.pl

    T banner.jpg

    T em.dat

    T fuzion.pl

    T index.html

    T newfile

    T sk.dat

    T tal.dat

    T test.dat

    ```


    This does not change any information in the files; it simply places symbolic tags
    in the CVS repository so when Release_1_1 of the Fuzion project is requested,
    these versions of the files will be retrieved from the repository.


    To check a specific release out of the repository, issue the checkout command
    with the -r option and name of the release.


    ```

    # cvs checkout -r Release_1_1 fuzion

    ```'
