  md: '# Using ltrace and trace Utilities


    It can read C files or take its input from standard input. This utility is not
    used in C software development but may be useful in some cases.


    # 7.6 Using ltrace and trace Utilities


    The ltrace program is a tracing utility for library function calls. It runs a
    program and logs all library function calls by that program. You can also use
    this utility to log system calls created by fork() or clone() system calls. This
    utility is very useful to quickly trace the failure point of an executable program.
    The utility may also print the time at which a particular function call or system
