  md: '# Platform Independent Development with Java


    In previous chapters most of the discussion centered around GNU development tools
    and programming in C and C++ languages. This chapter is devoted to Java development
    and describes how to use some Java tools and a Java virtual machine.


    As many of the readers already know, Java is a different language compared to
    other compile-and-execute languages in that it needs a Java virtual machine (JVM)
    to execute what is called byte code. Each platform has its own implementation
    of the Java virtual machine. There are many JVMs available on Linux platform in
    free and open source as well as commercial domains. Some virtual machines are
    also available for embedded Linux platforms that are very small in size and need
    little memory to execute. You can select a virtual machine based upon your requirements.
    Java virtual machines are built on Java Language Specifications (JLS). Information
    about JLS and books in downloadable format can be found at http://java.sun.com/docs/books/jls/


    This chapter provides some information about how to use different development
    tools on Linux. The most commonly available tools are Sun SDK and GNU gcc compiler.
    Kaffe and Jboss are other very popular open source development tools on Linux
    and these are introduced in this chapter. However please note that this chapter
    is not a tutorial on Java lan'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'guage and if you are new to the language, you get help from many other resources
    on the Internet as well as print media. Some of the most popular resources include
    Sun Java SDK, IBM Java SDK, Kaffe, and gcj.


    # 9.1 How Java Applications Work


    Java is a sort of interpreted language. Any program you write in Java is first
    compiled to generate byte code. Depending upon type of output, the byte code can
    be in the form of a Java application or a Java applet. In the case of Java applications,
    you can directly invoke the Java virtual machine to execute it. If the output
    type is an applet, it is usually loaded into a browser for execution.


    # 9.1.1 Java Compiler


    The compiler is used to build Java applications or applets from source code files.
    In most of the cases, the compiler is invoked by javac command. It also uses standard
    class libraries that are part of the Java distributions.


    # 9.1.2 Java Virtual Machine


    The purpose of the Java virtual machine is to execute Java code. In most cases,
    the virtual machine is available as the command java. To run any application,
    you can just invoke the java command with the application name as the command
    line argument.


    Kaffe is one of the popular freely available implementations of the Java virtual
    machine. You can download it from its web site http://www.ka.org. At the time
    of writing this book, version 1.0.6 is available from the web site. I am using
    RedHot 7.1 for the development of this book and this version is also part of the
    distribution. Most of the binaries are installed in /usr/bin directory. The following
    command displays version information for Kaffe:


    ```

    [root@desktop Java]# java -version

    Kaffe Virtual Machine

    Copyright (c) 1996-2000

    Transvirtual Technologies, Inc. All rights reserved

    Engine: Just-in-time v3 Version: 1.0.6

    Java Version: 1.1

    [root@desktop Java]#

    ```


    Note that the actual Kaffe Virtual machine is present as /usr/bin/kaffe and /usr/bin/java
    is a shell script like the following to invoke Kaffe.


    ```

    #! /bin/sh

    # Pret Kaffe is Java

    prefix=/usr

    exec $prefix=$usr

    exec /usr/bin/kaffe $\$@"@"

    ```'
