  md: '# Working With Editors


    One of the most fundamental tools required for application development on any
    platform is a text editor; and the Linux operating system offers programmers a
    wide variety to choose from. These editors offer a wide variety of functionality
    from simple editing features to syntax highlighting and reading e-mail.


    In this chapter, we will focus on a couple of editors that offer features that
    will be of interest to developers, *Jed*, *vim*, and *Emacs*. All of these editors
    offer extended features beyond simple text editing.


    # 2.1 What to Look for in an Editor


    While editors like *pico* or even *ed* may be useful for editing system files
    or writing quick notes, programming editors have certain features that permit
    the programmer to focus on the act of creating code and help to manage the process
    and keep an eye on syntax.


    # 2.1.1 Extensibility


    One useful feature of programming editors is the ability to extend the out-of-the-box
    functionality with custom programming.


    Emacs utilizes a full-featured Lisp language called Elisp to provide users with
    the ability to add just anything they might require to the editor. The original
    Lisp language was written in the late 1950s as part of MIT’s research into artificial
    intelligence. Elisp is derived from the original Lisp and provides surprising
    flexibility in extending Emacs for those who take the time to learn it.'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'Jed extensibility is based on the s-lang libraries (www.s-lang.org) that were
    developed by John E. Davis as a generic macro language that would become the basis
    for a number of different-programs. S-lang programs resemble C in syntax and layout.


    # 2.1.2 Understanding Syntax


    By understanding the syntax of the programming, the editor can perform a number
    of functions that make it easier for the programmer to move through the code,
    locate bugs more quickly and perform other common functions.


    Such functions include jumping to the beginning of a stanza in the code, highlighting
    that stanza, automatic indenting, highlighting syntax, and quickly inserting comments
    and comment-ing entire sections of code.


    # 2.1.3 Tag Support


    The ctags and etags utilities that come with Linux are able to build a list of
    the various functions, classes, fragments, data blocks and other information within
    the various files that make up the application. Not all information is available
    for all languages. For example, while only subroutines are supported for the Perl
    language, support for the C/C++ languages includes:


    +   * macros (macros defined/undefined by #define / #undef)

    * enumerators (enumerated values)

    * function definitions, prototypes, and declarations

    * class, enum, struct, and union names

    * namespaces

    * typedefefs

    * variables (definitions and declarations)

    * class, struct, and union members


    Emacs and vim provide the ability for the editor to understand standard tag files
    and help the programmer quickly locate and edit the portion of code that he/she
    is working on. Emacs uses the output from etags, while vi uses ctags.


    # 2.1.4 Folding Code


    Folding code refers to the ability of the editor to hide portions of code while
    they are not needed. For example, all the functions or subroutines in the code
    can be folded so that only the names of the functions are seen until the programmer
    unfolds that routine to work on it.


    # 2.2 Emacs


    Emacs is a lisp-based editor that has been around in one form or another since
    the late 1970s; despite its long history, it remains one of the most up-to-date
    and widely used editing environ.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Emacs


    ments today. From within the editor a user can read and send mail, perform research
    on the Internet, and even send out for coffee to RFC2324 compliant coffee makers.


    Configuration of Emacs is accomplished via the .emacs file that can be created
    in each user''s $HOME directory. If the configuration does not exist, Emacs will
    use its built-in defaults. This file consists of a series of elisp expressions
    that the editor evaluates when the application runs.


    # 2.2.1 Using Emacs


    Navigating and using Emacs may appear confusing and counter-intuitive for those
    just learning how to use the editor, however the time taken to master this editor
    can prove well-spent when one considers the time savings such that an integrated
    and flexible development environment provide.


    If Emacs is started within X-Windows, it will automatically open a new window
    in the desktop. To prevent this behavior, you can use the -nw option from the
    command line. Alternately, you can tell Emacs how to make the window by specifying
    the size of the window, in characters, that you wish to create. Examples are:


    ```

    $ emacs -nw main.c

    $ emacs -geometry 80x24 main.c &

    ```


    Figure 2-1 shows the initial Emacs screen if it is invoked without an initial
    file name.


    ![](img/6c7a25ca6f0486ebfea1f3a198ad7957_42_0.png)'
