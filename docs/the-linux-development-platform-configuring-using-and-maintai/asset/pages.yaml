    Location of this line with respect to other MANPATH entries is important. If you
    put this line after other entries, you will still get the old man man pages. This
    is why it is recommended to put this entry BEFORE any other line that starts with
    MANPATH keyword in this file.


    # 3.2.5 What Not to Do when Installing Development Tools


    When building GCC, don''t build it into the source directory. I would recommend
    not installing your development tools in the default location (under /usr/local).
    Instead use some place under the /opt directory. If something goes wrong, you
    can just delete this directory under /opt without making any change in the system.
    If you install these tools in the default location, you may overwrite some existing
    files and may not be able to reverse the installation process.


