  md: "Using sed Utility\n\n# 7.2 Using sed Utility\n\nThe sed utility is a stream\
    \ editor that can be used for different file editing purposes when used as a filter.\
    \ The most common task for software development purposes is the use of sed to\
    \ search and replace text in source code files. Let us take the example of the\
    \ following C source code file hello.c.\n\n```\n#include <stdio.h>\n\nmain ()\n\
    {\n    char string[25];\n\n    printf(\"Enter a line of characters : \");\n```\n\
    \nIn order to replace every occurrence of word string with the word STRING, you\
    \ can use the sed filter command and its result in shell scripts as follows:\n\
    \n```\n# cat hello.c | sed s/string/STRING/\n#include <stdio.h>\n\nmain ()\n{\n\
    \    char STRING[25];\n\n    printf(\"Enter a line of characters : \");\n```\n\
    \nThe sed command understands UNIX regular expressions. Regular expressions can\
    \ be used for a higher level of stream editing. You can also use sed in shell\
    \ scripts as well as files to carry out the entire source code directory tree.\
    \ You can also use -f options followed by a filename. The filename contains sed\
    \ commands. Please refer to the sed pages for a complete set of options.\n\n#\
    \ 7.3 Using diff Utility\n\nThe diff utility is another useful tool that developers\
    \ may need. It is used to find out the differences between two files. If you are\
