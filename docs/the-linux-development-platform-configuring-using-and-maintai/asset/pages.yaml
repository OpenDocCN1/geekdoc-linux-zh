  md: '# Bruce Perens'' Open Source Series


    ![](img/6c7a25ca6f0486ebfea1f3a198ad7957_321_0.png)


    # Embedded Software Development with eCos


    BY ANTHONY MASSA

    ©2003, Paper with CD-Rom, 432 pages, 0-13-05473-2


    This book shows developers and managers the advantages of using eCos — the Embedded
    Configurable Operating System from Red Hat — over proprietary or commercial embedded
    operating systems. It effectively demonstrates how eCos'' open-source licensing
    and royalty free nature can save thousands of dollars and hundreds of programming
    hours.


    ![](img/6c7a25ca6f0486ebfea1f3a198ad7957_321_1.png)


    # The Linux Development Platform: Configuring, Using, and Maintaining a Complete
    Programming Environment


    BY RAFEQ REHMAN AND CHRISTOPHER PAUL

    ©2003, Paper with CD-Rom, 320 pages, 0-13-009115-4


    This is an all-in-one resource for setting up, maintaining, and using Linux as
    an enterprise level deployment environment. It provides information for all the
    latest versions of the tools needed for development on Linux systems with examples
    about how to build, install and use these tools.


    ![](img/6c7a25ca6f0486ebfea1f3a198ad7957_321_2.png)


    # Implementing CIFS: The Common Internet File System


    BY CHRISTOPHER R. HERTEL

    ©2003, Paper, 400 pages, 0-13-047116-X


    This book, written by a member of the Samba Team dedicated to investigating the
    inner-workings of CIFS, gathers together and presents, in a readable, accessible
    format, all of the information sys admins need on the CIFS protocol.


    For more information visit: www.phptr.com


    PRENTICE HALL PROFESSIONAL TECHNICAL REFERENCE'
