- img_proc: true
  md: '# Sizing the Task


    SCSI drives are the main limitations in using this type of device. They are however,
    cheaper and somewhat easier to install than SCSI drives.


    SCSI devices may also be used for mass storage. CD-ROM and DVD drives, SCSI devices
    can also include scanners, printers and other devices as well.


    Up to seven devices may be attached to a single SCSI interface card inside the
    computer and a computer may have more than one interface card. The total number
    of SCSI devices installed on one computer is limited to the number of available
    interface slots on the motherboard, times seven. On most modern workstations and
    servers this will allow a total number of SCSI devices ranging from seven to over
    thirty. New SCSI standards allow more devices to be connected to a single SCSI
    adapter.


    SCSI drives are often configured in a Redundant Array of Inexpensive Disks (RAID)
    that can be used to increase the reliability and the speed of the system. The
    trade-off in this configuration is a loss of available drive space. The decrease
    in available space may be anywhere from negligible to 50% of the total space on
    the drives depending on the RAID level used.


    # A.4 Sizing the Task


    When developing requirements for any computer system, it is important to understand
    exactly what the system will be used for and how it will be used. Once the purpose
    of the computer is understood, potential bottlenecks can be located and the potential
    for these to cause problems can be minimized or eliminated.


    # A.5 Stand Alone Development Workstation


    In this configuration a workstation will be used to develop applications locally.
    The source code will be kept on the local hard drive and the editing and compiling
    will take place on the same machine.


    The main concern with this configuration would be in the area of processor and
    memory, and in having a backup system to ensure that data is not lost in the event
    of a hardware failure.


    A typical developer''s machine will have a processor in the 800+ MHz range and,
    depending on the scope of the application being developed, may have more than
    one processor: The available memory will depend on the type of application be
    written with typical machines having in excess of 256 MB of memory and, in the
    event that large amounts of data have to be manipulated, more than a gigabyte
    of memory.


    The Linux OS, with development tools, can be installed utilizing 1 gigabyte (GB)
    of disk space. The source code for the OS, which represents a decade of work from
    people all over the globe, can be installed in less than 50 megabytes of space.
    A single developer working full-time would have to be very productive in order
    to fill most drives available today as typically come in 60GB sizes. Hard drive
    space is more often used for development libraries and tools, separate runtime
    environments, etc.'
  merge: -1
  pgno: 302
- img_proc: true
  md: 'Again, disk size may have to be increased if large volumes of data are being
    used in the testing of the application.


    These estimates for simply generic in nature and would be a good starting place
    for new equipment purchases. It is entirely possible for productive development
    to take place on older, used equipment in the sub 300 MHz range. It depends entirely
    upon the application developed and the time available to accomplish the task.


    However, with the cost of equipment constantly falling, it is often well worth
    the investment in new equipment in order to reduce the compile time of the application.


    # A.6 Distributed Development—Remote Access


    This example assumes that multiple developers will be accessing a remote server
    and developing on that platform. The source code will reside on the server and
    the server will be used to compile the programs.


    In this instance, the requirements for the workstations will be modest to the
    previous example, but the need for central server is added. This server will need
    to be far more powerful than the previously specified workstation.


    The server should be as fast as the budget and circumstances permit, and the number
    of simultaneous developers using the platform should be considered. You will almost
    certainly want a server with several processors.


    It will require more disk space, preferably with RAID enabled and the most utilized
    file systems spread out over several disks. A complete backup strategy should
    be in place and tested on a regular basis to ensure that the data is secure and
    can be restored in the event that any problems should arise.


    This server will require a large amount of memory as well. Several gigabytes is
    not unreasonable for a small number of developers. Several developers trying to
    compile once can quickly drain the system''s resources.


    If the remote access strategy includes using a secure shell (ssh) to connect to
    the server, additional processing power will be required due to the encryption
    overhead.


    On the other hand, the actual workstation in this example would be comparatively
    modest. Most workstations capable of handling word processing and e-mail tasks
    should be enough of this type of load with little difficulty. All of the storage,
    access and intensive processor will take place on the server.


    # A.7 Distributed Development—Source Code Repository


    This example is a combination of the other two, and has probably supported more
    Open Source developers than any other model. In this design, a relatively small-scale
    server is used as a software repository and individual workstations similar to
    the one in the first example are used to provide the actual processing power.


    The main requirement for the server is a large disk storage space and a modest
    amount of memory. CVS, the source code control application used in this book,
    as well as others, can use'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'quite a bit of memory while comparing old and new versions of files with one
    another. As a result, the server should have at least 256 MB of memory and potentially
    much more if you expect to use large source code files.


    The server will not be responsible for compiling the application, so a fast processor
    is not necessary.


    What would be helpful, however, would be to ensure that the server has a well-tuned
    networking subsystem, and possibly some redundancy in that area as well. Additionally,
    if required by a particularly active source code repository, multiple NICs (Network
    Interface Cards) may be set up on different subnets to help reduce any network
    congestion that might arise.


    As previously mentioned, individual workstations will resemble the ones listed
    in the first example in this section—the stand-alone developer workstation.


    # A.8 Summing Up


    While there is no way to accurately give minimal and optimal recommendations for
    any and all software development projects, these guidelines should give you an
    understanding of some of the issues that may arise in selecting the servers and
    workstations necessary to provide development support.'
