  md: '# Introduction to CVS


    The Concurrent Versions System, or CVS, is a source code control application that
    permits developers to work in parallel on software development projects without
    the fear of overwriting someone else’s work. In addition it provides a complete
    project history that includes the ability to review previous versions of the code,
    and to compare old code with new code.


    CVS can be used for any development project, including assembly and machine language
    to C and C++ and even the code and images necessary to maintain a web site.


    The source code is set up in a software repository by the administrator. Each
    repository is identified by a unique location. A repository may be on a local
    machine or maintained on the network and accessed remotely. Many Open Source developers
    utilize anonymous CVS access in order to distribute development snapshots of the
    source code instead of (or in addition to) tarballs, RPM and other methods of
    distribution. Each repository may contain multiple projects and many versions
    of each project. The current version of a project may be checked out, as may older
    versions. Versions may also be compared to one another to determine specific changes
    and help to identify bugs that may have crept into a piece of software.'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# 6.1 CVS Policies


    In addition to the technical aspects of setting up CVS and granting users access
    to the system, there are certain operational procedures that need to be set forth
    prior to opening a CVS repository for access.


    One of the more important aspects deals with users checking in or committing a
    change into the repository.


    Every time a source file is checked into the system, the version number of that
    file is incremented. This version is separate from the version number of the software
    project. The differences will be decided later.


    Each team or project will have to develop guidelines as to when a source file
    should be checked in, how long one may be checked prior to committing it, and
    similar items. Checking a file out for a long period of time, making modifications
    and then checking it back in may result in conflicts that will have to be addressed.
    CVS will let you check the file in if your changes conflict with someone''s work,
    but someone will have to be responsible for ensuring these conflicts are resolved.


    Another policy might state that a file may not be checked back into the repository
    until it compiles with the rest of the project, until it has been reviewed, or
    until other benchmarks are met. These policies will vary from project to project,
    and CVS can maintain the source code repository, it has no method of enforcing
    these policies. It is the role of the project owner and manager(s) to ensure that
    the policies are implemented and followed by the team members.


    # 6.2 Project Management and Communication


    While CVS has many tools to help you manage a software project, it has no inherent
    ability to manage the project on its own. There are e-mail notifications available
    that let individuals keep an eye on particular files for changes. There are reports
    available that can determine who changed which when, as well as complete logs
    that describe what those changes did (or at least, were supposed to have done).


    As previously mentioned, even using a version control system as CVS will not prevent
    conflicts of code from arising. Communication between developers is absolutely
    necessary in order to ensure that projects proceed smoothly and on time.


    # 6.3 Installing and Managing CVS


    In order to install CVS, the first step is to obtain either the CVS source code,
    or if you are using RedHat, the RPM.


    The latest source code is available at http://www.cvshome.org. As of this writing,
    the current CVS version is 1.11.p1. RPM may be downloaded via RPMFind at http://rpmfind.net/linux/rpm2html/search.php?query=cvs.
    The instructions for your preferred installation method.'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'Installing and Managing CVS


    # 6.3.1 Configuring CVS


    Once CVS is installed on the server, the next step is to configure the machine
    properly for CVS. The first step is to create a user and group to be the owners
    of the repositories. For purposes of example, assume that the user and the group
    are named "cvs". This example shows how to set up CVS for local and remote "pserver"
    access. This method of setting up CVS is not the most secure method and does not
    provide a secure method for accessing the CVS repository remotely; but it is necessary
    if a project intends to provide remote, anonymous access to the CVS repository.
    See Section 6.7.1.


    To accomplish this, as root, issue the command listed below. Under RedHat Linux,
    this will create the CVS user and the CVS group. All of the following commands
    must be issued as the root user.


    ```

    # useradd -r -c "CVS user" cvs

    ```


    As initialized, this account will have no password and will not be able to be
    logged into. You can leave it this way and, in the event that maintenance is necessary,
    log in as root and resolve issues, or assign a password and use that. Leaving
    the account with no password is probably the most secure, but in the event that
    a password is necessary, simply assign one.


    ```

    # passwd cvs

    Changing password for user cvs <type cvs password>

    New UNIX password: <type cvs password>

    Retype UNIX password: <type cvs password>

    password: all authentication tokens updated successfully

    ```


    The next step is to create a CVS repository. For this example, assume that the
    CVS root is /usr/local/cvsroot. Additional repositories may be set up at this
    time, simply use the CVS init command as many times as necessary; changing the
    -d option to reflect the additional repositories.


    ```

    # cvs -d /usr/local/cvsroot init

    ```


    This will create the file structure necessary for CVS and will initialize all
    files.

    Once the user and repositories have been created, the ownership of the repositories
    will be changed.


    ```

    # chmod -R cvs:cvs /usr/local/cvsroot [additional repositories]

    ```


    The next step is to add users to the repositories. Each repository has a password
    file in the $CVSROOT/CVSROOT directory. There are three fields in this file separated
    by colons. The first field is the user name that may not be the same as the user''s
    login id. The second field is the user''s encrypted password. This password is
    encrypted with the crypt() function. The final field is the name of the user whose
    request will be performed. This is the owner of the CVS repository and in our
    example, the owner is ''cvs''.'
  merge: -1
  pgno: 200
- img_proc: true
  md: "The easiest way to generate encrypted passwords for the password file is by\
    \ using a simple perl script. An example is presented below. Simply type this\
    \ script into a file using a text editor and make the file executable. Then run\
    \ the program with two arguments, the username and the password.\n\n```\n#!/usr/bin/perl\n\
    # Simple script to take a username and password\n# return a line suitable for\
    \ pasting into the CVS\n# password file.\n\n($u, $p)=@ARGV;\n@d=(A..Z,a..z);\n\
    $s=\\$d[rand(52)].\\$d(rand(52));\nprint \\$u=\":\".crypt(\\$p,\\$s):\".crypt\\\
    n\";\n```\n\nIf you have saved the file under the name 'cvpassgen' and set the\
    \ permission properly, simple run the application as follows:\n\n```\n# /cvpassgen\
    \ username password\nusername:mU70ltQzHySmY:cvs\n```\n\nAs you can see, the information\
    \ is returned in the format CVS requires. (Note: since a random salt is used to\
    \ generate the password, your output will vary from what is presented here.)\n\
    You can simply cut and paste the line into the password file. Another option is\
    \ to redirect the output of the script directly into the password file.\n\n```\n\
    # /cvpassgen username password >>CVSROOT/CVSROOT/passwd\n```\n\nThis assumes that\
    \ the CVSROOT environment variable is set to the proper directory.\nNext, the\
    \ services file must be updated in order for the CVS server to respond to requests.\
    \ The following line will append to the /etc/services file. Be sure that there\
    \ are two \"greater than\" symbols or you will erase whatever is already in your\
    \ services file.\n\n```\n# echo cvsvpserver 2401/tcp >> /etc/services\n```\n\n\
    Next, the inetd server needs to know which service to start when requests come\
    \ in. RedHat 7.x uses the inetd server and so a file needs to be created in /etc/inetd.d/cvsvpserver\n\
    Using your favorite editor, edit /etc/inetd.d/cvsvpserver to include the following\
    \ information:\n\n```\n# Description: cvsvpserver: version control system\nservice\
    \ cvsvpserver\n{\n  socket_type = stream\n  wait = no\n  user = cvs\n```"
