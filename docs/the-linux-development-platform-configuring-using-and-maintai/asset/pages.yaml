  md: 'At this stage, you will be presented with your preferred editor (as defined
    by the environment variables $CVSEDITOR or $EDITOR). This will allow you to create
    a log entry that describes the project, the initial state that it is in, and anything
    else of importance.


    When you save that file, the information, along with the imported files, will
    be saved in the repository.


    To avoid having the editor displayed, you can include a log entry on the command
    line with the -m option. Log entries with spaces or other special characters in
    them should be enclosed in quotes.


    ```

    # cvs import -m "Initialized the project" Fuzion \

    OSS_Software release_0_1

    ```


    To ensure the files have been imported, issue the following command to the server
    that holds the repository:


    ```

