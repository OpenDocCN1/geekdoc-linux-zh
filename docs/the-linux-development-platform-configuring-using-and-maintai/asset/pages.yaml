    # 3.3.5 Compilation with Optimization


    The first objective of a compiler is to generate output code swiftly. The compiler
    does not do any code optimization to make the compile time swift. However you
    can instruct gcc to compile code with code optimization. This is done using -O
    (uppercase O, zero) on the com-mand line. Different optimization levels can be
    designated by using a number suffix with the option. For example, -02 will do
    code optimization at level 2. If you specifically don''t want to do any code optimization,
    you can use zero with -O0.


    So what does optimization mean? Consider the following C source code sum.c that
    calculates the sum of two numbers and prints the result. Of course this is not
    the best code for purpose and it is used only to demonstrate a point.


    ```

    #include <stdio.h>

    main ()

    {

    int a, b, sum;

    a=4;

    b=3;

    sum = a+b;

    printf("The sum is: %d\n", sum);

    }

    ```


    If you compile this program without any optimization, the compiler will generate
    code for

    all lines starting from line number 6 to line number 10. This can be verified
    by loading the file in

    a debugger and tracing through it. However, if you optimize the compilation process,
    lines 6 to

    10 can be replaced by a single line as shown below. This can be done without affecting
    the out-put of the program.


    ```

    printf("The sum is: 7\n", \);

    ```'
