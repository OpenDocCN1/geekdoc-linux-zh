    7   #include <stdio.h>\n8 \n9   main ()\n10 {\n11     char string[25];\n12   \
    \  printf(\"Enter a string of characters : %s\");\n13     scanf(\"%%s\", string);\n\
    14     printf(\"The entered string is : %%s\\n \", string);\n15 }\n```\n\nHowever\
    \ line 6 is still not properly indented. By default the indent program does not\
    \ modify comment lines.\nTo find out which version of the indent program you are,\
    \ using the following command.\n\n```\n[root@boota ftp-dir]# indent --version\n\
    GNU indent 2.2.6\n[root@boota ftp-dir]#\n```\n\n# 7.1.1 Getting Started With Indent\n\
    \nThe indent program may be used as a command or as a pipe. In the command mode,\
    \ the program has a general format as shown below:\n\\indent [options] [input\
    \ filename] [-o output filename]\nThe two lines show the simplest use of the indent\
    \ program. It takes hello.c as input file and creates hello.c as output file and\
    \ hello.c~ as backup file.\n\n```\n[root@boota indent]# indent hello.c\n[root@boota\
    \ indent]#\n```\n\nIf you want to create an output file with a different name\
    \ without modifying the original file, you can use the -o option with indent.\
    \ When multiple input files are specified, indent reformats each and creates a\
    \ backup file for each input file. Wild characters can also be used with indent\
    \ so that you can indent all C source code files with the \"indent .c\" command.\n\
    The output of another command can also be piped into the indent command. The following\
    \ command does the same thing as indent hello.c but writes the output on STDOUT\
    \ instead of writing it to a file.\n\n```\ncat hello.c | indent\n```"
