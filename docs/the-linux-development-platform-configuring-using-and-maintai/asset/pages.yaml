- img_proc: true
  md: '# 7.7 Using GNU Binary Utilities


    GNU binutils is a package of utilities that are related to manipulating library
    files or getting information about different types of binary files. These utilities
    range from finding strings in a binary file, creating library files, displaying
    information about binary files, and assembling binary files, and so on. This section
    contains an introduction to most commonly used binary utilities.


    # 7.7.1 Using the ar utility


    Files can be stored into a single file using the ar utility. The file into which
    multiple files are stored is called an archive. The ar program retains file permissions,
    ownerships and other properties of the original files. These files can be extracted
    from the archive later on, if required. The program also creates an index within
    the archive file that is used to speed up locating component (or members) of the
    archive.


    From the development point of view, the ar program is used to create libraries
    of functions. These libraries are used with other object files to link an executable.
    The conventional name of these library files is lib(name), where a name is any
    string used as a library name. For example, a library named common will be stored
    in a file libcommon.a.


    The ar program performs one of the following tasks when using option on the command
    line.


    +   * Delete from the archive (option d)

    * Move files in the archive (option m)

    * Print a list of files in the archive (option p)

    * Append files to the archive (option q)

    * Insert new files in the archive by replacing if a file already exists in the
    archive (option r)

    * Displaying contents of an archive (option t)

    * Extracting files from an archive (option x)


    More options can be used in combination with very common options to perform additional
    tasks. In this section we use some very common options to show how the ar program
    is used in a software development environment.


    We have version 2.10.91 in this book. You can display a current version of the
    program on your system using -V option as shown below. The ar utility is usually
    used because of its compatibility with ld, the dynamic loader.


    ```

    [root@boota ar]# -V

    Gnu 2.10.91

    Copyright 1997, 98, 99, 2000, 2001 Free Software Foundation,

    c.

    This program is free software; you may redistribute it under

    the terms of the GNU General Public License. This program is

    absolutely no warranty.

    [root@boota ar]#

    ```'
  merge: -1
  pgno: 249
- img_proc: true
  md: "# GNU Binary Utilities\n\nLet us create an archive of simple text files. The\
    \ following command creates an archive test.a from files /etc/hosts and /etc/resolv.conf.\n\
    \n```\nar -r test.a /etc/hosts /etc/resolv.conf\n```\n\nThis command creates a\
    \ file test.a that contains the contents of the other files. To display the contents\
    \ of the file, you can use the -t option on the command line.\n\n```\n[root@boota\
    \ r ~]# ar -t test.a\nresolv.conf\nhosts\n[root@boota r ~]#\n```\n\nUsing -x option,\
    \ you can extract one or more files from the archive. The following command extracts\
    \ the file hosts from the archive.\n\n```\nar -x test.a hosts\n```\n\nNow we create\
    \ a real library from two object files common.o and ftp.o. The following command\
    \ creates a file libcommon.o from these two object files.\n\n```\nar -r libcommon.o\
    \ common.o ftp.o\n```\n\nFunctions or variables in this file can be linked to\
    \ any other object file using the -l command option with gcc compiler. The following\
    \ command creates an executable project from this library and project.o.\n\n```\n\
    gcc project.o -common -o project\n```\n\nNote that libcommon.a is not used with\
    \ the -l option when linking functions in this library to an executable file.\
    \ Instead we use common as the library name by stripping the lib prefix and .a\
    \ part.\n\nFiles can be inserted into the archive in a particular order. Similarly\
    \ you can use a policy when replacing existing files using different command line\
    \ options. Other options that can be used with the ar command can be listed by\
    \ executing the command without an argument shown.\n\n```\n[root@boota /root]#\
    \ ar\nUsage: ar [-X32_64] [(dmmpqrstx][abcfilNoPsSuvV] [member-name] [count] archive-file...\n\
    \  -M [c-script]\ncommands:\n  d - delete file(s) from the archive\n  m[ab] -\
    \ move file(s) in the archive\n  p - print file(s) found in the archive\n  q[f]\
    \ - quick append file(s) to the archive\n  r[ab][f][u] - replace existing or insert\
    \ new file(s) into the archive\n  t - display contents of archive\n  x[o] - extract\
    \ file(s) from the archive\n```"
