    If you need to replace the contents of a cell all at once, try this method.


    +   1. **Click on a cell.** The cell will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_164_1.png)


    +   2. **Type a new value.** The value will appear in the cell and on the input
    line.


    +   3. **Press the Enter key.** The value is entered into the cell.'
