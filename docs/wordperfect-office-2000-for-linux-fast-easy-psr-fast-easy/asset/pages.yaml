    +   1. Click on the Console icon on the Panel. The Console window will appear.


    > NOTE

    Every graphic interface in Linux has some kind of console or command-line application,
    as shown here. If you start yours slightly differently, that''s fine. After starting
    the console application, command-line windows are pretty much the same.'
