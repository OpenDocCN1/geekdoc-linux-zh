  md: '# # Now Learning WordPerfect Office 2000

    is Easy, Fast, and Fun


    Need to start with WordPerfect basics?

    Go to Chapter 4


    Ready to build tables and columns?

    Turn to Chapter 7


    Need help managing longer documents?

    Learn how in Chapter 9


    Need to edit a spreadsheet?

    See Chapter 12


    Wonder how to create, modify,

    or delete a chart?

    Go to Chapter 16


    Want to add special effects

    to a presentation?

    Learn how in Chapter 21


    # # Includes

    Comprehensive

    Glossary


    Relax. Learning WordPerfect Office 2000 for Linux is

    a breeze. With this book''s step-by-step instructions,

    y can master WordPerfect in no time. From the basics

    of file management and formatting a document to editing

    spreadsheet and working with formulas, this book\covers everything you need to
    get up and running quickly!


    ![](img/33d9b1681e3609bc590f82347ae3a699_419_0.png)


    WordPerfect® Office 2000 is easy to learn with point-and-click

    instructions.


    > "Fast & Easy means just that, all hands-on. These books carry you through your
    topics at a rapid pace with an avalanche of screens to make learning easy."

    —Joseph T. Sinclair, Author


    > "One of the most helpful and jargon-free books."

    —The Toronto Globe and Mail


    > "Beginners will love the tone and format...the author''s expertise is evident
    throughout the book."

