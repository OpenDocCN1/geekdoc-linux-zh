  md: '# Modifying a Chart


    After you have a chart in your document, you might need to make some changes to
    make it flow in your document better.


    # Resizing a Chart


    When Quattro Pro first creates a chart within a document, the chart might not
    be the correct size. There is usually a discrepancy between the size of the chart
    and the size of the chart object, which is the big box surrounding the chart.
    Here''s how to resize the chart and the chart object.


    +   1. Click on the chart object edge. The chart object handles will appear.


    +   2. Click and drag any corner handle on the border of the chart object. The
    border will move with the mouse pointer.


    +   3. Release the mouse button. The chart object will be resized to the desired
    size.


