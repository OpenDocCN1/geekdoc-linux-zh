  md: '# # Setting Cell Alignment


    Like paragraphs in WordPerfect, you can align values within their cells.


    # ## Adjusting Cell Alignment


    Cell alignment in Quattro Pro takes one of four forms: left, centered, or general.


    +   1. Click on a cell. The cell will be highlighted.


    +   2. Click on the Alignment button. The Alignment menu will appear.


    +   3. Click on Left. The cell''s contents will be aligned to the left side of
    the cell.


    ![](img/33d9b1681e3609bc590f82347ae3a699_198_0.png)'
  merge: -1
  pgno: 198
- img_proc: true
  md: '# CHAPTER 13: FORMATTING NOTEBOOKS


    # Aligning across Multiple Cells


    To create a heading within a Quattro Pro document, you need to align the text
    across multiple cells.


    +   1. Click on a cell with the heading. The cell will be highlighted.


    +   2. Select the range of cells you want the heading to appear. The range is
    highlighted.


    +   3. Click on the Alignment button. The Alignment menu will appear.


    +   4. Click on Center Across Block. The cell''s contents will be aligned in the
    center of the selected cell range.


    ![](img/33d9b1681e3609bc590f82347ae3a699_199_0.png)


    # Formatting with Fonts


    When changing the fonts of cell values in Quattro Pro, it is important to remember
    that selecting the cell applies to all of the cell''s values. Selecting a portion
    of the value in the cell''s input line applies font changes to only those selected
    values.'
