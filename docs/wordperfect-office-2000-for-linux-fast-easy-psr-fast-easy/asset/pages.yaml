  md: '# 24

    Using CoreICENTRAL Calendar to Keep Organized


    Technology was supposed to make things easier for us. Remember that one? In case
    you had any doubts, try this statistic on for size: 50,000 years ago, it took
    the average man about 20 hours a week to feed, clothe, and house his entire family.
    The rest of the time, he could lollygag. Today, a person must work an average
    of 50 hours a week to achieve the same goal. Technology hasn’t made things easier;
    it’s just given us more stuff to do before we can relax with nuts and berries.
    In this chapter, you’ll learn how to:


    +   - Create tasks in CoreICENTRAL Calendar

    - Link tasks to specific events

    - Mark tasks as fully or partially complete

    - Delete tasks from the task list'
  merge: -1
  pgno: 354
