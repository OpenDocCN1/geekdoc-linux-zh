  md: '# Formatting Numbers


    You can express numeric data in many different forms: dates, times, and currency,
    just to name a few. You can change the format of your data in just a few steps
    in Quattro Pro.


    # Changing the Decimal Point Places


    When dealing with decimals in numeric data, you must be sure that you use the
    proper number of decimal places. After all, in the United States, a soda pop can
    cost $55, not $54678.


    +   1. Click on a cell with a numeric value. The cell will be highlighted.


    +   2. Click on Format. The Format menu will appear.


    +   3. Click on Selection. The Active Cells dialog box will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_193_0.png)


    > TIP

    Press F12 to open the Active Cells dialog box.'
