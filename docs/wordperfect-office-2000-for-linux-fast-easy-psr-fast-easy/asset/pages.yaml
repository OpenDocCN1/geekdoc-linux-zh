    in the boxes next to Top, Bottom, Left, and Right.


    5. Click on OK. The Spreadsheet Page Setup dialog will close and the spreadsheet
    will reflect the changes.


    # Setting Page Orientation and Size


    Spreadsheets usually do not appear in portrait orientation, but rather landscape.
    In this section, discover how to change the page orientation and paper size for
    your spreadsheet.


    1. Click on File. The File menu will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_206_1.png)


