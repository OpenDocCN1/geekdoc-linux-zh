  md: '# Exporting Data


    If you need to share your data with others, you might need to export it to a common
    file format they can work with or import into their own database. The most common
    file format is a text file, with the data separated and delimited.


    +   1. Click on File. The File menu will appear.


    +   2. Click on Export. The Export Data dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_279_0.png)


    +   3. Confirm the file names in the From and Text boxes. They should match what
    you want.


    +   4. Click on the Semi-Colons option. The option will be selected.


    +   5. Click on the Use field names as first row of data check box. A check (\checkmark)
    will be placed in the check box.


    +   6. Click on Export. The new text file will be created from the database.


