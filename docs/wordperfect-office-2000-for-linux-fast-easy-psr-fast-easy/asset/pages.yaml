  md: '# 25

    Using CoreCENTRAL Memo to Keep Informed


    There is an endangered species in the office place today, a form of communication
    that is quickly dying out. It is the memorandum, or memo, for short. This once-proud
    method of getting ideas across to other people has slowly, insidiously been replaced
    by the advent of the e-mail message and the sticky note.


    Sadly, CoreCENTRAL Memo does not so much emulate the traditional memorandum as
    the sticky note, so don''t look for any sudden revivals here. Still, sticky notes
    do have their uses, even when they are on your computer screen. In this chapter,
    you''ll learn how to:


    +   - Create memos in CoreCENTRAL Memo

    - Organize memos'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# Creating a Memo


    Making a memo is a simple process by anyone''s standards. This makes a lot of
    sense, because a complicated process would detract from the whole point of the
    memo: something on which to jot down a thought or reminder quickly.


    ![](img/33d9b1681e3609bc590f82347ae3a699_363_0.png)


    +   1. Click the Create a memo button. A new memo icon will appear in the memo
    window.


    ![](img/33d9b1681e3609bc590f82347ae3a699_363_1.png)


    +   2. Type a memo subject at the subject placeholder.

    3. Click in the memo content text box. The mouse pointer will appear in the text
    box.'
  merge: -1
  pgno: 363
- img_proc: true
  md: '![](img/33d9b1681e3609bc590f82347ae3a699_364_0.png)


    4. Type the memo content in

    the memo content text box. The

    memo will be completed.


    ![](img/33d9b1681e3609bc590f82347ae3a699_364_1.png)


    # Organizing Memos


    As you can see, creating a memo is not a big deal. The nice

    thing about memos is that unlike real sticky notes that clutter

    up your appliances, doors, and computer screens, you can

    actually organize your memos into categories.


    +   1. Click on a memo. The memo

    will be selected.


    +   2. Click on Category. The

    Category menu will appear.


    +   3. Click on Move to category.

    The Move to Category dialog

    box will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_364_2.png)'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# 342 CHAPTER 25 USING CORELCENTRAL MEMO TO KEEP INFORMED


    ![](img/33d9b1681e3609bc590f82347ae3a699_365_0.png)


    4a. Type a new category. The information will appear in the Select the new category
    box.


    OR


    4b. Click the down arrow (↓) next to the Select the new category box if a category
    exists for your memo. A drop-down list will appear.


    5. Click on a category. The category will be selected and will appear in the Select
    the new category box.


    6. Click on OK. The Move to Category dialog box will close and the memo text box
    will display all of the memos in the assigned category.


    ![](img/33d9b1681e3609bc590f82347ae3a699_365_1.png)


    7. Click on the down arrow (↓) next to the category view box. A list of all assigned
    categories will appear.


    8. Click on a category. The category will be selected and the memo window will
    display all of the memos in the assigned category.'
  merge: -1
