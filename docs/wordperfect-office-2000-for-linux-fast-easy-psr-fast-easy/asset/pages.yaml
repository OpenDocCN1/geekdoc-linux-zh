  md: '# Creating a Basic Slide Show


    Creating a Presentations slide show is fairly routine when you use PerfectExpert.
    It is important to outline your presentation at least roughly before you begin
    so you have some idea what slides to create.


    +   1. Click on File. The File menu will appear.


    +   2. Click on New from Project. The PerfectExpert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_287_0.png)


    +   3. Click on Persuasive Slide Show. It will be selected.


    +   4. Click on Create. The Presentations window will appear with the PerfectExpert
    in one pane and the slide show in the other pane.


