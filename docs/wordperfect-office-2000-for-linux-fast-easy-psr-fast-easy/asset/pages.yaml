  md: '# Using Text Boxes


    You use text boxes to create interesting layout effects. By placing some text
    within a text box, you can make that text behave independently of other text on
    the same page.


    # Making a Text Box


    Text boxes are objects that act just like graphics, in terms of layout. They are
    simply boxes that contain text, rather than a picture, and can either anchor to
    the page or float in the document.


    +   1. Click the mouse pointer where you want to insert the text box. The insertion
    point will appear where you click.


    +   2. Click on Insert. The Insert menu will appear.


    +   3. Click on Text Box. A text box will appear in the document at the insertion
    point.


    ![](img/33d9b1681e3609bc590f82347ae3a699_130_0.png)'
