  md: '# Installing the Software


    After you buy a copy of WordPerfect Office 2000, it''s time to start installing.
    As the root superuser, just insert Disc 1 into your mounted CD-ROM drive and follow
    the steps below.


    ![](img/33d9b1681e3609bc590f82347ae3a699_381_0.png)


    +   1. Type the `cd` command in a console window to navigate to the CD-ROM directories.
    The directory should be `\mnt\cdrom` on most Linux machines.


    +   2. Type `./setup`. The WordPerfect Office 2000 setup wizard will start by
    opening the Corel WordPerfect Application Starter dialog box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_381_1.png)


    +   3. Click on Next. The License Agreement will appear.


