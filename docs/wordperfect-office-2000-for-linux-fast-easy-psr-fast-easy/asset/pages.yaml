  md: '# Wrapping Text around a Graphic


    Graphics, without meaning to, can hog a lot of space in your document. You can
    circumvent this limitation by wrapping text around the image.


    +   1. Right-click the mouse pointer on the graphic. The Image Editing menu will
    appear.


    +   2. Click on Wrap. The Wrap Text dialog box will open.


    +   3. Click on the Square option. The Square option will be selected and the
    Wrap text around options will be activated.


    +   4. Click on the Largest side option. The option will be selected.


    +   5. Click on OK. The Wrap Text dialog box will close and the text will be wrapped
    around the graphic.


    TIP

    You can create a nifty effect by selecting the Behind text option for the graphic.
    Then simply select and apply a new color to the text on the graphic for better
    contrast.


    ![](img/33d9b1681e3609bc590f82347ae3a699_128_0.png)


    ![](img/33d9b1681e3609bc590f82347ae3a699_128_1.png)'
