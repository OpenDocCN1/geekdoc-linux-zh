  md: '# # 19

    Learning Presentations Basics


    Because many people fear public speaking second only to death, most would rather
    not become fiery orators to get their points across. That leaves the second option:
    Use another way to communicate, such as visual stimuli. We simply remember things
    better if we see them with our eyes. As a result, the corporate slide show was
    born.


    It started with placards at first, showing charts created by people whose job
    was to do nothing but. Overheads appeared next, lending presenters the ability
    to support their points on-the-fly. Then came slides, which added added color
    and speed to presentations. Finally, slides were created directly on a computer
    and projected from there, as well.


    Presentations is the component in WordPerfect Office 2000 that gets this job done
    for you. In this chapter, you''ll learn how to:


    +   - Start Presentations

    - Create a Presentations slide show

    - Use the different views to modify your slide show'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# CHAPTER 19: LEARNING PRESENTATIONS BASICS


    # # Starting Presentations


    Unlike the other components of WordPerfect Office 2000, Presentations does not
    start right after you call it up. Instead, PerfectExpert steps in to help guide
    the beginning of your work in Presentations.


    +   1. Click on the Application Starter. The main menu will appear.


    +   2. Move the mouse pointer to Applications. The Applications menu will appear.


    +   3. Move the mouse pointer to WordPerfect Office 2000. The WordPerfect Office
    2000 menu will appear.


    +   4. Click on Corel Presentations 9. The PerfectExpert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_285_0.png)


    +   5a. Click on the Close button (X) to circumnavigate PerfectExpert. The Startup
    Master Gallery dialog box will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_285_1.png)'
