  md: '# # Moving Data


    When you initially create a spreadsheet, you might give little thought to where
    data is placed on a sheet. If you have to share the file with someone else, you
    might need to organize the cells in a way that makes sense to other people.


    ![](img/33d9b1681e3609bc590f82347ae3a699_178_0.png)


    # ## Copying and Pasting Cells


    Moving cells around in Quattro Pro is a like moving text around WordPerfect.


    +   1. Select a cell to copy. The cell will be highlighted.


    +   2. Press Ctrl+C. The cell''s contents will be copied.


    +   3. Click on the destination cell. The cell will be highlighted.


    +   4. Press Ctrl+V. The copied cell will appear in the new cell.


