  md: '# # 1

    # Welcome to WordPerfect Office 2000


    WordPerfect has long been a favorite word processor among Linux users. Now that
    Corel has made the entire WordPerfect Office 2000 suite available on the Linux
    platform, users can enjoy the full functionality of all the applications in the
    WordPerfect family. This family consists of no less than five applications: a
    word processor, a spreadsheet application, a slide show creator, a database tool,
    and a personal information manager. Despite the wide range of functionality, there
    are similarities throughout the WordPerfect Office 2000 interface. In this chapter,
    you''ll learn how to:


    +   - Start and exit WordPerfect component applications

    - Recognize the common screen elements of WordPerfect Office 2000'
  merge: -1
