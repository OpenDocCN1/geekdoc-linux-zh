- img_proc: true
  md: '# 23

    Learning the CoreCENTRAL Calendar


    It''s all about time. You have a finite number of years to romp about this mortal
    coil. I say this not to panic anyone, but rather to raise another point. If you
    have only a set number of minutes to hang around, shouldn''t you get the work
    done as efficiently as possible so you can go out and enjoy the rest of life?
    Thought so.


    That brings us to CoreCENTRAL, WordPerfect Office 2000''s Personal Information
    Manager. PIMs, as they are known in the biz, are software applications designed
    to help manage our busy days. CoreCENTRAL is actually three applications closely
    tied together: Calendar, Memo, and Address Book. The Calendar is the focus of
    this chapter, to help you start directly managing your time. In this chapter,
    you''ll learn how to:


    +   * Use the CoreCENTRAL Calendar interface

    * Navigate the many different views in CoreCENTRAL Calendar

    * Create an event on the calendar

    * Create recurring events

    * Edit existing events

    * Delete events'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# 318 CHAPTER 23: LEARNING THE CORECENTRAL CALENDAR


    # Viewing CoreCENTRAL Calendar


    Before learning to use the CoreCENTRAL Calendar component, first examine its interface
    because it has yet to appear in any of the other WordPerfect Office 2000 components.


    +   Navigation calendar. This pane helps with navigating to specific dates, tells
    you the currently selected day, and gives you the bigger picture on how busy your
    month is shaping up to be.


    +   Event calendar. This pane lists all of the events on a given day in block
    format. You can enter events directly into this pane and change them with the
    mouse, as you see later in this chapter.


    ![](img/33d9b1681e3609bc590f82347ae3a699_341_0.png)


    +   New task input line. You can quickly enter tasks in this field.


    +   Task list. View a list of the currently active tasks here.


    > Tasks are the main topic of discussion in Chapter 24, "Using CoreCENTRAL Calendar
    to Keep Organized."'
  merge: -1
  pgno: 341
