  md: '# 22

    Drawing with Presentations


    The ability to create stunning art becomes more accessible to the layperson every
    day. With its strong set of drawing tools, Presentations clearly steps in the
    right direction toward this accessibility, giving you endless opportunities to
    customize your slide shows. Because of this object-oriented treatment of items
    in a drawing, you can more easily manipulate and interact with the objects—especially
    given the tools Presentations includes. In this chapter, you''ll learn how to:


