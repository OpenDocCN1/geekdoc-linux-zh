- img_proc: true
  md: '# CHAPTER 14 COMPLETING YOUR SPREADSHEET


    # Preparing to Print


    In WordPerfect, it is not too difficult to see how pages are set up. In a Quattro
    Pro spreadsheet, however, such settings as margins and page breaks are not always
    apparent.


    # Setting Up Margins


    The margins of a spreadsheet page are typically hard to see. In fact, they only
    appear after you examine the document in Print Preview (discussed later in this
    chapter) or you initially change the page margins. This is a strange feature,
    to be sure, which emphasizes the need to always prepare your document before printing.


    +   1. Click on File. The File menu will appear.


    +   2. Click on Page Setup. The Spreadsheet Page Setup dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_205_0.png)'
