  md: '# 12

    Working with Functions and Formulas


    Putting all these numbers and values into the spreadsheet does you little good
    if they''re just sitting there. The power of a spreadsheet application such as
    Quattro Pro is how it can work with those numbers to discover new values. In this
    chapter, you''ll learn how to:


    +   * Write formulas, both simple and complex

    * Use cell references within a formula

    * Copy and move formulas

    * Build functions using Quattro Pro''s function tools'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Creating Formulas


    A formula compares two or more values in a certain way and then uses the comparison
    as a new value. In other words, the value of 1 is compared to another value of
    1 in such a way that they are combined. Together, their new value is 2. Formulas
    compare values using operators and functions. Operators are the action symbols
    you already know, such as + and -. Functions are less common, but more powerful,
    and will be examined later in this chapter.


    # Creating a Simple Formula


    A simple formula uses one kind of operator at a time. Values in the formula can
    be numeric data or references. Table 12.1 shows the operators Quattro Pro uses
    and how they differ from everyday use.


    # Table 12.1 Traditional versus Quattro Pro Operators


    | Formula | Quattro Pro Formula |

    |--- |--- |

    | 2+2=4 | 2+2=4 |

    | 2-2=0 | 2-2=0 |

    | 2×2=4 | 2*2=4 |

    | 4÷2=2 | 4/2=2 |

    | 2²=4 | 2^2=4 |'
  merge: -1
  pgno: 183
