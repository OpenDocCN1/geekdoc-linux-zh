    in the box next to File name.


    3. Click on Open. The Open File dialog box will close and the desired file will
    appear in the document window.


    # Opening a Recently Edited Document


    Should you need to open a document you recently worked on, WordPerfect Office
    2000 applications make it even easier to find and open those documents.


    +   1. Click on File. The File menu will appear.


    +   2. Click on one of the eight most-recently edited files. The desired file
    will appear in the document window.


