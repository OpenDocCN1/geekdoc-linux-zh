    # 3.1 Purpose of this Document


    This document''s primary goal is to introduce the design elements for the restructuring
    of the RedLine application. The information from this document should serve as
    a working guide for design changes and additions to the RedLine software.


    # Using the Keyboard


    If you need to move around the document and you are not comfortable with the mouse,
    you can use the keyboard for more than just the left, right, up, and down arrow
    keys. The following table lists the various WordPerfect key combinations that
    you can use to navigate in a document.


    | Type This Key | To Navigate |

    |--- |--- |

    | Ctrl+left arrow or Ctrl+right arrow | A word at a time |

    | Page Up | A full screen up |

    | Page Down | A full screen down |

    | Alt+Page Up | To the header of the current page |

    | Alt+Page Down | To the footer of the current page |

    | Home | To the beginning of a line |

    | End | To the end of a line |

    | Ctrl+Home | To the beginning of a document |

    | Ctrl+End | To the end of a document |'
  merge: -1
