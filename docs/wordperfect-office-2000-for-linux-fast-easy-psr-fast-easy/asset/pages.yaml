  md: '# Using Make It Fit


    Every once in a while you are given a requirement to make a document exactly a
    certain length. In this age of electronic documents, this is not such a common
    requirement, it''s nice to know you can still do it if need be.


    ![](img/33d9b1681e3609bc590f82347ae3a699_129_0.png)


    +   1. Click on Format. The Format menu will appear.


    +   2. Click on Make It Fit. The Make It dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_129_1.png)


    +   3. Type a new value in theDesired number of pages field. The value will appear
    in the field.


    +   4. Click on the box next to Line spacing. The Line spacing box will be unchecked.


    +   5. Click on Make It Fit. The Make It dialog box close will be altered to the
    new specifications.'
