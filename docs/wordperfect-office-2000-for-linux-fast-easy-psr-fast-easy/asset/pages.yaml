    box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_371_1.png)


    6. Confirm the settings for the field and record delimiters. Most ASCII versions
    of contact information use commas for field delimiters and line breaks for record
    delimiters.


    7. Click on OK. The ASCII Delimiter Setup box will close and the Field Mapping
    dialog box will open.'
