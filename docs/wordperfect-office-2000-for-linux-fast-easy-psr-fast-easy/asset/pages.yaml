  md: '# CHAPTER 5: IMPROVING YOUR WRITING


    # Using Find and Replace


    Finding a particular word or phrase in a document longer than a page can be tedious.
    WordPerfect''s Find and Replace tool does the hard work for you, and can change
    the found text into whatever you need.


    # Finding Terms


    The Find component of the Find and Replace tool tracks down any character, word,
    or phrase in a WordPerfect document.


    +   1. Click on Edit. The Edit menu will open.


    +   2. Click on Find and Replace.

    The Find and Replace dialog box will open.


