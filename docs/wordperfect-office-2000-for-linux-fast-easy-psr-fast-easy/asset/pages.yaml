    with only the first letter capitalized, is normal sentence case. A passage of
    text WITH ALL OF THE LETTERS CAPITALIZED is in uppercase.


    +   1. **Select the text** you want to affect. The text will be highlighted.


    +   2. **Click on Edit.** The Edit menu will appear.


    +   3. Move the mouse pointer to Convert Case. The Convert Case menu will appear.


