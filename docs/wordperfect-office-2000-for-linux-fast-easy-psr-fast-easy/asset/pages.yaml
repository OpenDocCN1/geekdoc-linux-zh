  md: '# 16 Charting Data


    Let''s face it: Charts are simply cool. There is nothing like "Aha!” feeling you
    get when you look at incomprehensible raw data, and then you see it again neatly
    organized in a chart.


    Quattro Pro works well to create these cool charts. The data within Quattro Pro
    is more than ready to be charted and graphed. All it takes is a little planning
    and effort to yield a lot of result. In this chapter, you''ll learn how to:


    +   - Create pie, bar, line, and 3D charts

    - Resize a chart

    - Edit a chart

    - Change a chart''s style'
