    # 23

    Learning the CoreCENTRAL Calendar


    It''s all about time. You have a finite number of years to romp about this mortal
    coil. I say this not to panic anyone, but rather to raise another point. If you
    have only a set number of minutes to hang around, shouldn''t you get the work
    done as efficiently as possible so you can go out and enjoy the rest of life?
    Thought so.


    That brings us to CoreCENTRAL, WordPerfect Office 2000''s Personal Information
    Manager. PIMs, as they are known in the biz, are software applications designed
    to help manage our busy days. CoreCENTRAL is actually three applications closely
    tied together: Calendar, Memo, and Address Book. The Calendar is the focus of
    this chapter, to help you start directly managing your time. In this chapter,
    you''ll learn how to:


    +   * Use the CoreCENTRAL Calendar interface

    * Navigate the many different views in CoreCENTRAL Calendar

    * Create an event on the calendar

    * Create recurring events

    * Edit existing events

    * Delete events'
