    ## Correcting Your Mistakes


    ![](img/33d9b1681e3609bc590f82347ae3a699_64_2.png)


    This is a reminder that we all need to uphold the following standards when using
    the email and Internet. The Firm publishes electronic mail systems and internet
    access. These tools are provided to assist employees in the conduct of Firm business
    and additionally, all messages sent, or received on the electronic mail system
