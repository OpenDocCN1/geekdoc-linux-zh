    # Introduction


    This Fast & Easy series guide from Prima Tech is an excellent introduction to
    one of the hottest office suite applications on the market today—WordPerfect Office
    2000—running on one of the fastest-growing operating systems—Linux.


    Linux and WordPerfect are a good match in today''s software world. Corel invested
    a great amount of time in a new Linux distribution, so it stands to reason that
    it should bring its powerful office suite over to the Linux platform.


    The makers of WordPerfect Office 2000 did an interesting thing when they migrated
    their product to the side of penguins. Instead of directly translating their software
    into Motif, the usual Linux environment, Corel instead opted to port the entire
    suite using WINE, for those of you who haven''t heard, is a Windows emulator that
    runs on top of Linux and allows (with some special tweaking) Windows applications
    to run within Linux.


    The upshot of all this technical gobledygook is that WordPerfect Office 2000 for
    Linux has much the same look, feel, and functionality of its Windows counterpart.
    Thus, you have an enormously powerful and quite popular set of office applications
    available for Linux.


    As more applications arrive on the Linux platform, it might soon become a reality
    that Linux as a desktop platform can actively compete with Windows. Finally, users
    have a choice in what they can use.'
