    # PART IV


    # Working with Advanced Data


    - Chapter 17 Learning Paradox Basics . . . . 219

    - Chapter 18 Working with Paradox . . . . . . . . 243


    # 17 Learning Paradox Basics


    The average computer user increasingly deals with more data. A spreadsheet alone
    might not fulfill a user’s data needs. This is where Paradox comes in. Paradox
    is recognized as one of the world’s best relational databases, and it’s now available
    on the Linux platform, just for you. In this chapter, you’ll learn how to:


    - Master database concepts

    - Navigate the Paradox environment

    - Build basic database components

    - Create a unique StarBase database


    # Database Concepts


    Four different types of objects compose databases. All of these objects working
    together make up the database. Any of them taken separately do not have much use.
    These objects are tables, forms, queries, and reports. Before examining the workings
    of an actual database, it helps to review the functionality of each object.


    You''re probably familiar with tables. They are essentially simplified spreadsheets.
    A database table is simpler because the purpose of the rows and columns is set,
    whereas a spreadsheet has more flexibility in how you can use rows and columns.
    Also, spreadsheets allow cells to interact with each other, whereas database tables
    don''t. If you need to make mathematical comparisons, put your data in a spreadsheet.


    In a database table, each row is a database record. A database record is a collection
    of related data. In a database of books, for example, one record might be:


    > Ivanhoe, Sir Walter Scott, New American Library, September 1987


    This record has five fields: Book Title, Author, Publisher, Published Month, and
    Published Year. All other records in this database table use the same fields.
    If a record needs to contain more information, then the database table needs additional
    fields. In database programmer lingo, including more information is sometimes
    referred to as adding columns.


    A form is the interface structure between the user and the table. Although you
    can directly enter data into a table (and some prefer this), a form gives the
    user visual cues to help enter data more quickly, rather than tediously tab across
    row of the database table.


    At the very least, a good database needs tables and forms. If the database had
    only a table, it would be rather dull. If the database had only a form, it would
    only be a shell surrounding nothingness.


    Queries are little programming scripts that pull specific information out of a
    database. Don''t panic if you don''t think you can program anything. You can master
    queries after you understand the way they are structured.


    After a query gathers information, it displays it. This is done in a report, the
    final piece of the database puzzle. Reports are similar to spreadsheets in that
    they typically present data in tabular form. Reports, however, are not interactive.
    They simply place the data requested by a query into a read-only file, which can
    be printed or displayed onscreen. If you need to change the data, you must change
    it in the table (through the form).


    Databases can have multiple versions of all these objects. In a climatology database,
    you could have a table of known temperature highs and lows for a region and another
    table of rainfall amounts, each accessed by separate forms. The possibilities
    are limitless.


    # Examining the Paradox Environment


    Before you can begin to use Paradox, you need to first learn the tools it has
    for you to use.


    ![](img/33d9b1681e3609bc590f82347ae3a699_245_0.png)


    - **Standard Bar.** Contains the normal of file and text commands found in all
    WordPerfect Office 2000 applications.

    - **Property Bar.** Contains specific tools for handling elements.

    - **Text Formatting Bar.** Contains design tools for formatting text within Paradox.

    - **Project Viewer.** Manages the elements within a directory.

    - **Status Bar.** Indicates status of tasks being performed.


    # Creating a Database


    There is no magic wand to build a database from scratch in Paradox, though there
    are templates you can use. But for a unique database, you need to build it one
    step at a time.


    # Creating a Table with Table Expert


    The logical place to start creating a database is to build the container to hold
    the data. Fortunately, the Table Expert gives you a great tool to use appropriately.
    Even if the templates provided do not match your desired goal, you can modify
    the fields easily.


    - 1. **Click on File.** The File menu will appear.

    - 2. **Move the mouse pointer to New.** The New menu will appear.

    - 3. **Click on Table.** The New Table dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_246_1)


    - 4. **Click on Table Expert.** The Table Expert dialog box will open.

    - 5. **Click on the Personal option.** The templates list will change to personal-oriented
    templates.

    - 6. **Click on Albums.** Albums will be highlighted and the Available Fields
    list will change to reflect the appropriate fields from the Albums table.

    - 7. **Click on the Add All button.** All of the fields in the Available Fields
    list will be added to the table list.


    ![](img/33d9b1681e3609bc590f82347ae3a699_247_0.png)


    - 8. **Click on Group Name.** The option will be highlighted and will appear in
    the Edit name box.

    - 9. **Change Group Name to Publisher.** The change will be reflected in the Edit
    name box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_247_1.png)


    - 10. **Click on Album Title.** The option will be highlighted and will appear
    in the Edit name box. Publisher will now appear in the table list.

    - 11. **Change Album Title to Title.** The change will be reflected in the Edit
    name box.

    - 12. **Click on the up arrow (↑) next to Change order.** The Title field is moved
    up one line on the list.


    ![](img/33d9b1681e3609bc590f82347ae3a699_248_0.png)


    - 13. **Repeat steps 10-12 as needed** until the fields in the table list are
    the same as those reflected in Table 17-1.

    - 14. **Click on Next.** The Table Expert dialog box will open.


    # Table 17.1. Fields for the New Table


    - Title

    - Publisher

    - YearofPub

    - Volume

    - Issue

    - Description

    - Remarks


    ![](img/33d9b1681e3609bc590f82347ae3a699_248_1.png)


    # CHAPTER 17: LEARNING PARADOX BASICS


    ![](img/33d9b1681e3609bc590f82347ae3a699_249_0.png)


