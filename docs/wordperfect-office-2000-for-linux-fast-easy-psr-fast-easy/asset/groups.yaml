    # 25 Using CoreCENTRAL Memo to Keep Informed


    There is an endangered species in the office place today, a form of communication
    that is quickly dying out. It is the memorandum, or memo, for short. This once-proud
    method of getting ideas across to other people has slowly, insidiously been replaced
    by the advent of the e-mail message and the sticky note.


    Sadly, CoreCENTRAL Memo does not so much emulate the traditional memorandum as
    the sticky note, so don''t look for any sudden revivals here. Still, sticky notes
    do have their uses, even when they are on your computer screen. In this chapter,
    you''ll learn how to:


    - Create memos in CoreCENTRAL Memo

    - Organize memos


    # Creating a Memo


    Making a memo is a simple process by anyone''s standards. This makes a lot of
    sense, because a complicated process would detract from the whole point of the
    memo: something on which to jot down a thought or reminder quickly.


    ![](img/33d9b1681e3609bc590f82347ae3a699_363_0.png)


    - 1. Click the Create a memo button. A new memo icon will appear in the memo window.


    ![](img/33d9b1681e3609bc590f82347ae3a699_363_1.png)


    - 2. Type a memo subject at the placeholder.

    - 3. Click in the memo content box. The mouse pointer will appear in the text
    box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_364_0.png)


    - 4. Type the memo content in the memo content box. The memo will be completed.


    ![](img/33d9b1681e3609bc590f82347ae3a699_364_1.png)


    # Organizing Memos


    As you can see, creating a memo is not a big deal. The nice thing about memos
    is that unlike sticky notes that clutter your appliances, doors, and computer
    screens, you can actually organize your memos into categories.


    - 1. Click on a memo. The memo will be selected.

    - 2. Click on Category. The Category menu will appear.

    - 3. Click on Move to category. The Move-Category dialog box will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_364_2.png)


    # 342 CHAPTER 25 USING CORECENTRAL MEMO TO KEEP INFORMED


    - 4a. Type a new category. The information will appear in the Select new category
    box.

    OR

    - 4b. Click the down arrow (↓) next to the Select new category box if a category
    exists for your memo. A drop-down list will appear.

    - 5. Click on a category. The category will be selected and will appear in the
    Select new category box.

    - 6. Click on OK. The Move-Category dialog box will close and the memo text box
    will display all of the memos in the assigned category.


    ![](img/33d9b1681e3609bc590f82347ae3a699_365_1.png)


    - 7. Click on the down arrow (↓) next to the category box. A list of all assigned
    categories will appear.

    - 8. Click on a category. The category will be selected and the memo window will
    display all of the memos in the assigned category.


    # 26 Using CoreCENTRAL Address Book to Keep in Touch


    The third component of the CoreCENTRAL application is the Address Book. It is
    here that you can compile and organize the contact information of all of your
    friends, colleagues, and associates into one easy-to-use interface. In this chapter,
    you’ll learn how to:


    - Add addresses to the Address Book

    - Keep addresses updated

    - Find addresses in your Address Book

    - Create and manage multiple Address Books


    # Creating an Address


    Made a new friend today? Picked up a new client off the corporate website? Then,
    you need to add her address information into the Address Book.


    - 1. Click the Create a new address entry button. The New dialog box will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_367_0.png)


    - 2. Click on Person. Person will be selected.

    - 3. Click on OK. The New dialog box will close and the Person Properties dialog
    box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_367_1.png)


    # 345 CREATING AN ADDRESS


    ![](img/33d9b1681e3609bc590f82347ae3a699_368_0.png)


    - 4. Type all available information in the appropriate boxes.

    - 5. Click on the Personal tab. The Personal tab will come to the front.


    ![](img/33d9b1681e3609bc590f82347ae3a699_368_1.png)


    - 6. Type all available information in the appropriate boxes.

    - 7. Click on OK. The Personal Properties dialog box will close and the entry
    will be added to the Address Book.


    # Editing Addresses


    The average American moves three times in his life. And guess what? That means
    you need to edit the Address Book entries from time to time.


    - 1. Click on an address entry. The entry will be selected.

    - 2. Click the Edit an address entry button. The entry''s Properties dialog box
    will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_369_0.png)


    - 3. Type any new or additional information in the entry boxes.

    - 4. Click on OK. The entry''s Properties dialog box will close and the entry
    will be updated in the Address Book.


    ![](img/33d9b1681e3609bc590f82347ae3a699_369_1.png)


    # Importing Addresses


    If you have just purchased WordPerfect Office 2000, you might not be very sanguine
    about retyping all of your old application''s contact addresses into CoreCENTRAL
    Address Book. Here''s a way to eliminate a lot of extra work on your part. All
    you need to do beforehand is export your legacy addresses into a text file, which
    many PIM applications can do with ease.


    - 1. Click on an Address Book. The book will be selected.


    - 2. Click on File. The File menu will appear.

    - 3. Click on Import. The Import dialog box will appear.


    > TIP

    Pressing Ctrl+I will open the Import dialog box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_370_1.png)

