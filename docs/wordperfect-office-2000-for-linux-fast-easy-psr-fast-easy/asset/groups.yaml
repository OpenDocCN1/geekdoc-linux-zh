- md: '

    # Changing Slide Designs


    Changing an individual slide''s basic design is pretty easy, leaving you plenty
    of time to think of what you want to say.


    ![](img/33d9b1681e3609bc590f82347ae3a699_303_0.png)


    - 1. Click on the Slide Editor tab. The Slide Editor window will come to the front.

    - 2. Click on the Select Format button. The Select Format menu will appear.

    - 3. Click on Bulleted List. The slide will change to the new layout style.


    # Changing Slide Show Designs


    Presentations lets you quickly modify the look and feel of the entire slide show.


    - 1. Click on the Slide Editor tab. The Slide Editor window will come to the front.

    - 2. Click on the Master Gallery button. The Master Gallery dialog box will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_303_1.png)


    ![](img/33d9b1681e3609bc590f82347ae3a699_304_0.png)


    - 3. Click on the down arrow (↓) next to the Category box. The Category drop-down
    list will appear.

    - 4. Click on Theme. The styles of the Theme category will be displayed.


    ![](img/33d9b1681e3609bc590f82347ae3a699_304_1.png)


    - 5. Click on Road. The theme will be selected.

    - 6. Click on OK. The Master Gallery dialog box will close and the new theme will
    be applied to all of the slides in the presentation.


    # CHAPTER 20: EDITING A SLIDE SHOW


    # Making Speaker Notes


    When you''re up there in front of the audience, no matter how many times you''ve
    practiced, you likely need some speaker notes to help guide through your speech.
    Presentations let you create speaker notes that are associated with any slide
    you desire, so you can get through the rough spots.


    ![](img/33d9b1681e3609bc590f82347ae3a699_305_0.png)


    - 1. Click on the Slide Editor tab. The Slide Editor window will come to the front.

    - 2. Click on the Speaker Notes button. The Slide Properties dialog box will open,
    with the Speaker Notes tab in the foreground.

    - 3. Click the down arrow (↓) next to the Slide Navigator box. The list of slides
    in the presentation will appear.

    - 4. Click on the slide you want to add notes to. The slide will be selected.


    ![](img/33d9b1681e3609bc590f82347ae3a699_305_1.png)


    ![](img/33d9b1681e3609bc590f82347ae3a699_306_0.png)


    - 5. Click the Insert Text from Slide. The text from the slide will appear in
    the notes.

    - 6. Type additional notes. The text will appear in the notes.

    - 7. Click on OK. The speaker notes for the slide will be set.


    ![](img/33d9b1681e3609bc590f82347ae3a699_306_1.png)


    # Printing in Presentations


    Most of the time, you use Presentations to project slide show presentations onscreen.
    At times, you might need to print a hard copy of the presentation, if only for
    posterity.


    # Printing a Slide Show


    ![](img/33d9b1681e3609bc590f82347ae3a699_306_2.png)


    Printing a presentation in Presentations is just like printing a document anywhere
    else in WordPerfect Office 2000.


    - 1. Click on the Slide Editor tab. The Slide Editor window will come to the front.

    - 2. Click on the Print button. The presentation will be printed.


    # Printing Speaker and Audience Notes


    Another common task in Presentations is printing speaker notes and audience notes.
    Audience notes are a miniature printout of the slides in your presentation that
    viewers can use to make their own notes on what you have to say.


    ![](img/33d9b1681e3609bc590f82347ae3a699_307_0.png)


    - 1. Click on File. The File menu will appear.

    - 2. Click on Print. The Print dialog box will open.

    - 3. Click the Speaker notes option. The option will be selected.

    - 3. Click the Audience notes option. The option will be selected.

    - 4. Click on Print. The presentation''s speaker or audience notes will be printed,
    depending on the option selected.


    ![](img/33d9b1681e3609bc590f82347ae3a699_307_1.png)


    # Working with Special Effects


    You''ve seen them before: those fabulous presentations that have all the bells
    and whistles. Presentations lets you include these features in your slide shows.
    Remember, however, that it is more important what you say than how you say it.
    In this chapter, you''ll learn how to:


    - Add tables to your presentation

    - Insert charts into a slide

    - Add stunning transitions between slides

    - Place sound effects in your slide show


    # Adding Tables


    Unlike WordPerfect, Presentations has no inherent table tools of its own. To create
    a table effect, you need to insert a specialized chart.


    ![](img/33d9b1681e3609bc590f82347ae3a699_309_0.png)


    - 1. Click on the Slide Editor tab. The Slide Editor window will come to the front.

    - 2. Click the Chart button. The Chart mouse pointer will appear.

    - 3. Click and drag the Chart mouse pointer across the slide. The position of
    the chart will appear as an outlined box.

    - 4. Release the mouse button. The Data Chart dialog box will open.

    - 5. Click on Table in the Chart type box. Table will be highlighted and examples
    of table charts will appear on the right side of the dialog box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_310_0.png)


    - 6. Click on a table example. The example will be selected.

    - 7. Click in the Use sample check box. A check (✓) will be placed in the check
    box and the example will be cleared.

    - 8. Click on OK. The Data Chart dialog box will close and the chart will appear
    in the slide with the Datasheet dialog box open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_310_1.png)


    - 9. Type some data into the spreadsheet.

    - 10. Click the Close button (X). The Datasheet dialog box will close.


    ![](img/33d9b1681e3609bc590f82347ae3a699_311_0.png)


    - 11. Double-click the table. The Table Properties dialog box will be opened.

    - 12. Click the Line Color button. The Line Color palette will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_311_1.png)


    - 13. Click on a new color. The color will be selected and the palette will close.

    - 14. Click on the Font tab. The Font tab will come to the front.


    # Inserting Charts


    - 15. Click the Color button. The Color palette will appear.

    - 16. Click on a new color. The color will be selected and the palette will close.

    - 17. Click on OK. The Table Properties dialog box will close and the table will
    have a new appearance.


    You can''t have a business presentation without a chart, it seems. Making a graphic
    chart is much like making a table, as you can see.


    - 1. Click on the Slide Editor tab. The Slide Editor window will come to the front.

    - 2. Click the Chart button. The Chart mouse pointer will appear.

    - 3. Click and drag the Chart mouse pointer across the slide. The position of
    the chart will appear as an outlined box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_312_0.png)

    ![](img/33d9b1681e3609bc590f82347ae3a699_312_1.png)


    - 4. Release the mouse button. The Data Chart dialog box will open.

    - 5. Click on Table in the Chart type box. Table will be highlighted and examples
    of table charts will appear on the right side of the dialog box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_313_0.png)


    - 6. Click on a table example. The example will be selected.

    - 7. Click in the Use sample check box. A check (N) will be placed in the check
    box and the example will be cleared.

    - 8. Click on OK. The Data Chart box will close and the chart will appear in the
    slide with the Datasheet dialog box in the foreground.


    - 9. Type some data into the spreadsheet.

    - 10. Click the Series button. The Series Properties dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_313_1.png)


    - 11. Click on the Area option. The option will be selected for Series 1: North.


    ![](img/33d9b1681e3609bc590f82347ae3a699_314_0.png)


    - 12. Click on the Fill tab. The Fill tab will come to the front.

    - 13. Click on the Foreground button. The Foreground palette will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_314_1.png)


    - 14. Click on a new color. The color will be selected and the palette will close.

    - 15. Click the Next Series button. Series 2: South settings will appear.

    - 16. Click the Type/Axis tab. The Type/Axis tab will come to the front.

