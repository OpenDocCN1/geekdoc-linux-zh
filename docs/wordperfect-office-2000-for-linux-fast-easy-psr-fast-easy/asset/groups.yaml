- md: '

    ## Creating Footnotes and Endnotes


    When creating more technical documents, you might need to insert footnotes or
    endnotes.


    ![](img/33d9b1681e3609bc590f82347ae3a699_144_0.png)


    - 1. Click the mouse pointer at the footnote. The insertion point will appear
    where you click.

    - 2. Click on Insert. The Insert menu will appear.

    - 3. Click on Footnote/Endnote. The Footnote/Endnote dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_144_1.png)


    - 4. Click on the Footnote number option. The option will be selected.

    - 5. Type the number for the footnote. The value is displayed in the Footnote
    Number box.

    - 6. Click on Create. The Footnote/Endnote dialog box will close and a footnote
    marker will appear in the text at the insertion point, and a new footer will appear
    on the same page.

    - 7. Type text in the footnote.

    - 8. Click the mouse pointer at the endnote. The insertion point will appear where
    you click.


    ![](img/33d9b1681e3609bc590f82347ae3a699_145_0.png)


    - 9. Click on Insert. The Insert menu will appear.

    - 10. Click on Footnote/Endnote. The Footnote/Endnote dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_145_1.png)


    - 11. Click on the Endnote Number option. The option will be selected.

    - 12. Type the number for the endnote. The value is displayed in the Endnote Number
    box.

    - 13. Click on Endnote Placement. The Endnote dialog box will open.

    - 14. Click on the Insert endnotes at insertion point option. The option will
    be selected.


    ![](img/33d9b1681e3609bc590f82347ae3a699_146_0.png)


    - 15. Click on OK. The Endnote Placement dialog box will close.


    ![](img/33d9b1681e3609bc590f82347ae3a699_146_1.png)


    - 16. Click on Create. The Footnote/Endnote dialog box will close and an endnote
    marker will appear in the text at the text insertion point, and a new footer with
    the endnote will appear on the last page of the document.

    - 17. Type text in the endnote.

    - 18. Click outside the endnote footer to resume document editing. The insertion
    point will appear where you click.


