    ## 7 使用表格和列进行构建


    在当今时代，越来越多的人开始自己创业。无论是在企业格子隔间里工作的普通薪水阶层者，还是高薪的企业家，这些人都在发现，他们不仅要精通自己的业务，还要学会推销自己。他们希望完成工作，同时也希望在完成工作时被人们看到。WordPerfect
    的表格和列功能允许你创建让你和你你的工作脱颖关注的文档。在本章中，你将学习如何：


    - 为数据和页面布局创建并编辑表格

