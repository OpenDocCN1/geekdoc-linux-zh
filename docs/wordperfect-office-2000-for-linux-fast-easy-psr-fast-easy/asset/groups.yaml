    rows will appear in the table.**


    ![](img/33d9b1681e3609bc590f82347ae3a699_113_1.png)


    - **7. Right-click on a data cell in one of the new rows. The Table Configuration
    menu will appear.**

    - **8. Click on Delete. The Delete Structure/Content dialog box will be open.**


    ![](img/33d9b1681e3609bc590f82347ae3a699_113_2.png)


    - **9. Click the Rows option. The Rows option will be highlighted.**

    - **10. Type a number of rows to delete. The value will be displayed in the Rows
    field.**

    - **11. Click on OK. The Delete Structure/Content dialog box will close and the
    specified number of rows will disappear from the table.**


    ![](img/33d9b1681e3609bc590f82347ae3a699_114_0.png)


    RedLine''s management of these three processes can be visualized as interlocking
    components, with Document Management at the core of the application''s functionality,
    closely coupled with Version Control


    | | TABLE A | Cell B3 |

    |---|---|---|

    | RedLine Requirements | | Pg 3 | Ln 7.04" Pos 4.33" |


    - **12. Type data in the new row. The data will appear in the appropriate cells.**

    - **13. Move the mouse pointer over the dividing line between the columns. The
    pointer will change to a line moving pointer.**


    ![](img/33d9b1681e3609bc590f82347ae3a699_114_1.png)


    - **14. Click and drag the line moving pointer to the left. The line indicator
    will also move to the left.**


    | | | |

    |---|---|---|

    | RedLine Requirements | | Pg 3 | Ln 7.04" Pos 4.33" |


    - **15. Release the mouse button.**


    The columns will be resized.


    ## Formatting Tables


    A table is, essentially, just a collection of data in rows and columns. But who
    wants just essentially in this day and age?


    ![](img/33d9b1681e3609bc590f82347ae3a699_115_1.png)


    ## Using the Format Tool


    You can configure virtually every property table might have. You can lock cells
    so they can''t be edited.


    - **1. Right-click on a data cell. The Table Configuration menu will appear.**

    - **2. Click on Format. The Properties for Table Format dialog box will open.**


    ![](img/33d9b1681e3609bc590f82347ae3a699_115_0.png)


    - **3. Click on the Lock cell to prevent changes. A checkmark will be placed in
    the box.**

    - **4. Click on Row. The Row pane will appear.**

    - **5. Click on Fixed. The option will be highlighted.**

    - **6. Type a value for row height. The value (in inches) will appear in the Fixed
    field.**

    - **7. Click on OK. The Properties for Table Format dialog box will close and
    the table will reflect the changes.**


    ![](img/33d9b1681e3609bc590f82347ae3a699_116_1.png)


    ## CHAPTER 7: BUILDING TABLES AND COLUMNS


    ### Using SpeedFormat


    If you don''t have the time to create a unique look for your tables, use SpeedFormat
    to apply a preconfigured format for you.


    - **1. Right-click on the table. The Table Configuration menu will appear.**

    - **2. Click on SpeedFormat. The SpeedFormat dialog box will open.**

    - **3. Click on a format. A preview of the format will appear in the preview window.**

    - **4. Click on the box to Clear current format before applying. A checkmark will
    be placed in the box.**


    ![](img/33d9b1681e3609bc590f82347ae3a699_117_1)


    - **5. Click on Apply. The selected format will be applied to the table.**

    - **6. Click on Close. The SpeedFormat dialog box will close.**


    ## CREATING MULTI-COLUMN DOCUMENTS


    If you want to make a newsletter or magazine-style document, you will need to
    manipulate the amount of columns the document contains. The default number of
    columns, of course, is one most big-column documents have. Changing and manipulating
    this number is simple.


    ### Creating Columns


    Creating additional columns in Word is not too hard. It''s remarkably easy.


    - **1. Click on the Columns button. The menu will appear.**


    ![](img/33d9b1681e3609bc590f82347ae3a699_118_1)


    - **2. Click on the desired number of columns. The Column menu will close and
    the same number of columns will appear in the document.**


    ## Formatting Columns


    Once you have a multi-column document, you can easily format the columns as well.


    - **1. Click on the Columns button. The Column menu will appear.**

    - **2. Click on Format. The Column menu will close and the boxes dialog box will
    appear.**

