    # 使用 Paradox


    如果你像我一样是一个收藏家，那么使用数据库并不是一个遥不可及的想法。毕竟，哪个收藏家不想让他心心珍的缅甸瓶盖按状况、重量和弯曲角度进行索引和交叉引用呢？非收藏者们也可以宽宽心——正如你们很快读到的，Paradox
    对你们也大有用处。在本章中，你将学习如何：


    - 使用 Paradox 数据库中的信息制作邮件标签

