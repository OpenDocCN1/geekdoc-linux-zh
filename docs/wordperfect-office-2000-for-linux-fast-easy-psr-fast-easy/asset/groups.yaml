    appear in the document as a table.


    # Managing Longer Documents


    WordPerfect makes it easy to create documents of any size. It includes several
    tools to give your documents a professional typeset look. In this chapter, you’ll
    learn how to:


    - Configure the page

    - Create page breaks

    - Build page headers and footers

    - Create a table of contents

    - Make an index


    # CHAPTER 9: MANAGING LONGER DOCUMENTS


    ## Setting Page Options


    Not all pages fit 8-1/2” × 11” sheets. For off-sized pages with differing margins,
    you can quickly configure WordPerfect to conform.


    ![](img/33d9b1681e3609bc590f82347ae3a699_135_0.png)


    ## Changing Margins


    Changing the margins of a page is a simple operation in WordPerfect.


    - 1. Click on File. The File menu will appear.

    - 2. Click on Page Setup. The Page Setup dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_135_1.png)


    - 3. Click on the Margins/Layout tab. The Margins/Layout tab will come to the
    front.

    - 4. Change the Left, Right, Top, and Bottom fields to 1.5”. The values will be
    displayed in those fields.

    - 5. Click on OK. The Page Layout dialog box will close and the margins of the
    document will be changed.


    ## Setting Paper Orientation


    When paper is held as a tall sheet, it is in portrait orientation.

    When it is short and wide, it is in landscape orientation. You

    can change this electronically in WordPerfect.


    ![](img/33d9b1681e3609bc590f82347ae3a699_136_0.png)


    - 1. Click on File. The File menu will appear.

    - 2. Click on Page Setup. The Page Setup dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_136_1.png)


    - 3. Click on the Landscape option. The option is selected and the preview display
    will show the result.

    - 4. Click on OK. The Layout dialog box will close and the orientation of the
    document will be changed.


    # CHAPTER 9: MANAGING LONGER DOCUMENTS


    ## Selecting a Paper Size


    Besides letter-size paper, you can use many other paper sizes.


    ![](img/33d9b1681e3609bc590f82347ae3a699_137_0.png)


    - 1. Click on File. The File menu will appear.

    - 2. Click on Page Setup. The Page Setup dialog box will open.

    - 3. Click on a paper size. The paper size will be selected and the preview display
    will show the result.

    - 4. Click on OK. The Page Layout dialog box will close and the newly sized document
    will be displayed.


    ## Inserting a Page Manually


    When you create documents, new pages are generated as text from one page to the
    next. You can, however, dictate where one page stops and where a new begins.


    ![](img/33d9b1681e3609bc590f82347ae3a699_138_0.png)


    ## Inserting a Page Break


    Stopping a page at a certain point is the job of the page break.


    - 1. Click the mouse pointer where you want the page break. The insertion point
    will appear where you click.

    - 2. Press Ctrl+Enter. The page break will appear at the insertion point.


    ![](img/33d9b1681e3609bc590f82347ae3a699_138_1.png)


    The new page begins.


    ## Deleting a Page Break


    If you want to remove a page break that was manually inserted, follow these steps:


    - 1. Click the mouse pointer on the first line after the page break. The insertion
    point will appear where you click.

    - 2. Press Backspace. The page break will be removed.


    ![](img/33d9b1681e3609bc590f82347ae3a699_139_0.png)


    The page break disappears.

    ![](img/33d9b1681e3609bc590f82347ae3a699_139_1.png)


    # CHAPTER 9: MANAGING LONGER DOCUMENTS


    ## Working with Headers and Footers


    In most professional publications, you see headers and footers. Here that page
    numbers, dates, and other information can appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_140_0.png)


    ## Creating a Header or Footer


    Making a simple header or footer is a quick process.


    - 1. Click on Insert. The Insert menu will appear.

    - 2. Click on Header/Footer. The Headers/Footers dialog box will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_140_1.png)


    - 3. Click on the Header option. The option will be selected.

    - 4. Click on Create. The Headers/Footers dialog box will close and the new header
    will appear in the document.


    ![](img/33d9b1681e3609bc590f82347ae3a699_140_2.png)


    - 5. Type text. Text will appear in the new header on every page.


    ![](img/33d9b1681e3609bc590f82347ae3a699_141_0.png)


    ## Adding Date and Time


    You can add fields to headers and footers that generate the date or time automatically.


    - 1. Click the mouse pointer in the header or footer you want to edit. The insertion
    point will appear where you click.

    - 2. Click on Insert. The Insert menu will appear.

    - 3. Click on Date/Time. The Date/Time dialog box will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_141_1.png)


    - 4. Click the date/time format you want. The format will be selected.

    - 5. Click on the box next to Keep the inserted date current. A check (V) will
    be placed in the check box.

    - 6. Click on Insert. The Date/Time dialog box will close and the date/time will
    appear at the insertion point.


    ## Page Numbering


    When your documents get big, you need to number the pages to keep them straight.
    You don''t have to type them all in yourself—WordPerfect handles it for you.


    - 1. Click on Format. The Format menu will open.

    - 2. Move the mouse pointer to Page. The Page menu will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_142_1.png)


    - 3. Click on Numbering. The Select Page Numbering Format dialog box will appear.


    - 4. Click on the down arrow (↓) next to the Position box. The Position list will
    be displayed.

    - 5. Click on a position. The position will be selected.


    ![](img/33d9b1681e3609bc590f82347ae3a699_143_0.png)


    - 6. Click on a format. The format will be selected.

    - 7. Click on OK. The Select Page Numbering Format dialog box will close and the
    page numbers will appear at the appropriate positions on the pages.


    ![](img/33d9b1681e3609bc590f82347ae3a699_143_1.png)

