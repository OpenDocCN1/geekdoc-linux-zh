    # 18


    # Working with Paradox


    If you are a collector like me, then using a database is not such a far-fetched
    idea. After all, what collector would not want his prized collection of Burmese
    bottle caps indexed and cross-referenced for condition, weight, and angle of bend?
    Non-collectors, take heart—Paradox has plenty of uses for you, as you will soon
    read. In this chapter, you''ll learn how to:


    - Make mailing labels using information in a Paradox database

    - Send data directly to a Web page

    - Use data directly in a Quattro Pro spreadsheet

    - Import and export data to and from a variety of formats


    # CHAPTER 18: WORKING WITH PARADOX


    # Creating Mailing Labels


    Every holiday season it happens: You need to send cards to the people you know.
    Or if you want to send the latest marketing brochures to a database full of customers.
    If the information is in Paradox, here''s how you can get it onto mailing labels.


    1. Click on Tools. The Tools menu will appear.


    2. Click on Experts. The Paradox Experts dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_267_0.png)


    3. Click on Mailing Label. The option will be selected.


    4. Click on Run Expert. The Mailing Label Expert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_267_1.png)


    ![](img/33d9b1681e3609bc590f82347ae3a699_268_0.png)


    5. Click on 5161 – Address. That Avery mailing label type will be selected.


    6. Click on Next. The next Mailing Label Expert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_268_1.png)


    7. Click on vendors.db. The database table will be selected.


    8. Click on Next. The next Mailing Label Expert dialog box will open.


    # 246 CHAPTER 12. WORKING WITH PARADOX


    9. Click on AmerMd BT. The font will be selected.


    ![](img/33d9b1681e3609bc590f82347ae3a699_269_0.png)


    > TIP

    > It''s a good idea to leave the text size for mailing labels fairly small, so
    all of the address can actually fit on the label.


    10. Click on Next. The next Mailing Label Expert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_269_1.png)


    11. Click on By. The option will be selected.


    12. Click on Next. The next Mailing Label Expert dialog box will open.


    # CREATING MAILING LABELS


    13. Click on Vendor Name. The field will be selected.


    14. Click on Place Field. The Vendor Name field will be moved to the Sample window.


    ![](img/33d9b1681e3609bc590f82347ae3a699_270_0.png)


    15. Click on the line (Vendor Name) in the Sample window. The line will be selected.


    16. Click on Street. The field will be selected.


    17. Click on Place Field. The Street field will be moved to the Sample window
    at the insertion point.


    ![](img/33d9b1681e3609bc590f82347ae3a699_270_1.png)


    # 248 CHAPTER 10: WORKING WITH PARADOX


    18. Repeat Steps 15–17 to insert the City, State/Prov, and Zip/Postal fields in
    the Sample window. Use punctuation and spacing between field names as needed.


    19. Click on Next. The next Mailing Label Expert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_271_0.png)


    20. Type a name for the labels. The name will appear in the Label name text box.


    21. Click on View the labels onscreen (and print them later). The option will
    be selected.


    22. Click on Finish. The Mailing Label Expert dialog box will close and the labels
    will be displayed.


    # Publishing Data to a Web Page


    The pervasiveness of the Internet in the business world today means that we need
    new ways of sharing information. Paradox steps up to this challenge by enabling
    you to create a report ready for the World Wide Web.


    ![](img/33d9b1681e3609bc590f82347ae3a699_272_0.png)


    1. Click on File. The File menu will appear.

    2. Move the mouse pointer to Open. The Open submenu will appear.

    3. Click on Report. The Open Report dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_272_1.png)


    4. Click on the report you want to open. The file name will be selected.

    5. Click on Open. The report will open.


    # 250 CHAPTER 18 WORKING WITH PARADOX


    6. Click on File. The File menu will appear.

    7. Move the mouse pointer to Publish As. The Publish As submenu will appear.

    8. Click on HTML. The HTML Report Expert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_273_1.png)


    9. Type a title for the HTML report. The title will appear in the Type a title
    for the HTML document text box.

    10. Click on a text color. The Sample will change to match the selection.

    11. Click on a background color. The Sample will change to match the selection.

    12. Click on Next. The next HTML Report Expert dialog box will open.


    # PUBLISHING DATA TO A WEB PAGE


    13. Click on the List of Country field check box. A check (V) will be placed in
    the box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_274_0.png)


    14. Click on Next. The next HTML Report Expert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_274_1.png)


    15. Type a name for the HTML report. The name will appear in the Type file name
    for the HTML document text box.


    16. Click on Finish. The HTML Report Expert dialog box will close and the Web
    page will be generated.


    ![](img/33d9b1681e3609bc590f82347ae3a699_274_2.png)


    # Using Data in a Quattro Pro Spreadsheet


    Although database tables and spreadsheets look very similar, in reality they''re
    very different. But you easily still grab data from a database and put it into
    a Quattro Pro spreadsheet.


    1. Click on the data to copy. The data will be selected.

    2. Press Ctrl+C. The data will be copied.


    ![](img/33d9b1681e3609bc590f82347ae3a699_275_0.png)


    3. Click on the cell in Quattro Pro where you want to copy the data. The cell
    will be selected.

    4. Press Ctrl+V. The data will be pasted into the cell.


    ![](img/33d9b1681e3609bc590f82347ae3a699_275_1.png)


    # Importing and Exporting Data


    Beyond the simple cutting and pasting of data, you can import whole files of data—and
    export databases to new types of data files as well.


    # Importing Data


    Paradox lets you import an array of data files, including text files and spreadsheets.
    You can even pull in data from alternate formats, such as Excel.


    1. Click on File. The File menu will appear.

    2. Click on Import. The Import dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_276_0.png)


    3. Click on Import. The Import dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_276_1.png)

