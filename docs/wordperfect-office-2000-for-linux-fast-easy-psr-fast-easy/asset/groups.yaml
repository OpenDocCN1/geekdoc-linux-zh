    ## 3 Getting Help with WordPerfect Office 2000


    No matter how intuitive designers try to make them, computers are not easy to
    use—unless you are under the age of 16. Many software designers recognize this
    fact and try to implement online help. WordPerfect Office 2000 has this traditional
    online help for you to use, but it does not stop there. You can also get help
    from the Internet and use a tool that can guide you through a task as you are
    doing it! In this chapter, you''ll learn how to:


    - Master the online help in Office 2000

    - Let PerfectExpert guide you through tasks


    ## CHAPTER 3 GETTING HELP WITH WORDPERFECT OFFICE 2000


    ### Starting Online Help


    When you can''t find an answer to a problem, you might consult a reference. The
    reference might be your friend, a lifeline, or just a book like this one. In WordPerfect,
    the fastest place to check is the online help files.


    ![](img/33d9b1681e3609bc590f82347ae3a699_51_0.png)


    1. Click on Help in any WordPerfect 2000 application. The Help menu will appear.

    2. Click on Help Topics. Your default Web browser will appear, opened to the help
    files for that particular Office 2000 application.

    3. Click on the expansion control for the desired topic. The list of subtopics
    will appear.

    4. Click on the desired topic. The topic will be highlighted and the content of
    the topic will appear in the content frame of the browser.


    ![](img/33d9b1681e3609bc590f82347ae3a699_52_0.png)


    > NOTE The plus signs in the topic area are expansion controls and will "open"
    the subtopics within a given topic.


    5. Click on the Next Page control. The next help topic will be displayed in the
    content frame.


    ![](img/33d9b1681e3609bc590f82347ae3a699_52_1.png)


    6. Click on How To. A list of specific topic-related tasks will appear.

    7. Click on a task. The task will be displayed in the content frame.

    8. Click on the box next to Related Topics at the bottom of the topic page. A
    list of topic-related links will appear.

    9. Click on a topic link. The content frame will display the new topic.


    ![](img/33d9b1681e3609bc590f82347ae3a699_53_0.png)


    10. Click the Close button (X). The web browser will close.


    ### Searching for Answers in Help


    Sometimes the topic headings don''t reveal exactly what you are looking for. Or
    you might simply not have time to skim the headings. Luckily, you can directly
    search through the help topics.


    1. Click on the Search tab in online help. The Search tab will come to the front.

    2. Type the keyword(s) you want to learn about. The terms will be displayed.

    3. Click on Find. Any results with the search terms will be displayed.


    ![](img/33d9b1681e3609bc590f82347ae3a699_53_1.png)


    ### Netscape Quattro Pro 9 Help


    4. Click on the desired topic. The topic will be highlighted.

    5. Click on Display. The content frame will display the topic.


    ![](img/33d9b1681e3609bc590f82347ae3a699_54_0.png)


    ### Using PerfectExpert


    If you get stuck on how to do something, you might not need to leave the application
    in which you are working. With the help of PerfectExpert, you can get hints right
    as you are working.


    ![](img/33d9b1681e3609bc590f82347ae3a699_54_1.png)


    ### Getting Assistance as You Go


    Not only does PerfectExpert help you start up a new document, it can also assist
    you with the document you are working in.


    1. Click on Help. The Help menu will appear.

    2. Click on PerfectExpert. The PerfectExpert pane will open adjacent to the document
    window.


    ![](img/33d9b1681e3609bc590f82347ae3a699_55_0.png)


    3. Click on the desired topic. The content of the topic will fill the PerfectExpert
    pane.


    ![](img/33d9b1681e3609bc590f82347ae3a699_55_1.png)


    4. Click on the desired subtopic. The tool to accomplish the task will open.


    > NOTE If there is no specific tool to accomplish the task, then a detailed set
    of instructions will appear in the PerfectExpert pane.


    ### Stopping PerfectExpert


    After you are finished with PerfectExpert, you need to close it to regain your
    document space.


    1. Click the Close button (X) in the PerfectExpert pane. The pane will close.


    ![](img/33d9b1681e3609bc590f82347ae3a699_56_0.png)


    ### Part I Review


    1. How do you start a WordPerfect program? See “Starting WordPerfect Window” in
    Chapter 1.

    2. How many applications are in the WordPerfect Office 2000 suite? See “Exploring
    WordPerfect 2000” in Chapter 1.

    3. How do you exit a WordPerfect program? See “Exiting WordPerfect 2000” in Chapter
    1.

    4. How do you create a new empty document? See “Making an Empty Document” in Chapter
    2.

    5. What is PerfectExpert? See “Using PerfectExpert” in Chapter 2.

    6. How do you use templates? See “Opening a Template” in Chapter 2.

    7. How can you open a Microsoft document in WordPerfect Office 2000? See “Opening
    a Document” in Chapter 2.

    8. Where can you print a document? See “Printing a Document” in Chapter 2.

    9. How do you search the help files? See “Searching for Answers in Help” in Chapter
    3.

    10. How do you get help as you work in WordPerfect 2000? See “Getting Assistance
    as You Go” in Chapter 3.


