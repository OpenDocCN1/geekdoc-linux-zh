    ## 24 使用中心日历保持有序


    技术本应该让我们的生活变得更容易。记得这一点吗？如果你有任何疑问，尝试这个规模上的统计数据：50,000 年前，平均人每周需要大约 20 小时来家人提供食物、衣服和住房。其余时间他可以闲逛。而今天，一个人平均每周工作
    50 小时才能实现相同的目标。技术并没有让事情变得更容易；它只是在我们享受坚果和浆果放松之前给了我们更多要做的事。在本章中，你将学习如何：


    - 在 CoreCentral 日历中创建任务

    - 将任务链接到特定事件

    - 标记任务为完全完成或部分完成

    - 从任务列表中删除任务


    ## 第 24 章：使用中心日历


    ## 创建任务


    使用中心日历是跟踪生活中所有任务的一种好方法。其界面设计得非常简单。毕竟，为什么要让任务列表变得复杂化呢？


    - 1. 点击任务列表顶部的行。光标将出现在该行。

    - 2. 在行上输入任务。

    - 3. 双击任务行主题列以外的任何位置。将打开“编辑 - 任务”对话框。


    ![](img/33d9b1681e3609bc590f82347ae3a699_355_0.png)


    > 提示

    点击主工具栏上的创建新任务按钮也会启动“编辑 - 任务”对话框。


