    \n查询是一组指令，告诉数据库提取某些信息并将其存储在查询表（query table）中，查询表类似于子表。你可以在查询表中进行编辑，这些更改将反映主数据库中。\n\
    \n![](img/33d9b1681e3609bc590f82347ae3a699_256_0.png)\n\n- 1. 点击工具（Tools）。工具菜单将出现。\n\
    - 2. 点击查询（Query）。查询对话框将打开。\n\n![](img/33d9b1681e3609bc590f82347ae3a699_256_1.png)\n\
    \n- 3. 点击查询（Query）。将被选中。\n- 4. 点击运行（Run）。查询专家对话框将打开。\n\n## 234 第 17 章：学习悖论基础\n\
    \n5. 输入或确认表所在的目录。必要时点击浏览（Browse）。\n\n![](img/33d9b1681e3609bc590f82347ae3a699_257_0.png)\n\
    \n6. 点击下一（Next）。下一个查询专家对话框将打开。\n\n注意：如果在你的机器上看到如 \"C:\\\" 或 \"D:\\\" 的符号请担心。WordPerfect\
    \ 2000 这样解释磁盘分区。因此，如果你的分区是硬盘上的第二个分区，WordPerfect 将其称为 D:\\ 而不是 C:.\n\n7. 点击表框旁边的向下箭头\
    \ (↓)。将可用表的下拉列表。\n\n![](img/33d9b1681e3609bc590f82347ae3a699_257_1.png)\n\n8.\
    \ 点击 Comic Books.DB。Comic Books.DB 表将被选中，表中的字段将显示在可用字段（Available fields）框中。\n\n\
    9. 点击全部添加（Add All）按钮。所有字段将移动到显示框中。\n\n10. 点击下一（Next）。下一个查询专家对话框将打开。\n\n## 创建数据库\
    \ 235\n\n11. 点击详细（Detail）选项。该选项将被选中。\n\n12. 点击下一（Next）。下一个查询专家对话框将打开。\n\n![](img/33d9b1681e3609bc590f82347ae3a699_258_0.png)\n\
    \n13. 点击 Comic Books.Title。将被选中。\n\n14. 点击运算符（Operator）框旁边的向下箭头 (↓)。将出现可用运算符的下拉列表。\n\
    \n15. 点击等于（equal to）。将被选中，字段或值（Field or value）框将激活。\n\n![](img/33d9b1681e3609bc590f82347ae3a699_258_1.png)\n\
    \n## 第 17 章：学习悖论基础\n\n16. 在字段或值（Field or value）框中输入 Spider-man。数据将出现在字段中。\n\n\
    17. 点击下一（Next）。下一个查询专家对话框将打开。\n\n![](img/33d9b1681e3609bc590f82347ae3a699_259_0.png)\n\
    \n18. 点击 Comic Books.Volume。将被选中。\n\n19. 点击添加（Add）按钮。字段将移动到排序顺序（Sort order）框中。\n\
    \n![](img/33d9b1681e3609bc590f82347ae3a699_259_1.png)\n\n## 创建数据库 237\n\n![](img/33d9b1681e3609bc590f82347ae3a699_260_0.png)\n\
    \n20. 点击 Comic Books.Issue。将被选中。\n\n21. 点击添加（Add）按钮。字段将移动到排序顺序框中。\n\n22. 点击下一（Next）。下一个查询专家对话框将打开。\n\
    \n![](img/33d9b1681e3609bc590f82347ae3a699_260_1.png)\n\n23. 为查询输入名称。名称将出现在查询名称（Query\
    \ name）框中。\n\n24. 点击运行查询（Run Query）选项。该选项将被选中。\n\n25. 点击完成（Finish）。查询专家对话框将关闭，查询结果将显示。\n\
    \n## 使用报告专家创建报告\n\n报告与查询的区别仅在于输出类型。报告是只读的。信息进入报告后，你无法在那里进行更改。你必须更改表中的数据并重新运行报告。\n\
    \n![](img/33d9b1681e3609bc590f82347ae3a699_261_0.png)\n\n- 1. 点击文件（File）。文件菜单将出现。\n\
    - 2. 将鼠标指针移动到新建（New）。新建菜单将出现。\n- 3. 点击报告（Report）。新建报告（New Report）对话框将打开。\n\n![](img/33d9b1681e3609bc590f82347ae3a699_261_1.png)\n\
    \n- 4. 点击专家（Expert）。报告专家（Report Expert）对话框将打开。\n\n5. 点击来自一个表的数据（Data from one\
    \ table）选项。该选项将被选中。\n\n6. 点击下一（Next）。下一个报告专家对话框将打开。\n\n![](img/33d9b1681e3609bc590f82347ae3a699_262_0.png)\n\
    \n7. 点击表框旁边的向下箭头 (↓)。将出现可用表的下拉列表。\n\n8. 点击 Comic Books.DB。它将被选中，表中的字段将显示在可用字段（Available\
    \ fields）框中。\n\n9. 点击全部添加（Add All）按钮。所有字段将移动到显示这些字段（Display these fields）框。\n\n\
    10. 点击下一（Next）。下一个报告专家对话框将打开。\n\n![](img/33d9b1681e3609bc590f82347ae3a699_262_1.png)\n\
