    ## 8: Adding Style to Your Document


    These days, it takes more than snappy prose to make a document stand out. Sharp-looking
    documents are becoming the norm. WordPerfect has the tools to take your documents
    to this new visual level. In this chapter, you''ll learn how to:


    - Insert artwork into your document

    - Wrap text around artwork in your document

    - Make your text meet exacting space requirements

    - Use text boxes for great layout effects

    - Place objects from other documents within your document


    ## CHAPTER: ADDING STYLE TO YOUR DOCUMENT


    ### Using Artwork


    A picture is worth...well, you know the rest. People in many societies put a lot
    of effort into graphics to get their point across. Just think how boring (and
    short) this book would be without pictures!


    ### Inserting a Graphic


    When you create a document, the use of graphics will assist in getting your point
    across. Don''t get carried away however—too much artwork will drown out the text!


    1. Click the mouse pointer where you want to insert the graphic. The insertion
    point will appear where you click.

    2. Click on Insert. The Insert menu will open.

    3. Move the mouse pointer to Graphics. The Graphics menu will open.

    4. Click on From File. The Insert Image dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_123_0.png)


    5. Click the down arrow (↓) next to the Look in box. A list of common file system
    points will appear.


    6. Click on My Home. The file list will now display the contents of your home
    directory.


    > NOTE

    > In Linux, every user is given his or her home directory under /home/username.
    This is a good spot to keep your personal files.


    ![](img/33d9b1681e3609bc590f82347ae3a699_124_0.png)


    7. Click the graphic file you want to insert. The file will be highlighted.


    8. Click on Open. The Insert Image dialog box will close and the selected artwork
    will appear in the text.


    ![](img/33d9b1681e3609bc590f82347ae3a699_124_1.png)


    ## CHAPTER 8: ADDING STYLE TO YOUR DOCUMENT


    ### Editing a Graphic


    Once you have a graphic in place, you can edit it to further help it match your
    document''s style.


    ![](img/33d9b1681e3609bc590f82347ae3a699_125_0.png)


    1. Press the right mouse button (right-click) on the graphic. The Image Editing
    menu will appear.


    2. Click on Edit Box. The Edit Box dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_125_1.png)


    3. Click the Border field. The Border palette will open.


    4. Click a preferred border. The border will appear around the image.


    5. Click the Close button. The Edit Box dialog box will close.


    ### USING ARTWORK


    6. Right-click the mouse pointer on the graphic. The Image Editing menu will appear.


    7. Click on Image Tools. The Image Tools dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_126_0.png)


    Figure 2.1: Project Documentation Process


    Document1


    ![](img/33d9b1681e3609bc590f82347ae3a699_126_1.png)


    8. Click on Edit Attributes. The Image Settings dialog box will appear.


    Figure 2.1: Project Documentation Process Flow.


    Document1


    ## CHAPTER II: ADDING STYLE TO YOUR DOCUMENT


    ![](img/33d9b1681e3609bc590f82347ae3a699_127_0.png)


    9. Click on Scale Image. The Scale Image parameters will appear.


    10. Click the X & Y control to change the value to 7. The value will be changed
    in all scale fields.


    11. Click on OK. The Image Settings dialog box will close and the image (but not
    the box) will be scaled to the specified size.


    ![](img/33d9b1681e3609bc590f82347ae3a699_127_1.png)


    12. Click the Close button. The Image Tools dialog box will close.


    ### Wrapping Text around a Graphic


    Graphics, can hog a lot of space in your document. You can circumvent this limitation
    by wrapping text around the image.


    1. Right-click the mouse pointer on the graphic. The Image Editing menu will appear.

    2. Click on Wrap. The Wrap Text dialog box will open.

    3. Click on Square option. The Square option will be selected and Wrap around
    options will be activated.

    4. Click the Largest side option. The option will be selected.

    5. Click on OK. The Wrap Text dialog box will close and the text will be wrapped
    around the graphic.


    > TIP

    > You can create a nifty effect by selecting Behind text option for the graphic.
    Then simply select and apply a new color to the text for better contrast.


    ![](img/33d9b1681e3609bc590f82347ae3a699_128_0.png)


    ![](img/33d9b1681e3609bc590f82347ae3a699_128_1.png)


    ### Using It Fit


    Every in a while you are given a requirement to make a document exactly a certain
    length. In this age of electronic documents, this is not such a common requirement,
    it''s nice to know you can still do it if need.


    ![](img/33d9b1681e3609bc590f82347ae3a699_129_0.png)


    1. Click on Format. The Format menu will appear.

    2. Click on Make It Fit. The Make It dialog box will open.

    3. Type a new value in the Desired number of pages field. The value will appear
    in the field.

    4. Click the box next to Line spacing. The Line spacing box will be unchecked.

    5. Click on Make It Fit. The Make It dialog box close will be altered to the new
    specifications.


    ![](img/33d9b1681e3609bc590f82347ae3a699_129_1.png)


    ## Using Text Boxes


    ### Making a Text Box


    ### Using Text Boxes


    You use text boxes to create interesting layout effects. By placing some text
    within a text box, you can make that text behave independently of other text on
    the same page.


    ### Making a Text Box


    Text boxes are objects that act just like graphics, in terms of layout. They are
    simply boxes that contain text, rather than a picture, and can either anchor to
    the page or float in the document.


    1. Click the mouse pointer where you want to insert the text box. The insertion
    point will appear where you click.

    2. Click on Insert. The Insert menu will appear.

    3. Click on Text Box. A text box will appear in the document at the insertion
    point.


    ![](img/33d9b1681e3609bc590f82347ae3a699_130_0.png)


    4. Type text in the text box. The box will grow to accommodate the text within.


    ### Making a Multi-Column Text Box


    Creating boxes with multiple columns is a useful feature of WordPerfect.


    1. Click the mouse pointer within the text box. The insertion point will appear
    where you click.

    2. Click on the Columns button. The Columns menu will appear.

    3. Click on Format: Columns dialog box will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_131_0.png)


    ![](img/33d9b1681e3609bc590f82347ae3a699_131_1.png)


    ![](img/33d9b1681e3609bc590f82347ae3a699_131_2.png)

