    # Viewing CoreCENTRAL Calendar


    Before learning to use the CoreCENTRAL Calendar component, first examine its interface
    because it has yet to appear in any of the other WordPerfect Office 2000 components.


    +   Navigation calendar. This pane helps with navigating to specific dates, tells
    you the currently selected day, and gives you the bigger picture on how busy your
    month is shaping up to be.


    +   Event calendar. This pane lists all of the events on a given day in block
    format. You can enter events directly into this pane and change them with the
    mouse, as you see later in this chapter.


    ![](img/33d9b1681e3609bc590f82347ae3a699_341_0.png)


    +   New task input line. You can quickly enter tasks in this field.


    +   Task list. View a list of the currently active tasks here.


    > Tasks are the main topic of discussion in Chapter 24, "Using CoreCENTRAL Calendar
    to Keep Organized."'
