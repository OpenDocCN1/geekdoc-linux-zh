    ## 4 Learning Basics


    The word processor component of WordPerfect Office 2000 is called appropriately
    enough. WordPerfect''s main job is to get your words down on paper, be it real
    or electronic. In this chapter, you''ll learn how to:


    - Create text in your document

    - Edit a document by inserting, selecting, and deleting text

    - Correct mistakes using the Undo and Redo functions

    - Navigate within your document


    ## CHAPTER 4 LEARNING WORDPERFECT BASICS


    ### Typing Text


    We have come a long way since the days of the Gutenberg press, where small pieces
    of movable type were painstakingly arranged to create a single page of a book.
    Now, creating letters, reports, and even books is as easy as twiddling your fingers.


    ![](img/33d9b1681e3609bc590f82347ae3a699_61_0.png)


    1. Type some text. The text will appear onscreen.

    2. Press the Enter key. A new line will be started.

    3. Type a paragraph. The text will wrap automatically, so you will need only press
    the Enter key at the end of the paragraph.


    ### Editing Text


    It is not often that you can enter all your text right the first time. As you
    create documents, you often think of a better way to say something after typing
    it. This is when it''s useful to know how to edit text in WordPerfect.


    ### Inserting Text


    Inserting text within a WordPerfect document is simple. You can even type text
    over existing text, as you learn in this section.


    ### EDITING TEXT 39


    ![](img/33d9b1681e3609bc590f82347ae3a699_62_0.png)


    1. Click the mouse pointer within your document. The insertion point will appear
    where you click.

    2. Type some text. The text will appear onscreen, pushing the existing text aside.

    3. Click on Insert in the status bar. The status will change to Typeover.


