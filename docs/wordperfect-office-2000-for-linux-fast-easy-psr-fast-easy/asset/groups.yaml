    ### Changing Text Case


    The way text is capitalized (or not) is referred to as its case. A regular sentence,
    with only the first letter capitalized, is normal case. A passage of text WITH
    ALL LETTERS CAPITALIZED is in uppercase.


    1. **Select the text** you want to affect. The text will be highlighted.


    2. **Click on Edit**. The menu will appear.


    3. Move the mouse pointer to Convert Case. The Convert Case menu will appear.


    4. **Click on UPPERCASE**. The selected text will change to uppercase.


    ![](img/33d9b1681e3609bc590f82347ae3a699_75_0.png)


    ### Inserting Special Characters


    Umlauts, grave marks, and iconic symbols—terms that sound as though they belong
    in a dark, spooky cemetery. Believe it or not, these are descriptions of special
    characters and symbols WordPerfect can place in your document.


    1. Click the mouse pointer where you want the symbol inserted. The insertion point
    will appear where you click in the document.


    ![](img/33d9b1681e3609bc590f82347ae3a699_76_0.png)


    You can bring up the Symbols dialog box by typing Ctrl+W.


    2. Click on Insert. The menu will appear.


    3. Click on Symbol. The Symbols dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_76_1.png)


    4. Click on the list arrow next to the Set list. A list of available fonts sets
    will appear.


    5. Click on Typographic Symbols in the Set list. The typographic symbol set will
    appear.

