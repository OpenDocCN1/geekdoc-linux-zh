    ## CHAPTER 19: LEARNING PRESENTATIONS BASICS


    ### Using Slide Sorter


    With the Slide Sorter, you can quickly arrange slides into the order you want.


    - 1. Click on the Slide Sorter tab. The Slide Sorter window will come to the front.

    - 2. Click on a slide. The slide will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_291_0.png)

    - 3. Drag the slide to a new location in the presentation. The slide placeholder
    will move with the mouse pointer.


    ![](img/33d9b1681e3609bc590f82347ae3a699_291_1.png)

    - 4. Release the mouse button.


    The slide will be placed in its new location.


    > TIP

    Double-clicking on any slide in the Slide Sorter opens that slide in the Slide
    Editor.


    ![](img/33d9b1681e3609bc590f82347ae3a699_292_0.png)


    ### QuickPlay a Slide Show


    After all is said and done, you need to view the slide presentation in its entirety.
    That''s what QuickPlay is for.


    - 1. Click on the QuickPlay tab. The slide will appear full-screen.


    ![](img/33d9b1681e3609bc590f82347ae3a699_292_1.png)

    - 2. Press the Spacebar. The presentation will progress through each slide and
    each slide effect.

    - 3. Press the Esc key. The QuickPlay view will close before the presentation
    is complete.


    ![](img/33d9b1681e3609bc590f82347ae3a699_293_0.png)


    ## Editing a Slide Show


    You can enhance Presentations slide shows in a multitude of ways beyond the good-looking,
    but basic, templates generated by the PerfectExpert. A word of caution before
    beginning the examination of these enhancements: Don’t get carried away. Keep
    the look of your slides simple and uncluttered. Don’t go crazy with five different
    kinds of transitions for a six-slide presentation. A lot of flashy tricks in your
    presentation serve only to distract. Simplicity and consistency are the watchwords
    for a good presentation. In this chapter, you’ll learn how:


    - Add, delete, and rearrange slides as needed

    - Edit text in a slide

    - Place graphics in your presentation

    - Alter presentation and slide designs

    - Create speaker notes

    - Print a presentation


    ## CHAPTER 20: EDITING A SLIDE SHOW


    ### Working with Slides


    In Chapter 19, “Learning Presentations Basics,” you see how the Slide Sorter lets
    you view all the slides in the presentation at once. The Slide Sorter is an important
    tool when working with slides, but it''s not the only one at your disposal.


    ### Adding Slides


    Nothing in the world is static. Ideas change, as do ways of presenting those ideas.
    You can have Presentations add slides to your slide show with just one button.


    - 1. Click on a slide tab. Be sure it is the slide you want the slide to appear
    after. The slide will come to the front.

    - 2. Click on the down arrow (↓) next to the Insert Slide button. A list of slide
    templates to add will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_295_0.png)

    - 3. Click on Insert Bulleted List Slide. A new bulleted list slide will appear
    after the slide you initially selected.


    ### Deleting Slides


    It is much easier to remove something than build it. Such is the way of the world
    and Presentations when you remove a slide.


    ![](img/33d9b1681e3609bc590f82347ae3a699_296_0.png)


    - 1. Click on the Slide Sorter tab. The Slide Sorter window will come to the front.

    - 2. Click on the slide to be deleted. The slide is selected.


    ![](img/33d9b1681e3609bc590f82347ae3a699_296_1.png)

    - 3. Press the right mouse button (right-click) on the slide. The slide''s context
    menu will appear.

    - 4. Click on Delete Slide(s). A Delete Slide dialog box will appear to confirm
    the action.

    - 5. Click on Yes. The Delete Slide dialog box will close and the slide will be
    removed from the presentation.


    ![](img/33d9b1681e3609bc590f82347ae3a699_297_0.png)


    ### Rearrange Slides


    In Chapter 19, you see how the Slide Sorter can arrange the slides in the presentation.
    But that''s not the only way to accomplish this.


    ![](img/33d9b1681e3609bc590f82347ae3a699_297_1.png)


    - 1. Click on the Slide Outliner tab. The Slide Outliner window will come to the
    front.

    - 2. Click on a slide icon. The text of the slide will be selected.

    - 3. Drag the slide icon up or the outline. The slide text will move with the
    mouse pointer.


    | Title | Subtitle | Text |

    | :--- | :--- | :--- |

    | Persuasive Presentation | A subtitle that explains the title | Describe as many
    problems and needs in the current situation. First need, Second need, Third need
    |

    | Objective | What you want to convince your audience to act | Support each statement
    with facts and examples. Fact, Example |


    ![](img/33d9b1681e3609bc590f82347ae3a699_298_0.png)

    - 4. Release the mouse button. The slide will be placed in its new location.


    | Title | Subtitle | Text |

    | :--- | :--- | :--- |

    | Persuasive Presentation | A subtitle that explains the title | Describe as many
    problems and needs in the current situation. First need, Second need, Third need
    |

    | Objective | What you want to convince your audience to act | Support each statement
    with facts and examples. Fact, Example |


    ![](img/33d9b1681e3609bc590f82347ae3a699_298_1.png)


    ### Manipulating Text


    You do not have to be a rocket scientist to work with text in a slide show. All
    you need to do is think about what you want to say.


    ### Adding Text to a New Slide


    When you create a new slide, you have to visualize what you want to say and how
    you want it to look on the slide itself.


    - 1. Click on the Slide Editor tab. The Slide Editor window will come to the front.

    - 2. Double-click an empty text box in a new slide. The text insertion point will
    appear and the text box will be highlighted.

    - 3. Type the new text.

    - 4. Click anywhere outside of the text area. The changes will be made.


    ![](img/33d9b1681e3609bc590f82347ae3a699_299_0.png)

    ![](img/33d9b1681e3609bc590f82347ae3a699_299_1.png)


    ### Editing Text


    You typically edit text on a slide in the Slide Editor, but there are other ways
    to it, especially when you need to see a lot of the text in the presentation at
    once.


    ![](img/33d9b1681e3609bc590f82347ae3a699_300_0.png)


    - 1. Click on the Slide Outliner tab. The Slide Outliner window will come to the
    front.

    - 2. Select some text in the outline. The text will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_300_1.png)

    - 3. Type the new text.


    ### Changing the Font


    Changing the font of a slide''s text is a simple process.


    ![](img/33d9b1681e3609bc590f82347ae3a699_301_0.png)


    - 1. Click on the Slide Editor tab. The Slide Editor window will come to the front.

    - 2. Select some text in a slide. The text will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_301_1.png)

    - 3. Click on the down arrow (↓) next to the Font Selection box. The Font drop-down
    list will appear.

    - 4. Click on Lithograph. The selected text''s font will change to the Lithograph
    font.


    ### Deleting a Text Object


    Text on Presentations slides is contained within text box objects. You can remove
    the text objects to make room for other objects when needed.


    ![](img/33d9b1681e3609bc590f82347ae3a699_302_0.png)


    - 1. **Click on the Slide Editor tab.** The Slide Editor window will come to the
    front.

    - 2. **Click on some text** in a slide. The text box borders will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_302_1.png)

    - 3. **Press the Delete key.** The contents of text box will be removed.

    - 4. **Press the Delete key** again. The text box will be removed.

