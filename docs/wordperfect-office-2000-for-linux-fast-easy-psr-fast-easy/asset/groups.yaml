    # PART III

    Working with Data


    * Chapter 10 Learning Quattro Pro Basics . . . . . . 135

    * Chapter 11 Editing a Spreadsheet . . . . . . . . . 147

    * Chapter 12 Working with Functions and Formulas . . . 159

    * Chapter 13 Formatting Notebooks . . . . . . . . . . 169

    * Chapter 14 Completing Your Spreadsheet . . . . . . 181

    * Chapter 15 Manipulating Data . . . . . . . . . . 189

    * Chapter 16 Charting Data. . . . . . . . . . . . . . . . . 203


    ## 10

    Learning Quattro Pro Basics


    Spreadsheets got their start when accountants used to create large, table-sized
    sheets of paper to handwrite their numbers and calculations. This tedious and
    often frustrating practice has translated well into software form, particularly
    with Quattro Pro. In this chapter, you''ll learn how to:


    - Identify spreadsheet and Quattro Pro elements

    - Enter data into a spreadsheet

    - Edit spreadsheet data

    - Work with multiple spreadsheets


    ### Exploring the Spreadsheet


    Quattro Pro''s interface contains several elements common to most spreadsheet
    programs, so there won''t be much to throw you.


    - **Cell.** Contains the data values of the spreadsheet. The intersection of a
    row and a column form a cell.

    - **Sheet coordinates.** Displays the row-and-column coordinates of a selected
    cell or cell range.

    - **Input line.** Inputs data into the selected cell.

    - **Column heading.** Indicates the column of a selected cell when bold.

    - **Row heading.** Indicates the row of a selected cell when bold.

    - **Sheet tab.** Accesses other sheets within the spreadsheet file.

    - **Status indicator.** Displays the status of your work.

    - **Pane splitter.** Controls division of the sheet window.


    ![](img/33d9b1681e3609bc590f82347ae3a699_159_0.png)


    ### Moving around the Spreadsheet


    Getting around a spreadsheet file is like moving around on a big map: Knowing
    where you are is half the challenge.


    - **Vertical scroll bar.** Click and drag this bar to move up and down the spreadsheet.

    - **Sheet coordinates box.** Type cell coordinates or range names here to directly
    access a cell or range.

    - **Horizontal scroll bar.** Click and drag this bar to move left and right in
    the spreadsheet.

    - **Sheet tab.** Click on a tab to open other sheets within the spreadsheet file.

    - **Navigation buttons.** Use these to move between the sheets of your notebook.


    ![](img/33d9b1681e3609bc590f82347ae3a699_160_0.png)


    ### Entering Data


    You can place various kinds of data in a cell: text, numbers, cell references,
    and formulas. Formulas are examined in Chapter 12, "Working with Functions and
    Formulas." In the meantime, you can explore how you enter the other three data
    types.


    ![](img/33d9b1681e3609bc590f82347ae3a699_161_0.png)


    ### Entering Text


    Text is defined as any data that Quattro Pro cannot manipulate in a formula. Generally,
    text is alphanumeric in nature, although you can use pure numbers as text and
    not numeric data. The year 2000, for example, is often a proper name instead of
    a numeric value.


    1. **Click on a cell.** The cell will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_161_1.png)

    2. **Type some text.** The text will appear in the cell and on the input line.

    3. **Press the Enter key.** The text will be entered into the cell.


    ### Entering Numeric Data


    Quattro Pro can use numeric data when it calculates values in formulas. Again,
    it should be noted that all numbers qualify as numeric data.


    ![](img/33d9b1681e3609bc590f82347ae3a699_162_0.png)


    1. Click on a cell. The cell will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_162_1.png)

    2. Type a numeric value. The value will appear in the cell and on the input line.

    3. Press the Enter key. The value will be entered into the cell.


    ### Entering Cell Addresses


    Part of the beauty of a spreadsheet is the ability of one cell to reference the
    values (text or numeric) of another cell.


    Addresses can reflect a single cell or a range of cells. You can even incorporate
    references into formulas, as shown in Chapter 12.


    ![](img/33d9b1681e3609bc590f82347ae3a699_163_0.png)


    1. Click on a cell. The cell will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_163_1.png)

    2. Type a plus sign (+). The sign will appear in the cell and on the input line.

    3. Type the cell coordinates of a cell containing data. The cell coordinates will
    appear in the input line.

    4. Press the Enter key. The value of the addressed cell will appear in the addressing
    cell.


    ### Editing Data


    Changing the contents of a cell is simple, but you need to know where to start.
    One method allows you to easily change a portion of a cell''s contents, and another
    tends to replace all of a cell''s contents.


    ![](img/33d9b1681e3609bc590f82347ae3a699_164_0.png)


    ### Replacing the Contents of a Cell


    If you need to replace the contents of a cell all once, try this method.


    1. **Click on a cell.** The cell will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_164_1.png)

    2. **Type a new value.** The value will appear in the cell and on the input line.

    3. **Press the Enter key.** The value will be entered into the cell.


    ### Editing the Contents of a Cell


    To change only some of a cell''s contents, start by.


    1. **Click on a cell.** The cell will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_165_0.png)

    2. **Edit the value** on the input line.


    ![](img/33d9b1681e3609bc590f82347ae3a699_165_1.png)

    3. **Insert rows and columns** in the spreadsheet.

    '
