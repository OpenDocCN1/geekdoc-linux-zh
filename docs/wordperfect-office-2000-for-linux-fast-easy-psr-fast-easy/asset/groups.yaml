    ![](img/33d9b1681e3609bc590f82347ae3a699_64_3.png)


    If you make a change you did not want to make after all, has WordPress got the
    tools for you! Undo and Redo help you reverse any errors you might have made.


    - 1. Select some text within your document. The text will appear onscreen.

    - 2. Press the Delete key. The text will be deleted from the document.


    ## CHAPTER 1 LEARNING WORDPERFECT BASICS


    ![](img/33d9b1681e3609bc590f82347ae3a699_65_0.png)


    - 3. Click on the Undo button.

    The selected text will reappear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_65_1.png)


    - 4. Click on the Redo button.

    The text will again be deleted from the document.


    ## Navigating within a Document


    Moving around from word to word in a document can be rather tedious and slow using
    only the arrow keys. There are better and faster ways to navigate a WordPerfect
    document.


    ## Using Shadow Cursor


    The Shadow Cursor allows you to place your mouse pointer anywhere on the screen,
    regardless of whether text is there already. This feature is a great advantage
    that gives you excellent control over the placement of text.


    - 1. Click on View. The menu will appear.

    - 2. Click on Shadow Cursor. The Shadow Cursor mouse pointer will appear.


