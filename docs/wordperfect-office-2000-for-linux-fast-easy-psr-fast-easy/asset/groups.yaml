- md: '

    # Grouping Your Data


    In WordPerfect, you can outline your work. In that component, you typically outline
    prior to creating the main document. In Quattro Pro, you find outlining useful
    after you''ve created the bulk of a document.


    Quattro Pro refers to the outlining function as grouping. Use grouping when you
    want to drop large amounts of data from view while being able to quickly expand
    it when more detail is desired.


    - 1. Select the rows to group. The rows will be highlighted.

    - 2. Click on Tools. The Tools menu will appear.

    - 3. Move the mouse pointer to Outline. The Outline menu will appear.

    - 4. Click on Group. The selected rows will be grouped.


    ![](img/33d9b1681e3609bc590f82347ae3a699_223_0.png)


    > TIP

    If you press Shift+F8, the rows are automatically grouped.


    - 5. Click on the group control.

    That section of the outline will collapse.


    ![](img/33d9b1681e3609bc590f82347ae3a699_224_0.png)


    - 6. Select the grouped rows. The rows will be highlighted.

    - 7. Click on Tools. The Tools menu will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_224_1.png)


    - 8. Move the mouse pointer to Outline. The Outline menu will appear.

    - 9. Click on Ungroup. The selected rows will be ungrouped.


    > TIP

    If you press Ctrl+F8, the rows are automatically ungrouped.


    # 16 Charting Data


    Let''s face it: Charts are simply cool. There is nothing like "Aha!” feeling you
    get when you look at incomprehensible raw data, and then you see it again neatly
    organized in a chart.


    Quattro Pro works well to create these cool charts. The data within Quattro Pro
    is more than ready to be charted and graphed. All it takes is a little planning
    and effort to yield a lot of result. In this chapter, you''ll learn how to:


    - Create pie, bar, line, and 3D charts

    - Resize a chart

    - Edit a chart

    - Change a chart''s style


    # Creating a Chart


    In Quattro Pro, you can create several types of charts: pie, bar, line, and three-dimensional
    (3D) among them. There are dozens of variants to these four categories. They are
    all easy to create thanks to Quattro Pro’s Chart Expert and QuickChart tools.


    # Making a Chart with Chart Expert


    Pie charts provide an excellent vehicle for showing percentage values in a clear
    fashion. When we can see given piece of the pie in relation to the other pieces,
    we get a pictorial representation in our minds that holds more meaning than mere
    numbers.


    - 1. Select the cell range to chart. The cell range will be highlighted.

    - 2. Click on Insert. The Insert menu will appear.

    - 3. Click on Chart. The first Chart Expert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_227_0.png)


    - 4. Confirm the selected range in the Chart data box. The references to the range
    should match what you selected.

    - 5. Click on Next. The second Chart Expert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_228_0.png)


    - 6. Click on the Pie button. The button will be selected and the Preview window
    will display the chart type.

    - 7. Click on Next. The third Chart Expert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_228_1.png)


    - 8. Click on one of the Regular buttons. The button will be selected.


    ![](img/33d9b1681e3609bc590f82347ae3a699_229_0.png)


    - 9. Click on Next. The fourth Chart Expert dialog box will open.

    - 10. Type a new title for the chart in the Title box. The title will appear in
    the Preview window.

    - 11. Click on Next. The fifth Chart Expert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_229_1.png)


    - 12. Click on the color scheme you want. The color scheme will be highlighted
    and displayed in the Preview window.

    - 13. Click on Finish. The Chart Expert dialog box will close and the chart pointer
    will be visible in the spreadsheet.

    - 14. Click and drag the chart pointer over an area of your spreadsheet. The chart
    outline will appear over the selected area.

    - 15. Release the mouse button. The chart will appear in the selected area with
    a new Property Bar for editing.


    ![](img/33d9b1681e3609bc590f82347ae3a699_230_0.png)

    ![](img/33d9b1681e3609bc590f82347ae3a699_230_1.png)


    # Making a Chart with QuickChart


    Making a chart with Chart Expert is an easy but rather lengthy process. If you
    simply want to see your data graphically, QuickChart is the way to go.


    - 1. Select the cell range to chart. The cell range will be highlighted.

    - 2. Click on the QuickChart button. The chart pointer will be visible in the
    spreadsheet.


    ![](img/33d9b1681e3609bc590f82347ae3a699_231_0.png)


    - 3. Click and drag the chart pointer over an area of your spreadsheet. The chart
    outline will appear over the selected area.

    - 4. Release the mouse button. The chart will appear in the selected area with
    a new Property Bar for editing.


    ![](img/33d9b1681e3609bc590f82347ae3a699_231_1.png)


    # Modifying a Chart


    After you have a chart in your document, you might need to make some changes to
    make it flow in your document better.


    # Resizing a Chart


    When Quattro Pro creates a chart within a document, the chart might not be the
    correct size. There is usually a discrepancy between the size of the chart and
    the size of the chart object, which is the box surrounding the chart. Here''s
    how to resize the chart and the chart object.


    - 1. Click on the chart object. The chart object handles will appear.

    - 2. Click and drag any corner handle on the border of the chart object. The border
    will move with the mouse pointer.

    - 3. Release the mouse button. The chart object will be resized to the desired
    size.


    ![](img/33d9b1681e3609bc590f82347ae3a699_232_0.png)


    - 4. Click near the chart. The chart handles will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_233_0.png)


    - 5. Click and drag any edge or corner handle on the border of the chart. The
    border will move with the mouse pointer.


    ![](img/33d9b1681e3609bc590f82347ae3a699_233_1.png)


    - 6. Release the mouse button. The chart will be resized to the desired size.


    # Moving a Chart


    Quattro Pro puts the chart where you want it, but what if you need to move it?
    Moving a chart is sometimes necessary to clean up your layout.


    - 1. Click and hold the mouse pointer on the chart object. The move object pointer
    will appear.

    - 2. Drag the chart object to the desired location. The chart object will move
    to match the action of your mouse pointer.


    ![](img/33d9b1681e3609bc590f82347ae3a699_234_0.png)


    - 3. Release the mouse button. The chart object will be moved into the new location.


    ![](img/33d9b1681e3609bc590f82347ae3a699_234_1.png)


    # Changing a Chart Style


    Sometimes, you might change your mind about the kind of chart to use. You don''t
    need to start all over again, however. You can simply change the chart type on
    the fly.


    ![](img/33d9b1681e3609bc590f82347ae3a699_235_0.png)


    - 1. Click on the chart object to select it. The chart object handles will appear.

    - 2. Click on the Change chart type button on the Property Bar. The Chart Type
    palette will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_235_1.png)


    - 3. Click on a desired chart type. The chart type will be selected and the palette
    will close. The original chart will be changed to the new type.


    # Modifying Chart Data


    Not only can you change the chart type on the fly, but you can also edit the chart''s
    data without a lot of fuss.


    - 1. Click on the chart object to select it. The chart object handles will appear.

    - 2. Click on the Chart Data button. The Chart Series dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_236_0.png)


    - 3. Click on the Chart range button next to the Legend box. The Chart Series
    dialog box will minimize.


    ![](img/33d9b1681e3609bc590f82347ae3a699_236_1.png)


    - 4. Select a new range for the chart legend, to be highlighted. The new range
    will be

    - 5. Click on the Chart range button next to the minimized Chart Series dialog
    box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_237_0.png)


    Chart Series dialog box will maximize.


    - 6. Repeat Steps 4 and 5 for the 1st, 2nd, 3rd, and 4th fields. Select the ranges
    across rows.

    - 7. Click on OK. The Chart Series dialog box will close and the chart will change
    to reflect the new data ranges.

