    # Replacing Terms


    You can replace multiple instances of a word or phrase in your document.


    - 1. Click on Edit. The Edit menu will open.

    - 2. Click on Find and Replace. The Find and Replace dialog box will open.

    - 3. Type a search term in the Find box.

    - 4. Type a replacement term in the Replace with box.

    - 5. Click on Replace. The first occurrence of the search term will be replaced.


    ![](img/33d9b1681e3609bc590f82347ae3a699_97_0.png)


    ![](img/33d9b1681e3609bc590f82347ae3a699_97_1.png)


    During a project, documentation will be created. On an everyday level, more people
    will need it.


    # CORRECTING SPELLING ERRORS


    ![](img/33d9b1681e3609bc590f82347ae3a699_98_0.png)


    - 7. Click on Close. The Find and Replace dialog box will close.


    > TIP

    You might be tempted to just click on the Replace All button. You can, but be
    cautious because you might end up replacing words or parts of words you don''t
    want to change.


    # Correcting Spelling Errors


    The winner of the 2000 Scripps Howard National Spelling Bee won the contest for
    correctly spelling demarche (which is a diplomatic or political maneuver). For
    those of us who have trouble spelling ordinary words, WordPerfect gives us hope.


    # Using Spell-As-You-Go


    WordPerfect can check your spelling as you type, alerting you to misspelled words.


    # CHAPTER 6: IMPROVING YOUR WRITING


    - 1. Click on Tools. The Tools menu will appear.

    - 2. Move the mouse pointer to Proofread. The Proofread menu will appear.


    ![](img/33d9b1681e3609bc590f8234aeae3a699_99_0.png)


    - 3. Click on Spell-As-You-Go. Unrecognized words in the document will be immediately
    underlined.

    - 4. Examine the misspelled or unrecognized words. See if any words have been
    incorrectly marked.


    # Project Documentation


    ![](img/33d9b1681e3609bc590f82347ae3a699_99_1.png)


    - 5. Press the right mouse button (right-click) on an underlined word. A context
    menu will appear, listing a number of alternative spellings for the word.

    - 6a. Click on the correct spelling of the word. The word will be corrected.


    ![](img/33d9b1681e3609bc590f82347ae3a699_99_2.png)


    OR


    # Project Documentation


    ![](img/33d9b1681e3609bc590f82347ae3a699_99_3.png)


    # CORRECTING SPELLING ERRORS


    ![](img/33d9b1681e3609bc590f82347ae3a699_100_0.png)


    - 6b. Click on Add if the word is correctly spelled and WordPerfect does not recognize
    it. The word will be added to WordPerfect''s dictionary and all other occurrences
    of the word will no longer be underlined.


    # Running a Spell Check


    If you do not have time to individually check all of the underlined words, you
    can run a comprehensive search for misspelled words using the Spell Checker tool.


    ![](img/33d9b1681e3609bc590f82347ae3a699_100_1.png)


    - 1. Click on the Spell Checker button. The Spell Checker pane will open.


    # Process Flow


    During a project, there will be many instances where documentation will be created.
    On the everyday level, documents are created by a single person and perhaps distributed
    to one or more people; while they should be tracked, do not need a strong level
    of change controls practiced upon them.


    Other documents, with a more permanent nature, do need a structured process flow,
    especially during their creation. Such as QLS employees and managers to track
    and manage are important but non-project-oriented documents such as procedure
    manuals, status reports, and the like with their own CCM process. Figure 2.1 illustrates
    the process flow for project documentation. Table 2.1 analyzes each state in the
    flow, detailing each process for each state.


    # CHAPTER 6 IMPROVING YOUR WRITING


    ![](img/33d9b1681e3609bc590f82347ae3a699_101_0.png)


    - 2. Click on Skip Once, Skip All, Replace, Auto Replace, or Add, depending on
    action you want to take for each unrecognized word. The action you select will
    be applied.

    - 3. Click on Close. The Spell Checker pane will close.


    # Working with Grammar-As-You-Go


    WordPerfect can check your grammar as you type, alerting you to any questionable
    grammar usage.


    ![](img/33d9b1681e3609bc590f82347ae3a699_101_1.png)


    - 1. Click on Tools. The Tools menu will appear.

    - 2. Move the mouse pointer to Proofread. The Proofread menu will appear.

    - 3. Click on Grammar-As-You-Go. Phrases and words in the document with poor grammar
    will be underlined.


    # WORKING WITH QUICKRECT


