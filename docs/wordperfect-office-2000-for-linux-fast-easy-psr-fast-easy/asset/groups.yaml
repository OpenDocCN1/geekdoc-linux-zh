    # Inserting Another Document


    Not only can you make great stuff in WordPerfect, you can also import material
    from other documents created in the Word 2000 office suite!


    - 1. Click the mouse pointer where you want to insert the graphic. The insertion
    point will appear where you click.

    - 2. Click on Insert. The Insert menu will open.

    - 3. Move the mouse pointer to Spreadsheet/Database. The Spreadsheet/Database
    menu will open


    ![](img/33d9b1681e3609bc590f82347ae3a699_132_1.png)

