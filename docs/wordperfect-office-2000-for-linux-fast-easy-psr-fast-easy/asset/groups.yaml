    # Using Click and Drag


    In WordPerfect you can move text using only the mouse.


    +   1. **Select the text** you want to move. The text will be highlighted.


    +   2. **Click on the selected text.** The mouse pointer will change to the drag
    pointer.


    +   3. **Drag the selected text** to another location in the document. The drag
    pointer will be moved to the new location.


    Everyday documents are created by a single person and maybe distributed to a few
