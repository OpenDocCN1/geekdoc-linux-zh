    a strong level of change controls practiced upon them.


    Other documents, such as reference documents need a more structured process flow,
    especially during their creation. Such a process will enable managers to track
    and manage important non-project-oriented documents such as procedure manuals,
    status reports, and the like with their CCM process. Table 2.1 analyzes each state
    in the flow detailing each process for each state.


