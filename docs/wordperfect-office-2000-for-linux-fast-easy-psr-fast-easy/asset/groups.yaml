    # 15

    ## Manipulating Data


    After you enter your data into a spreadsheet, you can do several more things with
    it than simply add and subtract numbers. Quattro Pro enables you to set up data-entry
    restrictions so no “wrong” data gets into your calculations and enables you to
    filter data so you can see only the figures you need to make a decision. Quattro
    Pro even accelerates data entry itself. In this chapter, you''ll learn how to:


    - Use QuickType to enter data more efficiently

    - Filter your data to see only what you need

    - Make data input rules

    - Group and sort your data


    # CHAPTER 15: MANIPULATING DATA


    ## Entering Data Faster


    Data manipulation begins with a question you ask before you even start a Quattro
    Pro document: What data do you want to enter? After you answer this question,
    you start putting data into your spreadsheet. If you are fortunate enough to have
    software that directly imports data into Quattro Pro, then your work is minimal.
    The rest of us take the old finger-dance approach. Luckily, Quattro Pro has some
    neat features that accelerate the data-entry process.


    ## Using QuickType


    If you are like most people, endless typing of data can be a tedious process.
    QuickType remembers data you have entered previously so you can input data that
    much faster..


    ![](img/33d9b1681e3609bc590f82347ae3a699_213_0.png)


    1. **Click on a cell** in the first empty row. The cell will be highlighted.

    2. **Type Ford.** Values from the Make column will appear in the row. In fact,
    you need only type F before the enter Ford value will fill in the cell.


    # ENTERING DATA FASTER


    ![](img/33d9b1681e3609bc590f82347ae3a699_214_0.png)


    3. Press the tab key to skip to the next cell. The pointer will move to the next
    cell, where you can fill in additional values.


    > NOTE

    > The QuickType method works only for text values. You must completely enter any
    other value type.


    ## Using QuickFill


    QuickFill will let you enter sequential data in the blink of an eye.


    1. Click on a cell to enter data. The cell will be highlighted.

    2. Type January. January will be the value of the cell.

    3. Move the insertion point to the lower-right corner of the cell. The insertion
    point will change to a cell selection mouse pointer.


    ![](img/33d9b1681e3609bc590f82347ae3a699_214_1.png)


    4. Click and drag the selection mouse pointer down the column. The empty cells
    will be selected.


    ![](img/33d9b1681e3609bc590f82347ae3a699_215_0.png)


    5. Release the mouse button. The months of the year will be filled into the selected
    cells.


    ![](img/33d9b1681e3609bc590f82347ae3a699_215_1.png)


    ## Filtering Data


    Filtering enables you to visually strip out unnecessary data. This is a visual
    action only; the data does not go anywhere. Rather, Quattro Pro hides it away
    until you want to view the data in its entirety again.


    ## Using the QuickFilter to Filter Data


    The QuickFilter can use as many different criteria as there are in the sheet.
    Any data can become a filter.


    1. Select the cell range to filter. The cell range will be highlighted.

    2. Click on Tools. The Tools menu will appear.

    3. Click on QuickFilter. The QuickFilter down arrows will appear in the first
    row of the range.


    ![](img/33d9b1681e3609bc590f82347ae3a699_216_0.png)


    4. Click on the down arrow (↓) next to the Agent cell. A filter selection drop-down
    list will appear, listing all available agents as well as five other filter types:


    ![](img/33d9b1681e3609bc590f82347ae3a699_217_0.png)


    | Agent | Min | Model | Type | Year | PriceTotal |

    |---|---|---|---|---|---|

    | West | Ford | Probe | Car | 1990 | $7,999 |

    | West | Mercury | Taurus | Car | 1997 | $16,495 |

    | West | Ford | Taurus | Car | 1998 | $25,450 |

    | West | Volkswagen | Gold | Car | 1997 | $14,450 |

    | West | Ford | Taurus | Car | 1998 | $25,450 |

    | West | Ford | Taurus | Car | 1996 | $14,675 |

    | West | Chevrolet | Town & Country | Van | 1996 | $13,500 |

    | East | Ford | Firebird | Car | 1998 | $20,995 |

    | East | Chevrolet | Tance | Truck | 1997 | $17,500 |


    - Show All. Cancels any previously applied filter by allowing all values to be
    displayed.

    - Top 10. In a larger spreadsheet, displays only rows with the top 10 values in
    this column.

    - Custom. Enables the creation of filter.

    - Blanks. Will display only rows where data in the column is blank.

    - Non Blanks. Will display only rows where data in the column is not blank.


    5. Click on Bill. Only the rows with Bill will be displayed.


    ![](img/33d9b1681e3609bc590f82347ae3a699_218_0.png)


    6. Click on Tools. The Tools menu will appear.

    7. Click on QuickFilter. The QuickFilter controls will close.


    ## Using the Custom Filter


    You use the custom filter for more defined work. The custom filter enables you
    to select three criteria which to filter.


    1. Select the cell range to filter. The cell range will be highlighted.

    2. Click on Tools. The Tools menu will appear.

    3. Click on QuickFilter. The QuickFilter down arrows will appear in the first
    row of the range.


    ![](img/33d9b1681e3609bc590f82347ae3a699_218_1.png)


    4. Click on the down arrow (↓) next to the Agent cell. A filter selection drop-down
    list will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_219_0.png)


    5. Click on Custom. The Custom QuickFilter dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_219_1.png)


    6. Click on the down arrow (↓) next to the Condition box. The Condition drop-down
    list will appear.

    7. Click on equal to. It will be selected and will appear in the Condition box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_220_0.png)


    8. Click on the down arrow (↓) next to the Value box. The Value drop-down list
    will appear.

    9. Click on Bob. It will be selected and will appear in the Value box.

    10. Click on the down arrow (↓) next to the Operator box. The Operator drop-down
    list will appear.

    11. Click on Or. It will be selected and will appear in the Operator box.

    12. Enter more data in the remainder of the fields as needed.

    13. Click on OK. The Custom QuickFilter dialog box will close and the results
    of the filter will appear in the spreadsheet.


    ![](img/33d9b1681e3609bc590f82347ae3a699_220_1.png)


    ## Sort Data with Multiple Criteria


    Sorting data is a nice way to keep things orderly in a disorderly world. Data
    rarely comes to us in an alphabetical manner or any other orderly form. It''s
    up to us to make sense of it.


    1. Select the cell range to sort. The cell range will be highlighted.

    2. Click on Tools. The Tools menu will appear.

    3. Click on Sort. The Data Sort dialog will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_221_0.png)


    > TIP

    > If you press Alt+F9, the Data Sort dialog box will open.


    4. Click on the down arrow (↓) next to the 1st box. The Sort by drop-down list
    will appear.

    5. Click on Agent. It will be selected and will appear in the 1st box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_222_0.png)


    6. Click on the down arrow (↓) next to the 2nd box. The Sort by drop-down list
    will appear.

    7. Click on Type. It will be selected and will appear in the 2nd box.

    8. Click on the down arrow (↓) next to the 3rd box. The Sort by drop-down list
    will appear.

    9. Click on Year. It will be selected and will appear in the 3rd box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_222_1.png)


    10. Click on Sort. The Data Sort dialog will close and the data will be sorted
    according to your criteria.

