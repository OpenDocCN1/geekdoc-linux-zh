    # CHAPTER 13: FORMATTING NOTEBOOKS


    # Aligning across Multiple Cells


    To create a heading within a Quattro Pro document, you need to align the text
    across multiple cells.


    +   1. Click on a cell with the heading. The cell will be highlighted.


    +   2. Select the range of cells you want the heading to appear. The range is
    highlighted.


    +   3. Click on the Alignment button. The Alignment menu will appear.


    +   4. Click on Center Across Block. The cell''s contents will be aligned in the
    center of the selected cell range.


    ![](img/33d9b1681e3609bc590f82347ae3a699_199_0.png)


    # Formatting with Fonts


    When changing the fonts of cell values in Quattro Pro, it is important to remember
    that selecting the cell applies to all of the cell''s values. Selecting a portion
    of the value in the cell''s input line applies font changes to only those selected
    values.'
- md: '

    ## Changing a Font


    Changing the font of a cell is a piece of cake.


    - 1. **Click on a cell.** The cell will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_200_0.png)


    - 2. **Click on the down arrow (↓)** next to the Font box. The Font drop-down
    list will appear.


    - 3. **Click on Amerigo BT.** The drop-down list will close and the new font will
    be applied to the cell.


    ## Changing a Size


    When you need to make data look bigger or smaller, you can change the size of
    its displayed font.


    ![](img/33d9b1681e3609bc590f82347ae3a699_200_1.png)


    - 1. **Click on a cell.** The cell will be highlighted.


    - 2. **Click on the down arrow (↓)** next to the Font Size box. The Font Size
    drop-down list will appear.


    - 3. **Click on 24.** The drop-down list will close and the new font size will
    be applied to the cell.


    ## CHAPTER 13: FORMATTING NOTEBOOKS


    ### Applying a Font Attribute


    - 1. Double-click on a cell.

    The cell will be placed into edit mode.


    - 2. Select a portion of the value.

    The text will be highlighted.


    - 3. Click on the Bold button.

    The selected text will take the bold attribute.


    ![](img/33d9b1681e3609bc590f82347ae3a699_201_0.png)


    ### Adding Borders


    By default, the cell borders in a Quattro Pro spreadsheet are invisible when printed
    and difficult to see onscreen. You can make the borders visible for a sharper
    presentation.


    - 1. Select a cell range.

    The cell range will be highlighted.


    - 2. Click on Format. The Format menu will appear.


    - 3. Click on Selection.

    The Active Cells dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_201_1.png)


    - 4. Click on the Border tab. The Border tab will come to the front.


    ![](img/33d9b1681e3609bc590f82347ae3a699_202_0.png)


    - 5. Click on Outline. Solid lines will appear in the preview.


    - 6. Click on the down arrow (↓) next to the Border Type button. The Border Type
    palette will be displayed.


    ![](img/33d9b1681e3609bc590f82347ae3a699_202_1.png)


    - 7. Click on a border type. The palette will close and the change will be applied
    to the preview.


    - 8. Click on the down arrow (↓) next to the Border Color button. The Color palette
    will appear.


    - 9. Click on a color in the Color palette. The palette will close.


    - 10. Click on OK. The Active Cells dialog box will close and the changes will
    be applied to the selected range of cells.


    ![](img/33d9b1681e3609bc590f82347ae3a699_203_0.png)


    ## Customizing Your Workspace


    In a tip of the hat to all the users out there who are used to using other spreadsheet
    applications, Quattro Pro lets you change your workspace to match that of other
    applications.


    - 1. Right click on the Main menu. The menu selection menu will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_203_1.png)


    - 2. Click on the <Excel Menu> option. The menu will change to reflect that of
    the other spreadsheet application.


    | | DESCRIPTION INCOME ACCOUNTS | JANUARY | FEBRUARY | MARCH |

    |---|---|---|---|---|

    | MEMBERSHIP DUES | | | | |

    | ANNUAL RENEWAL FEES 820 MEMBERS | | $9,000 | | |

    | NEW MEMBERS 120 MEMBERS | $1,000 | $1,000 | $1,000 |

    | NATIONAL MEMBERSHIP | | | | |

    | TOTAL MEMBERSHIP DUES | | $10,000 | | |

    | ALTERNATIVE INCOME | | | | |

    | MAILING LABELS - FOUR | | | $500 | $500 |

    | CONFERENCE - 4 PKGS | | | | $1,950 |

    | CORPORATE 5 PKGS | | | | |

    | TOTAL ALTERNATIVE INCOME | | $500 | $2,450 | |


    ## Completing Your Spreadsheet


    Although we are moving closer to pure electronic media, it is still readily apparent
    that people have a great love for paper. It is important to know how to prepare
    and print your Quattro Pro notebooks into hardcopy. In this chapter, you''ll learn
    how to:


    - Establish paper size and margins

    - Preview a print job

    - Print a spreadsheet


    ## CHAPTER 14 COMPLETING SPREADSHEET


    ### Preparing to Print


    In WordPerfect, it is not too difficult to see how pages are set up. In Quattro
    Pro spreadsheet, however, such as margins and page breaks are not always apparent.


    ### Setting Up Margins


    The margins of a spreadsheet page are typically hard to see. In fact, they only
    appear after you examine the document in Print Preview (discussed later in this
    chapter) or you initially change the page. This is a strange feature, to be sure,
    which emphasizes the need to always prepare your document before printing.


    - 1. Click on File. The File menu will appear.


    - 2. Click on Page Setup. The Page Setup dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_205_0.png)


    - 3. Click on the Print Margins tab. The Margins tab will come to the front.


    ![](img/33d9b1681e3609bc590f82347ae3a699_206_0.png)


    - 4. Type new margin values in the boxes below Margins. Values will be displayed
    in the boxes next to Top, Bottom, and Right.


    - 5. Click on OK. The Page Setup dialog box will close and the spreadsheet will
    reflect the changes.


    ### Setting Page Orientation and Size


    Spreadsheets usually do not appear in portrait, but rather landscape. In this
    section, discover how to change the page orientation and paper size for your spreadsheet.


    - 1. Click on File. The File menu will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_206_1.png)


    - 2. Click on Page Setup. The Page Setup dialog box will open.


    - 3. Click on the Paper Type tab. The Paper Type tab will come to the front.


    - 4. Click on US Legal. US Legal will be highlighted.


    - 5. Click on the Landscape option. The option will be selected.


    - 6. Click on OK. The Page Setup dialog box will close and the spreadsheet will
    reflect the changes.


    ![](img/33d9b1681e3609bc590f82347ae3a699_207_0.png)


    > TIP

    Be sure you have loaded the right paper size in your printer before you change
    the paper size of the spreadsheet.


    ### Getting It All on One Page


    Many times the spreadsheet overflows off the page onto another. When you print
    them out, you could get something akin to a jigsaw puzzle. You can fool around
    with the margins and paper size until it all fits onto one page, or you can use
    print scaling to make your life a lot easier.


    - 1. Click on File. The File menu will appear.


    - 2. Click on Page Setup. The Page Setup dialog box will open.


    - 3. Click on the Print Scaling tab. The Print Scaling tab will come to the front.


    ![](img/33d9b1681e3609bc590f82347ae3a699_208_1.png)


    - 4. Click on the Print to desired width option. The option will be activated
    along with the box next to desired height.


    - 5. Click on the up and down arrows (↑) next to the text boxes for height and
    width. The boxes will reflect the values.


    - 6. Click on OK. The Page Setup dialog box will close and your spreadsheet will
    reflect the changes when you print.


    ## Printing a Spreadsheet


    Once you set up the page for the spreadsheet, you can print it. But first, you
    should preview the page to make sure all your data fits on one page.


    ### Using Print Preview


    Print Preview works with your printer to show how your page will look on actual
    paper.


    - 1. Click on File. The File menu will appear.


    - 2. Click on Print Preview. The Print Preview window will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_209_0.png)


    - 3. Click on the Zoom In button to see more detail. The view of the spreadsheet
    will enlarge.


    - 4. Click on the Previous Page or Next Page buttons to navigate through the entire
    document. The preview of each page to be printed will appear with each click.


    ![](img/33d9b1681e3609bc590f82347ae3a699_210_0.png)


    - 5. Click on the Close button (X) to leave Print Preview. The Normal view will
    appear.


    ### Printing Your Work


    When creating a Quattro Pro spreadsheet, you should print your work toward the
    end of the creation process, after previewing the pages. You can print the current
    sheet, the entire notebook, or a selected range of cells.


    - 1. Click on File. The File menu will appear.


    - 2. Click on Print. The Spreadsheet Print dialog box will open.


    > TIP

    You can also open the Spreadsheet Print dialog box by pressing Ctrl+P.

