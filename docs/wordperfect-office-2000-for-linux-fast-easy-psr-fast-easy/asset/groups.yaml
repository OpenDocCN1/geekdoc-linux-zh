    ## 5 Formatting a WordPerfect Document


    WordPerfect can do more for your documents than behave as a glorified typewriter.
    You can apply wonderful effects to your text, resize text, and move text around
    your document, for starters. In this chapter, you''ll learn how to:


    - Make changes to text, such as changing its font, size, and attributes

    - Insert special characters

    - Move or copy text within a document

    - Change text spacing in a document

    - Set, move, and delete tabs


    ## CHAPTER 5: FORMATTING A WORDPERFECT DOCUMENT


    ### Enhancing Text


    You have seen all the fancy documents that word processors can create. Now, it''s
    your turn to start applying attractive effects to your text.


    ### Changing the Font


    The font of a text character is the appearance of the text. Some fonts lend themselves
    to more legibility, and others call attention to themselves. With WordPerfect''s
    RealTime Preview, you can see the effect of a font change before you make it.


    1. Select the text you want to affect. The text will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_71_0.png)


    2. Click on the down arrow (↓) next to the Font Face box. A list of available
    fonts will appear and the selected text''s font will change in the RealTime Preview
    window as you pass over each font name.


    3. Click on the Avant Garde Bk font. The selected text''s font will change in
    the text.


    ### Changing the Font Size


    Not only do fonts come in all shapes, but they also come in a variety of sizes.
    Font sizes are measured in points. There are 72 points to an inch.


    1. **Select the text** you want to affect. The text will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_72_0.png)


    2. **Click on the down arrow (↓)** next to the Font Size box. A list of available
    point sizes will appear.


    3. **Click on the 40** point size. The selected text''s size will change.


