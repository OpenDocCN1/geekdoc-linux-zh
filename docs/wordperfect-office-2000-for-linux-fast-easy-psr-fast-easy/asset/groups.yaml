    ## Using Shortcut Keys


    In the WordPerfect Office 2000 suite, you can use many shortcut keys to start
    certain commands. I’ve mentioned quite a few of these combinations throughout
    this book, but they are also gathered here for your reference. In this appendix,
    you’ll learn how to:


    - Activate common WordPerfect Office 2000 tools with shortcut keys

    - Activate specialized tools with shortcut keys


    ## Using Common WordPerfect Office 2000 Shortcut Keys


    Throughout WordPerfect Office 2000, some key combinations do the same thing in
    more than one application.


    | Applications | Shortcut Keys | Task |

    | --- | --- | --- |

    | WP, QP, PR, CC, PX | F1 | Help |

