    ## Creating an Index


    Like a table of contents, creating an index in Word is an automated process. Indexes
    are especially useful in larger documents, where finding a subject may not be
    straightforward. But you have to do some work in advance.


    - 1. Click on Tools. The Tools menu will open.

    - 2. Move the mouse pointer to Reference. The Reference menu will appear.

    - 3. Click on Index. The Index toolbar will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_150_1.png)


