    Don''t be intimidated by your artistic abilities or lack thereof. Remember, if
    you make a mistake, you can always undo.


    1. Click on the File. The File menu will appear.

    2. Click on New. The New dialog box will appear.

    3. Click on the Rectangle. The Rectangle will be selected.

    4. Click on the Shape. The Shape dialog box will open.

    5. Click on Rounded. The shape will be selected.


