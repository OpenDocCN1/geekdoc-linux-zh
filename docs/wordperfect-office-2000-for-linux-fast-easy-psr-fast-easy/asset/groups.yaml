    # 19

    Learning Presentations Basics


    Because many people fear public speaking second only to death, most would rather
    not become fiery orators to get their points across. That leaves the second option:
    Use another way to communicate, such as visual stimuli. We simply remember things
    better if we see them with our eyes. As a result, the corporate slide show was
    born.


    It started with placards at first, showing charts created by people whose job
    was to do nothing but. Overheads appeared next, lending presenters the ability
    to support their points on-the-fly. Then came slides, which added added color
    and speed to presentations. Finally, slides were created directly on a computer
    and projected from there, as well.


    Presentations is the component in WordPerfect Office 2000 that gets this job done
    for you. In this chapter, you''ll learn how to:


    - Start Presentations

    - Create a Presentations slide show

    - Use the different views to modify your slide show


    # CHAPTER 19: LEARNING PRESENTATIONS BASICS


    ## Starting Presentations


    Unlike the other components of WordPerfect Office 2000, Presentations does not
    start right after you call it up. Instead, PerfectExpert steps in to help guide
    the beginning of your work in Presentations.


    - 1. Click on the Application Starter. The main menu will appear.

    - 2. Move the mouse pointer to Applications. The Applications menu will appear.

    - 3. Move the mouse pointer to WordPerfect Office 2000. The WordPerfect Office
    2000 menu will appear.

    - 4. Click on Corel Presentations 9. The PerfectExpert dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_285_0.png)


    - 5. Click on the Application Starter (X). The Navigator will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_285_1.png)


    # STARTING PRESENTATIONS


    6a. Click on the Close button (X). The Navigator will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_286_0.png)


    5b. Click on the desired slide. The Navigator will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_286_1.png)


    6b. Click on Create. The Navigator will appear.


    # Creating a Slide Show


    Creating a slide show is routine when you use PerfectExpert. It''s important to
    outline your presentation at least you have some idea before you begin.


    - 1. Click on File. The File menu will appear.

    - 2. Click on New. The New dialog box will open.

    - 3. Click on New Slide Show. It will be selected.

    - 4. Click on Create. The Presentations window will appear with the Navigator
    in one pane and the slide show in the other.


    # Switching Views


    Before you start learning how to modify the slide show, or create a slide show
    from scratch, it''s important to understand the Presentations interface. More
    than any of the other WordPerfect 2000 applications, Presentations has the ability
    to view a document in many ways.


    ## Viewing with the Slide Editor


    The most prevalent view within Presentations is the Slide Editor, where slides
    get the most hands-on. This is where you can edit text and graphics.


    ![](img/33d9b1681e3609bc590f82347ae3a699_288_0.png)


    - 1. Click on the Slide Editor tab. The Editor will come to the front.

    - 2. Click on a slide to navigate to a new slide. The slide will come to the front.


    3. Double-click on some text to edit it. The text box will be highlighted.

    4. Select the text within the text box. The text will be highlighted.

    5. Type new text.


    ![](img/33d9b1681e3609bc590f82347ae3a699_289_0.png)


    6. Click on the down arrow (↓) next to the Navigator box. A drop-down list of
    all slides in the slide show will appear.

    7. Click on a different slide. The Slide Editor will open to that slide.


    ![](img/33d9b1681e3609bc590f82347ae3a699_289_1.png)


    # Using Slide Outliner


    After you create the slide show, you often need to edit the outline. After all,
    Presentations slide shows are essentially one big outline chopped into different
    slides.


    ![](img/33d9b1681e3609bc590f82347ae3a699_290_0.png)


    - 1. Click on the Slide Outliner tab. The Outliner window will come to the front.

    - 2. Select some text to edit. The text will be highlighted.

    - 3. Type new text.

    - 4. Click on the Demote or Promote buttons to change the outline level of a selected
    line of text. The text will be indented or outdented as selected.


    > TIP

    Double-clicking on any slide icon in the Slide Outliner opens that slide in the
    Slide Editor.

