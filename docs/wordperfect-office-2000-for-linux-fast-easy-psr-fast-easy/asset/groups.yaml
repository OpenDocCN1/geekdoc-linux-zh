    the console application, command-line windows are pretty much the same.


    # CHAPTER 1: WELCOME TO WORDPERFECT 2000


    ![](img/33d9b1681e3609bc590f82347ae3a699_29_0.png)


    2. Type the wordperfect command in the window.

    WordPerfect will start.


    You can use this method with any of the WordPerfect Office 2000 applications.
    Table 1-1 lists the commands you need for each application.


    # Table 1-1 Console Commands to Start WordPerfect Applications


    | Application | Command |

    |---|---|

    | WordPerfect | wordperfect |

    | Quattro Pro | quattropro |

    | Paradox | paradox |

    | Presentations | presentations |

    | CoreCENTRAL Address Book | ccaddressbook |

    | CoreCENTRAL Calendar | ccalendar |

    | CoreCENTRAL Memos | cmmemo |


    # Exploring WordPerfect Office 2000


    Even though there is more than one application in the WordPerfect Office 2000
    suite, each application shares a number of common interface features, such as
    the ones illustrated in this Quattro Pro screen.


    ![](img/33d9b1681e3609bc590f82347ae3a699_30_0.png)


    # Exiting WordPerfect Office 2000


    Exiting any of the Office 2000 applications is simplicity itself, as you will
    see in the following steps.


    - 1. The application control icon

    - 2. Window control buttons

    - 3. Document window control buttons

    - 4. A menu bar

    - 5. A title bar

    - 6. A toolbar

    - 7. A document window

    - 8. A vertical scroll bar

    - 9. A horizontal scroll bar

    - 10. A status bar


    ![](img/33d9b1681e3609bc590f82347ae3a699_30_1.png)


    - **Click on File** in any WordPerfect Office 2000 application. The File menu
    will appear.


    - **Click on Exit**. The application will close.


    > TIP

    > Other methods of exiting an application include clicking on the Close button
    [X] (which looks like an X) in the upper-right corner of the screen. You can also
    press Alt+F4 on your keyboard simultaneously.


    > NOTE

    > If you have not saved any of your work when you exit an application, the Office
    2000 application asks whether you want to save it. You can review saving files
    in Chapter 2, "Working with Files."


    # 2 Working with Files


    Whatever you do in WordPerfect Office 2000, you work with a document. Although
    people tend to think documents are only created by word processor applications,
    the truth is that a document is any kind of file—not just a WordPerfect file.
    How you manage these documents gives you a critical edge in using WordPerfect
    Office 2000. In this chapter, you’ll learn how to:


    - Create a new empty Office 2000 document or use PerfectExpert to make a document
    from a template

    - Save your document

    - Open a document, including those outside of Office 2000’s formats

    - Print a document

    - Close a document


    # Starting a New Document


    When you create documents in WordPerfect Office 2000, you have the choice of creating
    a new, empty document or a document patterned after one of the dozens of available
    templates.


    # Making an Empty Document


    Within any WordPerfect Office 2000 application, you can start a new, empty document
    at any time.


    - 1. Click on File in any WordPerfect 2000 application. The File menu will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_33_0.png)


    - 2. Click on New. A new document will appear.


    > TIP

    > You can press Ctrl+N to start a new empty document.


    # Using PerfectExpert


    WordPerfect Office 2000 provides a lot of built-in creativity for all users with
    the help of PerfectExpert tool. PerfectExpert enables users to create new documents
    using several templates as a guide.


    # Opening an Installed Template


    During the installation of WordPerfect Office 2000, dozens of sample templates
    were installed for your use. Here''s how to access them.


    # STARTING A NEW DOCUMENT


    1. Click on File in any WordPerfect 2000 application. The File menu will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_34_0.png)


    2. Click on New. The PerfectExpert dialog box will appear.


    > TIP

    > You can press Ctrl+Shift+N to start a new document with PerfectExpert.


    3. Click on the project you want to use. The project is highlighted.


    4. Click on Create. The PerfectExpert dialog box will close and a dialog box will
    appear the first time you use a project.


    ![](img/33d9b1681e3609bc590f82347ae3a699_34_1.png)


    # CHAPTER 2: WORKING WITH FILES


    5. Click on Yes because we know this is a valid source. The dialog box will close
    and the new document template will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_35_0.png)


    # Opening an Online Template


    Besides the templates installed with WordPerfect Office 2000, there are many others
    for you to use on the Internet. With PerfectExpert, getting these templates is
    easy.


    ![](img/33d9b1681e3609bc590f82347ae3a699_35_1.png)


    > TIP

    > Before beginning this series of steps, it is helpful if you connect your system
    to the Internet.


    # STARTING A NEW DOCUMENT


    ![](img/33d9b1681e3609bc590f82347ae3a699_36_0.png)


    1. In PerfectExpert, click on Projects Online. The WordPerfect Online line will
    be highlighted.


    2. Click on Create. The default web browser on your system will open it to the
    WordPerfect Projects page at Office.com.


    ![](img/33d9b1681e3609bc590f82347ae3a699_36_1.png)


    3. Click the SmartTools - Templates link. The SmartTools page will appear.


    # CHAPTER 2 WORKING WITH FILES


    4. Click the appropriate application link. The template page will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_37_0.png)


    5. Click this link for the project you want. The Save dialog will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_37_1.png)


    6. Click on OK. The file will be saved and the Save dialog box will close.


    7. Click the Close button.


    ![](img/33d9b1681e3609bc590f82347ae3a699_37_2.png)


    # STARTING A NEW DOCUMENT


    8. Click on Options. The Options menu will appear.


    9. Click on Add Project. The Add Project Wizard will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_38_0.png)


    10. Click the I want to add another document option. The option will be selected.


    11. Click on Next. The next screen of the wizard will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_38_1.png)


    # CHAPTER 2: WORKING WITH FILES


    ![](img/33d9b1681e3609bc590f82347ae3a699_39_0.png)


    12. Type a name for the project. The name will be displayed.


    13. Type a brief description for the project. The description will be displayed.


    14. Click on Next. The next screen of the wizard will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_39_1.png)


    15. Type the full path and file name for your project document. The name will
    be displayed.


    16. Click on Finish. A dialog box will appear.


    # STARTING A NEW DOCUMENT


    17. Click on OK. The dialog box will close.


    ![](img/33d9b1681e3609bc590f82347ae3a699_40_0.png)


    18. Click on the new project. The project will be selected.


    19. Click on Create. The PerfectExpert dialog box will close and the new document
    template will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_40_1.png)


    # Opening Documents


    As you get started with the WordPerfect 2000 applications, sooner or later (probably
    sooner) you will need to open a document that you or someone else has already
    worked on. In this section we examine the methods used to open one or many documents.


    ![](img/33d9b1681e3609bc590f82347ae3a699_41_0.png)


    # Opening an Existing Document


    If you need to work on a document that has been worked on before, it''s a simple
    matter to bring it back up for additional editing.


    - 1. Click on the Open button. The Open File dialog box will appear.


    > TIP

    > You can press Ctrl+O to start the Open File dialog box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_41_1.png)

