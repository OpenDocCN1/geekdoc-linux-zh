    # 4 Learning WordPerfect Basics


    The word processor component of WordPerfect Office 2000 is called, appropriately
    enough, WordPerfect. WordPerfect''s main job is to get your words down on paper,
    be it real or electronic. In this chapter, you''ll learn how to:


    +   - Create text in your document

    - Edit a document by inserting, selecting, and deleting text

    - Correct mistakes using the Undo and Redo functions

    - Navigate within your document'
