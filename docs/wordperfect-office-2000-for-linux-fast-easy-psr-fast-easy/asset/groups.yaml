    # # 1

    ## Welcome to WordPerfect 2000


    WordPerfect has long been a favorite word processor among Linux users. Now that
    Corel has made the entire WordPerfect Office 2000 suite available on the Linux
    platform, users can enjoy the full functionality of all the applications in the
    family. This family consists of no less than five applications: a word processor,
    a spreadsheet application, a slide show creator, a database tool, and a personal
    information manager. Despite the wide range of functionality, there are similarities
    throughout the WordPerfect Office 2000 interface. In this chapter, you''ll learn
    how to:


    - Start and exit WordPerfect component applications

    - Recognize the common screen elements of WordPerfect 2000


    # Starting WordPerfect 2000


    When you want to start any application in the WordPerfect Office 2000 suite, there
    are generally two methods to accomplish this: using the menus within your graphic
    interface, or typing the appropriate command directly into the Linux command line.


    # Starting WordPerfect within X Window


    In this example, we use the KDE desktop environment in Corel Linux 1.1. Your screen
    might look slightly different on your Linux machine, particularly if you are using
    a different desktop environment. But the basic principles still apply across most
    forms of Linux and their desktops.


    ![](img/33d9b1681e3609bc590f82347ae3a699_27_0.png)


    - 1. Click on the Application Starter. The main menu will appear.

    - 2. Move the mouse pointer to Applications. The Applications menu will appear.

    - 3. Move the mouse pointer to WordPerfect Office 2000. The WordPerfect Office
    2000 menu will appear.

    - 4. Click on WordPerfect 9. WordPerfect will start.

