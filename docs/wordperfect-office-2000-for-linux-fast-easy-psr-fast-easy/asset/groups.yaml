    index entries will be created as you continue.


    - 8. Click the mouse pointer on a blank line in the document where you want to
    insert the index. The insertion point will appear where you click.

    - 9. Click the Define button. The Define Index dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_152_0.png)


