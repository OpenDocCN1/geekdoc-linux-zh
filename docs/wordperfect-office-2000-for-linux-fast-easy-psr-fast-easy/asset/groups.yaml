    +   1. Click on a cell. The cell will be highlighted.


    +   2. Click the mouse pointer on the input line. The insertion point will appear
    where you click.


    +   3. Type +2+2 on the input line.


    +   4. Click on the Accept button. The value will be entered.


    # Creating a Complex Formula


    A complex formula contains more than one operator type, such as 3×3 + 4÷2. When
    Quattro Pro makes calculations in complex formulas, it performs multiplication
    and division operators first and then addition and subtraction.


    > TIP

    To keep things less confusing, use parentheses in complex formulas whenever possible.'
