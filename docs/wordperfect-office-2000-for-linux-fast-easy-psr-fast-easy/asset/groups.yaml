    ## GLOSSARY


    **Column.** A set of cells running vertically on a worksheet. Also, vertical divisions
    of text on a page.


    **Event.** An entry in the CorelCENTRAL Calendar that spans one day to day to
    which no other individuals are invited.


    **Complex formula.** A formula in a Quattro Pro spreadsheet that has multiple
    operators.


    **Field.** A piece of information used in a database. In a form letter, a field
    is a placeholder for corresponding data.


    **Coordinates.** An alphanumeric reference to a cell.


    **File.** Information stored on a disk under a single name.


    **Copy.** To take a selection from the document and duplicate it to the Clipboard.


    **Filter.** A setting to ensure that only cells meeting certain criteria are displayed
    in the worksheet.


    **Cut.** To take a selection from the document and move it to the Clipboard.


    **Find.** A feature used to locate characters in a WordPerfect 2000 document.


    **Data.** Information that can be either numerical or textual.


    **Font.** A design set of letters, symbols, and numbers, also called a typeface.


    **Data area.** The portion of a worksheet that is designated to print.


    **Footer.** Text repeated at the bottom of each page of a document or spreadsheet.


    **Data type.** The category of numerical or textual data.


    **Footnote.** Reference information that prints at the bottom of the page.


    **Database.** A file composed of records, each containing fields together with
    a set of operations for searching or sorting.


    **Form.** A database window with spaces reserved for fields in which the user
    can enter data.


    **Default.** A setting or action predetermined by the program unless changed by
    the user.


    **Format.** To change the appearance of text or objects with features such as
    the font, style, color, borders, and size.


    **Dialog box.** A box that displays warnings or messages, or requests information
    from the user.


    **Formula.** An equation that instructs Quattro Pro to perform certain calculations
    based on numerical data in designated cells.


    **Endnote.** Reference information that prints on the last page of a document.


    ## GLOSSARY 377


    **Function.** A series of predefined formulas used in spreadsheets. Functions
    perform specialized calculations automatically.


    **Graph.** A visual representation of numerical data. Also called a chart.


    **Gridlines.** The lines dividing rows and columns in a table or worksheet.


    **Handles.** Small squares that appear when you select an object and allow for
    its resizing or movement.


    **Header.** Text entered in an area of the document for display at the top of
    each page of the document.


    **HTML.** The language used to create documents for publication on the Web.


    **Hyperlink.** A created element that consists of an address to a location, such
    as a folder on a computer or a Web page.


    **Indent.** To place text inside the margin by a specific distance.


    **Justify.** A type of alignment that spreads letters or words on a line or in
    a cell evenly between the left and right margin or across selected cells.


    **KDE.** A graphical interface designed to be used in Linux systems.


    **Key combinations.** A saved set of keystrokes that you can use to perform an
    action in lieu of a set lengthier menu commands.


    **Landscape.** A page orientation that prints a document with the long edge of
    the paper across the top.


    **Legend.** In a chart, a box containing symbols and text that explains what data
    series represents. Each symbol is a color pattern or marker that corresponds to
    one data series in the chart.


    **Line spacing.** The amount of space between lines of text.


    **Line style.** Effects using width, arrows, and dashes that can be applied to
    a line.


    **Linux.** A UNIX-operating system that gives users extensive control over all
    aspects of their work. Although it''s a command-only operating system, several
    graphical interfaces can be used "over" the Linux operating system to make it
    more user-friendly.


    **Mail merge.** A procedure that uses a form document, inserts placeholders for
    types of data, and merges that document with specific data to produce personalized
    letters, faxes, or e-mails.


    **Mathematical functions.** Functions that produce mathematical results, such
    as SUM AND PRODUCT.


    **Meeting.** An entry in the CoreCENTRAL Calendar that spans less than one day
    to which others are invited.


    **Notebook.** A single Quattro Pro file containing a collection of sheets.


    **Notes.** Additional text displayed alongside a printed Presentations slide to
    prompt the presenter.


    **Object.** A picture, chart, or other graphic element that you can place in a
    WordPerfect Office 2000 document.


    **Open.** To start a document.


    **Operator.** A symbol used in a formula to indicate a calculation, such as addition,
    subtraction, multiplication, or division.


    **Orientation.** The way a document is printed, either landscape or portrait.


    **Outline.** A hierarchy of text that shows major and minor ideas.


    **Page break.** A command that tells the application where to begin a new page.


    **Page setup.** Settings that determine how pages are set, including margins and
    orientation.


    **View.** A feature that lets view the document as it will appear onscreen.


    **Paste.** To place text previously copied from the Clipboard.


    **Properties.** The characteristics of an object, such as size.


    **Queries.** A subset of database data that meets certain criteria.


    **QuickCorrect.** A feature that automatically corrects common spelling mistakes.


    **QuickFill.** A function that automatically completes a series of data.


    **QuickFormat.** Enables the user to apply formatting settings.


    **QuickTips.** A small box that displays the name of a tool when you place the
    pointer over it.


    **Range.** A collection of cells from the first to the last.


    **Redo.** A feature that allows the restoration of an action reversed using Undo.


    **Reference.** In a formula, a name or range that refers to a cell.


    **Relative reference.** A reference to a cell relative to the location of the
    formula.


    **Replace.** A WordPerfect Office 2000 feature that locates text and replaces
    it with different text.


    **Row.** A set of cells running from left to right across a worksheet.


    **Save.** To take a document residing in the memory of the computer and create
    a file to be stored on a disk.


    **Text box.** A floating object containing text that you can place anywhere in
    a document.


    **Scroll bars.** The bars at the right side and bottom of a window that allow
    vertical and horizontal movements.


    **Toolbars.** Bars containing buttons to access commonly used features.


    **Sheet.** One of several pages in a Quattro Pro workbook.


    **Transitions.** In Presentations, elements added to a slide that determine the
    appearance of switching from slide to slide.


    **Simple formula.** A formula in Quattro Pro spreadsheet that has only one operator.


    **Undo.** A feature that allows you to reverse the last action. You can undo multiple
    actions by repeatedly using this feature.


    **Slide.** An element in a Presentations document equivalent to a page.


    **Web page.** A document that appears on the World Wide Web. Also called a Web
    document.


    **Slide Sorter.** A view in Presentations that lets view all slides together in
    one screen.


    **World Wide Web.** A series of HTML documents viewed on the Internet.


    **Sort.** To arrange data numerically in either ascending (A-Z) or descending
    (Z-A) order.


    **Zoom.** To enlarge or reduce the text displays onscreen. It does not affect
    how the document prints.


    **Spell-As-You-Go.** A feature that checks the spelling in a document against
    a dictionary and flags errors for correction.


    **Status bar.** An area at the bottom of WordPerfect Office 2000 applications
    that shows information about the document.


    **Tab.** A setting that you can place along the width of a line of text that enables
    the pointer to quickly jump to setting.


    **Table.** A collection of columns and rows, forming cells at their intersections,
    to organize sets of data.


    **Template.** A collection of format settings that constitute a document type.

