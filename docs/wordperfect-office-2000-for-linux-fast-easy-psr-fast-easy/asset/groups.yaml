    ## Editing an Event


    Nothing in the world is static. Events are postponed often. Changing your events
    in the Event calendar takes only a few seconds.


    ![](img/33d9b1681e3609bc590f82347ae3a699_349_1.png)


    ## Moving to a Different Time


    When moving an event to a different time, you can shift the entire event to the
    new time or extend the duration of the event to the new time.


    - 1. Click and hold on an event. The event will be selected.

    - 2. Drag the event to the new time. The event outline will move with the mouse
    pointer.


    ## EDITING AN EVENT 327


    - 3. Release the mouse button. The event will be located at the new time.


    ![](img/33d9b1681e3609bc590f82347ae3a699_350_0.png)


    - 4. Click and hold on a start or end line of an event.

    - 5. Drag the time line to the new time. The time outline will move with the mouse
    pointer.


    - 6. Release the mouse button. The event''s duration will extend to the new time.


    ![](img/33d9b1681e3609bc590f82347ae3a699_350_1.png)


    ## CHAPTER 23 LEARNING THE CENTRAL CALENDAR


    ## Moving to a Different Date


    When moving an event to a different day, you can edit the event''s properties
    with ease.


    - 1. Double-click on an event. The Edit - New Event dialog box will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_351_1.png)


    ## DELETING AN EVENT


    2. Type a new start date. The information will appear in the Start box.

    3. Click on OK. The Edit - New Event dialog box will close and the new date will
    be moved to the event.


    ![](img/33d9b1681e3609bc590f82347ae3a699_352_0.png)


    ## Deleting an Event


    Tax audit cancelled? While you''re cheering, follow these steps to delete the
    event from CoreCENTRAL Calendar.


    - 1. Click on an event. The event will be selected.

    - 2. Press the Delete key. The event will be removed.


    ![](img/33d9b1681e3609bc590f82347ae3a699_352_1.png)


    ## 24 Using CoreCENTRAL Calendar to Keep Organized


    Technology was supposed to make things easier for us. Remember that one? In case
    you had any doubts, try this statistic on size: 50,000 years ago, it took the
    average man about 20 hours a week to feed, clothe, and house his entire family.
    The rest of the time, he could lollygag. Today, a person must work an average
    of 50 hours a week to achieve the same goal. Technology hasn’t made things easier;
    it’s just given us more stuff to do before we can relax with nuts and berries.
    In this chapter, you’ll learn how to:


    - Create tasks in CoreCENTRAL Calendar

    - Link tasks to specific events

    - Mark tasks as fully or partially complete

    - Delete tasks from the task list


    ## CHAPTER 24: USING CENTRAL CALENDAR


    ## Creating a Task


    Using CorelCentral Calendar is a pretty good way of tracking all of the tasks
    in your life. The interface to do so is deliberately simple. After all, why make
    the task list one more technological complication?


    - 1. **Click on the line** at the top of the task list. The insertion point will
    appear on the line.

    - 2. **Type a task** on the line.

    - 3. **Double-click the task** anywhere on the line except in the Subject column.
    The Edit - Task dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_355_0.png)


    > TIP

    > Clicking on the Create new task button on the main toolbar also starts the Edit
    - Task dialog box.


    - 4. Type a category for the task. The information will appear in the Category
    box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_356_0.png)


    - 5. Click the mini-calendar next to the Start box if the task is to be started
    later.

    The mini-calendar will appear.


    - 6. Click on the month of the date. The month shown on the mini-calendar will
    change.


    - 7. Click on the day of the date. The mini-calendar will close and the new date
    will be displayed in the Start box.


    - 8. Click on the Due Date check box if the task has a deadline.

    A check will be placed in the check box and the Due Date box will be activated.


    ![](img/33d9b1681e3609bc590f82347ae3a699_356_1.png)


    - 9. Click the mini-calendar button next to the Due Date box.

    The mini-calendar will appear.


    - 10. Click on the month of the date. The month shown on the mini-calendar will
    change.


    - 11. Click on the day of the date. The mini-calendar will close and the new date
    will be displayed in the Due Date box.

