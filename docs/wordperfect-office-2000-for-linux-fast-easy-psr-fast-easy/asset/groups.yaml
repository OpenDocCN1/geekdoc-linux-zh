- md: '

    ## USING ADDRESSES IN A FORMULA 163


    1. Click on a cell. The cell will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_186_0.png)


    2. Click the mouse pointer on the input line. The insertion point will appear
    where you click.


    3. Type +D4+D5 on the input line.


    4. Click on the Accept button. The value will be entered.


    > NOTE If a cell contains a calculated value, you see a little blue triangle in
    the lower-left corner of the cell.


    ## Inserting Relative Addresses Automatically


    Quattro Pro can automatically create relative addresses.


    1. Click on a cell. The cell will be highlighted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_186_1.png)


    2. Click the mouse pointer on the input line. The insertion point will appear
    where you click.


    3. Type + on the input line.


    4. Click on cell D4. The cell will be highlighted and the cell reference will
    be inserted on the input line.


    ![](img/33d9b1681e3609bc590f82347ae3a699_187_0.png)


    5. Type - . The operator will appear in the formula cell and on the input line.


    ![](img/33d9b1681e3609bc590f82347ae3a699_187_1.png)


    ## USING ADDRESSES IN A FORMULA


    6. Click on cell D5. The cell will be highlighted and the cell reference will
    be inserted on the input line.


    ![](img/33d9b1681e3609bc590f82347ae3a699_188_0.png)


    7. Click on the Accept button. The value will be entered.


    ## Using Absolute Addresses


    Absolute addresses always reference the same cell, even if the cell and its values
    are moved. They should be used when your spreadsheet''s layout is to remain static.


    1. Click on a cell. The cell will be highlighted.


    2. Click the mouse pointer on the input line. The insertion point will appear
    where you click.


    ![](img/33d9b1681e3609bc590f82347ae3a699_188_1.png)


    3. Type +S$4+$S$5 on the input line.


    4. Click on the Accept button. The value will be entered.


    > TIP

    To change selected cell addresses on the input line from relative to absolute,
    press Shift+F4 with the insertion point on the actual cell address.


    ## Using Functions


    A function is just another kind of operator applied to values. Functions in Quattro
    Pro do not need operator symbols, although they often do the same work. For instance,
    +2*2*2 could be written as a @MULT(2,2,2) function. Don''t worry about remembering
    all of Quattro Pro''s 525 functions. A couple of tools do most of the work for
    you. The Function Composer is a great tool; it handles all of the function syntax
    for you.


    1. Click on a cell. The cell will be highlighted.

    2. Click on Insert. The Insert menu will appear.

    3. Click on Function. The Function dialog box will open.


    ![](img/33d9b1681e3609bc590f82347ae3a699_189_0.png)


    4. Click on SUM in the Function text box. The function will be selected.


    ![](img/33d9b1681e3609bc590f82347ae3a699_190_0.png)


    5. Click on Next. The Function dialog box will change to the Formula Composer
    dialog box.


    ![](img/33d9b1681e3609bc590f82347ae3a699_190_1.png)


    6. Type B3..B7 in the box next to List1. The cell range will be inserted into
    the SUM function in the box below Expression.


    ![](img/33d9b1681e3609bc590f82347ae3a699_190_2.png)


    7. Click on Finish. The Function Composer dialog box will close and the new function
    will appear in the proper cell in the spreadsheet.


    ## Formatting Notebooks


    In our image-conscious world, what the data in a spreadsheet conveys depends on
    how that data looks. In this chapter, you’ll learn how to:


    - Format numerical data

    - Change row heights and column widths

    - Apply font changes to values

    - Add borders to cells

    - Customize your Quattro Pro workplace


    ## Formatting Numbers


    You can express numeric data in many forms: dates, times, and currency.


    ## Changing Decimal Places


    When dealing with decimals, you must be sure you use the proper decimal places.


    1. Click on a cell. The cell will be highlighted.

    2. Click on Format. The Format menu will appear.

    3. Click on Selection. The Format dialog box will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_193_0.png)


    > TIP

    To change decimal places, use the Format dialog box.


    ## FORMATTING NUMBERS


    4. Click on Number. The Number tab will appear.

    5. Type the number of decimal places in the box.

    6. Click on OK. The Format dialog box will close and the value will be formatted.


    ![](img/33d9b1681e3609bc590f82347ae3a699_194_0.png)


    ## Applying New Data


    You can apply a format to numeric data.


    1. Click on a cell. The cell will be highlighted.

    2. Click on Format. The Format menu will appear.

    3. Click on Selection. The Format dialog box will appear.


    ![](img/33d9b1681e3609bc590f82347ae3a699_194_1)


    ## Applying New Formats


    QuickFormat allows you to copy the format of one cell onto another.


    1. Click on a cell with the format you want. The cell will be highlighted.

    2. Click on QuickFormat. The QuickFormat menu will appear.


    ## ADJUSTING COLUMN WIDTHS


    If you have a lot of data to fit within a cell, you might have to adjust the column
    width.


    1. Click the mouse pointer on the column heading. The pointer will change to the
    resizing cursor.

    2. Drag the column line. The column width will increase or decrease.

    3. Click the mouse pointer on the row heading. The pointer will change to the
    resizing cursor.


    ![](img/33d9b1681e3609bc590f82347ae3a699_197_0.png)


    ## Setting Cell Alignment


    Like WordPerfect, you can align values within their cells.


    ## Adjusting Cell Alignment


    Cell alignment in Quattro Pro takes one of four forms: left, centered, or general.


    1. Click on a cell. The cell will be highlighted.

    2. Click on the Alignment button. The Alignment menu will appear.

    3. Click on Left. The cell''s contents will be aligned to the left of the cell.


    ![](img/33d9b1681e3609bc590f82347ae3a699_198_0.png)


    ## Aligning across Multiple Cells


    To create a heading within a Quattro Pro document, you need to align the text
    across multiple cells.


    1. Click on a cell with the heading. The cell will be highlighted.

    2. Select the range of cells you want the heading to appear. The range is highlighted.

    3. Click on the Alignment button. The Alignment menu will appear.

    4. Click on Center Across Block. The cell''s contents will be aligned in the center
    of the selected cell range.


    ![](img/33d9b1681e3609bc590f82347ae3a699_199_0.png)


    ## Formatting with Fonts


    When changing the fonts of cell values in Quattro Pro, it is important to remember
    that selecting the cell applies to all of the cell''s values. Selecting a portion
    of the value in the cell''s input line applies font changes to only those selected
    values.

