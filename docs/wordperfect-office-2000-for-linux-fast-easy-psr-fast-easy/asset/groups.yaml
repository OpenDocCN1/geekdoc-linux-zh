    ## CHAPTER 4: LEARNING WORDPERFECT BASICS


    ## Selecting Text


    When dealing with blocks of text, a useful technique is to select the text first.
    Once the text is selected, any changes made to the selection affect all of the
    text within.


    ![](img/33d9b1681e3609bc590f82347ae3a699_63_0.png)


    - 1. Click the mouse pointer within your document. The insertion point will appear
    when you click.

    - 2. Drag the mouse pointer across the line of text. The text will be highlighted
    as you move the mouse.

    - 3. Release the mouse pointer. The selected text will be highlighted on the screen.


    > NOTE

    > remove the selection highlight from the document, simply click the mouse pointer
    anywhere within the document.


    > TIP

    > Double-click on a word to select the entire word. To select an entire paragraph,
    triple-click on the text within that paragraph.


    ## CORRECTING YOUR MISTAKES


    ## Deleting Text


    When pruning roses, you have to get tough with them to bring out the best blossoms.
    And sometimes, you have to cut some to bring out the best writing.


