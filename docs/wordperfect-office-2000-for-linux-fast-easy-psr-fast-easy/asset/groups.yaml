    ## 22

    ## Drawing with Presentations


    The ability to create stunning art becomes more accessible to the layperson every
    day. With its strong set of drawing tools, Presentations clearly steps in the
    right direction toward this accessibility, giving you endless opportunities to
    customize your slide shows. Because of this object-oriented treatment of items
    in a drawing, you can more easily manipulate and interact with the objects—especially
    given the tools Presentations includes. In this chapter, you''ll learn how to:


    - Maneuver around the drawing tools and the Bitmap Editor

    - Create various shapes

    - Draw lines and curves

    - Create tool buttons for your Web pages


    # Exploring the Drawing Tools


    If you thought that Presentations was only good for making slides, you might be
    pleasantly surprised to find it can help you make all sorts of drawn items—posters,
    banners, placards; you name it!


    There are two sets of drawing tools used within Presentations: the main Tool Palette
    and the Bitmap Editor. The Tool Palette contains tools you use for creating basic
    shapes.


    - Selection Tool

    - Chart

    - Organization Chart

    - Bitmap Editor

    - Text Object Tools

    - Line Shapes

    - Basic Shapes

    - Arrow Shapes

    - Flowchart Shapes


    - Star Shapes

    - Callout Shapes

    - Line Color

    - Line Thickness

    - Line Style

    - Reverse Colors

    - Background Fill Color

    - Foreground Fill Color

    - Fill Pattern

    - Action Shapes


    ![](img/33d9b1681e3609bc590f82347ae3a699_321_0.png)


    ## EXPLORING THE DRAWING TOOLS 299


    Clicking on the Bitmap Editor calls up this set of tools. You use the Bitmap Editor
    to create detailed works that can be inserted into the picture. The additional
    tools give you more flexibility.


    - Cancel

    - Clear

    - Paint

    - Flood Fill

    - Pickup Color

    - Text

    - Erase

    - Selection

    - Size


    ![](img/33d9b1681e3609bc590f82347ae3a699_322_0.png)


