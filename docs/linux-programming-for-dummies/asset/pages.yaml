  md: "In the first line of the preceding for in loop, you follow for friend in with\
    \ the names of your friends, which you place after the word in. This creates a\
    \ wordlist (see the following section) and designates the names as values, which\
    \ you then assign to the variable.\n\nNotice the space between $friend and the\
    \ following period. If you don't include this space, the program looks for a variable\
    \ by the name of friend . (with a period) and not friend (without a period).\n\
    \nHere's what happens as this program runs:\n\n+   Your computer takes the first\
    \ value and assigns it to friend.\n+   Then the greeting appears on the computer\
    \ screen.\n+   Your computer goes back and assigns the next value to friend.\n\
    \nThis sequence continues until your computer runs out of values, in which case\
    \ it's greeted all your friends; then the for in loop ends.\n\nSo, you've cut\
    \ down the amount of instructions that you need to type from the 16 lines using\
    \ the while loop to three lines by using the for in loop. You've also made your\
    \ program a lot easier to read by using the for in loop.\n\n# Using a Wordlist\n\
    \nThe values that you assign to the variable are known as the wordlist. A wordlist\
    \ is a list of string values (a mixture of characters and numbers) that you sequentially\
    \ assign to a variable, one at a time.\n\nBy the way, you can use a wordlist with\
    \ other statements besides the for in loop. (I think, however, that following\
    \ a routine showing how you typically use a wordlist is a better way to demonstrate\
    \ its use.)\n\nSome points to remember about a wordlist:\n\n+   Values that you\
    \ assign to a wordlist must be a string value.\n+   You must separate each value\
    \ by a space.\n+   You need to place values within quotation marks if a space\
    \ is part of the value.\n\nFollowing's an example of how to use values that contain\
    \ spaces:\n\n```\n```bash\nfor friend in \"Mary Jones\" \"Joe Smith\" \"Sue Jones\"\
    \ndo\n\techo \"Hello, $friend .\"\ndone\n```\n```"
