- pgno: 290
  md: 'everyone else permission only to execute your program. They can’t read or write
    to your program file. The following example shows how you use this command:


    ```

    chmod 0+x payroll

    ```


    This line tells Linux that anyone can execute your payroll program, but they can’t
    look at your program file and they can’t write to your program file. (Refer to
    Chapter 1 for a few more details —along with alternative commands — for the chmod
    utility.)


    If you really want to lay down the law, you can also limit access to just the
    owner of the program by using the following commands, which remove read and write
    privileges to everyone except the program’s owner. (The g stands for group rights
    and x makes the program executable):


    ```

    chmod g-x payroll

    chmod o-rw payroll

    chmod g-rw payroll

    ```


    Only a member of your group can now execute your program. (The person in charge
    of your computer, known as the system administrator, determines who’s in your
    group.)


    # Copying Files between Windows and Linux


    Your Linux program may need to use a bunch of information that’s on your personal
    computer running Windows. Say, for example, that you have a list of your friends
    that you save in a text-file format on your Windows PC. (A text file is a file
    that you create by using an editor, such as WordPad, or a word processor that
    doesn’t use any special formatting characters in the file. The file consists of
    just text. And that’s where the name comes from.)


    Now the problem is that you want to save the file to a floppy disk and then copy
    the file onto your computer that’s running Linux. This process sounds simple,
    and you’ve probably done it thousands of times from one Windows PC to another.
    But if you try simply copying the file to Linux, it doesn’t work! I don’t go into
    the details here, but trust me: It just doesn’t work because the formats aren’t
    compatible.


    You can easily overcome this problem: Just use the mcopy command to handle all
    the necessary translations (and indicate a source drive, as I do here with drive
    A), as follows:


    ```

    mcopy a:\windows\unixdata .\.....

    ```'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'This line tells your computer to copy to Linux the windata file that’s in Windows
    format on your floppy disk. During the copying process, your computer performs
    the translation and renames the file in Windows to unixdata.


    The following line shows you how to copy a file from Linux to your Windows floppy
    disk (again indicating a drive, and in this case, I’m indicating the A drive):


    ```

    mcopy unixdata a:\windata

    ```


    Your computer copies the unixdata file to the Windows floppy disk and, in the
    process, translates and renames the file.


    # # Finding Lost Files


    After you reach your stride in creating Linux programs, you eventually end up
    knee-deep in files. They’re everywhere on your hard disk: Some you can find immediately,
    but others lie buried in subdirectories.


    Finding the file that you want can prove a huge chore, but you can simplify this
    task by using the find command (to do all the work for you). Suppose that you
    want to find the payroll program (the one you haven’t touched in more than a year).
    As long as you can remember the name of the program, you can use the find command
    to search your hard disk, as follows:


    ```

    find -name "payroll" -print

    ```


    The tild e (-) tells the computer to begin the search in your home directory.
    The find command begins looking in that directory and continues through all the
    subdirectories in your home directory. The -name option tells the computer that
    the next word is the name of the program, which is payroll. Finally, the -print
    option tells the computer to display the location on-screen.


    # # Creating Your Own Place on the Disk


    After you find out how to create programs in Linux, you start with just one program
    file. Programs, however, seem to grow on their own. First, you add a subprogram
    and then another. Because a program requires information, you may create a database
    file. You also eventually create different versions of your program as you make
    changes to it.


    TIP


    Keeping track of all the files necessary to run your programs is vitally important.
    How do programmers keep things organized? They create subdirectories in their
    home directory. Give each of the programs that you create its own subdirectory
    on your hard disk to isolate it from other programs you’re building.'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Chapter 24: Ten Linux Programming Topics That Didn''t Fit Anywhere Else




    To create a subdirectory, use the `mkdir` command, as follows:


    ```

    mkdir payroll_proj

    ```


    This line tells your computer to set aside a section of your disk and call it
    payroll\_proj. In this area, you put all the files that relate to your payroll
    project.


    You can access this new area of your hard disk by using the `cd` command. This
    command tells your computer to change to that directory, as in the following example:


    ```

    cd payroll\_proj

    ```


    After the new directory appears on-screen, you can create other subdirectories.
    Each subdirectory houses a different type of file. The following example shows
    how a programmer typically organizes files for a program:


    ```

    mkdir payroll\_proj

    mkdir payroll\_proj/release\_version

    mkdir payroll\_proj/version1

    mkdir payroll\_proj/data

    mkdir payroll\_proj/documents

    ```


    As you start a new programming project, use the `mkdir` command to create a project
    directory as a branch of your home directory (what''s happening in the first line
    of this example). The new programming project is *payroll*, so I call the project
    directory `payroll\_proj` to clearly identify the contents of the directory.


    Beneath the `payroll\_proj` directory lie additional subdirectories that contain
    specific information about the project. I create four such subdirectories as branches
    of the `payroll\_proj` directory. One of these subdirectories is to contain the
    release version of the program. I call this subdirectory *release\_version*. After
    I finish writing and testing my payroll program, I place the program in this directory
    so that I always have a copy of the program ready for anyone who asks for it.


    The *release version* of the program is also known as the *current version* of
    the program. Every time that you change the instructions in the program, you create
    a new version of the program. Windows, for example, comes in versions 3.1, NT
    4.0, and so on. These are version numbers, and each one signifies that changes
    were made to the previous version of the program. To help me keep track of versions
    of my own program, I create a subdirectory for each version and then place the
    appropriate version of the program in that subdirectory. In this example, I have
    only one version of my program, so I need to create only one subdirectory, which
    I name *version1*.'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Two other subdirectories that programmers commonly create for new programming
    projects are those for data and documentation. **Data** is the information that
    the program needs to complete the task. Frequently, you keep this information
    in a file on your hard disk — and store it in the data directory. Similarly, you
    use the documentation subdirectory to store files that contain instructions for
    using the program and notes about the design of the program, such as flow charts.


    This setup is just the typical subdirectory layout that I use as I begin a new
    programming project. You need to keep your program files organized, and this example
    gives you a head start in creating your own subdirectory layout for your programming
    projects.


    # ## Changing the Characters in a File


    This section presents a trick that can save you a great deal of programming time.
    If you ever need to perform a global search and replace for information in a file,
    you can do so by using the `tr` command. This command changes the information
    efficiently.


    If you want to change all the lowercase letters in a data file to uppercase, for
    example, type the following command:


    ```

    tr ''[a-z]'' ''[A-Z]'' < dataInput > dataOutput

    ```


    The first argument, `''[a-z]''`, is the information that your computer searches
    for.


    The information that you want to replace the first argument in the file is shown
    in the second argument, `''[A-Z]''`.


    The third argument, `dataInput`, is the file that you want to search.


    The computer places the modified information in the `dataOutput` file, which is
    the last argument.


    Check out the `man` pages (manual pages) about the `tr` command to discover more
    neat tricks, by using the following command:


    ```

    man tr

    ```


    # ## Maintaining Your Code


    To store your programs and their related files safely and professionally, save
    them in an *archive file*. You manage an archive file by using the `ar` command,
    which enables you to place several files under one name. It''s like having a file'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'drawer that contains all your programs and files. You can refer to the label
    on the file drawer if you need to look at any of the files that you store in the
    drawer. In this case, the file drawer is really an archive file with your own
    name. Inside the archive file are all your other files that relate to your program.


    Suppose that you''re building the payroll program that I mention in the section,
    “Stopping Your Program in an Emergency,” earlier in this chapter. The program
    consists of a program file and subprograms, data files, and documentation files.


    You can organize these files by creating subdirectories, or you can save them
    in an archive file by typing the following command:


    ```

    ar q payroll_1_lib payroll1

    ```


    The **q** command tells the computer to *append* the file *quickly* to the library
    file, while **payroll_1_lib** is the name of the library file, and **payroll1**
    is the file that the command places in the library file.


    Whenever you want to use the payroll file, you ask your computer to retrieve it
    from the library file, as follows:


    ```

    ar x payroll_1_lib payroll1

    ```


    The **x** command tells the computer to *extract* the file from the library. After
    you finish with the file, you return it to the library by using the **r** command,
    as follows:


    ```

    ar r payroll_1_lib payroll1..

    ```


    # Pausing Your Program


    You can make your program pause at any time by using the `sleep` command. This
    command temporarily stops the execution of your code until a specified number
    of seconds passes, as in the following example:


    ```

    echo "How do you get 4 elephants into a compact car?"

    sleep 10

    echo "Two in the front, and two in the back"

    ```


    In this example, your computer first asks a question, and then the program tells
    it to pause for ten seconds. Then the punch line appears on-screen. (That’s a
    sick one.)'
