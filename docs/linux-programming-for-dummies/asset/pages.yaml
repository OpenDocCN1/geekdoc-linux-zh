- pgno: 302
  md: 'The directory that you''re in after you log in to your computer. Your home
    directory is usually a subdirectory of /home.


    # ### input mode


    A setting in a text editor that enables you to enter text. In the vi text editor,
    for example, pressing i while in the command mode places you in the insert mode.


    # ### I/O (input/output)


    Information going into your computer or program or leaving your computer or program.


    # ### job


    A program that''s running in a shell.


    # ### keyboard


    The device you use to type characters into your computer.


    # ### kill


    A Linux command that enables you to stop a program that''s running. The `kill
    %payroll` command, for example, stops the `payroll` program (and nobody gets paid).


    # ### Korn shell


    An improved version of the Bourne shell that uses the $ as the prompt. Type `ksh`
    the command prompt and press Enter to start the Korn shell.


    # ### line editor


    A text editor that enables you to edit text one line at a time. The `ed` program
    is a line editor.


    # ### Linux


    A free version of the Unix operating system that a Finnish student named Linus
    Torvalds developed while he was studying at the University of Helsinki, on the
    premise that Unix shouldn''t be so darned expensive.


    # ### log in


    The process of identifying yourself to the computer. This process requires you
    to enter a user ID and a password that Linux validates before you can use the
    computer.'
  merge: -1
