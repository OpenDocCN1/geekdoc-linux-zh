    age.


    # Displaying Data That Someone Enters


    After your program has the information that someone enters, it needs to do something
    with the information. The program can use the data in a calculation, store the
    information in a file on your disk, or do practically anything with it that you
    can imagine. (Well, almost anything.)


    The most common thing to do with the information is to make it appear on-screen.
    Another thing to do is to compare the data with information that''s already in
    your computer — but for now, you want to just try a simple display first.


    Following are some things that you need to know about displaying information:


    +   - Data appearing on-screen still remains in the variable. (You store data
    in a variable, and then the program copies the data from the variable to the screen.
    The data remains both on-screen and in the variable.)

    +   - This process enables the program to do something else with the data while
    you''re looking at it. Your program can store a salary in the MySalary variable,
    for example, and then display the salary on-screen. While the salary''s on-screen,
    the program can still use it to calculate your new salary — assuming, of course,
    that you receive a raise in pay.'
