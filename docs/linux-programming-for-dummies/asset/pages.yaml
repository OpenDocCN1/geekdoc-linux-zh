    1, so the program follows the same instructions as if the rain isn’t falling.


    ![](img/05279073f26be7df99b3c487360dec6a_141_1.png)


    Always indent instructions that you place in a while loop. If you don’t, you usually
    must spend hours trying to understand what you told the program to do. (Although
    your program has no trouble reading your code whether you indent it or not.) Always
    indent lines of instructions so that you group similar instructions together.'
