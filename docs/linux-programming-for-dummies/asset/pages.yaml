- pgno: 306
  md: '# **_text file**


    A file that contains ASCII characters and no control characters. (Control characters
    are symbols that word processors use to make your text fancy, such as font and
    type size.)


    # **_UNIX**


    A multiuser processing system developed in 1972 at Bell Laboratories.


    # **_Unix**


    An accepted term for generic Unix-compatible operating systems, such as Sun’s
    Solaris and Linux.


    # **_UNIX International (UI)**


    A group of vendors who support System V.


    # **_username**


    The name that you enter as you log into Linux. Linux then compares your username
    and password with its list of known users to determine whether you can access
    the computer.


    # **_utility**


    A program that comes with Linux and performs one task very well. The **cmp** utility,
    for example, compares two files and tells you where these files differ. Find out
    about any utility by using the manual pages. If, for example, you want to know
    more about **cmp**, type `man cmp` at the command prompt and press Enter:


    # **_wildcard**


    A symbol that takes the place of any character if you use it in a filename or
    pathname. The two symbols that you use as wildcards in Linux are * and ?.


    # **_working directory**


    The current directory that you’re working in. You can use the **pwd** command
    to ask Linux to tell you the name of the working directory.


    # **_X Window System (or just X)**


    A program that enables you to break Linux into several windows on-screen. Each
    window is running a shell and permits you to run different programs in each window.'
