- pgno: 194
  md: '# Chapter 16


    # Working with Database Files


    In This Chapter


    +   - Creating a database file

    +   - Saving information to a database file

    +   - Finding information in a database file


    May I have the file on Jones? Sure can. And with a few strokes of the keyboard,
    up comes the information about Jones on-screen. It’s a miracle. Those mystical
    computers get the data you need in seconds and without ever making a mistake (ha!).


    Exactly how a computer locates all the information that you think is confidential
    involves very little magic. You, too, can perform this trick by following a few
    simple steps:


    +   - Decide what information you want to store and retrieve.

    +   - Plan how you want your computer to store the information.

    +   - Know the correct words to use to ask your computer to find the information
    that you want.


    # What Is Data?


    Information is a bunch of words that contain some meaning for people. You recognize
    the letter *B*, for example, as a letter of the alphabet that represents the phonetic
    sound *ba*. If you combine the letter *B* with two more letters, *ob*, you come
    up with a different meaning for the letter *B*. Now it’s part of the word *Bob*.


    Combine the word *Bob* with the numbers 555-55-5555 (which looks a lot like a
    Social Security number). This data then identifies a specific individual whose
    first name is Bob. By combining letters into words and words into meaningful data,
    you form information that you can use to manage your affairs.'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'Keep in mind, however, that this data is meaningful only to us. To the computer,
    it looks very confusing—that is, until you translate the letters into something
    that your computer understands: a series of zeros and ones.


    # What Is a File?


    Words that you type at the prompt by using your computer''s keyboard appear on-screen.
    You can read this data, but you can''t do much else with it.


    To make the information useful, you need to save it to a file. A *file* is a place
    on the computer''s hard drive (or floppy disk) where you store data; the data
    stays there after you turn off your computer. Think of a file as a folder that
    you place in a file drawer. The drawer, in this case, is the computer''s hard
    drive.


    # Saving information to a file


    The easiest way to save information to a file in Linux is to use the `echo` reserved
    word. The following example shows you how to do so:


    ```

    echo "Bobbie" > friends

    ```


    This command tells the computer to take the word `Bobbie` and, instead of displaying
    it on-screen, put it into a file by the name of `friends`.


    Notice that you use the greater-than operator (>) in this command. This particular
    operator is known as the *redirection* operator. It tells the computer to change
    the place where it normally shows data, which is the screen. (Nerds call this
    process redirecting the *output* from standard *out* to the disk.)


    ![](img/05279073f26be7df99b3c487360dec6a_195_0.png)


    Be careful if you save information to a file by using the redirection operator.
    If the file already exists, you replace the information currently in the file
    with new information.


    # Appending information to a file


    You don''t want to overwrite information each time that you save new information
    to a file. A better way is to place the new information at the end of the existing
    information. This process is known as *appending* information to a file, as in
    the following example:


    ```

    echo "Bobbie" >> friends

    ```'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'You use two greater-than signs (>>) to tell the computer to put the information
    at the end of the file. If the file doesn''t exist, the computer creates a new
    file and places the information into the file.


    # Displaying information

    that you store in a file


    After you save the information to a file, you can turn off your computer and go
    do something exciting. After you come back, you find that the information still
    resides on the hard drive. You can show the information that you save to a file
    by using the `cat` utility, as follows:


    ```

    cat friends

    ```


    This command tells the computer to copy each character in the file `friends` and
    display these characters on-screen. (The whiz kids call this process concatenating
    the information that you store in the file to standard out, which is the screen.)


    Information that appears on-screen is a copy of the information that you''re storing
    in the file. The original information remains in the file until you over-write
    or append the file.


    # A File and a Database


    Some programmers confuse a file with a database — an understandable mistake, because
    a database is a kind of file. Information that you store in a database you also
    store in a file on a disk. But not all information that you store in a file goes
    into a database. (You knew I was going to say that, right?)


    A file displays the following characteristics:


    +   * Contains information in no particular order.

    +   * No organization to enable you to find the information quickly.

    +   * Can contain mixed kinds of information.


    A database, however, displays the following traits:


    +   * Contains information in a particular order.

    +   * Its organization enables you to find the information quickly.

    +   * Contains a unique kind of information.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'Think of a database as way to organize information that resides in your file
    folder. Placing information in a file folder is similar to storing information
    in a file. Organizing that information in the file folder so that you can quickly
    find what you''re looking for is similar to storing information in a database.


    # ## Databases and Database-Management Systems


    Whenever most programmers talk about a database, they''re really talking about
    a database-management system. A *database-management system* is a group of programs
    that works together to create and maintain a database file.


    You can purchase many popular database-management systems for your computer. They''re
    expensive, however, and you often find them only on large commercial computer
    systems. But with a bit of effort, you can create your own database-management
    system.


    A word of caution: Don''t expect your system to manage any important data. You
    need a commercial database-management system for any serious database jobs. If
    you use your homemade system, you can''t find important data fast enough to keep
    up with your database needs. Your homemade system, however, is perfect for working
    with small amounts of data and finding out how a database system works.


    ![](img/05279073f26be7df99b3c487360dec6a_197_0.png)


    # ## Creating a Database


    The first step in creating a database is to decide how you''re going to organize
    your information. You must ask yourself what information you want to store in
    the database. Consider storing, for example, the information that a telephone
    directory contains (the data in the electronic version of your black book). Make
    a list of the things that you normally find in such a directory, as I do in the
    following list:


    +   - First name

    +   - Last name

    +   - Telephone number'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Columns and rows


    A *row* is a horizontal line that contains a set of data (known as a *record*).
    All the information about Bob Smith, for example, appears on the same line. Each
    person gets a separate line in the database.


    A *column* is a vertical grouping of the same kinds of data (known as a *field*).
    All the first names, for example, appear in the same column, as do all the last
    names.


    This data appears similar to that in the following example:


    ```

    ```

    Bob Smith  555-1212

    Mary Jones 555-5555

    Tom Adams  555-7777

    ```

    ```


    Notice that each line contains the same kind of information in the same order
    (first name, last name, telephone number). Organizing data this way forms a database.


    The following example displays the same information but not in a database format:


    ```

    ```

    555-1212 Bob Smith

    Mary Jones 555-5555

    Adams, Tom, 555-7777

    ```

    ```


    Information about each person appears on its own line, which is fine for a database.
    The columns, however, don''t contain similar information. The data is simply unorganized.


    # Saving information to a database


    Although a file isn''t always a database, a database *is* a file. (Am I confusing
    you?) You save information to a database the same way that you save information
    to a file. The following example shows you how to do it:


    ```

    ```

    echo "Bob Smith 555-1212" >> friends

    echo "Mary Jones 555-5555" >> friends

    echo "Tom Adams 555-7777" >> friends

    ```

    ```


    The first line tells the computer to save information about Bob to the file friends.
    If the file doesn''t exist, the computer creates this file.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'The second line tells the computer to save information about Mary to the end
    of the file *friends*.


    The last line tells the computer to save the information about *Tom* to the end
    of the same file.


    # ## Finding Information in a Database by Using vi


    The kind of file that you use as the database file is known as a *text file*.
    This file is almost like the file that you create by using your word processor
    — except that all the instructions for those fancy features (for example, font
    size) are missing. If you want to find information in the file, your computer
    must search each line in the database file.


    # ### Start vi


    You can use a number of methods to locate data in your database file. The easiest
    and yet most time-consuming method is to use a text editor, such as *vi*. (See
    Appendix B for all the details that you want to know about *vi*.) Try entering
    the following line at the command prompt:


    ```

    ```

    vi friends

    ```

    ```


    Press Enter, and a page of the database file appears on-screen (assuming, of course,
    that you have a file by the name of *friends*).


    # ### Search methods in vi


    You can then use either of the following two methods to find information in your
    database by using *vi*:


    +   * The hunt-and-peck method. You hunt through each page on the screen and then
    peck at the PgDn key to access another page.

    +   * The find feature of *vi*. Ask the program to locate the data for you.


    These methods, of course, aren’t the best ways to search for information in a
    database file. A much better method is to use a Linux utility, which is a program
    that’s designed to search your database.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The `gawk` utility is one of the most popular tools that programmers use to
    search a database file. It consists of the following two parts:


    +   A search pattern.

    +   Data that you want to display.


    The following example shows you how to use this command:


    ```

    `gawk ''/Smith/ {print $1, $2, $3}'' friends`

    ```


    This command tells your computer to look for the character Smith in the database
    file friends. Then the computer displays the first, second, and third column of
    all rows that match Smith. Notice the use of the curly brackets ({} ) and the
    single quote marks with the gawk command.


    # Create the search expression


    The information that you''re looking for in the database file is known as the
    search expression. The search expression tells the computer how to identify the
    rows in your database that you want to see.


    The search expression has the following characteristics:


    +   It must appear at the beginning of the gawk command line.

    +   You must place the information that you''re looking for within the forward
    slash character (/).


    Building a search expression for the gawk utility can become complex because it''s
    a very powerful utility. If you really want to dig into building complex search
    expressions, use the man pages to see the online documentation. The man command
    displays the manual pages relating to a particular Linux utility or command. The
    following example shows you how to issue the command at the Linux prompt:


    ```

    `man gawk`

    ```


    # Match characters


    The simplest search expression tells the computer to find an exact match for a
    pattern. The pattern contains the characters that appear somewhere in the database
    file.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Perhaps you want to see all the rows from the *friends* database file that
    have 555 as the first three digits of the telephone number. The pattern that you
    want to match is 555-.


    Notice that you place the hyphen (-) at the end of the pattern for which you’re
    searching. You do so because the first three digits of the telephone number end
    with a hyphen, at least in your database file. If you omit the hyphen from the
    search expression, the computer selects any occurrence of 555 in a row.


    The following example shows how the search expression looks:


    ```

    gawk ''/555-/ {print $1, $2, $3}'' friends

    ```


    This command results in the computer displaying all the rows in the *friends*
    database file, because each telephone number begins with 555-.


    # ## Watch out for spaces


    ![](img/05279073f26be7df99b3c487360dec6a_201_0.png)


    Whenever you tell the computer to find an exact match in a database file, you
    must consider that spaces separating columns can be a required part of the search
    expression because the spaces are actually part of the data.


    Consider, for example, adding the name John Smith to the *friends* database file.
    The following example shows what the file looks like after you finish:


    ```

    Bob Smith 555-1212

    Mary Jones 555-5555

    Tom Adams 555-7777

    John Smith 555-4444

    ```


    Now you can ask the computer to show you Bob Smith’s telephone number. Because
    two lines contain Smith, you make it clear in the search expression that you want
    to see Bob Smith and not John Smith.


    The following example shows how the search expression looks:


    ```

    gawk ''/Bob Smith/'' {print $1, $2, $3}'' friends

    ```


    The search expression includes the space between the first and last names of Bob
    Smith.


    # ## Match only the beginning of the line


    You can be clever and tell the computer to match characters from the beginning
    of the line. You accomplish this feat by including a *caret* (^) as the first
    character in the search expression. Why do you need to do so? Good question. Look
    at the following database file:'
  merge: -1
  img_proc: true
- pgno: 202
  md: '```

    123786 B1n 123987

    123987 B1n 134444

    134444 B1n 123986

    133333 B1n 123986

    ```


    It doesn’t look like much, but perhaps the first column contains part numbers
    and the second and third columns contain location numbers in a warehouse. Now
    you want the computer to show you the location of all the parts that have a part
    number beginning with 123.


    At first glance, you may think of just matching the characters, as I show you
    in the preceding section. The command for such a search looks as follows:


    ```

    gawk ''/123/ {print $2, $3}'' inventory

    ```


    This command, however, causes your computer to return all the rows because each
    row contains the pattern 123 in it. What you really want is to match just the
    first column. The following example shows what you actually need to type:


    ```

    gawk ''/^123/{print $2, $3}'' inventory

    ```


    Now only the first two rows meet the search expression.


    # ## Choose the column to match


    You can specify the column that contains the data to match as part of the search
    expression. Say that you like the computer to find all the rows that contain the
    pattern 123 at the beginning of column 3. In addition, you know that the column
    can contain other characters after the pattern 123. Use the following expression:


    ```

    gawk ''$3 ~ /^123*/ {print $1}'' inventory

    ```


    The $3 represents the column that you want to search.


    The tilde character (~) tells the computer that you’re looking for a match. It’s
    like an = operator you use in the if statement (see Chapter 6).


    The caret (^) tells the computer to start matching at the beginning of the column.


    The asterisk (*) tells the computer that other characters in the column in addition
    to the ones that you’re seeking are okay.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Do not match


    You can also tell the computer to show rows that don''t match the search expression.
    To display the part numbers that aren''t in locations that begin with 123, use
    the following expression:


    ```

    gawk ''$1 !~ /^123*/ {print $1}'' inventory

    ```


    The only difference between this example and the preceding search expression is
    the *not* operator (!) that you place before the tilde (\~). This operator tells
    the computer to find lines that are “not equal to” those in the search expression.


    # Extract information to a file


    You can copy all or part of the data in a database file to another file simply
    by using the redirection operator (> ). The following example shows you how to
    do so:


    ```

    gawk ''/^123/ {print $2, $3}'' inventory > locations

    ```


    In this expression, you''re telling the computer to copy to the locations file
    only columns 2 and 3 of rows from the inventory database file where 123 are the
    first three characters on the line. You can view the locations file by using a
    text editor such as vi, or you can use your word processor.


    # Delete information from a file


    Your computer can also quickly remove information from a database file. Just give
    it the correct command, and your computer takes out an eraser and wipes away the
    row. In reality, the computer rewrites the database file, omitting the unwanted
    row.


    The friends database file, for example, contains a row with information about
    Tom Adams, as follows:


    Bob Smith  555-1212

    Mary Jones 555-5555

    Tom Adams 555-7777

    John Smith 555-4444'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'Perhaps Tom Adams is no longer your friend. To delete that row from the database
    file, use the following expressions:


    ```

    gawk ''$2 !~ /^Adams/ { print $1, $2, $3}'' friends > newfriends

    rm friends

    cp newfriends friends

    rm newfriends

    ```


    The following steps provide a blow-by-blow account of what''s happening:


    +   1. The line gawk ''$2 !~ /^Adams/ { print $1, $2, $3}'' friends > newfriends
    tells your computer to find rows that don''t contain the name Adams in the second
    column. After the computer finds a column that fits the search criteria, it copies
    all the columns to the new database file newfriends.

    +   2. It doesn''t copy the row that contains Adams to the newfriends database
    file.

    +   3. The line rm friends deletes the friends database file.

    +   4. The line cp newfriends friends copies the newfriends database file to a
    new file by the name of friends. Now both database files contain the same information.

    +   5. The line rm newfriends deletes the newfriends database file, leaving you
    with the revised friends database file.


    # Displaying information on-screen


    You can pick which columns appear from the database file in your search by using
    the print statement and the column number. Your search must include the following
    criteria:


    +   - You must precede each column that you want to appear on-screen with a dollar
    sign ($).

    +   - A comma must separate each column reference.


    The following example shows how this search expression looks:


    ```

    gawk ''/123/ { print $2, $3}'': inventory

    ```'
  merge: -1
  img_proc: true
