- pgno: 99
  md: 'These arithmetic operators enable your computer to add, subtract, multiply,
    and divide numbers or variables that contain numbers. (See Chapter 4 for the scoop
    on variables.) Table 6-1 shows these operators (as if you can''t figure them out
    on your own).


    | **Operator** | **What It Does** |

    | :--- | :--- |

    | + | Adds two numbers |

    | - | Subtracts two numbers |

    | * | Multiplies two numbers |

    | / | Divides two numbers |

    | % | Divides two numbers and returns only the remainder |


    # Adding two numbers by using the + operator


    To add two numbers together, use the + operator, as in the following example:


    ```

    let a=30

    let b=10

    let sum="$a + $b"

    ```


    Notice the lack of spaces around the = signs and the spaces around the + operator.
    Such spacing is true for all constructions of operators.


    `let a=30` tells the computer to create a variable by the name of `a` and to assign
    that variable the value 30.


    `let b=10` tells the computer to create a variable by the name of `b` and to assign
    that variable the value 10.


    `let sum="$a + $b"` tells the computer to create a variable by the name of `sum`
    and to assign it the value of `a` plus the value of `b`. In this example, the
    value of `sum` equals 30 + 10 (which is 40).'
