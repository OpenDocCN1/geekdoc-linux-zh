  md: '# Chapter 20: Getting Goofy with E-Mail


    All incoming e-mails appear in a list, along with their subjects, if any, and
    a unique number so that the `mail` utility doesn''t confuse e-mails with similar
    addresses and subjects. At the end of the list, you see an ampersand (&) command
    prompt. Enter the number of the e-mail that you want to read at the prompt and
    press the Enter key, as follows:


    ```

    ```

    & 1

    ```

    ```


    In this example, I''m asking the `mail` utility to display the first e-mail in
    my incoming mailbox. The full text of a e-mail appears on-screen. This text consists
    of the same information that `memo1` contains. Type q at the prompt and press
    the Enter key to quit the `mail` utility after you finish reading the message,
    as follows:


    ```

    ```

    &q

    ```

    ```


    # Sending e-mail to a friend


    You can send an e-mail to someone other than yourself by replacing your e-mail
    address with your friend''s e-mail address and then repeating the same process
    that I describe in the section “Sending e-mail,” earlier in this chapter, to send
    the e-mail. The following example shows how I send an e-mail to `bob`, the user
    ID that I create in the section “Adding a new user,” earlier in this chapter:


    ```

    ```

    mail bob@mycomputer < memo1

    ```

    ```


    After I press the Enter key, the `mail` utility sends `bob` my e-mail message
    that `memo1` contains. I can''t read this message; however, only `bob` can read
    this message after he logs in to the computer.


    Because I know `bob`''s user ID and password, however, I can log in and pretend
    to be `bob`. First, I log in by using `bob`''s user ID, press the Enter key, and
    then enter the password, pressing the Enter key again, as the following example
    shows:


    ```

    ```

    Login: bob

    Password: bob

    ```

    ```


    Remember that you must use a user ID and password that you create on your computer
    to complete this exercise. (The ID and password that you must use may be different
    from what I''m showing here if you don''t first create a user ID for `bob` that
    uses `bob` as its password, too.)'
