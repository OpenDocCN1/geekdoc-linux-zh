- pgno: 1
  md: "# **Linux® Programming**\n**For Dummies®**\n\n![](img/05279073f26be7df99b3c487360dec6a_1_0.png)\n\
    \n![](img/05279073f26be7df99b3c487360dec6a_1_1.png)\n\n# ### if\n\n```\n```\n\
    if [ condition ]\nthen\n    instruction\nfi\n```\n```\n\nYour program follows\
    \ the instruction if a certain *condition* exists — meaning the *condition* is\
    \ true.\n\n# ### if elif\n\n```\n```\nif [ condition_1]\nthen\n    instruction_1\n\
    elif [ condition_2 ]\nthen\n    instruction_2\nfi\n```\n```\n\nYour program obeys\
    \ the first group of instructions if *condition_1* is true. However, if *condition_1*\
    \ is false, your program determines if *condition_2* is true. If *condition_2*\
    \ is true, your program obeys the second group of instructions. If *condition_2*\
    \ is false, your program skips the second group of instructions.\n\n# ### if else\n\
    \n```\n```\nif [ condition ]\nthen\n    instruction_1\nelse\n    instruction_2\n\
    fi\n```\n```\n\nYour program obeys the first group of instructions if the *condition*\
    \ is true . . . but obeys the second group of instructions if the *condition*\
    \ is false.\n\n# ### while\n\n```\n```\nwhile [ condition ]\ndo\n    instruction\n\
    done\n```\n```\n\nThe *condition* must be a variable or expression that results\
    \ in a true or false value.\n\n\n\n![](img/05279073f26be7df99b3c487360dec6a_1_2.png)"
  merge: -1
  img_proc: true
