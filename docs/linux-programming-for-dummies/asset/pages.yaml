- pgno: 146
  md: "# ## A for in loop is not a for next loop\n\nSome computer languages, such\
    \ as Visual Basic, use a `for next` loop, which enables you to determine the number\
    \ of times the instructions inside the loop execute. The Linux bash shell language\
    \ doesn't have a `for next` loop. A few inexperienced Linux programmers try to\
    \ use the `for in` loop as a replacement for a `for next` loop. This attempt just\
    \ doesn't work.\n\nHere's a better way to control the number of times your computer\
    \ executes instructions inside a loop: Use the `while` loop. (Refer to Chapter\
    \ 10 for the lowdown on `while` loops.) Take a look at the following example:\n\
    \n```\n```\nlet counter=1\n\nwhile [ \"$counter\" -lt 4 ]\ndo\n\techo \"This is\
    \ my $counter time around.\"\n\tlet counter=$counter + 1\ndone\n```\n```\n\nThis\
    \ program tells your computer to follow the instructions inside the loop three\
    \ times. The last line increases the `$counter` variable by 1. The loop continues\
    \ to run as long as the value of `$counter` is less than 4; the loop ends as soon\
    \ as the value of `$counter` reaches 4.\n\nYou can control the number of times\
    \ that the computer executes instructions within the loop by changing the value\
    \ of the condition of the `while` loop (`$counter -lt 4`).\n\nSuppose that you\
    \ want the program to execute the instructions ten times. Change the value 4 to\
    \ the value 11. Changing the value to 11 means that the `while` loop continues\
    \ as long as the value of `$counter` is less than 11.\n\n# ## Test your newfound\
    \ knowledge\n\n+   1. What is a wordlist?\n+      a. A list of values that you\
    \ use to sort data.\n+      b. A list of values that you use in a timing loop.\n\
    +      c. A list of values that you use in a loop.\n+      d. A list of expletives\
    \ that you mutter if your Linux program doesn't work.\n\n+   2. When does a loop\
    \ stop looping?\n+      a. After you press Q on the keyboard.\n+      b. It stops\
    \ if no more values remain in the wordlist.\n+      c. After your program encounters\
    \ a bug.\n+      d. After the loop reads the word *stop*.\n\n*Answers: 1/ c. See\
    \ “Using a Wordlist.” 2/ b. See “Using a Wordlist.”*\n\n![](img/05279073f26be7df99b3c487360dec6a_146_0.png)"
  merge: -1
