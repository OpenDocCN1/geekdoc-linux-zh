    # Solaris


    A version of Unix for use on a Sun workstation.


    # subdirectory


    A directory within another directory.


    # superuser


    A user with the power to really mess up the computer — and do a lot of good things,
    too. A superuser is also known as the root.


    # system administrator


    The person responsible for keeping your computer and Linux running.


    # System V


    The version of Unix that AT&T developed and that UNIX System Labs, which is part
