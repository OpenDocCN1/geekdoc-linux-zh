- pgno: 225
  md: '# Look at your code while the program''s running


    Reviewing each line of your code is fine for short programs, but it''s a nightmare
    if you''re using this method to debug a much larger and more complex program.


    Debugging a program (that''s nerd talk for finding the problem with your program)
    is tedious work. Regardless of what method you use to locate the problem, you
    still need to review the lines of your code as the final step in this process.


    Your inability to see your instructions while your program is running is a drawback
    in debugging your program. You simply can''t see what''s happening in that black
    box.


    The following list describes two ways that you can solve this problem (assuming
    that the name of your program is myprogram and you''re using the bash shell):


    +   - Use the `-v` option, also known as the verbose option, to tell your computer
    to display each line of code before it executes it. You use the following expression:

    +   ```text

    +   $ bash -v myprogram

    +   ```

    +   You call the bash shell explicitly with the `-v` option and the name of your
    program by using this expression.

    +   - Use the `-x` option, also known as the echo option, to make your computer
    display each line after it executes it. Use the following expression to do so:

    +   ```text

    +   $ bash -x myprogram

    +   ```


    The major difference between these two methods is that -v shows you the instruction
    before the computer executes it, and -x shows it to you after it executes the
    instruction.


    # Laying a Trap for the Bug


    Sometimes you can look at your code until you can''t see straight, and you still
    can''t determine why your program isn''t working. This situation can become very
    frustrating, but don''t give up. Instead, try another tactic.'
  merge: -1
  img_proc: true
- pgno: 226
  md: "Following are some good fallback plans that you can try:\n\n+   - **Set flags\
    \ for yourself throughout the program.** A *flag* is a message that appears on-screen\
    \ to tell you what part of your program your computer is currently reading (see\
    \ Chapter 4).\n+   - **Display the value of all the variables in your program\
    \ on-screen.** This procedure gives you a glimpse of what’s happening behind the\
    \ scenes (see Chapter 4).\n+   - **Turn parts of your program off and on by making\
    \ the expression** ***true or false.*** *This process helps you to isolate the\
    \ part of your program that’s causing the trouble (see Chapter 3).*\n\nJust use\
    \ a little common sense in using any of these methods. You must decide where to\
    \ place the flags and which parts of your program you turn off and on.\n\n# Setting\
    \ flags\n\nA *flag* is simply a message that appears on-screen. The message of\
    \ a flag can be as simple as “I got this far.”\n\nThe following example shows\
    \ you how to use flags in your program (and notice that the `let` command designates\
    \ the flag):\n\n```\n```bash\n#!/bin/bash\nlet flag=1\necho \"Outside of while\
    \ loop\"\nwhile [ \"$flag\" -eq 1 ]\ndo\n    echo \"Inside of while loop\"\n \
    \   for friend in Bob Mary Sue\ndo\n        echo \"Inside of for-in loop\"\n \
    \       echo \"Hello $friend.\"\n    done\n    echo \"Outside of for-in loop\"\
    \n    echo \"Good-bye!\"\n    let flag=1\necho \"last line in while loop\"\ndone\n\
    echo \"last line in the program\"\n```\n```\n\nYou see the following messages\
    \ on-screen as you run this program:\n\n```\n```\nOutside of while loop\nInside\
    \ of while loop\nInside of for-in loop\nHello Bob\nInside of for-in loop\n```\n\
    ```"
  merge: -1
  img_proc: true
