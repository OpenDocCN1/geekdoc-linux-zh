- pgno: 286
  md: '# Chapter 24


    # Ten Linux Programming Topics That Didn’t Fit Anywhere Else


    +   In This Chapter

    +   - Running programs in the background

    +   - Pulling the plug on your program in an emergency

    +   - Making shell variables available to subprograms

    +   - Preventing other people from altering your code

    +   - Translating your files so that you can transfer them between Windows and
    Unix

    +   - Searching for lost files

    +   - Creating a place for programs on your hard disk

    +   - Changing characters in a file

    +   - Saving your code in an archive file

    +   - Stopping your program temporarily


    Now that you’re at the end of this book (even if you haven’t read it yet and just
    skipped back here to see the possibilities), you’re probably wondering whether
    the information in this book includes everything that you need to know about Linux
    and Linux programming.


    No, this book is just the beginning. This chapter contains some tidbits that you
    may find useful and interesting as you continue your quest to build that killer
    Linux program (the one that makes you more money than Bill Gates has).


    # Creating Programs That Run in the Background


    You can make your Linux program one of those sneaky, stealth applications that
    quietly goes about doing its thing inside the computer while other programs are
    running. This type of program, known as a daemon (de-mon), lives'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'inside your computer somewhere and can do mischievous things. (Not really—you
    wouldn’t think of writing a program that may destroy your own computer.)


    You frequently use a daemon program to process information that doesn’t require
    the use of the keyboard or the screen. An example is a payroll program that crunched
    numbers in a database and then prints checks. No one must do anything other than
    start the program as a daemon by using the following command:


    ```

    payroll &

    ```


    You insert an ampersand (&) after the name of the program to tell your computer
    to run the program in the background. In other words, you run it as a daemon (you
    little devil).


    One problem with a daemon is that it stops running if you log off the computer.
    You can keep it running after you’re long gone by using the nohup command, following
    it with the name of the program, as in the following example:


    ```

    nohup payroll

    ```


    # ## Stopping Your Program in an Emergency


    You must keep ready to jump into action if your program goes wild. Every programmer
    experiences this situation while building a new program. During a test, the program
    keeps running and running (and sort of resembles the Energizer bunny).


    A number of problems can cause this situation—an endless loop, for example, waits
    for a response that never comes (see Chapter 12). Before you can find out what
    went wrong, however, you must stop the program.


    Don’t turn off a computer that’s running Linux to stop a program. Other things
    may be happening in the background that you must not interrupt that way. (If you
    do, your system file can get out of sync and someone—usually a system administrator—must
    reset it before you can use your computer again.) Instead, you tell the computer
    to stop your program by using the kill command.


    If you use the kill command, you must also identify the program that you want
    to stop. You know what name you gave the program, but you must also find out how
    your computer identifies it.


    You do so by running the jobs command, as follows:


    ```

    jobs

    ```'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'Running this command displays a list of all your active programs, as shown
    in the following example:


    ```

    [1] +  Running payroll

    [2] +  Running vi

    ```


    The `jobs` command shows you the status of your programs. In this example, two
    of your programs are running: `payroll` and `vi`. You use the numbers at the beginning
    of each line to identify each program. To stop a program from running, you use
    the appropriate number with the `kill` command, as follows:


    ```

    kill %1

    ```


    This example tells the computer to kill program 1. (Notice the percent sign before
    the job number. This tells the `kill` utility that the value to the right of the
    percent sign is the job number.) After Linux carries out your order, the `kill`
    command reports back to you that it stopped the program so that you can begin
    to investigate the cause of the problem, as shown in the following example:


    ```

    [1] +  Terminated payroll

    ```


    # Sharing Shell Variables


    Whenever you call a subprogram from your program, a common problem that you may
    experience is that a variable you create in your program isn''t available to the
    subprogram. Suppose, for example, that your program creates the following string
    variable:


    ```

    declare name="Bob Smith"

    ```


    You can call the subprogram that you name `payroll` from your program, as follows:


    ```

    declare name="Bob Smith"

    payroll

    ```


    The `payroll` program doesn''t know that the variable `name` exists. The reason
    is that your computer starts another shell known as a *subshell*.


    Here''s how this shell works. (And, no, it''s not under the middle one.) As you
    log on to your computer, your computer starts a shell. A *shell* is the program
    that translates your commands to your computer. For more information about shells,
    refer to Chapter 3.


    Your computer creates another copy of the shell for each program that you run.
    Guess what happens as your program runs a subprogram: Another shell starts. After
    your program or subprogram finishes running, its shell closes.'
  merge: -1
  img_proc: true
- pgno: 289
  md: "Variables that you create in each shell are *local*, which means that only\
    \ that shell can use the variables. (For more information about local variables,\
    \ refer to Chapter 4). You can make shell variables available to other shells,\
    \ however, by changing the variable to an environment variable, as in the following\
    \ example:\n\n```\nexport name=\"Bob Smith\"\n payroll\n```\n\nIn this example,\
    \ the payroll program can access the name variable. Either the program or the\
    \ subprogram can change the value of name. The change, however, affects the other\
    \ copy of the name variable. Both the program and the payroll program, for example,\
    \ can access the name variable with the value Bob Smith because the program makes\
    \ the name variable an environment variable (see Chapter 4).\n\nThe payroll program\
    \ can assign Joan Jones to the name variable that affects the name variable in\
    \ the program — that is, the value of the name variable in the program changes\
    \ to Joan Jones.\n\nThe next time that your subprogram isn't working correctly,\
    \ double-check to see whether it's using a variable that it can't access.\n\n\
    # Keeping Other People's Hands off Your Code\n\nA major weakness in a Linux shell\
    \ program is that your code is available to prying eyes and that some folks just\
    \ like to change other people's code. Anyone who has a copy of your Linux shell\
    \ program can look at your code by using vi or any other text editor, because\
    \ your Linux shell program is text — instructions that you write in English. Linux\
    \ translates it into machine language as your program reads each instruction in\
    \ itself.\n\n![](img/05279073f26be7df99b3c487360dec6a_289_0.png)\n\nThis problem\
    \ doesn't exist in most programs that you write in other programming languages.\
    \ The program starts out as text, just as your Linux shell program does, but then\
    \ a program known as a *compiler* translates the program into machine language.\
    \ You store this compiler in a file that you give to anyone who wants to run the\
    \ program. You don't, therefore, give out a copy of the code that anyone other\
    \ than real nerds can see.\n\nAlthough you can't convert your shell program into\
    \ machine language, you can make Linux prevent unauthorized persons from seeing\
    \ the code of your program by using the chmod command. You use the chmod command\
    \ to give"
