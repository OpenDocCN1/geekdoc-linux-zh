- pgno: 155
  md: 'You''re telling your computer to ask the user to enter a name and also to enter
    the number 1—or to enter the word *stop* and a number other than the number 1
    to end the program. After the person enters his name, the program greets the person.
    If the user enters the word *stop* and a number other than 1, however, the program
    doesn''t actually end. Instead, it uses the *break* reserve word to break out
    of the loop and jump to the last instruction in the program: Good-bye!


    The *continue* statement tells your program to skip the rest of the instructions
    within the loop and go directly to the top of the loop without displaying the
    greeting on-screen. After it gets there, the program checks the condition and
    decides whether to follow the instruction inside the loop again.'
