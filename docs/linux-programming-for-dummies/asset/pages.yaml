    \nfi\n\nverify Bob 555\n```\n```\n\nThe following steps describe what’s happening\
    \ in this program:\n\n+   1. The bash shell starts.\n+   2. The screen clears\
    \ of unnecessary information.\n+   3. The program calls the `verify` function.\n\
    +   4. Following the open French brace, the program compares the value of variable\
    \ `$1` with \"Bob\" and the value of variable `$2` with \"555\". `$1` is the ID\
    \ passing to the function. `$2` is the password passing to the function. \"Bob\"\
    \ is the valid ID, and \"555\" is the valid password.\n+   5. The function displays\
    \ `Verified` or `Rejected` on-screen, depending on whether the correct ID and\
    \ password pass to the function.\n+   6. Following the close French brace that\
    \ ends the function definition, the program calls the function and passes \"Bob\"\
    \ as the ID and \"555\" as the password. The function, of course, displays `Verified`.\n\
    \n# ## *Verifying the number of arguments passing to a function*\n\nA function\
    \ may get into deep trouble if the program fails to pass the function all the\
    \ information that the function needs. A function may, for example, perform a\
    \ calculation that it bases on information that the program provides. Or, in a\
    \ truly horrifying situation, it may pass your spouse’s name not but the birth\
    \ date (because you can’t remember it). Not only do you run into trouble with\
    \ Linux in such a situation, but with your spouse, too. A mistake may also occur,\
    \ however, if the program passes no information at all to the function.\n\n![](img/05279073f26be7df99b3c487360dec6a_162_0.png)\n\
    \nNever assume that information passes correctly to a function. Instead, build\
    \ commands into your function to verify the correct number of arguments that it\
    \ receives before the function processes the information. Say that your function\
    \ needs two pieces of information to pass to it as arguments, such as a first\
    \ and last name. Only the first name, however, passes to it. Unless you verify\
    \ that the correct number of arguments pass, your function assumes that the last\
    \ name also passed and tries to use the second argument. This situation can cause\
    \ an error in your program."
