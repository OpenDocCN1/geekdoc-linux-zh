- pgno: 187
  md: "+   1. The computer starts the `bash` shell.  \n+   2. The program compares\
    \ the data the user sends it to the word `yes`.  \n+   3. If the data and the\
    \ magic word match, the menu appears and the com-puter does something after the\
    \ user makes a selection.  \n+   4. If the data and the magic word don't match,\
    \ the program ends.\n\n# ## Passing Multiple Arguments\n\nA program can pass your\
    \ program (or subprogram) more than one argument from the command line. This capability\
    \ becomes very useful whenever your program requires more than one piece of information\
    \ to perform a task.\n\nSay that you write a program that displays names on-screen\
    \ — names of your friends. If you write the program to accept these names from\
    \ the command line, you can place each name on the command line, making sure that\
    \ you separate each one with a space. The space character enables your program\
    \ to recognize where one piece of information begins and the other ends. Take\
    \ a glance at the following example:\n\n```\n$ displayfriends Bob Mary Joe Sue\n\
    ```\n\nEach piece of information must appear to the right of the program name.\
    \ A space must separate each data item.\n\nYour program can use this information\
    \ by using the $1 variable (which I explain in the preceding section) with the\
    \ corresponding number of the data item, as in the following example:\n\n```\n\
    #!/bin/bash  \necho \"My friend $1\"  \necho \"My friend $2\"  \necho \"My friend\
    \ $3\"  \necho \"My friend $4\"\n```\n\nThis program shows the names of your friends\
    \ on-screen, as follows:\n\n```\nMy friend Bob  \nMy friend Mary  \nMy friend\
    \ Joe  \nMy friend Sue\n```\n\n![](img/05279073f26be7df99b3c487360dec6a_187_0.png)\n\
    \n> Knowing how to pass multiple arguments to your program and subprograms provides\
    \ flexibility to your programming. You no longer must write into the code all\
    \ the information that your program requires. Nor do you need to con-stantly prompt\
    \ the user for information. Instead, you can simply enter the information on the\
    \ command line or as your program calls a subprogram, and the information passes\
    \ to the program or subprogram."
