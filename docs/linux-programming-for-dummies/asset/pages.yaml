- pgno: 271
  md: '# # Accessing the Details


    ![](img/05279073f26be7df99b3c487360dec6a_271_0.png)


    I present only the basic information for using each utility — just enough to whet
    your appetite. You can use the man pages in the online documentation (available
    on most Linux computers) to find out the details on how to use each of these utility
    programs.


    To read everything that you can about the troff utility (which I discuss in the
    following section), for example, type the following command:


    ```

    ```bash

    man troff

    ```

    ```


    After you press Enter, Linux displays the manual pages that discuss the troff
    utility in detail.


    ![](img/05279073f26be7df99b3c487360dec6a_271_1.png)


    You enter on the command line (at the Linux prompt) all the commands that I mention
    in this chapter. So if you''re using the bash shell, your command looks as follows:


    ```

    ```bash

    $ man troff

    ```

    ```


    # # Printing Fancy Stuff: troff


    Most of the printing that you do in Linux is of the plain-Jane type. Whichever
    fonts and type sizes are available on your printer are the ones that you use for
    your document. Linux can also do all that fancy stuff that you see in Windows
    and Mac programs, such as designing page layouts and using fancy type.


    If you have a printer that offers these features, Linux can send instructions
    to your printer to make your documents look fancy. The trick is to use the troff
    utility. It interprets special codes into commands that tell the printer to use
    those fancy features.


    If you want Hello, world. to appear in 12-point type in your document, for example,
    you type the following line in the document file. (A document file is a file on
    your computer''s disk that contains the text that you want to print in your document.
    You can create this file by using a text editor such as vi or from one of your
    own programs.)


    ```

    ```bash

    .ps 12

    Hello, world.

    ```

    ```


    The .ps 12 special code tells the troff utility that, from this point on, you
    want to use 12-point size in your document. The troff utility then sends to the
    printer a printer code for 12-point size. If you want to change to another point
    size, you need to enter a different code into your document.'
  merge: -1
  img_proc: true
- pgno: 272
  md: "You use the `troff` utility to send a greeting to the printer, as follows:\n\
    \n```\n```\n troff greeting\n```\n```\n\nAnd then you change the font to Roman,\
    \ as in the following example:\n\n```\n```\n.ps 12\n.ft roman\nHello, world.\n\
    ```\n```\n\nThis example tells the `troff` utility that you want to use 12-point\
    \ size (`.ps 12`) in the Roman font type (`.ft roman`). These settings remain\
    \ in effect until you change the values by using the format commands `.ps` and\
    \ `.ft`.\n\n![](img/05279073f26be7df99b3c487360dec6a_272_0.png)\n\nKeep in mind\
    \ that using these codes in your documents involves one **major drawback**: Only\
    \ the `troff` utility reads them. Don’t forget that you use the `lp` utility,\
    \ too, to print your document (refer to Chapter 17). The `lp` utility, however,\
    \ prints all the characters that you enter into the document. The `lp` utility\
    \ doesn’t recognize, for example, that `.ps12` is a special code that it’s not\
    \ to print because you’re using the code to give the `troff` utility an instruction.\n\
    \n# ## Checking Your Spelling: `spell`\n\nFew people pose a threat to the national\
    \ spelling-bee champion’s crown, and the typical error-filled business document\
    \ proves my point. A **misspelling** is where the writer doesn’t know the correct\
    \ spelling of the word. In comparison, a **typographical error** (typo) is where\
    \ the writer knows the correct spelling of the word but inadvertently presses\
    \ the wrong key on the keyboard while typing. Most people can come up with a host\
    \ of excuses for such errors, as the following list attests:\n\n+   * “My secretary\
    \ is a poor proofreader.” (Do you even have a secretary?)\n+   * “I was in a rush\
    \ and didn’t catch that mistake.” (You read the document ten times.)\n+   * “He’s\
    \ never going to notice that it’s misspelled.” (Oh, how you wish that this one\
    \ were true!)\n+   * “She knows what I mean.” (She also knows that you *don’t*\
    \ know — how to spell, that is.)\n\nNow you have no excuse for misspellings or\
    \ typos in the documents you create in Linux unless you’re just too lazy to use\
    \ `spell`. This simple spell-checker utility reads your documents and then displays\
    \ the words that it can’t find in its dictionary file."
  merge: -1
