- pgno: 78
  md: '# Chapter 4


    # Getting Indecisive with Variables


    # In This Chapter


    +   - Understanding data

    +   - Understanding variables and values

    +   - Assigning numbers and strings to variables

    +   - Declaring data types

    +   - Making a string array


    After you know what you want your computer to do, the time is right to write Linux
    code. The place where you begin to write your Linux code is in a text editor file
    (as I explain in Chapter 3).


    Your text editor file that contains your program just tells your computer to do
    something. The simplest program that you can write tells your computer to stop
    running your program. You use only the reserved word exit in this program, as
    shown here:


    ```

    exit

    ```


    You want your programs to do more, however, than just this task. You can, for
    example, design a program to ask someone for a name and address. You also need
    to write instructions into your program to tell the computer to read this information
    and do something with it.


    In this chapter, I tell you all about how to store and use information in your
    program: You create a storage space inside your computer''s memory and then place
    your information into that space. Of course, I also tell you how to retrieve the
    information for use by your program.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Information that your program receives from someone who uses it is known as
    **data** — now you also know where the character on *Star Trek: The Next Generation*
    got his name. Good programs follow these three simple steps:

    1. They get data from the keyboard or a file.

    2. They do something with the data.

    3. They show the data on-screen or in a report.


    The reason for writing your program is to turn your computer into an electronic
    factory. In one end goes all the data that the computer needs to do something.
    And out the other end comes useful information. This information processing is
    all that a word processor, a spreadsheet, and a database program actually do.
    And the data that all these programs use manipulates only two things: *strings*
    and *numbers*, as the following sections describe.


    # ## Strings


    A *string* is usually a bunch of letters or characters that you… well, *string*
    together. A character can be a hyphen or any character that you find on the keyboard.
    A string can consist of just a *single* letter or character, too. An entire sentence
    can also be a string. And this entire chapter can be a string as well. In fact,
    any group of letters, spaces — and even numbers — can act as a string (as you
    see in the section “Variables 101,” later in this chapter).


    # ## Numbers


    A *number* can consist of any type of number, such as amounts of money, someone’s
    age or height, the number of friends who come over to your cookbook (and don’t
    invite you to their cookouts), and so on. This category includes positive and
    negative numbers as well as whole and fractional numbers.


    And, to complicate matters, numbers are also characters! This dual-identity situation
    may seem a little confusing to you, at least at first, but it isn’t so confusing
    to your computer. If you tell the computer that the number is part of an address
    or telephone number, the computer treats the number as a letter or character.
    If you tell the computer to add (or perform any mathematical operation) using
    numbers, however, the computer treats these numbers as numbers (and not as characters).
    Clear? Well, keep reading.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# A Gentle Introduction to Variables and Values


    That your computer knows how to keep track of the numbers and strings that someone
    enters into your program may seem like magic to you. Knowing that 555-55-5555
    is someone''s Social Security number is easy for you. Your computer, however,
    just recognizes it as a number or a string.


    Your program must tell your computer the following: “If someone enters 555-55-5555,
    give this number the name SSNum and then put it somewhere. But don''t forget where
    you put it. I''m going to call for it later.”


    Your program must also tell your computer when to use the Social Security number:
    “Time for the Social Security number. You remember where you put it, don''t you?
    It''s under the variable name SSNum.”


    Your program then finds the variable SSNum and copies the number so that your
    program can do something with it.


    A variable is a place in your computer that holds a value of a particular number,
    such as a Social Security number. The Social Security number that you give the
    variable name SSNum is a value. (In fact, it''s the key to all your financial,
    medical, and employment history!)


    ![](img/05279073f26be7df99b3c487360dec6a_80_0.png)


    You can think of a variable as an empty box. You can print a name on the side
    of the box to remember what you put into the box. The name on the box is like
    the name of the variable (SSNum). You can store something (a real Social Security
    number) inside the box, which is like assigning a value to the variable.


    # Variables 101


    Linux uses the following two kinds of variables:


    +   - Those you create that only your program uses: *local variables*.


    +   - Those that you or someone else creates that your program and other programs
    can use: *environment variables*.


    Whenever your program needs to save data, you create (or declare) a local variable.
    Only your own program can use this variable.


    Every time that you log into Linux, a whole bunch of variables are already available.
    These are *environment variables*. Environment variables contain'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'information that tells your computer information about you and about the computer.
    A common environment variable, for example, is EDITOR. The value that you assign
    to this variable is the name of the text editor that’s on your computer.


    # Declaring variables


    You can create a variable by using the reserved words declare and export, following
    them with the variable’s name. Here’s an example:


    ```

    declare FirstName

    export editor

    ```


    In this example, you can see the creation of the following variable:


    +   - The reserved word declare declares an environment variable.

    +   - The reserved word export makes the variable available to the environment.


    # Placing variables


    Although you find no special place in your Linux program to declare a variable,
    you can, in fact, declare a variable anywhere in your program. Placing a variable
    just anywhere, however, isn’t what most programmers consider a good programming
    practice. If you do, you’re likely to end up hunting for those variables the next
    time you read your program.


    A preferred programming practice is to declare all the variables at the beginning
    of your program. That way, they’re all in the same place whenever you need to
    find them.


    # Combining your variables


    You can declare variables of the same kind (such as two string variables) on the
    same line at the beginning of your program. The following example shows you how
    to do so:


    ```

    declare FirstName LastName

    ```


    You can type as many variable names as you can fit on the line. Notice that a
    space separates each variable.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Chapter 4: Getting Indexive with Variables


    # Naming variables


    See how easily you can locate the variables that you use in your program? You
    don''t need to search every line of the program. Simply look at the first few
    lines of your program to examine all the variables.


    You can name a variable anything that you want (and you can store anything imaginable
    in it). Naming a variable SSNum and then shoving some telephone number in it,
    however, just doesn''t make much sense.


    Make programming Linux easy for yourself: Give names to your variables that tell
    someone (you, for example) exactly what kind of data you''re stuffing in them.
    Naming a variable SSNum seems right only if you intend to place a Social Security
    number in the variable — just as you want a variable that you designate FirstName
    to hold the characters in someone''s first name.


    Following are some rules to keep in mind as you name your variables. All variable
    names must ...


    +   1. Begin with a letter.

    +   2. Consist of only letters (upper- or lowercase), numbers, and the underscore
    character (_).

    +   3. Have no spaces.


    Of course, you can''t use a reserved word as a variable.


    Linux gives you no problems at all if you follow these rules in naming variables.
    (Although you may find that it doesn''t like other parts of your program!) Following
    are some examples of variable names that make Linux happy:


    +   • DeptNo

    +   • Fax_Num

    +   • Acct573


    Following are some examples of variable names that make Linux choke:


    +   • First Name (Spaces are forbidden.)

    +   • 573Acct (The first character must be a letter.)

    +   • exit (Reserved words also are forbidden.)'
  merge: -1
  img_proc: true
- pgno: 83
  md: "# Testing your programming knowledge\n\n+   1. What does the following Linux\
    \ command do?\n+      declare street city state zip\n+      a. Gives words to\
    \ the quarterback to shout before he hikes the ball.\n+      b. Declares four\
    \ variables.\n+      c. Tells the computer where the user lives.\n+      d. Stuffs\
    \ the entire set’s address into variables.\n\n+      c. To tell the computer to\
    \ reserve space to store a certain type of data.\n+      d. To make sure that\
    \ your program has data it can use.\n\n   Answers: 1) b. See \"Declaring variables.\"\
    \ 2) c. See \"Declaring variables.\"\n\n+   2. What’s the purpose for declaring\
    \ variables?\n+      a. So that you can keep your data secret from hackers.\n\
    +      b. To add a touch of royalty to your program: I declare you a variable!\n\
    \n# Assigning numbers to variables\n\nAfter you create a variable by naming it,\
    \ you probably want to stuff something into the variable. This action is known\
    \ as *assigning a value* to the variable.\n\nTo assign a value to a variable,\
    \ you must use a super-complex, scientific gizmo that requires you to earn at\
    \ least a master’s degree in computer science from MIT (Just joking). All you\
    \ need to know is how to use the equal (=) sign and the reserved word let, which\
    \ tells the computer to assign a particular value to a particular variable.\n\n\
    The following example shows you how to stuff a value into a numeric variable that\
    \ I call MySalary. Instead of yelling at your computer to “Put the number one\
    \ million in my salary variable,” you just write the following:\n\n```\nlet MySalary=1000000\n\
    ```\n\nYou begin with the reserved word let, following it with a space and the\
    \ numeric variable. Then you enter the equal sign and the value that you want\
    \ the variable to possess. (Watch that you don’t put any spaces before or after\
    \ the equal sign.)"
