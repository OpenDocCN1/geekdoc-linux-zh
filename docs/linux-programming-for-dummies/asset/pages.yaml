- pgno: 150
  md: "# Test your programming knowledge\n\n+   1. What's the limit to the number\
    \ of loops that you can nest in a program?\n+   \n+   a. 255\n+   \n+   b. 256\n\
    +   \n+   c. You have no limit regarding the number of loops that you can nest\
    \ in a program.\n+   \n+   d. A number equal to the number of lines in your program.\n\
    +   \n+   2. How can you make nested loops easier to read?\n\na. Insert a blank\
    \ line between lines in the program.\n\nb. Use a separate piece of paper for each\
    \ loop.\n\nc. Indent each loop within the block of code.\n\nd. Reduce the number\
    \ of characters that you place on a line.\n\nAnswers: 1) c. See “Using Nested\
    \ Loops.” 2) c. See “Indenting Nested Loops.”\n\nTake a look at the following\
    \ code, for example, and notice how difficult picking out the nested loops is:\n\
    \n```\nlet flag=1\nwhile [ “$flag” -eq 1 ]\ndo\nfor friend in Bob Mary Sue\necho\
    \ “Hello $friend .”\nlet counter=1\nwhile [ “$counter” -lt 4 ]\ndo\necho “$friend”\n\
    let counter=“$counter + 1”\ndone\ndone\necho “Good-bye!”\nlet flag=0\ndone\n```\n\
    \nNow, take a look at the same code where I indent the nested loops. Notice that\
    \ identifying the nested loops is much easier in the following example:\n\n```\n\
    let flag=1\nwhile [ “$flag” -eq 1 ]\ndo\n    for friend in Bob Mary Sue\n    \
    \    do\n            echo “Hello $friend .”\n            let counter=1\n     \
    \       while [ “$counter” -lt 4 ]\n```"
