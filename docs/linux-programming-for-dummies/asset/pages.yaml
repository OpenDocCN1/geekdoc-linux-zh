- pgno: 111
  md: '# In this part . . .


    Our program contains many instructions for the computer. Simply stated, programs
    contain a list of instructions that the computer follows one after the other.


    But what if your computer needs to follow some of those instructions only if a
    particular condition exists? For this situation, you must tell the computer to
    make a decision.


    Your computer''s decision-making capability enables you to build complex programs
    that further enable your computer to perform mundane tasks that you''d otherwise
    get stuck doing.


    In this part, you find out how to instruct your computer to make decisions.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Chapter 7

    # The if, if else, and if elif Statements


    # In This Chapter


    +   - Specifying a condition

    +   - Using the `if` statement

    +   - Using the `if else` statement

    +   - Using the `if elif` statement


    Decisions, decisions, decisions. We''re always asked to make decisions. Where,
    for example, do you want to go on vacation? To my mother''s or to Hawaii?


    Some decisions are obvious choices, but you base even those no-brainers on *prevailing
    conditions*: Do we have enough money for a trip to the islands? And if conditions
    aren''t right, even the most desirable choice is just a memory. (It''s Mom''s
    again this year.)


    Linux programming also can make decisions by checking conditions and then reaching
    a conclusion.


    In this chapter, I show you how you can have your program make decisions for you
    based on information your program receives from the keyboard or from a file.


    # ## Conditions


    A *condition* is a situation that must exist or must not exist. If the condition
    exists, the condition is true; otherwise the condition is false.


    You either have enough money for the trip to Hawaii . . . or you don''t. You have
    no room for an almost enough money condition. In Linux, a condition takes the
    form of the following:


    +   - A single variable

    +   - An expression'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Say that you have all your money in your wallet. We can call the variable *wallet*
    and the value of the variable is thus the *amount of money* that you have in your
    wallet. So do you have enough money for the trip to Hawaii? Look in your wallet.
    You say that you don’t have much money in it? You’re broke! The value of the wallet
    variable, therefore, is zero — which means that you don’t have enough money for
    the trip. The condition is false.


    Say, however, that you have a good deal of money in the wallet. Is it enough money
    for the trip? You ask yourself whether the amount of money in the wallet is equal
    to or greater than $10,000 (the amount that you need for the trip). This question
    is an *expression* that results in either a true or false answer.


    # The condition as a single variable


    The value of a single variable must be either *true* or *false*. You represent
    a *true* value as a *nonzero* value; a *false* value is a *zero* value. Following
    are two ways to determine whether the value of a variable is either true or false.
    The first method is to explicitly check the value of the variable, as in the following
    example:


    ```

    if [ $#HaveEnoughMoney -eq 1 ]

    ```


    Your program checks whether the value of the variable is true or false by using
    the equal operator (-eq).


    If you can have your program check whether a condition is true, you can also have
    your program check whether the value of the variable is false, as in the following
    example:


    ```

    if [ $#HaveEnoughMoney -ne 0 ]

    ```


    The -ne (not equal) operator tells your program to reverse the logic. If you use
    the -eq operator, your program checks whether the variable is true. Place the
    -ne operator in the expression, and your program checks whether the variable is
    not true, which is false.


    # The condition as an expression


    A condition can also be an *expression*. An expression tells your program to perform
    an operation on information. You can ask the program to check whether the value
    of a variable — your bank balance, for example — is more than a specific amount.
    In this case, the result of an expression is either true or false, as shown in
    the following example:


    ```

    if [ $#BankBalance -gt 3000 ]

    ```'
  merge: -1
  img_proc: true
- pgno: 114
  md: "# Other operators useful for testing a condition\n\nWhenever you need to tell\
    \ your program to check whether a condition is true or false, you need to create\
    \ an expression that uses an appropriate operator. Following is a list of the\
    \ operators that you can use to test conditions in your program. These operators\
    \ are for integers and for strings.\n\n+   - -gt\tGreater than\n+   - -ge\tGreater\
    \ than or equal to\n+   - -lt\tLess than\n+   - -le\tLess than or equal to\n+\
    \   - -eq\tEquals\n+   - -ne\tDoes not equal\n\nYour program checks to see whether\
    \ the value of BankBalance is greater than 3000. This expression results in one\
    \ of two possible values: true or false. A bank balance greater than 3000 means\
    \ that the expression is true (and the trip is on); otherwise, the expression\
    \ is false.\n\n# REMEMBER\n\nAn expression that contains a string can also be\
    \ either true or false. In the following example, your program determines whether\
    \ the variable GoingToHawaii contains the string Yes. If the string exists, the\
    \ expression is true; otherwise, the expression is false.\n\n```\nif [ $GoingToHawaii\
    \ = -eq \"Yes\" ]\n```\n\n# The if Statement\n\nYou use an if statement whenever\
    \ you need your program to check whether a condition is true or false. An if statement\
    \ simply tells your program that \"If the condition is true, follow these instructions;\
    \ otherwise, skip these instructions.\"\n\nA true condition causes your program\
    \ to follow a set of instructions. A false condition causes your program to ignore\
    \ that set of instructions.\n\nCut to the chase and see how this all comes together\
    \ in the following example:\n\n```\nif [ Condition ]\nthen\nInstruction\nfi\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 115
  md: "# Part III: Making Decisions\n\nBasically, you're telling your program to follow\
    \ the **Instruction** if a certain **Condition** exists — meaning that the **Condition**\
    \ is *true*.\n\nThe **Condition** must always be *true* or *false*.\n\nFollowing\
    \ are some real-life examples. The first one tells your program to check whether\
    \ the box is full. The box can hold only 100 cookies (something dear to my stomach).\n\
    \n```\nif [ $Quantity -eq 100 ]\nthen\n echo \"The box is full.\"\nfi\n```\n\n\
    This statement tells your program to look at the variable **Quantity** and decide\
    \ whether the value is 100 cookies. If that's true, your program displays the\
    \ following message on-screen:\n\n```\nThe box is full.\n```\n\nIf the value isn't\
    \ 100 cookies, however, your program skips this instruction and moves to the instruction\
    \ that follows the **fi**. This **fi** is a reserved word that has a special meaning\
    \ to your program (because it ends the **if** statement).\n\nTry another example.\
    \ In this case, your program must check to determine whether the box is full and\
    \ check to see whether any sufficient boxes are available. Both conditions must\
    \ be true for your program to report back that you can't package any more cookies.\n\
    \n```\nif [ $Quantity -eq 100 ] && [ $AvailableBoxes -lt 1 ]\nthen\n echo \"The\
    \ box is full and you have no more boxes.\"\nfi\n```\n\nThis statement tells your\
    \ program to look at the variable **Quantity** and decide whether the value is\
    \ 100 cookies. Your program also looks at the variable **AvailableBoxes**, to\
    \ see whether its value is less than 1. If both conditions are *true*, your program\
    \ displays the message **The box is full and you have no more boxes**, on-screen.\n\
    \nIf the value isn't 100 cookies, however, and boxes remain, your program skips\
    \ this instruction and moves to the instruction that follows the **fi** reserved\
    \ word.\n\nYou can place a bunch of instructions within the **if** statement;\
    \ your program obeys these instructions only if the condition is true."
  merge: -1
  img_proc: true
- pgno: 116
  md: "The `if` statement enables your program to make a decision dependent on a condition\
    \ and then to follow a specific set of rules if the condition is true.\n\nA problem\
    \ with using the `if` statement is that you may need to provide another set of\
    \ instructions for the program to obey if the condition is false. You can use\
    \ another `if` statement and tell your program to follow the other set of instructions\
    \ if the condition is false. But another way is easier! Use something known as\
    \ an `if else` statement. Following is the easiest `if else` statement:\n\n```\n\
    ```\nif [ Condition ]\n    then\n        Instruction1\n    else\n        Instruction2\n\
    fi\n```\n```\n\nThis statement tells your program to obey the first group of instructions\
    \ if the Condition is true . . . but to obey the second group of instructions\
    \ if the Condition is false.\n\nHere’s a pop quiz to see whether you’re paying\
    \ attention: How do you modify the following instructions to tell your program\
    \ to display the message The box is not full.?:\n\n```\n```\nif [ $Quantity -eq\
    \ 100 ]\n    then\n        echo \"The box is full.\"\nfi\n```\n```\n\nYou can\
    \ modify this statement in two ways. Each method depends on how you express the\
    \ condition. If you leave the condition unchanged, you get the following:\n\n\
    ```\n```\nif [ $Quantity -eq 100 ]\n    then\n        echo \"The box is full.\"\
    \n    else\n        echo \"The box is not full.\"\nfi\n```\n```\n\nYou can, however,\
    \ use the condition `$Quantity -ne 100` to get the following:\n\n```\n```\nif\
    \ [ $Quantity -ne 100 ]\n    then\n        echo \"The box is not full.\"\n   \
    \ else\n        echo \"The box is full.\"\nfi\n```\n```"
  merge: -1
  img_proc: true
- pgno: 117
  md: "# Part III: Making Decisions\n\nFeel free to use either type of the if else\
    \ statements. Both are acceptable, and the one you decide to use is up to your\
    \ preference.\n\nYou can place a whole bunch of instructions between the expression\
    \ and else reserved word and another whole bunch between the else and fi reserved\
    \ words. The following example shows how the on-screen messages expand if you\
    \ place more instructions between them:\n\n```\n```shell\nif [ Quantity -ne 100\
    \ ]\nthen\n\techo \"The box is full.\"\n\techo \"Sorry, you need to stop.\"\n\
    else\n\techo \"The box is not full.\"\n\techo \"Keep going!\"\nfi\n```\n```\n\n\
    # ## The if elif Statement\n\nBe careful! Your program blindly follows your instructions\
    \ if the condition is false. Your program obeys the second bunch of instructions\
    \ without asking a question. Sometimes you don’t want this blind obedience to\
    \ happen. Instead, you want your program to make another decision before following\
    \ the second bunch of instructions.\n\nYou can have your computer make another\
    \ decision by using the if elif statement. This statement looks confusing at first\
    \ but is fairly easy to understand after you get used to it. Following’s a simple\
    \ if elif statement:\n\n```\n```shell\nif [ Condition1 ]\nthen\n\tInstruction1\n\
    elif [ Condition2 ]\nthen\n\tInstruction2\nfi\n```\n```\n\nIn this statement,\
    \ your program obeys the first group of instructions if Condition1 is true. If\
    \ Condition1 is false, however, your program determines whether Condition2 is\
    \ true. If Condition2 is true, your program obeys the second group of instructions.\
    \ If Condition2 is false, your program skips the second group of instructions.\n\
    \nWhenever you use the if statement, your program obeys at least one group of\
    \ instructions. If you use the if elif statement, however, you always face a chance\
    \ that your program may skip both groups of instructions. Following’s an example:"
  merge: -1
  img_proc: true
- pgno: 118
  md: "# Chapter 7: The if, if else, and if elif Statements\n\n```\n```\nif [ $Quantity\
    \ -eq 100 ]\nthen\n    echo \"The box is full.\"\nelif [ $Quantity -eq 95 ]\n\
    then\n    echo \"You can add 5 cookies to the box.\"\nfi\n```\n```\n\nSo what\
    \ happens if the value of Quantity is 95 in the preceding example? Your program\
    \ determines the value of the first condition and sees that the expression $Quantity\
    \ -eq 100 is false.\n\nThen your program determines the value of the second condition\
    \ and sees that the expression $Quantity -eq 95 is true, so your program displays\
    \ the message: You can add 5 cookies to the box.\n\nBe careful as you answer this\
    \ question: What happens if the value of Quantity is 94?\n\nYour program checks\
    \ the first condition $Quantity -eq 100 and determines that the expression is\
    \ false. Your program ignores the first bunch of instructions. Your program then\
    \ checks the second condition $Quantity -eq 95. This expression, too, is false.\
    \ Your program ignores the second bunch of instructions.\n\nYour program reaches\
    \ the end of the if elif statement. None of the conditions are true, so your program\
    \ doesn't obey any instructions!\n\n# Making multiple choices with if elif\n\n\
    You can have your program handle multiple possibilities by having more if elif\
    \ conditions in your program to check the additional conditions. Following is\
    \ the simplest way to use multiple if elif conditions:\n\n```\n```\nif [ Condition1\
    \ ]\nthen\n    Instruction1\nelif [ Condition2 ]\nthen\n    Instruction2\nelif\
    \ [ Condition3 ]\nthen\n    Instruction3\nfi\n```\n```\n\nIn this statement, you're\
    \ telling your program to obey the first group of instructions if Condition1 is\
    \ true. If Condition1 is false, however, your program determines whether Condition2\
    \ is true. If Condition2 is true, your program"
  merge: -1
  img_proc: true
- pgno: 119
  md: "obeys the second group of instructions. If `Condition2` is false, your program\
    \ determines whether `Condition3` is true. If `Condition3` is true, your program\
    \ obeys the third group of instructions — or, otherwise, skips the third group\
    \ of instructions.\n\n> Watch out! All the conditions can be false, so your program\
    \ may not obey any of the instructions within the if\\_elif statement.\n\nCaution!\
    \ The more if\\_elif lines that you use in your program, the more confusing it\
    \ becomes to read the entire if\\_elif statement. (It can prove worse than reading\
    \ the instructions for filling out your taxes — unless, of course, you like jumping\
    \ around the instruction booklet.)\n\n# Making sure that Linux follows at least\
    \ one group of instructions\n\nImagine having a gigantic if\\_elif statement only\
    \ to find out that your program obeys no instructions. This sort of thing can\
    \ happen in real life. You can avoid such a disaster by placing a ff\\_elif statement\
    \ at the end of the if\\_elif statement. Following's a sample:\n\n```\n```text\n\
    if [ Condition1 ]\nthen\n    Instruction1\nelif [ Condition2 ]\nthen\n    Instruction2\n\
    elif [ Condition3 ]\nthen\n    Instruction3\nelif\n    Instruction4\nfi\n```\n\
    ```\n\nIn this statement, you're telling your program to obey the first group\
    \ of instructions if Condition1 is true. If Condition1 is false, however, your\
    \ program determines whether Condition2 is true. If Condition2 is true, your program\
    \ obeys the second group of instructions. If Condition2 is false, your program\
    \ determines whether Condition3 is true. If Condition3 is true, your program obeys\
    \ the third group of instructions — otherwise, your program obeys the fourth group\
    \ of instructions."
  merge: -1
  img_proc: true
- pgno: 120
  md: '# **Test your programming knowledge**


    **1. How many instructions can you place within an if statement?**


    +   a. 24.

