- pgno: 148
  md: '# Chapter 12


    # Nested Loops and Quick Exits


    # In This Chapter


    +   - Using nested loops

    +   - Indenting nested loops

    +   - Avoiding pitfalls in nested loops

    +   - Using the break statement for a quick exit

    +   - Skipping over code by using the continue statement


    Remember when Mom told you to clean up your toys? After complaining—which never
    did any good—you picked up the first toy and dropped it in the toy box. You repeated
    this action over and over again. Among those toys, however, were dozens of blocks,
    and you needed to place each one in the canister that the blocks came in before
    you could put the canister into the toy box.


    Picking up toys is the *outside loop*, and picking up blocks is the *inside loop*
    in this example. You can jam loops inside other loops to form an endless series
    of loops known as *nested loops*. Nested loops make your program better organized—although
    they complicate things a bit more for you in reading the program.


    In this chapter, I show you how to make your program more efficient by creating
    nested loops. (See Chapters 10 and 11 for more information about loops.)


    # Using Nested Loops


    A nested loop tells the program to do something a number of times (the inside
    loop) for each time around the outside loop. The following block of code contains
    a nested loop:


    ```

    let flag=1

    while ["flag"::1]

    do

    for friend in Bob Mary Sue

    ```'
