  md: '# # Passing the subject


    You want to give every e-mail a subject line that alerts the reader about the
    message that the e-mail contains. You can, of course, always exclude the subject
    and thus keep the reader in the dark about the e-mail message until he reads it.


    Being the nice person that you are, however, you probably want to include a subject,
    and you can do so by passing the text of the subject to the program as a command-line
    value. Just follow these steps:


    +   1. Display the e-mail program in vi.

    +   2. Modify the program from the section "Passing the blind-copy address," earlier
    in this chapter, as follows:


    ```

    ```

    #!/bin/bash

    Mail → $ bob@mycomputer < memo|

    ```

    ```


    +   3. Save the program by pressing Enter and then using the Shift+ZZ key combination,
    as I describe in the section "Passing the blind-copy address," earlier in this
    chapter.

    +   4. Type the program’s name at the command prompt and follow it by the subject,
    making sure that you include quotations around the subject, as shown here (remembering
    that the program is already executable because you use the same program in earlier
    sections):


    ```

    ```

    mailprogram ''Good News''

    ```

    ```


    The following steps describe what’s happening in the preceding steps:


    +   1. Linux runs the bash shell first (#!/bin/bash).

    +   2. Next, Linux substitutes Good News for the $1. (Good News is the subject.)

    +   3. Finally, Linux calls the mail utility and then sends the memo| message
    to bob@mycomputer with the subject of Good News.


    # # Passing Multiple Arguments to an E-Mail Program


    Writing your own e-mail program enables you to build in flexibility that you don’t
    find by simply using the mail utility that Linux provides. Your own programs generally
    prove more flexible because you can probably think of different ways that you
    want an e-mail program to perform than are available in the Linux mail utility.'
