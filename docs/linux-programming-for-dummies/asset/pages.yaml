- pgno: 253
  md: 'By using a variable, however, you can easily change the message without changing
    the program. (Chapter 4 contains lots of juicy material on variables.) Say that
    I create a program to send e-mail messages to my friends. Each time that I run
    the program, I want to send a different message. I pass the name of the file that
    contains the message to the program each time I run the program. I include information
    and the name of the program by using the $1 special variable at the command prompt.


    Inside your program, you can use the argument variable $1 to represent the name
    of the file that contains the message that you want to e-mail to your friends.
    Say that I want to send my friends a message that I keep in the file mysecret
    and I call my program myfriends. I type myfriends mysecret at the command line.
    As you run my program, you place the filename beside the program name on the command
    line. Every time that Linux sees $1 in your program, Linux replaces the $1 with
    the file’s name. In my example, mysecret replaces $1 in my program. Just follow
    these steps:


    +   1. Display the mailprogram in vi by typing the following and pressing the
    Enter key:


    ```

    vi mailprogram

    ```


    +   2. Make your program look as follows by typing these commands into your program.


    These instructions start the Bash shell and then calls the mail utility to send
    an e-mail to Bob. Good News is the subject line of your message:


    ```

    #!/bin/bash

    mail -s "Good News" bob@mycomputer < $1

    ```


    +   3. Save your changes by pressing the Esc key and then pressing and holding
    the Shift key as you type ZZ.


    +   4. At the command prompt, type the following to make the program an executable
    program:


    ```

    chmod 711 mailprogram

    ```


    +   5. Whenever you’re ready to run the mailprogram, type the following at the
    command prompt and press Enter:


    ```

    mailprogram memo1

    ```


    Here’s what the program’s going to do: By typing mailprogram memo1, you’re telling
    Linux two things. First, you want to run the program mailprogram. Next, you want
    to pass the mailprogram a value you call memo1. The geeks call this procedure
    passing the program an argument. (I don’t know why, because Linux rarely complains
    about the value that you pass to the program.)'
