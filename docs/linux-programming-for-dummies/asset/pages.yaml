- pgno: 47
  md: '# A short history of user interfaces


    A long time ago, back when the ''57 Chevy was new, computers weren''t friendly.
    Programming a computer to do *anything*, in fact, was a downright dreadful task.
    You sat in front of a bunch of cables and a computer full of holes and then plugged
    the correct cable into the correct hole, in much the same way as telephone operators
    do in those old movies.


    Someone must have gotten electrocuted somewhere along the line, because by the
    time Eisenhower was moving out of the White House (during the 1960s, for those
    of you who weren''t born yet), computer technicians eliminated the task of plugging
    in wires. Paper, in the form of cards that resembled index cards, took the place
    of cables. Each task that you wanted the computer to perform you represented by
    marking one of these *punch cards* with a series of holes. (You could indicate
    only one task per card.) In the final step, someone needed to stack thousands
    of the punch cards in a precise order and then feed them into the computer.


    By the time the Nixen era was winding down (during the 1970s — yes, this sidebar
    has a history quiz in disguise), someone came up with a bright idea: Get rid of
    punch cards! At the moment that this brilliant person decided to use a keyboard
    and a television monitor to teach the computer to perform tasks, the modern-day
    user interface was born. After you turned on a computer, a blinking dot (and nothing
    else) appeared on-screen. The dot implied that the computer was ready for its
    first command — no menus or instructions appeared on-screen. You had to know that
    the appearance of the blinking dot meant that it was time to type a computer instruction
    on the keyboard. This command-line interaction appeared whenever the DOS prompt
    came on-screen. To get a computer to do *anything*, however, you needed to know
    the correct command to give to the computer (and how to spell the command correctly
    as well).


    During the 1980s (the history quiz is over), as programmers transformed sparse
    screens into groups of choices that users needed to make, programs became *menu
    driven*. Some smart people (and you can soon join their ranks) developed programs
    that seemed to demonstrate the best way to show menus on-screen.


    Great! An easy way for anyone to use a program — except that no two programs worked
    the same way. Some brighter programmers set out to fix this problem (and made
    about a billion dollars) by throwing away the old computer manuals and making
    way for the *GUI*, or graphical user interface.


    No, Bill Gates didn''t invent the GUI. Many programmers and companies, including
    Xerox and Apple Computer, had a hand in creating it. Gates just had the marketing
    clout to make the GUI popular.


    Linux''s basic user interface hasn''t progressed much beyond the command-line
    interface, because most Linux *whiz kids* are hackers who are comfortable with
    working with the command line.


    Linux does have the GUI world look, through add-on software such as X Windows
    and Mobt, which are the forerunners of Windows.


    The Linux shell-script language provides all the commonly used parts of a typical
    Linux program — display information, read the keyboard, and do something with
    the information read from the keyboard. A user just must use the right words in
    the shell-script language to provide the correct instructions to the computer.'
  merge: -1
  img_proc: true
- pgno: 48
  md: "You can perform in your Linux programs virtually any task that one of those\
    \ fancy Windows or Mac user interfaces can do. Linux doesn’t use *fancy* menus,\
    \ but it does use menus. It displays no fancy scroll lists, for example, but it\
    \ can display a list of on-screen options from which users can make selections.\
    \ (Who needs all that window dressing anyway? Most users just want to get the\
    \ job done.)\n\n# ## Planning What You Want Users to Do\n\nAh, where to begin?\
    \ Start with the old-style computer if you want — paper and pencil. (You never\
    \ need to upgrade it, and it works even without electricity.) Then draw a picture\
    \ of what you want users to see and do as they use the Linux program that you\
    \ create.\n\nHere are the steps to follow:\n\n+   1. Know what you want the program\
    \ to do before you set out to design the user interface.\n+   2. Pretend to be\
    \ a person who’s going to use your program.\n+   \n+   Pretend that you have no\
    \ information about the program except perhaps its name and a general idea of\
    \ how the program can help you.\n+   3. List on paper the menu selections that\
    \ you want to enable users to make after your program begins.\n+   4. For each\
    \ possible user selection, list what you want the computer to do after a user\
    \ chooses that option.\n\nThis following list, for example, shows the first task\
    \ (and related subtasks) that a user must perform:\n\n+   1. Opening screen\n\
    +   \n+       a. Locate telephone number\n+   \n+       Enter telephone number\n\
    +   \n+       Display telephone number\n+   \n+       Change telephone number\n\
    +   \n+       Return to preceding menu\n+   \n+       Exit\n+   \n+       b. Change\
    \ entry\n+   \n+       Enter telephone number\n+   \n+       Display telephone\
    \ number\n+   \n+       Change telephone number"
  merge: -1
  img_proc: true
- pgno: 49
  md: '+   Cancel preceding change

    +   Return to preceding menu

    +   Exit

    +   c. Add new entry

    +   Enter new information

    +   Cancel new information

    +   Return to preceding menu

    +   Exit


    Don''t be afraid to make a mistake. (That''s why they make pencil erasers.) The
    only way that you can perfect your programming skills is by trial-and-error (and
    you may end up on Court TV).


    The more that you use paper and pencil to create a plan, the easier translating
    your perfect set of planning notes into a full-scale Linux program becomes. After
    you finish your plan, you can concentrate on getting the computer to do what you
    want.


    # Planning What You Want the Computer to Do


    The whole purpose of a computer is to do more than anyone who uses the computer
    must do. (That''s to say that users, ideally, are to do little to perform a task,
    while computers do most of the work!) That''s the concept behind computer automation:
    Your program displays options on-screen and asks users simply to press the corresponding
    key on the keyboard for whatever task they want the computer to perform.


    A computer must know what to do both before and after users of a Linux program
    make menu selections from the keyboard. The following list shows just some of
    the tasks that you, as a programmer, must consider ahead of time for any computer
    that runs one of your programs. Your Linux program must be capable of performing
    the following tasks:


    +   - **Run the correct shell for your program:** Because you write Linux programs
    in a shell language (the C shell, for example — but no seashore jokes, please),
    the computer must have the correct shell running so that your program can work.

    +   - **Do a little “housekeeping”:** The computer needs to clear the screen of
    any text that appears on-screen so that it doesn''t confuse the user of your program.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '+   ▸ **Display text on-screen:** The computer must display each line of text
    on-screen in the correct order. (The text is a combination of labels, choices,
    and instructions.)

    +   ▸ **Take a breather:** The computer simply waits until the user presses a
    key on the keyboard.

    +   ▸ **Decide what to do after the user presses any key.** (Don''t go looking
    for the *any* key on your keyboard — you don''t have one.)

    +   ▸ Determine which keyboard keys to respond to and what to do after the user
    presses those keys.

    +   ▸ **Ignore some keys if they aren''t the valid keys that the user can press
    to make a selection.**

    +   ▸ **Decide whether to erase what''s on-screen after the user presses one of
    the allowable keys.**

    +   ▸ **Do something special:** Show other choices on-screen, for example, or
    find some information and display it.

    +   ▸ **Remove all the text that the user places on-screen:** Clean up your mess
    so that another program (or someone''s mother) doesn''t need to do it for you.


    # ## Designing the Screen Layout


    After you plan what you want your Linux program to do (as I describe in the preceding
    section), you need to decide how the screens for your programs are to look. I
    suggest that you sketch out each screen that you want your program to display
    to users.


    First, come up with a title or some words that generally describe the screen.
    A single line of text at the top of the screen is sufficient.


    The content of the rest of the screen depends on what the computer is doing as
    it''s showing the screen. Following are some common uses for screen displays:


    +   ▸ Display an appropriate message to users.

    +   ▸ List menu options.

    +   ▸ Provide information, such as names and addresses in a file.

    +   ▸ Collect user information.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Part I: A Beginner''s Introduction to Linux Programming


    # Understanding what menus do


    All of us, at some point, have chosen items from menus, regardless of whether
    those menus were part of those frustrating telephone-answering systems (“Press
    1 if you want the sales department; press 2 if you want the complaint department”)
    or appeared on a computer screen.


    Some reasons for using menus in computer programs are obvious, as the following
    list shows:


    +   - Menus offer an easy way for users to tell a computer what they want it to
    do.

    +   - Menus restrict a user to a specific task so that the programmer (you) can
    focus on giving the computer the correct instructions necessary to carry out a
    task.

    +   - Menus show only tasks that the user can perform immediately. Tasks not appropriate
    for the current activity aren’t available. You can’t ask a computer program to
    change a telephone number, for example, until you first tell it to find the number
    in a telephone directory.


    # Maintaining consistency


    All of us are creatures of habit. We wake up at approximately the same time every
    day, arrive at work on schedule, grab a cup of coffee, and then arrive at home
    like clockwork to get ready for a repeat performance the following day. (Some
    of us also need to get a life!)


    Each of us is generally consistent, and so are all the other people we depend
    on, such as spouses, the people who make our coffee, the local dry cleaner who
    makes sure that our clothes look sharp, and so on.


    Just as people are usually consistent, they usually want the programs they use
    after arriving at their workplace to be consistent, too. Most people like to jump
    right into a program and put the computer through its paces — no one usually can
    spare the time to learn how to use a program. Such quick starts are possible only
    if the way that someone uses one program is the same way as that person uses all
    other programs.


    If users must ponder for more than a few minutes about how to use a computer program,
    they usually give up and decide that the program is junky (but they normally use
    words that I can’t repeat in a family book).'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'How do you prevent users from tossing your programs into the garbage can? You
    must make the user interface in your programs consistent with those of similar
    programs. Don''t get too creative, or you may confuse someone who''s using your
    program for the first time.


    # ## *Choosing your words carefully*


    The words that you use on-screen in your programs are critical to the design of
    a quality user interface. If users don''t understand the terms you use, they can''t
    use your program.


    Following are some tips you may find useful in making your programs communicate
    effectively with the people who use them:


    +   - **Avoid using abbreviations and acronyms (words that you form from the first
    letter of multiple-word phrases).** Don''t, for example, tell users to "Take the
    EXE and send it via FTP so that your OS can take it from there."

    +   - **Make sure that the words you use to describe an option reflect precisely
    what happens after a user chooses that option.** Don''t name an option *Edit*,
    for example, if *Edit An Address* more accurately describes what the option does.

    +   - **Use simple words that are easy to understand.** Don''t show off your vocabulary
    in designing a computer program.


    The following example demonstrates a typical opening menu for a personnel database
    program:


    ![](img/05279073f26be7df99b3c487360dec6a_52_0.png)


    The first line specifies that only authorized staff members can use the program.
    The second line simply tells users that this program is a personnel program.


    The first user option, *Display information about an employee*, starts the user
    down the path toward locating and changing information about an employee. The
    screen that appears if users choose this option displays the'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'employee information and asks whether they want to edit the information or
    delete the employee''s name from the database, as shown in the following example:


    ```

    Confidential Personnel Information

    Bob Smith       Social Security #: 555-55-5555

    555 Any Street    Title: Office Manager

    Anywhere, USA 55555  Start Date: 1/2/89


    Department: Administration   Salary: $75,000


    1. Edit Information

    2. Delete Information

    Q Quit


    Enter your selection:

    ```


    The second option from the original example, Add information about a new employee,
    sends users down a different path, from which they can enter into the database
    some information about a new employee.


    The last user option is the escape hatch: If users don''t want to continue with
    the program, they can just press Q to quit the program.


    Finally, a single line of instruction tells the user to make a selection.


    # ## Keeping your menu tree pruned


    Don''t you hate spending more time choosing items from menus than actually using
    a program? Now you get the opportunity to fix that problem in the programs that
    you create by minimizing your program''s *menu tree*, or list of menus.


    No magic number exists for the number of menus to put in a program. Try using
    just a few menus and then asking a friend to test your program. If that person
    becomes discouraged trying to navigate through your menus, you know that you have
    too many. Take out your tree pruner and trim some of the branches on your menu
    tree.


    Because someone who uses your Linux program wants to do something other than just
    respond to your perfectly designed menus, each menu must address all possible
    tasks that a user may want to accomplish. After your program finds an address
    and displays it on-screen, for example, a user can modify the address, delete
    the address from the file, return to the preceding menu, or just leave your program.


    If users decide to modify the information that''s on-screen, you don''t need to
    ask which piece of information they want to edit — that''s obvious. A better idea
    is to enable *the user* to change the information.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# **Testing your programming knowledge**


    +   1. What are the two common parts of a user interface?

    +       a. Pizza and a Coke.

    +       b. Menus that everyone can understand and instructions to help someone
    out in a pinch.

    +       c. The telephone and telephone numbers.

    +       d. A computer manual close at hand and a lot of patience.


    +   2. What''s the most commonly available tool to use in designing a user interface?

    +       a. A jig saw.

    +       b. Someone else''s idea that you can copy.

    +       c. A pencil and some paper.

    +       d. A jackhammer (not for use at night).


    Answers: 1) b. See “Designing the Screen Layout.” 2) c. See “Planning What You
    Want the Computer to Do.”


    As you plan your Linux program menus, keep in mind all the times that you''ve
    needed to step your way through one of those telephone menus (for example, “Press
    1 if you want to shoot the person who designed this system. . . .”). You''re the
    programmer who can make someone happy by guaranteeing that your menus are easier
    to use than those telephone menus.


    # **Remembering that flexibility lowers frustration**


    The best type of program is one that works the same way that the user works. Because
    each user works a little differently from every other user, you must keep your
    Linux programs flexible so that they don''t cramp anyone''s style. This task is
    *not* an easy one. Try putting yourself in the place of someone who may use your
    program and then ask yourself the following questions:


    +   - Am I backtracking through the menus too much?

    +   - Does this program flow naturally?

    +   - Can I move quickly from one task to another?


    If you find yourself experiencing a problem in using your program, you can expect
    that someone else who uses your program is also likely to encounter the same problem.
    Make sure that you resolve any such problems and that your program works effortlessly
    — before the user gets it.


    ![](img/05279073f26be7df99b3c487360dec6a_54_0.png)'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# ### Avoiding dead ends


    A good program enables users to move around the program quickly without needing
    to retrace their steps. Nothing’s more frustrating than following a long menu
    trail only to discover that you end up in the wrong place. The only way out is
    to turn around and follow the trail back to your starting point.


    You can avoid these dead ends by always enabling users to jump to key positions
    in your program. (You’re in effect giving users the chance to say, “Beam me home,
    Scotty.”) Decide which menus in your program are the important ones (the ones
    that start the program or perform another major task, such as displaying the screen
    that enables a user to locate information). Then include the important menus on
    other menus in your program so that users can jump to them quickly.


    Always make sure that each menu contains an option for exiting the program. This
    option is an escape hatch in case a user panics and wants to stop using your program.


    # ### Making your program the teacher


    Few computer users ever take the time to read the documentation that comes with
    their programs. Most people just start a program right up, confident that they
    can zip through the screens in a flash. They apparently believe that any program
    that requires reading those manuals just isn’t worth owning. Not all the features
    of a program are obvious, however — some require the user to read the instruction
    manual or go to a class to fully utilize the features of the program.


    If this situation sounds all too familiar to you, you’re in the majority. As a
    programmer, you must deal with the problem of knowing that few users are likely
    to read any of the documentation that you write to show them how to use your program.
    Without reading the documentation, most users probably can’t even use your program.


    Following are a few ways to handle this situation:


    +   - Make sure that you provide clear on-screen instructions whenever you expect
    a user to respond to your program.

    +   - Include a single line of text to describe what a user needs to do next.

    +   - Provide detailed instructions on a Help screen that users can open by pressing
    the Help option on any menu in your program.

    +   - Always define, on the Help screen, any technical term that you use in the
    program.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Chapter 3


    # Writing Your First Linux Program


    # In This Chapter


    +   Outlining your program

    +   Choosing a shell language to use

    +   Choosing a text editor

    +   Writing Linux code for your program


    To have your computer do something, you must clearly state each thing that you
    want it to do. Computers *always* do what you tell them to do (and only what you
    tell them). So even if you give your computer instructions that are unclear or
    out of order, your computer follows those directions without question.


    Before you can speak the language of programmers (nerdish, they sometimes call
    it), you need to learn programming etiquette.


    +   A single instruction to your computer is known as a *command*.

    +   Several commands together are known as *code*.

    +   All the instructions that you need to complete the task are collectively known
    as a *program*.


    According to programming etiquette, programmers never write a program. They write
    code. And only uncool programmers ever ask to see your series of commands. "Can
    I see your code?" is the correct way to ask permission to snoop into someone else''s
    program. (But who asks before taking a peek?)


    # Starting Out: Before You Write a Linux Program


    You must write instructions in a language that your computer understands; otherwise,
    your computer can’t do anything. Before you write an instruction, you must choose
    a computer language. In using Linux, that language is a *shell*!'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'language. A shell language contains special commands known as **reserved words**.
    These words convey a special meaning to Linux, so you must be careful whenever
    you use them in your program. Following are a few such reserved words that are
    part of the *bash* shell language:


    +   - case

    +   - clear

    +   - continue

    +   - echo

    +   - elif

    +   - else

    +   - if

    +   - for in

    +   - let

    +   - read

    +   - then

    +   - while


    Linux code is a bunch of shell-language reserved words that you join together
    to form a program. Whenever your computer reads a reserved word, it says to itself,
    “I remember how to do that.” This situation is similar to how your dog knows what
    to do if you say, “Sit.” (That is, if your dog is well-trained! My dog just sits
    there ignoring me, but at least my computer follows my commands.)


    Your Linux program can consist of only one reserved word or of hundreds of reserved
    words strung together. One-word programs usually perform one task. A program that
    consists solely of the command **ls** — which is short for *list* — displays the
    current directory on-screen... and does nothing else. Longer programs, on the
    other hand, can do many things.


    No one in his right mind would write one long program that contains hundreds and
    hundreds of reserved words. Your computer can easily read all those words, but
    you’d become so confused that changing the program or finding an error in it becomes
    unmanageable.


    # ## Outlining your program


    If you were going to build your dream house, you wouldn’t start by hammering lumber
    together. Instead you’d sit down with your paper and pencil to sketch out your
    ideas.


    If you want to write a Linux program, follow the same procedure for building your
    dream house. Sit down and write in English (or another language, if you prefer)
    all the steps that your computer must do to complete the task.


    As you compose your outline, you write a mixture consisting of both your everyday
    language and certain reserved words. This combination is known as *pseudocode*.
    Your outline may contain an element that reads similar to that of the following
    example: “**if** I press the letter Q, **then** end the program.” The words **if**
    and **then** are reserved words, but the other words aren’t. Don’t'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'worry: you quickly discover how to distinguish reserved words from everything
    else. The following outline’s a typical example of pseudo code that shows you
    how to mix reserved words with regular language as you outline your program. I
    put the reserved words in **monofont** so that you can pick them out. The program
    is something that’s probably familiar to you if you’ve ever started a program
    that first asks you to enter your user identification and a special password.
    The following outline shows all the steps that your computer must take to check
    your identification (with reserved words appearing in **bold** this time):


    +   1. **Start bash.**

    +   2. Clear the screen.

    +   3. Show the title.

    +   4. Tell the user to enter a user ID.

    +   5. Wait for the user to enter a user ID.

    +   6. Save the user ID in memory.

    +   7. Tell the user to enter a password.

    +   8. Remember not to display the password on-screen.

    +   9. Wait for the user to enter a password.

    +   10. Compare the user ID with known user IDs.

    +   11. **If you find the user ID then**

    +   12. Compare the password with the user ID’s password.

    +   13. **If the password matches then**

    +   14. Show the opening menu.

    +   15. **else** tell the user the wrong password was entered.

    +   16. Clear the screen.

    +   17. End the program.

    +   18. **endif (end the block of instructions, Steps 14 – 17, under the If statement).**

    +   19. **else** tell the user that he entered the wrong user ID.

    +   20. Clear the screen.

    +   21. End the program.

    +   22. **endif (end the block of instructions, Steps 18 – 21, under the If statement).**'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Being logical


    Each line in your program plan must appear in the order in which you want the
    computer to perform the task. Think of how you''d do what you want the computer
    to do. Write down those steps on your paper.


    The following steps, for example, are what you need to tell someone to do to enter
    a menu choice at the keyboard:


    +   1. Clear the screen of any text.

    +   2. Show the menu on-screen.

    +   3. Tell the users to enter the letter that corresponds to the menu option
    that they want.

    +   4. Wait for keyboard input.


    Just think what the computer would do if you told it to “show the menu on-screen”
    and then to “clear the screen of any text.” (Unless, of course, you want to elicit
    the reaction “Something''s wrong with my monitor!” from your users.)


    Most errors in your program, which are known as bugs, occur because the computer
    follows an instruction that''s out of the correct order. (See Chapter 19 for information
    about bugs and debugging.) Instructions that are out of order are the hardest
    errors to find, especially if your program contains hundreds of lines of code.


    # Keeping track of loose ends


    Your plan for your program can easily become confusing, especially if you want
    your computer to do a lot of stuff. Even a task that''s very simple for you to
    perform takes a lot of instructions for the computer to follow.


    A basic task such as checking your user ID and password takes 24 lines in Linux
    code. Imagine then how many lines you''d need for even the simplest program that
    you have in mind.


    Following are a few ways to avoid losing your way through your plan:


    +   - Place each instruction on its own line in your plan.

    +   - Assign numbers to each line.

    +   - Indent instructions that you''re associating with the preceding instruction
    (such as whenever you use the if reserved word).'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Chapter 3: Writing Your First Linux Program


    # Breaking down large programs into parts


    Before you actually write a program, I want to steer you toward some good programming
    habits. You can make your large program easier to work with by breaking it down
    into several smaller programs. After you complete each of these small programs,
    you can call each one from other programs as you need them.


    Each small program that''s part of a larger program is known as a *subprogram*.
    (In other computer languages, these subprograms are known as *functions, procedures,
    and subroutines*.) A subprogram contains all the reserved words necessary to perform
    one particular task. Each time that you want your computer to carry out this task,
    you call the subprogram.


    One subprogram may instruct the computer to display a menu on-screen. Another
    subprogram may tell the computer to read what someone enters at the keyboard and
    compare it with menu options. But not every program needs subprograms. If you
    experience no problems reading the code in your program, you probably don''t need
    to create subprograms. (I explain more about subprograms in Chapter 14.)


    # Finding repeated code


    Don''t be surprised if your plan for your program grows rapidly. It''s like sketching
    the layout of your new home and then adding a formal dining room, a formal living
    room, and the family dining room, and an informal living room. . . .


    At some point, you must sit back and ask yourself whether you really need all
    these rooms in your house. Then you review the plans for economy. Is anything
    duplicated in the plans? Can you use one thing for another purpose? Do you really
    need a water fountain in the doghouse?


    The following steps describe a way to reduce the size of your program:


    +   1. **Look for instructions that repeat in your plans.** How many times, for
    example, does the computer display the same menu?

    +   2. **Place instructions that repeat into a subprogram and then plan for your
    computer to call the subprogram each time that you need it.** See Chapter 14 for
    more information on subprograms.

    +   3. **Give the subprogram a name that reflects the task that it performs.**
    The name *opening menu*, for example, is a good name for a subprogram that displays
    the opening menu. (Did anyone really go to MIT for that?)'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# **Testing your programming knowledge**


    +   1. **What are reserved words?**

    +       a. Words that shy people use.

    +       b. Special instructions that every programming language has.

    +       c. Words to get you into an expensive restaurant.

    +       d. Words that you use in an emergency.

    +   2. **How can you design a large program without getting lost?**

    +       a. Have a team of programmers write your program for you.

    +       b. Copy someone else''s idea.

    +       c. You''d never attempt such a project.

    +       d. Outline your program before writing Linux code.


    Answers: 1) b. See “Starting Out: Before You Write a Linux Program.” 2) d. See
    “Outlining your program.”


    Dividing your program into subprograms helps a lot as you make changes to the
    program. Say, for example, that in five places in your program, the computer displays
    the opening menu. If you modify the opening menu, you must make those changes
    in five places. But if the opening menu is a subprogram, you make only one change.


    # **Translating Your Program into Linux Code**


    After you spend days fine-tuning your plan for your Linux program, you can turn
    your attention to translating your plan into Linux code. Don’t rush into writing
    code. Many programmers make this common mistake. You have plenty of time to write
    your program.


    Concentrate on following the logic of your plan. Keep an eye peeled for wrong
    turns and places where you give the correct instruction at the wrong time. Even
    the best programmers make mistakes in logic.


    You’re sure to find that tracking down those bugs in your plan is easier if you
    do it *before* you actually begin building your program. It’s like finding out
    that the doorway in the plans for your dream house is too small before the contractor
    begins building the front of your house.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Understanding what Linux code can do


    You can make your computer do all sorts of things by giving it the correct instructions.
    And you write the instructions that you give the computer in Linux code. You can,
    for example, use Linux code to make your computer perform the following tasks:


    +   - Calculate a result.

    +   - Show the result on-screen.

    +   - Store information in a file.

    +   - Retrieve information from a file.

    +   - Read characters from the keyboard.


    If you want to calculate the number of stocks that you own that are worth the
    money you paid for them, a Linux program can perform the calculation. (You must
    provide the necessary information, of course.)


    After your computer completes the calculations, you probably want it to display
    the results on-screen. To make it do so, you need to use the `echo` reserved word
    and follow that word with the results of the calculation.


    You can enter the number of stocks that you own directly into your program. You
    call this method hard coding, and you generally want to avoid it, because you’d
    then need to change the program each time that a value changes. (What a waste
    of time!) Another way is to set up your program to ask you to enter each stock
    price.


    Either way, the program typically stores the result of the calculation in a part
    of your computer’s memory that it identifies by a name that you give it. The part
    of the computer’s memory that now contains the results of the calculation is known
    as a variable. Whenever you want the computer to use the result, you use the name
    of the variable, preceding it with a dollar sign ($). (I explain variables in
    Chapter 4.)


    In the following example, you’re telling the computer to display on-screen the
    value that the memory location by the name of BestStocks contains (BestStocks
    is also the name of the variable):


    ```

    echo $BestStocks

    ```


    Of course, your Linux program can do a lot more than simply turn your computer
    into the world’s most expensive calculator.


    In fact, your computer can perform nearly any task that you can imagine (except
    finding you a rich spouse) if you give it the correct shell-language instructions.


    # Outlining—line by line


    Begin translating your program plan into Linux code a line at a time. Each line
    of your plan eventually becomes one or more lines of the program depending on
    the task that you want your computer to perform. You can perform some tasks with
    one reserved word; others require several reserved words.


    You don’t need to worry about the Linux jargon yet, although I do want to give
    you an example. The following steps describe what you need to do if you'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'want to translate your outline into Linux code. In any case, you want your
    outline to look something like the following example:


    +   1. Start the bash shell.

    +   2. Clear the screen.

    +   3. Show the title.

    +   4. Ask the user to enter his first name.

    +   5. Wait for the user to enter the name.

    +   6. Display a hello message using the user''s name.

    +   7. End the program.


    Make note of the reserved words that you use in your outline. Avoid guessing.
    Feel free to look up the reserved words in this book. (I love an open book test,
    don''t you?)


    By the way, many programmers use an editor to create their outlines instead of
    paper and pencil. (An editor is a simple word processor, and I talk about editors
    in the section "Considering Your Options for Text Editors," later in this chapter.)


    # Making your outline correspond to Linux code


    Now you want to number each part of your Linux program to correspond to the line
    numbers on your program plan as you write your code. These numbers help you make
    sure that you don''t skip a part of the program. But don''t think that you need
    to know this code now. The following code section is just an example of how your
    code is going to look as you translate your outline into Linux code. Step 7 seems
    to be missing in this example. This step is the one that ends the program. You
    don''t need to tell the computer when to end the program, however, because it
    knows to stop if it finds no more instructions.


    ```

    1. #!/bin/bash

    2. clear

    3. echo "Welcome To My First Linux Program"

    4. echo "Enter your first name: "

    5. read response

    6. echo "Hello, $response"

    ```


    You want to remove the numbers from your program whenever you''re ready to run
    the program. (Linux programs don''t use line numbers.)'
