- pgno: 154
  md: "The break reserved word has practically the same effect as if you're changing\
    \ the value of the `flag` variable to something other than `go` — which also causes\
    \ the program to break out of the loop.\n\nFinally, the program displays a farewell\
    \ message on-screen.\n\nDid you follow that sequence? If not, here's another explanation:\
    \ You set up the program to ask the user to enter a name; after the user enters\
    \ a name, the program then displays a personalized greeting on-screen. When the\
    \ user wants to exit the program, he types the word `stop` instead of a name.\
    \ Each time a user enters a name, the program checks whether the word the user\
    \ enters is `stop`. If the user enters the word `stop`, the program moves to the\
    \ next line and executes the `break` statement, which ends the loop.\n\nAfter\
