- pgno: 220
  md: '# Chapter 19


    # Stamping Out Bugs in Your Program


    # In This Chapter


    +   Testing your program for bugs

    +   Tracing your steps

    +   Setting traps


    You create your dream Linux program. It tracks all those significant others in
    your life, so you don’t face two of them showing up on your doorstep at the same
    time. Well, what’s that saying about mice and men? Your program just missed the
    mark. It lost track of one. Now you’re in hot water.


    You can’t do anything about what happened, but in this chapter, I describe the
    steps that you can take to correct your program so that the mistake doesn’t happen
    again.


    # What’s a Bug?


    Your program doesn’t work because a bug’s lurking in the program. Now don’t go
    looking for your bug spray. That can only damage your computer. You can call any
    problem with a program a bug. You need to blame something for the problem, after
    all (but not the programmer, of course). So why not blame this tiny little critter
    that scares everyone as it quietly crawls across the floor?


    ![](img/05279073f26be7df99b3c487360dec6a_220_0.png)


    The bug in your program may not be real, but the problem that causes your program
    to work incorrectly is very real. Following are some common reasons why programs
    don’t work:


    +   An instruction is out of place. This situation’s like putting the cart before
    the horse.

    +   You give the wrong instruction to your computer. This situation, on the other
    hand, is like telling your computer to move on a red light. It’s the right time
    in your program to make a decision, but it’s the wrong decision.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '+   *   **You use the wrong word.** Instead of using a word that your computer
    understands, you use sort of a different word (which kind of looks like the right
    word to you).

    +   *   **You put the right word in the wrong place.** Nerds call this problem
    using the wrong syntax. It’s like saying, “I’m Hawaii to going,” but you mean
    to say, “I’m going to Hawaii.”


    # ## How a bug gets into your program


    Bugs fly in the open window and land on your computer’s hard drive just in the
    spot where you store your program. (Don’t believe anyone who tells you that story.)


    Bugs get into your program in very predictable ways, as the following list describes:


    +   *   Because you rush to write code without first planning what you want to
    write.

    +   *   Because of typographical errors (whoops).

    +   *   Because of poor computer-language grammar. (Grammar checkers don’t catch
    the misuse of words that make up computer languages.)


    You may, for example, use an *if* statement to have your program make a decision
    (see Chapter 7). The *if* statement ends with *endif*. A spelling and grammar
    checker may indicate a problem with *endif*. You realize, however, that *endif*
    is correct. But you may have typed *endf* in the program, leaving out the *i*.
    This error, too, confuses the spelling and grammar checker. You, on the other
    hand, can recognize that *endf* is not part of the computer language because the
    *i* is missing.


    +   *   You put some code in the wrong place.

    +   *   You guess at the correct word to use. (You don’t want to get up to check.
    The book’s on the shelf downstairs.)


    Don’t feel too concerned if you find a bug in your program. Bugs lurk in every
    program, even those that Bill Gates’ people write. But just because you find something
    in common with the pros doesn’t mean that you can ignore stamping out the bug.


    # ## Don’t lose the war


    Trying to get your program to work correctly is a test of persistence between
    you and the bug. This task can become very frustrating —almost to the point where
    you want to give up.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'You want to remember the following items in debugging your program:


    +   *   **Computers do what you tell them to do.** If the computer is doing something
    other than what you intend, you''re giving it the wrong instruction.

    +   *   **Don''t work around the bug.** Trying this approach is like getting caught
    at the office without an umbrella in the middle of a downpour. You can work around
    the problem by waiting until the rain stops. You face the same situation, however,
    the next time that a downpour occurs. The smart solution is to leave an inexpensive
    umbrella in the office.

    +   *   **Remember that most bugs are simple and obvious.** Your debugging gets
    more difficult, however, as the complexity of your program increases.


    Here''s a hidden reward for being persistent about debugging your program: Your
    knowledge of Linux programming grows tremendously. After you find the answer to
    the problem, you most likely never forget it.


    # ## Retracing Your Steps


    You begin to discover why your program isn''t working by reviewing each line of
    your program. This process can become a time-consuming task depending on which
    technique you use.


    Following are a few common ways that programmers tackle this job:


    +   *   Review each line of code, looking for common problems.

    +   *   Watch each line of code as your computer reads the instructions.

    +   *   Have the computer check your code for syntax errors.


    You must trace your entire program, no matter how insurmountable the review process
    seems. Doing so is the only way to get your program to run correctly.


    # ## Proofread your code


    Pretend that you''re your computer; then begin reading your program just as the
    computer reads it. Follow each direction carefully.


    This suggestion may sound absurd. How can you stuff things into your computer''s
    memory? How can you display characters on-screen? You can''t, but'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'you can take a pencil and a piece of paper and draw computer memory and a screen.
    One sheet of paper can serve as the memory and another as the screen. It''s that
    simple.


    Consider that the following program isn''t working. It says "Hello" to all your
    friends and then "Good-bye"—but keeps repeating these messages endlessly. Look
    through the following example to see whether you can determine the problem:


    ```

    #!/bin/bash

    let flag=1

    while [ "$flag" -eq 1 ]

    do

    for friend in Bob Mary Sue

    do

    echo "Hello $friend."

    done

    echo "Good-bye!"

    let flag=1

    done

    ```


    The first thing that you need to do is to indent your code to make it readable,
    as in the following example:


    ```

    #!/bin/bash

    let flag=1

    while [ "$flag" -eq 1 ]

    do

    for friend in Bob Mary Sue

    do

    echo "Hello $friend."

    done

    echo "Good-bye!"

    let flag=1

    done

    ```


    Next, on the piece of paper that represents your computer''s memory, write the
    line let flag=1. That''s what your computer is doing.


    The next instruction tells your computer to check whether the value of $flag is
    1. So look at the piece of paper, and you can see that, yes, it''s equal to 1
    (and for this discovery you went to college?). You must, therefore, follow the
    instructions inside the loop.


    The first of these instructions tells the computer to place the string Bob into
    the string variable $friend. Write this information on the paper. Your paper version
    of your computer memory should now appear as follows:


    ```

    let flag=1

    declare friend="Bob"

    ```


    The next line tells the computer to display Hello Bob. on-screen. Write this greeting
    on the paper that you''re using as your screen.'
