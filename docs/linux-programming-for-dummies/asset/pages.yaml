  md: '```

    echo "Hello $friend ."

    done

    let flag=$flag + 1

    done

    ```


    In brief, the program greets Bob, Mary, and Sue with an on-screen message three
    times. Two loops are in the program: the while loop and the for in loop. The while
    loop goes around three times. The inner loop, which is the nested for in loop,
    displays the greeting to each friend every time that the while loop goes around.


    The following paragraphs provide the line-by-line details.


    The let flag=1 says to create a numeric variable and assign the value 1 to it.


    The while [ "$flag" -lt 4 ] says to check the value of the $ flag variable. If
    its value is 1, the program follows instructions that appear inside the while
    loop.


    The for friend in Bob Mary Sue is the beginning of the nested loop. It says to
    assign each of the values in the wordlist (Bob Mary Sue) to the variable friend.


    The echo "Hello $friend ." displays a greeting using the value of the $friend
    variable. (Notice the space between $friend and the period.)


    The done says that the program is the end of the for in loop.


    The let flag="$flag + 1" assigns a 1 to the $ flag variable.


    The done indicates the end of the while loop.


    ![](img/05279073f26be7df99b3c487360dec6a_149_0.png)


    The for in loops is the inner loop. The while loop is the outer loop. The inner
    loop must finish before the outer loop finishes.


    # Indenting Nested Loops


    You can stuff as many loops as you need inside other loops. You don''t confuse
    your computer by doing so. You may, however, confuse another programmer who may
    need to read your program if you use long blocks of code that contain lots of
    nested loops.


    ![](img/05279073f26be7df99b3c487360dec6a_149_1.png)


    Avoid any confusion by indenting each inner loop in your code. Indenting your
    nested loops makes your code easier to read and makes finding where the loop begins
    and ends easier, too.'
