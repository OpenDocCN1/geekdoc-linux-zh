- pgno: 298
  md: '# Appendix A


    # Glossary


    anonyous FTP

    Many computer systems enable anyone to log in as anonyous and then transfer files
    without a formal user name on the computer. After connecting with the remote computer,
    type anonymous in response to the user ID prompt; you then type your e-mail address
    as your password. The transfer of files is made possible through the use of the
    file transfer protocol (FTP).


    application

    A program that does real-world work, such as a payroll program or a word-processing
    program.


    argument

    Information that you enter on the command prompt along the name of the program.
    In the command rm myfile, for example, myfile is an argument to the program rm,
    which removes the file from your disk. An argument is information that Linux sends
    to your program after your program begins.


    background

    Describes a program that runs behind the scenes while other programs are running
    on your computer. Many programs can run at the same time in Linux.


    backslash ( \ )

    What you use in Linux to identify the character to the right of the backslash
    as a special character. If you see \n, for example, it indicates a new line on-screen.
    Technically, the backslash tells Linux to ignore the way that you normally handle
    the next character and to treat it in a special way. (The normal way that Linux
    handles the n is to display the letter n on-screen.)


    backup

    An extra electronic copy of your program or data that you keep in a safe place;
    you can use a backup to restore the program or data in case a problem of some
    kind erases the information.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# bash (which stands for Bourne Again shell)


    An enhanced version of the Bourne shell. You can start the *bash* shell by typing
    **bash** at a command prompt and pressing Enter. *bash* is the default shell for
    many Linux distributions, including Red Hat Linux.


    # bit


    The smallest piece of information that your computer understands — you represent
    it as a 1 or a 0. You normally throw a bit together with seven other bits to form
    a byte.


    # Bourne shell


    A shell that enables you to enter commands into Linux. It’s the forerunner of
    the *bash* shell, and uses the $ symbol as its prompt. You can begin the Bourne
    shell by typing **sh** at a command prompt and pressing Enter:


    # Bourne Again shell


    See *bash*.


    # BSD Unix


    The version of Unix that the University of California at Berkeley developed. *BSD*
    stands for *Berkeley Software Distribution*.


    # buffer


    A place in memory where the computer temporarily stores information until a program
    needs it. Text editors use buffers to store a copy of your file while you edit
    it; printers use buffers to store the file that it’s printing.


    # byte


    A collection of eight bits that you use to represent information. Eight bits enable
    256 different combinations of 81s and 0s (256 is 2$^{8}$). Many computers use
    the ASCII code to translate characters on the keyboard to a unique pattern of
    1s and 0s.


    # C shell


    A program that enables users to enter commands into Linux. The C shell uses the
    % as its prompt. You can begin the C shell by typing **csh** at the prompt and
    pressing Enter.


    # central processing unit (CPU)


    The brains of the computer that performs all the “thinking” for the computer.
    Some command central processing units are the Pentium, SPARC, and 80486.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# command


    A word that you type at a shell prompt to direct Linux to do something productive.
    Commands are names of things that the shell knows how to do. They’re also names
    of programs that you or someone else writes by using a shell script language.


    # command mode


    A mode in a text editor where you enter commands. Pressing Esc while using vi,
    for example, places the text editor into the command mode.


    # CPU


    See central processing unit.


    # current directory


    See working directory.


    # current job


    The job Linux marks with a plus sign after you enter the job command at the shell
    prompt. A job is a program or command that’s running.


    # cursor


    A character on-screen that indicates the current position on-screen. The actual
    character that appears on-screen varies with the program that you’re using. Typically,
    a flashing underscore character or box serves as the cursor.


    # daemon


    (Pronounce it “demon.”) The daemon is a program that runs in the background without
    requiring any input from you. Daemons perform housekeeping functions, such as
    printing files that are waiting in the queue.


    # data


    Information that Linux or your program uses to complete a task. Your password
    is data to the program that verifies that you have access to the computer.


    # directory


    A collection of files that you identify by a single name on your hard drive.


    # disk


    A round, flat platter where you can electronically store information in much the
    same way that you can record your voice on an audio tape. A single flat platter
    resides inside a floppy disk and multiple flat platters reside inside hard disks.'
  merge: -1
  img_proc: true
- pgno: 301
  md: "*editor*  \nSee text editor.\n\n*Escape key*  \nThe key on your keyboard that\
    \ reads *Esc* or *Escape*. The function of the Esc depends on the program that's\
    \ running. In the *vi* editor, for example, Esc places *vi* in the command mode.\n\
    \n*executable file*  \nA file that Linux can run. Executable files include programs\
    \ and shell scripts.\n\n*external command*  \nA program with the same name as\
    \ a shell command.\n\n*file*  \nA hunk of information that you store under the\
    \ same name in memory or on your drive.\n\n*file system*  \nThe organization of\
    \ files on your hard drive. A file system begins with the root directory and branches\
    \ to many other directories known as subdirectories. You store files in either\
    \ the root directory or a subdirectory.\n\n*filter*  \nA Linux program that changes\
    \ the way information in a file appears. The *sort* program, for example, changes\
    \ the order in which the information appears. The *sort* program is a filter.\n\
    \n*foreground*  \nA program that's running — you can communicate with the program\
    \ and the program can communicate with you. Another way to run a program is in\
    \ the *background* (where you can't communicate with the program).\n\n*FTP (file\
    \ transfer protocol)*  \nA program that enables you to log into a remote computer\
    \ and transfer files to or from the remote computer. See anonymous FTP.\n\n*gateway*\
    \  \nA connection between two different kinds of computer networks."
  merge: -1
