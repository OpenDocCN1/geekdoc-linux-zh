- pgno: 315
  md: '# Picking up speed


    Faster ways of moving around text exist than moving line by line. The vi text
    editor has another set of commands that you can use to move a screen full of text
    at a time. These commands are known as screen-control commands and are shown in
    Table B-2.


    A screen full of text, which you sometimes refer to as a page, is all the text
    that can appear on-screen at the same time. In Windows, for example, you can fill
    your screen with a different part of your text by using the Page Up and Page Down
    keys or by using the vertical scroll bar.


    These Windows, however, methods don''t work if you use the vi text editor. Instead,
    you must use the screen-control commands such as Ctrl+F to move to the next screen
    and Ctrl+B to move to the previous screen.


    If you''re using the vi text editor on a workstation (a computer that''s between
    a mainframe computer and PC in terms of power), exactly what constitutes a screen
    may confuse you. Some workstations have many windows (with X Windows) on-screen
    at the same time. Each window runs a different application, and vi may be only
    one of these applications. In this case, the screen-control commands affect only
    the window showing the vi text editor. These screen-control commands don''t affect
    the other windows.


    Table B-2 Screen-Control Commands


    | Command | What It Does |

    | --- | --- |

    | Ctrl+B | Moves to the previous screen. |

    | Ctrl+D | Moves down half the current screen. You can enter the number of lines
    that you want to move down before pressing Ctrl+D to instruct the vi text editor
    to move down a specific number of lines. |

    | Ctrl+E | Moves the screen down one line. |

    | Ctrl+F | Moves to the next screen. |

    | Ctrl+L | Clears the screen. |

    | Ctrl+U | Moves up half the current screen — and as with Ctrl+D, you can specify
    the number of lines that you want to move down. |

    | Ctrl+Y | Moves the screen up one line. |

    | Z | Repaints the screen, placing the current line at the middle of the screen.
    |

    | Z (press Enter) | Repaints the screen, placing the current line at the top of
    the screen. |'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# **The word, sentence, and paragraph jump**


    You can fine-tune your movements around your text by using the *word, sentence,
    and paragraph* commands. You need to be in the command mode for these to work.
    (As if I need to tell you that again after you read this appendix.) Table B-3
    contains a list of these additional commands.


    | Table B-3 | Word, Sentence, and Paragraph Commands |

    |---|---|

    | Command | What It Does |

    | W | Moves forward one word. |

    | Shift+W | Moves forward one word that ends with a blank space. |

    | B | Moves back one word. |

    | Shift+B | Moves back one word that begins with a blank space. |

    | E | Moves to the end of the current word. |

    | Shift+E | Moves to the end of the current word that ends with a blank space.
    |

    | ) | Moves to the beginning of the next sentence. |

    | ( | Moves to the beginning of the previous sentence. |

    | } | Moves to the beginning of the next paragraph. |

    | { | Moves to the beginning of the previous paragraph. |

    | % | Finds the matching parenthesis (the cursor must be on a parenthesis for
    this command to work). |'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Just a character at a time


    You can move the cursor throughout your text a character at a time by using the
    character commands of the vi text editor. Table B-4 shows you these commands.


    | **Table B-4** | **Character-Control Commands** |

    | --- | --- |

    | Command | What It Does |

    | ^ (caret) | Places the cursor on the first nowhite character on the current
    line. |

    | 0 (zero) | Places the cursor at the beginning of the current line. |

    | $ (dollar sign) | Places the cursor at the end of the current line. |

    | I (or spacebar) | Moves the cursor right one character. |

    | h (or Ctrl+H) | Moves the cursor left one character. |


    # I don''t mean that


    You''re sure to make a mistake or two as you use the vi text editor. Even pro-
    fessional Linux programmers find themselves needing to undo something they enter
    into the text. You can undo a mistake in either of the following two ways:


    +   - Press u to undelete anything that you delete by using the dd or x command.

    +   - Press U to undelete the current line.


    # Around the text I search for you


    Locating the character or word that you need in pages of text is often diffi-
    cult, especially if you''re trying to find a specific line in your Linux program
    — the code is a jumble of Linux-ese and English.'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'The vi text editor can come to your rescue if you find yourself in such a jam.
    You can command vi to locate the information that you need in your text. Say,
    for example, that you want to find the word bye in your program (don’t ask me
    why). You are, of course, in the command mode and ready to give some orders. You
    can then type /bye if you know that this word must fall somewhere after your current
    cursor position. This command appears at the bottom of your screen, ready for
    you to press Enter (see Figure B-5).


    ![](img/05279073f26be7df99b3c487360dec6a_318_0.png)


    After you press Enter, notice that the cursor jumps to the beginning of the search
    item — in this case the word bye, as shown in Figure B-6. (Of course, this demonstration
    is more impressive if you have really big and complex text, but you get the idea.)'
  merge: -1
  img_proc: true
- pgno: 319
  md: '![](img/05279073f26be7df99b3c487360dec6a_319_0.png)


    Table B-5 contains the commands that you need to instruct *vi* to conduct a search
    of your text or program.


    > Note: Words that appear in *italics* in the commands in this table you must
    replace with the characters or words that you’re trying to locate in your text.


    | B-5<br>Command | What It Does |

    | :--- | :--- |

    | */ pattern* | Begins the search from the cursor position for the characters
    that compose the pattern you’re searching for. |

    | */pattern/+n* | Places the cursor on the *n*th line after the line that contains
    the characters or words that you’re searching for. (Replace *n* with the number
    of the line.) Typing */Bob/+3*, for example, places the cursor on the third line
    below the line where *vi* finds the word *Bob*. |

    | *?pattern* | Begins the search at the cursor and continues to search backward
    through the text. |

    | *?pattern/~n* | Places the cursor on the *n*th line before the line that contains
    the characters or words that you’re searching for. Typing *?Bob?~3*, for example,
    places the cursor on the third line above the line where *vi* finds the word *Bob*.
    |

    | N | Repeats the last / or ? command. |

    | Shift+N | Repeats the last / or ? command but reverses the direction of the
    search. |'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# **Using the Input Mode**


    By now, you probably know all you ever want to know about *vi* commands. Your
    sleeves are up and you''re ready to plow into inserting text into your page. Before
    you can tackle this chore, however, you need to know — what else?— a few more
    *vi* commands.


    I begin by showing you the various ways for you to enter the input mode from the
    command mode. Table B-6 contains the commands that you need to know before you
    begin typing away.


    Table B-6 Entering the Input Mode

    | Command | What It Does |

    | :--- | :--- |

    | A | Places new text after the cursor position. |

    | Shift+A | Places new text after the end of the current line. |

    | I | Places new text in front of the cursor position. |

    | Shift+I | Places new text in front of the current line. |

    | 0 | Places new text below the current line at the beginning of the next line.
    |

    | Shift+0 | Places new text on the line above the current line at the beginning
    of the line. |

    | R | Replaces the character at the cursor with the next character that you enter
    at the keyboard. Typing r''b'', for example, replaces the character at the cursor
    with the letter b. |

    | Shift+R | Overwrites the text beginning with the character over the cursor.
    You can stop overwriting the text by returning to the command mode (by pressing
    Esc). |

    | cw**word**+Esc | Replaces the word at the cursor with another word. If the cursor
    is on the word **Bob**, for example, and you enter **cw**Mary and press **Esc**,
    *vi* replaces the word **Bob** with the word **Mary**. |'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# Copy-editing the vi way


    The `vi` text editor has a wealth of editing commands that make changing whatever
    you type into your text a breeze. All these commands require that you place `vi`
    in the command mode by pressing `Esc`; otherwise, you insert all the commands
    that you type into your text. Table B-7 contains text-editing commands. (Make
    sure that you replace *n* with an actual number.)


    **Table B-7 Text-Editing Commands**


    | Command | What It Does |

    | :--- | :--- |

    | nX | Deletes *n* (meaning a number that you specify) characters beginning with
    the character at the cursor. |

    | nShift+X | Deletes *n* characters backward from the character at the cursor.
    |

    | Shift+D | Deletes the line from the cursor to the end of the line. |

    | dW | Deletes the word at the cursor position. |

    | dD | Deletes the line on which the cursor sits. |

    | Shift+J | Combines the line on which the cursor sits with the next line. The
    next line goes at the end of the current line. |

    | . (period) | Repeats the previous editing command. |


    # Cut and paste text without scissors and glue


    You''re probably familiar with the cut-and-paste features of Macs and PCs running
    Windows. You highlight the text that you want to cut, select Cut from the Edit
    menu, and the text disappears from the screen. Then you move the cursor to the
    spot in your text where you want to insert the text and select Paste from the
    Edit menu. Right before your eyes, the text that disappeared appears again.


    The `vi` text editor has similar features known as *yank* and *put*. *Yank* is
    the same as Cut and *put* is the same as Paste in Windows. Table B-8 contains
    the *yank* and *put* commands. (Remember to replace *n* with a number.)'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# Appendix B: When the Moon Hits Your Eye Like a Big Piece of vi


    **Table B-8 Yank and Put Commands**


    | Command | What It Does |

    |:---|:---|

    | *nYY* | Removes *n* (a number that you specify) lines from the text and places
    those lines into your computer’s memory. |

    | *nYyL* | Removes *n* characters, beginning with the character at the cursor,
    and places those characters into your computer’s memory. |

    | *P* | Places the text that you yank after the cursor. |

    | *Shift+P* | Places the text that you yank before the cursor. |


    # Using the Last-Line Mode


    The last-line mode enables you to read files into the vi text editor so that you
    can edit them. This mode also enables you to write files to a disk (the same as
    saving a file) after you finish editing the file. You use the last-line mode to
    exit vi.


    You can enter the last-line mode by first placing vi in the command mode (by pressing
    Esc). After you’re in the command mode, press the colon (:). This command places
    vi in the last-line mode.


    All the commands that you enter in the last-line mode appear at the bottom of
    the screen (and that’s where the name comes from). After you enter the command,
    you must press Enter for the command to execute. Table B-9 contains last-line
    mode commands.


    **Table B-9 Last-Line Mode Commands**


    | Command | What It Does |

    |:---|:---|

    | *R filename* | Reads the file that you name in the command into the vi text
    editor and places the first character of the file at the current cursor position.
    |

    | *E filename* | Edits the file that you name in the command and stops editing
    the file currently in the vi text editor. |

    | *El* | Discards changes made to the file since you last saved the file and begins
    to edit the file again. |

    | *E#* | Changes between the two files most recently edited. You must save the
    file that you’re editing before you can switch to the other file. |'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# Practicing safe file editing


    You can prevent yourself from catching the fatal disease that strikes many new
    Linux programmers. It''s known as “I lost my files!” The disease hits you as you
    least expect it. You spend hours typing away, entering code into your vi text
    editor. Then, suddenly, without warning, your computer goes blank. It’s as if
    someone turns off the power switch, and you lose all your hard work forever.


    The best defense against this disease is protection. Always save your files regularly
    while working in vi. Table B-10 shows you the save-file commands.


    Note: You must be in the last-line mode for these commands to work. First, make
    sure that you''re in the command mode by pressing Esc and then type a colon (:),
    following it with the command.


    | **Table B-10** | **Save-File Commands** |  |  |

    | :--- | :--- | :--- | :--- |

    | **Command** | **What It Does** |  |  |

    | W | Writes the current file to disk and overwrites the contents of the copy
    of the file that’s on the disk. |  |  |

    | W filename | Writes the current file to disk using the filename that you specify
    in the command. Make sure that you replace *filename* with the name of the file
    that you want to use for the current file. |  |  |

    | W! filename | Writes the current file to disk using the filename that you specify
    in the command and overwrites the contents of the copy of the file that’s on disk.
    |  |  |


    # Bailing out of vi


    Stop, already. Here are some ways to exit the vi text editor. All these commands
    require vi to be in the last-line mode, and you must press Enter to execute the
    command. Table B-11 contains exit commands for the vi text editor.


    Note: You can simply press ZZ in the command mode (without pressing Enter) to
    exit vi and save changes to your file.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '| Table B-11: Exit Commands |  |

    |---|---|

    | **Command** | **What It Does** |

    | :Q | Exits *vi* only if you save changes that you make to the file you’re editing
    to the disk. |

    | :Q! | Exits *vi* regardless of whether you save changes to the file to the disk.
    |

    | :X | Has the same effect as the **ZZ** command. |

    |  |  |'
