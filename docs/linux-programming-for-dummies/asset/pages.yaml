    \n```\n#!/bin/bash\nlet flag=1\nwhile [ \"$flag\" -eq 1 ]\ndo\n    for friend\
    \ in Bob Mary Sue\n    do\n        echo \"Hello $friend.\"\n    done\n    echo\
    \ \"Good-bye!\"\n    let flag=0\ndone\n```\n\nThe value of `let flag` now changes\
    \ to 0 at the end of the loop."
