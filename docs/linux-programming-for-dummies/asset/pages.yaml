    | ? | Repeats preceding search from cursor to beginning of file |

    | :n | Finds line number in which n is the line number you want to locate |


    # Avoiding common vi mistakes


    Whenever you use an unfamiliar text editor, you''re bound to make a few errors.
    You join the ranks of many professional programmers whenever some of vi''s common
    traps trip you up. Following are a few mistakes that anyone can make:'
