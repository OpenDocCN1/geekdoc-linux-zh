- pgno: 231
  md: "You build many Linux programs from subprograms. Some of these subpro- grams\
    \ are **bash** shell scripts that you or your friends build. Others are Linux\
    \ utilities that have been around for years. You can run all subprograms from\
    \ the command prompt as well as from inside your program.\n\nInstead of running\
    \ your large program many times to find the problem, you can run each subprogram\
    \ from outside your program to see whether the sub- program is causing the problem.\n\
    \nThis technique is especially useful if your program uses the **gawk** utility.\
    \ This utility searches a database file for a particular pattern of characters\
    \ (see Chapter 16).\n\nA common place for trouble to occur is with the expression\
    \ that you use in the **gawk** utility. You simply don’t ask the **gawk** utility\
    \ the right question; therefore, it comes up with the wrong answer.\n\nYou can\
    \ modify the expression and execute the **gawk** utility from the com- mand line\
    \ rather than from within your program. This strategy speeds the debugging process.\n\
    \nUse the following command to execute **gawk** from the command line:\n\n```\n\
    `gawk '/123/ {print $2, $3}' inventory`\n```\n\nThis command executes the **gawk**\
    \ utility on the command line and asks it to display the second and third columns\
    \ from the inventory file for each row that contains the characters 123.\n\n#\
