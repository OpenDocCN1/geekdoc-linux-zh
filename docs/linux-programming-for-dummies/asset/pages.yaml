  img_proc: true
- pgno: 180
  md: 'You insert the name of the subprogram as an instruction into your program the
    same way that you place the other instructions into your program. In fact, you
    can write a program that contains only one instruction — the name of a subprogram.
    The following example shows how such a program looks:


    ```

    #!/bin/bash

    displaymenu

    ```


    Not much to this program. It simply starts the **bash** shell and then calls the
    **displaymenu** subprogram. The subprogram does all the work in this case. The
    **displaymenu** subprogram displays a menu on-screen.


    You can build large, complex programs from many subprograms. And sometimes you
    can reuse subprograms in other programs without even modifying the subprogram.
    Suppose, for example, that you create a subprogram that prompts the user to enter
    a name and password and then validates the password. You can use this same subprogram
    with other programs that also need this task.


    # # Sharing Subprograms


    Don’t throw away the subprograms that you build! Programmers treat their collection
    of subprograms almost as collector’s items. A subprogram that’s working smoothly
    is worth its weight in gold. Okay, maybe it’s not *that* valuable yet. But a programmer
    who can choose between building a subprogram from scratch or getting one from
    a friend always opts for the latter.


    But don’t go looking for a formal trading post where you can exchange subprograms.
    You really aren’t going to find any. You can, however, post your request for subprograms
    on the appropriate newsgroups on the Internet (see Chapter 21 for details). You
    can also ask other programmers that you meet whether they have any good subprograms
    that you can take a peek at.'
  merge: -1
