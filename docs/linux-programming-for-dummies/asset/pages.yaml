    echo "$friend"

    let counter="$counter + 1"

    done

    done

    echo "Good-bye!"

    let flag=0

    done

    ```


    Indenting a nested loop doesn''t affect how Linux processes the commands that
    the loop contains. Linux processes the commands in the same manner as it does
    those in the block of code that you don''t indent — indenting a loop simply makes
    the code easier for you (and other programmers) to read and understand.


    # Avoiding Endless Loops


    All right. You build your masterpiece of a program and fill it with loops inside
    other loops (nested loops), but it doesn''t work correctly. The program keeps
    breaking out of an outer loop prematurely. It''s a mess! This situation results
    from a common mistake that you want to avoid. Whenever code contains many nested
    loops, changes that you make within an inner loop are likely to inadvertently
    make the condition in an outer loop false — breaking your program out of the loop.


    ```

    let flag=1

    while [ "$flag" -eq 1 ]

    do

    for friend in Bob Mary Sue

    do

    echo "Hello $friend ."

    let counter=1

    while [ "$counter" -lt 4 ]

    do

    echo "$friend"

    let counter="$counter + 1"

    done

    done

    echo "Good-bye!"

    let flag=1

    done

    ```


    Here''s what''s happening.


    let flag=1 creates a variable called flag and assigns the value 1 to the variable.


    while [ "$flag" -eq 1 ] uses the value of flag as the condition for entering the
    loop. As long as the value of flag is 1, all the instructions inside the loop
    execute.'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'let flag=1 near the last line in the program assigns the value 1 to the flag
    variable. This creates an endless loop because you never assign flag a value other
    than 1; the condition in the while loop is always true. The computer keeps running
    all the instructions inside the while loop... over and over again.


    ![](img/05279073f26be7df99b3c487360dec6a_152_0.png)


    You can avoid breaking the loop by making sure that the condition for each loop
    is independent from other conditions and other variables that you use in the program.
    Programmers commonly use a variable known as flag as the condition for a loop—
    for example, while [ "$flag" -eq 1 ]. Indevertently, you can use the same flag
    as the condition for all the nested loops. But what a mess results if you don’t
    remember that you’re using the variable as the condition for the loop and change
    the value of the flag variable in your program. It can potentially affect the
    condition of all the loops. You end up with an endless loop — and then you must
    untangle the mess.


    Another common problem to avoid is ending the loop in the wrong place. This error
    trips many programs, especially if you nest loops. Each loop requires its own
    done reserved word. If you place done within the instructions of the loop instead
    of at the end of the instructions, the program probably produces unexpected results.
    This problem is a little different from other problems that you face as you write
    a program, because Linux doesn’t tell you that a mistake is lurking in your program.
    Instead, the program executes as if nothing’s wrong— except you recognize that
    the output of your program isn’t correct. Only painstaking examination of your
    program reveals the problem.


    The following code shows a potential problem that creating a nested loop introduces:


    ```

    ```

    let flag=1

    while [ "$flag" -eq 1 ]

    do

    for friend in Bob Mary Sue

    do

    echo "Hello $friend."

    let counter=1

    while [ "$counter" -lt 4 ]

    do

    echo "$friend"

    let_counter="$counter + 1"

    echo "Goodbye!"

    let flag=0

    done

    done

    done

    ```

    ```


    The done keywords are in the wrong places. Instead of displaying the Good-bye!
    message as part of the outer loop, the mix-up causes the Good-bye! message to
    appear as part of the inner loop.'
  merge: -1
  img_proc: true
- pgno: 153
  md: "![](img/05279073f26be7df99b3c487360dec6a_153_0.png)\n\nLinux doesn’t catch\
    \ this mistake. You must hunt through your code to locate the problem.\n\n# #\
    \ Using break and continue in Any Loop that You Want\n\nI know that the following\
    \ stuff on `break` and `continue` closely connects to the `while` loop (which\
    \ you can read about in Chapter 10), but I’m discussing them in this chapter because\
    \ the topic usually comes up as you’re finding out about nested loops and their\
    \ potential problems. (So don’t stop now. Read on.)\n\n# ## Using break for a\
    \ quick exit\n\nDid you ever try to run a mile on a treadmill just to stop halfway\
    \ through? Practically the same thing can happen with your program as the program’s\
    \ executing a `while` loop. The treadmill has a safety button that you pull out\
    \ to abort your run. The safety button in a `while` loop is the `break` reserved\
    \ word.\n\nA `while` loop runs continually until a condition proves true or false.\
    \ Suppose you want to exit the loop before the condition changes. How can you\
    \ bow out of the loop before it finishes? You can use the `break` statement.\n\
    \nTake a look at the following code for an example of the `break` statement in\
    \ action:\n\n```\n`let n=1`\n`while [ \n```\n\nThis program asks the user to enter\
    \ his name or the word `stop` if he wants to end the program. Behind the scenes,\
    \ the program displays a personal greeting on-screen as long as the user doesn’t\
    \ enter the word `stop`.\n\nAfter the user enters `stop`, the program enters the\
    \ `case` statement and skips to the next instruction, which causes the program\
    \ to break out of the loop."
