  md: "# Chapter 18: Getting Chatty  \nwith Comments\n\n1. Modify the following program\
    \ by explaining (in the program) what the echo command does.\n\n```\n```bash\n\
    #!/bin/bash\necho \"Bob Smith\"\n```\n```\n\nAnswer:\n\n```\n```bash\n#!/bin/bash\n\
    #The echo command displays the name on screen.\necho \"Bob Smith\"\n```\n```\n\
    \n2. Modify the following program to include comments for each action the program\
    \ must take.\n\n```\n```bash\n#!/bin/bash\nclear\necho \"How much money do you\
    \ want to make this year?\"\nread salary\nlet salary=\"$salary + 100\"\necho \"\
    I think you can earn $salary\"\n```\n```\n\nAnswer:\n\n```\n```bash\n#!/bin/bash\n\
    #clear the screen\nclear\n# prompt the user to enter a salary\necho \"How much\
    \ money do you want to make this year?\"\n#read characters from the keyboard\n\
    read salary\n# add 100 to the value of the salary variable and assign the new\
    \ value to the salary variable.\nlet salary=\"$salary + 100\"\n#display the message\
    \ and salary on the screen\necho \"I think you can earn $salary\"\n```\n```\n\n\
    3. List two ways that you can add a comment about this instruction: read salary.\n\
    \nAnswer 1: By placing the comment on the line above the instruction:\n\n```\n\
    ```bash\n#read characters from the keyboard\nread salary\n```\n```\n\nAnswer 2:\
    \ By placing the comment on the same line but to the right of the instruction:\n\
    \n```\n```bash\nread salary #read characters from the keyboard\n```\n```"
