    # # Keeping Data in a File


    Putting data that someone enters into your file on your hard disk is a common
    practice. A *file* is like a file drawer (but a lot better organized). Say that
    you want to keep your date book handy — but away from prying eyes. You can build
    a program that collects all those special phone numbers for you and then places
    them in an electronic hideaway on your computer''s hard disk. Then, as Friday
    night rolls around, you can instruct your program to open the file, and you can
    choose the date of your dreams. (Of course, your dream date may already have plans
    . . . )


    ![](img/05279073f26be7df99b3c487360dec6a_94_0.png)


    Following are some reasons for saving data to a file:


    +   - Data is always available to your programs.

    +   - You don''t lose information unless a disaster happens to your hard disk.

    +     And we all know that can *never* happen. (On the other hand, where''s my
    tape backup?)

    +   - You can use a Linux utility to search the file for particular information.


    The way in which you organize the data that you save to a file is important; otherwise,
    your computer may have a difficult time finding it.


    In Chapter 16, you explore how to create a simple database. A database is a special
    kind of file for holding information that you need to find fast. For now, however,
    I want to show you how to take the data that your program collects and stuff it
    into a simple file on your hard disk.


    # ## Saving data to a new file


    Linus Torvalds decided that any time your program needs to display anything by
    using the `echo` reserved word, it uses the screen.


    That''s just fine for most of your programs, but you can easily change your program
    to display data someplace else — such as to a file. Such a process is known as
    *redirection*, which means changing the direction of the normal flow of data.'
