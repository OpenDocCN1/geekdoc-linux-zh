- pgno: 98
  md: '# ## Chapter 6


    # # Who Were Those Masked Operators?


    # **In This Chapter**


    +   - Adding, subtracting, multiplying, and dividing numbers

    +   - Using the *not, and,* or *or* operators

    +   - Comparing values with comparison operators

    +   - Establishing precedence for operators


    After your computer receives information from someone who uses your program, the
    next step is to do something with the information. You can, for example, have
    your computer calculate a result.


    Anytime that you want your computer to modify data, you must tell the computer
    to perform an *operation* by using one or more *operators* in your program. Linux
    recognizes the following three categories of operators (each with its own individual
    operators):


    +   - Arithmetic

    +   - Logical

    +   - Comparison


    In this chapter, I show you the operators that you can use in Linux and give you
    a tip or two on how to use them in your program.


    # ## Arithmetic Operators


    *Arithmetic operators* transform your expensive computer into one of those pocket
    calculators that banks and other financial companies give away if you sign up
    for one of those high-interest credit cards.'
