    \ matter. The only language that it understands is *binary code* (or *machine\
    \ language*), which consists of a bunch of zeros and ones. Try writing a program\
    \ by using this method, and you quickly head directly for the loony bin. Programmers\
    \ are different from the average Joe, but they're not crazy, so some scientists\
