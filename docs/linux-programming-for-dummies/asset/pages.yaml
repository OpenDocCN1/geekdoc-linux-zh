- pgno: 168
  md: '# Chapter 14


    # Getting Down with Subprograms


    # In This Chapter


    +   > Creating a program plan

    +   > Creating subprograms

    +   > Naming subprograms

    +   > Using subprograms

    +   > Sharing subprograms


    Although you design each program to perform a specific task, every program that
    you write shares some basic functions in common with other programs. Every program,
    for example, displays text on a screen, reads information that a user enters on
    the keyboard, saves the user’s input to a variable, and then works with the information.


    You piece each of these tasks together to build large, complex programs that tell
    the computer to perform some useful tasks. At times, you want your program to
    perform a specific group of related tasks, such as displaying an error message
    on-screen if the user does something wrong with your program.


    Pretty soon, you’re writing Linux programs that enable your computer to do all
    sorts of fancy things.


    Because errors can occur practically anywhere in your program, duplicating the
    necessary instructions to display an error message throughout your program doesn’t
    make sense. Such duplication takes up too much space and is a nightmare to maintain.
    Every time that you change a part of the error message, you must remember all
    the places in your program where you duplicate those instructions.


    You can avoid the problems that result from duplicate instructions in your program
    simply by placing those instructions in a small program known as a subprogram.
    A subprogram is identical to a regular program in that you create a subprogram
    by using an editor and the chmod command to transform the file into an executable
    program (a file that your computer can run).'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'The only thing special about a subprogram is that the instructions you place
    in a subprogram are those that you design to perform a *specific* task, such as
    displaying an error message or checking for the correct user''s password. Those
    same subprograms can then execute from within your program whenever you need it
    to perform a special task.


    You often find yourself building large, complex programs from many subprograms.
    To make sure that your program works smoothly and is also easy to read, however,
    you need to *map out* the tasks that you want your program to perform and then
    decide how each task relates to the other tasks in the program. In this chapter,
    I take you through the steps for creating an overall program plan and describe
    how subprograms contribute to a well-designed and efficient program.


    # # Why Use a Subprogram?


    Subprograms are the building blocks of your program. First, you create each building
    block, and then you assemble them to develop the whole program.


    Suppose that you need the computer to display an opening menu and respond to whatever
    the user selects. You call both of these activities one task, because whenever
    a menu appears, the program always waits for a response from the user. You can
    place all the code that''s necessary to perform this task into the same subprogram.
    Your program then calls this subprogram whenever you want to perform the task.


    The following list describes some reasons for using subprograms:


    +   - Subprograms isolate all code performing a specific task. If you''re having
    a problem with your menu display, for example, you don''t need to hunt through
    your entire program for the piece of code that''s causing the problem. You just
    need to look in the display-menu subprogram.

    +   - Building your program from subprograms saves you from repeating the code
    in your program. You simply execute the subprogram whenever you need the program
    to perform that task.

    +   - You make changes or updates to code in just one place in your program. (*What
    a timesaver!*)

    +   - Subprograms are reusable, and you can use them to build other Linux programs
    — and share them with other programmers who want their programs to perform some
    of the same tasks that your program performs.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'You need to use a little common sense in deciding the number of subprograms
    to create for your program. If you find that you''re losing track of the subprograms
    that you create, you''re probably making too many of them (although no particular
    rule tells you how many subprograms are too many). If you feel that tracking subprograms
    is getting out of control, you probably need to consolidate some of them or devise
    a better planning tool to help you organize your subprograms. Probably the best
    planning tool is the *flowchart*, which graphically organizes your program plan.


    # # Creating a Program Plan by Using a Flowchart


    Just the mention of creating a Linux program plan can send most new programmers
    off to get a bottle of aspirin. Why must computers be so complicated? I thought
    that I''d never figure out Microsoft Project (a tool that many programming gurus
    love to use in building a plan), but with a little patience, I overcame this perceived
    obstacle. You, too, may find creating a Linux program plan daunting at first,
    but it''s really pretty easy.


    First, you want to figure out what you need Linux to do and then break down the
    overall plan into individual functions. The flowchart helps you organize your
    program and place the subprograms to maximize efficiency.


    # ## Divide and conquer


    How do you eat an elephant? One bite at a time, of course. How then do you plan
    a large, complex Linux program? You break the program down into its individual
    functions and create a list of what you want Linux to do. (You can also chomp
    on the program, but you quickly find that it''s rather stringy and in need of
    garlic.) By dividing your Linux program into logical chunks, with each performing
    a unique and important task, you make your overall programming task much easier.


    Suppose, for example, that you want to create a Linux program with the overall
    objective of maintaining your telephone directory. You can further divide this
    overall program objective into the individual tasks that you want the program
    to perform, which may include some of the following:


    +   - Logging into the program.

    +   - Displaying a main menu that enables the user to make a selection.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '+   - Finding a listing in the telephone directory.

    +   - Adding a listing to the telephone directory.

    +   - Modifying a listing in the telephone directory.

    +   - Printing the telephone directory.


    Your Linux program may have more or fewer tasks than appear in the preceding list.
    Most programs that work with data, however, incorporate subprograms that find
    data, add data, modify existing data, and print data.


    # ## Plugging a task list into a flowchart


    You need to take pencil in hand and organize your thoughts about how your program
    is going to work. The simplest approach is to draw a flowchart where each box
    in the flowchart represents a task that your program must accomplish. You must
    arrange each box on the flowchart in the order that you want your program to accomplish
    the task, and then you can draw lines connecting the boxes.


    Take an example close to my heart (actually close to my stomach). I call this
    creation the Get a Snack program. The examples in this section describe how I
    organize this nightly trip. (Now if I could only get my computer to do the fetching,
    I''d have it made.)


    A flowchart for the Get-a-Snack program, for example, may look something like
    the chart shown in Figure 14-1.


    ![](img/05279073f26be7df99b3c487360dec6a_171_0.png)


    **Figure 14-1:** The Get-a-Snack program''s flowchart.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'To start your program flowchart, then, you first need to assemble the long
    list of tasks that you want your Linux program to perform. The next step is to
    draw a picture of your program. All you need to draw is a box for each task; then
    you place the name of the task inside the box, similar to what you see in Figure
    14-2 — just as I’m doing with the Get-a-Snack program. (And this time, I’m starting
    from the very beginning.)


    ![](img/05279073f26be7df99b3c487360dec6a_172_0.png)


    This little task doesn’t add much to your plan, but you’re just on the first step.
    The next step in creating a flowchart is to map out how each task relates to the
    other tasks. Now the process is getting a little more complicated, isn’t it?


    The flowchart in Figure 14-3 shows how the Linux user progresses through your
    program. The user first logs in (*Login Task*), and the main menu appears (*Display
    Menu*). From the main menu, the user can then choose one of the four options that
    you provide in the program: *Find Listing*, *Add Listing*, *Modify Listing*, or
    *Print Listing*.


    # ## Adding detail to a flowchart


    You can further divide each task on your flowchart into more specific tasks. The
    task *Find Listing*, for example, requires that your program perform the following
    more-detailed tasks:


    +   - Prompt the user to enter a name to find.

    +   - Search the database for the name the user enters.

    +   - If the search is successful, display the listing.

    +   - If the search is unsuccessful, tell the user that it can’t find the listing.

    +   - Return to the main menu.


    Draw another flowchart that shows each of these more detailed tasks and how each
    task logically follows from the preceding one. Figure 14-4 shows how the *Find
    Listing* flowchart looks.'
  merge: -1
  img_proc: true
- pgno: 173
  md: "![](img/05279073f26be7df99b3c487360dec6a_173_0.png)\n\nFigure 14-3:  \n  Fleshing\
    \ out your flowchart.\n\nThe shape of the flowchart in Figure 14-4 is a little\
    \ different than that of Figure 14-3 because the relationships among the tasks\
    \ are now different.\n\n![](img/05279073f26be7df99b3c487360dec6a_173_1.png)\n\n\
    Figure 14-4:  \n  Adding more functions to a flowchart.\n\nAs you become more\
    \ specific about what each task (subprogram) does in your Linux program, the flowchart\
    \ that depicts that task also becomes more detailed — kind of like branches sprouting\
    \ from the trunk of a healthy tree."
  merge: -1
