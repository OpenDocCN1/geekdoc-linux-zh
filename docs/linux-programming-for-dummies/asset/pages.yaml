- pgno: 347
  md: "+   4. How you use can *pseudo-code* as comments for your program? (Yes, **this\
    \ one is an essay question**)\n\n**Answer**: you can list instructions that are\
    \ necessary to complete a task as pseudo-code (that is, the instructions that\
    \ you write in real English) in your program file. Linux, of course, doesn't understand\
    \ English. You can, however, place a number sign (#) as the first character of\
    \ the pseudo-code, which converts the pseudo-code into a comment.\n\n# ## Chapter\
    \ 19: Stamping Out Bugs in Your Program\n\n+   1. What's the problem with the\
    \ following code?\n\n```\n```\n#!/bin/bash\nclear\ndeclare name=\"Bob\"\nif [\
    \ \"$name\" -eq \"Tom\"]\necho \"Hello Tom\"\nfi\n```\n```\n\n**Answer**: The\
    \ `if` statement is missing the `then` keyword.\n\n+   2. What's the problem with\
    \ the following code?\n\n```\n```\n#!/bin/bash\nclear\ndeclare name=\"Bob\"\n\
    while \"$name\" == \"Tom\"\ndo\necho \"Hello Tom\"\ndone\n```\n```\n\n**Answer**:\
    \ You must enclose the expression `$name == \"Tom\"` within brackets:\n\n```\n\
    ```while [ \"$name\" -eq \"Tom\"]```\n```\n\n+   3. What's the problem with the\
    \ following code?\n\n```\n```\n#!/bin/bash\nclear\ndeclare name=\"Bob\"\nif [\
    \ \"$name\" -eq \"Tom\"]\nthen\n\techo \"Hello Tom\"\nif [ \"$name\" -ne \"Tom\"\
    ]\nthen\n\techo \"You're not Tom.\"\nfi\n```\n```"
  merge: -1
  img_proc: true
- pgno: 348
  md: "**Answer:** This code actually contains two problems. The second if statement\
    \ never runs because the condition requires that the `$name` not be Tom — the\
    \ `if statement`, however, nests inside another `if` statement that executes only\
    \ if the `$name` is Tom. The second `if` statement is missing the `fi` keyword.\n\
    \n4. What’s the problem with the following code? (Are you noticing a pattern with\
    \ the questions for this set of exercises?)\n\n```\n#!/bin/bash\nclear\ncase $city\
    \ in\n\t\"q\")\n\t\techo \"Search by name\"\n\t\t;;\n\t\"b\")\n\t\techo \"Search\
    \ by telephone number\"\n\t\t;;\n\t\"c\")\n\t\techo \"Search by employee number\"\
    \n\t\t;;\n\t\"q\")\n\t\tdeclare flag=\"Q\"\n\t\t;;\n\t*)\n\t\techo \"Incorrect\
    \ menu selection.\"\n\t\t;\n\tesac\n```\n\n**Answer:** You’re assigning no value\
    \ to `$city`. And the `case` statement requires the `esac` keyword, which is missing\
    \ from the last line of this program.\n\n5. What’s the problem with the following\
    \ code?\n\n```\n#!/bin/bash\nclear\nfor friend in Bob Smith Mary Jones Joan Adams\n\
    do\n\techo \"Hi, $friend\"\ndone\n```\n\n**Answer:** You need to enclose the names\
    \ Bob Smith, Mary Jones, and Joan Adams within quotation marks:\n\n```\nfor friend\
    \ in \"Bob Smith\" \"Mary Jones\" \"Joan Adams\"\n```"
  merge: -1
  img_proc: true
