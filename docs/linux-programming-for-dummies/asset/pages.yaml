    Outside of while loop flag = 1

    inside of while loop flag = 1

    inside of for in loop flag = 1

    Hello Bob.

    outside of for in loop flag = 1

    Hello Mary.

    inside of for in loop flag = 1

    Hello Sue.

    outside of for in loop flag = 1

    Good-bye!

    last line in while loop flag = 1

    inside of while loop flag = 1

    inside of for in loop flag = 1

    Hello Bob.

    inside of for in loop flag = 1

    Hello Mary.

    inside of for in loop flag = 1

    Hello Sue.

    outside of for in loop flag = 1

    Good-bye!

    last line in while loop flag = 1

    ```


    Now you realize that your program never assigns the let flag variable the value
    of 0. You know the cause of the problem because it creates an endless loop (see
    Chapter 10).


    # Using a file to help find the problem


    Displaying flags and the value of variables on-screen is helpful in finding a
    problem in your program. With some programs, however, this method isn’t practical.
    You have just too much information to keep on-screen.


    A better approach is to make the computer save the stuff that appears on-screen
    to a file. You use the following command to do so:


    ```

    myprogram > flagfile

    ```


    In this example, you tell the computer to run myprogram and to redirect to the
    file flagfile anything that goes to the screen. You can review the flag-file by
    using a text editor such as vi.'
  merge: -1
  img_proc: true
- pgno: 229
  md: "You use the following command to get `vi` to review a file:\n\n```\n`vi flagfile`\n\
    ```\n\nIf you really want to get down and dirty trying to locate the trouble inside\
    \ your program, you can print a copy of the file. You can use this printout as\
    \ a guide as you review lines in your program.\n\nUse the following command to\
    \ print a copy of the file:\n\n```\n`cat flagfile | lp`\n```\n\n# Turning off\
    \ parts of your program\n\nAnother beneficial method that programmers use to find\
    \ trouble spots in their program is to turn parts of the program off and on.\n\
    \nThe first step in this process is to place the comment character (#) as the\
    \ first character of each line of the program—at the very beginning because there\
    \ it’s easier to remove and doesn’t affect the indentation of the other instructions—as\
    \ in the following example:\n\n```\n```\n#!/bin/bash\n#let flag=1\n#while [ \"\
    $flag\" -eq 1 ]\n#\t\tdo\n#\t\tfor friend in Bob Mary Sue\n#\t\t\tdo\n#\t\t\t\t\
    echo \"Inside of for in loop flag = $flag\"\n#\t\t\t\techo \"Hello $friend.\"\n\
    #\t\tdone\n#\t\techo \"Good-bye!\"\n#\tlet flag=1\n#done\n```\n```\n\nThe computer\
    \ ignores lines that begin with a comment character, except where the first line\
    \ of the program contains only the comment character. This initial line tells\
    \ the computer to start the `bash` shell.\n\nNext, remove the comment character\
    \ from lines that are necessary to perform the same task. The `for` in loop, for\
    \ example, and the lines within the `for` in loop display a greeting to your friend.\
    \ These lines all perform one task.\n\nThe following example shows what the program\
    \ now looks like:\n\n```\n```\n#!/bin/bash\n#let flag=1\n#while [ \"$flag\" -eq\
    \ 1 ]\n#\t\tdo\n#\t\tfor friend in Bob Mary Sue\n\t\t\tdo\n```\n```"
