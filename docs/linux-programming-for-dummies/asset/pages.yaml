- pgno: 326
  md: '# Appendix C


    # Shell Conversion


    Throughout this book, I show you how to write a program by using the bash shell.
    You may, however, want to try your programming skills with the C shell, another
    very popular Linux shell. (You find both bash and the C shell in most versions
    of Linux.)


    # How to Use This List


    The tables in this appendix can help you convert popular bash commands and statements
    to their C shell equivalents. After you write your program by using the techniques
    that you pick up in this book, you can match the bash shell keywords with their
    C shell equivalents. Notice that the bash shell and the C shell commands are usually
    similar — indeed, both shells sometimes have the same commands.


    Note: This list is by no means exhaustive; in fact, it just scratches the surface.
    Some commands in the C shell have no equivalents in the bash shell. I''m not even
    going to get into that now!


    Table C-1 | Command Conversions

    Command Function | bash Shell Command | C Shell Command

    Starting the shell from a program | /bin/sh | #!/bin/csh

    Setting a variable | variable=variable name, declare variable = variable name,
    or let variable = variable name | set variable variable name, let var[1]=100,
    or echo $var[1]

    Resetting a variable | unset variable | unset variable

    (continued)'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'Table C-1 (continued)

    | Command Function | bash Shell Command | C Shell Command |

    | :--- | :--- | :--- |

    | Referring to a string variable | `$variable` | `$variable` |

    | Picking out data from a string array | `declare -a var=(1 2 3 4), echo $` |
    `set var = (1 2 3 4), echo $var[1]` |

    | Making Linux wait (suspends script for n seconds) | `sleep n` | `sleep n` |

    | Appending standard output to a file | `>> filename` | `>> filename` |

    | Taking standard input from a file | `< filename` | `< filename` |

    | Sending standard output to a file | `> filename` | `> filename` |


    Table C-2

    Operator Conversions

    | Operator | bash Shell Operator | C Shell Operator |

    | :--- | :--- | :--- |

    | Equal to | `-eq` | `==` |

    | Not equal to | `-ne` | `!=` |

    | Less than | `-lt` | `<` |

    | Less than or equal to | `-le` | `<=` |

    | Greater than | `-gt` | `>` |

    | Greater than or equal to | `-ge` | `>=` |'
