  md: "+   6. The program then calls the `mail` utility by using the variables `$subject`\
    \ and `$file`. Linux substitutes the subject passing to the program for the `$subject`\
    \ variable and the name of the file that contains the e-mail message for the `$file`\
    \ variable before executing the `mail` utility.\n\nYou use the `else` statement\
    \ in your program if four arguments don't pass to the program. Below the `else`\
    \ statement is the error message that appears on-screen if the person fails to\
    \ enter the minimum number of arguments necessary to run the program.\n\nThe program\
    \ still isn't foolproof, because you assume that, if four arguments pass, they're\
    \ the correct arguments. Nothing's stopping someone from using the `-s` switch,\
    \ for example, and then entering the filename as the next argument. You must include\
    \ many additional lines of instructions in your program to trap all the possible\
    \ errors that can occur as the program runs.\n\n# # Looping through addresses\n\
    \nA clever way to send the same e-mail to a list of friends is to call the `mail`\
    \ utility for each name on your mailing list. The easiest way to do so is to use\
    \ the `for` in loop in your program. See Chapter 11 for additional information.\
    \ I also put it to work in this section to send e-mail to my friends.\n\nYou place\
    \ e-mail addresses in the `for` in loop as a wordlist. Each time the `for` in\
    \ loop executes, the `for` in loop takes the next e-mail address for the wordlist\
    \ and assigns the e-mail address to the `for` in loop variable.\n\nLinux uses\
    \ the `for` in loop variable in place of the address in the `mail` utility. Each\
    \ time the program calls the `mail` utility, the program replaces the `for` in\
    \ loop variable with the contents of the variable, which is the e-mail address.\n\
    \nHere's how an e-mail program looks after inserting the `for` in loop into the\
    \ program:\n\n```\n```bash\n#!/bin/bash\nfor friends in bob@mycomputer mary@mycomputer\
    \ tom@mycomputer\ndo\n    mail -s $1 $friends < $2\ndone\n```\n```\n\nThe following\
    \ steps describe what's happening in this program:\n\n+   1. First the `bash`\
    \ shell starts (`#!/bin/bash`).\n+   2. Linux assigns the first e-mail address\
    \ on the wordlist to the variable `friend`. The first e-mail address is `bob@mycomputer`."
