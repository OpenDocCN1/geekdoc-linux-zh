  md: '# Subtracting two numbers

    by using the − operator


    To subtract two numbers, use the − operator, as in the following example:


    ```

    let Salary=3000

    let Expenses=2500

    let MyMoney="$Salary - $Expenses"

    ```


    let Salary=3000 tells the computer to create a variable by the name of Salary
    and to assign that variable the value 3000.


    let Expenses=2500 tells the computer to create a variable by the name of Expenses
    and to assign that variable the value 2500.


    let MyMoney="​$Salary - $Expenses" tells the computer to create a variable by
    the name of MyMoney and to assign it the value of Salary minus the value of Expenses.
    In this example, the value of MyMoney equals 3000 − 2500, or 500.


    # Multiplying two numbers

    by using the * operator


    To multiply two numbers together, use the * operator, as in the following example:


    ```

    let Computers=100

    let Commission=5

    let TotalCom="Computers * $Commission"

    ```


    let Computers=100 tells the computer to create a variable by the name of Computers
    and to assign that variable the value 100.


    let Commission=5 tells the computer to create a variable by the name of Commission
    and to assign that variable the value 5. (This formula gives you a five-dollar
    commission on each computer.)


    let TotalCom="Computers * Commission" tells the computer to create a variable
    by the name of TotalCom and to assign it the value of Computers times the value
    of Commission. In this example, the value of TotalCom equals 100 * 5, or 500.'
