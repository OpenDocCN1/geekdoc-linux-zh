- pgno: 143
  md: 'You can stuff as many instructions as you need inside the loop. Your biggest
    challenge is your ability to keep track of the programming instructions that you
    enter. Use your common sense as a guide.


    # When to Use a for in Loop


    No hard-and-fast rules exist to tell you when to use a **for in** loop. You just
    need to use your best judgment. (I guess you didn’t need to go to MIT after all.)


    The following list describes the times when you can use a **for in** loop:


    +   ✓ You need to do the same thing to more than one string value.

    +   ✓ You want to use a series of string values in a certain sequence.


    Say, for example, that you want your program to give your five employees an increase
    in salary. Aren’t you a nice person? The necessary steps are as follows:


    +   1. Look up the employee’s salary in the payroll file.

    +   2. Calculate the new salary.

    +   3. Save the new salary to the payroll file.


    You place the name of each employee in the list that you associate with the **for
    in** loop. The program then uses the name of each employee in sequence to find
    the employee’s record, perform the necessary math, and place the employee’s record
    back into the file.


    # How the for in Loop Works


    Here’s something to do if you’re ready to show off your new programming talents
    to your friends. Write a program that greets each one of them personally after
    you gather them around your computer. You can accomplish this task in either of
    a couple ways.


    You can, for example, type the following code:


    ```

    ```

    echo "Hello, Mary."

    echo "Hello, Joe."

    echo "Hello, Sue."

    ```

    ```


    This program simply repeats the same instruction three times. Each time it changes
    the name to greet another one of your friends.'
