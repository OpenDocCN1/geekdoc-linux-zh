- pgno: 270
  md: '# Chapter 22

    Ten of the Most Useful Linux Utilities


    In This Chapter


    *   Making your printing look fancy

    *   Checking the spelling in your documents

    *   Sorting information in your files

    *   Checking differences in files

    *   Comparing two files

    *   Making changes in a large file

    *   Splitting up large files

    *   Searching through a file

    *   Moving files between computers

    *   Cutting fields from a database file


    One of the biggest challenges that you face in building a Linux program is assembling
    a bunch of utility programs that you or someone else has written. The whole philosophy
    of Linux, in fact, revolves around creating small utility programs, each program
    performing one task very well.


    Programmers distribute hundreds of utility programs for the Linux operating system,
    and even more are available on the Internet. This book isn''t big enough to discuss
    all the utilities out there, but I want to show you my top-ten list of useful
    Linux utilities. (My list may, of course, vary from David Letterman''s list.)'
  merge: -1
