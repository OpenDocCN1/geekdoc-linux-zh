    \ of copying the function into the second program, you can make the function in\
    \ your first program available to the second program.\n\nYou can share functions\
    \ between subprograms by using the export command to export the function. You\
    \ then call the subprogram from within your second program. The following example\
    \ shows you how to do so:\n\n```\n#! /bin/bash\nclear\nfunction verify\n{\n  if\
    \ [ $# -ne 2 ]\n  then\n    echo \"Wrong number of arguments!\"\n  else\n    if\
    \ [ $1 -eq \"Bob\" ] && [ $2 -eq \"565\" ]\n    then\n      echo \"Verified\"\n\
    \    else\n      echo \"Rejected\"\n    fi\n  fi\n}\nexport verify\nsubprogram1\n\
    ```\n\nFollowing is a description of what you add to the last lines of the function\
    \ definition to share the function:\n\n+   1. Following the close French brace\
    \ that ends the function definition, you use the export command to make the verify\
    \ function available to the subprogram that I call subprogram1.\n\n+   2. The\
    \ last line of the program calls subprogram1, which the following example shows.\
    \ Notice that subprogram1 doesn’t contain the function definition for verify,\
    \ but the subprogram calls the verify function, because the export command exports\
    \ the verify function before calling the subprogram.\n\n```\n#! /bin/bash\nclear\n\
    verify \"Bob\" \"565\"\n```\n\n# Returning Information from a Function\n\nA function\
    \ is like a two-way street because you can send information to the function and\
    \ the function can send information back to your program. Say that, instead of\
    \ the verify function displaying a message stating whether the"
