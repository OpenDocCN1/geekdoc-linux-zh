- pgno: 207
  md: '# Printing a Line of Text


    The simplest program that you can write is one to display a line of text on-screen
    by using the `echo` command.


    The following example shows you how to do so:


    ```

    echo "Hello world."

    ```


    Your screen thus shows the following text:


    ```

    Hello World.

    ```


    You can send the same line of text directly to the printer by using the pipe operator
    (|), following it with the call to the `lp` utility, as in the following example:


    ```

    echo "Hello world." | lp

    ```


    You''re telling your computer to use the `echo` command to display the phrase
    *Hello world*. You then tell the computer to take those characters and send them
    to the `lp` utility. This process is known as *piping*. (Nerds call this process
    taking the output of the `echo` command and piping it into the input of the `lp`
    utility.) The `lp` utility then takes these characters and sends them to your
    printer.


    # Printing a File


    Sending a single line of text directly to the printer isn''t very smart programming.
    A better sign of programming is not to repeat any code.


    In the following example, the program is calling the `lp` utility a couple of
    times:


    ```

    echo "Hello world." | lpecho "How are you doing?" | lp

    ```


    ![](img/05279073f26be7df99b3c487360dec6a_207_0.png)


    A better way of printing is to write all the text to a file. After you safely
    store the information on your hard disk, you can send the entire file to the `lp`
    utility. The following example shows you how to put all the text into a file by
    the name of *myfile*:


    ```

    echo "Hello world." > myfileecho "How are you doing?" >> myfile

    ```'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Pipes and redirection (and other Linux 101 things)


    If you’re a little confused about pipes, redirection, and all the other nerdy
    stuff, don’t let it con-cern you.


    Now you want to change flow away from the normal destination (the screen) and
    send it to another destination (a file). Just give the com-puter the redirection
    signal ($>$). After the cars get there, they also stop. The trip is over.


    Think of it this way: You’re a traffic cop trying to keep cars (information) flowing
    in the right direction. You can give one of three signals to control the flow:
    none, redirection ($>$), or piping ($|$).


    Finally, you may want to send the traffic to another highway (utility). Give your
    computer the pipe signal ($|$). After the cars get there, they don’t stop. Instead,
    another program takes control, and the cars keep moving.


    Consider that you want traffic to flow normally. The best signal to give is none.
    Nerds call this sending information to *standard out*, which is usually the screen.
    After the cars get there, they stop. The trip is over.


    Next, you can use the cat utility to read the information from the file and send
    it to the lp utility for printing. The cat utility requires only the name of your
    file. You issue the following command:


    ```

    cat myFile | lp

    ```


    You’re telling your computer to call the cat utility. The cat utility opens the
    file *myFile* and reads each character. Normally, as it reads each character,
    the cat utility displays the character on-screen. The pipe character ($|$), however,
    tells the computer to send the characters to the lp utility rather than to the
    screen. The lp utility then passes the characters to the printer.


    # Printing a Database


    You print information in a database (see Chapter 16) in the same way that you
    print a file. First, you create a database, as follows:


    ```

    echo "Bob Smith 555-1212" > friends

    echo "Mary Jones 555-5555" >> friends

    echo "Tom Adams 555-7777" >> friends

    ```'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'Each line of this program appends the information to the friends database.
    After the program finishes, the database contains the names and telephone numbers
    of three persons.


    You use the following command to print all the information from the database:


    ```

    `cat friends | lp`

    ```


    You print database information the same way that you print the contents of a file.


    Printing the entire database is sometimes useful, but frequently you want to print
    only a portion of the information. To do so, you need to call the gawk utility
    (which I discuss in Chapter 16).


    Use the following command to print all the information in the database that refers
    to our friend *Smith*:


    ```

    `gawk ''/Smith/ {print $1, $2, $3}'' friends | lp`

    ```


    This command tells your computer to take the following steps:


    +   1. Look for the character *Smith* in the database file friends.

    +   2. Send the first, second, and third columns of all rows that match *Smith*
    to the `lp` utility.

    +   3. Tell the `lp` utility to send the rows that it receives from the gawk utility
    to the printer.


    # Avoid searching again


    One major drawback to sending the results of your search directly to the printer
    is telling the computer to search the database each time that you want to reprint
    the information. This process is time consuming, because your computer must perform
    the same task repeatedly.


    A better way is to tell the computer to put the results of the search into a file
    and then send the file to the printer. You issue the following commands to do
    so:


    ```

    ```

    gawk ''/Smith/ {print $1, $2, $3}'' friends > myfriends

    cat myfriends | lp

    ```

    ```


    The following steps describe what''s happening:'
  merge: -1
  img_proc: true
- pgno: 210
  md: '+   1. You tell the computer to use the `gawk` utility to find rows in the
    `friends` database that contain the word `Smith`.

    +   2. It copies columns 1, 2, and 3 of each of those rows to the `myfriends`
    file.

    +   3. The program calls the `cat` utility to read the `myfriends` file into the
    `lp` utility.

    +   4. The `lp` utility then sends the contents of the `myfriends` file to the
    printer.


    # Printing comments before the data


    Sometimes you need to print comments before the information from the database
    prints. This procedure isn''t so difficult, as the following example shows:


    ```

    echo "Here are some of my best friends" > myfriends

    gawk ''/Smith/ {print $1, $2, $3}'' friends >> myfriends

    cat myfriends | lp

    ```


    The following steps describe how this procedure works:


    +   1. The first line tells the computer to copy a comment to the file called
    `myfriends`.

    +   2. The second line tells the computer to find rows that contain `Smith` and
    to append the entire row to the file `myfriends` (which means that the data appears
    below the comments in the file).

    +   3. The last line tells the computer to use the `cat` utility to send the contents
    of the file `myfriends` to the `lp` utility for printing.


    # Printing comments after the data


    You can also print comments after the data. Issue the following commands to do
    so:


    ```

    gawk ''/Smith/ {print $1, $2, $3}'' friends > myfriends

    echo "I have more friends than this." >> myfriends

    cat myfriends | lp

    ```


    This technique is the same one that you use in the preceding example except that
    the comment statement appears below the call to the `gawk` utility.'
