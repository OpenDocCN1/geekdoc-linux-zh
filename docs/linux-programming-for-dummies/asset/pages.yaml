- pgno: 264
  md: 'utility uses *switches* to identify the next value on the command line. (See
    the section "Passing an Argument to an E-mail Program" earlier in the chapter,
    for a quick reference or refer to Chapter 20 for more details.)


    You, too, can use switches in your program to identify its parameters. Switches
    are a handy way to enable the person using your e-mail program to place arguments
    on the command line without regard to the order the arguments are to appear there.


    You just make up the symbols that you use for switches. You simply use -s for
    subject, -f for the name of the file that contains the e-mail message, and -d
    for the destination address. Use the hyphen to differentiate the switch from other
    arguments on the command line. Linux doesn''t care whether you decide to use the
    hyphen or leave it off.


    You can use any characters for the switch symbol, although using characters that
    give a clue to the argument that the switch refers to makes sense. The s, for
    example, stands for *subject*, the f for *filename*, and the d for *destination
    address*.


    Next, use the *if* statement to compare the number of ($#) arguments from the
    command line with a number that you expect. The number of arguments includes the
    switch symbol.


    In the previous example, you reference two arguments if you want to use the default
    values. You use four arguments for the same amount of information if you''re using
    switches. The first argument is the switch symbol; the second argument is the
    information that relates to the first argument; and the third argument is the
    switch symbol that relates to the fourth argument, which is the information.


    After the *if* statement identifies the current number of arguments, you use a
    series of *if* statements to determine which switch symbol the program''s using
    (see Chapter 7).


    After the program identifies the switch symbol, you can tell the program to assign
    the value of the next argument to a variable by using the *declare* command (see
    Chapter 4). The name of the variable indicates the type of information that the
    variable contains.


    I call one variable *subject* because I tell the program to assign the *subject*
    argument to the variable. The another variable I call *file*, and I have the program
    assign the *file* argument to it. And the third variable I call *destination*,
    which I assign the *destination* argument. The program then uses variables to
    provide the *mail* utility with the information it needs to send an e-mail.'
  merge: -1
  img_proc: true
