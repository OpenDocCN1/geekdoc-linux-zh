    # The case Statement in the User Interface


    The most common use for the case statement is with your program’s user interface.
    After your program displays your menu, it must wait for someone to type a key
    from the keyboard. The person using your program makes a selection, and then your
    program reads the selection and compares it to specific values by using the case
    statement.


    Say that you want to create an electronic telephone book. I’m keeping it simple
    and saying that you want only two features: display a telephone number and add
    a telephone number to the electronic telephone book. First, these features appear
    on-screen as menu options; then the program reads the user’s selection from the
    keyboard. You use the case statement to compare the user’s selection with available
    features. In the following example, the program simply displays a message telling
    which selection the user makes. (Other instructions replace these messages in
    a more complex version of this program, of course.)


    ```

    #!/bin/bash

    clear

    echo " "

    echo " The Telephone Book "

    echo " "

    echo " 1. Display A Telephone Number "

    echo " 2. Add A New Telephone Number "

    echo " "

    ```'
