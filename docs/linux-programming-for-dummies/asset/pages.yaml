- pgno: 177
  md: '# 154

    Part V: Writing Subprograms


    Say that you want to create a program that manages your personal telephone directory.
    The program incorporates the following tasks:


    +   - Display a menu.

    +   - Read the user''s selection.

    +   - Determine the selection that the user makes.

    +   - Find a telephone listing.

    +   - Add a new telephone listing to the file.

    +   - Modify an existing telephone listing in the file.

    +   - Quit the program.

    +   - Print a telephone listing.


    Placing the first three tasks in the program itself makes sense because these
    tasks are the central functions of the program. You make the task of quitting
    the program a part of the program. The other tasks you build into subprograms,
    because these tasks are relatively self-contained pieces of the program. You don''t
    really need the menu, for example, to find a telephone listing. You can simply
    run a subprogram that takes care of this task.


    You give each subprogram a name that identifies the task that the subprogram performs.
    The `findlisting` subprogram, for example, finds a telephone listing in the file.
    After you build this subprogram, you can run it from the command line—independent
    from the program. The instructions to ask the user for the name of the person
    that the user wants to call and the instructions to locate and display the telephone
    number on-screen are all part of the `findlisting` subprogram.


    After you determine that each of these subprograms runs smoothly, you can make
    the names of the subprograms part of your program. As your program sees the name
    of a subprogram, the program executes the subprogram just as you do at the command
    line in testing it. This process is also known as *calling the subprogram* from
    your program. The following example shows you how the instructions look:


    ```

    ```

    clear

    echo "Telephone Directory"

    echo ""

    echo "1. Find Listing"

    echo "2. Add Listing"

    echo "3. Modify Listing"

    echo "4. Print Listing"

    echo "0. Quit"

    echo ""

    read selection

    case $selection in

    ```

    ```'
  merge: -1
