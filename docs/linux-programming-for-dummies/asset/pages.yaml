- pgno: 273
  md: 'Suppose that you type the following text in a document and then save the document
    in a file that you name letter:


    ```

    Dear Mary,

    We had a go time Saturday. Let''s do it again soon.

    ```


    Use the following command to have spell take a look at the file:


    ```

    spell letter

    ```


    The following lines then appear on-screen:


    ```

    nab

    goo

    ```


    Using the spell utility has a few drawbacks, however, as I describe in the following
    list:


    +   The spell utility catches any word that it doesn''t find in its dictionary
    file, but the word may not necessarily be a misspelling. The spell utility really
    compares the words in your document against those that the programmer entered
    into the spell utility''s dictionary. In an address where the town is Ridgefield
    Park, for example, the spell utility reports that Ridgefield is an incorrect spelling.
    In fact, Ridgefield is correct but just doesn''t appear in the spell utility''s
    dictionary.

    +   The spell utility lists misspelled words — but because it doesn''t show you
    where they appear in the document, you must find them yourself.


    # Sorting Stuff in Your Files: sort


    Your programs can produce a list of names, but someone who uses your program may
    want you to sort the list. You can spend many evenings researching ways to write
    a program to sort the list, or you can simply use the sort utility.


    Suppose that you place some names in a file that you call names. You can type
    the following line to sort the list:


    ```

    sort names

    ```


    The sort utility rearranges a list in ascending order (where the As come before
    the Bs and the 1s come before the 2s) and places a lowercase letter ahead of its
    equivalent uppercase letter. You also can change the utility to sort in descending
    order (where the Bs come before the As and the 2s come before the 1s) by using
    the -r option, as follows:


    ```

    sort -r names

    ```'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'To set the `sort` utility to ignore the case distinction, use the `-f` option:


    ```

    sort -f names

    ```


    Another `sort` option (`-n`) tells the `sort` utility to order the file in numerical
    order. Still another `sort` option (`-m`) tells the `sort` utility to order by
    month. The `-m` `sort` option places `January` before `February`, `February` before
    `March`, and so on.


    One drawback as you''re using the `sort` utility is that the utility doesn''t
    save the new, sorted list in the same file that contains the original, unsorted
    list. After you `sort` the `names` file, the results appear on-screen unless you
    use the redirection operator `>` to save the information to another file. (For
    a description of redirection operators, see `Chapter 5`.) If you want to save
    the results to a file, you must use the redirection operator.


    What if you want to place the ordered information in the same file? The following
    example shows you how to do so:


    ```

    sort -f names > newnames

    mv newnames > names

    ```


    The `sort` utility reorders the `names` file (ignoring the case distinction) and
    saves the sorted information in the `newnames` file. The last line renames the
    `newnames` file to the old file, `names`, by using the `move` (`mv`) command.


    # ## Checking Differences Between Files: `diff`


    After you begin programming in Linux, you inevitably come across the problem of
    having two files with practically the same name that contain your program. You
    may have this problem if you save a backup copy of your work, modify one copy,
    and then forget which copy you modified. How do you find the differences between
    the files?


    You can compare each file line by line yourself, or you can have the `diff` utility
    do it for you. If you type the following line on the command line, you tell the
    `diff` utility to read `file1` and `file2`, compare the two files, and indicate
    the different lines in each file:


    ```

    diff file1 file2

    ```


    Say that you execute the `diff` utility from the command line. The following example
    shows what the `diff` utility may report back to you on-screen:


    ```

    <Programming is fun.

    >I hate computers.

    ```'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'Lines that begin with the less-than sign ( < ) are lines that *diff* finds
    only in *file1*; lines that begin with the greater-than sign ( > ) are lines *diff*
    finds only in *file2*. Lines in either file that the *diff* utility doesn’t display
    are lines that it finds in both files. (For more information about the < and >
    redirection operators, see Chapter 5.)


    # Comparing Files: *cmp*


    At some point, you need to determine whether two files are the same. The best
    way to answer that question is by having the *cmp* utility compare the files.
    The *cmp* utility is similar to the *diff* utility except that the *cmp* utility
    displays which *character* on a line is different in the files. The *diff* utility
    simply shows you the actual *lines* that are different in each file.


    The *cmp* utility matches both files line by line and issues a report that specifies
    where any differences occur. If you have two files that seem to refer to the same
    program, such as *firstprogram* and *programone*, you can type the following line
    to compare the files:


    ```

    cmp firstprogram programone

    ```


    The result may look something like the following example:


    ```

    firstprogram programone differ: char 34, line 3

    ```


    This line indicates that character 34 on line 3 of *programone* is different from
    character 34 on line 3 in *firstprogram*.


    # Changing Characters in a Large File: *sed*


    If you try to modify an extremely large file, you may experience a serious problem
    — your computer runs out of memory in which to store the file (known as a *buffer*).
    Your computer has no memory (RAM) to store the text that the file contains.


    Some text editors load a file into a *buffer* before you can begin editing the
    text in the file. If a file is too large for the *buffer*, you can’t use the editor
    to change the text. This limitation isn’t a problem for the *sed* utility. This
    text editor doesn’t try to load the entire file into memory — it reads one line
    at a time from your file, makes changes to the line, and sends it back to the
    file on your hard disk.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'Suppose that you want to remove all lines in the `names` file that don''t contain
    the word `Bob`. (I wonder what `Bob`''s friends did to deserve that treatment.)
    The `sed` utility normally displays the changed text on-screen. Because you want
    to store the changed information in the same file, however, `sed` by itself can''t
    help you. So you must use the redirection operator (>) to redirect the output
    of `sed` to a file that you call `names.tmp`. After the changes are safely in
    this file, you can use the `mv` command to change the name of the `names.tmp`
    file to `names`. In doing so, you replace the old `names` file with the changed
    version of the file. The following example shows you how the process for this
    procedure looks:


    ```

    ```

    $ sed "/Bob/d" names > names.tmp

    $ my_names.tmp names

    ```

    ```


    The target of your search is any character that you place between the slash marks
    (`/`). The `d` is the `sed` command for deleting a line.


    Rather than delete lines that contains the word `Bob`, you can replace `Bob` with
    `Mike` by using the following code:


    ```

    ```

    $ sed "s/Bob/Mike/;" names > names.tmp

    $ my_names.tmp names

    ```

    ```


    The `s` is the `sed` command for substituting characters. This command replaces
    the characters that you type between the first two slash marks with the characters
    that you type between the second and third slash marks.


    To remove just the word `Mike`, use the following code:


    ```

    ```

    $ sed "s/Mike//;" names > names.tmp

    $ my_names.tmp names

    ```

    ```


    This line is similar to the that of the preceding example, except that you don''t
    type a value between the second and third slash marks. The reason is that you''re
    telling the `sed` utility to substitute "nothing" for the name `Mike`.


    # # Breaking a Large File: `split`


    A large file can prove troublesome to work with in Linux because you sometimes
    can''t load the complete file into memory. So why not break down the file into
    a bunch of other files that you can easily store into your computer''s memory?


    You can manually break down a file by copying and deleting the text in the file,
    but this process can become cumbersome. A better method is to make the `split`
    utility do the job for you. By default, `split` automatically divides your file
    into several 1,000-line files. It names the new files xaa, xab, and so'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'on. **xaa** is the name the **split** utility gives to files it creates. Files
    begin with the letter x, which is followed by characters that represent the order
    of the files. For example, **xaa** is the first file and **xab** is the second.


    Suppose that you have a file by the name of **phonebook** that contains 2,500
    entries. (Boy, do you have a truckload of friends!) To break this file into several
    files, you type the following line:


    ```

    split phonebook

    ```


    The **split** utility then creates three files. The first two files contain 1,000
    entries apiece. The third file holds only 500 entries (the entries that remain).
    The following list shows the filenames that the **split** utility creates from
    this file:


    +   - xaa

    +   - xab

    +   - xac


    You can specify the maximum number of lines that each file contains by using the
    **-n** option, as follows:


    ```

    split -n filename

    ```


    Substitute the number of lines that you want for **n**. In the following example,
    I use the **split** utility to divide the **phonebook** file into smaller files.
    I want each of these smaller files to contain no more than 100 lines. (And if
    each line represents one entry in the telephone book, I’m telling the **split**
    utility to split the **phonebook** into files of 100 entries each.)


    ```

    split -100 phonebook

    ```


    # # Finding Information in a File: grep


    What can you do if you want to know which file in the current directory contains
    the name **Bob**? You can use commands in a text editor to help find **Bob**—or
    you can use the **grep** utility. In the case of a text editor, you must first
    run the text editor and load the file before you can begin searching for **Bob**.
    If you use the **grep** utility, however, you specify the word that you want to
    search for as you execute this utility. The **grep** utility searches a file for
    a set of characters and displays on-screen all the lines that contain those characters.


    If you want to find all the lines that contain **Bob** in the **namefile**, for
    example, you type the following line at the command prompt:


    ```

    grep Bob namefile

    ```'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'Now suppose that you want to find in your files the name of a specific Bob
    — Bob Smith. If your search criterion contains a space, you must place quotation
    marks around the entire phrase, as in the following example:


    ```

    grep "Bob Smith" *namefile*

    ```


    Sometimes you don''t know which file contains the name Bob. You know that it''s
    one of the hundreds of files in the current directory, but you don''t know which
    one. (That''s what I call organization!) Type the following line:


    ```

    grep Bob *

    ```


    The asterisk (*) replaces the name of the file to search. The asterisk, which
    is a *wildcard*, tells the *grep* utility to search all the files in the current
    directory. (A wildcard is a symbol that tells Linux to search through any filename
    that it finds on the hard disk.)


    # Sending Files Electronically: ftp


    You can ship your files electronically to any Internet location in the world by
    using the *ftp* utility. This utility enables you to link your computer to a remote
    computer and then send or receive one or more files. To begin, type the following
    line:


    ```

    ftp *othercomputer*

    ```


    In this example, the *ftp* utility tries to connect your computer to the computer
    by the name of *othercomputer*. If the *ftp* utility is successful, Linux prompts
    you to enter your login ID and password.


    If the *othercomputer* accepts your login ID and password, you see the *ftp* command
    prompt, which looks as follows:


    ```

    ftp>

    ```


    You can then enter *ftp* commands that instruct the *ftp* utility to perform a
    task.


    In this case, suppose that you want to transfer the *datebook* file from the *othercomputer*
    to your computer. Just type the following line:


    ```

    ftp> get *datebook*

    ```


    The *ftp* utility handles the file transfer for you. What happens, however, if
    you want to ship the same file to the other computer? The *ftp* utility is willing
    to help if you type the following line:


    ```

    ftp> put *datebook*

    ```'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'As long as the **datebook** file resides in the current directory, the **ftp**
    utility does the rest of the work for you by copying the file to the other computer.
    The original copy remains on your computer.


    After you finish transferring files, you give the **ftp** utility the following
    instruction to say good-bye to the other computer:


    ```

    ftp> bye

    ```


    The **ftp** utility then closes the transmission channel with the other computer
    and returns the Linux prompt to your screen.


    ![](img/05279073f26be7df99b3c487360dec6a_279_0.png)


    Don''t forget that you can find out more about the **ftp** utility (or any other
    utility, for that matter), by using the **man** utility that I explain at the
    beginning of the chapter.


    # # Removing Fields from a Database: cut


    A database file is similar to a regular file except that it organizes the information
    into columns and rows. (A column is also known as a **field**, and a row is known
    as a **record**.) You can remove fields from a database file by using the **cut**
    utility. (For more information about databases, refer to Chapter 16.)


    Suppose that you have a database file by the name **phonelist** that contains
    the following information:


    | Name       | Number     |

    |------------|------------|

    | Bob Smith  | 555-1212   |

    | Mary Jones | 555-5555   |

    | Tom Adams  | 555-7777   |


    To remove the names to a file that you call **names**, you type the following
    line:


    ```

    cut -f1,2 phonelist > names

    ```


    The **-f** option tells the **cut** utility that you want to cut columns 1 and
    2 from the **phonelist** file. The redirection operator (>) takes the columns
    that you cut from the **phonelist** file and places them in the **names** file.
    (To find out about the redirection operators, see Chapter 5.)'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# **Chapter 23**


    # ## Ten Sources of More Linux Programming Information


    **In This Chapter**


    +   ❖ Local colleges and universities

    +   ❖ Technical conferences

    +   ❖ Online forums and newsgroups

    +   ❖ Online documentation

    +   ❖ Computing magazines and other programming books

    +   ❖ User groups

    +   ❖ Linux authors


    **B**ecause you''re a beginner in the area of Linux programming, much more Linux
    is out there for you to discover than I can cover in this book. Even professional
    programmers must hit the books, take courses, and go to conferences to keep up
    with the latest changes in technology — and you can expect to do the same. In
    this chapter, I suggest a few ways that you can find out more about Linux programming.


    # ### Go Back to School at Your Local College


    One of the better places to pick up some tricks and tips of the Linux trade is
    close to home, at your local college.


    You don''t need to go to MIT to find out about Linux programming, and you certainly
    don''t need to become a computer nerd. As I mention frequently in this book, anyone
    with a little common sense and a great deal of patience can teach himself to program
    a computer.'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'Sometimes, however, you need more help in locating this type of information
    than a book can provide. You need someone to look over your shoulder until you
    get on the right track — and that person (the instructor) is usually at your local
    college.


    Many four-year universities and community colleges offer courses in Linux programming.
    Give your local college a call to find out when the next course is starting. Then
    make sure that you find out how to register for the course.


    You don’t need to go for the whole college degree. These institutions love to
    have students who just want to brush up on their skills by taking a course or
    two. (They hope that you get hooked and come back for more.)


    # ## Attend a Conference


    A good source for the latest information about Linux and Linux programming is
    a computer conference. Computer professionals, vendors, and nerd wannabes gather
    at these meetings to exchange ideas. Linux is such a hot topic these days that
    Linux and Linux programming are usually discussion topics at conferences that
    don’t even have Linux in their names.


    Trade publications such as *PC Week* and *InfoWorld* widely advertise popular
    conferences, such as the Linux World Expo hosted by IDG. Keep your eyes open for
    these ads, which usually list scheduled speakers and topics. Some presentations
    cover topics that may prove of interest to you (and others that you can live without!).


    Plan to pay for this experience. Conferences usually take place in major cities
    (and in Hawaii). You must pay for airfare, accommodations, and a fee to get into
    the conference. You may also need to pay for each presentation that you attend.


    # ## Visit Yahoo!


    *Yahoo!* (at www.yahoo.com) covers various aspects of Linux and Linux programming
    so make sure that you stop by the site whenever you can to read the latest about
    Linux. Yahoo! also offers links to many sites that provide assistance to Linux
    programmers such as yourself.


    You can find the Linux section of Yahoo! by typing **www.yahoo.com** in your browser
    and then, at Yahoo!''s site, entering the search word **linux**. You can also
    type **http://fullcoverage.yahoo.com/Full_Coverage/Tech/Linux/** into your Web
    browser''s Address text box if you want to go directly to the Linux Web pages.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Find a Newsgroup on the Internet


    *Usenet news* is the part of the Internet that you can tap for sources of information
    from around the world. Each of the newsgroups that comprise this service focuses
    on a particular topic. (If you''re still unsure of this Internet *stuff*, consider
    a book such as *The Internet For Dummies*, by John Levine and Carol Baroudi, available
    from IDG Books Worldwide, Inc.)


    Thousands of newsgroups are available. You can use your Internet browser to skim
    through the available newsgroups and then choose the ones to which you want to
    subscribe (for free!).


    Every time that you visit Usenet news, your browser displays your list of newsgroups.
    After you choose one in which you want to participate, your browser shows you
    all the postings for that group.


    To find newsgroups, you use keywords with your browser''s built-in search feature
    to quickly skim the list for newsgroups in which you may have an interest. If
    you enter the keyword **Linux**, for example, a large list of newsgroups that
    contain information about Linux appears on-screen.


    After you enter a newsgroup, a list of subjects appears that briefly describes
    the related messages people have posted. (The messages can contain anything from
    meaningful information to just plain garbage.) Skim the subject list to see whether
    any of them seem interesting. If you find one, open the message and see what that
    person had to say.


    You can post (send) your own message to a newsgroup by using your Internet browser.
    You can comment on other messages, post questions, or answer questions that other
    people post.


    You may need to wait a while for the newsgroup to post your messages. Be patient.
    After they appear, keep watching the subject listings for the newsgroup to see
    whether anyone responds to your posting.


    ![](img/05279073f26be7df99b3c487360dec6a_282_0.png)


    A word of caution: Just because someone posts something doesn''t necessarily mean
    that it''s true. Even someone with good intentions can post incorrect information.


    # Review Online Documentation


    If you have questions about Linux programming or any of the Linux utilities, you
    want answers to your questions quickly and accurately. Where can you find a response,
    however, especially if you''re sitting in front of your computer at 2 a.m.?'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'Ask your computer! One of the best features of Linux is its man utility, which
    displays the *manual* pages for the operating system. If you''re unsure about
    how to use the sort utility, for example, just type the following at the Linux
    command prompt:


    ```

    man sort

    ```


    Your computer then displays the manual for the sort utility. Although the manual
    isn''t as well written as this book (ahem), it does provide a complete discussion
    of topics, including how to implement all the options. What more can you ask for
    (except for someone else to do the programming)?


    # Read Other Books about Linux


    You want to expand your knowledge of Linux in two directions: programming and
    the operating system. This book covers the programming aspect of your Linux education.
    But Linux also runs many computers, the same way that Windows does. To find out
    more about the Linux operating system, pick up a copy of *Linux For Dummies*,
    by John R. Levine and Margy Levine Young (published by IDG Books Worldwide, Inc.).


    # Subscribe to Computing Magazines


    Hit the newsstands and search the racks for computer magazines. A vast array of
    magazines is available for just about every imaginable aspect of computing.


    Don''t limit yourself to newsstands — bookstores and major computer stores also
    offer a wide selection of computer magazines. Keep your eyes open for articles
    and columns about Linux and Linux programming. Those magazines are the ones that
    you want to subscribe to.


    Also check out trade magazines, such as *Linux World*, *PC Week*, and *InfoWorld*.
    They talk about the latest developments in the computer industry and the world
    of technology and are must-reads for serious programmers.


    # Join or Create a Linux Programming Club


    You''re probably not the only person in your town or city with an interest in
    computer programming. Computer clubs are a common gathering place for like-minded
    folks.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'Computer clubs are great places to exchange ideas about all sorts of aspects
    of computers, including Linux programming.


    Ask around to find your local computer club. Start with the computer teachers
    in your local school district and the manager of your local computer store. They
    usually know whether a club exists. If you can’t find a local club, ask the teacher
    or manager to help you organize one.


    # Ask for Technical Help at Your Local College Computer Lab


    If you end up in a bind, stop by the computer lab at your local college or university.
    All sorts of nerds hang out there who’re usually more than happy to give you an
    opinion about how to solve your problem.


    Try to build a friendship with a few of these folks. Before long, you become part
    of the family.


    Computer labs are usually open to members of the general student body. Teaching
    assistants or advanced computer science majors looking to make a few extra dollars
    oversee the labs. Taking a course or two to become an official student also helps
    gain access to these labs.


    # Send E-Mail to Authors of Articles about Linux Programming


    One way to quiz the experts is to send an e-mail message to them. Most authors
    of computer articles and books now include their e-mail address as part of their
    bylines. If you have a question about an article or book topic, ask your question
    in an e-mail message.


    Authors are usually happy to hear from their readers and do their best to answer
    questions. Keep in mind, however, that they don’t want to become your tutor or
    your pen pal. Because authors may also be busy with other projects, your request
    can have a low priority with them.'
  merge: -1
  img_proc: true
