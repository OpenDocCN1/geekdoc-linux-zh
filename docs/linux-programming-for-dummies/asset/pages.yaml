- pgno: 308
  md: '# **Appendix B**


    # ## When the Moon Hits Your Eye Like a Big Piece of \`vi\`


    **T**o create a Linux program, you must type all the instructions necessary for
    the program to carry out the task that you want into your program file.


    You enter those instructions in your program file by using a text editor. The
    text editor in Linux that people probably use most widely (and sometimes hate
    the most because of the awkwardness of entering text-editor commands) is known
    as *vi*. (I even give you a brief introduction to *vi* in Chapter 3.)


    Although *vi* isn''t normally a discussion topic in a Linux programming book (because
    it''s usually a topic in a more comprehensive book about Linux), I think that
    you can benefit from a quick overview of how to use *vi* to write your programs.
    This appendix serves as your basic introduction to *vi* (and as a good review
    if you''re already familiar with *vi*.


    ![](img/05279073f26be7df99b3c487360dec6a_308_0.png)


    Become comfortable using *vi* because you may find that it''s the only text editor
    available on your copy of Linux.


    # **Launching *vi***


    You can start up the *vi* editor in either of two ways. The first way is to simply
    type *vi* at the command line and press the Enter key. Here''s how you do it using
    the *bash* shell — which the $ prompt indicates — as an example:


    ```

    $ vi

    ```


    This keyboard gymnastics causes *vi* to open an empty document on-screen. Give
    the document a name before you save the document to a file.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'The other way to begin \u0061\u007a is to specify the name of the file as you
    start up \u0061\u007a. Say, for example, that you want to create a file that you
    call myfirstprogram. Type the following on the command line:


    ```

    $ vi myfirstprogram

    ```


    The \u0061\u007a text editor first tries to find the myfirstprogram file in your
    current directory. If it finds the file, Linux displays the first page of the
    file on-screen within the \u0061\u007a text editor. If it doesn\u2019t find the
    file, however, Linux displays an empty page.


    If you later want to save myfirstprogram to a file, you don\u2019t need to specify
    the name of the file, because the \u0061\u007a text editor automatically saves
    your work with the name that you specify as you start \u0061\u007a.


    # No Mouse!?


    All of us face life\u2019s disappointments.


    The \u0061\u007a text editor is primitive if you compare it to today\u2019s standards
    for text-editing programs. You don\u2019t find any conveniences that you expect
    to see with a word processor. For one thing, you can move your mouse all you want,
    but the \u0061\u007a text editor ignores it (how dare it!) unless you\u2019re
    running \u0061\u007a in an X Windows environment. (X Windows is software that
    enables you to open multiple windows on-screen at the same time.)


    So you must settle for either using the arrow keys or issuing one of the \u0061\u007a
    text editor commands to move the cursor around the page.


    ![](img/05279073f26be7df99b3c487360dec6a_309_0.png)


    You can avoid frustration in trying to move the cursor in the \u0061\u007a text
    editor by forgetting the way you move the cursor in other programs. The sooner
    that you become comfortable using the arrow keys or issuing the necessary \u0061\u007a
    text editor commands, the sooner you can start writing your Linux program.


    # The Mode-us Operandi of \u0061\u007a


    The \u0061\u007a text editor interprets what you type in three different ways.
    At first contact, you may think that you and the \u0061\u007a text editor are
    experiencing difficulties in communicating with each other. That\u2019s true as
    you first begin using \u0061\u007a. After you practice awhile, however, you get
    on the right wavelength to communicate with \u0061\u007a.'
  merge: -1
  img_proc: true
- pgno: 310
  md: "The three modes of vi are as follows:\n\n+   * Command mode: In this mode,\
    \ vi interprets everything that you type on your keyboard as a command telling\
    \ it to do something. Pressing the letter J in the command mode, for example,\
    \ tells the vi text editor to move the cursor down one line on-screen.\n+   \n\
    +   Note: The vi text editor starts in the command mode. You can also enter the\
    \ command mode from any other mode at any time by pressing Esc.\n\n+   * Input\
    \ mode: Everything that you type on your keyboard goes on-screen and in the file\
    \ as you save the pages (just as with a regular word processor). Pressing the\
    \ letter J while the vi text editor is in the input mode, for example, displays\
    \ the letter J at the cursor.\n+   \n+   You can enter the input mode from the\
    \ command mode by pressing I or a. Pressing the letter i inserts characters on\
    \ the page at the cursor, and pressing the letter a appends characters to the\
    \ page directly after the cursor.\n\n+   * Last line mode: In this mode, vi interprets\
    \ everything that you type on your keyboard as a last-line command. In other words,\
    \ the characters appear on the last line of the vi text editor at the bottom of\
    \ your screen.\n+   \n+   You can enter the last line mode from the command mode\
    \ by entering a colon (:). You can press the letter q in the last line mode, for\
    \ example, which tells the vi text editor to exit (quit).\n\n# ### Waiting for\
    \ your command, sir\n\nIf you start the vi text editor without opening a previously\
    \ saved file, you see a nearly empty page on-screen; the tilde (~) character appears\
    \ down the left margin (see Figure B-1).\n\nThis look gives you the incorrect\
    \ impression that the tilde is the vi text editor's way of telling you where a\
    \ line on the page begins. The tilde actually signifies that these line are empty\
    \ lines. But don't think that an empty line is a blank line: It isn't. An empty\
    \ line means that the line doesn't really exist — whereas a blank line means that\
    \ the line exists but doesn't have any characters on the line.\n\nRemember that\
    \ the vi text editor starts up in the command mode; it interprets anything that\
    \ you type as a command. This feature is quite different than that of other text\
    \ editors such as Windows Notepad, which starts up in the insert mode. (Notepad\
    \ doesn't even have a separate command mode!)"
  merge: -1
  img_proc: true
- pgno: 311
  md: '# 288




    ![](img/05279073f26be7df99b3c487360dec6a_311_0.png)


    Not remembering this command mode versus input mode stuff is a common mistake
    many Linux programmers make as they first start using the `vi` text editor. The
    programmer often begins typing away without looking at the screen. If he does
    glance at the screen, only part of the text appears. Why? Because as the programmer
    is typing, the `vi` text editor is in the command mode. The `vi` text editor interprets
    each letter as a command and not as text. So `vi` ignores most of the letters
    because the letters aren’t commands. As soon as the programmer enters an **i**,
    however, `vi` enters the insert mode and enters all the subsequent letters directly
    on the page.


    # Get me out of here!


    You can exit the `vi` text editor by using one of several commands. The fastest
    way is to press the **Esc** key to enter the command mode and then type **ZZ**
    (make sure that you press and hold the Shift key to make the Zs capitals!). This
    action saves any changes to the file that you make and exits the `vi` text editor.
    If you don’t make any changes, you don’t save the file, but you still exit `vi`.


    # Moving Around Inside Your File


    Here’s a good way for you to pick up the various `vi` commands that you use to
    get you around your files. Find a large text file on your hard disk. A text file
    is almost like a word-processing file, except those special symbols that'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'control things such as the font and size of the letters are missing from the
    file. Try to find a readme or readme.txt file on your hard disk. These files sometimes
    come with other software to keep you up-to-date on the latest changes occurring
    with the program.


    If you can''t find any text files, however, you can use vi to create one. Just
    begin vi; press i to enter the input mode, and then type a whole bunch of lines
    on the page. Hey, why not just type some of the Linux code that you see in this
    book? You may go on to the next page if you go overboard with your typing — but
    that''s just fine.


    # Just line up


    The vi text editor displays your text on lines shown on-screen. It automatically
    places the cursor on the first character of the first line of the text. Each line
    of text (including those lines that can''t fit on-screen but exist in the file)
    has a number. The first line is number 1; the second line is number 2, and so
    on.


    You can display the number of the line that the cursor is on by pressing Ctrl-G,
    I do that in Figure B-2, where I have my first program open. Notice that the line
    number appears at the bottom of the screen. (The cursor is on line 3 of a 14-line
    file.)


    ![](img/05279073f26be7df99b3c487360dec6a_312_0.png)


    ```

