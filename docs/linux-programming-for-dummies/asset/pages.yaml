  md: 'this item be causing the problem? You can erase this instruction and rerun
    the program to see what happens. If this particular instruction isn''t causing
    the problem, however, you must remember which instruction you deleted so that
    you can add it to your program again. Check out the following example:


    ```

    ''Change these values for each region

    declare REGIONAL_OFFICE="Boston"

    declare REGIONAL_MGR="Mary Smith"

    let REGIONAL_SALES=1000000


    ''@display the opening screen

    menu!

    ```


    You can now delete the suspect line and try again. A better method, however, is
    simply to place a comment sign (#) as the first character of the instruction,
    as follows:


    ```

    #Change these values for each region

    declare REGIONAL_OFFICE="Boston"

    declare REGIONAL_MGR="Mary Smith"

    #let REGIONAL_SALES=1000000


    ''#display the opening screen

    menu!

    ```


    The computer then ignores the instruction `#let REGIONAL_SALES=1000000` just as
    though you erased it. To restore the instruction, all you need to do is remove
    the comment sign.


    # Test your programming knowledge


    +   1. What do you use the number sign (#) for in your program?

    +      a. To send the line of code to the printer.

    +      b. To tell the computer to ignore all the characters that follow the number
    sign on the line.

    +      c. To create a tic-tac-toe board on-screen.

    +      d. To draw a border around the screen.


    +   2. Why do you want to use comments in your program?

    +      a. To tell a private joke to your friend who''s reading your program.

    +      b. To summarize how your program works.

    +      c. To reduce the amount of code.

    +      d. To prove that your program works.

    +      *Answers: 1)* b. See "How to Create Comments." 2) b. See "How to Create
    Comments."'
