- pgno: 254
  md: 'Linux then follows all the instructions that you place inside your program.
    The first instruction tells Linux to run the `bash` shell. Next, you tell Linux
    to run the `mail` utility to send `bob@mycomputer` the e-mail message that variable
    `$1` refers to. The `mail` utility also includes the subject `Good News`.


    Whenever Linux sees `$1`, Linux immediately knows that `$1` is a placeholder for
    the value that you type beside the program name at the command prompt.


    Before Linux calls the `mail` utility, Linux replaces the `$1` with `memo1`; then
    it starts the `mail` utility and passes all the information necessary to send
    the e-mail to the `mail` utility.


    # ### Passing the destination address


    On several occasions, I’ve written a program to send an e-mail. Each time that
    I ran the program, I wanted to change the destination address. Originally, I wrote
    the address as part of the program, which made sense at the time but became cumbersome.
    Each time that I wanted to change the destination address, I needed to load the
    program in `vi` and make the changes.


    I discovered, however, that I can avoid the hassle of changing the program by
    passing the destination address as an argument to the program. To do so, follow
    these steps:


    +   1.  First load the program that you use in the section “Passing the e-mail
    message,” earlier in this chapter, into `vi` and change the program to look as
    follows:


    ```

    ```

    #!/bin/bash

    mail -s "Good News" $1 < memo1

    ```

    ```


    +   2.  Next, save your program by pressing Enter and using the Shift+ZZ key combination.


    See the preceding section, “Passing the e-mail message,” for further information
    on using this shortcut. Because you can use the same program that you use in that
    section, you don’t need to use the `chmod` utility to make the program an executable
    program. The program is already executable from the last time that you saved it.


    +   3.  As you call your program, include the destination address on the command
    line, as shown in the following example:


    ```

    ```

    mailprogram bob@mycomputer

    ```

    ```'
