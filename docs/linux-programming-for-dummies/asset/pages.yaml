  md: 'a file containing instructions for the computer to follow. You use the `chmod`
    utility to tell your computer which files are executable. Type, for example, the
    following command at the prompt (replacing *myfile* with the name of your file,
    of course):


    ```

    ```console

    chmod 711 myfile

    ```

    ```


    If you don’t make a file executable by using the `chmod` utility, Linux doesn’t
    recognize it as such. After you make a file executable, you can run the program
    by simply typing the name of the program at the command prompt.


    # ## What chmod 711 actually means


    Your computer knows whether a file is a program by the permissions that you grant
    to users of the file. A permission limits the accessibility to the file. You can
    grant three kinds of permissions to any file: *read*, *write*, and *executable*.


    First, decide who can use your program: the *owner* (you); the *group* (such as
    your friends who work with you); and *others* (everyone else in the world). You
    can grant individual permissions by placing the sum of permissions (which you
    derive from the level of permission that you grant to each category of user) in
    the correct order within the `chmod` utility, as the following example shows:


    +   owner    group    others


    The first of the three numbers that you use with the `chmod` utility refers to
    the permission that you grant to the owner of the file (that’s you). The second
    number identifies the permissions that you grant for the group. The third number
    tells the utility how to set the permissions for everyone else.


    To grant the permissions that you need for a program, you use the sum of the following
    numbers for each category of user. Each level of permission corresponds to one
    of these numbers, as the following list shows:


    +   - Read: 4

    +   - Write: 2

    +   - Executable: 1


    You add these numbers together to determine the permission level for each category
    of user and then use those three sums with the `chmod` utility. Say, for example,
    that you want to make the file an executable file (a program file), but you also
    want to read the file on-screen and change whatever you see; you need read and
    write permissions to do this stuff.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Add together the numbers for each permission level that you want to grant yourself
    (4 + 2 + 1 = 7). The sum, 7, is the first of the three numbers that you use with
    the `chmod` utility. If you just want to grant yourself read and write permissions
    without making the file an executable file, however, you use the number 6 (4 +
    2 = 6) with the `chmod` utility for your own level of permission.


    So `chmod 711 myfile` (where `myfile` is the name of the file to which you''re
    assigning permissions) means that the owner (you) has read, write, and executable
    permissions and that both the group and others can only execute your program.


    # Linux Shell-Script Languages versus Other Languages


    Because writing a program in Linux requires a different way of thinking than does
    programming in other computer languages, this section gives you some important
    features that are easy to overlook. They''re here, at your fingertips, whenever
    you feel a lapse of memory coming on.


    # Linux utilities already exist


    In most programming languages, you first plan what you want the computer to do
    and then decide which instructions to give it to make that happen. Linux programming
    is a little different. You still must plan the task to get the job done, but most
    of the instructions already exist in the form of a Linux utility. So you need
    only to divide your program into the tasks that you want the computer to perform
    and then find the appropriate Linux utility to carry them out. (Bell Labs created
    Unix so that programmers can quickly assemble their programs from well-tested
    utilities. All you need to do is to choose the right utilities and put them in
    your program.)


    Each utility requires input (that you supply). After the utility finishes working,
    it delivers output that you can use as input for another utility. As an example,
    a text-editor utility creates a file that you can use as input for the spell-check
    utility.


    Learning how to use a Linux utility could become a nightmare if not for this clever
    little trick: Most utilities include a how-to manual, known as a `man page`, that''s
    installed on any computer running Linux. (And, no, it''s not a list of eligible
    men.) `Man` is short for `manual`. To display the manual on-screen, just type
    the following line (replacing `utility` with the utility name) and press `Enter`:


    ```

    ```bash

    man utility

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'After you find a utility you want to use, test it out before you make it part
    of your program. (Each utility, by the way, is itself a program.) Enter the name
    of the utility on the Linux command line along with the input that it needs. After
    you press the Enter key, the utility crunches away, and the output appears on-screen
    (unless, of course, the utility''s job is to send the output to a printer or modem).


    # ## Linux reads, converts, and executes one line at a time


    Most programs that you use on a PC have the EXE extension. These letters in a
    filename tell Windows that the file is a program that''s in machine language.
    (You can save any file with an EXE extension, of course, but saving anything other
    than a program this way only confuses your computer.) The computer can jump right
    into the program and follow your instructions as fast as a speeding bullet.


    You don''t get this same performance with Linux programs. Programs that you write
    in most other computer languages are *compiled* (already in machine language before
    the program is run), but that''s not the case for Linux. A *compiler* is a program
    that translates your program into machine language and then saves the translation
    in a file (the EXE file in Windows). You also must translate your Linux programs
    into machine language, but this translation takes place as a user runs an executable
    program rather than as you create the program.


    The translation takes place one line at a time. Your computer reads one line of
    the Linux shell script, converts the line into machine language, and then executes
    the instruction. Your computer then goes back to your Linux shell script, reads
    the next line, and follows the same steps for that line. This process continues
    until your program ends. Translating your program line by line as you run the
    program can, unfortunately, slow things down a little.


    # ## Linux can run quietly in the background


    Whenever you run a computer program, it takes over your computer: The program
    determines what appears on-screen and when you can use your keyboard.


    Your Linux program isn''t a hog — it''s willing to share your computer with other
    programs, because Linux is a multiprocess operating system. Someone who needs
    to run another program in addition to your program'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'can tell the computer to run your program and then to run the other programs.
    Because your program just does its thing in the background, this process is known
    as *background processing*.


    The program that you’re currently using, in what’s known as the *foreground process*,
    takes charge of everything that you see on-screen. Any program that runs in Linux
    is a *process* because Linux is processing the instructions and data that associate
    with the program. A *daemon* — any program that’s running in the background —
    is out there somewhere. If you launch your program as a daemon, it runs quietly
    somewhere in your computer’s memory, where only your computer can find it. Forgetting
    that the program is even running is easy to do.


    Any program can become a daemon if you type & (an ampersand) after the name of
    your program on the command line — which is the line on which the cursor rests,
    patiently waiting for you to enter the next command or program name.


    A daemon continues to run until you log off your computer, unless you start that
    program in a special way. (The only way to stop a daemon for good is to use the
    `kill` command.) You can, however, also run your Linux program by using the `nohup`
    command, which tells your computer to continue to run the program even after you
    log off. To run a program this way, type the following at the command prompt (but
    replace *myprogram* with your program’s name):


    ```

    nohup myprogram

    ```


    # # Linux uses subprograms


    Whenever you write any type of program, you want to break up what you need the
    computer to do into a series of tasks. Each task then becomes an individual part
    of the entire program. You can divide an address-book program, for example, into
    segments that enable you to perform the following separate tasks:


    +   ✓ Enter a new address.

    +   ✓ Find an existing address.

    +   ✓ Modify an existing address.


    In other programming languages, you build each segment of a program separately
    from the other segments and then assemble them into the final program. You can’t
    execute any individual program segment (known variously as *procedures*, *functions*,
    *methods*, and *subroutines* in languages such as Java, Visual Basic, and C++)
    by itself.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# # The drawbacks of Linux programming


    All the good parts of Linux programming are balanced by factors that some Linux
    programmers wish would change for the better. (Don''t hold your breath, however.)
    The Linux environment is ideal for hackers and people who don''t like the limitations
    of Microsoft Windows and the Mac (where the command line is hidden from you).
    For the rest of us, however, Linux is a step backward.


    Some people (such as Bill Gates) try to hide all the complicated stuff behind
    fancy windows. The folks at Bell Labs, however, designed Unix so that you must
    get hip-deep into the mess. Rather than just press buttons and choose items from
    drop-down menus as in Windows, anyone using a Linux program (including yours)
    must type commands on the command line to get the program rolling. (Sort of takes
    you back to the days of DOS and the Apple IIe in the 1970s and ''80s, doesn''t
    it?)


    To create the fancy screens that users expect from professional programs, you
    must go beyond Linux programming and learn how to program X-Windows (which provides
    multiple windows on-screen) and Motif (which supplies push buttons and scroll
    bars). X-Windows and Motif are programs that are available in most recent releases
    of Linux.


    Another drawback of Linux programming is the shell-script language that you use
    to create programs. The words that you use to tell a computer what to do are different
    in each computer language. You use different words in the C++ and Java programming
    languages to display words on-screen, for example, than you use to perform the
    same task in Visual Basic. In Linux programming, however, you use different words
    for the same instruction. The exact words that you use in your Linux program depend
    on the shell that interprets your script.


    > The shell is the program that translates the commands that someone enters at
    the command line into instructions the computer can understand. Entering a command
    can be as simple as clearing the screen or translating each line of your program.
    Linux has many shells: the Bourne shell, bash shell, C shell, and Korn shell are
    just a few — which kids are creating new ones every day. (See Chapter 3 for more
    information on these five main shells.)


    Because each shell uses its own language, as you set out to write a Linux program,
    you must first decide which shell language to use. This problem doesn''t exist
    in other operating systems, because they use only one shell.


    Linux programming is somewhat different. You still divide the program into segments,
    but the segments are really smaller programs (known as subprograms). Unlike the
    procedures, functions, and subroutines in other languages, you can run each segment
    in Linux by itself, or another program can call each individual segment.


    You can use a subprogram a number of times within a program simply by calling
    the subprogram. You can save countless hours of programming time by reusing instructions
    in a subprogram. Then you don''t need to write the instructions over again or
    spend time debugging. You write and debug instructions one time as you create
    the subprogram and then you call the subprogram whenever you need it in your program.'
  merge: -1
