- pgno: 122
  md: "# Chapter 8\n\n# The case Statement\n\nIn This Chapter\n\n+   ➤ Using the case\
    \ statement\n+   ➤ Making the program follow at least one instruction\n+   ➤ Putting\
    \ the case statement in the user interface\n\nYou can run into a problem if you\
    \ tell your computer to make a decision with many possibilities. Say, for example,\
    \ that you want your computer to do something unique with each of five offices\
    \ in your company. Your program requires a bunch of if / elif statements, as in\
    \ the following example:\n\n```\nif [ $region =eq \"1\" ]\nthen\n    echo \"Hello,\
    \ Bob\"\n    elif [ $region =eq \"2\" ]\n    then\n    echo \"Hello, Mary\"\n\
    \    elif [ $region =eq \"3\" ]\n    then\n    echo \"Hello, Joan\"\n    elif\
    \ [ $region =eq \"4\" ]\n    then\n    echo \"Hello, Mike\"\n    elif [ $region\
    \ =eq \"5\" ]\n    then\n    echo \"Hello, Tom\"\nfi\n```\n\nThis program is probably\
    \ a mess for you to read — although your computer can read it just fine. But just\
    \ try to imagine tracking 20 if statements if you need to update 20 regional offices!\n\
    \nIn this chapter, I show you how to make your program make decisions efficiently\
    \ by using the case statement."
  merge: -1
  img_proc: true
- pgno: 123
  md: "# The case Statement\n\nSuppose that you want your program to display a different\
    \ message on-screen if someone in each office is using the program. You can set\
    \ up the program so that, as it begins, it asks the user to enter the number of\
    \ the office he's in and then matches the office number with the number of those\
    \ offices for which you're creating a special message.\n\nChapter 7 shows you\
    \ how to use a series of if el if statements to direct your program to determine\
    \ whether a box is full of cookies. This code becomes difficult to read, however,\
    \ especially if you have several boxes that you want your program to check. A\
    \ better way to obtain the same result is to use the case statement.\n\nThe case\
    \ statement tells your program to compare the value to the right of the case reserved\
    \ word with the value that appears to the right of each of the close parentheses.\
    \ The case statement looks as follows:\n\n```\ncase VariableName in\nvalue1) \
    \ Instruction\n    ;:\nvalue2)  Instruction\n    ;:\nesac\n```\n\nThis statement\
    \ — beginning with the case reserved word and ending with the esac reserved word\
    \ — tells your program to look at the value of VariableName. If this value is\
    \ equal to value1, the program follows the first set of instructions. If this\
    \ value is equal to value2, the program follows the second set of instructions.\
    \ The program follows all the instructions that appear between the case reserved\
    \ word and the esac reserved word if it finds a match. You use double semicolons\
    \ to tell Linux that it's at the end of the set of instructions.\n\n![](img/05279073f26be7df99b3c487360dec6a_123_0.png)\n\
    \nIn case you fail to notice it, a close parenthesis — ) — follows each value.\n\
    \nIn the following example, I replace the if statement that I use at the beginning\
    \ of the chapter with the case statement:\n\n```\ncase $region in\n1)     echo\
    \ \"Hello, Bob.\"\n    ;:\n2)     echo \"Hello, Mary.\"\n    ;:\n```"
  merge: -1
  img_proc: true
- pgno: 124
  md: "```\n3) echo \"Hello, Jean.\"\n   ;|\n4) echo \"Hello, Mike.\"\n   ;|\n5) echo\
    \ \"Hello, Tom.\"\n   ;|\nesac\n```\n\nThis code is much easier to read (for humans)\
    \ because it eliminates repetitive words such as echo. You can stuff as many values\
    \ in this statement as you need. In effect, the case statement streamlines your\
    \ program and enables you and your fellow humans to read it more easily.\n\nYou\
    \ must keep a few things in mind, however, in using the case statement. (You knew\
    \ it was too good to be true, right?) The following list clues you in:\n\n+  \
    \ - The value for the program to match must consist of one or more characters.\n\
    +   - You can use a variable or a value as a value for the program to match.\n\
    +   - A variable or a value can be a value that ends with a closed parenthesis.\n\
    \n![](img/05279073f26be7df99b3c487360dec6a_124_0.png)\n\n# ## Making the Program\
    \ Do Something by Default\n\nYour program can find itself unable to match the\
    \ value if you don’t supply it with the necessary matching value. (Whoops!) Sometimes\
    \ this situation doesn’t matter if you supply the value. A problem can arise,\
    \ however, if someone else supplies the value that the program must match.\n\n\
    Say, for example, that another office opens and you don’t have time to change\
    \ your program to handle the new office. (Maybe you just misplaced that memo.)\
    \ Your program’s going to run fine. It simply ignores the new office because it\
    \ doesn’t match any value that you gave it.\n\nYou can have your computer act\
    \ as your backstop by using the asterisk (*) reserved character. Following’s an\
    \ example of how you can use the asterisk reserved character:"
