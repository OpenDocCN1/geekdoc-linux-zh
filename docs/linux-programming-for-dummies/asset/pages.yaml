- pgno: 128
  md: "# Chapter 9\n\n# Nested Control Structures\n\n+   - In This Chapter\n+    \
    \  - Using nested control structures with if\n+      - Using nested control structures\
    \ with case\n+      - Indenting nested statements\n\nEver receive a gift in a\
    \ big box? Quickly you open it only to find a slightly smaller box inside. Then\
    \ you open that box, and another, smaller box is inside. This process continues\
    \ until you finally find your present (and I hope it isn't a hunk of coal).\n\n\
    In programming, the concept of placing one box inside another is known as nesting.\
    \ Nesting also occurs if you combine more than one if statement together or you\
    \ combine more than one case statement together.\n\n# Nesting by Using if\n\n\
    Normally, an if statement contains one or more sets of instructions, such as in\
    \ the following sample, which displays a personal greeting to the manager of the\
    \ New York office:\n\n```\n```\nif [ $office -eq \"I\" ]\nthen\necho \"Hello,\
    \ Bob.\"\nelse\necho \"Sorry, your region is not on my list.\"\nfi\n```\n```\n\
    \nAnother way to write the preceding program is to replace the if statement with\
    \ the case statement, as shown in the following example:\n\n```\n```\ncase $office\
    \ in\n\"I\" ) echo \"Hello, Bob.\"\n      ;;\n```"
  merge: -1
  img_proc: true
- pgno: 129
  md: "Instead of placing a bunch of instructions in the `if` statement or the `case`\
    \ statement, you can stuff an `if` statement and a `case` statement within other\
    \ `if` statements and `case` statements. The following example shows how you do\
    \ it by using the `if` statement:\n\n```\n```\nif [ $office -eq \"1\" ]\nthen\n\
    \    if [ $RegionalMgr -eq \"Bob\" ]\n    then\n        echo \"Hello, Bob.\"\n\
    \    fi\nfi\n```\n```\n\nThe program looks at the value of `$office`. If the value\
    \ of `$office` is 1, the program then looks at the value of `$RegionalMgr`. If\
    \ the value of `$RegionalMgr` is Bob, the program then displays a message greeting\
    \ Bob.\n\n# ## Nesting by Using case\n\nYou can use the same nesting method with\
    \ the `case` statement. Take a look at this use of nesting in action in the following\
    \ example:\n\n```\n```\ncase $office in\n    1) case $RegionalMgr in\n       \
    \  Bob)\n             echo \"Hello, Bob.\"\n             ;;\n      esac\nesac\n\
    ```\n```\n\nThe program looks at the value of `$region`. If the value of `$office`\
    \ is 1, the program then looks at the value of `$RegionalMgr`. If the value of\
    \ `$RegionalMgr` is Bob, the program then follows the instruction and greets Bob.\n\
    \n> Don't forget that you must follow the value with a close parenthesis — ).\n\
    \n# ## Making Nested Statements Easy (for You) to Read\n\nYour computer doesn't\
    \ care how many `if` statements or `case` statements you place inside one another.\
    \ You, however, are sure to care whenever you read your program. You can easily\
    \ become lost reading a program containing multiple nested statements."
  merge: -1
  img_proc: true
- pgno: 130
  md: 'My advice is to indent each nested statement, as I do in the example in the
    preceding section. Indentation isn''t a requirement of Linux, but it''s a good
    style to use as you write a Linux program. Indenting makes reading your program
    a lot easier than jumbling all the nested statements together.


    The following example shows what the code looks like without indenting:


    ```

    case $office in

    "New York")

    case $regionalMgr in

    "Bob")

    echo "Hello, Bob."

    ;;

    esac

    csac

    ```


    Your computer doesn''t have any difficulty reading this program. You''re likely,
    however, to spend a few puzzling minutes matching the nested statements.


    By the way, you don''t even need a test for this chapter.'
  merge: -1
  img_proc: true
