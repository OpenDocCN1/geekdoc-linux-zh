- pgno: 142
  md: "# Chapter 11\nThe for in Loop\n\n+   In This Chapter\n+   \n+   ▶ Using the\
    \ for in loop\n+   ▶ Using the for in loop in a program\n+   ▶ Using wordlists\n\
    \nS ay that you want to print the same letter to each of your friends inviting\
    \ them to the big bash you're throwing because you just won the lottery. You want\
    \ to personalize these invitations. You could write a program to print the text,\
    \ but each time the program runs, you find yourself entering the name of your\
    \ next friend.\n\nOf course, you avoid this problem by using the `for in` loop.\
    \ The `for in` loop enables you to store all your friends' names in a list, and\
    \ then your program uses each name in printing the invitation. It’s like having\
    \ a mail-merge feature built into your own program.\n\nSo, whenever you want your\
    \ programming code to execute a series of instructions as long as a condition\
    \ is true, use the `while` loop. Your computer keeps executing instructions that\
    \ you place inside a `while` loop until one of the instructions in your code changes\
    \ the condition to false.\n\nIf you know how many times that you want the instructions\
    \ to execute, however, use the `for in` loop instead.\n\nJust in case you can't\
    \ wait, here's what a `for in` loop looks like:\n\n```\nFor VariableName in wordlist\n\
    \n do\ninstruction\ndone\n```\n\nThe `wordlist` is a list of string values that\
    \ you assign to the variable; I explain this wordlist stuff later in the chapter,\
    \ so don't worry for now. (Remember that a string is any combination of letters\
    \ and numbers.) The instruction inside the loop can use the variable."
