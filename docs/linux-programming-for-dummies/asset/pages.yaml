- pgno: 24
  md: '# # Introduction


    Welcome to the world of Linux programming. Just the thought of programming a computer
    is enough to make most people give up immediately because it usually seems too
    complicated. Clear your mind of that myth — it ain''t that difficult.


    Can you write a grocery list or directions to your house? Of course you can! You
    can also write a Linux program (seriously!).


    This book is not like the other computer books that you may have attempted to
    read — I scrap all the confusing technical jargon. In its place, I use some honest-to-goodness,
    common-sense English words that tell you how to make a computer do what you want
    it to do.


    Writing instructions to tell a computer to perform a certain task something doesn''t
    need to be difficult. After you find out how to perform a few simple tricks, computer
    programming is a great deal of fun.


    The pages of this book are full of simple explanations for things you may have
    believed you needed an engineering degree to understand. I provide plenty of examples
    for you to copy and try out on your computer.


    # ## About This Book


    Pretend that this book is your private tutor who comes to your home to make sure
    that you understand how to write a program in Linux. Programming in Linux isn''t
    difficult, but sometimes it requires that you provide many small details to tell
    your computer how to do something.


    Following are a few samples of the subjects that I discuss in Linux Programming
    For Dummies:


    +   - Planning a Linux program

    +   - Developing the user interface

    +   - Understanding what Linux code can do


    You may think that understanding how to program a computer requires you to take
    technical courses in abstract mathematics at your local college, but you''re wrong.
    The purpose of this book is to walk you through all the steps you need to know
    to write a Linux program so that you can leave the pain behind.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 2 Linux Programming For Dummies


    # How to Use This Book


    In this book, you read the procedures for creating a user interface for your programs
    and then begin writing the Linux code that tells the computer how to respond to
    someone who uses your programs.


    All the code in this book is set in monospace type as in the following example:


    ```

    declare variable_name

    ```


    You want to type, character for character, anything that appears. I tell you if
    you need to make substitutions, such as using a real variable name in place of
    variable_name. Linux cares about whether you use uppercase, lowercase, or a mixture
    of uppercase and lowercase letters, so look closely at any code that you see in
    these pages.


    Because of the width of the margins in this book, some long lines of code may
    wrap to the next line. On your computer, however, these wrapped lines appear as
    a single line of code; make sure that you don’t insert a hard return in one of
    them on-screen.


    I sprinkle tests throughout this book. Don’t concern yourself too much about them
    — just use them to test your knowledge (no grades are given). You know immediately
    how you’re doing because I also give you the answers and references to the sections
    of the chapter that fully explain the answer.


    You can also download the larger code samples from the chapters of this book by
    visiting www.dummies.com/ extras /linuxprog.html, so that you can just copy and
    paste the code into your favorite compiler.


    # Foolish Assumptions


    Following are some things that you must know how to do before you read this book:


    +   Turn your computer on and off.

    +   Type words on the keyboard.

    +   Read.


    But, seriously, remember that this book is about Linux programming. You probably
    already know what a bug is, what a command line is, and so on. I don’t think that
    you’re someone who’s never even touched a computer. I bet'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'you may have read *Windows For Dummies* — maybe even *Linux For Dummies* (both
    from IDG Books Worldwide, Inc.). You may even be a programmer who wants to know
    about Linux programming.


    Even if you have no previous knowledge, however, you can still follow along. You
    don’t need to know how a computer works, and you don’t need a high SAT score.
    A little common sense is the only requirement to understand what’s in this book.
    Of course, you also need a computer that’s running Linux. And I wrote this book
    with the *bash* shell in mind, which is just one of the many shells available
    for Linux. (I discuss the *bash* shell in Chapter 3.) But even if you’re using
    the C shell, another popular Linux shell, don’t despair: In Appendix C, I give
    you a table of equivalent commands.


    If you qualify and possess the guts to continue, get ready for an interesting
    and fun adventure into the creation of Linux programs for your computer.


    # # How This Book Is Organized


    This book consists of ten parts, and each part usually consists of several chapters.
    If you have no programming experience, a lot of the material in this book makes
    more sense to you if you read the chapters in order. But if you have a little
    previous knowledge and can figure some things out, feel free to just pick up this
    book and start anywhere.


    The following sections provide a breakdown of the parts and what you find in them.


    # ## Part I: A Beginner''s Introduction to Linux Programming


    Part I is a brief introduction to all the major features of Linux programming.
    This part of the book is the place to begin to help relieve your fears about programming
    a computer.


    # ## Part II: The Basics of Writing Code


    To find out how to write a Linux program that tells the computer to do something,
    read Part II. It helps you understand how to use the Linux shell script language
    to give instructions to the computer.'
  merge: -1
  img_proc: true
- pgno: 27
  md: "# **Part III: Making Decisions**\n\nPart III tells you how to instruct your\
    \ computer to make up its own mind about performing a task and then do something\
    \ special without asking for additional directions. Your instructions, in effect,\
    \ enable your computer to become self-reliant.\n\n# **Part IV: Loops and Loops**\n\
    \nLoops are another way of telling your computer to continue doing something until\
    \ it gets it right. In Part IV, you read about different ways to make your computer\
    \ repeat itself.\n\n# **Part V: Writing Subprograms**\n\nJust the thought of writing\
    \ a large computer program is enough to make any sane person run far away. Part\
    \ V shows you the tricks of how to break down a large program into many smaller\
    \ programs, known as subprograms.\n\n# **Part VI: Database Programs and Printing**\n\
    \nDatabase programs are special programs that your computer uses to store and\
    \ retrieve information in a file on your hard disk. In Part VI, you discover how\
    \ a computer handles that information. You also find out how to print any information\
    \ on paper.\n\n# **Part VII: Debugging Your Program**\n\nIn this small part, you\
    \ find out the tried-and-true ways of tracking down a problem in your Linux program.\
    \ (It’s not as complex as it sounds!) \n\n# **Part VIII: Automating E-Mail**\n\
    \nThis part shows you step by step how to how to incorporate e-mail into your\
    \ programs. You discover, for example, how to set your program to automatically\
    \ send e-mail to your friends, relatives, and anyone else with an e-mail address."
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Part IX: The Part of Tens


    Part IX contains several chapters of miscellaneous information that you may find
    useful and interesting, including tips about Linux utilities you can use with
    your programs.


    # Part X: Appendices


    This part contains some helpful appendices. Here you can find a glossary of terms,
    a primer on using the vi text editor, and information on the differences in writing
    scripts in other Linux shells. I also include an appendix containing plenty of
    Linux programming exercises — with answers!


    # Icons Used in This Book


    ![](img/05279073f26be7df99b3c487360dec6a_28_0.png)


    Denotes technical details that are informative (and sometimes interesting) but
    not necessary to know about. Skip these areas if you want.


    ![](img/05279073f26be7df99b3c487360dec6a_28_1.png)


    Flags useful or helpful information that makes programming even less complex.


    ![](img/05279073f26be7df99b3c487360dec6a_28_2.png)


    Indicates important information — don''t pass up these gentle reminders!


    ![](img/05279073f26be7df99b3c487360dec6a_28_3.png)


