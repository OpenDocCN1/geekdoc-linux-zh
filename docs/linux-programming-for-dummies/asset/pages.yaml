- pgno: 245
  md: 'You notice that Linux displays one of two messages after you log in as **bob**.
    Following is the message that appears if Linux successfully delivers your mail
    to **bob**:


    > You have new mail!


    Otherwise, Linux displays the following message if no e-mails are in the incoming
    mailbox:


    > No mail for bob


    In this message, of course, **bob** is the user ID and, therefore, you see a different
    user ID in your message if you don''t log in as **bob**. After you log in, you
    can use the `mail` utility as I describe in the preceding section, "Reading e-mail,"
    to read your incoming mail.


    # ## Enhancing E-Mail


    If you call the `mail` utility, e-mail can include a *subject*, and you can copy
    it to another person by providing the `mail` utility with this information. This
    process is similar to how you provide the destination e-mail address, but it uses
    a special symbol to identify the subject and any additional e-mail address.


    The geeks call the special symbol (a hyphen that you follow with a character)
    a *switch* that you use to turn on a feature of the `mail` utility. The switch
    is more like a railroad switch that moves a train from one set of tracks to another
    rather than a light switch.


    If you turn the switch in one direction, for example, the `mail` utility reads
    and processes the subject from the command line. If you turn the switch in the
    opposite direction, the `mail` utility knows to process the e-mail without the
    subject.


    The same logic is true if you use switches to include or exclude sending a copy
    of the e-mail to another destination address. If you turn on the switch for the
    copy, the `mail` utility copies e-mail to the other e-mail address; otherwise,
    it sends no copies.


    A *switch* is a symbol that you proceed with a hyphen (-) and follow with the
    additional information that the `mail` utility requires to process the e-mail.
    If the switch is missing from the command line in the examples that I use throughout
    in this chapter, Linux assumes that the switch is off.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'You use switches to tell the mail utility to perform the following tasks:


    +   ▷ Include a subject in the e-mail.

    +   ▷ Copy the e-mail to one or more addresses.

    +   ▷ Blindly copy the e-mail to one or more addresses (blocking names of people
    to whom you sent the e-mail so that each person receiving the message can’t see
    who else is receiving the same message).


    You don’t need to include a subject in your e-mail or copy the e-mail to another
    address, although sometimes you find both beneficial if, for example, you want
    to get the attention of the purchasing clerk who lost your computer order. The
    subject alerts the clerk to your problem before he reads the e-mail. The copy
    also tells the clerk that you’re informing your boss about the problem.


    # # Inserting a subject


    ![](img/05279073f26be7df99b3c487360dec6a_246_0.png)


    Including the subject of your e-mail on the subject line is always a good practice.
    The subject line appears whenever the list of e-mail appears if you’re using the
    mail utility — and the person to whom you send the e-mail often uses the subject
    line to determine which e-mail to read first (which may be the case if he receives
    many e-mails).


    You want to write the subject line to attract the person’s attention and ensure
    that he reads your e-mail before other e-mails. Furthermore, you want the subject
    to describe the content of the e-mail. The word URGENT as the subject, for example,
    screams for the person’s attention but doesn’t give him a clue as to the content
    of the message.


    On the other hand, the subject customer problem tells the general topic of the
    e-mail but doesn’t provide any information on the urgency of the problem. Using
    URGENT Customer Problem, as the subject, however, clearly implies that the recipient
    needs to read the e-mail immediately because the customer problem is serious.


    ![](img/05279073f26be7df99b3c487360dec6a_246_1.png)


    Be careful not to overuse attention-grabbing words such as URGENT, because such
    overuse waters down their meaning after a while. If half the messages with the
    subject URGENT aren’t really urgent, using URGENT as the subject no longer attracts
    the same amount of attention.


    Some words don’t require any indication of urgency because they normally attract
    the person and are read first. An e-mail that refers to promotions, for example,
    is one that people are likely to read immediately, because everyone wants to find
    out who’s receiving promotions.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'You can include a subject line to your e-mail by using the -s switch, following
    it with the text of the subject. Insert the switch and the subject between the
    mail and the destination address at the command prompt, as shown in the following
    example:


    ```

    mail -s "Promotions" bob@mycomputer < memo1

    ```


    The -s switch tells the mail utility to use Promotions as the subject of the e-mail.
    Always include the subject within double quotation marks.


    # ### Inserting multiple addresses


    The mail utility can send the same e-mail to many destination addresses and copy
    the e-mail to many other addresses. You can achieve this task by inserting the
    additional addresses next to each other, separating each address with a space.


    Say, for example, that I want to send the e-mail to my co-workers Sandy, Joanne,
    and Anne, in addition to good old Bob. The following example shows how I do it:


    ```

    mail bob@mycomputer sandy@mycomputer joanne@mycomputer anne@mycomputer < memo1

    ```


    The mail utility treats each address as a destination address, which means that
    these addresses all appear in the To portion of the e-mail. You can also insert
    multiple addresses to send copies of the e-mail by placing the addresses after
    the -c switch. You must separate each address with a space.


    Say I want to send one e-mail to Bob and copy the e-mail to Sandy, Joanne, and
    Anne. The following example shows how I do it:


    ```

    mail bob@mycomputer -c sandy@mycomputer joanne@mycomputer anne@mycomputer < memo1

    ```


    # ### Inserting a copy address


    A copy address is another e-mail address that receives a copy of the e-mail, along
    with the destination address of the e-mail. Everyone who receives the e-mail also
    sees the copy addresses.


    Say, for example, that I send the promotion memo to Bob and his boss, Mary, and
    Mary’s boss, Mark. Bob sees Mary’s and Mark’s e-mail addresses as "cc" on the
    e-mail. Mary also sees that her boss is receiving the e-mail, too, just as Mark
    knows that Mary is receiving the same e-mail.


    Be careful in copying anyone on an e-mail, because you may not want everyone who
    receives the e-mail to know about all the other people who receive'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'the same e-mail. You may not want Mary, for example, to know that her boss
    is also receiving the e-mail. Yet, you have no problem with Mark knowing everyone
    who''s receiving the e-mail.


    You can use the **blind-copy feature** of mail to restrict the people who see
    who else receives the e-mail. I discuss this feature in the following section,
    “Inserting a blind-copy address.” In the previous example, Mary doesn''t know
    that her boss is receiving a copy of the e-mail if you send her boss a blind copy
    of the e-mail.


    You use the `-c` switch to include a copy e-mail address, as shown in the following
    example:


    ```

    mail bob@mycomputer -c mary@mycomputer < memo

    ```


    In this example, mary and bob both receive a copy of the memo e-mail message.


    # Inserting a blind-copy address


    The *blind copy* is a feature of the **mail** utility that enables you to send
    a copy of the e-mail to someone without the other recipients knowing who else
    is receiving the e-mail.


    Blind copies often come in handy if the e-mail involves an internal political
    struggle, where covering your . . . well, you know . . . is important. You can
    send the e-mail without tipping your hand to your adversary by using the blind-copy
    feature.


    The switch `-b` is the switch that you use to create a blind copy, as shown in
    the following example:


    ```

    mail bob@mycomputer -b boss@mycomputer -c mary@mycomputer < memo

    ```


    In this example, the **mail** utility sends the memo to bob and a copy to mary.
    Bob can see Mary''s e-mail address in the e-mail, so he knows that Mary''s receiving
    a copy of memo. The boss also receives a copy, but neither Bob nor Mary sees the
    boss'' e-mail address in the e-mail. On the other hand, the boss sees all the
    e-mail addresses of everyone who''s receiving the memo.


    You accomplish the task of sending blind copies to many addresses in a similar
    fashion. Say that, instead of sending Sandy, Joanne, and Ann a standard copy,
    I want to send them a blind copy. The following command shows how I do it:


    ```

    mail bob@mycomputer -b sandy@mycomputer joanne@mycomputer<br>ann@mycomputer <
    memo

    ```'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'I can, of course, include multiple destination addresses, multiple copy addresses,
    and multiple blind-copy addresses, plus a subject line by placing them on the
    same line.


    # Inserting all features in an e-mail


    You can include a subject, a copy address, and a blind copy in an e-mail by using
    all the switches that I mention in the preceding sections of this chapter. Simply
    insert the switches after the destination address as you call the mail utility.


    The following example shows you how to do so:


    ```

    mail bob@mycomputer -s "Promotions" -b boss@mycomputer -c mary@mycomputer < memo1

    ```


    The mail utility sends Bob, Mary, and the boss memo1 and identifies the subject
    as Promotions.


