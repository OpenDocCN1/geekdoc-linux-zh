- pgno: 174
  md: '# Arrow your flowcharts


    You can dress up your drawings by placing arrows on the lines that connect tasks.
    The arrows show the direction of the next task. Using these arrows isn''t a requirement,
    but they do add clarity to your drawing.


    Each box in the flowchart is a task that associates with other boxes (tasks) on
    your flowchart by a connecting line. The line does more than just join boxes.
    The line shows how each box


    relates to another box by using an arrow at the end of the line. The task of displaying
    the menu, for example, comes before the user enters one of the selections from
    the menu. So you draw a line connecting the first box (displaying the menu) to
    the second box (selecting from the menu) with an arrow pointing to the second
    box because this task comes after the first task.


    # Linking subprograms in a flowchart


    As you map out more and more tasks on your Linux program flowchart, keeping track
    of all those subprograms may become tough. By numbering a subprogram, as shown
    in Figure 14-5, you can refer to another flowchart that contains more details
    about that subprogram.


    Suppose that you''re building a program that requires a user to enter a name and
    password into the program before using the program. So you label the first box
    on the flow chart *Login Task*. This label tells you generally what takes place
    at this portion of your program.


    But what exactly does the Login Task involve? You need to know this information
    as you build the subprogram that handles the login task. You don''t, however,
    have enough room in the Login Task box on your flowchart to place all these details.


    Here''s the solution: Number each box on your flow chart. The first box is 1;
    the second is 2; and you get the idea from there. If a box needs more detail,
    you can create a separate flowchart for that box. You have plenty of room on the
    second flowchart to identify all the tasks relating to that box on the previous
    flowchart.


    Suppose that you assign a number 1 to the Login Task on the first flowchart. You
    then create an entirely new flowchart just for the Login Task box. The first box
    on the Login Task flowchart you number as 1.0, and this box contains the same
    text that you use on the corresponding box on the first flowchart — Login Task.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 152 Part V: Writing Subprograms


    ![](img/05279073f26be7df99b3c487360dec6a_175_0.png)


    **Figure 14-5:** The bottom flowchart contains the details of the *Find Listing*
    task shown on the top flowchart.


    Create boxes on the Login Task flowchart, using the procedures that I describe
    in the preceding section, to represent all the tasks that are necessary for the
    user to log into the program. You must also number each box on the Login Task
    flowchart. Instead of numbering the boxes as 1, 2, 3, and so on, however, you
    number them as 1.1, 1.2, 1.3, and so on. This numbering method enables you to
    quickly know that the box you''re looking at associates with a particular box
    on the first flowchart. The first number (1) is the number of the related box
    on the first flowchart. The second number (.1) is the number of the box on the
    second flowchart.


    The technical name for associating boxes on one flowchart with those on another
    flowchart is a *leveling diagram*. The first flowchart is level one, and the second
    flowchart is level two. And you can have a level three, level four, and so on,
    as necessary.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Using a Flowchart to Create

    Linux Subprograms


    After you map out your Linux program on a flowchart and number each box appropriately,
    the next step is to write the programming code for each task. Each module or box
    on the flowchart represents a distinct function or task for which you write code.


    You must decide whether to include the code for a task directly in your program
    or in a subprogram. The criterion to use in making this decision is that any task
    that requires little or no help from the program or from a subprogram and that
    the program uses repeatedly is a good candidate to become a subprogram.


    # How to create a subprogram


    You create a subprogram the same way that you create a program. The flowchart
    that you create shows all the steps that you must include in the subprogram. Your
    job is to translate these steps into Linux programming instructions. (See Chapter
    2 for more information on Linux programming instructions.)


    After you determine the instructions that you need to make the program carry out
    the task, you type those instructions into a text file by using a text editor
    such as vi. (I introduce vi in Chapter 3; refer also to Appendix B for vi details.)
    Then you need to save the file to your hard disk. Make the file an executable
    file by using the chmod command (refer to Chapter 1) and execute your new subprogram
    from the command prompt. This process enables you to test your subprogram before
    you use it in your program.


    Some rules for writing subprograms are as follows:


    +   - Instructions must appear in the subprogram in the order in which you want
    the program to perform those instructions.

    +   - You must save each subprogram in its own file.

    +   - You must convert each subprogram file into an executable file by using the
    chmod command.

    +   - You want to run each subprogram at the command line to make sure that it
    runs smoothly. If not, you must debug the subprogram until you resolve all the
    problems. (See Chapter 19 for information on debugging.)'
