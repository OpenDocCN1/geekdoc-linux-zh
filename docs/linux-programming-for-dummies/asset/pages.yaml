- pgno: 133
  md: '# In this part . . .


    Our program contains instructions that tell the computer what to do. Many times,
    you give those instructions just once, such as whenever you need to display a
    welcome message for the user.


    But sometimes you must tell your computer the same instruction or instructions
    over and over again. You can copy those lines of instructions to new lines in
    your program if you want.


    A better way, however, is to simply tell your computer to repeat instructions
    that are already in your program. This procedure is known as looping. In this
    part, you find out how to make loops in your program.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Chapter 10

    ## The while Loop


    # In This Chapter


    +   ▸ Using the `while` loop

    +   ▸ Determining how often the `while` loop repeats itself

    +   ▸ Using the `while` loop in a menu


    The `while` loop works like a group of people caught in the rain, standing under
    the awning of a store. Every so often, they check to see whether the rain’s still
    coming down. While the rain continues, the people stay put. Otherwise, they begin
    walking toward their cars. Rain is a condition that determines whether the people
    can go for a walk.


    You may write your program to give it contains to wait for the user to enter the
    correct response to a question before continuing with the program. Each time a
    response is given, the program checks it against the correct response. This checking
    for a correct response is similar to someone under the awning checking to see
    if it’s still raining. If the program doesn’t detect a match, it tells the user
    that he gave the wrong answer and returns to the top of the `while` loop to wait
    for the next response.


    A `while` loop looks like what you see in the following example:


    ```

    while ( Condition )

    begin

    Instruction

    end

    ```


    In this chapter, I show you how to use a `while` loop in your program so that
    your program executes your instruction only if a particular condition exists —
    such as someone entering the correct response at the keyboard.


    You must include a variable or expression in the `while` loop that results in
    a true or false value. And you can place many instructions in a `while` loop.'
  merge: -1
  img_proc: true
- pgno: 135
  md: "# # Deciding Whether to Use a while Loop\n\nAs you write a program, you list\
    \ all the instructions that you want the computer to follow, in order. At times,\
    \ however, you want to repeat some of those instructions. Instead of writing those\
    \ instructions over again, you can just place them within a `while` loop.\n\n\
    Use a `while` loop if you ever need to repeat a group of instructions — as long\
    \ as a condition is true. If you need to prompt the user to enter a correct password,\
    \ for example, and you put those instructions in a `while` loop, that group of\
    \ instructions continues to execute until the user enters the correct password.\n\
    \nDon't, however, use a `while` loop if you don't want the group of instructions\
    \ to repeat continuously. Say, for example, that you want to display the same\
    \ message on-screen whenever someone makes an error using your program. Although\
    \ the instructions that you need to display the message repeat in the program,\
    \ instructions repeat only if an error occurs. Placing these instructions in a\
    \ `while` loop causes the program to continually display the message. The best\
    \ way to handle this problem is to place these instructions in a subprogram (see\
    \ Chapter 14) and then call the subprogram whenever you need to display the message.\n\
    \n# # Using a while Loop in Your Linux Code\n\nIf your program sees a `while`\
    \ loop, it checks the condition. It answers the following question: \"Is this\
    \ condition true or is it false?\" Only if the condition is true does your program\
    \ read the instructions that you put in the `while` loop.\n\nThe following code\
    \ shows a `while` loop in action:\n\n```\n```bash\ndeclare raining=\"1\"\nwhile\
    \ [ \"$raining\" -eq \"1\" ]\ndo\n echo \"Still raining.\"\ndone\n```\n```\n\n\
    The following explanation describes what's happening in this `while` loop:\n\n\
    The `declare` tells your program to create a string variable by the name `raining`\
    \ and assign it the value 1. This value indicates a true value.\n\nThe `do` tells\
    \ your program to check whether the value of `$raining` is still 1. If true, this\
    \ value means that the rain is still falling."
  merge: -1
  img_proc: true
- pgno: 136
  md: "The `echo` tells your program to display the message on-screen only if the\
    \ rain’s still coming down.\n\nThe `done` tells your program that it’s at the\
    \ end of the `while` loop.\n\nOf course, you need more instructions in this example\
    \ to make it a working program. In the preceding block of code, for example, your\
    \ program keeps displaying the message because the value of `$raining` never changes.\
    \ This type of program is known as an *endless loop*. The condition in the statement\
    \ is always true.\n\nYou need to add instructions that check to see whether the\
    \ rain’s still falling. You place these instructions within the `while` loop to\
    \ change the value of `$raining` to 0 if the rain stops.\n\n# Using a while loop\
    \ to create a menu\n\nYou commonly use a `while` loop to create a menu interface.\
    \ In any program menu, the program user expects the following sequence:\n\n+ \
    \  1. See a menu.\n+   2. Make a selection.\n+   3. Have the program do something.\n\
    +   4. Return to the menu to make further selections.\n\nThe easiest way to program\
    \ this menu stuff is to place all these instructions inside a `while` loop. Each\
    \ time that the program finishes doing what the user requests, the program returns\
    \ to the `while` loop and starts all over again. Take a look at the following\
    \ example:\n\n```\n```\n#!/bin/bash\ndeclare flag=\"1\"\nwhile [ \"$flag\" -eq\
    \ \"1\" ]\ndo\n    clear\n    echo \"The Telephone Book\"\n    echo \"1. Display\
    \ A:Telephone Number\"\n    echo \"2. Add A New Telephone Number\"\n    echo \"\
    0. Quit\"\n    echo \"\"\n    echo \"Enter your selection:\"\n    read selection\n\
    \    case $selection in\n        \"1\")\n            #Run the subprogram to display\
    \ a phone number\n            getnum\n```\n```"
  merge: -1
  img_proc: true
- pgno: 137
  md: "# 114 Part IV: Loops and Loops\n\n```\n```\n\"*\")\n\t#Run the subprogram to\
    \ add a new phone number\n\taddnum\n\t;;\n\"q\")\n\tflag=\"0\"\n\t;;\n\"0\")\n\
    \tflag=\"0\"\n\t;;\n*)\n\techo \"You made an invalid selection. Try again.\"\n\
    \tesac\ndone\n```\n```\n\nThe *bash* tells the computer that this program is a\
    \ *bash* shell script. The *declare* creates a *string* variable by the name of\
    \ `$flag` and assigns it the value 1.\n\nNext, the program evaluates the expression\
    \ in the statement to see whether the value of `$flag` is 1.\n\nIf so, the program\
    \ displays the menu and waits for a user to enter a character at the keyboard;\
    \ the program then stuffs this character into the variable. The program compares\
    \ the value that `$selection` stores with all possible values by using the *case*\
    \ statement.\n\nIf it finds a match, the program runs a subprogram — but *only*\
    \ if the subprogram exists. In this example, an error occurs at that point because\
    \ you didn't write those subprograms. Say, for example, that *getnum* is the name\
    \ of a subprogram that runs after the user selects the first option on the menu.\
    \ The subprogram returns to this part of the program after it finishes running,\
    \ and the program continues with the instructions in the *while* loop.\n\nNotice\
    \ that the program looks for both upper- and lowercase 0. It does so because the\
    \ user can enter 0 — to quit the program — in either an upper- or lowercase character.\n\
    \nIf the program doesn't find a match, however, it tells the user to try another\
    \ selection. The program repeats this process until the user selects the Quit\
    \ option. After this selection occurs, the value of `$flag` changes to 0 and the\
    \ computer exits the *while* loop the next time that it checks the value of `$flag`.\n\
    \n# ## Using a while loop to create a timing loop\n\nYou're likely to come across\
    \ a problem if you want the program to pause before executing the next group of\
    \ instructions. You may, for example, have a program that displays a series of\
    \ messages on-screen automatically. Each"
  merge: -1
  img_proc: true
- pgno: 138
  md: "message appears on-screen for a specific amount of time before the program\
    \ changes to the next message — a kind of slide show without all the fancy type\
    \ that you find in a Windows program.\n\nThe trick is to make the program pause\
    \ long enough for someone to read the message. The way you can create such a pause\
    \ is to use a timing loop. A *timing loop* is a simple `while` loop where the\
    \ only instruction within the loop is an instruction to add 1 to a variable. Take\
    \ a look at the timing loop in the following example:\n\n```\n```\ndeclare counter=0\n\
    while [ \"$counter\" -lt 1000 ]\ndo\n\tlet $counter=\"$counter + 1\"\ndone\n```\n\
    ```\n\nIn this example, the program stores 0 in a variable known as `counter`\
    \ and then the program enters the `while` loop. The single instruction within\
    \ the loop adds 1 to the value of the counter and stores the new value back in\
    \ the counter variable. The loop continues to count until the value of the counter\
    \ variable is 999 — at which time the program leaves the `while` loop.\n\n![](img/05279073f26be7df99b3c487360dec6a_138_0.png)\n\
    \nYou can adjust the length of the pause by increasing or decreasing the value\
    \ in the condition. In this example, the value of `counter` in the condition is\
    \ 1000. Increase this value to lengthen the pause and decrease this value to speed\
    \ up the pause.\n\n# # Using a while loop to create a flashing message\n\nWhenever\
    \ you really want to catch the eye of the user and make sure that he reads your\
    \ message, you can make your message flash on-screen by using a `while` loop.\
    \ First, you instruct the program to display the message on-screen. Next, you\
    \ start a timing loop (see the preceding section for information). This process\
    \ causes your program to pause for a specific length of time. Finally, you clear\
    \ the message from the screen and return to the beginning of the `while` loop.\
    \ To see it in action, check out the following example:\n\n```\n```\nclear\ndeclare\
    \ counter1=1\ndeclare counter2\n\nwhile [ \"$counter1\" -lt 6 ]\ndo\n\techo \"\
    Warning: There's a bug in your program.\"\n\tlet counter2=1\n\twhile [ \"$counter2\"\
    \ -lt 200 ]\n\tdo\n\t\tlet $counter2=\"$counter2 + 1\"\n```\n```"
  merge: -1
  img_proc: true
- pgno: 139
  md: '```

    done

    clear

    let $counter2=1

    while [ "$counter2" -lt 200 ]

    do

    let $counter2=$counter2 + 1

    done

    let $counter=$counter1 + 1*

    done

    ```


    Notice that I use three while loops in this program. The first while loop causes
    the message to flash five times. Each time the message flashes on-screen, the
    program adds 1 to the variable. After counter1 has a value of 6, the program exits
    the first while loop.


    Each time the message appears on-screen, the program pauses by entering the second
    while loop. Simply put, the program counts to 200. You can change this value to
    any number. The higher the number, the slower the message flashes. And the lower
    the number, the faster the message flashes.


    After this while loop counts to 200, the program removes the message from the
    screen; then the third while loop begins. The third while loop keeps the screen
    blank until that third while loop counts to 200; afterward, the first while loop
    adds 1 to its count and begins the process again.


    # Avoiding Endless while Loops


    If the condition of the while loop is false, your program doesn''t execute any
    of the instructions inside the loop. The instructions inside the while loop, therefore,
    never repeat. In fact, they never even execute. (And after all that work writing
    this code!) Following is an example:


    ```

    declare raining= "0"

    while [ "$raining" -eq "1" ]

    do

    echo "Still raining."

    clear

    ```


    Your program doesn''t display the message in this example because the value of
    raining is not 1. The program skips the instructions inside the while loop and
    continues on the line that follows the reserved word, clear, which in this case
    marks the end of the program.


    If the condition of the while loop is true, the program executes all the instructions
    in the loop at least once.'
  merge: -1
  img_proc: true
- pgno: 140
  md: "If the condition of the while loop is always true, the program again executes\
    \ all the instructions in the loop. Your program doesn’t stop until you or the\
    \ administrator who’s responsible for your computer stops the program. Again,\
    \ this situation is the infamous endless loop.\n\nNo cool programmer wants to\
    \ put an endless loop in a program. You can avoid this situation by making sure\
    \ that at least one instruction in the while loop changes the true or false value\
    \ of the condition that the while loop uses. The following example shows how to\
    \ do so:\n\n```\n#!/bin/bash\ndeclare raining=\"1\"\nwhile [ \"$raining\" -eq\
    \ \"1\" ]\ndo\n    clear\n    echo \" \"\n    echo \"Is it raining? \"\n    echo\
    \ \" \"\n    echo \"1. Yes \"\n    echo \"2. No \"\n    echo \" \"\n    echo \"\
    Enter your selection: \"\n    read raining\ndone\necho \"It stopped raining.\"\
    \n```\n\nThe bash tells the program that this part is a bash shell script.\n\n\
    The declare tells the computer to create a string variable by the name of raining\
    \ and assign it the value 1.\n\nThe while tells the program to check whether the\
    \ value of $raining is 1. If so, the program executes the following instructions.\n\
    \nThe clear tells the program to clear the screen.\n\nThe echo stuff displays\
    \ a menu.\n\nThe read waits for the user to make a selection and then assigns\
    \ the selection to the raining variable.\n\nThe program returns to the top of\
    \ the while loop and checks to see whether the value of $raining is 1. If the\
    \ value didn’t change, the instructions execute again.\n\nIf the value isn’t 1,\
    \ the instructions don’t execute again. The program jumps to the last instruction\
    \ in the program and displays it stopped raining. on-screen."
  merge: -1
  img_proc: true
