- pgno: 233
  md: '# In this part...


    This part shows you how to use your newfound Linux programming skills to make
    your programs automatically send e-mail to your friends, relatives, or to anyone
    with an e-mail address. Here you can find valuable tips on how to create programs
    that take full advantage of all the features available in e-mail.'
