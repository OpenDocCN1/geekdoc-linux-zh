- pgno: 74
  md: 'Next, you''re using the clear reserved word to tell your computer to erase
    any text that may already appear on-screen.


    You''re then using the echo reserved word to display text as well as blank lines
    on-screen. All the characters between the quotation marks appear on-screen.


    Of course, you don''t need to copy this program exactly. Become a little adventurous
    and experiment. Change the text, change the spacing — go a little crazy. This
    kind of experimentation is the only way that you really discover how to create
    a Linux program.


    # Saving your program


    After you''re satisfied that all the instructions in your program are in the correct
    order and that you''re using the correct words to tell the computer what to do,
    you''re ready to save your file.


    Following are several ways to save your file by using the vi text editor (some
    of which are familiar to you if you first read the section "Stopping vi and saving
    changes," earlier in this chapter):


    +   - **ZZ:** Saves your file and exits vi.

    +   - **:w:** Saves your file without exiting vi.

    +   - **:wq:** Saves your file and exits vi.

    +   - **:w filename:** Saves your file under a new name that you specify (so that
    :w mymenu2: for example, saves your file as mymenu2).


    Always save your program while you''re still writing your program in vi. Until
    you save your program in a file, everything that you type exists only in your
    computer''s memory. If you turn off your computer (or the power company does it
    for you), you lose all your hard work!


    # Making your program work


    Your program is almost ready to run . . . but not just yet. You still must tell
    your computer that your file is an executable file. An executable file is a file
    that contains instructions for your computer to follow.


    Follow these steps to tell your computer that your file is executable:'
