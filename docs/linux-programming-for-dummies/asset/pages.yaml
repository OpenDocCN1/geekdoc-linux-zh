- pgno: 178
  md: "```\n\"1\" )\n    findlisting\n\"2\" )\n    addlisting\n\"3\" )\n    modifylisting\n\
    \"4\" )\n    prntlisting\n\"0\" )\n    exit\nesac\n```\n\nAfter the user makes\
    \ a selection, the program determines whether it needs to run a particular subprogram\
    \ to complete the task that the user requests. If so, the program calls the name\
    \ of the subprogram and the instructions in the subprogram take over. After the\
    \ task is complete, the subprogram ends and the program retakes control by executing\
    \ the next instruction in the program.\n\n# # Choosing a name for a subprogram\n\
    \nA subprogram's name is important to a programmer. The subprogram's name helps\
    \ the programmer recognize the subprogram, and you can also use it to identify\
    \ the purpose of the subprogram. You can, for example, name a subprogram something\
    \ short and easy, such as *sub1*. But then try to remember what the *sub1* subprogram\
    \ does as you're rushing about writing your code. (Hmmm — is *sub1* the Login\
    \ Task subprogram or is it the subprogram to print a name list?)\n\nI call the\
    \ sample subprogram in the preceding section *displaymenu*. This subprogram name\
    \ briefly describes what the subprogram does — it *displays the menu*. The name\
    \ *displaymenu* is also an easy one to remember.\n\nKeep the following points\
    \ in mind as you name your subprograms:\n\n+   - You want to make the subprogram\
    \ name informative. Although the name *displaymenu* appears to meet this requirement,\
    \ for example, *displaymenu* doesn't actually mention *which* menu the subprogram's\
    \ displaying.\n+   - Use abbreviations in the subprogram name. You can rename\
    \ the *displaymenu* subprogram to something such as *dispopenmenu*, which implies\
    \ *display opening menu*. Make sure that the meaning of the abbreviations are\
    \ easily recognizable.\n\n![](img/05279073f26be7df99b3c487360dec6a_178_0.png)"
  merge: -1
  img_proc: true
- pgno: 179
  md: "+   * Try to reflect the name of the main program in the name of the subprogram.\
    \ The name **dis**open**mu**, for example, states that this subprogram displays\
    \ the *opening menu* — but the opening menu for which program? To make this subprogram\
    \ name more informative, you can rename this subprogram to add the name of the\
    \ main program — **tddis**open**mu** to imply *telephone directory display opening\
    \ menu*.\n+   * You need to make the subprogram name easy to read — you can play\
    \ around with the capitalization to help its readability. The name **tddis**open**mu**,\
    \ for example, identifies the subprogram, but it’s hard to read. The name is better\
    \ if you make it **Tdd**is**O**pen**Mu**.\n\nKeep in mind that no hard and fast\
    \ rule shows you how to correctly name a subprogram. You can stay out of trouble,\
    \ however, by using your common sense.\n\n# *How to use a subprogram*\n\nYou first\
    \ want to create and test your subprograms and then create your program itself.\
    \ Some programmers call this latter creation the *main program* because it contains\
    \ the instructions for the program. As you create your program, place the name\
    \ of the appropriate subprogram into it wherever you want your program to perform\
    \ the subprogram’s task.\n\n![](img/05279073f26be7df99b3c487360dec6a_179_0.png)\n\
    \n# Test your programming knowledge\n\n+   1. What’s the **first step** in writing\
    \ a complex **Linux** program?\n+   \n+       a. Begin to write instructions.\n\
    +       b. Hit your head against the wall repeatedly (which always feels better\
    \ after you stop).\n+       c. Draw a flowchart of the program before writing\
    \ your code.\n+       d. Read this book.\n+   \n+       Answers 1) c. See “Creating\
    \ a Program Plan by Using a Flowchart.” 2) d. See “Why Use a Subprogram?”\n+ \
    \  2. **Why are subprograms helpful?**\n+   \n+       a. They have a few instructions.\n\
    +       b. Subprograms fit better inside your computer.\n+       c. Little guys\
    \ are easier to control.\n+       d. Subprograms reduce a large, complex Linux\
    \ program into smaller, manageable modules."
