- pgno: 258
  md: 'For one thing, you can pass multiple arguments to your e-mail program that
    you can substitute for features of the `mail` utility that you want to use. You
    can, therefore, write your program to meet your general needs, such as sending
    e-mails to all your friends, and then tailoring the program for each e-mail that
    you send.


    Following are some of the common ways to add flexibility to your e-mail program:


    +   - Change the subject and e-mail message from the command line.

    +   - Change the subject, e-mail message, and destination address from the command
    line.

    +   - Override default values of the e-mail.


    The following sections describe these changes in more detail.


    # Changing the subject and e-mail message


    I created an e-mail program that sends e-mails to all my friends. I purposely
    left out the subject and the e-mail message from the program, however, so that
    I can use the same program to send them any e-mail without needing to modify the
    program.


    I can do so because I enter the subject and the file name that contains the e-mail
    message at the command prompt as I type the name of the program. I must, of course,
    first change the program to accept both arguments from the command line before
    I can run the program.


    You use numbers to identify command-line arguments. The first argument is number
    1, as you see in the section, “Passing an Argument to an E-mail Program,” earlier
    in this chapter. The second argument is number 2 and so on. You refer to these
    arguments by placing a dollar sign ($) in front of the number that you want to
    use. The first argument is $1. The second argument is $2.


    If I want to pass the subject and the name of the file that contains the e-mail
    message to the e-mail program, I use two arguments and refer to them as $1 and
    $2 in my program. The following example shows the modify program to accept two
    arguments from the command line:


    ```

    #!/bin/bash

    mail -s $1 bob@mycomputer < $2

    ```'
