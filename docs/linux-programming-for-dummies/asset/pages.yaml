    # Displaying a number


    Telling your computer to show a number on-screen isn’t different than telling
    it to display a string.


    ![](img/05279073f26be7df99b3c487360dec6a_93_0.png)


    Take a look at the following code to see how to show numeric data on-screen. Remember
    that you don’t need to declare the numeric variable at the top of a program.


    ```

    `#!/bin/bash`


    `clear`


    `echo ""`


    `echo "Enter Your Age: "`


    `read age`


    `echo $age`

    ```


    # Displaying strings and numbers


    You collect numeric data and string data separately. Someone who uses your program,
    however, expects to see them appearing together on the same line. You don’t want
    to disappoint anyone. So here’s how you can show numeric data combining with string
    data on the same line:


    ```

    `#!/bin/bash`


    `clear`


    `echo ""`


    `echo "Enter Your First Name: "`


    `read FirstName`


    `echo "Enter Your Age: "`


    `read age`


    `echo $FirstName, $age really isn’t that old."`

