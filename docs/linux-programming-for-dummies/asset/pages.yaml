  md: "Continue this process until all the names appear on-screen. Your paper should\
    \ now look as follows:\n\n```\nHello Bob.\nHello Mary.\nHello Sue.\n```\n\nYou\
    \ don’t find any more values in the `for` in loop, so the loop ends and the next\
    \ line executes. This line tells your computer to display Good-bye! on-screen.\n\
    \nNow write that same line on your paper so that what appears on your paper is\
