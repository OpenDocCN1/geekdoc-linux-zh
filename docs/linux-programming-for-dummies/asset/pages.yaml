  md: 'Data always appears at the cursor on-screen. Say that your program displays
    the text `Salary:`. The cursor — that flashing little light that signals where
    you are on-screen — moves to the right of the colon (`:`). Next, your program
    displays the data that contains the salary.


    You can modify data appearing on-screen, but the changed data doesn''t automatically
    appear on-screen. Your program displays the salary on-screen. It also stores the
    salary in the variable `MySalary`. Your program then proceeds to calculate the
    new salary and saves the result in the variable `MySalary`. The old salary, however,
    still remains on-screen until your program displays the variable `MySalary` again.


    Nothing''s special about the data that your computer collects from the keyboard
    and stores in a variable. This capability is the same as if your program itself
    told the computer to assign the value to the variable.


    # Displaying a string


    A typical Linux program tells someone to enter a string of characters; the program
    then saves the characters in a variable before displaying them on-screen. You
    can choose to do either of the following:


    +   - Display the characters on a single line.

    +   - Display a combination of the characters with other characters on a single
    line.


    You can have the computer show just the characters that someone enters into your
    program by using the `echo "variable name"` on a line in your program. (Of course,
    replace `variable name` with the name of your variable.)


    You can combine characters with other characters by placing them within quotation
    marks, as shown in the following code. Here, the program asks users their first
    names and then greets them with a big hello (but no kiss and hug).


    ```

    `#!/bin/bash

    clear

    echo ""

    echo "Enter Your First Name: "

    read firstName

    echo "Hello, $firstName"`

    ```


    Although the program adds the text `Hello`, you could store this string in another
    string variable. (I do that in the following example.) By using the'
