- pgno: 214
  md: '# Chapter 18


    # Getting Chatty with Comments


    In This Chapter


    +   - Creating comments

    +   - Saying something with comments

    +   - Making your comments stand out

    +   - Disabling an instruction


    Our Linux program may be clear to you, but ask your friends to take a look at
    it, and they may spend several hours trying to figure out what’s happening.


    After they write a program, some programmers put it aside, work on a different
    project, and then come back to the program. If you do so, you’re likely to need
    to study your own code to recall what you wanted your program to tell the computer
    to do.


    How can you keep from forgetting what you want your Linux program to do? You have
    only one solution: Place comments throughout your program. A *comment* is a line
    in your program that tells you what’s happening in your code. Your computer ignores
    any comments it encounters, as though it’s saying, “Keep your remarks to yourself
    — you already gave me instructions.”


    # How to Create Comments


    You create a comment in a program by typing # (the number sign) anywhere on the
    line. Your program ignores characters between the number sign and the end of the
    line. Following are examples of comments:


    ```

    #This is the beginning of my program

    clear #This clears the screen

    ```'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'The first line in this example doesn’t tell the computer to do anything. This
    comment line does, however, tell those reading the program that the program begins
    here. The second line instructs the computer to clear the screen and adds a comment
    for anyone who reads the program (just in case they need help).


    ![](img/05279073f26be7df99b3c487360dec6a_215_0.png)


    You can use as many comment lines as you want. Just make sure that each line begins
    with a `#` sign.


    # ## Make Your Comments Worthwhile


    The main reason for placing comments in a program is to enable you to easily remember
    what you want the computer to do with your instructions. Most programmers use
    comments at the beginning of important sections of their programs.


    To introduce the purpose of your program to whoever may read it, you always want
    to place comments at the beginning of your programs. (You never know when you
    may want to share your programming secrets with a friend.) Although you can create
    any kind of introductory comments you want for your program, you want to include
    at least some of the following information in this list:


    +   - Program name

    +   - Programmer’s name

    +   - Purpose of the program

    +   - Name of the intended user of the program

    +   - Date on which the programmer wrote the program (and sometimes the time)

    +   - Date of the last change that anyone made to the program

    +   - Name of the programmer who made the last change


    Now that you know what to include at the top of your program, you want to see
    how your program looks with this information in place. The following example of
    commented code incorporates all the information in the preceding list:


    ```

    ```python

    #Title: Regional Reporting Program

    #Programmer: Mary Jones

    #Purpose: Provide business tracking for each regional office.

    #Primary user: All regional office managers and their staff.

    #Originally written: 12/26/95

    #Last changed: 2/4/96

    #Changed by: Roger Smith

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Use comments throughout your program to identify key actions that the computer
    takes. In the following example, you''re instructing the computer to call a subroutine
    by the name of *menul*, and the comment reminds you of this action:


    ```

    @display the opening screen

    menul

    ```


    The name of the subroutine *menul* doesn''t provide much information. You can
    guess that it somehow involves a menu, but which one? And anyone reading your
    code has even less of an idea. The comment in front of the instruction, however,
    answers that question.


    ![](img/05279073f26be7df99b3c487360dec6a_216_0.png)


    ![](img/05279073f26be7df99b3c487360dec6a_216_1.png)


    If you''re trying to decide whether to use a comment in your program, follow this
    rule: If in doubt, add the comment.


    # # Make Your Comments Easy to Read


    Keep in mind that you and your friends are probably reading your Linux programs
    (so you better watch what you say). You can make your program much easier to read
    if you use blank lines to separate chunks of your program.


    In addition to making your comments understandable to anyone who reads them, you
    must also present them in a clear way. Look at the following example to see how
    difficult identifying the different sections in the program is:


    ```

    @Title: Regional Reporting Program

    @Programmer: Mary Jones

    @Purpose: Provide business tracking for each regional office.

    @Primary User: All regional office managers and their staff.

    @Originally Written: 12/26/95

    @Last Changed: 2/4/96

    @Changed By: Roger Smith

    #Change these values for each region

    declare REGIONAL_OFFICE*"Boston"

    declare REGIONAL_MGR*"Mary Smith"

    let REGIONAL_SALES=1000000

    @Display the opening screen

    menul

    ```


    Can you quickly see where comments end and the code begins? Probably not. Now
    compare the preceding example with the following one:


    ```

    @Title: Regional Reporting Program

    @Programmer: Mary Jones

    @Purpose: Provide business tracking for each regional office.

    @Primary User: All regional office managers and their staff.

    @Originally Written: 12/26/95

    @Last Changed: 2/4/99

    @Changed By: Roger Smith ...

    ```'
  merge: -1
  img_proc: true
- pgno: 217
  md: '```

    #Change these values for each region

    declare REGIONAL_OFFICE="Boston"

    declare REGIONAL_MGR="Mary Smith"

    let REGIONAL_SALES=1000000


    #Display the opening screen

    menu1

    ```


    This example is much easier to read because it uses blank lines to break up the
    code into sections. You add blank lines to your program by inserting a *carriage
    return* (also known as a **hard return**) on a line that doesn’t contain any text.
    The easiest way to insert a hard return is to move the cursor to the end of a
    line of text and press the Enter key. Rather than type text on the line, press
    the Enter key again. Voilà — a blank line!


    # How to Disable a Pesky Instruction


    Beware! Bugs can work their way into your program. A bug is an error in your program,
    and sometimes it’s hard to uncover. Suppose that you write a program to tell your
    computer to do something, but the computer doesn’t do it. You have a bug in your
    program! What do you do? The following list provides your choices:


    +   - “Scream, ‘I hate computers!’” This technique doesn’t do anything to get
    your program to work, of course, but it certainly can relieve some of your frustrations.

    +   - Test your program to determine which instruction isn’t working. Keep in
    mind that the computer does what you tell it to do. You’re probably simply given
    it an incorrect instruction.


    You can use comments to disable instructions in your program. Although programmers
    use a number of techniques to locate bugs in their programs (and I discuss these
    techniques in depth in Chapter 19), most methods consist of the following basic
    steps:


    +   1. Disable an instruction.

    +   2. Test the program.

    +   3. Review the results.


    You can disable a part of your program by placing the number sign (#) at the beginning
    of the line that contains the instruction.


    Suppose that you run a program (a snippet of which appears in the following example),
    and for some reason, it displays an incorrect regional sales value. As you inspect
    your code, you see — and suspect — an instruction that creates a REGIONAL_SALES
    environment variable that displays a value of 1000000. Can'
