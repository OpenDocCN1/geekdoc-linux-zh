  md: '> Keep in mind, however, that what you ask for does matter to the person using
    your program. You must ask for the information in a logical way. Someone using
    your program doesn''t, for example, expect you to ask for a first name, age, and
    then a last name. That order just doesn''t make sense. First name, last name,
    and age is an order that seems better.


    Besides using common sense in requesting information, you also want to ask one
    question at a time. The following code illustrates how to read both string and
    numeric data in a logical order:


    ```

    #!/bin/bash

    clear

    echo " * "

    echo "Enter Your First Name: "

    read FirstName

    echo "Enter Your Last Name: "

    read LastName

    echo "Enter Your Age: "

    read age

