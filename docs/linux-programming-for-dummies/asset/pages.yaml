  md: "The following code also displays a **Hello** message to each of your three\
    \ buddies:\n\n```\nlet counter = 1\nwhile [ \"$counter\" -lt 5 ]\ndo\n\tif [ \"\
    $counter\" -eq 1 ]\n\tthen\n\t\techo \"Hello, Mary.\"\n\tfi\n\tif [ \"$counter\"\
    \ -eq 2 ]\n\tthen\n\t\techo \"Hello, Joe.\"\n\tfi\n\tif [ \"$counter\" -eq 3 ]\n\
    \tthen\n\t\techo \"Hello, Sue.\"\n\tfi\n\tlet counter=$counter + 1\ndone\n```\n\
    \nHere's what's happening.\n\nEach time instructions within the **while** loop\
    \ execute, the computer checks the value of *counter*.\n\nDepending on the value\
    \ of *counter*, a particular welcome message appears.\n\nThe last instruction\
    \ in the **while** loop (let *counter*=*counter* + 1) tells the computer to add\
    \ 1 to the value of *counter* and then assign this new value to *counter*. This\
    \ instruction enables the computer to display all the messages.\n\nAfter these\
    \ instructions execute, the computer checks the value of *counter* to see whether\
    \ the value is less than 5. If the value of *counter* is less than 5, the instructions\
    \ execute another time. If the value of *counter* is greater than 5, the loop\
    \ ends.\n\nThe preceding program took 16 lines of code to accomplish the same\
    \ result as the following **for** in loop. I probably could have written in longhand\
    \ in less time than it takes to simply read the code in the preceding example.\n\
    \nUse the following code to display a greeting to each of your three pals by using\
    \ the **for** in loop:\n\n```\nfor friend in Mary Joe Sue\ndo\n\techo \"Hello,\
    \ $friend.\"\ndone\n```"
