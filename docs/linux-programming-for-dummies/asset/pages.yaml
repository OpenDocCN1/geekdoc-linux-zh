- pgno: 158
  md: '# ## Chapter 13


    # # Waxing Efficient with Functions (So You Don’t Have to Retype Code!)


    **In This Chapter**


    +   ▪ Creating a function

    +   ▪ Calling a function

    +   ▪ Passing arguments to a function

    +   ▪ Sharing a function with a subprogram

    +   ▪ Returning a value from a function


    As you begin to write Linux programs, you find yourself repeating the same commands
    over and over again. You may want to personalize and print an invitation to your
    next bash (pardon the pun), for example, and then send the invitation to your
    friends. You can write the message inside a `for` in loop and place your friends’
    names in a *wordlist*, which you can read about in Chapter 11. You can also rewrite
    the invitation many times in your program for each of your friends. Or you can
    use a function.


    A *function* is part of your Linux program that you set aside from the rest of
    the program. Think of a function as a compartment inside your program. You identify
    a function with a unique name (known as, logically enough, a *function name*),
    and then you store one or more commands that you frequently use inside the function.


    You can enter the name of the function in your program whenever you want Linux
    to use the commands that you store in the function. You can, thereby, use the
    same commands over and over simply by using the name of the function instead of
    rewriting all those commands again. I’d place the invitation to my bash inside
    a function.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'You can pass information to the function each time that you call the function.
    You refer to this procedure as *passing a parameter to the function*. So if you
    create a function to print an invitation, you''re passing the function a name.
    The function automatically assigns your friend''s name to a variable inside the
    function. You then use a variable instead of the friend''s name whenever you refer
    to that friend in the invitation.


    You commonly use functions to do something with information that you pass to the
    function. The results of whatever the function is doing then return to the part
    of the program that called the function. The result of the function is known as
    the function''s *return value*, which you can use within your program.


    You want to use functions whenever you find yourself rewriting the same code in
    your program. In this chapter, I show you how to create and use functions in your
    program.


    # # Creating a Function


    You must define a function before you use that function in a program. The best
    place to create a function, therefore, is at the beginning of your program. Creating
    a function is also known as *defining a function*, the results of which you refer
    to as a function definition.


    ![](img/05279073f26be7df99b3c487360dec6a_159_0.png)


    You can create as many functions as you want, but limit your enthusiasm to a few.
    Otherwise, you''re almost certain to lose track of all the functions that you
    create. Start with one function if you''re rewriting code and then add others
    as they become necessary. Keep in mind that your program doesn''t require a function
    if the program doesn''t contain any repeating code.


    Follow these steps to define a function:


    +   1. Begin your program by typing the word *function* into your program.

    +   This action tells Linux that you''re creating a function.


    +   2. Give your function a name that you don''t use anywhere else in your program.

    +   Make sure that the name reflects the purpose of the function. Don''t, for
    example, call a function that displays text on-screen *booh* if the name *display*
    is more informative.


    +   3. Type an open French brace ( ) between the function name and the first command.

    +   The brace tells Linux that commands follow.


    +   4. Type any commands that you want to execute after the function calls.

    +   You can use any commands that I discuss in this book within a function.'
  merge: -1
  img_proc: true
- pgno: 160
  md: "+   5. Type a semicolon (:) after each command and before you type the next\
    \ command.\n+   *Don't* place a space before the command and the semicolon. The\
    \ semicolon tells Linux that the specific command is ending.\n\n+   6. Type a\
    \ close French brace ()) after the semicolon of the last command.\n+   *Don't*\
    \ place a space between the last semicolon and the brace. This final action tells\
    \ Linux that the function definition is complete.\n\nFollowing are the components\
    \ of a function definition:\n\n```\n```\nfunction name\n{\n  command;\n  command;\n\
    }\n```\n```\n\nFollowing is a typical function definition that displays a welcome\
    \ message on-screen. (I refer to this function later in the chapter, so keep it\
    \ handy!)\n\n```\n```\nfunction display\n{\n  echo \"Welcome to the world\"\n\
    \  echo \"of functions\"\n}\n```\n```\n\n# Calling a Function\n\n*Calling a function*\
    \ is pretty easy after you define the function. All you need to do is use the\
    \ name of the function in your program wherever you want to use the commands that\
    \ the function contains. By *calling a function*, you order Linux to find the\
    \ definition of that function and execute each command that it finds. After reaching\
    \ the close French brace, Linux returns to the line following the function line\
    \ in your program. Linux continues to execute your program as if the function\
    \ never existed.\n\nFollowing is a typical command that calls a function:\n\n\
    ```\n```\n#!/bin/bash\nclear\nfunction display\n{\n  echo \"Welcome to the world\"\
    \n  echo \"of functions.\"\n}\ndisplay\n```\n```"
