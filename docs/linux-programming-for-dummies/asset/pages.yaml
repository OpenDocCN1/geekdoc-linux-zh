- pgno: 234
  md: '# Chapter 20


    # Getting Goofy with E-Mail


    **In This Chapter**


    +   ➤ Understanding e-mail

    +   ➤ Creating a new user

    +   ➤ Using the mail utility

    +   ➤ Enhancing e-mail


    To send the same e-mail to many friends at the same time, you can write your e-mail
    by using a text editor such as vi (which I show you how to use in Chapter 3).
    You can then use vi to write your program that sends the e-mail, too. Run your
    program, and the e-mail leaves your computer and goes to its recipients faster
    than a speeding bullet.


    Your program uses the Linux mail utility, which handles the nitty-gritty work
    of combining the e-mail addresses with the message and makes all the necessary
    connections to help your e-mail follow the right path to your friends.


    Your job is to give the mail utility all the information it needs to process your
    electronic letter. I like to think of the mail utility as the postal carrier who
    picks up your mail from the mailbox and needs to place the mail into the correct
    postal bag at the post office so that the mail can arrive at your friends'' mailboxes.


    The mail utility is like a postal carrier who''s very particular about the mail
    I give him to take to the post office for processing. It inspects the envelope,
    and if any critical piece of information is missing, such as the stamp or the
    mailing address, it refuses to accept the letter.'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'The mail utility in Linux inspects the e-mail before processing my electronic
    envelope. The mail utility requires the first two pieces of information in the
    following list, and common courtesy requires the third piece of information:


    +   - The destination address.

    +   - The name of the file that contains the letter.

    +   - The subject, although this information is optional.


    The destination address consists of the person''s name and the computer that contains
    that person''s electronic mailbox. The filename tells the mail utility the name
    of the file that you create in vi that contains the letter you want to send. The
    subject consists of the word or two that describes the topic of the e-mail.


    # # The pathway to the outside world


    The computer running Linux must connect either directly or indirectly to your
    friend''s electronic mailbox; otherwise, it can''t deliver your e-mails. Don''t
    expect your e-mails to go across the Internet if your computer running Linux doesn''t
    connect to the Internet correctly. You can send an e-mail to bgates@microsoft.com
    by using the mail utility on your computer, but your message can''t get to him
    if your computer doesn''t connect to the Internet.


    # # The pathway to the inside world


    Linux is a *multiser operating system*, which is the fancy way of saying that
    more than one person, each known as a *user*, can access your computer at the
    same time. You can use complex wires and gizmos to connect each of your friends''
    computers to your computer that runs Linux and create your own intranet. But you
    don''t need to do so to discover how to send e-mail automatically. Nor do you
    need to hook your computer to the Internet.


    You can create any number of users on your own computer and then have each of
    them log in to your computer by using your computer''s keyboard. This approach,
    however, means that your friends must come over to your house to read their e-mails
    that you send them by using Linux. Not very practical — unless, of course, they
    bring refreshments over with each visit. But this method does offer a very practical
    way to find out how to write programs that send mass e-mails.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# ## Creating a New User


    Before you send your first e-mail, you want to create several users on your own
    computer. A user is a person who can log in to your computer and access the disk,
    modem, and other resources that attach to the computer. Pick up a copy of Linux
    For Dummies, 2nd Edition, by Jon Hall (published by IDG Books Worldwide, Inc.)
    to find out more about user logins.


    Two pieces of information are necessary to create a user: the *user ID* and *password*.
    The *user ID* is a set of letters and characters that uniquely identifies the
    user on your computer.


    You can use *b g a t e s* as a user ID, for example, as long as no one else on
    your computer already claims *b g a t e s* as a user ID. Bob Gates and Barbara
    Gates may both want *b g a t e s* as a user ID, but only one of them can have
    it.


    The *password* is a series of letters and numbers that associate with a specific
    user ID. You create the initial password for each user ID. Each user then can
    change his password to something unknown to you. Unlike with user IDs, people
    *can* duplicate passwords, which means that Bob Gates and Barbara Gates both can
    use the same password.


    You create new users and assign user IDs and passwords in this chapter only so
    that you can practice sending and receiving e-mail. You don’t, therefore, need
    to take precautions to use letters and words for the password that are difficult
    to guess. You do, however, need to devise a procedure to inhibit a hacker from
    guessing your passwords if you connect your computer to the outside world through
    the Internet.


    # ### The root user


    The *root user* is the user ID with the right to do anything in Linux, such as
    configuring hard disks, shutting down the computer, and creating new users. As
    you first install Linux, it prompts you to enter a password for the root user
    ID. This password, along with the root user ID, enables you to log in to Linux
    as the root user and gives you full access to Linux.


    Follow these steps to log in as the *root* user:


    +   1.  Type **login root at the command line.**

    +   2.  Press the **Enter** key.

    +   3.  Type the root password (whatever you want it to be) at the command line
    after Linux prompts you for it.

    +   4.  Press the **Enter** key.'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'You must log in as the root user before you can create a new user. Linux prompts
    you if you enter the wrong password and gives you a chance to enter the correct
    password. You must reinstall Linux, however, if you ever can''t recall the root
    ID password.


    # # User IDs and passwords


    After you log in by using the root ID, you''re all set to create your first user.
    Think of a user ID that you want to give the new user before you begin. Because
    this computer is mine and I don''t have any friends who share the same first name,
    I like to use their first names as their user IDs. You can, of course, use any
    name you that you want as long as the names are unique—and you can remember them.


    Whenever they need to assign user IDs to many users, many Linux administrators
    create a program to automatically create user IDs by combining information about
    the person to form the user ID. Following are some of those techniques that such
    a program uses:


    +   - Using the initials of the person''s first and last name, following them
    by the last five digits of the person''s Social Security Number.

    +   - Using the initials of the person''s first and last name, following them
    by the person''s employee number.

    +   - Using the initial of the first name, following it by the first four characters
    of the last name. The program then assigns each person whose name includes the
    same five characters a number in sequence, such as `jkeog1`, `jkeog2`, and so
    on.


    You can create a program that automatically generates passwords, too. Because
    passwords don''t need to be unique, the program typically assigns the same password
    to each user ID and then requires the person to change the password the first
    time that he logs in to the computer.


    Sometimes Linux administrators use the day of the week that they create the user
    ID as the password. That way the Linux administrator can easily remember the password,
    because his records indicate when he created the user ID.


    # # Adding a new user


    You create a new user on your computer by using the `useradd` utility. The `useradd`
    utility requires that you enter the user ID of the new user as you call'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'the useradd utility. The following example shows how I create a user ID for
    my friend Bob:


    ```

    useradd bob

    ```


    I use Bob''s first name as the user ID and I enter it in lowercase letters. I
    can use any letters or numbers for the user ID and also can use a mixture of upper-
    and lowercase or all uppercase letters. Bob''s user ID, therefore, can also appear
    as any of the following variations (whichever one I may choose to make it):


    ```

    Bob

    BOB

    bOb

    BOB

    ```


    ![](img/05279073f26be7df99b3c487360dec6a_238_0.png)


    I prefer to keep user IDs simple, however, because Linux user IDs are case sensitive,
    which means that Linux treats each of the preceding four examples as unique user
    IDs—in addition to the original version, bob. All the user IDs that I create,
    therefore, are in lowercase, which enables users and me to remember them more
    easily.


    After I press the Enter key, Linux prompts me to enter a password for the new
    user ID. Again, I like to keep things simple, especially because I''m creating
    this user ID to practice my e-mail programming. So I use the user ID as the password,
    too, as follows:


    ```

    passwd bob

    ```


    Don''t get confused if you see passwd. Instead of using password as the prompt,
    Linux just uses passwd. (You notice that Linux likes to abbreviate.) Simply enter
    the password after the prompt and press the Enter key.


    Don''t get surprised if Linux becomes a little temperamental and yells at you,
    saying that it doesn''t like the password you select. Linux doesn''t like most
    of the passwords that you come up with because those passwords appear in the Linux
    dictionary. You can almost always expect to see the following message after you
    enter the password.


    ```

    New Unix password: bob

    BAD PASSWORD: it is based on dictionary word.

    Retype new Unix password:

    ```


    Of course, Linux substitutes your own password for the word bob in this example.
    This message is merely a warning, which you can ignore. Linux is simply telling
    you that a hacker can create a program that uses each word in the dictionary as
    the password. If your password is in the dictionary, the likelihood that a hacker
    can figure out your password is high.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'I don''t worry about hackers because the hacker needs to gain physical access
    to my computer, as my computer doesn''t currently link to the Internet. Besides,
    even if a break-in occurs, all the hacker gets are example Linux programs, which
    are available to him already simply by buying this book.


    Linux prompts you to retype the new Unix password. Don''t get upset, by the way,
    that Linux uses Unix instead of Linux in its error message. Remember that Linux
    is the child of Unix and inherits Unix utilities, including the adduser utility.


    Enter the same password again. This action assures both you and Linux that you
    didn''t mistype the password the first time you entered it. You receive an error
    message if you enter a different password the second time. In this case, Linux
    permits you to re-enter the password again. The following example shows what you
    see on-screen before retyping the password:


    ```

    ```

    New Unix password: bob

    BAD PASSWORD: it is based on dictionary word.

    Retype new Unix password:

    ```

    ```


    Notice that you don''t see the password as you retype it. That''s because Linux
    doesn''t display the password as you type it to prevent any Peeping Toms from
    seeing the new password. After pressing Enter, Linux returns you to the shell
    prompt as if nothing''s happened.


    # Testing the new user ID


    Try logging in to your computer as the new user after you create the user ID.
    You do so the same way that you log in as the root, although you use the new user
    ID instead of the root ID and use the new password instead of the root password.


    Type login at the prompt, following it with the user ID, as shown in the following
    example:


    ```

    ```login bob```

    ```


    After you press the Enter key, Linux prompts you to type the password.


    After you press the Enter key, Linux validates your user ID and password, and
    if you pass, the user ID appears as part of the command prompt. I enter bob as
    the user ID and bob@mycomputer appears as part of the new command prompt, as in
    the following example:


    ```

    ```bob@mycomputer$```

    ```'
  merge: -1
  img_proc: true
- pgno: 240
  md: "# Test your programming knowledge\n\n+   1. What does the following Linux command\
    \ do?\n+   \n+   ```\n+   useradd tom\n+   ```\n\n+   a. Orders the user tom to\
    \ perform addition.\n+   b. Declares a variable by the name of tom.\n+   c. Tells\
    \ the computer to create a new user with the user ID tom.\n+   d. Tells the computer\
    \ to add the word user to tom.\n\n+   a. So that you can keep your password secret\
    \ from hackers.\n+   b. So that you can use the dictionary whenever you forget\
    \ your password.\n+   c. So that you can check the spelling of the password by\
    \ looking it up in the dictionary.\n+   d. Linux is showing off that it can automatically\
    \ look up words in a dictionary.\n\n+   2. What is the purpose of Linux telling\
    \ you that your password is in the dictionary?\n\n**Answers:** 1) c. See “Adding\
    \ a new user.” 2) a. See “Adding a new user.”\n\n# The user’s e-mail address\n\
    \nAn e-mail address and a mailbox for each user ID resides on the computer on\
    \ which the user logs in to Linux. The e-mail address consists of the user ID,\
    \ the *at* symbol (@), and the name of the computer that saves the user ID.\n\n\
    Linux gives your computer the name **mycomputer** as you install Linux. As I create\
    \ the user ID **bob**, therefore, I create **bob** as a user on **mycomputer**.\
    \ The e-mail address for **bob** then becomes **bob@mycomputer**.\n\nThis designation\
    \ is like saying **bob at mycomputer** or **bob at New York City**. Thousands\
    \ of bobs live in New York City, of course, but I can’t have more than one **bob**\
    \ on **mycomputer**. Remember that **bob** is a user ID that must be unique to\
    \ **mycomputer**. So e-mail that you send to **bob** on **mycomputer** doesn’t\
    \ mis-route anywhere else.\n\n# Logging out\n\nAfter you’re sure that your test\
    \ of the new user login is successful, you must log out so that you can log back\
    \ in as the root. This action enables you to do anything that you want in Linux,\
    \ including shutting down Linux — something that you can’t do as the new user."
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Type the logout command and then press the Enter key to log out of the user
    ID, as follows:


    ```

    logout

    ```


    After you log out, you again find yourself at the command prompt.


    You can log in as root by typing the following and then pressing the Enter key:


    ```

    login root

    ```


    Linux prompts you to enter the root password. Do so and press the Enter key. Linux
    changes the prompt to the following:


    ```

    root@mycomputer

    ```


    # Using the Mail Utility


    The mail utility is a tool available in Linux to automatically process outgoing
    and incoming e-mails. All you need to do is provide the mail utility with specific
    information and sit back, knowing that the electronic postal carrier is handling
    your message.


    The mail utility performs the following tasks:


    +   - Receives e-mail someone sends to a user’s e-mail address.

    +   - Displays incoming e-mail on-screen.

    +   - Creates e-mails.

    +   - Sends e-mails.


    You have two mailboxes: an *incoming box*, where you receive e-mail for a user
    ID, and an *outgoing mailbox*, where the utility keeps e-mails that the user ID
    sends out for transmission. The mail utility uses the user IDs to identify the
    user mailboxes.


    # Creating e-mail


    Although you can use the mail utility to create an e-mail, I find that using a
    text editor such as vi to create my e-mail is more efficient.


    To use vi to create an e-mail, type the following at the command line and press
    the Enter key:


    ```

    vi mesol

    ```'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'This command starts vi and opens an empty document by the name of memo1. You
    can, of course, replace memo1 with the name of your e-mail. You can call the e-mail
    any name that you want. vi uses the name that you assign to the e-mail as the
    file name for the document.


    Create your e-mail message in vi. (If you need more help with vi, see Chapter
    3.) After you finish, follow these steps:


    +   1. Press the Esc key.

    +   2. Press and hold the Shift key as you type ZZ.


    Linux saves your file, you exit vi, and you return to the command prompt.


    ![](img/05279073f26be7df99b3c487360dec6a_242_0.png)


    Remember the name of the document, because you need the name to send the e-mail.


    # Sending e-mail


    You can use the mail utility from the command prompt without first needing to
    write a program to send e-mail. Doing so is a good way to become familiar with
    using the mail utility before incorporating the mail utility into your program.


    The mail utility requires the following two pieces of information:


    +   The destination address.

    +   The filename containing the e-mail message.


    The *destination address* is the e-mail address of the person to whom you’re sending
    the e-mail. In our first example, I’m sending the e-mail to my closest friend
    — me! Yes, you can send e-mails to yourself whenever you get lonely or, in this
    case, whenever you want to practice sending e-mails.


    ![](img/05279073f26be7df99b3c487360dec6a_242_1.png)


    # Composing and editing e-mails by using the Linux mail utility


    The mail utility uses its own commands for composing and editing text of an e-mail
    message. These commands can prove confusing, especially if you already know vi
    commands. The vi text editor does the job quite well, so you don’t really need
    to pick up unnecessary mail-utility


    commands — unless you’re really looking for a challenge. If so, you can use the
    online manual pages available in Linux by typing the following command and pressing
    the Enter key:


    ```

    man mail

    ```'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'My e-mail address is the same as your e-mail address, because both of us use
    the root user ID. My e-mail address, therefore, is root@mycomputer. I first create
    an e-mail and save the e-mail in a file with the name memol. You can call the
    file anything you like.


    At the command prompt, I type the name of the mail utility, following it by the
    destination address and the name of the file that contains the e-mail message,
    as shown in the following example:


    ```

    ```

    mail root@mycomputer < memol

    ```

    ```


    The name of the mail utility is mail. (Not very creative is it?) A space separates
    mail from the destination address, which is root@mycomputer in this example. I
    use the less-than symbol (<) to tell the mail utility the name of the file that
    contains the e-mail message.


    The geeks call the less-than symbol redirection of input. This term sounds confusing,
    but as is the case with many terms that you use in programming, this one is very
    easy to understand. Input refers to where the mail utility receives the e-mail.


    If we leave out the less-than sign and memol, the mail utility assumes that you’re
    going to enter the e-mail message directly into the mail utility from the keyboard.
    You can do so, but you need to know the mail utility’s text-editing commands.
    (For more about mail text-editing commands, see the sidebar “Composing and editing
    e-mails by using the Linux mail utility” in this chapter.)


    The less-than sign, however, tells the mail utility to get the e-mail message
    from the file memol instead of from the keyboard. In essence you’re redirecting
    words that you normally type from the keyboard to the file memol.


    After you press the Enter key, the mail utility sends the file memol to the e-mail
    address root@mycomputer.


    # Reading e-mail


    You can use the mail utility to read your e-mail. First, type mail at the command
    prompt. (After you press the Enter key, the mail utility goes to your incoming
    mailbox and displays a list of all e-mails.) Just use the following command to
    summon the list:


    ```

    ```

    mail

    ```

    ```'
