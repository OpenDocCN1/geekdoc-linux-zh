  md: '![](img/05279073f26be7df99b3c487360dec6a_38_0.png)


    # Giving a Linux Program an Appropriate Name


    You can save a Linux program in one file or in more than one file, depending on
    how many commands you need to tell the computer what you want it to do. You always
    need at least one file for any Linux program.


    Some computer languages, such as C++, Java, and Visual Basic, require a project
    file that helps you keep track of your programs. Linux programs, however, don''t
    require any special file. Nothing''s special, in fact, about the file that contains
    your Linux program except how you name your program files.


    Following are some guidelines and rules for choosing a filename:


    +   ✔ You can call the program file virtually any name that you can imagine (although
    MoelLarryCurly is a little less than creative). Use some common sense and make
    the name reflect the contents of the file (TelephoneList, JanBudget, or FamilyTree,
    for example).'
