- pgno: 230
  md: "# Chapter 19: Stamping Out Bugs in Your Program\n\n```\n```\n        echo \"\
    inside of for in loop flag = $flag \"\n        echo \"Hello $friend.\"\n    done\n\
    #   echo \"Good-bye!\"\n#   let flag=1\n#done\n```\n```\n\nThe computer starts\
    \ the `bash` Shell. It ignores the next two lines because they’re comments. The\
    \ `for` in loop and the code inside this loop execute, and the program ends.\n\
    \nThis process tells you that the problem isn’t with the `for` in loop. It must\
    \ lie somewhere else.\n\nMove to the next line, which displays a farewell message,\
    \ and remove the comment character. The following example shows how it looks now:\n\
    \n```\n```\n#!/bin/bash\nlet flag=1\n#while [ \"$flag\" -eq 1 ]\n#   do\n    \
    \    for friend in Bob Mary Sue\n        do\n            echo \"inside of for\
    \ in loop flag = $flag \"\n            echo \"Hello $friend.\"\n        done\n\
    \    echo \"Good-bye!\"\n#   let flag=1\n#done\n```\n```\n\nYou then see that\
    \ the program works fine.\n\nThe only part of the program that isn’t on is the\
    \ `while` loop and related instructions. By the process of elimination, you know\
    \ that the problem with the program lies in the `while` loop.\n\nYou can make\
    \ sure that the problem lies there by removing the rest of the comments from the\
    \ program; then run the program again. The following example shows how it now\
    \ looks:\n\n```\n```\n#!/bin/bash\nlet flag=1\nwhile [ \"$flag\" -eq 1 ]\n   \
    \ do\n        for friend in Bob Mary Sue\n        do\n            echo \"inside\
    \ of for in loop flag = $flag \"\n            echo \"Hello $friend.\"\n      \
    \  done\n    echo \"Good-bye!\"\n    let flag=1\ndone\n```\n```\n\nYou’re correct.\
    \ Now the program no longer works, and you can concentrate your troubleshooting\
    \ on the `while` loop."
