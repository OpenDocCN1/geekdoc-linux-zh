  img_proc: true
- pgno: 251
  md: '+   1. **Open your text editor.**

    +      In this example, I use the `vi` text editor and call my program `mailprogram`,
    but you can call your program anything that you want. To start `vi`, for example,
    you need to type the following:

    +      ```

    +      vi mailprogram

    +      ```


    +   2. **Next, type the following code into `vi` (and if you need to brush up
    on your `vi` commands, review Chapter 3):**

    +      ```

    +      #!/bin/bash

    +      mail -s "Good News" bob@mycomputer < memo1

    +      ```

    +      Here’s what this program does: The first line, `#!/bin/bash`, tells Linux
    that this program is a `bash` program and that Linux must first run the `bash`
    shell before running this program. Remember that, if your copy of Linux complains
    about this line (such as saying that `#!/bin/bash` is an unknown command), you
    can also run the program by typing the following line at the command prompt:

    +      ```

    +      /bin/bash mailprogram

    +      ```

    +      The last line of the program calls the `mail` utility and tells it to send
    the message `Good News` in the `memo1` file to `bob@mycomputer`.


    +   3. **Before you can run this program, you must save the program file by pressing
    Esc, Shift+ZZ.**

    +      This command automatically saves the file as `mailprogram` and closes `vi`.


    +   4. **At the command prompt, type the following:**

    +      ```

    +      chmod 711 mailprogram

    +      ```

    +      This last step is to make the program file executable, which simply means
    that you do something to tell Linux that the `mailprogram` file contains a program.

    +      This command calls the `chmod` utility, which you use to change the status
    of a file. The `711` isn’t a telephone number; it’s the code that makes the `mailprogram`
    an executable number. You can read more about the `chmod` utility in *Linux For
    Dummies*, 3rd Edition, by Dee-Ann LeBlanc, Melanie Hogan, and Evan Bloomquist
    (published by IDG Books Worldwide, Inc.). After you press Enter, Linux runs the
    `chmod` utility.


    To execute the `mail` program, type the following at the command prompt and then
    press the Enter key:

    ```

    mailprogram

    ```

    The `mailprogram` program sends the e-mail to Bob. You can verify that the program
    works and that Bob receives your e-mail by logging in to your'
