- pgno: 250
  md: '# Chapter 21


    # Automatic E-Mailing


    # In This Chapter


    +   ► Sending e-mail from a program

    +   ► Passing an argument to an e-mail program

    +   ► Passing multiple arguments to an e-mail program

    +   ► Overriding default e-mail values


    If you want to send the same e-mail to many friends, you use the Linux mail utility
    and insert the different addresses at the mail command line. (If you need more
    information on the basics of e-mail, refer to Chapter 20.) This process can become
    cumbersome if you frequently e-mail a long list of friends, because each time
    that you want to send an e-mail, you must retype all the addresses and the name
    of the message file. After you modify your program, you can send an e-mail without
    directly using the mail utility. Cool, eh?


    Linux automates the e-mail process by creating a program that does all this work
    for you. You enter the list of addresses only once by entering those addresses
    into the program and not directly into the mail utility.


    You can also write a program that changes the e-mail message without needing to
    rewrite the program. You can then send e-mails to all your friends by running
    the program and giving the program the filename that contains the e-mail message.
    The program takes care of sending the e-mail to your friends.


    # Sending E-Mail from a Program


    Say that you want to send an e-mail message that you keep in a file to a friend
    by using a program. To do so, you simply write your program in a text editor,
    save the program, close the text editor, and then make the program file executable
    so that Linux knows that the file contains a program. The following instructions
    take you step by step through this procedure:'
