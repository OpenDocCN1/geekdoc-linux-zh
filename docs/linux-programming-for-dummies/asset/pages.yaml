    while ($flag = "go")

    "Cho "Enter your name or type stop to end: "

    "set friend = $

    if ($friend = "stop") then

    set flag = "stop"

    break

    endif

    if ($friend = "tom") then

    continue

    endif

    echo "Hello, $friend!"

    end

    echo "Good-bye!"

    ```'
