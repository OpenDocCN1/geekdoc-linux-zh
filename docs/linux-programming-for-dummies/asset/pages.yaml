- pgno: 6
  md: '# # About the Author


    Jim Keogh is chair of the Electronic Commerce Track at Columbia University. He
    has developed Unix and Linux systems for major Wall Street firms and is the author
    of more than 45 books on computers and computer programming, including the popular
    *UNIX Programming for Dummies*. He was one of the first to introduce PC programming
    internationally in his “Programmer''s Notebook” column in *Popular Electronics
    Magazine*, four years after Apple Computer was born in a garage. Keogh is also
    a former contributing editor to *Popular Electronics Magazine* and associate editor
    for *Personal Computing Magazine*.


    ![](img/05279073f26be7df99b3c487360dec6a_6_0.png)'
