    Your computer doesn't need to follow all the instructions that you place inside\
    \ a loop. It can skip some instructions if you use the `continue` statement. The\
    \ following code demonstrates the use of the `continue` statement:\n\n```\n```\n\
    declare n=1\nwhile [ $n -eq 1 ]\ndo\n\techo \"Enter your name or type stop to\
    \ end: \"\n\tread name\n\techo \"Enter your employee number:\"\n\tread num\n\t\
    case $name in\n\t\t\"stop\")\n\t\t\tif [ \"$num\" -eq 1 ]\n\t\t\tthen\n\t\t\t\t\
    continue\n\t\t\telse\n\t\t\t\tbreak\n\t\t\tfi\n\t\t;;\n\t\tesac\n\techo \"Hello,\
    \ $name\"\ndone\n```\n```\n\nHere's what's happening in this sequence:"
