- pgno: 188
  md: '# Problems with Sending Arguments


    ![](img/05279073f26be7df99b3c487360dec6a_188_0.png)


    Two common problems can occur whenever anyone sends your program or subprogram
    arguments: Someone can send you the wrong number of arguments or the wrong kind
    of arguments.


    # The wrong number of arguments


    You can plan to receive a fixed number of arguments, but nothing forces someone
    to send you the correct number. Suppose that your program expects the following
    two arguments:


    ```

    ```bash

    #!/bin/bash

    echo "First Name: $1"

    echo "Last Name: $2"

    ```

    ```


    Now suppose that someone supplies only one of those arguments, as follows:


    ```

    $ displayname Bob

    ```


    Your program is still telling your computer to use the second data item that it
    expects to pass to the program — in this case, the phantom data.


    # The wrong kind of argument


    Your program depends on someone else to pass it the correct information. If this
    person isn''t dependable, your program experiences problems. Say that someone
    calls your program and sends the following information:


    ```

    $ nanegame car: truck

    ```


    Your program assumes that the information is just what it''s looking for in the
    following example:


    ```

    ```bash

    #!/bin/bash

    echo "First Name: $1"

    echo "Last Name: $2"

    ```

    ```


    But that information isn''t what your program expects and your program is using
    incorrect information. So who''s going to get the blame for the problem? The person
    using your program or the programmer? (Who, you? Why, it''s not your fault . .
    . is it?) You have no easy way to avoid this situation or the blame (except by
    not answering the phone if the user calls to complain). As long as you note in
    the documentation of your program that the user needs to enter specific kinds
    of information at the command prompt as the program runs,'
  merge: -1
  img_proc: true
- pgno: 189
  md: "your job is done. You can't force the user to read the documentation before\
    \ running your program. But you still hear such excuses as “Of course I … didn’t\
    \ … read the instructions.”\n\n# # Does Your Argument Exist?\n\nYour program sometimes\
    \ needs for someone to send data to it; otherwise, your program can't perform\
    \ the task. So the first thing that your program needs to do is to determine whether\
    \ anyone's sending any data to it.\n\nYou can use the $\\$ variable to determine\
    \ the number of data items that your program receives. The $* variable contains\
    \ the number of arguments that pass to your program. Notice the difference between\
    \ $1, which you use to reference an argument, and $# , which just contains the\
    \ number of arguments that your program receives.\n\nThe following example shows\
    \ you how you use the $# variable:\n\n```\n```bash\n#!/bin/bash\necho \"$#\"\n\
    ```\n```\n\nThis program displays the number of data items it’s receiving. As\
    \ you run this program, you don’t see the data itself; instead, you see a number\
    \ on-screen, which represents the number of data items your program is receiving.\n\
    \nYou can compare the value of $# with the number of data items that your program\
    \ requires by using the following example:\n\n```\n```bash\n#!/bin/bash\nif [\
    \ \"$#\" -eq 2 ]\nthen\n    echo \"You entered the correct number of arguments.\"\
    \nelse\n    echo \"You didn't enter the correct number of arguments.\"\nfi\n```\n\
    ```\n\nIn the preceding code, the program starts the bash shell and then determines\
    \ whether the correct number of arguments pass to the program. In this case, I\
    \ decide that two arguments are necessary, basing my decision on the specifications\
    \ for the program.\n\nSo the program uses the if statement to compare the value\
    \ in $# with the value 2. If it finds a match, the program displays a message\
    \ and continues (although I don't show the rest of the program in this example).\
    \ If it doesn't find a match, the program ends."
  merge: -1
  img_proc: true
- pgno: 190
  md: "# Test your programming knowledge\n\n+   1.  How can your program access the\
    \ first argument it receives from the command line?\n+       a.  By calling my\
    \ mother-in-law. She has access to everything.\n+       b.  A heavy-duty tire\
    \ iron does the trick.\n+       c.  By referencing the $1 variable.\n+       d.\
    \  By referencing the $argx[1].\n+   \n+       a.  Ask the person who uses your\
    \ program for the number of arguments she typed.\n+       b.  Check the value\
    \ of the $# variable.\n+       c.  Get your program a subscription to *Argument\
    \ Digest*.\n+       d.  Check the whatchamacalit chip in your computer.\n\n2.\
    \  How can you make sure that your program receives the correct number of arguments?\
    \ Answers:1) c. See \"Accepting Arguments.\" 2) b. See \"Problems with Sending\
    \ Arguments.\"\n\nYou can also determine whether a user enters any arguments at\
    \ all by writing something such as the following example in your program:\n\n\
    ```\n```bash\n#!/bin/bash\nif [ \"$#\" -lt 1 ]\nthen\n\techo \"You didn't enter\
    \ the correct number of arguments.\"\nfi\n```\n```\n\nThis program checks to determine\
    \ whether the value of $# is less than 1 — meaning that no one entered any arguments\
    \ on the command line. If so, the following message appears: You didn't enter\
    \ the correct number of arguments. And although I don't show the instructions\
    \ to do so, you're likely to end the program if no information passes from the\
    \ command line."
  merge: -1
