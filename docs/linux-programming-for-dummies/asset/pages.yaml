  md: "ID and password are valid, the verify function sends the results to your program.\
    \ Your program can then decide the appropriate action to undertake.\n\nYour program\
    \ assigns the information that a function returns to the $?. variable. The value\
    \ of that information must be an integer from 0 to 256. You can’t, therefore,\
    \ send a string as a return value of a function.\n\nYour program sends a value\
    \ back from a function by using the return keyword, following it with the value\
    \ that it’s returning. Because the return value is an integer, you must assign\
    \ meaning to each integer that’s returning. You typically use a zero, for example,\
    \ to indicate that the function is operating correctly. Any other integer indicates\
    \ that something’s wrong.\n\nYou can place a return anywhere in your function,\
    \ but the return usually falls somewhere in the program after the place where\
    \ function tests the values — such as where the program compares the ID and password.\
    \ After Linux executes return, the function stops executing and Linux returns\
    \ to the line in the program that calls the function.\n\nThe following example\
    \ shows you how to return a value from a function:\n\n```\n```bash\n#!/bin/bash\n\
    clear\nfunction verify\n{\n    if [ $# -ne 2 ]\n    then\n        return 1\n \
    \   else\n        if [ $1 -eq \"Bob\" ] && [ $2 -eq \"555\" ]\n        then\n\
    \            return 0\n        else\n            return 2\n            echo \"\
    Rejected\"\n        fi\n    fi\n}\nverify Bob 555\ncase $? in\n    0)\n      \
    \  echo \"Verified\"\n        ;;\n    1)\n        echo \"Wrong number of arguments!\"\
    \n        ;;\n    2)\n        echo \"Rejected\"\n        ;;\ndone\n```\n```"
