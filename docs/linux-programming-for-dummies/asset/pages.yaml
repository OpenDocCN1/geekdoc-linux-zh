- pgno: 96
  md: '# Appending data to an existing file


    Who wants to overwrite information in a file every time? No one does. That''s
    why you need to use two greater-than signs $(>)$ instead of a single greater-than
    sign whenever you want to append information to the end of the file instead of
    than overwriting the data that''s already there.


    The *double greater-than sign* $(>$ tells your computer to add the new data at
    the end of the file that you name rather than at the beginning of the file. Your
    computer never overwrites and loses existing data in the file.


    The following code shows practically the same program as the code shows in the
    preceding example — except that it *appends* the new information to the file (assuming
    that the file already exists!). It automatically creates a new file if the file
    that you specify in the program doesn''t already exist.


    ```

    #!/bin/bash

    clear

    echo "."

    echo "Enter your first name: "

    read FirstName

    echo "Enter your last name: "

    read LastName

    echo "$FirstName $LastName" >> employees.dat

    ```


    Data that you save to a file by using the `echo` reserved word appears on the
    same line in the file *just as it appears on the same line on-screen*.


    # Displaying data that you save to a file


    You can show the information that your computer saves to a file on-screen by using
    the `cat` utility from within your program, as shown in the following example.
    You can tell your computer to run a utility program by entering the name of the
    utility in your program — just as you''d type the name of the utility on the command
    line. Programmers refer to this procedure as *calling a utility program*.


    ```

    #!/bin/bash

    clear

    echo "Employee Data"

    echo "."

    cat employees.dat

    ```


    Notice how the last line uses the `cat` command, following it with the filename.


    The following example shows you what appears on-screen after this program runs
    with the `cat` utility.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '![](img/05279073f26be7df99b3c487360dec6a_97_0.png)


    # The inside story of redirection


    Your computer needs to know where to get information. The nerds call this standard
    *in* (short for input). Where does your computer get data? Linus Torvalds answered
    that question when he made Linux. His choice was the keyboard.


    How about the *screen*? (Brilliant.) This standard is known as *error*.


    Your computer also needs to know where to show information. Computer folks call
    this standard *out* (short for output). And where does your computer display information?
    Linus Torvalds decided to show it on-screen.


    You can change how information flows in your computer by using the redirection
    signs: the less-than ($\u003c$) and greater-than ($\u003e$) signs, as follows:


    +   - The $\u003c$ sign tells the computer to get information from a file.

    +   - The $\u003e$ sign tells the computer to send information to a file.

    +   - The string $2\u003e$ redirects all error messages to a file.


    Your computer needs to know one more thing: If something goes wrong, where do
    you want it to send the error message?


    ```

    Employee Data

    Bob Smith

    Mary Jones

    ```


    Of course, this example assumes that someone entered Bob Smith the first time
    that the program ran and Mary Jones the second time!'
