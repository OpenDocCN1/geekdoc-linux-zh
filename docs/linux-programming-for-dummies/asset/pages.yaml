- pgno: 64
  md: 'The following sample shows you how your program looks, ready to run:


    ```

    ```

    #!/bin/bash

    clear

    echo "Welcome To My First Linux Program"

    echo "Enter your first name: "

    read response

    echo "Hello, $response "

    ```

    ```


    Don’t become upset if you find yourself unable to translate your program out-line
    line by line into your program, as in the example I’m using. Just as in translating
    English to Spanish, such a translation isn’t always so direct.


    This sample program probably contains reserved words that are confusing to you.
    You find out about them throughout this book, but I want to give a brief explanation
    here just in case you can’t wait:


    +   - The `#! /bin/bash` tells your computer to start the `bash` shell.

    +   - The `clear` reserved word clears the screen.

    +   - The `echo` reserved word tells the computer to show the text.

    +   - The `read` reserved word takes the characters someone enters at the keyboard
    and saves them in your computer’s memory in a location with the name of `response`.

    +   - You use the dollar sign (`$`) in front of the word `response` to display
    on-screen the characters that the program stores at that memory location.


    So does that explanation keep you happy for now?


    # ## Choosing a Linux Shell


    A shell is the program that sits between you and the Linux kernel. The kernel
    is the program that talks to your computer. The shell program reads your instructions,
    translates those instructions into something that your computer understands, and
    sends the translated instructions to your computer.


    Many shell programs are available. Each one may speak a different language. This
    situation can become a problem for you. The shell program that runs your program
    may not be the same shell program that’s on the computer of the person who uses
    your program.


    You hope that many people are going to use your program. (How else can you become
    rich?) So how can you be sure that all of them are running the shell program that
    you use? You can’t. But you can maximize your chances of'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'exposure if you follow some basic guidelines and are familiar with what a shell
    can do. I explain a little about several of the main shells in the following sections.


    # ## The bash shell


    The *bash* shell is probably the most popular shell in existence, as well as the
    default shell for most Linux installations (including Red Hat and Debian GNU/Linux,
    just to name a couple), and for these reasons I cover *bash* exclusively in this
    book. You start the *bash* shell by typing **bash** into your computer at the
    command line; then press the Enter key.


    The *bash* shell has had a pretty diverse history, starting back in 1979 when
    a man named Stephen Bourne created the first major shell program for Unix. And
    guess what he called it? *The Bourne shell*, of course! Nearly every copy of Unix
    comes with the Bourne shell. (You start the Bourne shell by typing **sh** into
    your computer at the command line and then pressing the Enter key, if you want
    to check out this ancestor of *bash*, but again, I cover only *bash* shell programming
    in this book.)


    The Bourne shell eventually grew up and gave birth to *a new and enhanced generation*
    shell that''s formally known as the *Bourne Again shell* but is by far more commonly
    known as *bash*. Most people consider Brian Fox as the father of *bash* and Chet
    Ramey as the stepfather because Chet''s taken over the job of maintaining *bash*.
    You can say that this new incarnation of the Bourne shell has the same genes as
    his dad — and some new tricks that the "old man" only wishes that it could perform,
    such as increased flexibility to reuse code.


    # ## The C shell


    Well, just when Bourne thought he''d built the invention of the century, along
    came some guy with a better idea — Bill Joy from the University of California
    at Berkeley. He''s the guy who came up with the idea for the *C shell*. Joy capitalized
    on the weaknesses in the Bourne shell. The C shell uses reserved words that the
    C programming language uses. (C is the language that some programmers love and
    the rest of us can live without.)


    Bourne-shell programs can''t run in the background. They always must take control
    of the screen and keyboard. You can''t just tell your computer to go do something
    and then come back after it finishes. By using Joy''s C shell, however, you *can*
    give it such a command, and so the C shell soon became the shell program of choice
    on many computers running Linux.


    You can start the C shell by typing **csh** and then pressing the Enter key.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# Other programming languages for Linux


    I tell you a lot about Linux shells in the accompanying sections — so much so
    that you probably think you''re walking along the beach with a marine biologist.
    You can, however, also use more sophisticated programming languages to tell Linux
    what to do. The most popular for such use are C, C++, and the caffeine-filled
    Java.


    A programming language contains a group of words similar to those of the bash
    shell that I describe in this book. Programming languages, however, enable you
    to perform complex and fancy tasks on almost any computer, such as creating a
    stock ticker that moves across the screen and building a graphical user interface
    (GUI) with all the buttons and other options that you find in Windows and on the
    Mac.


    The C programming language is a senior member of the community and was involved
    in the birth of Unix at Bell Laboratories. The C programming language. Programmers
    use the C programming language to write Unix. You can find out more about the
    C programming language by reading C For Dummies, by Dan Gookin (published by IDG
    Books Worldwide, Inc.).


    The C++ programming language is an enhanced version of the C programming language.
    That''s why the two plus signs (++) follow the C. The C++ programming language
    uses all the words in the C programming language, plus it adds a few of its own.
    Programmers use the C++ programming language to develop object-oriented programs.
    I don''t have enough room in this book to explain object-oriented programming,
    so you need to pick up a copy of C++ For Dummies, 4th Edition, by Stephen R. Davis
    (also published by IDG Books Worldwide, Inc.), if you really want to know more
    about the C++ programming language.


    Java is the new kid on the block that is specifically designed for Web applications,
    although you can use Java to write the same types of programs that you use C and
    C++ for. Java''s roots lie in C++, so you can say that Java is an enhanced version
    of the C++ programming language. Instead of calling it C++, however, its developers
    named it Java. (I guess C++++ is too much of a mouthful to say.) Java''s claim
    to fame is that you can run the programs that you write in Java on any computer
    with the Java engine, which you find on most computers. Linux shell programs,
    on the other hand, can run only on computers that actually use Linux and Unix.
    You must rebuild programs in the C programming language for each type of computer
    that you run them on (such as Linux/Unix computers, Windows machines, and Macs).
    You can run a Java program on many computers, however, without the programmer
    needing to change anything in the program. You can read more about Java in Java
    For Dummies, 3rd Edition, by Aaron E. Walsh (you guessed it — published by IDG
    Books Worldwide, Inc.).


    # The Korn shell


    Just when Joy seemed to be on the top of the heap, along came David Korn, one
    of those whiz kids at Bell Labs. He created a shell that overcame the weaknesses
    of the C shell. The Korn shell can run Bourne shell scripts without changing the
    script. And newer versions of the Korn shell offer windowing capabilities. You
    don''t, however, find the Korn shell on every computer that runs Linux.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Start the Korn shell by typing **ksh** and then pressing the Enter key.


    ![](img/05279073f26be7df99b3c487360dec6a_67_0.png)


    Sometimes you may not have Linux set up to run a shell just by typing the name
    of the shell at the prompt. If you can’t start a shell this way, your copy of
    Linux needs a bit of tweaking. *Linux For Dummies*, by Jon Hall (published by
    IDG Books Worldwide, Inc.), can show you how to tweak Linux. You can, however,
    also run a shell by specifying the location of the shell. Shells reside in the
    /bin directory. I use the pathname to run the *bash* shell by typing at the prompt
    /bin/bash and then leaving a space, which I follow by typing the name of the program
    that I want to run. Then I press Enter to run the program.


    # ## The Perl shell


    I consider another popular shell language the “pearl” of Linux — mainly because
    its name is *Perl*. *Perl* (*Practical Extraction and Report Language*) is a shell
    language that programmers commonly use to create *Common Gateway Interface* (CGI)
    programs for Web applications. You run a CGI program by using Perl many times
    without knowing it if you ever enter information on a Web page, such as giving
    the Web site your e-mail address or credit card number. By clicking the Submit
    button on the Web page, you’re telling the Web site to run a CGI program, which
    is probably a Perl-shell script program. Pick up a copy of *Perl For Dummies*,
    by Paul Hoffman (published by IDG Books Worldwide, Inc.), if you want to find
    out more about Perl.


    # ## Considering Your Shell Options


    The difficulty you experience in picking the exact Linux shell to use for your
    program is unique to Unix-based operating systems such as Linux. You don’t encounter
    this problem if you write a program for Windows machines or for the Mac. In each
    case, Bill Gates or the guys at Apple Computers decide for you which shell you
    use.


    Following are a few points to consider in choosing a shell language:


    +   * **Anticipate who’s going to use your program.** If the program’s going to
    run only on your computer, whatever shell you pick is fine.

    +   * **Decide how someone’s going to use your program.** When you design your
    program to go off and do something in the background while you do something else
    (such as copying a large file), the *bash* shell, C shell, Perl shell, and Korn
    shell are all good candidates — but not the Bourne shell.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '* Look for the common shell that''s on all the computers running your program.
    If you''re writing your program for a bunch of friends who''re using a fancy new
    shell program that hit the Internet, you, too, want to use that shell program.


    # ## Choosing the *bash* Shell


    I''m going to just cut to the chase. My choice for the shell program to use for
    your Linux programs is *bash*. Some programmers may disagree, but here''s why
    I make this pick.


    The *bash* shell is an old standby and is available on nearly all the computers
    that are likely to run your program.


    The suppliers of all the versions of the Unix operating system, including Linux,
    support most versions of the *bash* shell. So if you run into trouble, you can
    find someone to call (even if you must pay a support fee).


    # ## Considering Your Options for Text Editors


    You must eventually write your program in an electronic form and save it to a
    file. Although nothing''s stopping you from using a word processor to write your
    program, most Linux programmers prefer to use a special kind of word processor
    known as a *text editor*. A text editor is a plain-Jane word processor. You don''t
    find any fancy features in it.


    A number of text editors are available in Linux that you can use to create your
    program. Each editor has its fans and detractors.


    # ### Choosing *vi* because it''s nifty


    The choice of which text editor to use depends on how simple and powerful a tool
    you want. And, probably more important, your choice may depend on which text editor
    is available on your computer.


    Linux comes with a few text editors that you can use to write your programs. Each
    has advantages and disadvantages. Consider the following options:


    +   * The old standby is *ed*. This text editor enables you to write or change
    a program one line at a time. Because *ed* isn''t a full-screen text editor, most
    programmers simply skip this choice.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Another old standby is vi. You can find vi on most computers that run Linux.
    This program is a full-screen text editor — that''s to say that you can work on
    one full screen at a time instead of working just line by line. But vi is a little
    tricky to use.


    A more powerful text editor is emacs. This text editor is available on some releases
    of Linux and can work on several files at the same time.


    And the envelope, please. The winner for the title of text editor that I use in
    Linux Programming For Dummies is . . . vi! I make this selection only because
    vi is the full-screen text editor that I''m most likely to find on your release
    of Linux. And guess what? Although I explain a little bit about vi in the following
    sections, I also include more details about the program in Appendix B.


    # Giving vi a try


    I''m now assuming that you''re using vi as your text editor in this and the following
    section. (If you''re using another text editor, you''re on your own.) At the command
    line, type vi into your computer and press the Enter key. A full screen of tildes
    (~) appears. Each tilde is a blank line in your program, so this means that you
    have a full screen of empty lines, which is the meaning of a full-screen editor.
    You move around your program by performing keyboard gymnastics with your fingers.
    Don''t bother trying the arrow keys; they don''t work.


    The vi text editor works in the following three modes, which you need to know
    about:


    +   - **Command mode** enables you to move about your program without changing
    the text itself — you just enter commands. You''re in the command mode after you
    first start vi. You can tell vi to enter the command mode at any time by pressing
    the Esc key.

    +   - **Insert mode** enables you to enter or edit text. From the command mode,
    press the letter i or letter a (make sure that you type in lowercase!) on your
    keyboard to enter the insert mode. After choosing the insert mode by using the
    letter i, you can insert text before the cursor. If you use the letter a, you
    add text after the cursor.

    +   - **Last line mode** is what you use to save your program, load another program,
    or quit vi. Press the Esc key to enter the command mode (unless you''re already
    in it) and then type the colon (: ) on-screen, following it with the last-line
    command that you want.


    Many programmers find vi a little awkward to use, especially as much better text
    editors are available for Windows and the Mac. After you acustom yourself to working
    with vi, however, you don''t give it a second thought. It''s like driving with
    a stick shift. After you drive with a stick shift for a while, it becomes easy.
    See Table 3-1 for a summary of the most useful commands in vi.'
  merge: -1
  img_proc: true
- pgno: 70
