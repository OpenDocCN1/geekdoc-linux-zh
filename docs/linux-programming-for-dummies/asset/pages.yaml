  md: '# Overriding Default E-Mail Values


    A common technique among programmers is to create a program with default values
    and then override those values by passing arguments to the program. You may, for
    example, want to always send e-mails to all of your friends, but sometimes you
    want only one of your friends to receive the e-mail.


    You build the default destination addresses into your program and use them only
    if you *don''t* include a destination address on the command line as you execute
    the program. A destination address that you enter on the command line automatically
    substitutes for the built-in destination addresses that your program contains.


    Following are the modifications that you need to make in your program:


    +   ✔ Create default values in your program.

    +   ✔ Modify your program to accept command-line arguments.

    +   ✔ Insert logic into the program so that it knows when to use the command-line
    arguments.


    # Inserting default values


    A *default value* is information that you always want the `mail` utility to use
    unless you give your program special instructions otherwise, such as placing a
    value on the command line to replace the default value.


    Say, for example, that you always send e-mail to your best friends Bob and Mary,
    so you use their e-mail addresses as the default addresses for your e-mail program.
    To do so, you simply enter their e-mail addresses in the `mail` utility inside
    your program. The following example shows how this command looks:


    ```

    ```bash

    #!/bin/bash

    mail -s $1 bob@mycomputer mary@mycomputer < $2

    ```

    ```


    Notice that you use the `$1` and `$2` variables as placeholders for the subject
    and filename of the file that contains the e-mail message. You can still pass
    the subject and filename to the mail program each time that you call the program.
    Because you probably want to send Bob and Mary various e-mails, you don''t want
    to use a default value here.


    The following example shows how you call this program:'
