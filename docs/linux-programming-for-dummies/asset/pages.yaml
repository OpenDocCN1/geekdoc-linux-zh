  md: "The following steps walk you through each line of this program:\n\n+   1. The\
    \ first line (#! /bin/bash) tells Linux to run the bash shell.\n+   2. Clear wipes\
    \ the screen clean.\n+   3. The program uses the function keyword display to define\
    \ a function.\n+   4. Between the French braces, you tell Linux to display two\
