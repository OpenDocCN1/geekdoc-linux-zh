- pgno: 303
  md: '# memory


    A short-term storage area inside your computer that holds information temporarily
    (just while you''re working on it). You lose the contents of this storage memory
    after you turn off your computer. You use your disks (including your hard drive)
    and CDs for long-term storage.


    # menu


    A list of tasks from which you can choose one for Linux or your program to perform.


    # Motif


    A development library that you use with the C programming language for building
    graphical user interfaces for applications. Motif pretty much just gives Linux
    the look of Microsoft''s Windows operating system. The Open Software Foundation
    distributes Motif and bases it on the X Window System.


    # nerd


    You, if you spend too much time working on your computer.


    # Open Look


    A development library that gives Linux the look of Microsoft Windows. It''s similar
    to Motif.


    # operating system


    A program or group of programs that take over your computer''s hardware and enable
    you to give your computer instructions to follow.


    # option


    A symbol that tells a program or command to do something different from what it
    normally does. An option is sometimes known as a *flag* or *switch*. The command
    1s, for example, lists files in a directory. You can, however, use an option —
    in this case -1 — to make 1s display an expanded list of information. You type
    1s-4 at the command prompt and press Enter.


    # parent directory


    A directory that contains subdirectories, or the name for the directory directly
    above the one you''re in. (That is, if you''re in folder a/b, a is the parent
    directory of b).


    # password


    A secret word that only you and your computer knows about (you hope). A combination
    of your user name and your secret password can gain you access to the computer.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '**pathname**

    A list of directories and subdirectories in which Linux should look for programs
    that you tell Linux to run. Linux starts with the first directory on the pathname
    and, if the program isn’t found, continues to look into all the directories/subdirectories
    on the pathname until the program is found. If the program still isn’t found after
    looking into all the specified directories/subdirectories, Linux displays a message
    on the screen telling you that the program can’t be located.


    **permissions**

    A list of symbols associated with a file or directory that specifies who can access
    the file or directory. The three kinds of permissions are *read*, *write*, and
    *execute*. The read and write permissions enable someone to read a file and write
    to a file. The execute permission enables someone to run a file (for example,
    a program that you create).


    **pipe**

    Redirects the output of a command from the screen to input into another command.
    The `|` character symbolizes a pipe. The `cat myfile | sort` command, for example,
    redirects the display of the contents of *myfile* from the screen as input to
    the *sort* program.


    **process**

    A program that’s running in Linux.


    **prompt**

    An on-screen character that tells you that Linux is waiting for you to do something.
    In the *bash* shell, for example, you see the `$` prompt.


    **read-only**

    A file that a user can read and copy but not write to or change. Read (which means
    the same thing) is one of the permissions that Linux enables you to specify for
    a file or directory.


    **redirection**

    A way to change the normal flow of information into and out of a program. See
    *pipe*.


    **root directory**

    The top-level directory on your hard drive. All other directories branch out from
    the root directory.'
