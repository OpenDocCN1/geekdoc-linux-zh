  md: '# CHAPTER 1


    # Business Recovery Planning


    > "Be prepared."

    ——The Boy Scout Motto


    My challenge in this section is to convince you that you need a Business Recovery
    (BR) plan and show you how to develop one suited to your business. This sounds
    about as interesting as watching grass grow. If you are a system administrator
    or an application developer, you will be tempted to skip to the technical implementation
    details in Parts Two and Three. Don''t! If you are responsible in any capacity
    for keeping servers going, then anything you can do to keep them going every hour
    of day is useful. You know that high reliability requires foresight, planning,
    and a bit more money invested than just putting a system together out of the box,
    plugging it in, and crossing your fingers. Whether you are a system administrator
    or manager or business owner, you have a part to play in identifying and justifying
    the resources needed to build a solid and reliable server platform. This section
    helps you to that.


    If you are a system administrator or developer, you are most interested in the
    hands-on implementation details. I plan to give you lots of that in Parts Two
    and Three. But you also need to function as part of a larger team. The servers
    and applications you create and run are key to the success of the business as
    a whole. For this reason, you need to work with end users and managers to integrate
    your technical functions into the larger business function.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Planning for Reliability


    If you are a manager, you need a tool to assess the risk factors in your servers
    and the downtime cost so that you know how much money to allocate and where to
    allocate it. You also need to understand the advice you get from your technical
    staff, so you can weigh the risks and solutions. When a server goes down, it affects
    the whole business operation, and not the server itself in isolation and not the
    broader functions the server supports will keep you from trouble. You need to
    understand the challenges your technical experts face and work together with end
    to develop a plan that does not involve technical demands. It must protect your
    business operation, and achieve that goal at an acceptable cost. This section
    gives you a methodology to develop such a plan.


