- img_proc: true
  md: '# LVM and Reliability


    There are several significant ways in which using the LVM can improve the reliability
    of a production server, including:


    Using LVM allows you to tailor the amount of space allotted to a file system or
    other data object so that the space allotted closely follows the actual space.
    This leads to a fundamentally different way of budgeting disk space. Because the
    LVM can dynamically assign storage, it is not necessary to predict how much storage
    will be needed in the future. Instead, you can allocate enough storage to a file
    system to meet its current needs and then add to that dynamically as the file
    system requires. You will tend to keep aside any space not really needed in the
    pool of unallocated space so that you can direct it where and when it is required.
    If you run low on unallocated space, further storage can be added to the pool
    dynamically. Thus, there is little likelihood that you will run into the case
    in you fill a file system and need to schedule downtime for the time-consuming
    and risky job of disk repartitioning and data juggling common to fixed-space allocation
    systems.


    Using LVM removes the temptation for administrators to resort to quick-fix solutions
    as using symbolic links pointing from one file system to another. Using links
    to point from one file system to another is a simple but crude way to effectively
    extend the storage available for a directory structure. It removes the overhead
    involved in restructuring fixed-space allocation disk systems, which makes it
    attractive. It also leads to convoluted data structures, and is still limited
    by the restrictions implied by contiguous partitions, however. All this leads
    to extra administrative complexity, which does not improve reliability.


    The data structures used by the LVM make PVs and VGs contained data entities,
    carrying all of the necessary metadata for the proper operation of the VG in the
    VG itself. This makes a VG completely portable data entity that does not rely
    on any data stored on the operating system of its host server to be functional.
    This means that whole applications and their data can be easily moved from one
    server to another. This can be a distinct advantage if a server fails and sets
    the necessary groundwork to allow disks to be shared between primary and backup
    servers in the high availability server clusters discussed in Chapter 10.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Logical Volume Management 309


    The Linux LVM offers a very useful feature called LV snapshots. A snapshot allows
    the data in an LV to be frozen at a moment in time and made available in a read-only
    mode for backups, while the production LV remains available for read-write production
    activity. You will see how this works later in this chapter.


    The Linux LVM code is fully compatible with the software RAID driver. It is quite
    possible—even desirable—to create a RAID device as `/dev/md0` and then use that
    as a PV in an LVM VG. Thus, the flexible storage management advantages of the
    LVM can be combined with the reliability of RAID to produce a reliable, flexible,
    manageable, and scalable storage management system.


    The dramatically improved flexibility in disk management LVM gives the administrator
    it easier to do a good job of storage management, which inevitably pays a dividend
    in server stability and reliability. I have the pleasure of working in a commercial
    UNIX environment that has always favored LVM functionality and, until the introduction
    of LVM to Linux, have felt its absence was one of the major obstacles to Linux
    becoming a practical and useful production system. Once you have worked in an
    LVM environment, it''s hard to go back!


    # Working with Linux LVM


    The next several pages provide some practical examples of LVM commands and functionality.
    Please note that these examples were worked using v0.9.1 beta 2, a preproduction
    release of the Linux LVM. Your version may be newer and different, some of the
    commands may look or behave differently from these examples. Be sure to check
    the information supplied with your distribution and the appropriate man pages
    for the LVM commands on your server for accurate information. Note too that your
    kernel needs to have LVM support compiled in. Test your kernel by looking for
    the existence of `/proc/lvm`. If that directory exists, then you have basic LVM
    support. You can determine the LVM code version and the current state of any LVM
    objects by examining the file `/proc/lvm/global`. You will also need the user
    tools and library to use the LVM kernel code. Note that the stock kernel in the
    Red Hat 7.1 distribution does not include LVM support, nor does this distribution
    contain the necessary user utilities. You will need to build a kernel with LVM
    support and get the tools and user library from the developers at www.sistina.com/lvm.'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# Building a Logical Volume Structure


    The following section works through the commands that are necessary to build the
    structure shown in the example in Figure 8.3. Remembering of the theory that creating
    an LV itself is the last stage in the process, the first thing we must do is create
    some PVs.


    # Creating Physical Volumes


    The pvcreate command creates a PV from a disk partition. Referring to Figure 8.3,
    the command to create the necessary PVs is:


    ```

    # pvcreate /dev/sda1 /dev/sda2 /dev/sdb1 /dev/sdb2 \

    /dev/sdc1 /dev/sdd1

    pvcreate -- physical volume "/dev/sda1" successfully created

    pvcreate -- physical volume "/dev/sda2" successfully created

    pvcreate -- physical volume "/dev/sdb1" successfully created

    pvcreate -- physical volume "/dev/sdb2" successfully created

    pvcreate -- physical volume "/dev/sdc1" successfully created

    pvcreate -- physical volume "/dev/sdd1" successfully created

    ```


    This command has created a data structure written at the beginning of the PV called
    the Volume Group Descriptor Area (VGDA). This is a core LVM data entity. It is
    a redundant copy of the VGDA held on each PV of a VG. The VGDA completely describes
    the entire VG structure. The VGDA can be read from the PV using the pvdata command:


    ```

    # pvdata -a /dev/sda \

    --- NEW Physical volume

    PV Name /dev/sda

    VG Name

    PV Size 1004.03 MB

    PV# 0

    PV Status NOT available

    Allocable NO

    Cur LV 0

    PE Size (KByte) 0

    Total PE 0

    Free PE 0

    Allocated PE 0

    PV UUID iUtVGq-nkGs-YW3F-vvTq-QC0H-DBS1-dIO03M

    ```


    ```

    --- Volume group

    VG Name

    VG Access read

    VG Status NOT available/NOT resizable

    VG # 0

    ```'
  merge: -1
