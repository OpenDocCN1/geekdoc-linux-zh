  md: '# Typographical Conventions


    This book uses the following typographical conventions.


    Fixed width


    is used in examples to indicate command line input and output, shell script fragments,
    or the contents of configuration files. The fixed width font is also used within
    normal text to indicate a command line, a flag, or command option.


    Fixed width bold


    is used in examples to indicate text user inputs.


    Italic


    is used for directory paths, filenames, and command names as well as identifiers
    such as user IDs or host names. It is also used on occasion for emphasis.


    <pointy brackets>


    are used in examples where you must substitute your own specific information for
    what the brackets contain.


    #


    indicates a root privilege user’s command line prompt.


    $


    indicates a low privilege user’s command line prompt.


    # Acronyms and Abbreviations


    Acronyms used without definitions are frustration. I avoid doing so when possible.
    Also, the book includes a glossary containing acronyms as well as any other technical
    terms that might need definition.


    I have used the standard abbreviations M for mega (1,000,000) and K for kilo (1,000)
    as well as b for bit and B for byte. Hence, 100 KB stands for 100 kilobytes, and
    2 Mb represents 2 megabits.'
  merge: -1
