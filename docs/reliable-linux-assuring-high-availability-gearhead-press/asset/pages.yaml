  md: '# The root File System


    The first partition in the listing is mounted at root directory of the local file
    system, and is termed the root file system. According to the FHS 2.1 standard:
    “The contents of the root file system should be adequate to boot, restore, recover,
    and/or repair the system. To boot a system, must be present on the root partition
    to mount other file systems. This includes utilities, configuration, boot loader
    information, and other essential start-up data. /usr, /opt, and /var are designed
    such that they may be located on other partitions or file systems. To enable recovery
    and/or system, those utilities needed by an experienced maintainer to diagnose
    and reconstruct a damaged system should be present on the root file system. To
    restore a system, those utilities needed to restore from system backups (on floppy,
    tape, and so on) should be present on the root file system.


    The root file system is usually implemented as a small partition. There are several
    arguments in favor of a small root file system. From a reliability standpoint
    the most compelling are that in an emergency recovery case I may have to mount
    the root file system from removable media, hence the smaller the better. Ideally,
    it should fit on a floppy, which it usually does. Also, as the root file system
    contains system critical files (such as the kernel itself, boot loader, and most
    of the operating system configuration files) data corruption in the root file
    system can cause havoc. The smaller the file system structure, the less prone
    it will be to corruption in a crash.


    You should be conscious of what goes in the root file system and what does not.
    You want to keep it small, and focused on booting the operating system only. Let
    me give you some examples. The FHS defines the sub-directories of the root file
    system:


    +   / The root directory

    /bin Essential command binaries

    /boot Static files of the boot loader

    /dev Device files

    /etc Host-specific system configuration

    /home User home directories (empty)

    /lib Essential shared libraries and kernel modules

    /mnt Mount point for mounting a file system temporarily (empty)

    /opt Add-on application software packages (empty)

    /root Home directory for the root user'
