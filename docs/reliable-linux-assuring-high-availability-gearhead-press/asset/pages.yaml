- img_proc: true
  md: 'academic operating system. Since then, various commercial and non-commercial
    variants have become among the most widely used operating systems in the world.
    Linux could be considered one of the most significant non-commercial UNIX variants.


    **UPS** See Uninterruptible Power Supply.


    **X Windows** The Windows system (commonly abbreviated to simply X) is a client/server
    graphics user environment developed in the 1980s at the Massachusetts Institute
    of Technology. X is a communications proto-col allowing a process running on one
    machine to transfer a complete description of the graphical output it wants displayed
    to another machine on a network. The second machine displays the output, and can
    accept input from a user via a pointing device, such as a mouse, and send that
    input back to the client process running on the server machine. Most UNIX server
    networks use X as the means to provide a graphical user interface (GUI) to the
    end user.'
