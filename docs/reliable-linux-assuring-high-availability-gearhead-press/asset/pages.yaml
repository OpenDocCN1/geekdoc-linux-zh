  md: '# Managing Hardware Servicing Risks


    I once had a discussion in a class of system administrators. We were talking about
    common causes of downtime and one of my students commented that, at their site,
    normal maintenance or upgrade servicing was a real problem if the hardware service
    technician failed to properly communicate with other staff onsite. Here is the
    sort of scenario I was talking about: You have a scheduled downtime window on
    one of your servers to upgrade the memory. Your hardware is maintained by an outside
    contractor who arrives at your site to do the upgrade. Because he knows you have
    a short window to do the upgrade, he goes straight to the machine, powers it off
    and installs the new memory, then powers it on. He did a great job in record time
    and he is pleased with himself. Problem is, he upgraded the wrong server. There
    are three identical machines all next to each other, but none are clearly identified.
    What he didn''t know that the function of the machines had changed since his last
    visit and it was really the one on the left that he have upgraded. The middle
    machine was the production database server. There is now a big mess to clear up.


    How can this kind of mistake be avoided? Every piece of mission critical hardware
    in your server room should be clearly identified. A name which has meaning to
    your staff is good, as well as a short description of what the machine does, in
    case someone from outside your site needs to be brought in, possibly in an emergency.
    Also, machines should never be powered off unless the person responsible for the
    software application running on that is present or has specifically authorized
    and clearly identified the machine to be touched. The idea is to ensure that the
    software is in the proper state to allow the hardware to be shut down. Finally,
    access to the server room should be restricted to those who know what they are
    doing. In the memory upgrade case, the contractor did not check with the staff
    before going ahead with the upgrade. On the other hand, he shouldn''t have been
    able to get into the server room unless the local staff let him in.


    # Minimizing Scheduled Downtime


    Scheduled downtime is an unavoidable necessity. Hardware upgrades and reconfigurations
    demand it, as software maintenance and upgrading. Downtime is however, whether
