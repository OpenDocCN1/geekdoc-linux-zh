    If your server is a network server—and few servers are not—then the stability
    and reliability of the network services provided by the server are usually as
    critical to the availability of the application as the availability of the server
    machine itself. The following sections review a number of network services and
    give you some pointers on configuring them with reliability in mind.


    # Electronic Mail: sendmail


    Configuring sendmail is a whole vocation in itself, and entire books have been
    written on the subject. I''m not going to attempt that here. It is such a commonly
    needed application, however, that I need to say at least something about it. sendmail
    is an implementation of the Simple Mail Transfer Protocol (SMTP). The simple part
    of SMTP refers to the fact that all of the relevant information needed by mail
    servers to address and route mail messages around the internet is included in
    plain ASCII text at the head of each mail message. SMTP servers read and append
    to this header as mail travels about the net so that it is simple any time for
    a human to read a mail header and discover all there is to know about a mail message.'
