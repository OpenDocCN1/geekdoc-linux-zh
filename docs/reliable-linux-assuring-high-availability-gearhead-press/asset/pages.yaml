    # Reliability Issues with ext2


    While the design of the ext2 file system is sound and the implementation has proved
    itself stable over many years of service, there is an inherent problem that arises
    in the cases of a disk or system crash, in that there is no fault tolerance built
    into the file system. In Figure 9.1, each of the ordinary files was shown to have
    only one data block each. In practice this is unusual. The default data block
    size is 4 KB, most files will normally have many data blocks. To keep track of
    these blocks for allocation purposes, the file system sets aside special data
    blocks called super blocks. One of the key pieces of data stored in these super
    blocks is the free list, a list of data blocks in the file system not yet assigned
    to a file. When a new'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'file is created or an existing file is extended, the file system code chooses
    blocks from the free list and adds their addresses to i-nodes as necessary to
    fulfill the space requirements of the new or larger file.


    Consider what might happen if the server crashes part way through the operation
    of creating or extending a file. It is possible that the ext2 code got as far
    as crossing a data block off the free list, but not yet added the data block address
    to the proper i-node when the system crashes. When the system reboots, the file
    system will have a dilemma. Because a transaction was in process at the time of
    the crash, the super block will be marked as “dirty.” This triggers the file system
    checker, efsck, to automatically check the consistency of the file system before
    it is mounted. The check will examine the free list as well as all the i-nodes,
    which for a large file system can be consuming. The nature of the problem means
    that the time to check a file system will increase with the number of data blocks
    in the file system, and a complete check on file system ranging to gigabytes in
    size can take hours. Much worse than the delay, however, is the fact that in this
    case the crash will turn up a data block that does not reside on the free list,
    yet has no home in any i-node. The file system has no way of determining what
    block may contain. The surviving metadata offers no clue as to which file, or
    where the file it belongs. It may also be that a file was being reduced in size
    at the time of the crash, and the data stored in the block is in fact not needed
    by any file. Not only does the file system have no way of knowing what this block
    belongs to, if any, it also has no way of whether the data in the block is current
    or not. After all, the crash may have occurred between the addition of the block
    to the i-node and the writing of data into the block. In short, the file system
    has indeterminate and irreparable data inconsistencies and cannot be trusted.
    The original UNIX file system implementations operated primarily in research and
    academic settings, accepted this as a fact of life, and relied upon backups to
    recover from such problems. Something better is clearly needed in a commercial
    environment.


    # Scalability Issues with ext2


    Another issue arises when you consider that ext2 has an inherent size limitation
    that it is a 32-bit file system, resulting in a maximum file system size of 4
    TB and a maximum file size of 2 GB. ext2 also allocates space to files in blocks
    that are relatively small in size (block sizes range from 512 bytes to 4 KB).
    This means as files become very large, correspondingly large numbers of blocks
    must be allocated and managed. ext2 has no'
