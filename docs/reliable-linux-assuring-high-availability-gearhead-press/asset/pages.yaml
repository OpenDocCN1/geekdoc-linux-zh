    this fashion, a single user account definition can be easily shared between a
    number of clients of the same NIS server. NIS can also be used to share other
    configuration files that you may want to be held in common by a group of machines.
    These include, for example, /etc/services and /etc/hosts, as well as several others.
    A group of clients all sharing the same set of files from a server make up an
