  md: '# Choosing the Right Hardware 115


    Install a minimum-maximum thermometer in the server room. These register the maximum
    and minimum temperatures observed after resetting the unit. This will tell you
    how well the ventilation system is keeping ahead of the heat load. A rising temperature
    trend can be spotted by the thermometer faster than you might feel it. It is also
    useful evidence in discussions with the building’s operations staff if your perception
    of the temperature in your office areas differ from theirs. If you think humidity
    is an issue, install a recording humidistat, too. If you are using hardware monitors,
    your servers should be recording motherboard and CPU temperatures so you can track
    trends and build experience concerning in-case operating temperatures.


    There is little to mechanically maintain on most servers except fan screens. Unfortunately
    as there is really nothing else to maintain, this important job is often neglected.
    Establish a schedule to clean filters as frequently as your server room conditions
    require. Keep records. Now, for example, power outages. Over time this will help
    you determine quantitatively what your power failure risk is. This is especially
    useful if you have multiple sites, as you can build a picture of which sites have
    reliable power supplies. If you want, you can extend this record keeping to include
    any incidence of server outage. This allows you to build accurate historical data
    on the risks your site is experiencing. Using this data that is specific to your
    operation, you can do more accurate risk analysis. If you have multiple sites,
    use the data to compare and contrast your operations, learning from what is working
    well at the more reliable locations to assist those with poorer records.


    When hardware needs replacement, make sure to log the details of any changes that
    were necessary to accommodate the new hardware. A new drive may be a different
    make, model, or type, or be a different size than its predecessor, requiring configuration
    changes. Make sure those changes are tracked in case the entire server needs replacement
    at a later date and the old information is used to order replacements. If you
    keep spares on hand, make sure an inventory count is maintained to ensure that
    a replacement will be there if needed. In my house, if someone takes the last
    box of crackers from the pantry, then person puts crackers on the shopping list.
    The same principal applies applies to your pantry of spare component parts.


