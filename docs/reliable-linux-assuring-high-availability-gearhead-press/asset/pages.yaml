  md: '# Glossary


    Samba A public domain Server Message Block file server program, SMB is the file
    system structure used by Microsoft''s Windows family of operating systems. Hence,
    a Linux server running Samba will appear to the Windows client as if it were a
    Windows file or print server.


    script A script is an ASCII text file containing a series of commands, all of
    which are valid commands that could have been typed at a shell command line. The
    shell can be directed to run this script, in which the commands in the script
    run automatically in sequence, as if they had been typed at a command line. The
    batch file is based on this UNIX concept.


    SCSI See Small Computer Systems Interface.


    shell A program that gives the user a command line interface to the operating
    system. Different shells have the ability to remember previous commands, automatically
    search directories for commands, or complete partial filenames and perform other
    actions to make it easier to work from a command line. The shell is not part of
    the kernel, but is an additional process that runs under kernel control. See bash
    and ksh.


    source Source code is written in a programming language such as C, Java, or FORTRAN,
    which define a computer program. Languages such as C and FORTRAN, the source code
    must be compiled into a binary (exe).


    super block A data object that is part of the metadata of a file system, the super
    block holds summary information concerning the allocation state of each data block
    as well as all global file system information.


    super user See root user.


    Uninterruptible Power Supply A hardware device incorporating a battery that is
    capable of supplying power to a computer during a failure of the external power
    supply to the building.


    UNIX Not an acronym, rather it is a corruption of MULTICS, an early multiprocessing
    operating system known to the inventors of UNIX at Bell Labs in the 1960s. While
    UNIX was developed by employees at Bell Labs, antitrust judgments prevented Bell
    from selling software. Consequently, UNIX was made available to the academic community
    at no cost. In the 1970s and 1980s it grew to become the de facto standard'
  merge: -1
