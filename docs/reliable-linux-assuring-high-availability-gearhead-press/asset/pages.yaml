    # The Consistency Problem


    The third requirement in the to-do list raises what I call the consistency problem.
    Let us say that you have a 2-GB file system in production that you need to back
    up. If you are using a SCSI tape device of some sort, backup will take several
    minutes, depending on the speed of the tape drive, how busy the bus is, how fast
    the data can be read from disk, and the overhead of compression that may be used.
    As this data is in production, it will change during the backup process. If the
    backup starts at 1 A.M., and completes at 1:20 A.M., and somewhere during that
    time only one file in the file system is being backed up changes, how can you
    be sure that the newer version of the file made it to the tape? The answer is,
    you can''t be because the file may have changed after it had been written to tape.
    The only way to guarantee that all the data in a live file system gets backed
    up is to take the data out of production, freeze it, so to speak, while you do
    the backup, and return it to production. This is clearly a challenge as that means
