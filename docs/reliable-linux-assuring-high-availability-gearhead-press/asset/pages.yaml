- img_proc: true
  md: '# What about ATA?


    Motherboards are commonly available with as many as four as on-board ATA controllers.
    Each ATA controller supports one master and one slave device so, in theory, such
    a board could support eight devices. If one of them were a CD-ROM, that would
    leave room for seven disks. Unfortunately, there are two problems. One is performance
    which is poor when concurrently writing to an ATA master and its slave, and the
    nature of RAID arrays is that they constantly do just that. Consequently, it is
    only practical to put one RAID drive per controller. If the CD is not frequently
    used, you could safely have four RAID drives. As 40-GB drives are now common and
    cost effective, that could give you a practical 120-GB RAID5 array. If your server
    motherboard has only two to four ATA controllers but you require more, ATA controller
    peripheral cards are widely available.


    The other problem is that one of the drives fails, you need to bring the server
    down and power it off to replace the failed ATA drive. The ATA standard does not
    support hot swapping (the ability to remove or add a device to the bus while it
    is powered on).


    # About Hot-Swap Disk Hardware


    If you decide to build a software RAID array, you will want to consider hot-swap
    disks. After all, the whole idea of a RAID is to have, if at possible, no server
    downtime when a disk fails. It defeats the purpose to some extent if you build
    a RAID using disks that cannot be physically replaced without bringing the server
    down. Hardware RAID arrays use hot-swap disks as a matter of course.


    The SCSI bus is better suited to hot-swap RAIDS. Any of the various SCSI standards
    support at least seven drives per bus, and hot-swap SCSI hardware is widely available,
    in many cases in engineered server configurations. While SCSI hot-swap hardware
    solutions are available and are a mature technology, Linux kernel support for
    hot-swap SCSI devices is a work in progress. At the time of writing, support in
    the kernel SCSI code is in the experimental stage. It is possible for this code
    to determine that a device has been hot plugged. The challenge that remains is
    to ensure that the hot-plug replacement appears to the operating system as the
    same device as the failed drive; otherwise serious confusion ensues. Look for
    this support in the near future. At the moment, it may be necessary to use a proprietary
    extension to the public kernel to fully support hot-plug SCSI devices.'
  merge: -1
  pgno: 211
- img_proc: true
  md: 'The more popular and less expensive ATA bus unfortunately has fewer hot-swap
    options. Units containing a pair of hot-swap drives are available that plug in
    to a standard ATA controller. However, they are generally preconfigured to function
    as two-drive hardware RAID arrays. There is a standard for hot-swap PCI (Peripheral
    Connection Interface, the hardware bus that is de facto standard in today’s PCs)
    called CompactPCI, which is designed primarily for the industrial PC market. It
    has the advantage that it supports hot swapping whole PCI cards, one of which
    could be an ATA controller. CompactPCI hardware is also built to higher standards
    than should be very durable. There is of cost premium. Further information about
    CompactPCI can be found at www.picmg.com. Compaq has developed a proprietary hot-swap
    PCI standard they call PCI Hot-Plug. Even better, there is a Linux driver for
    this technology; better still, it was developed for the current 2.4 kernel.


    # Understanding RAID Levels


    I touched briefly on the subject of RAID levels in Chapter 2, “Risk Analysis.”
    Here, I expand on this topic and give you a more complete description of the five
    RAID levels supported by the 2.4 kernel. These levels are summarized in Table
    5.1 and further detailed in the following sections. As the primary focus of this
    book is reliability, you will see that in the third column I have noted that RAID
    levels support a measure of disk redundancy.


    A RAID is made up of two or more contiguous pieces of disk that are in fact traditional
    disk partitions. There is no rule that says each of these partitions must take
    up the entire disk, although that is common for several good reasons, which I’ll
    talk about in turn. To keep the text simple, however for the rest of this chapter
    I will use the term disk to mean one discrete


    Table 5.1 RAID Levels

    | LEVEL | FEATURES | REDUNDANCY |

    |---|---|--|

    | Linear | Disk partition concatenation | No |

    | 0 | Data striping | No |

    | 1 | Data mirroring | Yes |

    | 4 | Data redundancy, achieved using checksums | Yes |

    | 5 | Data redundancy, achieved using distributed checksums | Yes |'
