  md: '# CHAPTER 4


    # Installing and Configuring for Reliability


    > “The first blow is half the battle.”

    Oliver Goldsmith


    The previous chapter concentrated on hardware reliability. This chapter looks
    at what can be done from an operating system software point of view to make Linux
    as robust as possible. Are there decisions that can be made when installing Linux
    that could help (or hurt) its reliability? What kernel version and distribution
    is best? How should disk storage be laid out when installing Linux? What about
    installing applications? How about reliability issues in the many configuration
    options available in Linux? How can boot failure be avoided? Read on . . .


    # Which Linux Kernel Should You Use?


    After a hardware configuration has been chosen for the base server, the next important
    decision is the version of the kernel to run. Although the Linux kernel is the
    product of countless developers all over the world, Linux Torvalds still centrally
    coordinates the official kernel release process, which has a well organized structure.
    Kernels are identified by a threeigit identifier, as shown in Figure 4.1. The
    first digit of the number is the primary release, which changes slowly. The first
    ever Linux kernel was numbered 0; the current primary release is 2. The second
    digit determines whether this is a stable or a development kernel. There are always'
  merge: -1
  pgno: 142
- img_proc: true
  md: '# 120 Building a Reliable Server


    ![](img/8f0b2e54b3e875094917788f9cb87c45_143_0.png)


    **Figure 4.1** The Linux kernel uses a three-digit identifier.


    two current versions of the kernel in this respect. One is the latest, cutting
    edge version actively being developed. It is available primarily for testing and
    debugging purposes, and is not considered to be production stable. It is indicated
    by an odd-numbered digit. An even-numbered second digit indicates that this kernel
    contains the newest available code to have gone sufficient testing and debugging
    to be considered production stable. This is important because you should never
    run a development kernel on a production server. This digit changes relatively
    slowly over the life of a primary version. The current stable release is the 2.4
    kernel; the current development release is 2.5. In this case, 2.4 is considered
    the *major number*.


    The last digit represents the *revision number*. It is the most volatile element
    and represents a further subdivision of the current release. It changes rapidly
    on the development kernels. New revisions on the development side largely reflect
    a combination of new alpha- or beta-quality functionality- and bug fixes. This
    digit can increment weekly, or even daily in the development kernel. In a production
    kernel, the revision number changes at a sedate pace and usually indicates additional
    bug fixes or functionality that has been in the development kernel long enough
    to be considered stable and ready for prime time. All three digits together define
    a specific kernel version, such as v2.2.18 or v2.4.3. In theory, each successive
    revision should be an improvement on the preceding one; but historically some
    have been better than others and are favored for production servers. A visit to
    www.kernel.org will tell you the current version of both production and development
    kernels.


    The general rule is not to run a development kernel on a production machine. It
    is also useful to see if your application vendor has a preference for a certain
    kernel version. If so, don''t be surprised if it is an older version. Tried and
    true is the name of the game when you want reliability and stability.'
