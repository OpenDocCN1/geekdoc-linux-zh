- img_proc: true
  md: '# SCSI Standards


    Technically, there are three different SCSI standards: SCSI1, SCSI2, and SCSI3.
    SCSI1 is now old enough that you can safely ignore it, unless you inherit a very
    old server indeed. The SCSI2 standard dates from 1994, and was a substantial advance
    over the original standard. It is not possible to get SCSI2 drives today, although
    current drives work in some cases in backward compatible modes with an older SCSI2
    device. In any case, if you have any SCSI2 drives they are likely close to or
    beyond their service life, and would not be good candidates to run an important
    server on. The SCSI2 standard did however introduce some important innovations
    that have carried forward to SCSI3, the current standard. The challenge in understanding
    SCSI3 is that it is really a group of standards for several different variations
    on the SCSI theme, and that is where it gets complicated.


    # Wide SCSI and Fast SCSI2


    The original SCSI standard defined a bus bits wide. In other words, there were
    eight data signals carried in the SCSI cable, so a single byte could be transferred
    to the bus at any one time. The SCSI2 standard allowed an increased width of 16
    bits, which became commonly known as wide SCSI. Given the same signaling rate,
    the wide bus could transfer twice the data than the narrow bus. SCSI2 also doubled
    the signal rate on the bus to 10 MHz, twice that of the original standard. Putting
    these two advances together produced what was known as Fast Wide SCSI2, giving
    a data transfer rate of 20 MB/s. At the same time, the SCSI standard also increased
    the maximum number of devices on a bus from 8 (which is really 7 devices, the
    total number of devices on the bus always includes the controller) to 16, but
    this only applied if the wide bus option was used.


    # Ultra SCSI and Ultra2 SCSI


    The next generation of standards was the SCSI3 standards, which arrived in 1996.
    Unlike the earlier SCSI and SCSI2 standards, SCSI3 was really a family of standards
    governing a number of different aspects of the evolving nature of the bus and
    included definitions for several distinct flavors of SCSI device. This family
    of standards is still undergoing revision today. Because there are so many variants
    falling under the SCSI3 family, the term SCSI3 is not commonly used; rather, terms
    more descriptive of the transfer speed of the particular flavor are favored.'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Choosing the Right Hardware


    The first of the SCSI3 standards is Ultra SCSI. It doubled the signal rate again
    over SCSI2 to 20 MHz, allowing a 20 MB/s transfer rate on a narrow bus. If the
    cable exceeded 1.5 meters, HVD signaling was mandatory. Wide Ultra SCSI is also
    possible and gives transfer rates of 40 MB/s.


    Now things get messy. The SCSI3 family includes Ultra2 SCSI (Do not confuse Ultra2
    SCSI with the older SCSI2 standard.) Ultra2 SCSI uses a 40 MHz signal rate and
    comes in narrow and wide flavors, and uses LVD signaling. Narrow Ultra2 has a
    transfer rate of 40 MB/s, while the transfer rate for Wide Ultra2 is 80 MB/s.
    Ultra controllers and drives are still available and are quite satisfactory for
    any midrange server applications. Be careful to note that at the signaling speeds
    used by Ultra2 or faster versions, the conventional ribbon-type cable serves well
    for precious, slower versions of the bus is no longer sufficient to carry the
    data. It is important for reliability that you use cabling specifically designed
    for these higher transfer speeds. Look for labeling on external cables that specify
    either the SCSI version, or that they support LVD signaling. Internal cables will
    look similar to the older flat ribbon-type cable, but each pair of conductors
    in the new ribbon will be separated and twisted together between connectors on
    the cable. The connectors on the cable should be labeled according to the version
    of SCSI supported.


    For a solid and stable bus, cable length is also important. Keep your cables as
    short as possible. Connectors should be evenly spaced along the cable, and extra
    connectors should be avoided, if possible. If you have extras, then the terminator
    on the last connector, there are no connectors beyond the terminator. Leftover
    connectors between the terminator and the physical end of the bus can create problematic
    signal echoes. The faster versions of the bus is also a good idea to place devices
    near the ends of the cable bus. The idea is to avoid a length of cable between
    the last device and the terminator that can also lead to echoes.


    # Ultra160 SCSI and Ultra160+ SCSI


    The SCSI3 standard pushed the performance envelope further with the Ultra160 standard
    (also known as Ultra160/m). This standard uses the same signal rate and bus width
    as Wide Ultra2, but doubles the transfer rate to 160 MB/s by sending data on both
    the rise and the fall of the bus clock pulse, a technique known as dual edge clock.
    There is no narrow version of Ultra160, hence there is no Ultra160 and Wide Ultra160.
    Ultra160 uses a wide bus by definition. Ultra160 uses only LVD signaling; there
    is no SE option.'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'Ultra160 pushed the performance envelope further, new reliability features
    required. Cyclic Redundancy Checking (CRC) was introduced to protect against the
    possibility of data corruption, the likelihood of which becomes higher with increased
    signal rates. Also, the concept of Domain Validation. Prior to Ultra160, the SCSI
    controller on a bus was started to determine the speed at which that device could
    operate. The entire bus would then operate at the speed of the slowest device.
    The problem with this method was that the controller believed it was told. If,
    for example, all of the devices on a bus told the controller they were Ultra2
    devices, the controller would attempt to run the bus at a signal rate of 40 MHz.
    If there were a problem with a poor cable, or terminator, this would cause ongoing
    data corruption problems. Unlike older controllers, Ultra160 also queries all
    devices their respective speeds, once it determines the speed bus should be able
    to operate at, it performs an active data transfer test to verify that the device
    can actually support the speed it claims. If errors are detected, the controller
    will reduce the speed until the error rates are acceptable, and run the bus at
    that speed. This ensures that devices slower than Ultra160 can co-exist on Ultra160
    bus (although the slower devices slow the entire bus down), as well as adjusting
    to possible cable or terminator problems.


    There is also an Ultra160+ standard that adds two further enhancements, Quick
    Arbitration and Selection (QAS) and Packetization. Neither of these, however,
    has a significant effect on reliability.


    # Ultra320 SCSI


    Ultra320 SCSI represents the state of the art. Using DVD signaling and 80-MHz
    dual edge clock bus it achieves a transfer rate of 320 MB/s. While this sounds
    impressive, it is interesting to note that the specification on one Ultra320 drive
    I read about an internal transfer rate (the rate at which the drive can write
    to the platter internally) of only 70 MB/s, considerably less than the theoretical
    bus transfer rate. From a performance point of view, this would suggest that more
    than four drives could saturate the bus itself. A large server supporting data
    banks scaling into terabytes would need many disks, and if there is to be a four
    disk per controller performance limitation, then it will also have multiple controllers.
    Here for once performance and reliability add one another, as each controller
    is in this arrangement a point of failure for only four drives, rather than the
    15 it could possibly support.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Mixing and Matching SCSI Versions


    It is possible to mix different versions of SCSI device on the same bus. As a
    general rule, the controller will adjust the bus speed to match the slowest device
    on the bus. Clearly this can be a significant performance issue. I should point
    out that there are some combinations that will not work. Some LVD devices can
    operate in single ended mode, but not all. Those that do are often termed multi-mode
    devices. Multi-mode terminators are also available, some of which give a visible
    indication of the mode the bus is operating in. This can be handy for debugging
    purposes. HVD devices do not play well with any others of any type. Mixing HVD
    devices with SE or LVD will not only break the bus, it could very well damage
    devices and/or controllers. Be careful!


    SE, HVD, and LVD buses all require a different style of terminator. Be sure you
    have the right one, and don''t forget that devices may have internal terminators
    (though internal terminators are not common in different devices). Terminators
    can also be built into the cable itself, a handy option as it means one less to
    keep track of, and possibly lose. SCSI controllers usually have the ability to
    terminate the bus, also long as they are the last device and you activate the
    termination. Whenever you change devices on a SCSI bus, always make sure you get
    the termination right. The classic symptom of missing a terminator is that the
    devices on the unterminated bus appear at boot. If a bus is terminated before
    a device, the rest of the bus will be happy, but the isolated device(s) will be
    invisible to the controller.


    It is possible to mix wide and narrow devices on the same bus. Again, proper termination
    is a key in making this work. You will need a special adapter to attach a narrow
    device to a wide bus. The adapter will need to terminate the extra unused data
    channels on the wide bus as it enters the narrow device; otherwise, these eight
    channels would be terminated. It is theoretically possible to attach a wide device
    to a narrow bus, but as this would halve the transfer rate of the wide device,
    it makes little sense to do it. There are also dual channel controllers that can
    support more than one physical cable segment. In this case you might have a narrow
    segment for your narrow devices and a wide one for your wide devices, each having
    separate bus cables. Remember, too, that a narrow device can only count to seven.
    If you put a wide device on a narrow row, don''t configure it to be higher than
    device ID 7 or it cannot be seen. In the same way, a narrow device on a wide bus
    cannot talk to wide devices having device IDs greater than seven. This would be
    a problem if'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# 60 Building a Reliable Server


    ![](img/8f0b2e54b3e875094917788f9cb87c45_83_0.png)


    **Figure 3.1** SCSI device types can be mixed on the same bus.


    the wide controller happened to be numbered device ID 15, for example. Mixed SCSI
    devices are illustrated in Figure 3.1, shown using a dual channel SCSI controller
    card. Note that addressing the controller as ID 7 on the wide controller is unusual.
    Normally the controller is set to the highest possible address (ID 15 in the case
    of a wide SCSI bus), as the higher addresses have higher priority on the bus.


    # What about Fibre Channel?


    When I said earlier that in a Linux environment you are limited largely to either
    ATA or SCSI, some readers might ask,"What about Fibre Channel?" FC is a transport
    layer network protocol that attempts to marry the lowoverhead, high-bandwidth
    characteristics of a local bus protocol PCI or SCSI with the high-overhead, low-bandwidth
    performance of a distrib-'
  merge: -1
  pgno: 83
- img_proc: true
  md: '# Choosing the Right Hardware


    uted network protocol such as an IP routed Internet. The IP Internet has flexibility,
    allowing a large number of senders to transmit frames of data to any receiver
    on the network, with the network handling the delivery. This allows for large
    number of hosts, distributed over large distances, and great flexibility in changing
    configuration. A local bus SCSI, on the other hand, supports a limited number
    of devices that must be closely situated, and cannot be flexibly reconfigured,
    but gives far higher bandwidth than the distributed network.


    The FC standard offers an interconnect structured like a LAN, using hubs and switches,
    offering local bus speeds. FC can be implemented over short distances on copper
    wiring, but it is really designed to use fiber optic cabling, allowing device-to-device
    distances of up to 10 kilometers at bandwidth up to a gigabit per second. It is
    used primarily to implement large-scale, high-speed disk storage infrastructures,
    commonly called Storage Area Networks (SANs). In this context, people refer to
    FC drives. FC alone, does not support the functionality needed to implement a
    disk drive in a Linux environment. A Linux drive is in fact a SCSI drive that
    uses FC as its network transport. A Linux host supports FC drives with with appropriate
    drivers. The drives attached to this HBA would have a physical fiber optic connection
    and use FC to pass data. The drives also contain a SCSI controller, so the format
    of the data passed on the FCs to the time-honored SCSI standard. Thus the FC drives
    will appear to the Linux kernel as SCSI devices.


    FC drives have excellent high-availability features, allowing for hot addition
    and removal of drives and hosts into and out of an FC network. The major limitation
    of FC is for cost. Most fiber-optics-based technologies tend to combine high performance
    with high cost (it would seem that you pay for you) and FC is no exception. For
    those contemplating Linux data environments, however, FC will scale happily to
    multi-terabyte arrays with excellent performance.


    If you want to know more, the University of Minnesota maintains a good FC resource
    at www.borg.umn.edu/fc. Linux-specific FC information can be found from Sistina
    Software at www.sistina.com/Pages/fibre_channel.


