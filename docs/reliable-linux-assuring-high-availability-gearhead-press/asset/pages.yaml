    for implementing shared disk storage between multiple servers. The next logical
    step is to manage such servers as an integrated group, a concept generally called
    server clustering.


    This chapter is an examination of this clustering idea. First we''ll define what
    clustering is and list the benefits claimed for it. Then we will examine the structure
    of a cluster in the general case, defining the major features that make up a cluster.
    This should help you to judge the relative merits of clustering for your needs.
    If you like the idea, you will need to know what sort of cluster implementations
    you have to choose from, so the chapter ends with a review of several cluster
    implementations, including both source and commercial offerings.


    # The Cluster Concept


    If you have several servers together in the same room, performing a separate function,
    you have a group of servers clustered together, but you would not have what is
    termed a server cluster. What is the difference between a cluster of servers and
    a server cluster? A server cluster involves'
  merge: -1
  pgno: 394
- img_proc: true
  md: 'a group of servers will be managed as a group, so that what happens on one
    server node (servers within a cluster are commonly called server nodes, or simply
    nodes; I''ll use this terminology from now on) is reflected in another. It can
    be for performance purposes, where a heavy load carried by one node may be spread
    across others by the cluster management code. It can also be for reliability purposes,
    so that a failure in any node in the cluster can be covered by bringing in a backup
    node to fill the gap. These two areas, performance and reliability, are thus the
    major driving forces before clusters.


    Although there is no single definition of a cluster, you will find that most will
    have many, if not all of the following elements:


    +   - All of the nodes in the cluster are connected via a LAN. This is not necessarily
    used for production purposes (although it can be and often is), but primarily
    provides a communications path to all of the nodes in the cluster for use by the
    cluster management software.


    +   - Monitoring software running on all nodes in the cluster to report on the
    status of each node, and possibly also the status of applications running on each
    node.


    +   - Some form of shared data storage is implemented within the cluster, allowing
    multiple cluster nodes a path to access data stored on any single storage device
    in the cluster.


    +   - In a reliability-oriented cluster, all of the nodes are connected in some
    fashion to a hardware-specific control or monitoring mechanism, allowing the physical
    health of each to be monitored and allowing for remote control of physical functions
    such as powering a node on and off.


    +   - In a reliability-oriented cluster there will also be a mechanism in place
    to enable one node to take over the function of another if any of the monitors
    detects a hardware or software failure within the cluster.


    +   - In a reliability-oriented cluster sufficient hardware redundancy ensures
    that no piece of hardware constitutes a single point of failure.


    +   - In a performance-oriented cluster, there will be a mechanism in place to
    monitor the load carried by each node, and a means to redistribute that load among
    nodes in the cluster in order to maintain optimum performance from the cluster
    as a whole.


