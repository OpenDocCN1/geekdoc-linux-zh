    # IMPORTANT NOTE FOR RED HAT 7.1 AND A SCSI DISK RAID


    The kernel version shipped with Red Hat 7.1 includes support for SCSI disks, but
    it is compiled as a module to be loaded into the kernel at boot time. This causes
    problems for autodetect RAID superblocks. The kernel code that looks for the 0xfd
    flag in a partitioning indicating that partition to be part of a RAID occurs in
    the boot sequence before any modules are loaded. If your kernel supports SCSI
    as a module, RAID superblocks residing on any SCSI disk will not be detected at
    boot. To work around this, Red Hat includes an means of starting arrays by including
    them in the boot script /etc/rc.sysinit an clause that uses the /etc/raidtab in
    conjunction with raidstart to start all of your arrays. This will work fine so
    long as no disks in an array have failed and the current SCSI disk identifiers
    are consistent with the array definitions in /etc/raidtab. If you have experienced
    a disk failure, neither of these conditions is necessarily true, and the method
    of initializing the arrays can fail. The intent of the designers of the RAID driver
    was to let the RAID superblock gracefully handle these issues. This is the way
    it should be done. Consequently, you should do two things to your stock 7.1 installation.
    First, you need to build a new kernel that statically links into the kernel the
    appropriate SCSI driver for your SCSI controller. Building kernels is beyond the
    scope of this book. If necessary, consult the Kernel-HOWTO or your favorite Linux
    systems administration book. Once you have your new kernel, you should then comment
    the if clause in /etc/rc.sysinit that attempts to start the RAID arrays. Look
    in the script for the comment "Add raid devices."'
