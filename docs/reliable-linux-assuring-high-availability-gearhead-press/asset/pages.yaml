    # Transient Power Problems


    Temporary problems like lags or surges are considered transient. They last typically
    less than a second and are over. With these anomalies are more common than one
    might think. They are often caused by some fault of the power supply but by local
    factors the supplier has no control over. Large current draws to a server in the
    distribution network within a building can cause lags or surges. If the panel
    that supplies your server is fed from the same phase as the elevator, for example,
    your server may experience a measurable sag each time the elevator starts upward.
    In the same way, surges can be generated when a large current draw is suddenly
    stopped. In effect the current flow has a sort of momentum that must be dissipated
    somewhere, and if your server is close enough, then each time the heavy-duty coffee
    machine shuts off, unless you closely monitor line power (and many controlled
    machine rooms do) you will never notice these mild aberrations. It is difficult
    to predict, however, the effect they can have on a server. Without any form of
    protection, the server''s internal power supply unit has the ability to smooth
    out these lags or surges, but it is limited and, if sustained over a long period,
    affect the service lifetime of the power supply itself. Erratic hardware problems,
    such as crashes or freeze ups cause cannot be traced to software or any detectable
    hardware defect, are sometimes eventually traced to power problems.


