    A final note: If you prefer to look for a commercial packaged solution for bare
    metal recovery, there are several choices on the market. Examples include QuickStart
    (www.estinc.com), BackupEDGE (www.microlite.com), and RescueRanger (www.lone-tar.com).


    # Reducing Risk Due to Operating System Failure


    While it is absolutely necessary to have in an operating system recovery plan
    as I have just laid out, there are other tactics that you consider to reduce your
    liability in the case of the loss of the operating system disk. These tactics
    address point six in our backup system to-do list. I would point out that if you
    are willing to accept a higher level of risk, you might feel that using redundant
    servers is more than you need. If your operating system disk fails, you may be
    willing to accept inevitable several hours of downtime while you go through the
    bare metal recovery detailed in the preceding sections. On the other hand, you
    may want some further options.


    In the short term, one option is to move an application to a different machine
    while you repair the damaged operating system. To allow this option, I generally
    prefer to use application disks implemented in a separate external from the server.
    That, if the operating system dies, you can unplug the external case containing
    the entire application—binary code and move it to a functional machine, plug it
    in, and turn it on. You may need to resolve differences in device identifiers
    or address conflicts with existing devices on the new server, but that should
    not take long. This data portability is one of the basic concepts underlying the
    high availability clusters discussed in Chapter 10, "Server Clustering.\ In that
    case, the spare server is already attached to the data drives, and the fail-over
    from one operating system and server to the others happens automatically as possible.


    Another option you may want to consider is to have a spare operating system disk.
    Simply install Linux onto a single disk and store the disk against the possibility
    of needing it. If a server fails, install the spare oper-'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'ating system disk and boot. If you are careful to ensure that your partition
    names and file system layouts are the same for your spare operating system as
    for the production system, you should be back up right away. You will need to
    be careful to track any changes made to the production system since they will
    need to be reproduced in the spare to avoid problems if you need to then replace
    the faulty drive and create a new spare at your leisure. This does mean you have
    to dedicate a drive as a spare, which you may not have in your budget, although
    drives, especially ATA drives, are so cheap these days that you could consider
    this pretty effective insurance.


    # Managing Site Recovery


    We have now reached the seventh and last item on our to-do list, the issue of
    site recovery. The central element in a site recovery plan is maintaining the
    data needed to recover your site in a safe off-site location. When choosing the
    off-site data storage location, consider the following:


    If a natural disaster is what you are protecting against, ensure that the off-site
    storage location is not subject to the same risk. For example, if hurricanes are
    a factor in your area, the off-site storage needs to be removed from a significant
    distance from the production site as a hurricane can affect a large contiguous
    area. If a tornado is of concern, a few miles distant may be sufficient as tornadoes
    affect a much smaller area.


    The off-site data storage site should be as close as possible to the site where
    the replacement server will be set up, if you have an alternative server. That
    minimizes time spent getting the backup to the replacement server. Ideally the
    off-site tape is stored on site with the backup server.


    Consider security. Many smaller businesses have an employee take the off-site
    backup home. While at first sight this seems a simple and effective plan, it leaves
    out the consideration that all of the company''s production data is stored in
    a private residence. This can place both the employee holding the data and the
    data itself at risk if data has significant monetary value to your company or
    to a competitor. It also places your entire company''s operation in the hands
    of a single employee.


    Another issue in the case of a site loss is metadata. A critical element of the
    off-site backup must be metadata describing the hardware and software configuration
    of the original server since this will be necessary to'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'build a replacement server. If you can justify purchasing a complete spare
    unit to sit in a backup location against the possibility of the production site
    going down, this is the ideal situation. That may not be practical if your production
    server is an expensive machine or the primary production site is home to a number
    of servers. In this case, existing machines at your backup site may have to be
    pressed into service in an emergency. Hardware and software configuration metadata
    is essential in this case as you will have to determine which backup servers may
    or may not be suitable for the lost units.


    You may also need to source new hardware for the backup site, in which case you
    need to know what to buy. You do not want to find yourself experimenting with
    getting back online in this situation. The hardware information you compile and
    store should include manufacturer, model, and serial number information. The manufacturer
    and model numbers ensure that you can get the proper software drivers and source
    equivalent hardware as necessary. The serial numbers are important after you get
    things back online at the recovery site as there will be insurance claims to make
    regarding the equipment lost at the production site. If you can provide, from
    the backup site, a detailed inventory of the lost equipment, that will make any
    insurance claim a great deal.


    I know it sounds low, and I have made the point before, but I prefer to see this
    information printed on good old-fashioned paper, as well as stored in electronic
    form. A full site recovery is a crisis situation. You cannot depend on knowing
    who may or not be available during the recovery period. If the information is
    stored only on tape, you will need a drive to read the tape and someone who knows
    how to use the drive as well as knowing what files to extract from what tape.
    If the information is also there in print, it is available in the most generically
    accessible data format there is. It doesn''t matter who you are dealing with.
    Anyone will be able to open and read or fax that information as necessary.


    # Long Distance Backups


    The increasing availability of high bandwidth long distance connections is making
    backups to remote sites a practical possibility. While it has been possible for
    a long time to do backups across a network using LAN technology, this was typically
    limited to the scope of the local network, usually measured in terms of a few
    hundred feet or so. A sufficiently fast modern data connection allows backups
    to run directly from the satellite site to a tape located at a central location—possibly
    hundreds or even thousands of miles distant. With appropriate software support
    and ruling out'
