  md: '# Choosing the Right Hardware


    # Tape Drive Configurations


    The smallest tape drive unit is of course a single cartridge drive, typically
    built into the server case itself. In this case, the capacity of a single cartridge
    is an important factor in choosing a drive, as data in excess of the capacity
    of a single cartridge could not be backed up unattended. It is generally preferable
    to do backups at times of low system load, both to ensure the integrity of the
    data and to minimize the performance cost of the backup, and in real life often
    means during the night. It may well be impractical or economically unfeasible
    to employ an operator to come in 3 A.M. to switch tapes, and then go home! Fortunately,
    several of the technologies I have reviewed enough single cartridge capacity to
    store the kind of data volumes that might be expected on a small-scale single
    server.


    Should a single cartridge drive be inadequate, the next option is a small tape
    library, or jukebox. Small libraries start at capacities of six cartridges, giving
    unit capacities of 400 GB and up. Libraries grow, with the functional upper limit
    generally being your budget. The largest libraries scale to terabytes and incorporate
    sophisticated robots to handle the cartridges. If you are buying your first tape
    storage unit, careful not to limit your ultimate expansion ability. The volume
    of data you will have to store in the future will only grow. If you are going
    to come close to filling a single cartridge today, invest in a small autoloading
    library unit, and you will not have to go through a migration process to a new
    technology or two from now.


    # Tape Drive Compatibility


    One thing you need to be careful about compatibility. There are so many different
    tape drive technologies, each of which has a variety of different standards. All
    of the drive technologies we have reviewed make use of data compression techniques
    to pack more data into a tape. There are as many different standards for data
    compression as there are drives that implement them. My rule is that each time
    I make a tape, I label it physically, not only with a record of the data it carries,
    but also the drive it was created in, and all parameters I can think of might
    be relevant.


    My rule for backups is that every time I make a tape, I test a tape. That is,
    when I design my backup routine, for each tape generated, I pull a tape from the
    archive and test it to make sure that it is still readable. Far too many people
    have war stories about sites that invested in backup systems and'
