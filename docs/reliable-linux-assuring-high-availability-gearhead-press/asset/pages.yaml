    # Step 6: Do It


    Cost out what you can afford and implement it. Notice that many of the defenses
    involve creating procedures and developing policies. These procedures and policies
    cannot be created once, when left on the shelf to gather dust. They need to be
    practiced; hence, any procedure needs to have an accountability factor built into
    it to ensure that it is really being done. Policies and procedures also change
    with time and need to have built them into a review process to ensure that they
    keep with changing times and technologies.


    Everything you need to be fully and clearly documented. The people you have now
    will move on in their time, and it is critical that they do not take essential
    knowledge with them. Good documentation is also critical if problems arise while
    an employee is ill or on vacation. You cannot afford to have the operations of
    the company hanging on a single person who knows the obscure series of commands
    to resolve a known problem. It is a great blessing to have good and competent
    employees, but their needs to be recorded for the benefit of the company, not
    held alone in their heads.'
