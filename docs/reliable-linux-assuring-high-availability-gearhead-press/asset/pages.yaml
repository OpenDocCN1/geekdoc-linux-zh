    interpreted correctly as a binary.) Newer technologies are dropping logic voltages
    significantly, however. The new Serial ATA standard, for example, will use logic
    based on a high of only 250 millivolts, or one quarter of one volt. In a drop
    of only a small fraction of one volt would cause chaos. EMI or RFI signals passed
    to the server over the incoming power signal could create this kind of subtle
    fluctuation and produce serious difficulties.


    A UPS is an effective way of eliminating problems with noise. The sponge effect
    of the UPS serves as an effective buffer to absorb these higher frequency transients.
    In the case of EMI and RFI, a good quality UPS will add extra circuitry to eliminate
    any of these signals which might survive the damping effect of the battery. Thus
    a good UPS will not even out the sags and surges, but also clean the power supply
    to the server as well. This is in itself a valuable aid to reliability, even if
    you never use the UPS to cover an actual power failure.


    # Total Power Failure


    The UPS earns its keep, of course, in the case of a complete blackout. In this
    case the UPS needs to be sized to keep the server running for as long as you want
    it to. How long that depends on your power outage strategy. I wish could eliminate
    all your risks, but unfortunately this is one area where we all have to play the
    odds. To play this game, you ask this question: In my area of the world, how often
    do I lose power, and how long does it stay off? You can get historical data from
    your power supplier, and then place your bets accordingly. If the longest single
    outage in the last 25 years was eight hours, then you could choose eight hours
    as a reason-'
