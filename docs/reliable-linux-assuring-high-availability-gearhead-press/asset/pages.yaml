  md: '# Building a Reliable Server


    operated for years before discovering in a time of crisis, that none of their
    backups were any good.


    # Tape and Tape Drive Maintenance


    Like any mechanical device, a tape device needs to be maintained if it is to operate
    reliably. The single most important issue with all varieties of tape drive is
    cleaning. Dust and dirt get into tape drives and can adhere to the heads and get
    caught up in the tape, both of which will cause data errors. Of all the components
    that benefit from a clean environment, the tape backup unit benefits the most.
    Another source of contamination is the tape itself. Much work has been done to
    eliminate the problem of magnetically sensitive oxides laid down on the surface
    of the tape flaking off and adhering to the heads and other parts of the tape
    handling mechanism. Some oxides will also stain the head as they are drawn across
    it. The current high storage capacities of all the drives give today would not
    have been possible without the media advances of recent years. In many cases,
    increases in capacity between generations of a particular drive technology was
    only possible due to improvements in the media itself. If your drive specifies
    a particular media type or grade, use it. Saving a few dollars on older, cheaper
    media is not worth the data loss it can easily cause. If a specific media is necessary,
    the manufacturer should state it clearly in their documentation.


    All tape drives need to be cleaned on a regular basis. This is so basic to reliable
    operation that some of the newer technologies have incorporated self-cleaning
    capabilities. Others will inform you using a display on the drive if the drive
    is to be cleaned. If your drive does neither, you may need to set up a maintenance
    schedule for the drive that ensures it will get cleaned regularly.


    If you source two drives of the same make and model, you would reasonably assume
    that a tape written in one should be readable in the other. But never assume;
    always test. Current technology tapes have such high data densities that recording
    head alignment is crucial. As long as the heads on your two drives are properly
    aligned, you should have no problem. But if they are new, or if one was purchased
    after the other, or if they have been moved or otherwise disturbed, it is prudent
    to test the readability on one drive of tapes produced in the other. If there
    is a problem, the drive can be serviced. This is not a problem you want to discover
    in the middle of a disaster recovery process.'
