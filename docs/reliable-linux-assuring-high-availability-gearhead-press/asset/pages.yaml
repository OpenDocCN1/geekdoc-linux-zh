  md: '# Introduction


    Selling insurance must be one of the more difficult challenges in marketing. After
    all, you are asking customer to lay out money with no immediate return. In fact,
    if there is never a claim, the customer loses every penny of every premium paid
    with no apparent benefit. But if the unthinkable happens, nobody wants to be without
    a good insurance policy. I hope and trust that none of you will have to face floods,
    fire earthquakes, or the like; but I can almost guarantee that if you manage a
    computer system for more than a year or two, you will have to deal with a power
    failure, or a disk failure, or an operating system failure. Do you have adequate
    insurance?


    With the support of such industry giants as IBM, Oracle, SAP, Dell, and Compaq.
    Linux has clearly become a major platform for deploying open systems of all kinds.
    Much has been written about choosing, configuring and running server software
    of all kinds on the Linux platform. But what about the underlying hardware and
    operating system software? Can you rely on it? The most stable and efficient web
    server is useless when a disk crashes, or the operating system fails. It is essential
    that a reliable server take into consideration the certainty that something someday
    will fail! This book addresses the risks of hardware and operating system failures
    and presents strategies to create your own insurance policy against data loss
    and unnecessary downtime.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Audience


    This book should be useful to a technical manager, Linux system administrator,
    network administrator, or applications developer. The issues, tools, and techniques
    presented are applicable to Linux platforms of all sizes, from a small single
    processor server through a midsize multiprocessor box, up to a multiserver cluster.


    The examples detailed in this book focus primarily on reliability of the entire
    environment in which these servers exist. This book assumes the reader has a working
    knowledge of the Linux environment. If you can install Linux and have a basic
    working knowledge of user accounts, creating and mounting file systems, and configuring
    basic network functions, you should be able to follow the examples.


    Installing Linux itself is not discussed in this book, but many excellent references
    are available to help you in that area. To prepare yourself to get the most value
    from this book, I recommend Installing and Administering Linux, and Customizing
    and Upgrading Linux, both by Al and Linda McKinney, companion books to this one
    and published by Wiley.


    # Structure


    The book is divided into three sections. The first, “Planning for Reliability,”
    discusses the importance of planning strategies to protect your business operations
    when servers fail. This involves technical issues, but must go beyond the technical
    to include the entire business operation. When a server goes down, it takes a
    business process with it. The connection between the technical failure and the
    business process it affects must be understood, and a plan needs to be in place
    to recover both the server, and the process. Before you can start implementing
    protections, you must also know specifically what it is that can go wrong, and
    how severe the effect of any failure would be on your business. If you know that,
    you know where you need to spend your money most effectively.


    The second section, “Building a Reliable Server,” starts with a chapter on the
    state of the art in hardware reliability, covering topics such as hot-swap hardware,
    temperature monitoring, and reliable power supplies. Chapter 4 discusses how you
    can install and configure Linux with reliability as a priority. Chapter 5 is devoted
    entirely to reliable disk storage, with complete coverage of the software RAID
    available in the current, v2 Linux kernel. Closing out this section are chapters
    on monitoring production servers, and backup/recovery strategies.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Introduction xxi


    The third section, "Linux Reliability Enhancements," looks at several reliability
    enhancements new to the Linux world. Chapter 8 covers logical volume management,
    a powerful new way to manage disk storage now incorporated into the current production
    Linux kernel. Chapter 9 reviews recent file system developments, including the
    new journalling file systems of ReiserFS, XFS, JFS, and ext3 as well as two network
    file systems, enbd and drbd, and the cluster file systems of GFS and InterMezzo.
    The section closes with a chapter on server clustering, which examines a number
    of current Linux based approaches for building highly available server clusters.


    # Examples


    I have included relevant examples when possible. Working with Linux poses a challenge:
    Linux is not a static entity. It changes on a weekly-even daily-basis, so the
    version of the kernel or a supplementary utility that I based my examples on the
    time I wrote this book will almost certainly have changed to some extent by the
    time it finds its into your hands. As some of the functionality I cover is new,
    I am sure it will have changed before you see it, as I have in cases been working
    from beta test releases in developing my examples. You will need to double check
    the appropriate references for the version of the code you use and adjust as necessary
    to ensure that they work for you.


    # Linux and Other UNIX Versions


    This book is focussed primarily on Linux, that flavor of the UNIX operating system
    created and still maintained by Linux Torvalds. I have chosen the Red Hat Linux
    distribution (www.redhat.com) for my examples, as it is currently the most popular
    North American Linux distribution The principles presented, however, are equally
    applicable to any Linux distribution, although some utilities will behave differently
    or exist in different forms in other distributions. You will need to consult the
    references applicable to your distribution and version in these cases.


    All of the theory I present and much of the practice is also equally applicable
    to other open source UNIX variants such as FreeBSD, OpenBSD or NetBSD. Note that
    anything referred to as kernel functionality will be specific to the Linux kernel
    and may not be found in other UNIX variants.'
  merge: -1
  pgno: 22
