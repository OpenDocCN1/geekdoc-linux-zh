    # Local File System Summary Comparison


    Each of the four presented file system designs offers reliability as well as performance
    and scalability gains over the ext2 file system. It is up to you to assess the
    relative strengths of each as you make your decision. To help compare point for
    point, Table 9.1 summarizes the major areas of comparison for ext2 and the four
    competitors.


    Red Hat users should note the last line in the table. The entries here refer to
    my comment earlier regarding Red Hat''s intent concerning file system support
    in future Red Hat releases. While a no in this category means that Red Hat will
    not be supporting this file system, it does not mean that you cannot use it in
    a Red Hat distribution. It does mean that you will probably need to download source
    code from the file system management tools and either a new kernel or kernel module
    to support it.


    Table 9.1 File System Comparison Chart

    | FEATURE | XFS | JFS | REISERFS | EXT3 |

    | --- | EXT2 | V1.0 | V1.0.1 | V3.6 | V 0.7 |

    | Maximum FS size | 4 TB | 18,000 PB | 32 PB | 17 TB | 4 TB |

    | Maximum File size | 2 GB | 7,000 PB | 4 PB | 17 TB | 2 GB |

    | Metadata journaling | no | yes | yes | yes | yes |

    | Data journaling | no | no | no | no | yes |

    | Metadata indexing | no | yes | yes | yes | future |

    | Quota | yes | yes | yes | yes | yes |

    | ACL | no | yes | no | no | no |

    | LVM | yes | yes | yes | yes | yes |

    | Software RAID | yes | yes | yes | yes | yes |

    | Snapshots | LVM | LVM | LVM | LVM | LVM |

    | root/boot support | yes | yes | yes | yes | yes |

    | Red Hat support | yes | no | no | no | yes |'
