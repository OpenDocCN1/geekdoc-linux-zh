- img_proc: true
  md: '# CAMPBELL''S LAW OF BACKUPS


    Whatever command you choose to use to backup your data, you would be well advised
    to consider Campbell''s Law of Backups, which states, "For every backup tape you
    make, take a previous one off the shelf and test it." I always marvel at the number
    of people I have run across who have a story to tell about a site they knew for
    that place in a backup system and used religiously. Then, when something failed
    and it was necessary to do a restore, it was discovered that for some reason the
    backups were no good. In some of these stories, backup systems had been running
    for years and no one had ever thought to test the backups after they were made
    to ensure that they were actually good!


    I argue that each time your backup system completes an archive, it should choose
    a tape containing a previous archive and perform a test to ensure that it is readable.
    Realize that in doing this is not just to test that the actual backup command
    worked, but also to test the durability of the tape. Diamonds, according to James
    Bond, are forever; unfortunately, the same cannot be said for magnetic storage
    media. Temperature, humidity, exposure to magnetic fields, and just time affect
    the viability of a tape. Just dropping a tape on the floor can ruin it. You should
    replace a tape drive, the tapes on the old drive may not necessarily be reliably
    readable on the new one, especially if the new drive implements a new technology.
    Backward compatibility can be a significant problem in the particular case of
    tape drive technology. Stored in the proper conditions, tapes can and last for
    years, but there is no harm in keeping tabs on how yours are holding up.


    for a table of contents of the archive, respectively. The archive device is specified
    by the -f option, the archive device being the device where the archive is to
    be written to or read from. Here the following command writes a tar archive of
    my home directory to the first SCSI tape drive (/dev/st0). The -v option lets
    tar echo back the filenames as they are written to the archive, which is useful
    to meet the first requirement on our to do list:


    ```

    tar -cvf /dev/st0 /home/iain

    ```


    Naming a directory as an argument to tar implies that the directory will be recursed.
    I can exclude files or directories from the recursion with the --exclude option.
    The following command archives all of iain''s home directory with the exception
    of the /home/iain/junk subdirectory:


    ```

    tar -cvf /dev/st0 --exclude /home/iain/junk /home/iain

    ```'
  merge: -1
  pgno: 291
- img_proc: true
  md: '# Backup and Recovery Strategies 269


    You may also wish to use the -l option to restrict the recursion to files within
    a local file system. Otherwise, an archive starting at /, for example, would include
    all files in the entire logical file system structure. For example, this command
    would create an archive of only the root file system:


    ```

    # tar -cvlf /dev/st0 /

    ```


    This will help meet the second requirement on our to-do list, although as you
    will see shortly dump a better job of dealing with whole file systems than tar.


    You can make multi-volume archives with the -M option. I find this handy for moving
    a small number of files between machines using a floppy disk. It will also work
    fine for tape drives. If the data will fit on a practical number of floppies,
    you could do it with this command:


    ```

    # tar -cvf /dev/fd0 /home/iain

    ```


    You should be careful to label the floppies or tapes as there is no way to easily
    determine from the data in the archive which volume number a particular diskette
    or tape is or how many volumes make up the entire set.


    If you are having trouble getting your data to fit your media, you can take advantage
    of the gzip compression algorithm (see the accompanying "What about gzip" sidebar)
    by asking for it with the -z option, like this:


    ```

    # tar -cvzf /dev/st0 /home/iain

    ```


    Note that you used compression to make this archive, so you will need to include
    the -z option also when you restore the archive. If your tape drive also has compression
    in hardware, it is unlikely you will gain much benefit from compressing at both
    the tar level and the hardware level. It is probably better to let the drive do
    the compression and avoid loading up the CPU.


    Once you have your archive made, you can get a table of contents using the -t
    option, like this:


    ```

    # tar -tvf /dev/st0

    ```


    If you obey Campbell''s Law of Backups, you need a way to test a tar archive.
    Unfortunately, there is no specific option that will do this. It is necessary
    for tar to read the entire archive to complete the table of contents, and if tar
