    than a reliability standpoint than RAID1. To increase the basic RAID4 degree of
    redundancy, the Linux RAID drivers introduce support for the use of spare disks.
    A spare disk is installed, powered on, and identified as a member of the RAID;
    but until a drive failure, it is unused, acting as a hot spare. If a drive fails,
    the RAID driver automatically starts using the spare. Thus, you can increase the
    level of redundancy in the array to the extent of the number of spare disks you
    allocate. Remember also from the discussion of hardware in Chapter 3, “Choosing
    the Right Hardware,” that support for hot-swap disks is not universal in the Linux
    world. Without hot-swap hardware you cannot safely replace the failed disk without
    bringing the server down, and that means unscheduled downtime. Thus, subsequent
    to a drive failure in an array having only a single level of redundancy, you would
    be forced to operate with no redundancy until you replace the failed disk. A spare
    disk will keep the array going and still maintain redundancy until you schedule
    down time in an acceptable window.


