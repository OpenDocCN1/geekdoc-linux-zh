  md: 'As both races and crashes are often caused by faults in code, the importance
    of testing new application code in an offline, non-mission-critical environment
    cannot be over stressed. Any new application, or upgrade to an existing application
    should be thoroughly tested before placing it into production. A modest investment
    in test hardware and test time may prevent costly production hassles. As the old
    saying goes, an ounce of prevention is worth a pound of cure.


    # Linking Downtime and Security


    Server security and downtime are closely connected. While this is not a book on
    security, it is important to see that a breach in security can cause downtime,
    and scheduled downtime may be necessary to implement or maintain your security
    systems. A security breach that results in wholesale destruction of data or the
    server operating system will obviously bring the server down. The procedure to
    recover from such a breach, however, is really the same as it would be for a major
    disk crash, CPU crash, or site loss. You should have procedures in place for these
    possibilities. No one likes to think of having those procedures to recover from
    a malicious action, but the situation is clear and the procedures will be there.


    A much more dangerous security breach is one in which you discover unauthorized
    access at a high level of privilege, where nothing appears to be missing or malfunctioning.
    It is tempting to simply overlook the breach and hope that nothing damaging was
    really done. You change all the passwords and a breath of relief that you got
    over the situation without any downtime or data loss. The problem is that you
    still do not know what might have been done. Have any of the tampered binaries
    on the server been steadily leaking data to an unsure destination or corrupting
    data? Is there a logic bomb planted somewhere in the server that will go off and
    destroy everything next New Year''s Day? If the breach occurs at a high level
    of privilege, you cannot rule any of these possibilities out. Consequently, the
    only response is to bring the server out of production and completely re-install
    it from a secure backup. Clearly this is not the solution you want to implement,
    but you really have no choice.


    Is there something you could do to ward off this kind of trouble? You may wish
    to consider including as a part of your monitoring policy a security scanner as
    tripwire. Originally written at Purdue University, tripwire is now available as
    open source under the GPL (www.tripwire.org). It compares the sizes and parameters
    of critical files, including a checksum value, against a reference database of
    file parameters created from the sys'
  merge: -1
