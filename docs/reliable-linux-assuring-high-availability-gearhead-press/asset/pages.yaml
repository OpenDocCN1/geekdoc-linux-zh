  md: '# Risk Analysis 35


    tem when in a known secure state. Any discrepancies between the current state
    of the system and the reference database indicate a security anomaly, which can
    be investigated.


    An even more robust solution can be found in the Linux Intrusion Detection System,
    or LIDS (www.lids.org). This is a new kernel patch that allows a security administrator
    to protect key files and the kernel itself from tampering, by someone with root
    privilege. This system has promise in providing significant protection from root
    security breaches. That kind of strong protection is good for security, and what
    is good for security is often good for uptime as well.


    # Resolving Boot Problems


    Booting an operating system is a complex process. Once the base kernel is located
    by the boot loader and copied into memory, the kernel must find and configure
    drivers for any hardware it is to support. Then basic parameters such as network
    addresses and names must be set, local and remote file system mounts must be done,
    and user interfaces started must be started up. There is a substantial body of
    data stored in numerous configuration files that must be present and correct for
    all of this to work properly.


    It is essential to ensure that any operating system or application configuration
    you will do survive a reboot. It is easy to say that the machine should only be
    rebooted by the administrator, and should there be a problem, the administrator
    will there to fix it at the time. There are two problems with this idea: One is
    that you cannot control entirely when a server will get rebooted. The other is
    that you may have a surprising amount of difficulty remembering the details of
    all of the configuration machine needs to do its job. When I do any configuration
    changes or upgrades to a server, I always do a test reboot when I''m done. If
    production needs make it impossible to reboot at the time of the changes, I schedule
    a test reboot at the earliest possible opportunity.


    # Human Errors


    A complete discussion of risk cannot be finished without considering plain old-fashioned
    mistakes, accidental or deliberate. A good friend of mine has a T-shirt that says
    on the back, nobody''s perfect. Well, it''s true. It is certain that the highly
    skilled staff who build and operate your servers will make mistakes. Plan for
    it. The following sections describe some of the things you should be prepared
    for.'
