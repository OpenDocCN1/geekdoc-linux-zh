    # ## Managing a Logical Volume Structure


    So far we have seen how to create a Logical Volume structure. Once in service,
    you will want to be able to make changes to the structure to take full advantage
    of the flexibility afforded by the logical storage media. The first one we will
    look at is extending and shrinking the size of VGs.


    # ## Extending and Shrinking Volume Groups


    At some point in time, all of the PVs available in a VG may be allocated to LVs,
    with no room for extending existing LVs or creating new ones. At this point, you
    will want to add a new PV to the existing VG.


    In Figure 8.3 the partition /dev/sdd2 is not a PV. Let''s see how we could make
    it a PV and add it to VG02. First, examine the partition table to ensure that
    the partition has the proper LVM flag set, as shown under the System column:


    ```

    # fdisk -l /dev/sdd

