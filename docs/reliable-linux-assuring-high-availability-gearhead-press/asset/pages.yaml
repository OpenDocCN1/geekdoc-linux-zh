    # Disk Drive Operating Conditions


    Like any other mechanical device, a disk drive is designed to operate under certain
    conditions. Service life and MTBF figures all come to maximum and minimum figures
    for operating and nonoperating temperature, humidity, and shock. Drive reliability
    can be substantially affected by these factors. When a drive is not running, the
    platter is still and the drive heads are in a safe parked position, consequently
    the drive is less susceptible to damage. As a result, a shock nonoperating drive
    can survive as much as ten times greater than what it could while running. The
    mechanism inside the drive is so sensitive, however, that still means that manufacturers
    use engineering shock methods to transport drives, as even the nonoperating shock
    thresholds can be exceeded if you drop the thing on the floor. When you get a
    new drive, look at the packaging. If you ever need to ship that drive, you need
    the same sort of packaging if you want the best chance of drive surviving.

