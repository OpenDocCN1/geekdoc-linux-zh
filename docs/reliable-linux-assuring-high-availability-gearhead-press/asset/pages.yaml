    The superblock also keeps track of the number of times the file system has been
    mounted, with the objective of forcing a file system check after either a set
    number of mounts, or after a defined period of time has elapsed. Hence in my example,
    mount count of 3 indicates that this file system has been mounted three times
    since the last check, and maximum mount count of 20 indicates that when the mount
    count reaches the 20th month, a check will be forced. Notwithstanding the mount
    count, the check interval determines that checks shall be performed every six
    months, as seen in the last checked and after parameters.


    How does this affect reliability? Some conservative administrators like to check
    a file system every time it is mounted, or at frequent time intervals. While there
    is no clear argument proving the utility of frequent checks, it certainly cannot
    hurt. Other if the file system is large, a check can take several minutes, measurably
    delaying the boot process. If you have lost track of the mount count, this can
    take you by surprise. If there is any problem found, the check by default prompt
    you at the console for direction as how to proceed, which will completely hang
    the boot until someone responds. You can change these parameters with the tune2fs
    command also. To set the maximum mount count to 10, for example


    ```

    # tune2fs -c10 /dev/hda5

    ```


    To set the check interval to 14 days, use


    ```

    # tune2fs -i14 /dev/hda5

    ```


    Finally, to protect the file system from filling completely, which can result
    in metadata corruption when processes continue to try to write to a full file
    system, a number of data blocks are set aside as reserved blocks. When all but
    these blocks have been used, the df command will indicate the file system to be
    100 percent full, and no further allocation will be possible. The only user who
    can access these reserved blocks is the one listed in the superblock as the reserved
    blocks uid-root (uid=0) by default. The reserved block parameter indicates how
    many blocks have been reserved, the default is 5 percent of the total number of
    blocks. This is a small price to pay to protect the file system from exhausting
    all disk space. The following command reserves 100 blocks:


    ```

    # tune2fs -r100 /dev/hda5

    ```'
