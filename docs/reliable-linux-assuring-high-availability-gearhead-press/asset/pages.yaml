    # The Importance of Fire Drills


    Recovering from a site loss involves coordination among different people in different
    places in a time of crisis. To be confident that all know their part recovery
    drills are an important part of ensuring the success of recovery operations. The
    procedures for preparing the backup site equipment, getting the backup data to
    the recovery site if it isn''t already there, and getting the necessary staff
    to the recovery site should be planned and clearly laid out in procedures.


    When you write these procedures, make no assumptions about who will be them out.
    A good rule is to write them with the idea that the entire operation will be carried
    out by total strangers who have never seen your operation before. Many companies
    require a full simulation of a site loss, including shipping the staff and data
    to the backup site, doing the recovery, and bringing the backup site online to
    ensure that all will go smoothly when the worst happens. Like fire drills, recovery
    drills should be done regularly, because configurations and staff change frequently
    and a drill done at the beginning of last year may no longer reflect the current
    situation. I suggest a drill every 12 to 24 months.


    # Using Business Recovery Services


    If you not have access to a viable recovery site, you may choose to use the services
    of a BR service provider. For a fee, BR providers supply a backup site, hardware,
    and technical expertise to provide a temporary home for your operations in time
    of disaster. This is an increasingly popular option, one that may be more cost
    effective for you than investing in your own duplicate facility and redundant
    hardware. When using a BR provider, a fire drill is critical since BR providers
    do not normally guarantee that they will be able to exactly reproduce your hardware
    and operating system. You need to carefully examine the infrastructure that they
    will provide and ensure you have procedures in place that will get your application
    restored from your backups to their servers using their tape'
