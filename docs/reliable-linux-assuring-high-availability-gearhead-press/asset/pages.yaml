    server next along the road. If you isolate and fix a problem, but don''t document
    it, the next person may end up having to deal with the problem all over again,
    which would be wasted effort. Even if it is you who returns to the machine later,
    you will remember what you did six months ago, and why you did it? It''s bad enough
