- img_proc: true
  md: '# 304 Linux Reliability Enhancements


    rives can be aggregated by the LVM layer to appear as a single contiguous chunk
    of disk storage for the use of a file system.


    An example of this storage model is shown in Figure 8.2. The figure illus- trates
    two file systems. One resides completely in partition /dev/sda1, while the second
    resides in the logical volume LV01. This LV is composed of the partitions /dev/sda2
    and /dev/sdb1. At one time, this file system likely resided only in /dev/sda2,
    but that partition filled. Using LVM, the second drive was added and the logical
    volume created, allowing the file system to extend into the second drive. As there
    is still an unused partition on the second drive, a new LV could be created made
    up of /dev/sda1 and /dev/sdb2. That allows more space for the file system currently
    in /dev/sda1, which appears to be almost out of empty data blocks. You might argue
    that this is


