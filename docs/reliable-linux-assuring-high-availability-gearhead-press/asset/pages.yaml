- img_proc: true
  md: '# Operating System Recovery


    Progressing down our backup system-to-do list, we come to point five, which requires
    a plan for recovering an operating system disk. While recovering the disk that
    Linux was installed on is fundamentally different than recovering any other failed
    disk, there are two complications when it is an operating system recovery.


    The first is a Catch-22 problem. If you have a dump archive tape of the operating
    system installation, all you need is to restore, right? The only problem is, how
    do run restore when you have no operating system? To recover the operating system,
    you need a way of running some sort of restore utility that can read from your
    backup tape and a device driver for your new disk in order to extract the data
    from your backup tape and write it to that.


    The second problem is making the recovered disk able to boot the restored operating
    system. This operating system recovery process is known as a bare metal recovery,
    and your backup system must have a plan to deal with it. Let''s examine how it
    is done.


    # Tom to the Rescue!


    What you would start with is what is known as a rescue disk. This is a bootable
    disk containing a small Linux kernel, a variety of device drivers, and a selection
    of basic storage management commands. You could make one of these yourself. If
    you want to try, I recommend the Linux Bootdisk HOWTO, which leads you through
    the steps to produce a bootable disk or CD-ROM. You will find, however, that it
    is a nontrivial proposal.


    I prefer to use one of the existing rescue disks available on the Internet. One
    of the better known ones is Tom Oehser''s root boot disk, or srtbt he calls it,
    which I mentioned in Chapter 4. You can find it at www.tom.net/rb. This site has
    instructions on how to download the package and create the actual bootable rescue
    diskette. You will be able to boot a Linux kernel from this diskette and on it
    device drivers for a wide range of common hardware devices, as well as commands
    such as fdisk and mk2fs to partition and create file systems on your replacement
    disk. It is important to make sure that you have any necessary drivers to support
    your hardware on your version of rescue disk. Tom has included an excellent selection
    of drivers, but it is not exhaustive. Check this out before you have to use it.
    If you need to add a driver, Tom has included instructions and scripts to do it.
    Tom has, in fact, done an excellent job.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 286 Building a Reliable Server


    Also included on the rescue diskette are tar and cpio to enable you to restore
    files from an archive. Note that restore is not included. That means that your
    operating system backup must be made with tar or cpio. In fact, although it appears
    that tar and cpio are included, you will find that they are actually links to
    pax, a utility intended for POSIX to be a generic low-level archive utility. In
    practice, few use it, but it has the advantage in context of being able to read
    both tar and cpio format archives, so Tom chose to it the equivalent of two commands
    in one, which is important when you are trying to squeeze as much as you can onto
    one disk. The tomsbt motto is: "The most GNU/Linux on no floppy disk." Be aware
    that while pax will behave like tar, it does not behave like GNU tar, which has
    extensions over and above the generic version of tar pax is intended to support.
    One significant difference is that generic tar does not support inline compression
    as an option, as does GNU tar. Using GNU tar, had you created an archive with
    the -z option, you would extract it with the command:


    ```

    # tar -xzvf /dev/st0

    ```


    Using the commands available on tomsbt, you would have to uncompress the tarball
    as a separate operation in a pipe, like this:


    ```

    # gzip -d < /dev/st0 | tar -xvf -

    ```


    Now let''s look at an example of using tomsbt to recover an operating system.


    # Preparing for Bare Metal Recovery


    Before you can do a recovery, you need a backup, so your procedure must start
    there. Using tomsbt, we are restricted to using either tar or cpio on the restore;
    I choose to use tar. According to the Titanic principle mentioned in the section
    The Consistency Problem earlier in this chapter, the operating system on a production
    server should be divided among several file systems, at least the root file system
    and possibly /boot, /var, /home, /tmp, and others.


    Consider an example with three file systems: /,home, and /tmp. You can add further
    archive commands for any additional file systems your server may have. These tar
    commands run on my server when it is healthy will back up my current operating
    system:


    ```

    # tar -clvf /dev/st0 /

    # tar -clvf /dev/st0 /home

    ```'
