    per controller, according to the ATA standard, this should be fine. As it turns
    out, there are two problems. Should one of the drives fail, the RAID will serve
    data from the good drive, as it should, and Linux will be happy. Unfortunately,
    ATA controllers do not take well to the loss of one of their devices. A failure
    of one will usually cause problems for the other. If you were to put each of the
    two drives on different controllers, that would be better, until you need to use
    the tape or the CD. You may be able to survive this, if the CD or tape is not
    mission-critical in terms of keeping the server going. It means, though, in order
    to get your backups working again, you need to service that drive ASAP. In a small
    server, this may be acceptable, but it is a risk you need to be aware of. The
    second problem is one of performance. The ATA bus does not well at accessing both
