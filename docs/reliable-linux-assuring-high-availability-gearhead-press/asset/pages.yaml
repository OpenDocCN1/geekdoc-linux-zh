    Notice that although this VGDA has been read from only one PV, it contains information
    about not only the PV itself (in the first section of the output), but also information
    about the entire VGDA this PV is a member of. The same will be true of every PV
    in a VG. This is good for reliability as if one PV is lost in a VG, the LVM still
    has a source for the information it needs to use the VG (or at least as much of
    the VG survived the loss of the PV that failed). It also means that a PV carries
    on itself all of the data necessary to use the entire VG. This makes a VG a portable
    data structure. This is good in terms of the Titanic principle (as described in
    Chapter 4, "Installing and Configuring for Reliability") as it means that you
    could remove an VG from a failed server and plug into a backup machine, read the
    VGDA information from any of the PVs in the VG, and be able to use the entire
    VG in its new home. Notice that each PV is allocated a Uniform Unique Identifier
    (UUID); you can see it in the VGDA output. This is a number created by an algorithm
    designed not to duplicate an identifier and is used to distinguish this from any
    other PV in creation. This is necessary if VGs are to be portable from server
    to server, as a disk that /dev/sdb on one server may turn out to be /dev/sdg on
    another, dependent upon which SCSI address and controller the disk is configured
    on the second server. identifiers like /dev/sda1 are not reliable when transporting
    VGs from machine to machine, but the UUID is. This data portability can become
    a key component in a high availability server data cluster.


    Because the VGDA is a critical data structure for the LVM, backups of the VGDA
    are automatically made by any of the commands that manipulate'
  merge: -1
  pgno: 334
- img_proc: true
  md: 'The VGDA data files in the directory /etc/vgconf. Any of these VGDA backups
    can be restored to a damaged disk using the command vgcf-restore. Be sure to include
    these VGDA backups in your backup rotation.


    # Creating Volume Groups


    Now that we have some PVs, the next thing to do is to bring them together into
    VGs. Remember that you cannot define an LV unless you have first defined the VG
