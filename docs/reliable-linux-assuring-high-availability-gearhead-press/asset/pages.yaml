    # LVM Startup and Shutdown


    One final topic that needs to be addressed to get an LVM system up and running
    is the addition of a few LVM commands to the procedure for shutting down VGs cleanly
    when shutting down the operating system and for getting VGs recognized and activated
    at boot time. VGs should be moved to an inactive state before bringing the system
    down, using the following command:


    ```

    # vgchange -a n

    ```


    The -a flag followed by the n argument indicates a request to deactivate. With
    no specific VG name, the command will attempt to deactivate all active VGs. To
    deactivate a specific VG, for example the VG named VG02, the command would be
    as follows:


    ```

    # vgchange -a n VG02

    ```


    Any LVs that contain file systems need to be unmounted and inactive before this
    will work, however the command need to be inserted toward the end of the system
    shutdown process. For a Red Hat 7.1 system, that would be the script /etc/rc.d/init.d/halt.
    All the lines shown in bold toward the end of the supplied script, like this:


    ```

    # Remount read only anything that''s left mounted.

    #echo "Remounting remaining filesystems (if any) readonly"

    ```'
