  md: '# dump and Incremental Backup Levels


    dump uses the term increment level to implement incremental backups. When you
    make a dump archive, you specify the increment level in the form of a number between
    zero and nine. Each time you do a dump, the date of the dump, the name of the
    file system dumped, and the dump level are recorded in the file /etc/dumpdates.
    The next time the same file system is dumped, the increment level you specify
    at that time is compared to the increment level of the most recent dump for that
    file system as recorded in /etc/dumpdates. The rule is that dump will archive
    all files that are new or were modified since the last dump of a lower level.
    A level zero dump by definition archives all files.


    Consider the example of the calendar shown in Figure 7.1. The number shown in
    the middle of each day represents the dump level for a backup that runs at night
    at 1 A.M. The first Saturday of every month, a level zero dump runs, backing up
    the entire file system. Next a weekly cycle begins. Every Sunday, a daily incremental
    dump occurs, with the increment level increased by one each day. It is important
    to note that a separate tape would be used each day, for each increment level.
    Thus the level two dump of Sunday catches all of the changes between Saturday
    and Sunday. Likewise the three dump Monday catches the changes since


    | S M T W T F S |

    |---|---|---|---|---|---|--|

    | | | | 1 | 2 | 3 | 4 | 0 |

    | 5 | 6 | 7 | 8 | 9 | 10 | 11 |

    | 2 | 3 | 4 | 5 | 6 | 7 | 1 |

    | 12 | 13 | 14 | 15 | 16 | 17 | 18 |

    | 2 | 3 | 4 | 5 | 6 | 7 | 1 |

    | 19 | 20 | 21 | 22 | 23 | 24 | 25 |

    | 2 | 3 | 4 | 5 | 6 | 7 | 1 |

    | 26 | 27 | 28 | 29 | 30 | 31 | 1 |

    | 2 | 3 | 4 | 5 | 6 | 7 | 0 |


    Figure 7.1 This calendar illustrates levels for a simple incremental tape rotation.'
