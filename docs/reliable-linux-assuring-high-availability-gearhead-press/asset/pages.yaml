  md: '# Risk Analysis 29


    server down, if it is not a hot swap unit. If you want to avoid this, you could
    attach the tape drive to a second, non-mission-critical internal server. Then
    you could bring the tape server down if necessary without affecting production.


    # Alternatives to Magnetic Tape


    If you don''t like the idea of magnetic tape, you may want to consider using disk
    as a backup media. The almost continuous drop in hard disk prices has brought
    disk storage to the point of being cheaper than tape on a megabyte-stored basis.
    There are removable media drives in the 20-40 GB range that can be had for a reasonable
    cost. I will going to get into more detail options for this area in Chapter 7,
    "Backup and Recovery Strategies."


    # Internal Power Supply Problems


    The power supply internal to the server is primarily solid state, with the exception
    of a cooling fan. If you have secondary cooling fans inside the case and you are
    monitoring the in-case temperature, then you should be reasonably well prepared
    for a power supply failure. As the rest of the power supply is solid state, there
    should be little cause for concern, right? Well, yes, but should that power supply
    fail, the server is going to crash. And it doesn''t matter how many levels of
    disk redundancy you have, and how many extra factors, your data is not going to
    survive unscathed. So, although the likelihood of internal power supply failure
    may not be high, the severity is. The only real way to protect yourself is to
    source a server case with power supply redundancy. These cases typically have
    several power supply modules whose total capacity exceeds the maximum possible
    of a fully populated case. Thus, one module may fail without crashing the server.
    Needless to say, you would expect these modules to be hot swappable.


    It is also possible to have a power supply that does not actually fail, but slips
    outside of the acceptable range of output voltage. This can be a difficult problem
    to isolate, as the only symptom might be random CPU errors that are practically
    untraceable. Most motherboards that offer hardware monitoring capabilities will
    monitor power supply output voltage. This is definitely one to add to your monitoring
    scripts.


    On a side note, one way to protect your dynamic data from a sudden and total failure
    such as an internal power supply, is to use file systems that support journalling.
    I''ll talk about these in Chapter 9.'
