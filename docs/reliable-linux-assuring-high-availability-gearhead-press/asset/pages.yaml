  md: '# Glossary


    **AT Attachment** A communications bus (*see bus*) standard for connecting peripheral
    devices (primarily disks) first introduced by the IBM PC-AT, which became the
    most common bus used for disk attachment in desktops or small servers until the
    advent of the PCI bus. *See PCI*.


    **ATA** *See Attachment*.


    **bash** *See Bourne Again Shell*.


    **Basic Input Output System** A machine language code stored in read-only memory
    (ROM) in the hardware of a computer that has all the code necessary for the machine
    to do basic input/output to devices (BIOS), such as the keyboard and disk drives,
    without needing access to disk storage.


    **Berkeley Standard Distribution** The version of UNIX developed over a number
    of years by the University of California at Berkeley. Most versions of UNIX today,
    commercial or otherwise, owe a debt to a greater or lesser extent to BSD UNIX.


    **binary** A numbering system using only the numerals 0 and 1. Digital computer
    hardware can only distinguish the presence or absence of a voltage, and internally
    this can be mapped to a mathematical 0 or 1, which is the basis for the way these
    functions computer. Programs containing the instructions understood by the computer
    are commonly known as binaries, as they contain machine instructions that function
    in this binary mathematical fashion.'
  merge: -1
