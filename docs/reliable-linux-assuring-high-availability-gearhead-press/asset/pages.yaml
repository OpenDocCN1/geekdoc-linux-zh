    # Backup and Restore Using Logical Volume Snapshots


    One useful functionality of the LVM driver is the ability to create snapshot LVs.
    (See the sidebar "How Snapshots Work" for more information.) They are designed
    as a solution to the backup consistency problem discussed in Chapter 7, "Backup
    and Recovery Strategies." Recall that backing up a live file system creates potential
    problems in the data in the file system may change over the time taken by the
    backup, hence it is impossible to create a consistent picture of the entire file
    system as it existed at one moment in time. There is thus no guarantee that data
    changed some time between the beginning and the end of the backup made into the
    backup. The only clear solution to this problem is to take the data out of production
    during the backup. This, however, means downtime, and in the case of large data
    structures that take hours to back up, significant downtime.


    Is there a solution? The Linux LVM offers the ability to make a snapshot of a
    production LV. The snapshot appears to be the backup application as a separate
    LV in the same VG as the production LV, except that all the data in the snapshot
    LV is frozen in time at the state the data was in the moment'
