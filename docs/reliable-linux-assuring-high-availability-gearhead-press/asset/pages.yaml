  md: '# Configuring the System Shutdown


    When running on the master server and informed of a power failure, upsmon first
    creates an empty file whose name is determined by the POWERDOWNFLAG parameter
    at line 14, then uses the command specified by the SHUTDOWNCMD parameter at line
    8 to start the shutdown. (Pay attention to the double quotes around the command
    string; see the sidebar, "UPS: Notes from The Trenches," for details.) When running
    on a slave server, upsmon uses SHUTDOWNCMD to initiate the shutdown, but does
    not create the flag file. Why the difference? On the slave servers, it is only
    necessary to shut down the operating system, after which the power will be cut
    off when the master server turns the UPS off. On the master server, then, there
    has to be some mechanism to turn the UPS off at the end of the shutdown, and that
    is the purpose of the flag file.


    Each Linux distribution handles the process of shutting the system differently.
    Red Hat uses the SYSVISINT system, derived from the method used by System V UNIX,
    one of the last AT&T Bell Labs produced. In this system a series of scripts executed,
    each of which stops a specific operating system utility. Then, the script /etc/rc.d/init/halt
    runs to shut down what is left of the operating system. The command to shut off
    the UPS must be inserted at the end of this script to complete the master server
    configuration. You will need to add a conditional clause that tests for the existence
    of the POWERDOWNFLAG file. If that file exists, then the shutdown in process must
    have been initiated by upsmon following a power failure. If POWERDOWNFLAG does
    not exist, then the shutdown in process was initiated by some other means and
    the UPS will not be touched. This is what the last lines of /etc/rc.d/init.d/halt
    look like:


    ```

    #1 Now halt or reboot.

    2 echo "message"

    3 if [ -f /fastboot ]; then

    4 echo "On the next boot fsck will be skipped."

    5 elif [ -f /forcefsck ]; then

    6 echo "On the next boot fsck will be forced."

    7 fi

    8

    9 HALTERS="-i -d"

    10 if [ -f /poweroff -o -1 -f /halt ]; then

    11 HALTERS=$$HALTERS -p"

    12 fi

    13

    14 if [ -f /etc/powerfail ]; then

    15 echo "Shutting down UPS now "

    ```'
