  md: '# All about Distributions


    You will find, however, that looking for Linux, you will not be able to choose
    a kernel version directly. Instead, your choice will be between distributions,
    otherwise referred to as distros. A distro is a packaging together of a particular
    kernel version along with the hundreds of utilities necessary to implement a functional
    Linux installation and support a variety of optional functionality.


    Some of these distros are put together by commercial companies, such as Red Hat
    and Caldera, while some are produced by volunteer effort, such as the Slack and
    Debian distros. Each distro has its own version numbering scheme, which doesn''t
    necessarily have anything to do with the kernel version it is built. The installation
    process of each distro varies, as does the version release level of the various
    utilities included in it. Servers running different distros can look surprisingly
    different from an administration point of view. Unless you have expertise in all
    of the peculiarities of one over another, it is preferable to pick one and stick
    with it. Too many different servers with different sets of idiosyncrasies will
    not keep your life simple or make for stable production.


    You will find that the commercial distros choose kernel versions for stability,
    and they tend to stay with them, even as they fall behind the leading development
    edge. Stability is favored over support for the latest gadgets, especially if
    uptime is a priority. In choosing a distro for a production server, I look for
    stability, ease of installation and software management, and good online support.
    In particular, a good mechanism for alerting me to newly discovered bugs or other
    problems with the distro that I should know about is critical. A quick and easy
    path to getting and installing any fixed or upgraded code is mandatory.


    Commercial distros also offer various forms of telephone or e-mail support, while
    the volunteer distros rely more on newsgroups or mailing lists. This is made of
    the fact that Linux is free, and it certainly is. Support for Linux is of course
    another matter. You have to make your own decisions as to whether you will support,
    and how much. You also have the opportunity to evaluate the quality of the support
    you get. Some will argue that the quality of support available from the community
    through mailing lists and newsgroups is as good as any of the commercial support
    channels. In its childhood, when Linux lived primarily in the academic community,
    my experience of this public forum support was very positive. I cannot think of
    any situation in dealing with a proprietary operating system- in which I was able
    to ask a question and have an answer returned to'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'me personally by the actual author of the source code. This happens daily in
    the open-source world. On the other hand, Linux enters the commercial arena, it
    remains to be seen how the public forum support model will hold up.


    This book does not recommend one distribution over another. You should, however,
    going armed with a checklist of what to look for in a good store. As you shop,
    you may find Eric Raymond''s Distributions HOWTO useful. It summarizes the features
    of all the major (and some minor) distros and includes contact information for
    the distributors. Eric tries to keep it up to date, and takes it out of circulation
    periodically to overhaul.


    # RPMs: Aren’t They for Car Engines?


    A Linux installation involves thousands of data files. Each distro uses some type
    of system for organizing these files into groups for software management purposes.
    Files are grouped according to the function they implement. Specific programming
    projects, which contribute a utility or group of utilities to a distro, normally
    drive the grouping. An example of a utility is lilo, the Linux boot loader, or
    dhcp, the Distributed Host Control Protocol (DHCP) server daemon. In a distro,
    each utility is packed into some type of compressed archive. A selection of these
    archives, which you choose to make your system are uncompressed and installed
    into the proper file system locations during the installation process. Each archive
    file is flagged with a version level of the code in it and, if necessary, cross-references
    information in other archives upon which it may depend. This functionality is
    commonly termed package management. The terms package and utility are essentially
    synonymous.


    Red Hat (and most of the other commercial distros) use RPM, the Red Hat Package
    Manager. RPM was developed by Red Hat, on an earlier management system developed
    by Doug Hoffman, Kevin Martin, and Rik Faith for BOG Linux, one of the first Linux
    distros. RPM is significant in that it goes beyond the task of simply organizing
    files for installation purposes. It actually tackles the problem of managing the
    source code, the binary code that from that source, the compilation procedure
    that produces the binaries from the source, and any other auxiliary files such
    as documentation or sample configuration files. In the open-source world, each
    function, service, or application is developed by a separate group of developers.
    Sometimes more than one implementation of a necessary function may be available.
    Without some kind of system to stan-'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'dardize a process amongst hundreds of projects and thousands of devel-

    opers, mayhem ensue.


    # How RPM Works


    Here is how RPM tackles distros. Let''s say I have written a utility for

    Linux that I want to package for distribution. Let us use the rpm command, sup-

    plying it with my source code, any patches required to the source, and an

    RPM spec file. This spec file defines everything necessary to build the util-

    ity (including any necessary commands to patch, build, and install the fin-

    ished binaries), descriptive information about the utility, and a list of all
    the

    files associated with the utility. The output of the rpm command will be

    two files, one called a RPM (or SRMP) and the other called the

    binary RPM. These files are in an RPM-specific binary format. The rpm

    command takes the source, patch, and build information and packages

    them inside the SRMP. Then, it compiles all the binaries for the utility and

    packages them inside the binary RPM, along with the file lists and the

    descriptive information. As a developer, I now release my RPMs on

    tworld.


    If you want to use my utility, you only download the binary RPM.

    You will use the same rpm command I used to build the package, but you

    will ask rpm to install rather than build. This will extract the binary, config-

    uration, and documentation files from the binary RPM and install them

    where the spec file used to build the RPM directs. To keep track of installed

    packages, rpm manages a database of all installed packages on your server,

    to which my utility will now be added. You can now use rpm to make

    queries on this database and keep track of which packages at what revision

    level are, or not installed on your system. Should a revision of an

    installed package become available, possibly implementing new function-

    ality (or more likely fixing bugs), but course this will never happen for

    my package), you download the new binary RPM and use rpm to update

    tinstalled package.


    Should you want to see the source code for the package, you would

    down the SRMP and install it. This gives you all of the source code

    files necessary to build the distro along with any patch or other build in-\mation.
    You can now hack my distro to your heart''s content, use rpm to

    build a new SRMP and binary RPM, and distribute them. Of course, if my

    distro had become popular, you would consult me about your alter-

    ations. Assuming I see your point of view, I would include your revisions

    in my own RPM distribution (giving you proper credit in the README

    file, of course).'
