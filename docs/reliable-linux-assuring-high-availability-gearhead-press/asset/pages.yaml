    and CPU overhead when running in a degraded state for RAID4 apply equally to RAID5.


    # Combining RAID Levels


    It is possible to combine more than one RAID level in a single device. One possibility,
    for example, is to combine performance and redundancy using a combination of RAID0
    and RAID1. The concept is really quite simple. In a two-stage procedure, you create
    two RAID0 arrays, and then com-bine them as a two-disk RAID1. The minimum number
    of disks for such an array is four. Figure 5.6 illustrates a six-disk example.


    This combined array gives good performance combined with red- dancy and with the
    same 50-percent space efficiency of a RAID1 array. Consequently, it is probably
    the most commonly seen level array. You could create a similar six-disk array
    but in the reverse order, first creating RAID1 mirror pairs and using them as
    three disks in a RAID0, as shown in Figure 5.7.


    As the RAID1 is created first, this array I termed RAID 1+0. So what is the difference
    between RAID 1+0 and the previous example, which I termed RAID 0+1. The difference,
    as it turns out, is significant. Look at the two figures and consider the effect
    of a single disk failure. If any disk in the RAID 0+1 array fails, one of the
    three disk RAID0 arrays will be out of commission because there is no redundancy
    within each of the three disk stripe sets. Thus, the RAID 0+1 array has only a
    single level of redundancy.


    On the other hand, if any disk in the RAID 1+0 array fails, there must be a mirror
    for it, and the array continues to function. Notice that a second disk could now
    fail. However, as long as it was not the mate of the first failed disk, the array
    would survive the failure and continue to function. In fact, as many as three
    disks could be dead at the same time, as long as there is only one bad disk in
    each RAID1 mirror pair. This is playing the odds to some extent, it yields something
    better than a single level of redundancy and with no cost in space efficiency
    over a simple RAID1.


    It is also possible to combine the striping performance of RAID0 with the checksum
    redundancy scheme used by RAID4 or RAID5. A RAID 0+5'
