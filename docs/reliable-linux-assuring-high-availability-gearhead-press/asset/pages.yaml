    Finally, there are cases in which your customer may have imposed a performance
    requirement on you. If you are unable to meet shipment times, for example there
    may be a penalty cost to you over and above the revenue lost for the late or missed
    shipment. A short interruption in your system may not push you into penalty zone;
    a longer outage may render you helpless to avoid the penalty. On the recovery
    side, the speed of recovery greatly affects the cost of the reliability solution.
    By duplicating components of the server and making extensive use of specialized
    hardware and software components, it is possible to build machines that can operate
    in the 99.9 percent availability range, but it is costly. A more reasonably priced
    solution can be created, but you will have to accept a longer time to recover.


