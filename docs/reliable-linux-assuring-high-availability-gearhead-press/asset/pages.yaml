  md: '# Logical Volume Management 329


    the snapshot was created. After the backup is complete, the snapshot LV can be
    safely deleted. During the entire backup cycle the production LV remains in production
    and is in no way affected by the creation or destruction of the snapshot.


    # HOW SNAPSHOTS WORK


    When a snapshot LV is created, PEs are allocated to the LV in the same way as
    any other LV; however, no production data is actually copied into the snapshot
    LV. Nevertheless, immediately after its creation, the snapshot LV can be accessed
    in read-only mode and all the data from the production LV can be read from the
    snapshot LV.


    But if no data is copied into the snapshot LV, how can this be? In fact, any data
    read request from the snapshot LV is simply diverted to the production LV and
    it is the production data that is read. This continues until a write occurs to
    the production LV. At that point, a copy-on-write operation is invoked. This means
    that a copy of the old version of the data in the production is written into the
    snapshot LV while the production LV is changed to its new values. Any subsequent
    read request from the snapshot LV for this specific data address will now be satisfied
    by the older version of the data that was copied into the snapshot LV and not
    from the current production LV version. If this data address were to be requested
    from the production LV, the current version of the data would be returned.


    To make this work, the snapshot LV has to keep track of which data addresses have
    changed since the snapshot was taken, as this list determines whether the snapshot
    LV will return data from its copies for data that has changed since the snapshot
    was taken, or from the production LV if the data has not changed since the snapshot
    was made. This metadata is persistent, thus snapshot LVs will continue to function
    across a reboot. When creating a snapshot LV, you only need to allocate enough
    space to accommodate the amount of data that will change in the production LV
    during the lifetime of the snapshot. You can monitor how much of the space in
    the snapshot LV has been used with the lvdisplay command. Look for the line labeled
    "Allocated to snapshot," as shown in the example in the Using Snapshot section
    in this chapter.


    It is important that the snapshot LV does not become full; otherwise it must be
    disabled. If it is hard to estimate how much of the production data might change,
    as it may well be, you can always make the snapshot LV the same size as the production
    LV, provided that you have enough unallocated space in the VG.'
