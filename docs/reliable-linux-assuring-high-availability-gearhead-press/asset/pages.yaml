  md: '# PostScript A proprietary page description language developed by Adobe Systems.
    PostScript allows an application program to describe the exact appearance of a
    printed page of output in a language not specific to any printer. A PostScript
    printer must read and translate the instructions in the PostScript data file to
    instructions that the printer requires to create the desired output. PostScript
    has become a de facto standard in the desktop publishing and graphics industries.


    Pretty Good Privacy An open source implementation of an asymmetric key encryption
    system specifically oriented towards securing email. PGP has a colorful history
    of legal actions, concerning the legality of exporting encryption software from
    the United States or Canada, and also questions concerning patents held on several
    relevant encryption algorithms. PGP has weathered all these storms and is currently
    one of the more popular email privacy packages.


    Random Access Memory The physical memory storage that is used by the CPU to store
    all binary and application data that it needs to operate on. RAM is volatile;
    anything stored in RAM will be lost if the computer loses power. However, a special
    type of RAM known as NVRAM can retain data over a power loss.


    Red Hat Package Manager A package management system allowing source code for a
    program to be packaged with compiled binaries and the instructions for compiling
    them. It incorporates a database to track versions, as well as verifying the names
    of the files in a package and the data integrity of those files.


    Request for Comments The documents managed by the Internet Engineering Task Force.
    In 1969 the originators of today''s Internet started a series of collaborative
    notes that become what is in a set de facto standards for a wide range of Internet-related
    technical issues. The definitive collection of RFCs is maintained at www.rfc-editor.org.


    RFC See for Comments.


    root file system The file system is the first mounted during the boot process.
    It contains the top-level hierarchy of the logical file system structure, and
    also the majority of the operating system configuration data.


    root user UNIX has always relied on a special user account that is not subject
    to any security restriction as it''s a top-level administrative account. The person
    holding the password for this account is termed the super user; the actual login
    name for this account has traditionally been root, although strictly speaking
    super user privilege is given to any user account assigned the numerical ID 0.


    rpm See Red Hat Package Manager.'
