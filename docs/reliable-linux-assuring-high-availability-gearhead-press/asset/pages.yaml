  md: '# Monitoring Daemons


    Linux, like all variants of UNIX, relies on the concept of the daemon process.
    A daemon is a process that runs all the time and supplies a basic functionality,
    either at the operating system or application level.

    A problem at that occasion arises is that a daemon process for some reason dies
    and cannot be restarted. Consequently the service daemon provides is not available,
    which has a domino effect on any other application that needs service.(A daemon
    can also enter a race condition in which it runs out of control, consuming memory
    or CPU at random hurtful to the rest of the system. That condition would be caught
    by the CPU or memory monitor I just presented.) A monitor for daemons can assist
