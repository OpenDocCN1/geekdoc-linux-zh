    of flexibility, and imposes few limitations on you.


    # About Partitioning and File Systems


    The first major decision you are faced with in the installation process concerns
    partitioning. Red Hat offers three different broad options early on in their installation,
    a workstation, server, or custom installation. Both the workstation and server
    installs make assumptions regarding disk layout and installed packages. The custom
    option allows you to partition the disk yourself, and decide which file systems
    will go in which partition. To do this, you need to know where specific information
    is located in the Linux directory tree and what partitioning layout will minimize
    your data liability.


    # The Titanic Principle


    The simplest possible Linux installation involves only two partitions. One is
    required for swap space and for everything else—operating system files, applications,
    and data files. If you choose the server installation option when installing Red
    Hat Linux, however, you will find that the installed system has several partitions.
    A separate partition is created for the contents of /, /boot, /usr, /home, and
    /var. Why? It''s what I call the Titanic principle. The RMS Titanic was constructed
    using a series of watertight compartments that if any one compartment were to
    be flooded, the watertight doors could be closed and the flooding restricted to
    only that local compartment. Any equipment in that compartment would be at risk,
    but the remainder of the ship would be protected.


    In the same way, dividing the operating system into sections and placing each
    of them in a different partition prevents a file or directory from growing uncontrollably,
    absorbing all of its available disk storage, and thus causing a crisis for the
    operating system. Each of the individual partitions is still at risk. However,
    if any one of them fills, the operating system or application function using that
    partition will be affected, but the operating system should remain functional.


    That anyway, is the theory. Tragically, history reminds us that the theory did
    not successfully translate into practice in the case of the Titanic. What went
    wrong? A consecutive series of compartments flooded simultaneously, one overflowing
    into the next, dragging the ship down to its death. In the case of disk partitioning,
    it is impossible for data to overflow from one partition into another, should
    a partition become full. This is good, and it would appear that the Titanic principle
    should keep us safe from disaster.'
