    will be happening on a constant basis. For acceptable RAID performance, it is
    necessary to place a data disk on a different controller than its mirror, which
    again requires one drive per controller.


    A solution to this is to look for a motherboard having more than two controllers.
    Such boards do exist, and are not overly expensive. You have to go looking for
    them, however. Some may offer two controllers supporting the ATA/33 standard and
    two supporting the ATA/66 or ATA/100 standard. The 66 and 100 refer to a data
    transfer rate of 66 MB/s and 100 MB/s respectively. Be in order to get these speeds,
    you will need compatible drives. These rates are defined in the ATA-4 and are
    significant in that they need an 80-conductor cable for the drive to the controller,
    unlike the normal 40-conductor ATA cable. In an emergency, it is possible to successfully
    mix and match or order drives and cables, but there is a forest of pitfalls if
    you get the wrong combination of drive, controller, and cable. Make sure you read
    your drive, motherboard, and ATA references so that you know what you can or cannot
    with your hardware before you have a problem!


