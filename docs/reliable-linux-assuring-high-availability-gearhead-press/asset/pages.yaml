  md: '# Backup and Recovery Strategies 277


    dump level or the date in the label, as *dump* will add this information to the
    archive file header anyway. It is useful to add the host name, as *dump* does
    not include that in the header.


    # Useful dump Options


    You should be aware of a few other options to *dump*. *dump* tries to estimate
    the size of the data being dumped and compare it to the tape storage capacity.
    If the size of the dump will exceed the tape storage, *dump* will break the archive
    into volumes sized to fit the tape. As most current tape drives support compression,
    this does not work well as the capacity of the tape will vary on how efficient
    the compression is. Consequently, it is better to let *dump* write until it reaches
    the end of the tape, and then start a second volume if necessary. You need to
    use the *-a* option to tell *dump* to behave in this fashion.


    When building an automated backup system around *dump*, the -F option may be handy.
    This option causes *dump* to run a script at the end of each tape. The device
    name and the current volume number are passed to the script on the command line.
    The script should return 0 if *dump* should continue without asking the user to
    change the tape and 1 if *dump* should continue but ask the user to change the
    tape. Any other exit code will cause *dump* to abort. This would be useful as
    means of sending an email or a page to an operator when a tape needs changing.
    The -n option may be useful in this case. With this option specified, all users
    in the group operator are notified by means similar to the wall command whenever
    dump requires operator attention.


    You should note that *dump* requires operator intervention at end of tape and
    end of *dump*, and on a tape write error, open tape error, or disk read error.
    *dump* interacts with the operator on its control terminal in situations when
    *dump* can no longer proceed or if something is grossly wrong. All questions *dump*
    poses must be answered, which means that the absence of an operator to say yes
    or no at the terminal will hold up the dump indefinitely. *dump* checkpoints itself
    at the start of each tape volume. Should writing that volume fail for any reason,
    *dump* will, with operator permission, restart itself from the checkpoint after
    the old tape has been rewound and removed, and a new tape has been mounted. *dump*
    tells the operator what is going on at periodic intervals, including (usually
    low) estimates of the number of blocks left to write, the number of tapes that
    it will take, the time to completion, and the time to the next tape change. The
    output is verbose so that others know that the terminal controlling *dump* will
    be busy for some time.'
