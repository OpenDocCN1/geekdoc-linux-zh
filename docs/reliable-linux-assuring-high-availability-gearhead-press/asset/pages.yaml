  md: '# Linear Tape Ocean (LTO):

    nThe New Linear Tape


    LTO is a joint development of Hewlett-Packard, IBM, and Seagate. Released in 1998,
    it is designed to be an open standard, available to OEMs at a nominal cost. The
    hope is that this new standard can cut across the proliferation of existing linear
    and helical scan technologies, and perhaps bring some simplification to to the
    field of tape storage. LTO, as the name implies, is a linear format, but it has
    distinct flavors—one built for speed, the other for capacity. The Accelis version
    uses a dual reel cartridge, QIC and the helical scan tapes, uses a mid-loading
    design borrowed from IBM’s mainframe tape storage products. In this design, the
    tape is always left exactly halfway through with one half of the total tape length
    on each reel before it is ejected from the drive. That way, when the tape is inserted,
    access to any random point on the tape is minimized, as the tape need not always
    start from the beginning. Mid-reel loading coupled with the serpentine data path
    characteristic of linear tape drives allows data to be extracted from the tape
    quickly, making Accelis suited to data warehouses using tape storage.


    The Ultium flavor of LTO uses a single reel cartridge, like DLT, and for the same
    reason, to maximize the storage capacity of each cartridge. To allow for more
    tracks, Ultium tape is a full half-inch wide, compared to Accelis’s 8 mm tape
    width. The first generation Ultium cartridge has a capacity of 100 GB and supports
    a transfer rate of 10 MB/s. The Accelis stores 25 GB and gives the same transfer
    rate as Ultium. Ultium is ultimately slated to support 800 GB cartridge capacities
    and Accelis, 200 GB with transfer rates in excess of 80 MB/s. LTO drives usually
    use a SCSI interface, with Fibre Channel interfaces available on tape library
    units.


    One interesting feature of the LTO cartridge is LTO-CM. This is similar to the
    embedded NVRAM chip featured in Sony’s AIT helical scan tapes. Like the AIT chip,
    the LTO-CM chip stores calibration information, manufacturer’s data and initialization
    information. Unlike AIT, LTO-CM has less capacity, 32 KB versus the 64 KB in the
    AIT tape, and it uses a passive radio frequency (RF) interface, allowing the chip
    to be read by a noncontact reader external to the drive itself. Hence tapes can
    be scanned by an operator prior to insertion, and without taking up a drive in
    the process. This kind of functionality is clearly directed towards large data
    installations, where LTO will be a major player. You can track the state of the
    LTO art at www.lto-technology.com.'
