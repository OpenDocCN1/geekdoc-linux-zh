  md: 'I''ve written this HOWTO in the form of a seven-point checklist. When you can
    check off all seven steps, you''re done.


    +   Make a list of computer-dependent business functions, prioritized by downtime
    impact. A business function might be something like billing, new order, online
    sales, or customer followup. You prioritize by determining how long you can be
    without this function before it starts costing you. For example, online sales
    or new order entry would be a high priority. Any downtime at all could cost you
    a sale. Billing, while obviously important, could probably be deferred until tomorrow
    with little cost, as long as you have a good contingency system to make sure you
    don''t miss sending out bills altogether. Customer followup may not be time critical
    either, unless you are primarily a service-based business that depends on fast
    customer response


    One quick way to build a list of computer-dependent functions is to ask each of
    your employees to write on a sticky note the top three functions that take up
    his or her time in an average working day. Add to each note your assessment of
    the time and revenue priority of each of these functions. If you can, try to assign
    an amount of time you can survive without the function being performed before
    it costs you money. Now stick all of these notes on a wall and compile an ordered
    list of all the functions putting the ones that have the highest time assessments
    at the top of the list.


    It is also interesting to try to estimate for each function the amount of money
    it would cost the function be unavailable. Time can play tricks on you here. It
    may be that a short disruption, an hour or so may, may have negligible effect.
    Remember, though, how costs escalate as the period of downtime lengthens.


    +   Identify the data you need to keep critical business functions going. By data
    I mean the applications'' binary code as well as production data. You should be
    able to list actual data names and names of application configuration files on
    each server you manage. List them in the same priority sequence as you manage.
    If you are managing well-structured applications that were installed properly,
    most if not all of the code for each application will be in a single directory.
    Likewise, well-structured data is contained in as few directories as possible,
    ideally only one per application. Take care not to overlook small configuration
    files that may be in a system generic directory such as /etc.'
