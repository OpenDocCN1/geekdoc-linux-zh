  md: 'size and number of files in the file system. As the stability of the Linux
    port is proven, the strengths of XFS as they are apparent on IRIX should become
    available to the Linux world too. Here is a list of the strong points of XFS:


    +   - XFS is a 64-bit file system implementation that makes use of B-tree indexing,
    variable data block sizes, and space assignment by extents to scale to large data
    storage needs while retaining good performance. XFS has demonstrated single file
