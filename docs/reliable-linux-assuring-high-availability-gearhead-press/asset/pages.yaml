- img_proc: true
  md: '# The Importance of Backups


    Even if you implement multiple redundant hot disks, it is critical that you include
    a comprehensive backup policy. Disk crashes are not the only source of data loss.
    Problems in the operating system or applications can damage or destroy data. Operational
    errors can all too easily cause data loss also. It may be necessary to maintain
    historical snapshots of data for accounting, legal, or tax purposes. Finally,
    an off-site backup is essential for your protection in case of a large-scale site
    loss.


    # Server Clusters


    A broader approach to protecting against disk failure is server clustering. This
    involves grouping several servers together with a connecting management infrastructure,
    the objective of the cluster being either high-speed parallel computing or redundancy
    for high availability. A simple cluster would be a pair of servers, typically
    one production machine and a warm standby. Software runs on both machines to detect
    the failure of any functionality, upon whose recovery procedure is started. Disk
    storage is usually shared in some way between the machines so that, should the
    primary production server fail, the warm standby would be able to take over the
    disk from the failed production machine and bring the data back into production
    ASAP.


    This is a complex technology with the greatest challenge to its success being
    the ability of the application to inherit data from a failed machine and be able
    to successfully use it. There are a number of competing server cluster implementations
    available for a Linux server farm. I''ll be examining them in Chapter 10, “Server
    Clustering."


    # Keeping Your Cool


    Next to disk failure, overheating due to cooling failure is probably the next
    major hardware concern. Most servers have at least two, often more, cooling fans
    that run 24 hours a day, seven days a week. They can and do fail, leading to potentially
    damaging in-case temperatures.


    # Good Maintenance Is Cheap Insurance


    One of the most obvious things you can do that I often see overlooked is to enforce
    good maintenance practices. Not all fans are inlet fans, some are designed to
    exhaust and don''t usually have filters. Cooling fans that work'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Planning for Reliability


    drawing air into the case are normally fitted with filter screens to catch dust.
    These screens must be cleaned at regular intervals or they will clog up and reduce
    the effectiveness of the fan. This is such a simple thing to do; yet it is often
    overlooked. Fans that operate by exhausting air from the case are often fitted
    with a coarser screen, which is less likely to clog. In this case, there commonly
    no provision for filtering the air drawn into the case, so dirt and dust build
    up inside the case. I am less happy cleaning inside cases than I am an externally
    accessible filter screen. Any thing that has the potential to disturb the hardware
    in the case is trouble in the making. I know of several large-scale computing
    board and case designs that have known weaknesses in terms of being sensitive
    to disturbance. If they are running fine and you don''t touch them, you have no
    problems.


    # Building a Server Room


    If you find a lot of dust building up in cases or plugging fans, maybe you need
    to examine the server room environment. You do have a server room, don''t you?
    Even in a small server installation, it is worthwhile to locate the server in
    its own space. The air supply can be properly filtered and regulated, and it is
    generally easier to control temperature and humidity in a smaller room than a
    larger one. Should the building air conditioning fail and the temperature in the
    server room climb to 120 degrees, you may still have a temperature problem, even
    if none of the server cooling fans fails. A small, self-contained, reasonably
    inexpensive air conditioning unit may be all it takes to keep those servers cool
    and running, even if you have to sweat it out in the main office.


    Water is another consideration in terms of where to put a server. Any location
    that is below grade should be avoided, if possible. Water has a funny habit of
    finding holes in the ground, and if you put your server in a hole in the ground,
    there''s a good chance some water might find it one day. I''m not necessarily
    thinking about a large-scale flood, either. All it takes for a toilet to overflow
    two floors up on the weekend for enough water to find its way downwards to cause
    grief. The top floor of a building is also not ideal, especially if the building
    has a flat roof. A good friend of mine gave me the same advice when I was looking
    for an apartment. He had once worked for a property management company that operated
    a number of high-rise apartment towers. He observed that many top floor penthouses
    were strongly prone to leaky ceilings, as flat roofs are notoriously difficult
    to seal perfectly.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Risk Analysis 25


    If you are working in a larger-scale server installation, you may consider a raised
    floor, machine room style environment. The Uptime Institute (www.upsite.com) has
    developed a four-tier system for classifying machine room environments. A tier
    one environment is associated with uptimes of 99.8 percent, and is estimated to
    cost $400 per square foot of floor area. At the top of the scale, a tier four
    installation is expected to support 99.991 percent uptime, at an estimated cost
    of $1,000 per square foot. This is overkill for small to mid-sized PC server installations
    today. It would only be justifiable for large, multiple server installations or
    in situations where an existing machine room designed for a previous generation
    of computing technology is still in service, and you can take advantage of the
    excellent environment it will provide. I do want to make the point, however, that
    the server critical to your corporate mission deserves a decent home and will
    benefit from its reliability.


    # Fan and Temperature Monitoring


    Many motherboards now support built-in onboard sensors to monitor CPU temperature,
    fan speed, or case intrusion. Many of these devices use a standard two-wire bus
    known as the i2c bus. There is good Linux support for this bus in the 2.4 kernel,
    and there are applications available to enable you to read these sensors and monitor
    them. Systems administrators can write scripts to trigger alarms, initiate shutdown,
    or start fail processes in the event a fan fails or temperatures rise beyond dangerous
    levels. This kind of functionality was previously associated with expensive large-scale
    class servers. Today these sensors are available on low-cost, mass-market motherboards,
    and are well worth the small effort it takes to identify them and use them.


    Of course it never hurts to have two of everything, and fans are no exception.
    Unless noise is a factor, I usually like to see as many fans in a server as can
    be fitted. Most cases are supplied with mounting for extra fans. Since fans are
    cheap, I take the opportunity to fill every fan hole with a fan unit.


    # Keeping the Power Flowing


    A stable and reliable supply of electrical power to your site is clearly a necessity
    for a reliable server. Unfortunately, you may have less control over that than
    you might like. Should you have the luxury of deciding the geographical location
    of your servers, reliable power is going to be one'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'of your top considerations. There are of course many other factors that come
    into play, and in reality you may find yourself in a location that regularly experiences
    power shortages or outright outages. I live in a northern location in which several
    outages during the winter months are a certainty and must be planned for. An uninterruptible
    power supply (UPS) is a must in these cases, and there is good Linux support for
    a number of the most popular UPS units.


    In a larger size, you may also put in place backup power from your own generator.
    Installing such a generator is beyond the scope of this book, but realize that
    in the case of a fail over line to generator, there is almost always a dip that
    needs to be smoothed over. Generator power may also not be as stable as line power,
    even though you have your own power you should need it, a UPS is still a requirement.


    # Dealing with Network Failures


    A network failure may be either internal or external to the server. From a hardware
    point of view, the Network Interface Card (NIC) could fail, as could the physical
    cable connection. The NIC is a solid-state device, the likelihood of failure is
    small, but you may not wish to overlook it. It is possible to install a duplicate
    warm standby NIC in the server, although there are problems with this approach.
    The Linux clusters I''ll be presenting in Chapter 10 implement monitor code designed
    to isolate things like a NIC failure and initiate a recovery process. In practice,
    however, it is more likely that a server is isolated from the network as a result
    of a problem originating on the network rather than a problem local to the server.


    # Labeling Cables


    I cannot suggest strongly that you are positively religious about labeling cables.
    If you suspect a cabling problem and you have no labels, the likelihood of unplugging
    the wrong cable and making things worse is just far too high. Commercial adhesive
    wire label books are available at any industrial electric supply, and are well
    worth the investment. I have stood by many sites watching people plugging and
    unplugging cables trying to isolate a fault by trial and error. The few minutes
    and dollars it takes to put some labels when you install the cable can pay off
    enormously months from now. The other critical element of a well-managed physical
    network is a complete and up-to-date topology diagram. When I teaching networking
    classes, I ask the question, “How many machines does it take to make a network?”
    The answer I''m looking for is two. If you have'
