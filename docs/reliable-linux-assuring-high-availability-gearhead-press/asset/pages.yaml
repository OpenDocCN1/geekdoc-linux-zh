  md: '# Installing and Configuring for Reliability


    Once the jobs are scheduled, you can view them with the atq command, like this:


    ```

    atq

    4   2001-04-10 02:00 a root

    5   2001-12-20 10:00 a root

    6   2001-04-10 01:51 a root

    ```


    Finally, to remove a scheduled job before it, use the atrm command—referencing
    the job with its number, the first field in the atq output, like this:


    ```

    atrm -6

    ```


    It is important to realize that any of the commands you specify in the script
    file will run in the default /bin/sh shell. Unless you redirect output in your
    script, all output will be mailed back to the user who scheduled the job. The
    shell environment the job run in is the same as in effect at the time the job
    was scheduled. If any of these things prevent your script from running properly,
    you will have problems, so check it out.


    It may be that you want to run a script not just once, but at regular intervals,
    every Saturday at 2:00 A.M., or every weekday at noon. That you need the repeating
    version of at, which is cron. A cron job is defined by adding the name of the
    script to be executed and the execution time information to a crontab. Each user
    may have a private crontab. crontabs are managed by the crontab command, using
    the -e flag to edit, the -l flag to remove the crontab. A typical crontab looks
    like this:


    ```

    crontab -l

    # DO NOT EDIT THIS FILE - edit the master and reinstall.

    # (/tmp/crontab.v 8676 installed on Tue Feb 20 13:10:51 2001)

    # (Cron version -- $ID: crontab.c,v 2.13 1994/01/17 03:20:37 vixie Exp $)

    10 5 * * * /usr/local/bin/backup.tuk.weekly

    30 2 * * * /usr/local/bin/backup.tuk.daily

    ```


    The crontab is stored by the system as a file in /var/spool/cron (another directory
    in the /var file system that needs to be included in your backup policy). Each
    uncommented line in the crontab represents one task. Of the six fields in each
    line, the first five specify the time of execution, while the last specifies the
    name of the script or command to be executed. The five time fields represent the
    minute, hour, day, month, and day of the week. An asterisk in any field implies
    all possible values, and the days of the'
