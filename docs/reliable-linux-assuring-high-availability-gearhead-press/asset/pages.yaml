    fully embrace the 64-bit address space of the Itanium processor, these limits
    can be expected to grow.


    # LVM Management Tools


    It is necessary to include in any LVM implementation a set of tools to create
    and manage the different elements of this structure. A good set of tools brings
    out the real utility of the concept, and the Linux LVM implementation is well
    equipped in this respect. These tools are available to create, list, and delete
    PVs, VGs, and LVs. These requirements are basic to any LVM implementation. Your
    distribution may include these tools. If it doesn''t, you will need to download
    the source code from www.sistina.com/lvm and build them yourself.


    In addition, these tools support dynamic modification of all these entities. By
    dynamic I mean that many significant attributes of the LVM data entities can be
    modified while the server is in production with minimal data downtime. Logical
    volumes, for example, can be expanded or reduced in size while the data they contain
    is in production. It is significant as it allows a high degree of flexibility
    in altering the disk storage element of a server with minimal downtime. It also
    gives the system administrator more tools to deal with unexpected situations,
    like data that grows more quickly than anticipated or an application that turns
    out to require a faster disk or different data layout than was originally planned.


    Without LVM, administrators faced with these situations are forced to improvise.
    File systems are extended by resorting to using symbolic links to point to further
    disk partitions. Significant disk restructuring can involve all-night backup and
    restore sessions, which in turn involves server downtime, expense, and servers
    built in time-constrained situations that yield a solution that is the best compromise
    between good design and expedience.'
  merge: -1
