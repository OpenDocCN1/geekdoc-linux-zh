    # Hardware Monitoring


    Having taken some care in choosing a good CPU cooler and case design, how do I
    know that they are doing their job and keeping critical temperatures under control?
    How do I know if a cooling fan has failed, or a heat sink has blocked and my CPU
    or drive bay temperatures are climbing? Should a CPU fan slow or stop this be
    a nasty thing, because of what happens to the CPU as it overheats? If the CPU
    simply failed entirely, it would be bad enough. In fact what happens is that the
    CPU starts to malfunction, but not necessarily fail altogether. for some time
    causing application errors and possibly damaging your data before it eventually
    crashes the operating system and brings the server down.


