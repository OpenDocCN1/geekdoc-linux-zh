  md: '# About the Author


    Iain Campbell is a mechanical engineer by profession, graduating in 1986 from
    Ryerson Polytechnic Institute in Toronto. After a year in the manufacturing industry,
    Iain returned to Ryerson as an engineer on the staff of the Institute’s Centre
    for Advanced Technology Education (CATE), where he spent nine years working in
    manufacturing automation, computer aided design, and industrial robotics. Much
    of the engineering and analysis software he used ran on Sun or IBM UNIX platforms;
    and as few others knew much about it, he began to draw him deeper, and by the
    end of his time at CATE he was coding in C, building kernels, and teaching UNIX
    systems administratration, and teaching UNIX systems administration for Sun Microsystems
    and IBM. He left the University in 1996 to form his own company and now teaches
    and consults for IBM and other clients.


    Iain started using UNIX-based systems and cruising the Internet in the late 1980,
    and can remember being without email for several days when an infamous worm made
    the rounds. When he tried to tell the term email explained. He had his first exposure
    to Linux several years later and can recall wheeled a PC down to the Electrical
    Engineering department network and installing a Slackware distribution using kernel
    version 0.99. The most fun he ever had with UNIX was building a manufacturing
    cell that was remotely programmed and operated from a distance of several miles.
    The whole cell was controlled by an original IBM PC fitted with a multiport serial
    card and running QNX, a real-time UNIX-like operating system.'
  merge: -1
