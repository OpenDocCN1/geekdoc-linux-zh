- img_proc: true
  md: 'It is also necessary to document each site in detail. A typical smaller-scale,
    detailed diagram would look similar to the one shown in Figure A.2. I have given
    as a sample topology diagram for one of the warehouse locations. am constrained
    due to space in a book format; your diagram will be much larger and contain more
    detail. The more, in fact, the better. Your diagram should include each piece
    of equipment in the building, including not only servers, but also network hubs,
    modems, routers, printers, and UPSs as well. Every item necessary to keep the
    infrastructure functioning needs to be on the diagram. For each piece of equipment,
    list:


    +   - A functional description (for example, print server or railroad LAN hub)
    and the physical location of the equipment

    - Make, model, serial number, and property tag number

    - Operating system type and revision, as applicable

    - Network addresses, as applicable


    Each data connection should also be clearly indicated. The type of connection
    and cable should be labeled (for example, RS 232 or CAT5). Each network cable
    should be physically tagged with a number at both ends, and that number kept up-to-date
    on the diagram. This can be invaluable when debugging wiring problems or when
    restructuring new equipment comes in.


    Starting from this scenario, here is how your BR planning would unfold, based
    on the BR Plan HOWTO found in Chapter 1, “Business Recovery Planning."


    # Step 1: List Business Functions Prioritized by Downtime Impact


    Start by dividing your efforts over the three working sites: Head Office, Warehouse
    A, and Warehouse B. For each site, the critical business functions must be identified,
    and a downtime cost estimate prepared. Each location, hold meetings with the managers
    and supervisors. Build a list of the major business functions performed there,
    and for each function estimate the cost that should be unavailable as a result
    of computer downtime. Tabulate costs for several periods of downtime in order
    to take into account the tendency for cost to escalate as downtime periods increase,
    as noted in the text. You can use the sample given in the sidebar “How Much Is
    This Going to Cost Me?” in Chapter 1 to get you'
