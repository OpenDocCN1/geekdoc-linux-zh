    We have seen that in theory the idea of VG is to create a storage pool of PEs
    that can be assembled flexibly into LVs at will, independent of which PV the PEs
    actually reside on. Keeping the future in view, however, it may be that you would
    prefer to keep some LVs together on one or two disks of a VG rather than allow
    them over time to spread out over multiple PVs. There are several reliability
    advantages to this:'
  merge: -1
  pgno: 337
- img_proc: true
  md: 'The risk of data loss due to hardware failure rises as the allocation of an
    LV spreads across multiple PVs, the loss of any of the PVs holding allocations
    for the LV will cause some data loss in the LV. If an LV spread across four PVs,
    the loss of any of the four would cause the loss of fully one quarter of the PEs
    of the LV. Because the LV is presented to the application or file system as a
    single storage entity, the application has no way of determining which quarter
    of its storage has been lost, so cannot recover from such a loss. It would appear
    to the application as if quarter of its disk storage blocks had suddenly gone
    bad. Thus, there is a 10 percent probability that any failure in the four PVs
    will render the distributed allocation LV useless. On the other hand, if the LV
    is centered onto only one of the four PVs in the VG, then there is only a 25 percent
    chance that a PV failure in the VG will affect that LV.


    Concentrating the allocations of an LV onto a minimum number of PVs means that
    the LV can be moved from one server to another easily. If all of the PVs in a
    VG are mixed together all of the PVs in the VG, then it would be difficult to
    separate one particular from the rest in case it needs to be moved to a backup
    server. In all likelihood you would need to move the entire VG.


    If you want to split a VG into two VGs in the future, keeping LV allocations together
    as much as possible on one or two PVs will reduce the amount of data shuffling
    necessary when you want to do the split. (The next section of this chapter covers
    splitting and joining VGs.) That translates to a faster and easier restructuring
    process, meaning less source of error and less reconfiguration downtime.


    Allocation of PEs for an LV to a particular PV can be requested using this form
    of lvcreate:


    ```

    # lvcreate -l 1 -n LV03 VG01 /dev/sdb1

    lcreate -- doing atomic backup of "VG01"

    lcreate -- logical volume /dev/VG01/LV03 successfully created

    ```


    Using the ldisplay command, we can show that the PEs were indeed allocated to
    the second PV of the VG:


    ```

    # ldisplay -v /dev/VG01/LV03

    --- Logical volume ---

    LV Name --- /dev/VG01/LV03

    ```'
