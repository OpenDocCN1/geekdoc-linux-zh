    system metadata structure, but as you cannot trust the integrity of the files,
    it would be dangerous to put that file system back into production. You could
    wind causing more problems than you solve.


    There is a way to protect yourself in such cases through the use of journaling
    file systems rather than the ext2 file system. Chapter 9, “Alternative File Systems,”
    presents several options for a Linux journal file system.


