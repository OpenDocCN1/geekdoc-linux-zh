- img_proc: true
  md: 'I am inclined to think that for small and medium sized backup applications,
    these optical devices may give tape a serious challenge. You can follow this technology
    at www.dvrw.com. News about other optical storage developments can be found at
    www.osta.org, home to the Optical Storage Technology Association.


    # Removable Disks


    One option you may want to consider is a removable disk storage medium. The earliest
    versions of these devices were typically based on a floppy disk drive, with increased
    capacity. While the capacity of these drives was usually less than adequate for
    backing up a whole server, they could be very convenient for backing up small
    amounts of data or transporting data from machine. The current generation of removable
    drive has now broken the 1-GB barrier, however, with further increases in capacity
    promised. While even higher capacity units are not in the large scale backup market,
    they might we very practical for a small to mid sized server. Iomega have recently
    introduced their Peerdrive, which has a single cartridge capacity of 20 GB and
    transfer speeds up to 15 MB/s. As this is primarily intended as a dynamic data
    device rather than an archive device, it supports PC interfaces including USB
    and IEEE 1394 (better known as FireWire or i.Link), as well as a SCSI option.


    Removable disks offer the advantage of fast and convenient access to data, unlike
    tapes that need to search for a file within an archive and then extract it. Removable
    drive cartridges are typically more fragile than a tape cartridge, as they contain
    a modified hard disk, although the current generation of removable disks advert
    significant resistance to damage. The USB and FireWire versions would then be
    hotgable, which is a bonus. On the down side, the drive draws power from the host
    machine, limiting its scalability.


