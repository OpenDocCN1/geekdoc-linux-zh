    Again, note the comment regarding passwords. The central function of upsmon is
    defined by line 5, which tells upsmon that host 192.168.1.200 is the master server
    connected to the UPS named apc700. Once started, upsmon polls the upsd running
    on 192.168.1.200 at frequent intervals to determine the current power status.
    If it is told that the power has failed, upsmon immediately begins to shut down
    the host it is running on. If upsmon is running on a master itself, it should
    behave slightly differently than if it is running on a slave server. If a slave
    server, the shutdown will start immediately upon notice of the power failure.
    In this case the last field of the MONITOR line will say slave rather than master.
    On the master, the shutdown should be delayed until any slaves have had the opportunity
    to shut down, when the master shutdown commences. This is as important as the
    UPS will be turned off by the master at the end of the master shutdown process,
    and without delaying the start of the shutdown on the master, the slaves may not
    have had time to completely shut down when the UPS is powered off. The fourth
    field of the MONITOR line, beach in this example, is the password specified in
    the master server upsd configuration file for the ACL upsmon host must be a member
    of. If the shutdown of any of the slaves hangs up, the master cannot wait for
    to shut down or the UPS battery will run out. Line 12 uses the HOSTYNC parameter
    to specify in how long the master will wait for the slaves to log out before it
    starts to shut down away.


    The third field of line 5, the numeral 1 in this example, specifies the number
    of power supplies that the UPS on the server 192.168.1.200 supplies on the system
    running upsmon. This would come into play where a server has multiple redundant
    internal power supplies, each of which is supplied by a separate incoming power
    line, each protected by separate UPSs monitored by separate nut servers. This
    of no single point of failure system is not uncommon for large server installations.
    A separate MONITOR line would be required for each of the nut servers. This parameter
    will be one where servers have a single incoming power source. The MINSUPPLIES
    directive at line 7 is related to this, specifying for a multipower supply the
    minimum number of supplies necessary to keep the server going.


    Note that lines 5 and 6 are in the essence same thing, and sandbox is in fact
    192.168.1.200. I have commented out the version that has a hostname, however,
