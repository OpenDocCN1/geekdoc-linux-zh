  md: '# External Power


    The first consideration in terms of external power is to accept that the grid
    supplying power to your site will at some point fail. It may fail to supply power
    at all, or fail to maintain power at the normal levels. Power outages could last
    for only a moment, or for periods of minutes, hours or in the worst case, it is
    also possible to get too much power in the form of a spike. Spikes are as certain
    as outages, though less noticeable. They have the potential to be worse than outages
    because the chance of physical equipment damage is greater in the case of a spike
    than an outage. Although spikes and outages are different problems, the solution
    to both turns out to be the same: an uninterruptible power supply.


    # Uninterruptible Power Supplies


    An uninterruptible power supply (UPS) is a device placed between the incoming
    external power supply and the server''s internal power supply. It acts rather
    like a large sponge. Under normal conditions, power flows from the outside into
    the sponge and out the opposite to the server. Should a surge (a mild, short-lived
    increase in voltage) or a spike (a short, severe increase in voltage) appear at
    the input to the sponge, it soaks up the excess power and stores it, allowing
    only the steady flow of power that the server needs to leave the outside of the
    sponge. Should the input to the sponge experience a sag (a short, mild reduction
    in voltage), brownout (a sustained reduction in voltage), or blackout (sudden
    and total failure), the sponge can be squeezed, extracting the energy stored in
    it to temporarily maintain the power supply to the server until the external power
    supply is restored.


    The sponge in a UPS is in nothing more complex than a battery. Batteries, however,
    can only supply DC voltage, while the input to the server power supply requires
    AC voltage. In the cases when a UPS must make a power storage, it must manufacture
    AC voltage from the DC supplied by its internal battery by a process of high-speed
    switching. Unfortunately, this is not as efficient as a process as one would like,
    a substantial battery may be able to supply only an hour or two of power to a
    large server. The battery inside most UPS is a sealed lead/acid cell and has the
    same useful life as a car battery in the range of three to five years. The UPS
    battery should be tested regularly to ensure that it will be in shape to do the
    job should need arise. A record should be kept of the battery was installed and
    the date it is for replacement. I suggest you write this information right onto
    the battery itself, and then you won''t lose it! Old'
