    As a system administrator, you can use rpm to see what packages you have installed
    and their revision level. You can add or remove packages, or upgrade existing
    ones, with a single, standard command. Here is the command to query all installed
    packages along with a few lines of sample output:


    ```

    $ rpm -qa filesystem

    filesystem-2.0.7-1

    glibc-2.1.92-14

    XFree86-libs-4.0.1-1

    XFree86-xfs-4.0.1-1

    ...

