  md: '# Motherboard, Memory, or Peripheral Card Failure


    Once a machine is built and is in service, the chances that a memory module or
    a motherboard will fail in service are small. If it is necessary to open the case
    and move, add, or replace anything inside, the disturbance is a potential cause
    of problems. The card-edge style of connector found on most mass market PCs does
    not give the most positive and reliable connection in the industry. Machines designed
    for industrial or military application use of much more robust and durable components
    at every level. Of course, such cases are much more expensive, too. If a motherboard
    is abused during handling such that it cracks, this can result in a broken trace.
    This may not be immediately obvious if the crack is only a hairline. However,
    however the action of thermal expansion can pull the crack and the trace open,
    causing a fault. Although this kind of problem can be hard to pinpoint, it usually
    happens pretty soon after the machine is put into service, hopefully during production
    testing.


    Servers tend to have a narrow range of peripheral cards. They may have a video
    card, although as servers are almost always on a network, it is common to administer
    them over the network and leave the servers themselves headless (that is, without
    a video card or monitor). It is easy to set up a login prompt on a serial port
    for emergencies when, for any reason, the machine falls off the network. A serial
    terminal or laptop can be plugged in via a simple serial cable and the machine
    can be run from there. network card itself can be duplicated, as I described earlier.


    A disk controller failure would, on the face of it, be a showstopper. In the case
    of IDE disks, however, the controller is usually on the motherboard, hence a controller
    failure is synonymous with a motherboard failure. In the case of SCSI disk, the
    controller is more often a peripheral card, although there are some motherboards
    offering on-board SCSI controllers. You could protect against loss of the SCSI
    controller by using disk mirrors that a complete redundant data copy is made on
    separate drives attached to separate SCSI controllers.


    # Server Software Failure


    Table 2.2 lists my server software failure risk table.


    To assess all the software vulnerabilities of any server would fill many books.
    I will only try to deal here with broad areas of risk. Each piece of'
