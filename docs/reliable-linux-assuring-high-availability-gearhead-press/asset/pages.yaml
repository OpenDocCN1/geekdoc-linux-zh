  md: '# 132 Building a Reliable Server


    This geometrically independent addressing scheme is selected by the lba32 option
    in your /etc/lilo conf file, as in this sample:


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=50

    message=/boot/message

    lba32

    default=linux


    image=/boot/mlinux-2.2.16-22

    label=linux

    read-only

    root=/dev/hda2

    append="mem=256M"

    ```


    If you have lilo installed, make sure you reinstall it (just issue the lilo command
    as root) after you edit /etc/lilo.conf, and then reboot to make sure it is working.
    I trust it goes without saying that this would be a good time to have your boot/root
    diskette handy, just in case it isn''t.


    If the BIOS, kernel, and lilo are all up-to-date, and you are using linear addressing
    for the boot map, the only remaining problem you could see concerns ATA drives
    drivers larger than 33.8 GB. In some cases, even fairly recent BIOS code cannot
    boot from these drives, though Linux itself has no problem with them. If in doubt,
    contact the manufacturer of your motherboard and ensure that its BIOS will support
    booting from these large ATA drives.


    Having said all this, if you have an older machine with an ATA boot disk, it certainly
    does not hurt to create a separate /boot partition, though it may not actually
    be necessary. It shouldn''t prevent you from using the Red Hat server install,
    if the convenience of that option works for you.


    # The /home File System


    Next to be mounted is /home. The FHS definition for the content and usage of /home
    is so loose as hardly be a specification at all. It reads,


    /home is a fairly standard concept, but it is clearly a site-specific file system.
    The setup will differ from host to host. This describes only a suggested placement
    for user home directories; nevertheless we recommend that all FHS-compliant distributions
    use this as the default location for home directories. Different people prefer
    to place user accounts in a variety of places. Therefore, no program should rely
    on this location.'
