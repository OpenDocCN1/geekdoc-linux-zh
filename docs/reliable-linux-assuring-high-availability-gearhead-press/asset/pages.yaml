    operation of the system. Also, there is no one single consolidated log; rather,
    logging is spread out over a number of different files. So, you can end up reviewing
    multiple log files, some of which can be large, sorting out the important from
    the trivial, to draw any serious conclusions. This is inefficient and, worst of
    all. After all, if a problem crops up in a log, you want to know about it as fast
    as possible, not when you have the time to print the logs and search through them.


