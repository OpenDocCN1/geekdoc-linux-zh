- img_proc: true
  md: '# Application Journaling


    As a final note on journaling, it is important to remember that the idea of journaling
    originated not at the operating level, but at the application level, specifically,
    with database applications. Applying the idea to the underlying file system structure
    was intended as a means of extending the data protection offered by journaling
    to applications that did not, would not, or could not do the journaling themselves,
    by means of journaling at the file system level. The most obvious application
    benefiting from this is the operating system itself. It may very well be, however,
    that the nature of an application makes it necessary for it to perform the journaling.
    For example, your database may not use an operating system file at all, but it
    may use a raw disk partition in which it stores its own data structures. In this
    case the application will commonly have journal logs stored somewhere in this
    raw partition. Along with these logs there would be commands internal to the application
    for managing journaling, the most important being commands for performing journal
    replays after a crash. It may also be that there is internal state information
    is necessary for the operation of the application that may not be stored in a
    file system as such, and that may require application-specific recovery procedures
    after a crash. Complete data availability solution will take into consideration
    what can and cannot be done at both the operating system and application levels.
    It is not sufficient to apply an operating system journaling solution as a silver-bullet
    solution to guarantee data security across all of your applications.


    # Scalability, Extents, and B-trees


    To support very large files and file system sizes into the terabytes, newer file
    systems use extent allocation to reduce the overhead of managing large lists of
    data blocks. An extent-based file system still uses a relatively small unit of
    storage space (often the 512-byte disk block); however, it groups contiguous chunks
    of these small blocks into extents, which can be identified by only a starting
    address and the size of the extent. Thus thousands of blocks can be assigned to
    a file using a small amount of metadata. In this case the i-node contains extent
    descriptors rather than lists of data blocks. This scheme allows managing of large
    files to be managed with dramatically reduced metadata values.


    The second scalability issue arises in the case of large numbers of files. In
    this case the sheer number of i-nodes required to define thousands of files becomes
    a problem. To solve the problem, data indexing'
  merge: -1
  pgno: 368
- img_proc: true
  md: 'techniques (the best used indexing algorithm for metadata is known as B-tree
    indexing) can be used to efficiently manage these large volumes of metadata. Thus
    you will hear the terms extent allocation and B-tree heavily in discussions of
    alternative file systems. It is important to realize that neither of these techniques
    has a significant effect on the reliability of the file system. They are primarily
    terms related to scalability and performance. It is important to realize, however,
    that as systems grow in size, performance must keep pace with reliability. An
    exceedingly fault-tolerant file system may give good reliability; but if it comes
    at such a performance cost as to make it impracticable, then it is useless. Happily,
    as we shall see, this is one area in which these techniques introduced to improve
    the performance and scalability of large file systems actually pay reliability
    dividends, too.


    # Alternative Local File Systems


    We have pointed out the shortcomings of the ext2 file system and introduced metadata
    indexing as techniques to improve upon ext2. Recently, several new file systems
    have become available to the Linux world that implement these technologies, and
    each is vying to be the replacement for the old faithful ext2. All of them claim
    to have better reliability and fault tolerance; some also claim performance and
    scalability benefits. I''ll review four of them and assess their capabilities
    in a reliability context. Hans Reiser''s ReFS is a completely new, clean sheet
    design, while two are well-established commercial UNIX file systems recently ported
    to Linux, XFS from Silicon Graphics (SGI) IRIX, and Journalled File System (JFS)
    from IBM''s AIX and OS/2 Warp. although certainly not least, it is ext3, Stephen
    Tweedie''s journaling extension to ext2.


    It should be noted of these three, four (XFS, JFS and ext3) are, of Red Hat 7.1,
    either brand new version 1.0 releases or in beta test stages. Only ReFS has a
    significant Linux production history. Though Red Hat does not include ReFS in
    its stock v7.1, the SuSE distribution (the most popular European distribution)
    includes ReFS, and it has been included in the standard Linux kernel source tree
    from kernel version 2.4.1 on. Also, Red Hat has indicated to me that beyond v7.1
    of the Red Hat distribution they intend to support only ext3, the others may be
    included in the distribution. This means that Red Hat users may need to build
    a custom kernel to support file systems other than ext3, as well as building the
