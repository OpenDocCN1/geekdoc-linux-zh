  md: 'If you have different package versions, there are two alternatives to resolving
    the difference. You may be able to retain the different version if you can find
    out what changed between the two so you know how to configure each machine. Look
    in the /usr/share/doc directory for a subdirectory carrying the name and version
    of the package. For nut on my Red Hat 7.1 machine, the directory is /usr/share/doc/nut-0.44.1.
    This subdirectory contains all of the documentation shipped with the package.
    You will commonly find a file named Changes, Changelog, or similar that details
    the change history of the package. This was the file that solved my problem with
    nut. A README file may also contain useful information.


    The other alternative is to install the same version of the package on both servers,
    the later version generally being preferable. If you have a distribution CD that
    has the rpm for the version you want, use the upgrade option of rpm to install
    the newer version in place of the older one. I could have upgraded my server with
    this command:


    ```

    # rpm nut-0.44.1-5.1386.rpm

    ```


    If you don''t have a CD with the rpm for the version you want, the best place
    to find it is at rpmfind.

    Another problem I ran stemmed from the UPS itself, nut relies on the UPS to decide
    when the battery is critically low. In my testing I was running both servers with
    monitors and an external SCSI enclosure turned on from the same UPS. It turns
    out that this is a sufficient load for this UPS to make poor judgment on the low
    battery condition, leaving it so late to sound the critical battery condition
    alarm that there was not enough left in the battery to keep the UPS going long
    enough to allow both machines to fully shut down. The UPS gave up and turned itself
    off way through the server shutdowns, resulting in both of them crashing. So know
    the UPS. It will make decisions regarding power conditions that may always make
    sense. You may feel more comfortable using upsc to monitor the actual state of
    the UPS and making the decision to shut down yourself rather than allowing the
    UPS to make the decision for you. The only way to know for sure what will work
    best for you is to test it. Never assume.


    Finally, we need to cover a few remaining parameters. Lines 10 and 11 define the
    polling interval. A POLLFREQ of 30 means upmon polls every 30 seconds as long
    as there is no power outage. If an outage occurs, the polling frequency changes
    to POLLFREQALERT. In the example, the'
