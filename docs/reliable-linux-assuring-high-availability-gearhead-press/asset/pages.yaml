  md: '# Logical Volume Management


    > "Contrariwise," continued Tweedledee, "If it was so, it might be; and if it
    were so, it would be; but as it isn''t, it ain''t. That''s logic."

    -Lewis Carroll Through The Looking Glass


    This and the remaining two chapters introduce several new Linux kernel features
    that have great promise in terms of building larger and more reliable servers.
    The subject of this chapter is Logical Volume Management (LVM), a way to flexibly
    manage physical data storage at the server level. LVM introduces a software abstraction
    layer between the user of a storage device and the device itself, enabling a new
    level of configuration flexibility that eases storage management and has spin-off
    reliability benefits in terms of reliable backup management and data portability.

    The portability of LVM also lay necessary groundwork for the construction of shared
    data server clusters discussed in Chapter 10, "Server Clustering." I will give
    some brief implementation examples in these chapters, but as much of the functionality
    described is in the development stages, you will find that the code levels available
    to you the time you read this have changed. Please keep this in mind and be sure
    to read the documentation for your kernel release and distribution. My primary
    goal in the final chapters is to give you a view of the forest without getting
    lost in the trees.'
  merge: -1
