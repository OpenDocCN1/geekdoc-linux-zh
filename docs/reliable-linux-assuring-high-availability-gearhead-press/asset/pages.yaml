    use grpquota to check usage by groups, or you can do both. Each file system you
    want to enforce quotas for must be flagged. Once /etc/fstab has been edited, you
    must remount each of the file systems you enabled quotas for, like this:


    ```

    mount -o remount /home

    ```


    +   2. Next you need to create the quota data files using the quotacheck command,
    like this:


    ```

    quotacheck /home

    ```


    +   3. You now need to turn quota checking on with the quotaon command, like this:


    ```

    quotaon /home

    ```'
