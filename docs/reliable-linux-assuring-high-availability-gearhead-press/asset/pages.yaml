  md: 'There are several levels of privilege that determine what the client will get
    from upsd, defined thus:


    +   - base: basic commands, no information retrieval (also allows TCP connections)

    - monitor: base plus read only information retrieval

    - login: monitor plus login for shutdown sync

    - master: login plus forced shutdown abilities for multi-ups client

    - manager: master plus variable setting plus instant commands

    - all: match any level


    So, as sandbox is attached to the UPS, it gets master privilege, *deut* need to
    login to *sandbox* for the proper shutdown mechanism, so it gets login privilege.
    The passwords defined in the final field will be needed by *sandbox* and *deut*
    whenever they use a *nut* client to talk to upsd.

    Now we''re ready to start the server daemon on sandbox, like this:


    ```

