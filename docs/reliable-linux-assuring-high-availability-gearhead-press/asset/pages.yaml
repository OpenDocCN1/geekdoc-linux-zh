    # First Failure Messaging


    In case in which one server relies on another, it is typically redundant to implement
    a specific monitor for the other server. If one server goes down, the loss of
    the service it supplies will provide clear notification of trouble. It is important,
    however, that there is a reporting mechanism that you will be informed of the
    loss of the service as soon as possible. In today''s multi-layered software architectures,
    failures at one level can be masked and, without proper reporting, it can take
    some time to drill down through multiple servers to locate the real problem.


    The principle of first failure notification is useful here. Consider a system
    of three servers, A, B, and C, in which those servers depend on each other serially.
    Server A provides a service needed by B, which in turn provides a service needed
    by C. Server C serves the end user, consequently it is at C problems will first
    become apparent. If Server A fails, that will cause a domino effect through B
    to C, which will be unable to do their jobs and report an error to the end user.
    The question is, will it be clear in the error messaging presented to the end
