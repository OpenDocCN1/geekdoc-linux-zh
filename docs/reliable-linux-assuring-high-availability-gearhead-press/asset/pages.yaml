    That’s pretty good reliability. On the other hand, if three outages occurred at
    busy times, your Web site may acquire a reputation for unreliability, which could
    cost you future business. It is never news when a Web site stays up, it sure can
    be when they go down. You need another factor to account for this. I''ll call
    it the Bad Publicity factor.


