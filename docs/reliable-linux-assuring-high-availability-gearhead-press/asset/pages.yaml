  md: '# Backup and Recovery Strategies


    +   - The system must include a plan for recovering an operating system disk.


    +   - The system should support redundant servers to maintain production in the
    case of a complete failure of a server.


    +   - The system must maintain a full set of current data backups off-site, along
    with all of the data and procedures required to rebuild the system in a suitable
    backup location.


    To get started building a backup system, you need to know about some basic UNIX
    archiving tools. If you have dabbled a bit already with tar, dump, and restore,
    you can skip the next section. If you are newer to UNIX, the next section will
    ground you in the most common use of these basic commands.


    # Basic Archiving Tools


    I''ll cover three utilities that have a long history in UNIX. tar, a contraction
    of tape archiver, is probably the best known. It takes a list of files and concatenates
    them into a single archive file that may be written to tape, disk, or any other
    type of storage media. Most Linux distributions include the GNU version of tar,
    which has enhancements over older traditional versions, so this is the one I will
    be presenting. I''ll look at dump and restore, a pair of utilities designed to
    archive and restore ext2 physical file systems. None of these basic utilities
    is sufficient to be a backup system on its own, but you need to know about all
    of them as they form the basic building block of a complete backup system.


    # tar: The Tape Archiver


    tar is a basic tool and cannot be considered anything more than a low-level building
    block for a backup system. It simply collapses a group of files into single flat
    file archive. For many years, however, it has been a standard tool for backing
    up data and is so pervasive in the UNIX world that you will need to know about
    it at some point. Much of the open source software distributed across the Internet
    is packaged in the form of tar archives (or tarballs, as they are commonly called).
    The simplicity of tar also comes into play in recovery situations in which you
    may not have sophisticated tools available. Let''s see how it works.


    Any tar command must include the -c, -x or -t options, indicating that you are
    creating an archive, extracting files from an archive, or asking'
  merge: -1
