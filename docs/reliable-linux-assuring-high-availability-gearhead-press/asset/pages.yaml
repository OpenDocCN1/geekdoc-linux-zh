- img_proc: true
  md: '/sbin Essential system binaries

    /tmp Temporary files

    /usr Secondary hierarchy (empty)

    /var Variable data (empty)


    Keeping in mind these directories, here are some root file system dos and don''t:


    If you want to automate the process of recovering the system from a backup in
    case of emergency, you will need to write a script. I''ll talk about such scripts
    in Chapter 7, "Backup and Recovery Strategies." The best place to store that script
    would be in /sbin. Then make a boot diskette that contains the root file system
    and your recovery script. The Bootdisk HOWTO for creating a boot/root diskette.
    There are also generic rescue disk images in the public domain; one of the most
    popular ones, tomsrt, was built by Tom Oehser. You can get it from tooms.net/rb.
    It is based on an older 2.0 series kernel, but should still work fine in a context.
    Add your own scripts to this rescue diskette and you can boot and restore the
    machine to a new disk using the boot/root diskette and a backup tape.


    Many administrative scripts need to run with root privilege. If one of these scripts
    outputs, it is tempting to direct the output to a file in root''s home directory.
    As root''s home directory is normally located in the root file system, doing this
    is a bad idea. Logs of any sort have a nasty habit of growing, and growing files
    in the root file system are not good. The root file system is small, and, if it
    fills, the operating system can be seriously affected. The proper place for logs
    is in the /var file system, as shown shortly.


    You will notice that several of the directories in the root file system are flagged
    as empty (specifically, /home, /mnt, /opt, /usr, and /var). These exist purely
    as mount points for other file systems and no data should be stored in them. If
    one of these other file system mounts fails for any reason, it is possible for
    processes to write to the directory anyway, placing the data in the wrong disk
    partition and potentially filling the root file system.


    The default Red Hat server install includes /tmp in the root file system. Many
    administrators, myself included, like to see /tmp placed in a separate partition.
    All too often I have run across applications that demand substantial amounts of
    space in /tmp for all sorts of reasons.'
