  md: '# Installing and Configuring for Reliability


    where most non-operating system application code (and sometimes also configuration
    files) is installed. It is also where many system administrators will locate their
    local administrative shell scripts. If /usr is implemented within a single-disk
    partition, this leads to operating system code and application code getting together
    on the same drive, weakening the positive effect of the Titanic premise.


    To help with this issue, the FHS defines /opt as follows: /opt is reserved for
    the installation of add-on application software packages. A package to be installed
    in /opt should locate its static files in a separate /opt/<package> directory,
    where <package> is a name that describes the software package.


    This means that /opt becomes to applications what /usr is to the operating system.
    Like static and predictable in size. It also allows you the option of creating
    /opt as a separate file system, which can be read only, and maintained independently
    of /usr. This allows for a nice separation between the application and the operating
    system. With /opt on a separate drive from the rest of the operating system, you
    could remove the application drive from a server with a failed operating system
    and easily move it to a backup server. Additionally, each package is organized
    into its own subdirectory tree, which would allow you to further subdivide storage,
    should you desire, and make applications individually portable. It is my fond
    hope that the application code today goes somewhere under /usr/local in the future
    increasingly be found in /opt, as distros and application packages adopt the FHS
    standard.


