  md: 'Read-only data implies that none of the data stored in /usr changes while the
    operating system is running. The FHS specifies the following subdirectories under
    /usr:


    | SUB-DIRECTORY | DESCRIPTION |

    | bin | Most user commands |

    | games | Games and educational binaries |

    | include | Header files included by C programs |

    | lib | Libraries |

    | local | Local hierarchy (empty after main installation) |

    | sbin | Non-vital system binaries |

    | share | Architecture-independent data |

    | src | Source code |


    This adds up to the majority of the operating system installation, with the exception
    of the ambiguous definition for /usr/local. /usr contains only read-only data,
    you should be able to mount /usr as a read-only file system, which you can. This
    is a plus for reliability, as it prevents filling the file system as well as tampering,
    deliberately or accidentally, with any of the data in it. To mount /usr read only,
    you will need to edit the file system table, /etc/fstab. Your default entry in
    /etc/fstab for /usr will be similar to this:


    ```

    LABEL=/usr /usr ext2 defaults 1 2

    ```


    Add the read-only option like this:


    ```

    LABEL=/usr /usr ext2 defaults,ro 1 2

    ```


    Now /usr will be mounted read only at the next boot. If you do this, it means
    that in order to install, uninstall, or patch any packages having files under
    /usr you will need to mount the file system read-write, like this:


    ```

    # mount -o remount,rw /usr

    ```


    After you have done your maintenance, remount it read-only like this:


    ```

    # mount -o remount,defaults,ro /usr

    ```


    This should not affect running processes, as they should never be trying to write
    to /usr anyway. But, do reboot and thoroughly test'
