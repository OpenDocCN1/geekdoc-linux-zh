    been the standard IRIX file system since 1996. As part of SGI''s commitment to
    Linux, in 1999 a Linux port of XFS was started and version 1.0 released under
    the terms of the GPL in May 2001. XFS is a mature, stable file system design especially
    oriented towards very large file systems, both in terms of the aggregate size
    of the file system as well as the'
