  md: '# restore: The File System Recovery Tool


    restore is the other half of dump, so to speak, and is used to restore files or
    file systems from a dump archive. The simplest form of a restore command is


    ```

    # restore -r

    ```


    This command restores an entire physical file system from a dump archive located
    on a default storage device defined by the shell environment variable TAPE. The
    files will be restored into the current working directory of the restore command.
    Note that the design intent of restore is to rebuild the entire file system metadata
    structure as well as restore the data files themselves, a restore will normally
    be run from the root directory of what is termed a pristine file system, meaning
    a brand new, completely empty one for.


    ```

    # mkfs /dev/sda1

    # mount /dev/sda1 /home

    # cd /home

    # restore -r

    ```


    Like dump, the -f option can be used to specify the archive location on the command
    line, and like tar, the -o option tells restore to echo file names to stdout as
    they are restored. For example:


    ```

    # restore -rvf /dev/st0

    ```


    If you are restoring an incremental archive, you repeat this same once for each
    successive incremental archive tape in the sequence. You may only want to extract
    a single file or a limited number of files from a dump archive. This can be done
    using the -x option. Consider an archive created with dump like this:


    ```

    # dump /home

    ```


    In this case, I would extract a single file from that archive like this:


    ```

    # restore -xvf /dev/st0 ./iain/data

    ```


    If /home/iain/data is a directory, it will be recursed so the entire directory
    subtree will be restored. Note that in the archive the directory paths for the
    files are specified relative to the mount point of the file system that was dumped.


    Another really interesting thing you can do with restore is an interactive extraction.
    Remember that dump stores the inode table for the file system'
