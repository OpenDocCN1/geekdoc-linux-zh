  md: '# 162 Building a Reliable Server


    frequency, in days, with the second field is a delay in minutes from the time
    anacron is started to the time the job will be started. The third field is the
    identifier used in the time stamp file to identify this job, and the rest is the
    command to be executed.


    Now, the final issue is, how do we put anacron and cron together to ensure that
    anacron will pick up any jobs missed by cron as a result of downtime or missing
    hours errors? The answer lies in a flag for anacron, the -u flag. This tells anacron
    to process /etc/anacrontab, but not to execute any jobs, only update their time
    stamp value, as if anacron had executed them. Then, all of the jobs listed in
    /etc/anacrontab that we want anacron to back up must be listed in /etc/cron.daily,
    /etc/cron.weekly, and /etc/cron.monthly directories are all listed in /etc/anacrontab.
    Having done that, we then direct cron to run anacron -u from the /etc/cron.daily
    directory, before any of the other cron jobs. So, as long as cron is running,
    cron will run the jobs that need doing, and ensure that each time cron runs anacron
    time stamps are up-to-date, giving anacron a record that cron has successfully
    run all necessary jobs. Then we include anacron in the boot process. Now, should
    the machine goes down and miss cron, the boot anacron process will deal with them.


    Here is an example to show how it unfolds. The machine goes down at 10:00 P.M.
    December 7, remaining down until 11:00 A.M. December 9. According to /etc/crontab,
    all of the jobs listed in /etc/cron.daily should have run on December 9, but with
    this downtime, they will be missed. The last time jobs did run successfully was
    at 4:02 A.M., and as the anacron -u command would have run at that time also,
    the anacron-time stamp will run December 7. When the machine boots on the morning
    of December 9, anacron will run from (/etc/rc.d/init.d/anacron) and observe that
    it is December 9, the yet timestamp values indicate that the flagged cron.daily
    last ran December 7, one day too ago. Consequently, anacron will run those jobs.
    The second field in the /etc/anacrontab allows for a delay before anacron starts
    issuing commands, to let the boot process complete. Normally, anacron will go
    into the background, emerging only to start the next job (should there be more
    than one defined by /etc/anacrontab) and finally terminating after the last job
    completes. This is all done, the anacron time stamp will run December 9, and every-thing
    will be caught up.


    Realize that the next time a machine boots after an outage may not be the best
    time to recover a missed cron jobs. In some cases, in others, the machine may
    not yet have fixed enough from the first reboot after the outage to be able to
    run the missed cron job.'
