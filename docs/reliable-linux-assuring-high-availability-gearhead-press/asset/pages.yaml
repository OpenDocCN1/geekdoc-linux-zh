  md: '# 412 Glossary


    Linux Loader The most popular of several boot loaders commonly used by Linux distributions.
    It is the job of a boot loader to map the physical location of the binary code
    for the kernel, and make sure that information is available to the BIOS in order
    to allow the BIOS to find and load the kernel into memory at boot time.


    Local Area Network Any communications network considered to be in scope, usually
    connecting computers within an office where distances rarely exceed a few hundred
    feet. See Ethernet.


    MD5 See Message 5.


    Media Access Control A term referring to the hardware inherent in any communications
    network to control which network device can use at any one time. The term MAC
    is commonly used to refer to the hardware address of a NIC (see Network Interface
    Card), which is a unique number assigned to each NIC at the hardware level to
    identify the card to the access control software.


    Message 5 An algorithm that takes a block of text, commonly an email message or
    a data file, and produces a 128-bit fingerprint of the data, such that if the
    data itself is changed, the fingerprint will also change. It is used primarily
    in the creation of digital signatures, and is described fully in RFC1231.


    metadata The data held in a file system that is not data file, but is rather administrative
    data needed by the file system to properly store and manage the file system. The
    most obvious example of metadata is the i-node (see i-node).


    mount The command used to make a file system visible to regular user processes.
    It must be issued with super user privilege, and associates the root directory
    of the file system directory tree in the partition being mounted with a pre-existing
    directory entry in the current local file system.


    Network Interface Card The peripheral card used to connect a PC to communications
    network.


    NIC See Network Interface Card.


    NVRAM See Random Access Memory.


    partition Disks are divided into contiguous sections of storage space termed.
    The starting and ending point of each disk partition is defined in a partition
    table stored on the disk.


    PCI See Peripheral Connection Interface.


    pdksh See Korn Shell.


    Peripheral Connection Interface The type of bus (see bus) most commonly used on
    current PCs, the successor to the AT bus.


    PGP See Pretty Good Privacy.'
  merge: -1
  pgno: 435
