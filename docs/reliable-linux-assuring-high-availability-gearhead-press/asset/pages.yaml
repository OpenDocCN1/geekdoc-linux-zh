    # Monitoring Files


    Monitoring file systems and establishing quotas can prevent the problem of file
    systems filling up with adverse consequences. Another problem that can arise is
    the issue of what is filling them. It may be that your monitor pages with an alarm
    that a file system normally running at 60 percent is suddenly 90-percent full.
    It may be that space in a file system thought to be more than adequate for the
    purpose is becoming scarce. Where did the space go? I did find it to watch for
    the largest files in each file system and the largest users of disk space to see
    if there are any trends, either up (usually) or down (rarely) in disk usage. It
    is also useful to periodically clean up space such as old core dumps or old data
    that could be achieved to free up online disk space.


    The key to this is the du, or disk usage command. du recurses a directory and
    reports how many disk blocks are allocated to each file. The command can also
    provide a summary of the total taken up by a particular directory tree. What you
