    # Understanding /etc/raidtab Parameters


    The central configuration file for all RAID arrays on a server is /etc/raidtab.
    All arrays on a server are defined within this one file, however many there may
    be, whatever level they may be, combined levels or not. Everything happens in
    this file, so this is where I''ll start. Listing 5.1 shows a typical /etc/raidtab
    file.


    It is important to note the order in which the parameters appear in the file,
    as the function that parses it is picky about this. Also, if you want to combine
    RAID levels, the order in which the arrays appear in /etc/raidtab has to make
    sense. That is, if you want to create a RAID5 using three RAID1 mirror arrays,
    you need to define the three RAID1 arrays before you define the RAID5. With these
    points in mind, here is a list of the parameters and their meaning.


    +   - raiddev. Each RAIDdev definition starts with a raiddev parameter, as seen
    at lines 6 and 20. The name of the device is arbitrary, but the convention is
    /dev/md0 for the first array, /dev/md1 for the second and so on.


    +   - raid-level. This is self-explanatory, valid values for raid-level being
    linear 0, 1, 4, 5, as I described previously.


    +   - nr-disks. This parameter defines how many disks will be in the array. Currently
    12 disks are supported as a maximum, but this number has already been extended
    to 256 in development kernels.


    +   - nr-spare-disks. If you want to include spare disks, nr-spare-disks defines
    how many there will be in the spare disk array. Note that spare disks are only
    supported at RAID levels 1, 4, and 5.


    +   - persistent-superblock. Not to be confused with the metadata superblock object
    in an ext2 file system, this system is RAID metadata. It is a small data block
