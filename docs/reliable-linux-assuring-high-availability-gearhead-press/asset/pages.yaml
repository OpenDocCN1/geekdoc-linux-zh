    # Task Scheduling: at and cron


    Regular upkeep is a critical part of keeping a server working reliably, and the
    ability to automatically schedule maintenance tasks at specific times is a basic
    tool in your toolbox. There are two commands available to do this: the *at* command
    schedules a one-time execution at the specified time, while *cron* allows for
    the repeated execution of a command at a regular interval. *at* and *cron* rely
    on daemons, the *at* and *cron* respectively, which need to be started at boot
    time. Maintenance tasks that need significant performance overhead, such as creating
    backups, weeding out outdated space-wasting files, or application-related maintenance
    are the sort of thing you do not want to run at off times, like in the middle
    of the night, when you have no desire to be there. Administrative tasks that need
    to run with *root* privilege also fall into this category, giving a night operator
    *root* privilege simply to run such tasks is clearly an unacceptable solution.


    In such cases, *at* or *cron* may be of use. You could write a script to clean
    out outdated data from a file system at 2:00 A.M. tomorrow with this *at command:


    ```

    # at 2am tomorrow < /usr/local/clean.out.the.old.files.sh

    ```


    You can also specify a particular day. To run the job at 4:00 A.M. on December
    20, issue


    ```

    # at 4am Dec 20 < /usr/local/clean.out.the.old.files.sh

    ```


    To specify a time in the relative sense, such as three hours from now, use


    ```

    # now +3 hours < /usr/local/clean.out.the.old.files.sh

    ```'
