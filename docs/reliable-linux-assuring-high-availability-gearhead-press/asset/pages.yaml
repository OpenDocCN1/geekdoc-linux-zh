    # The Network Services Super Server: xinetd


    xinetd is the network super server daemon and is an updated version of the older
    inetd daemon. According to the man page for xinetd, `xinetd` performs the same
    function as inetd. It starts programs that provide Internet services. Instead
    of having servers started at system initialization, time, and be dormant until
    having a connection arrives, xinetd is the only daemon process started and it
    listens on on all service ports for the services listed in its configuration file.
    When a request comes in, xinetd starts the appropriate server.


    xinetd differs from the older inetd in that `xinetd` takes advantage of the idea
    of a super server to provide features such as access control and log-ging. This
    improves security, and whatever keeps a server more secure is generally also good
    for reliability. It is important to note, however, that increased security tends
    to involve increased complexity, so it is partic-lar important to get the new
    security configuration right.


    The main configuration file for xinetd is `/etc/xinetd.conf`. It is modeled on
    the syntax of the Apache Web server files. It is also possible to include further
    configuration files by using the `includedir` directive in `/etc/xinetd.conf`.
    In fact, the default Red Hat installation includes this line in its default xinetd
    configuration:


    ```

    included /etc/xinetd.d

    ```


    An examination of the `/etc/xinetd` directory shows it to contain several further
    xinetd configuration files, each for a specific service. Each of these files will
    be processed by xinetd when it starts or is signaled to re-read its configuration.


    Earlier, while running levels, you were introduced to the chkconfig command. You
    can use it to track the services started by xinetd, too. Issue the command `chkconfig
    --list`. The xinetd services will be found at the end of the output. The two major
    and very common services normally managed by xinetd are `ftp` and `telnet`, both
    of which have default configuration files in `/etc/xinetd.d.


    There are several services also started by default, however, that are questionable
