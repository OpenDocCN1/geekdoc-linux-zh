    # Reliable Power


    Reliable power supply is clearly fundamental to keeping a server going. I

    am am going to separate power supply into two different issues: external and

    internal power supply. The power supply chain for a PC starts with a rela-

    tively high voltage power source— usually 110 VAC— external to the PC

    itself. I call the external power. That high voltage AC must then be

    converted into low voltage DC, 12 volts for drive and fan motors and 5

    bolts for digital logic circuits. This conversion is done by the power supply

    unit inside the server case that I will call the internal power supply.'
