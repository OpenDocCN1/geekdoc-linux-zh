    command used a PE size of 4 MB when creating this VG, as that is the default.
    Note that the PE size is an attribute of the VG, not the PV. This means that all
    PVs in a VG must use the same PE size and that once the PE size is determined
    at the creation of the VG, it cannot subsequently be changed. As there is an upper
    limit of 65,534 PEs, the PE size will effectively limit both the maximum size
    allowable for a PV and place on the maximum VG size. If you anticipate large VGs,
    it may be prudent to increase the PE size (use the -s flag to the vgcreate command)


    # Creating Logical Volumes


    The final step is to make LVs, which we can do using the lvcreate command:


    ```

    # lvcreate -1 5 -n LV01 VG01

