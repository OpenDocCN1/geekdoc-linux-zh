    The solution is to enable logging and manage the resulting log files properly.
    Linux provides the logrotate utility to do this. The man page for logrotate reads:
    "[logrotate] allows automatic rotation, compression, removal, and mailing of log
    files. Each log file may be handled daily, weekly, monthly, or when it grows large.


    In a Red Hat installation, a script in /etc/cron.daily runs a logrotate command
    every 24 hours. Yet, you will find that logs are not necessarily rotated daily.
    The rotation criteria as well as other logrotate options are governed by the configuration
    file /etc/logrotate.conf. There is an excellent explanation and example of this
    file in the man page for logrotate. I can''t improve on it, so I''m not going
    to try. In short, the configuration file is used to tell logrotate how to rotate
    specifically named log files. It also allows for rotation based on size rather
    than age, as well as compressing the old logs, automatically naming them sequentially,
    mailing them to a user, running an arbitrary pre- or post-rotation script, as
    well as a number of other obscure options. There isn''t much you can do with a
    log file that isn''t covered.


    The default /etc/logrotate.conf file looks like this:


    ```

    # see ''man logrotate'' for details

    # rotate log files weekly

    weekly


    # keep 4 weeks worth of backlogs

    rotate 4


    # send errors to root

    errors root


