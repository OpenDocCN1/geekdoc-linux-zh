    time. As no one had been in charge to that time, their networks were a mess. Specifically,
    there was no overall diagram that could be used to trace network connections.
    It took this analyst three months to go back over the entire network and document
    it, labeling and correcting loops and redundant cabling as well. At the end, he
    was left with one cable disappearing into a wiring duct. He had no idea at all
    where the other end went. All he could do was cut the cable and wait for the phone
    to ring. Never did! This is not the situation you want to find yourself in; it
    does not help your server reliability.


    two machines, you have a network; if you have a network, you need a network topology
    diagram. Developing a topology diagram for only two machines seems silly. But
    the point is: if you don''t start the diagram when you have two machines, you
    still won''t have it when you have 20. It is when you have more machines to deal
    with that the troubles escalate, confusion sets in, and you could really use that
    diagram. Start it now, not later. I''ve provided a topology diagram in the sample
    BR plan in Appendix A, so you can get an idea of the sort of information needed.


    Another invaluable tool is a cable tester. One that allows you to place the tester
    at one end of the cable and a wrap plug at the other so that long cables and cables
    fished through walls can be tested without having to remove them. Again, I have
    seen far too much wasted trying to fix what at first seems to be an operating
    system driver, or network routing problem that turns out to be nothing more than
    a bad cable. I have learned in troubleshooting network issues to check the hardware
    first, not last, and a simple cable tester is often all you need.


    # External Network Redundancy


    If your server relies on external connectivity, it may be a good idea to have
    a secondary external connection. This may be of limited use, however. If the external
    failure is within your service providers network, an alternate provider may be
    able to offer backup connectivity. The reason that your main provider failed is
    due to some natural disaster, or a large-scale disruption in the general communications
    infrastructure in your area, there is a good chance that any backup provider will
    be affected also. In this case'
