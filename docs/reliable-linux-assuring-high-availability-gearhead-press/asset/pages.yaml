  md: '# Monitoring Real Memory and Paging Space


    It is also useful to monitor real memory usage. As Linux implements virtual memory
    management, running out of real memory is not a problem as such, so long as there
    is sufficient swap space to accommodate the virtual memory required by all of
    the current running processes. But things get critical when you run low on swap
    space. Actually running out of swap space will cause fatal memory allocation failures
    whose effects on the system are unpredictable. To all intents and purposes, you
    can consider this a form of crash because you cannot predict which processes will
    fail.


    The script in Listing 6.9 uses memory and swap usages available from the /proc
    file system. It will mail root if real memory runs out. If swap space gets low,
