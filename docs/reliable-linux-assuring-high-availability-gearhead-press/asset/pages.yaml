  md: '# CHAPTER

    2


    # Risk Analysis


    Know thine enemy.


    Risk analysis involves identifying all the possible things that could go wrong,
    and the relative likelihood of each in fact going wrong. This is a complicated
    task, as there are usually a number of things that could go wrong, and the likelihood
    of any particular failure can only be estimated. Risk analysis is thus more art
    than science. You can improve the reliability of a risk analysis by your knowledge
    of risks particular to your situation and by keeping records of failures as they
    happen in order to build a history. The more you know of the past, the better
    you are able to predict the future.


    This chapter steps through a risk analysis of a Linux server. Risks are divided
    into four areas, starting with server hardware, followed by server software, human
    factors, and finally natural disaster. Failure modes are listed in a tabular format,
    with an assessment of the impact of each failure on your operations, the likelihood
    of the failure, and the defenses available to you against the failure. The severity
    and likelihood of each failure is listed as low, medium, or high; these are my
    own ratings and are based on my own observation and experience. Your particular
    situation may not be subject to some of the risks detailed; on the other hand,
    you may be at'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Planning for Reliability


    higher risk than the norm. If computer failures were completely predictable, I
    wouldn''t be writing this book and you wouldn''t be reading it.


    My intent is for you to use this chapter as a framework to assess your situation.
    All of the defenses listed are introduced briefly in this chapter; the technical
    details you will need to implement them are the subject of the last two sections
    of this book. The Chapter Reference column in each table shows you in which chapter
    the implementation details for each defense are detailed. I''ve chosen to list
    the failures in order of greatest likelihood first. This was purely arbitrary;
    it may make more sense to order your list in terms of severity.


    # Server Hardware Failure


    Clearly the reliability of your server''s hardware is a key issue, and forms the
    foundation upon which everything else rests, so I have chosen to consider this
    fact. Table 2.1 lists my server hardware risk table.


    You will notice that the highest risk items in the table involve mechanical components,
    as opposed to purely solid-state components as peripheral cards or memory. The
    fact is, mechanical components wear out. Solid-state components may fail if abused,
    but rarely they wear out as such. If you can keep the in-case temperature under
    control, and the machine is not physically disturbed, the purely electrical components
    should normally be the least of your worries. As disk drives are one of the most
    mechanically complex components of any computer, and are in constant use, they
    stand at the top of the list for probable failure.


    # Dealing with Hard Disk Failure


    The first listed defense against disk failure is operational monitoring. Often
    when building a Business Recovery (BR) plan you can become fixed on after-the-fact
    recovery and overlook the opportunity to be proactive, attempting to see failure
    coming as well as dealing with it when it arrives. In the case of disk failures,
    it is possible for a drive to begin logging I/O errors before it fails completely.
    In most cases, unfortunately, especially in the case of a head crash, the drive
    deteriorates rapidly after the first sign of trouble. As a result, monitoring
    must be done on an ongoing basis with a rapid response time. To do this effectively
    requires an automated system.


    Losing a hard disk is listed as high severity because the data on a failed disk
    should be considered irrevocably lost. In desperate cases, it may be possible
    to physically dismantle the failed drive and recover some of the'
