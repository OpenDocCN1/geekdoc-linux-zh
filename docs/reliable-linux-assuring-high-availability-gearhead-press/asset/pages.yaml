  md: '# Risk Analysis 33


    Vs and file systems can be dynamically increased or decreased in size. As this
    code matures and improves in stability, it should become a standard element of
    any Linux server installation. I have devoted Chapter 8, “Logical Volume Management,”
    to the discussion of LVM.


    Another data management tool is disk quotas. In the case where the ownership of
    data in a partition is divided among several users, it is possible for one user
    to use all of the remaining free space in the partition. Should that happen, none
    of the other users or applications will be able to store any more data. Disk quotas
    can be used in this case to dynamically monitor and control the amount of storage
    used within a partition on per user basis. Quotas can be set per user, or per
    user group. There is a grace period allowed a user who is over quota to correct
    the problem before an absolute limit is placed on him or her disk usage.


    # Tracking Those Devilish Daemons


    All of the UNIX flavors used the term daemon to denote a process that runs all
    the task and performs a fundamental operating system or application task. Much
    of the real work that happens on a Linux server is done by one daemon or another.
    Should something go wrong, usually a bug in the daemon''s code, daemons will occasionally
    either race or crash. A buggy daemon that enters a race condition will use all
    of the CPU cycles it gets to run around in circles and do nothing useful. This
    usually stops the other applications cold, and can also severely impair the operating
    system from getting anything else done. To defend against this condition, you
    will want to monitor the process table and watch the CPU usage of the major processes.
    You will need to know the bounds of CPU usage, and you can then watch for out-of-bound
    conditions. Monitoring for and detecting racing daemons is straightforward. Unfortunately,
    once you have discovered the problem, there is a rarely fix. Usually, it is necessary
    to kill the daemon process, often with adverse effects on data or connections
    to the functionality that the daemon implemented.


    A buggy daemon may race, but it may also simply crash. In this case, you will
    monitor the process table for the simple existence of the daemon. Should the daemon
    die, you can restart it. Unfortunately, however, the data the daemon was acting
    on may now be damaged as a result of the crash, and the daemon may then restart
    it, and continue a vicious cycle that could be as damaging as a race condition.
    Writing monitors is discussed in Chapter 6, “Monitoring Linux in Production.”'
