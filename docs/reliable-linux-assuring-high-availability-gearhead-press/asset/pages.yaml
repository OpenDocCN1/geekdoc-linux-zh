    # Building Your BR Plan


    I''ve tried my best to convince you to develop a BR plan. Let''s say I''ve succeeded.
    (I''m an optimist.) How do you go about doing it? In the spirit of the Linux HOWTOs,
    I''ve written a BR plan HOWTO.


    # LINUX HOWTOS


    One of the commonly voiced objections to the commercial use of open source software
    has always been the issue of documentation. It has been argued that the code itself
    may be well enough written, the documentation is poor and often out of date. The
    authors of the code, while they may be brilliant programmers, are not necessarily
    best suited to writing documentation, and there is no revenue associated with
    open source, who is going to write and maintain good documentation? The open source
    community responded to these concerns by founding the Linux Documentation Project
    (LDP). The LDP manifests the project as “a loose team of volunteers with minimal
    central organization.” However, a visit to the LDP Web site (www.linuxdoc.org)
    reveals a well-organized body of several hundred alike up-to-date documents distributed
    from a worldwide group of 250 members.


    One of the most popular document categories maintained by the LDP are the HOWTOs.
    These are short, subject-specific papers giving practical hands-on implementation
    instructions for a particular task, with numerous examples. Subjects range from
    the fundamental to the specific, such as


    **Cable, Modem HOWTO.** Answers basic questions how to connect your Linux box
    to a cable modem or cable Internet provider.


    **Hardware HOWTO.** Lists of the hardware supported by Linux and helps you locate
    any necessary drivers.


    **Hebrew HOWTO.** Describes how to configure your Linux machine to use Hebrew
    characters on Windows and Virtual Consoles.


    In addition to the HOWTOs, the LDP maintains the main (online manual) pages and
    is now beginning to produce longer documents, called Guides. These are full-length
    books, some of which are available in print as well as online. The LDP also produces
    a monthly সিনে, The Linux Gazette, containing tips, tricks, and Linux news of
    all sorts. It can be found at www.linuxdoc.org/LDP/LG. LDP documents are professionally
    written and can be enormously helpful. Don’t run Linux without them!'
