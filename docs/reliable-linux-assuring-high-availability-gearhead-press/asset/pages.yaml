    # Starting the daemons on the Master Server


    Once they are all configured, three daemons need to be started in order at boot
    time on the master server—first the apcsmart driver, then upsd, and finally upsmon.
    Red Hat supplies a script to do this,/etc/rc.d/init.d/ups. You need to add a start
    link to this in your run-level directory, as usual. For a Red Hat 7 system, this
    should work for servers booting into run level three (the default run level):


    ```

    # ln -s /etc/rc.d/init.d/ups /etc/rc.d/rc3.d/S99ups

    ```


    If your server does a graphical boot, it will be run level five:


    ```

    # ln -s /etc/rc.d/init.d/ups /etc/rc.d/rc5.d/S99ups

    ```


    This UPS startup script uses a configuration file,/etc/sysconfig/ups, to start
    the UPS driver daemon. Using the APC UPS,/etc/sysconfig/ups/ on the master server
    will look like this:


    ```

    1 SERVER=yys

    2 MODEL=apcsmart

    3 DEVICE=/dev/ttyS0

    ```


    The SERVER parameter indicates this machine is the master, the MODEL parameter
    ensures the proper driver daemon is started, and the DEVICE parameter specified
    the serial port the UPS is connected to. Once these last files are in place, reboot
    the master server and make sure all the daemons are running properly.


