  md: '# Linear and Helical Scanning:

    What Are They?


    The earliest form of magnetic tape storage devices used was what is called linear
    scanning. In this system, the tape is drawn across a stationary recording head
    that lays down the data onto a linear track running the length of the tape. In
    audio tapes, the capacity was doubled by removing the tape at the end, flipping
    it over, and running backwards. As the head was mounted bit off the center of
    the tape, this allowed a second track to be laid down on the tape parallel to
    the first, but running in the opposite direction. Modern linear scan tapes do
    essentially the same thing, but they eliminate the need to physically remove and
    flip the tape by moving the recording head up and down instead. In this fashion,
    multiple tracks can be laid down in a sort of greatly elongated S shape along
    the length of the tape. As the tape reaches the end, the head drops down a notch
    and the tape reverses direction. The procedure is repeated at the opposite end
    of the tape until the width of the tape has no space for any more tracks. The
    data path that results is illustrated in Figure 3.5. As the total length of the
    data path increases, so does the amount of data that can be stored. Clearly then,
    the longer the tape, the more data. Also, a wider tape will accommodate more reversals,
    or tracks, further elongating the data path and increasing the storage capacity
    of the tape.


    Helical scan tapes lay the data down differently due to the history of the technology.
    Helical scanning was introduced as a means of storing live video data on tape.
    Linear scan tape can store video data with no trouble,


    ![](img/8f0b2e54b3e875094917788f9cb87c45_114_0.png)


    Figure 3.5 Multiple tracks run in an S shape along the length of this linear scan
    tape.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Building a Reliable Server


    a problem arises when slowing down or pausing the video. When slowing the tape
    speed, the video motion slows, but so does the rate at which I can read the data,
    so the image quality cannot be maintained. Should I stop the tape entirely, I
    now have a stationary tape and a stationary head, therefore I can read no data
    at all. Clearly I cannot pause the scan with a linear scan. Helical scanning solves
    the problem by putting the recording in constant motion. Heads are mounted to
    a shaft and spun at constant speed in a small circle. A semicircular wall is erected
    around the spinning heads, and the tape is wrapped in a spiral around the outside
    of this wall. While the tape is playing, the head is also spinning, and the speed
    of the head relative to the tape is appropriate for full motion video. If the
    tape stops, the head continues to spin and can still read data from tape, although
    now it is the same data over and over again, which produces a still picture. As
    the tape is wrapped in a spiral (or helix) around this semicircular wall, the
    head actually scans in a diagonal line across the tape, which increases the length
    of each scan, increasing the volume of data that can be read each rotation of
    the head. This technology was the basis of videotape, and it is how VCR works
    today.


    # What Is Better, Linear or Helical Scan?


    Each drive of course has its boosters. Those who favor linear scanning technologies
    argue that


    +   Linear scan drives are less complex mechanically than helical scan units,
    and their recording heads tend to last longer, as the contact between the tape
    and the head is small. By comparison, a helical scan drive must wrap and draw
    the tape around the semicircular drum surrounding the recording heads. This leads
    to wear on both the drum and the tape.


    +   Linear scan drives allow for bidirectional positioning, which most helical
    scan drives can not. By this I mean if I need to find several files on a tape,
    I can search the tape in both directions on a linear scan device. I can only accurately
    position from the start of a helical scan device, so once I have found one file,
    I need to rewind the tape and start searching for the second file from the beginning.
    This can make extracting individual files from a helical scan tape slower than
    from a linear scan device.


    +   Due to the multi-track structure of a linear scan tape, I can skip quickly
    through the data stored by simply dropping two or three tracks down, without having
    to move the tape backwards or'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Choosing the Right Hardware 93


    forwards. This also leads to faster performance in extracting individual files.


    +   - Future development roadmaps for linear scan technologies allow for larger
    volumes of data storage than do future helical scan technologies. This is an important
    consideration, as a backup system is a significant investment, and once you have
    committed to a technology it would be ideal if you could stay with it for a number
    of years into the future.


    Meanwhile, those who like helical scan drives point out that


    +   - The data transfer rate depends on the head-to-tape speed. Because the heads
    in a helical scan drive are spinning quickly, high head-to-tape speeds giving
    transfer rates comparable to linear tape, can be achieved without needing to move
    the tape nearly so quickly past the heads. This places less stress on the tape
    thus improving media life and reducing the chances of tape breakage, all of which
    improves reliability.


    +   - Linear tapes require several tracks laid down on the tape to realize full
    storage capacity, to fill a tape it must go back and forth in the drive. A helical
    scan tape passes through the drive only once to fill capacity. Less wear and tear
    on the tape in the helical scan drive results in better reliability.


    +   - Due to the lower storage density of linear tape (relative to helical scan),
    the use of single reel cartridges is common in linear tape technologies. This
    requires a system to draw the tape out of the cartridge and into a take-up reel
    inside the drive. These mechanisms are prone to failure, necessitating repair
    to either the drive or the cartridge to allow recovery of the stored data.


    I would like to be able to tell you firmly that one is better than the other,
    unfortunately, there is no clear winner. While I was not impressed with some of
    the earlier helical scan technologies, much work has been done in recent years
    to address some of the inherent weaknesses of this technology, and the current
    crop of offerings competes well against some of the older linear scan drives.
    When you go shopping for drives, cost may be the factor that tips the balance:
    You will need to find that helical scan technologies are less costly for small-to
    medium-sized data volumes, making popular in smaller shops. Large-scale backup
    systems like those associated with mainframe computer systems rely primarily on
    linear tape technologies that scale well into the terabytes, but can carry hefty
    price tags.'
