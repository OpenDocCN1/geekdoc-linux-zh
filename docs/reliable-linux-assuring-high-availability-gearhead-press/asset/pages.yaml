    # # Firewalls: ipchains


    If you want to implement a firewall on a server, you will likely use ipchains.

    Note that ipchains is not a separate daemon that needs to be started or stopped;
    rather it is an inherent part of the kernel. it by default do no examination or
    filtering of network traffic.\ If you want to implement a firewall using ipchains,
    you need to develop a set of firewall rules. These are logical statements that
    determine which incoming and outgoing network packets are examined and if they
    will be accepted or rejected. The decision to accept or reject is based on source
    or destination addresses. A typical firewall will have a number of these rules,
    of which some take some time to develop, particularly in the case of less common
    or proprietary applications. The rules are loaded into the actual kernel firewall
    using the ipchains command. Once loaded, they can be queried using ipchains -L,
    but the entire rule set does not get stored on disk anywhere, after a reboot,
    the rules must be redefined from the command line. Each rule requires one ipchains
    command to define it the kernel firewall. There are usually a number of rules,
    so it would be reasonable to store them in the form of a firewall startup script
    that can run as a part of the boot process and backed up for recovery purposes.


    If you choose the /etc/rc.d/init.d boot scripts as supplied with a Red Hat distribution
    to start your firewall, however, you need to know that the script supplied to
    start ipchains makes use of an ipchains option, allowing the firewall rules to
    be read from an ASCII text ruleset file rather than running a series of ipchains
    commands from the script. This ruleset file can be generated from a running firewall
