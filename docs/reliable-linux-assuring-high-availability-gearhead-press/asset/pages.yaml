    As a performance-related aside, it is also possible to create a striped logical
    volume. This involves spreading the LV over two or more drives and specifying
    a stripe size in the order of several kilobytes. For a striped LV having three
    stripes and a stripe size of 32 KB, data will be allocated in a sequential fashion
    32 KB at a time to each of the three partitions, or stripes, in the LV. This is
    functionally the same as a RAID0 array described in Chapter 5 and gives the same
    performance-related advantages as the RAID0.(It also illustrates why a RAID can
    be termed a volume manager.)


    The -i flag is used to specify the number of stripes (which is the number of drives
    the LV is striped across), and the -i flag determines the width of each stripe.
    Thus, a command to create an LV named stripedlv having 30 LEs striped across across
    three drives in 32 KB chunks in a VG named VG08 is:


    ```

    # lvcreate -l 30 -i 3 -I 32 -n stripedlv VG08

    ```


