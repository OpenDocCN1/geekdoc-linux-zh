    # THE DANGER OF LOG JAMS


    One specific concern in terms of disk usage is log files. The nature of any log
    file is that it is a continuously growing file and so must be managed. Logs can
    be divided into two categories, those maintained by the operating system, and
    those associated with applications. In a simple world, I could monitor these logs,
    determine the growth rate, and budget disk space accordingly. Most of the time,
    this approach works, and Linux provides a mechanism for automatically rolling
    log files over, allowing a new log to be started and the old one renamed. The
    old log can then be pulled off disk and stored offline, freeing online disk storage
    space.


    Problems arise, however, should something go wrong that causes the log files to
    grow at an accelerated pace. It may be that the problem logged is not in itself
    serious, but if a side effect is to balloon the log file to the point that it
    fills a disk partition, then the small problem becomes a bigger problem. Unfortunately,
    it is not possible to predict when such a problem might arise. The best protection
    is to ensure that the logs are kept in a partition that, if fills, will not bring
    the application or the server down.


    Another good idea is to be careful with the verbosity of logging. Many applications
    and operating system logging functions support the ability of logging terse messages,
    or more verbose output. For debugging purposes, logs can be told to record things
    associated with the normal function of the code, as well as actual errors. Too
    often this debugging or verbose messaging flags are overlooked when the machine
    is moved into production, and a log jam results.'
