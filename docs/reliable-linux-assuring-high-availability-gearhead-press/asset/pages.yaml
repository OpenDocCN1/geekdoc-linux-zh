  md: 'As mentioned earlier, the use of software RAID is a relatively new thing, especially
    for the checksum-oriented RAID4 and RAID5 levels, due to the computing overhead
    required. Today''s servers, however, have such substantial processing power that
    is becoming practical. You will find, however, that most discussions of combined
    RAID levels often include references to combining hardware and software RAID solutions
    to get these levels to work. The assumption is that asking the operating system
    to bear the burden of not one but two sets of RAID redundancy, operations will
    have an unacceptable computational cost. Using the Linux software RAID, for example,
    you could use a hardware-based solution to create several mirrored disk pairs,
    and then provide these disks to the software RAID to form a RAID4 or RAID5 array.


    # Partial versus Total Redundancy


    One final point to consider in the construction of a RAID is how much redundancy
    you want to implement. I have already compared RAID levels and the use of a spare
    disk. You also need to consider using multiple controllers, not only to reduce
    bus congestion performance problems, but to eliminate points of failure. Some
    people will also go to the length of placing disks on separate power supplies.
    Figure 5.9 illustrates the maximum extent to which you could use RAID to protect
    yourself against hardware failure.


    # A Cautionary Note


    One important point that I cannot stress enough is that no RAID is infallible.
    Do not fall under the misconception that because you have stored your data on
    a RAID, you need not be concerned about backups. There are plenty of risks that
    can destroy an entire RAID. Examples include application malfunctions, accidental
    or deliberate erasure of data by an employee, and the loss of an entire server
    for whatever reason. Although rare, it is even possible for a single disk to fail
    in such a fashion that it brings down other devices on the bus with it. If there
    is more than one disk on the same bus, your RAID will almost certainly be destroyed.
    Also, if more than one disk in RAID is on the same controller, then a controller
    failure will also destroy the RAID. A RAID significantly reduces the liability
    of data loss due to the failure of a single disk, and is definitely useful enough
    to use a RAID, but it is not perfect. There is no replacement for reliable backups.'
  merge: -1
