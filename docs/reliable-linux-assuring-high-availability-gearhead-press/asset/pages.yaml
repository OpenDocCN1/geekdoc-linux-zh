- img_proc: true
  md: '# Glossary


    BIOS See Basic Input Output System.


    boot loader See Linux Loader.


    Bourne Again Shell The default shell supplied by most Linux distributions. It
    is a modern derivative of the bsh, or Bourne shell, named for Steven Bourne, one
    of the earliest UNIX developers from AT&T Bell Laboratories.


    BSD See Berkeley Standard Distribution.


    bus A communications bus is a standardized hardware component allowing several
    devices to share a physical grouping of electrical conductors. The most obvious
    bus in a PC is the series of expansion slots on the motherboard, which are attachment
    points for the computer''s peripheral communications bus. See also ATA, PCI, and
    SCSI.


    cron A daemon started at boot time on any UNIX systems, cron''s task is to wake
    up every minute and scan a series of data files crontabs. Each crontab lists tasks
    and a time or times that these tasks should run. When the scheduled time coincides
    with the actual time, cron executes the task on behalf of the user who created
    the crontab.


    crontab See cron.


    daemon A term common in UNIX usage that describes an operating system process
    that is usually started at boot time and runs at all times, providing a basic
    function such as name resolution or printer support.


    DHCP See Distributed Host Control Protocol.


    Distributed Host Control Protocol A communications protocol that allows a server
    to assign IP (Internet Protocol) addresses to client machines upon request. These
    addresses are not permanent, and DHCP is often used to allow machines to share
    a limited number of addresses.


    DNS See Domain Name System.


    Domain Name System The distributed database used throughout the Internet to refer
    to another machine on the Internet by a name, such as www.wiley.com, instead of
    the actual IP address of the machine.


    Ethernet Originally developed by Xerox in the 1970s, Ethernet has the dominant
    LAN technology.


    Fast Ethernet An Ethernet version having a speed of 100 Mb/s.


    file system A database that tracks the data associated with all of the files and
    directory structure held in a contiguous disk partition. To access any of the
    files in a file system during normal production use, the file system must be mounted
    into the logical file system directory tree using the mount command.


    General Public License The software license developed by Richard Stallman, creator
    of the GNU project (see GNU). The GPL, also known as a'
  merge: -1
  pgno: 433
- img_proc: true
  md: 'copyleft agreement, defines the concept of open source by requiring ware to
    be distributed with source code (see source), and preventing future restrictions
    on access to the source. More information on the GPL can be found at www.gnu.org.


    Gigabit Ethernet An Ethernet version having a speed of 1 Gb/s.


    GNU An acronym for GNU''s Not UNIX, the GNU project (www.gnu.org) was conceived
    in 1984 by Richard Stallman with the objective of producing a completely free
    operating system that would be compatible with UNIX. The GNU project today is
    one of the largest groups of active source developers.


    IDE See Intelligent Drive Electronics.


    i-node Small data entity central to a traditional UNIX physical file system database.
    Each file in a file system is assigned an i-node, which holds file metadata (see
    metadata), such as the size, ownership, date stamps, link count, and data block
    addresses of the file.


    Integrated Drive Electronics See Intelligent Drive Electronics.


    Intelligent Drive Electronics Refers to the generic technology of inte- the driving
    controller, which in older technologies was a separate peripheral card, into the
    disk drive itself. The term is commonly used incorrectly to refer to a drive made
    to conform to the ATA bus, as ATA drives have an integrated drive controller.


    Internet Protocol The addressing standard used in the Internet to uniquely identify
    a process running on any server on the Internet. The most famous element of the
    IP is the 48-bit IP address required to identify- an Internet server machine.
    The Internet Protocol is described in RFC791, RFC2460, and other RFCs.


    IP See Internet Protocol.


    kernel The core program code for an operating system, loaded into memory from
    a disk or network at the beginning of the boot process. The kernel handles core
    functions such as sharing the CPU capacity between multiple processes, managing
    real memory, performing I/O to physical devices, and in the case of most UNIX
    variants, managing traffic.


    Kern Named for its author, David Korn, the Korn adds to the syntax of the Bourne
    shell extra functionality from the C shell (the default shell in BSD UNIX) as
    well as functionality native to only itself. A version of the Korn shell called
    pdksh is available in the public domain, and is included in many Linux distributions.


    ksh See Korn Shell.


    LAN See Local Area Network.


    LILO See Linux Loader.'
