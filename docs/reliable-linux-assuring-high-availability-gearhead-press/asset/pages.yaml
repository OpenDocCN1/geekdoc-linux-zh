    # Hardware Configuration: kudzu


    The kudzu utility is the closest thing to plug and play in Linux. It is designed
    to detect and configure new or changed hardware. If you have a hardware failure
    and the replacement hardware is comparable, but not identical to the old hardware,
    kudzu can be useful. kudzu relies on the ability of the hardware to be detected
    by kernel code probes, at boot time. Any hardware detected is compared to a reference
    listing in the file /etc/sysconfig/hwconf. If there are any discrepancies between
    what was detected and the reference database, kudzu will attempt to configure
    the new or altered device. Configuration usually involves adding lines to /etc/modules.conf,
    to ensure the appropriate kernel driver modules are loaded at boot time, or when
    the device is needed.'
