    # UPS: NOTES FROM THE TRENCHES


    While testing my UPS network for this chapter, I ran across several challenges
    that raised noteworthy questions. The first was an instance of version confusion.
    When the test network (shown in Figure 3-4) was set up, the UPS server (sandbox)
    was running Red Hat v7.0, while the client (deut) was a Red Hat v7.1 installation.
    In a simulated power failure test, the server behaved properly. The client seemed
    to be communicating properly with the server, and informed that the battery level
    had gone critical executed its SHUTDOWNCMD. Yet, Linux did not shut down and the
    still-running machine had its power cut off when the server shutdown finished
    and turned off the UPS. Researching the problem, I discovered that Red Hat v7.0
    shifted version 0.44.0 of nut, while v7.1 shifted nut version 0.44.1. It turned
    out that the function that parses the upsmon.conf file changed between versions,
    requiring the text of SHUTDOWNCMD to be a quoted string if it contains blanks.
    The string in my example was /sbin/init 0. Without the quotes the newer version
    of nut running on the client dropped the argument 0 from the string, and just
    just /sbin/init as the shutdown command. Unfortunately, the command /sbin/init
    alone does nothing.


    Each distribution and each version of each distribution will contain different
    packages at different revision levels. Consequently, if you have problems getting
    two Linux servers to cooperate, check which distribution and version they are
    running, then see if, as a result of distribution differences, you are running
    different versions of the same package. For an rpm-based distribution, you could
    use this command to determine, for example, what version of nut you have:


    ```

    $ rpm -qi nut

    ```


    (continues)'
