    \nOne of the useful things about xinetd is that it can be configured for logging.\
    \ The log_type directive in an xinetd configuration file can specify logging via\
    \ syslog, or to a specific named file. As always with logging, care must be taken\
    \ to make sure that the log file does not grow large enough to cause problems.\
    \ One feature of xinetd is the ability to control the size of the log file right\
    \ in the xinetd configuration. For example:\n\n```\nservice telnet\n{\n    flags\
    \ = REUSE\n    socket_type = stream\n    wait = no\n    user = root\n    server\
    \ = /usr/sbin/in.telnetd\n    log_on_failure += USERID\n    log_type = FILE /var/log/telnet.log\
    \ 10000 11000\n}\n```\n\nThis file, placed in /etc/xinetd.d, would set up logging\
    \ for each successful telnet session, logging to the file /var/log/telnet.log.\
    \ When the log exceeds 10,000 bytes in size, a soft error is returned to syslog\
