    # Managing RAID Arrays


    You now know the theory of the different RAID levels and how to configure them.
    This final section talks about the commands you will need to initialize and manage
    your RAID arrays once you have configured, including procedures for replacing
    failed disks. Please note that these examples are based on the RAID drivers for
    the 2.4.5 kernel release level. If you are working with a different kernel, some
    of the commands and log output will almost certainly have changed, like many elements
    of Linux, the RAID tools are under constant revision and improvement.


    # Initializing Your Array


    Having partitioned your drives and created an /etc/raidtab defining the RAID you
    want, the next step is to initialize the array. This ensures that all of the disks
    in the array are available, writes RAID superblock information to the disks as
    necessary, and, if mirroring or checksums are involved, makes sure that any data
    that needs synchronization gets it. The command that does the task is mkraid.
    You will pass mkraid as an argument name of the array in /etc/raidtab that you
    initialized. This is what it will look in the case of a simple one-pair RAID1
    mirrored array.'
