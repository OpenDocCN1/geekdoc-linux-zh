    in cylinder size. The concept of the disk cylinder stems from the early days of
    hard disks when the drive was divided into allocation blocks built around the
    actual read/write heads inside the drive and the number of pie-shaped data sectors
    laid out on the media platters. This can get complicated because ATA and SCSI
    drives deal with this issue differently. (Good references includes the Linux Partition
