    the early stages at this point in use in a reliable production server. If both
    client and server will support it, NFS 3 is the best choice. Unfortunately, although
    the current Linux kernel supports NFS 3, not all NFS clients or non-Linux servers
    support version 3. As the saying goes, your mileage will vary.


