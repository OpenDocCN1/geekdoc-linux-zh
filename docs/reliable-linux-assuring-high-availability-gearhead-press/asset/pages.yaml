    on ATA cables, and an increase with crosstalk (erroneous signals created in one
    cable conductor arising from the magnetic field created by the signals flowing
    in another). If you try to stuff too many ATA drives and controllers in one case,
    it it gets mighty crowded, and the likelihood of data errors arising from cabling
    congestion rises. In short, ATA does not scale to large numbers of drives.


    # Hot Swapping ATA Drives


    In my examples so far I have suggested using mirrored RAID arrays to achieve disk
    redundancy so that if one of the drives fails, the server should keep going until
    you can replace the bad drive. With standard ATA drives, however, you will need
    to bring the server down in order to safely replace the failed unit. The ATA standard
    does not support the ability to hot swap (replacing drives while the machine is
    running) in any fashion. If you need the speed and downtime reduction hot swapping
    gives, you can buy a hardware ATA RAID unit. These typically are a pair of standard
    ATA drives installed into either an external enclosure or special internal bay
    that allows the drives to be safely hot plugged. The reason for this being done
    is to use the drives as a RAID1 array, these units usually supply a modified ATA
    controller that takes care of the RAID mirroring in hardware. To the operating
    system, the pair of drives looks like a single ATA drive, and using the Linux
    software RAID is unnecessary. These units have the advantage of simplicity, although
    the extra cost of the hot plug enclosure and RAID controller hardware may outweigh
    the benefits of the cheaper ATA drives.


    # Serial ATA (SATA)


    SATA is the next generation of the ATA bus, currently in the draft specification
    stages. It offers significant improvements over the current standard,'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Choosing the Right Hardware


    and should be a welcome advance. SATA supports very low voltage signaling (250
    millivolt) necessary to support better chip technologies. It is a serial rather
    than parallel bus, eliminating the bulky, length-limited 80 conductor cable and
    addresses the contention problem in the current standard wherein the master and
    slave device on a bus must contend for the available bandwidth. This helps performance,
    with the draft specification starting at an impressive 150 MB/s and projecting
    the possibility of as much as 600 MB/s in future generations. From a reliability
    standpoint, the significant feature of the new specification is that it will be
    hot pluggable by definition of the hardware and also the software level, as SATA
    drivers are required to be able to handle device reconfiguration by hot plugging
    as a basic functionality. Perhaps the best thing about SATA is that it is entirely
    backward compatible with the existing specification, so that current ATA drivers
    should need little or no modification. SATA could conceivably a future challenger
    in larger servers to the current big iron monarch, SCSI. Stay tuned.


    # Small Computer Systems Interface

    (SCSI) Drives


    SCSI is the drive technology commonly associated with larger server environments.
    SCSI is a more functional environment than ATA. While ATA really only defines
    a communications interface, SCSI defines a bus architecture, each SCSI device
    has its own intelligent controller, talking to other devices to manage the flow
    of data on the bus. One would compare SCSI with something like the ISA or PCI
    bus architectures, which multiple devices can be connected to and share a fast
    communications channel. SCSI is much more sophisticated in its management of shared
    resources than ATA. In a busy multi-disk server, for example, multiple requests
    will be issued to multiple disks. An ATA controller would service the requests
    in order, while the SCSI bus is capable of sorting the requests by device, so
    that once a disk is active and supplying data to the bus, several requests outstanding
    for that disk will also be served. This makes much more efficient use of the bus,
    speeding data flows and reducing the amount of work a disk may need to serve data.
    Although this is really more a performance issue than a reliability one, it is
    not entirely unrelated, since anything that causes bottlenecks can result in serious
    enough problems in applications to blur the line between performance problems
    and reliability problems. Because SCSI works better in larger environments, it
    is the disk technology of choice for most middle to large servers.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# SCSI Scalability and Reliability


    Possibly the most significant benefit of SCSI is its scalability. Because it was
    designed from the start to be a multiple device bus, a single SCSI controller
    can support either 7 or 15 disk devices, dependent on the SCSI version you choose.
    Performance issues generally restrict to the maximum allowable number of devices
    per controller, as typically each device is fast enough that the bus will become
    congested before the maximum number of devices is reached. However, as this leads
    to the use of multiple controllers, there is a benefit in increased reliability.
    If you want to implement disk redundancy by mirroring, putting each copy on a
    different controller protects you from controller loss as well as disk loss. The
    performance cost of mirroring data is as bad as the cost of a congested bus! You
    will find that it is one of those unfortunate principles of life that whatever
    you do to improve reliability carries a performance penalty.


    Due to the scalability of the SCSI bus, disk manufacturers associate it with larger
    commercial usage, and place a stronger emphasis on quality and reliability in
    their SCSI products. This can be inferred from the higher MTBF figures for SCSI
    drives. The earlier discussion of ATA led to the service life and warranty period
    as a more important measure of reliability than MTBF numbers, Based on the scalability
    of SCSI and a larger number of drives, the MTBF figures could become important.
    It is clear when the number of drives is high enough for the aggregate drive up
    to exceed the MTBF figure, in which case I expect failures in advance of the service
    lifetime, as I explain in the sidebar, “Understanding MTBF Figures.\ On the other
    hand, I have seen MTBF figures for SCSI drives of 1,200,000 hours, in which case
    I would need to have at least 27 drives before I would expect failures in less
    than a five-year service life.


    # SCSI Redundancy


    As SCSI scales well, it has always been associated with larger, more expensive,
    and often mission critical servers. Consequently it is much easier to find hardware
    redundancy solutions for SCSI disks than for ATA devices, and hot plug SCSI is
    common. Numerous vendors sell a variety of hot plug SCSI products, ranging from
    external disk enclosures, to server cabinets incorporating hot plug bays and controllers.
    As SCSI cabling can be a cause of trouble, I prefer hot plug drive bays that allow
    for cableless operation. In these units the drive itself is mounted in a skeleton
    frame carrier that can be plugged into any open bay. The address of the drive
    will be'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Choosing the Right Hardware 53


    determined by the bay it is plugged into, eliminating the possibility of duplicate
    addresses and fiddling with drive jumpers or software setup code. These drives
    make use of a specialized connector that adds extra pins to the normal SCSI connector
    for power and SCSI address. So-called long pins are used since some connections
    need to be made before others during a hot plug insertion or removal. These are
    known as Single Connector Attach (SCA) drives. Although these tend to be more
    expensive, they are the cleanest way to replace disk hardware quickly, safely,
    and reliably that I have seen.


    At the moment, however, there is a restriction to hot plugging at the Linux end.
    The current SCSI driver does not respond gracefully to a hot plug event as might
    be desired. The 2.4 kernel has a provision for dynamically inserting a new SCSI
    device without a reboot. The problem is if the new device has a different bus
    ID than the one replaced, or if it is new device, it may affect the identifier
    given by the kernel to existing devices. This has the potential to cause confusion
    to a variety of things that rely on the device identifier and could cause serious
    problems. The problem is solvable, but as it affects a number of different operating
    system levels, will take some time for the necessary changes to filter through
    everywhere they are needed. There is an additional problem in the mechanism used
    to detect that a hot plug has occurred. There is code in development to do this,
    but it is in the early development stages at the time of this writing. There are
    currently Linux solutions to this issue, specifically in the cluster products
    discussed in Chapter 10, "Server Clustering." If you want to implement hot plug
    SCSI devices in the future, make sure your kernel version will support it. Information
    on the state of the hot plug project for Linux can be found at linux-hotplug.sourceforge.net.


    # SCSI Bus Termination


    There is at least one common to any type of SCSI device, and that is termination.
    SCSI is a bus architecture, each device attached in a daisy chain to the next,
    with the controller attached somewhere in the chain, too. Data signals can originate
    from any device and will travel up down the bus to reach the controller. The daisy
    chain ends somewhere, however, and this creates an electrical problem. When a
    signal reaches the end of the cable, it doesn''t just fall out onto the floor
    (honest, it doesn''t). Instead it reflects and travels back down the cable in
    the direction it came. Passing through each device on the bus it reaches the opposite
    end of the cable and reflects again. The signal weakens with every trip, and eventually
    fades to black, but if this were allowed to happen with every'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Building a Reliable Server


    signal, the reflections would become hopelessly muddled up with the true signal,
    and reliable communication on the bus would be impossible. It''s rather like interference
    on a radio. There is music playing in some-where, but you can''t hear it for the
    static.


    The problem is solved by a terminator. This is an electrical device attached at
    each of the two ends of the bus. It''s job to absorb data signals when they reach
    the end of the cable, preventing any reflections. In the early SCSI buses, these
    terminators were visible plugged into the last connector at each end of the cable.
    In modern SCSI based servers, the terminators can be a bit more elusive. SCSI
    devices, for example, include an internal terminator. Should the device be the
    last one on the cable, this internal terminator needs to be activated. This is
    often done with a jumper setting on the drive itself. If the controller is the
    last device on the chain, a jumper or a software set may do this. If a device
    is added or removed from a SCSI bus, it is critical that you do not overlook this
    issue. The removed device may have provided the termination using a terminator
    to the drive. In the replacement is new or came from the middle of another SCSI
    bus, its terminator may not be activated. If the bus is not properly terminated
    at both ends, it will not work. If you accidentally place a terminator part of
    the way along a bus, all devices between the misplaced terminator and the end
    of the bus will be cut off, and will not work. These terminator woes are a common
    cause of SCSI problems when reconfiguring or repairing servers, but they can be
    avoided with proper planning and foresight.


    # Single Ended versus Differential SCSI


    The original SCSI standard was termed a single ended (SE) bus. This referred to
    the way in which electrical data signals on the bus were interpreted. In an SE
    system, a positive voltage is considered to represent a binary one, while zero
    voltage represents, of course, binary zero. This is simple and cheap—two lasting
    advantages that made it a popular choice. Problems arise with SE, as cable lengths
    grow, and become crossed or damaged. These problems can lead to signals that are
    weakened or corrupted. What starts out as a binary one at a device on the bus
    may be close to zero by the end of the bus to be interpreted as such. The original
    standard used two conductors to carry each signal, one for the signal and one
    for a reference ground voltage. The solution proposed was to use a system of voltage
    differences to carry the signal and so'
  merge: -1
  pgno: 77
- img_proc: true
  md: '# Choosing the Right Hardware 55


    was called differential SCSI. A binary one signal would be carried by sending
    a positive voltage on one conductor and the opposite negative voltage on the other.
    A zero would result in zero voltage on both conductors. The receiving end, the
    difference on the voltages would be compared. The difference between the positive
    and negative voltage was a relatively large value, where the difference between
    the two zeroes was negligible. It was really a simple form of amplifying the signals.
    The purpose of this was to increase the reliability of the bus by reducing its
    susceptibility to signal fluctuations and also increase the maximum allowable
    cable length. The signal reliability was critical to support the higher bus speeds
    the new standard allowed, and the larger number of devices on the bus meant separate
    disk enclosures that may need to be several feet away from their servers.


    In its first form, differential SCSI used a higher signal voltage than the current
    design and is now termed High Voltage Differential (HVD) SCSI. It was electronically
    expensive to implement and not widely used. The current standard defines a low
    voltage modification Low Voltage Differential (LVD) SCSI. It is important not
    to mix an older HVD device with a new LVD device because the LVD device can be
    damaged physically. Also, the terminators used for HVD SCSI are not the same as
    for LVD, and SE devices use a different kind of terminator again! If you use the
    wrong terminator, the best you can hope for devices or controllers that the kernel
    will not be able to see; the worst is damage to devices or controllers. Don''t
    experiment on your production machine. Make sure you have the proper hardware
    before you turn anything on.


    # Understanding the Rainbow of SCSI Flavors


    SCSI technology is more than 20 years old and has spawned a number of variations
    in its history. It started out in 1979 as a creation of Alan Shugart of Shugart
    Associates. The original standard was adopted as an American National Standards
    Institute (ANSI) standard and was first published in 1986. Today the SCSI standard
    is maintained by technical committee 10 of the NCITS, a sibling committee 13 of
    ATA fame. Information about committee 10 and SCSI standards can be found on the
    Web at www.t10.org. If you are considering a SCSI-based storage solution for your
    server, you will need a program to understand the different versions; otherwise,
    it can get very confusing. There are also some pitfalls that can cause serious
    problems when you start mixing and matching different devices. I''ll point those
    out, too.'
