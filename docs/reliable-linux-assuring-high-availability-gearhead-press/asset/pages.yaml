  md: '# UNDERSTANDING MTBF FIGURES


    If you examine the specifications for a typical hard drive, there will be a Mean
    Time Between Failures (MTBF) number often quoted. For most drives, ATA or SCSI,
    these range from 300,000 to over 1,000,000 hours. Translated into years, that
    would imply a drive lifetime of 34 to 114 years! This seems rather fantastic.
    What you need to realize is that this is intended to be applied to a group of
    drives, not an individual drive. Further, each drive in the group still has a
    rated service life that is not to be exceeded.


    Let me give some examples. Consider a drive with a rated MTBF of 525,000 hours
    (about 60 years) and a rated service life of five years. A group of 12 of these
    drives running for five years would therefore accumulate an aggregate of 525,000
    hours of use, and based on that aggregate number you should expect one them to
    fail somewhere in the five years. If you had a group of 60 drives, you might reasonably
    expect at least one failure somewhere in the group after only one year of operation,
    considerably less than the service lifetime. On the other hand, if you had only
    six drives, they would accumulate only one half the MTBF figure at the end of
    the service life of the drives. At that time the manufacturer would expect you
    to replace the drives, as they have reached the end of their service life, and
    go on another five years with six new drives. Somewhere in the ten years of service
    you would expect to see at least one failure.


    So, in cases where you have a small number of drives, the MTBF figure is really
    not terribly significant, the service life is what you should be most concerned
    with. On the other hand, for a large numbers of drives the MTBF would be useful
    for predicting the number of failures you would expect to see on an annual basis.


    Motherboard manufacturers soon added dedicated ATA controllers directly on their
    boards, however, allowing the drive to access the bus without using an expansion
    slot. It is a fundamental limitation of the ATA standard, however, each of these
    controllers supports only two devices. That becomes a limiting factor in a reliable
    server because the standard motherboard commonly has only two ATA controllers.
    Let me show you an example.


    If you want to implement a single level of disk redundancy, you could choose to
    install two identical drives and mirror them using the software RAID capability
    of the Linux kernel (I’ll be showing you the details of how to do this in Chapter
    5, “Building Reliable Disk Storage”). You will also want a CD-ROM drive for software
    installation and maintenance purposes,'
