    # Linear RAID


    The benefit of a Linear RAID is an increase in storage management flexibility.
    One of the classic challenges in managing storage is to be able to predict and
    deal with disks that become full. It would be convenient if the volumes of data
    we deal with had shrunk as they grow. Unfortunately, this has not been my experience.
    The English satirist C. Northcote Parkinson Parkinson''s Law, which states that
    work expands to meet the time available for its completion. I suggest a corollary:
    Data expands to meet the space available for its storage. With this mind, prudent
    administrators will do their best to guess how much storage space is needed for
    an application in the future. As the space allotted approaches fill, the administrator
    has to prepare for a restructuring weekend when new disks are installed; new,
    more spacious partitions and file systems are made; and the old data is moved
    into its later quarters. If the file system could be extended beyond the size
    of the disk, it would be really useful if two or more disks could be concatenated
    to provide the storage for such an enlarged file system, and that is possible
    using a Linear RAID.


    Each successive disk in a Linear RAID is written serially, as illustrated in Figure
    5.1. By I mean that if there were three disks in the array, writing would start
    at the beginning of the first and spill over to the second when the first is completely
    full, and so on to the third or more. Note that I have illustrated the array as
    it would look immediately after four new files have been created in a new file
    system, the files are not fragmented. If files are deleted, added, and edited,
    they will become more and more fragmented; the Linear RAID will not do anything
    to stop this natural process of file fragmentation. You can see that there is
    no storage redundancy in Linear RAID.


    There may be a marginal performance improvement once data has spread more than
    one device. For example, if two pieces of active data find themselves on different
    disks, operations on the data would be performed in parallel, to the best extent
    to which the hardware is capable. The size of the disks in the array need not
    be similar, or even close similar.


    There are other terms commonly used to describe what Linux calls Linear RAID.
    You may hear it referred to as disk spanning, or by the acronym'
