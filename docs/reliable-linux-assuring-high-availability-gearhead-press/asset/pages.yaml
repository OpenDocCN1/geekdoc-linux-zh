  md: '# 100 Building a Reliable Server


    In the next section I''ll look at some alternatives to tape, and where when they
    may be a good choice for you.


    # Compact Disc-Based Backup


    The CD is another Sony invention. Like DAT, CD technology was originally applied
    to digital audio data and later adapted to the storage of generic digital data.
    Unlike the DDS standards, however, the capacity of a single CD has not changed
    since its inception, although transfer rates have risen significantly. A data
    CD stores only 650 MB of data. Apart from this significant limitation, the CD
    has much going for it. It offers much faster location times than tape, and data
    transfer rates equal to the fastest tapes. Manufactured CD discs, although by
    no means indestructible, are less sensitive to dirt, humidity and magnetic fields
    than are magnetic tape media, and so should have longer lifetimes. The CD is very
    compact, and is easy to load and unload, as there is no tape threading and transport
    required. Also, reading a CD involves no contact between the read head and the
    CD, so there is no wear involved even if the CD is read and reread times.


    # Compact Discs: CD-ROM, CD-R, and CD-RW


    There are several acronyms used to describe data CDs. As they are rather inaccurately
    used, they benefit from some explanation. CD-ROM literally stands for Compact
    Disc Read Only Memory, which means that a CDROM, once created, can never be altered;
    it is a read-only media. This is the acronym often applied to what, for lack of
    a better term, I call manufactured CDs. I mean CD copies of which have been mass-produced
    in a factory. The data on such a disc is physically and permanently imprinted
    on a foil layer on the top of the plastic disc. This process cannot be reversed;
    hence, once made the CD is clearly a read only media, and as the information is
    physically stamped into the foil it is very durable, assuming the disc does not
    get damaged. This is fine when the requirement is to-produce many identical CDs
    and its advantages for software distribution are obvious.


    The cost of the manufacturing process, however, makes it useless when a backup
    requires just one CD, not thousands. To easily create a single unique disc, two
    technologies, CD-R and CD-RW, were developed. CD-R allows a CD to be made using
    a generic disc. Instead of physically imprinting the data onto a layer in the
    CD, a CD-R drive uses a small laser to heat up a layer of dye encased in the blank
    disc. The heat permanently'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Choosing the Right Hardware 101


    discolors the dye to store the data. Because the discoloration is permanent, once
    written the CD also becomes a read-only medium. As the information is held in
    a dye layer, it is not as robust as the foil layer of a manufactured CD and is,
    in fact, sensitive to deterioration over time, largely as a result of exposure
    to light. If stored in a cool, dark location, however, CD-R discs are rated to
    survive at as long or longer than the most optimistic lifetimes of magnetic media.


    A CD-R, then, would seem a possible alternative to tape, for smaller data sets.
    Tape, however, can be erased and reused; a CD-R once burns tape. Enter CD-RW.
    A CD-RW disc can be written, erased, and rewritten multiple times. To achieve
    the erasability, the CD-RW uses phasechange technology, relying on certain dyes
    whose relation to light can be changed by exposure to certain temperatures. Like
    a CD-R, a CD-RW disc is a dye layer and a CD-RW drive imprints the data on them
    by using a laser to selectively heat the dye and thus reprint the data pattern.
    What is different about the CD-RW is that a subsequent operation that heats the
    dye to a higher temperature will reverse the process, effectively erasing the
    disc and allowing it to be rewritten with new data. The CD-RW carries the improved
    resistance to moisture, wear and magnetic fields offered by a CD-ROM or CD-R,
    and is erasable,


    CD-R, and CD-RW offer a good flexibility of durability and functionality, but
    there is still the 650 MB storage limitation. A CD-based backup solution is a
    viable alternative to tape for small data sets. Is there a future in for larger
    data volumes? For the answer, let''s look at DVD.


    # Digital Versatile Disc


    Digital Versatile Disc (DVD) is the newest CD-style storage media. Its development
    was driven by the digital video market, but like DAT and CD, has been subsequently
    turned towards the task of data storage. Use of the DVD standard for data backup
    is new, and standards are just emerging. One of the options is the DVD+RW offering
    from a consortium including Hewlett-Packard, Philips, Sony, and others. Using
    the same phase-change technology as CD-RW, DVD+RW supports a double-sided disc
    storing 9.4 GB available at a transfer rate in the region of 2 MB/s. DVD+RW uses
    the Universal Disc Format (UDF) file system structure, designated as the successor
    to the older ISO9660 format used on all CD devices to date. UDF is supported in
    the 2.4 kernel, so there should be no major obstacles to using DVD+RW in a Linux
    environment.


    With the first generation of this technology already supporting almost 10-GB capacity,
    and the attractive nature of the media stability and size,'
