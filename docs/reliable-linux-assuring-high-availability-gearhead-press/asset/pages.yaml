    # Network Information Service (NIS): ypbind, passswadd, ypserv, and portmap


    NIS is a client/server utility that allows centralized management of several key
    configuration files, primarily those defining the user database, /etc/passwd and
    /etc/group. An NIS client holds copies of these files locally, but they contain
    a few entries. If a user attempts a login to the client and their user id does
    not appear in the client''s local /etc/passwd, the client makes a call to its
