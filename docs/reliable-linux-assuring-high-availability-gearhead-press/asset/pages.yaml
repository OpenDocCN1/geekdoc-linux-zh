  md: '# Quarter Inch Cartridge (QIC): The First Linear Tape Technology


    The earliest linear scan tape drives were in fact the first tape drives period,
    and were originally large open reel tape decks. The first practicable cartridge
    tape was the QIC standard, introduced by 3M in 1972. Using a tape 1/4 inch wide,
    the earliest QIC standard used the floppy drive controller as it'' interface to
    the system bus and stored only 40 MB of data. Many years have passed since then,
    and there are now more than 100 different QIC standards. 3M rationalized this
    uncontrolled explosion of competing QIC standards into the Tran series of standards,
    which has become another way of saying QIC. The state of the art in the Tran standards
    is the TR-5 specification, giving a capacity of 10 GB and a transfer rate of 1
    MB/s, with an impending TR-6 standard that should double the TR-5 numbers. Drive
    units are available with both ATA and SCSI interfaces, and also a few using USB,
    which is now supported in the new 2.4 kernel.


    # Digital Linear Tape (DLT)


    DLT is a half-inch linear tape similar in principal to the QIC standard, but designed
    for larger-scale, heavy-duty operation. The current standard is known as Super
    DLTape and supports a single cartridge capacity of 200 GB at a 20 MB/s transfer
    rate. The standard is projected to be capable of eventually supporting up to 2
    TB per cartridge. DLT is unlike QIC in that it is a single-reel cartridge, requiring
    all of the tape to be drawn out of the cartridge onto a take reel inside the drive
    during operation, with the tape returned to the cartridge before removal. The
    idea is to maximize the physical storage density of the cartridge itself by eliminating
    the other space taken in the cartridge by an empty tape up reel. This requires
    a mechanism that can hook the end of the tape to begin to draw it out of the cartridge
    after it is inserted into the drive. The physical mechanism used in older standards
    sometimes gave trouble in this regard, but the current standard claims a much
    improved and robust means of doing this.


    DLT is a popular technology in mid-size to large data installations, and has a
    substantial installed base. DLT drives commonly start at a 40 GB capacity and
    go up from there, with multiple cartridge tape library units common. The interface
    is normally some flavor of SCSI, with larger tape 얘기를 towards Fibre Channel.'
