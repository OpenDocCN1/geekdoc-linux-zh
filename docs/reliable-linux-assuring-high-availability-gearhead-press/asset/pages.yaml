- img_proc: true
  md: '# Choosing the Right Hardware 75


    able worst case. I would point out that in my of the world, central Canada, we
    experienced an ice storm in the winter of 1998 that not only broke, obliterated
    all known historical records. Miles of high-voltage distribution lines were brought
    down, and some areas were without power for weeks, despite the best efforts of
    an army of power utility workers drawn from hundreds of miles around. My point
    is that your strategy must have two phases. In the short term, you can use a UPS
    to cover and hope that you don''t find yourself helping to break any more disaster
    records. If the worst happens, however, you need to be able to detect when you
    are reaching the end of your UPS battery capacity and shut down your server cleanly
    before the juice runs out and it crashes. In order to do that, the server and
    the UPS have to be able to talk to each other.


    # The Network UPS Tools Package (nut)


    There are several competing Linux packages to manage communication between a server
    and a UPS. I will focus on nut, which is the Red Hat ships with its distribution.
    Most UPS units have the ability to report operational information back to the
    server they support through a dedicated hardware connection, usually an RS-232
    serial connection. Using this connection, the server can query the UPS to determine
    things such as the current state of charge or incoming line voltage. In turn,
    should the line voltage fail, the UPS will start supplying power from its battery
    and inform the server that it is now running on battery power. At this stage the
    server needs to make a decision. How long should it continue to run on battery
    power before shutting down? If the UPS has sufficient capacity, the server may
    decide to run for a pre-determined period of time before getting concerned. If
    the power returns before that time period has elapsed, the UPS will inform the
    server and operation de-terns to normal. On the other hand, if the power has not
    returned and the battery is running low, the server should really use the remaining
    battery power to cleanly shut down. Although this means downtime, at least the
    server will not crash and risk data loss or corruption. As soon as line power
    returns, the server should automatically restart.


