  md: '# THE TOWERS OF HANOI


    It is said that in the Temple of Brahma in Benares there is a dome that marks
    the center of the world. Under the dome there is a brass plate upon which there
    are three diamond needlepoints, a cubit high and as thick as the body of a bee.
    God placed 64 gold disks on one needle at the time of creation. It is task of
    the priests to move these disks from the pin upon which God placed them to another,
    one disk at a time, never placing a larger disk on a smaller one. When they complete
    their task, the universe will come to an end. The incremental dump rotation introduced
    in the main text is based on this famous problem in mathematics, which was first
    published by the French mathematician Eduard Lucas in 1883. The increment levels
    every other day is similar to the sequence of moving disks from one pin to another
    necessary to solve the problem. The problem actually has several solutions and
    has been used as a programming challenge in colleges for many years. If you are
    concerned that the priests are nearing the end of their task, consider that with
    64 disks it requires 2^64-1 moves to complete the task. Assuming the priests move
    one disk each second and make no mistakes, it would take around 585,000,000,000
    years to finish.


    You continue through the rotation, changing the dump increment accordingly each
    day. After several months or so, the daily and weekly tapes should get rotated
    out of the dump cycle and fresh tapes brought in.

    It should be clear that keeping track of which tape is which is critical to the
    success of an incremental backup scheme. If you get the tapes mixed up, there
    is no way you can hope to do a successful restore operation. For some reliable
    methods of labeling the tapes is an absolute necessity. For a smaller size using
    a single tape drive unit and handling tapes manually, simply physically labeling
    the tapes should be sufficient. It is also possible to include data in the header
    of the tape itself, and I strongly recommend that you do this as a backup and
