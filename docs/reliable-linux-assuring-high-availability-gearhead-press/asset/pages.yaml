    As on the master server, add a run-level directory link to start ups, reboot to
    ensure that the daemons will start properly . . . and you are finished.


    # Soft Power Switches


    One thing you need to be careful of in any UPS supported server is the called
    soft power switch. These are popular in ATX case power supplies and can be a problem
    if you aren''t careful. The idea of the soft power switch is to make the hardware
    power switch controllable by BIOS software. The operating system can talk to the
    BIOS, so if the BIOS can turn the power off, then this allows the operating system
    to turn the power off, too. As far as shutting the system down, this poses a problem
    for the nut configuration I have just described because the power needs to be
    shut off at the UPS, not at the server. If the soft power switch is used to shut
    off the server, then the server cannot also shut off the UPS, and vice versa!
    A further problem arises when the power comes back on. In a soft system, the user
    normally needs to physically push a momentary contact switch either on the server
    case or on the keyboard to switch the power supply on. In a UPS configuration,
    you want the server to power up automatically as soon as the UPS detects a line
    of power. Being physically present to push the switch should not be required.'
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Choosing the Right Hardware


    Fortunately, most systems that use the soft power concept have support in the
    BIOS to turn it off, or allow you to specify that the power should switch on as
    soon as power is supplied externally. Make sure you have set these values properly,
    or your server may not power up following a shutdown. Personally, I prefer to
    source a power supply that does not bother with soft power at all. That makes
    one less thing that can go wrong.


    # Useful nut Clients


    Once you have your nut configuration up and running, there are a few more useful
    things you can do with it. The upscm command is a client of the upsd, and you
    can ask upsd questions regarding the state of the UPS. The amount of information
    you get back varies with the model of UPS, but it can include information on the
    battery condition, the power now being drawn by the server, line voltage, line
    frequency, and other information all of which is useful for keeping track of the
    power state of your UPS. For example, here is some sample output from the upscm
    command run on the client host:


    ```

    # upscm apc700@192.168.1.200

    host:apc700@192.168.1.200

    MFR:APC

    MODEL:SMART-UPS 700

    SERIAL:WS9733080979

    STATUS:OL

    UTILITY:121.5

    BATTPCT:100.0

    ACFREQ:60.0

    LOADPCT:045.7

    BATVOLT:26.52

    OUTVOL:122.2

    UPSTEM:041.8

    UPSIDEN:UPS_ID

    LOWXFER:103

    HIGHXFER:132

