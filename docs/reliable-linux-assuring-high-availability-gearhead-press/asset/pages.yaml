  md: '# CHAPTER

    #6


    # # Monitoring Linux in Production


    > > “Come, Watson, come. The game is afoot!

    > —Arthur Conan Doyle’s Sherlock Holmes


    Once you have installed and configured your server, the job has just begun. Now
    that it is in production, it must be watched to ensure that everything continues
    to function normally and that no resource limits are being approached. Monitoring
    must be automated because random checking of a few critical values will not ensure
    high up times.


    This chapter gives you two approaches to monitoring. You may want to write your
    own monitor scripts. In this case, you will need to know what to watch and how.
    I’ll lay out a basic framework for what you need to watch and sample scripts suitable
    for you to customize to your own needs and create your own monitor package. Alternatively,
    you may choose not to write your own monitors, but source a system-monitoring
    software package. Several are available. I’ll review some of them at the end of
    this chapter to enable you to see how they might fit into your system. No matter
    what approach you choose, however, you need to start by considering what should
    be monitored.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# What to Watch?


    You should be concerned about two basic areas: resource exhaustion and errors.
    Resource exhaustion means situations in which a system resource (such as disk
    space, real memory, or CPU capacity) is approaching the point at which it is exhausted.
    While this may not bring the server down, it will affect the server''s ability
    to function properly. If the situation is not addressed, it will affect other
    tasks in other areas. Eventually, it can escalate into a serious problem. Some
    people may see this as a performance issue rather than a reliability issue, but
    performance issues leave unattended eventually become reliability issues. Why
    not solve them sooner? Then you get better performance and good reliability.


    The other area of concern is actual errors that can be either software or hardware
    errors. The primary tool in this case is log buffers and log files. Watching,
    then, involves examining logs. Of an error that doesn''t get logged is a difficult
    error to find in a log, so the first thing to do is to make sure the right events
    are being logged. Then, the next challenge is watching the logs. Short of hiring
    an army to pore over pages of logs daily, you want some kind of automated to examine
    logs with an eye to picking what matters.


    The bulk of log files contains information on the normal function of a hardware
    or software component. Often the secret to seeing what matters in a log is to
    pick out the exception, what is not usually in the log. The key to this is to
    build some form of intelligence into an automated log checking system. You may
    be able to do this yourself, if you know specifically what you are watching for.


    In the process of debugging a problem, it is often valuable to be able to write
    a simple script that will search for a specific log entry. On an ongoing basis,
    you may write a more complex script, or you may choose to use one of several prebuilt
    log monitor packages available. In the case of a specific software log, the application
    may itself come with a log monitor specific to that application. For generic applications
    like the Apache Web server, there are also packages available that understand
    the particular ins and outs of Apache logs.


    When a Script discovers an error worthy of note, it needs to have a means of alerting
    you. This could be an online alert such as a broadcast message or an e-mail. This,
    however, is little use if you are away from the machine. A good log monitor must
    be able to generate a page. Ideally, it will page reasonably. That is, it will
    not page for trivial problems, but needs to be loud when it really matters.'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Monitoring Linux in Production


    # When to Watch?


    Ideally, a production server should be under constant scrutiny, 7 days a week,
    24 hours a day. What may not be so obvious is time counted in a different sense.
    Many administrators tend to overlook logging and log checking for a system that
    is running well. So long as it continues to run well, what may seem fine, what
    happens when it starts to go wrong? You increase your logging activity and start
    watching logs carefully. You discover errors and address them, but the problems
    persist. You begin to realize that although the machine seemed healthy enough,
    you had overlooked underlying problems because they had not yet caused noticeable
    disruption in system operation.


    In some cases, error log entries are normal. By this I mean that some software
    will be in the normal course of correct operation entries into an error log. Sometimes
    this is just a poorly built internal error checking mechanism that reports what
    may technically be an error, but in fact will not cause trouble. Sometimes there
    are historical reasons, for example a condition that would have caused problems
    for an older version of the code that has been fixed in the current version. The
    error messaging may still persist, for the benefit of those still using the older
    version. The point is that not everything in an error log is necessarily a real
    problematic condition, and part of the Tao of error monitoring is developing a
    feel for what is serious and what can be safely ignored.


    Finally, you need to see that the time to set up logs and start monitoring is
    when the system is working well. In that case, there is no pressure and you can
    budget time to set things up well. This investment pays dividends when the problems
    arise, as you have in place a system to catch real error conditions. More importantly,
    you have established a baseline for normal operation, which is important as a
    tool. You can use this baseline to establish exceptions to the norm.


    # Where to Watch?


    Obviously, you have to watch for errors on the server itself. But, if you want
    to be paged when the server goes down, it is little use setting up the server
    to do the paging. Some vendors supply specialized hardware capable of retaining
    some basic communications abilities in the case of a server crash, but these solutions
    are generally proprietary and may not be supported in an open source context.
    Consequently, a second machine is'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'usually necessary to act as a watchdog. This implies a network-capable log
    monitoring system so that the logging and reporting machine can remotely monitor
    its servers and blow the whistle as necessary. If you have several servers, this
    one watchdog machine should be able to handle all of the necessary monitoring.
    Don''t forget to set up a monitor on one of the other servers to watch the watchdog.


    # How to Watch?


    You may want to source a package that will tackle the job of system monitoring
    or you may prefer to roll your own. I''ll start by showing the basics of creating
    your own system-monitoring tool. If you decide to go this route, you can use these
    sample scripts as the basis for your package. When you have it built, you may
    even choose to release it to the rest of the open source world.


    Even if you don''t build a functional monitor structure, these samples are useful
    for occasions when you may want to put together a small monitor on a temporary
    basis for troubleshooting purposes or to monitor something that a prebuilt package
    just doesn''t the way you want it done. If you prefer to source a package, I finish
    this chapter with an overview of some available free and commercial packages.


    # Writing Your Own Monitor


    Your monitor package needs to watch several areas. You should keep track of disk
    usage, so you need to monitor all of the file systems in use and be alerted if
    they exceed threshold values. Those thresholds need to be tunable on a file-system-by-file-system
    basis. You also want a report of the largest files on the system and of the user
    owning the most files so you can see where the disk space is going. It would be
    a bonus if you could get graphs of disk usage in the output.


    You should keep track of CPU and memory usage, being alerted for dangerously high
    usage levels, and maintain a history so you can be proactive in heading off any
    imminent shortages. There are always key daemons that must be kept running, so
    you should track those, too. There will almost certainly other servers or network
    devices that you need to be able to make contact with. If you lose touch with
    them, you need to know about it. You need a tool to watch error logs for anything
    that looks serious, and if'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Monitoring Linux in Production 225


    your hardware supports it, you will want to monitor for hardware operational parameters
    falling outside of safe limits.


    Summarized, here are seven components that would make up a comprehensive system
    monitor:


    +   - Disk usage monitor

    - File monitor

    - CPU and memory usage

    - Daemon monitoring

    - Other network servers

    - System log monitoring

    - Hardware monitoring


    In all cases, you want to be able to sound an alarm if any of your monitors registers
    a dangerous condition. As this functionality is common to all of the monitors,
    I''ll tackle it first.


    # Sounding an Alarm


    The first decision to make is: What kind of alarm? Local to the server itself,
    the most common forms of alarm are sending an e-mail, broadcasting a message to
    the system console, or if the console is a graphics console, popping up an alert
    window. You may also want to generate an alarm to an external device, possibly
    a watchdog monitoring server or a pager.


    Listing 6.1 provides a script to handle these possibilities. It is designed to
    be called from a monitor script to generate an alarm. When the monitor script
    detects the alarm condition, it calls the alarm script, passing it two arguments—an
    alarm method and a character string describing the alarm condition. The alarm
    script looks like this:


    ```

    #!/bin/ksh

    2

    # script to generate alarms

    #

    # syntax: sound_alarm <alarm method> <alarm description>

    # where:

    # alarm method = "mail" for internal e-mail notification

    # = "broadcast" for broadcast on the local host

    ```


    Listing 6.1 sound_alarm'
  merge: -1
  pgno: 248
- img_proc: true
  md: "# 226 Building a Reliable Server\n\n```\n# \"window\" to open an alert window\
    \ on the console\n# \"watchdog\" to forward an alarm to another server\n# \"pager\"\
    \ to send an alarm to a pager\n#\n# alarm description = a character string describing\
    \ the cause of\n# the alarm\n#\n# # simple input filter\nif [ $# -ne 2 ]; then\n\
    \  echo $0: Bad Args : $* >&2\n  exit 1\nfi\n# define local vars\nalarm_method=\"\
    $1\"\nalarm_description=\"$2\"\nmail_recipient=root\n\n# # do it\ncase \"Alarm_method\"\
    \ in\n  echo \"Alarm_description\" | mail -s *** ALARM *** root ::\n  (broadcast)\
    \ wall *** ALARM : \"Alarm_description\" :;\n  window) xmessage -display :0.0\
    \ -center-geometry 200x200 \\\n  \"\"date\")\n  $Alarm_description\" :;\n  watchdog)\
    \ logger -p local6.info *** ALARM ** : $Alarm_description :;\n  (pager) snmp -m\
    \ \"$Alarm_description\" admin;\n  *) echo $0:Error Unknown alarm method > $Alarm_method\
    \ <\n    exit 1\nsac\nexit 0\n```\n\n**Listing 6.1** sound_alarm (continued)\n\
    \nI have included a simple input filter at lines 16 through 20. This filter is\
    \ quite simple and is mostly there to make the point that you should do some kind\
    \ of input filtering. You should do something more robust, unless you are confident\
    \ that the calling script will be good at passing the proper arguments to this.\
    \ I have hardcoded root as the recipient of a mail alarm."
  merge: -1
