  md: '# Redundant Disk Solutions


    If that is not acceptable, you may want to consider using a redundant array of
    inexpensive disks, or RAID. This involves using several separate disks to store
    your data so that there is a complete duplicate copy of the data held within the
    array. Any one of the disks could now fail, without losing any data. If the disk
    hardware could be replaced without bringing the server down, the failed disk can
    be replaced and the data it recovered from the remaining good disks with no downtime
    at all. This is obviously an ideal solution, especially in smaller servers, due
    to the relatively high cost of the extra disk storage required. The steady drop
    in the cost of hard disks and improvements in the software implementations in
    the latest Linux kernel have made RAID a much more affordable option. There are
    a variety of different types of RAID solutions, implemented in hardware, software,
    or a combination of both. All of the variations are possible in a Linux environment.
    I devote all of Chapter 5, “Building Reliable Disk Storage,” to the topic of redundant
    disk storage.


    # UNUSUAL DISK FAILURES


    At times disks can fail for seem unlikely reasons. A colleague with a number of
    years experience in large server environments shared this interesting observation:
    "Most of the disk failures that I have experienced have happened as a result of
    shutting down a large stable system that has been running for months for routine
    maintenance. During the maintenance period of less than 30 minutes the disks stopped
    spinning and cooled. The disk alignments were affected by the change of temperature
    and they could not spin again to reboot. Your systems are at risk even when prescheduled
    extended periods of downtime occur. This would be the one time that a disk would
    fail without an error warning of any kind being logged."


    I had a similar experience with some of my UNIX workstations. This group of machines
    had the make and model of operating system disk. None of these disks failed in
    24/7 operations over several years. However, if the server were shut down for
    any reason, usually to move it to a different location in our case, there was
    a high probability that when powered on, the disk would not spin up. Using highly
    unscientific means (picking the machine up and shaking it) we could sometimes
    free the stuck platter and get the machine going. We only fully solved the problem
    by replacing the problematic drives with new ones.'
