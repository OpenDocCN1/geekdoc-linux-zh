    From a reliability standpoint, here are some basic pointers:


    If you don''t need it, don''t run it. Strangely enough, you may not need sendmail
    to send mail. Many mail client applications can generate an SMTP mail message
    and send it along to a sendmail server for forwarding entirely on its own. What
    sendail does is forward mail from one server to another. It is properly termed
    a mail forwarding agent. If you have a Post Office Protocol (POP) client on your
    server, you do not need sendmail to receive mail either. Mail forwarded to a host
    running sendmail would be held there for pickup. The hosts running sendmail would
    also run a POP daemon, allowing you to collect your mail from it.


    If you need to run sendmail, make sure it is configured to make minimum of root
    privilege. The original version of sendmail ran as root, which created an exposure
    that led to a long string of security exploits. Current versions of sendmail do
    not run entirely as root and should be configured accordingly.


    If you are running a large mail forwarder, put your mail spool directory in its
    own file system, and monitor it. If you lose your outbound network connection,
    sendmail will continue to accept and queue mail from local clients until the connection
    returns, in which case you may need significant spool space to hold that outbound
    mailbox.


    # Address Resolution Protocol: arpwatch


    The arpwatch utility tracks Ethernet address and IP address pairs. It mails when
    any of three things happen: The first is the case in which the IP address associated
    with a hardware address changes, as that could be a security violation known as
    IP spoofing. Second, it looks for the reverse, IP addresses that suddenly appear
    with a different hardware address. This could simply mean the network card in
    that host was replaced, or that someone configured a machine with the wrong IP
    address, but it could also mean someone is illegally borrowing an IP address.
    Third, arpwatch reports a change of IP address for a host name. To do this, arpwatch
    keeps a database of IP addresses, hardware addresses, and host names in /var/arpwatch/arp.dat.


    arpwatch is primarily intended as a security monitoring tool, and as good security
