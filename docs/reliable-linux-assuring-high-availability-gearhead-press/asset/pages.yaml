  md: 'the level two dump Sunday, and so on. There are only nine increment levels
    supported, so we have to stop somewhere, and as a weekly cycle is easy to work
    with, the last increment runs at level seven on Friday. Finally on Saturday the
    11th level one increment runs, catching all of the changes for the previous week.
    Now the cycle can start all over again.


    The old saying that what you gain on the peaches will be lost on the bananas applies
    to incremental backups too. This becomes evident when you examine what happens
    if you need to do a restore in the sense that the incremental backup sped up the
    process, possibly a great deal. The balance comes in the fact that the restore
    process may take longer than it would with a nonincremental backup scheme.


    Consider what happens if you lose a file system on Thursday the 23rd. The most
    recent backup was the level five increment of the 22nd. To rebuild the entire
    file system, it will be necessary to restore several tapes. The tape of the 22nd
    has only the changes that occurred on the 22nd. You will also need the tape that
    has the changes that occurred on the 21st, and the 20th, and so on. In fact, the
    sequence to restore would be as follows. First you restore the level zero tape
    made on the 4th, which brings you up to date of the 4th. Then you restore the
    level one tape of the 18th, followed by the level two of the 19th, the level three
    of the 20th, the level four of 21st, and finally the level five of 22nd. That
    is six tapes in total, and during these restores you may have restored different
    versions of some files as many as six times; hence the time you saved on the backup
    can get lost on the restore.


    Different tape rotations can somewhat reduce the complexity of the restore. Consider
    the calendar shown in Figure 7.2. Derived from the famous Towers "The Towers of
    Hanoi" sidebar, this scheme alternates odd and even backup levels. You start with
    a level zero reference on the first Saturday of the month, in this case the 4th.
    Then the restore begins. On Sunday the 5th, a level three backup captures changes
    since the level zero reference. On Monday a level two dump occurs. As the rule,
    the last lower dump level determines how far back the dump looks. So, this backup
    also captures all changes since the level zero of the 4th. This will take longer
    than the previous rotation, as this tape has to capture two days worth of changes,
    but it simplifies the restore process, as we shall see. Next, Tuesday a level
    five dump occurs, which records changes since the last lower level, the level
    three of Sunday. And so the rotation continues, each day leapfrogging the next
    until Saturday, when a level one dump saves the entire week''s changes and the
    rotation begins again.'
