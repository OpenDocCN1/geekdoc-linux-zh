  md: '# The ext3 File System


    The ext3 file system is designed as an attempt to build upon the stability and
    speed of the well-accepted ext2 standard by adding journaling capabilities to
    the existing ext2 file system. ext3 is thus a journaling extension to ext2; an
    existing ext2 file system can be converted into an ext3 file system by the addition
    of a journal log, and an ext3 file system can be mounted as either ext2 or ext3
    using a flag to the mount command to control whether the journal log is used or
    not.


    The journaling function of ext3 was written primarily by Stephen Tweedie, one
    of the original authors of ext2. One significant thing about ext3 journaling is
    that it supports both full data journaling as metadata journaling. Once support
    for journal logs on separate devices is added (which is currently in development),
    this could have a reliability benefit should the log be implemented on an NVRAM
    device, as discussed previously. There is also a branch of the ext3 project directed
    towards developing a log structured file system, which is another means of doing
    data journaling designed to offer improved data reliability. Combining the basic
    functionality of ext2 and the ext3 extensions, the feature list reads like this:


    +   - It offers a 32-bit data structure supporting a 4 TB file system size and
    a 2-GB file size.

    - ext3 can be used as the root file system and supports the l boot loader.

    - ext3 works with Linux LVM, including snapshot capabilities.

    - ext3 will support quotas and ACLs.


    In addition, in a post to the ext3 mailing list in June 2001, Stephen Tweedie,
    the chief architect of ext3, notes that there are a number of advanced performance
    features available as patches to ext2, including indexed directories for fast
    operation on large directories and tail-packing for high efficiency on small files.
    There are also ACL patches available for ext2, which are hoped to be officially
    merged into ext3 at some point. The ext3 developers also have prototypes working
    for additional ext3 specific functionality, such as using a separate disk for
    the journal. This functionality to the above list and adds up to a file system
    that can certainly compete. You should not retire ext3 as a retreat or as a case
    of extending a current technology beyond its real structural capabilities.


    As of this writing, ext3 is in the beta testing stage, however Red Hat has indicated
    to me that it intends to support ext3 as its next generation'
  merge: -1
