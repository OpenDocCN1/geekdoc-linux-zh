  md: 'restructure your disk storage such that the partition that was once /dev/sda1
    becomes /dev/sdc1 by virtue of its parent disk having been moved to a different
    SCSI address or controller. In this case there would be a discrepancy between
    the RAID superblock, which would list /dev/sdc as the first disk in the array,
    and /etc/raidtab, which may list /dev/sdc1 as the third disk in the array, for
    example, or even as a disk belonging to a different array. This is useful to prevent
    disk mixups doing serious damage to a RAID; consequently the value of persistent-superblock
    should always be set to 1. A copy of the entire RAID superblock is on each device
    in the array to ensure redundancy. It is also important when you create partitions
    destined to be elements of a RAID that flag them as type 0xfd. This ensures that
    the kernel will look for this RAID metadata at boot time.


    +   - parity-algorithm. This parameter is only applicable to RAID5 and controls
    the way in which the data checksums are written to disk. There are several possible
    patterns for laying out both the data blocks and the checksums across the disks
    of the array, and there has been a substantial amount of research into the subject
    dating ten or more years. The authors of the current RAID drivers suggest that
    in general the best one is left-symmetric. You may want to experiment with other
    choices for performance reasons; in any case, the algorithm should not affect
    data redundancy.


    +   - chunk-size. The value of chunk-size determines the amount of data written
    to each disk before moving to the next disk. This is also commonly called the
    stripe size. Don''t confuse this with the stripe width, which is the number of
    disks in the array. Look back to Figure 5.5. If this RAID5 has a chunk size of
    128 KB, then one stripe width would hold 128 KB on each of the two data chunks,
    128 KB of checksum on the checksum chunk; hence, one stripe holds 256 KB of application
    data. The stripe size for this array would be 128 KB. The stripe width would be
    three. The chunk-size parameter matters to all RAID levels except linear. It is
    still necessary to include a chunk-size value when defining a Linear RAID to keep
    the driver happy. However, its value is meaningless because a Linear RAID does
    not data stripping. The chunk-size parameter is expressed as a number of kilobytes,
    it must be a power of two, and has a maximum value of 4,096. Values in the range
    4 to 128 are reasonable. Like the parity-algorithm parameter, trying different
    values of chunk-size can improve performance, but will not significantly affect
    redundancy.'
