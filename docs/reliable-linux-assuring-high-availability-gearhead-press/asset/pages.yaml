    An array of four 10-GB disks used in a single mirror copy RAID1 configuration
    would store 20 GB of data, while the same four drives in a RAID4 would hold 30
    GB of data, with the same degree of redundancy. This RAID4 array gives the same
    level of redundancy as the RAID1 but with an improved storage efficiency of 66
    percent. If you were to expand to an eight-disk array, the storage efficiency
    climbs to seven disks out of eight, or 87.5 percent. You could even add a spare
    disk to this array and see the data efficiency drop to 78 percent, still better
    than the four-disk array. Compare this to a three-disk RAID1 array that gives
