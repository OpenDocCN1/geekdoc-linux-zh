    ```

    # tar -clvf /dev/nst0 /tmp

    # mt -f /dev/st0 rewind

    # mt -f /dev/st0 offline

    ```


    Note that the /dev/nst0 device is used rather than /dev/st0. The n in the device
    name means no rewind. This writes each of the three tarballs to the same tape
    one after the other (assuming the tape is large enough) so it is not necessary
    to keep track of multiple tapes. The first mt command rewinds the tape, and the
    second ejects the tape from the drive.


    Next comes an important issue. During system restore, will be necessary to create
    partitions and file systems on the new drive to hold the restored data. The backup
    must store the information necessary to create those partitions and file systems
    in a form accessible during the restore operation. (For my money, paper is the
    most reliable method.) These commands should dump the partition table and the
    file system table to the system default:


    ```

    # disk -1 /dev/hda > 1lpr

    # cat /etc/fstab > 1lpr

    # mount > 1lpr

    # df -kl > 1lpr

    ```


    I include the output of the mount command as well as a copy of /etc/fstab, as
    the partition name /dev/hda5 does not necessarily appear in /etc/fstab. You will
    need to know that name when you need to create the new partitions. I also include
    the output of the df command so that I know how full the original file systems
    were. If I cannot find a replacement disk as large as the original, this will
    at least tell me the minimum size I can make with. If you store these printouts
    along with the rescue diskette and the backup tape, you have a bare metal recovery
    kit.


    # Bare Metal Recovery Procedure


    Let us assume the worst, that the operating system disk fails. How do we put the
    rescue disk discussed in the preceding section into action? First you source and
    install a replacement disk of sufficient size to replace the failed one. You have
    the printed version of the disk partition table so you can make sure that your
    replacement disk will do the job. If the replacement is not identical to the failed
    disk, that is okay as long as there is enough space on it for all of the files
    you will restore. You could use two disks, if necessary, although you would have
    to alter the partition layout as you do the restore. All this is possible, but
    it is critical that you have the original partition table layout so you know what
    you need to replace. It is also'
