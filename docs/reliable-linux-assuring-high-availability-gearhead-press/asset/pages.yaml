- img_proc: true
  md: '# CHAPTER 9


    # Alternative File Systems


    > "Thus times do shift, each thing does turn hold; New things succeed as former
    things grow old.\-Robert Herrick


    Having earlier presented a discussion of disk storage hardware and then progressing
    through the RAID and LVM storage layers, we have finally reached the top of the
    storage hill, so to speak, at the file system level. File systems can be broadly
    divided into two categories: local file systems that support disk storage directly
    attached to a server, and network file systems that allow data to be stored on
    a remote device and to be made accessible to the server using a communications
    network.


    This chapter examines both categories of file systems. The state of the art in
    local file systems is considered first, and four new file designs currently competing
    for your attention are reviewed and compared. The second part of the chapter,
    three different approaches to the concept of the network file system are examined,
    each approach being represented by two implementations.


    # Local Disk File Systems


    So far I have been using the ext2 (to give it its full name, the Second Extended
    File System) in all my examples. This has been the standard Linux local file system
    for years, and it is a solid, well-tested implementation of the classic UNIX file
    system model as it was originally proposed'
  merge: -1
  pgno: 358
- img_proc: true
  md: 'over 30 years ago. This file system model, however, has always been vulnerable
    to damage in the case of a disk or system crash, in which case the file system''s
    metadata may suffer loss or corruption. The ext2 file system has no mechanism
    to recover from such loss, which places production data at risk. In recent years
    much work has been done to address this issue, and we will see this has resulted
    in several new file system implementations becoming available to the Linux world.
    Some of these are ports of order and well-tested, fault tolerant file systems
    whose origins lay in commercial UNIX variants, while one is a completely open
    source effort. To begin, let''s take a moment to review the ext2 file system so
    you can see the weaknesses inherent in it, then we''ll see what can be done to
    improve reliability. After that, we''ll look at ReiserFS, XFS, JFS, and ext3—all
    of which are alternative file systems to ext2.


    # The ext2 File System


    Chapter 4, “Installing and Configuring for Reliability,” touched on some of the
    commands that work on the structure of an ext2 file system. In this section want
    to present a bit more of the theory underlying these commands. Any file system
    is really only a mechanism for storing data objects in some fashion that allows
    the end user, person or application means of giving a name to the file and storing
    it in a known location from whence it later be retrieved for further reading or
    writing. Given that the files can contain a variety of different data ranging
    from binary code to ASCII text to database file, it is important that the file
    system not need to know anything about the objects it deals with. Accordingly,
    the ext2 file system allocates blocks of disk storage as necessary to store the
    data in the file, irrespective and unknowing of the file’s data content. To make
    these data blocks available to the user as a complete and contiguous file, the
    file system must maintain ordered lists of data blocks and the files they contain.
    In addition, the file system must supply an access control mechanism, so each
    file must also carry data concerning ownership, permissions, and date stamps.
    None of this is part of the actual file data, yet it is necessary to allow the
    file to be accessed. Data of this is termed metadata, and as we shall see, maintaining
    the integrity of this metadata becomes the primary focus of a reliable, fault
    tolerant file system.


    Consider the illustration shown in Figure 9.1. With its roots in the original
    Unix file system devised by Ken Thompson, Dennis Ritchie, and Rudd Canaday as
    long as the spring of 1969, ext2 retains the concept of the i-node (or information
    node) as the central building block of the metadata'
  merge: -1
  pgno: 359
- img_proc: true
  md: '![](img/8f0b2e54b3e875094917788f9cb87c45_360_0.png)


    **Figure 9.1** The ext2 file system metadata structure uses the traditional UNIX
    i-node concept.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Linux Reliability Enhancements


    An i-node is a small metadata entity. One i-node is assigned to each file in the
    file system at the time the file is created. Each i-node is uniquely numbered,
    which is the means by which the file it manages uniquely identified within the
    file system as a whole. The i-node stores information about the file such as the
    files permissions (or mode), the ordered list of data block addresses in the file
    system used to store the file''s data.


    The first i-node in Figure 9.1, i-node 2, points to a data file containing only
    one data block. This particular file is actually a directory file. Now you may
    think that this seems a contradiction in terms; after all, files reside in directories,
    so how can a file be a directory? In fact, the ext2 file system recognizes two
    kinds of file, an ordinary file and a directory file. The definition of a directory
    file is a file whose data represents the names of the files in the directory.
    Thus in the case of the directory file pointed to by i-node 2, the directory contains
    two files, one lunch and the other dinner. Notice something of interest here.
    The key piece of information about a file, its name, is not stored in the file''s
    i-node. Instead, if it is necessary to determine whether the data blocks are stored,
    as well as is its ownership, mode and so forth, then how is the file''s name connected
    to the i-node number? Observe that in the directory file, listed next to each
    file is that file''s i-node number. Thus a directory file defines the names of
    the files in a directory, and also associates an i-node with each file. If you
    were to follow the entry for the file lunch to the i-node (number 1234), and in
    turn follow the data pointers in that i-node to the data of the file itself, you
    would find that lunch is in fact another directory file containing the files fruit
    and vegetables. fruit is another directory file, containing the entries peaches
    and bananas. The content of these files, however, is production data rather than
    file names and i-node numbers, these peaches and bananas are ordinary files, and
    must by definition reside at the end of a chain directory files. Thus we could
    write the pathname of the file peaches as lunch/fruit/peaches.


    This is a relative path, however. What is its parent directory? Or, to ask the
    question in terms of i-nodes, if the directory file having i-node 1234 is identified
    as the directory lunch, what is the identifier for the i-node number 2? This particular
    i-node number is special, as by definition i-node 2 is always the starting point
    of any descent through the directory tree specified in an ext2 file system. Thus
