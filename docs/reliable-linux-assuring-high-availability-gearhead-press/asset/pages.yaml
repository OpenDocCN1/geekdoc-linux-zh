    The only remaining question is, what about the 50? Why is there always a number
    in the name of the links in the run level subdirectories? Remember that when /etc/rc
    processes the run level directory, it does it in the alphabetical order that the
    links would sort. Thus, the numbers can be manipulated to control the order in
    which service start or stop. This can be very important in some cases where for
    example, it is critical that the portmap service starts before nfs, and so the
    order of the links must be crafted to ensure this. If you get this wrong, your
    server may not start necessary services, which equals downtime.


    Conventionally, run level 3 is the run level used for normal server operations,
    including all applications that are expected to run on the server. Run level 5
    normally starts the same services as run level 3, with the addition of a graphical
    environment started on the console. These are the most commonly used levels, although
    there are a few others defined at the beginning of /etc/init You can alter the
    conventional usage for any run level as desired. It is possible to switch between
    run levels while the server is running by issuing the command init, passing the
    run level as an argument. The runlevel command will tell me the previous and the
    current run levels. Here is an example:


    ```

    # runlevel

    N3

    ```


    ```

    # init 5

    INIT: Switching to runlevel: 5

    ```


    ```

    Starting X Font Server:                [ OK ]

    < other services stop or start here >

    # runlevel

    35

    ```


    ```

