    # THE INTEL SCALABLE PLATFORM INITIATIVE


    The Scalable Platform (SP) project originated in Intel''s developer lab in 1999.
    According to Intel, "Its mission is to ensure Intel Processor Platforms deliver
    rich, easy-to-access end benefits." Intel goes on to state, "the mission (SP)
    encompasses platform capabilities as a whole, not only the microprocessor core.
    The SP initiative addresses performance solutions in operating system and applications
    as well as platform elements such as power, thermal, rich graphics, interconnect
    packaging and printed circuit board designs." The fact that Intel is sponsoring
    an integrated, platform-based approach promises improvements on both performance
    and reliability in the next generation of servers. The SP initiative considers
    factors such as


    +   - Electromagnetic interference

    - Acoustic noise

    - Delivering more power in less space

    - Designing components that interconnect space

    - Making the best use of circuit board space

    - Good thermal management


    One example of the work flowing from the SP initiative is the Thermal Test Board
    (TTB). This is a standard Intel Pentium 4 processor and chip set motherboard,
    specially instrumented with a number of temperature probes at key locations on
    the board. The board can be installed into a test system, and support further
    probes mounted in temperature sensitive locations such as system memory, expansion
    slots, drive bays, and the power supply. A separate PC is used to gather and report
    the temperature data cleaned from the TTB itself. While the end user of a server
    is unlikely to go to the length of using the TTB in selecting a case design, it
    is encouraging to know that systems packers have sophisticated tools such as the
    TTB that should assist in ensuring that the rigorous thermal design needed for
    future servers can and be well done.


    More information on the SP initiative can be found at developer.intel.com.


    Exhaust fans that ventilate by pumping air out of the case are rarely fitted with
