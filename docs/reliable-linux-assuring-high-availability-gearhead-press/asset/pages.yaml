    # Configuring ext2 File System Quotas


    Disk quotas can be enabled on some or all local file systems. Disk quotas are
    a standard feature of the ext2 file system, but are not configured by default.
    If you would like to use disk quotas, here are the configuration steps:


    +   1. Mark the file system as active for quotas in /etc/fstab by adding the quota
    flag, like this:


    ```

    /dev/hda6      /home      ext2 defaults,usrquota  1 1

