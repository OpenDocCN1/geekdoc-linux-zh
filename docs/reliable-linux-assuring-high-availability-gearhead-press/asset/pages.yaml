    This output comes from a machine installed by choosing the server installation
    option, which automatically divides the disk into these five partitions seen in
    the listing. Looking at output, it is important to realize that there is an emerging
    standard for the layout of directories and contents on a Linux system, the Linux
    Standard Base (LSB) project. Visit www.linuxbase.org and the objective is revealed:
    "The goal of the Linux Standard Base is to develop and promote a set of standards
    that will increase compatibility among any Linux distributions and enable software
    applications to run on any compliant Linux system." The LSB is supported by Red
    Hat as well as all of the other major Linux distributors, both commercial and
    noncommercial. Hence, distributions produced by any of the LSB partners would
    be expected to follow the standard as closely as viable.


    A major component of the LSB is the Filesystem Hierarchy Standard (FHS). The FHS
    is a project that originated in 1993 as an effort to reorganize and develop a
    standard for the directory structure of a Linux instance. Currently, the FHS project
    includes not only Linux, but also contributors from BSD UNIX, and the goal is
    to generate a standard for anything calling itself open source UNIX. The FHS is
    intended to specify "a standard file system hierarchy for FHSystems by specifying
    the location of files and directories, and the contents of some system files."
    The current version is FHS 2.1, and can be found at www.pathname.com/fhs. I am
    going to look at each of the file systems in the df listing in turn. As Red Hat
    Linux claims to support the FHS, I will use the FHS standard itself as a guide
    to the contents of each file system.'
