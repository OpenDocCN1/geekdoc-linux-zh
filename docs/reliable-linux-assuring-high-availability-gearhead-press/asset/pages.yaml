  pgno: 410
- img_proc: true
  md: '# 388 Linux Reliability Enhancements


    ![](img/8f0b2e54b3e875094917788f9cb87c45_411_0.png)


    **Figure 10.3** This is what a Convolo cluster pair configured with no single
    point of failure would look like.


    terminal server for console access to the nodes, and a separate hardware switch
    to allow a standard tty port to perform STONITH control. This two-node architecture
