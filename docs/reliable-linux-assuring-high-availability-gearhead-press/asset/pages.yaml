  md: '# Alternative File Systems 359


    As can be seen, the basic idea is very similar to the pair of servers running
    enbd configured using software RAID1 shown in Figure 9.4. Note however when using
    drbd the mirroring is done by drbd itself; the soft RAID is not necessary. Also
    note the two servers have explicit identities, one designated as the primary and
    the other secondary. The data is writeable on the primary only, but is read-only
    on the secondary. In most drbd installs a heartbeat mechanism would be put into
    place to determine if the primary server has failed, in which case a script is
    initiated on the secondary causing it to switch to acting as the primary server.
    This would involve mounting the data as read-write, in process of which any journal
    replay necessary would be done.


    Journaling is supported in a drbd environment as the driver maintains the same
    ability to control write ordering that a standard local device provides. It is
    a performance cost to this, however, as by any write ordering scheme must delay
    writing the next sequential data item until it has confirmation that the current
    data item has been safely written to disk. When dealing with local hardware driver,
    these confirmations come back quickly; however, when a network is placed between
    the drbd driver and the secondary server, the confirmations are subject to the
    network latency, which will be noticed in the file system throughput. As we have
    consistently seen, however, increased reliability rarely comes without a cost
    of some sort, in this case performance.


    drbd supports three different acknowledgment protocols you can choose from govern
    the disk write acknowledgment mechanism and balance acceptable performance against
    the level of reliability in case of failure:


    +   - The fastest is achieved using Protocol A, which reports a write to be complete
    after it has gone to the primary server and been sent over the network to the
    secondary server. The reliability is high here in this case, for example, of a
    transactionprocessing engine, as a transaction may have been reported by the primary
    node before the transaction data has safely made it across the network to the
    secondary. Should the primary node fail after acknowledging it to its client that
    the transaction was complete but before the data made it to the secondary, then
    when the secondary server comes up to serve the database, the completed transaction
    will not exist in the backup database.


    +   - The second option, Protocol B, is stronger, delaying acknowledgment of the
    application to the primary server until the data has been safely received by the
    secondary server. There is still a risk that the secondary server may fail between
    receiving the data'
