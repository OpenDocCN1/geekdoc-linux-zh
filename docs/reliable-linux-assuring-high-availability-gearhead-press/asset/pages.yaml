    # Scalable Performance Benefits


    The second basic reason for clustering is scalable performance. Note that I did
    not say just performance, but scalable performance. If better performance is what
    you want, you can buy a bigger, faster server. When you do, however, you will
    have to make a transition from your current server to the new one. It may be that
    this transition requires a different operating system or application environment
    to support the new server, so the transition from less to more power may not be
    seamless. In addition, the new server replaces the old one, leaving you with a
    used piece of hardware. It is well known that computer hardware depreciates in
    value faster than ice melts in the sun, so this is liable to cost you money. The
    advantage of a performance-oriented cluster lies in its ability to allow the incremental
    addition of computing capacity by adding more nodes to the cluster. Each node
    retains the same operating system and application environment as its peers in
    the cluster, and the old nodes continue to carry as much of the performance burden
    as they are capable of carrying, for long as you choose to keep them in production.
    Furthermore, the addition of the extra capacity could involve little or no disruption
    in service.


    I made the point before that there is a connection between performance and reliability
    in that if your production environment cannot keep up with demand, the perception
    this gives the end user can be one ofreliability as much as slow service, especially
    if the slow service clients software to time out and give up service requests.
    Also, overloaded servers will have a greater tendency to fail under excessive
    load, either from a software standpoint (buffers or queues that overflow and cause
    software failure) or a hardware standpoint (overloaded disks that fail prematurely
    due to continuously heavy use). Thus the ability of the cluster concept to flexibly
    scale capacity to meet demand with minimum restructuring overhead and downtime
    could also be considered a reliability advantage.


