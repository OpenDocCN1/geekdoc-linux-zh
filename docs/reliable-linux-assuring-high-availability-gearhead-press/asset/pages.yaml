  md: '# 270 Building a Reliable Server


    Without the redirection to /dev/null, the -x option would cause the entire content
    of the archive to be restored to the logical file system structure. Just where
    it gets written can be an issue you need to be careful about. The examples of
    creating archives using the directory /home/iain. By default, GNU tar will strip
    the leading from this absolute path and store all of these files in the form /home/iain.
    This means that when I extract from the archive, the files will be written to
    the current directory at the time I issue the command to extract. Consider the
    following series of commands:


    ```

    # cd /root

    # tar -cf /dev/st0 /home/iain

    # tar - xf /dev/st0

    ```


    The final tar command to extract the archive would be relative to the current
    directory, /root, resulting in the archive being restored to the /root/home/iain,
    which is probably not what I want. If you want the file stored with full path
    names, use the -P option.


    # dump: The File System Backup Tool


    dump is a command specifically designed to backup an entire ext2 file system.
    As such it is perfect fit for the second requirement on our to-do list. What is
    unique to dump is that not only does it include the data files themselves in the
    archive, but it also includes the data held in the inode table. Thus, dump backs
    up the data and the metadata of the file system. As the inode table defines the
    directory structure of the file system, this allows the archive to be examined
    interactively as if it were a live file system.


    # WHAT ABOUT GZIP?


    tar is probably the most common archive tool in the UNIX world, it is being challenged
    by the newer gzip utility. gzip was developed by the GNU as an updated version
    of tar. gzip is functionally equivalent to tar, but is argued to be better as
    it automatically compresses the data files before placing them into the archive.
    it uses the Lempel-Ziv algorithm, the best of the commonly available data compression
    algorithms. You will often see files distributed as a tar that has been "gzipped"
    to reduce its size for transmission across a low bandwidth network connection.
    The common convention in this tarball is to give such a file suffix of .tgz, indicating
    it is a gzip compressed tarball. To extract an archive, use gzip to uncompress
    the archive, and then use tar to list or extract the files.'
