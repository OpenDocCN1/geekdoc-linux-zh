    to be completely transparent, in the ideal case, so that no data or transactions
    are affected. There are limitations to this, however, realistically it is more
    common to find that a small amount of data or a few transactions may be affected
    by the fail-over. This is still preferable, however, to the sort of production
    outage that would be the case for a manual monitoring and fail-over. In that case
    it could take minutes or hours for the failure to be detected and recovered.


    Clusters also offer other reliability enhancements. The centralized nature of
    their management tends to make it easier to monitor multiple nodes effectively,
    encouraging centralized backups, logging, and software management, for example.
    It also encourages standardization. It is much easier to manage 10 clusters if
    they are more or less identical. The greater the commonality of hardware and software,
    the easier it is to manage systems, as there are fewer variables to deal with,
    which encourages stability and reliability. Change needs to be managed more carefully,
    too, as a single change now has the potential to affect the entire cluster, rather
    than only one machine. This tends to enforce a conservative approach to cluster


    There is of tension between this conservatism and market pressures urging you
    to implement the latest technologies. Being on the edge of technology rarely improves
    reliability, however, and every business needs to find that balance between the
    two that maintains a competitive edge in the market without creating a reputation
    for slow or unreliable service. Clusters can help the transition to new technologies
    as it may be possible to implement the new application on a node backed up by
