  md: '# What You Can Do Now


    Using the information from this chapter, you are now equipped to take advantage
    of the logical storage management capabilities of the current Linux kernel. Here''s
    what to do:


    +   1. Examine /proc/lvm to determine if your kernel has LVM support. If it doesn''t,
    build a kernel that does. If you have never built a kernel before, refer to the
    Kernel HOWTO or your favorite Linux Systems Administration reference.


    +   2. List your current and projected storage requirements, and plan a structure
    of VGs and LVs that support what you need now, and leave maximum flexibility for
    the future. Keeping in mind the Titanic principle, divide different applications
    and their data into separate VGs and LVs accordingly.


    +   3. Consider which of your current servers you want to convert to the LVM and
    use the procedure in the Migrating an Existing Server to LVM section of this chapter
    to do the conversion.


    +   4. Keep the flexibility of LVM in mind as you plan storage expansion to existing
    servers and storage architecture for future servers.'
