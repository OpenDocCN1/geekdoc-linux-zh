    largest disk you can source is 80 GB, you will need four disks in total, two pairs
    of 80 GB each That gives you a data storage capacity of 160 GB, room enough for
    your data with some expansion room. This means, however, that with the one drive
    per controller limitation, you will need all four of the motherboard controllers
    for this RAID array. This leaves you with no controllers left for your operating
    system, CD-ROM, or any other ATA devices. You will need to install at least a
    fifth and possibly a sixth ATA controller to support all your ATA devices! This
    could cause problems if you run out of expansion slots or reach a motherboard
