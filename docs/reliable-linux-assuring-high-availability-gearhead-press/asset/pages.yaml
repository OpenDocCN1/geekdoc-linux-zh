- img_proc: true
  md: 'They really should use /var, but they don''t. You have two choices. You can
    create a separate file system for /tmp, or you could make /tmp a symbolic link
    to /var/tmp. The FHS defines /var/tmp as temporary storage space that survives
    a reboot, where data in /tmp is not guaranteed to survive a reboot. If this distinction
    is important to you, then you go with a separate partition for /tmp. In a Red
    Hat installation you need to use the custom install option, as the server does
    not give you the option of creating your own partitions. The server install is
    fine if you want to make /tmp a link to /var/tmp, although strictly speaking that
    would violate the FHS standard.


    # # /boot File System


    The next file system to be mounted after root is /boot. According to the FHS,
    "This directory contains everything required for the boot process configuration
    files and the map installer. This may include master boot sectors, sector map
    files, and other data that is not directly edited by hand." Why the separate file
    system? The FHS goes on comment, "On some 1386 machines, it may be necessary for
    /boot to be located on a separate partition located completely below cylinder
    1024 of the boot device due to hardware constraints.


    The hardware constraint they speak of is the limitation in the ability of older
    BIOS firmware to address anything beyond block 1024 of a disk. This is primarily
    an ATA disk issue, as Linux has supported SCSI disks for a long time. The kernel
    is stored in /boot, and during the boot process the BIOS needs to be able to read
    all of the data blocks of the kernel from disk into memory, before the kernel
    actually begins to run. If the BIOS can only address up to block 1024, then you
    must ensure that no part of the kernel is stored above that point on the disk.
    The standard way to do that is to make a separate partition for /boot, and make
    it the first partition on the drive. We have just that, creating /boot on /devsda1,
    the first partition on the disk.


    There is quite a history to this, which Andries Brouwer has done an excellent
    job explaining in Large Disk HOWTO. The short story is that this is largely an
    issue with older machines. In most cases involving older BIOS firmware (I define
    modern in this case as after January 2000), an up-to-date kernel (2.2.14 or later,
    cat /proc/version to determine your running kernel version), and lilo (version
    21.4 or later, lilo -V reports your lilo version), should not be necessary to
    create a separate /boot partition. These current code level uses a disk-addressing
    scheme independent of the actual physical geometry of the disk, which is where
    the old limitations lie.'
