  md: '# Installing and Configuring for Reliability


    Which services should your server run, and are there any configuration parameters
    for these services that should be changed to reduce downtime liability? In the
    next few pages I am going to review several of the more commonly used operating
    system services, and look at how they can be configured to reduce downtime liability.


    # Understanding Run Levels


    Just before I start, though, I want to make the point that a standard Red Hat
    installation will install and start services like sendmail, portmap, lpd, identd,
    xfs (the X font server), and others, depending on the packages you chose. Many
    of them may not be necessary for the functions your server needs to perform; running
    them anywhere adds unnecessary, unproductive complication to the system and introduces
    more things to monitor and more things to go wrong. If you don''t really need
    any of these utilities, don''t run them. If you run a Red Hat distro, to control
    what runs or doesn''t, you have to understand run levels.


    The Red Hat distro makes use of the concept of operating system run levels derived
    from the original AT&T versions of UNIX. This differs from the way that Berkeley
    UNIX works, and some argue it to be overly complicated, I prefer it in a production
    server as it enforces an order and discipline in the process of booting. But at
    first, once you understand it, you have a standardized system for installing,
    starting, and stopping any operating system utility in a controlled order, which
    is useful when building a reliable server. Let''s see how it works.


    When the kernel boots, the first process started is process #1, known as init.
    init has a configuration file, /etc/inittab, in which there will be a line like
    this:


    ```

    3:initdefault:

    ```


    The 3 indicates that this system will boot into run level 3. To see what matters,
    go to the directory /etc/rc/rc3.d. Note the 3 in last subdirectory name. There
    are several other subdirectories at the same level, rc1.d, rc2.d, and so on, each
    corresponding to a different possible run level. If you examine the contents of
    these directories, you will see that they contain a group of symbolic links, similar
    to this:


    # ls -l /etc/rc/rc3.d

    lrwxr-x root root 15 Apr 13 19:48 K01pppoe -> ../init/pppoe

    lrwxr-x root root 14 Apr 13 19:43 K05innd -> ../init/innd

    lrwxr-x root root 14 Apr 13 19:55 K10ntpd -> ../init/ntpd

    lrwxr-x root root 16 Apr 13 19:55 K15mysqld -> ../init.d/mysql'
