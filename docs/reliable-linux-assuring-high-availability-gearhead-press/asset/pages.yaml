    You may want to consider two alternatives. The lpd standard is very widely implemented,
    and most client platforms. Windows included, supply lpd clients. For these reasons
    you wish to stick to the lpd standard, consider the LPRng package.


    Taylor writes LPRng is a far better implementation of the basic design than the
    regular one; if you must use LPD, consider using LPRng instead. There is far less
    voodoo involved in making it what you want, and what voodoo is there well documented.


    In my observation, one of the strengths of LPRng is that it has far better logging
    than the stock lpd, and has served me well in diagnosing production problems.
    And the voodoo is definitely better documented in LPRng. LPRng provides a more
