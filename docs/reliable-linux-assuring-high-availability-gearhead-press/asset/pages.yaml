  md: '# Building a Reliable Server


    Next, let''s examine the main implementations of both of these technologies you
    will know what you are shopping for.


    # 8 mm Tape: The First Helical Scan Drive


    The first use of helical scan technology for data storage was introduced by Exabyte
    in 1987, and was commonly called 8-mm tape. It had a storage capacity of 2.4 GB
    and supported a data transfer rate of 240 KB/s, using a tape cartridge essentially
    identical to the Sony 8mm video cartridge. Exabyte pushed this technology to a
    capacity of 7 GB and a 1 GB/s transfer rate, before introducing MammothTape, a
    second-generation 8-mm technology in 1994. Mammoth improved reliability with a
    new tape handling system, a dynamic head cleaning system, and an improved tape
    design, increasing capacity to 20 GB at a 3 MB/s transfer rate. Exabyte''s current
    technology roadmap sees this technology supporting future capacities of 200 GB
    at 20 MB/s transfer rates. Current Mammoth drives use a SCSI interface, with Fibre
    Channel support.


    Sony has developed its own second-generation 8-mm helical scan technology called
    Advanced Intelligent Tape (AIT). Introduced in 1996, AIT currently supports a
    capacity of 50 GB, at a 6 MB/s transfer rate, with a roadmap projecting capacities
    to 200 GB at 48 MB/s. AIT introduced a novel idea Memory-In-Cassette (MIC). Each
    AIT cartridge has a 64-KB flash memory chip built in. When inserted into the drive,
    the MIC chip is used to identify the tape and store logs, search maps, and other
    user definable data. This can be used to overcome some of the problems of slow
    access due to the unidirectional positioning limitation of helical scan tape.
    Sony also claims even lower tape tensions than Exabyte''s Mammoth technology,
    and promises longer tape life as a result.


    # 4 mm DAT: The Other Helical Scan Tape


    In the 1980s, Sony adapted helical scan technology to the storage of digital audio
    data, resulting in Digital Audio Tape or DAT. In 1989 they adapted technology
    to the storage of generic digital data, and the Digital Data Storage (DDS) standard
    was born. The DDS standard, like DAT, uses a 4-mm tape cartridge. There have been
    several generations of this standard, the current being DDS-4, with capacity of
    20 GB and a transfer rate of 3 MB/s. The basic technology is similar to 8-mm drives,
    and shares the same characteristics. DAT tapes have the advantage of being smaller
    than 8 mm, if that is an issue for you.'
