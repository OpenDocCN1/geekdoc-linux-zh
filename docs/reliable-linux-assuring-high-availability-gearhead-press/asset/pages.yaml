  md: '# Logical Volume Management


    really the same as what can be done using a Linear RAID as discussed in Chapter
    5, and you would be quite correct. The RAID driver can in fact also be called
    a Volume manager of sorts, kind of the RAID partition concatenation illustrated
    in Figure 8.2 can be done with any of the RAID levels.


    # Linux LVM Details


    What, then, does Linux LVM implementation have that goes beyond the volume management
    abilities of RAID drivers? To explain the way that LVM works in the 2.4 kernel,
    I need to define a series of terms. These definitions lay out the structure and
    function of the Linux LVM implementation.


    Referring to Figure 8.3, the first term is the Physical Volume (PV). A PV is a
    disk partition that has a small data entry written into by the LVM code that identifies
    it as a PV. The underlying partition should also be flagged as type 0xebe in the
    disk partition table, the partition type set aside to designate a Linux PV. The
    disk space inside a PV is further divided into allocation units called Physical
    Extents (PE). A PE is most often a few MB in size, although the size can range
    to a maximum of 512 MB. One or more PVs can now be drawn together into a Volume
    Group (VG). A VG aggregates all of the PEs of its PVs into a single large pool
    of available PVs. PEs can now be drawn from this pool and together to form Logical
    Volumes (LV), which are the final product, so to speak, that the LVM provides
    as a virtual partition to the file system or application.


    You can see this in operation if you examine the illustration in Figure 8.3. Partitions
    sda1 and sdb1 are PVs and one, respectively, of VG01. VG02 is larger, having four
    PVs, named partitions sda2 (PV02), sdb2 (PV02), sdc1 (PV03), and sdd1 (PV04).


    Note that sdd2 has not been made into a PV, so it cannot participate in the LVM
    structure. This also shows, however, that it is a requirement for an entire disk
    to be managed by the LVM. Examining VG01, you can see that two LVs are defined,
    LV01 and LV02. LV01 has the lightest shading in the illustration, having five
    LEs (PE01, PE02, and PE03) and two on PV02 (PE01 and PE02). The second LV in VG02
    has the medium shading and is smaller, having only two LEs, PE05 on PV01 and PE04
    on PV02. VG02 is much larger, but has only one LV defined in it, shaded in the
    darkest tone. This, however, has 18 LEs, some of which are on each of the four
    PVs of the VG, including all of PV03, which is all of disk sdc. Each of the three
    LVs illustrated provides a device driver that will make the LV appear as a single
    contiguous piece of disk storage, even though the actual storage is not contiguous,
    and not even confined to one disk.'
