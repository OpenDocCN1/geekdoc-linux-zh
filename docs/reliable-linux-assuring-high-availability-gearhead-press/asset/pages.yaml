    # Configuring upsmon on the Master Server


    Finally, *upsmon* needs to be configured. This daemon is the one that really does
    the work. It polls the *upsd* to check the current power status. If the UPS tells
    *upsd* via the serial control cable that power failed, *upsmon* learns this at
    the next poll and on, if it is the master server, will send a signal to the UPS
    to turn off at the end of the shutdown. The configuration file for upsmon is */etc/ups/upsmon.conf*,
    and on the master sandbox looks like this:


    ```

    # cat /etc/ups/upsmon.conf

    1 # upsmon configuration file

    2 #

    3 # This file contains passwords, keep it secure.

    4

    5 MONITOR apc700@192.168.1.200 1 master

    6 # MONITOR apc700@sandbox 1 master

    7 MISSUPLIES 1

    8 SHUTDOWNCMD /sbin/init 0

    9 # NOTIFYCMD /usr/local/ups/bin/notifyme

    10 POLLFREQ 30

    11 POLLFREQ_ALERT 5

    12 HOSTSYNC 120

    13 DEADTIME 100

    14 POWERDOWNFLAG /etc/powerfail

    ```'
