  md: '# Network File Systems


    The second part of this chapter is devoted to three different ways in which data
    communication network may be used to implement reliable data storage. Each of
    the three different techniques has its pros and cons, and you will need to evaluate
    each of them against your own requirements and risk analysis.


    Each of these data reliability techniques relies on using a network to allow data
    to be stored at a distance from the server that is reading or writing it. Further,
    each allows a duplicate copy of the data to be kept at the remote site. This backup
    may be used by a backup server at the remote site to take over in case of a primary
    site failure, or simply as a form of online offsite backup. First to be considered
    the concept of the network block device.


    # Network Block Devices


    The idea of a network block device extends the basic block device over a network.
    The concept of the block device is common to most versions of UNIX. The operating
    system provides two types of software device driver to access a disk storage device,
    the raw device and the block device. The raw device accepts a stream of bytes
    that it writes to a physical location on the disk specified by the function call
    that supplied the data to be written. No restrictions are placed on the size or
    structure of the data, and data is written directly to the physical device with
    no buffering. Some applications that want to store information in their own data
    structures directly on a disk partition with minimal intervention by the operating
    system will choose to use these raw device drivers. A block device, on the other
    hand, accepts data to be written in fixed-size blocks. It will cache this data
    in memory until such time as it is most efficient to write it out. The block device
    may also rearrange the order in which the data gets written to disk, if doing
    so makes more sense from a performance point of view to do so. Block devices are
    normally used by file systems to write their data to a disk. An example of a block
    device would be an entry in /dev, such as /dev/sda1, representing a disk partition
    in any of the file systems discussed in this chapter could be built. The data
    flow from application to a local file system via a block device is illustrated
    in Figure 9.2.


    The network block device extends this concept across a network. As shown in Figure
    9.3, an application on server A writes to a network block device. Rather than
    being tied to a local disk, this network device routes the request through TCP/IP
    via a network to a disk physically to'
