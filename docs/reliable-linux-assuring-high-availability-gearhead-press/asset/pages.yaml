  md: '# Building a Reliable Server


    Unfortunately however, certain partitions are more important and vulnerable than
    others by virtue of the data stored in them. Should any one of them fill, they
    could render the server effectively useless, and for all intents and purposes,
    sink the ship.


    # Understanding Red Hat Server

    Install Partitions


    In order to see which are the important ones and why, consider the output of this
    df command:


    | Filesystem | 1k-blocks | Used | Available | Use% | Mounted on |

    | /dev/hda8 | 256667 | 37773 | 205642 | 16% | |

