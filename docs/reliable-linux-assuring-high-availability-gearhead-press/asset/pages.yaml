  md: '# 252 Building Reliable Server


    # CALL BEFORE YOU DIG


    A news item several years ago illustrated the importance of physical paths. A
    contractor was excavating a ditch at the edge of the site of a large corporate
    office in Toronto and severed a conduit. It turned out that the entire communications
    infrastructure for the building had been channeled through this conduit to the
    outside world. It took the telephone utility several days to repair the multiple
    cables severed in the accident and restore full communications to the office.
    Business today has become so reliant on communications channels that this kind
    of outage can be quite costly. Realize that you have little control over this
    kind of accident. The equipment being used to do the digging was not particularly
    large and the work was being done off the company''s property, so it was not directly
    involved in what was happening. In short, it was an honest mistake. To protect
    itself, the company should have had a second service entry point to its building
    removed a reasonable distance from the first so that this kind of accident would
    be unlikely to affect both entry points.


    to a new software version that turns out to have a bug will affect only that one
