    # WHAT HAPPENED TO RAID2 AND RAID3?


    You will notice that I skipped RAID1 straight to RAID4. You may also have heard
    of RAID6 or ever RAID7 and are curious to know what happened to the missing levels.
    The original Berkeley paper defined five RAID levels, numbered 1 through 5. Since
    then three more levels, 0, 6, and 7 have been added to the list. I have concentrated
    on 0, 1, 4, and 5 in the main text because they are the most popular and are supported
    by the Linux RAID drivers. Here are the others:


    +   - RAID2 used a bit level checksum calculation similar to the ECC (Error Correcting
    Code) calculations used internally by disk controllers and real memory storage
    banks. RAID required large numbers of disks and complex controllers to implement,
    yet yielded little benefit in either redundancy or performance over other less
    complex RAID levels. Consequently, it was never used.

    - RAID3 is almost as RAID4, except that the chunk size is much smaller, typically
    under 1 KB. The performance characteristics of the small size favor sequential
    reads of large data files, but not much else, and find RAID5 a better all performer.

    - RAID6 closely resembles RAID5, but calculates two checksum values for each data
    string. Thus, the RAID array can survive the simultaneous loss of two devices.
    Note that this is better than a RAID5 with a spare disk, which could not survive
    the loss of a second disk until after its spare disk has been populated with the
    data from its first failed.

    - RAID7 is not a recognized generic RAID level, rather it is a proprietary solution
    offered by the Storage Computer Corporation. It is a variation of RAID4, making
    heavy use of cache hardware to overcome the checksum bottleneck.'
