  md: '# APPENDIX

    A

    Sample Business

    Recovery Plan


    This appendix outlines a sample Business Recovery (BR) plan to give you a framework
    for developing your own. I have simplified the process so that you can get a sight
    of the forest without being impeded by the trees.


    Your actual BR plan will no doubt be more complex and take some time to develop,
    as it should. After all, it is designed to safeguard your most critical business
    technology and thus should not be quickly thrown together.


    The hypothetical company used for our sample BR plan operates a wholesale-to-retail
    distribution business from three separate sites. Technology has been leveraged
    to provide the maximum convenience for customers, who may order goods online,
    and have the goods delivered from one of the two company warehouses, one of which
    is close to the head office, the 500 miles distant. Yours is a competitive business,
    processing thousand orders each business day. Your customers value rapid order
    processing and shipping, and your hope is that the new highly automated system
    will allow you to process and ship orders faster than your competition. Your customers
    like the idea, but they have to be sure that the system is reliable; otherwise
    you will lose their business. The company as a whole employs 50 people, and has
    annual revenue of $125,000 per employee, for a total gross revenue of $6.25 million.'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# 394 Appendix A


    The head office location has three Linux servers. One is a samba file and print
    server supporting day-to-day business function applications such as personnel
    management, word processing, communications, and financial functions such as payroll,
    receivables, and payables. Most of these applications run on Windows desktop machines,
    but all of the data resides on the samba file server, and they all print through
    the Linux printer. The second Linux server at the head office is an online transaction
    processing business-to-business Web server. This server provides the public Web
    interface that allows customers to place and track their orders. It must handle
    all of the financial side of the billing process for the customer, as well as
    interfacing with the fulfillment system at the warehouses takes care of maintaining
    stock and ensures delivery to customers. The third Linux server is the network
    gateway from the head office to the Internet and it implements a firewall. All
    network traffic in and out of the head office passes through this third machine.


    Each of the warehouses has a Linux server hosting the fulfillment software that
    gets its orders from the Web-based business-to-business application hosted at
    the head office. This warehouse takes as input orders to be shipped, generates
    inventory debit and credit data as a result of the goods being shipped and received
    from and to the warehouse. As output, it picks lists and assigns shipments to
    each of the delivery routes running from that warehouse. This system also provides
    order-tracking information for any currently active order. To protect the Internet
    communications path from the warehouses to the head office, a second Linux server
    is installed at each warehouse to function as a firewall. Finally, similar to
    the head office location, a file and print server supports local PC clients used
    to record day-to-day operational data such as time cards and absentee reports
    back to the head office. An encrypted email client is used to do this.


    # Where to Start


    The first thing to do is to produce a network topology diagram. This will help
    you keep track of each piece of computing hardware and the physical relationship
    between them. From this you can gain an overall view of the operation. A large-scale
    diagram showing the overall operation would look similar to Figure A.1.'
  merge: -1
  pgno: 417
- img_proc: true
  md: '![](img/8f0b2e54b3e875094917788f9cb87c45_418_0.png)


    **Figure A.1** A large-scale network topology diagram shows an overall corporate
    operation.'
