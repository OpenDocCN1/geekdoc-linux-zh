- img_proc: true
  md: '# LVM Theory


    In the traditional UNIX data storage model, data is stored in the form of data
    files. To store these files on disk, the files are broken into small blocks (where
    from 512 bytes to 8 KB, depending on the UNIX flavor), sufficient blocks being
    allocated to store all of the file data. These blocks are allocated from a pool
    of empty blocks available from a physical file system. Each file system has an
    index that tracks which of blocks make up which files. This index is called the
    i-node table, which has storage space allocated to it in the physical file system.
    The file system, including full and empty data blocks and an i-node table, is
    created in a single contiguous partition. The size of the partition determines
    the size of the file system, and also the amount of file data that can be stored
    in this file system before it is full. This storage model is illustrated in Figure
    8.1.


    This simple model has significant limitations. As file system has a discrete size,
    it needs to be manually extended if it becomes full. In itself it can be done;
    the problem lies in the requirement that the entire file system lie in a contiguous
    partition. If a disk contains two or more partitions and one fills, then full
    partition cannot be extended without making another partition smaller, initiating
    a domino effect that can be problematic to manage.


    If the full partition spans an entire disk, there is no remedy moving the file
    system onto a larger disk. This means more management overhead, risk to data in
    the transition, and upper limits on the file system size based on the largest
    disk available. From a reliability standpoint, it also forces file systems to
    reside on a single device, which then becomes a single point of failure. A RAID
    can be brought in to solve this problem, but a RAID (discussed in Chapter 5, “Building
    Reliable Disk Storage”) cannot address all of the mentioned shortcomings. A new
    storage model is required.


    # The Logical Storage Model


    The intent of the logical storage model is to divorce the file system structure
    from its tight connection to a physical disk partition. This separation is achieved
    by introducing a logical device layer between the file system and the disk partition.
    Thus, an LVM system still uses the traditional file system structure, which is
    good, as this is what the user space application knows how to deal with and we
    don’t want to modify the application to work with a new storage model.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Logical Volume Management 303


    ![](img/8f0b2e54b3e875094917788f9cb87c45_326_0.png)


    Figure 8.1 The traditional UNIX data storage model stores data as files in discrete
