  md: '# Building a Reliable Server


    The heat must be drawn out of the CPU case before it can be dissipated, and a
    good heat sink designed to fit the CPU is crucial to effective cooling. A heat
    sink is a device designed to move heat from a small, exposed high temperature
    area at the top of the CPU case to a larger surface area where the cooling airflow
    can draw the heat away more effectively. Heat sinks usually take the form of a
    set of thin metal fins attached to the top of the CPU case. It is worth it to
    use thermal grease between the heat sink and the CPU case. doing so significantly
    improves the heat flow at the boundary between the CPU and the sink. Some processors
    ship with a heat sink attached. Do not replace it with a different one. The factory
    heat sink will have been designed for adequate cooling, and replacing it may void
    the warranty. A nice big CPU comes next, as the sink alone cannot dissipate the
    heat into the case without air movement directly over the fins of the sink. Coolers
    that have a dual fan are preferred for redundancy. Some smaller cases are tight
    for space above the CPU, and may not allow for a large fan. Instead opt for a
    more spacious case. Some dual processor motherboards mount close together, and
    may require specialized fans to maintain good airflow across both heat sinks,
    or between the processors.


    # Peltier Coolers


    If you are running a very fast processor and find that your current heat sink
    and fan are not able to keep CPU temperatures as low as you might like, you can
    try a Peltier cooler. This device is a miniature solid-state refrigerator. A refrigerator
    is more correctly called a heat pump, as it''s to remove heat from the fridge
    and pump it to the outside, leaving the fridge colder as a result. A Peltier cooler
    is also a heat pump. It looks like a flat plate with a pair of wires exiting an
    edge. When you plug it in, it pumps heat from one side of the plate to the other,
    leaving one side of the plate cold and the other warm. To cool a CPU, the Peltier
    plate is mounted on top of the CPU, cold side down. A conventional heat sink and
    fan are then mounted on the warm side of the plate. The low temperature on the
    cold, CPU side of the plate coaxes the heat out of the CPU, which is then pumped
    over to the warm tops of the Peltier cooler and dissipated by the heat sink and
    fan.


    A typical Peltier cooler can create a temperature difference of as much as 70
    Fahrenheit degrees between the cold and hot sides of the plate, so it can be an
    effective aid to CPU cooling. But there must be a catch, right? Well, the catch
    is, like all heat pumps, the Peltier cooler is not 100-percent efficient. In other
    words, the amount of heat that needs to be dissipated at the'
