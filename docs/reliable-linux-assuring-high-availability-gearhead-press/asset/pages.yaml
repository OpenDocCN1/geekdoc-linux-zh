    But instead of providing the file system code with a physical partition to write
    to, the LVM provides a virtual partition called a Logical Volume (LV). An LV has
    a device driver that the file system can read and write to, that looks to the
    file system in all respects as a real physical partition device. Underneath the
    virtual LV device, the LVM is still using fixed-size contiguous disk partitions
    to provide the storage available the LV device. The trick is that a single LV
    can be made up of more than one physical partition. Further, these partitions
    need not reside on the same physical drive. Thus, several disk partitions that
    are spread over several'
  merge: -1
