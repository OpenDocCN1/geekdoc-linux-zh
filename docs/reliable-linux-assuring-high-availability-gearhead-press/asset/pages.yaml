    The LVS project has over time used different director monitoring and fail-over
    mechanisms. The current LVS HOWTO documents the use of several utilities acting
    in concert. Detection of a failure at the real-server level is done using mon,
    the same network service monitoring utility we saw in Chapter 6, "Monitoring Linux
    in Production." For heartbeat and failure detection between the directors LVS
    uses the heartbeat utility from the Linux HA project we just reviewed. IP address
    takeover by the backup director is using a utility called fake, which was at one
    time a separate utility, but now ships as a part of heartbeat. To complete a LVS
    implementation, a fault tolerant file system is necessary for the shared data
    storage on the internal SAN. The HOWTO suggests the Coda file system, also using
    GFS or InterMezzo as detailed in Chapter 9 should also be viable options.


    There is no significant software limitation on the number of real servers in LVS,
    and it is useful to note that the real servers need not be Linux machines, as
    long as they support the necessary application. If non-Linux real servers were
    used, suitable monitors would have to run on them such that a failure would be
    reported to the director; otherwise the reliability benefit is lost. Although
    large numbers of real servers are possible, there can be only one director, which
    may pose scaling problems. As the balancing code is implemented in the kernel,
    however, it is reasonably efficient and a large director should be able to keep
    a sizable real-server farm busy with work.


    To date, the LVS has seen several production production applications, including
    Network Appliances, Inc. (www.internetappliance.com), which'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# 382 Linux Reliability Enhancements


    markets a Web server appliance that relies on the Linux kernel LVS code at

    is heart. The LVS project Web site links to several detailed perfor-

    man analyses of LVS clusters; it is also the site from which to download\he code
    and follow its progress. The URL is www.linuxvirtualserver.org.


    # The Red Hat High Availability Server


    Red Hat''s entry in the HA cluster field has the same architecture as the LVS

    code, and uses some of the same components. Currently built on their

    v6.2 distribution, the Red Hat HA Server relies on the LVS kernel code to

    provide scalable and reliable services in the same way an LVS cluster does.

    Red Hat''s cluster uses different availability utilities, Heartbeat

    and failure detection for the directors is provided by the pulse utility, while

    monitoring of the real servers is handled by the nanny utility. IP address

    fail-over for the directors is handled by the fas daemon. Red Hat calls this

    collection of HA utilities when used in conjunction with the LVS kernel

    piranha. The packaging of piranha together with the v6.2 distribution,

    a kernel compiled to support piranha and LVS, a Web-based configuration

    GUI, and an online support package, make up the commercial

    Red Hat HA Server offering. The Red Hat Server code is itself all open

    source, and is available for download directly under the terms of the GPL.

    Find out more from ha.redhat.com.


    # VAnessa


    VA Network Enhanced Scalable Server Architecture (VAnessa) is a cluster-

    ion solved by VA Linux. Two components make up VAnessa,

    a cluster implementation named UltraMonkey, and what VA Linux terms a

    “Global Load Balancer,” named SuperSparrow. Like the Red Hat HA Server,

    UltraMonkey is a variant of the LVS model. The architecture is pure LVS,

    t load balancing being done by the LVS kernel code. Heartbeating and

    fail-over for the directors uses ldirect, while monitoring of the real

    servers is done using another open source monitor with

    functionality to nanny and mon. The current version of UltraMon-

    key (v1.0.2) is packaged to work with VALinux VA-Enhanced v6.2.4 dis-

    tribution. This is based on the Red Hat v6.2 distribution, so UltraMonkey

    should also work with a Red Hat v6.2 installation.


    The other element of VAnessa is SuperSparrow. This is an interesting

    piece of code, offering the ability to re direct network client queries to mul-

    tiple servers that may be widely distributed geographically. The object is

    direct the query to the server geographically closest to the client that origi-'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# Server Clustering 383


    ated the request, thereby minimizing network distances and, hopefully, improving
    performance. SuperSparrow uses Border Gateway Protocol (BGP) routing information
    as the basis for its routing decisions. BGP is the communications protocol used
    by large Internet routers to build routing tables. SuperSparrow needs access to
    a BGP router, which can be provided either by a Linux server running routing software
    such as zebra (www.zebra.org) or gated (open source gated implementations are
    normally included in a Linux distribution). Both support BGP or run from hardware
    routers with an operating system as Cisco''s Internet Operating System (IOS).
    Although SuperSparrow is primarily targeted at improving performance, there is
    no reason why it could not also be used to support a reliable server concept built
    on geographically separate servers. This would effect form a dynamic site loss
    backup.


    Further information about Vanessa can be found at vanessa-sourceforge.net. UltraMonkey
    information is available from ultramonkey.sourceforge.net, and the SuperSparrow
    nests at supersparrow.sourceforge.net.


    # FailSafe


    FailSafe is an HA cluster solution developed by Silicon Graphics (SGI) for their
    enterprise servers running SGI''s commercial UNIX variant, IRIX. A Linux port
    of FailSafe was released by SGI in September, 2000. The current version of this
    port is 1.0.2, which SGI has made freely available under the terms of the GPL.
    FailSafe is a much more widely ranging solution than either the Linux HA project
    or any of the LVS variants. Here are the major features of Linux FailSafe:


    +   Cluster scalability. A Linux FailSafe cluster can scale to 16 functional nodes.


    +   Multiple fail-over options. There are several options for failing nodes over
    to a backup, including designating one spare node as a backup for several production
    nodes, providing an ordered list of several possible backup servers for each cluster
    application, prioritizing the importance of specific applications in fail-over
    processing, or using cascading fail-over lists to provide for the possibility
    of multiple node failures.


    +   Local fail-over. FailSafe supports attempting to clean and restart an application
    locally before resorting to a fail-over to a backup node.


    +   Fine-grain fail-over. In a case of an application failure on a server providing
    more than one application such that the other applications on'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# 384 Linux Reliability Enhancements


    the server are still able to run, fine-grain fail-over will move only the failed
    application to a backup without needing to fail over the entire node.


    **Dynamic management.** Management and configuration of FailSafe and the applications
    monitors can be done dynamically from a single point of control using a GUI interface.


    **Hardware Control.** Linux FailSafe includes a hardware control facility to support
    physically resetting failed nodes, ensuring potential contention for shared resources
    between a failed node and its backup are avoided. (See the discussion on STONITH
    in the Hardware Monitoring and Control section earlier in this chapter.)


    The FailSafe architecture includes all of the elements illustrated in the generic
    cluster architecture shown in Figure 10.1. FailSafe is primarily a reliability-oriented
    cluster, in contrast to LVS, it has no load balancing or other performance-oriented
    features. Instead, it has a greater degree of scalability and much greater degree
    of configuration flexibility.


    FailSafe maintains a shared database of availability data that is replicated across
    all nodes in a cluster. It maintains information that is not only node specific,
    but also application specific, and has the ability to facilitate messaging between
    application instances necessary to support complex applications such as databases
    that concurrently access a central data repository. FailSafe also supports a plug-capability
    that allows it to tailor monitoring and fail-over behavior to suit specific applications.
    Support modules are available for generic services such as IP addressing, NFS,
    Samba, and the Apache server, as well as enterprise applications including SAP
    (both the SAP R/3 central interface and the SAP database server) and IBM''s db2.


    Like the XFS port, the FailSafe port seems to have the active support of SGI,
    which is good; but with any port the reliability and performance of the parent
    product may not always be duplicated in the earliest releases of the ported version.
    The wide-ranging functionality and support of SGI, however, make FailSafe a major
    player in the Linux HA arena. The Linux FailSafe project distributes its code
    under the terms of the GPL from its Web home at oss.sgi.com/projects/failsafe.


    # Blue Hammer


    Blue Hammer is similar to FailSafe that it is a part of a preexisting commercial
    product to the open source world. In the case of Blue Hammer, the product is IBM''s
    Parallel Systems Support Programs (PSSP).'
  merge: -1
  pgno: 407
- img_proc: true
  md: 'PPSP is the management and monitoring infrastructure originally developed for
    IBM''s UNIX-based parallel processing machine, the RS/6000 SP (Scalable Powerparallel)
    server, the largest computing machine IBM has ever made.


    To give you an idea of how large an SP can be, the biggest SP now in existence
    is one of several supercomputers under the U.S. government''s American Supercomputing
    Initiative (ASCI) program. Code-named ASCII White, it is located at the Lawrence
    Livermore Laboratory in California. With 8,192 processors, 6 TB of real memory
    and 160 TB of disk storage, ASCII White is known by many to be the largest computer
    in the world. Other well-known SPs include Deep Blue, the chess champion, and
    the record-setting Web servers IBM supplied for the last Olympic Games. Until
    recently PPSP was restricted to use within the specialized hardware environment
    of an SP. Recently, however, IBM has begun to we PPSP away from the SP hardware
    product. Renamed Blue Hammer, PPSP can already be used to support a cluster of
    large RS/6000 servers without requiring any SP hardware. One of the spin-off benefits
    of this has been the announced intent to port PPSP outside of AIX (IBM''s UNIX
    variant) into the Linux world under the name Blue Hammer. The first release of
    Blue Hammer is planned for late 2001.


    If, when arrives, Blue Hammer includes all of the functionality of PPSP, then
    it will look like FailSafe, as the software architecture and features will be
    similar. Blue Hammer would differ from FailSafe, in two respects. One is IBM''s
    use of a single server to act as a cluster controller. This machine, termed the
    Control Workstation (CWS), holds a database of cluster management information
    and provides a central point of control for cluster operations. some of which
    are optional, as the cluster administrator chooses. Included in this list are


    +   * Software installation, maintenance, backup, and restoration management

    * Node and application health and performance monitoring

    * User database administration

    * Secure platform for remote administration commands

    * Central point of contact and control for configurable, event-driven system monitoring
    and control infrastructure


    This last part deserves further examination. It refers to a functional subset
    of PPSP called Reliable Scalable Cluster Technology (RSCT). This introduces a
    distributed database that works in conjunction with monitor'
  merge: -1
  pgno: 408
- img_proc: true
  md: 'daemons running on each cluster node to collect a broad range of operational
    data and make the data available to clients through an open programming interface.
    This database is mated with an event engine, allowing the cluster administrator
    to choose discrete variables, and set threshold levels above which alarms are
    set and automatic recovery actions initiated. This is a sophisticated and well-tried
    infrastructure that has proved to be successful in building many of the largest
    UNIX clusters in operation today. While this is very positive, it remains to see
    how PSSP functionality carries over to the Linux port. As if it happens, a large
    part of PSSP is written in Perl, which will see the porting task.


    The second point of difference between Baby Blue Hammer and FailSafe is that,
    unlike FailSafe, Baby Blue Hammer should not be expected to include fail-over
    management capabilities. While it has a sophisticated monitoring ability, in the
    SP world the task of managing failing-over falls to a separate IBM product, High
    Availability Cluster Multi Processing (HACMP), and at the current time I am not
    aware of any plan to port HACMP to Linux. What IBM can offer that FailSafe does
    not, however, is the promise to port General Parallel File System (GPPS) to Linux
    in conjunction with the PSSP port. This will make another well-proven network
    system available to the Linux cluster.


    GPPS has proven production capable of enabling multi terabyte file systems at
    data transfer rates of as much as 1.2 GB/s. While these rates were obtained in
    an SP using the very high-speed proprietary SP Switch network technology, these
    numbers reflect GPPS'' ability to effectively spread data transfer overhead across
    multiple cluster nodes. If one were to build a GPPS cluster using a SAN fabric
    such as Ethernet or an FC switch, the network is more likely to be the bottleneck
    than the file system structure. In the SP, GPPS management is centralized and
    integrated into the PSSP product, and I would expect that structure to carry over
    to Baby Blue Hammer.


    At the time of this writing, there is no Web site dedicated to this project. Expect
    news to appear late in 2001 at IBM''s open source Web site, oss.software.com.


    # Convolver/Kimberlite


    Convolo is a commercial cluster offering from Mission Critical Linux, Inc., based
    on the Kimberlite open source cluster developed by the same company. Similar to
    the Linux HA cluster, Kimberlite is a server pair configuration. The two server
    nodes are connected to a shared-disk subsystem,'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# Server Clustering 387


    typically either a twin-tailed SCSI channel or an FC loop, and operate in either
    an active-active or active-standby mode.


    An active-active cluster implies that both servers support applications concurrently.
    If either should fail, the remaining server simply continues to serve the application.
    In this case the cluster performs a simple load balancing function as well as
    supporting failure coverage. If the servers serve different applications, the
    surviving server can take over the service provided by the failed server, and
    vice versa, assuming there is sufficient capacity on each server to do it.


    The active-standby configuration, as the name implies would see one active production
    server backed up by a warm standby unit. Kimberlite uses both an IP network and
    a hardwired serial connection for monitoring and control within the cluster pair.
    Hardware permitting, the serial connections STONITH hardware control to prevent
    contention between servers if a hung server recovers after the application has
    failed over.


    The commercial Convolo product adds several features to the open source Kimberlite
    cluster. At the current release of Convolo, v2.0, these features include


    +   - Full NFS fail-over support, including lock fail-over and complete access
    granting capabilities


    +   - Samba fail-over support


    +   - 90 days of support technical support


    +   - Binary distribution, including easy to use installation and configuration
    verification utilities


    +   - Configuration GUI


    +   - Noninteractive management interfaces to facilitate integrating Convolo into
    appliance deployments


    +   - Integration with Mission Critical Linux’ other tools for support and remote
    monitoring and maintenance


    +   - Extensive quality assurance testing


    +   - Hard copy and online documentation


    A fully redundant Convolo cluster pair designed to provide no single point of
    failure hardware redundancy is shown in Figure 10.3.


    This arrangement is similar to the generic cluster architecture of Figure 10.1,
    although additional serial connections in this case include a'
