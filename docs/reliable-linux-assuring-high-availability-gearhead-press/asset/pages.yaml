    My single-disk example includes printing as a server function. This is a common,
    if not the most common, function required of a network server. With the addition
    of Samba to support Windows clients, Linux makes an excellent print server. In
    the early days of UNIX at Berkeley, a network printing communication protocol
    was called lpd. This protocol became a de facto standard, eventually codified
    in RFC 1179. Linux distros commonly include some version of this original print
    spooler code. A great deal of water has passed the bridge since this code saw
    the light of day, and what you get today varies widely. Grant Taylor in printing
    HOWTO


    > "There are a large number of LPD sources floating around in the world. Arguably,
    some strain of BSD UNIX is probably the official owner, but everyone changes w-nilly,
    and all cross-pollinate in unknown ways, such that it is difficult to say with
    certainty exactly LPD you might have."


    Later on, he describes the code for lpd as "frightfully haphazard." As you can
