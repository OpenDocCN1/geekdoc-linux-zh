    # Monitoring CPU and Memory Usage


    Monitoring CPU and real memory usage is generally more associated with performance
    management than server reliability. However, unusual or excessive use of any system
    resource can also be an indication of trouble that can lead to an outage. An application
    that malfunctions can easily begin to consume huge amounts of CPU time and effectively
    bring down a


    Another application-related problem that on occasion crops up is memory leakage,
    when as a result of a coding error an application requests increasingly larger
    amounts of memory in proportion to the amount of time it has been running rather
    than the volume of work it is doing. This can eventually exhaust real memory,
    pushing the virtual memory manager to make increasing use of swap space. This
    results in performance degradation, and if the swap space is exhausted, eventually
    processes will return failure for requested memory allocations and start to crash.
    Clearly, this needs to be avoided and a memory usage monitor can do that.


    Listing 6.8 provides a script to watch CPU usage.'
