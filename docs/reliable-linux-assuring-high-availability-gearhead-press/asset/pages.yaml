  md: '# Choosing the Right Hardware


    Tapes must be handled and stored properly. You might not think it, but rough handling
    can make a tape unreadable. I have known tapes that would not read after being
    accidentally dropped on the floor. One manufacturer actually specifies a particular
    height from which if dropped its tape should survive. The fact that this testing
    is being done and advertised indicates that shock is an issue for tape cartridges.
    It should go without saying that tapes be stored in a clean, dry, and cool location,
    it is sometimes overlooked that the storage location should be free from magnetic
    contamination too. All of the major tape storage technologies are based on magnetic
    encoding; hence any exposure of a tape to a strong magnetic field has the potential
    for data corruption. The worst of it is, you can''t see it happening, and you
    will not know it has happened until you discover the tape will not read.


    # Reusing Tapes


    Tape media will usually come with a specification for the number of times the
    media can be reused. Technologies compete with one another for the highest number
    in this regard, claiming a lower cost of operation the greater number of times
    you can reuse your tapes. Some people, however, have a policy that says never
    to use a tape. Their reasoning is that the data stored on the tape is worth many
    times the cost of the tape itself, so much so that it is a false economy to be
    incurring a greater loss risk by reusing media. In some cases the decision is
    made for you if there is a requirement, often for legal or tax reasons, to keep
    the data as an archive record of your companies operations for audit purposes.
    In each case backup you make goes into storage and would not be available for
    reuse for several years (by which time the tape is probably obsolete anyway).
    Certainly the data corruption risk is minimal if you reuse media, as certainly
    media can be successfully reused. It is very difficult to predict at how many
    cycles the quality of the media begins to become dangerously low. Your best defense
    is Campbell''s Law. It is a choice you will need to make.


    # Other Backup Technologies


    While tape is the most widely used backup solution, and clearly the least expensive
    on a per-byte stored basis, it is not the only way to do backups.'
