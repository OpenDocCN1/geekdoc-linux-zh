    It is simple to use the ps command to determine the most intensive CPU process.
    It would be easy if one could conclude that if the top CPU user were using greater
    than, say, 75 percent of CPU, there must be something wrong. Unfortunately, it
    is not as simple as that. A legitimate process momentarily use large amounts of
    CPU cycles without necessarily indicating a malfunction. What you need to look
    for is a process that consistently and continuously uses large amounts of CPU
    cycles. To do this, our monitor script will look for a process that has been in
    excess of a threshold CPU usage for several consecutive sample cycles. We start
    out by establishing a high CPU usage threshold of 60 percent at line 14. If there
    is one single process that constitutes most of what your server does this could
    be low; however in practice it is rare for all the work of an application to be
    done by a single process. You want to know if any single process is using greater
    than 60 percent of CPU cycles on an ongoing basis.


    The rest of the script is an open loop that iterates every minute. At line 22,
    the ps command determines the most active CPU process. Line 23 captures the CPU
    usage to the variable current_top_cpu and line 24 removes the percent sign from
    that value. Line 25 assigns the PID of the top CPU process to current_top_pid.
    The test at line 28 sees if the CPU usage is high enough to be concerned about.
    If it is, the test at line 32 sees if the current_top_cpu process is the same
    PID as was at the last iteration, or if it is assigned to bad_pid. If this succeeds
    a value of 0, a counter is incremented at line 34 indicating that bad_pid has
    bad for count successive monitor cycles. Every five cycles, the test at line 38
    generates an alert, unless bad_pid drops below the threshold value or is not the
    top CPU user for at least one monitor cycle, in which case count is reset to 0
    at line 45. This script can be run as a daemon, started from /etc/rc.d/local or
    an equivalent.'
