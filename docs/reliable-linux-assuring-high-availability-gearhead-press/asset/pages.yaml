    # Missed Jobs: anacron


    A problem arises with both cron and at in the case where the execution time is
    missed. Should the machine be down when a job should run, neither nor cron has
    a mechanism to determine that the job was missed during the downtime and assess
    whether it should run when the system comes back up. This problem can also arise
    during a time change, such as when the system clock is readjusted, or in the hour
    lost or gained in the transition to or Daylight Savings Time. If this is not taken
    into account, scheduled jobs will be missed, and that can cause unnecessary downtime.


    There is a third utility devised to daemons, and that is anacron. While at and
    cron rely on daemons, anacron is simply a process that, when it runs, scans a
    configuration file and runs the jobs identified there. When each job runs, anacron,
    however, notes the date the job ran in a stamp file in the directory /var/spool/anacron.
    The next time anacron runs, it scans its configuration file and compares the frequency
    each job is expected to at, and the last time the job ran, according to the time
    recorded in /var/spool/anacron. If the definition for a job in /etc/anacront were
    to specify a daily execution, but the time stamp indicates the last time the job
    ran was two days ago, anacron would conclude that the job had been missed and
    would run it. Note that the anacron time stamps record only the date, not the
    time of execution, and so anacron cannot be used to handle jobs whose frequency
    is less than at least one full 24-hour day.


    The default /etc/anacront looks like this:


    ```

    # /etc/anacront: configuration file for anacron


    # See anacron(8) and anacront(5) for details.


    SHELL=/bin/sh

    PATH=/usr/local/bin:/usr/local/bin:/bin:/usr/bin:/bin:/usr

    ```


    | 5 | cron.daily | run-parts /etc/cron.daily |

    | 7 10 | cron.weekly | run-parts /etc/cron.weekly |

    | 30 15 | cron.monthly | run-parts /etc/cron.monthly |


    # These entries are useful for a Red Hat Linux system.


    Note the environment environment variable assignments, which are global to the
    commands processed by anacron. The first field of each job entry is the'
