    the problem is.


    # # What You Can Do Now


    +   1. Using my criteria and your own experience, evaluate and choose a Linux
    distribution that you feel comfortable with. As you look at distros, observe which
    kernel version is most commonly used by the commercial distros, as it is probably
    most stable at the time.

    2. Evaluate the applications you need to serve, and their data, and work out a
    disk partition layout.

    3. Install Linux. After installing Linux, but before installing any applications
    or data, review the operating system configuration. Remove anything that is not
    obviously needed, and check the configuration for required services.

    4. Install your applications and data, and test them thoroughly. Testing may reveal
    operating system configuration problems or bugs. Get them worked out now, before
    you go into production.

    5. Simulate a power failure and make sure your UPS is working properly. Also,
    do a reboot and make sure everything comes back up, working properly.


    Now that you have a working system, document it and back it up. If you need to
    recover in a disaster, you have a golden image to recover from. The backup can
    then form the foundation for other servers.'
