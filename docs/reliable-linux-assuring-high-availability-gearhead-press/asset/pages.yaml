  md: '(/dev/nbd) pointed to a disk on the remote server B. If server A fails, there
    should be a complete and timely data copy available immediately to server B. This
    kind of network disk sharing is a core functionality required of the highly available
    processing clusters discussed in Chapter 10, “Server Clustering.” If sufficient
    network bandwidth is available between the two servers, there is no reason they
    could not be separated by a significant distance, effectively allowing a warm
    backup server to be in place many miles from the primary server location.


    There are challenges to overcome, the primary one network bandwidth. Few LAN technologies
    can match the bandwidth of a local bus technology using ATA or SCSI, and the network
    traffic bottleneck in a network block device setup needs to be carefully evaluated.
    In local clusters (those in which both servers are located adjacent to one another
    at the same site), it would be common to dedicate a physical network to this inter
    server disk traffic. A technology as fast or gigabit Ethernet, FDDI (Fiber Distributed
    Data Interface, a 100 MB/s implementation of Token Ring running on fiber media),
    or Fibre Channel (FC) would be viable choices. There is also CPU overhead to network
    traffic that should be considered.


    As reliability is the focus of this setup, it would seem reasonable to choose
    a journaling file system to ensure that metadata is consistent in the case when
    the standby server needs to take over the data disk. This could pose a problem
    that by definition journaling file systems need to track metadata changes that
    have a sequence ordering. Block devices, however, commonly reserve the right to
    reorder requests they receive to improve operational efficiency. All of the journaling
    file systems are aware of and are written to take into account the behavior of
    local block devices and cooperate successfully with them. With the added layer
    of network transport, the behavior of the network block device may be very different
    than the behavior of a local disk block device, and the interaction between the
    journaling file system and the network block device will have to be carefully
    examined. Two network block devices are currently available in the Linux environment,
    enbd (the Enhanced Network Block Device) and drbd. We''ll look at them next.


    # nbd: The Enhanced Network Block Device


