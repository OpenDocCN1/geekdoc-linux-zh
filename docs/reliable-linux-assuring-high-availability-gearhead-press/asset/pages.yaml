    fine (you will notice I did not say if) you need more disk space? As I write,
    40-GB ATA drives are the largest available; by the time you read this, larger
    capacities will undoubtedly be on the market. Nevertheless, what if your requirements
    still exceed the largest drive available? Consider this example. You need storage
    for 120 GB of data and decide to use a RAID1 array, which allows you to keep a
    mirror copy of your data on a second disk. If you could source a 120-GB disk,
    this would be fine, as you would need only two disks. Unfortunately, however,'
