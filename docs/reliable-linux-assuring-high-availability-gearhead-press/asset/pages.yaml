    # Server Availability Benefits


    Clearly one of the advantages of clustering is the ability to designate a standby
    node for any production node in the cluster, and put into place an automated monitoring
    and fail-over mechanism. Thus a node failure can be recovered quickly and automatically.
    In conjunction with shared disk storage and journaling file systems (see Chapter
