    # Consistency Limitations of Snapshots


    While the idea of snapshots is to remove the problem of data consistency when
    backing up live data, there are still challenges to be overcome. If, for instance,
    a snapshot is made of an LV that contains an active file system, when the snapshot
    is mounted the file system will appear to have inconsistent data because some
    metadata transactions were in progress exactly at the moment the snapshot was
    made. (The metadata in fact looks exactly as it would have the system crashed
    at the moment the snapshot was taken.)


    The file system will want to do either a full metadata check, or if it is a journelling
    file system, a log replay. As either of these scenarios requires read-write access
    to metadata to correct inconsistencies, and as by definition a snapshot can only
    be accessed as read only, the mount will fail. You could back up directly from
    the device file without mounting the LV, but you would still be backing up an
    inconsistent file system structure. which means stopping all file system requests
    for a moment. The only cure for this is to quince the file system, which allows
    pending metadata transactions to complete. The snapshot is then taken, after which
    production can resume. Unmounting the file system will do this, but that means
    downtime.


    Ideally, the process that creates the snapshot should be able to request the file
    system to quince itself. Currently, work is proceeding on necessary modifications
    to the file system layer in the kernel to allow this. Monitor future kernel releases
    to track the progress of this work.


    Though the file system consistency problem can be solved, the problem of application
    data consistency remains. Even if the file system data were consistent, it is
    still possible that the application data is in an inconsistent state. If the application
    needs to do a series of writes to complete a transaction, for example, and the
    snapshot is taken part through those writes, the application may not be able to
    properly deal with the partially completed transaction as it would appear in the
    snapshot. It will be necessary'
