    Run level 0 means stop everything, the fastest safe way to bring the operating
    system down is to issue init 0. This does not, however, give logged-in users any
    warnings or time to complete work and will halt the operating system entirely
    when the shutdown process is complete. You may prefer to use the shutdown command
    instead, which allows you to schedule the shutdown for a future time, broadcasts
    repeated messages to users warning of the impending shutdown, and can be directed
    to shut down run level 1, if desired. Run level 1 is called single-user or maintenance
    mode. In this run, the only core operating system kernel is running; there is
    no network connectivity and virtually no other services. This run level is useful
    for maintenance as can be used as a start or stop applications.


    Different run levels can be used as a start or stop applications. For instance,
    if the scripts for application are flagged with an S for run level 4 and a K for
    run level 3, then issuing init 4 in run level 3 would start the application, and
    could be followed by init 3 to stop.

    To manage all this structure reliably, the chconfig command is provided. chconfig
    can be used to list at run levels each service will run and can be used to change
    the configuration. For example, using the --list flag returns a summary of the
    current configuration. With no further arguments, chconfig will summarize all
    services and run levels, like:


