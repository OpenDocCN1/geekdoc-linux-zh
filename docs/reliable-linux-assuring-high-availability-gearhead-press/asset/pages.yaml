  md: '# LifeKeeper (SteelEye)


    LifeKeeper is the flagship product of SteelEye Technologies. SteelEye bought LifeKeeper
    from its original developers, NCR, early in 2000. When supported by NCR, LifeKeeper
    was successfully marketed to the Fortune 500 market, supporting platforms including
    Solaris, Windows NT, and NCRSV4MP, NCR''s UNIX offering. In June 2000 the first
    Life-Keeper port, v3.0, was released, followed by v3.1 in January 2001. LifeKeeper,
    like FailSafe and Blue Hammer, is a fully scalable cluster, supporting up to 16
    nodes in several fail-over configurations (with some configurations supporting
    more than 16 nodes). A LifeKeeper cluster would have an architecture similar to
    the generic structure shown in Figure 1.1.


    Here is a list of key LifeKeeper features:


    +   - Application Recovery Kits (ARKs) to support off-the-shelf applications and
    eliminate single points of failure; supported applications including Oracle Net
    8, SSL support for Apache Web server, Informix, Sybase, MySQL SQL Server, IBM
    DB2, MS IIS, MS Exchange, SAP R/3, Sendmail, and Domino

    - Support for Network File System (NFS) as well as NTFS and JFS (journaling file
    systems), such as ext3 and ReiserFS

    - Plug-and-play integration and certified support for servers from multiple vendors,
    including Compaq, Dell, Hewlett-Packard, and IBM

    - Integrated support for Fibre Channel-based SAN storage

    - Support for several Linux distributions, including Red Hat 7.0, Caldera 2.3,
    SuSE 7.1, and TurboLinux (planned for Q2 2001)

    - SNMP support allows integration of LifeKeeper with any SNMP-aware network management
    system, such as HP OpenView and IBM Tivoli

    - Tunable heartbeats support fine-tuning failure detection speed and recovery

    - Software Developer’s Kit (SDK) to enable LifeKeeper customization for customer-specific
    needs


    LifeKeeper also offers an optional add-on, LifeKeeper Data Replication. This is
    an interesting extension to a cluster product, offering the same network data
    replication functionality as drbd, or enbd used to implement a network RAID, as
    described in Chapter 9. The v3.1 LifeKeeper release has'
  merge: -1
  pgno: 412
- img_proc: true
  md: 'been chosen by Compaq as an availability solution of choice to be promoted
    for by ProLiant-based turnkey cluster solutions marketed by Compaq. Further information
    about LifeKeeper can be found at

    www.steeleeye.com.


    # Cluster WorX


    Cluster WorX is a product of Linux NetworkX, a vendor of turnkey Linux cluster
    solutions. Scaling to large numbers of nodes, Cluster WorX offers a

    Java-based GUI interface that enables remote monitoring of a variety of

    hardware and operating system parameters within a cluster. Cluster WorX

    is marketed in conjunction with Linux NetworkX hardware cluster installa-

    tions, but as of v2.0, is not available as a stand alone product. Linux Net-

    worX makes these claims for Cluster WorX:


    +   - Complete GUI monitoring

    - Complete module power, temperature, network, and process monitoring

    - Automatic administrator event notification

    - Disk cloning to load OS and applications

    - Compatible with SSL and Apache

    - Secure remote access with any Java-enhanced browser


    Like a Blue Hammer, FailSafe, or LifeKeeper cluster, a Cluster WorX

    cluster has an architecture similar to the generic structure shown in Fig-

    ure 10.1. The key difference is that at the current release, v2.0, Clus-

    terX is tied to a turnkey Linux NetworkX cluster solution. Further

    information on Cluster WorX and Linux NetworkX clusters can be found at

    www.linuxnetworkx.com.


    # What You Can Do Now


    +   - Evaluate your production environment and assess the merits of

    using a cluster or clusters to improve either the reliability or perfor-

    mance of your production applications.

    - If you decide a cluster would be helpful, evaluate the abilities of

    each of the cluster implementations reviewed in this chapter to

    determine which makes the most sense for you.'
  merge: -1
  pgno: 413
- img_proc: true
  md: '3. Make a transition plan to move from a non clustered to a clustered environment.
    Make sure you have a transition path that always has a fallback in case something
    goes wrong.


    4. Install the cluster and become familiar with its mechanisms before going in
    to production. Be especially careful to thoroughly test the fail-over mechanisms
    first. Usually the most difficult part of a high availability cluster implementation
    is not the cluster software or its operation, but the scripts necessary to fail
    the application over. Make sure to allow time to develop and test these fail-over
    procedures.


    5. Get the most from your new cluster by ensuring that any new applications are
    implemented within the cluster structure to gain the full benefit of your investment
    in clustering.'
