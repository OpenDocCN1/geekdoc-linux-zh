- img_proc: true
  md: 'When you modify this sample for your environment, you may want to change this
    to your administrative account e-mail or pass an argument to allow mailing to
    any arbitrary user.


    The main body of the script is a simple case statement that branches based on
    the value of alarm_method. If you are working in the KDE desktop, you will find
    that the wall command in line 30 result in a nice graphical popup window that
    date stamps the output as well as keep a buffer of previous wall messages, which
    is handy. The window alarm at line 31 should work in any generic X-Windows installation
    that includes the xmessage client. As xmessage does not include a date stamp,
    I have added the date command output as shown in line 33. Unfortunately the xmessage
    client does not interpret the \n convention for a newline; hence, the carriage
    return must be hard coded inside the double quotes, as shown. Either the script
    looks ugly, or your output looks ugly; take your pick.


    # Writing Alarms to a Log


    The option to log the alarm to a remote server is implemented by the logger command
    at line 37. This is a problem, as logger can only log to the local syslog. There
    is no client utility to log directly to a remote syslogd. What can be done, though,
    is to log to the local syslog, and configure the local daemon to forward that
    to a remote machine. To make your alarm script work, then, I must also modify
    the local syslog configuration. Noting that in the alarm script I logged to the
    facility local6, I need to add this line to my local /etc/syslog.conf, assuming
    that the remote monitor has host name watchdog.


    ```

    local6.info                               @watchdog

    ```


    Don''t forget to configure syslog on watchdog to accept remote input. You will
    need to add the -r flag to the syslog startup script, as shown in Chapter 4, "Installing
    and Configuring for Reliability."


    Remote logging this way is easy, but there are some things to watch for. In the
    event that outage prevents clients from resolving host names, then your client
    syslog would not be able to send to watchdog as it would be unable to determine
    watchdog''s address. You could hardcode the IP address in the syslog configuration
    file, but that makes things less portable. An alternative would be to put watchdog''s
    address in the client''s /etc/hosts work, allowing local name resolution.'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'The same problem applies to the remote server. Incoming log messages carry
    only the IP address of the sender, and syslog on watchdog will try to resolve
    these addresses to host names when it writes them to its local log.


    Watch for overly logging or a logging mechanism that runs away can flood logs
    and cause problems. If you use remote logging, the problem has the potential to
    multiply over the network. Also, the remote syslog has been configured to accept
    remote entries, it has no internal means of deciding who is sending messages.
    This could be a security loophole, leading to the possibility of a denial of service
    attack. You may wish to consider protecting the remote syslog by using a firewall
    and filtering input to the syslog port 514/UDP.


    # Alarming to a Pager


    The final alarm type is pager. In a perfect world, there would be one simple way
    to generate pager messages. But we live in a far from simple world. There are
    in a variety of different ways you can page, as discussed in the accompanying
    sidebar, "A Pager Primer." My example uses the snpp command, which comes as a
    part of the sendpage package mentioned in the sidebar. The -m flag allows inclusion
    of the text to be sent to the pager from the command line, otherwise snpp reads
    from standard input. The last argument to snpp, admin, is an identifier that needs
    to be set up in the send


    # PAGING PRIMER


    Pagers can vary widely, from the simple "you call my pager and leave your number
    and I''ll call you back some time" variety to the current crop of alphanumeric,
    two-way pager cum e-mail client cum Web client models. Probably the most useful
    type in the server management field are the alphanumeric pagers that allow a character
    string message to be sent, describing the problem for the recipient of the page.
    These pagers use the Telocator Alphanumeric Protocol (TAP) protocol, published
