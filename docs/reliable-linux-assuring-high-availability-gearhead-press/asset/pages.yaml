    drives and operating on their communications networks, and possibly also using
    their staff to get it and keep it running. Make sure that your agreement ensures
    that whatever resources were available to you at the time of the test will not
    change without notice. The BR provider should also be able to offer you the option
    of a secure storage location for your off site backup as part of the deal, which
    is ideal as the BR provider''s site is the logical place for the tapes to be held.


    If you choose to go this route, realize that you will also need to consider getting
    your own site either repaired or replaced as soon as possible as the cost and
    inconvenience of running your business from the BR provider''s site may become
    a problem. Also consider that the BR site may be a long distance from your own
    office, which can involve ongoing expenses while your business is running from
    its site.


    # Available Backup Packages


    Having reached the end of the to-do list, you should now have a clear idea of
    what is involved in producing a fully featured backup and recovery system. I have
    also presented some basic tools and scripts to get started. You may decide, however,
    that you prefer to consider prebuilt backup packages that may suit your purposes.


    If you have only a small number of servers to manage, using these packages is
    probably overkill; you may spend more time learning to set them up and use them
    than you would spend building your own system. On the other hand, for a larger
    number of servers these packages come into their own as they are structured to
    handle the issues involved with backing multiple networked servers. But if you
    decide to use one of these packages, don''t discard the preceding material in
    this chapter. You will discover that at the heart of these packages lie basic
    tools like tar and dump, and all of the issues I dealt with so far are still relevant
    whether you build your own system or use a prebuilt one.


    I first present some open source offerings, followed by a selection of commercial
    products:


    AMANDA. The Advanced Maryland Automatic Network Disk Archiver (AMANDA) is written
    and maintained by volunteers at the University of Maryland and is distributed
    under the Berkeley Standard Distribution (BSD) license. It is a backup system
    that allows the administrator of a LAN to set up a master backup server to back
    up multiple hosts to a single, large capacity tape drive. AMANDA uses'
