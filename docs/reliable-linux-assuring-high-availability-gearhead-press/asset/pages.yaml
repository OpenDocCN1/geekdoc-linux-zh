    Because you usually have little of knowing what files may have had writes at the
    time of the crash, or what metadata changes may have been underway, it is impracticable
    to determine which files may have been corrupted by the crash. In short, no file
    can be trusted anymore. It hurts, but the only real solution is to restore the
