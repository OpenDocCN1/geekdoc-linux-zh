  md: '# RPM and Reliability


    So, what has this got to do with reliability? Well, I have yet to see a perfect,
    100 percent bug-free operating system. Even the most vocal supporters of the quality
    of open source code are not unrealistic enough to claim it. So, when a bug is
    discovered, what is the mechanism for dealing with it? In the case of an RPM package,
    the volunteer maintainer of the code receives bug reports and manages fixes. If
    the package is being maintained as an RPM, a new version will be released incorporating
    bug fixes. Inside the RPM, those bugs and fixes should be documented. Most RPMs
    will install a subdirectory under /usr/share/doc containing any documentation
    associated with the package. The subdirectory will have the same name and revision
    level as the package itself. Look for a file titled README, CHANGES, BUGS, or
    possibly NEWS. If the bug is considered critical for security or reliability,
    the manager of the distro''s support channels may announce the new RPM version
    through its distro. Red Hat announces critical updates to its distros through
    its home page, www.redhat.com.


    If you experience a problem on a production server, where you suspect to be a
    bug, first determine the version of the package you are running:


    ```

    $ rpm -qi <package>

    ```


    Next, check with the manager of your distro to see if there are any related bugs.
    Also, check the documentation provided with your current version. If these steps
    don''t explain the exhibited behavior, contact the maintainer of the package and
    file a bug report.


    # Practice Safe RPM


    When server stability is critical, it is important to get your RPMs from a reliable
    source, normally your distro CD-ROM. All RPM files include in the spec info who
    created the RPM and may optionally include a PGP (Pretty Good Privacy, an open
    source data security package) digital signature to verify authenticity. In addition,
    file mode information and MD5 checksums are stored in the RPM. These can be used
    to verify the integrity of the files of the RPM at any time after they have been
    installed, should you become concerned that any files have been corrupted or have
    been tampered with. This is highly useful functionality that the past could only
    be achieved by using an external security scanner, such as COPS or tripwire.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Try


    ```

    # rpm -V <package>

    ```


    to verify integrity and


    ```

    # rpm --checksig <package file>

    ```


    to check PGP signatures. For scripting purposes, rpm will return nonzero if any
    checks fail.


    The development of rpm has created a standardized means of tracking and controlling
    those hundreds of packages from thousands of developers into an organized, maintainable
    structure. Most of the commercial versions of Linux have adopted rpm as a de facto
    standard. This kind of consistency is good for ease of management, and ease of
    management supports stability and reliability. There are other good package management
    systems in Linux distros that do the same job as rpm. I would neither choose nor
    reject a distro solely on the basis of its package management system, but it should
    be a significant factor in your decision making process


    # Document What Works


    Once you have put together a stable server, it is a good idea to document the
    combination of installed packages that works for you. This can help in building
    other servers, and can save time in the event that you have to rebuild a dead
    server from scratch. I know you''ll never have to do that, but it doesn''t hurt
    to be prepared, just in case, Right?


    ```

    # rpm -qa | sort

    ```


    to generate an alphabetically sorted list of installed packages and redirect the
    output to a file stored online as well as offline. Keep the listing up to date
    by creating a new list each time you install or update a package.


