    top of the plate includes heat created by the operation of the cooler itself in
    addition to the heat drawn out of the CPU. It turns out that in fact the cooler
    generates quite a bit of heat. That heat must come from somewhere, implying that
    the power draw of the cooler could be significant, and it is. The bottom line,
    then, that a Peltier plate can definitely keep your CPU cool and nice. But, it
    draws a significant amount of power that it turns into heat, so that should your
    cooling fan fail and all that heat can be dissipated effectively from the heat
    sink, your Peltier cooler turns into a Peltier heater and bake your CPU. This
    doesn''t mean you shouldn''t use a Peltier cooler, but it means that you need
    to be particularly careful about monitoring the cooling fan if you do. I''ll be
    showing you a way to monitor fan operation and CPU temperature later in this chapter.
    And don''t forget to take into consideration the power draw of the Peltier when
    sizing the internal power supply.


    One last on Peltier coolers. Humidity is an issue that needs to be watched. If
    the relative humidity in the room is too high, moisture can condense on the cold
    side of the cooler, and water on the CPU is not a healthy condition. Also, if
    the Peltier plate is a bit bigger than the CPU, the overhang will expose a small
    bit of the cold side to the ambient air, which can cause condensation problems.


    # Case Air Flow


    A good cooling arrangement can still be ineffective if the heat drawn out of the
    CPU cannot be exhausted from the case. A good case design has an engineered airflow
    that passes a good volume of ventilation air outside of the case, across the CPU,
    through the rest of the case, and then on out. The widely used ATX form factor
    case is designed to do this by situate the CPU close to the power supply exhaust
    fan. In the ATX specification, air is drawn through the power supply fan, blown
    out of the power supply onto the CPU, and then exits through the front or side
    of the case. That means that air warmed in its passage through the power supply
    is used to cool the CPU. Many system builders have found this to be less than
    satisfactory, and reverse the airflow, using the power supply fan to exhaust air
    from the case. In addition, extra fans mounted below the power supply or at the
    front of the case are often used to assist airflow through the case.


    When adding extra fans, keep in mind that the idea of good ventilation is neither
    to push as much air into the case as possible or remove as much as possible, but
    to move as much as possible through the case. If a fan at the front of the case
    pushes air in, make sure the fan at the back is sucking it'
