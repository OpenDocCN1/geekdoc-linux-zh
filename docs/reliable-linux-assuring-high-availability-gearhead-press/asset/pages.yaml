  md: '# Incremental dump backups


    Probably the most significant feature of dump is that it supports incremental-back-tal
    backups. Incremental backups ensure that data that has changed since the last
    backup is included in the current backup. This involves a metadata object that
    lists date stamps for files at each backup so that successive backups can compare
    the current state of the data to the state at the time of the last backup and
    so determine which files have changed and so not to be backed up. In a file system
    where a minority of the files account for the majority of the data change, this
    can significantly reduce the amount of data to be backed up and speed up the process.
    Be aware that your mileage will vary in the case where your application uses a
    few large data files, as, for example, some databases do. Even if only a small
    amount of real data has changed, the date stamp on the base file will still change,
    causing the incremental utility to back up the whole data base file.


    Although incremental backup can significantly improve performance, it carries
    a burden of complexity that must be properly managed. Consider that an incremental
    backup routine must start by a complete backup of all the files in the file system.
    Once this is done, successive tapes then record only the changes. If you run your
    backup nightly, then each night a new tape will result in 24 hours of changes.
    If you experience a failure days from now, you can rebuild your data by first
    recovering the full backup reference, then the four intermediate tapes in sequence.
    Thus your system gets rebuilt in something like a live replay of days’ worth of
    activity. Clearly, however, you cannot do this forever. After a year you would
    have 365 tapes, each of which would have to be recovered in exact sequence to
    restore your data to the state it was in at the time of the most recent backup!


    In practice, an incremental system will run a full backup reference typically
    between once per week and once per month, with incrementals occurring daily or
    weekly. One common arrangement is to run a full backup once per month, with a
    weekly backup each weekend and a further daily backup each night. The backup utility
    can be directed to capture only changes in the past 24 hours for the nightly backup,
    whereas the weekly backup will look back and capture changes over the past seven
    days. Thus if a failure occurred on Wednesday of the third week, a restore would
    involve the reference tapes from the first of the month, followed by the tape
    that brings things up to Sunday of the current week, and then the tapes from Monday
    and Tuesday night, in that order.'
  merge: -1
  pgno: 295
