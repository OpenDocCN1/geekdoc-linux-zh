  md: '# Building Reliable Disk Storage


    Now, if any of the data drives fails, the missing chunks stored on that disk can
    be dynamically recreated by the RAID driver by reading the surviving chunks and
    the checksum chunk, using the same calculation that produced the checksum in reverse
    to infer the contents of the missing chunk. On its own, RAID4 gives only a single
