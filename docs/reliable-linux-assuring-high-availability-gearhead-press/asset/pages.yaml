  md: '# Alternative File Systems 341


    means of dealing with the large volumes of metadata that will produce in

    ay particularly efficient manner, which becomes a performance limitation

    in the case of either very large files or very large numbers of small files. ext2

    does a technique of preallocating groups of data blocks to files in

    or to reduce fragmentation, and like the classic UNIX FFS (the Berkeley

    Fast File System) implementation, it distributes i-nodes throughout the file

    system to keep data and metadata as close to each other as possible. The

    goal is to reduce disk seeks. These techniques of data block grouping and

    keeping i-nodes close to give a practical middle ground

    performance that is quite acceptable up to the limited upper size of an ext2

    file system. But with support for larger commercial data structures now

    climbing into terabytes in size is required, something more scalable than

    ext2 is necessary.


    # Improving on ext2


    At its introduction in 1993, ext2 was a welcome improvement over its pre-

    decessors (minix and ext) and soon came to be the de facto standard Linux

    file system. For a number of years it has served well, but as Linux moves

    more and more into the commercial world and into larger and larger scale

    computing, it has become clear that something beyond ext2 is required.

    in this section I present several technologies to address the reliability and

    scalability issues of ext2, and following that, I examine new file

    system designs that incorporate these technologies.


    # Metadata Journaling


    Recall that one of the major reliability shortcomings of ext2 lies in its weak

    fault tolerance. If an active ext2 file system crashes, there is every likelihood

    that upon reboot its metadata may be in an inconsistent state. To solve

    this problem, file system architects turned to the concept of transaction

    journaling, a technique perfected by the authors of transaction processing

    databases.


    Applied to a file system, the concept of a transaction journal works like

    this. At the start of the process of extending a file, an entry is made in a

    journal log, typically a data area set aside either within the same file system

    or in a central location to serve multiple file systems. This entry notes the

    details of the transaction step by step. If, say, separate operations are

    involved in extending a file, such as locating a free block and marking it

    taken, then noting the block number in the i-node, and so on, each step is

    otted in turn in the log. When the final step is complete the file has been'
  merge: -1
  pgno: 364
- img_proc: true
  md: 'successfully extended, the file system metadata structure is in a consistent
    state and would not be harmed by a crash, so the transaction is marked in the
    log as complete. On the other hand, if the system were to crash between steps
    three and four, then upon a reboot the file system journaling code sees a partially
    completed transaction in the journal log when it first attempts to mount the damaged
    file system. The journaling code can then complete the transaction, if possible.
    (However, the data to be written to the file in the case of extending a file would
    usually have been sitting in a memory buffer at the time of the crash, more often
    than this is not so.) if the transaction cannot be completed, the journal code
    will reverse the steps that were complete, returning the file system metadata
    to the consistent state it was in before the file system started. No blocks will
    be left unaccounted for, the file system i-node data structure will be consistent,
    and the file system can be mounted and placed into production.


    A very important point: Journaling as described ensures only the integrity of
    the file system metadata, not the file system production data. In the example
    of extending a file, the file system journal will repair the damage done to the
    file system metadata structure by the crash, but the data that was to be written
    to the extended file has in all likelihood lost. Like RAID, metadata journaling
    is never a substitute for reliable backups.


    If journaling cannot guarantee the integrity of file data, then why bother it?
    The primary motivation behind journaling is often an issue of balancing the requirements
    of performance and reliability. If you are willing to accept that data will be
    lost in a crash, then on the face of it the ext2 file system, with no journaling,
    would suit your purposes. It is true that without journaling, a crash may force
    the file system checker to comb through the file system for metadata inconsistencies;
    but in most cases those inconsistencies can be resolved, by only resorting to
    arbitrary decisions regarding inconsistent situations.


    The problem with it is that this sort of "scavenger" metadata checking takes too
    long. As file system sizes move into the terabytes, these exhaustive checks can
    take many minutes or hours, even on reasonably fast servers. A file system that
    journals transactions, however, need only resolve problems outstanding with those
    transactions that were in process at the time of the crash. Normally this is such
    a small number that the logging process at reboot may take only a few minutes,
    in some cases seconds. The difference in boot time between a nonjournaling file
    system like ext2 and a journaled file system can be dramatic. This reduces down
    time waiting for journal checks to occur.


    Journaling techniques can also be used to speed operations on very busy file systems.
    In this case, multiple operations on a single file can be-'
  merge: -1
  pgno: 365
- img_proc: true
  md: '# Alternative File Systems 343


    lected in the journal and consolidated into larger, more efficient operations.
    For example, if it were desired to add a large number of files to a directory,
    a non-journaled file system would create the directory entries one by one. This
    would require a separate write operation to the parent directory inode for each
    file to be created. This would involve separate disk operations created an inefficient
    pattern of disk access. A file system journal could be used to accumulate multiple
    file creations into a single large write request for the directory file could
    be satisfied with a single disk seek and write operation. It is these two issues,
    reducing file system check time at boot and improving the efficiency of disk metadata
    management that are the primary factors driving the use of journaling in Linux
    servers today.


    # Full Data Journaling


    If journaling is useful in protecting against metadata damage in a crash, could
    the concept be extended to the file data being written and journal that too? That
    way file data would be protected in the case of a server crash. Unfortunately,
    it is not as simple as that. Recall that the real issue with metadata changes
    is that they occur in several atomic steps. The danger is that a crash interrupts
    the sequence, leaving some steps in the process incomplete. The task of the journal
    log is to keep track of the steps and ensure that if the process is interrupted
    it could be replayed after a reboot. To apply the same concept to data would involve
    copying the data from the application write buffer to a journal area, then copying
    it again to disk. This is really only a form of mirroring. If the crash occurs
    while the data is being written from the journal to disk, certainly you can recover
    the data after the reboot from the journal. But what if the crash happens as the
    data is being written from the buffer to the journal? At some point in time the
    data is vulnerable; no level of data journaling can avoid it.(Data journaling
    has a performance-related application, however; see “Data journaling and SMTP
    Performance” as an example.)


    One proposed solution to make data journaling a viable reliability enhancement
    is to implement the full data journaling on a separate disk than the destination
    file system. This would protect the data in the case of a disk crash (although
    the same protection could be had from a RAID). Another possibility would be to
    store the data journaling on a fast, persistent storage device, such as non-volatile
    memory (NVRAM). It is conceivable that an NVRAM hardware device could be designed
    in such a way as to allow any pending writes to be safely transferred to the NVRAM
    unit, even in a complete server failure situation, as the persistent storage device
    would have'
  merge: -1
  pgno: 366
- img_proc: true
  md: '# 344 Linux Reliability Enhancements


    its own power supply (likely a small on board battery). Such devices are in the
    developmental stages and should be viable in the future.


    # DATA JOURNALING AND SMTP PERFORMANCE


    Data journaling offers a reliability advantage for certain applications, but for
    performance rather than reliability reasons. One is the case of Simple Mail Transfer
    Protocol (SMTP) mail forwarding servers. SMTP servers handling large volumes of
    mail have an inherent problem due to a reliability requirement of the SMTP protocol.
    If one SMTP server receives a mail message forwarded from another, the receiving
    machine is not supposed to acknowledge to the sender the receipt of the message
    until it has been safely written to disk on the receiving machine. This ensures
    reliable passing of mail between the servers, there is no way the mail could get
    lost if the receiving machine crashes at any time in the message handling processing.
    The problem poses for the receiving machine, however, is that it must take the
    time to write each individual incoming mail to disk before it can acknowledge
    it, which makes the server''s performance heavily disk bound. For large servers,
    this can be a source of significant performance troubles. The receiving server
    could solve the problem by receiving messages into a fast cache. As soon as the
    message is in the cache, it can be acknowledged and then the message can be scheduled
    to be written out asynchronously, in the normal way that a buffer cache works.
    The problem with this, however, is that in a crash this cache would be lost, and
    with all the mail messages held in it, violating the requirements of the SMTP
    protocol.


    A data journal solves this problem by writing the mail message into the journal
    first. As soon as this is complete, the acknowledgment can be returned. The receiving
    machine can write the data back to the file system at its leisure. If the journaling
    system is written efficiently, it will accumulate batches of writes that it periodically
    flushes to disk. This type of writing generally makes more efficient use of the
    disk than writing each file individually, thus the overall effect is to improve
    mail handling throughput. The data journaling option available in the ext3 file
    system discussed later in this chapter offers some possibilities for this application.


    This is an interesting case, as the issue is really one of performance, not reliability.
    However, if your mail server is too slow to keep up with incoming traffic, clients
    may time out and return errors to end-users. As far as we are concerned, the mail
    server is down. It isn''t really, but if periods of heavy load make it temporarily
    unable to serve all your clients, for those clients that has become an unreliable
    server. It can be dangerous to consider performance and reliability as separate
    issues; one often intrudes upon the other.


    ![](img/8f0b2e54b3e875094917788f9cb87c45_367_0.png)'
