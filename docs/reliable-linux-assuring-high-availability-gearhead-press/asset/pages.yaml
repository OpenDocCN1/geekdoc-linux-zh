    Large disks can pose a threat to reliability. Although it may not seem

    asonable at first, one of the cornerstones of server reliability is that many

    piece of hardware are preferred to a few. The more hardware, the more likely

    will be failures. However, whether there are 5 pieces of hardware or 50,

    you will have a failure over time. If your business relies on only five pieces
    of

