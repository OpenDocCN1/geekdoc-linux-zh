    the possibility of a loss of the entire satellite site, the restoration of any
    file, file system, or drive should be manageable from the central facility. This
    has the advantage of utilizing fully centralized collection and management of
    all backups, reducing the need for backup expertise and hardware at the distant
    sites. It is also possible for the backups to be run to a business recovery (BR)
    provider site. In this case, the BR provider may provide not only the recovery
