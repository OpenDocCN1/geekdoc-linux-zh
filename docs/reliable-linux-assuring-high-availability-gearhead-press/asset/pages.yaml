  md: '# Linux Reliability Enhancements


    Because of its ability to perform well in dealing with large numbers of small
    files, ReiserFS works particularly well with applications such as mail and news
    pools, and HTTP caches, and proxy servers. It is also competitive in general purpose
    usage, equaling or better the performance of ext2 in most categories. This is
    attractive considering that journaling file systems normally come with a measurable
    performance cost. ReiserFS is not tied to architectural designs that are now several
    years old, and it is an innovative use of the most current data indexing algorithms
    that allows it to offer metadata journaling with minimal performance cost.


    Remember, though, metadata journaling is not a guarantee of integrity. On the
    other hand, an application like a news spool or an HTTP proxy would not be hurt
    by the loss of data in a crash. As long as the file system metadata survives,
    any data lost from the cache as a result of the crash would only mean one less
    cache hit afterwards, or one new article that needs to be requested again from
    the upstream server.


    The current version of ReiserFS (version 3.6) does not support ACLs (Access Control
    Lists). ACL support is scheduled for inclusion in the version 4 release of the
    product by the use of external plug-in modules. These modules are a significant
    part of the evolution of ReiserFS. They will allow a third party to effectively
    extend the functionality of the file system to suit their own needs. This is intended
    to increase the community for ReiserFS to include anyone able to write a plug-in,
    so future functional improvement will not be restricted by the limited time the
    core ReiserFS developers have available. The first plug-ins to be written by security
    related, as the Defense Advanced Research Projects Agency DARPA is the primary
    sponsor of this work and its focus is on improving the security mechanisms available
    in a Linux file system. Reiser v4 is scheduled for release later in 2002. You
    can follow its progress and track other ReiserFS issues at www.namesys.com. There
    is also a mailing list available for subscription on this Web that will keep you
    up-to-date on day-to-day ReiserFS issues.


