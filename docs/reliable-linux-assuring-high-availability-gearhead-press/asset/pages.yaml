    # Generic Hardware Monitoring:

    The i2c/SMBus


    The generic solution to hardware monitoring involves an implementation of the
    i2c bus. If your motherboard uses this standard, and many do, Linux can monitor
    it. The i2c bus is a simple two wire serial developed by Philips as a generic
    means of communication with micro controllers. In a modified form known as the
    System Management Bus (SMBus) the i2c bus is used as a communications path by
    certain special function chips on a motherboard. The chips of particular interest
    from a hardware monitoring point of view are those that contain, or can be connected
    to, sensors that measure physical parameters such as voltages, temperatures, or
    fan speeds. The values returned by these sensors can be monitored by operating
    system utilities and alarms sounded if danger thresholds are crossed. Support
    for the i2c bus is built into the 2.4 kernel, but to monitor your hardware you
    will also need the lm_sensors package, which includes device drivers necessary
    to support the wide variety of sensor chips in common use.


