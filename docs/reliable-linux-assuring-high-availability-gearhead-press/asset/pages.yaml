    week number from 0 to 6, starting with Sunday. Cron runs once every minute, so
    the most frequent you could run a cron job would be every minute (which you would
    specify with an asterisk in the first field). Thus, the first uncommented line
    in the previous example implies that the script /usr/local/bin/backup.tux.weekly
    will run at 10 minutes after 5:00 A.M. on a Sunday of the month and in any month
    of the year, but only if the day is Sunday. The last line of the example determines
    that /usr/local/backup.daily runs at 2:00 A.M. every day. You can also specify
    ranges or lists of values. It''s all in the man page. Just use page 5 (man crontab),
    which is the page for the crontab file, rather than the default volume 1 (man
    crontab), which is for the crontab command.


    In addition to user-specific crons, cron also process a global crontab defined
    by /etc/crontab. The default Red Hat /etc/crontab points to a set of four directories:
    /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly, and /etc/cron.monthly. The
    directories in /etc/crontab tell cron to examine each of these directories hourly,
