    # Reliable Cooling


    Keeping component temperature down is an effective way to increase the service
    lifetime of both solid-state and mechanical components. Rising temperatures tend
    to cause exponential increases in failure rates, but if the temperature can be
    kept within design boundaries, it should be possible to get the full service life
    from each component. While some of the largest computers of the 1970s and 1980s
    resorted to liquid cooling, current servers can be adequately cooled by pushing
    modest quantities of air through the case. Processor speeds are continually rising,
    however, and heat generation increases with processor speed. High performance
    cards and disk drives are also becoming significant heat sources, yet at the same
    time there is pressure to make server cases smaller than larger. All this means
    that cooling is becoming more complicated than it once was.


    # CPU Cooling


    The single most important cooling task is the CPU, both as it is obviously central
    to the operation of the machine, and because the CPU is probably the largest single
    heat source case. A 1-GHz processor can generate as much as 35 watts of heat energy
    that needs to be dissipated in some way. While 35 watts may not sound like much,
    all that energy is concentrated into the CPU. Centrating even 35 watts of heat
    generation into an object as small as a CPU case adds up to high temperatures
    and can be a real problem. A dedicated CPU cooling fan is mandatory. The principle
    is: Blow air on the CPU to keep it cool. For a slower, cooler CPU the standard
    fan supplied by the builder of the server is usually sufficient. When entering
    the realm of the 1+ GHz processor, a bit more engineering is advisable. In fact,
    Intel''2s Chief Technology Officer stated recently that "Heat is becoming one
    of the most critical issues in computer and semiconductor design... We have a
    huge problem to cool [future] devices, given normal cooling technologies.'
  merge: -1
  pgno: 88
