  md: '# CHAPTER

    7


    # # Backup and Recovery Strategies


    > The wind said

    nYou know I''m the result of

    forces beyond my control.


    -A. R. Ammons


    It is a reality of life that we must be prepared to deal with forces beyond

    our control. So far, I have shown you a variety of means to assess your risk

    level and put into place defenses against loss. None of these tools are per-

    fect; however, you must consider that forces beyond your control will

    some day ruin your most carefully built, properly configured, well-

    monitored, redundant hardware server. In that case you need to have a

    backup. No form of hardware redundancy or software data duplication

    should ever be considered so reliable as to eliminate the need for a data

    backup. Never say it will never happen to you.


    # ## Causes of Data Loss


    In building a backup strategy, you need to consider the ways that you will

    lose data and build your defenses accordingly. Here is a list of the possible

    loss causes that frame the rest of the chapter:


    +   - Data loss or damaged as a result of accidental or deliberate action

    the part of a legitimate or possibly illegitimate end user. Also, data

    loss as the result of a malfunction of an application. In either case,

    this loss can occur without any hardware failure or operating system'
  merge: -1
  pgno: 284
- img_proc: true
  md: '# 262 Building a Reliable Server


    failure. Often this involves the loss of a single file or local group of files
    and there is no hardware problem with either disk or tape devices. Although the
    loss of the data can cause problems, it should be straightforward to recover the
    lost data from a well-organized backup.


    Data loss as a result of a storage hardware failure inside a server. While using
    RAID and other redundancy strategies (described in Chapter 5, "Building Reliable
    Disk Storage") can reduce the risk of this type of loss, it is still possible
    for the RAID itself to fail. Using RAID does not eliminate the need for backups.
    In this case, the recovery involves replacing the failed hardware as well as recovering
    data from a backup.


    Data loss or application availability loss as a result of a total server failure
    due to something like an internal power supply or motherboard failure. Using fault
    tolerant redundancy can reduce this kind of risk. Your risk analysis may not be
    able to cost justify a heavily fault-tolerant system, however, and a complete
    and fast backup system may be acceptable as an alternative.


    Data loss as a result of a complete site loss, most likely as a result of a natural
    disaster. Recovery in this case involves reproducing the lost site in a different
    physical location, possibly using a third-party disaster recovery service as well
    as recovering your entire operation from backups.


    You need to build a backup strategy that can recover the lost data in each of
    these cases. This chapter examines each of these four cases to build a definition
    of what a good backup system needs to do. I then turn into a to-do list that illustrates
    what you will need to do to build your own backup system.


    # Recovering Files Lost by Accident


    Generally, the first challenge in recovering a lost file is to determine which
    file is lost. That may seem obvious, but in some cases, the files were deleted
    accidentally or deliberately with purpose to damage, it may not be clear which
    files are actually missing. In this case a list of the files that exist at the
    time the last backup was made was useful. Such a list is not itself data; rather
    it is metadata, that is, information useful or necessary to make data available.
    When a backup is made, a list of the files included in the backup needs to be
    made and included as a part of the backup. That list needs to be quickly accessible
    so you will know which tape to look on'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# Backup and Recovery Strategies 263


    for the files you need. It can be argued that the Linux commands you use to produce
    a tape archive list the files in the archive directly from the archive itself,
    and this is true. The problem with that is that the entire archive must be read
    from beginning to end to produce the list of files. Once you have determined which
    archive the files you need are, you then need to return to that archive and search
    through it to extract the files. This is time consuming, which is not good if
    the data loss is causing you downtime. Extracting data from tape tends to be slow
    at best, without adding the overhead of having to search tapes for the files you
    need. The first side of this data loss issue is that the application and the operating
    system are still operative. Thus the application may be able to indicate through
    error messages or logs which it is having trouble either using or finding, and
    all of the operating system utilities necessary for searching and extracting from
    a tape are still working.


    You cannot predict when a file may be lost or when a disk will crash. Consequently,
    if a file is lost and the backed up copy of the file is a month old, it may be
    of marginal value if most or all of the data in the file changed over the past
    month. Also, you want your backup system to be automated as possible. Programmed
    machines are much better at remembering to do a backup every night without fail
    than are people.


    # Recovering from Storage Hardware Failure


    Loss of a disk usually translates to the loss of one or more entire physical file
    systems. Thus, it makes sense to structure your backups such that each tape archive
    file contains a complete physical file system. In the early days of UNIX, people
    commonly backed up physical devices, so that each tape archive represented a backup
    of a single disk. If you are working with a kernel that does not support Logical
    Volume Management (LVM), (discussed in Chapter 8, “Logical Volume Management”),
    this is reasonable because such a kernel requires that a physical file system
    must reside entirely within a single partition, which in turn must be contiguous
    and contained entirely within one disk. Thus, a file system must reside entirely
    within one disk, so a backup of a disk will always contain a complete copy of
    all the file systems on that disk.


    The problem with backing up by disk, however, lies on the restore side. In the
    case of a disk failure, the replacement disk may not be identical to the failed
    disk. If the new disk is larger, this is usually not a problem. If the replacement
    disk is smaller, however, your backup may be useless, since it'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'needs to be streamed entirely onto one device. It is a much better idea to
    backup the self-contained data structure of the physical file system. Then the
    limitation on restore is simply that the replacement disk or disks must be large
    enough to contain each of the file systems archived on the tape rather than the
    contents of the entire tape. If you choose to use a LVM system, backing up by
    file system is mandatory as the physical storage becomes completely disconnected
    from the file system data structures. In effect, a physical file system can be
    distributed in pieces across multiple physical disks.


    # Dealing with Data Damage


    If the disk loss causes either the application or the operating system to crash,
    it is possible—even likely—that your application data will suffer some degree
    of damage. At the time of the crash, a database may have been writing data that
    needs to be consistent in more than one location, or possibly updating an index.


    If the disk that crashes you should not contain any of this dynamic data, you
    may think be okay after you have replaced the operating system or application
    binary disk that died. Unfortunately, because the interruption to the application
    was an disgraceful one, even if no application data was actually lost, the state
    of the data may be inconsistent enough to cause the application trouble when you
    restart it. In this case either you hope that the application has a built-in recovery
    mechanism for this situation (and some do) otherwise you may find it necessary
    to restore your last good application backup as well as fully recover from the
    loss.


    # Recovering from a Total Server Loss


    If a server suffers a physical loss as a power supply failure, there are several
    possible responses. You can treat it the same as an operating system disk by moving
    the application data to a backup server and restarting the application. This assumes
    that the operating system installation on the backup server supports your application.
    In this situation the value of good change management shows through. In the ideal
    case, every server should run an identical operating system image, maximizing
    the interchangeability of each server and making it possible for each server to
    run any of the applications in the shop. In the real world, it may be difficult
    to get by with only one operating system installation for all of your applications;
    but if you keep it as a goal, then you will avoid the opposite extreme, in which
    each server is unique and nothing is interchange'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'able. That situation reduces your fail-over options rather than improving-them.


    On the other hand, it may be less work to replace the failed power supply in the
    original server than shift your application around. And, if your risk analysis
    indicates that your downtime is measured in seconds or minutes rather than hours
    or days, you may want to consider a high availability server cluster, or at least
    an identical standby server you could migrate the application to as quickly as
    possible.


    You hope that the nature of the failure does not cause damage to any disks, but
    if the cause of the failure was a power surge, for example, you may not be that
    lucky. Also, if the server crashes, the resultant application crash could well
    damage or destroy the application data. Thus, it is still necessary to have a
    full backup of both the application and operating system so that you have the
    capability to completely recreate the server from scratch as necessary.


    # Recovering a Lost Site


    The final case to consider is that a result of the loss of a complete operational
    site. This could be a result of a local problem, such as a fire, or it could be
    the result of a natural disaster. A natural disaster can also vary in scale. A
    tornado can be terribly destructive, but on a local scale. Your building could
    be flattened, while another a few feet away may be undamaged. On the other hand,
    a disaster such as a hurricane or large flood can affect hundreds of square miles
    in a drastic way. You will need to assess the risks inherent to your location
    and make plans accordingly.


    Clearly in the case of a site on any scale you will need a backup of both the
    operating system and application stored in a safe off-site location. You also
    need an alternate operations site, in the event that the disaster puts your site
    out of commission for an extended period of time. Finally, you need a plan. In
    the case of disaster, the situation can be confusing. People may be scared, panicky,
    and not functioning normally. You may not have all of your own staff available.
    You need to have an operational means of recovering your business function as
    quickly as possible under these challenging conditions.


    # Backup System Requirements


    Having examined the four loss cases you need to be prepared for, let''s summarize
    the requirements for a backup system capable of coping with'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# 266 Building a Reliable Server


    Table 7.1 Backup System Requirements

    | DATA LOSS CASE | REQUIREMENTS |

    |---|---|

    | Accidental data loss | A quickly accessible list of the files that existed at
    the time the last backup was made. Backups must happen automatically. Backups
    must be as frequent as practicable to minimize data loss, and business recovery
    time. |

    | Loss due to storage hardware failure | Backups must back up complete physical
    file systems. Backups must maintain consistency of dynamic data. Requires procedure
    to recover operating system disk. |

    | Loss due to total server failure | Redundant server for fail over. Complete
    backup of operating system and application. |

    | Total site loss | Complete backup of operating system application off-site.
    A comprehensive plan to restore operations either at a repaired primary site or
    an alternate backup site. |


    the demands of each of these cases. Table 7.1 lists the four loss cases on the
    left and the major requirements on the right.

    The next thing to do is to consider how to build a backup system that meets these
    requirements. I''ll sketch how you could build your own system and then review
    some prewritten packages. I''ll introduce some basic UNIX archiving tools that
    you need to use if you choose to write your own backup system. This information
    is still useful even if you source a prewritten package because a prewritten package
    generally makes use of the same basic routines.


    As a starting point for building a backup system I will restructure the requirements
    column of Table 7.1 into a to-do list. Our goal will then be to cover all the
    points on the list:


    +   - The system must create lists of the files backed up, including their sizes
    and date stamps, and identify which tape file is stored on. This data must be
    available quickly in a recovery situation.

    - The system should backup complete physical file systems.

    - The system must support backups able to deal with dynamically changing data
    with a minimum of operational down time.

    - The system must make backups happen automatically, as frequently as practicable.'
