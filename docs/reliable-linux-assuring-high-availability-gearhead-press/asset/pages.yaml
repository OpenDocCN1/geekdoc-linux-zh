  md: '# CHAPTER 5

    Building Reliable Disk Storage


    > “Two may keep counsel when the third’s away.”

    —Shakespeare (Titus Andronicus, Act IV, Scene ii)


    So far in our server construction we have sourced a hardware platform designed
    to yield the best stability and reliability possible. We have also installed an
    operating system on that platform that will be reliable. Is there anything else
    that can improve the reliability of our server before it is production ready?


    As disk storage is one of the prime failure risks, you should consider using a
    RAID acronym to reduce your disk failure liability. The originators of the concept
    were researchers at the University of California, Berkeley, who introduced the
    phrase redundant array of inexpensive disks in a 1988 paper. Since then, many
    have replaced “inexpensive” with “independent”. Either way, a RAID is a means
    of introducing redundancy to disk storage to reduce the liability to the server
    in the event of a disk failure. RAID is what this chapter is about. I start by
    going through the theory of RAID and show you how the different RAID levels work.
    Then I provide a hands-on tour of the software RAID functionality of the 2.4 Linux
    kernel.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# RAID Theory


    RAID is, strictly speaking, an inaccurate acronym, in that it includes the term
    redundant, implying that any RAID incorporates some form of redundancy. This is
    not the case. The RAID concept is to collect two or more pieces of disk storage
    and combine them into one virtual storage entity. The manner in which pieces are
    combined may incorporate redundancy, fault tolerance and have improved reliability
    the objective. On the other hand, these multiple pieces of disk space may also
    be combined in a manner that improves disk performance or simply makes it easier
    to manage the overall disk storage picture. I will show you each of these methods
    works, but I''ll concentrate on those RAID configurations that truly incorporate
    redundancy in the hands-section at the end of the chapter, since the focus of
    this book is primarily server reliability.


    # The Basic Building Block


    Any RAID is an array, or group, of two or more contiguous pieces of disk space.
    A piece of disk space in this context could be any physical disk or a single partition
    within a disk. No rules say that each of the pieces must be the same size, that
    each of the pieces must be implemented on the same disk technology (for example,
    ATA or SCSI), or even that the pieces must reside on different disks. The size
    and location of the pieces depend on the nature of the RAID being built and the
    RAID''s purpose.


    In the Linux RAID implementation, this basic building block takes the form of
    a standard disk partition, created and managed in the same way as any other disk
    partition. If you want a RAID consisting of three drives, you create a single
    partition on each of the drives, each using the entire drive. Any standard disk
    partitioning command as fdisk may be used to create the partitions.


    A second thing to understand about RAID is that it operates below the level of
    logical storage entities (such as file systems). Once configured and operating,
    a RAID appears to be a physical storage device to any higher-level data structure
    that uses it. In other words, I could create a 10-GB RAID that consists of pieces
    carved from four different physical disk drives that incorporate redundancy so
    that, if any of the drives were to fail, the RAID would still be fully functional.
    Once configured, I may choose to use the RAID to store files and build a file
    system metadata structure in it. To that file system, the RAID will appear to
    be a single 10-GB storage device irrespective of how many actual disks are in
    it or how much actual storage'
  merge: -1
  pgno: 209
- img_proc: true
  md: 'space was required to build it. When the file system reads and writes from
    the RAID, it has no idea that its data is spread around several devices, possibly
    in duplicate. The file system thinks it is writing into a single, contiguous 10-GB
    disk partition. This layered approach is a great advantage because no code or
    application using a RAID needs alteration in any way to work in a RAID environment.


    # Software Raid versus Hardware RAID


    Combining more than one physical device to appear to be a single device can be
    implemented in two ways. You could design a special hardware device that contains
    multiple drives internally, but has firmware and purpose-built hardware inside
    the box that makes these multiple drives appear to be one physical device to the
    server box it is attached to. Such a device is a hardware RAID and usually has
    only one data connector (typically ATA or SCSI) to attach it to the server. Each
    of these RAID devices will have its own operating parameters and features. Since
    they appear to the operating system as a single drive, they are treated differently
    from any other drive from a Linux standpoint.


    There can be a good cost benefit for you to use a hardware-based solution than
    the software RAID presented in this chapter, but implementing hardware RAID is
    a vendor product-specific issue that falls outside of the range of this book.
    Hardware RAID units come in the form of a disk controller card modified with extra
    hardware to perform the disk mirroring and checksum calculation required by the
    various RAID levels. If this is the type of hardware RAID you are considering,
    you will need to ensure that there is a kernel driver for the card you choose.
    To be sure, check with the vendor of the card for the availability of Linux support
    and check the hardware compatibility lists for your distribution. You can find
    the Red Hat compatibility list at hardware.redhat.com.


    The second way a RAID can be built is to use the operating system already knows
    how to talk to disks. Within the operating system, an extension is built so that
    the concatenation of disks or partitions into RAID devices can be done within
    the operating system software. Thus, a RAID can be built using standard disk devices
    and disk hardware. This is termed a software RAID. This capability has been available
    in the Linux kernel for several years, but has undergone revision and improvement
    for the current 2.4 kernel release. This chapter talks about software RAIDs.'
