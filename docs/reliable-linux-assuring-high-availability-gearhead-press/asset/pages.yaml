    rnment. Until recently this calculation overhead was considered too heavy to be
    placed on the operating system CPU, and checksum protected RAID arrays relied
    on special RAID controllers that did these calculations in hardware. Modern 1
    GHz and faster CPU speeds mean that there is often a good supply of processing
