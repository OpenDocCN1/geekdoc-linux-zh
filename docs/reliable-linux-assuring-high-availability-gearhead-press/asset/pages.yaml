  md: 'you may want to consider a backup site located at some distance from your primary
    site. This requires that you have a plan of action in terms of either moving your
    servers to the alternate site, or having backup servers already in place at the
    alternate site. In the latter case, you will need a way to move your current data
    from the primary to the backup site in case of fail over. If there is normally
    good network connectivity between the two sites, Linux supplies some interesting
    network file systems that may help you distribute data in production. Then in
    case of fail over, your data will already be at the backup site. This also offers
    alternatives to off-site tape backups that be time consuming to recover. I''ll
    be talking about these options in Chapter 9, "Alternative File Systems."


    # Tape Backup Failures


    Although CD-R and CD-RW are well supported under Linux, magnetic tape is still
    the most popular backup media by far. Tapes have capacities in the gigabytes,
    while the CD formats, as well as removable media devices such as zip drives are
    typically to hundreds of megabytes. Whichever format you choose, it is critical
    to test your backups on an ongoing basis. Just because the backup appeared to
    finish doesn''t mean it is good. Tape drives are mechanical devices, and need
    maintenance. Heads and capstan rollers should be cleaned on a regular basis, the
    same way that there should be a maintenance schedule for keeping fans clean. Your
    backup procedures should always test backups. I call it Campbell''s Law of Backups.
    Your backup procedure should read back at least of every backup at the time it
    is written to ensure that the tape is good. Also, for every backup tape you create,
    you should be drawing from one storage and testing to make sure it is still good.
    I have heard many stories of people who need to pull a tape in a crisis and discover
    that it is no good.


    Some reuse tapes; others use a tape only once. If you choose not to reuse a tape,
    either physically destroy it or use a bulk eraser to ensure that none of your
    data is left on the tape when it leaves your site. Store tapes in a secure location.
    Make sure that as well as being cool and dry, your tape storage location is free
    from strong magnetic fields. Storing tapes on top of or beside a CRT monitor,
    for example, is not a good idea.


    If you begin to have trouble with a tape drive, it is tempting to peg repair at
    a low priority, after all it doesn''t affect production, right? Not until something
    crashes and you need it. Do you ever check the air in your spare tire? Speaking
    of spares, a spare tape drive is not a bad idea, although you may consider it
    overkill. Replacing the tape drive could bring meaning the'
