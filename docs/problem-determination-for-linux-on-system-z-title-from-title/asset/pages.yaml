  md: '# 3.1.4 top


    The top command displays process statistics and a list of the top CPU-using Linux
    processes. Options are available to interactively change the format and content
    of the display. The process list may be sorted by run time, memory usage, and
    processor usage. Top shows the total number of processes, the number running,
    and the number sleeping. Information is updated every three seconds, or at a chosen
    interval. This is useful in obtaining a snapshot of the processes that are running
    on a Linux system and their CPU and memory consumption.


    Starting with SLES10 and RHEL5, the top command includes a new field, CPU steal
    time—the time Linux wanted to run, but z/VM gave the CPU to some other guest.
    This field will be very useful for understanding CPU performance characteristics
    from within Linux. Also, it is worth noting that top is a resource-consuming tool,
    which means that the performance overhead is comparably high when its is activated.


    # Example 3-7 Gathering process information using top


    ```

