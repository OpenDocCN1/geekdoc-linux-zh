    From the above report we can see heavy swapping (a log of swap-in and swap-out
    activity), which is generally an indication of a problem with memory or disk.
    Usually, memory is mistakenly assumed to be the culprit in most situations because
    swapping involves writing to, and reading from, memory. However, it should always
    be taken into account what other component of the operating system is doing the
    work to make that activity possible, or maybe even unnecessary.


