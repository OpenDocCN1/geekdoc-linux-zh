  md: 'The next obvious statistical data of interest is the system page rate, as we
    can see in Figure 11-5. We can see that there is heavy system paging happening
    during the narrowed down timings.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_342_0.png)


    **Figure 11-5 Example expanded storage page rate with system page rate**


    Increased paging can mean any of the following:


    +   ▶ The number of pages moved in/out of real storage per second (or per command)
    goes up.


    +   ▶ The number of page I/Os per second (or per command) goes up. Note that this
    is different from the previous point, since we can move multiple pages per single
    I/O.


    +   ▶ Paging to expanded storage stays the same or decreases, while paging to
    DASE increases.'
  merge: -1
