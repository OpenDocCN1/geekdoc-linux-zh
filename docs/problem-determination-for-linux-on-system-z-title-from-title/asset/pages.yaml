- pgno: 107
  md: '# 3.2.6 Summary of dump techniques


    Stand-alone dumps are effective in cases of system failures like crash or hang.
    With stand-alone dumps, we are able to:


    +   - Analyze kernel panic, oops messages, and so on.

    +   - Identify direct reasons to lead system down.

    +   - Identify what tasks are processed at failure time.

    +   - Analyze a root cause with memory usage.


    On the other hand, core dumps are useful for problem determination of abnormal
    termination of user space programs and to:


    +   - Identify the causes of the problem that process is exhibiting.

    +   - Analyze the memory structures of the process during a hang or abnormal termination.


    Table 3-3 Summary of dump techniques.


    | Technique | Used for | Description |

    |---|---|---|

    | Stand-alone dump | Kernel-related problems, like system hangs | Physical memory
    dump |

    | Core dump | Process problem | Process memory dump. Used with gdb, Sysrq, and
    so on. |


    # 3.3 Debugging tools


    Linux-based tools are the best choices for debugging application, kernel, or process-related
    problems. In this section we discuss important tools that are used often for problem
    determination.


    As per the problem determination methodology, first the investigation on the problem
    has to be start on the application layer. If the investigation reveals that the
    application layer is not the cause, we further move down the ladder to the OS
    hardware layers, as appropriate.


    Debugging tools are of prime importance while investigating problems such as:


    +   - System hangs

    +   - Kernel-related problems or system call status

    +   - Kernel memory related issues'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'The basic and easiest of all the debugging techniques is to start adding print
    statements to the application code. Upon execution of the application, we can
    analyze the outputs from the print statements through which the cause of the problem
    can be narrowed down. Also, we would be able to immediately see whether the application
    layer is causing the problem. If the application is causing the issue, by using
    the print statements we would be able to narrow down the area of the application
    that causes the problem and take appropriate action.


    # 3.3.1 gdb


    The GNU debugger (gdb) allows us to examine the internals of another program while
    the program executes or retrospectively to see what a program was doing at the
    moment that it crashed. The gdb also allows us to examine and control the execution
    of code and is very useful for evaluating the causes of crashes or general incorrect
    behavior. gdb provides a text-based user interface, and it can be used to debug
    programs written in several languages (C, C++, and others). gdb can be used to
    perform the following operations, which are helpful in the process of debugging
    a compiled program:


    +   - Setting up break points

    +   - Displaying program values and attributes

    +   - Execution step through line by line

    +   - Information about the stake frame


    gdb is run from the shell with the command gdb with the program name as a parameter,
    or we can use the file command once inside gdb to load a program for debugging.
    Both of these assume that you execute the commands from the same directory as
    the program. Once the executables'' symbols are loaded, there are three ways to
    view the process with the debugger:


    +   - View the running process using the attach command.

    +   - Start the program using the run command.

    +   - Use the core file to view the state of the process when it crashed.


    In Example 3-33 we executed a simple program that does an illegal memory reference
    and fails with a segmentation fault.


    *Example 3-33 Program execution that fails with a segmentation fault*


    ```

    nx02:~# ./segfault

    struct1->i : 40

    struct1->j : 50

    Segmentation fault

    ```'
