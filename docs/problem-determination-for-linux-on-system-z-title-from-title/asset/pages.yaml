- pgno: 275
  md: '# 8.3.3 Approach for hardware problems


    The approach that you should take to solving hardware problems would be to first
    contact your hardware support personnel. You will need the hardware support person
    to further investigate the hardware problem.


    Some basic information that they will need is:


    +   1. Machine type

    +   2. Serial number

    +   3. Telephone number of the machine room


    Information that is necessary to provide to your support person is:


    +   1. A description of the problem

    +   2. What you were doing when the problem occurred

    +   3. When it occurred

    +   4. Whether you changed any of the settings just before the problem occurred

    +   5. The information to specify the hardware

    +   6. Information about the hardware (for example, address)

    +   7. Error messages on Linux

    +   8. The information that you can get from HMC


    # Specify the device


    If we can specify the device in error clearly, the following two cases are possible.:


    +   1. One device is in error.

    +   2. The device status is not normal.


    If we cannot specify the device in error, then:


    +   1. The performance trouble could be disk I/O, which may be on different storage
    systems.

    +   2. There may be network connection problems in an environment that has multiple
    NICs.


    After specifying the device in error, check the status and distinguish the error
    (hardware or software).'
  merge: -1
  img_proc: true
- pgno: 276
  md: "# ## Check the status of DASD recognition\n\nNext you will want to check the\
    \ status of DASD recognition by checking the following:\n\n+   - The Common I/O\n\
    +     \n+     - Check `1c5s5` output.\n+       - Check whether the address of\
    \ the target device is displayed.\n+       - Check whether DevType and CU type\
    \ are collect.\n\n+   - The device driver\n+     \n+     - Check the /sys/bus/ccw/drivers/dasd-eckd\
    \ directory.\n+     - Check whether the symbolic link of the target device is\
    \ in /sys/bus/ccw/drivers/dasd-eckd.\n\n+   - Online status\n+     \n+     - Check\
    \ `1sdasd`.\n+     - Check `1c55`.\n+     - Check /sys/bus/ccw/drivers/dasd-eckd/0.0.<address>/online.\n\
    \n# ## Check the status of FCP device recognition\n\nYou will want to check the\
    \ status of your FCP device recognition:\n\n+   - FCP port on System z\n+    \
    \ \n+     - Check the `1c5s5`.\n+     - Use=\"yes\" means that the FCP port is\
    \ online on System z.\n+     - /sys/bus/ccw/drivers/zfcp/0.0.xxxx/online means\
    \ the same.\n\n+   - FCP port on storage system\n+     \n+     - Check the /sys/bus/ccw/drivers/zfcp/0.0.xxxx/\
    \ directory.\n+     - If is a directory that is named with WWPN, FCP port is online\
    \ on the storage system.\n\n+   - LUN recognition\n+     \n+     - Check the /sys/bus/ccw/drivers/zfcp/0.0.xxxx/yyy…yyy/\
    \ directory (yyy…yyy is WWPN).\n+     - There is a directory that is named with\
    \ the LUN number, meaning that the LUN is recognized.\n\n+   - SCS! disk recognition\n\
    +     \n+     - Check `1scss1`.\n+     - Check /proc/scsi/scsi."
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Check the status of OSA recognition


    You will want to check the status of your OSA recognition:


    +   - Common I/O

    +       - Check `1scss`.

    +   - Device driver

    +       - Check the symbolic link about devices on `/sys/bus/ccwgroup/drivers/qeth/*`.

    +       - Check the entry on `/proc/qeth`.

    +   - Online status

    +       - Check `1scss`.

    +       - Check the status on `/proc/qeth`.


    # Investigation of shared devices


    In many Linux on System z environments, system resources (CPU, memory, channel,
    network) are shared. When hardware trouble happens, the same problem will occur
    on all systems that share the hardware.


    If it is difficult to distinguish whether the problem is related to hardware or
    software, additional tests with changing software versions or combinations of
    hardware and software may be necessary.


    +   - Change the software version.

    +       - If the trouble does not occur when the software or hardware version
    is changed, then the software is the problem.

    +   - Assign the same hardware to the other system.

    +       - If the trouble occurs on the other system, then hardware is the problem.

    +       - If the trouble does not occur on the other system, then software is
    the problem.

    +   - Assign different hardware to the same system.

    +       - If the problem occur on the other hardware, then software is the problem.

    +       - If the problem does not occur on the other hardware, then hardware is
    the problem.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# 8.3.4 After determining whether problem is software or hardware


    If it seems that software is the problem:


    +   - Determine whether it is in the device driver layer.

    +   - Determine whether it is on each component.


    If it seems that hardware is the problem:


    +   - Contact hardware support personnel.

    +   - Prepare the procedure for making a hardware exchange.


    If you cannot distinguish whether it is a software or a hardware problem, reproduce
    the problem and gather information:


    +   - Confirm the problem reproduction procedure.

    +   - Set the proper debug level in s390dbf and other log and trace.

    +   - Run the problem reproduction test.

    +   - Get information from dbgfino.sh or other tools.


    # 8.4 Case study


    This section provides case studies of hardware problems.


    # 8.4.1 Memory card


    The characteristics of memory card problems are:


    +   - Memory error messages are displayed on the HMC.

    +   - Notice from remote support facility (RSF).

    +   - Check stop or system hung occurs in some LPARs that share the same memory
    card.

    +   - Environment: RHEL4 update 4 on System z9® LPAR.

    +   - Information gathered: System messages from HMC OS messages.

    +   - Analysis step: Contact a hardware support person.

    +   - Result and solution: Hardware problem. Exchange the memory card.

    +   - Tips: If RSF is reported, we can determine that the trouble is a hardware
    problem.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# ## 8.4.2 OSA


    +   The characteristics of OSA problems would be:

    +   * **State:** Network interface goes down with qeth error messages (Example
    8-11).


    ```

    Example 8-11 /var/log/messages

    ```console

    qeth: check on device 0.0.3600, dstat=x0, cstat=x4 <4>

    qeth: irb: 00 c2 40 17 03 77 50 38 00 04 00 00 00 00 00

    qeth: irb: 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

    qeth: irb: 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

    qeth: irb: 00 00 00 00 00 00 00 00 00 00 00 00 02 00 15 00 5d

    qdio : received check condition on activate queues on device 0.0.3602

    (cs=x4, ds=x0).

    qeth: Recovery of device 0.0.3600 started ...

    bonding: bond1: link status definitely down for interface eth2, disabling it

    bonding: bond1: making interface eth3 the new active one.

    ```

    ```


    +   * **Environment:** SLES9 SP3 on System z9 (not related on LPAR or on z/VM).

    +   * **Information gathered:** dbginfo.sh (especially /var/log/messages).

    +   * **Analysis step**

    +   * Subchannel status on /var/log/messages shows subchannel status (channel
    control check).

    +   * “cstat” on “qeth: check on device... ” shows subchannel status.

    +   * Channel control check is reported when hardware problem happens.

    +   * Contact your hardware support person.

    +   * **Result and solution:** hardware problem. Changing the OSA card will solve
    the problem.

    +   * **Tips:** Device status or subchannel code often shows hints that help distinguish
    between hardware and software problems.'
