- pgno: 312
  md: '# ## 10.2 Where to gather information regarding boot process


    There are many ways to collect information that are provided by the system during
    the boot. You can collect information by accessing the log files /var/log/boot.msg,
    /var/log/oboot.msg, and /var/log/messages. Another way to get information is using
    the `dmesg` command. See Figure 10-6 on page 297.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_312_0.png)


    Figure 10-6 Gathering information.


    The booting problem distinction is done based on the boot message.


    During the boot we can check the log output destination in two environments:


    +   -   LPAR

    +       -   Operating system messages of HMC (default console)

    +       -   Integrated ASCII Console (configuration is needed)

    +   -   Under VM

    +       -   Personal Communications 3270 (P-COMM) Screen Log

    +       -   Integrated 3270 Console of HMC


    After the boot we can check the output destination:


    +   -   `dmesg` command

    +   -   `/var/log/boot.msg` file

    +   -   `/var/log/boot.omsg` file

    +   -   `/var/log/messages`'
  merge: -1
  img_proc: true
