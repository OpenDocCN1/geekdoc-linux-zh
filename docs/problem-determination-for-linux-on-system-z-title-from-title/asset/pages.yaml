    This output indicates the channel load and channel busy distribution. As noted,
    we recommend keeping the channel utilization below 50% for good performance. If
    this value is above 50%, then it may make sense to investigate deeper for performance
    problem determination.


    Investigating for bottlenecks at the storage subsystem level depends on the type
    of storage subsystem used and many other factors. Typically, an investigation
    is necessary at the RAID rank level, DA pair level, HBA level, and so on. The
    cache and processor used in the storage subsystem may also show a bottleneck at
    times depending on the load that it is carrying. In the case of sequential I/O,
    interest should be in measuring the throughput, and in the case of random I/O,
    the interest should be in measuring the IOPS and response time. There are tools
    available to assist in determining the bottleneck at the storage subsystem level
    such as the IBM TotalStorage® Productivity Center for Disk. A more detailed explanation
    of storage subsystem level analysis is beyond the scope of this book. Refer to
    the documentation for the storage subsystem used at your site.


