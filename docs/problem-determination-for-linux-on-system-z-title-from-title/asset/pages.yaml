  md: '# Performance problem determination


    This chapter discusses performance problem determination for Linux on System z.
    We discuss:


    +   - What a performance problem is

    +   - General flow of performance problem determination

    +   - Case studies'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 5.1 What a performance problem is


    Typically, when the user of a system is expecting the system to deliver something
    and if the system is not able to deliver up to the expectation, then we say that
    there is a performance problem with that system. Based on the expectation of the
    user, this can vary. For example, when a system is running at 100% processor utilization
    and if the users do not face any issues with the responsiveness or throughput
    of the system, then there is no performance problem with the system. So, it is
    important to understand the expectation before trying to troubleshoot.


    The majority of performance problems arise due to the misconfiguration of the
    system or not meeting all the prerequisites. Performance problems may arise because
    of resource bottlenecks (for example, applications or middleware consume all the
    resources on the system), software problems (improper configurations, software
    bugs, and so on), and hardware problems.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# 5.2 General flow of performance problem determination


    Performance problems can arise at the hardware level, the operating system level,
    the middleware level, or the application level. Figure 5-1 shows the approach
    to problem determination classified in these layers. The scope of this chapter
    is problem determination at an operating system level. However, the following
    points should be noted:


    +   - Investigation at the OS layer alone may not be always sufficient.

    +   - Sometimes investigation at each separate layer is not enough, and the other
    layers needs to be investigated as well.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_180_0.png)


    Figure 5-1 Performance problem determination layers'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'CPU, memory and I/O are all related to hardware, but these are the resources
    managed by the operating system, so the operating system level problem determination
    is typically concentrated around these resources. As illustrated in Figure 5-2,
    performance problem determination starts with understanding the problem and its
    occurrence.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_181_0.png)


    +   Definition of problem

    +   - What is the performance requirement?

    +   - What is the target value?

    +   - How was the target value derived?

    +   - What is the influence level and the emergency level of the problem?

    +   Information gathering

    +   - Necessary data is different in each layer

    +     - information about configuration and parameter

    +     - resource utilization

    +     - processing logic

    +     - etc...

    +   - In addition, more detailed data is gradually acquired in the PD process
    to isolate the problem

    +   - The acquisition interval of resource utilization might be shorter compared
    to usual monitoring


    Figure 5-2 Performance problem determination - defining the problem


    As shown in Figure 5-2, the first step is to understand the problem clearly. As
    noted, it is important to understand the expectations of the user of the system
    and what makes him think that there is a performance problem. It is also important
    to understand the system environment to learn about any external factors affecting
    the performance of the system. After understanding the problem description, the
    next step is to gather more information, such as configuration parameters, how
    resources are utilized, and processing logic of the applications. As the problem
    determination exercise progresses, more data is gathered for detailed analysis
    and to isolate the problem. It is also typical that during the problem-determination
    process, the system resource utilization is monitored very frequently for smaller
    intervals than what is done under normal circumstances.'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'As indicated in Figure 5-3, from an operating system perspective, the utilization
    of CPU, memory, disk, and network is the main data analyzed for problem determination.
    Although it depends on the problem at hand, in most of the cases the investigation
    starts by examining the CPU constraints. One reason for this is that the CPU constraint
    is probably the easiest to find.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_182_0.png)


    +   - In the viewpoint of OS, we mainly investigate the utilization of physical
    resources (CPU, memory, disk, and network)

    +   - It depends on the problem at hand to decide from where to start troubleshooting


    Figure 5-3 Performance problem determination - cause investigation


    As shown in Figure 5-4 on page 168, the system is checked to see whether there
    are any CPU constraints. If the system seems to be CPU bound, then it is investigated
    further to understand which process and which application is creating the problem.
    If the system is not having CPU constraints, the next resource to be considered
    is memory. If there is a memory constraint, then it is investigated further to
    understand exactly where this is happening. If CPU and memory constraints are
    not found, the next thing to examine is an I/O resource constraint. In case of
    I/O resources, there are two major sub-resources: disk and network. If there is
    no resource constraint observed at the I/O level either, then it may be necessary
    to investigate the interaction of different layers indicated in Figure 5-1 on
    page 165. Sometimes it may happen that solving one bottleneck will introduce another
    bottleneck, which needs to be resolved.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/f332344337ca8bf6846cb313a66ee0b3_183_0.png)


    Figure 5-4 Performance problem determination - typical cause investigation flow


    Generally, problems occur because of a change. This could be a change in the system
    configuration, a change in the resource allocation, a change in the parameters
    used for the configuration, and so on. When problems occur in an environment where
    everything was working perfectly, the first thing to be checked is for any change
    (in the environment, on the system, and so on).'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'As shown in Figure 5-5, investigation, tuning, and testing are interrelated
    activities. This is because an investigation will lead to a solution, and it is
    important to test the solution to make sure that it really works. Also, when the
    solution is tested, it may become apparent that the solution is solving the problem
    at hand but introduces a new bottleneck. In this case, the newly identified problem
    has to be investigated and a new solution needs to be found.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_184_0.png)


    +   - The solution for the problem at hand could be derived by

    +     - system configuration change

    +     - resource allocation change

    +     - parameter change

    +     - resource reinforcement

    +     - etc....

    +   - The testing is done to verify that problem is solved by the derived solution

    +     - A lot of changes are not executed at a time

    +     - Verify multiple times and find the best configuration or parameter

    +   - There is a possibility that another bottleneck is introduced or realized
    while we eliminate one

    +     - in that case, investigate the cause of newly identified bottleneck and
    derive a solution


    Figure 5-5 Performance problem determination - tuning and testing


    While testing a solution, it is important to make only one change at a time. When
    many changes are done at the same time, it will be difficult to conclude which
    change solved the problem, if it gets resolved. Making multiple changes at the
    same time might introduce new problems as well. Then it becomes difficult to roll
    back since, we may not know which change created the new problem. It is a good
    practice to verify a solution multiple times to find the best configuration or
    parameter.


    # 5.2.1 Data necessary for investigation


    Collecting as much data as possible is important for any kind of problem determination.
    This is true for performance problem determination, too. We need'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'to collect the information about the system configuration such as the mode
    of operation (that is, LPAR or z/VM guest), how many CPUs are allocated, how much
    memory is allocated, how many disks are assigned, minidisks or dedicated disks,
    how many channel paths are there for disk access, type of networking options used
    (QDIO, iQDIO, and so on), software versions (kernel level, z/VM service level,
    and so on), and type of applications running on the system and their nature (that
    is, CPU intensive, memory intensive, I/O intensive, and so on). We need to understand
    how the system is configured, such as the kernel parameters configured and resource
    usage limits (for example, ulimit). Another important set of information is to
    collect the resource utilization data for the system under consideration. Resource
    utilization data includes CPU utilization, memory utilization, disk utilization,
    and network utilization. In the case of CPU and memory, what we need to know is
    how much CPU or memory there is, how much is utilized, how quickly its getting
    consumed, who is using it, and so on. In the case of disk and network, what we
    need to know is how much data is getting transferred, how many I/O operations
    are performed to transfer the data, and so on. Although it is useful to have real-time
    statistics, for effective performance problem determination, historical data for
    the resource utilization is required. In case historical data is not available,
    resource utilization should be measured at regular intervals and the results should
    be analyzed.


    Refer to Chapter 3, “Problem determination tools for Linux on System z” on page
    59, for a summary of the common Linux tools used for information gathering.


    # 5.2.2 CPU bottlenecks


    In this section we discuss CPU bottlenecks. Let us first take a brief look at
    how Linux and z/VM uses the CPU.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'The Linux CPU management is illustrated in Figure 5-6. Only one process gets
    executed on a given CPU at a time. The processes that are ready to be executed
    on a CPU are maintained in a ready queue. From there, the Linux system puts a
    process to the processor. After some time, the Linux system moves out that process
    from the CPU and puts in another process. The processes waiting to enter the ready
    queue are maintained in a waiting queue.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_186_0.png)


    Figure 5-6 Linux CPU management'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'Figure 5-7 illustrates the CPU sharing on System z. At the LPAR level, the
    physical CPUs are assigned to logical CPUs by the logic in the microcode. The
    processes executed by each LPAR on the logical CPUs assigned to them are executed
    on the physical CPUs on a time-sharing basis by the microcode logic. In case of
    z/VM, the virtual machines see virtual CPUs assigned by z/VM. Similar to the microcode
    logic, z/VM takes care of executing the processes from the virtual machines on
    a time-sharing basis.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_187_0.png)


    Figure 5-7 CPU sharing on System z'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'The CPU utilization is calculated as shown in Figure 5-8. As seen in figure,
    the CPU time is not the entire duration. It is only those times during which the
    CPU was really used. For example, when the vmstat command is executed with a 5-second
    interval, the tool calculates how many times the CPU was used during this 5-second
    interval.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_188_0.png)


    Figure 5-8 CPU utilization'
  merge: -1
