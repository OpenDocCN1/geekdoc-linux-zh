  md: 'In certain cases it is possible that there is not much useful information available
    to analyze for problem determination. In such cases, it is better to execute specific
    commands and analyze their output for problem determination. Figure 4-15 shows
    a simple but common and powerful way of using the ping command to narrow down
    the problem with respect to some of the layers. As can be seen from the diagram,
    if the result of a ping command is a success, then we are sure that the network
    cable is connected, the network interface is active, and IP communication (network
    layer) is happening. In such a case, it is certain that the problem is somewhere
    above the IP layer.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_142_0.png)


    Figure 4-15 Using the ping command to narrow down to the problem layers


    On the other hand, if the ping was a failure, then it is clear that there is some
    problem below the TCP/UDP layer itself. This could be a hardware problem such
    as the cable not being connected, and so on. In this case, it is clear that the
    first level troubleshooting should start at the IP layer level and below.


    We now discuss how to survey in each layer to narrow down a problem.


    # Survey in the IP layer


    Because of the simplicity of the ping command, it is usually better to start at
    the IP layer and narrow up or down while we troubleshoot a problem.'
