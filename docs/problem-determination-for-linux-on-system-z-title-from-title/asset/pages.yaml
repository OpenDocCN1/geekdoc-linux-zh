- pgno: 124
  md: '# Network problem determination


    This chapter discusses network problem determination for Linux on System z.

    The focus of this chapter is on Linux running on z/VM. We discuss the following
    topics:


    +   - Overview of networking options for Linux on System z

    +   - Network interface detection and configuration under Linux on System z

    +   - The art of network problem determination

    +   - Case study


    ![](img/f332344337ca8bf6846cb313a66ee0b3_124_0.png)'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 4.1 Overview of networking options for Linux on System z


    The networking options available to Linux on System z can be split broadly into
    two categories: physical hardware and virtualization technology. Physical hardware,
    as the term suggests, covers physical network interfaces, or in the case of HiperSockets,
    a networking implementation that requires a System z server. Virtualization technology
    covers the networking options available to those users who plan to run Linux in
    a z/VM environment only. The z/VM operating system can use any of the physical
    networking options as well. Thus, Linux systems running as virtual machines (VMs)
    in a z/VM environment have the choice of using any of the physical options, any
    of the virtualization technology options, or a combination of both, including:


    +   - Physical networking options

    +     - Open Systems Adapters

    +     - HiperSockets

    +   - Virtualization technology

    +     - Guest LAN

    +     - z/VM virtual switch (VSwitch)


    # 4.1.1 Open Systems Adapters


    The Open Systems Adapter (OSA) card is the network adapter for the System z server
    to connect to the outside world (Open Systems). Depending on the exact type of
    the OSA card used, 10 Gigabit Ethernet (10 G or 10 GbE), Gigabit Ethernet (GbE),
    1000Base-T Ethernet, Fast Ethernet (FENET), Token-Ring, and Asynchronous Transfer
    Mode (ATM) are supported. For Linux connectivity, these cards are recognized by
    the hardware I/O configuration as of the following channel types:


    +   - Queued Direct I/O (QDIO)

    +   - Non-Queued Direct I/O (OSE)


    > Note: For a detailed description of OSA-Express operating modes and limitations,
    refer to the IBM Redbooks publication OSA-Express Implementation Guide, SG24-5948.


    # Queued Direct I/O mode


    Queued Direct I/O (QDIO) is a highly efficient data transfer mechanism. It reduces
    system overhead and improves throughput by using system memory queues and a signaling
    protocol to directly exchange data between the OSA card microprocessor and the
    TCP/IP stack.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Non-Queued Direct I/O (non-QDIO) mode


    In non-QDIO mode, the data follows a longer I/O path. Linux uses the LCS device
    driver to communicate with the device when it is running in this mode. Figure
    4-1 shows the difference in the QDIO and non-QDIO data paths.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_126_0.png)


    Figure 4-1 QDIO and non-QDIO data paths


    # Transport modes


    For IP and non-IP workloads, the current OSA cards support two transport modes:
    Layer 2 (Link or Ethernet layer) and Layer 3 (network or IP layer). Each mode
    processes network data differently.


    Layer 2:


    +   - Uses the MAC destination address to identify hosts and send and receive
    Ethernet frames.

    +   - Transports Ethernet frames (not IP datagrams) to and from the operating
    system TCP/IP stack and the physical network.

    +   - Does not ARP offload. ARP processing is performed by each operating system
    TCP/IP stack.

    +   - Supports MAC level unicast, multicast, and broadcast.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Layer 3 has the following characteristics:


    +   - Data is transmitted based on the IP address.

    +   - Only IP addresses are used to identify hosts on the LAN segment.

    +   - All ARP processing is done by the adapter itself, not by any operating system
    sharing the adapter.

    +   - A single MAC address is managed by the adapter for all guests sharing the
    adapter port.


    # LPAR-to-LPAR communication


    A port of the OSA card can be shared across multiple LPARs. Also, access to a
    port on the card can be shared concurrently among multiple TCP/IP stacks within
    the same LPAR. When port sharing, the OSA card running in the QDIO mode has the
    ability to send and receive IP traffic between LPARs without sending the IP packets
    over the network.


    For outbound packets, the OSA card uses the next hope address provided by the
    TCP/IP stack to determine where to send the packet. If this next-hope address
    had been registered by another TCP/IP stack sharing this OSA card, the packet
    is delivered directly to that TCP/IP stack, and not sent over the LAN. This makes
    possible the routing of IP packets within the same host system.


    > Note: Port sharing is supported only between ports that are of the same transport
    mode, for example, Layer 2 with Layer 2 and Layer 3 with Layer 3.


    # 4.1.2 HiperSockets


    HiperSockets provides very fast TCP/IP communications between servers running
    in different LPARs on a System z machine. Each HiperSocket is defined as a CHPID
    of type IQD.


    To communicate between servers running in the same System z server, HiperSockets
    sets up I/O queues in the System z server memory. The packets are then transferred
    at memory speeds between the servers, thereby totally eliminating the I/O subsystem
    overhead and any external network latency.


    HiperSockets implementation is based on the OSA QDIO protocol. Therefore, HiperSockets
    is called the internal QDIO (iQDIO). HiperSockets is implemented in microcode
    that emulates the Logical Link Control (LLC) layer of an OSA card.


    From a Linux on System z perspective, the HiperSockets interface looks a lot like
    an OSA QDIO mode interface. Linux uses the qdio and qeth modules to exploit HiperSockets.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 4.1.3 Guest LAN


    Starting with z/VM V4.2, the z/VM Control Program (control program CP) has been
    enhanced to provide a feature known as Guest LAN. This feature enables you to
    create multiple Virtual LAN segments within a z/VM environment. As can be seen
    from Figure 4-2, Guest LANs do not have a physical connection to the external
    network. Instead, they must use a router (z/VM TCP/IP or Linux). The Linux router
    or the z/VM TCP/IP stack must have an external interface such as an OSA card,
    and an interface connected to the LAN.


    > Note: Although the structures and the simulated devices related to the Guest
    LAN under z/VM are virtual, we use the term Guest LAN and not Virtual LAN, because
    the term Virtual LAN (VLAN) has a different meaning in the networking world.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_128_0.png)


    Figure 4-2 z/VM Guest LAN


    # 4.1.4 Virtual Switch


    The z/VM Virtual Switch (VSWITCH) introduced with z/VM V4.4 builds on the Guest
    LAN technology delivered in earlier z/VM releases. VSWITCH connects a Guest LAN
    to an external interface network using an tOSA card port. Two additional OSA card
    ports can be specified as backups in the VSWITCH'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'definition. The Linux guest connected to the VSWITCH is on the same subnet
    as the OSA card ports and other machines connected to that physical LAN segment.


    The z/VM V4.4 implementation of VSWITCH operates at Layer 3 (network layer) of
    the OSI model. It only supports the transport of the IP packets, and hence can
    be used only for TCP/IP-related applications. In z/VM V5.1, the VSWITCH implementation
    was extended to also have the ability to operate at Layer 2 (data link layer)
    of the OSI model. Because the VSWITCH is essentially connected to the physical
    LAN, the requirement for an intermediate router between the physical and (internal)
    Guest LAN segments is removed.


    # 4.1.5 Summary of networking options for Linux on System z


    Figure 4-3 shows a summary of the networking options that we have discussed for
    Linux on System z.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_129_0.png)


    Figure 4-3 Summary of important networking options for Linux on System z'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 4.2 Network interface detection and configuration under Linux on System z


    The network interface detection and configuration under Linux on System z happens
    through multiple steps. We touch upon some of the important points related to
    the network interface detection and configuration in this section.


    > **Note:** Configuration files and boot or command execution messages from SuSE
    Linux Enterprise Server are used as examples throughout this chapter. However,
    the concept applies to Red Hat Enterprise Linux as well.


    # 4.2.1 The Linux hotplug system


    The Linux hotplug system is used for managing devices that are connected to the
    system. Strictly speaking, the Linux hotplug project has two functions within
    it, called the coldplug and the hotplug. Devices connected at boot time, and some
    of the not-so-easy-to-detect devices are detected by coldplug. For PCI devices,
    there is a positive and negative list of device types that should be initialized
    or skipped by the coldplug, respectively. The hotplug is used to manage devices
    that can be plugged or unplugged dynamically. The hotplug also handles any device
    detection task after the kernel is booted.


    The hotplug scripts (also known as the *.rc scripts) print a character for each
    scanned device. Table 4-1 lists these characters with their meanings.


    Table 4-1 Characters printed by the Linux hotplug scripts for each scanned device


    | Character | Meaning |

    |---|---|

    | . (period) | The device is already initialized and therefore skipped. |

    | * (asterisk) | Generate a hotplug event for this device. |

    | W | The device is not there in the white list and is therefore skipped. |

    | B | The device is there in the black list and is therefore skipped. |'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# 4.2.2 Flow of network interface detection and activation under Linux


    Figure 4-4 summarizes the network interface detection for Linux on System z. The
    hotplug or the coldplug scripts ensure that the correct modules are loaded with
    the correct options. Then the interface names are allocated. Once the interface
    names are allocated, appropriate configuration files are read and network parameters
    are configured.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_131_0.png)


    Figure 4-4 Linux network interface detection and activation flow


    Figure 4-5 on page 117 shows the sequence in which a network interface is detected
    with respect to time when the system is coming up. As the diagram shows, the coldplug
    system calls the hwup command to bring the devices up. Usually, there will be
    three interfaces associated with each network interface, and it is the duty of
    the ccwgroup.agent to group these devices form an interface and allocate an interface
    name. Once the interface names are allocated, the network scripts will assign
    the IP address and other parameters for the interface. Depending on the configuration,
    the network interface may come up by default, or manual intervention will be required
    to bring it up.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/f332344337ca8bf6846cb313a66ee0b3_132_0.png)


    Figure 4-5 Linux network interface detection sequence


    Figure 4-6 on page 118 shows sample boot messages generated by a Linux system
    when the network interface is detected and enabled. The top part of the messages
    indicate that the qdio and qeth modules are loaded in to the memory. These modules
    are required for a Linux on System z system to communicate with the network device
    in the QDIO mode. The next lines indicate the details of the device detected.
    In Figure 4-6 on page 118, the fourth line from top indicates that the device
    addresses are 0.0.02dc, 0.0.02dd, and 0.0.02de. OSD in the same message line indicates
    that the OSA card is configured in the QDIO mode. Subsequent lines indicate the
    MAC address, interface names, and list of features enabled on the card.'
  merge: -1
