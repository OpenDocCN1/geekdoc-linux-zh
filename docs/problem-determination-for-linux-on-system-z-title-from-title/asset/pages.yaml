  md: '# Gathering zFCP statistics


    To gather zFCP statistical information:


    +   1. Depending on your Linux distribution, the files for zFCP statistics can
    be found as follows:

    +      - For SLES10 and later, depending on where debugfs is mounted, `<mount_point_debugfs>/statistics`.
    For example, if debugfs is mounted at directory `/sys/kernel/debug/`, all the
    collected statistics data can be found at `/sys/kernel/debug/statistics/`.

    +      - For SLES9, depending on where proc is mounted (SLES9 does not use debugfs),
    `<mount_point_proc>/statistics`.

    +   2. For each device (adapter as well as LUN) a subdirectory is created when
    mounting the device. A subdirectory is named:

    +      - `zfcp-<device-bus-id>` for an adapter

    +      - `zfcp-<device-bus-id><WWPN><LUN>` for a LUN

    +   3. Each subdirectory contains two files, a data file and a definition file.


    To switch on data gathering for the devices, see Example 3-22


    # Example 3-22 Enabling zFCP statistics


    ```

    echo on=1 > definition

    ```


    To switch off data gathering for the devices, see Example 3-23.


    # Example 3-23 Disabling zFCP statistics


    ```

    echo on=0 > definition

    ```


    Table 3-1 shows an example of the output formats of different statistic types.


    # Table 3-1 Example statistics types


    | Statistics time | Output format | Number of lines |

    |---|---|---|

    | Value | <name> <total> | 1 |

    | range | <name> <total> <min> <avg> <max> | 1 |

    | list | <name> <Xn> <total for Xn> | <= entries_max |'
