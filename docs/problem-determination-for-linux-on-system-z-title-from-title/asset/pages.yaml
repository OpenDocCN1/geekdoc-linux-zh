  md: '# Table 3-5 Sysrq Log levels


    | Level | explanation |

    |---|---|

    | 0 | KERN_EMERG<br>system cannot be used |

    | 1 | KERN_ALERT<br>need action immediately |

    | 2 | KERN_CRIT<br>critical situation |

    | 3 | KERN_ERR<br>error situation |

    | 4 | KERN_WARNING<br>warning situation |

    | 5 | KERN_NOTICE<br>normal situation |

    | 6 | KERN_INFO<br>notification |

    | 7 | KERN_DEBUG<br>debug |


    **Note:** There are some reported problems that lead to a kernel panic when the
    SysRq key is used. The kernel has been fixed and the problems do not appear in
    the following releases:


    +   - SLES9: 2.6.5-7.252 and later

    +   - RHEL4: 2.6.9-35 and later


    A stack trace from using SysRq would help in analyzing strange behaviors in the
    system such as when multiple user space programs stop responding and when keyboard
    input is still possible. Usually, a SysRq trace would be used in conjunction with
    other standalone and core dumps.'
