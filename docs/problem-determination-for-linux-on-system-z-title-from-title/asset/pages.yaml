  md: '# System and environment setup for core dump


    Before we can go ahead with generating a core dump, we need to enable the core
    dump in the system. This can be done using the ulimit -c unlimited command. This
    command would set the core enabled for the current shell and all the processes
    started from it.


    ```

    lnx02:/etc/security # ulimit -c unlimited

    lnx02:/etc/security # ulimit -a

    core file size        (blocks, -c) unlimited

    data seg size         (kbytes, -d) unlimited

    file size             (blocks, -f) unlimited

    pending signals       (-i) 4096

    max locked memory     (kbytes, -l) 32

    max memory size       (kbytes, -m) unlimited

    open files            (-n) 1024

    pipe size             (512 bytes, -p) 8

    POSIX message queues  (bytes, -q) 819200

    stack size            (kbytes, -s) 8192

    cpu time              (seconds, -t) unlimited

    max user processes    (-u) 4096

    virtual memory        (kbytes, -v) unlimited

    file locks            (-x) unlimited

    ```


    Figure 3-10 Example enabling of core file size using ulimit


    For individual users we can set the values through the /etc/security/limits.conf
    or ulimts.conf file. The same thing can also be achieved by adding the "ulimit
    -c unlimited" in the .bash_profile.


    For system-wide setting up of the core values, we can also place the core setup
    information in /etc/init script, but it has to be handled carefully for unexpected
    core dumps in the system.


    Normally, the core file would be generated in the current directory, but we can
    also set up the output location of the core file. This can be done by using the
    command sysctl, or we can also permanently added the configuration in the sysctl.conf
    file under the /etc directory.


    Example 3-29 Example to set up output location using sysctl


    ```

    sysctl -w kernel.core_pattern=/<output_dir>/<file name : core.%h.%t.%e>

    ```


    # Obtaining a core dump


    There are multiple ways to obtain a core dump in Linux.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# SIGNAL


    Send a signal to the process using the kill command. The PID of the application
    can be gathered from the ''ps -ef'' process listing. As per the POSIX standard,
    the following (Example 3-30) are the some of the important signals available in
    Linux. We can use any of the signals that has an action of creating a core dump.


    Example 3-30 Important signals available in Linux


    | Signal | Value | Action | Description |

    |---|---|---|---|

    | SIGINT | 2 | TERM | Interrupt from keyboard |

    | SIGQUIT | 3 | CORE | Quit from keyboard |

    | SIGILL | 4 | CORE | Illegal instruction |

    | SIGABRT | 6 | CORE | Abort signal |

    | SIGFPE | 8 | CORE | Floating point exception |

