- pgno: 44
  md: 'Software Support to run a trace in order to investigate a problem. We describe
    here how to do so and provide an example. Interpreting this trace is beyond the
    scope of this book, but you will need to know how to generate a trace when IBM
    Software Services asks you to produce a trace to investigate a problem. To set
    up and control the execution of a trace within z/VM we can use the CP command
    trace.


    The virtual machine tracing facility allows you to follow or trace the execution
    of almost anything that takes place while you are using your virtual machine.
    For example, you can trace instructions, I/O interrupts, branches, and changes
    to storage. You can limit tracing to a specified storage range and to events that
    affect a specific device.


    Each traced event results in a trace entry, a command response that you can have
    sent to your virtual console, to a virtual printer, or to both. The trace entry
    is made up of significant information about the event. You can use trace entries
    to analyze the operation of your virtual machine and to debug problems.


    Before you can use the trace command, you must know the meaning of a trace trap
    and trace sets.


    +   - A trace trap is a unit of control that allows you to tell CP what event
    you want to trace and the conditions under which you want the event traced.

    +   - A trace set is a collection of one or more trace traps that are active at
    the same time. To trace different types of events, you can pass control between
    different trace sets. A trace set can also contain no trace traps, in which case
    the trace set is called a null trace set. You can use null trace sets to temporarily
    stop tracing.


    After you have decided to use trace:


    +   1. Choose events that you want to trace.

    +   2. Name a trace set and create the appropriate traps.

    +   3. Run the program that you want to trace. You can trace anything that runs
    in your virtual machine. Modify your existing trace sets or create new sets as
    needed.'
  merge: -1
  img_proc: true
- pgno: 45
  md: "In our example we want to trace all instructions that occur between storage\
    \ locations 40000 and 41000. We do not want CP to stop the virtual machine when\
    \ it traps an event. The command to set up the trace trap is shown in Example\
    \ 2-1. Since the trace could produce many lines of messages, we should be careful\
    \ to collect all of them for further detailed investigation. Therefore, we spooled\
    \ the console messages with the command shown in bold on the second line in Example\
    \ 2-1. Subsequently, we checked the setting of the trace trap with the q trace\
    \ command.\n\n# Example 2-1 Example of the trace command\n\n```\n#cp trace instruction\
    \ from 40000-41000 run\n#cp spool cons * start\n#cp q trace\n```\n\n```\nNAME\
    \ INITIAL    (ACTIVE)\n\n1   INSTR PSWA 00040000-00041000\n    TERM  NOPRINT RUN\
    \   SIM\n    SKIP 00000 PASS 00000 STOP 00000 STEP 00000\n    CMD   NONE\n```"
  merge: -1
  img_proc: true
