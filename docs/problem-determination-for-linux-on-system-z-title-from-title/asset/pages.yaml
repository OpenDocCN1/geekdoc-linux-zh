    # 2.2 IBM z/VM Performance Toolkit


    The IBM z/VM Performance Toolkit (also called the Performance Toolkit) is designed
    to assist operators and system programmers or analysts in the following areas:


    +   - System console operation in full panel mode


    The features provided have been designed to facilitate the operation of VM systems,
    thereby improving operator efficiency and productivity.


    +   - Performance monitoring on z/VM systems


    An enhanced real-time performance monitor allows system programmers to monitor
    system performance and to analyze bottlenecks. Features included in the monitor,
    and the manner in which data is displayed, have both been designed to improve
    the system programmer''s productivity when analyzing the system, and to allow
    even a new user to work efficiently with the tool. The Performance Toolkit can
    help system programmers to make more efficient use of system resources, increase
    system productivity, and improve user satisfaction.


    The IBM z/VM Performance Toolkit features include:


    +   - Automatic threshold monitoring of many key performance indicators with operator
    notification if user-defined limits are exceeded

    +   - Special performance monitoring mode with displays for monitoring:

    +     - General CPU performance

    +     - System and user storage utilization and management

    +     - Channel and I/O device performance, including cache data

    +     - Detailed I/O device performance, including information about the I/O load
    caused by specific minidisks on a real disk pack

    +     - General user data: resource consumption, paging information, IUCV and
    VMCF communications, wait states, response times

    +     - Detailed user performance, including status and load of virtual devices

    +     - Summary and detailed information about shared file system servers

    +     - Configuration and performance information for TCP/IP servers'
  merge: -1
  img_proc: true
- pgno: 54
  md: '+   - Linux performance data - system execution space (SXS) performance data

    +   - Virtual networking configuration and performance data


    The collected performance data is also used to provide:


    +   - A re-display facility for many of the key figures shown on the general CPU
    performance and storage utilization panels, which allows browsing through the
    last measurements (up to twelve hours)

    +   - Graphical history plots with a selection of up to four re-display variables,
    either as simple plots or, if the Graphical Data Display Manager program (GDDM®,
    5684-007 or 5684-168) is available, also in the form of GDDM graphics

    +   - Graphical variable correlation plots (simple plots or GDDM graphics) that
    show how the values of specific variables are correlated to the values of another
    variable


    **Note:** GDDM is required for generating graphics on the console of a virtual
    machine. However, no additional software is required when generating graphics
    with Web browsers using the WWW interface.


    For future reference, the accumulated performance data can also be used for creating:


    +   - Printed performance reports

    +   - Simple performance history files

    +   - Extended trend files


    For capacity planning, the history files on disk can be used for:


    +   - Performance trend graphics

    +   - Numerical history data analysis


    # 2.2.1 Modes of operation


    The modes of operation for the Performance Toolkit include:


    +   - Basic command mode (usually referred to as basic mode) is the normal operating
    mode that allows entering CP and CMS commands. This mode immediately displays
    any messages received from CP.

    +   - Re-display mode. The console log created while operating in basic mode can
    be browsed in re-display mode, and specific strings (for example, USERIDs) can
    be searched using a ''LOCATE'' facility.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '+   - Performance monitoring mode displays data about CPU, I/O, and user performance
    collected by this machine. It allows real-time performance analysis of z/VM systems.

    +   - Remote performance monitoring mode displays performance data collected by
    the performance monitors from another virtual machine on the same or other VM
    systems.

    +   - The Internet interface allows retrieval and displays the same performance
    data via a standard Web browser.

    +   - Monitor data scan mode displays performance data from a MONWRITE disk file,
    created by z/VM systems.

    +   - Trend file scan mode displays performance history data from a trend file
    (FCXTREND disk file).


    IBM z/VM Performance Toolkit is a highly functional, varied coverage, highly detailed
    reporting and real-time monitoring tool. Communication with, and subsequent collection
    of, data from a Linux guest allows it to produce a consolidated view of the hardware,
    LPAR, VM, and Linux levels.'
