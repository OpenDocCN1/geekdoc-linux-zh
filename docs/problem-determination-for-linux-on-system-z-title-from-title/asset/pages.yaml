    ![](img/f332344337ca8bf6846cb313a66ee0b3_137_0.png)


    Figure 4-10 IP address is configured in /etc/sysconfig/network/ifcfg-qeth-bus-ccw-xxx


    # /etc/sysconfig/network/routes file


    This file is used by the ifup and ifdown commands. This file is used for configuring
