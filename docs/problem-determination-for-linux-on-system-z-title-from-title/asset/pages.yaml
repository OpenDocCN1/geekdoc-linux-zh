    # ### 10.1.3 Kernel phase


    Kernel is the heart of the operating system. The kernel is the heart of the operating
    system. Some functions of the kernel are to manage system resources (memory, CPU,
    and so on) and communicate between software and hardware.


    The kernel phase consists of probing and initializing the hardware, as well as
    initializing the kernel subsystems and decompressing initrd and loading some device
    drivers. After that, mount the root file system with read-only access and check
    the file system with the fsck program, then start /sbin/init. After this the kernel
    will sleep, as shown in Figure 10-5.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_305_0.png)


    *Figure 10-5 Kernel phase*'
  merge: -1
  img_proc: true
- pgno: 306
  md: 'Let us talk a little bit more about each kernel phase.


    +   • Recognition and initialization of basic hardware


    This step recognizes and initiates basic hardware (processors, memory, console,
    and so on) included in the kernel. Initialization of various kernel subsystems
    like SMP, page table, and NET are part of this step.


    First of all, Linux kernel decompresses the kernel image on memory, then initializes
    several devices and subsystems with the start_kernel() function.


    Devices and subsystems initialized by the kernel are:


    +   - Initialize kernel page table.

    +   - Outputs kernel banner.

    +   - Initialize physical memory.

    +   - Initialize CPU cachel.L/2.

    +   - Initialize scheduler.

    +   - Registration of interrupt, trap, and task gate.

    +   - Initialize read-copy update (RCU).

    +   - Initialize PID hash table.

    +   - Initialize class-based kernel resource management (CKRM).

    +   - Initialize timer.

    +   - Initialize system clock.

    +   - Initialize console.

    +   - Initialize VFS.

    +   - Initialize signal.


    The process of PID 1 is started when the initialization of the main hardware is
    completed, and the following processing is executed by the init () function.


    > Note: PID 1 is called init process and it stays alive until Linux is shut down.


    +   - Initialize multi-processor.

    +   - Initialize kernel addition function.

    +     - Initialize devices management data.

    +     - Initialize network management data.

    +   - Process Initial RAM DISK (initrd).

    +   - Mount / file system.

    +   - Run /sbin/init.


    +   • Decompressing initial RAM disk (initrd)


    This process is required to mount the root file system, load kernel drivers modules,
    and recognize devices that should be recognized when each service starts.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'RAM disk image file includes driver, basic commands and scripts (linuxrc) to
    mount real root file system. After the mount, the linuxrc script is executed and
    the following processes occur:


    +   Processing of linuxrc script

    +   - Mounting the proc and sys file systems

    +   - Starting the udev service

    +   - Loading the driver module /lib/modules or its subdirectory

    +   - Recognizing DASD devices and making them online

    +   - Recognizing FCP channels and putting FCP volumes online

    +   - Recognizing LVM volumes and activating them

    +   - Recognizing real root file systems

    +   - Writing path information to /proc/sys/kernel/real-root-dev


    The mount preparation of the root file system is completed by processing the linuxrc
    script.


    # Mounting root file system


    This step mounts the root file system in read-only mode. Note that read-write
    (rw) mount is done later by the init phase. At this point all file systems are
    checked with the fsck command.


    Linux kernel mounts the root file system with read-only (ro) mode, and fsck is
    executed. Then the device that includes the real root file system can be recognized.
    At this time, initrd that was mounted previously as a root file system is saved
    in the /initrd directory.


    > Note: In SLES9 and SLES10, the initrd is annulled because /initrd does not exist.


    The reason for doing the mount with read-only is to prevent the root file system
    from breaking and being changed by fsck.


    As for the root file system, remount is done with read-write (rw) in the init
    phase.


    # Starting /sbin/init


    At this point Linux kernel will sleep. The /sbin/init and the child process do
    all the start processing afterwards.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# 10.1.4 Init phase


    The init phase is the process control initialization. Init is the parent of all
    process. Its primary role is to create a process from a script stored in the file
    /etc/inittab. This file usually has entries that cause init to spawn gettys on
    each line that users can log in. It also controls autonomous processes required
    by any particular system.


    The /sbin/init controls the following processes:


    +   Look at the specific runlevel setting as specified in the runlevels configuration,
    set the source function library for the system, and start applicable processesess
    (following /etc/inittab).

    +   Run /etc/init.d/boot.* (recognize LVM volumes, mount all file systems, and
    so on).

    +   Start the /etc/init.d/rc[0-6].d/* daemon.


    Let us go into more detail about Init phase.


    /sbin/init is executed when initialization by the kernel is compiled, and the
    init process is generated.


    The primary role of initialization by the init process is to create processes
    from a configuration script stored in the file /etc/inittab.


    Various settings, initialization, and start processing are processed following
    /etc/inittab.


    +   Runlevel setting

    +   Usually this is set by the value of init default in /etc/inittab.

    +   The specified runlevel is recorded in /var/run/utmp, and referred by /sbin/runlevel.

    +   Running the /etc/init.d/boot

    +   Common system initialization that does not depend on runlevel

    +   Time setting, initializing swap device, checking and mounting file systems,
    initializing the loop back device, initializing quota, initializing the /proc
    file system, and so on, are done here.

    +   Running service scripts

    +   Starting various demons according to runlevel: /etc/init.d/rcX.d/* scripts
    (X is the runlevel).

    +   The configuration file to which each service script refers is stored in /etc/sysconfig/.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '+   - The starting service of each runlevel is set by the `chkconfig` command
    and the `inserv` command.


    # Starting getty


    +   - After starting all the daemons, getty is started.


    Now we describe some parts of the /etc/inittab configuration file.


    +   - The /etc/inittab format is id:runlevels:action:process.


    +   - Some actions that the `init` command take when the process starts are:


    +      - bootwait - The process is executed during system boot.


    +      - initdefault - The default runlevel is configured here when the system
    starts.


    +      - once - The process is started once when the specified runlevel is entered.


    +   - The process starts only once when booting.


    +      - wait - The process will be started once when the specified runlevel is
    entered and init will wait for its termination.


    +      - respawn - The process will be restarted whenever it terminates.


    See the /etc/inittab/ default configuration in Example 10-2.


    # Example 10-2 Default configuration of /etc/inittab


    ```

    # The default runlevel is defined here

    id:5:initdefault:


    # First script to be executed, if not booting in emergency (-b) mode

    si::bootwait:/etc/init.d/boot


    # /etc/init.d/rc takes care of runlevel handling

    #

    # runlevel 0  is  System halt   (Do not use this for initdefault!)

    # runlevel 1  is  Single user mode

    # runlevel 2  is  Local multiuser without remote network (e.g. NFS)

    # runlevel 3  is  Full multiuser with network

    # runlevel 4  is  Not used

    # runlevel 5  is  Full multiuser with network and xdm

    # runlevel 6  is  System reboot (Do not use this for initdefault!)

    #

    10:0:wait:/etc/init.d/rc 0

    11:1:wait:/etc/init.d/rc 1

    12:2:wait:/etc/init.d/rc 2

    13:3:wait:/etc/init.d/rc 3

    14:4:wait:/etc/init.d/rc 4

    15:5:wait:/etc/init.d/rc 5

    ```'
  merge: -1
  img_proc: true
