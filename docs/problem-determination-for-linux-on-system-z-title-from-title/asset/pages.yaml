    # 3.3.2 strace


    The strace command is a powerful debugging tool available for the Linux on System
    z architecture. The strace utility intercepts and records the system calls that
    are called by a process and the signals that are received by a process. The name
    of each system call, its arguments, and its return value are printed on standard
    error or to the file specified with the -o option. Using strace leads to the shortening
    of analysis time during problem determination of user space programs as well as
    system commands. The strace utility can be used for debugging in two methods:


    +   - Start the program or application with the strace utility (Example 3-37).

    +   - Obtain the strace of a process that is already running (Example 3-38).


    ```

    Example 3-37 Example for obtaining strace for ls command


    strace -o out_file -tt -f ls

    ```


    ```

    Example 3-38 Strace for PID 1834


    strace -o out_file -tt -f -p 1834

    ```


    The traces of only a specified system calls can also be obtained by passing a
    certain option, but we always recommend obtaining the traces of all system calls
    when the problem area is not narrowed down. In Example 3-39, strace would only
    trace the signal system calls for the process.


    ```

    Example 3-39 Obtain only signal system calls


    strace -o out_file -tt -ff -e trace=signal -x ./segfault

    ```'
