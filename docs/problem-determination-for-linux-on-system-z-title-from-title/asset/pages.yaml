  md: '![](img/f332344337ca8bf6846cb313a66ee0b3_119_0.png)


    Figure 3-13 Example Sysrq report


    # 3.3.5 s390dbf


    The s390dbf debug feature traces kernel components such as device drivers. It
    produces trace logs, which can be useful when that specific component shows an
    error. Not all components produce the logs, however. A component must register
    with the feature to produce the traces.


    The /proc directory holds debug logs from the s390dbf tool. Under the path /proc/s390dbf,
    there is a directory for each registered component. The names of the directory
    entries correspond to the names under which the components have been registered.
    There are three versions for the event (and exception) calls: one for logging
    raw data, one for text, and one for numbers. Each debug entry contains the following
    data:


    +   - Timestamp

    +   - CPU-Number of calling task

    +   - Level of debug entry (0..6)

    +   - Return address to caller'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Select the file according to the area to be investigated and select the file
    under the /proc directory:


    +   - `/proc/s390dbf/cio_*` : Common I/O

    +   - `/proc/s390dbf/qdio_*` : qdio

    +   - `/proc/s390dbf/qeth_*` : qeth

    +   - `/proc/s390dbf/zfcp_*` : zfcp

    +   - `/proc/s390dbf/dasd_` : DASD

    +   - `/proc/s390dbf/0.0.xxxx` : each DASD device


    All debug logs have an actual debug level (ranging from 0 to 6). The default level
    is 3. Event and exception functions have a level parameter. The actual debug level
    can be changed with the help of the debugfs-filesystem through writing a number
    string "x" to the ''level'' debugfs file that is provided for every debug log.


    # Example 3-46 s390dbf log level


    ```

    1nx02:/ # cat /proc/s390dbf/qeth_trace/level

    2

    ```


    Now according to the level of tracing required, set the log value as shown in
    Example 3-47.


    # Example 3-47 Setting up log level


    ```

    1nx02:/ # echo 6 > /proc/s390dbf/qeth_trace/level

    1nx02:/ # cat /proc/s390dbf/qeth_trace/level

    6

    ```


    Once at the appropriate level of tracing, recreate the problem to save the s390dbf
    trace outputs.


    # Example 3-48 Saving the s390dbf trace to a file


    ```

    cat /proc/s390dbf/qeth_trace/hex_ascii > output_file

    ```


    Once the trace information from the s390dbf facility is saved, return to the old
    trace level (Example 3-49).


    # Example 3-49 Resetting the trace level back to default


    ```

    1nx02:/ # echo 2 > /proc/s390dbf/qeth_trace/level

    ```'
  merge: -1
  img_proc: true
- pgno: 121
  md: '![](img/f332344337ca8bf6846cb313a66ee0b3_121_0.png)


