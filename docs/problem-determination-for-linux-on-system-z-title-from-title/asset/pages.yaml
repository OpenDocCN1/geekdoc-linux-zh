    # Survey in the hardware (HW) layer


    Figure 4-40 on page 141 summarizes the main points of interest for a survey in
    the hardware layer. Before touching up on these points, it will be helpful to
    explain a useful Linux kernel parameter. Usually, when a Linux system is coming
    up, it senses all the hardware devices connected. Also, Linux senses any dynamic
    change, such as adding a new device or removing a device when it is running. All
    the detected devices (irrespective of whether they were detected during the system
    boot or after that) are controlled under sysfs. Most of these devices can be made
    online or offline dynamically when Linux is running. It is possible to disable
    this sensing for a given device by using the cio_ignore kernel parameter. When
    the cio_ignore parameter is set for a device, that device is not sensed during
    a system reboot, and cannot be brought online or offline from Linux.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '![](img/f332344337ca8bf6846cb313a66ee0b3_156_0.png)


    # Figure 4-40 Survey in the hardware layer


    cio_ignore can be set up permanently by adding an entry similar to the one shown
    in Example 4-2 in to the /etc/zipl.conf file. It is also possible to set up the
    cio_ignore for a device dynamically, as shown in Example 4-3.


    # Example 4-2 Sample entry to set up cio_ignore in /etc/zipl.conf


    ```

    cio_ignore=0.0.1000-0.0.1fff,0.0.3000-0.0.3fff

    ```


    The devices 1000~1FFFF,3000~3FFF are not sensed.


    # Example 4-3 Dynamic cio_ignore set up with /proc/cio_ignore


    ```

    # echo add 0.0.1000 > /proc/cio_ignore

    (the device 1000 is added to the cio_ignore list)

    # echo free 0.0.2000 > /proc/cio_ignore

    (the device 2000 is removed from cio_ignore list)

    ```


