    # 11.4 Emergency scanning


    When we drilled down further in the dynamic data provided by the performance toolkit,
    we witnessed some heavy emergency scanning happening in the z/VM. Emergency scanning
    is an indicator that the system is critically short of storage for some reason.
    When short of storage pages, the system begins a three-level scanning process:
    scan 1, scan 2, and then the most serious, emergency scanning. The system is being
    reduced to extreme measures while hunting for'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'main storage pages, and the situation is so severe that it will steal them
    from any user. Ultimately, whether they are inactive, in queue, or active, it
    eventually even steals pages from shared segments and the CP system process.


    In short, the system is in a critical mess, storage wise. This also covers stealing
    pages from the monitor and MONDCSS, two critical performance-related entities,
    and in this event, performance monitoring and reporting may be compromised or
    interrupted.


