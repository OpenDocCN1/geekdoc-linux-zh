- pgno: 347
  md: 'Figure 11-9 shows an increase in the page rate. At the same time, we can see
    that z/VM has entered in to emergency scanning mode for release pages.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_347_0.png)


    **Note:** Starting z/VM v5.3.0 introduced more important enhancements to CP storage
    management. Page management blocks can now be positioned above the 2 GB line.
    Contiguous frame management has been further refined, and fast available list
    searching was introduced in this release. For more discussion on this see:


    http://www.ibm.com/perf/reports/zvm/html/530stor.html


    From the above investigation, it is clear that the Linux guest (application server)
    is heavily committed in terms of memory within a 3 GB virtual machine, by defining
    a very large heap size for running the WebSphere Application Server. Some steps
    that you can take to generally tune your system and help avoid ESCN where it does
    still arise can be found at:


    http://www.vm.com/perf/tips/2gsstorag.html'
  merge: -1
  img_proc: true
