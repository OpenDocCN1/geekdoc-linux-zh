    # 9.3 Scenarios


    In this section, we cover common and possible problems that could occur during
    the installation or device configurations. When we are talking about installation
    problems, we can say that we have two possibilities:


    +   - Problems during the installation

    +       These are problems that occur while running the program interface installer,
    for example, a problem with creating partitions, packages dependencies, devices
    not found, and problems with network setup.

    +   - Problems after the installation

    +       These are problems that occur after the Linux install is done successfully,
    for example, problems with device configurations and problems logging into Linux.


    # 9.3.1 Trouble during the installation


    In this section we discuss problems during the installation.


    # Scenario 1: Problems cloning Linux system when SuSE v10 and SP1 are used


    Problem determination: If we take the default device names of SP1 during installation,
    your system will be unable to clone.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'Solution: We can change device naming through YaST or change it directly in
    /etc/fstab.


    ```

    lnxhs:~ # cat /etc/fstab

    /dev/dasdal  /       ext3   acl,user_xattr   1 1

    /dev/dasdb1  swap     swap   defaults       0 0

    proc     /proc    proc   defaults       0 0

    sysfs    /sys     sysfs  noauto       0 0

    debugfs    /sys/kernel/debug    debugfs   noauto       0 0

    devpts    /dev/pts    devpts   mode=0620,gid=5     0 0

    ```


    *Figure 9-6  /etc/fstab example*


    # ### 9.3.2  Trouble after the installation


    In this section we discuss problems after the installation.


    # **Scenario 1: forgotten root password (SuSE or Red Hat)**


    Problem description: We have configured the root password during the installation
    but when we try to log in after the reboot we have problems.


    This problem can occur when we forget the password or typed it in wrong during
    the installation.


    Solution: To solve this problem, boot your Linux system using Linux single mode
    or init 1. When are you booting at Linux single mode or init 1 the root file system
    is mounted as read-only. After the boot, we will have access to the prompt, so
    we must type the command below:


    ```

    # passwd  root

    ```


    We will set the new root password. Reboot your system using init 6 or by typing
    the command below:


    ```

    # shutdown -r now

    ```'
  merge: -1
