    # 5.2.4 I/O bottlenecks


    The I/O bottlenecks are either related to the disk subsystem or to the network
    subsystem. We examine each of these in this section.


    # Disk bottlenecks


    When the CPU is waiting long for the disk I/O operations to finish, we experience
    the disk I/O bottleneck. This may happen if there are too many disk I/O operations
    happening or the disk operations became too slow. Needless to say, the disk bottleneck
    affects the throughput and response time of the system. As shown in Figure 5-31
    on page 193, problem determination starts by checking the current configuration.
    It is followed by confirming whether I/O wait is occurring in the system. The
    storage subsystem configuration, the System z configuration, and the Linux level
    configuration are the configurations to examine. The storage subsystem configuration
    details include the subsystem type/model, number of ranks, number of DA pairs,
    size of the cache, configuration of the cluster, and so on.


    192 Problem Determination for Linux on System z'
  merge: -1
  img_proc: true
