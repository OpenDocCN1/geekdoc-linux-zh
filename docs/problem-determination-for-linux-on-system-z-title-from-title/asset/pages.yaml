    # sadc


    The sadc command samples system data a specified number of times (count) at a
    specified interval measured in seconds (interval). It writes in binary format
    to the specified outfile or to the standard output. The sadc command is intended
    to be used as a back end to the sar command.


    Example 3-4 shows the syntax and an example of using the sadc command.


    # Example 3-4 Syntax and example of using sadc


    ```

    /usr/lib64/sa/sadc <interval> <count> > out

    /usr/lib64/sa/sadc 1 5 >out

    ```


    Without the parameter count, sadc samples data until it is stopped. The standard
    output file is /var/log/sa/sa<day>, and it is written to once a day, at the end
    of the day.


    # iostat


    In order to see an overview of your CPU utilization you can use the iostat command.
    This command provides monitoring and reporting on both CPU statistics and I/O
    statistics for one or more devices and partitions.


