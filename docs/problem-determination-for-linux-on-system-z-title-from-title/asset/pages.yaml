    Figure 5-42 Network performance problem determination - investigating utilization


    # Confirm the configuration


    # Investigation of network utilization


    +   - Investigate utilization of each interface

    +     - number of send/receive packets

    +     - send/receive bytes

    +     - frequency of error/collision occurrence

    +   - Utilization of OSA card

    +     - channel utilization

    +   - Analyze utilization

    +     - possibility of trouble

    +     - bandwidth bottleneck at the Linux side


    When the network utilization is being investigated, the utilization of each interface
    needs to be investigated (the number of packets transmitted and received, frequency
    of the occurrence of errors and collisions, and so on, to be analyzed). If there
    are many collision packets, then there is a possibility of hardware trouble or
    a possibility of trouble in the network environment. In the case of an OSA card,
    the channel utilization must be examined. Investigate whether the bandwidth of
    OSA or HiperSockets becomes full by referring to performance reports. At the Linux
    side check the bandwidth bottleneck, incorrect configurations, and so on.


    Note: The HiperSockets performance report can be found at:

    http://www.vm.ibm.com/perf/reports/zvm/html/iqdio.html


    The OSA Express performance report can be found at:

    http://www.vm.ibm.com/perf/reports/zvm/html/layer2.html'
