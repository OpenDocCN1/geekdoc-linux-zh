- pgno: 258
  md: '# Hardware-related problems


    This chapter introduces a basic configuration of hardware and device recognition
    and management in Linux on System z. We describe hardware problem determination
    basics and introduce a case study.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 8.1 Basic configuration of hardware


    Figure 8-1 introduces a typical hardware configuration used by Linux on System
    z. If you encounter a hardware problem, this diagram may help you to understand
    where to look in the basic hardware configuration and connectivity to understand
    where your problem may lie in your own configuration.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_259_0.png)


    Figure 8-1 Basic hardware configuration for Linux on System z


    # 8.2 Device recognition and management


    Like other operating systems, Linux has special files that it uses to control
    the hardware.


    This section describes devices found in Linux on System z and includes the Linux
    device file, sysfs, udev, device driver, common I/O, and qdio, and describes how
    to confirm device status.


    Some of the drivers that are most often used with Linux on System z are:


    +   - DASD (dasd_mod, dasd_eckd_mod, dasd_fba_mod)

    +   - TAPE (tape, tape_34xxAc.)

    +   - FCP/SCSI (zfcp, scsi_mod, st, sg, IBMtape)

    +   - Network (qeth)'
  merge: -1
  img_proc: true
- pgno: 260
  md: "Figure 8-2 shows of our device control.\n\n![](img/f332344337ca8bf6846cb313a66ee0b3_260_0.png)\n\
    \nExample 8-1 on page 246 shows:\n\n+   Device drivers that are often used in\
    \ Linux on System z are:\n+   \n+   DASD (dasd\\_mod, dasd\\_eckd\\_mod, dasd\\\
    _fba\\_mod)\n+   \n+   TAPE (tape, tape\\_34xxAC\\_)\n+   \n+   FCP/SCSI (zfcp,\
    \ scsi\\_mod, st, sg, IBMtape)\n+   \n+   Network (qeth)\n\n+   The Common I/O\
    \ layer is a layer that executes common I/O operations that are not dependent\
    \ on devices. Actions that occur on the common I/O layer are recognition of the\
    \ channel path, detection of devices, and recognition of device type and control\
    \ unit type.\n\n+   The QDIO driver\n+   \n+   Queued Direct I/O (QDIO) is a highly\
    \ efficient data transfer architecture, which dramatically improves data transfer\
    \ speed and efficiency for TCP/IP traffic. It provides direct communication between\
    \ memory and adapter devices (Direct Memory Access, DMA). Additionally, I/O processing\
    \ paths are shortened.\n\n# **8.2.1 Common I/O layer**\n\nThe common I/O layer\
    \ is System z specific intermediate layer that exploits all hardware and kernel\
    \ features. It is the layer that executes common I/O operations that are not dependent\
    \ on devices. Actions that are in the common"
  merge: -1
  img_proc: true
- pgno: 261
  md: 'I/O layer include recognition of the channel path, detection of devices, and
    recognition of device types and control unit types. Linux devices use the common
    I/O layer to connect to device drivers.


    Common I/O processing does not depend on a device being executed. The process
    involved in common I/O is:


    +   1. A starting I/O processing request is made to the channel subsystem.


    +   2. Completing I/O - The I/O interruption from the hardware is received when
    I/O is completed. The subroutine of the device driver corresponding to the hardware
    is then called.


    +   3. Error handling at channel and sub-channel - When the hardware event has
    occurred, a machine check interrupt is received. Recovery processing begins according
    to the event that is executed.


    +   4. Recognizing the devices that the channel subsystem manages involves acquiring
    sub-channel information, acquiring the control unit, device type, and/or model
    number and inspection of channel paths of each device.


    # ### Overview


    In this section, we provide an overview of this process from I/O request to completion
    and include a machine check interruption.


    # ## Channel command word


    Channel command words (CCWs) are I/O requests to devices and are hardware understandable
    instructions. The information included in the CCWs is:


    +   - Hardware instruction such as read or write


    +   - Data or buffer addresses on memory


    +   - Number of bytes for input/output data


    Instructions can be different for each device.


    # ## Channel report word messages


    Channel report word (CRW) messages provide a status of the I/O operation, the
    device, and the channel paths (for example, link up/link down message or messages
    about attaching devices). An example of a message is shown in Example 8-1, where
    a FICON cable is pulled out once and reconnected.


    > *Example 8-1 /var/log/messages*


    ```

    Jul 1 15:03:35 xxxxxxxx kernel: crw_info : CRW reports slct=0, oflw=0, chn=0,
    rsc=B, anc=0, erc=0, rsid=0

    Jul 1 15:03:36 xxxxxxxx kernel: dasd_er: 0.0,c700: default ERP called (255 retries
    left)

    ```'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Figure 8-3 demonstrates the I/O request, a machine check interruption, and
    the I/O completion.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_262_0.png)


    During the I/O request, the CCW is created and it executes start sub channel (SSCH)
    instruction.


    When the I/O is completed, notification is sent to the operating system by an
    I/O interruption. The status is stored to the interruption response block (IRB).
    The IRB stores device and channel status.


    During a machine check interruption, the CRW provides notification of hardware
    events such as channel links up or down.


    # 8.2.2 Kernel layer


    The Linux device drivers work through special kernel code that accesses the hardware
    directly. This kernel layer recognizes and manages the hardware with special device
    files such as sysfs and udev. Figure 8-4 shows where these devices sit in the
    overall architecture.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_262_1.png)'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'Linux treats a device as a file. As seen in Figure 8-4 on page 247, in the
    user space is a program that controls devices using device files. The Linux kernel
    manages the devices using major and minor numbers. The major number is a number
    that indicates the device driver and the minor number is a number that indicates
    each device.


    Some device files are created automatically when Linux is installed. From kernel
    Version 2.6 forward, Linux creates device files using a hardware detector called
    udev, which also manages file permissions. udev works in the user space using
    hotplug events that the kernel sends whenever a device is added or removed from
    the kernel. udev creates device files both automatically and manually.


    When a new device arrives, the hardware or z/VM creates a machine check. The Linux
    machine check handler handles the machine check while the Linux common I/O layer
    queries the channel subsystem. The new device is registered in the Linux device
    infrastructure where a new sysfs entry appears and a hotplug event is created.
    udev examines the configuration files and creates the device node appropriately.


    By creating and dynamically deleting device files, device files of only devices
    that are connected to the system are created under the /dev directory, and it
    is easy to confirm what devices are connected now and whether the devices are
    connected correctly. However, in SLES, minimum device files must exist in the
    system, and these files are not deleted dynamically.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'The steps involved in device recognition by udev are shown in Figure 8-5.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_264_0.png)


    *Figure 8-5 Sequence of attaching new devices with hotplug*


    The steps are:


    +   1. A new device is added and a machine check occurs.

    +   2. The machine check handler informs the common I/O layer of the new device.

    +   3. Information about the added device is acquired in the common I/O. A new
    entry is created in sysfs.

    +   4. Hotplug is called.

    +   5. udev is called.

    +   6. udev references sysfs.

    +   7. The device file is created.


    Sysfs offers an interface to the user space for accessing the data structure in
    the kernel space. Sysfs can dynamically add and delete via both the hotplug agent
    and by user operations. It also allows for option setting (log level, for example)
    of the device and driver and confirmation of device status (such as on or offline).'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'The Sysfs contains virtual configuration and control files, for example:


    +   - Example of configuring an OSA device

    +   ```

    +   # echo "0.0.0769,0.0.076a,0.0.076b" > /sys/bus/ccwgroup/drivers/geth/group

    +   # echo 1 > /sys/bus/ccwgroup/drivers/geth/0.0.0769/online

    +   ```


    +   - Example of the changing log level

    +   ```

    +   # echo 2 > /sys/bus/ccw/drivers/zfcp/loglevel_qdio

    +   ```


    +   - Example of making channel path offline/online

    +   ```

    +   # echo offline > /sys/devices/css0/chp0.xx/status

    +   # echo online > /sys/devices/css0/chp0.xx/status

    +   ```


    +   - Example of changing option setting

    +   ```

    +   # echo 1 > /sys/devices/geth/0.0.e18c/layer2

    +   ```


    # 8.2.3  Device drivers


    The following are the device drivers, their corresponding kernel modules (if applicable),
    and descriptions and characteristics that are common in a Linux on System z configuration:


    +   - DASD device driver

    +       - Kernel modules: dasd_mod, dasd_eckd_mod, dasd_fba_mod.

    +       - A device driver that is used to access channel-attached DASD devices.

    +       - Channel subsystem processes path control and error recovery. Linux does
    not consider the existence of path.

    +       - Linux controls it by using device file /dev/dasda.

    +           - The first partition is /dev/dasdx1, the second partition is /dev/dasdx2.

    +           - The maximum number of partitions is 3.


    +   - zfcp device driver

    +       - A device driver that is used to access Fibre Channel attached SCSI devices.

    +       - A channel subsystem is not used. The buffer I/O of QDIO is used instead.
    Linux has to process path control and error recovery by itself because of this.

    +       - Information about the Host Bus Adapter (HBA) and the logical unit number
    (LUN) on the storage server side is needed in order to recognize a LUN.

    +       - Linux controls recognize the LUN by using the device file, /dev.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '+   - Network device driver - Network devices are controlled by network device
    drivers.


    +   - The device file and major/minor numbers are created in the same way as disk
    and tape.


    +   - The interface is created and related to a device.


    +   - The default name of an interface depends on the type of interface, for example,
    Ethernet (eth0, eth1), HipërSockets (hsio, hsi). The name of the interface can
    be changed <geth>.


    +   - Device drivers are used to access the OSA-Express of QDIO mode and HipërSockets.


    +   - Channel subsystems are not used. Buffer I/O of QDIO is used instead.


    +   - The qeth device driver needs 3 subchannels to recognize an OSA device:


    +      - An even number of control read devices.


    +      - The control write devices must be the device bus-ID of the read subchannel
    plus one.


    +      - Data devices can be any free device bus-ID on the same CHPID.


    # 8.2.4  Confirming status of channel path and devices


    This section describes the command and files for status confirmation of devices.
    It is possible to confirm the devices'' status provided by sysfs. It is important
    to confirm the status, even under normal circumstances.


