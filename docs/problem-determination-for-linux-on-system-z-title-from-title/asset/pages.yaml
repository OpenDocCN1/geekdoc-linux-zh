- pgno: 12
  md: '# Preface


    This IBM® Redbooks® publication addresses some of the common problems that some
    customers have experienced on the Linux® on System z™ platform. Our intention
    is to demonstrate the characteristics of common problems and the process one would
    follow to determine the root cause of the problem and thus resolve the problem.


    We start with a discussion on how to approach problem solving in the Linux on
    System z environment.


    Additionally, we list the tools that are available to assist in diagnostics and
    discuss when you would use which tool.


    # This book The team that wrote this book


    This book was produced by a team of specialists from around the world working
    at the International Technical Support Organization, Poughkeepsie Center.


    **Lydia Parziale** is a Project Leader for the ITSO team in Poughkeepsie, New
    York, with domestic and international experience in technology management including
    software development, project leadership, and strategic planning. Her areas of
    expertise include e-business development and database management technologies.
    Lydia is a Certified IT Specialist with an MBA in Technology Management and has
    been employed by IBM for 24 years in various technology areas.


    **Manoj S Pattabhiraman** is a Staff Software Engineer in Linux Technology Center
    (LTC), India. He holds a master''s degree in computer applications from the University
    of Madras. He has seven years of experience in z/VM® Application Development and
    Systems Programming for Linux on zSeries®. Apart from his Linux on System z development
    activities, he also provides technical support for various Linux on System z customers.
    Manoj has contributed to several z/VM and Linux on System z related IBM Redbooks
    publications, and has been a presenter at ITSO workshops for Linux on System z.
    His areas of expertise include z/VM, Linux on System z, middleware performance,
    and z/VM REXX™ programming.


    **Masayuki Unno** is a Technical Sales Specialist for System z in Japan and Asia-Pacific
    countries. His mission is technical support for Linux on System z (zLinux) and
    includes client-facing support. His areas of expertise include zLinux'
