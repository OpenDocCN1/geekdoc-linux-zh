- pgno: 270
  md: '# ## 8.3 Hardware problem determination


    This section provides:


    +   * An explanation of check points that will help you determine whether a problem
    is hardware or software.


    +   * A procedure to determine each step of the problem of hardware recognition
    and to determine the problem.


    # ### 8.3.1 Initial determination of hardware or software problems


    If a problem happens, you will want to confirm the problem first. Gather dbginfo.sh
    and s390dbf first. Determine the following:


    +   * Are the devices be recognized?

    +   * Is the performance up to expectations?

    +   * Can the devices be used?


    Even though there may be no problem in device recognition and performance, some
    errors may still be reported, look in the /etc directory.


    After confirming the problem, look at the components that can be easily observed
    (such as, is it storage subsystem trouble? network trouble?). Determine whether
    it is a problem related to I/O. I/O troubles should be investigated last.


    Messages that may indicate a hardware problem are:


    +   * Remote Support Facility (RSF) notification

    +   * The icon status of the HMC

    +   * Check stop of LPAR'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# **Distinct hardware or software problem**


    To determine whether it is clearly a problem with hardware or software, error
    messages and problem scope (single system or multi system), leave good hints.
    Hardware error messages are shown in Linux logs, on the HMC, on the z/VM console,
    or in the IBM z/VM Environmental Record Editing, and Printing (EREP) report. A
    flowchart of the problem determination process can be seen in Figure 8-7.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_271_0.png)


    *Figure 8-7 Hardware and software problem determination flowchart*'
  merge: -1
  img_proc: true
- pgno: 272
  md: "> **Note:** var/log/messages on Linux does not have the messages that are shown\
    \ during Linux hang, down, or reboot.\n\n# 8.3.2 Investigating hardware-related\
    \ messages\n\nHardware error messages in z/VM basically have an error code and\
    \ its meaning. Check the messages and code manual of each component for your version\
    \ of z/VM.\n\nWe have no manual about hardware messages in Linux. Searching the\
    \ meaning of messages from past cases is a good approach of investigation. You\
