    # 4.4 Case studies


    In this section we see some case studies involving real-life problems.


    # Case study 1 - eth0 interface eth0 interface down


    In this scenario the deactivation of the eth0 interface causes the eth1 interface
    to stop functioning.


    # Problem


    We have a Linux system running on the system with one interface eth0. A new Ethernet
    interface eth1 was added and the system was rebooted. After the system reboot,
    the eth0 interface was brought down using the ifconfig command to test the communication
    using the eth1 interface. But now the eth1 interface cannot communicate. Figure
    4-59 shows the scenario.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_174_1.png)


    Figure 4-59 Case study example - eth0 interface down'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Data for analysis


    To troubleshoot the problem, we need to gather the following information and analyze
    it for correctness:


    +   - /etc/sysconfig/hardware/hwcfg-qeth-bus-ccw-0.0.xxxx

    +   - /etc/sysconfig/network/ifcfg-qeth-bus-ccw-0.0.xxxx

    +   - dmesg command output

    +   - ifconfig command output

    +   - /etc/sysconfig/network/routes

    +   - netstat -m command output


    # Analysis and conclusion


    Upon checking the configuration files, all looked correct. But from the routing
    table output given by the route -n command, we identify that the eth0 interface
    is configured as the routing interface (default gateway) for eth1. So, when the
    eth0 interface went down, the eth1 interface was not able to communicate because
    of the loss of the routing table entries. All communication was done via the eth0
    interface.


    If the above approach is not leading to a solution, then consider obtaining a
    packet trace.


    # Case study 2 - connection lost after VSWITCH OSA takeover


    Assume that we have a VSWITCH configured on a z/VM system with device 3700 as
    the active OSA and device 3800 as the backup OSA.


    # Problem


    When the cable connected to the active OSA (device 3700) was removed, the communication
    was lost even though switching to the backup OSA (device 3800) happened.


    # Data for analysis


    Analyze the following data:


    +   - The status of devices 3700 and 3800

    +   - ARP cache of z/VM TCP/IP and the workstation executing the ping command

    +   - Routing z/VM Linux guest information for the z/VM Linux guest (route -n
    command output)

    +   - Trace information for the VSWITCH

    +   - OSA/SF query'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Analysis and conclusion


    From the OSA/SF query output, it was found that the port setting of the backup
    OSA device was 1000 Mbps full duplex in spite of connecting to the 100 Mbps switch.
    Due to the mismatch of the port speed, data was not sent. Since the active OSA
    was able to communicate before the cable was pulled, it is clear that there is
    no problem at or above the IP layer.


    # Case study 3 - not able to connect using SSH


    Consider the scenario shown in Figure 4-60. The Linux systems are running on z/VM
    on System z. The routers indicate that the client system and the Linux systems
    are in different network subnets.


    # Problem


    We are not able to connect to the Linux system from the client using SSH.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_176_0.png)


    Figure 4-60 Case study example - not able to connect using SSH


    # Data for analysis


    Analyze the following data:


    +   - `/etc/sysconfig/hardware/hwcfg-qeth-bus-ccw-0.0.xxxx`

    +   - `/etc/sysconfig/network/ifcfg-qeth-bus-ccw-0.0.xxxx`

    +   - routing table information (route -n command output)

    +   - configuration of routers

    +   - tcpdump


    # Analysis and conclusion


    There was no problem with PING or FTP. Since SSH will use the same network path
    as PING and FTP, the problem is not with the routing tables. SSH between the two
    Linux systems is working well. So, the SSH server on the Linux system is working
    correctly. Checking the router configuration, it was discovered that the MTU size
    setting of the router connected to the Linux system network segment is 512. This
    means that packet fragmentation is needed at the router level. But the client
    is sending packets with the Do Not Fragment (DF) bit set. This causes the router
    connected to the Linux systems to send the message ICMP Destination unreachable/fragmentation
    needed and DF bit was set to the client. But the'
  merge: -1
  img_proc: true
- pgno: 177
  md: configuration of the router connected to the client segment is to discard this
    packet. Hence, the cause of the problem is the configuration at the router side.
    The tcpdump was useful to troubleshoot this problem.
  merge: -1
  img_proc: true
