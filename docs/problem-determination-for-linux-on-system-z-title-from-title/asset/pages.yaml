    # 3.3.4 SysRq


    SysRq is a key combo we can hit that the kernel will respond to regardless of
    whatever else it is doing, unless it is completely locked up. In case of any kernel
    problems other than a kernel oops or panic, a kernel core dump is not triggered
    automatically. If the system still responds to keyboard input to some degree,
    a kernel core dump can be triggered manually through a magic SysRq keyboard combination.
    For that, the kernel that is running on the system must be built with CONFIG_MAGIC_SYS_REQ
    enabled. These magic keystrokes give you a stack trace of the currently running
    processes and all processes, respectively. The systems would generate a /var/log/messages
    file for the back trace.'
