- pgno: 58
  md: 'that you need. Once inside a report, many of them have sub menus, or further
    navigation is possible by placing the cursor under the variable and pressing the
    Enter key. Indeed, a lot of reports contain many layers of navigation, for example,
    you can look at an ordered list of DASD volumes and see the overall activity,
    in addition to controller functions. Then you can go deeper, and look at a given
    volume in more detail, then go down into further detail and look at the minidisk
    device activity. This type of navigation functionality greatly facilitates problem
    determination, as well as making the overall understanding of your system, even
    down at a deep level, much easier because of this enhanced accessibility. The
    various data reports are divided into the groups of general system data, I/O data,
    history data, and user data.


    Performance screen items whose numbers do not appear highlighted on the initial
    menu cannot be selected because CP monitor data has not been collected for them.
    Possible reasons are:


    +   - The required monitor records are not available because the CP level of your
    VM system does not yet produce them.

    +   - The required monitor domains have not yet been enabled.

    +   - The first monitor sample interval has not ended and we are still waiting
    for the initial set of monitor records.

    +   - The display is intended for data that cannot be generated on the system
    (for example, LPAR data on an unpartitioned system).


    # 2.2.2 Selecting performance screens


    The screens are grouped into general system data, I/O data, user data (which shows
    data for either the last monitor sample interval or overall averages), and a series
    of by time log files that show a separate set of values for each monitor sample
    interval. They can be selected from the initial menu by taking one of the following
    actions:


    +   - Entering the number of the selected performance data displayed on the command
    line

    +   - Moving the cursor to the selected display (Note that it will move only to
    highlighted numbers if you use the tabulator keys.)

    +   - Entering the `short-path` command for the desired screen


    Then press the Enter key.


    To get some meaningful data for problem determination you need know where to get
    this data within the performance toolkit.'
