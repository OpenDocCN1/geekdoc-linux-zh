- pgno: 343
  md: 'Keep in mind that we page because we cannot fit everything in real storage
    at once. Therefore, paging increases are caused by:


    +   - Decrease in available storage

    +   - Increase in storage requirements

    +   - A combination of both


    QUERY FRAMES is the recommended way of checking storage, but it is only online.
    In our case, since the performance toolkit provides the same information as the
    paging load option, we started to monitor the paging activity from the performance
    toolkit.


    Since we have high paging during the time period, we started to compare the system
    page rate with that of the other resources in use.


