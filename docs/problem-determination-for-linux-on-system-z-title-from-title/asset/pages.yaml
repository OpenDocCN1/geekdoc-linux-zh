  md: '# 6.1.5 I/O statistics


    Another source of information about the storage devices is the DASD I/O statistics.
    With I/O statistics all the important information about the storage devices are
    collected and stored in a file for further analysis. You can switch the DASD I/O
    statistics on and off as needed. Figure 6-16 shows how to switch DASD I/O statistic
    on and off.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_238_0.png)


    Figure 6-16 Switch DASD I/O statistic on/off


    To reset the collection, switch DASD I/O statistics off and on again.


    Also see 3.1.8, "netstat" on page 68, for more informational about DASD I/O statistics.


    # 6.2 Case study


    In this section we see a case study involving a real-life problem. In this case
    study, we discuss a scenario in which the swap rate becomes too high and the system
    throughput decreases dramatically.'
