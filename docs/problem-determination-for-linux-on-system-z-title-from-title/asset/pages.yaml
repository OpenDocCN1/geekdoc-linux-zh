    model


    # Problem determination flow chart


    While trying to narrow down a problem, it is important to analyze any information
    already available. Figure 4-14 on page 126 shows a high-level flow chart demonstrating
    how this can be done. This flow chart describes an approach that can be used for
    problem determination on the local system. Usually, when there is a problem, the
    first thing to try is to capture as many error logs as possible. In some cases
    it may happen that the error messages get overwritten. So, it is very important
    to try capturing the error messages as and when they are available. An examination
    of error messages will help us to narrow down the problem to a layer or at least
    to a set of layers. When a working system suddenly stops working, before jumping
    in and editing configuration files, it is important to investigate whether any
    changes were made on the system before the problem occurred. In most cases we
    will notice that there was a change made and that it resulted in an error. If
    the problem is occurring on a newly installed system, it is worth checking all
    the configurations for any mistake. Sometimes changes made at the network'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'level (outside the System z) server can also create problems for the systems
    running on the System z server. So, good coordination with the network support
    staff is also an important factor in troubleshooting network problems. In some
    cases, it may be required to use network packet tracing tools to narrow down or
    isolate the problem. Usually, then there is a permanent communication issue, and
    it is easy to identify and fix compared to the case of an intermittent problem.
    Intermittent problems may take more time to troubleshoot and may need to be kept
    under observation for some time after fixing to ensure that it is really fixed.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_141_0.png)


    Figure 4-14 Problem determination on the local system'
