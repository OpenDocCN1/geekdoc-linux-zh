- pgno: 292
  md: '# **Gathering information provided after the installation**


    After the installation, most of the log files are located in the /var/log directory.
    In this directory we can find system and applications default logs. An example
    of application logs shows us the gdm and cup directories that contain logs for
    the applications Gnome Display Manager and Common UNIX® Printing System, respectively.
    In Figure 9-5, we can verify that more logs are available in the /var/log directory.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_292_0.png)


    *Figure 9-5 Content of /var/log directory*


    Regarding gathering information, the daemon syslogd and the file syslog.conf are
    essential keys to understanding what is printed to the /var/log/ files.


    Syslogd is a daemon that reads and logs messages to the system console or log
    files. The syslog.conf is the configuration file to this daemon. At syslog.conf
    we can configure what kind of and where the information will be available.


    Example 9-2 shows a syslog.conf file. Note that all information regarding notice,
    kern debug, and so on, will be recorded on /var/log/messages.


    *Example 9-2 syslog.conf*


    ```

    # Log all kernel messages to the console.

    # Logging much else clutters up the screen.

    #kern.* /dev/console


    # Log anything (except mail) of level info or higher.

    # Don''t log private authentication messages!

    *.info;mail.none;authpriv.none;cron.none /var/log/messages


    # The authpriv file has restricted access.

    authpriv.* /var/log/secure


    # Log all the mail messages in one place.

    mail.* /var/log/maillog

    ```'
  merge: -1
  img_proc: true
- pgno: 293
  md: '```

    # Log cron stuff

    cron.* /var/log/cron


    # Everybody gets emergency messages

    *.emerg *


    # Save news errors of level crit and higher in a special file.

    uucp,news.crit /var/log/spooler


    # Save boot messages also to boot.log

    local7.* /var/log/boot.log

    ```


    > **Note:** For SUSE, we need to configure the syslog-ng.conf to customize the
    type of information that we want to see in /var/log/messages. The file syslog-ng.conf
    is located in the /etc/syslog-ng directory.


    Analyzing the syslog.conf example, we note that the line mail.* /var/log/maillog
