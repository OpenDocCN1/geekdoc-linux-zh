- pgno: 359
  md: '![](img/f332344337ca8bf6846cb313a66ee0b3_359_0.png)


    # # Problem Determination for Linux on System z


    ![](img/f332344337ca8bf6846cb313a66ee0b3_359_1.png)


    +   *   Learn a Linux on System z problem determination methodology

    +   *   Discover problem determination tools for z/VM and Linux on System z

    +   *   Do a case study using what you learn here


    This IBM Redbooks publication addresses some of the common problems that customers
    have experienced on the Linux&reg; on System z&trade; platform. This book provides
    a problem determination methodology and tools to help the reader diagnose the
    problem in an easy-to-read self-help manual.


    We start with a discussion on how to approach problem solving in the Linux on
    System z environment and continue on to describe some of the problem determination
    tools commonly used for z/VM and Linux on system z. We continue with discussions
    on network problem determination, performance problem determination, and storage
    problems.


    Additionally, we discuss the formation of eligible (or eligibility) lists.


    # ## INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    # ### BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    IBM Redbooks are developed by the IBM International Technical Support Organization.
    Experts from IBM, Customers and Partners from around the world create timely technical
    information based on realistic scenarios. Specific recommendations are provided
    to help you implement IT solutions more effectively in your environment.


    For more information: ibm.com/redbooks


    SG24-7599-00                    ISBN 073843129X'
  merge: -1
  img_proc: true
