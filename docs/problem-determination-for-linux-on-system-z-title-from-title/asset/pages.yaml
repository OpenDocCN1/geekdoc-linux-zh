  md: 'enabled on the system, the next time an application crashes, Linux is able
    to write the core to a file.


    As an example, we executed a simple program that would keep on forking new processes.
    At any one point the Linux would be running out of process ID and resource, in
    which case the application would not be responding and would be busy waiting for
    other process to finish so that it can span more processes. This is a classic
    example of a core dump, since we know the PID of the process and we can obtain
    the core dump for the process for further investigation.


    Once the program started creating processes, we captured the process ID (PID)
    for the program using the ps -ef command. At this point the application is not
    responding and the Linux system is also low on resources.


