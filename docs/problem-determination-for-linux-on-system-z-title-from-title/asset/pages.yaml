    # sar


    The sar command collects and displays system data. It writes to standard output
    the contents of selected cumulative activity counters in the operating system.
    The accounting system, based on the values in the count and interval parameters,
    writes information at the specified number of times spaced at the specified intervals
    in seconds.


    With its numerous options, the sar command provides queuing, paging, TTY, and
    many other statistics. One important feature of the sar command is that it reports
    either system-wide (global among all processors) CPU statistics (which are calculated
    as averages for values expressed as percentages, and as sums otherwise) or it
    reports statistics for each individual processor.


    The sar command prints the following information:


    +   - Process creation

    +   - Context switching

    +   - All/single CPU utilization

    +   - Network utilization

    +   - Disk statistics


    In Example 3-3 the sar command with the -d option generates real-time disk I/O
    statistics.


