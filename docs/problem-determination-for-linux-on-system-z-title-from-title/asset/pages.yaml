    The LPAR utilization shown in Figure 2-25 has a bar chart showing processor utilization
    of every LPAR on the System z, and it has a table with detailed information about
    each LPAR. The table has scroll bars to expand the table and show more columns
    and rows. On the left of each row is a link icon, which connects a user to additional
    information relating to that row (or LPAR).


    After careful inspection of the system performance information available via the
    z/VM displays from OMEGAMON, the next step in a performance evaluation is to look
    at statistics from inside one or many of the Linux guests that are running on
    z/VM.'
