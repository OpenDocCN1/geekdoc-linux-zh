  md: '# 2.3 IBM Tivoli OMEGAMON XE on z/VM and Linux


    Tivoli OMEGAMON® XE on z/VM and Linux is one of a suite of Tivoli Management Services
    products called Tivoli Enterprise Monitoring Agents. These products use common
    shared technology components to monitor your mainframe and distributed systems
    on a variety of platforms, and to provide workstation-based reports that you can
    use to track trends and understand and troubleshoot system problems.


    Tivoli OMEGAMON XE on z/VM and Linux V4.1.0 is a product that gives you the ability
    to view data collected from multiple systems on a flexible interface. With this
    monitoring agent, you can view z/VM data obtained from the IBM z/VM Performance
    Toolkit (also known as the Performance Toolkit). You can also display Linux on
    System z performance data. This dual capability allows you to solve problems quickly
    and helps you to better and more easily manage a complex environment.


    OMEGAMON monitoring software provides a portal that is accessible via a desktop
    client or a browser. This portal interface allows users to monitor systems without
    having to be logged onto either Linux or z/VM. The portal provides a single point
    of control for monitoring all of your Linux and z/VM images as well as z/OS® and
    its subsystems, databases, Web servers, network services, and WebSphere® MQ.


    The OMEGAMON portal displays the following types of data:


    +   - Memory usage, disk input and output (I/O) usage, and paging activity by
    workload name

    +   - System-wide data by resource, such as logical partition usage and paging
    data

    +   - System-wide spooling space usage

    +   - TCP/IP network statistics for enabled network server virtual machines

    +   - HiperSockets™ utilization data

    +   - z/VM CPU data

    +   - Linux on IBM System z workload statistics


    The beginning phase of checking the performance of a system, or multiple systems,
    using the OMEGAMON product is to look at the high-level displays for each system.
    In our environment we are only concerned with the performance of z/VM and its
    Linux guests. Since z/VM controls all of the hardware resources and virtualizes
    that environment for the Linux guests, the OMEGAMON display for z/VM is a good
    starting point. The following series of graphs from the'
  merge: -1
  img_proc: true
