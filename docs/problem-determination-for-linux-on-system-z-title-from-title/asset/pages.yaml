- pgno: 214
  md: 'Figure 5-39 shows the breakdown of the SCSI latency that can be acquired using
    the zfcp statistics. Refer to 3.3.6, "zFCP/SCSI" on page 106 for a more detailed
    explanation. Table 5-3 indicates the conclusions to derive for an HBA based on
    the zfcp statistics.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_214_0.png)


    Table 5-3 lists what look for on the host bus adapter based on the zfcp statistics.


    # Table 5-3 Statistics for host bus adapters


    | Description | What to look for |

    |---|---|

    | Number of queue full conditions for the request queue | Increase might indicate
    channel saturation. |

    | Request queue utilization. Values: 0 to 128 | Numbers close to 128 might indicate
    channel saturation. |

    | Response queue utilization. Values: 0 to 128 | Numbers close to 128 might indicate
    channel saturation. |

    | Number of low memory conditions that require use of emergency buffer for SCSI
    commands | Increase indicates memory pressure, possibly caused by extreme I/O
    workload. |

    | Number of error recovery actions of the HBA | Increase might indicate hardware
    problems. |'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Table 5-4 lists the some of the things to look for in the logical unit based
    on the zfcp statistics.


    # Table 5-4 Statistics for logical units


    | Description | What to look for |

    |---|---|

    | List of request sizes and their occurrences for SCSI write commands | Usually
    larger requests utilize the link better, but may increase device latency. |

    | List of request sizes and their occurrences for SCSI read commands | Usually
    larger requests utilize the link better, but may increase device latency. |

    | Number of SCSI commands without data transfer | Usually only used for recovery
    or discovery purposes, hence the number should be low. |

    | Number of timed-out SCSI commands for write, read, and nodata commands | Increase
    might indicate hardware problems. |

    | SCSI command sizes rejected due to subchannel queue constraints | Increase might
    indicate channel saturation. |

    | SCSI commands rejected due to memory constraints | Increase might hint at workload
    or memory constraint as cause of performance degradations. |

    | Ranges of latencies and their occurrences for SCSI write commands | High latencies
    indicate problems with the storage device, or the cabling. |

    | Ranges of latencies and their occurrences for SCSI read commands | High latencies
    indicate problems with the storage device, or the cabling. |

    | Ranges of latencies and their occurrences for SCSI commands without data transfer
    | High latencies indicate problems with the storage device, or the cabling. |

    | Average, minimum, and maximum number of pending SCSI commands for writes and
    reads | An average close to the maximum (32) might indicate saturation of zfcp
    internal resources. |

    | Number of error recovery actions for LUN | Increase might indicate hardware
    problems. |

    | Number of LUN resets and target resets for LUN | Increase might indicate hardware
    problems. |'
  merge: -1
  img_proc: true
