- pgno: 223
  md: 'This is a classic case in which we experience that a performance bottleneck
    can arise even when the all the resources on the system are not used.


    # Case study 2 - slow database server response


    In this case study we examine a problem reported as a slow database server response.


    # Problem


    Performance tests done on a database server indicate that the expected results
    are not attained.


    # Data for analysis


    To troubleshoot the problem, we need to gather and analyze the following information:


    +   - sar, vmstat, and iostat outputs

    +   - Information about the disk configuration

    +   - Oracle statspack output


    # Analysis and conclusion


    The database used is Oracle. From the Oracle statspack output shown in Figure
    5-48 it is clear that the log file sync event is taking a long time to complete.
    log file sync is the event that writes the updated data in the log buffer into
    online redo log files when dirty blocks in the dirty buffer are written onto the
    disks.


    Top 5 Timed Events

    Event | Waits | Time (s) | Avg wait (ms) | %Total Call Time

    log file sync | 960,319 | 1,574 | 2 | 48.7

    cr request retry | 900 | 836 | 929 | 25.9

    log file parallel write | 514,887 | 316 | 1 | 9.8

    CPU time |  | 237 |  | 7.4

    gc current block busy | 7,575 | 94 | 12 | 2.9


    Figure 5-48 Oracle statspack output


    Upon investigation of the disk volume hosting the redo log file, and the disk
    I/O for that volume, it became clear that logical volume is not striped. Because
    of this, all the I/O was concentrated on one disk rank and there was a bottleneck.
    So, striping the volume to multiple ranks solved the issue, since that resulted
    in distributing the I/O evenly across multiple disk ranks instead of concentrating
    only on one. This is an example of a performance bottleneck because of an incorrect
    system configuration.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Case study 3 - using OProfile for problem determination


    In this case study we demonstrate problem determination by using OProfile.


    # Problem


    The porting of an ISV middleware and application is completed. While running a
    test with peak load, it was noticed that even the target response is not achieved
    and the CPU utilization is almost 100%. This was beyond the estimated CPU requirement
    for the application.


    # Data for analysis


    To troubleshoot the problem, we need to gather and analyze the following information:


    +   - sar and vmstat outputs

    +   - Data gathered using OProfile


    # Analysis and conclusion


    From the CPU utilization report generated using vmstat, it was found that the
    utilization of CPU under peak load is usr: 75%, sys: 20%, and iowait: 5%. Since
    most of the CPU utilization is occurring for the usr part with lot of I/O, the
    next logical thing is to check the middleware or application. The CPU utilization
    data gathered by using OProfile is shown in Figure 5-49. So, the function aaaaaaa
    in the library AAAAAA.so.1 provided by the middleware is called frequently. This
    was discussed with the ISV and a patch for the middleware fixed the problem.


    ```

    CPU: CPU with timer interrupt, speed 0 MHz (estimated)

    Profiling through timer interrupt

    samples % app name symbol name

    168856 37.6918 AAAAAA.so.1 aaaaaaaa

    17815 3.9766 vmlinux default_idle

    15248 3.4036 vmlinux _spin_unlock_irq

    13024 2.9072 BBBBBBBB bbbbbbbb

    7354 1.6416 ext3 (no symbols)

    5587 1.2471 libc-2.3.4.so memset

    5457 1.2181 BBBBBBBB cccccccc

    5307 1.1846 CCCCCCCC (no symbols)

    5145 1.1485 vmlinux number

    5018 1.1201 libc-2.3.4.so _IO_vfscanf

    ```


    Figure 5-49 CPU utilization captured by using OProfile'
  merge: -1
