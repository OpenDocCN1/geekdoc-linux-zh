  md: 'Figure 4-13 compares the network communication layer for Linux on System z
    with the OSI reference model. The hardware layer in the OSI reference model is
    made up of the HW, VM, QDIO, and QETH layers. The data link layer of the OSI model
    is represented by the ARP layer. Also, part of the ARP layer, along with the IP
    layer, makes up the network layer of OSI. The OSI transport layer is implemented
    as the TCP/UDP layer and, finally, the application layer in the network communication
    model for Linux on System z represents the session, presentation, and application
    layers of the OSI reference model.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_140_0.png)


