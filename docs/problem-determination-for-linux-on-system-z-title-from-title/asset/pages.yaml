    # /etc/init.d/boot script


    The script /etc/init.d/boot is used to:


    +   ▶ Activate SELinux.

    +   ▶ Mount the /proc file system.

    +   ▶ Mount the /sys file system.

    +   ▶ Mount /dev/pts.

    +   ▶ Start blogd.

    +   ▶ Execute various start scripts (these scripts are located at /etc/init.d/boot.d/).

    +   ▶ Execute the /etc/init.d/boot.local script.

    +   ▶ Stop blogd.


    # Executing /etc/init.d/boot scripts


    The scripts placed on /etc/init.d/boot.d/ are called and executed by the /etc/init.d/boot
    script. The following processes are executed by them:


    +   ▶ Loading kernel modules

    +   ▶ Activating swap file systems

    +   ▶ Activating SUSE Configuration Profile Management (SCPM)

    +   ▶ Updating the library path'
  merge: -1
  img_proc: true
- pgno: 311
  md: '+   • Setting the host name

    +       • Activating the loop back device and mounting it

    +       • Setting the time slice of scheduler

    +       • Setting the IP setting (parameter settings related to N/W such as IP
    forwarding)

    +       • Setting the kernel parameter setting specified in etc/sysctl.conf


    **Note:** At /etc/init.d/boot.d, processes that start with Sxxx (for example,
    S12SuSEfirewall2_init) start when the machine boots, while processes that start
    with Kxxx (for example, K20boot.rootfsck) are used to kill when the machine boots
    or is powered off.


    # ## Starting Getty


    When then service start process has finished, the getty program is started by
    the init process, and the login prompt is displayed. As a result, login of the
    system becomes possible.'
