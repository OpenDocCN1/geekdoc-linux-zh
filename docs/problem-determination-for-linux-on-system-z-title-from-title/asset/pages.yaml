    # 3.2 Dump and trace


    The system dump command copies selected kernel structures to a dump file or device
    when an unexpected system error occurs. The dump device can be'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'dynamically configured, which means that either the tape or DASD devices can
    be used to receive the system dump.


    A system kernel dump contains all the vital structures of the running system,
    such as the process table, the kernel''s global memory segment, and the data and
    stack segment of each process. When we examine system data that maps into these
    structures, we can gain valuable kernel information that can explain why the dump
    was called. Also, the dump technique can only take a snapshot of the kernel structure
    at a given point of time.


    On the other hand, with the tracing mechanism we would be able to record system
    calls and other application-based issues dynamically.


    # 3.2.1 When to use dump


    When an application fails and halts execution or whenever a system crashes with
    a kernel panic, we recommend doing a dump, since with a dump we can record and
    analyze the execution and memory snapshot of the system when the issue happen.
    See Figure 3-4.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_96_0.png)


    Figure 3-4 Example of when to use dumps'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# 3.2.2 When a trace should be run


    Unlike Figure 3-4 on page 81, there are situations in which the application would
    be still in execution, but does not respond. In this case we recommend using trace
    facilities, rather than the dump.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_97_0.png)


    *Figure 3-5 Example of when to use trace facilities*


    If we use dump, it would be only a snapshot. So it would be required to use a
    series of dumps at various execution points. Instead, trace facilities would provide
    us with information about system calls and signal traces to the standard error
    devices.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 3.2.3 Stand-alone dump


    A stand-alone dump is used to collect diagnostic information about the entire
    system. After a stand-alone dump is taken, the system cannot resume normal processing—an
    IPL is required. Stand-alone dump is very useful in investigating system hangs,
    kernel memory, and system call status.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_98_0.png)


    Figure 3-6 Stand-alone dump


    Three stand-alone dump tools are shipped in the s390-tools package as part of
    the zipl package:


    +   - DASD dump tool for dumps on DASD volumes

    +   - Tape dump tool for dumps on (channel-attached) tape devices

    +   - SCSI disk dump tool for dumps on a SCSI disks


    To create a stand-alone dump:


    +   1. Create a dump device for dumping the memory. We recommend that you have
    device storage allocation around memory size plus approximately 10 MB space. You
    can define the dump device in the zipl.conf file found in the /etc directory.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '+   2. To initiate a dump, we must IPL the dump device. This is destructive.
    That is, the running Linux operating system is killed.

    +   3. Reboot the original Linux images and mount the already created dump DASD.


    # 3.2.4 Verification of the dump


    After the dump device is mounted on the system, we need to inspect the dump to
    identify the problem, also referred as post-processing of the dump device. In
    Linux we have tools to validate the dump devices or files.


    # zgetdump


    Use the zgetdump tool to read the given dump device and write its contents to
    standard output or redirect to a file.


    *Example 3-25 Convert a dump image into a file using zgetdump*


    ```

    zgetdump /dev/dasdXX > dump.X

    ```


    # lcrash


    Validation and inspection of the dump can also be done using the lcrash—the Linux
    crash dump analyzer.


    *Example 3-26 Verification of the dump file using lcrash*


    ```

    lcrash -i -d /dev/dasdXX

    ```


    To copy a dump from DASD to a file system, call lcrash with the -s (save dump)
    and -d (dump device) options. The -s option specifies the destination directory
    for the resulting dump file (dumpfile).


    *Example 3-27 Converting a dump image to a file using lcrash*


    ```

    lcrash -d /dev/dasdx1 -s dumpfile

    ```


    > Note: During verification of the dump images, the tools should display the message
    Dump End Marker found: this dump is valid. This means that the dump is a valid
    dump that can be used for further processing.


    # Creating reports from stand-alone dump using lcrash


    Install lkcdutils if lcrash is not found on the system.'
  merge: -1
  img_proc: true
