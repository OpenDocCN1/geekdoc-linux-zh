- pgno: 273
  md: 'Another example of a hardware error message concerning DASD would be an equipment
    check error.


    +   ▶ Equipment check (EQC) usually indicates a hardware error.


    +   ▶ The message in Example 8-7 indicates an EQC of a reset event. A Reset Event
    is returned from control units on the timing of the first access after a channel
    path reset. The channel path is reset when the reconnection has occurred after
    the physical connection of ESCON® or FICON is disconnected.


    +   ▶ You will not see that the connection is broken when the message is displayed.


    # Example 8-7 /var/log/messages


    ```

    Feb 6 01:07:19 xxxxxxxx kernel: dasd_erp(3990): 0.0.7404: Equipment Check - environmental
    data present

    Feb 6 01:07:19 xxxxxxxx kernel: dasd_erp(3990): 0.0.7404: FORMAT 0 - Reserved

    Feb 6 01:07:19 xxxxxxxx kernel: dasd_erp(3990): 0.0.7404: dasd_3990_erp_action_4:
    first time retry

