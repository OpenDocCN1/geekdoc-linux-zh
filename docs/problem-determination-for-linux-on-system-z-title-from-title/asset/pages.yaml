    # 4.2.3 Network interfaces and their interface names


    On systems with multiple network interfaces, the interface name allocated to the
    OSA devices may not be consistent across Linux system reboots. The reason for
    this is that the hotplug events are not synchronous, and multiple drivers initialize
    their devices in parallel. This inconsistency in the interface name may lead to
    trouble for certain middleware such as Oracle®. Also, SNMP and the Linux monitoring
    tool sar may also be affected by this issue.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'Figure 4-8 illustrates the asynchronous nature of the hotplug events. As illustrated,
    the device 3333 is configured ahead of device 222 and now has the interface name
    of eth1 allocated to it instead of the expected eth2. Device 2222 is the eth2
    now.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_135_0.png)


    Figure 4-8 Asynchronous hotplug events and inconsistent interface naming


    To avoid this problem, the hotplugging of the network interfaces can be queued
    by editing the /etc/sysconfig/hotplug and adding the entry:


    ```

    HOTPLUG_PCI_QUEUE_NIC_EVENTS=yes

    ```


    Another solution is to use udev and make the connection between the device address
    and the interface name in the file /etc/udev/rule.d/30-net_persistent_names.rules.
    Example 4-1 shows how eth6 can be permanently assigned to 0.0.05a2.


    # Example 4-1 Allocating the interface name eth6 to the device 0.0.05a2 permanently


    ```

    SUBSYSTEM=="net", ACTION=="add", ENV{PHYSDEVPATH}=="*0.0.05a2",

    IMPORT="/lib/udev/rename_netiface %k eth6"

    ```'
  merge: -1
  img_proc: true
