    | SIGSEGV | 11 | CORE | Invalid memory reference |

    | SIGPIPE | 13 | TERM | Broken pipe signal |

    | SIGTERM | 15 | TERM | Termination signal |


    In Example 3-31, we would issue the SIGABRT (abort signal) signal for obtaining
    a core dump.


