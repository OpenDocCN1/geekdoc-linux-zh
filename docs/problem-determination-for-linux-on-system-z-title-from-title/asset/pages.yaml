  md: "With the vgscan command, all scanned devices are stored in the ./etc/lvm/.cache\
    \ file. The target device file name is defined by filter parameter in lvm.conf.\n\
    \n```\npersistent_filter_cache {\n    valid_devices=[\n        \"/dev/dm-6\",\n\
    \        \"/dev/dasdc\",\n        \"/dev/dasdb1\",\n        \"/dev/dasdcl\",\n\
    \        \"/dev/dasda1\",\n        \"/dev/dm-5\",\n        \"/dev/mapper/lu5601p1\"\
    ,\n        :\n        :\n    ]\n}\n```\n\nFigure 6-15 lvm.conf file\n\nThe recognition\
    \ of the LVM by the vgscan command is the following sequence: PVs → VGs → LVs.\n\
    \nUnless all PVs that are part of a VG are recognized, the VG is not available.\
    \ First PVs need to be recognized in vgscan while booting. PVs need to be recognized\
    \ in initrd or zipl.conf.\n\nThe pvdisplay command is available to display the\
    \ recognized PVs.\n\nIn the case that PVs are recognized but the VG is not recognized,\
    \ the meta-data area in a PV may be broken.\n\nIn the case that PVs are not recognized\
    \ (not listed by pvdisplay), check the following:\n\n+   - In lvm.conf:\n+   \
    \  - filter parameter\n+     - types parameter\n+   - Check /etc/lvm/.cache to\
    \ verify the target device file name."
  merge: -1
  img_proc: true
