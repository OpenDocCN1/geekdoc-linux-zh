    # ## 11.3 z/VM to the rescue


    Even though we have many z/VM-based problem determination tools available, we
    directly started our investigation using the IBM z/VM Performance Toolkit,'
  merge: -1
  img_proc: true
- pgno: 339
  md: 'since we wanted to compare and narrow down the problem. The IBM z/VM Performance
    Toolkit provides detailed system performance statistics in tailorable tabular
    and graphic formats. These reports are used for health checks, problem determination,
    and trend analysis. So during the workload simulator''s peak load, for our further
    investigation we started to record and monitor the overall system using the IBM
    z/VM Performance Toolkit.


    A good place to start looking at information in the Performance Toolkit is in
    the categories of general system data and I/O data. So the first thing we noticed
    was some indication of expanded storage paging. z/VM evolved around having a hierarchy
    of paging devices. Expanded storage is the high-speed paging device, and DASD
    the slower one where block paging is done.


    This means that expanded storage can act as a buffer for more active users as
    they switch slightly between working sets. These more active users do not compete
    with users coming from a completely paged out scenario.


    In this environment, real storage is sufficiently constrained so that there is
    heavy paging to expanded storage. However, expanded storage is sufficient so that
    DASD paging is essentially eliminated.'
  merge: -1
  img_proc: true
