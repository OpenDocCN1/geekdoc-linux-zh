- pgno: 301
  md: '# 10.1 Understanding the boot process


    The Linux operating system for System z has four phases on its boot process. They
    are IPL, boot loader, kernel, and Init phases. See Figure 10-1.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_301_0.png)


    Now we describe each process phase.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# ### 10.1.1 IPL phase


    Initial Program Loader (IPL) is a mainframe term for the loading of the operating
    system into the computer''s main memory. IPL is to mainframe as boot is for other
    architectures. See Figure 10-2.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_302_0.png)


    The IPL phase consists of reading the boot loader code from the operator-specified
    device into memory and starting boot loader (zIPL).


    DASD, SCSI disk, tape, and VM reader can be used as IPL devices.


    # ### 10.1.2 Boot loader phase


    The main boot loader function is to load other software for the operating system
    to start. It is found at the start of the IPL device. The boot loader used for
    IBM S/390 and zSeries machines is called zIPL. Boot loader code is made by the'
  merge: -1
  img_proc: true
- pgno: 303
  md: '/sbin/zipl command and installed on a user-specified IPL device. Figure 10-3
    shows an example of how zIPL works.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_303_0.png)


    *Figure 10-3 How zIPL works*


    The bootloader phase consists of loading the initial RAM disk image (initrd) and
    starting the Linux kernel, and then finally booting the Linux Operating System.'
  merge: -1
  img_proc: true
