  md: '# ## Booting problems


    This chapter helps you to identify most problems that you could encounter with
    the boot process. In the first section we show how the boot process normally works.
    This makes the problem determination much easier.


    This chapter covers the following topics:


    +   - Understanding the boot process

    +   - Gathering information regarding boot

    +   - Commands

    +   - Boot problem examples

    +   - Scenarios'
