- pgno: 88
  md: '# 3.1.10 OProfile


    OProfile is an open source profiler for Linux systems. It offers profiling of
    all running code on a Linux system, including the kernel, shared libraries, application
    binaries, and so on, and provides a variety of statistics at a low overhead (varying
    from 1–8%) depending on the workload. It is released under the GNU GPL. OProfile
    consists of a kernel driver, a daemon for collecting sample data, and tools for
    report generation.


    OProfile is generally supported in Linux kernel 2.2, 2.4, 2.6, and later. But,
    for Linux on System z, OProfile only supports kernel 2.6 or later. For SUSE Linux,
    the kernel level must be at least kernel-s390(x)-2.6.5-7.191, which starts from
    SLES9 SP2. For Red Hat Linux, the kernel level must be at least kernel-2.6.9-22.EL,
    which is RHEL4 U2.


    OProfile utilizes CPU''s performance counters to count events for all of the running
    code, and aggregates the information into profiles for each binary image. However,
    System z hardware currently does not have support for this kind of hardware performance
    counters utilized by OProfile, so the timer interrupt is used instead.


    Using OProfile the code can be profiled for:


    +   - Hardware and software interrupt handlers

    +   - Kernel modules, the kernel

    +   - Shared libraries

    +   - Applications


    OProfile setup involves configuring the kernel source by enabling the profiling
    option. To build and install OProfile, issue the commands shown in Example 3-16
    from the decompressed oprofile directory. As shown in this example, we used the
    option *with-kernel-support*. You would use this option when you have a kernel
    Version of 2.6 and later. For more information about installation instructions
    of OProfile, see:


    http://oprofile.sourceforge.net/doc/install.html


    # Example 3-16 Setting up OProfile


    ```

    ./configure --with-kernel-support

    make

    make install

    ```'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'To use the OProfile tool, the timer should be turned on by using command sysctl.
    After all the profiling is done, turn the timer off. Once OProfile is installed
    successfully, you must tell OProfile the location of the vmlinux file corresponding
    to the running kernel. If the kernel is not intended to be profiled then OProfile
    is set by passing a parameter telling the system that it does not have a vmlinux
    file. Both examples are shown in Example 3-17.


    # Example 3-17 Basic profiling configurations


    ```

    opcontrol --vmlinux=/boot/vmlinux-`uname -r`

    or

    opcontrol --no-vmlinux

    ```


    Once OProfile is installed and set up, you can use the opcontrol command to start
    and stop (shut down) the profiling daemon (see Example 3-18).


    # Example 3-18 OProfile start and stop commands


    ```

    opcontrol --start / --shutdown

    ```


    Opcontrol takes a specification that indicates how the details of each hardware
    performance counter should be set up. Kernel or user space code is profiled based
    on these settings.


