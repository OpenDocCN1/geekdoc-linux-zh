- pgno: 320
  md: "# ## 10.3 Commands\n\nThe commands that can be used on the boot process are:\n\
    \n+   - **chkconfig**\n+     Updates and queries runlevel information for system\
    \ services.\n+     \n+     The command `chkconfig` has five functions:\n+    \
    \ - Add new services for management.\n+     - Remove services from management.\n\
    +     - List current startup information for services.\n+     - Change the startup\
    \ information for services.\n+     - Check the startup state of a particular service.\n\
    +   - **dmesg**\n+     Prints or controls the kernel ring buffer.\n+     \n+ \
    \    The command `dmesg` helps users to print out their bootup messages.\n+  \
    \ - **mkinitrd**\n+     Creates initial ramdisk images for preloading modules.\n\
    +     \n+     The command `mkinitrd` automatically loads file system modules,\
    \ IDE modules, and all scsi_hostadapter entries in /etc/modprobe.conf.\n+   -\
    \ **lsmod**\n+     Shows the status of modules in the Linux kernel.\n+     \n\
    +     The command `lsmod` formats the contents of the /proc/modules, showing what\
    \ kernel modules are currently loaded.\n+   - **insmod**\n+     Inserts a module\
    \ into the Linux kernel.\n+     \n+     The command `insmod` inserts a module\
    \ into kernel.\n+   - **rmmod**\n+     Removes a module from the Linux kernel.\n\
    +     \n+     The command `rmmod` removes a module from the kernel.\n+   - **modprobe**\n\
    +     Adds and removes modules from the Linux kernel.\n+     \n+     The command\
    \ `modprobe` looks in the module directory /lib/modules/<kernel_version> for all\
    \ the modules and other files, except for /etc/modprobe.conf (configuration file)\
    \ and /etc/modprobe.d directory."
  merge: -1
  img_proc: true
- pgno: 321
  md: "+   - **zipl**\n+   \n+   Boot loader tool for IBM S/390 and zSeries architectures.\n\
    +   \n+   **zipl** can be used to prepare devices for initial program load (IPL).\
    \ It has the following supported functions:\n+   \n+   – Booting a Linux kernel\
    \ with optional ramdisk and kernel command line\n+   – Taking a snapshot of the\
    \ current system status (system dump)\n+   – Loading a data file to initialize\
    \ named saved segments (NSS)\n+   \n+   The zipl tool implements a boot menu and\
    \ includes the following features:\n+   \n+   – Displays a list of available configurations\n\
    +   – Allows you to choose a configuration\n+   – Allows you to specify additional\
    \ kernel command-line parameters\n\n+   - **fsck**\n+   \n+   Checks and repairs\
    \ a Linux file system.\n+   \n+   **fsck** is used to check and optionally repair\
    \ one or more Linux file systems. Normally, **fsck** will try to handle file systems\
    \ on different physical disk drivers in parallel to reduce the total amount of\
    \ time needed to check all of the file systems.\n\n# ## 10.4 Boot problem examples\n\
    \nWhen we are talking about boot problem determination, there are basically two\
    \ main problems:\n\n+   - Linux cannot finish booting.\n+   \n+   Processing stops\
    \ somewhere in the boot process. There can be many reasons for this problem.\n\
    +   \n+   - The system does not work well after boot is completed.\n+   \n+  \
    \ The system has booted but Linux is not working properly, for example, he service\
    \ that should start automatically does not start, some devices necessary for booting\
    \ was not recognized, FCP devices cannot be recognized, LVM cannot be recognized,\
    \ or the network is not connected."
  merge: -1
  img_proc: true
- pgno: 322
  md: 'For a better understanding and a definition of where the problem is, we use
    the diagram in Figure 10-7 to help to identify which phases on the boot process
    have problems.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_322_0.png)


    At this point, we have three possibilities: This occurs immedeately after install,
    after changing the configuration, or after hardware failure.


    # Immediately after installation


    The installation might not be correctly completed due to the trouble of the installer.
    After the installation ends, Linux does not boot it.


    # After changing the configuration


    When the LVM configuration changes or disks are added, for example, necessary
    processing (execution of zIPL and recreation of initrd and so on) is not executed.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# ## 10.5 Scenarios


    This topic describes problems that can occur when you are booting your Linux system.
    For all examples, we use the same procedure to determine the solution.


    First of all, we need to ask questions about what is causing the problem, and
    then we investigate.


    # ### 10.5.1 IPL failure


    Ask yourself the following questions when an IPL has failed:


    +   - Problem description: IPL device not found

    +     Questions to be answered:

    +     - Is the IPL address correct?

    +     - Is the IPL device address correct?

    +     - Is it defined on the IOCP of that LPAR?

    +     - Is the z/VM guest attached (under VM)?


    +   - Problem description: Boot loader code does not exist in IPL device

    +     Questions to be answered:

    +     - Is the IPL address correct?

    +     - Are the zIPL configurations correct?

    +     - Did the H/W trouble occur on the specified IPL device?


    Possible solutions are:


    +   - Confirm the connection to the IPL device.

    +   - Re-IPL with the correct IPL address.


    Execute the `zipl` command from the rescue system, and introduce the boot loader
    code again if the connection to the IPL device is good and this does not solve
    the problem.


    > *Example 10-6  Message example in VM console - IPL with wrong address*


    ```

    ```

    Ready; T=0.01/0.01 23:06:59

    IPL 3302 CLEAR

    00: HCPGIR450W CP entered; disabled wait PSW 000A0000 0000000F

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 324
  md: "# 10.5.2 Failing in kernel booting\n\nThe following are thought to be causes\
    \ of failure when the kernel is booting:\n\n+   - Problem description: kernel\
    \ image in boot loader code is destroyed. Questions to be answered:\n+   \n+ \
    \    - Did the H/W trouble occur on the specified IPL device? Do hardware problem\
    \ determination.\n+     - Is the image file specified for the \"image=\" line\
    \ in /etc/zipl.conf file normal?\n\n+   - Problem description: kernel starts securing\
    \ the memory more than the system defined. Questions to be answered:\n+   \n+\
    \     - Is the storage setting of LPAR or VM User correct?\n+     - Did you define\
    \ the \"mem=\" parameter in /etc/zipl.conf?\n\nPossible solutions are:\n\n+  \
    \ - Reinstall boot loader code with the correct kernel image file by using the\
    \ rescue system.\n+   - Change the LPAR (or VM guest) storage size and re-IPL.\n\
    +   - With rescue booting, delete \"mem=\" in /etc/zipl.conf and re-run /sbin/zipl.\n\
    \n```\nExample 10-7 Message example in VM console - kernel image is destroyed\n\
    z/VM V5.2.0   2007-01-16 13:12\nReady; T=0.01/0.01 23:37:21\nIPL 3301 CLEAR\n\
    00: Booting default (ipl)...\n00: HCPGIR453W CP entered; program interrupt loop\n\
    ```\n\n# 10.5.3 Failing since the init phase\n\nThe file systems are not able\
    \ to mount (excluding root).\n\nInit cannot skip a pertinent process, and stops\
    \ during processing when there is a problem involving DISK (for example, when\
    \ there is a partition problem).\n\n+   - Problem description: failing in fsck\n\
    +     - Questions to be answered:\n+       - Is the /etc/fstab description correct?\n\
    +       - Are the devices correctly recognized?"
  merge: -1
  img_proc: true
- pgno: 325
  md: '+   - Does the file system break?


    +   - **Problem description: failing in mounting file system**

    +   Questions to be answered:

    +   - Is the /etc/fstab description correct?

    +   - Are devices correctly recognized?

    +   - Does not the file system break?


    Possible solutions are:


    +   - **Modify the fstab entries.**

    +   - If there is a mis-setting, modify it.

    +   - If a problem in a file system occurs, comment it out temporarily or set
    the fsck flag to off (set it to 0).


    +   - **Re-make initrd.**

    +   The devices may not be recognized by coldplug but may be recognized after
    a re-make of initrd.


