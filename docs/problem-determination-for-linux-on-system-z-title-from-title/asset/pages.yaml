- pgno: 285
  md: '# # 9.1 Understanding the installation process


    Before starting a Linux installation we need to check for system requirements
    (for example, memory, network, disk space). To understand the details of these
    requirements, see the Web site of your preferred Linux distributor, such as:


    +   *   [http://www.novell.com](http://www.novell.com)

    +   *   [http://www.redhat.com](http://www.redhat.com)


    A Linux installation on System z can be performed in two ways:


    +   *   Under z/VM - When Linux is installed on z/VM, the Linux distribution is
    considered a guest system.

    +   *   On a System z LPAR - When Linux is installed using LPAR, permit it to
    use a part of physical memory on the system.


    It is possible to install Linux on System z either from graphical interface or
    from a text interface.


    If we decide to use a graphical user interface, you can use your mouse to navigate
    the screens, enter text fields, or click buttons.


    To run the graphical installation, we can use either of two options below from
    your Linux or Windows@ workstation machine. You must also have another server
    running.


    +   *   X11 forwarding


    From your Linux machine, open a command prompt and type the following:


    ```

    ```bash

    $ ssh -X servername.company

    ```

    ```


    Where:


    +   *   -X is the option that enables X11 forwarding. This can also be specified
    on a per-host basis in a configuration file.

    +   *   servername.company is a server machine where Linux will be installed (for
    example, Inx.itsc.ibm.com).


    +   *   VNC Client


    From your Linux or windows machine, we can use the VNC Client to access the server
    and install Linux.


    > **Note:** In most of cases the VNC option is the best solution.'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'There are at least four methods of installation available to install your Linux
    distribution:


    +       1. Install from a hard disk or a DASD.

    +       2. Install via NFS.

    +       3. Install via FTP.

    +       4. Install via HTTP.


    When we are using NFS, FTP, or HTTP methods, we need to fill in an additional
    screen configuration.


    > **Note:** For SuSE SLES 10 and RHEL 5.1 we can choose a Layer 2 connection to
    connect to NFS and the FTP server.


    When we start the installation, we first make some configuration decisions before
    the packages become available to be installed. To install:


    +   1.  Language selection - Select the language that you would like to use during
    the installation.


    > **Note:** This choice is valid only for the installation process. To configure
    what language your system will supported you must configure it in the language
    support configuration panel.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '2. Disk partitioning setup - At this option, we can choose automatic partitioning
    or manual disk partitioning. Here we configure the partition sizes used by Linux.
    See Figure 9-1.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_287_0.png)


    **Note:** For a production server we highly recommend using the manual disk partitioning
    option.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '3. Network configuration - Configure host name, gateway, and DNS. If we have
    multiple network cards, each device has its own configuration screen. See Figure
    9-2.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_288_0.png)


    Figure 9-2  Configuring network'
  merge: -1
  img_proc: true
- pgno: 289
  md: '4. Firewall configuration - At this point, we can decide to prevent access
    to your computer. We can choose the No Firewall or Enable Firewall option. If
    Enable firewall is checked we can allow access to some services such as remote
    login (SSH), file transfer (FTP), mail server (SMTP), and Web server (HTTP/HTTps).
    See Figure 9-3.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_289_0.png)


    > **Note:** If you prefer, you can enable/disable these services after the system
    is installed.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '5. On following screens we can select a language to support, set the time zone
    and root password, and select packages that we want to install.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_290_0.png)


    After this, Linux will be installed and ready to use.


    > **Note:** More information about the detailed Linux installation on S/390 architecture
    can be found in *IBM z/VM and Linux on IBM System z: Virtualization Cookbook for
    Red Hat Enterprise Linux 4, SG24-7272*, and at: `http://www.ibm.com/ linux`


