    Usually an emergency scanning problem is detected when there are one or two guests
    (Linux servers) consuming the majority of the system pages available for allocation
    to the guest.


    Also, some parts of VM 64-bit releases were still operating in 31-bit mode, which
    implies an upper addressability limit of 2 GB. This could cause certain runtime
    issues when running Linux guests, for example, when they were performing I/O.
    Linux has the unfortunate tendency to grab and hold on to all of the memory allocated
    to it, which sometimes leads to a large part of it being misused for internal
    I/O buffer and cache.


    Linux guests, where a virtual storage equal to or greater than 2 GB is defined,
    are now common on many systems. In order to perform real I/O in this particular
    scenario prior to VM v5.2.0, the system needed to use areas below the requesting
    virtual machine 2 GB line, and, as these were already in use by the'
  merge: -1
  img_proc: true
- pgno: 346
  md: 'virtual machine itself, the system had to resort to emergency scanning to find
    the storage pages that it required to complete the I/O task.


