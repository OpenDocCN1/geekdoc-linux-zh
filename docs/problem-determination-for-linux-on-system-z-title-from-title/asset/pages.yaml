- pgno: 189
  md: 'As discussed earlier, we start the problem determination by examining the system
    configuration. Figure 5-9 shows the logic flow for the CPU bottleneck check. Typically,
    while examining the current configuration, the physical, logical, and virtual
    (z/VM) CPU configuration is learned. Then the CPU resource allocation settings
    are compared with the physical CPU resources on the hardware to make sure that
    the configuration is correct.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_189_0.png)


    Figure 5-9 Flow of problem determination - checking the configuration


    Once the configuration is verified, the next step is to investigate the cause
    of the high CPU utilization problem. Figure 5-10 on page 175 shows a diagrammatic
    representation for the same. When the CPU utilization is investigated, it is important
    to remember that the utilization data needs to be collect at multiple intervals
    and then analyzed. The CPU utilization data must be collected for the entire system,
    for each CPU, and for each process. In the case of z/VM, the same is to be collected
    for each VM and, also, the z/VM overhead is to be measured. If the CPU utilization
    is 100%, then chances are that the bottleneck is on the CPU. However, this is
    not always true since activities such as paging consume lot of processing cycles.
    So, if the CPU utilization is reaching 100% mainly because of the paging operations,
    then we have a memory bottleneck.'
  merge: -1
  img_proc: true
