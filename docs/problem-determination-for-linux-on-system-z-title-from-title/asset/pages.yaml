- pgno: 16
  md: '# Problem determination methodology


    This chapter describes the approach for problem solving. Note that the approach
    to resolving problems is related not only to actions after problems happen. We
    also take a proactive approach and follow-up actions to prevent problems from
    occurring in the future.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Figure 1-1 shows the typical life cycle for problem determination, where you
    would either start when the problem happens or, when taking a proactive approach,
    design and manage your system with problem prevention in mind.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_17_0.png)


    Figure 1-1 Life cycle of problem determination'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 1.1 Proactive approach for minimizing the effects of problems


    Approaching problems proactively is an important methodology.


    Sometimes, we cannot react to problems quickly because of a lack of preparation.
    This impacts the resolution of problems and may remain as risks on your customer''s
    system. An example of problems that could be avoided and thus minimize impact
    to your customer''s system are no package for dbginfo.sh, no performance data,
    no disk for stand-alone dump, and so on.


    Designing, system management, and preparation for problems minimizes the affects
    of problems and shorten the total turn around time (TAT) by providing a quick
    response when a problem happens. Quick responses require preparation during the
    design and test phases.


    # 1.1.1 Design and implementation phases


    The following three points should be considered during the design and implementation
    phases:


    +   - Preparation for recovery from a single point of failure (SPOF), if one exists

    +   - Monitoring system design for a daily gathering of information

    +   - Installation and settings for emergency information collection


    Note that it is difficult to implement these in the later phase of test or after
    system integration, so planning ahead for troubleshooting is important.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Preparation for recovery from SPOF failure


    Basically, redundant configurations should be adopted on each component as often
    as possible. These are very important for Linux on System z because of availability
    improvements. But if there are any single points of failure (SPOFs), prepare the
    quick recovery procedure for these problems. For example, if OSAs are not redundant,
    recovery procedures for network devices are needed.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_19_0.png)


    Figure 1-2 Necessity of quick recovery procedure


    A rescue Linux image will help recover your system when a problem happens. For
    example, if a boot problem happens because of a configuration error, a rescue
    Linux image will let you check and change the configuration files that caused
    a file system mounting failed error.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_19_1.png)


    Figure 1-3 Sample image of recovery with rescue Linux


    # Monitor system design


    Monitoring the system will also help you when trouble happens. For example, security
    traceability is important for finding mis-operations, not only for security'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'incidents. An operator can notice trouble by monitoring critical message alerts.

    Performance monitor data helps to find the cause of service-level degradation.


    Table 1-1 is a sample template of system management monitoring requirements.

    Note that these are not all required for all customers. You can discuss these
    items based on your customer''s Service Level Agreement (SLA).


    # Table 1-1 Monitor contents template


    | A) Data collection | A-1) Data contents | A-1-1) Security Traceability | Collecting
    logs that can trace the authority exceeded operation (who, when, where, what).
    |

    | | | A-1-2) Capacity Management | Collecting the performance data of H/W, OS,
    and processes for analyzing capacity trends for future planning. |

    | | | A-1-3) Problem Traceability | Collecting time-line logs of each problem
    and incident, which helps analysis of the problem. |

    | | A-2) Automated keeping | | Storing the corrected data automatically in specified
    terms. Removed the expired data automatically. |

    | | A-3) Data processing | | For performance data, it should be easy to process
    for analyzing, for example, organized on an Excel® sheet. |

    | B) System monitoring | B-1) Monitoring contents | B-1-1) Performance monitoring
    | Monitoring the performance status based on threshold (for example, overconsumption
    system resource. |

    | | | B-1-2) Service monitoring | Monitoring the status of service and system.
    Alert the operator if these stop or the condition becomes bad. |

    | | | B-1-3) State transition monitoring | Alert the operator about a status transition
    (for example, takeover on redundant system, batch job ends successfully). |

    | | B-2) User interface | | The operator can monitor easily with graphs or charts,
    and so on. |

    | | B-3) Service duration | | Monitoring 24x365. |'
  merge: -1
  img_proc: true
- pgno: 21
  md: '**Tip:** While we are discussing the monitoring of contents, we also discuss
    how to control command responses, including error messages (such as from Linux
    commands and shell scripts, z/VM commands, and REXX). A command response is the
    starting point for recognizing that something may be happening in the system.
    We recommend that command responses should not be discarded but instead be redirected
    to /dev/null


    # Preparation for gathering information for troubleshooting


    Here we discuss what kind of emergency information may be needed. We recommend
    preparing a script that gathers emergency information needed for any problems.
    The scripts listed in Table 1-2 are an example of scripts used to gather troubleshooting
    information. Your scripts should include dbginfo.sh, as well as saving the system
    log (syslog).


    You may need to prepare ahead of time to gather information at this phase. Some
    of the preparation you should think about doing is:


    +   - Install package selection for Linux tools.

    +   - Have disk equipment ready in case you need to take a stand-alone dump.

    +   - Be aware of the settings needed for data gathering (core dump and so on).

    +   - If you are going to run scripts under z/VM, you should also enable the perfsvm
    user to be able to collect z/VM monitor raw data and follow the recommendation
    from the z/VM team at: http://www.vm.ibm.com/perf/tips/collect.html


    Table 1-2 Packages of popular problem determination tools


    | Commands | Packages |

    |---|---|

    | dbginfo.sh | s390utils on RHEL4.4 (or later), no need on SLES |

    | gcore, gstack | gdb |

    | strace | strace |

    | tcpdump | libpcap |

    | lsof | lsof |

    | iostat, sar | sysstat |

    | ps, top, vmstat | procs |


    Other sections of this book describe each component and tool listed in Table 1-2.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 1.1.2 Test phase


    You can rehearse for problems and practice gathering information in the test phase.
    These two actions will provide valuable information:


    +   - Failure simulation tests

    +   - Practicing gathering information


    # Failure simulation tests


    Failure tests should be done during the test phase as often as possible. You can
    check the behavior, logs, and recovery procedures for each potential problem.
    If target components are redundant, you should check that the they work correctly.
    These tests may include hardware, software, and application failure. Tests for
    procedures for physical component replacement are also good.


    Check these items for a failure test:


    +   - System behavior

    +     - The system behavior is the same as expected.

    +     - The extent of impact is the same as expected.

    +   - Resource usage

    +     - The resource usage is the same as expected.

    +     - The resource usage increase has side effects:

    +       - Performance decline of own application

    +       - Performance decline of the other systems that share the same resources

    +       - Causes a critical issue (for example, CPU overload, I/O hang, thrashing,
    and so on)

    +   - Redundancy check

    +     The system continues or recovers as expected.

    +   - Error code and messages

    +     - The error code and messages are the same as expected.

    +     - Choose messages that should be monitored.

    +     - The critical message is described in messages and code manuals.

    +   - Recovery procedure

    +     The recovery procedure works correctly.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Table 1-3 represents some of the potential problems that can be practiced with
    during the test phase. The question you should ask for each is what is the expected
    behavior if each of these happens. You would want to see what the logs would say,
    what error codes and messages are given, and if and how you would recover from
    each of these incidents.


    Table 1-3 Test case sample


    | Network |  | Server |  |

    |---|---|---|---|

    |  | OSA cable pull/plug |  | Linux down |

    |  | OSA chpid offline |  | LPAR stop |

    |  | Physical switch failure |  | z/VM user down |

    |  | VSWITCH failure |  | z/VM down |

    | Storage | Fibre cable pull/plug | Tape | Driver failure |

    |  | Channel chpid offline/online |  | Library failure |

    |  | Director/SAN switch failure | Software | Process failure |

    |  | RANK failure |  | Application failure |


    # Practice collecting data


    Practicing gathering troubleshooting data is very important. You can check that
    needed information is gathered correctly. Also, you need to be able to prepare
    a quick procedure to gather the necessary information. You may want to perform
    these rehearsals during the failure tests mentioned previously.


    We suggest confirming the following during your rehearsals:


    +   - Operation

    +     Practice using the IBM z/VM Performance Toolkit (see 2.2, "IBM z/VM Performance
    Toolkit" on page 38) and the Linux sysstat package (see 3.1.3, "System status
    (sysstat) tool" on page 62). For example, you could create some z/VM raw monitor
    data and read it into the IBM z/VM Performance Toolkit.

    +   - The data that is gathered is correct.

    +   - Additional system load - Your system should have enough of each of the following
    in order to collect the data that you need:

    +     - CPU and memory

    +     - File size (enough for file systems)

    +     - Duration time

    +   - Know your contact point and formations in an emergency.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '+   ► Organizing the system information

    +     - Version list of OS, Microcode, Middleware, Packages, PTF, and so on

    +     - H/W configuration diagram


    Execute the rehearsal when the system is both active and in a failed state. This
    will help you to understand the correct status of the system and the difference
    in the case of failure. These differences may help you to quickly and easily determine
    the cause of any problems when they happen.


    # 1.2 Problem determination basics


    Problem determination is the processes of finding what the problem is and why
    it happened.


    +   ► What is the problem?

    +     - Understand what the problem is, and obtain a consensus with the team (both
    IBMers and customers).

    +     - Gather the correct information related to the failure components.

    +   ► Why did the problem happen?

    +     - Specify the cause or trigger of the problem with supporting information
    (logs, traces, and so on).

    +     - Determine the cause, step-by-step, and collect information in various
    patterns.

    +     - Determine the most effective process to reproduce the problem, and find
    the difference between a problem that is reproducible and one that is not reproducible.


    These need the correct supporting information related to the problematic component.
    Sometimes you need to reproduce and gather more information. Customers require
    recovery of their system as soon as possible. However, recovered systems will
    not provide effective information. A quick response and gathering of the correct
    information is very important. Information collected at the correct time and organized
    properly makes analysis faster.


    # 1.2.1 Basic problem determination steps


    Just after the problem happens, you must understand what the problem is and its
    impact to the customer, gather needed information, and decide how to analyze this
    information. The priority of analysis must be decided. Of course, recovery is'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'always a top priority and avoidance is second, but sometimes these cannot be
    done without first determining the cause.


    The analysis phase should include exploring the cause and the solution. You should
    try to reproduce the problem. Problem reproduction may show the cause of the problem
    directly, or provide some big hints as to what it is. It will also make gathering
    additional information easier.


    Figure 1-4 shows some basic steps of problem determination. Sometimes it is necessary
    to escalate to each support team at certain points in the analysis, as shown in
    Figure 1-4. Report (as shown in the figure) not only reports the result, but also
    includes discussion about follow-up actions.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_25_0.png)


    Figure 1-4 Basic steps of problem determination'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'Determine which component is failing in the order shown in Figure 1-5. First
    look at the application or middleware, and then look at the actual hardware to
    determine where the failure is originating.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_26_0.png)


    Figure 1-5 Find the problem component


    # 1.2.2 Gather information and explore the type of problem and its trigger


    Just after a problem happens, you should gather and organize problem determination
    data as soon as possible. You should reach a consensus among parties concerned
    as to what data to collect. This is the first step of problem determination. Often
    the cause of the problem can be found during this step.


    > **Important:** As soon as any problem occurs, execute `dbginfo.sh`. If Linux
    is down or hung, get a stand-alone dump.


    # Information about the problem


    Collect as much information as possible about the problem, for example:


    +   - A complete description of the problem

    +   - Date and time of the problem

    +   - Which system the problem appeared on and whether it appears on more than
    one system

    +   - System environment - hardware, software (with patch level), network'
  merge: -1
  img_proc: true
- pgno: 27
  md: '+   - Other work occurring around you

    +     Were other people performing work around you that may have caused the problem
    (such as a network maintenance outage)?

    +   - What made you decide it was a problem (effect/logs)

    +     A command or script log should be referenced.

    +   - Current status (ongoing problem, recovered, or avoided)

    +     Is there a recovery plan or a plan for avoidance of the problem?

    +   - Scope (multi-system or non-multi-function) - common terms or differences

    +   - Difference from daily operation (loading, operation order, and so on)

    +   - Past results

    +     - Has the target operation had a similar result or is this a new behavior?

    +     - Is there are any change from the previous results, or are they exactly
    the same?

    +   - Same/similar problem

    +     Has the same or a similar problem happened before?

    +     - If it has happened before, check the necessary information, the avoidance
    method, and the recovery procedure.

    +     - This has happened in the past and has already been solved, can we fix
    the problem to prevent it from happening again?


    # Impact


    The impact of a problem on the following should be determined:


    +   - Applications

    +     For production/for development/in implementation

    +   - Business

    +     - The importance of the service of the system

    +     - Status (recovered, partial failure, or full failure)


    # Information that should be gathered


    The following is a list of information that you should collect about a problem
    to assist you in determining what the problem is:


    +   - Define the symptoms of the problem (that is, boot failure, disconnection
    network, I/O failure'
  merge: -1
  img_proc: true
- pgno: 28
  md: '+   - Find the error component (hardware, kernel, application, and so on).

    +   We may have a chance to find the error component quickly based on the symptoms,
    error messages, or other signs.

    +   - Confirm the current system status.

    +   We can gather more information before recovery than after. If data is or wrapped
    or only in memory, reboot may clear it.

    +   - Current system topologies (hardware, software, network).

    +   - Decide what information should be collected.

    +   At first, we should gather common information for any problems. If it is difficult
    to determine what you must collect, contact your support team.


    # Investigation policy


    Determine an investigation policy with your team members. You will need to:


    +   - Agree on which contents will be collected ahead of time and when that collection
    must take place.

    +   - Agree on the type of recovery, avoidance, cause, and so on.

    +   - Schedule a practice run of data collection.


    # 1.2.3 Analysis of a problem


    After you have gathered the needed information regarding the problem, you must
    examine and analyze this data to:


    +   - Determine the cause of the problem.

    +   - Determine a method to reproduce the problem.

    +   - Determine an avoidance method (or work around) for the problem.


    **Tip:** Confirm the validity of collected data before starting an analysis. Packed
    information should be unpacked, and it should be determined if it can be read
    or whether it must be formatted with tools in order to be read.


    # Determine the cause of the problem


    Before you can decide on how to reproduce the problem or work around the problem,
    you are going to have to determine the cause of the problem. Some methods of determining
    the cause of the problem are:


    +   - Specify the trouble component according to the problem description and gathered
    information.

    +   - Search for information about the problem on Bugzilla (http://www.bugzilla.org)
    or your particular hardware and software'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'technical library. For Linux trouble, you can also find information about your
    problem by doing a Web search.


    +   - Investigate the cause on each component.

    +   - Determine whether you need to contact a support team.


    # Determine a method to reproduce the problem


    Being able to reproduce a problem is an important aspect of both problem determination
    and problem resolution. To reproduce a problem, you must:


    +   1. Determine what triggered the problem.

    +      - Was it a particular command?

    +      - Was it a particular transaction?

    +      - Was it a particular operation?

    +      - Does it occur during system start, stop, or reboot?

    +      - Were any changes recently applied to the system?

    +   2. Check the conditions surrounding the problem.

    +      - Check resource use such as CPU, memory, I/O, and network.

    +      - Check other transactions or processes running in parallel.

    +   3. Prepare the test system.

    +      - Use the test system.

    +      - Use the production system temporarily.

    +      Confirm the effects on the system by reproducing the problem.

    +   4. Test with related conditions and triggers.


    If a problem is not reproducible, see 1.2.6, "How to approach complex problems"
    on page 16.


    # Determine an avoidance method


    An avoidance method is a temporary solution or work around for a problem (for
    example, temporarily changing the operation or modifying the program or shell
    script). Basically, it avoids the trigger of the problem. Quick recovery procedures
    are also a part of avoidance methods if a problem has already been found.


    Accepting the avoidance method may have some risks and cause additional workload.
    You need to discuss this option with your customers. The effects of changing operations
    and workloads by changing programs or scripts must be defined.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Note: Sometimes the work around could be the actual solution.


    # Gather additional information


    Sometimes you may need to investigate a problem step-by-step with additional information.
    We need to define what information is needed according to the current investigation
    status. When analyzing a problem, it may be determined that more information is
    needed.


    # 1.2.4 Collect additional information


    Collecting additional information about the customer''s environment or a similar
    test environment may be necessary after an analysis of data shows that you do
    not have enough information about a problem. You may need a consensus with your
    team to determine the current investigation status and check the effects on the
    system of gathering more information.


    # Consensus terms


    Your team will have to come to a consensus on the following issues before you
    can collect additional information:


    +   - Was anything found regarding the problem using the current information?

    +   - What other information is required to continue the problem investigation?

    +   - What needs to be done to collect the additional information?

    +     - Do you need to reproduce the problem to collect additional data? See "Determine
    a method to reproduce the problem" on page 14. Run a test and gather the additional
    information.

    +     - Set tools for gathering information in daily operation (effects of settings
    on production).

    +   - How should you gather additional data?

    +     - Run a reproduction test to see whether the problem recurs.

    +     - Set tools for gathering information in the system if the problem is not
    found.


    # Effects


    You must understand the importance of collecting additional information as well
    as the effects this gathering of information will have on a system.


    +   - You may need exclusive use of the system to run the reproduction test.

    +     - Schedule to use the system.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - Take into consideration the additional system load of the test and the
    time that it takes to gather the information.

    +   > You may need to change the settings of some of your tools in the system
    with the effects on the system of:

    +   - System additional loading (overhead)

    +   - Data size (trace, log, and so on)

    +   - Effects on operation

    +     - Changed scope of operation, configuration, script

    +     - Problem detection method during problem reproduction


    > **Note:** Gathering additional information sometimes overloads the system. Make
    sure that all persons involved in the upkeep of the system understand the implications
    and importance of gathering additional information.


    # 1.2.5 Escalate to the support team to analyze


    If you are unable to find the cause of the problem, you may need to contact a
    support team for further analysis. The team will ask you to provide additional
    information. The information that they may need is:


    +   **Frequency**

    +   - Date when the problem happened

    +   - How often the problem happened

    +   **Trigger (Is there something that happens first before the problem?)**

    +   - What was happening at the time the problem occurred?

    +   - Was there recently a change to the system?

    +   **Reproducibility**

    +   Reproduction procedure.

    +   **Required response**

    +   Investigate the cause, the avoidance method, and the recovery method and their
    priority.


    # 1.2.6 How to approach complex problems


    Problem reproduction helps in determining the exact cause of the problem. If the
    problem is not reproducible, it is difficult to find the cause. It is important
    to gather enough and accurate information.'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Ideally, you should try to reproduce the problem in a test environment. Automated
    and continual operation around the trigger is a good place to start if you know
    the trigger. Automated test systems allow you to monitor the problem occurring
    and stop the test if a problem occurs. Automated collection of data is also helpful.


    Your team should decide how long testing should continue and prepare different
    types of test cases. If one type does not reproduce the problem for a specified
    amount of time, change to another type of test case.


    In our sample test case, LVM command hangs. In this case you should:


    +   1. Prepare a Linux test system that has the same version of kernel, LVM, and
    DM.

    +   2. Create a script that runs the LVM commands.

    +      It does not include "&" for the command, so it stops if the LVM command
    hangs.

    +   3. Set core dump.

    +   4. Run the script with two patterns:

    +      - Singly

    +      - Parallel

    +   5. The problem is reproduced when script runs in parallel. This demonstrates
    that the problem is an LVM specification for that version. Change the operation
    to not run the LVM command in parallel to ensure that your understanding of the
    problem is correct.


    # Set tools to gather information


    The tools that you use to collect data should include dumps, EREP reports, and
    traces. Getting a stand-alone dump will have impact to services, so ensure that
    you communicate your needs and the necessity to your team.


    If the trouble component is not found, set monitor tools for all related components,
    not only for gathering information (application, middleware, OS, system resource,
    performance), and if the problem recurs, collect the data that is related to the
    problem.


    # 1.3 Problem resolution and follow-up actions


    After determining the problem you must fix the problem. Applying a patch or changing
    a configuration and operation may cause side effects. Before applying patches
    or making configuration changes, confirm that the problem will be fixed'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'with it. Confirm that there will be no side effects. Ensure that you update
    your documentation.


    Before applying a fix (patch or change), we recommend doing a pre-apply test to
    confirm that the problem will be fix with no side effects. This test should include
    a test to try and reproduce the problem. If the problem did not happen frequently,
    you need to determine how long to wait for the problem to recur to ensure that
    you have truly fixed it.


    For applying a patch or program modification you will need to test it in the production
    system or a test system that is similar to your production system. To confirm
    problem resolution, a reproduction test should show a clear result.


    # 1.3.1 Expanded check for other systems


    Check all of your other systems to make sure that the same problem does not happen.
    Systems with the same version, configuration, and operation may have the same
    problem.


    The following list is a reminder of what to watch for on your other systems:


    +   - Problem conditions. Check to see whether there are any other conditions
    that cause the same problem. Check the:

    +     - Software version

    +     - Transaction type

    +     - Operation

    +     - Configuration

    +   - System scan

    +     Scan all systems that have the possibility of having the same condition.

    +   - Schedule for applying fixes.

    +     - If the possibility of a system having the same problem is high, apply
    the fix as soon as possible

    +     - If the possibility is low, schedule the application of the fix for the
    next maintenance cycle or determine whether applying no fix at all is an option.


    # 1.3.2 Update


    After the change is applied to the system, you need to remember to update your
    documents, monitoring procedures, and problem determination operations to reflect
    this new problem.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'This documentation may include your message and code manuals. If applying a
    fix makes a difference to all of the same systems, you should include it in the
    document updates. Loss of that information may cause other problems and make problem
    determination difficult.


    Verify that applying a fix does not have any new messages. If there are new messages,
    such as that there is additional system loading, make sure that you document and
    discuss any new threshold values for the system.


    Additionally, update for:


    +   - New message or changing monitored message

    +     - Add or change the target message (TEC, Console, AOEMF, IBM Director, and
    so on).

    +     - Add or change messages and code manuals.

    +   - Additional system loading

    +     - Change the threshold value.

    +     - Add new monitoring contents.

    +     You may need to change from monitoring content that is no longer necessary
    to monitoring new content.


    After confirmation of the problem resolution, review your problem determination
    operations and update your procedures accordingly. You may need to update your
    procedures for problem determination. Some of the updates that you may need to
    make are:


    +   - System environment

    +     - Should you run reproduction tests?

    +     - Did monitoring systems find the problem?

    +     - Are the systems automated enough?

    +   - Actions just after problem happens

    +     - Are prepared operation manuals correct for this problem?

    +     - Do operators know the correct procedure?

    +     - Is there any time loss for first actions?

    +   - Gathering information

    +     - Are you missing any problem determination information?

    +     - Are there enough resources for gathering information?

    +       - Operation personnel

    +       - Automation scripts'
  merge: -1
  img_proc: true
- pgno: 35
  md: '+   - System resources

    +   - Reporting

    +     - Do all reports have the correct information related on each report line?

    +       - Lack of information

    +       - Unnecessary information

    +     - Is reporting time correct?

    +     - Is contact timing for the support team correct?


    # 1.4 Summary


    In this chapter, we described a methodology for determining the cause of a problem
    on your Linux on System z environment. The first step in finding the cause of
    a problem so that you can correct it is to gather as much information as possible
    about the circumstances surrounding the problem. Write as much information down
    about the problem as possible. Examine whether the problem occurs on just one
    system or on many of your systems. Determine whether a change you or somebody
    else has made to the system happened just before the problem started.


    Additionally, examine the frequency of the problem occurring and whether it is
    a problem that can be reproduced. You must have a test system that is set up as
    close to the production system as possible so that you can try to reproduce the
    problem there.


    In this rest of this book we continue to examine problem determination methods
    and the tools on z/VM as well as Linux on System z that can assist you in finding
    the cause of your problem quickly to bring about a quick resolution.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Problem determination tools for z/VM


    In this chapter we show the tools that are available for problem determination
    and data gathering in the z/VM environment. There are tools available on both
    Linux and z/VM for problem determination. Dependent on the problem area or category,
    you need to decide which tools should be used to help determine your problem.


    Since Linux runs as a guest to z/VM, Linux-based tools have some degree of error
    during problem determination in areas where the resources are fully controlled
    by z/VM. At this point, we recommend that you use z/VM-based tools or a combination
    of z/VM and Linux-based tools to get more granular information about the problem.
    On the other hand, Linux-based tools are often your best choices for debugging
    an application, and kernel-related or process-related problems.


    First we discuss some z/VM system tools. We provide some CP commands that are
    available to assist you with gathering some basic information about the status
    of the system.


    Additionally, we show the features of IBM z/VM Performance Toolkit and demonstrate
    how to use it for problem determination. We also provide an overview of the functions
    of Omegamon.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# 2.1 z/VM system tools


    Like Linux, the z/VM operating system has commands to display system information
    as well as system performance information. These commands are control program
    (CP) system commands. In this section we provide some CP commands that you can
    use to gather basic information about the status of the system.


    # 2.1.1 Collecting technical setup information


    Collect technical setup information as part of your information-gathering technique.
    To gather your release-level and service-level information use the command q cplevel,
    as shown in Figure 2-1.


    ```

    q cplevel

    z/VM Version 5 Release 3.0, service level 0703 (64-bit)

    Generated at 03/13/08 07:41:44 EDT

    IPL at 03/24/08 14:25:10 EDT

    ```


    Figure 2-1 Sample output from the q cplevel command'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Other commands that help you collect information about the setup of your environment
    are:


    +   - Network setup

    +     - `q lan`

    +     - `q nic`

    +     - `q vswitch`

    +     - `q v osa`

    +   - General and DASD

    +     - `q set` (See Figure 2-2.)

    +     - `q v dasd`


    ```

    q set

    MSG ON , WNG ON , EMSG ON , ACNT OFF, RUN OFF

    LINEDIT ON , TIMER OFF , ISAM OFF, ECMODE ON

    ASSIST OFF , PAGEX OFF, AUTOPOLL OFF

    IMSG ON , SMSG OFF , AFFINITY NONE , NOTRAN OFF

    VMSAVE OFF, 370E OFF

    STBYPASS OFF , STMULTI OFF 00/000

    MIH OFF , VMCONIO OFF , CPCONIO OFF , SVCACCL OFF , CONCEAL OFF

    MACHINE XA , SVC76 CP, NOPDATA OFF, IOASSIST OFF

    CCWTRAN ON, 370ACCOM OFF, TIMEBOMB IDLE

    ```


    Figure 2-2 Output from q set command


    # 2.1.2 Indicate


    A good source of information about the overall status of the z/VM system is the
    `indicate` command. The response to the `indicate` command varies depending on
    the CP class of the virtual machine on which the command was issued. We assume
    for the examples in this book that you issue the commands from a virtual machine
    with the appropriate CP classes like the MAINT user ID.


    Use `indicate load` to display the operating load on the host system:


    +   - The percentage of usage and CPU type for each online processor in your system

    +   - Information concerning expanded storage

    +   - Information concerning the minidisk cache

    +   - The paging rate

    +   - The number of users in the dispatch, eligible, and dormant lists'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'See the response to the indicate command in Figure 2-3.


    Note that Load is the default operand of the indicate command.


    ```

    indicate load

    AVGPROC-0004

    XSTORE-000004/SEC MIGRATE-0000/SEC

    MDC READS-000001/SEC WRITES-000001/SEC HIT RATIO-100%

    PAGING-2/SEC STEAL-00%

    Q0-00001(00000)                      DORMANT-00022

    Q1-00001(00000)    E1-00000(00000)

    Q2-00000(00000)    EXPAN-001 E2-00000(00000)

    Q3-00002(00000)    EXPAN-001 E3-00000(00000)


    PROC 0000-001% CP    PROC 0001-000% CP

    PROC 0002-000% CP    PROC 0003-000% CP


    LIMITED-00000

    Ready; T=0.01/0.01 11:38:16


    RUNNING   VMLINUX8

    ```


    Figure 2-3 indicate load command


    Use indicate paging to do the following:


    +   - Display a list of the virtual machines in page wait status.

    +   - Display page residency data for all system users.


    Use the command with the wait operand to identify the virtual machines that are
    currently in page wait and that displays the number of pages allocated on auxiliary
    storage and expanded storage for each one. This is the default.


    Use paging wait when the indicate queues command has shown that a significant
    proportion of the active users of the system are persistently in page wait.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'When issued with the **all** operand, the command displays the page residency
    data for all users of the system. See Figure 2-4 for an example of the **indicate
    paging wait** command.


    ```

    indicate paging wait

    No users in page wait

    Ready; T=0.01/0.01 15:57:33

    indicate paging all

    MAINT 000000:001396 TEACHOR2 008162:054438 LXORINST 001847:010210

    TEACHOR1 020713:241153 LNXMAINT 000000:00175 LNXINST 022184:080382

    FTPSERVE 000000:001412 TCPIP 000226:002578 USER15 000000:000875

