- pgno: 326
  md: '# 10.5.4 Failure to start a service


    The following two cases are thought to be causes of failure when starting a service.


    +   Problem description: problem with automatic start setting. Questions to be
    answered:

    +   - Is the symbolic link file (whose name starts with Sxx) deployed in /etc/init.d/boot.d?

    +   - Is the symbolic link linked with a correct start script?

    +   - Is the symbolic link file (also known as symlink or soft lnk) deployed in
    /etc/init.d/rcx.d?

    +   - Is the symbolic link linked with a correct start script?


    +   Problem description: The automatic setting is valid, but the service does
    not start. Questions to be answered:

    +   - Has the required service started?

    +   - Is there problem in the start script?


    A possible solution is doing an automatic start setting of the service. It is
    set so that the service starts when booting by using the chkconfig command or
    the insserv command.'
  merge: -1
  img_proc: true
