  md: '![](img/f332344337ca8bf6846cb313a66ee0b3_284_0.png)


    # Installation and setup problems


    This chapter is a guide to help you to identify most problems that you could encounter
    during the installation and setup process. This chapter will help you to make
    the problem determination much easier.


    This chapter covers the following:


    +   Understanding the installation process

    +   Gathering information regarding installation

    +   Scenarios'
