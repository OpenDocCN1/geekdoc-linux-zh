- pgno: 227
  md: '# 6.1 How to determine a storage-related problem


    To determine whether the problem that you encounter on your Linux system is related
    to storage, you need to know commands to use to investigate the storage devices.
    In this section we discuss the different commands to use for the different types
    of storage devices.


    For an overview of your storage devices use the lscss command. lscss is used to
    list all or a subset of devices that are managed by the common I/O subsystem.
    It reads the status from sysfs and lists all channel path (CHP) information, whether
    it is online or not. The status of the channel subsystem can also be checked.


    In Figure 6-1 you can see the lscss command with some explanation.


    ![](img/f332344337ca8bf6846cb313a66ee0b3_227_0.png)


    Figure 6-1 Increased I/O rate


    If a device is not listed with the lscss command, check the following:


    +   - Is the IOCP definition correct?

    +   - Is the target device correct defined in z/VM?

    +   - Check the cio_ignore parameter.


    If the address of the target device is listed with the lscss command but the Use
    column is blank, depending on the way the devices are brought online, check:


    +   - Via kernel parameter in zipl.conf

    +     - a. Check the zipl.conf file.

    +     - b. After editing the zipl.conf, run the zipl command.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '+   - Via initrd

    +     a. Check initrd, then run `zipl`.

    +     b. Check the linuxrc script in initrd (to verify the procedures).

    +   - Via coldplug

    +     Check `/etc/sysconfig/hardware/hwcfg-*`.


    If the channel status is not normal, check the cabling, HMC, and so on.


    # cio_ignore


    Linux senses all devices defined for the LPAR. All detected devices are controlled
    under `sysfs` and can be varied online or offline with Linux commands.


    `cio_ignore` is a kernel parameter that can filter the target device address detected
    by Linux. The devices set on `cio_ignore` are not detected and not controlled
    under `sysfs` and cannot be varied online or offline with a Linux command. These
    devices are also not displayed with the `lscss` command.


    # 6.1.1 How to check DASD devices


    To check the status of the DASD devices use the `lsdasd` command. With this command
    you get some basic information about your DASD devices. In Figure 6-2 you see
    the `lsdasd` command with the response from the system and some explanation of
    how to interpret the system messages.


    ```

    # lsdasd

    0.0.5481 (ECK D) at ( 94: 0 ) is dasda : active at blocksize 4096, 1803060 blocks,
    7043 MB

    0.0.c65f (ECK D) at ( 94: 4 ) is dasdb : n/f

    ```


    Figure 6-2 lsdasd command


    The `dasdview` command gives you more information about the DASD and the volume
    table of contents (VTOC). This command has many options to choose to display the
    information you need:


    +   - `-b` Prints a DASD dump from ''begin''

    +   - `-s` Prints a DASD dump with size ''size''

    +   - `-1` Uses format 1 for the dump (default)'
  merge: -1
  img_proc: true
- pgno: 229
  md: '-2 Uses format 2 for the dump


    ''begin'' and ''size'' can have the following format:


    x[k|m|b|t|c]


    for x byte, kilobyte, megabyte, blocks, tracks, and cylinders


    +   - `-i` Prints general DASD information and geometry

    +   - `-x` Prints extended DASD information

    +   - `-j` Prints the volume serial number (volume identifier)

    +   - `-l` Prints information about the volume label

    +   - `-t` Prints the table of contents (VTOC)

    +   - `-h` Prints this usage text

    +   - `-v` Prints the version number

    +   - `-n` Specifies the device by a device number (needs devfs)

    +   - `-f` Specifies a device by a device node


    Two examples of the dasdview command are shown in Figure 6-3 and Figure 6-4 on
    page 215.


    ```

    # dasdview -i /dev/dasda

    --- general DASD information ----------------

    device node : /dev/dasda

