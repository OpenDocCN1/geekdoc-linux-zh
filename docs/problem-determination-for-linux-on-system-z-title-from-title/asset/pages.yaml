- pgno: 74
  md: '# Problem determination tools for Linux on System z


    In this chapter we discuss tools that are used during problem determination on
    Linux on System z. These tools are available on both Linux and z/VM for problem
    determination. The problem area or category will decide which tools will be used
    to help determine the problem. We always recommend using z/VM-based tools or a
    combination of z/VM and Linux-based tools to get more granular information about
    the problem.


    The Linux environment has several specialized tools for the purpose of problem
    determination. In this chapter we explore the information gathered and the circumstances
    in which the tools would be useful for problem determination.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 3.1 Information-gathering tools


    As discussed in the previous chapter, the first and foremost thing that we need
    to do before starting to use any of the specialized debugging tools is to investigate
    the problem cause. For that we need to gather information about the environment,
    resources, and other configurations. In this section we discuss various Linux-based
    tools that are available.


    > **Note:** The important thing here with the Linux-based tools is that the resource
    utilization reported by any of the Linux-based tools has to be correctly understood,
    keeping in mind the underlying z/VM resource management. When Linux runs as a
    guest, z/VM time shares the Linux images and also optimally shares the resource
    pool. Linux tools only see the share that they got in z/VM. We highly recommend
    that resource utilization information gathered on Linux-based tools be cross-checked
    with the underlying z/VM-based tools.


    Usually, most of these tools provide utilization information for a certain period
    of time, but there are also tools that only provide snapshot utilization. So in
    a problem determination approach, we recommend using shell scripts to record the
    utilization and time stamp for a certain period, for the tools that can only report
