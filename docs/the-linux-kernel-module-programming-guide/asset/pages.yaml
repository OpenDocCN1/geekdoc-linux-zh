    }\n\nmodule_init(devicemodel_init);\nmodule_exit(devicemodel_exit);\n\nMODULE_LICENSE(\"\
    GPL\");\nMODULE_DESCRIPTION(\"Linux Device Model example\");\n```\n```\n\n# 18\
    \ Optimizations\n\n# 18.1 Likely and Unlikely conditions\n\nSometimes you might\
    \ want your code to run as quickly as possible, especially if it is handling an\
    \ interrupt or doing something which might cause noticeable latency. If your code\
    \ contains boolean conditions and if you know that the conditions are almost always\
    \ likely to evaluate as either true or false, then you can allow the compiler\
    \ to optimize for this using the likely and unlikely macros. For example, when\
    \ allocating memory you are almost always expecting this to succeed.\n\n```\n\
    ```c\nbvl = bvec_alloc(gfp_mask, nr_iovecs, &idx);\nif (unlikely(!bvl)) {\n  \
    \  mempool_free(bio, bio_pool);\n    bio = NULL;\n    goto out;\n}\n```\n```\n\
    \nWhen the unlikely macro is used, the compiler alters its machine instruction\
    \ output, so that it continues along the false branch and only jumps if the condition\
    \ is true. That avoids flushing the processor pipeline. The opposite happens if\
    \ you use the likely macro."
