- pgno: 83
  md: "Of course, if you know for sure that there are no functions triggered by irqs\
    \ which could possibly interfere with your logic then you can use the simpler\
    \ read_lock(&myrwlock) and read_unlock(&myrwlock) or the corresponding write functions.\n\
    \n# 12.4 Atomic operations\n\nIf you are doing simple arithmetic: adding, subtracting\
    \ or bitwise operations, then there is another way in the multi-CPU and multi-hyperthreaded\
    \ world to stop other parts of the system from messing with your mojo. By using\
    \ atomic operations you can be confident that your addition, subtraction or bit\
    \ flip did actually happen and was not overwritten by some other shenanigans.\
    \ An example is shown below.\n\n```\n/*\n * example_atomic.c\n */\n#include <linux/atomic.h>\n\
    #include <linux/bitops.h>\n#include <linux/printk.h>\n#include <linux/printk.h>\n\
    \n#define BYTE_TO_BINARY_PATTERN \"%c%c%c%c%c%c%c%c\"\n#define BYTE_TO_BINARY(byte)\
    \  \\\n    ((byte & 0x80) ? '1' : '0'), ((byte & 0x40) ? '1' : '0'), \\\n    ((byte\
    \ & 0x20) ? '1' : '0'), ((byte & 0x10) ? '1' : '0'), \\\n    ((byte & 0x08) ?\
    \ '1' : '0'), ((byte & 0x04) ? '1' : '0'), \\\n    ((byte & 0x02) ? '1' : '0'),\
    \ ((byte & 0x01) ? '1' : '0')\n\nstatic void atomic_add_subtract(void)\n{\n  \
    \  atomic_t debbie;\n    atomic_t chris = ATOMIC_INIT(50);\n\n    atomic_set(&debbie,\
    \ 45);\n\n    /* subtract one */\n    atomic_dec(&debbie);\n\n    atomic_add(7,\
    \ &debbie);\n\n    /* add one */\n    atomic_inc(&debbie);\n\n    pr_info(\"chris:\
    \ %d, debbie: %d\\n\", atomic_read(&chris), atomic_read(&debbie));\n}\n```"
  merge: -1
  img_proc: true
- pgno: 84
  md: "```\nstatic void atomic_bitwise(void)\n{\n    unsigned long word = 0;\n\n \
    \   pr_info(\"Bits 0: \" BYTE_TO_BINARY_PATTERN, BYTE_TO_BINARY(word));\n    set_bit(3,\
    \ &word);\n    set_bit(5, &word);\n    pr_info(\"Bits 1: \" BYTE_TO_BINARY_PATTERN,\
    \ BYTE_TO_BINARY(word));\n    clear_bit(5, &word);\n    pr_info(\"Bits 2: \" BYTE_TO_BINARY_PATTERN,\
    \ BYTE_TO_BINARY(word));\n    change_bit(3, &word);\n    pr_info(\"Bits 3: \"\
    \ BYTE_TO_BINARY_PATTERN, BYTE_TO_BINARY(word));\n    if (test_and_set_bit(3,\
    \ &word))\n        pr_info(\"wrong\\n\");\n    pr_info(\"Bits 4: \" BYTE_TO_BINARY_PATTERN,\
    \ BYTE_TO_BINARY(word));\n\n    word = 255;\n    pr_info(\"Bits 5: \" BYTE_TO_BINARY_PATTERN\
    \ \"\\n\", BYTE_TO_BINARY(word));\n}\n\nstatic int __init example_atomic_init(void)\n\
    {\n    pr_info(\"example_atomic started\\n\");\n\n    atomic_add_subtract();\n\
    \    atomic_bitwise();\n\n    return 0;\n}\n\nstatic void __exit example_atomic_exit(void)\n\
    {\n    pr_info(\"example_atomic exit\\n\");\n}\n\nmodule_init(example_atomic_init);\n\
    module_exit(example_atomic_exit);\n\nMODULE_DESCRIPTION(\"Atomic operations example\"\
    );\nMODULE_LICENSE(\"GPL\");\n```\n\nBefore the C11 standard adopts the built-in\
    \ atomic types, the kernel already provided a small set of atomic types by using\
    \ a bunch of tricky architecture-specific codes. Implementing the atomic types\
    \ by C11 atomics may allow the kernel to throw away the architecture-specific\
    \ codes and letting the kernel code be more friendly to the people who understand\
    \ the standard. But there are some problems, such as the memory model of the kernel\
    \ doesn't match the model formed by the C11 atomics. For further details, see:\n\
    \n+   - kernel documentation of atomic types\n+   - Time to move to C11 atomics?\n\
    +   - Atomic usage patterns in the kernel"
