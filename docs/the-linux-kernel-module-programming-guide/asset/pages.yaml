- pgno: 49
  md: "# 9 Talking To Device Files\n\nDevice files are supposed to represent physical\
    \ devices. Most physical devices are used for output as well as input, so there\
    \ has to be some mechanism for device drivers in the kernel to get the output\
    \ to send to the device from processes. This is done by opening the device file\
    \ for output and writing to it, just like writing to a file. In the following\
    \ example, this is implemented by device_write.\n\nThis is not always enough.\
    \ Imagine you had a serial port connected to a modem (even if you have an internal\
    \ modem, it is still implemented from the CPU's perspective as a serial port connected\
    \ to a modem, so you don't have to tax your imagination too hard). The natural\
    \ thing to do would be to use the device file to write things to the modem (either\
    \ modem commands or data to be sent through the phone line) and read things from\
    \ the modem (either responses for commands or the data received through the phone\
    \ line). However, this leaves open the question of what to do when you need to\
    \ talk to the serial port itself, for example to configure the rate at which data\
    \ is sent and received.\n\nThe answer in Unix is to use a special function called\
    \ ioctl (short for Input Output ConTroL). Every device can have its own ioctl\
    \ commands, which can be read ioctl's (to send information from a process to the\
    \ kernel), write ioctl's (to return information to a process), both or neither.\
    \ Notice here the roles of read and write are reversed again, so in ioctl's read\
    \ is to send information to the kernel and write is to receive information from\
    \ the kernel.\n\nThe ioctl function is called with three parameters: the file\
    \ descriptor of the appropriate device file, the ioctl number, and a parameter,\
    \ which is of type long so you can use a cast to use it to pass anything. You\
    \ will not be able to pass a structure this way, but you will be able to pass\
    \ a pointer to the structure. Here is an example:\n\n```\n/*\n * ioctl.c\n */\n\
    #include <linux/cdev.h>\n#include <linux/fs.h>\n#include <linux/init.h>\n#include\
    \ <linux/ioctl.h>\n#include <linux/module.h>\n#include <linux/slab.h>\n#include\
    \ <linux/uaccess.h>\n#include <linux/version.h>\n\nstruct ioctl_arg {\n    unsigned\
    \ int val;\n};\n\n/* Documentation/userspace-api/ioctl/ioctl-number.rst */\n#define\
    \ IOC_MAGIC 'x'\n\n#define IOCTL_VALSET _IOW(IOC_MAGIC, 0, struct ioctl_arg)\n\
    #define IOCTL_VALGET _IOR(IOC_MAGIC, 1, struct ioctl_arg)\n#define IOCTL_VALGET_NUM\
    \ _IOR(IOC_MAGIC, 2, int)\n```"
