    Now, if you just install a kernel source tree, use it to compile your kernel module
    and you try to insert your module into the kernel, in most cases you would obtain
    an error as follows:


    ```

    insmod: ERROR: could not insert module poet.ko: Invalid module format

    ```


    Less cryptic information is logged to the systemd journal:


    ```

    kernel: poet: disagrees about version of symbol module_layout

    ```


    In other words, your kernel refuses to accept your module because version strings
    (more precisely, version magic, see include/linux/vermagic.h) do not match. Incidentally,
    version magic strings are stored in the module object in the form of a static
    string, starting with vermagic:. Version data are inserted in your module when
    it is linked against the kernel/module.o file. To inspect version magics and other
    strings stored in a given module, issue the command modinfo module.ko:


    ```

    $ modinfo hello-4.ko

    description:    A sample driver

    author:         LKMPG

    license:        GPL

    srcversion:     B2AA7FBFCC2C39AED665382

    depends:

    retpoline:      Y

    name:           hello_4

    vermagic:       5.4.0-70-generic SMP mod_unload modversions

    ```


    To overcome this problem we could resort to the --force-vermagic option, but this
    solution is potentially unsafe, and unquestionably unacceptable in production
    modules. Consequently, we want to compile our module in an environment which was
    identical to the one in which our precompiled kernel was built. How to do this,
    is the subject of the remainder of this chapter.


    First of all, make sure that a kernel source tree is available, having exactly
    the same version as your current kernel. Then, find the configuration file which
    was used to compile your precompiled kernel. Usually, this is available in your
    current boot directory, under a name like config-5.14.x. You may just want to
    copy it to your kernel source tree: cp /boot/config-`uname -r` .config.


    Let''s focus again on the previous error message: a closer look at the version
    magic strings suggests that, even with two configuration files which are exactly
    the same, a slight difference in the version magic could be possible, and it'
