- pgno: 61
  md: 'Intel CPUs, this is done by means of interrupt 0x80. The hardware knows that
    once you jump to this location, you are no longer running in restricted user mode,
    but as the operating system kernel — and therefore you’re allowed to do whatever
    you want.


    The location in the kernel a process can jump to is called `system_call`. The
    procedure at that location checks the system call number, which tells the kernel
    what service the process requested. Then, it looks at the table of system calls
    (`sys_call_table`) to see the address of the kernel function to call. Then it
    calls the function, and after it returns, does a few system checks and then return
    back to the process (or to a different process, if the process time ran out).
    If you want to read this code, it is at the source file `arch/$(architecture)/kernel/entry.S`,
    after the line `ENTRY(system_call)`.


    So, if we want to change the way a certain system call works, what we need to
    do is to write our own function to implement it (usually by adding a bit of our
    own code, and then calling the original function) and then change the pointer
    at `sys_call_table` to point to our function. Because we might be removed later
    and we don’t want to leave the system in an unstable state, it’s important for
    `cleanup_module` to restore the table to its original state.


    To modify the content of `sys_call_table`, we need to consider the control register.
    A control register is a processor register that changes or controls the general
    behavior of the CPU. For x86 architecture, the `cr0` register has various control
    flags that modify the basic operation of the processor. The WP flag in `cr0` stands
    for write protection. Once the WP flag is set, the processor disallows further
    write attempts to the read-only sections Therefore, we must disable the WP flag
    before modifying `sys_call_table`. Since Linux v5.3, the `write_cr0` function
    cannot be used because of the sensitive `cr0` bits pinned by the security issue,
    the attacker may write into CPU control registers to disable CPU protections like
    write protection. As a result, we have to provide the custom assembly routine
    to bypass it.


    However, `sys_call_table` symbol is unexported to prevent misuse. But there have
    few ways to get the symbol, manual symbol lookup and `kallsyms_lookup_name`. Here
    we use both depend on the kernel version.


    Because of the *control-flow integrity*, which is a technique to prevent the redirect
    execution code from the attacker, for making sure that the indirect calls go to
    the expected addresses and the return addresses are not changed. Since Linux v5.7,
    the kernel patched the series of *control-flow enforcement* (CET) for x86, and
    some configurations of GCC, like GCC versions 9 and 10 in Ubuntu Linux, will add
    with CET (the `-fcf-protection` option) in the kernel by default. Using that GCC
    to compile the kernel with retpoline off may result in CET being enabled in the
    kernel. You can use the following command to check out the `-fcf-protection` option
    is enabled or not:


    ```

    $ gcc -v -Q -O2 --help=target | grep protection

    Using built-in specs.

    COLLECT_GCC=gcc

    COLLECT_LTO_WRAPPER=/usr/lib/gcc/x86_64-linux-gnu/9/lto-wrapper

    ```'
