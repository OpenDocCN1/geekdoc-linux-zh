    # 15 Interrupt Handlers


    # 15.1 Interrupt Handlers


    Except for the last chapter, everything we did in the kernel so far we have done
    as a response to a process asking for it, either by dealing with a special file,
    sending an ioctl(), or issuing a system call. But the job of the kernel is not
    just to respond to process requests. Another job, which is every bit as important,
    is to speak to the hardware connected to the machine.


    There are two types of interaction between the CPU and the rest of the computer''s
    hardware. The first type is when the CPU gives orders to the hardware, the other
    is when the hardware needs to tell the CPU something. The second, called interrupts,
    is much harder to implement because it has to be dealt with when convenient for
    the hardware, not the CPU. Hardware devices typically have a very small amount
    of RAM, and if you do not read their information when available, it is lost.


    Under Linux, hardware interrupts are called IRQ''s (Interrupt ReRequests). There
    are two types of IRQ''s, short and long. A short IRQ is one which is expected
    to take a very short period of time, during which the rest of the machine will
    be blocked and no other interrupts will be handled. A long IRQ is one which can
    take longer, and during which other interrupts may occur (but not interrupts from
    the same device). If at all possible, it is better to declare an interrupt handler
    to be long.


    When the CPU receives an interrupt, it stops whatever it is doing (unless it is
    processing a more important interrupt, in which case it will deal with this one
    only when the more important one is done), saves certain parameters on the stack
    and calls the interrupt handler. This means that certain things are not allowed
    in the interrupt handler itself, because the system is in an unknown state. Linux
    kernel solves the problem by splitting interrupt handling into two parts. The
    first part executes right away and masks the interrupt line. Hardware interrupts
    must be handled quickly, and that is why we need the second part to handle the
    heavy work deferred from an interrupt handler. Historically, BH (Linux naming
    for Bottom Halves) statistically book-keeps the deferred functions. Softirq and
    its higher level abstraction, Tasklet, replace BH since Linux 2.3.


    The way to implement this is to call request_irq() to get your interrupt handler
    called when the relevant IRQ is received.


    In practice IRQ handling can be a bit more complex. Hardware is often designed
    in a way that chains two interrupt controllers, so that all the IRQs from'
