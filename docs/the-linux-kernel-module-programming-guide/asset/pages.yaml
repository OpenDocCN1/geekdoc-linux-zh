  md: '# 6.3 Registering A Device


    As discussed earlier, char devices are accessed through device files, usually
    located in /dev. This is by convention. When writing a driver, it is OK to put
    the device file in your current directory. Just make sure you place it in /dev
    for a production driver. The major number tells you which driver handles which
    device file. The minor number is used only by the driver itself to differentiate
    which device it is operating on, just in case the driver handles more than one
    device.


    Adding a driver to your system means registering it with the kernel. This is synonymous
    with assigning it a major number during the module''s initialization. You do this
    by using the register_chrdev function, defined by include/linux/fs.h.


    ```

    int register_chrdev(unsigned int major, const char *name, struct

    → file_operations *fops);

    ```


    Where unsigned int major is the major number you want to request, const char *name
    is the name of the device as it will appear in /proc/devices and struct file_operations
    *fops is a pointer to the file_operations table for your driver. A negative return
    value means the registration failed. Note that we didn''t pass the minor number
    to register_chrdev. That is because the kernel doesn''t care about the minor number;
    only our driver uses it.


    Now the question is, how do you get a major number without hijacking one that''s
    already in use? The easiest way would be to look through Documentation/admin-guide/devices.txt
    and pick an unused one. That is a bad way of doing things because you will never
    be sure if the number you picked will be assigned later. The answer is that you
    can ask the kernel to assign you a dynamic major number.


    If you pass a major number of 0 to register_chrdev, the return value will be the
    dynamically allocated major number. The downside is that you can not make a device
    file in advance, since you do not know what the major number will be. There are
    a couple of ways to do this. First, the driver itself can print the newly assigned
    number and we can make the device file by hand. Second, the newly registered device
    will have an entry in /proc/devices, and we can either make the device file by
    hand or write a shell script to read the file in and make the device file. The
    third method is that we can have our driver make the device file using the device_create
    function after a successful registration and device_destroy during the call to
    cleanup_module.


    However, register_chrdev() would occupy a range of minor numbers associated with
    the given major. The recommended way to reduce waste for char device registration
    is using cdev interface.


    The newer interface completes the char device registration in two distinct steps.
    First, we should register a range of device numbers, which can be completed with
    register_chrdev_region or alloc_chrdev_region.'
  merge: -1
