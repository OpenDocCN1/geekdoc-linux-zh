- pgno: 8
  md: "# 3 Examples\n\nAll the examples from this document are available within the\
    \ `examples` subdirectory.\nShould compile errors occur, it may be due to a more\
    \ recent kernel version being in use, or there might be a need to install the\
    \ corresponding kernel header files.\n\n# 4 Hello World\n\n# 4.1 The Simplest\
    \ Module\n\nMost individuals beginning their programming journey typically start\
    \ with some variant of a *hello world* example. It is unclear what the outcomes\
    \ are for those who deviate from this tradition, but it seems prudent to adhere\
    \ to it. The learning process will begin with a series of hello world programs\
    \ that illustrate various fundamental aspects of writing a kernel module.\n\n\
    Presented next is the simplest possible module.\nMake a test directory:\n\n```\n\
    ```bash\nmkdir -p ~/develop/kernel/hello-1\ncd ~/develop/kernel/hello-1\n```\n\
    ```\n\nPaste this into your favorite editor and save it as `hello-1.c`:\n\n```\n\
    ```c\n/*\n * hello-1.c - The simplest kernel module.\n */\n#include <linux/module.h>\
    \ /* Needed by all modules */\n#include <linux/printk.h>  /* Needed for pr_info()\
    \ */\n\nint init_module(void)\n{\n    pr_info(\"Hello world 1.\\n\");\n\n    /*\
    \ A non 0 return means init_module failed; module can't be loaded. */\n    return\
    \ 0;\n}\n\nvoid cleanup_module(void)\n{\n    pr_info(\"Goodbye world 1.\\n\");\n\
    }\n\nMODULE_LICENSE(\"GPL\");\n```\n```\n\nNow you will need a `Makefile`. If\
    \ you copy and paste this, change the indentation to use tabs, not spaces."
  merge: -1
  img_proc: true
- pgno: 9
  md: "```\nobj-m += hello-1.o\n\nPWD := $(CURDIR)\n\nall:\n\t$(MAKE) -C /lib/modules/$(shell\
    \ uname -r)/build M=$(PWD) modules\n\nclean:\n\t$(MAKE) -C /lib/modules/$(shell\
    \ uname -r)/build M=$(PWD) clean\n```\n\nIn Makefile, $(CURDIR) can set to the\
    \ absolute pathname of the current working directory(after all -C options are\
    \ processed, if any). See more about CURDIR in GNU make manual.\nAnd finally,\
    \ just run make directly.\n\n```\nmake\n```\n\nIf there is no PWD := $(CURDIR)\
    \ statement in Makefile, then it may not compile correctly with sudo make. Because\
    \ some environment variables are specified by the security policy, they can't\
    \ be inherited. The default security policy is sudoers. In the sudoers security\
    \ policy, env_reset is enabled by default, which restricts environment variables.\
    \ Specifically, path variables are not retained from the user environment, they\
    \ are set to default values (For more information see: sudoers manual). You can\
    \ see the environment variable settings by:\n\n```\n$ sudo -s\n# sudo -V\n```\n\
    \nHere is a simple Makefile as an example to demonstrate the problem mentioned\
    \ above.\n\n```\nall:\n\techo $(PWD)\n```\n\nThen, we can use -p flag to print\
    \ out the environment variable values from the Makefile.\n\n```\n$ make -p | grep\
    \ PWD\nPWD = /home/ubuntu/temp\nOLDPWD = /home/ubuntu\necho $(PWD)\n```\n\nThe\
    \ PWD variable won't be inherited with sudo."
  merge: -1
  img_proc: true
- pgno: 10
  md: '```

    $ sudo make -p | grep PWD

    echo $(PWD)

    ```


    However, there are three ways to solve this problem.


    +   1. You can use the -E flag to temporarily preserve them.


    ```

    $ sudo -E make -p | grep PWD

    PWD = /home/ubuntu/temp

    OLDPWD = /home/ubuntu

    echo $(PWD)

    ```


    +   2. You can set the env_reset disabled by editing the /etc/sudoers with root
    and visudo.


    ```

    ## sudoers file.

    ##

    ...

    Defaults env_reset

    ## Change env_reset to !env_reset in previous line to keep all

    → environment variables

    ```


    Then execute env and sudo env individually.


    ```

    # disable the env_reset

    echo "user:" > non-env_reset.log; env >>

    → non-env_reset.log

    echo "root:" >> non-env_reset.log; sudo env >>

    → non-env_reset.log

    # enable the env_reset

    echo "user:" > env_reset.log; env >> env_reset.log

    echo "root:" >> env_reset.log; sudo env >>

    → env_reset.log

    ```


    You can view and compare these logs to find differences between env_reset and
    !env_reset.


    +   3. You can preserve environment variables by appending them to env_keep in
    /etc/sudoers.


    ```

    Defaults env_keep += "PWD"

    ```'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'After applying the above change, you can check the environment variable settings
    by:


    ```

    $ sudo -s

    # sudo -V

    ```


    If all goes smoothly you should then find that you have a compiled hello-1.ko
    module. You can find info on it with the command:


    ```

    modinfo hello-1.ko

    ```


    At this point the command:


    ```

    lsmod | grep hello

    ```


    should return nothing. You can try loading your shiny new module with:


    ```

    sudo insmod hello-1.ko

    ```


    The dash character will get converted to an underscore, so when you again try:


    ```

    lsmod | grep hello

    ```


    You should now see your loaded module. It can be removed again with:


    ```

    sudo rmmod hello_1

    ```


    Notice that the dash was replaced by an underscore. To see what just happened
    in the logs:


    ```

    journalctl --since "1 hour ago" | grep kernel

    ```


    You now know the basics of creating, compiling, installing and removing modules.
    Now for more of a description of how this module works.


    Kernel modules must have at least two functions: a "start" (initialization) function
    called init_module() which is called when the module is insmoded into the kernel,
    and an "end" (cleanup) function called cleanup_module() which is called just before
    it is removed from the kernel. Actually, things have changed starting with kernel
    2.3.13. You can now use whatever name you like for the start and end functions
    of a module, and you will learn how to do this in Section 4.2.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'In fact, the new method is the preferred method. However, many people still
    use `init_module()` and `cleanup_module()` for their start and end functions.


    Typically, `init_module()` either registers a handler for something with the kernel,
    or it replaces one of the kernel functions with its own code (usually code to
    do something and then call the original function). The `cleanup_module()` function
    is supposed to undo whatever `init_module()` did, so the module can be unloaded
    safely.


    Lastly, every kernel module needs to include `<linux/module.h>`. We needed to
    include `<linux/printk.h>` only for the macro expansion for the `pr_alert()` log
    level, which you’ll learn about in Section 2.


    +   1. A point about coding style. Another thing which may not be immediately
    obvious to anyone getting started with kernel programming is that indentation
    within your code should be using **tabs** and **not spaces**. It is one of the
    coding conventions of the kernel. You may not like it, but you’ll need to get
    used to it if you ever submit a patch upstream.


    +   2. Introducing print macros. In the beginning there was `printk`, usually
    followed by a priority such as `KERN_INFO` or `KERN_DEBUG`. More recently this
    can also be expressed in abbreviated form using a set of print macros, such as
    `pr_info` and `pr_debug`. This just saves some mindless keyboard bashing and looks
    a bit neater. They can be found within `include/linux/printk.h`. Take time to
    read through the available priority macros.


    +   3. About Compiling. Kernel modules need to be compiled a bit differently from
    regular userspace apps. Former kernel versions required us to care much about
    these settings, which are usually stored in Makefiles. Although hierarchically
    organized, many redundant settings accumulated in sublevel Makefiles and made
    them large and rather difficult to maintain. Fortunately, there is a new way of
    doing these things, called kbuild, and the build process for external loadable
    modules is now fully integrated into the standard kernel build mechanism. To learn
    more on how to compile modules which are not part of the official kernel (such
    as all the examples you will find in this guide), see file `Documentation/kbuild/modules.rst`.
    Additional details about Makefiles for kernel modules are available in `Documentation/kbuild/makefiles.rst`.
    Be sure to read this and the related files before starting to hack Makefiles.
    It will probably save you lots of work.


    Here is another exercise for the reader. See that comment above the return statement
    in `init_module()`? Change the return value to something negative, recompile and
    load the module again. What happens?'
  merge: -1
  img_proc: true
- pgno: 13
  md: "# 4.2 Hello and Goodbye\n\nIn early kernel versions you had to use the init_module\
    \ and cleanup_module functions, as in the first hello world example, but these\
    \ days you can name those anything you want by using the module_init and module_exit\
    \ macros. These macros are defined in include/linux/module.h. The only requirement\
    \ is that your init and cleanup functions must be defined before calling the those\
    \ macros, otherwise you'll get compilation errors. Here is an example of this\
    \ technique:\n\n```\n/*\n * hello-2.c - Demonstrating the module_init() and module_exit()\
    \ macros.\n * This is preferred over using init_module() and cleanup_module().\n\
    \ */\n#include <linux/init.h> /* Needed for the macros */\n#include <linux/module.h>\
    \ /* Needed by all modules */\n#include <linux/printk.h> /* Needed for pr_info()\
    \ */\n\nstatic int __init hello_2_init(void)\n{\n    pr_info(\"Hello, world 2\\\
    n\");\n    return 0;\n}\n\nstatic void __exit hello_2_exit(void)\n{\n    pr_info(\"\
    Goodbye, world 2\\n\");\n}\n\nmodule_init(hello_2_init);\nmodule_exit(hello_2_exit);\n\
    \nMODULE_LICENSE(\"GPL\");\n```\n\nSo now we have two real kernel modules under\
    \ our belt. Adding another module is as simple as this:\n\n```\nobj-m += hello-1.o\n\
    obj-m += hello-2.o\n\nPWD := $(CURDIR)\n\nall:\n\t$(MAKE) -C /lib/modules/$(shell\
    \ uname -r)/build M=$(PWD) modules\n\nclean:\n\t$(MAKE) -C /lib/modules/$(shell\
    \ uname -r)/build M=$(PWD) clean\n```\n\nNow have a look at drivers/char/Makefile\
    \ for a real world example. As you can see, some things got hardwired into the\
    \ kernel (obj-y) but where have all those obj-m gone? Those familiar with shell\
    \ scripts will easily be able to spot them. For those who are not, the obj-$(CONFIG_FOO)\
    \ entries you see"
  merge: -1
  img_proc: true
