- pgno: 22
  md: '# 5 Preliminaries


    # 5.1 How modules begin and end


    A typical program starts with a main() function, executes a series of instructions,
    and terminates after completing these instructions. Kernel modules, however, follow
    a different pattern. A module always begins with either the init_module function
    or a function designated by the module_init call. This function acts as the module''s
    entry point, informing the kernel of the module''s functionalities and preparing
    the kernel to utilize the module''s functions when necessary. After performing
    these tasks, the entry function returns, and the module remains inactive until
    the kernel requires its code.


    All modules conclude by invoking either cleanup_module or a function specified
    through the module_exit call. This serves as the module''s exit function, reversing
    the actions of the entry function by unregistering the previously registered functionalities.


    It is mandatory for every module to have both an entry and an exit function. While
    there are multiple methods to define these functions, the terms "entry function"
    and "exit function" are generally used. However, they may occasionally be referred
    to as init_module and cleanup_module, which are understood to mean the same.


    # 5.2 Functions available to modules


    Programmers use functions they do not define all the time. A prime example of
    this is printf(). You use these library functions which are provided by the standard
    C library, libc. The definitions for these functions do not actually enter your
    program until the linking stage, which ensures that the code (for printf() for
    example) is available, and fixes the call instruction to point to that code.


    Kernel modules are different here, too. In the hello world example, you might
    have noticed that we used a function, pr_info() but did not include a standard
    I/O library. That is because modules are object files whose symbols get resolved
    upon running insmod or modprobe. The definition for the symbols comes from the
    kernel itself; the only external functions you can use are the ones provided by
    the kernel. If you''re curious about what symbols have been exported by your kernel,
    take a look at /proc/kallsyms.


    One point to keep in mind is the difference between library functions and system
    calls. Library functions are higher level, run completely in user space and provide
    a more convenient interface for the programmer to the functions that do the real
    work — system calls. System calls run in kernel mode on the user''s behalf and
    are provided by the kernel itself. The library function printf() may look like
    a very general printing function, but all it really does is format the data into
    strings and write the string data using the low-level system call write(), which
    then sends the data to standard output.


    Would you like to see what system calls are made by printf()? It is easy! Compile
    the following program:'
  merge: -1
  img_proc: true
- pgno: 23
  md: "```\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"hello\");\n    return\
    \ 0;\n}\n```\n\nwith gcc -Wall -o hello hello.c. Run the executable with strace\
    \ ./hello. Are you impressed? Every line you see corresponds to a system call.\
    \ strace is a handy program that gives you details about what system calls a program\
    \ is making, including which call is made, what its arguments are and what it\
    \ returns. It is an invaluable tool for figuring out things like what files a\
    \ program is trying to access. Towards the end, you will see a line which looks\
    \ like write(1, \"hello\", 5)hello). There it is. The face behind the printf()\
    \ mask. You may not be familiar with write, since most people use library functions\
    \ for file I/O (like fopen, fputs, fclose). If that is the case, try looking at\
    \ man 2 write. The 2nd man section is devoted to system calls (like kill() and\
    \ read()). The 3rd man section is devoted to library calls, which you would probably\
    \ be more familiar with (like cosh() and random()).\n\nYou can even write modules\
    \ to replace the kernel's system calls, which we will do shortly. Crackers often\
    \ make use of this sort of thing for backdoors or trojans, but you can write your\
    \ own modules to do more benign things, like have the kernel write Tee hee, that\
    \ tickles! every time someone tries to delete a file on your system.\n\n# 5.3\
    \ User Space vs Kernel Space\n\nThe kernel primarily manages access to resources,\
    \ be it a video card, hard drive, or memory. Programs frequently vie for the same\
    \ resources. For instance, as a document is saved, updatedb might commence updating\
    \ the locate database. Sessions in editors like vim and processes like updatedb\
    \ can simultaneously utilize the hard drive. The kernel's role is to maintain\
    \ order, ensuring that users do not access resources indiscriminately.\n\nTo manage\
    \ this, CPUs operate in different modes, each offering varying levels of system\
    \ control. The Intel 80386 architecture, for example, featured four such modes,\
    \ known as rings. Unix, however, utilizes only two of these rings: the highest\
    \ ring (ring 0, also known as \"supervisor mode\", where all actions are permissible)\
    \ and the lowest ring, referred to as \"user mode\".\n\nRecall the discussion\
    \ about library functions vs system calls. Typically, you use a library function\
    \ in user mode. The library function calls one or more system calls, and these\
    \ system calls execute on the library function's behalf, but do so in supervisor\
    \ mode since they are part of the kernel itself. Once the system call completes\
    \ its task, it returns and execution gets transferred back to user mode."
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 5.4 Name Space


    When you write a small C program, you use variables which are convenient and make
    sense to the reader. If, on the other hand, you are writing routines which will
    be part of a bigger problem, any global variables you have are part of a community
    of other peoples'' global variables; some of the variable names can clash. When
    a program has lots of global variables which aren''t meaningful enough to be distinguished,
    you get namespace pollution. In large projects, effort must be made to remember
    reserved names, and to find ways to develop a scheme for naming unique variable
    names and symbols.


    When writing kernel code, even the smallest module will be linked against the
    entire kernel, so this is definitely an issue. The best way to deal with this
    is to declare all your variables as static and to use a well-defined prefix for
    your symbols. By convention, all kernel prefixes are lowercase. If you do not
    want to declare everything as static, another option is to declare a symbol table
    and register it with the kernel. We will get to this later.


    The file /proc/kallsyms holds all the symbols that the kernel knows about and
    which are therefore accessible to your modules since they share the kernel''s
    codespace.


    # 5.5 Code space


    Memory management is a very complicated subject and the majority of O''Reilly''s
    Understanding The Linux Kernel exclusively covers memory management! We are not
    setting out to be experts on memory managements, but we do need to know a couple
    of facts to even begin worrying about writing real modules.


    If you have not thought about what a segfault really means, you may be surprised
    to hear that pointers do not actually point to memory locations. Not real ones,
    anyway. When a process is created, the kernel sets aside a portion of real physical
    memory and hands it to the process to use for its executing code, variables, stack,
    heap and other things which a computer scientist would know about. This memory
    begins with 0x0000000 and extends up to whatever it needs to be. Since the memory
    space for any two processes do not overlap, every process that can access a memory
    address, say 0xbffff978, would be accessing a different location in real physical
    memory. The processes would be accessing an index named 0xbffff978 which points
    to some kind of offset into the region of memory set aside for that particular
    process. For the most part, a process like our Hello, World program can''t access
    the space of another process, although there are ways which we will talk about
    later.


    The kernel has its own space of memory as well. Since a module is code which can
    be dynamically inserted and removed in the kernel (as opposed to a semi-autonomous
    object), it shares the kernel''s codespace rather than having its own. Therefore,
    if your module segfaults, the kernel segfaults. And if you start writing over
    data because of an off-by-one error, then you''re trampling on kernel data (or
    code). This is even worse than it sounds, so try your best to be careful.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'It should be noted that the aforementioned discussion applies to any operating
    system utilizing a monolithic kernel. This concept differs slightly from "building
    all your modules into the kernel", although the underlying principle is similar.
    In contrast, there are microkernels, where modules are allocated their own code
    space. Two notable examples of microkernels include the GNU Hurd and the Zircon
    kernel of Google''s Fuchsia.


    # 5.6 Device Drivers


    One class of module is the device driver, which provides functionality for hardware
    like a serial port. On Unix, each piece of hardware is represented by a file located
    in /dev named a device file which provides the means to communicate with the hardware.
    The device driver provides the communication on behalf of a user program. So the
    es1370.ko sound card device driver might connect the /dev/sound device file to
    the Ensoniq IS1370 sound card. A userspace program like mp3blaster can use /dev/sound
    without ever knowing what kind of sound card is installed.


    Let''s look at some device files. Here are device files which represent the first
    three partitions on the primary master IDE hard drive:


    ```

    $ ls -l /dev/hda[1-3]

    brw-rw---- 1 root disk 3, 1 Jul  5 2000 /dev/hda1

    brw-rw---- 1 root disk 3, 2 Jul  5 2000 /dev/hda2

    brw-rw---- 1 root disk 3, 3 Jul  5 2000 /dev/hda3

    ```


    Notice the column of numbers separated by a comma. The first number is called
    the device''s major number. The second number is the minor number. The major number
    tells you which driver is used to access the hardware. Each driver is assigned
    a unique major number; all device files with the same major number are controlled
    by the same driver. All the above major numbers are 3, because they''re all controlled
    by the same driver.


    The minor number is used by the driver to distinguish between the various hardware
    it controls. Returning to the example above, although all three devices are handled
    by the same driver they have unique minor numbers because the driver sees them
    as being different pieces of hardware.


    Devices are divided into two types: character devices and block devices. The difference
    is that block devices have a buffer for requests, so they can choose the best
    order in which to respond to the requests. This is important in the case of storage
    devices, where it is faster to read or write sectors which are close to each other,
    rather than those which are further apart. Another difference is that block devices
    can only accept input and return output in blocks (whose size can vary according
    to the device), whereas character devices are allowed to use as many or as few
    bytes as they like. Most devices in the world are character, because they don''t
    need this type of buffering, and they don''t operate with a fixed block size.
    You can tell whether a device file is for a block device or a character device
    by looking at the first character in the output of ls -l. If it'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'is ''b'' then it is a block device, and if it is ''c'' then it is a character
    device. The devices you see above are block devices. Here are some character devices
    (the serial ports):


    ```

    crw-rw---- 1 root dial 4, 64 Feb 18 23:34 /dev/ttyS0

    crw-r----- 1 root dial 4, 65 Nov 17 10:26 /dev/ttyS1

    crw-rw---- 1 root dial 4, 66 Jul 5 2000 /dev/ttyS2

    crw-rw---- 1 root dial 4, 67 Jul 5 2000 /dev/ttyS3

    ```


    If you want to see which major numbers have been assigned, you can look at Documentation/admin-guide/devices.txt.


    When the system was installed, all of those device files were created by the mknod
    command. To create a new char device named coffee with major/minor number 12 and
    2, simply do mknod /dev/coffee c 12 2. You do not have to put your device files
    into /dev, but it is done by convention. Linus put his device files in /dev, and
    so should you. However, when creating a device file for testing purposes, it is
    probably OK to place it in your working directory where you compile the kernel
    module. Just be sure to put it in the right place when you''re done writing the
    device driver.


    A few final points, although implicit in the previous discussion, are worth stating
    explicitly for clarity. When a device file is accessed, the kernel utilizes the
    file''s major number to identify the appropriate driver for handling the access.
    This indicates that the kernel does not necessarily rely on or need to be aware
    of the minor number. It is the driver that concerns itself with the minor number,
    using it to differentiate between various pieces of hardware.


    It is important to note that when referring to "hardware", the term is used in
    a slightly more abstract sense than just a physical PCI card that can be held
    in hand. Consider the following two device files:


    ```

    $ ls -l /dev/sda /dev/sdb

    brw-rw---- 1 root disk 8, 0 Jan 3 09:02 /dev/sda

    brw-rw---- 1 root disk 8, 16 Jan 3 09:02 /dev/sdb

    ```


    By now you can look at these two device files and know instantly that they are
    block devices and are handled by same driver (block major 8). Sometimes two device
    files with the same major but different minor number can actually represent the
    same piece of physical hardware. So just be aware that the word "hardware" in
    our discussion can mean something very abstract.


    # 6 Character Device drivers


    # 6.1 The file_operations Structure


    The file_operations structure is defined in include/linux/fs.h, and holds pointers
    to functions defined by the driver that perform various operations on the device.
    Each field of the structure corresponds to the address of some function defined
    by the driver to handle a requested operation.'
