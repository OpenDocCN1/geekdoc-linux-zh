- pgno: 7
  md: 'the information and warnings will be logged, but solely within the systemd
    journal. These logs will not be visible unless consulting the journalctl. Refer
    to 4 for more information. For instant access to this information, it is advisable
    to perform all tasks from the console.


    3. SecureBoot. Numerous modern computers arrive pre-configured with UEFI SecureBoot
    enabled—an essential security standard ensuring booting exclusively through trusted
    software endorsed by the original equipment manufacturer. Certain Linux distributions
    even ship with the default Linux kernel configured to support SecureBoot. In these
    cases, the kernel module necessitates a signed security key.


    Failing this, an attempt to insert your first "hello world" module would result
    in the message: "ERROR: could not insert module". If this message Lockdown: insmod:
    unsigned module loading is restricted; see man kernel lockdown.7 appears in the
    dmesg output, the simplest approach involves disabling UEFI SecureBoot from the
    boot menu of your PC or laptop, allowing the successful insertion of "hello world"
    module. Naturally, an alternative involves undergoing intricate procedures such
    as generating keys, system key installation, and module signing to achieve functionality.
    However, this intricate process is less appropriate for beginners. If interested,
    more detailed steps for SecureBoot can be explored and followed.


    # 2 Headers


    Before building anything, it is necessary to install the header files for the
    kernel.


    On Ubuntu/Debian GNU/Linux:


    ```

    sudo apt-get update

    apt-cache search linux-headers-`uname -r`

    ```


    The following command provides information on the available kernel header files.
    Then for example:


    ```

    sudo apt-get install kmod linux-headers-5.4.0-80-generic

    ```


    On Arch Linux:


    ```

    sudo pacman -S linux-headers

    ```


    On Fedora:


    ```

    sudo dnf install kernel-devel kernel-headers

    ```'
