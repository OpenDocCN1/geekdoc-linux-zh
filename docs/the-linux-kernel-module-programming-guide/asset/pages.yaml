  md: "# 13 Replacing Print Macros\n\n# 13.1 Replacement\n\nIn Section 1.7, it was\
    \ noted that the X Window System and kernel module programming are not conducive\
    \ to integration. This remains valid during the development of kernel modules.\
    \ However, in practical scenarios, the necessity emerges to relay messages to\
    \ the tty (teletype) originating the module load command.\n\nThe term \"tty\"\
    \ originates from teletype, which initially referred to a combined keyboard-printer\
    \ for Unix system communication. Today, it signifies a text stream abstraction\
    \ employed by Unix programs, encompassing physical terminals, xterms in X displays,\
    \ and network connections like SSH.\n\nTo achieve this, the \"current\" pointer\
    \ is leveraged to access the active task's tty structure. Within this structure\
    \ lies a pointer to a string write function, facilitating the string's transmission\
    \ to the tty.\n\n```\n/*\n * print_string.c - Send output to the tty we're running\
    \ on, regardless if\n * it is through X11, telnet, etc. We do this by printing\
    \ the string to the\n * tty associated with the current task.\n */\n#include <linux/init.h>\n\
    #include <linux/kernel.h>\n#include <linux/module.h>\n#include <linux/sched.h>\
    \ /* For current */\n#include <linux/tty.h> /* For the tty declarations */\n\n\
    static void print_string(char *str)\n{\n    /* The tty for the current task */\n\
    \    struct tty_struct *my_tty = get_current_tty();\n\n    /* If my_tty is NULL,\
    \ the current task has no tty you can print to (i.e.,\n     * if it is a daemon).\
    \ If so, there is nothing we can do.\n     */\n    if (my_tty) {\n        const\
    \ struct tty_operations *ttyops = my_tty->driver->ops;\n        /* my_tty->driver\
    \ is a struct which holds the tty's functions,\n         * one of which (write)\
    \ is used to write strings to the tty.\n         * It can be used to take a string\
    \ either from the user's or\n         * kernel's memory segment.\n         *\n\
    \         * The function's 1st parameter is the tty to write to, because the\n\
    \         * same function would normally be used for all tty's of a certain\n\
    \         * type.\n         * The 2nd parameter is a pointer to a string.\n  \
    \       * The 3rd parameter is the length of the string.\n         *\n       \
    \  * As you will see below, sometimes it's necessary to use\n         * preprocessor\
    \ stuff to create code that works for different\n         * kernel versions. The\
    \ (naive) approach we've taken here does not\n         * scale well. The right\
    \ way to deal with this is described in\n         * section 2 of\n```"
  merge: -1
