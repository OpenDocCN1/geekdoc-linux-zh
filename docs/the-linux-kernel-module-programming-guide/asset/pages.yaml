    # 10 System Calls


    So far, the only thing we''ve done was to use well defined kernel mechanisms to
    register /proc files and device handlers. This is fine if you want to do something
    the kernel programmers thought you''d want, such as write a device driver. But
    what if you want to do something unusual, to change the behavior of the system
    in some way? Then, you are mostly on your own.


    Should one choose not to use a virtual machine, kernel programming can become
    risky. For example, while writing the code below, the open() system call was inadvertently
    disrupted. This resulted in an inability to open any files, run programs, or shut
    down the system, necessitating a restart of the virtual machine. Fortunately,
    no critical files were lost in this instance. However, if such modifications were
    made on a live, mission-critical system, the consequences could be severe. To
    mitigate the risk of file loss, even in a test environment, it is advised to execute
    sync right before using insmod and rmmod.


    Forget about /proc files, forget about device files. They are just minor details.
    Minutiae in the vast expanse of the universe. The real process to kernel communication
    mechanism, the one used by all processes, is system calls. When a process requests
    a service from the kernel (such as opening a file, forking to a new process, or
    requesting more memory), this is the mechanism used. If you want to change the
    behaviour of the kernel in interesting ways, this is the place to do it. By the
    way, if you want to see which system calls a program uses, run strace <arguments>.


    In general, a process is not supposed to be able to access the kernel. It can
    not access kernel memory and it can''t call kernel functions. The hardware of
    the CPU enforces this (that is the reason why it is called "protected mode" or
    "page protection").


    System calls are an exception to this general rule. What happens is that the process
    fills the registers with the appropriate values and then calls a special instruction
    which jumps to a previously defined location in the kernel (of course, that location
    is readable by user processes, it is not writable by them). Under'
