- pgno: 15
  md: "# 4.4 Licensing and Module Documentation\n\nHonestly, who loads or even cares\
    \ about proprietary modules? If you do then you might have seen something like\
    \ this:\n\n```\n$ sudo insmod xxxxx.ko\nloading out-of-tree module taints kernel.\n\
    module license 'unspecified' taints kernel.\n```\n\nYou can use a few macros to\
    \ indicate the license for your module. Some examples are \"GPL\", \"GPL v2\"\
    , \"GPL and additional rights\", \"Dual BSD/GPL\", \"Dual MIT/GPL\", \"Dual MPL/GPL\"\
    \ and \"Proprietary\". They are defined within include/linux/module.h.\n\nTo reference\
    \ what license you're using a macro is available called MODULE_LICENSE. This and\
    \ a few other macros describing the module are illustrated in the below example.\n\
    \n```\n/*\n * hello-4.c - Demonstrates module documentation.\n */\n#include <linux/init.h>\
    \ /* Needed for the macros */\n#include <linux/module.h> /* Needed by all modules\
    \ */\n#include <linux/printk.h> /* Needed for pr_info() */\n\nMODULE_LICENSE(\"\
    GPL\");\nMODULE_AUTHOR(\"LKMPC\");\nMODULE_DESCRIPTION(\"A sample driver\");\n\
    \nstatic int __init init_hello_4(void)\n{\n    pr_info(\"Hello, world 4\\n\");\n\
    \    return 0;\n}\n\nstatic void __exit cleanup_hello_4(void)\n{\n    pr_info(\"\
    Goodbye, world 4\\n\");\n}\n\nmodule_init(init_hello_4);\nmodule_exit(cleanup_hello_4);\n\
    ```\n\n# 4.5 Passing Command Line Arguments to a Module\n\nModules can take command\
    \ line arguments, but not with the argc/argv you might be used to.\n\nTo allow\
    \ arguments to be passed to your module, declare the variables that will take\
    \ the values of the command line arguments as global and then use the module_param()\
    \ macro, (defined in include/linux/moduleparam.h) to set the mechanism up. At\
    \ runtime, insmod will fill the variables with any command line"
  merge: -1
