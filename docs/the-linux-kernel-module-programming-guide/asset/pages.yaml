    int register_chrdev_region(dev_t from, unsigned count, const char *name);

    int alloc_chrdev_region(dev_t *dev, unsigned baseminor, unsigned count, const
    char *name);

    ```


    The choice between two different functions depends on whether you know the major
    numbers for your device. Using register_chrdev_region if you know the device major
    number and alloc_chrdev_region if you would like to allocate a dynamically-allocated
    major number.


    Second, we should initialize the data structure struct cdev for our char device
    and associate it with the device numbers. To initialize the struct cdev, we can
    achieve by the similar sequence of the following codes.


    ```

    struct cdev *my_dev = cdev_alloc();

    my_cdev->ops = &my_fops;

    ```


    However, the common usage pattern will embed the struct cdev within a device-specific
    structure of your own. In this case, we''ll need cdev_init for the initialization.


    ```

    void cdev_init(struct cdev *cdev, const struct file_operations *fops);

    ```


    Once we finish the initialization, we can add the char device to the system by
    using the cdev_add.


    ```

    int cdev_add(struct cdev *p, dev_t dev, unsigned count);

    ```


    To find an example using the interface, you can see ioctl.c described in section
    9.


    # 6.4 Unregistering A Device


    We can not allow the kernel module to be rmmod''ed whenever root feels like it.
    If the device file is opened by a process and then we remove the kernel module,
    using the file would cause a call to the memory location where the appropriate
    function (read/write) used to be. If we are lucky, no other code was loaded there,
    and we''ll get an ugly error message. If we are unlucky, another kernel module
    was loaded into the same location, which means a jump into the middle of another
    function within the kernel. The results of this would be impossible to predict,
    but they can not be very positive.


    Normally, when you do not want to allow something, you return an error code (a
    negative number) from the function which is supposed to do it. With cleanup_module
    that''s impossible because it is a void function. However, there is a counter
    which keeps track of how many processes are using your module.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'You can see what its value is by looking at the 3rd field with the command
    cat /proc/modules or lsmod. If this number isn''t zero, rmmod will fail. Note
    that you do not have to check the counter within cleanup_module because the check
    will be performed for you by the system call sys_delete_module, defined in include/linux/syscalls.h.
    You should not use this counter directly, but there are functions defined in include/linux/module.h
    which let you increase, decrease and display this counter:


    +   - try_module_get(THIS_MODULE): Increment the reference count of current module.

    +   - module_put(THIS_MODULE): Decrement the reference count of current module.

    +   - module_refcount(THIS_MODULE): Return the value of reference count of current
    module.


    It is important to keep the counter accurate; if you ever do lose track of the
    correct usage count, you will never be able to unload the module; it''s now reboot
    time, boys and girls. This is bound to happen to you sooner or later during a
    module''s development.


    # 6.5 chardev.c


    The next code sample creates a char driver named chardev. You can dump its device
    file.


    ```

    cat /proc/devices

    ```


    (or open the file with a program) and the driver will put the number of times
    the device file has been read from into the file. We do not support writing to
    the file (like echo "hi" > /dev/hello), but catch these attempts and tell the
    user that the operation is not supported. Don''t worry if you don''t see what
    we do with the data we read into the buffer; we don''t do much with it. We simply
    read in the data and print a message acknowledging that we received it.


    In the multiple-threaded environment, without any protection, concurrent access
    to the same memory may lead to the race condition, and will not preserve the performance.
    In the kernel module, this problem may happen due to multiple instances accessing
    the shared resources. Therefore, a solution is to enforce the exclusive access.
    We use atomic Compare-And-Swap (CAS) to maintain the states, CDEV_NOT_USED and
    CDEV_EXCLUSIVE_OPEN, to determine whether the file is currently opened by someone
    or not. CAS compares the contents of a memory location with the expected value
    and, only if they are the same, modifies the contents of that memory location
    to the desired value. See more concurrency details in the 12 section.'
  merge: -1
  img_proc: true
