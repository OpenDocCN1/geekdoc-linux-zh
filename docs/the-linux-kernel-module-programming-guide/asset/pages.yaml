  md: "# 11.2 Completions\n\nSometimes one thing should happen before another within\
    \ a module having multiple threads. Rather than using /bin/sleep commands, the\
    \ kernel has another way to do this which allows timeouts or interrupts to also\
    \ happen.\n\nCompletions as code synchronization mechanism have three main parts,\
    \ initialization of struct completion synchronization object, the waiting or barrier\
    \ part through wait_for_completion(), and the signalling side through a call to\
    \ complete().\n\nIn the subsequent example, two threads are initiated: crank and\
    \ flywheel. It is imperative that the crank thread starts before the flywheel\
    \ thread. A completion state is established for each of these threads, with a\
    \ distinct completion defined for both the crank and flywheel threads. At the\
    \ exit point of each thread the respective completion state is updated, and wait_for_completion\
    \ is used by the flywheel thread to ensure that it does not begin prematurely.\
    \ The crank thread uses the complete_all() function to update the completion,\
    \ which lets the flywheel thread continue.\n\nSo even though flywheel_thread is\
    \ started first you should notice when you load this module and run dmesg, that\
    \ turning the crank always happens first because the flywheel thread waits for\
    \ the crank thread to complete.\n\nThere are other variations of the wait_for_completion\
    \ function, which include timeouts or being interrupted, but this basic mechanism\
    \ is enough for many common situations without adding a lot of complexity.\n\n\
    ```\n/*\n * completions.c\n */\n#include <linux/completion.h>\n#include <linux/err.h>\
    \ /* for IS_ERR() */\n#include <linux/init.h>\n#include <linux/kthread.h>\n#include\
    \ <linux/module.h>\n#include <linux/printk.h>\n#include <linux/version.h>\n\n\
    static struct completion crank_comp;\nstatic struct completion flywheel_comp;\n\
    \nstatic int machine_crank_thread(void *arg)\n{\n    pr_info(\"Turn the crank\\\
    n\");\n    complete_all(&crank_comp);\n#if LINUX_VERSION_CODE >= KERNEL_VERSION(5,\
    \ 17, 0)\n    kthread_complete_and_exit(&crank_comp, 0);\n#else\n    complete_and_exit(&crank_comp,\
    \ 0);\n#endif\n}\n\nstatic int machine_flywheel_spinup_thread(void *arg)\n{\n\
    ```"
