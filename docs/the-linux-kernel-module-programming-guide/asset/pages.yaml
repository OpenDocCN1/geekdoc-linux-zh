  md: "```\nMODULE_LICENSE(\"GPL\");\n```\n\nIf you want more information, you can\
    \ read this web page:\n\n+   - https://lvm.net/Articles/22355/\n+   - https://kernelnewbies.org/Documents/SeqFileHowTo\n\
    \nYou can also read the code of fs/seq_file.c in the linux kernel.\n\n# 8 sysfs:\
    \ Interacting with your module\n\nsysfs allows you to interact with the running\
    \ kernel from userspace by reading or setting variables inside of modules. This\
    \ can be useful for debugging purposes, or just as an interface for applications\
    \ or scripts. You can find sysfs directories and files under the /sys directory\
    \ on your system.\n\n```\nls -l /sys\n```\n\nAttributes can be exported for kobjects\
    \ in the form of regular files in the filesystem. Sysfs forwards file I/O operations\
    \ to methods defined for the attributes, providing a means to read and write kernel\
    \ attributes.\n\nAn attribute definition in simply:\n\n```\nstruct attribute {\n\
    \    char *name;\n    struct module *owner;\n    umode_t mode;\n};\n\nint sysfs_create_file(struct\
    \ kobject *kobj, const struct attribute *attr);\nvoid sysfs_remove_file(struct\
    \ kobject *kobj, const struct attribute *attr);\n```\n\nFor example, the driver\
    \ model defines struct device_attribute like:\n\n```\nstruct device_attribute\
    \ {\n    struct attribute attr;\n    ssize_t (*show)(struct device *dev, struct\
    \ device_attribute *attr,\n        char *buf);\n    ssize_t (*store)(struct device\
    \ *dev, struct device_attribute *attr,\n        const char *buf, size_t count);\n\
    };\n\nint device_create_file(struct device *, const struct device_attribute *);\n\
    void device_remove_file(struct device *, const struct device_attribute *);\n```"
