  md: "the system call with B_openat, which will call what it thinks is the original\
    \ system call, A_openat, when it's done.\n\nNow, if B is removed first, everything\
    \ will be well — it will simply restore the system call to A_openat, which calls\
    \ the original. However, if A is removed and then B is removed, the system will\
    \ crash. A's removal will restore the system call to the original, sys_openat,\
    \ cutting B out of the loop. Then, when B is removed, it will restore the system\
    \ call to what it thinks is the original, A_openat, which is no longer in memory.\
    \ At first glance, it appears we could solve this particular problem by checking\
    \ if the system call is equal to our open function and if so not changing it at\
    \ all (so that B won't change the system call when it is removed), but that will\
    \ cause an even worse problem. When A is removed, it sees that the system call\
    \ was changed to B_openat so that it is no longer pointing to A_openat, so it\
    \ will not restore it to sys_openat before it is removed from memory. Unfortunately,\
    \ B_openat will still try to call A_openat which is no longer there, so that even\
    \ without removing B the system would crash.\n\nFor x86 architecture, the system\
    \ call table cannot be used to invoke a system call after commit 1e3ad78 since\
    \ v6.9. This commit has been backported to long term stable kernels, like v5.15.154+,\
