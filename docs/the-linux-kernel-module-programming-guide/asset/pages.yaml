  md: "```\nmodule_exit(procfs2_exit);\nMODULE_LICENSE(\"GPL\");\n```\n\n# 7.3 Manage\
    \ /proc file with standard filesystem\n\nWe have seen how to read and write a\
    \ /proc file with the /proc interface. But it is also possible to manage /proc\
    \ file with inodes. The main concern is to use advanced functions, like permissions.\n\
    \nIn Linux, there is a standard mechanism for file system registration. Since\
    \ every file system has to have its own functions to handle inode and file operations,\
    \ there is a special structure to hold pointers to all those functions, struct\
    \ inode_operations, which includes a pointer to struct proc_ops.\n\nThe difference\
    \ between file and inode operations is that file operations deal with the file\
    \ itself whereas inode operations deal with ways of referencing the file, such\
    \ as creating links to it.\n\nIn /proc, whenever we register a new file, we're\
    \ allowed to specify which struct inode_operations will be used to access to it.\
    \ This is the mechanism we use, a struct inode_operations which includes a pointer\
    \ to a struct proc_ops which includes pointers to our procfs_read and procfs_write\
    \ functions.\n\nAnother interesting point here is the module_permission function.\
    \ This function is called whenever a process tries to do something with the /proc\
    \ file, and it can decide whether to allow access or not. Right now it is only\
    \ based on the operation and the uid of the current user (as available in current,\
    \ a pointer to a structure which includes information on the currently running\
    \ process), but it could be based on anything we like, such as what other processes\
    \ are doing with the same file, the time of day, or the last input we received.\n\
    \nIt is important to note that the standard roles of read and write are reversed\
    \ in the kernel. Read functions are used for output, whereas write functions are\
    \ used for input. The reason for that is that read and write refer to the user's\
    \ point of view — if a process reads something from the kernel, then the kernel\
    \ needs to output it, and if a process writes something to the kernel, then the\
    \ kernel receives it as input.\n\n```\n/*\n * procfs3.c\n */\n\n#include <linux/kernel.h>\n\
    #include <linux/module.h>\n#include <linux/proc_fs.h>\n#include <linux/sched.h>\n\
    #include <linux/uaccess.h>\n#include <linux/version.h>\n#if LINUX_VERSION_CODE\
    \ >= KERNEL_VERSION(5, 10, 0)\n#include <linux/minmax.h>\n#endif\n```"
