    If none of the examples in this chapter fit your debugging needs, there might
    yet be some other tricks to try. Ever wondered what CONFIG_LL_DEBUG in make menuconfig
    is good for? If you activate that you get low level access to the serial port.
    While this might not sound very powerful by itself, you can patch kernel/printk.c
    or any other essential syscall to print ASCII characters, thus making it possible
    to trace virtually everything what your code does over a serial line. If you find
    yourself porting the kernel to some new and former unsupported architecture, this
    is usually amongst the first things that should be implemented. Logging over a
    netconsole might also be worth a try.


    While you have seen lots of stuff that can be used to aid debugging here, there
    are some things to be aware of. Debugging is almost always intrusive. Adding debug
    code can change the situation enough to make the bug seem to disappear. Thus,
    you should keep debug code to a minimum and make sure it does not show up in production
    code.


    # 14 Scheduling Tasks


    There are two main ways of running tasks: tasklets and work queues. Tasklets are
    a quick and easy way of scheduling a single function to be run. For example, when
    triggered from an interrupt, whereas work queues are more complicated but also
    better suited to running multiple things in a sequence.


    It is possible that in future tasklets may be replaced by threaded irqs. However,
    discussion about that has been ongoing since 2007 (Eliminating tasklets), so do
    not hold your breath. See the section 15.1 if you wish to avoid the tasklet debate.'
