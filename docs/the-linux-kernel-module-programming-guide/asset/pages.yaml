    Usage of other parameters are the same as request_irq().


    Presence of both handlers is not mandatory. If either of them is not needed, pass
    the NULL instead. A NULL top-half handler implies that no action is taken except
    to wake up the bottom-half serving thread, which runs the bottom-half handler.
    Similarly, a NULL bottom-half handler effectively acts as if request_irq() were
    used. In fact, this is how request_irq() is implemented.


    Note that passing NULL to both handlers is considered an error and will make registration
    fail.


    # 16 Virtual Input Device Driver


    The input device driver is a module that provides a way to communicate with the
    interaction device via the event. For example, the keyboard can send the press
    or release event to tell the kernel what we want to do. The input device driver
    will allocate a new input structure with input_allocate_device() and sets up input
    bitfields, device id, version, etc. After that, registers it by calling input_register_device().


    Here is an example, vinput, It is an API to allow easy development of virtual
    input drivers. The drivers needs to export a vinput_device() that contains the
    virtual device name and vinput_ops structure that describes:


    +   - the init function: init()

    +   - the input event injection function: send()

    +   - the readback function: read()


    Then using vinput_register_device() and vinput_unregister_device() will add a
    new device to the list of support virtual input devices.


    ```

    int init(struct vinput *);

    ```


    This function is passed a struct vinput already initialized with an allocated
    struct input_dev. The init() function is responsible for initializing the capabilities
    of the input device and register it.


    ```

    int send(struct vinput *, char *, int);

    ```


    This function will receive a user string to interpret and inject the event using
    the input_report_XXX or input_event call. The string is already copied from user.


    ```

    int read(struct vinput *, char *, int);

    ```'
