  md: "# 12 Avoiding Collisions and Deadlocks\n\nIf processes running on different\
    \ CPUs or in different threads try to access the same memory, then it is possible\
    \ that strange things can happen or your system can lock up. To avoid this, various\
    \ types of mutual exclusion kernel functions are available. These indicate if\
    \ a section of code is \"locked\" or \"unlocked\" so that simultaneous attempts\
    \ to run it can not happen.\n\n# 12.1 Mutex\n\nYou can use kernel mutexes (mutual\
    \ exclusions) in much the same manner that you might deploy them in userland.\
    \ This may be all that is needed to avoid collisions in most cases.\n\n```\n```c\n\
    /*\n * example_mutex.c\n */\n#include <linux/module.h>\n#include <linux/mutex.h>\n\
    #include <linux/printk.h>\n\nstatic DEFINE_MUTEX(mymutex);\n\nstatic int __init\
    \ example_mutex_init(void)\n{\n        int ret;\n\n        pr_info(\"example_mutex\
    \ init\\n\");\n\n        ret = mutex_trylock(&mymutex);\n        if (ret != 0)\
    \ {\n                pr_info(\"mutex is locked\\n\");\n\n                if (mutex_is_locked(&mymutex)\
    \ == 0)\n                        pr_info(\"The mutex failed to lock!\\n\");\n\n\
    \                mutex_unlock(&mymutex);\n                pr_info(\"Mutex is unlocked\\\
    n\");\n        } else\n                pr_info(\"Failed to lock\\n\");\n\n   \
    \     return 0;\n}\n\nstatic void __exit example_mutex_exit(void)\n{\n       \
    \ pr_info(\"example_mutex exit\\n\");\n}\n\nmodule_init(example_mutex_init);\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 80
  md: "```\nmodule_exit(example_mutex_exit);\nMODULE_DESCRIPTION(\"Mutex example\"\
    );\nMODULE_LICENSE(\"GPL\");\n```\n\n# 12.2 Spinlocks\n\nAs the name suggests,\
    \ spinlocks lock up the CPU that the code is running on, taking 100% of its resources.\
    \ Because of this you should only use the spinlock mechanism around code which\
    \ is likely to take no more than a few milliseconds to run and so will not noticeably\
    \ slow anything down from the user's point of view.\n\nThe example here is \"\
    irq safe\" in that if interrupts happen during the lock then they will not be\
    \ forgotten and will activate when the unlock happens, using the flags variable\
    \ to retain their state.\n\n```\n/*\n * example_spinlock.c\n */\n#include <linux/init.h>\n\
    #include <linux/module.h>\n#include <linux/printk.h>\n#include <linux/spinlock.h>\n\
    \nstatic DEFINE_SPINLOCK(sl_static);\nstatic spinlock_t sl_dynamic;\n\nstatic\
    \ void example_spinlock_static(void)\n{\n    unsigned long flags;\n\n    spin_lock_irqsave(&sl_static,\
    \ flags);\n    pr_info(\"Locked static spinlock\\n\");\n\n    /* Do something\
    \ or other safely. Because this uses 100% CPU time, this\n     * code should take\
    \ no more than a few milliseconds to run.\n     */\n\n    spin_unlock_irqrestore(&sl_static,\
    \ flags);\n    pr_info(\"Unlocked static spinlock\\n\");\n}\n\nstatic void example_spinlock_dynamic(void)\n\
    {\n    unsigned long flags;\n\n    spin_lock_init(&sl_dynamic);\n    spin_lock_irqsave(&sl_dynamic,\
    \ flags);\n    pr_info(\"Locked dynamic spinlock\\n\");\n\n    /* Do something\
    \ or other safely. Because this uses 100% CPU time, this\n     * code should take\
    \ no more than a few milliseconds to run.\n     */\n```"
  merge: -1
  img_proc: true
- pgno: 81
  md: "```\nspin_unlock_irqrestore(&sl_dynamic, flags);\npr_info(\"Unlocked dynamic\
    \ spinlock\\n\");\n}\nstatic int __init example_spinlock_init(void)\n{\n    pr_info(\"\
    example spinlock started\\n\");\n    example_spinlock_static();\n    example_spinlock_dynamic();\n\
    \    return 0;\n}\nstatic void __exit example_spinlock_exit(void)\n{\n    pr_info(\"\
    example spinlock exit\\n\");\n}\nmodule_init(example_spinlock_init);\nmodule_exit(example_spinlock_exit);\n\
    MODULE_DESCRIPTION(\"Spinlock example\");\nMODULE_LICENSE(\"GPL\");\n```\n\nTaking\
    \ 100% of a CPU’s resources comes with greater responsibility. Situations where\
    \ the kernel code monopolizes a CPU are called atomic contexts. Holding a spinlock\
    \ is one of those situations. Sleeping in atomic contexts may leave the system\
    \ hanging, as the occupied CPU devotes 100% of its resources doing nothing but\
    \ sleeping. In some worse cases the system may crash. Thus, sleeping in atomic\
    \ contexts is considered a bug in the kernel. They are sometimes called “sleep-in-atomic-context”\
    \ in some materials.\n\nNote that sleeping here is not limited to calling the\
    \ sleep functions explicitly. If subsequent function calls eventually invoke a\
    \ function that sleeps, it is also considered sleeping. Thus, it is important\
    \ to pay attention to functions being used in atomic context. There’s no documentation\
    \ recording all such functions, but code comments may help. Sometimes you may\
    \ find comments in kernel source code stating that a function “may sleep”, “might\
    \ sleep”, or more explicitly “the caller should not hold a spinlock”. Those comments\
    \ are hints that a function may implicitly sleep and must not be called in atomic\
    \ contexts.\n\n# 12.3 Read and write locks\n\nRead and write locks are specialised\
    \ kinds of spinlocks so that you can exclusively read from something or write\
    \ to something. Like the earlier spinlocks example, the one below shows an \"\
    irq safe\" situation in which if other functions were triggered from irqs which\
    \ might also read and write to whatever you are concerned with then they would\
    \ not disrupt the logic. As before it is a good idea to keep anything done within\
    \ the lock as short as possible so that it does"
  merge: -1
  img_proc: true
- pgno: 82
  md: "not hang up the system and cause users to start revolting against the tyranny\
    \ of your module.\n\n```\n/*\n * example_rwlock.c\n */\n#include <linux/module.h>\n\
    #include <linux/printk.h>\n#include <linux/rwlock.h>\n\nstatic DEFINE_RWLOCK(myrwlock);\n\
    \nstatic void example_read_lock(void)\n{\n    unsigned long flags;\n\n    read_lock_irqsave(&myrwlock,\
    \ flags);\n    pr_info(\"Read Locked\\n\");\n\n    /* Read from something */\n\
    \n    read_unlock_irqrestore(&myrwlock, flags);\n    pr_info(\"Read Unlocked\\\
    n\");\n}\n\nstatic void example_write_lock(void)\n{\n    unsigned long flags;\n\
    \n    write_lock_irqsave(&myrwlock, flags);\n    pr_info(\"Write Locked\\n\");\n\
    \n    /* Write to something */\n\n    write_unlock_irqrestore(&myrwlock, flags);\n\
    \    pr_info(\"Write Unlocked\\n\");\n}\n\nstatic int __init example_rwlock_init(void)\n\
    {\n    pr_info(\"example_rwlock started\\n\");\n\n    example_read_lock();\n \
    \   example_write_lock();\n\n    return 0;\n}\n\nstatic void __exit example_rwlock_exit(void)\n\
    {\n    pr_info(\"example_rwlock exit\\n\");\n}\n\nmodule_init(example_rwlock_init);\n\
    module_exit(example_rwlock_exit);\n\nMODULE_DESCRIPTION(\"Read/Write locks example\"\
    );\n```"
