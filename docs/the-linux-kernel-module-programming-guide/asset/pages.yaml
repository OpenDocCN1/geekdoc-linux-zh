  md: '# 19.2  Disabling interrupts


    You might need to do this for a short time and that is OK, but if you do not enable
    them afterwards, your system will be stuck and you will have to power it off.


    # 20  Where To Go From Here?


    For those deeply interested in kernel programming, [kernelnewbies.org](https://kernelnewbies.org)
    and the Documentation subdirectory within the kernel source code are highly recommended.
    Although the latter may not always be straightforward, it serves as a valuable
    initial step for further exploration. Echoing Linus Torvalds’ perspective, the
    most effective method to understand the kernel is through personal examination
    of the source code.


    Contributions to this guide are welcome, especially if there are any significant
    inaccuracies identified. To contribute or report an issue, please initiate an
    issue at https://github.com/sysprog21/lkmpg. Pull requests are greatly appreciated.


    Happy hacking!'
