  md: "# 18.2 Static keys\n\nStatic keys allow us to enable or disable kernel code\
    \ paths based on the runtime state of key. Its APIs have been available since\
    \ 2010 (most architectures are already supported), use self-modifying code to\
    \ eliminate the overhead of cache and branch prediction. The most typical use\
    \ case of static keys is for performance-sensitive kernel code, such as tracepoints,\
    \ context switching, networking, etc. These hot paths of the kernel often contain\
    \ branches and can be optimized easily using this technique. Before we can use\
    \ static keys in the kernel, we need to make sure that gcc supports asm goto inline\
    \ assembly, and the following kernel configurations are set:\n\n```\nCONFIG_JUMP_LABEL=y\n\
    CONFIG_HAVE_ARCH_JUMP_LABEL=y\nCONFIG_ARCH_JUMP_LABEL_RELATIVE=y\n```\n\nTo declare\
    \ a static key, we need to define a global variable using the DEFINE_STATIC_KEY_FALSE\
    \ or DEFINE_STATIC_KEY_TRUE macro defined in include/linux/jump_label.h. This\
    \ macro initializes the key with the given initial value, which is either false\
    \ or true, respectively. For example, to declare a static key with an initial\
    \ value of false, we can use the following code:\n\n```\nDEFINE_STATIC_KEY_FALSE(fkey);\n\
    ```\n\nOnce the static key has been declared, we need to add branching code to\
    \ the module that uses the static key. For example, the code includes a fastpath,\
    \ where a no-op instruction will be generated at compile time as the key is initialized\
    \ to false and the branch is unlikely to be taken.\n\n```\npr_info(\"fastpath\
    \ 1\\n\");\nif (static_branch_unlikely(&fkey))\n    pr_alert(\"do unlikely thing\\\
    n\");\npr_info(\"fastpath 2\\n\");\n```\n\nIf the key is enabled at runtime by\
    \ calling static_branch_enable(&fkey), the fastpath will be patched with an unconditional\
    \ jump instruction to the slowpath code pr_alert, so the branch will always be\
    \ taken until the key is disabled again.\n\nThe following kernel module derived\
    \ from chardev.c, demonstrates how the static key works.\n\n```\n/*\n * static_key.c\n\
    \ */\n\n#include <linux/atomic.h>\n#include <linux/device.h>\n```"
