  md: "Example tasklet init continues...  \nExample tasklet ends\n\nAlthough tasklet\
    \ is easy to use, it comes with several drawbacks and developers are discussing\
    \ about getting rid of tasklet in linux kernel. The tasklet callback runs in atomic\
    \ context, inside a software interrupt, meaning that it cannot sleep or access\
    \ user-space data, so not all work can be done in a tasklet handler. Also, the\
    \ kernel only allows one instance of any given tasklet to be running at any given\
    \ time; multiple different tasklet callbacks can run in parallel.\n\nIn recent\
    \ kernels, tasklets can be replaced by workqueues, timers, or threaded interrupts.[^1]\
    \ While the removal of tasklets remains a longer-term goal, the current kernel\
    \ contains more than a hundred uses of tasklets. Now developers are proceeding\
    \ with the API changes and the macro DECLARE_TASKLET_OLD exists for compatibility.\
    \ For further information, see https://lwn.net/Articles/830964/.\n\n# 14.2  Work\
    \ queues\n\nTo add a task to the scheduler we can use a workqueue. The kernel\
    \ then uses the Completely Fair Scheduler (CFS) to execute work within the queue.\n\
    \n```\n/*\n * sched.c\n */\n#include <linux/init.h>\n#include <linux/module.h>\n\
    #include <linux/workqueue.h>\n\nstatic struct workqueue_struct *queue = NULL;\n\
    static struct work_struct work;\n\nstatic void work_handler(struct work_struct\
    \ *data)\n{\n    pr_info(\"work handler function.\\n\");\n}\n\nstatic int __init\
    \ sched_init(void)\n{\n    queue = alloc_workqueue(\"HELLOWORLD\", WQ_UNBOUND,\
    \ 1);\n    INIT_WORK(&work, work_handler);\n    queue_work(queue, &work);\n  \
    \  return 0;\n}\n\nstatic void __exit sched_exit(void)\n{\n    destroy_workqueue(queue);\n\
    }\n```\n\n> [^1]: The goal of threaded interrupts is to push more of the work\
    \ to separate threads, so that the minimum needed for acknowledging an interrupt\
    \ is reduced, and therefore the time spent handling the interrupt (where it can't\
    \ handle any other interrupts at the same time) is reduced. See https://lwn.net/Articles/302043/."
