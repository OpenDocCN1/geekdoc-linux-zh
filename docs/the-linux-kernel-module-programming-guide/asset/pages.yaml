  md: '# 11 Blocking Processes and threads


    # 11.1 Sleep


    What do you do when somebody asks you for something you can not do right away?
    If you are a human being and you are bothered by a human being, the only thing
    you can say is: "Not right now, I''m busy. Go away!". But if you are a kernel
    module and you are bothered by a process, you have another possibility. You can
    put the process to sleep until you can service it. After all, processes are being
    put to sleep by the kernel and woken up all the time (that is the way multiple
    processes appear to run on the same time on a single CPU).


    This kernel module is an example of this. The file (called /proc/sleep) can only
    be opened by a single process at a time. If the file is already open, the kernel
    module calls wait_event_interruptible. The easiest way to keep a file open is
    to open it with:


    ```

    tail -f

    ```


    This function changes the status of the task (a task is the kernel data structure
    which holds information about a process and the system call it is in, if any)
    to TASK_INTERRUPTIBLE, which means that the task will not run until it is woken
    up somehow, and adds it to WaitQ, the queue of tasks waiting to access the file.
    Then, the function calls the scheduler to context switch to a different process,
    one which has some use for the CPU.


    When a process is done with the file, it closes it, and module_close is called.
    That function wakes up all the processes in the queue (there''s no mechanism to
    only wake up one of them). It then returns and the process which just closed the
    file can continue to run. In time, the scheduler decides that that process has
    had enough and gives control of the CPU to another process. Eventually, one of
    the processes which was in the queue will be given control of the CPU by the scheduler.
    It starts at the point right after the call to wait_event_interruptible.


    This means that the process is still in kernel mode - as far as the process is
    concerned, it issued the open system call and the system call has not returned
    yet. The process does not know somebody else used the CPU for most of the time
    between the moment it issued the call and the moment it returned.


    It can then proceed to set a global variable to tell all the other processes that
    the file is still open and go on with its life. When the other processes get a
    piece of the CPU, they''ll see that global variable and go back to sleep.


    So we will use tail -f to keep the file open in the background, while trying to
    access it with another process (again in the background, so that we need not switch
    to a different vt). As soon as the first background process is killed with kill
    %1, the second is woken up, is able to access the file and finally terminates.


    To make our life more interesting, module_close does not have a monopoly on waking
    up the processes which wait to access the file. A signal, such as Ctrl +c (SIGINT)
    can also wake up a process. This is because we used'
