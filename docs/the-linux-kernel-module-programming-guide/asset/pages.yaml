- pgno: 47
  md: "To read or write attributes, show() or store() method must be specified when\
    \ declaring the attribute. For the common cases include/linux/sysfs.h provides\
    \ convenience macros (__ATTR, __ATTR_RO, __ATTR_WO, etc.) to make defining attributes\
    \ easier as well as making code more concise and readable.\n\nAn example of a\
    \ hello world module which includes the creation of a variable accessible via\
    \ sysfs is given below.\n\n```\n/*\n * hello-sysfs.c sysfs example\n */\n#include\
    \ <linux/fs.h>\n#include <linux/init.h>\n#include <linux/kobject.h>\n#include\
    \ <linux/module.h>\n#include <linux/string.h>\n#include <linux/sysfs.h>\n\nstatic\
    \ struct kobject *my_module;\n\n/* the variable you want to be able to change\
    \ */\nstatic int myvariable = 0;\n\nstatic ssize_t myvariable_show(struct kobject\
    \ *kobj,\n                                struct kobj_attribute *attr, char *buf)\n\
    {\n    return sprintf(buf, \"%d\\n\", myvariable);\n}\n\nstatic ssize_t myvariable_store(struct\
    \ kobject *kobj,\n                                struct kobj_attribute *attr,\
    \ const char *buf,\n                                size_t count)\n{\n    sscanf(buf,\
    \ \"%d\", &myvariable);\n    return count;\n}\n\nstatic struct kobj_attribute\
    \ myvariable_attribute =\n    __ATTR(myvariable, 0660, myvariable_show, myvariable_store);\n\
    \nstatic int __init mymodule_init(void)\n{\n    int error = 0;\n\n    pr_info(\"\
    module: initialized\\n\");\n\n    mymodule = kobject_create_and_add(\"mymodule\"\
    , kernel_kobj);\n    if (!mymodule)\n        return -ENOMEM;\n\n    error = sysfs_create_file(mymodule,\
    \ &myvariable_attribute.attr);\n    if (error) {\n        kobject_put(mymodule);\n\
    \        pr_info(\"failed to create the myvariable file \"\n                \"\
    in /sys/kernel/mymodule\\n\");\n    }\n```"
