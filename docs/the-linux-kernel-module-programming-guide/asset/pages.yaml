    \ which you do not explicitly assign will be initialized to NULL by gcc.\n\nAn\
    \ instance of struct file_operations containing pointers to functions that are\
    \ used to implement read, write, open, ... system calls is commonly named fops.\n\
    \nSince Linux v3.14, the read, write and seek operations are guaranteed for thread-safe\
    \ by using the f_pos specific lock, which makes the file position update to become\
    \ the mutual exclusion. So, we can safely implement those operations without unnecessary\
