  md: '# 6.6 Writing Modules for Multiple Kernel Versions


    The system calls, which are the major interface the kernel shows to the processes,
    generally stay the same across versions. A new system call may be added, but usually
    the old ones will behave exactly like they used to. This is necessary for backward
    compatibility – a new kernel version is not supposed to break regular processes.
    In most cases, the device files will also remain the same. On the other hand,
    the internal interfaces within the kernel can and do change between versions.


    There are differences between different kernel versions, and if you want to support
    multiple kernel versions, you will find yourself having to code conditional compilation
    directives. The way to do this to compare the macro LINUX_VERSION_CODE to the
    macro KERNEL_VERSION. In version a.b.c of the kernel, the value of this macro
    would be 2^16 a + 2^8 b + c.


    # 7 The /proc File System


    In Linux, there is an additional mechanism for the kernel and kernel modules to
    send information to processes — the /proc file system. Originally designed to
    allow easy access to information about processes (hence the name), it is now used
    by every bit of the kernel which has something interesting to report, such as
    /proc/modules which provides the list of modules and /proc/meminfo which gathers
    memory usage statistics.


    The method to use the proc file system is very similar to the one used with device
    drivers — a structure is created with all the information needed for the /proc
    file, including pointers to any handler functions (in our case there is only one,
    the one called when somebody attempts to read from the /proc file). Then, init_module
    registers the structure with the kernel and cleanup_module unregisters it.


    Normal file systems are located on a disk, rather than just in memory (which is
    where /proc is), and in that case the index-node (inode for short) number is a
    pointer to a disk location where the file''s inode is located. The inode contains
    information about the file, for example the file''s permissions, together with
    a pointer to the disk location or locations where the file''s data can be found.


    Because we don''t get called when the file is opened or closed, there''s nowhere
    for us to put try_module_get and module_put in this module, and if the file is
    opened and then the module is removed, there''s no way to avoid the consequences.


    Here a simple example showing how to use a /proc file. This is the HelloWorld
    for the /proc filesystem. There are three parts: create the file /proc/helloworld
    in the function init_module, return a value (and a buffer) when the file /proc/helloworld
    is read in the callback function procfile_read, and delete the file /proc/helloworld
    in the function cleanup_module.


    The /proc/helloworld is created when the module is loaded with the function proc_create.
    The return value is a pointer to struct proc_dir_entry,'
