- pgno: 161
  md: '# **Characteristics and Concepts**


    Before you can start using the file-handling interfaces, you need to understand
    the concepts and core features underneath the idea of a file. This section discusses
    these ideas and notions in some detail before proceeding to real programming.


    As stated, most Linux resources can be accessed as files. As a result, there are
    many different kinds of files. A partial list of the kinds of files present on
    a Linux system includes the following:


    +   - Regular files

    +   - Unnamed and named pipes

    +   - Directories

    +   - Devices

    +   - Symbolic links

    +   - Sockets


    *Regular files* are called disk files and are defined as data storage units that
    allow random access. They are *byte-oriented*, meaning that the basic unit used
    to read from and write to them is a single byte, which also corresponds to a single
    character. Of course, you can and usually will read or write multiple bytes, but
    the fundamental unit is still a single character or byte.


    A *pipe* (discussed at greater length in Chapter 15, "Pipes and FIFOs") is just
    what the name implies—a data channel that receives data in one end and transmits
    it on the other. One end is written and the other is read. There are two types
    of pipes: named and unnamed. *Unnamed pipes* are so called because they never
    appear on a system''s hard drive with a name, such as `/home/kwall/somefile`.
    Instead, unnamed pipes are created and destroyed in memory (strictly speaking,
    in the kernel) on an as-needed basis. Moreover, as you will see in the section
    "The File-Handling Interface" later in this chapter, unnamed pipes are referred
    to only by numbers, never by a filename. Nevertheless, you use the same interface
    to read and write to unnamed pipes as you use to read and write regular disk-based
    files.


    Unnamed pipes are usually created as the result of a shell command line like the
    one shown here:


    ![](img/be588b36b489136ce784030a08a1d3d4_161_0.png)


    # **Example**


    ```

    $ cat /etc/passwd | cut -f1 -d: | head -5

    ```'
