    # ### Defining a Signal Handler


    In some cases, a signal’s default action is the desired behavior. In others, probably
    most, you want to alter that behavior, or perform additional tasks. In these cases,
    you have to define and install a custom signal handler to override the default
    action.


    Consider the case of a parent process that spawns several children. When the children
    terminate, the parent receives the SIGCHLD signal. To keep track of its children
    and monitor their exit status, the parent can either call `wait` immediately after
    spawning each child, or, more efficiently, establish a signal handler that calls
    `wait` (or `waitpid`) each time it receives SIGCHLD.


    POSIX defines a set of functions for creating and manipulating signals. The general
    procedure is to create a signal set, set the signals you want to catch, register
    a signal handler with the kernel, and wait to catch the signal.


    # ### The Signal Handling API


    To create, set, and query a signal set, use the following five functions, all
    defined in `<signal.h>`:


    +   - `int sigemptyset(sigset_t *set);`

    +   - `int sigfillset(sigset_t *set);`

    +   - `int sigaddset(sigset_t *set, int signum);`

    +   - `int sigdelset(sigset_t *set, int signum);`

    +   - `int sigismember(const sigset_t *set, int signum);`


    `set` is a signal set of type `sigset_t`, as explained at the beginning of the
    chapter. `sigemptyset` initializes signal set `set` so that all signals are excluded
    from the set. `sigfillset`, conversely, initializes `set` so that all signals
    are included. `sigaddset` adds the signal `signum` to `set`. `sigdelset` removes
    `signum` from `set`.


    These four functions return 0 on success or -1 if an error occurs. `sigismember`,
    finally, tests whether `signum` is in `set`, returning 1 (true) if it is or 0
    (false) if it is not.'
