    SIGABRT is generated by the abort function discussed in Chapter 4. SIGALRM and
    SIGVTALRM are generated when timers set using the alarm and setitimer calls, respectively,
    expire. The alarm call is discussed later in this chapter in the section, "Setting
    an Alarm." SIGBUS does not actually occur on Linux systems—when a process attempts
    to use misaligned memory, the kernel fixes the alignment problem and continues
    rather than generate SIGBUS. SIGCHLD is sent to a parent process when a child
    terminates or stops, allowing the parent to call one of the wait functions to
    reap the exit status.


    • The wait functions are discussed in detail in "Waiting on Processes," page 84.


    SIGHUP occurs when a session leader terminates or when a controlling terminal
    is closed. SIGFPE is sent for any arithmetic exception, such as overflows, underflows,
    or division by zero. SIGILL is another hardware exception, the execution of an
    illegal instruction. SIGINT causes all processes in the foreground process group
    to terminate because the user typed a keyboard interrupt, usually Ctrl+C.


    SIGQUIT, similarly, is generated when the quit character, usually Ctrl+\, is signaled
    from the keyboard. Another keyboard signal, Ctrl+Z, generates SIGSTP. SIGKILL
    and SIGTERM are generated by the kill function. Note that SIGKILL cannot be caught
    or ignored—this arrangement allows the superuser an unambiguous method to kill
    a misbehaving process.


    SIGSTOP stops a process and, like SIGKILL, cannot be caught or ignored. However,
    unlike SIGKILL, SIGSTOP merely stops a running process. It can be restarted by
    sending it SIGCONT. Alas, there is no SIGRESURRECT for killed processes. SIGTIN
    and SIGTTOU occur when a background process attempts to read input from or write
    output to its controlling terminal. When a terminal window changes size, all foreground
