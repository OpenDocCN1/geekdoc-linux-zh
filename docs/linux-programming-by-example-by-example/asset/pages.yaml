    ```


    As you can see from the output, the child’s PPID (the parent process ID) is the
    same as the parent’s PID, 1149. The output also illustrates a critical point regarding
    *fork*''s usage: You cannot predict whether a parent will execute before or after
    its child. This can be seen in the strange appearance of the output. The first
    line of output comes from the parent, the second through fourth lines from the
    child, and the fifth and sixth from the parent again. It has executed out of order;
    that is, *asynchronously*.


    The asynchronous nature of *fork*''s behavior means that you should not execute
    code in the child that depends on the execution of code in the parent, or vice
    versa. Doing so creates a potential *race condition*, which occurs when multiple
    processes want to use a shared resource but doing so depends on the order in which
    the processes execute. Race conditions can be hard to catch because the code that
    creates them works “most of the time.” The potential impact of a race condition
    is hard to predict, but their symptoms might include unpredictable program behavior,
    an apparent system hang, slow system response on an otherwise lightly loaded system,
    or outright system crashes.


    A *fork* call may fail because there are too many processes already running on
    the system or because the UID attempting to fork has exceeded the number of processes
    it is permitted to execute. If it fails, *fork* returns -1 to the parent process
    and does not create a child. The sample program guards against this possibility
    by checking *fork*''s return value. The check also enables the program to determine
    whether it is in the child or the parent process.'
