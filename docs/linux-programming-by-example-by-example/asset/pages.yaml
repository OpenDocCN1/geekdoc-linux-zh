- pgno: 415
  md: 'sa_family describes the type of address stored, and sa_data contains the actual
    address data. sa_family is typically one of the values listed in Table 18.1.


    # Table 18.1: Socket Address Families


    | Address Family | Protocol Family | Description |

    |---|---|---|

    | AF_UNIX | PF_UNIX | UNIX domain sockets |

    | AF_INET | PF_INET | TCP/IP (Version 4) |

    | AF_AX25 | PF_AX25 | The AX.25 amateur radio protocol |

    | AF_IPX | PF_IPX | The Novell IPX protocol |

    | AF_APPLETALK | PF_APPLETALK | The AppleTalk DDS protocol |


    > **NOTE**

    > The complete list of supported protocol and address families is listed in <sys/socket.h>.


    # ## Socket Basics


    The basic socket operations involve creating, opening, closing, reading, and writing
    them. Thanks to Linux''s delightful habit of treating everything like a file,
    you can use the same I/O functions on sockets that you use on regular files.


    > For a brief discussion of Linux''s file abstraction, see "Characteristics and
    Concepts," page 132.


    The I/O functions (read, write, and so on) have unique semantics when applied
    to sockets, which this chapter covers, but the interface is identical otherwise.
    All socket functions require the inclusion of <sys/socket.h> and the header file
    appropriate to each protocol.


    # ### Creating a Socket


    The only unique basic socket operation is the socket function, which creates a
    socket. Its prototype follows:


    ```

    ```c

    int socket(int domain, int type, int protocol);

    ```

    ```


    The socket call creates one of at least two sockets used to establish a communications
    channel between two processes or systems that want to exchange data. domain specifies
    which network protocol to use. It will be one of the protocol families from the
    second column of Table 18.1. type'
  merge: -1
  img_proc: true
- pgno: 416
  md: 'establishes the category of the protocol, such as a streaming protocol or a
    datagram protocol. Not all classes of communication are available for all protocol
    families.


    `protocol` indicates the default protocol to be used, based on the given `domain`
    (protocol family) and `type` (streaming, datagram, and so on). For the purposes
    of this book, this argument’s value is always 0, indicating the default protocol.
    The list of currently supported types is given in Table 18.2, but only `SOCK_STREAM`
    is discussed in this chapter.


    # *Table 18.2: Berkeley Socket Types*


    | **Socket Type** | **Description** |

    |---|---|

    | `SOCK_STREAM` | Supports connection-oriented, sequenced, error-controlled, full
    duplex byte streams. |

    | `SOCK_DGRAM` | Supports connectionless, unsequenced, packet-oriented messages
    that have a fixed size. |

    | `SOCK_SEQPACKET` | Supports sequenced, full duplex, connection-oriented transmissions
    of packets, but the receiver of the packet must read an entire packet with a single
    read system call. |

    | `SOCK_RAW` | Is designed to provide low-level, protocol-level access. Code must
    be written to process data according to protocol specifications. Not for the faint-of-heart!
    |

    | `SOCK_RDM` | Supports a connection-oriented transmission of packets, but the
    data is not guaranteed to be ordered. |


    If the socket is created successfully, `socket` returns a valid file descriptor
    to use in subsequent I/O operations. Otherwise, it returns -1 and sets `errno`’s
    value to indicate the problem. Possible error values include the following:


    +   *   `EACCES`—The calling process lacks permissions to create the requested
    socket. This occurs if the process does not have sufficient directory permissions
    or if user-level processes (as opposed to root processes) are not permitted to
    create a socket of the indicated `type` or `protocol`.

    +       *   `EINVAL`—This error occurs because the calling process requested an
    unknown protocol or because the kernel does not support the protocol family specified
    in `domain`. This is often the result of a typo.

    +       *   `EMFILE`—Generated when the process file table is full and no more
    process can be created. This error indicates a heavily loaded system.

    +       *   `ENFILE`—The kernel lacks sufficient memory to create the necessary
    supporting structures to support another socket. `ENFILE` usually indicates a
    serious problem with the system.'
  merge: -1
  img_proc: true
- pgno: 417
  md: '+   • ENOBUFS or ENOMEM—The system (not the kernel) does not have enough memory
    to create the structure requested. Although not as serious as ENFILE, the system
    is usually in bad shape when this error occurs.


    +   • EPROTONOSUPPORT—The protocol family specified in domain does not support
    either the type or the protocol (or both) requested.


    # ### Connecting to a Socket


    Even though a socket has been created, it is useless without open connections
    to it. Moreover, the connection process is different for server processes and
    client processes. Server processes are processes that receive a request for information,
    data, or to grant to the requester some sort of access to a capability or facility.
    Accordingly, server processes generally create a socket and then wait for connection
    requests from clients or requesters. Client processes, likewise, ask the server
    to provide information or data via the socket, or send a request, again through
    the socket, for access to some service the server provides.


    A server, then, has more work to do than a client. First, having created a socket,
    it must bind to it, which creates an association between the socket and an address.
    In the case of UNIX domain sockets, this address is simply a pathname and filename
    (as detailed in the next section). In the case of a normal TCP/IP socket, the
    address is a standard Internet address (discussed in the section, “TCP/IP Programming,”
    later in this chapter).


    After binding the address, a server must listen for a connection, meaning that
    it must wait for a client to request a connection to the socket. Upon receiving
    the connection request, the server ordinarily then accepts the request; that is,
    it formally opens the connection for the requesting client and starts exchanging
    information with it through the socket. The function calls for each of the server’s
    tasks are intuitively named bind, listen, and accept.


    The client, on the other hand, merely needs to request a connection to the socket
    the server has opened. Equally intuitively, the client uses the connect system
    call to request a connection to the socket in which it is interested. Figure 18.2
    illustrates the process of creating and connecting to a socket for both a client
    and a server.


    As you can see in Figure 18.2, the server controls the client’s access to the
    socket through the accept call. There is no requirement that the server must accept
    a client’s connection request.


    The four calls for connecting to a socket are prototyped as follows:


    ```

    int bind(int sockfd, struct sockaddr *addr, int addrlen);

    int listen(int sockfd, int backlog);

    ```'
