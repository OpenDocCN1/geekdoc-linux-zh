- pgno: 243
  md: 'cursor creates a cursor named cursorp that references the database db cursorp
    is, like the handle returned by db_open, a database handle, except that it is
    used only for cursor-related operations. As usual, txnid should be NULL. flags
    must always be 0. cursor returns the standard DB error codes discussed at the
    beginning of the chapter.


    Cursoring through a database, as well as obtaining the record to which the cursor
    is pointing, is done using the c_get call, which is prototyped as follows:


    ```

    DBCursor->c_get(DBC *cursor, DBT *key, DBT *data, u_int32_t flags);

    ```


    c_get retrieves a key/value pair key/data from the database using the cursor cursor,
    which must have been initialized by an earlier call to DB->cursor. Common flags
    for c_get are listed in Table 10.1.


    # Table 10.1: Common Flags for c_get


    | Flag | Meaning |

    |:-----|:--------|

    | DB_FIRST | Return the first record from the database |

    | DB_LAST | Return the last record from the database |

    | DB_NEXT | Return the next record from the database (or the first one, if the
    cursor has just been opened) |

    | DB_NEXT_DUP | Return the next record that is a duplicate of the current one
    |

    | DB_PREV | Return the previous record from the database |

    | DB_CURRENT | Return the current record from the database |

    | DB_SET | Return the record from the database that matches the supplied key |

    | DB_SET_RANGE | Return the smallest record greater than or equal to the supplied
    key |


    You can also use cursors to add key/value pairs to a database via the c_put function.
    Its prototype is as follows:


    ```

    DBCursor->c_put(DBC *cursor, DBT *key, DBT *data, u_int32_t flags)

    ```


    c_put stores the key/value pair referenced by key and value, respectively, in
    the database at the location pointed to by cursor. The exact behavior of c_put
    is controlled by flags, which may be one of DB_AFTER, which adds the record immediately
    after the current one, DB_BEFORE, which adds the record immediately before the
    current one, or DB_CURRENT, which replaces the current record. flags can also
    be DB_KEYFIRST or DB_KEYLAST to create the first or last of a set of duplicate
    keys, if the database has been configured to allow duplicates. Configuring a database
    to permit duplicate keys is an advanced topic beyond the scope of this book.'
  merge: -1
  img_proc: true
- pgno: 244
  md: "As you might expect, the `c_del` call deletes the current record. Its prototype\
    \ is as follows:\n\n```\nDBCursor->c_del(DBC *cursor, u_int32_t flags);\n```\n\
    \n`c_del` deletes the current record from the database, returning the standard\
    \ error codes or `DB_KEYEMPTY` if the record has already been deleted.\n\nAfter\
    \ you have completed all cursor operations, but before you close the database\
    \ itself, use `c_close` to discard the cursor. It has the following prototype:\n\
    \n```\nDBCursor->c_close(DBC *cursor);\n```\n\nAfter `c_close` has been called,\
    \ you cannot use the handle again.\n\n# ## Syncing a Database\n\nWhen a database\
    \ is closed, all the data held in memory is automatically flushed to disk. While\
    \ working the database, you may also want to flush incore memory to disk. The\
    \ call for this purpose is `sync` and it is prototyped as follows:\n\n```\nint\
    \ DB->sync(DB *db, u_int32_t flags);\n```\n\n`db` is a database handle returned\
    \ by a previous call to `db_open`. `flags` is currently unused and must be set\
    \ to 0.\n\nWhy use `sync`? Suppose you have added and deleted a large number of\
    \ records. On a heavily loaded system, you should call `sync` periodically to\
    \ make sure that your database is written to disk to prevent data loss. Flushing\
    \ the cached data to disk is also an excellent way to prevent data loss or database\
    \ corruption in the unlikely event of a system crash or sudden power loss. Similarly,\
    \ if your program has installed a signal handler for `SIGTERM`, you should call\
    \ `sync` (and probably `db_close`) to flush the database to disk.\n\n# ### Example\n\
    \n![](img/be588b36b489136ce784030a08a1d3d4_244_0.png)\n\n# ### Example\n\nThis\
    \ program, `cursor.c`, illustrates simple cursor operations as well as the process\
    \ of using the `sync` call.\n\n```\n```\n/*\n * cursor.c - Using a cursor in a\
    \ Berkeley DB database\n */\n#include <stdlib.h>\n#include <stdio.h>\n#include\
    \ <errno.h>\n#include <string.h>\n#include \"db.h\"\n```\n```"
