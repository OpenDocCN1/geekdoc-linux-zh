- pgno: 221
  md: '# # 9—

    ## Daemons


    In this chapter, you learn how to create a *daemon*, pronounced like *demon*.
    Daemons are background processes that run non-interactively. They usually provide
    some service, either for the system as a whole or for user programs. In particular,
    this chapter covers the following:


    +   * The characteristics of daemons

    +   * The rules for creating daemons

    +   * The function calls to use when programming a daemon

    +   * How to use the syslog facility

    +   * How daemons should handle runtime errors'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Understanding Daemons


    Typically, daemons are started at boot time and, unless forcibly terminated, run
    until system shutdown. They also lack a controlling terminal, so any output they
    create must be handled specially.


    Daemons also have a few characteristics that distinguish them from ordinary programs
    like `ls` and `cat`. To begin with, they almost always run with superuser privilege
    because they provide system services to user mode programs. They do not have a
    controlling terminal because they are non-interactive; that is, they run without
    user input. Daemons generally are process-group and session leaders. They often
    serve as the process in their process group and session. Finally, a daemon''s
    parent is the `init` process, which has a PID of 1. This is because its real parent
    process has `forked` and `exited` before the child, hence they are orphan processes
    inherited by `init`.


    +   • Controlling terminals and session leaders are discussed in "Sessions," page
    76.


    +   • Process groups and process leaders the subject of "Process Groups," page
    76.


    # Creating a Daemon


    To create a daemon program, you must follow a few simple rules and call several
    functions, all of which you have seen in previous chapters. Error handling, however,
    presents special difficulties for a daemon and requires the program to use the
    system logging facility, `syslog`, to send messages to the system log (often the
    file `/var/log/messages`). This topic is covered in "Handling Errors," later in
    this chapter.


    There are a few simple steps to follow to create a daemon that both works properly
    and plays nice with the system.


    First, `fork` and make the parent exit. Like most programs, daemons are started
    from a shell script or the command line. However, daemons are unlike application
    programs because they are not interactive—they run in the background and, as a
    result, do not have a controlling terminal. The parent `forks` and exits as the
    first step toward getting rid of the controlling terminal. If you think about
    it for a minute, this makes perfect sense. Daemons neither read from standard
    input nor write to standard output or standard error, so they do not need a terminal
    interface at all, except to get them started.


    The second step is to create a new session using the `setsid` call. Calling `setsid`
    dissociates the process from any terminal. In other words, this causes the child
    not to have a controlling terminal. The program continues to execute, of course.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'The next step is to make the root directory the process''s current working
    directory. This is necessary because any process whose current directory is on
    a mounted filesystem will prevent that filesystem from being unmounted. Ordinarily,
    this is desirable behavior, but, if the system must go to single-user mode for
    some reason, a daemon process running on a mounted filesystem becomes, at best,
    a nuisance for the supervisor (because she must find the troublesome process and
    kill it), or, in an emergency situation, a real threat to system integrity (because
    it prevents a filesystem on a disk gone bad from being unmounted). Making / a
    daemon''s working directory is a safe way to avoid both of these possibilities.


    Set the umask to 0. This step is necessary to prevent the daemon''s inherited
    umask from interfering with the creation of files and directories. Consider the
    following scenario: A daemon inherits a umask of 055, which masks out read and
    execute permissions for group and other. If the daemon then proceeds to create
    a file, for example a data file, the created file will be readable, writable,
    and executable by the user, but only writable by group and other. Resetting the
    daemon''s umask to 0 prevents such a situation. It also gives the daemon greater
    flexibility when creating files because, with a umask of 0, the daemon process
    can set precisely the permissions that are required rather than settle for system
    defaults.


    Finally, close any file descriptors that the child inherited but does not need.
    This is simply a common-sense step. There is no reason for a child to keep open
    descriptors inherited from the parent. The list of potential file descriptors
    to close includes at least stdin, stdout, and stderr. Other open file descriptors,
    such as those that refer to configuration or data files, might also need to be
    closed. This step depends on the needs and requirements of the daemon in question,
    so it is difficult to state this rule more precisely.


    # Function Calls


    To meet the requirements of the first item, call fork to spawn a child process
    and have the parent process call exit. To eliminate the controlling terminal,
    create a new session by calling setsid, which is declared in <unistd.h> and formatted
    as follows:


    ```

    pid_t setsid(void);

    ```


    setsid creates a new session and a new process group. The daemon will then be
    the session leader of the new session and the process group leader of the new
    process group. The setsid call also guarantees that the new session will not have
    a controlling terminal. If the calling process is already a process group leader,
    however, the setsid call will fail. setsid returns the new session ID (SID) on
    success. On error, it returns -1 and sets errno.'
  merge: -1
  img_proc: true
