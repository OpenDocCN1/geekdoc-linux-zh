- pgno: 116
  md: '# *Waiting on Processes*


    After you `fork` or `exec` a new process, the parent process should wait for it
    to terminate in order to collect its exit status and prevent the creation of zombies.
    As with `exec`, you have a variety of functions to use. To prevent utter confusion,
    however, this section focuses only on the `wait` and `waitpid` functions.


    What is a zombie? A *zombie process* is a child process that terminates before
    the parent has a chance to collect its exit status with `wait` or `waitpid`. A
    parent *collects* a child process''s exit status by using one of the `wait` functions
    to retrieve the exit status from the kernel''s process table. A process is called
    a zombie because it is dead but still present in the process table. The child
    has exited and memory and other resources allocated to it have been freed, but
    it still occupies a slot in the kernel''s process table. The kernel maintains
    the child''s exit status until the parent harvests it.


    One or two zombies are not a problem, but if a program `forks` and `execs` constantly
    and fails to collect exit statuses, the process table eventually fills up, which
    hampers performance and makes a system reboot necessary—not a desirable situation
    in a mission-critical production environment!


    An *orphan process*, on the other hand, is a child process whose parent terminates
    before calling `wait` or `waitpid`. In this case, the `init` process becomes the
    child''s parent and collects the exit status, thereby preventing zombies.


    To collect a child''s exit status, use the `wait` or `waitpid` calls. You must
    include the header files `<sys/types.h>` and `<sys/wait.h>`. They are prototyped
    as follows:


    ```

    pid_t wait(int *status);

    pid_t waitpid(pid_t pid, int *status, int options);

    ```


    The `status` parameter stores the child process''s exit status. `pid` is the PID
    of the process for which you want to wait. It can take one of the four values,
    listed in Table 4.3.


    # Table 4.3: *Possible Values of `pid`*


    | Value | Description |

    | :--- | :--- |

    | `< -1` | Wait for any child process whose `PGID` equals the absolute value of
    `PID` |

    | `-1` | Wait for any child process |

    | `0` | Wait for any child process whose `PGID` equals that of the calling process
    |

    | `> 0` | Wait for the child whose `PID` equals `pid` |'
  merge: -1
  img_proc: true
