- pgno: 112
  md: '**NOTE**

    The process of *forking* involves copying the entire memory image of the parent
    to the child. This is an inherently slow process, so UNIX''s designers created
    the `vfork` call. `vfork` also creates a new process, but it does not make a copy
    of the parent. Instead, until `exec` or `exit` is called, the new process runs
    in the parent''s address space—if it accesses any of the parent''s memory, that
    portion of memory is copied to the child process. This feature is called copy-on-write.


    The rationale behind `vfork` is to speed up the creation of new processes. In
    addition, `vfork` has the additional feature of guaranteeing that the child executes
    before the parent, thus eliminating the threat of a race condition. Under Linux,
    however, `vfork` is merely a wrapper around `fork` because Linux has always used
    the copy-on-write mechanism. Linux''s `fork`, therefore, is as fast as UNIX''s
    `vfork`, but Linux''s `vfork`, because it is an alias of `fork`, cannot guarantee
    that the child process will execute before the parent.


    # Using exec


    The `exec` function is actually a family of six functions, each with slightly
    different calling conventions and uses. Despite the multiple functions, they are
    conventionally referred to as “the `exec` function.” Like `fork`, `exec` is declared
    in `<unistd.h>`. The prototypes are


    ```c

    int exec1(const char *path, const char *arg, ...);

    int exec2p(const char *file, const char *arg, ...);

    int execl(const char *path, const char *arg, char *const envp[]);

    int execv(const char *path, char *const argv[]);

    int execvp(const char *file, char *const argv[]);

    ```


    `exec` completely replaces the calling process''s image with that of the program
    being *execed*. While `fork` creates a new process, and so generates a new PID,
    `exec` initiates a new program, replacing the original process. Therefore, the
    PID of an *execed* process doesn''t change.


    `execve` takes three arguments: `path`, `argv`, and `envp`. `path` is the full
    path to the binary executable or script you want to execute. `argv` is the complete
    list of arguments you want to pass to the program, including `argv[0]`, which
    is traditionally the name of the program to execute. `envp` is a pointer to a
    specialized environment, if any, for the *execed* program (it was NULL in the
    sample program).


    ![](img/be588b36b489136ce784030a08a1d3d4_112_0.png)


    # Example


    In this example, `execve` is used to execute an `ls` command in the current directory.


    ```

