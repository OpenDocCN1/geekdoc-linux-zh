    # TCP/IP Programming


    TCP/IP is the protocol (actually, the protocol family) that runs the Internet,
    the largest network of interconnected machines in the world. The current version
    of the protocol is version 4 (IPv4), but the transition to version 6 (IPv6) has
    already begun. The specifications extant in current proposals for IPv6 have been
    integrated in the 2.2.x kernels. Because the new protocol is not in wide use,
    however, this section covers IPv4 instead. As remarked at the beginning of the
    chapter, network programming is a big topic about which whole volumes of books
    are written. However, you can actually write network-capable programs using fewer
    than 10 function calls.


    # Network Numbers


    Before jumping into network programming per se, it is important to point out that
    the TCP/IP protocol is big-endian; that is, it stores the most significant bit
    of multibyte numbers in the lowest memory address. Many computers are similarly
    big-endian.


    However, other computers, such as Intel''s x86 processors, are little-endian,
    meaning that the least significant bit of multibyte numbers is stored in the lowest
    memory address (the general term for the arrangement of values in memory is byte
    ordering). The implication of this is that when feeding numeric values to the
    TCP/IP functions, they must be converted from the host''s byte order to the network''s
    byte order.


    Fortunately, the protocol implementation includes four functions to do precisely
    this. They are declared in `<netinet/in.h>` as follows:


    ```

    ```c

    unsigned long int htonl(unsigned long int hostlong);

    unsigned short int htons(unsigned short int hostshort);

    unsigned long int ntohl(unsigned long int netlong);

    unsigned short int ntohs(unsigned short int netshort);

    ```

    ```


    htonl converts hostlong, a long integer, from the host system''s byte order to
    network byte order. Similarly, htons converts hostshort, a short integer, from
    the host byte order to network byte order. The other two calls, ntohl and ntohs,
    reverse the process and thus convert from network byte order to the host system''s
    byte order.'
  merge: -1
  img_proc: true
- pgno: 429
  md: "# Network Addresses\n\nAs with UNIX domain sockets, TCP/IP network addresses\
    \ are stored in a `sockaddr` structure, `struct sockaddr_in`, defined in `<netinet/in.h>`\
    \ as follows:\n\n```\n```\nstruct sockaddr_in {\n    short int sin_family;   \
    \   /* AF_INET */\n    uint16_t sin_port;        /* Port number */\n    struct\
    \ in_addr sin_addr;  /* IP address */\n};\n```\n```\n\nYou also must include `<sys/socket.h>`\
    \ to get the complete socket definition. For TCP/IP (version 4, at least), `sin_family`\
    \ must be `AF_INET`. `sin_port` is the port number to which to connect, and `sin_addr`\
    \ is the IP address. Both `sin_port` and `sin_addr` must be in network byte order.\
    \ However, `sin_addr` is a binary structure, so to convert it into standard dotted\
    \ decimal form, use the `inet_ntoa` function; conversely, to convert a dotted\
    \ decimal address to the binary format of `sin_addr`, use `inet_aton`. These calls\
    \ are prototyped in `<arpa/inet.h>` as\n\n```\n```\nchar *inet_ntoa(struct in_addr\
    \ addr);\nchar *inet_aton(const char *daddr, struct in_addr *ipaddr);\n```\n$Inetworks;address\
    \ storage, Transmission Control Protocol/Internet Protocol (TCP/IP) >\n\n`inet_ntoa`\
    \ converts the binary IP address stored in `addr` and returns it as a string (the\
    \ returned string is a statically allocated buffer that is overwritten by subsequent\
    \ calls of `inet_ntoa`). `inet_aton` converts a dotted decimal address stored\
    \ in `daddr` to the proper binary format, and then stores it in `ipaddr`. If the\
    \ address is a valid address, `inet_aton` returns nonzero, otherwise it returns\
    \ zero.\n```\n\n> CAUTION\n> \n> Several TCP/IP API functions return zero on failure\
    \ and nonzero when they succeed. This behavior is precisely opposite the behavior\
    \ of almost every library and system call you have seen so far.\n\n> TIP\n> \n\
    > You will occasionally encounter a function named `inet_addr`. It does the same\
    \ thing as `inet_aton`. It has the prototype `unsigned long int inet_addr(const\
    \ char *daddr)`. It is an obsolete call because it does not recognize `255.255.255.255`\
    \ as a valid IP address. If you encounter code that uses this function, do the\
    \ world a favor and change it to use `inet_aton`.\n\nTCP/IP network addresses\
    \ are 32-bit numbers, usually expressed in *dotted decimal* notation such as www.xxx.yyy.zzz.\
    \ Because they are 32-bit"
  merge: -1
  img_proc: true
- pgno: 430
  md: "numbers, there are a potential 4,294,967,295 (counting from 0) unique network\
    \ addresses. However, because each unique address might want or need to run multiple\
    \ TCP/IP applications simultaneously, each address also has up to 65,535 ports\
    \ to which to connect.\n\n*Ports* are 16-bit numbers that represent a connection\
    \ or end point on a given system (ports 0-1024 are reserved for use by processes\
    \ running with root privileges). So, a unique connection point on one system is\
    \ defined by the combination of the host's IP address and a port number. A complete\
    \ and unique network connection between two systems is defined by two such connection\
    \ points. Figure 18.5 graphically illustrates this point. \\file{networks:address\
    \ storage, Transmission Control Protocol/Internet Protocol (TCP/IP):}\n\n![](img/be588b36b489136ce784030a08a1d3d4_430_0.png)\n\
    \nAs you can see in the figure, HOST1 and HOST2 have four complete connections\
    \ between them, HOST1:PORT1 to HOST2:PORT2, HOST1:PORT2 to HOST2:PORT3, HOST2:PORT1\
    \ to HOST1:PORT3, and HOST2:PORT4 to HOST1:PORT4.\n\nBefore looking at the sample\
    \ programs, you must know about one last function, *setsockopt*. After closing\
    \ a socket, its address (the IP and port number combination) is unavailable for\
    \ a certain period of time. To reuse this address, you must set an option on the\
    \ socket that allows it to be reused. It is declared in <i>*sys/socket.h*</i>\
    \ as\n\n```\n```C\nint setsockopt(int sockfd, int level, int optname,\n  \\_const\
    \ void *optval, socklen_t optlen);\n```\n```\n\n*setsockopt* sets the option stored\
    \ in *optname* to *optval* for the socket that opened on the file descriptor *sockfd*.\
    \ For sockets, *level* must be *SOL_SOCKET*."
  merge: -1
  img_proc: true
- pgno: 431
  md: "Set *optname* to *0* and *optval* to *1*. That is, the *setsockopt* should\
    \ resemble the following:\n\n```\nint i = 1;\n```\n\n```\nsetsockopt (sockfd,\
    \ SOL_SOCKET, 0, &i, sizeof (i)); $I-networks; address storage, Transmission Control\
    \ Protocol/Internet Protocol (TCP/IP)>\n```\n\n# Examples\n\n![](img/be588b36b489136ce784030a08a1d3d4_431_0.png)\n\
    \n# Example\n\n1. The example that follows, *mynet*, creates a *TCP/IP* socket,\
    \ and then waits for and accepts all connections. It uses port number *50000*,\
    \ which is not likely to be used by another program.\n\n```\n/*\n * mynet.c -\
    \ Bind to and wait on a TCP/IP socket\n */\n#include <sys/socket.h>\n#include\
    \ <netinet/in.h>\n\n#include <arpa/inet.h>\n#include <unistd.h>\n#include <stdlib.h>\n\
    #include <stdio.h>\n#include \"helper.h\"\n\nint main(void)\n{\n    int sockfd;\n\
    \    struct sockaddr_in srv; /* Server's socket structure */\n    socklen_t socklen;\n\
    \    int i = 1;               /* For setsockopt */\n\n    /* Create the socket\
    \ */\n    if ((sockfd = socket(PF_INET, SOCK_STREAM, 0)) < 0)\n        err_quit\
    \ (\"socket\");\n\n    /* Want to reuse the local address */\n    setsockopt (sockfd,\
    \ SOL_SOCKET, 0, &i, sizeof (i));\n\n    /* Initialize and set up the server structure\
    \ */\n    memset (&srv, 0, sizeof (srv));\n    srv.sin_family = AF_INET;\n   \
    \ srv.sin_port = htons (50000); /* Don't forget network byte order */\n```"
