- pgno: 456
  md: "The `$Date$` value appears in UTC or Universal Coordinated Time format, formerly\
    \ known as Greenwich Mean Time. The symbolic name that `$Name$` represents is\
    \ an alias that you can use to refer to a particular revision. To associate a\
    \ symbolic name with a specific revision number, use the `-n<name>` switch when\
    \ checking in a file. The `$State$` field defaults to experimental (Exp) because\
    \ RCS considers all check ins to be trial runs until they are specifically marked\
    \ as stable (Stab) or released (Rel) using the `-s<state>` switch.\n\n# The ident\
    \ Command\n\nThe `ident` command locates RCS keywords in files of all types and\
    \ displays them to standard output. This feature lets you find out which revisions\
    \ of which modules are used in a given program release. `ident` works by extracting\
    \ strings of the form `$KEYWORD: VALUE $` from source, object, and binary files.\
    \ It even works on raw binary data files and core dumps. In fact, because `ident`\
    \ looks for any instance of the `$KEYWORD: VALUE $` pattern, you can also use\
    \ words that are not RCS keywords.\n\nThis enables you to embed additional information\
    \ into programs, for example, a company name. Embedded information can be a valuable\
    \ tool for isolating problems to a specific code module. The slick part of this\
    \ feature is that RCS updates the identification strings automatically—a real\
    \ bonus for programmers and project managers.\n\n# *Example*\n\n![](img/be588b36b489136ce784030a08a1d3d4_456_0.png)\n\
    \n# **Example**\n\nTo illustrate using `ident`, create the following source file,\
    \ check it in (using `-u`), compile and link it, ignore the warning you might\
    \ get that `rcsid` is defined but not used, and then run the `ident` command on\
    \ it.\n\n```\n```\n/*\n * $Id$\n * prnenv.c - Display values of environment variables.\n\
    \ */\n#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n\nstatic char\
    \ rcsid[] = \"$ Id $\\n\";\n\nint main(void)\n{\n    extern char **environ;\n\
    \    char **my_env = environ;\n```\n\n```"
  merge: -1
