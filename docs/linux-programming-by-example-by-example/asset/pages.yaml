  md: '**NOTE**

    It appears that the current release of *egcs*, 1.1.2, will be the last version
    of *egcs per se*. The next release, according to *egcs*''s web site, will be version
    *2.95* of *gcc*.


    *egcs* is completely backward-compatible with *gcc*, so everything this chapter
    said about *gcc* also applies to *egcs*. In fact, although doing so is not officially
    sanctioned by the kernel development team, you can compile the *Linux* 2.2.x kernel
    with *egcs* without incident and it should run very well. *egcs* represents significant
    improvement over the standard *gcc* compiler, 2.7.2.3. The next section covers
    some of these improvements.


    # ### Enhancements to *gcc*


    Most of *egcs*'' enhancements over *gcc* affect the operation of the compiler
    itself rather than its command-line interface, so they are far beyond the scope
    of this book. However, some changes in the command-line interface have been made,
    and are covered in this section.


    Several new warnings have been added. `-Wundef` and `-Wno-def` generate warnings
    when an `#if` preprocessor directive attempts to evaluate an undefined identifier.
    `-Wsign -compare` causes *egcs* (and *gcc*) to warn when code compares signed
    and unsigned values. The `-Wall` flag has been extended to cause *egcs* to issue
    warnings when integers are implicitly declared. Similarly, the warning flag `-Wimplicit-function-declarations`
    catches implicit declaration of functions.


    Debugging and optimization improvements have also been made. For example, in addition
    to the numeric arguments to the optimization switch, `-0,` you can now use `-Os`
    to select code size optimizations over code speed optimizations. Choosing between
    *size* or *speed* optimizations depends mostly on whether you need high performance
    or to conserve disk space. These days, with both RAM and disk space pretty inexpensive,
    it is easy to choose speed over *size*. A program’s *size*, however, must be considered
    in terms of its disk footprint as well as the amount of memory it requires while
    executing. In situations where disk and RAM are at a premium, choose to reduce
    size rather than to increase speed because the fastest program in the world is
    useless if it will not fit on your disk or in memory.


    The `-fstack-check` switch checks for stack overflow on systems that lack such
    a feature. To enhance debugging capabilities, new flags for *performance profiling*
    have been added. Performance profiling enables you to determine precisely how
    fast your code executes, which functions it calls most often, which variables
    it uses most often, and to identify unused sections of code (often called *dead
    code*) or variables. With this information, you can modify the source code to
    make your program *more efficient*; *egcs* also has built-in support for the Checker
    memory checking tool. Additional processor-specific flags are listed here:'
  merge: -1
