    # ## Opening and Closing Files


    There are two ways to open files, `open` and `creat`. They are prototyped in `<unistd.h>`,
    but you also

    must include the `<fcntl.h>` header file.


    # ## The open System Call


    ```

    ```c

    int open(const char *pathname, int flags);

    int open(const char *pathname, int flags, mode_t mode);

    ```


    ```


    `open` attempts to open the file referred to in `pathname`, with the access specified
    in `flags`. The mode

    parameter contains the file mode if the file is being created. You must set `flags`
    to

    `O_RDONLY`, `O_WRONLY`, or `O_RDWR`, which specify read only, write only, or read/write
