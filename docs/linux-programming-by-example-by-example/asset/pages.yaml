- pgno: 334
  md: '# 14—


    Creating and Using Programming Libraries


    This chapter looks at creating and using programming libraries, which are collections
    of code that can be reused across multiple software projects. Libraries are a
    classic example of software development''s Holy Grail: code reuse. They collect
    frequently used programming routines and utility code into a single location.


    The standard C libraries are examples of code reuse. They contain hundreds of
    frequently used routines, such as the output function printf and the input function
    getchar, that would be tedious to rewrite each time you create a new program.
    Beyond code reuse and programmer convenience, however, libraries provide a great
    deal of thoroughly debugged and well-tested utility code, such as routines for
    network programming, graphics handling, data manipulation, and system calls.


    This chapter covers the following topics:


    +   - Obtaining library information


    +   - Manipulating libraries


    +   - Creating and using static libraries


    +   - Creating and using shared libraries


    +   - Using dynamically loaded objects'
  merge: -1
