- pgno: 465
  md: '# Using gdb


    To use *gdb* effectively, you must know only a few commands. It helps tremendously
    if you compile a debug version that has a special symbol table to support debugging.
    *gdb* also accepts several command-line options and arguments to customize its
    behavior. Time invested in learning *gdb* repays itself in faster, more effective
    debugging sessions.


    But wait! What is a *debug version*? What is a *symbol table*? A symbol table
    is a list of functions, variables, and related information stored in a binary
    or object file that the C runtime environment, the linker, and the loader all
    use to properly load and execute your program. A debugging enhanced symbol table
    adds extra information, such as line numbers and more cross-references between
    functions and variables, that debuggers use to make debugging simpler. The section
    on *gdb* will show you how to use these features.


    # Compiling with Debugging Support


    As you learned in Chapter 1, “Compiling Programs,” you need to compile with the
    -g switch to create an enhanced symbol table. So, the following command:


    ```

    ```

    $ gcc -g file1.c file2.c -o prog

    ```

    ```


    causes *prog* to be created with debugging symbols in its symbol table. You can
    use gcc’s -ggdb option to generate still more (gdb-specific) debugging information.
    However, to work most effectively, this option requires that you have access to
    the source code for every library against which you link. Although this can be
    very useful in certain situations, it can also be expensive in terms of disk space.
    In most cases, you should be able to get by with the plain -g option.


    Also as noted in Chapter 1, it is possible to use both the -g and the -O (optimization)
    options. However, optimization transforms object code in ways that often obscure
    the relation between your source and what is visible in the debugger. Variables
    or lines of code might have disappeared or variable assignments might occur at
    times when you do not expect them. My recommendation is that you wait until you
    have debugged your code as completely as possible before starting to optimize
    it. In the long run, it will make your life, especially the parts of it you spend
    debugging, much simpler and less stressful.


    > CAUTION

    > Do not strip your binaries if you distribute programs in binary form. It is
    a matter of courtesy to your users and may even help you. If you get a bug report
    from a user who obtained a binary-only version, she will be unable to provide
    helpful information if you used *strip* to discard all symbols from the binary
    to make the binary smaller.'
  merge: -1
  img_proc: true
