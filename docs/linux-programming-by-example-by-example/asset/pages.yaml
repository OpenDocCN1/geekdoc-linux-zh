    \ of this book, it is important to point out that *init* is the father of all\
    \ processes.\n\nThe functions that allow a process to obtain its PID and PPID\
    \ are `getpid` and `getppid`. Declared in the system header file `<unistd.h>`,\
    \ their prototypes are\n\n```\n```\n pid_t getpid(void);\n pid_t getppid(void);\n\
    ```\n```\n\n`getpid` returns the PID of its caller (the calling process), and\
    \ `getppid` returns the PPID of its caller, which would be the PID of its parent.\n\
    \nWhy would a process need to know its PID or the PID of its parent? One common\
    \ use of a PID is to create unique filenames or directories. After a call to `getpid`,\
    \ for example, the process could then use the PID to create a temporary file.\
    \ Another typical task is to write the PID to a log file as part of a log message,\
    \ making it clear which process recorded the log message. A process can use its\
    \ PPID to send a signal or other message to its parent process.\n\n# **Example**\n\
    \n![](img/be588b36b489136ce784030a08a1d3d4_94_0.png)\n\nThis short program prints\
