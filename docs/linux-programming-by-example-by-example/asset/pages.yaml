    \ is located in another file or, if a like-named symbol is not found, it will\
    \ be replaced by a 0.\n\n# The ar Command\n\nar creates, modifies, or extracts\
    \ archives. It is most commonly used to create static libraries, which are files\
    \ that contain one or more object files. Static libraries are object files whose\
    \ code is designed to be linked into a program at compile-time rather than linked\
    \ into a program dynamically at runtime. Static libraries are the conceptual opposite\
    \ of Windows' dynamic link libraries (DLLs). The constituent object files are\
    \ called members. ar also creates and maintains a table that cross-references\
    \ symbol names to the members in which they are defined. An example of using the\
    \ ar command is given in the section \"Creating a Static Library,\" later in this\
    \ chapter. The ar command has the following syntax:\n\n```\nar [dmptrx] [options]\
    \ [member] archive_file file [ . . . ]\n```\n\nar creates the archive named archive_file\
    \ from the files listed in file. At least one of the d, m, p, q, u, r or x options\
    \ is required. You will normally use r. Table 14.2 describes the most commonly\
    \ used ar options.\n\nTable 14.2: Options for the ar Command\n\n| Option | Description\
    \ |\n| :----- | :---------- |\n| -c     | Creates archive if it doesn't exist\
    \ and suppresses the message ar would emit if archive doesn't exist. The archive\
    \ will still be created whether -c is specified or not. |\n| -s     | Creates\
    \ or updates the map linking symbols to the member in which they are defined.\
    \ |\n| -r     | Inserts file into the archive and replaces any existing member\
    \ whose name matches that being added. New members are added at the end of the\
    \ archive. |\n| -q     | Appends files to the end of archive without checking\
    \ for replacements. |"
