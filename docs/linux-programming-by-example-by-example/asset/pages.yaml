  md: '# Network Concepts and Terminology


    To most people, networks seem to work like telephones. When you make a telephone
    call, you dial a number and reach the person you want directly. The sentences
    you speak are transmitted and received in the order you spoke them, and no one
    else can listen to your conversation or jump into the middle of it. A telephone,
    then, provides guaranteed delivery of your message, delivers it in order, and
    does not tamper with the message while it is in transit. Similarly, when you click
    on a link on a Web page, it takes you almost immediately to the linked page. There
    are no intermediate stops; the page does not get garbled or interrupted.


    In reality, though, computer networks do not work so neatly and cleanly. Unlike
    telephone systems, which provide a direct circuit connection between two locations,
    computer networks work on a store and forward basis, usually called *packet switching*.
    A sender sends data in fixed size packages, called *packets*, to the closest intermediary,
    called a *router*. The router examines each incoming packet to determine whether
    to keep it. The router transfers packets it should keep to its own network, and
    forwards packets it should not keep to the next router along the line, at which
    point the store and forward process repeats itself. Figure 18.1 illustrates how
    packet switching works.


    ![](img/be588b36b489136ce784030a08a1d3d4_412_0.png)


    Figure 18.1 contrasts the way data travels across packet-switched (shown in the
    upper portion of the figure) and circuit-switched networks (shown in the lower
    portion). mynet.com and yournet.net represent two local area networks that are
    connected to the Internet. As you can see from the figure, on'
  merge: -1
  img_proc: true
- pgno: 413
  md: 'a packet-switched network, routers for mynet.com and yournet.net transfer data
    destined for their local networks into the network. This is represented by the
    vertical lines with arrows on each end connecting the flow of data across the
    Internet to the connected local networks. Data travelling to other networks is
    simply forwarded to the next router. A circuit-switched network, however, creates
    a connection between mynet.com and yournet.net.


    Although there might be intervening network connection points, as illustrated
    by the small square boxes, they behave more like railroad crossings than automobile
    intersections. The data (the railroad train) passes through without interruption
    on its way to its destination. On a packet-switched network, though, like the
    Internet, data must negotiate several intersections (routers). The route each
    packet takes through the Internet is controlled by the router, much like the path
    an automobile takes through crowded city streets is controlled, at least in part,
    by the intersections it encounters.


    Besides the difference in operation, packet-switched networks have other shortcomings.
    First, some packets will get lost. Second, long messages are broken into multiple
    packets that may arrive in a different order than they were sent, and anyone can
    intercept the packets and change their contents. These defects notwithstanding,
    computer networking works extremely well because the (very bright) people who
    designed the hardware and software devised schemes to work around or simply solve
    all these problems.


    **NOTE**


    Three paragraphs hardly begin to describe the complex operations of computer networks.
    The discussion is over-simplified considerably because the point is to provide
    you enough information to place programming for networks into a meaningful context
    without overwhelming you with details. So, please bear this in mind as you read.


    Similarly, one chapter can only skim the cream off the topic of network programming.
    It is a complex topic that requires hundreds of pages to address completely.


    Several terms arise constantly when discussing network *protocols*, the agreed-upon
    rules for how data is transmitted over a network. A protocol is said to be *connection-oriented*
    if it has two distinct endpoints, if other users cannot intrude upon the connection,
    and if a connection must exist between the two endpoints before communication
    can take place. A protocol that lacks these characteristics is considered *connectionless*.


    *Sequencing* means that a protocol guarantees that data arrives in the same order
    it was sent. A protocol has *error control* if it detects corruption, discards
    corrupt messages, and arranges for retransmission of the data.


    Networks transmit data in one of two ways: using individual bytes of data, and
    using packets. Byte-based transmission characterizes *streaming protocols* because
    they only deal with streams of bytes, much like Linux''s'
