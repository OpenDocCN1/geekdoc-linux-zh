    Processes


    Understanding the Linux process model is central to understanding most of Linux''s
    low-level behavior. The notion of the process underlies most file access rights,
    signals, and job control. This chapter covers the following subjects:


    +   - What is a process?

    +   - Process information

    +   - Process identifiers

    +   - Creating processes

    +   - Killing processes

    +   - Manipulating processes'
