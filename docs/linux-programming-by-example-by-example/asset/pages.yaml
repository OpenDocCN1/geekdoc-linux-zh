    # ### Output


    ncurses has many functions for sending output to screens and windows. It is important
    to understand that C''s standard output routines do not work with ncurses'' windows
    because ncurses takes over output on the terminal. Fortunately, ncurses'' I/O
    routines behave very similarly to the standard I/O (<stdio.h>) routines, so the
    learning curve is tolerably flat. For the purposes of this discussion, ncurses''
    output routines have been divided into character, string, and miscellaneous categories.
    The following sections discuss each of these categories in detail.


    # #### Character Output


    ncurses'' core character output function is addch, prototyped in <ncurses.h> as
    int addch (chtype ch);


    Almost all the other output functions do their work with calls to addch. It displays
    the character ch in the current window (normally stdscr) at the cursor''s current
    position and advances the cursor to the next position. If doing so would place
    the cursor beyond the right margin, the cursor automatically wraps to the beginning
    of the next line. If the cursor is positioned at the bottom of the window, it
    scrolls up one line. If ch is a tab, newline, or backspace, the cursor moves appropriately.
    Other control characters display using ~X notation, where X is the character and
    the caret (~) indicates that'
