  md: '# *Table I.1 continued*


    | Extension | Type |

    |---|---|

    | `.ii` | Preprocessed C++ source code |

    | `.S`, `.s` | Assembly language source code |

    | `.o` | Compiled object code |

    | `.a`, `.so` | Compiled library code |


    # *Invoking gcc Step by Step*


    In the first example, a lot took place under the hood that you did not see. `gcc`
    first ran `hello.c` through the preprocessor, `cpp`, to expand any macros and
    insert the contents of `#included` files. Next, it compiled the preprocessed source
    code to object code. Finally, the linker, `ld`, created the `hello` binary. The
    entire compilation process is illustrated in Figure 1.1.


    ![](img/be588b36b489136ce784030a08a1d3d4_39_0.png)


    Compiling a program consists of many steps.


    You can re-create these steps manually, stepping through the compilation process.
    To tell `gcc` to stop compilation after preprocessing, use `gcc`''s `-E` option,
    as follows:


    ```

    $ gcc -E infile.c -o outfile.cpp

    ```'
