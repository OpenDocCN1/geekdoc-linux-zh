- pgno: 445
  md: '# 19—

    **Tracking Source Code Changes:

    The Revision Control System**


    Version control is a process for keeping track of and managing changes made to
    source code files. Why bother? Because one day you *will* make that one fatal
    edit to a source file, delete its predecessor, and forget exactly which line or
    lines of code you "fixed." Because simultaneously keeping track of the current
    release, the next release, and eight bug fixes manually *will* become too tedious
    and confusing. Because frantically searching for the backup tape after one of
    your colleagues overwrote a source file for the fifth time *will* drive you over
    the edge. Because, one day, over your morning cappuccino, you will say to yourself,
    "Version control, it''s the Right Thing to Do."


    This chapter examines RCS, the Revision Control System, a common solution to the
    version control problem. RCS is a common solution because it is available on almost
    all UNIX systems, not just on Linux. RCS is maintained by the GNU project. Two
    alternatives to RCS are CVS, the Concurrent Version System, also maintained by
    the GNU project, and SCCS, the Source Code Control System, a proprietary product.
    Topics covered in this chapter include the following:


    +   - Version control terminology

    +   - Creating a source code repository

    +   - Checking files in and out of the repository

    +   - RCS keywords and the *ident* command

    +   - RCS change logs

    +   - Additional RCS commands and utilities'
  merge: -1
  img_proc: true
- pgno: 446
  md: '# Why RCS?


    More experienced programmers, and especially programmers familiar with other versions
    of UNIX or UNIX clones, might ask, "Why discuss RCS when CVS is more popular,
    has more features, and is better suited for use with large programming projects?"
    First, I consider RCS the easiest introduction to version control concepts. Few
    beginning programmers have ever heard of version control, much less used version
    control software. RCS is easy to learn, requires little setup or configuration,
    and has a small command set. This makes it the ideal vehicle for introducing people
    to version control concepts. Nevertheless, because CVS is built on and compatible
    with RCS, the transition to CVS will be smooth.


    Moreover, although CVS definitely has a much richer feature set than RCS, these
    features are of little benefit to neophyte Linux programmers. Few beginning hackers
    will need, for example, the ability to browse their source code using a Web browser
    or to make anonymous read/write access to the repository available.


    Finally, most beginning programmers will not be working in an environment in which
    multiple projects are under development or that have a single source code repository
    that stores the source code for multiple projects, environments for which CVS
    was designed.


    # Version Control Terminology


    Before proceeding, however, Table 19.1 lists a few terms that will be used throughout
    the chapter. Because they are frequently used, it is important that you understand
    them in the context of RCS and version control.


    Table 19.1: Version Control Terms


    | Term | Description |

    |---|---|

    | RCS file | Any file located in an RCS directory, controlled by RCS and accessed
    using RCS commands. An RCS file contains all versions of a particular file. Normally,
    an RCS file has a .v extension. |

    | Working file | One or more files retrieved from the RCS source code repository
    (the RCS directory) into the current working directory and available for editing.
    |

    | Lock | A working file retrieved for editing so that no one else can simultaneously
    edit it. A working file is locked by the first user against edits by other users.
    |

    | Revision | A specific, numbered version of a source file. Revisions begin with
    1.1 and increase incrementally, unless forced to use a specific revision number.
    |'
  merge: -1
  img_proc: true
- pgno: 447
  md: "The Revision Control System manages multiple versions of files, usually but\
    \ not necessarily source code files. RCS automates file version storage and retrieval,\
    \ change logging, access control, release management, and revision identification\
    \ and merging. As an added bonus, RCS minimizes disk space requirements because\
    \ it tracks only file changes.\n\n> **NOTE**\n> \n> The examples used in this\
    \ chapter assume that you are using RCS version 5.7. To determine the version\
    \ of RCS you are using, type `rcs -V`.\n\nRCS can be used for more than just source\
    \ code files, however. It is capable of tracking changes to any type of text file,\
    \ such as reports, book chapters, or HTML code. It does not, however, handle binary\
    \ files. CVS, the Concurrent Version System, does work with binary files, which\
    \ is why many people use CVS rather than RCS.\n\n# ### Using RCS\n\nOne of RCS's\
    \ attractions is its simplicity. With minimal setup and only a few commands, you\
    \ can accomplish a great deal. This section discusses the `ci`, `co`, and `ident`\
    \ commands as well as the RCS keywords.\n\n# ### Checking Files In and Out\n\n\
    You can accomplish a lot with RCS using only two commands, `ci` and `co`, and\
    \ a directory named RCS. `ci` stands for *check in*, which means storing a working\
    \ file in the RCS directory; `co` means *check out* and refers to retrieving an\
    \ RCS file from the RCS repository.\n\nTo get started, you must create an RCS\
    \ directory. By default, all RCS commands assume that a directory named RCS exists\
    \ in the current working directory. So, your first step is to create this directory.\
    \ Suppose you have several source files in `/home/gomer/editor`. Make that your\
    \ current directory and create the directory, RCS, as show in the following:\n\
    \n```\n```\n$ cd /home/gomer/editor\n$ mkdir RCS\n```\n```\n\nAll RCS commands\
    \ executed in `/home/gomer/editor` will use this directory. The RCS directory\
    \ is also called *the repository*.\n\n> **TIP**\n> \n> RCS's default behavior\
    \ is to use a repository in each working directory. This is usually sufficient\
    \ for small projects. This highlights one of RCS's shortcomings: It does not make\
    \ it easy to work with projects that have multiple working directories. Again,\
    \ this is a reason why many people prefer CVS."
  merge: -1
  img_proc: true
- pgno: 448
  md: "After you have created the RCS repository, the next step is to check all your\
    \ existing source code files into it. The first time you check a file in, RCS\
    \ asks for a description of the file, copies it to the RCS directory, and deletes\
    \ the original. \"Deletes the original? Ack!\" Don't worry, you can retrieve it\
    \ with the check-out command, `co`. But, first things first. The following example\
    \ creates a repository, a source file to store in it, and then uses `ci` to check\
    \ the file in.\n\n# Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_448_0.png)\n\
    \n# Example\n\nFirst, make an RCS directory, as shown:\n\n```\n$ mkdir RCS\n```\n\
    \nNext, create the source file, `howdy.c`, in the same directory in which you\
    \ created the RCS directory.\n\n```\n\"/*\n   $ Id $\n   howdy.c - Sample to demonstrate\
    \ RCS Usage\n   */\n#include <stdio.h>\n\nint main(void)\n{\n    printf(\"Howdy,\
    \ Linux programmer!\");\n    return EXIT_SUCCESS;\n}\"\n```\n\n![](img/be588b36b489136ce784030a08a1d3d4_448_1.png)\n\
    \n# Output\n\n```\n$ ci howdy.c\nRCS/howdy.c,v <--> howdy.c\nenter description,\
    \ terminated with single '.' or end of file:\nNOTE: This is NOT the log message!\n\
    >> Simple program to illustrate RCS usage\n\n\n\n>> .\ninitial revision: 1.1\n\
    done\n$ co -l howdy.c\nRCS/howdy.c,v <-->  howdy.c\nrevision 1.1 (locked)\ndone\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 449
  md: 'Note that if you do not use $co$''s $-l$ option, the working file you just
    checked out is read-only; if you want to edit it, you must lock it. To do this,
    use the $-l$ option with $co$ ($co\ -l\ howdy.c$). $-l$ means lock (the concept
    of locking is defined in Table 19.1). The two lines in the output preceded by
    $\gg$ are lines you must type.


    # *Making Changes to Repository Files*


    To see version control in action, make a change to the working file. If you haven''t
    already done so, check out and lock the file ($co\ -l\ howdy.c$). Change anything
    you want, but I recommend adding $\backslash n$ to the end of $printf$''s string
    argument because Linux (and UNIX), unlike DOS and Windows, do not automatically
    add a newline to the end of console output.


    Then, check the file back in. When you check it back in, RCS will perform the
    following steps:


    +   1. Increment the revision number to 1.2

    +   2. Ask for a description of the changes you made

    +   3. Incorporate the changes you made into the RCS file

    +   4. (Annoyingly) delete the original


    To prevent deletion of your working files during check-in operations, use the
    $-l$ or $-u$ options with $ci$.


    # *Example*


    ![](img/be588b36b489136ce784030a08a1d3d4_449_0.png)


    **Example**


    This example makes the change discussed in the previous paragraph and then updates
    the repository file.


    ![](img/be588b36b489136ce784030a08a1d3d4_449_1.png)


    # **Output**


    ```

    $\$ ci\ -l\ howdy.c$

    RCS/./howdy.c,v $<-$ howdy.c

    new revision: 1.2; previous revision: 1.1

    enter log message, terminated with single ''.'' or end of file:

    $\gg$; Added newline

    $\gg$; .

    done

    ```


    When used with $ci$, both the $-l$ and $-u$ options cause an implied check out
    of the file after the check-in procedure completes. $-l$ locks the file so you
    can continue to edit it, whereas $-u$ checks out an unlocked or read-only working
    file.


    # *Additional Command-Line Options*


    In addition to $-l$ and $-u$, $ci$ and $co$ accept two other very useful options:
    $-r$ (for revision) and $-f$ (for force). Use $-r$ to tell RCS which file revision
    you'
  merge: -1
  img_proc: true
