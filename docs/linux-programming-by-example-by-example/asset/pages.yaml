    record from the database and then displays both the key and its associated value.
    When `c_get` returns `DB_NOTFOUND`, there are no more records to retrieve. The
    `sync` call is not actually necessary because no data has been changed, but it
    is included to illustrate its use. Note also that `cursor` closes the database
    cursor, `dbc`, before it closes the database. Although it is not strictly required,
    it is a good habit to develop to make sure that all resources allocated by the
