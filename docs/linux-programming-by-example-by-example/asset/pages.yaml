  md: '# ## 21—


    **Software Distribution**


    The fastest, coolest code in the world will become shelfware if it is extraordinarily
    difficult to install or renders a user''s system useless after installing it.
    Typically overlooked in programming texts, this chapter covers the tricky process
    of software distribution. You will learn the following:


    +   - Using the `tar` command

    +   - Using the `gzip` command

    +   - Using the `install` command

    +   - Using the Red Hat Package manager


    *Software distribution* is the creation, distribution, installation, and upgrade
    of software in both source code and binary form. This chapter looks at the GNU
    project''s `tar`, `gzip`, and `install` utilities and Red Hat''s Red Hat Package
    Manager, RPM.'
