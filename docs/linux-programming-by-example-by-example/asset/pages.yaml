  md: "The flags are defined in `<linux/ext2_fs.h>`. `request` must be set to `EXT2_IOC_GETFLAGS`\
    \ to retrieve the attributes for the file specified by the file descriptor `fd`,\
    \ or set to `EXT2_IOC_SETFLAGS` to set those attributes. In either case, `arg`\
    \ holds the flags being manipulated.\n\n> **CAUTION**\n> The material in this\
    \ section is highly specific to Linux's primary filesystem, ext2, formally known\
    \ as the Second Extended filesystem. Other versions of UNIX may have the functions\
    \ and structures we will discuss, but they surely will not behave as described\
    \ here. If you use these calls in a program you intend to be portable, you must\
    \ surround them with `#ifdefs` in order for your code to compile and run properly\
    \ on non-Linux systems.\n\n# *Example*\n\n![](img/be588b36b489136ce784030a08a1d3d4_189_0.png)\n\
    \n# Example\n\nThe sample program that follows sets the sync and no-dump attributes\
    \ on the file passed as its sole argument.\n\n```\n```\n/*\n * setext2.c - Set\
    \ ext2 special flags\n*/\n#include <sys/types.h>\n#include <unistd.h>\n#include\
    \ <stdlib.h>\n#include <stdio.h>\n#include <fcntl.h>\n#include <linux/ext2_fs.h>\n\
    #include <sys/ioctl.h>\n#include <errno.h>\n\nint main(int argc, char *argv[])\n\
    {\n    int fd;\n    long flags;\n\n    /* Remind the user how to call us */\n\
    \    if(argc != 2) {\n        puts(\"USAGE: setext2 {filename}\");\n        exit(EXIT_FAILURE);\n\
    \    }\n\n    if((fd = open(argv[1], O_RDONLY)) < 0) {\n        perror(\"open\"\
    );\n    }\n```\n```"
