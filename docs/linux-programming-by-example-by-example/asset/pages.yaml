- pgno: 335
  md: "# **Library Tools**\n\nBefore jumping into library creation and usage, you\
    \ must know about the tools at your disposal for creating, maintaining, and managing\
    \ programming libraries. More detailed information can be found in the manual\
    \ pages and the tex-info documents for each command and program discussed in the\
    \ following sections.\n\n# ***The nm Command***\n\nThe nm command lists all the\
    \ symbols encoded in an object or binary file. It is used to see what functions\
    \ a program uses or to see if a library or an object file provides a needed function.\
    \ nm has the following syntax:\n\n```\nnm [options] file\n```\n\nnm lists the\
    \ symbols stored in `file`. `options` controls nm's behavior. Table 14.1 lists\
    \ useful options for nm.\n\n# *Table 14.1: Options for the **nm** Command*\n\n\
    | Option | Description |\n| :--- | :--- |\n| `-C` | Converts symbol names into\
    \ user-level names. This is especially useful for making c++ function names readable.\
    \ |\n| `-S` | When used on archive (.a) files, nm prints the index that maps symbol\
    \ names to the modules or member names in which the symbol is defined in addition\
    \ to the symbol the archive contains. |\n| `-u` | Displays only undefined symbols\
    \ (symbols that are not defined in the file being examined but that might be defined\
    \ in other libraries or archives). |\n| `-l` | Uses debugging information to print\
    \ the line number in which each symbol is defined, or the relocation entry if\
    \ the symbol is undefined. |\n\n# ***Example***\n\n![](img/be588b36b489136ce784030a08a1d3d4_335_0.png)\n\
    \n# Example\n\nThe example that follows uses `nm` to show the symbols that the\
    \ library `/usr/lib/libdl.a` contains:\n\n![](img/be588b36b489136ce784030a08a1d3d4_335_1.png)\n\
    \n# Output\n\n```\n$ nm /usr/lib/libdl.a | head -10\ndlopen.o:\n00000000 T _dlopen_check\n\
    \    U _dl_open\n    U _dterror_run\n\n\n00000000 W dlopen\n0000002c T dlopen_doit\n\
    ```"
