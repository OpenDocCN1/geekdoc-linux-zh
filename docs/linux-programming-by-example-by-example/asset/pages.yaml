- pgno: 348
  md: '+   * Exported data structures are added


    To maintain library compatibility, use the following guidelines:


    +   * Add functions to your library with new names instead of changing existing
    functions or changing their behavior.


    +   * Add items only to the end of existing data structures, and either make them
    optional or initialize them inside the library.


    +   * Don''t expand data structures used in arrays.


    # Building a Shared Library


    The process of building a shared library differs slightly from the one used to
    build a static library. The list that follows outlines the steps necessary to
    build a shared library:


    +   1. When compiling the object file, use gcc''s -fPIC option, which generates
    Position Independent Code (PIC) that can link and load at any address.


    +   2. Don''t use gcc''s -fomit-frame-pointer option—doing so could possibly make
    debugging impossible.


    +   3. Use gcc''s -shared and -soname options.


    +   4. Use gcc''s -Wl option to pass arguments to the linker, ld.


    +   5. Explicitly link against the C library by using gcc''s -1 option. This assures
    that your program will not compile on a program that lacks the correct version
    of the C library because references to new or modified functions will cause compiler
    errors.


    # Example


    ![](img/be588b36b489136ce784030a08a1d3d4_348_0.png)


    # Example


    This example builds the error-handling library as a shared library. It first builds
    the object file, and then links the library. Then it creates symbolic links from
    the full library name to the soname, and from the full library name to the name
    of the shared library, which simply ends in .so.


    ```

    ```bash

    $ gcc -fPIC -g -c librerr.c -o librerr.o

    $ gcc -g -shared -Wl,-soname,liberr.so -o librerr.so.1.0.0 librerr.o -lc

    $ ln -s librerr.so.1.0.0 librerr.so.1

    $ ln -s librerr.so.1.0.0 librerr.so

    ```

    ```


    Because you will not install this library as a system library in /usr or /usr/lib,
    you must create two links, one for the soname and one for the shared library.
    The linker will use the shared library name when linking against librerr; that
    is, when using -lerr.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# Using a Shared Library


    Now, to use the new shared library, revisit the test program introduced in the
    last section, `errtest.c`. Again, you need to tell the linker what library to
    use and where to find it, so use the `-l` and `-L` options. Finally, to execute
    the program, you need to tell `ld.so`, the dynamic linker/loader, where to find
    the shared library, so use the `$LD_LIBRARY_PATH` variable.


    # Example


    ![](img/be588b36b489136ce784030a08a1d3d4_349_0.png)


    # Example


    This example links `errtest` against the shared library version of `liberr` and
    then runs `errtest`.


    ```

    $ gcc -g errtest.c -o errtest -L. -lerr

    $ LD_LIBRARY_PATH=.$(pwd) ./errtest

    ```


    ![](img/be588b36b489136ce784030a08a1d3d4_349_1.png)


    # Output


    ```

    Testing err_ret . . .

    err_ret failed to open foo: No such file or directory

    Testing log_ret . . .

    ```


    As pointed out earlier, the environment variable `$LD_LIBRARY_PATH` adds the path(s)
    it contains to the trusted library directories `/lib` and `/usr/lib`. `ld.so`
    will search the path specified in the environment variable first and will ensure
    that it finds your library. An alternative to using the awkward command line is
    to add your library’s pathname to `/etc/ld.so.conf` and update the cache (`/etc/ld.so.cache`)
    by running (as root) `ldconfig`.


    Yet another alternative is to install your library as a system library. To do
    so, become the root user, place it in `/usr/lib`, and run `ldconfig` to update
    the cache file. The advantage of this last method is that you do not have to add
    the library search path using `gcc`''s `-L` option.


    # Dynamically Loaded Objects


    There is one more way to use shared libraries: load them dynamically at runtime,
    not as libraries linked and loaded automatically, but as entirely separate modules
    that you explicitly load using the `dl` (dynamic loading) interface. You might
    want to use the `dl` interface because it provides greater flexibility for both
    the programmer and end user, and because it is a more general solution to the
    issue of code reuse.


    # What Are They?


    Dynamically loaded objects are code modules specifically loaded at runtime for
    the purpose of using the functionality they provide without requiring that an
    application be linked with modules containing the loaded code. Suppose you are
    writing the next killer graphics program. Within your application, you handle
    graphical data in a proprietary but easy-to-use way.'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'However, you want to be able to import from and export to any of the literally
    hundreds of available graphics file formats.


    One way to achieve this would be to write one or more libraries to manipulate
    the various formats. Although it is a modular approach, each library change would
    require recompilation, or at least relinking, of your program, as would the addition
    of new formats and changes to existing ones. The effect of adding libraries is
    illustrated in Figure 14.1.


    ![](img/be588b36b489136ce784030a08a1d3d4_350_0.png)


    **Figure 14.1:**

    Each library module added to a program increases its size and forces recompilation.


    As you can see in Figure 14.1, each time you add another library to a program,
    the size (and complexity) of the program increases. This size grows especially
    quickly when you link with static libraries, represented by `libc.a` and `libd.a`
    in the figure.


    The `dl` interface enables a different approach: you design a generic, format-neutral
    interface for reading, writing, and manipulating graphics files of any format.
    To add a new or modified graphics format to your application, you simply write
    a new module to deal with that format and make your application aware that it
    exists, perhaps by modifying a configuration file or placing the new module in
    a predefined directory (the plug-ins that augment the Netscape Web browser’s capabilities
    use a variation of this approach).


    To extend your application’s capabilities, users simply must obtain a new module
    by editing a configuration file or copying the module to a preset directory. Recompiling
    is unnecessary. Existing code in your application loads the new modules and, voila,
    you can import and export a new graphic format. This approach is shown in Figure
    14.2.


    Each time you need code from a different library, you simply use the `dl` interface
    to load the function you require, illustrated in the figure by the arrows pointing
    from the application to the various libraries. The application’s overall resource
    requirements remain low, and its disk footprint is dramatically reduced versus
    the linking in static or shared libraries.'
  merge: -1
  img_proc: true
- pgno: 351
  md: "![](img/be588b36b489136ce784030a08a1d3d4_351_0.png)\n\n# Figure 14.2:  \nThe\
    \ dl interface reduces code  \nsize and complexity.\n\nThe dl interface (itself\
    \ implemented as a library, libdl), contains functions to load, search, and unload\
    \ shared objects. To use these functions, include <dlfcn.h> in your source code\
    \ and link against libdl. You don't have to link against the library you want\
    \ to use—this is the sort of necessity the dl interface is designed to eliminate.\
    \ Even though you use a standard shared library, you do not use it the normal\
    \ way. The linker never knows about shared objects and, in fact, the modules do\
    \ not even need to exist when you build the application.\n\n# The dl Interface\n\
    \nThe dl interface provides four functions to handle all the tasks necessary to\
    \ load, use, and unload shared objects: dlopen, dlclose, dlsym, and dlerror. Use\
    \ the dlopen function to load a shared object. Its prototype is as follows:\n\n\
    ```\nvoid *dlopen(const char *filename, int flag);\n```\n\ndlopen loads the shared\
    \ object in filename using the mode specified by flag. filename can be an absolute\
    \ pathname, a bare filename, or NULL. If it is NULL, dlopen opens the currently\
    \ executing program—your program. If filename is an absolute pathname, dlopen\
    \ opens that file. If it is a bare filename, dlopen looks in the following locations,\
    \ in the order given, to find the file:\n\n+   $LD_ELF_LIBRARY_PATH, $LD_LIBRARY_PATH,\
    \ /etc/ld.so.cache, /usr/lib, and /lib.\n\nflag can be RTLD_LAZY, meaning that\
    \ symbols from the loaded object will be resolved as they are called, or RTLD_NOW,\
    \ which means that all symbols from the loaded object will be resolved before\
    \ dlopen returns. Either flag, if logically ORed with RTLD_GLOBAL, will cause\
    \ all symbols to be exported, just as if they had been directly linked. dlopen\
    \ returns a handle to the loaded object if it finds filename, or returns NULL\
    \ otherwise.\n\nBefore you can use any code in a dynamically loaded library, you\
    \ must know what you are looking for and be able to access it. The dlsym function\
    \ meets both needs. It is prototyped as follows:\n\n```\nvoid *dlsym(void *handle,\
    \ char *symbol);\n```"
  merge: -1
