- pgno: 105
  md: "Table 4.2: Tracked System Resources\n\n| Resource | Description |\n| :-----\
    \ | :----- |\n| `ru_utime` | Time spent executing user mode (non-kernel)code |\n\
    | `ru_stime` | Time spent executing kernel code (requests from user code for system\
    \ services) |\n| `ru_minflt` | The number of minor faults (memory accesses that\
    \ do not result in disk accesses) |\n| `ru_majflt` | The number of major faults\
    \ (memory accesses that result in disk accesses) |\n| `ru_nswap` | The number\
    \ of memory pages read from disk due to major faults |\n\nAs Table 4.2 indicates,\
    \ there are two types of memory faults: minor faults and major faults. *Minor\
    \ faults* occur when the CPU must access main memory (RAM). This kind of fault\
    \ occurs because code or data the CPU needs is not in its registers or cache.\
    \ *Major faults* occur when a process must read data from disk because the needed\
    \ code or data is not in RAM. The `ru_nswap` member stores the number of memory\
    \ pages that must be read from disk as a result of major faults.\n\nTo get this\
    \ information, use the `getrusage` call, declared in `<sys/resources.h>`. The\
    \ `ru_utime` and `ru_stime` members store the user and system CPU time the process\
    \ accumulates. The only new information that `getrusage` gives you is the number\
    \ of memory faults and fault-related disk accesses. Unlike the `times` function,\
    \ `getrusage` must be called twice if you want to obtain information for both\
    \ parent and child. `getrusage` is prototyped as follows:\n\n```\nint getrusage(int\
    \ who, struct rusage *usage);\n```\n\n`usage` is a pointer to an `rusage` structure\
    \ the function fills. The `who` parameter determines which resource usages are\
    \ returned, the calling process's or its children's. `who` must be either `RUSAGE_SELF`\
    \ or `RUSAGE_CHILDREN`. `getrusage` returns 0 if it succeeds, or -1 if an error\
    \ occurs.\n\n![](img/be588b36b489136ce784030a08a1d3d4_105_0.png)\n\n# Example\n\
    \nThis program rewrites the previous example to use `getrusage` instead of `times`:\n\
    \n```\n```\n/*\n * resusg2.c - Get process times and resource usage\n */\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n#include <sys/times.h>\n```\n```"
