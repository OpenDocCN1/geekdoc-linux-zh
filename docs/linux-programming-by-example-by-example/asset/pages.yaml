- pgno: 294
  md: "TIP\nBecause the rodent interface is not supported outside ncurses, you should\
    \ make sure to wrap mouse-related code in an `#ifdef` structure so it will not\
    \ be compiled on nonncurses system. In fact, the best design isolates mouse-related\
    \ code to as few conditionally compiled modules as possible (preferably one).\
    \ For example, to conditionally compile mouse code, use a construct that resembles\
    \ the following:\n\n```\n#ifdef NCURSES_MOUSE_VERSION\n/*\n * Mouse support is\
    \ available\n * Mouse code would go here\n */\n#else\n/*\n * Mouse support not\
    \ available\n * Come up with a work-around\n */\n#endif\n```\n\nIf mouse support\
    \ is available, the `ifdef` will evaluate to 1 (true) and the section of code\
    \ after `#ifdef` executes. If not, the code block after `#else` executes instead.\n\
    \n# Overview of the Mouse Interface\n\nThe basic procedure for using the mouse\
    \ interface is reasonably simple. To enable mouse event reporting, call the function\
    \ `mousemask`. With the mouse active, your program's command loop or loops should\
    \ watch for the return value of `KEY_MOUSE` from `wgetch`, which indicates that\
    \ a mouse event has been queued. To pick the event off the queue, use the `getmouse`\
    \ call before the next call to `wgetch`.\n\nThe mouse events you can catch can,\
    \ depending on the environment, include presses and releases; single-, double-\
    \ and triple-clicks; and possibly the state of the Shift, Alt, and Ctrl keys.\
    \ To receive mouse events, you must be running either `gpm(1)`, Alessandro Rubin's\
    \ mouse server for the Linux console, or `xterm` and similar programs, such as\
    \ `rxvt`, which report mouse events through the X server.\n\nCAUTION\nUnfortunately,\
    \ most shipping versions of `gpm`, the console mouse driver that makes ncurses'\
    \ mouse driver work, are linked against BSD curses (`libcurses.[a.]so`). As a\
    \ result, mouse-handling code does not work properly out of the box. To get it\
    \ working properly, you must download and recompile the ncurses source distribution,\
    \ and then rebuild the `gpm` daemon and library (`libgpm`), thus linking it against\
    \ your newly built ncurses."
  merge: -1
  img_proc: true
