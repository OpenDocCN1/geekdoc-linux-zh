- pgno: 37
  md: "# ### Using GNU cc（gcc）\n\n`gcc` gives the programmer extensive control over\
    \ the compilation process. The compilation process includes up to four stages:\
    \ **preprocessing, compilation, assembly**, and **linking**. You can stop the\
    \ process after any of these stages to examine the compiler's output at that stage.\
    \ `gcc` can also handle the various C dialects, such as ANSI C or traditional\
    \ (Kernighan and Ritchie) C. You can control the amount and type of debugging\
    \ information, if any, to embed in the resulting binary and, like most compilers,\
    \ `gcc` can also perform code optimization.\n\n`gcc` includes over 30 individual\
    \ warnings and three \"catch-all\" warning levels. `gcc` is also a **cross-compiler**,\
    \ so you can develop code on one processor architecture that will run on another.\
    \ Cross-compilation is important because Linux runs on so many different kinds\
    \ of systems, such as Intel x86s, PowerPCs, Amigas, and Sun Sparcs. Each processor\
    \ chip has a different physical architecture, so the way a binary should be constructed\
    \ is different on each system. When used as a cross-compiler, `gcc` enables you\
    \ to compile a program on, say, an Intel x86 system that is designed to run on\
    \ a PowerPC.\n\nFinally, `gcc` sports a long list of extensions to C. Most of\
    \ these extensions enhance performance, assist the compiler's efforts at code\
    \ optimization, or make your job as a programmer easier. The price is portability,\
    \ however. I will mention some of the most common extensions because you will\
    \ encounter them in the kernel header files, but I suggest you avoid them in your\
    \ own code.\n\n# ### Invoking gcc\n\nTo use `gcc`, provide the name of a C source\
    \ file and use its `-o` option to specify the name of the output file. `gcc` will\
    \ preprocess, compile, assemble, and link the program, generating an executable,\
    \ often called a **binary**. The simplest syntax is illustrated here:\n\n```\n\
    ```text\ngcc infile.c [-o outfile]\n```\n```\n\n`infile.c` is a C source-code\
    \ file and `-o` says to name the output file `outfile`. The `[ ]` indicate optional\
    \ arguments throughout this book. If the name of the output file is not specified,\
    \ `gcc` names the output file `a.out` by default.\n\n# #### Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_37_0.png)\n\
    \n# Example\n\nThis example uses `gcc` to create the `hello` program from the\
    \ source file `hello.c`. First, the source code:\n\n```\n```c\n/*\n * Listing\
    \ 1.1\n */\n```\n```"
  merge: -1
  img_proc: true
