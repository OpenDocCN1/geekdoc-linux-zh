    Over and over in this book, you will read that Linux, while designed to be POSIX
    compliant, has literally adopted features from the two main branches of its UNIX
    forebears, AT&T and BSD UNIX. This inheritance shows in signals. As it happens,
    AT&T and BSD UNIX have also adopted a POSIX compliant signal API, so the differences
    between them do not matter terribly (so long as everyone writes to the POSIX API!).
    After a quick review of the development of the signal API, the next section shows
    you how to send, catch, and manipulate signals.


    # Signal History


    Signals have been a part of UNIX almost from the beginning, but it took UNIX''s
    designers a couple of attempts to get it right. Without going into all of the
    gory details, three main problems emerged with early signal implementations. The
    first problem was that signal handlers had to be reinstalled each time they were
    triggered, resulting in a possible (or likely) *race condition*. If a second signal
    was delivered while the first was being handled and before the signal handler
    could be re-installed, the second signal would either be lost or the original,
    unhandled behavior of the signal would occur.


    The second problem with early signal implementations was that they did not provide
    an easy way to pause a process until a signal arrived. As a result, a signal might
    be delivered to a process and it would not realize it. Finally, system calls were
    not restarted automatically if *interrupted* by a signal. The result was an enormous
    burden for programmers. After each system call, they had to check the `errno`
    variable and reissue the system call if `errno` was `EINTR`. Signal implementations
    that *suffer* these shortcomings are classified as *unreliable signals*.


    The POSIX signal API that this chapter covers is considered a *reliable signal*
    API because it remedies these shortcomings. Under POSIX, signal handlers remain
    installed, avoiding the race condition and its consequences. Certain system calls
    restart automatically, relieving the programming burden, and POSIX also provides
    a reliable means to pause a process until a signal is delivered, eliminating the
    problem of missed signals.


    # Available Signals


    Table 5.1 lists all the signals Linux supports.'
