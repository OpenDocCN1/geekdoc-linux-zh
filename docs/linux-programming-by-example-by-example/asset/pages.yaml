- pgno: 191
  md: "**TIP**\nLinux has two commands, `chattr` and `lsattr`, that set and query\
    \ the ext2 special attributes discussed in this section. In short, `chattr` enables\
    \ you to set the special attributes, while `lsattr` displays the special `ext2`\
    \ attributes that are set, if any. In the sample run, the uppercase S indicates\
    \ that the `EXT2_SYNC_FL` (sync) attribute has been set, and the lowercase d indicates\
    \ that the `EXT2_NODUMP_FL` (no-dump) attribute has been set. See `man chattr`\
    \ and `man lsattr` for more details.\n\n# Working with Directories\n\nAlthough\
    \ directories are simply files that contain a list of the files stored in them,\
    \ they have a special programming interface for manipulating them.\n\n# *Changing\
    \ Directories*\n\nThe call to find your current working directory is `getcwd`,\
    \ declared in `<unistd.h>`. Its prototype is as follows:\n\n```\n```c\nchar *getcwd(char\
    \ *buf, size_t size);\n```\n```\n\n`getcwd` copies the absolute pathname of the\
    \ current working directory to `buf`, which is `size` bytes long. If `buf` is\
    \ not large enough to hold the pathname, `getcwd` returns `NULL` and sets `errno`\
    \ to `ERANGE`. If this occurs, increase the size of `buf` and try again. As an\
    \ alternative, if `buf` is `NULL` and `size` is less than `O_`, `getcwd` will\
    \ use `malloc` to dynamically allocate sufficient memory for `buf`. If you take\
    \ advantage of this extension, you must remember to free the buffer to prevent\
    \ memory leaks.\n\nTo change the current directory, use either the `chdir` or\
    \ `fchdir` routines, prototyped in `<unistd.h>` as\n\n```\n```c\nint chdir(const\
    \ char *path);\nint fchdir(int fd);\n```\n```\n\n`chdir` changes the current directory\
    \ to that contained in `path`. `fchdir` works the same way, except that it must\
    \ be passed an open file descriptor `fd`.\n\n# *Examples*\n\n![](img/be588b36b489136ce784030a08a1d3d4_191_0.png)\n\
    \n# Example\n\n+   1. This program, `cwd`, uses `getcwd`, using both of the methods\
    \ for allocating storage to hold the directory name discussed previously to return\
    \ its current working directory.\n\n```\n```c\n/*\n * cwd.c - Print the current\
    \ working directory\n */\n#include <unistd.h>\n#include <stdlib.h>\n#include <stdio.h>\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 192
  md: "```\n#include <errno.h>\n\n#define BUFSZ 10\n\nint main(void)\n{\n    char\
    \ *statbuf = malloc(BUFSZ);\n    char *nullbuf = NULL;\n    int i = 1;\n    /*\
    \ Statically allocate the buffer */\n    while((getcwd(statbuf, i * BUFSZ)) ==\
    \ NULL) {\n        ++i;\n        statbuf = realloc(statbuf, i * BUFSZ);\n    }\n\
    \    fprintf(stdout, \"%d calls to realloc\\n\", i - 1);\n    fprintf(stdout,\
    \ \"current dir is %s\\n\", statbuf);\n    free(statbuf);\n\n    /* Let getcwd\
    \ allocate the memory */\n    printf(\"current dir is %s\\n\", getcwd(nullbuf,\
    \ -1));\n    /* Have to free nullbuf to prevent a memory leak */\n    free(nullbuf);\n\
    \    exit(EXIT_SUCCESS);\n}\n```\n\n![](img/be588b36b489136ce784030a08a1d3d4_192_0.png)\n\
    \n# **Output**\n\nThe output from this program should resemble the following:\n\
    \n```\n$  ./cwd\n3 calls to realloc\ncurrent dir is /usr/local/newprojects/lpe/08/src\n\
    current dir is /usr/local/newprojects/lpe/08/src\n```\n\nThe while loop continuously\
    \ increases the memory allocated to statbuf until getcwd returns NULL. The second\
    \ code block illustrates using getcwd's alternative behavior. By using a buffer\
    \ size of -1 and making the buffer itself NULL, the call still succeeds because\
    \ it dynamically makes nullbuf big enough to hold the path. Because both statbuf\
    \ and nullbuf are allocated off the heap, free properly releases their memory\
    \ resources."
