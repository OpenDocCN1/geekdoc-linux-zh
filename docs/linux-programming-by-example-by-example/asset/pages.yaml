  md: "# **1—\nCompiling Programs**\n\nGNU cc (*gcc*) is the GNU project’s compiler\
    \ suite. It compiles programs written in C, C++, or Objective C. *gcc* also compiles\
    \ FORTRAN (under the auspices of *g77*). This chapter focuses on the C compiler\
    \ because C is Linux’s *lingua franca*. The chapter also covers the differences\
    \ between *gcc* and *egcs* version 1.1.2, the Experimental GNU Compiler Suite.\n\
    \nTopics covered in this chapter include\n\n+   • Invoking *gcc*\n+   \n+   •\
    \ Options and arguments to control *gcc*’s behavior\n+   \n+   • Compiling multiple\
    \ source files\n+   \n+   • Using *gcc*’s optimization features\n+   \n+   • Using\
    \ *gcc*’s debugging features\n+   \n+   • Handling compilation errors\n+   \n\
    +   • GNU extensions to the C language\n+   \n+   • The new C compiler, *egcs*"
  merge: -1
