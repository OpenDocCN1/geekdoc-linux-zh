    This chapter introduces ncurses (pronounced "en-curses"), the free implementation
    of the classic UNIX screen-handling library, curses, ncurses provides a simple,
    high-level interface for screen control and manipulation. It also contains powerful
    routines for handling keyboard and mouse input, creating and managing multiple
    windows, and using menus, forms, and panels. Topics this chapter include the following:


