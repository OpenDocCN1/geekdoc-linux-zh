    );\n/* Valid hostname, so . . . */\nprintf(\"host info for %s\\n\", argv[1]);\n\
    /* The canonical hostname */\nprintf(\"name: %s\\n\", buf->h_name);\n/* All of\
    \ the aliases */\nputs(\"aliases:\");\npalias = buf->h_aliases;\nwhile(*palias)\
