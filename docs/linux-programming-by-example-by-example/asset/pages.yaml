- pgno: 382
  md: "support or the number of active processes the system permits. Third, despite\
    \ being a limited resource, IPC structures do not maintain a reference count,\
    \ which is a counter of the number of processes using the structure. As a result,\
    \ System V IPC has no automatic means of reclaiming abandoned IPC structures.\n\
    \nFor example, if a process creates a structure, places data in it, and then terminates\
    \ without properly deleting the structure and its associated data, the structure\
    \ remains in place until one of the following occurs:\n\n+   - The system is rebooted\n\
    +   \n+   - It is specifically deleted using the `ipcrm(1)` command\n+   \n+ \
    \  - Another process, with appropriate access permissions, reads the data or deletes\
    \ it, or both\n\nThis shortcoming constitutes a significant design defect.\n\n\
    Finally, IPC structures, as noted earlier, exist only in the kernel; they are\
    \ unknown to the filesystem. As a result, I/O to them requires learning yet another\
    \ programming interface. Lacking file descriptors, you cannot use multiplexed\
    \ I/O through the select system call. If a process must wait for I/O on an IPC\
    \ structure, it must use some sort of busy-wait loop. A busy-wait loop— a loop\
    \ that continuously checks for some changed condition—is a poor programming practice\
    \ almost any time because it needlessly consumes CPU cycles. The busy-wait loop\
    \ is especially pernicious under Linux, which has several methods for implementing\
    \ non-busy waits, such as blocking I/O, the select system call, and signals.\n\
    \n+   - To review multiplexed I/O and the select system call, see \"I/O Multiplexing,\"\
    \ page 169.\n\n# Understanding Shared Memory\n\nShared memory is a memory region\
    \ (a segment) set aside by the kernel for the purpose of information exchange\
    \ between multiple processes. Provided the segment's permissions are appropriately\
    \ set, each process desiring to access the segment may map the segment into its\
    \ own private address space. If one process updates the data in the segment, that\
    \ update is immediately visible to other processes. A segment created by one process\
    \ can be read or written (or both) by other processes. The name, shared memory,\
    \ conveys the fact that multiple processes may share access to the segment and\
    \ the information it contains.\n\nEach process receives its own mapping of the\
    \ shared memory into its address space. In fact, shared memory conceptually resembles\
    \ memory mapped files. Shared memory is illustrated in Figure 16.2."
