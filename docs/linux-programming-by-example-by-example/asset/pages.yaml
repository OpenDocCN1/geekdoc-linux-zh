  md: "structure. If these two values are equal, `find_recs` concludes that the key\
    \ is a valid match.\n\n`count_recs` simply iterates through the database and increments\
    \ a counter for each record that it encounters. It is one of the functions that\
    \ returns a positive, non-zero integer when it succeeds. The Berkeley db API does\
    \ not keep track of how many records exist in a B-tree database. `count_recs`\
    \ makes it much easier to implement the `list_recs` function because it enables\
    \ you to create a table that contains the correct number of pointers to key/value\
    \ pairs. After this table's pointers are created, it is trivial to initialize\
    \ each key/value pair properly.\n\nThe `DB_DBT_MALLOC` flag passed to `db->get`\
    \ must be mentioned. Ordinarily, when you call `db->get`, the memory to which\
    \ `&key` and `&value` point is valid until the next call to any Berkeley db function\
    \ that uses the db handle. `DB_DBT_MALLOC`, however, alters this behavior. When\
    \ this flag is passed to `db->get` and `dbc->c_get` (the cursor function), Berkeley\
    \ db allocates memory for `key` and `value` to make the storage permanent. As\
    \ a result, `free`ing this memory becomes the responsibility of the application.\n\
    \n`list_recs` needs this functionality because, without `DB_DBT_MALLOC`, the storage\
    \ associated with `key` and `value` goes away after exiting the function because\
    \ they are automatic variables that go out of scope at the closing brace. `list_recs`,\
    \ like `count_recs`, returns a positive non-zero integer on success.\n\n```\n\"\
