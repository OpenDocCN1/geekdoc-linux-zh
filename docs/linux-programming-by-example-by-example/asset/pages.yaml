- pgno: 150
  md: '# # Understanding System Calls


    In this section, you learn what system calls are, what they are used for, and
    why you would use them.


    # ## What Is a System Call?


    Obviously, a running Linux system is made up of many hundreds of pieces of code,
    such as utility and application programs, libraries, device drivers, filesystems,
    compilers, GUI interfaces, window managers, and, of course, the kernel itself.
    However, all of this code executes in one of two modes, user mode or kernel mode.


    Unless you become a kernel hacker or write device drivers, all of the code you
    write will run in **user mode**. Programs running in user mode take advantage
    of both software and processor features to protect themselves from other misbehaving
    applications—generally, the memory and resources allocated to application A cannot
    be accessed by application B. At the same time, user mode programs are strictly
    prohibited from damaging the system itself.


    **Kernel mode** code, while protected from the ravages of poorly written user
    mode programs, has complete access to the entire system. It can use, or break,
    anything. Examples of kernel mode code include device drivers, filesystems, and,
    naturally, the kernel itself. Consider a device driver, for example. In order
    to function properly, it needs complete access to the physical device it controls,
    such as a disk drive, as well as to the code and data associated with that device.
    At the same time however, the device has to be protected from psychopathic programs
    that might potentially corrupt this code and data, or might even damage the physical
    device somehow. Thus, device drivers must run in kernel mode.


    Simply stated, the Linux kernel''s job is to provide a variety of services to
    application programs while maintaining the integrity of the system. Put another
    way, user mode code (applications) requests various services from kernel mode
    code (memory managers, device drivers, and so forth). System calls are the method
    by which code requests these services from the protected code running in kernel
    mode.


    By design, system calls look like standard C functions. Because of the barrier
    erected between kernel and user mode, the interface that allows user code to cross
    this barrier is pretty ugly. Functions in the standard C library hide this ugly,
    awkward interface. User code calls the library functions, which are wrappers around
    the actual system call.'
