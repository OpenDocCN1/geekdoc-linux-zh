    \ Linux programmer!\\n\");\n    exit(EXIT_SUCCESS);\n}\n```\n\nThe `$Log$` keyword\
    \ makes it convenient to see the changes made to a given file while working within\
    \ that file. When read from top to bottom, the change history lists the most recent\
    \ changes first.\n\n# Other RCS Keywords\n\nTable 19.2 lists other RCS keywords\
    \ and how RCS expands each of them.\n\n**Table 19.2: RCS Keywords**\n| Keyword\
    \ | Description |\n|---|---|\n| `$Authors$` | Login name of user who checked in\
    \ the revision |\n| `$Date$` | Date and time revision was checked, in UTC format\
    \ |\n| `$Header$` | Full pathname of the RCS file, the revision number, date,\
    \ time, author, state, and locker (if locked) |\n| `$Locker$` | Login name of\
