- pgno: 488
  md: '# ## Using tar and gzip


    `tar` and `gzip` were for many years the standard UNIX utilities for creating
    and distributing source code. For many people, they still are. They have limitations,
    however, when it comes to maintaining system integrity, particularly because they
    don''t have a built-in facility for managing version control or checking software
    dependencies. This should not be seen, however, as `tar` or `gzip`''s shortcoming.
    The assumption behind software distribution using `tar`, `gzip`, and `install`
    is that the user or system administrator will take care of versioning and dependencies.


    # ## tar Usage


    `tar`, which stands for *Tape ARChiver*, creates, manages, and extracts multfile
    archives, known as *tarfiles*, or, more affectionately and idiomatically, *tarballs*.
    `tar` is the traditional utility used to create archives. `tar` is blessed (or
    plagned, depending on your perspective) with a bewildering variety of command-line
    options and switches.


    > NOTE

    > Long-time UNIX users will notice the absence of the `cpio` command. Why? The
    Linux idiom is to use `tar` (and `gzip`) to create multiple file archives for
    distributing software. `cpio`, when it is used at all, is used to create and manage
    system backups. Indeed, in the seven years I have been using Linux, I have never
    encountered any software that was packaged using `cpio`. That is not to say it
    does not happen, of course. I just have not run across it.


    This chapter attempts to manage the confusion by focusing on simple, typical usage
    as related to the creation and management of software distribution. Table 21.1
    lists some of `tar`''s command-line options, which subsequent sections discuss
    in more detail.


    Table 21.1: `tar` Command-Line Options


    | Option | Description |

    | :----- | :---------- |

    | c | Creates an archive |

    | f *archive_name* | A required argument, f *archive_name* tells tar the name
    of the tarball with which to work |

    | r | Appends files to the archive |

    | u | Updates existing files in the archive |

    | t | Lists the contents of the archive |

    | v | Generates verbose output |

    | z | Creates or works with a compressed archive (`gzip` is the default compression
    utility) |'
  merge: -1
  img_proc: true
- pgno: 489
  md: '# Invoking tar


    In its simplest form, the command to create a tarball is


    ```

    $ tar cf archivename filelist

    ```


    `c` says to create a tarball from the files indicated by `filelist`. `f` says
    to name the tarball `archivename`. You will generally want to compress the tarball
    to conserve disk space and minimize download time. The easiest way to do so, using
    GNU''s `tar`, is to add `z` to the option list, which causes `tar` to invoke another
    GNU utility, `gzip`, on the tarball to compress it. In this case, the invocation
    would look like the following:


    ```

    $ tar czf archivename filelist

    ```


    ![](img/be588b36b489136ce784030a08a1d3d4_489_0.png)


    # Examples


    +   1. The following `tar` invocation creates a tarball named `mytar.tar` from
    all the files in the `/etc` directory that end in `.conf`:


    ![](img/be588b36b489136ce784030a08a1d3d4_489_1.png)


    # Output


    ```

    $ tar cf mytar.tar /etc/*.conf

    tar: Cannot add file /etc/amd.conf: Permission denied

    tar: Removing leading ''/'' from absolute path names in the archive

    tar: Cannot add file /etc/quota.conf: Permission denied

    tar: Error exit delayed from previous errors

    ```


    You might get errors because mortal users do not have access to certain files.
    In this case, `tar` will not add that file to the archive, but otherwise the archive
    will still be created.


    ![](img/be588b36b489136ce784030a08a1d3d4_489_2.png)


    # Example


    +   2. To list the contents of the archive, use the following command:


    ![](img/be588b36b489136ce784030a08a1d3d4_489_3.png)


    # Output'
  merge: -1
  img_proc: true
