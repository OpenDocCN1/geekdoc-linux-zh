- pgno: 267
  md: "All the listed functions copy `chstr` onto the desired window beginning at\
    \ the cursor's location, but the cursor is not advanced (unlike the character\
    \ output functions). If the string will not fit on the current line, it is truncated\
    \ at the right margin. The four routines taking an `int n` argument—`addchnstr`,\
    \ `waddchnstr`, `mvaddchnstr`, and `mvwaddchnstr`—copy a limit of up to `n` characters,\
    \ stopping at the right margin. If `n` is -1, the entire string will be copied,\
    \ but truncated at the right margin as necessary.\n\nThe next set of string output\
    \ functions operates on null-terminated strings. Unlike the previous set, these\
    \ functions advance the cursor. In addition, the string output will wrap at the\
    \ right margin, rather than being truncated. Otherwise, the calls behave like\
    \ their similarly named `ctype` counterparts.\n\n```\nint addstr(const char *str);\n\
    int addnstr(const char *str, int n);\nint waddstr(WINDOW *win, const char *str);\n\
    int waddnstr(WINDOW *win, const char *str, int n);\nint mvaddstr(int y, int x,\
