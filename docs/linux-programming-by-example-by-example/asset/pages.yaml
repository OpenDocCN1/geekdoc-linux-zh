    struct stat {

    dev_t st_dev; /* device */

    ino_t st_ino; /* inode number */

    mode_t st_mod; /* file mode */

    nlink_t st_nlink; /* number of hard links */

    uid_t st_uid; /* owner''s GID */

    gid_t st_gid; /* owner''s GID */

    dev_t st_rdev; /* device type */

    off_t st_size; /* total size in bytes */

    unsigned long st_blksize; /* preferred blocksize */

    unsigned long st_blocks; /* number of 512-byte blocks */

    time_t st_atime; /* time last accessed */

    time_t st_mtime; /* time last modified */

    time_t st_ctime; /* time last changed */

    };

    ```


    The st_blksize member states the preferred block size for filesystem I/O. Using
    smaller chunks may result in inefficient I/O operations to the disk. Last access
    time, the atime, is changed by the mknod, utime, read, write, and truncate calls.
    The mknod, utime, and write calls also change last modification time, called the
    mtime. The ctime, the last change time, stores the last time that inode information
    was changed, including owner, group, link count, and mode information.


    Using the information in the stat structure, you can implement your own stat function,
    as the sample program in the next section shows.


    You will also want to use several macros to make sense of the file mode. The POSIX
    standard defines seven macros that decode a file''s mode to deduce its type. They
    are listed in Table 7.4.


    Table 7.4: File Type Macros

    | Macro | Description |

    | --- | --- |

    | S_ISLNK(mode) | Returns true if the file is a symbolic link |

    | S_ISREG(mode) | Returns true if the file is a regular file |

    | S_ISDIR(mode) | Returns true if the file is a directory |

    | S_ISCHR(mode) | Returns true if the file is a character device |

    | S_ISBLK(mode) | Returns true if the file is a block device |

    | S_ISFIFO(mode) | Returns true if the file is a FIFO |

    | S_ISSOCK(mode) | Returns true if the file is a socket |'
