- pgno: 468
  md: '# **Starting gdb**


    To start a debugging session, simply type `gdb` `progname`[`corefile`], replacing
    `progname` with the name of the program you want to debug. Using a core file is
    optional but will enhance `gdb`''s debugging capabilities. The first step is to
    start `gdb`, using the program name, `debugme`, and the core file, `core`, as
    arguments. To exit `gdb`, type `quit` at the `(gdb)` prompt.


    ```

    ```

    $ gdb -q debugme core

    ```

    ```


    The screen should resemble Figure 20.1 after `gdb` initializes.


    ![](img/be588b36b489136ce784030a08a1d3d4_468_0.png)


    # **Output**


    ![](img/be588b36b489136ce784030a08a1d3d4_468_1.png)


    **Figure 20.1:** The `gdb` start-up screen.


    The `-q` option suppressed annoying licensing messages. Another useful command-line
    option is `-d` `dirname`, where `dirname` is the name of a directory. This tells
    `gdb` where to find source code (it looks in the current working directory by
    default). As you can see in Figure 20.1, `gdb` displays the executable that created
    the core file and why the program terminated. In this case, the program caused
    a signal 11, which is a segmentation fault. It also helpfully displays the function
    it was executing and the line it believes caused the fault.


    # **Running a Program in the Debugger**'
