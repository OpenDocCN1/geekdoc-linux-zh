    disturbing the placement of other characters already present. Another group of
    routines inserts characters at arbitrary locations in existing window text. These
    functions include `insch`, `winsch`, `mvinsch`, and `mvwinsch`.


    Following the naming convention discussed earlier in this chapter, each of these
    functions inserts a character before (in front of) the character under the cursor,
    shifting the following characters to the right one position. If the right-most
    character is on the right margin, it will be lost. Note, however, that the cursor
    position does not change after an insert operation. Insertions are completely
    documented in the `curs_insch(3)` manual page. The prototypes of the functions
    mentioned so far are in the following list:


    ```

    ```

    int addch ( chtype ch );

    int waddch ( WINDOW *win, chtype ch );

    int mvaddch ( int y, int x, chtype ch );

    int mvwaddch ( WINDOW *win, int y, int x, chtype ch );

    int echochar ( chtype ch );

    int wechochar ( WINDOW *win, chtype ch );

    int insch ( chtype ch );

    int winsch ( WINDOW *win, chtype ch );

    int mvinsch ( int y, int x, chtype ch );

    int mvwinsch ( WINDOW *win, int y, int x, chtype ch );

    ```

    ```


    Unless noted otherwise, all functions that return an integer return OK on success
    or ERR on failure (OK and ERR are respectively a number of other constants are
    defined in `ncurses.h`). The arguments win, y, x, and ch are, respectively, the
    window in which the character will be displayed, the y and x coordinates at which
    to locate the cursor, and the character (including optional attributes) to display.'
