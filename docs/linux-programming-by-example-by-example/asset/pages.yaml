    \ `lpeplay` opens the sample file and repeatedly reads a block from the file and\
    \ writes it to the output device until it reaches EOF, at which point it closes\
    \ the file descriptors and terminates.\n\nOutput from a sample run on your system\
    \ should resemble the following, followed by a few seconds of sound:\n\n![](img/be588b36b489136ce784030a08a1d3d4_331_0.png)\n\
    \n# Output\n\n```\n$ ./lpeplay\nCurrent settings for /dev/dsp:\n\tAFMT_MU_LAW\n\
    \tAFMT_U8\n\tAFMT_S16_LE\nSet MONO mode\nSPEED 8000 Hz\n```\n\n> **NOTE**\n> Several\
    \ sample sounds, including 8000.wav, are available from the Web site for this\
    \ book. 8000.wav must be in the same directory as the binary for `lpeplay` to\
    \ work.\n\n# Advanced Audio Programming\n\nMost of the capabilities and features\
    \ discussed so far are common across sound cards. This section looks at features\
    \ that might or might not be present in a sound card.\n\nOne `ioctl` call exists\
    \ that can be used to check for the availability of certain advanced sound hardware\
    \ features: `SNCTL_DSP_GETCAPS`. It is used as follows:\n\n```\nint caps;\niocl(fd,\
    \ SNCTI_DSP_GETCAPS, &caps);\n```\n\n`caps` will be set to a bitmask that describes\
    \ available features. The possible bits are listed in Table 13.3."
