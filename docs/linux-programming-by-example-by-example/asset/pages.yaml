    # Using RPM


    The Red Hat Package Manager, although it bears Red Hat''s name, is a powerful,
    general, and open software packaging system used by many Linux distributions,
    including (but not limited to) Caldera''s OpenLinux, S.u.S.E., and, of course,
    Red Hat. It is most frequently used for Linux, but versions of it are available
    for many UNIX versions, including Solaris, SunOS, HP-UX, SCO, AIX, and Digital
    UNIX.


    The discussion of RPM in this chapter focuses on creating source code packages.
    If you are interested in mundane issues such as installing, upgrading, and removing
    RPMs, read Ed Bailey''s excellent book, *Maximum RPM*. Point your browser at http://www.rpm.org/
    to download the latest version of RPM, to obtain complete documentation, FAQs
    and HOWTOs, and even to get a downloadable version of the book.


    > NOTE

    > You are strongly encouraged to purchase *Maximum RPM* and reward both author
    and publisher for making it freely available. You will likely find that having
    hard copy is preferable to looking at a soft copy.


    # Minimum Requirements


    To create RPMs, you need RPM itself, the source code you want to compile, an *rpmrc*
    file to set some RPM defaults and control its behavior, and a spec file to control
    the package build process. You should already have a functional development environment
    (compilers, tools, editors, cold pizza, Jolt cola, coffee, and such) and your
    source code should compile successfully.


    Before proceeding, however, it is essential to convey the mindset behind RPM.
    RPM always begins with pristine sources. *Pristine*, in this context, means original,
    unpatched code as it came from the developer. RPM is designed to allow you to
    apply patches to the original source code. This feature enables you to use RPM
    to customize software to a specific system or to apply bug fixes.'
  merge: -1
  img_proc: true
- pgno: 498
  md: 'The emphasis on unmodified sources allows you or your users always to begin
    a build from a known base and to customize it to fit particular circumstances.
    As a developer, this gives you considerable flexibility with respect to creating
    useful and reliable software and also a valuable level of control over how your
    software gets compiled and installed.


    To boil it down to two simple rules:


    +   1. Always start creating an RPM with unmodified sources.

    +   2. Apply patches as necessary to fit the build environment.


    # ## Creating an RPM


    Creating an RPM the first time can be somewhat daunting. Fortunately, most of
    the work is on the front end. The most important part of creating an RPM, generating
    a spec file, must be done only once. After the spec file has been created, you
    spend most of your time doing what you want to do, maintaining the code. Only
    minor modifications to the spec file are necessary.


    # ## Configuring RPM


    The `rpmlc` file controls almost every element of RPM''s behavior. Your system
    administrator might have a global `rpmlc` file in `/etc`. If you would like to
    override one or more of the global settings, create a `~/.rpmlc` that contains
    your preferred settings. Before you begin, however, you may want see RPM''s current
    configuration. `rpm --showrc` accomplishes this.


    ![](img/be588b36b489136ce784030a08a1d3d4_498_0.png)


    # ## Examples


    +   1. This is the default configuration for RPM version 3.0.2 on Red Hat 6.0:


    ![](img/be588b36b489136ce784030a08a1d3d4_498_1.png)


    # ## Output


    ```

    ```

    $rpm --showrc

    ARCHITECTURE AND OS:

    build arch          : i386

    compatible build archs: i686 i586 i486 i386 noarch

    build os            : Linux

    compatible build os''s: Linux

    install arch        : i686

    install os          : Linux

    compatible archs    : i686 i586 i486 i386 noarch

    compatible os''s     : Linux


    RPMRC VALUES:

    macrofiles        : /usr/lib/rpm/macros

    : /usr/lib/rpm/i686-linux/macros : /etc/rpm/macros

    ```

    ```'
