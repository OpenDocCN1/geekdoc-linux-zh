  md: '# ## 13—

    ## The Sound API:

    ## OSS/Free


    Not too long ago, sound cards were available only as add-on devices installed
    after the purchase of a PC. Now, even so-called "business PCs" have some form
    of minimal sound hardware on the motherboard. This chapter teaches you the basics
    of programming your sound card. It offers a brief overview of sound card technology,
    and then moves on to discuss Linux''s sound API. The following topics are discussed
    in this chapter:


    +   * Describing sound hardware

    +   * General guidelines for programming sound hardware

    +   * Manipulating mixer devices

    +   * Programming MIDI hardware

    +   * Writing sound playback programs

    +   * Introducing advanced sound capabilities'
