    \ ownership of IPC structures.\n\n• For a quick refresher on file modes, see \"\
    The File Mode,\" page 134.\n\n# ### Problems with System V IPC\n\nSystem V IPC\
    \ has several shortcomings. First, the programmatic interface is complex compared\
