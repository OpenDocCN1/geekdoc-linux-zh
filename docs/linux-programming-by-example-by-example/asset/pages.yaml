- pgno: 507
  md: "# The Code, Module by Module\n\nAs mentioned in Chapter 3, the user-level programs,\
    \ `mcdcli.c` and `mcdui.c`, rely heavily on the helper module `mcddb.c`. It seems\
    \ sensible, then, to spend some time looking at the helper module, because it\
    \ makes possible most of the user program's functionality. I call it the database\
    \ manager because it handles almost all the interaction with the underlying database\
    \ and the Berkeley database API. The header and source file follow:\n\n```\n/*\n\
    \ * mcddb.h - Database module for Music CD database\n */\n#define MCDB_H_\n#define\
    \ MCDB_H_\n\n#include <db.h>\n\n/*\n * Open the database named in dbpath, or,\
    \ if it is NULL, assume that\n * we want PWD/mcd.db. Return 0 on success, errno\
    \ or -1 on failure.\n */\nint open_db(char *dbpath);\n\n/*\n * Sync and close\
    \ the currently open database. Always returns 0.\n */\nint close_db(void);\n\n\
    /*\n * Add the record with a key of kbuf and a value of vbuf to the\n * currently\
    \ opened database. Returns 0 on success, 1 if the key\n * already exists, and\
    \ errno otherwise.\n */\nint add_rec(char *kbuf, char *vbuf);\n\n/*\n * Delete\
    \ the record whose key matches kbuf. On success, syncs the\n * database to disk\
    \ and returns 0; on failure, returns 1 if a key\n * matching kbuf was not found\
    \ or errno otherwise.\n\n```"
  merge: -1
  img_proc: true
