- pgno: 232
  md: '# # 10—

    # The Database API


    Application programmers often must store their data in a database without requiring
    all the services (or wanting all the overhead) of a full-strength relational database
    such as Informix or Oracle. This chapter teaches you how to use the Berkeley database,
    an embeddable database library standard in major Linux distributions. The version
    discussed in this chapter is 2.7.7, but the discussion applies to any 2.x version.
    Note that the 2.x API incorporates all the features of the 1.x API, but also adds
    many elements. The following topics are covered in this chapter:


    +   - Creating a new database

    +   - Opening an existing database

    +   - Adding and deleting records

    +   - Retrieving records

    +   - Searching for a record

    +   - Moving around in a database

    +   - Closing a database'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'NOTE

    A complete source code distribution of version 2.7.5 of the Berkeley database
    is available on the Web site accompanying this book. All the examples in this
    book were built using a copy of the header file and library in the chapter’s source
    code directory.


    # The Berkeley Database


    The Berkeley database, often called Berkeley DB or just plain DB, uses key/value
    pairs to work with elements in the database. The key is the identifying element;
    the value is the data element. To find the data you want, present DB with a key
    and DB will return the value associated with it. The key/value pair is stored
    in a simple structure called a DBT—a Data Base Thang—that consists of a memory
    reference—that is, a pointer—and the length of the memory reference, measured
    in bytes. The key and value can be any kind of data. The length of the stored
    data is practically unlimited—a single key or value must fit into a system’s available
    memory (physical RAM).


    For example, if you wanted to create a database of the chapters of this book,
    the key/value pairs might look like the following:


    | Key  | Value                                          |

    | ---- | ---------------------------------------------- |

    | One  | Compiling Programs                               |

    | Two  | Controlling the Build Process: GNU make          |

    | Three| About the Project                                |

    | Four | Processes                                        |

    | Five | Signals                                          |


    DB databases support three types of storage and access methods: B+trees, hashes,
    and records. Record-based databases store data of fixed or variable length in
    sequential order; new records can be inserted between existing records or appended
    to the end of a series of existing records. Hash-based databases store records
    in a hash table for fast searching. The hash function may be supplied by the programmer,
    or you can use the built-in default routine. B+tree databases store data in sorted
    order. The sort order is determined by a programmer-supplied function or by a
    default function that sorts keys lexicographically. Figure 10.1 shows how the
    three types of storage and access methods are related.'
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/be588b36b489136ce784030a08a1d3d4_234_0.png)


    Figure 10.1

    How records are stored in Berkeley DB databases.


    The actual implementation of the storage and access methods DB supports are beyond
    this book’s scope (indeed, many computer scientists devote their entire careers
    to studying sorting and searching algorithms), but the basic principles are simple.
    Figure 10.1 assumes a database containing eight records, denoted by the numbers
    one through eight. A B+tree database stores data in a tree-like structure, as
    shown in Figure 10.1, that makes locating a specific record extremely fast and
    efficient. Hash-based databases store data in a table. The location of an individual
    record in the table depends on an arbitrary value that is computed based on the
    record’s key. Record number-oriented databases store records in sequential order.
    They are accessed and manipulated by their record number.


    # Creating, Opening, and Closing a Database


    To use DB, include <db.h> in your source code and link against libdb. a (-lbd).
    Every DB function returns zero DB on success and a nonzero value on any failure.
    In the event of a system error, such as an illegal argument or a disk error, DB
    returns an errno value that can be used with the perror function. Other return
    codes will be documented as the functions that generate them are discussed.'
  merge: -1
  img_proc: true
- pgno: 235
  md: "# Creating and Opening a Database\n\nThe function for creating a DB database\
    \ is the same as for opening one, db_open. If the specified database does not\
    \ exist, it will be created and then opened. The syntax for db_open is as follows:\n\
    \n```\nint db_open(const char *file, DBTYPE type, u_int32_t flags, int mode,\n\
    \        DB_ENV *dbenv, DB_INFO *dbInfo, DB **dbpp);\n```\n\nfile is the pathname\
    \ of the database to open. type indicates the access method, either DB_BTREE,\
    \ DB_HASH, or DB_RECNO. Use DB_UNKNOWN to open an existing database if you do\
    \ not know its type. flags modifies db_open’s behavior. DB_CREATE creates any\
    \ necessary files if they do not already exist. DB_RDONLY opens the database read-only\
    \ (any write attempts will fail), and DB_TRUNCATE will logically zero the database\
    \ if it exists. The mode argument is an octal value specifying the database file’s\
    \ access permissions. It is similar to the mode argument required by the open\
    \ system call.\n\n+   * The open system call and its mode argument is covered\
    \ in the section \"The File Mode,\" page 134.\n\nThe dbenv and dbInfo parameters\
    \ control advanced features of DB’s behavior that are beyond the scope of this\
    \ book and will not be covered. Pass NULL for these two arguments to obtain DB’s\
    \ default behavior. dbpp, finally, is a handle to the database opened, a pointer\
    \ to a pointer to a DB (database) structure. It will be initialized to the appropriate\
    \ value or NULL on failure.\n\nThe handle that db_open initializes is the key\
    \ to all subsequent database operations because almost all the Berkeley DB interface\
    \ takes place using function pointers contained in the handle.\n\n# Closing a\
    \ Database\n\nTo close a database, use the close function. It is prototyped as\
    \ follows:\n\n```\nint DB->close(DB *db, u_int32_t flags);\n```\n\ndb is a handle\
    \ previously returned by a db_open call. flags should be 0 or DB_NOSYNC. DB_NOSYNC\
    \ tells DB not to sync, or flush, cached database data to disk before closing\
    \ the database. If flags is 0, cached data will be written to disk.\n\n> CAUTION\n\
    > DB_NOSYNC is a bad option! Berkeley DB maintains information in its own cache\
    \ and writes it out independently of the kernel. Failure to synchronize the cached\
    \ information will result in unreliable, inconsistent, or corrupt data."
  merge: -1
  img_proc: true
- pgno: 236
  md: "# Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_236_0.png)\n\n# ## Example\n\
    \nThis program, *opendb*, opens and closes a database in the current working directory.\n\
    \n```\n```\n/*\n * opendb.c Opening a Berkeley DB database\n */\n#include <stdlib.h>\n\
    #include <stdio.h>\n#include <errno.h>\n#include \"db.h\"\n\nint main(void)\n\
    {\n    DB *db;\n    int ret;\n\n    ret = db_open(\"test.db\", DB_BTREE,\n   \
    \                DB_CREATE, 0600, NULL, NULL, &db);\n    if (ret) {\n        perror(\"\
    db_open\");\n        exit(EXIT_FAILURE);\n    }\n\n    db->close(db, 0);\n   \
    \ exit(EXIT_SUCCESS);\n}\n```\n```\n\nThe `db_open` call attempts to open a B+tree\
    \ database named `test.db` in the current directory. If the database does not\
    \ already exist, the `DB_CREATE` flag tells DB to create the file. After opening\
    \ (or creating, if necessary) the database, the `db_close` call closes the database.\
    \ *opendb* has no output, but a quick `ls` in the current working directory reveals\
    \ that `test.db` has been created. Although the `test.db` file will not have any\
    \ records stored in it, Berkeley DB writes some administrative information into\
    \ the file when it is created. You do not need to worry about this, though, because\
    \ it is information that the DB API uses."
  merge: -1
  img_proc: true
- pgno: 237
  md: '# ## Storing Items in a Database


    To add data to a database, use the `put` function, prototyped as follows:


    ```

    ```

    int DB->put(DB *db, DB_TXN *txnid, DBT *key, DBT *data, u_int32_t flags);

    ```

    ```


    `db` is a handle to a database previously returned by `db_open`; `txnid` is a
    transaction ID, an advanced feature not covered here, so set it to `NULL`. `flags`
    must be one of `O,` which allows an existing record with the same key to be overwritten;
    `DB_NOOVERWRITE,` which disallows the `put` if a key/value pair with the same
    key is already present; or `DB_APPEND,` which applies only to databases of type
    `DB_RECNO.` `put` returns `DB_KEYEXIST` if the key is already present; the standard
    return codes also apply.


    To ensure compatibility with future versions of Berkeley DB, you should always
    initialize the `key` and `value` arguments before using them. The easiest way
    to do so is to use the `memset` call from the standard C library. For example,
    suppose you need to use a key named `dbkey` in a program. Before using it, initialize
    it as the following code snippet illustrates:


    ```

    ```

    DBT dbkey;

    memset (&dbkey, 0, sizeof (DBT *));

    ```

    ```


    In this example, `memset` sets the value of all memory blocks associated with
    `DBT` to zero.


    # ## Example


    ![](img/be588b36b489136ce784030a08a1d3d4_237_0.png)


    # ## Example


    The next example adds a record to the database created by `opendb`:


    ```

    ```

    /*

    * adddb.c - Add a record to a Berkeley DB database

    */

    #include <stdlib.h>

    #include <stdio.h>

    #include <errno.h>

    #include "db.h"


    int main(void)

    {

    DB *db;

    int ret, i = 0;

    DBT key, value;


    ret = db_open("test.db", DB_BTREE,

    DB_CREATE, 0600, NULL, NULL, &db);

    ```

    ```'
