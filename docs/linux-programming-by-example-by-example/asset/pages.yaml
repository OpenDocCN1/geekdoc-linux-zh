  img_proc: true
- pgno: 318
  md: 'volume control. Generally, you should use the query macros first to establish
    the capabilities, or perhaps merely the presence, of a sound device before beginning
    to manipulate it.


    Regarding the mixer, the sound API abstracts its capabilities into a set of channels,
    so the first thing you have to do is find out how many channels are available
    and what they are. Table 13.1 provides a partial list of the most common channels
    (a complete list is contained in `<sys/soundcard.h>`).


    # Table 13.1: Common Mixer Channels


    | Channel | Description |

    |---|---|

    | SOUND_MIXER_VOLUME | Master output level |

    | SOUND_MIXER_BASS | Bass level of all output channels |

    | SOUND_MIXER_TREBLE | Treble level of all output channels |

    | SOUND_MIXER_SYNTH | Volume control of all synthesizer input such as the FM chip
    or the wave table |

    | SOUND_MIXER_PCM | Output level of the audio devices /dev/audio and /dev/dsp
    |

    | SOUND_MIXER_SPEAKER | Output level for the PC speaker, if it is connected directly
    to the sound card |

    | SOUND_MIXER_LINE | Volume level for the line in jack |

    | SOUND_MIXER_MIC | Volume level for microphone input |

    | SOUND_MIXER_CD | Volume level for audio CD input |

    | SOUND_MIXER_ALTPCM | Volume level for alternate audio device (such as the PAS16
    boards Sound Blaster emulation) |

    | SOUND_MIXER_RECLEV | Master recording volume level control |


    The macro SOUND_MIXER_NRDEVICES reports the maximum number of devices known to
    the sound driver at any given time; SOUND_MIXER_READ_DEVMASK sets a bitmask that
    indicates the available channels.


    SOUND_MIXER_READ_RECMASK sets a bitmask indicating the available recording devices.
    SOUND_MIXER_READ_STEREODEVS sets a bitmask indicating which channels are capable
    of supporting stereo output. This information gives you the ability to set the
    volume on each channel independently, thus providing a type of balance control.
    Another call, SOUND_MIXER_READ_CAPS, sets a bitmask that describes a mixer''s
    general capabilities.


    The mixer portion of the sound API also provides two macros that contain printable
    strings for human-readable output: SOUND_DEVICE_LABELS and SOUND_DEVICE_NAMES.
    The only difference between these is that the labels in SOUND_DEVICE_NAMES have
    no embedded blanks or uppercase letters.'
