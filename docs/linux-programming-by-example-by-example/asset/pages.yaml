    # ## Shared Libraries


    Shared libraries have several advantages over static libraries. First, they require
    fewer system resources. They use less disk space because shared library code is
    not compiled into each binary but is linked and loaded from a single location
    dynamically at runtime. They use less system memory because the kernel shares
    the memory that the library occupies among all the programs that use the library.


    Another advantage of shared libraries is that they are slightly faster because
    they must be loaded into memory only once. Finally, shared libraries simplify
    code and system maintenance. As bugs are fixed or features added, users need only
    obtain the updated library and install it. With static libraries, each program
    that uses the library must be recompiled.


    As already pointed out, the dynamic linker/loader, `ld.so`, links symbol names
    to the appropriate shared library in which they are defined at runtime. Shared
    libraries have a special name, the *soname*, that consists of the library name
    and the major version number. The full name of the C library on one of my systems,
    for example, is `libc.so.5.4.46`. The library name is `libc.so`; the major version
    number is 5; the minor version number is 4; and 46 is the release or patch level.
    So, the C library’s soname is `libc.so.5`.


    The soname of the new C library, `libc6`, is `libc.so.6`—the change in major version
    numbers indicates a significant change, to the extent that the two libraries are
    (massively!) incompatible. Minor version numbers and patch level numbers change
    as bugs are fixed, but the soname remains the same, thus newer versions are usually
    compatible with older versions.


    It’s important to be aware of the soname because applications link against the
    soname. How does it work? The `ldconfig` utility creates a symbolic link from
    the actual library, say `libc.so.5.4.46`, to the soname, `libc.so.5`, and stores
    this information in `/etc/ld.so.cache`. At runtime, `ld.so` scans the cache file,
    finds the required soname and, because of the symbolic link, loads the actual
    library into memory and links application function calls to the appropriate symbols
    in the loaded library.


    Library versions become incompatible under the following conditions:


    +   - Exported function interfaces change

    +   - New function interfaces are added

    +   - Function behavior changes from the original specification

    +   - Exported data structures change'
