    \ read incoming data from the socket's file descriptor, `infd`, and write it to\
    \ `stdout`.\n\nFinally, add the following code just above the `exit` statement\
    \ of `sockconn.c`:\n\n```\n/-* Copy stdin to the socket file descriptor -*/\n\
    xfer_data(fileno(stdin), sockfd);\n```\n\nThe additional code reads input from\
    \ `stdin` and writes it the file descriptor bound to the socket. The modified\
    \ files are available as `rdsock.c` and `wrsock.c` from the Web site for this\
    \ book.\n\nTo run these programs, run `rdsock` in one xterm or virtual console,\
    \ and then start `wrsock` on another one. Each time you press Enter, lines of\
    \ text entered appear in `rdsock`'s window. Sample output from these programs\
    \ is illustrated in Figure 18.4.\n\n![](img/be588b36b489136ce784030a08a1d3d4_426_0.png)\n\
    \nFigure 18.4:\nReading and writing UNIX domain sockets."
