- pgno: 47
  md: 'When you link against static libraries, the resulting binary is much larger
    than when using shared libraries. Why use a static library, then? One common reason
    is to guarantee that users can run your program—in the case of shared libraries,
    the code your program needs to run is linked dynamically at runtime, rather than
    statically at compile-time. If the shared library your program requires is not
    installed on the user''s system, she will get errors and not be able to run your
    program.


    The Netscape browser is a perfect example of this problem. Netscape relies heavily
    on Motif, an expensive X programming toolkit. Most Linux users cannot afford to
    install Motif on their system because it costs too much money, so Netscape actually
    installs two versions of its browser on your system; one that is linked against
    shared libraries, `netscape-dynMotif`, and one that is statically linked, `netscape-statMotif`.
    The `netscape` executable itself is actually a shell script that determines whether
    you have the Motif shared library installed and launches one or the other of the
    binaries, as necessary.


    # ### Examples


    ![](img/be588b36b489136ce784030a08a1d3d4_47_0.png)


    # **Example**


    1. This example creates a static library, `libmsg.a`. The necessary commands to
    do this are


    ```

    $ gcc -c msg.c -o libmsg.o

    $ ar rcs libmsg.a libmsg.o

    ```


    Recall from earlier in the chapter that `-c` tells `gcc` to create an object file
    named, in this case, `libmsg.o`. The second line uses the `ar` command to create
    a static library named `libmsg.a` from the object module, `libmsg.o`. The next
    example uses this library.


    > * To learn more about the `ar` command, see "The ar Command," p. 299.


    ![](img/be588b36b489136ce784030a08a1d3d4_47_1.png)


    # **Example**


    2. Now you have a library to link against. You have to tell `gcc` where to find
    the include file, using `-I`, where to find the library, using `-L`, and the name
    of the library, using `-l`, as illustrated here:


    ```

    $ gcc showit.c -o newhello-lib -I. -L. -lmsg

    ```


    An earlier example created `newhello` by compiling `showit.c` and `msg.c` together.
    This time, we created `newhello-lib` by linking against the static library, `libmsg.a`.
    This example created a binary named `newhello-lib` (the name was chosen to distinguish
    it from the other example) by linking against `libmsg.a` (`-lmsg`) located in
    the current working directory (`-L.`). The `.` refers to the current directory.
    The output of this program is listed here:'
