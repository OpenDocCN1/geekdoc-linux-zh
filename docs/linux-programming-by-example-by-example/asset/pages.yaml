- pgno: 46
  md: "(table continued from previous page)\n\n| **Option** | **Purpose** |\n| :---\
    \ | :--- |\n| `-werror` | Instead of generating warnings, gcc will convert warnings\
    \ into errors, stopping compilation. |\n| `-MM` | Output a `make`-compatible dependency\
    \ list. Useful for creating a `makefile` in a complicated project. |\n| `-v` |\
    \ Show the commands used in each step of compilation. |\n\nYou have already seen\
    \ how `-c` and `-o` work. If you do not specify `-o`, though, for an input file\
    \ named `file.suffix`, gcc's default behavior is to name the executable `a.out`,\
    \ the object file `file.o`, and the assembly language file `file.s`. Preprocessor\
    \ output goes to standard output.\n\n# Library and Include Files\n\nIf you have\
    \ library or include files in non-standard locations, the `-Ldirname` and `Idirname`\
    \ options allow you to specify these locations and to ensure that they are searched\
    \ before the standard locations. For example, if you store custom include files\
    \ in `/usr/local/myincludes`, in order for `gcc` to find them, your `gcc` invocation\
    \ would be something like\n\n```\n$ gcc infile.c -I/usr/local/myincludes\n```\n\
    \nSimilarly, suppose you are testing a new programming library, `libnew.a`, which\
    \ is currently stored in `/usr/local/mylibs`, before installing it as a standard\
    \ system library. Suppose also that the header files are stored in `/usr/local/myincludes`.\
    \ Accordingly, to link against `libnew.so` and to help `gcc` find the header files,\
    \ your `gcc` command line should resemble the following:\n\n```\n$ gcc myapp.c\
    \ -I/usr/local/myincludes -L/usr/local/mylibs -lnew\n```\n\nThe `-l` option tells\
    \ the linker to pull in object code from the specified library. The example above\
    \ linked against `libnew.so`.\n\n> **TIP**\n> A long-standing UNIX convention\
    \ is that libraries are named `lib(something)`, and gcc, like most UNIX and Linux\
    \ compilers, relies on this convention. If you do not use the `-l` option when\
    \ linking against libraries or do not provide a pathname to the library against\
    \ which to link, the link step will fail and gcc will emit a complaint about undefined\
    \ references to \"function name.\" \n\nBy default, gcc uses shared libraries,\
    \ so if you must link against static libraries, you have to use the `-static`\
    \ option. This means that only static libraries will be used. The following example\
    \ creates an executable linked against the static `ncurses` library:\n\n```\n\
    $ gcc cursesapp.c -Lncurses -static\n```\n\n+   * To learn about programming with\
    \ `ncurses`, see \"A Text-Mode User Interface API,\" p. 219."
