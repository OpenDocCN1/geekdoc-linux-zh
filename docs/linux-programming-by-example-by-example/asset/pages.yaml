    # ncurses Termination


    Before exiting an ncurses-based application, you need to return the memory resources
    that ncurses allocates and reset the terminal to its original, precurses state.
    The initialization functions allocate memory resources and reset the terminal
    state to an ncurses-friendly mode.


    Accordingly, you need to free the allocated memory and reset the terminal to its
    pre-ncurses mode. The termination functions endwin and delscreen do this job.
    When you are through working with a SCREEN, call endwin before making another
    terminal the current terminal, and then call delscreen on that terminal to release
    the SCREEN resources allocated to it, because endwin does not release memory for
    screens created by newterm'
