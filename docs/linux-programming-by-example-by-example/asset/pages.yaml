    the default file mode suits your

    purposes. Use the second form of `open` if you want to set a specific file mode,
    as modified by the process''s

    umask. Both forms of `open` return a file descriptor when they succeed. On failure,
    they return -1 and set

    `errno`.


    Table 7.3: Access Flags for open and creat


    | Flag | Description |

    | :--- | :--- |

    | O_CREAT | Creates the file if it does not already exist |

    | O_EXCL | Used only with O_CREAT, open fails if the file already exists |

    | O_NOCTTY | If the file is a terminal device, it will not become the process''s
    controlling terminal |

    | O_TRUNC | Sets the file''s size to O |

    | O_APPEND | Writes occur at the end of the file |

    | O_NONBLOCK | Opens the file in non-blocking mode, so that a read will return
    zero bytes rather than block |

    | O_SYNC | All writes to the file are written to the disk before the call returns
    |


    # ## The creat System Call


    `creat` also opens a file, creating it if it does not exist. It is prototyped
