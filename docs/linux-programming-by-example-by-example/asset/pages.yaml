    # Input Routines


    ncurses input routines, like its output routines, fall into several groups. This
    chapter focuses, however, on simple character and string input for two reasons.
    First and foremost, the routines discussed in this section will meet 90 percent
    of your needs. Second, ncurses input closely parallels ncurses output, so the
    material from the previous section should serve as a solid foundation.


    # Character Input


    The core input functions can be narrowed down to three: `getch`, `getstr`, and
    `scnwin`. `getch`''s prototype is


    ```

    int getch(void);

    ```


    `getch` fetches a single character from the keyboard, returning the character
    or `ERR` on failure. It may or may not echo the fetched character back to `stdscr`,
    depending on whether echoing is enabled or disabled (thus, `wgetch` and variants
    also obtain single characters from the keyboard and may or may not echo them to
    a program-specified window). For characters to be echoed, first call `echo`; to
    disable echoing, call `noecho`. Be aware that with echoing enabled, characters
    are displayed on a window using `waddch` at the current cursor location, which
    is then advanced one position.'
  merge: -1
  img_proc: true
- pgno: 277
  md: The matter is further complicated by the current input mode, which determines
    the amount of processing the kernel applies to the input before the program receives
    the character. In an ncurses program, you will generally want to process most
    of the keystrokes yourself. Doing so requires either `c` `mode` or raw mode. (ncurses
    begins in default mode, meaning that the kernel buffers text by waiting for a
    newline before passing keystrokes to ncurses—you will rarely want this.)
  merge: -1
  img_proc: true
- pgno: 278
  md: "In *raw mode*, the kernel does not buffer or otherwise process any input, while\
    \ in *cormode*, the kernel processes terminal control characters, such as ^S,\
    \ ^Q, ^C, or ^Y, and passes all others to ncurses unmolessted. On some systems,\
    \ the literal “next character,” ^V, may need to be repeated. Depending on your\
    \ application’s needs, *cormode* should be sufficient. In one of the following\
    \ sample programs, *cormode* is used and *echoing* is enabled and disabled in\
    \ order to simulate shadowed password retrieval.\n\n# Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_278_0.png)\n\
    \n# Example\n\nThis program uses *cormode* and *noecho* to simulate a password-checking\
    \ program.\n\n```\n/*\n * cursinch.c - ncurses character input functions\n */\n\
    #include <stdlib.h>\n#include <curses.h>\n#include <errno.h>\n#include \"utilfcns.h\"\
    \n\nint main(void)\n{\n    int c, i = 0;\n    int xmax, ymax;\n    char str[80];\n\
    \    WINDOW *pwin;\n\n    app_init();\n    cormode();\n    getmaxyx(stdscr, ymax,\
    \ xmax);\n    if((pwin = subwin(stdscr, 3, 40, ymax / 3,\n        (xmax - 40)\
    \ / 2 )) == NULL)\n        err_quit(\"subwin\");\n    box(pwin, ACS_VLINE, ACS_HLINE);\n\
    \    mvwaddstr(pwin, 1, 1, \"Password: \");\n\n    noecho();\n    while((c = getch())\
    \ != '\\n' && i < 80) {\n        str[i++] = c;\n        waddch(pwin, '*');\n \
    \       wrefresh(pwin);\n    }\n```"
