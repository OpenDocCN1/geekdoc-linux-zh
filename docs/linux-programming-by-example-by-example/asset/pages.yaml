    # Example


    +   3. To create a compressed archive, simply add `z` to the option list. Traditionally,
    compressed tarballs, usually called *gripped tarballs*, are named by adding `.gz`
    to the end. They are also often given the extension `.tgz`. Either one is acceptable.
    For purposes of consistency, this chapter will add `.gz` to the end of the filename.


    ![](img/be588b36b489136ce784030a08a1d3d4_491_1.png)


    # Output


    ```

    $ tar czvf mytar.tar.gz /etc/*.conf

    etc/dosemu.conf

