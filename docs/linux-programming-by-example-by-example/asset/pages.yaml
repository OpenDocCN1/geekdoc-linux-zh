  md: "# UNIX Domain Sockets\n\nUNIX domain sockets work on only a single machine,\
    \ so they are much more like named pipes than a network protocol. The addresses\
    \ to which UNIX domain sockets bind are actual filenames in the filesystem. However,\
    \ sockets cannot be opened; they must be accessed using the socket interface.\n\
    \n# Creating a UNIX Domain Socket\n\nEarlier, you learned that the socket_addr\
    \ structure contains a network address. That was a bit of an oversimplification.\
    \ Actually, that socket_addr structure is the general format. All the protocol\
    \ families (domains) have their own protocol-specific versions of socket_addr.\
    \ The socket_addr structure for UNIX domain sockets is defined in <sys/un.h> as\
    \ follows:\n\n```\nstruct sockaddr_un {\n  unsigned short int sun_family;  /*\
    \ AF_UNIX */\n  char sun_path[108];     /* pathname */\n};\n```\n\nsun_family\
    \ must be set to AF_UNIX to create a UNIX domain socket. sun_path contains the\
    \ name of the file to be used as the socket. The socket is bound to the file using\
    \ the bind call as you would expect, but the file is created when bind is called.\
    \ If the file already exists, bind fails, sets errno to EADDRINUSE, and returns\
    \ -1 to the calling process. The SUN_LEN macro, also defined in <sys/un.h>, returns\
    \ the size of a sockaddr_un structure.\n\nThe sockconn program illustrated the\
    \ correct method for a client program to connect to a server socket, so the example\
    \ will not be repeated again. Pay close attention, however, to how sockconn and\
    \ mksock cast their protocol's sockaddr_un structure to a generic socket_addr\
    \ structure for each call to the API's interface.\n\n# Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_424_0.png)\n\
    \n# Example\n\nThis example shows what happens when you try to open a socket that\
    \ is already in use. It assumes that you have already created the socket file\
    \ lpe-sample by running the first two sample programs.\n\n```\n$ ls -l lpe-sample\n\
    srw-r-xr-x 1 kwall users 0 Aug 17 18:29 lpe-sample=\n$ ./mksock lpe-sample\nbind:\
    \ Address already in use\n$ rm lpe-sample\n$ ./mksock lpe-sample\nsocket available:\
    \ lpe-sample\n```"
  merge: -1
  img_proc: true
