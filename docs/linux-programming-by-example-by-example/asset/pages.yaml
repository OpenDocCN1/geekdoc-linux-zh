- pgno: 141
  md: "sigprocmask sets or examines the current signal mask, depending on the value\
    \ of `how`, which can be one of the following:\n\n+   * `SIG_BLOCK`—set contains\
    \ additional signals to block\n+   * `SIG_UNBLOCK`—set contains signals to unblock\n\
    +   * `SIG_SETMASK`—set contains the new signal mask\n\nIf `how` is `NULL`, it\
    \ is ignored. If `set` is `NULL`, the current mask is stored in `oldset`; if `oldset`\
    \ is `NULL`, it is ignored. `sigprocmask` returns 0 on success and -1 on error.\n\
    \n```\nint sigaction(int `signum`, const struct sigaction `*act`,\nstruct sigaction\
    \ `*oldact`);\n```\n\nsigaction sets the signal handler for the signal specified\
    \ in `signum`. The structure `struct sigaction` describes a signal's disposition.\
    \ Its complete definition, from <signal.h>, is\n\n```\nstruct sigaction {\nvoid\
    \ (*sa_handler)(int);\nsigset_t sa_mask;\nint sa_flags;\nvoid (*sa_restorer)(void);\n\
    };\n```\n\n`sa_handler` is a pointer to a function that specifies the handler,\
    \ or function, to invoke when the signal in `signum` is generated. The function\
    \ must be defined to return type `void` and accept an `int` argument. Alternatively,\
    \ the `sa_handler` argument may also be `SIG_DFL`, causing `signum`'s default\
    \ action to occur, or `SIG_IGN`, which will cause this signal to be ignored.\n\
    \nWhile a signal handler is executing, the signal that triggered it is blocked.\
    \ `sa_mask` defines the signal mask of a set of additional signals that should\
    \ be blocked during execution of the handler. `sa_flags` is a mask that modifies\
    \ `sa_handler`'s behavior. It can be one or more of the following:\n\n+   * `SA_NOCLDSTOP`—The\
    \ process will ignore any `SIGSTOP`, `SIGTSTP`, `SIGTTIN`, and `SIGTTOU` signals\
    \ generated by child processes.\n+   \n+   * `SA_ONESHOT` or `SA_RESETHAND`—The\
    \ registered custom signal handler will execute only once. After it executes,\
    \ the signal's default action will be restored.\n+   \n+   * `SA_RESTART`—Enables\
    \ restartable system calls.\n+   \n+   * `SA_NOMASK` or `SA_NODEFER`—Do not prevent\
    \ the signal from being received within its own handler."
