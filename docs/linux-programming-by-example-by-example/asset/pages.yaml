    The -f option reports the filename and line number where mpr detects the leak.
    The output indicates that line 18 of badmem.c in the main function mallocs 10
    bytes of memory that it never frees (mpr and its utilities use the long decimal
    number to keep track of each allocation and free request). Referring to the code
    listing, you can see that this is correct.


    # Using mcheck


    As mentioned a moment ago, mpr, on its own, cannot detect memory-corruption errors.
    Although this is true, mpr includes the mcheck function from GNU''s malloc library,
    which enables you to detect buffer overruns, buffer underruns, and multiple frees
    of the same block. In fact, mpr compiles mcheck into libmpr.a by default.


    So, the good news is that the buffer overruns and underruns cause it to abort
    unless you specifically instruct mpr not to use mcheck. The bad news is that mcheck
    is not terribly informative—it merely complains about a problem and leaves the
    programmer to determine where the problem occurs. Compiled with mcheck, the sample
    program aborts each time you clobber memory.


    ![](img/be588b36b489136ce784030a08a1d3d4_484_1.png)


    # Example


    This example shows several runs of badmem compiled with mcheck, each run fixing
    the error encountered in the previous run:


    ![](img/be588b36b489136ce784030a08a1d3d4_484_2.png)


    # Output


    ```

    $ ./badmem

    LITTLE : abcde

    mcheck: memory clobbered past end of allocated block

    * . . .

    $ ./badmem

    LITTLE : abcde

    BIG : abcdefgh

    UNDERRUN: abcdefgh

    mcheck: memory clobbered before allocated block

    [ . . . ]

    ```'
