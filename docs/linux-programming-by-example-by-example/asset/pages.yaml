- pgno: 205
  md: "memory-mapped file. Effectively a shared memory model (see Chapter 16, \"Shared\
    \ Memory\"), this makes the data independent of any single process and available\
    \ to any process, and stores the region's contents in a disk file.\n\nThe function\
    \ calls to manage memory mapping are defined in <sys/mman.h>. They include the\
    \ following calls:\n\n+   - mmap—Maps a disk file into memory\n+   - munmap—Unmaps\
    \ a file, deletes the memory image\n+   - msync—Updates the disk file with data\
    \ from the memory image\n+   - mprotect—Limits access to the memory image\n+ \
    \  - mlock—Prevents a portion of the map from being swapped to disk\n+   - munlock—Removes\
    \ a previously set lock\n+   - mlockall—Prevents any part of the memory image\
    \ from being swapped to disk\n+   - munlockall—Removes the lock set by mlockall\n\
    \nThese function calls are discussed in greater detail in the following sections.\n\
    \n# Creating a Memory Map\n\nTo create a memory mapped file, call mmap. When you\
    \ have finished using it, call munmap to delete the mapping from memory and return\
    \ the memory to the operating system.\n\n# Mapping a File\n\nThe mmap function\
    \ maps a disk file into memory. It has the following prototype:\n\n```\n```c\n\
    void *mmap(void *start, size_t length, int prot, int flags,\n       int fd, off_t\
    \ offset);\n```\n```\n\nmmap creates a memory image of the file referred to by\
    \ the file descriptor fd. The memory image will start from offset bytes into the\
    \ file. The argument length indicates how much of the file should be read into\
    \ memory. To limit access to the memory map, you can set various protection levels\
    \ using the protection argument. It can be a logical OR of one or more of the\
    \ values in Table 8.1. The flags parameter sets several additional attributes\
    \ for the memory map. It can a logical OR of one or more of the values listed\
    \ in Table 8.2. mmap returns a pointer to the memory region or -1 on failure."
  merge: -1
  img_proc: true
- pgno: 206
  md: "Table 8.1: Values for mmap's protection Parameter \n\n| Protection | Description\
    \ |\n| :--------- | :--------- |\n| PROT_NONE  | No access is allowed |\n| PROT_READ\
    \  | Mapped region may be read |\n| PROT_WRITE | Mapped region may be written\
    \ |\n| PROT_EXEC  | Mapped region may be executed |\n\n> **NOTE** On the x86 architecture,\
    \ PROT_EXEC implies PROT_READ, so PROT_EXEC is the same as specifying PROT_EXEC|PROT_READ.\n\
    \nTable 8.2: Values for mmap's flags Parameter \n\n| Flag | Description |\n| :-----\
    \ | :----- |\n| MAP_ANONYMOUS | Creates an anonymous mapping, ignoring fd |\n\
    | MAP_FIXED | Fails if address is invalid or already in use |\n| MAP_PRIVATE |\
    \ Writes to region are process private |\n| MAP_SHARED | Writes to region are\
    \ copied to file |\n| MAP_DENYWRITE | Disallows normal writes to file |\n| MAP_GROWSDOWN\
    \ | Grows the memory downward |\n| MAP_LOCKED | Locks pages into memory |\n\n\
    offset is usually 0, indicating that the entire file should be mapped into memory.\
    \ A memory region must be marked either private, with MAP_PRIVATE, or shared,\
    \ with MAP_SHARED; the other values are optional. A private mapping makes any\
    \ modifications to the region process private, so these modifications are not\
    \ reflected in the underlying file or available to other processes. Shared maps,\
    \ on the other hand, cause any updates to the memory region to be immediately\
    \ visible to other processes that have mapped the same file.\n\nTo prevent writes\
    \ to the underlying disk file, specify MAP_DENYWRITE (but note that this is not\
    \ a POSIX value and as such is not portable). Anonymous maps, created with MAP_ANONYMOUS,\
    \ do not involve a physical file and simply allocate memory for the process’s\
    \ private use, such as a custom malloc implementation. MAP_FIXED causes the kernel\
    \ to place the map at a specific address. If the address is already in use or\
    \ otherwise unavailable, mmap fails. If MAP_FIXED is not specified and address\
    \ is unavailable, the kernel will attempt to place the region elsewhere in memory.\
    \ MAP_LOCKED allows processes with root privilege to lock the region into memory\
    \ so it will never be swapped to disk."
  merge: -1
  img_proc: true
- pgno: 207
  md: "![](img/be588b36b489136ce784030a08a1d3d4_207_0.png)\n\n**NOTE**\nUser programs\
    \ cannot use MAP_LOCKED. This is a security feature that prevents unauthorized\
    \ processes from locking all available memory, thus bringing the system to a standstill\
    \ (also known as a *denial of service* attack).\n\n# Unmapping a File\n\nWhen\
    \ you have finished using a memory mapped file, call munmap to unmap the region\
    \ and return the memory to the operating system. This function has the following\
    \ prototype:\n\n```\nint munmap(void *start, size_t length);\n```\n\nThe start\
    \ argument is a pointer to the beginning of the region to unmap, and length indicates\
    \ how much of the region to unmap. After a memory block has been unmapped, further\
    \ attempts to access the memory to which start points will cause a segmentation\
    \ fault (the signal SIGSEGV). When a process terminates, all memory maps are unmapped.\
    \ The munmap function returns 0 on success. On failure, it returns -1 and sets\
    \ errno.\n\nAs odd as it might seem, munmap might fail for a couple of reasons.\
    \ The most common reason is that start does not point to mapped memory. Another\
    \ cause for munmap to fail is that length is too long and, as a result, bleeds\
    \ into memory that is not mapped.\n\n# Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_207_1.png)\n\
    \n# Example\n\nThis program, mkmap, maps and unmaps a file specified on the command\
    \ line.\n\n```\n/*\n * mkmap.c Create a memory mapped file\n */\n#include <sys/types.h>\n\
    #include <sys/mman.h>\n#include <sys/stat.h>\n#include <unistd.h>\n#include <fcntl.h>\n\
    \n\n#include <stdlib.h>\n#include <stdio.h>\n\n\nvoid err_quit(char *msg);\n\n\
    \nint main(int argc, char *argv[])\n{\n```"
