  md: "# ## Using fork\n\nThe `fork` call creates a new process. The new or child\
    \ process will be a copy of the calling or parent process. Declared in `<unistd.h>`,\
    \ `fork`'s syntax is `pid_t fork(void);`\n\nIf it succeeds, `fork` returns the\
    \ PID of the child process to the parent process, and it returns 0 to the child\
    \ process. This means that even though you call `fork` only once, it returns twice.\n\
    \nThe new process `fork` creates is an exact copy of the parent process, except\
    \ for the PID and PPID. `fork` makes a complete copy of the parent process, including\
    \ the real and effective UIDs and GIDs, the process group and session IDs, the\
    \ environment, resource limits, open files, and shared memory segments.\n\nThe\
    \ differences between the parent and child are few. The child does not inherit\
    \ alarms set in the parent (using the `alarm` call), file locks the parent created,\
    \ or pending signals. The key concept to understand is that `fork` creates a new\
    \ process that is an exact duplicate of the parent.\n\n![](img/be588b36b489136ce784030a08a1d3d4_110_0.png)\n\
    \n# ## Example\n\nHere is a simple example of using `fork`:\n\n```\n/*\n *  child.c\
    \ - Simple fork usage\n */\n#include <unistd.h>\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\nint main(void)\n{\n    pid_t child;\n\n    if ((child = fork())\
