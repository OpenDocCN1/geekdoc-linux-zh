    # ## Positioning the File Pointer


    If you want to read and write from random locations in a file, you must be able
    both to determine the file pointer’s current position and to position the pointer.
    The lseek call is the tool for this purpose. Its prototype in <unistd.h> is as
    follows:


    ```

    ```c

    int lseek(int fd, off_t offset, int whence);

    ```

    ```


    lseek positions the file pointer to position offset in the file opened on file
    descriptor fd based on the value of whence. whence can be one of the following
    three constants:


    +   - SEEK_SET sets the pointer offset bytes into the file.

    +   - SEEK_CUR sets the pointer’s location to offset bytes into the file relative
    to the pointer’s current location, offset can be negative.

    +   - SEEK_END sets the location offset bytes from the end of the file.


    lseek returns the new pointer location on success, or a value of off_t -1 on error,
    and sets errno appropriately.


