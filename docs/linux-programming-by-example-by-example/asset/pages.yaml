  md: '• `Target ''target'' not remade because of errors`—An error occurred while
    building the named target. This message only appears when using `make`''s `-k`
    option, which forces `make` to continue even if errors occur (see Table 2.1, page
    37). There are many possible solutions when you get this error message. The first
    step would be to try to make just the target in question and, based on the errors
    generated, determine the next appropriate step.


    • make''s `-k` option is covered in more detail in Table 2.1, "Common make Command-Line
    Options," page 37.


    • `progname: Command not found`—make could not find `progname`. This usually occurs
    because `progname` has been misspelled or is not in the `SPATH` environment variable.
    Either use the command''s complete filename or add the path to `progname` to the
    makefile''s `PATH` variable.


    • `Illegal option - option`—The invocation of `make` included an option that it
    does not recognize. Don''t use the offending option or check the syntax.


