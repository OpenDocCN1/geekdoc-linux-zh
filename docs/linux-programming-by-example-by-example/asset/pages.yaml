- pgno: 212
  md: "After the file is mapped into memory, mmapcat uses the character pointer, src,\
    \ in the fprintf call exactly as if it had been populated by a read or fgets.\
    \ We return to the memory region of the kernel by calling mmap.\n\n> **TIP**\n\
    > From a practical point of view, using a memory mapped file in this example was\
    \ overkill because it provided little in terms of performance or code length.\
    \ However, in situations when performance is crucial or when you are dealing with\
    \ time-sensitive operations, memory mapped files can be a definite plus. Memory\
    \ mapping can also be valuable in high-security circumstances. Processes running\
    \ with root privileges can lock mapped files into memory, preventing them from\
    \ being swapped to disk by Linux's memory manager. As a result, sensitive data,\
    \ such as password files or payroll data, would be less susceptible to scanner\
    \ programs. Of course, in such a situation, the memory region would have to be\
    \ set to PROT_NONE so that other processes cannot read the region.\n\n# File Locking\n\
    \nFile locking is a method enabling multiple processes to access the same file\
    \ simultaneously in a safe, rational, and predictable way. Each process that locks\
    \ a file does so to prevent other processes from changing the data while it is\
    \ working with the file. There is no inherent reason why two processes should\
    \ not be able to read from the same file simultaneously, but imagine the confusion\
    \ that would result if two processes were writing to the same file at the same\
    \ time. They would likely overwrite each other's data or, in some cases, completely\
    \ corrupt the file.\n\nThe general procedure if you want to access a locked file\
    \ is listed here:\n\n+   1.  Check for a lock.\n+   \n+   2.  If the file is unlocked,\
    \ establish your own lock.\n+   \n+   3.  Open the file.\n+   \n+   4.  Process\
    \ the file as necessary.\n+   \n+   5.  Close the file.\n+   \n+   6.  Unlock\
    \ the file.\n\nNote how the process locks the file before beginning any I/O and\
    \ completes all processing before unlocking the file. This procedure ensures that\
    \ all the processing your program performs will be uninterrupted by other processes.\
    \ If you open the file before establishing the lock or close the file after reading\
    \ the lock, another process might be able to access the file in the fraction of\
    \ a second that elapses between the lock/unlock operation and the open/close operation.\n\
    \nIf the file is locked, you must make a decision. Many file I/O operations take,\
    \ at most, only a few seconds. You can either wait a few seconds—"
  merge: -1
  img_proc: true
- pgno: 213
  md: "perhaps using the sleep call—and try again or give up and report to the user\
    \ running your program that you were unable to open the file because another process\
    \ is using it.\n\nFile locks come in two flavors, advisory locks and mandatory\
    \ locks. **Advisory locks**, also known as cooperative locks, rely on a convention\
    \ in which every process that uses a locked file checks for the existence of a\
    \ lock and honors that lock. Neither the kernel nor the system as a whole enforce\
    \ advisory locks; they depend on programmers honoring the convention. **Mandatory\
    \ locks**, on the other hand, *are enforced* by the kernel. The kernel blocks\
    \ read or write access to a file that is locked for writing until the locking\
    \ process releases the lock. The price mandatory locking extracts, however, is\
    \ a significant performance penalty, because every read or write operation has\
    \ to check for the existence of a lock.\n\nJust as there are two types of file\
    \ locking, there are also two implementations of it, lock files and record locking.\n\
    \n# Lock Files\n\nLock files are zero-length files of the form `filename.lck`,\
    \ where `.lck` is appended to the end of the file, usually created in the same\
    \ directory as the filename that the process wants to open. They are easy to implement.\
    \ To do so, you will need a code block that resembles the following snippet of\
    \ pseudo-code:\n\n```\nopen with lock file using the O_EXCL flag\nif the open\
    \ fails and errno == EEEXIST\n  another process has locked the file\nelse\n  you\
    \ have locked the file\n  open the file itself\n  perform additional processing\n\
    \  close the file\n  delete (unlink) the lockfile\nend if\n```\n\nUsing O_EXCL\
    \ when opening the lock file guarantees that the open call is *atomic*, that is,\
    \ that the open call will not be interrupted by the kernel. This is important\
    \ because a potential race condition exists when two processes try to open the\
    \ same file. A second process could open the file while the first process’s open\
    \ call is interrupted by the kernel. Using O_EXCL avoids this situation. As noted\
    \ earlier, by convention, lock files are named `somefile.lck`, where somefile\
    \ is the name of the file you are locking."
