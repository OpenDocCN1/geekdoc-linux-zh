  md: '# The `ldd` Command


    Although `nm` lists the symbols defined in a library, unless you know what libraries
    a program requires, it is not terribly helpful. This is where `ldd` comes in.
    It lists the shared libraries that a program requires in order to run. Its syntax
    is as follows:


    ```

    ```

    ldd [options] file

    ```

    ```


    `ldd` prints the names of the shared libraries that `file` requires. Two of `ldd`’s
    most useful options are `-d`, which reports any missing functions, and `-r`, which
    reports missing functions *and* missing data objects. The other two options `ldd`
    recognizes are `-v`, which reports `ldd`’s version number, and `-V`, which reports
    the version number of the dynamic linker, `ld.so`.


    # *Example*


    ![](img/be588b36b489136ce784030a08a1d3d4_338_0.png)


    # Example


    `ldd` reports that the mail client `mutt` (which may or may not be installed on
    your system) requires five shared libraries.


    ![](img/be588b36b489136ce784030a08a1d3d4_338_1.png)


    # Output


    ```

    ```

    $ ldd /usr/bin/mutt

    libnsl.so.1 => /lib/libnsl.so.1 (0x40019000)

    libslang.so.1 => /usr/lib/libslang.so.1 (0x4002e000)

    libm.so.6 => /lib/libm.so.6 (0x40072000)

    libc.so.6 => /lib/libc.so.6 (0x4008f000)

    /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)

    ```

    ```


    Note that `ldd`’s output might be different on your system. The output indicates
    the libraries that the `mutt` binary requires to run. The first column shows the
    library name, which is often a symbolic link to the full pathname of the library
    that is listed in the second column.


    # The `ldconfig` Command


    `ldconfig` determines the runtime links programs require to shared libraries that
    are located in `/usr/lib` and `/lib`, specified in `libs` on the command line,
    and stored in `/etc/ld.so.conf`. It works with `ld.so`, the dynamic linker/loader,
    to create and maintain links to the most current versions of shared libraries
    available on a system. `ld.so`’s job is to complete the final link between programs
    that use functions in shared libraries and the shared libraries that define those
    functions. It has the following syntax:


    ```

    ```

    ldconfig [options] [libs]

    ```

    ```


    A bare `ldconfig` simply updates the cache file, `/etc/ld.so.cache`. `options`
    controls `ldconfig`’s behavior. The `-p` option tells `ldconfig` to list all the
    shared libraries `ld.so` has stored in its cache, without changing anything. The
    `-v` option instructs `ldconfig` to update the `ld.so`’s cache and also to list
    the libraries found. If you compile a program that fails to run because it'
