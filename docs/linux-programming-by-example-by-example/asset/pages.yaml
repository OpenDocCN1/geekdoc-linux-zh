    \n```\n```\n$ ./setvol\nNew volume level [0-100]: 75\n/dev/mixer level set to\
    \ 75% / 75%\n```\n```\n\nAfter variable declarations, `setvol` opens the mixer\
    \ for read and write access and then uses the `SOUND_MIXER_READ_DEVMASK` and `SOUND_MIXER_READ_STEREODEVS`\
    \ macros with `ioctl` to determine the mixer's characteristics. The next step\
    \ is to get the user's preferred volume level. Note that the do–while loop continues\
    \ until a valid volume level (between 0 and 100) is entered.\n\nSetting the volume\
    \ level is a bit touchy. As discussed earlier, you must use C's left-shift operator\
    \ to encode the volume for the right-hand channel into the upper (or most significant)\
    \ bits of `level`. The expression is `level = (right << 8) + left;`\n\nThe parenthesized\
    \ expression left-shifts the value of the right channel eight bits, moving all\
    \ its bits into the upper byte, and then adds the value of `left`, assigning the\
    \ result to `level`. The sound API appropriately decodes `level` to obtain the\
    \ desired volume for the right and left channels.\n\n# ### Audio Programming\n\
    \nThis section teaches you how to do simple audio programming by focusing on playback\
    \ and ignoring recording, primarily due to space limitations (well, that and the\
    \ trivial little detail that I have no way to record sounds on my system). The\
    \ techniques for recording, however, are essentially the same. Where playback\
    \ involves a `write` call to the audio device's file descriptor, recording requires\
    \ a `read` call.\n\n> **NOTE**\n> \n> At its simplest, to record sounds on half-duplex\
    \ sound cards, all you must do is attach a microphone to the MIC_IN jack and start\
    \ recording. Full-duplex cards, on the other hand, are more capable in this respect\
    \ because you can record and play back at the same time. So, in addition to recording\
    \ using a microphone, a full-duplex sound card enables you to record what it is\
    \ currently playing, applying all sorts of transformations to the data.\n\n> **TIP**\n\
    > \n> For more information about programming multimedia, especially sound, on\
