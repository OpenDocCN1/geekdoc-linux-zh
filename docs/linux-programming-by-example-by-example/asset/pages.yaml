    # ## Finding and Fixing Memory Problems


    The subject of this chapter is bug hunting. After logic errors and typos, the
    most common kind of bugs are memory related. In this section, you learn what kinds
    of memory bugs usually occur and meet a couple of tools to help you track them
    down.


    # ### Types of Memory Bugs


    Memory bugs fall into three broad categories: leaks, corruption, and illegal access.
    Memory *leaks* occur when a program allocates memory off the heap and fails to
    properly return it to the kernel, either by calling `free` or by using the termination
    routines that APIs define, such as the `endwin` call in the ncurses API. Memory
    *corruption* occurs when you try to use uninitialized or unallocated (or incorrectly
    allocated) memory, as shown in the following code snippet:


    ```

    ```

    char *str;

    char *msg;

    strcpy(str, "some static text");      /* str not allocated */

    printf("%s\n", msg);                   /* msg not initialized */

    ```

    ```


    > • The `endwin` call is discussed in “ncurses Termination,” page 228.


    This snippet causes a segmentation fault because, on the second line, `str` has
    not been properly `malloc`ed to hold anything, and because, on the fourth line,
    `msg` is uninitialized when used in the `printf` statement.


    *Illegal memory access* errors occur when a program tries to access memory that
    does not belong to it. This usually occurs as some variation of an *off-by-one
    error*, when a program inadvertently accesses memory immediately before or after
    the end of an array.'
