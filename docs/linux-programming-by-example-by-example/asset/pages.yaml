- pgno: 379
  md: '# Introducing System V IPC


    This is the first of two chapters discussing System V IPC mechanisms. System V
    IPC is rarely used in new applications because it has been superseded by POSIX
    IPC. Nevertheless, it is covered in this book because you will likely encounter
    it in older programs that were written before the POSIX IPC standard was proposed.
    All three types have the same basic interface and the same general design. This
    section introduces the fundamental concepts of System V IPC and looks at the features
    and programming idioms common to semaphores, message queues, and shared memory.


    IPC structures (semaphores, message queues, and shared memory segments) exist
    in the kernel, like pipes, rather than in the filesystem, like FIFOs. IPC structures
    are sometimes referred to collectively as *IPC objects* to avoid the awkwardness
    of saying or writing "semaphores, messages queues, and shared memory segments."
    Similarly, the term *IPC object* is used to refer to one of the structure types
    without being specific about which type. Figure 16.1 shows how unrelated processes
    communicate with each other via an IPC object.


    ![](img/be588b36b489136ce784030a08a1d3d4_379_0.png)


    As you can see in Figure 16.1, IPC objects are maintained in the kernel (actually,
    in kernel memory), allowing otherwise unrelated processes (processes that do not
    have a common parent) to communicate with each other using one of the IPC mechanisms,
    shared memory, semaphores, or'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'message queues. Data flows freely between the processes using IPC mechanisms.


    Each object is referred to and accessed by its *identifier*, a positive integer
    uniquely identifying the object and its type. Each identifier is unique for its
    type, but the same identifier value may be in use for a message queue, a semaphore,
    and a shared memory segment. The identifier becomes the handle for all other operations
    on the structure.


    > **NOTE**

    > IPC structure identifiers are not small positive integers used and reused the
    way file descriptors are. In fact, as structures are created and deleted, the
    identifier number, formally denoted a *slot usage sequence number*, increments
    until it reaches a maximum value, at which point it wraps to 0 and starts over.
    The maximum value depends on the operating system and the underlying hardware.
    In Linux, identifiers are declared as integers, so the maximum value possible
    is 65,535.


    Each IPC structure is created with a `get` function: `semget` for semaphores,
    `msgget` for message queues, and `shmget` for shared memory. Each time an object
    is created using one of the `get` functions, the calling process must specify
    a `key`, of type `key_t` (declared in `<sys/types.h>`), that the kernel uses to
    generate the identifier. The Linux 2.2.x kernel defines `key_t` as an integer.


    After an IPC structure has been created, subsequent calls to a `get` function
    using the same key do not create a new structure, but merely return the identifier
    associated with an existing one. So two (or more) processes can call a `get` function
    with the same key in order to establish an IPC channel.


    The challenge then becomes how to ensure that all processes wanting to use the
    same IPC structure use the same key. In one method, the process that actually
    creates the structure passes a key of `IPC_PRIVATE` to the `get` function, which
    guarantees that a new structure will be created. The creator of the IPC structure
    then stores the returned identifier in the filesystem where other processes can
    access it. When a parent `forks` and `execs` a new process, the parent passes
    the returned identifier to its child process as one of the arguments to the `exec`
    function that creates the child.


    Another method stores a standard key in a common header file, so that all programs
    that include the header file have access to the same key. One problem with this
    approach is that no process knows if it is creating a new structure or merely
    accessing one that has already been created by another process. Another problem
    with this approach is that the key might already be in use by an unrelated program.
    As a result, the process using this key must have code to handle such a possibility.'
