- pgno: 492
  md: 'one of the original UNIX utilities for compressing files. A file compressed
    using `compress` generally has a .Z extension.


    # Updating tar Files


    So, now you have a nicely packaged and compressed tarball. But, suddenly, you
    realize you neglected to include the documentation. You did write documentation,
    didn’t you? Never fear, you can easily add new files to (or update existing files
    in) the tarball using tar’s `append` or `update` options.


    To append your newly written documentation to the compressed tarball we created
    at the end of the last series of examples, you can use the `r` option or the `u`
    option. The r instructs tar to append the specified files to the end of the tarball.
    u, on the other hand, simply updates a file presently in the archive with a newer
    version. Naturally, if it does not exist in the archive, it will be added.


    ![](img/be588b36b489136ce784030a08a1d3d4_492_0.png)


    # Example


    This command uses `u` to update files with newer copies.


    ```

    $ tar uvf mytar.tar /etc/*,conf

    ```


    The output is identical to that generated when you created the tarball, so it
    is not repeated here. Note that the command did not use the compression option,
    z. This is because GNU tar, at least as of version 1.12, cannot update compressed
    files. As a result, it was necessary to uncompress the tarball first, using `gunzip
    mytar.tar`.


    # Deleting Files from Tarballs


    To delete a file from a tarball, you have to use the long option `--delete` and
    specify the name of the files you want to delete. As with the update option, you
    cannot delete files from a compressed tarball.


    ![](img/be588b36b489136ce784030a08a1d3d4_492_1.png)


    # Example


    This example deletes `isapp.conf` and `host.conf` from the tarball created in
    earlier examples.


    ```

    $ tar --delete -f=mytar.tar isapp.conf host.conf

    ```


    Note that the file deletion operation does not have a convenient single letter
    option; you *must* use `--delete`.


    # Using the install Command


    Consider `install` a `cp` command on steroids. In addition to copying files, it
    sets their permissions and, if possible, their owner and group. It can also create
    destination directories if they do not already exist.'
  merge: -1
  img_proc: true
- pgno: 493
  md: '# Invoking install


    install is normally used in makefiles as part of a rule for a target named (something
    like) install. It can also be used in shell scripts. The install command''s general
    syntax is


    ```

    $ install [option[...]] source[... ] dest

    ```


    where source is one or more files to copy and dest is either the name of the target
    file or, if multiple files are specified in source, a directory. option can be
    one or more values listed in Table 21.2.


    **Table 21.2: install Command-Line Options**

    | Option | Argument | Description |

    | :----- | :------- | :---------- |

    | -g     | group    | Sets the group ownership on files to the GID or group name
    specified in group. The default GID is that of the parent process calling install.
    |

    | -o     | owner    | Sets the ownership of files to the UID or user name specified
    in owner. The default owner is root. |

    | -m     | mode     | Sets the file mode (permissions) to the octal or symbolic
    value specified in mode. The default file mode is 755, or read/write/execute for
    owner and read/execute for group and other. |


    To specify dest as a directory, use the following syntax:


    ```

    $ install -d [option[...]] dir[... ]

    ```


    The -d switch instructs install to create the directory dir, including any parent
    directories, using any of the attributes listed in Table 21.2 or the default attributes.


    # Examples


    ![](img/be588b36b489136ce784030a08a1d3d4_493_0.png)


    # Example


    1. This example is taken from gdbm''s makefile, the GNU database library. After
    expanding some of the make variables, the install target is


    ```

    install: libgdbm.a gdbm.h gdbm.info

    install -c -m 644 libgdbm.a $(libdir)/libgdbm.a

    install -c -m 644 gdbm.h $(includedir)/gdbm.h

    install -c -m 644 $(srcdir)/gdbm.info $(infodir)/gdbm.info

    ```


    The make variables libdir, includedir, sccdir, and infodir are, respectively,
    /usr/lib, /usr/include, /usr/src/build/info, and /usr/info. So, libgdbm.a and
    gdbm.h will be read/write for the root user and read-only for everyone else. The
    file libgdbm.a gets copied to /usr/lib; gdbm.h, the header, winds up in /usr/include.
    The Texinfo file, gdbm.info, gets copied from /usr/src/build/info to /usr/info/gdbm.info.
    install overwrites existing files of the same name. The -c option is included
    for compatibility'
