- pgno: 200
  md: 'The *select* implementation also includes four routines to manipulate the descriptor
    sets:


    ```

    ```

    FD_ZERO(fd_set *set);

    FD_SET(int fd, fd_set *set);

    FD_CLR(int fd, fd_set *set);

    FD_ISSET(int fd, fd_set *set);

    ```

    ```


    They operate as follows:


    +   *   `FD_ZERO` clears the set *set*.

    +   *   `FD_SET` adds descriptor *fd* to *set*.

    +   *   `FD_CLR` removes *fd* from *set*.

    +   *   `FD_ISSET` determines whether *fd* is in *set*. `FD_ISSET` is the routine
    to use after *select* returns in order to determine whether anything has happened
    that requires action. If *fd* is set, its status changed during the *select* call
    (it has bytes to read, can be written to, or an error occurred).


