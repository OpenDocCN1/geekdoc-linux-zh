- pgno: 89
  md: '# # The Music CD Database Program


    The project you will complete is a music CD database program. Actually, it is
    already complete. You will step through its design and creation module by module,
    often block by block, to gain insight into how the material you learn in this
    book fits together.


    I sought to make the program as modular as possible, thus separating the user
    interface from the database manager and isolating nonportable code into as few
    modules as possible. In addition, library code, such as that from the ncurses
    and database libraries, is wrapped by application code, so that the implementation
    can change while the interface stays the same.


    The project is a highly personal project, at least from my perspective. There
    are already many such programs out there, some far richer in features and *eye
    candy*, or visual appeal, than this one. But none of them do what I want them
    to do the way I want them to do it. That is, this program scratches an itch, which
    is one of the motivations behind the whole open source endeavor, as Eric Raymond
    argues in his excellent paper, ***The Cathedral and the Bazaar***. See http://www.tuxedo.org/~esr/writings/cathedral-bazaar/cathedral-bazaar.html
    for the complete text of this seminal work.


    # ## Components and Subsystems


    At the simplest level, the project consists of a command-line program, `mcddcli.c`,
    suitable for use in shell scripts, an interactive GUI client, `mccui.c`, and three
    helper modules, `mcdscr.c`, `mcdddb.c`, and `mcctil.c`. The relationships between
    each of these modules are illustrated in Figure 3.1.


    ![](img/be588b36b489136ce784030a08a1d3d4_89_0.png)


    As you can see in Figure 3.1, the client programs rely on the routines, or *services*,
    that `mcdscr.c`, `mcdddb.c`, and `mcctil.c` provide.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '`mcddli.c` parses command-line options and their associated arguments to add,
    delete, fetch, and search for records in the CD database. Its entire design is
    centered around being a command-line utility suitable for use in shell scripts.
    It is noninteractive and returns appropriate error codes that can be used in a
    shell script. `mcddli.c` calls routines defined in `mcddb.c` to do the work of
    accessing and moving around in the database.


    In addition to using the database manager `mcddb.c` and the utility functions
    in `mcdui.c`, `mcdui.c` also calls functions in `mcddscr.c`. `mcddscr.c` encapsulates
    functionality provided by the ncursees screen-handling library, giving `mcddui.c`
    the capability to paint the screen, interpret keystrokes, and display data from
    the database.


    The helper modules, in turn, rely heavily on system calls and other supporting
    libraries. `mcdd.db.c` abstracts, or encapsulates, all the database functionality
    that `mcddli.c` requires. The database module consists of high-level function
    wrappers that interact with the database. However, `mcddli.c`, aside from using
    a few database-specific declarations, need know nothing about the underlying database
    interface in order to use the database''s API. By implementing the nitty-gritty
    database functionality in a separate module, the actual implementation can change
    without needing to change the application code. This kind of modularity is essential
    to writing easily maintained programs.


    The screen-handling code in `mcddscr.c` performs a similar function for the GUI
    client, `mcddui.c`. It insulates the application code from the details of the
    underlying screen-handling library—nurses—which allows the implementation of screen
    manipulation to change without affecting the application. `mcddscr.c` also allows
    `mcddui.c` to focus on transferring data from the database to the screen, which
    is its purpose, rather than concerning itself with redrawing the screen or displaying
    a dialog box.


    # What''s Next?


    This chapter gave you a brief introduction to the programming project that you
    will encounter at the end of the book.


    > - The complete source code for the programming project, along with explanatory
    text, is found in "Programming Project: A Music CD Database," page 461.


    Between now and then, though, you have a lot of ground to cover. Part II, "System
    Programming," begins with a discussion of Linux processes, followed by a chapter
    on signals and signal handling. Few applications can accomplish much without being
    able to manipulate processes and handle signals, so this material is a good base
    on which to build your knowledge of Linux programming.'
