- pgno: 326
  md: '# ## Understanding Sound Programming


    Before jumping into programming sound players, you need some technical background
    to understand the concepts and terminology involved.


    Computers represent sound as a sequence of samples of an audio signal taken at
    precisely controlled time intervals. A *sample* is the volume of the audio signal
    at the moment it was measured. The simplest form of digital audio is *uncompressed*,
    whereby each sample is stored as it is received in a sequence of one or more bytes.
    *Compressed* audio, on the other hand, encodes N bits of an audio signal in N×x
    bits to conserve space.


    There are several sample formats, the most common being 8-bit, 16-bit, and μ-Law
    (a logarithmic format). This sample format, combined with the number of channels—that
    is, whether the signal is mono or stereo—determines the *sample rate*, which in
    turn controls how many bytes of storage are required for each sample. Typical
    sampling rates range from a low-grade 8 kHz to 48 kHz.


    Because sound is a physical property, there are some limitations with which you
    must contend. Because computers are digital devices and sound is an analog property,
    sound cards have analog-to-digital and digital-to-analog converters (ADCs and
    DACs, respectively) to convert between the two forms. The conversion affects the
    quality of the signal. Other physical properties also affect the quality of sound.


    The most basic limitation is that the highest frequency that can be recorded is
    half of the sampling rate, so that, for example, at a 16 kHz sampling rate, the
    highest frequency you can record is no more than 8 kHz. Frequencies higher than
    8 kHz must be removed before the signal can be fed to a DAC or an ADC, or you
    will just hear loud noise. Unfortunately, to increase the quality of the sound,
    you must increase the sampling rate, which also increases the length of transmission
    time while decreasing the signal''s *duration*, or how long it plays.


    # ## Setting Device Parameters


    To play sounds, the basic procedural flow is as follows:


    +   1. Select the device you want to use.

    +   2. Open the device.

    +   3. Set the device format.

    +   4. Set the number of channels (mono or stereo).

    +   5. Set the sample playback speed.

    +   6. Read a block from the file you want to play.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '7. Write the block to the opened device.


    8. Repeat steps 4 and 5 until EOF.


    9. Close the device.


    There are several constraints to keep in mind when playing back sounds. First,
    select the appropriate device. For all data except Sun audio (\u03bc-Law samples),
    use `/dev/dsp`; for \u03bc-Law, use `/dev/ audio`. When opening the device for
    playback, use `O_WRONLY` unless you must both read to and write from the device.
    Next, make sure that the device''s default parameters are correct. If not, set
    them in the following order: sample format, the number of channels (mono or stereo),
    and the sampling speed. This order is less important for playback than recording,
    but is nevertheless worth checking.


    To get and set the sample format, use the commands `SNDF_DSP_GETFMTS` and `SNDF_DSP_SETFMT`
    with one of the values listed in Table 13.2.


    Table 13.2: Audio Format Macros

    | Macro | Description |

    |---|---|

    | AFMT_QUERY | Used when querying the current audio format (`SNDF_DSP_GETFMTS`)
    |

    | AFMT_MU_LAW | Logarithmic \u03bc-Law encoding |

    | AFMT_A_LAW | Logarithmic A-Law encoding |

    | AFMT_IMA_ADPCM | The standard ADPCM encoding (incompatible with the format used
    by Creative in the Sound Blaster 16) |

    | AFMT_U8 | Standard 8-bit unsigned encoding |

    | AFMT_S16_LE | Signed 16-bit unsigned little endian (s86) format |

    | AFMT_S16_BE | Signed 16-bit unsigned big endian (M68k, PPC, Sparc) format |

    | AFMT_S8 | Signed 8-bit format |

    | AFMT_U16_LE | Unsigned 16-bit little endian format |

    | AFMT_U16_BE | Unsigned 16-bit big endian format |

    | AFMT_MPEG | MPEG (MPEG2) audio format |


    To obtain the audio formats a device currently supports, call `ioctl` using the
    command `SNDF_DSP_GETFMTS` and an argument of `AFMT_QUERY`. This call fills `AFMT_QUERY`
    with a bitmask that represents all the device''s currently supported audio formats.
    The other values in Table 13.2 are the values to pass as the argument to the `SNDF_DSP_SETFMT`.
    For example, consider the following code snippet:


    ```

    ```c

    int format;

    iocl(fd, SNDCTL_DSP_GETFMTS, &format);

    ```

    ```'
