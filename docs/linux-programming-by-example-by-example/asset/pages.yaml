  md: "startup errors. Functions that change a terminal’s status, such as *cbreak*\
    \ or *noecho*, should be called after *initscr* returns. The first call to *refresh*\
    \ after *initscr* will clear the screen. If the call succeeds, *initscr* returns\
    \ a pointer to *stdscr*, which you can save for later use; otherwise, the call\
    \ returns NULL and exits the program, printing a useful error message to the display.\n\
    \nIf your program will send output to or receive input from more than one terminal,\
    \ use the *newterm* function call instead of *initscr*. For each terminal with\
    \ which you expect to interact, call *newterm* once.\n\n*newterm* returns a pointer\
    \ to a C data structure of type *SCREEN* (another ncurses-defined type), which\
    \ is used when referring to that terminal. Before you can send output to or receive\
    \ input from such a terminal, you must make it the current terminal. The *set_term*\
    \ call accomplishes this. Pass as *set_term*’s argument the pointer to the *SCREEN*\
    \ (returned by a previous *newterm* call) that you want to make the current terminal.\n\
