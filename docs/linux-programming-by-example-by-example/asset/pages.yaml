  md: "mkdir will try to create the directory specified in pathname with the permissions\
    \ in mode, as modified by the umask. rmdir deletes the directory specified in\
    \ pathname, which must be empty. Both calls return 0 on success or set errno and\
    \ return -1 on failure.\n\n# Examples\n\n![](img/be588b36b489136ce784030a08a1d3d4_194_0.png)\n\
    \n# Example\n\n+   1. The first program creates a directory whose name is passed\
