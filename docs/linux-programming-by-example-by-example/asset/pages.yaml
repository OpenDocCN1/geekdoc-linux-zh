  md: '> **TIP**

    > As a general rule, debug first, optimize later. Do not, however, take "optimize
    later" to mean "ignore efficiency during the design process." Optimization, in
    this context, refers to the compiler magic discussed in this section. Good design
    and efficient algorithms have a far greater impact on overall performance than
    any compiler optimization magic ever will. Indeed, if you take the time up front
    to create a clean design and use fast algorithms, you may not need to optimize,
    although it never hurts to try.


    # GNU C Extensions


    GNU''s C implementation extends standard ANSI C in a variety of ways. If you don''t
    mind writing blatantly non-standard code, some of these extensions can be very
    useful. For a complete discussion of the GNU project''s extensions, the curious
    reader is directed to `gcc`''s info pages (in particular, try the command `info
    gcc "C Extensions"`). The extensions covered in this section are the ones frequently
    seen in Linux''s kernel headers and source code.


    > **CAUTION**

    > The problem with non-standard code is twofold. In the first place, if you are
    using GNU extensions, your code will only compile properly, if it compiles at
    all, with `gcc`. The other problem is that non-standard code does not adhere to
    ANSI/ISO standards. Many users use the strictest possible compilation switches
    with their compilers, so non-standard code will not compile. The wisest policy,
    if you wish to include non-ANSI features in your code, is to surround it with
    `#ifdefs` to enable conditional compilation. In the comp.lang.c newsgroup, you''ll
    get flamed to a black crisp for using non-standard code.


    To provide 64-bit storage units, for example, `gcc` offers the `long long int`
    type, used in Listing 1.5:


    ```

    long long long_int_var;

    ```


    > **NOTE**

    > The `long long int` type is part of the new draft ISO C standard. It is still
    a draft standard, however, which few, if any, compilers support.


    On the x86 platform, this definition results in a 64-bit memory location named
    `long_int_var`. Another `gcc` extension you will encounter in Linux header files
    is the use of inline functions. Provided it is short enough, an inline function
    expands in your code much as a macro does, thus eliminating the cost of a function
    call. Inline functions are better than macros, however, because the compiler type-checks
    them at compile-time. To use inline'
