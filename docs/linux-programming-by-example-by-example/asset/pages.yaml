  md: '# 7—


    # **Basic Linux File Handling**


    In Linux, almost everything is a file, at least abstractly. This fact is one of
    Linux''s most ingenious design features because it makes possible a uniform programming
    interface to a bewildering and wildly varying array of resources, such as memory,
    disk space, devices, interprocess communication channels, network communication
    channels, and even running processes! This chapter covers the fundamental featuers
    of Linux''s file-handling interface, including the following:


    +   - Basic concepts of Linux file handling


    +   - File permissions


    +   - File types


    +   - Opening and closing files


    +   - Reading and writing files


    +   - Obtaining and changing file information'
