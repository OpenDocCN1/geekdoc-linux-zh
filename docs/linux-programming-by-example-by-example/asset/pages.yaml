    You can even specify a window and request a move operation with these two functions:


    ```

    int mvwhline(WINDOW *win, int y, int x, chtype ch, int n);

    int mvwvline(WINDOW *win, int y, int x, chtype ch, int n);

    ```


    As usual, these routines return OK on success or ERR on failure, win indicates
    the target window; n specifies the maximum line length, up to the maximum window
    size vertically or horizontally. The line, box, and border drawing functions do
    not change the cursor position. Subsequent output operations can overwrite the
    borders, so you must make sure either to include calls to maintain border integrity
    or to set up your output calls such that they do not overwrite the borders.


    Functions that do not specifically set the cursor location line, vline, whline,
    and wvline) start drawing at the current cursor position. The manual page documenting
    these routines is curs_border(3). The curs_outopts(3) page also contains relevant
    information.


    The final set of miscellaneous functions to consider clear all or part of the
    screen. As usual, they are available in both plain and window-specific varieties:


    ```

    int erase(void);

    int werase(WINDOW *win);

    int clear(void);

    int wclear(WINDOW *win);

    int clrtobot(void);

    int wclrtobot(WINDOW *win);

    int clrtoeol(void);

    int wclrtoeol(WINDOW *win);

    ```


    erase writes blanks to every position in a window; clrtobot clears the screen
    from the current cursor location to the bottom of the window, inclusive; clrtoeol,
    finally, erases the current line from the cursor to the right margin, inclusive.


