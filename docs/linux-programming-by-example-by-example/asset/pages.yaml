    \ the socket file, the bind call succeeded and the server began its infinite accept\
    \ loop.\n\n# ### Reading and Writing a UNIX Domain Socket\n\nAs stated at the\
    \ beginning of the chapter, you can use standard system I/O calls to read from\
    \ and write to sockets. The procedure is straightforward. The process that calls\
    \ accept uses the file descriptor that accept returns for I/O. Processes that\
    \ call connect, usually client processes, use the file descriptor returned by\
    \ the socket call for I/O.\n\n# ### Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_425_0.png)\n\
