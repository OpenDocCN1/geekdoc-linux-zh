    # Semaphores


    *Semaphores* control access to shared resources. They are quite different from
    the other means of IPC you have seen so far, in that they do not make information
    available between processes, but instead synchronize access to shared resources
    that should not be accessed simultaneously. In this respect, semaphore operations
    more closely resemble file or record locking, but applied to more resources than
    just files. This section discusses only the simplest type of semaphore, a *binary
    semaphore*. A binary semaphore takes one of two values: 0 when a resource is locked
    and should not be accessed by other processes, and 1 when the resource is unlocked.


    +   * For more information about file and record locking, see "File Locking,"
    page 182.


    Semaphores function much like traffic lights at a busy intersection. When a process
    needs access to a controlled resource, such as a file, it first checks the semaphore
    value, just as a driver checks to see if a traffic light is green. If the semaphore
    has a value of zero, which corresponds to a red light, the resource is in use,
    so the process blocks until the resource becomes available (that is, the semaphore''s
    value becomes non-zero). In the terminology of System V IPC, this blocking is
    called a *wait*. If the semaphore has a positive value, which corresponds to a
    green light at an intersection, the associated resource is available, so the process
    decrements the semaphore, performs its operations on the resource, and then increments
    the semaphore to release the "lock."


    # *Creating a Semaphore*


    Naturally, before you can increment or decrement a semaphore, it must exist. The
    function call for creating a new semaphore or accessing an existing one is *semget*,
    prototyped in `*sys/sem.h*` as follows (you also must include `*sys/ipc.h*` and
    `*sys/types.h*`):


    ```

    int semget(key_t key, int nsems, int flags);

    ```


    *semget* returns the semaphore identifier associated with a set of *nsems* semaphores.
    A new set of semaphores is created if *key* is *IPC_PRIVATE* or if *key* is not
    already in use and the *IPC_CREAT* bit is set in *flags*. As with shared memory
    segments and message queues, *flags* can also be bitwise ORed with permission
    bits (in octal) to set the access modes for the semaphore. Note, however, that
    semaphores have read and alter permissions rather than read and write permissions.
    Semaphores use the notion of *alter* rather than'
