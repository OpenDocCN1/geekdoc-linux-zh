    The addch routine outputs the desired character and advances the cursor. The two
    waddch calls illustrate how to combine video attributes with the character to
    display. The code also demonstrates a typical "mv"-prefixed function. After refreshing
    the screen, a short pause allows you to view the output. The second half of the
    program shows how to use the windowspecific routines, using stdscr as the target
    window.


    # ## String Output


    ncurses'' string routines generally behave similarly to the character routines,
    except that they deal with strings of pseudo-characters or with normal null-terminated
    strings. Again, ncurses'' designers created a standard notation to help programmers
    distinguish between the two types of functions. Function names containing cstr
    operate on strings of pseudocharacters, whereas function names containing only
    str use standard C-style (null-terminated) strings. A partial list of the functions
    operating on pseudo-character strings includes


    ```

    int addchstr(const chtype *chstr);

    int addchnstr(const chtype *chstr, int n);

    int waddchstr(WINDOW *win, const chtype *cstr);

    int waddchnstr(WINDOW *win, const chtype *chstr, int n);

    int mvaddchstr(int y, int x, const chtype *chstr);

    int mvaddchnstr(int y, int x, const chtype *chstr, int n);

    int mvwaddchstr(WINDOW *win, int y, int x, const chtype *chstr);

    int mvwaddchnstr(WINDOW *win, int y, int x, const chtype *chstr, int n);

    ```'
