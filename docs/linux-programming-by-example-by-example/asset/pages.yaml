    Enter key\");\n  wgetstr(workwin, kbuf);\n  show_win(workwin);\n}\n```\n\nA lot\
    \ is going in this code, but not as much as it might seem at first glance. `init_scrn`\
    \ initializes the ncurses subsystem, creates three subwindows used throughout\
    \ the program, and sets up an ncurses-friendly keyboard state. As mentioned in\
    \ Chapters 11 and 12, most ncurses programs must interpret keyboard input directly,\
    \ hence the call to `cbreak`. The ` keypad` call enables easily interpreted cursor\
    \ and function key calls. `noecho` prevents any key-strokes from being echoed\
    \ to the screen, unless specifically enabled. The three subwindows that are created\
    \ simplify management of the screen. As you will see in the screen driver program\
    \ in a moment, handling input and output via separate windows makes redrawing\
    \ the screen much simpler.\n\n`close_scrn` restores keyboard input to standard\
    \ cooked mode and deallocates the memory resources given to three subwindows.\
    \ Finally, it calls `endwin` to allow ncurses to perform its cleanup. These steps\
    \ restore the terminal's state to its pre-ncurses status. `draw_scrn` simply displays\
    \ the initial screen users will see when they first start the program.\n\nThe\
    \ `status` routine updates a status line maintained at the bottom of the screen.\
    \ The status line is used to give the user additional information and to display\
    \ error messages. `status` and other routines use two utility routines, `prep_win`\
    \ and `show_win`, to simplify window management. `prep_win` erases a window and\
    \ turns on echo mode, making data entry screens easy to read. `show_win` updates\
    \ the window you have been working on and also `stdscr`, so that any changes that\
    \ have been made get displayed on the user's screen.\n\nThe `add`, `del`, `find`,\
    \ `show`, and `get` functions in `mc_dscr.c` implement the functionality for adding,\
    \ deleting, finding, showing, and getting individual records, respectively. They\
    \ transfer data retrieved from the database to the ncurses screen. The `list`\
    \ function deserves special comment. It is designed"
