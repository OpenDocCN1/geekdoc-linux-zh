  md: "The `initscr` and `newterm` functions handle ncurses initialization requirements.\
    \ `initscr` has two tasks, to create and initialize `stdscr` and `curscr`, and\
    \ to find out the terminal's capabilities and characteristics by querying the\
    \ terminfo or termcap database. If it is unable to complete one of these tasks,\
    \ or if some other error occurs, `initscr` displays useful diagnostic information\
    \ and terminates the application. For example, `initscr` will fail if the `$TERM`\
    \ environment variable is not set to a terminal type that ncurses recognizes.\
    \ In this case, `initscr` aborts with the error message \"Error opening terminal:\
    \ unknown.\" \n\nCall `initscr` before you use any other routines that manipulate\
    \ `stdscr` or `curscr` Failure to do so will cause your application to abort with\
    \ a seg mentation fault. At the same time, however, call `initscr` only when you\
    \ are certain you need it, such as after other routines that check for program"
  merge: -1
