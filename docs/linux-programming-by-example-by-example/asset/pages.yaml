    # What''s Next?


    This chapter introduced you to the ncurses API, an interface for controlling the
    screen in character-based programs. Although Linux is an advanced and sophisticated
    operating system, it still has many character based (non-GUI) applications that
    are very popular, so it is important to understand how to write applications that
    manipulate text mode screens. The next chapter continues exploring ncurses by
