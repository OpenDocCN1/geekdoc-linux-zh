    # ## Getting File Information


    So, now you can open, close, read, write, and truncate files. However, you can
    obtain lots of interesting information about a file, as the `stat (1)` command
    shows:


    ![](img/be588b36b489136ce784030a08a1d3d4_176_0.png)


    # ### Output


    ```

    $ stat trunc.c


    File: "trunc.c"


    Size: 420

    Filetype: Regular File


    Mode: (0644/-rw-r--r--)


    Uid: (500/kwall)


    Gid: (100/users)


    Device: 3,2


    Inode: 534555


    Links: 1


    Access: Sat Jul 24 16:02:50 1999(00000.00:15:56)


    Modify: Sat Jul 24 16:04:29 1999(00000.00:14:17)


    Change: Sat Jul 24 16:04:29 1999(00000.00:14:17)

    ```


    The `stat` command reads information from a file''s information node, called an
    inode, and displays it for the user. Although their particulars are outside this
    book''s scope, *inodes* are data structures that the kernel maintains for each
    file present in a filesystem. Among other things, they contain information such
    as a file''s name, size, ownership, the date it was last changed, accessed, and
    modified, its type, and how many symbolic links there are to it. The `stat` in
    the example listed all this information.


    There are three ways to obtain this information: `stat`, `lstat`, and `fstat`.
    To use them, you must include both `<sys/stat.h>` and `<unistd.h>` in your code.
    Their prototypes are listed here:


    ```

    int stat(const char *filename, struct stat *buf);


    int fstat(int fd, struct stat *buf);


    int lstat(const char *filename, struct stat *buf);

    ```


    All the `stat` functions fill `buf` with information taken from the file specified
    by `filename` or the file descriptor `fd`. On success, they return `0` and if
    an error occurs, they return `-1` and set `errno`. The only practical difference
    between them is that `lstat` does not follow symbolic links, whereas `stat` and
    `fstat` do. The `stat` structure is defined as follows:'
