    # Other RCS Commands


    Besides ci, co, ident, and rcsdiff, the RCS suite includes rlog, rcsclean, and,
    of course, rcs. These additional commands extend your control of your source code
    by allowing you to merge or delete RCS files, review log entries, and perform
    other administrative functions.


    # Using rcsclean


    rcsclean does what its name suggests: It cleans up RCS working files. The basic
    syntax is rcsclean [options] [file . . . ]. A bare rcscclean command will delete
    all working files unchanged since they were checked out. The -u option tells rcscclean
    to unlock any locked files and remove unchanged working files. You can specify
    a revision to delete using the -rM.N format. For example, the following command
    removes the 2.3 revision of foobar.c:


    ```

    $ rcscclean -r2.3 foobar.c

    ```'
