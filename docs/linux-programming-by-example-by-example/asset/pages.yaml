  md: "# Creating a Static Library\n\nTo use library code, include the static library’s\
    \ header file in your source code and link against the corresponding library.\
    \ To create your own library, collect your most commonly used routines into a\
    \ single file, and then create a header file that declares the functions and data\
    \ structures. The header file contains the interface to your library. The next\
    \ example creates an error-handling library that you might find useful.\n\n> **NOTE**\n\
    > \n> Fans of Richard Stevens’ *Advanced Programming in the UNIX Environment*\
    \ will recognize this code. I have used this code for several years because it\
    \ neatly meets my need for a simple, functional error-handling library. I am indebted\
    \ to Stevens’ generosity in allowing me to reproduce this code here.\n> \n> I\
    \ was also deeply saddened to hear of his death in early September 1999. Richard\
    \ Stevens was a fine programmer and an outstanding expositor of the minutiae of\
    \ UNIX and TCP/IP programming. The clarity of expression he brought to the details\
    \ of the UNIX and TCP/IP API will be sorely missed.\n\nA few remarks about the\
    \ code might be helpful. The header file includes `<stdarg.h>` because it uses\
    \ ANSI C’s variable-length argument list facility (if you are unfamiliar with\
    \ variable-length argument lists, consult your favorite C reference manual). To\
    \ protect against multiple inclusions of the header, it is wrapped in a preprocessor\
    \ macro, LIBERR_H_. This library should not be used in daemons because it writes\
    \ to stderr. Daemons usually do not have a controlling terminal, so they are not\
    \ attached to stderr (see Chapter 9, “Daemons,” for more information about creating\
    \ daemon programs).\n\n# Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_341_0.png)\n\
    \n# Example\n\nThe first listing that follows, *liberr.h*, is the header file\
    \ for a simple error-handling library, and the second listing is the implementation\
    \ of the interface defined in the header file.\n\n```\n```\n/**\n * liberr.h\n\
    \ * Declarations for simple error-handling library\n */\n#ifndef LIBERR_H_\n#define\
    \ LIBERR_H_\n\n#include <stdarg.h>\n\n#define MAXLINELEN 4096\n```\n```"
