  md: '# Recursively Expanded Versus Simply Expanded Variables


    *make* actually uses two kinds of variables, recursively expanded and simply expanded.
    *Recursively* *expanded* variables are expanded verbatim as they are referenced,
    that is, if the expansion contains another variable reference, it is also expanded.
    The expansion continues until no further variables exist to expand, hence the
    name, recursively expanded. For example, consider the variables `TOPDIR` and `SRCDIR`
    defined as follows:


    ```

    ```

    TOPDIR = /home/kwall/myproject

    SRCDIR = $(TOPDIR)/src

    ```

    ```


    Thus, `SRCDIR` will have the value `/home/kwall/myproject/src`. This works as
    expected and desired. However, you cannot append text to the end of a previously
    defined variable. Consider the next variable definition:


    ```

    ```

    CC = gcc

    CC = $(CC) -g

    ```

    ```


    Clearly, what you ultimately want is `CC = gcc -g`. That is not what you will
    get, however. `$(CC)` is recursively expanded when it is referenced, so you wind
    up with an infinite loop: `$(CC)` will keep expanding to `$(CC)`, and you never
    pick up the `-g` option. Fortunately, *make* detects this and reports an error:


    ```

    *** Recursive variable ''CC'' references itself (eventually). Stop.

    ```


    Figure 2.1 illustrates the problem with recursive variable expansion.


    ![](img/be588b36b489136ce784030a08a1d3d4_75_0.png)


    As you can see in the figure, recursive expansion when you try to append something
    to a previously defined variable starts an infinite loop. The boxed text represents
    the result of the previous expansion, while the recursive element is represented
    by prepending `$(CC)` to the front of the previous expansion. Clearly, the `CC`
    variable will never resolve.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'To avoid this difficulty, make also uses simply expanded variables. Rather
    than being expanded when they are referenced, simply expanded variables are scanned
    once when they are defined; all embedded variable references are immediately resolved.
    The definition syntax is slightly different:


    ```

    CC := gcc CC += -g

    ```


    The first definition uses := to set CC equal to gcc and the second definition
    uses += to append -g to the first definition, so that CC''s final value is gcc
    -g (+= works in make the same way it does in C). Figure 2.2 illustrates graphically
    how simply expanded variables work. If you run into trouble when using make variables
    or get the "VARIABLE references itself" error message, it''s time to use the simply
    expanded variables. Some programmers use only simply expanded variables to avoid
    unanticipated problems. Since this is Linux, you are free to choose for yourself!


    ![](img/be588b36b489136ce784030a08a1d3d4_76_0.png)


    Figure 2.2 shows that each time a variable is referenced, it is expanded completely.
    The variable assignments on the left side have the values show on the right side,
    and the values contain no variable references.


    # Examples


    ![](img/be588b36b489136ce784030a08a1d3d4_76_1.png)


    # Example


    +   1. This makefile uses recursively expanded variables. Because it repeatedly
    references the CC variable, the make will fail. The file hello.c (in the source
    code directory for this chapter on the CD-ROM) is taken from Chapter 1.


    ```

    CC = gcc CC = $(CC) -g hello: hello.c $(CC) hello.c -o hello

    ```


    ![](img/be588b36b489136ce784030a08a1d3d4_76_2.png)


    # Output


    ```

    $ make hello Makefile:5: *** Recursive variable ''CC'' references itself (eventually).
    Stop.

    ```


    As you would expect, make detected the recursive use of CC and stopped.'
  merge: -1
  img_proc: true
