  md: "# Example\n\n# Example\n\nThe following example opens and closes a pipe:\n\n\
    ```\n/*\n* pipopn.c Open and close a pipe\n*/\n#include <unistd.h>\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nint main(void)\n{\n\tint fd[2];\n\n\tif((pipe(fd)) < 0)\
    \ {\n\t\tperror (\"pipe\");\n\t\texit(EXIT_FAILURE);\n\t}\n\tprintf(\"descriptors\
    \ are %d, %d\\n\", fd[0], fd[1]);\n\n\tclose(fd[0]);\n\tclose(fd[1]);\n\texit(EXIT_SUCCESS);\n\
    }\n```\n\nThe output from this program shows that the `pipe` call succeeded (the\
    \ descriptor values might be different on your system). The program calls the\
    \ `pipe` function, passing it the array of file descriptors, fd. If the `pipe`\
    \ call succeeds, the program prints the integer values of the file descriptors,\
    \ closes them both, and exits.\n\n# Output\n\n```\n$ ./pipopn\ndescriptors are\
    \ 3, 8\n```\n\n# Reading and Writing Pipes\n\nTo read from and write to pipes,\
    \ simply use the `read` and `write` calls. Remember, `read` reads from `filedes[0]`,\
    \ and `write` writes to `filedes[1]`.\n\n> * For a quick refresher on the `read`\
    \ and `write` system calls, refer to the section, \"Reading and Writing Files,\"\
    \ page 141."
