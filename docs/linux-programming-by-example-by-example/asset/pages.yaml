- pgno: 271
  md: "where `win` is the window in question. Complete descriptions of functions that\
    \ set and get window backgrounds can be found in the `curs_bkgd(3)` manual page.\n\
    \nAt least 11 ncurses functions draw boxes, borders, and lines in ncurses windows.\
    \ The `box` call is the simplest; it draws a box around a specified window using\
    \ one character for vertical lines and another for horizontal lines. Its prototype\
    \ is listed here:\n\n```\nint box(WINDOW *win, chtype verch, chtype horch);\n\
    ```\n\n`verch` sets the pseudo-character used to draw vertical lines and `horch`\
    \ sets the same for horizontal lines.\n\nThe `box` call is actually a macro, and\
    \ is shorthand for the more general `wborder` function:\n\n```\nint border(WINDOW\
    \ *win, chtype ls, chtype rs, chtype ts, chtype bs,\n           chtype tl, chtype\
    \ tr, chtype bl, chtype br);\n```\n\nThe arguments are as follows:\n\n+   * `ls`—Left\
    \ side\n+   \n+   * `rs`—Right side\n+   \n+   * `ts`—Top side\n+   \n+   * `bs`—Bottom\
    \ side\n+   \n+   * `tl`—Top-left corner\n+   \n+   * `tr`—Top-right corner\n\
    +   \n+   * `bl`—Bottom-left corner\n+   \n+   * `br`—Bottom-right corner\n\n\
    Both the `box` and the `wborder` calls draw an outline on the window along its\
    \ left, right, top, and bottom margins.\n\nUse the `hline` function to draw a\
    \ horizontal line of arbitrary length on the current window; `vline`, similarly,\
    \ draws a vertical line of arbitrary length.\n\n```\nint hline(chtype ch, int\
    \ n);\nint vline(chtype ch, int n);\n```\n\nBy following ncurses' function naming\
    \ convention, you can also specify a window in which to draw lines using the functions\
    \ listed here:\n\n```\nint whline(WINDOW *win, chtype ch, int n);\nint wvline(WINDOW\
    \ *win, chtype ch, int n);\n```"
