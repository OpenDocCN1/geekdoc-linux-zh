- pgno: 543
  md: '# A—

    ## Additianal Resources


    # **Annotated Bibliography**


    *Advanced Programming in the UNIX Environment*, W. Richard Stevens (Addison-Wesley,
    1993), ISBN 0-201-56317. The classic work on programming for UNIX. Although not
    Linux specific (it never even mentions Linux, in fact), it completely covers all
    of the issues regarding POSIX compliance. Since Linux is a UNIX clone, most of
    the techniques mentioned also apply to Linux. Stevens is currently revising APUE,
    as it is conventionally known.


    *The Art of Computer Programming, Volume 1: Fundamental Algorithms*, 3rd Edition,
    Donald Knuth (Addison-Wesley, 1997), ISBN 0-201-89683-4.


    *The Art of Computer Programming, Volume 2: Seminumerical Algorithms*, 3rd Edition,
    Donald Knuth (Addison-Wesley, 1998), ISBN 0-201-89684-2.


    *The Art of Computer Programming, Volume 3: Sorting and Searching*, 3rd Edition,
    Donald Knuth (Addison-Wesley, 1998), ISBN 0-201-89685-0. These three volumes are
    the classic works on software development. They are tool- and language-neutral,
    but the distilled knowledge of 30 years of programming, as well as thousands of
    algorithms, are well worth the investment (the three-volume set costs over $125.00).


    *Beginning Linux Programming*, Neil Matthewes and Rick Stones (Wrox Press, 1996).
    This book, although dated at this point, covers basic Linux/UNIX programming techniques.
    It is mis-titled, however, as it covers UNIX programming too.


    *The C Answer Book: Solutions to Exercises in the C Programming Language*, 2nd
    Edition, Clovis L. Tondo, Scott E. Gimpel (Prentice Hall, 1989), ISBN 0-13-109653-2.
    This book contains solutions for each exercise Kernighan and Ritchie put in their
    book, *The C Programming Language*. Unfortunately, the solutions assume knowledge
    of language features not yet introduced.'
  merge: -1
  img_proc: true
- pgno: 544
  md: '*C Programming: A Modern Approach*, K. N. King (W. W. Norton and Company, 1996).
    King''s book is generally recommended as the tutorial introduction to C for those
    who find The C Programming Language too terse.


    *The C Programming Language*, 2nd Edition, Brian W. Kernighan, Dennis M. Ritchie
    (Prentice Hall, 1988), ISBN 0-393-96945-2. A concise but complete manual of the
    C programming language, as standardized by ANSI and ISO, written by the two men
    who created C.


    *Developing Linux Applications with GTK+ and GDK*, Eric Harlow (New Riders, 1999),
    ISBN 0-7357-0021-4. GTK+ and GDK provide the toolkits and libraries underneath
    GNOME, the Enlightenment window manager, and the popular GIMP image manipulation
    program, an Adobe PhotoShop clone.


    *GNU Make: A Program for Directing Recompilation*, Richard M. Stallman and Roland
    McGrath (Free Software Foundation, 1998), ISBN 1-882114-80-9. Written by the creator''s
    of GNU make, this book covers make front to back and top to bottom. If it is not
    covered in this book, you''ll have to look at the source code.


    *Introduction to Computer Graphics*, James D. Foley, Andries van Dam, Steven K.
    Feiner, John F. Hughes, Richard L. Phillips (Addison-Wesley, 1993), ISBN 0-201-60921-5.
    The classic work on computer graphics. This version is actually an abridged version
    of Computer Graphics: Principles and Practice. If you want to understand computer
    graphics, this book, or its larger cousin, is the one to own.


    *Learning the bash Shell*, 2nd Edition, Cameron Newham, Bill Rosenblatt (O''Reilly,
    1998), ISBN 1-56592-347-2. A tutorial introduction to the bash shell, it contains
    several chapters devoted to bash shell script programming.


    *Learning the Korn Shell*, Bill Rosenblatt (O''Reilly, 1993), ISBN 1-56592-054-6.
    A tutorial introduction to the Korn shell, it contains several chapters to Korn
    shell script programming. Everything in it should apply to pdksh, the public domain
    incarnation of the Korn shell.


    *Learning Perl*, 2nd Edition, Randal L. Schwartz & Tom Christiansen (O''Reilly,
    1997), ISBN 1-56592-284-0. If you want to learn Perl, this is the book to read.


    *Linux Application Development*, Michael K. Johnson, Erik W. Troan (Addison-Wesley,
    1998), 0-201-30821-5. Written by two of Red Hat Software''s top application programmers,
    this book does an excellent job of explaining the subtleties of writing Linux
    applications. It does not cover kernel hacking, however.'
  merge: -1
  img_proc: true
- pgno: 545
  md: '*Linux Device Drivers*, Alessandro Rubini (O''Reilly, 1998), ISBN 56592-292-1.
    This is *the* book on how to write device drivers for Linux; it contains several
    complete, useful examples.


    *The Linux Kernel Book*, Remy Card, Eric Dumas, Franck Mével (John Wiley and Sons,
    1998), ISBN 0-471-98141-0. Translated from French, Card and his co-authors explain
    almost every single line of code in the 2.0.x kernel. It is out of date now, of
    course, due to the release of the 2.2 kernel, but it is still an excellent introduction.
    The translation is rough and uneven. This book can''t see the forest for the trees.


    *Linux Kernel Internals*, 2nd Edition, Michael Beck, Harald Böhme, Mirko Dzia
    dzka, Ulrich Kuntz, Robert Magnus, Dirk Verworner (Addison-Wesley, 1998), ISBN
    0-201-33143-8. One-third the size of *The Linux Kernel Book*, Beck and company
    give the reader a much better introduction to the Linux kernel.


    *Linux Programming*, Patrick Vollerding, Eric Foster-Johnson, Kevin Reichard (MIS
    Press, 1997), ISBN 1-55828-507-5. Vollerding, creator of the popular Slackware
    distribution, surveys the broad landscape of Linux programming, covering a lot
    of ground in a short period of time.


    *Linux Programming Unleashed*, Kurt Wall, Mark Watson, Mark Whitis (Macmillan
    Computer Publishing, 1999), ISBN 0-672-31607-2. This is an intermediate-to-advanced
    level book covering many aspects of Linux programming.


    *Practical Programming in Tcl and Tk*, Second Edition, Brent B. Welch (Prentice
    Hall, 1997), ISBN 0-13-616830-2. Tcl/Tk is the most fully-featured of UNIX/Linux
    scripting languages. Tcl is the character mode part and Tk adds an X Window interface.
    This book is the recommended text for learning Tcl/Tk.


    *Programming Perl*, 2nd Edition, Larry Wall, Tom Christiansen, Randal L. Schwartz
    (O''Reilly, 1996), ISBN 1-56592-149-6. Written by three Perl luminaries, including
    the creator of the language, Larry Wall, it covers the entire breadth of programming
    with Perl, version 5.


    *Programming with GNU Software*, Mike Loukides, Andy Oram (O''Reilly, 1997), ISBN
    1-56592-112-7. Written by members of Cygnus Solutions, vendors of support and
    commercial version of GNU tools, this is an excellent book on using GNU development
    tools such as `gcc`, Emacs, `make`, and `gdb`, the GNU debugger.


    *Programming with Qt*, Atthias Kalle Dalheimer (O''Reilly, 1999), ISBN 1 56592-588-2.
    At the moment, this is the only published book-length treatment of programming
    with Qt. If you intend to do serious programming using the Qt toolkit, this book
    is a must have.'
  merge: -1
  img_proc: true
