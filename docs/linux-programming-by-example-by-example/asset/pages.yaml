    ```


    ![](img/be588b36b489136ce784030a08a1d3d4_418_0.png)


    A client and server connecting to a socket.


    For each call, `sockfd` is the file descriptor returned by a previous call to
    `socket`, `sockaddr` is a pointer to a socket address structure, and `addrlen`
    is `sockaddr`''s size (note that the `accept` call may change this value upon
    its return).


    The `backlog` argument to `listen` defines the maximum number of pending connections
    that are allowed to queue on a given socket before additional connection requests
    are refused outright. Historically, this value has been five, but it can be changed.


    `bind`, `listen`, and `connect` return zero if they succeed. As usual, if they
    fail, they return -1 and set `errno` to reflect the error that occurred. The `accept`
    call, however, returns a new file descriptor that can be used by the accepting
    process (usually a server) for file I/O operations using the `write` and `read`
    system calls. On failure, `accept` returns -1 and sets `errno`.'
