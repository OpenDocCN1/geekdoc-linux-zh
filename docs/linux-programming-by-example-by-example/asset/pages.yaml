- pgno: 51
  md: '# **Optimization Options**


    Code optimization is an attempt to improve performance. The tradeoff is longer
    compile times, increased memory usage during compilation, and, perhaps, larger
    code sizes.


    Currently, `gcc` has three optimization levels. The bare `-0` option tells `gcc`
    to reduce both code size and execution time. It is equivalent to `-O1`. The types
    of optimization performed at this level depend on the target processor, but always
    include at least thread jumps and deferred stack pops. *Thread jump optimizations*
    attempt to reduce the number of jump operations. *Deferred stack pops occur when
    the compiler allows arguments to accumulate on the stack as functions return and
    then pops them simultaneously, rather than popping the arguments piecemeal as
    each called function returns.*


    The `-O2` level optimizations include all level one optimizations plus additional
    tweaks that involve processor instruction scheduling. At this level, the compiler
    attempts to ensure that the processor has instructions to execute while waiting
    for the results of other instructions. The compiler also attempts to compensate
    for *data latency*, which is the delay caused by fetching data from cache or main
    memory. The implementation is highly processor-specific. `-O3` options include
    all `-O2` optimizations, loop unrolling, and other processor-specific features.


    Depending on the amount of low-level knowledge you have about a given CPU family,
    you can use the `-fflag` option to request specific optimizations you want performed.
    Three of these flags bear consideration: `-ffastmath`, `-finline-functions`, and
    `-funroll-loops`. `-ffastmath` generates floatingpoint math optimizations that
    increase speed, but violate IEEE and/or ANSI standards, `-finline-functions` expands
    all "simple" functions in place, much like preprocessor macro replacements. The
    compiler decides what constitutes a simple function, however.


    `-funroll-loops` instructs `gcc` to unroll all loops that have a fixed number
    of iterations, provided that the number of iterations can be determined at compile
    time. *Loop unrolling* means that each iteration of a loop will become an individual
    statement. So, a loop that has, for example, 100 iterations, becomes 100 sequential
    blocks of code, each executing the same statements. Figure 1.2 illustrates loop
    unrolling graphically.


    Note that the figure simply illustrates the general principle of loop unrolling.
    The actual method that `gcc` uses may be dramatically different.


    The optimizations that `-finline-functions` and `-funroll-loops` enable can greatly
    improve a program''s execution speed because they avoid the overhead of function
    calls and variable lookups, but the cost is usually a large'
  merge: -1
  img_proc: true
