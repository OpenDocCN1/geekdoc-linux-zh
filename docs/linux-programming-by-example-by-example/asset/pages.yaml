  md: "# Detecting Mouse Events\n\nTable 12.1 lists the most common mouse events you\
    \ can catch. The complete list is available in the `curs_mouse(3)` manual page.\n\
    \n*Table 12.1: Mouse Events Report by ncurses*  \n| Event Name | Event Description\
    \ |\n| :--- | :--- |\n| `BUTTON1_PRESSED` | Mouse button 1 down |\n| `BUTTON1_RELEASED`\
    \ | Mouse button 1 up |\n| `BUTTON1_CLICKED` | Mouse button 1 clicked |\n| `BUTTON1_DOUBLE_CLICKED`\
    \ | Mouse button 1 double-clicked |\n| `BUTTON1_TRIPLE_CLICKED` | Mouse button\
    \ 1 triple-clicked |\n| `BUTTON2_PRESSED` | Mouse button 2 down |\n| `BUTTON2_RELEASED`\
    \ | Mouse button 2 up |\n| `BUTTON2_CLICKED` | Mouse button 2 clicked |\n| `BUTTON2_DOUBLE_CLICKED`\
    \ | Mouse button 2 double-clicked |\n| `BUTTON2_TRIPLE_CLICKED` | Mouse button\
    \ 2 triple-clicked |\n| `BUTTON3_PRESSED` | Mouse button 3 down |\n| `BUTTON3_RELEASED`\
    \ | Mouse button 3 up |\n| `BUTTON3_CLICKED` | Mouse button 3 clicked |\n| `BUTTON3_DOUBLE_CLICKED`\
    \ | Mouse button 3 double-clicked |\n| `BUTTON3_TRIPLE_CLICKED` | Mouse button\
    \ 3 triple-clicked |\n| `BUTTON_SHIFT` | Shift was down during button state change\
    \ |\n| `BUTTON_CTRL` | Control was down during button state change |\n| `BUTTON_ALT`\
    \ | Alt was down during button state change |\n| `ALL_MOUSE_EVENTS` | Report all\
    \ button state changes |\n| `REPORT_MOUSE_POSITION` | Report mouse movement |\n\
    \nMouse button 1 is the left mouse button; mouse button 2 is the right mouse button\
    \ on a two-button mouse or the middle mouse button on a threebutton mouse; mouse\
    \ button 3 is the right mouse button on a two- or threebutton mouse.\n\n![](img/be588b36b489136ce784030a08a1d3d4_295_0.png)\n\
    \n# Example\n\nThis program illustrates the basic procedure for catching and interpreting\
