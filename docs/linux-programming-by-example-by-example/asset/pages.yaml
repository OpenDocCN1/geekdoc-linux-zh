  md: "returning 0 on success or -1 on error, rewinddir moves the stream pointer back\
    \ to the beginning of the stream. It also returns 0 on success or -1 on failure.\n\
    \nreaddir does most of the work of reading a directory. It returns a pointer to\
    \ a dirent structure that contains the next directory entry from dir. Each subsequent\
    \ call to readdir overwrites the returned dirent structure with new data. Upon\
    \ reaching the end-of-file or if an error occurs, readdir returns NULL. To obtain\
    \ the filename, use the dirent. d_name[] member, which returns a pointer to the\
    \ filename.\n\n> CAUTION\n> The dirent structure has only one member whose use\
    \ is portable (that is, defined by POSIX to have predictable behavior on all POSIX-compliant\
    \ systems): d_name[]. All other members are system defined and system dependent,\
    \ so their names and/or the kind of data they contain might vary from system to\
    \ system. Some filesystems, for example, still limit filenames to 14 characters,\
    \ while others, like Linux, allow up to 256 characters.\n\n# Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_197_0.png)\n\
    \n# Example\n\nThe program that follows, listdir, lists the contents of the directory\
