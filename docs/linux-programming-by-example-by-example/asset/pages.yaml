  md: "Of course, the displayed values will be different on your system.\n\n> **NOTE**\n\
    > \n> <unistd.h> declares many functions that are part of the POSIX standard.\
    \ Briefly, *POSIX*, which stands for the Portable Operating System Interface,\
    \ is a family of standards that defines the services and capabilities an operating\
    \ system must provide if it is to be considered \"POSIX compliant.\" However,\
    \ *POSIX* defines only the standard interface, not an implementation. Many non-UNIX\
    \ operating systems, such as Microsoft's Windows NT, claim *POSIX* compliance.\n\
    > \n> *POSIX* compliance is important because, at least in theory, it makes applications\
    \ written to run on one type of system easy to port to another system. By using\
    \ the standard *POSIX* interface to obtain a user's ID, for example, the program\
    \ would not have to be rewritten to run on another system. Instead, the program\
    \ would simply be recompiled on the other system. Finally, because *POSIX* is\
    \ a generally accepted standard, many companies require software they purchase\
    \ to be *POSIX* compliant.\n\n# *Real and Effective IDs*\n\nIn addition to their\
    \ PIDs and PPDs, each process has several other identifying attributes, which\
    \ are listed in Table 4.1 along with their C language type and the functions that\
    \ return them. To use the functions listed in Table 4.1's third column, you must\
    \ include both <sys/types.h> and <unistd.h> in your code.\n\nTable 4.1: Process\
    \ Attributes\n\n| Attribute       | Type  | Function        |\n| :--------------\
    \ | :---- | :-------------- |\n| Process ID      | pid_t | getpid(void);   |\n\
    | Parent Process ID | pid_t | getppid(void);  |\n| Real User ID    | uid_t | getuid(void);\
    \    |\n| Effective User ID | uid_t | geteuid(void);   |\n| Real Group ID   |\
    \ gid_t | getgid(void);    |\n| Effective Group ID | gid_t | getegid(void);  \
    \ |\n\nEach process has three user IDs (UIDs) and three group IDs (GIDs). They\
    \ are used primarily for security purposes, such as assigning file access permissions\
    \ and limiting who can run certain programs. The real user ID and real group ID\
    \ are who you really are. They are read from /etc/passwd when you log in. They\
    \ are the numeric representations of your login name and your primary group membership.\n\
    \nFor example, on my system, my UID is 500, which corresponds to kwall, my login\
    \ name. My GID is 100, which corresponds to the group named users. The getuid\
    \ and geteuid functions return the real UID and effective UID, respectively, of\
    \ the process from which they were called. Similarly, the getgid and getegid functions\
    \ return the calling process's real and effective"
