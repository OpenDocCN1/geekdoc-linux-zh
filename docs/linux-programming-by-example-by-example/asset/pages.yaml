- pgno: 230
  md: 'Having added `syslog`''s logging functionality, if you try to execute the program
    as a normal user, `lpdated` will write an entry to the system log (usually `/var/log/messages`
    on Linux systems) resembling the following:


    > Sep 14 21:12:04 hoser lpdated[8192]: open


    This log entry indicates that at the date and time specified, on the host named
    `hoser`, a program named `lpdated`, with a PID of 8192, entered the text `open`
    into the system log. Referring to `lpdated`''s source code, you would be able
    to see where the error occurred.


    All the error messages `lpdated` generates will be logged to the system log, although
    the timestamps themselves will still be written to `/var/log/lpdated.log`. The
