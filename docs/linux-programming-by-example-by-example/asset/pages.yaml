- pgno: 316
  md: '# Sounding Off


    Sound cards are not monolithic hardware devices. Instead, they are made up of
    several components. Although there is considerable variety among manufacturers,
    and even among a single manufacturer''s cards, most cards have a MIDI interface,
    a digital voice device, a mixer device, and a synthesizer. Linux''s support for
    these devices is enabled through entries under the /dev filesystem:


    ```

    `/dev/mixer` , `/dev/dsp` , `/dev/audio` , `/dev/sequencer` , and `/dev/midi`
    .

    ```


    # Sound Hardware


    The MIDI (*Musical Instrument Digital Interface*) interface is a port that connects
    external devices, particularly synthesizers, but also lighting equipment and other
    stage props, to a computer. The mixer is a control device that controls input
    and output volume levels and switches among the available input devices, such
    as microphones and CDs. Digital voice devices are used to record and play back
    digitized voice data. They are generally referred to by the *codecs* , or algorithms,
    used to record and encode the sample.


    Synthesizer devices are used to play music and generate a wide variety of sounds
    and sound effects. In general, synthesizers fall into two categories. One group
    is based on the Yamaha OPL2 and OPL3 chips, which are common on most sound cards.
    The second group are wave table synthesizers—they produce sound from recorded
    instrument samples stored in chips on the card. Of the two types, wave table synthesizers
    produce far richer, more realistic sounds.


    # Sound Devices


    Linux''s /dev filesystem contains device files that correspond roughly one-to-one
    with the sound hardware available. All the devices end with a number *N* , usually
    0, 1, or 2, to which the device name is symbolically linked. For example, on my
    system, `/dev/mixer` is a symbolic link to `/dev/mixer0`. The rest of this chapter
    refers to the symbolic links unless it is necessary to refer to specific device
    files.


    `/dev/mixer` is the interface to the mixer hardware, whereas `/dev/dsp` and `/dev/audio`
    are the primary interfaces to the digital voice devices. The only difference between
    the two is that `/dev/audio` uses µLaw (µ is the Greek letter *mu* , pronounced
    "mew") encoding by default, which represents 12or 16-bit samples in 8 bits, whereas
    `/dev/dsp` uses 8-bit unsigned linear encoding. `/dev/sequencer` is the device
    used for electronic music and the sounds emitted by games. It is the interface
    to the synthesizer chips on the sound card and also can be used to access external
    MIDI devices and the wave table, `/dev/midi` , finally, is used for low-level
    MIDI output.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Guidelines for Sound Programming


    The following guidelines are taken from the OSS programmer''s guide, written by
    Hamu Savolainen, original author of the Linux sound API. The complete document
    can be found at http://www.4front-tech.com/gguide/intro.html on the World Wide
    Web.


    First and foremost, the sound API is designed to enable applications written to
    it to be portable across both operating systems and sound hardware. Toward this
    end, the API relies on macros defined in `<sys/soundcard.h>`. Although the implementation
    has and will continue to change as the sound driver develops, the macros remain
    consistent. Do not, furthermore, code your applications to use the numbered devices.
    Instead, use the symbolic links described in the previous section, "Sound Devices."
    Users might have multiple sound devices or other reasons to use different device
    numbers, but the symbolic links will always point to the devices users want to
    use for a given purpose.


    Avoid "feature-itis," which is the process of weighing your application down with
    flashy features that are secondary to its main purpose. If you are writing a CD
    player, for example, it does not need the capability to record sounds. On a similar
    note, do not assume that everyone is using the latest whiz-bang sound card. Instead,
    write the lowest common denominator, the Sound Blaster, and add code that detects
    and uses advanced or high-end features (see the section, "Advanced Audio Programming,"
    for tips on how to do this).


    # Using the Sound API


    To use the sound API, include `<sys/soundcard.h>` in your source code. No special
    linker commands are required, but, of course, you must have a working sound card.
    Before discussing the sound API in detail, you must know the `ioctl` call, which
    stands for input/output control, and is used to manipulate a character device
    via a file descriptor. Its prototype, declared in `<ioctl.h>`, is listed here:


    ```

    ```c

    int ioctl(int fd, int request, ...);

    ```

    ```


    `ioctl` controls the device opened on file descriptor `fd`, and performs the command
    contained in `request`. A third argument, `char *argp` by convention, often carries
    a size argument. `ioctl` is a catch-all command for operations that do not cleanly
    fit into the Linux stream I/O model. A partial list of `ioctl` requests, typically
    called `ioctls`, can be found in the `ioctl_list(2)` manual page, but it is terribly
    out of date.


    The mixer `ioctl`s fall into three categories: volume control, input source, and
    query functions. The query capability is especially important. Some sound cards
    do not have a mixer, for example, or they do not have a main'
