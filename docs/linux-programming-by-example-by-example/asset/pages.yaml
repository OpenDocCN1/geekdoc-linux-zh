  md: "# String Input\n\nThe `getstr` function, declared as\n\n```\nint getstr(char\
    \ *str);\n```\n\nrepeatedly calls `getch` until it encounters a newline or carriage\
    \ return (which will not be part of the returned string). The characters input\
    \ are stored in `str`. Because `getstr` performs no bounds checking, you should\
    \ use `getnstr` instead, which takes an additional argument specifying the maximum\
    \ number of characters to store. Regardless of whether you use `getstr` or `getnstr`,\
    \ the receiving buffer `str` must be large enough to hold the string received\
    \ plus a terminating null character, which must be added programmatically. `getnstr`'s\
    \ prototype follows:\n\n```\nint getnstr(char *str, int n);\n```\n\n`getnstr`\
    \ copies a maximum of `n` characters from `stdscr` to `n` buffer to which `str`\
    \ points. Input beyond a count of `n` causes a beep.\n\n`scanw` obtains formatted\
    \ input from the keyboard in the manner of `scanf(3)` and family. In fact, ncurses\
    \ passes the received characters as input to `sscanf(3)`, so input that does not\
    \ map to available arguments in the format field goes to the bit bucket. As usual,\
    \ `scanw` has variants for movement operations (the \"mv\" prefix) and variants\
    \ that apply to specific windows (the \"w\" prefix). In addition, the `scanw`\
    \ family of functions includes a member for dealing with variable length argument\
    \ lists, `vws canw`. The relevant prototypes are as follows:\n\n```\nint scanw(char\
    \ *fmt [, arg] . . . );\nint vws canw(WINDOW *win, char *fmt, va_list varglist);\n\
    ```\n\nThe manual pages `curs_getch(3)`, `curs_getstr(3)`, and `curs_scanw(3)`\
    \ fully document these routines and their various permutations.\n\n# Example\n\
    \n![](img/be588b36b489136ce784030a08a1d3d4_281_0.png)\n\n# Example\n\n```\n```\n\
    /*\n * cursgstr.c - ncurses string input functions\n */\n#include <stdlib.h>\n\
    #include <curses.h>\n#include <errno.h>\n#include <string.h>\n#include \"utilfcns.h\"\
    \n\n#define BUFSSZ 20\n```\n```"
