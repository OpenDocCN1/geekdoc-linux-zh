    order. The difference between message queues and FIFOs is illustrated in Figure
    17.1.


    ![](img/be588b36b489136ce784030a08a1d3d4_392_0.png)


    ![](img/be588b36b489136ce784030a08a1d3d4_392_1.png)


    Figure 17.1:

    Unlike FIFOs, messages can be read from a queue in any order.


    As you know, data is read from a FIFO in the same order as it was written. This
    is illustrated in the top half of Figure 17.1. However, if you know a message''s
    message type, you can extract a given message from a queue. As shown by the arrows
    exiting and leaving the message queue, messages usually are read in first-in first-out
    order. The two dotted rectangles with outward pointing arrows on the message queue
    show how messages can be read in arbitrary order.


    All the queue-manipulation functions are declared in `<sys/msg.h>`, but you must
    also include `<sys/types.h>` and `<sys/ ipc.h>` to access the type and constant
    declarations they contain. To create a new queue or to open an existing one, use
    the `msgget` function. To add a new message to the bottom of a queue, use `msgsnd`.
    To grab a message off a queue, use the `msgrecv` call. `msgctl` enables you to
    manipulate queue features and to delete a queue, provided the calling process
    is the queue''s creator or has superuser permissions.'
