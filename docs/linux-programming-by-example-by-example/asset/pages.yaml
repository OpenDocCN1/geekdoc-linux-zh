    # Using rcs


    The rcs command is primarily an administrative command. In normal usage, though,
    it is useful in two ways. If you checked out a file as read-only, and then made
    changes you can''t bear to lose, rcs -l filename will check out filename with
    a lock without simultaneously overwriting the working file. If you need to break
    a lock on a file checked out by someone else, rcs -u filename is the command to
    use. The file is unlocked, and a message is sent to the original locker containing
    an explanation from you about why you broke the lock.


    Recall that each time you check a file in, you can type a check-in message explaining
    what has changed or what you did. If you make a typographical error or some other
    mistake in the check-in message, or would simply like to add additional information
    to it, you can use the following rcs command:


    ```

    $ rcs -mrev:msg

    ```


    rev is the revision whose message you want to correct or modify and msg is the
    corrected or additional information you want to add.


    # Example


    ![](img/be588b36b489136ce784030a08a1d3d4_462_0.png)


    # Example


    This example uses rcs to change the check-in message for revision 1.2 of prnenv.c:


    ```

    $ rcs -m1.2:"Deleted static buffer ''rcsid[]''" prnenv.c

    RCS file: RCS/prnenv.c,v

    done

    ```


    ![](img/be588b36b489136ce784030a08a1d3d4_462_1.png)


    # Output


    ```

    rlog -rl.2 prnenv.c

    RCS file: RCS/prnenv.c,v

    Working file: prnenv.c

    head: 1.3

    ```'
