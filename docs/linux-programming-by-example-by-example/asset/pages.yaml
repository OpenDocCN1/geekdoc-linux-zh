- pgno: 499
  md: "```\n■ /etc/ rpm/i686-linux/macros:~/.rpmmacros\noptflags\t\t\t\t: -O2\n========================================\n\
    -14: GNUconfigure(MC:)\n$(libtoolize) --copy --force\n${_aclocal}\n${_autoheader}\n\
    ${_automake}\n${_autoconf}\n${-C:_mydir=\"${pwd}\"; ${-M:${_mkdir} -p ${-C*}};\
    \ cd ${-C*}; }\n\t. . .\n```\n\nYour system might have slightly different settings.\
    \ As you can see, the output is divided into two sections: architecture and operating\
    \ system settings, which define the build and install environment; and `rpmmrc`\
    \ values, which control RPM’s behavior. The global configuration file, `/etc/rpmmrc`,\
    \ should be used for settings of a systemwide sort. The local file, `$HOME/.rpmmrc`,\
    \ contains values specific to the user building an RPM. In most cases, few settings\
    \ in the `rpmmrc` file require changing.\n\n> **TIP**\n> \n> The most common value\
    \ changed in `$HOME/.rpmmrc` is the name of the packager.\n> \n> However, because\
    \ you can also specify this directly in the spec file, there is little reason\
    \ to use this. The problem with using a personal `.rpmmrc` file is that you might\
    \ forget what it contains and propagate bad build information out to people using\
    \ your RPMs. It is better to stick with the global settings in `/etc/rpmmrc`.\n\
    \n# The Structure of a Spec File\n\nThe spec file, after the source code itself,\
    \ is the most important element of an RPM because it defines what to build, how\
    \ to build it, where to install it, and the files that it contains. Each spec\
    \ file you create should be named according to the standard naming convention,\
    \ `pkgname-version-release.`spec`, where `pkgname` is the name of the package,\
    \ `version` is the version number, typically in x.y.z format, and `release` is\
    \ the release number of the current version.\n\nFor example, the name `ncurses\
    \ -4.2-18.`spec `breaks down to version 4.2, release number 18, indicating that\
    \ this is the eighteenth \"version\" (don't get confused by the \"version\" of\
    \ version 4.2 of ncurses. Release numbers are used by software vendors to indicated\
    \ how many times they have built a specific package. Version numbers, on the other\
    \ hand, are set by the maintainer of the package. Each spec file has eight sections:"
  merge: -1
  img_proc: true
- pgno: 500
  md: '+   - **Header**—The header section contains information returned by RPM queries,
    such as a description, version, source location, patch names and locations, and
    the name of an icon file.


    +   - **Prep**—The prep section consists of whatever preparation must take place
    before the actual build process can begin. Generally this is limited to unpacking
    the source and applying any patches.


    +   - **Build**—As you might expect, the build section lists the commands necessary
    to compile the software. In most cases, this is a single make command, but it
    can be as complex and obtuse as you desire.


    +   - **Install**—Again, the name is self-explanatory. The install section lists
    the name of the command, such as make install, or the name of the shell script
    that performs the software installation after the build successfully completes.


    +   - **Install/Uninstall Scripts**—These scripts, which are optional, are run
    on the user''s system when the package is removed or installed.


    +   - **Verify Script**—Usually, RPM''s verification routines are sufficient,
    but if they fall short of your needs, this section lists any commands or shell
    scripts that make up for RPM''s shortcomings.


    +   - **Clean**—This section handles any post-build clean-up but is rarely necessary
    because RPM does an excellent job of cleaning up after itself.


    +   - **File List**—An essential component (an RPM will not build without it),
    this section contains a list of files that make up your package, sets their file
    attributes, and identifies documentation and configuration files.


    # Analyzing a Spec File


    The following spec file is taken from the xearth package shipped with Red Hat
    6.0, /usr/src/redhat/SPECS/xearth.spec. The first part of the spec file is the
    header:


    ```

    Summary: An X display of the Earth from space.

    Name: xearth

    Version: 1.0

    Release: 12

    Copyright: MIT

    Group: Amusements/Graphics

    Source: ftp://cag.lcs.mit.edu/pub/tuna/xearth-1.0.tar.gz

    Patch: xearth-1.0-redhat.patch

    BuildRoot: /var/tmp/xearth-root

    ```'
  merge: -1
  img_proc: true
- pgno: 501
  md: '# %description


    Xearth is an X Window System based graphic that shows a globe of the  Earth, including
    markers for major cities and Red Hat Software. The  Earth is correctly shaded
    for the current position of the sun, and the  displayed image is updated every
    five minutes.


    This is the end of the header section. As you can see, a ton of information is
    provided, which can be retrieved from RPM''s database using RPM''s powerful query
    capabilities. The name, version, and release information directly affects the
    build process, but the balance of the information is strictly informational.


    The next section of a spec file is the prep section. It defines the steps necessary
    to prepare the package to be built.


    ```

    %prep

    %setup -q

    %patch -p0

    ```


    The prep section is pretty simple: It applies a patch, in this case,  /usr/src/redhat/SOURCES/xearth-1.0-redhat.patch,
    to the pristine sources. That''s it. Badda bing, badda boom.


    Well, the situation is actually a bit more complex. The line %setup is an RPM
    macro. It accomplishes several tasks, in this case, cd ing into the BUILD directory,
    deleting the remnants of previous build attempts (if any), uncompressed and extracting
    the source code, a gzipped tarball,  /usr/src/redhat/SOURCES/xearth-1.0.tar.gz,
    cd ing into the extracted directory, and recursively changing ownership and permission
    on the extracted directory and its files. This is the simplest way the %setup
    macro can be used. It takes a variety of arguments that modify its behavior, but
    in most cases, the default behavior is what you want and all you will need.


    After the prep section comes the build section. It details how to build the package.


    ```

    %build

    xmkmf

    make

    ```


    The build section is fairly straightforward. In effect, the two commands are a
    script passed to /bin/sh to build the package. RPM checks the return codes for
    each step, aborting the build with a useful message if an error occurred.'
  merge: -1
  img_proc: true
- pgno: 502
  md: 'After the package is built, you probably want to install it. The install section
    provides the information required to do so.


    ```

    ```

    %install

    rm -rf $RPM_BUILD_ROOT

    mkdir - $RPM_BUILD_ROOT/etc/X11/wmconfig

    ```

    ```


    ```

    ```

    make DESTDIR=$RPM_BUILD_ROOT install install.man

    ```

    ```


    ```

    ```

    cat > $RPM_BUILD_ROOT/etc/X11/wmconfig/xearth <<EOF

    xearth name "xearth"

    xearth description "xearth"

    xearth group Amusements

    xearth exec "xearth -fork"

    EOF

    ```

    ```


    Just like the prep and build sections, RPM passes each line in the install section
    to /bin/sh to be executed as a script. Red Hat''s xearth package contains both
    standard make targets, install and install.man, and custom shell code to fine-tune
    the installation.


    After a package builds and installs successfully, RPM will remove the detritus
    left over from the build and install process. The clean section of the spec file
    manages this.


    ```

    ```

    %clean

    rm -rf $RPM_BUILD_ROOT

    ```

    ```


    Simpler still, the clean section simply makes sure that the xearth build directory
    is completely removed, blatantly suggesting a problem with the spec file (its
    commands, actually) if problems arise. You will usually not require this section
    if you stick with RPM''s default build tree.


    The next section is the files section:


    ```

    ```

    %files

    %defattr(-,root,root)

    /usr/X11R6/bin/xearth

    /usr/X11R6/man/man1/xearth.1x

    %config /etc/X11/wmconfig/xearth

    ```

    ```


    As noted previously, the files section consists of a list of files that make up
    the package. If the file does not exist in this list, it will not be included
    in the package. However, you must still create the file list yourself. Despite
    RPM''s power, it cannot read your mind and create the file list. The easiest'
  merge: -1
  img_proc: true
- pgno: 503
  md: 'way to create the list is to use the files your makefile generates and add
    to that list any documentation or configuration files required.


    # Building the Package


    With the spec file created, you are ready to build the package. If you are confident
    the spec file is correct, just change to the directory holding the spec file and
    issue the "build everything in sight" command, `rpm -ba`.


    # Example


    ![](img/be588b36b489136ce784030a08a1d3d4_503_0.png)


    # Example


    The following command builds both the binary and source RPMs of xearth:


    ```

    ```

    $ cd /usr/src/redhat/SPECS

    $ rpm -ba xearth-1.0-12.spec

    ```

    ```


    ![](img/be588b36b489136ce784030a08a1d3d4_503_1.png)


    # Output


    ```

    ```

