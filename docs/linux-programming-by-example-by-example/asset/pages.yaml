  md: "Web browsers that open multiple network connections to download as much of\
    \ a web page as they can at once and client/server applications that service dozens\
    \ or hundreds of users simultaneously. Although easy to understand conceptually,\
    \ multiplexing can be difficult to implement efficiently.\n\nFortunately, Linux\
    \ has the `select` call to make multiplexing easier. `select` is a non-resource\
    \ intensive means for waiting on many file descriptors to change status. Its prototype,\
    \ in <unistd.h>, is as follows:\n\n```\nint select(int n, fd_set *readfds, fd_set\
    \ *writefds, \n       fd_set *exceptfds, struct timeval *timeout);\n```\n\n`select`\
    \ monitors the following sets of file descriptors:\n\n+   - The set of descriptors\
    \ in `readfds` for readable characters.\n+   \n+   - The set in `writefds` to\
    \ see whether they can be written to.\n+   \n+   - The set in `exceptfds` for\
    \ exceptions.\n\nNaturally, if you are interested only in writing to a lot of\
    \ files, you might not care about the set of file descriptors that have characters\
    \ ready to read. Indeed, your program might not even do any reading. If this is\
    \ the case, you can pass `NULL` to that argument. For example, to ignore the file\
    \ descriptors that are readable and the file descriptors that have some exception\
    \ condition (like an error), you would call `select` as follows:\n\n```\nfd_set\
    \ *writeable_fds;\nselect(maxfds, NULL, writefds, NULL, 10);\n```\n\nThe `timeout`\
    \ parameter determines how long `select` will *block*, or wait before it returns\
    \ control to the calling process. If `timeout` is set to 0, `select` will return\
    \ immediately. When an I/O operation returns immediately, without waiting, it\
    \ is said to be a *non-blocking* I/O call. If you want to wait until an I/O operation\
    \ can take place (that is, until `readfds` or `writefds` changes) or until an\
    \ error occurs, pass `timeout` the value of `NULL`, using the same syntax as shown\
    \ in the previous example.\n\nThe first parameter, `n`, contains the highest numbered\
    \ file descriptor in any of the sets being monitored, plus 1 (the sample program\
    \ shows one way to determine this value). If an error occurs, `select` returns\
    \ -1 and sets `errno` to an appropriate value. In the event of an error, `select`\
    \ also voids all the descriptor sets and `timeout`, so you will have to reset\
    \ them to valid values before reusing them. If the `select` call succeeds, it\
    \ returns either the total number of descriptors contained in the monitored (non-NULL)\
    \ descriptor sets or 0. A return value of 0 means that nothing “interesting” happened,\
    \ that is, that no descriptors changed status before `timeout` expired."
