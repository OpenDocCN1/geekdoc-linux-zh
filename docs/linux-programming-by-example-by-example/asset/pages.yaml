  md: '# 3—

    About the Project


    At the end of the book is the complete source code for a working, fully functional
    music CD database program. It was designed to tie together many of the techniques
    you learn in the book so you can see how many of these topics, such as file handling,
    character-mode screen painting, and the database API, fit together and work as
    a cohesive whole.


    One of the shortcomings of many beginner-level programming books is that, although
    they do a terrific job of showing you all sorts of techniques, tools, tips, and
    tricks, they do not demonstrate how all the material fits together. This is not
    the fault of the writer, but of the material, which necessarily has to cover a
    lot of territory. It also reflects the format of the genre, which assumes, rightly,
    that you want to learn how to do X, Y, and Z, but which usually ignores, due to
    the economics of book publishing, the necessity of connecting all the material
    together. My hope is that this programming project remedies this potential defect.'
