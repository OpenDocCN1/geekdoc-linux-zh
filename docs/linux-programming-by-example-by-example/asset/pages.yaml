    +   6. Process user input in a command loop.

    +   7. Use `unpost_form` to unpost the form.

    +   8. Use `free_form` to free its resources.

    +   9. Use `free_field` to free each field''s resources.

    +   10. Terminate ncurses.


    Obviously, the form library''s design follows the pattern set by the menu library.
    Unfortunately, however, the `form_driver` command loop must handle a little bit
    more than the menu library''s input loop. The extra complication is worth the
    effort, compared to writing your own form-handling library.


