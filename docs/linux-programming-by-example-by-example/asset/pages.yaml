    # Window Management


    One of ncurses’ chief advantages, in addition to complete freedom from terminal-dependent
    code, is the capability to create and manage multiple windows in addition to the
    ncurses-provided stdscr. These programmer-defined windows come in two varieties,
    subwindows and independent windows. All the window-manipulation routines discussed
    in this section are documented in the curs_window manual page.


    > **TIP**

    > Except where specifically noted, ncurses handles return codes very consistently:
    Functions that return an integer return OK on success or ERR on failure; those
    that return pointers return NULL on failure.


    Subwindows are created using the *subwin* function call. They are called *subwindows*
    because they create a window based on an existing window. At the C language level,
    subwindows are pointers to pointers to a subset of an existing WINDOW data structure.
    The subset can include the entire window or only part of it. Subwindows, also
    called *child* or *derived* windows, can be managed independently of their parent
    windows, but changes made to the children are reflected in the parent.


    Create new or independent windows with the *newwin* call. This function returns
    a pointer to a new WINDOW structure that has no connection to other windows. Changes
    made to an independent window do not show up onscreen unless explicitly requested.
    The *newwin* function adds powerful screen-manipulation capabilities to your programming
    repertoire, but, as is often the case with added power, it also entails additional
    complexity. You are required to keep track of the window and explicitly to display
    it on the screen, whereas subwindows update on the screen automatically.'
