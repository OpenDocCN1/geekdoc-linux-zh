- pgno: 153
  md: 'The wait and waitpid system calls enable the parent process to wait for its
    child processes to exit and collect their exit status. A process can discover
    how many system resources it can consume, as well as other limits to which it
    is subject, using the ulimit and getrlimit system calls.


    # File I/O


    Many of Linux''s system calls involve file input and output. Chapter 7, "Basic
    Linux File Handling," and Chapter 8, "Advanced Linux File Handling," cover many
    of these routines in detail. The calls to create, open, and close files, for example,
    are create, open, and close, respectively. Similarly, to read and write files,
    use the read and write functions.


    The unlink system call deletes a file. The symlink call creates a symbolic link
    to a file. The system call that to set and change file permissions is chmod, while
    chown changes ownership, like its identically named user command. Multiplexed
    input and output is enabled through the select and poll calls. If you want to
    shorten a file without reading or writing, truncate is the call you want to use.
    To obtain information about a file, such as its size, creation date, and so forth,
    the stat, lstat, and fstat calls obtain file status data. File locking, finally,
    controlling simultaneous access to a file or its contents, is accomplished through
    the flock or fcntl calls.


    # Memory Management


    Memory management extends beyond the standard C library''s malloc and calloc routines.
    In fact, malloc and related memory allocation routines are implemented via the
    brk and sbrk calls. In addition to these two functions, a whole family of system
    calls exist to provide a form of high-speed file I/O, memory mapped files. The
    names of these functions are mmap, munmap, mlock, munlock, munlockall, msync,
    mremap, and protect.


    > • To learn about memory-mapped files, see "Memory Mapping Files," page 174.


    # Signal Handling


    The signal handling system, discussed in Chapter 5, "Signals," is entirely implemented
    as kernel level system calls and consists of the following functions:


    +   • sigaction Changes the action a process takes when it receives a given signal

    +   • sigsuspend Temporarily replaces a process''s signal mask with a new one,
    then pauses the process until a signal is received

    +   • sigpending Returns a signal mask containing all of the signals that are
    blocked want waiting to be delivered to the calling process'
