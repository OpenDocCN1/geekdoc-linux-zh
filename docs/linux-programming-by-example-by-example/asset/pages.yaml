- pgno: 362
  md: 'That said, there is little purpose in a process opening a pipe for its own
    use. Pipes are used to exchange data. Because a process already has access to
    the data it would share via a pipe, it doesn''t make sense to share data with
    itself. Normally, a process calls pipe and then calls fork to spawn a child process.
    Because the child inherits any open file descriptors from its parent, an IPC channel
    has been established. The next step depends on which process is the reader and
    which is the writer. The general rule is that the reader process closes the write
    end of the pipe and the writer process closes the read end of the pipe. The following
    items make this process more evident:


    +   * If the parent process is sending data to the child, the parent closes filesdes[0]
    and writes to filesdes[1] while the child closes filesdes[1] and reads from filesdes[0].

    +   * If the child is feeding data back to the parent, the child closes filesdes[0]
    and writes to filesdes[1] while the parent closes filesdes[1] and reads from filesdes[0].


    Figure 15.4 should help you visualize the proper procedure and remember the rule.


    > CAUTION

    > It is a serious programming error to attempt to read and write both ends of
    a single pipe. If two processes need the functionality of a full duplex pipe,
    the parent must open two pipes before forking.


    ![](img/be588b36b489136ce784030a08a1d3d4_362_0.png)


    The top portion of Figure 15.4 shows the disposition of the file descriptors immediately
    after the fork: the parent and the child have both file descriptors open. Figure
    15.4 assumes that the parent will be the writer and the child will be the reader.
    The bottom half of the figure illustrates the status of the file descriptors after
    the parent closes its read descriptor and the child closes its write descriptor.'
  merge: -1
  img_proc: true
