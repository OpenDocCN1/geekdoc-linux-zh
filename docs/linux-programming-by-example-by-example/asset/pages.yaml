  md: "```\n* hello.c – Canonical \"Hello, world!\" program\n*/\n#include <stdio.h>\n\
    \nint main(void)\n{\n    puts( \"Hello, Linux programming world!\");\n    return\
    \ 0;\n}\n\nTo compile and run this program, type\n$ gcc hello.c -o hello\n\nIf\
    \ all goes well, gcc does its job silently and returns to the shell prompt, gcc\
    \ compiles and links the source file hello.c, creating a binary, which is specified\
    \ using the -o argument, hello.\n\nThe ls command shows that a new program, hello,\
    \ exists. The last command executes the program, resulting in the following output:\n\
    ```\n\n![](img/be588b36b489136ce784030a08a1d3d4_38_0.png)\n\n# Output\n\n```\n\
    $ ls\nhello.c    hello*\n$ ./hello\nHello, Linux programming world!\n```\n\n>\
    \ **CAUTION**\n> The command that executed the hello program specifically included\
    \ the current directory, denoted with a ., because having the current directory\
    \ in your path is a security risk. That is, instead of using a $PATH statement\
    \ that resembles /bin:/usr/bin:/usr/local/bin:., the statement should be /bin:/usr/bin:/usr/local/bin\
    \ so that a cracker cannot put a dangerous command in your current directory that\
    \ happens to match the name of the more benign command you really want to execute.\n\
    \nHow does gcc know how to process files? It relies on file extensions to determine\
    \ how to process a file correctly. The most common extensions and their interpretations\
    \ are listed in Table 1.1.\n\n**Table 1.1 How gcc Interprets Filename Extensions**\n\
    \n| Extension | Type |\n|:---|:---|\n| .c | C language source code |\n| .C, .cc\
    \ | C++ language source code |\n| .i | Preprocessed C source code |"
