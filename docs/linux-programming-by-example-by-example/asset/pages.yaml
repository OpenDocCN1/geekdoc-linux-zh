    # ## Predefined Variables


    In addition to the automatic variables listed in Table 2.2, GNU `make` predefines
    a number of other variables that are used either as names of programs or to pass
    flags and arguments to these programs. Table 2.3 lists `make`''s most commonly
    used predefined variables. You have already seen some of these in this chapter''s
    example makefiles.


    Table 2.3 Predefined Variables for Program Names and Flags


    | Variable | Description | Default Value |

    | :--- | :--- | :--- |

    | AR | Filename of the archivemaintenance program | `ar` |

    | AS | Filename of the assembler | `as` |

    | CC | Filename of the C compiler | `cc` |

    | CPP | Filename of the C Preprocessor | `cpp` |

    | RM | Program to remove files | `rm -f` |

    | ARFLAGS | Flags for the archivemaintenance program | `rv` |

