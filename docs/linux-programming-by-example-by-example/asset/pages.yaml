- pgno: 480
  md: '# **Using Electric Fence**


    The first tool covered is Electric Fence, written by Bruce Perens. Electric Fence
    does not catch memory leaks, but it does an excellent job of detecting buffer
    overruns. You can obtain it from


    ```text

    ftp://metalab.unc.edu/pub/Linux/devel/lang/c,

    ```


    although many Linux distributions also ship with it.


    Electric Fence uses a CPU''s virtual memory hardware to detect illegal memory
    accesses, aborting on the first instruction that commits a memory boundary violation.
    It accomplishes this by replacing the normal `malloc` with its own `malloc` and
    allocating a small section of memory after the requested allocation that the process
    is not permitted to access. As a result, buffer overruns cause a memory access
    violation, which aborts the program with a `SIGSEGV`. If your system is configured
    to allow core files (execute `ulimit -c` to get and set the size of core files
    allowed), you can then use a debugger to isolate the location of the overrun.


    To use Electric Fence, you must link your program against a special library, `libefence.a`,
    and then simply run the program. It will dump core at the first memory violation.


    # **Example**


    This example shows how to use Electric Fence.


    ```

    ```

    $ gcc -g badmem.c -o badmem -lefence

    $ ./badmem

    ```

    ```


    # **Output**


    ```

    ```text

    Electric Fence 2.0.5 Copyright (C) 1987-1995 Bruce Perens.

    LITTLE : abcde

    Segmentation fault (core dumped)

    $ gdb -g badmem core

    (gdb) run

    Starting program: /usr/local/newprojects/lpe/14/src/badmem


    Electric Fence 2.0.5 Copyright (C) 1987-1998 Bruce Perens.

    LITTLE : abcde

    Segmentation fault (core dumped)

    $ gdb -g badmem

    (gdb) run

    Starting program: /usr/local/newprojects/lpe/20/src/badmem


    Electric Fence 2.0.5 Copyright (C) 1987-1998 Bruce Perens.

    LITTLE : abcde

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 481
  md: "```\nProgram received signal SIGSEGV, Segmentation fault.\nstrcpy (dest=0x4010aff8\
    \ \"abcdefgh\", src=0x80495fc \"abcdefgh\")\nat ../../../sysdeps/generic/strcpy.c:38\n\
    ../sysdeps/generic/strcpy.c:38: No such file or directory\n(gdb) where\n#0 strcpy\
    \ (dest=0x4010aff8 \"abcdefgh\", src=0x80495fc \"abcdefgh\")\n    at ../../../sysdeps/generic/strcpy.c:38\n\
    #1 0x8048905 in main () at badmem.c:27\n#2 0x40030cb3 in __libc_start_main (main=0x8048890\
    \ <main>, argc=1,\n    argv=0xbffff944, init=0x8048680 <init>, fini=0x80495ac\
    \ <fini>,\n    rtld_fini=0x4000a350 <dl_fini>, stack_end=0xbffff93c)\n    at ../sysdeps/generic/libc-start.c:78\n\
    (gdb)\n```\n\nThe compile command used the `-g` option to generate extra debugging\
    \ symbols. The second line from the bottom of the listing makes it crystal clear\
    \ that there is a problem at line 27 in `badmem.c` in the main function. After\
    \ you fix this problem, recompile and rerun the program, again linking against\
    \ `libefence`, and, if it aborts again, repeat the debug/fix/recompile sequence.\
    \ After you have thoroughly debugged your program, recompile without linking against\
    \ Electric Fence, and you should be set.\n\n# Customizing Electric Fence\n\nBut\
    \ wait, Electric Fence caught the big overrun on line 27, but it missed the little\
    \ overrun. How could that be? This peculiar behavior results from the way the\
    \ CPU aligns allocated memory. Most modem CPUs require that memory blocks be aligned\
    \ on their natural word size.\n\nIntel x86 CPUs, for example, require that memory\
    \ regions begin at addresses evenly divisible by four, so `malloc` calls ordinarily\
    \ return pieces of memory aligned accordingly. Electric Fence does the same. So,\
    \ a request for five bytes actually results in eight bytes being allocated to\
    \ meet the memory alignment requirements! As a result, the small buffer overrun\
    \ slipped through the fence. Fortunately, Electric Fence enables you to control\
    \ its alignment behavior using the environment variable `$EF_ALIGNMENT`. Its default\
    \ value is `sizeof(int)`, but if you set it to zero, Electric Fence will detect\
    \ smaller overruns.\n\nElectric Fence also recognizes three other environment\
    \ variables that control its behavior:\n`EF_PROTECT_BELOW=1` for detecting buffer\
    \ underruns; `EF_PROTECT_FREE=1` for detecting access to freed memory; and `EF_ALLOW_MALLOC_0=1`,\
    \ which allows programs to `malloc` zero bytes of memory."
