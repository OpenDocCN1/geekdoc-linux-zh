    # Changing File Characteristics


    In this section of the chapter, you meet a variety of functions that alter inode
    information. Many of these routines have counterparts that are Linux commands.
    These commands are usually distributed as part of the GNU fileutils package, which
    is standard on almost every Linux system around.


    # Changing Access Permissions


    The chmod and fchmod system calls change the permissions of a file, provided,
    of course, the UID and GID of the calling process indicate the sufficient rights.
    Only the root user and the file owner can change a file''s permissions. chmod
    and fchmod are prototyped in `<unistd.h>` as follows:


    ```

    int chmod(const char *pathname, mode_t mode);

    int fchmod(int fd, mode_t mode);

    ```


    These routines attempt to change the permissions of the file specified by either
    the null-terminated string indicated in pathname or the file descriptor fd to
    mode. If the attempt succeeds, they return 0. On failure, they return -1 and set
    errno to the appropriate value. To use these functions, you must include both
    `<sys/types.h>` and `<sys/stat.h>`.'
