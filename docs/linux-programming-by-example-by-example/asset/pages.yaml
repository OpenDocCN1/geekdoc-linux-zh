- pgno: 322
  md: 'The first five ioct1 calls set bitmasks in their corresponding integer arguments
    (recsrc, devmask, recmask, stereodevs, and caps). After printing a table header,
    mixer_status loops through the available mixer channels. If the mixer has that
    particular channel, the conditional block executes and displays some of the available
    information for that channel.


    Note in particular the way the bitmasks are tested:


    (1 << channel) & bitmask;


    The parenthesized expression left-shifts a channel number onto 1, and then bitwise
    ANDs the resulting value with bitmask. If the given channel exists, the expression
    evaluates to 1. If the channel is not available, it evaluates to 0. So, for example,
    if a channel, say, SOUND_MIXER_VOLUME is stereo-capable, (1 << SOUND_MIXER_VOLUME)
    & stereodevs (as set in the program) evaluates to 1.


    On my system, which has a genuine Sound Blaster, mixer_status generated the following
    output:


