    ![](img/be588b36b489136ce784030a08a1d3d4_162_0.png)


    # Figure 7.1:

    Creating unnamed pipes with shell commands.


    As you can see in Figure 7.1, the kernel creates an unnamed pipe to receive the
    output of the `cat` command, which ordinarily writes its output to standard output
    (the screen). The `cut` command receives its input from the read end of the first
    pipe, performs its own transformation on the data, and then sends the output to
    the second unnamed pipe. In the meantime, after `cut` receives all of cat’s output,
    the kernel destroys the first pipe because it is no longer needed. The `head`
    command, finally, displays the first five lines of input read from the pipe. After
    `head` receives all the data from the second unnamed pipe, the kernel destroys
    the second pipe, too. At no time, however, did either of the pipes have a name
    or exist on disk.


    Named pipes, by contrast, do have filenames. They are most often used when two
    processes need to share data but do not share file descriptors (see “The File-Handling
    Interface” later in this chapter, for details).


    Directories, also known as directory files, are simply files that contain a list
    of files stored in the directory.


    Device files, also called special files, are files that provide an interface to
    most physical devices. They can either be character special or block special files.
    Character special files are written to and read from one byte (or character) at
    a time. Examples of character devices include modems, terminals, printers, sound
    cards, and mice. Block special files, on the other hand, must'
