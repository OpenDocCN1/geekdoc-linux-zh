- pgno: 248
  md: '# ncurses Features


    ncurses, which is short for "new curses," is a freely redistributable clone of
    the curses libraries distributed with the System V Release 4.0 (SVR4) of UNIX
    distributed by Bell Labs. The name "curses" is derived from the phrase "cursor
    optimization," which succinctly describes what curses does.


    # Terminal Independence


    ncurses generalizes the interface between an application program and the screen
    or terminal on which it is running. Given the literally hundreds of varieties
    of terminals and screens, in particular the different features they possess and
    the commands to invoke them, UNIX programmers needed a way to abstract screen
    manipulation. Rather than write a lot of extra code to take into account the different
    terminal types, ncurses provides a uniform and generalized interface for the programmer.
    The ncurses API insulates the programmer from the underlying hardware.


    # Capabilities


    ncurses gives to character-based applications many of the same features found
    in graphical X Window applications: multiple windows, forms, menus, and panels,
    ncurses'' windows can be managed independently, may contain the same or different
    text, may or may not scroll, and can be hidden. The vi editor and the popular
    file manager Midnight Commander are written using ncurses.


    Forms enable the programmer to create easy-to-use data entry and display windows,
    thus simplifying what is usually a difficult and application-specific coding task.
    Panels extend curses'' capability to deal with overlapping and stacked windows.
    Menus, which give the user a simple interface by invoking application options,
    are easily implemented using ncurses'' simple, generalized menu programming interface.
    The version used in this book is 4.2, although the 5.0 release is currently in
    beta.


    # Compiling with ncurses


    To compile a program with ncurses, you need its function and variable definitions,
    so include <curses.h> in your source code:


    ```

    ```

    #include <curses.h>

    ```

    ```


    Many Linux systems make /usr/include/curses.h a symbolic link to /usr/include/ncurses.h,
    so you could conceivably include <ncurses.h>. However, for maximum portability,
    use <curses.h> because, believe it or not, ncurses is not available on all UNIX
    and UNIX-like platforms. You also need to link against the ncurses libraries,
    so use the -lcurses option when'
