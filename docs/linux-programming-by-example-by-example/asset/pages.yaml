- pgno: 28
  md: '# ABOUT THE AUTHOR


    Kurt Wall has been using UNIX since 1993 and has been hooked on Linux for nearly
    as long. He currently maintains the Informix on Linux FAQ and is president of
    the International Informix Users Group''s Linux SIG. He is also vice president
    of the Salt Lake Linux Users Group.


    In no particular order, he enjoys coffee, cats, coding, cooking, staying up late,
    and sleeping even later. He dislikes writing about himself in the third person.


    Formerly employed by USWest, Kurt now writes and edits full time. He recently
    completed his first book, Linux Programming Unleashed.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# DEDICATION


    *To Mom (Eleanor Claire Fleming Wall): Having a great time, wish you were here.*


    # ACKNOWLEDGMENTS


    Ashleigh Rae and Zane Thomas bravely and stoically resigned themselves to playing
    with their Nintendo and watching cartoons while I completed the book. They also
    helped me name some of the sample programs when my imagination became parched.
    Dad did not do anything in particular, but without his confidence, support, and
    cheerleading, I would not have had the brass to undertake writing a book. Mom,
    I miss you and wish you were here so I could share this with you. Somehow, though,
    I know you know. Rick, Amy, Morgan Leah, and young Master Isaac Benj amin are
    simply the best brother, sister-in-law, niece, and nephew anyone could have. Thanks
    to the El Paso gang for entertaining me via email and for letting me butt into
    their lives when I came up for air. Marty kept me working by asking how it was
    going. Nudge lived up to the Yiddish meaning of his name by keeping me company
    at 4:00 a.m., warming my lap, helping me type, and insisting on my attention at
    precisely the wrong time. Finally, the friends of Bill Wilson helped keep me sane
    enough to write; if any credit is to be given, it goes to God.


    My technical editor, Cameron Laird, offered suggestions that improved the manuscript’s
    overall quality, pointed out an alarming number of really stupid mistakes, kept
    me from sounding like a manual page, and generally saved me from looking like
    a complete moron. Thanks, Cameron.


    The cast at Macmillan was terrific. Gretchen Ganser deserves credit that this
    book even exists—I *still* owe you lunch, Gretchen, and thanks for not panicking
    when the schedule slipped. Gretchen and Sean Dixon, my development editor, both
    exerted themselves to help me get back on schedule (thanks, y''all!). I do not
    *even* want to know how many rules they broke. Sean deserves lunch, too, if he
    ever comes to Salt Lake. Kezia Endsley did a fantastic job of copy editing and
    of reading my mind when I wrote byzantine prose. Sara Bosin, yet another editor,
    was pleasantly patient during the editing phase, especially when I mutilated her
    name. Did I get it right this time? Thanks to Sara, I know the difference between
    an em dash and an en dash. Tonya Simpson, Sara’s replacement, deserves extra credit
    for her patience with me.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'Thanks to all the net.citizens and the members of the Linux community who patiently
    and graciously answered my questions and offered suggestions. In particular, Thomas
    Dickey, current maintainer of the ncurses package, reviewed an early version of
    the ncurses chapters and corrected several boneheaded mistakes and lots of typos.
    Michael Olson at Sleepycat Software, makers of Berkeley DB, kindly reviewed the
    chapter on the database API—it is a much better chapter than it would have been
    otherwise. The linux-sound mailing list helped out with the chapter on the sound
    API. I especially appreciate Hannu Solavainen, the original author of this API,
    for his assistance.


    Companies doing business in, with, and for the Linux community also provided support.
    Red Hat Software and Caldera Systems provided fully supported copies of their
    Linux Distributions, saving lots of download time and even more frustration. Holly
    Robinson at Metro Link Incorparated cheerfully gifted me with copies of its Motif
    and OpenGL products—Holly, we will cover this material in the next book. Chris
    Dibona, Assistant High Muckety-Muck at VA Research (or whatever they are calling
    themselves this week), lent me a fine system on which to develop the code used
    in the book—Chris didn’t flinch or even blink when I explained I preferred to
    crash someone else’s system than expose mine to the vagaries of rogue pointers.
    It is testimony to Linux’s incredible stability and robustness that I never actually
    did that, although I sure got tired of examining core files—my keyboard’s "g",
    "d", and "b" keys are now smooth and blank.


    If I have forgotten someone, please accept my sincerest apologies and send email
    to kwall@xmission.com so that I can remedy the oversight. Despite all the assistance
    I have received, I take full responsibility for any remaining errors and blunders.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# LINUX PROGRAMMING BY EXAMPLE


    Welcome to Linux Programming by Example! It seems one can hardly turn on the television,
    listen to the radio, surf the World Wide Web, or read a newspaper or magazine
    without hearing or seeing some mention of the "free UNIX-like operating system,
    Linux, created by Linus Torvalds . . ." Although the rest of the world seems just
    to have discovered Linux, it has been well known on the Internet since 1991, when
    Linus first publicly released an early version of Linux.


    I first discovered Linux in early 1993, while trying to locate a version of UNIX
    that I could use at home to learn enough UNIX to enhance my prospects at work.
    I was stunned by its capabilities and was immediately bitten by the Linux bug.
    However, my computer lived a dual existence for two more years as I switched between
    Windows and Linux. Finally, becoming utterly disgusted with Windows in 1995, I
    wiped it off my system completely and began using and programming Linux full time.
    I have not looked back since. It has been fun, exciting, rewarding, and satisfying
    to see Linux mature.


    # About This Book


    So, why does Linux Programming by Exampleexist? The answer, simply put, is to
    fill a clear need. Linux began life as a hacker''s hobby. For its first three
    or four years, Linux''s user base was technically sophisticated, programming savvy,
    and familiar with UNIX. Given this user base, there was no need for an introductory
    Linux programming book because the assumption, perhaps rightly, was that Joe or
    Jane Linux user already knew how to program in a UNIX-like environment.


    As Linux has grown in popularity, its user community has changed dramatically.
    The number of new users unfamiliar with software development in a UNIX milieu
    wanting to program on and for Linux has swelled. Unfortunately, there has been
    a distinct lack of information targeted toward beginning Linux programmers. There
    are, of course, books that teach you how to use individual tools and that cover
    individual topics, but Linux Programming by Example collects all the relevant
    material into a single book. By the time you have finished reading this book,
    you will have a solid grasp of Linux programming fundamentals, including tools,
    such as the compiler, gcc, make, basic Linux/UNIX programming idioms like processes,
    signals, system calls, file handling, common programming interfaces like nurcurses,
    interprocess communication, and network programming.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Who Should Read This Book?


    This book assumes that you know how to use Linux and that you know how to program
    using the C language. You should be able to find your way around the filesystem,
    read manual pages, use a text editor, and execute commands. It will be helpful,
    although not required, if you have an Internet connection. As a C programmer,
    you must know how to write a program that compiles, understand basic pointer usage,
    and be familiar with C idioms. No advanced knowledge is necessary.


    I wrote this book with two groups of people in mind. The first group is composed
    of people in the position I was in in 1993. I had used and programmed various
    DOSes and Windows, but when it came to compiling a program on Linux, I was lost.
    The plethora of tools overwhelmed me, as did the terminology and, to some degree,
    the whole UNIX philosophy—everything is a file, string lots of little tools together
    to make bigger programs, the command line is a joyous thing. So, if you know how
    to program using the C language, but have no idea about the tools and utilities
    available to you and are overwhelmed by the Spartan complexity of the Linux programming
    environment, this book is for you.


    The next group of readers are Linux users who want to know how to write applications
    that fit seamlessly into the Linux environment. This group has figured out how
    to write and compile programs and can actually comprehend some of the manual pages,
    but has no idea what a process is, how to write a signal handler, or why they
    should even care. If this paragraph describes you, this book is also for you.


    The topics covered should have an appeal beyond these two groups, though. Competent
    Linux users can extend their knowledge and gain insight into how Linux works.
    If you ever wondered, "How does that work?", this book should answer that question.


    If, on the other hand, you want to hack the kernel, this is definitely not the
    right book because all the material here is application code that sits on top
    of the kernel and uses services that the kernel provides. Another topic not covered
    in this book is X Window programming. GUI programming is a complex subject and
    beyond the scope of this book, which is aimed primarily at the beginning programmer.
    X Window programming deserves its own book; even introductory material can easily
    run a couple hundred pages.


    # Linux Programming by Example, Chapter by Chapter


    The first part of the book introduces you to the Linux programming environment.
    Chapter 1, "Compiling Programs," teaches you how to use the GNU C compiler, gcc.
    You will explore its options and capabilities and learn some of the extensions
    to the C language that gcc supports. The next chapter looks at the'
  merge: -1
  img_proc: true
