- pgno: 440
  md: "Fortunately, the TCP/IP protocol family includes the *Domain Name System* (DNS),\
    \ a distributed database that, among other things, maps names, like `www.netscape.com`,\
    \ to IP addresses, in this case, `205.188.247.73`. Although DNS encompasses many\
    \ capabilities, the one covered here is how to convert a hostname to an address\
    \ and vice versa. You must know about one structure, `struct hostent`, and two\
    \ functions, `gethostbyname` and `gethostbyaddr`. They are declared in `<netdb.h>`\
    \ as follows:\n\n```\n```\nstruct hostent {  \n  char *h_name;               \
    \  /* Canonical machine name */\n  char **h_aliases;            /* List of aliases\
    \ */\n  int h_addrtype;              /* AF_INET */\n  int h_length;          \
    \      /* sizeof(struct in_addr) */\n  char **h_addr_list;          /* List of\
    \ IP addresses */\n};  \nstruct hostent *gethostbyname(const char *name);  \n\
    struct hostent *gethostbyaddr(const char *addr, int len, int type);\n```\n```\n\
    \n`gethostbyname` takes a hostname `name`, such as `ftp.netscape.com`, and returns\
    \ a pointer to a `hostent` structure that contains the relevant information from\
    \ the DNS. Similarly, `gethostbyaddr` takes an address structure, `struct in_addr`\
    \ (which you have already seen), stored in `addr`, its length, stored in `len`,\
    \ and its `type`, which is always `AF_INET`, and returns a pointer to a `hostent`\
    \ structure. The pointer that both calls return points to a statically allocated\
    \ buffer that is overwritten each time you call either function. So, if you need\
    \ to save any of the information in the `hostent` structure pointer, save it in\
    \ local variables.\n\nRegarding the `hostent` structure itself, `h_name` is the\
    \ canonical, or \"official\" (as in registered) machine name, `h_addrtype` is\
    \ always `AF_INET`, and `h_length` is the size of address structure, which is\
    \ `sizeof (struct in_addr)` at this time. `h_aliases` and `h_addr_list`, respectively,\
    \ are pointers to strings containing all the names and IP addresses that a machine\
    \ can have.\n\n\"Now wait a minute!\" I hear you thinking. \"Whyddya mean, 'all\
    \ of the names and IP addresses that a machine can have?'\" Simply put, the DNS\
    \ is not a one-to-one mapping of hostnames to IP addresses. There are many reasons\
    \ why a machine might have multiple IP addresses or multiple hostnames. In the\
    \ case of multiple IP addresses, consider a *router*, a system that has multiple\
    \ network cards. Each card has a different IP address to route incoming packets\
    \ to the appropriate location, such as different networks or different systems."
  merge: -1
  img_proc: true
- pgno: 441
  md: "On the other hand, a system that has multiple names (actually, it has one canonical\
    \ name and one or more aliases) is typically used to allow a single physical machine\
    \ to provide multiple services, such as a Web server and an FTP server. The box\
    \ has one IP address but two names.\n\nRegardless of why a system has multiple\
    \ hostnames or IP addresses, `gethostbyname` and `gethostbyaddr` return the complete\
    \ list of names and addresses, respectively, in the `h_aliases` and `h_addr_list`\
    \ members of the `struct hostent`. If the IP address or hostname passed to these\
    \ functions is invalid or if another error occurs, they return `NULL`.\n\n# Example\n\
    \n![](img/be588b36b489136ce784030a08a1d3d4_441_0.png)\n\n# Example\n\nThe sample\
    \ program that follows, `hostinfo`, accepts a hostname as its command-line argument\
    \ and displays the contents of its corresponding `hostent` structure.\n\n```\n\
    \"\"\"\n/*\n *  hostinfo.c -- Show the hostent structure for a hostname\n */\n\
    #include <sys/socket.h>\n#include <netinet/in.h>\n\n#include <arpa/inet.h>\n#include\
    \ <netdb.h>\n#include <stdlib.h>\n#include <stdio.h>\n#include \"helper.h\"\n\n\
    int main(int argc, char *argv[])\n{\n   struct hostent *buf;\n   struct in_addr\
    \ **paddr;\n   char **palias;\n\n   /* Expect the IP addresses on the command-line\
    \ */\n   if(argc != 2) {\n       puts(\"USAGE: hostinfo <host name>\");\n    \
    \   exit(EXIT_FAILURE);\n   }\n\n   /* Do the lookup */\n\"\"\"\n```"
  merge: -1
  img_proc: true
- pgno: 442
