- pgno: 332
  md: 'Table 13.3.: Bits Reported by SNDCTL_DSP_GETCAPS

    | Capability | Description |

    | --- | --- |

    | DAP_CAP_REVISION | Set to version number of SNDCTL_DSP_GETCAPS; reserved for
    future use |

    | DAP_CAP_DUPLEX | Set if device can operate in full duplex mode; unset if in
    half duplex mode |

    | DAP_CAP_REALTIME | Set if device supports high-precision reporting of the output
    pointer position |

    | DAP_CAP_BATCH | Set if device has local storage for recording and playback |

    | DAP_CAP_COPROC | Set if device has a programmable processor or DSP; reserved
    for future use |

    | DAP_CAP_TRIGGER | Set if device has triggered playback or recording |

    | DAP_CAP_MMAP | Set if direct access to the device’s hardware level playback
    or recording buffer is possible |


    *Full duplex* simply means that a device can perform both input and output simultaneously.
    Most sound devices, alas, are *half duplex*. They can record and play back, but
    not at the same time. The `DAP_CAP_REALTIME` bit, if set, indicates that you can
    very precisely keep track of how much data has been recorded or played.


    This is usually not the case for devices that use internal buffering, which the
    `DAP_CAP_BATCH` bit reports. *Triggering*, reported by the `DAP_CAP_TRIGGER` bit,
    is a feature that allows programs requiring the capability to start and stop recording
    or playback with tight timing. Games, in particular, need this capability.


    You can also synchronize recording and playback by using `/dev/sequencer` in concert
    with `/dev/dsp`. For devices that have hardware-level buffers that are capable
    of direct access (reported by the `DAP_CAP_MMAP` bit), you can map those buffers
    into your program’s address space. Unfortunately, the method to do this is dependent
    on the operating system and so has the regrettable side effect of making programs
    non-portable.


    **NOTE**

    Other than illustrating how to determine what advanced capabilities a hardware
    device has, this chapter does not cover these capabilities.'
