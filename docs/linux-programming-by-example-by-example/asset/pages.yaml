    # ## Reading Queued Messages


    To pull a message off a queue, use msgrcv, which has the syntax listed here:


    ```

    ```c

    int msgrcv(int msqid, void *ptr, size_t nbytes, long type, int flags);

    ```

    ```


    If it succeeds, msgrcv removes the returned message from the queue. The arguments
    are the same as msgsnd accepts, except that msgrcv fills in the ptr structure
    with the message type and up to nbytes of data. The additional argument, type,
    corresponds to the msg_type member of the msg structure previously discussed.
    type''s value determines which message is returned, as outlined in the following
    list:


    +   - If type is 0, the first message in the queue (the topmost message) is returned.

    +   - If type is > 0, the first message whose msg_type equals type is returned.

    +   - If type is < 0, the first message whose msg_type is the lowest value less
    than or equal to type''s absolute value is returned.


    The value of flags also controls msgrcv''s behavior. If the returned message is
    larger than nbytes, the message is truncated to nbytes if the MSG_NOERROR bit
    is set in flags (but no notification that the message has been truncated will
    be generated). Otherwise, msgrcv returns -1 to indicate an error and sets errno
    to E2BIG. The message also stays on the queue.


    If the IPC_NOWAIT bit is set in flags, msgrcv returns immediately and sets errno
    to ENOMSG if no message of the specified type is available. Otherwise, msgrcv
    blocks until one of the same conditions described earlier for msgsnd occurs.


    > > NOTE

    > > A negative value for the type argument can be used to create a LIFO, or last-in,
    first-out type of queue, often called a stack. Passing a negative value in enables
    you to retrieve messages of a given type in the reverse order in which they were
    placed in the queue.


