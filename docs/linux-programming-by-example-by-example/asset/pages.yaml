  md: '# Invoking make


    Invoking *make* is as simple as typing *make* in the directory containing the
    makefile. Of course, like most GNU programs, *make* accepts a cornucopia of command-line
    options. The most common ones are listed in Table 2.1.


    Table 2.1 Common *make* Command-Line Options


    | Option | Purpose |

    | :--- | :--- |

    | \-f file | Use the makefile named *file* instead of one of the standard names
    (*GNUmakefile*, *makefile*, or *Makefile*). |

    | \-n | Display the commands *make* would execute without actually doing so. Useful
    for testing a makefile. |

    | \-Idirname | Add *dirname* to the list of directories *make* should search for
    included makefiles. |

    | \-s | Execute silently, not printing the the commands *make* executes. |

    | \-w | Print directory names when *make* changes directories. |

    | \-Wfile | Execute *make* as if *file* has been *modified*. Like \-n, very useful
    for testing makefiles. |

    | \-r | Disable all of *make*’s built-in rules. |

    | \-d | Print lots of debugging information. |

    | \-i | Ordinarily, *make* stops if a *command* returns a non-zero error code.
    This option disables this behavior. |

    | \-k | Keep executing even if one target fails to build. Normally, *make* terminates
    when a target fails to build. |

    | \-jN | Run N *commands* in parallel, where N is a small, non-zero integer. |


    *make* can generate a lot of output, so if you are not interested in looking at
    it, use the \-s option to limit *make*’s output. The \-w and \-n options allow
    you to say “what if file X changed?” The \-i option exists because not all programs
    return a 0 on success. If you use such a command as part of a makefile rule, you
    will need to use \-i in order for a build to continue.


    The \-k option is particularly useful when you are building a program for the
    first time. Because it tells *make* to continue even if one or more targets fail
    to build, the \-k option enables you to see which targets build successfully and
    which do not, allowing you to focus your debugging efforts on the problem children.


    If you have an especially long build, the \-jN option instructs *make* to execute
    N commands simultaneously. While this may reduce the overall build time, it also
    creates a heavy load on the system. This is probably tolerable on a'
