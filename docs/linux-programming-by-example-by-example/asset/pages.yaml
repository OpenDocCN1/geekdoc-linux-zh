  md: "options specifies how the wait call should behave. It can be WNOHANG, which\
    \ causes waitpid to return immediately if no child has exited, WUNTRACED, which\
    \ means it should return for children whose status has not been reported, or you\
    \ can logically OR them to get both behaviors (that is, pass WNOHANG | | WUNTRACED\
    \ for the options argument).\n\n# Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_117_0.png)\n\
    \n# Example\n\nwaiter. c illustrates using waitpid.\n\n```\n```\n/*\n * waiter.c\
    \ - Simple wait usage\n */\n#include <unistd.h>\n#include <sys/types.h>\n#include\
    \ <sys/wait.h>\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(void)\n{\n\
    \tpid_t child;\n\tint status;\n\n\tif((child = fork()) == -1) {\n\t\tperror(\"\
    fork\");\n\t\texit(EXIT_FAILURE);\n\t} else if(child == 0) {\n\t\tputs(\"in child\"\
