  md: "# # Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_66_0.png)\n\n# ## Example\n\
    \nThis sample makefile will make the discussion more concrete. It is the makefile\
    \ for building a text editor imaginatively named editor.\n\n```\n```text\n# Makefile.1\n\
    #\n\nclean:\n\trm editor *.o\n```\n```make\neditor: editor.o screen.o keyboard.o\n\
    \tgcc -o editor editor.o screen.o keyboard.o\n\neditor.o: editor.c editor.h keyboard.h\
    \ screen.h\n\tgcc -c editor.c\n\nscreen.o: screen.c screen.h\n\tgcc -c screen.c\n\
    \nkeyboard.o: keyboard.c keyboard.h\n\tgcc -c keyboard.c\n```\n```\n\nTo compile\
    \ *editor*, you would simply type *make* in the directory containing the makefile.\
    \ It's that simple.\n\nThis makefile has *five* rules. The first target, *editor*,\
    \ is called the *default* target—this is the file that *make* ultimately tries\
    \ to create. *editor* has three dependencies, *editor.o*, *screen.o*, and *keyboard.o*;\
    \ these three files must exist in order to build *editor*. The next line is the\
    \ command that *make* executes to create *editor*. As you recall from Chapter\
    \ 1, \"Compiling Programs,\" this compiler invocation builds an executable named\
    \ *editor* from the three object modules, *editor.o*, *screen.o*, and *keyboard.o*.\
    \ The next three rules tell *make* how to build the individual object modules.\n\
    \nHere is where *make*'s value becomes evident: ordinarily, if you tried to build\
    \ *editor* using the command from line 2, *gcc* would complain loudly and quit\
    \ if the dependencies did not exist. *make*, on the other hand, after determining\
    \ that *editor* requires these files, first verifies that they exist and, if they\
    \ do not, executes the commands to create them. Then it returns to the first rule\
    \ to create the *editor* executable. Of course, if the dependencies for the components,\
    \ *keyboard.c* or *screen.h*, don't exist, *make* will also give up, because it\
    \ lacks targets named, in this case, *keyboard.c* and *screen.h*."
