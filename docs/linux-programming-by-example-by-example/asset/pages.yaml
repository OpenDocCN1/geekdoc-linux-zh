  md: "CAUTION\nAfter the write end of a pipe has been closed, reading from that pipe\
    \ will return 0 to signal the end of file. However, if the read end has been closed,\
    \ any attempt to write to the pipe will generate the SIGPIPE signal for the writer,\
    \ and the write call itself will return -1 and set the global variable errno to\
    \ EPIPE. If the writer does not catch or ignore SIGPIPE, the writing process will\
    \ terminate.\n\n• To review catching and ignoring signals, see \"Catching Signals,\"\
    \ page 102.\n\n# Example\n\n# Example\n\nThe following program, piperv, shows\
    \ the correct procedure for opening a pipe between related processes.\n\n```\n\
    / **\n *piperv.c - The correct way to open a pipe and fork\n *        a child\
    \ process.\n */\n#include <unistd.h>\n#include <stdio.h>\n#include <stdlib.h>\n\
    \n#include <fcntl.h>\n#include <limits.h>\n\n#define BUFSZ PIPE_BUF\n\nvoid err_quit(char\
    \ *msg);\n\nint main(int argc, char *argv[])\n{\n  int fd[2];      /* File descriptor\
    \ array for the pipe */\n  int fdin;       /* Descriptor for input file */\n \
    \ char buf[BUFSZ];\n  int pid, len;\n\n  /* Create the pipe */\n  if(pipe(fd)\
    \ < 0)\n    err_quit(\"pipe\");\n\n  /* Fork and close the appropriate descriptors\
    \ */\n```"
