    # ## Memory Mapping Files


    *Memory-mapped files* are an identical copy in memory of a disk file. The *inode*
    image corresponds byte for byte to the disk file. Memory-mapped files have two
    chief advantages. The first advantage is faster file I/O. Ordinary I/O such as
    the *read* and *write* system calls and the *fputs* and *fgets* library calls,
    copy the data through kernel buffers. Although Linux uses a fast, sophisticated
    disk-caching algorithm, the fastest disk access will always be slower than the
    slowest memory access. I/O operations on a memory-mapped file bypass the kernel
    buffers and, as a result, are much faster. They are also simpler to use because
    you can access the mapped file using pointers rather than the usual file manipulation
    functions.


    The second advantage of memory-mapped files is data sharing. If multiple processes
    need to access the same data, it can be stored in a'
