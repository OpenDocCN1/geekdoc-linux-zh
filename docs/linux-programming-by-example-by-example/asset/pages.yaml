- pgno: 372
  md: '# Opening and Closing FIFOs


    The processes of opening, closing, deleting, reading, and writing FIFOs use the
    same open, close, unlink, read, and write system calls, respectively, that you
    have already seen—one of the virtues of Linux’s "everything is a file" abstraction.
    Because opening and closing FIFOs is identical to opening and closing pipes, you
    might want to review the program that opens and closes a pipe, listed in "Opening
    and Closing Pipes" earlier in this chapter.


    You must keep a few subtleties in mind when you are reading and writing FIFOs,
    however. First, both ends of a FIFO must be open before it can be used. Second,
    and more important, is a FIFO’s behavior if it has been opened using the O_NONBLOCK
    flag. Recall that the O_WRONLY or O_RDONLY flags can be logically ORed with O_NONBLOCK.
    If a FIFO is opened with O_NONBLOCK and O_RDONLY, the call returns immediately,
    but if it is opened with O_NONBLOCK and O_WRONLY, open returns an error and sets
    errno to ENXIO if the FIFO has not also been opened for reading.


    If, on the other hand, O_NONBLOCK is not specified in open’s flags, O_RDONLY will
    cause open to block (not return) until another process opens the FIFO for writing.
    Likewise, O_WRONLY will block until the FIFO is opened for reading.


    As with pipes, writing to a FIFO that is not opened for reading sends SIGPIPE
    to the writing process and sets errno to EPIPE. After the last writer closes a
    FIFO, a reading process will detect an end-of-file on its next read. As mentioned
    in relation to pipes, to ensure atomic writes when multiple processes are writing
    to a single FIFO, each process’s write must be less than PIPE_BUF bytes in size.


    # Reading and Writing FIFOs


    Subject to the considerations discussed at the end of the last section, reading
    and writing FIFOs is similar to reading and writing pipes and regular files.


    # Example


    ![](img/be588b36b489136ce784030a08a1d3d4_372_0.png)


