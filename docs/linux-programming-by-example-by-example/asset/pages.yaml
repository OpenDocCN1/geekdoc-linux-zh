- pgno: 540
  md: 'The code to list all the records in the database is the most interesting code
    in `mcdui.c`. Again, its functionality in the interactive application is almost
    identical to its cousin in the command-line client. It begins by obtaining a count
    of records in the database. If the count is zero, the program writes a message
    on the status line to this effect. Otherwise, `mcdui.c` begins by sizing tables
    of pointers to keys and values and then sizes each pointer in the two tables.


    > **TIP**

    > Again, a valuable improvement would be to size each table element dynamically
    rather than size them statically.


    The `list_recs` call fills the `keys` and `values` tables. The next code block
    uses the `list` helper routine to display all the CDs in the database to the'
  merge: -1
