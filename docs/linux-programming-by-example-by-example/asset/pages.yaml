    # **_Comments_**


    You can insert comments in a makefile by preceding the comment with the hash sign
    (#). When `make` encounters a comment, it ignores the hash symbol and the rest
    of the line following it. Comments can be placed anywhere in a makefile. Special
    consideration must be given to comments that appear in commands, because most
    shells treat # as a *metacharacter* (usually as a comment delimiter). As far as
    `make` is concerned, a line that contains only a comment is, for all practical
    purposes, blank. The previous example illustrated the use of comments, `make`
    totally ignored the four lines that consisted only of the comment delimiter and
    the two lines containing useless text.


