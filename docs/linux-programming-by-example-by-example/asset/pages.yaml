  md: 'cannot find a required library, execute `ldconfig -p` to list the known libraries.
    To actually update the library cache file, you must execute `ldconfig` as root.


    > **NOTE**

    > As you can see, managing shared libraries can be complex and confusing. A program
    that uses a function defined in shared libraries knows only the function''s name,
    which is often called a *stub*. The program does not know how the function is
    defined or how, at runtime, to access the function''s code. The function of `ld.so`
    is to connect the stub (the function name) to the actual code that implements
    the function (which lives in a shared library). The method `ld.so` uses to accomplish
    this is way beyond this book''s scope. As an application programmer, all you must
    concern yourself with is linking your program against the appropriate libraries.
    You may safely take it for granted that Linux takes care of the gory details for
    you.


    # *Environment Variables and Configuration Files*


    The dynamic linker/loader `ld.so` uses two environment variables to customize
    its behavior. The first is `$LD_LIBRARY_PATH`, a colon-separated list of directories
    that `ld.so` will search, in addition to the default directories `/lib` and `/usr/lib`,
    for shared libraries at runtime. The second variable, `$LD_PRELOAD`, is a whitespace-separated
    list of additional, user-specified shared libraries that load before all other
    libraries. It is used selectively to override functions that may be defined by
    other shared libraries.


    `ld.so` also uses two configuration files whose purposes parallel the environment
    variables mentioned in the preceding paragraph. `/etc/ld.so.conf` contains a list
    of directories in which the linker/loader should search for the shared libraries
    a program requires. This is in addition to the standard directories, `/usr/lib`
    and `/lib` that `ld.so` always searches. `/etc/ld.so.preload` is a disk-based
    version of the `$LD_PRELOAD` environment variable: It contains a whitespace-separated
    list of shared libraries to be loaded prior to executing a program.


    # Static Libraries


    *Static libraries* (and *shared libraries*, for that matter) are collections of
    one or more object files containing reusable precompiled code. Each constituent
    object file is also called a *module* or a *member*. Static libraries are stored
    in a special format along with a table or *map* that links symbol names to the
    members in which the symbols are defined. The map speeds up the compilation and
    linking processes. Static libraries are typically named with an `.a` (for *archive*)
    extension. Recall that code in static libraries is linked into a program at compile-time,
    whereas code in shared libraries is linked into a program, courtesy of `ld.so`,
    at runtime.'
