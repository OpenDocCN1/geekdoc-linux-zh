    PID = %d\\n\", getpid());\n printf(\"PPID = %d\\n\", getppid());\n exit(EXIT_SUCCESS);\n\
    }\n```\n```\n\nThe output from this program, on the author's system, was\n\n![](img/be588b36b489136ce784030a08a1d3d4_94_1.png)\n\
