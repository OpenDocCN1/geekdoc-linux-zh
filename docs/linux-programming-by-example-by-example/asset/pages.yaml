- pgno: 48
  md: "![](img/be588b36b489136ce784030a08a1d3d4_48_0.png)\n\n# Output\n\n```\n$ ./newhello-lib\n\
    Hi there, programmer!\nGoodbye, programmer!\n```\n\n# Error Checking and Warnings\n\
    \ngcc boasts a whole class of error-checking, warning-generating, commandline\
    \ options. These include `-ansi`, `-pedantic`, `-pedantic-errors`, and `-Wall`.\
    \ To begin with, `-pedantic` tells gcc to issue all warnings demanded by strict\
    \ ANSI/ISO standard C. Any program using forbidden extensions, such as those supported\
    \ by gcc, will be rejected. `-pedantic-errors` behaves similarly, except that\
    \ it emits errors rather than warnings. `-ansi` turns off GNU extensions that\
    \ do not comply with the standard. None of these options, however, guarantees\
    \ that your code, even when it compiles without error using any or all of these\
    \ options, is 100 percent ANSI/ISO-compliant.\n\nThe `-Wall` option instructs\
    \ gcc to display all of the generally relevant warnings it can in relation to\
    \ the code being compiled. `-Wall` emits warnings about code most programmers\
    \ consider questionable and/or that is easy to modify to prevent the generated\
    \ warning. One example of bad coding practice is to declare a variable but not\
    \ otherwise to use it. Another example is declaring a variable without explicitly\
    \ stating its type.\n\n# Examples\n\nConsider the following example, which shows\
    \ very bad programming form. It declares main as returning void, when in fact\
    \ main returns int, and it uses the GNU extension `long long int` to declare a\
    \ 64-bit integer.\n\n```\npedant.c\n/*\n * pedant.c - use -ansi, -pedantic or\
