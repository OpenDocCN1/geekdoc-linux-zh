  md: "```\n/\\* Loop while watching the pipes for output to read \\*/\nwhile(FD_ISSET(fds\\\
    [0\\], &watchset) || FD_ISSET(fds\\[1\\], &watchset)) {\n    /\\* Make sure select\
    \ has a current set of descriptors \\*/\n    inset = watchset;\n    if(select(maxfd\
    \ + 1, &inset, NULL, NULL, NULL) < 0)\n        err\\_quit(\"select\");\n\n   \
    \ /\\* Which file descriptor is ready to read? \\*/\n    for(i = 0; i < 2; ++i)\
    \ {\n        if(FD_ISSET(fds\\[i\\], &inset)) {\n            rc = read(fds\\[i\\\
    ], buf, BUFSZ - 1);\n            if(rc > 0) { /\\* Read some data \\*/\n     \
    \           buf\\[rc\\] = '\\\\0';\n                printf(\"read: %s\", buf);\n\
    \            } else if(rc == 0) { /\\* This pipe is closed \\*/\n            \
    \    close(fds\\[i\\]);\n                FD_CLR(fds\\[i\\], &watchset);\n    \
    \        } else\n                err\\_quit(\"read\"); /\\* Bummer \\*/\n    \
    \    }\n    }\n}\nexit(EXIT\\_SUCCESS);\nvoid err\\_quit(char \\*msg)\n{\n   \
    \ perror(msg);\n    exit(EXIT\\_FAILURE);\n}\n```\n\nFigure 8.1 shows how `mplex`\
    \ looks when it’s running.\n\nThis program is somewhat complex. After opening\
    \ the two named pipes, it initializes a set of file descriptors using `FD_ZERO`,\
    \ and then adds the descriptors for the two pipes. The heart of `mplex` is the\
    \ `while` loop. During each iteration, it uses `FD_ISSET` to see if either of\
    \ the pipes has data that can be read. If so, it first copies `watchset` to `inset`\
    \ because `watchset` might have changed due to one of the pipes being closed."
