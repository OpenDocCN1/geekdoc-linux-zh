  md: "# Creating and Opening a Queue\n\nThe `msgget` function creates a new queue\
    \ or opens an existing one. Its prototype is as follows:\n\n```\nint msgget(key_t\
    \ key, int flags);\n```\n\nIf the call is successful, it returns the queue ID\
    \ of the new or existing queue corresponding to the value contained in `key`.\
    \ If `key` is `IPC_PRIVATE`, a new queue is created using a key value that the\
    \ underlying implementation generates; using `IPC_PRIVATE` is guaranteed to create\
    \ a new queue if system limits on the number of queues or the total number of\
    \ bytes in all queues are not exceeded.\n\nSimilarly, if `key` is not `IPC_PRIVATE`\
    \ if `key` does not correspond to an existing queue having the same `key`, and\
    \ if the `IPC_CREAT` bit is set in the `flags` argument, a new queue is created.\
    \ Otherwise—that is, if `key` is not `IPC_PRIVATE` and if the `IPC_CREAT` bit\
    \ is not set in `flags`—`msgget` returns the queue ID of the existing queue associated\
    \ with `key`. If `msgget` fails, it returns -1 and sets the `errno` error variable.\n\
