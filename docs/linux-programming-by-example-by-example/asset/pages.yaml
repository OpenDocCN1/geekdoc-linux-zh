- pgno: 285
  md: '# # Using Color


    You have already seen that `ncurses` supports various highlighting modes. Interestingly,
    it also supports color in the same fashion; that is, you can logically OR the
    desired color value onto the character arguments of an `addch` call or any other
    output routine that takes a pseudo-character (`chtype`) argument. The method is
    tedious, however, so `ncurses` also has a set of routines to set display attributes
    on a per-window basis.


    Before you use `ncurses`'' color capabilities, you have to make sure that the
    current terminal supports color. The `has_colors` call returns `TRUE` or `FALSE`
    depending on whether the current terminal has color capabilities. `has_colors`
    has the following syntax:


    ```

    ```

    bool has_colors(void);

    ```

    ```


    The `bool` return value is defined in `<curses.h>`.


    `ncurses`'' default colors are as follows:


    +   - COLOR_BLACK


    +   - COLOR_RED


    +   - COLOR_GREEN


    +   - COLOR_YELLOW


    +   - COLOR_BLUE


    +   - COLOR_MAGENTA


    +   - COLOR_CYAN


    +   - COLOR_WHITE


    After you have determined that the terminal supports color, call the `start_color`
    function to start `ncurses`'' color subsystem. Its prototype is


    ```

    ```

    int start_color(void);

    ```

    ```


    > > **NOTE**

    > >

    > > Programs using `ncurses`'' color routines must be run on a terminal emulator
    that supports color, such as a color `xterm`, `rxvt`, or `nxterm`.


    Before you can use colors, however, you must initialize a set of color pairs.
    Doing so associates colors to the color pairs in the previous list. The function
    that does this is `init_pair`, prototyped as follows:


    ```

    ```

    int init_pair(short pair, short f, short b);

    ```

    ```


    This associates `pair` with a foreground color `f` and a background color `b`
    and returns `OK` on success or `ERR` on failure.'
