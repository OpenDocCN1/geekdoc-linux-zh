- pgno: 124
  md: '# ## Signal Concepts


    When discussing signals, several terms and concepts come up continuously. This
    section defines these terms and explains these concepts. At this point, a basic
    grasp of the terminology and concepts is sufficient; the rest of the chapter will
    explain them in more detail.


    # ### *What Is a Signal?*


    A *signal* is the software analog to a hardware interrupt, an event that occurs
    at almost any time while a process is executing. This unpredictability means that
    signals are *asynchronous*. Not only can a signal occur at any time, the process
    receiving the signal has no control over *when* the signal is sent. Every signal
    has a name, beginning with `SIG`, such as `SIGTERM` or `SIGHUP`. These names correspond
    to positive integer constants, called the *signal number*, defined in the system
    header file `<signal.h>`.


    Signals occur in many situations. A hardware exception, such as an illegal memory
    reference, generates a signal. A software exception, for example attempting to
    write to a pipe when it has no readers ("`SIGPIPE`"), also generates a signal.
    The `kill` function discussed in Chapter 4, "Processes", sends a signal to the
    `killed` process, as does the `kill` command. Finally, terminal-generated actions,
    such as typing `Ctrl+Z` to suspend the foreground process, generate signals.


    > - For a complete discussion of writing to pipes, see "Reading and Writing Pipes,"
    page 323.


    When a process receives a signal, it can do one of three things with it:


    +   - It can ignore the signal.

    +   - It can trap or *catch* the signal, which causes a special piece of code,
    called the *signal handler*, to execute. This is called *handling the signal*.

    +   - It can allow the signal''s default action to occur.


    This chapter looks at each of these options in detail.


    # ### Signal Terminology


    A signal is *generated* for a process when the event that causes that signal occurs,
    such as a hardware exception. Conversely, a signal is said to be *delivered* when
    the process to which it was sent takes action on it. Between a signal''s generation
    and delivery, it is considered to be *pending*. The delivery of a signal can be
    *blocked*, or delayed. It will be delayed until it is *unblocked* or until the
    receiving process changes the signal''s disposition to `ignore`. A signal''s *disposition*
