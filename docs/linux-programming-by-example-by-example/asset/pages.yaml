- pgno: 391
  md: '# Linux and System V IPC


    System V IPC is well-known and commonly used, but the Linux implementation of
    it is badly broken, as noted in this and the previous chapter. Linux''s version
    also pre-dates POSIX IPC, but few Linux programs actually implement it even though
    it is available in 2.2.x kernels. POSIX IPC has a similar interface to the earlier
    System V incarnation discussed in this and the last chapter, but it both eliminates
    some of the problems that System V had and also simplifies the interface. The
    problem is that although System V IPC is standard, it is also perverse and poorly
    implemented in Linux, for reasons that are too advanced to cover here.


    The outcome of this situation is that Linux, which strives (and mostly succeeds)
    to be POSIX compliant, implements both an early version of POSIX IPC and the System
    V version. The difficulty is that System V is well-established and more common,
    but the POSIX version is better, easier to use, and has a more uniform interface
    for interacting programmatically with the three types of IPC objects. The result?
    I chose to break my own rule and opted to cover what you are likely to encounter
    in both existing and new programs rather than discuss the Right Thing © that is,
    POSIX IPC.


    An additional issue arises when dealing with semaphores. System V semaphores were
    created in the Dark Ages to address the horde of problems that arise when multiple
    threads of execution in a single process (and in multiple processes) need to access
    the same system resources approximately simultaneously. Although I consider well-written
    multithreaded programs an essential (indeed, an indispensable) component of any
    Linux system, I emphasize well-written. Writing multithreaded programs goes far,
    far beyond this book''s scope; it''s no place for novice programmers. Experienced
    programmers, even über-programmers, will look for other solutions before resorting
    to multithreading because it is difficult to implement correctly.


    My point? I simplified the discussion of semaphores because the System V version
    was created with multithreaded processes in mind. Nonetheless, semaphores in standard,
    single-threaded programs are quite useful, as you will see in this chapter. The
    POSIX semaphore interface is simpler but not widely used, at this time, in Linux
    programs.


    # Message Queues


    A message queue is a linked list of messages stored within the kernel and identified
    to user processes by a message queue identifier, an identifier of the sort discussed
    in the last chapter. For brevity and convenience, this chapter uses the terms
    queue and queue ID to refer to message queues and message queue identifiers. If
    you are adding a message to a queue, it appears to be a FIFO because new messages
    are added at the end of the'
  merge: -1
