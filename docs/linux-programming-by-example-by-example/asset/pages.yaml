- pgno: 356
  md: "# ## 15—\nPipes and FIFOs\n\nThis is the first of four chapters covering Linux's\
    \ assortment of methods for *interprocess communication*, or IPC. IPC is a generic\
    \ term referring to the methods that processes use to communicate with each other.\
    \ Without IPC, processes can exchange data or other information with each other\
    \ only through the filesystem or—in the case of processes having a common ancestor\
    \ (such as the parent/child relationship after a `fork`)—through any inherited\
    \ file descriptors. This chapter discusses pipes and FIFOs, the oldest forms of\
    \ IPC that UNIX and UNIX-like systems have. The topics covered include the following:\n\
    \n+   - Unnamed pipes\n+   \n+   • Opening and closing unnamed pipes\n+   \n+\
    \   • Reading and writing unnamed pipes\n+   \n+   • Using `popen` and `pclose`\n\
    +   \n+   • Understanding FIFOs\n+   \n+   • Creating, opening, and closing FIFOs\n\
    +   \n+   • Reading and writing FIFOs\n\n> • Inheriting file descriptors is discussed\
    \ in \"Using fork\", page 78."
  merge: -1
  img_proc: true
- pgno: 357
  md: '# # Pipes


    *Pipes* simply connect one process''s output to another process''s input. Like
    their physical analogues, a Linux pipe is (usually) unidirectional or half duplex;
    data flows in only one direction. This chapter discusses two kinds of pipes, unnamed
    and named. Named pipes are usually called *FIFOs* (First In First Out). *Unnamed
    pipes* are unnamed because they never have a pathname, so they never exist in
    the filesystem. Strictly speaking, all they are is two file descriptors associated
    with an in-core inode. The last process to close one of these file descriptors
    causes the inode, and, thus, the pipe, to vanish. *Named pipes*, on the other
    hand, do have a pathname and do exist in the filesystem. They are called FIFOs
    because data is read from them in the order it was written, so the first data
    into a FIFO is also the first data out of a FIFO. Figure 15.1 illustrates the
    differences and similarities between unnamed pipes and FIFOs.


    ![](img/be588b36b489136ce784030a08a1d3d4_357_0.png)


    The top half of Figure 15.1 illustrates the execution of the shell pipeline `cat
    /etc/passwd | cut - f1 -d:`. The bottom half of Figure 15.1 shows how the pipeline
    in the upper half of the figure would be executed if you used a named pipe rather
    than an unnamed pipe. The vertical dashed lines represent the point at which data
    is either being written to or read from a pipe.'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'The double-headed arrows show how the input and output of the two types of
    pipes correspond to each other. All the details will be explained in subsequent
    sections, so you might want to refer to this figure as you proceed through the
    chapter. In the top part of the figure, the output of the `cat` command is transmitted
    through an unnamed pipe created in the kernel. Its output becomes `cut`''s input.
    This is a typical use of shell pipelines.


    In particular, note that using named pipes requires that the order of the `cat`
    and `cut` commands is reversed. For reasons that will be explained later, the
    `cut` command must be executed first (and run in the background) so that you are
    able, in the same terminal or from the same console, to issue the `cat` command
    that provides the input to the named pipe.


    The named pipe, `/tmp/myfifo`, and the unnamed pipe serve the same purpose, feeding
    their input to their output. All that really differs is the order in which commands
    are executed and the use of the shell redirection operators, > and <, when dealing
    with named pipes.


    > **NOTE**

    > Perhaps FIFOs are so named because they are also created using the `mkfifo`
    function!


    Most Linux users are familiar with unnamed pipes, although they might not realize
    it. Every command such as the following uses unnamed pipes:


    ```

    $ cat /etc/passwd | cut -f1 -d: | sort

    ```


    In this example, the output from the `cat` command becomes the input to the `cut`
    command, whose output then becomes input to `sort`. As you know, the `|` is the
    pipe symbol. What you might not realize is that your shell probably implements
    `|` using the `pipe` function you will meet in a moment. Hopefully, it is clear
    that there is never an actual disk file associated with `|`.


    > **CAUTION**

    > A quick tip on terminology: Unless the distinction needs to be made clear, `pipe`
    in this chapter refers to unnamed pipes, and `FIFO` refers to named pipes. Both
    pipes and FIFOs, however, are `half duplex;` that is, data flows in only one direction,
    just as water in a drainage pipe flows in only one direction. Pipes and FIFOs
    are also `non-seekable;` that is, you can''t use calls like `lseek` to position
    the file pointer.


    Unnamed pipes have two shortcomings. First, as noted, they are half duplex, so
    data can travel in only one direction. Second, and more significantly, pipes can
    be used only between related processes, those that have a common ancestor. As
    you will recall from Chapter 4, "Processes," child processes created from a `fork`
    or an exec inherit their parent''s file descriptors.


    Figure 15.2 shows how data flows through a pipe.'
  merge: -1
  img_proc: true
- pgno: 359
  md: '![](img/be588b36b489136ce784030a08a1d3d4_359_0.png)


    As the figure shows, data is written (by the writer) to one end of the pipe and
    read (by the reader) at the other end.


    # *Opening and Closing Pipes*


    Naturally, before you can read from or write to a pipe, it must exist. The call
    to create a pipe is pipe. Its prototype is declared in `<unistd.h>` as follows:


    ```

    int pipe(int filedes[2]);

    ```


    If pipe succeeds, it opens two file descriptors and stores their values in the
    integer array filedes. The first descriptor, filedes[0], is used for reading,
    so pipe opens it using read’s O_RDONLY flag. The second file descriptor, filedes[1],
    is used for writing, so pipe opens it using open’s O_WRONLY flag. pipe returns
    0 on success or -1 if an error occurs, in which case it also sets the global error
    variable errno.


    > • The syntax of the open and close system calls is covered in "Opening and Closing
    Files," page 139.


    Possible error conditions are EMFILE, meaning the calling process already has
    too many open file descriptors, EFAULT, which means that the filedes array was
    invalid, or ENFILE, which occurs when the kernel’s file table is full (definitely
    not a good sign!). Again, it must be emphasized that the file descriptors do not
    correspond to a disk file, only to an inode that lives inside the kernel. Figure
    15.3 illustrates this point.


    ![](img/be588b36b489136ce784030a08a1d3d4_359_1.png)


    To close a pipe, close its associated file descriptors using the close system
    call.'
  merge: -1
  img_proc: true
