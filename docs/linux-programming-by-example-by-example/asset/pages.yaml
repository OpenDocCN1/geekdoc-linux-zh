- pgno: 186
  md: "## Changing File Timestamps\n\nRecall from Chapter 7, \"Basic Linux File Handling,\"\
    \ the kernel contains three timestamps for each file: its last access time (*atime*),\
    \ last modification time (*mtime*), and last change time (*ctime*). The POSIX\
    \ standard provides the *utime* routine to change the *atime* and the *mtime*.\
    \ There is no user-level programmatic interface for changing the *ctime*, but\
    \ changing the *atime* or *mtime* function causes the *ctime* to change, so it\
    \ should not be a problem.\n\nThe *utime* function is prototyped in `<utime.h>`\
    \ as\n\n```\nint utime(const char *pathname, struct utimbuf *buf);\n```\n\nYou\
    \ might also need to include the `<sys/types.h>` header file because it contains\
    \ the primitive system data types defined by POSIX. Older versions of *gcc* and\
    \ Linux did not always include `<sys/types.h>` in `<utime.h>`, so if your compiler\
    \ complains about undefined values when compiling programs, add the types header\
    \ file, but only if it declares the type about which the compiler complains. *utime*\
    \ changes the access and modification times of the file specified by *pathname*\
    \ to the *actime* and *modtime*, respectively, which are stored in *buf*. If *buf*\
    \ is NULL, the *actime* and *modtime* are set to the current time. As usual, *utime*\
    \ returns 0 on success. On error, it sets *errno* and returns -1. Of course, the\
    \ process calling *utime* must have appropriate access to the file or be running\
    \ with root privileges.\n\nThe *utimbuf* structure is defined as follows:\n\n\
    ```\nstruct utimbuf {\n    time_t actime;  /* access time */\n    time_t modtime;\
    \ /* modification time */\n};\n```\n\nThe *time_t* type is a POSIX standard type,\
    \ usually a long integer, that stores the number of seconds elapsed since the\
    \ Epoch. The *Epoch*, in turn, is defined by POSIX to be the date/time January\
    \ 1, 1970 at 00:00:00 UTC (Universal Coordinated Time, which used to be known\
    \ as Greenwich Mean Time).\n\n> > **NOTE** Interestingly, because many of Linux’s\
    \ time-related functions are based on the Epoch, the much-publicized year 2000\
    \ bug is not as big a problem for Linux as is the year 2038. Because *time_t*\
    \ is a long integer, it will overflow in 2038. That is, *time_t* can hold up to\
    \ 2^31-1 seconds, or 2,147,483,647 seconds. Disregarding leap years, there are\
    \ 365\\*24\\*60\\*60, or 31,536,000, seconds in each year. So, *time_t* represents\
    \ a maximum of about 68 years (2,147,483,647 / 31,536,000). Because the epoch\
    \ begins in 1970, adding 68 years to this yields 2038. The exact date and time\
    \ when *time_t* will overflow varies, depending on how many seconds exist in leap\
    \ years."
  merge: -1
  img_proc: true
