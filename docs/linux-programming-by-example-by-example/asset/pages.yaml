    executed, so you can simply press the Enter key to re-execute the last command,
    a real finger saver. This works for most gdb commands. See the documentation for
    more details.


    # Variable Scope and Context


    At any given time, a variable is either in scope or not in scope, which affects
    the variables to which you have access, can examine, and can manipulate. You cannot
    access out of scope variables. There are a few rules that control variable scope,
    whether or not a variable is active or inactive:


    +   - Local variables in any function are active if that function is running or
    if control has passed to a function called by the controlling function. Say the
    function foo calls the function bar; as long as bar is executing, all variables
    local to foo and bar are active. After bar has returned, only local variables
    in foo are active.


    +   - Global variables are always active, regardless of whether the program is
    running.


    +   - Nonglobal variables are inactive unless the program is running.


    So much for variable scope. What is gdb’s notion of variable context? The complication
    arises from the use of static variables, which are file-local; that is, you can
    have identically named static variables in several files, and they will not conflict
    because they are not visible outside the file to which they are defined. Fortunately,
    gdb has a way to identify to which variable you are referring. It resembles C++’s
    scope resolution operator. The syntax is as follows:


    ```

    file_or_funcname::varname

    ```


    where varname is the name of the variable to which you want to refer and file_or_funcname
    is the name of the file or the function in which it appears.'
