    \ and visit each record in turn. Berkeley DB maintains a logical pointer, called\
    \ a cursor, that you can move forward and backward through a database.\n\nBefore\
    \ performing cursor operations, you must create a cursor associated with the database.\
    \ The call to do so is cursor, which is prototyped as follows:\n\n```\n```\nDB->cursor(DB\
    \ *db, DB_TXN *txnid, DBC **cursorp, u_int32_t flags);\n```\n```"
