    A sample run of lockit produces the following output:\n\n```\n$ ./lockit lockit.c.lck\n\
    lock established\nfile already locked\n```\n\nUnless something unexpected occurs,\
    \ lockit successfully locks the file (whose name is passed as the only command-line\
    \ argument) in the first open statement. Then, in the second open statement, lockit\
    \ tries to lock the file a second time by creating the same lockfile. Specifying\
    \ O_CREAT in the open call, along with O_EXCL, means that the open call will fail\
    \ if the file already exists. To express it another way, creating or opening a\
    \ lock file using the syntax shown is synonymous with locking a file; deleting\
    \ a lock file is synonymous with unlocking a file. Because this test fails, the\
    \ program reports that the file is already locked. Back in the outer block, the\
    \ program closes the file descriptor and unlinks (deletes) the file, thus removing\
    \ the lock.\n\n# Record Locking\n\nAlthough lock files are easy to use, they have\
    \ significant drawbacks:\n\n+   - When a file is locked, it is not available to\
    \ other processes that merely want to read it.\n+   \n+   - The O_EXCL flag is\
    \ reliable only on local filesystems, not on networked filesystems such as NFS.\n\
    +   \n+   - The locks are only advisory; processes can ignore them.\n+   \n+ \
    \  - If a process terminates before it removes a lock file, the lock file remains\
    \ in place and other processes have no reliable way to determine whether it is\
    \ stale, that is, left over from a process that died prematurely.\n\nThese shortcomings\
    \ led to the development of record locking, which gives programmers the ability\
    \ to lock specific regions of files, called records. Record locks, sometimes referred\
    \ to as POSIX locks, allow multiple"
  merge: -1
  img_proc: true
- pgno: 216
  md: "processes to lock different portions of the same file or even read the same\
    \ segments of the same file. Record locks also work across NFS and other networked\
    \ filesystems. Finally, because record locks are held by the kernel, when a process\
    \ terminates, its locks are automatically released.\n\nPOSIX locks come in two\
    \ varieties, *read or shared locks* and *write or exclusive* locks. Read locks\
    \ are called shared locks because many processes can hold read locks on the same\
    \ region of a file. Exclusive locks, however, prevent access to a locked region\
    \ while the write lock is in place. Furthermore, you cannot create a write lock\
    \ while a read lock is in place for the same area of a file.\n\n> **NOTE**\n>\
    \ Recall from Chapter 4, \"Processes,\" that child processes do not inherit file\
    \ locks after a *fork*, although an execed process does inherit file locks from\
    \ its parent.\n\nThe *fcntl* call, prototyped in `<fcntl.h>`, manages record locks.\
    \ It has the following prototype:\n\n```\nint fcntl(int fd, int cmd, struct flock\
    \ *lock);\n```\n\n*fd* is the file descriptor to lock. *cmd* must be one of *F_GETLK*,\
    \ *F_SETLK*, or *F_SETLKW*. *F_GETLK* checks to see if the file can be locked.\
    \ If it can be locked, the *l_type* member of *struct flock* is set to *F_UNLCK*\
    \ and if it cannot be locked, the *l_pid* member of *struct flock* is set to the\
    \ PID of the process holding the lock. *F_SETLK* sets the lock. *F_SETLKW* also\
    \ sets the lock, but *fcntl* waits to return until it successfully sets the lock.\n\
    \n*lock* is a pointer to a *flock* structure that describes the lock and its behavior.\
    \ *struct flock* is defined as follows:\n\n```\nstruct flock {\n    short l_type;\
    \ /* Type of lock */\n    short l_whence; /* Beginning of lock */\n    off_t l_start;\
    \ /* Starting offset of lock */\n    off_t l_len; /* Number of bytes to lock */\n\
    \    pid_t l_pid; /* Process holding lock */\n};\n```\n\n*l_type* can be *F_RDLCK*\
    \ for a read lock, *F_WRLCK* for a write lock, or *F_UNLCK* to release the lock.\
    \ *l_whence* is one of *SEEK_SET*, *SEEK_CUR*, or *SEEK_END*, which have the same\
    \ semantics as the *lseek* call. *l_start* indicates the starting offset of the\
    \ lock, relative to *l_whence*, and *l_len* specifies how many bytes to lock.\
    \ *l_pid*, finally, is the PID of the process holding the lock.\n\n> * The lseek\
    \ system call is covered in \"Positioning the File Pointer,\" page 143."
  merge: -1
  img_proc: true
