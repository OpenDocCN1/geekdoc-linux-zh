    \ &status, 0);\n\t\tputs(\"in parent\");\n\t\tprintf(\"\\tparent pid = %d\\n\"\
    , getpid());\n\t\tprintf(\"\\tparent ppid = %d\\n\", getppid());\n\t\tprintf(\"\
    \\tchild exited with %d\\n\", status);\n\t}\n\texit(EXIT_SUCCESS);\n}\n```\n```"
