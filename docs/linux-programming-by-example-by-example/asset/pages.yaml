    *Menus* are screen displays that help users choose some action or item from a
    set of actions or items. The ncurses menu library works by creating sets of items
    that are then grouped together and attached to a window, after which they are
    posted, or displayed on that window. You can also import, or detach a menu, ultimately
    to free its resources.


    From a high level, the procedure for creating and using menus resembles the following:


    +   1. Initialize ncurses.

    +   2. Use `new_item` to create menu items.

    +   3. Use `new_menu` to create the menu proper.

    +   4. Use `post_menu` to post the menu.

    +   5. Refresh.

    +   6. Process user input in a command loop.

    +   7. Use `unpost_menu` to unpost the menu.

    +   8. Use `free_menu` to free its resources.

    +   9. Use `free_item` to free their resources.

    +   10. Terminate ncurses.


    The key functions and macros for creating menus follow. They are explained in
    detail in the next few paragraphs.


