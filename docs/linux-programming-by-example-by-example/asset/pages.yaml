    # Handling Errors


    When you run into trouble using make, the -d option tells make to print lots of
    extra debugging information in addition to the commands it is executing. The output
    can be overwhelming because the debugging dump will display what make does internally
    and why. The debug option''s output includes the following information:


    +   - Which files make evaluates for rebuilding

    +   - Which files are being compared and what the comparison results are

    +   - Which files actually need to be remade

    +   - Which implicit rules make thinks it will use

    +   - Which implicit rules make decides to use, and the commands it actually executes


    The list that follows contains the most common error messages you will encounter
    while using make and suggests how to resolve them. For complete documentation,
    refer to the make manual or, better yet, make''s info pages (use the command info
    "GNU make").


    +   - **No rule to make target ''target''.** Stop—make could not find an appropriate
    rule in the makefile to build the named target and no default rules apply. The
    solution is to locate the target causing the problem and add a rule to create
    it or to fix the existing rule.


    +   - **''target'' is up to date**—The dependencies for the named target have
    not changed (are older than the target). This is not really an error message,
    but, if you want to force the target to be remade, simply use the touch utility
    to change the timestamp on the file. This will cause make to rebuild the target
    in question.'
