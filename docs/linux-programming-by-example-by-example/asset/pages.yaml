    \ | Symbolic name, if any, used to check out the revision |\n| `$RCSfile$` | Name\
    \ of the RCS file without a path |\n| `$Revision$` | Revision number assigned\
    \ to the revision |\n| `$Source$` | Full pathname to the RCS file |\n| `$State$`\
    \ | The state of the revision:`Exp` (experimental) is the default; `Stab` (stable);\
    \ `Rel` (released) |"
