  md: '# 2—

    **Controlling the Build Process —GNU make**


    make is a tool used to control the process of building and rebuilding software.
    make automates what software is built, how it gets built, and when it gets built,
    freeing you to concentrate on writing code. It also saves a lot of typing, since
    it contains logic that invokes the C compiler with appropriate options and arguments.


    In this chapter, you learn the following:


    +   - How to invoke make

    +   - make’s command-line options and arguments

    +   - Creating makefiles

    +   - Writing make rules

    +   - Using make variables

    +   - Dealing with make errors'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# ## Why make?


    For all but the simplest software projects, make is essential. In the first place,
    projects composed of multiple source files require long, complex compiler invocations.
    make simplifies this by storing these difficult command lines in a makefile, a
    text file that contains all of the commands required to build software projects.


    make is convenient for both you and anyone else wanting to build your program.
    As you make changes to your program, whether you are adding new features or incorporating
    bug fixes, make allows you to rebuild it with a single, short command, to rebuild
    only a single component, such as a library file, or to customize the kind of build
    you want, depending on the circumstances. make is also convenient for other people
    who might build your program. Rather than creating documentation that explains
    in excruciating detail how to build it, you simply instruct them to type make.
    You will appreciate having to write less documentation, and they will appreciate
    the convenience of simple build instructions.


    +   * For more information about distributing software, see "Software Distribution,"
    page 443.


    Finally, make speeds up the edit-compile-debug process. It minimizes rebuild times
    because it is smart enough to determine which files have changed, and thus only
    rebuilds files whose components have changed. The makefile also constitutes a
    database of dependency information for your projects, allowing you automatically
    to verify that all of the files necessary for building a program are available
    each time you start a build. As you gain experience with Linux programming, you
    will come to appreciate this feature of make.


    # ### Using make


    This section explains how to use make. In particular, it explains how to create
    makefiles, how to invoke make, how to unravel its plethora of options, arguments,
    and switches, and how to handle the inevitable errors that occur along the way.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Creating Makefiles\n\nSo, how does `make` accomplish its magical feats? By\
    \ using a makefile. A *makefile* is a text file database containing rules that\
    \ tell `make` what to build and how to build it. A *rule* consists of the following:\n\
    \n+   - A *target*, the \"thing\" `make` ultimately tries to create\n+   - A list\
    \ of one or more *dependencies*, usually files, required to build the target\n\
    +   - A list of *commands* to execute in order to create the target from the specified\
    \ dependencies\n\nWhen invoked, GNU `make` looks for a file named `GNUmakefile`,\
    \ `makefile`, or `Makefile`, in that order. For some reason, most Linux programmers\
    \ use the last form, `Makefile`.\n\nMakefile rules have the general form\n\n```\n\
    ```\ntarget: dependency [dependency] [ . . . ]\n\tcommand\n\t[command]\n\t[ .\
    \ . . ]\n```\n```\n\n> **CAUTION**\n> The first character in a command must be\
    \ the tab character; eight spaces will not suffice. This often catches people\
    \ unaware, and can be a problem if your preferred editor \"helpfully\" translates\
    \ tabs to eight spaces. If you try to use spaces instead of a tab, `make` displays\
    \ the message \"Missing separator\" and stops.\n\n`target` is usually the binary\
    \ or object file you want created. `dependency` is a list of one or more files\
    \ required as input in order to create `target`. The `commands` are the steps,\
    \ such as compiler invocations or shell commands, necessary to create `target`.\
    \ Unless specified otherwise, `make` does all of its work in the current working\
    \ directory.\n\n\"All well and good,\" you are probably thinking, \"but how does\
    \ `make` know when to rebuild a file?\" The answer is stunningly simple: if a\
    \ specified target does not exist in a place where `make` can find it, `make`\
    \ (re)builds it. If the target does exist, `make` compares the timestamp on the\
    \ target to the timestamp of the dependencies. If at least one of the dependencies\
    \ is newer than the target, `make` rebuilds the target, assuming that the newer\
    \ dependency implies some code change that must be incorporated into the target."
  merge: -1
  img_proc: true
