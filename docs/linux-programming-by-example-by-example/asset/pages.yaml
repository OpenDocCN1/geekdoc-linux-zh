    ```


    The id command prints the real and effective UIDs and GIDs of the user that executes
    it (see man id for more information). When the user dummy executes ids, the output
    matches that of the system’s id command. More importantly, despite the user and
    group ownership on ids, the effective and real UID and GID are those of the user
    executing it.


    The third set of IDs are the saved UID and the saved GID. They are called saved
    IDs because they are saved by the exec function, covered in the section “Manipulating
    Processes,” when it executes programs. Ordinarily, programmers need only concern
    themselves with the real and effective IDs.


    # setuid and setgid Programs


    As stated earlier, one situation in which a process’s real and effective IDs differ
    occurs when the program it is executing is setuid or setgid. setuid and setgid
    programs are so named because the effective UID or GID is set to the file’s UID
    or GID rather than to the owner or group ID of the user executing the program.
    The purpose of setuid and setgid programs is to give the user executing the program
    special permissions.


    For example, consider the passwd program, used to change passwords. Most Linux
    systems store passwords in /etc/passwd. This file is readable by all users but
    writable only by the root user. You can see this very clearly when you run ls
    -l /etc/passwd, as follows:


    ```

    $ ls -l /etc/passwd

    -rw-r-r-r- 1 root bin 703 Aug 10 16:44 /etc/passwd

    ```


    As a result, the passwd program must be owned by the root user. However, because
    passwd can be executed by any user, it would not normally be capable of updating
    the /etc/passwd file. The solution to this dilemma is that passwd is a setuid
    root program; that is, when it executes, its effective UID is set to the root
    UID, allowing it to update /etc/passwd.


    > NOTE

    > Actually, most modern Linux systems use shadow passwords, so the actual password
    is stored in /etc/shadow, which is readable and writable only by the root users.
    The password field in /etc/passwd is the letter x.


    A setuid program has an s instead of an x in the owner’s execute bit, as the next
    listing shows:'
