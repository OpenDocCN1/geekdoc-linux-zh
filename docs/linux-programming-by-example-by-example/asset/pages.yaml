- pgno: 53
  md: '# ## Debugging Options


    Bugs are as inevitable as death and taxes. To accommodate this sad reality, use
    `gcc`''s `-g` and `-ggdb` options to insert debugging information into your compiled
    programs. These options facilitate debugging sessions.


    The `-g` option can be qualified with `1`, `2`, or `3` to specify how much debugging
    information to include. The default level is `2` (`g2`), which includes extensive
    symbol tables, line numbers, and information about local and external variables.
    Level `3` debugging information includes all of the level `2` information and
    all of the macro definitions present. Level `1` generates just enough information
    for creating backtraces and stack dumps. It does not generate debugging information
    for local variables or line numbers.


    If you intend to use the GNU debugger, `gdb` (covered in Chapter 20, "A Debugging
    Toolkit"), using the `-ggdb` option creates extra information that eases the debugging
    chore under `gdb`. `-ggdb` accepts the same level specifications as `-g`, and
    they have the same effects on the debugging output. Using either of the two debug-enabling
    options will, however, dramatically increase the size of your binary.


    ![](img/be588b36b489136ce784030a08a1d3d4_53_0.png)


    # ### Example


    This example shows you how to compile with debugging information and illustrates
    the impact debugging symbols can have on the size of a binary. Simply compiling
    and linking Listing 1.1 resulted in a binary of 4089 bytes on my system. The resulting
    sizes when I compiled it with the `-g` and `-ggdb` options may surprise you:


    ![](img/be588b36b489136ce784030a08a1d3d4_53_1.png)


    # ### Output


    ```

    ```

    $ gcc -g hello.c -o hello_g

    $ ls -l hello_g

    -rwxr-xr-x 1 kwail users 6809 Jul 13 21:09 hello_g*

    $ gcc -ggdb hello.c -o hello_ggdb

    $ ls -l hello_ggdb

    -rwxr-xr-x 1 kwail users 354867 Jul 13 21:09 hello_ggdb*

    ```

    ```


    As you can see, the `-g` option increased the binary''s size by half, whereas
    the `-ggdb` option increased the binary nearly 900 percent! Despite the size increase,
    you should provide binaries with standard debugging symbols (created using `-g`)
    in them in case someone encounters a problem and tries to debug your code for
    you.'
  merge: -1
  img_proc: true
