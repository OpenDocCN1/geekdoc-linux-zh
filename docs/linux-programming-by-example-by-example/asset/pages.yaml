- pgno: 114
  md: 'The three functions that contain an `l` expect a comma-separated list of arguments,
    terminated by a `NULL` pointer, that will be passed to the program being `execed`.
    The functions containing a `v`, however, take a vector, that is, an array of pointers
    to null-terminated strings. The array must be terminated with a `NULL` pointer.
    For example, suppose you want to `exec` the command `/bin/cat /etc/passwd /etc/group`.
    Using one of the `l` functions, you simply pass each of these values as an argument,
    terminating the list with `NULL`, as illustrated here:


    ```

    execl("/bin/cat", "/bin/cat", "/etc/passwd", "/etc/group", NULL);

    ```


    If you prefer to use one of the `v` functions, however, you first have to build
    the `argv` array, and then pass that array to the `exec` function. Your code would
    look something like the following:


    ```

    char *argv[] = {"/bin/cat", "/etc/passwd", "/etc/group", NULL};

    execv("/bin/cat", argv);

    ```


    Finally, the two functions ending in `e—execl` and `execle`—allow you to create
    a specialized environment for the program being `execed`. This environment is
    stored in `envp`, which is also a pointer to a null-terminated array of null-terminated
    strings. Each string takes the form of a `name=value` pair, where `name` is the
    name of an environment variable and `value` is its value. For example,


    ```

    char *envp[] = "PATH=/bin:/usr/bin", "USER=joeblow", NULL);

    ```


    In this example, `PATH` and `USER` are the names, and `/bin:` `/usr/bin` and `joeblow`
    are the values.


    The other four functions receive their environment implicitly through a global
    variable named `environ` that points to an array of strings containing the calling
    process’s environment. To manipulate the environment these functions inherit,
    use the `putenv` and `getenv` functions. Declared in `<stdlib.h>`, they are prototyped
    as


    ```

    int putenv(const char *string)

    char *getenv(const char *name);

    ```


    `getenv` looks for an environment variable named `name` and returns a pointer
    to its value, or returns `NULL` if there is no match. `putenv` adds or changes
    the `name=value` pair specified in `string`. If it succeeds, it returns zero.
    If it fails, it returns -1. Code using `getenv` and `putenv` would resemble the
    following snippet.'
