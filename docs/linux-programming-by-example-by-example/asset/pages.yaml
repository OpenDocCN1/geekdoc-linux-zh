    # Resource Usage


    A process’s resource usage involves more than just CPU time. You also have to
    consider the process’s memory footprint, how the memory is structured, the types
    of memory accesses the process makes, the amount and type of I/O it performs,
    and the quantity and type of network activity, if any, it generates. The kernel
    tracks all this information, and more, for each process. At least, it has the
    capability to do so. The structure in which this information is obtained is an
    rusage structure, defined in the <sys/resource.h> header file. This structure
    is defined as follows:


    ```

    struct rusage {`n    struct timeval ru_utime;     /* user time used */`n    struct
    timeval ru_stime;    /* system time used */`n    long ru_maxrss;             /*
    maximum resident set size */`n    long ru_ixrss;              /* shared memory
    size */`n    long ru_idrss;              /* unshared data size */`n    long ru_isrss;             /*
    unshared stack size */`n    long ru_minflt;            /* page reclaims */`n    long
    ru_majflt;            /* page faults */`n    long ru_nswap;             /* swaps
    */`n    long ru_inblock;           /* block input operations */`n    long ru_oublock;           /*
    block output operations */`n    long ru_msgsnd;            /* messages sent */`n    long
    ru_msgrcv;            /* messages received */`n    long ru_nsignals;          /*
    signals received */`n    long ru_nvcsw;             /* voluntary context switches
    */`n    long ru_nivcsw;           /* involuntary context switches */`n};

    ```


    Linux, unfortunately, only keeps track of the resources listed in Table 4.2.'
