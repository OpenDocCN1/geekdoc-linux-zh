  md: "# ### Subwindows\n\nncurses has two functions for creating subwindows, subwin\
    \ and derwin:\n\n```\nWINDOW *subwin(WINDOW *orig, int nlines, int ncols, int\
    \ begin_y, int begin_x);\nWINDOW *derwin(WINDOW *orig, int nlines, int ncols,\
    \ int begin_y,\nint begin_x);\n```\n\nsubwin and derwin create and return a pointer\
    \ to a window with ncols columns and nlines rows, positioned in the center of\
    \ the parent window orig. The child window's upper-left corner is positioned at\
    \ begin_y, begin_x relative to the screen, not the parent window. derwin behaves\
    \ like subwin except that the child window is positioned at begin_y, begin_x relative\
    \ to the parent window orig, not the screen.\n\n# #### Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_289_0.png)\n\
    \n# ### Example\n\nThis program creates a child window, writes some text into\
    \ it, and then moves it across the parent window, thus illustrating how subwindows\
    \ can be managed independently of their parents.\n\n```\n/*\n * subwin.c - curses\
    \ utility routines\n */\n#include <stdlib.h>\n#include <curses.h>\n#include <errno.h>\n\
    #include <unistd.h>\n#include \"utilfcs.h\"\n\nint main(void)\n{\n    WINDOW *win;\n\
    \    int ymax, xmax, n = 0;\n\n    app_init();\n\n    wbkgd(stdscr, 'X');\n  \
    \  wrefresh(stdscr);\n    if ((win = subwin(stdscr, 10, 10, 0, 0)) == NULL)\n\
    \        err_quit(\"subwin\");\n    wbkgd(win, ' ');\n    wprintw(win, \"\\n#SUBWINDOW\\\
    n\");\n```"
