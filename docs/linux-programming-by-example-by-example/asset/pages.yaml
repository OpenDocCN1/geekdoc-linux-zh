    tar: Error exit delayed from previous errors

    smb.conf

    etc/syslog.conf

    ```


    The `v` option instructs `tar` to be verbose, that is, to list the files it is
    adding to the archive. Again, it is safe to ignore errors that occur due to file
    access violations.


    > **TIP**

    > Using the `z` option to compress a tarball slows down `tar`''s operation somewhat,
    but it saves typing because you do not have to issue a second shell command, using
    `gzip`, to compress the tarball. On the other hand, calling `gzip` directly results
    in much better compression, but you have to type an additional command to prepare
    your package for distribution. Because programmers are lazy critters, makefiles
    usually include a target named `dist` that creates a gzipped tarball. This reduces
    the amount of typing you''ll have to do and is convenient: simply type `make dist`
    and your package is ready to upload for the rest of the world to download.


    Make sure you understand the difference between `gzip`, `zip`, and `compress`.
    `gzip` is the standard file compression utility on Linux systems. It is also the
    default compression utility used when you use `tar`''s `z` option. Compressed
    archives created using `gzip` generally have a `.gz` extension on them. `zip`
    creates PKZIP compatible files but is a free alternative to the PKZIP utilities.
    Files compressed using `zip` have a `.zip` extension. `compress`, finally, is'
