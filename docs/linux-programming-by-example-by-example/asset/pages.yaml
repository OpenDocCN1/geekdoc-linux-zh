- pgno: 209
  md: "# Using a Mapped File\n\nOf course, it is one thing to map and unmap a file,\
    \ but the whole idea is to *use* and manipulate the file. The calls discussed\
    \ in this section—`msync`, `mprotect`, the `mlock` family, and `mremap`—enable\
    \ you to do these things.\n\n# Writing a Map to Disk\n\nThe `msync` function writes\
    \ a mapped file to disk. It has the following prototype:\n\n```\n`int msync(const\
    \ void *start, size_t length, int flags);`\n```\n\n`msync` flushes `length` bytes\
    \ of the map to disk beginning at the memory address `start` address. The `flags`\
    \ argument is a bitwise OR of one or more of the following:\n\n+   * `MS_ASYNC`—Schedules\
    \ a write and returns\n\n+   * `MS_SYNC`—Writes data before `msync()` returns\n\
    \n+   * `MS_INVALIDATE`—Invalidates other maps of the same file so they will be\
    \ updated with new data\n\n# Changing Map Protections\n\nThe `mprotect` function\
    \ modifies a memory map’s protection flags. It is prototyped as follows:\n\n```\n\
    `int mprotect(const void *addr, size_t len, int prot);`\n```\n\n`mprotect` sets\
    \ or changes the protections for the region that begins at `addr` to the protection\
    \ level specified in `prot`. `prot` can be a bitwise OR of one or more of the\
    \ flags listed in Table 8.1. It returns 0 on success. If it fails, `mprotect`\
    \ returns −1 and sets `errno`.\n\n# Locking Mapped Memory\n\n*Memory locking*\
    \ means preventing a memory area from being swapped to disk. In a multitasking,\
    \ multiuser system such as Linux, areas of system memory (RAM) not in active use\
    \ may temporarily be written to disk (swapped out) so that memory can be put to\
    \ other uses. Locking the memory sets a flag that prevents it from being swapped\
    \ out. There are four functions for locking and unlocking memory: `mlock`, `mlockall`,\
    \ `munlock`, and `munlockall`. Their prototypes are listed here:\n\n```\n`int\
    \ mlock(const void *addr, size_t len);`  \n`int munlock(void *addr, size_t len);`\
    \  \n`int mlockall(int flags);`  \n`int munlockall(void);`\n```"
  merge: -1
  img_proc: true
- pgno: 210
  md: "The beginning of the memory region to be locked or unlocked is specified in\
    \ addr. len indicates how much of the region to lock or unlock. Values for flags\
    \ may be one or both of the following:\n\n+   - MCL_CURRENT requests that all\
    \ pages are locked before the call returns.\n\n+   - MCL_FUTURE requests that\
    \ all pages added to the process's address space should be locked.\n\nAs noted\
    \ in the discussion of mmap, only processes with root privilege may lock or unlock\
    \ memory regions.\n\n# Resizing a Mapped File\n\nYou will occasionally need to\
    \ resize a memory region. Use the mremap function to do so. It has the following\
    \ prototype:\n\n```\nvoid *mremap(void *old_addr, size_t old_len, size_t new_len,\n\
    \       unsigned long flags);\n```\n\nAn analogue of the realloc library call,\
    \ mremap resizes the memory region beginning at old_addr, originally with size\
    \ old_len, to new_len. flags indicates whether the region can be moved in memory\
    \ if necessary. MREMAP_MAYMOVE permits the address to change; if not specified,\
    \ the resize operation fails. mremap returns the address of the resized region\
    \ or NULL on failure.\n\n# Example\n\n![](img/be588b36b489136ce784030a08a1d3d4_210_0.png)\n\
    \n# Example\n\nThe program that follows, mmcat, implements the cat program using\
    \ memory maps. Although it is a naïve implementation, it clearly shows how to\
    \ perform file I/O using memory mapped files.\n\n```\n/*\n * mmcat.c cat(1) implemented\
    \ with memory maps\n */\n\n#include <sys/types.h>\n#include <sys/mman.h>\n#include\
    \ <sys/stat.h>\n#include <unistd.h>\n#include <fcntl.h>\n#include <stdlib.h>\n\
    #include <stdio.h>\n\nvoid err_quit(char *msg);\n```"
