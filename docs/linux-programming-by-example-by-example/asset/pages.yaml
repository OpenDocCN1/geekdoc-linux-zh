- pgno: 381
  md: "A third method involves using the f tok function, which takes a pathname and\
    \ a single char character, called a project identifier, and returns a key, which\
    \ is then passed to the appropriate get function. It is your responsibility to\
    \ ensure that the pathname and project identifier are known to all processes in\
    \ advance. You can achieve this using one of the methods mentioned earlier: including\
    \ the pathname and the project identifier in a common header file or storing them\
    \ in a predefined configuration file. Unfortunately, f tok has a serious defect:\
    \ It is not guaranteed to generate a unique key, which creates the same problems\
    \ as the second approach discussed earlier. Due to the potential problems with\
    \ using f tok, this chapter disregards it.\n\n> **CAUTION**\n> Bluntly stated,\
    \ Linux's f tok implementation is broken. It generates a non-unique key in the\
    \ following situations:\n> \n> - When two different symbolic links link to the\
    \ same file.\n> \n> - When the first 16 bits of the pathname's inode number have\
    \ the same value.\n> \n> - When a system has two disk devices with the same minor\
    \ number, which occurs in systems that have multiple disk controllers. The major\
    \ device number will be different, but the minor device number can be the same.\n\
    > \n> Given the weakness of Linux's f tok implementation, readers are strongly\
    \ encouraged to consider it anathema and ignore it.\n\nIn addition to specifying\
    \ a key, the get functions also accept a flags argument that controls get's behavior.\
    \ If the specified key is not already in use for the desired type of structure\
    \ and in the IPC_CREAT bit is set in flags, a new structure will be created.\n\
