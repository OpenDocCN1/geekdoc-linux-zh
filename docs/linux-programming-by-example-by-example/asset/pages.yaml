- pgno: 541
  md: 'screen. Figure 22.7 shows the screen''s appearance after `list` has updated
    the status line to indicate that the last record has been displayed.


    ![](img/be588b36b489136ce784030a08a1d3d4_541_0.png)


    Listing all the records in the CD database.


    `modui.c`''s `list` operation does a passable job of listing all the CDs in the
    database. If you want to enhance its functionality, modify it so that you can
    scroll back and forth in the list.


    # What''s Next?


    What''s next? Why, closing the book and becoming a famous Linux programmer, of
    course! Seriously, you have covered a great deal of material in this book and
    have a solid foundation for further programming. What remains is simply to write
    lots of programs that use what you have learned. There is really no other way
    to become a proficient Linux hacker except by practice. Although a book can show
    you the basic principles and idioms, experience is the best teacher. Go forth
    and code!'
