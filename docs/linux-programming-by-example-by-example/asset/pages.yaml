    \ DB_DBT_MALLOC);\n\tmemcpy (keys[ cnt], key.data, key.size);\n\tmemcpy (values[\
    \ cnt], value.data, value.size);\n\t++cnt;\n}\nreturn cnt;\n```\n\nThis code defines\
    \ the database interface declared in mccl db.h. In general, all the functions\
    \ return zero on success, a positive integer if some sort of system error occurs,\
    \ or a negative integer (usually -1) if some other (nonsystem) error occurs. Exceptions\
    \ to this rule will be noted.\n\nopen_db opens the database specified in dbpath.\
    \ If dbpath is NULL, a default database named mcd_db is opened in the current\
    \ working directory. The DB_CREATE flag causes the database to be created if it\
    \ does not already exist. The database is not set up to handle duplicate keys,\
    \ either.\n\nclose_db closes the database. As the comment states, the db->close\
    \ call should force the database to flush any data to disk, but to be safe close_db\
    \ explicitly calls db->sync just in case. In fact, as a precautionary measure,\
    \ the two functions that actually change data in the database, add_rec and del_rec,\
    \ also call db->sync.\n\nThe add_rec function uses the DB_NOOVERWRITE flag to\
    \ prevent overwriting an existing key/value pair. As a result, to modify an existing\
    \ record in the database, you would first have to delete the record, and then\
    \ add it again after making any necessary modifications. A function that updates\
    \ an existing record would make an excellent addition to the database interface.\n\
    \nDespite their apparent similarity, find_rec and get_rec are very different.\
    \ get_rec searches for a record that has a specific key. find_rec, on the other\
    \ hand, is a query function. It searches the entire database to see if a given\
    \ key exists. That is, where get_rec assumes that the key exists and simply retrieves\
    \ the corresponding value, find_rec asks if the key exists and returns the corresponding\
    \ value. find_rec must do extra work after a possible match is found.\n\nThe strncmp\
    \ function works only on null-terminated strings, but the values stored in the\
    \ database are not null-terminated. As a result, find_rec uses strncmp to limit\
    \ the characters compared. After a possible match is found, the next step is to\
    \ compare the search string’s length to the length of the data in the database,\
    \ which is stored in the size member of the DBT."
