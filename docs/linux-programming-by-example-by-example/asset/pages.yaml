    # Features of the ext2 Filesystem


    The ext2 filesystem enables you to set up to four special attributes on files:


    +   * ``Immutable``—``EXT2_IMMUTABLE_FL``


    +   * ``Append-only``—``EXT2_APPEND_FL``


    +   * ``No-dump``—``EXT2_NODUMP_FL``


    +   * ``Sync``—``EXT2_SYNC_FL``


    Only the root user can set or remove the immutable and append-only flags, but
    a file''s owner may set or clear the no-dump and sync flags. What do these flags
    mean? The following list describes them in detail:


    +   * *Immutable* files cannot be modified at all: You can add data to them, remove
    or rename them, or add links to them. Not even the superuser can do these things—the
    immutable flag must first be cleared.


    +   * *Append-only* files can be written only in append mode and cannot otherwise
    be removed, renamed, or linked.


    +   * The *no-dump* attribute causes the ``dump`` command, commonly used for creating
    backups, to ignore a file.


    +   * The *sync* attribute causes the file to be written synchronously; that is,
    all *writes* to the file must complete before returning to the calling process
    (this is identical to calling ``open`` with the ``O_SYNC`` option).


    Why use these attributes? Making a file immutable prevents it from being accidentally
    (or deliberately) deleted or modified, so it is a handy security measure for critical
    files. The append-only flag preserves a file''s current contents while still allowing
    you to add data to it—again, a handy security precaution.


    The no-dump flag is simply a convenience that will save you valuable space and
    time when you back up a system. The sync flag, finally, is especially handy for
    guaranteeing that critical files, such as databases, actually get written when
    requested. Using the sync option prevents data loss if a system goes down before
    cached data is physically written to disk. The downside of the sync flag, however,
    is that it can significantly slow down a program''s performance.


    To get or set these attributes, use the ``ioctl`` call, declared in ``<sys/ioctl.h>``.
    Its prototype is as follows:


    ```

    ```

    int ioctl(int fd, int request, void *arg);

    ```

    ```'
