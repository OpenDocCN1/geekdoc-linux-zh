    # **Example**


    The following example, *mplex*, watches two named pipes for data that is ready
    to read (the sample program uses pipes because they are the simplest way to demonstrate
    multiplexed I/O in a short program).


    > **NOTE**

    > Adapted from *m*px-*select*. c, first published in *Linux Application Development*,
    Michael K. Johnson and Erik W. Troan (Addison Wesley, 1998), pp. 213–214.


    *   Named pipes are explained in detail in "Understanding FIFOs," page 330.


    Perhaps the easiest way to use *mplex* is to build it using the makefile provided
    on this book’s Web site, which includes rules for making the pipes. Otherwise,
    first build the program, and then create two named pipes (in the same directory
    as the *mplex* binary) using the following commands:


    ```

    $ mknod pipe1 p

    $ mknod pipe2 p

    ```


    Next, start *mplex*. Open two other terminal windows. In the first one, type `cat
    > pipe1`, and in the second, type `cat > pipe2`. Anything you type after that
    in either window will be queued for *mplex* to read. The code follows:'
