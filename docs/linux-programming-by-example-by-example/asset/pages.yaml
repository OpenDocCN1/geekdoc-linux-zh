- pgno: 451
  md: 'want to manipulate, RCS assumes you want to work with the most recent revision;
    `-r` overrides this default. The `-f` option forces RCS to overwrite the current
    working file. By default, RCS aborts a check-out operation if a working file of
    the same name already exists in your working directory. So, if you really botch
    up your working file, use the `-f` option with `co` to get a fresh start.


    RCS’s command-line options are cumulative, as you might expect, and it does a
    good job of disallowing incompatible options. To check out and lock a specific
    revision of `howdy.c`, you would use a command like `co -l r2.1 howdy.c`. Similarly,
    `ci -u -r3 howdy.c` checks in `howdy.c`, assigns it the revision number 3.1, and
    deposits a read-only revision 3.1 working file back into your current working
    directory.


    # Examples


    ![](img/be588b36b489136ce784030a08a1d3d4_451_0.png)


    # Example


    1. This example creates revision 2.1 of `howdy.c`. Make sure you have checked
    out and changed `howdy.c` somehow before executing this command.


    ```

    ```

    $ ci -r2 howdy.c

    ```

    ```


    ![](img/be588b36b489136ce784030a08a1d3d4_451_1.png)


    # Output


    ```

    ```

    RCS/howdy.c,v <-- howdy.c

    new revision: 2.1;  previous revision: 1.2

    enter log message, terminated with single ''.'', or end of file

    >> Added something

    >> .

    done

    ```

    ```


    This command is equivalent to `ci -r2.1 howdy.c`.


    ![](img/be588b36b489136ce784030a08a1d3d4_451_2.png)


    # Example


    2. This command checks out revision 1.2 of `howdy.c` and disregards the presence
    of higher-numbered revisions in the working directory.


    ```

    ```

    $ co -r1.2 howdy.c

    ```

    ```


    ![](img/be588b36b489136ce784030a08a1d3d4_451_3.png)


    # Output'
