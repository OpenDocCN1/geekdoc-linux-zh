    # *Options and Arguments*


    ![](img/be588b36b489136ce784030a08a1d3d4_44_0.png)


    # Example


    The list of command-line options that *gcc* accepts runs to several pages, so
    Table 1.2 lists only the most common ones.


    *Table 1.2 gcc Command-Line Options*


    | Option | Purpose |

    | :--- | :--- |

    | `-o file` | Name the output file *file* (not necessary when compiling object
    code). If the file is not specified, the default is a.out. |

    | `-c` | Compile without linking. |

    | `-Dfoo=bar` | Define a preprocessor macro *foo* with a value of *bar* on the
    command line. |

    | `-Idirname` | Place the directory specified in *dirname* at the beginning of
    the list of directories *gcc* searches for include files. |

    | `-ldirname` | Place the directory specified in *dirname* at the beginning of
    the list of directories *gcc* searches for library files. By default, *gcc* links
    against shared libraries. |

    | `-static` | Link against static libraries. |

    | `-lfoo` | Link against the *foo* library. |

    | `-g` | Include standard debugging information in the binary. |

    | `-ggdb` | Include lots of debugging information in the binary that only the
    GNU debugger, *gdb*, can understand. |

    | `-O` | Optimize the compiled code. This is equivalent to specifying `-O1`. |

    | `-On` | Specify an optimization level *n*, 0<=*n*<=3. |

    | `-ansi` | Places the compiler in ANSI/ISO C mode, disallowing GNU extensions
    that conflict with the standard. |

    | `-pedantic` | Display all of the warnings the ANSI/ISO C standard requires.
    |

    | `-pedantic-errors` | Display all of the errors the ANSI/ISO C standard requires.
    |

    | `-traditional` | Enable support for the Kernighan and Ritchie C syntax (if you
    don''t understand what this means, don''t worry about it). |

    | `-W` | Suppress all warning messages. |

    | `-Wall` | Display all of the generally applicable warnings that *gcc* can provide.
    To see specific warnings, use `-Wwarning`.


    *(table continued on next page)*'
