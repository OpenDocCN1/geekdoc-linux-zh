    #include <fcntl.h>\n\nint main(void)\n{\n    time_t now = 1000000000;\n    struct\
    \ utimbuf buf;\n    int fd;\n\n    buf.actime = now;\n    buf.modtime = now;\n\
    \n    fd = open(\"foo.bar\", O_CREAT, 0644);\n    utime(\"foo.bar\", &buf);\n\
