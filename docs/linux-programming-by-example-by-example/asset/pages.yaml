    \ process immediately; functions that have been registered with `atexit` do not\
    \ execute.\n\n# ## Using `abort`\n\nUse the `abort` function if you need to terminate\
    \ a program abnormally. Under Linux, `abort` has the additional side effect of\
    \ causing a program to dump core, which most debuggers use to analyze the state\
    \ of a program when it crashed. Although any open files are closed, `abort` is\
    \ a harsh call and should be called only as a last resort, such as when you encounter\
    \ an error that you cannot deal with programmatically, like a severe memory shortage.\
    \ `abort` is also a standard library function (declared in `<stdlib. h>`). Its\
    \ prototype is\n\n```\n```c\nvoid abort(void);\n```\n```\n\n![](img/be588b36b489136ce784030a08a1d3d4_119_0.png)\n\
    \n# ### Example\n\nThe following program shows how the `abort` function behaves:\n\
    \n```\n```c\n/*\n * abort.c - Demonstrate the abort system call\n */\n#include\
    \ <stdlib.h>\n#include <stdio.h>\n\nint main(void)\n{\n    abort();\n\n    /*\
    \ Shouldn't get here */\n    exit(EXIT_SUCCESS);\n}\n```\n```\n\n![](img/be588b36b489136ce784030a08a1d3d4_119_1.png)\n\
    \n# ### Output\n\n```\n```\n$ ./abort\nAborted\n$ ulimit -c unlimited\n$ ./abort\n\
    Aborted (core dumped)\n```\n```\n\nNote that your system might not generate a\
