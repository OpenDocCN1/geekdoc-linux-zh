    The listing is abbreviated due to the amount of output.


    If everything works correctly, you wind up with a binary package, `/usr/src/redhat/RPMS/i386/xearth-1.0-12.i386.rpm`,
    and a new source source rpm, `/usr/src/redhat/RPMS/i386/xearth-1.0-12.src.rpm`.
    At this point, arrange to copy the binary package to a new machine, install it,
    and test it.'
