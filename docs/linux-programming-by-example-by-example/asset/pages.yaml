- pgno: 226
  md: "lpedated uses the open and write system calls to remind you that Linux provides\
    \ alternatives to the standard library's fopen and fwrite stream I/O functions.\
    \ Remember, you must run this program as root because normal users do not have\
    \ write access to the /var/log directory. If you try to run it as a non-root user,\
    \ nothing will happen, period. The daemon will simply terminate after it fails\
    \ to open its log file. After a few minutes, the log file maintained by the daemon,\
    \ /var/log/lpedated.log, should resemble the following:\n\n![](img/be588b36b489136ce784030a08a1d3d4_226_0.png)\n\
    \n# Output\n\n```\n$ su -c \"tail -5 /var/log/lpedated.log\"\nWed Jul 28 01:35:41\
    \ 1999\nWed Jul 28 01:36:41 1999\nWed Jul 28 01:37:41 1999\nWed Jul 28 01:38:41\
    \ 1999\nWed Jul 28 01:39:41 1999\n```\n\nNote that lpedated stops writing error\
    \ messages to stderr after calling setsid. The child no longer has a controlling\
    \ terminal, so the output would have nowhere to go. The infinite while loop does\
    \ the work of the program: Open the log file, output the timestamp, close the\
    \ log file, and then sleep for 60 seconds. To kill the program, become the root\
    \ user, obtain lpedated's PID, and issue kill <PID of lpedated>.\n\n# Handling\
    \ Errors\n\nAfter a daemon calls setsid, it no longer has a controlling terminal,\
    \ so it has nowhere to send output that would normally go to stdout or stderr\
    \ (such as error messages). Fortunately, the standard utility for this purpose\
    \ is the BSD-derived syslog service, provided by the system logging daemon, syslogd.\n\
    \nThe relevant interface is defined in <syslog.h>. The API is simple. openlog\
    \ opens the log; syslog writes a message to it; closelog closes the log. Their\
    \ prototypes are listed here:\n\n```\nvoid openlog(char *ident, int option, int\
    \ facility);\nvoid closelog(void);\nvoid syslog(int priority, char *format, .\
    \ . .);\n```\n\nopenlog initiates a connection to the system logger. ident is\
    \ a string added to each message, and typically is set to the name of the program.\
    \ The option argument is a logical OR of one or more of the values listed here:\n\
    \n+   - LOG_CONS—Write to the console if the system logger is unavailable.\n+\
    \   \n+   - LOG_NDELAY—Open the connection immediately. Normally, the connection\
    \ is not opened until the first message is sent."
  merge: -1
  img_proc: true
