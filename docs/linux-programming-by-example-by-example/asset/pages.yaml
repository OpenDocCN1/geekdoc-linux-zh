  md: 'Thus, the `optstring` in `mcddcli.c`, `"a:d:f:g:l"` means that the `-a`, `-d`,
    `-f`, and `-g` options must be followed by an argument, but `-l` does not have
    an argument. `getopt` iterates through each option present in the command line
    and returns the corresponding character (a, d, f, g, or l) or EOF if no more options
    exist. If an option requires an argument, the pointer `optarg` points to that
    argument.


    So, `mcddli.c` first validates the number of command-line arguments it receives,
    and then uses `getopt` to determine the operation to perform and the corresponding
    arguments, if any, for that operation. When the command line is validated, it
    opens the database, and then goes into a long `switch` statement that actually
    performs the requested operation.


    Each operation has its own code used to validate the number and value of the arguments
    on which it operates. If you are adding a record, for example, you need two arguments,
    a non-null, non-empty key, and the value to associate with that key. `del_rec`,
    on the other hand, needs only a key that is non-null. The same requirement also
    applies to `find_rec` and `get_rec`. Note that three of the cases—`f`, `g`, and
    `l`—use a variation of the following unusual `printf` statement:


    ```

    ```

    printf ("%. *s\n", (int)numeric_value, (char *)string_value);

    ```

    ```


    Again, this is necessary because, when printing strings, `printf` ordinarily expects
    null-terminated strings but Berkeley db does not store null-terminated strings.
    Moreover, the casts are necessary because the size member of a DBT structure is
    actually defined as `ulen32_t`, not as an `int`, while the type of the `data`
    member of a DBT structure is `void *`.


    The format specifier `%. *s` means that the next argument is to be printed as
    a string. `.` specifies that the string argument should be printed with a precision
    or field width of X characters. If X is numeric, the field width is X. In this
    case, however, the field width is `*`, meaning that an integral argument must
    be specified and that `printf` will write that many characters. For example, the
    line


    ```

    ```

    printf("%. *s\n", (int)strlen(str), str);

    ```

    ```


    prints the first `strlen(str)` characters from the string that `str` points to,
    while the statement


    ```

    ```

    printf ("%.5s\n", 5, str);

    ```

    ```


    prints the first five characters of `str`.


