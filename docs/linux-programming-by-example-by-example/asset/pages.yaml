  md: "# Example\n\n```\n/*\n * mp1ex.c - read input from pipe1 and pipe2 using select\n\
    \ *\n * Adapted from mpx-select.c, written\n * by Michael Johnson and Erik Troan.\
    \ Used with the permission of\n * the authors of _Linux Application Development,\n\
    \ * Michael Johnson and Erik Troan.\n#include <fcntl.h>\n#include <stdio.h>\n\
    #include <unistd.h>\n#include <stdlib.h>\n\n#define BUFSZ 80\n\nvoid err_quit(char\
    \ *msg);\n\nint main(void)\n{\n    int fds[2];\n    char buf[BUFSZ];\n    int\
    \ i, rc, maxfd;\n    fd_set watchset;              /* Read this set of file descriptors\
    \ */\n    fd_set inset;                 /* Copy of watchset for select to update\
    \ */\n\n    /* Open the pipes */\n    if((fds[0] = open(\"pipe1\", O_RDONLY |\
    \ O_NONBLOCK)) < 0)\n        err_quit(\"open pipe1\");\n    if((fds[1] = open(\"\
    pipe2\", O_RDONLY | O_NONBLOCK)) < 0)\n        err_quit(\"open pipe2\");\n\n \
    \   /* Initialize watchset with our file descriptors */\n    FD_ZERO(&watchset);\n\
    \    FD_SET(fds[0], &watchset);\n    FD_SET(fds[1], &watchset);\n    /* select\
    \ needs to know the maximum file descriptor */\n    maxfd = fds[0] > fds[1] ?\
    \ fds[0] : fds[1];\n```"
