    # # The File-Handling Interface


    Most file-handling options come in two forms: one that works with filenames and
    one that works with file descriptors. *File descriptors* are small, positive integers
    that act as indices into an array of open files that the kernel maintains for
    each process. For example, the `stat` and `fstat` functions return information
    about a file. They are prototyped as follows in `<unistd.h>` :


    ```

    int stat(const char *filename, struct stat *buf);

    int fstat(int fildes, struct stat *buf);

    ```


    As you can see, `stat` expects a filename to be passed in `filename`, whereas
    `fstat` expects a file descriptor to be passed in `fildes`.


    Each process is always given three open files: standard input, standard output,
    and standard error. These correspond to file descriptors 0, 1, and 2, respectively.
    However, three macros, defined in `<unistd.h>`, should be used instead: `STDIN_FILENO`,
    `STDOUT_FILENO`, and `STDERR_FILENO`. You are advised to use these macros rather
    than hard-coding 0, 1, or 2 because your program can get compiled on a system
    on which standard input, standard output, and standard error do not correspond
    to the integers 0, 1, and 2.'
