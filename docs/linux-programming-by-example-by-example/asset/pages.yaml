- pgno: 252
  md: '# ## Terminology and Concepts


    This section explains some terms and concepts that come up repeatedly when discussing
    ncurses.


    # ### *Terms*


    A *screen* refers to the physical terminal screen in character or console mode.
    Under the X Window system, screen means a terminal emulator window. *Window* is
    used to refer to an independent rectangular area displayed on a screen. It may
    or may not be the same size as the screen.


    ncurses programming relies on two pointers to data structures called WINDOWS (that
    is, `struct WINDOW *s`), `stdscr` and `curscr`, `stdscr` represents what you currently
    see on the screen. It might be one window or a set of windows, but it fills the
    entire screen. Think of it as a palette on which you paint using ncurses routines,
    `curscr` contains ncurses’ idea of what the screen currently looks like. Like
    `stdscr`, its *size* is the width and height of the screen. Differences between
    `curscr` and `stdscr` are the changes that appear on the screen.


    *Refresh* refers both to an ncurses function call and a logical process. The *refresh*
    function compares `curscr`, ncurses’ notion of what the screen currently looks
    like, to `stdscr`, copies any differences between `stdscr` and `curscr` to cursor,
    and then displays those updates to the screen. Refresh also refers to the process
    of updating the screen.


    *Cursor*, like refresh, has two similar meanings, but always refers to the location
    where the next character will be displayed. On a screen (the physical screen),
    cursor refers to the location of the physical cursor. On a window (an ncurses
    window), cursor refers to the logical location where the next character will be
    displayed. In this chapter, the second meaning generally applies, ncurses uses
    a $\left(\mathrm{x}, \mathrm{y}\right)$ ordered pair to locate the cursor on a
    window.


    # ### *Window Layout*


    ncurses defines window layout sanely and predictably. Windows are arranged such
    that the upper-left corner has the coordinates $(0,0)$ and the lower-right corner
    has the coordinates (LINES-1, COLUMNS-1), as Figure 11.1.1 illustrates.


    ncurses maintains two global variables, LINES and COLS, that contain ncurses’
    idea of the number of rows and columns, respectively, of the current window’s
    size. Rather than using these global variables, however, use the function call
    `getmaxyx` to get the size of the window with which you are currently working.'
  merge: -1
  img_proc: true
