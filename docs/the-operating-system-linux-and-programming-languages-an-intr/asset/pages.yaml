- pgno: 7
  md: '# 3 File systems


    # Logics, file types


    > "In UNIX everything is a file."


    The following *file-system objects* can be found


    +   - ‘normal’ (text-) files

    +   - executable files (binary files or *shell scripts*)

    +   - directories

    +   - device files

    +   - *pipes*

    +   - symbolic or hard *links* (references to files)


    All files and file system objects are ordered within a hierarchical *file tree*
    with exactly one *root directory* ‘/’.


    In contrast to the MS-Windows file system, the UNIX file system does not distinguish
    between different drives. All physical devices (hard disks, DVD, CDROM, USB, floppy)
    are denoted by specific files inside a certain directory within the file tree
    (usually within /dev).


    File names consist of a sequence of letters, digits and certain special characters,
    and must not contain *slashes* (for convenience, they should neither contain empty
    spaces).


    Avoid characters which might be interpreted by the *shell* in a special way.


    A file can be referenced within the file tree by either an *absolute* or a *relative
    path name*. An absolute path name consists of all directories leading to the file
    and the file name, and always begins with a / (the root directory).


    In many shells and application programs, the tilde denotes the home directory.


    # command `pwd`


    # Syntax:


    ```

    pwd

    ```


    displays the current directory.


    # Example:


    ```

    wegner@arber:~ > pwd

    /home/wegner

    wegner@arber:~ >

    ```


    # Exercise:


    *Display the current directory!*'
  merge: -1
