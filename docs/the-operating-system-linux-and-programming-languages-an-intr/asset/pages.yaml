- pgno: 12
  md: '# command rm


    # Syntax:


    ```

    rm [-irf] file(s)/directory(ies)

    ```


    Delete files and/or directories. After deleting, the deleted files cannot be recovered!
    Use rm only with greatest caution. E.g., the command rm -r * deletes recursively
    (in most cases without further inquiry) the complete file tree below the current
    directory (leaving the hidden files/directories beginning with . though).


    # Options:


    +   -i delete only after confirmation


    +   -r directories will be recursively deleted (with all sub-directories)


    +   -f force: suppress all safety inquiries.


    Note: Varying from system to system, rm without the option -f might need a confirmation
    or not (the latter is the standard).


    # Example:


    ```

    wegner@arber:~/numerik > ls

    hello.cpp  hello3.cpp

    wegner@arber:~/numerik > rm -i hello3.cpp

    rm: remove ‘hello3.cpp’? y

    wegner@arber:~/numerik > ls

    hello.cpp

    wegner@arber:~/numerik >

    ```


    # File permissions/Access rights


    The UNIX file system distinguishes between three different access rights or file
    mode bits. (Note: actually, there are more access rights, but these are of interest
    only for administrators.)


    r read: permits the reading of file contents, or, for directories, the listing
    of their content.


    w write: permits the modification of files (incl. delete). To create or delete
    files, the parent directory(ies) need write access as well!


    x execute: permits the execution of binary files (commands, programs) and of shell
    scripts from the command line. For directories, the x bit is required to change
    into this directory and to access the files/directories inside.


    Access rights are individually defined for


    +   u the owner of the object


    +   g the group to which the object belongs


    +   o all other users


    +   a all users (i.e., u + g + o)


    The access rights of a file can be changed by means of the command chmod.'
  merge: -1
  img_proc: true
