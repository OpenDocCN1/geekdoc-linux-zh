    \ rights for the file `linux.txt`! How can this be undone?\n\n# 4 Editing and\
    \ printing text files\n\nTo modify (= edit) the content of a text file, an editor\
    \ is needed. Within UNIX there is a variety of editors, which can be distinguished\
