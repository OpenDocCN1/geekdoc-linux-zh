    +     http://www.ee.surrey.ac.uk/Teaching/Unix


    # 2 First steps at the computer


    # User, logon, logoff


    Since UNIX is a *multi-user* operating system, it can deal with several users
    simultaneously. Each user needs a *user account*.


    Each user has a personal environment (*home directory, shell*), which can be accessed
    only by her/himself (and by the system administrator and those people who know
    the password – legitimate or by hacking).


    Inside the system the user is identified by his *user ID (UID)* and his group
    identity (*group ID, GID*).


    There are two user types:


    +   - ''normal'' users with *restricted* rights and the

    +   - system administrator (*root*) with all privileges. The latter is responsible
    for the installation, configuration and maintenance of the system as well as the
    user administration.


    Each user has to logon and to logoff from the system (*login/logout*). Each user
    account is protected by a *password*.


    # Exercise:


    *Login to the system with your user account!*'
