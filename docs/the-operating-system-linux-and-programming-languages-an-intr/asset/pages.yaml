  md: "command `chmod`\n\n# Syntax:\n\n```\nchmod [ugoa][+-=][rwx] file(s)/directory(ies)\n\
    ```\n\nChange the access rights of files or directories. These rights are displayed\
    \ by `ls -l` according to the pattern\n\n```\nuuugggooo\nrwxrwxrwx\n```\n\n# Example:\n\
    \n```\nwegner@arber:~/numerik > ls -l\ntotal 4\n-rw-r--r-- 1 wegner stud 100 Oct\
    \ 20 15:02 hello.cpp\nwegner@arber:~/numerik > chmod go+w hello.cpp\nwegner@arber:~/numerik\
