- pgno: 17
  md: 'locate search expression. Lists all files and directories in the local database,
    which correspond to the search expression. Extremely well suited to search for
    files (if the database is frequently updated → system administrator)


    find searches recursively for files corresponding to search expression within
    the given path.

    Example: find . -name ''*.txt'' searches recursively for all *.txt files, starting
    within the current directory.


    grep searches for text within given files.

    Example: grep ''test'' ../*.f90 searches for the text test in all *.f90 files
    in the parent directory.

    The most important option is [-i], which forces grep to ignore any distinction
    between upper and lower case.


    # 5 UNIX shells


    The shell is a service program through which the user communicates with the OS
    and which is responsible for the interpretation of the input commands.


    # Different UNIX shells


    Since the shell does not directly belong to the OS, a number of different shells
    have been developed in the course of time:


    +   - Bourne shell (sh). A well-known and widespread shell, named after its inventor
    Steven Bourne. An advanced derivate, the bash, Bourne again shell (note the pun)
    is most popular under Linux.

    +   - C-Shell (csh). Developed in Berkeley, and uses a more C-like syntax. An
    improved version of the C-shell is the tcsh.

    +   - Bash shell (bash). Advanced Bourne shell and standard on many systems.


    Each shell contains a set of system variables, which can be augmented by user-defined
    variables. This set comprises the process environment for the programs running
    inside the shell.


    Moreover, the shell can be used to run (system-) programs via shell scripts.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Shell scripts


    *Shell scripts* are small programs consisting of UNIX commands and shell-specific
    program constructs (branches, loops etc), which behave like UNIX commands but
    are present in text form (instead of binary). These scripts are *interpreted*
    by the shell.


    The syntax of shell scripts differs (considerably) from shell to shell.


    Some shell scripts are *automatically* called under certain conditions:


    +   - `.profile` and/or `.login` are executed, if present, at login (i.e., for
    the *login shell*), and only once.


    +   - `.bashrc` and `.cshrc` / `.tcshrc` are called whenever a new bash or csh/tcsh
    is opened, respectively.


    # Exercise:


    +   1. *Copy the file .tcshrc to your home directory and inspect the file!*


    +   2. *Open a (new) tcsh by typing tcsh on the command line! What happens? Exit
    the tcsh with exit!*


    # Re-directing input and output


    All UNIX commands use *input and output channels* to read data and to output data.
    Usually, these are the keyboard and the screen assigned to the specific user,
    respectively.


    These standard channels can be redirected within the shell such that a command
    can either read directly from a file (instead from the keyboard) and/or write
    into a file (instead of the screen). For re-direction, use the characters `>`
    (for output) and `<` (for input)


    With `>>`, the output will be *appended* to an existing file. If the file does
    not exist, this command behaves as `>`.


    # Example:


    ```

    wegner@arber:~ > ls

    hello.cpp  linux.txt  numerik/

    hello.f90  nsmail/

    wegner@arber:~ > cat linux.txt > linux2.txt

    wegner@arber:~ > ls

    hello.cpp  linux.txt  nsmail/

    hello.f90  linux2.txt  numerik/

    ```'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Pipes


    Furthermore, many UNIX commands act as so-called filters: They read from the standard
    input and write to the standard output. Thus, they can be combined via so-called
    pipes such that the output of one command acts as the input of another:


    ![](img/7620eb00c0475a5b7427437d851a4cd6_19_0.png)


    Pipes are constructed on the command line by using the ''|'' character between
    commands.


    A re-direction to a file with ''>'' or ''>>'' can be present only at the end of
    such a chain.


    # Example:


    ```

    wegner@arber:~ > man g++ | a2ps -P printer

    [Total: 151 pages on 76 sheets]

    wegner@arber:~ >

    ```


    With this pipe, the man pages for g++ are formatted and printed via one command.


    # 6 Process administration


    A process is a running program or script and consists of


    +   - the program/script itself and

    +   - the corresponding environment, which consists of all required additional
    information necessary to ensure a correct program flow.


    Characteristics of a process are (among others)


    +   - a unique process ID (PID),

    +   - PID of the parent process (PPID),

    +   - User and group number of the owner and

    +   - priority of the process.


    Normally, when a process has been started from a shell, the shell cannot be used
    for other input until the end of the process. But processes and programs can also
    be run in the background. To enable this feature, the command line which calls
    the process/program must end with an ampersand, ''&''.


    # Example:


    ```

    wegner@arber:~ > firefox &

    [1] 21749

    wegner@arber:~ >

    ```


    # Exercise:


    Start the program xeyes in the background!'
