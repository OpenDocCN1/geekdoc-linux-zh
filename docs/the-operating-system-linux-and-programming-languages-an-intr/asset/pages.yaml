  md: "# command `ps`\n\n# Syntax:\n\n```\nps [-al] [-u user]\n```\n\nDisplay running\
    \ processes with their characteristics. Without options, only the user's own processes\
    \ running in the current shell are displayed.\n\nImportant options:\n\n+   - `-a`\
    \ display all processes assigned to any terminal (tty)\n+   - `-l` long format\
    \ display. Additional information about owner, parent process etc.\n+   - `-u`\
