- pgno: 4
  md: '# command `man`


    # Syntax:


    ```

    man command

    man -k expression

    ```


    displays the manual pages ("man pages") for the provided command. man -k searches
    for man pages containing the expression in the NAME section. A man page usually
    consists of the following sections


    +   - NAME command and purpose

    +   - SYNOPSIS syntax of command

    +   - DESCRIPTION of command effect

    +   - FILES which are modified and/or needed

    +   - OPTIONS if present

    +   - EXAMPLE(S) for application (rarely)

    +   - BUGS errors, if known

    +   - SEE ALSO other commands in the same context


    # Exercise:


    *Display information about the command xterm!*


    # command `passwd`


    # Syntax:


    ```

    passwd

    ```


    sets a new password.


    Passwords should be constructed from a combination of letters, digits and special
    characters, and should not appear in any dictionary or similar list. Otherwise,
    the password can be hacked by systematic search algorithms.


    The command to set/change the password and the required conventions (length, number
    of digits/letters/special characters) can vary from system to system. The following
    example is a common one, e.g., valid for the workstations at the CIP Pool (but
    not for the workstations of the USM).


    # Example:


    ```

    wegner@arber:~ > passwd

    Changing password for wegner

    Old password: myoldpasswd

    Enter the new password

    (minimum of 5, maximum of 8 characters)

    Please use a combination

    of upper and lower case letters and numbers.

    New password: mynewpasswd

    Re-enter new password: mynewpasswd

    Password changed.

    ```'
  merge: -1
