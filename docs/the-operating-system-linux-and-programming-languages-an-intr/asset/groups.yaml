  - '[PAGE 1]


    # 1 General remarks on the operating system UNIX/Linux


    # Classification of UNIX/Linux


    UNIX is a *Multi-User/Multi-Tasking* operating system and exists in many different
    versions (“derivatives”): Solaris, AIX, XENIX, HP-UX, SINIX, **Linux**.


    ![](img/7620eb00c0475a5b7427437d851a4cd6_1_0.png)


    **Operating system (OS):** Sum of all programs which are *required* to operate
    a computer and which control and monitor the application programs.


    # Essential features


    # UNIX


    +   - has been originally written in the programming language C, and is therefore
    a classical platform for C-programs. UNIX contains well suited environments for
    program development (C, C++, Java, Fortran, ...).

    +   - is mainly used for scientific-technical applications on mainframes and workstations,
    but has become, because of **Linux**, also popular for classical PC-applications
    throughout the last years.

    +   - is perfectly suited for application in networks. Larger systems and networks
    require an administrator.

    +   - offers various alternatives for the solution of most tasks. The multitude
    of commands (more than in any other OS) are brief and flexible.

    +   - is originally command-line oriented, but can be used via a graphical user
    interface (*X Window system*).


    **Linux** is available (also via internet) in different *distributions* (S.u.S.E.,
    Fedora, Debian etc.). Meanwhile there is a variety of *direct-start (live) systems*,
    which can be started, without installation, directly from CD or other bootable
    storage devices (Knoppix, Ubuntu, ...). There are also interesting “mini versions”
    (<100 MB) designed for a start from USB-sticks (e.g., Puppy). The source code
    of Linux is free.'
  - '[PAGE 2]


    # Literature


    +   - **Peek, J., et al.:** *Unix Power Tools.*

    +     O''Reilly Media 2002 (3rd edition).

    +   - **Gilly, D., et al.:** *UNIX in a Nutshell.*

    +     O''Reilly, Köln. 1998 (1st edition).

    +   - **Wielsch, M.:** *Das große Buch zu UNIX.*

    +     Data Becker, Düsseldorf. 1994 (1st edition).

    +   - and numerous other text books

    +   - **online-tutorial**

    +     http://www.ee.surrey.ac.uk/Teaching/Unix


    # 2 First steps at the computer


    # User, logon, logoff


    Since UNIX is a *multi-user* operating system, it can deal with several users
    simultaneously. Each user needs a *user account*.


    Each user has a personal environment (*home directory, shell*), which can be accessed
    only by her/himself (and by the system administrator and those people who know
    the password – legitimate or by hacking).


    Inside the system the user is identified by his *user ID (UID)* and his group
    identity (*group ID, GID*).


    There are two user types:


    +   - ''normal'' users with *restricted* rights and the

    +   - system administrator (*root*) with all privileges. The latter is responsible
    for the installation, configuration and maintenance of the system as well as the
    user administration.


    Each user has to logon and to logoff from the system (*login/logout*). Each user
    account is protected by a *password*.


    # Exercise:


    *Login to the system with your user account!*'
  - '[PAGE 3]


    # Graphical user interface


    Originally, UNIX is command-line oriented. The X Window System enables convenient
    interaction via a window-oriented graphical interface, similar to other OS.


    The *window manager* is responsible for the management and display of the individual
    windows. Each window manager (and there are a variety of such managers) can be
    distinguished by its own *Look and Feel* (appearance of window decorations and
    control devices etc.). Most window managers can be choosen at the login-menu.


    Examples for simple window managers:


    +   - `twm`: very simple and resource-saving

    +   - `mwm`: Motif window manager, more common and more advanced

    +   - `xfce`: convenient, simple, and resource-saving (recommended for use in
    virtual machines)


    Moreover, almost all Linux distributions provide graphical *desktop environments*
    such as **KDE** or GNOME, which have a functionality far beyond simple window
    managers.


    command `xterm`


    # Syntax:


    ```

    xterm [options]

    ```


    Though there is a graphical interface, UNIX needs the possibility for direct command
    input for practical use. Therefore, at least one terminal window needs to be open.
    This can be accomplished via the window manager or the desktop environment (‘console’)


    More windows can then be opened with the command `xterm`.


    Generally, all UNIX commands have a variety of options, which usually begin with
    `-`. For the commands which will be introduced in the following, we will provide
    only the most important ones.


    # Example:


    ```

    wegner@arber:~ > xterm -geo 80x40 -fn 10x20

    ```


    The command xterm is called with two options -geo, -fn, which, in this case, need
    additional arguments (width and height of window, font name & size).


    # Exercise:


    +   1. Open a terminal window (“terminal program”) via KDE.

    +   2. From there, start another xterm!'
