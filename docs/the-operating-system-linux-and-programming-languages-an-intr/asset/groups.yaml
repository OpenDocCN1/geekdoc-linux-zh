  - "[PAGE 24]\n\n# Important features\n\n+   - Fortran was *and is* the most used\
    \ language for solving physical problems, particularly numerical simulations.\n\
    +   - The introduction of F90/95 allowed for similar features as in C/C++, except\
    \ for the hardware-orientation. With Fortran 2003, even object-oriented programming\
    \ became possible.\n+   - The capabilities of F90 are rather large and there are\
    \ numerous *standard* operations and functions. E.g., vector- and matrix-operations\
    \ belong to the standard:\n+   \n+     $$a = b + c$$\n+   \n+     can mean scalar,\
    \ vector or matrix addition, depending on the definition of $a,b,c$. Vector- and\
    \ matrix products can be calculated by likewise simple instructions (*fast execution*),\n\
    +   \n+     $$a = \\text{dot\\_product}(b,c);\\qquad a = \\text{matmul}(b,c).$$\n\
    +   - There are comprehensive program libraries, particularly for Linear Algebra\
    \ and eigenvalue-problems (available both as source codes or highly optimized\
    \ binary objects), e.g., `BLAS`, `LAPACK`, `EISPACK`.\n+   - Optimized programs\
    \ (more-D, parallel) execute mostly faster than corresponding C++ programs (factor\
    \ 2 to 3).\n\n+   - *Simple* possibility for parallelization via HPF (high performance\
    \ Fortran).\n+   - The basic structures are very simple, and the language can\
    \ be learned more easily than C++ (at least regarding the basic concepts).\n+\
    \   - Until the next couple of years, Fortran needs to be known by any physicist\
    \ who is not solely interested in purely experimental/observational or purely\
    \ theoretical work.\n+   \n+     Examples for physical research areas which use\
    \ (almost) exclusively Fortran: Aero-/hydro-dynamics, computational astrophysics,\
    \ atomic and nuclear physics, geophysics, meteorology.\n+   - Programming in Fortran\
    \ is fast!"
