    and must not contain *slashes* (for convenience, they should neither contain empty
    spaces).


    Avoid characters which might be interpreted by the *shell* in a special way.


    A file can be referenced within the file tree by either an *absolute* or a *relative
    path name*. An absolute path name consists of all directories leading to the file
    and the file name, and always begins with a / (the root directory).


    In many shells and application programs, the tilde denotes the home directory.


    ## command `pwd`


    ### Syntax:


    ```

    pwd

    ```


    displays the current directory.


    ### Example:


    ```

    wegner@arber:~ > pwd

    /home/wegner

    wegner@arber:~ >

    ```


    ### Exercise:


    *Display the current directory!*


    ## command cd


    ### Syntax:


    ```

    cd [directory]

    ```


    Changes into the given directory, or into the home directory when no parameter
    is provided.


    As in MS-DOS/Windows, ".." denotes the parent and "." the current directory.


    ### Example:


    ```

    wegner@arber:~ > cd /home/puls

    wegner@arber:/home/puls > pwd

    /home/puls

    wegner@arber:/home/puls > cd ..

    wegner@arber:/home > pwd

    /home

    wegner@arber:/home > cd

    wegner@arber:~ > pwd

    /home/wegner

    wegner@arber:~ >

    ```


    ### Exercise:


    *Change to the directory /usr/share/templates and back to your home directory!
    (-> file name completion with TAB)*


    *Check for successful change with pwd!*


    ## Search pattern for file names


    In principle, the *shell* is a specific program which deals with the interpretation
    of input commands. If these commands have parameters which are file names, several
    files can be addressed simultaneously by means of a search pattern, which is *expanded*
    by the shell. In any case, the file name expansion is performed *prior* to the
    execution of the command.


    | expression | meaning |

    |---|---|

    | * | ''almost'' arbitrary (incl. empty) string of characters |

    | ? | a single ''almost'' arbitrary character |

    | [...] | a range of characters |

    | [!...] | a negated range of characters |


    ''almost'' arbitrary: leading dot (e.g., hidden files, ../ etc.) excluded


    ## command ls


    ### Syntax:


    ```

    ls [-alR] [file/directory]

    ```


    displays the names (and, optionally, the properties) of files or lists the content
    of a directory. File and directory names can be be absolute or relative.

    '
