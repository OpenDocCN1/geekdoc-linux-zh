  mdcn: "\n\n## C 和 C++ 的基本特性\n\n- 目前，C++ 是使用最广泛的编程语言之一。\n- C++ 源自 C，并且是 C 的超集。\n\
    - C++ 既允许高效的、面向硬件的编程（如 C 已有的），也允许在高层次的面向对象抽象层面上进行编程。因此，C++ 有时被称为 *混合* 语言。\n- 操作系统\
    \ UNIX 完全用 C 编写。\n- C++ 和 C 都是标准化的（由国际 ANSI 标准）。\n- C 和 C++ 不包含用于输入输出、图形和硬件编程等的特殊函数，但有相应的\
    \ *库*。\n- *标准库* 包含典型应用所需的全面函数和类集合，并随每个编译器一起安装。\n- 根据爱好者们的说法，C++ 编程很有趣！\n\n## 文献\n\
    \n- **Stroustrup, B.**: *The C++ Programming Language: Special Edition*, Addison-Wesley\
