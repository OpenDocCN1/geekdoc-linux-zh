    ## 复制、移动和删除文件/目录


    除了 ls 之外，还有其他用于操作文件的命令，可以与文件名模式一起使用。


    ### command mkdir, rmdir


    ### 语法：


    ```

    mkdir directory

    rmdir directory

    ```


    mkdir 创建一个空目录，rmdir 删除一个空目录。


    ### 示例：


    ```

    wegner@arber:~ > ls

    hello* hello.cpp hello.f90 nsemail/

    wegner@arber:~ > mkdir numerik

    wegner@arber:~ > ls

    hello* hello.cpp hello.f90 nsemail/ numerik/

