    Display running processes with their characteristics. Without options, only the\
    \ user's own processes running in the current shell are displayed.\n\nImportant\
    \ options:\n\n+   - `-a` display all processes assigned to any terminal (tty)\n\
    +   - `-l` long format display. Additional information about owner, parent process\
    \ etc.\n+   - `-u` display all processes which are owned by a specific user.\n\
    \n# Example:\n\n```\nwegner@arber:~ > ps\n  PID TTY       TIME CMD\n21733 pts/4\
    \    00:00:00 bash\n22197 pts/4    00:00:00 xterm\n22198 pts/5    00:00:00 bash\n\
    22212 pts/4    00:00:00 ps\nwegner@arber:~ >\n```\n\n# Exercise:\n\n*View all\
