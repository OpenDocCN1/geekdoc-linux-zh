  - '[PAGE 22]


    # Essential features of C and C++


    +   - At present, C++ is one of the most used programming languages.

    +   - C++ originates from C and is a superset of C.

    +   - C++ allows both for efficient, hardware-oriented programming (as already
    C), but also for programming on a high, object-oriented abstraction level. Thus,
    C++ is sometimes called a *hybrid* language.

    +   - The OS UNIX has been completely written in C.

    +   - C++ and C are standardized (by international ANSI standard).

    +   - C und C++ do not comprise special functions for input and output, graphics
    and hardware programming etc., but there are corresponding *libraries*.

    +   - The *standard library* includes a comprehensive set of functions and classes
    required for typical applications, and is installed together with each compiler.

    +   - According to aficionados, C++ - programming is fun!


    # Literature


    +   - **Stroustrup, B.**: *The C++ Programming Language: Special Edition*, Addison-Wesley
    Longman, Amsterdam, 2000.

    +   - **Kernighan, B., Ritchie, D.**: *The C Programming Language*, Prentice Hall,
    1988 (2nd ed.).

    +   - **Meyers, S.**: *Effective C++: 55 Specific Ways to Improve Your Programs
    and Designs*, Addison-Wesley, München, 2005 (3rd ed.).

    +   - **Josuttis, N.**: *The C++ Standard Library: A Tutorial and Reference*,
    Addison-Wesley Longman, Amsterdam, 1999.

    +   - **Booch, G., Maksimchuk, R. A., Engle, W. et al.**: *Object Oriented Analysis
    and Design with Applications*, Addison-Wesley Longman, Amsterdam, 2007 (3rd ed.).


    The C++ Standard (INCITS/ISO/IEC 14882-2003) can be downloaded via [http://www.ansi.org](http://www.ansi.org)
    (≈ 30$).'
