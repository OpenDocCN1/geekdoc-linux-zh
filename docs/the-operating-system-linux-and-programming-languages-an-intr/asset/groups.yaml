    \ Language*, Prentice Hall, 1988 (2nd ed.).\n- **Meyers, S.**: *Effective C++:\
    \ 55 Specific Ways to Improve Your Programs and Designs*, Addison-Wesley, München,\
    \ 2005 (3rd ed.).\n- **Josuttis, N.**: *The C++ Standard Library: A Tutorial and\
    \ Reference*, Addison-Wesley Longman, Amsterdam, 1999.\n- **Booch, G., Maksimchuk,\
    \ R. A., Engle, W. et al.**: *Object Oriented Analysis and Design with Applications*,\
    \ Addison-Wesley Longman, Amsterdam, 2007 (3rd ed.).\n\nC++ 标准（INCITS/ISO/IEC\
    \ 14882-2003）可通过 http://www.ansi.org 下载（≈ 30$）。\n\n## 在线资源\n\nWWW\n\n- **C++ tutorial**\
    \  \n  http://www.cplusplus.com/doc/tutorial\n\n- **Bjarne Stroustrup’s homepage**\
    \ (author of the C++ programming language)  \n  http://www2.research.att.com/~bs\n\
    \n- **C++ FAQs**  \n  http://www.parashift.com/c++-faq-lite\n\nNewsgroups\n\n\
    - `comp.lang.c++.moderated`  \n  General C++ discussion forum.\n\n- `comp.std.c++`\
    \  \n  Discussions related to the C++ standard.\n\n## 8 Fortran 90/95：概述\n\n###\
    \ 简史\n\n- 1954 年引入。\n- 由 Fortran II、Fortran IV、Fortran66、*Fortran77*（仍在使用）延续。\n\
    - Fortran 90，自 1991 年起为 ISO，自 1992 年起为 ANSI 标准。\n- Fortran 95，自 1996/97 年起为 ISO/ANSI\
    \ 标准。\n- 同时 Fortran 2000 和 Fortran 2003（最新标准）。\n- F95 和 Fortran 2000 包含对 F90 的相对较小的修订。\n\
    - Fortran 2003 是重大修订，支持（其中其他特性）面向对象编程（继承、多态）。\n- Fortran 2008 正在开发中。\n- 目前大多数编译器支持\
    \ F90/95，但 Fortran 2003 标准（几乎）已在 Intel *Fortran* 编译器的最新版本 v11 中实现。\n\n### 重要特性\n\
    \n- Fortran *曾经是* 且 *现在是* 用于解决物理问题，特别是数值模拟的最常用的语言。\n- F90/95 的引入使其具备与 C/C++ 相似的特性，除了硬件导向之外。凭借\
    \ Fortran 2003，甚至面向对象编程也成为可能。\n- F90 的功能相当强大，并且有众多 *标准* 操作和函数。例如，向量和矩阵运算属于标准：\n\
    \n  $$a = b + c$$\n\n  可以表示标量、向量或矩阵加法，具体取决于 $a,b,c$ 的定义。向量和矩阵乘积也可以通过同样简单的指令计算（*快速执行*），\n\
    \n  $$a = \\text{dot\\_product}(b,c);\\qquad a = \\text{matmul}(b,c).$$\n- 存在全面的程序库，特别是用于线性代数和特征值问题（既可作为源代码，也可作为高度优化的二进制对象提供），例如\
    \ `BLAS`、`LAPACK`、`EISPACK`。\n- 优化的程序（多维、并行）执行速度通常比相应的 C++ 程序快（2 到 3 倍）。\n\n-\
    \ 通过 HPF（高性能 Fortran）实现并行化的 *简单* 可能性。\n- 基本结构非常简单，语言比 C++ 更容易学习（至少就基本概念而言）。\n\
    - 在未来几年内，任何不只对纯实验/观测或纯理论工作感兴趣的物理学家都必须了解 Fortran。\n\n  使用（几乎）完全 Fortran 的物理研究领域示例：空气/流体动力学、计算天体物理学、原子和核物理学、地球物理学、气象学。\n\
    - Fortran 编程速度很快！\n\n"
