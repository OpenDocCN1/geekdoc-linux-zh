    # 7 The programming language C++: An overview


    *Programming languages* allow to formulate certain problems or algorithms by means
    of particular syntactic rules. Such a *program* can be ''translated'' by dedicated
    programs (*interpreter, compiler*) into machine-readable code and then executed
    by the computer.


    Historically, various programming languages of different complexity have been
    established, where this complexity was and is determined by the progress in computer
    science/hardware and the intended application.


    The approach for solving a certain problem can be discriminated by different programming
    *paradigms*.


    # Procedural and object-oriented programming


    # Procedural programming


    The emphasis is on the used *algorithm*. A program consists of a hierarchic dissection
    of the problem into *functional* units.


    Data and functions are separated, and data are publicly accessible.


    **Programming languages:** C, Fortran77, Pascal, …


    # Object-oriented programming


    useful introduction:

    https://www.youtube.com/watch?v=IbXsrHGhBAU


    *User-defined types (classes)* and associated operations are introduced.


    Thus, data and associated functions (methods) build a unit *within a class*. Data
    are (usually) accessible only via the associated methods.


    *Inheritance* of common properties allows to distinguish between general and special
    attributes of the types/classes.


    **Example:** Genealogical tree of the various classes of animals and plants, families,
    orders, species etc.


    Within the emerging *hierarchy*, similar functions, sharing the same interface
    but defining a specific behaviour for each particular type/class, can be implemented
    (*polymorphism*).


    By this approach, an (almost) exact model of reality shall be created which reflects
    all relevant dependencies within the program.


    Advantages of object-oriented programming:


    +   - better abstraction possibilities because of holistic approach.

    +   - improved structure and modularity, allowing for easy maintenance of programs.

    +   - reusability.


    **Programming languages:** C++, Java, Python,…'
