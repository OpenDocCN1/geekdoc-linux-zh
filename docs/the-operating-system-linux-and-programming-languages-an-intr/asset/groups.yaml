    \n# Three subsequent phases\n\nDuring the generation of executable programs from\
    \ C++ or Fortran source files, always the same steps have to be performed (also\
    \ for other higher programming languages such as Basic or Pascal).\n\n![](img/7620eb00c0475a5b7427437d851a4cd6_25_0.png)\n\
    \nThe *pre-processor* replaces symbolic constants and macros and inserts additional\
    \ files, if required. Usually omitted for Fortran programs.\n\nThe *compiler*\
    \ ‘translates’ the source code to machine readable code, creating the object files.\n\
    \nThe *linker* binds all present object files (and, optionally, object files from\
    \ libraries) to the executable program (executable object)."
  - '[PAGE 26]


    # command g++


    # Syntax:


    ```

    g++ [-c] [-g] [-O] file.cpp [-o outfile]

    ```


    We suggest using the GNU C++ compiler, which is included in almost any Linux distribution.
    The linker is already included, but can be called separately.


    # Important options:


    +   -o the name of the executable object (program). Default ‘a.out’.


    +   -c compile only, do not link.


    +   -g include debug information. Necessary for later debugging. Increases the
    size and execution time of the program.


    +   -O optimization (default: intermediate optimization)


    # Example:


    ```

    wegner@arber:~ > g++ hello.cpp

    wegner@arber:~ > ./a.out

    Hello, world!

    wegner@arber:~ > g++ hello.cpp -o hello

    wegner@arber:~ > ./hello

    Hello, world!

    ```


    The character ./ in front of a.out and hello is usually required to tell the shell
    that the executable program is located within the current directory.


    Now in two steps: compile at first, then link


    # Example:


    ```

    wegner@arber:~ > g++ -c hello.cpp

    wegner@arber:~ > g++ hello.o -o hello

    ```


    If more than one source file is present (e.g., if each sub-program is contained
    in a separate source file), one can avoid unnecessary compilations and a lot of
    command-line typing by using so-called makefiles, which allow updating executable
    programs using just one command. For further info, google for makefile and/or
    contact your supervisor.'
  - '[PAGE 27]


    command ifort, gfortran


    # Syntax:


    ```

    ifort [-c -g -O] file.f90 [-o outputfile]

    gfortran [-c -g -O] file.f90 [-o outputfile]

    ```


    Within the GNU open source project, a GNU Fortran 95 compiler is available under
    the command gfortran (if implemented and installed within your Linux distribution/system).
    Since this compiler (in its final stage) is quite new and has not been tested
    thoroughly at our institute, we recommend to use the Intel Fortran 95 compiler
    ifort when possible (installed, e.g., at the workstations of the USM. Sometimes,
    you need to invoke the command module load fortran to make the compiler available).


    Note that both compilers comply with the F95 standard (ifort v11 and later additionally
    supports most Fortran 2000/2003 features), and that gfortran does not support
    16-byte reals, in contrast to ifort.


    When you have no possibility to use ifort (e.g., when working at home without
    connection to the the USM), use gfortran, which has identical or similar options
    as ifort. gfortran is also available as an MS-Windows binary.


    If you want to debug your code with the GNU debugger ddd or gdb (next topic),
    we suggest to use gfortran. (ifort v12 and later works in most cases as well).


    In both compilers, the linker is included again, but can be called separately.


    # Important options for ifort and gfortran:


    +   -o the name of the executable object (program).

    +     Default ‘a.out’.


    +   -c compile only, do not link


    +   -g include debug information (see g++)


    +   -O optimization (default: intermediate optimization)


    # Example:


    ```

    wegner@arber:~ > ifort hello.f90 -o hello

    wegner@arber:~ > ./hello

    Hello, world!

    wegner@arber:~ >

    ```


    # Exercise:


    +   1. Compile the Fortran version of HelloWorld with ifort und start the program!


    +   2. Compile the program with gfortran using the option -c und link in a second
    step via gfortran hello.o!'
