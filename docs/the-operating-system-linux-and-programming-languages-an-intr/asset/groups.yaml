    kill [-9] PID\n```\n\nTerminates the process with number PID. Can be executed\
    \ only by the owner of the process or by *root*.\n\nImportant option:\n\n+   -\
    \ `-9` for ‘obstinate’ processes which cannot be terminated by a normal kill.\n\
    \n# Example:\n\n```\nwegner@arber:~ > ps\n  PID TTY       TIME CMD\n21733 pts/4\
