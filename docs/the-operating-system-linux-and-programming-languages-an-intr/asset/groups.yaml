  mdcn: "\n\n# 操作系统 Linux\n和编程语言\n\n# 引言\n\nJoachim Puls 和 Michael Wegner\n\n# 目录：\n\
    \n- 1 关于操作系统 UNIX/Linux 的一般说明\n- 2 在计算机上的第一步\n- 3 文件系统\n- 4 编辑和打印文本文件\n- 重要命令\n\
    - 5 UNIX-shells\n- 6 进程管理\n- 7 编程语言 C++ - 概览\n- 8 Fortran 90/95 - 概览\n- 9 创建可执行程序\n\
    \n附加材料\n\n- - vi 基础：vi_brief.pdf\n- - vi 参考：vi_reference.pdf\n- - emacs 参考：emacs_reference.pdf\n\
    \n*Acknowledgements.* 衷心感谢 Tadziu Hoffmann 仔细阅读手稿并提供有用的评论。\n\n## 1 关于操作系统 UNIX/Linux\
    \ 的一般说明\n\n### UNIX/Linux 的分类\n\nUNIX 是一个 *多用户/多任务* 操作系统，存在许多不同的版本（“衍生版”）：Solaris、AIX、XENIX、HP-UX、SINIX、**Linux**。\n\
    \n![](img/7620eb00c0475a5b7427437d851a4cd6_1_0.png)\n\n**操作系统 (OS)：** 操作计算机所需的所有程序的总和，其控制和监控应用程序。\n\
    \n### 基本特性\n\n### UNIX\n\n- - 最初是用编程语言 C 编写的，因此是 C 程序的经典平台。UNIX 包含适合程序开发的环境（C、C++、Java、Fortran、...）。\n\
    - - 主要用于大型机和工作站上的科学技术应用，但由于 **Linux**，在过去几年中也变得流行于经典 PC 应用。\n- - 非常适合在网络中应用。大型系统和网络需要一名管理员。\n\
    - - 为大多数任务提供各种替代解决方案。命令众多（比任何其他 OS 都多），简洁灵活。\n- - 最初是命令行导向的，但可以通过图形用户界面（*X Window\
    \ 系统*）使用。\n\n**Linux** 可通过互联网在不同的 *发行版* 中获得（S.u.S.E.、Fedora、Debian 等）。目前已有多种 *即启（live）系统*，无需安装即可直接从\
    \ CD 或其他可启动存储设备启动（Knoppix、Ubuntu、...）。也有有趣的“迷你版本”（<100 MB），专为从 USB 闪存盘启动而设计（例如\
    \ Puppy）。Linux 的源代码是免费的。\n\n## 文献\n\n- - **Peek, J., et al.:** *Unix Power Tools.*\n\
    \  O'Reilly Media 2002 (第 3 版)。\n- - **Gilly, D., et al.:** *UNIX in a Nutshell.*\n\
    \  O'Reilly, Köln. 1998 (第 1 版)。\n- - **Wielsch, M.:** *Das große Buch zu UNIX.*\n\
    \  Data Becker, Düsseldorf. 1994 (第 1 版)。\n- - 以及众多其他教科书\n- - **在线教程**\n  http://www.ee.surrey.ac.uk/Teaching/Unix\n\
    \n## 2 在计算机上的第一步\n\n### 用户，登录，注销\n\n由于 UNIX 是一个 *多用户* 操作系统，它可以同时处理多个用户。每个用户都需要一个\
    \ *用户账户*。\n\n每个用户都有一个个人环境（*主目录，shell*），只能由他/她本人（以及系统管理员和知道密码的人——合法或通过黑客）访问。\n\n\
    在系统内部，用户由其 *用户 ID (UID)* 和其组身份（*组 ID, GID*）标识。\n\n有两种用户类型：\n\n- - 具有 *受限* 权限的“普通”用户和\n\
    - - 拥有全部特权的系统管理员（*root*）。后者负责系统的安装、配置和维护以及用户管理。\n\n每个用户都必须登录和注销系统（*login/logout*）。每个用户账户都由\
    \ *密码* 保护。\n\n# 练习：\n\n*使用你的用户账户登录系统！*\n\n## 图形用户界面\n\n最初，UNIX 是命令行导向的。X Window\
    \ 系统通过窗口式图形界面实现便捷交互，类似于其他操作系统。\n\n*窗口管理器* 负责各个窗口的管理和显示。每个窗口管理器（而此类管理器种类繁多）都可通过其独特的\
    \ *外观和感觉*（窗口装饰和控制设备等的显示）来区分。大多数窗口管理器可在登录菜单中选择。\n\n简单窗口管理器的示例：\n\n- - `twm`: 非常简单且节省资源\n\
    - - `mwm`: Motif 窗口管理器，更常见且更高级\n- - `xfce`: 方便、简单、节省资源（推荐在虚拟机中使用）\n\n此外，几乎所有 Linux\
    \ 发行版都提供图形 *桌面环境*，例如 **KDE** 或 GNOME，其功能远超简单的窗口管理器。\n\ncommand `xterm`\n\n###\
    \ 语法：\n\n```\nxterm [options]\n```\n\n尽管有图形界面，UNIX 为了实际使用仍需要直接命令输入的可能性。因此，至少需要打开一个终端窗口。这可以通过窗口管理器或桌面环境（“控制台”）实现\n\
    \n然后可以使用命令 `xterm` 打开更多窗口。\n\n通常，所有 UNIX 命令都有多种选项，通常以 `-` 开头。对于以下将介绍的命令，我们只提供最重要的选项。\n\
    \n### 示例：\n\n```\nwegner@arber:~ > xterm -geo 80x40 -fn 10x20\n```\n\n命令 xterm\
    \ 被调用时带有两个选项 -geo、-fn，在本例中需要额外的参数（窗口宽度和高度、字体名称和大小）。\n\n# 练习：\n\n- 1. 通过 KDE 打开一个终端窗口（“终端程序”）。\n\
    - 2. 从那里，再启动另一个 xterm！\n\n"
