    \ ddd or gdb (next topic), we suggest to use gfortran. (ifort v12 and later works\
    \ in most cases as well).\n\nIn both compilers, the linker is included again,\
    \ but can be called separately.\n\n### Important options for ifort and gfortran:\n\
    - -o the name of the executable object (program). Default ‘a.out’.\n- -c compile\
    \ only, do not link\n- -g include debug information (see g++)\n- -O optimization\
    \ (default: intermediate optimization)\n\n### Example:\n\n```\nwegner@arber:~\
    \ > ifort hello.f90 -o hello\nwegner@arber:~ > ./hello\nHello, world!\nwegner@arber:~\
    \ >\n```\n\n### Exercise:\n- 1. Compile the Fortran version of HelloWorld with\
    \ ifort und start the program!\n- 2. Compile the program with gfortran using the\
    \ option -c und link in a second step via gfortran hello.o!\n"
