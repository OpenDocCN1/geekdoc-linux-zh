    # Loops


    # for


    Loops are one of the most important programming structures in the Bash language.
    All of the programs we''ve written so far are executed from the first line of
    the script until the last line, but loops allow you to repeat lines of code based
    on logical conditions or by following a sequence. The first kind of loop that
    we''ll discuss is a FOR loop. FOR loops iterate through every element of a sequence
    that you specify. Let''s take a look at a small example FOR loop:'
  merge: -1
  img_proc: true
- pgno: 125
  md: "```\n#!/usr/bin/env bash\n# File: forloop.sh\necho \"Before Loop\"\nfor i in\
    \ {1..3}\ndo\n    echo \"i is equal to $i\"\ndone\necho \"After Loop\"\n```\n\n\
    Now let’s execute this script:\n\n```\nbash forloop.sh\n```\n\n```\n## Before\
    \ Loop\n## i is equal to 1\n## i is equal to 2\n## i is equal to 3\n## After Loop\n\
    ```\n\nLet’s walk through forloop.sh line-by-line. First \"Before Loop\" is printed\
    \ before the FOR loop, then the loop begins. FOR loops start with the syntax for\
    \ [variable name] in [sequence] followed by do on the next line. The variable\
    \ name that you define immediately after for will take on a value inside of the\
    \ loop that corresponds to an element in the sequence you provide after in, starting\
    \ with the first element of the sequence, followed by every subsequent element.\
    \ Valid sequences include brace expansions, explicit lists of strings,"
