    ```


    You were in your working directory to start, and by entering cd into the command
    line you did technically change directory, you just changed it to your home directory
    (the directory you were in to begin with). To use cd to change your working directory
    to a directory other than your home directory, you need to provide cd with the
    path to another directory as an argument. You can specify a path as either a path
    that is relative to your current directory, or you can specify the absolute path
    to a directory starting from the root of your computer. Let’s say we simply want
    to change the working directory to one of the folders that is inside our home
    directory. First we need to be able to see which folders are in our working directory.
    You can list the files and folders in a directory using the ls command. Let’s
    use the ls command in our home directory to list the files and folders contained
    within it.


    ```

    ls

    ```


    ```

    ## Desktop

    ## Documents

    ## Photos

    ## Music

    ## todo.txt

    ```


    It looks like I have four folders and one text file in my home directory. Now
    let’s switch into the Music directory:'
