    # Creation and Inspection


    Now that you can fluidly use your terminal to bound between directories all over
    your computer I’ll show you some actions you can perform on folders and files.
    One of the first actions you’ll probably want to take when opening up a fresh
    terminal is to create a new folder or file. You can make a directory with the
    `mkdir` command, followed by the path to the new directory. First let’s look at
    the contents of my home directory:


    ```

    cd

    ls


    ## Desktop

    ## Documents

    ## Photos

    ## Music

    ## todo.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'I want to create a new directory to store some code files I''m going to write
    later, so I''ll use mkdir to create a new directory called Code:


    ```

    mkdir Code

    ls

    ```


    +   ## Desktop

    +   ## Documents

    +   ## Photos

    +   ## Music

    +   ## todo.txt

    +   ## Code


    It worked! Notice that the argument Code to mkdir is a relative path, however
    I could have specified an absolute path. In general you should expect Unix tools
    that take paths as arguments to accept both relative and absolute paths.


    There are a few different ways to create a new file on the command line. The most
    simple way to create a blank file is to use the touch command, followed by the
    path to the file you want to create. In this example I''m going to create a new
    journal entry using touch:


    ```

    touch journal-2017-01-24.txt

    ls

    ```'
  merge: -1
  img_proc: true
