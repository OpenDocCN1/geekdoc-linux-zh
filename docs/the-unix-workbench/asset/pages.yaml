    # Make


    Once upon a time there were no web browsers, file browsers, start menus, or search
    bars. When somebody booted up a computer all they got was a shell prompt, and
    all of the work they did started from that prompt. Back then people still loved
    to share software, but there was always the problem of how software should be
    installed. The make program is the best attempt at solving this problem, and make’s
    elegance has carried it so far that it is still in wide use today. The guiding
    design goal of make is that in order to install some new piece of software one
    would:


    +   1. Download all of the files required for installation into a directory.

    +   2. `cd` into that directory.'
