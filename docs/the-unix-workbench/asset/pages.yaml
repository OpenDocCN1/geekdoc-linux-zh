    Now that we’ve chosen a text editor we can edit the cron table using the command
    crontab -e (cron table edit) which will automatically open nano with the appropriate
    file.


    ```

    crontab -e

    ```


    ```

    # Edit this file to introduce tasks to be run by \ cron.

    #

    # m h  dom mon dow   command

    ```


    Let’s go over the layout of the cron table. First you should notice that any text
    after a pound sign (#) is a comment, so it’s not seen by cron (just like bash
    comments). The cron table has six columns:


    +   1. Minute (m)

    +   2. Hour (h)

    +   3. Day of Month (dom)

    +   4. Month (mon)

    +   5. Day of Week (dow)'
