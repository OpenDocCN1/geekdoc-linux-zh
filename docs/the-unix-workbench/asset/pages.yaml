    ```

    ## Welcome to My First Repo

    ## Learning Git is going well so far.

    ## I added this line in the update-readme branch.

    ## <<<<<<< HEAD

    ## It''s windy outside today.

    ## =======

    ## It''s cloudy outside today.

    ## >>>>>>> update-readme

    ```


    The first three lines of this file look normal, then things get interesting! The
    line between <<<<<<< HEAD and ======= shows the version of the conflicted line
    on the current branch. In Git terminology the HEAD represents the most recent
    commit on the branch which is currently checked out (which is master in this case).
    The line between ======= and >>>>>>> update-readme shows the version of the line
    on the update-readme branch. In order to resolve this conflict, all we need to
    do is open readme.txt with nano so we can delete the lines we want to get rid
    of. In this case let''s keep the "cloudy" version.


    ```

    nano readme.txt

    cat readme.txt

    ```


    ```

    ## Welcome to My First Repo

    ## Learning Git is going well so far.

    ## I added this line in the update-readme branch.

    ## It''s cloudy outside today.

    ```


    Now we can commit the resolution of this conflict.'
