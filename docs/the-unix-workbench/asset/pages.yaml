  md: "It looks like make successfully updated readme.txt! With every change to toc.txt,\
    \ running make readme.txt will programmatically update readme.txt.\n\nIn order\
    \ to simplify the make experience, we can create a rule at the top of our makefile\
    \ called all where we can list all of the files that are built by the makefile.\
    \ By adding the all target we can simply run make without any arguments in order\
    \ to build all of the targets in the makefile. Let’s open up nano and add this\
    \ rule:\n\n```\nnano makefile\n```\n\n```\nall: draft_journal_entry.txt readme.txt\n\
    \ndraft_journal_entry.txt:\n    touch draft_journal_entry.txt\n\nreadme.txt: toc.txt\n\
    \    echo \"This journal contains the following number of entries:\" > readme.txt\n\
    \    wc -l toc.txt | egrep -o \"[0-9]+\" >> readme.txt\n```\n\nWhile we have nano\
    \ open let’s add another special rule at the end of our makefile called clean\
    \ which destroys the files created by our makefile:"
