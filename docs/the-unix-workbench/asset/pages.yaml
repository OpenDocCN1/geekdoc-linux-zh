- pgno: 126
  md: 'arrays, and command substitutions. In this instance we’re using the brace expansion
    {1..3} which we know expands to the string "1 2 3". The code executed in each
    iteration of the loop is written between do and done. In the first iteration of
    the loop, the variable $i contains the value 1. The string "i is equal to 1" is
    printed to the console. There are more elements in the brace expansion after 1,
    so after reaching done the first time, the program starts executing back at the
    do statement. The second time through the loop variable $i contains the value
    2. The string "i is equal to 2" is printed to the console, then the loop goes
    back to the do statement since there are still elements left in the sequence.
    The $i variable is now equal to 3, so "i is equal to 3" is printed to the console.
    There are no elements left in the sequence, so the program moves beyond the FOR
    loop and finally prints "After Loop". Stop for a moment and edit this loop yourself.
    Try changing the brace expansion to include other sequences of numbers, letters,
    or words, then execute the modified code. Before you execute your modified program,
    write down what you think will be printed. How do the results of executing your
    program compare with your expectations?


    Once you’ve experimented a little take a look at this example with several other
