    Let’s write a more complicated function. Imagine that we wanted to add up a sequence
    of numbers from the command line, but we had no way of knowing how many numbers
    would be in the sequence. What components would we need to write this function?
    First we would need a way to capture a list of arguments which can have variable
    length, second we would need a way to iterate through that list so we could add
    up each element, and we would need a way to store the cumulative sum of the sequence.
    These three requirements can be satisfied by using the $@ variable, a FOR loop,
    and variable where we can store the sum. It’s important to break down a larger
    goal into a series of individual components before writing a program, that way
    we more easily can identify which features and tools will be required. Let’s write
    this program in a file called addseq.sh.'
