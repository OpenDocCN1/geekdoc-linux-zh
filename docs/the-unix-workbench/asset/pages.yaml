    # Talking to Other Servers


    There are tons of servers out there on the internet! The way you’re probably used
    to talking to a server is through a web browser, but there are other ways we can
    talk to servers on the command line. One of the most popular command line programs
    for talking to other servers is curl. The curl command allows us to send requests
    and information to other servers.


    One easy task that we can use curl for is downloading files that are available
    online. For example, this entire book and all of the files associated with it
    are hosted on a server! You can find the Markdown file for one of the first chapters
    of this book here. To download a file with curl, we simply need to provide the
    -O flag and the URL of the file:


    ```

    curl -O http://website.org/textfile.txt

    ```


    Let’s try downloading the Markdown file from my website:


    ```

    curl -O http://seankross.com/the-unix-workbench/0\

    1-What-is-Unix.md

    ```'
