    # Variables


    In Bash you can store data in variables. In chapter 4 we discussed environmental
    variables that are set by your operating system. You can also create your own
    variables. Make sure you follow these rules when you’re naming variables:


    +   • Every character should be lowercase.

    +   • The variable name should start with a letter.

    +   • The name should only contain alphanumeric characters and underscores (_).

    +   • Words in the name should be separated by underscores.


    If you follow those rules then you can avoid accidentally overwriting data stored
    in environmental variables.


    You can assign data to a variable using the equals sign (=). The data you store
    in a variable can either be a string or a number. Let’s create a variable now
    on the command line:


    ```

    chapter_number=5

    ```


    The variable name is on the left hand side of the equals sign, and the data which
    will be stored in that variable is on the right hand side of the equals sign.
    Notice that there are no spaces on either side of the equals sign, this is not
    allowed when assigning variables:'
