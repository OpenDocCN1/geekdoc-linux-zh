  md: '# Quick setup — If you’ve done this kind of thing before


    We recommend every repository include a README, LICENSE, and .gitignore.


    # ...or create a new repository on the command line


    ```

    echo "# my-first-repo" >> README.md

    git init

    git add README.md

    git commit -m "first commit"

    git remote add origin https://github.com/seanross/my-first-repo.git

    git push -u origin master

    ```


    # ...or push an existing repository from the command line


    ```

    git remote add origin https://github.com/seanross/my-first-repo.git

    git push -u origin master

    ```


    # ...or import code from another repository


    You can initialize this repository with code from a Subversion, Mercurial, or
    TFS project.


    GitHub offers a few suggestions about what to do with our new remote repository.
    We’ve already been using a local Git repository, and what GitHub provides is a
    remote Git repository. A remote Git repository is just a Git repository stored
    on a computer is that always turned on and connected to the internet, so it can
    act as a central point where we can share and sync our changes to files with our
    friends and colleagues. We can see which remote repositories our local repository
    is connected to with the git remote command while we have our working directory
    set to my-first-repo:


    ```

    git remote

    ```


    Nothing is printed to the console since you haven’t set any remotes up yet! Now
    let’s add your new GitHub repository as a remote in your local repository:'
