- pgno: 213
  md: '# Summary


    +   - You can use GitHub you create and host remote Git repositories.

    +   - A remote Git repository is a Git repository that is always connected to
    the internet.

    +   - List remote repositories with `git remote`.

    +   - Add remote repositories with `git remote add [name-of-remote] https://github.com/[username]/[repo-name].git`

    +   - Add commits to your remote repository with `git push [name-of-remote] [name-of-branch]`
    or just `git push` if you’ve set up a default remote and branch.

    +   - To merge commits on a remote repository into your local repository use `git
    pull [name-of-remote] [name-of-branch]` or just `git pull` if you’ve set up a
    default remote and branch.

    +   - A pull request allows you to interactively compare two different branches
    before you merge them.

    +   - GitHub Pages allows you to host websites written in Markdown for free!

    +   - Forking a repository allows you to make changes to a copy of a public repository.
    You can then open a pull request if you think your changes should be merged into
    the upstream repository!


    # Exercises


    +   1. Create a new repository on GitHub. Clone your repository and add a README.md
    file. Push this file to GitHub and create a GitHub Pages website for this repository.'
