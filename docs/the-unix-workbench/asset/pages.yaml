    pwd


    ```

    ## /Users/sean/Music

    ```


    It doesn’t matter what directory I’m in since I’m using an absolute path, I can
    jump straight to that directory (Remember that ~ is a shortcut for the path to
    your home folder). Of course you shouldn’t expect yourself to have every absolute
    path on your computer memorized! You can use a terminal feature called **tab completion**
