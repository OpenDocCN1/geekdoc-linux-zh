    \ Let’s build up a makefile that creates a readme.txt file which is automatically\
    \ populated with some information about our current directory.\n\nLet’s start\
    \ by creating a very basic makefile with nano:\n\n```\ncd ~/Documents/Journal\n\
    nano makefile\n```\n\n```\ndraft_journal_entry.txt:\n    touch draft_journal_entry.txt\n\
    ```\n\nThe simple makefile above shows illustrates a rule which has the following\
    \ general format:\n\n```\n[target]: [dependencies...]\n  [commands...]\n```\n\n\
    In the simple example we created draft_journal_entry.txt is the target, a file\
    \ which is created as the result of the command(s). It’s very important to note\
    \ that any commands under a target must be indented with a Tab. If we don’t use\
    \ Tabs to indent the commands then make will fail. Let’s save and close the makefile,\
    \ then we can run the following in the console:"
