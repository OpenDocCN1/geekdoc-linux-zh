    # ## Differentiate


    It’s important to be able to examine differences between files. First let’s make
    two small simple text files in the Documents directory.


    ```

    ```bash

    cd ~/Documents

    head -n 4 states.txt > four.txt

    head -n 6 states.txt > six.txt

    ```

    ```


    If we want to look at which lines in these files are different we can use the
    `diff` command:


