  md: 'techniques for creating and also editing files. One easy way to create a file
    is using output redirection. Output redirection stores text that would be normally
    printed to the command line in a text file. You can use output redirection by
    typing the greater-than sign (>) at the end of a command followed by the name
    of the new file that will contain the output from the proceeding command. Let’s
    try an example using echo:


    ```

    echo "I''m in the terminal."

    ```


    ```

    ## I''m in the terminal.

    ```


    ```

    echo "I''m in the file." > echo-out.txt

    ```


    Only the first command printed output to the terminal. Let’s see if the second
    command worked:


    ```

    ls

    ```


    ```

    ## Desktop

    ## Documents

    ## Photos

    ## Music

    ## todo.txt

    ## Code

    ## journal-2017-01-24.txt

    ## echo-out.txt

    ```'
