  md: '# Bash Programming


    > Communities begin by building their kitchen. -

    > French proverb


    The last two chapters have discussed how to use the bash shell. Bash itself is
    a little programming language, and this chapter we’re going to discuss how you
    can write your own computer programs in Bash. Programming in Bash is useful to
    know because of how seamlessly it integrates with all of the command line programs
    you’ve already learned. By the end of this chapter you should be able to write
