    # Getting Values from Functions


    Functions are used for two primary purposes: computing values and side effects.
    In the addseq command in the previous section we provide the command with a sequence
    of numbers and then the command provides us with the sum of the sequence which
    is a value that we’re interested in. In this case we can see that addseq has computed
    a value based on a few input values. Many other commands, like pwd for example,
    return a value without affecting the state of the file on our computer. There
    are however functions like mv or cp which move and copy files on our computer.
    A side effect occurs whenever a function creates or changes files on our computer.
    These commands don’t print any value if they succeed.


    We’ll often write functions in order to calculate some value, and it’s important
    to understand how to store the result of a function in a variable so that it can
    be used later. Let’s source addseq.sh and run it one more time:


    ```

    source addseq.sh

    addseq 3 0 0 7

    ```'
