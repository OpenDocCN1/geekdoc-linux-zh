    ```

    cd ~/

    ```


    (press Tab)


    ```

    ## Desktop

    ## Documents

    ## Photos

    ## Music

    ## todo.txt

    ```


    Pressing tab shows you a list of all files and folders inside of the ~/ directory.
    Now I’m going to type ~/D into my terminal and you can see what happens when I
