    ```


    In a common situation you might be sent a file, or you might download a file from
    the internet that comes with code known as a checksum or a hash. Hashing programs
    generate a unique code based on the contents of a file. People distribute hashes
    with files so that we can be sure that the file we think we’ve downloaded is the
    genuine file. One way we can prevent malicious individuals from sending us harmful
    files is to check to make sure the computed hash matches the provided hash. There
    are a few commonly used file hashes but we’ll talk about two called MD5 and SHA-1.


    Since hashes are generated based on file contents, then two identical files should
    have the same hash. Let’s test this my making a copy of states.txt.'
