  md: '# ## make: ''draft_journal_entry.txt'' is up to date.


    Since the target file already exists no action is taken, and instead we’re informed
    that the rule for draft_journal_entry.txt is “up to date” (there’s nothing to
    be done).


    If we look at the general rule format we previously sketched out, we can see that
    we didn’t specify any dependencies for this rule. A dependency is a file that
    the target depends on in order to be built. If a dependency has been updated since
    the last time make was run for a target then the target is not “up to date.” This
    means that the commands for that target will be run the next time make is run
    for that target. This way, the changes to the dependency are incorporated into
    the target. The commands are only run when the dependencies or change, or when
    the target doesn’t exist at all, in order to avoid running commands unnecessarily.


    Let’s update our makefile to include a readme.txt that is built automatically.
    First, let’s add a table of contents for our journal:


    ```

    echo "1. 2017-06-15-In-Boston" > toc.txt

    ```


    Now let’s update our makefile with nano to automatically generate a readme.txt:


    ```

    nano makefile

    ```'
