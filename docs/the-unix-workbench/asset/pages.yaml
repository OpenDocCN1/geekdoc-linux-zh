    \n# while\n\nNow that we’ve gotten a few FOR loops working let’s move on to WHILE\
    \ loops. The **WHILE loop** is truly the [Reese’s Peanut Butter Cup](https://youtu.be/07oD_oX-Gio)¹⁴\
    \ of programming structures, combining parts of the FOR loop and the IF statement.\
    \ Let’s take a look at an example WHILE loop so you can see what I mean:\n\n```\n\
    ```bash\n#!/usr/bin/env bash\n# File: whileloop.sh\n\ncount=3\n\nwhile [[ $count\
    \ -gt 0 ]]\ndo\n    echo \"count is equal to $count\"\n    let count=$count-1\n\
    done\n```\n```\n\nThe WHILE loop begins first with the while keyword followed\
    \ by a conditional expression. As long as the conditional expression is equivalent\
    \ to true when an iteration of the loop begins, then the code within the WHILE\
    \ loop will continue to be executed. Based on the code for whileloop.sh what do\
    \ you think will be printed to the console when we run this script? Let’s find\
