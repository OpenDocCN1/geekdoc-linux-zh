  md: '```

    cat echo-out.txt

    ```


    ```

    ## I''m in the file.

    ```


    Looks like it worked! You can also append text to the end of a file using two
    greater-than signs (>>). Let’s try this feature out:


    ```

    echo "I have been appended." >> echo-out.txt

    cat echo-out.txt

    ```


    ```

    ## I''m in the file.

    ## I have been appended.

    ```


    Now for a **word of warning.** Imagine that I want to append another line to the
    end of echo-out.txt, so typed echo "A third line." > echo-out.txt into the terminal
    when really I meant to type echo "A third line." >> echo-out.txt (notice I used
    > when I meant to use >>). Let’s see what happens:


    ```

    echo "A third line." > echo-out.txt

    cat echo-out.txt

    ```


    ```

    ## A third line.

    ```'
