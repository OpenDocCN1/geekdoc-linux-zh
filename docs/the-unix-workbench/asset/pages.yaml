- pgno: 18
  md: '```

    cd ~/D

    ```


    (press Tab)


    ```

    ## Desktop

    ## Documents

    ```


    Since I added a "D" to the path, only folders with names that start with a "D"
    are listed. If I type cd ~/De into the console and then press Tab then the command
    will autocomplete to cd ~/Desktop/. If I press tab again, the console will list
    all of the files and folders on my desktop.


    Make sure to pause and try this yourself in your own terminal! You won’t have
    the same files or folders that I do, but you should try using cd and tab completion
    with directories and files that start with the same letters.


    # Summary


    +   - You can identify a specific file or folder by its path.

    +   - The root directory (/) contains all of the folders and files on your computer.

    +   - Your home directory (~) is the directory where your terminal always starts.

    +   - Use the cd command to change your working directory.

    +   - The pwd command will print the working directory.

    +   - The ls command will list files and folders in a directory.'
