- pgno: 99
  md: '# Logic and If/Else


    # Conditional Execution


    When writing computer programs it is often useful for your program to be able
    to make decisions based on inputs like arguments, files, and environmental variables.
    Bash provides mechanisms for creating **logical expressions** which resemble mathematical
    equations. These logical expressions can be evaluated until they are either true
    or false. In fact, true and false are both simple Bash commands! Let''s try them
    both out now:


    ```

    true

    false

    ```


    At first it doesn''t look like they do much. In order to see how they work, we''re
    going to need to look under the hood of Unix a little bit. Whenever you execute
    a program on the command line, in general one of two things will happen: either
    the command is executed successfully, or there''s an error. In terms of errors
    there are many ways that a program can go wrong, and Unix can take different actions
    depending on what kind of error occurs. For example if I enter the name of a command
    that does not exist into the terminal, then I''ll see an error:


    ```

    this_command_does_not_exist

    ```'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# ## Error in running command bash


    Since that command does not exist, it creates a specific kind of error which is
    indicated by the program''s exit status. The exit status of a program is an integer
    which indicates whether the program was executed successfully or if an error occurred.
    The exit status of the last program run is stored in the question mark variable
    ($?). We can take a look at the exit status of the last program with echo:


    ```

    echo $?

    ```


    # ## 127


    This particular exit status made an indication to the shell that it should print
    an error message to the console. What’s the exit status of a program that runs
    successfully? Let’s take a look:


    ```

    echo I will succeed.

    echo $?

    ```


    # ## I will succeed.


    # ## 0


    So the exit status of a successful program is 0. Now let’s take a look at the
    exit statuses of true and false:'
  merge: -1
  img_proc: true
- pgno: 101
  md: "```\ntrue\necho $?\nfalse\necho $? \n```\n\n```\n## 0\n## 1\n```\n\nAs you\
    \ can see true has an exit status of 0 and false has an exit status of 1. Since\
    \ these programs don’t do much else, you could define true as a program that always\
    \ has an exit status of 0 and false as a program that always has an exit status\
    \ of 1.\n\nKnowing the exit status of these programs is important when discussing\
    \ the logical operators: the AND operator (&&) and the OR operator (||). The AND\
    \ and OR operators can be used for conditional execution of programs on the command\
    \ line. Conditional execution occurs when the execution of one program depends\
    \ on the exit status of another program. For example in the case of the AND operator,\
    \ the program on the right hand side of && will only be executed if the program\
    \ on the left hand side of && has an exit status of 0. Let’s take a look at some\
    \ small examples:\n\n```\ntrue && echo \"Program 1 was executed.\"\nfalse && echo\
    \ \"Program 2 was executed.\"\n```\n\n```\n## Program 1 was executed.\n```\n\n\
    Since false has an exit status of 1, the program echo \"Program 2 was executed.\"\
    \ is not executed, so nothing is printed to the console for that command. Several\
    \ AND operators can be chained together like so:"
