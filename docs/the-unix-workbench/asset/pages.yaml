    # Escaping, Anchors, Odds, and Ends


    One issue you may have thought about during our little exploration of regular
    expressions is how to search for certain punctuation marks in text considering
    that those same symbols are used as metacharacters! For example, how would you
    find a plus sign (+) in a line of text since the plus sign is also a metacharacter?
    The answer is simply using a backslash (\ ) before the plus sign in a regex, in
    order to "escape" the metacharacter functionality. Here are a few examples:'
  merge: -1
  img_proc: true
- pgno: 62
  md: '```

    egrep "\+" small.txt

    ```


    ## tragedy + time = humor


    ```

    egrep "\." small.txt

    ```


    ## http://www.jhsph.edu/


    There are three more metacharacters that we should discuss, and two of them come
    as a pair: the caret (^), which represents the start of a line, and the dollar
    sign ($) which represents the end of line. These "anchor characters" only match
    the beginning and ends of lines when coupled with other regular expressions. For
    example, going back to looking at states.txt, I could search for all of the state
    names that begin with "M" with the following command:


    ```

    egrep "^M" states.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 63
  md: '```

