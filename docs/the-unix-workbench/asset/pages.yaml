    Only the differing lines are printed to the console. We could also compare differing
    lines in a side-by-side comparison using sdiff:


    ```

    sdiff four.txt six.txt

    ```


    ```

    ## Alabama          Alabama

    ## Alaska           Alaska

    ## Arizona          Arizona

    ## Arkansas         Arkansas

    ##                 > California

