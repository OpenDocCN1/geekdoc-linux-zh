    # ## Navigating the Command Line


    You’ve learned two command line commands (clear and echo) which is pretty good!
    Before you learn more commands we need to discuss how files and folders are organized
    on your computer.


    Computers are organized in a hierarchy of folders, where a folder can contain
    many folders and files. People who use Unix often refer to folders as directories
    and these terms are interchangeable. This directory hierarchy forms a tree, like
    the diagram below. You can use the command line to navigate these trees on your
    computer.


    ![](img/a67f2d2ba01c2569ec78ab34ae6c3c5a_12_0.png)


    As you can see in the image below, my Debussy directory is contained in my Music
    directory. This is the simplest case of how directories are structured.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '![](img/a67f2d2ba01c2569ec78ab34ae6c3c5a_13_0.png)


    ![](img/a67f2d2ba01c2569ec78ab34ae6c3c5a_13_1.png)


    The directory structure on most computers is much more complicated, but the structure
    on your computer probably looks something like this:


    ![](img/a67f2d2ba01c2569ec78ab34ae6c3c5a_13_2.png)


    There are a few special directories that you should be aware of on your computer.
    The directory at the top of this tree is called the root directory. The root directory
    contains all other directories, and is represented by a slash (/).


    The home directory is another special directory that is represented by a tilde
    (~). Your home directory contains your personal files, like your photos, documents,
    and the contents of your desktop. When you first open up your shell you usually
    start off in your home directory. Imagine tracing all of the'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'directories from your root directory to the directory you’re currently in.
    This sequence of directories is called a path. The diagram below illustrates the
    path from a hypothetical root directory to the home directory.


    ![](img/a67f2d2ba01c2569ec78ab34ae6c3c5a_14_0.png)


    This path can be written as `/Users/sean`.


    Open the command line if you closed it. Your shell starts in your home directory.
    Whatever directory your shell is in is called the **working directory**. Enter
    the `pwd` command into your shell to print the **working directory**.


    ```

    pwd


    ## /Users/sean

    ```


    You can change your working directory using the `cd` command. If you use the `cd`
    command without any arguments then your working directory is changed to your home
    directory.


    Enter `cd` into the command line and then enter `pwd`.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '```

