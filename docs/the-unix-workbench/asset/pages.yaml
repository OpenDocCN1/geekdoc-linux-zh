  img_proc: true
- pgno: 50
  md: '```

    ## 50      60      472 states.txt

    ```


    It makes sense that there are 50 lines, but it’s interesting that there are 60
    total words. Let’s take a peak at the beginning of the file:


    ```

    head states.txt

    ```


    ```

    ## Alabama

    ## Alaska

    ## Arizona

    ## Arkansas

    ## California

    ## Colorado

    ## Connecticut

    ## Delaware

    ## Florida

    ## Georgia

    ```


    This file looks basically how you would expect it to look! You may recall from
    Chapter 3 that the kind of shell that we’re using is the bash shell. Bash treats
    different kinds of data differently, and we’ll dive deeper into data types in
    Chapter 5. For now all you need to know is that text data are called strings.
    A string could be a word, a sentence, a book, or a file or folder name. One of
    the most effective ways to search through strings is to use **regular expressions**.
    Regular expressions are strings that define patterns in other strings. You can
    use regular expressions to search for a sub-string contained within a larger string,
    or to replace one part of a string with another string.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'One of the most popular tools for searching through text files is grep. The
    simplest use of grep requires two arguments: a regular expression and a text file
    to search. Let''s see a simple example of grep in action and then I''ll explain
    how it works:


    ```

    grep "x" states.txt

    ```


    ```

    ## New Mexico

    ## Texas

    ```


    In the command above, the first argument to grep is the regular expression "x".
    The "x" regular expression represents one instance of the letter "x". Every line
    of the states.txt file that contains at least one instance of the letter "x" is
    printed to the console. As you can see New Mexico and Texas are the only two state
    names that contain the letter "x". Let''s try searching for the letter "q" in
    all of the state names using grep:


    ```

    grep "q" states.txt

    ```


    Nothing is printed to the console because the letter "q" isn''t in any of the
    state names. We can search for more than individual characters though. For example
    the following command will search for the state names that contain the word "New":


    ```

    grep "New" states.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 52
  md: '+   ## New Hampshire

    +   ## New Jersey

    +   ## New Mexico

    +   ## New York


    In the previous case the regular expression we used was simply "New", which represents
    an occurrence of the string "New". Regular expressions are not limited to just
    being individual characters or words, they can also represent parts of words.
    For example I could search all of the state names that contain the string "nia"
    with the following command:


    ```

    grep "nia" states.txt

    ```


    +   ## California

    +   ## Pennsylvania

    +   ## Virginia

    +   ## West Virginia


    All of the state names above happen to end with the string "nia".


    # Metacharacters


    Regular expressions aren''t just limited to searching with characters and strings,
    the real power of regular expressions come from using metacharacters. Remember
    that metacharacters are characters that can be used to represent other characters.
    To take full advantage of all of the metacharacters we should use grep''s cousin
    egrep, which just extends grep''s'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'capabilities. The first metacharacter we should discuss is the "." (period)
    metacharacter, which represents **any** character. If for example I wanted to
    search states.txt for the character “i”, followed by any character, followed by
    the character “g” I could do so with the following command:


    ```

    egrep "i.g" states.txt

    ```


    ```

    ## Virginia

    ## Washington

    ## West Virginia

    ## Wyoming

    ```


    The regular expression “i.g” matches the sub-string “irg” in Virginia, and West
    Virginia, and it matches the sub-string “ing” in Washington and Wyoming. The period
    metacharacter is a stand-in for the “r” in “irg” and the “n” in “ing” in the example
    above. The period metacharacter is extremely liberal, for example the command
    egrep "." states.txt would return every line of states.txt since the regular expression
    "." would match one occurrence of any character on every line (there’s at least
    one character on every line).


    Besides characters that can represent other characters, there are also metacharacters
    called **quantifiers** which allow you to specify the number of times a particular
    regular expression should appear in a string. One of the most basic quantifiers
    is "+" (plus) which represents one or more occurrences of the proceeding expression.
    For example the regular expression “s+as” means: one or more “s” followed by “as”.
    Let’s see if any of the state names match this expression:'
  merge: -1
  img_proc: true
- pgno: 54
  md: '```

    egrep "s+as" states.txt

    ```


    ```

    ## Arkansas

    ## Kansas

    ```


    Both Arkansas and Kansas match the regular expression "s+as". Besides the plus
    metacharacter there’s also the "*" (star) metacharacter which represents zero
    or more occurrences of the preceding expression. Let’s see what happens if we
    change "s+as" to "s*as":


    ```

    egrep "s*as" states.txt

    ```


    ```

    ## Alaska

    ## Arkansas

    ## Kansas

    ## Massachusetts

    ## Nebraska

    ## Texas

    ## Washington

    ```


    As you can see the star metacharacter is much more liberal with respect to matching
    since many more state names are matched by "s*as". There are more specific quantifies
    you can use beyond "zero or more" or "one or more" occurrences of an expression.
    You can use curly brackets ({ }) to specify an exact number of occurrences of
    an expression. For example the regular expression "s{2}" specifies exactly two
    occurrences of the character "s". Let’s try using this regular expression:'
  merge: -1
  img_proc: true
- pgno: 55
  md: '```

    egrep "s{2}" states.txt

    ```


    ```

    ## Massachusetts

    ## Mississippi

    ## Missouri

    ## Tennessee

    ```


    Take note that the regular expression "s{2}" is equivalent to the regular expression
    "ss". We could also search for state names that have between two and three adjacent
    occurrences of the letter "s" with the regular expression "s{2,3}":


    ```

    egrep "s{2,3}" states.txt

    ```


    ```

    ## Massachusetts

    ## Mississippi

    ## Missouri

    ## Tennessee

    ```


    Of course the results are the same because there aren’t any states that have "s"
    repeated three times.


    You can use a capturing group in order to search for multiple occurrences of a
    string. You can create capturing groups within regular expressions by using parentheses
    "( )". For example if I wanted to search states.txt for the string "iss" occurring
    twice in a state name I could use a capturing group and a quantifier like so:'
  merge: -1
  img_proc: true
- pgno: 56
  md: '```

    egrep "(iss){2}" states.txt

    ```


    ## Mississippi


    We could combine more quantifiers and capturing groups to dream up even more complicated
    regular expressions. For example, the following regular expression describes three
    occurrences of an "i" followed by two of any character:


    ```

    egrep "(i.{2}){3}" states.txt

    ```


    ## Mississippi


    The complex regular expression above still only matches "Mississippi".


    # Character Sets


    For the next couple of examples we’re going to need some text data beyond the
    names of the states. Let’s just create a short text file from the console:'
  merge: -1
  img_proc: true
- pgno: 57
  md: '```

    touch small.txt

    echo "abcdefghijklmnopqrstuvwxyz" >> small.txt

    echo "ABCDEFGHIJKLMNOPQRSTUVWXYZ" >> small.txt

    echo "0123456789" >> small.txt

    echo "aa bb cc" >> small.txt

    echo "rhythms" >> small.txt

    echo "xyz" >> small.txt

    echo "abc" >> small.txt

    echo "tragedy + time = humor" >> small.txt

    echo "http://www.jhsph.edu/" >> small.txt

    echo "%%&--%%#--&%#" >> small.txt

    ```


    In addition to quantifiers there are also regular expressions for describing sets
    of characters. The \w metacharacter corresponds to all “word” characters, the
    \d metacharacter corresponds to all “number” characters, and the \s metacharacter
    corresponds to all “space” characters. Let’s take a look at using each of these
    metacharacters on small.txt:


    ```

    egrep "\w" small.txt

    ```


    ```

    ## abcdefghijklmnopqrstuvwxyz

    ## ABCDEFGHIJKLMNOPQRSTUVWXYZ

    ## 0123456789

    ## aa bb cc

    ## rhythms

    ## xyz

    ## abc

    ## tragedy + time = humor

    ## http://www.jhsph.edu/

    ```'
  merge: -1
  img_proc: true
- pgno: 58
  md: '```

    egrep "\d" small.txt

    ```


    ## 0123456789


    ```

    egrep "\s" small.txt

    ```


    ## aa bb cc

    ## tragedy + time = humor


    As you can see in the example above, the \w metacharacter matches all letters,
    numbers, and even the underscore character (_). We can see the compliment of this
    grep by adding the -v flag to the command:


    ```

    egrep -v "\w" small.txt

    ```


    ## %#&/=-*%*=-&%#


    The -v flag (which stands for invert match) makes grep return all of the lines
    not matched by the regular expression. Note that the character sets for regular
    expressions also have their inverse sets: \W for non-words, \D for non-digits,
    and \S for non-spaces. Let’s take a look at using \W:


    ```

    egrep "\W" small.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 59
  md: '```

    ## aa bb cc

    ## tragedy + time = humor

    ## http://www.jhsph.edu/

    ## %#&.-=*#*-=%#

    ```


    The returned strings all contain non-word characters. Note the difference between
    the results of using the invert flag -v versus using an inverse set regular expression.


    In addition to general character sets we can also create specific character sets
    using square brackets ([ ]) and then including the characters we wish to match
    in the square brackets. For example the regular expression for the set of vowels
    is [aeiou]. You can also create a regular expression for the complement of a set
    by including a caret (^) in the beginning of a set. For example the regular expression
    [^aeiou] matches all characters that are not vowels. Let’s test both on small.txt:


    ```

    egrep "[aeiou]" small.txt

    ```


    ```

    ## abcdefghijklmnopqrstuvwxyz

    ## aa bb cc

    ## abc

    ## tragedy + time = humor

    ## http://www.jhsph.edu/

    ```


