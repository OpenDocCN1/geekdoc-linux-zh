  md: '# Start Building


    # Next Steps


    We’ve reached the end of this book, which means that you now have a formidable
    foundation in using Unix. Congratulations! As the title of this book suggests
    Unix serves mostly as a workbench - a set of tools for building amazing digital
    creations. However, what you can create with Unix is usually not made out of Unix’s
    constituent parts. You might use a hammer and saw to build a good birdhouse, but
    the birdhouse itself isn’t made out of hammers. Working knowledge of Unix is best
    complemented by knowing at least one other programming language. Here are a few
    suggestions about how you can continue your computing and programming education.


    Python⁴⁶ is an approachable and essential language for anyone interested in computing.
    If you don’t have any programming experience outside of this book, I very highly
    recommend learning Python. My favorite book on the subject is Learn Python the
    Hard Way⁴⁷ by Zed Shaw. Philip Guo’s Python Tutor⁴⁸ allows you to visualize how
    Python is working under-the-hood, which allows you to develop a better intuition
    about the code you’re writing. The pairing of those two resources is currently
    the best way to learn how to write'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'software outside of formal university or corporate training. Once you have
    some Python experience you can try building your own HTTP API with Flask⁴⁹.


    R⁵⁰ is a general purpose programming language designed for folks who are interested
    in data science, analysis, modeling, and visualization. R is also fantastic for
    making digital documents: this book was created with R! If you want to get started
    with R I recommend the book R Programming for Data Science⁵¹, the Swirl⁵² software
    package, and the interactive R tutorial website called DataCamp⁵³.


    JavaScript⁵⁴ is the main language that powers the internet and it forms the backbone
    of web application programming. The Mozilla Development Network has wonderful
    tutorials⁵⁵ about HTML, CSS, and JavaScript. Usually you use JavaScript to manipulate
    HTML and CSS, so learning about all three is important! I also recommend NodeSchool⁵⁶
    for purely learning about JavaScript with Unix.


    # Giving Feedback


    Thank you so much for reading this book! If you’d like to discuss the book or
    you have any feedback I would love to hear from you. The best way to contact me
    is on Twitter⁵⁷.'
