  img_proc: true
- pgno: 139
  md: "```\n```bash\n#!/usr/bin/env bash\n# File: addseq.sh\n\nfunction addseq {\n\
    \    sum=0\n\n    for element in $@\n    do\n        let sum=$sum+$element\n \
    \   done\n\n    echo $sum\n}\n```\n```\n\nIn the program above we initialize the\
    \ sum variable to be 0 so that we can add other values in the sequence to sum.\
    \ We then use a FOR loop to iterate through every element of $@, which is an array\
    \ of all the arguments we provide to addseq. Finally we echo the value of sum.\
    \ Let’s source this program and test it out:\n\n```\n```text\nsource addseq.sh\n\
    addseq 12 90 3\naddseq 0 1 1 2 3 5 8 13\naddseq\naddseq 4 6 6 6 4\n```\n```"
