    # Pipes


    One of the most powerful features of the command line is skilled use of the pipe
    (|) which you can usually find above the backslash (\ ) on your keyboard. The
    pipe allows us to take the output of a command, which would normally be printed
    to the console, and use it as the input to another command. It’s like fitting
    an actual pipe between the end of one program and connecting it to the top of
    another program! Let’s take a look at a basic example. We know the cat command
    takes the contents of a text file and prints it to the console:'
