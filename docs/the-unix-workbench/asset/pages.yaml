    \ our first simple function.\n\n```\n```bash\n#!/usr/bin/env bash\n# File: hello.sh\n\
    \nfunction hello {\n    echo \"Hello\"\n}\n\nhello\nhello\nhello\n```\n```\n\n\
    The entire structure of the function including the function keyword, the name\
