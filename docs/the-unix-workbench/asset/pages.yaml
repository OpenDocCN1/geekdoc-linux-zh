    # Search


    # Regular Expressions


    The ability to search through files and folders can greatly improve your productivity
    using Unix. First we’ll cover searching through text files. I recently downloaded
    a list of the names of the states in the US. Let’s take a look at this file:


    ```

    cd ~/Documents

    ls

    ```


    ```

    ## canada.txt

    ## states.txt

    ```


    ```

    wc states.txt

    ```'
