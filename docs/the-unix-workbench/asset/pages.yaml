    The condition in the IF statement was true, so only the first echo command was
    executed. Now let’s run the program with 5 as the first argument:


    ```

    bash simpleelif.sh 5

    ```


    ## 5 is a great number


    If first condition is false since 5 is not equal to 4, but then the next condition
    in the ELIF statement is true since 5 is greater than 3, so that echo command
    is executed and the rest of the statement is skipped. Try to guess what will happen
    if we use 2 as an argument:


    ```

    bash simpleelif.sh 2

    ```


    ## You entered: 2, not what I was looking for.


    Since 2 is neither equal to 4 nor greater than 5, the code in the ELSE statement
    is executed.


    You should also know that you can combine conditional execution, conditional expressions,
    and IF/ELIF/ELSE statements. The conditional execution operators AND (&&) and
    OR (||) can be used in an IF or ELIF statement. Let’s look at an example using
    these operators in an IF statement:'
