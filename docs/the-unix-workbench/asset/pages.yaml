- pgno: 141
  md: '# ## 10


    If we look back at the code for addseq.sh we can see that we created a variable
    in the function called sum. When you create variables in functions those variables
    become globally accessible, meaning that even after the program is finished that
    variable retains its value in your shell. We can easily verify this by echoing
    the value of sum:


    ```

    echo $sum

    ```


    # ## 10


    This is an example of one strategy we can use to retrieve values that a function
    has calculated. Unfortunately this approach is problematic because it changes
    the values of variables that we might be using in our shell. For example if we
    were storing some other important value in a variable called sum we would destroy
    that value by accident by running addseq. In order to avoid this problem it’s
    important that we use the local keyword when assigning variables within a function.
    The local keyword ensures that variables outside of our function are not overwritten
    by our function. Let’s create a new version of addseq called addseq2 which uses
    local when assigning variables.'
  merge: -1
  img_proc: true
- pgno: 142
  md: "```\n#!/usr/bin/env bash\n# File: addseq2.sh\n\nfunction addseq2 {\n    local\
    \ sum=0\n\n    for element in $@\n    do\n        let sum=sum+$element\n    done\n\
    \n    echo $sum\n}\n```\n\nNow let’s source both files so we demonstrate how local\
    \ helps us avoid overwriting variables.\n\n```\nsource addseq.sh\nsource addseq2.sh\n\
    sum=4444\naddseq 5 10 15 20\necho $sum\n```\n\n```\n## 50\n## 50\n```\n\nOur original\
    \ addseq overwrites the value we assigned to sum.\nNow let’s try addseq2."
