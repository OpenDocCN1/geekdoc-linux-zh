    构建**条件表达式**，它们是逻辑语句，其结果要么等价于 `true`（真），要么等价于 `false`（假）。条件表达式要么比较两个值，要么针对一个值进行判断。条件表达式总是放在双方括号（`[[
    ]]`）之间，并且要么使用**逻辑标志**，要么使用**逻辑运算符**。例如，有几种逻辑标志可用于比较两个整数。如果我们想判断一个整数是否大于另一个整数，可以使用
    `-gt`，也就是“大于”标志。在命令行中输入这个简单的条件表达式：


    ```

    [[ 4 -gt 3 ]]

    ```


    上面的逻辑表达式是在问：4 是否大于 3？控制台没有打印任何结果，所以我们来检查一下这个表达式的退出状态。


    ```

    echo $?

    ```


    ## 0


    看起来这个程序的退出状态是 0，与 `true`（真）的退出状态相同。这个条件表达式表示 `[[ 4 -gt 3 ]]` 等价于 `true`（真），我们当然知道这在逻辑上是成立的：4
    确实大于 3！那么，如果把这个表达式反过来，问“3 是否大于 4”会发生什么：


    ```

    [[ 3 -gt 4 ]]

    ```


    同样，控制台没有输出任何内容，所以我们看一下退出状态：


    echo $?


    # ## 1


    啊哈！显然 3 不大于 4，所以这个假的逻辑表达式产生的退出状态为 1，与 `false`（假）的退出状态相同！由于 `[[ 3 -gt 4 ]]` 和 `false`（假）的退出状态相同，它们本质上是等价的。为了快速测试条件表达式的逻辑值，我们可以使用
    AND 和 OR 运算符：如果表达式为真则输出 `t`，如果为假则输出 `f`：


    ```

    [[ 4 -gt 3 ]] && echo t || echo f

    [[ 3 -gt 4 ]] && echo t || echo f

    ```


    # ## t


    # ## f


    这是一个小技巧，你可以用它快速查看逻辑表达式的结果值。


    上面这些二元逻辑表达式会比较两个值；但还有一元逻辑表达式，它们只检查一个值。例如，你可以使用 `-e` 逻辑标志来测试某个文件是否存在。我们来看看这个标志的实际应用：


    ```

    cd ~/Code

    [[ -e math.sh ]] && echo t || echo f

    ```


    # ## t


    正如你看到的，`math.sh` 这个文件是存在的！在编写 bash 脚本时，大多数情况下你不是在比较两个原始值，也不是要判断某个原始值的情况，而是想针对变量中保存的值来构建逻辑语句。在逻辑表达式中，变量的行为与原始值完全一样。我们来看几个示例：


    ```

    number=7

    [[ $number -gt 3 ]] && echo t || echo f

    [[ $number -gt 10 ]] && echo t || echo f

    [[ -e $number ]] && echo t || echo f

    ```


    # ## t


    # ## f


    # ## f


    如你所见，7 大于 3，但不大于 10；并且当前目录下没有名为 `7` 的文件。逻辑标志还有其他多种类型，下表列出了其中一些标志：


    | 逻辑标志 | 含义 | 用法 |

    |---|---|---|

    | `-gt` | 大于 | `[[ $planets -gt 8 ]]` |

    | `-ge` | 大于或等于 | `[[ $votes -ge 270 ]]` |

    | `-eq` | 等于 | `[[ $fingers -eq 10 ]]` |

    | `-ne` | 不等于 | `[[ $pages -ne 0 ]]` |

    | `-le` | 小于或等于 | `[[ $candles -le 9 ]]` |

    | `-lt` | 小于 | `[[ $wires -lt 2 ]]` |

    | `-e` | 文件存在 | `[[ -e $taxes_2016 ]]` |

    | `-d` | 目录存在 | `[[ -d $photos ]]` |

    | `-z` | 字符串长度为零 | `[[ -z $name ]]` |

    | `-n` | 字符串长度不为零 | `[[ -n $name ]]` |


    在进入下一节之前，请在命令行中逐个尝试这些标志。


    除了逻辑标志，还有逻辑运算符。其中最有用的逻辑运算符之一是正则匹配运算符 `=~`。正则匹配运算符会将字符串与正则表达式进行比较：如果字符串能够匹配该正则表达式，则表达式等价于
    `true`（真）；否则等价于 `false`（假）。我们用几种不同的方式测试一下这个运算符：


