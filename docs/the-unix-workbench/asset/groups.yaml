  - '[PAGE 197]


    +   - You can create lists with hyphens (-) or numbers (1., 2., 3.).

    +   - Code can be placed in the middle of a line with single backticks (`code`).

    +   - A code block can be created by putting code in between a set of triple backticks
    (```).

    +   - You can insert a link with brackets and parentheses ([Link text here](http://jhu.edu)).

    +   - You can use an image with an exclamation point, and a link to an image (![Alt
    text here](http://jhu.edu/jeff.jpg))


    Personally I really enjoy writing with Markdown, to the point where I wrote this
    entire book²³ in Markdown! We’re going to be using Markdown for the rest of this
    chapter, so I suggest that you take a few minutes to play around with the syntax
    in this in-browser Markdown editor²⁴. For more information about Markdown see
    GitHub’s helpful Mastering Markdown²⁵ guide.


