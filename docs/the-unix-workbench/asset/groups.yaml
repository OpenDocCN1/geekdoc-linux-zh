    Before the WHILE the count variable is set to be 3, but then each time the WHILE
    loop is executed 1 is subtracted from the value of count. The loop then starts
    from the top again and the conditional expression is re-checked to see if it’s
    still equivalent to true. After three iterations through the loop count is equal
    to 0 since 1 is subtracted from count in every iteration. Therefore the logical
    expression [[ $count -gt 0 ]] is no longer equal to true and the loop ends. By
    changing the value of the variable in the logical expression inside of the loop
    we’re able to ensure that the logical expression will eventually be equivalent
    to false, and therefore the loop will eventually end.


    If the logical expression is never equivalent to false then we’ve created an infinite
    loop, so the loop never ends and the program runs forever. Obviously we would
    like for our programs to end eventually, and therefore creating infinite loops
    is undesirable. However let’s create an infinite loop so we know what to do if
    we get into a situation where our program won’t terminate. With a simple “typo”
    we can change the program above so that it runs forever but substituting the minus
    sign - with a plus sign + so that count is always greater than zero (and growing)
    after every iteration.'
