    # ## Summary


    +   - `history` displays what commands we’ve entered into the console since opening
    our current terminal.

    +   - The `~/.bash_history` file lists commands we’ve used in the past.

    +   - `alias` creates a command that can be used as a substitute for a longer
    command that we use often.

    +   - The `~/.bash_profile` is a text file that is run every time we start a shell,
    and it’s the best place to assign aliases.


    # ## Differentiate


    It’s important to be able to examine differences between files. First let’s make
    two small simple text files in the Documents directory.


    ```

    ```bash

    cd ~/Documents

