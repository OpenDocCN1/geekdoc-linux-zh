    ## 6. 要运行的命令（command）


    表中的每一列由单个空格分隔。前五列允许你指定希望运行特定命令的时间。每一列中只有特定的值是有效的：


    - 1. 分钟：00 - 59（一小时内特定的一分钟）

    - 2. 小时：00 - 23（0 是午夜时刻）

    - 3. 月份中的日期：01 - 31（1 是当月的第一天）

    - 4. 月份：01 - 12（1 是一月）

    - 5. 星期中的日期 0 - 6（0 是星期日）


    cron 表中还有一些其他有效字符。最常用的字符是星号（*），它代表一列中的所有可能值。因此，分钟列中的星号表示“每分钟运行”，小时列中的星号表示“每小时运行”。知道了这一点，让我们在
    cron 表中创建第一个条目。如果我们希望一个命令在每分钟、每小时、每个月的每一天、每个月、每周的每一天都执行，那么我们可以把星号放在前五列中，后面跟上我们想运行的命令。在这个例子中，cron
    将每分钟运行的命令是 `date >> ~/date-file.txt`，它会将命令执行时的日期和时间追加到我们主目录中一个名为 date-file.txt
    的文件中。这就是你保存并退出 nano 之前 cron 表应该看起来的样子：


    ```

    # Edit this file to introduce tasks to be run by \ cron.

    #

    # m h dom mon dow command

    * * * * * date >> ~/date-file.txt

    ```


    像保存普通文本文件一样保存并退出 nano，然后稍等片刻！一分钟过去后，使用 cat 查看 ~/date-file.txt：


    ```

    cd

    cat date-file.txt

    ```


    ```

    ## Thu Jun 8 18:50:01 UTC 2017

    ```


    看起来我们 cron 表中的条目正在生效！再等一分钟，然后再次查看该文件：


    ```

    cat date-file.txt

    ```


    ```

    ## Thu Jun 8 18:50:01 UTC 2017

    ## Thu Jun 8 18:51:01 UTC 2017

    ```


    除非我们删除在 cron 表中输入的那一行，否则 date 的输出将每分钟追加到 date-file.txt。


    单行 bash 命令 `date >> ~/date-file.txt` 是一个比我们通常在 cron 表中可能使用的程序简单得多的程序，尽管它很适合说明
    cron 表的工作原理。如果


    你想用 cron 执行更复杂的任务，最好让 cron 执行你预先编写的 bash 脚本。这样，你可以只需在表的最后一列指定 `bash /path/to/script.sh`。


    在所有列中使用星号是 cron 表中最简单的一行，所以让我们看一些更复杂的表条目的例子：


    ```

    # m h dom mon dow   command

    00 * * * * bash /path/to/script.sh    # Runs every hour at the start of the hour

    00 12 * * * bash /path/to/script.sh    # Runs every day at noon

    * 12 * * * bash /path/to/script.sh    # Runs every minute between 12pm and 12:59pm

    00 00 05 * * bash /path/to/script.sh    # Runs the 5th day of every month at midnight

    00 00 * 07 * bash /path/to/script.sh    # Runs every day in the month of July
    at midnight

    00 00 * * 2 bash /path/to/script.sh    # Runs every Tuesday at midnight

    ```


    除了数字和星号之外，cron 表列中还可以使用一些其他字符，包括用于指定范围的连字符（-）和用于指定项目列表的逗号（,）。例如，分钟列中的 00-29 将指定一小时的前三十分钟，而星期列中的
    1,5 将指定星期一和星期五。


    让我们再看一个使用连字符和范围的 cron 表示例，以便你了解每个字符的作用。


    ```

    # m h dom mon dow   command

    00-04 * * * * bash /path/to/script.sh    # Runs every minute for the first five
    minutes of every hour

    ```


    ```

    00 00 * * 0,6 bash /path/to/script.sh    # Runs at midnight every Saturday and
    Sunday

    ```


    ```

    00 03 01-15 * * bash /path/to/script.sh    # Runs at 3am for the first fifteen
    days of every month

    ```


    ```

    00,30 * * * * bash /path/to/script.sh    # Runs at the start and middle of every
    hour

    ```


    ```

    00 00,12 * * * bash /path/to/script.sh    # Runs every day at midnight and noon

    ```


    ```

    00 * 01-07 01,06 * bash /path/to/script.sh    # Runs at the start of every hour
    for the first seven days of the months of January and June

    ```


    由 cron 运行的程序，其强大程度只受你的想象力限制！如果你熟悉社交网络 Twitter³⁹，那么你可能遇到过一些自动创建帖子的 Twitter 账户，比如
    Emoji Aquarium⁴⁰、Old Fruit Pictures⁴¹ 或 Endless Screaming⁴²。许多这类“机器人”账户都是由 cron
    驱动的，cron 使用 Twitter 的 HTTP API 定期发布推文。


    ## 总结


    - scp 在云计算机和你的本地计算机之间复制文件


    ³⁹ https://twitter.com/

    ⁴⁰ https://twitter.com/emojiaquarium

    ⁴¹ https://twitter.com/pomological

    ⁴² https://twitter.com/infinite_scream


    '
