    \ Unix 就是他们的工作台。Unix 在一个不受干扰的环境中提供了一套必要而简单的工具。即使你不是软件开发者，学习 Unix 也能帮你打开新的思维方式，并以新颖的方式扩展你的想法。我写这本书，就是希望通过写出我当年会想要的那本书，帮助你开始使用\
    \ Unix。\n"
