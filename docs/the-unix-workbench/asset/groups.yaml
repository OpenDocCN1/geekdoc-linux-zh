  md: '

    your code in these public repositories. If you want to keep your code private
    then you can pay GitHub for private remote repositories.


    If you''re working on code together with a friend GitHub can help you sync changes
    to code files between you and your friend. There''s also a social and community
    aspect to GitHub, since you can watch other programmers develop their projects.
    GitHub also makes it easy to jump in and help somebody with their project. GitHub
    offers many other useful features which we will discuss at length.


    ## Setting Up Git and GitHub


    Before setting up Git, go to GitHub¹⁹ and create a free account. Take note of
    which email address you use and which username you choose.


    To see if you have Git installed open up your terminal and enter the following:


    ```

    git --version

    ```


    ```

    ## git version 2.11.0 (Apple Git-81)

    ```


    If you don''t get a response back telling you the version of Git that you have
    installed then you need to install Git. You can find instructions for installing
    Git on your operating system here²⁰.


    Open up your shell once you have git installed and run git --version again to
    make sure that installation succeeded (you may need to restart your shell or your
    computer). After Git is installed we need to set up two environmental variables,
    but we only need to do this once. The first variable we need to set up with Git
    is your GitHub user name, and the second variable is the email address that you
    used to create your GitHub account:


    ```

    git config --global user.name "myUserName"

    git config --global user.email myName@email.com

    ```


    ## Getting Started with Git


    Let’s create our first Git repository. First we need to create a directory:


    ```

    cd

    mkdir my-first-repo

    cd my-first-repo

    ```


    “Repo” in this case is just shorthand for “repository.” To start tracking files
    with Git in a directory enter git init into the command line:


    ```

    git init

    ```


    ```

    ## Initialized empty Git repository in /Users/sea\n/my-first-repo/.git/

    ```


    You’ve just created your first repository! Now let’s create a file and start tracking
    it.


    ```

    echo "Welcome to My First Repo" > readme.txt

    ```


    Now that we’ve created a file in this Git repository, let’s use git status to
    see what’s going on in this repository. We’ll be using git status continuously
    throughout this chapter in order to get information about the status of this Git
    repository.


    ```

    git status

    ```


    ```

    ## On branch master

    ##

    ## Initial commit

    ##

    ## Untracked files:

    ##   (use "git add <file>..." to include in what \

    will be committed)

    ##

    ##       readme.txt

    ##

    ## nothing added to commit but untracked files pr\

    esent (use "git add" to track)

    ```


    As you can see readme.txt is listed as an untracked file. In order to let Git
    know that you want to track this file we need to use git add with the name of
    the file that we want to track. Let’s start tracking readme.txt:


    ```

    git status

    ```


    ```

    ## On branch master

    ##

    ## Initial commit

    ##

    ## Untracked files:

    ##   (use "git add <file>..." to include in what \

    will be committed)

    ##

    ##

    ##     readme.txt

    ##

    ```


    Our repository is right back to the way it started with readme.txt as an unstaged
    file. Let''s start tracking readme.txt again so we can move on to cooler Git features.


    ```

    git add readme.txt

    ```


    Now that Git is tracking readme.txt we need to create a milestone to indicate
    the changes that we made to readme.txt. In this case, the changes that we made
    were creating the file in the first place! This milestone is called a commit in
    Git. A commit logs the content of all of the currently staged files. Right now
    we only have readme.txt staged so let''s commit the creation of this file. When
    making a Git commit, we need to write a commit message which is specified after
    the -m flag. The message should briefly describe what changes you''ve made since
    the last commit.


    ```

    git commit -m "added readme.txt"

    ```


    ```

    ## [master (root-commit) 73e53ca] added readme.txt

    ## 1 file changed, 1 insertion(+)

    ## create mode 100644 readme.txt

    ```


    The message above confirms that the commit succeeded and it summarizes the changes
    that took place since the last commit. As you can see in the message we only changed
    one file, and we only changed one line in that file. Let''s run git status again
    to see the state of our repository after we''ve made the first commit:


    ```

    git status

    ```


    ```

    ## On branch master

    ## nothing to commit, working tree clean

    ```


    All of the changes to the files in this repository have been committed! Let''s
    add a few more files to this repository and commit them.


    ```

    touch file1.txt

    touch file2.txt

    ls

    ```

    '
  mdcn: '


    你的代码在这些公共仓库中。如果想让你的代码保持私有，你可以向 GitHub 付费以获得私有远程仓库。


    如果你和朋友一起编写代码，GitHub 可以帮助你将代码文件的更改在你和朋友之间同步。GitHub 还有社交和社区方面的功能，因为你可以观看其他程序员开发他们的项目。GitHub
    也让参与并帮助某人的项目变得很容易。GitHub 提供了许多其他有用的功能，我们将在后面详细讨论。


    ## 设置 Git 和 GitHub


    在设置 Git 之前，先去 GitHub¹⁹ 创建一个免费账户。注意你使用的电子邮件地址和选择的用户名。


    要查看是否已安装 Git，请打开终端并输入以下内容：


    ```

    git --version

    ```


    ```

    ## git version 2.11.0 (Apple Git-81)

    ```


    如果没有得到关于你已安装的 Git 版本的回复，那么你需要安装 Git。你可以在这里²⁰ 找到在你的操作系统上安装 Git 的说明。


    在安装好 git 后打开你的 shell 并再次运行 git --version 以确保安装成功（你可能需要重启 shell 或计算机）。安装 Git 后，我们需要设置两个环境变量，但我们只需要做一次。第一个需要用
    Git 设置的变量是你的 GitHub 用户名，第二个变量是你用来创建 GitHub 账户的电子邮件地址：


    ```

    git config --global user.name "myUserName"

    git config --global user.email myName@email.com

    ```


    ## 开始使用 Git


    让我们创建我们的第一个 Git 仓库。首先我们需要创建一个目录：


    ```

    cd

    mkdir my-first-repo

    cd my-first-repo

    ```


    这里的“Repo”只是“repository”的简写。要开始在目录中使用 Git 跟踪文件，请在命令行中输入 git init：


    ```

    git init

    ```


    ```

    ## Initialized empty Git repository in /Users/sea\n/my-first-repo/.git/

    ```


    你刚刚创建了你的第一个仓库！现在让我们创建一个文件并开始跟踪它。


    ```

    echo "Welcome to My First Repo" > readme.txt

    ```


    现在我们已经在这个 Git 仓库中创建了一个文件，让我们使用 git status 来看看这个仓库发生了什么。我们将在本章中持续使用 git status
    来获取有关此 Git 仓库状态的信息。


    ```

    git status

    ```


    ```

    ## On branch master

    ##

    ## Initial commit

    ##

    ## Untracked files:

    ##   (use "git add <file>..." to include in what \

    will be committed)

    ##

    ##       readme.txt

    ##

    ## nothing added to commit but untracked files pr\

    esent (use "git add" to track)

    ```


    正如你所见，readme.txt 被列为未跟踪文件。为了让 Git 知道你想要跟踪此文件，我们需要使用 git add 并加上我们想要跟踪的文件名。让我们开始跟踪
    readme.txt：


    ```

    git status

    ```


    ```

    ## On branch master

    ##

    ## Initial commit

    ##

    ## Untracked files:

    ##   (use "git add <file>..." to include in what \

    will be committed)

    ##

    ##

    ##     readme.txt

    ##

    ```


    我们的仓库又回到了初始状态，readme.txt 仍是一个未暂存文件。让我们再次开始跟踪 readme.txt，以便我们继续使用更酷的 Git 功能。


    ```

    git add readme.txt

    ```


    现在 Git 正在跟踪 readme.txt，我们需要创建一个里程碑来表示我们对 readme.txt 所做的更改。在这种情况下，我们所做的更改就是创建该文件本身！在
    Git 中，这个里程碑称为提交。提交会记录所有当前已暂存文件的内容。现在我们只有 readme.txt 已暂存，所以让我们提交此文件的创建。当进行 Git
    提交时，我们需要写一条提交信息，它在 -m 标志之后指定。该信息应简要描述自上次提交以来你所做的更改。


    ```

    git commit -m "added readme.txt"

    ```


    ```

    ## [master (root-commit) 73e53ca] added readme.txt

    ## 1 file changed, 1 insertion(+)

    ## create mode 100644 readme.txt

    ```


    上面的消息确认提交成功，并总结了自上次提交以来发生的更改。正如你在消息中看到的，我们只更改了一个文件，并且只更改了该文件中的一行。让我们再次运行 git status
    来查看我们在进行第一次提交后仓库的状态：


    ```

    git status

    ```


    ```

    ## On branch master

    ## nothing to commit, working tree clean

    ```


    此仓库中文件的所有更改都已提交！让我们再向此仓库添加几个文件并提交它们。


    ```

    touch file1.txt

    touch file2.txt

    ls

    ```


