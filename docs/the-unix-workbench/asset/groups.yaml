    \ use for comparing two integers. If we wanted to see if one integer was greater\
    \ than another we could use -gt, the greater than flag. Enter this simple conditional\
    \ expression into the command line:\n\n```\n[[ 4 -gt 3 ]]\n```\n\nThe logical\
    \ expression above is asking: Is 4 greater than 3? No result is printed to the\
    \ console so let’s check the exit status of that expression.\n\n```\necho $?\n\
    ```\n\n## 0\n\nIt looks like the exit status of this program is 0, the same exit\
    \ status as true. This conditional expression is saying that [[ 4 -gt 3 ]] is\
    \ equivalent to true, which of course we know is logically consistent, 4 is in\
    \ fact greater than 3! Let’s see what happens if we flip the expression around\
    \ so we’re asking if 3 is greater than 4:\n\n```\n[[ 3 -gt 4 ]]\n```\n\nAgain,\
    \ nothing is printed to the console so we’ll look at the exit status:\n\necho\
