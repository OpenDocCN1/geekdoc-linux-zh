    If you don’t type anything after the prompt and you press enter then nothing happens
    and you get a new prompt under the old prompt. The white rectangle after the prompt
    is just a cursor that allows you to edit what you’ve typed into the shell. Your
    cursor might look like a rectangle, a line, or an underscore, but all cursors
    behave the same way. After typing something into the command line you can move
    the cursor back and forth with the left and right arrow keys, just like you would
    when typing an email.


    Don’t you think your shell looks messy with all of those old prompts? Don’t worry,
    you’re about to learn your first shell command which will clear up your shell!
    Type clear at the prompt and then hit enter. Voila! Your shell is back to how
    you started.


    Every command line command is actually a little computer program, even commands
    as simple as clear. These commands all tend to have the following structure:


    ```

    `{command} {options} {arguments}`

    ```


    Some simple commands like clear don’t require any options or arguments. Options
    are usually preceded by a hyphen (-) and they tweak the behavior of the command.
    Arguments can be names of files, raw data, or other options that the command'
