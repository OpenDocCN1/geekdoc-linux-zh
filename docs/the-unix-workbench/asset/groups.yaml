    A program that is being run by cron is only as powerful as your imagination can
    stretch! If you’re familiar with the social network Twitter³⁹ then you might have
    come across some Twitter accounts which create posts automatically like Emoji
    Aquarium⁴⁰, Old Fruit Pictures⁴¹, or Endless Screaming⁴². Many of these "bot"
    accounts are powered by cron, which uses Twitter’s HTTP API to post tweets regularly.


