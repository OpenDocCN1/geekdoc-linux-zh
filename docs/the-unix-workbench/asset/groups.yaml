    the_empire_state="New York"

    echo $the_empire_state

    ```


    ```

    New York

    ```


    Occasionally you might want to run a command like you would on the command line
    and store the result of that command in a variable. We can do this by wrapping
    the command in a dollar sign and parentheses `$( )` around a command. This syntax
    is called command substitution. The command is executed and then gets replaced
    by the string that resulted from running the command. For example if we wanted
    to store the number of lines in `math.sh`:


    ```

    math_lines=$(cat math.sh | wc -l)

    echo $math_lines

    ```


    ```

    7

    ```


    Variable names with a dollar sign can also be used inside other strings in order
    to insert the value of the variable into the string:


    ```

    echo "I went to school in $the_empire_state."

    ```


    ```

    I went to school in New York.

    ```


    When writing a Bash script, the script gives you a few variables for free. Let’s
    create a new file called `vars.sh` with the following code:


    ```

    #!/usr/bin/env bash

    # File: vars.sh

    echo "Script arguments: $@"

    echo "First arg: $1. Second arg: $2."

    echo "Number of arguments: $#"

    ```


    Now let’s try running the script a few times in a few different ways:


    ```

    bash vars.sh

    ```


    ```

    Script arguments:

    First arg: . Second arg: .

    Number of arguments: 0

    ```


    ```

    bash vars.sh red

    ```


    ```

    Script arguments: red

    First arg: red. Second arg: .

    Number of arguments: 1

    ```


    ```

    bash vars.sh red blue

    ```


    ```

    Script arguments: red blue

    First arg: red. Second arg: blue.

    Number of arguments: 2

    ```


    ```

    bash vars.sh red blue green

    ```


    ```

    Script arguments: red blue green

    First arg: red. Second arg: blue.

    Number of arguments: 3

    ```


    Your script can accept arguments just like a command line program! The first argument
    to your script is stored in `$1`, the second argument is stored in `$2`, etc.
    etc. An array of all of the arguments passed to your script is stored in `$@`,
    and we’ll discuss how to handle arrays later on in this chapter. The total number
    of arguments passed to your script is stored in `$#`.


    ## Summary


    - Variables can be assigned with the equal sign (`=`) operator.

    - Strings or numbers can be assigned to variables.

    - The value of a variable can be accessed with the dollar sign (`$`) before the
    variable name.

    - You can use the dollar sign and parentheses syntax (command substitution) to
    execute a command and save the output in a variable.

    - You can access command line arguments within your own scripts using the dollar
    sign followed by the number of the argument.


    ## Exercises


    - Write a Bash program where you assign two numbers to different variables, and
    then the program prints the sum of those variables.

    - Write another Bash program where you assign two strings to different variables,
    and then the program prints both of those strings. Write a version where the strings
    are printed on the same line, and a version where the strings are printed on different
    lines.

    - Write a Bash program that prints the number of arguments provided to that program
    multiplied by the first argument provided to the program.


