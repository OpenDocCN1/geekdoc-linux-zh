    # If and Else


    Conditional expressions are powerful because you can use them to control how a
    Bash program that you’re writing is executed. One of the fundamental constructs
    in Bash programming is the IF statement. Code written inside of an IF statement
    is only executed if a certain condition is true, otherwise the code is skipped.
    Let’s write a small program with an IF statement:'
