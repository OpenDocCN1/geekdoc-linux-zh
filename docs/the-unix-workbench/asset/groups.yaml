  md: "\n## 3. Run make.\n\nThis is accomplished by specifying a file called makefile,\
    \ which describes the relationships between different files and programs. In addition\
    \ to installing programs, make is also useful for creating documents automatically.\
    \ Let’s build up a makefile that creates a readme.txt file which is automatically\
    \ populated with some information about our current directory.\n\nLet’s start\
    \ by creating a very basic makefile with nano:\n\n```\ncd ~/Documents/Journal\n\
    nano makefile\n```\n\n```\ndraft_journal_entry.txt:\n    touch draft_journal_entry.txt\n\
    ```\n\nThe simple makefile above illustrates a rule which has the following general\
    \ format:\n\n```\n[target]: [dependencies...]\n  [commands...]\n```\n\nIn the\
    \ simple example we created draft_journal_entry.txt is the target, a file which\
    \ is created as the result of the command(s). It’s very important to note that\
    \ any commands under a target must be indented with a Tab. If we don’t use Tabs\
    \ to indent the commands then make will fail. Let’s save and close the makefile,\
    \ then we can run the following in the console:\n\n```\nls\n```\n\n```\n## makefile\n\
    ```\n\nLet’s use the make command with the target we want to be “made” as the\
    \ only argument:\n\n```\nmake draft_journal_entry.txt\n```\n\n```\n## touch draft_journal_entry.txt\n\
    ```\n\n```\nls\n```\n\n```\n## draft_journal_entry.txt\n```\n\n```\n## makefile\n\
    ```\n\nThe commands that are indented under our definition of the rule for the\
    \ draft_journal_entry.txt target were executed, so now draft_journal_entry.txt\
    \ exists! Let’s try running the same make command again:\n\n```\nmake draft_journal_entry.txt\n\
    ```\n\n## make: 'draft_journal_entry.txt' is up to date.\n\nSince the target file\
    \ already exists no action is taken, and instead we’re informed that the rule\
    \ for draft_journal_entry.txt is “up to date” (there’s nothing to be done).\n\n\
    If we look at the general rule format we previously sketched out, we can see that\
    \ we didn’t specify any dependencies for this rule. A dependency is a file that\
    \ the target depends on in order to be built. If a dependency has been updated\
    \ since the last time make was run for a target then the target is not “up to\
    \ date.” This means that the commands for that target will be run the next time\
    \ make is run for that target. This way, the changes to the dependency are incorporated\
    \ into the target. The commands are only run when the dependencies or change,\
    \ or when the target doesn’t exist at all, in order to avoid running commands\
    \ unnecessarily.\n\nLet’s update our makefile to include a readme.txt that is\
    \ built automatically. First, let’s add a table of contents for our journal:\n\
    \n```\necho \"1. 2017-06-15-In-Boston\" > toc.txt\n```\n\nNow let’s update our\
    \ makefile with nano to automatically generate a readme.txt:\n\n```\nnano makefile\n\
    ```\n\ndraft_journal_entry.txt:\n    touch draft_journal_entry.txt\n\nreadme.txt:\
    \ toc.txt\n\n```\necho \"This journal contains the following number of entries:\"\
    \ > readme.txt\nwc -l toc.txt | egrep -o \"[0-9]+\" >> readme.txt\n```\n\nTake\
    \ note that the -o flag provided to egrep above extracts the regular expression\
    \ match from the matching line, so that only the number of lines is appended to\
    \ readme.txt. Now let’s run make with readme.txt as the target:\n\n```\nmake readme.txt\n\
    ```\n\n```\n## echo \"This journal contains the following number of entries:\"\
    \ > readme.txt\n## wc -l toc.txt | egrep -o \"[0-9]+\" >> readme.txt\n```\n\n\
    Now let’s take a look at readme.txt:\n\n```\ncat readme.txt\n```\n\n```\n## This\
    \ journal contains the following number of entries:\n## 1\n```\n\nLooks like it\
    \ worked! What do you think will happen if we run make readme.txt again?\n\nmake\
    \ readme.txt\n\n```\n## make: 'readme.txt' is up to date.\n```\n\nYou guessed\
    \ it: nothing happened! Since the `readme.txt` file still exists and no changes\
    \ were made to any of the dependencies for `readme.txt` (`toc.txt` is the only\
    \ dependency) `make` doesn’t run the commands from the `readme.txt` rule. Now\
    \ let’s modify `toc.txt` then we’ll try running make again.\n\n```\necho \"2.\
    \ 2017-06-16-IQSS-Talk\" >> toc.txt\nmake readme.txt\n```\n\n```\n## echo \"This\
    \ journal contains the following number of entries:\" > readme.txt\n## wc -l toc.txt\
    \ | egrep -o \"[0-9]+\" >> readme.txt\n```\n\nLooks like it ran! Let’s check readme.txt\
    \ to make sure.\n\n```\ncat readme.txt\n```\n\n```\n## This journal contains the\
    \ following number of entries:\n## 2\n```\n"
  mdcn: "\n\n## 3. 运行 make。\n\n这是通过指定一个名为 makefile 的文件来实现的，该文件描述了不同文件和程序之间的关系。除了安装程序之外，make\
    \ 对于自动创建文档也很有用。让我们构建一个 makefile，它会创建一个 readme.txt 文件，该文件会自动填充有关我们当前目录的一些信息。\n\n\
    让我们先用 nano 创建一个非常基本的 makefile：\n\n```\ncd ~/Documents/Journal\nnano makefile\n\
    ```\n\n```\ndraft_journal_entry.txt:\n    touch draft_journal_entry.txt\n```\n\
    \n上面的简单 makefile 说明了一条规则，其一般格式如下：\n\n```\n[target]: [dependencies...]\n  [commands...]\n\
    ```\n\n在我们创建的简单示例中，draft_journal_entry.txt 是目标，即作为命令执行结果而创建的文件。必须注意的是，目标下的任何命令都必须使用\
    \ Tab 进行缩进。如果我们不使用 Tab 来缩进命令，则 make 将会失败。让我们保存并关闭 makefile，然后我们可以在控制台中运行以下命令：\n\
    \n```\nls\n```\n\n```\n## makefile\n```\n\n让我们使用 make 命令，并将我们想要“构建”的目标作为唯一参数：\n\
    \n```\nmake draft_journal_entry.txt\n```\n\n```\n## touch draft_journal_entry.txt\n\
    ```\n\n```\nls\n```\n\n```\n## draft_journal_entry.txt\n```\n\n```\n## makefile\n\
    ```\n\n在我们对 draft_journal_entry.txt 目标的规则定义下缩进的命令被执行了，所以现在 draft_journal_entry.txt\
    \ 存在了！让我们再试一次运行相同的 make 命令：\n\n```\nmake draft_journal_entry.txt\n```\n\n## make:\
    \ 'draft_journal_entry.txt' is up to date.\n\n由于目标文件已存在，因此不会采取任何操作，而是告知 draft_journal_entry.txt\
    \ 的规则是“最新的” （无需执行任何操作）。\n\n如果我们查看之前草拟的一般规则格式，我们可以看到我们没有为此规则指定任何依赖项。依赖项是目标在构建时所依赖的文件。如果自上次为目标运行\
    \ make 以来依赖项已被更新，则目标不是“最新的”。这意味着下次为该目标运行 make 时，该目标的命令将被运行。这样，依赖项的更改就会被合并到目标中。命令仅在依赖项发生更改或目标根本不存在时才运行，以避免不必要的运行。\n\
    \n让我们更新我们的 makefile 以包含一个自动构建的 readme.txt。首先，让我们为我们的日志添加一个目录：\n\n```\necho \"\
    1. 2017-06-15-In-Boston\" > toc.txt\n```\n\n现在让我们用 nano 更新 makefile 以自动生成 readme.txt：\n\
    \n```\nnano makefile\n```\n\ndraft_journal_entry.txt:\n    touch draft_journal_entry.txt\n\
    \nreadme.txt: toc.txt\n\n```\necho \"This journal contains the following number\
    \ of entries:\" > readme.txt\nwc -l toc.txt | egrep -o \"[0-9]+\" >> readme.txt\n\
    ```\n\n请注意，上面提供给 egrep 的 -o 标志会从匹配的行中提取正则表达式匹配项，因此只有行数会被追加到 readme.txt 中。现在让我们以\
    \ readme.txt 为目标运行 make：\n\n```\nmake readme.txt\n```\n\n```\n## echo \"This journal\
    \ contains the following number of entries:\" > readme.txt\n## wc -l toc.txt |\
    \ egrep -o \"[0-9]+\" >> readme.txt\n```\n\n现在让我们查看 readme.txt：\n\n```\ncat readme.txt\n\
    ```\n\n```\n## This journal contains the following number of entries:\n## 1\n\
    ```\n\n看起来成功了！你认为如果我们再次运行 make readme.txt 会发生什么？\n\nmake readme.txt\n\n```\n##\
    \ make: 'readme.txt' is up to date.\n```\n\n你猜对了：什么也没发生！由于 `readme.txt` 文件仍然存在，并且\
    \ `readme.txt` 的任何依赖项都没有被更改（`toc.txt` 是唯一的依赖项），`make` 不会运行来自 `readme.txt` 规则的命令。现在让我们修改\
    \ `toc.txt`，然后再试一次运行 make。\n\n```\necho \"2. 2017-06-16-IQSS-Talk\" >> toc.txt\n\
    make readme.txt\n```\n\n```\n## echo \"This journal contains the following number\
    \ of entries:\" > readme.txt\n## wc -l toc.txt | egrep -o \"[0-9]+\" >> readme.txt\n\
    ```\n\n看起来它运行了！让我们检查 readme.txt 以确保。\n\n```\ncat readme.txt\n```\n\n```\n## This\
    \ journal contains the following number of entries:\n## 2\n```\n\n"
