  mdcn: "\n\n在我最初学习 Unix 的时候。如果你对这本书有任何补充、修正或评论，请提交 issue 或 pull request 到：https://github.com/seankross/the-unix-workbench。如果你不确定\
    \ pull request 是什么，别担心，你会在本书的 Git 和 GitHub 章节中找到答案！\n\n## 什么是 Unix？\n\nUnix 是一个操作系统，也是一套工具。本书中我们最常用的工具是\
    \ shell（壳），它是一个提供命令行界面的计算机程序。你很可能在电影里见过命令行界面：一位精英电脑黑客坐在黑屏绿字的显示器前，疯狂地敲入命令，并大喊诸如“干掉他们！”之类的话。使用命令行界面可以让你在\
    \ shell（也称为控制台）中输入代码行，这些代码指示你的计算机执行特定任务。在本书中，我可能会交替使用“命令行”“shell”和“控制台”这几个术语。你将在“命令行基础”章节中学习如何使用命令行。\n\
    \nShell 是一种非常直接且强大的操作计算机的方式。你可以创造出帮助成千上万人的精彩作品，也可能对自己和他人造成巨大破坏。正如 Benjamin Parker¹\
    \ 曾经说过：“能力越大，责任越大。”\n\n市面上有好几种流行的 shell 程序，但本书中我们将使用一种名为 Bash 的 shell，因为它是 Mac\
    \ 和 Ubuntu 上的默认 shell 程序。\n\n## 获取 Unix\n\n> 不可或缺之物，往往价值不高。——俄罗斯谚语\n\n### Mac\
    \ 与 Ubuntu 用户\n\n如果你使用的是 Mac 或 Ubuntu 操作系统，请找到名为 **终端（Terminal）** 的程序并打开它。你可以跳过下一节关于\
    \ Windows 的内容。\n\n### Windows\n\n如果你使用的是最新版本的 Windows 10，你应该在 Windows 上启用并安装“适用于\
    \ Windows 的 Ubuntu 上的 Bash”。你可以在这里找到微软的安装指南²。\n\n如果你的 Windows 10 不是最新版本，你应该下载\
    \ VirtualBox³，然后用 VirtualBox 安装最新版本的 Ubuntu。此类安装说明往往会随时间略有变化，因此我建议你用 Google 搜索“how\
    \ to install Ubuntu on Windows with VirtualBox”，然后按照你找到的说明进行操作。\n\n² https://msdn.microsoft.com/en-us/commandline/wsl/install_guide\
    \  \n³ https://www.virtualbox.org/\n\n## 命令行基础\n\n> 星星之火，可以燎原。——盖尔谚语\n\n### 你好，终端！\n\
    \n打开终端后，你应该会看到一个窗口，看起来像这样：\n\n![](img/a67f2d2ba01c2569ec78ab34ae6c3c5a_9_0.png)\n\
    \n你看到的就是 bash shell！你的 shell 看起来肯定和我的不一样，但所有 bash shell 都有相同的基本组成部分。正如你在我的 shell\
    \ 中看到的，它显示为 seans-air:~ sean$。这串字符被称为提示符（prompt）。你在提示符后输入命令行命令。提示符只是让你知道 shell\
    \ 已经准备好接收命令。在键盘上按几次回车键，看看提示符会发生什么变化。你的 shell 现在应该看起来像这样：\n\n![](img/a67f2d2ba01c2569ec78ab34ae6c3c5a_10_0.png)\n\
    \n如果你在提示符后不输入任何内容就按回车，什么也不会发生，你会在旧提示符下方得到一个全新的提示符。提示符后面的白色矩形只是光标，允许你编辑在 shell\
    \ 中输入的内容。你的光标可能看起来像矩形、竖线或下划线，但所有光标的行为方式都一样。在命令行中输入内容后，你可以使用左右方向键来回移动光标，就像写电子邮件一样。\n\
    \n你不觉得 shell 里满是旧提示符很乱吗？别担心，你即将学到第一个 shell 命令，它能帮你清理 shell！在提示符处输入 clear，然后按回车。瞧！你的\
