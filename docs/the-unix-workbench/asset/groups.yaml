    正则表达式不仅仅局限于使用字符和字符串进行搜索，正则表达式的真正威力来自于使用元字符。记住，元字符是可以用来表示其他字符的字符。为了充分利用所有元字符，我们应该使用
    grep 的表亲 egrep，它只是扩展了 grep 的功能。


    我们首先要讨论的元字符是 "."（句点）元字符，它表示**任意**字符。例如，如果我想在 states.txt 中搜索字符 “i”，后跟任意字符，后跟字符
    “g”，我可以用以下命令实现：


    ```text

    egrep "i.g" states.txt

    ```


    ```text

    Virginia

    Washington

    West Virginia

    Wyoming

    ```


    正则表达式 “i.g” 在 Virginia 和 West Virginia 中匹配子字符串 “irg”，在 Washington 和 Wyoming 中匹配子字符串
    “ing”。在上面的例子中，句点元字符是 “irg” 中的 “r” 和 “ing” 中的 “n” 的替代。句点元字符非常宽松，例如命令 egrep "."
    states.txt 将返回 states.txt 的每一行，因为正则表达式 "." 将匹配每行上的任意一个字符的出现（每行上至少有一个字符）。


    除了可以表示其他字符的字符之外，还有一种称为 **量词** 的元字符，它允许你指定特定正则表达式在字符串中应出现的次数。其中最基本的量词是 "+"（加号），它表示前一个表达式的一个或多个出现。例如，正则表达式
    “s+as” 的意思是：一个或多个 “s” 后跟 “as”。让我们看看是否有任何州名匹配此表达式：


