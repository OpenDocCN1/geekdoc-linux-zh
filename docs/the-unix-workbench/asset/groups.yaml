    个人计算机。使用 -r 标志来复制目录。


    - `curl` 允许你向其他服务器发送 HTTP 请求。使用 `-o` 标志可以通过 `curl` 下载文件。

    - `ps -A` 列出你计算机后台运行的所有程序。

    - `cron` 允许你安排程序的运行时间。使用 `crontab -e` 来编辑 cron 表。


    ## 练习


    1. 编写一个 bash 脚本，该脚本将文件路径作为参数，并将该文件复制到服务器上的指定文件夹中。

    2. 在网上找一个定期变化的文件，然后编写一个程序，在每次文件变化时下载它。

    3. 尝试使用 Twitter API⁴³ 或 GitHub API⁴⁴ 创建你自己的 Twitter 或 GitHub 机器人。


    ## 关闭服务器


    为了避免使用超出必要的 DigitalOcean 额度，或因使用该服务而被收费，请务必**销毁**你启动的任何 DigitalOcean Droplet（水滴）。当你销毁
    Droplet 时，Droplet 上的所有文件将永久消失，因此请确保在销毁之前，Droplet 上没有存储任何重要信息。如果你想保留 Droplet 上的某些文件，请使用
    `scp` 将它们复制到你的本地机器上。


    让我们来一步步演示如何销毁一个 Droplet。返回 DigitalOcean⁴⁵ 并登录。然后你应该会看到你所有 Droplet 的列表：


    ![](img/a67f2d2ba01c2569ec78ab34ae6c3c5a_241_0.png)


    点击屏幕右侧的 **More**，会出现一个菜单。点击该菜单底部的 **Destroy**。然后会出现以下界面：


    点击 **Destroy** 按钮，然后在弹出的菜单中点击 **Confirm**。你的 Droplet 现在应该已被销毁。如果你没有活动的 Droplet，那么
    Droplet 主页将如下所示：


    ![](img/a67f2d2ba01c2569ec78ab34ae6c3c5a_242_0.png)


    ## 开始构建


    ### 后续步骤


    我们已经到了这本书的结尾，这意味着你现在已经在使用 Unix 方面打下了坚实的基础。恭喜！正如这本书的书名所暗示的，Unix 主要充当一个工作台——一套用于构建令人惊叹的数字创作的工具。然而，你可以用
    Unix 创建的东西通常并不是由 Unix 的组成部分构成的。你可能会用锤子和锯子来建造一个不错的鸟舍，但鸟舍本身并不是用锤子做成的。Unix 的实用知识最好再配合至少一门其他编程语言。以下是一些关于如何继续你的计算和编程学习的建议。


    Python⁴⁶ 是一门平易近人且必不可少的语言，适合任何对计算感兴趣的人。如果你在这本书之外没有任何编程经验，我非常强烈推荐你学习 Python。我最喜欢的一本相关书籍是
    Zed Shaw 的《Learn Python the Hard Way》⁴⁷。Philip Guo 的 Python Tutor⁴⁸ 可以让你可视化 Python
    在底层是如何工作的，从而帮助你对自己编写的代码形成更好的直觉。将这两个资源结合起来，目前是在正规大学或企业培训之外学习编写软件的最佳方式。一旦你有了一些 Python
    经验，你可以尝试用 Flask⁴⁹ 构建自己的 HTTP API。


    R⁵⁰ 是一种通用编程语言，专为对数据科学、分析、建模和可视化感兴趣的人设计。R 也非常适合制作数字文档：这本书就是用 R 创建的！如果你想开始学习 R，我推荐《R
    Programming for Data Science》⁵¹ 一书、Swirl⁵² 软件包，以及名为 DataCamp⁵³ 的交互式 R 教程网站。


    JavaScript⁵⁴ 是驱动互联网的主要语言，也是 Web 应用程序编程的支柱。Mozilla 开发者网络提供了关于 HTML、CSS 和 JavaScript
    的精彩教程⁵⁵。通常你会使用 JavaScript 来操作 HTML 和 CSS，因此学习这三者都很重要！我还推荐 NodeSchool⁵⁶，用于纯粹在 Unix
    环境下学习 JavaScript。


    ### 提供反馈


    非常感谢你阅读这本书！如果你想讨论这本书或有任何反馈，我非常期待听到你的意见。最好的联系方式是在 Twitter⁵⁷ 上联系我。


    '
