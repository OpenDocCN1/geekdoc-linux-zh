    为了充分利用本章内容，你需要你的信用卡或借记卡，或一个 PayPal 账户。我们将使用 DigitalOcean，这是一家我们可以租用云计算机的公司。在本章中我可能会将云计算机称为服务器（连接互联网的计算机）或称为
    droplets，这是 DigitalOcean 用于指代其服务器的营销术语（droplet 不是技术术语）。从 DigitalOcean 租用不会花费你任何钱，因为我给你提供了一个免费两个月服务的优惠券！有几家公司提供与
