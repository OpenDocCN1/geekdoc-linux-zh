    请注意 .. 也是一个相对路径，因为它指定了当前工作目录的上级目录。类似地 . 是当前工作目录的路径。因此由于我的当前工作目录是 /Users/sean，那么
    cd Music 与 cd ./Music 相同。


    只要我知道某个文件夹的**绝对**路径，我就可以 cd 到任何文件夹。例如我可以通过在 shell 中输入以下内容 cd 到 /Users/sean/Music：


    cd ~/Music

    pwd


    ```

    ## /Users/sean/Music

    ```


    我所在的目录无关紧要，因为我使用的是绝对路径，我可以直接跳转到该目录（请记住 ~ 是指向你主文件夹路径的快捷方式）。当然你不应该期望自己记住电脑上所有绝对路径！你可以使用终端的一项功能叫做**Tab
    补全**来加快输入路径和其他命令的速度。在你的 shell 中输入以下内容，然后尝试按 Tab 键（在某些机器上你需要按两次）：


    ```

    cd ~/

    ```


    （按 Tab）


    ```

    ## Desktop

    ## Documents

    ## Photos

    ## Music

    ## todo.txt

    ```


    按 Tab 会显示 ~/ 目录内的所有文件和文件夹。现在我要在终端中输入 ~/D，你可以看到再次按 Tab 时会发生什么：


    ```

    cd ~/D

    ```


    （按 Tab）


    ```

    ## Desktop

    ## Documents

    ```


    由于我在路径中添加了 "D"，只有名称以 "D" 开头的文件夹会被列出。如果我在控制台中输入 cd ~/De 然后按 Tab，则命令会自动补全为 cd ~/Desktop/。如果我再次按
    Tab，控制台将列出我桌面上的所有文件和文件夹。


    务必暂停并在自己的终端中亲自尝试！你不会有我相同的那些文件或文件夹，但你应该尝试使用 cd 和 Tab 补全来操作以相同字母开头的文件夹和文件。


    # Summary


    - 你可以通过其路径来识别特定的文件或文件夹。

    - 根目录（/）包含电脑上的所有文件夹和文件。

    - 你的主目录（~）是终端始终开始的目录。

    - 使用 cd 命令更改工作目录。

    - pwd 命令会打印工作目录。

    - ls 命令会列出目录中的文件和文件夹。


    # Exercises


    - 1. 将工作目录设置为根目录。

    - 2. 使用三种不同的命令将工作目录设置为你的主目录。

    - 3. 使用你的文件和文件夹浏览器找到电脑上的一个文件夹，然后使用终端将工作目录设置为该文件夹。

    - 4. 列出你在 #3 中导航到的目录中的所有文件和文件夹。


    # Creation and Inspection


    现在你可以用终端流畅地在电脑各处的目录之间跳转，我将向你展示你可以对文件夹和文件执行的一些操作。当你打开一个全新的终端时，你可能想做的第一件事就是创建一个新的文件夹或文件。你可以使用
    `mkdir` 命令加上新目录的路径来创建目录。首先让我们查看我的主目录的内容：


    ```

    cd

    ls

    ```


    ```

    ## Desktop

    ## Documents

    ## Photos

    ## Music

    ## todo.txt

    ```


    我想创建一个新的目录来存放稍后要编写的一些代码文件，所以我将使用 mkdir 创建一个名为 Code 的新目录：


    ```

    mkdir Code

    ls

    ```


    - ## Desktop

    - ## Documents

    - ## Photos

    - ## Music

    - ## todo.txt

    - ## Code


    成功了！请注意传递给 mkdir 的参数 Code 是一个相对路径，不过我也可以指定绝对路径。一般来说，你应该期望接受路径作为参数的 Unix 工具同时接受相对路径和绝对路径。


    在命令行上创建新文件有几种不同的方法。创建空白文件最简单的方法是使用 touch 命令，后跟要创建的文件的路径。在此示例中，我将使用 touch 创建一个新的日记条目：


    ```

    touch journal-2017-01-24.txt

    ls

    ```


