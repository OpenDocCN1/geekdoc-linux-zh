    construct **conditional expressions** which are logical statements that are either
    equivalent to true or false. Conditional expressions either compare two values,
    or they ask a question about one value. Conditional expressions are always between
    double brackets ([[ ]]), and they either use **logical flags** or **logical operators**.
    For example, there are several logical flags you could use for comparing two integers.
    If we wanted to see if one integer was greater than another we could use -gt,
    the greater than flag. Enter this simple conditional expression into the command
    line:


    ```

    [[ 4 -gt 3 ]]

    ```


    The logical expression above is asking: Is 4 greater than 3? No result is printed
    to the console so let’s check the exit status of that expression.


    ```

    echo $?

    ```


    ## 0


    It looks like the exit status of this program is 0, the same exit status as true.
    This conditional expression is saying that [[ 4 -gt 3 ]] is equivalent to true,
    which of course we know is logically consistent, 4 is in fact greater than 3!
    Let’s see what happens if we flip the expression around so we’re asking if 3 is
    greater than 4:


    ```

    [[ 3 -gt 4 ]]

    ```


    Again, nothing is printed to the console so we’ll look at the exit status:'
  - "[PAGE 105]\n\necho $? \n\n# ## 1\n\nAh-ha! Obviously 3 is not greater than 4,\
    \ so this false logical expression resulted in an exit status of 1, which is the\
    \ same exit status as false! Because they have the same exit status [[ 3 -gt 4\
    \ ]] and false are essentially equivalent. To quickly test the logical value of\
    \ a conditional expression, we can use the AND and OR operators so that an expression\
    \ will print \"t\" if it's true and \"f\" if its false:\n\n```\n[[ 4 -gt 3 ]]\
    \ && echo t || echo f\n[[ 3 -gt 4 ]] && echo t || echo f\n```\n\n# ## t\n\n# ##\
    \ f\n\nThis is a little trick you can use to quickly look at the resulting value\
    \ of a logical expression.\n\nThese binary logical expressions compare two values,\
    \ but there are also unary logical expressions that only look at one value. For\
    \ example, you can test whether or not a file exists using the -e logical flag.\
    \ Let’s take a look at this flag in action:\n\n```\ncd ~/Code\n[[ -e math.sh ]]\
    \ && echo t || echo f\n```"
