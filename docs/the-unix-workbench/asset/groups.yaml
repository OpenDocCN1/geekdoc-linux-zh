    \ addseq 命令中，我们向命令提供一串数字，然后命令返回序列的和，这是我们所关心的一个值。在这种情况下，我们可以看到 addseq 根据一些输入值计算出了一个值。许多其他命令，比如\
    \ pwd，会返回一个值而不影响我们计算机上的文件状态。然而，有些函数像 mv 或 cp 会在计算机上移动和复制文件。每当函数创建或更改我们计算机上的文件时，就会产生副作用。这些命令如果成功，不会打印任何值。\n\
    \n我们经常会编写函数来计算某个值，重要的是要理解如何将函数的结果存储在变量中，以便稍后使用。让我们加载 addseq.sh 并再运行一次：\n\n```\n\
    source addseq.sh\naddseq 3 0 0 7\n```\n\n# ## 10\n\n如果我们回头看看 addseq.sh 的代码，可以看到我们在函数中创建了一个名为\
    \ sum 的变量。当你在函数中创建变量时，这些变量会变成全局可访问的，这意味着即使程序执行完毕，该变量仍会在你的 shell 中保留其值。我们可以通过 echo\
    \ 输出 sum 的值来轻松验证这一点：\n\n```\necho $sum\n```\n\n# ## 10\n\n这是一种可以用来获取函数计算值策略的例子。遗憾的是，这种方法有问题，因为它会改变我们可能在\
    \ shell 中使用的变量的值。例如，如果我们正在一个名为 sum 的变量中存储一些其他重要的值，运行 addseq 就会意外地破坏该值。为了避免这个问题，在函数内给变量赋值时，使用\
    \ local 关键字非常重要。local 关键字确保我们函数外部的变量不会被函数覆盖。让我们创建一个新版本的 addseq，名为 addseq2，它在赋值变量时使用\
    \ local。\n\n"
