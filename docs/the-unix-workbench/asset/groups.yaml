    cd 将你的 working directory 更改为除 home 目录之外的其他目录，你需要为 cd 提供另一个目录的路径作为参数。你可以指定路径为相对于当前目录的相对路径，也可以指定从计算机根目录开始的目录的绝对路径。假设我们只是想将
    working directory 更改为 home 目录内部的一个文件夹。首先我们需要能够看到 working directory 中有哪些文件夹。你可以使用
    ls 命令列出目录中的文件和文件夹。让我们在 home 目录中使用 ls 命令列出其中包含的文件和文件夹。


