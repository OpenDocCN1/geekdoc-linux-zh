    ![](img/a67f2d2ba01c2569ec78ab34ae6c3c5a_13_2.png)


    有几个特殊的目录你应该在计算机上了解。树顶部的目录称为根目录。根目录包含所有其他目录，并由斜杠（/）表示。


    home 目录是另一个特殊目录，由波浪号（~）表示。你的 home 目录包含你的个人文件，如照片、文档和桌面的内容。当你第一次打开 shell 时，你通常从
    home 目录开始。想象一下从根目录追踪到你当前所在的目录的所有目录。这个目录序列称为路径。下图说明了从假设的根目录到 home 目录的路径。


