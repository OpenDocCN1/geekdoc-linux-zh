    该表左侧的这一列包含一系列单个字符和破折号。第一个连字符 `-` 表示此列表中的每一项都是文件。如果其中任何一个是目录，则破折号将被 `d` 取代。排除第一个连字符后，我们得到以下字符串：`rw-rw-r--`。该字符串反映了为此文件设置了哪些权限。我们可以授予三种权限：读取文件的能力
    `r`、写入或编辑文件 `w`、或作为程序执行文件 `x`。这三种权限可以授予三个不同的访问级别，对应于权限字符串中三个 `rwx` 集合：文件的拥有者、文件所属的组，以及除拥有者和组成员之外的所有人。由于你创建了该文件，你就是文件的拥有者，并且你可以使用
    `chmod` 命令为你拥有的文件设置权限。


    `chmod` 命令接受两个参数。第一个参数是一个字符串，指定我们将如何更改文件的权限，第二个参数是文件的路径。第一个参数必须以非常特定的方式组成。首先我们可以指定要更改权限的用户组：


    | 字符 | 含义 |

    |---|---|

    | u | 文件的拥有者 |

    | g | 文件所属的组 |

    | o | 其他所有人 |

    | a | 所有人 |


    然后我们需要指定是要添加、移除还是设置权限：


    | 字符 | 含义 |

    |---|---|

    | + | 添加权限 |

    | - | 移除权限 |

    | = | 设置权限 |


    最后我们指定要更改的权限：


    | 字符 | 含义 |

    |---|---|

    | r | 读取文件 |

    | w | 写入或编辑文件 |

    | x | 执行文件 |


    让我们使用 `echo` 编写一个非常短的程序，我们将其命名为 `short`。


    ```

    echo ''echo "a small program"'' > short

    ```


    通常如果我们想运行 `short`，我们需要在控制台输入 `bash short`。如果我们使此文件可执行，我们只需在命令行输入 `short` 即可运行程序，就像一个命令一样！让我们看看
    `short` 的权限。


    ```

    ls -l short

    ```


    ```

    -rw-r--r-- 1 sean staff 23 Jun 28 09:47 short

    ```


    我们希望使此文件可执行，并且我们是此文件的拥有者，因为我们创建了它。这意味着我们可以组合 `u`、`+` 和 `x` 来使 `short` 可执行。让我们试试：


    ```

    chmod u+x short

    ls -l short

    ```


    ```

    -rwxr--r-- 1 sean staff 23 Jun 28 09:47 short

    ```


    我们成功添加了 `x`！要运行可执行文件，我们需要指定文件的路径，即使路径在当前目录中，这意味着我们需要在 `short` 前加上 `./`。现在让我们尝试运行程序。


    ```

    ./short

    ```


    ```

    a small program

    ```


    看起来它工作了！不过我们应该再为此程序添加一个小细节。即使我们已使文件可执行，如果我们把程序交给别人，他们可能使用的是不知道如何执行我们程序的 shell。我们需要通过在程序开头添加一行特殊文本来指示程序应如何运行，这一行称为
    shebang。shebang 总是以 `#!` 开头，后跟将执行我们文件中代码的程序的路径。指示我们想要使用 Bash 的 shebang 是 `#!/usr/bin/env
    bash`，我们已经在脚本开头添加了很长时间了！让我们重写此程序以包含 Bash shebang，然后运行程序。


    ```

    echo ''#!/usr/bin/env bash'' > short

    echo ''echo "a small program"'' >> short

    ```


    ```

    a small program

    ```


    现在我们的 Bash 脚本准备就绪了！


    ## 环境变量


    我们距离能够将脚本和函数用作 shell 命令只差一步，但首先我们需要学习环境变量。环境变量是 Bash 创建的一个变量，其中存储了有关当前计算环境的数据。环境变量名使用全大写字母。让我们查看其中一些变量的值。`HOME`
    变量包含我们主目录的路径，而 `PWD` 变量包含我们当前目录的路径。


