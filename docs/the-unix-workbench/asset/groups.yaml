    \necho \"End program\"\n```\n```\n\nFirst this program will print “Start program”,\
    \ then the IF statement will check if the conditional expression [ [ $1 -eq 4\
    \ ] ] is true. It will only be true if you provide 4 as the first argument to\
    \ the script. If the conditional expression if true then it will execute the code\
    \ in between then and fi, otherwise it will skip over that code. Finally the program\
    \ will print “End program.”\n\nLet’s try running this Bash program a few different\
    \ ways. First we’ll run this program with no arguments:\n\n```\n```bash\nbash\
    \ simpleif.sh\n\n## Start program\n## End program\n```\n```\n\nSince we didn’t\
    \ provide any arguments to simpleif.sh the code within the IF statement was skipped!\
    \ Now let’s try providing an argument to this script:"
