    # Bash Programming


    > Communities begin by building their kitchen. -

    > French proverb


    The last two chapters have discussed how to use the bash shell. Bash itself is
    a little programming language, and this chapter we’re going to discuss how you
    can write your own computer programs in Bash. Programming in Bash is useful to
    know because of how seamlessly it integrates with all of the command line programs
    you’ve already learned. By the end of this chapter you should be able to write
    your own command line tools!


    You can use nano to write all of the programs we’re going to discuss in this chapter,
    however I recommend using the Atom text editor because it’s more user friendly.


    Now let’s create a new file called math.sh in the ~/Code/ directory and let’s
    open that file with either nano or Atom.


    ```

    cd ~/Code/

    nano math.sh

    ```


    You should now have a new, clean text file open. Any code block in the following
    chapters that starts with the code (or similar) below should indicate to you that
    we’re working on a particular text file.'
