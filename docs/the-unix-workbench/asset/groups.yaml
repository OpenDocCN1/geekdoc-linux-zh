    \ 编程中的基本结构之一是 IF 语句。只有某个条件为真时，IF 语句内编写的代码才会被执行，否则代码会被跳过。让我们编写一个包含 IF 语句的小程序：\n\
    \n```bash\n#!/usr/bin/env bash\n# File: simpleif.sh\n\necho \"Start program\"\n\
    \nif [[ $1 -eq 4 ]]\nthen\n  echo \"You entered $1\"\nfi\n\necho \"End program\"\
    \n```\n\n首先，这个程序会打印“Start program”，然后 IF 语句会检查条件表达式 `[[ $1 -eq 4 ]]` 是否为真。只有当你向脚本提供\
    \ 4 作为第一个参数时，该表达式才会为真。如果条件表达式为真，那么程序会执行 `then` 和 `fi` 之间的代码，否则会跳过这些代码。最后，程序会打印“End\
    \ program.”\n\n让我们尝试用几种不同的方式运行这个 Bash 程序。首先，我们不提供任何参数来运行这个程序：\n\n```bash\nbash\
    \ simpleif.sh\n\nStart program\nEnd program\n```\n\n由于我们没有向 simpleif.sh 提供任何参数，IF\
    \ 语句内的代码被跳过了！现在让我们尝试为这个脚本提供一个参数：\n\n```bash\nbash simpleif.sh 77\n\nStart program\n\
    End program\n```\n\n我们提供了参数 77，但 77 不等于 4，因此 IF 语句内的代码再次被跳过。最后，让我们提供 4 作为参数：\n\
    \n```bash\nbash simpleif.sh 4\n\nStart program\nYou entered 4\nEnd program\n```\n\
    \n成功了！由于这个脚本的第一个参数是 4，而 4 等于 4，IF 语句内的代码被执行了。你可以将 IF 语句与 ELSE 语句搭配使用。只有当 IF 语句所评估的条件表达式为假时，ELSE\
    \ 语句才会运行。让我们创建一个使用 ELSE 语句的简单程序：\n\n```bash\n#!/usr/bin/env bash\n# File: simpleifelse.sh\n\
    echo \"Start program\"\nif [[ $1 -eq 4 ]]\nthen\n    echo \"Thanks for entering\
    \ $1\"\nelse\n    echo \"You entered: $1, not what I was looking for.\"\nfi\n\
    echo \"End program\"\n```\n\n现在让我们尝试用几种不同的方式运行这个程序：\n\n```bash\nbash simpleifelse.sh\
    \ 4\n\nStart program\nThanks for entering 4\nEnd program\n```\n\n条件表达式 `[[ $1\
    \ -eq 4 ]]` 为真，因此 IF 语句内的代码被运行，而 ELSE 语句中的代码没有被运行。你认为当我们让条件表达式为假时会发生什么？\n\n```bash\n\
    bash simpleifelse.sh 3\n\nStart program\nYou entered: 3, not what I was looking\
    \ for.\nEnd program\n```\n\n条件表达式 `[[ $1 -eq 4 ]]` 为假，因此 ELSE 语句中的代码被运行，而 IF 语句内的代码没有被运行。\n\
    \n在 IF 和 ELSE 语句之间，你还可以使用 ELIF 语句。这些语句的作用类似于 IF 语句，只不过它们只有在前面所有的 IF 和 ELIF 语句都评估为假时才会被求值。让我们用\
    \ ELIF 创建一个简短的程序：\n\n```bash\n#!/usr/bin/env bash\n# File: simpleelif.sh\n\nif\
    \ [[ $1 -eq 4 ]]\nthen\n  echo \"$1 is my favorite number\"\nelif [[ $1 -gt 3\
    \ ]]\nthen\n  echo \"$1 is a great number\"\nelse\n  echo \"You entered: $1, not\
    \ what I was looking for.\"\nfi\n```\n\n首先，让我们以 4 作为第一个参数运行这个程序：\n\n```bash\n\
    bash simpleelif.sh 4\n4 is my favorite number\n```\n\nIF 语句中的条件为真，因此只执行了第一个 echo\
    \ 命令。现在让我们以 5 作为第一个参数运行这个程序：\n\n```bash\nbash simpleelif.sh 5\n5 is a great number\n\
    ```\n\n第一个条件为假，因为 5 不等于 4，但随后 ELIF 语句中的下一个条件为真，因为 5 大于 3，所以该 echo 命令被执行，而语句的其余部分被跳过。试着猜一下如果我们用\
    \ 2 作为参数会发生什么：\n\n```bash\nbash simpleelif.sh 2\nYou entered: 2, not what I was\
    \ looking for.\n```\n\n因为 2 既不等于 4，也不大于 3，所以 ELSE 语句中的代码被执行。\n\n你还应该知道，你可以将条件执行、条件表达式和\
    \ IF/ELIF/ELSE 语句组合使用。条件执行运算符 AND（`&&`）和 OR（`||`）可以用于 IF 或 ELIF 语句中。让我们看一个在 IF\
    \ 语句中使用这些运算符的示例：\n\n"
