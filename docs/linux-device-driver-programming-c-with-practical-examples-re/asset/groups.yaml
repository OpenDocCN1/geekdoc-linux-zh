    \n    return IRQ_HANDLED;\n}\n\nstatic void netdev_rx_tasklet_handler(unsigned\
    \ long data) {\n    // Bottom half: process received packet\n    // ...\n}\n```\n\
    \nBy effectively using top half and bottom half handlers, device drivers can improve\
    \ performance and responsiveness. The top half quickly acknowledges the interrupt\
    \ and schedules the bottom half for more complex processing, allowing the system\
    \ to handle multiple interrupts efficiently.\n\n# Interrupt Sharing and Masking\
    \ in Linux Device Drivers\n\nInterrupt Sharing\n\nIn many embedded systems, it's\
    \ common for multiple devices to share a single interrupt line. This is often\
    \ due to hardware limitations or design choices. Linux provides mechanisms to\
    \ handle such scenarios efficiently.\n\n**Key points:**\n\n- Multiple device drivers\
    \ can register for the same IRQ.\n- The kernel ensures only one ISR runs at a\
    \ time for a shared IRQ.\n- The `dev_id` parameter in `request_irq` is crucial\
    \ for identifying the correct handler.\n\n```c\nCode example:\n#include <linux/interrupt.h>\n\
    \nstatic irqreturn_t dev1_interrupt_handler(int irq, void *dev_id) {\n    // Handle\
    \ interrupt for device 1\n    return IRQ_HANDLED;\n}\n\nstatic irqreturn_t dev2_interrupt_handler(int\
    \ irq, void *dev_id) {\n    // Handle interrupt for device 2\n    return IRQ_HANDLED;\n\
    }\n\nstatic int _init_my_module_init(void) {\n    request_irq(IRQ_SHARED_IRQ,\
    \ dev1_interrupt_handler, IRQF_SHARED,\n    \"dev1\", &dev1_data);\n    request_irq(IRQ_SHARED_IRQ,\
    \ dev2_interrupt_handler, IRQF_SHARED,\n    \"dev2\", &dev2_data);\n    return\
    \ 0;\n}\n```\n\n# Interrupt masking\n\nInterrupt masking allows a driver to temporarily\
    \ disable interrupts, often to protect critical sections.\n\n**Key points:**\n\
    \n- Disable interrupts for the shortest time.\n- Enable interrupts when done.\n\
    - Be careful with nested interrupts.\n\n```c\n#include <linux/interrupt.h>\n\n\
    static irqreturn_t my_interrupt_handler(int irq, void *dev_id) {\n    // Disable\
    \ interrupts\n    local_irq_save(flags);\n\n    // Critical section\n    // ...\n\
    \n    // Enable interrupts\n    local_irq_restore(flags);\n\n    return IRQ_HANDLED;\n\
