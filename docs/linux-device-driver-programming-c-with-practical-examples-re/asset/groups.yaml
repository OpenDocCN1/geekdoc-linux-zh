    The hypervisor must allocate and deallocate memory for VMs efficiently.

    This involves:


    +   - **Memory overcommitment**: Allocating more virtual memory than physical
    memory.

    - **Page sharing**: Sharing physical pages between VMs to optimize memory usage.

    - **Memory ballooning**: Dynamically reclaiming memory from VMs to prevent out-of-memory
    conditions.


