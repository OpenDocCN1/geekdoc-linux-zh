    # Wakeup Sources in Linux Device Drivers


    A wakeup source is a mechanism that can bring a system out of a low-power state.
    In the context of device drivers, it''s often a hardware event that signals the
    need to resume normal operation. The Linux kernel provides a framework for managing
    wakeup sources.


    # Core Concepts


    +   * Wakeup Event: A hardware-generated signal indicating the need to resume
    normal operation.


    +   * Wakeup Source: A representation of a physical wakeup event in the kernel.


    +   * Wakeup Enable/Disable: Functions to control whether a wakeup source is active
    or not.


    # Registering a Wakeup Source


    To register a wakeup source for a device, the driver uses the following functions:
    C


    ```

    device_set_wakeup_capable(&pdev->dev, true);

    device_set_wakeup_enable(&pdev->dev, true);

    ```


    The first function indicates that the device can be a wakeup source. The second
    function enables the wakeup source.'
