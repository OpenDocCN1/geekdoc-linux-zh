    \ between devices and system memory without involving the CPU as a bottleneck.\
    \ However, DMA operations can introduce cache coherency issues. To address this,\
    \ the kernel provides DMA-coherent memory, which ensures that data written by\
    \ the CPU is immediately visible to the DMA engine and vice versa.\n\n# Allocating\
    \ DMA-Coherent Memory\n\nThe primary function for allocating DMA-coherent memory\
