    \ PM 框架集成，驱动程序必须实现以下函数：\n\n```c\nstruct dev_pm_ops my_device_pm_ops = {\n    .suspend\
    \ = my_device_suspend,\n    .resume = my_device_resume,\n    // other optional\
    \ operations\n};\n```\n\n- **suspend**：当设备即将进入低功耗状态时调用此函数。驱动程序应保存设备状态、禁用中断并将设备置于低功耗。\n\
    - **resume**：当设备恢复时调用此函数。\n\n"
