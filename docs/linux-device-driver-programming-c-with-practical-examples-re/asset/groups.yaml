    \n- **Probe function**: Initializes the device and registers it with the kernel.\n\
    - **Open/close functions**: Handle device opening and closing operations.\n- **Read/write\
    \ functions**: Perform data transfer between the device and user space.\n- **Ioctl\
    \ function**: Provides a mechanism for custom control operations.\n- **Interrupt\
