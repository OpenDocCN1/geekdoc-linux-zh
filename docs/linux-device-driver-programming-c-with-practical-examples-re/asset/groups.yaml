    \ *dev_id) {\n    // 处理设备 1 的中断\n    return IRQ_HANDLED;\n}\n\nstatic irqreturn_t\
    \ dev2_interrupt_handler(int irq, void *dev_id) {\n    // 处理设备 2 的中断\n    return\
    \ IRQ_HANDLED;\n}\n\nstatic int _init_my_module_init(void) {\n    request_irq(IRQ_SHARED_IRQ,\
    \ dev1_interrupt_handler, IRQF_SHARED,\n    \"dev1\", &dev1_data);\n    request_irq(IRQ_SHARED_IRQ,\
    \ dev2_interrupt_handler, IRQF_SHARED,\n    \"dev2\", &dev2_data);\n    return\
    \ 0;\n}\n```\n\n# 中断掩码\n\n中断掩码允许驱动程序临时禁用中断，通常是为了保护临界区。\n\n**关键点：**\n\n- 在最短时间内禁用中断。\n\
    - 完成后启用中断。\n- 小心处理嵌套中断。\n\n```c\n#include <linux/interrupt.h>\n\nstatic irqreturn_t\
    \ my_interrupt_handler(int irq, void *dev_id) {\n    // 禁用中断\n    local_irq_save(flags);\n\
    \n    // 临界区\n    // ...\n\n    // 启用中断\n    local_irq_restore(flags);\n\n   \
    \ return IRQ_HANDLED;\n}\n```\n\n 中断掩码与共享结合使用\n\n可以将中断共享和掩码结合。例如，驱动程序可以在访问共享资源时禁用中断以防止竞态条件。\n\
