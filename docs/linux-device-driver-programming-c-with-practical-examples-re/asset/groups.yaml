    \    void *dev_id);\n```\n\n+   - irq: The interrupt number.\n- handler: The ISR\
    \ function pointer.\n- flags: Interrupt flags (e.g., IRQ_SHARED for shared interrupts).\n\
    - name: A descriptive name for the interrupt handler.\n- dev_id: Optional device-specific\
    \ data passed to the ISR.\n\n# Interrupt Service Routine (ISR)\n\nThe ISR is the\
    \ core of interrupt handling. It should be as concise as possible to minimise\
    \ interrupt latency.\n\n```\nreturn_t my_interrupt_handler(int irq, void *dev_id)\
    \ {\n    // ISR code here\n\n    // Example:\n    // Read data from hardware registers\n\
    \    // Process data\n    // Schedule a bottom half for further processing (if\
    \ necessary)\n\n    return IRQ_HANDLED; // Indicate interrupt was handled\n}\n\
    ```"
