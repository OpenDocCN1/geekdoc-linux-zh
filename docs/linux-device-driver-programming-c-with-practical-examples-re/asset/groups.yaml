    Simple call logger\");\n\nasmlinkage long (*original_sys_open)(const char __user\
    \ *filename, int flags, int mode);\n\nasmlinkage long my_sys_open(const char __user\
    \ *filename, int flags, int mode) {\n    printk(KERN_INFO \"System open called\
