    # # Chapter 15

    Power Management Framework


    Understanding Linux Power Management Framework


    The Linux Power Management (PM) framework is a crucial component of the kernel
    that aims to optimise power consumption by intelligently managing device power
    states. It provides a flexible and extensible mechanism for device drivers to
    interact with the system-wide power management policies.


    Core Concepts


    +   * **Power States**: Devices can typically operate in multiple power states,
    ranging from active (full power) to deep sleep (minimal power consumption).

    * **PM Domains**: A group of devices that can be managed as a single unit for
    power management purposes.

    * **Suspend/Resume**: The system can enter different suspend states (standby,
    suspend-to-RAM, suspend-to-disk) to reduce power consumption. Devices must be
    able to suspend and resume gracefully.


    PM Framework Components


    +   * **Device Driver**: Responsible for implementing power management operations
    for a specific device.

    * **Bus Driver**: Manages power management for a group of devices on a particular
    bus.

    * **Core PM Framework**: Provides the core infrastructure for power management,
    including suspend/resume, device power state transitions, and wakeup events.


    Device Driver Power Management'
  - '[PAGE 268]


    To integrate a device driver with the PM framework, the driver must implement
    the following functions: C


    ```

    struct dev_pm_ops my_device_pm_ops

    .suspend = my_device_suspend,

    .resume = my_device_resume,

    // other optional operations

    ```


    +   - **suspend**: This function is called when the device is about to enter a
    low-power state. The driver should save device state, disable interrupts, and
    put the device into a low-power state.

    - **resume**: This function is called when the device is resuming from a low-power
    state. The driver should restore device state, enable interrupts, and bring the
    device back to full operation.


    ![](img/ac3ad875fcf65d3ecc3d8ea995c85f9e_268_0.png)


    # Power State Transitions


    The PM framework handles power state transitions in a hierarchical manner. When
    the system enters a suspend state, the following steps occur:


    +   1. **System suspend**: The kernel initiates the suspend process.

    2. **PM domain suspend**: Devices within a PM domain are suspended in a coordinated
    manner.

    3. **Device suspend**: Individual device drivers implement their suspend logic.


    The resume process follows the reverse order.'
