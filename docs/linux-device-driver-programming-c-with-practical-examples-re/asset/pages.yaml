  md: "```\nstatic unsigned int my_device_device_poll(struct file *file, poll_table\
    \ *wait) {\n    unsigned int mask = 0;\n\n    /* Check device state to determine\
    \ available events */\n    if (device_has_data_to_read()) {\n        mask |= POLLIN\
    \ | POLLRDNORM;\n    }\n    if (device_can_accept_write()) {\n        mask |=\
    \ POLLOUT | POLLWRNORM;\n    }\n\n    /* Add the current process to the wait queue\
    \ */\n    poll_wait(file, &my_device_wait_queue, wait);\n\n    return mask;\n\
    }\n```\n\nIn this example, my_device_wait_queue is a wait queue associated with\
