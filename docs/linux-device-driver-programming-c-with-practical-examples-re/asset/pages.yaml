- img_proc: true
  md: 'To integrate a device driver with the PM framework, the driver must implement
    the following functions: C


    ```

    struct dev_pm_ops my_device_pm_ops

    .suspend = my_device_suspend,

    .resume = my_device_resume,

    // other optional operations

    ```


    +   - **suspend**: This function is called when the device is about to enter a
    low-power state. The driver should save device state, disable interrupts, and
    put the device into a low-power state.

    - **resume**: This function is called when the device is resuming from a low-power
    state. The driver should restore device state, enable interrupts, and bring the
    device back to full operation.


    ![](img/ac3ad875fcf65d3ecc3d8ea995c85f9e_268_0.png)


    # Power State Transitions


    The PM framework handles power state transitions in a hierarchical manner. When
    the system enters a suspend state, the following steps occur:


    +   1. **System suspend**: The kernel initiates the suspend process.

    2. **PM domain suspend**: Devices within a PM domain are suspended in a coordinated
    manner.

    3. **Device suspend**: Individual device drivers implement their suspend logic.


    The resume process follows the reverse order.'
