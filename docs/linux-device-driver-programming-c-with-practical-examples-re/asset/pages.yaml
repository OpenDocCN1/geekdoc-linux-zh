    Understanding Elevator Algorithms


    Elevator algorithms optimize the order in which I/O requests are serviced to minimize
    disk seek time and improve overall throughput. The name "elevator" is derived
    from the analogy of an elevator servicing requests at different floors of a building.


    Common Elevator Algorithms


    # 1. CFQ (Completely Fair Queuing):'
