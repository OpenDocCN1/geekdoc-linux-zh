    # Profiling


    Profiling measures the performance of a program by determining how much time is
    spent in different parts of the code.


    Perf


    Perf is a built-in kernel tool for performance analysis.


    +   • **Basic Usage:**


    Bash


    ```

    perf record -e cycles,cache-misses ./my_program perf report

    ```


    This records cycle counts and cache misses for the specified program.


    +   • **Kernel Events:** Perf can measure various kernel events, such as CPU cycles,
    cache misses, page faults, and more.'
