    # Packet Transmission and Reception in Linux Device Drivers


    Understanding the Process


    Packet transmission and reception is a core function of network device drivers.
    It involves intricate interactions between hardware, kernel, and network stack
    components.


    Transmission:


    +   - The upper layers of the network stack prepare a packet in the form of sk_buff.

    - The network device driver is called to transmit this packet.

    - The driver prepares the packet for transmission (adding headers, checksums,
    etc.), accesses the hardware to send the packet, and manages the transmission
    process.


    Reception:


    +   - The network device receives a packet from the physical medium.

    - It generates an interrupt or uses DMA to transfer the packet to system memory.

    - The driver processes the received packet, extracts data, and passes it up the
    network stack.


