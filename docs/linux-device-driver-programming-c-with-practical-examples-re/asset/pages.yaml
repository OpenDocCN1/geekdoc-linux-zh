  md: 'Direct Memory Access (DMA) is a crucial technique for high-performance data
    transfer between devices and system memory without involving the CPU as a bottleneck.
    However, DMA operations can introduce cache coherency issues. To address this,
    the kernel provides DMA-coherent memory, which ensures that data written by the
    CPU is immediately visible to the DMA engine and vice versa.


    # Allocating DMA-Coherent Memory


    The primary function for allocating DMA-coherent memory in Linux dma_alloc_coherent():


    ```

    C

    void *dma_alloc_coherent(struct device *dev, size_t size, dma_addr_t *dma_handle,
    gfp_t flags);

    ```


    +   - dev: The device associated with the allocation.

    - size: The size of the memory block to allocate.

    - dma_handle: A pointer to store the DMA address of the allocated memory.

    - flags: Allocation flags, similar to kmalloc().


    Using DMA-Coherent Memory


    Once you have allocated DMA-coherent memory, you can use the returned virtual
    address for CPU access and the DMA address for device access.'
