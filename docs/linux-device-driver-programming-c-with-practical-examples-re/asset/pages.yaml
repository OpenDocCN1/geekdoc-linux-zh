    # I/O Scheduling in Linux


    Understanding I/O Scheduling


    I/O scheduling is a crucial aspect of disk performance optimization. It involves
    determining the order in which I/O requests are served by the disk. The goal is
    to minimize seek time, rotational latency, and head switch operations to improve
    overall I/O throughput and response time.


    # I/O Sched


    Linux provides several I/O schedulers to cater to different workload characteristics.


    +   - NOOP: The simplest scheduler, it places requests in a FIFO queue without
    any optimization. Suitable for workloads with random I/O patterns.

    - CFQ (Completely Fair Queuing): Aims for fair I/O distribution among processes.
    It creates per-process queues and allocates time slices to each queue. Suitable
    for general-purpose workloads.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '+   * **Deadline**: Guarantees a deadline for each I/O request. It prioritizes
    requests based on their deadline and physical location on the disk.

    Suitable for real-time or low-latency applications.

    * **BFQ (Buffer-Based Fair Queuing)**: An evolution of CFQ, it provides better
    performance and fairness by using a buffer-based approach.


    # I/O Scheulers Work


    I/O schedulers typically employ the following techniques:


    +   * **Request merging**: Combining adjacent I/O requests into a larger request
    to reduce seek time.

    * **Elevator algorithms**: Optimizing the order of disk head movement to minimize
    seek time.

    * **Queue sorting**: Organizing I/O requests within a queue based on various criteria
    (e.g., physical location, priority).


    ```

