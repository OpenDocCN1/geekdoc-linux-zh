    ## Easy access to third-party software with deb-get

    By Adam Dix


    Deb-get gives Debian and Ubuntu users easy access to third-party software. Searching
    for third-party repositories, and configuring your computer to use them, requires
    time and attention. It wouldn''t be simple if you could access all packages with
    a single tool! A new command-line utility called deb-get [1] makes installing
    and removing third-party deb packages for Debian and Ubuntu simple. deb-get allows
    us to quickly set up and update software that is not available in your distro-repositories.
    According to the developers, the goal of deb-get project is to provide: "...apt-get
    functionality for .deb published in third-party repositories or via direct download."


    The inspiration for deb-get is the Software Boutique, which deb-get leader Martin
    Wimpress worked on in his contribution to the MATE desktop environment. The Software
    Boutique is a curated collection of best-in-class software for users who are aware
    of the bloat and information overload of conventional management systems. The
    idea is, you are not shopping at a supersized department store – you''re shopping
    at a much smaller boutique. Although deb-get doesn''t have the glossy graphic
    interface of the Software Boutique, it shares the goal of offering a curated software
    collection.


    Both Debian and Ubuntu maintain extending package repositories with thousands
    of packages for a wide range of uses; there are several reasons why a deb-get
    package might only exist in a third-party repository. For instance, the package
    might not have been added to the official repositories yet. Or, if some version
    of the software is in the official repository, a newer version might be available
    directly from the Developer. And, as most Linux users know, reason why third-party
    service is restrictions not to be included with a Linux distro - either by the
    distributor''s choice or because their restrictive license follows the policies
    of Linux. Occasionally access to it, third-party apps help these get comfortable
    with Linux, and it is a step in the right direction.


    Or, if you prefer, simply download the .deb file from the Releases [2] page and
    install it with your package installer by double-clicking or using apt from the
    command line.


    As of writing, deb-get comes with many packages from a whole of software managers,
    such as Apt for Linux, Raspberry Pi Image, and even NovPIP. Now you can think
    of deb-get as an alternative to installing software not normally found in the
    repositories of Debian and Ubuntu-based distributions.


    ### Using deb-get

    Using deb-get will feel very familiar to anyone who uses apt-get from the command
    line. You will need to know the package name to install. For a list on the Wiki''s
    GitHub page or use the first command with the command line:


    ```bash

    $ deb-get install

    ```


    deb-get outputs a list of available packages (Figure 1). From here you can see
    a mirror image of apt-get, and that you can install, upgrade, remove, install,
    clean, search, etc., to manage your software with the command line.


    For instance, let''s say you would like to install WhatsApp for Linux (3), but
    you don''t know it and deb-get won''t know the package name for it. You can run
    `deb-get app-for-linux` to find what it is. Then run the following command to
    install the package (Figure 2):


    ```bash

    $ deb-get install https://github.com/eneschenk/whatapp-for-linux/releases/download/v1.2.0/whatapp-for-linux_1.2.0-1_amd64.deb

    ```

    Figure 2: Installing an application using deb-get.


    ### Installing deb-get

    How does one get about getting installing deb-get? GitHub you have covered:


    If you are thinking, "This sounds like another way to put non-free software onto
    a Linux machine," then you might notice that some of the packages available come
    with licenses that do not conform to free software principles. If you are a user
    who only works with free software, you might not be interested. However, plenty
    of non-free software ends up on Linux, and because many users just want and are
    not invested in free software, deb-get is a good fit.


    #### Conclusions

    Keep in mind that deb-get is designed to work with Debian and Ubuntu repositories.
    Personally, I find deb-get to be a little time saving, something that I would
    otherwise be searching for. My hope is, perhaps this tool could end up integrated
    into the Ubuntu Software Center or otherwise so that new users will have an easier
    time. But even if they never happen, I am glad to have a tool that makes my life
    a bit easier.

