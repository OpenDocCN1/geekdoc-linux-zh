    \ nodes） OK”，Helmer 就会重新排列节点。这种实现方式受到“最小边缘”（Minimum Edge）的影响，它指定了箭头的长度。值越高，节点之间的间隔就越大。宽高比（Aspect\
    \ Ratio）决定了 Helmer 是水平还是垂直重新排列节点（图 5）。\n\n![](img/d241cea1a8a6d96778bcc3ba9ab74512_91_0.png)\n\
    \n图 3：字体和大小选择始终适用于整个思维导图。状态栏中的其他设置适用于所有元素。\n\n更改链接\n树形结构现在在 Helmer 中逐渐显现。像通常一样，作为一个思维导图，节点从中心节点生长出来且从不返回。Helmer\
    \ 允许你追溯断开和重新连接连接。要执行此操作，按住 `Ctrl` 并点击相关节点。或者，按住 `Shift` 键并用鼠标在节点周围拖动一个框。所有节点都将高亮显示为红色。从现在起，大多数操作将影响这些节点。例如，如果你移动其中一个，其他节点会自动跟随移动。\n\
    \n![](img/d241cea1a8a6d96778bcc3ba9ab74512_91_1.png)\n\n图 4：如果需要，网格可以帮助你识别单个节点。\n\
    \n要重新布线节点，从主菜单中选择“编辑（Edit） | 断开所选节点（Disconnect Selected Nodes）”，这将移除它们之间的所有节点。无论如何，“连接所选节点”（Connect\
    \ Selected nodes）也会移除它们之间的内容。请注意，Helmer 软件就是这样做的。如果你选择三个或更多节点，该工具很可能会以你意图的方式连接它们。在连接时，只有偶数对节点会连接。要断开节点，按住\
    \ `Shift` 并点击该节点。同样，Helmer 会创建一个尚未连接的新节点。此外，被选中并高亮为红色的节点可以复制。要执行此操作，按 `Ctrl+C`\
    \ 将节点复制到剪贴板，然后按 `Ctrl+V` 粘贴。这样做会向思维导图中添加更多分支，但同时，你也在为你的想法或任务添加细节（图 7）。\n\n通过为每个节点添加合适的照片，让蛋糕之间的选择变得更容易。要执行此操作，右键点击并选择“附加图像”（Attach\
    \ image）。选中的照片将作为背景中（有些模糊的）壁纸。在某些情况下，Helmer 会裁剪图像。如果照片与其说是帮助说是麻烦，右键点击节点并选择“从删除移除图像”（Remove\
    \ attached image from）\n\n## 彩色\n大惊喜，蛋糕选项似乎是我家人的最爱。为了突出它的获胜者地位，让我们这样做：用鼠标光标触摸节点，并按下节点右下角的颜色按钮。然后从出现的调色板中选择一种合适的颜色，如图\
    \ 6 所示。因为黑色字体现在不易阅读，让我们按下节点右上角的按钮。在出现的调色板中，我们的示例可以将其设置为白色。\n\n问题仍然是，应该是哪种蛋糕？柠檬蛋糕还是可能是芝士蛋糕？到此时，只需重复之前常用的操作即可。鼠标悬停在蛋糕上并点击按钮创建一个新节点；这次标记为“柠檬蛋糕”。对任何你喜欢的其他蛋糕重复此过程\n\
