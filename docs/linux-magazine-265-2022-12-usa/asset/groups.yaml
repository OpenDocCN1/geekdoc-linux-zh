    ## Zack 的内核新闻\n\n## 让我们更近的微小链接\n\nLinux 内核开发过程随着时间的推移在列表中不断变化。在过去的一年中，有一个变化集中在补丁提交中包含的信息上。对于一系列事件，讨论准确时刻可能没有意义，但很久以前，Rosetta\
