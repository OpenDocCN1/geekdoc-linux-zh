    ## 使用 Heimer 思导图构建你的想法


    ## 绘制树节点


    思维导图帮助你以清晰的树状结构组织思路。Heimer 可以帮助你绘制这些树。


    **作者：TIM SCHÜRMANN**


    你晚饭吃什么？这是一个棘手的问题，家庭成员对菜单上放什么有不同的想法。幸运的是，这些建议可以在思维导图中快速组织。这涉及在纸的中心写一个核心术语，然后分支出相关的、派生的或从的术语。像树一样，这些分支有助于结构化想法、思想或食谱。


    示例。在 Ubuntu 上，你可以在命令行安装软件：


    ```

    sudo snap install heimer

    ```


    如果你更倾向于使用包管理器而不是 Snap，可以从 Heimer 的 GitHub 页面下载软件包，LTS 目前支持最后三个 Ubuntu 衍生版。这些 deb
