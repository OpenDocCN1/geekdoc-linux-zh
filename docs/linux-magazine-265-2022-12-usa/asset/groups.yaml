  - '[PAGE 9]


    # NEWS

    Linux News


    Along with the slimmer veneer, the Theio has picked up more color variations for
    the wood, which is swappable to allow users to change the look of their desktop
    whenever they choose. Colors include Neptune Blue, Martian Red, and Farout Pink.


    +   - Check out the new look and purchase your Theio from the official System76
    site (https://system76.com/desktops).


    # Ubuntu Software Store Rumored to Replace Gnome Software


    A community-driven software store, named Ubuntu Software Store, has been written
    in Flutter and received so much positive attention that Canonical (according to
    this thread: https://www.reddit.com/r/linux/commentsxcwu5/canonical_seemingly_begins_process_to_replace)
    is considering it a replacement for Gnome Software.


    The features in Ubuntu Software Store include Snap support, dpkg/rpm support,
    an adaptive layout, install from manager, remove and update software, permission
    manager, and search. The most impressive aspect of Ubuntu Software Store is its
    speed. Unlike Gnome (on Ubuntu), which can be quite slow.


    At the moment, the best way to test the new Ubuntu Software Store is via an Appimage
    that can be downloaded from the official System76 GitHub page (https://github.com/ubuntu-flutter-community/software/releases).
    Because this is in Alpha, users should consider this new software for production
    use. However, Software is definitely in active development, with around 14 developers
    working on the project. If you test the Alpha version, know you''ll probably run
    into issues. Hopefully, Software will release v.1 soon and then be made available
    for those wanting a much more performant and reliable app store.


    # A New Arch-Based Linux Distribution Has Arrived


    Crystal Linux (https://getcrystal.ai/) is a new operating system, based on Arch
    Linux, that hopes to become the Fedora of Arch Linux by bringing new "stuff" to
    the Linux desktop while being user-friendly.


    Crystal Linux has been released on GLIBC3 and uses its own GUI to make the installation
    simple. This new Linux distribution features an easy-to-use package manager, Blitz
    support, ZRAM support, and a choice between Gnome, KDE Plasma, Cinnamon, Mate,
    Budget, Onyx, Sway, Wayland, i3-gaps, bamboo, AwesomeWM, and heretofore.


    The installer the developers have created is nothing short of brilliant. Not only
    is it beautiful, but it makes this Arch-based Linux distribution something anyone
    can.


    Out of the box, Crystal Linux doesn''t include a large set of installed applications,
    but it does include a well-designed app store where you can install all the necessary
    apps you need with a click of the mouse or trackpad. By default, you will only
    see the Gnome apps (Weather,ing, Terminal, System Monitor, Disks, and Calculator)
    as well as Firefox and Vim.


    I did find that I had to run a few upgrades to the live system before I completed
    the task. Other than that, this new Linux distribution shows serious promise that
    it makes Arch Linux an option for users.


    Download Crystal Linux from the GitHub page (https://github.com/crystal-linux/iso/releases),
    and just remember that this new distribution is still new and has to reach a stable
    release. Because of this, I wouldn''t recommend using Crystal Linux for production
    purposes.


