    # # System76 Skips Pop!22.10 to Focus on COSMIC Desktop


    ETIX is a KDE-Based Linux distribution that has recently introduced a new release,
    2.9, which adds something special into the mix - the ability to easily install
    Android apps.


    The ETIX developers have added Android in their mix with support for Google Play
    Pre-installed. Because this on Anbox also comes with Google Play storage, not
    is the installation of Android apps simplified for Linux, but the apps more dependably
    and predictably.


    But Android support is not the only bit for ETIX. Before this, the release was
    based on Debian (which is a Linux Distribution). As of 2.9, it includes a new
    Refinstaller along with Refract software.


    The version of KDE Plasma showing with ETIX 2.9 includes and includes kernel 5.15
    with option to use kernel 5.1.


    Do note that ETIX2.9 is very experimental (the Anbox branch). Because of this,
    you shouldn''t consider 2.9 for production environments.


    Download an ETIX 2.9 here (https://sourceforge.net/etix/files/) and spin it up
    as a virtual machine to test the new features.


    # # New Look for System76 Thelo


    Carl Richie, CEO of System76, had an epiphany. He says, ''I was waiting in line
    for a COVID test and I was looking at the tree in my car, wondering how it would
    look like all I stood and held my hand to the point where I started thinking about
    the wood-to-metal ratio, and how modern that phone felt with only a little bit
    of wood.''


    Then Richie decided to use wood on the System76 Thelo, not just for a sleeker,
    more modern look, but also to make the build process of the chassis more efficient.
    With a slimmer piece of wood veneer, the process takes less precision to accomplish,
    which results in consistency and the reduction of extrusions from four to two.
    The wood (as well as materials) is sourced within the US, and for every Thelo
    purchased, System76 plants trees to the National Forest Foundation.


