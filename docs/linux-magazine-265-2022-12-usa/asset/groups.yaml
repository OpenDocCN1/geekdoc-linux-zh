    5).


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_79_0.png)


    Figure 5: JChemPaint creates drawings based on SMILES strings.


    However, JChemPaint does not have a function for drawing electrons. What it does
    have a function for inserting radicals (atoms or molecules with an unpaired electron).
    In addition to add a double bond, nitro oxide (N-O) has a radical belonging to
    the nitrogen atom. To do that, you need to select the atom in question and add
    the radical via Atom | Radical | Unpaired Electron.


    On top of this, molecules or rings can be rotated, and rotated around their axis
    to change the angle of view. To do this, click on the selection and then select
    the rotation tool. Using this, you can now flip the molecule horizontally or vertically
    with the push of a button. The icon that signifies a circular movement occurs
    when you press the button. Pressing the rotation button (an arrow pointing around
    a sphere) lets you rotate the molecule horizontally (Figure 6).


    More Aroma

    Aromatic compounds consist of rings with double bonds. Rings here can be inserted
    with geometric shapes such as triangles, pentagons, or hexagons. On the right
    side of the toolbar, JChemPaint provides tools for the required structures. Use
    Tools | Clean Up to align the arrangement nearly.


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_79_1.png)


    Figure 6: Horizontal rotation around the molecular axis changes the compound''s
    angle of view.


    You can also normalize aromatic compounds in JChemPaint. By using JChemPaint,
    you can improve the arrangement of two molecules drawn side by side by selecting
    the structures and then using Tools | Clean Up to align the arrangement nearly.


    # Operations on the molecule


    JChemPaint''s eraser lets you erase bonds or atoms. Once delete is enabled, move
    the mouse over the atom or bond until the arrow turns into circles. Then press
    the left button to remove it.


