    ```\n**Figure 5**: The importer \"remembers\" files with the UUID in the cache\
    \ file.\n\n### Check and Save\n\nHow an importer determine if the SD card is already\
    \ updated with the same name? The Go program presents here to a cache that makes\
    \ files of the photo directory and a list of the SD card for import. Figure 3\
    \ shows the importer action. Called with the name of the photo (directory), the\
    \ importer works its way through the images, checking the depth of the directory.\
    \ It checks if a photo has been copied via the cache data. If not, it creates\
    \ in a date-based file structure (Figure 4).\n\nThe items that cache helps the\
    \ program to remember which photos already copied. It checks on file names and\
    \ sizes to this.\n\n# IN-DEPTH Snapshot – Go Photo Organizer\n\nListing 1: cacher.go\n\
    \n```go\npackage main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"github.com/google/uuid\"\
    \n\t\"io/ioutil\"\n\t\"os\"\n\t\"strings\"\n)\n\nconst Uuid = \"uuid.\"\nconst\
    \ cacherPath = \".db-import-cache\"\n\ntype Cacher struct {\n\tuuid     string\n\
    \tiPath    string\n\tuuidPath string\n\tcachePath string\n\tcache    map[string]bool\n\
    }\n\nfunc NewCache(ipath string) *Cacher {\n\thomedir, err := os.UserHomeDir()\n\
    \tpanicOnError(err)\n\treturn &Cacher{\n\t\tuuidPath:  path.Join(ipath, uuidPath),\n\
    \t\tcachePath: path.Join(homedir, cacherPath),\n\t\tcache:     make(map[string]bool),\n\
    \t}\n}\n\nfunc (c *Cacher) Init() error {\n\tbuf, err := ioutil.ReadFile(c.uuidPath)\n\
    \tif err != nil {\n\t\treturn err\n\t}\n\tcache, uuid := strings.TrimSpace(string(buf)),\
    \ \"\" // OCR logic seems broken here, but cleaning up based on context\n\tc.uuid\
    \ = uuid\n\treturn nil\n}\n\nfunc (c *Cacher) Read() {\n\tf, err := os.Open(c.cachePath)\n\
    \tif os.NotExist(err) {\n\t\treturn\n\t}\n\tdefer f.Close()\n\tscanner := bufio.NewScanner(f)\n\
    \tfor scanner.Scan() {\n\t\tline := scanner.Text()\n\t\tc.cache[line] = true\n\
    \t}\n}\n\nfunc (c *Cacher) Write() {\n\tf, err := os.OpenFile(c.cachePath, os.O_RDWR|os.O_CREATE|os.O_TRUNC,\
    \ 0644)\n\tpanicOnError(err)\n\tdefer f.Close()\n\tfor k, v := range c.cache {\n\
    \t\tfmt.Fprintf(f, \"%s\\n\", k)\n\t}\n}\n\nfunc (c *Cacher) Exists(key string)\
    \ bool {\n\t_, ok := c.cache[c.uuid+\":\"+key]\n\treturn ok\n}\n\nfunc (c *Cacher)\
    \ Set(key string) {\n\tc.cache[c.uuid+\":\"+key] = true\n}\n```\n*(Note: The OCR\
