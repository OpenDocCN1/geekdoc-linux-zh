    \ BETTA GET METTA（获得 Meta）\n\n亲爱的读者：\n\n当 Facebook 改名为 Meta 以纪念其对“现实元宇宙”的新愿景时，我知道他们正在认真对待这项倡议。但我承认，很难搞清楚他们在说什么。这些愿景描述了一种虚拟现实的、完全沉浸的、统一的互联网体验——这看起来非常大胆且具有革命性，但仍显不足。你可以从科幻小说中寻找线索，例如尼尔·斯蒂芬森\
    \ 1999 年的作品《雪崩》（*Snow Crash*），它就是为了元宇宙而创作的。但要与人互动的现实仍然遥不可及。\n\nMeta 的 Horizon\
    \ 平台上个月登上了新闻，消息并不乐观。用户抱怨有 Bug，并普遍认为在虚拟空间中没有可以互动的人。许多人表示他们在这个虚拟世界中感到孤独，到目前为止还没有足够的人，只能随波漂浮。（Meta\
    \ 随后宣布他们正在解决遗留问题。）\n\nHorizon Worlds 背后的理念是通过对虚拟现实的完全沉浸来超越 Life 等其他平台。用户被鼓励创建他人可以查看的内容——“世界”。然而，根据《华尔街日报》的一项研究，只有\
    \ 9% 的世界访问人数超过 50 人且访问超过一次。\n\n最初的目标是到本月用户数超过 50 万，但实际数字少于 20 万，而且据报道，大多数用户在第一个月后没有回到该平台。Meta\
    \ 旗下的 Reality Labs 部门去年花费了 100 亿美元，今年又投入了 55 亿美元。\n\n也许最尴尬的是内部文档的泄露，揭示了 Meta 与\
    \ Horizon Worlds 状态之间存在着怀疑态度 [2]，并伴有对 Bug 和糟糕用户体验的抱怨。一位 Meta 员工说：“一个空空的世界是一个无用的世界。”\n\
    \n当内部备忘录显示公开言论与员工实际交流的内容不同时，我们很容易产生想法。或者也许，我尊重 Meta 仍然称它们为 Facebook，因为它支持这种针对高风险企业倡议的内部辩论——很多公司是不允许的。\n\
    \n**信息**\n\n- (1) “公司文件显示 Meta 元宇宙计划受阻。”*华尔街日报*，2022年10月15日：https://www.wsj.com/articles/metaverse-horizon-worlds-facebook-internal-documents-11665798617-mod-hp-lead_pos3[付费墙]\n\
    - (2) Meta 员工某种讨厌元宇宙：https://www.thestreet.com/investing/meta-employees-kind-of-hate-metaverse\n\
    \n尽管如此，看着这些未来感的装饰，我不禁想这个故事到底有多少是关于“我们现在还不知道的事”——问题公司经常忘记最初定义它们的所有目标。为了实现所有目标，他们有一种构建新事物的冲动，为此，他们创造客人，直到他们长大然后离开。如果你看起来像个客人，那就错了，要完全对故障无所忌忌，尽管这个世界从一开始就有一点瑕疵。\n\
    \n从某种意义上说，预测互联网会以某种方式合并是完全符合逻辑的——也许它们确实会这样做。而且似乎最终，人类可能只在小领域拥有他们的虚拟现实，而“完全沉浸”并不能真正吸收——或减少到足以支持理想现实的产生。我承认我可能想得太多，也许我不是最好的评估者，但在虚拟现实头戴设备中长时间停留似乎是一件微小的事，它可能吸引偶尔的娱乐时刻，但作为一种生活方式？\n\
    \n我另一个好奇的是，Zoom 聊天在 COVID-19 疫情期间是否遭受了我们认为的人类互动的影响。Zoom 会议、聚会甚至 Zoom 小时现在已是常态，而你看到的只是静态维度的参与者，没有时间的脸庞。\n\
    \n从某种意义上说，预测互联网最终会以某种方式合并是完全符合逻辑的——也许它们确实会这样做。而且似乎最终，人类可能只在小领域拥有他们的虚拟现实，而“完全沉浸”并不能真正吸收——或减少到足以支持理想现实的产生。我承认我可能想得太多，也许我不是最好的评估者，但在虚拟现实头戴设备中长时间停留似乎是一件微小的事，它可能吸引偶尔的娱乐时刻，但作为一种生活方式？\n\
