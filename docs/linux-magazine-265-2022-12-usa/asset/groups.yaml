    \ a different name, say, IMG<number>.JPG. Cameras also increment the consecutive\
    \ numbering of new photos for each shot. This need is described in the Design\
    \ rule for Camera DCF File system (DCF) [1] specification. The DCF specification\
    \ defines the format of the file names and specifies what happens if a counter\
