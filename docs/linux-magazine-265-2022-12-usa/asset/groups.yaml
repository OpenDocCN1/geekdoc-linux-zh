    # AppImage, Flatpak, and Snap: Innovative Linux Package Managers


    The traditional package management systems on Linux are now outdated, but AppImage,
    Flatpak, and Snap see some interesting new systems entering the fray.


    BY ERIK BÅWALDT


    When Linux set off on its successful journey back in the 1990s, some software
    management solutions emerged. As early as 1994, the Debian Package Manager dpkg
    was introduced, and the Red Hat Package Manager RPM followed in 1997. Since then,
    other package management systems for various distributions have been seen in the
    light of day.


    What all have in common is they not only maintained software repositories with
    applications, but also let users update and uninstall applications in a trouble-free
    way. All of the popular candidates handle dependencies and conflicts and keep
    the respective system in a consistent state. Why install installation for applications
    without a jungle of dialogues, which are commonplace on other systems that do
    not exist on Linux.


    At the same time, the known tools are flexible enough to include additional software
    which the repositories provided by the distribution developers offer the advantages
    of centralized package management. The built-in package managers on traditional
    distributions work on the command line. However, graphical front ends as Apt or
    Synaptic emerged for less experienced users, helping them to handle software at
    the push of a button.


    Having said, the veteran package management tools come with some drawbacks. Depending
    on the update of the operating system, they may have outdated interfaces. The
    biggest problem is that the individual binary packages available in the different
    formats are not fully compatible. To a limited extent, you can convert DEB and
    RPM packages to the other format using the Alien [1] tool, but you can not achieve
    general compatibility.


    In order to work around this shortening and launch further, cross-distribution
    package formats have emerged on Linux in recent years. Each of them can be integrated
    into existing installations with their own management systems.


    # AppImage


    The AppImage [2] package management system cross-distribution application packages.
    You will always find all the libraries you need. The packages are actually compressed
    drive images that use the SquashFS file system and are located in the /directory.
    As you execute the program, the main point is released after again.


    After downloading an AppImage package, you will need to execute privileges using
    chmod +x command to run it without needing root. Because you are not installing
    on the operating system, it is no problem to run two or more versions of the same
    program at once. And, you can install and run the same program - if available
    - from


