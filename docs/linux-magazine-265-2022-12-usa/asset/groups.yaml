    # IN-DEPTH

    ## Command Line – McFly


    Replacing history with McFly


    ### Back to the Future


    McFly improves on the venerable history command with a customizable interface
    and contextualized results. By Bryce Byfield


    - the history command brings previously used commands to use again. So could we
    be a more appropriate name for a history replacement than the last of Michael
    J. Fox''s character in Back to the Future? McFly [1] replaces history with contextualized
    results that are generated with an AI-algorithm and a SQL database. Although no
    query was made with history commands, McFly offers numerous advantages:

    - Results are displayed full-screen, with basic commands summarized in the tilebar
    (Figure 1).

    - Information is given about when a result was run and in which directory, if
    it was not in your home directory, as well as if it failed. Failed results are
    not displayed.

    - Priority is given to the present working directory.

    - Results take into account other commands that in the past were run after the
    command.


    | Esc | Exit | - | Run | Tab | Edit | F1 - Switch Sort to Time | F2 - Delete |

    |---|---|---|---|---|---|---|---|---|

    | $ brew update | | | | | | | | |

    | brew born | | | | | | | | |

    | brew hello | | | | | | | | |

    | cd /home | | | | | | | | |

    | brew install tree | | | | | | | | |

    | brew doctor | | | |


    **Figure 1**: Unlike history, McFly uses a result, with a summary of navigation
    keys in the tilebar.


    searching history in favor of the up and arrow keys.


    or


    Results may change depending on the directory from which McFly is run, but can
    return more results, but can also confuse or replicate entries. If results set
    to display priority, a previously selected command is given priority, while a
    command that results in an error is not displayed or given lower priority. As
    you use McFly, results may shift and adjust to your use of commands. The search
    command can also be found using --fuzz (-N) for a fuzzy search and --results (-R)
    to specify the number of results. In addition, --output=(-O) --path saves the
    results to a file.


    # Installing and Configuring McFly


    McFly runs on Bash and Zsh shells, with support for the shell development. McFly
    can be installed using Homebrew [2] or an installation script. To use the installation
    as shown in Figure 3, run the following command:


    ```

    curl -fsSL https://raw.githubusercontent.com/cantino/mcfly/master/install.sh |
    sh - --git mcfly

    ```


    At this point, McFly is ready to run, but you may want to configure it using --config
    with the various options shown in Table 1.


    # Running McFly


    McFly''s basic syntax for searching is:


    ```

    mcfly search history

    ```


    Then add the following line to your ~/.bashrc:


    ```

    eval "$(mcfly init bash)"

    ```


    or to ~/.zshrc:


    ```

    eval "$(mcfly init bash)"

    ```


    Finally, to link McFly to the shell, run `source ~/.bashrc`.


    The basic navigation appears in the bar of the pages (see Table 2). You can also
    display McFly''s history and scroll through it with the up and down keys. Using
    the arrow keys is the least effective way to use it, but is the most common way
    to recover history when using the same command several times in a row. This functionality
    makes McFly a complete replacement for history. Many users use the search sub-command.
    However, McFly also supports other commands which are not documented by name,
    only by entries accessed from the --help sub-command. You can also add the sub-command
    to the shell by using --dir (-d) to specify where the history is, --edit (-e)
    to specify an edit code, and --when (-w) to specify when the command was run.
    Simply re-open any entry to search results with the old history command.


    | % | Received % | Average Speed | Time | Current |

    |---|---|---|---|---|

    | % | Download Upload | Total Spent | Time Left |

    | 100 | 17450 | 17450 | 0 | 00:00:294 |


    **Figure 2**: Search results with the old history command.


    | % | Received % | Average Speed | Time | Current |

    |---|---|---|---|---|

    | % | Download Upload | Total Spent | Time Left |

    | 100 | 17450 | 17450 | 0 | 00:00:294 |


    **Figure 3**: McFly installation script.


    | % | Received % | Average Speed | Time | Current |

    |---|---|---|---|---|

    | % | Download Upload | Total Spent | Time Left |

    | 100 | 17450 | 17450 | 0 | 00:00:294 |


    **Figure 4**: The time it runs, McFly imports history''s list of commands.


    # Is McFly Worth Using?


    At least initially, algorithms that have been trained may fail. I can say with
    confidence that weeks of semi-regular use did not noticeably improve McFly''s
    results. However, inconsistent trials are inconclusive. It seems likely that heavier
    or a longer trial period would produce clearer results. Documentation on how to
    use the train sub-command would be useful as well.


    However, even without a learning algorithm, McFly has benefited over history.
    Not only is McFly customizable, but through its environment variables and sub-commands,
    its interface makes it much easier to use history. Even with the strict limit
    McFly''s design makes it one of the best breed of Linux commands that are replacing
    many of the venerable ones.


    ### Table 1: McFly Options


    | Export | Description |

    | --- | --- |

    | export MCFLY_LIGHT=TRUE | Sets McFly in light mode rather than the default dark
    mode. |

    | export MCFLY_KEY_SCHEME=vim | Sets McFly to Vim commands rather than the default
    Emacs. |

    | export MCFLY_FUZZ=true | Displays related terms, not just matches. This could
    increase the chance of finding results, but at the cost of more results to scroll.
    |

    | export MCFLY_INTERFACE_VIEW=BOTTOM | Places menu at the bottom of the screen.
    |

    | export MCFLY_DISABLE_MENU=TRUE | The titlebar is not displayed. |

    | export MCFLY_HISTORY_LIMIT=50 | Limits the number of results displayed. By default,
    only the top dozen results show in McFly''s history. |

    | export MCFLY_RESULTS_SORT=RUN or MCFLY_RESULTS_SORT=RANK | Displays results
    according to the time run or by the rank assigned by Mc. |


    ### Table 2: Navigating McFly Commands


    | Key | Description |

    | --- | --- |

    | Enter | Run the command highlighted by the arrow key. |

    | Tab | Edit a command before running it. |

    | F1 | Sort by time, rather than. This is the default, so it has no effect unless
    MCFLY_RESULTS_SORT=RANK is set (see Table 1). |

    | F2 | Delete the selected command from McFly''s history. Useful for improving
    results. |

    | Esc | Closes page and returns to the command prompt. |


    ### Info


    - [1] McFly: https://github.com/cantino/mcfly

    - [2] Installing with Homebrew: https://unicop.com/how-install-mcfly-on-linux/


    ### Author


    Brucefield is a computer journalist and a freelance writer and editor in free
    and open source software. In addition to writing projects, he also teaches live
    and e-learning courses. In his spare time, Bruce writes about Northwest Coast
    at https://brucefield.org/press-com/. He is also a co-founder of Pieces, a blog
    about writing and fantasy at https://prenticepieces.com/

