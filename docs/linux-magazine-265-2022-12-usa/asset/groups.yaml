    # Figma: easy design


    Some people bunched up. They wanted something simple that helps them iterate and
    iterate over user interfaces. They tried Figma because of this its drawings live
    alongside its social features, including notes, and whiteboard. Prototyping and
    design BY GRAHAM MORRISON


    After vowing to be impressed by AI-generated images, Graham has spent this month
    wrestling with Stable Diffusion until it''s like some oracle or prophet of truth.


    When Adobe announced it would acquire Figma (the go-to tool for designers) for
    $20 billion, there was initial shock followed by a dash to find alternatives,
    which isn''t an easy task. Frankly, there are a few alternatives. The strongest
    is Pen, which is an excellent design tool but only works through a browser. This
    is where Akira helps. Akira is an open source Linux tool in early development
    phase. There''s still a lot of work that needs to be done and the project is keen
    to point out it should not be used in production. Akira is already functional
    and well positioned to support more resources that might come from influx of new
    users. The interface will feel familiar to fans of Figma. When using GTK, and
    Cairo, it also uses elementary elements for icons and layout. If you''re not using
    Inkscape, the results look and definitely appeal as a great example of how a modern
    application can look. There are still elements missing, especially export and
    collaboration, but hope will fully come.


    One nice feature is that the toolbar is highlighted only when it can be to current
    object section, so you''re not limited to random clicking to see what they want.
    If object is at the bottom, for example it will rise again. Another great feature
    common to other tools is that Akira can transform words in early stages, it''s
    easy to access.


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_83_0.png)


    - Add: Ellipses, rectangles, and free curves can be added to the canvas to create
    designs.

    - Fill: Any number of colors can be applied to an object, and will be blended
    to opacity.

    - Interaction: You can group objects and reorder them to create the appearance
    you need.

    - Layouts: There are dark and light colors, which can group objects together,
    turn them into Artboards, and use the layer to change their order.

    - Layers: Text can transform words into your designs.

    - Order: Colors are mixed naturally with fills and objects each other.


    # Project Website

    https://github.com/akairous/akira


