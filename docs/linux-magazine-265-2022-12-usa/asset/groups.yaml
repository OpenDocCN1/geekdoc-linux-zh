    Newcomers. To program, you simply click the function blocks with graphical elements.
    This method completely eliminates syntax errors. Only building blocks that work
    together can be put together. The graphical representation of the program segments


    To create a new project with CircuitBloks and open the editor (Figure 4), click
    New sketch | Nibble! The code resides in the left pane. To create the project,
    drag and drop them into the center area. The window displays the source code on
    right.


    **Figure 2:** The fully assembled Nibble fits in your hands and the switches are
    easy to reach.


    learn more about the Nibble, visit the manufacturer''s product page [5]


    The CircuitBloks software is available for free download from the website [6];
    there are installation packages for Linux, Windows, and macOS. Detailed instructions
    with an introduction to CircuitBloks can be found on the project page [7]. You
    can write C++ for the Nibble in the Arduino IDE as well, it makes sense to install
    CircuitBlocks because its installer creates a board for the Nibble.


    ## Programming


    After assembling the Nibble according to the instructions, the preinstalled games
    - Invaders, Snake, and Space can be played directly on the device. Also, while
    you want to write your own application for the Nibble.


    Once your project is ready for the first test, run it in the upper right corner.
    Now it takes a moment for the program to launch automatically on the Nibble. That''s
    all you need to do to write your programs in CircuitBloks.


    ## Arduino IDE


    As always, the old Flash example is used as a sample program for the Arduino IDE
    (Listing). To begin, connect the Nibble to a PC over USB and then select the board
    manager. The sample program in Figure 4 shows a Hello World on the display and
    makes a green flash.

