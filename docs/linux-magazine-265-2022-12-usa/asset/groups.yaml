    # IN-DEPTH


    ## Zing


    ### Examples


    Listing 4 shows a typical use of Zing to check the status of an internet host.
    Listing 5 shows a similar query using ping. As you can see, the output for the
    command is similar. Listing 6 shows an attempt to ping a host that blocks ping
    requests. As you can see in Listing 7, Zing is still able to connect.


    The network utility. Zing utility does not require any special packets and is
    simply another application for connecting, binding, and disconnecting from the
    system.


    ## Conclusion


    Zing meets all of the criteria for the utility we needed and is an ideal solution
    to the problem of having lightweight network utility. For more accurate, more
    operations are required, and Zing leaves to the discretion of the user. The Zing
    network utility is open source Java, so is open to be improved, linted, and optimized
    by others in the future.


    The source code is available on GitHub under a GPL v3.0 license. My intention
    is for others, sooner or later, to find, improve, and expand the existing Zing
    source code.


    Other future work for Zing is to port to Python for scripting and to C programming
    language to run near metal. A vision of Zing is another future endeavor: encourage
    others to gather the source code and experiment with it.


