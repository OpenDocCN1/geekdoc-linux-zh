    # 回顾


    ## 发行版之旅 – Puppy Linux


    它们遵循要求并且是 Woof 的前身


    凭借这种结构，Puppy Linux 与其大多数现状相似，具有如 Woof 等 Puppy 发行版共同的功能，以及特定发行版独有的功能。Puppy Linux
    将发行版分为三类：


    - 官方发行版：使用 Woof 并由 Puppy Linux 维护

    - Wolf-Build 发行版：使用 Woof 但具有额外或修改的功能

    - 非官方/Puppmasters：由私人维护，用于特定目的，而不是发布在官方 Puppy Linux 上。


    其中一些已列在页面上。该列表包含了用于构建这些发行版的二进制文件。这些文件基于 Linux，但针对特定的发布版本。表 1 列出了具有活跃论坛的 Puppy
    发行版；目前似乎不存在对 Puppy Linux 的详尽总结。当被要求选择一个 Puppy 时，Puppy 倾向于简单地建议你尝试。


    ## Puppy Linux 的内容


    正如名称所示，Puppy 最初是为资源有限的系统设计的，特别是对于旧机器。我们对过去几十年内存的记忆已不如以前那么重要。然而，由于 Puppy 是由 George
    Christopher Puppy 开发的，Puppy 保持着高效和快速，并可用于高端音频和图形。在数字领域，紧凑性使其具有便携性，并为系统在未来过时提供了保障。但是，许多资深工程师懂得为了效率本身而欣赏效率。


    此外，并不是所有的 Puppy 都共享其他独特特征，尽管它们可能披着不同的权重和主题。观察一个 Puppy 列表，你可以预期将操作系统加载到 RAM 中，其中所有元素都是只读的。Puppy
    Linux 的做法非常节约，将所有文件安装到单个文件夹中，这允许将其安装在另一个系统中，并允许安装多个 Linux 系统 [2]。也可以进行包含操作系统的在内的完整安装，尽管该选项已弃用。


    当你第一次运行 Puppy Linux 时，“快速设置”（Quick Setup，图 3）显示了你可以在哪里自定义设置。从快速设置中，你还可以链接到 Puppy
    向导，那里有更精确的设置（图 4）。跟随配置窗口后会打开欢迎窗口，该窗口由一个栏引入并提供进一步的选项（图 5）。关机时，你还可以选择系统创建的日期以及下次启动的设置（图
    6）。


    ```

    loading the puppy_woof_9.12.s3 file... copying to ram

    loading the puppy_woof_9.12.s4 file... copying to ram

    loading the puppy_woof_9.12.s5 file... copying to ram

    loading the Puppy-5-10.iso file... copying to ram

    ```


    图 2：Puppy Linux 包括将系统加载到 RAM 的选项。


    ## 表 1：带有论坛的 Puppy发行版


    | 发行版 | 论坛 |

    | --- | --- |

    | Bionic | https://puppylinux.com/viewform.php?t=115 |

    | EasyOS | https://puppylinux.com/viewtopic.php?t=2535 |

    | FatDog | https://puppylinux.com/viewtopic.php?t=59 |

    | Fossapup64 | https://puppylinux.com/viewtopic.php?t=820 |

    | Linux | https://puppylinux.com/viewtopic.php?t=126 |

    | Lex Puppy Slack | https://puppylinux.com/viewtopic.php?t=167 |

    | Debian Buster | https://puppylinux.com/viewtopic.php?t=141 |

    | ScPupp64 | https://puppylinux.com/viewtopic.php?t=169 |

    | Slackocke | http://slackocke.ezzy.yx/index.php |

    | Vanilla Puppy | https://puppylinux.com/viewtopic?t=5044 |

    | VoidPupp Slack | https://puppylinux.com/viewtopic.php?t=5270 |

    | Xenial | https://puppylinux.com/viewform.php?t=116 |


    图 3：快速设置提供了可以调优的通用配置。


    图 4：Puppy 最默认配置工具的视频设置。


    图 5：欢迎界面提供了基本的引导。


    Puppy Linux 内部包含了应用程序，如 PuSave 备份、PDDUP（命令的图形化界面）以及用于在论坛中搜索软件包信息的 QuickPuppy。通常情况下，这些
    Puppy 开发是完整的，并且带有异常大量的嵌入文档，这些文档可能不够用，但这些文档通常可以在论坛上找到。


    除了相似之处，万事皆有可能。Puppy Linux 拥有自己的小部件和桌面，以及对主题的选择。有些人偏好图标，而另一些人则喜欢坞（dock）。遵循简单原则，你可以安装各种应用程序，尽管许多程序差异很大。其中一些在其他发行版中常见。某些功能是
    Puppy 独有的，例如在 Library Factory 中安装的折中。


    ## Puppy Linux 的核心


    正如总结所示，Puppy Linux 是一个多样化的项目。几位管理员协助提供方向，但通常或大多数操作系统并不存在组织机构。此外，关于更大的设置，用户是 Puppy
    Linux 的核心。Puppy 描述了一个“Puppy Linux 可以存在的任何地方和任何事情。我们互相帮助并共同努力”。


    对于 Puppy Linux 来说，这为我们提供了一个住所。许多 Puppy 用户来到这个论坛寻求帮助，很快他们就在修复漏洞、为他人测试设置和 Puppy
    版本，或者提供他们修改过的版本……因此，总会有多个新版本推出。它们都遵循基本的设置和配置，之后，这对所有人都是免费的。


    对于我这样参与 Linux 数十年的人来说，Puppy Linux 让人想起早期最美好的时代：Puppy 是一个由完全的狂热爱好者聚在一起实现他们愿景的项目，他们产出的卓越成果值得被保留。我只能希望我已经对
    Puppy Linux 公尽了起见。感谢所有回答我问题的 Puppy 成员，特别是网站管理员 rookie，他为我的答案搜索提供了支持。


    ## 信息


    - [1] Puppy Linux: https://puppylinux-woof.github.io/

    - [2] Frugal: http://www.wiki.puppylinux.com/Frugal


    图 6：Puppy Linux 可以在启动时保存当前状态。在下次启动时，将恢复之前的状态。


    2022年12月32日 第265期


    LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM


    '
