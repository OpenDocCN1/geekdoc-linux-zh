    Pokete 如此吸引人。正如你可能猜到的，这是一款松散基于收集宝可梦理念的游戏，但这使其非常适合在你执行必要的更新时，溜进 tmux 会话的背景中。你扮演
    Pokete 训练师的角色，带着回合制、8 位音乐、小镇上的治愈中心和收集精神环游世界。Pokete 是在廉价休息时间里游玩的一场很棒冒险。


    你可以进入战斗，使用物品栏中的物品，或使用你的 Pokete 卡组。所有选项对宝可梦收集者来说都是很熟悉的。在战斗期间，你可以切换并展示对手侧的特征。在 Pokete
    之间移动并面对面地收集非常有趣，让你变得更强大以应对更多冒险。


