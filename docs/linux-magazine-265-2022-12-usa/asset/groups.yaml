    # This Month''s DVD


    # Manjaro 21.3.7-220816 and Arch Linux 2022.10.01


    Two Terrific Distros on a Double-Sided DVD!


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_5_0.png)


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_5_1.png)


    # Manjaro 21.3.7-220816

    64-bit


    # Arch Linux 2022.10.01

    64-bit


    Manjaro is to Arch Linux what Ubuntu is to Debian. That is, Manjaro is a more
    user-friendly version of a well-distributed Linux that new users find difficult
    to install. Like Ubuntu, Manjaro overcomes the difficulty of installing its parent
    distribution with an easier installer, as well as proprietary drivers. In addition,
    Manjaro installs a curated set of applications and choices for Gnome, Plasma,
    and Xfce desktop environments. Manjaro introduces innovative packages in its repositories,
    such as the Jade environment.


    Arch Linux is a rolling release. Packages fresh from Arch repositories are available
    from the Unstable repository and move to Testing after being installed by Manjaro
    users, usually a few days after they appear in Unstable. When judged for general
    use (usually a few weeks later), packages are moved into Stable. With this Debian-like
    set of repositories, Manjaro provides rolling release with less chance of problems.


    Users are attracted to Arch as an easy way to satisfy their curiosity about Arch.
    However, many learn to appreciate Manjaro for its ease.


    Arch Linux is not the most widely used distribution, it has a solid reputation
    as a lightweight distribution that is geared towards simplicity. In other words,
    Arch makes few assumptions about users and what they want, leaving decisions about
    what to install and how to configure each user. As a result of this philosophy,
    Arch accurately has a reputation as one whose extensive documentation is less
