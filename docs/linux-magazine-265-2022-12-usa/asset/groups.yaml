    ## 通过 deb-get 轻松访问第三方软件

    作者：Adam Dix


    deb-get 让 Debian 和 Ubuntu 用户能够轻松访问第三方软件。搜索第三方仓库并配置你的计算机以使用它们需要花费精力和时间。如果你通过单一工具访问所有包，那就不那么简单了！一种名为
    `deb-get` [1] 的新命令行实用程序为 Debian 和 Ubuntu 安装和卸载第三方 .deb 包变得变得简单。`deb-get` 允许我们快速设置和更新在发行版存储库中不可用的软件。根据开发者的说法，deb-get
    项目的目标是提供：“...为发布在第三方仓库或通过直接下载的 .deb 包提供 apt-get 功能”。


    deb-get 的灵感源于 Software Boutique，这是 deb-get 领导者 Martin Wimpress 在为 MATE 桌面环境做出贡献时参与的项目。Software
    Boutique 是一个精选的顶级软件集合，面向那些意识到传统管理系统臃肿和信息过载的用户。其构想是，你不是在一家超大型百货商店购物——而是在一家小得多的精品店购物。尽管
    `deb-get` 没有像 Software Boutique 那样华丽的图形界面，但它共享了提供精选软件集合的目标。


    Debian 和 Ubuntu 都维护着包含数千个包的扩展软件包存储库，适用于广泛用途；有几个原因导致 `deb-get` 包可能仅存在于第三方仓库中。例如，包可能尚未添加到官方存储库。或者，如果官方存储库中有软件的某个版本，可能可以直接从开发者那里获得更新版本。而且，正如大多数
    Linux 用户所知，第三方服务不受限制包含在 Linux 发行版中的原因是——要么是发行者的选择，要么是因为其限制性许可证遵循 Linux 策略。偶尔访问它，第三方应用有助于这些用户适应
    Linux，这是迈出的一步。偶尔访问第三方应用可以帮助他们适应 Linux。


    或者，如果你愿意，只需从 Releases [2] 页面下载 .deb 文件并使用你的包安装器安装它。


    截至目前，deb-get 带有许多来自的软件包，例如 Apt for Linux, Raspberry Pi 等。现在你可以将 deb-get 视为在 Debian
    存储库中未找到软件的替代方案。


    deb-get 设计为适用于 Debian 和 Ubuntu 存储库。


    ### 使用 deb-get

    对于任何使用命令行 apt-get 的人，使用 deb-get 会感到非常熟悉。你需要知道安装的包名。要查看列表，可以在命令行使用第一个命令：


    ```bash

    $ deb-get install

    ```


    deb-get 输出可用包列表（图 1）。从这里你可以看到 apt-get 的镜像，并且你可以通过命令行安装、升级、卸载、清理、搜索等来管理你的软件。


    例如，假设你想安装 WhatsApp for Linux (3)，但你不知道，且 deb-get 知道它的包名。你可以运行 `deb-get app-for-linux`
    来查找它。然后运行以下命令安装该包（图 2）：


    ```bash

    $ deb-get install https://github.com/eneschenk/whatapp-for-linux/releases/download/v1.2.0/whatapp-for-linux_1.2.0-1_amd64.deb

    ```

    图 2：使用 deb-get 安装应用程序。


    ### 安装 deb-get

    人们如何获取安装 deb-get？GitHub 已经涵盖了：


    如果你在想，“这听起来又是另一种在 Linux 机器上放置非自由软件的方法，”那么你可能会注意到，可用的包中有些包的许可证不符合自由软件原则。如果你是一个只使用自由软件的用户，你可能可能对此感兴趣。然而，大量的非自由软件出现在
    Linux 上，而且由于许多用户只需要且并不投入于自由软件，deb-get 是一个很好的选择。


    #### 结论

    请记住，deb-get 是为 Debian 和 Ubuntu 存储库设计的。对我个人而言，我发现 deb-get 节省了一些时间，这是我通常情况下需要去寻找的东西。我的希望是，也许这个工具可以集成到
    Ubuntu 软件中心或其他地方，以便新用户更轻松地使用。但即使这些从未发生，我也很高兴有一个能让我的生活变得轻松一点的工具。


