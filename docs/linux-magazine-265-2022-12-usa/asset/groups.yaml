    ## MakerSpace


    ### Microcontrollers for Beginners


    The Nibble kit by CircuitMess is a freely programmable game console that makes
    getting started with microcontroller programming a breeze. The Nibble kit [1]
    comes with everything you need to build a portable game console. It includes a
    soldering iron, a simple screwdriver for assembling the case, and the batteries
    (Figure 1). The kit is suitable for children from nine years up, as my test shows,
    older users can have fun with the kit as well. The very detailed and easy-to-understand
    instructions explain all the build actions step by step. In some places, links
    to online videos lend further help. The assembly instructions are available for
    download on the manufacturer''s site in several languages [2]. The Nibble kit
    allows users to acquire a number of skills, with the simple act of assembling
    the housing, to soldering, programming the microcontroller in C.


    The core of the kit is the ESP826 microcontroller. The community very appreciates
    this little device, because it has a WIFI interface, which is why you will see
    it used in many projects, including one I wrote about [3]. That also has an installation
    guide for the Arduino environment. According to the instructions, it takes about
    two hours to assemble the Nibble (Figure 2), but an experienced maker can do this
    considerably faster. The most annoying step by far peeling the protective film
    off the Flexiglas, however reliably prevents the modules from being scratched.


    Although CircuitMess uses a subscription model and does not sell the kit anymore,
    you could order the kit on the Generation Robots [4] website for about €66. This
    website focuses on robotics and electronics, but you will also find many other
    products, so it''s definitely worth browsing.


    **Figure 1:** CircuitMess delivers the Nibble kit parts in a new package.


    ## CircuitMess Nibble MAKERSPACE


    The software for Pebble is completely open source, and can be downloaded from
    GitHub [8]; however, the schematic is not included in the manufacturer''s pack
    [9].


