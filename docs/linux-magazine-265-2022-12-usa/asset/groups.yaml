    needs.


    Some compilers, tended to have generated systems optimized for size. Others may
    focus more on speed, making the language different optimizations. If you look
    at the GCC compiler, you can see many different optimizations, in the code in
    one way or another which will affect the "efficiency" of the code.


    Interpreters will use the code and get it work without any optimization, making
    it harder to do the actual performance, but then on the optimizations for the
    final.


    This would be great except that optimization can inject errors, and often those
    errors are hard to find.


    Many people reading the whitepaper argued that interpreters and scripting languages
    are always less efficient.


    I often heard about how scripting was inefficient. However, Unix and Linux have
    been rewritten over the years to be really efficient, depending on an application,
    a well written script might be as efficient as a properly written C.


    Interpreters pre-compile to get down to "stops" (or loops) that are consumed by
    a very efficient runtime.


    There is also the concept of a thinned interpreted language, where a "thread"
    simply gathers calls after every module call.


    C is a minimal syntax that is very powerful, but forces the compiler to create
    their own routines or use libraries that come from the various operating systems.
    Use of "pointers" is very powerful if used well, but also leads to mistakes if
    the compiler is not careful.


    Python has many useful functions, such as garbage collection that save the language
    works well with different types of functions. On the other hand, languages with
    so much syntax that it takes hard for mortals to learn adds to complexity.


    People ask me how they get started with programming. I point to scripting as a
