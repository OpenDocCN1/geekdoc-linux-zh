    you can zoom in and out of the entire map. To use a different font, Font in the
    status bar (3) Also can be adjusted using the status bar. Arrow size determines
    the size of the arrowheads, while Edge controls control the line thickness. Finally,
    you can round the corners of the nodes using the Corner radius.


    When arranging the nodes, Helmer supports you in several ways. First, you can
    use the arrow to drag the mind displayed. Alternatively, you can drag the map
    to the appropriate position using the mouse. For better orientation, show a grid
    which the nodes follow specifically when moving (Figure 4). To do this, check
    grid in the status bar. If you see this entry, click the double arrow on the right
    in the status bar. Then increase the grid size to suit your needs. In practical
    terms, any values from 10 upwards will be fine.


    Deleting the group is very likely to push the nodes back and forth to create extra
    space. Again, if the nodes look a little messy in the window, select Edit | Limit
    nodes OK, and Helmer rearranges the nodes. How this is done is influenced by Minimum
    Edge, which specifies the arrow length. The higher the value, the bigger the gap
    between the nodes. The Aspect Ratio determines whether Helmer rearranges the nodes
    horizontally or vertically (Figure 5).


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_91_0.png)


    Figure 3: The font and size selections always applies to the complete mind map.
    The other settings in the status bar refers to all elements.


    Changing Links

    The tree structure is now gradually emerging in Helmer. As usual a mind map, the
    nodes grow out from the central node and never go back. Helmer lets you retroactively
    disconnect and reconnect connections. To do this, hold down Ctrl and click on
    the relevant nodes. Alternatively, hold down the Shift key and drag a frame around
    the nodes with the mouse. All of the nodes will be highlighted in red. From now
    on, most actions will affect all of these nodes. For example, if you move one
    of them, the others will automatically move with it.


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_91_1.png)


    Figure 4: If desired, a grid can help you identify the individual nodes.


