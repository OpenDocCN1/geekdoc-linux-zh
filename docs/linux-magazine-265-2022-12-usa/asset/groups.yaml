    # # Representing paint molecules with JChemPaint Molecule Editor


    Drawing of molecules can be made with a graphics program like Inkscape. But structural
    formulas turn even better if you use the JChemPaint professional molecule editor.


    E very now and then, students need a tool for chemistry classes that makes it
    easy to put chemical structural formulas on digital homework, but also helps to
    decorate assignments by drawing the chemical reactions. The free molecule editor
    JChemPaint [1] supports the (budding) chemist here.

    The LGPL. Java program is only available from the package stores of a few distributions.
    Linux maintains the program in the Arch Repository, JChemPaint can easily be downloaded
    from the homepage and run at the command line (Listing 1). The settings let you
    change the language and appearance of other things. To do this, select Edit |
    Settings and switch to the Other settings tab.


    as a structural formula, you would start with a central atom such as carbon. Alternatively,
    you can start from the edge of the structural formula. For carbonic acid, for
    example, draw the functional (a small collection of atoms that how a molecule
    works), which is, carboxylic acid C=O. Click on the C in the toolbar and then
    draw the bond to the atom.

    JChemPaint automatically adds atoms to the carbon so that the atom does not have
    a charge. As you continue with the drawing, you will notice that the program replaces
    the hydrogen atoms on the molecules or bonds you have placed.

    To double a bond, double-click on the C representing the oxygen atom and then
    use the left mouse button and draw a line starting at the atom. JChemPaint then
    replaces it with a double bond and two hydrogens (Figure 1). Continue until you
    have drawn the structural formula of the chemical compound.

    Chemical compounds consisting of less atoms can also be represented, but the atoms
    needed for them are not easy to find. Press the periodic table in the lower toolbar
    reveals all atoms contained in the periodic table (Figure 2). Like previously,
    you can transfer these atoms to the drawing with a single click. It is worth mentioning
    at this point that the drawings in JChemPaint are not black and white. The atoms
    follow accepted standards. An oxygen atom is shown in red, for example, while
    a chlorine atom has a green background.

    Multichain carbons are unusual in organic chemistry. For example, fatty acids
    with 16 atoms such as palmitate have to draw the molecular formula of palmitate,
    CH3(CH2)14CO-; without too much hard work, first select the icon with C on it
    then


    **Figure 1**: Thanks to the autocomplete feature, chemical compounds can be created
    without any risk of error.


