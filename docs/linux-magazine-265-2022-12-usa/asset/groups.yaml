    # Manjaro 21.3.7-220816

    64位


    # Arch Linux 2022.10.01

    64位


    Manjaro 之于 Arch Linux 恰如 Ubuntu 之于 Debian。也就是说，Manjaro 是一个发行良好的 Linux 发行版的更易用的版本，新用户通常发现该发行版难以安装。就像
    Ubuntu 一样，Manjaro 通过更简单的安装程序克服了其父级发行版的安装难度，并提供了专有驱动程序。此外，Manjaro 为 Gnome、Plasma
    和 Xfce 桌面环境安装了一系列精选的应用和选项。Manjaro 在其仓库中引入了创新软件包，例如 Jade 环境。


    Arch Linux 是一个滚动更新版。来自 Arch 仓库的最新软件包可以在 Unstable 仓库获取，并在被 Manjaro 用户安装后移动到 Testing
    仓库，通常在它们出现在 Unstable 几天后进行移动。在经过通用用性判断后（通常是几周后），软件包会被移动到 Stable 仓库。通过这套类似于 Debian
    的仓库设置，Manjaro 提供了问题更少的滚动更新体验。


    用户被 Arch 吸引，是因为它是满足对 Arch 好奇心的一种简单方式。然而，许多人开始欣赏 Manjaro 的易用性。


    Arch Linux 并不是最广泛使用的发行版，但它作为一种面向简洁的轻量级发行版拥有良好的声誉。换句话说，Arch 对用户及其需求很少做假设，将安装什么以及如何配置每个系统的决定权留给每个用户。由于这种哲学，Arch
    的确有声誉其详尽的文档比其他人认为的那么难以理解。事实上，其他发行版的用户通常可以在 ArchWiki 中找到他们需要的信息。


    Arch Linux 使用滚动更新。它不是通过发布在 Arch 中升级软件包的发行版，而是在准备就绪时发布每个版本。通常，软件包直接来自上游项目，只需极少修改即可适配
    Arch。


    Arch Linux 并不适合所有人，但对于那些想要了解更多关于 Linux 操作系统的人来说，安装 Arch 是学习它的最好方法之一。


