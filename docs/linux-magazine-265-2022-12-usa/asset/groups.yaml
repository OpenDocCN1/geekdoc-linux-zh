    # # Power Saver


    The Raspberry Pi Pico''s high-performance chip is trimmed for I/O and does not
    to save power. However, a few tricks in battery mode can keep it running longer.
    By Bernhard Bablok


    large number of pins, variable voltage input, and good community support are what
    make the Raspberry Pi Pico a powerful single-board computer (SBC) for newcomers
    and professionals alike. It connects to your PC over USB and get started, powered
    up quickly. When you want the Pico to run autonomously, you will need to face
    the question of how long the battery supply will last. Like most microcontrollers,
    the Pico consumes relatively little power, but it has limitations when it comes
    to operating on battery operation, yet it continues to consume power during sleep
    periods. A few tricks will help you reduce the power consumption in these phases
    to extend the battery runtime. When you read “Pico,” “it” also applies to other
    microcontrollers, because they directly support CircuitPython (a software implementation
    of the Python 3 programming language used here and targeted toward beginners),
    or there''s an old adage: If you work, you get to eat. But microcontrollers are
    more like workers in a normal state. A remote sensor or control lies around nearly
    100 percent of the time, then has


    to respond very quickly when a button is pressed. Even a sensor that records the
    current temperature every 10 minutes has an uptime of less than one percent. Therefore,
    it''s a good idea for the Pico to save resources to the extent possible when it''s
    not doing anything.


    # ## Measure Again


    The measurement setup for the program examples here is simple. The power supply
    is routed by a measuring circuit that continuously monitors voltage and the Pico
    regulates its work with built-in LED, which switches on and off for one second
    ever. The source code for the sample programs is available on my GitHub project.
    If you are familiar with microcontroller programming, you will be able to see
    time elapse in several ways (Listing 1). One possibility is an empty loop that
    keeps the loop running for while (26-29), which is the Pico trying to manage virtual
    time. As you will see, powering everything is expensive (Figure 1) and why I will
    be using the Pico as the benchmark when comparing alternatives.


    The basic consumption of the Pico in this active mode is 60mA. The LED pushes
    the consumption up by 5mA for


