    之后，你可以直接用发行版的应用程序管理器启动应用程序。Linux 衍生版上的图形化应用程序管理器帮助你使用卸载程序删除应用程序。你可以在提示符处触发更新，使用
    `sudo flatpak update` 命令一次性更新系统中的所有 Flatpak。


    由于 Flatpak 运行在沙箱中，你可能需要根据需要授予额外的权限以使用系统组件。Flatseal [7] 工具可以帮你，它也作为 Flatpak 集成到系统中。Flatpak
    提供了方便的运行时环境，允许应用程序通过侧边控制访问各种组件（图 7）。


