    # Web browser


    # FOSPICKS LINUX VOICE


    # Ladybird


    To which Ladybird answers: "Sure you can. Don''t listen to armchair defeatists
    who never worked on a browser"


    Ladybird comes from the same developers behind SerenityOS, the x86 operating system
    built from Unix-components, and of course, Ladybird has been developed to be a
    browser. Being cross-platform, it can also be built for Linux, macOS, and even
    Windows. This cross-platform capability is thanks to Qt, but it relies on its
    own linker for web rendering. This would make it much more like Yet Another Bird
    Browser (TAB), which uses a modern JavaScript library stack, including JavaScript
    and other supporting libraries, to implement a minimal browser that already passes
    Acid standard tests. This means you can already browse most websites with minimal
    degradation.


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_84_0.png)


    It''s not often we see an open source web browser. It should be impossible for
    any home-grown browser to compete with Blink and Google Chrome. It would take
    a team of dozens, or hundreds to build, maintain, and ensure it works accurately
    with the web standard. But none of this has stopped the Ladybird project, which
    is a cross-platform browser for those of us who may be prepared to trade comfort
    for some diversity browser. This point is even addressed in the project''s FAQ
    to the "Why not? You can''t make a new browser engine billions of dollars and
    hundreds of staff"


    Ladybird makes many web browser features, but it also includes tabs. Which is
    much far as seen in the early days of Internet Explorer. Outdated. The current
    output is not enough for bookmarks, plugins, extensions, or saving passwords,
    but maybe this will come in the future. Ladybird is still a brilliant achievement
    for a small project, but also a great thing that is entirely out of our control,
    and it is still possible to bootstrap your own browser outside of the Blink or
    even Gecko ecosystem systems.


    # Project Website

    https://github.com/SerenityOS/ladybird


    # Bootable USB


    # Ventoy


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_84_1.png)


    The delicate art of installing a fresh Linux distribution from a USB drives us
    all. As a Linux user, it''s an early rite of passage that quickly differentiates
    you from world of pre-installed PCs and Apple Store Macs. For experts and experienced
    users, it remains the one best of ways to handle any failure or trouble with a
    booted update on Arch. Despite this all, the process of creating and using a bootable
    USB hasn''t changed much when you need to download the Linux distribution image
    and write directly to the USB drive, either from the command line, or using a
    GUI helper such as Raspberry Pi Imager or Gner''s MultiWriter. Despite its acceptance,
    however this isn''t ideal. It''s a little convoluted, both in the way you have
    to write an image block-by-block, and because you lose everything on the USB stick.
    You can only have one on USB stick.


    Ventoy is a huge upgrade to this process. After Ventoy has been installed, you
    can now simply drag and drop ISO or IMG, VHD disk image, or even a Windows file
    (WIM) to the first partition. Ventoy will automatically create a menu from which
    you can boot anything.


    # Project Website

    https://www.ventoy.net/


