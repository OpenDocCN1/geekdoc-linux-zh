    \ {\n        socketTotal = socketTimeClose - socketTimeStart;\n    } else {\n\
    \        System.out.printf(\"%s\\n\", \"\");\n        return -1.0;\n    }\n\n\
    \    return (double) socketTotal;\n}\n```\n\n| InetAddress inet_addr | null |\n\
    | :--- | :--- |\n| int count | 4 |\n| int limit | 4 |\n| int timeout | 4000 |\n\
    | Integer[] | new Integer[80] |\n| String host | \"localhost\" |\n| String host_addr\
    \ | |\n| String hostName | |\n\n# 功能\n如表 2 所示，Zing 工具的实际功能包含在 ZingHost 方法中，它接收主机和端口参数进行操作。内部实现使用了主机复用。方法的返回值是毫秒时间（注意这段代码被用作一个静态函数）。ZingHost()\
    \ 获取主机名，如果主机存在，则没有错误。在连接到主机时获取时间（双精度数）。返回 double 值，如果主机不存在，则返回 -1。ZingHost() 方法被\
    \ main 方法调用，反复连接主机并累积时间信息。\n\n# 主核心功能\nZing 工具的功能是列表 1 所示的 main 方法。main() 的逻辑也很简单：\n\
    1. 获取主机地址并检查主机是否可用。\n2. 用于 zing 的命令行参数和参数。\n3. 重复循环并连接主机，对每个端口进行计时。\n4. 计算平均值、标准差和主机的最大时间值。\n\
    5. 以经典的 ping 样式报告并打印超时时间和指标：\n\n# 列表 3：main()\n```java\n01 inet_addr = getHostAddrName(host);\n\
