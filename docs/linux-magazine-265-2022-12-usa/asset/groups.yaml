    \ 指出，在 cc 列表中，Steve 包含了字符串 \"Link:\"，其显示为 Wang 的名字。Linux 还认为应该使用脚本来自动化列表和标签：‘Link’和‘Cc’信息在我们的自动化工具捕获到补丁时，人们通常不看那部分——实际上，那是相关的，导致补丁的描述（换句话说，即原始报告或补丁的更早版本）。虽然列表中的\
    \ cc 有助于在以后发生事情时使用标签进行查找，但实际上，更多的编辑可能是为了纠错。Linux 说，“要么让邮件工具处理标头并从那里进行剪贴，或者使用其中一个显式工具来处理标头（至少有几个）。好吧，我很习惯这样做了。”\n\
    \n几个月后，Theodore 引入了 Linux 的偏好，创建了供开发者在提交时可以遵循的文档。Steve 表示他将重新检查他的脚本并修复此问题。“之后，我将\
    \ Cc 列表标头添加到了引起困扰的提交列表中。我将不再那样做，因为它也会向邮件中添加 Link 标签，其中包含了所有的 Cs。”在在他的补丁中，Theodore\
