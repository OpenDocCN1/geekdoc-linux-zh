    ```\n"
  mdcn: "\n主机系统只会看到几次连接请求、连接和断开。Zing 看起来与其他任何互联网应用程序一样；它不会发送 ICMP 数据包。\n\n`zing -c\
    \ -4 -q -p version 4` (IPv4)，每个端口计数四次，默认端口为 HTTP 协议的 80 和 HTTPS 协议的 443。默认超时时间为\
    \ 4000 毫秒。\n\n### 操作\nZing 用 Java 实现的，并作为一个命令行实用程序应用程序。Java 类源代码约为 400 行代码。Zing\
    \ 仅使用 JDK 库并实现了一些有用的内部方法。方法和属性都是静态的，且 Zing 类是 abstract 类的子类（java.lang.Object 的子类），它是一个只使用\
    \ Java 类中库的自包含程序。Zing 工具具有以下命令行参数：\n\n这些默认命令行接口遵循 IP 协议：\n\n```\nzing [-c] [-q]\
    \ [-opts] [ip] [hostname]\n[-p] [-t] [-n] [-h] hostname\n```\n\n| 名称 | 描述 |\n\
    | :--- | :--- |\n| hostflag | 表示主机是否可用且可达。默认情况下假设主机可用且可达。 |\n| tcpFlag4 | 表示 Zing\
    \ 为主机名使用互联网协议版本 4 (IPv4) 还是 6 (IPv6) 的主机 IP 地址。 |\n| inet_addr | 从域名服务器检索互联网地址。最初必须查询地址以创建互联网地址的实例值。\
    \ |\n| count | 网络查询主机的次数。默认次数为四。 |\n| limit | 执行单个操作（连接到端口）的次数。默认限制为四次操作。较高的限制需要更长时间来处理。\
    \ |\n| timeout | 等待可达的毫秒数。默认超时时间为 4000 毫秒。 |\n| ports | 要处理的主机端口。两个默认端口为 80 和\
    \ 443，用于 HTTPS - 两个端口都被主机使用。 |\n| hostAddr | 表示主机 IP 的字符串。初始为空的空白字符串。 |\n| hostName\
    \ | 同时作为 IP 地址和主机名传递并解析。初始时 hostName 初始化为空字符串。 |\n\n每个 Zing 工具参数：\n\n- -c: TCP\
    \ IP 地址 (IPv4)\n- -d: TCP IP 地址 (IPv6)\n- -q: 查询次数\n- -op: 每次计数的操作数。\n- -p: Zing\
    \ 工具使用的端口列表。\n- -t: 等待的超时时间\n- -h: 请求帮助，显示 Zing 参数。\n\n主机可以是主机系统的 IP 地址或主机名。Zing\
    \ 工具命令行接口参数的默认值为：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| usage() | 显示命令行接口参数的用法和示例\
    \ |\n| | 运行 Zing 实用程序时调的方法 |\n| processArgs(String[]) | 用于处理命令行参数并配置属性 |\n| report()\
    \ | 返回状态 |\n| stddev() | 计算标准差 [6]，作为设计用于计算机系统报告的一部分 |\n| getHostAddr(Name) |\
    \ 返回主机名 |\n| getIPv4Address() | 返回 IPv4 地址 |\n| getIPv6Address() | 返回 IPv6 地址\
    \ |\n| getTime() | 返回一个双精度浮点数，表示查询网络上的主机系统所花费的时间 |\n| doZingToHost() | 包含 Zing\
    \ 工具功能的核心方法 |\n\n列出：Zing 方法\n\n- 01 doZingHost(String host, final int port)\n\
    - 02 InAddress getHostAddr(String host)\n- 03 InAddress getIPv4Address(String\
    \ hostName)\n- 04 InAddress getIPv6Address(String hostName)\n- 05 Double count\n\
    - 06 getTime(final double doubleTime)\n- 07 main(String[] args)\n- 08 void processArgs(String[]\
    \ args)\n- 09 void report(double time)\n- 10 void stddev(double average, double[]\
    \ values)\n- 11 void usage()\n\n# 深度解析\n\n你想要加入的主机是一个必要的参数，没有默认值。\n\n# 设计\nZing\
    \ 网络工具是一个单 Java 类，具有静态方法和属性。\n12 个静态属性由 Zing 定义并初始化为默认值。\n10 个静态属性是 Java 代码段（描述见表\
    \ 1）：\n\nZing 网络工具还有 10 个用于实用程序操作的特定方法。这 10 个方法是：\n\n# 列表 2：ZingHost\n```java\n\
    public static double doZingHost(String host, int final port) {\n\n    if (inet_addr\
