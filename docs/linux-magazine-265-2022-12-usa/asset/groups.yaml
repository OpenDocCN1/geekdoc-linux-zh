    Heimer，你可以通过点击鼠标快速用纸笔绘图。当你添加一个新项时，Heimer 会一键重排所有元素。你可以将完成的思维导图导出为 PNG 或 SVG 格式。


    无论你如何安装，都可以通过开始菜单或活动界面找到 Heimer。如果你在发行版的软件管理器中找不到它，且你没有使用 Ubuntu（或其衍生版），最好的选择是下载备用包。如果你的发行版支持这种格式，你需要将失败的文件标记为可执行并运行它（列表第
    1 行）。


    如果不起作用，你将从源代码构建（列表 1，从第 6 行开始）。然而，构建需要 Cmake 和一些库。在基于 Debian 和 Ubuntu 的发行版上，第
    7 行下载的内容包含了所有所需组件。然后运行从第 9 行开始的命令编译并安装 Heimer。


    ## 安装


