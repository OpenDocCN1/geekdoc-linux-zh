    ## USB Boot

    Live boot was an exciting idea 15 years ago – just carry a CD with you and boot
    from anywhere. But old-style CDs had many limitations. Your USB boot tools solve
    those problems other than a feature that no one ever thought back then: access
    to several boot images on a single stick.


    On the DVD: Linux Mint 20.3 and FreeBSD 13.


