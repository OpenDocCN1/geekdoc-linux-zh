    \ zero-packet network utility\n\n# Zing\n\nZing is a lightweight, zero-packet\
    \ network utility similar to that provides functionality without the payload.\
    \ By William F. Gilreath\n\nThe networking utility (backronym Packet Internet\
    \ Group) [1, 2, 3] is a common tool used to determine latency and whether a host\
    \ is alive at an IP address. Ping sends an Internet Control Message Packet (ICMP)\
    \ to a host as an echo request, which receives a response from the host. Ping\
    \ sends data about the time the host sends back - to put it at simplest, plain\
    \ explanation.\n\nPing is popular all around the world, however it is not for\
    \ all problems. It can be used to overwhelm and crash a system - a denial-of-service\
    \ (DoS) attack called a ping flood. Some simply do not respond to pings, and Zing\
    \ fireblocks ICMP for security.\n\nA problem I faced was needing ping functionality,\
    \ but without sending packets of data through the network. One of the best things\
