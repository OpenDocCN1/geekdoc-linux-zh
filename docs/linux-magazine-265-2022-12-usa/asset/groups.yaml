    # TUXEDO Computers Releases TUXEDO OS


    TUXEDO Computers is well known for Linux-powered laptops that ship with their
    Ubuntu-based, in-house operating system, as TUXEDO OS. However, ever the company
    makes that operating system available to the general public, it can be downloaded
    (https://os.tuxedocomputers.com/) and installed on about any computer.


    AlthoughEDO OS was specifically designed for TUXEDO hardware, it works on general
    hardware and as a virtual machine. The OS uses a customized version of KDE Plasma
    and offers for running in live mode, dual booting, or a stand installation.


    The installation of TUXEDO OS is fairly straightforward, however when you install
    on non-TUXEDO hardware, you will get a warning that states software like Tomte
    or the TUXEDO Control Center will not work.


    The current version of TUXEDO OS is based on Ubuntu 22.04 and KDE Plasma 5.25,
    which defaults to Pipewire as its sound server, and has a custom GRUB bootloader.
    You''ll find applications such as Firefox, LibreOffice, Thunderbird, and the standard
    KDE applications.


    One thing to keep in mind, however, is that TUXEDO OS does with Flatpak, rather
    than Snap, by default.


    Find out more TUXEDO OS from the official TUXEDO Computer website (https://www.tuxedocomputers.com/en/TUXEDO-OS_tuxedo).


    # Native GPU Driver for Apple Silicon is Nearly


    The Asahi Linux Project (https://asah.org) has taken a giant leap toward getting
    full-blown Linux running on Apple Silicon M1/M2 chips.


    Although not for mainstream usage, thanks to a developer who goes Asahi Linux
    (https://github.com/AsahiLinux) is getting very close to releasing a Rust-based
    GPU driver for Linux.


    Asahi only joined the project a couple months ago and immediately began working
    on a prototype driver that would allow GUI apps on Linux.


    According to the Asahi news back in July 2022, Asahi joined our team and took
    on the challenge of reverse engineering the M1 GPU hardware and writing a driver
    for it. "In a short time, she has already built a prototype driver good enough
    to run graphics applications and benchmarks, building on top of the Mesa work."


    A few months later, Asahi Linux is able to successfully run both Gnome and KDE
    apps as well as YouTube on Firefox. For those who want to see this in action,
    check Asahi''s tweet (https://twitter.com/AsahiLinux/status/1573526767829561968)
    which includes a stream that shows off her work.


    One caveat to Linux''s work is that it has, so far, only tested on the M1 chips.


    Because this driver is running, there is one thing we don''t see-lease until the
    6.1 kernel is available.'
