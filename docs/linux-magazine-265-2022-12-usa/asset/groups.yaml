    Manjaro is to Arch Linux what Ubuntu is to Debian. That is, Manjaro is a more
    user-friendly version of a well distributed that new users find difficult to install.
    Like Ubuntu, Manjaro overcomes the difficulty of installing its parent distribution
    with an easier installer, as well as proprietary drivers. In addition, Manjaro
    installs a curated set of applications and choices for Gnome, Plasma, and Xfce
    desktop environments. Manjaro introduces innovative packages in its repositories,
    such as the Jade environment.


    Arch Linux is a rolling release. Packages fresh from Arch repositories are available
    from the Unstable repository and move to Testing after being installed by Manjaro
    users, usually a few days after they appear in Unstable. When judged for general
    use (usually a few weeks later), packages are moved into Stable. With this Debian-like
    set of repositories, Manjaro provides rolling release with less chance of problems.


    Users are attracted to Arch as an easy way to satisfy their curiosity about Arch.
    However, many learn to appreciate Manjaro for its ease.


    Arch Linux is not the most widely used distribution, it has a solid reputation
    as a lightweight distribution that is geared towards simplicity. In other words,
    Arch makes few assumptions about users and what they want, leaving decisions about
    what to install and how to configure each user. As a result of this philosophy,
    Arch accurately has a reputation as one whose extensive documentation less difficult
    than others might appear. In fact, users of other distributions usually find the
    information they need in the ArchWiki.


    Arch Linux uses a rolling release. Rather than issuing releases in which packages
    are upgraded at Arch, Arch releases each when it is ready. Usually, packages come
    directly from the upstream projects with little or modification to make them fit
    into Arch.


    Arch Linux is not for everyone, but for those who want to know more about Linux
    as an operating system, installing Arch is one of the best ways to learn.'
