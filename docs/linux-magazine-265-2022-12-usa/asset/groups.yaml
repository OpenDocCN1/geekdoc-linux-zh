    # # IN-DEPTH Snapshot – Go Photo Organizer


    # ## Organizing photos by date with Go


    # # Keeping

    Things

    Tidy


    In this issue, Mike Conjures a Go program to copy photos from a phone or SD card
    into a date-based file structure on a Linux box. To avoid wasting time, a cache
    using UUIDs ensures that no new photos are transferred. By Mike Chilli


    +   - regularly import photos from my phone or the SD card of any new mirrorless
    camera (a Sony) to a computer in order to achieve the best shots. On the computer,
    a homegrown program sorts them into a folder structure for each month, year, and
    day. After importing, images usually remain on the phone or SD card too. I don''t
    want to recover previously imported photos the next time it is called, but instead
    pick up where it left off last time.

    - If one or more SD cards are used, it is important to keep track of them because
    they sometimes create conflicting files.

    - The photos on the SD card have a name format of DCIM<number>.JPG. On the day,
    they have a different


    Author

    Mike Chilli works as a software engineer in the San Francisco Bay Area, California.
    Each month, in his column, which has been running since 1999, he researches practices
    of various programming languages. If you email him milli@permeister.com he will
    gladly answer any questions.


    name, say, IMG<number>.JPG. Cameras also increment the consecutive numbering of
    new photos for each shot. This needs is described in the Design rule for Camera
    DCF File system (DCF) [1] specification. The DCF specification defines the format
    of the file names and specifies what happens if a counter overflows or the camera
    detects that the users used other SD cards with separate counters.


    1 shows the typical, DCF-compliant file layout on the card. On a freshly created
    card, the camera saves the first images as DCIM0001.JPG, DCIM0002.JPG, and so
    on in the DCIM subdirectory; however, it''s unlikely to store more than 999 photos
    on a card, but if a crazy photographer would create a new folder named DC101MSCF
    and, after the next shot, simply start again at DCIM0001.JPG.


    ```

    $ tree DCIM/

    100MSDC/

    DCIM0001.JPG

    DCIM0002.JPG

    DCIM0003.JPG

    DCIM0004.JPG

    101MSDC/

    DCIM0001.JPG

    DCIM0002.JPG

    DCIM0003.JPG

    DCIM0004.JPG

    ```


    ```

    $ tree DCIM/

    100MSDC/

    DCIM00950.JPG

    DCIM00951.JPG

    DCIM00952.JPG

    DCIM99999.JPG

    101MSCF/

    DCIM00953.JPG

    DCIM00954.JPG

    ```


