    # IN-DEPTH


    Atuin


    # Tracking command history across multiple computers


    # # Magic Shell


    Atuin adds some queries to the shell history, while synchronizing your command
    history across the network. By Ferdinand Thommes


    > "What was that long command I entered on my notebook list that showed me all
    the installed packages? If questions like these sound too familiar, read. Unix
    shells such as Bash, Fish, or Zah have always basic functions for retrieving the
    last command line. The arrow key can be used to browse the command history, with
    keystroke scrolling back one entry.

    For commands that were executed a while ago, the Bash history offers more information
    and convenience. The history function first appeared in Unix in 1978 in the C
    shell and spread from there to many modern shells—including Mush, e. A detailed
    manual [1] for the history function can be found on the DigitalOcean website (Figure
    1).

    Atuin takes this work function to the next level. It replaces the shell history
    with a SQLite database, which provides more search options, and records additional
    context about all the commands used in Atuin."


    Atuin also synchronizes the recorded history to other devices on the network using
    end-to-end encryption via an external server. This feature allows devices, Fish,
    and Zah shells with multiple computers on their network to not only use the shell
    history of a single session or computer, but also to retrieve the entire history
    of all synchronized devices. Atuin currently supports the Bash, Fish, and Zah
    shells. Atuin is named after Alan, the turtle


