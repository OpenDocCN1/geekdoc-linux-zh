    \ and a hostname. Initially, the hostName is initialized to an empty string. |\n\
    \nEach Zing utility parameter:\n\n- -c: TCP IP address (IPv4)\n- -d: TCP IP address\
    \ (IPv6)\n- -q: the count of queries\n- -op: the number of ops per count.\n- -p:\
    \ a list of ports to be used by the Zing utility.\n- -t: the timeout for wait\n\
    - -h: a request for help, showing the Zing parameters.\n\nThe host can be the\
    \ host system IP address or the host name. The default values for the command\
    \ line interface parameters for the Zing utility are:\n\n| Method | Description\
    \ |\n| :--- | :--- |\n| usage() | displays the usage and an example of command\
    \ line interface parameters |\n| | a method called when the Zing utility is run\
    \ |\n| processArgs(String[]) | used to process the command line parameters and\
    \ configure the attributes |\n| report() | returns the status |\n| stddev() |\
    \ computes standard deviation [6] as part of the report a computer system is designed\
    \ |\n| getHostAddr(Name) | returns the host name |\n| getIPv4Address() | returns\
    \ the IPv4 address |\n| getIPv6Address() | returns the IPv6 address |\n| getTime()\
    \ | returns a double, real number for the time taken to query a host system on\
    \ a network |\n| doZingToHost() | the core method containing the functionality\
    \ for the Zing utility |\n\nListing: Zing Methods\n\n- 01 doZingHost(String host,\
    \ final int port)\n- 02 InAddress getHostAddr(String host)\n- 03 InAddress getIPv4Address(String\
    \ hostName)\n- 04 InAddress getIPv6Address(String hostName)\n- 05 Double count\n\
    - 06 getTime(final double doubleTime)\n- 07 main(String[] args)\n- 08 void processArgs(String[]\
    \ args)\n- 09 void report(double time)\n- 10 void stddev(double average, double[]\
    \ values)\n- 11 void usage()\n\n# IN-DEPTH\n\nThe host you wish to join is a required\
    \ parameter with no default.\n\n# Design\nThe Zing network utility is a single\
    \ Java class with static methods and attributes.\nThe 12 static attributes are\
    \ defined by Zing and are initialized to the default values.\nThe 10 static attributes\
    \ are Java code fragments (see Table 1 for descriptions):\n\nThe Zing network\
    \ utility also has 10 specific methods for the operation of the utility. The 10\
    \ methods are\n\n# Listing 2: ZingHost\n```java\npublic static double doZingHost(String\
    \ host, int final port) {\n\n    if (inet_addr == null) {\n        inet_addr =\
    \ getHostaddrName(host);\n    }\n\n    try {\n        if (inet_addr.isReachable(timeout))\
    \ { //host at socket is reachable\n            System.out.printf(\"Error: Host\
    \ is unreachable.%s\\n\", host);\n            host_addr.getHostAddress();\n  \
    \      }\n    } catch (Exception ignore) {\n        System.out.printf(\"Error:\
    \ Host contact timeout.%s\\n\", host);\n        host_addr.getHostAddress();\n\
    \    }\n\n    System.exit(1);\n\n    boolean present = true; //if default is present,\
    \ default is true\n    long socketTimeStart = 0, socketTimeClose = 0, socketTotal\
    \ = 0;\n\n    try {\n        Socket socket = new Socket(host, port);\n       \
    \ socket.setTimeout(timeout);\n        socketTimeStart = System.currentTimeMillis();\n\
    \        socket.close();\n    } catch (TimeoutException ignore) {\n        System.out.printf(\"\
    Timed out after %d waiting for host.%s\\n\", timeout, host);\n        present\
    \ = false;\n    } catch (Exception ignore) {\n        present = false;\n    }\n\
    \n    if (present) {\n        socketTotal = socketTotal + (socketTimeClose - socketTimeStart);\n\
    \    } else {\n        System.out.printf(\"%s\\n\", \"\");\n        return -1.0;\n\
    \    }\n\n    return (double) socketTotal;\n}\n```\n\n| InetAddress inet_addr\
    \ | null |\n| :--- | :--- |\n| int count | 4 |\n| int limit | 4 |\n| int timeout\
    \ | 4000 |\n| Integer[] | new Integer[80] |\n| String host | \"localhost\" |\n\
    | String host_addr | |\n| String hostName | |\n\n# Zing Functionality\nAs Table\
    \ 2, the actual functionality of Zing utility is contained within method ZingHost(),\
    \ which takes the host parameter and port parameter to operate. The internal implementation\
    \ uses host port multiplexing. The return of method ZingHost() is the time in\
    \ milliseconds as a return value (Note that this code is used as a static function).\
    \ ZingHost() gets the host name, and if the host is present, then there's no error.\
    \ Zing host by connecting and disconnecting to the host while getting the starting\
    \ time to connect. If the host is present, compute the time in a real number (double).\
    \ Return the double value, and if the host is not present, -1 as a sentinel value.\
    \ The method ZingHost() is called by main() method which then repeatedly zing\
    \ the host and accumulate time information.\n\n# Main Core Functionality\nThe\
    \ main functionality of Zing utility is simple of the main() method shown in Listing\
    \ 1. The main() logic is also fairly simple:\n1. Get the host address, and check\
    \ if the host is available and present.\n2. Command line arguments and parameters\
    \ used to zing.\n3. Repeatedly loop and zing the host, counting and timing the\
    \ times for each port to the limit of Zing operation.\n4. Calculate the average,\
    \ the standard deviation, and the maximum time value to zing host system.\n5.\
    \ Report and print timeout times and metrics in the classic ping style:\n\n# Listing\
    \ 3: main()\n```java\n01 inet_addr = getHostAddrName(host);\n02 System.out.printf(\"\
    ZING: %s:%d ports used, %d ops per cycle\\n\",\n04 hostName, hostaddr, ports.length,\
    \ limit);\n06 long timeStart = System.currentTimeMillis();\n07 for (int x = 0;\
    \ x < count; x++) {\n10 System.out.printf(\"%d\\n\", x + 1);\n11 double totalTime\
    \ = 0;\n12 System.out.printf(\"%f\\n\");\n14 for (int y = 0; y < limit; y++) {\n\
    15 for (int port : ports) {\n16 totalTime += doTimingHost(host, port);\n17 } //\
    \ end for(port)\n19 } // end for(limit)\n20 System.out.printf(\"%d\\n\", count);\n\
    21 double time = getTotalTime(totalTime, ports.length);\n22 System.out.printf(\"\
    %f\\n\");\n23 report(); // time = -1.0, else active\n24 } // end(count)\n26 long\
    \ timeEnd = System.currentTimeMillis();\n28 double min, max;\n29 double min =\
    \ Double.MAX_VALUE, max = Double.MIN_VALUE;\navg = 0.0;\n30 for (int x = 0; x\
    \ < count; x++) {\n31 if (min > timeTable[x]) {\n32 min = timeTable[x];\n33 }\
    \ // end\n34 if (max < timeTable[x]) {\n35 max = timeTable[x];\n36 } // end\n\
    37 avg += timeTable[x];\n38 } // end\n40 avg = avg / (double) count;\n42 double\
    \ std_dev = stdev(avg, timeTable);\n44 System.out.printf(\"--- summary for %s\
    \ --%s --\\n\",\nhostName, hostaddr);\n45 System.out.printf(\"%d ops used; time:\
    \ %d ms\\n\",\ncount, (long)(timeEnd - timeStart));\n46 (ports.length * count);\n\
    47 System.out.printf(\"---total-min/avg/std_dev = %.3f/%.3f/%.3f\\n\\n\",\ntimeClock,\
    \ min, avg, std_dev);\n50 System.out.printf(\"--- end ZING --\\n\");\n```\n\n\
    There is a check for unrecognized or invalid parameters, and if the -h parameter\
    \ is passed to help the user the main() method, the usage() method prints the\
    \ command line parameters. An example of using command line with the Zing network\
    \ utility is:\n```\njava -h\n\nUsage: zing [-c] [-q] [-opts] [ip] [hostname]\n\
    [-p] [-t] [-n] [-h] hostname\n```\nAfter reporting the usage for the Zing utility,\
    \ the app then defaults all other command line parameters and operation.\n\n#\
    \ Order of Operation\nThe order of operation for the Zing utility begins with\
    \ processing the command line parameters.\n\n# Listing 4: At query\n```\njava\
    \ -cp xyz.wgifith.net -c 4 -p 80 -443 -t 500 google.com\nZING: google.com (142.251.23.78):\
