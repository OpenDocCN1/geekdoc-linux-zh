    # Puppy Linux


    # Running with the Pack


    Not just one operating system, Puppy Linux is a diverse collection of lightweight
    operating systems designed for efficiency.


    By Bruce Byfield


    it distributions are different, Puppy Linux [1] is more than most. In fact, some
    who develop or use Puppy Linux from past experience that media coverage of the
    distribution will miserably represent it. The truth is, Puppy Linux is not a single
    operating system, not even with multiple editions, flavors, or spins. Instead,
    Puppy Linux is a collection of lightweight operating


    systems built on common code with some common applications and a few points of
    common philosophy (Figure 1) - rather as Debian, Ubuntu, and Linux Mint were part
    of the same project. Little of this definition of Puppy Linux is spelled out.
    As a result, most reviews of Puppy Linux concentrate on the most popular Puppy
    operating systems, which makes most reviews misleading.


    Puppy Linux was founded by Barry Kauler in June 2003. Kauler''s efforts were a
    response to the increasing hardware requirements of other distributions. From
    early on, the Puppy Linux Forum was central to the distribution, and it remains
    to this day. However, Puppy only began to assume its current form in its third
    release. The third release included both a remastering app that allowed users
    to select what


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_29_1.png)


