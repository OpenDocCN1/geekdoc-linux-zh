    # # Command Line – McFly


    (OLD_DIR_PARTH) and with one new (NEW_DIR_PARTH) in that order. The sub-commands
    init and train are also available for developers, and appear to be undocumented.
    However, the other sub-commands allow users to use McFly in improving its results.


    # ## Is McFly Worth Using?


    At least initially, algorithms that we been trained may fail. All I can say with
    confidence that weeks of semi-regular use did not noticeably improve McFly''s
    results. However, inconsistent trials


    are inconclusive. It seems likely that heavier or a longer trial period would
    produce clearer results. Documentation on how to use the train sub-command would
    be useful as well.


    However, even without a learning algorithm, McFly has benefited over history.
    Not only is McFly customizable, but through its environment variables and sub-commands,
    its interface makes it much easier to use history. Even with the strict limit
    McFly''s design makes it one of the best breed of Linux commands that are replacing
    many of the venerable ones.


    # ### Table 1: McFly Options


    | Export | Description |

    | --- | --- |

    | export MCFLY_LIGHT=TRUE | Sets McFly in light mode rather than the default dark
    mode. |

    | export MCFLY_KEY_SCHEME=vim | Sets McFly to Vim commands rather than the default
    Emacs. |

    | export MCFLY_FUZZ=true | Displays related terms, not just matches. This could
    increase the chance of finding results, but at the cost of more results to scroll.
    |

    | export MCFLY_INTERFACE_VIEW=BOTTOM | Places tmenu at the bottom of the screen.
    |

    | export MCFLY_DISABLE_MENU=TRUE | The titlebar is not displayed. |

    | export MCFLY_HISTORY_LIMIT=50 | Limits the number of results displayed. By default,
    only the top dozen results show in McFly''s history. |

    | export MCFLY_RESULTS_SORT=RUN or MCFLY_RESULTS_SORT=RANK | Displays results
    according to the time run or by the rank assigned by McFly. |


    # ### Table 2: Navigating McFly Commands


    | Key | Description |

    | --- | --- |

    | Enter | Run the command highlighted by the arrow key. |

    | Tab | Edit a command before running it. |

    | F1 | Sort by time, rather than. This is the default, so it has no effect unless
    MCFLY_RESULTS_SORT=RANK is set (see Table 1). |

    | F2 | Delete the selected command from McFly''s history. Useful for improving
    results. |

    | Esc | Closes page and returns to the command prompt. |


