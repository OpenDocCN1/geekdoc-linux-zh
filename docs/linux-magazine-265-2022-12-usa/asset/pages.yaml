    # # Linux Kernel 6.0 Officially Released


    # MORE ONLINE


    Over the Linux Kernel Mail List (https://lkml.org/kernel/2022/10/25/), Linus Torvalds
    announced the availability of the latest kernel by name. So, as is hopefully clear
    to everyone, the major version change is more about running out of fingers and
    toes than it is any fundamental changes.


    That doesn''t mean, however, there aren''t any changes and new editions to be
    in the 6.0 release. In fact, with regard to the number of commits, the 6.0 kernel
    is one of the biggest releases in history.


    The additions to Linux include a new graphics driver for the AMD RDNA 3 GPU, a
    new driver for AMD''s ''jacite'' systems, support for PCI buses on OpenLinux and
    LoArch systems, improved cache block mechanism for RISC-V, new support for the
    Lenovo ThinkPad X13 laptop, fixes for TUEDO and Clevo laptop touchdowns, and changed
    threadscheduling for Intel Raptor Lake.


    The 6.0 release also includes fixes for AMD''s x86 hardware-based authentication,
    improved Meltdown mitigation KPTI for ARM64, major changes to the scheduler (including
    मुद्दा PROM for AMD Zen), improved memory and ACPI for ARM 64-bit, initial support
    for Intel Venice, and more.


    For those who are up to the task of running the kernel, you can download it as
    source code and compile it yourself. Best maybe, is to wait until your distribution
    makes the 6.0 kernel officially available.


