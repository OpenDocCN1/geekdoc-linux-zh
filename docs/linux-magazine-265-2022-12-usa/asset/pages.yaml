    Command Line – McFly


    Replacing history with McFly


    # Back to the Future


    McFly improves on the venerable history command with a customizable interface
    and contextualized results. By Bryce Byfield


    +   * the history command brings previously used commands to use again. So could
    we be a more appropriate name for a history replacement than the last of Michael
    J. Fox''s character in Back to the Future? McFly [1] replaces history with contextualized
    results that are generated with an AI-algorithm and a SQL database. Although no
    query was made with history commands, McFly offers numerous advantages:

    * Results are displayed full-screen, with basic commands summarized in the tilebar
    (Figure 1).

    * Information is given about when a result was run and in which directory, if
    it was not in your home directory, as well as if it failed. Failed results are
    not displayed.

    * Priority is given to the present working directory.

    * Results take into account other commands that in the past were run after the
    command.


    | Esc | Exit | - | Run | Tab | Edit | F1 - Switch Sort to Time | F2 - Delete |

    |---|---|---|---|---|---|---|---|---|

    | $ brew update | | | | | | | | |

    | brew born | | | | | | | | |

    | brew hello | | | | | | | | |

    | cd /home | | | | | | | | |

    | brew install tree | | | | | | | | |

    | brew doctor | |


    **Figure 1**: Unlike history, McFly uses a result, with a summary of navigation
    keys in the tilebar.


