  md: '# Listing 1: Empty Test Loop


    ```

    01 import time | 20 time.sleep(LED_TIME)

    02 import board | 21 led.value = 0

    03 import alarm | 22 23 # Main loop

    04 from digitalio DigitalInOut, Direction, Pull | 24 while True:

    05 | 25 work():

    06 LED_TIME = 1 | 26 if MODE == SPIN:

    07 INT_TIME = 30 - LED_TIME | 27 next = time.monotonic() + INT_TIME

    08 SPIN = 0x1 | 28 while time.monotonic() < next:

    09 SLEEP = 0x2 | 29 continue

    10 LIGHT_SLEEP = 0xA | 30 elif MODE == SLEEP:

    11 DEEP_SLEEP = 0xC | 31 time.sleep(INT_TIME)

    12 MODE = SPIN | 32 elif MODE == LIGHT_SLEEP:

    14 led = DigitalInOut(board.LED) | 33 time_alarm = alarm.TimeAlarm(monotonic_time=time.monotonic()+INT_TIME)

    15 alarm.alarm(...) | 34 alarm.light_sleep_until_alarms(time_alarm)

    16 | 35 elif MODE == DEEP_SLEEP:

    17 # Simulate work | 36 time_alarm = alarm.TimeAlarm(

    18 def work(): | 37 monotonic_time=time.monotonic() + 40)

    19 led.value = 1 | 38 alarm.exit_and_deep_sleep_until_alarms(time_alarm)

