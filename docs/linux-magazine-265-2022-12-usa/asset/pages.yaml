  md: '# BETTA GET METTA, METTA


    Dear Reader,


    When Facebook renamed Meta in honor of its new vision of a reality metaverse,
    I knew they were taking their initiative seriously. I admit, though, it was a
    difficult to figure out what they were talking about. The visions describe a virtual-reality,
    totally immersive, unified internet experience—which seems quite bold and revolutionary,
    but still a little. You can look for clues in science fiction, as Neal Stephenson''s
    1999 *Snow Crash*, which is created with the metaverse in mind. But reality to
    interact with people are far away bears for comes.


    Meta''s Horizon platform was in news this past month, and the news was it wasn''t
    good. Users complained of bugs and a general feeling that there were not people
    to interact with in virtual spaces. Many have said they feel lonely in this virtual
    world, so far do not have enough, and float around on turns. (Meta later announced
    that it was working on a legacy.)


    The idea behind Horizon Worlds is to surpass Life and other platforms, with full
    immersion in virtual reality. Users are encouraged to create things-‘worlds’ that
    others can view. However, according to a study in the *Wall Street Journal*, only
    9 percent of the worlds are visited by more than 50 people, and more than once.


    The original goal was to have more than 500,000 users by this month, but the actual
    number was less than 200,000, and according to reports, most users didn''t return
    to the platform after the first month. Meta Reality Labs, the division, spent
    $10 billion last year and $5.5 billion again this.


    Perhaps most embarrassing was the leak of internal documents revealing a deal
    of skepticism between Meta and the state of the Horizon Worlds [2], with complaints
    of bugs and an underwhelming user experience. ‘An empty world is a useless world,’
    said one Meta employee.


    It is easy for us to put in place when an internal memo says that the public lines
    differ from what the employees are actually saying to each other. Or maybe, I
    respect Meta still want to call them Facebook for supporting this level of internal
    debate over high-stakes corporate initiatives—a lot of companies wouldn''t allow
    it.


    Info


    +   (1) “Company Documents Show Meta’s Metaverse Flagging Short.’ *Wall Street
    Journal*, October 15, 2022: https://www.wsj.com/articles/metaverse-horizon-worlds-facebook-internal-documents-11665798617-mod-hp-lead_pos3[paywalled]


    +   (2) Meta Employees Kind of Hate the Metaverse: https://www.thestreet.com/investing/meta-employees-kind-of-hate-metaverse


    Still, the futuristic trappings, I wonder how much of this story really about
    the ‘what we do not now’—problem companies often forget all of the goals that
    originally defined them. To accomplish all of the goals they, the urge is to build
    something new, and to do that, to create guests until they grow up and then get
    out of it. If you look like a guest, you are wrong, totally to be fearless against
    the glitch, even though the world is a bit of coin from the very beginning.


    In one sense, seems perfectly logical to predict that internet would eventually
    merge in some way—and maybe they still will. And it also seems that, in the end,
    humans might have their virtual reality in small domains and ‘total immersion’
    doesn''t really absorb—or diminish enough to support the productions of a reality
    ideal. I admit for more than I have, maybe I''m not the best evaluator, but for
    staying for extended periods in a virtual reality headset seems like a little
    doing thing, which might appeal for an occasional recreational moment, but as
    a way of life?


    Another thing I''m wondering is whether the Zoom chat has suffered during the
    COVID-19 pandemic the way we think about human interactions. Zoom meetings, reunions,
    and even Zoom hours are now commonplace, and you are only looking at stationary-dimensional
    participants of the participants, without faces in time, with real experiences,
    instead of cartoon animation.


    Meta says it isn''t, because the plan for Horizon Worlds goes around 2000, which
    is, but it is also a lot like what Microsoft said about their mobile phone business.
    Meta is extent to tell their employees and stockholders that the success of Horizon
    Worlds depends on how they build it, and that is certainly true, but it will also
    depend on some assumptions about the nature of humans—in contexts that we can''t
    test for, and that part will be interesting to watch. Butter with your headset.


