  md: '# LINUX NEWSSTAND


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with advanced technical articles and tutorials you won''t find anywhere else.
    Explore our full catalog of back issues for specific topics or to complete your
    collection.


    Order online: https://bit.ly/Linux-Newsstand


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_94_0.png)


    # #264/November 2022


    # Artificial Intelligence


    Machine learning remains shrouded in mystery even though it is an integral part
    of every workday. This month we look behind the curtain at some popular techniques
    for supervised and unsupervised learning.


    **On the DVD:** Debian 11.5 and Rocky Linux 9.0


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_94_1.png)


    # #263/October 2022


    # Build an loT


    The most amazing thing about Linux is its flexibility, Linux systems run on the
    biggest computers in the world – and on many of the diminutive devices that populate
    your home environment. If you''ve always wondered how developers adapt Linux to
    run on your tiny tech, you''ll appreciate this month''s stories on Buildroot and
    the Yocto project.


    **On the DVD:** Linux Archive issues 1-262


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_94_2.png)


    # #262/September 2022


    # Beyond 5G


    Behind the scenes, the cellular phone network has always been the preserve of
    highly specialized and proprietary equipment, but some recent innovations could
    be changing that. This month we explore the Open RAN specification, which could
    allow one day of the mobile network to operate on off-shelf hardware.


    **On the DVD:** openSE Leap 15.4 and MX Linux 21.1


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_94_3.png)


    # #261/August 2022


    # USB Boot


    Live boot was an exciting idea 15 years ago – just carry a CD with you and boot
    from anywhere. But old-style CDs had many limitations. Your USB boot tools solve
    those problems other than a feature that no one ever thought back then: access
    to several boot images on a single stick.


    **On the DVD:** Linux Mint 20.3 and FreeBSD 13


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_94_4.png)


    # #260/July 2022


    # Privacy


    If you are really about privacy, you''ll need to learn on more than your browser''s
    tracking block. Those who need anonymity the most depend on the Tor network –
    a global project offering safe surfing even in surveillance states. We also look
    at Postmaster, an application firewall with some useful privacy features.


    **On the DVD:** Ubuntu 22.04 and Fedora Workstation 36


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_94_5.png)


    # #259/June 2022


    # Zero Trust


    Twenty years ago, everyone thought that gateway firewall was all you needed to
    stay safe from intruders, but recent history has told a different story. Today,
    the best deice is: Your own internal network could be as dangerous as the Internet.


    **On the DVD:** Zorin OS 16.1 and Super GRUB2 Disk'
