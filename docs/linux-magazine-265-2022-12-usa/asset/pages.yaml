    a short time. By itself, the basic requirement for system is very low as a Pico
    Zero represents the lower limit of what headless operation can do without deep
    sleep into your bo of tasks.


    Converting expectations into the expected life proves to be relatively easy. Popular
    lithium (LiPo) batteries have a self-discharge rate of 10 percent within the first
    24 hours, then five percent per month, which already includes the current drawn
    by the preset circuit.


    Given these assumptions, the Pico will run for 46 hours on a 1500mAh battery,
    whereas the Pico Zero lasts 15 hours comfortably. With the use of a Raspberry
    Pi combination with rechargeable batteries makes sense in scenarios where service
    lives are not important (e.g., robotic cars).


    With the use of Python, you can send the Pico to sleep for X seconds by calling
    `time.sleep()` (Listing 1, lines 30 and 31). However, the technical


    implementation of time.sleep() on the Pico uses the SDK''s `_sleep()`. In other
    words, the function has no effect on power consumption; it just makes the Python
    code a bit easier to understand. The power consumption graph looks exactly like.
    For microcontrollers, the other hand, the implementation can offer good savings
    with the light sleep.


    Both sleep modes require to wake up. In light sleep, the program continues normally
    at the point where it started, but waking up in deep sleep, the Pico restarts
    after the specified time, current context is lost. The Pico''s internal real clock
    (RTC) only retains its value during light sleep.


    From the programming viewpoint, two variants are not complex, you provided the
    alarm module. The timers created in lines 33-36 use the `alarm.light_sleep_until_alarms()`
    (line 34) and `alarm.exit_and_deep_sleep_until_alarms()` (line 37).


