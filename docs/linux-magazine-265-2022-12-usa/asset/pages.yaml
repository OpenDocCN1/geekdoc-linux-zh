    # Installing and Configuring McFly


    McFly runs on Bash and Zsh shells, with support for the shell development. McFly
    can be installed using Homebrew [2] or an installation script. To use the installation
    as shown in Figure 3, run the following command:


    ```

    curl -fsSL https://raw.githubusercontent.com/cantino/mcfly/master/install.sh |
    sh - --git- mcfly

    ```


    At this point, McFly is ready to run, but you may want to configure it using --config
    with the various options shown in Table 1.


    # Running McFly


    McFly''s basic syntax for searching is:


    ```

    mcfly search history

    ```


    Then add the following line to your-


    ```

    eval "$(mcfly init bash)"

    ```


    or to ~/.zrc


    ```

    eval "$(mcfly init bash)"

    ```


    Finally, to link McFly to the shell, run


    The basic navigation appears in the bar of the pages (see Table 2). You can also
    display McFly''s history and scroll through it with the up and down keys. Using
    the arrow keys is the least effective way to use it, but is the most common way
    to recover history when using the same command several times in a row. This functionality
    makes McFly a complete replacement for history. Many users use the search sub-command.
    However, McFly also supports other commands which are not documented by name,
    only by entries accessed from the --help sub-command. You can also add the sub-command
    to the shell by using --dir (-d) to specify where the history is, --edit (-e)
    to specify an edit code, and --when (-w) to specify when the command was run.
