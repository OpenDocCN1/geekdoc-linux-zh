    Zing


    # Introducing the Zing zero-packet network utility


    # Zing


    Zing is a lightweight, zero-packet network utility similar to that provides functionality
    without the payload. By William F. Gilreath


    The networking utility (back-ronym Packet Internet Group) [1, 2, 3] is a common
    tool used to determine latency and whether a host is alive at an IP address. Ping
    sends an Internet Control Message Packet (ICMP) to a host as an echo request,
    which receives a response from the host. Ping sends data about the time the host
    sends data back - to put it at simplest, plain explanation.


    Ping is popular all around the world, however it is not for all problems. It can
    be used to overwhelm and crash a system - a denial-of-service (DoS) attack called
    a ping flood. Some simply do not respond to pings, and Zing fireblocks ICMP for
    security.


    A problem I faced was needing ping functionality, but without sending packets
    of data through the network. One of the best things about being a developer engineer
    is that, for interesting problems, it takes a little


    creativity to find a solution. Driven by the need, I created my own network utility.


    My requirements for this utility were:


    +   - No data payload is sent or received, to avoid network overhead

    - Ability to check that both host and the ports are alive and readable

    - Able to report the time to reach a host and connect and disconnect

    - Available to run on multiple platforms.


    +   - Support for both IP protocol version 4 and 6 addresses


    +   - Parity similar to ping - a familiar look and feel With these objects in
    mind, I created Zing. Zing is an acronym for zero packet PING. I wanted a name
    that makes sense like ping, but also like the reference to zing a system. My improv
    comic will work for a person in humor.


    # Application


    Zing is implemented as a commandline interface utility and a library function


    in Java. Using Java achieves cross-platform viability. Then, for each platform,
    I created a launch app (or kicker app) to run the network utility.

    Works by a simple approach:


    Measure the amount of time to connect and disconnect from specified ports for
    some to the limit of another. The idea behind Zing is not unique; I have read
    source code in network applications with similar approach. Unlike the other tools
    I''ve seen, Zing is designed to operate and operate more like


    This idea of connecting, and disconnecting avoids any ICMP packets or other data.
    Zing needs connections. Measures of each other connects, disconnects over network
    timing. During this process, a host and port are determined to be reachable, and
    responding. Also, in some cases, a connection can pass through a remote host and
    port.


