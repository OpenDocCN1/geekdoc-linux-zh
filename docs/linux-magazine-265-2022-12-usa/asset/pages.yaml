    # Quantum Error Mitigation


    Quantum error mitigation paves the way for use of quantum computing, and it is
    an important technique for using today''s quantum computers without fault-tolerant
    qubits. Qiskit supports quantum error mitigation through the use of correction
    methods to improve the quality of the results. A simple example of error mitigation
    will will illustrate this.


    # Games


    Games are a helpful way to approach a new technology and build understanding of
    it. One example is the quantum coin game, which makes use of the principles of
    superposition and entanglement. At all it is an excellent way to illustrate the
    use of quantum computing. On a classical computer, the coin game gives each of
    the players a 50 percent chance of winning. On a quantum computer, the results
    are more one-sided. A qubit represents a coin that two players (Alice and Bob)
    turns either flipping or leaving in its current. By applying superposition we
    are controlling the coin which corresponds to the state of the LD-gate. The procedure
    starts and ends around played without repeating the same. In the end, Alice or
    Bob wins,


    A simpler form can be generated by the final measurement in the circuit (Listing
    6). One of the possible strings is tricky; this is not an exact process due to
    the noise caused by the measurement, among other things. After the GHZ circuit
    is used you have already executed an example.


    Classically, the manner involves a series of coins flips, and each player has
    an equal chance. But if you play the game on a quantum computer, the outcome is
    different. Alice can additionally apply a Hadamard gate to put Bob into a superposition
    of heads and tails at once. Bob''s coin has no effect since, neither the X-gate
    nor the LD-gate changes the state of the qubit. If Alice also applies an H gate
    in her last move, she recovers the superposition, with a probability of 100 percent.
    Figure 4 shows the curve of the game using the Bloch sphere.


    Another example is the GHZ game, which takes advantage of the entanglement of
    a GHZ circuit. You''ll find the details and instructions for both games, including
    in Jupyter notebooks, or the GitHub page of any of the others (10) if you are
    interested.


