    # An introduction to quantum computing


    # Cat''s Dilemma


    The peculiar world of quantum mechanics points the way to a new kind of computter.
    If you''re wondering how quantum mechanics works, we''ll give you an inside view.


    By Matthias Homeister


    quantum computing is a phenomenon that is so close to the edge, it feels like
    science fiction. The concepts have been around for many years. In 1980, physicist
    Paul Benioff described a Turing machine built in the mysterious world of quantum
    mechanics. A few years later, Nobel laureate (American physics) Richard Feynman,
    with a Russian mathematician Yuri Manin, suggested that a quantum computer could
    do things that can''t. Classical and quantum computers were introduced, and then
    they have been busy working around theoretical algorithms for quantum. But the
    hardware however been busy lately, taking on the challenge of designing quantum
    circuits and maintaining entangled particles at temperatures close to absolute
    zero. The first quantum computer appeared in 1998, and over the past few years,
    billions of venture capital have powered quantum startups, which begin experts
    in quantum physics to take a claim on the emerging market.

    Quantum computers exist today, although they are very small and experimental,
    and still aren''t enough to outperform conventional computers. But new breakthroughs
    occur every year, and many experts believe the age of the quantum computer is
    not far off. Offer access to quantum computing via cloud services now. This article
    introduces you to the principles of quantum computing – and why this technology
    could have such a powerful effect on our future.


    Before I attempt to describe this strange world of quantum computing, I should
    add that quantum mechanical phenomena cannot be explained with experience of everyday
    world. A complete explanation would have to start with the double-slit experiment,
    which you may be famous for a separate article or a book, here I will instead
    focus on how qubits behave and what you can do with them.

    This starts with a most famous thought experiment: Schrödinger''s cat. In a highly
    simplified version, imagine a cat in a box that is both alive and dead from the
    outside. A quantum-mechanical event within the box has the health status of the
    animal in limbo (often called Schrödinger''s cat). Whether the cat is alive or
    dead is indeterminate; a superposition of these two possibilities exists only
    as long as the box remains closed. If we open it, we find either alive or dead.
    The choice collapses the moment of opening, and there is a chance of 50 percent
    that the cat is alive, and the same probability that the cat is dead.


    # The Basics


    The basics of quantum computing is the quantum bit or qubit, which is both a physical
    component and a logical unit of information. As you know, a classic bit can only
    assign values 0 or 1. If you access and read a qubit, you also get a value of
    0 or 1. Before, however, fundamentally different states exist with a quantum bit.
    Because of quantum property known as superposition, additional values between
    0 and 1 are possible, leading to computational efficiencies that are not possible
    with conventional computers.


    # Schrödinger''s Cat


    In the unverified version of Schrödinger''s experiment, the cat is in a box with
    an atomic nucleus. The nucleus decays with a certain probability. A Geiger detector
    detects the decay, and then releases a poison that kills the cat. The genius of
    this thought experiment is that it forces the weird laws of quantum mechanics
    typically only occur at the microscopic level to apply to the cat - the cat''s
    state becomes indeterminate. In other words, the cat is both alive and dead until
    the experimenter looks in the box.'
