  md: '# LINUX DOGHOUSE – LANGUAGES


    ![](img/d241cea1a8a6d96778bcc3ba9ab74512_69_0.png)


    John "maddock" Hall is an author, educator, consultant and software pioneer who
    has been a passionate advocate for Linux since 1994 when he met Linus Torvalds
    and contributed Linux to a 64-bit system. He serves as president of Linux International!


    # MADDOCK''S DOGHOUSE


    The efficiency of a programming language doesn''t show the full picture. BY JOHN
    "Maddock" HALL


    # Language "efficiency"


    I understand the importance of across cloud architectures, which allows you to
    move your application and the costs of a particular vendor become too high or
    cloud vendor goes.


    This article was inspired by a conversation with Lincoln about a whitepaper publishing
    the efficiency of various languages, with the claim (by the paper) Python is very
    efficient in exception to ordering languages like C and++. Many people making
    claims from "Python is killing the planet" to "What is a language like Python?"


    First of all, to point a language and say efficiency is not really useful. A language
    is a matter of syntax and semantics to what humans understand and binary-code
    to what the computer can do, usually by a program as either a compiler or interpreter.


    Compilers and interpreters use CPU cycles that in conversion process. Compilers
    tend to do this instead of runtime, running of the machine code that is all that
    matters for efficiency. That efficiency comes at the cost of not having a lot
    of additional information that has been "thrown" by the interpreter. For example,
    the interpreter may be able to catch errors during the


    execution and point to the source code where the issue occurred. With a compiler,
    that source code may be very long.


    Secondly, between compilers for the same language, we have different levels of
    efficiency. In the C language, there are many versions of compilers created by
    different teams in different programs, and often meet with different levels of
    needs.


    Some compilers, tended to have generated systems optimized for size. Others may
    focus more on speed, making the language different optimizations. If you look
    at the GCC compiler, you can see many different optimizations, in the code in
    one way or another which will affect the "efficiency" of the code.


    Interpreters will use the code and get it work without any optimization, making
    it harder to do the actual performance, but then on the optimizations for the
    final.


    This would be great except that optimization can inject errors, and often those
    errors are hard to find.


    Many people reading the whitepaper argued that interpreters and scripting languages
    are always less efficient.


    I often heard about how scripting was inefficient. However, Unix and Linux have
    been rewritten over the years to be really efficient, depending on an application,
    a well written script might be as efficient as a properly written C.


    Interpreters pre-compile to get down to "stops" (or loops) that are consumed by
    a very efficient runtime.


    There is also the concept of a thinned interpreted language, where a "thread"
    simply gathers calls after every module call.


    C is a minimal syntax that is very powerful, but forces the compiler to create
    their own routines or use libraries that come from the various operating systems.
    Use of "pointers" is very powerful if used well, but also leads to mistakes if
    the compiler is not careful.


    Python has many useful functions, such as garbage collection that save the language
    works well with different types of functions. On the other hand, languages with
    so much syntax that it takes hard for mortals to learn adds to complexity.


    People ask me how they get started with programming. I point to scripting as a
    "first language" in the Unix and Linux shell, space, where all the utilities work
    as well as powerful.


    Then I recommend a first programming language that is simple to learn, and there
    are many of them, most of them, just the programmer learns how


    After that, I suggest C or C++ or (these days) Rust.


    In the end, a good programmer will learn more languages that are special, or simply
    need for some job to repair some code from another programmer.


    The trade-off is ease of programming against efficiency of algorithms, with very
    little depending on the syntax of the language.


