  md: '# # Structure your ideas with Heimer mind maps


    # # Drawing Trees


    Mind maps help you organize your thoughts and in a clear-cut tree structure. Heimer
    can help you draw those trees.


    **BY TIM SCHÜRMANN**


    What are you having for dinner? This is a tricky question, with family members
    having different ideas about what you put on the menu. Fortunately, the suggestions
    can be quickly organized in a mind map. This involves writing a central term at
    the center of a sheet, then branching off with related, derived, or subordinate
    terms. Like a tree, these branches help in turn structure the ideas, thoughts
    - or recipes.


    example. On Ubuntu, you can install the software at the command line:


    ```

    sudo snap install heimer

    ```


    If you prefer the package manager to Snap, you can download packages, LTSs currently
    supporting the last three Ubuntu derivatives, from Heimer''s GitHub page. These
    deb packages can also be imported on Ubuntu and Linux Mint. For Linux Mint, just
    run the command in line 2 of list.


    Besides helping you choose a recipe, mind maps can help gather the content you
    need to visualize or complex concepts. They are particularly useful for lists:
    the memorable graphics make it easier to remember all the topics you need to address
    in your list rather than just using a list. With Heimer, you can draw with a pen
    or paper quickly with a mouse click. When you add a new item, Heimer rearranges
    all the elements at the push of a button. You can export the finished mind map
    in PNG or SVG format.


    No matter how you install, you can find Heimer via the Start menu or the Activities.
    If you can''t find it in your distribution''s software manager, and you are not
    using Ubuntu (or a derivative), your best option is to download the spare package.
    If your distribution supports this format, you need to flag the failed file as
