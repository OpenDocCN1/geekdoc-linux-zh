    \n11 月 13 日–18 日\n\nSC22 是全球最大的 HPC 研究人员和专业人士聚会之一，这是一个学习新技能、建立新友谊、解决复杂问题以及查看下一代技术的惊人周。\n\
    \n如果你倾向于虚拟参加，可以使用全新的、定制的数字体验。\n\n国际高性能计算、网络、存储和分析国际会议\n\n## 立即注册！\n\nsc22.supercomputing.org\n\
    \n赞助商：IEEE COMPUTER SOCIETY TCHPC sighpc\n\n## 使用 Buildroot 构建你自己的 IoT Linux\n\
    \n## 变小\n\n无论你需要一个用于 1MB 闪存内存的微型 OS，还是一个带有图形栈的复杂 Linux，你都可以使用 Buildroot 快速设置一个运行的操作系统。\n\
    \n作者：Arnout Vandercappelle\n\n为了组合一个基于 Linux 的 IoT 系统，你需要一种快速简单的方法让基础系统运行起来。在进行此操作时，你还需要关注占用空间——某些平台的闪存内存小于\
    \ 4MB。你将希望控制系统中所包含的软件，并希望能够使用自己的应用程序。最后但同样重要的是，你将需要注意安全并遵守开源和专有许可证。\n\nYocto 项目\
    \ [1] 将帮助你完成这些任务。Buildroot 出现于 21 世纪初的 OpenEmbedded 和 Busybox 项目，专注于创建占用极小的系统。与显著复杂的\
    \ Yocto 相比，Buildroot 更容易使用和理解（见本期第 16 页开始的文章）。如果你不需要 Yocto 的功能（如多层系统或其他高级功能），而只是想为嵌入式设备生成一个操作系统，那么\
    \ Buildroot 更好。\n\nBuildroot 可以生成：\n\n- 一个交叉编译工具链\n- 一个根文件系统\n- 一个 Linux 内核\n\
    - 目标设备的引导加载程序\n\n一个基于 Linux 内核菜单系统的选择工具允许你选择哪些软件包以及相关的配置选项。这种菜单驱动的方法帮助你拥有所需的软件包和相关配置选项。这种方法有助于你减少内核的占用空间。\n\
    \n与 Ubuntu Core 不同，通过 root overlay 帮助你排除掉不需要的软件包。在配置中，你可以选择像 UBIFS 这样的 NAND flash\
    \ 选项，文件系统选项（图 1）。\n\n```\n####################\n# tfer\n####################\n\
    TINFINER_VERSION = 1.0\nTINFINER_SITE = $(call taramp,tfer,\nTINFINER_LICENSE\
    \ = MIT\nTINFINER_INSTALL_SITE =\nTINFINER_GMOD = /cmd/tfer\n\n$($(package))\n\
