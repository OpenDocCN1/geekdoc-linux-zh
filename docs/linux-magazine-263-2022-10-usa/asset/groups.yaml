- md: '

    # NEWS


    # Linux


    Linux welcomed a Mint migration and is open to changes. We''re currently testing
    Blueman and working on its integration within Mint.


    Other features found in Linux Mint 21 include Timeshift becoming an official Linux
    Mint tool, Web image support, better wallpapers via XAPP, including the support
    of Ubuntu-3 for AppImage applications, Cinnamon 5.4.2, an improved Sticky Notes
    app (which allows for note duplication), and a new process manager system for
    automating tasks.


    One thing the Linux Mint Developers didn''t add to version 21 is systemd-oom,
    which is a service that automatically manages out-of-memory issues by killing
    running applications. Ubuntu 22.04 introduced this feature, which has caused numerous
    problems in user space. Because of this, the developers of Mint opted to nix the
    inclusion of this feature.


    Download your copy of Linux Mint 21 now (https://www.linuxmint.com/download.php).


    ## Firefox Adds Long-Anticipated Feature


    With the release of Firefox 103, a few new features are added at greatly improving
    the experience of some users. One of the biggest additions to the source web browser
    is two finger horizontal gesture for navigating back and forward with a trackpad.
    This feature has been in works for some time and is now the light of day. However,
    there is a cave to the new addition. The developers'' goal was to fully support
    the gesture with version 103; however, upon release, the only way to use the two
    finger gesture is to first press and hold the Alt key on your keyboard. Hopefully,
    in the next update that requirement will be removed and the feature will work
    exactly as intended.


