    \nIf you now call bitbake-image-qt, the \"Hello, World\" will be created and placed\
    \ in the final image, which you can now load onto the soft device.\n\n## Conclusions\n\
    \nIf you need to adapt an operating system to an embedded device, and you want\
    \ to use Linux, the Yocto project will give you a head start starting with the\
    \ tools. The tools, layers, and recipes of the Yocto project will save you time\
    \ and simplify the task of adapting Linux to the hardware. Innovative frameworks\
    \ also exist, for example, Buildroot [3], which you will read about later in this\
    \ issue. The advantage of Yocto is that it is very popular among SoM vendors and\
    \ becomes the predominant framework for Linux. The disadvantage: it requires significantly\
    \ more resources than Buildroot.\n\n## Listing 6: hello-world.c\n\n```\n#include\
    \ <stdio.h>\n\nint main() {\n\n    printf(\"Hello, World!\\n\");\n\n}\n```\n\n\
    ## Listing 7: Append file\n\n```\nIMAGE_INSTALL_append += \" hello-world\"\n```\n\
