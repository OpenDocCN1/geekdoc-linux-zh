    《Linux Magazine》是您进入 Linux 世界的指南。每月杂志都包含了您在其他地方找不到的高级技术文章和教程。探索我们的完整旧刊目录，以获取特定主题或完成您的收藏。


    在线订购：https://bit.ly/Linux-Newsstand


    # 262/2022年9月


    # 超5G 时代


    在背后，手机网络一直是高度专业化专有设备的领地，但最近的一些创新可能会改变这一局面。我们探索了 Open RAN 规范，它可能让未来更多的移动网络在现成硬件上运行。


    DVD 包含：openSUSE Leap 15.4 和 MX Linux 21.1


    # 261/2022年8月


    # USB 启动


    Live  启动在 15 年前是一个令人兴奋的想法——只需携带一张光盘，即可在任何地方启动。但旧式的启动光盘具有某些局限性。今天的 USB 启动工具解决了这些问题，并增加了一个人从未想过的功能：在单
    盘上访问服务器启动。


    DVD 包含：Linux MATE 20.3 和 FreeBSD 13.1


    # 260/2022年6月


    # 隐私


    如果您非常担心隐私，您将需要学习比浏览器跟踪拦截更多的内容。那些需要匿名性的人将依赖 Tor 网络 - 这是一个在监控国家提供安全浏览的全球性项目。我们还查看了
    Postmaster，一个具有一些实用隐私功能的应用程序。


    DVD 包含：Ubuntu 22.04 和 Fedora Workstation 36


    # 258/2022年5月


    # 零信任


    二十年前，每个人认为网关防火墙是您免受入侵者侵害的唯一需要，但最近的历史讲述了不同的故事。今天，最好的建议是：不要信任任何人。您的内部网络可能和互联网一样危险。


    DVD 包含：Zorin OS 16.1 Core 和 Super GRUB2 Disk


    # 257/2022年4月


    # 加密


    您认识的大多数可以通过切换到更高效的灯泡来节省能量，但您知道可以使用更高效的软件来节能吗？本月我们考察了为 IT 行业带来可持续性所做的持续努力。


    DVD 包含：Linux Mint 20 Cinnamon 版和 deepin 20.4


    本月，我们调查了 Linux 加密状态。我们跳出了基础范围，探索支撑安全系统的某些工具和技术，并展示您需要确保隐私密无可击的内容。


    DVD 包含：Linux Mint 20 Cinnamon 版和 deepin 20.4


    # 特色活动


    用户、开发者和供应商在全球各地的 Linux 活动中汇聚。《Linux Magazine》荣幸呈现此处展示的特色活动。有关您附近的其他活动，请在我们的网站
    www.linux-magazine.com/events 上查看详尽的日历。如果您知道您希望我们加入日历的 Linux 活动，请发送包含详细信息的邮件到
    info@linux-magazine.com。


    在预订任何行程之前请务必检查网站，因为受新冠19 影响，许多活动已取消或转换为虚拟活动。


    # 学院

    **日期：** 2022年10月1-7日

    **地点：** 西班牙巴塞罗纳

    **网站：** https://academy.kde.org/2022

    学院是 KDE 年度全球峰会，它是全球最大的自由软件社区之一。这是一个由 KDE 社区组织的免费、非商业活动。来到加泰罗尼亚充满活力的城市巴塞罗纳，面对面交流，享受最佳体验。


    # SC22

    **日期：** 2022年11月13-18日

    **地点：** 德克萨斯州达拉斯

    **网站：** https://supercomputing.org/

    在达拉斯会 way您的朋友和同事，并在规模最大的 HPC 会之一探索惊人的学习。如果您无法亲临现场，SC 提供强大的数字体验，并在活动开始后24小时内提供点播。


