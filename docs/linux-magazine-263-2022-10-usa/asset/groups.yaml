    # COVER STORY


    # # Buildroot


    # ## Your Options


    To generate a working output an application needs to deliver the functionality
    of an IoT device. Sometimes this is limited to a few scripts such as PHP files
    that you use through the web server which are simply part of the roots overlay.
    However you will usually need to compile and install more custom components.


    Buildroot offers two ways to compiling your owning. One way is to set up separate
    definitions for each component, consisting of a few files, especially if one of
    the supported builds is used (Figure 1). For C++ which are these Meson, Cmake,
    Make and Autotools, and other languages are handled via build systems: For Go,
    Golang, Rust, Rebar for Erlang, Luasit for Lua, or MUB for Python scripts are
    simple and easy to use.


    With Distibuls, Deutils, P5fig, and Make, the Comprehensive Build Manual (2) explains
    how to create a package definition and which variables you need to use to finish
    the build.


    Buildroot also allows you to look around mixing your own definitions with Buildroot''s
    source packages. The external tree mechanism is the easiest way to add custom
    package definitions to those belonging to Buildroot. Additionally you can store
    your configuration and other files, such as the overlays in the tree. This keeps
    all your customizations in one place.


    Sometimes it is more convenient to compile your code outside of Buildroot. For
    large projects you might find developers who do not work with Buildroot on a daily
    basis so it is easier to compile from an IDE if you are working directly with
    a build system that the development environment supports. Buildroot provides an
    SDK containing the compilation toolchain, all configured libraries and the roots.
    After all you will need some of these to build your own applications and Buildroot
    generates the code that includes the compile options of a Google protobuf definition.
    The SDK is available as a tarball that you can unpack. If you set up the IDE to
    use the SDK-core you can compile and debug directly from it.


    fixes the release is maintained (bug fixes and security updates) for three months.
    A newer version is released every month. The XXXX release is an LTS (Long Term
    Support) that is maintained for longer over a year and has releases added monthly.


    Buildroot is community-driven, with 100 people contributing to release and a total
    of 1500 changes per week. The community communicates mainly via the mailing list
    (lists@buildroot.org) and on IRC #buildroot on Fera Technology Community (FTC).
    Every week, a developer meets to discuss new developments and solve pending issues
    on the agenda. In addition the community discusses and decides on controversial
    cases in this there. There is no control behind it. However companies and consultancy
    services offer support to Buildroot.


    To get the operating system on the laptop with all the packages you need visit
    the Buildroot website for more information.


    The developer tools do help you build your own Buildroot. You can use pkg-tools
    to check and pkg-utils collect information about the packages you use, search
    for new versions on the network, for Connections from the National Vulnerability
    Database and CVE Reports where the NIST returns the results in HTML and JSON.
    This report appears for the package (3). If you want to customize a package use
    the- toolchain.


    Further getting goes on - 440 tasks. A week of the 270 configurations for SBCs,
    SoCs, and Qemu are built with Buildroot. All were created weekly. Finally there
    are 20 build servers that generate arbitrary configurations. The reports from
    these servers are available online [4].


    # ## Conclusions


    Buildroot has evolved over the years to build a system that is both stable and
    proven in the world. Buildroot supports many use cases, with systems as little
    as 1MB flash memory to Docker images for cloud deployment, to complex systems
    with a graph database or linux. The simplicity of flexibility, reproducibility,
    and maintainability Buildroot an excellent choice for IoT systems.


    After cloning it with Git repository [5], configuring it takes more than a month.
    The reward is a final product well.


