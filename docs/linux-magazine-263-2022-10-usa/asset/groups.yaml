    ## 深度解析


    ## 介绍 Rocky Linux


    # Rocky Linux 正在企业领域寻找足之地


    ## 响应召唤


    Rocky Linux 成为 Red Hat Enterprise Linux（RHEL）的免费替代方案。作者：Jose Casad。


    开源世界不断演进，新的 Linux 发行版往往会在需求产生时出现。Rocky Linux 就于去年出现，部分是为了参与企业领域的重组，但正如开源世界的情况一样，变化发生得非常快。Rocky
    正在进入专业软件工作、工作站和云实例。什么是 Rocky Linux？它源于何处？讲述这个故事最好的方法就是从头开始。


    从以前，一个名为 RHEL 的免费开源操作系统作为社区驱动的 Linux 发行版发布了。虽然红帽（Red Hat）将其视为一种盈利业务理念，但 Red Linux
    的价格便宜得多。任何人都可以使用它，全球许多用户聚集在一起对其进行测试并帮助他人。


    ## 历史回顾


    某一天，红帽（Red Hat）宣布将不再免费提供其发行版的二进制版本。该二进制版本不包含订阅，而是需要付费并处于某些支持服务下提供。如果你想知道在使用红帽的通用公共许可证（GPL）对
    Linux 收费是否合法，答案是合法的。GPL 要求如果程序被修改，则源代码必须可用——它并不要求分发者免费传播编译后的二进制版本。只要红帽将源代码放在他们想要的任何地方，他们就可以更改二进制版本——而且更改的幅度就像微软对
    Windows 收取的费用一样（为什么 Linux 比 Windows 更好？）。


    但由于 GPL，他们仍然无法脱离免费存在。源代码仍然根据 GPL 条款公开，任何想要获取它的人都可以获取源码，移除商标和其他属性组件，然后进行编译并给它一个不同的名称。


    为了保持与社区的联系，红帽宣布他们仍将提供一个他们命名为 Fedora 的版本。许多用户从红帽切换到 Fedora 并继续支持这种做法，但每个人都知道 Fedora
    与（红帽版）完全是一模一样的。首先，它是 RHEL 的上游版本，因此不需要相同水平的测试。其次，它使用了 RHEL 中包含的许多工具和功能。正如企业空间中的许多其他开源产品一样，红帽对“社区”版的关注多于“企业”版。


    在全盛时期，有几个项目提供了 RHEL 的免费重新编译版本。随着时间的推移，RHEL 领域涌出了一个领导者，那就是 CentOS。CentOS 社区拥有一个忠实的用户和志愿者群体，它可以运行服务器、Web
    服务器和企业工作负载。当红帽发布 CentOS 的新版本时，CentOS 成为最受欢迎的基于 RHEL 的发行版——这不仅是因为它是免费的，还因为它包含了企业级
    Linux 的所有测试和完善。


    2014 年，红帽宣布将赞助其 CentOS 版本的后续开发。


    IBM 对红帽的收购导致了优先顺序的危机。在发生变化的 2022 年，（红帽/IBM）宣布 CentOS 再不能是企业版的克隆。它仍然会存在，但被规定为 RHEL
    的上游。


    社区再次忙乱起来，寻找一个新的发行版来扮演 CentOS 多年来扮演的角色。在涌出的基于 RHEL 企业级源码的免费 Linux 中，领先的候选者之一是 Rocky
    Linux。


    ## 介绍 Rocky


    在 IBM 和红帽宣布将 CentOS 移至上游的当天，共同创始人 Grant Kurtitzer 支持创建一个新项目的想法，该项目将继续基于最新的红帽企业版。作为
    CentOS 老元兵，Kurtitzer 投资了多个企业代码库——他也将其带入社区并创立了该项目。


    Rocky 项目的赞助商是 CI(2)，这拥有约 50 名员工，提供 Rocky 支持并向 RHEL 添加组件；然而，Rocky 是一个独立项目，拥有多个赞助商，包括
    AWS、Google Cloud 和 Microsoft Azure。45cosh 公司将 Rocky 作为其存储平台的基础。因此，Rocky 意味着 Rocky。


    Rocky 将自己描述为一个与 RHEL Bug 兼容的系统，这意味着最新版本的 Rocky 包含了 RHEL 的所有功能。与它的兄弟版本不同，Rocky
    不提供前端的、实验性的组件。用户关注的是稳定性、彻底的测试和硬件能力。就像 RHEL 一样，Rocky 为每个版本提供定期更新和期 10 年的支持。


    ## Peridot（注：此处指代系统）


    Rocky 的开发者致力于在跟进新发布的同时更新代码库。在这种情况下，他们为社区贡献了新代码并引起了关注。


    Peridot（如果你发音那个 "T"）是一个云原生构建系统，帮助 Rocky 的开发人员更新 Rocky。Rocky 团队以开源代码构建并并通过 GitHub
    提供。Peridot 还提供了在红帽更新时查看 Rocky 项目的最佳方法。


    Rocky 坚信 Peridot 将帮助他们跟进红帽的更新和发布计划。Peridot 也可以用于帮助使用修改版本 Rocky 的特殊兴趣社区。


    ## SIG


    Rocky 鼓励有兴趣的用户聚集在一起分享解决方案和想法。特殊兴趣小组（SIG）为 Rocky 项目带来了不同的观点和活力。Rocky 拥有内核存储、虚拟化、容器、高性能计算和遗留系统的
    SIG。SIG 正在运行……（文本由于源码问题结束）。

