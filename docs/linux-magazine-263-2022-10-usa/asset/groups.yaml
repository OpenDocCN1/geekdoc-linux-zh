    # 新闻


    # Linux


    Linux 欢迎了 Mint 迁移并对更改持开放态度。我们目前正在测试 Blueman，并致力于将其集成到 Mint 中。


    Linux Mint 21 中包含的其他功能还包括：Timeshift 成为官方 Linux Mint 工具、Web 图像支持、通过 XAPP 改进壁纸（包括对
    AppImage 程序的 Ubuntu-3 支持）、Cinnamon 5.4.2、改进的便签笔记应用（允许复制注释）以及一个用于自动化任务的新进程管理器系统。


    Linux Mint 开发者没有在版本 21 中添加 systemd-oom，这是一项通过杀死正在运行的应用程序来自动管理内存溢出问题的服务。Ubuntu
    22.04 引入了这一功能，但它在用户空间引起了许多问题。因此，Mint 的开发者选择不包含此功能。


    现在就下载您的 Linux Mint 21 版本（https://www.linuxmint.com/download.php）。


    ## Firefox 增加了期待已久的功能


    随着 Firefox 103 的发布，新增了一些新功能，极大提升了部分用户的体验。该开源 浏览器最大的改进之一是支持使用触控板双指水平手势进行后退和前进导航。这一功能已开发了一段时间，现在终于面世了。然而，该新功能存在缺陷。开发者的目标是在
    103 版本中完全支持该手势；但在发布后，使用双指手势的唯一方法是必须先按住键盘上的 Alt 键。希望在下一次更新中将移除这一限制，让该功能完全按照预期工作。


    Firefox 103 增加的其他优秀功能包括：PDF 中的必填字段高亮、针对 120Hz+ 刷新率显示器的性能显著提升、改进的标签页内字幕，以及现在可以使用
    Tab、Tab-Shift 和方向键访问标签页工具栏。


    此外还修复了几个问题，防止了非阻塞性 WebGL 性能问题，以及由于处理 Web 内容存储导致的启动时间变慢问题。


    要了解 Firefox 103 的新特性，请查看官方发布日志（https://www.mozilla.org/en-US/firefox/103/releasenotes）。目前，该新版本已进入大多数发行版的官方存储库，但您也可以从
    Mozilla 官方网站下载（https://www.mozilla.org/en-US/firefox/new）。


    # Oryx Pro 笔记本搭载新款 CPU


    Linux 硬件供应商 System76 宣布了其 Oryx Pro 笔记本的更新。Oryx Pro 是人工智能/机器学习领域游戏的热门选择，配备了全新的第
    12 代 Intel CPU，拥有 14 核心 20 线程，频率范围从 1.7 到 4.7 GHz。System76 还确保您可以选择配备 NVIDIA RTX
    3070 或 3080 Ti 显卡的 Oryx Pro。


    Oryx Pro 包括 15.6 英寸或 17.3 英寸 FHD（1920x1080）哑光屏、64GB 双通道 DDR4 内存以及高达 4TB 的 PCIe
    Gen4 内部存储。接口/扩展支持 Thunderbolt 4、USB 3 Gen 2、USB C 和 microSD SD 阅读器。


    Oryx Pro 起售价 2,199 美元，现已发售（https://system76.com/laptops/oryxpro/configuration）。


    每两周在您的收件箱中获取最新消息


    免费订阅完整的 Linux 更新 bit.ly/Linux-Update


    2022年10月10日 第263 期 LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM


    # 从这里开始


    # 开源作业枢纽


    在开源生态系统中找到你的位置


    OpenSourceJobHub.com


    # 新闻


    内核新闻


    ### Zack 的内核新闻


    ### 追逐梦想


    Liam Howlett 代表自己和 Matthew Wilcox 近期宣布将 Maple Tree（枫树）引入 Linux。随后，Andrew Morton
    请求对 Maple Tree 进行一个详尽的解释。因此，尽管你可能想象了接下来会有多么美好的场景，Liam 表示：“枫树是一种为了高效使用而设计的 RCU
    安全范围 B 树。”


    这种 B 树结构设计用于极高效率地查找用户并检索大块数据。名称中的“树”指的是搜索路径，其中错误的路径会不断缩小范围。这类似于一个有趣的猜数字游戏，在 1
    到 100 之间选一个秘密数字，并告诉朋友他们的猜测比秘密数字高还是低。


    然而，B 树不是通过“二分”/高/低来缩小范围，而是一次可以分裂两个以上的分支。


    正如 Liam 所说：“随着分支因数的增加，它比根节点短得多，因此节省了缓存。后续条目之间链接的移除减少了缓存以及在许多情况下拉取上一个和下一个 VMA 的需求。”


    Yu 赵喜欢这个补丁并决定根据需要进行测试。事实上，他发布了一份带有调试数据的崩溃报告，Liam 查看了该条目后，两人进行了一次 Bug 猎活动。Liam
    说：“原因是我在分配后没有清理内核块，但通过合并补丁修复了它。我在锁中发现了另一个问题并也修复了，但我需要更改我的 map 算法，因为这在内存使用率高时会触发潜在的死锁问题——虽然我看到了一个有效的补丁，但我正在处理它。我认为最简单的方法是整合这些修复以及其他发送给我的补丁。我希望在今天结束前完成工作。”


    然后事情就此明确结束了。构建好的该功能将是内核欢迎的补充，而那个大 Bug 个人感觉就像 Maple Tree 并没有被添加到某个缺失项中。我个人认为 Maple
    Tree 之没有添加到内核是因为优先级不够。像 Liam 和 Matthew 这样受推崇的事物将不断进化，使 Linux 内核更接近理想。


    # FUSE 的力量


    Dharmendra 发起了用户态文件系统（FUSE），以允许多个用户同时写入一个文件。他说：“例如，当同一个文件通过锁进行序列化时，我需要持续整个请求期间持有锁。这种序列化效果良好。”


