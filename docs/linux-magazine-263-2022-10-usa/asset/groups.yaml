    of a notchback based on the three-color palette. By using the drawing command
    from line 4 of Listing 2, you can improve the house shape. The command adds bevel
    at the front.

    The auto.png file just provides the basis for beveling of the passenger compartment.
    The command writes to the auto-bevel.png. If you want to avoid recreating files,
    use the command from Listing 2. This modifies the auto.png file directly.

