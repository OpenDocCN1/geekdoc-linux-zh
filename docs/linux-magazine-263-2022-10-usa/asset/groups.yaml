    ## LINUX VOICE 0 A.D.


    You can dispatch a currently idle soldier to build new houses. The bar at the
    top of the screen shows you population count on the left. After building a few
    houses, create more citizens, who can then be dispatched to forage for more resources.


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_79_0.png)


    ## Exploring the Map


    A colored line marks the settlement area you control. You can see only what lies
    within this area. To explore the map, you need to create mounted soldiers and
    send them out to explore. In this way, you can see where there are more resources
    and where the enemy has settled. Areas outside that area that have not been explored
    will be displayed in black.ed areas are covered by a fog of war. You will see
    them in the condition that existed when one of your units (for example, the mounted
    explorer) was last there.


    As the game progresses, you will need to expand your settlement area. You can
    do this by constructing new buildings. Each building has a radius that occupies
    your settlement area. If it builds on the edge of your area, your settlement area
    increases. Most buildings can be erected within your settlement area, with the
    exception of the administrative headquarters. You can also build this on neutral
    territory, as it has the largest radius of influence.


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_79_1.png)


    Figure 7: The Druids are the Gallic heroes. They healed units that are the colored
    circle around the druid.


    To expand your settlement area, it is advisable to build more administrative headquarters.
    But be careful: Because of their importance, your enemies will attack these headquarters
    frequently.


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_79_2.png)


    ## Exploring Technologies


    With population growing and your barns filling up, you now need to research technologies
    to push forward your civilization''s development. This is what goes on the buildings.
    For example, the administrative headquarters you can build provides food, and
    you can develop tools for mining resources.


    Now is also a good time to construct more buildings. A marketplace lets you trade
    with allies. And you can exchange resources to keep your barns full. At the forge,
    you''ll develop techniques for metalworking. You can train healers at the temple
    and improve their skills there (Figure 7). If your settlement is located near
    a body of water, you can construct a harbor and building boats or war ships (Figure
    8).


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_79_3.png)


    Figure 8: If your settlement is located by the sea, you can build a harbor and
    every seafaring nation, needing boats to warships.


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_79_4.png)


    Once you have resources in your house and have constructed buildings and researched
    technology, you can advance from the village phase to the city by clicking on
    the appropriate button in the administration center, and then from the city phase
    to the metropolis phase as you progress.


    Figure 9: Training soldiers at the barracks (left), mounted soldiers at the stables,
    and building siege weapons as battering rams (right) at the arsenal.


    ## Defending Your Settlement Area


    Your opponents have certainly not been idle in the meantime and are bound to attack
    your settlement army in the foreseeable future. This is why you need to build
    good defenses. Citizen soldiers see themselves as a militia; in addition, you
    need professional officers and weapons. At the barracks you can create foot soldiers.
    The stables give you mounted warriors, and the arsenal produces siege weapons
    such as catapults and battering rams.


    These buildings are also where you can research weapons and combat techniques.
    Different civilizations also have other military units or special units. For example,
    the Romans build military territory. The Romans train dogs, the Carthaginians
    have warriors. To protect your settlement area from aggressive opponents, you
    can surround it with a wooden or stone wall and build watchtowers and fortresses
    (Figure 10).


    Each civilization comes with three heroes that you can create during the game,
    each of which you can create only once. No more than one hero per civilization
    can enter the game at the same time. These heroes are based on historical characters.
    They are especially strong warriors, and if there are soldiers near them, this
    increases their combat power (Figure 11). You create heroes in a fortress, but
    depending on the civilization, they can also be created in other buildings. In
    case of the Gauls, the gathering princes specific to this civilization serves
    this purpose.


    Figure 10: This well-secured Gallic settlement poses a real challenge to the attacking
    Romans.


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_80_0.png)


    Vercingetorix

    - Inaugured Defense: When garrisoned, the structure has +2 capture points.

    - Cellular Defense: When near allies units have higher attack strength, melee
    and ranged damage. Range 60 meters.


    Figure 11: The heroes in O A.D. are based on historical figures. They are particularly
    strong warriors who lead their soldiers in battle.


    ## Real Politics


    If your civilization is in a development crisis or the enemy threatens to overrun
    it, it is for politics in the form of various cheats (see Table 1, where you''ll
    also see, as a small Easter Egg, that the game lets you build a P-51 Mustang,
    a US fighter plane from World War II). To create units, first select any building.
    If that building belongs to you, the newly created unit belongs to you. If, on
    the other hand, the building is under the control of an enemy, the newly created
    unit will also take over.


    | Table 1: Cheats | Impact |

