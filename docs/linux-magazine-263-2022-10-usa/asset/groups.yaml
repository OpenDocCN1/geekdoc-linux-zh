- md: "\n# FOSSLIFE\n\nOpen for All\n\nNews • Careers • Life in Tech\nSkills • Resources\n\
    \nFOSSlife.org\n\n# MakerSpace\n\n# RFID reader on Raspberry Pi\n\n# Counting\
    \ Pumpkins\n\nInexpensive components for the SPI interface let you upgrade a Raspberry\
    \ Pi 4 to a display system for zero-contact RFID-based data acquisition. *By Martin\
    \ Mohr*\n\nradio-frequency identification (RFID) tags have become dispensable\
    \ in industry and government, as well as wholesale and retail spaces. The inexpensive\
    \ chips can be found on clothing labels, identification cards, and credit cards.\
    \ With a Raspberry Pi and an RFID kit, you can read the data from these chips\
    \ and view it on a display.\n\nIn this project, I read serial numbers from RFID\
    \ tags stuck on 3D-printed pumpkins - a slightly different kind of detection task.\
    \ To do this, I connect an RC522 [1] RFID kit and a 1.8-inch ST7735 serial peripheral\
    \ interface (SPI) thin-film transistor (TFT) display [2] to the Raspberry Pi 4.\
    \ The two modules could cost less than $15 (€14) in online stores. The pumpkins\
    \ contain simple RFID tags [3], also available for free. And the project seems\
    \ clear-cut and easy as if it would work right away, except the \"Mishaps, Misfortunes,\
    \ and Breakdowns\" to find out what can go wrong.\n\nThe circuit in Figure 1 shows\
    \ how the modules connect to the Raspberry-Pi, along with two pumpkins and LEDs\
    \ for testing purposes.\n\n# Mishaps, Misfortunes, and Breakdowns\n\nAfter some\
    \ brief research, I discovered libraries which I was going to use control the\
    \ modules. After a day of wondering and programming, it turned out that the library\
    \ for the RFID reader had been maintained for several years. The only way to get\
    \ it in Python 3 was to make code changes. In open source projects, you should\
    \ always take a look at the date of the last commit, and the issues, which will\
    \ inform you whether the project is still developed by the community.\n\nI have\
    \ stumbled across many pieces of orphaned software on the web. At first sight,\
    \ they might still see an active, but they have already been gathering dust for\
    \ years. The very popular Raspberry Pi tool has not seen support for a long time\
    \ the Python article has been removed from the Raspberry Pi package sources. However,\
    \ the Internet forgets, which means users are tripped up over outdated manuals\
    \ and how-to.\n\nUnfortunately, it seems like low level Python libraries have\
    \ been hastily hot-wired without extensive testing, which results in incompatibilities.\
    \ For example, I had to replace the reader and display programs in this project.\n\
    \n# RFID over SPI MAKERSPACE\n\n![](img/6816acb85ab93ecedbe75e6e9cb5d00d_60_0.png)\n\
    \n**Figure 1:** The circuit layout of the project is included in the download\
    \ section. You can see the diagram and the RFID reader connections on the right.\n\
    \nKiCad was used to design the circuit. Each of the modules is connected to its\
    \ own SPI interface. Figure 2 shows the project after the build; the RFID tags\
    \ are hidden in the pumpkins. Please note that only the Raspberry Pi 4 has multiple\
    \ onboard SPI interfaces.\n\n# Display and RFID Reader\n\nThe Raspberry Pi 4 has\
    \ four of seven SPI interfaces, all of which can be accessed from the 40-pin GPIO\
    \ header.\n\nprevious models came with just three SPI interfaces, of which only\
    \ two were routed to the header. Table 1 shows which pins correspond to the individual\
    \ interfaces on the header by default.\n\nNotice in Table 1 some ports overlap\
    \ and that SPI interface is not available on the header by default configuration.\
    \ However, the SPI interface configuration can be adjusted with the dtoverlay\
    \ command, which allows you to output a list of all predefined SPI devices (Listing\
    \ 1).\n\nThe individual interfaces have several configurations, each with a defined\
    \ number of chip select (CS) lines. Therefore you can configure the interfaces\
    \ very precisely to suit your project\n\n# Listing 1: SPI interfaces\n\n```\n\
    $ dtoverlay -l | grep spi\nsppi0-cs\nsppi0-cs\nsppi1-cs\nsppi1-cs\nsppi2-cs\n\
    sppi2-cs\nsppi3-cs\nsppi3-cs\nsppi4-cs\nsppi4-cs\nsppi5-cs\nsppi5-cs\nsppi6-cs\n\
    sppi6-cs\n```\n\n![](img/6816acb85ab93ecedbe75e6e9cb5d00d_60_1.png)\n\n**Figure\
    \ 2:** The complete test setup with a horde of pumpkins, the reader at front left,\
    \ and the display at back.\n\n# MAKESPACE RFID SPI\n\n# Table 1: Default SPI Pins\n\
    | SPI | Header | Pin | SPI | Header | Pin |\n|---|---|---|---|---|---|\n| SPI0\
    \ | MOSI | 19 | SPI4 | MOSI | 31 |\n| | MISO | 21 | | MISO | 29 |\n| | SCLK |\
    \ 23 | | SCLK | 26 |\n| | CE0 | 24 | | CE0 | 7 |\n| | CE | 26 | | CE | 22 |\n\
    | SPI1 | MOSI | 38 | SPI5 | MOSI | 8 |\n| | MISO | 35 | | MISO | 33 |\n| | SCLK\
    \ | 40 | | SCLK | 10 |\n| | CE0 | 32 | | CE0 | 12 |\n| | CE1 | 37 | | CE1 | 37\
    \ |\n| SPI3 | MOSI | 38 | | | |\n| | MISO | 35 | | | |\n| | SCLK | 40 | | | |\n\
    | | CE0 | 27 | | | |\n| | CE1 | 13 | | | |\n\n# Listing 2: dtoverlay Output\n\
    ```bash\n$ dtoverlay -h spi=on\n```\nEnables spi with three chip select (CS) lines\
    \ and associated nodes. The gpio pins for the CS lines and device node are configurable.\
    \ this only works on devices with wiring header; eg: Raspberry Pi Zero B as the\
    \ Compute Module.\n\n```\nUsage: dtoverlay-spi <val>\nParameters:\ncs_pin = gpio\
    \ for spi (default BCM_SPI0)\ncs1_pin = gpio for spi (default BCM_SPI1)\ncs2_pin\
    \ = gpio for spi (default BCM_SPI2)\ncs0 = Set to \"disabled\" to stop the creation\
    \ of userspace node/dev/spidev.0 (default is 'ok' or disabled)\ncs1 = Set to \"\
    disabled\" to stop the creation of userspace node/dev/spidev.1 (default is 'ok'\
    \ or disabled)\ncs2 = Set to \"disabled\" to stop the creation of userspace node/dev/spidev.2\
    \ (default is 'ok' or disabled)\n```\n\nrequirements. To get the currently loaded\
    \ overlays, with the concrete definition of an SPI device, along with the default\
    \ pins, use the -h option (Listing 2). To output a list of available SPI devices,\
    \ run:\n\n```\n$ ls /dev*\n```\n\nMake sure you enable SPI support with dtparam\
    \ line in the /boot/config.txt. Alternatively, use the Raspberry Pi configuration\
    \ and 3 SPI Interfaces. If you want to enable overlays directly by boot, you can\
    \ add them to /boot/config.txt (e.g., dtoverlay-spi-1). In particular you could\
    \ use a software driver of the individual lines of the SPI would be a bit over\
    \ the top of this article.\n\n# Prepping the Pi\n\nThe operating system for the\
    \ Raspberry Pi is up-to-date 32-bit Raspberry Pi OS. Listing 3 shows the commands\
    \ for updating the system and installing the required libraries and programs for\
    \ integrating the driver and code from Python Package Index (PyPI). When you are\
    \ ready, do not forget to enable SPI support for the SPI0 and SPI1 interfaces\
    \ by editing the /boot/config.txt file in your favorite editor and adding two\
    \ lines:\n\n```\ndtparam=spi=on\ndtoverlay-spi-1\n```\n\nto the end of the file.\
    \ You will need to restart the Raspberry Pi for the changes to take effect.\n\n\
    # Setting Up the Driver\n\nThe sample program display.py in Listing 4 is designed\
    \ to display the text on the display. The system controls the screen with the\
    \ help of the ST7735 library [5], which was specially developed to display data\
    \ to the screen. To generate the appropriate image data, access the Pillow [6]\
    \ image processing library (also known as\n\n# Listing 3: Preparations\n### update\
    \ Raspberry Pi\n$ sudo apt update\n### sudo apt install packages\n$ sudo apt install\
    \ python3-libspidev-dev lib1base-python\n### SPI and graphics libraries\n$ python3\
    \ -m pip install RPi.GPIO Pillow\n### The library for display\n$ python3 -m pip\
    \ install st7735\n### The library for RPi\n$ python3 -m pip install-rc2\n\n# RFID\
    \ over SPI\n\n# MAESPACE\n\nPIL is a powerful library with a large number of functions,\
    \ of which I will only use a few. The documentation [7] will give you a rough\
    \ idea of what you can do with Pillow.\n\n# Configuring the RFID Reader\n\nThe\
    \ Program in List 5 reads the individual UIDs from the RFID chips (line 10) and\
    \ displays them on the screen (line 13). The display is addressed by an address\
    \ to avoid the libraries for the display and the reader getting in When launched,\
    \ it first imports (1 through 5) the ST7735, required parts of PIL, and its sys\
    \ library, which reads the arguments from the command line. After that it creates\
    \ a SPI display object suitable for the hardware we are using:\n\nNote that the\
    \ reader does not authenticate against the chip, which means that it generates\
    \ an image of size suitable for the display and stores it in the image object.\
    \ The background color is fetched from the parameter passed in the command line\
    \ and (image 14). The last command transfers the image to the display.\n\n# Listing\
    \ 4: Display.py\n\n```python\n01 from PIL import Image\n02 from PIL import ImageDraw\n\
    03 from PIL import ImageFont\n04 import ST7735\n05 import sys\n06 \n07 display\
    \ = ST7735.ST7735(port=1, cs=0, dc=23, backlight=None, width=128, height=160)\n\
    08 image = Image.new('RGB', (display.width, display.height))\n09 draw = ImageDraw.Draw(image)\n\
    10 print(len(sys.argv))\n11 if len(sys.argv) < 2:\n12 print(\"Usage: Display.py\
    \ <text>\")\n13 sys.exit()\n14 draw.text((0, 70), sys.argv[1], font=ImageFont.truetype('UbuntuMono-Bold',\
    \ 10), fill=(255, 255, 255))\n15 display.show(image)\n```\n\nIf you run the program\
    \ with\npython3 Display.py \"Hello world!\"\n\ncommand, the Hello world! immediately\
    \ pops on the screen.\n"
