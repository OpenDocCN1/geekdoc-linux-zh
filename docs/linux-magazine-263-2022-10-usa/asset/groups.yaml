    # Faster with Scripts


    The skewness in drawing a skyscraper can be remedied by using a script that determines
    the image size based on the number of floors and windows about the desired number.
    It also defines a color gradient for the background and shades the image. It then
    draws all the instructions for the actual building and the windows and doors and
    collects them in an XML-formatted Magick Scripting Language (msl).


    Finally, the script uses a query statement to process the mess of drawing commands.
    This greatly speeds over independently developing image using scripts. Listing
    3 shows msl file for a two-story house with a foundation, five windows, and a
    front door.


