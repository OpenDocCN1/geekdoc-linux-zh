    "So which is it?" (Wait, "So which is it?")


    "Honestly, if a VM developer or ordinary user ignores a WARN_ON_ONCE_ON() from
    the VM subsystem, I don''t know what to say."


    - * the machine will happily continue working, so they can report the warning
