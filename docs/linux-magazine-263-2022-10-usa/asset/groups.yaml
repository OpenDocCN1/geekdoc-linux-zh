    ## 发行版漫游 – 红帽生态系统


    这种导向可能会吸引传统企业——特别是那些关注 AlmaLinux 和 RHEL 内容的企业——其在 2021 年增长了 17% [44]，产生了像 AlmaLinux
    和 Rocky Linux 等衍生版。


    ## CentOS Stream


    CentOS Stream 使用旧的 CentOS 标志 [6] 并延续了 CentOS 的版本，但这种名称上的连续性具有误导性。CentOS 是 RHEL
    的重新构建，而 CentOS Stream 则是 Fedora 和 RHEL 之间的中间层。另一方面，来自 CentOS Stream 的大部分 RHEL
    内容都是上游的。这意味着 CentOS 的下一个版本将是 9，而不是来自 CentOS 7（CentOS 7 仍然基于 RHEL 8，在开发停止后已被废弃）。相反，它的起点是
    RHEL。目前尚不清楚 Fedora 和 CentOS Stream 之间的关系，除了它们通常都基于几个 Fedora 版本，而这些版本的发布并不重合。


    尽管 RHEL 是一项商业软件，但免费社区引起了参差不一的反应。另一方面，红帽是 Linux 内核的主要贡献者。此外，它对从操作系统到 SELinux 的各种项目做出贡献，并开发了许多技术，包括
    PulseAudio、Flatpak 和 PipeWire。它的活动主要是内部的或以内部为主，这并不是最理想的方向。特别是 RHEL 的订阅尝试或安装，经常被忽视，视为
    Fedora 和 CentOS Stream 可用性中的免费漏洞，因为两者共享大部分相同的代码。然而，RHEL 的商业前景和……


    ## CentOS


    CentOS [5] 是 RHEL 的一个社区，吸引了那些倾向于更透明但无安全性的开发模式的人；它拒绝使用 Debian 作为 Web 服务器。红帽在 2014
    年收购了 CentOS，但让其独立运行直到 2021 年，当时红帽宣布停止 CentOS 开发并启动了 CentOS Stream 命名。CentOS 7
    将持续维护到 2024 年 6 月 30 日，但许多用户已经……


