    line of HTML, CSS, or JavaScript.


    # COVER STORIES


    **16 Yocto**

    Yoct project gives you all the tools you''ll need to build a custom Linux for
    an IoT device.


    **52 Programming Snapshot – Smart Predictions with Go**

    Bash shell command sequences tend to recur, smart predictions can save you time
    typing. We first let the shell keep notes on what gets typed, before a Go program
    guesses the next and runs it for you.


    **22 Buildroot**

    Whether you need a tiny OS for 1MB of flash memory or a complex Linux with a graphical
    stack, you can quickly set up an operating system using Buildroot.


    **56 Introducing Rocky Linux**nRocky Linux enters as a free alternative to Red
    Hat Enterprise.


    # REVIEW


    **26 Distro Walk – Many Hats**nThe Red Hat has and many its derivatives.'
