    ## 测评

    发行版 - 红帽生态系统


    开发团队对项目的描述与 AlmaLinux 类似，将其视为“Bug 兼容”且免费获取的 RHEL 实现。与 RHEL 相比，Rocky Linux 强调其构建过程的透明度。例如，在最新发布中，Rocky
    引入了 Peridot，这是一个基于云的开源系统。在 Rocky 中，其社区规范加密可以获得标准的认证。2022 年，Rocky 的最新版本甚至在 Extra
    Packages Enterprise Linux (EPEL) 仓库中领先取代了 RHEL 和 CentOS。


    ### 如何选择

    如果你认为这些描述增强了开源政策和偏好，你是对的。大多数发行版的代码库非常相似，但 AlmaLinux 和 Rocky 已经显示出差异化的迹象。因此，哪种发行版可能取决于其他因素？关注
    Linux 进展的用户可能偏好 Fedora，而另一个人可能使用更多 CentOS Stream 进行测试。传统主义者可能偏好 RHEL 的优势，而 AlmaLinux
    或 Rocky 对于后继者以及偏好红帽那种社区导向方法的用户来说同样优秀。对于许多人来说，某些考虑可能比技术考虑更重要。


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_27_0.png)


    ## AlmaLinux


    CentOS 的结束很快通过两个最少继任者的宣告宣布，两者在 CentOS 结束后几个月内就发布了第一个版本。其中第一个 AlmaLinux (7)，由 CloudLinux、AWS、Equinix
    和微软支持。该发行版对红帽和 CentOS 的结束做出了回应，在其自己的页面上将自己定义为“开源、社区驱动、企业级 Linux 发行版，注重长期稳定性，提供稳健的生产级平台”，正如
    AlmaLinux 所称。


    ## 衍生版本


    除了工作站和服务器版，Fedora 还提供了 spins - 带有除 Gnome、Cinnamon、Plasma 或 XFCE 之外的桌面环境。还有来自下载页链接或特定用途的镜像，如游戏或用于不同架构测试的
    Alternatives。


    除了两个不同的 Fedora 和 Rocky 衍生版外，某些如 ZLinux、SpringLinux 和 Oracle Linux 是从 RHEL 源包、CentOS
    及其网络安全工具包 (NST) 构建的；Berry Linux 是 Fedora 版本的 KNOPIX，而 UltraLinux 包含比替代桌面更多的功能以提供完善的纠正。最有趣的是
    Qube，它将应用程序分配给容器。结果是一个易于使用的安全系统，但至少需要 16GB 的内存开销。


    ## Info


    - [1] Fedora: https://fedora.org/

    - [2] RHEL: https://www.redhat.com/en/technologies/linux-platforms/enterprise-linux

    - [3] 红帽项目: https://fedoraproject.org/wiki/Red_Hat_Contributions

    - [4] 红帽增长: https://techcrunch.com/2021/10/21/red-hat-to-grow-but-ignores-community/

    - [5] CentOS: https://centos.org/

    - [6] CentOS Stream: https://www.centos.org/centos-stream/

    - [7] AlmaLinux: https://almalinux.org/

    - [8] Rocky Linux: https://rockylin.org/

    - [9] Fedora Spins: https://spins.fedoraproject.org/

    - [10] Fedora 变体: https://fedora.org/

    - [11] Fedora 衍生版: https://distrowatch.com/search?type=architecture&all&origin=all&base=fedora&notbase=None&architecture=all&package=rolling&all&isize=all&netstall=all&language=all&status=Active&simple


    ## Rocky Linux


    CentOS 的主要继任者是 Rocky Linux [8]，由 CloudLinux、AWS、Equinix 和微软支持。该发行版对红帽和 CentOS
    的结束做出了回应，在其自己的页面上将自己定义为“开源、社区驱动、企业级 Linux 发行版，注重长期稳定性，提供稳健的生产级平台”，正如 AlmaLinux
    所称。


