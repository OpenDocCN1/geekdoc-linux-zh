    This month Graham laeks with Cecil 5, chezmoz, Viddy, EmDuck, Paperless-ng, MegaGlast,
    and more!


    +   90 Tutorial – ImageMagick

    ImageMagick can do more than just edit images You can write a script that will
    create a simple drawing.


    # MakerSpace


    +   60 RFID over SPI

    Inexpensive components for the SPI interface let you upgrade a Raspberry Pi 4
    to a display system for zero-contact RFID-based data acquisition.


    +   66 Pigpip

    The wiringPi library, which many Raspberry Pi fans have grown attached over the
    years, is no longer maintained by its developer. An alternative called Pigpio
    has arrived in time.


