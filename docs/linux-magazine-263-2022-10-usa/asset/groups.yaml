    # 新闻


    ## 内核新闻


    有问题可以随时问我，或者在邮件列表中提问。


    `CONFIG_DEBUG_VM`？我不认为应该，因为这违背了最初启用这些调试选项的初衷。


    讨论到此结束：作为内核代码的维护者，Paragon 并不是所有辩论中表现出色的，但这也可以看作是常有的现象。


    > “重磅炸弹是，RHEL 8、SLES 15 或 Ubuntu 都没有启用 `CONFIG_DEBUG_VM`”


    最终，操作系统文化与内核文化之间的握手过程对双方来说都是令人不安的，而内核人员通常对各种冲击和例子非常熟悉，这些例子可以让 Konstantin 和 Paragon
    证明自己并最终成为“良好的内核公民”。


    Andrew 去证明在这一轰烈的争论中，寻找红帽 Linux 在其构建系统中启用 `CONFIG_DEBUG_VM` 的具体实例。他也向他们建议道：“是的，Fedora/RHEL
    是我提到的模型（实验性/稳定性）的一个具体例子。我 Justin，内核维护者，他可以澄清：我们不需要它们，`BUG_ON`，我们把它们删掉了。（但这向我强调了，我们确实违背了拥有
    `CONFIG_DEBUG_VM` 的目的。）


    ## 崩溃与警告


    在提交补丁时，Yu Zhao 出了精彩的声明：“为了进一步利用空间局部性，内核再次倾向于遍历页表来搜索页面并提升热缓存。下一个补丁中需要一个开关来完成这一行为。当禁用时，内核仅依赖
    `rmap`。”


    这也出乎意料，并表示：“从未预想过 VM 的 `BUG_ON()` 会以这种方式成为子集。”他建议添加额外的 `BUG_ON()` 函数会更好。但另一方指出：“没有一个解决核心问题：`BUG_ON()`
    会杀死内核。那么我们将怎么办？我们在我们最不想做的时候杀死了内核：即我们在有 bug 的时候。所以唯一的方法就是取消这种杀伤性。使用 `WARN` 并尝试修复它要好得多。这让我们更有可能听到内核缺陷的消息。”


    他的补丁没有被讨论，因为出现了一个更深层次的问题。在这种情况下，你会有内核调试的 `BUG_ON()` 调用。这是一个调试功能，用于测试循环出现的条件，或者如果是，则引发崩溃（无论是特定进程还是内核本身）。Andrew
    注意到了这个调用并指出：“通用规则是不使用 `WARN_ON` 或 `WARN_ON[_]`，然后忘记寻找一种让内核继续运行的方法。至少用户可以收集日志。”


    Linux Torvalds 此时加入了讨论，并说：“杀死机器在本地没有任何零处。如果你想报告一个 bug 必须发生这种情况，那么 `WARN_ON` 是唯一可以使用的工具。`BUG_ON()`
    基本上是在做错误的事。”


    你回答说，你使用 `BUG_ON()` 只会影响内核构建过程，而不影响运行时。Andrew 回答道：“我听说许多生产构建都启用了运行时 `VM_BUG_ON`。”


    你坚持立场，回答 Linux 道：“为了大局，难道你想把更多精力放在一小组运行的实验性内核上，以便它们回来向我们更大、更响地叫喊吗？`BUG_ON` 是可能会减少用户群的问题；关于这一点，根据我与一些测试人员（早期用户）工作的经验，他们会忽略
    `WARN_ON_ONCE` 直到内核崩溃。”


    但你再次反驳道：“没有人想在生产环境中调试 VM。某些发行版也提供前者的最新/US 启用 `CONFIG_DEBUG_VM`，以便在它们可用时有更好的测试覆盖。人们在生产环境中使用它吗？绝对有，否则我们没有足够的测试覆盖。我们本应该避免”


    2022年10月14日 263


    LINUX-MAGAZINE.COM 1 | LINUXPROMAGAZINE.COM


    ## 内核新闻


    “首先你说 `VM_BUG_ON()` 仅供 VM 开发者使用。


    “接着你说测试人员（普通用户）忽略 `WARN_ON_ONCE` 直到内核崩溃？”


    “所以到底是哪种？”（等一下，“到底是哪种？”）


    “老实说，如果一个 VM 开发者或普通用户忽略了来自 VM 子系统的 `WARN_ON_ONCE_ON()`，我不知道该说什么。”


    - *机器将愉快地继续工作，所以即使他们没有注意到时，也可以报告警告，而且他们不需要自动化基础设施*


    “这就是为什么我说‘厌恶’愚蠢的 `BUG_ON()` 的用例——它们经常会产生棘手的锁导致问题，导致一个完全未开发且从未被报告的东西。


    “是的，你可以谨慎一点，仅在可能恢复的地方使用 `BUG_ON()`。但即使如此，它们与仅仅 `WARN_ON_ONCE` 相比没有任何优势。”


    在 rahide 中，我们运行标准的 Fedora 配置，git 快照是用调试配置构建的。唯一的权衡是由于无法关闭某些可能杀死性能的选项，但我们有更多用户运行这些内核，从而暴露真实的
    bug。快速内核源自 Linus 树，并在大多数工作日进行重新构建。稳定的 Fedora 不是调试配置，但在可以在不严重影响性能方式的情况下保持调试配置时（如
    `CONFIG_DEBUG_VM` 那样），保持这些开启是有价值的，直到它们不再有价值。当然，RHEL 是一个保守得多的配置，以及一个保守得多的基础/回溯代码库。


    他补充道：“如果保持该选项变得有问题，我们可以简单地关闭它。Fedora 的安装基础确实比典型发行版更多样，也比大多数池更多样。在硬件阵列中两者都是如此。”


    （注：此处原文重复了部分内容）


    “首先你说 `VM_BUG_ON()` 仅供 VM 开发者使用。


    “接着你说测试人员（普通用户）忽略 `WARN_ON_ONCE` 直到内核崩溃？”


    “所以到底是哪种？”（等一下，“到底是哪种？”）


    “老实说，如果一个 VM 开发者或普通用户忽略了来自 VM 子系统的 `WARN_ON_ONCE_ON()`，我不知道该说什么。”


    - *机器将愉快地继续工作，所以即使他们没有注意到时，也可以报告警告，而且他们不需要自动化基础设施*


    “这就是为什么我说‘厌恶’愚蠢的 `BUG_ON()` 的用例——它们经常会产生棘手的锁导致问题，导致一个完全未开发且从未被报告的东西。


    “是的，你可以谨慎一点，仅在可能恢复的地方使用 `BUG_ON()`。但即使如此，它们与仅仅 `WARN_ON_ONCE` 相比没有任何优势。”


    在 rahide 中，我们运行标准的 Fedora 配置，git 快照是用调试配置构建的。唯一的权衡是由于无法关闭某些可能杀死性能的选项，但我们有更多用户运行这些内核，从而暴露真实的
    bug。快速内核源自 Linus 树，并在大多数工作日进行重新构建。稳定的 Fedora 不是调试配置，但在可以在不严重影响性能方式的情况下保持调试配置时（如
    `CONFIG_DEBUG_VM` 那样），保持这些开启是有价值的，直到它们不再有价值。当然，RHEL 是一个保守得多的配置，以及一个保守得多的基础/回溯代码库。


