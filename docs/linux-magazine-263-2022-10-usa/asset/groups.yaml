    \ associated with the recipe. In this example, the only file is a single file.\
    \ You can also specify complete tarballs that are managed by Git or subversion.\n\
    \nThe end of the recipe contains two more functions (Lines 7 and 10) that compile\
    \ the file of the application and install the results. The Yocto framework comes\
    \ with basic versions of the entities, which the user can then overwrite. The\
    \ framework also contains templates for other used functions, such as downstream.\n\
    \n## Listing 4: Directory Structure\n\n```\nmeta-custom\n|-- apps\n|   |-- files\n\
    |   |-- hello-world\n|   |-- hello-world.bb\n```\n\nThe actual application is\
    \ a very simple C file (Listing 6). To create the recipe, just use the short bitbake\
    \ hello-world command.\n\n## Listing 5: hello-world.bb\n\n```\n01 DESCRIPTION\
    \ = \"Simple World Application\"\n02 SECTION = \"examples\"\n03 LICENSE = \"GPL\"\
    \n04 LIC_FILES = \"file://${COMMON_LICENSE_DIR}/MIT\"\n05 SRC_URI = \"file://${WORKDIR}/hello-world.c\"\
    \n06 S = \"${WORKDIR}\"\n07 do_compile() {\n08 $(CC) -c hello-world.c -o hello-world\n\
    09 }\n10 do_install() {\n11 install -d $(D)${bindir}\n12 install -o root hello-world\
    \ $(D)${bindir}\n13 }\n```\n\nFor the local device to build the \"Hello, World\"\
