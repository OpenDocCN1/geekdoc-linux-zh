    # Ebook manager


    # FOSSPICKS LINUX VOICE


    ## Calibre 6.1


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_84_0.png)


    Calibre is one of the first-class open source applications that revisit, the brilliant
    in its own right, and performs important functions, it''s also an innovation with
    solid release cadence and significant updates. This is a good example because
    after 10 months of effort it brings many important features that any digital media
    handler will want to use. The list of these includes a global search, which allows
    you to search through your entire library of collections for phrases and even
    Boolean options (Calibre AND ebook) for searching and searching for other words.
    The latter is useful if you want to find words and numbers to something, such
    as "population" and "europe," or "harry" and "dobby".


    Before all that however, you need to manually build an index for your collection,
    and that can take some time. This is a one-off though, because new titles added
    to your collection are automatically scanned. If you don''t need to de-scan, the
    default is fine, but it is very useful if you do, especially if you organize your
    media in different collections so you can isolate your results across them and
    find what you''re looking for. Another new feature will read aloud a book from
    the ebook view. This could be done with a plugin, but it''s great to see the option
    built-in. Behind the scenes, a lot of work has gone into migrating Calibre.


    ![image](https://example.com/image1.png)


    It is possible to use both Calibre 5 and 6 at the same time, but if you do, books
    must be made to the most recent version to work with.


    From Qt 5 to Qt 6, many of the few applications that had to make switch. This
    obvious little brings future-proofing, but it means 32-bit support has been dropped.
    Luckily, the ARM platform is now officially supported, which is useful for users
    on Raspberry Pi or ARM laptops. Unfortunately, with such architectural changes
    come some incompatibilities, and it''s taking a while for some plugins to catch
    up with Calibre 6.


    ## Project Website


    https://calibre-ebook.com


    ## Config manager


    ### chezmoim


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_84_2.png)


    Linux configuration exists in a string between the old and the new. There is an
    existence and tradition, and contents are usually deeply holding value your PDFs
    server and login details, your Vim metadata, and personal terminals. They all
    pretend to be hidden. Modern applications often use the same format and locations,
    or often hidden by the config directory, which can become unacceptable. A solution
    for many years is to use an encrypted repository to hold all the configuration
    files I care about. This has the advantage of keeping your configuration files
    version controlled, but it also means you have to go through the arduous process
    of recreating all symbolic links in your home directory when you start a new machine.


    And this is exactly the problem that chezmoi has to improve upon. Chezmoi is a
    tool that has been designed to help your .dotfiles and all of them with minimal
    commands. It removes the uncertainty of doing it right. After it''s done, you
    run chezmoi init to create them (~/.local/share/chezmoi) and then a new Git-tracked
    directory for your own repository with chezmoi followed by the configuration file
    you wish to manage. This is the equivalent of moving the file and creating the
    necessary symbolic link in one place, and it means you manage your configuration
    files directly with chezmoi, with the complexity of dealing with Git.


    When the source file is updated, you are really editing the source file in chezmoi.
    To apply it when you see changes, chezmoi --apply. This works locally, but you
    can also add a remote repository and enable a feature to automatically track the
    changes to the repository. It is simpler than working with Git and saves you from
    the effort of recreating a configuration on a new machine. To do this, you use
    chezmoi init --apply. Everything else is handled automatically.


    ## Project Website


    https://chezmoi.io


