    \n这两个选项都不适用于我。当然，Google、Meta 以及其他致力于此类解决方案的营利公司只想构建一个更好的聊天机器人，但这就是这个领域的问题所在：一旦精灵跑出盒子，我们就不擅长把它们放回盒子里。\n\
    \n奇怪的部分是几位领先的计算机科学家认为解释很重要，你怎么看，说真的，程序并没有像我们一样感受事物。对于他们来说，程序在他们的实验室里运行得完美，直到一个记者出现并打开电视摄像机，但如果我们以这种方式对待这个问题——而且如果“它活着吗？”转移了我们应该提出的严肃问的注意力。\n\
    \n![](img/6816acb85ab93ecedbe75e6e9cb5d00d_2_0.png)\n\nJoe\n主编\n\n“感知”一词——在这种情况下，指的是情感状态——而非仅仅是知识。许多人将其等同于意识状态。因此，这场辩论已经从计算机科学冰冷的分析领域迁移到了形而上学的模糊领域，在那里这些概念非常难以定义。\n\
    \n在你决定计算机是否具有意识之前，你必须定义什么是意识，关于这一点有广泛的答案，取决于你是在和神父、心理学家、神经学家还是神秘主义者交流。但点在于，像 LaMDA\
    \ 并不是为了成为人类而创造的——它们是为了让人们认为它们是人类。如果你学会利用人类响应模式和情感信号，人类将以不同的方式对待你。（抱歉了爱狗人士：没办法如此。）\n\
