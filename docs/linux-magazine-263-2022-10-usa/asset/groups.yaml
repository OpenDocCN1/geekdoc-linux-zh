    Microsoft Azure. The company 45cosh, which uses Rocky as a base for their storage
    platforms, lists 12 sponsors on the page [3] So, for Rocky, Rocky is Rocky.


    Rocky bills itself as a system that "designed to be bug-for-bug compatible with
    RHEL which means the latest version of Rocky comes with all the new stuff in RHEL
    9. Unlike its siblings, Rocky does not want to offer the cutting-edge, experimental
    components. The audience is interested in stability, thorough testing, and hardware
    capability. Like RHEL, Rocky offers regular updates and 10 years of support for
    each release.


    # # Peridot


    The Rocky developers strive for seamless as they keep up with new releases


    and to update the code repository. In that case, they have contributed one new
    code to the community that is attracting attention.


    Peridot (and if you pronounce the "T") is a cloud-native build system for the
    Rocky developers to help them update Rocky. The Rocky team builds as open source
    code and makes available through GitHub. Peridot also provides the best way to
    start with a look at the Rocky project when Red Hat updates.


    Rocky is rocking that Peridot will help them keep up with Red Hat''s schedule
    of new updates and releases. Peridot could also be used to help the community
    of special interest using modified versions of Rocky.


    # # SIGs


    Rocky encourages users with interests to get together online to share solutions
    and ideas. Special Interest Groups (SIGs) bring different viewpoints and energy
    to the Rocky project. Rocky has SIG for kernel storage, virtualization, containers,
    high-performance computing, and legacy systems. The SIG works on versions of Gnom,
    KDE, and Xce. The architecture SIG has at work with various versions of Rocky
    in containers, hybrids, and embedded systems.


    The Rocky team has the SIGs to be more than just groups, working on aspects of
    the Rocky distribution to support their interests. High-performance computing
    (HPC) is a particular area of interest for the Rocky team. HPC systems require
    extensive testing but at the same time, a massively parallel HPC system can include
    hundreds (or thousands) of nodes, gives a competitive advantage to systems that
    are available at


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_56_0.png)


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_56_1.png)


    Figure 1: The old method: Rocky patches are applied to release, even if the contents
    of the patch are the same or nearly the same with each new version.


    Figure 2: The new method: Peridot is preconfigured with the location of the source
    code and the location of the patches. When a new version of the source code arrives,
    the user can click one button to trigger update.'
