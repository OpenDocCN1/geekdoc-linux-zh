    命令能够做更多事情，而且方式更高效——尤其是当你记忆力很好。你可以开始调整历史设置，并学习如何使用三种类型的编辑选项（事件描述符、单词设计符和修饰符）来管理历史，以便更容易搜索和重放。这三者的灵活性可以让你
