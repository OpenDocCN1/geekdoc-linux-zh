    # COVER STORY


    ## Yocto


    ## How the Yocto framework brings Linux to IoT devices


    ### Favorite Recipe


    The Yocto project gives you all the tools you''ll need to build a custom Linux
    for IoT device.


    By Mohammed Billbao and Joe Casad


    Hardware has been a challenge for the Linux community. Although it is possible
    to complete the Linux kernel and its surrounding applications for most any hardware,
    doing so can be complicated. It actually takes significant effort to adapt an
    operating system to a hardware platform. Giant companies such as Microsoft and
    Apple have unlimited resources to work out the details with hardware vendors,
    but Linux has been left largely to those with interest in its development.


    Today developers are in close contact with mega chip vendor, and Linux has plenty
    of room to run on ARM, MIPS, and several other leading hardware platforms. Debian
    supports more 10 architectures, in multiple varieties.


    But what if you''re starting from scratch on a new hardware system? Or if you''re
    developing a new product and the available OS alternatives for the board you''re
    building don''t meet your needs? Is Linux an?


    There are also other options for embedded systems, but if they don''t offer the
    features you need - or if they offer too many features you don''t need - it can
    be difficult to adapt. Yocto is working to change that.


    The Yocto project describes itself as an open source collaboration project that
    helps developers create Linux-based systems, regardless of the hardware architecture.
    Since 2009, the Linux community has evolved through a thorough collaboration with
    the OpenEmbedded project. The Yocto project combines, validates, and maintains
    three key elements:


    - a set of tools, such as for automated building and testing, board support and
    license compliance, and custom Linux-based operating systems

    - a reference embedded distribution, which is Pokey

    - the OpenEmbedded build system, which is co-maintained by Yocto and OpenEmbedded


    The overall goal of Yocto is to provide a complete development environment for
    adapting Linux to run on embedded or IoT devices. The Pokey reference distribution
    gives the user example to follow.


    One of the most powerful features of Yocto is a modular architecture built around
    layers. A layer is a collection of


    ## OS Options


    One key decision in the development of any IoT project concerns the choice of
    operating system. The choice of OS depends on the nature of the project.


    For a bare metal environment, no special operating system is needed. Instead,
    it is up to the developer to build capabilities into the application. Developing
    for a bare metal environment requires implementing a hardware abstraction layer
    (HAL) that needs the freedom to have access to hardware drivers.


    Other projects require a real-time operating system (RTOS), which is always time-critical
    in RTOS environments, and always puts a limit on processing. RTOS systems are
    common in the field of robotics, where the consequences can be catastrophic if
    reaction times are not met. Bare-metal RTOS systems often integrate the operating
    system and application.


    A third category of IoT projects calls for a more operating system such as Linux.
    Using Linux with bare metal or RTOS, the project does not have access to the OS
    source code. The integration then uses system drivers to access the user services.


    Figure 1 shows the resource consumption of the three alternatives. Bare-metal
    systems have the lower resource requirements, RTOS consumes by far the most resources,
    and it requires a processor that has a Memory Management Unit (MMU). On the other
    hand, Linux as an operating system allows access to a library of ready-made applications
    which are not available for bare metal and RTOS.


    16


    OCTOBER 2022


    UE 6

