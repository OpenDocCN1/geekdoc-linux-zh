    **Figure 1:** The circuit layout of the project is included in the download section.
    You can see the diagram and the RFID reader connections on the right.


    KiCad was used to design the circuit. Each of the modules is connected to its
    own SPI interface. Figure 2 shows the project after the build; the RFID tags are
    hidden in the pumpkins. Please note that only the Raspberry Pi 4 has multiple
    onboard SPI interfaces.


    # Display and RFID Reader


    The Raspberry Pi 4 has four of seven SPI interfaces, all of which can be accessed
    from the 40-pin GPIO header.


    previous models came with just three SPI interfaces, of which only two were routed
    to the header. Table 1 shows which pins correspond to the individual interfaces
    on the header by default.


    Notice in Table 1 some ports overlap and that SPI interface is not available on
    the header by default configuration. However, the SPI interface configuration
    can be adjusted with the


    # Reading from the SPI Interface


    dtoverlay command, which allows you to output a list of all predefined SPI devices
    (Listing 1).


    The individual interfaces have several configurations, each with a defined number
    of chip select (CS) lines. Therefore you can configure the interfaces very precisely
    to suit your project


