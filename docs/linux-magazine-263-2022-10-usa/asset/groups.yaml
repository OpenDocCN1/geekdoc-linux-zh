    # KOREADER-EADER LINUX VOICE


    Save the file and make it executable:


    ```

    chmod +x /koreader/scripts/up.sh

    ```


    To launch the script in the e-reader, open the terminal and run koreader/scripts/backup.sh.


    If you have to use a second e-reader, and want to download the settings and data,
    all you have to do is create a script that runs the following commands:


    ```

    rsync -avh --delete -n -g --no-p -e "ssh -p 22" USER@127.0.0.1:/path/to/library/
    /mnt/osboard/library/

    rsync -avh --delete -n -g --no-p -e "ssh -p 22" USER@127.0.0.1:/path/to/clipboard/
    /mnt/osboard/koreader/clipboard/

    ```


    Every time you run the scripts described above, you''ll be prompted to enter the
    password twice, which can quickly become a nuisance. To finish, generate an SSH
    key pair in KOReader, and add the public key to the list of authorized keys on
    the remote machine.


    To generate an SSH key pair, launch the terminal emulator in KOReader and run
    the prompts, skip specifying a passphrase. This generates a key pair in the /usr/local/iluje/usnet/etc/dot/
    directory. To make sure that the keys are there,


    ```

    ssh-add -c "/usr/local/iluje/usnet/etc/ssh-id_rsa" -l

    ```


    Copy the ssh_id_rsa.pub to a Linux machine, and use the command below to add it
    to the authorized_keys file on the server:


    ```

    cat id_rsa.pub | ssh USER@127.0.0.1 "mkdir -p ~/.ssh && cat >> ~/.ssh/authorized_keys"

    ```


    From now you can run the scripts (or any other commands that require an SSH connection
    (to the remote machine) without a password.


