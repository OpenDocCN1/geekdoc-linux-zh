    ## # MakerSpace


    Access the Raspberry Pi’s GPIO

    Pig Pen


    The wiringPi library, which many Raspberry Pi fans have grown attached to over
    the years, is no longer maintained by its developer. An alternative, in the form
    of Pigpio, has arrived in time. By Martin Mohr


    > For as or as long as the Raspberry Pi has been around, wiringPi served as a
    library for accessing the GPIO. With the gpi tool, programmers could quickly manage
    the GPIO at the command line. Many Raspberry Pi projects built on this library,
    not least because of frustration what were the communications from users, developer
    Don Henderson decided to discontinue his project in 2019 after leaving his last
    version. He explained in detail why he had spent developing the library, which
    has since been deleted, is still available on the Wayback archive [1].


    If you want to continue using the Raspberry Pi’s GPIO, you need to look for an
    alternative to wiringPi. Pigpio, which is also the successor to Raspberry Pi’s
    GPIO. At first glance, Pigpio library offers everything you might need for your
    projects.


    ## The Two Sides of Open Source


    The open community makes software projects available to the general public. Open
    source thrives on enthusiasts who develop in their spare time. All too often,
    however, it happens that they do not get recognition for their work. Many people
    expect developers to provide the kind of professional support that is expected
    even if bugs are fixed immediately. As a result, projects disappear because developers
    no longer want to work. Unlike wiringPi, Pigpio takes some time to learn the version.
    I have stumbled across Python developers that never ported it to Python. To make
    matters work, you also need a plethora of documentation that no longer works.
    Especially for beginners, for whom the Raspberry Pi is first, the outdated version
    often causes people to drop the small computer. Another phenomenon relates to
    developers who use a library or tool and simply leave it orphaned.


    ## Pigpio


    Unlike wiringPi, Pigpio lets you access the GPIO of the Raspberry Pi. However,
    you need to be aware of some differences. The first thing about Pigpio is that
    it requires a daemon to work. On one hand, the daemon consumes a bit of Raspberry
    Pi resources. On the other hand, it has some advantages—both wiringPi and Pigpio
    are based on C. Similar to wiringPi, Pigpio uses BCM pin designations (Figure
    1), although not necessarily. To get back to work wrappers for Java, Node.js,
    Ruby, and others help integrate the library into different programming languages.
    The complete documentation of the library with many examples is found on the project
    [2].


    ```

    $ sudo systemctl start pigpio

    $ systemctl stop pigpio

    $ systemctl enable pigpio

    ```


    The pigpio utility is a simple tool to access the GPIO through the daemon. Simple
    functions like the daemon can be accessed, and you can also access I2C, SPI, and
    UART. Myriad parameters let it address all the GPIO pins. The pigpio list shows
    some sample commands that illustrate how it works in principle. An overview with
    all parameters can be found on the project. The daemon expects a number of parameters
    at startup. An overview, a description can be found on the home page [3]. To change
    the parameters of the daemon permanently, make the appropriate changes in the
    system unit file (/etc/systemd/system/pigpio.service). The most common change
    needed is in the line that defines the remote socket interface:


    ## Installation


    Pigpio installs to Raspberry OS with the commands:


    ```

    $ sudo apt update

    $ sudo apt upgrade

    $ sudo apt install pigpio

    ```


    ## PCM


    Among the many possibilities offered by pigpio, notes the mapping of GPIO10-GPIO19
    and function for to read the status of the GPIOs, pigpio uses the tool (a Raspberry
    Pi oscilloscope) which connects directly to the GPIO pins and detects if any output
    lines are already connected. With this you can conveniently debug projects that
