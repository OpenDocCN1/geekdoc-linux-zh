    ## LibreOffice Macros with ScriptForge


    ## Getting Started


    In this article, I focus on how to get started using ScriptForge by showing how
    to load and run, as a user-specific macro and as a generic (document-specific)
    ScriptForge-based code without macros because that is the most complicated case
    to set up.


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_39_0.png)


    very powerful programming environments: LibreCalc''s number processing and charting
    capabilities by Python''s countless libraries and features. Sure, fetching a cell
    to edit is not as direct, but it shows how simple reading and writing spreadsheets
    is with ScriptForge (lines 5-7). Instead of an interpreter in line 6, you can
    use Python as shown in line 8 that assigns value to variable fetched from the
    web that you can call with time.


    data structures, manages files, and locale handling issues. The associated libraries
    are divided into three groups, which handle the contents of LibreOffice files
    (documents), user dialogs, spreadsheets, and databases. Databases can access inside
    LibreOffice files or external ones, reading and writing records with SQL queries.


    You can write these macros using the ScriptForge library. Once you become familiar
    with these macros, you can use them to move data back and forth between a document
    (e.g., a sheet) and Python data structures for more sophisticated processing.


    Consider the ScriptForge-based code shown in the example below, which is a macro
    that reads headers from the current document content and inserts them as an argument.


    ## Running ScriptForge


    I will now show how LibreOffice recognizes and run the code in List 1, as a user-specific
    script and as an enabled one. For a user-specific script, you should open your
    preferred editor, copy the code


    ## List 1: Sample ScriptForge


    ```

    01 from script import createScriptService

    02 doc = createScriptService("Calc")

    03 # get the current document

    04 def increment_cell(args=None):

    05 value = doc.getValue("A1")

    06 value += 1

    07 doc.SetValue("A1", value)

    08 g_exportedScripts = (increment_cell, )

    09 from scriptforge import createScriptService

    10 bas = createScriptService("Basic")

    11 bas.MsgBox("Hello!")

    ```


    This lines does alone because the script must use the ScriptForge library and
    load from these libraries the specific methods needed to access LibreOffice cells
    and databases.


    Lines 4 to 7 define a function (increment(cell)) that copies the current content
    of Cell A in a Python variable, then copies the result back into the same spreadsheet.
    Line 9 shows how to actually call that function.


    The part imports the ScriptForge library that handles dialog boxes and creates
    one with "Hello" message. The simple code in List 1 should be high enough to show
    ScriptForge library''s real nature and the roads ScriptForge opens up for its
    users. List 1 demonstrates a simple-to bridge between two


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_39_1.png)


    | Macro Name | increment_cell |

    |---|---|

    | My Macros | |

    | Standard | |

    | WiFiEditor | |

    | apps.so | |


    Figure 5: The internal organization of the ScriptForge library.


    Figure 6: Once installed properly, user-specific Python scripts can run just like
    ordinary macros.


    Select the cell that contains the macro. Then select the embedded script of the
    current file and then go to Menu | Create macro. After naming the macro, you can
    select it and click on Menu | Edit to open a text editor and code directly from
    it, using APSO or Python to test your work.


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_40_0.png)


    ## Conclusion


    Automating LibreOffice is less complicated than first seems with ScriptForge and
    Python. However, this touches on the basics. If you want to learn more about the
    power of Python and ScriptForge in scripts, visit LibreOffice.org [5]. If you
    are interested in the internal architecture, check the ScriptForge presentation
    at the 2020 LibreOffice conference [8].


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_40_1.png)


    Figure 7: With APSO, the user-defined script first seen in Figure 6 is embedded
    inside LibreOffice documents with a few clicks.


    Figure 8: With APSO, the user-specific macro first seen in Figure 6 is embedded
    inside the current spreadsheet.


    From List 1 to the new file, save the file as,, join your local LibreOffice script
    folders, which is found at $HOME/.libreoffice/user/scripts/


    Embedded (in document) you can also export the macro from this macro. You may
    use the interface to export an embedded macro from a file.


    When you go to Tools | Macros | Run Macro..., you will see the list of Macros
    of your local LibreOffice macro manager and click on increment_cell to execute
    the script (Figure 6).


    As you can see here the macro was embedded, the LibreOffice UI feels by default
    like a just a ZIP archive. If you select the script List 1 include a spreadsheet
    test, save the file as tif, join your, it will obtain (other things) a new spreadsheet
    folder whose contents will be contained in the code from List 1.


    This script will be a local-specific macro, available on every spreadsheet using
    LibreOffice with your account on matter. To make this a script-specific macro,
    you need to embed the macro into the spreadsheet so other users can easily find
    and run the macro (if they have ScriptForge, or) in that spreadsheet, more work
