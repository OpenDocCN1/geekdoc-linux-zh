    # IN-DEPTH Line Command – Bash History


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_33_0.png)


    Enhancing efficiency with history


    ## Don’t Know Much About History


    The versatile bash command can save you time and effort at the command line. By
    Bruce Byfield


    ### Environmental Variables

    The history command has several environmental variables. All are added or modified
    in your home directory, depending on the distribution. The size of the history
    file is limited by HISTSIZE, which sets the number of entries in the history,
    and by HISTFILESIZE, the maximum memory allowed for the history. Both have similar
    structures.


    > If you work in a terminal, you likely used Bash''s history command to save yourself
    the trouble of retrying a command [1]. If you''re like most people, your use of
    history may have been confined to scrolling through the list of previous commands.
    If you are interested in the most recently used commands, the arrow keys may help
    you. However, the history command is capable of doing much more and in an economical
    way—especially if you have a good memory. You can start adjusting history''s settings
    and learn how to manage history for easier searching and replaying using three
    types of editing options: event descriptors, word designers and modifiers. The
    flexibility of all three can make the bash history for you to save time and effort.


    ### Author

    Bruce Byfield is a computer journalist and a freelance writer and editor specializing
    in open source. In his various projects, he teaches live and e-learning courses.
    In spare time, Bruce writes about Northwest Coast (http://brucebyfield.wordpress.com/)
    and is the founder of Reminder Pieces, a blog about little writing and fantasy
    at https://remindpieces.com/


    When the maximum for entries is reached, earlier are deleted and replaced by new
    ones. Many users first try to use a high number, such as 10,000 entries. Because
    the history is a file, there should be no problem with how you space the history
    file.


    ```

    HISTSIZE

    HISTFILESIZE

    ```


    ```

    90 visudo

    91 apt install sudo

    92 curl -fsSL https://raw.githubusercontent.com/Homebrew/HEAD/install.sh

    93 test -d /home/linux/.brew && eval "$($(brew --prefix)/bin/brew.sh)"

    94 test -d /home/linux/.brew && eval "$($(brew --prefix)/bin/brew.sh)"

    95 test -r ~/.bash_profile && echo "eval "$($(brew --prefix)/bin/brew.sh)"" >>
    ~/.bash_profile

    96 echo "eval "$($(brew --prefix)/bin/brew.sh)"" >> ~/.zshrc

    ```


    Figure 1: An example from the default history command.


    ## Command Line – Bash


