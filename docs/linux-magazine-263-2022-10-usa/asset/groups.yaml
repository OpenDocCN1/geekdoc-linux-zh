    Watch replacement


    ### Viddy


    There can''t be too many alternatives to the watch command. It''s a brilliant
    little tool that is typically used to run a command at an interval or to monitor
    any activity changing. You might use it to check the temperature of, for example,
    or the amount of free memory you have. It''s a little tool for building simple
    scripts to monitor changes or errors. What it lacks, however, is dynamic output,
    and this is exactly what Viddy attempts to address. Viddy is named after a famous
    quote in A Clockwork Orange (which was inspired by Virgil, the Latin word for
    “saw”), and it performs exactly the same function as watch with some modern augmentation.


    The most useful of these enhancements is a diff mode to highlight exactly what
    your output has changed. Very useful on more complicated commands because they
    are immediately colored in yellow, letting you see which values are new. If you
    miss the moment when a value changes, another Viddy feature will let you roll
    back the output to command history so you can see what changed and when. All can
    be controlled with Vim-like bindings, which can be edited, and in full color,
    which can also be configured to your own taste.


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_85_0.png)


    Viddy can be used to track changes and even monitor activity. The output is pageable
    so you can easily scroll up or down through large volumes of output, and you can
    suspend and resume whatever you''re running. The resulting upgrades are likely
    to make Viddy a more common occurrence in your history, and the perfect tool for
    any monitoring and data logging jobs.


    ## Project Website


    https://github.com/sachos/viddy


    ### Process launcher


    Many of us are surely accustomed to using commands to separate and run multiple
    commands at once, using the old nohup syntax to fork tasks into the background,
    quite apart from task management offered by the terminal environment. Managing
    this is an easier feat. What proc provides is the same functionality but allows
    you to be presented with a tmux-like interface with the list of commands as tabs
    and the selected command''s output on the right.


    The UP and DOWN words are used to show whether a command is running, and you can
    switch between commands with the cursor or Vim-like navigation. A variety of choices
    allows you to focus on the output of any process, letting you interact with it
    or change the order of it. The interface displayed at the bottom of the main panel
    also has keys to help you start, stop, and restart a process, and it''s easier
    to manage multiple commands from proc than to remember the secret key.


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_85_1.png)


    Proc is like tmux for repeatable sets of commands you want to control. For your
    terminal manager, if you have a complex setup you need to recreate, proc handles
    this. In an even more advanced feature proc works remotely via TCP connection.
    With this enabled, you can control whatever is running on a server with a local
    version of the same interface. It works brilliantly and is a genuine alternative
    to the more complex and overengineered tmux.


    ## Project Website


    https://github.com/volok/proc


    ## Emulator configuration


    ### EmuDeck


    One of the best things to come from Valve''s Deck is the early scrutiny and wave
    of Linux newcomers. Thanks to Steam Deck running on Arch with a touch-enabled
    KDE Plasma setup, more people than ever are using the Discover center to install
    new applications. And when they do, these new users are enough around the common
    forum when someone finds a solution, it can be shared with a reasonable degree
    of confidence. It was the same popularity that helped Steam Exchange changes via
    the forum posts, and sustains Ubuntu to this day.


    EmuDeck is one project born from Steam''s new popularity. It helps new users navigate
    the horrendously complex world of multiform emulation and does this by asking
    a few simple questions. At its heart, EmuDeck is a complex-class script that starts
    the installation of RetroArch and whatever emulators you wish to install, configuring
    them library, and building a working configuration to add games to Steam. It will
    even add shaders, artworks, fixed aspect ratios, and game bezels, making emulated
    games fit side-by-side with your native Steam games. If you need more control
    over these elements is configured.


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_86_0.png)


    While EmuDeck was created to solve a Steam Deck issue, the developers plan to
    join the project to Android and other devices too. Expert mode might ask you more
    questions and let you run each stage independently. It''s useful for changing
    something about your already-working configuration, or for updating emulated executables,
    especially the versions you have installed. But the whole project comes together
    brilliantly and has dozens of contributors helping with configuration files, making
    EmuDeck probably the best emulation platform ever created.


    ## Project Website


    https://www.emudeck.com


    ## Game Manager


    ### Steam ROM Manager


    Of the final steps in EmuDeck emulator setup is configure and run Steam ROM Manager
