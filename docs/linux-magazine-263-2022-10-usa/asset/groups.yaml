- md: "\n## IN-DEPTH\nOliveTin and Script Server\n\n![](img/6816acb85ab93ecedbe75e6e9cb5d00d_45_0.png)\n\
    \n## A web user interface for Bash scripts\n\n### Masquerade\n\nA user-friendly\
    \ end for your Bash scripts without writing a line of HTML, CSS, or JavaScript.\
    \ By Ankur Kumar\n\nListing 1 in Listing 1 and then execute the following command\
    \ in your terminal:\n\n```bash\ndocker run -d --rm \\\n-v [PWD]/config.yaml:/etc/OliveTin/config.yaml\
    \ \\\n-v /var/run/docker.sock:/var/run/docker.sock \\\n-p 5137:5137 jamered/olivetin\n\
    ```\n\nWhile Bash scripts are the glue that holds the GNU/Linux back end together,\
    \ making these scripts more user-friendly for users. In the last decade, web user\
    \ interfaces (UIs) have become the front end of daily automation. However, using\
    \ HTML, CSS, and more, OliveTin and Script Server allows you to create a web UI\
    \ for your scripts without writing a single line of HTML, JavaScript (and its\
    \ web libraries). In this article, I will show how to create a simple web UI to\
    \ manage your scripts with OliveTin, followed by a more feature-rich interface\
    \ script.\n\nprogramming driven by a YAML configuration. You just create a simple\
    \ declaration, feed it to OliveTin, and it pops a web page that functions as an\
    \ interface for the shell commands available on your system. Instead of memorizing\
    \ and typing the actual commands, OliveTin automates your daily tasks with a user-friendly\
    \ benefit. By its simplicity, OliveTin lets you open your internal network to\
    \ non-technical users.\n\nOnce the command is executed successfully, go to localhost:5137\
    \ to access the web interface shown in Figure 1.\n\nOliveTin is distributed as\
    \ a Golang binary so you do not need to install it. Just grab the proper binary\
    \ for your architecture, and you can execute it in any location. Because OliveTin\
    \ is a single binary, you can run multiple distributions out of the box. If you\
    \ are running native commands, you can also install OliveTin as a service using\
    \ specific packages.\n\n### Listing 1: config yaml\n\n```yaml\nactions:\n  - title:\
    \ \"Hello Docker!\"\n    icon: \"image\"\n    url: \"https://www.github.com/uploads/9/9/94a7ef/where-you-re-inside-the-shell.jpg\"\
    \n    width: \"100px\"\n    shell: \"sleep 6 && echo 'HELLO!'\"\n    timeout:\
    \ 10\n  - title: \"Nuke Dangling Images\"\n    shell: \"docker image prune -f\"\
    \n    icon: \"image\"\n    timeout: 10\n    arguments:\n      - name: count\n\
    \        type: int\n      - name: address\n        type: string\n```\n\nOliveTin\
    \ allows you to define predefined commands for your users to access. The OliveTin\
    \ interface consists of various buttons to use shell commands. OliveTin declares\
