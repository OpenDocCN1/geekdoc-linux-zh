    \n# Layers\n\nhe BSP consists of different layers, each with its own repository.\
    \ An SoM vendor provides third parties to the BSP in the XML format, which is\
    \ then parsed by manifest and lists the repository for each layer. An example\
    \ is shown here for the Digi System on Module (SoM).\n\nhe file from three Android\
    \ BSPs is shown. It is created and maintained by a master configuration organization.\
    \ For example, the definitions dectos and repositories managed by \"The Yocto\
    \ Project.\" The recipe acts as the foundation for the entire BSP, providing things\
    \ like the BitBake tool built by Yocto and the OpenEmbedded project, as well as\
    \ reference implementations upon which layers lie.\n\nn this case we can see that\
    \ Frecale is also a part of the Yocto layer, although you would expect it to be\
    \ in a repository that manages Frecale/NXP. Because of the popularity and frequency\
    \ of Frecale CPUs, the Yocto has adopted this layer. However, there is also a\
    \ repository provided by NXP, and named NXP, which contains the meta-ti layer.\
    \ This layer contains configurations, resources, and applications for the iMX\
    \ CPUs manufactured by NXP.\n\nou may also find layers managed by Digi, the producer\
    \ of the SoM, such as meta-digi and meta-ti-q15. Finally, you can see that Digi\
    \ also includes other repositories in the reference BSP, for example, q75 and\
    \ swup, which eventually leads to layers named meta-q75 and meta-swupate. Digi\
    \ adds these to the BSP to allow it to include hardware resources, services, and\
    \ applications that originate\n\nrom the organizations that manage these repositories.\
    \ Figure 4 shows the structure of the individual layers.\n\nach layer contains\
    \ a configuration directory name. This directory in turn contains at least one\
    \ configuration file that tells the Yocto framework how to handle the recipes\
    \ brought by the layer and the Yocto version which is compatible. In addition,\
    \ there may be other files that further contain configuration options for hardware.\n\
    \nach layer includes sets of recipes. A recipe consists of instructions for the\
    \ make-style build tool BitBake to help build a particular package. This package\
    \ can contain the application, its dependencies or the Linux image. The result\
    \ is a single file that can be deployed to the target root filesystem.\n\n![](img/6816acb85ab93ecedbe75e6e9cb5d00d_17_0.png)\n\
    \nFigure 4:** The structure of a typical layer: In addition to a configuration\
    \ file, it contains recipes itemized for the BitBake tool.\n\n18 OCTOBER 2022\
    \ ISSUE 266 LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM"
