    # Yocto STORY


    The hello-world.bb file must be simply formatted; Listing 5 shows the contents.
    The first four lines describe the recipe and its license. If this is licensed
    under the GPL, the checksum must be specified. If you do not want to publish the
    recipe under a free license, you may choose the value GLOSE in the file.


    The SRC_URI in Listing 5 tells Bitbake to find the files associated with the recipe.
    In this example, the only file is a single file. You can also specify complete
    reports that are managed by Git or subdivision.


    The end of the recipe contains two more functions (Lines 7 and 10) that compile
    the file of the application and install the results. The Yocto framework comes
    with basic versions of the entities, which the user can then overwrite. The framework
    also contains templates for other used functions, such as down-


    # Listing 4: Directory Structure


    ```

    meta-custom

    |-- apps

    |   |-- files

    |   |-- hello-world

    |   |-- hello-world.bb

    ```


    The actual application is a very simple C file (Listing 6). To create the recipe,
    just use the short bitbake hello-world command.


    # Listing 5: hello-world.bb


    ```

    01 DESCRIPTION = "Simple World Application"

    02 SECTION = "examples"

    03 LICENSE = "GPL"

    04 LIC_FILES = "file://${COMMON_LICENSE_DIR}/MIT"

    05 SRC_URI = "file://${WORKDIR}/hello-world.c"

    06 S = "${WORKDIR}"

    07 do_compile() {

    08 $(CC) -c hello-world.c -o hello-world

    09 }

    10 do_install() {

    11 install -d $(D)${bindir}

    12 install -o OTSS hello-world $(D)${bindir}

    13 }

    ```


    For the local device to build the "Hello, World", you need to add it to the final
    image. So, the bitbake-image command has told Bitbake to build the image from
    the dage-image-qt recipe. You must add the append file that creates the hello-world.bb
    recipe with the contents in Listing 7.


    If you now call bitbake-image-qt, the "Hello, World" will be created and placed
    in the final image, which you can now load onto the oft device.


    # Conclusions


    If you need to adapt an operating system to an embedded device, and you want to
    use Linux, the Yocto project will give you a head start starting with the tools.
    The tools, layers, and recipes of the Yocto project will save you time and simplify
    the task of adapting Linux to the hardware. Innovative frameworks also exist,
    for example, Buildroot [3], which you will read about later in this issue. The
    advantage of Yocto is that it is very popular among SoM vendors and becomes the
    predominant framework for Linux. The disadvantage: it requires significantly more
    resources than Buildroot.


    # Listing 6: hello-world.c


    ```

    #include <stdio.h>


    int main() {


    printf("Hello, World!\n");


    }

    ```


    # Listing 7: Append file


    ```

    IMAGE_INSTALL_append += " hello-world"

    ```


