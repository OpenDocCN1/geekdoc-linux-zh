    Inexpensive components for the SPI interface let you upgrade a Raspry Pi 4 to
    a display system for zero-contact RFID-based data acquisition. *By Martin Mohr*


    radio-frequency identification (RFID) tags have become dispensable in industry
    and government, as well as wholesale and retail spaces. The inexpensive chips
    can be found on clothing labels, identification cards, and credit cards. With
    a Raspberry Pi and an RFID kit, you can read the data from these chips and view
    it on a display.

    In this project, I read serial numbers from RFID tags stuck on 3D-printed pumpkins
    - a slightly different kind of detection task. To do this, I connect an RC522
    [1] RFID kit and a 1.8-inch


    ST7735 serial peripheral interface (SPI) thin-film transistor (TFT) display [2]
    to the Raspberry Pi 4. The two modules could cost less than $15 (€14) in online
    stores. The pumpkins contain simple RFID tags [3], also available for free. And
    the project seems clear-cut and easy as if it would work right away, except the
    "Mishaps, Misfortunes, and Breakdowns" to find out what can go wrong.

    The circuit in Figure 1 shows how the modules connect to the Raspberry-Pi, along
    with two pumpkins and LEDs for testing purposes. The


    # Mishaps, Misfortunes, and Breakdowns


    After some brief research, I discovered libraries which I was going to use control
    the modules. After a day of wondering and programming, it turned out that the
    library for the RFID reader had been maintained for several years. The only way
    to get it in Python 3 was to make code changes. In open source projects, you should
    always take a look at the date of the last commit, and the issues, which will
    inform you whether the project is still developed by the community.

    I have stumbled across many pieces of orphaned software on the web. At first sight,
    they might still see an


    tive, but they have already been gathering dust for years. The very popular Raspberry
    Pi tool has not seen support for a long time the Python article has been removed
    from the Raspberry Pi package sources. However, the Internet forgets, which means
    users are tripped up over outdated manuals and how-to.

    Unfortunately, it seems like low level Python libraries have been hastily hot-wired
    without extensive testing, which results in incompatibilities. For example, I
    had to replace the reader and display programs in this project.'
