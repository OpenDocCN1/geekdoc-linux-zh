    \ Online\n- 10 Firefox Adds-Long Anticipated Feature\n  - System76 Oryx Pro Refreshed\
    \ with a New CPU\n\n# Kali Linux 2022.3 Released\n\nKali Linux has been one of\
    \ the most widely-used penetration Linux distributions on the market. With a vast\
    \ number of preinstalled tools available, security experts and testers can use\
    \ the platform to uncover any vulnerability or weakness on your network.\n\n2022.3\
    \ release has a few new tricks up its sleeve, including a new VirtualBox image\
    \ format, weekly updates, and build scripts (which you can roll or play); New-Hunter\
    \ updates, and new tools which are BruteShark (a network analysis tool), Defectojo\
    \ (an open source application vulnerability and security analysis tool), pspslot\
    \ (a post-exploitation framework), shelfire (a tool for exploiting LFI/RFI and\
    \ command injection vulnerabilities). Another addition to Kali Linux is its new\
    \ Discord server (Kali Linux & Friends) (discord.kali.org) where the community\
    \ can chat in real time about Kali Linux. According to the Kali Linux blog, the\
    \ Discord server is a community server all with common interests. We do not have\
    \ the goal to get as many users as possible, instead we are growing a place for\
    \ each other to help one another. We are focusing on quality not quantity.\n\n\
    Finally, there's also a new Lab Environment, where you can create a test bed to\
    \ learn, practice, and benchmark. To make it easier to build a test lab, the developers\
    \ have packaged DWWA (https://www.kali.org/tools/dwwa/) to practice with some\
    \ of the most common vulnerabilities, and Juice Shop (https://www.kali.org/juice-shop/)\
    \ which encompasses vulnerabilities from the entire OWASP Top Ten.\n\nDownload\
    \ a copy of Kali Linux 2022.3 (https://www.kali.org/get-kali/) and read the official\
    \ release notes (https://www.kali.org/blog/kali-linux-2022-3-release/) to find\
    \ out more.\n\n# 14\" Pinebook Pro Linux Laptop Ships\n\nAfter a lengthy shipping\
    \ delay caused by COVID-19 limitations in China, the ARM-64 Pinebook Pro is available\
    \ from Pine64. The device ships with 64-bit Dual-Core ARM 1.8GHz A72 and Quad-Core\
    \ ARM 1.6GHz A53, with a Quad-Core Mali T-860 GPU, 4GB LPDDR4 dual-channel DRAM,\
    \ and 4GB eMMC storage.\n\nThe Pinebook Pro 14\" audience mostly focuses on those\
    \ who want to experiment with Linux on ARM devices. Pine64 goes so far as to say,\
    \ \"We do not order the Pinebook if you're seeking a substitute for X86 laptop,\
    \ or just curious and you're ordering with an intent to file up a refund/return\
    \ request.\"\n\nThese pre-orders are meant for enthusiasts familiar with the ARM\
    \ architecture and interested in the Pinebook Pro for the upcoming season.\n\n\
    Other specs for the laptop include WiFi 802.11 AC, Bluetooth 5.0, and one USB\
    \ 3.0 and one USB 2.0 type A, one micro card slot (micro SD), headphone jack,\
    \ built-in full-sized (US ANSI) keyboard, touchpad, 9600mAh battery, 4.1 inch\
    \ LCD display and a 2-megapixel front-facing camera.\n\nYou can learn more about\
    \ the Pinebook Pro 14 and purchase yours over the official sale starts at $249.\
    \ (https://www.pinebook.com/product/14-inch-pinebook-pro-laptop-anti-us-keyboard).\
    \ Currently, the Pinebook Pro 14 costs only $219.99, and the company makes zero\
    \ profit from the devices, as the laptops are offered as a community service to\
    \ the Pinebook, Linux, and BSD communities.\n\n# MORE ONLINE\n\n# Linux Magazine\n\
    \nhttp://www.linux-magazine.com\n\n# ADMIN HPC\n\nhttp://www.admin-magazine.com/HPC/\n\
    \n# Sharing a Terminal Over the Web\n\n- Jeff Lawson\n\nThe ability to share a\
    \ terminal over the web could multiply the efficiency of admins and users. The\
    \ t-share tool is a must-try.\n\n# Sharing Terminals\n\n- Jeff Lawson\n- Sometimes\
    \ sharing a screen between two users is notoriously difficult. We look at two\
    \ native sharing tools: screen and tmux\n\n# ADMIN Online\n\nhttp://www.admin-magazine.com/\n\
    \n# Load testing with Linux\n\n- Matthias Wiebling\n- The Linux load test assesses\
    \ the resilience of your infrastructure to help determine whether it can withstand\
    \ a flood of requests.\n\n# Remote maintenance and automation with RPi\n\n- Thorsten\
    \ Kramms\n- Firewalls and network address translation stand in the way of access\
    \ to remote systems, but the free software tools supports maintaining and managing\
    \ them locally, and from home.\n\n# Comparing startup distributions of Linux in\
    \ the cloud\n\n- Federico Luciici\n- A cloud test puts Linux distributions against\
    \ one another.\n\n# OpenMandrix lx ROOME Technical Preview\n\nOnce a time, I hung\
    \ out with the Mandrix team at a Linux convention. That back in the late 1990s,\
    \ things changed a bit since. Mandrix ceased being developed in 2011. Recently,\
    \ the Mandrix developers announced the latest technical preview of ROOME, which\
    \ is a rolling release on the open source system.\n\nOne thing that the devs have\
    \ switched off the auto-update for ROOME because they've made major changes to\
    \ tools. So, for those who want to see what's coming up for OpenMandrix, the preview\
    \ is now available.\n\nThe biggest changes to OpenMandrix ROOME include Python\
    \ 3.11, Java 20, Kernel is 5.18 (a Clang-based kernel), the KDE software (Plasma\
    \ 5.23.3), /usr merge (a major change for the Linux filesystem), Btrfs and XFS\
    \ have been supported, and both are now available.\n\nDownload a copy of the ROOME\
    \ build from SourceForge (https://sourceforge.org/projects/openmandrix/releases/5.0/Technical-preview/)\
    \ and also read this OpenMandrix blog post (https://www.openmandrix.org/news/article/openmandrix-lx-rolling-technical-preview/)\
