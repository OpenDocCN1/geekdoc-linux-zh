    ## Modifiers


    Modifiers edit entry history, allowing it to be removed. Some simply remove the
    entry you want. For instance, h removes everything that comes after the modifier,
    such as `-h head/user/music/musicogs` from the history. Similarly, using `/w /home/user/music`
    would delete `/home/user/music` from the history. Similarly, using `r .odt` would
    extend the extension of a file name from .c to .odt. With `p`, the command would
    only display without being executed, which could be hard if you are not exactly
    which history entry you want to delete or check.


    The environmental variable HISTTIMEFORMAT adds a timestamp to the history. In
    its simplest form, `!` shows the last command. However, you can use `!` to call
    a previous command. For example, `!!` repeats the last command, `!word` repeats
    the last command starting with word, and `!string` repeats the last command containing
    string. Using `^` replaces the last argument of the command with a new one, and
    `: ` replaces the last argument with an empty string. Clearing and modifiers also
    make it easier to use. The HISTCONTROL variable can control how history is saved.
    For example, `HISTCONTROL=ignoredu` will ignore duplicates for the duration of
    the session.


    ### Event Descriptors


    Event descriptors allow you to manipulate the history using specific patterns.
    For instance, `h` removes everything that comes after the modifier, such as `-h
    head/user/music/musicogs` from the history. Similarly, using `/w /home/user/music`
    would delete `/home/user/music` from the history. Similarly, using `r .odt` would
    extend the extension of a file name from .c to .odt. With `p`, which could be
    hard if you are not exactly which history entry you want to delete or check.


    The flexibility of all three can make the bash history for you to save time and
    effort.


