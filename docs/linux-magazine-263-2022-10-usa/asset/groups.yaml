    # Disinformation Detector


    ## Techniques


    Many of the extensions for finding fake content use certain artificial intelligence
    methods. For example, certain phrases, such as "opinion" or "I think", are already
    clear about the content''s objectivity. These browser extensions also use databases
    to compare and analytically check their truthfulness.


    In fact, on other social networks, the add-ons can also be used to sort comments
