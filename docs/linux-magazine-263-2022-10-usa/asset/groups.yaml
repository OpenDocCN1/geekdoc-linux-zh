    # Build an IoT Linux


    The most amazing thing about Linux is its flexibility. Linux systems run on the
    biggest computers in the world – and on many of the diminutive devices that populate
    your home environment. If you''ve always wondered how developers adapt to run
    on tiny tech, you''ll appreciate this month’s stories on Buildroot and the Yocto
    project.


    # LINUSVOICE


    +   69 Welcome

    This month in Linux Voice.


    +   71 Doghouse – Algorithms and Books

