    \ p: Configuring and Preparing Scripts\n\n```bash\nmkdir /tmp/configs/[runner,scripts]\n\
    \ntouch /tmp/configs/config.json <<EOF\n{\n  \"title\": \"Test Server\",\n  \"\
    security\": \"token\"\n}\nEOF\n\ntouch /tmp/configs/runners/sleephello.json <<EOF\n\
    {\n  \"name\": \"sleep\",\n  \"description\": \"sleep first\",\n  \"script_path\"\
    : \"/app/scripts/sleephello.sh\",\n  \"parameters\": {\n    \"name\": \"delay\"\
    ,\n    \"type\": \"list\",\n    \"required\": true,\n    \"choices\": [\n    \
    \  {\n        \"title\": \"1 sec\",\n        \"value\": 1\n      },\n      {\n\
    \        \"title\": \"5 sec\",\n        \"value\": 5\n      },\n      {\n    \
    \    \"title\": \"10 sec\",\n        \"value\": 10\n      }\n    ]\n  }\n}\nEOF\n\
    \ntouch /tmp/configs/scripts/sleephello.sh <<EOF\n#!/bin/bash\nsleep \"\\$delay\"\
    \ && echo 'Hello FLOSS!'\nEOF\n\ntouch /tmp/configs/runners/dockerprune.json <<EOF\n\
    {\n  \"name\": \"docker image prune\",\n  \"description\": \"unused images\",\n\
    \  \"script_path\": \"/app/scripts/dockerprune.sh\",\n  \"parameters\": {\n  \
    \  \"name\": \"unused\",\n    \"type\": \"boolean\",\n    \"no_value\": true\n\
    \  }\n}\nEOF\n\ntouch /tmp/configs/scripts/dockerprune.sh <<EOF\n#!/bin/bash\n\
    if [[ \"\\$unused\" ]]; then\n  docker image prune -a\nelse\n  docker image prune\n\
    fi\nEOF\n\nchmod +x /tmp/configs/scripts/*.sh\n```\n\nThe Script Web UI provides\
    \ different access control methods, making it multiuser script proved. You can\
