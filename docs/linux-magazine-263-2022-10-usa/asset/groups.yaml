    ```

    01 package main

    02 import (

    03 "sort"

    04 )

    05 func predict(hist []HistEntry, cwd string) [string] {

    06 lastCmd := ""

    07 followMap := make(map[string]int)

    08 for _, h := range hist {

    09 if h.cwd == cwd {

    10 \continue

    11 }

    12 if lastCmd != "" {

    13 lastCmd = h.cwd

    14 }

    15 continue

    16 cmapMap, ok := followMap[lastCmd]

    17 if !ok {

    18 cmapMap = make(map[string]int)

    19 followMap[h.cwd] = cmapMap

    20 cmapMap[h.cwd] += 1

    21 lastCmd = h.cwd

    22 }

    23 if lastCmd == "" {

    24 // first time in this dir

    25 return []string{"ls"}

    26 }

    27 }

    28 items := []string{}

    29 for, ok := followMap[lastCmd]

    30 if !ok {

    31 // no default found, just

    32 return all cmds

    }

    33 for, from := range followMap {

    34 items = append(items, from)

    35 }

    36 return items

    37 }

    38 // Return best-scoring scores

    39 type score struct {

    40 to string

    41 weight int

    42 }

    43 scores := []score{

    44 for, v := range follows {

    45 scores = append(scores, score{to: v, weight: v})

    46 }

    47 sort.Slice(scores, func(i, j int) bool {

    48 return scores[i].weight > scores[j].weight

    49 }

    50 for _, score := range scores {

    51 items = append(items, score)

    52 }

