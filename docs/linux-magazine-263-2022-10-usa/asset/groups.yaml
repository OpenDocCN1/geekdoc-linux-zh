    \n## 编辑观点\n欢迎\n\n# 感知与情感\n\n亲爱的读者：\n\n我觉得我们在今年早些时候就进入了一个新时代，当时 Google 科学家布莱克·莫因（Blake\
    \ Lemoine）宣布他认为 Google 的 LaMDA 人工智能具有“感知能力”，并且公司在允许对其研究之前可能应该征求 LaMDA 的同意。本月的消息是\
    \ Google 辞雇了莫因。给出的理由是他违反了保密协议，但很少观察者察觉到这次终止仅仅是为了记录该主张运动以及随而来的争议。\n\n计算机科学家们现在正在加班，试图创建行为上像是有意识的系统，以便人类想要以“自然”的方式来培养它们。换句话说，这些系统将操纵我们。\n\
