    # # Don’t Know Much About History


    The versatile bash command can save you time and effort at the command line. By
    Bruce Byfield


    Environmental Variables

    The history command has several environmental variables. All are added or modified
    in your home directory, depending on the distribution. The size of the history
    file is limited by HISTSIZE, which sets the number of entries in the history,
    and by HISTFILESIZE, the maximum memory allowed for the history. Both have similar
    structures.


    > If you work in a terminal, you likely used Bash''s history command to save yourself
    the trouble of retrying a command [1](Fig). If you''re like most people, your
    use of history may have been confined to scrolling through the list of previous
    commands. If you are interested in the most recently used commands, the arrow
    keys may help you. However, the history command is capable of doing much more
    and in an economical way—especially if you have a good memory. You can start adjusting
    history''s settings and learn how to manage history for easier searching and replaying
    using three types of editing options: event descriptors, word designers and modifiers.
    The flexibility of all three can make the bash history for you to save time and
    effort.


