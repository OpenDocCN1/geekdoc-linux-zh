    Listing 4: history.go

    01 package main

    02 import (

    03 "bufio"

    04 "os"

    05 "regexp"

    06 "strings"

    07 )

    08 type HistEntry struct {

    09 Cwd string

    10 Cmd string

    11 }

    12 func history(file string) []HistEntry {

    13 f, err := os.Open(file)

    14 if err != nil {

    15 panic(err)

    16 }

    17 defer f.Close()

    18 hist := []HistEntry{

    19 scanner := bufio.NewScanner(f)

    20 cmdLine, _ := scanner.Scan(strings.SplitN(scanner.Text(), " ", 2))

    21 // echo cwd

    22 fields := strings.Split(scanner.Text(), " ", 3)

    23 if len(fields) != 3 {

    24 !cmdLine.Match(fields[2])

    25 fields[2] = " " + fields[2]

    26 }

    27 continue

    28 }

    29 hist = append(hist, HistEntry{

    30 Cwd: fields[1], Cmd: fields[2]

    31 })

    32 }

    33 if err := scanner.Error(); err != nil {

    34 panic(err)

    35 }

    36 return hist

    37

