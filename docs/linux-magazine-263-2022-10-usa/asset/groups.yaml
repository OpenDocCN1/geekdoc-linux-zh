    "That''s why I say ''DETEST'' stupid BUG_ON() cases - they will often become problematic
    with nasty locks resulting in a completely undeveloped thing that never gets reported.


    "Yes, you can be careful and only use BUG_ON() in places where recovery is possible.
    But even then, they have no advantages over just a WARN_ON_ONCE."


