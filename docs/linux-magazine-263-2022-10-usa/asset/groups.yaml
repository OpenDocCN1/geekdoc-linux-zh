  - '[PAGE 94]


    # LINUX NEWSSTAND


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with advanced technical articles and tutorials you won''t find anywhere else.
    Explore our full catalog of back issues for specific topics or to complete your
    collection.


    Order online: https://bit.ly/Linux-Newsstand


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_94_0.png)


    #262/September 2022


    # Beyond 5G


    Behind the scenes, the cell phone network has always been the preserve of highly
    specialized and proprietary equipment, but some recent innovations could be changing
    this. We explore the Open RAN specification, which could allow one day more of
    the mobile network to operate on off-shelf hardware.


    On the DVD: openSUSE Leap 15.4 and MX Linux 21.1


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_94_1.png)


    #261/August 2022


    # USB Boot


    Live boot was an exciting idea 15 years ago – just carry a CD and you boot from
    anywhere. But old-style boot CDs had some limitations. Today''s USB boot tools
    solve problems plus a feature that no one even thought about: access to server
    boot on a single stick.


    On the DVD: Linux MATE 20.3 and FreeBSD 13.1


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_94_2.png)


    #260/June 2022


    # Privacy


    If you are really anxious about privacy, you''ll need to learn more than your
    browser''s tracking blocking. Those you need anonymity to depend on the Tor network
    - a global project offering safe surfing in surveillance states. We also look
    at Postmaster, an application with some useful privacy features.


    On the DVD: Ubuntu 22.04 and Fedora Workstation 36


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_94_3.png)


    #258/May 2022


    # Zero Trust


    Twenty years ago, everyone thought a gateway firewall was all you needed to stay
    safe from intruders, but recent history has a different story. Today, the best
    advice is: Don''t trust anyone. Your internal network could be just as dangerous
    as the Internet.


    On the DVD: Zorin OS 16.1 Core and Super GRUB2 Disk


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_94_4.png)


    #257/April 2022


    # Encryption


    Most people you know can save energy by switching to more efficient light bulbs,
    but did you know you can save energy with more efficient software? This month
    we examine the ongoing efforts to bringing sustainability to the IT industry.


    On the DVD: Linux Mint 20 Cinnamon edition and deepin 20.4


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_94_5.png)


    This month, we survey the state of encryption in Linux. We look beyond the basics
    to explore some of the tools and technologies that underpin the system of security
    and we show what you need to ensure your privacy is airtight.


    On the DVD: Linux Mint 20 Cinnamon edition and deepin 20.4'
