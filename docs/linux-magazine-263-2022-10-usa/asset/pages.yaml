    A look at the history of computer memory and a classic algorithm text. BY JON
    MADDOG HALL


    # Sorting and Searching


    When I started programming in 1969, every mainframe computers from IBM might have
    had only 1MB of main memory and two or three disks measured in megabytes, with
    multiple tape drives that would supplement that storage. Any type of parallelism
    seemed desired the goal of getting the data you needed coming into memory, while
    you also trying to get the data out via "stable storage" or directly to a tape
    drive.


    Some of the first programmers used an operating system called MFT (Multiple Fixed
    Task) which had up to 16 "partitions" in memory, or of a fixed size when the operating
    system was configured.


    What was started by the operators, the Control Job Language (JCL) told the operating
    system how much memory it would take, and it was slotted into a memory slot that
    was large enough to hold it. If the JCL specified too much, meant was wasted.
    Too small and the program might not fit, or even crash.


    Later the operating system changed to Multiprogramming with a Variable of Tasks
    (MVT), which allowed the programmer (who was typically the one who generated the
    JCL) to specify the size of one of possible slots. With MVT it could create several
    unusable holes in the main memory of the system, and when only small memories
    were joined together a large program run, rather a horde of garbage collection.


    If this sounds a bit complex, even in the day of modern computing, I will tell
    you of additional information that the start of these IBM mainframes was meaning
    that any program could only access 24 bits (instead of 32 or 64) 16 bytes of memory
    at that time.


    Each of these machines was incredibly slow, and so incredibly, by today''s standards,
    they were "magic",


    Still, we gave thought to how much memory was needed for each piece of data and
    how much computation would be given to each calculation. Sometimes this worked
    against us in the long run, and some were pretty fussy, as the "YOK"


