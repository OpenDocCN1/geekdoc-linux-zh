    of rolling your own system to use Linux for many embedded projects, Yocto is working
    to change that.


    The Yocto project [1] describes itself as an open source collaboration project
    that helps developers create Linux-based systems for embedded projects, regardless
    of the hardware architecture. The project provides a flexible set of tools that
    enables developers share technologies, software configurations, and best practices
    that can be used to create tailored Linux images for embedded devices [2].


    Since 2009, the Linux community has been evolved through a thorough collaboration
    with the OpenEmbedded project. The Yocto project "... ... combines, validates,
    and maintains three key development elements:


    +   - a set of it tools, such as "tools" for automated building and testing, for
    board support and license compliance, and component for custom Linux-based embedded
    operating systems"


    +   - a reference embedded distribution, which they Pokey

    - the OpenEmbedded build system, which is co-maintained by Yocto and the OpenEmbedded
    project

