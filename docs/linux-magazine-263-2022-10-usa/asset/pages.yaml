    #262/September 2022


    # Beyond 5G


    Behind the scenes, the cell phone network has always been the preserve of highly
    specialized and proprietary equipment, but some recent innovations could be changing
    this. We explore the Open RAN specification, which could allow one day more of
    the mobile network to operate on off-shelf hardware.


    On the DVD: openSUSE Leap 15.4 and MX Linux 21.1


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_94_1.png)


    #261/August 2022


    # USB Boot


    Live boot was an exciting idea 15 years ago – just carry a CD and you boot from
    anywhere. But old-style boot CDs had some limitations. Today''s USB boot tools
    solve problems plus a feature that no one even thought about: access to server
    boot on a single stick.


    On the DVD: Linux MATE 20.3 and FreeBSD 13.1


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_94_2.png)


