    Document manager


    # # Paperless-nx


    We''ve been waiting to go paperless for a couple of decades now (tactile, recyclable
    magazines, but still plenty of pulp persist. This is not so much a problem for
    us as individuals. We can manage the occasional paper piece with a scanner or
    a local NAS and drive for long-term storage. If we''re hoping to forgo some privacy,
    a cloud service can scan and make them searchable. If not, then a self-hosted
    version of Nextcloud is another good option. But none of these scale particularly
    well, and are not specifically made to manage printed documentation over a long
    period of time. It is why Paperless-nx has been built to.


    Paperless-nx, and like its progenitor, runs as a web-accessed server. This is
    important because it means you control how your documents are stored and accessed,
    without the overhead of having to run the background service yourself. Another
    great feature is that it is account and group based, which means different users
    can have their own accounts and manage one or more groups. Each can be added or
    removed to specific sets of documents. Paperless-nx performs character recognition
    on your documents so you can easily search for any text across multiple documents.


    Installation is relatively easy, especially if you choose to follow their method
    and a native Linux method are excellently documented. There are also several ways
    to get a document into Paperless-nx. The most practical is a physical character
    that


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_87_0.png)


    You can either files manually with the web interface, via a scanner, through an
    Android app, or by sending an email.


    can either save to a mutually accessible network location or is connected to your
    server where it can save documents to a shared directory. But there are other
    options, including uploads via the web interface, via an Android app, or by sending
    preconfigured email addresses. There is also an excellent REST API for automating
    the scanning and archiving. Paperless-nx will pick up documents automatically,
    run the process, and then add any tags or correlations it recognizes to the eventual
    data. Only then do your documents become accessible from the web interface.


    Paperless-nx is a document management system for scanned documents that can handle
    a busy paperless office''s work. It''s a respectful fork of a long established
    project


    This is Paperless-nx really shines, because its interface is fast and responsive,
    even when dealing with a large number of documents. One can be opened at the same
    time, and they become small tabs in the left panel, letting go to the dashboard.
    Using an external viewer is a configuration option, and the latest release has
    overhauled the look and feel of the whole experience. The only downside is that
