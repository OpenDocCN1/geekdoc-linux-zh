    Viddy can be used to track changes and even monitor suspicious activity.


    output is pageable so you can easily scroll up or down through large volumes of
    output, and you can suspend and resume whatever you''re running from Viddy. The
    resulting upgrades are likely to make Viddy a more common occurrence in your history,
    and the perfect tool for any hoc monitoring and data logging jobs.


