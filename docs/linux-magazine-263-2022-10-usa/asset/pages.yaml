    # Buildroot


    embedded size, cross-compiling is the only realistic way to compile, the target
    system is far too slow and not have enough memory. Cross-compiling lets you work
    with a different C library (such as mus or uibc) and a different Linux kernel


    variant you are dealing with, which bootloader and kernel options (device tree)
    you need to use, you can easily set up a basic configuration.


    However, cross-compiling presents many challenges. The challenge when dealing
    with Buildroot is to use special options or source code patches. Cross-compiling
    requires a special toolchain consisting of the compiler, linker, and assembler
    for the target system, bootloader, C++ libraries, and other degers. Buildroot
    provides this toolchain and optimizes for the target platform as part of the build
    process. Alternatively, you can load and use an existing toolchain, such as the
    ARM GNU toolchain or Bootlin toolchain.


    Buildroot easily allows it to incorporate non-standard features. For instance,
    you can include a read-only root filesystem with a separate writable kernel, and
    roots updates with A-B switching between partitions, and verifying using a trusted
    root hash. All of this is possible, but it can involve some work in individual
    cases.


    Some projects use Buildroot to build a more managed and flexible distribution.
    Distributions like DahlOS, Recalbox, Batoera, and Home Operating System among
    others. Others are designed for specific use cases and make use of Buildroot''s
    flexibility.


    # Flexibility


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_22_0.png)


    One of the most important features of Buildroot is flexibility. You need to be
    able to make all kinds of tweaks to get the results you require. The distribution
    achieves this through a selection of packages. Buildroot offers several basic
    options for the init system (system, SysVinit, OpenRC) and for many different
    servers. Buildroot uses roots, Mus, and uibc. On top of that, 15 different file
    systems are available. In configuration you can select options like UBIFS for
    NAND flash, the file system option includes embedded-specific varieties like RAM
    disk that is linked to the Linux kernel.


    You can store your configuration in a package file, which can then reference a
    number of other files if they require them. The packages also have their own configuration
    files. If using roots, you then copy a directory (the roots overlay) and run a
    script for are too complicated to save in a configuration file, including file
    permissions and ownership, as well as passwords. You can define these for specific
    items using roots overlays.


    Figure 2 shows configuration files used in an example. Two different variants
    exist, each with a defconfig: bmx_b1 and raspberrypi64. The two variants share
    most of root overlay in the user-defined file, and a build-script that generates
    version and platform information. The board requires different configurations
    for the target, though, and this is why they have their own roots overlays.


    To get started with Buildroot for configurations from around 200 SBCs (Single
    Board Computers) and SoMs (System-on-Module) and for configuration files. These
    are minimal configurations containing a toolchain, a kernel, a bootloader, and
