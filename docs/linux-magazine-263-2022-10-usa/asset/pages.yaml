    Hardware has been a challenge for the Linux community. Although it is possible
    to complete the Linux kernel and its surrounding applications for most any hardware,
    doing so can be complicated. It actually takes significant effort to adapt an
    operating system to a hardware platform. Giant companies such as Microsoft and
    Apple have unlimited resources to work out the details with hardware vendors,
    but Linux has been left largely to those with interest in its development.


    Today developers are in close contact with mega chip vendor, and Linux has plenty
    of room to run on ARM, MIPS, and several other leading hardware platforms. Debian
    supports more 10 architectures, in multiple varieties.


    But what if you''re starting from scratch on a new hardware system? Or if you''re
