    # OS Options


    One key decision in the development of any IoT project concerns the choice of
    operating system. The choice of OS depends on the nature of the project.


    For a bare metal environment, no special operating system is needed. Instead,
    it is up to the developer to build capabilities into the application. Developing
    up for a bare metal environment requires implementing a hardware abstraction layer
    (HAL) that needs the freedom to have access to hardware drivers.


    Other projects require real-time operating system (RTOS), which is always time-critical
    in RTOS environments, and always puts a limit on processing. RTOS systems are
    common in the field of robotics, where the consequences can be catastrophic if
    reaction times are not met. Bare-metal RTOS systems often integrate the operating
    system and application.


    A third category of IoT projects calls for a more operating system such as Linux.
    Using Linux with bare metal or RTOS, the project does not have access to the OS
    source code. The integration, then uses system drivers to access the user services.


    Figure 1 shows the resource consumption of the three alternatives. Bare-metal
    systems have the lower resource requirements, RTOS consumes by far the most resources,
    and it requires a processor that has a Memory Management Unit (MMU). On the other
    hand, Linux as an operating system allows access to a library of ready-made applications
    which that are not available for bare metal and RTOS.


