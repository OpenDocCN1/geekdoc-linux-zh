    # SENTIENCE AND SENSIBILITY


    Dear Reader,


    I feel like we entered a new era earlier this year when Google scientist Blake
    Lemoine declared he thought Google''s LaMDA artificial intelligence is "sentient,"
    and that the company should be probably asking LaMDA''s announcement before permitting
    study it. The news this month is that Google fired Line. The reason stated was
    that he violated a confidentiality agreement, but few observers could sense the
    termination was merely on record stating that the claim movement and the controversy
    followed


    Computer scientists are working overtime right now trying to create systems that
    behave as they are conscious so that humans will want to rear them "naturally."
    In other words, these systems will manipulate us


    We will have two choices:


    +   - Fall for artificial response patterns and emotional cues as if they were
    our friends - in other words, be manipulated.

    - Ignore artificial response patterns and emotional cues, give them every day
    training that entities behave like humans in a hollows and uncanny manner that
    denies their humanity)


    Let me explain, I don''t think this is important because the computer was sentient
    - in fact, I''m sure it wasn''t. I find it strange that we''re talking about it,
    and the way we''re talking about it is quite stranger. Every computer service
    and Google''s company, have no record stating that the claim was preposterous.
    The story wasn''t much as a computer science event, but as a popular phenomenon,
    it pure gold. This was the clear dystopian sci-fi story of a machine with a soul?
    Or is it? (Who, kind of makes you think, don''t you...)


    Neither options particularly applicable to me. Of course, Google, Meta, and the
    other for-profit corporations who are working on these kind of solutions will
    just want to build a better chatbot, but that''s the whole problem with this space:
    we''re not so good at putting genie back into boxes once they get out.


    The odd part was that several leading computer scientists it was important to
    explain, what you think, seriously, the program doesn''t feel the things the way
    we do. For them, they were working perfectly fine in their labs when a press guy
    showed up and turned a TV camera on, but still if we''re approaching this right
    way - and if "is it alive?" is a diversion from the serious questions we would
    be asking.


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_2_0.png)


    Joe

    Editor in Chief


    The term "sentient," - in this case, relates to the state of feelings - rather
    than just knowledge. Many have equated this to a state of consciousness. So this
    debate has migrated from the cold, analytical realm of computer science to the
    fuzzy sphere of metaphysics, where these concepts are quite difficult to define.


    Before you decide whether a computer has consciousness, you have to define what
    consciousness is, and there is a vast range of answers for that, depending on
