    # # Viddy


    Here can''t be too many alternatives to the watch command. It''s a brilliant little
    that is typically used to run a command at an interval or to monitor any activity
    changing. You might use it to check the temperature of, for example, or the amount
    of free memory you have. It''s a little tool for building simple scripts to monitor
    changes or errors. What it lacks, however, is dynamic output, and this is exactly
    what Viddy attempts to address. Viddy is named after a famous quote in A Clockwork
    Orange (which was inspired by Virgil, the Latin word for “saw”), and it performs
    exactly the same function as watch with some modern


    augmentation. The most useful of these enhancements is a diff mode to highlight
    exactly what your output has changed. Very useful on more complicated commands
    because they are immediately colored in yellow, letting you see which values are
    new. If you miss the moment when a value changes, another Viddy feature will let
    you roll back the output to command history so you can see what changed and when.
    All can be controlled with Vim-like bindings, which can be edited, and in full
    color, which can also be configured to your own taste.


