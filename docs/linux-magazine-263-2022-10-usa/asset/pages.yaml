    # Zack’s Kernel News


    # Chasing the Dream


    Liam Howlett, speaking for himself and Matthew Wilcox, recently announced the
    include of Maple Tree in Linux. And Andrew Morton asked for a nice explanation
    of what the Maple Tree was. So, despite whatever lovely scene you might have imagined
    next, Liam said, "the maple tree is an RCU-safe range B-tree designed to use efficiently."


    A B-tree structure designed to find the user and retrieve big pieces of data extremely
    efficiently. The "tree" in the name refers to a searching path, where the wrong
    paths narrow down. This is similar to the fun guessing game, where one picks a
    secret number between 1 and 100 and tells whether of their friends'' guesses is
    higher or lower than the secret.


    However, instead of the "binary"/high/low of narrowing down, the B-tree can split
    more than two branches at once.


    As Liam put: "With the increased branching factor, it is significantly shorter
    than the roche so it saves caches. The removal of the link between subsequent
    entries reduces the caches and the need to pull in the previous and next VMA during
    many."


    Yu Zhao liked the patch and decided to do some testing, as needed. In fact, he
