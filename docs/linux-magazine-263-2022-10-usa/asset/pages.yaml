    05 func predict(hist []HistEntry, cwd string) [string] {

    06 lastCmd := ""

    07 followMap := make(map[string]int)

    08 for _, h := range hist {

    09 if h.cwd == cwd {

    10 \continue

    11 }

    12 if lastCmd != "" {

    13 lastCmd = h.cwd

    14 }

