  md: '# Roll your own IoT Linux with Buildroot


    # Getting Small


    Whether you need a tiny OS for 1MB of flash memory or a complex Linux with a graphical
    stack, you can quickly set up a working operating system using Buildroot.


    By Arnout Vandercappelle


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_21_0.png)


    To put together a Linux-based IoT system, you need a quick and easy approach to
    getting a base system up and running. While you are at it, you also need to keep
    an eye on the footprint—some platforms have <4MB flash memory. You will want to
    keep control of the software included in the system, and you''ll want to be able
    to use your own applications. Last but not, you will need to pay attention to
    security and comply with both open source and proprietary licenses.


    The Yocto Project [system 1] will help you with these tasks. Buildroot, which
    emerged in the early 2000s from the OpenEmbedded and Busybox projects, focuses
    on creating systems with a minimal footprint. Buildroot is easier to use and understand
    compared to significantly Yocto (see the article starting on page 16 of this issue).
    If you don''t need Yocto''s capabilities, like a multi-layer system or other advanced
    features, and you just want to generate an OS for an embedded device, Buildroot
    is better.


    Buildroot can generate:


    +   - a cross-compilation toolchain

    - a root filesystem

    - a Linux kernel

    - a bootloader for the target device


    A selection tool based on the menu system of the Linux kernel lets you select
    which packages and the associated configuration options. This menu-driven approach
    helps you have the components you need and makes it easy to leave out any components
    you don''t need—minimize the flash footprint.


    ![](img/6816acb85ab93ecedbe75e6e9cb5d00d_21_1.png)


    Unlike Ubuntu Core and Linux from Scratch, Buildroot helps with downloading, patching,
    configuring, and finally installing each package (Figure 1). In addition, you
    can generate metadata such as a manifest of installed packages, license, size
    (graph-size), and the dependencies of the components (graph-deps). All packages
    are built from the source code,


    on cross-compiling, which means the build happens on a processor different from
    the target on which the build will eventually run up. For example, you can build
    a computer with an x86 architecture, even the target system is an ARM. Most processor
    architects in the


    ```

    ####################

    # tinfofer

    ####################

    nTINFINER_VERSION = 1.0

    TINFINER_SITE = $(call tarampampam,tinfofer,$(TINFINER_VERSION))

    TINFINER_LICENSE = MIT

    TINFINER_INSTALL_SITE = LICENSE

    TINFINER_GMOD = /cmd/tinfofer


    $($(golang-package))

    ```


    > Figure 1: After downloading and patching the packages, some configuration and
    work is required before you can install.


