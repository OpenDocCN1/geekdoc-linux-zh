  \ `mydrv_wq` 一部分的自旋锁（spinlock）来实现的。驱动初始化例程在代码列表 3.2 初始化自旋锁、列表头和等待队列，并启动工作线程。\n\n\
  代码列表 3.2. 初始化数据结构\n\n![image](img/p0067-01.jpg)\n\n在检查执行提交工作的工作线程之前，让我们先看看工作提交本身。代码列表\
