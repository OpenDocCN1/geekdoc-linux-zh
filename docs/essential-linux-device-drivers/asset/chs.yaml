  \ 工具查询此文件并将数据流到相应的设备节点。因此，如果你将打印机连接到系统的第一个并行口，并执行命令 `lpr myfile`，它将通过 `/dev/lp0`\
  \ 流到打印机的 `write()` 方法 `lp_write()`，该方法定义在 `drivers/char/lp.c` 中。\n4.`lp_write()`\
  \ 使用 parport 的服务将数据发送到打印机。\n\n* * *\n\nApple 公司已获得 CUPS 软件的所有权。该代码继续根据 GPLv2 许可。\n\
  \n\n\n\n一个名为 `ppdev` 的字符驱动程序（`drivers/char/ppdev.c`）导出 `/dev/parportX` 设备节点，允许用户态应用程序直接与并行端口通信。（我们将在第\
  \ 19 章中详细讨论 `ppdev`。）\n\n#### 设备示例：并行端口 LED 板\n\n为了学习如何使用 `parport` 提供的服务，我们来编写一个简单的驱动程序。考虑一个带有八个发光二极管（LED）的板，通过标准的\
  \ 25 针并行端口连接器接口。由于 PC  8 位并行端口数据寄存器直接映射到并行端口连接器的引脚 2 到 9，这些引脚连接到板上的 LED。向并行端口数据寄存器写入数据可以控制这些引脚的电平，从而控制\
  \ LED 的开启或关闭。列表 5.6 实现了一个字符驱动程序，该程序通过系统并行端口与该板通信。嵌入注释解释了列表 5.6 使用的 `parport` 服务例程。\n\
