  \ 辅助程序返回的最小值和最大值分别为 0 和 10。\n\n最后，设置所需的音量并写入 codec：\n\n![image](img/p0411-03.jpg)\n\
  \n对 `snd_ctl_elem_write()` 的调用会导致调用 `mycard_pb_vol_put()`，该函数会将所需的音量增益写入 codec 的\
  \ `VOLUME_REGISTER`。\n\n* * *\n\n##### MP3 解码复杂度\n\n如图 13.4 所示，运行在播放器上的 MP3 解码应用程序需要从\
  \ CF 磁盘提供 MP3 帧速率，以维持 128KBps 的常用 MP3 采样率。对于大多数低 MIP 设备来说通常不是问题，但如果出现，请考虑在解码之前在内存中对每首歌进行缓冲。（128KBps\
  \ 的 MP3 帧每分钟音乐大约消耗 1MB。）\n\nMP3 解码是轻量级的，通常可以实时完成，但 MP3 编码是密集的，没有硬件辅助的情况下无法实时实现。然而，用于语音\
  \ IP（VoIP）环境的语音 codec（如 G.711 和 G.729）可以实时编解码音频数据。\n\n* * *\n\n### 调试\n\n你可以在内核配置菜单的设备驱动\
  \ -> 音频 -> 高级 Linux 音频架构下开启选项，以包含 ALSA 调试代码 (`CONFIG_SND_DEBUG`)、详细的 `printk()`\
  \ 消息 (`CONFIG_SND_VERBOSE_PRINTK`) 以及详细的 procfs 内容 (`CONFIG_SND_VERBOSE_PROCFS`)。\n\
  \n与 ALSA 驱动相关的 proc 信息位于 `/proc/asound/`。查看 `/sys/class/sound/` 获取与每个声类设备关联的模型信息。\n\
  \n如果你认为 ALSA 驱动程序中存在错误，请将其发布到 alsa-devel 邮件列表 ([`mailman.alsa-project.org/mailman/listinfo/alsa-dev`](http://mailman.alsa-project.org/mailman/listinfo/alsa-dev))。linux-audio-dev\
  \ 邮件列表 ([`mailman.alsa-project.org/mailman/listinfo/alsa-dev`](http://mailman.alsa-project.org/mailman/listinfo/alsa-dev))\
  \ 也称为 Linux Audio Dev。\n\n\n\n\n\n让我们先浏览一下当今计算机系统中常见的存储技术。我们还将这些技术与内核源码树中相应的设备驱动子系统相关起来。\n\
  \n## 集成驱动器电子 (IDE)\n\n集成驱动器 (IDE) 是 PC 环境中常用的存储接口技术。`ATA`（Advanced Technology Attachment\
  \ 的缩写）是该相关规范的正式名称。`IDE/ATA` 标准始于 `ATA-1`；最新版本是 `ATA-7`，支持高达 133MBps 的带宽。中间版本的规范包括：`ATA-2`，它引入了逻辑块寻址\
  \ (`LBA`)；`ATA-3`，它实现了支持 SMART 的磁盘（后文将讨论）；`ATA-4`，它带来了对 `Ultra DMA` 以及相关 33MBps\
  \ 吞吐量的支持；`ATA-5` 将最大传输速度提高到 66MBps；以及 `ATA-6`，提供了 100MBps 的数据速率。\n\nCD-ROM 和磁带等存储设备通过一种称为\
  \ `ATA 数据包接口` (`ATAPI`) 的特殊协议连接到标准的 IDE 线缆。`ATAPI` 随 `ATA-4` 一起引入。\n\nPC 系统中的软磁盘控制器传统上是\
  \ `Super I/O` 芯片组的一部分，我们在[第 6 章]“串口驱动程序”中学习过它。然而，在今天的 PC 环境中，这些内部驱动器已被更快的外部 USB\
  \ 软磁盘所取代。\n\n[图 14.1] 显示了一个连接到 IDE 主机适配器的 `ATA-7` 磁盘驱动，该适配器是 PC 系统`南桥` 芯片组的一部分。图中还显示连接了一个\
  \ `ATAPI` CD-ROM 驱动器和一个软磁盘驱动器。\n\n图 14.1. PC 系统中的存储介。\n\n![image](img/14fig01.gif)\n\
  \n`IDE/ATA` 是一种并行线技术（有时称为 `Parallel ATA` 或 `PATA`），无法扩展到高速，正如你在[第 10 章]“外部件组件连接”讨论\
  \ `PCIe` 时学到的。串口 ATA (`SATA`) 是 `PATA` 的现代串行线演进，支持 300MBps 及以上的传输速度。除了提供比 `PATA`\
  \ 更高的吞吐量外，`SATA` 还带来了热插拔等功能。`SATA` 技术正在逐渐取代 `PATA`。查看侧栏“libATA”以了解内核中同时支持 `SATA`\
  \ 和 `PATA` 的新 ATA 子系统。\n\n***\n\n### libATA\n\n`libATA` 是 Linux 内核中新的 ATA 子系统。它由一组\
  \ ATA 库程序和一组使用这些程序的低级驱动程序组成。`libATA` 同时支持 `SATA` 和 `PATA`。`libATA` 中的 `SATA` 驱动已经在\
  \ `drivers/scsi/` 下存在了一段时间，但 `PATA` 驱动程序以及现在存放所有 `libATA` 源码的新 `drivers/ata/` 目录是在\
  \ 2.6.19 内核版本引入的。\n\n如果你的系统启用了 `SATA` 存储，则你需要结合 `SCSI` 子系统使用 `libATA` 的服务。`libATA`\
  \ 对 `PATA` 的支持仍处于实验阶段，默认情况下，`PATA` 驱动程序继续使用 `drivers/ide/` 中的遗留 IDE 驱动程序。\n\n假设你的系统通过\
  \ `Intel ICH7 南桥` 芯片组启用了 `SATA`。你需要以下 `libATA` 组件来访问磁盘：\n\n1. `libATA` 核心——要启用此功能，请在内核配置期间设置\
  \ `CONFIG_ATA`。核心提供的库函数列表，请在 `drivers/ata/` 目录内搜索 `EXPORT_SYMBOL_GPL`。\n\n2. 高级主机控制器接口\
  \ (`AHCI`) 支持——`AHCI` 指定了 `SATA` 主机适配器支持的寄存器接口，并在配置时选择 `CONFIG_AHCI` 来启用。\n\n3.\
  \ 主机适配器驱动——对于 `ICH7`，启用 `CONFIG_ATA_PIIX`。\n\n此外，你还需要中层和上层 SCSI 驱动程序（`CONFIG_SCSI`\
  \ 及其）。在你加载了所有这些内核组件后，你的 `SATA` 磁盘分区在系统中显示为 `/dev/sd*`，就像 SCSI 或 USB 质存储设备分区一样。\n\
  \n`libATA` 项目的主页是 [`linux-ata.org/`](http://linux-ata.org/)。DocBook 作为内核源码树的一部分位于\
  \ `Documentation/DocBook/libata.tmpl`。`libATA` 开发者指南可以在 [www.kernel.org/pub/linux/kernel/people/jgarzik/libata.pdf](http://www.kernel.org/pub/linux/kernel/people/jgarzik/libata.pdf)\
  \ 获取。\n\n***\n\n小型计算机系统接口 (`SCSI`) 是服务器和高端工作站的首选存储技术。`SCSI` 比 `SATA` 快一些，支持 320MBps\
  \ 左右的速度。`SCSI` 传统上是一种并行接口标准，但像 `ATA` 一样，随着串口附加 SCSI (`SAS`) 总线技术的出现，最近已转向串行操作。\n\
  \n内核的 `SCSI` 子系统分为三层：用于磁盘、CD-ROM 和磁带等媒体的顶层驱动程序；扫描 `SCSI` 总线并配置设备的中间层；以及低级主机适配器驱动程序。我们在[第\
  \ 11 章]“通用串行总线”的“质存储”部分学习了这些层。参考该章节的[图 11.4]以查看 `SCSI` 子系统的不同组件是如何交互的。USB 质存储设备内部使用闪存，但使用\
  \ `SCSI` 协议与主机系统通信。\n\n冗余阵列 (`RAID`) 是某些 `SCSI` 和 `SATA` 控制器内置的技术，用于实现冗余和可靠性。定义了多种\
  \ `RAID` 级别。例如，`RAID-1` 指定磁盘镜像，数据在不同的磁盘上复制。Linux 为某些支持 RAID 的磁盘提供了驱动程序。内核还提供了一个多磁盘\
  \ (`md`) 驱动程序，实现了大多数 RAID 层。\n\n小型存储是嵌入式电子领域的重点。该领域的传输速度远低于目前讨论的技术。安全数字 (`SD`) 卡及其更小尺寸的衍生产品（miniSD\
  \ 和 `microSD`）是相机、手机和播放器等设备常用的存储介质。符合 `SD` 卡规范 1.01 的卡支持高达 10MBps 的传输速度。`SD` 存储演变自一种较旧、较慢但兼容的技术，称为多媒体卡\
  \ (`MMC`)，它支持 2.5MBps 的数据速率。内核在 `drivers/mmc/` 中包含一个 `SD/MMC` 子系统。\n\n[第 9 章]“PCMCIA\
  \ 与闪存”中的“PCMCIA Storage”部分查看了不同的 PCMCIA/CF 类型存储卡及其相应的内核驱动程序。如微驱动器的 PCMCIA 内存卡支持真正的\
  \ IDE 操作，而内部使用固态内存的则模拟 IDE 并向内核导出 IDE 编程模型。在这两种情况下，可以使用内核的 IDE 子系统来启用卡。\n\n### Linux\
  \ 块 I/O 层\n\n在 2.4 和 2.6 内核发布之间，块 I/O 层经过了大幅重构。重新设计的动机是，块层比其他内核子系统更有可能影响整体系统性能。\n\
  \n\n\n\n让我们来看图 14.2 以学习 Linux 块 I/O 层的工作原理。存储介包含存在文件系统中的文件，例如 `EXT3` 或 `Reiserfs`。用户应用程序调用\
  \ I/O 系统调用来访问这些文件。产生的文件系统操作在进入特定的文件系统驱动程序之前，会先通过通用的虚拟文件系统（VFS）层。缓冲区缓存（buffer cache）通过缓存磁盘块来加速文件系统对块设备的访问。如果在缓冲区缓存中找到了某个块，就可以节省访问磁盘读取该块所需的时间。发往每个块设备的数据排队在请求队列中。文件系统驱动程序填充目标块设备所属请求队列，而块驱动程序则接收并消耗来自相应队列的请求。在其之间，I/O\
  \ 调度器会处理请求队列，以最小化减少磁盘访问延迟并最大化吞吐量。\n\n图 14.2. Linux 上的块 I/O。\n\n![image](img/14fig02.gif)\n\
  \n接下来，让我们检查 Linux 上可用的不同 I/O 调度器。\n\n### I/O 调度器\n\n块设备存在寻道时间（seek times），即磁盘头从当前位置移动到感兴趣的磁盘扇区的延迟。I/O\
  \ 调度器的主要目标是通过最小化这些寻道时间来增加系统吞吐量。为了实现这一点，I/O 调度器根据与组成请求相关的磁盘扇区对请求队列进行排序维护。新请求被插入队列中，以保持这种顺序。如果队列中的某个现有请求与相邻的磁盘扇区相关，则新请求将与之合并。由于这些特性，I/O\
  \ 调度器在操作上类似于电梯——它们在单方向上调度请求，直到队列中的最后一个请求者被服务完畢。\n\n2.4 内核中的 I/O 调度器实现了这种算法的简易版本，并被称为\
  \ Linus 电梯（Linus elevator）。然而，这在现实世界条件下被证明是不够的，在 2.6 内核中它被一组四个调度器取代：`Deadline`、`Anticipatory`、`Complete\
  \ Fair Queuing` 和 `Noop`。默认使用的调度器是 `Anticipatory`，但可以在内核配置期间或通过更改 `/sys/block/[disk]/queue/scheduler`\
  \ 的值来更改。（例如，如果你在使用 IDE 磁盘，请将 [disk] 替换为 `hda`。）表 14.2 简要描述了 Linux I/O 调度器。\n\n表\
  \ 14.2. Linux I/O 调度器\n\n![image](img/422tab01.jpg)\n\n在概念层，I/O 调度类似于进程调度。I/O 调度为进程提供了一种它们拥有磁盘的幻觉，而进程调度给进程提供了一种它们拥有\
  \ CPU 的幻觉。Linux 上的 I/O 和进程调度器在近期都经过了广泛的变化。进程调度将在第 19 章中讨论。\n\n### 块驱动程序数据结构和方法\n\
  \n现在让我们关注转移到本章的主题：块设备驱动程序。在本节中，我们将查看您在实现块设备驱动程序时可能会遇到的重要数据结构和驱动程序方法。在下一节中，当我们为一个虚拟的存储控制器实现块驱动程序时，将使用这些结构和方法。\n\
  \n以下是主要的块驱动程序数据结构：\n\n1.  内核使用 `include/linux/genhd.h` 中定义的 `gendisk`（generic disk\
  \ 的缩写）结构表示磁盘：\n\n    ![image](img/p0423-01.jpg)\n\n2.  与每个块驱动程序关联的 I/O 请求队列使用 `include/linux/blkdev.h`\
  \ 中定义的 `request_queue` 结构描述。这是一个大结构，但你可能使用的唯一组成字段是 `request` 结构，它将在后面描述。\n\n3. \
  \ `request_queue` 中的每个请求使用 `include/linux/blkdev.h` 中定义的 `request` 结构表示：\n\n   \
  \ ![image](img/p0424-01.jpg)\n\n4.  `block_device_operations` 是字符设备驱动程序使用的 `file_operations`\
  \ 结构的块驱动程序对应物。它包含了与块驱动程序相关的以下入口点：\n\n    - 标准方法，如 `open()`、`release()` 和 `ioctl()`\n\
  \    - 支持可插拔块设备的特殊方法，如 `media_changed()` 和 `revalidate_disk()`\n\n    `block_device_operations`\
  \ 在 `include/linux/fs.h` 中的定义如下：\n\n    ![image](img/p0425-01.jpg)\n\n5.  当我们查看\
  \ `request` 结构时，我们看到它与一个 `bio` 关联。`bio` 结构是页粒度上块 I/O 操作的低级描述。它在 `include/linux/bio.h`\
  \ 中的定义如下：\n\n    ![image](img/425tab01.jpg)\n\n    块数据在内部使用 `bio_vec` 结构数组表示为 I/O\
  \ 向量（I/O vector）。`bio_vec` 数组的每个元素由一个 `(page`, `page_offset`, `length)` 元组组成，描述了\
  \ I/O 块的一个分段。将 I/O 请求维护为页向量具有若干优势，包括更简洁的实现和高效的离散/聚集（scatter/gather）。\n\n在在结束本节之前，让我们简要查看块驱动程序的入口点。块驱动程序大致使用三种类型的方法构建：\n\
  \n- 常用的初始化和退出方法。\n- `block_device_operations` 的方法。\n- 请求方法。与字符设备不同，块设备不支持 `read()/write()`\
  \ 方法。相反，它们使用请求方法进行磁盘访问。\n\n块核心层提供了驱动方法可以利用的一系列库函数。下一节中的示例驱动程序调用了这些库函数。\n\n#### 设备示例：简单存储控制器\n\
  \n考虑图 14.3 所示的嵌入式设备。该 SoC 包含一个与块设备通信的内置存储控制器。架构类似于 SD/MMC，但我们的存储控制器由表 14.3 列出的基础寄存器描述。`SECTOR_NUMBER_REGISTER`\
  \ 指定请求访问的扇区[4。`SECTOR_COUNT_REGISTER` 包含要传输的扇区数量。数据通过 `DATA_REGISTER` 移动。`COMMAND_REGISTER`\
  \ 程序存储控制器需要执行的操作（例如是从介质读取还是写入）。`STATUS_REGISTER` 包含指示控制器正在执行操作的标志位。\n\n图 14.3. 嵌入式设备上的存储。\n\
  \n![image](img/14fig03.gif)\n\n表 14.3. 存储器的寄存器布局\n\n![image](img/427tab01.jpg)\n\
  \n让我们称存储控制器 myblkdev。这个简单设备不是中断驱动的，不支持 DMA。我们还假设介质不是可移动的。我们的任务是为 myblkdev 编写块驱动程序。我们的驱动程序是极简但完整的。它不处理电源管理，而且对性能并不敏感。\n\
  \n### 初始化\n\n列表 14.1 包含了驱动初始化方法 `myblkdev_init()`，它执行以下步骤：\n\n1.  使用 `register_blkdev()`\
  \ 注册块设备。该块库函数为 myblkdev 分配一个未使用的主设备并在 `/proc/devices` 中添加设备条目。\n\n2.  与块设备关联请求方法。它通过向\
  \ `blk_init_queue()` 提供 `myblkdev_request()` 的地址来实现这一点。`blk_init_queue()` 的调用返回\
  \ myblkdev 的 `request_queue`。参考之前的图 14.2 查看 `request_queue` 相对于驱动程序的位置。`blk_init_queue()`\
  \ 的第二个参数 `myblkdev_lock` 是一个自旋锁，用于保护并发访问 `request_queue`。\n\n\n\n\n### 3. 硬件以扇区为单位执行磁盘事务，而软件子系统（如文件系统）则以块为单位处理数据。常见的扇区大小为\
  \ 512 字节；通常的块大小为 4096 字节。你需要告知块层存储硬件支持的扇区大小，以及驱动程序每个请求可以接收的最大扇区数量。`myblkdev_init()`\
  \ 通过分别调用 `blk_queue_hardsect_size()` 和 `blk_queue_max_sectors()` 来这些操作。\n\n### 4.\
  \ 使用 `alloc_disk()` 分配与 `myblkdev` 对应的 `gendisk` 并对其填充。`myblkdev_init()` 提供的一个重要的\
  \ `gendisk` 字段是驱动程序 `block_device_operations` 的地址。另一个由 `myblkdev_init()` 填充的参数是\
  \ `myblkdev` 以扇区为单位的容量。这通过调用 `set_capacity()` 实现。每个 `gendisk` 还包含一个标志，用于指示底层存储硬件的属性。例如，如果驱动器是可拔的，则\
  \ `gendisk` 的 `flag` 字段应标记为 `GENHD_FL_REMOVABLE`。\n\n### 5. 将第 4 步准备的 `gendisk`\
  \ 与第 2 步获取的 `request_queue` 关联。此外，将 `gendisk` 与设备的主/次设备号及名称连接。\n\n### 6. 通过调用 `add_disk()`\
  \ 将磁盘添加到块 IO 层。完成后，驱动程序必须准备好接收请求。因此，这通常是初始化序列的最后一步。\n\n该块设备现在作为 `/dev/myblkdev`\
  \ 可供系统使用。如果设备支持多个磁盘分区，它们将显示为 `/dev/myblkdevX`，其中 `X` 是分区号。\n\n#### 列表 14.1. 初始化驱动程序\n\
  \n![image](img/p0428-01.jpg)\n\n![image](img/00429-01.jpg)\n\n![image](img/p0429-02.jpg)\n\
  \n![image](img/p0430-01.jpg)\n\n### 块设备操作\n\n接下来让我们来看看块驱动程序 `block_device_operations`\
  \ 中包含的主要方法。\n\n块驱动程序的 `open()` 方法在挂载介质上的文件系统或执行文件系统检查 (fsck) 等操作期间被调用。`open()` 期间完成的许多任务依赖于硬件。例如，CD-ROM\
  \ 驱动程序会锁定驱动器门。SCSI 驱动程序检查设备是否设置了写保护跳线，如果是，则在请求启用的打开操作时失败。如果设备是可拔的，`open()` 会调用服务程序\
  \ `check_disk_change()` 来检查介质是否发生了变化。\n\n如果你的驱动程序需要支持特定命令，请使用 `ioctl()` 方法实现对它的支持。例如，软盘驱动程序支持一个弹出介质的命令。\n\
  \n`media_changed()` 方法检查存储介质是否发生了变化，因此对于像 `myblkdev` 这样的固定设备并不相关。例如，SCSI 磁盘驱动程序的\
  \ `media_changed()` 方法检测插入的 USB 闪盘是否发生了变化。\n\n`myblkdev` 支持的唯一块设备操作是 `ioctl()` 方法\
  \ `myblkdev_ioctl()`。块层本身处理通用的 ioctl，并仅调用驱动程序的 `ioctl()` 方法来处理设备特定的命令。在列表 14.2 中，`myblkdev_ioctl()`\
  \ 实现了 `GET_DEVICE_ID` 命令，从控制器获取设备 ID。该命令通过 `COMMAND_REGISTER` 发出，ID 数据从 `DATA_REGISTER`\
  \ 获取。\n\n#### 列表 14.2. 块设备操作\n\n![image](img/p0431-01.jpg)\n\n![image](img/p0431-02.jpg)\n\
  \n### 磁盘访问\n\n如前所述，块驱动程序使用 `request()` 方法执行磁盘访问操作。块 IO 子系统每当想要处理驱动程序 `request_queue`\
  \ 中等待的请求时，就会调用驱动程序的 `request()` 方法。然而，`request()` 方法并不是运行在请求数据传输的用户进程上下文中。关联的 `request_queue`\
  \ 的地址被作为参数传递给 `request()` 方法。\n\n正如你之前看到的，内核在调用 `request()` 方法之前会持有请求锁。这是为了保护关联的请求队列免受并发访问。由于由于，如果你的\
  \ `request()` 方法必须调用任何可能进入睡眠的函数，它必须在执行前释放锁，并在返回前重新获取。\n\n列表 14.3 包含了我们驱动程序的请求方法\
  \ `myblkdev_request()`。此函数使用 `elv_next_request()` 的服务从 `request_queue` 获取下一个请求。如果队列不再有待处理的请求，`elv_next_request()`\
  \ 返回 `NULL`。`elv_next_request()` 之所以命名是因为正如你之前学到的，IO 调度算法是电梯为处理请求而采用的基本运行模式的变体。在处理完请求后，驱动程序通过调用\
  \ `end_request()` 请求块层结束该请求的 I/O。你可以使用 `end_request()` 的第二个参数指定成功或错误代码。\n\n从 `request_queue`\
  \ 收集的请求包含数据访问的起始扇区。\n\n#### 列表 14.3. 请求函数\n\n```\n(此处为列表 14.3 代码)\n```\n\n从 `request_queue`\
  \ 收集的请求包含数据访问的起始扇区。\n\n![image](img/p0432-01.jpg)\n\n![image](img/p0433-01.jpg)\n\
  \n![image](img/p0433-02.jpg)\n\n![image](img/p0434-01.jpg)\n\n#### 高级主题\n\n与通过字节传输数据的示例驱动程序不同，性能敏感型块驱动程序依赖\
  \ DMA 进行传输。例如，考虑 Compaq 控制器的 drivers/block/qarray.c：\n\n```\n(代码在此)\n```\n\nDMA\
  \ 操作在 `bio` 层工作。正如你之前看到的，IO 请求由 `bio` 组成，每个 `bio` 包含一个 `bio_vec` 数组，后者包含有关组成页的信息。假设\
  \ `bio` 指向与 IO 请求关联的 `bio` 结构，`bio->bi_sector` 包含数据访问的起始扇区，`bio_cur_sectors(bio)`\
  \ 返回要执行 I/O 的扇区数量，而 `bio_data_dir(bio)` 提供数据传输的方向。与缓冲区关联的物理页地址由 `bio->io_vec` 的\
  \ `bio_vec` 数组描述。要遍历请求中的每个 `bio`，可以使用 `rq_for_each_bio()` 宏。要进一步遍历 `bio` 中的每个页段，使用\
  \ `bio_for_each_segment()`。\n\n在前面的代码中，`blk_rq_map_sg()` 内部调用 `rq_for_each_bio()`\
  \ 和 `bio_for_each_segment()` 来遍历构成请求的所有页并构建聚集列表 `tmp_sg`。对于创建的聚集列表中每个页的流式 DMA 映射通过\
  \ `pci_map_page()` 完成。\n\n与等待操作完成的示例驱动程序不同，cpqarray 驱动程序实现了中断处理程序 `do_ida_intr()`，以便命令完成后接收硬件通知。\n\
  \n某些驱动程序（例如内存盘驱动程序 drivers/block/rd.c 和回回驱动程序 drivers/block/loop.c）作用于虚拟块设备，这些设备无法受益于请求队列上的优化排序和合并操作。此类驱动程序完全跳过请求队列，直接使用\
  \ `make_request()` 函数从块层获取 `bio`。因此，与其使用 `blk_init_queue()` 注册请求队列处理器，drivers/block/rd.c\
  \ 使用 `blk_queue_make_request()` 提供了 `make_request()` 例程，如下：\n\n```\n(代码在此)\n```\n\
  \n### 调试\n\n\n\n\n`hdparm` 工具可以从底层内核驱动程序提取各种 PATA/SATA 磁盘参数。例如，要在 SATA 驱动器上基准磁盘读取速度，执行以下操作：\n\
  \n![image](img/p0436-02.jpg)\n\n有关 `hdparm` 的完整功能，请阅读帮助页（man pages）。\n\n自我监控、分析和报告技术（SMART）是构建在许多现代\
  \ ATA 和 SCSI 磁盘中的系统，用于监控故障并执行自检。名为 `smartd` 的用户空间守护进程在底层设备驱动程序的帮助下收集支持 SMART 的磁盘收集的信息。查看\
  \ `smartd`、`smartctl` 和 `smartd.conf` 的帮助页可以学习如何从支持 SMART 的磁盘获取健康状态。\n\n如果你的发行版没有预装\
  \ `hdparm` 和 SMART 工具，你可以分别从 [`sourceforge.net/projects/hdparm/`](http://sourceforge.net/projects/hdparm/)\
  \ 和 [`sourceforge.net/projects/smartmontools/`](http://sourceforge.net/projects/smartmontools/)\
  \ 下载。\n\n`/proc/ide/` 下的文件包含系统中 IDE 磁盘驱动器的信息。例如，要获取第一个 IDE 磁盘的几何结构，请查看 `/proc/ide/ide0/hda/geometry`\
  \ 的内容。有关 SCSI 设备的信息位于 `/proc/scsi/`。你可以从 `/proc/partitions` 收集磁盘分区信息。\n\nIDE 设备感兴趣的\
  \ sysfs 目录是 `/sys/bus/ide/`，SCSI 则是 `/sys/bus/scsi/`。此外，系统上每个活动块设备在 `/sys/block/`\
  \ 下都有一个子目录，其中包含相关的请求队列参数、组成分区详情和状态信息。\n\n某些内核配置选项可以触发块子系统输出调试信息。`CONFIG_BLK_DEV_IO_TRACE`\
  \ 提供了跟踪块层的能力。`CONFIG_SCSI_CONSTANTS` 和 `CONFIG_SCSI_LOGGING` 分别开启 SCSI 错误报告和日志。\n\
  \nlinux-ide 邮件列表是讨论 Linux-IDE 子系统相关问题的论坛。订阅 linux-scsi 邮件列表并浏览其存档文件，可以查看有关 Linux-SCSI\
  \ 子系统的讨论。\n\n### 查看源码\n\n表 14.1 包含了各种存储技术的内核驱动源码位置。查看 `Documentation/ide.txt`、`Documentation/scsi/*`\
