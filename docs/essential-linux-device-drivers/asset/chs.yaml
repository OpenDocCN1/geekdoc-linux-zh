  \ 字段中的 ID，第三个参数是 `owner` 模块，最后一个参数是私有字段的大小，该字段可以通过返回的 `snd_card` 结构的 `private_data`\
  \ 字段可用（通常用于存储特定芯片的数据，如中断级别 I/O 地址）。\n\n   `snd_card` 代表创建的声卡，在 `include/sound/core.h`\
  \ 中定义如下：\n\n   ![image](img/p0399-02.jpg)\n\n   `probe` 方法的对应方法 `mycard_audio_remove()`\
  \ 使用 `snd_card_free()` 从 ALSA 框架中释放 `snd_card`。\n\n2. 使用 `snd_pcm_new()` 创建 PCM\
  \ 播放实例并与第 1 步创建的卡相关联：\n\n   ![image](img/p0400-01.jpg)\n\n   参数分别是：第 1 步创建的声卡实例、标识符字符串、设备索引、支持的播放流数量、支持的采集流数量（我们的示例中为\
  \ 0）以及用于存储分配的 PCM 实例的指针。分配的 PCM 实例在 `include/sound/pcm.h` 中定义如下：\n\n   ![image](img/p0400-02.jpg)\n\
  \n   `snd_device_new()` 程序位于 `snd_pcm_new()` 以及其他组件实例化函数的核心。\n\n3. 通过调用 `snd_pcm_set_ops()`\
  \ 将播放操作与第 2 步创建的 PCM 实例连接。`snd_pcm_ops` 结构指定了将 PCM 音频传输到编解码器的操作。Listing 13.1 如下实现了这一点：\n\
  \n   ![image](img/p0400-03.jpg)\n\n   在 Listing 13.1 中，`mycard_pb_prepare()` 将采样率配置到\
  \ `SAMPLING_RATE_REGISTER`，时钟源配置到 `CLOCK_INPUT`，传输启用配置到 `CONTROL_REGISTER`。`trigger()`\
  \ 方法 `mycard_pb_trigger()` 在启动 PCM 操作时对此缓冲区进行 DMA 映射，并在停止 PCM 操作时取消映射。\n\n   另一个对象是\
  \ `snd_pcm_hardware` 结构，它声明了 PCM 组件的能力。对于我们的示例设备，在 Listing 13.1 中定义如下：\n\n   ![image](img/p0401-01.jpg)\n\
  \n4. 使用 `snd_pcm_lib_preallocate_pages_for_all()` 预分配缓冲区。DMA 缓冲区随后由 `mycard_hw_params()`\
  \ 使用 `snd_pcm_lib_malloc_pages()` 从此预分配区域获取并存储在 PCM 运行时实例中。\n\n5. 使用 `snd_ctl_add()`\
  \ 将混音器控制元素与声卡关联以控制全局音量：\n\n   ![image](img/p0402-01.jpg)\n\n   `snd_ctl_new1()`\
  \ 取 `snd_kcontrol_new` 结构作为其第一个参数并返回指向 `snd_kcontrol` 结构的指针。Listing 13.1 对其定义如下：\n\
  \n   ![image](img/p0402-02.jpg)\n\n6. 最后，将声卡注册到 ALSA 框架：\n\n```\nsnd_card_register(card);\n\
  ```\n\n\n\n\n\n`codec_write_reg()`（已使用，但在列表 13.1 中未实现）通过连接 SoC 内部音频控制器和外部 codec\
  \ 的总线向 codec 寄存器写入值。如果底层的总线协议是 I²C 或 SPI，例如 `codec_write_reg()` 将使用第 8 章中讨论的接口函数——间集成电路协议”。\n\
  \n如果你想在驱动程序中创建一个 `/proc` 接口以便在调试期间转储寄存器，或在正常运行时导出参数，请使用 `snd_card_proc_new()` 及其相关服务。列表\
  \ 13.1 没有使用 `/proc` 接口文件。\n\n如果你在列表 13.1 中编译并加载驱动模块，你将看到 MP3 播放器上出现两个新设备节点：`/dev/snd/pcmC0D0p`\
  \ 和 `/dev/snd/controlC0`。前者是音频播放的接口，后者是混音器控制接口。MP3 解码应用程序在 `alsa-lib` 的帮助下，通过操作这些设备节点流流音乐。\n\
  \n列表 13.1. 用于 Linux MP3 播放器的 ALSA 驱动\n\n![image](img/p0403-01.jpg)\n\n![image](img/p0404-01.jpg)\n\
