  \n现在根据上述 `amixer` 输出获取 MP3 音量的 `numid`：\n\n![image](img/p0410-04.jpg)\n\n打开混音器节点\
  \ `/dev/snd/controlC0`。`snd_ctl_open()` 的第三参数指定了节点名称中的卡号：\n\n![image](img/p0410-05.jpg)\n\
  \n按如下方式提取列表 13.1 中 `mycard_pb_vol_info()` 定义的 `snd_ctl_elem_info` 结构中的 `type` 字段：\n\
  \n![image](img/p0411-01.jpg)\n\n通过与 `mycard_pb_vol_info()` 驱动方法通信获取支持的 codec 音量范围：\n\
