  \n### 与并行口通信\n\n并行端口是 PC 兼容系统中常见的 25 针接口。并行端口的能力（是单向的、双向、支持 DMA 等）取决于底层芯片组。查看[第\
  \ 4 章]中的图 4.1 以了解 PC 架构如何支持并行端口。\n\n`drivers/parport/` 目录包含实现 IEEE 1284 并端口通信的代码（称为\
  \ parport）。连接到并行端口的设备（如打印机和扫描仪）使用 parport 的服务。Parport 有一个架构无关模块 `parport.ko` 和一个架构相关模块（PC\
  \ 架构的 `parport_pc.ko`），它们为通过并行端口接口的驱动程序提供编程接口。\n\n以并行打印机驱动 `drivers/char/lp.c` 为例。打印文件的高级步骤如下：\n\
  \n1.打印机驱动创建字符设备节点 `/dev/lp0` 到 `/dev/lpN`，每个连接的打印机一个。\n2. Common UNIX 打印系统 (CUPS)\
  \ 是 Linux 上提供打印功能的框架。CUPS 配置文件（某些发行版上的 `/etc/printers.conf`）将打印机与其设备节点映射。\n3.CUPS\
  \ 工具查询此文件并将数据流到相应的设备节点。因此，如果你将打印机连接到系统的第一个并行口，并执行命令 `lpr myfile`，它将通过 `/dev/lp0`\
  \ 流到打印机的 `write()` 方法 `lp_write()`，该方法定义在 `drivers/char/lp.c` 中。\n4.`lp_write()`\
  \ 使用 parport 的服务将数据发送到打印机。\n\n* * *\n\nApple 公司已获得 CUPS 软件的所有权。该代码继续根据 GPLv2 许可。\n\
