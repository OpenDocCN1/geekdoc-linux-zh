  2.  实现 `get_stats()` 方法以检索：\n\n    ![image](img/p0445-03.jpg)\n\n3.  为上层提供检索方法：\n\
  \n    ![image](img/p0446-01.jpg)\n\n要从你的 NIC 收集统计信息，通过执行适当的用户命令触发 `mycard_get_stats()`。例如，要查找通过\
  \ eth0 接收的数据包数量，请执行以下操作：\n\n![image](img/p0446-02.jpg)\n\nWiFi 驱动程序需要跟踪多个与常规 NIC\
  \ 无关的参数，因此 `get_stats()` 之外还实现了统计收集方法 `get_wireless_stats()`。\n\n### 配置 (Configuration)\n\
