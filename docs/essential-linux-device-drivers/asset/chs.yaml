  \ `seq_printf()`。如果从 `/proc/driver/nvram` 读取，原始驱动程序和列表 C.4 中的驱动程序将产生相同的输出。\n\n###\
  \ 查看源码\n\n查看 `Documentation/filesystems/proc.txt` 获取更多关于 procfs 的信息。`fs/proc/` 目录包含实现\
  \ procfs 核心的代码。seq file 接口位于 `fs/seq_file.c`。procfs 和 seq files 的用户遍布内核各个角落。\n\n\
