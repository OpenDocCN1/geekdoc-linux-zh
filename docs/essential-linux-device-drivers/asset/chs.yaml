  \n![image](img/p0406-01.jpg)\n\n![image](img/p0406-02.jpg)\n\n![image](img/p0407-01.jpg)\n\
  \n![image](img/p0408-01.jpg)\n\n![image](img/p0409-01.jpg)\n\n#### ALSA 编程\n\n为了理解用户空间的\
  \ `alsa-lib` 库如何与内核空间的 ALSA 驱动程序交互，让我们写一个设置 MP3 播放器音量增的简单应用程序。我们将应用程序使用的 `alsa-lib`\
  \ 服务映射到列表 13.1 中定义的混音器控制方法。让我们从加载驱动并检查混音器的能力开始：\n\n![image](img/p0410-01.jpg)\n\n\
