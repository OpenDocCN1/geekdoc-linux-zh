  \n![image](img/191tab01.jpg)\n\n#### RS-485\n\nRS-485 不是像 RS-232 那样的标准 PC 接口，但在嵌入领域，你可能会遇到使用\
  \ RS-485 连接可靠通信控制系统的计算机。RS-485 使用差分信号，使其能够在数千英尺距离内交换数据，而 RS-232 的范围只有几十英尺。在处理器端，RS-485\
  \ 接口是以双工模式运行的 UART。因此，在从发送 FIFO 发送数据到导线之前，UART 设备驱动程序需要额外启用 RS-485 发送器并禁用接收器，这可以通过操作相关的\
  \ GPIO 引脚来实现。要从导线获取数据到接收 FIFO，UART 驱动程序必须执行相反操作。\n\n\n\n\n\nRS-485 支持多点点传输，因此如果你在总线上连接了多个设备，高层协议必须实现合适的寻址机制。RS-485\
  \ 不支持使用请求发送（`RTS`）和清除发送（`CTS`）硬件流控制线。\n\n### TTY 驱动程序\n\n现在让我们来看看 tty 驱动程序的核心结构和注册函数。有三个结构对它们的运行至关重要：\n\
  \n1.  定义在 `include/linux/tty.h` 中的 `struct tty_struct`。该结构包含了与已打开的 tty 关联的所有状态信息。这是一个庞大的结构，但这里有一些重要的字段：\n\
  \n    ![image](img/192tab01.jpg)\n\n2.  `struct tty_flip_buffer` 或嵌入在 `tty_struct`\
  \ 内部的翻转缓冲区（flip buffer）。它是数据采集和处理机制的核心：\n\n    ![image](img/192tab02.jpg)\n\n  \
  \  底层串口驱动程序使用翻转缓冲区的一半来收集数据，而线路规程（line discipline）使用另一半来处理数据。随后，串口驱动程序和线路规程使用的缓冲区指针会进行翻转，过程继续进行。查看\
  \ `drivers/char/tty_io.c` 中的函数 `flush_to_ldisc()` 来查看翻转的动作。\n\n    在最近的内核中，`tty_flip_buffer`\
  \ 结构经过了重新设计。它现在由一个缓冲区头（`tty_bufhead`）和一个缓冲区列表（`tty_buffer`）组成：\n\n    ![image](img/193tab01.jpg)\n\
  \n3.  定义在 `include/linux/tty_driver.h` 中的 `struct tty_driver`。它规定了 tty 驱动程序与高层之间的编程接口：\n\
  \n    ![image](img/193tab02.jpg)\n\n就像 UART 驱动程序一样，tty 驱动程序需要通过两个步骤向内核注册：\n\n1.\
  \  调用 `tty_register_driver(struct tty_driver *tty_d)` 注册到 tty 核心。\n\n2.  调用\n\n\
  \    ![image](img/p0194-01.jpg)\n\n    来注册它支持的每一个独立 tty。\n\n我们不会开发一个示例 tty 驱动程序，但这里是\
  \ Linux 上常用的一些驱动：\n\n*   通过蓝牙实现的串口仿真（在第 16 章中讨论）以 tty 驱动程序的形式实现。该驱动程序（`drivers/net/bluetooth/rfcomm/tty.c`）在初始化期间调用\
  \ `tty_register_driver()`，并在处理每个传入的蓝牙连接时调用 `tty_register_device()`。\n*   为了与 Linux\
  \ 桌面系统的控制台工作，如果你处于文本模式，则需要虚拟终端（VT）的服务；如果你处于图形模式，则需要伪终端（PT）。VT 和 PTY 分别作为 tty 驱动程序实现，并位于\
  \ `drivers/char/vt.c` 和 `drivers/char/pty.c` 中。\n*   在传统 UART 上使用的 tty 驱动程序位于 `drivers/serial/serial_core.c`。\n\
  \n*   USB 转串口 tty 驱动程序位于 `drivers/usb/serial/usb-serial.c`。\n\n## 线路规程\n\n线路规程提供了一种优雅的机制，让你可以使用同一个串口驱动程序运行不同的技术。底层物理驱动程序和\
  \ tty 驱动程序处理与硬件的数据传输，而线路规程负责处理数据并在内核空间和用户空间之间传输数据。\n\n串口子系统支持 17 种标准线路规程。打开串口时附加的默认线路规程是\
  \ `N_TTY`，它实现了终端 I/O 处理。`N_TTY` 负责“加工”从键盘接收到的字符。根据用户请求，它将控制字符映射为换行符，将小写字母转换为大写，扩展制表符，并将字符回显到关联的\
  \ VT。`N_TTY` 还支持编辑器使用的原始模式（raw mode），该模式将所有之前的处理留给用户应用程序。参见下一章中的图 7.3“[输入驱动程序”，了解键盘子系统是如何连接到\
  \ `N_TTY` 的。上一节末列出的示例 tty 驱动程序（TTY 驱动程序）默认使用 `N_TTY`。\n\n线路规程还通过串口传输协议实现了网络接口。例如，作为点点协议（`N_PPP`）和串口链路\
  \ 协议（`N_SLIP`）子系统的线路规程，负责帧包、分配并填充相关的网络数据结构，并将数据传递给相应的网络协议栈。其他线路规程处理红外数据（`N_IRDA`）和蓝牙主机控制接口（`N_HCI`）。\n\
  \n#### 设备示例：触摸控制器\n\n让我们通过为串口触摸屏控制器实现一个简单的线路规程来查看线路规程的内部机制。图 6.6 显示了触摸控制器在嵌入式笔记本电脑衍生设备上的连接方式。触摸控制器的有限状态机（FSM）可以实现线路规程的候选，因为它可以利用串口层提供的设施和接口。\n\
  \n图 6.6 PC 衍生设备上触摸控制器的连接图。\n\n![image](img/06fig06.gif)\n\n#### 打开和关闭\n\n要创建一个线路规程，需要定义\
  \ `struct tty_ldisc` 并注册一组预定义的入口。列表 6.2 包含了这些操作的代码。\n\n列表 6.2 线路规程操作\n\n![image](img/196tab01.jpg)\n\
  \n在列表 6.2 中，`tch` 是线路规程的名字，`N_TCH` 是线路规程号。你需要在 `include/linux/tty.h` 中指定 `N_TCH`，该头文件包含了所有的线路规程定义。系统中激活的线路规程可以在\
  \ `/proc/tty/ldis` 找到。\n\n线路规程从它们的缓冲区部分获取数据，进行处理，并将结果拷贝到读取缓冲区。对于 `N_TCH`，`room()`\
  \ 返回读取缓冲区中的剩余内存空间，而 `chars_in_buffer()` 返回准备交付到用户空间的已处理字符数。`touch_write()` 和 `touch_wakeup()`\
  \ 都不执行操作，因为 `N_TCH` 是一个只读设备。`touch_open()` 负责为主线路规程分配内存，如列表 6.3 所示。\n\n列表 6.3 打开线路规程\n\
  \n![image](img/p0197-01.jpg)\n\n![image](img/p0198-01.jpg)\n\n每当连接触摸控制器的串口时，你可能希望将\
  \ `N_TCH` 设置为默认线路规程（而不是 `N_TTY`）。参见“更改线路规程”了解如何从用户空间更改线路规程。\n\n##### 读取路径\n\n对于中断驱动设备，读取数据路径通常由两个协同工作的线程组成：\n\
  \n1.  源自请求读取的用户进程线程\n2.  源自中断服务例程序的底部线程，用于从设备收集数据\n\n图 6.7 显示了这些线程与读取数据的关联。中断处理程序将\
  \ `receive_buf()` 方法（我们示例中的 `n_touch_receive_buf()`）作为任务队列。你可以通过设置 `tty->low_latency`\
  \ 标志来覆盖这种行为。\n\n图 6.7 线路规程读取路径。\n\n![image](img/06fig07.gif)\n\n触摸控制器和处理器使用在控制器数据表中描述的特定协议进行通信。驱动程序使用如前的\
  \ FSM 实现了这种通信协议。列表 6.4 将此 FSM 编码为 `receive_buf()` 入口点的一部分，`n_touch_receive_buf()`。\n\
  \n\n\n\n\n`n_touch_receive_buf()` 处理来自串口驱动程序到达的数据。它与触摸屏控制器交换一系列命令和响应，并将接收到的坐标和方向（按下/释放）信息放入线路律\
  \ s（line discipline）的读取缓冲区中。对读取缓冲区的访问必须使用自旋锁（spinlock）进行序列化，因为它同时被 `ldisc.receive_buf()`\
  \ 和 `ldisc.read()` 线程使用（在图 6.7 中所示，在我们的示例中分别为 `n_touch_receive_buf()` 和 `n_touch_read()`）。如你在列表\
  \ 6.4 中所示，`n_touch_receive_buf()` 通过直接调用串口驱动程序的 `write()` 入点向触摸屏控制器分发命令。\n\n`n_touch_receive_buf()`\
  \ 还需要做另外几件事：\n\n1.  图 6.7 中的顶层 `read()` 线程在没有可用数据时会将调用进程置睡眠。因此，`n_touch_receive_buf()`\
  \ 必须唤醒该线程并让它读取刚刚处理的数据。\n2.  如果线路律的读取缓冲区空间不足，`n_touch_receive_buf()` 必须请求串口驱动限制来自设备的数据流入。`ldisc.read()`\
  \ 负责将数据传输到用户空间并释放读取缓冲区中的内存时，请求相应的取消限流。串口驱动程序使用软件或硬件流控来实现限流和取消限流。\n\n列表 6.5 执行了这两个操作。\n\
  \n#### 列表 6.5. 唤醒读取线程并限流串口驱动\n\n![image](img/p0201-01.jpg)\n\n使用等待队列（`tty->read_wait`）来同步\
  \ `ldisc.read()` 和 `ldisc.receive_buf()` 线程。当 `ldisc.read()` 未找到可读数据时，会将调用进程添加到等待队列，而当有数据可读时，`ldisc.receive_buf()`\
  \ 会唤醒 `ldisc.read()` 线程。因此，`n_touch_read()` 执行以下操作：\n\n*   如果没有数据可读，则将调用进程置在 `read_wait`\
  \ 队列上睡眠。当数据到达时，`n_touch_receive_buf()` 会唤醒该进程。\n*   如果有可用数据，则从本地读取缓冲区（`tty->read_buf[tty->read_tail]`）收集数据并将其分发到用户空间。\n\
  *   如果串口驱动已被限流，且在此读取之后读取缓冲区中有足够的空间，则请求串口驱动取消限流。\n\n网络线路律通常分配一个 `sk_buff`（第 15 章中讨论的\
  \ Linux 网络基本数据结构，“网络接口卡](#ch15.html_ch15)”）并将其读取缓冲区。它们没有 `read()` 方法，因为相应的 `receive_buf()`\
  \ 将接收到的数据复制到分配的 `sk_buff` 中直接传递给关联协议栈。\n\n### 写路径\n\n线路律的 `write()` 入点在将数据传递给底层驱动程序之前执行任何所需的后处理。\n\
  \n如果底层驱动程序无法接受线路律提供的所有数据，线路律会将请求线程置睡眠。驱动程序的中断处理程序在准备好接收更多数据时唤醒线路律。为了实现这一点，驱动程序调用线路律注册的\
  \ `write_wakeup()` 方法。相关的同步通过等待队列（`tty->write_wait`）完成，操作与上一节描述的 `read_wait` 队列类似。\n\
  \n许多网络线路律没有 `write()` 方法。协议实现直接将帧发送到串口设备驱动。然而，这些线路律通常仍有一个 `write_wakeup()` 入点，以响应串口驱动对更多传输数据的请求。\n\
  \n`N_TCH` 也不需要 `write()` 方法，因为触摸屏控制器是一个只读设备。正如你在列表 6.4 中所示，接收路径中的例程在向控制器发送命令帧时直接与底层\
  \ UART 驱动通信。\n\n### I/O 控制\n\n用户程序可以通过 `ioctl()` 调用向设备发送命令，如第 5 章，“字符驱动程序](#ch05.html_ch05)”所述。当应用程序打开串口设备时，它通常可以对其发出三类\
  \ ioctl：\n\n*   串口驱动程序支持的命令，例如设置调制调器信息的 `TIOCMSET`\n*   tty 驱动程序支持的命令，例如更改关联的线路律的\
  \ `TIOCSETD`\n*   关联线路律支持的命令，例如在 `N_TCH` 情况下重置触摸屏控制器的命令\n\n`N_TCH` 的 `ioctl()` 实现很大是标准的。支持的命令取决于触摸屏控制器数据表中描述的协议。\n\
  \n### 更多操作\n\n另一个线路律操作是 `flush_buffer()`，它用于刷新读取缓冲区中任何挂起的数据。当线路律关闭时也会调用 `flush_buffer()`。它会如下所示唤醒任何等待更多数据的读取线程：\n\
  \n![image](img/p0203-01.jpg)\n\n另一个入点（`N_TCH` 不支持）是 `set_termios()`。`N_TTY` 线路律支持\
  \ `set_termios()` 接口，用于设置特定线路律处理的选项。例如，你可以使用 `set_termios()` 将线路律置于原始模式（raw mode）或“熟制模式”（cooked\
  \ mode）。某些针对触摸屏控制器的选项（如更改波特率、校验位和停止位数量）由底层设备驱动程序的 `set_termios()` 方法实现。其余的入点（如 `poll()`）是非常标准的，如果你需要帮助，可以返回第\
  \ 5 章。\n\n你可以将你的线路律作为内核的一部分进行编译，或者作为模块动态加载。如果你选择将其编译为模块，那么你必须提供在模块初始化和退出期间进行调用的函数。前者通常与\
  \ `init()` 方法相同。后者需要清理私有数据并注销线路律。注销律只需要一行代码：\n\n```\ntty_unregister_ldisc(N_TCH);\n\
  ```\n\n驱动串口控制器的更简单方法是利用输入子系统和内置串口线路律的服务。\n\n### 修改线路律\n\n当用户空间程序打开连接到触摸屏的串口时，`N_TCH`\
  \ 会绑定到底层串口驱动程序。但有时，用户空间应用程序可能希望设备附加不同的线路律。例如，你可能想编写一个从触摸屏控制器接收并打印数据的程序。列表 6.6 打开触摸屏并将线路律更改\
  \ `N_TTY` 以打印输入的数据。\n\n#### 列表 6.6. 从用户空间更改线路律\n\n![image](img/p0204-01.jpg)\n\n\
  `TIOCSETD ioctl()` 关闭当前的线路律并打开新请求的线路律。\n\n### \n\n串口核心位于 drivers/serial/，但 tty 实现和底层驱动分散在源码树中。例如，图\
  \ 6.3 中提到的驱动文件位于四个不同的目录：drivers/serial/、drivers/char/、drivers/usb/serial/ 和 drivers/net/irda/。现在包含\
  \ UART 驱动 drivers/serial/ 目录在 2.4 内核中并不存在；UART 特有的代码曾分散在 drivers/char/ 和 arch/your-arch/目录中。现在的代码划分更有逻辑，因为\
  \ UART 驱动程序并不是访问串口层的唯一用户——USB 转串口转换器和 IrDA 适配器等设备也需要与串口核心通信。\n\n\n\n\n\n请查看 `drivers/serial/imx.c`\
  \ 以了解一个真实的低层 UART 驱动程序。它处理了 Freescale `i.MX` 系列嵌入式控制器的 UART。\n\n要查看 Linux 支持的行规律（line\
  \ disciplines）列表，请参见 `include/linux/tty.h`。要了解网络行规律，可以查看 PPP（`drivers/net/ppp_async.c`）、蓝牙（`drivers/bluetooth/hci_ldisc.c`）、红外（`drivers/net/irda/irtty-sir.c`）和\
  \ SLIP（`drivers/net/slip.c`）对应的源代码文件。\n\n表 6.3 总结了本章使用的主要数据结构以及它们在源码树中的定义位置。表 6.4\
  \ 列出了你在本章中使用的主要内核编程接口及其定义位置。\n\n### 表 6.3. 数据结构总结\n![image](img/205tab01.jpg)\n\n\
  ### 表 6.4. 内核编程接口总结\n![image](img/206tab01.jpg)\n\n某些串口数据传输场景是复杂的。你可能需要混合组合不同的串口层模块，正如你在图\
  \ 6.3 中看到的那样。某些情况可能需要数据路径通过多个行规律。例如，通过蓝牙建立拨号连接涉及数据通过 HCI 行规律以及 PPP 行规律的移动。如果可以，请建立这样的连接并使用内核调试器逐步执行代码流。\n\
  \n# 第 7 章 输入驱动程序\n\n## 本章内容\n* 输入事件驱动程序\n* 输入设备驱动\n* 调试\n* 查看源码\n\n内核输入子系统的创建是为了统一处理处理各种类别数据输入设备的驱动程序，例如键盘、鼠标、轨迹球、操纵杆、滚轮、触摸屏、加速度计和平板电脑。输入子系统带来了以下优势：\n\
  \n* 对功能相似的输入设备进行统一处理，即使它们在物理上不同。例如，所有鼠标（如 PS/2、USB 或蓝牙鼠标）都被一同对待。\n* 提供了一个用于向用户应用程序调度输入报告的事件接口。你的驱动程序不需要创建和管理\
  \ `/dev` 节点及相关的访问方法。相反，它可以简单地调用输入 API 将鼠标移动、按键或触摸事件向上发送到用户态。如 X Windows 等应用程序可以在输入子系统导出的事件接口上无缝工作。\n\
  * 从输入驱动程序中提取公共部分，并产生的抽象简化了驱动程序并引入了一致性。例如，输入子系统提供了一组名为 `serio` 的低层驱动程序，它提供了对串口和键盘控制器等输入硬件的访问。\n\
  \n图 7.1 展示了输入子系统的操作。该子系统包含两类协同工作的驱动程序：事件驱动程序和设备驱动程序。事件驱动程序负责与应用程序接口，而设备驱动程序负责与输入设备进行低层通信。鼠标事件生成器\
  \ `mousedev` 是前者的示例，而 PS/2 鼠标驱动是后者的示例。事件驱动程序和设备驱动程序都可以利用一个高效、无 Bug、可复用的核心的服务，该核心位于输入子系统的中心。\n\
  \n### 图 7.1. 输入子系统。\n![image](img/07fig01.gif)\n\n由于事件驱动程序是标准化的并且适用于所有输入类，因此你更有可能实现设备驱动程序而不是事件驱动程序。你的设备驱动程序可以通过输入内核使用合适的现有事件驱动程序来与用户应用程序建立接口。请注意，本章使用“设备驱动程序”一词是指输入设备驱动程序，以相对于输入事件驱动程序。\n\
  \n## 输入事件驱动程序\n输入子系统导出的事件接口已演变为许多图形窗口系统都能理解的标准。事件驱动程序提供了一种硬件无关的抽象来与输入设备通信，就像帧缓冲区接口（第\
  \ 12 章，“视频驱动程序](#ch12.html_ch12)”）提供了一种与显示设备通信的通用机制一样。事件驱动程序与帧缓冲区驱动程序配合，使图形用户界面（GUI）不受底层硬件反复变化的影响。\n\
  \n### Evdev 接口\nEvdev 是一种通用的输入事件驱动程序。`evdev` 产生的每个事件包具有以下格式，定义在 `include/linux/input.h`\
  \ 中：\n\n![image](img/p0210-01.jpg)\n\n为了学习如何使用 evdev，让我们为虚拟鼠标实现一个输入设备驱动程序。\n\n####\
  \ 设备示例：虚拟鼠标\n这是我们虚拟鼠标的工作方式：应用程序（`coord.c`）模拟鼠标移动，并通过 sysfs 节点 `/sys/devices/platform/vms/coordinates`\
  \ 将坐标信息发送到虚拟鼠标驱动程序（`vms.c`）。虚拟鼠标驱动程序（简称 `vms` 驱动）通过 `evdev` 将这些移动向上通道。图 7.2 显示了细节。\n\
  \n### 图 7.2. 虚拟鼠标的输入驱动程序。\n![image](img/07fig02.gif)\n\n通用鼠标（`gpm`）是一个允许你在没有 X 服务器协助的情况下使用鼠标服务器。`gpm`\
  \ 理解 `evdev` 消息，因此 `vms` 驱动程序可以直接与之通信。在你准备好一切后，你可以看到光标在屏幕上随着 `coord.c` 的节奏跳动。列表\
  \ 7.1 包含了 `coord.c`，它持续生成 X 和 Y 坐标。鼠标不像操纵杆或触摸屏产生相对坐标，这就是 `coord.c` 所做的。\n\n### 列表\
  \ 7.1 模拟鼠标移动的应用程序 (coord.c)\n![image](img/p0211-01)\n\n### 列表 7.2. 虚拟鼠标的输入驱动 (vms.c)\n\
  ![image](img/p0212-01)\n\n让我们仔细查看列表 7.2。在初始化期间，vms 驱动将其注册为输入驱动。为此，它首先使用内核 API `input_allocate_device()`\
  \ 分配 `input_dev` 结构：\n\n```c\nvms_input_dev = input_allocate_device();\n```\n\n\
  然后它宣布虚拟鼠标产生相对事件：\n![image](img/p0214-01)\n\n接下来，它声明了虚拟鼠标产生的事件代码：\n![image](img/p0214-02)\n\
  \n如果你的虚拟鼠标还能产生按钮点击，你需要在 `vms_init()` 中添加这些：\n![image](img/p0215-01)\n\n最后是注册：\n\n\
  ```c\ninput_register_device(vms_input_dev);\n```\n\n`write_vms()` 是附加 `/sys/devices/platform/vms/coordinates`\
  \ 的 sysfs `store()` 方法。当 `coord.c` 向此文件写入 X/Y 对时，`write_vms()` 执行以下操作：\n![image](img/p0215-02)\n\
  \n第一个语句产生 `REL_X` 事件或 X 方向的相对设备移动。第二个语句产生 `REL_Y` 事件或 Y 方向的相对移动。`input_sync()` 表示此事件完成，因此输入子系统将这两个事件收集到单个\
  \ evdev 包中，并通过 `/dev/input/eventX` 发出，其中 X 是分配给 `vms` 驱动的接口号。读取此文件的应用程序将接收到之前描述的\
  \ `input_event` 格式的事件包。要请求 `gpm` 附加到此事件接口并相应地在屏幕上追踪光标，请执行操作：\n\n```bash\ngpm -m\
  \ /dev/input/eventX -t evdev\n```\n\n\n\n\n\n`ADS7846` 触摸控制器驱动和加速度计驱动分别在后文的“触摸控制器”和“加速度计”节进行讨论，它们也是\
  \ `evdev` 用户。\n\n## 更多事件接口\n\n`vms` 驱动利用通用的 `evdev` 事件接口，但键盘、鼠标和触摸控制器等输入设备具有自定义的事件驱动程序。我们将在讨论相应的设备驱动时查看它们。\n\
  \n要编写自己的事件驱动程序并通过 `/dev/input/mydev` 导出到用户空间，你必须填充一个名为 `input_handler` 的结构体，并如下方式将其注册到输入内核：\n\
  \n![image](img/216tab01.jpg)\n\n查看 `mousedev`（`/drivers/input/mousedev.c`）的实现以获取完整示例。\n\
  \n## 输入设备驱动\n\n让我们关注键盘、鼠标和触摸屏等常见输入设备的驱动。但在之前，让我们快速查看一下输入驱动程序可用的现成硬件访问设施。\n\n####\
  \ Serio\n\n`serio` 层提供了库函数，用于访问遗留输入硬件，例如与 `i8042` 兼容的键盘控制器和串口。PS/2 键盘和鼠标与前者接口，而串口触摸控制器则连接到后者。要与由\
  \ `serio` 服务的硬件进行通信（例如，向 PS/2 鼠标发送命令），请使用 `serio_register_driver()` 为 `serio` 注册指定的调函数。\n\
  \n要作为 `serio` 的一部分添加新驱动程序，请使用 `serio_register_port()` 注册 `open()/close()/start()/stop()/write()`\
  \ 入口。查看 `drivers/input/serio/serport.c` 以获取示例。\n\n如在图 7.1 所示，`serio` 只是访问底层硬件的途径之一。许多输入设备驱动程序依赖于\
  \ `USB` 或 `SPI` 等总线层的底层支持。\n\n#### 键盘\n\n键盘有不同的类型——遗留 PS/2、USB、蓝牙、红外等。每种类型都有特定的输入设备驱动程序，但它们都使用相同的键盘事件驱动程序，从而确保向用户提供一致的接口。然而，键盘事件驱动程序与其他事件驱动程序相比有一个独特的特征：它将数据传递给另一个内核子系统（`tty`\
  \ 层），而不是通过 `/dev` 节点传递到用户空间。\n\n#### PC 键盘\n\nPC 键盘（也称为 PS/2 键盘或 AT 键盘）通过与 `i8042`\
  \ 兼容的键盘控制器接口。桌面电脑通常有专用的键盘控制器，但在笔记本电脑上，键盘接口是通用嵌入式控制器的职责之一（参见第 20 章中的“嵌入式控制器”节和“更多设备和驱动程序”）。当你在\
  \ PC 键盘上按键时，其路径如下：\n\n1. 键盘控制器（或嵌入式控制器）扫描并解码键盘矩阵，并处理键去抖等细节。\n2. 键盘设备驱动程序在 `serio`\
  \ 的帮助下，为每次按下和释放从键盘控制器读取原始扫描码（scancodes）。按下和释放的区别在于最高位，释放时该位为 1。例如，按下“a”键产生一对扫描码，`0x1e`\
  \ 和 `0x9e`。特殊键使用 `0xE0` 进行转义，因此按下右方向键会产生序列（`0xE0 0x4D 0xE0 0xCD`）。你可以使用 `showkey`\
  \ 工具来观察。\n3. 正如在图 7.1 所示，`serio` 只是访问底层硬件的途径之一。许多输入设备驱动程序依赖于 `USB` 或 `SPI` 等总线层的底层支持。\n\
