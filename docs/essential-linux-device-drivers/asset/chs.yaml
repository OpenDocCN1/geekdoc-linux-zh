  \n目录\n\n# 前言\n\n如果你正手拿着这本书，你可能在问自己：为什么又是“又一本”Linux 设备驱动书籍？难道不是已经有一堆书了吗？\n\n答案是：这本书在其他书籍的基础上实现了质的飞跃。\n\
  \n首先，它是最新的，涵盖了最近的 2.6 内核。其次，更重要的一点是，这本书非常详尽。大多数设备驱动书籍仅涵盖了标准 Unix 内部原理书或操作系统书中描述的主题，如串口、磁盘驱动器和文件系统，如果你运气好，还会涵盖网络栈。\n\
  \n这本书则要深入得多；它并不回避你在现代 PC 和嵌入式硬件上必须处理的难题，例如 PCMCIA、USB、I²C、视频、音频、闪存内存、无线通信等。只要是你能想到的，只要\
  \ Linux 内核与之通信，这本书就会告诉你相关内容。\n\n它不遗漏任何细节，不让任何一个暗角被忽视。\n\n此外，作者已经证明了自己的实力：仅仅读读他关于\
  \ 20 世纪 90 年代后期将 Linux 放到手表上的描述，都是一种非常刺激的体验！\n\n我很高兴这本书能成为普伦廷出版社（Prentice Hall）开源软件开发系列的一部分。它是开源世界正在发生的精彩事的典范。我希望你在这里找到内核工作所需的知识，并让你也享受这一过程！\n\
  \nArnold Robbins\n丛书编辑\n\n# 前言\n\n那是 20 世纪 90 年代后期，我们在 IBM 正在将 Linux 内核移植到手表上。目标设备非常微小，但任务被证明非常艰巨。内核中当时不存在内存技术设备（Memory\
  \ Technology Devices）子系统，这意味着在文件系统于手表的闪存上运行之前，我们必须从头开发必要的存储驱动程序。将手表的触摸屏与用户应用程序接口是非常复杂的，因为内核的输入事件驱动接口尚未被构想。在手表的\
  \ LCD 上运行 X Windows 并不容易，因为它与帧缓冲驱动程序的兼容性不好。如果你不能在浴缸里流式查看股票报价，那么防水 Linux 手表有什么用呢？蓝牙与\
  \ Linux 的集成还需要几年时间，我们花费了几个月的时间移植一个专有的蓝牙栈以使手表联网。电源管理支持仅足以从手表电池中挤出几小时的电力；因此，在这方面我们也有大量工作要做。Linux\
  \ 红外（Linux-Infrared）当时仍然不稳定，所以在在使用红外键盘进行数据输入之前，我们必须反复调试该栈。我们还必须编译编译器并交叉编译一套紧凑的应用程序集，因为当时在消费电子领域还没有被接受的发行版。\n\
  \n回到现在：那只小企鹅已经成长了一只健康的青少年。那时需要数千行代码和一年开发时间的工作，在现在的内核中几天内就能完成。但要成为一个能够神奇地编织解决方案的全能型内核工程师，你需要理解\
  \ Linux 今日提供的无数功能和设施。\n\n## 关于本书\n\n在位于内核源码树的各种子系统中，`drivers/` 目录构成了最大的部分，其规模是其他部分的几倍。随着新颖多样化的技术以流行的外形式出现，内核中新设备驱动程序的开发正在稳步加速。最新的内核支持了超过\
  \ 70 种设备驱动程序族。\n\n这本书是关于编写 Linux 设备驱动程序的。它涵盖了内核支持的主要设备类的设计和开发，包括我在“Linux 进手表”期间错过的那些。对每个驱动程序族的讨论都从查看相关技术开始，转向开发一个实用示例，最后以查看相关的内核源码文件结束。在进入设备驱动程序世界之前，本书将向你介绍内核，并讨论\
  \ 2.6 Linux 的重要特性，强调那些对设备驱动程序编写者特别感兴趣的部分。\n\n## 读者群\n\n本书旨在渴望通过修改内核来启用新设备的中级程序员。你应该已经对操作系统概念有操作性的知识。例如，你应该知道什么是系统调用，以及为什么在编写内核代码时必须考虑并发问题。本书假设你已经在系统中下载了\
  \ Linux，翻阅过内核源码，并至少快速读过了一些相关文档。而且你的 C 语言水平应该很不错。\n\n## 章节摘要\n\n前 4 章将为你消化书的其余内容做准备。接下来的\
  \ 16 章讨论了不同设备族的驱动程序。接下来是一章描述设备驱动程序调试技术的章节。倒数第二章提供了关于维护和交付的观点。我们通过通过一个清单结束，该清单总结了当你获取一个新设备时如何开启你的\
  \ Linux 支持化之路。\n\n第 1 章 “引言”开启了我们与 Linux 的缘分。它带你快速完成下载内核源码、进行细微代码更改并构建可引导内核镜像的过程。\n\
  \n第 2 章 “探秘内核内部”快速查看了 Linux 内核的内部，并教你一些必须掌握的内核概念。它首先带你了解启动过程，然后描述了与驱动开发特别相关的内核服务，如内核定时器、并发管理和内存分配。\n\
  \n第 3 章 “内核设施”检查了驱动程序开发者工具箱中有用的内核服务。章节从查看内核线程开始，这是内核内部实现后台任务的方法。然后转向链表、工作队列、完成函数和通知链等辅助接口。这些辅助设施简化了你的代码，消除了内核中的冗余，并有助于长期维护。\n\
  \n第 4 章 “基础工作”为掌握编写 Linux 设备驱动的艺术建立基础。它通过提供典型 PC 系统和嵌入式设备的架构视角引入了设备和驱动程序。它随后查看了中断处理和内核设备模型等基础驱动概念。\n\
  \n第 5 章 “字符驱动程序”查看了字符驱动程序的架构。本章介绍的几个概念如轮询、异步通知和 I/O 控制也适用于后续章节，因为书中讨论的许多设备类都是“超级”字符设备。\n\
  \n第 6 章 “串口驱动程序”解释了处理串口设备的内核层。\n\n第 7 章 “输入驱动程序”讨论了负责服务键盘、鼠标和触摸屏控制器等设备的内核输入子系统。\n\
  \n第 8 章 “集成电路协议”剖析了连接到系统 I²C 总线或 SMBus 的设备（如 EEPROM）驱动程序。本章还查看了其他串口接口，如 SPI 总线和单线总线。\n\
  \n第 9 章 “PCMCIA 和快速闪存”深入研究 PCMCIA 子系统。它教你为具有 PCMCIA 或 Compact Flash 的设备编写驱动程序。\n\
  \n第 10 章 “外围部件接口”查看了内核对 PCI 及其衍生变的支持。\n\n\n\n\n\n# 第 11 章：通用串行总\n`第 11 章`，“通用串行总”探索了\
  \ USB 架构，并解释了如何使用 `Linux-USB` 子服务的服务为 `USB` 设备编写驱动程序。\n\n# 第 12 章：视频驱动\n`第 12 章`，“视频驱动”研究了\
  \ `Linux-Video` 子系统。它发现了帧缓冲区（frame buffer）抽象化提供的优势，并教你编写 `frame buffer` 驱动程序。\n\n\
  # 第 13 章：音频驱动\n`第 13 章`，“音频驱动”描述了 `Linux-Audio` 框架，并解释了如何实现音频驱动。\n\n# 第 14 章：块驱动\n\
  `第 14 章`，“块驱动”侧重于用于硬盘等存储设备的驱动程序。在本章中，你还将学习由 `Linux-Block` 子系统支持的各种 `I/O` 调度器。\n\n\
  # 第 15 章：网络接口卡\n`第 15 章`，“网络接口卡”致力于网络设备驱动程序。你将学习内核网络数据结构以及如何将网络驱动程序与协议层接口。\n\n#\
  \ 第 16 章：无线的 Linux\n`第 16 章`，“无线的 Linux”查看了不同无线技术的驱动，如 `Bluetooth`、`Infrared`、`WiFi`\
  \ 和蜂窝通信。\n\n# 第 17 章：内存技术设备\n`第 17 章`，“内存技术设备”讨论了嵌入式设备上的闪存启用。该章节通过检查 PC 系统上的 `Firmware\
  \ Hub`（固件中心）驱动程序作为结束。\n\n# 第 18 章：嵌入 Linux\n`第 18 章`，“嵌入 Linux”进入了嵌入式 `Linux` 的世界。它带你了解嵌入式解决方案的主要固件组件，如\
  \ `bootloader`、`kernel`（内核）和设备驱动程序。鉴于 `Linux` 在嵌入式领域的日益普及，你更有可能使用从书中获得的设备驱动程序技能来启用嵌入式系统。\n\
  \n# 第 19 章：用户态驱动程序\n`第 19 章`，“用户态驱动程序”查看了从用户空间驱动不同类型的设备。某些设备驱动程序，特别是那些对策略要求高而对性能要求低的驱动程序，更适合留在用户态。本章还解释了\
  \ `Linux process scheduler` 如何影响用户态驱动程序的响应时间。\n\n# 第 20 章：更多设备和驱动程序\n`第 20 章`，“更多设备和驱动程序”遍历了在此之前涵盖的各种驱动族，例如\
  \ `Error Detection And Correction (EDAC)`（错误检测与修正）、`FireWire` 和 `ACPI`。\n\n# 第 21\
  \ 章：调试设备驱动程序\n`第 21 章`，“调试设备驱动程序”教授了用于调试内核代码的不同调试器。在本章中，你还学习了使用 `trace tools`、`kernel\
  \ probes`（内核探针）、`crash-dump` 和 `profilers`（性能分析器）。当你开发驱动程序时，请武装备好在本章中学到的驱动程序调试技能。\n\
  \n# 第 22 章：维护与交付\n`第 22 章`，“维护与交付”提供了软件开发周期的视角。\n\n# 第 23 章：关机\n`第 23 章`，“关机”在你着对新设备进行\
  \ `Linux-enabling`（Linux 启用）时，带你完成一份工作项清单。本书以思考 `接下来是什么？` 结束。\n\n设备驱动程序有时需要用汇编实现代码段，因此`附录\
  \ A，“Linux 汇编”查看了 `Linux` 上汇编编程的不同方面。基于 `x86` 的系统的某些设备驱动程序直接或间接地依赖于 `BIOS`，因此`附录\
  \ B，“Linux 与 BIOS”教你 `Linux` 如何与 `BIOS` 交互。`附录 C，“Seq Files”描述了 `seq files`，这是 `2.6`\
  \ 内核引入的内核辅助接口，设备驱动程序可以使用它来监控和跟踪数据点。\n\n书是……（等一下，让我遵循提供的格式）\n\n书是……（等一下，让我遵循提供的格式）\n\
