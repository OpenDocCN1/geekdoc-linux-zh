  \ 2.4 内核，你的线程如果不进入睡眠将冻结系统。如果你注释掉 Listing 3.1 中的 `schedule()` 并在内核配置中禁用 `CONFIG_PREEMPT`，你的系统将锁死。\n\
  \n当我们在第 19 章 “用户空间中的驱动程序”中讨论调度策略时，你将学习如何从内核线程获取实时响应。\n\n## 进程状态与等待队列\n\n以下是来自 Listing\
  \ 3.1 的在等待事件时让 `mykthread` 进入睡眠状态的代码区域：\n\n```bash\n![image](img/p0061-01.jpg)\n\
  ```\n\n上述代码段的操作基于两个概念：等待队列和进程状态。\n\n等待队列持有需要等待事件或系统资源的线程。等待队列中的线程会进入睡眠，直到被负责检测事件的另一个线程或中断处理程序唤醒。入队和出队分别使用\
  \ `add_wait_queue()` 和 `remove_wait_queue()` 完成，而唤醒队列中的任务则通过 `wake_up_interruptible()`\
  \ 完成。\n\n内核线程（或普通进程）可以处于以下进程状态之一：运行、可中断、不可中断、僵尸、停止、被跟踪（traced）或死亡。这些状态定义在 `include/linux/sched.h`\
  \ 中：\n\n- 运行状态（`TASK_RUNNING`）的进程位于调度器运行队列中，是调度器分配 CPU 时间的候选者。\n- 可中断状态（`TASK_INTERRUPTIBLE`）的任务正在等待事件发生，不在调度器运行队列中。当任务被唤醒或接收到信号时，它会重新进入运行队列。\n\
  - 不可中断状态（`TASK_UNINTERRUPTIBLE`）与可中断状态类似，区别在于不会接收信号。\n- 僵尸状态（`TASK_ZOMBIE`）进程已结束但尚未被父进程回收。\n\
  - 停止状态（`TASK_STOPPED`）任务已停止。\n- 被跟踪状态（`TASK_TRACED`）任务正被调试器跟踪。\n- 死亡状态（`EXIT_DEAD`）任务已退出。\n\
  \n\n\n\n\n内核中存在许多实用的辅助接口，可以让设备驱动程序开发人员的工作更轻松。一个例子就是双向链表库的实现。许多驱动程序需要维护和操作数据结构的链表。内核的列表接口例程消除了手动追踪列表指针以及调试与列表维护相关的混乱问题的需要。让我们来学习使用这些辅助接口，如列表（lists）、`hlists`、工作队列（work\
  \ queues）、完成完成函数（completion functions）、通知器块（notifier blocks）和内核线程（kthreads）。\n\n\
  有其他方法可以实现辅助设施提供的功能。例如，你可以实现自己的列表操作例程而不是使用列表库，或者使用内核线程来推迟工作而不是将其提交到工作队列。然而，使用标准的内核辅助接口可以简化你的代码，剔除内核中的冗余，提高代码可读性，并有助于长期维护。\n\
  \n由于内核非常庞大，你总能找到尚未利用这些辅助机制的部分，因此更新这些代码区域可能是开始贡献内核开发的良好方法。\n\n## 链表 (Linked Lists)\n\
  \n要编织数据结构的双向链表，请使用 `include/linux/list.h` 中提供的函数。本质上，你是在数据结构内部嵌入一个 `struct list_head`：\n\
  \n![image](img/p0065-01.jpg)\n\n`mylist` 是连接不同 `mydatastructure` 实例的链。如果你在 `mydatastructure`\
  \ 内部嵌入了多个 `list_head`，它们每一个都构成一个链，使 `mydatastructure` 成为新列表的成员。你可以使用列表库从单个列表中添加或删除成员关系。\n\
  \n在进入细节之前，为了了解概况，让我们总结一下列表库提供的链表编程接口。这在表 3.1 中完成。\n\n表 3.1. 链表操作函数\n\n![image](img/066tab01.jpg)\n\
  \n为了说明列表的使用，让我们来实现一个示例。该示例也作为理解工作队列概念的基础，工作队列将在下一节中讨论。假设你的内核驱动程序需要从一个入口点执行一项耗时任务。一个示例是强制调用线程进行睡眠等待的任务。自然地，你的驱动程序不喜欢阻塞直到任务完成，因为这会降低依赖它的应用程序的响应速度。因此，每当驱动程序需要执行这项昂贵的工作时，它都会通过将相应的例程添加到工作函数链表中来推迟执行。实际工作由内核线程执行，该线程遍历列表并在后台执行工作函数。驱动程序将工作函数提交到列表尾部，而内核线程则从列表头部向前推进，从而确保先入队的工作先完成。当然，驱动程序的其他部分需要设计以适应这种延迟执行方案。然而，在理解这个示例之前，请注意我们将使用代码列表\
  \ 3.5 中的工作队列接口以更简单的方式实现相同的任务。\n\n让我们首先介绍示例中使用的关键驱动程序数据结构：\n\n![image](img/p0066-01.jpg)\n\
