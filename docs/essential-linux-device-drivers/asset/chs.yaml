- "# Linux 设备驱动必备指南\n\n\n\n![](img/9780132715812.jpg)\n\n\n\n\n开源技术彻底改变了计算世界。许多大型项目已在全球范围内投入生产，例如\
  \ `Apache`、`MySQL` 和 `Postgres`，使用 `Perl`、`Python` 和 `PHP` 等多种语言编写应用程序。这些技术被应用于许多不同的系统，从专有系统、`Linux`\
  \ 系统，再到传统的 `UNIX` 系统和大型机。\n\n普伦汀出版社开源软件开发系列旨在为你带去这些开源技术的精髓。你不仅将学习如何将它们应用于你的项目，还将从中学习。通过查看来自真实应用的真实代码，你将学到全球开源开发者的最佳实践。\n\
