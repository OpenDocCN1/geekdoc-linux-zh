  \ 使用作为第二个参数传递的临时变量（`temp`）来解决这个问题。\n\n## 哈希列表 (Hash Lists)\n\n之前讨论的双向链表实现对于实现哈希表等链接数据结构的情况并不是最优的。因为哈希表只需要包含单个指针的列表头。为了减少此类应用的内存开销，内核提供了哈希列表（hlists），它是列表的一种变体。与列表头和列表节点使用相同结构的列表不同，hlist\
  \ 有独立的定义：\n\n![image](img/p0072-01.jpg)\n\n为了适应单指针 hlist 头的方案，节点维护的是指向前一个节点的指针地址，而不是指针本身。\n\
  \n\n\n\n\n哈表使用 `hlist_head` 数组来实现。每个 `hlist_head` 溯源一个由 `hlist_node` 组成的双向链表。使用哈希函数来定位\
  \ `hlist_head` 数组中的索引（或桶）。完成后，你可以使用 hlist 辅助程序（同样在 `include/linux/list.h` 中定义）来操作链接到所选桶的\
  \ `hlist_nodes` 列表。可以查看 `fs/dcache.c` 中目录缓存（dcache）的实现以获取示例。\n\n## 工作工作队列 (Work\
  \ Queues)\n\n工作队列是在内核内部推迟工作的一种方式。推迟工作在许多情况下都是非常有用的。示例包括：\n\n*   响应错误中断时重启网络适配器\n\
  *   文件系统任务，如同步磁盘缓冲区\n*   向磁盘发送命令并跟踪存储协议状态机\n\n工作队列的功能与 Listing 3.2 到 3.4 中描述的示例相似。然而，工作队列可以帮助你以更简单的方式完成相同的任务。\n\
  \n工作队列辅助库向用户暴露了两个接口结构：`workqueue_struct` 和 `work_struct`。按照以下步骤使用工作队列：\n\n1.  创建一个工作队列（或\
  \ `workqueue_struct`），并关联一个或多个内核线程。要创建一个用于为 `workqueue_struct` 服务的内核线程，请使用 `create_singlethread_workqueue()`。要为系统中的每个\
  \ CPU 创建一个工作线程，请使用 `create_workqueue()` 变体。内核还有默认的每个 CPU 工作线程（`events/n`，其中 `n`\
  \ 是 CPU 编号），你可以进行时间片共享，而不是请求单独的工作线程。根据你的应用程序，如果没有专用的工作线程，可能会导致性能下降。\n2.  创建一个工作元素（或\
  \ `work_struct`）。使用 `INIT_WORK()` 初始化 `work_struct`，它会向其中填充你的工作函数的地址和参数。\n3.  将工作元素提交到工作队列。可以使用\
  \ `queue_work()` 将 `work_struct` 提交到专用队列，或使用 `schedule_work()` 提交到默认内核工作线程。\n\n\
  让我们重写 Listing 3.2 到 3.4 以利用工作队列接口。这在 Listing 3.5 中完成。整个内核线程，以及自旋锁和等待队列在工作队列接口内部消失了。如果你使用默认内核工作线程，即使是对\
  \ `create_singlethread_workqueue()` 的调用也会消失。\n\nListing 3.5. 使用工作队列推迟工作\n\n![image](img/p0073-01.jpg)\n\
  \n***\n\n如果你正在使用工作队列，除非将你的模块声明为 GPL 许可，否则你将获得链接器错误。这是因为内核仅向 GPL 许可的代码导出这些函数。如果你查看内核工作队列的实现，你会看到这种限制出现在如下语句中：\n\
  \n```\nEXPORT_SYMBOL_GPL(queue_work);\n```\n\n要宣布你的模块受 GPL 著权许可，请声明以下：\n\n```\n\
  MODULE_LICENSE(\"GPL\");\n```\n\n***\n\n## 通知链 (Notifier Chains)\n\n通知链用于向请求它们的代码区域发送状态更改消息。与硬编码机制不同，通知器在生成感兴趣的事件时提供了一种通用的告警技术。通知器最初添加用于将网络事件传递给内核的相关部分，但现在被用于许多其他用途。内核为重大事件实现了预定义的通知器。此类通知的示例包括：\n\
  \n*   死亡通知（Die notification）：当内核函数由于“oops”、页错误或命中断点而触发陷阱或故障时发送。例如，如果你正在为医疗级网卡编写设备驱动程序，你可能希望注册死亡通知器，以便在发生内核恐慌（kernel\
  \ panic）时尝试关闭医疗设备。\n*   网络设备通知（Net device notification）：当网络接口启动或关闭时生成。\n*   CPU\
  \ 频率通知（CPU frequency notification）：当处理器频率发生变化时分发。\n*   IP 地址通知（Internet address\
  \ notification）：当检测到网络接口 IP 地址变化时发送。\n\n通知器的一个示例用户是高级数据链路控制（HDLC）协议驱动程序 `drivers/net/wan/hdlc.c`，它注册到网络设备通知链中以感知载波变化。\n\
  \n要将你的代码挂到通知链上，你必须向关联链注册事件处理程序。当生成相关事件时，事件标识符和特定于通知器的参数将作为参数传递给处理程序。要定义自定义通知链，你必须额外实现在检测到事件时触发该链的基础设施。\n\
  \nListing 3.6 包含了使用预定义和用户定义通知器的示例。Table 3.2 简要描述了 Listing 3.6 使用的通知链及其传播的事件，因此请查看列表和表格。\n\
  \nTable 3.2. 通知链及传播的事件\n\n![image](img/076tab01)\n\n当你的模块被释放时，你必须从通知链中注销事件处理程序。例如，如果你在卸载\
  \ Listing3.6 中的代码后启动或关闭网络接口，你将受到“oops”的困扰，除非你在模块的 `release()` 方法中执行 `unregister_netdevice_notifier(&dev_notifier)`。这是因为通知链仍然认为处理程序代码是有效的，尽管它已经从内核中移出。\n\
  \nListing 3.6. 通知事件处理程序\n\n![image](img/p0076-01)\n![image](img/p0077-01)\n![image](img/p0078-01)\n\
  \nListing 3.6 中的 `my_noti_chain` 使用 `BLOCKING_NOTIFIER_HEAD()` 声明为阻塞式通知器，并通过 `blocking_notifier_chain_register()`\
  \ 注册。这意味着通知处理程序始终从进程上下文中调用。因此，处理程序函数 `my_event_handler()` 允许睡眠。如果你的通知器处理程序可以从中断上下文中调用，请使用\
  \ `ATOMIC_NOTIFIER_HEAD()` 定义通知链，并通过 `atomic_notifier_chain_register()` 注册它。\n\n\
  ***\n\n### 旧的通知器接口\n\n2.6.17 之前的版本的内核仅支持通用通知链。通知器注册函数 `notifier_chain_register()`\
  \ 在内部使用自旋锁保护，但遍历通知链并将事件分发给通知器处理程序的程序（`notifier_call_chain()`）是无锁的。缺乏锁是因为处理程序函数可能会睡眠、在运行期间注销自身或从中断上下文中被调用。新的通知器\
  \ API 构建在原始接口之上，并旨在克服旧的局限性。\n\n***\n\n### 完成接口 (Completion Interface)\n\n内核的许多部分作为单独的执行线程启动某些活动，然后等待它们完成。完成接口是实现此类代码模式的一种高效且简单的方法。\n\
  \n一些示例用法场景包括：\n\n*   你的驱动模块由一个内核线程辅助。如果你使用 `rmmod` 移除模块，在从内核空间中移除模块代码之前会调用 `release()`\
  \ 方法。释放例程请求线程自杀并阻塞直到线程完成退出。Listing 3.7 实现了此案例。\n\n\n\n\n\n*   你正在编写一个块设备驱动程序（在第\
  \ 14 章“块设备驱动””中讨论过），该程序向设备队列一个读取请求。这会触发一个通过独立线程或工作队列实现的的状态机变更。驱动程序希望在继续其他活动之前等待操作完成。请参考\
  \ `drivers/block/floppy.c` 示例。\n\n*   一个应用程序请求一个模数转换器（ADC）驱动程序来获取数据样本。驱动程序发起转换请求并等待，直到中断信号指示转换完成然后返回数据。\n\
  \n列表 3.7. 使用完成（Completion）函数同步\n\n![image](img/p0079-01.jpg)\n\n![image](img/p0080-01.jpg)\n\
  \n![image](img/p0080-02.jpg)\n\n可以使用 `DECLARE_COMPLETION()` 静态声明完成对象，或使用 `init_completion()`\
  \ 动态创建。线程可以通过 `complete()` 或 `complete_all()` 帮助信号完成。调用者可以通过 `wait_for_completion()`\
  \ 等待完成。\n\n在列表 3.7 中，`my_release()` 在唤醒 `my_thread()` 之前通过设置 `pink_slip` 产生退出请求标记。然后它调用\
  \ `wait_for_completion()` 等待 `my_thread()` 完成退出。`my_thread()` 唤醒后发现 `pink_slip`\
  \ 被设置，并执行以下操作：\n\n1. 向 `my_release()` 发送完成信号\n2. 杀死自己\n\n`my_thread()` 使用 `complete_and_exit()`\
  \ 原子地完成这两个步骤。使用 `complete_and_exit()` 可以关闭在如果分别调用 `complete()` 和 `exit()` 时会在模块退出和线程退出之间开启窗口。\n\
  \n我们将在第 11 章中开发示例遥测驱动程序时使用完成 API。\n\n## Kthread 辅助函数\n\nKthread 辅助函数在原始线程创建例程之上添加了一层封装，并简化了线程管理任务。\n\
  \n列表 3.8 使用 kthread 辅助接口重写了列表 3.7。`my_init()` 现在使用 `kthread_create()` 而不是 `kernel_thread()`。你可以将线程的名称传递给\
  \ `kthread_create()`，而不是在线程内部显式调用 `daemonize()`。\n\nkthread 接口让你免费访问一个使用完成接口实现的内置退出同步机制。因此，如列表\
  \ 3.8 中的 `my_release()` 所做的那样，你可以直接调用 `kthread_stop()`，而无需费力地设置 `pink_slip`、唤醒 `my_thread()`\
  \ 并使用 `wait_for_completion()` 等待其完成。同样，`my_thread()` 可以简洁地调用 `kthread_should_stop()`\
  \ 来检查它是否应该结束工作。\n\n列表 3.8. 使用 Kthread 辅助函数同步\n\n![image](img/p0081-01.jpg)\n\n![image](img/p0082-01.jpg)\n\
  \n与其像列表 3.8 那样使用 `kthread_create()` 创建线程并通过 `wake_up_process()` 激活它，你也可以使用以下单一调用：\n\
  \n```\nkthread_run(my_thread, NULL, \"%s\", \"my_thread\");\n```\n\n## 错误处理辅助\n\n\
  多个内核函数返回指针值。虽然调用者通常通过将返回值与 `NULL` 比较来检查失败，但他们通常需要更多信息来解析发生错误性质。由于内核地址具有冗余位，可以对其进行负载以编码错误语义。这是通过一组辅助例程实现的。列表\
  \ 3.9 实现了一个简单的用法示例。\n\n列表 3.9. 使用错误处理辅助\n\n![image](img/p0084-01.jpg)\n\n如果 `kmalloc()`\
  \ 在列表 3.9 的 `collect_data()` 中失败，你将得到以下消息：\n\n`Error returned is -12!`\n\n然而，如果\
  \ `collect_data()` 成功，它将返回指向数据缓冲区的有效指针。作为另一个示例，让我们使用 `IS_ERR()` 和 `PTR_ERR()` 为列表\
  \ 3.8 中的线程创建代码添加错误处理：\n\n![image](img/p0084-02.jpg)\n\n### 查看源码\n\nksoftirqd、pdflush\
  \ 和 khubd 内核线程分别位于 `kernel/softirq.c`、`mm/pdflush.c` 和 `drivers/usb/core/hub.c`。\n\
  \n`daemonize()` 函数可以在 `kernel/exit.c` 中找到。用户态辅助程序的实现，请查看 `kernel/kmod.c`。\n\nlist\
  \ 和 hlist 库例程位于 `include/linux/list.h`。它们被用于内核，因此你会在大多数子目录中找到用法示例。例如是定义在 `include/linux/list.h`\
  \ 中的 `request_queue` 结构。\n\n\n\n\n\n图 4.1 显示了典型 PC 兼容系统的硬件框图。如你所示，系统支持多种设备和接口技术，例如内存、视频、音频、USB、PCI、WiFi、PCMCIA、I²C、IDE、以太网、串口、键盘、鼠标、软驱、并行端口和红外。在\
  \ PC 架构中，内存控制器和图形控制器是北桥（North Bridge）芯片的一部分，而外设总线来自南桥（South Bridge）。\n\n图 4.1。PC\
  \ 兼容系统的硬件框图。\n\n![image](img/04fig01.gif)\n\n图 4.2 展示了一个假设嵌入式设备的类似框图。该图包含了几个 PC\
  \ 世界并不常见的接口，如闪存、LCD、触摸屏和蜂窝调制解调器。\n\n图 4.2。嵌入式系统的硬件框图。\n\n![image](img/04fig02.gif)\n\
  \n当然，访问外部设备的能力是系统功能的关键部分。设备驱动程序提供了实现这一点的引擎。本书的其余章节将专注于设备接口，并教你如何实现相应的设备驱动程序。\n\n\
  ### 中断处理\n\n由于 I/O 的不确定性以及 I/O 设备与处理器之间的速度差异，设备通过异步断言某些硬件信号来请求处理器关注。这些硬件信号被称为中断。每个中断设备都分配有一个关联的标识符，称为中断请求（IRQ）号。当处理器检测到\
  \ IRQ 上产生中断时，它会突然停止正在的工作，并调用为相应 IRQ 注册的中断服务程序（ISR）。中断处理程序（ISR）在中断上下执行。\n\n#### 中断上下文\n\
  \nISR 是直接与硬件交互的关键代码。为了系统性能的全局利益，它们被赋予了立即执行的权限。然而，如果 ISR 不快速且轻量，它们就违背了自己的哲学。VIP 受到优先对待，但他们有责任尽力减少因此对公众造成的不便。为了补偿粗暴地中断当前的执行线程，ISR\
  \ 必须在被称为中断上下文（或原子上下文）的限制环境中礼貌地执行。\n\n以下是在中断上下执行代码的注意事项准则和禁忌：\n\n1. 如果你的中断上下文代码进入了睡眠，那将是“入狱罪”。中断处理程序不能通过调用\
  \ `schedule_timeout()` 等睡眠函数来放弃处理器。在从中断处理程序调用内核 API 之前，要穿透嵌套调用链，确保它在内部不会触发阻塞等待。例如，`input_register_device()`\
  \ 表面上无害，但在底层触发了一个对 `kmalloc()` 的调用，并指定 `GFP_KERNEL` 作为参数。正如你在第 2 章中看到的，“内核内部”，如果你的系统空闲内存低于水位，如果你这样调用它，`kmalloc()`\
  \ 将睡眠等待交换程序释放内存。\n\n2. 为了保护中断处理程序内部的临界区，你不能使用互斥锁（mutexes），因为它们可能会睡眠。请使用自旋锁（spinlocks），并且仅在必要时使用。\n\
  \n3. 中断处理程序不能直接与用户空间交换数据，因为它们没有通过进程上下文连接到用户态。这引出了中断处理程序不能睡眠的另一个原因：调度器以进程为粒度工作的，因此如果中断处理程序睡眠并被调度出去，它们如何能被放回运行队列？\n\
  \n4. 中断处理程序应该快速离开现场，但预期要完成工作。为了规避这种进退两难的境地，中断处理程序通常将工作一分为两部分。处理程序的精简“上半部分”（top half）标记一个确认，声称已处理中断，但实际上，它将所有繁重工作卸载给肥大的下半部分”（bottom\
  \ half）。下半部分的执行被推迟到之后所有中断都开启的时间点。你将在以后讨论 softirqs 和 tasklets 时学习开发下半部分。\n\n5. 你不需要设计可重入的中断处理程序。当一个中断处理程序运行时，相应的\
  \ IRQ 会被禁用，直到处理程序返回。因此，与进程上下文代码不同，同一个处理程序的不同实例不会在多个处理器上同时运行。\n\n6. 中断处理程序可能会被关联更高优先级\
  \ IRQ 的处理器中断。你可以通过专门请求内核将你的中断处理程序视为快速处理程序（fast handler）来防止这种嵌套中断。快速处理器在本地处理器关闭所有中断的情况下运行。在禁用中断或将你的中断处理程序标记为快速之前，请注意关闭中断的时间对系统性能不利。关闭中断的时间越长，中断延迟（即产生的中断到被处理之前的延迟）越大。中断延迟与系统的实时响应能力成反比。\n\
  \n函数可以通过检查 `in_interrupt()` 返回的值来判断它是否在中断上下文中执行。\n\n与外部硬件生成的异步中断不同，还有一类中断是同步到达的。同步中断之所以被称为同步，是因为它们不是意外发生的——处理器本身通过执行指令来产生它们。外部中断和同步中断都使用相同的机制由内核处理。\n\
  \n同步中断的示例包括：\n\n* 异常（Exceptions），用于报告严重的运行时错误\n* 软件中断，例如在 x86 架构上实现系统调用的 `int 0x80`\
  \ 指令\n\n#### 分配 IRQ\n\n设备驱动程序必须将它们的 IRQ 号连接到中断处理程序。为此，它们需要知道分配给该设备的 IRQ。IRQ 分配可以是直接的，也可能需要探测。例如，在\
  \ PC 架构中，定时器中断分配到 IRQ 0，RTC 中断对应 IRQ 8。像 PCI 等现代总线技术足够复杂，可以响应关于其 IRQ 的查询（由 BIOS\
  \ 在启动时遍历总线时分配）。PCI 驱动程序可以探测设备配置空间中的预留区域并确定 IRQ。对于像工业标准架构（ISA）卡那样的旧设备，驱动程序可能需要利用特定的硬件知识来探测和解码\
  \ IRQ。\n\n查看 `/proc/interrupts` 以获取系统上活动 IRQ 的列表。\n\n#### 设备示例：滚轮\n\n现在你已经学习了中断处理的基础知识，让我们为一个滚轮设备实现一个中断处理程序。滚轮可以在某些手机和\
  \ PDA 上找到，用于方便菜单导航，并能够三种运动：顺时针旋转、逆时针旋转和按键。我们想象的滚轮接线方式是，任何这些运动都会在 IRQ 7 上中断处理器。处理器的通用输入/输出（GPIO）端口\
  \ D 的三个低位连接到滚轮设备。在这些引脚上生成的对应不同滚轮运动的波形如图图 4.3](#ch04.html_ch04fig03）所示。中断处理程序的工作是通过查看端口\
  \ D GPIO 数据寄存器来解码滚轮运动。\n\n图 4.3。滚轮产生的示例波形。\n\n![image](img/04fig03.gif)\n\n驱动程序必须首先请求\
  \ IRQ 并将其与中断处理程序关联：\n\n![image](img/p0095-01.jpg)\n\n\n\n\n让我们来看传递给 `request_irq()`\
  \ 的参数。在这个简单的案例中，IRQ 编号不是通过查询或探测获得的，而是根据硬件连接被硬编码为 `ROLLER_IRQ`。第二个参数 `roller_interrupt()`\
  \ 是中断处理例程。它的原型指定了返回类型为 `irqreturn_t`，如果中断被成功处理，则返回 `IRQ_HANDLED`；如果未处理，则返回 `IRQ_NONE`。返回值对于像\
  \ PCI 等 I/O 技术具有重要意义，因为在这些技术中多个设备可以共享同一个 IRQ。\n\n`IRQF_DISABLED` 标志指定该中断处理程序必须被视为快速处理器（fast\
  \ handler），因此内核在调用处理程序时必须禁用中断。`IRQF_TRIGGER_RISING` 宣告滚轮在想要发出中断时，会在中断线上产生一个上升沿。换句话说，滚轮是一个边缘触发型设备。而某些设备是电平触发的，它们在\
  \ CPU 服务中断之前会保持中断线处于激活状态。要将中断标记为电平触发，请使用 `IRQF_TRIGGER_HIGH` 标志。该参数的其他可能值还包括 `IRQF_SAMPLE_RANDOM”（用于第\
  \ 5 章中的“字符驱动”节，“伪字符驱动](#ch05.html_ch05lev1sec6)”）和 `IRQ_SHARED`指定该 IRQ 在多个设备间共享）。\n\
  \n下一个参数 `\"roll\"` 用于在 `/proc/interrupts` 等文件生成的数据中标识此设备。最后一个参数（在本例中设置为 `NULL`）仅与共享中断处理程序相关，用于标识每个共享该\
  \ IRQ 线的设备。\n\n从 2.6.19 内核开始，中断处理程序接口发生了一些变化。中断处理程序以前接受第三个参数（`struct pt_regs *`），该参数包含一个指向\
  \ CPU 寄存器的指针，但从 2.6.19 内核开始已移除。此外，`IRQF_xxx` 系列中断标志取代了 `SA_xxx` 系列。例如，在较早的内核中，你必须使用\
  \ `SA_INTERRUPT` 而不是 `IRQF_DISABLED` 来将中断处理程序标记为快速处理器。\n\n驱动程序的初始化不是请求 IRQ 的好位置，因为即使在设备未使用时，它也会占用该宝贵的资源。因此，设备驱动通常在应用程序打开设备时请求\
  \ IRQ。同样，当应用程序关闭设备时释放 IRQ，而不是在退出驱动模块时释放。释放 IRQ 的方法如下：\n\n```\nfree_irq(int irq,\
  \ void *dev_id);\n```\n\n列表 4.1 显示了滚轮中断处理程序的实现。`roller_interrupt()` 接收两个参数：作为最后一个参数传递给关联\
  \ `request_irq()` 的 IRQ 和设备标识符。结合此列表查看图 4.3。\n\n列表 4.1. 滚轮中断处理程序\n\n![image](img/p0097-01.jpg)\n\
  \n![image](img/p0098-01.jpg)\n\n![image](img/p0099-01.jpg)\n\n![image](img/p0099-02.jpg)\n\
  \n驱动程序入口点如 `read()` 和 `poll()` 与 `roller_interrupt()` 协同工作。例如，当处理程序解析轮子移动时，它会唤醒任何等待的\
  \ `poll()` 线程，这些线程可能为了响应 X Windows 等应用程序发出的 `select()` 系统调用而睡眠。回到列表 4.1，并在学习了第 5\
  \ 章中的字符驱动内部原理后，实现完整的滚轮驱动程序。\n\n第 7 章中的列表 7.3 利用了内核的输入接口将此滚轮转换为滚轮鼠标。\n\n让我们通过介绍一些在特定\
  \ IRQ 上启用和禁用中断的函数来结束本节。`enable_irq(ROLLER_IRQ)` 在滚轮移动时启用中断生成，而 `disable_irq(ROLLER_IRQ)`\
  \ 执行相反的操作。`disable_irq_nosync(ROLLER_IRQ)` 禁用滚轮中断，但不会等待任何正在执行的 `roller_interrupt()`\
  \ 实例返回。这种 `nosync` 版本的 `disable_irq()` 更快，但可能会导致竞态条件。仅在你确定不会发生竞态时使用它。`disable_irq_nosync()`\
  \ 的示例用户是 `drivers/ide/ide-io.c`，它在初始化期间阻塞中断，因为某些系统在此方面存在问题。\n\n### 软中断 (Softirqs)\
  \ 和 Tasklets\n\n如前所述，中断处理程序具有两个冲突的需求：它们负责大部分设备数据处理，但必须尽可能快退出。为了摆脱这种局面，中断处理程序被设计为两个部分：与硬件交互的匆忙且焦虑的上半部（top\
  \ half），以及在开启所有中断的情况下完成大部分处理的轻松下半部（bottom half）。与中断不同，下半部是同步的，因为内核决定了何时执行它们。内核中提供了以下机制将工作延迟到下半部：softirqs、tasklets\
  \ 和 work queues。\n\nSoftirqs 是基本的底部机制，具有很强的锁要求。它们仅被少数对性能敏感的子系统使用，例如网络层、SCSI 层和内核定时器。Tasklets\
  \ 构建在 softirqs 之上，除非你有关键的可扩展性或速度要求，否则它们更易用。softirq 和 tasklet 之间的主要区别是前者是重入的（reentrant），而后者不是。不同的\
  \ softirq 实例可以在不同的处理器上同时运行，但 tasklets 则不然。\n\n为了说明 softirqs 和 tasklets 的用法，假设上一个例子中的轮具有固有的硬件问题（例如，轮有时会卡住），导致产生不符合标准的波形。卡住的轮会不断产生中断并可能导致系统崩溃。为了解决这个问题，捕获波流，运行某些分析并动态切换到轮询模式。列表\
  \ 4.2 使用 softirqs 实现了这一点，而列表 4.3 使用了 tasklets。两者都是列表 4.1 的简化变体。这使得处理器减少为两个函数：从 GPIO\
  \ D 获取波段的 `roller_capture()`，以及对波进行算法分析并在需要时切换到轮询模式的 `roller_analyze()`。\n\n列表 4.2.\
  \ 使用 softirqs 将中断处理器的工作下载\n\n![image](img/p0100-01.jpg)\n\n要定义 softirq，你必须静态地在 `include/linux/interrupt.h`\
  \ 中添加条目。你不能动态定义。`raise_softirq()`宣告相应的 softirq 等待执行。内核将在下一个可用机会执行它。这可以在退出中断处理程序期间通过\
  \ `ksoftirqd` 内核线程。\n\n`tasklet_init()` 动态初始化 tasklet。该函数不为 `tasklet_struct` 分配内存，而是你需要传递一个已分配的地址。`tasklet_schedule()`宣告相应的\
  \ tasklet 等待执行。与中断一样，内核提供系列函数来控制多处理器系统上 tasklets 的执行状态：\n\n*   `tasklet_enable()`\
  \ 启用 tasklets。\n\n*   `tasklet_disable()` 禁用 tasklets 并等待任何正在执行的 tasklet 实例退出。\n\
  \n列表 4.3. 使用 tasklets 将中断处理器的工作下载\n\n![image](img/p0101-01.jpg)\n\n![image](img/p0102-01.jpg)\n\
  \n\n\n\n- `tasklet_disable_nosync()` 的语义与 `disable_irq_nosync()` 类似。该函数不会等待活动中的\
  \ tasklet 实例执行完毕。\n\n你已经见过中断处理程序与下半部（bottom halves）之间的区别，但它们之间也有一些相似之处。中断处理程序和 tasklets\
  \ 都是不可重入的。而且它们都不能睡眠。此外，中断处理程序、tasklets 和 softirqs 都是不可抢占的。\n\n工作队列（Work queues）是推迟中断处理程序工作的第三种方法。它们在进程上下文中执行并允许睡眠，因此可以使用互斥锁（mutexes）等休眠函数。我们在上一章查看各种内核辅助设施时已经讨论过工作队列。表\
  \ 4.1\n\n***\n\nLKML（Linux 内核邮件列表）目前正就消除 tasklet 接口的可行性进行持续论。tasklets 的优先级比进程上下文代码高，因此它们会带来延迟问题。此外，正如你所学的，它们受到限制不能睡眠且在同一\
  \ CPU 上执行。目前有人建议根据情况将所有现有 tasklets 转换为 softirqs 或工作队列。\n\n第 2 章 中提到的 `-rt` 补丁集将中断处理移动到内核线程，以实现更广泛的抢占范围。\n\
  \n***\n\n## Linux 设备模型\n\n新的 Linux 设备模型引入了类似于 C++ 的抽象，将设备驱动程序中的共性提取到总线层（bus）和核心层（core）。让我们看看构成设备模型的不同组件，如\
  \ udev、sysfs、kobjects 和设备类（device classes），以及它们对关键内核子系统（如 `/dev` 节点管理、热插拔、固件下载和模块自动加载的影响。udev\
  \ 是观察设备模型优势的最佳视角，因此让我们从这里开始。\n\n### Udev\n\n几年前当 Linux 尚处于早期时，管理设备节点并不好玩。所有需要的节点（可能多达数千个）必须在\
  \ `/dev` 目录下下静态创建。这个问题实际上可以追溯到原始 UNIX 系统。随着 2.4 内核的出现，`devfs` 诞生了，它引入了动态设备节点创建。`devfs`\
  \ 提供了在内存系统中生成设备节点的服务，但命名节点的责任仍然由设备驱动程序承担。然而，设备命名策略是管理性的，与内核结合得并不好。策略应该存在于头文件、内核模块参数或用户空间中。udev\
  \ 的出现将设备管理推向用户空间。\n\nudev 依赖以下内容来工作：\n\n1. 内核对 `sysfs` 的支持，这是 Linux 设备模型的重要部分。`sysfs`\
  \ 是在启动时挂载在 `/sys` 下的内存文件系统（规范请查看 `/etc/fstab`）。我们将在下一节查看 `sysfs`，但现在假设可以使用相应的 `sysfs`\
  \ 文件访问。\n2. 一组用户空间守护进程和工具，如 `udevd` 和 `udevinfo`。\n3. 位于 `/etc/udev/rules.d/` 目录的用户指定规则。你可以编写规则来获取设备的统一视图。\n\
  \n为了理解如何使用 udev，让我们来看一个例子。假设你有一个 USB DVD 光驱和一个 USB CD-RW 光驱。根据你热插拔这些设备的顺序，其中一个被分配名称为\
  \ `/dev/sr0`，另一个被命名为 `/dev/sr1`。在 pre-udev 时代，你必须在使用设备之前弄清楚关联名称。但有了 udev，无论它们插上或拔掉的顺序如何，你都可以一致地查看\
  \ DVD（例如 `/dev/usbdvd`）和 CD-RW（例如 `/dev/usbcdrw`）。\n\n首先，从 `sysfs` 中的对应文件中提取产品属性。假设\
  \ (Targus) DVD 光驱已被分配了设备节点 `/dev/sr0`，而 (Addonics) CD-RW 光驱被命名为 `/dev/sr1`。使用 `udevinfo`\
  \ 收集设备信息：\n\n![image](img/p0104-01.jpg)\n\n接下来，利用收集到的产品信息识别设备并添加 udev 命名规则。创建一个名为\
  \ `/etc/udev/rules.d/40-cdvd.rules` 文件并向其中添加以下规则：\n\n![image](img/p0105-01.jpg)\n\
  \n第一条规则告诉 udev，每当它发现产品 ID 为 0x0701、厂商 ID 为 0x05e3 且名称以 sr 开头的 USB 设备时，它应该在 `/dev`\
  \ 下创建一个同名节点，并为该节点创建一个名为 `usbdvd` 的符号链接。同样，第二条规则命令为 CD-RW 光驱创建一个名为 `usbcdrw` 的符号链接。\n\
  \n要测试规则中的语法错误，可以在 `/sys/block/sr*` 上运行 `udevtest`。若要在 `/var/log/messages` 中开启详细消息，请在\
  \ `/etc/udev/udev.conf` 中将 `udev_log` 设置为 \"yes\"。要使用新添加的规则动态重新填充 /dev 目录，请使用 `udevstart`\
  \ 重启 udev。完成后，你的 DVD 光驱在系统中将一致显示为 `/dev/usbdvd`。\n\n```\nmount /usbdvd\n```\n\n\
  设备的统一命名并不是 udev 的唯一功能。它还变成了热插拔管理器。udev 也负责按需加载模块和向设备下载微代码。但在深入这些功能之前，让我们基础了解设备模型的内部结构。\n\
  \n#### Sysfs, Kobjects 和设备类\n\nSysfs、kobjects 和设备类是设备模型的构建模块，但它们非常低调，倾向于留在幕后。它们大多位于总线和核心实现领域，并隐藏在为设备驱动提供服务的\
  \ API 之中。\n\nsysfs 是内核结构设备模型的用户空间体现。它与 procfs 相似，都是包含内核数据结构的内存文件系统。procfs 是内核内部的通用窗口，而\
  \ `sysfs` 专用于设备模型。因此，`sysfs` 并不是 procfs 的替代品。像进程描述符和 sysctl 参数的信息属于 procfs 而非 sysfs。很快就会发现，udev\
  \ 的大部分功能依赖于 sysfs。\n\nKobjects 引入了通用属性（如引用计数）的封装。它们通常嵌入在更大的结构中。以下是 kobject 的主要字段，定义在\
  \ `include/linux/kobject.h` 中：\n\n1. 用于引用管理的 `kref` 对象。`kref_init()` 接口初始化 kref，`kref_get()`\
  \ 增加与 kref 关联的引用计数，`kref_put()` 减少引用计数并在没有剩余引用时释放对象。\n2. 指向 `kset` 的指针，kset 是 kobject\
  \ 所属的对象集。\n3. `kobj_type`，它是描述 kobject 的对象类型。\n\nKobjects 与 `sysfs` 密相连。内核中实例化的每个\
  \ kobject 都有其 sysfs 表现。\n\n设备类（device classes）的概念是设备模型的另一个特性，是你更有可能在驱动程序使用的接口。类接口抽象了每个设备都属于更广泛类别（或分类）的想法。USB\
  \ 鼠标、PS/2 键盘和摇杆等都属于输入类，并在 `/sys/class/input/` 下拥有条目。\n\n\n\n\n\n图 4.4 显示了连接了外部 USB\
  \ 鼠标的笔记本电脑上的 sysfs 层结构。顶层总线、类和设备目录已展开，显示出 sysfs 根据设备类型及其物理连接提供了 USB 鼠标的视图。鼠标是一个输入类设备，但在物理上是一个\
  \ USB 设备，响应两个端点地址：控制端点 `ep00` 和中断端点 `ep81`。该 USB 端口属于总线 2 上的 USB 主机控制器，而 USB 主机控制器本身通过\
  \ PCI 总线桥接到 CPU。如果这些细节现在读起来还不太理解，不要担心；在读完介绍输入驱动（第 7 章）、PCI 驱动（第 10 章、“外围部件互连”）以及\
  \ USB 驱动（第 11 章）的章节后，返回本节即可。\n\n图 4.4。USB 鼠标的 sysfs 层结构。\n\n![image](img/107tab01.jpg)\n\
  \n浏览 `/sys` 并寻找与另一个设备（例如你的网卡）关联的条目，以更好地感受其层级组织结构。第 10 章中的“寻址与识别”节说明了 sysfs 如何镜像笔记本电脑上\
  \ CardBus 以太网解调卡的物理连接。\n\n类编程接口构建在 `kobjects` 和 `sysfs` 之上，因此它是深入理解设备模型组件之间端到端交互的好地方。让我们以\
  \ RTC 驱动为例。RTC 驱动（`drivers/char/rtc.c`）是一个杂项（或“misc”）驱动。我们将在第 5 章介绍字符设备驱动时详细讨论杂项驱动。\n\
  \n插入 RTC 驱动模块并查看 `/sys` 和 `/dev` 下创建的节点：\n\n![image](img/p0108-01.jpg)\n\n`/sys/class/misc/rtc/dev`\
  \ 包含了分配给该设备的设备号和从号（在下一章讨论），`/sys/class/misc/rtc/uevent` 用于热插拔（在下一节讨论），而 `/dev/rtc`\
  \ 供应用程序访问 RTC 驱动。\n\n让我们通过设备模型来理解代码流。杂项驱动在初始化期间利用 `misc_register()` 服务，如果剥离一些代码，它看起来像这样：\n\
  \n```\n![image](img/p0108-02.jpg)\n```\n\n图 4.5 继续剥离更多层次以触及设备建模的本质。它说明了层层于类、`kobjects`、`sysfs`\
  \ 和 `udev` 的转换，这些转换导致了之前列出的 `/sys` 和 `/dev` 文件的生成。\n\n图 4.5。连接设备模型的各个。\n\n![image](img/04fig05.gif)\n\
  \n查看并行端口 LED 驱动（第 5 章中“与并行端口通信”节中的 Listing 5.6）以及虚拟鼠标输入驱动（第 7 章中“设备示例：虚拟鼠标”节中的 Listing\
  \ 7.2），以作为在 sysfs 中创建设备控制文件的示例。\n\n设备模型的另一部分抽象是总线-设备-驱动编程接口。内核设备支持被清晰地结构化为总线、设备和驱动。这使得单个驱动的实现更加简单且通通用。例如，总线的实现可以搜索处理特定设备的驱动。\n\
  \n考虑内核的 I²C 子系统（在第 8 章中的“集成电路协议”中进行探索）。I²C 层由核心基础设施、总线适配器设备驱动以及客户端设备驱动组成。I²C 核心层使用\
  \ `bus_register()` 注册每个检测到的 I²C 总线适配器。当探测并检测到 I²C 客户端设备（例如，电可擦除编程只读存储器 [EEPROM]\
  \ 芯片）时，通过 `device_register()` 记录其存在。最后，I²C EEPROM 客户端驱动使用 `driver_register()` 注册自己。这些注册通过\
  \ I²C 核心提供的服务函数间接完成。\n\n`bus_register()` 向 `/sys/bus/` 添加相应的项，而 `device_register()`\
  \ 在 `/sys/devices/` 下添加条目。`struct bus_type`、`struct device` 和 `struct device_driver`\
  \ 分别是总线、设备和驱动使用的主要数据结构。查看 `include/linux/device.h` 获取它们的定义。\n\n### 热插拔与冷插拔\n\n连接到运行系统的设备被称为热插拔，而在系统启动之前连接的设备被认为是冷插拔。早期的内核通过通过调用调用注册的辅助程序向用户空间通知热插拔事件。但现在的内核通过\
  \ netlink 套接字使用 `/proc` 文件系统向用户空间发送热插拔事件。在用户空间端，负责设备创建和删除的 udev 接收并管理热插拔。\n\n为了看到热插拔处理是如何演进的，让我们考虑逐步发展的\
  \ udev 版本：\n\n1. 使用 udev-039 软件包和 2.6.9 内核，当内核检测到热插拔事件时，它调用 `/proc/sys/kernel/hotplug`。这查看热插拔配置目录（通常为\
  \ `/etc/hotplug/`）并运行例如 `/etc/hotplug/10-udev.hotplug` 以及位于 `/etc/hotplug/` 下的其他脚本。\n\
  \n![image](img/p0110-01.jpg)\n\n因此，当执行 `/sbin/udevsend` 时，它将信息传递给 udev。\n\n2. 使用\
  \ udev-058 和 2.6.11 内核，情况发生了变化。`udevsend` 工具替换了 `/sbin/hotplug`：\n\n![image](img/p0110-02.jpg)\n\
  \n3. 使用最新的 udev 和内核，udev 承担了管理热插拔的所有责任，不再依赖 `udevsend`。它现在通过 netlink 套接字直接从内核拉取热插拔事件（参见图\
  \ 4.4）。`/proc/sys/kernel/hotplug` 是空的：\n\n![image](img/p0111-01.jpg)\n\nudev 还处理冷插拔。由于\
  \ udev 是用户空间的一部分，且仅在内核启动后启动，因此需要一种特殊机制在冷插拔设备上模拟热插拔事件。在启动时，内核为 sysfs 下所有设备创建一个名为\
  \ `uevent` 的文件并在其中发出冷插拔事件。当 udev 启动时，它读取 `/sys` 中的所有 `uevent` 文件并为每个冷插拔设备生成热插拔事件。\n\
  \n### 微代码下载\n\n在某些设备准备就绪之前必须向它们提供微代码。微代码由卡上的控制器执行。驱动程序以前在头文件的静态数组中存储微代码。但这已变得不可行，因为微代码通常由设备供应商以专用二进制镜像的形式发行，这与\
  \ GPL 内核无法良好混合。另一个反对固件与内核混合的理由是它们运行不同的发布周期。解决方案似乎是在用户空间中单独维护微代码，并在需要时传递给内核。sysfs\
  \ 和 udev 为实现这一目标提供了基础设施。\n\n\n\n\n\n让我们以在某些笔记本电脑上常见的 Intel PRO/Wireless 2100 WiFi\
  \ mini PCI 卡为例。该卡围绕一个微控制器构建，该微控制器需要执行外部提供的微代码才能正常工作。让我们来看看 Linux 驱动程序下载微代码下载到卡中的步骤。假设你已经从\
  \ [`ipw2100.sourceforge.net/firmware.php`](http://ipw2100.sourceforge.net/firmware.php)\
  \ 获取了所需的微代码镜像（`ipw2100-1.3.fw`），将其保存到系统的 `/lib/firmware/` 下，并且插入了驱动模块 `ipw2100.ko`：\n\
  \n1. 在初始化期间，驱动程序调用以下函数：\n   ```\n   request_firmware(..,\"ipw2100-1.3.fw\",..);\n\
  \   ```\n2. 这向用户空间发送一个热插事件（uevent），并带有请求的微代码镜像的标识符。\n3. Udevd 接收到事件并通过调用 `/sbin/firmware_helper`\
  \ 做出响应。为此，它使用了位于 `/etc/udev/rules.d/` 下文件中类似于下面的规则：\n   ```\n   ACTION==\"add\"\
  , SUBSYSTEM==\"firmware\", RUN=\"/sbin/firmware_helper\"\n   ```\n4. `/sbin/firmware_helper`\
  \ 检查 `/lib/firmware/` 并找到请求的微代码镜像 `ipw2100-1.3.fw`。它将镜像导出到 `/sys/class/0000:02:02.0/data`。（在这种情况下，0000:02:02\
  \ 是 WiFi 卡的 PCI 总线：设备：函数标识符。）\n5. 驱动程序接收微代码并将其下载到设备。完成后，调用 `release_firmware()`\
  \ 释放相应的数据结构。\n6. 驱动程序完成剩余的初始化和 WiFi 适配器信标（beacons）。\n\n### 模块自动加载\n\n按需自动加载内核模块是\
  \ Linux 支持的一个便利功能。为了理解内核如何发出“模块故障”（module fault）以及 udev 如何处理它，让我们向笔记本电脑的 PC Card\
  \ 插槽中插入一个 Xircom CardBus 以太网适配器：\n\n1. 在编译期间，支持的设备标识符作为驱动模块对象的一部分被生成。查看支持 Xircom\
  \ CardBus 以太网组合卡的驱动（`drivers/net/tulip/xircom_cb.c`）并找到这段代码：\n   ![image](img/p0112-01.jpg)\n\
  \   这声明了驱动程序可以支持任何 PCI 厂商 ID 为 `0x115D` 且 PCI 设备 ID 为 `0x0003` 的卡（更多信息请参阅 第 10 章）。当你安装驱动模块时，`depmod`\
  \ 实用会检查模块镜像并解析设备表中存在的 ID。它随后会在 `/lib/modules/kernel-version/modules.alias` 中添加以下条目：\n\
  \   ```\n   alias pci:v0000115Dd00000003sv*sd*bc*sc*i* xircom_cb\n   ```\n   其中\
  \ `v` 代表 VendorID（厂商 ID），`d` 代表 DeviceID（设备 ID），`sv` 代表 subvendorID（子厂商 ID），`*`\
  \ 代表通配符匹配。\n2. 当你将 Xircom 卡热插到 CardBus 插槽时，内核会生成一个事件，宣布新插入设备的标识。你可以使用 `udevmonitor`\
  \ 查看生成的事件：\n   ![image](img/p0113-01.jpg)\n3. Udevd 通过 netlink socket 接收事件，并使用内核传递给它的上述\
  \ `MODALIAS` 调用 `modprobe`：\n   ```\n   modprobe pci:v0000115Dd00000003sv0000115Dsd00001181bc02sc00i00\n\
  \   ```\n4. `modprobe` 在步骤 1 期间创建的 `/lib/modules/kernel-version/modules.alias` 中找到匹配的条目，并继续插入\
  \ `xircom_cb`：\n   ![image](img/p0113-02.jpg)\n\n该卡现在可以开始上网了。\n\n在阅读完 第 10 章 后，你可能想要回顾本节。\n\
  \n### 嵌入式设备上的 udev\n\n一种观点主张在嵌入式设备上弃用 udev，转而使用静态创建的设备节点，原因如下：\n\n* udev 在每次重启时创建\
  \ `/dev` 节点，而静态节点只在软件安装时创建一次。如果你的嵌入式设备使用闪存存储，那么对于前者，持有 `/dev` 节点的闪存页在每次启动时都会经历擦除-写入周期，这会缩短闪存寿命。（闪存内存在\
  \ 第 17 章“内存技术设备”中进行了详细讨论）。不过，你确实可以在基于 RAM 的文件系统上挂载 `/dev`。\n* udev 会导致启动时间增加。\n\
  * udev 的功能（如动态创建 `/dev` 节点和模块的自动加载）会产生某种不确定性，某些解决方案设计人员倾向于在专用嵌入式设备上避免这种不确定性，特别是那些不通过热插拔总线与外部交互的设备。根据这种观点，静态节点创建是优的。\n\
  \n### 内存屏障\n\n许多处理器和编译器会重排指令以实现最佳速度。这种重排使得新的指令流与原始流在语义上是等价的。然而，如果你正在对 I/O 设备内存映射寄存器进行写入，指令重排可能会产生意外副作用。为了防止处理器重排指令，你可以在代码中插入屏障。`wmb()`\
  \ 插入一个防止写入跨越该处的屏障，`rmb()` 提供一个防止读取跨越该处的读屏障，而 `mb()` 则产生一个读写双屏障。\n\n除了之前提到的 CPU 与硬件交互外，内存屏障对于\
  \ SMP（对称多处理）系统上的 CPU 与 CPU 交互也是相关的。如果你的 CPU 数据缓存以写回模式运行（数据只有在绝对必要时复制到内存），你可能需要停止指令流，直到缓存到内存队列清空。这在遇到获取或释放锁的操作时是相关的。我们在第\
  \ 10 章讨论 PCI 以及在第 17 章讨论闪存驱动程序时会回顾内存屏障。在此期间，请参阅 `Documentation/memory-barriers.txt`\
  \ 获取有关屏障类型的解释。\n\n## 电源管理\n\n电源管理对于电池供电设备（如笔记本电脑和手持设备）至关重要。Linux 驱动需要感知电源状态，并响应待机、睡眠和低电等事件进行切换。驱动在切换到低功耗模式时利用底层支持的节能功能。例如，存储驱动程序停止旋转，而视频驱动程序关闭屏幕。\n\
  \n驱动程序中的电源感知只是整个电源管理框架的一部分。电源管理还涉及用户空间守护进程、工具、配置文件和启动固件的参与。两种常用的电源管理机制是 APM（在附录\
  \ B“[Linux 与 BIOS”的第 2 节中讨论）和高级配置与电源接口（ACPI）。APM 正在过时，ACPI 已成为 Linux 系统的默认电源管理策略。ACPI\
  \ 在第 20 章“更多设备和驱动程序”中进一步讨论。\n\n### 查看源码\n\n核心中断处理代码是通用的，位于 `kernel/irq/` 目录中。特定架构的部分可以在\
  \ `arch/your-arch/kernel/irq.c` 中找到。该文件中定义的 `do_IRQ()` 函数是你进入内核中断处理机制的一个良好起点。\n\n\
  \n\n\n内核的 softirq 和 tasklet 实现位于 `kernel/softirq.c` 中。该文件还包含额外的函数，可以对 softirq 和\
  \ tasklet 进行更细粒度的控制。请查看 `include/linux/interrupt.h` 获取 softirq 向量枚举和实现你的中断处理程序所需的原型。要了解编写中断处理程序和下半部（bottom\
  \ halves）的真实示例，可以从 `drivers/net/lib8390.c` 中的处理程序开始，并顺着路径进入网络协议栈。\n\nkobject 实现和相关的编程接口位于\
  \ `lib/kobject.c` 和 `include/linux/kobject.h` 中。查看 `drivers/base/sys.c` 可了解 sysfs\
  \ 的实现。你将在 `drivers/base/class.c` 中找到设备类 API。通过 netlink 套字分发热插拔 uevent 是由 `lib/kobject_uevent.c`\
  \ 完成的。你可以从 [www.kernel.org/pub/linux/utils/kernel/hotplug/udev.html](http://www.kernel.org/pub/linux/utils/kernel/hotplug/udev.html)\
  \ 下载 udev 源码和文档。\n\n为了全面 de APM 如何在 x86 Linux 上实现，请查看内核树中的 `arch/x86/kernel/apm_32.c`、`include/linux/apm_bios.h`\
  \ 以及 `include/asm-x86/mach-default/apm.h`。如果你好奇 APM 在 ARM 等无 BIOS 架构上是如何实现的，请查看\
  \ `include/linux/apm-emulation.h` 及其使用者。内核的 ACPI 实现位于 `drivers/acpi/` 中。\n\n表 4.2\
  \ 包含了本章使用的主要数据结构总结以及它们在源码树中的定义位置。表 4.3 列出了你在本章中用过的主要内核编程接口及其定义位置。\n\n表 4.2. 数据结构摘要\n\
  \n![image](img/115tab01.jpg)\n\n表 4.3. 内核编程接口摘要\n\n![image](img/116tab01.jpg)\n\n\
  到此，我们对设备驱动概念的探索就结束。在开发驱动程序时，你可能想回到这一章。\n\n## 第 5 章 字符驱动程序\n\n### 本章内容\n\n* 字符驱动基础\n\
  * 设备示例：系统 CMOS\n* 感知数据可用性\n* 与并行口通信\n* RTC 子系统\n* 伪字符驱动\n* 杂项驱动\n* 字符驱动注意事项\n* 查看源码\n\
  \n***\n\n你现在已经准备好尝试编写简单的、尽管是真实的设备驱动程序了。在本章中，让我们看看字符（或 char）设备驱动程序的内部结构，它是按顺序访问设备数据的内核代码。字符驱动程序可以从多种类型的设备捕获原始数据：打印机、鼠标、看门狗、磁带、内存、RTC\
  \ 等。然而，它们并不适用于管理存储在硬盘、软盘或光盘等能够随机访问的块设备上的数据。\n\n***\n\n## 字符驱动基础\n\n让我们从顶向下的视角开始。要访问字符设备，系统用户会调用一个合适的应用程序。该应用程序负责与设备通信，但为了做到这一点，它需要引导出合适驱动程序的身份。驱动程序的联系方式通过\
  \ `/dev` 目录导出到用户空间：\n\n![image](img/120tab01.jpg)\n\n`ls` 输出中每行的第一个字符表示驱动类型：`c`\
  \ 表示字符驱动程序，`b` 代表块驱动程序，`l` 表示符号链接。第五列的数字称为主设备号（major numbers），第六列的数字称为次设备号（minor\
  \ numbers）。主设备号泛泛标识驱动程序，而次设备号则指向驱动程序所服务的精确设备。例如，IDE 块存储驱动程序 `/dev/hda` 拥有主设备号 3，负责处理你系统上的硬盘，但当你进一步指定次设备号为\
  \ 1（`/dev/hda1`）时，它就缩小到了第一个磁盘分区。字符驱动和块驱动程序占用不同的空间，因此你可以为字符驱动和块驱动程序分配相同的主设备号。\n\n\
  让我们更进一步，窥视字符驱动程序的内部。从代码流的角度来看，字符驱动程序具有以下特征：\n\n* 一个初始化（或 `init()`）例程，负责初始化设备并通过注册函数将驱动程序无缝地接到内核的其他部分。\n\
  * 一组入口点（或方法），如 `open()`、`read()`、`ioctl()`、`llseek()` 和 `write()`，它们直接对应于用户应用程序通过关联的\
  \ `/dev` 节点调用的 I/O 系统调用。\n* 中断例程、下半部、定时器处理程序、辅助内核线程和其他支持设施。\n\n从数据流的角度来看，字符驱动程序拥有以下关键数据结构：\n\
  \n1. 设备结构。这是驱动程序围绕的核心。\n2. `struct cdev`，字符驱动的抽象。\n3. `struct file_operations`，包含了驱动入口点的地址。\n\
  4. `struct file`，关于关联 `/dev` 节点的信息。\n\n### 设备示例：系统 CMOS\n\n让我们实现一个访问系统 CMOS 的字符驱动程序。PC\
  \ 兼容硬件上的 BIOS（见图 5.1）使用 CMOS 存储启动选项、启动顺序和系统日期等信息，可以通过 BIOS 设置菜单进行配置。我们的示例驱动程序让你像操作普通文件一样操作。\n\
  \nCMOS 通过两个 I/O 地址访问：一个索引寄存器和一个数据寄存器，如表 5.1 所示。你需要在索引寄存器中指定所需的 CMOS 偏移量，并通过数据寄存器交换信息。\n\
  \n表 5.1. CMOS 寄存器布局\n\n![image](img/122tab01.jpg)\n\n图 5.1. PC 兼容系统上的 CMOS\n\n![image](img/05fig1.gif)\n\
  \n由于每个驱动方法都有应用程序使用的系统调用对应，我们将查看系统调用和对应的驱动方法。\n\n### 驱动初始化\n\n驱动 `init()` 方法是注册机制的基石。它负责：\n\
  \n* 请求分配主设备号。\n* 为设备结构分配内存。\n* 将入口点（`open()`、`read()` 等）与字符驱动的 `cdev` 抽象连接。\n* 将主设备号与驱动的\
  \ `cdev` 关联。\n* 在 `/dev` 和 `/sys` 下创建节点。如第 4 章所述，/dev 管理从 2.2 内核的静态设备节点演变为 2.4 的动态名称，进一步演变为\
  \ 2.6 的用户空间策略守护进程（udev）。\n* 初始化硬件。这对于我们简单的 CMOS 并不重要。\n\n列表 5.1 实现了 CMOS 驱动的 `init()`\
  \ 方法。\n\n列表 5.1. CMOS 驱动初始化\n\n![image](img/p0123-01.jpg)\n![image](img/p0124-01.jpg)\n\
  ![image](img/p0125-01.jpg)\n![image](img/p0125-02.jpg)\n![image](img/p0126-01.jpg)\n\
  \n`cmos_init()` 执行的大多数步骤都是通用的，因此如果你删除了对 CMOS 数据结构的引用，你可以将列表 5.1 作为模板来开发其他字符驱动程序。\n\
  \n\n\n\n首先，`cmos_init()` 调用 `alloc_chrdev_region()` 来动态请求一个未使用的主设备号。如果调用成功，`cmos_dev_number`\
  \ 将包含分配设备号。`alloc_chrdev_region()` 的第二个第三三个参数分别指定起始从设备号和支持的从设备数量。最后一个参数是用于在 `/proc/devices`\
  \ 中标识 CMOS 的设备名称：\n\n![image](img/p0126-02.jpg)\n\n253 是为 CMOS 设备动态分配的主设备号。在 2.6\
  \ 版本之前的时代，内核不支持动态设备节点分配，因此字符驱动程序通过调用 `register_chrdev()` 来静态请求特定的主设备号。\n\n在继续向下执行代码路径之前，让我们来看一眼列表\
  \ 5.1 中使用的数据结构。`cmos_dev` 是之前提到的每个设备的数据结构。`cmos_fops` 是 `file_operations` 结构，它包含了驱动程序入口点的地址。`cmos_fops`\
  \ 还有一个名为 `owner` 的字段，其被设置为 `THIS_MODULE`，即该驱动模块的地址。通过了解结构所有者的身份，内核能够从驱动程序中卸载某些管理函数的负担，例如在进程打开或释放设备时跟踪使用计数。\n\
  \n正如你所见的，内核使用名为 `cdev` 的抽象在内部表示字符设备。字符驱动程序通常将它们的 `cdev` 嵌入到每个设备的结构中。在我们的示例中，`cdev`\
  \ 位于 `cmos_dev` 内部。`cmos_init()` 遍历每个支持的从设备（在此例中为 CMOS 组），为相关的每个设备结构（以及其内部的 `cdev`\
  \ 结构）分配内存。`cdev_init()` 将文件操作（`cmos_fops`）与 `cdev` 关联，而 `cdev_add()` 将由 `alloc_chrdev_region()`\
  \ 分配的主/从设备号连接到 `cdev`。\n\n`class_create()` 为该设备填充 sysfs 条目，而 `device_create()` 会导致生成两个用户事件（uevent）：cmos0\
  \ 和 cmos1。正如你在第 4 章中所学到的，udevd 监听用户事件并在查询其规则数据库后生成设备节点。在 udev 规则目录（`/etc/udev/rules.d/`）中添加以下内容，以便在接收相应相应事件（cmos0\
  \ 和 cmos1）时产生对应两个 CMOS 组的设备节点（`/dev/cmos/0` 和 `/dev/cmos/1`）：\n\n```\nKERNEL==\"\
  cmos[0-1]*\", NAME=\"cmos/%n\"\n```\n\n操作一组 I/O 地址的设备驱动程序通过调用 `request_region()`\
  \ 来声明对这些地址的所有权。这种监管机制确保了其他对同一区域的请求将失败，直到占用者通过调用 `release_region()` 释放它。`request_region()`\
  \ 通常由 PCI 和 ISA 等 I/O 总线驱动程序调用，用于标记处理器地址空间中板载内存的所有（更多信息请见第 10 章中的“[外围组件互连]”）。`cmos_init()`\
  \ 通过调用 `request_region()` 请求访问每个 CMOS 组的 I/O 区域。`request_region()` 的最后一个参数是 `/proc/ioports`\
  \ 使用的标识符，因此如果你查看该文件^([[1]](#footnote.html_ch05fn01))，就会看到它：\n\n![image](img/p0127-01.jpg)\n\
  \n这完成了注册过程，`cmos_init()` 打印了一条消息表示其成功。\n\n### 打开与释放\n\n当应用程序打开相应的设备节点时，内核会调用驱动程序的\
  \ `open()` 方法。你可以通过以下操作触发 `cmos_open()` 的执行：\n\n```bash\ncat /dev/cmos/0\n```\n\n\
  当应用程序关闭打开的设备时，内核会调用 `release()` 方法。因此，当 `cat` 在读取 CMOS 组 0 的内容后关闭到 `/dev/cmos/0`\
  \ 的文件符时，内核调用 `cmos_release()`。\n\n列表 5.2 显示了 `cmos_open()` 和 `cmos_release()` 的实现。让我们仔细观察\
  \ `cmos_open()`。这里有几点值得注意。第一是提取 `cmos_dev`。作为参数传递给 `cmos_open()` 的 inode 包含了初始化期间分配的\
  \ `cdev` 结构的地址。如列表 5.1 所示，`cdev` 嵌入在 `cmos_dev` 内部。为了获取容器结构 `cmos_dev` 的地址，`cmos_open()`\
  \ 使用了内核辅助函数 `container_of()`。\n\n`cmos_open()` 中另一个显著的操作是使用了第二个参数 `struct file`\
  \ 中的 `private_data` 字段。你可以使用此字段（`file->private_data`）作为占位符，方便地关联来自其他驱动方法的信息。CMOS\
  \ 驱动程序使用此字段存储 `cmos_dev` 的地址。查看 `cmos_release()`（以及其他方法）可以看到如何使用 `private_data`\
  \ 直接获取 `cmos_dev` 结构的句柄。\n\n![image](img/p0128-01.jpg)\n### 打开与释放\n\n### 数据交换\n\n\
  `read()` 和 `write()` 是交换数据的基本方法。CMOS 驱动程序操作的是简单的内存，不需要处理通常驱动程序面临的复杂性：\n\n- 除非设备以非阻塞（`O_NONBLOCK`）模式打开，否则\
  \ `read()` 和 `write()` 允许调用进程睡眠直到操作完成。\n- CMOS 操作同步完成，不依赖中断。然而，许多驱动程序的数据访问方法依赖中断，并且通过等待队列等数据结构与中断上下文通信。\n\
  \nCMOS 驱动程序包含属于设备的 `read()` 和 `write()` 方法。你不能从内核空间直接访问用户缓冲区，反之亦然，因此为了将 CMOS 内存内容拷贝到用户空间，`cmos_read()`\
  \ 使用了 `copy_to_user()` 服务。`cmos_write()` 使用 `copy_from_user()` 执行相反操作。\n\n正如你之前看到的，访问\
  \ CMOS 内存是通过操作一对 I/O 地址实现的。为了从 I/O 地址读取不同大小的数据，内核提供了一系列体系无关的函数：`in[b|w|l|sb|sl]()`。地，一组例程\
  \ `outb|w|l|sb|sl()` 可用于写入 I/O 区域。[列表 5.3 中的 `port_data_in()` 和 `port_data_out()`\
  \ 使用了 `inb()` 和 `oub()`。\n\n![image](img/p0130-01.jpg)\n![image](img/p0131-01.jpg)\n\
  ![image](img/p0131-02.jpg)\n![image](img/p0132-01.jpg)\n![image](img/p0133-01.jpg)\n\
  ![image](img/p0133-02.jpg)\n![image](img/p0134-01.jpg)\n\n\n\n\n\n1. 多次系统调用以及相关上下文切换的开销。\n\
  2. 驱动程序对设备最熟悉，因此它可能能够以更智能的方式高效地从不同的缓冲区收集数据，并将其分发到设备。\n\n正因如此，Linux 和其他 UNIX 变体支持\
  \ `read()` 和 `write()` 的向量化版本。Linux 字符驱动架构曾提供过两种专门的方法来执行向量操作：`readv()` 和 `writev()`。然而，从\
  \ 2.6.19 内核版本开始，这两个方法已经合并到了通用的 Linux 异步 I/O (AIO) 层。Linux AIO 是一个宽泛的话题，超出了本文讨论的范围，因此我们只关注\
  \ AIO 提供的同步向量能力。\n\n向量驱动方法的原型下所示：\n\n![image](img/p0135-01.jpg)\n\n`aio_read()/aio_write()`\
  \ 的第一个参数描述 AIO 操作，第二个参数是 `iovecs` 数组。后者是向量函数使用的主要数据结构，包含了存储数据的缓冲区地址和长度。事实上，这种机制是我们在\
  \ 第 10 章 中讨论的离散聚集 DMA（scatter-gather DMA）的用户空间等效实现。查看 `include/linux/uio.h` 获取 `iovecs`\
  \ 的定义，查看 `drivers/net/tun.c`([[2]](#footnote.html_ch05fn02a)) 获取向量字符驱动方法的示例实现。\n\
  \n另一种数据访问方法是 `mmap()`，它将设备内存与用户虚拟内存关联。应用程序可以调用相应的系统调用（也称为 `mmap()`），并直接对返回的内存区域进行操作以访问设备内存。并没有驱动实现了\
  \ `mmap()`，因此我们在这里不深入探讨。相反，查看 `drivers/char/mem.c` 中的示例 `mmap()` 实现。第 19 章 中的“访问内存区域”和“用户空间中的驱动”说明了应用程序如何使用\
  \ `mmap()`。我们的示例 CMOS 驱动没有实现 `mmap()`。\n\n你可能已经注意到 `port_data_in()` 和 `port_data_out()`\
  \ 将存储号的完整性检查封装在了一个名为 `unlikely()` 的宏中。`likely()` 和 `unlikely()` 两个宏会通知 GCC 关联条件评估的成功概率。GCC\
  \ 在预测分支时会使用这些信息。由于我们标记了存储号完整性检查失败的概率很低，因此 GCC 会生成智能代码，将 `else{}` 子句与代码流顺序连接。分支是针对\
  \ `if{}` 子句执行的。如果你使用 `likely()` 而不是 `unlikely()`，情况则反相反。\n\n### Seek（寻道）\n\n内核使用一个内部指针来跟踪当前的文件访问位置。应用程序使用\
  \ `lseek()` 系统调用来重新定位该内部文件指针。通过 `lseek()` 的服务，你可以将文件指针重置为文件内的任何偏移量。`lseek()` 的字符驱动对应方法是\
  \ `llseek()`。`cmos_llseek()` 在 CMOS 驱动中实现了该方法。\n\n正如我们之前看到的，CMOS 的内部文件指针按位移动，而不是按字节移动。如果从\
  \ CMOS 驱动读取一个字节的数据，文件指针必须移动 8 位，因此应用程序必须相应地寻道。`cmos_llseek()` 还根据 CMOS 存储的大小实现了文件末尾（end-of-file）语义。\n\
  \n为了理解 `llseek()` 的语义，让我们先查看 `lseek()` 系统调用支持的命令：\n\n1. `SEEK_SET`：将文件指针设置为提供的固定偏移量。\n\
  2. `SEEK_CUR`：计算相对于当前位置的偏移量。\n3. `SEEK_END`：计算相对于文件末尾的偏移量。该命令可以将文件指针移动到文件末之外，但不会改变文件大小。如果没有显式写入数据，读取文件末尾标记之外将返回空。这种技术通常用于创建大文件。CMOS\
  \ 驱动不支持 `SEEK_END`。\n\n查看 Listing 5.4 中的 `cmos_llseek()` 并与之前的定义对应起来。\n\nListing\
  \ 5.4\\. Seek\n\n![image](img/p0136-01.jpg)\n\n### Control（控制）\n\n另一种常见的字符驱动方法称为\
  \ I/O 控制（或 ioctl）。该例程用于接收并实现请求设备特定操作的应用程序命令。由于 BIOS 使用 CMOS 内存存储启动设备顺序等关键信息，因此通常通过循环冗余校验（CRC）算法进行保护。为了检测数据损坏，CMOS\
  \ 驱动支持两个 ioctl 命令：\n\n1. 调整校验和（Adjust checksum）：用于在修改 CMOS 内容后重新计算 CRC。计算出的校验和存储在\
  \ CMOS bank 1 的预定义偏移处。\n2. 验证校验和（Verify checksum）：用于检查 CMOS 内容是否健康。这是通过比较当前内容的 CRC\
  \ 与之前存储的值来实现的。\n\n当应用程序想要请求驱动执行校验操作时，它们通过 `ioctl()` 系统调用将这些命令发送给驱动。查看 Listing 5.5\
  \ 中的 `cmos_ioctl()` 获取 CMOS 驱动 `ioctl` 方法的实现。`adjust_cmos_crc(int bank, unsigned\
  \ short seed)` 实现标准的 CRC 算法，未在列表中。\n\nListing 5.5\\. I/O Control\n\n![image](img/p0138-01.jpg)\n\
  \n![image](img/p0139-01.jpg)\n\n### Sensing Data Availability（感知数据可用性）\n\n许多应用程序都是复杂的，并不满足于传统的\
  \ `open()`/`read()`/`write()`/`close()` 调用。它们希望在设备有新数据或驱动准备好接收新数据时获得同步或异步通知。在本节中，我们检查两种感知数据的字符驱动方法：`poll()`\
  \ 和 `fasync()`。前者是同步的，后者是异步的。由于这些机制相对高级，在查找底层如何实现之前，让我们先了解应用程序如何使用这些功能。数据可用性对于之前讨论的简单\
  \ CMOS 设备并不相关，让我们采取流行的用户空间应用程序：X 服务器。\n\n#### Poll\n\n考虑以下来自 X Windows 源树（可从 [www.xfree86.org](http://www.xfree86.org)\
  \ 下载）处理鼠标事件的代码片段：\n\n![image](img/p0139-02.jpg)\n\n本质上，代码向鼠标发送初始化命令，轮询直到感知到输入数据，然后从设备读取响应。如果你剥开之前使用的\
  \ `Xf86WaitForInput()` 的封装，你会发现一个 `select()` 系统调调用：\n\n![image](img/p0140-01.jpg)\n\
  \n你可以向 `select()` 提供一组文件描述符，并让它监控它们，直到关联的数据状态发生变化。你也可以请求一个超时来覆盖数据可用性。如果你请求超时为 `NULL`，`select()`\
  \ 将永久阻塞。请参阅 `select()` 的 man 或 info 页面以获取详细文档。上述代码片段中的 `select()` 调用促使 X 服务器在超时时间内对连接的鼠标进行数据轮询。\n\
  \nLinux 支持另一个系统调用 `poll()`，其语义与 `select()` 相似。2.6 内核支持一个名为 `epoll()` 的新非 POSIX 系统调用，它是\
  \ `poll()` 一个更具扩展性的超集。所有这些系统调用都依赖于底层的字符驱动方法 `poll()`。\n\n\n\n\n大多数 I/O 系统调用都符合 POSIX\
  \ 标准，并且并非 Linux 特有（毕竟像 X Windows 等程序运行在许多 UNIX 变体上，而不仅仅是 Linux），但内部驱动方法是特定于操作系统的。在\
  \ Linux 上，`poll()` 驱动方法是 `select()` 系统调用的支柱。在之前的 X 服务器场景中，鼠标驱动程序的 `poll()` 方法如下：\n\
  \n![image](img/p0141-01.jpg)\n\n当 `Xf86WaitForInput()` 调用 `select()` 时，通用的内核 poll\
  \ 实现（定义在 `fs/select.c` 中）会调用 `mouse_poll()`。`mouse_poll()` 接收两个参数：通常的文件句柄（`struct\
  \ file *`）和一个指向名为 `poll_table` 的内核数据结构的指针。`poll_table` 是一个由设备驱动程序拥有的等待队列表，这些驱动正被轮询数据。\n\
  \n`mouse_poll()` 使用库函数 `poll_wait()` 将等待队列（`mouse_wait`）添加到内核 `poll_table` 中并进入睡眠。正如你在第\
  \ 3 章中看到的样，“内核设施”，驱动程序通常拥有几个等待队列，在检测到数据状态变化之前会阻塞。这种状态可以是设备新数据的到达、驱动程序愿意将新数据传递给应用程序，或者设备（或驱动）准备好接受新数据。此类状态通常（但并非总是）由驱动的中断处理程序检测。当鼠标驱动的中断处理程序感知到鼠标移动时，它调用\
  \ `wake_up_interruptible(&mouse_wait)` 来唤醒睡眠中的 `mouse_poll()`。\n\n如果数据状态没有变化，`poll()`\
  \ 方法返回 `0`。如果驱动程序准备好向应用程序发送至少一个字节的数据，它返回 `POLLIN|POLLRDNORM`。如果驱动程序准备好从应用程序接收至少一个字节的数据，它返回\
  \ `POLLOUT|POLLWRNORM`^([[3]](#footnote.html_ch05fn02)) 因此，如果没有鼠标移动，`mouse_poll()`\
  \ 返回 `0`，调用线程进入睡眠。当鼠标中断处理程序感知到设备数据并唤醒 `mouse_wait` 队列时，内核再次调用 `mouse_poll()`。这一次，`mouse_poll()`\
  \ 返回 `POLLIN|POLLRDNORM`，因此 `select()` 调用以及相应的 `Xf86WaitForInput()` 返回正值。X 服务器的鼠标处理程序（`xc/programs/Xserver/hw/xfree86/input/mouse/mouse.c`）继续从鼠标读取数据。\n\
  \n* * *\n\n轮询驱动程序的应用程序通常对驱动特性而非设备特性更感兴趣。例如，取决于缓冲区的健康状况，驱动程序可能在设备本身之前就准备好接受来自应用程序的新数据。\n\
  \n* * *\n\n#### Fasync\n\n某些应用程序出于性能考虑，希望来自设备驱动的异步通知。假设 Linux 心脏起搏器设备上的一个程序正于执行复杂的计算，但希望在数据通过遥测接口从植入式起搏器到达时立即收到通知。在这种情况下，`select()/poll()`\
  \ 机制没有用，因为它会阻塞计算。应用程序需要的是异步事件报告。如果遥测驱动程序能够在检测到来自起搏器的数据时立即异步分发信号（通常为 `SIGIO`），应用程序可以使用信号处理程序捕获它，并据此引导代码流。\n\
  \n异步通知的一个真实示例，让我们回到 X 服务器的一个区域，该区域在检测到输入设备数据时请求警告。查看 X 服务器源码中的这段代码：\n\n![image](img/p0142-01.jpg)\n\
  \n你可以从上述代码段中看出，X 服务器执行了以下操作：\n\n*   调用 `fcntl(F_SETOWN)`。`fcntl()` 系统调用用于操作文件描述符的行为。`F_SETOWN`\
  \ 将描述符的所有权设置为调用进程。这是必要的，因为内核需要知道向何处发送异步信号。这一步对于设备驱动程序是透明的。\n*   调用 `fcntl(F_SETFL)`。`F_SETFL`\
  \ 请求驱动程序在有数据可读或驱动准备好接收更多应用程序数据时向应用程序传递 `SIGIO`。`fcntl(F_SETFL)` 的调用会导致 `fasync()`\
  \ 驱动方法的调用。该方法负责是从要分发 `SIGIO` 的进程列表中添加或删除项。为此，`fasync()` 利用了名为 `fasync_helper()`\
  \ 的内核库函数的服务。\n*   根据其代码架构实现 `SIGIO` 信号处理程序 `xf86SIGIO()`，并使用 `sigaction()` 系统调用安装它。当底层输入驱动程序检测到数据状态变化时，它向注册的请求者分发\
  \ `SIGIO`，这将触发 `xf86SIGIO()` 的执行。([[4]](#footnote.html_ch05fn03)) 字符驱动调用 `kill_fasync()`\
  \ 向注册的进程发送 `SIGIO`。要通知读事件，将 `POLLIN` 作为参数传递给 `kill_fasync()`。要通知写事件，参数为 `POLLOUT`。\n\
  \n为了查看异步通知链的驱动端是如何实现的，让我们看看输入驱动的一个虚构 `fasync()` 方法：\n\n![image](img/p0144-01.jpg)\n\
