  ![image](img/p0447-03.jpg)\n\nNIC 驱动程序还为上层提供了更多与配置相关的方法。一个示例是更改网络接口 MTU 大小的方法。为了支持此功能，向\
  \ `net_device` 提供相关方法：\n\n![image](img/p0447-04.jpg)\n\n当你执行适当的用户命令来更改网卡的 MTU 时，内核会调用\
  \ `mycard_change_mtu()`。\n\n\n\n\n\n```bash\necho 1500 > /sys/class/net/eth0/mtu\n\
  ```\n\n## 总线相关\n\n接下来是总线特定的细节，例如 NIC 板上内存的起始地址和大小。对于 PCI 网卡驱动程序，此配置看起来如下：\n\n![image](img/p0448-01.jpg)\n\
  \n我们在第 10 章中讨论过 PCI 资源函数。\n\n### 与协议层交互\n\n在上一节中，你已经发现了 `net_device` 接口所需的驱动程序方法。现在，让我们仔细观察网络数据是如何流过这个接口的。\n\
  \n### 接收路径\n\n你在第 4 章中学习过，softirqs 是性能敏感型子系统使用的下半（bottom half）机制。网卡驱动程序使用 `NET_RX_SOFTIRQ`\
  \ 将接收到的数据包发布到协议层的工作卸载。驱动程序通过在其接收中断处理程序中调用 `netif_rx()` 来实现这一点：\n\n![image](img/p0448-02.jpg)\n\
  \n早些提到的 NAPI 改进了这种传统的中断驱动接收算法，以降低对 CPU 利用率的需求。当网络负载较重时，系统可能会被处理的大量中断所拖累。NAPI 的策略是在网络活动频繁时使用轮询模式（polled\
  \ mode），在流量较小时回退到中断模式。感感知 NAPI 的驱动程序根据网络负载在中断模式和轮询模式之间切换。实现方式如下：\n\n1. 在中断模式下，中断处理程序通过调度\
  \ `NET_RX_SOFTIRQ` 将接收到的数据包发布到协议层。然后，它禁用网卡中断并通过将设备添加到轮询列表切换到轮询模式：\n\n   ![image](img/p0448-03.jpg)\n\
  \n2. 驱动程序通过其 `net_device` 结构提供一个 `poll()` 方法。\n\n3. 在轮询模式下，驱动程序的 `poll()` 方法处理入口队列中的包。当队列为空时，驱动程序通过调用\
  \ `netif_rx_complete()` 重新启用中断并切换回中断模式。\n\n查看代码列表 15.1 中的 `mycard_interrupt()`、`init_mycard()`\
  \ 和 `mycard_poll()` 以查看 NAPI 的运行情况。\n\n#### 发送路径\n\n对于数据传输，协议层与网卡驱动程序之间的交互是简单的。协议栈调用驱动程序的\
  \ `hard_start_xmit()` 方法，并将传出的 `sk_buff` 作为参数。驱动程序通过将数据包数据 DMA 到网卡将包送出去。PCI 网卡驱动程序的\
  \ DMA 以及相关数据结构的管理在第 10 章中讨论过。\n\n驱动程序配置网卡，使其在传输完预定数量的数据包后中断处理器。只有当发生发送完成中断（信号发送操作已完成）时，驱动程序才能回收或释放与传输数据包相关的\
  \ DMA 描述符、DMA 缓冲区和 `sk_buffs`。\n\n#### 流控\n\n驱动程序通过分别调用 `netif_start_queue()` 和\
  \ `netif_stop_queue()` 来传达其接受协议数据的就绪或意愿。\n\n在设备 `open()` 期间，网卡驱动程序调用 `netif_start_queue()`\
  \ 请求协议层开始向出口队列添加发送数据包。但在正常运行期间，驱动程序可能偶尔需要停止出口队列。例如在驱动程序正在补充数据结构的时间窗口，或者它正在关闭设备时。通过调用\
  \ `netif_stop_queue()` 实现对下游流的节流。要请求网络栈重启出口队列（例如当有足够的空闲缓冲区时），网卡驱动程序调用 `netif_wake_queue()`。要检查当前的流控状态，请调用\
  \ `netif_queue_stopped()`。\n\n## 缓冲区管理与并发控制\n\n高性能网卡驱动程序是一个复杂的软件，需要精细的数据结构管理。正如在第\
  \ 10 章的“数据传输”节中讨论的，网卡驱动程序维护发送和接收 DMA 描述符的链表（或“环”），并为缓冲区管理实现了空闲和使用中池。驱动程序通常实施多重策略来维护缓冲区水平：在设备打开时预分配环形\
  \ DMA 描述符和相关的 `sk_buff`s；当空闲缓冲区低于预设水位线时，通过分配新内存来补充空闲池；当网卡产生发送完成和接收中断时，将已使用的缓冲区回收到空闲池。\n\
  \n例如，网卡驱动程序接收环中的每个元素按如下方式填充：\n\n![image](img/p0450-01.jpg)\n\n在接收期间，网卡直接将数据 DMA\
  \ 到前述预分配环中的 `sk_buff` 中并中断处理器。接收中断处理程序随后将包传递给更高协议层。开发环形数据结构会使本讨论以及下一节中的示例驱动程序变得复杂，因此请参考\
  \ `drivers/net/e1000/` 目录下的 Intel PRO/1000 驱动程序的源码以获取完整说明。\n\n在面对发送、接收、发送完成中断、接收中断和\
  \ NAPI 轮询等多个执行线程时，并发访问保护与管理此类复杂数据结构是密不可分的。我们在第 2 章“探探内核”中讨论了若干并发控制技术。\n\n### 设备示例：以太网\n\
  \n现在你已经有了背景知识，是时候通过粘合已讨论的部分来编写网卡驱动程序了。代码列表 15.1 实现了一个骨架驱动程序。它实现了主要的 `net_device`\
  \ 方法。有关开发的其余帮助，请参考之前提到的 e1000 驱动。代码列表 15.1 通常与底层总线无关，但倾向于 PCI。参见第 10 章。\n\n代码列表\
  \ 15.1 以太网驱动\n\n![image](img/p0451-01.jpg)\n\n![image](img/p0452-01.jpg)\n\n![image](img/p0452-02.jpg)\n\
  \n![image](img/p0453-01.jpg)\n\n![image](img/p0453-02.jpg)\n\n![image](img/p0454-01.jpg)\n\
  \n![image](img/p0454-02.jpg)\n\n![image](img/p0455-01.jpg)\n\n![image](img/p0456-01.jpg)\n\
  \n![image](img/p0456-02.jpg)\n\n![image](img/p0457-01.jpg)\n\n#### 以太网 PHY\n\n以太网控制器实现\
  \ MAC 层，并与物理层（PHY）收发器配合使用。前者对应于开放系统互连（OSI）模型的数据链路层，后者实现物理层。许多 SoC 内置了 MAC，连接到外部\
  \ PHY。媒体独立接口（MII）是一种连接快速以太网 MAC 和 PHY 的标准接口。以太网设备驱动通过 MII 与 PHY 通信，以配置 PHY ID、速率、双工模式和自动协商等参数。查看\
  \ `include/linux/mii.h` 获取寄存器定义。\n\n### ISA 网络驱动\n\n现在来看看 ISA 网卡。CS8900 是来自 Crystal\
  \ Semiconductor（现为 Cirrus Logic）的 10Mbps 以太网控制器芯片。该芯片通常用于为嵌入式设备提供以太网功能，特别是为了调试。图\
  \ 15.2 展示了围绕 CS8900 的连接图。根据板上的处理器和用于驱动芯片的片选信号，CS8900 寄存器映射到 CPU I/O 地址空间的不同区域。该控制器的驱动程序是\
  \ ISA 类型驱动程序（参见第 20 章中的“ISA 和 MCA”和“更多设备和驱动”），它通过探测候选地址区域来检测控制器的存在。ISA 探测方法通过查找如芯片\
  \ ID 等签名来获取控制器的 I/O 基地址。\n\n\n\n\n\n# 图 15.2. CS8900 以太网控制器的连接图。\n\n![image](img/15fig02.gif)\n\
  \n查看 `drivers/net/cs89x0.c` 可获取 CS8900 驱动源码。`cs89x0_probe1()` 探测 I/O 地址范围以检测 CS8900。随后它读取芯片的当前配置。在此步骤中，它访问\
  \ CS8900 的伴随 EEPROM 并获取控制器的 MAC 地址。与列表 15.1 中的驱动一样，`cs89x0.c` 同样使用 `netif_*()` 和\
  \ `skb_*()` 接口例程进行构建。\n\n某些使用 CS8900 的平台允许 DMA。与 PCI 卡不同，ISA 设备不具备 DMA 主控能力，因此它们需要外部\
  \ DMA 控制器来传输数据。\n\n### 异步传输模式\n\nATM 是一种高速的、面向连接的骨干技术。ATM 保证了高服务质量（QoS）和低延迟，因此它用于传输数据外，还用于音视频流量。\n\
  \n以下是 ATM 协议的快速摘要：ATM 通信以 53 字节单元为单位进行。每个单元都以 5 字节头开头，包含虚拟路径标识符（VPI）和虚拟电路标识符（VCI）。ATM\
  \ 连接可以是交换虚拟电路（SVC）或永久虚拟电路（PVC）。在建立 SVC 期间，会在中间 ATM 交换机中配置 VPI/VCI 对，以便将入站单元路由到相应的输出端口。对于\
  \ PVC，VPI/VCI 对被永久配置在 ATM 交换机中，不需要为每个连接进行建立和销毁。\n\n有三种方法可以在 ATM 上运行 TCP/IP，它们都受到\
  \ Linux-ATM 支持：\n\n1.  RFC^([[1]](#footnote.html_ch15fn01)) 1577 规定的经典的 IP over\
  \ ATM (CLIP)。\n2.  在 ATM 网络上仿真局域网。这被称为局域网仿真 (LANE)。\n3.  多协议通过 ATM (MPoA)。这是一种提高性能的路由技术。\n\
  \nLinux-ATM 是内核驱动程序、用户空间实用程序和守护进程的实验性集合。你可以在源码树的 `drivers/atm/` 和 `net/atm/` 下分别找到\
  \ ATM 驱动程序和协议。[`linux-atm.sourceforge.net/`](http://linux-atm.sourceforge.net/)\
  \ 托管使用 Linux-ATM 所需的用户空间程序。Linux 还整合了 ATM socket API，由 SVC 套字 (`AF_ATMSVC`) 和 PVC\
  \ 套字 (`AF_ATMPVC`) 组成。\n\n一种称为多协议标签交换 (MPLS) 的协议正在取代 ATM。Linux-MPLS 项目托管在 [`mpls-linux.sourceforge.net/`](http://mpls-linux.sourceforge.net/)，尚未成为主内核。\n\
  \n我们在下一节中介绍与 ATM 相关的吞吐量问题。\n\n### 网络吞吐量\n\n有多种工具可以对网络性能进行基准测试。从 [www.netperf.org](http://www.netperf.org)免费获取\
  \ Netperf 可以设置复杂的 TCP/UDP 连接场景。你可以使用脚本来控制协议参数、并发会话数和数据块等特性。基准测试通过比较产生的吞吐量与网络技术产生的最大实际带宽来完成。例如，一个\
  \ 155Mbps ATM 适配器产生的最大 IP 吞吐量为 135Mbps，这是考虑了 ATM 单元头大小、ATM 适配层 (AAL) 带来的开销以及物理同步光纤\
  \ (SONET) 层偶尔发送的维护单元。\n\n为了获得最佳吞吐量，你必须为高性能设计你的网卡驱动程序。此外，你还需要深入理解驱动程序所承载的网络协议。\n\n\
  #### 驱动程序性能\n\n让我们来看一些影响网卡性能的驱动程序设计问题：\n\n*   在为快速网卡设计驱动程序时，最小化主数据路径中的指令数量是一个关键标准。考虑一个具有\
  \ 1MB 板载内存的 1Gbps 以太网适配器。在线路速率下，网卡内存可以存储多 8 毫秒的接收数据。这直接转化了允许的最大指令路径长度。在该长度内，入站数据包必须经过重组、DMA\
  \ 到内存、由驱动程序处理、防止并发访问保护，并交付给高层协议。\n*   在程序化 I/O (PIO) 期间，数据从设备一直传输到 CPU，然后写入内存。此外，每当设备需要传输数据时，CPU\
  \ 就会被中断，这导致了延迟和上下文切换延迟。DMA 不受这些瓶颈的影响，但如果传输的数据少于阈值，则可能比 PIO 更昂贵。这是因为小型 DMA 在构建描述符和为了数据一致性刷新相应的处理器缓存行方面具有较高的相对开销。性能敏感型设备驱动程序可能会在实验确定阈值后，对小数据包使用\
  \ PIO 对大数据包使用 DMA。\n*   对于具有 DMA 主控能力的 PCI 网卡，你必须确定最优的 DMA 突发大小（burst size），即卡一次性控制总线的时间。如果卡突发持续过长，它可能会占用总线并阻止处理器跟上之前\
  \ DMA 的数据。PCI 驱动程序通过 PCI 配置空间中的寄存器程序设置突发大小。通常，网卡的突发大小被程序设置为与处理器的缓存行大小相同，即处理器每次缺失时从系统内存读取的字节数。但在实践中，你可能需要连接总线分析仪来确定有益的突发持续时间，因为系统中是否存在分拆总线（如\
  \ ISA 和 PCI 等多种总线类型）等因素可能会最优最优。\n*   许多高速网卡提供将协议栈中 CPU 密集型 TCP 校验计算卸载的能力。某些支持我们在第\
  \ 10 章中访问过的 DMA 分散聚集（scatter-gather）。驱动程序需要利用这些能力来实现网络产生的最大实际带宽。\n*   有时，如果驱动程序对高层协议的实现细节不敏感，驱动优化可能会产生意想不到的速度障碍。考虑配备有高速网卡的计算机上的\
  \ NFS 挂载文件系统。假设网卡驱动程序仅偶尔产生传输完成中断以减少延迟，但 NFS 服务器实现使用释放其传输缓冲区作为流控机制。由于驱动程序只在稀疏生成的传输完成中断释放\
  \ NFS 传输缓冲区，通过 NFS 进行的文件复制将变得非常缓慢，而 Internet 下载却飞速运行并产生最大吞吐量。\n\n### 协议性能\n\n现在让我们深入研究一些可以提高或损害网络吞吐量的特定协议特性：\n\
  \n*   TCP 窗口大小会影响吞吐量。窗口大小衡量了在收到确认之前可以传输的数据量。对于快速网卡，较小的窗口大小可能导致 TCP 空闲，等待已发送数据包的确认。即使窗口大小很大，少量的丢失\
  \ TCP 数据包也会影响性能，因为丢失的帧会以线路速率耗尽窗口。在 UDP 的情况下，窗口大小是不相关的，因为它不支持确认。然而，由于缺乏流控机制，微小的包丢失可能会导致速率急剧下降。\n\
  \n\n\n\n随着写入到 TCP 套接字的应用程序数据块大小的增加，从用户空间拷贝到内核空间的缓冲区数量随之减少。这降低了对处理器利用率的需求，对性能有益。然而，如果块大小超过了对应网络协议的\
  \ MTU，处理器周期就会浪费在分片上。因此，理想的块大小是输出接口的 MTU，或者在运行路径 MTU 发现机制时，通过 IP 路径可以在不分片的情况下发送的最大数据包。例如，在在\
  \ ATM 上运行 IP 时，由于 ATM 适配层具有 64K 的 MTU，块大小几乎没有上限。（RFC 1626 将此默认设为 9180。）但是，如果你在 ATM\
  \ LANE 上运行 IP，则块大小应该镜像所模拟的相应 LAN 技术的 MTU 大小。因此，标准以太网应为 1500，巨型千兆以太网为 8000，16Mbps\
  \ 令牌环网为 18K。\n\n### 查看源码\n\n`drivers/net/` 目录包含各种网卡（NIC）驱动程序的源码。查看 `drivers/net/e1000/`\
  \ 可以找到网卡驱动程序的示例。你会在 `net/` 目录中找到网络协议的实现。`sk_buff` 访问例程位于 `net/core/skbuff.c`。辅助实现驱动程序\
  \ `net_device` 接口的库函数留在 `net/core/dev.c` 中，并包含了 `include/linux/netdevice.h`。\n\n\
  ### TUN/TAP 驱动\n\n用于协议隧道的 TUN/TAP 设备驱动 `drivers/net/tun.c` 是虚拟网络驱动与伪字符驱动结合的示例。伪字符设备（`/dev/net/tun`）充当虚拟网络接口（`tunX`）的底层硬件，因此，TUN\
  \ 网络驱动不是将帧发送到物理网络，而是将其发送到从 `/dev/net/tun` 读取的应用程序。同样，TUN 驱动程序不是从物理网络接收数据，而是从写入 `/dev/net/tun`\
  \ 的应用程序中接收数据。请查看 `Documentation/networking/tuntap.txt` 以获取更多说明和使用场景。由于驱动程序的网络和字符部分都不需要处理硬件交互的复杂性，因此它是一个非常易读（尽管是简单的）驱动示例。\n\
  \n`/sys/class/net/` 下的文件允许你操作网卡驱动参数。使用 `/proc/sys/net/` 下的节点来配置特定协议的变量。例如，设置最大 TCP\
  \ 传输窗口大小，可以将所需的值回显到 `/proc/sys/net/core/wmem_max`。`/proc/net/` 目录包含系统特定的网络信息。检查\
  \ `/proc/net/dev` 获取系统上所有网卡的统计信息，查看 `/proc/net/arp` 获取 ARP 表。\n\n表 15.1](#ch15.html_ch15tab01)\
  \ 包含了本章使用的主要数据结构及其在源码树中的位置。表 15.2](#ch15.html_ch15tab02) 列出了你在本章使用的主要内核编程接口及其定义的位置。\n\
  \n表 15.1. 数据结构总结\n\n![image](img/462tab01.jpg)\n\n表 15.2. 内核编程接口总结\n\n![image](img/463tab01a.jpg)\n\
  \n![image](img/463tab01b.jpg)\n\n# 第 16 章 无线 Linux\n\n本章内容\n\n- 蓝牙\n- 红外\n- WiFi\n\
  - 蜂窝网络\n- 当前趋势\n\n几种小型足迹设备由无线技术和 Linux 的双重组合驱动。蓝牙、红外、WiFi 和蜂窝网络是成熟的无线技术，具有良好的 Linux\
  \ 支持。蓝牙消除了电缆，为哑设备注入了智能，并开启了新应用的大门。红外是一种低成本、短距离、中速率的无线技术，可以笔记本联网、连接手持设备或将文档发送到打印机。WiFi\
  \ 是以太网 LAN 的无线对应。使用 GPRS 或分码多址（CDMA）的蜂窝网络只要你的活动限制在服务提供者的覆盖范围内，就能让你随时保持互联网连接。\n\n\
  由于这些无线技术在流行的外形尺寸中广泛可用，你可能很快就会遇到一张无法立即在 Linux 上运行的卡。在开始尝试启用不支持的网卡之前，你需要详细了解内核是如何实现相应技术的支持。在本章中，让我们学习\
  \ Linux 如何启用蓝牙、红外、WiFi 和蜂窝网络。\n\n### 无线权衡\n\n蓝牙、红外、WiFi 和 GPRS 服务于不同的领域。权衡可以根据速度、范围、成本、功耗、硬件/软件协同设计的易用性以及\
  \ PCB 空间来衡量。\n\n表 16.1](#ch16.html_ch16tab01) 给了你这些参数的概念，但在实际测量数值时，你必须应对几个变量。列出的速度是理论最大值。所示的功耗是相对的，但在现实世界中它们取决于实现。PCB\
  \ 空间取决于芯片因素以及你是否使用现成的（OTS）模块进行构建。\n\n表 16.1. 无线权衡\n\n![image](img/467tab01.jpg)\n\
  \n本章的一些章节侧重于“系统编程”而非设备驱动。这是因为协议栈的相应区域（例如蓝牙和红外网络）已经存在于内核中，你更有可能进行相关的自定义而非开发设备驱动。\n\
  \n### 蓝牙\n\n蓝牙是一种短距离电缆替代技术，同时携带数据和语音。它支持最高 723Kbps（非对称）和 432Kbps（对称）的速度。3 类蓝牙设备范围为\
  \ 10 米，而 1 类发射器的通信距离可达 100 米。\n\n蓝牙的设计旨在消除限制和杂乱环境的电线。例如，它可以将你的手表变成背包内笨重全球定位系统（GPS）的前端。或者例如，它可以让你通过手持设备进行演示。再次，如果你想让笔记本电脑成为一个能让蓝牙感知\
  \ MP3 播放器联网的节点，蓝牙就是答案。如果你的手表、手持设备、笔记本电脑或 MP3 播放器运行 Linux，了解蓝牙栈的内部结构将帮助你充分利用设备价值。\n\
  \n根据蓝牙规范，协议栈由图 16.1](#ch16.html_ch16fig01）所示的层组成。无线电、链路控制器和链路管理器大致对应于开放系统间（OSI）标准参考模型的物理层、数据链路层和网络层。主机控制接口（`HCI`）是用于在硬件之间传输数据的协议，因此映射到传输层。蓝牙逻辑控制和适配协议（`L2CAP`）属于会话层。使用射频通信（`RFCOMM`）的串口端口仿真、使用蓝牙网络封装协议（`BNEP`）的以太网仿真以及服务发现协议（`SDP`）都是功能丰富的表示层的一部分。在栈的顶部是各种称为配置的应用环境。\n\
  \n图 16.1. 蓝牙栈。\n\n![image](img/16fig01.gif)\n\n\n\n\n将蓝牙硬件与微控制器接口的常用方法是将芯片组的数据线连接到控制器的\
  \ UART 引脚。第 13 章中的图 13.4 “音频驱动程序”显示了显示播放器在 MP3 播放器上的蓝牙芯片通过 UART 与处理器通信。USB 是另一种与蓝牙芯片组通信的常用载体。第\
  \ 11 章中的图 11.2 “通用串行总线”显示了嵌入式设备上的蓝牙芯片通过 USB 与处理器建立接口。无论你使用 UART 还是 USB（我们稍后会查看这两种设备），传输蓝牙数据的数据包格式都是\
  \ HCI。\n\n### BlueZ\n\nBlueZ 蓝牙实现是主内核的一部分，也是官方的 Linux 蓝牙栈。图 16.2 展示了 BlueZ 如何将蓝牙协议层映射到内核模块、内核线程、用户空间守护进程、配置工具、实用程序和库。这里解释了主要的\
  \ BlueZ 组件：\n\n1. `bluetooth.ko` 包含核心 BlueZ 基础设施。所有其他 BlueZ 模块都利用它的服务。它还负责向用户空间导出蓝牙套接字（`AF_BLUETOOTH`）并填充相关的\
  \ sysfs 条目。\n\n2. 为了通过 UART 传输蓝牙 HCI 数据包，相应的 BlueZ HCI 实现是 `hci_uart.ko`。对于 USB\
  \ 传输，它是 `hci_usb.ko`。\n\n3. `l2cap.ko` 实现负责分段和重组的 L2CAP 适配层。它还在不同的高层协议之间进行复用。\n\n\
  4. 为了在蓝牙上运行 TCP/IP 应用，你必须使用 BNEP 在 L2CAP 上模拟以太网端口。这是通过 `bnep.ko` 完成的。为了为 BNEP 连接提供服务，BlueZ\
  \ 会产生名为 `kbnepd` 的内核线程。\n\n5. 为了在蓝牙上运行终端模拟器等串口应用，你需要在 L2CAP 上模拟串口。这是通过 `rfcomm.ko`\
  \ 完成的。RFCOMM 还充当支持 PPP 网络的支柱。为了向传入的 RFCOMM 连接提供服务，`rfcomm.ko` 会产生名为 `krfcommd` 的内核线程。使用\
  \ `rfcomm` 实用程序来建立和维护目标设备上单个 RFCOMM 通道的连接。\n\n6. HID 层通过 `hidp.ko` 实现。用户态守护进程 `hidd`\
  \ 让 BlueZ 处理蓝牙鼠标等输入设备。\n\n7. 音频通过 `sco.ko` 实现的同步面向连接（SCO）层处理。\n\n图 16.2. 映射到 BlueZ\
  \ 内核模块的蓝牙协议层。\n\n![image](img/16fig02.gif)\n\n现在让我们追踪两个示例蓝牙设备的内核代码流：紧凑闪存（CF）卡和 USB\
  \ 适配器。\n\n### 设备示例：CF 卡\n\nSharp 蓝牙紧凑闪存卡使用 Silicon Wave 芯片组构建，并使用串行传输携带 HCI 数据包。HCI\
  \ 数据包有三种不同的串行传输方式：\n\n1. H4 (UART)，被 Sharp CF 卡使用。H4 是蓝牙规范定义的通过 UART 传输蓝牙数据的标准方法。查看\
  \ `drivers/bluetooth/hci_h4.c` 获取 BlueZ 的实现。\n\n2. H3 (RS232)。使用 H3 的设备很难找到。BlueZ\
  \ 不支持 H3。\n\n3. BlueCore 串行协议 (BCSP)，是 Cambridge Silicon Radio (CSR) 的一种专用协议，支持错误检查和重传。BCSP\
  \ 用于基于 CSR BlueCore 芯片的非 USB 设备，包括 PCMCIA 和 CF 卡。BlueZ 的 BCSP 实现位于 `drivers/bluetooth/hci_bcsp.c`\
  \ 中。\n\nSharp 蓝牙卡的读取数据路径如图 16.3 所示。卡与内核之间的第一个接触点是 UART 驱动程序。正如你在第 9 章的图 9.5 “PCMCIA\
  \ 和紧凑闪存”中所看到的，串行卡服务驱动程序 `drivers/serial/serial_cs.c` 允许系统的其余部分将 Sharp 卡视为串口设备。串口驱动程序将收到的\
  \ HCI 数据包传递给 BlueZ。BlueZ 以内核行规范的形式实现 HCI 处理。正如你在第 6 章 “串口驱动程序”中所学习的，行规范位于串口驱动程序之上并塑造其行为。HCI\
  \ 行规范调用相关的协议例程（在此例中为 H4）来协助数据处理。从那时起，L2CAP 和更高级的 BlueZ 层接管。\n\n图 16.3. 从 Sharp 蓝牙\
  \ CF 卡读取数据的路径。\n\n![image](img/16fig03.gif)\n\n### 设备示例：USB 适配器\n\n现在让我们看一个使用 USB\
  \ 传输 HCI 数据包的设备。Belkin 蓝牙 USB 适配器就是此类设备之一。在这种情况下，Linux USB 层（`drivers/usb/*`）、HCI\
  \ USB 传输驱动程序（`drivers/bluetooth/hci_usb.c`）和 BlueZ 协议栈（`net/bluetooth/*`）是主要的参与者。让我们看看这些层是如何交互的。\n\
  \n正如你在第 11 章（ch11.html_ch11）中所学的，USB 设备使用一个或多个管道交换数据：\n\n1. 控制管道用于传输 HCI 指令。\n\n\
  2. 中断管道负责携带事件。\n\n3. 批量管道传输无连接（ACL）数据。\n\n4. 同步管道携带 SCO 数据。\n\n正如你在第 11 章中所看到的，当\
  \ USB 设备插入系统时，主机控制器使用控制管道对其进行枚举并分配 1 到 127 的端点地址。USB 子系统读取的配置描述符包含设备信息，如 `class`、`subclass`\
  \ 和 `protocol`。蓝牙规范定义设备的 (`class`, `subclass`, `protocol)` 代码为 (0xE, 0x01)。HCI USB\
  \ 传输驱动程序 `hci_usb` 在初始化时向 USB 内核注册这些值。当 Belkin 适配器插入时，USB 内核从设备描述符读取 (`class`, `subclass`,\
  \ `protocol)` 信息。由于这些信息与 `hci_usb` 注册的值匹配，该驱动程序附加到 Belkin 适配器。`hci_usb` 从管道读取蓝牙数据并将其传递给\
  \ BlueZ 协议栈。Linux 应用现在在此设备上无缝运行，如图 16.2 所示。\n\n### RFCOMM\n\nRFCOMM 在蓝牙上模拟串口。终端模拟器等应用和\
  \ PPP 等协议可以在 RFCOMM 创建的虚拟串口上直接运行。\n\n### 设备示例：药盒\n\n为了举例说明，假设你有一个支持蓝牙的药盒。当你从药盒中取出药时，它通过蓝牙\
  \ RFCOMM 通道发送消息。Linux 手机（如第 6 章中图 6.5 所示）使用一个简单的应用程序通过建立 RFCOMM 连接读取此警报。然后手机通过其\
  \ GPRS 接口将此信息发送到互联网上医疗保健提供者的服务器。\n\nLinux 手机上使用 BlueZ 套接字 API 读取来自药盒数据的骨架应用程序如列表\
  \ 16.1。该列表假设你熟悉套接字编程的基础。\n\n列表 16.1. 通过 RFCOMM 与药盒通信\n\n![image](img/p0474-01.jpg)\n\
  \n![image](img/p0474-02.jpg)\n\n### 网络\n\n追踪图 16.2](#ch16.html_ch16fig02) 中 telnet/ftp/ssh\
  \ 框下的代码路径，查看在 BlueZ 蓝牙上是如何构建网络的。正如你看到的，在蓝牙上联网有两种不同的方式：\n\n\n\n\n\n1. 通过在 `BNEP`\
  \ 上直接运行 `TCP/IP`。生成的网络被称为个人区域网 (`PAN`)。\n\n2. 通过在 `PPP` 之上的 `RFCOMM` 之上运行 `TCP/IP`。这被称为拨号联网\
  \ (`DUN`)。\n\n蓝牙联网的内核实现可能对设备驱动编写者意义不大，因此本文未对其探讨。然而，表 16.2 显示了使用 `PAN` 连接两台笔记本电脑所需的步骤。使用\
  \ `DUN` 联网与此类似，未作讨论。这两台笔记本电脑分别通过前文讨论的 `Sharp` CF 卡和 `Belkin` USB 适配器开启了蓝牙功能。你可以使用一个被动式\
  \ CF 转 PCMCIA 适配器将 CF 卡插入第一台笔记本电脑的 PCMCIA 插槽中。请结合图 16.2 和表 16.2 来理解其与对应 `BlueZ`\
  \ 组件的映射关系。表 16.2 使用 `bash-sharp>` 和 `bash-belkin>` 作为两台笔记本电脑各自 shell 提示符。\n\n表 16.2.\
  \ 使用蓝牙 PAN 连接两台笔记本电脑\n\n![image](img/476tab01.jpg)\n\n![image](img/477tab01.jpg)\n\
  \n### 人机设备\n\n请参阅第 7 章中的“USB 和蓝牙键盘”和“USB 和蓝牙鼠标”以及“输入驱动程序 添加到 `/etc/bluetooth/pin`\
  \ 来配置 `BlueZ`。Linux 设备上使用 `BlueZ` `SCO` API 的应用程序现在可以向耳机发送音频数据。音频数据应为耳机能理解的格式。HBH-30\
  \ 使用 `A-law PCM`（脉冲编码编码）格式。有公有领域的实用程序可以将音频转换为各种 `PCM` 格式。\n\n蓝牙芯片组除了 `HCI` 传输接口外，通常具有\
  \ `PCM` 接口引脚。如果设备例如同时支持蓝牙和 `GSM`，则来自 `GSM` 芯片组的 `PCM` 线可以直接连接到蓝牙芯片的 `PCM` 音频线。此时你可能需要配置蓝牙芯片通过其\
  \ `HCI` 接口接收和发送 `SCO` 音频包，而不是通过 `PCM` 接口。\n\n### 调试\n\n有两个 `BlueZ` 工具用于调试：\n\n1.\
  \ `hcidump` 拦截往返的 `HCI` 数据包，并将其解析为人类可读的格式。这里是一个设备查询进行期间的转储示例：\n\n   ![image](img/p0478-01.jpg)\n\
  \n2. 虚拟 `HCI` 驱动 (`hci_vhci.ko`)，如图 16.2 所示，如果你没有实际硬件，它可以模拟一个蓝牙接口。\n\n### 查看源码\n\
  \n查看 `drivers/bluetooth/` 目录下的 `BlueZ` 底层驱动程序。探索 `net/bluetooth/` 以深入了解 `BlueZ`\
  \ 协议的实现。\n\n蓝牙应用程序根据其行为属于不同的配置方案（profiles）。例如，无线电话配置方案规定了蓝牙设备如何实现无线电话。我们讨论了 `PAN`\
  \ 和串口访问的配置，但还有许多其他配置，如传真配置、通用对象交换配置 (`GOEP`) 和 SIM 访问配置 (`SAP`)。从 [www.bluez.org](http://www.bluez.org)\
  \ 下载的 `bluez-utils` 包提供了对多种蓝牙配置的支持。\n\n蓝牙官方网站是 [www.bluetooth.org](http://www.bluetooth.org)。它包含了蓝牙规范文档和关于蓝牙特别兴趣小组\
  \ (`SIG`) 的信息。\n\n`Affix` 是 Linux 上的另一种蓝牙栈。你可以从 [`affix.sourceforge.net/`](http://affix.sourceforge.net/)\
  \ 下载 `Affix`。\n\n### 红外\n\n红外线 (`IR`) 射线是位于电磁光谱可见区域和微波区域之间的光波。`IR` 的用途之一是点对点数据通信。使用\
  \ `IR`，可以在 PDA 之间交换名片、连接两台笔记本电脑或将文档发送到打印机。`IR` 在 30 度锥体内的范围可达 1 米，从 –15 度到 +15 度扩散。\n\
  \n有两种流行的 `IR` 通信方式：标准红外 (`SIR`)，支持高达 115.20 Kbaud 的速度；以及快速红外 (`FIR`)，其带宽为 4Mbps。\n\
  \n图 16.4 显示了笔记本上的 `IR` 连接。Super I/O 芯片组中的 `UART1` 启用了 `IR`，因此一个 `IR` 收发器直接连接到它。没有\
  \ `IR` 支持的笔记本电脑可能依赖外部 `IR` 适配器（参见“设备示例：红外适配器”，连接到 `UART0`）。图 16.5 显示了笔记本上的 `IR`\
  \ 连接。\n\n### Linux-IrDA\n\nIrDA 项目 ([`irda.sourceforge.net/`](http://irda.sourceforge.net/))\
  \ 为内核带来了 `IrDA` 能力。要了解 `IrDA` 组件相对于 `IrDA` 栈的关系，让我们查看图 16.6：\n\n1. 设备驱动程序构成底层。兼容\
  \ 1650 的 `SIR` 芯片可以重用原生 Linux IrDA 线路，`IrTTY`。这种组合的替代方案是 `IrPort` 驱动。`FIR` 芯片有自己的驱动。\n\
  \n2. 接下来是核心协议栈。它由链路链路协议 (`IrLAP`)、链路链路管理协议 (`IrLMP`)、小型传输协议 (`TinyTP`) 和 IrDA 套接接口\
  \ (`IrSock`) 组成。`IrLAP` 提供了可靠的传输以及发现邻近设备的状态机。`IrLMP` 是 `IrLAP` 之上的复用器。`TinyTP` 提供分段、重组和流量控制。`IrSock`\
  \ 在 `IrLMP` 和 `TinyTP` 之上提供套接接口。\n\n3. 栈的高层将 `IrDA` 与数据传输应用程序相结合。`IrLAN` 和 `IrNet`\
  \ 实现联网，而 `IrComm` 允许串口通信。\n\n4. 你还需要最终决定技术的应用程序。一个例子是 `openobex` ([`openobex.sourceforge.net/`](http://openobex.sourceforge.net/))，它实现了用于交换文档和名片的对象交换协议\
  \ (OBEX)。要配置 `IrDA`，你需要许多发行版附带的 `irda-utils` 包。该包提供了 `irattach`、`irdadump` 和 `irdaping`\
  \ 等工具。\n\n图 16.6. 通过 Linux-IrDA 通信。\n\n![image](img/16fig06.gif)\n\n### 设备示例：Super\
  \ I/O 芯片\n\n为了初步体验 Linux-IrDA，让我们让两台笔记本电脑通过 `IR` 对话。每台笔记本电脑都通过国家半导的 `NSC PC87382`\
  \ Super I/O 芯片开启了 `IR` 功能。[2]](#footnote.html_ch16fn02)。图 16.4 中的 `UART1` 显示了连接场景。`PC87382`\
  \ 芯片可以工作在 `SIR` 和 `FIR` 模式。我们将依次查看。\n\n`SIR` 芯片为主机计算机提供 `UART` 接口。为了在 `SIR` 模式下通信，将每台笔记本的相关\
  \ UART 端口（此例中的 `/dev/ttyS1`）连接到 `IrDA` 栈：\n\n```bash\nbash> irattach /dev/ttyS1\
  \ -s\n```\n\n\n\n\n验证 IrDA 内核模块（`irda.ko`、`sir_dev.ko` 和 `irtty_sir.ko`）已加载，并且 `irda_sir_wq`\
  \ 内核线程正在运行。`irda0` 接口应该出现在 `ifconfig` 输出中。`irattach` 的 `-s` 选项触发搜索附近的红外活动。如果你移动笔记本电脑，使其红外收发器处于光锥范围内，它们就能相互发现对方：\n\
  \n![image](img/p0482-01.jpg)\n\n另一台笔记本电脑会发出类似的公告，但源地址和目的地址（`saddr` 和 `daddr`）是反的。你可以使用\
  \ `stty` 在 `ttyS1` 上设置所需的通信速度。要将波特率设置为 19200，请执行：\n\n```bash\n> stty speed 19200\
  \ < /dev/ttyS1\n```\n\n从空气中过滤红外活动最简单的方法是使用调试工具 `irdadump`。这里是在建立连接期间获取的示例转储，显示了协商后的参数：\n\
  \n![image](img/p0482-02.jpg)\n\n你也可以通过控制 `/proc/sys/net/irda/debug` 中的详细级别来从 IrDA\
  \ 栈中获取调试信息。\n\n要将笔记本设置为 FIR 模式，请将 `ttyS1` 从原生序列驱动程序解离，并将其到 NSC FIR 驱动程序 `nsc-ircc.ko`：\n\
  \n![image](img/p0483-01.jpg)\n\n`dongle_id` 取决于你的红外硬件，可以从硬件文档中找到。就像你处理 SIR 时做的那样，查看\
  \ `/proc/net/irda/discovery` 以检查目前是否正常。有时，FIR 通信在高速下会挂起。如果 `irdadump` 显示通信冻结，要么戴上你的内核黑客帽子修复代码，要么尝试通过调整\
  \ `/proc/sys/net/irda/max_baud_rate` 来降低协商速度。\n\n注意，与可以建立一对多连接的蓝牙物理层不同，红外设备每个物理设备一次只能支持单一连接。\n\
  \n### 设备示例：红外适配器 (IR Dongle)\n\n适配器是插入串口或 USB 端口的红外设备。某些微控制器（如 图 16.5 所示的 Cirrus\
  \ Logic EP7211）具有连接到其 UART 的片上红外控制器，也被视为适配器。\n\n适配器驱动程序是一组控制方法，负责更改通信速度等操作。它们有四个入口点：`open()`、`reset()`、`change_speed()`\
  \ 和 `close()`。这些入口点被定义为 `dongle_driver` 结构的一部分，并在 IrDA 内核线程 `irda_sir_wq` 的上下文中调用。适配器驱动方法允许阻塞，因为它们是在未持有任何锁的进程上下文中被调用的。IrDA\
  \ 核心为适配器驱动提供了三个辅助函数：`sirdev_raw_write()` 和 `sirdev_raw_read()` 用于与关联 UART 交换控制数据，`sirdev_set_dtr_rts()`\
  \ 用于拨动连接到 UART 的调制解调器控制线。\n\n由于你更有可能为适配器添加内核支持，而不是修改 Linux-IrDA 的其他部分，让我们实现一个适配器驱动示例。假设你正在启用一种尚不支持的简单串口红外适配器，它仅以\
  \ 19200 或 57600 波特率通信。还假设当用户想要在这两个值之间切换波特率时，你必须将 UART 的请求发送 (RTS) 引脚拉低 50 微秒，然后拉高\
  \ 25 微秒。列表 16.2 为该设备实现了一个适配器驱动。\n\n### 列表 16.2. 示例适配器驱动\n\n![image](img/p0484-01.jpg)\n\
  \n![image](img/p0484-02.jpg)\n\n![image](img/p0485-01.jpg)\n\n![image](img/p0486-01.jpg)\n\
  \n对于真实示例，请查看 `drivers/net/irda/tekram.c` 和 `drivers/net/irda/ep7211_ir.c`。\n\n既然物理层已经运行，让我们开始研究\
  \ IrDA 协议。\n\n### IrComm\n\nIrComm 仿真串口端口。终端模拟器等应用程序以及 PPP 等协议可以在 IrComm 创建的虚拟串口接口上直接运行而无需更改。IrComm\
  \ 由两个相关模块 `ircomm.ko` 和 `ircomm_tty.ko` 实现。前者提供核心协议支持，而后者创建并管理仿真的串口端口节点 `/dev/ircommX`。\n\
  \n### 网络\n\n在 IrDA 上运行 TCP/IP 有三种方法：\n\n1. 通过 IrComm 运行异步 PPP\n2. 通过 IrNET 运行同步\
  \ PPP\n3. 使用 IrLAN 进行以太网仿真\n\n在 IrComm 上进行联网等同于在串口上运行异步 PPP，因此在这种情况下没有特殊之处。\n\n\
  异步 PPP 需要使用字节填充等技术标记帧的开始和结束，但如果 PPP 在如以太网等数据链路上运行，则不需要承担分帧协议的开销。这被称为同步 PPP，用于配置\
  \ IrNET 上的网络。[[3]](#footnote))\n\n\n\n\n如果你的嵌入式设备只需要简单的红外接收功能，它可能使用一个微型红外接收器（例如来自\
  \ Vishay 半导体公司的 `TSOP1730` 芯片）。一个示例应用设备是安装在病房内的红外定位器，用于读取护士佩戴的红外胸章发射的数据。在这种情况下，由于缺少\
  \ IrDA 协议交互，`IrDA` 栈并不相关。如果该定位器使用精简的私有协议来解析接收到的数据，那么将 `LIRC` 移植到定位器可能大材小用。一个简单的解决方案可能是实现一个小型只读字符或杂项驱动，通过\
  \ `/dev` 或 `/sys` 接口将原始红外数据导出到合适的应用程序。\n\n### 查看源码\n\n查看 `drivers/net/irda/` 以获取底层\
  \ IrDA 驱动，查看 `net/irda/` 获取协议实现，查看 `include/net/irda/` 获取头文件。通过实验 `/proc/sys/net/irda/*`\
  \ 来调整 IrDA 栈，并探索 `/proc/net/irda/*` 中与不同 IrDA 层相关的状态信息。\n\n表 16.3 包含了本节使用的主要数据结构及其在源码树中的位置。表\
  \ 16.4 列出了本节中使用的主要内核编程接口以及它们定义的所在。\n\n### 表 16.3. 数据结构摘要\n![image](img/489tab01.jpg)\n\
  \n### 表 16.4. 内核编程接口摘要\n![image](img/489tab02.jpg)\n\n## WiFi\n\nWiFi，或称为无线局域网（WLAN），是有线局域网的替代方案，通常用于校园内。IEEE\
  \ 802.11a WLAN 标准使用 5GHz ISM（工业、科学、医疗）频段，支持高达 54Mbps 的速率。802.11b 和 802.11g 标准使用\
  \ 2.4GHz 频段，分别支持 11Mbps 和 54Mbps 的速率。\n\nWLAN 与有线以太网相似之处在于，它们从同一个地址池分配 MAC 地址，并且在操作系统中都表现为普通的网络接口。例如，地址解析协议（ARP）表包含了\
  \ WLAN MAC 地址以及以太网 MAC 地址。\n\n然而，WLAN 和有线以太网在链路层上有显著的差异：\n\n*   802.11 WLAN 标准使用冲突规避（CSMA/CA），而不是有线以太网使用的冲突检测（CSMA/CD）。\n\
  *   WLAN 帧与以太网帧不同，它是确认的。\n*   由于无线网络固有的安全问题，WLAN 使用了一种名为有线等效隐私（WEP）的加密机制来提供与有线以太网同等的安全性。WEP\
  \ 将 40 位或 104 位密钥与随机的 24 位初始化向量结合以加密和解密数据。\n\nWLAN 支持两种通信模式：\n\n1.  Ad-hoc 模式（自模式），一小组附近的站直接通信，不使用接入点。\n\
  2.  基础设施模式（Infrastructure mode），数据交换通过接入点进行。接入点定期广播服务集标识符（SSID 或 ESSID），用于区分不同的\
  \ WLAN 网络。\n\n让我们来看看 Linux 是如何支持 WLAN 的。\n\n### 配置\n\n无线扩展（Wireless Extensions）项目定义了一个通用\
  \ Linux API，以与设备无关的方式配置 WLAN 设备驱动程序。它还提供了一系列常用工具来设置和访问来自 WLAN 驱动的信息。各个驱动程序实现对无线扩展的支持，以便将其连接到通用接口，从而连接到工具。\n\
  \n通过无线扩展，主要有三种方法与 WLAN 驱动通信：\n\n1.  使用 `iwconfig` 工具进行标准操作。要让你的驱动与 `iwconfig` 配合，你需要实现与设置\
  \ ESSID 和 WEP 密钥等参数的命令对应的规定函数。\n2.  使用 `iwpriv` 进行特殊操作。要在你的驱动上使用 `iwpriv`，请定义与硬件相关的私有\
  \ ioctl 并实现相应的处理函数。\n3.  通过 `/proc/net/wireless` 获取 WiFi 特有的统计信息。为此，请在你的驱动中实现 `get_wireless_stats()`\
  \ 方法。这是在 NIC 驱动为了通用统计收集而实现的 `get_stats()` 方法之外的，详见第 15 章中“网络接口卡”节描述的“统计”。\n\nWLAN\
  \ 驱动程序将这三部分信息封装在一个名为 `iw_handler_def` 的结构中，该结构定义在 `include/net/iw_handler.h`。该结构的地址在初始化期间通过设备的\
  \ `net_device` 结构（在第 15 章中讨论）提供给内核。列表 16.3 显示了一个实现无线扩展支持的 WLAN 驱动框架。列表中的注释解释了相关的代码。\n\
  \n#### 列表 16.3. 支持无线扩展\n![image](img/p0491-01.jpg)\n![image](img/p0492-01.jpg)\n\
  ![image](img/p0492-02.jpg)\n\n在编译了无线扩展支持后，你可以使用 `iwconfig` 配置 ESSID 和 WEP 密钥，查看支持的私有命令，并转储网络统计信息：\n\
  \n![image](img/p0493-01.jpg)\n\n本地 `iwconfig` 参数如 ESSID 和 WEP 密钥应匹配接入点。另一个名为 `cfg80211`\
  \ 的项目与无线扩展的目标相似，它从 2.6.22 版本开始合并入主内核\n\n### 设备驱动程序\n\n市场上有很多 WLAN 原始设备制造商（OEM），卡的形式多样，如\
  \ PCI、Mini PCI、CardBus、PCMCIA、USB 和 SDIO（参见“WiFi over SDIO”）。然而，核心芯片以及相应的 Linux\
  \ 驱动数量相对较少。Intersil Prism 芯片、Lucent Hermes 芯片、Atheros 芯片和 Intel Pro/Wireless 是常用的控制器。以下是使用这些芯片的示例设备：\n\
  \n*   Intersil Prism WLAN 紧凑卡——Oroco 驱动支持基于 Prism 和 Hermes 的卡。查看 `drivers/net/wireless/`\
  \ 中的 `orinoco.c` 和 `hermes.c`。`orinoco_cs` 提供 PCMCIA/CF 服务。\n*   Cisco Aironet CardBus\
  \ 适配器——该卡使用 Atheros 芯片。`Madwifi` 项目（[`madwifi.org/`](http://madwifi.org/））提供了一个运行在\
  \ Atheros 控制器硬件上的 Linux 驱动。由于许可问题，`Madwifi` 源码并不是内核的一部分。Madwifi 驱动的一个模块硬件访问层（HAL）是闭源的。这是因为\
  \ Atheros 能够在允许范围外的频率工作并在各种功率水平下运行。联邦通信委员会（FCC）规定此类设置不应被用户轻易更改。为了符合规定，部分 HAL 以二进制形式发行。该二进制部分与内核版本无关。\n\
  *   许多笔记本内置的 Intel Pro/Wireless Mini PCI（及 PCIe Mini）卡——内核树包含了这些驱动。2100 和 2200 系列卡的驱动分别为\
  \ `drivers/net/wireless/ipw2100.c` 和 `drivers/net/wireless/ipw2200.c`。这些设备需要板固件才能工作。你可以从\
  \ [http://ipw2100.sourceforge.net/](http://ipw2100.sourceforge.net/) 或 [`ipw2200.sourceforge.net/`](http://ipw2200.sourceforge.net/)\
  \ 下载固件，取决于你拥有 2100 还是 2200。第 4 章中“微代码下载”节描述了向这些卡下载固件所需的步骤。Intel 对这些固件的发行条款是严格的。\n\
  \n\n\n\n\n*   WLAN USB 设备——Atmel USB WLAN 驱动`([`atmelwlandriver.sourceforge.net/`](http://atmelwlandriver.sourceforge.net/))`\
  \ 支持使用 Atmel 芯片组构建的 USB WLAN 设备。\n\nWLAN 驱动的任务是让你的网卡显示为正常的网络接口。驱动程序的实现通常分为以下几个部分：\n\
  \n1.  与 Linux 网络栈通信的接口——我们已经在第 15 章的“[网络设备接口”章节中详细讨论过这一点。你可以使用该章节中的列表 15.1 作为模板来实现你\
  \ WLAN 驱动的这部分。\n\n2.  特定外形规格的代码——如果你的网卡是 PCI 卡，则它的架构设计必须符合第 10 章中“外围部件互连”所述的内核 PCI\
  \ 子系统。同样，PCMCIA 和 USB 卡也必须与其各自的核心层衔接。\n\n3.  特定芯片组部分——这是 WLAN 驱动的基石，基于芯片数据手册中的寄存器规范。然而，许多公司并没有为编写开源设备驱动发布足够的文档，因此某些\
  \ Linux WLAN 驱动的这部分至少部分是基于逆向工程。\n\n4.  对无线扩展（Wireless Extensions）的支持——之前显示的列表 16.3\
  \ 实现了一个示例。\n\n802.11 栈中硬件无关的部分可以在驱动之间复用，因此它们被实现为 `/net/ieee80211/` 目录下的通用库函数集。`ieee80211`\
  \ 是核心协议模块，但如果你想通过 `iwconfig` 命令配置 WEP 密钥，还需要加载 `ieee80211_crypt` 和 `ieee80211_crypt_wep`。要生成来自\
  \ 802.11 栈的调试输出，在配置内核时启用 `CONFIG_IEEE80211_DEBUG`。你可以使用 `/proc/net/ieee80211/debug_level`\
  \ 作为旋钮来微调你想要看到的调试信息类型。从 2.6.22 版本开始，内核有一个由名为 Devicescape 的公司捐赠的备用 802.11 栈（`net/mac80211/`）。WiFi\
  \ 设备驱动可能会迁移到这个新栈。\n\n***\n\n### SDIO 之 WiFi\n\n就像功能从存储扩展到各种其他技术的 PCMCIA 卡一样，SD 卡不再局限于消费电子的内存空间。安全数字输入/输出（SDIO）标准将\
  \ WiFi、蓝牙和 GPS 等技术引入了 SD 领域。托管在 `[`sourceforge.net/projects/sdio-linux/`](http://sourceforge.net/projects/sdio-linux/)`\
  \ 的 Linux-SDIO 项目为多种 SDIO 卡提供了驱动程序。\n\n访问 [www.sdcard.org](http://www.sdcard.org)\
  \ 浏览 SD 卡协会（SD Card Association）网站。该协会采用的最新标准是 microSD 和 miniSD，它们是 SD 卡的微型外形规格版本。\n\
  \n***\n\n### 查看源码\n\nWiFi 设备驱动位于 `drivers/net/wireless/`。查看 `net/wireless/` 目录下的无线扩展（Wireless\
  \ Extensions）的实现。\n\n### 蜂窝网络\n\n全球移动通信（GSM）是一项显著特性。与 2G 不同，2.5G 更高的速度。出于性能考虑，许多\
  \ CDMA PC 卡有一个内部 USB 控制器，通过它连接 CDMA 调制解调器。当插入此类卡时，系统会在 PCI 总线上看到一个或多个新的 PCI 转 USB\
  \ 桥接。让我们以华为 CDMA CardBus 卡为例。将此卡插入笔记本电脑的 CardBus 插槽后，查看 lspci 输出中的额外条目：\n\n\n\n\n\
  \n前三个项目（`bus7`、`bus6` 和 `bus5`）对应于 CDMA 卡中存在的三个主机控制器。最后一个条目显示一个全速（12Mbps）USB 设备已连接到\
  \ `bus 5`。该设备的 `vendorID` 为 `0x12d1`，`productID` 为 `0x1001`。从之前的输出中可以看出，USB 核心已将该设备绑定到\
  \ `pl2303` 驱动程序。如果你查看 PL2303 Prolific USB 转串口适配器驱动程序的源文件（（`drivers/usb/serial/pl2303.c`），你将在\
  \ `usb_device_id` 表中找到以下成员：\n\n![image](img/p0499-01.jpg)\n\n快速查看位于同一目录下的 `pl2303.h`\
  \ 可以确认 `HUAWEI_VENDOR_ID` 和 `HUAWEI_PRODUCT_ID` 与你刚刚从 `/proc/bus/usb/devices` 中获取的值相匹配。`pl2303`\
  \ 驱动程序通过检测到的 USB 转串口转换器提供串口接口 `/dev/ttyUSB0`。你可以通过此接口向 CDMA 调制解调器发送 `AT` 命令。在该设备上附加\
  \ `pppd` 并连接网络。你现在是一个 3G 冲浪者！\n\n### 当前趋势\n\n在如今移动连接光谱的一端，有一些标准允许蜂窝网络与 WiFi 之间耦合，以提供更便宜的网络解决方案。在另一端，蓝牙和红外线等技术被集成到手机中，以将消费电子设备连接到互联网。图\
  \ 16.7 显示了一个示例场景。\n\n图 16.7。无线技术之间的耦合。\n\n![image](img/16fig07.gif)\n\n与现有标准和技术耦合的同时，新的通信标准源源不断进入无线领域。\n\
  \nZigbee ([www.zigbee.org](http://www.zigbee.org)) 采用新的 `802.15.4` 标准用于嵌入式空间的无线网络，其特点是范围短、速度低、功耗小且代码占用。。主要针对家庭和工业自动化。在本章讨论的无线协议中，Zigbee\
  \ 与蓝牙最接近，但被认为是互补而非竞争关系。\n\nWiMax（全球微波互操作性）基于 `IEEE 802.16` 标准，是 WiFi 的城域网（MAN）版本，范围达几公里。它支持家庭和办公室的固定连接，以及用于移动联网的移动版本。WiMax\
  \ 是解决“最后一公里”连接问题（类似于从最近的地铁站到达家的任务）的一种成本效益的方法，并能创建跨越大区域的宽带云。WiMax 论坛托管在 [www.wimaxforum.org](http://www.wimaxforum.org)。\n\
  \nMIMO（多输入多输出）是一种新的多天技术，被 WiFi 和 WiMax 产品利用以增强其速度、范围和连接性。\n\n工作组正在开发属于第四代或 4G 网络范畴的新标准。4G\
  \ 将标志着多种通信技术的融合。\n\n一些新的通信技术对操作系统是透明的，并且与现有的驱动程序和协议栈配合工作不变。其他像 Zigbee 这样的技术需要新的驱动程序和协议栈，但尚未尚未被接受的开源实现。Linux\
  \ 反映了技术的领先水平，因此请关注未来内核发布中对这些新标准的支持。\n\n## 17 章 存储技术设备\n\n#### 本章内容\n\n*   什么是闪存？\n\
  *   Linux-MTD 子系统\n*   映射驱动程序\n*   NOR 芯片驱动程序\n*   NAND 芯片驱动程序\n*   用户模块\n*   MTD-Utils\n\
  *   配置 MTD\n*   现场执行 (eXecute In Place\n*   固件枢纽\n*   调试\n*   查看源码\n\n***\n\n当你按下手持设备的电源开关时，它极可能是从闪存启动的。当你点击某些按钮在手机上保存数据时，你的数据极可能在其生命之始于闪存。今天，Linux\
  \ 已经渗透到嵌入式空间，不再局限于桌面电脑和服务器。Linux 的化身出现在 PDA、音乐播放器、机顶盒甚至医疗级设备中。内核的存储技术设备（MTD）子系统负责使你的系统与这些设备中找到各种类型的闪存建立接口。在本章中，让我们以\
  \ Linux 手持设备为例来学习 MTD。\n\n***\n\n## 什么是闪存？\n\n闪存是可重写的存储器，它不需要电源即可保存信息。闪存器通常组织成扇区。与传统的存储不同，写入闪存之前必须先进行擦除。由于这些限制，闪存最好配合为其定制的驱动程序和文件系统一起。在\
  \ Linux 中，MTD 提供了这些支持。\n\n闪存芯片通常有两种类型：NOR 和 NAND。NOR 用于在嵌入式设备上存储固件镜像，而 NAND 用于大容量、廉价但不完美的介质，如\
  \ U 盘和磁盘模块（DOM）。NOR 闪存通过地址和数据线连接到处理器，但 NAND 芯片使用 I/O 和控制线进行接口。因此，位于 NOR 闪存上的代码可以直接执行，但存储在\
  \ NAND 闪存上的代码必须复制到 RAM 中。\n\n### Linux-MTD 子系统\n\n图 17.1（ch17.html_ch17fig01）所示的内核\
  \ MTD 子系统为闪存及类似的非易失固态存储提供支持。它由以下部分组成：\n\n*   MTD 核心，子系统其他部分使用的库函数和数据结构的基础\n*   映射驱动程序，决定当收到闪存请求时处理器应该做什么\n\
  *   了解与 NOR 闪存通信的 NOR 芯片驱动程序\n*   为 NAND 控制器实现底层支持的 NAND 芯片驱动程序\n*   用户模块，与用户空间程序交互的层\n\
  *   针对某些特殊闪存的独立设备驱动程序\n\n图 17.1。Linux-MTD 子系统。\n\n![image](img/17fig01.gif)\n\n\
  ### 映射驱动程序\n\n为了启用设备的 MTD，你的首要任务是告诉 MTD 如何访问闪存设备。为此，你必须映射你的闪存范围以便 CPU 访问，并提供操作闪存的方法。下一个任务是通知\
  \ MTD 闪存上的不同存储分区。与 PC 兼容系统上的硬盘不同，闪存介质上不包含标准分区表。因此，无法使用 `fdisk` 和 `cfdisk` 等磁盘分区工具对闪存进行分区。相反，分区信息必须作为内核代码的一部分来实现。这些任务通过\
  \ MTD 映射驱动程序的帮助完成。\n\n为了更好地理解映射驱动程序的功能，让我们来看一个例子。\n\n### 设备示例：手持设备\n\n\n\n\n\n考虑图\
  \ 17.2 所示的 Linux 手持设备。该闪存大小为 32MB，并映射到处理器地址空间中的 `0xC0000000`。它包含三个分区，分别用于引导加载程序（bootloader）、内核和根文件系统。引导加载程序分区从闪存顶部开始，内核分区从偏移量\
  \ `MY_KERNEL_START` 开始，根文件系统从偏移量 `MY_FS_START` 开始。[[4]](#footnote.html_ch17fn04)引导加载程序和内核位于只读分区上，以避免意外损坏，而文件系统分区被标记为可读写。\n\
  \n图 17.2 示例 Linux 手持设备上的闪存内存。\n\n![image](img/17fig02.gif)\n\n让我们先创建闪存映射，然后进行驱动程序初始化。映射驱动必须将图中所示的闪存布局转换为\
  \ `mtd_partition` 结构。列表 17.1 包含了对应图 17.2 的`mtd_partition`定义。注意，`mask_flags`字段持有要被掩码的权限，因此`MTD_WRITEABLE`意味着只读分区。\n\
  \n### 列表 17.1. 创建 MTD 分区映射\n\n![image](img/p0506-01.jpg)\n\n列表 17.1 使用`MTDPART_OFS_APPEND`开始一个与上一个相邻的分区。然而，可写分区的起始地址需要与闪存芯片的擦除/扇区大小对。为了实现这一点，文件系统分区使用了`MTD_OFS_NEXTBLK`而不是`MTD_OFS_APPEND`。\n\
  \n现在你已经填充了`mtd_partition`结构，让我们继续为示例手持设备完成基础映射驱动程序。列表 17.2 将映射驱动程序注册到 MTD 核心。它被实现为一个平台驱动程序，假设你的特定架构代码注册了一个同名的关联平台设备。请回到第\
  \ 6 章中的“设备示例：手机”章节或“串口驱动程序”章节，了解关于平台设备和平台驱动程序的讨论。`platform_device`由关联架构代码定义如下：\n\
  \n![image](img/p0508-01.jpg)\n\n### 列表 17.2. 注册映射驱动\n\n![image](img/p0508-02.jpg)\n\
  \n由于内核发现列表 17.2 中注册的平台驱动程序的名称与已注册的平台设备名称匹配，它调用了探针方法`pda_mtd_probe()`，该方法如列表 17.3\
  \ 所示。该例程：\n\n*   使用`request_mem_region()`预留闪存内存地址范围，并使用`ioremap_nocache()`获取对该内存的\
  \ CPU 访问。你已经在第 10 章的“外围组件互连”中学学习过如何操作。\n*   填充`map_info`结构（接下来将讨论），包含如闪存内存起始地址和大小等信息。该结构中的信息将在下一步执行探针时使用。\n\
  *   通过合适的 MTD 芯片驱动程序（在下一节讨论）探针闪存。只有芯片驱动程序知道如何查询芯片并触发访问它所需的指令集。芯片层在查询时会尝试总线宽度和交错的不同组合。在图\
  \ 17.2 中，两个 16 位闪存库并行连接以填充 32 位处理器总线宽度，因此你具有双路交错。\n*   将你之前填充的`mtd_partition`结构注册到\
  \ MTD 核心。\n\n在查看列表 17.3 之前，让我们认识一下`map_info`结构。它包含了闪存内存的地址、大小、宽度以及访问它的例程：\n\n![image](img/p0509-01.jpg)\n\
  \n在我们讨论访问闪存芯片话题时，让我们简单回顾一下我们在第 4 章“打基础”中讨论过的内存屏障。编译器（或处理器）看来语义上没有改变的指令重排在现实中可能如此，因此闪存内存上的数据操作顺序最好保持不变。例如，你不希望在写入之后擦除闪存扇区，而不是相反。此外，相同的闪存芯片及其设备驱动程序被用于具有不同指令重排算法的各种嵌入式处理器。由于这些原因，MTD\
  \ 驱动程序是硬件内存屏障的显著用户。`simple_map_write()`是映射驱动用于`write()`的通用例程，它在返回之前插入了屏障。\n\n###\
  \ 列表 17.3. 映射驱动探针方法\n\n![image](img/p0510-01.jpg)\n\n`mb()`确保不会重排读写操作。当你带有映射驱动启动内核时，用户空间应用程序可以分别将引导加载程序、内核和文件系统分区看到`/dev/mtd/0`、`/dev/mtd/1`和`/dev/mtd/2`。因此，要在手持设备上测试新内核，你可以：\n\
  \n```\ndd if=zImage.new of=/dev/mtd/1\n```\n\n#### 从引导加载程序进行闪存分区\n\nRedboot 引导加载程序维护着一个分区布局表，因此如果你在嵌入式设备上使用\
  \ Redboot，可以在引导加载程序中配置分区而不是编写 MTD 驱动。为了让 MTD 解析来自 Redboot 的信息，请在内核配置期间开启 CONFIG_MTD_REBOOT_PARTS。\n\
  \n### NOR 芯片驱动\n\n如你所示，图 17.2 使用的 NOR 闪标记为符合 CFI。CFI 代表通用闪存接口，是一种旨在消除为不同厂商开发单独驱动程序的规范。软件可以查询符合\
  \ CFI 的闪存芯片并自动检测块大小、定时参数和通信所需的指令集。实现 CFI 和 JEDEC 等规范的驱动程序被称为芯片驱动。\n\n根据 CFI 规范，软件必须向闪存内存内的位置`0x55`写入`0x98`以启动查询。查看列表\
  \ 17.4 了解 MTD 如何实现 CFI。\n\n#### 列表 17.4. 查询符合 CFI 的闪存\n\n![image](img/p0512-01.jpg)\n\
  \nCFI 规范定义了符合芯片可以实现的各种指令集。一些常见的有：\n\n*   指令集`0001`，由 Intel 和 Sharp 闪存支持\n*   指令集`0002`，在\
  \ AMD 和富士闪存上实现\n*   指令集`0020`，用于 ST 闪存\n\nMTD 作为内核模块支持这些指令集。你可以通过内核配置启用你的闪存芯片支持的那个。\n\
  \n### NAND 芯片驱动\n\nNAND 技术用户如 USB 闪盘、DOM、紧凑内存和 SD/MMC 卡通过 NAND 闪存模拟标准接口（如 SCSI 或\
  \ IDE），因此你不需要开发 NAND 驱动程序与其通信。[[5]](#footnote.html_ch17fn05)然而，板载 NAND 闪存芯片需要特殊的驱动程序，它们是本节的主题。\n\
  \n\n\n\n正如你在本章之前学到的，NAND 闪芯片与 NOR 闪不同，它们并不通过数据和地址线连接到 CPU。它们通过一个名为 NAND 闪控制器的特殊电子设备与\
  \ CPU 接口，该控制器是许多嵌入式处理器的一部分。要从 NAND 闪读取数据，CPU 向 NAND 控制器发送适当的读取命令。控制器将数据从请求的闪存位置传输到内部\
  \ RAM 内存中，RAM 也是控制器的一部分。数据传输是以闪存芯片的页大小（例如`2KB`）为单位进行的。通常情况下，闪存密度越高，其页大小越大。注意，页大小与闪存芯片的块（block）大小不同，块是最小的可擦除闪存内存单元（例如，`16KB`）。在传输操作完成后，CPU\
  \ 从内部 RAM 读取所请求的 NAND 内容。写入 NAND 闪的操作也类似，不同之处在于将数据从内部 RAM 传输到闪存。嵌入式设备上 NAND 闪存的连接图如图\
  \ 17.3\n\n由于这种非常规的寻址模式，你需要特殊的驱动程序来处理 NAND 存储器。MTD 提供了此类驱动程序来管理驻留 NAND 数据。如果你使用的是支持的芯片，只需启用相应的低级\
  \ MTD NAND 驱动程序。然而，如果你正在编写 NAND 闪驱动程序，你需要研究两份数据表：NAND 闪控制器和 NAND 闪芯片的数据表。\n\nNAND\
  \ 闪芯片不支持使用 CFI 等协议进行自动配置。你必须通过向在 `drivers/mtd/nand/nand_ids.c` 中定义的 `nand_flash_ids[]`\
  \ 表添加条目，手动告知 MTD 关于 NAND 芯片的属性。表中的每个条目由标识符名称、设备 ID、页大小、擦除块大小、芯片大小以及总线宽度等选项组成。\n\n\
  还有一个与 NAND 内存密切相关的特征。NAND 闪芯片与 NOR 芯片不同，它们并非完美。在 NAND 闪区域散布着一些故障位和坏块是正常的。为了处理这个问题，NAND\
  \ 设备为每个闪存页关联了一个备用区域（例如，每个`2KB`数据页对应`64 bytes`的备用区域）。备用区域包含带外（OOB）信息，帮助执行坏块管理和纠错。OOB\
  \ 区域包含纠错码（ECC），用于实现错误纠正和检测。ECC 算法纠正单位错误并检测多位错误。在 `include/mtd/mtd-abi.h` 中定义的 `nand_ecclayout`\
  \ 结构规定了 OOB 备用区域的布局：\n\n![image](img/p0514-01.jpg)\n\n在该结构中，`eccbytes` 存储存储 ECC\
  \ 数据的 OOB 字节数，`eccpos` 是一个指向 ECC 数据的 OOB 区域偏移量数组。`oobfree` 记录了 OOB 区域中未使用的字节，这些字节可供闪存文件系统存储标记（如指示擦除操作成功完成的标记）。\n\
  \n各个 NAND 驱动程序根据芯片属性初始化其 `nand_ecclayout`。图 17.4 展示了页大小为 `2KB` 的 NAND 闪芯片的布局。图中使用的\
  \ OOB 语义是通用 NAND 驱动 `drivers/mtd/nand/nand_base.c` 中定义的 `2KB` 页大小芯片的默认设置。\n\n**图\
  \ 17.4. NAND 闪芯片的布局。**\n\n![image](img/17fig04.gif)\n\n通常，NAND 控制器通过对操作 OOB 区域中的\
  \ ECC 字段在硬件中执行纠错和检测。然而，如果你的 NAND 控制器不支持错误管理，你将需要 MTD 在软件中为你完成该工作。MTD `nand_ecc`\
  \ 驱动（`drivers/mtd/nand/nand_ecc.c`）实现了软件 ECC。\n\n图 17.4 还显示了包含坏块标记的 OOB 内存字节。这些标记用于指示故障闪存块，通常存在于每个块第一页所属的\
  \ OOB 区域。标记在 OOB 区域内部的位置取决于芯片的属性。坏块标记要么是在制造期间由工厂设置，要么是软件检测到块的磨损时设置的。MTD 在 `drivers/mtd/nand/n_bbt.c`\
  \ 中实现坏块管理。\n\n列表 17.1 中用于图 17.2NOR 闪的 `mtd_partition` 结构也适用于 NAND 内存。在你通过 MTD 启用\
  \ NAND 闪后，可以使用标准设备节点（如 `/dev/mtd/X` 和 `/dev/mtdblock/X`）访问其组成分区。如果你的硬件上混合了 NOR 和\
  \ NAND 内存，`X` 可以是 NOR 分区的 NAND 分区。如果你总共有超过 32 个闪存分区，请相应更改 `include/linux/mtd/mtd.h`\
  \ 中 `MAX_MTD_DEVICES` 的值。\n\n为了有效利用 NAND 存储，你需要使用针对 NAND 访问优化的文件系统（如 JFFS2 或 YAFFS2），配合低级\
  \ NAND 驱动程序。我们将在下一节讨论这些文件系统。\n\n### 用户模块\n\n在你添加映射驱动并选择正确的芯片驱动后，就可以让上层使用闪存。执行磁盘\
  \ I/O 的用户空间应用程序需要将闪存视为磁盘，而希望访问原始 I/O 的程序将其视为字符设备。实现这些功能的 MTD 层被称为用户模块，如图 17.1\n\n\
  正如你即将看到的，在闪存分区上使用 JFFS2 而不是 EXT2 要明智得多。\n\n文件翻译层（FTL）和 NAND 文件翻译层（NFTL）执行一种名为磨损均衡的转换。闪存内存只能承受有限次数的擦除操作（约\
  \ 10 万次）。磨损均衡通过跨芯片分布内存使用来延长闪存寿命。FTL 和 NFTL 都提供了类似于 mmtdblock 的设备接口，可以在上面放置普通文件系统。相应的设备节点命名为\
  \ `/dev/nftl/X`，其中 `X` 是分区号。这些模块中某些算法受专利保护，因此可能会存在限制。\n\n### 字符设备仿真\n\n`mtdchar`\
  \ 驱动提供了闪存设备的线性视图，而不是文件系统所需的块定向视图。由 `mtdchar` 创建的设备节点命名为 `/dev/mtd/X`，其中 `X` 是分区号。你可以通过相应的\
  \ `mtdchar` 接口使用 `dd` 更新图[17.2](#ch17.html_ch17fig02）所示的手持设备的引导加载分区：\n\n```bash\n\
  dd if=bootloader.bin of=/dev/mtd/0\n```\n\n原始 `mtdchar` 分区的一个示例用途是存储嵌入式设备引导加载程序生成的\
  \ POST 错误日志。嵌入式系统中字符闪区的另一个用途是存储类似于 PC 兼容系统中 CMOS 或 EEPROM 中存在的信息。这包括启动顺序、开机密码以及设备序列号和型号等等关键产品数据（VPD）。\n\
  \n\n\n日志记录文件系统（JFFS）被认为是最适合闪存的文件系统。目前版本 2（`JFFS2`）正在使用，而 `JFFS3` 正在开发中。`JFFS` 最初为\
  \ NOR 闪存芯片编写，但对 NAND 设备的支持已合并到 2.6 内核中。\n\n普通的 Linux 文件系统是为正常关机的台式电脑设计的。JFFS2 是为可能发生意外掉电的嵌入式系统设计的，存储设备只能承受有限次数的擦除。在闪存擦除操作期间，当前扇区的内容保存在\
  \ RAM 中。如果在缓慢的擦除过程中发生掉电，该扇区的全部内容可能会丢失。JFFS2 使用日志结构设计规避了这个问题。新数据被追加到位于擦除区域的日志中。每个\
  \ JFFS2 节点都包含用于跟踪不同文件位置的元数据。通过垃圾回收定期释放内存。由于这种设计，闪存写入不需要经过“保存-擦除-写入”的循环，这提高了关机可靠性。日志结构还通过分散写入延长了闪存的使用寿命。\n\
  \n要在擦除大小为 256KB 的闪存芯片上为位于 `/path/to/filesystem/` 下的树创建 JFFS2 镜像，如下使用 `mkfs.jffs2`：\n\
  \n![image](img/p0517-01.jpg)\n\nJFFS2 包含垃圾回收器（GC），用于不再使用的闪存区域。垃圾回收算法取决于擦除大小，因此提供准确的值会使其更高效。要获取闪存分区的擦除大小，你可以寻求\
  \ `/proc/mtd` 的帮助。图中图 17.2 所示的 Linux 手持设备的输出如下：\n\n![image](img/518tab01.jpg)\n\n\
  JFFS2 支持压缩。在 `CONFIG_JFFS2_COMPRESSION_OPTIONS` 下启用相应的选项以选择可用的压缩器，并查看 `fs/jffs2/compr*.c`get\
  \ 它们的实现。\n\n注意，JFFS2 文件系统镜像通常在进行交叉开发的主机上创建，然后通过适当的下载机制（如串口、USB 或 NFS）传输到目标设备上所需的闪存分区。更多信息请参阅第\
  \ 18 章，“嵌入式 Linux](#ch18.html_ch18)”。\n\n### YAFFS2\n\n2.6 内核中 JFFS2 实现包含了处理 NAND\
  \ 闪存局限性的功能，但另一个闪存文件系统（YAFFS）是一种专门为 NAND 内存特定约束设计的文件系统。YAFFS 不是主内核的一部分，但某些嵌入式发行版对其内核进行了补丁，支持\
  \ YAFFS2（YAFFS 的当前版本）。\n\n你可以从 [www.yaffs.net](http://www.yaffs.net) 下载 YAFFS2 源码和文档。\n\
  \n### MTD-Utils\n\nMTD-utils 包可以从 `ftp://ftp.infradead.org/pub/mtd-utils/` 下载，包含了多个在支持\
  \ MTD 的闪存内存上运行的实用工具。包含的实用示例包括 `flash_eraseall`、`nanddump`、`nandwrite` 和 `sumtool`。\n\
  \n擦除第二个闪存分区（在 NOR 或 NAND 设备上），如下使用 `flash_eraseall`：\n\n```bash\nflash_eraseall\
  \ -j /dev/mtd/2\n```\n\n由于 NAND 芯片可能包含坏块，请使用感知 ECC 能力的程序（如 `nandwrite` 和 `nanddump`）来拷贝原始数据，而不是通用工具（如\
  \ `dd`）。要将你之前创建的 JFFS2 镜像存储到第二个 NAND 分区，请执行以下操作：\n\n```bash\nnandwrite /dev/mtd/2\
  \ jffs2.img\n```\n\n你可以通过使用 `sumtool` 向 JFFS2 镜像插入摘要信息并在配置内核时开启 `CONFIG_JFFS2_SUMMARY`\
  \ 来缩短 JFFS2 的挂载时间。要将摘要 JFFS2 镜像写入之前的 NAND 闪存，请执行以下操作：\n\n![image](img/p0519-01.jpg)\n\
  \n### 配置 MTD\n\n要为内核启用 MTD，必须选择合适的配置选项。对于图 17.2 所示的闪存芯片，所需的选项如下：\n\n![image](img/p0519-02.jpg)\n\
  \n`CONFIG_MTD_PDA_MAP` 假设是一个新增的选项，用于启用我们之前编写的映射驱动程序。这些功能中的每一个也可以编译为内核模块，除非你有一个驻留在\
  \ MTD 中的根文件系统。若要在启动期间将图 17.2 中的文件系统分区挂载为根设备，请要求引导加载程序在传递给内核的命令行字符串中追加 `root=/dev/mtdblock/2`。\n\
  \n你可以通过消除冗余探测来减小内核占用。由于我们的示例手持设备有两个位于 32 位物理总线上的并行 16 位 bank（这导致了双向交替传输和 2 字节的 bank\
  \ 宽度），你可以使用这些额外选项进行优化：\n\n![image](img/p0520-01.jpg)\n\n`CONFIG_MTD_MAP_BANK_WIDTH_2`\
  \ 启用宽度为 2 的 CFI 总线宽度，`CONFIG_MTD_CFI_WIDTH_2` 启用宽度为 2 的 CFI。\n\n### 原地执行 (XIP)\n\
  \n通过原地执行（XIP），你可以直接从闪存运行内核。消除将内核拷贝到 RAM 的额外步骤。\n\n### 固件环 (FWH)\n\nPC 兼容系统使用称为固件环（FWH）的\
  \ NOR 闪存在存储 BIOS。FWH 通过低引脚计数（LPC）总线连接到处理器。连接图见图 17.5。\n\n图 17.5 固件环\n\nMTD 子系统包含了处理器与\
  \ FWH 建立接口的驱动程序。FWH 通常不符合 CFI 规范。相反，它们符合 JEDEC（联合电子工程委员会）标准。要让 MTD 了解尚未的 JEDEC 芯片，请在\
  \ `drivers/mtd/chips/jedec_probe.c` 中的 `jedec_table` 中添加条目，如芯片制造商 ID 和指令集 ID。例如：\n\
  \n![image](img/p0520-02.jpg)\n\n当你像所示在 `jedec_table` 中有了芯片详情时，只要启用了正确的内核配置，MTD 应该就能识别你的闪存：\n\
  \n![image](img/p0521-01.jpg)\n\n`CONFIG_MTD_JEDECPROBE` 启用 JEDEC 芯片驱动，`CONFIG_MTD_ICHROM`\
  \ 添加将 FWH 映射到地址空间的 MTD 映射驱动。此外，你需要包含指令集实现（例如用于 Intel 扩展指令的 `CONFIG_MTD_CFI_INTEXT`）。\n\
  \n加载这些模块后，你可以通过 MTD 导出的设备节点与 FWH 通信。例如，可以使用简单的应用程序从用户空间重编程 BIOS，如列表 17.5 所示。操作此程序可能会损坏\
  \ BIOS 并导致系统无法启动！\n\n列表 17.5 对与 FWH 关联的 MTD 设备进行操作，假设其为 `/dev/mtd/0`。程序发出三个 MTD\
  \ 特有的 `ioctl` 命令：\n\n*   `MEMUNLOCK` 在编程之前解锁闪存扇区\n*   `MEMERASE` 在重写之前擦除闪存扇区\n*\
  \   `MEMLOCK` 在编程后重新锁定扇区\n\n### 调试\n\n要调试与闪存相关的问题，要在内核配置期间启用 `CONFIG_MTD_DEBUG`（设备驱动\
  \ → 内存技术设备 → 调试）。你可以在 0 到 3 之间调整调试详细程度。\n\n\n\nLinux-MTD 项目页面 [www.linux-mtd.infradead.org](http://www.linux-mtd.infradead.org)\
  \ 提供了常见问题（FAQs）、各种文档以及一篇关于 `JFFS2` 设计见解的论文。`linux-mtd` 邮件列表是讨论 MTD 设备驱动相关的地方。访问\
  \ [`lists.infradead.org/pipermail/linux-mtd/`](http://lists.infradead.org/pipermail/linux-mtd/)\
  \ 查看邮件列表存档。\n\n### 查看源码\n\n在内核树中，`drivers/mtd/` 目录包含 MTD 子系统的源码。`Map`、`chip` 和 `NAND`\
  \ 驱动分别存于 `drivers/mtd/maps/`、`drivers/mtd/chips/` 和 `drivers/mtd/nand/` 子目录下。大多数\
  \ MTD 数据结构定义在 `include/linux/mtd/` 下的头文件中。\n\n若要从 Linux 访问不支持的 BIOS 固件集纽，请以 `drivers/mtd/maps/ichxrom.c`\
  \ 为起点实现驱动程序。\n\n关于从用户空间操作 NAND OOB 数据的示例，请参考 MTD-utils 软件包中的 `nanddump.c` 和 `nandwrite.c`。\n\
  \n表 17.1 包含了本章使用的主要数据结构及其在源码树中的位置。表 17.2 列出了你在本章中使用的主要内核编程接口及其定义位置。\n\n表 17.1. 数据结构摘要\n\
  \n![image](img/525tab01.jpg)\n\n表 17.2. 内核编程接口摘要\n\n![image](img/525tab02.jpg)\n\
  \n## 第 18 章 嵌入式 Linux\n\n### 本章\n\n* 挑战\n* 组件选择\n* 工具链\n* 嵌入式引导加载程序\n* 内存布局\n* 内核移植\n\
  * 嵌入式驱动\n* 根文件系统\n* 测试基础设施\n* 调试\n\n* *\n\nLinux 正在进入消费电子、电信、网络、国防和医疗保健等工业领域。随着它在嵌入式领域的普及激增，你更有可能使用\
  \ Linux 设备驱动技能来启用嵌入式设备，而不是旧系统。在本章中，让我们以设备驱动开发者的视角进入嵌入式 Linux 世界。让我们看看典型的嵌入式 Linux\
  \ 解决方案的软件组件，并看看之前章节中看到的设备类是如何与常见的嵌入式硬件相结合的。\n\n* *\n\n## 挑战\n\n嵌入式系统带来了若干软件挑战：\n\
  \n* 嵌入式软件必须经过交叉编译，然后下载到目标设备上进行测试和验证。\n* 嵌入式系统与 PC 计算机不同，没有快速处理器、大缓存和完备的存储。\n* 通常很难免费获得嵌入式硬件的成熟开发和调试工具。\n\
  * Linux 社区在 x86 平台上有丰富的经验，因此如果你在开发嵌入式计算机，不太可能从专家那里获得即时的在线帮助。\n* 硬件分阶段演进。你可能必须在概念原型或参考板上开始软件开发，然后逐渐转向工程级调试硬件以及几次生产级单元。\n\
  \n所有这些都导致了更长的开发周期。\n\n从设备驱动的角度来看，嵌入式软件开发者经常面临在常规计算机上不常见的接口。图 18.1（第 4 章”中图 4.2 的扩展版本）显示了一个假设的嵌入式设备，它可以是手持智能手机、销售点（POS）终端、自助机、导航系统、游戏设备、汽车仪表盘上的遥测设备、IP\
  \ 电话、音乐播放器、数字机顶盒甚至是起搏器编程器。该设备围绕 SoC 构建，结合了闪存、SDRAM、LCD、触摸屏、USB OTG、串口、音频解码器、连接器、SD/MMC\
  \ 控制器、Compact Flash、I²C 设备、SPI 设备、JTAG、生物识别、智能卡接口、键盘、LED、开关以及特定领域的电子设备。修改和调试其中某些设备的驱动可能比通常更困难：NAND\
  \ 闪存驱动必须处理坏块和位故障等问题，与标准的 IDE 存储驱动不同。`JFFS2` 文件系统比 `EXT2` 或 `EXT3` 文件系统更调试。USB OTG\
  \ 驱动比 USB OHCI 驱动复杂。内核中的 SPI 子系统不如 `SPI` 等成熟。\n\n图 18.1. 假设的嵌入式设备框图。\n\n![image](img/18fig01.gif)\n\
  \n### 组件选择\n\n评估和选择组件是项目概念阶段的重要任务之一。查看侧栏“选择处理器和外围设备”，了解硬件设计师和产品经理在构建嵌入式设备选择组件时考虑的一些重要因素。在当今世界，上市时间往往是驱动设计的关键因素，软件工程师在塑造组件选择方面也有很大的发言权。Linux\
  \ 发行版的可用性会影响处理器的选择，而设备驱动的存在或良好的起点会影响外围芯片组的选择。\n\n尽管内核工程师需要尽职并评估多个 Linux 发行版（甚至是操作系统），但如果他认为这能降低项目风险，他可能会放弃技术上更优的发行版转而选择一个熟悉的。或者，如果这是相关领域的关键考虑因素，首选的发行版可能是提供免受内核漏洞引发的诉讼的一个。电气工程师可以将评估限制在发行版支持的处理器上，并倾向于该发行版支持的外围芯片组。\n\
  \n* *\n\n#### 选择处理器和外围设备\n\n让我们看看电气工程师和产品经理在为嵌入式设备选择组件时的一些常见问题。假设假设的处理器 `P` 入选，因为它满足了功耗和封装等基本产品需求。`P`\
  \ 和配套的外围芯片组正在评估中：\n\n性能：处理器频率是否足以驱动目标应用程序？如果嵌入式设备意图实现 CPU 密集型任务，所有软件子系统的 MIPS 预算是否与处理器的\
  \ MIPS 额平衡？例如，如果目标设备需要高分辨率图像，图形处理的 MHz 影响会拖慢网络等其他系统的性能吗？\n\n成本：我在组件上省了钱，但最终会在周围电子设备上多花两倍吗？例如，`P`\
  \ 需要额外的调节器吗？我是否需要增加额外的配件（例如 RTC 芯片），因为 `P` 没有内置它？`P` 的引脚是否比其他评估中的处理器更多，导致板密度更高、层数和过孔更多，从而增加了裸板成本？`P`\
  \ 是否消耗更多功率并产生更多热量，从而需要更大的电源和额外的无源元件？数据表中是否存在可能增加软件开发成本的错误？\n\n功能：`P` 能寻址的 DRAM、SRAM、NOR\
  \ 和 NAND 内存的最大尺寸是多少？\n\n\n\n\n\n# 业务规划\n\nP 的供应商是否提供更高功率处理器的升级路径，且该处理器是可以可以直接替换（引脚兼容）的？供应商公司是否稳定？\n\
  \n## 供应商\n这是一个单源组件吗？如果是，供应商是否波动较大？采购这些部件的周期是多少？\n\n## 寿命（End-of-Life）\nP 是否可能在嵌入式设备的预期寿命结束之前停止？\n\
  \n## 可信度\nP 是否是受认可的组件？正在评估的外围芯片组是否有行业细分市场支持？例如，正在考虑的显示屏 LCD 是否正用于汽车仪表盘？\n\n## 坚固性\n\
  组件是否需要军用级（MIL）或工业级标准？\n\n人们必须评估不同的候选方案，并在所有这些因素之间找到平衡点。\n\n# 工具链\n\n由于目标设备可能与你的主机开发平台不二进制兼容，你必须使用工具链对嵌入式软件进行交叉编译。建立完整的工具链涉及构建以下内容：\n\
  \n1. `GNU C (cross-)Compiler`。`GCC` 支持 Linux 运行的所有平台，但你必须对其进行配置和构建，以为你的目标架构生成代码。本质上，你必须编译编译器本身并生成适当的交叉编译器。\n\
  2. `Glibc`，当你为目标设备构建应用程序时所需的 C 语言库集。\n3. `Binutils`，包含交叉汇编器以及如 `objdump` 等工具。\n\n\
  在几年前，准备一套开发工具链是一项艰巨的任务，但今天通常非常简单，因为 Linux 发行版为各种架构提供了预编译的二进制文件和易于安装的工具。\n\n### 嵌入式启动加载程序\n\
  \nBootloader 开发通常是任何嵌入式工作的起点。你必须决定是从头编写启动加载程序，还是调整现有的开源启动加载程序以适应你的需求。每个候选启动加载程序可能基于不同的哲学构建：小内存占用、易于移植、快速启动或支持某些特定功能的能力。在确定了起点后，你就可以设计并实现特定设备的修改。\n\
  \n在本节中，我们用 `bootloader` 一词表示整个启动套件。它包括以下内容：\n\n* `BIOS`（如果存在）\n* 将 `bootloader`\
  \ 放入启动设备所需的任何自引导代码\n* 实际 `bootloader` 的一个或多个阶段\n* 在外部主机上执行的任何程序，该程序通过与 `bootloader`\
  \ 通信将固件下载到目标设备\n\n至少，`bootloader` 负责处理器和板级特定的初始化、将内核和可选的初始内存磁盘加载到内存中，并将控制权交给内核。此外，`bootloader`\
  \ 可能负责提供 `BIOS` 服务、执行 `POST`（上自检）、支持向目标下载固件，并将内存布局和配置信息传递给内核。对于出于安全原因使用加密固件镜像的嵌入式设备，启动加载程序可能承担解密固件的任务。某些启动加载程序支持调试监控器，可在目标设备上加载和调试独立代码。你还可能决定在你的\
  \ `bootloader` 中建立故障恢复机制，以从现场的内核损坏中恢复。\n\n通常情况下，启动加载程序的架构取决于处理器家族、硬件平台上的芯片组、启动设备以及运行在设备上的操作系统。为了说明处理器家族对启动套件的影响，请考虑以下情况：\n\
  \n* 为围绕 `StrongARM` 处理器设计的设备设计的 `bootloader` 必须知道是在启动系统还是从睡眠中唤醒它，因为在这两种情况下，处理器都从其地址空间的顶部（即\
  \ `bootloader`）开始执行。如果是从睡眠中唤醒，`bootloader` 必须将控制权交给恢复系统状态的内核代码；如果系统是从复位启动，则从启动设备加载内核。\n\
  * `x86` `bootloader` 可能需要切换到保护模式，以加载大于 1MB 实模式限制的内核。\n* 基于 `x86` 平台的嵌入式系统无法利用旧 `BIOS`\
  \ 的服务。因此，如果你想让你的嵌入式设备从外部 `USB` 设备启动，你必须在你的 `bootloader` 中构建 `USB` 功能。\n* 即使两个平台基于相似的处理器内核，启动加载程序的架构也可能根据\
  \ `SoC` 而不同。例如，考虑两个基于 `ARM` 的设备：`Compaq iPAQ H3900` PDA 和 `Darwin Jukebox`。前者围绕\
  \ `Intel PXA250` 控制器构建，该芯片具有基于 `ARMv5` 的 `XScale` CPU；而后者使用 `Cirrus Logic EP7312`\
  \ 控制器设计，该控制器使用 `ARMv3` 核心。虽然 `XScale` 支持 `JTAG`（以开发此硬件辅助调试标准的联合测试小组命名）将 `bootloader`\
  \ 加载到闪存，但 `EP7312` 有一个自引导模式来完成相同任务。\n\n启动套件需要一种机制将 `bootloader` 镜像从主机开发系统传输到目标的启动设备。这被称为\
  \ `bootstrapping`（自引导）。在 `PC` 兼容系统中，`bootstrapping` 是简单的：如果 `BIOS` 闪存在进入操作系统后损坏或需要更新，则使用外部烧录器编程；如果健康则正常。然而，嵌入式设备没有通用的自引导方法。\n\
  \n为了说明嵌入式系统上的自引导，以 `Cirrus Logic EP7211` 控制器为例（它是上一节讨论的 `EP7312` 的前身）。`EP7211` 在自引导模式下上电时执行内部\
  \ 128 字节内存的代码。这段 128 字节代码通过串口从主机下载自引导镜像到板载 2KB `SRAM` 中并将控制权转移。启动套件必须设计为三个阶段，每个阶段加载在不同的地址：\n\
  \n* 第一阶段是处理器固件的一部分。\n* 第二阶段位于片上 `SRAM` 中，因此大小为 2KB。这就是 `bootrapper`。\n* `bootrapper`\
  \ 从外部主机将实际启动加载程序镜像下载到闪存顶部。处理器在正常模式上电时获取控制权。\n\n注意，处理器驻留的微代码（第一阶段）本身不能作为 `bootrapper`，因为\
  \ `bootrapper` 需要具备编程闪存的能力。由于可以使用许多类型的闪存芯片，因此 `bootrapper` 代码需要针对特定板。\n\n许多控制器芯片不支持自引导模式。相反，启动加载程序通过\
  \ `JTAG` 接口写入闪存。你可以使用你的 `JTAG` 调试器的命令行接口访问处理器的调试逻辑，并将启动加载程序烧接到目标设备的闪存中。我们将在第 21\
  \ 章的“JTAG 调试器”部分详细讨论此内容。\n\n有些控制器支持自引导执行模式和 `JTAG`。基于 `ARM9` 的 `Freescale i.MX21`（及其升级版本\
  \ `i.MX27`）就是这样一种控制器。\n\n启动加载程序留在闪存后，它可以更新自身以及其他固件组件（如内核和根文件系统）。启动加载程序可以直接与主机进行通信，并通过\
  \ `UART`、`USB` 或 `Ethernet` 等接口下载固件组件。\n\n表 18.1 查看了针对 `ARM`、`PowerPC` 和 `x86` 的示例\
  \ Linux 启动加载程序。\n\n\n\n\n\n仔细考虑启动加载程序包的设计和架构，为嵌入式软件开发奠定坚实的基础。关键在于选择合适的启动加载程序作为起点。其益处从缩短软件开发周期到实现功能丰富且健壮的设备。\n\
  \n### 内存布局\n\n图 18.2 显示嵌入式设备上的内存布局示例。启动加载程序位于 NOR flash 之上。启动加载程序之后是参数块（param block），这是一个内核命令行参数的静态编译二进制镜像。接下来是压缩的内核镜像。文件系统占用剩余的\
  \ flash 闪存。在初始阶段，当你使用首版内核开始开发时，文件系统通常是一个压缩的内存磁盘（`initrd` 或 `initramfs`），因为使用基于 flash\
  \ 文件系统需要配置并运行内核的 MTD 子系统。\n\n图 18.2. 嵌入式设备上的内存布局示例。\n\n![image](img/18fig02.gif)\n\
  \n在上电期间，图 18.2 中的启动加载程序会解压内核并将其加载到 DRAM 的 `0xc0200000`。然后它将 ramdisk 加载到 `0xc0280000`（除非像在第\
  \ 2 章中所学习的那样，将 `initramfs` 构建到基础内核中）。最后，它从参数块获取命令行参数并将控制权交给内核。\n\n由于你可能需要在嵌入式设备上处理非标准的控制台和内存分区，必须向内核传递正确的命令行参数。对于图\
  \ 18.2 中的设备，可能的命令行如下：\n\n```\nconsole=/dev/ttyS0,115200n8 root=/dev/ram initrd=0xC0280000\n\
  ```\n\n当你的内核 MTD 驱动程序识别了 flash 分区时，存放 ramdisk 的 flash 区域可以改为基于 JFFS2 的文件系统。这样，你就不需要将\
  \ `initrd` 加载到 DRAM 了。假设你已经将启动加载程序、参数块、内核和文件系统映射到不同的 MTD 分区，现在的命令行看起来像：\n\n```\n\
  console=/dev/ttyS0,115200n8 root=/dev/mtdblock3\n```\n\n参见侧边栏“ATAGs”从启动加载程序向内核传递参数的另一种方法。\n\
  \n### ATAGs\n\n在 ARM 内核中，命令行参数已被废弃，取而代之的是标记参数列表。这种机制称为 ATAG，描述于 `Documentation/arm/Booting`。要向内核传递参数，启动加载程序需要在系统内存中创建相应的标签，提供一个解析它的内核函数，并使用\
  \ `__tagtable()` 宏将后者添加到标签解析函数列表中。`tag` 结构及其相关结构在 `include/asm-arm/setup.h` 中定义，而\
  \ `arch/arm/kernel/setup.c` 包含了解析几个预定义 ATAG 的函数。\n\n### 内核移植\n\n与配置工具链一样，几年前将内核移植到目标设备是一项严肃事务。人们必须评估针对感兴趣架构的当前内核树的稳定性，应用尚未进入主线的可用补丁，进行修改并希望好运。但今天，你可能不仅为你的\
  \ SoC，还为与你类似的硬件板卡找到一个贴近的起点。例如，如果你正在围绕 Freescale i.MX21 处理器设计嵌入式设备，你可以选择从处理器厂商构建的基于\
  \ i.MX21 的参考板的内核移植（`arch/arm/mach-imx/`）开始。因此，如果你从适用于你类似板卡的合适发行版提供的或标准内核开始开发，很有可能你不需要纠结于复杂的内核启动问题。\n\
  \n但即使匹配度很高，你可能仍面临由修改的内存映射、更改的片选、板特定的 GPIO 分配、不同的时钟源、异类的 flash bank、新 LCD 屏的时间周期要求或不同的调试\
  \ UART 端口引起的问题。例如，时钟的变化可能会影响几十个寄存器，并影响几个 I/O 外设的操作。你可能需要深入阅读 CPU 参考手册来解决它。要确定由于不同的\
  \ GPIO 分配导致的修改引脚路由，你可能需要仔细研究你的原理图。为了用适合你 LCD 屏的 `HSYNC` 和 `VSYNC` 持续编写 LCD 控制器，你可能需要向板卡连接示波器并消化它收集的信息。\n\
  \n根据设备的需求，你可能还需要进行与启动无关的内核更改。这可能简单到通过 `procfs` 导出某些信息，也复杂到修改内核以实现快速启动。\n\n运行基础内核后，你可以将注意力转向启用硬件上不同\
  \ I/O 接口的设备驱动。\n\n### uClinux\n\nuClinux 是 Linux 内核的一个分支，用于没有内存管理单元（MMU）的低端微处理器。uClinux\
  \ 移植适用于 H8、Blackfin 和 Dragonball 等处理器。uClinux 的大部分部分已合并到主 2.6 内核。\n\nuClinux 项目托管在\
  \ [www.uclinux.org](http://www.uclinux.org)。该网站包含补丁、文档、代码库、支持的架构列表以及订阅 uclinux-dev\
  \ 邮件列表的信息。\n\n### 嵌入式驱动程序\n\nLinux 在嵌入式领域如此流行的原因之一是，由于底层的内核抽象层，其强大的应用程序套件可以在任何硬件平台上运行。因此，如图\
  \ 18.3 所示，获取一个功能丰富的嵌入式系统，你只需要实现位于抽象层和硬件之间的低级设备驱动。对于你设备上的每个外设接口，你需要执行以下操作之一：\n\n\
  *   对现有驱动程序进行鉴定。测试并验证其是否按预期工作。\n*   找到一个非常匹配的驱动程序并针对你的硬件进行修改。\n*   从零开始编写驱动程序。\n\
  \n图 18.3. 与硬件无关的应用程序和与硬件相关的驱动程序。\n\n假设内核工程师参与了组件选择，你可能大多数外设设备都有现有的驱动程序或足够匹配的程序。为了利用现有驱动程序，请查看硬件的框图和原理图，识别不同的芯片组，并凑出一个可以运行的内核配置文件，以启用正确的驱动程序。根据你的占用空间或启动时间要求，将可能的设备驱动程序模块化，或将其构建到基础内核中。\n\
  \n为了了解嵌入式硬件上常见的 I/O 接口的设备驱动程序，让我们顺时针环绕查看图 18.1 所示的嵌入式控制器，从 NOR flash 开始。\n\n###\
  \ Flash Memory（闪存）\n\n如图 18.2 所示的嵌入式设备从 flash 内存启动，文件系统数据存在基于 flash 的存储中。许多设备使用较小的\
  \ NOR flash 组件用于前者，使用 NAND flash 部分用于后者。^([[2]](#footnote.html_ch18fn02)) NOR 内存存储了启动加载程序和基础内核，而\
  \ NAND 存储包含文件系统分区和设备驱动模块。\n\n\n\n\nFlash 驱动由第 17 章中讨论的内核 MTD 子系统“内存技术设备”支持。如果你使用支持\
  \ MTD 的芯片，只需要编写一个 MTD 映射驱动程序即可合理地划分 flash 以存储启动程序、内核和文件系统。第 17 章中的代码段 17.1、17.2\
  \ 和 17.3 实现了一个 Linux 手持设备的映射驱动程序，如该章的图 17.2 所示。\n\n### UART\nUART 负责串口通信，这是你可能在所有微控制器上找到的接口。UART\
  \ 被视为基础硬件，因此内核包含了在其运行的所有微控制器的 UART 驱动。在嵌入式设备上，UART 用于将处理器与调试串口、调制解调器、触摸控制器、GPRS\
  \ 芯片组、蓝牙芯片组、GPS 设备、遥测电子设备等连接。\n\n请参阅第 6 章“串口驱动程序”关于 Linux 串口子系统的详细讨论。\n\n### 按钮和滚轮\n\
  你的设备可能具有若干杂项外设，例如键盘（按常用 QWERTY 布局组织的微型键盘、具有手机那样的多功能键输入设备、具有 ABC 类型布局的键盘等）、LED、滚轮和按钮。这些\
  \ I/O 设备通过 GPIO 线或 CPLD 与 CPU 接口（参见下文的“CPLD/FPGA”部分）。此类外设备的驱动通常是简单的字符设备驱动或杂项驱动。某些驱动通过\
  \ `procfs` 或 `sysfs` 导出设备访问，而不是通过 /dev 节点。\n\n### PCMCIA/CF\nPCMCIA 或 CF 插是嵌入式设备的常见插件。例如，使用\
  \ CF 卡为嵌入式设备启用 WiFi 的优势在于，如果 WiFi 控制器停止生命周期，你就不需要重新设计电路板。此外，由于 PCMCIA/CF 形式提供了多种技术，你可以自由地在以后将连接模式从\
  \ WiFi 更改为蓝牙等技术。这种方案的缺点是，即使有机械固定，插槽本质上也是不可靠的。卡可能会由于冲击和震动而松动，导致连接性中断。\n\nPCMCIA 和\
  \ CF 设备驱动在第 9 章“PCMCIA 和紧凑型”中讨论。\n\n### SD/MMC\n许多嵌入式处理器包含了与 SD/MMC 介质通信的控制器。SD/MMC\
  \ 存储使用 NAND flash 内存构建。与 CF 卡一样，SD/MMC 卡为你的设备增加了几个 GB 的内存。它们还提供了简单的内存升级路径，因为 SD/MMC\
  \ 卡的可用密度不断增加。第 14 章“块驱动”引导你查看内核中的 SD/MMC 子系统。\n\n### USB\n传统计算机支持 USB 主机模式，通过该模式你可以与大多数类\
  \ USB 设备通信。嵌入式系统通常也需要对 USB 设备模式的支持，即系统本身作为 USB 设备并插入其他主机计算机中。\n\n正如你在第 11 章“通用串行总”中所看到的，许多嵌入式控制器支持\
  \ USB OTG，允许你的设备既作为 USB 主机也可以作为 USB 设备工作。例如，它允许将 U 盘连接到你的嵌入式设备。它还允许你的嵌入式设备通过导出本地存储部分的外部访问而作为一个\
  \ U 盘。Linux USB 子系统为 USB OTG 提供了驱动。对于不支持 OTG 的硬件，USB Gadget 项目（现在是主内核的一部分）引入了 USB\
  \ 设备能力。\n\n### RTC\n许多嵌入式 SoC 包含 RTC 支持以跟踪实时时间，但某些依赖外部 RTC 芯片。与 RTC 是南桥芯片组一部分 x86\
  \ 不同，嵌入式控制器通常通过 I²C 或 SPI 等慢串口与外部 RTC 接口。你可以通过编写使用 I²C 或 SPI 核心服务的客户端驱动程序来驱动此类 RTC，如第\
  \ 8 章“集成电路协议”中讨论。第 2 章和第 5 章“字符驱动”讨论了基于 x86 系统的 RTC 支持。\n\n### 音频\n正如你在第 13 章“音频驱动程序”中所看到的，音频编码器将数字音频数据转换为模拟声音信号通过扬声器播放，并通过麦克风进行反向操作。编码器与\
  \ CPU 连接取决于嵌入式控制器支持的数字音频接口。与编码器通信的常用方法是通过 AC’97 或 I²S 等总线。\n\n### 触摸屏\n触摸是嵌入式设备的主要输入机制。许多\
  \ PDA 提供用于数据的软键盘。在第 6 章中，我们为串口控制器开发了驱动，在第 7 章“输入驱动程序”中，我们查看了一个与 SPI 总线接口的触摸控制器。如果你的驱动程序符合输入\
  \ API，那么将其与图形用户界面结合应该是简单的。但你可能需要添加自定义支持来对触摸屏进行校准和线性化。\n\n### 视频\n某些嵌入式系统是无头的，但许多系统有相关的显示器。一个方向合适的（横屏或竖屏）LCD\
  \ 面板连接到嵌入式 SoC 部分的视频控制器上。许多 LCD 面板带有集成触摸屏。\n\n正如你在第 12 章“视频驱动程序”中学到的，帧缓冲区将应用程序与显示硬件隔离，因此只要你的显示驱动符合帧缓冲区，将兼容的\
  \ GUI 移植到你的设备就很简单。\n\n### CPLD/FPGA\n复杂可编程逻辑设备 (CPLD) 或其强力对应物现场可门阵列 (FPGA) 可以增加层与操作系统无关的逻辑。你可以使用极高速集成电路硬件描述语言\
  \ (VHDL) 编写 CPLD（和 FPGA）。处理器与外设之间的电信号通过 CPLD 传播，因此通过适当为 CPLD 编程，操作系统获得了执行复杂 I/O\
  \ 的优雅寄存器接口。CPLD 中的 VHDL 代码在执行必要的控制逻辑后锁这些寄存器内容。\n\n例如，考虑一个需要通过移位每个像素位来驱动的外部串口 LCD\
  \ 控制器。该设备的 Linux 驱动程序在向串口 LCD 控制器发送每个像素或命令字节时，切换时钟和 IO 引脚非常困难。然而，如果此 LCD 控制器通过 CPLD\
  \ 路由到处理器，VHDL 代码可以通过时钟每个位执行必要的串行移位，并向操作系统提供并行寄存器接口。本质上，CPLD 将困难的串行 LCD 控制器转换为方便的并行控制器。\n\
  \n如果 CPLD 工程师和 Linux 驱动开发者合作，他们可以在 VHDL 代码和 Linux 驱动程序之间达成最佳划分，从而节省时间和成本。\n\n###\
  \ 连接\n连接性注入了智能，因此很少有嵌入式设备没有通信能力。嵌入式设备常用的网络技术包括 WiFi、蓝牙、蜂窝调制解调器、以太网和无线电通信。\n\n\n\n\
  \n# 第 15 & 16 章\n\n`第 15 章`“网卡”探讨了有线网络设备驱动程序，而`第 16 章`“无线的 Linux”查看了无线通信技术的驱动程序。\n\
  \n## 特定领域的电子设备\n\n你的设备可能包含特定于使用行业领域的的电子设备。它可能是医疗级设备的遥测接口、汽车硬件的传感器、安全小设备的生物识别模块、手机的\
  \ GPRS，或用于导航系统的 `GPS`。这些外围设备通常通过标准的 I/O 接口（如 `UART`、`USB`、`I²C`、`SPI` 或控制器区域网络 `CAN`）与嵌入式控制器通信。对于通过\
  \ `UART` 接口的设备，你通常不需要设备驱动程序层面做多少工作，因为 `UART` 驱动程序会处理通信。对于通过 `USB` 接口的指纹传感器等设备，你可能需要编写\
  \ `USB` 客户端驱动程序。你还可能遇到专有接口，例如网络处理器的交换矩阵，在这种情况下，你可能需要编写一个完整的设备驱动程序。\n\n考虑数字媒体领域。电缆或直接入户（`DTH`）接口系统通常围绕机顶盒（`STB`）芯片组构建。这些芯片具有个人视频录制（将多个通道录制到硬盘、在查看一个通道的同时录制另一个等）和条件访问（允许服务提供商根据订阅控制用户看到的内容）的能力。为了实现这一点，`STB`\
  \ 芯片配备了一个内核和一个强大的图形引擎。后者在硬件中实现了 `MPEG` 码器。此类音频视频解码器可以解码如 `MPEG2` 和 `MPEG4` 等压缩数字媒体标准（`MPEG`\
  \ 是运动图像专家组的缩写，是负责开发运动图像标准的机构）。如果你在 `STB` 上嵌入 Linux，你将需要驱动此类音频视频解码器。\n\n### 更多驱动程序\n\
  \n如果你的设备服务于医疗保健等生命关键行业领域，系统内存可能具有 `ECC` 能力。`第 20 章`“更多设备和驱动程序”讨论了 `ECC` 报告。\n\n\
  如果你的嵌入式设备由电池供电，你可能希望使用合适的 `CPU` 频率调节器来动态调整处理器频率并节能。`第 20 章`还讨论了 `CPU` 频率驱动程序和电源管理。\n\
  \n大多数嵌入式处理器都有内置硬件看门狗，可以从死机中恢复。你在`第 5 章`中看过看门狗驱动程序。使用 `drivers/char/watchdog/` 中的合适驱动程序作为起点，为你的系统看门狗实现驱动。\n\
  \n如果你的嵌入式设备包含检测欠电的电路，你可能需要向内核添加功能以感知该状态并采取适当措施。\n\n若干嵌入式 SoC 包含内置的脉宽调制（`PWM`）单元。`PWM`\
  \ 允许你数字数字控制蜂鸣器等模拟设备。目标设备的电压水平通过编程 `PWM` 的占空比（`PWM` 输出波形相对于其周期的开启时间）来改变。`LCD` 亮度是另一个使用\
  \ `PWM` 控制的功能示例。根据目标设备和使用场景，你可以为 `PWM` 实现 `char` 或 `misc` 驱动接口。\n\n### 根文件系统\n\n\
  在 Linux 发行版出现之前，组合一套适用于可用存储空间限制的紧凑应用程序集曾是一个单独的项目。人们必须拼凑一组最小实用程序、库、工具和守护进程源码；确保它们的版本相互兼容；并进行交叉编译。如今的发行版提供了为支持的处理器构建的现成应用程序集，并提供了允许你以包为粒度选择组件的工具。当然，你可能仍然想要实现自定义实用程序和工具来补充发行版提供的应用程序。\n\
  \n在嵌入式设备上，闪存（在`第 17 章`中讨论）是存放应用程序集的常用载体，并在启动过程结束时挂载为根设备。硬盘并不常见，因为它们功耗高、体积大，且具有不耐震击和震动的活动部件。嵌入式设备上存放根文件系统的常见位置包括：\n\
  \n* 初始内存磁盘（`initramfs` 或 `initrd`）通常是在让其他潜在根设备驱动工作之前的起点，用于开发目的。\n* 使用 `NFS` 挂载根文件系统是一种比使用内存磁盘得强大的开发策略。我们将在下一节中详细讨论。\n\
  * 存储媒体，如闪存芯片、`SD/MMC` 卡、`CF` 卡、`DOC` 和 `DOM`。\n\n注意，让所有数据留在根分区可能不是一个好主意。将文件分散在不同的存储分区上并标记所需的读写或只读保护标志是常见的，特别是当设备可能意外关闭时。\n\
  \n## NFS 挂载的根\n\n`NFS`挂载根文件系统可以作为加速嵌入式开发周期的催化剂。在这种情况下，根文件系统物理上存在于你的开发主机而不是目标机，因此它的大小几乎是无限的，不受目标本地可用存储量的限制。将设备驱动模块或应用程序下载到目标机，以及上传日志，只需将它们复制到开发主机上的\
  \ `/path/to/target/rootfilesystem/` 即可（且快速）。这种测试和调试的便利是你应该坚持在工程级硬件上配备以太网的好理由，即使生产单元不支持。在板上配备以太网还允许引导加载程序使用简单文件传输（`TFTP`）将内核镜像下载到目标机。\n\
  \n表 18.2 使用 TFTP 和 NFS 保存开发时间\n\n| 步骤 | 描述 |\n| :--- | :--- |\n| 1 | 为 `TFTP` 配置引导加载程序\
  \ |\n| 2 | 使用 `TFTP` 下载内核镜像 |\n| 3 | 使用 `NFS` 挂载根文件系统 |\n\n### 紧凑中间件\n\n内存紧缺的嵌入式设备倾向于使用占用空间小、运行内存要求低的中间件实现。权衡通常在于功能、标准兼容性和速度。让我们来看一些流行的紧凑中间件解决方案，它们可能是填充你的根文件系统的候选者。\n\
  \n`BusyBox` 是一种常用于内存内存的嵌入式系统提供多实用程序环境的工具。它牺牲了一些功能，但为多个 shell 实用程序提供了优化替代品。\n\n`uClibc`\
  \ 是 GNU C 的紧凑版本，最初为 `uClinux` 开发。`uClibc` 也可以工作于普通的 Linux 系统，并根据 `LGPL` 许可。如果你的嵌入式设备空间不足，尝试使用\
  \ `uClibc` 而不是 `glibc`。\n\n需要运行 `X Windows` 服务器的嵌入式系统通常依赖于 `TinyX`，这是随 `XFree86\
  \ 4.0` 代码分发的低 footprint `X` 服务器。`TinyX` 运行在帧缓冲区驱动程序之上，并可以用于`第 12 章`图 12.6 所示的设备。\n\
  \n`Thttpd` 是一个轻量级 HTTP 服务器，对 `CPU` 和内存资源的要求很低。\n\n\n\n\n即使你正在使用一个没有 MMU 的小型 8 位微控制器创建一个非\
  \ Linux 解决方案，你可能仍然希望它能与 Linux 互操作。例如，假设你正在为一个红外存储钥匙扣编写深度嵌入固件。该钥匙扣可以存储 1GB 的个人数据，并通过\
  \ Linux 笔记本电脑通过红外接口访问这些数据。如果你在红外钥匙扣上运行紧凑的 TCP/IP 栈（例如在 `Pico-IrDA` 这种极简 IrDA 栈上运行\
  \ `uIP`），你的任务就是确保它们与相应的 Linux 协议栈具有互操作性。\n\n表 18.3 列出了本节提到的紧凑中间件项目的主页。\n\n表 18.3.\
  \ 紧凑中间件示例\n\n![image](img/547tab01.jpg)\n\n### 测试基础设施\n\n大多数使用嵌入式设备的领域都受监管机构的约束。拥有一个可扩展且健壮的测试基础设施可能与实现内核和设备驱动修改同样重要。广泛来说，测试框架负责以下工作：\n\
  \n1. 证明合规性以获得监管批准。例如，如果你的系统是面向美国市场的医疗级设备，那么你应该将测试套件定位于获取美国食品药品监督管理局（FDA）的批准。\n2.\
  \ 大多数面向美国市场的电子设备必须符合联邦通信委员会（FCC）规定的发射标准，例如电磁干扰（EMI）和电磁兼容性（EMC）。为了证明合规性，你可能需要在模拟不同运行环境的腔室（chamber）内运行一系列测试。你还可能需要验证当静电枪对准电路板的不同部分时，系统是否能正常运行。\n\
  3. 构建验证测试。每当你构建一个软件交付物时，都使用这些测试进行质量保证（QA）。\n4. 制造测试。每当组装一次设备时，你都必须使用一组测试来验证其功能。当制造进入量产时，这些测试将具有重要意义。\n\
  \n为了所有这些内容建立一个公共测试基础，在 Linux 上实现你的测试平台（test harness）是一个好主意，而不是将其独立。独立的代码不容易扩展或增加。在基于\
  \ Linux 的测试系统中，添加一个简单的 ping 下一跳路由器的测试只需要五行脚本，但如果你使用的是独立的测试监器，则可能需要编写网络驱动程序和协议栈。\n\
  \n测试工程师不需要成为内核专家，但需要从开发团队那里吸收实现信息并进行批判性思考。\n\n### 调试\n\n在结束本章之前，让我们来看几个与嵌入式软件调试相关的课题。\n\
  \n#### 电路板修补\n\n在嵌入式硬件上启动引导程序（bootloader）或内核时，查看电路原理图和数据表是你需要的一种重要调试技能。理解你的板的布局图（placement\
  \ plot，一个显示电路板上芯片位置的文件），当你使用示波器调试潜在的硬件问题或当你需要进行微小的电路板修补时会有很大帮助。参考位号（例如图 18.4 中的\
  \ `U10` 和 `U11`）将原理图中的每个芯片与布局图关联。印刷电路板（PCB）通常覆有丝印层，在每个芯片附近打印参考位号。\n\n图 18.4. 调试嵌入式系统上的\
  \ I²C RTC。\n\n![image](img/18fig04.gif)\n\n考虑这样一个虚构的场景：在你的测试板上没有发生 USB 枚举。USB 集线器驱动检测到了设备插入，但无法分配端点地址。仔细观察原理图发现，源自\
  \ USB 收发器 `SPEED` 和 `MODE` 引脚的连接被错误地交换了。检查布局图可以识别收发器在 PCB 上的位置。将布局图上的收发器参考位号与 PCB\
  \ 上的丝印匹配，就能确定你必须在哪里焊接“黄线”来修复故障连接。\n\n万用表和示波器是你嵌入式调试工具箱中非常值得增加的配置。作为说明，让我们考虑一个涉及第\
  \ 8 章中图 8.3 所示 I²C RTC 的示例情况。图 18.4 使用万用表/示波器连接到感兴趣的探测点重现了它。考虑这种场景：你按照第 8 章中“设备示例：实时时钟”节所述为该\
  \ RTC 芯片编写了一个 I²C 客户端驱动程序。然而，当你在板上运行驱动程序时，它导致系统无法启动。当你重置板子时，引导程序没有启动，你的 JTAG 调试器也没有连接到目标。为了理解这个看似致命错误的可能原因，让我们仔细查看连接图。因为\
  \ RTC 和 CPU 都需要外部时钟，电路板使用单个 32KHz 晶振提供它。然而，这个 32KHz 时钟需要缓冲。RTC 缓冲时钟供其使用并免费在输出引脚上。该引脚\
  \ `CLK_OUT` 将时钟馈给处理器。在 `CLK_OUT` 和地之间连接示波器（或可以测量频率的万用表）验证处理器频率。如图 18.4 所示，示波器读数为\
  \ 1KHz 而不是预期的 32KHz！\n\n#### 调试器\n\n在嵌入 Linux 时，你可以可以使用第 21 章中学会的大部分调试技术。多个处理器平台都有内核调试器。在第\
  \ 21 章中也探讨过的 JTAG 调试器比内核调试器更强大，在嵌入式领域广泛用于调试引导程序、基础内核和设备驱动模块。\n\n## 第 19 章 用户空间中的驱动\n\
  \n本章内容\n\n*   进程调度与响应时间\n*   访问 I/O 区域\n*   访问内存区域\n*   用户态 SCSI\n*   用户态 USB\n\
  *   用户态 I²C\n*   UIO\n*   查看源码\n\n* * *\n\n大多数设备驱动程序倾向于在内核内部过特权生活，但也有一些适合外部不确定的世界。几个内核子系统（如\
  \ SCSI、USB 和 I²C）为用户态驱动程序提供了某种程度的支持，因此你可能可以在不编写单行内核代码的情况下控制这些设备。\n\n\n\n\n\n尽管用户态（user\
  \ land）的天气恶劣，用户态驱动程序仍然具有某些优势。它们易于开发和调试。你不需要在每次解引用悬挂指针时都重启系统。如果设备子系统利用了标准用户空间编程库的服务，某些用户态驱动程序甚至可以在不同的操作系统之间运行。以下是一些经验法则，可以帮助你判断驱动程序是否应该留在用户空间：\n\
  \n*   应用可行性测试。在用户空间中可以完成的事情应该留在用户空间中。\n*   如果你必须与大量慢速设备通信，且性能要求适中，可以探索在用户空间中实现驱动程序的可能性。如果你有对时间敏感的性能需求，请留在内核中。\n\
  *   如果你的代码需要内核 API 服务、访问内核变量的权限，或者与中断处理交织，那么它有充分的理由留在内核空间。\n*   如果你的代码的大部分功能可以被解释为策略（policy），那么用户态可能是其逻辑所在地。\n\
  *   如果内核的其他部分需要调用你代码的服务，那么它就是留在内核的候选者。\n*   你无法在内核中轻松地进行浮点运算。然而，可以从用户态使用浮点单元（FPU）指令。\n\
  \n话虽如此，你无法从用户态完成太多事情。许多重要的设备类别（例如存储媒体和网络适配器）无法从用户态驱动。但即使内核驱动程序是合适的解决方案，在将其移动到内核空间之前，尽可能在用户空间中建模和测试代码也是一个好主意。测试周期更快，而且更容易遍历所有可能的路径并确保它们是干净的。\n\
  \n在本章中，“用户空间驱动程序”（或用户态驱动程序）一词是通用含义使用的，并不严格符合书中到为止所暗示的“驱动程序”语义。如果一个应用程序也是在内核内部实现的候选者，那么它也被认为是一个用户态驱动程序。\n\
  \n2.6 内核重构了一个对用户态驱动程序具有特殊意义的子系统。新的进程调度器为用户态代码提供了巨大的响应时间优势，让我们让我们从这里开始吧。\n\n* *\n\
  \n## 进程调度与响应时间\n\n许多用户态驱动程序需要以时间限制的方式执行某些工作。然而，在用户空间中，由于调度和分页引起的不确定性往往阻碍快速响应时间。为了看到如何减少前一个障碍的影响，让我们深入最近的\
  \ Linux 调度器并理解它们的底层哲学。\n\n### 原始调度器\n\n在 2.4 及更早的时代，调度器在选择任务之前会重新计算每个任务的调度参数。因此，算法消耗的时间随系统中竞争任务数量增加而线性增加。换句话说，它使用了\
  \ `O(n)` 时间，其中 `n` 是活动任务的数量。在高速负载运行的系统上，这意味着巨大的开销。2.4 算法在 SMP 系统上的表现也不尽理想。\n\n###\
  \ O(1) 调度器\n\n`O(n)` 算法消耗的时间与输入大小呈线性关系，`O(n²)` 解决方案与输入长度呈二次方关系，但 `O(1)` 技术与输入无关，因此具有良好的可扩展性。2.6\
  \ 调度器用 `O(1)` 方法替换了 `O(n)` 算法。除了具有极强的扩展性外，该调度器还内置了启发式算法，通过对参与 I/O 活动的任务提供优先处理，来提高用户响应能力。进程分为两类：I/O\
  \ 密集型和 CPU 密集型。I/O 密集型任务通常在休眠等待设备 I/O，而 CPU 密集型任务则是沉迷于处理器的工作狂。矛盾的是，为了实现快速的响应时间，懒惰的任务会获得\
  \ `O(1)` 调度器的奖励，而勤奋的任务反而会受到责备。查看侧边栏“O(1) 调度器的亮点”来了解其一些重要特性。\n\n* *\n\n##### O(1)\
  \ 调度器的亮点\n\n以下是 `O(1)` 调度器的一些重要特性：\n\n*   该算法使用由 140 个优先级列表组成的两个运行队列：一个持有仍剩余时间片任务的活动队列（active\
  \ queue），以及一个包含时间片已过期进程的过期队列（expired queue）。当一个任务完成其时间片时，它会按优先级排序插入过期队列。当活动队列为空时，两个队列会进行交换。为了决定下一个运行哪个进程，调度器不会遍历整个队列。相反，它从活动队列中挑选优先级最高的任务。因此，挑选任务的开销并不取决于活动任务的数量，而是优先级的数量。这使其成为常数时间算法或\
  \ `O(1)` 算法。\n*   调度器支持两个优先级范围：UNIX 系统支持的标准 nice 值和内部优先级。前者范围从 –20 到 +19，而后者从 0\
  \ 到 139。在两种情况下，低值对应高优先级。前 100 个（0 到 99）内部优先级预留给实时（RT）任务，底部的 40 个（100 到 139）分配给普通任务。40\
  \ 个 nice 值映射到底部的 40 个内部优先级。普通任务的内部优先级可以由调度器动态更改，而 nice 值是由用户通过统计方式设置的。每个内部优先级都有一个关联的运行列表（run\
  \ list）。\n*   调度器使用启发式算法来判断进程的性质是 I/O 密集型还是 CPU 密集型。简单来说，如果一个任务经常休眠，它很可能是 I/O 密集型的；如果它快速用完时间片，它就是\
  \ CPU 密集型的。每当调度器发现任务表现出 I/O 密集型特征时，通过动态增加其优先级来奖励它。另一方面，CPU 密集型特征会受到惩罚。\n*   分配的时间片与优先级成正比。高优先级任务获得更大的时间片。\n\
  *   只要任务拥有时间片配额，就不会被调度器抢占。如果它在用完配额之前让出处理器，在下次运行时可以使用剩余的切片。由于 I/O 密集型进程是经常让 CPU 的进程，这提升了交互性能。\n\
  *   调度器支持实时策略。实时任务会抢占普通（SCHED_OTHER）任务。实时策略的用户可以覆盖调度器的优先级分配。与 SCHED_OTHER 任务不同，它们的优先级不会由内核动态计算。实时调度有两种形式：`SCHED_FIFO`\
  \ 和 `SCHED_RR`。它们用于产生“软”实时行为，而不是严格的“硬”实时保证。`SCHED_FIFO` 没有时间片概念；`SCHED_FIFO` 任务运行直到休眠等待\
  \ I/O 或让处理器。`SCHED_RR` 是 SCHED_FIFO 的轮询变体，也为 RT 任务分配时间片。时间片过期的 SCHED_RR 任务会被添加到相应优先级列表末尾。\n\
  *   调度器通过使用每个 CPU 运行队列和每个 CPU 同步来提高 SMP 性能。\n\n* *\n\n### CFS 调度器\n\nLinux 调度器在\
  \ 2.6.23 内核中经历了再次重写。用于 SCHED_OTHER 类的完全完全公平调度器（CFS）通过放弃优先级数组、时间片、交互性启发式算法以及对 HZ\
  \ 的依赖，消除了与 O(1) 调度器相关的许多复杂性。CFS 的目标是通过为每个任务提供总 CPU 能力除以运行任务数，来实现所有调度实体的公平性。分析 CFS\
  \ 超出了本章的范围。请查看 Documentation/sched-design-CFS.txt 以获取简短教程。\n\n### 响应时间\n\n\n\n\n\
  \n作为用户态驱动程序开发者，你有多种选项来提高应用程序的响应时间：\n\n*   使用 `RT` 调度策略，它能为你提供比通常更精细粒度的控制。查看 `sched_setscheduler()`\
  \ 及其相关 man 手页，以获取实现软实时（soft RT）响应时间的见解。\n*   如果你在使用非实时调度调度，可以通过调整不同进程的 `nice` 值来达到所需的性能平衡。\n\
  *   如果你在使用启用了 `CFS` 调度器的 2.6.23 或更高版本的内核，你可以精细调整 `/proc/sys/kernel/sched_granularity_ns`。如果你使用的是\
  \ 2.6.23 之前的内核，请修改 `kernel/sched.c` 和 `include/linux/sched.h` 中的 `#defines` 以适应你的应用程序。请谨慎地更改这些值，以满足你的应用程序套件的需求。调度器的使用场景非常复杂，在某些负载下表现良好的设置可能会在其他负载下性能下降，因此你可能需要通过试错法进行实验。\n\
  *   响应时间不仅仅是调度器的领域；它们取决于体系架构。例如，如果你将一个繁忙的中断处理程序标记为快速（fast），它会频繁禁用本地中断，这可能会减慢其他 `IRQs`\
  \ 上的数据采集和传输。\n\n让我们实现一个示例，看看用户态驱动程序如何通过防止调度和分页引入的不确定性来实现快速的响应时间。正如你在第 2 章中学习到的，“探秘内核”所示，`RTC`\
  \ 是一个可以产生高精度周期性中断的定时器源。列表 19.1 实现了一个示例，使用来自 `/dev/rtc` 的中断报告来执行微秒级精度的周期性工作。奔腾时间戳计数器\
  \ (`TSC`) 被用于测量响应时间。\n\n列表 19.1 中的程序首先使用 `sched_setscheduler()` 将调度策略更改为 `SCHED_FIFO`。接下来，它调用\
  \ `mlockall()` 锁定内存所有映射页，以确保交换不会干扰确定性计时。只有超级用户允许调用 `sched_setscheduler()` 和 `mlockall()`\
  \ 并请求频率大于 64Hz 的 `RTC` 中断。\n\n列表 19.1. 微秒级精度的周期性工作\n\n![image](img/p0556-01.jpg)\n\
  \n![image](img/p0556-02.jpg)\n\n列表 19.1 中的代码循环 10,000 次，并打印执行期间发生的最坏情况延迟。在 1.8GHz\
  \ 的奔腾机器上，输出为 `240899`，这大致对应于 133 微秒。根据 `RTC` 芯片组的数据表，`8192Hz` 的定时器频率应导致 122 微秒的周期性中断率。这很接近。在不同负载下使用\
  \ `SCHED_OTHER` 代替 `SCHED_FIFO` 重新运行代码，并观察产生的漂移。\n\n你可以在 `RT` 模式下运行内核线程。为此，请在启动线程时执行以下操作：\n\
  \n![image](img/p0558-01.jpg)\n\n### 访问 I/O 区域\n\nPC 兼容系统具有 64K I/O 端口，所有端口都可以从用户空间驱动。Linux\
  \ 上用户访问 I/O 端口受两个函数的控制：`ioperm()` 和 `iopl()`。`ioperm()` 控制对前 `0x3ff` 个端口的访问权限。`iopl()`\
  \ 更改调用进程的 I/O 权限级别，从而允许对所有端口进行无限制访问等。只有超级用户可以调用这两个函数。\n\n要向 I/O 端口写入数据，使用 `outb()`、`outw()`、`outl()`\
  \ 或它们的同类函数。从端口读取数据，使用 `inb()`、`inw()`、`inl()` 或它们的函数。让我们实现一个简单的程序，读取 `RTC` 芯片内部跳动的秒数。PC\
  \ CMOS 中的 I/O 区域（`RTC` 是其一部分）通过索引端口 (`0x70`）和数据端口 (`0x71`）访问，如第 5 章中“字符设备驱动”的表 5.1\
  \ 所示。要从 I/O 地址范围内的偏移量 `off` 读取一个字节的数据，将 `off` 写入索引端口并从数据端口读取相关数据。列表 19.2 读取 `RTC`\
  \ 的秒字段；但要用它从其他 I/O 区域获取数据，请适当更改传递给 `dump_port()` 的参数。\n\n列表 19.2. 从 I/O 区域导出字节的实用\n\
  \n![image](img/p0559-01.jpg)\n\n![image](img/p0559-02.jpg)\n\n你也可以通过操作 `/dev/port`\
  \ 完成相同任务。这将产生性能代价，因为流必须通过内核驱动程序，但你可以灵活在不使用 `iopl()` 或 `ioperm()` 的情况下控制设备节点的访问权限。以下是列表\
  \ 19.2 的 `/dev/port` 等效实现：\n\n![image](img/p0560-01.jpg)\n\n在第 5 章中，你学习了如何通过内核驱动与计算机的并行口通信。现在让我们实现一个从用户态与并行口设备交互的示例程序。内核并行端口子系统提供名为\
  \ `ppdev` 的字符设备驱动，将并行端口访问导出到用户态。`ppdev` 创建设备节点 `/dev/parportX`，其中 X 是并行端口号。应用程序可以打开\
  \ `/dev/parportX`，通过 `read()`/`write()` 系统调用交换数据并发出各种 `ioctl()` 命令。使用如 `ppdev` 等内核接口比直接使用\
  \ `ioperm()`、`iopl()` 或 `/dev/port` 直接操作 I/O 端口更为优越。前者技术更安全，跨架构工作，并且可以在不同的设备形式（如\
  \ USB 转并行口转换器）上运行。\n\n考虑你在第 5 章中使用的简单 LED 板板。列表 19.3 显示使用 `ppdev` 接口控制 25 针并行连接器上的\
  \ 8 个 LED 的简单用户应用程序。它是第 5 章中开发的内核驱动的用户态等效实现。\n\n列表 19.3. 从用户态控制并行口 LED\n\n![image](img/p0561-01.jpg)\n\
  \n![image](img/p0561-02.jpg)\n\n### 访问内存区域\n\n文件的内存映射（或 mmap）将其与用户内存关联。由于 Linux\
  \ 将设备视为文件，你也可以将设备映射到 RAM 并直接对其进行操作。以下是 `mmap()` 的用户：\n\n1. 图形用户界面如 X Windows ([www.xfree86.org](http://www.xfree86.org))\
  \ 和 SVGAlib ([www.svgalib.org](http://www.svgalib.org))映射视频内存并直接访问图形。\n2. Madplay\
  \ 是一个在多种架构上运行的整数 MP3 播放器。内存映射提高了吞吐量，因此 madplay 映射 MP3 文件以获得更快访问。这有助于维持高质量音乐播放所需的比特率。\n\
  3. MPEG（运动图像专家）解码器通过直接操作映射的帧缓冲区内存来播放电影。\n\n`mmap()` 系统调用原型所示：\n\n```\nvoid *mmap(void\
  \ *start, size_t length, int prot, int flags, int fd, off_t offset);\n```\n\n这请求内核将文件描述符\
  \ `fd` 指定设备文件关联到从 `start` 开始的用户内存块。（`start` 仅是一个偏好，通常置为 0；实际关联的内存由 `mmap()` 返回）。内核从指定文件的\
  \ `offset` 开始映射 `length` 字节。`prot` 指定所需的访问保护，`flag` 描述映射类型。\n\n并不是所有映射页都需要在物理内存中。未被访问的区域可以在交换空间中，并在需要时调入。底层设备驱动可以通过实现\
  \ `mmap()` 方法来控制 `mmap()` 系统调用的语义。\n\n\n\n\nListing 19.4 是一个图像显示程序，它通过以下操作来演示 `mmap()`\
  \ 的用法：\n\n*   mmap 一个图像文件。\n*   mmap 一个帧缓冲区。（我们在第 12 章 中讨论过帧缓冲区驱动，“视频驱动”。）\n*  \
  \ 在根据图像文件的属性进行必要的转换后（列表页未显示），将前者传输到后者。\n\nListing 19.4. 使用 Mmap 显示图像\n\n![image](img/p0563-01.jpg)\n\
  ![image](img/p0563-02.jpg)\n![image](img/p0564-01.jpg)\n![image](img/p0564-02.jpg)\n\
  \n### 用户态 SCSI\n\nSCSI Generic (sg) 接口允许你直接从用户空间分发 SCSI 命令。`sg` 驱动本质上导出一个字符接口，因此应用程序可以使用\
  \ `open()`、`close()`、`read()`、`write()`、`ioctl()`、`poll()`、`fcntl()` 和 `mmap()`\
  \ 系统调用与底层设备通信。CD 刻录机和扫描仪等 SCSI 设备的驱动程序是在用户态通过 `sg` 实现的。查看来自 [`freshmeat.net/projects/cdrecord/`](http://freshmeat.net/projects/cdrecord/)\
  \ 的 `cdrtools`（以前称为 `cdrecord`）源码，可以了解真实的 `sg` 用户用法。\n\n让我们通过示例来学习如何使用 `sg` 接口。Listing\
  \ 19.5 实现了一个用户程序，该程序向 SCSI 硬盘或 USB 质存储驱动器等存储设备发送 `READ_CAPACITY` SCSI 命令，以获取其数据容量。`READ_CAPACITY`\
  \ 命令由 10 字节组成，以命令代码 `0x25` 开始。为了本例的目的，我们将其余字节设置为零。当 SCSI 设备接收到 `READ_CAPACITY` 命令时，它会返回一个\
  \ 8 字节的回复；高 4 字节包含最后一个逻辑块的地址，低 4 字节包含块长度。\n\n`sg` 设备节点命名为 `/dev/sgX`，其中 X 是设备号，因此\
  \ Listing 19.5 打开了 `/dev/sg0`，假设该是对应于你的 SCSI 存储设备的 `sg` 字符节点。然后它填充 `sg_io_hdr_t`\
  \ 结构，这是 `sg` 用户必须管理的数据结构。`read()`、`write()` 和 `ioctl()` 调用期望指向此结构的指针（定义在 `/usr/include/scsi/sg.h`\
  \ 中）作为参数。`sg_io_hdr_t` 的 `cmdp` 字段设置为持有 10 字节 `READ_CAPACITY` 命令的命令块地址。`dxferp`\
  \ 字段提供缓冲区地址，该缓冲区将携带来自设备的响应数据。`sbp` 字段包含感应缓冲区的地址，该缓冲区将返回请求操作的状态。`interface_id` 必须设置为\
  \ `S`，而 `timeout` 存储 `sg` 放弃命令之前的等待时间（毫秒）。\n\n`SG_IO` 是 `sg` 支持的一个经常使用的 `ioctl`\
  \ 命令。在内部，它向设备写入命令，等待响应，并将接收到的回复读取到用户提供的缓冲区。在 Listing 19.5 中，`SG_IO` 发出 `READ_CAPACITY`\
  \ 命令并将 8 字节响应读入 `rcap_buff[]`。程序通过解释 `rcap_buff[]` 中的数据来计算并打印磁盘容量。\n\nListing 19.5.\
  \ 通过 SCSI Generic 获取磁盘容量\n\n![image](img/p0566-01.jpg)\n![image](img/p0566-02.jpg)\n\
  ![image](img/p0567-01.jpg)\n![image](img/p0567-02.jpg)\n\n有关 `SG_IO` 命令的完整列表，请查看\
  \ `include/scsi/scsi.h` 和 `drivers/scsi/sg.c`。阅读 Linux SCSI Generic HOWTO 以深入了解\
  \ `sg` 接口。从 [`sg.torque.net/sg/sg3_utils.html`](http://sg.torque.net/sg/sg3_utils.html)\
  \ 下载 `sg3_utils` 包并浏览源码，寻找几个通过 `sg` 操作的有用程序。\n\n### 用户态 USB\n\n`usbfs` 虚拟文件系统允许从用户空间对\
  \ USB 设备进行原始访问。`usbfs` 通常挂载在 `/proc/bus/usb/` 上。`usbfs` 树包含与系统中每个 USB 控制器（或总线）对应的目录。这些目录中的每一个包含与该总线上的\
  \ USB 设备对应的节点。\n\n为了更好地理解 `usbfs`，让我们看看带有 Intel ICH4 南桥芯片组的系统。正如你在第 11 章中学习到的，“通用串总线”，USB\
  \ 控制器是 PC 系统南桥芯片组的一部分。ICH4 支持一个 USB EHCI（高速 USB 2.0）控制器。\n\n\n\n\n\nListing 19.7\
  \ 是一个简单的用户态驱动程序，用于从用户空间对 I²C EEPROM 执行常用操作。该 EEPROM 与第 8 章中讨论的相同，有两个内存库，每个库对应一个从机地址。该列表使用了\
  \ `i2c-dev.h` 中的内联函数来操作与库相关的设备节点。可以从 [www.lm-sensors.org](http://www.lm-sensors.org)\
  \ 下载 `lm-sensors` 包中的该头文件（在第 8 章中也讨论过）。该文件包含了第 8 章 表 8.1 中列出的所有内核空间 I²C 访问函数的的用户空间等效实现。\n\
  \nListing 19.7. 用户态 I²C/SMBus 驱动\n\n![image](img/p0572-01.jpg)\n\n![image](img/p0572-02.jpg)\n\
  \n### UIO\n\n从 2.6.23 版本开始，内核包含一个名为 `UIO`（Userspace IO）的子系统，简化了某些用户态驱动程序的实现。`UIO`\
  \ 的意图是允许为中断处理等任务开发裸内核驱动程序，并将大部分设备 I/O 逻辑推到用户空间。`UIO` 对于某些类工业 I/O 卡特别有用。\n\n查看 `drivers/uio/`\
  \ 以获取 `UIO` 源码。`Documentation/DocBook/uio-howto.tmpl` 下有用户指南。探索 `UIO` 超出了本章的讨论范围。\n\
  \n### 查看源码\n\nLinux 调度器存在于 `kernel/sched.c`。SCSI 通用实现位于 `drivers/scsi/sg.c`，而 `drivers/usb/core/devio.c`\
  \ 负责支持用户态 USB 驱动。启用用户态 I²C 编程支持的 `i2c-dev` 驱动位于 `drivers/i2c/i2c-dev.c`。\n\n表 19.1\
  \ 包含了本章使用的主要数据结构，表 19.2 列出了我们用于辅助用户态驱动程序开发的函数。\n\n表 19.1. 数据结构摘要\n\n![image](img/574tab01.jpg)\n\
  \n表 19.2. 用户态函数摘要\n\n![image](img/574tab02.jpg)\n\n# 第 20 章 更多设备与驱动\n\n## 本章内容\n\
  \n*   ECC 报告\n*   频率调节\n*   嵌入式控制器\n*   ACPI\n*   ISA 和 MCA\n*   火线 (FireWire)\n\
  *   智能输入/输出\n*   业余无线电\n*   IP 语音\n*   高速互连\n\n到目前为止，我们已经为每种主要的设备驱动类都分配了整章内容，但 `drivers/`\
  \ 下还有几个我们尚未深入的子目录。在本章中，让我们快速地进入其中的一些目录。\n\n## ECC 报告\n\n多个内存控制器包含特殊的硅片，用于使用纠错码（ECC）测量存储数据的保真度。错误检测与修正（EDAC）驱动子系统会报告由感知\
  \ ECC 的内存控制器生成的内存错误事件。典型的 ECC DRAM 芯片具有纠正单位错误（SBEs）和检测多位错误（MBEs）的能力。在 `EDAC` 术语中，前者是可纠正错误（CEs），而后者是不可纠正错误（UEs）。\n\
  \nECC 操作对操作系统是透明的。这意味着如果你的 DRAM 控制器支持 ECC，纠正和检测将在没有操作系统参与的情况下静默发生。`EDAC` 的任务是报告此类事件并允许用户制定错误处理策略（例如更换怀疑的\
  \ DRAM 芯片）。\n\n`EDAC` 驱动子系统由以下部分组成：\n\n*   一个名为 `edac_mc` 的核心模块，提供了一系列库程序。\n*  \
  \ 与支持的内存控制器交互的独立驱动程序。例如，与 Intel 82860 北桥部分的内存控制器配合的驱动模块被称为 `i82860_edac`。\n\n`EDAC`\
  \ 通过 `sysfs` 目录 `/sys/devices/system/edac/` 中的文件报告错误。它还会生成可以从内核错误日志中获取的消息。\n\nDRAM\
  \ 芯片的布局是根据内存控制器发出的片选（chip-selects）数量以及内存控制器与 CPU 之间的数据传输宽度（通道）来指定的。DRAM 芯片数组中的行数取决于前者，而列数取决于后者。`EDAC`\
  \ 的主要目标之一是指出有问题的 DRAM 芯片，因此 `EDAC` 的 `sysfs` 节点结构根据物理芯片布局设计：`/sys/devices/system/edac/mc/mcX/csrowY/`\
  \ 对应于内存控制器 X 中的片选行 `Y`。每个此类目录包含详细信息，如检测到的 CEs (`ce_count`)、UEs (`ue_count`)、通道位置以及其他属性。\n\
  \n### 设备示例：感知 ECC 的内存控制器\n\n让我们为尚未支持的内存控制器添加 `EDAC` 支持。假设你正在一个基于嵌入式 x86 衍生医疗级设备上运行\
  \ Linux。你板上的北桥芯片组（包含内存控制器，如第 12 章侧边栏讨论的“北桥”、“视频驱动””）是能够报告 ECC 的 Intel 855GME。该系统中连接到\
  \ 855GME 的所有 DRAM 库都是支持 ECC 的芯片，因为这是一个生命关键型设备。`EDAC` 尚未支持 855GME，所以让我们尝试实现它。\n\n\
  ECC DRAM 控制器有两个主要的 ECC 相关寄存器：错误状态寄存器和错误地址指针寄存器，如表 20.1 所示。发生 ECC 错误时，前者包含状态（错误是\
  \ SBE 还是 MBE），后者包含错误发生的物理地址。`EDAC` 核心定期检查这些寄存器，并通过 `sysfs` 向用户空间报告结果。从配置的角度来看，855GME\
  \ 内部的所有设备似乎都在 PCI 总线 0 上。DRAM 控制器位于该总线的设备 0 上。DRAM 接口控制寄存器（包括 ECC 特定的寄存器）映射到相应的\
  \ PCI 配置空间。为 855GME 添加 `EDAC` 支持，需要添加读取这些寄存器的钩子，如 Listing 20.1 所示。关于 PCI 设备驱动方法和数据结构的解释，请参考第\
  \ 10 章，“外围部件互连”。\n\n表 20.1. DRAM 控制器上的 ECC 相关寄存器\n\n![image](img/579tab01.jpg)\n\
  \nListing 20.1. 用于 855GME 的 EDAC 驱动\n\n![image](img/p0580-01.jpg)\n\n![image](img/p0580-02.jpg)\n\
  \n![image](img/p0581-01.jpg)\n\n![image](img/p0581-02.jpg)\n\n![image](img/p0582-01.jpg)\n\
  \n查看 `drivers/edac/*` 获取 `EDAC` 源码文件，查看 `Documentation/drivers/edac/edac.txt` 获取\
  \ `EDAC` `sysfs` 节点的详细语义。\n\n### 频率调节\n\nCPU 频率 (`cpufreq`) 驱动子系统通过动态调整 CPU 频率来帮助电源管理。如果你使用合适的缩放算法（称为\
  \ `governor`），你的设备电池寿命可能会更长一些。`cpufreq` 支持多种架构，如 x86、ARM 和 PowerPC。为了获得 `cpufreq`\
  \ 能力，你还需要启用适当的驱动程序（例如，如果你使用的是支持 SpeedStep 的 CPU，则使用 Intel Enhanced SpeedStep 驱动）。\n\
  \n你可以通过 `/sys/devices/system/cpu/cpuX/cpufreq/` 目录下的文件控制 `cpufreq` 的行为，其中 X 是 CPU\
  \ 编号。设置最大最小频率缩放限制，请将所需值写入 `scaling_max_freq` 和 `scaling_min_freq`。要查看支持的 cpufreq\
  \ 调节器列表，请查看 `scaling_available_governors` 内容。内核支持多种调节器：\n\n*   `performance` 调节器静态地将\
  \ CPU 频率设置为 `scaling_max_freq`。\n\n\n\n\n\n*   `Powersave` 将 CPU 频率设置为 `scaling_min_freq`。\n\
  *   `Ondemand` 根据 CPU 负载调整频率。\n*   `Conservative` 是 `ondemand` 的变体，其速度变化以渐进的步骤平滑发生。\n\
  *   `Userspace` 允许应用程序决定缩放技术。某些发行版将调度器设置为 `userspace`，并通过一个名为 `cpuspeed` 的守护进程来实现缩放算法，该进程在启动时被创建。\n\
  *   你也可以使用 `cpufreq_register_governor()` 接口实现自己的内核调度器。\n\n每个支持的调度器都实现为一个内核模块。要查看\
  \ `cpufreq` 的运行情况，分配一个调度器并改变系统负载：\n\n![image](img/583tab01.jpg)\n\n如果你现在通过查看 `/sys/devices/system/cpu/cpu0/cpufreq/cpuinfo_cur_freq`\
  \ 来监控运行频率，你将看到它随着 CPU 负载的变化而跳动。\n\nCPU 缩放代码位于 `drivers/cpufreq/` 目录。查看 `Documentation/cpu-freq/*`\
  \ 以获取 `cpufreq` sysfs 节点的详细语义。\n\n### 嵌入式控制器\n\n笔记本电脑及其衍生设备通常包含一个内置嵌入式控制器 (EC)，用于处理各种辅助职责，包括：\n\
  \n*   与键盘控制器接接\n*   管理热事件\n*   处理特殊按钮和 LED\n*   控制系统和 CPU 风扇转速\n*   监控电池电压\n\n这些功能大部分特定于\
  \ OEM 的硬件实现。不同的 OEM 使用不同的 EC；例如，IBM/Lenovo 笔记本电脑嵌入了一个瑞萨萨 H8 微控制器来辅助主处理器。然而，无论控制器的品牌如何，访问\
  \ EC 的接口都是标准的。BIOS 和操作系统在 I/O 端口 `0x80` 上操作以从 EC 读取信息并在 I/O 端口 `0x81` 向 EC 写入数据。在台式机上，这些端口提供对键盘控制器的访问而非通用\
  \ EC。\n\n下一节将引用示例驱动，该驱动通过访问 EC 内存空间来检测信号强度。\n\n### ACPI\n\n高级配置与电源接口 (ACPI) 是一种电源管理规范，取代了早期的标准，如高级电源管理\
  \ (APM)。ACPI 负责系统在电源状态之间的转换。它还承担与连接到 EC 的设备和传感器接口的任务。此类设备被称为 ACPI 设备，专门用于处理它们的内存被称为\
  \ ACPI 空间。\n\n正如你在书的其他地方看到的，低级代码不是实现策略的地方。这是 APM 的主要问题，大多数电源管理策略都是 BIOS 固件的一部分。ACPI\
  \ 将策略向上移动了一层，到了操作系统。通过使用一个名为 `acpid` 的守护进程，ACPI 甚至允许将策略进一步推高一层，到用户空间配置文件。通过向 `acpid`\
  \ 配置文件添加规则，你可以决定在按下热键或发生热限值触发时该做什么。\n\n即使使用 ACPI，低级 BIOS 固件仍保留着与硬件接口以及检测 ACPI 事件（如按下电源按钮或热传感器报告）的责任。为了执行此操作，BIOS\
  \ 利用通过系统管理中断 (SMIs) 触发的特殊 x86 执行模式。SMI 执行模式对操作系统是透明的。为了通知操作系统 SMI 模式下检测到的 ACPI 事件，BIOS\
  \ 断言系统控制中断 (SCI)。查看 `drivers/acpi/osl.c` 以获取请求 SCI IRQ 的 Linux ACPI 代码。\n\nLinux\
  \ ACPI 组件包括以下内容：\n\n1.  核心层，提供 ACPI 基础，如 ACPI 机器语言 (AML) 解释器。ACPI 特定的 BIOS 代码使用\
  \ AML 编写，这是一种运行在操作系统 AML 解释器实现的虚拟机上的语言。\n2.  用于与标准组件接口的 ACPI 驱动，例如 EC (`drivers/acpi/ec.c`)、按钮\
  \ (`drivers/acpi/button.c`) 和风扇 (`drivers/acpi/fan.c`)。OEM 特定驱动提供了标准 ACPI 驱动不支持的功能支持。例如，`drivers/misc/thinkpad_acpi.c`\
  \ 是为 IBM/Lenovo Thinkpad 实现额外功能的 OEM 特定驱动。在 IBM/Lenovo Thinkpad 上，`/proc/acpi/`\
  \ 下的文件由标准 ACPI 驱动生成，而 `/proc/acpi/ibm/` 下的文件由 OEM 特定驱动产生。因此，要获取当前温度，请执行以下操作：\n\n\
  \    ![image](img/p0586-01.jpg)\n\n    但要开启 LCD 显示器上方的夜灯模式，请寻求 OEM 特定驱动的帮助：\n\n\
  \    ```bash\n    echo on > /proc/acpi/ibm/light\n    ```\n\n3.  内核线程 `kacpid`，ACPI\
  \ 使用它来排队执行任务。\n4.  各个设备驱动程序，它们使用 ACPI 服务响应系统电源状态的变化。为了实现这一点，驱动程序向内核设备模型注册了 `suspend()`\
  \ 和 `resume()` 方法。我们在讨论 `platform_driver` 结构、`spi_driver` 结构、`pcmcia_driver` 结构和\
  \ `pci_driver` 结构时提过这些方法。\n5.  用户空间工具，如 `acpitool`，用于报告各种 ACPI 设备的状态，并将系统挂起到不同的状态：\n\
  \n    ![image](img/p0586-02.jpg)\n6.  `acpid` 守护进程，它是 ACPI 事件的策略启用器。它在 `/proc/acpi/events`\
  \ 上监听内核报告的电源管理事件。当你按下电源按钮或发生热限值触发时，内核 ACPI 通过 `/proc/acpi/events` 将事件分发到用户空间。假设当在笔记本电脑盖上按下时，你想执行一个特定程序\
  \ (`/bin/lidhandler`)。为此，向 `/etc/acpi/events/acpi_handler.sh` 添加以下内容：\n\n    ![image](img/p0586-03.jpg)\n\
  \n    你可以结合 `cpufreq` 与 ACPI 使用。例如，你可以在 `/bin/lidhandler` 内部添加此行，以便在关闭笔记本盖时降低处理器频率：\n\
  \n    ![image](img/p0587-01.jpg)\n\n你可以从 `www.acpi.info` 下载 ACPI 规范。\n\n作为一个练习，考虑你有一个嵌入式笔记本衍生设备，内置了信号卡，且\
  \ EC 连接到一个测量信号强度的传感器。要通过 `/proc/acpi/`（或 `/sys/bus/acpi/`）访问信号强度，请更新 `drivers/misc/`\
  \ 中对应笔记本型号的“额外”驱动。如果主板是 IBM/Lenovo Thinkpad 的衍生设备，请相应修改 `drivers/misc/thinkpad_acpi.c`。你可以使用\
  \ `ec_read()` 和 `ec_write()` 内核函数来访问 EC ACPI 空间中存储信号强度的位置。\n\n### ISA 和 MCA\n\n\
  工业标准架构 (ISA) 起初作为 I/O 设备与 PC 接口的总线，后来演变为一种事实标准。几年前，ISA 驱动程序本值得单独成章；但今天，随着 PCI 总线的出现，ISA\
  \ 已经几乎消失了。\n\nISA 设备驱动程序需要应对两个主要的特定总线的因素：\n\n\n\n\n\n## ISA\n\n* `ISA` 不提供驱动程序可以使用的标准接口，用以检测由电气布线或由启动固件分配的资源信息。实现复杂的探测逻辑（通常利用设备特定的特殊性/quirks）是\
  \ `ISA` 驱动初始化的一个重要部分。这与 `PCI` 总线不同，在 `PCI` 总线中，设备驱动程序可以清晰地解析由启动固件分配的中断请求线和 I/O 基地址等资源的身份。你曾在我们讨论第\
  \ 10 章中的 `PCI` 配置空间时学习过如何做到这一点。我们还在第 15 章的“ISA 网络驱动程序”章节中简要地查看了 `ISA` 探测，以及“网络接口卡”。\n\
  \nISA 插插即用（PnP）规范试图为 `ISA` 引入某种程度的自动配置能力。\n\n* `ISA` 总线的宽度为 24 位，因此设备只能访问系统内存的低\
  \ 16MB。例如，为了从 `ISA` 以太网卡 DMA 网络数据，DMA 缓冲区必须位于名为 `ZONE_DMA` 的低 16MB 范围内。然而，扩展工业标准架构（EISA）将\
  \ `ISA` 总线扩展到 32 位。你可以将 `ISA` 设备插到 EISA 插槽中。\n\n今天，PC 兼容系统上使用 `LPC` 总线而非 `ISA` 总线将遗留外设连接到\
  \ CPU。我们在前面的章节中讨论过 `LPC` 设备，如 Super I/O 芯片组、固件集纽和热传感器。\n\n微通道架构（MCA）总线克服了 `ISA`\
  \ 系列许多局限性。`MCA` 支持总线主、自动配置和 32 位总线宽度。尽管技术上优于 `ISA`，但由于其专利性质，`MCA` 并不流行。\n\n查看 `drivers/net/tokenring/skisa.c`\
  \ 可以 Token Ring 卡的示例 `ISA` 驱动程序。IBM Token Ring 驱动程序 `drivers/net/tokenring/ibmtr.c`\
  \ 支持 IBM Token Ring 硬件的 `ISA``PnP` 和 `MCA` 形式。3COM 以太网驱动 `drivers/net/3c509.c` 驱动\
  \ 3COM 以太网卡的 `MCA`、`PnP` 和 `EISA` 形式。内核为 `PnP`、`EISA` 和 `MCA` 驱动提供了核心例程。这些实现分别位于\
  \ `drivers/pnp/`、`drivers/eisa/` 和 `drivers/mca/` 中。\n\n### FireWire\n\n`FireWire`\
  \ 或 `IEEE 1394` 是 Apple 发明的一种高速串行总线协议，用于将外设备连接到系统。它提供的数据速率高达 800Mbps（`IEEE 1394b`）。第\
  \ 10 章中的图 10.1 显示了 x86 笔记本电脑上 `FireWire` 控制器的连接。\n\n`FireWire` 与 `USB 2.0` 类似，两者都是支持高速和设备热插拔的外部\
  \ I/O 总线。然而，`FireWire` 是点对点协议，不像主从结构的 `USB 2.0`，因此两个支持 `FireWire` 的设备可以在没有 PC 干预的情况下交换信息。由于这一特性，`FireWire`\
  \ 在数码机等多媒体设备上很流行。正如你在第 11 章中所学习的，On-The-Go 扩展也为 `USB 2.0` 引入了点对点能力。\n\nLinux 上的\
  \ `FireWire` 架构如下：\n\n* 如 `ohci1394` 等设备驱动程序，连接 `FireWire` 控制器。\n\n* 用于存储、视频的协议驱动程序。`FireWire`\
  \ 总线协议 2 (`SBP2`) 是一种低级驱动程序，允许你像使用 `SCSI` 磁盘一样使用 `FireWire` 介质。`SBP2` 需要与 `SCSI`\
  \ 驱动配合使用，如 `sd_mod`（用于磁盘）或 `sr_mod`（用于光驱）。如 `cdrecord` 等应用程序在 `FireWire` 上运行。`dv1394`\
  \ 和 `video1394` 协议驱动允许你通过 `FireWire` 捕捉视频，`eth1394` 驱动允许你在 `FireWire` 上运行 TCP/IP。\n\
  \n* 为上述内容提供服务的 `FireWire` 核心。\n\n* 如 `libraw1394` 等用户空间库协助开发 `FireWire` 应用程序。\n\n\
  查看 `drivers/ieee1394/*` `FireWire` 内核源码，并访问 [www.linux1394.org](http://www.linux1394.org)\
  \ 获取详细文档。\n\n从 2.6.22 版本开始，内核在 `drivers/firewire/` 目录下有一个更精简的 `FireWire` 栈。\n\n\
  ### Intelligent 输出\n\n智能输入输出（I2O）是一种将 I/O 活动从主处理器卸载到适配器上的 I/O 协处理器的标准。`I2O` 现在已基本废弃，I2O\
  \ 特别小组（I2O SIG）也已不存在。然而，包括 Linux 在内的许多操作系统继续支持 `I2O`。\n\n`I2O` 硬件适用于 `SCSI`、`RAID`\
  \ 和网络技术。`I2O` 将软件架构分为运行主处理器上的操作系统特定模块（OSM）和运行在 `I2O` 适配器上的硬件特定模块（HDM）。`HDM` 与操作系统无关，可以跨平台使用。\n\
  \n`I2O` 硬件适用于 `SCSI`、`RAID` 和网络技术。`I2O` 将软件架构分为运行主处理器上的操作系统特定模块（OSM）和运行在 `I2O` 适配器上的硬件特定模块（HDM）。`HDM`\
  \ 与操作系统无关，可以跨平台使用。\n\n### Amateur Radio\n\n业余无线电（ham）是爱好者的一种数据包无线电技术。要在 Linux 上使用业余无线电，你需要：\n\
  \n* 用于访问你的无线电的低级调制解器驱动程序。查看 `Amateur Radio AX25 HOWTO` 了解协议，查看 `ax25/` 目录源码，并访问\
  \ [`hams.sourceforge.net`](http://hams.sourceforge.net) 获取用户空间工具和库。\n\n* 一个或多个包协议，如\
  \ `AX25`、`Rose` 和 `Netrom`。`AX25`、`Rose` 和 `Netrom` 是使用 `AX25` 作为数据链路的网络协议。你可以分别使用\
  \ `AF_AX25`、`AF_ROSE` 和 `AF_NETROM` 协议族编写运行在 `AX25`、`Rose` 和 `Netrom` 之上的 Linux\
  \ 套字应用程序。\n\n\n\n\n\n面向 IP 视频音频传输（V2IP）市场的 SoC 通常包含对 `H.264` 等视频编码器的硬件支持。如果你要在 V2IP\
  \ 电话上运行 Linux，你还需要实现驱动程序以与此类编码器建立接口。\n\n### 高速互连\n\n`InfiniBand`、`RapidIO`、`Hyper-Transport`\
  \ 和 `10 Gigabit 以太网`等高速互连技术在 PC 或低端嵌入式环境中并不常见。你更有可能在集群、刀片服务器、游戏系统、交换机或高速路由器中发现它们。`Fibre\
  \ Channel`（光纤）和 `Internet SCSI (iSCSI)` 等网络技术可以在由存储区域网络（SAN）服务的企业环境中找到。\n\n让我们深入了解其中一些技术的驱动子系统。\n\
  \n### InfiniBand\n\n`InfiniBand` 是一种高速串行总线标准，最初旨在取代 `PCI`。然而，`PCI Express` 已成为系统总线的未来主流。今天，`InfiniBand`\
  \ 技术常用于刀片服务器设计，以提供高性能的存储和网络架构。`InfiniBand` 支持远程直接内存访问（RDMA），它允许数据从一个计算机系统的内存 DMA\
  \ 到另一个计算机系统。\n\nLinux `InfiniBand` 子系统包含了对 `InfiniBand` 的核心支持、主机通道适配器（HCA）设备程序以及\
  \ `IP over InfiniBand` 的实现。查看 `drivers/infiniband/` 获取 Linux `InfiniBand` 子系统，并查看\
  \ `Documentation/infiniband/*` 获取相关文档。\n\n### RapidIO\n\n`RapidIO` 是另一种高速串行总线技术，用于通过背板连接板卡。它支持\
  \ `10Gbps` 级的速度。支持 `RapidIO` 的示例处理器是 Freescale 的基于电源的 `MPC8540`，目标是网络路由器和交换机等嵌入式设备。\n\
  \nLinux `RapidIO` 子系统提供了一组核心程序，用于驱动 `RapidIO` 总线上的设备。通过 `RapidIO` 互连进行通信有两种方式：\n\
  \n1. 使用门铃（doorbells）的短距离、带外消息。`RapidIO` 核心提供的门铃服务有 `rio_request_inb_dbell()`、`rio_release_inb_dbell()`、`rio_request_outb_dbell()`\
  \ 和 `rio_release_outb_dbell()`。\n2. 使用信箱（mailboxes）的高带宽数据传输。`RapidIO` 核心提供的信箱服务有\
  \ `rio_request_inb_mbox()`、`rio_release_inb_mbox()`、`rio_request_outb_mbox()` 和\
  \ `rio_release_outb_mbox()`。\n\n查看 `drivers/rapidio/` 获取源码。\n\n### Fibre Channel\n\
  \n`Fibre Channel`（光纤）是一种现代高速串行总线协议，用于与存储系统通信。`Fibre Channel` 接口卡具有光纤端口，用于连接 SAN\
  \ 上的存储设备。`Fibre Channel` 与 `SCSI` 兼容，因此相关的设备驱动本质上是一个带有处理光纤通道额外扩展的 `SCSI` 驱动程序。\n\
  \nLinux 支持处理 `Fibre Channel` 硬件的核心和设备驱动程序。查看 `drivers/fc4/` 获取源码。\n\n### iSCSI\n\
  \n`iSCSI` 是另一种 SAN 技术。它允许通过 `TCP/IP` 网络层传输 `SCSI` 数据包。通过 `iSCSI`，远程块设备在你的系统中看起来像本地存储。拥有存储的远程系统被称为\
  \ `iSCSI` 目标（target），使用存储的本地系统被称为 `iSCSI` 器（initiator）。\n\nLinux 通过内核驱动 `drivers/scsi/iscsi_tcp.c`\
  \ 和名为 `iscsid` 的用户空间守护进程支持 `iSCSI`。Linux-iSCSI 项目首页位于 `http://linux-iscsi.sourceforge.net`。\n\
  \n## 第 21 章 设备驱动调试\n\n### 本章内容\n\n* 内核调试器\n* 内核探针 (Kernel Probes)\n* Kexec 和 Kdump\n\
  * 性能分析 (Profiling)\n* 跟踪 (Tracing)\n* Linux 测试项目 (Linux Test Project)\n* 用户模式 Linux\n\
  * 诊断工具\n* 内核内核配置选项\n* 测试设备\n\n现在我们已经学习了如何实现各种类的设备驱动，让我们退后一步，探索一些调试技术。在代码开发之前在逻辑设计和软件工程上投入时间，并在开发后盯着代码看，可以最大限度地减少甚至消除\
  \ bug。但因为这说起来容易做起来难，而且由于我们都是人，开发者需要调试工具。在本章中，让我们来看看各种调试内核代码的方法。\n\n### 可靠性、可用性和可维护性\n\
  \n许多系统（尤其是任务关键型系统）对可靠性、可用性和可维护性（RAS）有需求。Linux `RAS` 工作已经开发了几种强大的工具。诸如 `Linux Test\
  \ Project (LTP)` 等练习可以衡量内核移植的可靠性和健壮性。CPU 热插拔和 `Linux High Availability (HA)` 项目可以视为可用性的部分。内核调试器、Kprobes、Kdump、EDAC\
  \ 和 Linux Trace Toolkit 属于可维护性的范畴。这些分类之间的界限有时很模糊；你可以使用任何方法来适应你的调试需求。例如，来自 `OProfile`\
  \ 等内核性能分析工具的输出既可以搜索潜在的代码瓶颈（可靠性），也可以用于调试现场问题（可维护性）。\n\n## 内核调试器\n\nLinux 内核没有内置的调试器支持。是否将调试器作为标准内核的一部分包含是内核邮件列表中经常讨论的话题。指令级内核调试器\
  \ (`kdb`) 和源级级内核调试器 (`kgdb`) 是 Linux 的两种主要调试器。无论使用 `kdb` 还是 `kgdb`，你都需要下载相关的补丁并将其应用于内核源码。即使你想避免为内核打调试器支持补丁的麻烦，可以通过\
  \ GNU 调试器 (`gdb`) 获取内核崩溃（panic）的信息并查看内核变量。JTAG 调试器使用硬件辅助调试，强大但昂贵。\n\n内核调试器让内核内部变得透明。你可以单步执行指令、反汇编指令、显示和修改内核变量以及查看堆栈。在本章中，让我们通过示例学习内核调试器的基础。\n\
  \n#### 进入调试器\n\n你可以通过多种方式进入调试器。一种方法是传递命令行参数让内核在启动期间进入调试器。另一种方法是通过软件或硬件断点。断点是你希望停止执行并将控制权转移给调试器的地址。软件断点会将该处的指令替换为触发异常的其他内容。你可以通过调试器命令或在代码中插入来设置软件断点。对于\
  \ x86 系统，你可以在内核源码中这样设置软件断点：\n\n```\nasm(\"int $3\");\n```\n\n或者，你可以调用 `BREAKPOINT`\
  \ 宏，它会被翻译为相应的体系相关的指令。\n\n如果你需要停止的指令位于闪存内存中（无法被调试器替换），则可以使用硬件断点代替软件断点。硬件断点需要处理器支持。相应的地址必须添加到调试寄存器中。你拥有的硬件断点数量等于支持的调试寄存器的数量。\n\
  \n你还可以请求调试器对变量设置视点（watchpoint）。每当指令修改视点地址的数据时，调试器就会停止执行。\n\n\n\n\n另一种进入调试器的常用方法是按下中断键（attention\
  \ key），但在某些情况下这种方法可能不起作用。如果你的代码在禁用中断后处于一个紧循环中，内核将没有机会处理中断键并进入调试器。例如，如果你的代码执行了如下操作，你将无法通过中断键进入调试器：\n\
  \n![image](img/p0597-01.jpg)\n\n当控制权转移到调试器时，你可以使用各种调试器命令开始分析。\n\n## 内核调试器 (kdb)\n\
  \n`Kdb` 是一种指令级调试器，用于调试内核代码和设备驱动程序。在使用它之前，你需要为内核源码打上 `kdb` 支持的补丁并重新编译内核。（有关下载 `kdb`\
  \ 补丁的信息，请参阅“下载下载”章节。）`kdb` 的主要优势是易于设置，因为你不需要额外的机器来完成调试（与 `kgdb` 不同）。主要缺点是你需要将源代码与反汇编代码进行关联（同样，与\
  \ `kgdb` 不同）。\n\n让我们在示例的帮助下尝试使用 `kdb`。这里是案发现：你修改了一个内核串口驱动程序以适配你的 x86 硬件。但该驱动程序无法工作，你想让\
  \ `kdb` 帮助抓住罪魁祸首。\n\n让我们通过在串口驱动程序的 `open()` 入口处设置断点来开始寻找指纹。记住，由于 `kdb` 不是源码级调试器，你必须打开源码并尝试将指令与你的\
  \ C 代码相匹配。让我们列出相关的源码片段：\n\n![image](img/p0598-01.jpg)\n\n按下暂停（Pause）键并进入 `kdb`。让我们看看反汇编后的\
  \ `rs_open()` 是什么样的。按照惯例，本章显示的所有调试会话都使用 → 符号带有解释。\n\n![image](img/p0599-01.jpg)\n\
  \n源代码中的 A 点是设置断点的好位置，因为你可以同时查看 `tty` 结构和 `info` 结构来观察发生了什么。\n\n对比查看源码和反汇编代码，`rs_open+0x5a`\
  \ 对应 A 点。注意，如果编译内核时没有使用优化标志，关联会更容易一些。\n\n在 `rs_open+0x5a` 设置断点（地址为 `0xc01cce5a`）并退出调试器继续执行：\n\
  \n![image](img/p0599-02.jpg)\n\n现在，你需要让内核调用 `rs_open()` 以触发断点。为了触发这一点，请执行一个适当的用户空间程序。在这种情况下，向相应的串口（`/dev/ttySX`）发送一些字符：\n\
  \n```bash\necho \"kerala monsoons\" > /dev/ttySX\n```\n\n这会导致 `rs_open()` 被调用。断点被触发，`kdb`\
  \ 接管了控制权：\n\n![image](img/p0599-03.jpg)\n\n现在让我们查看 `info` 结构的内容。如果你查看反汇编代码，在断点之前的一条指令（`rs_open+0x56`），你会发现\
  \ `EAX` 寄存器包含 `info` 结构的地址。让我们查看寄存器内容：\n\n![image](img/p0600-01.jpg)\n\n所以，`0xcf1ae680`\
  \ 是 `info` 结构的地址。使用 `md` 命令转储其内容：\n\n![image](img/p0600-02.jpg)\n\n为了让这些转储具有意义，让我们查看对应的结构定义。`info`\
  \ 在 `include/linux/serialP.h` 中定义为 `struct async_struct`，如下：\n\n![image](img/p0600-03.jpg)\n\
  \n如果你将转储内容与定义匹配，`0x5301` 是魔数（magic number），`0xABC` 是 I/O 端口。嗯，这很有趣吧！`0xABC` 看起来不像一个有效的端口。如果你做过足够的串口调试，就会知道\
  \ I/O 端口基地址和 IRQ 在 `include/asm-x86/serial.h` 中为 x86 硬件配置。将端口定义更改为正确的值，重新编译内核并继续测试！\n\
  \n## 内核 GNU 调试器 (kgdb)\n\n`Kgdb` 是一种源码级调试器。它比 `kdb` 更容易使用，因为你不需要花时间将汇编代码与源码进行关联。然而，它更难设置，因为需要额外的机器作为调试的前端。\n\
  \n你必须配合 `kgdb` 使用 `gdb` 来单步内核代码。`gdb` 运行在主机上，而打过 `kgdb` 补丁的内核（有关下载 `kgdb` 补丁的信息请参阅“下载”章节）运行在目标硬件上。主机和目标通过串口空调制调调线连接，如图\
  \ 21.1 所示。（[[1]](#footnote.html_ch21fn01))\n\n图 21.1. Kgdb 设置。\n\n![image](img/21fig01.gif)\n\
  \n你需要通过命令行参数告知内核串口的标识和波特率。根据所使用的引导程序，将以下内核参数添加到 `syslinux.cfg`、`lilo.conf` 或 `grub.conf`\
  \ 中：\n\n```bash\nkgdbwait kgdb8250=X,115200\n```\n\n`kgdbwait` 请求内核等待直到与主机侧的 `gdb`\
  \ 建立连接，`X` 是连接主机的串口，`115200` 是通信使用的波特率。\n\n现在在主机侧配置相同的波特率：\n\n```bash\nstty speed\
  \ 115200 < /dev/ttySX\n```\n\n如果你的主机电脑是没有串口的笔记本电脑，可以使用 USB 转串口转换器进行调试。在这种情况下，不要使用\
  \ `/dev/ttySX`，而要使用由 `usbserial` 驱动创建的 `/dev/ttyUSBX` 节点。第 6 章“串口驱动](#ch06.html_ch06)”中的图\
  \ 6.4 说明了这种场景。\n\n让我们通过一个有错误的内核模块示例来学习 `kgdb` 基础。模块更容易调试，因为在修改代码后不需要重新编译整个内核，但记得使用\
  \ `-g` 选项编译模块以生成符号信息。由于模块是动态加载的，调试器需要被告知模块所包含的符号信息。列表 21.1 包含一个有错误的 `trojan_function()`。假设它定义在\
  \ `drivers/char/my_module.c` 中。\n\n列表 21.1. 有错误的函数\n\n![image](img/p0602-01.jpg)\n\
  \n将 `my_module.ko` 插入目标机并查看 `/sys/module/my_module/sections/` 以解析 ELF（可执行和链接格式）段地址。（[[2]](#footnote.html_ch21fn02））ELF\
  \ 文件中的 `.text` 段包含代码，`.data` 包含初始化变量，`.rodata` 包含初始化只读变量（如字符串），`.bss` 包含启动时未初始化的变量。如果在内核配置期间启用了\
  \ `CONFIG_KALLSYMS`，可以在 `/sys/module/my_module/sections/` 下以文件 `.text`、`.data`、`.rodata`\
  \ 和 `.bss` 的形式获取这些段地址。例如，获取代码段地址可以这样做：\n\n![image](img/p0602-02.jpg)\n\n可以通过 `/proc/modules`\
  \ 和 `/proc/kallsyms` 获取更多模块信息。\n\n获取段地址后，在主机侧机器上调用 `gdb`：\n\n![image](img/p0603-01.jpg)\n\
  \n由于你将 `kgdbwait` 作为内核命令行参数传递，当内核在目标机上启动时，`gdb` 会获得控制权。现在使用 `add-symbol-file` 命令告知\
  \ `gdb` 之前的段地址：\n\n![image](img/p0603-02.jpg)\n\n为了调试内核 panic，我们在 `trojan_function()`\
  \ 处设置断点：\n\n![image](img/p0603-03.jpg)\n\n当 `kgdb` 命中断点时，让我们查看堆栈跟踪，单步执行到 A 点并显示\
  \ `my_variable` 的值：\n\n![image](img/p0603-04.jpg)\n\n这里有一个明显的错误。`my_variable` 指向空，因为\
  \ `trojan_function()` 忘记为它分配内存。让我们直接用 `kgdb` 分配内存，绕过内核崩溃并继续测试：\n\n![image](img/p0604-01.jpg)\n\
  \n\n\n\nKgdb 端口支持多种架构，如 x86、ARM 和 PowerPC。当你使用 `kgdb` 调试目标嵌入式设备时（而不是 图 21.1 所示的\
  \ PC），你在主机系统上运行的 gdb 前端需要编译为与你的目标平台配合工作。例如，为了从你的 x86 主机开发系统调试为基于 ARM 的嵌入式设备开发的驱动程序，你必须使用适当生成的\
  \ `gdb`，它通常被命名为 `arm-linux-gdb`。具体名称取决于你使用的发行版。\n\n### GNU 调试器 (gdb)\n\n如前所述，你可以使用原始的\
  \ `gdb` 来收集一些内核调试信息。然而，你无法在内核代码中单步、设置断点或修改内核变量。让我们使用 `gdb` 来调试由 列表 21.1 中错误函数引起的内核恐（kernel\
  \ panic），但假设这次 `trojan_function()` 是作为内核的一部分编译的而不是模块，因为你无法轻易使用 `gdb` 窥视模块内部。\n\n\
  这是执行 `trojan_function()` 时生成的“oops”消息的一部分：\n\n![image](img/p0604-02.jpg)\n\n将这段晦涩的“oops”消息复制到\
  \ `oops.txt` 并使用 `ksymoops` 工具获取更详细的输出。如果系统挂起，你可能需要手动拷贝消息：\n\n![image](img/p0605-01.jpg)\n\
  \n如果你在内核配置期间启用了 `CONFIG_KALLSYMS`，2.6 内核生成的“oops”输出可以直接使用，无需使用 `ksymoops` 进行解码。\n\
  \n查看之前的转储信息，“oops”发生在 `trojan_function()` 内部。让我们使用 `gdb` 获取更多信息。在接下来的调用中，`vmlinux`\
  \ 是未压缩的内核镜像，`/proc/kcore` 是内核地址空间：\n\n![image](img/p0605-02.jpg)\n\n由于 `gdb` 的缓存访问，反复访问同一个变量不会产生更新的值。你可以通过使用\
  \ `gdb` 的 `core-file` 命令重新读取核心文件来强制刷新访问。现在让我们来看 `trojan_function()` 的反汇编：\n\n![image](img/p0605-03.jpg)\n\
  \n由于编译器的优化，`trojan_function()` 在汇编代码中看起来非常简洁。它实际上是将地址 `0xab` 的内容复制到 `EAX` 寄存器（在基于\
  \ x86 的系统中，它持有函数的返回值）。但 `0xab` 看起来并不像一个有效的内核地址！通过为 `my_variable` 分配有效的内存空间并重新编译来修复错误。\n\
  \n### JTAG 调试器\n\nJTAG 调试器使用硬件辅助来调试代码。你需要专门的监控硬件[[3]](#footnote.html_ch21fn03))\
  \ 和一个前端用户界面（某些 JTAG 调试器使用 `gdb` 作为前端）来单步执行。JTAG 还可以用于调试以外的用途，例如将代码烧录到板载闪存中，如 第 18\
  \ 章“嵌入式 Linux](#ch18.html_ch18)”所示。JTAG 连接器在开发板上很常见，但通常不是生产单元的一部分。\n\nJTAG 调试器通常通过串口、USB\
  \ 或以太网连接到目标硬件。通过以太网，你可以远程访问 JTAG 调试器，从而访问目标板，即使板本身没有网络接口。\n\n图 21.2 显示了一个基于 JTAG\
  \ 的远程调试会话。在此场景中使用的 JTAG 调试器支持 gdb 前端。开发主机和 JTAG 硬件连接到以太网局域网。目标硬件上的调试串口连接到 JTAG 盒的串口上。图\
  \ 21.2 通过五个终端会话在 Linux 开发主机上实现了远程调试。终端 1 运行 `gdb`，它通过 `telnet` 网络连接到 JTAG 盒：\n\n\
  ![image](img/p0606-01.jpg)\n\n图 21.2。一个基于 JTAG 的远程调试设置示例。\n\n![image](img/21fig02.gif)\n\
  \n为了调试内核的启动部分，例如，在 `start_kernel()` 处设置一个 gdb 断点。（你可以从 `System.map` 中找到它的地址，它在构建内核时生成在源码树根目录下。）\n\
  \n终端 2 为目标附加串口控制台。运行在终端 2 的 `telnet` 客户端连接到 JTAG 盒上的预设 TCP 端口，该端口（使用终端 3 配置）被配置为通过其串口到达的数据：\n\
  \n![image](img/p0606-02.jpg)\n\n这等同于直接将目标的调试串口连接到主机（而不是连接到 JTAG 盒，如 图 21.2 所示）后运行\
  \ `minicom` 等模拟器，但这限制了主机必须物理上靠近目标。\n\n终端 3 telnet 连接到 JTAG 盒并提供调试器特定的语义。例如，你可以用它执行以下操作：\n\
  \n*   从主机通过 TFTP 拉取 JTAG 定义脚本并在 JTAG 启动期间执行它。JTAG 定义脚本通常初始化处理器、时钟寄存器、片选寄存器和内存库。完成后后，JTAG\
  \ 硬件就准备好在目标上下载代码并执行它。JTAG 制造商通常为所有支持的平台提供定义文件，因此你可能为你的板获得一个很不错的起点。\n\n*   从主机通过\
  \ TFTP 下载你的引导程序、内核或独立代码到目标的闪存或 RAM 中。JTAG 调试器通常支持 `ELF` 和二进制等文件格式。\n\n*   单步执行代码、设置断点、检查寄存器并转储内存区域。\n\
  \n*   重置目标。\n\nJTAG 调试有时可能会不稳定，因此如果你在进行远程调试，通过远程电源开关为目标供电可能是一个好主意，如 图 21.2 所示。这样，你可以从主机使用网页浏览器硬重启目标，如终端\
  \ 4 所示。你也可以通过远程电源控制 JTAG 硬件。这将让你无需干预即可运行。\n\n如果目标板拥有网络接口，它可以通过 NFS 从开发主机挂载根文件系统。（详细信息请参阅\
  \ 第 18 章 中的“NFS 挂载根”章节。）终端 5 在主机上本地操作导出的文件系统[[4]](#footnote.html_ch21fn04)。\n\n\
  如果你的团队分布在各地，可以在虚拟网络计算（VNC）环境中运行终端 1 到 5。如果 VNC 并不是你发行版的一部分，请从 [www.realvnc.com](http://www.realvnc.com)\
  \ 下载。通过这种设置，你可以从家里调试远程板上的电子！某些 JTAG 供应商提供了复杂的集成开发环境[[5]](#footnote.html_ch21fn05))，涵盖了之前介绍的所有功能，因此如果你使用这些工具，就不需要管理\
  \ VNC 终端会话了。\n\n在硬件启动期间，当你将引导程序或其他独立代码移植到目标时，先生成 ELF 镜像并在 RAM 中调试它是个好主意。然而，请消除与\
  \ JTAG 定义脚本执行的操作重复的引导程序初始化。\n\nJTAG 调试器的一个优势是你可以使用单一工具调试构成固件解决方案的不同部分。因此，你可以使用同一个调试器在源码级调试\
  \ BIOS、引导程序、基础内核、设备驱动模块以及用户空间应用程序。\n\n### 下载\n\n你可以从 [`oss.sgi.com/projects/kdb`](http://oss.sgi.com/projects/kdb)\
  \ 下载 x86 和 IA64 架构的 kdb 补丁。每个支持的内核版本需要两个补丁：一个通用的和一个架构相关的。\n\nkgdb 项目的主页是 [`kgdb.sourceforge.net`](http://kgdb.sourceforge.net)。该网站还包含关于配置和使用\
  \ kgdb 的文档。\n\n\n\n\n如果你的 Linux 发行版尚未包含 `gdb`，你可以从 [www.gnu.org/software/gdb/gdb.html](http://www.gnu.org/software/gdb/gdb.html)\
  \ 获取它。\n\n## 内核探针 (Kernel Probes)\n\n内核探针可以进入内核函数并提取调试信息或应用修复补丁。它是你调试工具箱中一个非常有用的补充，用于调查客户现场发生的无法解释的行为，特别是当你没有权限重启系统时。Linux\
  \ 支持一种通用形式的内核探针，称为 `Kprobes`，以及两种特殊的变体：`Jprobes` 和返回探针（return probes）。\n\n### Kprobes\n\
  \nKprobes 通过提供动态转储内核数据结构或在运行的内核中插入代码的能力，可以省去构建和启动调试内核的麻烦。例如，你可以在不重新编译内核的情况下，在调度程序内部动态添加几个\
  \ `printk`。你甚至可以在不重启火星探测器的情况下修复其上的漏洞。\n\n要在内核函数内部插入 `kprobe`，请遵循以下步骤：\n\n1. 在内核配置菜单中开启\
  \ `CONFIG_KPROBES`（Instrumentation Support → Kprobes）。\n2. 实现一个内核模块，在感兴趣的指令处注册 `kprobe`。你需要注册一个预处理函数（pre-handler），`Kprobes`\
  \ 会在执行被探测指令之前运行它；以及一个后处理函数（post-handler），`Kprobes` 在执行被探测指令后运行它。你还可以提供一个故障处理器（fault-handler），它会在执行预或后处理函数检测到故障时运行（因为你不想由于一个调试\
  \ Bug 导致系统崩溃！）。\n\n当注册一个 `kprobe` 时，它会保存被探测指令并将其替换为一条生成断点的指令（在 x86 系统上为 `int 0x03`）。当触发断点时，内核会生成一个死亡通知（die\
  \ notification）。我们在第 3 章中讨论过通知器链，“内核设施。”`Kprobes` 将自己插入死亡通知链中，因此能够接收到断点命中的通知。\n\n\
  收到通知后，`Kprobes` 执行注册的预处理函数。接下来，它会逐条执行被探测指令的副本。出于 SMP 一致性考虑，它执行的是副本，而不是将被探测指令与断点指令交换。最后，它运行后处理函数。预处理和后处理函数的窗口是提供给\
  \ `Kprobes` 用户注入调试代码的钩子。处理器可以动态注册和注销，因此可维护性并非仅仅是编译时的静态的，而是在运行时是可编程的。\n\n让我们通过示例来学习如何使用\
  \ `Kprobes`。考虑列表 21.2 中的代码段，这是一个内核线程，每当接收到 `SIGUSR1` 信号时，就会向空内存池添加 `npages` 数量的页面。大部分逻辑已从列表中删去，因为它们与此无关。假设你正在客户现场调试一个由该代码报告的问题。你发现每当\
  \ `npages` 超过 `10` 时就会出现问题，因此你想应用一个运行时补丁将其限制为 `10`。\n\n列表 21.2. 问题代码 (mydrv.c)\n\
  \n![image](img/p0610-01.jpg)\n\n列表 21.3. 注册 Kprobe 处理器\n\n![image](img/p0611-01.jpg)\n\
  \n![image](img/p0612-01.jpg)\n\n![image](img/p0612-02.jpg)\n\n列表 21.3 使用 `Kprobes`\
  \ 在 `kallsyms_lookup_name(\"memwalkd\") + 0xaa` 处插入补丁，将 `npages` 限制为 `10`。要确定如何得到这个探针地址，请再次查看列表\
  \ 21.2。你希望补丁插入在 B 点。要计算 B 点的内核地址，请使用 `objdump` 反汇编 `mydrv.ko` 的内容：\n\n![image](img/613tab01.jpg)\n\
  \n***\n\n如果你是为不同的处理器平台进行交叉编译，则必须使用特定架构的 `objdump`。如果你正在反汇编一个为 ARM 目标设备交叉编译的二进制文件，将需要类似\
  \ `arm-linux-objdump` 的工具。向 `objdump` 传递 `-S` 选项可以将源代码与反汇编输出混合在一起：\n\n```bash\n\
  bash> arm-linux-objdump –d –S mydrv.ko\n```\n\n***\n\n如果你尝试将列表 21.2 中的 C 代码与上述反汇编转储进行匹配，你可以将\
  \ A 点和 B 点与显示的内核地址关联。`kallsyms_lookup_name()` 定位 `memwalkd()` 的地址，`0xaa` 是 B 点所在的偏移量，因此在\
  \ `kallsyms_lookup_name(\"memwalkd\") + 0xaa` 处应用 kprobe。\n\n注册 kprobe 后，`memwalkd()`\
  \ 看起来等所示：\n\n![image](img/p0614-01.jpg)\n\n每当 `npages` 被赋值大于 `10` 的值时，kprobed 补丁就会将其拉回\
  \ `10`。\n\n在接下来的两个章节中，让我们查看一些让操作变得简单的辅助函数。\n\n### Jprobes\n\njprobe 是一种特殊的探针。它在需要探测函数返回点时简化插入探针的工作（等等，文中在某处说是入口，在另一处说是返回，让我们遵循提供的逻辑）。jprobe\
  \ 也是一种特殊的探针。它在探测点位于入口处时简化插入探针的工作。jprobe 处理器函数与被探测函数具有相同的原型。如果你使用 `Kprobes` 而不是 `Jprobes`，想象一下你的探针需要经历麻烦，例如依赖架构且不可移植。\n\
  \n为了学习如何使用 `Jprobes`，让我们回到一个示例。假设你正在调试一个网络设备（它是构建的），但让你惊的是，驱动编写人员在格式字符串中误用了 `%O`\
  \ 而不是 `%o`。因此，你看到的只有如下消息：\n\nNumber of Free buffers = %O\n\nJprobes 出现了。首先，查看位于\
  \ `kernel/printk.c` 的 `printk()`：\n\n![image](img/p0615-01.jpg)\n\n让我们在 `printk()`\
  \ 入口处添加一个简单的 jprobe，并将每个 `%O` 转换为 `%o`。列表 21.4 完成了这个工作。注意，jprobe 处理器需要与 `printk()`\
  \ 具有原型。这两个函数都标记了 `asmlinkage` 标签，要求它们从栈获取参数，而不是 CPU 寄存器。\n\n列表 21.4. 注册 Jprobe 处理器\n\
  \n![image](img/p0615-02.jpg)\n\n![image](img/p0616-01.jpg)\n\n当列表 21.4 调用 `register_jprobes()`\
  \ 注册 jprobe 时，会在 `printk()` 开始处插入 kprobe。当该探针被命中时，`Kprobes` 将保存的返回地址替换为注册的 jprobe\
  \ 处理器 `jprint()`。然后它复制部分栈并返回，从而将控制权通过 `printk()` 参数列表交给 `jprint()`。当 `jprint()`\
  \ 调用 `jprobe_return()` 时，原始调用状态得到恢复`printk()` 继续执行。\n\n当你插入这个 jprobe 用户模块时，网络驱动程序不再发布关于\
  \ `%O` 缓冲区的无用消息，而是打印正常的信息，如：\n\nNumber of Free buffers = 12.\n\n### 返回探针 (Return\
  \ Probes)\n\n返回探针（在 `Kprobes` 术语中称为 `kretprobe`）是另一种特殊的 `Kprobes` 助手。它在需要探测函数返回点时简化插入探针的工作。如果你使用原生\
  \ `Kprobes` 来调查返回点，可能需要在多个地方注册它们，因为函数可以通过多个代码路径返回。然而，如果你使用返回探针，只需要插入一个 `kretprobe`，而不是注册\
  \ 20 个 `Kprobes` 来覆盖函数的 20 条返回路径。\n\n\n\n\n\n在 `drivers/char/tty_io.c` 中定义的函数 `tty_open()`\
  \ 有七条返回路径。成功路径返回 `0`，其他路径返回如 `-ENXIO` 和 `-ENODEV` 等错误值。无论关联的代码路径如何，单个 `kretprobe`\
  \ 就足够向你报警失败情况。列表 21.5 实现了该 `kretprobe`。\n\n### 列表 21.5. 注册返回探针处理器\n\n![image](img/p0617-01.jpg)\n\
  \n![image](img/p0618-01.jpg)\n\n当列表 21.5 调用 `register_kretprobes()` 时，内部会在 `tty_open()`\
  \ 的开头插入一个 `kprobe`。当该探针被命中时，该内部 `kprobe` 处理程序会将函数返回地址替换为特殊例程的地址（在 Kprobes 术语中称为\
  \ trampoline，即蹦板）。请查看 `arch/your-arch/kernel/kprobes.c` 以获取 trampoline 的实现。\n\n\
  当 `tty_open()` 通过其七条路径之一返回时，控制权会返回 trampoline 而不是调用者函数。trampoline 调用由列表 21.5 注册的\
  \ `kretprobe` 处理程序 `kret_tty_open()`，如果 `tty_open()` 未成功返回，该程序将打印返回值。\n\n#### 局限性\n\
  \nKprobes 有其局限性。其中一些是显而易见的。例如，如果你在内联函数内部插入 `kprobe`，将无法得到预期的结果。而且，当然，你无法探测 Kprobes\
  \ 自身的代码。\n\nKprobes 在基础内核内部应用探针更为有用。如果目标代码是动态加载模块的一部分，你可能不如重写并重新编译你的模块，而不是编写并编译一个新模块来对其进行“kprobe”。然而，如果卸载该模块是不可接受的，你可能仍然想使用\
  \ Kprobes。\n\n还存在一些不那么明显的局限性。优化是在编译时完成的，而 Kprobes 是在运行时插入的。因此，通过 Kprobes 插入指令的效果等同于在原始源文件中添加代码。例如，以下有\
  \ Bug 的代码段\n\n```\nvolatile int *integerp = 0xFF;\nint integerd = *integerp;\n```\n\
  \n被编译器精简为：\n\n```\nmov 0xff, %eax\n```\n\n因此，如果你想在这两行 C 代码之间溜插代码、分配一个字的内存、让 `integerp`\
  \ 指向该内存字并规避内核崩溃，你无法轻松使用 Kprobes 实现。\n\nSystemTap ([`sourceware.org/systemtap/`](http://sourceware.org/systemtap/))\
  \ 是一种简化 Kprobes 使用的诊断工具。\n\n### 查看源码\n\nKprobes 的实现由部分组成：定义在 `kernel/kprobes.c`（以及\
  \ `include/linux/kprobes.h`）中的通用部分，以及位于 `arch/your-arch/kernel/kprobes.c`（以及 `include/asm-your-arch/kprobes.h`）的依赖架构部分组成。\n\
  \n深入查看 `Documentation/kprobes.txt` 可以获取更多关于 Kprobes、Jprobes 和 Kretprobes 的信息。\n\n\
  ### Kexec 和 Kdump\n\n现在你已经学习了如何使用 Kprobes，让我们继续查看 Linux RAS 的更多方面。Kexec 和 kdump\
  \ 是 2.6 内核中引入的可维护特性。\n\nKexec 使用了 UNIX `exec()` 系统调用的镜像覆盖哲学，在正在运行的内核之上启动新内核，而无需经过启动固件的开销。这可以节省几秒钟的重启时间，因为启动固件需要花费周期来遍历总线并识别设备。重启延迟越低，系统停机时间越短；因此，这是开发\
  \ kexec 的主要动机之一。然而，kexec 最常用的用户是 kdump。在内核崩溃后捕获转储（dump）本质上是不可靠的，因为访问转储设备的内核代码可能处于不稳定状态。Kdump\
  \ 通过通过 kexec 启动到一个健康的内核后收集转储，解决了这个问题。\n\n#### Kexec\n\n在可以 kexec 内核之前，你需要进行一些准备工作：\n\
  \n1. 编译并启动支持 kexec 的内核。为此，请在内核配置菜单中开启 `CONFIG_KEXEC`（Processor Type and Features\
  \ → Kexec System Call）。此内核被称为第一个内核或运行中的内核。\n2. 准备要被 kexec 的内核。这个第二个内核可以与第一个内核相同。\n\
  3. 从 [www.kernel.org/pub/linux/kernel/people/horms/kexec-tools/kexec-tools-testing.tar.gz](http://www.kernel.org/pub/linux/kernel/people/horms/kexec-tools/kexec-tools-testing.tar.gz)\
  \ 下载 `kexec-tools` 源码包。编译并生成名为 `kexec` 的用户空间工具。\n\n第 3 步构建 `kexec` 工具分两个阶段调用。第一阶段将第二个内核镜像加载到运行中内核的缓冲区中，而第二阶段实际上覆盖运行中的内核：\n\
  \n1. 使用 `kexec` 命令加载第二个（覆盖）内核：\n\n```bash\nkexec -l /path/to/kernelsources/arch/x86/boot/bzImage\
  \ -- append=\"root=/dev/hdaX\" --initrd=/boot/myinitrd\n```\n`bzImage` 是第二个内核，`hdaX`\
  \ 是根设备，`myinitrd` 是初始文件系统。此阶段的内核实现与架构无关。该阶段的核心是 `sys_kexec()` 系统调用。\n\n2. 启动第二个内核：\n\
  \n![image](img/p0621-02.jpg)\n\nKexec 强制启动新内核，而不优雅地停止系统。要在重启前关闭系统，请从脚本调用 kexec（通常为\
  \ `/etc/rc.d/S01halt`）。第二阶段的实现依赖于架构。此阶段的关键是 `reboot_code_buffer`，它包含了用于放置新内核的汇编代码。\n\
  \nKexec 跳过了调用启动固件服务的内核（系统上的 BIOS、基于 Power 的机器上的 Open firmware 等）。在 x86 系统上，由 BIOS\
  \ 传递给内核的 e820 内存映射等信息（参见附录 B，“Linux and the BIOS）”）也需要提供给 kexec 内核。\n\n#### Kexec\
  \ 与 Kdump\n\n当与 kdump 配合时，kexec 的调用语义有些特殊。在这种情况下，当遇到内核恐慌（panic）时，需要 kexec 自动启动新内核。如果运行中的内核崩溃，将启动新内核（称为捕捉内核）以可靠地收集转储。典型的调用语法为：\n\
  \n![image](img/p0622-01.jpg)\n\n`-p` 选项请求 kexec 在内核恐慌发生时触发重启。`vmlinux` ELF 内核镜像作为捕捉内核。由于\
  \ `vmlinux` 是通用的 ELF 启动镜像，且 kexec 理论上与操作系统无关，你需要通过 `--args-linux` 选项指定以 Linux 特有的解释以下参数。捕捉内核在内核崩溃期间异步启动，因此使用共享中断的设备驱动程序在启动期间可能会致命错误。为了照顾此类驱动程序，通过\
  \ `--append` 在传递给捕捉内核的命令行中使用 `irqpoll`。\n\n要配合 kdump 使用 kexec 需要额外的内核配置设置。捕捉内核需要访问崩溃内核的内存以生成完整的转储，因此后者不能像非\
  \ dump 情况由 kexec 直接覆盖前者。运行中的内核需要留出一个内存区域来运行捕捉内核。要标记该区域：\n\n* 使用命令行参数 `crashkernel=64M@16M`\
  \ 启动第一个内核（或其他合适的 `size@start` 值）。同时，通过在配置菜单中启用 `CONFIG_DEBUG_INFO`（Kernel Hacking\
  \ → Compile the Kernel with Debug Info）在内核镜像中包含调试符号。\n\n\n\n\n\n*   在配置采集内核时，将 `CONFIG_PHYSICAL_START`\
  \ 设置为上方分配的相同 `start` 值（在本例中为 16M）。如果你 `kexec` 进入采集内核并查看 `/proc/meminfo`，你会发现 `size`（在本例中为\
  \ 64M）是该内核可见的物理内存总量。\n\n现在你已经熟悉了 `kexec` 并从 kdump 用户的角度掌握了它，让我们深入研究 kdump 并使用它来分析一些现实世界中的内核崩溃。\n\
  \n## Kdump\n\n内核崩溃或挂起后捕获的系统内存镜像被称为崩溃转储（crash dump）。分析崩溃转储可以为内核问题的事后分析提供宝贵的线索。然而，在内核崩溃后获取转储本质上是不可靠的，因为负责将数据到转储设备的存储驱动可能处于未定义状态。\n\
  \n在 kdump 出现之前，Linux 内核崩溃转储（LKCD）是获取和分析转储的流行机制。LKCD 使用临时转储设备（如交换分区）来捕获转储。然后通过热启动回到健康状态，并将转储从临时设备拷贝到永久位置。使用名为\
  \ `lcrash` 的工具分析转储。LKCD 的缺点包括：\n\n*   即使在崩溃的内核上将转储拷贝到临时设备也可能是不可靠的。\n*   转储设备配置配置并不简单。\n\
  *   重启可能会很慢，因为只有在转储安全保存到永久位置后，才能激活交换空间。\n*   LKCD 不是主内核的一部分，因此为你的内核版本安装适当补丁是一个障碍。\n\
  \nKdump 不受这些缺陷的困扰。它通过通过 `kexec` 启动到健康内核后收集转储，消除了不确定性。此外，由于在 `kexec` 重启后内存状态被保留，因此可以从采集内核准确访问内存镜像。\n\
  \n让我们先完成初步的 kdump 设置：\n\n1.  让运行中的内核在遇到 panic（恐慌）时 `kexec` 进入采集内核。采集内核还应该额外开启 `CONFIG_HIMEM`\
  \ 和 `CONFIG_CRASH_DUMP。（这两个选项都位于内核配置菜单中的“Processor type and Features”（处理器类型和特性）中。）\n\
  2.  采集内核启动后，将 `/proc/vmcore`（通过在内核配置菜单中启用 `CONFIG_PROC_VMCORE` 获取）中的收集转储信息拷贝到硬盘上的文件：\n\
  \n```bash\ncp /proc/vmcore /dump/vmcore.dump\n```\n\n你也可以通过 `/dev/oldmem` 保存其他信息，例如崩溃内核的原始内存快照。\n\
  3.  启动回第一个内核。现在你准备好开始转储分析了。\n\n让我们使用收集到的转储文件和 crash 工具来分析一些内核崩溃示例。在 RTC 驱动程序的中断处理程序（`drivers/char/rtc.c`）中引入此\
  \ bug：\n\n![image](img/p0624-01.jpg)\n\n通过通过 `hwclock` 命令启用中断来触发处理程序的执行：\n\n![image](img/p0624-02.jpg)\n\
  \n将 `/proc/vmcore` 保存到 `/dump/vmcore.dump`，重启回到第一个（崩溃的）内核，并使用 crash 工具开始分析。在现实情况下，当然，转储可能是在客户现场捕获的，而分析是在支持中心完成：\n\
  \n![image](img/p0624-03.jpg)\n\n检查堆栈跟踪以理解崩溃原因：\n\n![image](img/624tab01.jpg)\n\n\
  堆栈跟踪将怀疑指向了 `rtc_interrupt()`。让我们反汇 `rtc_interrupt()` 附近的指令：\n\n![image](img/625tab01.jpg)\n\
  \n地址 `0xf8a8c004` 处的指令试图将 `EAX` 寄存器的内容移动到地址 `0xff`，这显然是导致崩溃的无效引用。修复它并构建新内核。\n\n\
  如果你使用 `irq` 命令，你可以确定在崩溃期间正在进行的中断的标识。在这种情况下，输出证实了 RTC 中断确实处于激活状态：\n\n![image](img/p0625-02.jpg)\n\
  \n现在让我们转换一下思路，看一个内核冻结（freeze）而不是生成“oops”的案例。考虑以下有 bug 的驱动程序 `init()` 例程：\n\n![image](img/p0626-01.jpg)\n\
  \n代码在初始化自锁之前错误地使用了自旋锁（spinlock）。实际上，CPU 会无限旋转以尝试获取锁，内核似乎挂起了。让我们使用 kdump 调试这个问题。在这种情况下，不会自动触发，因为没有\
  \ panic，所以通过按下魔法 Sysrq 键组合 Alt-Sysrq-c 强制崩溃转储。你可能需要通过向 `/proc/sys/kernel/sysrq`\
  \ 写入 1 来启用 Sysrq：\n\n```bash\necho 1 > /proc/sys/kernel/sysrq\ninsmod mydrv.ko\n\
  ```\n\n这导致内核在 `mydrv_init()` 挂起。按下 Alt-Sysrq-c 键组合触发崩溃转储：\n\n![image](img/p0626-03.jpg)\n\
  \n在 `kexec` 启动采集内核后将转储保存到磁盘，回到原始内核，并在保存的转储上运行 `crash`：\n\n![image](img/p0626-04.jpg)\n\
  \n检查崩溃期间运行的进程标识进行测试。在这种情况下，显然是 `insmod`（`mydrv.ko`）：\n\n![image](img/627tab01.jpg)\n\
  \n堆栈跟踪没有提供太多信息，除了告诉你 Sysrq 键按下导致了转储：\n\n![image](img/p027-02.jpg)\n\n让我们接下来查看崩溃内核生成的日志。`log`\
  \ 命令读取转储中的内核 `printk` 环形缓冲区：\n\n![image](img/p027-03.jpg)\n\n日志提供了两个有用的调试信息。首先，它让你知道发生了软锁（soft\
  \ lockup）。正如“字符驱动程序”章中“示例：看门狗”部分所述，内核如下检测软锁：看门狗线程每秒运行一次并触摸 CPU 时间戳变量。如果 CPU 处于密集循环，看门狗线程无法更新此时间戳。在定时器中断期间使用\
  \ `softlockup_tick()`（定义在 `kernel/softlockup.c` 中）进行检查。如果时间戳戳超过 10 秒，它就会认为发生了软锁。\n\
  \n其次，日志指向 `mydrv_init()+0xd`（或 `0xf89300)`），让我们查看周围区域的反汇编：\n\n![image](img/628tab01.jpg)\n\
  \n堆栈中的返回地址是 `0xf89300d`，因此内核挂起在之前的指令处，即对 `spin_lock()` 的调用。如果你将其与之前的代码段联系起来并仔细观察，你可以看到错误序列\
  \ `spin_lock()/spin_lock_init()`。通过交换顺序来修复该问题。\n\n你也可以使用 crash 查看感兴趣的数据结构，但请注意崩溃期间被交换的内存区域不是转储的一部分。在前面的示例中，你可以这样检查\
  \ `mydrv_wq`：\n\n![image](img/628tab02.jpg)\n\nGdb 与 crash 集成，因此你可以从 crash 将命令传递给\
  \ gdb 进行求值。例如，你可以使用 gdb 的 `p` 命令打印数据结构。\n\n### 查看源码\n\nkexec 的体系部分位于 `arch/your-arch/kernel/machine_kexec.c`\
  \ 和 `arch/your-arch/kernel/relocate_kernel.S`。通用部分位于 `kernel/kexec.c`（以及 include/linux/kexec.h）。查阅\
  \ `arch/your-arch/kernel/crash.c` 和 `arch/your-arch/kernel/crash_dump.c` 以了解 kdump\
  \ 的实现。`Documentation/kdump/kdump.txt` 包含安装信息。\n\n### 性能分析\n\n\n\n\n性能分析（Profiling）可以引导你找到消耗更多\
  \ CPU 周期的代码区域。性能分析工具有助于感知代码瓶颈的存在，并有多种形式。包含在 `2.6` 内核中的 `OProfile` 内核性能分析器使用硬件辅助来收集分析数据。而，`gprof`\
  \ 应用性能分析器则依赖编译器的辅助来收集分析信息。\n\n## 使用 OProfile 进行内核性能分析\n\nOProfile 使用许多处理器支持的硬件性能计数器定期对数据采样。这些性能计数器可以被编程用于计数事件，例如缓存缺失（cache\
  \ misses）的数量。在处理器不支持性能计数器的系统上，OProfile 通过在定时器事件期间收集数据来获取有限的信息。\n\nOProfile 由以下部分组成：\n\
  \n* 一个收集分析信息的内核层。[7] 要要在内核中启用 `OProfile`，请启用 `CONFIG_PROFILING`、`CONFIG_OPROFILE`\
  \ 和 `CONFIG_APIC` 并重新编译。\n* `oprofiled` 守护进程。\n* 一系列分析后工具，如 `opcontrol`、`opreport`\
  \ 和 `op_help`，帮助对收集的数据进行详细分析。这些工具包含在多个发行版中；但如果你的发行版没有它们，你可以下载预编译的二进制文件。\n\n为了说明内核性能分析的基础，让我们模拟文件系统层中的一个瓶颈并使用\
  \ `OProfile` 来检测它。我们感兴趣的代码区域是文件系统层读取目录的部分（`fs/readdir.c` 中的函数 `vfs_readdir()`）。\n\
  \n首先，使用 `opcontrol` 配置 `OProfile`：\n\n![image](img/p0630-01.jpg)\n\n事件指定符要求 `OProfile`\
  \ 在 `GLOBAL_POWER_EVENTS`（处理器未停止期间）期间收集样本。事件指定符旁边的数字分别表示时钟周期中的采样计数、单位掩码过滤、内核空间计数和用户空间计数。如果你想每秒采样\
  \ `x` 次，且你的处理器运行频率为 `cpu_speed` HZ，那么你的采样计数应约为 `(cpu_speed/x)`。较大的计数会生成更精细的分析结果，但会导致更多的\
  \ CPU 开销。\n\n`OProfile` 支持的事件取决于你的处理器：\n\n![image](img/p0630-02.jpg)\n\n接下来，启动 `OProfile`\
  \ 并运行一个基准测试工具对你想要分析的内核部分进行压力测试。访问 [`lbs.sourceforge.net/`](http://lbs.sourceforge.net/)\
  \ 查看 Linux 基准测试项目列表。对于示例，让我们通过递归列出系统中的所有文件来测试虚拟文件系统（VFS）层：\n\n![image](img/p0630-03.jpg)\n\
  \n使用 `opreport` 查看分析结果。`%` 列提供了函数对系统负载的衡量：\n\n![image](img/631tab01.gif)\n\n现在让我们通过在\
  \ `vfs_readdir()` 中引入 1 毫秒的延迟来模拟 VFS 代码中的瓶颈。这在 列表 21.6 中完成。\n\n列表 21.6 定义在 `fs/read_dir.c`\
  \ 中的 `vfs_readdir()`\n\n![image](img/p0631-02.jpg)\n\n带有此更改编译内核并重新收集分析。新数据看起来如下：\n\
  \n![image](img/632tab01.jpg)\n\n如你所见，瓶颈在分析数据中被清晰地反映出来。`vfs_readdir()` 现在跳到了列表顶端！\n\
  \n你可以使用 `OProfile` 获取更多信息。例如，你可以收集数据缓存行缺失的百分比。缓存是靠近处理器的快速内存。对缓存的取取是以处理器缓存行为为单位进行的（Pentium\
  \ 4 为 32 字节）。如果你需要访问的数据不在缓存中（缓存缺失），处理器必须从主内存中提取它，这会消耗更多的 CPU 周期。对该内存（以及进入缓存的周围字节）的后续访问将更快，直到相应的缓存行失效。你可以配置\
  \ `OProfile`，通过对你的内核代码进行 `BSQ_CACHE_REFERENCE` 事件（针对 Pentium 4）的分析来统计缓存缺失的数量。然后你可以调整你的代码，可能通过重新对齐数据结构中的字段，来实现更好的缓存利用率：\n\
  \n![image](img/632tab02.jpg)\n\n如果你在不同的内核版本上运行 `OProfile` 并查看相应的更改日志，你可能能够找出内核不同部分代码更改的原因。\n\
  \n你仅仅接触了使用 `OProfile` 所能实现的一角。欲了解更多信息，请访问 [`oprofile.sourceforge.net/`](http://oprofile.sourceforge.net/)。\n\
  \n## 使用 Gprof 进行应用性能分析\n\n如果你只需要隔离分析应用程序进程，而不分析可能代表其执行的内核代码，请使用 `gprof` 而不是 `OProfile`。`gprof`\
  \ 依赖于编译器生成的额外代码来分析 C、Pascal 或 Fortran 程序。让我们使用 `gprof` 分析以下代码段：\n\n![image](img/p0633-01.jpg)\n\
  \n使用 `-pg` 选项要求编译器包含额外的代码，以便在程序运行时生成调用图（call graph profile）分析文件。`-g` 选项生成符号信息：\n\
  \n```bash\ngcc -pg -g -o myprog myprog.c\n./myprog\n```\n\n这产生了 `gmon.out`，它是 `myprog`\
  \ 的调用图。运行 `gprof` 查看分析结果：\n\n![image](img/634tab01.jpg)\n\n这显示错误路径在执行期间被命中两次。\n\n\
  ## 追踪（Tracing）\n\n追踪为不同模块交互期间表现的行为问题提供了洞察。获取追踪（traces）的一种常用方法是使用 `printk`。虽然 `printk`\
  \ 可能是内核调试中最频繁的方法（2.6.23 源码树中有 62,000 多个 `printk` 语句），但它对于高量追踪来说不够精密。Linux 追踪工具包（LTT）是一个强大的工具，允许以最小的开销获取复杂的系统追踪。\n\
  \n### Linux Trace Toolkit\n\n与 `OProfile` 通过定期采样事件来收集数据不同，LTT 提供了事件发生时的精确追踪。LTT\
  \ 由四个部分组成：\n\n* 为内核其他部分提供服务的内核模块。收集的追踪被复制到内核缓冲区。\n* 使用追踪服务的代码。这些代码插入在你想捕捉追踪快照的地方。\n\
  * 将追踪信息从内核缓冲区拉取到文件系统持久位置的守护进程。\n* 如 `tracereader` 和 `tracevisualizer` 等解释原始追踪数据并转换为人类可读格式。\n\
  \nLTT 不是主内核的一部分。[8] 你可以在 [www.opersys.com/LTT](http://www.opersys.com/LTT) 下载 LTT\
  \ 内核补丁、守护进程和用户空间追踪工具。\n\n让我们通过一个简单的示例来看看 LTT 提供了什么。假设当你从设备读取数据时看到了数据损坏。你首先想确定是设备发送了坏数据，还是内核层引入了损坏。为了这一点，在设备驱动程序级导出数据包和数据结构。列表\
  \ 21.7 初始化了你计划生成的 LTT 事件。\n\n![image](img/p0635-01.jpg)\n\n接下来，在驱动从设备读取数据时添加追踪钩子以导出接收到的包和数据结构。这在\
  \ 列表 21.8 的驱动 `read()` 方法中完成。\n\n列表 21.8 获取追踪快照\n\n![image](img/p0636-01.jpg)\n\n\
  \n\n将此代码作为内核的一部分或模块进行编译并运行。记住在配置内核时，通过设置 `CONFIG_TRACE` 开启内核跟踪支持。下一步是启动跟踪守护进程：\n\
  \n```bash\ntracedaemon -ts60 /dev/tracer mylog.txt mylog.proc\n```\n\n`/dev/tracer`\
  \ 是跟踪守护进程用于访问跟踪缓冲器的接口，`-ts60` 要求守护进程运行 60 秒，`mylog.txt` 是你想要存储生成的原始跟踪（raw trace）的文件，而\
  \ `mylog.proc` 是你想保存从 `procfs` 获取的系统状态的地方。较版本的 LTT 使用了一种名为 `relayfs` 的机制而非 `/dev/tracer`\
  \ 设备，将数据从内核跟踪缓冲区高效传输到用户空间。\n\n运行你的从设备读取数据的应用程序：\n\n```bash\n./application → 触发 `mydriver_read()`\
  \ 的调用\n```\n\n`mylog.txt` 现在应该包含所请求的跟踪数据。可以使用 `tracevisualizer` 工具分析生成的原始跟踪。选择 `Custom\
  \ Events`（自定义事件）选项并搜索 `data_pkt` 和 `dvr_data` 事件。\n\n![image](img/637tab01.jpg)\n\
  \n最后一列持有跟踪数据。时间戳显示了收集跟踪的瞬间。如果数据看起来损坏，设备可能正在发送错误数据。否则，问题一定在内核更高的层级，可以通过获取数据流路径中不同点的跟踪来进一步隔离问题。\n\
  \n下一代 LTT 称为 `LTTng`，可以在 [`ltt.polymtl.ca/`](http://ltt.polymtl.ca/) 下载。该项目还包含一个名为\
  \ Linux Trace Toolkit Viewer (LTTV) 的跟踪后分析器。\n\n如果你仅需要对用户应用程序进行有限的跟踪，你可以使用 `strace`\
  \ 工具而不是 LTT。`strace` 使用内核中的 `ptrace` 支持来拦截系统调用。它会打印出应用程序执行的系统调用列表，以及相应的参数和返回值。\n\
  \n### Linux Test Project\n\nLinux Test Project (LTP) 托管在 [`ltp.sourceforge.net/`](http://ltp.sourceforge.net/)，是一个包含大约\
  \ 3,000 个测试的套件，旨在测试内核的不同部分。大多数测试无需用户干预即可运行。其他测试（如网络和存储媒体测试）需要一些手动配置。\n\n从 LTP 主页下载源码压缩包，运行\
  \ `make`，并在源码树根目录下调用封装脚本 `runltp` 来启动测试。要在 `results/` 目录下的日志文件中记录结果，请执行以下操作：\n\n\
  ```bash\nrunltp –p –l logfile\n```\n\nLTP 生成的某些错误是“预期之内的”。LTP 网站文档了针对各种内核版本的预期错误列表。网站上还对几个内核版本的\
  \ LTP 代码覆盖率（总体覆盖率、路径中的行以及命中的不同行）进行了有趣的分析，分布在内核树的不同目录中。\n\n### User Mode Linux\n\n\
  User Mode Linux (UML) 托管在 [`user-mode-linux.sourceforge.net/`](http://user-mode-linux.sourceforge.net/)，允许你在不让机器发生“oops”（崩溃）的情况下调试内核。为了实现这一点，内核实例（称为\
  \ `guest kernel`）作为用户态进程运行在正在运行的内核（称为 `host kernel`）之上。\n\nUML 有多样化的用户。它可以作为测试内核和应用程序代码的环境，作为实验不稳定内核的载体，作为托管\
  \ Web 服务器等服务的安全伪计算机，或者作为学习 Linux 内部机制的工具。相比设备驱动调试，UML 对于调试内核中硬件无关的部分更有用。\n\n###\
  \ 诊断工具\n\n`sysfsutils` 包帮助你浏览 `sysfs` 内部海量数据。这与其他 Linux 诊断工具如 `sysdiag` 和 `lsvpd`\
  \ 可以在 [`linux-diag.sourceforge.net/`](http://linux-diag.sourceforge.net/) 下载。\n\n\
  ### Kernel Hacking 配置选项\n\n内核配置菜单的 Kernel hacking（内核黑客）下有几个选项可以产生价值的调试信息。如果你启用了某个选项，在构建内核时就会编译相应的调试代码。以下是几个示例：\n\
  \n1. 在 `printks` 上显示时间信息 (`CONFIG_PRINTK_TIME`) 会为 `printk()` 输出添加时间插测量，因此你可以将 `printk`\
  \ 作为测量执行时间和识别缓慢代码区域的检查点。\n\n2. 使用已释放的内存会导致内存中毒（memory poisoning）。调试 slab 内存分配 (`CONFIG_DEBUG_SLAB`)\
  \ 帮助你检测此类问题。\n\n3. 自旋锁和读写锁调试：基本检查 (`CONFIG_DEBUG_SPINLOCK`) 会发现锁相关问题，如使用未初始化的自旋锁，并帮助捕捉非\
  \ SMP 安全的代码。\n\n4. 在学习使用 `kdump` 时已经用过 Magic SysRq  (`CONFIG_MAGIC_SYSRQ`)。如果你开启它，即使内核在调试期间崩溃，你仍然有一些途径。例如，按下\
  \ Alt-Sysrq-t 会产生当前任务的 dump，而 Alt-Sysrq-p 会打印处理器寄存器的内容。\n\n5. 检测软锁 (`CONFIG_DETECT_SOFTLOCKUP`)\
  \ 利用看门狗服务检测内核代码中持续超过 10 秒的紧密循环。我们在使用 `kdump` 分析内核挂起时考虑过这一点。注意，无法通过这种方法找到硬件锁。对于硬件锁，请使用非屏蔽中断\
  \ (NMI)看门狗的服务。\n\n6. 如果在配置内核时启用 `CONFIG_DEBUG_SLAB`、`CONFIG_HIMEM` 或 `CONFIG_DEBUG_PAGE_ALLOC`，将编译额外的错误检查代码，帮助调试与内存管理相关的问题。\n\
  \n7. 检查栈溢出 (`CONFIG_DEBUG_STACKFLOW`) 在可用栈空间低于阈值时添加代码以发出警告。栈利用插测量 (`CONFIG_DEBUG_STACK_USAGE`)\
  \ 在 magic sysrq 输出中添加栈空间测量。另一个相关的选项 `CONFIG_4STACKS` 允许将内核栈大小设置为 4KB 而不是 8KB。\n\n\
  8. 详细的 `BUG()` 报告 (`CONFIG_DEBUG_BUGVERBOSE`) 在任何内核代码调用 `BUG()` 时产生额外的调试信息，假设你已经开启了\
  \ `CONFIG_BUG`。\n\n某些调试选项也位于 Kernel hacking 子菜单之外。例如，在本章中我们启用了 `CONFIG_KALLSYMS`\
  \ 以使用 `gdb` 和 `kprobe` 调试内核模块并调试“oops”消息。该选项位于配置菜单中的 General setup → Configure Standard\
  \ Features（针对小型系统）。\n\nKernel hacking 选项会产生开销并增加内存占用，因此不要在生产环境的内核中开启它们。\n\n### 测试设备\n\
  \n不而喻之，设备驱动调试需要全套相关的测试设备。例如，如果你在纯数字实验室环境中测试调制解调器接口，电话模拟器将大有益。如果高速串口驱动程序出现校验错误，示波器将有助于你的问题分析。如果你正在编写\
  \ I/O 设备驱动程序，如果有一个相应的总线分析仪将会有帮助。如果你正在编写网络驱动程序，相应的协议链路嗅探器将减轻你的调试工作。\n\n\n\n\n许多 Linux\
  \ 设备的寿命范围为 5 到 10 年，因此遵循标准的编码风格有助于在您离开项目很久后仍能支持该产品。\n\n强大的编辑器配合有组织的写作风格，可以更容易地将代码与思维联系起来。良好的风格不存在万无一失的准则，因为这涉及到个人偏好，但如果一个项目有多个开发者工作，那么统一的编码方式将是无价的。\n\
  \n在启动项目之前，与团队成员和客户就通编码标准达成一致。内核开发者偏好的编码风格描述在源码树的 `Documentation/CodingStyle` 中。\n\
  \n### 更改标记\n\n使用如 `CONFIG_MYPROJECT` 之类的标记来标记现有内核源文件的添加和删除，有助于突出源码树中项目特定的更改。可以从代码树根目录递归地\
  \ `grep` 标记字符串，以了解为项目实现的所有内核更改的位置。以下示例标记了 `drivers/i2c/busses/i2c-i801.c` 中的代码更改。该修改在设置期间引入了对新\
  \ PCI 设备 ID 的检查，并消除了对配置字节的访问：\n\n![image](img/p0642-01.jpg)\n\n`CONFIG_MYPROJECT`\
  \ 也充当配置时的开关，用于启用或禁用项目特定的更改。\n\n在项目中为各种子任务设置子标记是一个好主意。例如，如果您正在作为项目的一部分为了快速启动而修改内核，请将这些更改封装在诸如\
  \ `CONFIG_MYPROJECT_FASTBOOT` 的子标记中。\n\n### 版本控制\n\n如果没有强健的版本控制仓库的服务，您无法执行一个严肃的项目。版本控制系统有助于管理源代码的多个版本，并规范团队成员的文件访问。并发版本系统或\
  \ `CVS` ([www.nongnu.org/cvs](http://www.nongnu.org/cvs)) 是一种存在已久的开源修订控制软件，并带在许多\
  \ Linux 发行版中。另一个名为 `subversion` ([`subversion.tigris.org`](http://subversion.tigris.org))\
  \ 的版本系统是作为 `CVS` 的预期替代品而开发的。`Git` ([`git.or.cz`](http://git.or.cz)) 是内核开发者首选的版本控制系统，用于维护包括\
  \ Linux 内核在内的多个开源项目。互联网上有关于这些系统的丰富文档。\n\n### 一致的校验和\n\n由于分发内核存在潜在的法律问题，公司通常以针对商定基准生成的源补丁形式将内核修改发送给客户。相反，客户将补丁集成到内部代码仓库并在本地构建软件。\n\
  \n将您的二进制镜像的 `MD5` 校验和与客户的进行比较，可以防止补丁错误，但这些值可能无法匹配，因为内核和模块镜像通常包含特定于构建环境的信息。为了强制生成相同的\
  \ `MD5` 和，请在两端生成内核和模块镜像时排除此类数据。以下是一些向对象镜像中注入环境数据的典型场景：\n\n*   某些驱动方法通过调用 `BUG()`\
  \ 来宣布本不应该发生的情况。`BUG()` 会输出违问题的文件名和行号等信息。文件路径取决于您的构建沙箱的位置。它会被打印在生成的镜像中，并导致 `MD5`\
  \ 差异。例如，查看 `fs/nfs/pagelist.c` 中的 `nfs_unlock_request()`：\n\n    ![image](img/p0644-01.jpg)\n\
  \n    您可以通过在内核配置期间禁用 `CONFIG_BUG` 来移除 `BUG()`。或者，您可能通过关闭 `CONFIG_DEBUG_BUGVERBOSE`\
  \ 来消除 `BUG()` 输出的行号和文件名信息。\n\n*   `wd33c93` 驱动 (`drivers/scsi/wd33c93.c`) 在初始化期间宣布编译时间。如果您转到初始化程序\
  \ `wd33c93_init()` 的末尾，就会找到这段代码：\n\n    ![image](img/p0644-02.jpg)\n\n    构建时间戳因此被嵌入镜像中，导致\
  \ `MD5` 校验和依赖于它。\n\n*   `CONFIG_IKCONFIG_PROC` 配置选项如果启用，会在内核镜像中引入配置时间戳。此信息在运行时作为\
  \ `/proc/config.gz` 的可用。\n\n*   内核树中 `scripts/` 目录下的工具也会将 `hostname`、`date`、`whoami`\
  \ 和 `domainname` 等程序的输出注入到 `include/linux/compile.h` 等内核头文件中，从而导致 `MD5` 差异。\n\n\
  追踪并屏蔽此类对环境信息的直接和间接引用，以便在两端生成相同的校验和。当然，您不需要担心无关的内核模块。将您的代码修改封装在诸如 `CONFIG_MYPROJECT_SAME_MD5`\
  \ 的更改标记中，并创建一个内核配置开关来开启或关闭一致的 `MD5` 生成。完成后，在裁剪后的 `vmlinux` 镜像上运行 `md5sum`。\n\n###\
  \ 构建脚本\n\n客户通常在开发周期内要求定期的软件构建。每次构建都包含新功能或错误修复。例如，嵌入式 PC 衍生品的交付物可能包括固件组件，如基础内核、可加载设备驱动模块、文件系统工具、引导程序、BIOS\
  \ 和板载微代码。为了自动化构建生成，实现一组通用的构建脚本是一个好主意，这些脚本从版本控制仓库获取源代码快照并生成封装的交付物。\n\n列表 22.1 显示了一个假设使用\
  \ `CVS` 进行版本控制的骨架构建脚本。这是一个显示内核构建的简单脚本。在现实世界中，您可能需要一套复杂的脚本来封装多个软件组件并管理不同的安装场景。\n\n\
  列表 22.1 简单的构建脚本\n\n![image](img/p0646-01.jpg)\n\n![image](img/p0647-01.jpg)\n\n\
  在对生成的交付物满意完成构建验证测试后，启动构建后过程，使用构建标识为版本控制系统的当前状态标记。这本质上是为对应构建的源码快照附加一个名称，有助于将问题追溯到代码版本。当您以后尝试在实验室中重现报告的现场问题时，可以根据相关的构建标识检出源码版本。\n\
  \n### 可移植代码\n\n可移植性直接转化为代码的可重用性和易维护性。这在当今的市场中非常重要，因为那里有各种处理器和无数的外设芯片组。如果您必须为每个处理器编写单独的总线驱动程序，为每个主机控制器编写不同的客户端驱动程序，事情将迅速失控。以下是编写可移植驱动的一些提示：\n\
  \n*   在设计驱动时将可移植性作为设计目标。\n\n*   使用适当的内核 API 会自动注入某种的可移植性。使用 USB 服务的 USB 驱动独立于 USB\
  \ 主机控制器。无论它们使用 `UHCI`、`OHCI` 还是其他内容，它都可以在不同的系统中保持不变地运行。\n\n*   编写 SMP 安全的代码。\n\n\
  *   编写 64 位清晰的代码。例如，即使有有效的类型转换，也不要将指针分配给整数。\n\n*   编写驱动程序使其能够轻松适配到其他类似设备。\n\n* \
  \  在尽可能可用的地方使用体系无关的 API。例如，对 `outb()` 或 `inb()` 的调用无论处理器使用 I/O 映射还是内存映射映射均有效。如果您确实需要使用特定体系的代码（如内联汇编），请将其放在相应的\
  \ `arch/your-arch/` 目录下。\n\n*   将策略推送到头文件和用户空间。在适当的地方使用宏和定义。\n\n\n\n\n## 第 23 章\
  \ 关机\n\n本章内容\n\n- 检查清单\n- 下一步？\n\n在过渡到初始化运行级别 0 之前，让我们总结一下当你获取一个新设备时，如何开启你的 Linux\
  \ 精通之路。这里有一个快速检查清单。\n\n### 检查清单\n\n1. 识别设备的功能和接口技术。根据你的发现，查阅描述相关设备驱动程序子系统的章节。正如你所学的，Linux\
  \ 上的几乎每个驱动程序子系统都包含一个提供驱动服务的内核层，以及一个使应用程序独立于底层的抽象层（重新访问第 18 章中的图 18.3，“嵌入 Linux](#ch18.html_ch18)”）。你的驱动程序需要适应这个框架并与子系统中的其他组件交互。如果你的设备是调制解调器，学习\
  \ `UART`、`tty` 和行规程（line discipline）层如何工作。如果你的芯片是 RTC 或看门狗，学习如何符合相应的内核 API。如果你手里的是鼠标，找出如何将其与输入事件层绑定。如果你的硬件是视频控制器，获取有关帧缓冲区（frame\
  \ buffer）子系统的专业知识。在开始编写音频解码器驱动之前，研究 ALSA 框架。\n\n2. 获取设备的数据表并理解其寄存器编程模型。例如，对于一个 I²C\
  \ DVI 传输器，获取设备的从机地址和初始的编程序列。对于 SPI 触摸控制器，理解如何实现其有限状态机。对于 PCI 以太网卡，查找配置空间语义。对于 USB\
  \ 设备，确定支持的端点并学习如何与它们通信。\n\n3. 在强大的内核源码树中搜索起始驱动程序。研究候选驱动程序并锁定一个合适的。如果你找不到非常匹配的，某些子系统提供了你可以参考的骨架驱动。例如\
  \ `sound/drivers/dummy.c`、`drivers/usb/usb-skeleton.c`、`drivers/net/pci-skeleton.c`\
  \ 和 `drivers/video/skeletonfb.c`。\n\n4. 如果你获得了一个起始驱动程序，通过比较各自的数据表和原理图，研究相关设备与你的硬件之间的精确差异。为了说明，假设你正在一个基于发行版支持的参考硬件的定制板上运行\
  \ Linux。你的发行版包含了在参考硬件上测试过的 USB 控制器驱动程序，但你的定制板是否使用了不同的 USB 收发器？你有一个用于 LCD 控制器的帧缓冲区驱动，但你的板是否使用了不同的显示面板接口（如\
  \ LVDS）？也许原本位于参考板 I²C 总线上的 EEPROM 现在现在位于单线总线上。以太网控制器现在是否连接到不同的 PHY 芯片甚至连接到二层交换机芯片？或者，到\
  \ `UART` 的 RS-232 接口已让位于 RS-485 以获得更好的范围和保真度。\n\n5. 如果你没有匹配的起始驱动程序，或者你决定从零开始编写自己的驱动程序，请投入时间设计并构建驱动程序及其数据结构。\n\
  \n6. 现在你已经拥有了所需的所有信息，准备好软件工具（如 `ctags`、`cscope` 和调试器）和实验室设备（如示波器、万用表和分析仪），并开始编写代码。\n\
  \n### 下一步？\n\nLinux 将长期存在，但一旦有人发现了更聪明的方法，内核内部接口往往会“化石化”。没有任何内核代码是刻入不朽的。正如你所学的，即使是被视为神圣的调度器，自\
  \ 2.4 时代以来经历了两次重写。内核树中出现的新代码行每年达到数百万行。随着内核的演进，新的功能和抽象不断被添加，接口被重新设计，子系统为了提取更好的性能而重构，可重用区域被过滤到通用内核中。\n\
  \n你现在有了坚实的基础，因此可以适应这些变化。为了保持领先地位，请定期刷新你的内核树，频繁浏览内核邮件列表，并尽可能编写代码。Linux 是未来，成为内核大师是有回报的。留在这前线吧！\n\
  \n## 附录 A. Linux 汇编\n\n设备驱动程序有时需要实现一些汇编代码段，因此让我们来看看 Linux 上汇编编程的不同方面。\n\n图 A.1 显示了\
  \ PC 兼容系统上的 Linux 启动序列，它是第 2 章中图 2.1，“窥探内核](#ch02.html_ch02)”的简易版本。图中的固件组件使用不同的汇编语法实现：\n\
  \n- BIOS 通常完全用汇编编写。一些流行的 PC BIOS 使用微软宏汇编器 (`MASM`) 等汇编器进行代码编码。\n\n- Linux 启动加载程序如\
  \ `LILO` 和 `GRUB` 使用 C 和汇编的混合实现。`SYSLINUX` 启动加载程序完全使用 Netwide Assembl 编器 (`NASM`)\
  \ 用汇编编写。\n\n- 实模式 Linux 启动代码使用 GNU 汇编器 (`GAS`)。\n\n- 受保护模式 BIOS 调用通过内联汇编完成，这是 `GCC`\
  \ 支持的一种在 C 语句之间插入汇编代码的结构。\n\n图 A.1 固件组件和汇编语法。\n\n```\n(graphics/a1fig)\n```\n\n\
  在图 A.1 中，前两个组件通常遵循 Intel 语法，而后两个使用 `GAS`。\n\n为了说明这两种语法之间的区别，考虑输出字节到并行端口的代码。在 BIOS\
  \ 或启动加载器使用的 Intel 格式中，你会写道：\n\n```\n(graphics/p0655-01)\n```\n\n然而，如果你想从 Linux 启动代码中执行相同任务，你需要这样做：\n\
  \n```\n(graphics/p0655-02)\n```\n\n你可以看到，与 Intel 格式不同，在 AT&T 语法中，源操作数在前，目标操作数在后。AT&T\
  \ 格式中的寄存器名称前面有 `%`，立即操作数前面有 `$`。AT&T 操作码有后缀，如 `b`（代表字节 byte）和 `w`（代表字 word），用于指定内存操作数的大小，而\
  \ Intel 语法则通过查看操作数而非操作码来实现这一点。在 Intel 语法中移动指针引用时，你必须指定 `byte ptr` 作为操作数前缀。\n\n学习\
  \ AT&T 语法的优势是它可以被 `GAS` 和内联 `GCC` 识别，这些工具不仅运行在 Intel 系统上，还适用于各种处理器架构。\n\n接下来，让我们使用\
  \ `GCC` 内联汇编重写前面的代码段，这是你在受保护模式内核中使用的：\n\n```\n(graphics/p0655-03)\n```\n\n`GCC`\
  \ 支持的 `asm` 构造的一般格式如下：\n\n```\n(graphics/p0656-01)\n```\n\n在操作数部分，`a`、`b`、`c`、`d`、`S`\
  \ 和 `D` 分别代表 `EAX`、`EBX`、`ECX`、`EDX`、`ESI` 和 `EDI` 寄存器。输入约束在执行汇编指令之前从提供的变量复制到指定的寄存器，而输出约束（写为\
  \ `=a`、`b` 等）在执行汇编指令后从指定的寄存器复制到提供的变量。破坏（clobbered）操作约束告诉 `GCC` 假设列出的寄存器不可用。查看 GCC\
  \ Inline Assembly HOWTO ([www.ibiblio.org/g2f/ldp/GCC-Inline-Assembly-HOWTO.html](http://www.ibiblio.org/g2f/ldp/GCC-Inline-Assembly-HOWTO.html))\
  \ 了解更多关于 `GCC` 内联汇编语法的细节。\n\n\n\n\n\n我们示例中使用的唯一约束是针对输入操作数的。这实际上是将 `data` 的值复制到 `AL`\
  \ 寄存器，并将 `port` 的值复制到 `DX` 寄存器。在内联汇编中，寄存器名称前带有 `%%`，因为 `%` 用于引用所提供的操作数。`%i` 表示第\
  \ $i$ 个操作数；因此，如果你想在示例内联汇编段中引用 `data` 和 `port`，可以分别使用 `%0` 和 `%1`。\n\n为了更清晰地了解内联汇编翻译，让我们通过向\
  \ `GCC` 提供 `-s` 命令行参数，查看编译器为上述内联汇编段生成的汇编代码。请每行生成代码旁的注释说明：\n\n![image](img/656tab01.jpg)\n\
  \n你也可以在用户态程序内联汇编。这里有一个使用内联汇编编写的应用，它调用 `syslog()` 系统调用从内核 `printk()` 环形缓冲区中读取最后的\
  \ 128 字节：\n\n![image](img/657tab01.jpg)\n\n正如你在第 4 章“准备工作”中所学到的，`int $128`（或 `int\
  \ 0x80`）指令会产生一个陷入系统调用的软件中断。由于系统调用会导致从用户态到内核态的转换，函数参数不是通过用户栈或内核栈传递，而是通过 CPU 寄存器。系统调用号（`include/asm-your-arch/unistd.h`\
  \ 完整列表）存储在 `EAX` 寄存器中。对于 `syslog()` 系统调用，该数字是 103。如果你查看 `syslog()` 的手册，会发现它接受三个参数：命令、保存返回数据的缓冲区地址以及缓冲区长度。这些参数分别通过寄存器\
  \ `EBX`、`ECX` 和 `EDX` 传递。返回值从 `EAX` 传输到 `retval`。内联汇编调用实际上翻译为：\n\n```\nretval =\
  \ syslog(syslog_command, buffer, bytes_to_read);\n```\n\n如果你编译并运行代码，将看到类似如下从内核环形缓冲区获取的输出：\n\
  \n![image](img/p0658-01.jpg)\n\n`arch/x86/kernel/entry_32.S` 中的内核系统调用陷阱会将所有寄存器内容保存到栈中，因此即使用户空间代码是通过\
  \ CPU 寄存器传递参数，真实的系统调用也能在栈上看到参数。为了确保系统调用例程期望栈上有参数，它们都被标记了 GCC 属性 `asmlinkage`。注意，`asmlinkage`\
  \ 与声明内联汇编的 `asm`（或 `__asm__`）无关。\n\n让我们通过基于 PowerPC 的板的 Linux 引导程序的内联汇编修改示例来结束本节。假设板上的闪存不支持后台操作（BGO）。这意味着引导程序代码在从\
  \ flash 执行时无法写入 flash，例如，当引导程序需要更新位于 flash 其他部分的内核镜像时就需要这样做。一种解决方案是修改引导程序，使得用于写入和擦除\
  \ flash 的引导代码完全从指令缓存（I-cache）执行，而数据段位于数据缓存（D-cache）中。这里用 GCC 内联汇编编写的示例宏完成了将必要的引导程序指令预取到\
  \ I-cache 中的工作。你需要 PowerPC 汇编的实用知识才能理解这段代码段：\n\n![image](img/658tab01.jpg)\n\n###\
  \ 调试\n\n要调试实模式内核，你不能使用内核调试器（kdb）或内核 GNU 调试器（kgdb），我们在第 21 章”中讨论过它们。调试内核汇编段的一种快速方法是将代码转换为\
  \ Intel 风格语法后使用 DOS 调试工具。但 `debug` 是创建于 16 位时代的，因此例如你无法单步执行初始化 `EAX` 寄存器的代码。你可以在互联网上找到可以下载的\
  \ 32 位调试类免费软件。在第 21 章\n\n![image](img/p0663-01)\n\n在列表中，`0xe20` 是调用 `int 15` 之前在\
  \ `AX` 寄存器中指定的函数号。在列表 B.1 中，`DI` 指向零页中存储内存图的偏移量（`boot_params.e820_map`）。代码循环直到收集内存图中的所有元素。元素数量计算并存储在零页的\
  \ `boot_params.e820_entries` 中。当执行成功退出循环时，内存图以 `struct e820` 的形式存在于零页中。\n\n![image](img/p0664-01)\n\
  \n### B.2. 复制内存图 (arch/x86/kernel/e820_32.c)\n\n内核稍后在 `arch/x86/boot/pm.c` 中切换到保护模式。在保护模式下，内核通过在\
  \ `arch/x86/kernel/e820_32.c` 中的 `copy_e820_map()` 保存收集到的内存图。这在列表 B.2 中所示。为了简单起见，列表省略了错误检查并简化了\
  \ `add_memory_region()` 例程。\n\n![image](img/p0664-02)\n\n查看 `arch/x86/mm/init_32.c`\
  \ 以查看列表 B.2 中填充的 `e820` 结构如何在启动过程后期使用。\n\n* * *\n\n#### 旧的 i386 引导代码\n\n从 2.6.23\
  \ 内核开始，i386 引导汇编代码已大部分用 C 重写。在 2.6.23 之前，列表 B.1 中的代码存在于 `arch/i386/boot/setup.S`\
  \ 而不是 `arch/x86/boot/memory.c` 中。此外，切换到保护模式现在发生在 `arch/x86/boot/pm.c` 中，而不是 `setup.S`。\n\
  \n\n\n\n\n再举例如，内核在实模式下利用 BIOS `int 0x10` 服务来获取视频模式参数（`arch/x86/boot/video*.c`）。VESA\
  \ 帧缓冲区驱动（`drivers/video/vesafb.c`）依赖这些参数在启动时开启图形模式。\n\n作为一个练习，请使用类似的方法从实模式内核获取 BIOS\
  \ 开机自检（POST）错误代码（通过 `int 0x15`，函数 `0x2100`），并在正常运行期间通过 `/proc` 文件系统显示它们。\n\n引导加载程序在实模式下也使用\
  \ BIOS 服务。如果你浏览 LILO、`GRUB` 或 `SYSLINUX` 的源码，你会看到大量大量的 `int 0x13` 调用，用于从启动设备读取内核镜像。\n\
  \n### 保护模式调用\n\n为了查看内核如何进行保护模式下的 BIOS 调用，让我们来看看 APM 的实现。\n\nAPM 是一种 BIOS 接口规范，现在已经几乎过时了（参见\
  \ `第 4 章` 中的 `电源管理`、`准备工作`）。电源管理策略定义在 BIOS 中，一个名为 `kapmd` 的内核线程每秒轮询一次以确定行动方案。轮询是通过保护模式\
  \ BIOS 调用完成的。为了实现这一点，`kapmd` 需要知道保护模式入口段地址和偏移量。这些地址是在启动期间使用 `int 0x15`，函数 `0x5303`\
  \ BIOS 服务从实模式内核获取。\n\n实际的保护模式 BIOS 调用是使用 `apm_bios_call_simple_asm()` 中的内联汇编调用的，它定义在\
  \ `include/asm-x86/mach-default/apm.h` 中：\n\n![image](img/p0666-01.jpg)\n\n`APM_DO_ZERO_SEGS`\
  \ 将段寄存器清零。`apm_bios_entry` 包含保护模式入口地址。输入约束 `\"a\"`(`func`) 在调用之前将所需的 BIOS 函数号复制到\
  \ `EAX` 寄存器中。例如，函数号 `APM_FUNC_GET_EVENT` (`0x530b`) 从 BIOS 触发一个 APM 事件，而函数号 `APM_FUNC_IDLE`\
  \ (`0x5305`) 通知 BIOS 处理器处于空闲。结果由 BIOS 通过寄存器 `EAX`、`EBX`、`ECX` 和 `EDX` 返回。根据之前的操作数约束，这些结果分别传递给变量\
  \ `*eax`、`error`、`cx` 和 `dx` 中的调用者。在汇编体中，寄存器在 BIOS 调用之前保存到内核栈上，并在之后恢复，以防止 BIOS 踩写它们。\n\
  \n### BIOS 和遗留驱动\n\nBIOS 为某些 Linux 驱动程序提供了某种程度的硬件抽象。让我们以 PC 串口驱动（在 `第 6 章`、`串口驱动`\
  \ 中讨论）为例。BIOS 探测 Super I/O Chip 组并为相应的串口（及红外端口）分配 I/O 基地址和中断。串口驱动需要被告知 BIOS 分配的资源，这可以通过头文件中的硬编码值（`include/asm-x86/serial.h`）或通过用户空间命令来实现。作为一个练习，请深入研究你的\
  \ Super I/O Chip 组的数据表，并在串口驱动中添加支持，以探测 BIOS 设置的资源值。\n\n再举例如，即使你在内核中禁用了 USB 支持，也可以在\
  \ BIOS 的帮助下在 PC 系统上使用 USB 键盘和鼠标。BIOS 在南桥中开启仿真模式，将 USB 键盘和鼠标输入从 USB 控制器路由到键盘控制器。这欺骗了操作系统，使其认为你正在使用传统的键盘或鼠标。\n\
  \n内核曾依赖 BIOS 遍历 PCI 线并配置检测到的设备。这现在已经过时了，但可以查看 `arch/x86/pci/pcbios.c` 查看如何从内核访问\
  \ PCI BIOS。`第 10 章`、`外围部件连接`讨论了 PCI 驱动。\n\n### 附录 C. Seq 文件\n\nprocfs 提供的监控和趋势数据点可能在症状原因看起来模糊时帮助诊断设备驱动问题。但有时，特别是当数据量很大时，相应的\
  \ procfs `read()` 实现会变得复杂。seq 文件接口是一种内核辅助机制，旨在简化此类实现。seq 文件让 procfs 操作变得更加简洁且易于维护。\n\
  \n让我们逐步向 procfs `read()` 例程中引入复杂性，并看看 seq 文件接口如何将繁琐的例程转换为优雅的程序。我们还将更新少数尚未利用 seq\
  \ 文件的 2.6 版本驱动程序之一。\n\n### Seq 文件的优势\n\n让我们通过一个示例来发现 seq 文件提供的优势。与许多设备驱动程序一样，假设你有一个数据结构链表，且列表中的每个节点都包含一个字符串字段（称为\
  \ `info`）。`列表 C.1` 中的示例代码使用一个名为 `/proc/readme` 的 procfs 文件来将这些字符串导出到用户空间。当用户读取此文件时，就会调用\
  \ procfs `read()` 方法 `readme_proc()`。该例程遍历链表并将 `info` 字段追加到缓冲区中。\n\n接下来的图示了 `seq`\
  \ 文件的处理过程：\n\n![image](img/p0670-01.jpg)\n![image](img/p0671-01.jpg)\n![image](img/p0671-02.jpg)\n\
  ![image](img/p0672-01.jpg)\n![image](img/p0672-02.jpg)\n\n\n\n\n\n打印 `start`、`offset`、`count`\
  \ 和 `page` 的值，并查看每次调用期间生成的输出，以更好地理解操作序列。\n\n通过这种破解方法（hack），你的 procfs 文件可以向用户空间提供大量数据，而没有大小限制：\n\
  \n![image](img/p0673-01.jpg)\n\n## 列表 C.2. 大规模 Procfs 读取\n\n![image](img/p0673-02.jpg)\n\
  \n![image](img/p0674-01.jpg)\n\n当你面临需要像 列表 C.2 那样笨拙地实现大型 procfs 文件的前景时，seq file\
  \ 接口派上用场了。正如名称所示，seq file 接口将 procfs 文件的内容视为对象的序列。它提供了编程接口来遍历这个对象序列。你的代码必须提供 seq\
  \ 接口所预期的以下迭代器方法：\n\n1. `start()`，由 seq 接口首先调用。它初始化迭代器序列中的位置，并返回感兴趣的第一个迭代器对象。\n2.\
  \ `next()`，递增迭代器位置并返回指向下一个迭代器的指针。此函数不感知迭代器的内部结构，将其视为一个不透明对象。\n3. `show()`，解释传递给它的迭代器，并生成在用户读取相应的\
  \ procfs 文件时显示的输出字符串。该方法利用了如 `seq_printf()`、`seq_putc()` 和 `seq_puts()` 等辅助函数来格式化输出。\n\
  4. `stop()`，在结束时调用用于清理。\n\nseq file 接口会自动调用这些迭代器方法，以响应用户对相关 procfs 文件的操作产生输出。你不再需要担心页大小的缓冲区和数据结束的信号。让我们利用\
  \ seq files 来重写 列表 C.2。这在 列表 C.3 中通过将链表视为视为节点序列来完成的。基本的迭代器对象是节点，每次调用 `next()` 方法都会返回列表中的下一个节点。\n\
  \n## 列表 C.3 使用 Seq Files 简化 列表 C.2\n\n![image](img/p0675-01.jpg)\n\n![image](img/p0676-01.jpg)\n\
  \n![image](img/p0676-02.jpg)\n\n![image](img/p0677-01.jpg)\n\n### 更新 NVRAM 驱动程序\n\
  \nseq file 接口自 2.4 内核后期以来一直存在，但随着 2.6 变得变得广泛。让我们更新 NVRAM 驱动程序（`drivers/char/nvram.c`），它是少数还没有切换到使用\
  \ seq files 的驱动之一（按照惯例，`+` 和 `-` 显示与源码的差异）。为了做到，你可以使用仅使用 `show()` 迭代器方法的简单版 seq\
  \ files。使用 `single_open()` 来注册此方法。列表 C.4 包含了更新后的 NVRAM 驱动程序。由于 seq 接口在调用迭代器方法之间不会睡眠，你可以在方法内部持有锁。\n\
