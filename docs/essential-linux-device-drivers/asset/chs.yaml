  \n![image](img/p0150-01.jpg)\n\n`led_init()` 与列表 5.1 中开发的 `cmos_init()` 类似，但有几点不同：\n\
  \n1. 正如你在第 4 章中所见，新的设备模型区分了驱动程序和设备。`led_init()` 通过调用 `parport_register_driver()`\
  \ 向 `parport` 注册 LED 驱动程序。当内核在 `led_attach()` 期间 LED 板时，它通过调用 `parport_register_device()`\
  \ 注册设备。\n\n2. `led_init()` 创建了设备节点 `/dev/led`，你可以用它来控制单个 LED 的状态。\n\n编译并将驱动程序模块插入内核：\n\
  \n![image](img/p0150-02.jpg)\n\n要选择性地驱动某些并行端口引脚并点亮相应的 LED，向 `/dev/led` 输出适当的值：\n\
  \n```bash\necho 1 > /dev/led\n```\n\n由于 `1` 的 ASCII 码是 `31`（或 `00110001`），第一个、第五和第六个\
  \ LED 应该亮起。\n\n前面的命令触发了 `led_write()` 的调用。该驱动程序方法首先通过 `copy_from_user()` 将用户内存（在本例中为值\
  \ 31）拷贝到内核缓冲区。然后它占用并行端口、写入数据并释放端口，所有操作均使用 `parport` 接口。\n\n`sysfs` 比 `/dev` 更适合控制设备状态，因此将\
  \ LED 控制交给 `sysfs` 文件是一个好主意。列表 5.7 包含了实现此点的驱动实现。列表中的 `sysfs` 操作代码也可以作为其他驱动程序实现设备控制的模板。\n\
  \n列表 5.7. 使用 Sysfs 控制并行 LED 板\n\n![image](img/151tab01.jpg)\n\n![image](img/151tab01a.jpg)\n\
  \n![image](img/152tab01.jpg)\n\n![image](img/152tab01a.jpg)\n\n![image](img/153tab01.jpg)\n\
  \n![image](img/153tab01a.jpg)\n\n![image](img/154tab01.gif)\n\n![image](img/154tab01a.gif)\n\
  \n![image](img/155tab01.jpg)\n\n![image](img/155tab01a.jpg)\n\n列表 5.7 中 `glow_show_led()`\
  \ 的宏定义使用了内核源文件中常用的技术，用于紧凑地定义多个相似的函数。该定义生成了附加到八个 `/sys` 文件的 `read()` 和 `write()`\
  \ 方法（在 `sysfs` 术语中称为 `show()` 和 `store()`），每个文件对应板上的一个 LED。因此，`glow_show_led(0)`\
  \ 将 `glow_led_0()` 和 `show_led_0()` 附加到对应第一个 LED 的 `/sys` 文件。这些函数分别负责点亮/熄灭第一个 LED\
  \ 以及读取其状态。`##` 将值连接到字符串上，因此当编译器处理 `glow_show_led(0)` 语句时，`glow_led_##number` 翻译为\
  \ `glow_led_0()`。\n\n此感知 `sysfs` 的驱动程序版本使用 `kobject` 来表示一个“控制”抽象，它模拟了一个控制 LED 的软件旋钮。每个\
  \ `kobject` 都由 `sysfs` 中的目录名称表示，因此列表 5.7 中的 `kobject_register()` 导致了 `/sys/class/pardevice/led/control/`\
  \ 目录的创建。\n\n`ktype` 描述一个 `kobject`。“控制” `kobject` 由...描述\n\n\n\n\n一些常用的内核设施并不与任何物理硬件连接，而是以字符设备（char\
  \ devices）的形式优雅地实现。空汇点（null sink）、永久零源和内核随机数生成器被视为虚拟设备，并使用伪字符设备驱动进行访问。\n\n`/dev/null`\
  \ 字符设备会丢弃你不想在屏幕上显示的数据。因此，如果你需要从并发版本控制系统（CVS）仓库中检出源文件，而又不想让文件名刷满屏幕，可以执行以下操作：\n\n\
  ```bash\ncvs co kernel > /dev/null\n```\n\n这会将命令输出重定向到属于 `/dev/null` 驱动的写入口。该驱动的\
  \ `read()` 和 `write()` 方法简单地返回成功，分别忽略输入和输出缓冲区的内容。\n\n如果你想用零填充一个镜像文件，可以调用 `/dev/zero`\
  \ 来提供服务：\n\n```bash\ndd if=/dev/zero of=file.img bs=1024 count=1024\n```\n\n这从属于\
  \ `/dev/zero` 驱动的 `read()` 方法获取了一个全零流。该驱动没有 `write()` 方法。\n\n内核内置了随机数生成器。为了方便需要随机序列的内核用户，随机数生成器导出了如\
  \ `get_random_bytes()` 等 API。对于用户态程序，它导出了两个字符接口：`/dev/random` 和 `/dev/urandom`。与\
  \ `/dev/urandom` 相比，从 `/dev/random` 读取的质量更高。当用户程序从 `/dev/random` 读取时，它获得的是强（或真）随机数，而从\
  \ `/dev/urandom` 读取则产生伪随机数。`/dev/random` 驱动不使用公式生成强随机数。相反，它收集“环境噪声”（中断间隔、按键点击等）来维护一个无序储备池（称为熵池），并为随机流提供种子。要查看内核输入子系统在检测到键盘按键或鼠标移动时（参见第\
  \ 7 章）如何贡献熵池，请查看定义在 `drivers/input/input.c` 中的 `input_event()`：\n\n![image](img/p0158-01.jpg)\n\
  \n要查看核心中断处理层如何在两次中断期间向熵池贡献内容，请查看定义在 `kernel/irq/handle.c` 中的 `handle_IRQ_event()`：\n\
  \n![image](img/p0159-01.jpg)\n\n强随机数的生成取决于熵池的大小：\n\n![image](img/p0159-02.jpg)\n\
  \n输出在几行后停止，表示熵池已耗尽。要补充熵池并重启随机流，可以在切换到一个未使用的终端后多次击击，或者在屏幕上移动鼠标。\n\n然而，对 `/dev/urandom`\
  \ 进行转储（dump）会产生一个永不停止的连续伪随机流。\n\n`/dev/mem` 和 `/dev/kmem` 是经典的伪字符设备，是让你窥视系统内存的工具。这些字符节点分别导出了连接到物理内存和内核虚拟内存的原始接口。为了操作系统内存，你可以\
  \ `mmap()` 这些节点并对返回的区域进行操作。作为一个练习，尝试通过访问 `/dev/mem` 来更改系统的主机名。\n\n本节讨论的所有字符设备（null、zero、random、urandom、mem\
  \ 和 kmem）具有不同的次设备号（minor numbers），但具有相同的静态分配主设备号（major number）1。查看 `drivers/char/mem.c`\
  \ 和 `drivers/char/random.c` 了解它们的实现。另外两个伪驱动也属于同一个主设备号族：模拟始终满的设备的 `/dev/full`，以及窥视系统\
  \ I/O 端口的 `/dev/port`。我们在第 19 章 中使用了后者。\n\n### 杂项驱动 (Misc Drivers)\n\n杂项驱动是具有某些共同特征的简单字符驱动。内核将这些共同点抽象为一个\
  \ API（在 `drivers/char/misc.c` 中实现），这简化了这些驱动的初始化方式。所有杂项设备都被分配主设备号 10，但每个设备都可以选择一个次设备号。因此，如果一个字符驱动需要驱动多个设备（如之前讨论的\
  \ CMOS 示例），它可能不是杂项驱动的候选者。\n\n考虑字符驱动执行的初始化步骤序列：\n\n*   通过 `alloc_chrdev_region()`\
  \ 等函数分配主/次设备号\n*   使用 `device_create()` 创建 `/dev` 和 `/sys` 节点\n*   使用 `cdev_init()`\
  \ 和 `cdev_add()` 将自己注册为字符驱动\n\n杂项驱动通过调用一次 `misc_register()` 即可完成所有这些：\n\n![image](img/p0160-01.jpg)\n\
  \n在前面的示例中，`MYDRV_MINOR` 是你想要静态分配给杂项驱动的次设备号。你也可以通过在 `mydrv_dev` 结构体中指定 `MISC_DYNAMIC_MINOR`\
  \ 而不是 `MYDRV_MINOR` 来请求动态分配次设备号。\n\n每个杂项驱动都会自动出现在 `/sys/class/misc/` 下，无需驱动编写者投入任何显式努力。由于杂项驱动是字符驱动，早些关于字符驱动入口的讨论也适用于杂项驱动。现在我们来看一个杂项驱动的示例。\n\
  \n#### 设备示例：看门狗定时器 (Watchdog Timer)\n\n看门狗的功能是将无响应的系统恢复到运行状态。它通过定期检查系统脉冲并发出重置^([[5]](#footnote.html_ch05))\
  \ 来实现。\n\n（注：此处原文处存在脚注标记，翻译时保留格式格式，但由于用户未提供脚注具体内容，此处保留占位或根据上下文理解）\n\n*注：由于提供的原文文本中包含处脚注标记如\
  \ `[[5]]` 和 `[[6]]`，但未提供对应的脚注列表，译文保留了这些标记位置。*\n\n\n\n\n![image](img/p0164-01.jpg)\n\
  \n列表 5.10。一个看门狗用户\n\n![image](img/p0164-02.jpg)\n\n* * *\n\n### 外部看门狗\n\n为了确保系统在处理器故障时也能尝试恢复，某些监管机构规定使用外部看门狗芯片，即使主处理器具有像我们示例那样复杂的内置看门狗模块。由于此项要求，嵌入式设备有时会使用廉价且无装饰的看门狗芯片（例如\
  \ Maxim 的 `MAX6730`），它基于简单的硬件布线逻辑而非寄存器接口。如果在固定的重位超时时间内没有在输入引脚检测到电压脉冲，看门狗就会触发重位引脚。重位引脚连接到处理器的重位逻辑，输入引脚连接到处理器的\
  \ GPIO 口。软件为了防止重位，需要做的就是在芯片的重位超时时间内定期向看门狗的输入引脚发送脉冲。如果你为此类设备编写驱动程序，`ioctl()` 方法是无关的。驱动程序的\
  \ `write()` 方法会在应用程序软件写入关联设备节点时向看门狗的输入引脚发送脉冲。为了制造和现场诊断，看门狗的连接可能被设计为通过抖动处理器的 GPIO\
  \ 引脚来禁用。\n\n此类芯片通常允许较大的初始超时时间以考虑启动时间，随后是较短的重位超时。\n\n* * *\n\n对于不支持硬件看门狗模块的平台，内核实现了一个软件看门狗，也称为\
  \ softdog。softdog 驱动程序 `drivers/char/watchdog/softdog.c` 是一个伪杂项驱动，因为它并不在真实的硬件上运行。softdog\
  \ 驱动必须执行两项看门狗驱动不需要执行的任务，而后者通过硬件完成这些任务：\n\n*   实现超时机制\n*   如果系统不健康，则启动软重启\n\n这是通过在每次向\
  \ softdog 写入数据时延迟定时器处理程序的执行来实现的。如果在超时时间内没有对 softdog 进行写入，定时器处理程序就会触发并重启系统。\n\n2.6\
  \ 内核中的相关支持是对软锁死（soft lockups）的检测，即调度 10 秒或更长时间未发生的情况。内核线程 `watchdog/N`（其中 `N` 是\
  \ CPU 编号）每秒都会碰一次每个 CPU 时间戳。如果该线程超过 10 秒没有碰时间戳，则系统被认为已锁死。软锁死检测（在 `kernel/softlockup.c`\
  \ 中实现）将帮助我们在第 21 章中“Kdump”部分以及“调试设备驱动”中调试内核崩溃。\n\n内核中还有几个杂项驱动程序。Qtronix 红外键盘驱动程序\
  \ `drivers/char/qtronix.c` 是另一个具有杂项形式的字符驱动程序示例。在 `drivers/char/` 目录下对 `misc_register()`\
  \ 执行 `grep` 搜索，可以找到内核中存在的其他杂项设备驱动。\n\n### 字符设备注意事项\n\n驱动程序方法（以及用户应用程序发出的相关系统调用）可能会失败或部分成功。你的应用程序必须考虑到这一点，以避免不必要的意外。让我们来看一些常见的陷阱：\n\
  \n*   `open()` 调用可能由于多种原因失败。某些字符驱动一次只支持一个用户，因此如果应用程序尝试打开已在使用的设备，它们将返回 `-EBUSY` 失败。如果打印机缺纸，当你调用设备\
  \ `open()` 时，驱动将返回 `-ENOSPC` 失败。\n*   成功的 `read()` 或 `write()` 可以返回 1 字节到请求字节数之间的任何值，因此你的应用程序需要足够的逻辑来处理这种情况。\n\
  *   `select()` 调用即使只有一个字节的数据准备好读或写也会返回成功。\n*   某些字符设备（如鼠标和触摸屏）仅限输入，因此它们的驱动不支持写入方法族（`write()`/`aio_write()`/`fsync()`）。其他设备（如打印机）仅限输出，它们的驱动不支持读取方法族（`read()`/`aio_read()`）。此外，许多字符驱动方法是可选的，因此所有方法都会出现在所有驱动中。当方法不存在时，相应的系统调用将失败。\n\
  \n### 查看源码\n\n字符驱动并不完全存在于 `drivers/char/` 目录。以下是一些“超级”字符驱动的示例，它们值得特殊的对待和独立的目录：\n\
  \n*   串口驱动是管理计算机串口的字符驱动。然而，它们远比简单的字符驱动复杂，并独立存在于 `drivers/serial/` 目录。下一章将讨论串口驱动。\n\
  *   输入驱动负责键盘、鼠标和摇杆等设备。它们位于单独的源码目录 `drivers/input/` 中，因此有专门独立的章节，第 7 章。\n*   帧缓冲区（`/dev/fb/*`）提供了视频内存的访问，就像\
  \ `/dev/mem` 导出系统内存访问一样。第 12 章“视频驱动”查看帧缓冲区驱动。\n*   某些设备类支持少数拥有字符接口的硬件。例如，SCSI 设备是块设备，但\
  \ SCSI 磁带是字符设备。\n*   某些子系统导出额外的字符接口，向用户空间呈现原始设备模型。MTD 子系统通常用于在不同类型的闪存上模拟磁盘。这是通过\
  \ `mtd.c` 完成的，该文件在第 17 章“内存技术设备”中讨论过。\n*   某些内核层为通过这些接口实现用户空间设备提供了钩。一个示例是用于扫描仪和光驱的通用\
  \ SCSI 驱动 `drivers/scsi/sg.c`。另一个示例是 I²C 设备接口 `i2c-dev`。此类接口在第 19 章中解释。\n\n同时，在\
  \ `drivers/` 中对 `register_chrdev` 执行 `grep -r`，可以了解字符驱动在内核中的流行程度。\n\n表 5.3](#ch05.html_ch05tab3)\
  \ 汇总了本章使用的主要数据结构及其在源码树中的定义位置。表 5.4](#ch05.html_ch05tab4) 列出了本章使用的主要内核接口及其定义位置。\n\
  \n\n\n\n\n*   与触摸式控制器、智能卡、蓝牙芯片或红外适配器等设备接口，这些设备使用串行传输\n*   使用 USB 转串口转换器仿真串口\n* \
  \  通过 RS-485 链路通信，它是 RS-232 的多点变体，具有更远的传输范围和更好的抗干扰能力\n\n在本章中，让我们来看看内核是如何构建串口子系统的。我们将通过\
  \ Linux 手机的示例来学习低层 UART 驱动程序，并通过串口触摸控制器的示例来发现高层行规程（line disciplines）的实现细节。\n\nPC\
  \ 上通常使用的 UART 是美国国家半导体（National Semiconductor）的 `16550`，或其他厂商的兼容芯片，因此你会在代码和文档中找到对“16550\
  \ 型 UART”的引用。`8250` 芯片是 `16550` 的前身，因此 PC UART 的 Linux 驱动命名为 `8250.c`。\n\n### ###\
  \ 分层架构\n\n如你所看到的，串口子系统的用户非常多且多样。这促使内核开发者使用以下构建块构建分层的串口架构：\n\n1. 低层驱动程序，关注 UART 或其他底层串口硬件的内部实现。\n\
  2. tty 驱动层，与低层驱动程序接口。tty 驱动将高层与硬件的复杂性性隔离开来。\n3. 行规程（Line disciplines），负责“处理”与 tty\
  \ 驱动交换的数据。行规程塑造了串口层的行为，并帮助复用低层以支持不同的技术。\n\n为了帮助自定义驱动程序的实现，串口子系统还提供了核心 API，将这些层中的共性提取出来。\n\
  \n图 6.2 显示了层与层之间的连接。`N_TTY`、`N_IRDA` 和 `N_PPP` 是即用的行规程，分别将串口子系统建模为支持终端、红外和拨号上网网络。图\
  \ 6.3 将串口子系统映射到内核源文件。\n\n图 6.2. 串口子系统中层之间的连接。\n\n![image](img/06fig02.gif)\n\n图\
  \ 6.3. 串口层映射到内核源码。\n\n![image](img/06fig03.gif)\n\n为了说明分层串口架构的优势，让我们来看一个例子。假设你正在使用一个\
  \ USB 转串口适配器在没有串口的笔记本电脑上获取串口能力。一种可能的场景是你正通过主机笔记本电脑使用 `kgdb` 对目标嵌入式设备进行内核调试（`kgdb`\
  \ 在第 21 章“调试设备驱动程序”中讨论过），如图图 6.4 所示。\n\n图 6.4. 使用 USB 转串口转换器。\n\n![image](img/06fig04.gif)\n\
  \n如图 6.3 所示，你首先需要在主机笔记本电脑上一个一个 USB 物理层驱动（UART 驱动的 USB 对应程序）。它存在于内核 USB 子系统 `drivers/usb/`\
  \ 中。接下来，你需要一个 tty 驱动来位于 USB 物理层之上。`usbserial` 驱动（`drivers/usb/serial/usb-serial.c`）是实现通过\
  \ USB 转串口转换器实现通用 tty 的核心层。该驱动配合转换器驱动注册的特定设备 tty 方法（例如如果你使用 Keyspan 适配器，则为 `drivers/usb/serial/keyspan.c`），构成了\
  \ tty 层。最后，也是同样重要的一点，你需要 `N_TTY` 行规程来进行终端 I/O 处理。\n\ntty 驱动将行规程和高层与 USB 的内部实现隔离开来。事实上，行规程仍然认为它正运行在传统的\
  \ UART 上。这是因为 tty 驱动从 USB 请求块或 `URBs`（在第 11 章“通用串行总”中讨论过）拉取数据，并将其封装为 `N_TTY` 行规程预期的格式。这种分层架构使得实现变得简单——从行规程向上所有的块都可以在不改变的情况下被复用。\n\
  \n上一个示例使用了特定技术的 tty 驱动和通用行规程。反向用法也很常见。在第 16 章“无线 Linux”中讨论的红外栈使用了通用 tty 驱动和名为 `N_IRDA`\
  \ 的特定技术行规程。\n\n正如你可能在图 6.2 和图 6.3 中注意到的，尽管 UART 驱动是字符驱动，但不像我们在上一章看到的普通字符驱动那样直接向内核系统调用暴露接口。相反，UART\
  \ 驱动（如下一章讨论的键盘驱动）服务于另一个内核层——tty 层。I/O 系统调用从顶层行规程开始之旅，最终通过 tty 层向下传递到 UART 驱动。\n\n\
  在本章的剩余部分，让我们仔细查看串口层的不同驱动组件。我们从串口栈底部的低层 UART 驱动开始，移动到中层 tty 驱动，然后进入顶层行规程。\n\n###\
  \ ### UART 驱动\n\nUART 驱动围绕三个关键数据结构展开。这三个结构都定义在 `include/linux/serial_core.h` 中：\n\
  \n1. 每个 UART 的驱动结构 `struct uart_driver`：\n   ![image](img/176tab01.jpg)\n   对每个字段的注释说明\
  \ `owner` 字段与上一章讨论的 `file_operations` 结构相同处。\n\n2. `struct uart_port`。每个 UART 拥有一个该结构的实例：\n\
  \   ![image](img/177tab01.jpg)\n\n3. `struct uart_ops`。这是 UART 驱动必须的支持入口点集，描述了在物理硬件上可以的操作：\n\
  \   ![image](img/177tab02.jpg)\n\nUART 驱动与内核关联需要两个重要步骤：\n\n1. 通过 `uart_register_driver(struct\
  \ uart_driver *)` 向内核注册。\n2. 调用 `uart_add_one_port(struct uart_driver *, struct\
  \ uart_port *)` 注册它支持的每个端口。如果你的串口硬件是热插拔的，端口将从探测设备的入口点注册。查看第 10 章“外围组件连接”中的列表 10.4\
  \ 驱动，这是一个串口设备热插拔的示例。注意某些驱动使用封装注册函数 `serial250_register_port(struct uart_port *)`，它内部调用了\
  \ `uart_add_one_port()`。\n\n这些数据结构和注册函数构成了所有 UART 驱动的共同特征。\n\n#### 设备示例：手机\n\n考虑一种基于嵌入式系统级芯片（SoC）的\
  \ Linux 手机。该 SoC 有两个内置的 UART，但如图 6.5 所示，它们都被占用了：一个用于与手机解调器通信，另一个用于连接蓝牙芯片。由于没有空闲的\
  \ UART 用于调试，手机使用了两个 USB 转串口芯片，一个为 PC 主机提供调试终端，另一个用于获取空闲端口。正如你在本章之前看到的，USB 转串口转换器让你通过\
  \ USB 连接串口设备。我们将在第 11 章中详细讨论 USB 转串口转换器。\n\n\n\n\n\n两个 USB 转串口转换器芯片的串口侧通过复杂的可编程逻辑设备或\
  \ `CPLD` 连接到 SoC（参见第 18 章中的“CPLD/FPGA”节和“嵌入 Linux”）。CPLD 通过提供一个包含三个寄存器的接口（三-寄存器接口）来访问每个\
  \ USB 转串口转换器，从而创建两个虚拟 UART（或 `USB_UART`s），如表 6.1 所示：一个状态寄存器、一个读数据寄存器和一个写数据寄存器。要向\
  \ `USB_UART` 写入字符，循环检查状态寄存器中的某位，该位在芯片内部先进先出（`FIFO`）存储器有空间时会清零，然后将字节写入写数据寄存器。要读取字符，则等待状态寄存器中的指定位显示接收\
  \ `FIFO` 中存在数据，然后从从读数据寄存器中读取。\n\n### 表 6.1. `USB_UART` 寄存器布局\n\n![image](img/180tab01.jpg)\n\
  \n在 PC 端，使用相应的 Linux usbserial 驱动（例如，如果你在手机上 `FT232AM` 芯片，则使用 `drivers/usb/serial/ftdi_sio.c`）来创建和管理对应\
  \ USB 串口的 `/dev/ttyUSBX` 设备节点。你可以在这些设备节点之一上运行 `minicom` 等终端模拟器，从手机获取控制台或调试终端。在手机端，我们必须为\
  \ `USB_UART` 实现一个 UART 驱动。该驱动程序创建并管理 `/dev/ttyUUX` 节点，负责链路中设备侧的通信。\n\n***\n\n图 6.5\
  \ 所示的手机可以作为蓝牙设备的智能网关——连接到 GSM 网络，从而连接到互联网。例如，手机可以将数据从你的蓝牙血压计传输到互联网上的医疗保健提供者的服务器。或者，当它在与你的蓝牙心率仪通信时检测到问题时，它可以提醒医生。第\
  \ 13 章中“音频驱动”使用的蓝牙 MP3 播放器以及第 16 章中使用的蓝牙药盒器也是使用 Linux 手机联网的设备示例。\n\n***\n\n列表 6.1\
  \ 实现了 `USB_UART` 驱动。它是以平台驱动（platform driver）的形式实现的。平台（platform）是一种伪总，通常用于将集成到 SoC\
  \ 中的轻量级设备与 Linux 设备模型绑定。一个平台由以下部分组成：\n\n1.  平台设备（platform device）。特定体系设置代码使用 `platform_device_register()`\
  \ 或其更简单的版本 `platform_device_register_simple()` 添加平台设备。你也可以使用 `platform_add_devices()`\
  \ 一次注册多个平台设备。在 `include/linux/platform_device.h` 中定义的 `platform_device` 结构代表一个平台设备：\n\
  \n    ![image](img/p0180-01.jpg)\n\n2.  平台驱动（platform driver）。平台驱动使用 `platform_driver_register()`\
  \ 将自己注册到平台。同样在 `include/linux/platform_device.h` 中定义的 `platform_driver` 结构代表一个平台驱动：\n\
  \n    ![image](img/p0181-01.jpg)\n\n访问 `Documentation/driver-model/platform.txt`\
  \ 了解更多关于平台设备和驱动的信息。为了简单起见，我们的示例驱动同时注册了平台设备和平台驱动。\n\n在初始化期间，`USB_UART` 驱动首先使用 `uart_register_driver()`\
  \ 向串口核心注册自己。完成后，你会在 `/proc/tty/drivers` 中看到以 `usb_uart` 开头的新行。接下来，驱动使用 `platform_device_register_simple()`\
  \ 注册两个平台设备（每个 `USB_UART` 一个）。如前，平台设备的注册通常在启动时的板级设置期间完成。随后，驱动使用 `platform_driver_register()`\
  \ 注册平台驱动入口点（`probe()`、`remove()`、`suspend()` 和 `resume()`）。`USB_UART` 平台驱动关联到上述两个平台设备，并具有匹配的名称（`usb_uart`）。完成此步骤后，你会在\
  \ sysfs 中看到两个新目录，每个对应一个 `USB_UART` 端口：`/sys/devices/platform/usb_uart.0/` 和 `/sys/devices/platform/usb_uart.1/`。\n\
  \n由于 Linux 设备层现在检测到与注册的 `USB_UART` 设备名称匹配的平台驱动，它会为每个 `USB_UART` 调用一次平台驱动的 `probe()`\
  \ 入口点（`usb_uart_probe()`）。probe 入口点使用 `uart_add_one_port()` 添加关联的 `USB_UART` 端口。这会触发\
  \ `config_port()` 入口点（之前讨论过的 `uart_ops` 结构的一部分），用于占用并映射 `USB_UART` 寄存器空间。如果两个 `USB_UART`\
  \ 端口都成功添加，串口核心将发出以下内核消息：\n\n![image](img/182.jpg)\n\n然而，占用中断（IRQ）将延迟到应用程序打开 `USB_UART`。表\
  \ 6.2 追踪了驱动申请内存和释放中断的代码。\n\n### 表 6.2. 申请内存和释放中断\n\n![image](img/182.jpg)\n\n在发送路径中，驱动从与\
  \ UART 关联的缓冲区收集数据。从 UART 的 `start_tx()` 可以看出数据存在于 `port->info->xmit[port->info->tail]`。\n\
  \n在接收路径中，驱动使用 `tty_insert_char()` 和 `tty_buffer_push()` 将从 `USB_UART` 收集的数据。。在接收中断\
  \ `usb_uart_rxint()` 中完成。\n\n列表 6.1 手机 `USB_UART` 驱动\n\n![image](img/183tab01.jpg)\n\
  \n![image](img/183tab01.jpg)\n\n![image](img/184tab01.jpg)\n\n![image](img/184tab01.jpg)\n\
